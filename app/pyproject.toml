[project]
name = "interview-practice"
version = "0.1.0"
description = "Interactive terminal (TUI) app to practice interview MCQs from the learner's library"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.60",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "black", "textual-dev"]

[project.scripts]
interview-practice = "interview_practice.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
