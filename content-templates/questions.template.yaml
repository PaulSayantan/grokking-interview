# Copy this file to topics/<domain>/<topic-slug>/questions.yaml and fill it in.
# Contract: docs/content-schema.md   |   answer is a 0-based index into options.

topic: "<Topic Name>"          # matches the H1 in concepts.md
domain: <domain-slug>          # e.g. docker
topic_slug: <topic-slug>       # folder name, kebab-case
version: 1

questions:
  - id: <topic-slug>-001
    difficulty: beginner        # beginner | intermediate | advanced
    tags: [<tag1>, <tag2>]
    question: |
      <The question prompt.>
    options:
      - "<option A>"
      - "<option B>"
      - "<option C>"
      - "<option D>"
    answer: 0                   # 0-based index of the correct option
    explanation: |
      <Why the correct answer is correct; teach the concept.>
    ref: "concepts.md#<anchor>" # optional deep-link into concepts.md

  - id: <topic-slug>-002
    difficulty: intermediate
    tags: [<tag1>]
    question: |
      <...>
    options:
      - "<option A>"
      - "<option B>"
      - "<option C>"
      - "<option D>"
    answer: 2
    explanation: |
      <...>
    ref: "concepts.md#<anchor>"
