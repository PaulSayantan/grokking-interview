topic: "Observability: Logging, Metrics & Tracing"
domain: grpc
topic_slug: observability-logging-metrics-tracing
version: 1
questions:
  - id: observability-logging-metrics-tracing-001
    difficulty: beginner
    tags: [signals, metrics, tracing, logging]
    question: |
      Which of the three observability signals is the CHEAP, pre-aggregated one you
      typically build alarms on (as opposed to per-request or per-event records)?
    options: ["Metrics", "Traces", "Logs", "Reflection descriptors"]
    answer: 0
    explanation: |
      Metrics are aggregate counters/histograms (rate, errors, latency) that are cheap to
      store and query, so they are the natural thing to alarm on. Traces are expensive
      per-request causality (usually sampled), and logs are high-volume per-event records.
    ref: "concepts.md#the-three-signals-in-a-grpc-context"

  - id: observability-logging-metrics-tracing-002
    difficulty: beginner
    tags: [tracing, metadata, context-propagation]
    question: |
      How does distributed-tracing context travel between gRPC services?
    options: ["Embedded as extra fields inside the protobuf response message", "In a separate UDP side-channel that the client opens alongside each RPC", "In request metadata (HTTP/2 HEADERS), e.g. the W3C traceparent header", "In the TCP options field of the underlying socket's SYN packet"]
    answer: 2
    explanation: |
      Trace context rides in request metadata — the same HTTP/2 HEADERS channel that
      carries grpc-timeout and auth. OTel defaults to the W3C traceparent/tracestate
      headers. It is never placed inside the protobuf message.
    ref: "concepts.md#tracing-context-propagation-via-metadata"

  - id: observability-logging-metrics-tracing-003
    difficulty: beginner
    tags: [metrics, labels, method, status]
    question: |
      Standard per-RPC gRPC metrics are keyed (labeled) primarily by which two
      dimensions?
    options: ["Client IP address and the ephemeral TCP source port", "Trace ID and span ID copied from the traceparent header", "Message field number and wire type", "Fully-qualified method and gRPC status code"]
    answer: 3
    explanation: |
      The canonical gRPC metric set labels RPCs by the fully-qualified method
      (/package.Service/Method) and the status code, giving you request rate and error
      rate per method with bounded label cardinality.
    ref: "concepts.md#per-rpc-metrics-what-to-measure"

  - id: observability-logging-metrics-tracing-004
    difficulty: beginner
    tags: [channelz, introspection]
    question: |
      What is channelz in gRPC?
    options: ["A protoc compiler plugin that generates client-side metrics collection code", "A built-in gRPC service that exposes live internal channel/subchannel/socket state", "A client-side load-balancing algorithm that spreads calls across subchannels", "A background daemon that periodically rotates the server's TLS certificates"]
    answer: 1
    explanation: |
      Channelz (grpc.channelz.v1.Channelz) is a gRPC service exposing the live internal
      state of a running process — channels, subchannels, sockets, connectivity state,
      and call stats — for debugging connection and load-balancing issues without a restart.
    ref: "concepts.md#channelz-built-in-live-introspection"

  - id: observability-logging-metrics-tracing-005
    difficulty: beginner
    tags: [health, service]
    question: |
      What does the gRPC health checking service (grpc.health.v1.Health) let a load
      balancer or Kubernetes do?
    options: ["Compress outbound messages with gzip before sending them", "Discover a server's method schemas dynamically", "Ask a server over gRPC whether it is currently serving", "Encrypt metadata separately from the body"]
    answer: 2
    explanation: |
      The Health service exposes Check (unary) and Watch (server-streaming) so LBs,
      meshes, and Kubernetes probes can ask "are you serving?" over gRPC itself instead of
      a separate HTTP endpoint.
    ref: "concepts.md#grpc-health-checking-protocol"

  - id: observability-logging-metrics-tracing-006
    difficulty: beginner
    tags: [reflection, tooling, grpcurl]
    question: |
      What is the purpose of gRPC server reflection?
    options: ["To let clients/tools discover a server's services and message schemas at runtime without the .proto files", "To automatically retry failed RPCs against a backup backend using an exponential-backoff policy", "To mirror a copy of every inbound request to a second backend for shadow testing", "To reflect the server's TLS certificate chain back to the client for pinning validation"]
    answer: 0
    explanation: |
      Server reflection exposes the server's file descriptors over a gRPC service so tools
      like grpcurl can discover services and messages and invoke methods dynamically,
      without a locally compiled stub or the .proto files.
    ref: "concepts.md#server-reflection"

  - id: observability-logging-metrics-tracing-007
    difficulty: intermediate
    tags: [tracing, span, trace-id, span-id]
    question: |
      As an RPC propagates from service A to B to C, what happens to the trace-id and
      span-id?
    options: ["Both the trace-id and span-id stay byte-for-byte identical on every hop", "The trace-id stays the same across all hops; each hop generates a fresh span-id linked to its parent", "A new trace-id is generated at each hop while the span-id is reused unchanged", "Both are regenerated at each hop and are stored with no parent-child linkage"]
    answer: 1
    explanation: |
      All spans in one trace share the trace-id, which is what groups them. Each hop
      creates a new span with its own span-id and records the parent's span-id to build
      the parent-child tree. Copying traceparent unchanged (same span-id everywhere) is a
      common bug.
    ref: "concepts.md#tracing-context-propagation-via-metadata"

  - id: observability-logging-metrics-tracing-008
    difficulty: intermediate
    tags: [metrics, latency, histogram]
    question: |
      Why should RPC latency be recorded as a histogram rather than a running average?
    options: ["A histogram uses strictly less memory than storing a single running average", "The gRPC spec forbids exporting averages and mandates bucketed histograms", "The health checking protocol requires latency to be reported as a histogram", "Averages hide tail latency; a histogram lets you compute p50/p90/p99"]
    answer: 3
    explanation: |
      A mean collapses the distribution and hides the slow tail. A latency histogram keeps
      bucketed counts so you can derive percentiles (p99 tail latency), which is what SLOs
      and alarms usually care about.
    ref: "concepts.md#per-rpc-metrics-what-to-measure"

  - id: observability-logging-metrics-tracing-009
    difficulty: intermediate
    tags: [streaming, metrics, in-flight]
    question: |
      A long-lived server-streaming RPC has silently stalled (no messages flowing). Why
      might RPC-count metrics alone fail to reveal this, and what better shows it?
    options: ["RPC count increments per message, so a stall would make the counter spike visibly — nothing else needed", "RPC count is reset to zero every second, so any long-lived stream is hidden from it", "A streaming RPC is one RPC-count entry that stays open, so it looks like a healthy idle stream; the in-flight gauge and per-message metrics reveal the stall", "Only the grpc.health.v1.Health service can detect a stalled long-lived stream"]
    answer: 2
    explanation: |
      A streaming RPC produces a single RPC-count/latency entry (starts once, ends once)
      but many message events. A stalled long-lived stream looks identical to a healthy
      idle one in RPC count; watch the in-flight/concurrent gauge and per-message metrics.
    ref: "concepts.md#per-rpc-metrics-what-to-measure"

  - id: observability-logging-metrics-tracing-010
    difficulty: intermediate
    tags: [otel, semantic-conventions, span-name]
    question: |
      Per OTel RPC semantic conventions, what is the recommended span NAME for a gRPC
      call?
    options: ["The full method path like package.Service/Method (not parameterized with request data)", "A random UUID generated fresh for every individual call", "The client's resolved IP address and source port", "The serialized protobuf request body encoded as base64"]
    answer: 0
    explanation: |
      OTel names the RPC span after the fully-qualified method (e.g.
      routeguide.RouteGuide/GetFeature). It is deliberately NOT parameterized with request
      values, keeping span-name cardinality bounded.
    ref: "concepts.md#opentelemetry-grpc-instrumentation--rpc-semantic-conventions"

  - id: observability-logging-metrics-tracing-011
    difficulty: intermediate
    tags: [otel, attributes, status]
    question: |
      Which OTel attribute carries the numeric gRPC status code on a span?
    options: ["http.status_code", "grpc.error", "rpc.result", "rpc.grpc.status_code"]
    answer: 3
    explanation: |
      OTel RPC semantic conventions use rpc.system=grpc, rpc.service, rpc.method, and
      rpc.grpc.status_code (the numeric gRPC status, e.g. 0 OK, 4 DEADLINE_EXCEEDED). It is
      distinct from http.status_code.
    ref: "concepts.md#opentelemetry-grpc-instrumentation--rpc-semantic-conventions"

  - id: observability-logging-metrics-tracing-012
    difficulty: advanced
    tags: [stats-handler, interceptor, metrics]
    question: |
      Why is a gRPC stats handler (stats.Handler), rather than a plain interceptor,
      preferred for accurate metrics like message byte sizes?
    options: ["Interceptors have no access to the fully-qualified method name of the call", "The stats handler receives fine-grained events (headers, each payload with byte length, RPC end with timing) that interceptors do not", "Interceptors are dispatched on a separate, slower thread pool inside the runtime", "Stats handlers observe payloads before TLS encryption so they run measurably faster"]
    answer: 1
    explanation: |
      Interceptors only wrap the start and end of a call. The stats handler receives
      per-event callbacks (InHeader, InPayload/OutPayload with byte counts, End with status
      and duration), which is exactly what byte-accurate size and per-message metrics need.
      OTel gRPC instrumentation is built on it.
    ref: "concepts.md#interceptors--stats-handlers-the-instrumentation-hook"

  - id: observability-logging-metrics-tracing-013
    difficulty: intermediate
    tags: [logging, pii, security]
    question: |
      What should a DEFAULT gRPC access-log interceptor avoid logging?
    options: ["The message bodies and the authorization metadata value", "The fully-qualified method name of the invoked RPC", "The end-to-end RPC latency measured in milliseconds", "The numeric grpc-status code returned in the trailers"]
    answer: 0
    explanation: |
      Default access logs should be metadata-only: method, peer, status, latency, and
      correlation ids. RPC payloads routinely contain PII/secrets, so logging bodies (and
      the raw authorization token) creates compliance exposure and log bloat. Body logging
      should be selective and redacted.
    ref: "concepts.md#logging-per-rpc-access-logs-via-interceptors"

  - id: observability-logging-metrics-tracing-014
    difficulty: intermediate
    tags: [health, service-name, empty-string]
    question: |
      In the gRPC health protocol, what does an empty string ("") for the service field in
      a HealthCheckRequest mean?
    options: ["It is invalid and returns INVALID_ARGUMENT", "It queries the reflection service", "It queries the health of the whole server", "It resets all health statuses to SERVING"]
    answer: 2
    explanation: |
      The empty-string service represents the overall server's health. Individual services
      get their own status keyed by name, so a server can mark one service NOT_SERVING
      (e.g. during a drain) while others keep serving.
    ref: "concepts.md#grpc-health-checking-protocol"

  - id: observability-logging-metrics-tracing-015
    difficulty: intermediate
    tags: [health, watch, streaming]
    question: |
      What advantage does the Health service's Watch RPC have over Check for a client-side
      load balancer?
    options: ["Watch is a unary call that completes in a single round trip, so it is faster than Check", "Watch encrypts the serving status on the wire while Check returns it as plaintext", "Watch works over a plaintext connection without requiring TLS, unlike Check", "Watch is server-streaming: the server pushes a new status on every change, so the LB reacts without polling"]
    answer: 3
    explanation: |
      Check is a point-in-time unary probe. Watch is server-streaming: the client
      subscribes and the server pushes a new HealthCheckResponse whenever the serving
      status changes, letting a client-side LB react to a backend going unhealthy without
      polling.
    ref: "concepts.md#grpc-health-checking-protocol"

  - id: observability-logging-metrics-tracing-016
    difficulty: advanced
    tags: [channelz, load-balancing, debugging]
    question: |
      Your client-side load balancing is not spreading traffic across backends. Which
      built-in tool most directly shows per-subchannel connectivity state and per-socket
      call counts to find the cause?
    options: ["Server reflection", "Channelz", "The health Check RPC", "Wireshark on the loopback interface"]
    answer: 1
    explanation: |
      Channelz exposes per-subchannel connectivity state (e.g. one backend stuck in
      TRANSIENT_FAILURE) and per-socket call counts (e.g. traffic pinned to one socket),
      which is exactly what you need to diagnose an LB that is not spreading load.
    ref: "concepts.md#channelz-built-in-live-introspection"

  - id: observability-logging-metrics-tracing-017
    difficulty: intermediate
    tags: [reflection, security, production]
    question: |
      What is the main security concern with leaving server reflection enabled in
      production?
    options: ["It roughly doubles the server's memory usage by caching all file descriptors", "It silently disables TLS on the reflection endpoint's connections", "It advertises your entire API surface to anyone who can reach the port", "It forces every RPC on the server to be unary, disabling streaming"]
    answer: 2
    explanation: |
      Reflection exposes the full set of services and message schemas to any client that
      can reach the port. Common practice is to disable it or auth/network-gate it in
      production; tools can still work if you pass .proto/protoset files explicitly.
    ref: "concepts.md#server-reflection"

  - id: observability-logging-metrics-tracing-018
    difficulty: intermediate
    tags: [tooling, grpcurl, wireshark]
    question: |
      Which tool operates at the HTTP/2 FRAME level, letting you inspect the actual
      HEADERS/DATA frames and the grpc-status in the trailers on the wire?
    options: ["Wireshark (with the gRPC/protobuf dissector)", "grpcurl operating at the application RPC level", "grpc_health_probe checking the Health service status", "channelz inspecting live per-socket state"]
    answer: 0
    explanation: |
      grpcurl works at the RPC/application level. Wireshark with the gRPC dissector decodes
      the actual HTTP/2 frames (HEADERS, DATA, trailing HEADERS), so it is the ground-truth
      tool for wire-level questions like "what is in the trailers?"
    ref: "concepts.md#debugging-tools"

  - id: observability-logging-metrics-tracing-019
    difficulty: advanced
    tags: [wireshark, tls, decryption]
    question: |
      To use Wireshark to decode gRPC traffic that is sent over TLS, what do you generally
      need?
    options: ["Nothing — Wireshark decrypts TLS automatically", "The TLS session keys, e.g. via SSLKEYLOGFILE", "Root access to the gRPC server process", "To disable HTTP/2 on the client"]
    answer: 1
    explanation: |
      Wireshark can only dissect gRPC if it can read the HTTP/2 bytes. For TLS you must
      supply the session secrets (commonly via the SSLKEYLOGFILE keylog file). Loading the
      .proto additionally lets it show field names instead of raw field numbers.
    ref: "concepts.md#debugging-tools"

  - id: observability-logging-metrics-tracing-020
    difficulty: advanced
    tags: [metrics, cardinality, labels]
    question: |
      What is the cardinality pitfall when labeling gRPC metrics?
    options: ["Using the fully-qualified method name as a label is far too coarse to distinguish individual RPC endpoints", "Status codes have too few distinct values to ever produce a useful error-rate breakdown across methods", "Histograms are a special metric type that cannot carry any labels, so they must be exported without a method dimension", "Labeling metrics with dynamic values like user id or request id explodes time-series count; keep labels bounded (method + status)"]
    answer: 3
    explanation: |
      High-cardinality labels (user id, request id) create a separate time series per
      value and can overwhelm the metrics backend. Keep metric labels bounded (method +
      status) and push high-cardinality context into traces and logs instead.
    ref: "concepts.md#per-rpc-metrics-what-to-measure"

  - id: observability-logging-metrics-tracing-021
    difficulty: advanced
    tags: [tracing, sampling, head-based]
    question: |
      A client at the top of a call chain decides NOT to sample a trace. Because the
      sampling decision propagates in traceparent's trace-flags, what happens downstream?
    options: ["Each downstream service ignores the incoming flag and re-decides sampling independently on its own hop", "Downstream services always sample every request regardless of what the upstream trace-flags requested", "Downstream services honor the not-sampled decision, keeping the trace all-or-nothing (head-based sampling)", "The trace-id is stripped at each boundary, so every downstream service starts a brand-new unrelated trace"]
    answer: 2
    explanation: |
      The sampled bit in traceparent trace-flags is honored downstream — this is head-based
      sampling. If the head does not sample, B and C do not either, so the whole trace is
      consistently present or absent.
    ref: "concepts.md#tracing-context-propagation-via-metadata"

  - id: observability-logging-metrics-tracing-022
    difficulty: intermediate
    tags: [tracing, w3c, traceparent]
    question: |
      Which header is the W3C Trace Context standard that OTel uses by default for gRPC
      context propagation?
    options: ["traceparent", "x-request-id", "grpc-trace-bin", "x-b3-traceid"]
    answer: 0
    explanation: |
      W3C Trace Context defines traceparent (version, trace-id, parent span-id, trace-flags)
      plus optional tracestate, and OTel uses it by default. x-b3-* is the older B3 format;
      grpc-trace-bin is a gRPC/OpenCensus binary format.
    ref: "concepts.md#tracing-context-propagation-via-metadata"

  - id: observability-logging-metrics-tracing-023
    difficulty: intermediate
    tags: [interceptor, ordering, tracing]
    question: |
      In an interceptor chain, where should the tracing interceptor typically sit, and why?
    options: ["Innermost, so the span only measures the handler body and nothing else", "It does not matter where the tracing interceptor sits in the chain at all", "Outside the transport layer entirely, running before TLS termination on the socket", "Outermost, so the span wraps everything including auth failures and other interceptors"]
    answer: 3
    explanation: |
      Putting tracing outermost means the span wraps the entire RPC — including auth
      rejections and downstream calls — and it can inject/extract context before other
      interceptors run. Logging usually sits just inside so it can include the trace id.
    ref: "concepts.md#interceptors--stats-handlers-the-instrumentation-hook"

  - id: observability-logging-metrics-tracing-024
    difficulty: advanced
    tags: [tracing, context, gotcha]
    question: |
      A Go service makes downstream gRPC calls but the traces show the downstream spans as
      NEW root traces, not children. What is the most likely cause?
    options: ["The downstream server disabled reflection, so the client could not attach the parent span metadata", "The handler passed context.Background() (a fresh context) to the outbound call instead of the incoming request context", "The metrics stats handler was never registered, so no span context could be injected into outbound metadata", "The client used a unary call instead of a streaming RPC, which resets the trace context on each request"]
    answer: 1
    explanation: |
      Propagation only works if the incoming context (carrying the extracted span) flows
      into outbound calls. Using context.Background() drops the parent span, so the
      downstream client interceptor starts a fresh root trace instead of a child.
    ref: "concepts.md#tracing-context-propagation-via-metadata"

  - id: observability-logging-metrics-tracing-025
    difficulty: intermediate
    tags: [channelz, connectivity-state]
    question: |
      A subchannel reported by channelz is stuck in TRANSIENT_FAILURE. What does that
      indicate?
    options: ["The connection to that backend is failing (e.g. refused/unreachable) so calls to it fail", "The backend is fully healthy and simply sitting idle with no active calls", "TLS negotiated successfully and the subchannel is ready to carry new RPCs", "The channel to that backend has been gracefully shut down and drained of calls"]
    answer: 0
    explanation: |
      TRANSIENT_FAILURE is a connectivity state meaning the subchannel cannot establish or
      maintain a connection to that backend (e.g. connection refused / unreachable), so
      RPCs routed to it fail. Channelz surfaces this per subchannel to explain LB problems.
    ref: "concepts.md#channelz-built-in-live-introspection"

  - id: observability-logging-metrics-tracing-026
    difficulty: intermediate
    tags: [logging, streaming, interceptor]
    question: |
      Why does a plain UNARY logging interceptor fail to log per-message events on a
      streaming RPC?
    options: ["Streaming RPCs cannot be intercepted at all because the framework routes them around the interceptor chain", "The gRPC specification disables all logging on streaming RPCs, so no interceptor can ever observe them", "A unary interceptor wraps a single request/response; you need a stream interceptor wrapping the ServerStream to observe SendMsg/RecvMsg", "The unary interceptor collapses and logs the entire stream as a single giant concatenated message"]
    answer: 2
    explanation: |
      Unary interceptors wrap one request/response call. For per-message visibility on a
      stream you wrap the ServerStream in a stream interceptor and observe SendMsg/RecvMsg,
      and log the final status when the stream closes.
    ref: "concepts.md#logging-per-rpc-access-logs-via-interceptors"

  - id: observability-logging-metrics-tracing-027
    difficulty: beginner
    tags: [logging, fields, access-log]
    question: |
      Which set of fields is most appropriate for a per-RPC access log line?
    options: ["Full request body, full response body, and stack trace", "The server's private TLS key and the raw auth bearer token", "Every metadata value verbatim including authorization", "Method, peer, grpc-status, latency, and correlation/trace id"]
    answer: 3
    explanation: |
      A good access-log record uses what the framework already knows and is safe to store:
      the fully-qualified method, peer address, grpc-status, latency, and a correlation/
      trace id so logs join to traces. Bodies and secrets are excluded by default.
    ref: "concepts.md#logging-per-rpc-access-logs-via-interceptors"

  - id: observability-logging-metrics-tracing-028
    difficulty: advanced
    tags: [tracing, streaming, span-lifetime]
    question: |
      For a long-lived bidirectional streaming RPC, what is the gotcha with its trace span?
    options: ["The gRPC specification forbids attaching any trace span to a long-lived streaming RPC", "The span stays open for the whole stream lifetime (possibly hours); individual messages are usually recorded as span events", "Each individual message on the stream opens a brand-new independent trace of its own", "The span closes automatically right after the first message is sent on the stream"]
    answer: 1
    explanation: |
      A streaming RPC is one span that lives as long as the stream — potentially hours —
      which can leave spans open a long time. Per-message activity is typically captured as
      span events rather than separate spans.
    ref: "concepts.md#tracing-context-propagation-via-metadata"

  - id: observability-logging-metrics-tracing-029
    difficulty: intermediate
    tags: [health, application-defined, drain]
    question: |
      Who sets a gRPC server's serving status, and when should it report NOT_SERVING?
    options: ["gRPC sets the serving status automatically by continuously sampling process CPU load and memory pressure", "The load balancer sets each backend's serving status remotely by probing it over the network", "The application sets it; it should report NOT_SERVING when it is up but cannot serve (e.g. a critical dependency is down) or during a drain", "It is permanently fixed at SERVING for the entire process lifetime and cannot be changed at runtime"]
    answer: 2
    explanation: |
      Health status is application-defined. The server must actively set it — reporting
      NOT_SERVING when it is running but cannot serve (dependency down, graceful drain) so
      LBs stop routing to it, and flipping back to SERVING when healthy.
    ref: "concepts.md#grpc-health-checking-protocol"

  - id: observability-logging-metrics-tracing-030
    difficulty: intermediate
    tags: [tooling, grpcurl, reflection]
    question: |
      grpcurl needs to know a server's method and message schema to build a request. How
      does it obtain that if you do not pass .proto files?
    options: ["It calls the server's reflection service to fetch file descriptors", "It guesses the message shape heuristically from the method name", "It reads the server's source code remotely over an SSH connection", "It parses the schema out of the TLS certificate fields"]
    answer: 0
    explanation: |
      Without .proto/protoset files, grpcurl uses the server reflection service to fetch
      the file descriptors, builds a dynamic message from them, serializes your JSON to
      protobuf, and invokes the method — no locally compiled stub required.
    ref: "concepts.md#server-reflection"

  - id: observability-logging-metrics-tracing-031
    difficulty: advanced
    tags: [otel, metric-names, duration]
    question: |
      Under OTel RPC conventions, which metric names represent gRPC call latency
      histograms?
    options: ["grpc.server.calls and grpc.client.calls", "rpc.server.duration and rpc.client.duration", "http.request.duration.seconds", "channelz.rpc.latency.histogram"]
    answer: 1
    explanation: |
      OTel RPC semantic conventions define rpc.server.duration and rpc.client.duration as
      the latency histograms, alongside request/response size histograms. These are the
      standardized names OTel gRPC instrumentation emits.
    ref: "concepts.md#opentelemetry-grpc-instrumentation--rpc-semantic-conventions"

  - id: observability-logging-metrics-tracing-032
    difficulty: intermediate
    tags: [signals, correlation, trace-id]
    question: |
      An alert fires on a metric (error rate spike for one method). What is the connective
      tissue that lets you pivot from that to the exact failing request's traces and logs?
    options: ["The TCP sequence number", "The protobuf field number", "The HPACK dynamic-table index", "The trace ID"]
    answer: 3
    explanation: |
      The trace ID correlates the signals: from the metric you jump to traces filtered to
      that method, find the failing span, then read the logs carrying the same trace ID.
      That is why correct context propagation is foundational.
    ref: "concepts.md#the-three-signals-in-a-grpc-context"

  - id: observability-logging-metrics-tracing-033
    difficulty: advanced
    tags: [metrics, streaming, slo, first-message]
    question: |
      For a server-streaming RPC that legitimately runs for minutes, which is usually the
      better latency SLO than end-to-end RPC duration?
    options: ["Total bytes transferred over the lifetime of the stream", "The number of TCP retransmits observed on the connection", "Time to first response (headers/first message) plus per-message throughput", "The size in bytes of the client's initial request message"]
    answer: 2
    explanation: |
      End-to-end duration of a long stream is not a meaningful latency SLO. Time to first
      response (how fast the server starts replying) plus per-message throughput better
      capture user-perceived performance for streaming.
    ref: "concepts.md#per-rpc-metrics-what-to-measure"

  - id: observability-logging-metrics-tracing-034
    difficulty: intermediate
    tags: [channelz, sockets, keepalive]
    question: |
      Which of the following does channelz expose at the SOCKET level?
    options: ["Local/remote address, security (TLS?), flow-control windows, streams started, messages sent/received, and keepalive counters", "The application's full business database schema along with the tables backing each RPC handler", "The complete Kubernetes pod spec and container resource limits for the running server process", "The OTel span exporter endpoint URL together with the configured trace sampling ratio"]
    answer: 0
    explanation: |
      Channelz socket details include local/remote addresses, whether the socket is
      secured, flow-control window sizes, streams started, message counts, and keepalive
      counters — connection-level truth for debugging.
    ref: "concepts.md#channelz-built-in-live-introspection"

  - id: observability-logging-metrics-tracing-035
    difficulty: intermediate
    tags: [tooling, grpc_health_probe, kubernetes]
    question: |
      What is grpc_health_probe used for?
    options: ["Compiling .proto files into language-specific client and server stubs", "Capturing raw HTTP/2 packets off the wire for frame-level inspection", "Rotating and renewing the server's expiring TLS certificates on a schedule", "Checking a server's grpc.health.v1.Health/Check status, e.g. for Kubernetes probes or scripts"]
    answer: 3
    explanation: |
      grpc_health_probe is a small binary that invokes the Health/Check RPC, commonly used
      in Kubernetes health checks (though native gRPC probes are now preferred) and in
      scripts to verify a server is serving.
    ref: "concepts.md#debugging-tools"

  - id: observability-logging-metrics-tracing-036
    difficulty: advanced
    tags: [interceptor, stats-handler, roles]
    question: |
      Which statement best separates the roles of interceptors and stats handlers?
    options: ["Interceptors are the layer that collects byte-level metrics, while stats handlers are the hook you use for authentication and access-control decisions", "Interceptors do coarse RPC-level wrapping (auth, logs, spans, error mapping); stats handlers provide a fine-grained event stream (bytes, per-message, precise timing) for metrics", "They are functionally identical hooks and the two different names exist only because each gRPC language binding chose its own terminology", "Stats handlers exist to completely replace request and response metadata before it reaches the interceptor chain on every call"]
    answer: 1
    explanation: |
      Interceptors wrap the whole call and are ideal for auth, access logs, spans, and
      error mapping. Stats handlers deliver a fine-grained event stream (byte counts,
      per-message, precise timing) that is ideal for metrics — which is why OTel builds on
      them.
    ref: "concepts.md#interceptors--stats-handlers-the-instrumentation-hook"

  - id: observability-logging-metrics-tracing-037
    difficulty: intermediate
    tags: [metrics, in-flight, gauge]
    question: |
      Which gRPC metric is a gauge (up/down) rather than a monotonic counter, and is
      especially important for streaming?
    options: ["In-flight / concurrent RPCs", "Total completed RPCs", "Cumulative bytes received", "Total messages sent"]
    answer: 0
    explanation: |
      In-flight/concurrent RPCs is a gauge that rises and falls as calls start and finish.
      It is critical for streaming, where a rising gauge can signal leaked or stuck
      long-lived streams that counters would not reveal.
    ref: "concepts.md#per-rpc-metrics-what-to-measure"

  - id: observability-logging-metrics-tracing-038
    difficulty: advanced
    tags: [health, unregistered, status-codes]
    question: |
      What does the Health service return when asked about a service name that the server
      has NOT registered?
    options: ["SERVING status for both the Check call and the Watch stream", "INVALID_ARGUMENT on both Check and the Watch stream", "NOT_FOUND status for Check, and SERVICE_UNKNOWN on the Watch stream", "The call hangs open indefinitely until the client's deadline fires"]
    answer: 2
    explanation: |
      For an unregistered service, Check returns the NOT_FOUND status code, while Watch
      emits SERVING status SERVICE_UNKNOWN on its stream. This lets clients distinguish
      "unknown service" from "unhealthy service."
    ref: "concepts.md#grpc-health-checking-protocol"

  - id: observability-logging-metrics-tracing-039
    difficulty: intermediate
    tags: [tracing, client-span, server-span]
    question: |
      In the standard inject/extract flow, which span kind does the client interceptor
      create, and which does the server interceptor create?
    options: ["Both endpoints create INTERNAL spans that share one span-id across the boundary", "Client creates a SERVER span; server creates a CLIENT span", "Neither creates a span; gRPC does it in the transport", "Client creates a CLIENT span; server extracts and creates a SERVER span as its child"]
    answer: 3
    explanation: |
      The client interceptor starts a CLIENT span and injects its context into metadata.
      The server interceptor extracts that context and starts a SERVER span whose parent is
      the client span, restoring causality across the process boundary.
    ref: "concepts.md#tracing-context-propagation-via-metadata"

  - id: observability-logging-metrics-tracing-040
    difficulty: intermediate
    tags: [tooling, wireshark, field-names]
    question: |
      In Wireshark, what extra input lets it show protobuf FIELD NAMES instead of just raw
      field numbers?
    options: ["The server's exported TLS private key file", "The .proto files loaded into the dissector", "A channelz socket-state dump from the server", "The OTel collector's exporter config file"]
    answer: 1
    explanation: |
      Protobuf is self-describing only down to field numbers and wire types on the wire.
      Loading the .proto into Wireshark's dissector maps those numbers back to human field
      names for readable decoding.
    ref: "concepts.md#debugging-tools"

  - id: observability-logging-metrics-tracing-041
    difficulty: beginner
    tags: [health, check, unary]
    question: |
      The Health service's Check RPC is what kind of call?
    options: ["Client-streaming (client sends many probes)", "Bidirectional streaming (both sides push statuses)", "Unary (a point-in-time request/response)", "Server-streaming (server pushes status updates)"]
    answer: 2
    explanation: |
      Check is a unary RPC returning a single point-in-time HealthCheckResponse — well
      suited to Kubernetes liveness/readiness probes and simple LB checks. Watch is the
      server-streaming variant that pushes updates.
    ref: "concepts.md#grpc-health-checking-protocol"

  - id: observability-logging-metrics-tracing-042
    difficulty: advanced
    tags: [channelz, security, production]
    question: |
      Since channelz exposes internal state, what is the recommended production posture?
    options: ["Explicitly enable it but protect it (bind to localhost or put it behind auth/network policy)", "Always expose it publicly on a well-known port for developer convenience and quick debugging", "It cannot be disabled once compiled in, so gating it behind auth is impossible anyway", "Only expose it over a UDP side-channel, which is safe because UDP cannot be port-scanned"]
    answer: 0
    explanation: |
      Channelz must be explicitly registered/enabled, and because it reveals internals
      (addresses, call stats, connection state) it should be protected in production —
      bound to localhost or gated behind authentication/network policy.
    ref: "concepts.md#channelz-built-in-live-introspection"

  - id: observability-logging-metrics-tracing-043
    difficulty: intermediate
    tags: [otel, dial-option, instrumentation]
    question: |
      In gRPC-Go, attaching the OTel instrumentation as a DialOption on the channel
      accomplishes what?
    options: ["It only affects the very first RPC on the channel and then detaches", "Every call made on that channel is instrumented (metrics/tracing) uniformly", "It disables TLS on the channel so the exporter can read plaintext frames", "It forces every call on the channel to use streaming so spans stay open"]
    answer: 1
    explanation: |
      Attaching the OTel stats handler via a DialOption wires instrumentation into the
      channel, so all RPCs made through it are consistently measured/traced — the client
      analogue of the server-side ServerOption.
    ref: "concepts.md#opentelemetry-grpc-instrumentation--rpc-semantic-conventions"

  - id: observability-logging-metrics-tracing-044
    difficulty: advanced
    tags: [metrics, error-rate, alarming]
    question: |
      Why is the error RATIO (fraction of RPCs with non-OK status) usually a better alarm
      than raw error COUNT?
    options: ["Raw error count is impossible to compute in gRPC because the status-labeled counter is not exposed by the runtime", "The ratio is always a smaller number than the raw count, so alarms based on it naturally fire far less often and cut noise", "gRPC's metric conventions only export precomputed error ratios and never the raw per-status counts, so you have no choice", "The ratio normalizes for traffic volume, so it does not false-alarm during high-traffic bursts or miss errors during low traffic"]
    answer: 3
    explanation: |
      Raw error count scales with traffic — high volume triggers false alarms and low
      volume hides real problems. The error ratio (non-OK / total, derivable from the
      status-labeled RPC counter) normalizes for volume, making a more stable SLO.
    ref: "concepts.md#per-rpc-metrics-what-to-measure"

  - id: observability-logging-metrics-tracing-045
    difficulty: advanced
    tags: [tooling, selection, scenario]
    question: |
      You need to confirm whether a client is actually transmitting the grpc-timeout header
      and what the server returns in the trailers, at the byte level. Which tool is most
      appropriate?
    options: ["grpcurl in verbose header mode", "The Health service's Check RPC status", "Wireshark with the gRPC dissector", "Server reflection descriptor dump"]
    answer: 2
    explanation: |
      Verifying exactly what headers/trailers appear on the wire (grpc-timeout in the
      opening HEADERS, grpc-status in the trailing HEADERS) is a frame-level question, which
      is Wireshark's domain. grpcurl operates at the RPC level and abstracts the framing.
    ref: "concepts.md#debugging-tools"

  - id: observability-logging-metrics-tracing-046
    difficulty: intermediate
    tags: [reflection, contract, schema-registry]
    question: |
      Which statement about server reflection is correct?
    options: ["It is a debugging/tooling convenience; tools can still work with explicit .proto/protoset files when reflection is off", "It is a full replacement for shipping .proto files and serves as the authoritative contract of record", "It automatically versions your API and rejects clients built against an older schema revision", "It is required for any gRPC call to succeed, since clients resolve method descriptors through it at dial time"]
    answer: 0
    explanation: |
      Reflection is a convenience for tooling, not the authoritative contract or a schema
      registry. If it is disabled, tools like grpcurl still work when you supply .proto or
      protoset files explicitly. Normal RPCs never need reflection.
    ref: "concepts.md#server-reflection"

  - id: observability-logging-metrics-tracing-047
    difficulty: advanced
    tags: [tracing, tracestate, w3c]
    question: |
      Besides traceparent, what is the tracestate header in W3C Trace Context used for?
    options: ["It duplicates the traceparent header for redundancy in case a proxy strips one copy", "It stores a compressed copy of the request body for trace-based payload replay", "It replaces the grpc-status trailer with a trace-scoped status for the whole call", "It carries additional vendor-specific/tracing-system state alongside the standard traceparent"]
    answer: 3
    explanation: |
      traceparent carries the standardized fields (trace-id, parent span-id, flags).
      tracestate is optional and carries additional vendor-specific tracing state, letting
      multiple systems coexist without losing their own context.
    ref: "concepts.md#tracing-context-propagation-via-metadata"

  - id: observability-logging-metrics-tracing-048
    difficulty: beginner
    tags: [tooling, grpcurl, list]
    question: |
      What does "grpcurl localhost:50051 list" do against a reflection-enabled server?
    options: ["Lists the open TCP connections", "Lists the services the server exposes", "Lists the metrics being exported", "Lists the trace spans in flight"]
    answer: 1
    explanation: |
      grpcurl's list command uses reflection to enumerate the services the server exposes
      (and "list <service>" enumerates its methods). It is the discovery entrypoint for
      exploring an unknown gRPC server.
    ref: "concepts.md#server-reflection"

  - id: observability-logging-metrics-tracing-049
    difficulty: advanced
    tags: [signals, roles, scenario]
    question: |
      Which mapping of question-to-signal is correct for gRPC observability?
    options: ["\"How many RPCs failed this minute?\" -> metrics; \"Where did one request's latency go across services?\" -> traces; \"What exactly happened on this one call?\" -> logs", "\"How many RPCs failed this minute?\" -> traces; \"Where did one request's latency go across services?\" -> metrics; single-call detail -> channelz", "All three of these questions are answered only by logs, since metrics and traces cannot attribute failures to a method", "Channelz answers all three, exposing failure counts, cross-service latency, and full per-call detail in a single view"]
    answer: 0
    explanation: |
      Aggregate rate/error questions map to metrics; per-request cross-service latency and
      causality map to traces; the exact detail of a single call maps to logs. Each signal
      has a distinct role and collection mechanism in gRPC.
    ref: "concepts.md#the-three-signals-in-a-grpc-context"

  - id: observability-logging-metrics-tracing-050
    difficulty: intermediate
    tags: [health, kubernetes, probes]
    question: |
      For Kubernetes probing a gRPC server, which is the recommended modern approach?
    options: ["Shell out to grpcurl in a lifecycle hook that parses the JSON status on every probe", "Expose a parallel HTTP /healthz endpoint and ignore the gRPC health service entirely", "Use the native gRPC probe (or grpc_health_probe) against the grpc.health.v1.Health service", "Rely on a plain TCP dial check to the port, treating an open socket as proof of serving"]
    answer: 2
    explanation: |
      Kubernetes supports native gRPC health probes (and previously grpc_health_probe)
      that call grpc.health.v1.Health/Check. This is preferred over shelling out or relying
      on a plain TCP check, which cannot tell if the app is actually serving.
    ref: "concepts.md#grpc-health-checking-protocol"

  - id: observability-logging-metrics-tracing-051
    difficulty: advanced
    tags: [stats-handler, events, mechanism]
    question: |
      Which sequence of stats-handler events best reflects a unary RPC's lifecycle on the
      server?
    options: ["End -> Begin -> InHeader -> OutPayload -> InPayload", "OutPayload -> End -> Begin -> InHeader -> InPayload", "InPayload -> Begin -> InHeader -> OutPayload -> End", "InHeader -> Begin -> InPayload -> OutPayload -> End"]
    answer: 3
    explanation: |
      On the server the stats handler observes the call in order: InHeader (request
      metadata is processed first), then Begin, then InPayload (request message with byte
      length), OutPayload (response), and End (with final status and duration). (On the
      client Begin comes first, before OutHeader.) This ordered event stream is what
      enables byte-accurate, precisely-timed metrics.
    ref: "concepts.md#interceptors--stats-handlers-the-instrumentation-hook"

  - id: observability-logging-metrics-tracing-052
    difficulty: intermediate
    tags: [logging, peer, mechanism]
    question: |
      In a Go server logging interceptor, how do you obtain the client's address (peer) to
      log it?
    options: ["Parse the peer address out of the protobuf request message", "Read it from the context, e.g. peer.FromContext(ctx)", "It is only exposed through the server reflection service", "You must open a second connection to ask the client"]
    answer: 1
    explanation: |
      The transport puts peer information into the context; peer.FromContext(ctx) returns
      the client address. Logging it (with method, status, latency) gives a useful access
      record without touching the message body.
    ref: "concepts.md#logging-per-rpc-access-logs-via-interceptors"
