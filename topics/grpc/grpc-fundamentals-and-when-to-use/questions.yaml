topic: "gRPC Fundamentals & When to Use It"
domain: grpc
topic_slug: grpc-fundamentals-and-when-to-use
version: 1
questions:
  - id: grpc-fundamentals-and-when-to-use-001
    difficulty: beginner
    tags: [overview, definition]
    question: |
      What does gRPC use as its default interface definition language and
      serialization format, and what is its default transport?
    options:
      - "Protocol Buffers over HTTP/2"
      - "JSON Schema over HTTP/1.1"
      - "Apache Thrift IDL over TCP"
      - "OpenAPI over WebSocket"
    answer: 0
    explanation: |
      gRPC's two load-bearing technologies are Protocol Buffers (as the IDL and the
      binary serialization format) and HTTP/2 (as the transport). That pairing is
      what makes it polyglot, compact, and streaming-capable.
    ref: "concepts.md#what-grpc-is"

  - id: grpc-fundamentals-and-when-to-use-002
    difficulty: beginner
    tags: [overview, contract-first]
    question: |
      Why is gRPC described as "contract-first"?
    options:
      - "Clients and servers must sign a legal usage contract with the API provider before any calls"
      - "The server negotiates the message schema with each client during the initial connection handshake"
      - "The .proto file is the single source of truth from which both client stubs and server skeletons are generated"
      - "The service contract is inferred automatically from the shape of the first request the server receives"
    answer: 2
    explanation: |
      In gRPC the .proto file defines the service, methods, and message types up
      front. Both sides generate code from that same contract, so they agree on
      method names and types at compile time.
    ref: "concepts.md#what-grpc-is"

  - id: grpc-fundamentals-and-when-to-use-003
    difficulty: beginner
    tags: [pillars, codegen]
    question: |
      In gRPC terminology, what is a client "stub"?
    options:
      - "A generated client-side proxy whose methods serialize the request, open a stream, and deserialize the response"
      - "A placeholder method the generator emits that always throws UNIMPLEMENTED until a developer fills in the body"
      - "The server's built-in health-check endpoint that reports whether each registered service is currently serving"
      - "A locally cached copy of the last server response, replayed automatically whenever the same request repeats"
    answer: 0
    explanation: |
      The stub is the generated client-side object. Calling a stub method looks
      like a local call but under the hood it marshals the request, opens an
      HTTP/2 stream, and unmarshals the response.
    ref: "concepts.md#the-four-pillars"

  - id: grpc-fundamentals-and-when-to-use-004
    difficulty: intermediate
    tags: [pillars]
    question: |
      Which of the following is NOT one of the four pillars of gRPC?
    options:
      - "Protocol Buffers as IDL and serialization"
      - "HTTP/2 transport"
      - "A built-in relational persistence layer"
      - "Code generation of stubs and skeletons"
    answer: 2
    explanation: |
      The four pillars are Protocol Buffers, HTTP/2 transport, code generation, and
      a pluggable stack (interceptors/auth/LB). gRPC has no persistence layer; it is
      purely an RPC framework.
    ref: "concepts.md#the-four-pillars"

  - id: grpc-fundamentals-and-when-to-use-005
    difficulty: intermediate
    tags: [protobuf, wire-format]
    question: |
      In the Protocol Buffers binary wire format, what actually identifies a field
      on the wire?
    options:
      - "The field's declared name as a UTF-8 string"
      - "The field's position/order in the message"
      - "A tag combining the field number and a 3-bit wire type"
      - "A hash of the field's type and name"
    answer: 2
    explanation: |
      Each field is a key-value pair where the key is a varint encoding
      (field_number << 3) | wire_type. Because numbers, not names, go on the wire,
      renaming a field does not change the bytes.
    ref: "concepts.md#protocol-buffers-as-the-idl-and-wire-format"

  - id: grpc-fundamentals-and-when-to-use-006
    difficulty: intermediate
    tags: [protobuf, field-numbers]
    question: |
      Why should the most frequently-set fields in a message be assigned field
      numbers 1 through 15?
    options:
      - "Field-number tags 1-15 encode in a single byte, whereas 16-2047 take two"
      - "Numbers above 15 are reserved by the protobuf runtime"
      - "Lower numbers are serialized first, improving parse speed"
      - "The gRPC generator only exposes accessors for fields 1-15"
    answer: 0
    explanation: |
      The tag (field number + wire type) for numbers 1-15 fits in one byte; 16-2047
      need two bytes. Assigning low numbers to hot fields keeps the encoding
      compact.
    ref: "concepts.md#protocol-buffers-as-the-idl-and-wire-format"

  - id: grpc-fundamentals-and-when-to-use-007
    difficulty: advanced
    tags: [proto3, field-presence, gotcha]
    question: |
      In proto3, a message has a plain field `int32 count = 1;` and a service sets
      `count = 0`. What appears on the wire for that field?
    options:
      - "Nothing — a scalar at its default value is omitted entirely"
      - "The field's tag and an explicit varint value of 0 are always written to the wire"
      - "A dedicated null marker byte that the decoder treats as distinct from an actual 0"
      - "A varint 0 accompanied by a separate presence bit set to true in the message header"
    answer: 0
    explanation: |
      proto3 omits scalar fields that equal their type default (0, false, "",
      empty). The receiver just fills in the default on decode, so you cannot tell
      "set to 0" from "never set" for a plain scalar.
    ref: "concepts.md#proto3-field-presence-and-schema-precision"

  - id: grpc-fundamentals-and-when-to-use-008
    difficulty: advanced
    tags: [proto3, field-presence]
    question: |
      You need to distinguish "field was never set" from "field was explicitly set
      to 0" for a proto3 int32. Which approaches work? (Pick the best single
      answer.)
    options:
      - "Nothing works in proto3 — scalar presence tracking was removed entirely and cannot be recovered"
      - "Reintroduce the `required` keyword, which forces the field to always be present on the wire"
      - "Use the `optional` keyword, a wrapper type like Int32Value, or a FieldMask"
      - "Declare a custom sentinel default such as [default = -1] and treat that value as meaning unset"
    answer: 2
    explanation: |
      proto3 removed `required` and disallows custom defaults. Explicit presence
      comes from the `optional` keyword (synthetic one-field oneof), wrapper message
      types, or an explicit FieldMask enumerating touched fields.
    ref: "concepts.md#proto3-field-presence-and-schema-precision"

  - id: grpc-fundamentals-and-when-to-use-009
    difficulty: intermediate
    tags: [proto2-vs-proto3]
    question: |
      Which statement about proto2 vs proto3 is correct?
    options:
      - "proto3 removed the `required` keyword; all fields are effectively optional"
      - "proto3 introduced the `required` keyword that proto2 lacked, tightening its validation rules"
      - "proto2 has no way to express repeated fields, so lists must be modeled as separate messages"
      - "proto3 forbids adding new fields to a message once the schema has been released to clients"
    answer: 0
    explanation: |
      proto3 dropped `required` (a source of hard-to-evolve schemas) and custom
      default values. All proto3 fields are effectively optional at the wire level.
    ref: "concepts.md#proto3-field-presence-and-schema-precision"

  - id: grpc-fundamentals-and-when-to-use-010
    difficulty: intermediate
    tags: [proto3, repeated, presence]
    question: |
      Which proto3 field kind always has explicit presence (you can always tell set
      from unset)?
    options:
      - "A plain scalar field like `int32 n = 1;`"
      - "A `repeated` field"
      - "A `map` field"
      - "A singular embedded message field"
    answer: 3
    explanation: |
      Message-typed fields always track presence (nil vs a set message). Plain
      scalars have no presence in proto3 without `optional`, and repeated/map fields
      treat empty and absent as the same.
    ref: "concepts.md#proto3-field-presence-and-schema-precision"

  - id: grpc-fundamentals-and-when-to-use-011
    difficulty: intermediate
    tags: [http2, transport]
    question: |
      Which HTTP/2 feature lets a gRPC server begin streaming a response body
      before it knows the final success/failure outcome, then report that outcome
      at the end?
    options:
      - "Trailers (trailing HEADERS sent after the DATA)"
      - "HPACK header compression, which shrinks the outcome metadata enough to send it up front"
      - "Stream priorities, which let the server defer the final status until higher-priority streams finish"
      - "The PRIORITY frame, which reorders the response so the status arrives before the body"
    answer: 0
    explanation: |
      gRPC delivers the final grpc-status in HTTP/2 trailers, which arrive after the
      response messages. This is why HTTP/2's trailer support is essential to gRPC.
    ref: "concepts.md#why-grpc-needs-http2"

  - id: grpc-fundamentals-and-when-to-use-012
    difficulty: intermediate
    tags: [http2, multiplexing]
    question: |
      How does HTTP/2 multiplexing benefit gRPC?
    options:
      - "It automatically compresses every Protobuf payload before it is written to the connection"
      - "It encrypts each concurrent stream under its own separate TLS session for isolation"
      - "It lets many concurrent RPCs share one TCP connection without HTTP-level head-of-line blocking"
      - "It transparently converts unary calls into streaming calls whenever the payload grows large"
    answer: 2
    explanation: |
      Each RPC is one HTTP/2 stream, and many streams run concurrently over a single
      connection. A long-running stream therefore does not block short unary calls
      at the HTTP layer.
    ref: "concepts.md#why-grpc-needs-http2"

  - id: grpc-fundamentals-and-when-to-use-013
    difficulty: advanced
    tags: [wire-format, framing]
    question: |
      In the gRPC-over-HTTP/2 wire format, each serialized message inside a DATA
      frame is prefixed by a 5-byte header. What do those 5 bytes contain?
    options:
      - "A 1-byte compressed flag plus a 4-byte big-endian message length"
      - "A 4-byte magic number identifying gRPC plus a 1-byte protocol version indicator"
      - "A 5-byte CRC checksum used to verify the integrity of the message that follows"
      - "A 1-byte field count for the message plus a 4-byte little-endian send timestamp"
    answer: 0
    explanation: |
      The Length-Prefixed-Message framing is 1 byte (compressed flag, 0 or 1) plus a
      4-byte big-endian length, followed by the message bytes.
    ref: "concepts.md#the-grpc-over-http2-wire-format"

  - id: grpc-fundamentals-and-when-to-use-014
    difficulty: advanced
    tags: [wire-format, status, gotcha]
    question: |
      A gRPC call fails with NOT_FOUND. What HTTP `:status` does the response
      typically carry?
    options:
      - "404"
      - "500"
      - "200"
      - "400"
    answer: 2
    explanation: |
      gRPC almost always uses HTTP :status 200; the real RPC outcome is the decimal
      grpc-status in the trailers. HTTP status codes are not reused for gRPC errors.
    ref: "concepts.md#the-grpc-over-http2-wire-format"

  - id: grpc-fundamentals-and-when-to-use-015
    difficulty: advanced
    tags: [wire-format, path]
    question: |
      For a method GetFeature in service RouteGuide in package routeguide, what is
      the HTTP/2 `:path` of the request?
    options:
      - "/routeguide/RouteGuide/GetFeature"
      - "/api/v1/GetFeature"
      - "/routeguide.RouteGuide/GetFeature"
      - "/GetFeature?service=RouteGuide"
    answer: 2
    explanation: |
      The path is /<package>.<Service>/<Method> — here /routeguide.RouteGuide/GetFeature.
      The method is always POST with content-type application/grpc.
    ref: "concepts.md#the-grpc-over-http2-wire-format"

  - id: grpc-fundamentals-and-when-to-use-016
    difficulty: advanced
    tags: [wire-format, trailers-only]
    question: |
      What is a gRPC "Trailers-Only" response?
    options:
      - "A single HEADERS frame with END_STREAM carrying both :status 200 and grpc-status, with no message body"
      - "A response that omits the Protobuf message body but still sends empty DATA frames as placeholders"
      - "A response where the trailing HEADERS frame is deliberately sent before the initial response headers"
      - "A malformed response that is missing its trailing HEADERS frame and therefore carries no grpc-status"
    answer: 0
    explanation: |
      When the server has no message to send (often an immediate error), it can
      collapse headers and trailers into one HEADERS frame with END_STREAM carrying
      :status 200 and grpc-status together.
    ref: "concepts.md#the-grpc-over-http2-wire-format"

  - id: grpc-fundamentals-and-when-to-use-017
    difficulty: intermediate
    tags: [rpc-model, rest]
    question: |
      What best captures the conceptual difference between gRPC and REST?
    options:
      - "gRPC is verb/method-oriented (call named methods); REST is noun/resource-oriented (act on resources with uniform verbs)"
      - "gRPC is inherently stateless per call, whereas REST is stateful and keeps a session open by design"
      - "gRPC always issues requests as HTTP GET, whereas REST always issues them as HTTP POST"
      - "REST supports server-push streaming natively, whereas gRPC can only ever do single request/response"
    answer: 0
    explanation: |
      In gRPC you invoke named methods with typed messages. In REST you manipulate
      resources at URIs using a uniform set of HTTP verbs. That is the core mental
      shift.
    ref: "concepts.md#the-rpc-mental-model-vs-rest-resources"

  - id: grpc-fundamentals-and-when-to-use-018
    difficulty: beginner
    tags: [rpc-types]
    question: |
      Which are the four RPC types supported by gRPC?
    options:
      - "Unary, server streaming, client streaming, bidirectional streaming"
      - "GET-style read, POST-style create, PUT-style update, and DELETE-style remove calls"
      - "Synchronous blocking, asynchronous callback, batched multi-call, and locally cached calls"
      - "Fire-and-forget request, buffered response, server push, and long-poll subscription calls"
    answer: 0
    explanation: |
      gRPC methods declare one of four shapes via the `stream` keyword: unary,
      server streaming, client streaming, and bidirectional streaming.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-fundamentals-and-when-to-use-019
    difficulty: intermediate
    tags: [rpc-types, proto]
    question: |
      What does `rpc Watch(Symbol) returns (stream Price);` declare?
    options:
      - "A client-streaming RPC"
      - "A bidirectional-streaming RPC"
      - "A server-streaming RPC"
      - "A unary RPC"
    answer: 2
    explanation: |
      `stream` only on the response side means one request produces a stream of
      responses — server streaming, e.g. a live price feed.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-fundamentals-and-when-to-use-020
    difficulty: intermediate
    tags: [rpc-types, client-streaming]
    question: |
      In a client-streaming RPC, when does the server send its single response?
    options:
      - "After each request message the client sends"
      - "Immediately when the stream opens, before any request"
      - "After the client half-closes its send side"
      - "Only if the client cancels the call"
    answer: 2
    explanation: |
      The client sends a stream of requests, then half-closes (END_STREAM). The
      server then produces one response message plus trailers.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-fundamentals-and-when-to-use-021
    difficulty: advanced
    tags: [rpc-types, bidirectional]
    question: |
      Which statement about bidirectional streaming is correct?
    options:
      - "The two directions are independent; the server can respond before the client finishes, and cadence is application-defined"
      - "The client must send and half-close its entire request stream before the server may write any response"
      - "It requires two separate HTTP/2 connections, one for the request direction and one for responses"
      - "Messages across both directions are merged into one globally ordered sequence the framework guarantees"
    answer: 0
    explanation: |
      Bidi streams are full-duplex over one HTTP/2 stream. The read and write halves
      are independent, so the request/response interleaving is entirely defined by
      the application.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-fundamentals-and-when-to-use-022
    difficulty: advanced
    tags: [streaming, ordering]
    question: |
      What ordering guarantee does gRPC give for messages?
    options:
      - "Global ordering across every RPC sharing the same channel, enforced by a per-channel sequence counter"
      - "Ordering is guaranteed only for unary calls; messages inside any streaming RPC may arrive reordered"
      - "No ordering guarantees at all, since HTTP/2 delivers DATA frames to the application out of order"
      - "Message order is preserved within a single stream, but not across separate RPCs"
    answer: 3
    explanation: |
      A single RPC rides one ordered HTTP/2 stream, so messages within it stay in
      order. There is no ordering guarantee between different RPCs.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-fundamentals-and-when-to-use-023
    difficulty: advanced
    tags: [streaming, backpressure, flow-control]
    question: |
      Where does backpressure for a slow gRPC stream consumer come from?
    options:
      - "A dedicated BACKPRESSURE frame type that gRPC defines on top of HTTP/2 for slow readers"
      - "The Protobuf compressed flag in the 5-byte prefix, which the sender flips to pause writes"
      - "TCP retransmission timers, which slow the sender once unacked segments accumulate on the socket"
      - "HTTP/2 per-stream flow-control windows, which stop advancing until the app reads messages"
    answer: 3
    explanation: |
      HTTP/2 flow control issues WINDOW_UPDATE frames only as the application reads.
      A slow consumer lets the window fill, blocking the sender — real backpressure,
      as long as you actually read rather than buffer unboundedly.
    ref: "concepts.md#streaming-semantics-backpressure-and-flow-control"

  - id: grpc-fundamentals-and-when-to-use-024
    difficulty: advanced
    tags: [streaming, gotcha, oom]
    question: |
      A team drains every incoming stream message into an unbounded in-memory queue
      as fast as it arrives, and the service OOMs under load. Why?
    options:
      - "gRPC disables HTTP/2 flow control automatically once a streaming RPC is established"
      - "The deadline was set too high, so the runtime keeps buffering messages until it expires"
      - "Protobuf messages expand in memory when queued because their unknown fields get re-decoded"
      - "By reading eagerly into an unbounded buffer, they defeated HTTP/2 flow control and lost backpressure"
    answer: 3
    explanation: |
      Backpressure only works if you let the stream block when you are behind.
      Eagerly reading into an unbounded queue tells HTTP/2 you are keeping up, so the
      sender never slows down and memory grows without bound.
    ref: "concepts.md#streaming-semantics-backpressure-and-flow-control"

  - id: grpc-fundamentals-and-when-to-use-025
    difficulty: intermediate
    tags: [status-codes]
    question: |
      Which gRPC status code corresponds to numeric value 0?
    options:
      - "OK"
      - "UNKNOWN"
      - "CANCELLED"
      - "INTERNAL"
    answer: 0
    explanation: |
      gRPC uses a flat status space of codes 0-16; 0 is OK (success). The codes are
      shared identically across all language implementations.
    ref: "concepts.md#the-status-code-model-and-error-handling"

  - id: grpc-fundamentals-and-when-to-use-026
    difficulty: advanced
    tags: [status-codes, semantics]
    question: |
      A client calls DeleteDirectory on a directory that still contains files, and
      the server refuses because the directory is non-empty. Which status code best
      fits?
    options:
      - "INVALID_ARGUMENT"
      - "NOT_FOUND"
      - "OUT_OF_RANGE"
      - "FAILED_PRECONDITION"
    answer: 3
    explanation: |
      The argument itself is fine; the system state (directory non-empty) forbids
      the operation, which is exactly FAILED_PRECONDITION. INVALID_ARGUMENT is for
      arguments bad regardless of state.
    ref: "concepts.md#the-status-code-model-and-error-handling"

  - id: grpc-fundamentals-and-when-to-use-027
    difficulty: advanced
    tags: [status-codes, retry]
    question: |
      Which status code is the canonical "transient, safe to retry" signal in gRPC?
    options:
      - "INVALID_ARGUMENT"
      - "UNIMPLEMENTED"
      - "UNAVAILABLE"
      - "PERMISSION_DENIED"
    answer: 2
    explanation: |
      UNAVAILABLE (code 14) means the service is temporarily unreachable and is the
      standard retryable code. INVALID_ARGUMENT, UNIMPLEMENTED, and PERMISSION_DENIED
      will not change on retry.
    ref: "concepts.md#the-status-code-model-and-error-handling"

  - id: grpc-fundamentals-and-when-to-use-028
    difficulty: intermediate
    tags: [status-codes, authn-authz]
    question: |
      A caller presents no credentials at all. Which status code is appropriate,
      and how does it differ from PERMISSION_DENIED?
    options:
      - "PERMISSION_DENIED for both, since gRPC treats missing and rejected credentials as one case"
      - "INVALID_ARGUMENT, because credentials are just another request argument that failed validation"
      - "UNAVAILABLE, because the auth server is a separate dependency that the call could not reach"
      - "UNAUTHENTICATED (no valid identity); PERMISSION_DENIED means identity is known but not allowed"
    answer: 3
    explanation: |
      UNAUTHENTICATED (16) means missing/invalid credentials — we do not know who you
      are. PERMISSION_DENIED (7) means we know who you are but you may not do this.
    ref: "concepts.md#the-status-code-model-and-error-handling"

  - id: grpc-fundamentals-and-when-to-use-029
    difficulty: advanced
    tags: [status-codes, rich-errors]
    question: |
      How does gRPC convey rich, structured error details (like per-field
      validation failures) beyond a code and a message?
    options:
      - "It cannot; the protocol supports only a numeric code and a short free-text message string"
      - "As a JSON object placed in the HTTP response body alongside the serialized Protobuf message"
      - "As a serialized google.rpc.Status in the grpc-status-details-bin trailer"
      - "By setting a distinct non-200 HTTP :status per error class that the client maps back to details"
    answer: 2
    explanation: |
      A serialized google.rpc.Status carrying typed details (ErrorInfo, RetryInfo,
      BadRequest.FieldViolation, etc.) is sent in the grpc-status-details-bin
      trailer, giving structured error information.
    ref: "concepts.md#the-status-code-model-and-error-handling"

  - id: grpc-fundamentals-and-when-to-use-030
    difficulty: intermediate
    tags: [deadlines, timeout]
    question: |
      How does a gRPC client communicate its call timeout to the server on the wire?
    options:
      - "As a query parameter appended to the :path, such as ?timeout=100ms on the method URL"
      - "It cannot; timeouts are enforced purely on the client side and never travel to the server"
      - "As a reserved deadline field the generator injects into every Protobuf request message body"
      - "The grpc-timeout request header (e.g. grpc-timeout: 100m for 100 ms)"
    answer: 3
    explanation: |
      The client sends grpc-timeout as an HTTP/2 request header using units H,M,S,m,u,n.
      The server sees the deadline and can abandon work once it passes.
    ref: "concepts.md#deadlines-cancellation-and-propagation"

  - id: grpc-fundamentals-and-when-to-use-031
    difficulty: advanced
    tags: [deadlines, cancellation]
    question: |
      What happens when a gRPC call's deadline expires?
    options:
      - "The server automatically retries the call once from scratch using a fresh deadline budget"
      - "The whole HTTP/2 connection is torn down, so every other RPC multiplexed on it fails too"
      - "The server runs the handler to completion but silently discards the response before sending it"
      - "The RPC is cancelled: the client gets DEADLINE_EXCEEDED and a RST_STREAM cancels the server's context so it can stop work"
    answer: 3
    explanation: |
      On expiry gRPC cancels the RPC. The client receives DEADLINE_EXCEEDED (code 4),
      and RST_STREAM cancels the server context so the handler can stop and release
      resources. Cancellation is cooperative, not a rollback.
    ref: "concepts.md#deadlines-cancellation-and-propagation"

  - id: grpc-fundamentals-and-when-to-use-032
    difficulty: advanced
    tags: [deadlines, propagation]
    question: |
      Service A receives a request with a 300 ms deadline, spends 100 ms, then calls
      service B. With deadline propagation, what deadline does B effectively see?
    options:
      - "A fresh 300 ms"
      - "No deadline — deadlines do not propagate"
      - "Roughly 200 ms, the remaining budget"
      - "100 ms, the time already spent"
    answer: 2
    explanation: |
      gRPC propagates the remaining budget as B's grpc-timeout, so the whole call
      tree shares one shrinking deadline. This prevents downstream work continuing
      after the root caller has given up.
    ref: "concepts.md#deadlines-cancellation-and-propagation"

  - id: grpc-fundamentals-and-when-to-use-033
    difficulty: advanced
    tags: [cancellation, streaming, scenario]
    question: |
      A client is consuming a long server-streaming RPC and decides it has seen
      enough. What is the correct way to stop early?
    options:
      - "Close the entire channel, which kills this stream but also aborts every other RPC sharing it"
      - "Send the reserved STOP control message that gRPC defines to signal early termination of a stream"
      - "Simply stop reading from the stream and let the underlying socket idle out on its keepalive timer"
      - "Cancel the call/context, which sends RST_STREAM(CANCEL); the server sees cancellation and the RPC ends with CANCELLED"
    answer: 3
    explanation: |
      Cancelling the call/context sends RST_STREAM(CANCEL). The server observes a
      cancelled context and the RPC terminates with status CANCELLED (code 1),
      freeing resources on both sides.
    ref: "concepts.md#deadlines-cancellation-and-propagation"

  - id: grpc-fundamentals-and-when-to-use-034
    difficulty: intermediate
    tags: [deadlines, best-practice, gotcha]
    question: |
      Why is "always set a deadline on every RPC" a core gRPC best practice?
    options:
      - "Deadlines let the runtime prune unused fields, making the serialized Protobuf message smaller"
      - "Deadlines are a required input to the TLS handshake, so a channel cannot go secure without one"
      - "gRPC hard-rejects any RPC issued without an explicit deadline, failing it fast with a client error"
      - "Without a deadline, a hung dependency causes calls to wait forever, piling up threads/goroutines and cascading into an outage"
    answer: 3
    explanation: |
      The classic gRPC incident is a stuck downstream with no deadline: callers
      block indefinitely, resources leak, and the failure cascades. A deadline
      bounds the wait and lets the system shed the stuck work.
    ref: "concepts.md#deadlines-cancellation-and-propagation"

  - id: grpc-fundamentals-and-when-to-use-035
    difficulty: intermediate
    tags: [channels, best-practice]
    question: |
      What is the recommended lifecycle for a gRPC channel?
    options:
      - "Create one long-lived, thread-safe channel per target and reuse it across calls"
      - "Tear down and recreate the channel on every RPC error so a fresh connection is used each time"
      - "Share a single global channel across all unrelated services in the process regardless of target"
      - "Create a brand-new channel for every individual RPC and close it immediately after the response"
    answer: 0
    explanation: |
      A channel is thread-safe and expensive to set up (name resolution,
      connections, LB state). Create one per logical target and reuse it; a
      channel-per-call pattern is a common performance bug.
    ref: "concepts.md#channels-subchannels-and-load-balancing"

  - id: grpc-fundamentals-and-when-to-use-036
    difficulty: advanced
    tags: [load-balancing, l4-l7]
    question: |
      Why does a plain L4 (connection-level) load balancer distribute gRPC traffic
      poorly?
    options:
      - "L4 balancers cannot parse the Protobuf payload, so they cannot decide which backend a request belongs to"
      - "L4 balancers strip the HTTP/2 trailers that carry grpc-status, so responses fail health checks and get re-routed"
      - "gRPC encrypts the destination IP inside the TLS record, hiding the real backend address from the balancer"
      - "Many RPCs are multiplexed on one long-lived HTTP/2 connection, so an L4 balancer pins all of them to whichever backend that connection landed on"
    answer: 3
    explanation: |
      Because a single HTTP/2 connection carries many RPCs and is long-lived, a
      connection-level balancer routes all of a client's calls to one backend. gRPC
      needs request-level (L7) balancing to spread individual RPCs.
    ref: "concepts.md#channels-subchannels-and-load-balancing"

  - id: grpc-fundamentals-and-when-to-use-037
    difficulty: advanced
    tags: [load-balancing, scenario, kubernetes]
    question: |
      A headless gRPC service in Kubernetes has all traffic landing on a single pod.
      What is the most likely cause and fix?
    options:
      - "TLS is misconfigured, so the handshake pins the channel to a single pod; disabling encryption lets gRPC redistribute calls across the remaining replicas"
      - "Protobuf compression is disabled, so oversized frames saturate one backend; turning on gzip shrinks messages so the resolver rotates across the pods"
      - "The pods are scheduled on different nodes, so cross-node policy blocks fan-out; co-locating every replica on one node evens out request distribution"
      - "The default pick_first policy sticks to one address on one connection; use round_robin (or xDS) with a resolver returning all pod IPs, plus MAX_CONNECTION_AGE"
    answer: 3
    explanation: |
      By default a channel uses pick_first and keeps one long-lived HTTP/2 connection
      to the first address. Switching to round_robin/xDS with a resolver that returns
      all pod IPs, and churning connections via MAX_CONNECTION_AGE, spreads load.
    ref: "concepts.md#channels-subchannels-and-load-balancing"

  - id: grpc-fundamentals-and-when-to-use-038
    difficulty: intermediate
    tags: [load-balancing, default-policy]
    question: |
      What is the default client-side load-balancing policy for a gRPC channel?
    options:
      - "round_robin"
      - "least_request"
      - "pick_first"
      - "consistent_hash"
    answer: 2
    explanation: |
      The default is pick_first, which connects to the first working address and
      does not spread load. You must select round_robin or an xDS policy (usually via
      service config) to distribute RPCs.
    ref: "concepts.md#channels-subchannels-and-load-balancing"

  - id: grpc-fundamentals-and-when-to-use-039
    difficulty: advanced
    tags: [load-balancing, lookaside, xds]
    question: |
      In a lookaside (xDS-style) load-balancing model, how is the balancing decision
      made?
    options:
      - "A middle proxy terminates every RPC and re-dispatches it, so the client never sees the real backend list and holds only one connection to the proxy"
      - "The server embeds the next backend address in each response's trailers, and the client reconnects to whichever endpoint it was just handed"
      - "The DNS resolver round-robins A records on every lookup, and the client blindly dials whatever single address it happens to receive"
      - "The client asks a control plane which backends to use, then connects directly to them"
    answer: 3
    explanation: |
      Lookaside/xDS keeps the data path direct (client to backend) while a control
      plane supplies the endpoint list and policy. It combines central control with a
      direct connection, at the cost of running a control plane.
    ref: "concepts.md#channels-subchannels-and-load-balancing"

  - id: grpc-fundamentals-and-when-to-use-040
    difficulty: intermediate
    tags: [security, credentials, mtls]
    question: |
      How does gRPC layer channel credentials and call credentials?
    options:
      - "Channel credentials secure the transport (TLS/mTLS); call credentials attach per-RPC auth data (e.g. a bearer token) as metadata"
      - "Channel credentials are re-negotiated per RPC to carry the token, while call credentials perform the one-time TLS handshake that secures the connection"
      - "They are two names for the same TLS handshake, so configuring either one automatically supplies both transport encryption and per-call authentication"
      - "Call credentials replace TLS entirely by signing each message payload, removing any need to secure the underlying transport with channel credentials"
    answer: 0
    explanation: |
      Channel credentials secure the connection once (TLS or mutual TLS). Call
      credentials attach per-call tokens as metadata (e.g. an authorization header)
      and require a secure channel.
    ref: "concepts.md#security-channel-and-call-credentials-mtls"

  - id: grpc-fundamentals-and-when-to-use-041
    difficulty: advanced
    tags: [security, composite-credentials]
    question: |
      A service must use mutual TLS AND attach a fresh OAuth2 token to each call.
      How is this expressed in gRPC?
    options:
      - "Two separate channels to the same backend, one carrying the mTLS handshake and the other carrying the OAuth2 token, correlated by a shared request id"
      - "Composite channel credentials combining the mTLS channel credentials with per-call (call) credentials"
      - "An insecure plaintext channel plus an OAuth2 token embedded in a signed Protobuf message body that the server verifies before processing"
      - "It is not possible to combine transport and per-call auth, so you must choose either mutual TLS or per-RPC tokens but never both together"
    answer: 1
    explanation: |
      CompositeChannelCredentials(TLS, callCreds) gives an mTLS connection where each
      RPC also carries a refreshed token in metadata. Call credentials require a
      secure transport.
    ref: "concepts.md#security-channel-and-call-credentials-mtls"

  - id: grpc-fundamentals-and-when-to-use-042
    difficulty: intermediate
    tags: [metadata, interceptors]
    question: |
      In gRPC metadata, what does a key ending in the `-bin` suffix indicate?
    options:
      - "The value is binary (base64/binary-safe), not plain ASCII text"
      - "The header is mandatory for the RPC, and gRPC rejects any call that omits a -bin key with an INVALID_ARGUMENT status before reaching the handler"
      - "The value is compressed with gzip on the wire, and the receiving side must inflate it before the interceptor chain can read the metadata entry"
      - "The header is a trailer delivered after the body, whereas keys without the suffix are always sent as leading request headers"
    answer: 0
    explanation: |
      Metadata keys ending in -bin carry binary values (transmitted binary-safe).
      Non -bin keys must be ASCII. This is how binary tokens or trace state travel in
      metadata.
    ref: "concepts.md#interceptors-metadata-and-observability"

  - id: grpc-fundamentals-and-when-to-use-043
    difficulty: intermediate
    tags: [interceptors]
    question: |
      What are gRPC interceptors primarily used for?
    options:
      - "Compressing Protobuf messages by sitting between the serializer and the socket to apply gzip or deflate to every payload"
      - "Defining the service's methods and message types in place of the .proto file, generating the stubs at connection time"
      - "Cross-cutting concerns (auth, logging, metrics, tracing, retries) that wrap calls without touching business logic"
      - "Establishing the TLS handshake and negotiating the mTLS certificate chain before the first request header is sent"
    answer: 2
    explanation: |
      Interceptors are gRPC's middleware. Client and server, unary and stream
      variants wrap the call to add auth, logging, metrics, tracing, and request-ID
      propagation without changing the handler code.
    ref: "concepts.md#interceptors-metadata-and-observability"

  - id: grpc-fundamentals-and-when-to-use-044
    difficulty: advanced
    tags: [observability, channelz]
    question: |
      What is channelz in gRPC?
    options:
      - "A compression codec for large messages that swaps in a dictionary-based algorithm once payloads exceed the 5-byte frame threshold"
      - "A built-in service exposing live channel/subchannel/socket stats for debugging connection and LB state"
      - "A schema-registry service that stores versioned .proto files and hands clients the correct message descriptors at startup"
      - "The default retry policy name that ships in the service config and governs backoff timing for retryable status codes"
    answer: 1
    explanation: |
      channelz is a built-in debugging service that surfaces the live state of
      channels, subchannels, and sockets — invaluable for diagnosing connection and
      load-balancing issues.
    ref: "concepts.md#interceptors-metadata-and-observability"

  - id: grpc-fundamentals-and-when-to-use-045
    difficulty: advanced
    tags: [retries, service-config, gRFC-A6]
    question: |
      How is gRPC's built-in automatic retry policy configured?
    options:
      - "By writing manual try/catch loops in each client that re-invoke the stub method after catching a StatusRuntimeException"
      - "Declaratively in service config JSON (maxAttempts, backoff, retryableStatusCodes)"
      - "By setting a GRPC_RETRY_POLICY environment variable on the server that the runtime reads at process startup"
      - "It is always on with three attempts and fixed backoff, and cannot be tuned per method by the application"
    answer: 1
    explanation: |
      Per gRFC A6, retries are declared in the service config's methodConfig
      retryPolicy: maxAttempts, initialBackoff/maxBackoff, backoffMultiplier, and the
      list of retryableStatusCodes. No per-client code needed.
    ref: "concepts.md#retries-hedging-and-keepalive"

  - id: grpc-fundamentals-and-when-to-use-046
    difficulty: advanced
    tags: [retries, idempotency, gotcha]
    question: |
      Why should automatic gRPC retries generally be limited to idempotent methods?
    options:
      - "Retrying a non-idempotent call can double-apply side effects (e.g. charge twice)"
      - "Non-idempotent methods are slower to serialize because Protobuf must recompute their field tags on every retry attempt"
      - "gRPC physically cannot retry any streaming RPC, so applying retries to a mutation silently downgrades it to a single unary attempt"
      - "Retries disable deadline propagation, so a retried mutation loses its remaining budget and runs unbounded on the downstream server"
    answer: 0
    explanation: |
      A retried non-idempotent mutation may execute more than once, duplicating side
      effects. Retries should target idempotent operations, or use idempotency keys
      (see rest-api-design/idempotency).
    ref: "concepts.md#retries-hedging-and-keepalive"

  - id: grpc-fundamentals-and-when-to-use-047
    difficulty: expert
    tags: [hedging, tail-latency, gRFC-A6]
    question: |
      How does gRPC hedging differ from retrying?
    options:
      - "Hedging waits for a failure status to return, then reissues the same call exactly once against the identical backend with no added delay"
      - "Hedging sends the same RPC to multiple backends after small delays and takes the first success, cancelling the rest — trading load for lower tail latency"
      - "Hedging only applies to client-streaming RPCs, duplicating the outbound message stream across several backends and merging their replies"
      - "Hedging is simply retrying with the exponential backoff disabled, firing each successive attempt at a fixed one-second interval"
    answer: 1
    explanation: |
      Hedging (gRFC A6) proactively fans the same request to several backends
      (staggered by hedgingDelay) and uses the first successful response, cancelling
      others. It reduces tail latency at the cost of extra load; only safe for
      idempotent calls.
    ref: "concepts.md#retries-hedging-and-keepalive"

  - id: grpc-fundamentals-and-when-to-use-048
    difficulty: expert
    tags: [keepalive, gRFC-A8, http2]
    question: |
      What mechanism does gRPC keepalive (gRFC A8) use to detect dead connections
      and keep idle ones alive?
    options:
      - "Periodic bare TCP SYN packets that probe the socket and expect a SYN-ACK before the connection is declared dead"
      - "Periodic HTTP/2 PING frames with a KEEPALIVE_TIMEOUT for the ack"
      - "Empty zero-byte Protobuf messages sent every second on the stream, whose delivery acknowledgement confirms the peer is alive"
      - "DNS re-resolution on a fixed timer, treating a failure to resolve the target hostname as evidence the connection has died"
    answer: 1
    explanation: |
      Keepalive sends HTTP/2 PING frames on idle connections (KEEPALIVE_TIME) and
      declares the connection dead if the ack does not arrive within KEEPALIVE_TIMEOUT.
      Servers can push back with GOAWAY/ENHANCE_YOUR_CALM against overly aggressive
      clients.
    ref: "concepts.md#retries-hedging-and-keepalive"

  - id: grpc-fundamentals-and-when-to-use-049
    difficulty: advanced
    tags: [schema-evolution, compatibility]
    question: |
      Which schema change is the most dangerous and breaks wire compatibility?
    options:
      - "Adding a new field with a new, previously unused field number that no released client currently reads or writes"
      - "Renaming an existing field while keeping its original field number, so the tag bytes on the wire stay identical"
      - "Reusing or changing the number of an existing field"
      - "Adding a new method to the service while leaving every existing message definition and field number unchanged"
    answer: 2
    explanation: |
      Field numbers are the wire identity. Reusing or changing an existing number
      makes old and new meanings collide, silently corrupting data. Adding new-number
      fields and renaming are wire-safe.
    ref: "concepts.md#schema-evolution-backward-and-forward-compatibility"

  - id: grpc-fundamentals-and-when-to-use-050
    difficulty: advanced
    tags: [schema-evolution, reserved]
    question: |
      When you permanently remove a field from a Protobuf message, what should you
      do to prevent future corruption?
    options:
      - "Nothing extra is needed; the protobuf compiler tracks deleted numbers across versions and refuses to compile any later reuse"
      - "Mark the field's number and name as `reserved` so no future edit can recycle them"
      - "Set the field to `required` before deleting it so old readers fail loudly instead of silently misreading the recycled number"
      - "Renumber all remaining fields to close the gap left by the removed field so the numbering stays contiguous"
    answer: 1
    explanation: |
      Use `reserved` for both the retired number(s) and name(s). This stops a later
      edit from accidentally reusing the number (data corruption) or name (source
      confusion).
    ref: "concepts.md#schema-evolution-backward-and-forward-compatibility"

  - id: grpc-fundamentals-and-when-to-use-051
    difficulty: intermediate
    tags: [schema-evolution, unknown-fields]
    question: |
      When a Protobuf parser encounters fields it does not recognize (e.g. a newer
      sender), what is the default behavior in current proto3?
    options:
      - "It rejects the entire message with a fatal parse error, failing the RPC with INVALID_ARGUMENT the moment an unrecognized tag appears"
      - "It silently drops the unknown fields on decode, so a proxy that re-encodes the message permanently loses any newer sender's data"
      - "Unknown fields are preserved, so a round-tripping proxy does not lose them"
      - "It converts each unknown field into a UTF-8 string keyed by its field number and stores it in a catch-all map"
    answer: 2
    explanation: |
      Preserving unknown fields is what makes independent client/server evolution
      safe: an intermediary can round-trip a message without dropping fields it does
      not understand, and old readers ignore new fields.
    ref: "concepts.md#schema-evolution-backward-and-forward-compatibility"

  - id: grpc-fundamentals-and-when-to-use-052
    difficulty: beginner
    tags: [strengths-weaknesses, browser]
    question: |
      Why can a web browser not call a standard gRPC service directly?
    options:
      - "Browsers block all HTTP/2 traffic by default, so no gRPC connection can ever be established from page JavaScript"
      - "Browser HTTP APIs cannot control HTTP/2 frames/trailers, so browsers need gRPC-Web plus a translating proxy"
      - "Protobuf serialization is banned by browser security policies, which permit only JSON and form-encoded request bodies"
      - "gRPC only works over UDP, and browser networking APIs expose no way to open a raw UDP socket to a server"
    answer: 1
    explanation: |
      Browsers expose fetch/XHR, not raw HTTP/2 frame and trailer control that gRPC
      needs. gRPC-Web plus a proxy (e.g. Envoy) bridges the gap for browser clients.
    ref: "concepts.md#strengths-and-weaknesses"

  - id: grpc-fundamentals-and-when-to-use-053
    difficulty: intermediate
    tags: [strengths-weaknesses, debuggability]
    question: |
      Which is a genuine weakness of gRPC relative to REST+JSON?
    options:
      - "It cannot do streaming of any kind, so every interaction must be modeled as an isolated unary request/response pair"
      - "Payloads are binary and not self-describing, so debugging needs reflection and tools like grpcurl rather than a browser or curl"
      - "It has no way to authenticate calls, forcing every service to bolt on a separate out-of-band identity layer"
      - "It only supports one programming language, so a polyglot backend must funnel every gRPC call through a single-language gateway"
    answer: 1
    explanation: |
      Protobuf bytes are compact but not human-readable or self-describing. Casual
      inspection with curl/browser devtools does not work; you need server reflection
      and tools like grpcurl.
    ref: "concepts.md#strengths-and-weaknesses"

  - id: grpc-fundamentals-and-when-to-use-054
    difficulty: intermediate
    tags: [when-to-use, judgment]
    question: |
      For which scenario is gRPC the strongest fit?
    options:
      - "A public REST-like API consumed by unknown third-party browser apps that expect human-readable JSON and simple curl-based testing"
      - "A simple server-rendered form-submission page whose responses rely heavily on HTTP GET caching and CDN edge storage to scale"
      - "A static content site served through a CDN where every asset is cached at the edge and no typed service contract is required"
      - "Low-latency, high-throughput, streaming internal service-to-service calls in a polyglot org"
    answer: 3
    explanation: |
      gRPC shines for internal (east-west), low-latency, streaming, polyglot
      service-to-service traffic with strong typed contracts. Public/browser/cache-
      heavy scenarios favor REST.
    ref: "concepts.md#when-to-use-grpc-vs-when-not-to"

  - id: grpc-fundamentals-and-when-to-use-055
    difficulty: intermediate
    tags: [when-not-to, judgment]
    question: |
      Which situation argues AGAINST choosing gRPC?
    options:
      - "You need low-latency bidirectional streaming between two internal backend microservices"
      - "A public, browser-facing API where HTTP caching, CDNs, and easy curl/Postman testing matter"
      - "A polyglot backend needing one strongly-typed contract shared by many language clients"
      - "A latency-sensitive internal RPC path where compact binary framing and multiplexing matter"
    answer: 1
    explanation: |
      Public/browser-facing APIs that rely on HTTP caching, CDNs, and human-
      inspectable payloads are better served by REST/JSON. gRPC needs gRPC-Web plus a
      proxy for browsers and lacks simple HTTP GET caching.
    ref: "concepts.md#when-to-use-grpc-vs-when-not-to"

  - id: grpc-fundamentals-and-when-to-use-056
    difficulty: advanced
    tags: [comparison, thrift, json-rpc]
    question: |
      What most distinguishes gRPC from older RPC frameworks like Apache Thrift and
      JSON-RPC?
    options:
      - "gRPC is the only one of the three that uses a compact binary serialization format on the wire"
      - "gRPC standardized on HTTP/2 (inheriting multiplexing, flow control, trailers) with native streaming in the contract and a broad polyglot ecosystem"
      - "gRPC ships with no interface definition language, unlike Thrift's rich typed IDL"
      - "JSON-RPC natively supports the bidirectional streaming that gRPC's method model cannot express"
    answer: 1
    explanation: |
      gRPC's differentiators are its HTTP/2 foundation (multiplexing, flow control,
      trailers) rather than a bespoke transport, streaming built into the contract,
      and a large well-maintained polyglot/tooling ecosystem. JSON-RPC is text and
      has no streaming/typing.
    ref: "concepts.md#grpc-vs-thrift-avro-rpc-and-json-rpc"

  - id: grpc-fundamentals-and-when-to-use-057
    difficulty: expert
    tags: [wire-type, schema-evolution]
    question: |
      Which field-type change is WIRE-compatible in Protocol Buffers because both
      share the VARINT wire type (assuming values fit)?
    options:
      - "Changing int32 to string"
      - "Changing sint32 to int32"
      - "Changing int32 to int64"
      - "Changing fixed32 to int32"
    answer: 2
    explanation: |
      int32/int64/uint32/uint64/bool/enum are all VARINT and interchange (watch for
      truncation). sint* use zig-zag encoding and are NOT compatible with plain int*,
      and fixed32 (I32) differs in wire type from int32 (VARINT).
    ref: "concepts.md#schema-evolution-backward-and-forward-compatibility"

  - id: grpc-fundamentals-and-when-to-use-058
    difficulty: intermediate
    tags: [wire-format, headers]
    question: |
      Which request header signals that a gRPC client understands HTTP/2 trailers
      (and is required by the gRPC wire protocol)?
    options:
      - "accept: application/grpc"
      - "te: trailers"
      - "connection: keep-alive"
      - "upgrade: h2c"
    answer: 1
    explanation: |
      gRPC requests carry `te: trailers`, indicating the client can process the
      trailing HEADERS frame that delivers grpc-status. Content type is
      application/grpc, and the method is always POST.
    ref: "concepts.md#the-grpc-over-http2-wire-format"

  - id: grpc-fundamentals-and-when-to-use-059
    difficulty: expert
    tags: [retries, pushback, committed]
    question: |
      Under gRPC's built-in retry policy, which statement is accurate?
    options:
      - "Any RPC can be retried at any time, even after the server has sent a response message"
      - "Retries fire only for configured retryableStatusCodes and only while the RPC is not yet committed; a server can also push back via grpc-retry-pushback-ms"
      - "Retries ignore the configured backoff entirely and fire back-to-back the instant a retryable code is seen"
      - "Retry throttling is impossible in gRPC, so a misbehaving client's retry storm can never be dampened at all"
    answer: 1
    explanation: |
      Retries apply only to the listed status codes and only before the RPC is
      committed (e.g. before the server sent a response). Servers can set
      grpc-retry-pushback-ms to control timing, and a client token-budget throttles
      retry storms.
    ref: "concepts.md#retries-hedging-and-keepalive"

  - id: grpc-fundamentals-and-when-to-use-060
    difficulty: expert
    tags: [status-codes, semantics, aborted]
    question: |
      A transactional store returns a concurrency conflict that the caller should
      retry at a higher level (e.g. re-read and re-try the transaction). Which gRPC
      status code fits best?
    options:
      - "ABORTED"
      - "INVALID_ARGUMENT"
      - "UNIMPLEMENTED"
      - "DATA_LOSS"
    answer: 0
    explanation: |
      ABORTED (10) signals a concurrency conflict such as a transaction abort, where
      the caller should retry at a higher level. INVALID_ARGUMENT and UNIMPLEMENTED
      are non-retryable; DATA_LOSS indicates unrecoverable corruption.
    ref: "concepts.md#the-status-code-model-and-error-handling"
