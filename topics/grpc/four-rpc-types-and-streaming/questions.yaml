topic: "The Four RPC Types & Streaming"
domain: grpc
topic_slug: four-rpc-types-and-streaming
version: 1
questions:
  - id: four-rpc-types-and-streaming-001
    difficulty: beginner
    tags: [rpc-types, proto3, fundamentals]
    question: |
      How many distinct RPC types does gRPC define, and what determines which
      type a given method is?
    options:
      - "Four types, fixed at schema-compile time by the presence of the stream keyword on the request and/or response"
      - "Three types, negotiated at runtime by a flag set in the request metadata during the initial handshake"
      - "Four types, selected by the generated client library when the channel first connects to the server"
      - "Two types (synchronous and asynchronous), selected by which variant of the generated stub you call"
    answer: 0
    explanation: |
      gRPC has exactly four RPC types (unary, server-streaming, client-streaming,
      bidirectional). The type is a compile-time property of the .proto method,
      decided by whether stream appears before the request type, the response
      type, both, or neither.
    ref: "concepts.md#the-four-rpc-types-at-a-glance"

  - id: four-rpc-types-and-streaming-002
    difficulty: beginner
    tags: [rpc-types, proto3, syntax]
    question: |
      In a .proto file, which declaration defines a bidirectional streaming RPC?
    options:
      - "rpc Chat(ChatEvent) returns (ChatEvent);"
      - "rpc Chat(stream ChatEvent) returns (ChatEvent);"
      - "rpc Chat(ChatEvent) returns (stream ChatEvent);"
      - "rpc Chat(stream ChatEvent) returns (stream ChatEvent);"
    answer: 3
    explanation: |
      Bidirectional streaming requires stream on BOTH the request and the response
      types. stream on request only is client-streaming; on response only is
      server-streaming; on neither is unary.
    ref: "concepts.md#the-four-rpc-types-at-a-glance"

  - id: four-rpc-types-and-streaming-003
    difficulty: beginner
    tags: [server-streaming, use-cases]
    question: |
      Which .proto signature describes a server-streaming RPC?
    options:
      - "rpc Sub(SubReq) returns (stream Msg);"
      - "rpc Sub(stream SubReq) returns (Msg);"
      - "rpc Sub(stream SubReq) returns (stream Msg);"
      - "rpc Sub(SubReq) returns (Msg);"
    answer: 0
    explanation: |
      Server streaming is one request in, a stream of responses out — so stream
      appears only before the response type. Option 1 is client-streaming, option
      2 is bidi, option 3 is unary.
    ref: "concepts.md#server-streaming-rpc"

  - id: four-rpc-types-and-streaming-004
    difficulty: intermediate
    tags: [http2, streams, mapping]
    question: |
      How does a single gRPC call (of any of the four types) map onto HTTP/2?
    options:
      - "Each individual message becomes its own separate HTTP/2 stream with its own stream id"
      - "Each direction of the call uses a separate HTTP/2 connection"
      - "Unary calls use HTTP/2 but streaming calls fall back to a raw TCP socket"
      - "The entire call — all messages in both directions plus the final status — is one HTTP/2 stream"
    answer: 3
    explanation: |
      Regardless of type, one gRPC RPC is exactly one HTTP/2 stream: request
      HEADERS, DATA frames carrying messages, half-close, response HEADERS/DATA,
      and trailers with grpc-status all belong to that single multiplexed stream.
    ref: "concepts.md#mapping-an-rpc-onto-one-http2-stream"

  - id: four-rpc-types-and-streaming-005
    difficulty: intermediate
    tags: [framing, wire-format, mechanism]
    question: |
      In the gRPC length-prefixed message framing, what are the 5 prefix bytes
      that precede each message payload inside HTTP/2 DATA frames?
    options:
      - "A 4-byte message length followed by a 1-byte checksum"
      - "A single 5-byte little-endian unsigned message length field"
      - "A 1-byte compressed flag followed by a 4-byte big-endian message length"
      - "A 1-byte message-type tag followed by a 4-byte sequence number"
    answer: 2
    explanation: |
      Each gRPC message is framed as: 1 byte compressed-flag (0/1), then a 4-byte
      big-endian unsigned length, then the payload. The length prefix lets the
      receiver delimit messages independent of HTTP/2 frame boundaries.
    ref: "concepts.md#length-prefixed-message-framing"

  - id: four-rpc-types-and-streaming-006
    difficulty: intermediate
    tags: [framing, compression, wire-format]
    question: |
      What does the first (compressed-flag) byte of a gRPC length-prefixed
      message indicate?
    options:
      - "A bitmask naming which specific compression algorithm (gzip, snappy, or deflate) was applied"
      - "The protobuf wire type and field number of the first field in the encoded payload"
      - "Whether this is the final message in the stream, signalling the receiver to stop reading"
      - "Whether the payload is compressed (1) or not (0), using the algorithm named in the grpc-encoding header"
    answer: 3
    explanation: |
      The compressed flag is a single byte: 0 = uncompressed, 1 = compressed. It
      does not name the algorithm — that comes from the grpc-encoding header (e.g.
      gzip). It is not a per-algorithm bitmask.
    ref: "concepts.md#length-prefixed-message-framing"

  - id: four-rpc-types-and-streaming-007
    difficulty: advanced
    tags: [http2, trailers, status, mechanism]
    question: |
      Where does a gRPC server put the final status code (grpc-status) of a call?
    options:
      - "In the HTTP/2 response HEADERS frame, before any body"
      - "In the last DATA frame as a special trailer message"
      - "In HTTP/2 trailers — a trailing HEADERS frame sent after the response messages"
      - "In the HTTP :status pseudo-header (e.g. 404 for NOT_FOUND)"
    answer: 2
    explanation: |
      gRPC delivers grpc-status (and optionally grpc-message) in HTTP/2 trailers,
      a trailing HEADERS frame with END_STREAM after the (possibly streamed) body.
      The HTTP :status is almost always 200; gRPC status is separate.
    ref: "concepts.md#mapping-an-rpc-onto-one-http2-stream"

  - id: four-rpc-types-and-streaming-008
    difficulty: intermediate
    tags: [http2, why-http2, design]
    question: |
      Which set of HTTP/2 capabilities is the core reason gRPC requires HTTP/2
      rather than HTTP/1.1?
    options:
      - "Binary framing, multiplexed streams, and trailers"
      - "Cookies, keep-alive, and chunked transfer encoding"
      - "Server push, WebSockets, and gzip"
      - "TLS 1.3, ALPN, and connection pooling"
    answer: 0
    explanation: |
      gRPC needs binary framing (efficient length-prefixed messages), multiplexed
      streams (concurrent RPCs and streaming over one connection), and trailers (a
      place for the final grpc-status after a streamed body). HTTP/1.1 lacks
      reliable trailers and true multiplexing.
    ref: "concepts.md#mapping-an-rpc-onto-one-http2-stream"

  - id: four-rpc-types-and-streaming-009
    difficulty: beginner
    tags: [unary, use-cases, judgment]
    question: |
      For a simple "look up a record by id" operation, which RPC type should you
      normally prefer?
    options:
      - "Server streaming, so you can page the result"
      - "Bidirectional streaming, for flexibility"
      - "Unary, since it is one request and one response"
      - "Client streaming, to batch future lookups"
    answer: 2
    explanation: |
      A single request producing a single response is the textbook unary case.
      Prefer unary unless you have a concrete streaming need — it is simplest to
      retry, cache, and load-balance per call.
    ref: "concepts.md#unary-rpc"

  - id: four-rpc-types-and-streaming-010
    difficulty: intermediate
    tags: [client-streaming, half-close, mechanism]
    question: |
      In a client-streaming RPC, how does the server know the client has finished
      sending its stream of requests?
    options:
      - "The client sends a special sentinel message with an empty body"
      - "The server counts messages until it reaches a count sent in metadata"
      - "The client half-closes (HTTP/2 END_STREAM), which the server observes as io.EOF on Recv"
      - "The underlying connection is closed and then reopened by the client to receive the response"
    answer: 2
    explanation: |
      The client explicitly half-closes (CloseAndRecv / CloseSend), setting HTTP/2
      END_STREAM on its last frame. The server's Recv loop then returns io.EOF,
      which is its cue to compute and send the single response.
    ref: "concepts.md#client-streaming-rpc"

  - id: four-rpc-types-and-streaming-011
    difficulty: intermediate
    tags: [bidi, semantics, gotcha]
    question: |
      On a bidirectional streaming RPC, does gRPC guarantee that the Nth response
      corresponds to the Nth request?
    options:
      - "Yes, gRPC transparently pairs each request with its response by tagging them with an internal sequence id"
      - "Yes, but only when both directions are declared with the same message type in the .proto definition"
      - "Only when the call's deadline is disabled, which lets gRPC buffer and align the two directions"
      - "No — the two directions are independent streams; you must correlate them in application code if needed"
    answer: 3
    explanation: |
      Bidi is full-duplex with two independent, each-internally-ordered streams.
      gRPC does not correlate responses to requests. If your protocol needs
      pairing, embed a request id in the messages and match them yourself.
    ref: "concepts.md#bidirectional-streaming-rpc"

  - id: four-rpc-types-and-streaming-012
    difficulty: intermediate
    tags: [flow-control, backpressure, http2]
    question: |
      What provides backpressure in gRPC streaming so a fast producer cannot
      overwhelm a slow consumer's memory?
    options:
      - "HTTP/2 flow-control windows: when the receiver's window fills, the sender's writes block"
      - "A fixed 100-message ring buffer per stream inside the gRPC library that drops overflow messages"
      - "TCP Nagle's algorithm, which coalesces small writes and thereby throttles the producer's send rate"
      - "The application must implement its own ack protocol; gRPC provides no built-in backpressure at all"
    answer: 0
    explanation: |
      gRPC inherits HTTP/2 flow control. Each stream (and the connection) has a
      receive window advertised via WINDOW_UPDATE. A slow reader lets the window
      fill, which blocks the sender's Send — bounding memory end-to-end for free.
    ref: "concepts.md#flow-control-and-backpressure"

  - id: four-rpc-types-and-streaming-013
    difficulty: advanced
    tags: [cancellation, http2, mechanism]
    question: |
      A client decides mid-stream that it no longer wants a long server-streaming
      response. What happens on the wire when it cancels?
    options:
      - "It sends an HTTP/2 GOAWAY frame that gracefully closes the whole underlying connection and all its streams"
      - "It sends a TCP FIN on the socket, which aborts every in-flight RPC multiplexed on that connection"
      - "It sets a cancelled boolean flag in the header of the next request message it sends on the stream"
      - "It sends an HTTP/2 RST_STREAM frame (CANCEL) that tears down just that stream; the server's context fires Done"
    answer: 3
    explanation: |
      Client cancellation sends RST_STREAM (typically error code CANCEL) for that
      single stream, leaving other multiplexed streams intact. The server observes
      cancellation via its context (ctx.Done / isCancelled) and the RPC ends
      CANCELLED.
    ref: "concepts.md#cancellation-propagation-on-a-stream"

  - id: four-rpc-types-and-streaming-014
    difficulty: intermediate
    tags: [ordering, semantics]
    question: |
      Within a single direction of one gRPC stream, if you Send(A) then Send(B),
      what ordering does the receiver observe?
    options:
      - "A then B — messages within one direction of one stream are delivered in send order"
      - "Undefined order; the transport may reorder them, so you must add explicit sequence numbers to recover order"
      - "B then A, because gRPC drains its per-stream send buffer in last-in-first-out order before flushing"
      - "They may be coalesced into a single combined message when they fit within one HTTP/2 DATA frame"
    answer: 0
    explanation: |
      gRPC guarantees per-direction, per-stream ordering: messages arrive in the
      order sent. What is NOT ordered is cross-direction interleaving on bidi, and
      ordering across different streams/RPCs.
    ref: "concepts.md#ordering-guarantees-within-a-stream"

  - id: four-rpc-types-and-streaming-015
    difficulty: advanced
    tags: [streaming-vs-repeated, judgment, design]
    question: |
      You must return a bounded page of ~50 results that fits comfortably in
      memory. Which design is usually preferable and why?
    options:
      - "Server streaming, because streaming is always more scalable"
      - "Bidirectional streaming, to allow the client to adjust the page mid-flight"
      - "Unary RPC returning a repeated field, because it is simpler, atomic, and easy to retry/cache"
      - "Client streaming, to let the client request each item one at a time"
    answer: 2
    explanation: |
      For bounded batches, unary + repeated is simpler (looks like a function
      call), atomic, easy to retry and cache, and does not pin the call to one
      backend. Reserve streaming for unbounded/incremental/long-lived data.
    ref: "concepts.md#streaming-vs-repeated-fields-in-a-unary-call"

  - id: four-rpc-types-and-streaming-016
    difficulty: advanced
    tags: [streaming, load-balancing, judgment]
    question: |
      Why can a long-lived server-streaming subscription be awkward for load
      balancing and rolling deploys compared to unary calls?
    options:
      - "Because the whole stream is pinned to one backend and connection for its entire lifetime"
      - "Because opening a long-lived stream disables TLS session resumption on that connection"
      - "Because streamed responses cannot be compressed, so they saturate the backend's outbound bandwidth"
      - "Because HTTP/2 forbids more than one concurrent stream per connection once streaming begins"
    answer: 0
    explanation: |
      A stream lives on one HTTP/2 stream on one connection to one backend for its
      whole life, so per-request balancing can't spread it and draining that
      backend during a deploy waits for the stream to end. Unary calls balance
      freely.
    ref: "concepts.md#streaming-vs-repeated-fields-in-a-unary-call"

  - id: four-rpc-types-and-streaming-017
    difficulty: intermediate
    tags: [half-close, cancellation, gotcha]
    question: |
      What is the difference between half-closing a stream and cancelling it?
    options:
      - "They are interchangeable synonyms in gRPC that both end the RPC in exactly the same way"
      - "Half-close aborts the RPC immediately with CANCELLED, while cancel merely pauses it until it is resumed"
      - "Half-close means 'no more messages from me' while the RPC stays alive; cancel tears the whole RPC down"
      - "Half-close is available only to the server side, while cancellation is available only to the client side"
    answer: 2
    explanation: |
      Half-close (END_STREAM) signals a sender is done sending but the RPC
      continues — you still expect the response/status. Cancellation (RST_STREAM)
      terminates the entire RPC with CANCELLED.
    ref: "concepts.md#half-close-and-end-of-stream-semantics"

  - id: four-rpc-types-and-streaming-018
    difficulty: advanced
    tags: [bidi, concurrency, gotcha]
    question: |
      A bidirectional stream hangs forever. Both peers are blocked calling Recv,
      each waiting for the other to Send. What is the root cause and typical fix?
    options:
      - "A TLS renegotiation loop stalls the handshake; the fix is to disable mTLS on the stream"
      - "The configured max-message-size is too small to hold a queued message; raise it on both peers"
      - "HPACK header-compression state corruption blocks the frames; disable compression to recover"
      - "Mutual blocking / deadlock; run the send loop and receive loop concurrently on each side"
    answer: 3
    explanation: |
      Because reads and writes are independent in bidi, blocking both on Recv
      deadlocks. Each side should run send and receive concurrently (e.g. separate
      goroutines / async observers) and ensure half-close eventually happens.
    ref: "concepts.md#bidirectional-streaming-rpc"

  - id: four-rpc-types-and-streaming-019
    difficulty: intermediate
    tags: [server-streaming, client-loop, eof]
    question: |
      In a Go client consuming a server-streaming RPC, what does stream.Recv()
      returning io.EOF mean?
    options:
      - "A transport error occurred mid-stream and the call failed with UNAVAILABLE"
      - "The client should call Recv again to retry receiving the interrupted message"
      - "The server cleanly ended the stream (status OK); there are no more messages"
      - "The call's configured deadline expired before the server finished responding"
    answer: 2
    explanation: |
      io.EOF is the clean end-of-stream signal: the server finished sending and
      returned OK. A non-nil, non-EOF error indicates an actual RPC failure. The
      client should stop looping on EOF.
    ref: "concepts.md#server-streaming-rpc"

  - id: four-rpc-types-and-streaming-020
    difficulty: advanced
    tags: [framing, max-message-size, resource-exhausted]
    question: |
      A client tries to send a single 40 MiB message on a server with the default
      4 MiB max receive message size. What typically happens?
    options:
      - "The message is silently truncated to the 4 MiB limit and the rest is dropped"
      - "gRPC automatically splits it into several 4 MiB messages and reassembles them"
      - "The message is transparently gzip-compressed until it fits under the limit"
      - "The RPC fails with RESOURCE_EXHAUSTED because it exceeds the max message size"
    answer: 3
    explanation: |
      Although the 4-byte length prefix allows huge messages, servers enforce a
      max receive size (commonly 4 MiB) to bound memory. Exceeding it fails the
      RPC with RESOURCE_EXHAUSTED. Chunk the payload (streaming) or raise the limit
      deliberately.
    ref: "concepts.md#length-prefixed-message-framing"

  - id: four-rpc-types-and-streaming-021
    difficulty: intermediate
    tags: [http2, headers, method]
    question: |
      What HTTP method does gRPC use for every call, and what carries the method
      name being invoked?
    options:
      - "Always POST; the gRPC method is in the :path pseudo-header as /package.Service/Method"
      - "GET for unary and POST for streaming; the method name rides in a URL query parameter"
      - "Always PUT; the invoked method name travels in a dedicated grpc-method request header"
      - "The verb varies by RPC type; the method name is embedded in the request body"
    answer: 0
    explanation: |
      gRPC always uses POST. The fully qualified method is encoded in the HTTP/2
      :path pseudo-header as /<package>.<Service>/<Method>, alongside content-type:
      application/grpc and any grpc-timeout.
    ref: "concepts.md#mapping-an-rpc-onto-one-http2-stream"

  - id: four-rpc-types-and-streaming-022
    difficulty: intermediate
    tags: [client-streaming, use-cases, judgment]
    question: |
      Which scenario is the best fit for a client-streaming RPC?
    options:
      - "Fetching a single user's profile record by its unique id in one quick round trip"
      - "A realtime chat room where many participants exchange messages back and forth continuously"
      - "Subscribing to a live market price feed that pushes continuous updates to the client"
      - "Uploading a large file as a sequence of chunks that the server aggregates into one summary response"
    answer: 3
    explanation: |
      Client streaming is stream-of-requests to one-response: ideal for uploads and
      aggregation. Profile fetch is unary, chat is bidi, and a live feed is
      server-streaming.
    ref: "concepts.md#client-streaming-rpc"

  - id: four-rpc-types-and-streaming-023
    difficulty: advanced
    tags: [cancellation, propagation, deadline]
    question: |
      Service A handles a client call and, while doing so, makes an outbound gRPC
      call to service B. The client cancels the A call. What must A do so B's work
      is also cancelled?
    options:
      - "Nothing; gRPC automatically cancels all downstream calls globally across the whole call tree"
      - "Close the entire underlying connection to B, which aborts every RPC multiplexed on it"
      - "Propagate the incoming context to the outbound call to B, so cancellation flows downstream"
      - "Send a special application-level cancel message as the last request on the B stream"
    answer: 2
    explanation: |
      Cancellation propagates through the context. If A passes its incoming ctx to
      the B call, cancelling A's call cancels B's too. Forgetting to propagate the
      context leaks work on downstream services.
    ref: "concepts.md#cancellation-propagation-on-a-stream"

  - id: four-rpc-types-and-streaming-024
    difficulty: intermediate
    tags: [multiplexing, http2, streaming]
    question: |
      True or false: a long-lived server-streaming subscription monopolizes the
      TCP connection so no other RPCs can use it.
    options:
      - "True — a single active stream fully occupies the underlying TCP connection until it ends"
      - "True, unless per-message compression is enabled, which frees the connection for other calls"
      - "False — HTTP/2 multiplexes many streams over one connection, so other RPCs run concurrently"
      - "False, but only while the subscription is idle and not actively pushing any messages"
    answer: 2
    explanation: |
      HTTP/2 multiplexes many independent streams over one connection. A streaming
      RPC occupies one stream, not the whole connection, so other unary and
      streaming calls proceed concurrently. This is what makes long-lived
      subscriptions cheap.
    ref: "concepts.md#mapping-an-rpc-onto-one-http2-stream"

  - id: four-rpc-types-and-streaming-025
    difficulty: advanced
    tags: [ordering, exactly-once, retries]
    question: |
      Which statement about gRPC stream delivery guarantees is correct?
    options:
      - "gRPC guarantees exactly-once delivery of every message, deduplicating any retried sends automatically"
      - "gRPC guarantees a single total global order across every stream multiplexed on the connection"
      - "gRPC guarantees at-most-once delivery and never re-sends a message under any circumstances"
      - "gRPC guarantees per-direction ordering within a stream but not exactly-once; a retried RPC may re-send messages"
    answer: 3
    explanation: |
      Ordering is preserved per direction within one stream, but that is not the
      same as delivery-count guarantees. Retries (gRFC A6) can re-send, so design
      idempotency at the application layer. There is no global cross-stream order.
    ref: "concepts.md#ordering-guarantees-within-a-stream"

  - id: four-rpc-types-and-streaming-026
    difficulty: intermediate
    tags: [framing, frame-boundaries, mechanism]
    question: |
      How does a gRPC receiver find message boundaries, given that a message may
      span multiple HTTP/2 DATA frames?
    options:
      - "By scanning for a reserved delimiter byte sequence inserted between consecutive messages"
      - "By assuming exactly one whole message is carried per HTTP/2 DATA frame it receives"
      - "By the 4-byte length prefix in each length-prefixed message, independent of DATA frame boundaries"
      - "By reading a total message count advertised up front in the request HEADERS frame"
    answer: 2
    explanation: |
      The 4-byte big-endian length prefix tells the receiver exactly how many
      payload bytes follow. Because framing is length-based, message boundaries are
      decoupled from HTTP/2 frame boundaries — one message may span frames and one
      frame may hold several messages.
    ref: "concepts.md#length-prefixed-message-framing"

  - id: four-rpc-types-and-streaming-027
    difficulty: advanced
    tags: [flow-control, async, gotcha]
    question: |
      In an async gRPC API (e.g. Java/C-core), why is it wrong to call onNext in a
      tight loop to push a large server stream as fast as possible?
    options:
      - "Because onNext may legally be invoked only once per RPC, so a loop throws an error"
      - "Because each onNext call opens a brand-new HTTP/2 stream, exhausting the connection's limit"
      - "Because it ignores the isReady/onReady flow-control signal and buffers unboundedly in memory"
      - "Because onNext synchronously blocks the entire shared server event loop by design"
    answer: 2
    explanation: |
      Async APIs expose flow control via isReady()/onReadyHandler. Pushing with
      onNext regardless of readiness queues messages in memory ahead of the
      flow-control window, defeating backpressure and risking OOM. Respect the
      readiness signal.
    ref: "concepts.md#flow-control-and-backpressure"

  - id: four-rpc-types-and-streaming-028
    difficulty: beginner
    tags: [bidi, use-cases]
    question: |
      Which application is the canonical fit for bidirectional streaming?
    options:
      - "A one-shot configuration fetch that returns the current settings in a single response"
      - "A batch import of many records that returns just one aggregated summary at the end"
      - "A realtime chat where both sides send and receive messages independently and continuously"
      - "A paginated search API that returns one bounded page of results per request token"
    answer: 2
    explanation: |
      Bidi shines for full-duplex, long-lived, independent send/receive workloads:
      chat, collaborative editing, realtime telemetry with control messages. The
      other options are unary, client-streaming, and unary+pagination respectively.
    ref: "concepts.md#bidirectional-streaming-rpc"

  - id: four-rpc-types-and-streaming-029
    difficulty: advanced
    tags: [server-streaming, backpressure, server-side]
    question: |
      In a server-streaming handler, a slow client cannot keep up with the
      messages the server produces. What happens when the server calls Send?
    options:
      - "Send fails immediately with an UNAVAILABLE status because the client cannot keep up"
      - "Send blocks (backpressure) until the client's flow-control window reopens; this is expected, not an error"
      - "gRPC silently drops the oldest queued messages to make room for newer ones"
      - "The server automatically switches from streaming to a single buffered unary response"
    answer: 1
    explanation: |
      Backpressure from HTTP/2 flow control causes Send to block when the receiver
      window is full. This is desired behavior that bounds server memory — a slow
      reader slows the writer rather than causing unbounded buffering.
    ref: "concepts.md#flow-control-and-backpressure"

  - id: four-rpc-types-and-streaming-030
    difficulty: intermediate
    tags: [client-streaming, half-close, gotcha]
    question: |
      A client-streaming server handler never produces its response and the RPC
      only ends when the deadline fires. What is the most likely bug?
    options:
      - "The client never half-closes, so the server's Recv loop never sees io.EOF"
      - "The server negotiated the wrong compression algorithm and cannot decode the requests"
      - "The client sent too few request messages for the server to reach its minimum batch"
      - "The response message type is declared larger than the request type in the .proto"
    answer: 0
    explanation: |
      If the client forgets to half-close (CloseSend/CloseAndRecv), the server's
      Recv never returns io.EOF, so it waits forever for more requests instead of
      sending its response — until the deadline aborts the call.
    ref: "concepts.md#half-close-and-end-of-stream-semantics"

  - id: four-rpc-types-and-streaming-031
    difficulty: intermediate
    tags: [server-half-close, trailers, mechanism]
    question: |
      How does a gRPC server end an RPC — does it half-close its send direction
      separately from completing the call?
    options:
      - "Yes, it first half-closes its send direction, then later sends a separate completion signal"
      - "No — it ends the RPC by sending trailers with grpc-status, which closes its direction and completes the call at once"
      - "It closes the underlying TCP connection to signal to the client that the call is over"
      - "It sends an empty final sentinel message that the client interprets as end-of-stream"
    answer: 1
    explanation: |
      The server does not half-close separately. It ends the whole RPC by emitting
      trailers (a trailing HEADERS frame with END_STREAM) carrying grpc-status,
      which simultaneously closes its send direction and completes the call.
    ref: "concepts.md#half-close-and-end-of-stream-semantics"

  - id: four-rpc-types-and-streaming-032
    difficulty: advanced
    tags: [cancellation, semantics, gotcha]
    question: |
      Which statement about gRPC cancellation is most accurate?
    options:
      - "Cancellation transactionally rolls back any side effects the server already performed"
      - "Cancellation is best-effort and racy — the server may have already produced work; it controls the stream, not distributed transactions"
      - "Cancellation guarantees the server never started processing the request at all"
      - "Cancellation is only possible before the very first message is sent on the stream"
    answer: 1
    explanation: |
      Cancellation tears down the stream but is best-effort: in-flight work and
      side effects don't roll back, and the server may have produced a response the
      client discards. Handlers should be cancellation-aware and idempotent.
    ref: "concepts.md#cancellation-propagation-on-a-stream"

  - id: four-rpc-types-and-streaming-033
    difficulty: intermediate
    tags: [deadline, cancellation, grpc-timeout]
    question: |
      How does a client's deadline relate to cancellation on a stream?
    options:
      - "Deadlines are entirely unrelated to cancellation and use a separate wire mechanism"
      - "When the grpc-timeout elapses, the client cancels the call and it ends with DEADLINE_EXCEEDED"
      - "Deadline expiry merely pauses the stream until the client explicitly resumes it later"
      - "Deadlines only apply to unary calls and are ignored on any of the streaming RPC types"
    answer: 1
    explanation: |
      A deadline is effectively an automatic cancellation: once grpc-timeout
      elapses the client cancels locally (RST_STREAM) and the RPC ends
      DEADLINE_EXCEEDED. Deadlines apply to all four RPC types. Details live in the
      deadlines topic.
    ref: "concepts.md#cancellation-propagation-on-a-stream"

  - id: four-rpc-types-and-streaming-034
    difficulty: beginner
    tags: [unary, wire, mechanism]
    question: |
      Is a unary call any different from a streaming call in terms of using an
      HTTP/2 stream?
    options:
      - "No — a unary call is still a full HTTP/2 stream: HEADERS, one DATA message, half-close, response, trailers"
      - "Yes — unary calls skip HTTP/2 entirely and use a lightweight dedicated request/response socket"
      - "Yes — unary calls omit trailers entirely and carry grpc-status in the response HEADERS instead"
      - "No — but unary calls run over HTTP/1.1 while only the streaming types require HTTP/2"
    answer: 0
    explanation: |
      Unary is not a special transport. It is a full HTTP/2 stream with request
      HEADERS, one length-prefixed DATA message, an implicit client half-close,
      response HEADERS/DATA, and trailers carrying grpc-status — same machinery as
      streaming, just one message each way.
    ref: "concepts.md#unary-rpc"

  - id: four-rpc-types-and-streaming-035
    difficulty: advanced
    tags: [client-streaming, early-response, gotcha]
    question: |
      During a client-streaming upload, can the server send its response and close
      before the client has finished sending all its chunks?
    options:
      - "No, the server must always wait for the client's explicit half-close before responding"
      - "Yes — e.g. it validates an early chunk and rejects; a robust client checks the return of every Send"
      - "No, sending a response before the client half-closes violates the HTTP/2 specification"
      - "Yes, but early responses like this are only permitted on plain unary RPCs"
    answer: 1
    explanation: |
      The server may respond and set status before the client half-closes (for
      example rejecting after the first chunk). That closes the stream, so
      subsequent client Sends will fail — a well-written client checks each Send's
      return value.
    ref: "concepts.md#client-streaming-rpc"

  - id: four-rpc-types-and-streaming-036
    difficulty: intermediate
    tags: [server-streaming, use-cases, judgment]
    question: |
      You need to tail a continuously growing log to a client in near-real-time,
      with no known end. Which RPC type fits best?
    options:
      - "Unary returning a repeated field"
      - "Client streaming"
      - "Server streaming"
      - "A sequence of separate unary polls"
    answer: 2
    explanation: |
      Server streaming (one request, an open-ended stream of responses) is the
      natural fit for tailing/subscription feeds with no fixed end. Unary+repeated
      is for bounded results; client streaming is upload-shaped; polling is
      chattier and higher-latency.
    ref: "concepts.md#server-streaming-rpc"

  - id: four-rpc-types-and-streaming-037
    difficulty: advanced
    tags: [pagination, streaming-vs-repeated, judgment]
    question: |
      For a large-but-finite result set (say 200k rows) that operators want to
      spread across backends and that must survive backend restarts gracefully,
      which approach is often best?
    options:
      - "One long-lived server stream that emits all 200k rows in a single open-ended subscription call"
      - "A paginated unary API (request + page_token) so each page is an independent, load-balanced, retryable call"
      - "A bidirectional stream where the client sends an explicit ack for every one of the 200k rows it receives"
      - "A single unary call that returns all 200k rows at once in one giant repeated field in the response"
    answer: 1
    explanation: |
      Pagination via unary + page_token keeps each call short, independently
      load-balanced and retryable, and avoids pinning a long stream to one backend
      (which drains slowly on deploys). A single huge repeated field risks
      max-message-size and memory blowups.
    ref: "concepts.md#streaming-vs-repeated-fields-in-a-unary-call"

  - id: four-rpc-types-and-streaming-038
    difficulty: intermediate
    tags: [ordering, bidi, semantics]
    question: |
      On a bidi stream, which ordering is NOT guaranteed by gRPC?
    options:
      - "The order of the client's own outbound messages relative to one another within its own direction"
      - "The order of the server's own outbound messages relative to one another within its own direction"
      - "A global interleaving order between the client's messages and the server's messages"
      - "That each direction's messages are delivered to the peer in the exact order they were sent"
    answer: 2
    explanation: |
      Each direction is independently ordered, but there is no defined global
      interleaving between the client's send sequence and the server's send
      sequence, and no request-to-response pairing. Only per-direction order holds.
    ref: "concepts.md#ordering-guarantees-within-a-stream"

  - id: four-rpc-types-and-streaming-039
    difficulty: advanced
    tags: [framing, endianness, spec]
    question: |
      In the gRPC message length prefix, how is the 4-byte length encoded?
    options:
      - "Little-endian signed 32-bit, so the low-order byte of the length arrives first on the wire"
      - "Big-endian (network byte order) unsigned 32-bit"
      - "A variable-length base-128 varint, exactly like the length delimiter protobuf uses for field tags"
      - "ASCII decimal digits terminated by a newline, the way HTTP/1.1 chunked-transfer sizes each chunk"
    answer: 1
    explanation: |
      The length is a 4-byte big-endian (network byte order) unsigned 32-bit
      integer. It is a fixed-width prefix, not a protobuf varint — the framing
      layer is codec-agnostic and separate from protobuf's own encoding.
    ref: "concepts.md#length-prefixed-message-framing"

  - id: four-rpc-types-and-streaming-040
    difficulty: intermediate
    tags: [server-streaming, half-close, unary]
    question: |
      In unary and server-streaming RPCs, when does the client half-close its send
      direction?
    options:
      - "Only after it has received and fully consumed the server's complete response and trailers"
      - "Automatically right after sending its single request message, since it has nothing more to send"
      - "It never half-closes at all; only the server ever half-closes its direction in these RPC types"
      - "Only after the application explicitly calls CloseSend, which is mandatory for every RPC type"
    answer: 1
    explanation: |
      Because the client sends exactly one request in unary and server-streaming,
      it half-closes implicitly right after that message. Explicit CloseSend is
      needed only for client-streaming and bidi where the client sends many
      messages.
    ref: "concepts.md#half-close-and-end-of-stream-semantics"

  - id: four-rpc-types-and-streaming-041
    difficulty: advanced
    tags: [cancellation, server-side, best-practice]
    question: |
      What is the recommended way for a server streaming handler to behave when
      the client cancels?
    options:
      - "Ignore the cancellation entirely and keep producing every remaining message until the loop finishes"
      - "Check for cancellation (ctx.Done / isCancelled) in the stream loop, stop work, release resources, and return promptly"
      - "Throw an unhandled exception to deliberately crash the request-handling thread and force a teardown"
      - "Restart the whole stream from the very first message and replay all responses to the client again"
    answer: 1
    explanation: |
      A cancellation-aware handler observes the cancelled context in its loop and
      stops pushing into a dead stream, releasing resources. Continuing to produce
      messages wastes work and pushing into a cancelled stream errors anyway.
    ref: "concepts.md#cancellation-propagation-on-a-stream"

  - id: four-rpc-types-and-streaming-042
    difficulty: intermediate
    tags: [http2, content-type, headers]
    question: |
      Which header identifies a request as gRPC on the wire?
    options:
      - "An Accept: application/grpc request header that the server echoes back to confirm gRPC handling"
      - "A custom X-Grpc: true request header that gRPC clients attach to every outbound call for routing"
      - "content-type: application/grpc (with variants like application/grpc+proto)"
      - "An Upgrade: grpc/2.0 header sent to switch the plain HTTP/1.1 connection into gRPC framing mode"
    answer: 2
    explanation: |
      gRPC requests carry content-type: application/grpc (optionally with a
      subtype such as +proto or +json). Proxies and servers use it to route/handle
      gRPC. There is no Upgrade handshake — gRPC assumes HTTP/2 (via prior knowledge
      or ALPN).
    ref: "concepts.md#mapping-an-rpc-onto-one-http2-stream"

  - id: four-rpc-types-and-streaming-043
    difficulty: expert
    tags: [framing, compression, gotcha]
    question: |
      A team confuses the per-message compressed-flag byte with the grpc-message
      trailer. Which statement correctly distinguishes them?
    options:
      - "They are ultimately the same underlying field, just surfaced by different layers of the gRPC stack"
      - "The compressed-flag is a 1-byte per-message framing field (0/1); grpc-message is a human-readable error description sent in trailers"
      - "grpc-message carries the negotiated compression algorithm name while the flag byte carries the error text"
      - "Both live together in the leading HEADERS frame that the server sends before any of the response body"
    answer: 1
    explanation: |
      The compressed flag is the first byte of each length-prefixed message and
      only indicates compressed vs not. grpc-message is optional human-readable
      error text carried in trailers alongside grpc-status. They are unrelated.
    ref: "concepts.md#length-prefixed-message-framing"

  - id: four-rpc-types-and-streaming-044
    difficulty: expert
    tags: [streaming, retries, resiliency, gRFC-A6]
    question: |
      Why are automatic retries harder for streaming RPCs than for unary RPCs?
    options:
      - "Streaming RPCs are unable to carry a deadline, so the retry layer has no timeout to bound its attempts"
      - "A stream may have made partial progress (messages sent/received), so replaying it is not a clean idempotent redo"
      - "HTTP/2 explicitly forbids resending any stream once its stream id has been closed with RST_STREAM"
      - "Streaming RPCs report failures using a completely different status-code set that the retry policy can't map"
    answer: 1
    explanation: |
      A failed stream may already have exchanged messages or produced side effects,
      so a naive retry can duplicate or reorder work. Unary is a single
      request/response, far easier to retry idempotently. Retry policy details are
      in the resiliency topic and gRFC A6.
    ref: "concepts.md#streaming-vs-repeated-fields-in-a-unary-call"

  - id: four-rpc-types-and-streaming-045
    difficulty: intermediate
    tags: [rpc-types, mapping, summary]
    question: |
      Match the shape: "stream of requests in, exactly one response out" is which
      RPC type?
    options:
      - "Server streaming"
      - "Bidirectional streaming"
      - "Client streaming"
      - "Unary"
    answer: 2
    explanation: |
      Stream-in, single-response-out is client streaming (uploads/aggregation).
      Server streaming is one-in/many-out, bidi is many/many, unary is one/one.
    ref: "concepts.md#the-four-rpc-types-at-a-glance"

  - id: four-rpc-types-and-streaming-046
    difficulty: advanced
    tags: [http2, streams, isolation]
    question: |
      A single RST_STREAM sent to cancel one gRPC call on a multiplexed connection
      affects what?
    options:
      - "Every stream on that connection, aborting all the other RPCs multiplexed alongside the cancelled one"
      - "The whole underlying TCP connection is reset, forcing every peer to reconnect from scratch"
      - "Only the streams that were created after the cancelled one, leaving earlier in-flight streams running"
      - "Only the one stream identified by that stream id; other multiplexed RPCs are unaffected"
    answer: 3
    explanation: |
      RST_STREAM is scoped to a single HTTP/2 stream id, so cancelling one RPC
      leaves the other multiplexed streams on the connection running. Resetting the
      whole connection would use GOAWAY, which is a different mechanism.
    ref: "concepts.md#cancellation-propagation-on-a-stream"

  - id: four-rpc-types-and-streaming-047
    difficulty: expert
    tags: [flow-control, bidi, deadlock, mechanism]
    question: |
      On a bidi stream, both windows fill: the server is blocked writing (client's
      receive window full) while the client is blocked writing (server's receive
      window full), and neither is reading. What is this, and how is it avoided?
    options:
      - "A protobuf encoding mismatch between the peers; regenerate both sets of stubs from the shared .proto"
      - "A flow-control deadlock; avoid it by always reading (draining) concurrently while writing"
      - "Expected HTTP/2 head-of-line blocking that is inherent to the protocol, so nothing can be done about it"
      - "A TLS record-buffering issue in the transport; disable encryption on the stream to let the frames flow"
    answer: 1
    explanation: |
      If both peers write without reading, each fills the other's flow-control
      window and both writes block — a deadlock. The fix is to run receive loops
      concurrently with send loops so windows keep reopening via WINDOW_UPDATE.
    ref: "concepts.md#flow-control-and-backpressure"

  - id: four-rpc-types-and-streaming-048
    difficulty: intermediate
    tags: [streaming-vs-repeated, memory, judgment]
    question: |
      Which is a genuine advantage of server streaming over a unary call returning
      a large repeated field?
    options:
      - "It guarantees exactly-once delivery of each item by deduplicating any messages that get retried"
      - "It is always faster end-to-end because streamed responses skip the per-message length-prefix framing"
      - "The consumer can process items incrementally with bounded memory and sees the first item before the last is ready"
      - "It removes the need for deadlines, since a streaming call manages its own lifetime without a timeout"
    answer: 2
    explanation: |
      Streaming delivers incrementally: the receiver processes one message at a
      time (bounded memory) and gets first-byte-sooner latency, with per-message
      backpressure. A single repeated field materializes the whole set on both
      sides. It doesn't change delivery guarantees or remove deadlines.
    ref: "concepts.md#streaming-vs-repeated-fields-in-a-unary-call"
