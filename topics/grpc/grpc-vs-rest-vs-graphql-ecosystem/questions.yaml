topic: "gRPC vs REST vs GraphQL & Ecosystem"
domain: grpc
topic_slug: grpc-vs-rest-vs-graphql-ecosystem
version: 1
questions:
  - id: grpc-vs-rest-vs-graphql-ecosystem-001
    difficulty: beginner
    tags: [comparison, interaction-model]
    question: |
      Which phrase best captures the fundamental *interaction model* difference
      among the three approaches?
    options:
      - "gRPC = call a function; REST = manipulate a resource; GraphQL = ask for exactly the data you want"
      - "All three are fundamentally resource-oriented and differ only in payload format and endpoint naming"
      - "gRPC and GraphQL are both query languages, while REST is really a remote-procedure-call framework"
      - "REST = binary RPC over sockets; gRPC = text-based resource CRUD; GraphQL = a streaming transport"
    answer: 0
    explanation: |
      The core distinction is the interaction model, not the wire format: gRPC is
      remote-procedure-call (invoke a method), REST is resource + verb, and GraphQL
      is a client-driven query language that returns exactly the requested fields.
    ref: "concepts.md#the-three-paradigms-at-a-glance"

  - id: grpc-vs-rest-vs-graphql-ecosystem-002
    difficulty: beginner
    tags: [rest, transport]
    question: |
      A key transport-level difference between gRPC and REST is that gRPC:
    options:
      - "Can run over any HTTP version, just like plain REST does"
      - "Uses raw TCP sockets with no HTTP layer involved at all"
      - "Requires HTTP/3 with QUIC, whereas REST is pinned to HTTP/2"
      - "Requires HTTP/2, whereas REST can run over any HTTP version"
    answer: 3
    explanation: |
      gRPC mandates HTTP/2 (it depends on multiplexed streams and trailers). REST
      is transport-agnostic and works over HTTP/1.1, HTTP/2, or HTTP/3.
    ref: "concepts.md#grpc-vs-rest"

  - id: grpc-vs-rest-vs-graphql-ecosystem-003
    difficulty: intermediate
    tags: [rest, caching]
    question: |
      For a read-heavy *public* API, one strong argument for REST over gRPC is:
    options:
      - "REST JSON payloads are always smaller on the wire than binary Protobuf, since text compresses more aggressively"
      - "REST supports full bidirectional streaming natively over HTTP/1.1, whereas gRPC is limited to request/response"
      - "REST GET responses are cacheable by browsers, CDNs, and proxies via Cache-Control/ETag, while gRPC (POST/binary) gets no HTTP caching"
      - "REST enforces a strong, compile-time contract with mandatory client codegen, while gRPC contracts are hand-written"
    answer: 2
    explanation: |
      HTTP caching is native to REST GETs; a cache/CDN hit beats any origin
      serialization speed. gRPC uses POST with binary bodies and cannot leverage
      HTTP caching, which matters a lot for read-heavy public traffic.
    ref: "concepts.md#grpc-vs-rest"

  - id: grpc-vs-rest-vs-graphql-ecosystem-004
    difficulty: intermediate
    tags: [browser, grpc-web]
    question: |
      Why can't a browser call a raw gRPC service directly from JavaScript?
    options:
      - "Browsers refuse to make any HTTP requests to non-HTTPS endpoints, and gRPC servers only listen on plaintext ports"
      - "Protocol Buffers is a closed, proprietary wire format that browser engines are contractually forbidden from parsing"
      - "Browser JS cannot control HTTP/2 framing or read trailers (where grpc-status lives), so gRPC-Web plus a translating proxy is required"
      - "gRPC only runs over UDP datagrams, a transport that browser sandboxes block entirely for security reasons"
    answer: 2
    explanation: |
      Browser fetch/XHR do not expose HTTP/2 frame control or trailers, and gRPC
      carries its status in trailers. So browsers use gRPC-Web (a variant wire
      format) through a proxy such as Envoy's grpc_web filter or Connect.
    ref: "concepts.md#browser-reachability-and-third-party-reach"

  - id: grpc-vs-rest-vs-graphql-ecosystem-005
    difficulty: intermediate
    tags: [graphql, over-fetching]
    question: |
      What problem does GraphQL solve by design that fixed-method gRPC does not?
    options:
      - "It eliminates the need for any schema, inferring response types dynamically at query time"
      - "It makes all responses automatically cacheable by CDNs and browser proxies with no setup"
      - "It guarantees lower end-to-end latency than any binary RPC protocol, including Protobuf-based ones"
      - "It lets the client request exactly the fields it needs, addressing over-fetching and under-fetching"
    answer: 3
    explanation: |
      GraphQL's query language lets clients specify precisely which fields to
      return across possibly many sources in one round trip, directly attacking
      over-fetching (unneeded fields) and under-fetching (N calls to build a view).
      gRPC methods return their whole fixed response message.
    ref: "concepts.md#grpc-vs-graphql"

  - id: grpc-vs-rest-vs-graphql-ecosystem-006
    difficulty: intermediate
    tags: [decision-guide, judgment]
    question: |
      A team is building an internal, low-latency, polyglot service graph with some
      streaming APIs. Which approach fits best?
    options:
      - "REST, for its HTTP caching, universal browser support, and human-readable payloads"
      - "GraphQL, for its client-flexible field queries and single aggregating endpoint"
      - "gRPC, for typed contracts, codegen, binary efficiency, and native streaming"
      - "Long-polling over HTTP/1.1, chosen mainly for its simplicity and easy curl debugging"
    answer: 2
    explanation: |
      Internal, low-latency, polyglot, streaming service-to-service traffic is
      gRPC's sweet spot: strong .proto contracts plus codegen keep a large graph
      consistent, and streaming is first-class.
    ref: "concepts.md#the-decision-guide-when-to-pick-which"

  - id: grpc-vs-rest-vs-graphql-ecosystem-007
    difficulty: intermediate
    tags: [decision-guide, public-api]
    question: |
      You are exposing a public API for arbitrary third-party developers and
      browser clients to consume with minimal tooling. Which is usually the best
      default?
    options:
      - "REST (optionally plus GraphQL), for universality, caching, and debuggability"
      - "gRPC, because its binary Protobuf frames are always faster than JSON"
      - "Raw Protobuf serialized directly over persistent TCP sockets"
      - "Bidirectional gRPC streaming applied uniformly to every single endpoint"
    answer: 0
    explanation: |
      Public/third-party/browser consumers value universality, HTTP caching, and
      curl/browser debuggability. REST is the lingua franca of the public internet;
      GraphQL is a browser-friendly alternative for client-flexible queries.
    ref: "concepts.md#the-decision-guide-when-to-pick-which"

  - id: grpc-vs-rest-vs-graphql-ecosystem-008
    difficulty: advanced
    tags: [performance, caching, judgment]
    question: |
      Which statement about gRPC-vs-REST performance is the most defensible in an
      interview?
    options:
      - "gRPC is always at least 5x faster than REST for every workload, because binary Protobuf serialization dwarfs all other latency costs"
      - "REST is always faster than gRPC because JSON parsing is cheap and text payloads avoid Protobuf's decoding overhead entirely"
      - "gRPC is generally faster for high-throughput internal RPC due to binary Protobuf plus HTTP/2 multiplexing, but the gap is workload-dependent and REST's HTTP caching can win end-to-end for read-heavy public traffic"
      - "The serialization format is the single factor that ever affects end-to-end latency, so the wire encoding alone decides performance"
    answer: 2
    explanation: |
      The nuanced, correct claim: gRPC tends to win for chatty internal binary RPC,
      but the advantage depends on the workload, and REST plus CDN/HTTP caching can
      be faster overall for read-heavy public traffic. Serialization is often not
      the bottleneck (DB/network/logic dominate).
    ref: "concepts.md#performance-reality-what-actually-matters"

  - id: grpc-vs-rest-vs-graphql-ecosystem-009
    difficulty: advanced
    tags: [architecture, bff, both-and]
    question: |
      What is the dominant "both/and" architecture combining these technologies?
    options:
      - "REST used everywhere across the stack, converting to gRPC only for internal audit logging pipelines"
      - "gRPC exposed directly at the browser edge, with REST spoken only between internal backend services"
      - "REST or GraphQL at the edge/BFF for external/browser clients, fanning out to internal services over gRPC"
      - "GraphQL used as the transport between every pair of internal microservices in the mesh"
    answer: 2
    explanation: |
      Mature systems layer them: a REST/GraphQL edge or BFF serves
      external/browser clients (universal, cacheable, flexible) and calls internal
      services over gRPC (typed, fast, streaming). Keep the typed/fast protocol
      inside the trust boundary and a universal surface outward.
    ref: "concepts.md#both-together-grpc-internal-rest-or-graphql-at-the-edge"

  - id: grpc-vs-rest-vs-graphql-ecosystem-010
    difficulty: intermediate
    tags: [grpc-gateway, transcoding]
    question: |
      What does grpc-gateway let you do?
    options:
      - "Generate a RESTful JSON reverse-proxy in front of a gRPC service, driven by google.api.http annotations in the .proto, so one contract serves both surfaces"
      - "Run raw gRPC directly inside any web browser over HTTP/2, with no translating proxy or gRPC-Web shim required"
      - "Automatically convert existing JSON REST APIs into GraphQL schemas and resolvers without touching the .proto"
      - "Replace HTTP/2 transport with plain HTTP/1.1 inside the gRPC core library so old clients can connect directly"
    answer: 0
    explanation: |
      grpc-gateway is a protoc plugin that generates a reverse proxy exposing a
      REST/JSON API mapped from google.api.http annotations. You maintain one
      .proto and get both a gRPC service and a REST edge.
    ref: "concepts.md#proxies-gateways-and-the-service-mesh"

  - id: grpc-vs-rest-vs-graphql-ecosystem-011
    difficulty: advanced
    tags: [buf, breaking-changes, ci]
    question: |
      What is the primary purpose of `buf breaking` in a CI pipeline?
    options:
      - "To automatically format and reindent all .proto files consistently across the repository on each commit"
      - "To compile .proto files into multiple target languages far faster than protoc by caching generated stubs"
      - "To compare protos against a baseline and fail the build when an incompatible schema change (e.g., changing a field number or type) is introduced"
      - "To discover and run the gRPC server's unit and integration test suites during the CI stage"
    answer: 2
    explanation: |
      buf breaking diffs your protos against a baseline (git ref or the BSR) and
      fails CI on wire-incompatible changes, mechanically enforcing the
      schema-evolution rules instead of relying on code review.
    ref: "concepts.md#schema-management-ecosystem-buf-bsr-protovalidate"

  - id: grpc-vs-rest-vs-graphql-ecosystem-012
    difficulty: advanced
    tags: [schema-evolution, wire-compat]
    question: |
      Regarding Protobuf wire compatibility, which change is SAFE?
    options:
      - "Changing an existing field's assigned number"
      - "Reusing a previously deleted field's number for a new field"
      - "Renaming a field while keeping its number and type"
      - "Changing a field's type from int32 to string"
    answer: 2
    explanation: |
      Wire compatibility depends on field numbers and types, not names. Renaming a
      field (same number/type) is wire-safe. Changing a field number, reusing a
      retired number, or changing a field type are breaking. (Full rules live in
      schema-evolution-and-compatibility.)
    ref: "concepts.md#schema-management-ecosystem-buf-bsr-protovalidate"

  - id: grpc-vs-rest-vs-graphql-ecosystem-013
    difficulty: advanced
    tags: [connect, middle-ground]
    question: |
      What distinguishes the Connect protocol (connectrpc) from core gRPC?
    options:
      - "It works over plain HTTP/1.1 with JSON or binary and is directly curl-able and browser-callable without a proxy, while still being schema-first and serving gRPC/gRPC-Web too"
      - "It abandons Protocol Buffers entirely in favor of XML documents validated against an XSD schema on every call"
      - "It only supports one-directional server streaming and nothing else, dropping unary, client, and bidirectional calls"
      - "It abandons schema-driven codegen entirely and requires every client and server stub to be written by hand"
    answer: 0
    explanation: |
      Connect speaks gRPC, gRPC-Web, and its own simpler Connect protocol over
      HTTP/1.1 with JSON or binary, making it curl/browser-friendly without a proxy,
      while keeping the schema-first .proto and codegen. It relaxes gRPC's hard
      HTTP/2 requirement.
    ref: "concepts.md#protobuf-over-rest-and-connect-middle-grounds"

  - id: grpc-vs-rest-vs-graphql-ecosystem-014
    difficulty: intermediate
    tags: [protobuf-over-rest, middle-ground]
    question: |
      "Protobuf over REST" as a middle ground means:
    options:
      - "Keeping RESTful resource semantics and HTTP methods but using Protobuf as the payload for compactness and a shared schema, at the cost of JSON readability"
      - "Using ordinary JSON payloads on the wire while merely labeling them as Protobuf via the Content-Type header"
      - "Running full gRPC bidirectional streaming over HTTP/1.1 connections while leaving the REST resource URLs unchanged"
      - "Embedding a GraphQL query string inside every REST request body so the server resolves the requested fields"
    answer: 0
    explanation: |
      You keep REST's resource/verb model and HTTP caching semantics but serialize
      bodies as Protobuf (Content-Type: application/x-protobuf) for smaller payloads
      and a shared contract, giving up human-readable JSON.
    ref: "concepts.md#protobuf-over-rest-and-connect-middle-grounds"

  - id: grpc-vs-rest-vs-graphql-ecosystem-015
    difficulty: intermediate
    tags: [protobuf, encoding]
    question: |
      One reason Protobuf payloads are smaller than JSON on the wire is that:
    options:
      - "Protobuf sends field numbers and wire types instead of textual field names, using varint/length-delimited encoding"
      - "Protobuf transparently compresses every message with gzip by default before it is placed on the wire"
      - "Protobuf silently omits all field values that fall below a configurable byte-size threshold on the wire"
      - "JSON always duplicates every field name three times for redundancy, roughly tripling its payload size"
    answer: 0
    explanation: |
      Protobuf's binary encoding tags fields by number + wire type (not by textual
      name) and uses compact varint/zigzag/length-delimited encoding, so it avoids
      repeating field-name strings that inflate JSON. (Encoding details live in
      protocol-buffers-syntax-types-encoding.)
    ref: "concepts.md#grpc-vs-rest"

  - id: grpc-vs-rest-vs-graphql-ecosystem-016
    difficulty: advanced
    tags: [graphql, gotchas]
    question: |
      Which is a well-known GraphQL operational gotcha (versus gRPC's fixed
      methods)?
    options:
      - "It cannot return JSON responses, forcing every payload to be serialized as binary Protobuf instead"
      - "It requires HTTP/2 trailers to carry status codes, exactly like gRPC does over its multiplexed streams"
      - "It forbids clients from selecting individual fields, always returning the server's full fixed response shape"
      - "The N+1 resolver problem, harder HTTP caching (single POST endpoint), and expensive deep/wide queries needing complexity limits"
    answer: 3
    explanation: |
      GraphQL's flexibility brings costs: naive resolvers cause N+1 queries (needs
      dataloaders/batching), caching is harder because it's usually one POST
      endpoint, and unbounded queries can be expensive, so depth/complexity limits
      are needed. (Owned by rest-api-design; noted here for the comparison.)
    ref: "concepts.md#grpc-vs-graphql"

  - id: grpc-vs-rest-vs-graphql-ecosystem-017
    difficulty: intermediate
    tags: [decision-guide, graphql, bff]
    question: |
      A mobile app and a web app each need different slices of data aggregated from
      several backend services. Which edge approach directly targets this?
    options:
      - "Expose each backend service's raw gRPC API directly to the mobile and web apps and let them merge results"
      - "A single fat REST endpoint that returns every possible field to every client regardless of what they need"
      - "WebSocket-only APIs with no schema, streaming raw untyped messages that each client must parse itself"
      - "A GraphQL BFF where clients query exactly the fields they need and resolvers aggregate from downstream services"
    answer: 3
    explanation: |
      Varied clients aggregating many sources is GraphQL's sweet spot, typically as
      a BFF: each client asks for exactly its fields, and resolvers fan out
      (frequently over gRPC) to downstream services.
    ref: "concepts.md#grpc-vs-graphql"

  - id: grpc-vs-rest-vs-graphql-ecosystem-018
    difficulty: advanced
    tags: [load-balancing, l4, l7]
    question: |
      Why do naive L4 load balancers work poorly for gRPC?
    options:
      - "gRPC opens long-lived HTTP/2 connections, so an L4 balancer pins all multiplexed RPCs to one backend; you need per-RPC (L7) balancing or client-side LB"
      - "gRPC runs all of its streams over UDP datagrams, a transport that L4 connection balancers silently ignore and drop"
      - "gRPC rotates the client's source IP address on every single request, defeating an L4 balancer's connection hashing"
      - "L4 balancers are unable to forward binary Protobuf payloads and can only route human-readable text protocols"
    answer: 0
    explanation: |
      Because a single HTTP/2 connection carries many RPCs and stays open, an L4
      balancer that balances connections sends all of a client's calls to one
      backend. gRPC needs L7/per-RPC balancing (Envoy/mesh) or client-side LB over a
      headless service. (Details: load-balancing-and-service-discovery.)
    ref: "concepts.md#proxies-gateways-and-the-service-mesh"

  - id: grpc-vs-rest-vs-graphql-ecosystem-019
    difficulty: intermediate
    tags: [envoy, ecosystem]
    question: |
      In the gRPC ecosystem, Envoy is best described as:
    options:
      - "An L7 proxy/sidecar that does per-request gRPC load balancing, the grpc_web browser bridge, retries, and consumes xDS config"
      - "A protoc compiler plugin that generates language-specific Protobuf stubs from your .proto files during each build"
      - "A hosted schema registry that versions and distributes your .proto modules and their generated SDKs across teams"
      - "A drop-in replacement for Protocol Buffers that re-encodes every message into a faster proprietary binary wire format"
    answer: 0
    explanation: |
      Envoy is the de-facto HTTP/2-native L7 proxy for gRPC: per-request LB, the
      grpc_web filter for browsers, retries/health checks, and the xDS control-plane
      API. It's the data plane in most service meshes.
    ref: "concepts.md#proxies-gateways-and-the-service-mesh"

  - id: grpc-vs-rest-vs-graphql-ecosystem-020
    difficulty: advanced
    tags: [protovalidate, ecosystem]
    question: |
      What does protovalidate provide?
    options:
      - "Declarative validation constraints (via CEL) written as options directly in the .proto, enforced at runtime across languages"
      - "A library that transparently encrypts Protobuf messages on the wire with per-field AES keys negotiated during the handshake"
      - "A translation layer that automatically converts REST/JSON endpoints into an equivalent GraphQL schema with generated resolvers"
      - "An interceptor that automatically retries failed RPCs using exponential backoff and configurable per-method deadline budgets"
    answer: 0
    explanation: |
      protovalidate (successor to protoc-gen-validate) lets you declare constraints
      as field options in the .proto using CEL, and a runtime library enforces them
      across languages, so validation travels with the contract.
    ref: "concepts.md#schema-management-ecosystem-buf-bsr-protovalidate"

  - id: grpc-vs-rest-vs-graphql-ecosystem-021
    difficulty: intermediate
    tags: [bsr, ecosystem]
    question: |
      The Buf Schema Registry (BSR) primarily provides:
    options:
      - "A runtime data-plane proxy that terminates HTTP/2 and load-balances gRPC calls per-request across backend pods"
      - "A browser developer-tools plugin that decodes and pretty-prints binary Protobuf frames captured on the network tab"
      - "A shim HTTP/2 implementation that lets legacy HTTP/1.1-only clients connect to modern gRPC servers unchanged"
      - "A hosted registry for .proto modules: versioning, dependency management, generated-SDK hosting, and remote codegen"
    answer: 3
    explanation: |
      BSR turns schemas into first-class artifacts: versioned .proto modules you can
      import like libraries, dependency management, hosted generated SDKs, and remote
      codegen, discoverable across an org.
    ref: "concepts.md#schema-management-ecosystem-buf-bsr-protovalidate"

  - id: grpc-vs-rest-vs-graphql-ecosystem-022
    difficulty: beginner
    tags: [endpoints, model]
    question: |
      How do gRPC and REST typically differ in endpoint structure?
    options:
      - "Both collapse every operation onto exactly one shared endpoint and disambiguate purely by a method field in the request body"
      - "REST exposes one distinct path per method while gRPC applies GET/POST/PUT/DELETE verbs against a small set of resource URLs"
      - "Neither uses URL paths at all; both address operations by opening a dedicated raw TCP port per method on the server"
      - "gRPC maps one method to a path like /package.Service/Method; REST uses many resource URLs with HTTP verbs"
    answer: 3
    explanation: |
      gRPC exposes each RPC method at a path of the form /package.Service/Method,
      while REST models many resource URLs and uses HTTP verbs (GET/POST/PUT/DELETE)
      against them.
    ref: "concepts.md#the-three-paradigms-at-a-glance"

  - id: grpc-vs-rest-vs-graphql-ecosystem-023
    difficulty: intermediate
    tags: [graphql, endpoint]
    question: |
      GraphQL typically exposes its API as:
    options:
      - "One endpoint (e.g., /graphql) that accepts client-specified queries"
      - "A distinct HTTP path automatically generated for every individual field defined in the schema"
      - "A persistent gRPC bidirectional stream over HTTP/2 that the client feeds queries into frame by frame"
      - "A full set of per-resource REST-style URLs, one for each type, addressed with standard HTTP verbs"
    answer: 0
    explanation: |
      GraphQL usually exposes a single endpoint (commonly /graphql) that accepts a
      query describing exactly which fields the client wants; the server resolves
      that shape.
    ref: "concepts.md#the-three-paradigms-at-a-glance"

  - id: grpc-vs-rest-vs-graphql-ecosystem-024
    difficulty: advanced
    tags: [one-contract, transcoding]
    question: |
      Your goal is to maintain a single API contract yet serve both a gRPC service
      internally and a REST/JSON API externally. The idiomatic approach is to:
    options:
      - "Hand-write two separate specs (an OpenAPI document and a .proto) and manually keep them in sync on every change"
      - "Reimplement the same service logic twice in different frameworks, one exposing REST and the other exposing gRPC"
      - "Expose the raw gRPC service directly to browsers over HTTP/2 and drop the REST surface as redundant overhead"
      - "Annotate the .proto with google.api.http mappings and generate a REST gateway (grpc-gateway) or use gRPC transcoding"
    answer: 3
    explanation: |
      With google.api.http annotations you map RPC methods to HTTP verbs/paths and
      generate a REST/JSON surface (grpc-gateway) or use gRPC transcoding, keeping
      one .proto as the single source of truth for both surfaces.
    ref: "concepts.md#both-together-grpc-internal-rest-or-graphql-at-the-edge"

  - id: grpc-vs-rest-vs-graphql-ecosystem-025
    difficulty: beginner
    tags: [debuggability, rest]
    question: |
      Which is an advantage of REST/JSON over gRPC for day-to-day development?
    options:
      - "Consistently smaller payloads on the wire thanks to a more compact binary field encoding than Protobuf uses"
      - "Native bidirectional streaming built into the protocol without any add-ons like SSE, WebSockets, or long-polling"
      - "Human-readability: you can read responses by eye, reproduce calls with curl, and inspect them in browser devtools"
      - "Enforced compile-time type checking of every field via generated client and server stubs from a shared contract"
    answer: 2
    explanation: |
      JSON over HTTP is human-readable and trivially inspectable with curl and
      browser devtools. gRPC's binary frames need tooling like grpcurl, reflection,
      or Wireshark dissectors to inspect.
    ref: "concepts.md#grpc-vs-rest"

  - id: grpc-vs-rest-vs-graphql-ecosystem-026
    difficulty: advanced
    tags: [http2, tcp, hol-blocking]
    question: |
      A caveat of gRPC's reliance on HTTP/2's single multiplexed TCP connection is:
    options:
      - "It caps the connection at a single in-flight request, serializing every RPC and blocking any concurrent multiplexing"
      - "It disables TLS entirely, forcing all multiplexed gRPC traffic to travel unencrypted over the shared plaintext connection"
      - "It forces every individual RPC onto its own freshly opened TCP connection, defeating any connection-level multiplexing"
      - "TCP-level packet loss stalls all multiplexed streams (HOL blocking), a problem HTTP/3/QUIC addresses"
    answer: 3
    explanation: |
      HTTP/2 multiplexes many streams over one TCP connection, so packet loss can
      block all of them at the transport layer. HTTP/3 over QUIC mitigates this.
      (Transport details are owned by networking.)
    ref: "concepts.md#performance-reality-what-actually-matters"

  - id: grpc-vs-rest-vs-graphql-ecosystem-027
    difficulty: intermediate
    tags: [streaming, comparison]
    question: |
      Regarding streaming, how do gRPC and REST compare?
    options:
      - "Both offer identical, fully native streaming support built directly into the protocol with no add-ons required"
      - "REST provides native bidirectional streaming over HTTP/1.1 while gRPC offers only plain request/response calls"
      - "Neither protocol supports any form of streaming, so both must fall back to repeated polling for continuous data"
      - "gRPC has native server/client/bidirectional streaming; REST simulates streaming with add-ons like SSE, WebSockets, or long-polling"
    answer: 3
    explanation: |
      gRPC offers four call types including native server, client, and
      bidirectional streaming (one HTTP/2 stream per RPC). REST has no native
      streaming and bolts it on with SSE, WebSockets, or long-polling.
    ref: "concepts.md#grpc-vs-rest"

  - id: grpc-vs-rest-vs-graphql-ecosystem-028
    difficulty: advanced
    tags: [decision-guide, clarifying]
    question: |
      An interviewer asks "REST or gRPC for our new service?" The strongest first
      move is to:
    options:
      - "Immediately answer gRPC, on the basis that its binary Protobuf frames make it faster than REST for every workload"
      - "Default to whatever protocol the team happened to ship last time, adopting it without any discussion of the requirements"
      - "Recommend GraphQL for every case, since a single flexible query endpoint can subsume both REST and gRPC use cases"
      - "Ask who consumes it (browser/third-party vs internal service) and whether it needs streaming vs request/response, since those two answers largely determine the choice"
    answer: 3
    explanation: |
      The decisive axes are the consumer (browser/third-party vs internal) and
      whether streaming is needed. Asking those clarifying questions before
      answering demonstrates the judgment interviewers are probing for.
    ref: "concepts.md#the-decision-guide-when-to-pick-which"

  - id: grpc-vs-rest-vs-graphql-ecosystem-029
    difficulty: intermediate
    tags: [contract, codegen]
    question: |
      How do gRPC and REST differ on contracts and codegen?
    options:
      - "gRPC has an enforced .proto contract with codegen; REST's OpenAPI/Swagger is optional and often drifts from the implementation"
      - "REST enforces a strict compile-time contract via mandatory OpenAPI codegen, while gRPC contracts are optional and hand-written"
      - "Neither approach supports any interface definition language, so both rely entirely on documentation kept outside the code"
      - "Both generate byte-for-byte identical client and server stubs from one shared schema file using the same code generator"
    answer: 0
    explanation: |
      gRPC requires a .proto that both sides generate typed code from, catching
      mismatches at compile time. REST's OpenAPI is optional and frequently drifts,
      so clients often hand-write models.
    ref: "concepts.md#grpc-vs-rest"

  - id: grpc-vs-rest-vs-graphql-ecosystem-030
    difficulty: advanced
    tags: [graphql, framing]
    question: |
      Which framing best avoids the "gRPC vs GraphQL" category error?
    options:
      - "They are fully interchangeable, so either one can be swapped in for the other with no change to the interaction model"
      - "gRPC is fundamentally a client-driven query language, while GraphQL is really a typed binary remote-procedure-call framework"
      - "Both are designed exclusively for internal service-to-service calls and neither is meant to face browser or public clients"
      - "GraphQL optimizes the client's data-fetching ergonomics (flexible queries, no over/under-fetch); gRPC optimizes the server-to-server call path (typed, binary, streaming, low-latency)"
    answer: 3
    explanation: |
      They solve different problems: GraphQL improves client data-fetching
      ergonomics, gRPC improves the internal call path. They coexist well (a GraphQL
      BFF resolving fields via gRPC calls).
    ref: "concepts.md#grpc-vs-graphql"

  - id: grpc-vs-rest-vs-graphql-ecosystem-031
    difficulty: intermediate
    tags: [ecosystem, cncf]
    question: |
      Within the CNCF landscape, gRPC's maturity status is:
    options:
      - "A CNCF sandbox project only, still in the earliest experimental tier and not yet promoted to incubating status"
      - "Not a CNCF project at all; it remains a Google-owned open-source effort that was never donated to the foundation"
      - "A CNCF incubating project (donated by Google)"
      - "A CNCF project that has since been archived after its maintenance was wound down in favor of newer alternatives"
    answer: 2
    explanation: |
      gRPC is a CNCF incubating project (accepted in 2017), donated by Google. Envoy
      (its common data plane) is CNCF graduated. Don't confuse the two maturity levels.
    ref: "concepts.md#the-cncf-landscape-ecosystem-map"

  - id: grpc-vs-rest-vs-graphql-ecosystem-032
    difficulty: advanced
    tags: [field-mask, fetch-shape]
    question: |
      Can a gRPC client request only a subset of a response message's fields the way
      a GraphQL client can?
    options:
      - "Yes, gRPC ships a built-in field-selection query language, syntactically identical to GraphQL, resolved by the transport"
      - "Yes, by setting a standard HTTP request header the gRPC transport itself parses it and prunes unrequested response fields"
      - "No, and there is no mechanism whatsoever, even by server convention, to express or return a partial subset of fields"
      - "No, gRPC returns the whole fixed response message; a server may optionally honor google.protobuf.FieldMask as a convention, but it is not a transport feature"
    answer: 3
    explanation: |
      gRPC methods have fixed response types; there is no client field-selection at
      the transport level. FieldMask lets a server optionally honor a
      client-specified subset, but that's a convention the server must implement,
      not built-in like GraphQL's query semantics.
    ref: "concepts.md#grpc-vs-graphql"

  - id: grpc-vs-rest-vs-graphql-ecosystem-033
    difficulty: intermediate
    tags: [buf, tooling]
    question: |
      Compared with invoking raw protoc, the buf CLI mainly provides:
    options:
      - "A build that is noticeably slower than protoc but emits more nicely formatted and commented generated source files"
      - "A drop-in replacement for the HTTP/2 transport layer that gRPC uses to carry its multiplexed streams and trailers"
      - "Simpler config-driven builds plus linting, formatting, breaking-change detection, and codegen via buf.yaml/buf.gen.yaml"
      - "Automatic conversion of an existing gRPC service definition into an equivalent GraphQL schema with generated resolvers"
    answer: 2
    explanation: |
      buf replaces manual protoc invocation with config-driven builds and adds
      linting, formatting, buf breaking (compat checks), and codegen, removing the
      pain of managing protoc plugins and include paths by hand.
    ref: "concepts.md#schema-management-ecosystem-buf-bsr-protovalidate"

  - id: grpc-vs-rest-vs-graphql-ecosystem-034
    difficulty: advanced
    tags: [kubernetes, load-balancing, scenario]
    question: |
      How should you load-balance a gRPC service running across many pods in
      Kubernetes?
    options:
      - "Use a normal L4 ClusterIP Service, since kube-proxy inspects each gRPC frame and balances individual RPCs across pods automatically"
      - "Use a headless Service with client-side LB, or an L7 proxy/mesh (Envoy/Istio/Linkerd) that balances per-RPC, because a plain L4 Service pins all streams to one pod"
      - "Force fair spreading by opening a brand-new TCP connection for every single RPC so the L4 Service re-balances each call"
      - "gRPC cannot run on Kubernetes at all, because its long-lived HTTP/2 connections are incompatible with the pod networking model"
    answer: 1
    explanation: |
      A plain L4 ClusterIP/kube-proxy Service balances connections, and gRPC's
      long-lived HTTP/2 connection means all RPCs pin to one pod. Use a headless
      Service plus client-side LB, or an L7 mesh/proxy that balances per-RPC.
    ref: "concepts.md#proxies-gateways-and-the-service-mesh"

  - id: grpc-vs-rest-vs-graphql-ecosystem-035
    difficulty: intermediate
    tags: [health-check, ecosystem]
    question: |
      The standard gRPC Health Checking service (grpc.health.v1.Health) is used to:
    options:
      - "Encrypt gRPC traffic end-to-end by negotiating TLS session keys for each channel before any RPC is allowed through"
      - "Compress outbound Protobuf messages with gzip so large response payloads take fewer bytes on the multiplexed stream"
      - "Provide a standard liveness/readiness endpoint that Kubernetes probes and load balancers can query"
      - "Translate incoming gRPC calls into equivalent REST/JSON requests so plain HTTP clients can reach the same service"
    answer: 2
    explanation: |
      grpc.health.v1.Health is the standard gRPC health-checking protocol used by
      k8s probes and load balancers to determine whether a server is ready/serving.
    ref: "concepts.md#the-cncf-landscape-ecosystem-map"

  - id: grpc-vs-rest-vs-graphql-ecosystem-036
    difficulty: advanced
    tags: [xds, ecosystem]
    question: |
      What is xDS in the gRPC/Envoy ecosystem?
    options:
      - "A specialized Protobuf scalar field type used to encode dynamic service-discovery addresses inside a message"
      - "A family of discovery-service APIs (LDS/RDS/CDS/EDS) that gRPC clients and Envoy consume for LB and config from a control plane"
      - "A JSON schema validator that checks Envoy configuration documents against a published specification before load"
      - "A browser-side gRPC runtime that lets JavaScript clients speak the wire protocol directly without a translating proxy"
    answer: 1
    explanation: |
      xDS is the set of discovery APIs (Listener/Route/Cluster/Endpoint discovery)
      that a control plane serves to data-plane clients (Envoy and modern gRPC
      libraries) for dynamic load balancing and configuration. (Mesh architecture is
      owned by system-design.)
    ref: "concepts.md#the-cncf-landscape-ecosystem-map"

  - id: grpc-vs-rest-vs-graphql-ecosystem-037
    difficulty: beginner
    tags: [payload, comparison]
    question: |
      Which correctly pairs each approach with its typical payload format?
    options:
      - "gRPC: binary Protobuf; REST: JSON/text; GraphQL: JSON responses with a text query"
      - "gRPC: human-readable JSON; REST: binary Protobuf frames; GraphQL: XML documents"
      - "All three transmit identical binary Protobuf frames and differ only in URL path naming"
      - "gRPC: SOAP-style XML envelopes; REST: binary Protobuf; GraphQL: comma-separated CSV rows"
    answer: 0
    explanation: |
      gRPC uses binary Protobuf, REST typically uses JSON/text, and GraphQL sends a
      text query and returns JSON.
    ref: "concepts.md#the-three-paradigms-at-a-glance"

  - id: grpc-vs-rest-vs-graphql-ecosystem-038
    difficulty: advanced
    tags: [observability, ecosystem]
    question: |
      Which built-in gRPC facility helps you inspect live channel/connection state
      for debugging a binary protocol?
    options:
      - "channelz"
      - "OpenAPI"
      - "ETag"
      - "HPACK"
    answer: 0
    explanation: |
      channelz is gRPC's built-in facility exposing channel/subchannel/socket state
      for debugging. Along with reflection and grpcurl it compensates for the lack
      of easy human inspection of a binary protocol. (Instrumentation with OTel is
      owned by observability.)
    ref: "concepts.md#the-cncf-landscape-ecosystem-map"

  - id: grpc-vs-rest-vs-graphql-ecosystem-039
    difficulty: intermediate
    tags: [scenario, third-party]
    question: |
      A partner integration team without your codegen toolchain must consume your
      API using only curl and standard HTTP libraries. Which surface should you
      expose to them?
    options:
      - "Raw gRPC over HTTP/2, requiring them to adopt your .proto files and run your codegen toolchain"
      - "A REST/JSON (or Connect/JSON) surface, since it's universally callable with plain HTTP tools"
      - "A long-lived bidirectional gRPC stream that the partner drives frame by frame over HTTP/2"
      - "A headless gRPC service with client-side load balancing that the partner resolves via DNS SRV records"
    answer: 1
    explanation: |
      Third parties who can't (or won't) adopt codegen and need plain HTTP tooling
      are best served by REST/JSON (or a Connect/JSON surface). Raw gRPC would force
      HTTP/2 framing and codegen on them.
    ref: "concepts.md#browser-reachability-and-third-party-reach"

  - id: grpc-vs-rest-vs-graphql-ecosystem-040
    difficulty: advanced
    tags: [performance, nuance]
    question: |
      Which factor can NARROW the payload-size gap between Protobuf and JSON?
    options:
      - "Protobuf's encoded size always doubles under concurrent load because varints re-expand once buffers are shared"
      - "Large text-heavy payloads that compress well under gzip/brotli, plus the fact that DB/network/logic latency often dominates over serialization"
      - "JSON transparently re-encodes itself into a compact binary form whenever a payload exceeds 1KB on the wire"
      - "HTTP/2 forbids content-encoding compression of JSON bodies, so REST text can never be gzipped in transit"
    answer: 1
    explanation: |
      For large, compressible text payloads the byte gap after gzip/brotli shrinks,
      and serialization is frequently not the bottleneck (DB, network RTT, and
      business logic dominate), so the raw Protobuf-vs-JSON size advantage matters
      less than headline benchmarks suggest.
    ref: "concepts.md#performance-reality-what-actually-matters"

  - id: grpc-vs-rest-vs-graphql-ecosystem-041
    difficulty: intermediate
    tags: [decision-guide, streaming, scenario]
    question: |
      You need a real-time bidirectional feed between two internal services (each
      sends messages independently as they arrive). Which is the most natural fit?
    options:
      - "REST endpoints that each side polls once per second, discarding responses that carry no new messages"
      - "gRPC bidirectional streaming over a single HTTP/2 stream"
      - "A single GraphQL query issued once at startup that returns the entire feed in one response body"
      - "A cacheable REST GET fronted by a CDN so both services read the feed from an edge cache"
    answer: 1
    explanation: |
      Independent, ongoing message flow in both directions between internal services
      is exactly gRPC bidirectional streaming, carried on one HTTP/2 stream. REST
      polling is inefficient and a single GraphQL query is request/response.
    ref: "concepts.md#grpc-vs-rest"

  - id: grpc-vs-rest-vs-graphql-ecosystem-042
    difficulty: advanced
    tags: [ecosystem, summary, senior]
    question: |
      What best describes "gRPC in production" as a senior engineer would frame it?
    options:
      - "Nothing but the core gRPC library linked into each service, with no schema tooling, proxy, or observability layer around it"
      - "gRPC + Protobuf + a schema-management stack (Buf/BSR) + an L7 data plane (Envoy/mesh) + observability (OTel/channelz) + optionally a REST/GraphQL edge (grpc-gateway/Connect/BFF)"
      - "A GraphQL server that maps Protobuf message types onto its schema and resolves every field through gRPC internally"
      - "Plain REST/JSON endpoints that merely run over HTTP/2 and are relabeled as gRPC for marketing purposes"
    answer: 1
    explanation: |
      Production gRPC is an ecosystem: the core framework plus Protobuf, schema
      management (Buf/BSR), an L7 data plane (Envoy/mesh), observability
      (OTel/channelz), and often a REST/GraphQL edge. Naming the ecosystem
      distinguishes a senior answer.
    ref: "concepts.md#the-cncf-landscape-ecosystem-map"

  - id: grpc-vs-rest-vs-graphql-ecosystem-043
    difficulty: beginner
    tags: [graphql, model]
    question: |
      GraphQL is fundamentally:
    options:
      - "A binary transport protocol that replaces HTTP entirely and carries requests over its own persistent sockets"
      - "A query language and runtime over a typed schema, where the client specifies the shape of the response"
      - "A per-request load-balancing algorithm that distributes calls across a pool of backend service instances"
      - "A Protobuf encoding variant that swaps field numbers for compressed textual keys on the wire"
    answer: 1
    explanation: |
      GraphQL is a query language plus a runtime executing against a typed (SDL)
      schema; clients send queries specifying exactly the fields they want and the
      server resolves that shape.
    ref: "concepts.md#the-three-paradigms-at-a-glance"

  - id: grpc-vs-rest-vs-graphql-ecosystem-044
    difficulty: advanced
    tags: [caching, graphql, gotcha]
    question: |
      Why is HTTP caching harder for GraphQL than for REST?
    options:
      - "GraphQL responses are always larger than the equivalent REST payload because every field name is repeated in both query and response"
      - "GraphQL typically uses a single POST endpoint, so standard GET-based HTTP/CDN caching doesn't apply; it needs persisted queries or app-layer caching"
      - "The GraphQL specification explicitly forbids any HTTP or CDN caching of query results at every layer"
      - "GraphQL runs only over HTTP/2 trailers, which proxies and CDNs strip before they can be cached"
    answer: 1
    explanation: |
      Because GraphQL usually sends queries as POST to one endpoint, GET-based
      HTTP/CDN caching (keyed by URL) doesn't naturally apply. Teams add persisted
      queries (stable URLs/IDs) or application-layer caching instead.
    ref: "concepts.md#grpc-vs-graphql"

  - id: grpc-vs-rest-vs-graphql-ecosystem-045
    difficulty: intermediate
    tags: [scenario, public-github]
    question: |
      A large public API provider offers BOTH a REST API and a GraphQL API to
      external developers. What does this illustrate?
    options:
      - "That gRPC is technically incapable of serving any public-facing API and is barred from external use"
      - "That REST (universal, cacheable) and GraphQL (client-flexible queries) each serve different external consumer needs, so offering both is a reasonable edge strategy"
      - "That GraphQL has fully superseded REST, so any provider keeping both is simply maintaining dead legacy endpoints"
      - "That REST and GraphQL are strictly internal service-to-service protocols never intended for external developers"
    answer: 1
    explanation: |
      Providers like GitHub expose REST and GraphQL because each suits different
      external needs: REST for simple, cacheable, universal access; GraphQL for
      clients that want to shape and aggregate exactly the data they need.
    ref: "concepts.md#browser-reachability-and-third-party-reach"

  - id: grpc-vs-rest-vs-graphql-ecosystem-046
    difficulty: advanced
    tags: [schema-evolution, judgment]
    question: |
      Relying on code review alone to prevent breaking .proto changes is risky
      because:
    options:
      - "Code review tools are technically unable to render or diff .proto files, so reviewers never see the changes"
      - "Wire compatibility hinges on subtle field-number/type rules that are easy to miss by eye; buf breaking enforces them mechanically in CI"
      - "buf breaking removes the need to keep any .proto schema at all, so reviewing schema changes is pointless"
      - "Every possible change to a .proto file is inherently wire-safe, so breakage from code review is impossible anyway"
    answer: 1
    explanation: |
      Wire-compat rules (don't change/reuse field numbers, don't change types) are
      subtle and easy to overlook in review. buf breaking checks them mechanically
      against a baseline in CI, catching incompatible changes before they ship.
    ref: "concepts.md#schema-management-ecosystem-buf-bsr-protovalidate"

  - id: grpc-vs-rest-vs-graphql-ecosystem-047
    difficulty: beginner
    tags: [when-not-to-use, judgment]
    question: |
      Which scenario is the WEAKEST case for choosing gRPC?
    options:
      - "Internal, low-latency, polyglot microservices exchanging high volumes of request/response calls behind the trust boundary"
      - "A public, browser-facing, cacheable, read-heavy API for arbitrary third parties"
      - "High-throughput bidirectional streaming between backend services that push messages continuously as they arrive"
      - "A strongly typed contract shared and code-generated across many internal teams to keep a large service graph consistent"
    answer: 1
    explanation: |
      Public, browser-facing, cacheable, read-heavy, third-party APIs are where
      REST's universality, HTTP caching, and debuggability dominate and gRPC's
      browser/caching limitations hurt most.
    ref: "concepts.md#the-decision-guide-when-to-pick-which"

  - id: grpc-vs-rest-vs-graphql-ecosystem-048
    difficulty: advanced
    tags: [connect, ecosystem, tradeoff]
    question: |
      A team wants gRPC-style typed contracts and codegen but also easy browser
      calls and curl debugging without running an Envoy proxy. A reasonable choice
      is:
    options:
      - "Abandon schema-first contracts and codegen entirely, hand-coding ad-hoc JSON payloads on both client and server"
      - "Adopt Connect, which serves gRPC/gRPC-Web/Connect protocols and supports HTTP/1.1 + JSON/binary directly callable by browsers and curl, at the cost of a newer/smaller ecosystem than core gRPC"
      - "Keep raw gRPC and require every browser to embed a bundled TLS-terminating HTTP/2 proxy just to make calls"
      - "Drop typed contracts and switch the whole API to GraphQL subscriptions delivered over WebSocket connections"
    answer: 1
    explanation: |
      Connect keeps schema-first contracts and codegen while adding an HTTP/1.1,
      JSON-or-binary protocol that browsers and curl can call directly without a
      proxy. The trade-off is a newer, smaller ecosystem relative to core gRPC.
    ref: "concepts.md#protobuf-over-rest-and-connect-middle-grounds"
