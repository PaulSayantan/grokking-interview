topic: "Metadata, Headers & Interceptors"
domain: grpc
topic_slug: metadata-headers-interceptors
version: 1
questions:
  - id: metadata-headers-interceptors-001
    difficulty: beginner
    tags: [metadata, concepts]
    question: |
      What is gRPC metadata?
    options:
      - "A required set of fields inside every protobuf message"
      - "Key/value pairs sent alongside an RPC, out-of-band from the message body"
      - "The binary encoding format used for the request payload"
      - "A configuration file that defines service methods"
    answer: 1
    explanation: |
      Metadata is a list of key/value pairs sent with an RPC, separate from the
      protobuf message payload. It is the gRPC analogue of HTTP headers and is used
      for call-scoped context (auth, tracing, request IDs) rather than domain data.
    ref: "concepts.md#what-is-metadata"

  - id: metadata-headers-interceptors-002
    difficulty: beginner
    tags: [metadata, http2, headers]
    question: |
      On the HTTP/2 wire, gRPC metadata is carried as what?
    options:
      - "A separate TCP connection"
      - "HTTP/2 headers (in HEADERS frames)"
      - "Fields appended to the protobuf message"
      - "URL query-string parameters"
    answer: 1
    explanation: |
      gRPC metadata literally is HTTP/2 headers. Request/response initial metadata
      travels in HEADERS frames before the message, and trailing metadata travels in a
      trailing HEADERS frame after the message.
    ref: "concepts.md#what-is-metadata"

  - id: metadata-headers-interceptors-003
    difficulty: intermediate
    tags: [trailers, status-code, wire]
    question: |
      Where does the final gRPC status code (grpc-status) travel on the wire?
    options:
      - "In the HTTP/2 :status pseudo-header"
      - "In the initial response headers, before the message"
      - "Inside the protobuf response message itself"
      - "In the trailing metadata (HTTP/2 trailers), after the response messages"
    answer: 3
    explanation: |
      grpc-status (and optional grpc-message) is sent in the trailing metadata — a
      trailing HEADERS frame with END_STREAM — after the response messages. This lets a
      server stream data and only decide the final status at the end, and it is a core
      reason gRPC requires HTTP/2 (which supports trailers).
    ref: "concepts.md#response-initial-metadata-and-trailing-metadata"

  - id: metadata-headers-interceptors-004
    difficulty: intermediate
    tags: [trailers, success, wire]
    question: |
      On a fully successful unary RPC, where is grpc-status: 0 sent?
    options:
      - "In the trailing metadata, just like on failure"
      - "It is not sent at all on success"
      - "In the initial response headers"
      - "In the HTTP/2 :status header as 200"
    answer: 0
    explanation: |
      The status code always travels in the trailers, even on success (grpc-status: 0).
      The HTTP-level :status is typically 200 regardless of the gRPC outcome; the real
      result is grpc-status in the trailers.
    ref: "concepts.md#response-initial-metadata-and-trailing-metadata"

  - id: metadata-headers-interceptors-005
    difficulty: intermediate
    tags: [binary-metadata, bin-suffix, encoding]
    question: |
      How must a metadata key carrying arbitrary binary bytes be named, and how is the
      value transmitted?
    options:
      - "A key ending in -bin; the value is base64-encoded on the wire"
      - "Any name; the value is sent as raw bytes verbatim"
      - "A key starting with grpc-; the value is gzip-compressed"
      - "A key ending in -b64; the value is hex-encoded"
    answer: 0
    explanation: |
      Binary metadata must use a key with the -bin suffix. The gRPC library
      base64-encodes the bytes on the wire and decodes them on receipt, so the
      application works with raw bytes while the header stays ASCII-safe.
    ref: "concepts.md#metadata-key-rules"

  - id: metadata-headers-interceptors-006
    difficulty: intermediate
    tags: [reserved-keys, grpc-prefix]
    question: |
      Which metadata key are applications NOT allowed to set themselves?
    options:
      - "authorization"
      - "request-id"
      - "x-tenant-id"
      - "grpc-timeout"
    answer: 3
    explanation: |
      Keys beginning with grpc- (grpc-timeout, grpc-status, grpc-encoding, ...) are
      reserved for the framework. grpc-timeout is set by gRPC from the call deadline;
      applications must not set grpc-* keys.
    ref: "concepts.md#metadata-key-rules"

  - id: metadata-headers-interceptors-007
    difficulty: beginner
    tags: [keys, case-sensitivity]
    question: |
      Are gRPC metadata keys case-sensitive?
    options:
      - "Yes, Request-Id and request-id are different keys"
      - "Only binary (-bin) keys are case-insensitive"
      - "Case sensitivity depends on the language library"
      - "No; keys are case-insensitive and normalized to lowercase on the wire"
    answer: 3
    explanation: |
      Like HTTP/2 headers, metadata keys are case-insensitive and normalized to
      lowercase on the wire. Request-Id and request-id refer to the same key.
    ref: "concepts.md#metadata-key-rules"

  - id: metadata-headers-interceptors-008
    difficulty: intermediate
    tags: [pseudo-headers, http2, reserved]
    question: |
      Why can't an application set a metadata key like :authority or :path?
    options:
      - "They are too long for HPACK compression"
      - "They are HTTP/2 pseudo-headers, reserved and managed by the transport"
      - "They must be base64-encoded first"
      - "They are only valid on streaming RPCs"
    answer: 1
    explanation: |
      Keys starting with a colon are HTTP/2 pseudo-headers (:method, :scheme, :path,
      :authority, :status). They are reserved by HTTP/2 and managed by the transport,
      not settable as application metadata.
    ref: "concepts.md#metadata-key-rules"

  - id: metadata-headers-interceptors-009
    difficulty: intermediate
    tags: [request-metadata, ordering, wire]
    question: |
      When is client request (initial) metadata sent relative to the request message?
    options:
      - "Before the first request message, in the HEADERS frame that opens the stream"
      - "After the last request message, in the trailers"
      - "Interleaved with each request message"
      - "Only if the server explicitly asks for it"
    answer: 0
    explanation: |
      Request metadata is sent in the HEADERS frame that opens the HTTP/2 stream,
      before any request-message DATA frames. That is why a server can make auth and
      routing decisions from metadata before reading the payload.
    ref: "concepts.md#request-initial-metadata"

  - id: metadata-headers-interceptors-010
    difficulty: advanced
    tags: [streaming, request-metadata, gotcha]
    question: |
      For a client-streaming RPC, can the client add new INITIAL metadata after sending
      the first message?
    options:
      - "Yes, before each message"
      - "Yes, but only binary metadata"
      - "No; initial metadata is sent once when the stream opens and cannot be added later"
      - "Only if the server sends its headers first"
    answer: 2
    explanation: |
      Initial request metadata is sent once, when the stream opens. You cannot add
      initial metadata mid-stream. Per-message context must go inside the messages
      themselves.
    ref: "concepts.md#request-initial-metadata"

  - id: metadata-headers-interceptors-011
    difficulty: advanced
    tags: [response-metadata, freezing, gotcha]
    question: |
      A server sets some response header metadata, sends the first response message,
      then tries to add another header. What happens?
    options:
      - "The new header is merged into the already-sent initial metadata"
      - "The new header cannot be added to initial metadata; only trailers can carry more"
      - "The RPC fails with INTERNAL"
      - "The client retroactively receives both headers"
    answer: 1
    explanation: |
      Initial (header) metadata is flushed and frozen once the first message is written
      (or headers are explicitly sent). After that, only trailing metadata can carry
      additional key/value pairs.
    ref: "concepts.md#response-initial-metadata-and-trailing-metadata"

  - id: metadata-headers-interceptors-012
    difficulty: advanced
    tags: [trailers-only, error, wire]
    question: |
      A gRPC call is rejected by an auth interceptor before any message is produced.
      What does the response look like on the wire?
    options:
      - "Initial headers, an empty message, then trailers"
      - "An HTTP 401 with no gRPC headers"
      - "A RST_STREAM frame with no status"
      - "A Trailers-Only response: a single HEADERS frame with HTTP status plus grpc-status/grpc-message and END_STREAM"
    answer: 3
    explanation: |
      When a server fails an RPC before sending initial metadata or a message, gRPC
      emits a Trailers-Only response: one HEADERS frame combining the HTTP status and
      grpc-status/grpc-message with END_STREAM. No separate initial headers are sent.
    ref: "concepts.md#response-initial-metadata-and-trailing-metadata"

  - id: metadata-headers-interceptors-013
    difficulty: beginner
    tags: [use-cases, auth]
    question: |
      Which metadata key conventionally carries a bearer/OAuth token for
      authentication?
    options:
      - "auth-token"
      - "grpc-auth"
      - "authorization"
      - "x-jwt"
    answer: 2
    explanation: |
      The conventional key is authorization, e.g. "authorization: Bearer <jwt>",
      mirroring the HTTP Authorization header. A server interceptor validates it.
    ref: "concepts.md#common-uses-of-metadata"

  - id: metadata-headers-interceptors-014
    difficulty: intermediate
    tags: [security, confidentiality, gotcha]
    question: |
      What protects the confidentiality of metadata values in transit?
    options:
      - "Only the transport (TLS); metadata itself provides no confidentiality"
      - "Metadata is always encrypted by gRPC independent of transport"
      - "Base64 encoding of -bin values"
      - "HPACK header compression"
    answer: 0
    explanation: |
      Metadata is only protected by the transport (TLS). Metadata itself is not
      encrypted, and intermediaries can read/log headers, so you must use TLS and avoid
      placing secrets beyond the auth token in metadata.
    ref: "concepts.md#common-uses-of-metadata"

  - id: metadata-headers-interceptors-015
    difficulty: intermediate
    tags: [tracing, propagation, observability]
    question: |
      Which metadata keys typically carry W3C distributed-tracing context between gRPC
      services?
    options:
      - "trace-id and span-id only as integers"
      - "traceparent and tracestate"
      - "grpc-trace (reserved)"
      - "x-b3 must always be binary"
    answer: 1
    explanation: |
      W3C Trace Context propagates via the traceparent and tracestate headers; gRPC
      census also defines a binary grpc-trace-bin key. Tracing interceptors
      inject/extract these. Deeper tracing tooling lives in observability.
    ref: "concepts.md#common-uses-of-metadata"

  - id: metadata-headers-interceptors-016
    difficulty: intermediate
    tags: [multimap, values]
    question: |
      Can a single gRPC metadata key have multiple values?
    options:
      - "No, keys are unique like a map"
      - "Only binary keys can repeat"
      - "Only on the server side"
      - "Yes; metadata is a multimap, so a key may map to multiple values"
    answer: 3
    explanation: |
      Metadata is a multimap, like HTTP headers: a key can carry multiple values.
      Accessors such as Go's md.Get(key) return a slice of values.
    ref: "concepts.md#request-initial-metadata"

  - id: metadata-headers-interceptors-017
    difficulty: intermediate
    tags: [content-type, transport-headers]
    question: |
      What content-type does a gRPC-over-HTTP/2 call use?
    options:
      - "application/json"
      - "application/protobuf"
      - "application/grpc (e.g. application/grpc+proto)"
      - "application/octet-stream"
    answer: 2
    explanation: |
      gRPC uses content-type application/grpc, with suffixes like +proto or +json. It
      is a transport-managed header, along with te: trailers and user-agent.
    ref: "concepts.md#metadata-key-rules"

  - id: metadata-headers-interceptors-018
    difficulty: beginner
    tags: [interceptors, definition, middleware]
    question: |
      What is a gRPC interceptor?
    options:
      - "Middleware that sits between the transport and application code and can observe or modify every RPC"
      - "A tool that generates stubs from a .proto file"
      - "A load balancer that routes RPCs to backends"
      - "A compression codec applied to messages"
    answer: 0
    explanation: |
      An interceptor is gRPC's middleware: it wraps each RPC, allowing you to inspect
      and mutate metadata, log, time, authenticate, retry, map errors, or short-circuit
      the call — implementing cross-cutting concerns once.
    ref: "concepts.md#what-interceptors-are"

  - id: metadata-headers-interceptors-019
    difficulty: intermediate
    tags: [interceptors, types]
    question: |
      How many interceptor types does gRPC provide across sides and call shapes?
    options:
      - "Two: client and server"
      - "Four: client-unary, client-stream, server-unary, server-stream"
      - "Three: request, response, error"
      - "One generic interceptor for everything"
    answer: 1
    explanation: |
      There are four interceptor types: the two sides (client, server) times the two
      shapes (unary, streaming). Unary and streaming interceptors have different
      signatures because streaming must wrap the stream object.
    ref: "concepts.md#what-interceptors-are"

  - id: metadata-headers-interceptors-020
    difficulty: intermediate
    tags: [server-interceptor, handler, next]
    question: |
      On the server side, what is the "next" thing a unary interceptor is given and can
      choose to call?
    options:
      - "The handler — ultimately the service method implementation"
      - "The invoker that sends the RPC over the wire"
      - "The channel's subchannel picker"
      - "The protobuf marshaller"
    answer: 0
    explanation: |
      A server-side interceptor receives the handler (the "next" toward your service
      method). It can do work before, call handler(...), do work after, or skip calling
      it to short-circuit.
    ref: "concepts.md#how-an-interceptor-wraps-the-handlerinvoker"

  - id: metadata-headers-interceptors-021
    difficulty: intermediate
    tags: [client-interceptor, invoker, next]
    question: |
      On the client side, what does a unary interceptor call to actually send the RPC?
    options:
      - "The handler"
      - "The invoker"
      - "The ServerStream"
      - "The marshaller"
    answer: 1
    explanation: |
      A client-side unary interceptor is given the invoker (the "next" that sends the
      RPC). It typically adds outgoing metadata, then calls invoker(...), then inspects
      the reply/trailers.
    ref: "concepts.md#client-side-vs-server-side-interceptors"

  - id: metadata-headers-interceptors-022
    difficulty: advanced
    tags: [streaming-interceptor, per-message, gotcha]
    question: |
      A developer's streaming interceptor logs a line, but it only runs once no matter
      how many messages flow. Why, and what is the fix?
    options:
      - "Streaming interceptors are disabled by default; enable them in the channel"
      - "Logging is rate-limited by gRPC; raise the limit"
      - "The interceptor body runs once at stream setup; per-message logic must wrap SendMsg/RecvMsg on the stream object"
      - "You must convert the RPC to unary to log per message"
    answer: 2
    explanation: |
      A streaming interceptor runs once at stream setup. To observe individual
      messages, it must wrap the stream and intercept SendMsg/RecvMsg. Putting
      per-message logic in the top-level body runs it only once.
    ref: "concepts.md#how-an-interceptor-wraps-the-handlerinvoker"

  - id: metadata-headers-interceptors-023
    difficulty: intermediate
    tags: [chaining, ordering, go]
    question: |
      In Go's grpc.ChainUnaryInterceptor(a, b, c), which interceptor is outermost (runs
      first on the way in)?
    options:
      - "c"
      - "b"
      - "They run concurrently with no order"
      - "a"
    answer: 3
    explanation: |
      The first argument is the outermost. The inbound order is a -> b -> c -> handler,
      and the outbound (return) order is handler -> c -> b -> a, forming an onion.
    ref: "concepts.md#interceptor-chaining-ordering-and-short-circuiting"

  - id: metadata-headers-interceptors-024
    difficulty: intermediate
    tags: [short-circuit, auth]
    question: |
      How does an auth interceptor reject an unauthenticated call before any business
      logic runs?
    options:
      - "It sets a flag the handler must check"
      - "It returns an error without calling handler/invoker, short-circuiting the chain"
      - "It closes the TCP connection"
      - "It removes the authorization metadata"
    answer: 1
    explanation: |
      An interceptor that returns without calling handler/invoker short-circuits the
      chain — inner interceptors and the handler never run. That is how auth returns
      UNAUTHENTICATED early, producing a Trailers-Only error response.
    ref: "concepts.md#interceptor-chaining-ordering-and-short-circuiting"

  - id: metadata-headers-interceptors-025
    difficulty: advanced
    tags: [ordering, error-mapping, gotcha]
    question: |
      You want a metrics interceptor to record the SAME status code the client
      ultimately sees, after an error-mapping interceptor converts internal errors. How
      should they be ordered?
    options:
      - "Metrics outside error-mapping, so on the way out it observes the mapped final status"
      - "Metrics innermost, error-mapping outermost, so metrics sees the raw error"
      - "Order does not matter for status observation"
      - "Both must be merged into a single interceptor to see the status"
    answer: 0
    explanation: |
      Because interceptors unwind outermost-last, a metrics interceptor placed outside
      the error-mapping interceptor observes the mapped status.Status on the way out —
      the same result the client sees. Putting it inside would record the raw internal
      error.
    ref: "concepts.md#interceptor-chaining-ordering-and-short-circuiting"

  - id: metadata-headers-interceptors-026
    difficulty: advanced
    tags: [java, ordering, chaining, gotcha]
    question: |
      Why is interceptor ordering a common footgun in grpc-java's
      ServerInterceptors.intercept(service, i1, i2, ...)?
    options:
      - "Java runs interceptors concurrently"
      - "Java ignores all but the first interceptor"
      - "Java requires interceptors to be sorted alphabetically"
      - "Java applies them so the LAST listed ends up outermost (reverse of intuition)"
    answer: 3
    explanation: |
      grpc-java wraps interceptors in reverse, so the last one listed becomes the
      outermost. This trips up developers who assume left-to-right ordering; verify with
      a test.
    ref: "concepts.md#interceptor-chaining-ordering-and-short-circuiting"

  - id: metadata-headers-interceptors-027
    difficulty: intermediate
    tags: [use-cases, validation, status]
    question: |
      A validation interceptor rejects a malformed request. Which status code is most
      appropriate?
    options:
      - "UNAVAILABLE"
      - "INTERNAL"
      - "INVALID_ARGUMENT"
      - "DEADLINE_EXCEEDED"
    answer: 2
    explanation: |
      Malformed/invalid request fields map to INVALID_ARGUMENT. A validation
      interceptor rejects with this code before the handler runs. See
      error-handling-and-status-codes for the full model.
    ref: "concepts.md#interceptor-use-cases"

  - id: metadata-headers-interceptors-028
    difficulty: intermediate
    tags: [use-cases, rate-limit, status]
    question: |
      A rate-limiting interceptor rejects a request that exceeds quota. Which gRPC
      status code fits best?
    options:
      - "PERMISSION_DENIED"
      - "FAILED_PRECONDITION"
      - "RESOURCE_EXHAUSTED"
      - "ABORTED"
    answer: 2
    explanation: |
      Quota/rate-limit rejections map to RESOURCE_EXHAUSTED. PERMISSION_DENIED is for
      authorization failures, not throttling.
    ref: "concepts.md#interceptor-use-cases"

  - id: metadata-headers-interceptors-029
    difficulty: advanced
    tags: [retries, service-config, grfc-a6]
    question: |
      For client retries, which approach does gRPC recommend over a hand-written retry
      interceptor?
    options:
      - "The built-in service-config retry policy (per gRFC A6)"
      - "A custom streaming interceptor that replays messages"
      - "Retrying inside the server handler"
      - "Using channel keepalive to retry"
    answer: 0
    explanation: |
      gRPC's built-in retry policy configured via service config (gRFC A6) is preferred
      over a custom interceptor: it handles retryable status codes, backoff, and
      throttling correctly. See retries-resiliency-and-deadline-propagation.
    ref: "concepts.md#interceptor-use-cases"

  - id: metadata-headers-interceptors-030
    difficulty: advanced
    tags: [filters, transport-filter, connection]
    question: |
      In grpc-java, what fires on connection lifecycle events (established/terminated)
      rather than per RPC?
    options:
      - "A ServerInterceptor"
      - "A ClientInterceptor"
      - "A ServerTransportFilter"
      - "A CallCredentials hook"
    answer: 2
    explanation: |
      A ServerTransportFilter fires on transport (connection) lifecycle events, not per
      RPC — useful for connection-scoped concerns like reading the peer's mTLS cert once
      per connection. Interceptors are per-RPC.
    ref: "concepts.md#interceptors-vs-filters-and-proxy-level-middleware"

  - id: metadata-headers-interceptors-031
    difficulty: advanced
    tags: [interceptor-vs-mesh, altitude, judgment]
    question: |
      An org wants uniform mTLS and authorization policy applied to all services
      regardless of language, without changing app code. Where does this best live?
    options:
      - "In a server interceptor per service"
      - "In a client-side unary interceptor"
      - "In the .proto definitions"
      - "In a proxy/mesh filter (e.g., Envoy sidecar) outside the process"
    answer: 3
    explanation: |
      Language-agnostic, uniform policy belongs in a mesh/proxy filter (Envoy sidecar),
      which runs outside the process. In-process interceptors are per-language and per
      service. See system-design for mesh/xDS.
    ref: "concepts.md#interceptors-vs-filters-and-proxy-level-middleware"

  - id: metadata-headers-interceptors-032
    difficulty: intermediate
    tags: [callcredentials, channelcredentials, auth]
    question: |
      What is the difference between channel (transport) credentials and
      CallCredentials?
    options:
      - "Channel creds are per-RPC; call creds set up TLS once"
      - "Channel creds establish the secure channel (TLS/mTLS); CallCredentials are per-RPC, applied as metadata on every call"
      - "They are two names for the same thing"
      - "Channel creds are for servers; call creds are for load balancers"
    answer: 1
    explanation: |
      Channel/transport credentials establish the secure channel (TLS/mTLS), set once.
      CallCredentials are per-RPC credentials applied as metadata (e.g. an OAuth2/JWT
      authorization header) on every call, with the library handling refresh.
    ref: "concepts.md#per-call-credentials-via-metadata-callcredentials"

  - id: metadata-headers-interceptors-033
    difficulty: advanced
    tags: [callcredentials, tls, security, gotcha]
    question: |
      Why do CallCredentials require a secure (TLS) transport by default?
    options:
      - "Because sending a bearer token over cleartext would leak it, so gRPC blocks per-call creds on plaintext by default"
      - "Because base64 encoding needs TLS"
      - "Because TLS is required for HTTP/2 multiplexing"
      - "Because CallCredentials only work with mTLS client certs"
    answer: 0
    explanation: |
      CallCredentials typically carry a bearer token in metadata. Sending it over an
      unencrypted channel would expose the secret, so gRPC requires a secure transport
      by default and drops/rejects per-call creds on plaintext unless you explicitly
      override it (which you should not do in production).
    ref: "concepts.md#per-call-credentials-via-metadata-callcredentials"

  - id: metadata-headers-interceptors-034
    difficulty: advanced
    tags: [callcredentials, interceptor, judgment]
    question: |
      For injecting a refreshing OAuth token as the authorization header on every RPC,
      what is the framework-blessed mechanism?
    options:
      - "A server-side interceptor"
      - "Setting grpc-timeout"
      - "A ServerTransportFilter"
      - "CallCredentials (PerRPCCredentials), which the library applies as metadata and can refresh"
    answer: 3
    explanation: |
      CallCredentials (PerRPCCredentials in Go) is the built-in, refresh-aware way to
      inject the authorization metadata per call. A custom client interceptor also
      works, but then you own token refresh yourself.
    ref: "concepts.md#per-call-credentials-via-metadata-callcredentials"

  - id: metadata-headers-interceptors-035
    difficulty: intermediate
    tags: [go, api, context]
    question: |
      In grpc-go, how does a server handler read incoming request metadata?
    options:
      - "From a global registry"
      - "From the context via metadata.FromIncomingContext(ctx)"
      - "From the request message fields"
      - "From os.Getenv"
    answer: 1
    explanation: |
      In Go, metadata rides on context.Context. The server reads it with
      metadata.FromIncomingContext(ctx); the client attaches outgoing metadata with
      metadata.NewOutgoingContext or AppendToOutgoingContext.
    ref: "concepts.md#reading-and-writing-metadata-across-languages"

  - id: metadata-headers-interceptors-036
    difficulty: advanced
    tags: [java, metadata-key, marshaller]
    question: |
      In grpc-java, which marshaller do you use for a metadata key ending in -bin?
    options:
      - "ASCII_STRING_MARSHALLER"
      - "JSON_MARSHALLER"
      - "UTF8_MARSHALLER"
      - "BINARY_BYTE_MARSHALLER"
    answer: 3
    explanation: |
      A -bin key uses Metadata.BINARY_BYTE_MARSHALLER (byte[] values); plain text keys
      use ASCII_STRING_MARSHALLER. The marshaller must match the key's binary/text
      nature.
    ref: "concepts.md#reading-and-writing-metadata-across-languages"

  - id: metadata-headers-interceptors-037
    difficulty: intermediate
    tags: [python, api, invocation-metadata]
    question: |
      In Python gRPC, how does a server read the metadata a client sent?
    options:
      - "context.invocation_metadata()"
      - "request.metadata"
      - "os.environ['GRPC_METADATA']"
      - "channel.get_metadata()"
    answer: 0
    explanation: |
      A Python server reads client metadata via context.invocation_metadata() and sets
      response trailers with context.set_trailing_metadata(...). Clients pass
      metadata=[(key, value), ...].
    ref: "concepts.md#reading-and-writing-metadata-across-languages"

  - id: metadata-headers-interceptors-038
    difficulty: intermediate
    tags: [use-cases, request-id, ordering, judgment]
    question: |
      You add a request-id interceptor and a logging interceptor and want every log
      line to include the request id. How should they be ordered?
    options:
      - "request-id outside (before) logging, so the id is set before logs are emitted"
      - "Logging outside request-id, so logs run first"
      - "Order does not matter"
      - "They must be the same interceptor as validation"
    answer: 0
    explanation: |
      The request-id interceptor must run before the logging interceptor so the id is
      present in the context/metadata when logs are emitted. Ordering encodes these
      dependencies.
    ref: "concepts.md#interceptor-chaining-ordering-and-short-circuiting"

  - id: metadata-headers-interceptors-039
    difficulty: beginner
    tags: [use-cases, cross-cutting]
    question: |
      Which of these is NOT a typical interceptor use case?
    options:
      - "Authentication and authorization"
      - "Defining the fields of a protobuf message"
      - "Metrics and distributed tracing"
      - "Error mapping and panic recovery"
    answer: 1
    explanation: |
      Defining message fields is done in the .proto schema, not an interceptor.
      Interceptors handle cross-cutting concerns: auth, metrics, tracing, logging,
      validation, retries, error mapping, rate limiting.
    ref: "concepts.md#interceptor-use-cases"

  - id: metadata-headers-interceptors-040
    difficulty: advanced
    tags: [stats-handler, go, observability]
    question: |
      In grpc-go, which low-overhead hook is designed for connection/RPC stats
      (tracing/metrics) that does not need to modify the call?
    options:
      - "stats.Handler"
      - "UnaryInterceptor"
      - "ServerTransportFilter"
      - "CallCredentials"
    answer: 0
    explanation: |
      grpc-go's stats.Handler is a low-overhead stats/tracing hook for connection and
      RPC events. It is preferred over interceptors when you only need to observe (not
      modify) the call. Interceptors are for logic that changes behavior.
    ref: "concepts.md#interceptors-vs-filters-and-proxy-level-middleware"

  - id: metadata-headers-interceptors-041
    difficulty: intermediate
    tags: [trailing-metadata, stats, use-cases]
    question: |
      Why is trailing metadata a natural place to report per-call stats like elapsed
      time or cost?
    options:
      - "Trailers are sent before the message, so stats arrive early"
      - "Trailers are the only encrypted headers"
      - "Trailers are sent after all messages, so end-of-call values (timing, cost) are known"
      - "Trailers can be modified by the client"
    answer: 2
    explanation: |
      Trailing metadata is sent after the response messages, so values known only at
      the end of the call — total elapsed time, rows scanned, cost/quota consumed — can
      be reported there alongside grpc-status.
    ref: "concepts.md#response-initial-metadata-and-trailing-metadata"

  - id: metadata-headers-interceptors-042
    difficulty: advanced
    tags: [binary-metadata, base64, wire, gotcha]
    question: |
      A team stores a raw protobuf blob in a metadata key named "ctx" (no suffix) and
      sees corrupted headers. What is the correct fix?
    options:
      - "Rename the key to grpc-ctx"
      - "Gzip the value first"
      - "Rename the key to ctx-bin so the library base64-encodes the bytes"
      - "Split the value across multiple ASCII headers manually"
    answer: 2
    explanation: |
      Binary values must use a -bin key (ctx-bin), which tells the library to
      base64-encode on the wire and decode on receipt. A plain key requires printable
      ASCII, so binary data in it corrupts the header.
    ref: "concepts.md#metadata-key-rules"

  - id: metadata-headers-interceptors-043
    difficulty: intermediate
    tags: [http-status, grpc-status, wire, gotcha]
    question: |
      A gRPC call fails with grpc-status 7 (PERMISSION_DENIED). What is the HTTP-level
      :status likely to be?
    options:
      - "403"
      - "500"
      - "200 — the HTTP status is typically 200 and the real result is in grpc-status"
      - "401"
    answer: 2
    explanation: |
      For a normal gRPC response the HTTP :status is 200 regardless of the gRPC outcome;
      the actual result is conveyed by grpc-status in the trailers. Non-200 HTTP
      statuses appear only for transport-level HTTP failures.
    ref: "concepts.md#response-initial-metadata-and-trailing-metadata"

  - id: metadata-headers-interceptors-044
    difficulty: advanced
    tags: [composite-credentials, tls, callcredentials]
    question: |
      How do you combine mTLS transport security with a per-RPC bearer token in gRPC?
    options:
      - "You cannot combine them; pick one"
      - "Put the token in the TLS SNI field"
      - "Compose channel (transport) credentials with call credentials (e.g. CompositeChannelCredentials)"
      - "Put the client cert in a -bin metadata key"
    answer: 2
    explanation: |
      gRPC lets you compose channel credentials (mTLS) with call credentials (per-RPC
      token applied as metadata) — e.g. CompositeChannelCredentials in Go or
      CallCredentials.compose in Java — so both apply together.
    ref: "concepts.md#per-call-credentials-via-metadata-callcredentials"

  - id: metadata-headers-interceptors-045
    difficulty: intermediate
    tags: [why-http2, trailers, foundations]
    question: |
      Which HTTP/2 capability is essential for gRPC's status-in-trailers design and is
      not reliably available in HTTP/1.1?
    options:
      - "Chunked transfer encoding"
      - "Trailing headers (trailers)"
      - "Keep-alive connections"
      - "Gzip content-encoding"
    answer: 1
    explanation: |
      gRPC returns grpc-status in trailing headers after the message. HTTP/2 supports
      trailers reliably; HTTP/1.1 does not, which is one reason gRPC requires HTTP/2.
      The full HTTP/2 wire details live in networking/http2.
    ref: "concepts.md#what-is-metadata"

  - id: metadata-headers-interceptors-046
    difficulty: advanced
    tags: [rich-errors, status-details-bin, wire]
    question: |
      How does gRPC transmit rich error details (a google.rpc.Status with details) on
      the wire?
    options:
      - "As plaintext JSON in grpc-message"
      - "In a new DATA frame after the trailers"
      - "It cannot; only a code and string message are supported"
      - "In the grpc-status-details-bin trailer, a base64-encoded google.rpc.Status"
    answer: 3
    explanation: |
      Rich error details ride in the grpc-status-details-bin trailing-metadata key,
      which carries a base64-encoded google.rpc.Status protobuf (a -bin key). This is in
      addition to grpc-status and grpc-message. See error-handling-and-status-codes.
    ref: "concepts.md#response-initial-metadata-and-trailing-metadata"

  - id: metadata-headers-interceptors-047
    difficulty: intermediate
    tags: [client-interceptor, outgoing-metadata, go]
    question: |
      In a grpc-go client unary interceptor, how do you add an outgoing header before
      calling the invoker?
    options:
      - "Modify the reply object"
      - "Set it on the ClientConn permanently"
      - "metadata.AppendToOutgoingContext(ctx, key, value) then invoker(ctx, ...)"
      - "Return the metadata from the interceptor"
    answer: 2
    explanation: |
      A client interceptor augments the outgoing context with
      metadata.AppendToOutgoingContext(ctx, "authorization", ...) and then passes that
      context to invoker(...), so the header is sent with the RPC.
    ref: "concepts.md#client-side-vs-server-side-interceptors"

  - id: metadata-headers-interceptors-048
    difficulty: advanced
    tags: [interceptor-vs-interceptor, decoded-message, judgment]
    question: |
      When should you use an interceptor rather than a mesh/Envoy filter for a
      cross-cutting concern?
    options:
      - "When the policy must apply uniformly across all languages and services"
      - "When you want to avoid touching application code"
      - "When you need the decoded protobuf message or per-RPC metadata inside your service"
      - "Never; mesh filters always supersede interceptors"
    answer: 2
    explanation: |
      Use an interceptor when the logic needs the decoded message or per-RPC metadata
      inside the service process. Use a mesh filter for uniform, language-agnostic org
      policy applied outside the process.
    ref: "concepts.md#interceptors-vs-filters-and-proxy-level-middleware"

  - id: metadata-headers-interceptors-049
    difficulty: beginner
    tags: [metadata-vs-message, design, judgment]
    question: |
      Which belongs in the protobuf message rather than in metadata?
    options:
      - "A distributed-tracing context header"
      - "The bearer auth token"
      - "The request correlation id"
      - "A domain field like the order's total amount"
    answer: 3
    explanation: |
      Domain data that is part of the response contract (an order total) belongs in the
      protobuf message. Cross-cutting call context (auth token, trace context,
      request-id) belongs in metadata.
    ref: "concepts.md#what-is-metadata"

  - id: metadata-headers-interceptors-050
    difficulty: intermediate
    tags: [server-interceptor, info, full-method]
    question: |
      What does the UnaryServerInfo passed to a server interceptor provide?
    options:
      - "The client's IP address only"
      - "The full method name being invoked (e.g. /pkg.Service/Method)"
      - "The negotiated TLS cipher"
      - "The retry policy for the call"
    answer: 1
    explanation: |
      UnaryServerInfo carries the FullMethod name (e.g. /helloworld.Greeter/SayHello),
      letting an interceptor branch on which method is being called — useful for
      method-scoped auth, metrics labels, or logging.
    ref: "concepts.md#what-interceptors-are"

  - id: metadata-headers-interceptors-051
    difficulty: advanced
    tags: [tracing, span, ordering, observability, judgment]
    question: |
      For a distributed-tracing interceptor to measure the true end-to-end latency of an
      RPC including all other interceptors, where should it sit in the chain?
    options:
      - "Innermost, closest to the handler"
      - "It does not matter for latency"
      - "It should be a separate transport filter only"
      - "Outermost, so its span wraps every other interceptor and the handler"
    answer: 3
    explanation: |
      The tracing interceptor should be outermost so its span encloses all inner
      interceptors and the handler, capturing the full server-side processing time.
      Placing it inside would exclude time spent in outer interceptors.
    ref: "concepts.md#interceptor-chaining-ordering-and-short-circuiting"

  - id: metadata-headers-interceptors-052
    difficulty: intermediate
    tags: [client-trailer, capture, go]
    question: |
      In grpc-go, how does a client capture the server's trailing metadata for a unary
      call?
    options:
      - "It is returned as a second value from the method"
      - "By passing grpc.Trailer(&trailer) as a CallOption"
      - "Trailers are not accessible to clients"
      - "By reading the response message's Trailer field"
    answer: 1
    explanation: |
      The client passes grpc.Header(&header) and/or grpc.Trailer(&trailer) as
      CallOptions; gRPC fills those metadata.MD values with the server's initial and
      trailing metadata.
    ref: "concepts.md#response-initial-metadata-and-trailing-metadata"

  - id: metadata-headers-interceptors-053
    difficulty: advanced
    tags: [grpc-encoding, reserved, compression]
    question: |
      A developer sets grpc-encoding: gzip in application metadata to force
      compression. What is the problem?
    options:
      - "grpc-encoding is a reserved grpc-* key managed by the framework's compression config, not settable as app metadata"
      - "gzip is not a valid encoding"
      - "Compression is only for streaming RPCs"
      - "It must be a -bin key"
    answer: 0
    explanation: |
      grpc-encoding is a reserved grpc-* key managed by the framework based on
      compressor configuration. Applications should configure compression through the
      library's API, not by setting the reserved header directly.
    ref: "concepts.md#metadata-key-rules"

  - id: metadata-headers-interceptors-054
    difficulty: beginner
    tags: [onion, wrapping, mechanism]
    question: |
      The interceptor chain is often described as an "onion." What does that mean?
    options:
      - "Interceptors run in random order"
      - "Only one interceptor executes per call"
      - "Each interceptor wraps the next; the outermost runs first inbound and last outbound"
      - "Interceptors run on separate threads per layer"
    answer: 2
    explanation: |
      Interceptors nest like an onion: each wraps the next inner layer. The outermost
      executes first on the way in and last on the way out, with the handler at the
      center — the classic decorator/middleware pattern.
    ref: "concepts.md#how-an-interceptor-wraps-the-handlerinvoker"
