topic: "Service & Message Definition (proto3)"
domain: grpc
topic_slug: service-and-message-definition
version: 1
questions:
  - id: service-and-message-definition-001
    difficulty: beginner
    tags: [service, syntax]
    question: |
      In a .proto file, how is a single remote method with one request and one
      response declared inside a service?
    options:
      - "Response Method(Request);"
      - "def Method(Request): Response"
      - "rpc Method(Request) returns (Response);"
      - "method Method(Request) -> Response;"
    answer: 2
    explanation: |
      A service groups RPC methods. Each is declared as
      `rpc Method(RequestMessage) returns (ResponseMessage);`. The request and response are
      always named message types.
    ref: "concepts.md#defining-a-service"

  - id: service-and-message-definition-002
    difficulty: beginner
    tags: [rpc-types, streaming]
    question: |
      Which signature declares a server-streaming RPC (one request, many responses)?
    options:
      - "rpc M(stream Req) returns (Resp);"
      - "rpc M(Req) returns (stream Resp);"
      - "rpc M(stream Req) returns (stream Resp);"
      - "rpc M(Req) returns (Resp);"
    answer: 1
    explanation: |
      The `stream` keyword on the RESPONSE type makes it server-streaming: the client sends
      one request and receives a stream of responses. `stream` on the request is
      client-streaming; on both is bidirectional; on neither is unary.
    ref: "concepts.md#the-four-rpc-method-signatures"

  - id: service-and-message-definition-003
    difficulty: beginner
    tags: [rpc-types]
    question: |
      What does the `stream` keyword control in an RPC signature?
    options:
      - "Whether messages are gzip-compressed before HTTP/2 framing"
      - "The HTTP/2 method verb (POST vs GET) chosen for the call on the wire"
      - "Whether the underlying transport connection is secured with TLS"
      - "The cardinality of messages on that side of the call (one vs many)"
    answer: 3
    explanation: |
      `stream` selects the call type by declaring that side carries a stream of messages
      instead of exactly one. It changes the generated API's cardinality and how many DATA
      frames flow, not the transport security or framing rules.
    ref: "concepts.md#the-four-rpc-method-signatures"

  - id: service-and-message-definition-004
    difficulty: intermediate
    tags: [messages, scalars, gotcha]
    question: |
      Why can't you write `rpc GetName(int64) returns (string);`?
    options:
      - "An RPC's request and response must be named message types, not scalars"
      - "int64 is not a valid proto3 scalar type; you must use sint64 instead"
      - "Scalars are permitted only as fields nested inside streaming RPCs"
      - "gRPC permits exactly one input parameter, and it must be the final field"
    answer: 0
    explanation: |
      protoc rejects scalars, enums, maps, and repeated fields as RPC inputs/outputs. Inputs
      and outputs must be message types. You wrap the scalar in a message so the request can
      gain fields later without a breaking change.
    ref: "concepts.md#requests-and-responses-must-be-message-types"

  - id: service-and-message-definition-005
    difficulty: intermediate
    tags: [messages, evolution, design]
    question: |
      Your RPC currently needs only a single string id. Why wrap it in a dedicated request
      message instead of using google.protobuf.StringValue?
    options:
      - "Custom messages compress better on the wire than well-known wrapper types"
      - "StringValue is measurably slower to serialize than an equivalent custom message"
      - "So you can add fields (e.g. a locale or page_token) later without a breaking change"
      - "StringValue cannot be used as an RPC request type because protoc rejects it"
    answer: 2
    explanation: |
      A dedicated request message is an extensible envelope: adding a field later is
      non-breaking. If the request were a bare StringValue you would have nowhere to add a
      parameter, forcing a new method or breaking signature change.
    ref: "concepts.md#requests-and-responses-must-be-message-types"

  - id: service-and-message-definition-006
    difficulty: intermediate
    tags: [proto3, presence, wire, gotcha]
    question: |
      In proto3, is a plain scalar field set to its default value (e.g. an int32 equal to 0)
      transmitted on the wire?
    options:
      - "Yes, every declared field is always serialized so the receiver sees an explicit value"
      - "No, a plain scalar at its default is omitted; the receiver reconstructs the default"
      - "Only if the message declares fewer than 16 fields, which fit a single-byte tag"
      - "Only when using the JSON encoding; the binary encoding always sends every field"
    answer: 1
    explanation: |
      proto3 plain scalars have no explicit presence. A field equal to its type's zero value
      is not serialized at all to save space; the decoder simply leaves the field at its
      default. This is why you cannot distinguish "unset" from "set to zero" for a plain
      scalar.
    ref: "concepts.md#proto3-field-presence-on-the-wire-gotcha"

  - id: service-and-message-definition-007
    difficulty: intermediate
    tags: [proto3, presence, optional]
    question: |
      You need to tell "the client explicitly set retry_limit to 0" apart from "the client
      never set retry_limit." What is the idiomatic proto3 fix for a single scalar?
    options:
      - "Mark the field `optional` to get explicit presence tracking"
      - "Change the field type to string and send \"0\""
      - "Move the field into a separate message and check for nil"
      - "Use a repeated int32 with at most one element"
    answer: 0
    explanation: |
      Marking a proto3 scalar `optional` restores explicit presence: generated code exposes a
      has_x() check and the field is serialized even at its default. Under the hood the
      compiler models this as a synthetic single-field oneof.
    ref: "concepts.md#proto3-field-presence-on-the-wire-gotcha"

  - id: service-and-message-definition-008
    difficulty: intermediate
    tags: [package, wire, path]
    question: |
      Given `package acme.orders.v1;` and `service OrderService { rpc GetOrder(...) ... }`,
      what HTTP/2 `:path` does the client use?
    options:
      - "/GetOrder"
      - "/OrderService/GetOrder"
      - "/acme/orders/v1/GetOrder"
      - "/acme.orders.v1.OrderService/GetOrder"
    answer: 3
    explanation: |
      The wire path is `/<fully-qualified-service>/<method>` =
      `/acme.orders.v1.OrderService/GetOrder`. The package and service names are part of the
      path, which is why renaming them is a breaking change.
    ref: "concepts.md#defining-a-service"

  - id: service-and-message-definition-009
    difficulty: advanced
    tags: [package, wire, breaking]
    question: |
      A team renames the proto `package` but keeps every message and method identical. What
      happens to already-deployed clients?
    options:
      - "Nothing, because the messages remain byte-compatible on the wire regardless of package"
      - "They break: the RPC `:path` changes, so calls hit an unknown method (UNIMPLEMENTED)"
      - "They automatically follow the rename because gRPC issues a 307 redirect to the new path"
      - "Only streaming RPCs break; unary calls are unaffected by a package rename"
    answer: 1
    explanation: |
      The package is part of the `:path` (`/<package>.<Service>/<Method>`). Renaming it
      changes the path, so old clients call the old path and the server responds UNIMPLEMENTED
      even though message bytes are unchanged. Package renames are breaking.
    ref: "concepts.md#package-and-namespacing"

  - id: service-and-message-definition-010
    difficulty: intermediate
    tags: [imports]
    question: |
      File A imports B. File C imports A (but not B). Can C use the message types defined in
      B?
    options:
      - "Only if A and B are declared in the same package namespace"
      - "Yes, imports are fully transitive by default in proto3"
      - "No, a plain `import` is not transitive; C must import B directly"
      - "Yes, but only for enum types, which are always re-exported"
    answer: 2
    explanation: |
      A plain `import` makes the imported file's types visible only in the importing file; it
      is not transitive. To re-export types transitively you use `import public`.
    ref: "concepts.md#imports-and-import-public"

  - id: service-and-message-definition-011
    difficulty: advanced
    tags: [imports, evolution]
    question: |
      You want to move a message to a new .proto file without breaking consumers whose code
      still does `import "old/path.proto";`. What is the clean technique?
    options:
      - "Duplicate the full message definition verbatim in both the old and new files"
      - "Add a `package_alias` file option pointing the old package at the new one"
      - "Delete the old file and tell every consumer to update their import statements"
      - "Leave a stub at the old path that does `import public` of the new file"
    answer: 3
    explanation: |
      `import public` re-exports the imported file's types transitively. A stub file at the
      old path that `import public`s the new location keeps existing `import "old/path.proto"`
      statements resolving the relocated type — a non-breaking move.
    ref: "concepts.md#imports-and-import-public"

  - id: service-and-message-definition-012
    difficulty: intermediate
    tags: [options, codegen, wire]
    question: |
      Two .proto files are identical except one sets `option java_package` and
      `option go_package`. How do their wire encodings compare?
    options:
      - "They are wire-compatible; file options only affect generated source, not the wire"
      - "Only the Java output is wire-compatible; Go changes the encoding"
      - "They are incompatible because options change field numbering"
      - "The wire bytes differ because options are serialized into each message"
    answer: 0
    explanation: |
      File options like java_package/go_package are metadata for code generators. They change
      the shape of generated source (package names, class layout) but never the bytes on the
      wire, so the two schemas remain wire-compatible.
    ref: "concepts.md#file-options-for-generated-code"

  - id: service-and-message-definition-013
    difficulty: intermediate
    tags: [options, go]
    question: |
      What does the part after the semicolon in `option go_package =
      "github.com/acme/orders/genpb/ordersv1;ordersv1";` specify?
    options:
      - "The module's minimum required Go toolchain version"
      - "The gRPC service's semantic version for the registry"
      - "The Go package identifier (name) to use in the generated file"
      - "A build tag used for conditional compilation of the file"
    answer: 2
    explanation: |
      In go_package, the value before the `;` is the import path and the part after it is the
      Go package name (identifier) used in the generated .pb.go files. Without a proper
      go_package, protoc-gen-go errors or guesses badly.
    ref: "concepts.md#file-options-for-generated-code"

  - id: service-and-message-definition-014
    difficulty: intermediate
    tags: [codegen, protoc, plugins]
    question: |
      How does protoc hand work to a language plugin such as protoc-gen-go?
    options:
      - "It dynamically links the plugin as a shared library at compile time"
      - "It sends a CodeGeneratorRequest (descriptors) on the plugin's stdin and reads a CodeGeneratorResponse on stdout"
      - "It writes the descriptors to a temp file the plugin repeatedly polls"
      - "It calls the plugin over a local gRPC channel bound to localhost"
    answer: 1
    explanation: |
      protoc parses the .proto into descriptors, then for each --<lang>_out spawns a
      protoc-gen-<lang> binary, passing a CodeGeneratorRequest on stdin and reading a
      CodeGeneratorResponse (the generated source) on stdout. This stdin/stdout protocol is
      why anyone can add a language or custom generator.
    ref: "concepts.md#code-generation-protoc-plugins-and-buf"

  - id: service-and-message-definition-015
    difficulty: intermediate
    tags: [codegen, go, plugins]
    question: |
      In a modern Go gRPC setup, which plugin generates the service client/server stubs (as
      opposed to the message structs)?
    options:
      - "protoc-gen-go-grpc generates the service stubs; protoc-gen-go generates the messages"
      - "protoc-gen-grpc-gateway generates the service client/server stubs directly"
      - "buf generates the stubs internally without invoking any plugin"
      - "protoc-gen-go generates both the message structs and the service stubs"
    answer: 0
    explanation: |
      Modern toolchains split responsibilities: protoc-gen-go emits the message types
      (.pb.go) and protoc-gen-go-grpc emits the service client/server stubs (_grpc.pb.go).
      They are separate plugins invoked from the same descriptors.
    ref: "concepts.md#code-generation-protoc-plugins-and-buf"

  - id: service-and-message-definition-016
    difficulty: intermediate
    tags: [buf, tooling, ci]
    question: |
      Which capability does buf add that raw protoc does not provide out of the box?
    options:
      - "Support for the HTTP/2 transport that raw protoc cannot emit on its own"
      - "Automatic TLS certificate rotation for the generated gRPC server endpoints"
      - "The ability to encode and decode messages to the binary wire format"
      - "Linting, breaking-change detection, and dependency management via the BSR"
    answer: 3
    explanation: |
      buf wraps codegen with a declarative buf.gen.yaml and adds first-class linting,
      breaking-change detection (buf breaking), and dependency management through the Buf
      Schema Registry (BSR). protoc is just the compiler + plugin protocol.
    ref: "concepts.md#code-generation-protoc-plugins-and-buf"

  - id: service-and-message-definition-017
    difficulty: advanced
    tags: [buf, ci, evolution]
    question: |
      What does `buf breaking --against '.git#branch=main'` do in CI?
    options:
      - "Runs the gRPC server's integration tests against the deployed main branch"
      - "Reformats the .proto files to house style and rewrites them in place"
      - "Compiles the proposed schema against the main baseline and fails the build if any incompatible change is detected"
      - "Publishes the current module to the Buf Schema Registry as a new tag"
    answer: 2
    explanation: |
      buf breaking compares the proposed schema to a baseline (a git ref or BSR module) and
      fails CI on any wire/source incompatible change, so a breaking change cannot merge
      accidentally. Linting/style is a separate command, buf lint.
    ref: "concepts.md#api-evolution-discipline-and-buf"

  - id: service-and-message-definition-018
    difficulty: advanced
    tags: [field-mask, partial-update, design]
    question: |
      A naive `UpdateOrder(Order)` RPC is ambiguous: is `discount = 0` "set discount to zero"
      or "leave it alone"? What is the idiomatic gRPC solution?
    options:
      - "Add a google.protobuf.FieldMask update_mask naming which paths to apply"
      - "Use a repeated discount field and treat an empty list as 'leave alone'"
      - "Switch the whole API to REST so PATCH semantics apply automatically"
      - "Send two sequential calls: one to clear the field and one to set it"
    answer: 0
    explanation: |
      A google.protobuf.FieldMask lists the field paths the server should apply; it ignores
      everything else. This gives explicit, unambiguous PATCH-like partial-update semantics
      and resolves the proto3 "zero vs unset" ambiguity for updates.
    ref: "concepts.md#field-masks-for-partial-updates"

  - id: service-and-message-definition-019
    difficulty: intermediate
    tags: [design, enum]
    question: |
      What is the recommended value for tag 0 of a proto3 enum used in a message?
    options:
      - "It must be left permanently unused so protoc emits no accessor for that slot"
      - "A negative sentinel value that generated code maps to an error condition"
      - "The most common real value, since the zero default is omitted to save wire bytes"
      - "An explicit UNSPECIFIED sentinel so 'unset' never collides with a real value"
    answer: 3
    explanation: |
      Because proto3 scalars/enums default to their zero value and that default is not sent on
      the wire, the enum's 0 should be an explicit *_UNSPECIFIED sentinel. Otherwise an unset
      enum is indistinguishable from a real value that happens to map to 0.
    ref: "concepts.md#message-design-best-practices"

  - id: service-and-message-definition-020
    difficulty: advanced
    tags: [design, reserved, evolution]
    question: |
      You delete a field from a message. Why `reserved` its tag number and name?
    options:
      - "So the generated code drops the deleted field and stays a few bytes smaller"
      - "So the number/name can never be silently reused with a different type, corrupting data for old peers"
      - "Because proto3 forbids leaving gaps in the sequence of field numbers"
      - "To force every downstream client to regenerate stubs and upgrade at once"
    answer: 1
    explanation: |
      Reusing a deleted field's tag number with a new type would let old peers misinterpret
      bytes, silently corrupting data. `reserved` on the number (and name) makes the compiler
      reject any future reuse, protecting wire compatibility.
    ref: "concepts.md#message-design-best-practices"

  - id: service-and-message-definition-021
    difficulty: intermediate
    tags: [rpc-types, wire, http2]
    question: |
      At the HTTP/2 level, how does a unary RPC differ from a server-streaming RPC?
    options:
      - "Unary opens a new TCP connection per call; streaming reuses one"
      - "Streaming responses omit the trailing gRPC status trailer entirely"
      - "Unary calls fall back to HTTP/1.1 while only streaming calls need HTTP/2"
      - "They are the same kind of stream; unary just carries a single message each way"
    answer: 3
    explanation: |
      Every call type maps to exactly one HTTP/2 stream carrying length-prefixed Protobuf
      messages. Unary is not a special protocol — it is a stream with a single message in each
      direction. Only the message cardinality differs.
    ref: "concepts.md#the-four-rpc-method-signatures"

  - id: service-and-message-definition-022
    difficulty: beginner
    tags: [rpc-types, bidi]
    question: |
      Which signature declares a bidirectional streaming RPC?
    options:
      - "rpc M(stream Req) returns (stream Resp);"
      - "rpc M(Req) returns (Resp) bidi;"
      - "rpc M(Req) returns (stream Resp);"
      - "rpc M(stream Req) returns (Resp);"
    answer: 0
    explanation: |
      Bidirectional streaming puts `stream` on both the request and response types, giving two
      independent read/write streams over one call. There is no `bidi` keyword.
    ref: "concepts.md#the-four-rpc-method-signatures"

  - id: service-and-message-definition-023
    difficulty: advanced
    tags: [design, evolution, api-discipline]
    question: |
      Why is "one request message and one response message per RPC" recommended even when two
      methods take the same fields today?
    options:
      - "It makes the wire encoding smaller by sharing one field-tag space across methods"
      - "It reduces generated code size by emitting a single shared message struct"
      - "So each method can add fields independently later without coupling their evolution"
      - "Because protoc forbids reusing one message type across two separate methods"
    answer: 2
    explanation: |
      Sharing a request message couples two methods: the moment one needs a new parameter, the
      change lands on both. Dedicated messages are nearly free (codegen) and let each RPC
      evolve independently for years.
    ref: "concepts.md#message-design-best-practices"

  - id: service-and-message-definition-024
    difficulty: intermediate
    tags: [design, types, money]
    question: |
      Which is the best practice for representing a monetary amount in a proto3 message?
    options:
      - "A double field for the amount, relying on IEEE-754 to stay accurate"
      - "A dedicated Money message (currency plus integer units/nanos), never floating point"
      - "A formatted string such as \"$19.99\" the receiver parses back to a number"
      - "Two separate int32 fields named dollars and cents, recombined by the reader"
    answer: 1
    explanation: |
      Floating point introduces rounding errors for currency. The idiomatic choice is a
      dedicated Money message with a currency code and integer units/nanos (as in
      google.type.Money), which is exact and self-describing.
    ref: "concepts.md#message-design-best-practices"

  - id: service-and-message-definition-025
    difficulty: intermediate
    tags: [design, timestamps, types]
    question: |
      How should you represent an event time in a proto3 message?
    options:
      - "A float of fractional days since epoch"
      - "Three int32 fields for year, month, day"
      - "A string in whatever format the client prefers"
      - "google.protobuf.Timestamp (a well-known type)"
    answer: 3
    explanation: |
      google.protobuf.Timestamp is the well-known type for absolute time; google.protobuf.Duration
      for spans. They are unambiguous, cross-language, and avoid the pitfalls of ad-hoc epoch
      ints or strings.
    ref: "concepts.md#message-design-best-practices"

  - id: service-and-message-definition-026
    difficulty: advanced
    tags: [proto3, presence, message-fields]
    question: |
      Which fields already track presence in proto3 WITHOUT needing the `optional` keyword?
    options:
      - "All scalar fields, since proto3 keeps a presence bit for every one of them"
      - "Message-typed fields (present vs nil/absent), and repeated/map fields"
      - "Only enum fields, because their zero sentinel doubles as a presence flag"
      - "None of them; every field type requires the `optional` keyword for presence"
    answer: 1
    explanation: |
      Message-typed fields already have presence (a submessage is either present or
      nil/absent), and repeated/map fields track their element count. Only plain scalars and
      enums lack presence in proto3, which is why `optional` exists for them.
    ref: "concepts.md#proto3-field-presence-on-the-wire-gotcha"

  - id: service-and-message-definition-027
    difficulty: intermediate
    tags: [pagination, design, list]
    question: |
      What fields should a well-designed List RPC's request typically include for scalability?
    options:
      - "page_size and page_token for pagination"
      - "An offset value expressed as a float"
      - "The full result set returned inline"
      - "A single boolean fetch_all flag"
    answer: 0
    explanation: |
      List RPCs should paginate: a page_size for the max items and an opaque page_token to
      fetch the next page. This mirrors the AIP list-method pattern and keeps responses
      bounded.
    ref: "concepts.md#message-design-best-practices"

  - id: service-and-message-definition-028
    difficulty: advanced
    tags: [evolution, safe-changes]
    question: |
      Which of the following is a NON-breaking (safe) change to a proto3 service?
    options:
      - "Changing a field's type from int32 to string"
      - "Changing an existing field's tag number"
      - "Adding a new field with a new, previously-unused tag number"
      - "Renaming the service while leaving all methods intact"
    answer: 2
    explanation: |
      Adding a new field with a fresh tag number is backward/forward compatible: old peers
      ignore the unknown field. Changing tag numbers or types, or renaming services/methods,
      are all breaking.
    ref: "concepts.md#api-evolution-discipline-and-buf"

  - id: service-and-message-definition-029
    difficulty: advanced
    tags: [evolution, breaking]
    question: |
      Which change is BREAKING at the wire level?
    options:
      - "Adding a new enum value at the end"
      - "Adding a new RPC method to a service"
      - "Adding a new message type to the file"
      - "Changing an existing field's tag number"
    answer: 3
    explanation: |
      Field tag numbers are the identity used on the wire. Changing an existing field's number
      breaks compatibility because peers key decoding on the number. Adding methods, messages,
      or (tolerated) enum values is safe.
    ref: "concepts.md#api-evolution-discipline-and-buf"

  - id: service-and-message-definition-030
    difficulty: advanced
    tags: [versioning, evolution]
    question: |
      You must make a genuinely backward-incompatible redesign of an API. What is the
      recommended approach?
    options:
      - "Introduce a new major version in the package (e.g. acme.orders.v2) served alongside v1"
      - "Reuse the reserved field numbers from deleted fields for the new shapes"
      - "Switch the service over to REST temporarily during the migration window"
      - "Mutate the existing messages in place and notify all clients to adapt"
    answer: 0
    explanation: |
      The convention is to encode a major version in the package. A breaking redesign becomes
      a new package (v2) living side-by-side with v1, so both can be served during migration
      and old clients keep working.
    ref: "concepts.md#package-and-namespacing"

  - id: service-and-message-definition-031
    difficulty: intermediate
    tags: [design, nesting]
    question: |
      Why does the guidance discourage deeply nested message structures?
    options:
      - "Deep nesting forces the message to serialize as JSON instead of binary"
      - "Deep nesting is rejected by protoc once it exceeds three levels deep"
      - "They are hard to evolve, awkward to field-mask, and clumsy in generated code"
      - "Nested messages cannot be used inside any streaming RPC signature"
    answer: 2
    explanation: |
      Deeply nested messages complicate evolution and field masking and produce awkward
      generated APIs. Prefer flatter messages, referencing sub-resources by id where
      appropriate.
    ref: "concepts.md#message-design-best-practices"

  - id: service-and-message-definition-032
    difficulty: intermediate
    tags: [options, java]
    question: |
      What does `option java_multiple_files = true;` do?
    options:
      - "Automatically splits the source .proto definition across several files on disk"
      - "Generates one Java file per top-level message/enum/service instead of one outer wrapper class"
      - "Enables multi-threaded serialization of large generated messages at runtime"
      - "Produces both proto2 and proto3 compatible generated output side by side"
    answer: 1
    explanation: |
      With java_multiple_files = true, each top-level message/enum/service becomes its own
      .java file rather than being nested inside a single outer class. It only affects the
      generated Java source layout, not the wire format.
    ref: "concepts.md#file-options-for-generated-code"

  - id: service-and-message-definition-033
    difficulty: advanced
    tags: [options, optimize-for, embedded]
    question: |
      What is the trade-off of `option optimize_for = LITE_RUNTIME;`?
    options:
      - "A smaller runtime (drops reflection/descriptors) useful on Android/embedded, at the cost of some features"
      - "Automatic gzip compression of all messages before they are written to the wire"
      - "It disables all streaming RPC types, leaving only unary calls available"
      - "Faster wire encoding in exchange for somewhat larger serialized message payloads"
    answer: 0
    explanation: |
      LITE_RUNTIME generates code that links a smaller runtime, dropping descriptor/reflection
      support. It shrinks binary size (handy on mobile/embedded) but loses features that
      depend on reflection. It does not change the wire format.
    ref: "concepts.md#file-options-for-generated-code"

  - id: service-and-message-definition-034
    difficulty: intermediate
    tags: [contract-first, workflow]
    question: |
      What does it mean that gRPC is "contract-first"?
    options:
      - "Contracts are negotiated at runtime between client and server via reflection"
      - "Clients must agree to a formal legal contract before they may call the service"
      - "You write the .proto contract first, then generate typed client stubs and server skeletons from it"
      - "The server implementation is written first, before any schema file exists"
    answer: 2
    explanation: |
      Contract-first means the .proto is the source of truth authored before code. protoc/buf
      generate strongly-typed client stubs and server skeletons from it; the wire format and
      compatibility guarantees all derive from that contract.
    ref: "concepts.md#defining-a-service"

  - id: service-and-message-definition-035
    difficulty: beginner
    tags: [syntax, proto3]
    question: |
      Which line must appear to declare a file uses proto3 syntax?
    options:
      - "version = 3;"
      - "syntax = \"proto3\";"
      - "proto3;"
      - "use proto3;"
    answer: 1
    explanation: |
      A proto3 file starts with `syntax = "proto3";`. Without it, protoc assumes proto2, which
      has different presence/default semantics.
    ref: "concepts.md#defining-a-service"

  - id: service-and-message-definition-036
    difficulty: advanced
    tags: [proto2, proto3, comparison]
    question: |
      Which capability does proto2 have that proto3's plain scalar fields historically lacked?
    options:
      - "The ability to define RPC services inside the schema file"
      - "Support for the compact binary wire encoding format"
      - "Support for the repeated keyword on message fields"
      - "Custom default values and built-in field presence for scalars"
    answer: 3
    explanation: |
      proto2 supports custom field defaults (`[default=...]`) and tracks presence for scalars.
      proto3 dropped custom defaults (always the type zero) and, for plain scalars, dropped
      presence — restored later via the `optional` keyword.
    ref: "concepts.md#proto3-field-presence-on-the-wire-gotcha"

  - id: service-and-message-definition-037
    difficulty: intermediate
    tags: [field-mask, read-mask]
    question: |
      Besides updates, what other use does a FieldMask enable on a read/get RPC?
    options:
      - "Transparently gzip-compressing the response payload before it hits the wire"
      - "Encrypting the named fields with a per-message key negotiated at the handshake"
      - "Returning only a subset of fields (a read mask) to save bandwidth on large messages"
      - "Reordering the response fields into ascending tag-number order on output"
    answer: 2
    explanation: |
      A read mask lets the client name exactly which fields it wants back, so the server can
      return a partial response and save bandwidth on large messages — the read-side analogue
      of the update mask.
    ref: "concepts.md#field-masks-for-partial-updates"

  - id: service-and-message-definition-038
    difficulty: advanced
    tags: [optional, oneof, internals]
    question: |
      How does the proto3 compiler typically implement an `optional` scalar field under the
      hood?
    options:
      - "As a synthetic single-field oneof that carries the presence bit"
      - "By wrapping the scalar in a google.protobuf.Any envelope that records its type URL"
      - "By emitting a hidden companion boolean field at the next free tag to hold the has-bit"
      - "As a repeated field the runtime silently caps at exactly one element to fake presence"
    answer: 0
    explanation: |
      proto3 `optional` is implemented as a synthetic one-field oneof. The oneof machinery
      provides the presence bit, so generated code can offer has_x() and serialize the field
      even at its default value.
    ref: "concepts.md#proto3-field-presence-on-the-wire-gotcha"

  - id: service-and-message-definition-039
    difficulty: intermediate
    tags: [buf, bsr, dependencies]
    question: |
      How does the Buf Schema Registry (BSR) change how consumers depend on your protos?
    options:
      - "It compiles every proto into a single opaque binary blob that clients import directly"
      - "It replaces gRPC's HTTP/2 transport with a proprietary BSR-optimized wire protocol"
      - "Consumers must still copy the raw .proto files into their own repo by hand each release"
      - "Consumers depend on a versioned schema module instead of vendoring .proto files, and SDKs can be generated on demand"
    answer: 3
    explanation: |
      The BSR hosts schema modules so consumers depend on a versioned module rather than
      copying .proto files around, and it can generate SDKs on demand — solving the classic
      "who owns the shared protos" dependency problem.
    ref: "concepts.md#code-generation-protoc-plugins-and-buf"

  - id: service-and-message-definition-040
    difficulty: advanced
    tags: [scenario, client-streaming]
    question: |
      A client must upload a large log in many chunks and receive a single summary at the end.
      Which RPC signature fits best?
    options:
      - "rpc UploadLog(LogChunk) returns (UploadSummary);"
      - "rpc UploadLog(stream LogChunk) returns (UploadSummary);"
      - "rpc UploadLog(LogChunk) returns (stream UploadSummary);"
      - "rpc UploadLog(stream LogChunk) returns (stream UploadSummary);"
    answer: 1
    explanation: |
      Many requests, one response is client-streaming: `stream` on the request type only. The
      client streams LogChunk messages and the server returns one UploadSummary when the
      client half-closes.
    ref: "concepts.md#the-four-rpc-method-signatures"

  - id: service-and-message-definition-041
    difficulty: advanced
    tags: [scenario, server-streaming]
    question: |
      A dashboard subscribes once and then receives a continuous feed of updates. Which RPC
      type is the natural fit?
    options:
      - "Unary"
      - "Client-streaming"
      - "Server-streaming"
      - "Two separate unary calls"
    answer: 2
    explanation: |
      One subscribe request followed by an open-ended feed of responses is server-streaming:
      `returns (stream Update)`. The server pushes messages over the single stream until it
      completes or the client cancels.
    ref: "concepts.md#the-four-rpc-method-signatures"

  - id: service-and-message-definition-042
    difficulty: intermediate
    tags: [imports, well-known-types]
    question: |
      To use google.protobuf.Timestamp in your message, what must you add?
    options:
      - "Nothing; well-known types are always in scope"
      - "import \"google/protobuf/timestamp.proto\";"
      - "option use_timestamp = true; at the top of the file"
      - "A protobuf-timestamp entry listed in your package.json deps"
    answer: 1
    explanation: |
      Well-known types still require an explicit import of their .proto —
      `import "google/protobuf/timestamp.proto";` — before you can reference
      google.protobuf.Timestamp. They ship with the protobuf distribution.
    ref: "concepts.md#imports-and-import-public"

  - id: service-and-message-definition-043
    difficulty: advanced
    tags: [enum, evolution, unknown]
    question: |
      Adding a new value to an existing enum is generally safe on the wire. What is the main
      caveat a strong answer mentions?
    options:
      - "Clients must tolerate unknown enum values, or they may mishandle the new one"
      - "The enum's zero UNSPECIFIED sentinel must be removed before any new value is appended"
      - "Every new enum value forces a major package version bump (v1 to v2) to stay compatible"
      - "Enums are frozen after the first release and can never gain values without a new type"
    answer: 0
    explanation: |
      Appending an enum value is compatible only if peers tolerate unknown values (older code
      may not have the new constant). Proto libraries generally preserve unknown enum numbers,
      but application logic must handle the default/unrecognized case gracefully.
    ref: "concepts.md#api-evolution-discipline-and-buf"

  - id: service-and-message-definition-044
    difficulty: intermediate
    tags: [buf, lint, style]
    question: |
      Which of these is a typical rule enforced by `buf lint`?
    options:
      - "Every RPC must be declared as streaming rather than unary to pass the check"
      - "No message may exceed 10 fields, forcing large messages to be split into sub-messages"
      - "All string and bytes fields must be marked for encryption at rest in the schema"
      - "Package names must end in a version component and RPC request/response naming must follow conventions"
    answer: 3
    explanation: |
      buf lint enforces house style such as requiring a version suffix on packages, consistent
      request/response naming, and no leading underscores — nudging authors toward the
      versioned-package, one-message-per-RPC discipline.
    ref: "concepts.md#api-evolution-discipline-and-buf"

  - id: service-and-message-definition-045
    difficulty: advanced
    tags: [scenario, bidi]
    question: |
      A trading app needs the client and server to send messages to each other independently
      and continuously over one long-lived call. Which RPC type and why?
    options:
      - "Server-streaming, because only the server ever pushes data and the client just subscribes once"
      - "Bidirectional streaming, because both sides read and write independently over one stream"
      - "Client-streaming, because the client initiates the call and drives all the traffic"
      - "Repeated unary calls fired in a tight loop, to keep the protocol simple and stateless"
    answer: 1
    explanation: |
      Bidirectional streaming gives two independent read/write streams over a single call: the
      server can send before the client finishes and vice versa. That matches full-duplex
      interactive traffic like a trading feed with order submission.
    ref: "concepts.md#the-four-rpc-method-signatures"

  - id: service-and-message-definition-046
    difficulty: intermediate
    tags: [design, request-reuse]
    question: |
      Which practice violates the recommended API-design discipline for RPC messages?
    options:
      - "Adding an opaque page_token field to a list request for cursor pagination"
      - "Wrapping a single scalar id in a dedicated request message for future extensibility"
      - "Giving each RPC its own purpose-built request and response message type"
      - "Reusing the domain entity Order directly as the CreateOrder request"
    answer: 3
    explanation: |
      Reusing a domain entity (Order) as an RPC request couples the entity's shape to the
      request's evolution and usually drags along fields the request should not accept
      (server-assigned id, timestamps). Each RPC should have a purpose-built request message.
    ref: "concepts.md#message-design-best-practices"

  - id: service-and-message-definition-047
    difficulty: beginner
    tags: [service, methods]
    question: |
      What is a gRPC "service" in a .proto file?
    options:
      - "A named collection of RPC method declarations"
      - "A single message type that groups related fields"
      - "A block of load-balancer and routing configuration"
      - "A running server process that hosts the endpoint"
    answer: 0
    explanation: |
      A service is a named set of RPC method declarations. Codegen turns it into a client stub
      (one method per rpc) and a server base class you implement.
    ref: "concepts.md#defining-a-service"

  - id: service-and-message-definition-048
    difficulty: advanced
    tags: [presence, update, scenario]
    question: |
      A client sends UpdateUser with the plain scalar field `is_active` left at false (its
      default) and no field mask. What does the server most likely see?
    options:
      - "The field's previous stored value, automatically preserved by proto3's merge semantics"
      - "is_active explicitly present as false, because proto3 always serializes declared booleans"
      - "The field omitted from the wire, indistinguishable from 'not set' — so the server can't tell if the client wanted to deactivate the user"
      - "A decode error, because a bool at its zero value is rejected as an invalid wire entry"
    answer: 2
    explanation: |
      A proto3 plain scalar at its default (false) is not serialized, so the server cannot
      tell "set to false" from "unset." Without a FieldMask or `optional`, the intended
      deactivation is ambiguous — a classic silent bug.
    ref: "concepts.md#proto3-field-presence-on-the-wire-gotcha"

  - id: service-and-message-definition-049
    difficulty: intermediate
    tags: [codegen, descriptors]
    question: |
      What intermediate artifact does protoc build from parsed .proto files before invoking
      any plugin?
    options:
      - "A FileDescriptorSet (descriptors) resolving imports and types"
      - "A compiled shared library the plugins dynamically link against"
      - "An OpenAPI/Swagger document describing the service endpoints"
      - "A pre-warmed gRPC channel used to stream code back to protoc"
    answer: 0
    explanation: |
      protoc parses the sources, resolves imports, and builds a FileDescriptorSet — the
      structured description of all files/types. That descriptor set is what gets passed to
      each code-generator plugin in the CodeGeneratorRequest.
    ref: "concepts.md#code-generation-protoc-plugins-and-buf"

  - id: service-and-message-definition-050
    difficulty: advanced
    tags: [scenario, evolution, buf]
    question: |
      A developer's PR renames a field's tag number and CI is configured with buf. What is the
      expected outcome and correct resolution?
    options:
      - "buf lint quietly auto-renumbers the field back to its original tag and the build passes"
      - "The change only affects JSON clients while binary peers stay compatible, so it can merge"
      - "CI passes cleanly; changing a field's tag number is always a wire-safe, tolerated edit"
      - "buf breaking fails the build; the fix is to keep the old tag (or ship the change under a new versioned package)"
    answer: 3
    explanation: |
      Changing an existing field's tag number is breaking, so buf breaking rejects the PR. The
      resolution is to preserve the original tag number, or, if the redesign is genuinely
      needed, introduce it in a new versioned package rather than mutating v1.
    ref: "concepts.md#api-evolution-discipline-and-buf"

  - id: service-and-message-definition-051
    difficulty: intermediate
    tags: [options, definition]
    question: |
      Which statement about proto file `option` declarations is correct?
    options:
      - "Options are serialized into every message on the wire as an extra trailing metadata block"
      - "Options are compiler/codegen metadata that customize generated code without affecting the wire format"
      - "Options assign each field its tag number, so removing an option silently renumbers fields"
      - "Options are mandatory: a .proto file without at least one option declaration will not compile"
    answer: 1
    explanation: |
      Options (file-, message-, field-level) are metadata directing the compiler and code
      generators — package names, class layout, deprecation flags, etc. They do not change the
      bytes on the wire and most are not mandatory.
    ref: "concepts.md#file-options-for-generated-code"

  - id: service-and-message-definition-052
    difficulty: advanced
    tags: [scenario, design, versioning]
    question: |
      Your public gRPC API in package foo.v1 must add an optional filter parameter to an
      existing List RPC's request message. What is the least disruptive correct move?
    options:
      - "Replace the request message with google.protobuf.Struct so any field can be added freely"
      - "Cut a new foo.v2 package carrying the extra field and deprecate foo.v1 for all consumers"
      - "Add the new field with a fresh, unused tag number to the existing request message in foo.v1"
      - "Change the List RPC to client-streaming so the filter can be sent as a leading message"
    answer: 2
    explanation: |
      Adding a new field with a new tag number is a non-breaking change; old clients ignore it
      and new clients can use it. A new major version is only warranted for genuinely
      incompatible redesigns, not for adding an optional field.
    ref: "concepts.md#api-evolution-discipline-and-buf"

  - id: service-and-message-definition-053
    difficulty: beginner
    tags: [package, collision]
    question: |
      What is one purpose of declaring a `package` in a .proto file?
    options:
      - "It enables gzip compression of every message in files that declare a package"
      - "It selects whether the service is served over HTTP/1.1 or HTTP/2 on the wire"
      - "It sets the filesystem path to the TLS certificate the generated server loads"
      - "It prevents name collisions across files and forms part of the fully-qualified type/RPC names"
    answer: 3
    explanation: |
      The package namespaces types so acme.orders.v1.Order and acme.billing.v1.Order are
      distinct, and it becomes part of the wire path for RPCs. It has nothing to do with TLS,
      compression, or HTTP version.
    ref: "concepts.md#package-and-namespacing"

  - id: service-and-message-definition-054
    difficulty: advanced
    tags: [scenario, streaming-choice]
    question: |
      You have a simple "get one record by id" operation with no streaming need. Which RPC
      type and message design is correct?
    options:
      - "Server-streaming returning stream Record, to leave room for future multi-record flexibility"
      - "Unary: rpc GetRecord(GetRecordRequest) returns (GetRecordResponse) with a wrapper request even though it holds one id"
      - "Client-streaming so the client can retry individual chunks of the id if one is lost"
      - "Bidirectional streaming, to keep the connection warm between successive record lookups"
    answer: 1
    explanation: |
      A single request/response is unary. Even though the request holds just an id, wrap it in
      a GetRecordRequest message so it can gain fields later without a breaking change.
      Streaming here would add complexity for no benefit.
    ref: "concepts.md#requests-and-responses-must-be-message-types"

  - id: service-and-message-definition-055
    difficulty: intermediate
    tags: [buf, config, workflow]
    question: |
      In a buf workflow, what is the role of buf.gen.yaml?
    options:
      - "It records the module's full breaking-change history so buf breaking can diff each PR against every past release"
      - "It defines the gRPC server's listening port and the network interface the generated server process binds to at startup"
      - "It declaratively lists the codegen plugins and their output options, replacing a long protoc invocation"
      - "It stores the TLS certificates and private keys that the generated client and server load to secure the channel"
    answer: 2
    explanation: |
      buf.gen.yaml declares which plugins to run (local or remote) and their out/opt settings,
      so `buf generate` replaces a fragile multi-line protoc command. It is purely a codegen
      configuration file.
    ref: "concepts.md#code-generation-protoc-plugins-and-buf"

  - id: service-and-message-definition-056
    difficulty: advanced
    tags: [design, presence, tools]
    question: |
      When should you reach for `optional` versus a FieldMask to handle proto3 presence in an
      API?
    options:
      - "Use `optional` for explicit presence on an individual scalar; use a FieldMask when the client must name an arbitrary set of fields to touch (e.g. partial update)"
      - "Use a FieldMask for enum fields and the `optional` keyword for message-typed fields, matching each keyword to the type that lacks presence"
      - "Always use a FieldMask, because the proto3 `optional` keyword was deprecated in protoc 3.15 and removed from generated code"
      - "They are functionally interchangeable, so pick whichever reads better since both compile down to the same synthetic single-field oneof"
    answer: 0
    explanation: |
      `optional` gives per-field presence for a single scalar you need to detect. A FieldMask
      lets the client enumerate an arbitrary set of field paths to apply/return, which is the
      right tool for partial updates and read masks. They solve related but different problems.
    ref: "concepts.md#field-masks-for-partial-updates"
