topic: "Retries, Resiliency & Deadline Propagation"
domain: grpc
topic_slug: retries-resiliency-and-deadline-propagation
version: 1
questions:
  - id: retries-resiliency-and-deadline-propagation-001
    difficulty: beginner
    tags: [service-config, delivery, resolver]
    question: |
      In gRPC, where is the built-in retry policy for a method defined?
    options:
      - "In a JSON service config delivered to the client channel via the name resolver"
      - "As a custom option compiled directly into the .proto service definition at build time"
      - "In the HTTP/2 SETTINGS frame negotiated between client and server at connection start"
      - "As an environment variable read by the server process and then pushed down to clients"
    answer: 0
    explanation: |
      Retry/hedging/timeout/wait_for_ready policy lives in the JSON **service config**
      (methodConfig blocks), which the name resolver (DNS TXT, xDS, or a client-set
      default) delivers to the channel at runtime. It is not compiled into the .proto,
      so operators can change policy without rebuilding clients.
    ref: "concepts.md#service-config-how-resiliency-policy-is-delivered"

  - id: retries-resiliency-and-deadline-propagation-002
    difficulty: beginner
    tags: [grfc-a6, retries, definition]
    question: |
      Which gRFC defines gRPC's client-side retry (and hedging) design?
    options:
      - "gRFC A8"
      - "gRFC A2"
      - "gRFC A6"
      - "RFC 9113"
    answer: 2
    explanation: |
      gRFC A6 (gRPC Retry Design) specifies transparent client retries, hedging, the
      retry throttling token bucket, backoff, and commit rules. A2 covers service config
      in DNS, A8 covers client-side keepalive, and RFC 9113 is the HTTP/2 spec.
    ref: "concepts.md#client-retries-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-003
    difficulty: beginner
    tags: [retry-policy, max-attempts, semantics]
    question: |
      A retryPolicy has "maxAttempts": 4. How many total times might the RPC be sent?
    options:
      - "5 total (4 retries after the original)"
      - "3 total (maxAttempts excludes the original)"
      - "8 total (4 attempts, each doubled for backoff)"
      - "4 total (the original attempt plus up to 3 retries)"
    answer: 3
    explanation: |
      maxAttempts is the total number of attempts including the original. So 4 means the
      first try plus up to 3 retries. maxAttempts must be at least 2 and is capped by an
      implementation maximum (commonly 5).
    ref: "concepts.md#client-retries-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-004
    difficulty: intermediate
    tags: [backoff, jitter, mechanism]
    question: |
      With initialBackoff=0.1s, backoffMultiplier=2, maxBackoff=1s, how does gRPC (per
      gRFC A6) choose the wait before the second retry?
    options:
      - "Exactly 0.2s deterministically, with no randomization applied to any retry attempt"
      - "A full-jitter value chosen uniformly at random across the interval [0, 0.2s]"
      - "A base of 0.2s multiplied by a random jitter factor in [0.8, 1.2]"
      - "Exactly 0.2s plus a fixed 50ms jitter constant added on top for every retry"
    answer: 2
    explanation: |
      Per gRFC A6 the n-th retry waits min(initialBackoff * multiplier^(n-1), maxBackoff) *
      random(0.8, 1.2). The 2nd retry (n=2) has base min(0.1*2^1, 1s) = 0.2s, then a built-in
      +/-20% jitter factor, so ~[0.16s, 0.24s]. This is multiplicative jitter around the base,
      not a full-jitter pick uniformly in [0, base]; you do not add your own jitter.
    ref: "concepts.md#client-retries-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-005
    difficulty: beginner
    tags: [retryable-codes, unavailable]
    question: |
      Which status code is the canonical member of retryableStatusCodes for transient
      failures like connection-refused or a draining server?
    options:
      - "INVALID_ARGUMENT"
      - "PERMISSION_DENIED"
      - "UNAVAILABLE"
      - "NOT_FOUND"
    answer: 2
    explanation: |
      UNAVAILABLE (14) is the canonical retryable code: it signals transient conditions
      (connection refused, server draining, LB has no backend yet) that a retry may
      resolve. INVALID_ARGUMENT, PERMISSION_DENIED, and NOT_FOUND are deterministic and
      retrying re-sends the same doomed request.
    ref: "concepts.md#which-codes-and-methods-are-safe-to-retry"

  - id: retries-resiliency-and-deadline-propagation-006
    difficulty: intermediate
    tags: [retryable-codes, invalid-argument, safety]
    question: |
      Why should INVALID_ARGUMENT never be placed in retryableStatusCodes?
    options:
      - "It is a deterministic client error, so retrying re-sends the same bad request"
      - "It is a server-side-only code that clients never see"
      - "gRPC forbids retrying any 4xx-equivalent code at the protocol level"
      - "It always arrives after the RPC is committed, so retry is impossible anyway"
    answer: 0
    explanation: |
      INVALID_ARGUMENT (3) means the request itself is malformed/invalid independent of
      system state. Retrying sends the identical bad request, which will fail identically
      forever, wasting resources. Only transient failures should be retryable.
    ref: "concepts.md#which-codes-and-methods-are-safe-to-retry"

  - id: retries-resiliency-and-deadline-propagation-007
    difficulty: advanced
    tags: [idempotency, double-charge, scenario]
    question: |
      You add UNAVAILABLE retries to a non-idempotent Charge RPC and see occasional
      double charges. What is the root cause?
    options:
      - "gRPC retries even on OK/success responses by default whenever a policy is present"
      - "The first attempt reached and executed on the server, but its response was lost, so gRPC replayed the committed operation"
      - "UNAVAILABLE is not actually a retryable code, so the framework silently resent the call"
      - "The retry token bucket incremented on failure and that overflow triggered extra duplicate sends"
    answer: 1
    explanation: |
      The 'did my write happen?' ambiguity: the first attempt can reach and commit the
      charge on the server, but the connection drops before the response returns (surfacing
      as UNAVAILABLE), so gRPC replays it. Retries are only safe on idempotent methods; the
      fix is an idempotency key the server dedupes on, not blindly removing retries.
    ref: "concepts.md#which-codes-and-methods-are-safe-to-retry"

  - id: retries-resiliency-and-deadline-propagation-008
    difficulty: intermediate
    tags: [retry-throttling, token-bucket, mechanism]
    question: |
      In gRPC retry throttling, what happens to the token bucket on each RPC outcome?
    options:
      - "Success adds 1 token, failure subtracts tokenRatio"
      - "Every attempt (success or failure) subtracts 1 token"
      - "Only retries touch the bucket; original attempts never do"
      - "Failure subtracts 1 token, success adds tokenRatio"
    answer: 3
    explanation: |
      Per gRFC A6, each RPC failure decrements the bucket by 1 token and each success
      increments it by the fractional tokenRatio (e.g. 0.1). Sustained failures drain the
      bucket; successes slowly refill it. This is the mechanism that auto-disables retries
      during a storm.
    ref: "concepts.md#retry-throttling-preventing-retry-storms"

  - id: retries-resiliency-and-deadline-propagation-009
    difficulty: advanced
    tags: [retry-throttling, threshold, mechanism]
    question: |
      With retryThrottling maxTokens=100, at what bucket level does gRPC stop attempting
      retries?
    options:
      - "When tokens reach exactly 0, meaning the bucket has been fully drained by failures"
      - "When tokens drop below the fractional tokenRatio value configured for the policy"
      - "When tokens drop to or below maxTokens/2 (i.e. 50)"
      - "When tokens drop below 1, since a whole token is required to fund each retry attempt"
    answer: 2
    explanation: |
      A retry is only attempted while tokens > maxTokens/2. Once the bucket falls to the
      halfway mark (50 of 100), retries are suppressed until successes refill it above half.
      This keeps a persistently failing dependency from being hammered by retry traffic.
    ref: "concepts.md#retry-throttling-preventing-retry-storms"

  - id: retries-resiliency-and-deadline-propagation-010
    difficulty: intermediate
    tags: [retry-storm, resiliency, why]
    question: |
      What problem does retry throttling primarily prevent?
    options:
      - "A retry storm that amplifies load on an already-struggling server"
      - "Clients accidentally retrying non-idempotent methods that cause duplicate side effects"
      - "Deadlines being incorrectly reset to a fresh budget on each retry attempt"
      - "HPACK header compression bombs that exhaust the decoder's dynamic table memory"
    answer: 0
    explanation: |
      When many clients aggressively retry a failing server, retries multiply the load
      exactly when the server is weakest, turning a blip into an outage. The token bucket
      throttles retries when failures dominate, breaking that feedback loop.
    ref: "concepts.md#retry-throttling-preventing-retry-storms"

  - id: retries-resiliency-and-deadline-propagation-011
    difficulty: intermediate
    tags: [hedging, definition, tail-latency]
    question: |
      What does gRPC hedging do?
    options:
      - "Retries an RPC only after the previous attempt fails, waiting an exponential backoff each time"
      - "Splits a large message across multiple parallel HTTP/2 streams to increase throughput"
      - "Caches successful responses on the client keyed by request to avoid duplicate outbound calls"
      - "Sends parallel attempts of the same request on a timer and uses the first non-failing response"
    answer: 3
    explanation: |
      Hedging (gRFC A6) fires the same request to potentially different backends on a
      hedgingDelay schedule, in parallel, and takes the first non-failing response,
      cancelling the rest. It targets tail (p99) latency for idempotent reads, trading
      extra load for lower latency.
    ref: "concepts.md#hedging-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-012
    difficulty: advanced
    tags: [hedging, mechanism, hedging-delay]
    question: |
      With hedgingPolicy maxAttempts=3 and hedgingDelay="0.5s", when is the second attempt
      sent?
    options:
      - "Only after the first attempt returns an explicit failure status from the server"
      - "0.5s after the first attempt starts, if no response has arrived yet, in parallel with the first"
      - "Immediately alongside the first attempt, both firing at the same instant with zero delay"
      - "After the first attempt's exponential backoff timer elapses, computed from initialBackoff"
    answer: 1
    explanation: |
      The first attempt goes out immediately; if no response arrives within hedgingDelay
      (0.5s), a second attempt is sent in parallel (the first is not cancelled), and so on
      up to maxAttempts. Unlike retry, hedging does not wait for a failure — it reacts to
      slowness.
    ref: "concepts.md#hedging-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-013
    difficulty: intermediate
    tags: [hedging, retry, comparison]
    question: |
      What is the key behavioral difference between retryPolicy and hedgingPolicy?
    options:
      - "Retry attempts run in parallel on a timer; hedging attempts run sequentially after failures"
      - "Retry works only for streaming RPCs, while hedging is restricted to unary calls only"
      - "Retry attempts are sequential (only after a failure); hedging attempts run in parallel on a timer"
      - "Retry ignores the call deadline entirely; hedging is the only one that respects it"
    answer: 2
    explanation: |
      Retry is sequential and failure-driven: an attempt is retried only after the previous
      one fails, with exponential backoff. Hedging is parallel and latency-driven: new
      attempts fire on a fixed hedgingDelay regardless of whether prior ones failed. A
      methodConfig may use one or the other, not both.
    ref: "concepts.md#hedging-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-014
    difficulty: intermediate
    tags: [service-config, mutual-exclusion, gotcha]
    question: |
      Can a single methodConfig entry specify both retryPolicy and hedgingPolicy for the
      same method?
    options:
      - "No, they are mutually exclusive per method"
      - "Yes, they combine — hedge first, then retry"
      - "Yes, but only when the method is a unary (non-streaming) RPC"
      - "Yes, as long as the maxAttempts value matches in both policy blocks"
    answer: 0
    explanation: |
      A methodConfig may specify either retryPolicy or hedgingPolicy, never both for the
      same method. They are alternative resiliency strategies; the framework rejects a
      config that sets both.
    ref: "concepts.md#hedging-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-015
    difficulty: advanced
    tags: [deadline-propagation, retry-budget, mechanism]
    question: |
      An RPC has a 2s deadline and a retry policy. Attempt 1 burns 1.5s before failing with
      UNAVAILABLE. What does the channel do?
    options:
      - "Reset the deadline to a fresh 2s budget for the retry, since each attempt gets its own clock"
      - "Retry with no deadline at all, since the original 2s budget was fully consumed by attempt 1"
      - "Fail immediately with CANCELLED because attempt 1 used most of the budget"
      - "Run the retry against the remaining ~0.5s, and skip it if backoff+attempt cannot finish in the budget"
    answer: 3
    explanation: |
      All attempts and their backoff share the one absolute deadline; retries do not reset
      it. The retry runs against the ~0.5s remaining, and gRPC will not even start an attempt
      it knows cannot complete before the deadline, returning DEADLINE_EXCEEDED instead.
    ref: "concepts.md#deadline-propagation-across-the-retry-budget"

  - id: retries-resiliency-and-deadline-propagation-016
    difficulty: advanced
    tags: [deadline-propagation, downstream, grpc-timeout]
    question: |
      A server handler with ~1.6s of budget left makes a downstream gRPC call. What
      deadline does the downstream service see?
    options:
      - "A fresh default deadline chosen independently by the downstream service on arrival"
      - "No deadline at all, since propagation only applies to the original top-level caller"
      - "A deadline no later than the remaining ~1.6s, sent via the grpc-timeout header"
      - "Exactly the original 2s deadline the top-level client used, re-sent unchanged on every hop"
    answer: 2
    explanation: |
      gRPC propagates the remaining deadline downstream on each hop via the grpc-timeout
      header, so a downstream service sees a deadline no later than its caller's remaining
      budget. This prevents orphaned downstream work continuing after the original caller
      has given up.
    ref: "concepts.md#deadline-propagation-across-the-retry-budget"

  - id: retries-resiliency-and-deadline-propagation-017
    difficulty: advanced
    tags: [deadline, backoff, interaction]
    question: |
      Why can a tight deadline combined with an aggressive maxAttempts effectively run only
      1-2 attempts?
    options:
      - "Because gRPC automatically halves the configured maxAttempts whenever the deadline is under 1s"
      - "Because backoff waits consume the shared budget, so remaining time runs out before later attempts"
      - "Because each retry requires establishing a brand-new TCP connection, which is inherently slow"
      - "Because the server enforces a hard cap of 2 attempts per deadline window and rejects the rest"
    answer: 1
    explanation: |
      Since all attempts and their exponential backoff share one deadline, the accumulated
      backoff eats into the budget. A tight deadline may be exhausted after one or two
      attempts, so you must size initialBackoff/maxBackoff against the deadline, not in
      isolation.
    ref: "concepts.md#deadline-propagation-across-the-retry-budget"

  - id: retries-resiliency-and-deadline-propagation-018
    difficulty: intermediate
    tags: [wait-for-ready, default, mechanism]
    question: |
      By default (waitForReady=false), what happens when you make an RPC on a channel that
      has no READY connection?
    options:
      - "The RPC is queued until the channel becomes READY"
      - "The RPC fails with DEADLINE_EXCEEDED immediately"
      - "gRPC blocks the calling thread until keepalive detects a connection"
      - "The RPC fails fast with UNAVAILABLE"
    answer: 3
    explanation: |
      By default gRPC fails fast: if no subchannel is READY at call time (resolver pending,
      or all subchannels in TRANSIENT_FAILURE), the RPC fails immediately with UNAVAILABLE.
      Setting waitForReady=true instead queues the RPC until the channel is READY.
    ref: "concepts.md#wait_for_ready"

  - id: retries-resiliency-and-deadline-propagation-019
    difficulty: intermediate
    tags: [wait-for-ready, deadline, bound]
    question: |
      When waitForReady=true, what still bounds how long the queued RPC can wait?
    options:
      - "The RPC's deadline — it fails with DEADLINE_EXCEEDED if the channel never becomes READY in time"
      - "The keepalive_timeout window, which aborts the call once a single PING goes unanswered"
      - "A fixed 30-second internal cap that gRPC applies to every queued wait-for-ready call"
      - "The maxBackoff value from the retry policy, which bounds how long a queued attempt waits"
    answer: 0
    explanation: |
      waitForReady queues the RPC instead of failing fast, but the deadline still applies:
      if the channel never becomes READY before the deadline, the call fails with
      DEADLINE_EXCEEDED. So always pair waitForReady with a sensible deadline.
    ref: "concepts.md#wait_for_ready"

  - id: retries-resiliency-and-deadline-propagation-020
    difficulty: advanced
    tags: [wait-for-ready, judgment, scenario]
    question: |
      For a latency-critical payment-gateway call, why is waitForReady=false often preferred?
    options:
      - "It disables the channel's retry machinery entirely, which payment flows are required to avoid for audit reasons"
      - "It is the only channel setting that propagates the caller's remaining deadline downstream via grpc-timeout"
      - "It fails fast on a down dependency instead of piling up queued requests, letting orchestration decide, and blips surface as retryable UNAVAILABLE"
      - "It forces the remote server to trip its circuit breaker sooner by reporting each fast failure back upstream"
    answer: 2
    explanation: |
      Fail-fast semantics avoid masking a hard-down dependency by queueing requests; the
      caller/orchestration can react quickly, and transient blips become UNAVAILABLE that a
      retry policy (with an idempotency key) can handle. waitForReady risks hidden pile-ups
      against a truly-down backend.
    ref: "concepts.md#wait_for_ready"

  - id: retries-resiliency-and-deadline-propagation-021
    difficulty: intermediate
    tags: [keepalive, grfc-a8, mechanism]
    question: |
      How does gRPC keepalive detect a silently dead connection?
    options:
      - "It re-resolves the target's DNS every keepalive_time interval and drops the connection if the address set changed"
      - "It tears down and reopens the TCP socket on a fixed schedule so a dead peer surfaces as a failed reconnect"
      - "It sends an empty zero-length gRPC data message on an idle stream and closes the channel if no reply comes back"
      - "It sends HTTP/2 PING frames and expects a PING ACK within keepalive_timeout, else closes the connection"
    answer: 3
    explanation: |
      Per gRFC A8, after keepalive_time of inactivity the client sends an HTTP/2 PING frame;
      if no PING ACK arrives within keepalive_timeout, the transport is declared broken and
      closed (subchannel goes TRANSIENT_FAILURE, in-flight RPCs fail). This catches
      half-open connections that TCP alone won't notice.
    ref: "concepts.md#keepalive-grfc-a8"

  - id: retries-resiliency-and-deadline-propagation-022
    difficulty: advanced
    tags: [keepalive, goaway, too-many-pings, gotcha]
    question: |
      A client's connection is killed by a GOAWAY with debug data "too_many_pings". What is
      the most likely cause?
    options:
      - "The client's keepalive pings are more frequent than the server's minimum allowed ping interval"
      - "The client set no deadline on its RPCs, so the server force-closed the idle stream"
      - "The retry token bucket was fully exhausted, causing the transport to reset the connection"
      - "The client used waitForReady=true, which the server treats as an abusive ping pattern"
    answer: 0
    explanation: |
      Servers enforce a minimum receive-ping interval and a MAX_PING_STRIKES limit. A client
      that pings too aggressively (short keepalive_time, permit_without_calls) accrues strikes
      and gets a GOAWAY with ENHANCE_YOUR_CALM / "too_many_pings". Raise keepalive_time or the
      server's min-recv-ping-interval to fix it.
    ref: "concepts.md#keepalive-grfc-a8"

  - id: retries-resiliency-and-deadline-propagation-023
    difficulty: intermediate
    tags: [keepalive, permit-without-calls]
    question: |
      What does keepalive_permit_without_calls=true do?
    options:
      - "Permits new RPCs to start before the channel reaches the READY state by queuing them"
      - "Allows keepalive PINGs even when there are no active RPCs on the connection"
      - "Disables the server's ping-strike enforcement so the client can ping at any rate"
      - "Lets the client skip TLS encryption for keepalive PING frames to save handshake cost"
    answer: 1
    explanation: |
      By default keepalive PINGs are only sent while RPCs are active. permit_without_calls=true
      sends PINGs even on idle connections to keep them alive/verified — but this is exactly
      the setting most likely to trip a server's ping-strike limit if keepalive_time is short.
    ref: "concepts.md#keepalive-grfc-a8"

  - id: retries-resiliency-and-deadline-propagation-024
    difficulty: advanced
    tags: [circuit-breaker, mesh, judgment]
    question: |
      Where does full-featured circuit breaking typically live for gRPC services?
    options:
      - "In the gRPC core library, enabled via a circuitBreakerPolicy block inside the JSON service config"
      - "In the .proto service definition via a circuit_breaker option compiled into the generated stub"
      - "At the mesh/proxy layer (Envoy/Istio outlier detection) or app-level, since core gRPC has no first-class circuit breaker"
      - "In the HTTP/2 transport layer, by throttling streams through automatic RST_STREAM frames on errors"
    answer: 2
    explanation: |
      gRPC core does not ship a first-class circuit breaker; its closest built-ins are
      subchannel TRANSIENT_FAILURE backoff and retry throttling. Real circuit breaking comes
      from the mesh (Envoy/Istio outlier detection, xDS pushed to proxyless clients) or an
      app-level interceptor/library. There is no circuitBreakerPolicy service-config key.
    ref: "concepts.md#circuit-breaking-where-it-lives-for-grpc"

  - id: retries-resiliency-and-deadline-propagation-025
    difficulty: intermediate
    tags: [commit, buffering, mechanism]
    question: |
      Why do gRPC retries fundamentally require buffering the outbound request?
    options:
      - "To compress the outbound request payload with HPACK header encoding before it is sent"
      - "Because HTTP/2 forbids reusing stream IDs, so the buffer holds the ID for the next stream"
      - "To compute the exponential backoff schedule from the buffered message sizes on each attempt"
      - "So the client can replay the request messages on a fresh HTTP/2 stream for a retry"
    answer: 3
    explanation: |
      A retry re-sends the RPC on a brand-new HTTP/2 stream, so the client must have buffered
      the outbound messages to replay them. If the buffered data exceeds the retry buffer
      limit, the RPC becomes committed (non-retryable). This is why very large requests may be
      uncommittable to buffer and thus not retried.
    ref: "concepts.md#client-retries-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-026
    difficulty: advanced
    tags: [commit, retry, mechanism]
    question: |
      When does an RPC become "committed" so that gRPC can no longer retry it?
    options:
      - "Once the client receives any message from the server, or the outbound buffer exceeds the retry buffer size"
      - "As soon as the first retry's exponential backoff timer starts counting down"
      - "Only once maxAttempts is reached and every configured attempt has been consumed"
      - "The moment an absolute deadline is attached to the call at invocation time"
    answer: 0
    explanation: |
      An RPC is committed to a single attempt once the client has received a message/response
      from the server (a response headers/message that isn't a trailers-only failure), or when
      the buffered outbound data exceeds the retry buffer limit. After commit, even a later
      retryable code will not trigger a retry.
    ref: "concepts.md#client-retries-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-027
    difficulty: advanced
    tags: [trailers-only, retry, wire]
    question: |
      Which server response shape is the typical retryable failure that gRPC replays?
    options:
      - "A response with several streamed data frames followed by a grpc-status=UNAVAILABLE trailer"
      - "A GOAWAY frame carrying the no_error code, which gRPC always replays on a new connection"
      - "A trailers-only response carrying grpc-status=UNAVAILABLE with no data messages"
      - "An HTTP/2 WINDOW_UPDATE frame with an increment of size 0, signaling a stalled retryable stream"
    answer: 2
    explanation: |
      A trailers-only response carries the status in the initial HEADERS frame with no data
      messages — e.g. the server returns UNAVAILABLE before sending anything. Because no
      message was received, the RPC is not committed and can be retried. If the server had
      already streamed a message, the RPC would be committed.
    ref: "concepts.md#client-retries-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-028
    difficulty: advanced
    tags: [server-pushback, retry, metadata]
    question: |
      A server returns grpc-retry-pushback-ms with a negative value. What does the client do?
    options:
      - "Retry immediately with zero delay, ignoring the configured backoff schedule entirely"
      - "Stop retrying and treat the failure as non-retryable"
      - "Wait that many milliseconds (using the absolute value) and then issue the next retry"
      - "Double its maxBackoff ceiling for the remainder of this RPC's retry sequence"
    answer: 1
    explanation: |
      grpc-retry-pushback-ms lets the server override client backoff. A non-negative value
      tells the client to wait exactly that many ms before the next retry; a negative value
      tells the client to stop retrying immediately (treat as non-retryable). This is a
      load-shedding signal from an overloaded server.
    ref: "concepts.md#client-retries-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-029
    difficulty: intermediate
    tags: [service-config, dns, delivery]
    question: |
      In a DNS-based deployment, how does the service config reach the gRPC client?
    options:
      - "Via an A record on the service hostname whose address bytes encode the JSON policy"
      - "Via a custom HTTP response header attached by the server to the first RPC reply"
      - "Via an HTTP/2 SETTINGS frame the server sends at connection start to configure the client"
      - "Via a TXT record (grpc_config= payload) that the DNS resolver reads"
    answer: 3
    explanation: |
      The DNS resolver reads a TXT record (conventionally _grpc_config.<host>) whose payload
      contains grpc_config= with the JSON service config. This is one delivery path defined by
      gRFC A2; xDS and a client-set defaultServiceConfig are the others.
    ref: "concepts.md#service-config-how-resiliency-policy-is-delivered"

  - id: retries-resiliency-and-deadline-propagation-030
    difficulty: intermediate
    tags: [service-config, xds, mesh]
    question: |
      At scale in a service mesh, which mechanism most commonly delivers dynamic service
      config (including retry policy) to gRPC clients?
    options:
      - "xDS from a control plane (e.g. Envoy/Istio/Traffic Director)"
      - "Manual JSON config files copied onto each host by a deployment script"
      - "gRPC server reflection, which streams the active policy to every client"
      - "The grpc-timeout request header, carrying the policy alongside the deadline"
    answer: 0
    explanation: |
      xDS lets a control plane push dynamic policy (routing, retries, load balancing, outlier
      detection) to clients or sidecars without redeploying. This is the standard mesh path;
      full mesh/xDS architecture is covered in system-design.
    ref: "concepts.md#service-config-how-resiliency-policy-is-delivered"

  - id: retries-resiliency-and-deadline-propagation-031
    difficulty: intermediate
    tags: [default-service-config, fallback]
    question: |
      What is the role of a client-set defaultServiceConfig on a channel?
    options:
      - "It overrides whatever service config the name resolver returns for the channel"
      - "It permanently disables all resolver-provided policy once the channel is created"
      - "It is used only when the resolver returns no service config"
      - "It is sent to the server at handshake as the client's negotiated resiliency policy"
    answer: 2
    explanation: |
      A defaultServiceConfig (e.g. grpc.service_config arg / defaultServiceConfig) is the
      fallback the channel uses if the name resolver does not supply one. If the resolver
      provides a service config, that takes precedence. It is handy for client-owned defaults
      and local testing.
    ref: "concepts.md#service-config-how-resiliency-policy-is-delivered"

  - id: retries-resiliency-and-deadline-propagation-032
    difficulty: intermediate
    tags: [hedging, non-fatal-codes, mechanism]
    question: |
      In a hedgingPolicy, what does the nonFatalStatusCodes list control?
    options:
      - "Codes that immediately succeed the RPC and cancel every other in-flight hedge attempt"
      - "Codes the server is contractually forbidden to return once a hedgingPolicy is active"
      - "Codes that reset the hedgingDelay timer to zero so the next attempt fires instantly"
      - "Codes for which a failed hedge attempt is ignored so hedging continues to other attempts"
    answer: 3
    explanation: |
      If a hedge attempt fails with a nonFatalStatusCode, it is ignored and hedging continues
      with the remaining/next attempts. A failure with a code NOT in that list is fatal: it
      commits the RPC to that failure and cancels the other in-flight attempts.
    ref: "concepts.md#hedging-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-033
    difficulty: advanced
    tags: [hedging, idempotency, safety]
    question: |
      Why is hedging even more dangerous than sequential retry for non-idempotent methods?
    options:
      - "Hedging ignores the call's deadline entirely, so a write can run long after the caller quits"
      - "Multiple hedge attempts can be executing concurrently on different servers"
      - "Hedging disables the retry throttling token bucket, removing the storm protection retries have"
      - "Hedging never cancels the losing attempts, so every fired copy always runs to full completion"
    answer: 1
    explanation: |
      With hedging, several attempts run in parallel, so multiple copies of the operation can
      be executing at the same time on different backends before any is cancelled. For a
      non-idempotent write this multiplies the side effects. Only hedge idempotent reads.
    ref: "concepts.md#hedging-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-034
    difficulty: advanced
    tags: [retry-throttling, hedging, interaction]
    question: |
      Are hedged attempts subject to the retryThrottling token bucket?
    options:
      - "Yes, hedging and retry both draw from the same throttling bucket"
      - "No, only sequential retries count against it; hedges bypass the bucket entirely"
      - "No, hedging maintains its own separate dedicated bucket with an independent tokenRatio"
      - "Only the very first hedge attempt counts against the bucket; later parallel ones are free"
    answer: 0
    explanation: |
      The retryThrottling token bucket applies to both retry and hedging attempts on the
      channel. Both strategies count failures/successes against the same bucket, so a struggling
      dependency throttles hedged attempts too.
    ref: "concepts.md#retry-throttling-preventing-retry-storms"

  - id: retries-resiliency-and-deadline-propagation-035
    difficulty: beginner
    tags: [service-config, retry-throttling, scope]
    question: |
      The retryThrottling token bucket is scoped to what?
    options:
      - "The entire client fleet globally, shared through the control plane"
      - "Each individual RPC, with a fresh bucket allocated per call attempt"
      - "A single channel (per client channel)"
      - "Each HTTP/2 stream opened on the underlying transport connection"
    answer: 2
    explanation: |
      Throttling is per channel, not global. Each client's channel maintains its own bucket, so
      many clients can still collectively overload a server; cross-fleet protection needs
      server-side load shedding or mesh-level circuit breaking.
    ref: "concepts.md#retry-throttling-preventing-retry-storms"

  - id: retries-resiliency-and-deadline-propagation-036
    difficulty: intermediate
    tags: [transparent-retries, api, mechanism]
    question: |
      From the application's perspective, what does it observe when a configured retry
      eventually succeeds on attempt 3?
    options:
      - "Three separate return values delivered in sequence, one for each underlying attempt"
      - "An UNAVAILABLE error surfaced for attempts 1 and 2, then the success value on attempt 3"
      - "A per-attempt callback fired on the stub so the app can observe each individual retry"
      - "Only the final successful result — retries are transparent above the stub"
    answer: 3
    explanation: |
      Built-in retries are transparent: the channel handles the re-sends internally and the
      application sees only the final outcome (success, or the last error if all attempts fail).
      The stub call returns once, with the committed result.
    ref: "concepts.md#client-retries-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-037
    difficulty: intermediate
    tags: [retryable-codes, resource-exhausted, judgment]
    question: |
      Why is RESOURCE_EXHAUSTED a borderline choice for retryableStatusCodes?
    options:
      - "Retrying it without backoff can worsen the very overload it signals"
      - "It is not a real gRPC status code, so config validation rejects it outright"
      - "It is only ever returned after the RPC has committed, when a retry is impossible"
      - "gRPC forbids retrying it at the HTTP/2 protocol level regardless of the policy"
    answer: 0
    explanation: |
      RESOURCE_EXHAUSTED often means transient quota/backpressure, so a backed-off retry can
      help — but naive retries pile more load onto an already-overloaded server, making things
      worse. Include it only with proper backoff and throttling, and consider server pushback.
    ref: "concepts.md#which-codes-and-methods-are-safe-to-retry"

  - id: retries-resiliency-and-deadline-propagation-038
    difficulty: beginner
    tags: [keepalive, vs-deadline, distinction]
    question: |
      Keepalive and per-RPC deadlines address different concerns. Which statement is correct?
    options:
      - "Keepalive bounds how long an RPC may run; a deadline checks connection liveness"
      - "Keepalive checks connection liveness; a deadline bounds the time budget of an RPC"
      - "They are the same feature under two names, one client-side and one server-side alias"
      - "Both apply only to streaming RPCs and are ignored entirely for unary calls"
    answer: 1
    explanation: |
      Keepalive is about detecting a dead/half-open connection via PING/ACK; a deadline is the
      per-RPC absolute time budget. They are distinct (as is a connection/idle timeout). The
      sibling deadlines topic contrasts all three.
    ref: "concepts.md#keepalive-grfc-a8"

  - id: retries-resiliency-and-deadline-propagation-039
    difficulty: advanced
    tags: [wait-for-ready, retries, composition]
    question: |
      How do waitForReady=false and a retry policy compose during a brief connection blip?
    options:
      - "They conflict; the channel rejects a config that sets both at once"
      - "waitForReady=false automatically disables the retry machinery on the channel"
      - "Fail-fast surfaces the blip as UNAVAILABLE, which the retry policy then catches and re-attempts on a fresh connection"
      - "The retry policy is ignored and buffered until the channel transitions to READY"
    answer: 2
    explanation: |
      With fail-fast (waitForReady=false), a transient blip produces UNAVAILABLE; if UNAVAILABLE
      is in retryableStatusCodes, the retry policy re-attempts on a new connection. With
      waitForReady=true the call would instead simply wait, which can hide a hard-down backend
      until the deadline.
    ref: "concepts.md#wait_for_ready"

  - id: retries-resiliency-and-deadline-propagation-040
    difficulty: intermediate
    tags: [circuit-breaker, envoy, outlier-detection]
    question: |
      In an Envoy/Istio mesh, which feature ejects individual unhealthy gRPC endpoints from
      the load-balancing pool?
    options:
      - "HPACK dynamic table eviction"
      - "The grpc-timeout header"
      - "wait_for_ready"
      - "Outlier detection"
    answer: 3
    explanation: |
      Outlier detection ejects endpoints that exceed error thresholds (e.g. consecutive 5xx /
      gRPC failures) from the pool for a period, a form of circuit breaking at the mesh layer.
      Envoy circuit breakers also cap concurrent connections/requests. Mesh architecture detail
      lives in system-design.
    ref: "concepts.md#circuit-breaking-where-it-lives-for-grpc"

  - id: retries-resiliency-and-deadline-propagation-041
    difficulty: advanced
    tags: [defaults, enable-retries, gotcha]
    question: |
      A team ships a valid retryPolicy in service config but observes no retries happening.
      Which is a plausible gRPC-specific cause?
    options:
      - "Retries are disabled at the channel level (the enable-retries setting is off)"
      - "The .proto is missing the required retry option on the method definition"
      - "The server never enabled its matching server-side retry acknowledgement flag"
      - "HTTP/1.1 was negotiated instead of HTTP/2, so per-method retry is unsupported"
    answer: 0
    explanation: |
      Built-in retry must be enabled on the channel. It is on by default in modern releases,
      but historically was gated behind an enable-retries channel arg; if disabled, the policy
      is ignored entirely. Retries are a client-channel feature, not something the server or
      the .proto enables.
    ref: "concepts.md#service-config-how-resiliency-policy-is-delivered"

  - id: retries-resiliency-and-deadline-propagation-042
    difficulty: intermediate
    tags: [retry-policy, validation, config]
    question: |
      Which retryPolicy configuration is invalid?
    options:
      - "maxAttempts=2 with retryableStatusCodes=[UNAVAILABLE]"
      - "initialBackoff=0.1s, maxBackoff=1s, backoffMultiplier=2"
      - "retryableStatusCodes=[] (empty)"
      - "retryableStatusCodes=[UNAVAILABLE, ABORTED]"
    answer: 2
    explanation: |
      retryableStatusCodes must be non-empty — an empty set means nothing is retryable, which
      the config validation rejects. maxAttempts must be at least 2, and the backoff fields must
      be positive; the other options are all valid.
    ref: "concepts.md#client-retries-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-043
    difficulty: advanced
    tags: [scenario, hedging, judgment]
    question: |
      A read-heavy, idempotent GetItem RPC has acceptable median latency but a bad p99 caused
      by occasional slow replicas. Which strategy best targets this?
    options:
      - "Increase the call deadline so the occasional slow replica has more time to answer"
      - "Set waitForReady=true so the channel queues calls until a fast replica is READY"
      - "Add only UNAVAILABLE to retryableStatusCodes so slow attempts get re-sent quickly"
      - "Add a hedgingPolicy so a parallel attempt fires after a short hedgingDelay and the fastest replica wins"
    answer: 3
    explanation: |
      Hedging directly attacks tail latency: after hedgingDelay with no response, a parallel
      attempt goes to another backend and the first to answer wins. Since GetItem is idempotent
      and read-heavy, hedging is safe and effective. Sequential retry only helps on outright
      failures, not slow-but-successful calls.
    ref: "concepts.md#hedging-grfc-a6"

  - id: retries-resiliency-and-deadline-propagation-044
    difficulty: advanced
    tags: [scenario, write, idempotency, judgment]
    question: |
      For a non-idempotent AppendLog write RPC with no idempotency key support, what is the
      safest retry configuration?
    options:
      - "A retryPolicy with maxAttempts=5 retrying on UNAVAILABLE and default backoff"
      - "A hedgingPolicy with hedgingDelay=0s so backups fire immediately in parallel"
      - "No retryPolicy/hedgingPolicy for the method (rely on the caller to decide)"
      - "Retry on the full set of status codes to maximize the write's success rate"
    answer: 2
    explanation: |
      Without server-side idempotency support, transparent retries risk duplicate appends
      (the first attempt may have committed before the connection dropped). The safe default is
      no automatic retry/hedge; add an idempotency key so the server can dedupe if you want
      retries. Hedging with 0s delay is the worst choice — parallel duplicate writes.
    ref: "concepts.md#which-codes-and-methods-are-safe-to-retry"

  - id: retries-resiliency-and-deadline-propagation-045
    difficulty: intermediate
    tags: [retry-throttling, steady-state, mechanism]
    question: |
      With retryThrottling tokenRatio=0.1, roughly how many successful RPCs "pay for" one
      retry at steady state?
    options:
      - "1 success per retry"
      - "About 10 successes per retry"
      - "100 successes per retry"
      - "It is unrelated to tokenRatio"
    answer: 1
    explanation: |
      A failure costs 1 token and a success returns tokenRatio tokens. With tokenRatio=0.1, it
      takes about 10 successes to replenish the 1 token a retry (via its failed attempt) consumes,
      setting the steady-state ratio of retries the bucket will sustain.
    ref: "concepts.md#retry-throttling-preventing-retry-storms"

  - id: retries-resiliency-and-deadline-propagation-046
    difficulty: beginner
    tags: [wait-for-ready, setting, api]
    question: |
      Where can waitForReady be configured?
    options:
      - "Only globally at server startup, applied uniformly to every inbound RPC"
      - "Only via a DNS TXT record that the name resolver pushes to the channel"
      - "In the .proto message definition as a field-level option on the request"
      - "As a per-call option in code, or as waitForReady in a methodConfig"
    answer: 3
    explanation: |
      waitForReady can be set per call in code (e.g. grpc.WaitForReady(true) in Go,
      CallOptions.withWaitForReady() in Java) or declaratively as "waitForReady": true in a
      methodConfig in service config. It is a client-side channel/call behavior.
    ref: "concepts.md#wait_for_ready"

  - id: retries-resiliency-and-deadline-propagation-047
    difficulty: advanced
    tags: [cross-fleet, throttling, limitation]
    question: |
      Why can per-channel retry throttling still fail to protect a server from overload?
    options:
      - "Because each of many clients has its own bucket, so collectively they can still overwhelm the server"
      - "Because it only throttles hedged attempts and leaves sequential retries uncounted"
      - "Because the token bucket is reset back to full on every single RPC invocation"
      - "Because throttling is silently disabled whenever the call carries a deadline"
    answer: 0
    explanation: |
      The token bucket is per channel/client. A single client is protected from storming, but a
      large fleet of independently-throttled clients can still generate overwhelming aggregate
      load. Cross-fleet protection requires server-side load shedding, pushback, or mesh-level
      circuit breaking.
    ref: "concepts.md#retry-throttling-preventing-retry-storms"

  - id: retries-resiliency-and-deadline-propagation-048
    difficulty: intermediate
    tags: [subchannel, transient-failure, backoff]
    question: |
      When a subchannel fails to connect, what built-in gRPC behavior most resembles a simple
      circuit breaker?
    options:
      - "The channel returns INVALID_ARGUMENT for the endpoint until an operator manually resets it"
      - "The subchannel enters TRANSIENT_FAILURE and applies connection backoff before retrying the connection"
      - "gRPC opens a brand-new TCP connection immediately on every failure with no backoff delay"
      - "The retry token bucket is refilled to full so retries continue against the failing endpoint"
    answer: 1
    explanation: |
      A failing subchannel moves to TRANSIENT_FAILURE and uses connection backoff (exponential)
      before attempting to reconnect, avoiding hammering a down endpoint. Combined with retry
      throttling, this is the closest gRPC-core behavior to circuit breaking, but it is not a
      full circuit breaker — that comes from the mesh or app layer.
    ref: "concepts.md#circuit-breaking-where-it-lives-for-grpc"
