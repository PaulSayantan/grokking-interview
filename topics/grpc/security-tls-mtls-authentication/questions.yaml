topic: "Security: TLS, mTLS & Authentication"
domain: grpc
topic_slug: security-tls-mtls-authentication
version: 1
questions:
  - id: security-tls-mtls-authentication-001
    difficulty: beginner
    tags: [credentials, channel, call, model]
    question: |
      In gRPC's security model, what do CHANNEL credentials secure versus what do
      CALL credentials secure?
    options:
      - "Channel creds secure the transport (encryption + server identity); call creds authenticate the caller per-RPC"
      - "Both secure the transport; they are interchangeable"
      - "Channel creds authenticate the caller per-RPC; call creds encrypt the whole connection"
      - "Channel creds validate the protobuf schema; call creds validate the message body"
    answer: 0
    explanation: |
      Channel credentials operate at the transport layer (TLS/mTLS/ALTS or insecure):
      they encrypt the connection and authenticate the server. Call credentials operate
      per-RPC and authenticate the caller, typically via a token in metadata. The two
      axes are composed, not chosen between.
    ref: "concepts.md#channel-credentials-vs-call-credentials"

  - id: security-tls-mtls-authentication-002
    difficulty: beginner
    tags: [tls, default, production]
    question: |
      For a production gRPC service exposed over the network, what is the expected
      default transport security?
    options:
      - "TLS (server authentication + encryption)"
      - "An insecure plaintext channel with an application-level checksum"
      - "No transport security, relying only on a firewall"
      - "IPsec configured at the OS level instead of in gRPC"
    answer: 0
    explanation: |
      TLS is the default and expected transport security for production gRPC. It gives
      server authentication (the client validates the server cert) plus encryption and
      integrity of all bytes. Insecure channels are for dev/test/loopback only.
    ref: "concepts.md#transport-layer-security-tls"

  - id: security-tls-mtls-authentication-003
    difficulty: beginner
    tags: [call-credentials, metadata, header]
    question: |
      How does a per-RPC bearer token conventionally travel with a gRPC call?
    options:
      - "As an `authorization: Bearer <token>` entry in the request metadata"
      - "In a URL query-string parameter"
      - "As a field inside the protobuf request message"
      - "In the TLS certificate's Subject Alternative Name"
    answer: 0
    explanation: |
      Call credentials produce metadata attached to each RPC, conventionally the
      `authorization` header carrying `Bearer <token>`. Metadata travels as HTTP/2
      HEADERS. The token is cross-cutting context, not domain data, so it does not go in
      the protobuf message.
    ref: "concepts.md#token-based-authentication-oauth2--jwt"

  - id: security-tls-mtls-authentication-004
    difficulty: intermediate
    tags: [mtls, mutual-auth, certificates]
    question: |
      What distinguishes mTLS from ordinary (server-auth) TLS in gRPC?
    options:
      - "mTLS uses a faster cipher suite but authenticates only the server"
      - "mTLS skips encryption to reduce latency"
      - "mTLS authenticates only the client, not the server"
      - "In mTLS both peers present and verify certificates, so the server authenticates the client too"
    answer: 3
    explanation: |
      Plain TLS authenticates only the server to the client. mTLS adds client
      authentication: the server requests and validates the client's certificate during
      the handshake, giving cryptographically strong identity for both peers. This is
      the basis of zero-trust and service-mesh east-west security.
    ref: "concepts.md#mutual-tls-mtls"

  - id: security-tls-mtls-authentication-005
    difficulty: intermediate
    tags: [call-credentials, insecure, safety]
    question: |
      By default, what happens when you attach call credentials (a bearer token) to an
      INSECURE (plaintext) gRPC channel?
    options:
      - "The credentials refuse to attach because they require transport security"
      - "The channel is automatically upgraded to TLS"
      - "The token is sent in cleartext with a warning logged"
      - "The token is base64-encoded, which is treated as sufficient protection"
    answer: 0
    explanation: |
      Call credentials refuse to attach over an insecure channel by default (Go's
      RequireTransportSecurity returns true; Java requires privacy). A bearer token in
      cleartext could be stolen and replayed, so gRPC requires a secure transport unless
      you explicitly opt out.
    ref: "concepts.md#channel-credentials-vs-call-credentials"

  - id: security-tls-mtls-authentication-006
    difficulty: intermediate
    tags: [status-codes, unauthenticated, error-model]
    question: |
      A client calls a gRPC method with a missing or expired token. Which status code
      should the server return?
    options:
      - "PERMISSION_DENIED (7)"
      - "INVALID_ARGUMENT (3)"
      - "UNAUTHENTICATED (16)"
      - "FAILED_PRECONDITION (9)"
    answer: 2
    explanation: |
      UNAUTHENTICATED (16) means the request lacks valid authentication credentials —
      missing, expired, or invalid token. It maps to HTTP 401. PERMISSION_DENIED is for
      an authenticated caller who lacks rights, not for missing credentials.
    ref: "concepts.md#where-auth-is-enforced-interceptors--authcontext"

  - id: security-tls-mtls-authentication-007
    difficulty: intermediate
    tags: [status-codes, permission-denied, error-model]
    question: |
      A caller is successfully authenticated but attempts an admin-only operation it has
      no rights to. Which status code is correct?
    options:
      - "UNAUTHENTICATED (16)"
      - "UNAVAILABLE (14)"
      - "RESOURCE_EXHAUSTED (8)"
      - "PERMISSION_DENIED (7)"
    answer: 3
    explanation: |
      PERMISSION_DENIED (7) means the caller is authenticated but not authorized for the
      operation (HTTP 403). It must NOT be used for missing credentials — that is
      UNAUTHENTICATED. Distinguishing the two is a common interview trap.
    ref: "concepts.md#where-auth-is-enforced-interceptors--authcontext"

  - id: security-tls-mtls-authentication-008
    difficulty: intermediate
    tags: [composite-credentials, tls, token]
    question: |
      What are COMPOSITE credentials in gRPC?
    options:
      - "A single object combining channel credentials (transport security) with call credentials (per-RPC token)"
      - "A certificate that embeds both a public and private key for sharing"
      - "Two separate channels merged into one connection pool"
      - "A fallback chain that tries TLS, then plaintext, then ALTS"
    answer: 0
    explanation: |
      Composite credentials combine channel creds (e.g., TLS/mTLS) with call creds
      (e.g., a bearer token) so the channel is transport-secured and attaches a per-RPC
      token. This is the standard production shape.
    ref: "concepts.md#composite-credentials"

  - id: security-tls-mtls-authentication-009
    difficulty: intermediate
    tags: [interceptors, enforcement, authz]
    question: |
      Where is per-RPC caller authorization typically ENFORCED in a gRPC server?
    options:
      - "In the TLS handshake, which validates the token"
      - "In a server interceptor that validates the metadata token before the handler runs"
      - "Inside each protobuf message via a required field"
      - "In the client stub, which self-certifies its permissions"
    answer: 1
    explanation: |
      Transport creds give a secure pipe but do not authorize anyone. A server
      interceptor (middleware) runs before the handler, reads and validates the
      authorization token (and/or peer identity), and rejects or injects the resolved
      principal into the context.
    ref: "concepts.md#where-auth-is-enforced-interceptors--authcontext"

  - id: security-tls-mtls-authentication-010
    difficulty: intermediate
    tags: [authcontext, mtls, peer-identity]
    question: |
      Under mTLS, how does a server obtain a TRUSTWORTHY caller identity?
    options:
      - "By reading a client-id field the caller places in the request message"
      - "By trusting the `x-user-id` metadata header the client sets"
      - "From the source IP address of the TCP connection"
      - "From the verified peer certificate exposed via the AuthContext"
    answer: 3
    explanation: |
      Under mTLS the client's certificate is cryptographically validated during the
      handshake. The server reads the resulting peer identity (subject, SANs, SPIFFE ID)
      from the AuthContext. This is trustworthy in a way self-asserted metadata or a
      source IP is not.
    ref: "concepts.md#where-auth-is-enforced-interceptors--authcontext"

  - id: security-tls-mtls-authentication-011
    difficulty: beginner
    tags: [insecure, plaintext, dev]
    question: |
      What does an "insecure" gRPC channel provide?
    options:
      - "No transport security at all — plaintext HTTP/2 (h2c), no encryption or server auth"
      - "Encryption but no integrity checking"
      - "TLS encryption without server authentication"
      - "mTLS with self-signed certificates"
    answer: 0
    explanation: |
      An insecure channel uses HTTP/2 in cleartext (h2c): no TLS handshake, no
      encryption, no server authentication. It is for local dev, tests, or a trusted
      loopback where a sidecar handles TLS. It is a code smell in production configs.
    ref: "concepts.md#insecure-channel-plaintext"

  - id: security-tls-mtls-authentication-012
    difficulty: advanced
    tags: [tls, san, hostname, gotcha]
    question: |
      A gRPC client connects to a server and the TLS handshake fails with a hostname
      verification error, even though the cert is validly signed. What is the most likely
      cause?
    options:
      - "The client did not send its own certificate"
      - "The server is using HTTP/2 instead of HTTP/1.1"
      - "The dialed hostname/authority is not present in the server certificate's Subject Alternative Names"
      - "The token in the authorization header expired"
    answer: 2
    explanation: |
      The client checks that the requested authority (hostname/:authority) matches a SAN
      in the server cert. Connecting by IP or a name not listed in the SANs fails
      verification even with a valid chain. Modern TLS ignores the deprecated CN field
      for hostname matching.
    ref: "concepts.md#transport-layer-security-tls"

  - id: security-tls-mtls-authentication-013
    difficulty: advanced
    tags: [mtls, clientauth, downgrade, gotcha]
    question: |
      A server sets `ClientAuth: VerifyClientCertIfGiven` and gates access on the client
      certificate identity. Why is this risky?
    options:
      - "It forces every client to present a certificate, breaking browsers"
      - "It disables encryption on the connection"
      - "It requires the server cert to be self-signed"
      - "Client certificates are optional, so a client presenting none can bypass the cert-based check"
    answer: 3
    explanation: |
      VerifyClientCertIfGiven makes the client cert optional; a client that presents no
      cert still connects. If authorization relies on the cert identity, this allows a
      downgrade/bypass. True enforced mTLS uses RequireAndVerifyClientCert.
    ref: "concepts.md#mutual-tls-mtls"

  - id: security-tls-mtls-authentication-014
    difficulty: intermediate
    tags: [spiffe, spire, identity, mesh]
    question: |
      What is a SPIFFE ID in the context of gRPC mTLS?
    options:
      - "A URI-form workload identity (e.g., spiffe://org/ns/prod/sa/svc) embedded in the certificate's SAN"
      - "A shared symmetric key distributed to all services"
      - "A signed JWT placed in the authorization metadata header"
      - "The TCP source port used to identify a connection"
    answer: 0
    explanation: |
      A SPIFFE ID is a URI workload identity embedded in the cert SAN (an SVID). SPIRE
      is the reference implementation that attests workloads and issues short-lived X.509
      SVIDs. The server reads the SPIFFE ID from the verified cert for authorization,
      decoupling identity from IP/DNS.
    ref: "concepts.md#mutual-tls-mtls"

  - id: security-tls-mtls-authentication-015
    difficulty: intermediate
    tags: [alts, google, transport]
    question: |
      What is ALTS in gRPC?
    options:
      - "A load-balancing policy for headless services"
      - "A compression codec for protobuf payloads"
      - "Google's mutual-authentication transport based on service-account identity, used inside Google's infrastructure"
      - "An alternative serialization format replacing Protocol Buffers"
    answer: 2
    explanation: |
      ALTS (Application Layer Transport Security) is Google's mTLS-like transport that
      mutually authenticates and encrypts, but uses a service-account identity model
      instead of X.509 PKI. It occupies the same channel-credentials slot as TLS and is
      designed for Google's internal/GCP environment.
    ref: "concepts.md#alts-application-layer-transport-security"

  - id: security-tls-mtls-authentication-016
    difficulty: advanced
    tags: [best-practices, secrets, messages]
    question: |
      Why should you avoid putting a bearer token or password inside a protobuf message
      field?
    options:
      - "Protobuf cannot encode strings longer than 256 bytes"
      - "Message fields are always sent in cleartext even over TLS"
      - "Protobuf strips string fields during serialization"
      - "It is cross-cutting context that belongs in metadata; putting it in the message pollutes the contract and risks being logged as business data"
    answer: 3
    explanation: |
      Secrets are cross-cutting call context, not domain data. They belong in metadata
      over a secure channel, handled by credentials and interceptors. Placing them in
      message fields pollutes the .proto contract and risks them being logged/persisted
      as business data.
    ref: "concepts.md#best-practices--gotchas"

  - id: security-tls-mtls-authentication-017
    difficulty: intermediate
    tags: [tls, http2, alpn]
    question: |
      During a gRPC TLS handshake, how is HTTP/2 selected as the application protocol?
    options:
      - "Via an HTTP `Upgrade: h2c` header after connecting"
      - "gRPC always assumes HTTP/2 without negotiation"
      - "Via ALPN advertising `h2` during the TLS handshake"
      - "Through a DNS TXT record on the server hostname"
    answer: 2
    explanation: |
      gRPC over TLS negotiates HTTP/2 using ALPN (Application-Layer Protocol
      Negotiation), advertising `h2`. The `h2c` Upgrade path is the cleartext case.
      Full ALPN/handshake details live in networking; here we note gRPC requires HTTP/2.
    ref: "concepts.md#transport-layer-security-tls"

  - id: security-tls-mtls-authentication-018
    difficulty: advanced
    tags: [call-credentials, refresh, per-rpc]
    question: |
      Why are call credentials invoked PER-RPC (their GetRequestMetadata runs for each
      call) rather than once per channel?
    options:
      - "So a short-lived token can be transparently refreshed before it expires"
      - "Because HTTP/2 forbids reusing headers across streams"
      - "To renegotiate the TLS session on every call"
      - "To rotate the server certificate on each request"
    answer: 0
    explanation: |
      Because GetRequestMetadata runs per RPC, the credential can re-mint or refresh a
      short-lived token (e.g., an OAuth2 TokenSource) transparently before expiry,
      without recreating the channel. This is the natural fit for short-lived tokens.
    ref: "concepts.md#token-based-authentication-oauth2--jwt"

  - id: security-tls-mtls-authentication-019
    difficulty: intermediate
    tags: [mtls, mesh, zero-trust]
    question: |
      In a service mesh (e.g., Istio/Linkerd) using zero-trust, how is mTLS typically
      managed for gRPC workloads?
    options:
      - "Each team manually generates and rotates long-lived certificates"
      - "mTLS is disabled and replaced by IP allowlists"
      - "Certificates are embedded in the container image at build time and never rotated"
      - "The mesh sidecar/control plane issues and auto-rotates short-lived workload certificates"
    answer: 3
    explanation: |
      Meshes give each workload a short-lived, auto-rotated certificate managed by the
      control plane / sidecar (often SPIFFE/SPIRE-based), so all east-west traffic is
      mutually authenticated without application code handling certs. Short-lived
      auto-rotation beats hand-managed long-lived certs.
    ref: "concepts.md#mutual-tls-mtls"

  - id: security-tls-mtls-authentication-020
    difficulty: intermediate
    tags: [authcontext, security-level, peer]
    question: |
      Besides the peer certificate, what does the gRPC AuthContext/peer info expose about
      a connection?
    options:
      - "The negotiated SecurityLevel (NONE / INTEGRITY / PRIVACY)"
      - "The number of pending RPCs on the channel"
      - "The client's CPU architecture"
      - "The protobuf schema version in use"
    answer: 0
    explanation: |
      The AuthContext surfaces the connection's SecurityLevel — NONE (insecure),
      INTEGRITY, or PRIVACY (encrypted) — alongside, under mTLS, the verified peer cert
      chain from which identity is extracted.
    ref: "concepts.md#where-auth-is-enforced-interceptors--authcontext"

  - id: security-tls-mtls-authentication-021
    difficulty: beginner
    tags: [tls, mtls, user-vs-workload]
    question: |
      In a mesh that uses BOTH mTLS and a propagated JWT, what does each authenticate?
    options:
      - "mTLS authenticates the end user; the JWT authenticates the network"
      - "Both authenticate the same thing and one is redundant"
      - "mTLS authenticates the workload/connection; the JWT authenticates the end user/caller principal"
      - "mTLS encrypts the JWT so the JWT need not be validated"
    answer: 2
    explanation: |
      mTLS gives cryptographic identity to the workload/connection (service-to-service),
      while a JWT/OAuth token identifies the acting end-user or caller principal. They
      answer different questions and are complementary, not redundant.
    ref: "concepts.md#mutual-tls-mtls"

  - id: security-tls-mtls-authentication-022
    difficulty: advanced
    tags: [composition, insecure, gotcha]
    question: |
      Why can't you compose call credentials onto an insecure channel and expect the
      token to be transmitted?
    options:
      - "Insecure channels do not support HTTP/2 headers"
      - "Metadata is disabled on plaintext connections"
      - "The token would exceed the HTTP/2 header size limit"
      - "Composite credentials require the channel creds to provide transport security for the token to attach"
    answer: 3
    explanation: |
      Composition is asymmetric: channel creds must provide transport security for call
      creds to attach. Over an insecure channel, call creds refuse to send the token by
      default because a cleartext bearer token can be stolen and replayed.
    ref: "concepts.md#composite-credentials"

  - id: security-tls-mtls-authentication-023
    difficulty: intermediate
    tags: [server-config, tls, go]
    question: |
      In Go, which is the correct way to start a gRPC server with TLS transport security?
    options:
      - "grpc.NewServer() with no options, since TLS is automatic"
      - "grpc.NewServer(grpc.Creds(serverCreds)) where serverCreds is built from the cert and key"
      - "grpc.NewServer(grpc.WithInsecure())"
      - "Set an environment variable GRPC_TLS=1 and start the server normally"
    answer: 1
    explanation: |
      You pass transport credentials to the server via grpc.Creds(...), built from the
      server certificate and private key (e.g., credentials.NewServerTLSFromFile). TLS is
      not automatic, and WithInsecure is a client-side dial option for plaintext.
    ref: "concepts.md#transport-layer-security-tls"

  - id: security-tls-mtls-authentication-024
    difficulty: advanced
    tags: [mtls, handshake, sequence]
    question: |
      During an mTLS handshake, which message signals that the server wants the client to
      present a certificate?
    options:
      - "The client's ClientHello"
      - "The server's CertificateRequest"
      - "The client's Finished message"
      - "An HTTP/2 SETTINGS frame after the handshake"
    answer: 1
    explanation: |
      In mTLS the server sends a CertificateRequest (alongside its own certificate),
      prompting the client to send its certificate and a signature the server verifies.
      This is what upgrades server-auth TLS to mutual authentication.
    ref: "concepts.md#mutual-tls-mtls"

  - id: security-tls-mtls-authentication-025
    difficulty: beginner
    tags: [authorization, metadata, key]
    question: |
      What kind of metadata key is `authorization` (used for bearer tokens) in gRPC?
    options:
      - "A binary metadata key requiring a `-bin` suffix"
      - "A reserved key that gRPC forbids applications from setting"
      - "A normal ASCII (text) metadata key"
      - "A pseudo-header like :authority"
    answer: 2
    explanation: |
      `authorization` is an ordinary ASCII metadata key; its value is the opaque token
      string (e.g., `Bearer <token>`). Binary keys use the `-bin` suffix; `authorization`
      is plain text and follows normal metadata rules.
    ref: "concepts.md#token-based-authentication-oauth2--jwt"

  - id: security-tls-mtls-authentication-026
    difficulty: advanced
    tags: [scenario, mesh, plaintext, sidecar]
    question: |
      A microservice speaks PLAINTEXT gRPC to 127.0.0.1 where a mesh sidecar listens.
      Is this acceptable, and why?
    options:
      - "No — any plaintext gRPC is forbidden under all circumstances"
      - "Yes — plaintext is fine anywhere as long as a firewall exists"
      - "No — sidecars require the application to terminate TLS itself"
      - "Yes — the app-to-sidecar hop is loopback-only and the sidecar upgrades to mTLS for the network hop"
    answer: 3
    explanation: |
      In a mesh the app may legitimately speak plaintext to a local sidecar over
      loopback, and the sidecar performs mTLS for the actual network hop. This is
      acceptable precisely because the plaintext segment never leaves the host.
    ref: "concepts.md#insecure-channel-plaintext"

  - id: security-tls-mtls-authentication-027
    difficulty: intermediate
    tags: [token, validation, best-practices]
    question: |
      When a server interceptor validates a JWT bearer token, checking only that the
      token is PRESENT is insufficient. What else must it verify?
    options:
      - "Only that the token is longer than 128 characters"
      - "Signature, expiry (exp), audience (aud), and scopes"
      - "That the token matches the server's own TLS certificate"
      - "Only the token's issuer hostname resolves in DNS"
    answer: 1
    explanation: |
      Full validation checks the signature (integrity/authenticity), expiry, audience,
      and scopes/claims — not mere presence. A present-but-invalid or wrong-audience
      token must be rejected with UNAUTHENTICATED. Token issuance/threat model detail
      lives in the security domain.
    ref: "concepts.md#best-practices--gotchas"

  - id: security-tls-mtls-authentication-028
    difficulty: beginner
    tags: [tls, http2, requirement]
    question: |
      Why does gRPC rely on HTTP/2 (and thus, on the public internet, TLS with ALPN)?
    options:
      - "HTTP/2 is required for the multiplexed streams, binary framing, and trailers gRPC depends on"
      - "HTTP/2 encrypts payloads without needing TLS"
      - "HTTP/2 is only needed for unary calls"
      - "gRPC uses HTTP/2 solely for its larger header size limits"
    answer: 0
    explanation: |
      gRPC requires HTTP/2 for multiplexed streams (streaming RPCs), binary framing, and
      trailers (where grpc-status lives). On the public internet, HTTP/2 in practice
      implies TLS negotiated via ALPN (h2). Full HTTP/2 mechanics live in networking.
    ref: "concepts.md#transport-layer-security-tls"

  - id: security-tls-mtls-authentication-029
    difficulty: advanced
    tags: [scenario, status-codes, expired-token]
    question: |
      An interceptor decodes a token successfully but finds its `exp` is in the past.
      What should it return, and why not PERMISSION_DENIED?
    options:
      - "PERMISSION_DENIED, because an expired token means no permissions"
      - "DEADLINE_EXCEEDED, because the token's time ran out"
      - "UNAUTHENTICATED, because an expired token is not valid authentication"
      - "OK, because the token was at least parseable"
    answer: 2
    explanation: |
      An expired token fails authentication — it is not valid credentials — so the
      correct code is UNAUTHENTICATED (16). PERMISSION_DENIED is reserved for an
      authenticated caller lacking rights, which is not the case when the token itself is
      invalid.
    ref: "concepts.md#where-auth-is-enforced-interceptors--authcontext"

  - id: security-tls-mtls-authentication-030
    difficulty: intermediate
    tags: [ca, roots, client-config]
    question: |
      When a gRPC client validates a server certificate, what does it check the chain
      against?
    options:
      - "The server's own private key"
      - "The client's own certificate"
      - "A set of trusted root CAs configured on the client (system roots or a supplied CA)"
      - "A hash stored in the protobuf descriptor"
    answer: 2
    explanation: |
      The client validates the server's certificate chain against its configured trusted
      root CAs — either the system trust store or an explicitly supplied CA (e.g.,
      credentials.NewClientTLSFromFile with a ca.crt). It also checks the hostname
      against the cert SANs.
    ref: "concepts.md#transport-layer-security-tls"

  - id: security-tls-mtls-authentication-031
    difficulty: advanced
    tags: [scenario, credentials, design]
    question: |
      You need service A to call service B with (a) an encrypted, mutually-authenticated
      connection and (b) an end-user JWT propagated per request. Which credential
      construction fits?
    options:
      - "Insecure channel plus the JWT in a message field"
      - "TLS channel credentials only, embedding the JWT in the certificate"
      - "Composite credentials: mTLS channel credentials + call credentials carrying the JWT"
      - "Call credentials only, since they imply encryption"
    answer: 2
    explanation: |
      mTLS channel creds give the mutually-authenticated encrypted connection (workload
      identity); call creds carry the end-user JWT per RPC. Composing them yields both.
      Call creds alone do not provide transport security, and JWTs never belong in a
      cert or a message field.
    ref: "concepts.md#composite-credentials"

  - id: security-tls-mtls-authentication-032
    difficulty: beginner
    tags: [alts, scope, environment]
    question: |
      Outside of Google's infrastructure, what should you generally use instead of ALTS
      for gRPC transport security?
    options:
      - "An insecure channel"
      - "HTTP/1.1 with basic auth"
      - "A custom XOR cipher"
      - "TLS or mTLS"
    answer: 3
    explanation: |
      ALTS is designed for Google's internal/GCP environment with its integrated
      service-account identity system. Elsewhere, TLS (server-auth) or mTLS (mutual) is
      the general-purpose transport security for gRPC.
    ref: "concepts.md#alts-application-layer-transport-security"

  - id: security-tls-mtls-authentication-033
    difficulty: intermediate
    tags: [best-practices, rotation, short-lived]
    question: |
      Why do gRPC security best practices favor SHORT-LIVED certificates and tokens?
    options:
      - "They compress better on the HTTP/2 wire"
      - "They are required by the proto3 specification"
      - "They limit the blast radius if a credential is compromised, since it soon expires"
      - "They eliminate the need for a certificate authority"
    answer: 2
    explanation: |
      Short-lived credentials that auto-rotate limit blast radius: a stolen cert/token is
      useful only briefly. Per-RPC call credentials make transparent token refresh
      natural, and mesh tooling (SPIFFE/SPIRE) auto-rotates certs.
    ref: "concepts.md#best-practices--gotchas"

  - id: security-tls-mtls-authentication-034
    difficulty: advanced
    tags: [scenario, authcontext, trust, gotcha]
    question: |
      A handler decides authorization based on an `x-user-role: admin` value the client
      set in metadata, on an mTLS connection. What is the flaw?
    options:
      - "Metadata cannot be read inside handlers"
      - "mTLS connections strip all custom metadata"
      - "The header should have used a `-bin` suffix"
      - "The role is self-asserted by the client and must not be trusted for authz; derive identity from the verified peer cert (AuthContext) instead"
    answer: 3
    explanation: |
      A client-set metadata value is self-asserted and forgeable at the application
      level; trusting it for authz is a privilege-escalation bug. With mTLS available,
      derive identity from the cryptographically verified peer certificate via
      AuthContext, or validate a signed token — not an arbitrary client header.
    ref: "concepts.md#best-practices--gotchas"

  - id: security-tls-mtls-authentication-035
    difficulty: intermediate
    tags: [require-transport-security, go, opt-out]
    question: |
      In Go, what does a PerRPCCredentials implementation's `RequireTransportSecurity()`
      returning `true` mean?
    options:
      - "The credential will only attach its metadata over a secure (TLS/mTLS/ALTS) channel"
      - "The credential forces the server to enable mTLS"
      - "The credential encrypts the token itself with AES"
      - "The channel will retry on transport failures"
    answer: 0
    explanation: |
      Returning true tells gRPC the credential must not send its token over an insecure
      channel — it attaches only when the transport is secure. Returning false is the
      explicit (and dangerous) opt-out to allow sending over plaintext.
    ref: "concepts.md#channel-credentials-vs-call-credentials"

  - id: security-tls-mtls-authentication-036
    difficulty: beginner
    tags: [enforcement, transport, authz]
    question: |
      True or false: enabling TLS (or mTLS) on a gRPC server automatically authorizes
      callers.
    options:
      - "True — a valid TLS connection means the caller is authorized"
      - "True — but only for unary RPCs"
      - "False — secure transport does not authorize anyone; an interceptor must validate the token or peer identity"
      - "False — TLS blocks all RPCs until a password is entered"
    answer: 2
    explanation: |
      Transport security establishes encryption and (for mTLS) connection identity, but
      it does not decide who may call which method. Authorization must be enforced —
      typically in a server interceptor validating the token and/or the AuthContext
      identity.
    ref: "concepts.md#where-auth-is-enforced-interceptors--authcontext"

  - id: security-tls-mtls-authentication-037
    difficulty: advanced
    tags: [scenario, streaming, auth, deadline]
    question: |
      For a server-streaming RPC, when is the caller's bearer token most naturally
      validated?
    options:
      - "Before every individual response message is streamed"
      - "Once, in the server interceptor, from the initial request metadata before the stream handler runs"
      - "After the stream completes, in the trailers"
      - "It cannot be validated for streaming RPCs"
    answer: 1
    explanation: |
      Request metadata (including the authorization token) arrives in the opening HEADERS
      before any messages, so the server interceptor validates it once up front, then the
      streaming handler runs. Long-lived streams may separately re-check token expiry, but
      the initial auth happens on the initial metadata.
    ref: "concepts.md#where-auth-is-enforced-interceptors--authcontext"

  - id: security-tls-mtls-authentication-038
    difficulty: intermediate
    tags: [insecure, production, risk]
    question: |
      Which of the following is NOT a consequence of shipping an insecure gRPC channel to
      production?
    options:
      - "Payloads are readable by anyone on the network path"
      - "There is no server authentication, enabling man-in-the-middle attacks"
      - "Call credentials silently fail to attach unless transport security is disabled on them"
      - "The protobuf schema becomes incompatible with proto3"
    answer: 3
    explanation: |
      Transport security is orthogonal to the protobuf schema — an insecure channel does
      not affect proto3 compatibility. The real consequences are exposed payloads, no
      server auth (MITM risk), and call creds refusing to attach without a secure
      transport.
    ref: "concepts.md#insecure-channel-plaintext"

  - id: security-tls-mtls-authentication-039
    difficulty: advanced
    tags: [xds, mesh, credentials, cross-ref]
    question: |
      In a large service-mesh deployment, how are mTLS certificates commonly delivered to
      gRPC clients/servers so identities rotate automatically?
    options:
      - "Baked into each binary and shipped via a new release"
      - "Downloaded on demand from a public certificate transparency log"
      - "Via xDS/mesh-provided credentials that fetch and rotate certs from the control plane"
      - "Hard-coded in the .proto file"
    answer: 2
    explanation: |
      xDS/mesh-integrated credentials let gRPC obtain and auto-rotate workload certs from
      the control plane, so identities refresh without redeploys. The full mesh/xDS
      architecture lives in system-design; here the point is the gRPC credential hook.
    ref: "concepts.md#mutual-tls-mtls"

  - id: security-tls-mtls-authentication-040
    difficulty: intermediate
    tags: [call-credentials, scope, channel]
    question: |
      Can a single gRPC channel carry different call credentials over its lifetime?
    options:
      - "No — call credentials are fixed for the life of the channel"
      - "No — changing call credentials requires a new TLS handshake"
      - "Yes — but only if the channel is insecure"
      - "Yes — channel creds secure the connection while call creds are applied per-RPC and can vary/refresh"
    answer: 3
    explanation: |
      Channel credentials secure the underlying connection once; call credentials are
      attached per RPC and can differ or refresh over time (e.g., new tokens as they
      rotate). One channel can carry many call creds without re-establishing transport.
    ref: "concepts.md#channel-credentials-vs-call-credentials"

  - id: security-tls-mtls-authentication-041
    difficulty: beginner
    tags: [tls, integrity, encryption]
    question: |
      Beyond authenticating the server, what else does TLS provide for gRPC traffic?
    options:
      - "Automatic retries on failed RPCs"
      - "Load balancing across backends"
      - "Encryption and integrity protection of all bytes on the connection"
      - "Compression of protobuf messages"
    answer: 2
    explanation: |
      TLS encrypts and integrity-protects all frames (HEADERS, DATA, etc.) on the
      connection, in addition to authenticating the server. Retries, load balancing, and
      compression are separate gRPC concerns.
    ref: "concepts.md#transport-layer-security-tls"

  - id: security-tls-mtls-authentication-042
    difficulty: advanced
    tags: [scenario, unauthenticated-vs-unavailable]
    question: |
      A client's token is valid but the auth service the interceptor calls to validate it
      is down, so validation cannot complete. Which status is most defensible to return?
    options:
      - "OK, and let the request through since the token looked valid"
      - "PERMISSION_DENIED (7), since validation did not succeed"
      - "UNAVAILABLE (14), signaling a transient dependency failure the client may retry"
      - "INVALID_ARGUMENT (3), since the token could not be checked"
    answer: 2
    explanation: |
      When the failure is that a downstream auth dependency is unavailable (not that the
      credentials are bad), UNAVAILABLE (14) communicates a transient, retryable
      condition. Returning OK would be a fail-open security hole; PERMISSION_DENIED/
      UNAUTHENTICATED would mislead the client about a valid token.
    ref: "concepts.md#where-auth-is-enforced-interceptors--authcontext"

  - id: security-tls-mtls-authentication-043
    difficulty: intermediate
    tags: [mtls, vs, token, comparison]
    question: |
      Which statement best contrasts mTLS-based identity with token-based (JWT/OAuth)
      identity in gRPC?
    options:
      - "mTLS identity is self-asserted in metadata; token identity is cert-derived"
      - "mTLS provides connection/workload identity from a verified cert; a token provides caller/user identity carried per-RPC in metadata"
      - "They are the same mechanism with different names"
      - "Tokens authenticate the transport; mTLS authenticates the message payload"
    answer: 1
    explanation: |
      mTLS authenticates the workload/connection via a cryptographically verified
      certificate (read from AuthContext). A token authenticates the caller/user and is
      carried per-RPC in metadata. Different layers, different subjects — often used
      together.
    ref: "concepts.md#mutual-tls-mtls"

  - id: security-tls-mtls-authentication-044
    difficulty: advanced
    tags: [security-level, privacy, gotcha]
    question: |
      An interceptor wants to ensure an RPC arrived over an encrypted connection before
      handling sensitive data. What should it inspect?
    options:
      - "The presence of any authorization header"
      - "The size of the request message"
      - "Whether the RPC is unary or streaming"
      - "The connection's SecurityLevel (must be PRIVACY) from the AuthContext/peer info"
    answer: 3
    explanation: |
      The AuthContext/peer info exposes the SecurityLevel (NONE / INTEGRITY / PRIVACY).
      To guarantee encryption, the interceptor checks for PRIVACY. Presence of an auth
      header does not imply the transport is encrypted.
    ref: "concepts.md#where-auth-is-enforced-interceptors--authcontext"

  - id: security-tls-mtls-authentication-045
    difficulty: intermediate
    tags: [java, composite, api]
    question: |
      In Java gRPC, which construct combines TLS channel credentials with bearer-token
      call credentials?
    options:
      - "InsecureChannelCredentials.create()"
      - "CompositeChannelCredentials.create(tlsCreds, callCreds)"
      - "ManagedChannelBuilder.usePlaintext()"
      - "SslContextBuilder.forClient()"
    answer: 1
    explanation: |
      CompositeChannelCredentials.create(channelCreds, callCreds) composes transport
      security (e.g., TlsChannelCredentials) with call credentials (e.g., from an OAuth
      source via MoreCallCredentials). The others are insecure/plaintext or just TLS
      setup.
    ref: "concepts.md#composite-credentials"

  - id: security-tls-mtls-authentication-046
    difficulty: beginner
    tags: [spire, rotation, identity]
    question: |
      What is SPIRE's role relative to SPIFFE in a zero-trust gRPC deployment?
    options:
      - "SPIRE is a protobuf compiler plugin"
      - "SPIRE is a gRPC load balancer"
      - "SPIRE is a reference implementation that attests workloads and issues short-lived X.509 SVIDs carrying SPIFFE IDs"
      - "SPIRE is the metadata key used to carry SPIFFE IDs"
    answer: 2
    explanation: |
      SPIFFE is the identity spec (SPIFFE IDs as URIs); SPIRE is the reference
      implementation that attests workloads and issues short-lived X.509 SVIDs embedding
      those SPIFFE IDs, which gRPC mTLS then presents and verifies.
    ref: "concepts.md#mutual-tls-mtls"

  - id: security-tls-mtls-authentication-047
    difficulty: advanced
    tags: [scenario, downgrade, mtls, design]
    question: |
      You must guarantee that ONLY workloads holding a valid client certificate can reach
      a gRPC server. Which server configuration achieves this?
    options:
      - "TLS with ClientAuth: VerifyClientCertIfGiven"
      - "TLS with ClientAuth: RequireAndVerifyClientCert"
      - "An insecure channel plus a token interceptor"
      - "TLS server-auth only, checking the source IP allowlist"
    answer: 1
    explanation: |
      RequireAndVerifyClientCert enforces true mTLS: the handshake fails unless the
      client presents a certificate the server can verify. VerifyClientCertIfGiven makes
      it optional (bypassable), and neither IP allowlists nor tokens provide cert-gated
      admission.
    ref: "concepts.md#mutual-tls-mtls"

  - id: security-tls-mtls-authentication-048
    difficulty: intermediate
    tags: [best-practices, compose, summary]
    question: |
      Which statement captures the recommended production posture for a networked gRPC
      service?
    options:
      - "Pick either TLS or a token — using both is redundant"
      - "Use an insecure channel and validate everything in the message body"
      - "Rely on mTLS alone and skip any per-user authentication"
      - "Compose channel credentials (TLS/mTLS) with call credentials (a token); enforce authz in an interceptor"
    answer: 3
    explanation: |
      Production gRPC composes transport security (TLS or mTLS) with per-RPC call
      credentials (a token), and enforces authorization in a server interceptor. mTLS
      identifies the workload; the token identifies the user — they are complementary,
      not redundant.
    ref: "concepts.md#best-practices--gotchas"
