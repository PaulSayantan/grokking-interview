topic: "Entity Mappings & Associations"
domain: hibernate-jpa
topic_slug: entity-mappings-associations
version: 1
questions:
  - id: entity-mappings-associations-001
    difficulty: beginner
    tags: [fetch-defaults, many-to-one, annotations]
    question: |
      What is the default fetch type of a `@ManyToOne` association in JPA?
    options: ["LAZY", "It depends on the JPA provider", "There is no default; it must be specified", "EAGER"]
    answer: 3
    explanation: |
      Per the Jakarta Persistence spec, the `*ToOne` associations
      (`@ManyToOne` and `@OneToOne`) default to **EAGER**, while the `*ToMany`
      associations (`@OneToMany`, `@ManyToMany`) default to **LAZY**. The eager
      default on `@ManyToOne` is a leading cause of accidental N+1.
    ref: "concepts.md#the-four-association-types"

  - id: entity-mappings-associations-002
    difficulty: beginner
    tags: [fetch-defaults, one-to-many]
    question: |
      What is the default fetch type of a `@OneToMany` association?
    options: ["EAGER", "EAGER only if the collection is a Set", "LAZY", "Same as the owning @ManyToOne side"]
    answer: 2
    explanation: |
      Collection-valued associations (`@OneToMany`, `@ManyToMany`) default to
      LAZY. Only the singular `*ToOne` associations default to EAGER.
    ref: "concepts.md#the-four-association-types"

  - id: entity-mappings-associations-003
    difficulty: intermediate
    tags: [owning-side, inverse-side, mappedby]
    question: |
      In a bidirectional `Customer` (1) ↔ `Order` (many) relationship, which
      field is the OWNING side?
    options: ["Customer.orders, the @OneToMany collection", "Whichever side is annotated with mappedBy", "Both sides own the relationship equally", "Order.customer, the @ManyToOne field"]
    answer: 3
    explanation: |
      The owning side is the one whose table physically holds the foreign key.
      `orders.customer_id` lives on the `orders` table, so `Order.customer`
      (the `@ManyToOne`) is the owning side. The `@OneToMany` collection uses
      `mappedBy` and is the inverse (read-only for the FK) side.
    ref: "concepts.md#owning-side-vs-inverse-side"

  - id: entity-mappings-associations-004
    difficulty: intermediate
    tags: [owning-side, gotcha, silent-bug]
    question: |
      You run `customer.getOrders().add(order); em.persist(order);` where
      `Order.customer` (@ManyToOne, owning) was never set. What happens?
    options: ["The FK orders.customer_id is set correctly from the collection", "A TransientObjectException is thrown at flush", "The order is inserted with customer_id = NULL; the link is silently lost", "Hibernate infers the owning side from the collection and sets the FK"]
    answer: 2
    explanation: |
      The `@OneToMany` collection is the inverse side and is ignored when writing
      the FK. Because the owning `Order.customer` field was never assigned,
      Hibernate has no value for `customer_id`, so it inserts NULL. No exception
      is thrown — a classic silent bug. You must set the owning side.
    ref: "concepts.md#owning-side-vs-inverse-side"

  - id: entity-mappings-associations-005
    difficulty: beginner
    tags: [mappedby, inverse-side]
    question: |
      What does the `mappedBy` attribute indicate on an association?
    options: ["That this side owns the foreign key", "That the association should be fetched eagerly", "That a join table should be created", "That this side is the inverse (non-owning) side, mirroring a field on the owning side"]
    answer: 3
    explanation: |
      `mappedBy = "fieldName"` marks the inverse side and names the field on the
      owning side that controls the FK. The inverse side is a read-only mirror;
      Hibernate ignores it when writing the relationship.
    ref: "concepts.md#owning-side-vs-inverse-side"

  - id: entity-mappings-associations-006
    difficulty: intermediate
    tags: [helper-methods, sync, bidirectional]
    question: |
      Why is a helper method like `addOrder(Order o)` that sets both
      `orders.add(o)` and `o.setCustomer(this)` recommended on bidirectional
      associations?
    options: ["It is required by the JPA spec or the code won't compile", "It keeps the in-memory inverse collection and the owning FK consistent atomically", "It changes the default fetch type to EAGER", "It prevents the second-level cache from being used"]
    answer: 1
    explanation: |
      Setting only the owning side persists the FK correctly but leaves the
      in-memory inverse collection stale within the same context; setting only
      the inverse side persists nothing. A helper that mutates both ends keeps
      the object graph consistent and makes cascade/orphanRemoval behave.
    ref: "concepts.md#keeping-both-sides-in-sync-helper-methods"

  - id: entity-mappings-associations-007
    difficulty: intermediate
    tags: [many-to-many, join-entity, design]
    question: |
      Your `student_course` `@ManyToMany` now needs an `enrolledOn` date on the
      link. What is the recommended change?
    options: ["Add the column to the @JoinTable via @JoinColumn", "Store the date as a @Transient field on Student", "Use @MapKeyColumn to attach the date to the map", "Replace the @ManyToMany with an explicit Enrollment join entity holding two @ManyToOne associations"]
    answer: 3
    explanation: |
      A `@ManyToMany` join table can hold only the two FKs — it cannot carry
      relationship attributes. Once the link needs its own data (or lifecycle),
      you decompose it into an explicit join entity with two `@ManyToOne`s
      (equivalently two `@OneToMany`s pointing at it).
    ref: "concepts.md#manytomany-and-why-an-explicit-join-entity-is-usually-better"

  - id: entity-mappings-associations-008
    difficulty: intermediate
    tags: [list-vs-set, delete-reinsert, performance]
    question: |
      You remove one element from a bidirectional `@OneToMany List<Order>` (a
      bag with no @OrderColumn) and flush. What SQL is Hibernate likely to emit?
    options: ["A single DELETE ... WHERE id = ? for the removed row", "A DELETE of all child rows followed by re-INSERTs of the survivors", "An UPDATE setting the removed row's FK to NULL only", "No SQL, because the inverse side is read-only"]
    answer: 1
    explanation: |
      A `List` bag has no tracked identity/position, so Hibernate often cannot
      compute a minimal diff and instead deletes all child rows and re-inserts
      the survivors. Use a `Set` (row-level DELETE by id) or an `@OrderColumn`
      to avoid this.
    ref: "concepts.md#list-vs-set-for-collections-and-the-delete-all-reinsert-trap"

  - id: entity-mappings-associations-009
    difficulty: intermediate
    tags: [equals-hashcode, identity, set]
    question: |
      Why should you NOT base an entity's `hashCode()` on its
      `@GeneratedValue` id?
    options: ["Generated ids are always negative and hash poorly", "hashCode() cannot legally use a Long field", "It forces the association to become EAGER", "The id is null while transient and changes after persist/flush, corrupting HashSet membership"]
    answer: 3
    explanation: |
      Before persist, a generated id is `null`; after flush it gets a value, so
      the object's hash changes while it sits in a `HashSet` and the JVM can no
      longer find it. Use a stable natural key or an application-assigned UUID.
    ref: "concepts.md#equals-and-hashcode-on-entities"

  - id: entity-mappings-associations-010
    difficulty: beginner
    tags: [join-table, many-to-many, defaults]
    question: |
      Which mapping annotation produces a join/link table by default?
    options: ["@ManyToOne", "@ManyToMany", "@OneToOne", "Owning-side @OneToMany with @JoinColumn"]
    answer: 1
    explanation: |
      `@ManyToMany` maps to a separate join table (two FKs) by default. A
      unidirectional `@OneToMany` without `@JoinColumn` also defaults to a join
      table, but among the listed options `@ManyToMany` is the canonical case.
    ref: "concepts.md#joincolumn-vs-jointable"

  - id: entity-mappings-associations-011
    difficulty: beginner
    tags: [entity-basics, constructor]
    question: |
      Which is a requirement for a class to be a valid JPA `@Entity`?
    options: ["It must implement Serializable and be final", "It must extend a Hibernate base class", "All fields must be public", "It must have a no-arg (at least protected) constructor and not be final"]
    answer: 3
    explanation: |
      JPA requires a no-arg constructor (public or protected) so the provider can
      instantiate rows, and the class must not be `final` (nor its persistent
      accessors) because Hibernate subclasses/enhances it for proxies and dirty
      tracking. `Serializable` is recommended but not strictly required.
    ref: "concepts.md#entity-table-and-column-basics"

  - id: entity-mappings-associations-012
    difficulty: intermediate
    tags: [column, ddl, validation]
    question: |
      What does `@Column(nullable = false)` actually do at runtime if you do NOT
      use Hibernate schema generation?
    options: ["It validates on every flush and throws before hitting the DB", "It makes the field EAGER-loaded", "It creates a unique index", "Nothing at runtime by itself; it only affects generated DDL"]
    answer: 3
    explanation: |
      `nullable`, `length`, etc. on `@Column` affect only generated DDL. If you
      don't let Hibernate create the schema, they have no runtime effect — the
      DB constraint (if any) does the enforcing. For runtime validation use Bean
      Validation (`@NotNull`, `@Size`).
    ref: "concepts.md#entity-table-and-column-basics"

  - id: entity-mappings-associations-013
    difficulty: advanced
    tags: [one-to-one, lazy, bytecode-enhancement]
    question: |
      Why is the inverse (`mappedBy`) side of a `@OneToOne` effectively EAGER
      even when annotated `fetch = FetchType.LAZY`, without bytecode enhancement?
    options: ["JPA forbids LAZY on any @OneToOne", "The inverse side has no FK column, so Hibernate must query to know whether to set the field to null or a proxy", "Proxies cannot represent 1:1 relationships", "The second-level cache always eagerly loads @OneToOne"]
    answer: 1
    explanation: |
      The inverse `@OneToOne` row holds no FK, so Hibernate cannot tell whether
      the other side exists (whether the field should be null) without executing
      a SELECT. So it loads eagerly regardless of the LAZY hint unless you enable
      build-time bytecode enhancement. The owning (FK-holding) side can be lazy.
    ref: "concepts.md#onetoone-mapping-and-its-traps"

  - id: entity-mappings-associations-014
    difficulty: intermediate
    tags: [join-column, join-table, semantics]
    question: |
      In a `@JoinTable`, what does the `inverseJoinColumns` attribute reference?
    options: ["The FK to the target entity on the other side of the association", "The FK back to the entity declaring the association (this side)", "A surrogate primary key of the join table", "The version column for optimistic locking"]
    answer: 0
    explanation: |
      `joinColumns` points back to the owning (declaring) entity; `inverseJoinColumns`
      points to the target entity. Swapping them maps the join table to the wrong
      rows.
    ref: "concepts.md#joincolumn-vs-jointable"

  - id: entity-mappings-associations-015
    difficulty: intermediate
    tags: [cascade, remove, gotcha]
    question: |
      Why is putting `CascadeType.REMOVE` (or `ALL`) on `Order.customer`
      (`@ManyToOne` to a shared `Customer`) dangerous?
    options: ["Removing one order would cascade to delete the shared Customer and thereby all their other orders", "It causes a compile error", "It forces the customer to load eagerly", "It disables orphanRemoval automatically"]
    answer: 0
    explanation: |
      Cascade should flow from an aggregate root down to children it exclusively
      owns, not up to a shared parent. `REMOVE` on a `@ManyToOne` to a shared
      `Customer` means deleting one order deletes the customer — and cascades to
      all their orders. Cascade belongs on the owning collection pointing down.
    ref: "concepts.md#cascade-types-and-how-they-flow-across-associations"

  - id: entity-mappings-associations-016
    difficulty: intermediate
    tags: [cascade, orphan-removal, difference]
    question: |
      What is the difference between `CascadeType.REMOVE` and
      `orphanRemoval = true`?
    options: ["They are identical aliases", "orphanRemoval only works on @ManyToMany", "REMOVE deletes children when the parent is removed; orphanRemoval also deletes a child when it is disassociated from the parent collection", "REMOVE requires a join table; orphanRemoval requires a join column"]
    answer: 2
    explanation: |
      `CascadeType.REMOVE` propagates `em.remove(parent)` to children.
      `orphanRemoval = true` additionally deletes a child the moment it is removed
      from the parent's collection (orphaned), even if the parent itself is not
      removed.
    ref: "concepts.md#cascade-types-and-how-they-flow-across-associations"

  - id: entity-mappings-associations-017
    difficulty: advanced
    tags: [flush, sql, insert-order]
    question: |
      You cascade-persist a `Customer` with two `Order`s (owning side set
      correctly). On flush, what SQL order does Hibernate use?
    options: ["INSERT the customer, then INSERT each order with customer_id set from the owning side", "INSERT the two orders, then INSERT the customer", "INSERT all rows with NULL FKs, then a bulk UPDATE", "A single multi-row INSERT covering both tables"]
    answer: 0
    explanation: |
      Hibernate orders inserts so parents precede children, letting the child FK
      resolve. It reads the owning side (`Order.customer`) to fill `customer_id`.
      If the owning side were unset, the FK would be NULL.
    ref: "concepts.md#what-hibernate-does-on-flush-for-associations"

  - id: entity-mappings-associations-018
    difficulty: beginner
    tags: [unidirectional, bidirectional]
    question: |
      What distinguishes a bidirectional association from a unidirectional one?
    options: ["In bidirectional, both entities reference each other (owning + mappedBy inverse); unidirectional has a reference on only one side", "Bidirectional uses a join table; unidirectional uses a join column", "Bidirectional is always EAGER", "Unidirectional cannot use cascade"]
    answer: 0
    explanation: |
      Bidirectional means both entities hold a reference (one owning side with the
      FK/join, one inverse side with `mappedBy`), so you can navigate both ways.
      Unidirectional has a reference on only one side.
    ref: "concepts.md#unidirectional-vs-bidirectional"

  - id: entity-mappings-associations-019
    difficulty: advanced
    tags: [unidirectional, one-to-many, join-column, sql]
    question: |
      Why does a unidirectional `@OneToMany` with `@JoinColumn` often emit an
      extra `UPDATE` per child on insert?
    options: ["Because @JoinColumn always disables batching", "Because the child is inserted first with a NULL FK, then updated to set the FK the collection owns but the child table physically holds", "Because Hibernate must refresh the second-level cache", "Because the version column must be incremented separately"]
    answer: 1
    explanation: |
      With a unidirectional `@OneToMany` + `@JoinColumn`, the collection is the
      owning side of a FK that physically lives on the child table but has no
      corresponding `@ManyToOne`. Hibernate inserts the child (FK NULL), then
      issues a separate UPDATE to set the FK. A bidirectional `@ManyToOne`-owned
      mapping avoids this.
    ref: "concepts.md#unidirectional-vs-bidirectional"

  - id: entity-mappings-associations-020
    difficulty: intermediate
    tags: [list-vs-set, semantics]
    question: |
      Which statement about `Set` vs `List` for a JPA collection is correct?
    options: ["A Set uses equals/hashCode to dedup and does row-level add/remove; a plain List (bag) may trigger delete-all-then-reinsert", "A Set allows duplicate elements; a List does not", "A List always preserves order even without @OrderColumn", "Only List can be used with @OneToMany"]
    answer: 0
    explanation: |
      A `Set` disallows duplicates, relies on `equals`/`hashCode`, and lets
      Hibernate do row-level DELETEs by id. A plain `List` bag can trigger
      delete-all-reinsert; preserving order requires `@OrderColumn`.
    ref: "concepts.md#list-vs-set-for-collections-and-the-delete-all-reinsert-trap"

  - id: entity-mappings-associations-021
    difficulty: intermediate
    tags: [jakarta, namespace, versions]
    question: |
      In Hibernate ORM 6.x/7.x (Jakarta EE 9+), which package do JPA annotations
      like `@Entity` and `@Column` come from?
    options: ["jakarta.persistence", "javax.persistence", "org.hibernate.annotations", "java.persistence"]
    answer: 0
    explanation: |
      The Jakarta EE 9 namespace migration renamed `javax.persistence.*` to
      `jakarta.persistence.*`. Hibernate ORM 6.x/7.x use the `jakarta.persistence`
      package. `org.hibernate.annotations` holds Hibernate-specific extras only.
    ref: "concepts.md#entity-table-and-column-basics"

  - id: entity-mappings-associations-022
    difficulty: advanced
    tags: [equals-hashcode, lombok, gotcha]
    question: |
      Why is Lombok `@Data` (or default `@EqualsAndHashCode`/`@ToString`) on a
      JPA `@Entity` considered an anti-pattern?
    options: ["It prevents the class from compiling", "It forces IDENTITY id generation", "Default equals/hashCode use all fields (breaking Set semantics and pulling lazy associations) and @ToString can trigger lazy loads or infinite recursion on bidirectional graphs", "It makes all associations mappedBy"]
    answer: 2
    explanation: |
      Field-based `equals`/`hashCode` change as fields mutate (corrupting Sets)
      and touch lazy associations (triggering loads or `LazyInitializationException`).
      Default `@ToString` can traverse bidirectional graphs into infinite recursion.
      Exclude associations and prefer a stable business key or UUID.
    ref: "concepts.md#equals-and-hashcode-on-entities"

  - id: entity-mappings-associations-023
    difficulty: intermediate
    tags: [one-to-one, maps-id, shared-pk]
    question: |
      What advantage does modeling an optional 1:1 with `@MapsId` (shared primary
      key) give over a separate unique FK column?
    options: ["It allows duplicate rows on the child side", "It converts the relationship to @ManyToMany", "It removes the need for a foreign key entirely", "The child's PK IS the parent's FK — no extra column — and lazy loading works reliably on the owning side"]
    answer: 3
    explanation: |
      With `@MapsId`, the child reuses the parent's id as both its PK and FK, so
      there is no extra unique column, the 1:1 is enforced by the PK, and the
      owning side loads lazily reliably.
    ref: "concepts.md#onetoone-mapping-and-its-traps"

  - id: entity-mappings-associations-024
    difficulty: beginner
    tags: [cascade, persist]
    question: |
      Which cascade type causes `em.persist(parent)` to also persist the
      associated children?
    options: ["CascadeType.PERSIST", "CascadeType.MERGE", "CascadeType.REFRESH", "CascadeType.DETACH"]
    answer: 0
    explanation: |
      `CascadeType.PERSIST` propagates the persist operation from parent to
      children. `CascadeType.ALL` includes it. The others propagate merge,
      refresh, and detach respectively.
    ref: "concepts.md#cascade-types-and-how-they-flow-across-associations"

  - id: entity-mappings-associations-025
    difficulty: advanced
    tags: [many-to-many, mappedby, gotcha]
    question: |
      On a bidirectional `@ManyToMany` between `Student` and `Course`, what
      happens if NEITHER side declares `mappedBy`?
    options: ["Hibernate picks one side arbitrarily as owning", "Hibernate maps two independent join tables, one per side", "It compiles but throws at startup demanding mappedBy", "Both sides become read-only"]
    answer: 1
    explanation: |
      Exactly one side of a bidirectional `@ManyToMany` must be the inverse
      (`mappedBy`). If neither is, Hibernate treats them as two separate
      unidirectional associations and creates two independent join tables.
    ref: "concepts.md#manytomany-and-why-an-explicit-join-entity-is-usually-better"

  - id: entity-mappings-associations-026
    difficulty: intermediate
    tags: [join-column, one-to-one, owning]
    question: |
      In `@OneToOne @JoinColumn(name="user_id", unique=true) private User user;`
      on `UserProfile`, which side is owning and where is the FK?
    options: ["User is owning; FK is on app_user", "Neither; @OneToOne has no owning side", "UserProfile is owning; FK column user_id is on the user_profile table", "Both hold a copy of the FK"]
    answer: 2
    explanation: |
      The side with `@JoinColumn` and no `mappedBy` is the owning side and holds
      the FK. Here `UserProfile.user` owns the relationship, so `user_id` is a
      column on the `user_profile` table (with a unique constraint enforcing 1:1).
    ref: "concepts.md#onetoone-mapping-and-its-traps"

  - id: entity-mappings-associations-027
    difficulty: advanced
    tags: [flush, order-column, delete-reinsert]
    question: |
      You have a bidirectional `@OneToMany List<LineItem>` and you reorder the
      list. Without `@OrderColumn`, why might Hibernate recreate the collection?
    options: ["Because a bag has no persistent index, so Hibernate cannot express a positional change and may delete-and-reinsert to reflect the new state", "Because reordering changes the FK values", "Because List is not a supported collection type", "Because reordering triggers orphanRemoval"]
    answer: 0
    explanation: |
      A bag (List without `@OrderColumn`) has no stored position, so Hibernate
      cannot persist a reorder as targeted updates and may delete all rows and
      re-insert. Add `@OrderColumn` (persists an index) if order must survive.
    ref: "concepts.md#list-vs-set-for-collections-and-the-delete-all-reinsert-trap"

  - id: entity-mappings-associations-028
    difficulty: beginner
    tags: [annotations, entity-name, table]
    question: |
      What does the `name` in `@Entity(name = "Foo")` control?
    options: ["The database table name", "The schema name", "The JPQL entity name used in queries (defaults to the simple class name)", "The primary key column name"]
    answer: 2
    explanation: |
      `@Entity(name=...)` sets the JPQL entity name (default: the simple class
      name). The table name is controlled separately by `@Table(name=...)`.
    ref: "concepts.md#entity-table-and-column-basics"

  - id: entity-mappings-associations-029
    difficulty: intermediate
    tags: [access-type, id-placement]
    question: |
      Where you place `@Id` (on the field vs on the getter) determines what by
      default?
    options: ["The id generation strategy", "The entity's access type (FIELD vs PROPERTY) for all attributes", "The fetch type of associations", "Whether the entity is cacheable"]
    answer: 1
    explanation: |
      If `@Id` is on a field, Hibernate uses field access for the whole entity;
      on a getter, property access. `@Access` can override per-attribute, but
      mixing silently is a common source of bugs.
    ref: "concepts.md#entity-table-and-column-basics"

  - id: entity-mappings-associations-030
    difficulty: intermediate
    tags: [equals-hashcode, natural-key, uuid]
    question: |
      For an entity with no stable natural key, what is the recommended way to
      implement `equals`/`hashCode` so it survives the transient→managed→detached
      lifecycle?
    options: ["Use the database-generated id in both", "Use all persistent fields", "Assign a UUID in the constructor and base identity on it (hashCode stays constant)", "Return the same constant from equals for every instance"]
    answer: 2
    explanation: |
      An application-assigned UUID set at construction is stable across the whole
      lifecycle (unlike a DB-generated id, which is null before flush). Base
      `equals` on it and keep `hashCode` constant/derived from it so Set
      membership never breaks.
    ref: "concepts.md#equals-and-hashcode-on-entities"

  - id: entity-mappings-associations-031
    difficulty: advanced
    tags: [n-plus-one, eager, cross-ref]
    question: |
      A `@ManyToOne Customer` on `Order` is left at its default fetch type, and
      you load 100 orders with a single query. What is the likely SQL pattern?
    options: ["One SELECT for all orders and their customers via an automatic JOIN", "One SELECT for the orders plus up to 100 additional SELECTs (one per distinct customer) — the N+1 problem", "No SQL until the customer field is touched", "A single SELECT because @ManyToOne is LAZY by default"]
    answer: 1
    explanation: |
      `@ManyToOne` defaults to EAGER, so loading 100 orders triggers a SELECT per
      referenced customer — the classic N+1. Fixes (JOIN FETCH, @EntityGraph,
      @BatchSize) are covered in fetching-lazy-eager-n-plus-one.
    ref: "concepts.md#the-four-association-types"

  - id: entity-mappings-associations-032
    difficulty: intermediate
    tags: [unidirectional, one-to-many, default-join-table]
    question: |
      A unidirectional `@OneToMany` with NO `@JoinColumn` and NO `mappedBy` maps
      to what by default?
    options: ["A foreign key column on the child table", "Nothing; it is invalid", "A separate join table (e.g. parent_child)", "An embedded collection column"]
    answer: 2
    explanation: |
      Without `@JoinColumn`, a unidirectional `@OneToMany` defaults to a join
      table — often surprising. Adding `@JoinColumn` moves it to a FK on the
      child table (at the cost of extra UPDATEs). Bidirectional mapping avoids
      both surprises.
    ref: "concepts.md#unidirectional-vs-bidirectional"

  - id: entity-mappings-associations-033
    difficulty: expert
    tags: [flush, action-queue, ordering]
    question: |
      During flush, in what relative order does Hibernate execute entity INSERTs
      vs entity DELETEs (default action-queue ordering)?
    options: ["INSERTs (and UPDATEs, collection ops) are executed before entity DELETEs", "DELETEs first, then INSERTs", "They are interleaved in the order methods were called", "DELETEs and INSERTs are batched into one statement"]
    answer: 0
    explanation: |
      Hibernate's action queue runs in a fixed order: orphan collection removals,
      then entity INSERTs, then UPDATEs, then collection element ops, and entity
      DELETEs last. This ordering (not call order) is why a remove+insert of the
      same natural key in one transaction can violate a unique constraint. See
      transactions-dirty-checking-flushing.
    ref: "concepts.md#what-hibernate-does-on-flush-for-associations"

  - id: entity-mappings-associations-034
    difficulty: intermediate
    tags: [many-to-many, set, best-practice]
    question: |
      For a simple `@ManyToMany` (tag-style, no extra columns), which collection
      type is generally the safest default and why?
    options: ["Set, because it avoids duplicate link rows and enables row-level add/remove instead of delete-all-reinsert", "List, because it preserves insertion order", "Map, because it is fastest", "Array, because it is fixed-size"]
    answer: 0
    explanation: |
      A `Set` prevents duplicate join-table rows and lets Hibernate add/remove
      individual link rows rather than recreating the whole collection, which a
      `List` bag can trigger.
    ref: "concepts.md#list-vs-set-for-collections-and-the-delete-all-reinsert-trap"

  - id: entity-mappings-associations-035
    difficulty: beginner
    tags: [transient, mapping]
    question: |
      How do you exclude a field from persistence in JPA?
    options: ["Annotate it with @Column(persist=false)", "Annotate it with @Transient (or use the Java transient keyword)", "Make it private", "Annotate it with @Ignore"]
    answer: 1
    explanation: |
      `@Transient` (JPA) marks a field as non-persistent. The Java `transient`
      keyword also works for JPA field access, but `@Transient` is the explicit,
      preferred marker and is independent of Java serialization.
    ref: "concepts.md#entity-table-and-column-basics"

  - id: entity-mappings-associations-036
    difficulty: advanced
    tags: [join-entity, embedded-id, maps-id]
    question: |
      In an explicit `Enrollment` join entity with a composite PK
      `(student_id, course_id)`, how are the `@ManyToOne`s to `Student` and
      `Course` typically wired to that PK?
    options: ["With @JoinTable on each association", "With mappedBy on both", "By duplicating the ids in separate columns unrelated to the PK", "With @MapsId on each @ManyToOne so the FK columns also form the @EmbeddedId"]
    answer: 3
    explanation: |
      `@MapsId("studentId")` / `@MapsId("courseId")` map each `@ManyToOne`'s FK
      column onto the corresponding part of the `@EmbeddedId`, so the two FKs
      together are the composite primary key of the join entity. See
      inheritance-embeddables-composite-keys.
    ref: "concepts.md#manytomany-and-why-an-explicit-join-entity-is-usually-better"

  - id: entity-mappings-associations-037
    difficulty: intermediate
    tags: [owning-side, update, read-only]
    question: |
      To move an existing `Order` from one `Customer` to another, which field
      must you change for the FK to be updated on flush?
    options: ["The old customer's orders collection only", "Order.customer (the owning @ManyToOne side)", "The new customer's orders collection only", "Any of the three; Hibernate reconciles them"]
    answer: 1
    explanation: |
      Only the owning side (`Order.customer`) controls the FK. Changing inverse
      collections alone does not update `customer_id`. Set `order.setCustomer(newCustomer)`
      (and, for clean in-memory state, adjust both collections via helper methods).
    ref: "concepts.md#owning-side-vs-inverse-side"

  - id: entity-mappings-associations-038
    difficulty: intermediate
    tags: [join-column, foreign-key]
    question: |
      What does `@JoinColumn(name = "customer_id")` on `Order.customer` specify?
    options: ["That a join table named customer_id is created", "The name of the foreign-key column (on the orders table) that references the customer's PK", "The JPQL alias for the customer", "That the customer is fetched lazily"]
    answer: 1
    explanation: |
      `@JoinColumn` names the FK column on the owning entity's table. Here it
      declares that `orders.customer_id` is the FK referencing `Customer`'s
      primary key.
    ref: "concepts.md#joincolumn-vs-jointable"

  - id: entity-mappings-associations-039
    difficulty: advanced
    tags: [proxy, final, mechanism]
    question: |
      Why must a JPA entity class (and its persistent accessors) not be `final`
      when using default (runtime proxy) lazy loading?
    options: ["final classes cannot be serialized", "The JPA spec forbids final for compilation", "Hibernate creates a runtime subclass proxy to intercept access for lazy loading and dirty tracking, which a final class prevents", "final breaks the second-level cache key"]
    answer: 2
    explanation: |
      Default lazy proxies are runtime subclasses that intercept method calls to
      trigger loading; a `final` class or `final` accessor can't be subclassed or
      overridden, so proxy-based lazy loading fails. (Bytecode enhancement is an
      alternative that relaxes this.)
    ref: "concepts.md#entity-table-and-column-basics"

  - id: entity-mappings-associations-040
    difficulty: intermediate
    tags: [cascade, merge, detached]
    question: |
      Which cascade type is most relevant when reattaching a detached object
      graph via `em.merge(parent)`?
    options: ["CascadeType.PERSIST", "CascadeType.REMOVE", "CascadeType.MERGE", "CascadeType.REFRESH"]
    answer: 2
    explanation: |
      `CascadeType.MERGE` propagates the merge operation across the association so
      detached children are reattached along with the parent. `PERSIST` only
      applies to brand-new (transient) graphs.
    ref: "concepts.md#cascade-types-and-how-they-flow-across-associations"

  - id: entity-mappings-associations-041
    difficulty: expert
    tags: [one-to-one, lazy, no-proxy, mechanism]
    question: |
      Even on the OWNING side of a `@OneToOne`, when can Hibernate still fail to
      make it lazy with a proxy?
    options: ["When the FK is nullable/optional and Hibernate can't guarantee the related row exists, it may need to check — reliable lazy often needs a not-null FK or @MapsId plus enhancement", "Never; owning @OneToOne is always lazy", "Only when using @JoinTable", "When the target entity has a composite key"]
    answer: 0
    explanation: |
      A nullable owning `@OneToOne` FK means Hibernate can't be sure a row exists
      to proxy without checking, so it may load eagerly. Making the FK not-null
      (or using `@MapsId`), and/or bytecode enhancement, gives reliable lazy
      behavior. The inverse side is worse — it always needs a query.
    ref: "concepts.md#onetoone-mapping-and-its-traps"

  - id: entity-mappings-associations-042
    difficulty: intermediate
    tags: [scenario, design, many-to-many]
    question: |
      A `Post` and `Tag` have a plain many-to-many with no link attributes, but
      you frequently need to delete a single (post, tag) pairing efficiently.
      Which mapping choice best supports that?
    options: ["@ManyToMany with List on both sides", "Unidirectional @OneToMany with @JoinColumn", "Two @OneToOne associations", "@ManyToMany with Set (row-level join-table DELETE) or an explicit link entity"]
    answer: 3
    explanation: |
      A `Set`-based `@ManyToMany` lets Hibernate delete an individual join-table
      row rather than recreating the collection (which a `List` bag can trigger).
      An explicit link entity gives even more control. `List` is the worst choice
      here.
    ref: "concepts.md#list-vs-set-for-collections-and-the-delete-all-reinsert-trap"

  - id: entity-mappings-associations-043
    difficulty: advanced
    tags: [scenario, silent-bug, persist]
    question: |
      A teammate reports that saving a new `Invoice` with line items via
      `invoice.getLines().add(line)` leaves `line.invoice_id` NULL in the DB. The
      collection is `@OneToMany(mappedBy="invoice", cascade=ALL)`. What is the
      fix?
    options: ["Change the collection to EAGER", "Add @JoinColumn to the collection", "Call em.flush() twice", "Also set the owning side: line.setInvoice(invoice) (ideally in an addLine helper)"]
    answer: 3
    explanation: |
      The collection is the inverse side (`mappedBy`), so it doesn't write the FK.
      The owning `LineItem.invoice` must be set. The clean fix is an `addLine`
      helper that sets both sides, so cascade-persist writes the correct
      `invoice_id`.
    ref: "concepts.md#keeping-both-sides-in-sync-helper-methods"

  - id: entity-mappings-associations-044
    difficulty: intermediate
    tags: [table, index, unique-constraint]
    question: |
      Which of these is a legitimate use of the `@Table` annotation?
    options: ["Declaring the table/schema name, unique constraints, and indexes for generated DDL", "Setting the default fetch type for the entity's associations", "Enabling the second-level cache", "Defining the id generation strategy"]
    answer: 0
    explanation: |
      `@Table` controls the mapped table/schema/catalog name plus DDL hints like
      `uniqueConstraints` and `indexes`. Fetch types, caching, and id generation
      are governed by other annotations.
    ref: "concepts.md#entity-table-and-column-basics"

  - id: entity-mappings-associations-045
    difficulty: advanced
    tags: [scenario, cascade, shared-reference]
    question: |
      `Employee` has `@ManyToOne Department department` with
      `cascade = CascadeType.ALL`. You call `em.remove(someEmployee)`. What is the
      risk?
    options: ["Only the employee row is deleted; cascade on @ManyToOne is ignored", "A LazyInitializationException is thrown", "The shared Department is also deleted (cascade REMOVE flows up), potentially orphaning or deleting other employees", "The department's version column is incremented"]
    answer: 2
    explanation: |
      `CascadeType.ALL` includes REMOVE. On a `@ManyToOne` pointing at a shared
      `Department`, removing one employee cascades to delete the department they
      all share — a serious data-loss trap. Cascade should flow down to
      exclusively-owned children, not up to shared parents.
    ref: "concepts.md#cascade-types-and-how-they-flow-across-associations"

  - id: entity-mappings-associations-046
    difficulty: beginner
    tags: [one-to-one, owning-side]
    question: |
      In a bidirectional `@OneToOne`, which side declares `@JoinColumn` and holds
      the FK?
    options: ["The side with mappedBy", "The owning side (no mappedBy)", "Both sides", "Neither; @OneToOne never uses @JoinColumn"]
    answer: 1
    explanation: |
      The owning side has `@JoinColumn` and no `mappedBy`; it holds the (usually
      unique) FK. The inverse side uses `mappedBy` and mirrors it.
    ref: "concepts.md#onetoone-mapping-and-its-traps"

  - id: entity-mappings-associations-047
    difficulty: expert
    tags: [scenario, order-column, list, sql]
    question: |
      You add `@OrderColumn(name = "position")` to a `@OneToMany List<Step>`.
      What does Hibernate now maintain, and what is a subtle cost?
    options: ["Nothing changes; @OrderColumn is only documentation", "It converts the List to a Set automatically", "It disables cascade on the collection", "It persists an index column so order survives reloads, but inserting/removing in the middle rewrites the position of all subsequent rows"]
    answer: 3
    explanation: |
      `@OrderColumn` stores each element's position in a dedicated column so list
      order is durable. The cost: inserting or deleting in the middle forces
      UPDATEs to renumber all following elements, which can be expensive for large
      ordered collections.
    ref: "concepts.md#list-vs-set-for-collections-and-the-delete-all-reinsert-trap"

  - id: entity-mappings-associations-048
    difficulty: intermediate
    tags: [scenario, owning-inverse, query]
    question: |
      You want to change which `Customer` owns a set of `Order`s. The
      relationship is bidirectional (`Order.customer` owning, `Customer.orders`
      mappedBy). Reassigning only `oldCustomer.getOrders()` and
      `newCustomer.getOrders()` but not `order.setCustomer(...)` will result in
      what after flush?
    options: ["The FKs are updated to the new customer", "A constraint violation is thrown", "The FKs are unchanged in the DB because the owning side was never modified", "All orders are deleted"]
    answer: 2
    explanation: |
      Manipulating the inverse collections has no effect on the FK. Only changing
      the owning `Order.customer` updates `customer_id`. This mirrors the
      top-gotcha rule: the inverse side is read-only for the FK.
    ref: "concepts.md#owning-side-vs-inverse-side"

  - id: entity-mappings-associations-049
    difficulty: expert
    tags: [enumerated, ordinal, data-corruption]
    question: |
      An entity maps `private Status status;` with no `@Enumerated` annotation,
      where `enum Status { NEW, PAID, SHIPPED }`. A later release inserts a new
      constant: `NEW, PENDING, PAID, SHIPPED`. What happens to existing rows?
    options: ["A startup exception is thrown because the enum changed", "Every existing row that stored PAID (was 1) or SHIPPED (was 2) now silently means the wrong constant, with no error", "Hibernate auto-migrates the stored values to match the new order", "Nothing; the name is stored so order changes are safe"]
    answer: 1
    explanation: |
      With no annotation the default is `EnumType.ORDINAL`, which stores the
      constant's position. Inserting a constant in the middle shifts every later
      constant's ordinal, so previously-stored integers now map to different
      constants — silent data corruption, no exception. `EnumType.STRING` (stores
      `name()`) is resilient to reordering.
    ref: "concepts.md#enumerated-and-the-ordinal-trap"

  - id: entity-mappings-associations-050
    difficulty: advanced
    tags: [enumerated, string, ordinal, default]
    question: |
      Which statement about `@Enumerated` is correct?
    options: ["EnumType.STRING is the default and is the safe choice", "EnumType.ORDINAL is the default; EnumType.STRING is the safer choice for persisted data", "There is no default; you must always specify EnumType", "Both ORDINAL and STRING store the constant name, differing only in case"]
    answer: 1
    explanation: |
      `EnumType.ORDINAL` is the JPA default (stores the zero-based position).
      `EnumType.STRING` stores `name()` and survives reordering of constants, so
      it is the recommended choice for anything stored long-term.
    ref: "concepts.md#enumerated-and-the-ordinal-trap"

  - id: entity-mappings-associations-051
    difficulty: expert
    tags: [jdbctypecode, json, hibernate6, type-system]
    question: |
      In Hibernate 6/7, what is the idiomatic way to map a `Map<String,Object>`
      field to a JSON column?
    options: ["@Type(\"json\") on the field", "@TypeDef(name=\"json\", typeClass=JsonType.class) at package level", "@Convert(converter = JsonConverter.class) is the only option", "@JdbcTypeCode(SqlTypes.JSON) on the field"]
    answer: 3
    explanation: |
      Hibernate 6 introduced `@JdbcTypeCode(SqlTypes.JSON)` to override the JDBC
      type via the new type system. The legacy string `@Type("json")` and
      `@TypeDef` were removed in HB6. (An `AttributeConverter` works too but is
      not the JSON-specific idiom.)
    ref: "concepts.md#hibernate-6-type-system-and-jdbctypecode"

  - id: entity-mappings-associations-052
    difficulty: advanced
    tags: [hibernate6, type-system, removed, migration]
    question: |
      Which of these was REMOVED in Hibernate 6's type-system overhaul?
    options: ["The @Column annotation", "@GeneratedValue", "@TypeDef / @TypeDefs and the string-based @Type(\"...\") form", "@JoinColumn.referencedColumnName"]
    answer: 2
    explanation: |
      HB6 replaced the old `BasicType`/descriptor model with the `JavaType` /
      `JdbcType` split and `@JdbcTypeCode`. `@TypeDef`, `@TypeDefs`, `@AnyMetaDef`,
      and the string-based `@Type("json")` were removed; a `UserType` is now
      referenced by class via `@Type(MyType.class)`.
    ref: "concepts.md#hibernate-6-type-system-and-jdbctypecode"

  - id: entity-mappings-associations-053
    difficulty: advanced
    tags: [convert, attribute-converter, portable]
    question: |
      You want to store a `boolean active` field as `'Y'`/`'N'` in a portable,
      spec-standard way (not Hibernate-specific). What do you use?
    options: ["A JPA AttributeConverter<Boolean,String> attached via @Convert (or autoApply)", "@Enumerated(EnumType.STRING)", "A Hibernate UserType referenced by @Type", "@JdbcTypeCode(SqlTypes.CHAR)"]
    answer: 0
    explanation: |
      `AttributeConverter<X,Y>` with `@Convert` is the portable Jakarta
      Persistence mechanism for custom value conversion. `autoApply=true` applies
      it to all fields of that type. A Hibernate `UserType` is vendor-specific.
    ref: "concepts.md#convert-and-attributeconverter"

  - id: entity-mappings-associations-054
    difficulty: expert
    tags: [convert, enumerated, spec-rule]
    question: |
      Per the Jakarta Persistence spec, which combination is NOT allowed on the
      same attribute?
    options: ["@Enumerated together with an AttributeConverter (@Convert)", "@Column together with @Convert", "@Convert with autoApply=true and @Column", "@ElementCollection with @Column"]
    answer: 0
    explanation: |
      The spec forbids combining `@Enumerated` with an `AttributeConverter` on the
      same attribute — you choose one enum-mapping mechanism. Use `@Enumerated`
      (ORDINAL/STRING) or a converter mapping to explicit codes, not both.
    ref: "concepts.md#convert-and-attributeconverter"

  - id: entity-mappings-associations-055
    difficulty: advanced
    tags: [element-collection, one-to-many, value-type]
    question: |
      What is the key difference between `@ElementCollection` and `@OneToMany`?
    options: ["@ElementCollection is always eager; @OneToMany is always lazy", "@ElementCollection requires a join table; @OneToMany forbids one", "They are synonyms; @ElementCollection is just the older name", "@ElementCollection maps a collection of basics/@Embeddables (value types with no identity); @OneToMany maps a collection of entities"]
    answer: 3
    explanation: |
      `@ElementCollection` maps value types (basics or `@Embeddable`s) into a
      `@CollectionTable`; the elements have no identity and live entirely within
      the owner's lifecycle. `@OneToMany` maps independent entities that have
      their own id and table.
    ref: "concepts.md#elementcollection-and-embeddable-value-types"

  - id: entity-mappings-associations-056
    difficulty: expert
    tags: [element-collection, delete-reinsert, sql]
    question: |
      A `@ElementCollection private List<String> tags;` (no `@OrderColumn`) has
      one element changed. What SQL does Hibernate emit on flush?
    options: ["A single UPDATE of the changed row", "No SQL; element collections are read-only", "A DELETE of all the owner's rows in the collection table, then re-INSERT of the survivors", "An UPSERT (MERGE) statement for the changed element"]
    answer: 2
    explanation: |
      A `List`-based element collection is a bag with no tracked identity, so
      Hibernate deletes all rows for that owner and re-inserts them — the same
      delete-all-reinsert seen with `@OneToMany` `List` bags. Use a `Set` or add
      `@OrderColumn` to avoid it.
    ref: "concepts.md#elementcollection-and-embeddable-value-types"

  - id: entity-mappings-associations-057
    difficulty: advanced
    tags: [embeddable, attribute-override, value-type]
    question: |
      You embed the same `@Embeddable Address` twice in an entity (as `billing`
      and `shipping`), and both define a `zip` field. What is needed?
    options: ["Nothing; JPA auto-prefixes the columns", "You must convert Address into an @Entity", "A separate @CollectionTable for each address", "@AttributeOverride(s) on at least one @Embedded to remap the colliding column names"]
    answer: 3
    explanation: |
      Two embeddings of the same `@Embeddable` map to the same default column
      names, colliding. `@AttributeOverride` (or `@AttributeOverrides`) on the
      `@Embedded` fields remaps the columns (e.g. `billing_zip`, `shipping_zip`).
      An embeddable is a value type inlined into the owner's table, unlike an
      independent `@Entity`.
    ref: "concepts.md#elementcollection-and-embeddable-value-types"

  - id: entity-mappings-associations-058
    difficulty: advanced
    tags: [order-column, order-by, distinction]
    question: |
      What is the difference between `@OrderColumn` and `@OrderBy` on a
      collection?
    options: ["@OrderColumn sorts at load time via SQL ORDER BY; @OrderBy persists an index column", "They are identical; @OrderBy is the newer spelling", "@OrderColumn persists an index column (durable order, extra UPDATEs on reorder); @OrderBy only adds ORDER BY to the load query and stores nothing", "@OrderColumn requires a Set; @OrderBy requires a List"]
    answer: 2
    explanation: |
      `@OrderColumn` makes Hibernate maintain a stored position column, so order
      survives reloads but reordering/inserting in the middle rewrites subsequent
      indexes. `@OrderBy("attr")` only appends an `ORDER BY` to the load query and
      stores nothing.
    ref: "concepts.md#ordercolumn-vs-orderby-and-map-collections"

  - id: entity-mappings-associations-059
    difficulty: expert
    tags: [map, map-key, collections]
    question: |
      For a `Map<Country, Phone> phones` where the key is itself an entity
      (`Country`), which annotation maps the key?
    options: ["@MapKeyColumn", "@MapKeyEnumerated", "@MapKeyJoinColumn", "@MapKey(name = \"country\")"]
    answer: 2
    explanation: |
      `@MapKeyJoinColumn` maps a map key that is an entity (via an FK).
      `@MapKeyColumn` is for a basic-typed key column, `@MapKeyEnumerated` for an
      enum key, and `@MapKey(name=)` uses an attribute of the value entity as the
      key.
    ref: "concepts.md#ordercolumn-vs-orderby-and-map-collections"

  - id: entity-mappings-associations-060
    difficulty: advanced
    tags: [formula, derived-column, read-only]
    question: |
      You need a read-only `averageScore` computed from a subquery, without
      creating a database view. Which Hibernate mapping fits?
    options: ["@Formula(\"(select avg(r.score) from review r where r.book_id = id)\")", "@Column(insertable=false, updatable=false)", "@Generated(event = INSERT)", "@ElementCollection over the scores"]
    answer: 0
    explanation: |
      `@Formula` maps a read-only value computed by native SQL (including
      subqueries) evaluated in the SELECT — a derived column with no stored data
      and no DB view. `@Generated` is for DB-produced stored values;
      `insertable/updatable=false` alone still maps a real stored column.
    ref: "concepts.md#computed-and-db-generated-columns"

  - id: entity-mappings-associations-061
    difficulty: expert
    tags: [generated, db-generated, re-select]
    question: |
      A `created_at` column is populated by a database DEFAULT/trigger, not by
      Java. You annotate it `@Generated(event = INSERT)`. What does Hibernate do
      after inserting the row?
    options: ["Nothing; the entity's field stays null until the next transaction", "It throws because the column is not writable from Java", "It writes the Java default value, overriding the DB default", "It issues a re-SELECT to read the database-generated value back into the entity"]
    answer: 3
    explanation: |
      `@Generated` tells Hibernate the value is produced by the database, so after
      the INSERT (or UPDATE) it performs a re-SELECT to load the generated value
      into the in-memory entity, keeping the object consistent with the row.
    ref: "concepts.md#computed-and-db-generated-columns"

  - id: entity-mappings-associations-062
    difficulty: intermediate
    tags: [immutable, dirty-checking, performance]
    question: |
      What is the effect of `@org.hibernate.annotations.Immutable` on an entity?
    options: ["It prevents the entity from ever being persisted", "It makes all associations eager", "Hibernate skips dirty checking for it (read-only), a perf win for reference data", "It enables the second-level cache automatically"]
    answer: 2
    explanation: |
      `@Immutable` marks an entity/collection read-only, so Hibernate excludes it
      from dirty checking and never issues UPDATEs — useful for lookup/reference
      data that never changes after load.
    ref: "concepts.md#computed-and-db-generated-columns"

  - id: entity-mappings-associations-063
    difficulty: advanced
    tags: [natural-id, business-key, cache]
    question: |
      What does Hibernate's `@NaturalId` provide beyond a plain unique `@Column`?
    options: ["It replaces the surrogate @Id entirely", "It forces the column to be auto-generated", "A first-class business-key mapping with dedicated lookup APIs (byNaturalId/bySimpleNaturalId) and an optional @NaturalIdCache", "It makes the field lazy by default"]
    answer: 2
    explanation: |
      `@NaturalId` marks the immutable business key alongside the surrogate `@Id`.
      Hibernate offers `session.byNaturalId(...)` / `bySimpleNaturalId(...)`
      lookups and, with `@NaturalIdCache`, resolves the business key to a PK from
      cache — ideal for cache-friendly lookups and as a stable equals/hashCode
      basis.
    ref: "concepts.md#naturalid"

  - id: entity-mappings-associations-064
    difficulty: expert
    tags: [join-column, referenced-column-name, legacy-schema]
    question: |
      A legacy schema has `order.cust_code` as an FK that references
      `customer.code` (a unique column), NOT the customer's primary key. How do
      you map `Order.customer`?
    options: ["It cannot be mapped; the FK must reference the PK", "@PrimaryKeyJoinColumn(name=\"cust_code\")", "@MapsId(\"code\")", "@JoinColumn(name=\"cust_code\", referencedColumnName=\"code\")"]
    answer: 3
    explanation: |
      `@JoinColumn(referencedColumnName=...)` points the FK at a non-PK unique
      column of the target — the standard way to integrate legacy schemas whose
      foreign keys reference a business/unique column rather than the surrogate
      primary key.
    ref: "concepts.md#joincolumn-deep-dive"

  - id: entity-mappings-associations-065
    difficulty: expert
    tags: [join-column, insertable-updatable, read-only]
    question: |
      You want to read `Order.customerId` without triggering a load of the lazy
      `@ManyToOne Customer customer` (mapped on the same `customer_id` column).
      How do you map both without a "column mapped twice" error?
    options: ["Map only the Long id and drop the association", "Map the @ManyToOne normally and the Long id column with @Column(insertable=false, updatable=false)", "Use two different column names and a trigger to sync them", "Annotate the id field with @Transient"]
    answer: 1
    explanation: |
      Map the FK column twice: the `@ManyToOne` association plus a plain
      `@Column(name="customer_id", insertable=false, updatable=false)` Long
      field. Marking one mapping read-only avoids the duplicate-write conflict and
      lets you read the FK value without initializing the proxy.
    ref: "concepts.md#joincolumn-deep-dive"

  - id: entity-mappings-associations-066
    difficulty: expert
    tags: [optional, inner-join, lazy, one-to-one]
    question: |
      Why does `@ManyToOne(optional = false)` help Hibernate use lazy loading and
      an INNER join, compared to the default `optional = true`?
    options: ["optional=false disables the association entirely", "Because a guaranteed-present row lets Hibernate build a reliable proxy and use INNER JOIN; optional=true means the row may be absent, forcing LEFT JOIN and pushing toward eager checks", "optional=false forces EAGER loading", "It only affects DDL nullability, never the join type"]
    answer: 1
    explanation: |
      `optional=false` asserts the associated row always exists, so Hibernate can
      INNER JOIN and safely place a proxy (owning side). `optional=true` (default)
      means the association may be null, forcing a LEFT JOIN and, for a nullable
      owning `@OneToOne`, an eager existence check to decide null-vs-proxy.
    ref: "concepts.md#joincolumn-deep-dive"

  - id: entity-mappings-associations-067
    difficulty: advanced
    tags: [target-entity, interface, mapping]
    question: |
      When is the `targetEntity` attribute on an association necessary?
    options: ["Always, on every @OneToMany", "When the field's declared type is an interface or a raw (non-parameterized) type, so JPA can't infer the entity class from generics", "Only for @ManyToMany", "To change the fetch type to LAZY"]
    answer: 1
    explanation: |
      `targetEntity` explicitly names the associated entity class when JPA cannot
      infer it — e.g. `List<Order>` where `Order` is an interface, or a raw
      collection field. With normal generic collections of a concrete entity type,
      it is unnecessary.
    ref: "concepts.md#targetentity"

  - id: entity-mappings-associations-068
    difficulty: expert
    tags: [hibernate6, distinct, join-fetch, behavior-change]
    question: |
      In Hibernate 6, you run `SELECT p FROM Post p JOIN FETCH p.comments` where a
      post has 3 comments. Compared to Hibernate 5, what changed about duplicate
      parent rows?
    options: ["HB6 requires you to add DISTINCT to the SQL to avoid 3 Post copies", "HB6 returns 3 Post proxies that must be merged manually", "HB6 automatically de-duplicates the parent entities in memory without adding SQL DISTINCT; HINT_PASS_DISTINCT_THROUGH is no longer needed", "HB6 forbids JOIN FETCH on collections"]
    answer: 2
    explanation: |
      HB6 implicitly filters duplicate parents produced by a join-fetched
      collection in memory, so you no longer get N copies of the parent and no
      longer need `HINT_PASS_DISTINCT_THROUGH` (or SQL `DISTINCT`) just to
      de-duplicate the object graph.
    ref: "concepts.md#what-changed-hb5--6--7"

  - id: entity-mappings-associations-069
    difficulty: advanced
    tags: [hibernate6, hibernate7, versions, changes]
    question: |
      Which is a genuine Hibernate 5→6 (or 6→7) behavior/mapping change?
    options: ["@Entity was renamed to @Table", "@OneToMany became EAGER by default", "mappedBy was removed in favor of @JoinColumn", "Ordinal enums now map to a small integer type (TINYINT/SMALLINT) instead of INTEGER, and HB7 completes the move to the jakarta.* namespace"]
    answer: 3
    explanation: |
      Real HB6+ changes include: small-int storage for ordinal enums, the new
      JavaType/JdbcType type system with `@JdbcTypeCode`, implicit collection
      DISTINCT, the SQM query engine, and HB7's full `jakarta.*` cutover. Fetch
      defaults and core annotations were not changed.
    ref: "concepts.md#what-changed-hb5--6--7"

  - id: entity-mappings-associations-070
    difficulty: intermediate
    tags: [one-to-one, primary-key-join-column, shared-pk]
    question: |
      Which annotation maps a shared-primary-key `@OneToOne` where the child's PK
      IS the FK to the parent (the annotation cousin of `@MapsId`)?
    options: ["@PrimaryKeyJoinColumn", "@JoinTable", "@MapKeyJoinColumn", "@OrderColumn"]
    answer: 0
    explanation: |
      `@PrimaryKeyJoinColumn` maps a shared-PK `@OneToOne`, where the child reuses
      the parent's id as both its primary key and its foreign key. `@MapsId`
      achieves the same shared-PK model in a more modern, id-derived way.
    ref: "concepts.md#joincolumn-deep-dive"

  - id: entity-mappings-associations-071
    difficulty: expert
    tags: [unidirectional, one-to-many, join-column, predict-sql]
    question: |
      You persist a new parent plus 3 children through a unidirectional
      `@OneToMany @JoinColumn(name="parent_id")` collection (cascade PERSIST).
      How many statements does Hibernate emit for the children, and why?
    options: ["3 INSERTs only, FK set inline", "1 INSERT and 1 UPDATE via batching", "3 INSERTs (children with NULL FK) followed by 3 UPDATEs setting parent_id — because the collection owns a FK the child table physically holds but no @ManyToOne writes inline", "3 INSERTs into a join table"]
    answer: 2
    explanation: |
      A unidirectional `@OneToMany` + `@JoinColumn` makes the collection own an FK
      on the child table with no `@ManyToOne` to fill it inline. Hibernate inserts
      each child with a NULL FK, then issues a separate UPDATE per child to set
      `parent_id` — 3 INSERTs + 3 UPDATEs. A bidirectional `@ManyToOne`-owned
      mapping writes the FK in the INSERT, avoiding the extra UPDATEs.
    ref: "concepts.md#unidirectional-vs-bidirectional"

  - id: entity-mappings-associations-072
    difficulty: advanced
    tags: [join-columns, composite-fk]
    question: |
      To map a foreign key that spans two columns (a composite FK), which
      annotation do you use?
    options: ["@JoinColumn repeated is illegal; you must use a surrogate key", "@MapsId with two arguments", "@CollectionTable with two joinColumns", "@JoinColumns wrapping multiple @JoinColumn entries"]
    answer: 3
    explanation: |
      `@JoinColumns` groups multiple `@JoinColumn` mappings to express a
      multi-column (composite) foreign key, each typically pairing `name` with the
      corresponding `referencedColumnName` on the target's composite key.
    ref: "concepts.md#joincolumn-deep-dive"

  - id: entity-mappings-associations-073
    difficulty: expert
    tags: [foreign-key, no-constraint, ddl]
    question: |
      You want Hibernate to map an association but NOT generate a foreign-key
      constraint in the DDL (e.g. for a partitioned/sharded table). How?
    options: ["Set @JoinColumn(nullable = true)", "Annotate with @Transient", "Set optional = false", "Use @JoinColumn(foreignKey = @ForeignKey(ConstraintMode.NO_CONSTRAINT))"]
    answer: 3
    explanation: |
      `@JoinColumn(foreignKey = @ForeignKey(ConstraintMode.NO_CONSTRAINT))` tells
      Hibernate to map the association but skip emitting the FK constraint in
      generated DDL. `@ForeignKey` can also name the constraint. Nullability and
      `optional` are unrelated to constraint generation.
    ref: "concepts.md#joincolumn-deep-dive"

  - id: entity-mappings-associations-074
    difficulty: intermediate
    tags: [element-collection, collection-table]
    question: |
      In `@ElementCollection @CollectionTable(name="company_phone", joinColumns=@JoinColumn(name="company_id"))`,
      what does `joinColumns` reference?
    options: ["The FK on the collection table back to the owning entity's PK", "The target entity's primary key", "A composite key of the phone values", "The version column"]
    answer: 0
    explanation: |
      For an element collection, `@CollectionTable.joinColumns` names the FK
      column on the collection table that points back to the owning entity's
      primary key. The element values themselves are mapped by `@Column` (or as an
      embeddable).
    ref: "concepts.md#elementcollection-and-embeddable-value-types"

  - id: entity-mappings-associations-075
    difficulty: expert
    tags: [many-to-many, cascade, remove, data-loss]
    question: |
      Why should a bidirectional `@ManyToMany` between `Post` and `Tag` NOT
      include `CascadeType.REMOVE`?
    options: ["It causes a compile error", "It forces the join table to be dropped", "Removing a Post would cascade-delete the shared Tag entities, which other Posts still reference", "REMOVE is ignored on @ManyToMany, so it is harmless but pointless"]
    answer: 2
    explanation: |
      `@ManyToMany` links shared entities. `CascadeType.REMOVE` (or `ALL`) means
      deleting one `Post` would delete the `Tag` rows themselves — tags other
      posts still use — causing data loss. On a many-to-many, cascade should be
      limited to `PERSIST`/`MERGE` at most; never `REMOVE`.
    ref: "concepts.md#manytomany-and-why-an-explicit-join-entity-is-usually-better"

