topic: "Performance Tuning & Common Pitfalls"
domain: hibernate-jpa
topic_slug: performance-tuning-pitfalls
version: 1
questions:
  - id: performance-tuning-pitfalls-001
    difficulty: beginner
    tags: [n-plus-one, definition]
    question: |
      What characterizes the "N+1 select problem"?
    options:
      - "One query loads N parents, then N additional queries load a lazy association one row at a time"
      - "N+1 application threads block while competing for one pooled database connection at a time"
      - "A query returns N+1 rows because of an off-by-one in the LIMIT clause"
      - "Hibernate opens N+1 separate physical connections to the database, one per parent row"
    answer: 0
    explanation: |
      N+1 means 1 query loads N parent rows, then Hibernate fires one more query per
      parent to initialize a lazy (or JPQL-EAGER) association — 1 + N round-trips where
      one or two would suffice. It is the single most common Hibernate performance bug.
    ref: "concepts.md#the-n1-problem-and-the-fix-menu"

  - id: performance-tuning-pitfalls-002
    difficulty: intermediate
    tags: [n-plus-one, join-fetch, fix]
    question: |
      You load a list of `Post` and then access `post.getComments()` in a loop,
      producing one SELECT per post. Which single change collapses this into one query?
    options:
      - "Add a `@Transactional` annotation to the method"
      - "Change the collection type from `List` to `Set`"
      - "Use a JPQL query with `join fetch p.comments`"
      - "Increase the JDBC row fetch size setting"
    answer: 2
    explanation: |
      `join fetch p.comments` initializes the collection in the same SQL statement via a
      join, turning 1+N queries into a single query. `@Transactional` only keeps the
      session open (it would just move the N+1 inside the transaction), and the fetch
      size / collection type don't change the number of statements.
    ref: "concepts.md#the-n1-problem-and-the-fix-menu"

  - id: performance-tuning-pitfalls-003
    difficulty: intermediate
    tags: [n-plus-one, eager, misconception]
    question: |
      Why is "make the association EAGER" a poor fix for the N+1 problem?
    options:
      - "EAGER is not supported for `@OneToMany` collections, only for `@ManyToOne` associations"
      - "EAGER associations cannot be referenced in a JPQL where clause or select projection"
      - "EAGER often just causes N+1 (or a Cartesian product) itself and can't be relaxed to LAZY per query"
      - "EAGER forces Hibernate to disable the persistence context and its first-level cache"
    answer: 2
    explanation: |
      EAGER fetch on a JPQL query still fires secondary selects per parent (N+1), and
      when joined can cause Cartesian products. It is also global — you cannot make it
      LAZY for a use case that doesn't need the data. The senior fix is LAZY by default
      plus per-query `JOIN FETCH`/`@EntityGraph`/`@BatchSize`.
    ref: "concepts.md#the-n1-problem-and-the-fix-menu"

  - id: performance-tuning-pitfalls-004
    difficulty: advanced
    tags: [n-plus-one, batch-size, pagination]
    question: |
      You must keep pagination working on the parent query but also avoid N+1 when
      accessing each parent's lazy collection. Which fix fits best?
    options:
      - "`@BatchSize` (or `hibernate.default_batch_fetch_size`) so collections load in batched `IN (…)` queries"
      - "`JOIN FETCH` the collection together with `setMaxResults` so the database applies the limit"
      - "Mark the collection EAGER so Hibernate always fetches it upfront with the parent query"
      - "Wrap each collection access in its own separate transaction to keep a session open"
    answer: 0
    explanation: |
      `@BatchSize`/`default_batch_fetch_size` keeps the parent query paginable (no fetch
      join) and loads the lazy collections for many parents in a few `IN (?,?,…)`
      queries. `JOIN FETCH` + `setMaxResults` triggers in-memory paging (HHH000104), and
      EAGER reintroduces the same problems.
    ref: "concepts.md#the-n1-problem-and-the-fix-menu"

  - id: performance-tuning-pitfalls-005
    difficulty: intermediate
    tags: [entity-graph, fix]
    question: |
      What does a JPA `@EntityGraph` let you do?
    options:
      - "Cache query results in the second-level cache across sessions and transactions"
      - "Enable JDBC statement batching for both inserts and updates"
      - "Declare a reusable fetch plan specifying which associations to load eagerly for a given query"
      - "Automatically page through large result sets without a limit clause"
    answer: 2
    explanation: |
      An `@EntityGraph` is a declarative fetch plan attached to a query or Spring Data
      repository method that overrides fetch behavior for that call — loading the named
      associations eagerly (typically via joins) without changing the mapping defaults.
    ref: "concepts.md#the-n1-problem-and-the-fix-menu"

  - id: performance-tuning-pitfalls-006
    difficulty: beginner
    tags: [batching, defaults]
    question: |
      By default, how many JDBC statements does Hibernate send for 100 entity inserts,
      absent any batching configuration?
    options:
      - "1 combined batched statement covering all 100 inserts"
      - "10 statements, sent in fixed automatic batches of 10 rows"
      - "0 until commit time, then a single bulk multi-row statement"
      - "100 — one round-trip per insert, because JDBC batching is off by default"
    answer: 3
    explanation: |
      JDBC batching is disabled by default; Hibernate sends one statement per row. You
      enable batching with `hibernate.jdbc.batch_size` (>0), typically alongside
      `order_inserts`/`order_updates`.
    ref: "concepts.md#jdbc-batching-for-inserts-and-updates"

  - id: performance-tuning-pitfalls-007
    difficulty: intermediate
    tags: [batching, configuration]
    question: |
      Which property enables JDBC batching for inserts and updates in Hibernate?
    options:
      - "`hibernate.cache.use_query_cache`"
      - "`hibernate.jdbc.fetch_size`"
      - "`hibernate.jdbc.batch_size`"
      - "`hibernate.max_fetch_depth`"
    answer: 2
    explanation: |
      `hibernate.jdbc.batch_size` set to a value greater than 0 turns on statement
      batching. `fetch_size` controls read row-prefetch, not write batching, and the
      others are unrelated.
    ref: "concepts.md#jdbc-batching-for-inserts-and-updates"

  - id: performance-tuning-pitfalls-008
    difficulty: advanced
    tags: [batching, order-inserts]
    question: |
      You enabled `hibernate.jdbc.batch_size=50` but batching barely helps because your
      code interleaves `Post` and `Comment` inserts. Which setting groups same-table
      statements so they can batch?
    options:
      - "`hibernate.order_inserts=true`"
      - "`hibernate.format_sql=true`"
      - "`hibernate.generate_statistics=true`"
      - "`hibernate.jdbc.fetch_size=50`"
    answer: 0
    explanation: |
      Batching only groups consecutive identical statements. `order_inserts=true`
      reorders pending inserts so all `Post` inserts group together and all `Comment`
      inserts group together, letting each form a batch. `order_updates=true` does the
      same for updates.
    ref: "concepts.md#jdbc-batching-for-inserts-and-updates"

  - id: performance-tuning-pitfalls-009
    difficulty: advanced
    tags: [identity, batching, id-generation]
    question: |
      Why does `GenerationType.IDENTITY` disable JDBC insert batching?
    options:
      - "IDENTITY requires a `SELECT FOR UPDATE` lock on each row that cannot participate in a batch"
      - "IDENTITY forces `hibernate.jdbc.batch_size` to 0 automatically at SessionFactory startup"
      - "Hibernate must execute each INSERT immediately to read back the DB-generated key, so it cannot defer and batch them"
      - "IDENTITY entities are always stored in the second-level cache, which forbids batching"
    answer: 2
    explanation: |
      With IDENTITY the database assigns the key on insert; JPA requires a persisted
      entity to have its id populated, so Hibernate must run each INSERT and read the
      generated key (`getGeneratedKeys()`) right away. It cannot accumulate a batch.
      SEQUENCE lets it allocate ids ahead and batch.
    ref: "concepts.md#why-identity-generation-disables-insert-batching"

  - id: performance-tuning-pitfalls-010
    difficulty: intermediate
    tags: [id-generation, sequence, batching]
    question: |
      For a write-heavy entity on PostgreSQL where you want insert batching, which
      id-generation strategy is preferred?
    options:
      - "`SEQUENCE` (ideally with a pooled optimizer)"
      - "`IDENTITY` with database auto-increment keys"
      - "Assigning random UUID ids in the constructor"
      - "`TABLE` with row-level locking"
    answer: 0
    explanation: |
      SEQUENCE lets Hibernate allocate a block of ids up front (especially with a
      pooled/pooled-lo optimizer), so keys are known before insert and statements can be
      batched. IDENTITY disables batching; TABLE adds locking overhead.
    ref: "concepts.md#why-identity-generation-disables-insert-batching"

  - id: performance-tuning-pitfalls-011
    difficulty: advanced
    tags: [equals-hashcode, set, transient]
    question: |
      Why is using a generated `@Id` inside `hashCode()` dangerous for an entity placed
      in a `HashSet` before it is persisted?
    options:
      - "The id is a `Long`, a boxed type whose `hashCode()` is unusable in a `HashSet`"
      - "Hibernate forbids overriding `hashCode()` on any entity annotated with `@Entity`"
      - "`HashSet` bypasses `hashCode()` entirely and uses identity for managed entities"
      - "The id is null while transient and changes on persist, so the entity's hash bucket moves and the Set can no longer find it"
    answer: 3
    explanation: |
      A transient entity's id is null; after flush the DB assigns it and the id-based
      hash changes. An entity stored while transient lands in the null-hash bucket, then
      its hash changes, so `contains()`/removal break — the detached-entity-in-a-HashSet
      bug. Use a stable business key or a constructor-assigned UUID.
    ref: "concepts.md#equals-and-hashcode-on-entities"

  - id: performance-tuning-pitfalls-012
    difficulty: intermediate
    tags: [equals-hashcode, best-practice]
    question: |
      What is the recommended basis for `equals`/`hashCode` on a JPA entity that may
      live in a `Set` before being persisted?
    options:
      - "The auto-generated `@Id`, which the database populates on insert"
      - "All persistent fields, generated by Lombok `@Data`"
      - "A stable business key, or a UUID assigned in the constructor"
      - "The object's default `System.identityHashCode` inherited from Object"
    answer: 2
    explanation: |
      A value stable across the transient→managed transition is required. A natural
      business key (if immutable and unique) or a UUID assigned at construction works.
      The generated id is null-then-assigned; `@Data` uses all fields (id mutation +
      lazy-load footguns).
    ref: "concepts.md#equals-and-hashcode-on-entities"

  - id: performance-tuning-pitfalls-013
    difficulty: advanced
    tags: [equals-hashcode, lombok, gotcha]
    question: |
      Why is putting Lombok's `@Data` (or `@EqualsAndHashCode` with all fields) on a JPA
      entity considered a footgun?
    options:
      - "It generates equals/hashCode over all fields — causing the id-mutation Set bug and touching lazy associations (extra queries or LazyInitializationException)"
      - "It prevents the entity from being detected by Spring's classpath component scanning"
      - "It makes the entity class final, so Hibernate cannot create a runtime proxy subclass"
      - "It disables automatic dirty checking, so updates to the entity are never flushed"
    answer: 0
    explanation: |
      `@Data`'s all-field equals/hashCode both suffers the id-mutation-in-a-Set bug and
      dereferences lazy associations inside equals/hashCode, triggering extra queries or
      `LazyInitializationException`. Entities should have hand-written, business-key-based
      equals/hashCode.
    ref: "concepts.md#equals-and-hashcode-on-entities"

  - id: performance-tuning-pitfalls-014
    difficulty: beginner
    tags: [lazy-init-exception, definition]
    question: |
      When is `LazyInitializationException` typically thrown?
    options:
      - "When two concurrent threads modify the same managed entity instance at once"
      - "When a LAZY association is navigated after the persistence context that created its proxy has closed"
      - "When a query returns zero rows for a mandatory single-result lookup"
      - "When the `@Version` column mismatches during an optimistic-lock update"
    answer: 1
    explanation: |
      A lazy proxy needs an open Session to run its initializing SELECT. Accessing it
      after the transaction commits and the session closes (e.g. in the view layer)
      throws `LazyInitializationException`.
    ref: "concepts.md#lazyinitializationexception-and-the-osiv-debate"

  - id: performance-tuning-pitfalls-015
    difficulty: intermediate
    tags: [lazy-init-exception, fix]
    question: |
      Which is NOT a sound fix for `LazyInitializationException`?
    options:
      - "Use `JOIN FETCH` / `@EntityGraph` to initialize the association while the session is open"
      - "Return a DTO projection with exactly the data the view needs"
      - "Initialize the association inside the transactional service before returning"
      - "Make every association EAGER globally to be safe"
    answer: 3
    explanation: |
      Making everything EAGER trades one problem for over-fetching, N+1, and Cartesian
      products, and can't be relaxed per query. The sound fixes all fetch the needed data
      while the session is open: `JOIN FETCH`/`@EntityGraph`, DTO projections, or
      initializing in the service.
    ref: "concepts.md#lazyinitializationexception-and-the-osiv-debate"

  - id: performance-tuning-pitfalls-016
    difficulty: advanced
    tags: [osiv, open-in-view, trade-offs]
    question: |
      What are the two main downsides of Open Session In View (`spring.jpa.open-in-view=true`)?
    options:
      - "It disables the second-level cache and silently forces every association to EAGER"
      - "It prevents pagination from working and quietly breaks optimistic version locking"
      - "It hides N+1 by making lazy loads work in the view, and it holds a DB connection for the whole request including view rendering"
      - "It makes all queries run in a read-only transaction that cannot be committed"
    answer: 2
    explanation: |
      OSIV keeps the EntityManager open through rendering, so lazy access in the view
      silently issues queries (masking N+1) and the DB connection is held for the entire
      request, hurting pool throughput under load. Seniors disable it and fetch
      explicitly.
    ref: "concepts.md#lazyinitializationexception-and-the-osiv-debate"

  - id: performance-tuning-pitfalls-017
    difficulty: intermediate
    tags: [osiv, spring-boot, default]
    question: |
      What is the default value of `spring.jpa.open-in-view` in Spring Boot, and what
      does Spring Boot do about it?
    options:
      - "`false`, disabled silently with no startup log message"
      - "`true`, and Spring Boot logs a warning recommending you review it"
      - "It is unset and must be configured explicitly or the application startup fails"
      - "`true`, enabled with no warning or log entry at all"
    answer: 1
    explanation: |
      Spring Boot enables OSIV by default (`true`) but logs a warning because it is often
      undesirable in services/APIs. The Spring container/tx mechanics are covered in
      `spring-boot`.
    ref: "concepts.md#lazyinitializationexception-and-the-osiv-debate"

  - id: performance-tuning-pitfalls-018
    difficulty: intermediate
    tags: [over-fetching, projections, dto]
    question: |
      For a read-only list screen that shows only a post's id and title, why prefer a
      DTO projection over loading full `Post` entities?
    options:
      - "Projections are automatically cached in the second-level cache across all sessions"
      - "Full entities cannot be returned directly from a Spring Data repository query method"
      - "Projections guarantee the generated query uses a covering index on the selected columns"
      - "Projections fetch only needed columns and return detached read-only data — no dirty checking, no lazy proxies, no LazyInitializationException, smaller context"
    answer: 3
    explanation: |
      Projections select just the required columns and return detached data, so there is
      no dirty-check snapshot, no lazy proxy to blow up, and a much smaller persistence
      context. Load full entities only when you intend to modify them.
    ref: "concepts.md#over-fetching-and-dto-projections"

  - id: performance-tuning-pitfalls-019
    difficulty: intermediate
    tags: [projections, jpql, constructor-expression]
    question: |
      Which JPQL feature builds a DTO directly from selected columns?
    options:
      - "A constructor expression: `select new com.app.PostView(p.id, p.title) from Post p`"
      - "A distinct entity query: `select distinct p from Post p`, which returns whole managed entities"
      - "A `@NamedEntityGraph` fetch plan that eagerly loads the named associations onto the entity"
      - "A wildcard projection: `select p.* from Post p`, which selects every column into the entity"
    answer: 0
    explanation: |
      A JPQL constructor expression (`select new FQCN(...)`) instantiates a DTO per row
      from the selected values, returning immutable, detached objects with no entity
      overhead.
    ref: "concepts.md#over-fetching-and-dto-projections"

  - id: performance-tuning-pitfalls-020
    difficulty: advanced
    tags: [multiple-bag-fetch, cartesian-product]
    question: |
      Why does Hibernate throw `MultipleBagFetchException` when you `JOIN FETCH` two
      `List` collections in one query?
    options:
      - "`List` collections are mapped as bags that can only be initialized with a lazy proxy, never a fetch join"
      - "The underlying SQL dialect caps each statement at a single join, so the second fetch join fails to compile"
      - "Two collection fetch joins would produce a Cartesian product, and Hibernate refuses to fetch multiple bags simultaneously"
      - "The persistence context can track only one uninitialized collection per root entity at any given moment"
    answer: 2
    explanation: |
      Fetching two `List`s (bags) at once produces N×M rows (a Cartesian product) and
      Hibernate cannot correctly reconstruct both bags, so it throws
      `MultipleBagFetchException`. Fetch one collection per query, or batch the rest.
    ref: "concepts.md#multiplebagfetchexception-and-cartesian-products"

  - id: performance-tuning-pitfalls-021
    difficulty: advanced
    tags: [multiple-bag-fetch, set, misconception]
    question: |
      A colleague "fixes" `MultipleBagFetchException` by changing both collections from
      `List` to `Set`. What is the catch?
    options:
      - "It breaks lazy loading entirely, forcing both collections to be fetched eagerly on every single load"
      - "`Set` collections cannot be persisted by Hibernate unless you also declare an explicit `@OrderColumn`"
      - "It silently drops the rows of one collection, so the second `Set` always comes back completely empty"
      - "It avoids the exception but you still pay the Cartesian product in transferred rows — it's not a real performance fix"
    answer: 3
    explanation: |
      Using `Set` lets Hibernate accept the double fetch (a Set de-duplicates), but the
      SQL still returns N×M rows over the wire before de-duplication. The scalable fix is
      to fetch at most one collection per query, or batch-fetch the others.
    ref: "concepts.md#multiplebagfetchexception-and-cartesian-products"

  - id: performance-tuning-pitfalls-022
    difficulty: advanced
    tags: [pagination, hhh000104, collection-fetch]
    question: |
      What does the warning `HHH000104: firstResult/maxResults specified with collection
      fetch; applying in memory!` mean?
    options:
      - "Hibernate cached the whole paginated result set in the second-level cache so later pages skip the database"
      - "The query exceeded `hibernate.max_fetch_depth`, so Hibernate silently truncated the join and paged locally"
      - "Pagination was disabled for this query because the collection join clears the `firstResult` offset entirely"
      - "Hibernate fetched the entire joined result set and applied the limit in Java, because a collection join produces multiple rows per root entity"
    answer: 3
    explanation: |
      With a collection `JOIN FETCH`, SQL `LIMIT` can't map to a whole number of root
      entities, so Hibernate reads all rows and paginates in memory — a latent OOM on
      large tables. Page the parent ids first, then fetch children by id-set.
    ref: "concepts.md#pagination-with-collection-fetch-hhh000104"

  - id: performance-tuning-pitfalls-023
    difficulty: advanced
    tags: [pagination, two-query, fix]
    question: |
      What is the correct way to paginate a query that also needs a child collection?
    options:
      - "Add `setMaxResults` to the `JOIN FETCH` query so the database applies a correct row-count LIMIT"
      - "Page the parent ids in one query (DB-side LIMIT), then fetch children with `where parent.id in :ids` and `JOIN FETCH` in a second query"
      - "Load all parents and their children eagerly, then take a `subList` of the desired page in Java memory"
      - "Mark the collection EAGER and rely on `hibernate.max_fetch_depth` to bound the joined rows per page"
    answer: 1
    explanation: |
      The two-query approach paginates the roots on the database (no collection join),
      then fetches the collections for exactly that id set — avoiding both the Cartesian
      product and the in-memory paging of HHH000104.
    ref: "concepts.md#pagination-with-collection-fetch-hhh000104"

  - id: performance-tuning-pitfalls-024
    difficulty: intermediate
    tags: [batch-loop, persistence-context, memory]
    question: |
      In a loop persisting 1,000,000 entities, why does throughput degrade and memory
      grow if you never call `clear()`?
    options:
      - "The JDBC driver leaks a pooled connection on each insert until the pool is fully exhausted mid-loop"
      - "Hibernate opens and commits a brand-new transaction for every single row, so overhead climbs linearly"
      - "The persistence context retains every managed entity plus a dirty-check snapshot, so it grows unbounded and each flush re-scans all of them"
      - "The second-level cache fills with every inserted entity and is never evicted during the loop"
    answer: 2
    explanation: |
      The first-level cache keeps all managed entities and their snapshots for the
      transaction. It grows without bound (memory) and every flush dirty-checks the whole
      set (O(n) per flush → O(n²)). Flush and clear at each batch boundary.
    ref: "concepts.md#managing-the-persistence-context-in-batch-loops"

  - id: performance-tuning-pitfalls-025
    difficulty: intermediate
    tags: [batch-loop, flush, clear]
    question: |
      In the canonical batch-insert loop, what do `em.flush()` and `em.clear()` do at the
      batch boundary?
    options:
      - "`flush()` commits the transaction and starts a new one; `clear()` rolls back only the most recent batch"
      - "Both are no-op hints that Hibernate silently ignores whenever JDBC statement batching is enabled"
      - "`flush()` evicts the second-level cache region; `clear()` resets the pooled JDBC connection to autocommit"
      - "`flush()` pushes pending SQL to the DB (without committing); `clear()` detaches managed entities so they can be GC'd and are no longer dirty-checked"
    answer: 3
    explanation: |
      `flush()` synchronizes the pending inserts to the database but does not commit;
      `clear()` detaches all managed entities, freeing memory and shrinking the
      dirty-check set. Together with `batch_size` and a sequence generator this is the
      standard high-throughput write loop.
    ref: "concepts.md#managing-the-persistence-context-in-batch-loops"

  - id: performance-tuning-pitfalls-026
    difficulty: advanced
    tags: [stateless-session, bulk]
    question: |
      What distinguishes a Hibernate `StatelessSession` from a normal `Session`?
    options:
      - "It is strictly read-only and throws an exception if you attempt any insert, update, or delete"
      - "It has no persistence context — no first-level cache, no dirty checking, no cascade, no lazy proxies, no automatic flush"
      - "It automatically enables and populates the second-level cache for every entity it touches"
      - "It opens and commits an independent database transaction after each individual statement it runs"
    answer: 1
    explanation: |
      `StatelessSession` is a thin JDBC wrapper with no persistence context, so memory
      stays flat and there is no snapshot/flush overhead — ideal for one-shot bulk
      ETL. You give up cascade, dirty checking, and the caches, and manage associations
      by hand.
    ref: "concepts.md#statelesssession-for-bulk-work"

  - id: performance-tuning-pitfalls-027
    difficulty: advanced
    tags: [stateless-session, clear, judgment]
    question: |
      Why do you not need periodic `em.clear()` when using a `StatelessSession` for a
      large bulk import?
    options:
      - "Because it has no persistence context to accumulate entities, so nothing builds up to clear"
      - "Because it auto-commits after every row and discards each entity immediately afterward"
      - "Because it stores its managed entities in the second-level cache region instead of a first-level one"
      - "Because the `clear()` method is not implemented on any Hibernate session type at all"
    answer: 0
    explanation: |
      A `StatelessSession` never accumulates managed entities (no L1 cache), so memory
      does not grow with the number of rows and there is nothing to clear. JDBC batching
      still applies for round-trip efficiency.
    ref: "concepts.md#statelesssession-for-bulk-work"

  - id: performance-tuning-pitfalls-028
    difficulty: advanced
    tags: [query-cache, misuse, n-plus-one]
    question: |
      Why can enabling only the query cache (without also L2-caching the entities)
      re-introduce N+1?
    options:
      - "The query cache stores the full materialized result set, roughly doubling the heap the query uses"
      - "The query cache silently invalidates and empties the first-level cache on every cache hit it serves"
      - "The query cache stores only entity ids; on a hit it then loads each entity, so without those entities in L2 it fires one SELECT per id"
      - "The query cache disables `JOIN FETCH`, forcing every cached association back to lazy loading"
    answer: 2
    explanation: |
      A query-cache hit returns a list of ids, and Hibernate then hydrates each entity —
      hitting L2 if cached, otherwise the database, one per id. Enabling the query cache
      alone is a classic footgun; also cache the referenced entities.
    ref: "concepts.md#second-level-and-query-cache-misuse"

  - id: performance-tuning-pitfalls-029
    difficulty: intermediate
    tags: [second-level-cache, misuse]
    question: |
      Which data is the WORST candidate for the second-level cache?
    options:
      - "Rarely-changing reference and lookup data"
      - "Hot, write-heavy entities that change constantly"
      - "Immutable application configuration entities"
      - "Static country and currency code lookup tables"
    answer: 1
    explanation: |
      Volatile write-heavy entities cause constant cache invalidation churn, so the L2
      cache costs more than it saves. Cache read-mostly reference data, not hot mutable
      rows. Cache mechanics live in `hibernate-jpa/caching-first-second-level`.
    ref: "concepts.md#second-level-and-query-cache-misuse"

  - id: performance-tuning-pitfalls-030
    difficulty: intermediate
    tags: [version, optimistic-locking, misuse]
    question: |
      Which is a misuse of the JPA `@Version` optimistic-locking field?
    options:
      - "Letting the provider manage it and adding `WHERE version = ?` to updates automatically"
      - "Setting the version field manually in application code"
      - "Retrying the whole transaction with a fresh read on `OptimisticLockException`"
      - "Returning the version to the client and sending it back on update"
    answer: 1
    explanation: |
      The `@Version` field is provider-managed; setting it yourself corrupts the
      concurrency check. Hibernate increments it and adds it to the update's WHERE clause,
      throwing `OptimisticLockException` when zero rows match.
    ref: "concepts.md#optimistic-locking-and-version-misuse"

  - id: performance-tuning-pitfalls-031
    difficulty: advanced
    tags: [optimistic-vs-pessimistic, locking, judgment]
    question: |
      When is optimistic locking (`@Version`) preferable to pessimistic locking
      (`PESSIMISTIC_WRITE`)?
    options:
      - "Always, because pessimistic locking was removed from the JPA specification in version 2.1"
      - "Only for strictly read-only transactions, since `@Version` cannot participate in any write path"
      - "Whenever you need `SELECT ... FOR UPDATE` semantics, which `@Version` acquires more cheaply"
      - "Under low-to-moderate contention, because it holds no DB lock and scales, retrying on the rare conflict"
    answer: 3
    explanation: |
      Optimistic locking holds no DB row lock — it checks the version at update time — so
      it scales well when conflicts are rare; you retry the occasional failure.
      Pessimistic locks serialize access and risk deadlocks; reserve them for genuinely
      high contention. Lock/isolation mechanics: `messaging-databases/transactions-isolation`.
    ref: "concepts.md#optimistic-locking-and-version-misuse"

  - id: performance-tuning-pitfalls-032
    difficulty: intermediate
    tags: [bulk-update, jpql, orm-limits]
    question: |
      You must set `archived = true` on 5 million rows. What is the right approach?
    options:
      - "Load all 5M rows as managed entities and set the flag inside a single dirty-checked loop"
      - "Call `findAll()` to materialize every row, then persist them back with a batched `saveAll()`"
      - "Execute a bulk JPQL update (`update Post p set p.archived = true where ...`), which compiles to a single SQL UPDATE"
      - "Enable the second-level cache and iterate over the entities so each write is cached first"
    answer: 2
    explanation: |
      A set-based bulk JPQL (or native) UPDATE runs one SQL statement server-side, rather
      than loading millions of entities. Note it bypasses the persistence context and
      cascade, so `em.clear()` afterward and it won't run `@PreUpdate`.
    ref: "concepts.md#using-an-orm-for-bulk-and-reporting"

  - id: performance-tuning-pitfalls-033
    difficulty: advanced
    tags: [bulk-update, persistence-context, gotcha]
    question: |
      What important caveat applies to a bulk JPQL `update`/`delete`?
    options:
      - "It cannot use a WHERE clause, so it must always rewrite every row in the target table"
      - "It automatically clears the second-level cache and resets the entire connection pool afterward"
      - "It requires an explicit pessimistic write lock to be held on the whole table before it runs"
      - "It bypasses the persistence context and cascade, so already-managed entities go stale and lifecycle callbacks like `@PreUpdate` do not fire"
    answer: 3
    explanation: |
      Bulk JPQL operations execute directly in SQL, skipping the persistence context —
      managed entities become stale (call `em.clear()`), no cascade occurs, and entity
      lifecycle callbacks do not run. Understand these trade-offs before using them.
    ref: "concepts.md#using-an-orm-for-bulk-and-reporting"

  - id: performance-tuning-pitfalls-034
    difficulty: intermediate
    tags: [reporting, native-sql, judgment]
    question: |
      For a complex analytical report with multi-way joins, window functions, and
      aggregations, what is the most appropriate tool?
    options:
      - "Map every joined table to entities and navigate the whole object graph in memory"
      - "EAGER fetch all associations so the aggregations resolve during entity hydration"
      - "Native SQL (or a library like jOOQ) projecting into DTOs"
      - "The query cache, relying on cached result sets to serve the report repeatedly"
    answer: 2
    explanation: |
      Reporting maps poorly to entity graphs and invites over-fetching. Native SQL or
      jOOQ projecting to DTOs is the right tool; the ORM is for object graphs you intend
      to manipulate. Set-based SQL semantics live in `messaging-databases`.
    ref: "concepts.md#using-an-orm-for-bulk-and-reporting"

  - id: performance-tuning-pitfalls-035
    difficulty: beginner
    tags: [measuring, statistics]
    question: |
      Which setting exposes query counts, cache hit ratios, and flush counts so you can
      measure how many queries a request issues?
    options:
      - "`hibernate.generate_statistics=true`"
      - "`hibernate.hbm2ddl.auto=update`"
      - "`hibernate.jdbc.batch_size=50`"
      - "`hibernate.default_batch_fetch_size=16`"
    answer: 0
    explanation: |
      `hibernate.generate_statistics=true` populates a `Statistics` object with query
      counts, cache hit/miss ratios, entity load counts, and flush counts — the primary
      "how many queries did that run?" tool. Measure before you tune.
    ref: "concepts.md#measuring-before-tuning"

  - id: performance-tuning-pitfalls-036
    difficulty: intermediate
    tags: [measuring, logging, best-practice]
    question: |
      What is the recommended way to see the SQL Hibernate generates in a production-safe
      manner?
    options:
      - "Set `hibernate.show_sql=true`, which writes unformatted SQL straight to System.out"
      - "Set the `org.hibernate.SQL` logger to DEBUG so output honors the logging framework"
      - "Enable the second-level cache statistics, which log each generated statement as a side effect"
      - "Use `hibernate.hbm2ddl.auto=create`, which prints the SQL as it regenerates the schema"
    answer: 1
    explanation: |
      `show_sql=true` writes unformatted output straight to System.out, bypassing the
      logging framework. Configure the `org.hibernate.SQL` logger (and
      `org.hibernate.orm.jdbc.bind` for parameters in Hibernate 6+) so it respects levels
      and appenders.
    ref: "concepts.md#measuring-before-tuning"

  - id: performance-tuning-pitfalls-037
    difficulty: advanced
    tags: [measuring, regression, testing]
    question: |
      How can you prevent an N+1 regression from silently slipping into the codebase?
    options:
      - "Assert on the statement count in a test (e.g. via `Statistics` or datasource-proxy) so the build fails when a method suddenly issues many queries"
      - "Enable `spring.jpa.open-in-view=true` so lazy loads always succeed during rendering, which stops any N+1 from ever reaching the database"
      - "Set `hibernate.jdbc.batch_size` to a very high value like 10000 so read queries are automatically coalesced into a single round-trip"
      - "Turn on the query cache in the test profile so repeated selects are served from memory and the extra N+1 queries never actually execute"
    answer: 0
    explanation: |
      A test that asserts the number of prepared statements a method issues will fail the
      build if a change introduces N+1. Tools like datasource-proxy or Hibernate
      `Statistics.getPrepareStatementCount()` make this straightforward.
    ref: "concepts.md#measuring-before-tuning"

  - id: performance-tuning-pitfalls-038
    difficulty: intermediate
    tags: [n-plus-one, eager-many-to-one, scenario]
    question: |
      A JPQL query `select c from Comment c` runs and then fires one extra SELECT per
      distinct `post` even though you wrote no loop. What is the cause?
    options:
      - "The query cache is enabled, so Hibernate re-validates each cached row against the DB with its own follow-up SELECT"
      - "`setMaxResults` was applied, forcing Hibernate to re-select each row individually to honor the pagination window"
      - "`Comment.post` is `@ManyToOne` with default EAGER fetch, so JPQL loads each parent with a secondary select"
      - "Second-level cache miss on every row triggers a compensating per-row SELECT to repopulate the cache region"
    answer: 2
    explanation: |
      `@ManyToOne` defaults to EAGER; JPQL does not auto-join EAGER associations, so
      Hibernate issues a secondary SELECT per referenced parent — N+1. Make it LAZY and
      `JOIN FETCH` when needed.
    ref: "concepts.md#the-n1-problem-and-the-fix-menu"

  - id: performance-tuning-pitfalls-039
    difficulty: advanced
    tags: [flush, over-flushing, gotcha]
    question: |
      Why is calling `flush()` frequently inside a tight loop (without `clear()`) the
      worst of both worlds?
    options:
      - "Each flush commits the pending work in its own nested transaction, so the rows become permanent and can no longer be rolled back on error"
      - "Each flush re-runs a full dirty-check scan over an ever-growing persistence context, so cost climbs while memory still grows"
      - "Each flush resets `hibernate.jdbc.batch_size` back to zero, silently disabling JDBC statement batching for the remainder of the loop"
      - "Each flush eagerly initializes every lazy association on the managed entities, adding a cascade of secondary SELECTs to the loop"
    answer: 1
    explanation: |
      Flushing does not shrink the context; without `clear()` the managed set keeps
      growing, and every flush dirty-checks all of it. Flush and clear together at the
      batch boundary. Flush timing/modes: `hibernate-jpa/transactions-dirty-checking-flushing`.
    ref: "concepts.md#managing-the-persistence-context-in-batch-loops"

  - id: performance-tuning-pitfalls-040
    difficulty: intermediate
    tags: [subselect-fetch, fetch]
    question: |
      What does `@Fetch(FetchMode.SUBSELECT)` do for a collection on a large result set?
    options:
      - "Loads each collection with its own SELECT per parent, firing one round-trip for every row in the result set"
      - "Loads the collections for all parents with one extra query that re-runs the parent query as a subselect"
      - "Merges two separate collection fetch joins into a single flattened join, sidestepping `MultipleBagFetchException`"
      - "Disables lazy loading for the collection so it is always hydrated eagerly alongside its owning parent entity"
    answer: 1
    explanation: |
      SUBSELECT fetches all the collections in a single additional query whose WHERE
      re-uses the original query as a subselect (`where parent_id in (select id from ...)`),
      turning N secondary selects into one.
    ref: "concepts.md#the-n1-problem-and-the-fix-menu"

  - id: performance-tuning-pitfalls-041
    difficulty: advanced
    tags: [checklist, review, judgment]
    question: |
      During a code review you see `@OneToMany(fetch = FetchType.EAGER)` on an entity with
      a large collection, plus `spring.jpa.open-in-view=true`. Which is the best
      recommendation?
    options:
      - "Leave the collection EAGER but disable OSIV only, relying on the eager fetch to keep the view layer from ever touching a closed session"
      - "Make the collection LAZY, disable OSIV, and fetch per use case with JOIN FETCH/@EntityGraph or @BatchSize"
      - "Add a second EAGER collection so both load together in one pass, amortizing the fetch cost across the two associations"
      - "Enable the second-level query cache to compensate, so the repeated eager loads are served from memory after the first request"
    answer: 1
    explanation: |
      EAGER collections and OSIV are both N+1 / over-fetch enablers. The senior fix is
      LAZY by default, OSIV off, and explicit per-query fetching so each endpoint loads
      exactly what it needs.
    ref: "concepts.md#anti-pattern-checklist"

  - id: performance-tuning-pitfalls-042
    difficulty: expert
    tags: [scenario, batching, identity, diagnosis]
    question: |
      You set `hibernate.jdbc.batch_size=50` and `order_inserts=true`, but statistics show
      one JDBC statement per inserted row. The entity uses `@GeneratedValue(strategy =
      IDENTITY)`. What is the most likely cause and fix?
    options:
      - "The batch size of 50 is too small to trigger the batch code path; raise `hibernate.jdbc.batch_size` to 500 or more and the inserts will coalesce"
      - "IDENTITY disables insert batching because the key is read back per INSERT; switch to a SEQUENCE generator with a pooled optimizer"
      - "`order_inserts=true` actually breaks batching by reshuffling statement order; set it to `false` so Hibernate keeps the natural insert sequence and can batch"
      - "JDBC insert batching only engages once the entities are registered in the second-level cache; enable `hibernate.cache.use_second_level_cache=true`"
    answer: 1
    explanation: |
      IDENTITY forces Hibernate to execute each INSERT immediately to obtain the generated
      key, so it cannot batch regardless of `batch_size`/`order_inserts`. Switching to
      SEQUENCE (pooled) lets it allocate ids up front and batch the inserts.
    ref: "concepts.md#why-identity-generation-disables-insert-batching"

  - id: performance-tuning-pitfalls-043
    difficulty: expert
    tags: [scenario, hashset, equals-hashcode, diagnosis]
    question: |
      New `OrderItem` entities are added to an `order.getItems()` `HashSet`, then the order
      is persisted. Later `items.contains(savedItem)` returns false even though the item is
      in the set. `hashCode()` returns `Objects.hash(id)`. What happened?
    options:
      - "On persist Hibernate swapped the `HashSet` for a `PersistentBag`, which ignores `hashCode()` and does a linear identity scan that misses the item"
      - "`contains()` is unreliable on managed entities because Hibernate routes it through the proxy interceptor, which compares database rows rather than objects"
      - "The enclosing transaction rolled back silently on flush, so `savedItem` was detached and its membership in the in-memory set was quietly discarded"
      - "The id was null (hash of null) when added and changed after persist, moving the item's bucket so `contains()` can't find it"
    answer: 3
    explanation: |
      The classic detached-entity-in-a-HashSet bug: id-based hashCode is unstable across
      the transient→managed transition. When persist assigns the id, the hash changes and
      the element is now in the wrong bucket. Base equals/hashCode on a business key or a
      constructor-assigned UUID.
    ref: "concepts.md#equals-and-hashcode-on-entities"

  - id: performance-tuning-pitfalls-044
    difficulty: expert
    tags: [scenario, pagination, collection-fetch, oom, diagnosis]
    question: |
      A repository method does `select p from Post p join fetch p.comments` with a
      `Pageable`. It works in dev but OOMs in production with log line HHH000104. Why?
    options:
      - "Production simply has less heap configured than dev; the query itself is fine and only needs a larger `-Xmx` to stop OOMing"
      - "The collection fetch join means Hibernate can't apply SQL LIMIT to entities, so it loads the entire result set and paginates in memory — huge in prod"
      - "Spring Data pagination requires the second-level cache to be enabled in production to store the page offsets; without it every page reloads fully"
      - "`join fetch` is not supported together with a `Pageable`, so Hibernate silently ignores the page size and returns the whole unbounded collection"
    answer: 1
    explanation: |
      A collection fetch join produces multiple rows per root, so SQL LIMIT can't map to a
      whole number of entities; Hibernate fetches everything and paginates in memory
      (HHH000104). Fine on a tiny dev dataset, catastrophic in prod. Page ids first, then
      fetch children by id-set.
    ref: "concepts.md#pagination-with-collection-fetch-hhh000104"

  - id: performance-tuning-pitfalls-045
    difficulty: intermediate
    tags: [default-batch-fetch-size, global, fix]
    question: |
      What does the global setting `hibernate.default_batch_fetch_size=16` accomplish?
    options:
      - "Batches up to 16 lazy associations/entities per `IN (?,?,…)` query instead of one query each — a global N+1 mitigation"
      - "Limits every query result to a maximum of 16 rows unless the query explicitly overrides it with its own `setMaxResults`"
      - "Sets the JDBC insert/update statement batch size to 16, equivalent to configuring `hibernate.jdbc.batch_size=16` for writes"
      - "Retains the 16 most recently executed queries in the second-level query cache, evicting older entries in LRU order"
    answer: 0
    explanation: |
      `default_batch_fetch_size` applies batch fetching globally: when initializing lazy
      references, Hibernate loads them in batches (e.g. `where id in (?,?,…16)`), reducing
      N+1 without per-association `@BatchSize`.
    ref: "concepts.md#the-n1-problem-and-the-fix-menu"

  - id: performance-tuning-pitfalls-046
    difficulty: advanced
    tags: [query-cache, invalidation, misuse]
    question: |
      Why is the query cache a poor fit for queries against a frequently-written table?
    options:
      - "The query cache only works with native SQL statements, so JPQL queries against the table are never eligible for caching at all"
      - "Any write to the table invalidates all cached queries touching it, so the cache stays perpetually cold"
      - "The query cache requires a pessimistic write lock on the table for every cached read, which serializes access under write load"
      - "Query results containing more than one row cannot be cached, so any multi-row list query silently bypasses the cache entirely"
    answer: 1
    explanation: |
      The query cache is invalidated per table on any modification, so on a hot table it
      is constantly invalidated and rarely hits. Cache read-mostly data, and remember it
      only helps when the referenced entities are also L2-cached.
    ref: "concepts.md#second-level-and-query-cache-misuse"

  - id: performance-tuning-pitfalls-047
    difficulty: intermediate
    tags: [streaming, large-result-set, judgment]
    question: |
      How should you process a very large read result set without materializing it all in
      memory?
    options:
      - "Call `getResultList()` and iterate over it, relying on the JDBC driver to transparently page rows in behind the list"
      - "Enable the second-level cache so the large result set is offloaded from the heap into the shared cache region"
      - "Stream/scroll the results with periodic `em.clear()`, or use a `StatelessSession`"
      - "Increase `hibernate.jdbc.batch_size` so the read is fetched in bounded batches that never all reside in memory at once"
    answer: 2
    explanation: |
      `getResultList()` loads everything into memory and the persistence context. Use a
      scrollable/`Stream` result with periodic `clear()` to keep the context small, or a
      `StatelessSession` which has no context at all.
    ref: "concepts.md#statelesssession-for-bulk-work"

  - id: performance-tuning-pitfalls-048
    difficulty: expert
    tags: [scenario, diagnosis, n-plus-one, method]
    question: |
      An endpoint that returns a 50-row page issues over 200 SELECTs and got slower as
      data grew. What is the most efficient diagnostic-then-fix path?
    options:
      - "Add a much bigger connection pool so the 200 SELECTs run concurrently, then move on without changing the query itself"
      - "Turn on `spring.jpa.open-in-view=true` so the lazy loads succeed during rendering, which collapses the extra SELECTs automatically"
      - "Mark all of the entity's associations EAGER so everything the page needs is fetched in the initial query up front"
      - "Enable statistics/SQL logging, confirm query count scales with rows (N+1), then replace the per-row lazy access with one JOIN FETCH/@EntityGraph or batch fetch"
    answer: 3
    explanation: |
      Query count proportional to row count is the N+1 signature. Measure first
      (statistics/SQL log), then fix at the query level with JOIN FETCH/@EntityGraph or
      batch fetching. OSIV and EAGER hide or worsen the problem rather than fixing it.
    ref: "concepts.md#the-n1-problem-and-the-fix-menu"

  - id: performance-tuning-pitfalls-049
    difficulty: expert
    tags: [read-only, dirty-checking, snapshot, mechanism]
    question: |
      Setting the Hibernate `readOnly` hint on a query that returns managed entities makes
      it faster and lighter. What is the underlying mechanism?
    options:
      - "It transparently routes the query to a configured read replica, so the primary is offloaded and the query returns faster"
      - "Hibernate skips taking the dehydrated loaded-state snapshot, so there is no dirty-check comparison at flush and ~half the per-entity memory"
      - "It stores the returned rows in the second-level cache region, so subsequent reads of the same entities skip the database"
      - "It converts the managed entities into lightweight interface projections on the fly, dropping the columns the query did not reference"
    answer: 1
    explanation: |
      A normally-loaded managed entity keeps a second copy of its attribute values (the
      loaded/dehydrated snapshot) so Hibernate can dirty-check it at flush. The `readOnly`
      hint tells Hibernate not to take that snapshot: no dirty checking and roughly half
      the memory per entity. It does not touch replicas, caches, or projections.
    ref: "concepts.md#read-only-optimization-and-the-dirty-check-snapshot"

  - id: performance-tuning-pitfalls-050
    difficulty: expert
    tags: [read-only, transactional, flush-mode, distinction]
    question: |
      What is the difference between `@Transactional(readOnly = true)` and Hibernate's
      `readOnly` query hint (`HibernateHints.HINT_READ_ONLY`)?
    options:
      - "They are identical aliases for the same underlying setting, so applying either one has exactly the same effect on flushing and snapshots"
      - "`@Transactional(readOnly=true)` takes the snapshot but skips flush; the hint skips flush but keeps the snapshot"
      - "`@Transactional(readOnly=true)` sets FlushMode to MANUAL (no auto-flush); the hint additionally stops the loaded-state snapshot from being taken at all"
      - "The Hibernate hint always opens a brand-new physical transaction for the query while `@Transactional(readOnly=true)` reuses whichever transaction is already in progress"
    answer: 2
    explanation: |
      `@Transactional(readOnly=true)` is a Spring concern that sets Hibernate's FlushMode
      to MANUAL, so no auto-flush fires — but the entities are still loaded with their
      dirty-check snapshot. The Hibernate `readOnly` hint additionally suppresses the
      snapshot entirely, which is where the memory/CPU win comes from.
    ref: "concepts.md#read-only-optimization-and-the-dirty-check-snapshot"

  - id: performance-tuning-pitfalls-051
    difficulty: expert
    tags: [read-only, memory, scenario, diagnosis]
    question: |
      A GET endpoint that loads full entities uses roughly twice the heap of the POST
      endpoint that writes the same rows. What is the most likely cause and the best fix?
    options:
      - "The GET path runs at SERIALIZABLE isolation, which buffers extra row versions in memory; lower it to READ_COMMITTED to halve the heap"
      - "The connection pool is sized too large on the read path, so idle connections pin per-connection buffers; shrink the pool to cut the heap in half"
      - "The query cache is double-storing every returned row alongside the managed copy; disable `hibernate.cache.use_query_cache` to reclaim the memory"
      - "Managed entities retain their dirty-check snapshot; add the readOnly hint, or better, return a DTO projection that never selects the extra state"
    answer: 3
    explanation: |
      Every managed entity keeps a loaded-state snapshot for dirty checking — roughly
      doubling per-entity memory. On a pure read that snapshot is dead weight. The
      `readOnly` hint skips it; a DTO projection avoids materializing entities at all and
      is lighter still. Isolation, pool size, and query cache are not the cause here.
    ref: "concepts.md#read-only-optimization-and-the-dirty-check-snapshot"

  - id: performance-tuning-pitfalls-052
    difficulty: advanced
    tags: [query-plan-cache, compilation, mechanism]
    question: |
      What does the `hibernate.query.plan_cache_max_size` setting (default 2048) bound?
    options:
      - "The number of compiled HQL/JPQL/Criteria query plans (parse + SQL translation) cached and reused across executions"
      - "The maximum number of rows any single query is permitted to return before Hibernate truncates the result set"
      - "The JDBC statement batch size used for inserts and updates, equivalent to `hibernate.jdbc.batch_size` for the write path"
      - "The maximum number of managed entities the first-level persistence-context cache will hold before evicting the oldest"
    answer: 0
    explanation: |
      Compiling a JPQL/Criteria query to the SQM tree and then to SQL is expensive, so
      Hibernate caches the resulting plan keyed by the query, in a bounded LRU of default
      size 2048. It is unrelated to result-set size, JDBC batching, or the L1 cache.
    ref: "concepts.md#query-plan-cache-and-in-clause-parameter-padding"

  - id: performance-tuning-pitfalls-053
    difficulty: advanced
    tags: [in-clause-padding, plan-cache, mechanism]
    question: |
      What does `hibernate.query.in_clause_parameter_padding=true` do?
    options:
      - "Adds indentation and whitespace padding to the generated SQL string purely so IN clauses are easier to read in the logs"
      - "Caps the number of bind parameters permitted inside a single IN clause, rejecting lists that exceed the configured limit"
      - "Pads the bind-parameter count of an IN clause up to the next power of two so many different list sizes share one SQL string and plan-cache entry"
      - "Splits a large IN list into several smaller batched queries that are executed separately and their results merged"
    answer: 2
    explanation: |
      Padding rounds the IN parameter count up to the next power of two (3 or 4 -> 4;
      5..8 -> 8), repeating the last value in the extra slots. Distinct list sizes then
      collapse onto a handful of SQL strings, improving reuse of both Hibernate's plan
      cache and the database's execution-plan cache.
    ref: "concepts.md#query-plan-cache-and-in-clause-parameter-padding"

  - id: performance-tuning-pitfalls-054
    difficulty: expert
    tags: [in-clause-padding, defaults, spring-boot, misconception]
    question: |
      Regarding `hibernate.query.in_clause_parameter_padding`, which statement is correct?
    options:
      - "It is enabled by default in plain Hibernate 6, so IN-clause bind counts are already power-of-two padded and you never need to set it"
      - "It is disabled by default in plain Hibernate, and Spring Boot does NOT auto-enable it — you must set it explicitly"
      - "Spring Boot pins it to false during auto-configuration and locks it, so an explicit property override in application.yaml has no effect"
      - "It applies only to native SQL queries and is silently ignored for HQL/JPQL and Criteria IN clauses, which are never padded"
    answer: 1
    explanation: |
      The padding option defaults to false in Hibernate, and contrary to a common myth
      Spring Boot does not turn it on (Boot only defaults naming strategies and ddl-auto).
      Enable it via `spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true`.
      It applies to HQL/JPQL/Criteria IN clauses, not just native SQL.
    ref: "concepts.md#query-plan-cache-and-in-clause-parameter-padding"

  - id: performance-tuning-pitfalls-055
    difficulty: expert
    tags: [plan-cache, in-clause, scenario, diagnosis]
    question: |
      After a deploy changed a fixed-size filter into a variable-length `IN (:ids)` list,
      the same endpoint became intermittently slow and DB CPU rose. What best explains it?
    options:
      - "The variable-length IN list forces a full table scan because the optimizer cannot use a b-tree index for multi-value equality predicates"
      - "Each new IN-list size evicts the first-level persistence-context cache, so the entities get re-hydrated from the database on every request"
      - "Hibernate silently upgrades any query carrying an IN clause to PESSIMISTIC_WRITE, so the matched rows are row-locked for the whole transaction"
      - "Each distinct parameter count is a new SQL string -> new plan-cache key, causing recompilation and cold database execution plans; enable IN-clause padding"
    answer: 3
    explanation: |
      `in (?)`, `in (?,?)`, `in (?,?,?)` are different SQL strings, so each list size
      thrashes Hibernate's plan cache and the DB's plan cache (recompilation + cold plans).
      IN-clause parameter padding collapses them into power-of-two sizes, restoring reuse.
    ref: "concepts.md#query-plan-cache-and-in-clause-parameter-padding"

  - id: performance-tuning-pitfalls-056
    difficulty: expert
    tags: [bytecode-enhancement, lazy-basic, mechanism]
    question: |
      A developer annotates a large column `@Basic(fetch = FetchType.LAZY)` but the column
      is still fetched on every load. What is the most likely reason?
    options:
      - "Lazy basic attributes require build-time bytecode enhancement; without the enhancer the LAZY hint on a basic attribute is silently ignored"
      - "`@Basic(fetch = LAZY)` is only permitted on primitive numeric columns, so Hibernate ignores the hint for any String or LOB attribute mapping"
      - "The second-level cache stores the fully hydrated row, so it overrides the attribute's LAZY fetch type and always serves every mapped column"
      - "LAZY on a `@Basic` attribute only takes effect inside a `@Transactional(readOnly=true)` method where entity dirty checking is disabled"
    answer: 0
    explanation: |
      Proxy-based lazy loading works for associations, not scalar columns. Making a
      `@Basic` attribute lazy needs the field-level interception that bytecode enhancement
      provides (`hibernate-enhance` plugin, enableLazyInitialization). Without it the hint
      is ignored and the column loads eagerly.
    ref: "concepts.md#bytecode-enhancement-and-lazy-attributes"

  - id: performance-tuning-pitfalls-057
    difficulty: advanced
    tags: [bytecode-enhancement, lazy-group, fetch]
    question: |
      With bytecode enhancement enabled, what does `@LazyGroup("audit")` on several lazy
      attributes achieve?
    options:
      - "It stores those attributes in a dedicated named region of the second-level cache so they are read from cache rather than the row"
      - "It reverts the annotated attributes back to eager loading, so they are fetched with the owning entity's primary SELECT after all"
      - "It groups those lazy attributes so they are all fetched together in one SELECT when any is accessed, instead of one query per attribute"
      - "It marks the grouped attributes immutable, so Hibernate skips dirty checking on them and never issues an UPDATE for those columns"
    answer: 2
    explanation: |
      `@LazyGroup` batches lazy basic/association attributes into a group loaded by a
      single secondary SELECT the first time any member is touched, avoiding a separate
      round-trip per lazy attribute. It requires bytecode enhancement.
    ref: "concepts.md#bytecode-enhancement-and-lazy-attributes"

  - id: performance-tuning-pitfalls-058
    difficulty: expert
    tags: [bytecode-enhancement, dirty-tracking, flush]
    question: |
      How does bytecode-enhancement `enableDirtyTracking` reduce flush cost compared with
      the default dirty-check?
    options:
      - "It disables auto-flush entirely so that no dirty-check ever runs until the transaction finally commits at the very end"
      - "It moves the dirty-check work into the database through per-column triggers that flag which rows changed since the last read"
      - "It offloads each entity's loaded-state snapshot into an external cache like Redis so the local heap no longer holds it"
      - "The enhanced entity records which of its own fields were modified, so flush queries the entity instead of comparing every field against a snapshot"
    answer: 3
    explanation: |
      Default dirty checking compares the current state against the loaded snapshot field
      by field (O(fields) per entity). Self-dirty-tracking entities remember their changed
      fields, so flush just asks the entity what changed — cheaper on wide entities and an
      alternative to relying on a full snapshot scan.
    ref: "concepts.md#bytecode-enhancement-and-lazy-attributes"

  - id: performance-tuning-pitfalls-059
    difficulty: intermediate
    tags: [immutable, dirty-checking]
    question: |
      What effect does annotating a read-only reference entity with `@Immutable` have?
    options:
      - "It automatically registers the entity in the second-level cache and pins it in a read-only region for the SessionFactory's lifetime"
      - "Hibernate skips dirty checking for it entirely and never generates an UPDATE; modifications are ignored"
      - "It switches all of the entity's associations to EAGER fetching so the whole read-only graph loads in the initial query"
      - "It enables optimistic locking automatically by adding an implicit `@Version` column that guards every write to the entity"
    answer: 1
    explanation: |
      `@Immutable` tells Hibernate the entity never changes, so it takes no dirty-check
      snapshot and emits no UPDATE — ideal for static reference data. It does not force
      caching, change fetch types, or add versioning.
    ref: "concepts.md#immutable-dynamicupdate-and-dynamicinsert-trade-offs"

  - id: performance-tuning-pitfalls-060
    difficulty: expert
    tags: [dynamic-update, batching, trade-off]
    question: |
      You add `@DynamicUpdate` to a wide entity, and afterward statistics show inserts
      still batch but updates no longer batch. Why?
    options:
      - "@DynamicUpdate resets `hibernate.jdbc.batch_size` to zero across the whole SessionFactory, disabling statement batching for every entity type"
      - "@DynamicUpdate forces the entity onto IDENTITY id generation, which reads the key back per row and therefore cannot batch"
      - "@DynamicUpdate generates a different UPDATE string per changed-column set, so consecutive updates are no longer identical SQL and cannot share a JDBC batch"
      - "@DynamicUpdate switches the entity to PESSIMISTIC_WRITE locking, so each update takes a row lock that serializes the writes one at a time"
    answer: 2
    explanation: |
      JDBC batching requires consecutive statements to be the exact same SQL string.
      `@DynamicUpdate` narrows each UPDATE to only the columns that changed, so rows with
      different changed columns produce different SQL and break the batch (and multiply
      plan-cache entries). It is a real trade-off against the wide-table write win.
    ref: "concepts.md#immutable-dynamicupdate-and-dynamicinsert-trade-offs"

  - id: performance-tuning-pitfalls-061
    difficulty: intermediate
    tags: [dynamic-update, sql-generation]
    question: |
      Without `@DynamicUpdate`, how does Hibernate generate the UPDATE for a dirty entity?
    options:
      - "One static UPDATE that sets all mapped columns, regardless of which changed"
      - "One separate UPDATE statement per changed column, each setting a single column in its own round-trip to the database"
      - "No UPDATE at all — it issues a DELETE followed by a fresh INSERT of the whole row so every column is rewritten from scratch"
      - "A MERGE statement it computes at runtime, matching on the primary key and updating only the columns whose values it detects as dirty"
    answer: 0
    explanation: |
      By default Hibernate uses a single pre-generated UPDATE that assigns every mapped
      column (a cached, batchable SQL string). `@DynamicUpdate` opts into per-flush SQL
      that sets only the changed columns, trading batching/plan-cache reuse for narrower
      writes.
    ref: "concepts.md#immutable-dynamicupdate-and-dynamicinsert-trade-offs"

  - id: performance-tuning-pitfalls-062
    difficulty: expert
    tags: [equals-hashcode, proxy, mechanism]
    question: |
      An entity's `equals` uses `this.getClass() == o.getClass()`. Comparing a lazily
      loaded (proxied) associated entity against an equal, fully loaded instance returns
      false. Why, and what is the fix?
    options:
      - "Hibernate proxies override `equals` to always return false until initialized; the fix is to disable proxy generation with `@Proxy(lazy = false)`"
      - "Calling `getClass()` inside `equals` is disallowed by the JPA spec; you must compare the id fields directly with `==` instead of a class check"
      - "The two objects belong to different persistence contexts, so they compare unequal; the fix is to `merge` one into the other's context first"
      - "Hibernate returns a proxy subclass whose getClass() differs from the real class; use `instanceof` (or `Hibernate.getClass`) instead of getClass() comparison"
    answer: 3
    explanation: |
      A lazy association is a generated proxy subclass, so `getClass()` on it is not the
      real entity class and the `==` check fails. Using `instanceof` (true for subclasses)
      or unproxying both sides with `Hibernate.getClass(...)` makes the comparison correct.
    ref: "concepts.md#entity-proxies-in-equals-and-hashcode"

  - id: performance-tuning-pitfalls-063
    difficulty: expert
    tags: [equals-hashcode, proxy, field-access]
    question: |
      Inside `equals`, you compare ids with `this.id.equals(other.id)` using direct field
      access. When `other` is an uninitialized proxy, the comparison misbehaves. Why?
    options:
      - "Direct field access is illegal on Hibernate-managed entities, which permit reads only through their generated getter and setter methods"
      - "The proxy's `id` field is null because the state lives in the underlying target; you must call `other.getId()` so the proxy's interceptor initializes/returns it"
      - "The id value lives in the second-level cache region rather than on the object, so reading the field returns null until a cache lookup populates it"
      - "`equals` is forbidden from touching the private fields of another instance, so the proxy's id reads back as its uninitialized default value"
    answer: 1
    explanation: |
      A proxy is a shell whose fields are not populated; the real values live in the lazy
      target reached through the interceptor. Direct field access (`other.id`) reads the
      null shell field, while the getter `other.getId()` routes through the interceptor and
      returns the true id. Always use the getter in equals for proxy safety.
    ref: "concepts.md#entity-proxies-in-equals-and-hashcode"

  - id: performance-tuning-pitfalls-064
    difficulty: advanced
    tags: [equals-hashcode, canonical, best-practice]
    question: |
      What is Hibernate's recommended canonical `hashCode()` for an entity whose id is
      database-generated?
    options:
      - "Return `Objects.hash(id)` so that two entities sharing the same database id always hash to the same bucket in a collection"
      - "Return `System.identityHashCode(this)` so each instance keeps a unique, JVM-assigned hash for its whole lifetime"
      - "Return a constant such as `getClass().hashCode()`, so the hash never changes when the id is assigned on persist"
      - "Return a combined hash of every persistent field so that any two entities with identical column values collide in the same bucket"
    answer: 2
    explanation: |
      A constant hashCode (per class) is stable across the transient->managed transition,
      avoiding the moving-bucket bug, while `equals` compares the id only when non-null.
      Id-based hashCode mutates on persist; identity hashCode breaks across sessions;
      all-fields hashCode touches lazy state.
    ref: "concepts.md#entity-proxies-in-equals-and-hashcode"

  - id: performance-tuning-pitfalls-065
    difficulty: advanced
    tags: [testing, n-plus-one, tooling]
    question: |
      Which approach fails a test automatically when a method starts issuing more SELECTs
      than expected (an N+1 regression)?
    options:
      - "Hypersistence Utils `SQLStatementCountValidator.reset()` then `assertSelectCount(1)`, which throws on a mismatch"
      - "Enabling `spring.jpa.open-in-view=true` in the test profile so lazy loads resolve during rendering and the extra SELECTs are counted"
      - "Setting `hibernate.jdbc.batch_size` to a high value in tests so any surplus read queries are coalesced and flagged as a regression"
      - "Turning on the query cache during the test so repeated SELECTs are served from memory and any count increase is surfaced"
    answer: 0
    explanation: |
      `SQLStatementCountValidator` records the statements a block issues and throws
      `SQLStatementCountMismatchException` if the count differs from the assertion — a
      build-failing N+1 guard. OSIV, batch size, and the query cache do not assert counts.
    ref: "concepts.md#detecting-n1-in-tests-and-ci"

  - id: performance-tuning-pitfalls-066
    difficulty: intermediate
    tags: [testing, tooling, datasource-proxy]
    question: |
      What is `datasource-proxy` used for in the context of catching N+1?
    options:
      - "It caches materialized query results across requests so that repeated identical selects are served without touching the database"
      - "It rewrites JPQL into optimized native SQL for the target dialect before the statement is sent to the driver"
      - "It pools and multiplexes database connections more efficiently than the default provider to cut per-query overhead"
      - "It wraps the DataSource to count and inspect executed queries, so tests can assert on the query count"
    answer: 3
    explanation: |
      datasource-proxy decorates the JDBC DataSource (via `ProxyDataSourceBuilder`) and a
      `DataSourceQueryCountListener` captures how many queries ran, enabling
      framework-agnostic assertions. It is not a cache, translator, or pool.
    ref: "concepts.md#detecting-n1-in-tests-and-ci"

  - id: performance-tuning-pitfalls-067
    difficulty: advanced
    tags: [batching, version, batch-versioned-data]
    question: |
      Why might `@Version`ed entity UPDATEs fail to batch even with `hibernate.jdbc.batch_size`
      set, and what setting governs this?
    options:
      - "The presence of a `@Version` column disables statement batching for that entity unconditionally, and there is no property that can re-enable it"
      - "`hibernate.jdbc.batch_versioned_data` must be effectively true; if false (older versions/dialects without reliable batched update counts), versioned updates run per-row"
      - "You must set `hibernate.order_updates=false`, because ordering versioned updates by table prevents them from ever forming a JDBC batch"
      - "Versioned updates can only batch when the entity is registered in the second-level cache, which supplies the row counts the optimistic check needs"
    answer: 1
    explanation: |
      Batched versioned updates rely on the driver reporting per-statement affected-row
      counts so the optimistic-lock check works; where that is unreliable Hibernate falls
      back to per-row execution unless `batch_versioned_data` is true (generally the
      default in Hibernate 6, dialect-dependent).
    ref: "concepts.md#batching-gotchas-beyond-identity"

  - id: performance-tuning-pitfalls-068
    difficulty: expert
    tags: [batching, postgresql, jdbc-url]
    question: |
      With Hibernate batching enabled on PostgreSQL, wire-level captures still show one
      round-trip per inserted row. What driver-level setting produces true multi-row
      insert batching?
    options:
      - "Add `?ssl=true` to the JDBC URL so the encrypted connection coalesces the batched inserts into a single framed round-trip"
      - "Set `hibernate.jdbc.fetch_size=1000` so the driver buffers a thousand inserts before flushing them as one multi-row statement"
      - "Add `reWriteBatchedInserts=true` to the pgJDBC connection URL so the driver rewrites the batch into a multi-values INSERT"
      - "Switch the entity to IDENTITY generation so PostgreSQL assigns keys server-side and can pack the rows into one insert"
    answer: 2
    explanation: |
      pgJDBC only rewrites a batched insert into a single multi-values statement when
      `reWriteBatchedInserts=true` is on the URL; otherwise Hibernate batches at its level
      but the driver still sends one insert per row. It is a real PostgreSQL tuning knob.
      IDENTITY would make things worse by disabling insert batching entirely.
    ref: "concepts.md#batching-gotchas-beyond-identity"

  - id: performance-tuning-pitfalls-069
    difficulty: advanced
    tags: [batching, session-api, hibernate-6]
    question: |
      In Hibernate 6, how can you override the global `hibernate.jdbc.batch_size` for a
      single unit of work?
    options:
      - "Call `session.setJdbcBatchSize(int)` on that Session/StatelessSession"
      - "Re-create the SessionFactory with a new batch size for that unit of work, then close it again once the loop has finished"
      - "Set the `hibernate.jdbc.batch_size` value as a thread-local system property immediately before the loop so it applies only to this thread"
      - "You cannot override it per unit of work; the JDBC batch size is fixed for the SessionFactory at bootstrap and applies to every session"
    answer: 0
    explanation: |
      Hibernate 6 exposes `setJdbcBatchSize(Integer)` on the Session (and StatelessSession),
      letting a specific bulk operation use a different batch size than the global default
      without rebuilding the SessionFactory.
    ref: "concepts.md#batching-gotchas-beyond-identity"

  - id: performance-tuning-pitfalls-070
    difficulty: expert
    tags: [stateless-session, cascade, gotcha]
    question: |
      You switch a bulk import from a flush/clear loop to a `StatelessSession` and notice
      that child rows previously saved by cascade are no longer inserted. Why?
    options:
      - "StatelessSession mandates IDENTITY id generation for the parent, and that strategy skips cascading inserts to any child collections"
      - "StatelessSession auto-commits each parent row immediately and then rolls back the cascaded children as part of that same statement"
      - "StatelessSession treats every association as read-only, so it loads existing children but refuses to insert new ones through a relationship"
      - "StatelessSession has no persistence context and does not cascade or fire events, so you must insert associated entities explicitly"
    answer: 3
    explanation: |
      A StatelessSession is a thin JDBC wrapper: no L1 cache, no dirty checking, no
      cascade, no lifecycle events. Cascade-driven child inserts simply do not happen — you
      must `insert(child)` yourself. JDBC batching still works; Hibernate 6 also adds
      `upsert()`.
    ref: "concepts.md#batching-gotchas-beyond-identity"

  - id: performance-tuning-pitfalls-071
    difficulty: intermediate
    tags: [flush, commit, distinction]
    question: |
      What is the key difference between `EntityManager.flush()` and committing the
      transaction?
    options:
      - "flush() and commit() are two names for the same operation, so calling either one synchronizes the SQL and makes the changes durable"
      - "flush() pushes pending SQL to the DB but does not commit — a rollback can still undo it; commit ends the transaction and makes changes permanent"
      - "flush() is the call that makes changes permanent, while commit() merely synchronizes the pending SQL to the database within the transaction"
      - "flush() detaches all managed entities from the context, whereas commit() leaves them attached and managed after the transaction ends"
    answer: 1
    explanation: |
      flush() synchronizes the persistence context's pending INSERT/UPDATE/DELETE to the
      database within the current transaction; the changes are still uncommitted and a
      rollback undoes them. commit() flushes if needed and then makes the changes durable.
    ref: "concepts.md#session-operation-cheat-sheet-flush-vs-commit-clear-vs-detach"

  - id: performance-tuning-pitfalls-072
    difficulty: advanced
    tags: [clear, detach, distinction]
    question: |
      How does `EntityManager.clear()` differ from `detach(entity)`?
    options:
      - "clear() commits pending changes; detach() rolls them back"
      - "They are the same; clear() is just an alias"
      - "clear() detaches ALL managed entities and empties the context; detach(entity) detaches only that one (cascading per CascadeType.DETACH)"
      - "clear() only affects the second-level cache"
    answer: 2
    explanation: |
      clear() wipes the entire persistence context (every managed entity becomes
      detached), which is what batch loops use to bound memory. detach(entity) removes a
      single entity from management, cascading only per CascadeType.DETACH. Neither commits
      or rolls back.
    ref: "concepts.md#session-operation-cheat-sheet-flush-vs-commit-clear-vs-detach"

  - id: performance-tuning-pitfalls-073
    difficulty: expert
    tags: [clear, flush, gotcha, data-loss]
    question: |
      In a batch loop you call `em.clear()` but forget `em.flush()` before it at the batch
      boundary. What is the consequence?
    options:
      - "Pending changes not yet flushed are discarded when the context is cleared, so those rows are silently never written"
      - "The transaction commits early, making the batch's rows durable so they can no longer be rolled back if a later error occurs"
      - "A LazyInitializationException is thrown the moment clear() detaches entities that still hold uninitialized lazy proxies"
      - "Nothing goes wrong — clear() automatically flushes any pending changes first, so the order of the two calls is irrelevant"
    answer: 0
    explanation: |
      clear() does not flush first; it just detaches everything. Any inserts/updates that
      were not yet flushed to the DB are lost with the context. The correct order is
      flush() then clear() at each batch boundary.
    ref: "concepts.md#session-operation-cheat-sheet-flush-vs-commit-clear-vs-detach"

  - id: performance-tuning-pitfalls-074
    difficulty: expert
    tags: [osiv, autocommit, mechanism]
    question: |
      Beyond hiding N+1, what extra database cost does OSIV incur for lazy loads that
      happen during view/JSON rendering (after the service transaction has committed)?
    options:
      - "They are silently promoted to SERIALIZABLE isolation, so each lazy load takes range locks that cause frequent deadlocks under concurrency"
      - "They bypass the connection pool entirely and open a fresh direct socket to the database for every single lazy association access"
      - "They are served from the second-level cache after the transaction commits, so the lazy loads never actually reach the database at all"
      - "They execute in autocommit mode — each lazy load is its own tiny transaction with its own commit/log flush, adding round-trips and redo/WAL pressure"
    answer: 3
    explanation: |
      Once the request-scoped transaction commits, OSIV keeps the session open and any
      further statements run in autocommit — each becomes a standalone transaction with its
      own commit overhead. That is on top of the hidden N+1 and the long connection-hold
      time through rendering.
    ref: "concepts.md#connection-pool-sizing-and-osiv-under-load"

  - id: performance-tuning-pitfalls-075
    difficulty: advanced
    tags: [osiv, connection-pool, scenario]
    question: |
      Under load, an OSIV-enabled service shows requests timing out waiting for a DB
      connection even though query times are normal. What is happening and the fix?
    options:
      - "The database is deadlocking on lock acquisition; raise the lock timeout so contending statements wait instead of aborting and retrying"
      - "OSIV holds each request's connection through view/serialization, so a small pool starves under concurrency; disable OSIV and size the pool near cores x 2"
      - "The second-level query cache is thrashing on invalidation; disable it so reads go straight to the database and stop blocking"
      - "IDENTITY id generation is serializing every insert on a table lock; switch to a pooled SEQUENCE generator to remove the contention"
    answer: 1
    explanation: |
      With OSIV the connection is held for the whole request including rendering, so under
      concurrency the pool is exhausted and requests queue (connection starvation), not
      slow queries. Disabling OSIV releases the connection at commit; small pools (~cores x
      2) typically outperform large ones. Pool-sizing math lives in reliability-ops.
    ref: "concepts.md#connection-pool-sizing-and-osiv-under-load"

  - id: performance-tuning-pitfalls-076
    difficulty: advanced
    tags: [stateless-session, hibernate-6, upsert]
    question: |
      Which statement about `StatelessSession` in Hibernate 6 is correct?
    options:
      - "It maintains a bounded first-level cache for dirty checking but deliberately opts out of the shared second-level cache"
      - "It cascades persist and merge to associated entities exactly like a normal Session, honoring each CascadeType on the mappings"
      - "It has no first-level cache and, in Hibernate 6, adds an `upsert()` operation alongside insert/update/delete"
      - "It automatically flushes and clears the persistence context every N rows, where N is `hibernate.jdbc.batch_size`"
    answer: 2
    explanation: |
      StatelessSession has no persistence context (no L1 cache), does not cascade or fire
      events, and manages associations by hand. Hibernate 6 added `upsert()`
      (insert-or-update) to its explicit insert/update/delete API. There is nothing to
      flush/clear because nothing accumulates.
    ref: "concepts.md#batching-gotchas-beyond-identity"

  - id: performance-tuning-pitfalls-077
    difficulty: advanced
    tags: [multiple-bag-fetch, hibernate-6, cartesian-product]
    question: |
      In Hibernate 6, fetching two `List` (bag) collections in one JPQL query throws which
      exception, and what is the recommended remedy for the second collection?
    options:
      - "`org.hibernate.loader.MultipleBagFetchException`; fetch one collection per query, or use `default_batch_fetch_size`/`@Fetch(SUBSELECT)` for the second"
      - "`java.sql.SQLException` for a malformed join; switch both collections to EAGER so Hibernate resolves them in the primary select"
      - "`org.hibernate.LazyInitializationException`; enable OSIV so the second bag initializes lazily during view rendering instead"
      - "`jakarta.persistence.NonUniqueResultException`; add `distinct` to the query so the duplicated bag rows collapse to a single result"
    answer: 0
    explanation: |
      Fetching multiple bags at once still throws `org.hibernate.loader.MultipleBagFetchException`
      in Hibernate 6 (the behavior is unchanged). Fetch at most one collection per query
      and load the others via batch fetching or a subselect fetch; two Set fetches avoid
      the exception but not the Cartesian product.
    ref: "concepts.md#multiplebagfetchexception-and-cartesian-products"
