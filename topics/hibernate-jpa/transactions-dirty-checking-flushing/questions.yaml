topic: "Transactions, Dirty Checking & Flushing"
domain: hibernate-jpa
topic_slug: transactions-dirty-checking-flushing
version: 1
questions:
  - id: transactions-dirty-checking-flushing-001
    difficulty: beginner
    tags: [dirty-checking, managed-entity, update]
    question: |
      You load an entity with em.find(), change one of its fields, and never
      call any save/merge/persist method. The transaction then commits. What
      happens to the change?
    options:
      - "Nothing — JPA only persists changes made through explicit save() calls"
      - "It throws a TransientObjectException because the entity was never persisted"
      - "Hibernate detects the change via dirty checking and issues an UPDATE at flush/commit"
      - "The change is written only if you also call em.refresh()"
    answer: 2
    explanation: |
      The entity returned by find() is managed. Hibernate keeps a snapshot of
      its loaded state and, at flush (which happens at commit), compares the
      live object to the snapshot; a difference triggers an auto-generated
      UPDATE. This is dirty checking — the reason you rarely call save() on
      loaded entities.
    ref: "concepts.md#dirty-checking-how-hibernate-auto-generates-updates"

  - id: transactions-dirty-checking-flushing-002
    difficulty: beginner
    tags: [flush, commit, definitions]
    question: |
      What is the difference between a flush and a commit in JPA/Hibernate?
    options:
      - "Flush writes pending SQL within the current transaction; commit ends the transaction and makes changes durable/visible to others"
      - "They are synonyms — both end the transaction"
      - "Flush ends the transaction; commit only writes SQL"
      - "Flush clears the persistence context; commit reloads it"
    answer: 0
    explanation: |
      Flush synchronizes the persistence context to the DB by executing queued
      INSERT/UPDATE/DELETE within the current transaction — the data is not yet
      committed and a rollback would undo it. Commit ends the DB transaction.
      Flush != commit.
    ref: "concepts.md#flush-is-not-commit-and-transaction-boundaries"

  - id: transactions-dirty-checking-flushing-003
    difficulty: beginner
    tags: [flushmode, auto, default]
    question: |
      What is the default FlushModeType for a JPA EntityManager?
    options:
      - "COMMIT"
      - "AUTO"
      - "MANUAL"
      - "ALWAYS"
    answer: 1
    explanation: |
      AUTO is the JPA default: Hibernate flushes at commit and also before
      executing a query whose results could be affected by pending changes, so
      queries observe your own unflushed writes.
    ref: "concepts.md#flushmodetype-auto-vs-commit-and-hibernate-manualalways"

  - id: transactions-dirty-checking-flushing-004
    difficulty: intermediate
    tags: [dirty-checking, snapshot, mechanism]
    question: |
      With Hibernate's default dirty-checking strategy, how does it decide which
      managed entities need an UPDATE at flush?
    options:
      - "It listens to every setter call at runtime via reflection interceptors"
      - "It asks the database which rows changed using a checksum column"
      - "It marks an entity dirty only when you call em.merge() on it"
      - "It compares each entity's current property values against a snapshot of its loaded state taken when it became managed"
    answer: 3
    explanation: |
      The default strategy is state-snapshot comparison: Hibernate stores the
      loaded state when the entity enters the context and, at flush, diffs the
      live object field-by-field against that snapshot. Differences schedule an
      UPDATE.
    ref: "concepts.md#dirty-checking-how-hibernate-auto-generates-updates"

  - id: transactions-dirty-checking-flushing-005
    difficulty: intermediate
    tags: [dirty-update, columns, all-columns]
    question: |
      By default, when Hibernate issues an UPDATE for a dirty entity, which
      columns appear in the SET clause?
    options:
      - "Only the columns whose values actually changed"
      - "Only the primary key column"
      - "All updatable columns of the entity, regardless of which changed"
      - "A random subset chosen by the JDBC driver"
    answer: 2
    explanation: |
      By default Hibernate pre-generates one parameterized UPDATE per entity
      type that sets all updatable columns, so the statement can be cached and
      reused. @DynamicUpdate switches to generating SQL that touches only the
      changed columns, at the cost of statement-cache reuse.
    ref: "concepts.md#dirty-checking-how-hibernate-auto-generates-updates"

  - id: transactions-dirty-checking-flushing-006
    difficulty: intermediate
    tags: [dynamic-update, annotation]
    question: |
      What does the Hibernate @DynamicUpdate annotation change?
    options:
      - "It makes UPDATE statements include only the columns whose values changed"
      - "It forces an immediate flush after every setter"
      - "It switches the entity to a second-level cache region"
      - "It disables dirty checking for that entity"
    answer: 0
    explanation: |
      @DynamicUpdate makes Hibernate generate the UPDATE at flush time to
      include only the changed columns. It sacrifices reuse of a single cached
      UPDATE statement, but is useful for very wide tables or when column-level
      triggers/constraints matter.
    ref: "concepts.md#dirty-checking-how-hibernate-auto-generates-updates"

  - id: transactions-dirty-checking-flushing-007
    difficulty: intermediate
    tags: [detached, dirty-checking, lifecycle]
    question: |
      A method loads an entity in transaction A (which then closes). Later, in
      transaction B, code mutates that now-detached object. Nothing else is
      called. What is persisted?
    options:
      - "The change is persisted at B's commit via dirty checking"
      - "Nothing — a detached entity is not tracked; you must merge it back into a context to persist changes"
      - "A LazyInitializationException is thrown when the field is set"
      - "Hibernate re-attaches it automatically on any field access"
    answer: 1
    explanation: |
      Dirty checking only applies to managed entities. A detached entity has no
      active persistence context tracking it, so mutating it does nothing to the
      DB until you merge() it back (which copies state into a managed instance).
    ref: "concepts.md#dirty-checking-how-hibernate-auto-generates-updates"

  - id: transactions-dirty-checking-flushing-008
    difficulty: advanced
    tags: [flush-order, constraint, unique]
    question: |
      In one transaction you set a soft flag on and em.remove() an existing User
      that owns a unique email, then em.persist() a new User with that same
      email. At commit you get a unique-constraint violation. Why?
    options:
      - "merge() should have been used instead of persist()"
      - "Unique constraints are not supported when orphanRemoval is off"
      - "Hibernate executes all INSERTs before all DELETEs in a flush, so the new row is inserted while the old one still exists"
      - "The persistence context caches the email string and reuses it"
    answer: 2
    explanation: |
      A flush runs statements in a fixed action order: inserts precede deletes.
      So the INSERT of the new row executes while the old row still holds the
      email, violating the unique constraint. Fix by calling em.flush() between
      the remove and the persist, or use a deferrable constraint.
    ref: "concepts.md#flush-order-and-the-constraint-violation-gotcha"

  - id: transactions-dirty-checking-flushing-009
    difficulty: advanced
    tags: [flush-order, fix, explicit-flush]
    question: |
      Given the delete-then-insert unique-constraint problem, which fix forces
      the DELETE to run before the conflicting INSERT?
    options:
      - "Annotate the entity with @DynamicUpdate"
      - "Switch FlushModeType to COMMIT"
      - "Call em.clear() before the persist()"
      - "Call em.flush() after the remove() and before the persist()"
    answer: 3
    explanation: |
      An explicit em.flush() after the remove pushes the DELETE to the DB before
      the new INSERT is queued, so ordering is respected. (A deferrable DB
      constraint is an alternative.) COMMIT mode and @DynamicUpdate do not change
      intra-flush action ordering; clear() would detach queued work.
    ref: "concepts.md#when-you-need-an-explicit-flush"

  - id: transactions-dirty-checking-flushing-010
    difficulty: intermediate
    tags: [write-behind, persistence-context, why]
    question: |
      Why does Hibernate defer SQL to flush time (write-behind) rather than
      executing it immediately when you call persist() or mutate a field?
    options:
      - "To enable JDBC batching, dirty checking, and statement reordering to satisfy constraints"
      - "To hide SQL from the developer for security"
      - "Because JDBC does not support immediate execution"
      - "To keep the transaction open indefinitely"
    answer: 0
    explanation: |
      Write-behind lets Hibernate batch statements (fewer round trips), compute
      net changes via dirty checking, and reorder statements (inserts, updates,
      deletes) so foreign-key/constraint ordering works.
    ref: "concepts.md#the-persistence-context-as-a-write-behind-cache"

  - id: transactions-dirty-checking-flushing-011
    difficulty: intermediate
    tags: [flushmode, commit, stale-read]
    question: |
      A transaction uses FlushModeType.COMMIT. It persists a new Order, then runs
      a JPQL "select count(o) from Order o". What is the risk?
    options:
      - "The count query flushes first and includes the new order"
      - "The count may exclude the just-persisted order because no flush occurs before the query"
      - "The persist is rolled back automatically"
      - "COMMIT mode is illegal with JPQL queries"
    answer: 1
    explanation: |
      With COMMIT mode Hibernate flushes only at commit, not before queries. So a
      query executed before commit may not see unflushed changes, returning a
      stale count. AUTO would flush before this overlapping query.
    ref: "concepts.md#flushmodetype-auto-vs-commit-and-hibernate-manualalways"

  - id: transactions-dirty-checking-flushing-012
    difficulty: advanced
    tags: [flushmode, auto, native-query]
    question: |
      Under FlushModeType.AUTO, which situation is NOT reliably guaranteed to
      trigger an automatic flush before execution?
    options:
      - "A JPQL query over an entity that has pending changes"
      - "A Criteria query over an entity that has pending changes"
      - "Transaction commit"
      - "A native SQL query that reads a table with pending changes"
    answer: 3
    explanation: |
      AUTO flushes before JPQL/HQL/Criteria queries that overlap pending changes
      and at commit. But Hibernate cannot reliably determine the tables a native
      SQL query touches, so it may not auto-flush before native queries; call
      em.flush() first if the native query must see pending writes.
    ref: "concepts.md#flushmodetype-auto-vs-commit-and-hibernate-manualalways"

  - id: transactions-dirty-checking-flushing-013
    difficulty: intermediate
    tags: [first-level-cache, identity-map]
    question: |
      Calling em.find(User.class, 1L) twice within one persistence context
      results in how many SELECT statements (assuming no eviction)?
    options:
      - "Two — every find hits the database"
      - "Zero — find never queries the database"
      - "One — the second find returns the same instance from the first-level cache"
      - "One per field of the entity"
    answer: 2
    explanation: |
      The persistence context is an identity map (first-level cache). The first
      find issues a SELECT and caches the instance; the second find returns the
      same object without another query. See caching-first-second-level for depth.
    ref: "concepts.md#the-persistence-context-as-a-write-behind-cache"

  - id: transactions-dirty-checking-flushing-014
    difficulty: advanced
    tags: [bytecode-enhancement, dirty-tracking]
    question: |
      What advantage does Hibernate bytecode enhancement provide for dirty
      tracking compared to the default snapshot strategy?
    options:
      - "Instrumented setters flag changed attributes eagerly, so flush need not diff every field against a snapshot"
      - "It removes the need for a transaction"
      - "It makes all associations EAGER"
      - "It disables the first-level cache to save memory"
    answer: 0
    explanation: |
      With enhancement, entity setters are instrumented to record which
      attributes changed (self dirty tracking), so at flush Hibernate asks each
      entity what is dirty rather than diffing all fields against a stored
      snapshot — cheaper for large contexts and wide entities. It also enables
      lazy basic attributes.
    ref: "concepts.md#bytecode-enhancement-for-dirty-tracking"

  - id: transactions-dirty-checking-flushing-015
    difficulty: intermediate
    tags: [flush, rollback, semantics]
    question: |
      After you call em.flush() (statements now sent to the DB), the transaction
      then rolls back. What is the state of the flushed changes?
    options:
      - "They are permanently committed because flush wrote them"
      - "Only INSERTs survive, UPDATEs are reverted"
      - "Hibernate throws because you cannot roll back after a flush"
      - "They are undone — a rollback reverts the transaction regardless of prior flush"
    answer: 3
    explanation: |
      Flush executes SQL within the transaction but does not commit. A rollback
      reverts everything the transaction did, including flushed statements. Flush
      changes when SQL runs, not whether it is durable.
    ref: "concepts.md#flush-is-not-commit-and-transaction-boundaries"

  - id: transactions-dirty-checking-flushing-016
    difficulty: intermediate
    tags: [batch-loop, flush, clear, memory]
    question: |
      When inserting 100,000 rows in a loop, why should you periodically call
      em.flush() AND em.clear()?
    options:
      - "flush() commits and clear() opens a new transaction"
      - "flush() pushes the batch to the DB and clear() detaches entities so the persistence context (and its snapshots) does not grow unbounded"
      - "clear() is required to enable dirty checking"
      - "They convert IDENTITY ids to SEQUENCE ids"
    answer: 1
    explanation: |
      flush() executes the queued batch; clear() detaches all managed entities so
      their snapshots are released. Without clear(), the context grows unbounded,
      slowing dirty checks and risking OutOfMemoryError. A StatelessSession avoids
      the context entirely.
    ref: "concepts.md#when-you-need-an-explicit-flush"

  - id: transactions-dirty-checking-flushing-017
    difficulty: advanced
    tags: [batching, identity, sequence]
    question: |
      Why does GenerationType.IDENTITY prevent Hibernate from batching INSERT
      statements?
    options:
      - "IDENTITY columns cannot be part of a batch by SQL standard"
      - "IDENTITY forces FlushModeType.COMMIT"
      - "Hibernate must retrieve each generated key with a round trip per row, so it cannot defer/batch the inserts"
      - "IDENTITY disables the persistence context"
    answer: 2
    explanation: |
      To batch inserts Hibernate needs the entity identifiers before executing.
      IDENTITY generates the key on insert, requiring a round trip per row to read
      it, so Hibernate disables insert batching for IDENTITY-keyed entities. Use
      SEQUENCE (with pooled/hi-lo) for batchable inserts.
    ref: "concepts.md#batching-inserts-and-ordered-statements"

  - id: transactions-dirty-checking-flushing-018
    difficulty: intermediate
    tags: [batching, config, order-inserts]
    question: |
      You set hibernate.jdbc.batch_size=50 but batching seems ineffective when
      inserting mixed entity types interleaved. Which additional settings help?
    options:
      - "hibernate.show_sql and hibernate.format_sql"
      - "hibernate.enable_lazy_load_no_trans=true"
      - "hibernate.flushMode=ALWAYS"
      - "hibernate.order_inserts=true and hibernate.order_updates=true"
    answer: 3
    explanation: |
      JDBC batches only same-shape statements. Interleaved INSERT A, INSERT B,
      INSERT A breaks the batch at each type change. order_inserts/order_updates
      group statements by table so the driver can batch them together.
    ref: "concepts.md#batching-inserts-and-ordered-statements"

  - id: transactions-dirty-checking-flushing-019
    difficulty: advanced
    tags: [read-only, flushmode, optimization]
    question: |
      Under Spring, what does @Transactional(readOnly = true) do at the Hibernate
      level?
    options:
      - "It sets the Hibernate FlushMode to MANUAL (no auto-flush) and lets Hibernate skip dirty-check snapshots"
      - "It acquires a database-level shared lock on all read rows"
      - "It converts all queries to native SQL"
      - "It forces a second-level cache miss"
    answer: 0
    explanation: |
      Spring sets the session's FlushMode to MANUAL so no automatic flush occurs,
      and read-only entities need no dirty-check snapshot, saving memory and flush
      CPU on large result sets. It is a Hibernate optimization/hint, not by itself
      a DB-level lock.
    ref: "concepts.md#read-only-transactions-and-optimization"

  - id: transactions-dirty-checking-flushing-020
    difficulty: advanced
    tags: [read-only, mutation, gotcha]
    question: |
      Inside a @Transactional(readOnly = true) method you load an entity and
      change a field. What happens at method return?
    options:
      - "An UPDATE is issued because dirty checking always runs"
      - "The change is not persisted — no snapshot/flush occurs for read-only entities"
      - "A ReadOnlyModificationException is thrown"
      - "The change is queued and applied in the next transaction"
    answer: 1
    explanation: |
      Read-only mode skips dirty-check snapshots and auto-flush, so mutating a
      read-only entity silently does not persist. This is a common gotcha: people
      expect the change to be written.
    ref: "concepts.md#read-only-transactions-and-optimization"

  - id: transactions-dirty-checking-flushing-021
    difficulty: beginner
    tags: [flush, definition, sql]
    question: |
      What does "flushing the persistence context" mean?
    options:
      - "Discarding all managed entities"
      - "Committing and closing the transaction"
      - "Writing all pending INSERT/UPDATE/DELETE statements to the database within the current transaction"
      - "Refreshing entities from the database"
    answer: 2
    explanation: |
      Flushing synchronizes in-memory state to the DB by executing queued SQL
      within the transaction. It is not a commit and it does not clear the context
      (that is clear()).
    ref: "concepts.md#flush-synchronizing-the-persistence-context-to-the-database"

  - id: transactions-dirty-checking-flushing-022
    difficulty: advanced
    tags: [flush-order, actions]
    question: |
      Within a single flush, in which relative order does Hibernate execute
      entity inserts, entity updates, and entity deletes?
    options:
      - "Inserts, then updates, then deletes"
      - "Deletes, then updates, then inserts"
      - "In the exact order the persist/merge/remove calls were made"
      - "Updates, then inserts, then deletes"
    answer: 0
    explanation: |
      Hibernate uses a fixed action order: orphan removals, entity inserts,
      entity updates, collection operations, then entity deletes. Inserts precede
      deletes, which causes the classic delete-then-reinsert unique-constraint
      failure.
    ref: "concepts.md#flush-order-and-the-constraint-violation-gotcha"

  - id: transactions-dirty-checking-flushing-023
    difficulty: intermediate
    tags: [explicit-flush, insert-timing]
    question: |
      With a SEQUENCE-generated id, why might you call em.flush() right after
      em.persist(newEntity) even though commit would flush anyway?
    options:
      - "To roll back the persist"
      - "To force the entity's generated id to be assigned, which persist has not yet done"
      - "To move the entity to the second-level cache"
      - "To force the deferred INSERT to hit the DB now, e.g. so a DB trigger/default runs or a later native query sees the row"
    answer: 3
    explanation: |
      With a SEQUENCE generator, persist already assigns the id (it calls the
      sequence) but defers the INSERT until flush. If you need the row to
      physically exist before commit — a DB trigger/default must populate a column,
      or a native query must read it — an explicit flush forces the INSERT now. The
      id itself does not require a flush.
    ref: "concepts.md#when-you-need-an-explicit-flush"

  - id: transactions-dirty-checking-flushing-024
    difficulty: advanced
    tags: [bulk-jpql, dirty-checking, stale-cache]
    question: |
      You run em.createQuery("update Employee e set e.active=false").executeUpdate()
      while some Employee entities are already loaded in the persistence context.
      What is the concern?
    options:
      - "Bulk JPQL update triggers dirty checking on every loaded entity"
      - "The bulk update bypasses the persistence context, so already-loaded entities may hold stale state in the first-level cache"
      - "Bulk update automatically clears the context"
      - "Bulk update requires FlushModeType.COMMIT"
    answer: 1
    explanation: |
      Bulk JPQL update/delete goes straight to SQL, bypassing dirty checking and
      the first-level cache. Entities already loaded are not updated in memory, so
      they can be stale. Flush before and clear after bulk operations to avoid
      inconsistency.
    ref: "concepts.md#dirty-checking-how-hibernate-auto-generates-updates"

  - id: transactions-dirty-checking-flushing-025
    difficulty: intermediate
    tags: [transaction-boundary, spring, commit]
    question: |
      In a Spring @Transactional method backed by JpaTransactionManager
      (resource-local), what triggers the flush and commit?
    options:
      - "Every setter call inside the method"
      - "The database on a timer"
      - "The transactional proxy at method return triggers flush then commit (or rollback on a runtime exception)"
      - "Only an explicit em.getTransaction().commit() call"
    answer: 2
    explanation: |
      The @Transactional proxy begins the tx on entry and, on normal return,
      flushes and commits; on an unchecked exception it rolls back. Propagation
      and proxy self-invocation limits belong to spring-core/spring-boot; here the
      point is the boundary drives flush+commit.
    ref: "concepts.md#flush-is-not-commit-and-transaction-boundaries"

  - id: transactions-dirty-checking-flushing-026
    difficulty: advanced
    tags: [jta, resource-local, choice]
    question: |
      When would you choose JTA (Jakarta Transactions) over a resource-local
      transaction for Hibernate?
    options:
      - "When a single transaction must span multiple resources (e.g. two databases or a DB plus JMS) requiring a global/XA coordinator"
      - "When using a single datasource and wanting the simplest setup"
      - "When you want faster dirty checking"
      - "JTA is required for any use of @Transactional"
    answer: 0
    explanation: |
      JTA provides a global transaction manager that can coordinate multiple
      resources (two-phase commit / XA). For a single datasource, resource-local
      is simpler and sufficient. Hibernate enlists as a Synchronization under JTA
      and flushes on beforeCompletion.
    ref: "concepts.md#flush-is-not-commit-and-transaction-boundaries"

  - id: transactions-dirty-checking-flushing-027
    difficulty: intermediate
    tags: [debugging, flush, error-location]
    question: |
      Why can inserting an explicit em.flush() help when debugging a persistence
      exception that otherwise appears "at commit"?
    options:
      - "flush() disables exceptions"
      - "flush() surfaces the SQL error at the line that caused it rather than at the end of the method when commit flushes"
      - "flush() converts exceptions to warnings"
      - "flush() retries the failed statement"
    answer: 1
    explanation: |
      Because auto-flush at commit runs at method end, a constraint error can
      surface far from the offending code. An explicit flush executes the SQL at
      that point, so the exception is thrown at the responsible line — a valuable
      debugging technique.
    ref: "concepts.md#flush-is-not-commit-and-transaction-boundaries"

  - id: transactions-dirty-checking-flushing-028
    difficulty: expert
    tags: [stateless-session, dirty-checking]
    question: |
      Which statement about Hibernate's StatelessSession is correct?
    options:
      - "It provides dirty checking but not caching"
      - "It is identical to a normal Session but faster"
      - "It automatically batches IDENTITY inserts"
      - "It has no persistence context: no dirty checking, no first-level cache, and no cascade — you must issue insert/update/delete explicitly"
    answer: 3
    explanation: |
      StatelessSession bypasses the persistence context entirely: no first-level
      cache, no automatic dirty checking, no cascading, no automatic flush. You
      call insert/update/delete directly. It is ideal for bulk/ETL work where the
      overhead of a managed context is unwanted.
    ref: "concepts.md#when-you-need-an-explicit-flush"

  - id: transactions-dirty-checking-flushing-029
    difficulty: intermediate
    tags: [flushmode, manual, hibernate]
    question: |
      Which flush mode is Hibernate-specific (not part of the JPA FlushModeType
      enum) and means "never auto-flush, you must call flush() yourself"?
    options:
      - "AUTO"
      - "COMMIT"
      - "MANUAL"
      - "IMMEDIATE"
    answer: 2
    explanation: |
      JPA defines only AUTO and COMMIT. Hibernate's FlushMode adds MANUAL (never
      auto-flush; explicit flush required) and ALWAYS (flush before every query).
      There is no IMMEDIATE mode.
    ref: "concepts.md#flushmodetype-auto-vs-commit-and-hibernate-manualalways"

  - id: transactions-dirty-checking-flushing-030
    difficulty: advanced
    tags: [flushmode, always, cost]
    question: |
      What does Hibernate's FlushMode.ALWAYS do, and why is it rarely used?
    options:
      - "Flushes only at commit; rarely used because it is too lazy"
      - "Flushes before every query — even non-overlapping ones — which is expensive and usually unnecessary"
      - "Disables flushing entirely"
      - "Flushes each entity on a background thread"
    answer: 1
    explanation: |
      ALWAYS forces a flush before every query regardless of whether the query
      overlaps pending changes. This adds needless overhead compared to AUTO's
      overlap-aware flushing, so it is rarely appropriate.
    ref: "concepts.md#flushmodetype-auto-vs-commit-and-hibernate-manualalways"

  - id: transactions-dirty-checking-flushing-031
    difficulty: intermediate
    tags: [snapshot, memory, anti-pattern]
    question: |
      Loading 100,000 rows into one persistence context just to update 3 of them
      is discouraged primarily because:
    options:
      - "JPQL cannot express such a query"
      - "The database will lock all 100,000 rows"
      - "Dirty checking does not work above 10,000 entities"
      - "Hibernate must snapshot and dirty-check all 100,000 managed entities, costing memory and flush CPU"
    answer: 3
    explanation: |
      Every managed entity gets a snapshot and is dirty-checked at flush, so the
      cost scales with the number of managed entities times their fields. For a
      few targeted changes, a bulk JPQL update or a narrower query is far cheaper.
    ref: "concepts.md#dirty-checking-how-hibernate-auto-generates-updates"

  - id: transactions-dirty-checking-flushing-032
    difficulty: beginner
    tags: [persistence-context, roles]
    question: |
      The persistence context (first-level cache) plays which two roles?
    options:
      - "An identity-map read cache and a write-behind buffer for pending changes"
      - "A connection pool and a thread pool"
      - "A query parser and a SQL formatter"
      - "A second-level cache and a query cache"
    answer: 0
    explanation: |
      It is both an identity map (same id returns the same instance, avoiding
      repeat SELECTs) and a write-behind buffer where mutations accumulate until
      flush. See session-entitymanager-persistence-context for lifecycle depth.
    ref: "concepts.md#the-persistence-context-as-a-write-behind-cache"

  - id: transactions-dirty-checking-flushing-033
    difficulty: advanced
    tags: [batch-versioned-data, optimistic-lock]
    question: |
      Why might you set hibernate.batch_versioned_data=true?
    options:
      - "To disable optimistic locking"
      - "To store version numbers in the second-level cache"
      - "To allow batching of UPDATE/DELETE on entities that carry a @Version column when the JDBC driver reports batch row counts correctly"
      - "To force pessimistic locking"
    answer: 2
    explanation: |
      Versioned (optimistic-lock) rows need accurate per-row affected counts to
      detect stale updates. Historically some drivers did not report batch counts
      reliably, so Hibernate did not batch versioned data by default. Enabling this
      allows batching when the driver behaves correctly. See
      concurrency-optimistic-pessimistic-locking.
    ref: "concepts.md#batching-inserts-and-ordered-statements"

  - id: transactions-dirty-checking-flushing-034
    difficulty: intermediate
    tags: [transient, persist, lifecycle]
    question: |
      A brand-new (transient) object that you never persist and never associate
      with a managed entity is mutated inside a transaction. At commit:
    options:
      - "It is inserted via dirty checking"
      - "Nothing is written — transient objects are not tracked until persist() (or a cascade) makes them managed"
      - "A TransientPropertyValueException is always thrown"
      - "It is inserted only if it has an @Id"
    answer: 1
    explanation: |
      Dirty checking and flush only act on managed entities. A transient object is
      invisible to the persistence context until persist() (or cascade from a
      managed parent) makes it managed. See entity-lifecycle-states.
    ref: "concepts.md#dirty-checking-how-hibernate-auto-generates-updates"

  - id: transactions-dirty-checking-flushing-035
    difficulty: advanced
    tags: [flush-visibility, isolation, cross-ref]
    question: |
      After you flush (but before commit) in transaction T1, can another
      transaction T2 read the flushed-but-uncommitted rows?
    options:
      - "It depends on the database isolation level; under typical READ COMMITTED, T2 does not see uncommitted rows"
      - "Always yes — flush makes rows globally visible"
      - "Never — flushed rows are always private forever"
      - "Only if T2 uses the same EntityManager"
    answer: 0
    explanation: |
      Flush writes within T1's transaction; visibility to other transactions is
      governed by the database's isolation level and locking, not by Hibernate.
      Under READ COMMITTED, T2 will not see T1's uncommitted rows. Isolation
      semantics are owned by messaging-databases.
    ref: "concepts.md#flush-is-not-commit-and-transaction-boundaries"

  - id: transactions-dirty-checking-flushing-036
    difficulty: intermediate
    tags: [merge, detached, dirty-checking]
    question: |
      To persist changes made to a detached entity, what is the correct approach?
    options:
      - "Call em.persist(detached) — it re-attaches and updates"
      - "Just mutate it again inside a transaction; dirty checking will pick it up"
      - "Call em.refresh(detached)"
      - "Call em.merge(detached), which copies its state into a managed instance that is then dirty-checked/updated"
    answer: 3
    explanation: |
      merge() copies the detached entity's state onto a managed instance (loading
      or using the cached one), returning the managed copy; that managed instance
      is then dirty-checked and updated at flush. persist() on a detached entity
      with an existing id typically throws; refresh() overwrites from the DB.
    ref: "concepts.md#dirty-checking-how-hibernate-auto-generates-updates"

  - id: transactions-dirty-checking-flushing-037
    difficulty: advanced
    tags: [read-only, second-level-cache, immutable]
    question: |
      Why are read-only entities also cheaper for the second-level cache?
    options:
      - "They are never cached"
      - "They bypass the query cache"
      - "Having no dirty-check snapshot, they are effectively immutable and simpler/cheaper to store and reuse"
      - "They force eviction of the first-level cache"
    answer: 2
    explanation: |
      Read-only entities carry no mutable snapshot state to track, so they are
      treated as immutable — cheaper to hold and reuse. See
      caching-first-second-level for cache-region concurrency strategies.
    ref: "concepts.md#read-only-transactions-and-optimization"

  - id: transactions-dirty-checking-flushing-038
    difficulty: expert
    tags: [flush-order, orphan-removal, collections]
    question: |
      In Hibernate's flush action order, orphan-removal deletions and
      collection-recreate operations occur relative to entity inserts as follows:
    options:
      - "All collection operations run before any entity insert"
      - "Orphan removals run first; collection recreate runs after entity updates but before entity deletes"
      - "Orphan removals run last, after entity deletes"
      - "Collection recreate runs before orphan removals"
    answer: 1
    explanation: |
      The action order is: orphan removals, entity inserts, entity updates,
      collection remove, collection update, collection recreate, then entity
      deletes. So orphan removals precede inserts, and collection recreate falls
      after entity updates but before entity deletes. See
      cascade-types-orphan-removal.
    ref: "concepts.md#flush-order-and-the-constraint-violation-gotcha"

  - id: transactions-dirty-checking-flushing-039
    difficulty: intermediate
    tags: [read-your-writes, auto, jpql]
    question: |
      The main reason FlushModeType.AUTO flushes before an overlapping JPQL query
      is to guarantee:
    options:
      - "Read-your-writes consistency — the query sees the transaction's own pending changes"
      - "The query runs faster"
      - "The second-level cache is populated"
      - "The transaction commits sooner"
    answer: 0
    explanation: |
      AUTO's pre-query flush ensures a query observes the transaction's uncommitted
      changes to the entity types (tables) it touches, giving intuitive
      read-your-writes behavior within the transaction.
    ref: "concepts.md#flushmodetype-auto-vs-commit-and-hibernate-manualalways"

  - id: transactions-dirty-checking-flushing-040
    difficulty: advanced
    tags: [read-only-hint, query-hint]
    question: |
      Which is a valid way to obtain read-only entities from a Hibernate query
      for a large result set?
    options:
      - "Annotate the entity with @DynamicUpdate"
      - "Set FlushMode.ALWAYS"
      - "Call em.clear() before the query"
      - "Set the query hint org.hibernate.readOnly = true"
    answer: 3
    explanation: |
      The org.hibernate.readOnly query hint (or session.setDefaultReadOnly(true),
      or Spring's @Transactional(readOnly=true)) yields read-only entities with no
      dirty-check snapshot, saving memory and flush cost on large reads.
    ref: "concepts.md#read-only-transactions-and-optimization"

  - id: transactions-dirty-checking-flushing-041
    difficulty: beginner
    tags: [managed, mutate, no-save]
    question: |
      Which statement best captures the "senior aha" about managed entities?
    options:
      - "You must always call repository.save() after changing any field"
      - "Managed entities cannot be modified"
      - "Mutating a managed entity's fields is enough — Hibernate generates the UPDATE at flush without any save() call"
      - "Every field change immediately hits the database"
    answer: 2
    explanation: |
      Because a managed entity is dirty-checked, simply mutating its fields causes
      an UPDATE at flush/commit; no explicit save() is needed. Juniors reflexively
      call save(); seniors understand dirty checking.
    ref: "concepts.md#dirty-checking-how-hibernate-auto-generates-updates"

  - id: transactions-dirty-checking-flushing-042
    difficulty: advanced
    tags: [flush, clear, difference]
    question: |
      What is the difference between em.flush() and em.clear()?
    options:
      - "flush() writes pending SQL to the DB; clear() detaches all managed entities, emptying the persistence context"
      - "flush() detaches entities; clear() writes SQL"
      - "They are the same operation"
      - "flush() commits; clear() rolls back"
    answer: 0
    explanation: |
      flush() synchronizes pending changes to the DB (still within the tx);
      clear() discards the persistence context, detaching every managed entity
      (discarding un-flushed changes for those entities and dropping the identity
      map). Batch loops use both together.
    ref: "concepts.md#when-you-need-an-explicit-flush"

  - id: transactions-dirty-checking-flushing-043
    difficulty: intermediate
    tags: [flush, commit-always-flushes]
    question: |
      Regardless of the flush mode, when must Hibernate flush?
    options:
      - "Never automatically"
      - "Before the database COMMIT at the end of the transaction"
      - "Only when show_sql is enabled"
      - "Only for entities annotated @DynamicUpdate"
    answer: 1
    explanation: |
      Even in COMMIT mode, Hibernate flushes before the actual COMMIT so the
      transaction's changes are written. (MANUAL requires explicit flush during
      the tx.) A commit that failed to flush pending writes would lose them.
    ref: "concepts.md#flush-synchronizing-the-persistence-context-to-the-database"

  - id: transactions-dirty-checking-flushing-044
    difficulty: advanced
    tags: [dirty-check, mutable-type, collection]
    question: |
      Why can a mutable field like a java.util.Date or an @ElementCollection List
      be dirty-checked correctly even without calling a setter?
    options:
      - "Hibernate polls the field every millisecond"
      - "Mutable fields are never dirty-checked"
      - "Only immutable fields can be dirty-checked"
      - "The snapshot holds a deep-enough copy of the value at load time, so at flush the current value is compared against that stored snapshot"
    answer: 3
    explanation: |
      Snapshot-based dirty checking compares current state to the stored loaded
      state at flush, so even in-place mutations of a value (a Date, a collection)
      are detected by comparison — no setter interception needed. (Bytecode
      enhancement, by contrast, relies on setter instrumentation and needs care
      with in-place mutation.)
    ref: "concepts.md#dirty-checking-how-hibernate-auto-generates-updates"

  - id: transactions-dirty-checking-flushing-045
    difficulty: expert
    tags: [flush, query-space, overlap]
    question: |
      Under AUTO mode, how does Hibernate decide whether to auto-flush before a
      given JPQL query?
    options:
      - "It always flushes before every JPQL query"
      - "It flushes only if the query is a SELECT COUNT"
      - "It compares the query's referenced tables (query spaces) against the tables that have pending changes, flushing only if they overlap"
      - "It flushes based on the number of managed entities"
    answer: 2
    explanation: |
      AUTO uses query-space (table) overlap: if the JPQL query reads entity
      types/tables that have pending INSERT/UPDATE/DELETE, Hibernate flushes first
      so results are consistent; otherwise it can skip the flush. This is why AUTO
      is smarter (and cheaper) than ALWAYS.
    ref: "concepts.md#flushmodetype-auto-vs-commit-and-hibernate-manualalways"

  - id: transactions-dirty-checking-flushing-046
    difficulty: expert
    tags: [connection-handling, lazy-acquisition, pool]
    question: |
      Using the default resource-local connection handling
      (DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION), at what point does a
      Spring @Transactional method first check out a JDBC connection from the pool?
    options:
      - "The moment the transaction begins, before any method code runs"
      - "When the EntityManager/Session is created, regardless of what the method does"
      - "Lazily, at the first SQL statement (first query or the flush) that needs the connection"
      - "Only at commit time"
    answer: 2
    explanation: |
      Under DELAYED_ACQUISITION Hibernate does not grab a Connection at tx begin
      or session open; it defers until the first statement actually needs it (a
      query, or the flush). A compute-only read-only method that never issues a
      statement can avoid touching the pool entirely.
    ref: "concepts.md#when-a-transaction-actually-acquires-a-jdbc-connection"

  - id: transactions-dirty-checking-flushing-047
    difficulty: expert
    tags: [connection-handling, jta, resource-local, defaults]
    question: |
      How does the default PhysicalConnectionHandlingMode differ between a JTA
      environment and a resource-local one?
    options:
      - "JTA holds the connection from session open; resource-local acquires it lazily"
      - "Both release only at session close"
      - "Resource-local never acquires a connection; JTA always does immediately"
      - "JTA releases the connection after each statement; resource-local releases it after the transaction ends"
    answer: 3
    explanation: |
      Both delay acquisition to the first statement, but the release policy
      differs: JTA defaults to RELEASE_AFTER_STATEMENT (aggressive release so the
      JTA coordinator can manage enlistment), while resource-local defaults to
      RELEASE_AFTER_TRANSACTION (hold until the tx ends).
    ref: "concepts.md#when-a-transaction-actually-acquires-a-jdbc-connection"

  - id: transactions-dirty-checking-flushing-048
    difficulty: advanced
    tags: [lazy-connection, spring, replica-routing]
    question: |
      What does wrapping the DataSource in Spring's LazyConnectionDataSourceProxy
      add on top of Hibernate's own delayed connection acquisition?
    options:
      - "It forces IMMEDIATE_ACQUISITION so connections are grabbed at tx begin"
      - "It disables connection pooling entirely"
      - "It defers physical acquisition to the first real statement through the proxy and enables read/write datasource routing (e.g. route reads to a replica, promote to primary on first write)"
      - "It converts all transactions to read-only"
    answer: 2
    explanation: |
      LazyConnectionDataSourceProxy hands out a proxy connection and only opens a
      real one on first use, which lets routing logic pick a datasource (read
      replica vs primary) based on readOnly flag / first-write, reducing pool
      pressure for compute-only or read-only work.
    ref: "concepts.md#when-a-transaction-actually-acquires-a-jdbc-connection"

  - id: transactions-dirty-checking-flushing-049
    difficulty: expert
    tags: [version, optimistic-lock, generated-sql]
    question: |
      An Account has an @Version int field. You load it, change balance, and flush.
      Which UPDATE does Hibernate emit?
    options:
      - "update account set balance=?, version=? where id=? and version=?"
      - "update account set balance=? where id=?"
      - "update account set balance=? where id=? and balance=?"
      - "update account set balance=?, version=version+1 where id=? for update"
    answer: 0
    explanation: |
      A versioned UPDATE sets the new balance and the incremented version, and
      constrains WHERE id=? AND version=? (the loaded version). If no row matches
      that version, someone else changed it concurrently and Hibernate throws
      OptimisticLockException / StaleObjectStateException.
    ref: "concepts.md#optimistic-locking-at-flush-version-and-the-where-predicate"

  - id: transactions-dirty-checking-flushing-050
    difficulty: expert
    tags: [version, row-count, stale-detection]
    question: |
      How does Hibernate detect a stale write for a @Version entity at flush?
    options:
      - "It re-SELECTs the row and compares every column"
      - "It acquires a pessimistic lock before the UPDATE"
      - "It inspects the JDBC UPDATE row count; if 0 rows matched (id AND version), it throws OptimisticLockException"
      - "It relies on a database trigger to reject the change"
    answer: 2
    explanation: |
      The versioned UPDATE's WHERE clause includes the expected version. If the
      affected row count comes back 0, the version no longer matches (a concurrent
      commit moved it), so Hibernate raises OptimisticLockException /
      StaleObjectStateException. No extra SELECT is needed.
    ref: "concepts.md#optimistic-locking-at-flush-version-and-the-where-predicate"

  - id: transactions-dirty-checking-flushing-051
    difficulty: expert
    tags: [batch-versioned-data, success-no-info, driver]
    question: |
      Why is batching of @Version entities gated behind
      hibernate.batch_versioned_data, and what driver behavior can still defeat it?
    options:
      - "Versioned rows cannot be batched by the SQL standard"
      - "The version column must be a Timestamp to be batched"
      - "executeBatch() must return per-row update counts to detect a stale row; some drivers return Statement.SUCCESS_NO_INFO (-2), which hides the 0-count and defeats stale detection"
      - "Batching versioned data disables the second-level cache"
    answer: 2
    explanation: |
      Optimistic-lock detection needs the exact affected-row count per statement.
      JDBC executeBatch() may return SUCCESS_NO_INFO (-2) for some drivers, so
      Hibernate cannot tell a stale (0-row) update apart from a successful one.
      That is why versioned batching is opt-in and only safe when the driver
      reports real counts.
    ref: "concepts.md#optimistic-locking-at-flush-version-and-the-where-predicate"

  - id: transactions-dirty-checking-flushing-052
    difficulty: advanced
    tags: [version, increment-timing]
    question: |
      When is a @Version field's value actually incremented?
    options:
      - "On each setter call to any field"
      - "At flush, when the versioned UPDATE (or a forced increment) is executed"
      - "When the entity is loaded"
      - "Immediately when em.persist() is called"
    answer: 1
    explanation: |
      The version increments as part of the flush-time UPDATE, not per setter.
      Reading entity.getVersion() after mutating but before flush shows the old
      value; the new value is visible only after the flush executes.
    ref: "concepts.md#optimistic-locking-at-flush-version-and-the-where-predicate"

  - id: transactions-dirty-checking-flushing-053
    difficulty: expert
    tags: [versionless, optimistic-locking-dirty, dynamic-update]
    question: |
      An entity is mapped @OptimisticLocking(type = OptimisticLockType.DIRTY) with
      @DynamicUpdate. You change only its `name`. What WHERE clause guards the
      UPDATE?
    options:
      - "where id=? (no optimistic predicate)"
      - "where id=? and version=?"
      - "where id=? and name=? (the previously loaded name value)"
      - "where id=? and <every column>=<old value>"
    answer: 2
    explanation: |
      OptimisticLockType.DIRTY builds the WHERE clause from the changed columns'
      previously loaded values, so it becomes WHERE id=? AND name=<old name>. It
      requires @DynamicUpdate because only the dirty columns are known at flush.
      ALL would use every column; VERSION would use a @Version column.
    ref: "concepts.md#versionless-implicit-optimistic-locking"

  - id: transactions-dirty-checking-flushing-054
    difficulty: expert
    tags: [versionless, read-only, snapshot]
    question: |
      Why does loading an entity in read-only mode disable versionless
      (OptimisticLockType.DIRTY/ALL) optimistic locking?
    options:
      - "Read-only entities are stored only in the second-level cache"
      - "Read-only mode skips the loaded-state snapshot, so there are no old column values to place in the WHERE clause"
      - "Versionless locking requires FlushMode.ALWAYS, which read-only forbids"
      - "Read-only mode converts the entity to a native query result"
    answer: 1
    explanation: |
      Versionless locking builds its WHERE predicate from the loaded-state
      snapshot (getLoadedState()). Read-only mode does not keep that snapshot, so
      there are no expected old values to compare — the mechanism cannot operate.
      A dedicated @Version column does not depend on the snapshot.
    ref: "concepts.md#versionless-implicit-optimistic-locking"

  - id: transactions-dirty-checking-flushing-055
    difficulty: advanced
    tags: [optimistic-lock-excluded, version]
    question: |
      A Product has a `viewCount` column that changes constantly. You annotate it
      @OptimisticLock(excluded = true). What is the effect?
    options:
      - "viewCount is never persisted"
      - "viewCount becomes read-only"
      - "Changes to viewCount neither bump the @Version nor appear in the optimistic-lock WHERE predicate, so they don't cause spurious conflicts"
      - "It forces a pessimistic lock on the row"
    answer: 2
    explanation: |
      @OptimisticLock(excluded = true) removes a field from optimistic-lock
      accounting: mutating it does not increment the version or add to the
      versionless WHERE clause. This avoids treating a high-churn counter as a
      concurrency conflict.
    ref: "concepts.md#versionless-implicit-optimistic-locking"

  - id: transactions-dirty-checking-flushing-056
    difficulty: expert
    tags: [lock-mode, force-increment, aggregate-root]
    question: |
      Only a child (PostComment) is inserted, but you need to lock its parent
      (Post) so two concurrent comment inserts serialize on the aggregate root.
      Which lock mode achieves this?
    options:
      - "LockModeType.OPTIMISTIC on the child"
      - "LockModeType.PESSIMISTIC_READ on the child"
      - "LockModeType.OPTIMISTIC_FORCE_INCREMENT on the parent"
      - "LockModeType.NONE — dirty checking handles it"
    answer: 2
    explanation: |
      Inserting a child does not dirty the parent, so no version bump would occur.
      OPTIMISTIC_FORCE_INCREMENT on the parent forces an UPDATE ... version=version+1
      at flush, serializing concurrent child changes against the aggregate root's
      version. Plain OPTIMISTIC only checks, and would not bump without a change.
    ref: "concepts.md#lockmodetypeoptimistic-vs-optimistic_force_increment"

  - id: transactions-dirty-checking-flushing-057
    difficulty: expert
    tags: [lock-mode, optimistic, version-check]
    question: |
      You em.find(Post.class, id, LockModeType.OPTIMISTIC) and only READ the
      entity (no changes). What does Hibernate do at flush?
    options:
      - "Nothing — no statement is emitted for an unmodified entity"
      - "Schedules a version check at flush to verify the entity wasn't concurrently modified, even though you only read it"
      - "Increments the version"
      - "Acquires a database row lock immediately at find()"
    answer: 1
    explanation: |
      LockModeType.OPTIMISTIC (a.k.a. READ) requests a version *check* at flush
      even for entities you only read, ensuring the data you based decisions on
      was not changed concurrently. It does not bump the version (that is
      OPTIMISTIC_FORCE_INCREMENT) and does not take a DB lock at find.
    ref: "concepts.md#lockmodetypeoptimistic-vs-optimistic_force_increment"

  - id: transactions-dirty-checking-flushing-058
    difficulty: expert
    tags: [custom-dirtiness, interceptor, override]
    question: |
      A staff engineer wants to replace Hibernate's field-by-field snapshot diff
      with a domain-specific "isChanged" flag. Which extension point is designed
      for this?
    options:
      - "Override equals()/hashCode() on the entity"
      - "Annotate the entity with @DynamicUpdate"
      - "Set FlushMode.MANUAL"
      - "Register a CustomEntityDirtinessStrategy via hibernate.entity_dirtiness_strategy (or implement Interceptor.findDirty)"
    answer: 3
    explanation: |
      CustomEntityDirtinessStrategy (configured through
      hibernate.entity_dirtiness_strategy) lets you supply your own isDirty/findDirty
      logic; alternatively Interceptor.findDirty(...) can return the dirty-property
      indices. Both confirm the snapshot comparison is a pluggable default, not
      the only option.
    ref: "concepts.md#customizing-dirty-detection-interceptor-and-strategy-hooks"

  - id: transactions-dirty-checking-flushing-059
    difficulty: advanced
    tags: [dynamic-insert, db-default, generated-sql]
    question: |
      An entity is annotated @DynamicInsert and has columns with DB DEFAULT values.
      You persist an instance leaving those fields null. What happens?
    options:
      - "The INSERT omits the null columns, so the database applies its DEFAULT values"
      - "Hibernate inserts explicit NULLs, overriding the DB defaults"
      - "Persist throws because non-null DB defaults require values"
      - "Hibernate reads the defaults first with a SELECT, then inserts them"
    answer: 0
    explanation: |
      @DynamicInsert generates the INSERT with only the non-null columns, so the
      omitted columns fall through to their DB DEFAULT. The trade-off is that
      Hibernate can no longer reuse one cached INSERT statement per entity type.
    ref: "concepts.md#dynamicinsert-and-dynamicupdate"

  - id: transactions-dirty-checking-flushing-060
    difficulty: advanced
    tags: [dynamic-update, dynamic-insert, tradeoff]
    question: |
      What is the shared cost of using @DynamicInsert and @DynamicUpdate?
    options:
      - "They disable dirty checking"
      - "They require FlushMode.ALWAYS"
      - "Hibernate can no longer reuse a single pre-generated cached SQL statement per entity type — it builds SQL per operation based on participating columns"
      - "They force EAGER loading of all associations"
    answer: 2
    explanation: |
      Both trade the cached, all-column pre-generated statement for per-operation
      SQL built from whichever columns participate (non-null for insert, changed
      for update). That reduces prepared-statement/cache reuse and adds CPU, so
      they are opt-in for wide tables, DB defaults, or column triggers.
    ref: "concepts.md#dynamicinsert-and-dynamicupdate"

  - id: transactions-dirty-checking-flushing-061
    difficulty: expert
    tags: [native-query, auto-flush, synchronized-space]
    question: |
      A native SQL SELECT returns stale data despite pending changes to Task in
      the same transaction under AUTO mode. Besides calling flush(), what is the
      idiomatic fix?
    options:
      - "Switch the entity to @DynamicUpdate"
      - "Set FlushModeType.COMMIT on the query"
      - "Clear the persistence context before the query"
      - "Call query.addSynchronizedEntityClass(Task.class) (or addSynchronizedQuerySpace/EntityName) so AUTO knows the query touches Task's table and flushes first"
    answer: 3
    explanation: |
      AUTO can't infer a native query's tables. Declaring them via
      addSynchronizedEntityClass / addSynchronizedEntityName / addSynchronizedQuerySpace
      tells Hibernate which query spaces the native query touches, so it auto-flushes
      overlapping pending changes (and scopes 2nd-level cache invalidation). An
      explicit flush() is the blunt alternative.
    ref: "concepts.md#making-auto-flush-work-for-native-queries"

  - id: transactions-dirty-checking-flushing-062
    difficulty: advanced
    tags: [native-query, query-space, cache-invalidation]
    question: |
      Beyond triggering AUTO flush, what else does declaring synchronized query
      spaces on a native query affect?
    options:
      - "It changes the transaction isolation level"
      - "It scopes which second-level cache regions get invalidated by the native statement"
      - "It converts the native query to JPQL"
      - "It enables optimistic locking on the result rows"
    answer: 1
    explanation: |
      The synchronized query spaces tell Hibernate which tables the native query
      touches, which is used both to decide AUTO flushing and to invalidate the
      matching second-level cache regions after a native DML/read, keeping the
      cache consistent.
    ref: "concepts.md#making-auto-flush-work-for-native-queries"

  - id: transactions-dirty-checking-flushing-063
    difficulty: expert
    tags: [hb7, query-flush-mode, api]
    question: |
      In Hibernate 7 / Jakarta Persistence 3.2, which per-query flush API is
      current, and which is deprecated?
    options:
      - "setQueryFlushMode(QueryFlushMode) is current; setFlushMode(FlushModeType) on the query is deprecated"
      - "setFlushMode(FlushModeType) is current; setQueryFlushMode is removed"
      - "Both are removed; you must use session-level flush mode only"
      - "flush(boolean) is the new per-query API"
    answer: 0
    explanation: |
      HB7 deprecates CommonQueryContract.setFlushMode(FlushModeType) in favor of
      setQueryFlushMode(QueryFlushMode) (values like FLUSH / NO_FLUSH). Citing the
      old query.setFlushMode(...) signals HB5-era knowledge.
    ref: "concepts.md#queryflushmode-the-hb7--jpa-32-api-shift"

  - id: transactions-dirty-checking-flushing-064
    difficulty: expert
    tags: [stateless-session, dirty-checking, update]
    question: |
      Using a StatelessSession, you load an entity, mutate a field, and commit
      without calling anything else. What is written?
    options:
      - "An UPDATE, via dirty checking as in a normal Session"
      - "An INSERT, because the entity is treated as transient"
      - "A merge is performed automatically at commit"
      - "Nothing — StatelessSession has no persistence context or dirty checking; you must call session.update() explicitly"
    answer: 3
    explanation: |
      StatelessSession has no persistence context, no first-level cache, and no
      dirty checking. Entities are detached; a mutation is invisible unless you
      call update() explicitly. It also does no cascade or automatic @Version
      increment.
    ref: "concepts.md#statelesssession-the-batchetl-tool-and-hb7-changes"

  - id: transactions-dirty-checking-flushing-065
    difficulty: expert
    tags: [hb7, stateless-session, batch-size]
    question: |
      After upgrading to Hibernate 7, StatelessSession batch inserts stopped
      batching even though hibernate.jdbc.batch_size=50 is configured. Why, and
      what is the fix?
    options:
      - "HB7 removed batching; there is no fix"
      - "In HB7 the global hibernate.jdbc.batch_size no longer applies to StatelessSession; set it per-session with statelessSession.setJdbcBatchSize(50)"
      - "You must annotate the entity @DynamicInsert"
      - "batch_size only works with IDENTITY ids in HB7"
    answer: 1
    explanation: |
      HB7 decoupled StatelessSession from the global hibernate.jdbc.batch_size
      property; you now configure it explicitly via setJdbcBatchSize(int) on the
      stateless session. This is a common post-upgrade surprise.
    ref: "concepts.md#statelesssession-the-batchetl-tool-and-hb7-changes"

  - id: transactions-dirty-checking-flushing-066
    difficulty: advanced
    tags: [hb7, stateless-session, second-level-cache]
    question: |
      In Hibernate 7, how does StatelessSession interact with the second-level
      cache by default, and how do you opt out?
    options:
      - "It never uses the second-level cache; there is no way to enable it"
      - "It always evicts the entire cache on commit"
      - "It uses the second-level cache by default; set CacheMode.IGNORE to keep ETL traffic out of the cache"
      - "It requires @Cacheable on every entity to use the cache"
    answer: 2
    explanation: |
      A HB7 change: StatelessSession now uses the second-level cache by default.
      For bulk/ETL jobs where you don't want to pollute the cache, set
      CacheMode.IGNORE. Earlier versions bypassed the L2 cache in stateless mode.
    ref: "concepts.md#statelesssession-the-batchetl-tool-and-hb7-changes"

  - id: transactions-dirty-checking-flushing-067
    difficulty: expert
    tags: [batch-job, stateless-vs-flush-clear, tradeoff]
    question: |
      For a 1M-row job, what is the key trade-off between StatelessSession and a
      stateful Session with periodic flush()+clear()?
    options:
      - "StatelessSession is always slower and should be avoided"
      - "StatelessSession avoids snapshot growth and per-entity dirty checks but gives up cascade, versioning, and dirty checking (you manage everything); flush()+clear() keeps those features but you must size batches and clear to bound memory"
      - "flush()+clear() commits after each batch, StatelessSession does not"
      - "There is no difference; both keep a full persistence context"
    answer: 1
    explanation: |
      StatelessSession has no persistence context, so no snapshot accumulation or
      dirty-check cost — but you forgo cascade, automatic versioning, and dirty
      checking. A stateful session with flush()+clear() retains those ORM features
      while requiring you to periodically clear to prevent unbounded context growth.
    ref: "concepts.md#statelesssession-the-batchetl-tool-and-hb7-changes"

  - id: transactions-dirty-checking-flushing-068
    difficulty: advanced
    tags: [exception-mapping, constraint-violation, spring]
    question: |
      A unique-constraint violation occurs during the commit-time flush in a
      Spring app. Which describes the typical exception wrapping chain?
    options:
      - "The raw SQLException propagates unchanged to the controller"
      - "SQLIntegrityConstraintViolationException → Hibernate ConstraintViolationException → JPA RollbackException/PersistenceException → Spring DataIntegrityViolationException"
      - "It is silently swallowed and the row is skipped"
      - "It surfaces as a LazyInitializationException"
    answer: 1
    explanation: |
      The driver's SQLIntegrityConstraintViolationException is wrapped by
      Hibernate's ConstraintViolationException, surfaced at commit as a JPA
      RollbackException/PersistenceException, and translated by Spring into a
      DataIntegrityViolationException. Because it fires at commit, it can appear
      far from the offending line — a reason to flush() early while debugging.
    ref: "concepts.md#flush-time-failure-modes-and-exception-mapping"

  - id: transactions-dirty-checking-flushing-069
    difficulty: expert
    tags: [hb7, cascade, detached, entity-exists]
    question: |
      In Hibernate 7 / JPA 3.2, you flush a managed entity whose CascadeType.PERSIST
      association points at a DETACHED instance. What now happens, and how do you
      fix it?
    options:
      - "It silently persists a duplicate; no fix needed"
      - "It throws EntityExistsException at flush; fix by merge()-ing the association or using em.getReference(...) instead of a detached object"
      - "It re-attaches the detached instance automatically"
      - "It ignores the association entirely"
    answer: 1
    explanation: |
      HB7/JPA 3.2 tightened this case: cascading PERSIST/ALL to a detached
      instance now throws EntityExistsException at flush rather than silently
      handling it. Use merge() to bring the association into the context, or set
      the association via em.getReference(id) to reference the existing row.
    ref: "concepts.md#flush-time-failure-modes-and-exception-mapping"

  - id: transactions-dirty-checking-flushing-070
    difficulty: advanced
    tags: [hb7, cascade-removed, save-update]
    question: |
      Which cascade type was removed in Hibernate 7, and what should replace it?
    options:
      - "CascadeType.REMOVE — replace with orphanRemoval"
      - "CascadeType.PERSIST — replace with MERGE"
      - "CascadeType.SAVE_UPDATE (a legacy Hibernate-only cascade) — replace with PERSIST/MERGE"
      - "CascadeType.ALL — replace with explicit lists"
    answer: 2
    explanation: |
      The legacy Hibernate-specific CascadeType.SAVE_UPDATE was removed in HB7.
      Use the standard JPA cascades PERSIST and MERGE to cover the same intent.
    ref: "concepts.md#flush-time-failure-modes-and-exception-mapping"

  - id: transactions-dirty-checking-flushing-071
    difficulty: intermediate
    tags: [version-vs-versionless, distinction]
    question: |
      What is the key difference between a dedicated @Version column and versionless
      @OptimisticLocking(type=DIRTY)?
    options:
      - "@Version works within a single tx only; versionless works across detach/merge"
      - "They are identical in behavior"
      - "@Version uses a dedicated version column checked in the WHERE clause and survives detach/merge across transactions; versionless builds the WHERE from the loaded-state snapshot and only guards within the loaded-to-flush window"
      - "Versionless locking is a database feature, not a Hibernate one"
    answer: 2
    explanation: |
      @Version stores an explicit version and can detect conflicts even across
      detach/merge and separate transactions. Versionless (DIRTY/ALL) relies on
      the in-memory loaded-state snapshot for old values, so it only works while
      that snapshot exists (loaded-to-flush) and breaks under read-only mode.
    ref: "concepts.md#versionless-implicit-optimistic-locking"

  - id: transactions-dirty-checking-flushing-072
    difficulty: intermediate
    tags: [read-only, version-check, gotcha]
    question: |
      "Why does readOnly=true silently swallow my mutation, and does it also skip
      the @Version check?" Which is the most accurate answer?
    options:
      - "It swallows the mutation because there's no snapshot/flush; a dedicated @Version column still guards concurrent updates on writes that DO flush, but versionless (snapshot-based) locking is disabled with no snapshot"
      - "It swallows the mutation and disables all optimistic locking including @Version permanently"
      - "It does not swallow mutations; readOnly only affects the second-level cache"
      - "It throws an exception on any mutation"
    answer: 0
    explanation: |
      Read-only mode skips the dirty-check snapshot and auto-flush, so an
      in-place mutation is never written. Versionless locking, which needs the
      snapshot's old values, is therefore disabled; a dedicated @Version column
      does not depend on the snapshot and still applies to writes that are flushed.
    ref: "concepts.md#read-only-transactions-and-optimization"

  - id: transactions-dirty-checking-flushing-073
    difficulty: expert
    tags: [connection-handling, immediate-acquisition, legacy]
    question: |
      Which hibernate.connection.handling_mode value reproduces the legacy
      behavior of grabbing a connection at session open and holding it until the
      session closes?
    options:
      - "DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION"
      - "DELAYED_ACQUISITION_AND_RELEASE_AFTER_STATEMENT"
      - "IMMEDIATE_ACQUISITION_AND_HOLD"
      - "DELAYED_ACQUISITION_AND_HOLD"
    answer: 2
    explanation: |
      IMMEDIATE_ACQUISITION_AND_HOLD acquires the connection eagerly at session
      open and holds it for the whole session — the legacy pre-delayed behavior.
      The modern defaults (DELAYED_*) defer acquisition to the first statement,
      which is what enables connection-frugal read-only/compute methods.
    ref: "concepts.md#when-a-transaction-actually-acquires-a-jdbc-connection"
