topic: "Inheritance, Embeddables & Composite Keys"
domain: hibernate-jpa
topic_slug: inheritance-embeddables-composite-keys
version: 1
questions:
  - id: inheritance-embeddables-composite-keys-001
    difficulty: beginner
    tags: [inheritance, single-table, defaults]
    question: |
      You annotate the root entity with `@Inheritance` but specify no `strategy`.
      Which inheritance strategy does JPA use?
    options: ["SINGLE_TABLE", "JOINED", "TABLE_PER_CLASS", "There is no default; boot fails"]
    answer: 0
    explanation: |
      `SINGLE_TABLE` is the default `InheritanceType`. The whole hierarchy is stored in one
      table distinguished by a discriminator column. It is the fastest strategy because it
      never joins across class tables.
    ref: "concepts.md#inheritance-mapping-the-big-picture"

  - id: inheritance-embeddables-composite-keys-002
    difficulty: beginner
    tags: [single-table, not-null, gotcha]
    question: |
      Under `SINGLE_TABLE`, why can a column that belongs only to a subclass generally not
      be declared `NOT NULL`?
    options: ["Hibernate forbids NOT NULL on any mapped column", "The discriminator column already enforces nullability", "Rows of sibling subtypes share the table and leave that column NULL", "NOT NULL is only allowed on the primary key"]
    answer: 2
    explanation: |
      All subtypes share one physical table. A row of a different subtype has no value for
      that column, so it is stored as NULL. A `NOT NULL` constraint would reject those rows,
      so the constraint cannot be applied — you lose DB-level enforcement of mandatory
      subclass fields.
    ref: "concepts.md#single_table-strategy"

  - id: inheritance-embeddables-composite-keys-003
    difficulty: beginner
    tags: [discriminator, defaults]
    question: |
      What is the default name and type of the discriminator column when you don't configure
      `@DiscriminatorColumn`?
    options: ["`TYPE`, of INTEGER type", "`DTYPE`, of STRING (VARCHAR) type", "`CLASS`, of CHAR type", "`DISCRIMINATOR`, of BOOLEAN type"]
    answer: 1
    explanation: |
      JPA's default discriminator column is named `DTYPE` with a `STRING`
      (`DiscriminatorType.STRING`) type, and the default `@DiscriminatorValue` is the entity
      name.
    ref: "concepts.md#discriminatorcolumn--discriminatorvalue"

  - id: inheritance-embeddables-composite-keys-004
    difficulty: intermediate
    tags: [joined, sql, mechanism]
    question: |
      Under the `JOINED` strategy, how does Hibernate load a single subclass instance by id?
    options: ["A single SELECT on the subclass table only", "A UNION across all subclass tables", "A JOIN of the root table and the subclass table on the shared primary key", "One SELECT per column of the entity"]
    answer: 2
    explanation: |
      With `JOINED`, the subclass row is split across the root table (shared columns) and the
      subclass table (own columns), sharing a PK that is also a FK. Hibernate reconstructs
      the object with a join on that shared key, e.g.
      `SELECT ... FROM payment p JOIN card_payment c ON p.id = c.payment_id WHERE p.id = ?`.
    ref: "concepts.md#joined-strategy"

  - id: inheritance-embeddables-composite-keys-005
    difficulty: intermediate
    tags: [table-per-class, polymorphic, sql]
    question: |
      A polymorphic query `select p from Payment p` under `TABLE_PER_CLASS` typically
      generates which kind of SQL?
    options: ["A single-table SELECT with a discriminator filter", "A UNION ALL across the concrete subclass tables", "A nested correlated subquery per subclass", "A CROSS JOIN of all subclass tables"]
    answer: 1
    explanation: |
      Because each concrete class has its own standalone table with no shared parent table,
      Hibernate must combine rows from every concrete table using `UNION ALL` to answer a
      polymorphic query — one of the reasons the strategy is discouraged.
    ref: "concepts.md#table_per_class-strategy"

  - id: inheritance-embeddables-composite-keys-006
    difficulty: advanced
    tags: [table-per-class, id-generation, gotcha]
    question: |
      Why is `GenerationType.IDENTITY` effectively unusable with `TABLE_PER_CLASS`?
    options: ["Ids must be unique across all sibling concrete tables, which per-table IDENTITY columns cannot guarantee", "IDENTITY is not supported by any database", "TABLE_PER_CLASS forbids any generated id", "IDENTITY requires a discriminator column, which TABLE_PER_CLASS lacks"]
    answer: 0
    explanation: |
      A polymorphic reference or query treats all concrete tables as one logical type, so ids
      must be unique across every subclass table. Independent per-table IDENTITY sequences
      would collide, so a `SEQUENCE` or `TABLE` generator (shared across the hierarchy) is
      required instead.
    ref: "concepts.md#table_per_class-strategy"

  - id: inheritance-embeddables-composite-keys-007
    difficulty: intermediate
    tags: [single-table, performance, judgment]
    question: |
      For a small class hierarchy that is read-heavy, has mostly-optional subclass fields, and
      needs the fastest polymorphic queries, which strategy is the best default?
    options: ["JOINED", "TABLE_PER_CLASS", "SINGLE_TABLE", "MappedSuperclass"]
    answer: 2
    explanation: |
      `SINGLE_TABLE` reads any subtype or polymorphic query as a single table scan with no
      joins — the fastest option. The trade-off (NULLable subclass columns) is acceptable
      when those fields are optional anyway.
    ref: "concepts.md#inheritance-strategy-trade-off-table"

  - id: inheritance-embeddables-composite-keys-008
    difficulty: intermediate
    tags: [joined, judgment, integrity]
    question: |
      Your schema requires several subclass-specific columns to be `NOT NULL`, and you want a
      normalized design without wasted NULL columns. Which inheritance strategy fits?
    options: ["SINGLE_TABLE", "TABLE_PER_CLASS", "JOINED", "None can enforce NOT NULL"]
    answer: 2
    explanation: |
      `JOINED` puts each subclass's columns in its own table, so those columns can carry
      `NOT NULL` constraints and there is no NULL waste. The cost is a join per hierarchy
      level on reads and inserts into multiple tables.
    ref: "concepts.md#joined-strategy"

  - id: inheritance-embeddables-composite-keys-009
    difficulty: beginner
    tags: [mapped-superclass, polymorphic]
    question: |
      Given `@MappedSuperclass abstract class Auditable` extended by several entities, can you
      run the query `select a from Auditable a`?
    options: ["No, a @MappedSuperclass is not an entity and supports no polymorphic query", "Yes, it returns all subclass instances polymorphically", "Yes, but only if Auditable has an @Id", "Yes, but it returns only Auditable's own rows"]
    answer: 0
    explanation: |
      `@MappedSuperclass` shares mappings with its subclasses but is not itself an entity: it
      has no table, cannot be queried, and cannot be an association target. Only true
      `@Entity` inheritance supports polymorphic queries over the base type.
    ref: "concepts.md#mappedsuperclass-vs-inheritance"

  - id: inheritance-embeddables-composite-keys-010
    difficulty: intermediate
    tags: [mapped-superclass, judgment]
    question: |
      You want to share `createdAt`/`updatedAt` audit columns across many unrelated entities
      but never need to query or associate over a common base type. What is the cleanest tool?
    options: ["@Inheritance(SINGLE_TABLE) on a shared root entity", "@Embeddable embedded into each entity's id", "@ElementCollection of audit records", "@MappedSuperclass"]
    answer: 3
    explanation: |
      `@MappedSuperclass` reuses column mappings without creating an entity hierarchy or a
      shared table, so you avoid every inheritance-strategy trade-off. Choose real
      `@Inheritance` only when polymorphism (query or association over the base) is required.
    ref: "concepts.md#mappedsuperclass-vs-inheritance"

  - id: inheritance-embeddables-composite-keys-011
    difficulty: beginner
    tags: [embeddable, value-object]
    question: |
      What best describes an `@Embeddable` type such as `Address`?
    options: ["An entity with its own table and primary key", "A collection table keyed by the owner's foreign key", "A second-level cache region", "A value object with no identity, stored as columns in the owning entity's table"]
    answer: 3
    explanation: |
      An embeddable is a value object with no primary key or independent lifecycle. Its fields
      map to columns in the owning entity's table, modeling composition (HAS-A). It is loaded,
      saved, and deleted together with its owner.
    ref: "concepts.md#embeddables-embeddable--embedded"

  - id: inheritance-embeddables-composite-keys-012
    difficulty: intermediate
    tags: [embeddable, one-to-one, distinction]
    question: |
      What is the key difference between embedding an `Address` with `@Embedded` and mapping
      it as a `@OneToOne` associated entity?
    options: ["There is no difference; both create a separate table", "An embeddable has no identity/lifecycle and shares the owner's table; a @OneToOne entity has its own id and table", "@Embedded always creates a join table", "@OneToOne cannot be lazy but @Embedded can"]
    answer: 1
    explanation: |
      An embeddable is a value object folded into the owner's row (no id, no independent
      lifecycle). A `@OneToOne` target is a full entity with its own identity and usually its
      own table, loaded/saved on its own. Two entities embedding the same type do not share a
      row — each has its own copy of the columns.
    ref: "concepts.md#embeddables-embeddable--embedded"

  - id: inheritance-embeddables-composite-keys-013
    difficulty: intermediate
    tags: [attribute-override, embeddable, gotcha]
    question: |
      An `Order` embeds `Address` twice (billing and shipping). Without any extra annotation,
      what happens at startup?
    options: ["Hibernate silently prefixes the second embedding's columns", "Both embeddings map to the same columns, causing a duplicate-column mapping failure", "Only the first embedding is persisted; the second is ignored", "Hibernate creates a separate address table automatically"]
    answer: 1
    explanation: |
      Both embeddings map to the same column names (`street`, `city`, `zip`) on the same
      table, so Hibernate reports a duplicate-column mapping error at boot. You must use
      `@AttributeOverride`/`@AttributeOverrides` to remap one embedding's columns.
    ref: "concepts.md#attributeoverride--multiple-embeddings"

  - id: inheritance-embeddables-composite-keys-014
    difficulty: intermediate
    tags: [attribute-override, embeddable]
    question: |
      Which annotation remaps the column names of an embedded value object for one particular
      embedding?
    options: ["@Column", "@JoinColumn", "@AttributeOverride", "@SecondaryTable"]
    answer: 2
    explanation: |
      `@AttributeOverride` (grouped as `@AttributeOverrides`) remaps the columns of embedded
      attributes for a specific embedding, letting you embed the same type multiple times.
      `@AssociationOverride` does the equivalent for associations inside an embeddable.
    ref: "concepts.md#attributeoverride--multiple-embeddings"

  - id: inheritance-embeddables-composite-keys-015
    difficulty: intermediate
    tags: [element-collection, mechanism]
    question: |
      What does `@ElementCollection` map?
    options: ["A collection of basic types or embeddables into a separate collection table owned by the parent", "A collection of entities via a join table", "A many-to-many association between two entities", "A second-level cache collection region"]
    answer: 0
    explanation: |
      `@ElementCollection` persists a `List`/`Set`/`Map` of basic types or embeddables into a
      collection table keyed by the owner's FK. The elements have no identity and their
      lifecycle is entirely owned by the parent entity — not an entity association.
    ref: "concepts.md#elementcollection"

  - id: inheritance-embeddables-composite-keys-016
    difficulty: advanced
    tags: [element-collection, performance, gotcha]
    question: |
      Why can updating a single element of an `@ElementCollection` be surprisingly expensive?
    options: ["Element rows lack a stable primary key, so Hibernate often deletes all rows and re-inserts the whole collection", "Hibernate locks the entire collection table", "Each element triggers a second-level cache eviction", "@ElementCollection is always EAGER, forcing a full reload"]
    answer: 0
    explanation: |
      Element-collection rows have no per-row primary key to target for a fine-grained UPDATE,
      so for many mappings Hibernate deletes all rows for that owner and re-inserts them on any
      change. For large or frequently mutated collections, prefer a real `@OneToMany` child
      entity.
    ref: "concepts.md#elementcollection"

  - id: inheritance-embeddables-composite-keys-017
    difficulty: intermediate
    tags: [element-collection, fetch-default]
    question: |
      What is the default fetch type of an `@ElementCollection`?
    options: ["EAGER", "It depends on the element type", "There is no default", "LAZY"]
    answer: 3
    explanation: |
      Like other collection mappings (`@OneToMany`, `@ManyToMany`), `@ElementCollection`
      defaults to `FetchType.LAZY`. Its `fetch` attribute can be set to `EAGER` but that is
      rarely advisable.
    ref: "concepts.md#elementcollection"

  - id: inheritance-embeddables-composite-keys-018
    difficulty: intermediate
    tags: [embeddedid, composite-key]
    question: |
      With `@EmbeddedId OrderId id`, what must the `OrderId` class be annotated with and
      implement?
    options: ["@Entity, and implement Comparable", "@MappedSuperclass, and implement Cloneable", "@Embeddable, be Serializable, and override equals/hashCode over all key fields", "Nothing special; any POJO works"]
    answer: 2
    explanation: |
      An `@EmbeddedId` key class must be `@Embeddable`, `Serializable`, and override
      `equals`/`hashCode` across all its key fields. Hibernate uses that identity to look the
      entity up in the persistence context.
    ref: "concepts.md#composite-keys-idclass-vs-embeddedid"

  - id: inheritance-embeddables-composite-keys-019
    difficulty: intermediate
    tags: [idclass, composite-key]
    question: |
      When using `@IdClass(OrderId.class)`, how are the key fields declared on the entity
      itself?
    options: ["As a single embedded field of type OrderId", "Each key field is declared directly on the entity, each annotated with @Id", "They are not declared on the entity; only in OrderId", "As a @OneToOne to the OrderId entity"]
    answer: 1
    explanation: |
      With `@IdClass`, the entity declares each key attribute as a top-level field annotated
      `@Id`, and the separate id class mirrors those fields (with `equals`/`hashCode`) for
      lookups like `em.find(Order.class, new OrderId(1L, 42L))`.
    ref: "concepts.md#composite-keys-idclass-vs-embeddedid"

  - id: inheritance-embeddables-composite-keys-020
    difficulty: advanced
    tags: [embeddedid, idclass, judgment]
    question: |
      Which statement reflects modern guidance on choosing between `@EmbeddedId` and
      `@IdClass`?
    options: ["Always use @IdClass; @EmbeddedId is deprecated", "They are interchangeable with no practical differences", "@EmbeddedId cannot be used with @MapsId", "Prefer @EmbeddedId for a cohesive value-object key and clean JPQL; use @IdClass for flat fields or legacy schemas"]
    answer: 3
    explanation: |
      `@EmbeddedId` treats the key as a first-class value object, reads cleanly
      (`o.id.customerId`), and composes well with `@MapsId`. `@IdClass` is favored when you
      want the key columns as plain top-level entity fields or are mapping a legacy design.
      Neither is deprecated.
    ref: "concepts.md#composite-keys-idclass-vs-embeddedid"

  - id: inheritance-embeddables-composite-keys-021
    difficulty: advanced
    tags: [mapsid, shared-primary-key, mechanism]
    question: |
      What does `@MapsId` accomplish on a `@OneToOne` or `@ManyToOne` association?
    options: ["It makes the association EAGER by default", "It cascades all operations to the associated entity", "It maps the association into a join table", "It makes the association's foreign key also serve as (part of) the entity's own primary key — a shared primary key"]
    answer: 3
    explanation: |
      `@MapsId` binds the association's FK to the entity's PK. For a 1:1, the child reuses the
      parent's id as its own (one column instead of a separate surrogate key + FK). For a
      composite key, `@MapsId("customerId")` populates that key part from the associated
      entity.
    ref: "concepts.md#mapsid--shared-primary-key"

  - id: inheritance-embeddables-composite-keys-022
    difficulty: advanced
    tags: [mapsid, one-to-one, judgment]
    question: |
      A `UserProfile` should always share the exact primary key value of its `User` (a true
      1:1). Which mapping expresses this most idiomatically?
    options: ["A @OneToOne with its own @GeneratedValue id and a separate FK column", "A @OneToOne annotated with @MapsId so the profile's PK equals the user's id", "An @ElementCollection of user references", "@Inheritance(JOINED) between User and UserProfile"]
    answer: 1
    explanation: |
      `@MapsId` on the `@OneToOne` makes `UserProfile.id` equal `User.id` (FK == PK). This
      enforces the 1:1 with a single shared key column and avoids a redundant surrogate key
      plus FK.
    ref: "concepts.md#mapsid--shared-primary-key"

  - id: inheritance-embeddables-composite-keys-023
    difficulty: advanced
    tags: [equals-hashcode, identity, gotcha]
    question: |
      Why is basing an entity's `equals`/`hashCode` on a database-generated `@Id` value
      dangerous when the entity is stored in a `HashSet` before being persisted?
    options: ["Generated ids are always negative before flush", "HashSet does not allow null-id elements", "Hibernate recomputes hashCode automatically, corrupting the set", "The id is null when transient, so after persist() assigns an id the hash bucket changes and the entity can 'disappear' from the set"]
    answer: 3
    explanation: |
      A transient entity has `id == null`; once `persist()` assigns the id, `hashCode` changes,
      so the element sits in the wrong bucket and lookups/removals fail. The fix is a stable
      hash — a natural/business key or a constant `hashCode` with id-based `equals` guarded for
      null.
    ref: "concepts.md#equals--hashcode-with-composite-keys"

  - id: inheritance-embeddables-composite-keys-024
    difficulty: advanced
    tags: [equals-hashcode, best-practice]
    question: |
      Which approach to entity `equals`/`hashCode` keeps the hash stable across the entity's
      whole lifecycle?
    options: ["Derive both from all mutable business fields", "Use a natural/business key, or a constant hashCode with an id-based, null-guarded equals", "Use the generated surrogate id directly in hashCode", "Do not override them; rely on Object identity only"]
    answer: 1
    explanation: |
      A stable hash must not change as the entity moves through transient → managed. A
      business key (immutable) gives that; failing that, a constant `hashCode` combined with an
      id-based `equals` (null-guarded so a transient instance equals only itself) is the common
      recommendation. Mutable fields and raw generated ids both break stability.
    ref: "concepts.md#equals--hashcode-with-composite-keys"

  - id: inheritance-embeddables-composite-keys-025
    difficulty: intermediate
    tags: [discriminator, sql, mechanism]
    question: |
      Under `SINGLE_TABLE` with discriminator column `payment_type`, what does Hibernate add
      to the SQL when you query only `from CardPayment`?
    options: ["A `WHERE payment_type = 'CARD'` predicate", "A JOIN to a card_payment table", "A UNION with the other subtypes", "Nothing; it scans and filters in memory"]
    answer: 0
    explanation: |
      Because all subtypes share one table, Hibernate restricts a subtype query with the
      discriminator value, e.g. `SELECT ... FROM payment WHERE payment_type = 'CARD'`, and
      reads the discriminator to instantiate the correct class on polymorphic reads.
    ref: "concepts.md#discriminatorcolumn--discriminatorvalue"

  - id: inheritance-embeddables-composite-keys-026
    difficulty: intermediate
    tags: [joined, insert, mechanism]
    question: |
      Under `JOINED`, how many INSERT statements does persisting one `CardPayment` (subclass
      of `Payment`) typically produce?
    options: ["Two — one into the root `payment` table and one into the `card_payment` table", "One, into a single shared table", "One per column", "Three — root, subclass, and discriminator tables"]
    answer: 0
    explanation: |
      With `JOINED`, the entity's data is split across the root and subclass tables, so a
      persist issues an INSERT into each: the shared columns into `payment` and the
      subclass-specific columns into `card_payment` (linked by the shared PK/FK).
    ref: "concepts.md#joined-strategy"

  - id: inheritance-embeddables-composite-keys-027
    difficulty: intermediate
    tags: [single-table, polymorphic, performance]
    question: |
      Which is the strongest performance advantage of `SINGLE_TABLE` for polymorphic queries?
    options: ["It stores no NULL values", "It uses UNION for efficiency", "It requires no joins across class tables — the whole hierarchy is one table", "It automatically caches every row in the second-level cache"]
    answer: 2
    explanation: |
      Since every subtype lives in one table, a polymorphic query is a single table scan with
      no joins or unions — the fastest read profile of the three strategies. The cost is
      sparse NULL columns and no `NOT NULL` on subclass fields.
    ref: "concepts.md#inheritance-strategy-trade-off-table"

  - id: inheritance-embeddables-composite-keys-028
    difficulty: advanced
    tags: [table-per-class, association, gotcha]
    question: |
      Which limitation is specific to `TABLE_PER_CLASS` compared to the other two strategies?
    options: ["It cannot use a discriminator value", "It cannot store subclass-specific columns", "It requires all subclass columns to be NULLable", "A polymorphic foreign key / association to the base type is hard to express, and IDENTITY generation is unusable"]
    answer: 3
    explanation: |
      With no shared parent table, a foreign key that references 'any subtype' cannot be a
      simple FK, polymorphic queries need `UNION`s, and identity generation must be shared
      (making `IDENTITY` unusable). These combine to make the strategy generally undesirable.
    ref: "concepts.md#table_per_class-strategy"

  - id: inheritance-embeddables-composite-keys-029
    difficulty: intermediate
    tags: [embeddable, records, hibernate6]
    question: |
      In Hibernate 6+, can a Java `record` be used as an embeddable value type?
    options: ["No, records are never supported by Hibernate", "Only if the record implements Serializable and Comparable", "Yes, but it must still be annotated (treated as) @Embeddable", "Only for @Id fields, not for embedded value objects"]
    answer: 2
    explanation: |
      Hibernate 6 added support for Java records as embeddable value types, but the type must
      still be treated as an `@Embeddable`. Records suit value objects because they are
      immutable, matching the value-semantics of embeddables.
    ref: "concepts.md#embeddables-embeddable--embedded"

  - id: inheritance-embeddables-composite-keys-030
    difficulty: advanced
    tags: [n-plus-one, inheritance, scenario]
    question: |
      Under `JOINED`, a polymorphic query loads roots and then each subclass row is fetched
      lazily one-by-one. Which technique best collapses this into fewer round trips?
    options: ["Use JOIN FETCH or an entity graph to load the needed data in one statement", "Switch every association to EAGER", "Increase the connection pool size", "Add a second-level cache to the root entity only"]
    answer: 0
    explanation: |
      The classic N+1 fix — `JOIN FETCH` or a JPA entity graph — instructs Hibernate to fetch
      the related rows in a single query rather than firing a follow-up per row. Making
      everything EAGER causes its own over-fetching problems. See
      `fetching-lazy-eager-n-plus-one` for the full treatment.
    ref: "concepts.md#polymorphic-queries--n1-with-inheritance"

  - id: inheritance-embeddables-composite-keys-031
    difficulty: beginner
    tags: [mapsid, composite-key]
    question: |
      With a composite `@EmbeddedId`, using `@MapsId("customerId")` on a `@ManyToOne` means
      that key part is:
    options: ["Set manually by the application on every persist", "Ignored during identity comparison", "Derived automatically from the associated entity's key", "Stored in a separate collection table"]
    answer: 2
    explanation: |
      `@MapsId("customerId")` tells Hibernate to populate the `customerId` component of the
      embedded id from the associated `@ManyToOne` entity, so you no longer set that key field
      by hand — it is derived from the association.
    ref: "concepts.md#mapsid--shared-primary-key"

  - id: inheritance-embeddables-composite-keys-032
    difficulty: intermediate
    tags: [element-collection, one-to-many, judgment]
    question: |
      You have a large, frequently-mutated collection of value rows attached to an entity.
      Why might a `@OneToMany` to a child entity be preferable to `@ElementCollection`?
    options: ["@ElementCollection cannot be lazy", "Child entities have stable primary keys, enabling row-level inserts/updates/deletes instead of delete-all-and-reinsert", "@OneToMany avoids any join table", "@ElementCollection cannot store embeddables"]
    answer: 1
    explanation: |
      Because element-collection rows have no per-row PK, Hibernate often rewrites the whole
      collection on change. A child entity has its own identity, so Hibernate can target
      individual rows — far cheaper for large or churny collections.
    ref: "concepts.md#elementcollection"

  - id: inheritance-embeddables-composite-keys-033
    difficulty: intermediate
    tags: [discriminator, discriminator-value, defaults]
    question: |
      If a subclass has no `@DiscriminatorValue`, what value does Hibernate store for it under
      `SINGLE_TABLE`?
    options: ["The entity name (default)", "NULL", "The fully-qualified class name", "An auto-incrementing integer"]
    answer: 0
    explanation: |
      The default `@DiscriminatorValue` is the entity name. You can override it (e.g.
      `@DiscriminatorValue("CARD")`) to control the stored token, which is important for stable
      data and for STRING vs INTEGER discriminators.
    ref: "concepts.md#discriminatorcolumn--discriminatorvalue"

  - id: inheritance-embeddables-composite-keys-034
    difficulty: advanced
    tags: [discriminator-formula, hibernate, legacy]
    question: |
      For a legacy schema with no dedicated discriminator column, which Hibernate feature lets
      you derive the type indicator from an SQL expression?
    options: ["@DiscriminatorColumn(nullable = true)", "@SecondaryTable", "@DiscriminatorFormula", "@Formula on the @Id"]
    answer: 2
    explanation: |
      `@DiscriminatorFormula` (a Hibernate extension) computes the discriminator from an SQL
      expression instead of a physical column, which is handy when mapping a `SINGLE_TABLE`
      hierarchy onto a legacy table that lacks a dedicated type column.
    ref: "concepts.md#discriminatorcolumn--discriminatorvalue"

  - id: inheritance-embeddables-composite-keys-035
    difficulty: beginner
    tags: [embeddable, table, ddl]
    question: |
      When `Customer` embeds an `Address` via `@Embedded`, how many tables and joins are
      involved to load a customer with its address?
    options: ["Two tables joined on a foreign key", "A collection table plus the customer table", "Three tables via a many-to-many", "One table, no join — the address columns live on the customer table"]
    answer: 3
    explanation: |
      An embeddable adds its columns to the owning entity's table, so there is one table and no
      join. That is the whole point of composition: no separate identity, no extra table.
    ref: "concepts.md#embeddables-embeddable--embedded"

  - id: inheritance-embeddables-composite-keys-036
    difficulty: advanced
    tags: [equals-hashcode, composite-key, mechanism]
    question: |
      Why does JPA require the id class (whether `@IdClass` or `@EmbeddedId`) to implement
      `equals` and `hashCode`?
    options: ["To support JSON serialization of the key", "Because the database needs it for indexing", "Only to enable the second-level cache", "So Hibernate can use key identity to look entities up in the persistence context and satisfy the identity contract"]
    answer: 3
    explanation: |
      The persistence context maps entities by their identity. Hibernate compares composite
      keys via `equals`/`hashCode`, so a correct implementation over all key fields is
      mandatory for `find`, dirty-check lookups, and the guaranteed one-instance-per-identity
      behavior of the first-level cache.
    ref: "concepts.md#equals--hashcode-with-composite-keys"

  - id: inheritance-embeddables-composite-keys-037
    difficulty: intermediate
    tags: [inheritance, trade-offs, table]
    question: |
      Which strategy stores duplicated (repeated) inherited columns across multiple tables?
    options: ["SINGLE_TABLE", "TABLE_PER_CLASS", "JOINED", "MappedSuperclass entity hierarchy"]
    answer: 1
    explanation: |
      `TABLE_PER_CLASS` gives each concrete class a full table containing both inherited and
      own columns, so inherited columns are duplicated across the concrete tables — a
      denormalized layout that also complicates polymorphic queries.
    ref: "concepts.md#inheritance-strategy-trade-off-table"

  - id: inheritance-embeddables-composite-keys-038
    difficulty: intermediate
    tags: [joined, primary-key-join-column]
    question: |
      In a `JOINED` hierarchy, the primary key of a subclass table is:
    options: ["An independent auto-increment unrelated to the root", "A composite of the discriminator and a sequence", "Always named DTYPE", "Also a foreign key referencing the root table's primary key"]
    answer: 3
    explanation: |
      Each subclass table's PK is also an FK to the root table's PK (customizable via
      `@PrimaryKeyJoinColumn`). This shared key is what the join uses to reassemble a subclass
      instance from the root and subclass rows.
    ref: "concepts.md#joined-strategy"

  - id: inheritance-embeddables-composite-keys-039
    difficulty: advanced
    tags: [embeddable, associations, nesting]
    question: |
      Which statement about embeddable capabilities in JPA/Hibernate 6+ is correct?
    options: ["Embeddables cannot contain associations or be nested", "Embeddables can be nested and can contain their own associations (e.g. a @ManyToOne inside an @Embeddable)", "Embeddables must always be immutable primitives only", "Embeddables always require a discriminator column"]
    answer: 1
    explanation: |
      Embeddables can be nested and can hold their own mapped associations; you use
      `@AssociationOverride` to remap those associations when embedding the same type more than
      once. They still have no identity of their own.
    ref: "concepts.md#attributeoverride--multiple-embeddings"

  - id: inheritance-embeddables-composite-keys-040
    difficulty: expert
    tags: [mapsid, one-to-one, lazy, mechanism]
    question: |
      A unidirectional `@OneToOne` from parent to child (child holds the FK) is notoriously
      hard to make truly lazy. Why does a `@MapsId` shared-PK design help?
    options: ["It forces the association to be EAGER, sidestepping the problem", "@MapsId disables the persistence context for that association", "The child's presence is derivable from its own PK (== parent PK), so Hibernate need not issue a probing query to decide null vs proxy", "It converts the association into an @ElementCollection"]
    answer: 2
    explanation: |
      The lazy-OneToOne problem arises because, without owning the FK, Hibernate must query to
      know whether the other side exists (to return null or a proxy). With `@MapsId`, the
      child shares the parent's PK, so its existence maps to a known key value and the
      proxying/laziness behaves more predictably.
    ref: "concepts.md#mapsid--shared-primary-key"

  - id: inheritance-embeddables-composite-keys-041
    difficulty: beginner
    tags: [inheritance, tables, counting]
    question: |
      For a hierarchy with a root and three subclasses, how many tables does `SINGLE_TABLE`
      create?
    options: ["Two", "One", "Three", "Four"]
    answer: 1
    explanation: |
      `SINGLE_TABLE` uses exactly one table for the entire hierarchy, distinguished by a
      discriminator column — regardless of the number of subclasses.
    ref: "concepts.md#single_table-strategy"

  - id: inheritance-embeddables-composite-keys-042
    difficulty: intermediate
    tags: [element-collection, collection-table]
    question: |
      Which annotation names the table and join column that hold an `@ElementCollection`'s
      rows?
    options: ["@CollectionTable", "@JoinTable", "@SecondaryTable", "@TableGenerator"]
    answer: 0
    explanation: |
      `@CollectionTable(name = ..., joinColumns = @JoinColumn(...))` configures the separate
      table and the FK back to the owner for an `@ElementCollection`. `@JoinTable` is for
      entity associations, not element collections.
    ref: "concepts.md#elementcollection"

  - id: inheritance-embeddables-composite-keys-043
    difficulty: advanced
    tags: [inheritance, judgment, scenario]
    question: |
      A wide hierarchy (10+ subclasses) each adds many mandatory fields, and you rarely run
      polymorphic base-type queries. Which strategy best balances integrity and avoids a huge
      sparse table?
    options: ["JOINED", "SINGLE_TABLE", "TABLE_PER_CLASS", "@Embeddable per subclass"]
    answer: 0
    explanation: |
      `JOINED` keeps each subclass's mandatory columns in its own table (allowing `NOT NULL`)
      and avoids a massive, mostly-NULL single table. Rare polymorphic queries mean the
      per-level join cost is acceptable. `SINGLE_TABLE` would be a sparse-column nightmare
      here.
    ref: "concepts.md#inheritance-strategy-trade-off-table"

  - id: inheritance-embeddables-composite-keys-044
    difficulty: intermediate
    tags: [embeddedid, jpql]
    question: |
      With `@EmbeddedId OrderId id` (fields `customerId`, `orderNo`), how do you reference a
      key part in JPQL?
    options: ["o.customerId", "o.OrderId.customerId", "o.getKey().customerId", "o.id.customerId"]
    answer: 3
    explanation: |
      With `@EmbeddedId`, the key is a single embedded object, so JPQL navigates through it:
      `o.id.customerId`. Under `@IdClass`, the fields are top-level, so it would be
      `o.customerId`.
    ref: "concepts.md#composite-keys-idclass-vs-embeddedid"

  - id: inheritance-embeddables-composite-keys-045
    difficulty: beginner
    tags: [mapped-superclass, table]
    question: |
      Does a `@MappedSuperclass` map to its own database table?
    options: ["Yes, always", "Only if it declares an @Id", "Only under the JOINED strategy", "No — it has no table; its mappings are inherited into each subclass's table"]
    answer: 3
    explanation: |
      `@MappedSuperclass` never has a table. Its column mappings are copied into each
      concrete entity subclass's own table. That is precisely why you cannot query or
      associate over it.
    ref: "concepts.md#mappedsuperclass-vs-inheritance"

  - id: inheritance-embeddables-composite-keys-046
    difficulty: advanced
    tags: [equals-hashcode, mutable, gotcha]
    question: |
      Which practice for entity `equals`/`hashCode` is a genuine anti-pattern?
    options: ["Deriving hashCode from a mutable field that changes during the entity's life", "Using an immutable natural/business key", "Returning a constant hashCode with id-based, null-guarded equals", "Comparing on a business key when one exists"]
    answer: 0
    explanation: |
      Deriving the hash from a mutable field breaks the `hashCode` contract the moment the
      field changes: the entity lands in the wrong `HashSet`/`HashMap` bucket. Stable, ideally
      immutable, identity is required — a natural key or a constant hash with id-based equals.
    ref: "concepts.md#equals--hashcode-with-composite-keys"

  - id: inheritance-embeddables-composite-keys-047
    difficulty: intermediate
    tags: [inheritance, discriminator, joined]
    question: |
      Is a discriminator column required for the `JOINED` strategy?
    options: ["Yes, it is mandatory for JOINED", "No, it is optional for JOINED (required conceptually only for SINGLE_TABLE)", "Only if there are more than two subclasses", "JOINED cannot use a discriminator at all"]
    answer: 1
    explanation: |
      `JOINED` can determine a row's type from which subclass table its join row exists in, so
      a discriminator column is optional (Hibernate can still use one). It is `SINGLE_TABLE`
      that fundamentally needs the discriminator to tell rows apart.
    ref: "concepts.md#discriminatorcolumn--discriminatorvalue"

  - id: inheritance-embeddables-composite-keys-048
    difficulty: expert
    tags: [namespace, jakarta, versions]
    question: |
      In Hibernate 6/7 and Jakarta Persistence 3.1/3.2, which package do inheritance and
      composite-key annotations like `@Inheritance`, `@EmbeddedId`, and `@MapsId` live in?
    options: ["javax.persistence.*", "jakarta.persistence.*", "org.hibernate.annotations.* only", "java.persistence.*"]
    answer: 1
    explanation: |
      Since Jakarta EE 9 the namespace moved from `javax.persistence.*` to
      `jakarta.persistence.*`, and Hibernate 6/7 target the Jakarta namespace. A handful of
      Hibernate-only extensions (e.g. `@DiscriminatorFormula`) live under
      `org.hibernate.annotations`, but the standard annotations here are `jakarta.persistence`.
    ref: "concepts.md#inheritance-mapping-the-big-picture"

  - id: inheritance-embeddables-composite-keys-049
    difficulty: intermediate
    tags: [embeddable, one-to-one, identity, distinction]
    question: |
      Two `Customer` rows each `@Embedded` an identical `Address` (same street/city/zip). In
      the database, do they share the address data?
    options: ["Yes, they reference one shared address row", "Only if the addresses are equal by equals()", "No, each customer stores its own copy of the address columns in its own row", "Only under the JOINED strategy"]
    answer: 2
    explanation: |
      Embeddables have no identity, so there is nothing to share — each owning entity stores
      its own copy of the value columns in its own row. Sharing would require a separate entity
      with its own identity (a `@ManyToOne`/`@OneToOne`).
    ref: "concepts.md#embeddables-embeddable--embedded"

  - id: inheritance-embeddables-composite-keys-050
    difficulty: advanced
    tags: [inheritance, judgment, avoid]
    question: |
      In an interview, when should you actively recommend `TABLE_PER_CLASS`?
    options: ["Rarely — mainly to explain why you would avoid it (UNION polymorphic queries, IDENTITY unusable, hard polymorphic FKs)", "For most hierarchies, as the modern default", "Whenever you need fast polymorphic queries", "Whenever subclass columns must be NOT NULL"]
    answer: 0
    explanation: |
      `TABLE_PER_CLASS` is generally discouraged. A strong candidate names `SINGLE_TABLE` or
      `JOINED` as the real choices and cites `TABLE_PER_CLASS`'s problems — `UNION` polymorphic
      queries, unusable `IDENTITY`, and awkward polymorphic associations — as the reason to
      avoid it.
    ref: "concepts.md#table_per_class-strategy"

  - id: inheritance-embeddables-composite-keys-051
    difficulty: intermediate
    tags: [embeddedid, mapsid, composite]
    question: |
      A `LineItem` has a composite key of `(orderId, productId)` where `orderId` comes from a
      `@ManyToOne Order`. Which combination is idiomatic?
    options: ["@IdClass with a manually-set orderId field on every save", "Two separate @GeneratedValue ids", "@ElementCollection keyed by product", "@EmbeddedId plus @MapsId(\"orderId\") on the @ManyToOne to Order"]
    answer: 3
    explanation: |
      `@EmbeddedId` models the cohesive composite key, and `@MapsId("orderId")` derives the
      `orderId` component from the `@ManyToOne Order` association so you never set it by hand.
      This is the canonical composite-key-with-association mapping.
    ref: "concepts.md#mapsid--shared-primary-key"

  - id: inheritance-embeddables-composite-keys-052
    difficulty: beginner
    tags: [inheritance, mechanism, single-table]
    question: |
      How does Hibernate decide which concrete Java class to instantiate when reading a row
      under `SINGLE_TABLE`?
    options: ["By counting non-null columns", "By the order rows were inserted", "By reading the discriminator column value", "By the primary key range"]
    answer: 2
    explanation: |
      The discriminator column carries the type token for each row; Hibernate reads it and
      instantiates the matching subclass. That is why `SINGLE_TABLE` needs the discriminator
      while `JOINED` can infer type from table membership.
    ref: "concepts.md#discriminatorcolumn--discriminatorvalue"

