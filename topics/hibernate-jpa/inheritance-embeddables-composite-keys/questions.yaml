topic: "Inheritance, Embeddables & Composite Keys"
domain: hibernate-jpa
topic_slug: inheritance-embeddables-composite-keys
version: 1
questions:
  - id: inheritance-embeddables-composite-keys-001
    difficulty: beginner
    tags: [inheritance, single-table, defaults]
    question: |
      You annotate the root entity with `@Inheritance` but specify no `strategy`.
      Which inheritance strategy does JPA use?
    options: ["SINGLE_TABLE", "JOINED", "TABLE_PER_CLASS", "There is no default; boot fails"]
    answer: 0
    explanation: |
      `SINGLE_TABLE` is the default `InheritanceType`. The whole hierarchy is stored in one
      table distinguished by a discriminator column. It is the fastest strategy because it
      never joins across class tables.
    ref: "concepts.md#inheritance-mapping-the-big-picture"

  - id: inheritance-embeddables-composite-keys-002
    difficulty: beginner
    tags: [single-table, not-null, gotcha]
    question: |
      Under `SINGLE_TABLE`, why can a column that belongs only to a subclass generally not
      be declared `NOT NULL`?
    options: ["Hibernate forbids NOT NULL on any column that is not the discriminator", "The discriminator column already enforces nullability", "Rows of sibling subtypes share the table and leave that column NULL", "NOT NULL is only allowed on the primary key and discriminator columns"]
    answer: 2
    explanation: |
      All subtypes share one physical table. A row of a different subtype has no value for
      that column, so it is stored as NULL. A `NOT NULL` constraint would reject those rows,
      so the constraint cannot be applied — you lose DB-level enforcement of mandatory
      subclass fields.
    ref: "concepts.md#single_table-strategy"

  - id: inheritance-embeddables-composite-keys-003
    difficulty: beginner
    tags: [discriminator, defaults]
    question: |
      What is the default name and type of the discriminator column when you don't configure
      `@DiscriminatorColumn`?
    options: ["`TYPE`, of INTEGER type", "`DTYPE`, of STRING (VARCHAR) type", "`CLASS`, of CHAR type", "`DISCRIMINATOR`, of BOOLEAN type"]
    answer: 1
    explanation: |
      JPA's default discriminator column is named `DTYPE` with a `STRING`
      (`DiscriminatorType.STRING`) type, and the default `@DiscriminatorValue` is the entity
      name.
    ref: "concepts.md#discriminatorcolumn--discriminatorvalue"

  - id: inheritance-embeddables-composite-keys-004
    difficulty: intermediate
    tags: [joined, sql, mechanism]
    question: |
      Under the `JOINED` strategy, how does Hibernate load a single subclass instance by id?
    options: ["A single SELECT on the subclass table only, ignoring the root table entirely", "A UNION across all subclass tables filtered by the discriminator column", "A JOIN of the root table and the subclass table on the shared primary key", "One SELECT per column, assembling the entity field by field"]
    answer: 2
    explanation: |
      With `JOINED`, the subclass row is split across the root table (shared columns) and the
      subclass table (own columns), sharing a PK that is also a FK. Hibernate reconstructs
      the object with a join on that shared key, e.g.
      `SELECT ... FROM payment p JOIN card_payment c ON p.id = c.payment_id WHERE p.id = ?`.
    ref: "concepts.md#joined-strategy"

  - id: inheritance-embeddables-composite-keys-005
    difficulty: intermediate
    tags: [table-per-class, polymorphic, sql]
    question: |
      A polymorphic query `select p from Payment p` under `TABLE_PER_CLASS` typically
      generates which kind of SQL?
    options: ["A single-table SELECT with a discriminator filter", "A CROSS JOIN of all subclass tables", "A nested correlated subquery per subclass", "A UNION ALL across the concrete subclass tables"]
    answer: 3
    explanation: |
      Because each concrete class has its own standalone table with no shared parent table,
      Hibernate must combine rows from every concrete table using `UNION ALL` to answer a
      polymorphic query — one of the reasons the strategy is discouraged.
    ref: "concepts.md#table_per_class-strategy"

  - id: inheritance-embeddables-composite-keys-006
    difficulty: advanced
    tags: [table-per-class, id-generation, gotcha]
    question: |
      Why is `GenerationType.IDENTITY` effectively unusable with `TABLE_PER_CLASS`?
    options: ["Ids must be unique across all sibling concrete tables, which per-table IDENTITY columns cannot guarantee", "IDENTITY auto-increment columns are unsupported by every JPA provider except EclipseLink", "TABLE_PER_CLASS forbids any generated id and mandates fully application-assigned keys", "IDENTITY requires a discriminator column, which the TABLE_PER_CLASS layout deliberately lacks"]
    answer: 0
    explanation: |
      A polymorphic reference or query treats all concrete tables as one logical type, so ids
      must be unique across every subclass table. Independent per-table IDENTITY sequences
      would collide, so a `SEQUENCE` or `TABLE` generator (shared across the hierarchy) is
      required instead.
    ref: "concepts.md#table_per_class-strategy"

  - id: inheritance-embeddables-composite-keys-007
    difficulty: intermediate
    tags: [single-table, performance, judgment]
    question: |
      For a small class hierarchy that is read-heavy, has mostly-optional subclass fields, and
      needs the fastest polymorphic queries, which strategy is the best default?
    options: ["JOINED", "TABLE_PER_CLASS", "SINGLE_TABLE", "MappedSuperclass"]
    answer: 2
    explanation: |
      `SINGLE_TABLE` reads any subtype or polymorphic query as a single table scan with no
      joins — the fastest option. The trade-off (NULLable subclass columns) is acceptable
      when those fields are optional anyway.
    ref: "concepts.md#inheritance-strategy-trade-off-table"

  - id: inheritance-embeddables-composite-keys-008
    difficulty: intermediate
    tags: [joined, judgment, integrity]
    question: |
      Your schema requires several subclass-specific columns to be `NOT NULL`, and you want a
      normalized design without wasted NULL columns. Which inheritance strategy fits?
    options: ["SINGLE_TABLE", "TABLE_PER_CLASS", "JOINED", "None can enforce NOT NULL"]
    answer: 2
    explanation: |
      `JOINED` puts each subclass's columns in its own table, so those columns can carry
      `NOT NULL` constraints and there is no NULL waste. The cost is a join per hierarchy
      level on reads and inserts into multiple tables.
    ref: "concepts.md#joined-strategy"

  - id: inheritance-embeddables-composite-keys-009
    difficulty: beginner
    tags: [mapped-superclass, polymorphic]
    question: |
      Given `@MappedSuperclass abstract class Auditable` extended by several entities, can you
      run the query `select a from Auditable a`?
    options: ["No, a @MappedSuperclass is not an entity and supports no polymorphic query", "Yes, it returns all subclass instances polymorphically via a UNION over their tables", "Yes, but only if Auditable declares an @Id and a @DiscriminatorColumn", "Yes, but it returns only Auditable's own rows from its dedicated base table"]
    answer: 0
    explanation: |
      `@MappedSuperclass` shares mappings with its subclasses but is not itself an entity: it
      has no table, cannot be queried, and cannot be an association target. Only true
      `@Entity` inheritance supports polymorphic queries over the base type.
    ref: "concepts.md#mappedsuperclass-vs-inheritance"

  - id: inheritance-embeddables-composite-keys-010
    difficulty: intermediate
    tags: [mapped-superclass, judgment]
    question: |
      You want to share `createdAt`/`updatedAt` audit columns across many unrelated entities
      but never need to query or associate over a common base type. What is the cleanest tool?
    options: ["@Inheritance(SINGLE_TABLE) on a shared root entity", "@Embeddable embedded into each entity's id", "@ElementCollection of audit records", "@MappedSuperclass"]
    answer: 3
    explanation: |
      `@MappedSuperclass` reuses column mappings without creating an entity hierarchy or a
      shared table, so you avoid every inheritance-strategy trade-off. Choose real
      `@Inheritance` only when polymorphism (query or association over the base) is required.
    ref: "concepts.md#mappedsuperclass-vs-inheritance"

  - id: inheritance-embeddables-composite-keys-011
    difficulty: beginner
    tags: [embeddable, value-object]
    question: |
      What best describes an `@Embeddable` type such as `Address`?
    options: ["A full entity with its own table, primary key, and independent lifecycle", "A collection table keyed by the owner's foreign key, holding many child rows", "A second-level cache region that shares the owning entity's lifecycle", "A value object with no identity, stored as columns in the owning entity's table"]
    answer: 3
    explanation: |
      An embeddable is a value object with no primary key or independent lifecycle. Its fields
      map to columns in the owning entity's table, modeling composition (HAS-A). It is loaded,
      saved, and deleted together with its owner.
    ref: "concepts.md#embeddables-embeddable--embedded"

  - id: inheritance-embeddables-composite-keys-012
    difficulty: intermediate
    tags: [embeddable, one-to-one, distinction]
    question: |
      What is the key difference between embedding an `Address` with `@Embedded` and mapping
      it as a `@OneToOne` associated entity?
    options: ["An embeddable has no identity/lifecycle and shares the owner's table; a @OneToOne entity has its own id and table", "There is no difference; both approaches create a separate address table joined by a foreign key", "@Embedded always creates a join table linking the owner row to the embedded columns", "@OneToOne can never be fetched lazily, whereas an @Embedded value object always loads lazily"]
    answer: 0
    explanation: |
      An embeddable is a value object folded into the owner's row (no id, no independent
      lifecycle). A `@OneToOne` target is a full entity with its own identity and usually its
      own table, loaded/saved on its own. Two entities embedding the same type do not share a
      row — each has its own copy of the columns.
    ref: "concepts.md#embeddables-embeddable--embedded"

  - id: inheritance-embeddables-composite-keys-013
    difficulty: intermediate
    tags: [attribute-override, embeddable, gotcha]
    question: |
      An `Order` embeds `Address` twice (billing and shipping). Without any extra annotation,
      what happens at startup?
    options: ["Hibernate silently prefixes the second embedding's columns with the field name", "Only the first embedding is persisted; the second is quietly ignored at runtime", "Hibernate automatically creates a separate address table joined on a foreign key", "Both embeddings map to the same columns, causing a duplicate-column mapping failure"]
    answer: 3
    explanation: |
      Both embeddings map to the same column names (`street`, `city`, `zip`) on the same
      table, so Hibernate reports a duplicate-column mapping error at boot. You must use
      `@AttributeOverride`/`@AttributeOverrides` to remap one embedding's columns.
    ref: "concepts.md#attributeoverride--multiple-embeddings"

  - id: inheritance-embeddables-composite-keys-014
    difficulty: intermediate
    tags: [attribute-override, embeddable]
    question: |
      Which annotation remaps the column names of an embedded value object for one particular
      embedding?
    options: ["@Column", "@JoinColumn", "@AttributeOverride", "@SecondaryTable"]
    answer: 2
    explanation: |
      `@AttributeOverride` (grouped as `@AttributeOverrides`) remaps the columns of embedded
      attributes for a specific embedding, letting you embed the same type multiple times.
      `@AssociationOverride` does the equivalent for associations inside an embeddable.
    ref: "concepts.md#attributeoverride--multiple-embeddings"

  - id: inheritance-embeddables-composite-keys-015
    difficulty: intermediate
    tags: [element-collection, mechanism]
    question: |
      What does `@ElementCollection` map?
    options: ["A collection of basic types or embeddables into a separate collection table owned by the parent", "A collection of independent child entities linked through a dedicated join table", "A many-to-many association between two entities sharing a link table", "A second-level cache collection region shared across the persistence unit"]
    answer: 0
    explanation: |
      `@ElementCollection` persists a `List`/`Set`/`Map` of basic types or embeddables into a
      collection table keyed by the owner's FK. The elements have no identity and their
      lifecycle is entirely owned by the parent entity — not an entity association.
    ref: "concepts.md#elementcollection"

  - id: inheritance-embeddables-composite-keys-016
    difficulty: advanced
    tags: [element-collection, performance, gotcha]
    question: |
      Why can updating a single element of an `@ElementCollection` be surprisingly expensive?
    options: ["Element rows lack a stable primary key, so Hibernate often deletes all rows and re-inserts the whole collection", "Hibernate takes a table-level exclusive lock on the entire collection table for every change", "Each element mutation triggers a full second-level cache eviction of the owning entity", "@ElementCollection is always fetched EAGER, forcing a complete reload before any update"]
    answer: 0
    explanation: |
      Element-collection rows have no per-row primary key to target for a fine-grained UPDATE,
      so for many mappings Hibernate deletes all rows for that owner and re-inserts them on any
      change. For large or frequently mutated collections, prefer a real `@OneToMany` child
      entity.
    ref: "concepts.md#elementcollection"

  - id: inheritance-embeddables-composite-keys-017
    difficulty: intermediate
    tags: [element-collection, fetch-default]
    question: |
      What is the default fetch type of an `@ElementCollection`?
    options: ["EAGER", "It depends on the element type", "There is no default", "LAZY"]
    answer: 3
    explanation: |
      Like other collection mappings (`@OneToMany`, `@ManyToMany`), `@ElementCollection`
      defaults to `FetchType.LAZY`. Its `fetch` attribute can be set to `EAGER` but that is
      rarely advisable.
    ref: "concepts.md#elementcollection"

  - id: inheritance-embeddables-composite-keys-018
    difficulty: intermediate
    tags: [embeddedid, composite-key]
    question: |
      With `@EmbeddedId OrderId id`, what must the `OrderId` class be annotated with and
      implement?
    options: ["@Entity, be Serializable, and implement Comparable over its key fields", "@MappedSuperclass, implement Cloneable, and declare its own @GeneratedValue", "@Embeddable, be Serializable, and override equals/hashCode over all key fields", "Nothing special; any plain POJO with matching field names works fine"]
    answer: 2
    explanation: |
      An `@EmbeddedId` key class must be `@Embeddable`, `Serializable`, and override
      `equals`/`hashCode` across all its key fields. Hibernate uses that identity to look the
      entity up in the persistence context.
    ref: "concepts.md#composite-keys-idclass-vs-embeddedid"

  - id: inheritance-embeddables-composite-keys-019
    difficulty: intermediate
    tags: [idclass, composite-key]
    question: |
      When using `@IdClass(OrderId.class)`, how are the key fields declared on the entity
      itself?
    options: ["Each key field is declared directly on the entity, each annotated with @Id", "As a single @EmbeddedId-annotated field of type OrderId folded into the entity", "They are not declared on the entity at all; only the OrderId class lists them", "As a @OneToOne association pointing at the OrderId entity type"]
    answer: 0
    explanation: |
      With `@IdClass`, the entity declares each key attribute as a top-level field annotated
      `@Id`, and the separate id class mirrors those fields (with `equals`/`hashCode`) for
      lookups like `em.find(Order.class, new OrderId(1L, 42L))`.
    ref: "concepts.md#composite-keys-idclass-vs-embeddedid"

  - id: inheritance-embeddables-composite-keys-020
    difficulty: advanced
    tags: [embeddedid, idclass, judgment]
    question: |
      Which statement reflects modern guidance on choosing between `@EmbeddedId` and
      `@IdClass`?
    options: ["Always use @IdClass; @EmbeddedId was deprecated in JPA 2.2 and removed in Jakarta 3", "They are byte-for-byte interchangeable and compile to identical bytecode and SQL", "@EmbeddedId is incompatible with @MapsId, so derived identities always require @IdClass", "Prefer @EmbeddedId for a cohesive value-object key and clean JPQL; use @IdClass for flat fields or legacy schemas"]
    answer: 3
    explanation: |
      `@EmbeddedId` treats the key as a first-class value object, reads cleanly
      (`o.id.customerId`), and composes well with `@MapsId`. `@IdClass` is favored when you
      want the key columns as plain top-level entity fields or are mapping a legacy design.
      Neither is deprecated.
    ref: "concepts.md#composite-keys-idclass-vs-embeddedid"

  - id: inheritance-embeddables-composite-keys-021
    difficulty: advanced
    tags: [mapsid, shared-primary-key, mechanism]
    question: |
      What does `@MapsId` accomplish on a `@OneToOne` or `@ManyToOne` association?
    options: ["It flips the association to EAGER fetching and disables lazy proxies for it", "It implicitly applies CascadeType.ALL, propagating every persist/merge/remove to the target", "It relocates the association into a dedicated join table keyed by both entities' ids", "It makes the association's foreign key also serve as (part of) the entity's own primary key — a shared primary key"]
    answer: 3
    explanation: |
      `@MapsId` binds the association's FK to the entity's PK. For a 1:1, the child reuses the
      parent's id as its own (one column instead of a separate surrogate key + FK). For a
      composite key, `@MapsId("customerId")` populates that key part from the associated
      entity.
    ref: "concepts.md#mapsid--shared-primary-key"

  - id: inheritance-embeddables-composite-keys-022
    difficulty: advanced
    tags: [mapsid, one-to-one, judgment]
    question: |
      A `UserProfile` should always share the exact primary key value of its `User` (a true
      1:1). Which mapping expresses this most idiomatically?
    options: ["A @OneToOne with its own @GeneratedValue surrogate id plus a separate user_id FK column", "An @ElementCollection holding user references keyed in a side collection table", "@Inheritance(strategy = JOINED) making UserProfile a subclass table of User", "A @OneToOne annotated with @MapsId so the profile's PK equals the user's id"]
    answer: 3
    explanation: |
      `@MapsId` on the `@OneToOne` makes `UserProfile.id` equal `User.id` (FK == PK). This
      enforces the 1:1 with a single shared key column and avoids a redundant surrogate key
      plus FK.
    ref: "concepts.md#mapsid--shared-primary-key"

  - id: inheritance-embeddables-composite-keys-023
    difficulty: advanced
    tags: [equals-hashcode, identity, gotcha]
    question: |
      Why is basing an entity's `equals`/`hashCode` on a database-generated `@Id` value
      dangerous when the entity is stored in a `HashSet` before being persisted?
    options: ["Generated ids are always assigned as negative sentinels before the first flush completes", "HashSet silently rejects any element whose identifier field is currently null at add time", "Hibernate transparently recomputes hashCode on flush, corrupting every bucket in the set", "The id is null when transient, so after persist() assigns an id the hash bucket changes and the entity can 'disappear' from the set"]
    answer: 3
    explanation: |
      A transient entity has `id == null`; once `persist()` assigns the id, `hashCode` changes,
      so the element sits in the wrong bucket and lookups/removals fail. The fix is a stable
      hash — a natural/business key or a constant `hashCode` with id-based `equals` guarded for
      null.
    ref: "concepts.md#equals--hashcode-with-composite-keys"

  - id: inheritance-embeddables-composite-keys-024
    difficulty: advanced
    tags: [equals-hashcode, best-practice]
    question: |
      Which approach to entity `equals`/`hashCode` keeps the hash stable across the entity's
      whole lifecycle?
    options: ["Derive both equals and hashCode from every mutable business field, recomputing on each change", "Use a natural/business key, or a constant hashCode with an id-based, null-guarded equals", "Feed the generated surrogate id straight into hashCode as soon as the row is inserted", "Skip overriding them entirely and rely on the default Object reference identity instead"]
    answer: 1
    explanation: |
      A stable hash must not change as the entity moves through transient → managed. A
      business key (immutable) gives that; failing that, a constant `hashCode` combined with an
      id-based `equals` (null-guarded so a transient instance equals only itself) is the common
      recommendation. Mutable fields and raw generated ids both break stability.
    ref: "concepts.md#equals--hashcode-with-composite-keys"

  - id: inheritance-embeddables-composite-keys-025
    difficulty: intermediate
    tags: [discriminator, sql, mechanism]
    question: |
      Under `SINGLE_TABLE` with discriminator column `payment_type`, what does Hibernate add
      to the SQL when you query only `from CardPayment`?
    options: ["A `WHERE payment_type = 'CARD'` predicate", "A JOIN to a dedicated card_payment side table holding the subclass columns", "A UNION ALL that merges each sibling subtype's rows before filtering them", "Nothing extra in SQL; it scans every row and discards non-CARD ones in memory"]
    answer: 0
    explanation: |
      Because all subtypes share one table, Hibernate restricts a subtype query with the
      discriminator value, e.g. `SELECT ... FROM payment WHERE payment_type = 'CARD'`, and
      reads the discriminator to instantiate the correct class on polymorphic reads.
    ref: "concepts.md#discriminatorcolumn--discriminatorvalue"

  - id: inheritance-embeddables-composite-keys-026
    difficulty: intermediate
    tags: [joined, insert, mechanism]
    question: |
      Under `JOINED`, how many INSERT statements does persisting one `CardPayment` (subclass
      of `Payment`) typically produce?
    options: ["Two — one into the root `payment` table and one into the `card_payment` table", "One combined INSERT into a single shared table holding every subtype's columns", "One INSERT statement generated per persisted column value", "Three — separate inserts into the root, subclass, and a discriminator-index table"]
    answer: 0
    explanation: |
      With `JOINED`, the entity's data is split across the root and subclass tables, so a
      persist issues an INSERT into each: the shared columns into `payment` and the
      subclass-specific columns into `card_payment` (linked by the shared PK/FK).
    ref: "concepts.md#joined-strategy"

  - id: inheritance-embeddables-composite-keys-027
    difficulty: intermediate
    tags: [single-table, polymorphic, performance]
    question: |
      Which is the strongest performance advantage of `SINGLE_TABLE` for polymorphic queries?
    options: ["It stores no NULL values because each subtype gets its own trimmed column set", "It merges subtype rows with a fast UNION ALL that databases optimize heavily", "It requires no joins across class tables — the whole hierarchy is one table", "It automatically loads every hierarchy row into the second-level cache on startup"]
    answer: 2
    explanation: |
      Since every subtype lives in one table, a polymorphic query is a single table scan with
      no joins or unions — the fastest read profile of the three strategies. The cost is
      sparse NULL columns and no `NOT NULL` on subclass fields.
    ref: "concepts.md#inheritance-strategy-trade-off-table"

  - id: inheritance-embeddables-composite-keys-028
    difficulty: advanced
    tags: [table-per-class, association, gotcha]
    question: |
      Which limitation is specific to `TABLE_PER_CLASS` compared to the other two strategies?
    options: ["It forbids declaring any @DiscriminatorValue on its concrete subclasses", "It cannot persist columns that are specific to an individual subclass", "It forces every subclass-specific column to be declared NULLable at the DB level", "A polymorphic foreign key / association to the base type is hard to express, and IDENTITY generation is unusable"]
    answer: 3
    explanation: |
      With no shared parent table, a foreign key that references 'any subtype' cannot be a
      simple FK, polymorphic queries need `UNION`s, and identity generation must be shared
      (making `IDENTITY` unusable). These combine to make the strategy generally undesirable.
    ref: "concepts.md#table_per_class-strategy"

  - id: inheritance-embeddables-composite-keys-029
    difficulty: intermediate
    tags: [embeddable, records, hibernate6]
    question: |
      In Hibernate 6+, can a Java `record` be used as an embeddable value type?
    options: ["No, records are rejected by every Hibernate version because they lack a no-arg constructor", "Only if the record also implements Serializable and Comparable over its components", "Yes, but it must still be annotated (treated as) @Embeddable", "Only inside @Id key classes, never as a standalone embedded value object"]
    answer: 2
    explanation: |
      Hibernate 6 added support for Java records as embeddable value types, but the type must
      still be treated as an `@Embeddable`. Records suit value objects because they are
      immutable, matching the value-semantics of embeddables.
    ref: "concepts.md#embeddables-embeddable--embedded"

  - id: inheritance-embeddables-composite-keys-030
    difficulty: advanced
    tags: [n-plus-one, inheritance, scenario]
    question: |
      Under `JOINED`, a polymorphic query loads roots and then each subclass row is fetched
      lazily one-by-one. Which technique best collapses this into fewer round trips?
    options: ["Use JOIN FETCH or an entity graph to load the needed data in one statement", "Switch every association in the hierarchy to EAGER so the joins are always emitted", "Increase the JDBC connection pool size so the per-row queries run concurrently", "Add a second-level cache to the root entity only, leaving subclass rows uncached"]
    answer: 0
    explanation: |
      The classic N+1 fix — `JOIN FETCH` or a JPA entity graph — instructs Hibernate to fetch
      the related rows in a single query rather than firing a follow-up per row. Making
      everything EAGER causes its own over-fetching problems. See
      `fetching-lazy-eager-n-plus-one` for the full treatment.
    ref: "concepts.md#polymorphic-queries--n1-with-inheritance"

  - id: inheritance-embeddables-composite-keys-031
    difficulty: beginner
    tags: [mapsid, composite-key]
    question: |
      With a composite `@EmbeddedId`, using `@MapsId("customerId")` on a `@ManyToOne` means
      that key part is:
    options: ["Set manually by the application on every persist call", "Excluded from equals/hashCode and identity comparison", "Derived automatically from the associated entity's key", "Stored separately in its own dedicated collection table"]
    answer: 2
    explanation: |
      `@MapsId("customerId")` tells Hibernate to populate the `customerId` component of the
      embedded id from the associated `@ManyToOne` entity, so you no longer set that key field
      by hand — it is derived from the association.
    ref: "concepts.md#mapsid--shared-primary-key"

  - id: inheritance-embeddables-composite-keys-032
    difficulty: intermediate
    tags: [element-collection, one-to-many, judgment]
    question: |
      You have a large, frequently-mutated collection of value rows attached to an entity.
      Why might a `@OneToMany` to a child entity be preferable to `@ElementCollection`?
    options: ["Child entities have stable primary keys, enabling row-level inserts/updates/deletes instead of delete-all-and-reinsert", "@ElementCollection is always fetched EAGER and can never be configured as lazy", "@OneToMany never uses a join table, whereas @ElementCollection always requires one", "@ElementCollection can only store basic scalar types and cannot hold embeddable values"]
    answer: 0
    explanation: |
      Because element-collection rows have no per-row PK, Hibernate often rewrites the whole
      collection on change. A child entity has its own identity, so Hibernate can target
      individual rows — far cheaper for large or churny collections.
    ref: "concepts.md#elementcollection"

  - id: inheritance-embeddables-composite-keys-033
    difficulty: intermediate
    tags: [discriminator, discriminator-value, defaults]
    question: |
      If a subclass has no `@DiscriminatorValue`, what value does Hibernate store for it under
      `SINGLE_TABLE`?
    options: ["The entity name (default)", "SQL NULL, since no explicit token was provided", "The fully-qualified binary class name including its package", "An auto-incrementing integer assigned in subclass registration order"]
    answer: 0
    explanation: |
      The default `@DiscriminatorValue` is the entity name. You can override it (e.g.
      `@DiscriminatorValue("CARD")`) to control the stored token, which is important for stable
      data and for STRING vs INTEGER discriminators.
    ref: "concepts.md#discriminatorcolumn--discriminatorvalue"

  - id: inheritance-embeddables-composite-keys-034
    difficulty: advanced
    tags: [discriminator-formula, hibernate, legacy]
    question: |
      For a legacy schema with no dedicated discriminator column, which Hibernate feature lets
      you derive the type indicator from an SQL expression?
    options: ["@DiscriminatorColumn(nullable = true)", "@SecondaryTable", "@DiscriminatorFormula", "@Formula on the @Id"]
    answer: 2
    explanation: |
      `@DiscriminatorFormula` (a Hibernate extension) computes the discriminator from an SQL
      expression instead of a physical column, which is handy when mapping a `SINGLE_TABLE`
      hierarchy onto a legacy table that lacks a dedicated type column.
    ref: "concepts.md#discriminatorcolumn--discriminatorvalue"

  - id: inheritance-embeddables-composite-keys-035
    difficulty: beginner
    tags: [embeddable, table, ddl]
    question: |
      When `Customer` embeds an `Address` via `@Embedded`, how many tables and joins are
      involved to load a customer with its address?
    options: ["Two tables joined on a foreign key linking customer to a separate address table", "A collection table for the address rows joined back to the customer table", "Three tables resolved through a many-to-many link between customer and address", "One table, no join — the address columns live on the customer table"]
    answer: 3
    explanation: |
      An embeddable adds its columns to the owning entity's table, so there is one table and no
      join. That is the whole point of composition: no separate identity, no extra table.
    ref: "concepts.md#embeddables-embeddable--embedded"

  - id: inheritance-embeddables-composite-keys-036
    difficulty: advanced
    tags: [equals-hashcode, composite-key, mechanism]
    question: |
      Why does JPA require the id class (whether `@IdClass` or `@EmbeddedId`) to implement
      `equals` and `hashCode`?
    options: ["To let Jackson serialize the composite key to and from JSON payloads", "Because the database engine relies on those methods to build its indexes", "Solely to enable second-level cache storage of the composite key entries", "So Hibernate can use key identity to look entities up in the persistence context and satisfy the identity contract"]
    answer: 3
    explanation: |
      The persistence context maps entities by their identity. Hibernate compares composite
      keys via `equals`/`hashCode`, so a correct implementation over all key fields is
      mandatory for `find`, dirty-check lookups, and the guaranteed one-instance-per-identity
      behavior of the first-level cache.
    ref: "concepts.md#equals--hashcode-with-composite-keys"

  - id: inheritance-embeddables-composite-keys-037
    difficulty: intermediate
    tags: [inheritance, trade-offs, table]
    question: |
      Which strategy stores duplicated (repeated) inherited columns across multiple tables?
    options: ["SINGLE_TABLE", "JOINED", "MappedSuperclass entity hierarchy", "TABLE_PER_CLASS"]
    answer: 3
    explanation: |
      `TABLE_PER_CLASS` gives each concrete class a full table containing both inherited and
      own columns, so inherited columns are duplicated across the concrete tables — a
      denormalized layout that also complicates polymorphic queries.
    ref: "concepts.md#inheritance-strategy-trade-off-table"

  - id: inheritance-embeddables-composite-keys-038
    difficulty: intermediate
    tags: [joined, primary-key-join-column]
    question: |
      In a `JOINED` hierarchy, the primary key of a subclass table is:
    options: ["An independent auto-increment unrelated to the root", "A composite of the discriminator and a sequence", "A DTYPE discriminator column inherited from the root table", "Also a foreign key referencing the root table's primary key"]
    answer: 3
    explanation: |
      Each subclass table's PK is also an FK to the root table's PK (customizable via
      `@PrimaryKeyJoinColumn`). This shared key is what the join uses to reassemble a subclass
      instance from the root and subclass rows.
    ref: "concepts.md#joined-strategy"

  - id: inheritance-embeddables-composite-keys-039
    difficulty: advanced
    tags: [embeddable, associations, nesting]
    question: |
      Which statement about embeddable capabilities in JPA/Hibernate 6+ is correct?
    options: ["Embeddables cannot contain associations and may never be nested inside another embeddable", "Embeddables can be nested and can contain their own associations (e.g. a @ManyToOne inside an @Embeddable)", "Embeddables must consist solely of immutable primitive fields with no object references", "Embeddables always require their own discriminator column to distinguish embedded instances"]
    answer: 1
    explanation: |
      Embeddables can be nested and can hold their own mapped associations; you use
      `@AssociationOverride` to remap those associations when embedding the same type more than
      once. They still have no identity of their own.
    ref: "concepts.md#attributeoverride--multiple-embeddings"

  - id: inheritance-embeddables-composite-keys-040
    difficulty: expert
    tags: [mapsid, one-to-one, lazy, mechanism]
    question: |
      A unidirectional `@OneToOne` from parent to child (child holds the FK) is notoriously
      hard to make truly lazy. Why does a `@MapsId` shared-PK design help?
    options: ["It forces the association to be EAGER at build-time, sidestepping the lazy problem entirely", "@MapsId disables dirty-checking of that association so the extra query is never scheduled", "The child's presence is derivable from its own PK (== parent PK), so Hibernate need not issue a probing query to decide null vs proxy", "It converts the OneToOne into a lazily-batched @ElementCollection of a single element"]
    answer: 2
    explanation: |
      The lazy-OneToOne problem arises because, without owning the FK, Hibernate must query to
      know whether the other side exists (to return null or a proxy). With `@MapsId`, the
      child shares the parent's PK, so its existence maps to a known key value and the
      proxying/laziness behaves more predictably.
    ref: "concepts.md#mapsid--shared-primary-key"

  - id: inheritance-embeddables-composite-keys-041
    difficulty: beginner
    tags: [inheritance, tables, counting]
    question: |
      For a hierarchy with a root and three subclasses, how many tables does `SINGLE_TABLE`
      create?
    options: ["One", "Two", "Three", "Four"]
    answer: 0
    explanation: |
      `SINGLE_TABLE` uses exactly one table for the entire hierarchy, distinguished by a
      discriminator column — regardless of the number of subclasses.
    ref: "concepts.md#single_table-strategy"

  - id: inheritance-embeddables-composite-keys-042
    difficulty: intermediate
    tags: [element-collection, collection-table]
    question: |
      Which annotation names the table and join column that hold an `@ElementCollection`'s
      rows?
    options: ["@CollectionTable", "@JoinTable", "@SecondaryTable", "@TableGenerator"]
    answer: 0
    explanation: |
      `@CollectionTable(name = ..., joinColumns = @JoinColumn(...))` configures the separate
      table and the FK back to the owner for an `@ElementCollection`. `@JoinTable` is for
      entity associations, not element collections.
    ref: "concepts.md#elementcollection"

  - id: inheritance-embeddables-composite-keys-043
    difficulty: advanced
    tags: [inheritance, judgment, scenario]
    question: |
      A wide hierarchy (10+ subclasses) each adds many mandatory fields, and you rarely run
      polymorphic base-type queries. Which strategy best balances integrity and avoids a huge
      sparse table?
    options: ["JOINED", "SINGLE_TABLE", "TABLE_PER_CLASS", "@Embeddable per subclass"]
    answer: 0
    explanation: |
      `JOINED` keeps each subclass's mandatory columns in its own table (allowing `NOT NULL`)
      and avoids a massive, mostly-NULL single table. Rare polymorphic queries mean the
      per-level join cost is acceptable. `SINGLE_TABLE` would be a sparse-column nightmare
      here.
    ref: "concepts.md#inheritance-strategy-trade-off-table"

  - id: inheritance-embeddables-composite-keys-044
    difficulty: intermediate
    tags: [embeddedid, jpql]
    question: |
      With `@EmbeddedId OrderId id` (fields `customerId`, `orderNo`), how do you reference a
      key part in JPQL?
    options: ["o.customerId", "o.OrderId.customerId", "o.getKey().customerId", "o.id.customerId"]
    answer: 3
    explanation: |
      With `@EmbeddedId`, the key is a single embedded object, so JPQL navigates through it:
      `o.id.customerId`. Under `@IdClass`, the fields are top-level, so it would be
      `o.customerId`.
    ref: "concepts.md#composite-keys-idclass-vs-embeddedid"

  - id: inheritance-embeddables-composite-keys-045
    difficulty: beginner
    tags: [mapped-superclass, table]
    question: |
      Does a `@MappedSuperclass` map to its own database table?
    options: ["Yes — Hibernate always generates a dedicated base table for the mapped superclass", "Only if it declares an @Id, in which case that key column gets its own table", "Only under the JOINED strategy, where it acts as the shared root table", "No — it has no table; its mappings are inherited into each subclass's table"]
    answer: 3
    explanation: |
      `@MappedSuperclass` never has a table. Its column mappings are copied into each
      concrete entity subclass's own table. That is precisely why you cannot query or
      associate over it.
    ref: "concepts.md#mappedsuperclass-vs-inheritance"

  - id: inheritance-embeddables-composite-keys-046
    difficulty: advanced
    tags: [equals-hashcode, mutable, gotcha]
    question: |
      Which practice for entity `equals`/`hashCode` is a genuine anti-pattern?
    options: ["Deriving hashCode from a mutable field that changes during the entity's life", "Using an immutable natural/business key assigned once at construction time", "Returning a constant hashCode paired with an id-based, null-guarded equals method", "Comparing entities on a stable business key whenever one is available"]
    answer: 0
    explanation: |
      Deriving the hash from a mutable field breaks the `hashCode` contract the moment the
      field changes: the entity lands in the wrong `HashSet`/`HashMap` bucket. Stable, ideally
      immutable, identity is required — a natural key or a constant hash with id-based equals.
    ref: "concepts.md#equals--hashcode-with-composite-keys"

  - id: inheritance-embeddables-composite-keys-047
    difficulty: intermediate
    tags: [inheritance, discriminator, joined]
    question: |
      Is a discriminator column required for the `JOINED` strategy?
    options: ["Yes — JOINED refuses to boot unless a @DiscriminatorColumn is declared on the root", "No, it is optional for JOINED (required conceptually only for SINGLE_TABLE)", "Only when the hierarchy has more than two subclass tables to disambiguate", "No — JOINED explicitly forbids any discriminator column on the root entity"]
    answer: 1
    explanation: |
      `JOINED` can determine a row's type from which subclass table its join row exists in, so
      a discriminator column is optional (Hibernate can still use one). It is `SINGLE_TABLE`
      that fundamentally needs the discriminator to tell rows apart.
    ref: "concepts.md#discriminatorcolumn--discriminatorvalue"

  - id: inheritance-embeddables-composite-keys-048
    difficulty: expert
    tags: [namespace, jakarta, versions]
    question: |
      In Hibernate 6/7 and Jakarta Persistence 3.1/3.2, which package do inheritance and
      composite-key annotations like `@Inheritance`, `@EmbeddedId`, and `@MapsId` live in?
    options: ["javax.persistence.*", "jakarta.persistence.*", "org.hibernate.annotations.* only", "java.persistence.*"]
    answer: 1
    explanation: |
      Since Jakarta EE 9 the namespace moved from `javax.persistence.*` to
      `jakarta.persistence.*`, and Hibernate 6/7 target the Jakarta namespace. A handful of
      Hibernate-only extensions (e.g. `@DiscriminatorFormula`) live under
      `org.hibernate.annotations`, but the standard annotations here are `jakarta.persistence`.
    ref: "concepts.md#inheritance-mapping-the-big-picture"

  - id: inheritance-embeddables-composite-keys-049
    difficulty: intermediate
    tags: [embeddable, one-to-one, identity, distinction]
    question: |
      Two `Customer` rows each `@Embedded` an identical `Address` (same street/city/zip). In
      the database, do they share the address data?
    options: ["Yes — Hibernate deduplicates equal embeddables into one shared address row", "Only if the two Address values are equal by equals(), which triggers row sharing", "No, each customer stores its own copy of the address columns in its own row", "Only under the JOINED strategy, where the address becomes a shared subclass table"]
    answer: 2
    explanation: |
      Embeddables have no identity, so there is nothing to share — each owning entity stores
      its own copy of the value columns in its own row. Sharing would require a separate entity
      with its own identity (a `@ManyToOne`/`@OneToOne`).
    ref: "concepts.md#embeddables-embeddable--embedded"

  - id: inheritance-embeddables-composite-keys-050
    difficulty: advanced
    tags: [inheritance, judgment, avoid]
    question: |
      In an interview, when should you actively recommend `TABLE_PER_CLASS`?
    options: ["Rarely — mainly to explain why you would avoid it (UNION polymorphic queries, IDENTITY unusable, hard polymorphic FKs)", "For most hierarchies, since it is the recommended modern default in Hibernate 6", "Whenever you need the fastest possible polymorphic base-type queries with no joins", "Whenever subclass-specific columns must carry DB-level NOT NULL constraints"]
    answer: 0
    explanation: |
      `TABLE_PER_CLASS` is generally discouraged. A strong candidate names `SINGLE_TABLE` or
      `JOINED` as the real choices and cites `TABLE_PER_CLASS`'s problems — `UNION` polymorphic
      queries, unusable `IDENTITY`, and awkward polymorphic associations — as the reason to
      avoid it.
    ref: "concepts.md#table_per_class-strategy"

  - id: inheritance-embeddables-composite-keys-051
    difficulty: intermediate
    tags: [embeddedid, mapsid, composite]
    question: |
      A `LineItem` has a composite key of `(orderId, productId)` where `orderId` comes from a
      `@ManyToOne Order`. Which combination is idiomatic?
    options: ["@IdClass with a manually-set orderId field on every save", "Two separate @GeneratedValue surrogate ids, one per key component", "@ElementCollection keyed by product, with the order stored as a parent FK", "@EmbeddedId plus @MapsId(\"orderId\") on the @ManyToOne to Order"]
    answer: 3
    explanation: |
      `@EmbeddedId` models the cohesive composite key, and `@MapsId("orderId")` derives the
      `orderId` component from the `@ManyToOne Order` association so you never set it by hand.
      This is the canonical composite-key-with-association mapping.
    ref: "concepts.md#mapsid--shared-primary-key"

  - id: inheritance-embeddables-composite-keys-052
    difficulty: beginner
    tags: [inheritance, mechanism, single-table]
    question: |
      How does Hibernate decide which concrete Java class to instantiate when reading a row
      under `SINGLE_TABLE`?
    options: ["By counting non-null columns", "By the order rows were inserted", "By reading the discriminator column value", "By the primary key range"]
    answer: 2
    explanation: |
      The discriminator column carries the type token for each row; Hibernate reads it and
      instantiates the matching subclass. That is why `SINGLE_TABLE` needs the discriminator
      while `JOINED` can infer type from table membership.
    ref: "concepts.md#discriminatorcolumn--discriminatorvalue"

  - id: inheritance-embeddables-composite-keys-053
    difficulty: expert
    tags: [joined, discriminator, sql, code-reading]
    question: |
      A `JOINED` hierarchy (`Payment` root, `CardPayment`, `BankTransfer` subclasses) has no
      `@DiscriminatorColumn` declared. You run `select p from Payment p`. What does Hibernate 6
      emit to determine each row's concrete type?
    options:
      - "It reads a mandatory DTYPE column that Hibernate auto-created on the root table"
      - "A separate SELECT against each subclass table, later merged with a UNION ALL in memory"
      - "An inner join to the root plus a left join to each subclass table, with a `case when subclass_fk is not null then N end as clazz_` expression"
      - "It cannot determine the type without an explicit @DiscriminatorColumn and throws at boot"
    answer: 2
    explanation: |
      Under `JOINED` Hibernate does not synthesize a discriminator column by default. The
      polymorphic query left-joins every subclass table to the root and uses a
      `case when c.payment_id is not null then 1 ... end as clazz_` to pick the concrete class
      from which subclass row is non-null. A `@DiscriminatorColumn` is optional here.
    ref: "concepts.md#joined-polymorphic-sql-and-write-path"

  - id: inheritance-embeddables-composite-keys-054
    difficulty: advanced
    tags: [joined, insert, order, mechanism]
    question: |
      Persisting a new `CardPayment` under `JOINED`, in what order are the INSERTs issued and
      why?
    options:
      - "Root `payment` first (to obtain the generated id), then `card_payment` with that id as PK/FK"
      - "Subclass `card_payment` first, then `payment`, so the FK exists before the parent"
      - "Both rows in a single combined INSERT ... SELECT statement spanning the two tables"
      - "Order is nondeterministic; Hibernate batches the two inserts in arbitrary sequence"
    answer: 0
    explanation: |
      The root row is inserted first so the generated primary key is available, then the
      subclass row is inserted using that key as both its PK and the FK back to the root. A
      DELETE reverses the order (subclass row, then root).
    ref: "concepts.md#joined-polymorphic-sql-and-write-path"

  - id: inheritance-embeddables-composite-keys-055
    difficulty: expert
    tags: [discriminator, legacy, null, single-table]
    question: |
      A legacy `SINGLE_TABLE` has rows where the type column is literally NULL for one
      subtype. Which annotation maps those NULL-discriminator rows to a specific subclass?
    options:
      - "@DiscriminatorColumn(nullable = true)"
      - "@DiscriminatorValue(\"null\")"
      - "@DiscriminatorFormula(\"is null\")"
      - "@Where(\"dtype is null\")"
    answer: 1
    explanation: |
      `@DiscriminatorValue("null")` maps rows whose discriminator is SQL NULL to that
      subclass. Its companion `@DiscriminatorValue("not null")` is a catch-all for any
      unmatched non-null value — both are legacy-schema mapping tricks.
    ref: "concepts.md#discriminator-advanced-options"

  - id: inheritance-embeddables-composite-keys-056
    difficulty: expert
    tags: [discriminator, defensive, hibernate, single-table]
    question: |
      A shared `SINGLE_TABLE` occasionally gets rows with a `DTYPE` value that maps to no known
      subclass, and you want the root polymorphic query to silently exclude them instead of
      failing. Which Hibernate setting does this?
    options:
      - "@DiscriminatorColumn(discriminatorType = INTEGER)"
      - "@Inheritance(strategy = SINGLE_TABLE, force = true)"
      - "@DiscriminatorOptions(force = true)"
      - "@Filter on every subclass"
    answer: 2
    explanation: |
      `@DiscriminatorOptions(force = true)` makes Hibernate add the discriminator predicate
      even to the root query, so rows with unmapped discriminator values are filtered out
      rather than causing an instantiation error. `insert = false` additionally stops
      Hibernate writing the discriminator (for DB-derived columns).
    ref: "concepts.md#discriminator-advanced-options"

  - id: inheritance-embeddables-composite-keys-057
    difficulty: intermediate
    tags: [discriminator, defaults, length]
    question: |
      What is the default length of the default `DTYPE` discriminator column, and what does
      the JPA spec say the default `@DiscriminatorValue` is for a `STRING` discriminator?
    options:
      - "Length 255; the value default is always provider-specific regardless of type"
      - "Length 31; for a STRING discriminator the spec default is the entity name"
      - "Length 10; both length and value are unspecified by the spec"
      - "There is no default length; the value default is provider-specific"
    answer: 1
    explanation: |
      The default discriminator column is `DTYPE`, `DiscriminatorType.STRING`, length 31. Per
      the Jakarta Persistence spec, when the discriminator type is `STRING` a missing
      `@DiscriminatorValue` defaults to the entity name; for non-`STRING` types the generated
      value is provider-specific. Set it explicitly for portable, stable data.
    ref: "concepts.md#discriminator-advanced-options"

  - id: inheritance-embeddables-composite-keys-058
    difficulty: advanced
    tags: [single-table, not-null, integrity, judgment]
    question: |
      You must enforce that `content` is never null for the `Post` subtype in a `SINGLE_TABLE`
      hierarchy, but the column is shared with sibling subtypes. What is the correct
      DB-level approach?
    options:
      - "Add `@Column(nullable = false)` to the content field to force NOT NULL DDL"
      - "Switch the entire hierarchy to TABLE_PER_CLASS so each subtype gets its own table"
      - "A discriminator-conditioned CHECK constraint like `CHECK (DTYPE <> 'Post' OR content IS NOT NULL)`"
      - "Add a UNIQUE constraint to the shared content column for the whole table"
    answer: 2
    explanation: |
      A plain `NOT NULL` would reject sibling rows that legitimately leave `content` NULL. A
      CHECK constraint keyed on the discriminator enforces the rule only for the relevant
      subtype. Bean Validation `@NotNull` or a `@PrePersist` guard are app-level alternatives.
    ref: "concepts.md#enforcing-not-null-under-single_table"

  - id: inheritance-embeddables-composite-keys-059
    difficulty: expert
    tags: [table-per-class, id-generation, boot-failure]
    question: |
      An entity mapped `@Inheritance(strategy = TABLE_PER_CLASS)` declares
      `@GeneratedValue(strategy = GenerationType.IDENTITY)`. What happens?
    options:
      - "It works, but ids may silently collide across sibling concrete tables at runtime"
      - "Hibernate rejects it at bootstrap; TABLE_PER_CLASS needs a shared SEQUENCE or TABLE generator"
      - "Hibernate silently downgrades the strategy to AUTO and continues with no consequence"
      - "It works only on databases whose dialect natively supports IDENTITY auto-increment columns"
    answer: 1
    explanation: |
      Because ids must be unique across every concrete table for polymorphic references to
      work, and per-table IDENTITY columns generate independently, Hibernate rejects IDENTITY
      with `TABLE_PER_CLASS` at boot. A shared `SEQUENCE`/`TABLE` generator across the
      hierarchy is required.
    ref: "concepts.md#mixing-strategies-and-boot-time-failures"

  - id: inheritance-embeddables-composite-keys-060
    difficulty: advanced
    tags: [inheritance, strategy, mixing, boot]
    question: |
      Can you use `JOINED` for the top of a hierarchy and `SINGLE_TABLE` for a subtree below
      it, by annotating a mid-hierarchy subclass with a different `@Inheritance` strategy?
    options:
      - "Yes, any subclass may re-annotate @Inheritance to override its parent's chosen strategy"
      - "No — `@Inheritance` is declared only on the root; you cannot switch strategy mid-hierarchy"
      - "Yes, but only the JOINED-then-SINGLE_TABLE direction is legal, never the reverse ordering"
      - "Only if a matching @DiscriminatorColumn is declared on both the root and the switching node"
    answer: 1
    explanation: |
      `@Inheritance(strategy = ...)` is honored only on the root entity and applies to the
      whole hierarchy; a subclass cannot override it. Genuinely mixed layouts require
      separate hierarchies, not a strategy switch mid-tree.
    ref: "concepts.md#mixing-strategies-and-boot-time-failures"

  - id: inheritance-embeddables-composite-keys-061
    difficulty: expert
    tags: [embeddable, null, gotcha, behavior]
    question: |
      You load a `Customer` whose `street`, `city`, and `zip` columns are all NULL, where those
      three columns map to an `@Embedded Address address`. What does `customer.getAddress()`
      return?
    options:
      - "A freshly constructed new Address() instance whose street/city/zip fields are all null"
      - "null — an all-null embeddable is materialized as a null reference"
      - "An Optional.empty() wrapper, since Hibernate boxes absent embeddables into Optional"
      - "It throws a MappingException because the all-null embeddable cannot be instantiated"
    answer: 1
    explanation: |
      When every column backing an embeddable is NULL, Hibernate returns `null` for the
      embedded field rather than an empty instance. This is expected behavior and the source
      of many surprise NullPointerExceptions; guard for null or keep a mandatory column.
    ref: "concepts.md#embeddable-null-semantics"

  - id: inheritance-embeddables-composite-keys-062
    difficulty: expert
    tags: [embeddable, records, instantiator, hibernate6]
    question: |
      You want to map an immutable Java `record MonetaryAmount(BigDecimal amount, String
      currency)` as an embeddable, but it has no no-arg constructor. What is the correct
      Hibernate 6 approach?
    options:
      - "Add a private no-arg constructor via reflection hacks; Hibernate always needs one"
      - "Records can never be embeddables; convert MonetaryAmount into a mutable JavaBean class"
      - "Use HB6.2+ record support, or supply an @EmbeddableInstantiator / @Instantiator"
      - "Annotate MonetaryAmount as @Entity instead and reference it through a @OneToOne association"
    answer: 2
    explanation: |
      Hibernate 6.2+ supports records as embeddables directly; for any immutable value object
      without a no-arg constructor you provide an `@EmbeddableInstantiator` (or annotate the
      canonical constructor with `@Instantiator`) so Hibernate builds instances through that
      path instead of reflective bean population.
    ref: "concepts.md#immutable-embeddables-records-and-embeddableinstantiator"

  - id: inheritance-embeddables-composite-keys-063
    difficulty: expert
    tags: [embeddable, struct, hibernate6, postgres]
    question: |
      You want an `@Embeddable Address` stored as a single Postgres composite-type column
      rather than three flattened columns. Which Hibernate 6.2+ feature does this?
    options:
      - "@ElementCollection paired with @CollectionTable to hold the three address columns"
      - "@Struct (or @JdbcTypeCode(SqlTypes.STRUCT)) on the embeddable/attribute"
      - "@Lob on the embedded field so the composite is serialized into one large object"
      - "@SecondaryTable pointing at a side table that stores the composite-type value"
    answer: 1
    explanation: |
      `@Struct` on the embeddable (or `@JdbcTypeCode(SqlTypes.STRUCT)` on the embedded
      attribute) maps the value object to a single native structured column such as a Postgres
      composite type or Oracle OBJECT, instead of flattening into separate columns. This is a
      Hibernate 6.2+ aggregate-embeddable capability.
    ref: "concepts.md#aggregate-embeddables-with-struct"

  - id: inheritance-embeddables-composite-keys-064
    difficulty: advanced
    tags: [attribute-override, nested, embeddable, syntax]
    question: |
      An `Address` embeddable nests a `GeoCoordinates` embeddable (fields `lat`, `lng`). How do
      you override the column name of the nested `lat` for one embedding?
    options:
      - "@AttributeOverride(name = \"lat\", column = @Column(name = \"ship_lat\"))"
      - "@AttributeOverride(name = \"coordinates.lat\", column = @Column(name = \"ship_lat\"))"
      - "@AssociationOverride(name = \"lat\", joinColumns = @JoinColumn(name = \"ship_lat\"))"
      - "You cannot override the column of a nested embeddable; flatten it into the parent first"
    answer: 1
    explanation: |
      Overriding a nested attribute uses a dotted path reflecting the nesting:
      `@AttributeOverride(name = "coordinates.lat", ...)`. `@AssociationOverride` handles
      associations inside an embeddable. Since HB6/JPA3 `@AttributeOverride` is repeatable, so
      no `@AttributeOverrides` wrapper is required.
    ref: "concepts.md#nested-embeddables-and-dotted-path-overrides"

  - id: inheritance-embeddables-composite-keys-065
    difficulty: advanced
    tags: [embeddable, element-collection, equals, set]
    question: |
      You map `@ElementCollection Set<Address>` where `Address` is an embeddable. Which
      requirement is essential for correct behavior?
    options:
      - "Address must be annotated @Entity so each element gets its own persistent identity"
      - "Address must implement equals/hashCode over all its fields"
      - "Address must declare a @GeneratedValue surrogate id to key the collection-table rows"
      - "The Set must be declared fetch = EAGER so element equality can be computed eagerly"
    answer: 1
    explanation: |
      A `Set` relies on `equals`/`hashCode` to determine membership, and Hibernate uses value
      equality to track element-collection changes. An embeddable used in a `Set` (or as a Map
      key) must implement `equals`/`hashCode` over all its fields; embeddables never have their
      own id.
    ref: "concepts.md#embeddable-collections-and-value-equality"

  - id: inheritance-embeddables-composite-keys-066
    difficulty: expert
    tags: [idclass, derived-identity, field-type, boot]
    question: |
      An entity uses `@IdClass` and one key part is `@Id @ManyToOne Order order`. In the id
      class, what should the corresponding field's type be?
    options:
      - "Order — the id-class field must mirror the @ManyToOne association type exactly"
      - "The type of Order's primary key (e.g. Long), named to match the field"
      - "A java.io.Serializable wrapper object holding the whole Order instance"
      - "A String populated from Order's toString() representation at flush time"
    answer: 1
    explanation: |
      For a derived identity via `@ManyToOne`, the id-class field's type must be the parent's
      primary-key type (e.g. `Long orderId`), not the association type. Mismatched names or
      types are a classic reason an `@IdClass` fails to boot.
    ref: "concepts.md#idclass-field-type-matching-and-serializable"

  - id: inheritance-embeddables-composite-keys-067
    difficulty: advanced
    tags: [composite-key, generated-value, serializable, rules]
    question: |
      Which statement about composite-key classes (`@IdClass`/`@EmbeddedId`) is correct?
    options:
      - "They may place @GeneratedValue on one component to auto-generate the composite key"
      - "They must implement Serializable, and composite keys must be application-assigned (no @GeneratedValue)"
      - "They only need to override equals(), since hashCode() is derived automatically"
      - "They must themselves be annotated @Entity to participate in the persistence context"
    answer: 1
    explanation: |
      Both id-class and embedded-id types must implement `Serializable` (for detached id
      passing and second-level cache keys) and override `equals`/`hashCode`. A composite key
      cannot be auto-generated — it is always assigned by the application.
    ref: "concepts.md#idclass-field-type-matching-and-serializable"

  - id: inheritance-embeddables-composite-keys-068
    difficulty: expert
    tags: [embeddedid, mapsid, foreign-key, code-reading]
    question: |
      A `LineItem` has `@EmbeddedId LineItemId id` (fields `orderId`, `productId`) and
      `@ManyToOne @MapsId("orderId") @JoinColumn(name = "order_id") Order order`. When creating a
      new `LineItem`, which fields do you set yourself?
    options:
      - "Both id.orderId and id.productId manually, and then also set the order association"
      - "Only the order association; Hibernate derives both id.orderId and id.productId from it"
      - "id.productId and the order association; id.orderId is derived from order via @MapsId"
      - "Only id.orderId by hand; productId is generated by a sequence on the embedded id"
    answer: 2
    explanation: |
      With `@MapsId("orderId")`, Hibernate fills `id.orderId` from the associated `Order`'s PK,
      so you must not set it by hand. You set the non-derived key part (`productId`) on the
      embedded id and set the `order` association. Manually assigning the derived part is a
      common source of mismatched-key bugs.
    ref: "concepts.md#composite-keys-that-contain-a-foreign-key"

  - id: inheritance-embeddables-composite-keys-069
    difficulty: expert
    tags: [proxy, instanceof, lazy, inheritance, gotcha]
    question: |
      A lazily-loaded `@ManyToOne Payment payment` is actually a `CardPayment` in the DB, yet
      `payment instanceof CardPayment` returns false. Why, and what is the fix?
    options:
      - "The row's discriminator value is corrupt; re-run schema validation to repair the type token"
      - "payment is a HibernateProxy of the root type; use Hibernate.unproxy() or Hibernate.getClass()"
      - "instanceof never works with JPA entities; use reference == comparison against the class instead"
      - "Lazy loading disables polymorphism entirely; make the association fetch = EAGER permanently"
    answer: 1
    explanation: |
      A lazy association is a `HibernateProxy` subclass of the root type, so `instanceof` a
      concrete subtype is false and `getClass()` returns the proxy class. `Hibernate.unproxy()`
      returns the real instance and `Hibernate.getClass()` returns the true entity class.
    ref: "concepts.md#inheritance-proxies-and-the-instanceof-gotcha"

  - id: inheritance-embeddables-composite-keys-070
    difficulty: advanced
    tags: [equals-hashcode, lombok, anti-pattern, code-review]
    question: |
      In code review you see `@Data` from Lombok on a JPA `@Entity`. Why is this an
      anti-pattern?
    options:
      - "It generates too few methods to be useful for a persistent entity class"
      - "It only works on Java records and refuses to process ordinary @Entity classes"
      - "Its equals/hashCode/toString include all fields — pulling in the id (bucket instability) and touching lazy associations (extra queries / LazyInitializationException)"
      - "It makes every field final at compile time, breaking Hibernate's reflective population"
    answer: 2
    explanation: |
      `@Data` generates `equals`/`hashCode`/`toString` over all fields plus setters for
      everything. Including the generated id makes hashing unstable across persist; touching
      lazy associations triggers loads or `LazyInitializationException`; and it can break
      proxies. Prefer hand-written identity or a business-key-only inclusion.
    ref: "concepts.md#entity-identity-approaches-and-the-lombok-anti-pattern"

  - id: inheritance-embeddables-composite-keys-071
    difficulty: advanced
    tags: [equals-hashcode, uuid, best-practice, identity]
    question: |
      Which approach gives an entity a stable identity in a `HashSet` *before* it is persisted,
      without depending on the database?
    options:
      - "Basing hashCode on the DB-generated @Id assigned during the first flush"
      - "Assigning a business UUID in the constructor and using it for equals/hashCode"
      - "Recomputing and caching a fresh hashCode after each flush to the database"
      - "Using System.identityHashCode() on the instance as the hash source"
    answer: 1
    explanation: |
      An assigned UUID (or other business key) generated in the constructor means the entity
      has a stable, non-null identity from creation onward — so it behaves correctly in a
      `Set` across the transient→managed transition, unlike a DB-generated id which is null
      until persist.
    ref: "concepts.md#entity-identity-approaches-and-the-lombok-anti-pattern"

  - id: inheritance-embeddables-composite-keys-072
    difficulty: expert
    tags: [element-collection, order-column, update, mechanism]
    question: |
      For a `List<String>` `@ElementCollection`, adding `@OrderColumn` changes update behavior
      how, compared with the default?
    options:
      - "It flips the collection's fetch type to EAGER so the whole list loads up front"
      - "It stores a physical position column, letting Hibernate do positional UPDATEs instead of always deleting and re-inserting the whole list"
      - "It forces a dedicated second-level cache region to be created for the collection"
      - "It has no effect on the emitted SQL and only changes in-memory Java iteration order"
    answer: 1
    explanation: |
      Without a targetable key/position, Hibernate deletes all rows and re-inserts the list on
      change. `@OrderColumn` materializes the list index as a real column so Hibernate can
      perform positional UPDATEs for many mutations rather than wiping the collection.
    ref: "concepts.md#ordercolumn-vs-orderby-and-element-collection-internals"

  - id: inheritance-embeddables-composite-keys-073
    difficulty: advanced
    tags: [order-column, order-by, distinction]
    question: |
      What is the difference between `@OrderColumn` and `@OrderBy` on a collection?
    options:
      - "They are effectively synonyms; both simply append an ORDER BY to the load query and neither one persists a physical ordering column"
      - "@OrderColumn persists a physical position column Hibernate maintains; @OrderBy adds an ORDER BY to the load query and stores no ordering column"
      - "@OrderBy persists a physical position column that Hibernate maintains on writes, while @OrderColumn only sorts the collection in memory after loading"
      - "Both annotations persist a physical position column, but @OrderBy additionally builds a database index on it to speed the sort"
    answer: 1
    explanation: |
      `@OrderColumn` stores a physical ordering column so element order is persisted and
      incremental updates are cheaper. `@OrderBy` simply appends an `ORDER BY` clause based on
      element/property values when loading, storing no extra column.
    ref: "concepts.md#ordercolumn-vs-orderby-and-element-collection-internals"

  - id: inheritance-embeddables-composite-keys-074
    difficulty: expert
    tags: [polymorphism, mapped-superclass, hibernate, distinction]
    question: |
      Which statement about polymorphic querying is correct?
    options:
      - "A @MappedSuperclass can be queried polymorphically exactly like an @Inheritance root, returning every subclass instance from a single from-clause"
      - "A @MappedSuperclass is never queryable; Hibernate's implicit polymorphism (controlled by @Polymorphism) is a separate mechanism over concrete entities sharing a supertype/interface"
      - "Implicit polymorphism requires a @DiscriminatorColumn on the shared supertype before Hibernate will return entities across a common interface"
      - "@Polymorphism is a JPA-standard annotation defined in jakarta.persistence and is the portable, spec-mandated way to enable implicit polymorphic queries"
    answer: 1
    explanation: |
      `@MappedSuperclass` is not an entity and supports no polymorphic query. Hibernate's
      implicit polymorphism — returning entities that share an unmapped superclass/interface —
      is a distinct, Hibernate-specific behavior controlled by `@Polymorphism` (in
      `org.hibernate.annotations`), not JPA `@Inheritance`.
    ref: "concepts.md#implicit-vs-explicit-polymorphism"

  - id: inheritance-embeddables-composite-keys-075
    difficulty: expert
    tags: [table-per-class, association, union, gotcha]
    question: |
      Why is a `@ManyToOne Payment` (where `Payment` is abstract and mapped `TABLE_PER_CLASS`)
      problematic?
    options:
      - "The association is silently forced to EAGER fetching because TABLE_PER_CLASS roots cannot be proxied and lazily loaded at all"
      - "There is no parent table to reference, so it cannot be a plain FK; Hibernate must resolve the target via a UNION subquery (or reject the mapping)"
      - "Hibernate automatically rewrites the @ManyToOne into an @ElementCollection stored in a side collection table keyed by the owner"
      - "It requires a discriminator column, which the TABLE_PER_CLASS layout explicitly forbids on both the root and its concrete subclasses"
    answer: 1
    explanation: |
      With no shared parent table there is no single table for the FK to reference. Hibernate
      must resolve a polymorphic association to a `TABLE_PER_CLASS` root via a `UNION` across
      concrete tables, which is costly — a key reason the strategy is avoided when the base
      type is an association target.
    ref: "concepts.md#mixing-strategies-and-boot-time-failures"

  - id: inheritance-embeddables-composite-keys-076
    difficulty: advanced
    tags: [attribute-override, repeatable, hibernate6, syntax]
    question: |
      In Hibernate 6 / JPA 3, do you still need to wrap multiple `@AttributeOverride`
      annotations in an `@AttributeOverrides` container?
    options:
      - "Yes — @AttributeOverride was never made repeatable, so multiple overrides must always be wrapped in an @AttributeOverrides container"
      - "No — @AttributeOverride is repeatable, so you can list several directly (the wrapper still works)"
      - "Only for nested embeddables; top-level embeddable attributes still require the @AttributeOverrides wrapper for more than one override"
      - "Only when mapping Java records as embeddables; ordinary embeddable classes still need the @AttributeOverrides container for multiple overrides"
    answer: 1
    explanation: |
      Since JPA 3 / Hibernate 6, `@AttributeOverride` is a repeatable annotation, so you can
      place several directly on the field without the `@AttributeOverrides` wrapper (which
      remains valid for backward compatibility).
    ref: "concepts.md#nested-embeddables-and-dotted-path-overrides"

  - id: inheritance-embeddables-composite-keys-077
    difficulty: expert
    tags: [joined, delete, sql, mechanism]
    question: |
      Under `JOINED`, when you delete a `CardPayment` and the FK has no `ON DELETE CASCADE`,
      what does Hibernate do by default?
    options:
      - "Issues a single DELETE against only the root table and relies on the database to cascade the removal down to the subclass row"
      - "Issues two DELETEs itself — the subclass row first, then the root row"
      - "Performs a soft delete by flipping the discriminator column value, leaving both physical rows in place on disk"
      - "Refuses to perform the delete at all, throwing a constraint-violation exception because the subclass FK still references the root row"
    answer: 1
    explanation: |
      Because the entity spans two tables, Hibernate deletes the subclass row first (to
      satisfy the FK) and then the root row, issuing both statements itself. If the FK is
      declared `ON DELETE CASCADE` the DB could remove the child, but by default Hibernate
      manages both deletes.
    ref: "concepts.md#joined-polymorphic-sql-and-write-path"

  - id: inheritance-embeddables-composite-keys-078
    difficulty: intermediate
    tags: [embeddable, null, defensive, judgment]
    question: |
      Given the all-NULL-embeddable-returns-null behavior, which is a reasonable defensive
      design if you want `getAddress()` to never return null?
    options:
      - "Annotate the embedded field @NotNull so Hibernate automatically substitutes an empty Address instance whenever all backing columns are NULL"
      - "Keep at least one embeddable column mandatory (or null-guard on access)"
      - "Map the value object with @ElementCollection instead of @Embedded, since collection tables always return an empty element rather than null"
      - "Set fetch = EAGER on the embedded attribute, which forces Hibernate to instantiate the embeddable even when every column is NULL"
    answer: 1
    explanation: |
      Since Hibernate returns `null` when every backing column is NULL, keeping at least one
      column non-null (or explicitly null-guarding/normalizing on the getter) ensures a
      non-null embeddable is materialized. Fetch type and `@ElementCollection` do not change
      the all-null semantics.
    ref: "concepts.md#embeddable-null-semantics"

  - id: inheritance-embeddables-composite-keys-079
    difficulty: expert
    tags: [set, equals-hashcode, onetomany, scenario]
    question: |
      You add a new `Child` to a `Set<Child>` on the parent and save; later the child seems to
      have "vanished" from `parent.getChildren()`. `Child.hashCode()` is derived from its
      generated `@Id`. What happened?
    options:
      - "Hibernate physically deleted the child row during flush because a transient instance in a Set is treated as an orphan and removed"
      - "The id was null when added (transient); after persist assigned an id, hashCode changed and the element sits in a different bucket, so lookups miss it"
      - "The Set was silently converted to a List during flush, which dropped the most recently appended element from the collection"
      - "A cascade of orphanRemoval fired on the inverse side and deleted the child even though it was still referenced by the parent"
    answer: 1
    explanation: |
      Adding a transient child (id null) then persisting changes its `hashCode`, moving it to a
      different `HashSet` bucket than where it was placed, so membership/lookup fails. Fix with
      a stable identity: a business key, an assigned UUID, or a constant `hashCode` with
      id-based null-guarded `equals`.
    ref: "concepts.md#entity-identity-approaches-and-the-lombok-anti-pattern"

  - id: inheritance-embeddables-composite-keys-080
    difficulty: advanced
    tags: [mapped-superclass, inheritance, judgment, trade-off]
    question: |
      When would `@MappedSuperclass` beat an `@Inheritance` entity hierarchy, and what do you
      give up?
    options:
      - "When you need polymorphic queries over the base type; @MappedSuperclass supports them fully and you give up nothing in return"
      - "When you only want to reuse columns and never query/associate over the base type; you give up polymorphic queries and using the base as an association target"
      - "When subclass columns must be NOT NULL at the database level; you give up only the discriminator column in exchange"
      - "Always, in every hierarchy; @Inheritance was deprecated in JPA 3 and @MappedSuperclass is now the mandated replacement"
    answer: 1
    explanation: |
      `@MappedSuperclass` is ideal for pure column/mapping reuse (audit fields, a shared id)
      and avoids all inheritance-strategy trade-offs. The cost is that the base type is not an
      entity: no `from Base` polymorphic query and it cannot be the target of an association.
    ref: "concepts.md#mappedsuperclass-vs-inheritance"

