  options:
  - It forced dropping modules with incompatible licenses, including hibernate-ucp (Oracle UCP) and the TeradataDialect
  - It required renaming every package to org.apache.hibernate
  - It removed support for PostgreSQL
  - It made Hibernate closed-source
  answer: 0
  explanation: |
    The move to Apache License 2.0 (as of 7.0.0.Beta5) meant Hibernate had to drop
    components whose licenses were incompatible with ALv2 - notably hibernate-ucp (Oracle
    Universal Connection Pool integration) and the TeradataDialect.
  ref: concepts.md#hibernate-7-removed-session-methods-annotations-and-license-change
- id: hibernate-6-7-and-jakarta-migration-063
  difficulty: expert
  tags:
  - hibernate-7
  - scanning
  - hibernate-models
  question: |
    A team upgrades to Hibernate 7 and finds that classpath entity scanning no longer
    discovers their @Entity classes automatically. Which Hibernate 7 change explains this?
  options:
  - Entity scanning was removed permanently; you must list every entity in persistence.xml
  - Only records can be entities in Hibernate 7
  - Scanning requires the second-level cache to be enabled
  - hibernate-models replaced HCANN and classpath scanning now requires the opt-in hibernate-scan-jandex module
  answer: 3
  explanation: |
    Hibernate 7 replaced the HCANN annotation/reflection layer with hibernate-models, and
    Jandex-based classpath entity scanning is now an opt-in module (hibernate-scan-jandex).
    If it is not on the classpath, auto-scanning of entities no longer works.
  ref: concepts.md#hibernate-7-removed-session-methods-annotations-and-license-change
- id: hibernate-6-7-and-jakarta-migration-064
  difficulty: expert
  tags:
  - hibernate-7
  - native-query
  - java-time
  question: |
    On Hibernate 7, code doing `(java.sql.Date) nativeQuery.getSingleResult()` on a date
    column starts throwing ClassCastException. What is the cause and revert switch?
  options:
  - Native queries were removed in Hibernate 7
  - java.sql.Date is no longer a valid Java type
  - Hibernate 7 returns java.time types (e.g. LocalDate) for temporals in native queries by default; revert
    with hibernate.query.native.prefer_jdbc_datetime_types=true
  - You must cast to String instead
  answer: 2
  explanation: |
    Hibernate 7 defaults native-query temporal results to java.time types (LocalDate,
    LocalDateTime, etc.) rather than java.sql.Date/Time/Timestamp. Setting
    hibernate.query.native.prefer_jdbc_datetime_types=true restores the legacy java.sql return types.
  ref: concepts.md#hibernate-7-removed-session-methods-annotations-and-license-change
- id: hibernate-6-7-and-jakarta-migration-065
  difficulty: advanced
  tags:
  - hibernate-7
  - immutable
  - bulk-update
  question: |
    In Hibernate 7, what happens if a bulk HQL `update`/`delete` targets an entity annotated
    @Immutable?
  options:
  - It silently rewrites the rows anyway
  - It converts the update into a soft delete
  - It is a no-op that returns 0 rows without any signal
  - It throws (in Hibernate 6 this was only a warning)
  answer: 3
  explanation: |
    Hibernate 7 tightened @Immutable enforcement: a bulk update/delete against an immutable
    entity now throws, whereas Hibernate 6 merely logged a warning. This makes the
    immutability contract fail-fast.
  ref: concepts.md#hibernate-7-removed-session-methods-annotations-and-license-change
- id: hibernate-6-7-and-jakarta-migration-066
  difficulty: advanced
  tags:
  - query-api
  - restriction
  - range
  question: |
    Which new Hibernate 6.3+/7 API supports building a query incrementally with typesafe
    pieces like Restriction.greaterThan(...) and Range.closed(...)?
  options:
  - The removed org.hibernate.Criteria API
  - ResultTransformer
  - QuerySpecification/SelectionSpecification with Restriction and Range; Query#setOrder was removed in favor of it
  - '@NamedNativeQuery'
  answer: 2
  explanation: |
    Hibernate added QuerySpecification/SelectionSpecification/MutationSpecification plus
    Restriction and Range for typesafe, composable query building; Query#setOrder was
    removed in favor of SelectionSpecification-based ordering.
  ref: concepts.md#new-query-and-session-apis-restriction-range-and-json-functions
- id: hibernate-6-7-and-jakarta-migration-067
  difficulty: advanced
  tags:
  - query-api
  - findmultiple
  - options
  question: |
    Which statement about Hibernate's typesafe option objects (FindOption, LockOption,
    BatchSize, Timeout) and findMultiple/getMultiple is accurate?
  options:
  - findMultiple loads several entities by id in one call, and find/lock/refresh accept typesafe option objects
    instead of untyped Map<String,Object> hints
  - They are only available in Hibernate Reactive
  - They replace the EntityManager entirely
  - They disable the persistence context
  answer: 0
  explanation: |
    Hibernate added batch-by-id loading (findMultiple/getMultiple) and typesafe option
    objects (FindOption, LockOption, RefreshOption, ReadOnlyMode, EnabledFetchProfile,
    BatchSize, Timeout) that replace many untyped Map-based hints on find/lock/refresh.
  ref: concepts.md#new-query-and-session-apis-restriction-range-and-json-functions
- id: hibernate-6-7-and-jakarta-migration-068
  difficulty: intermediate
  tags:
  - hql
  - json-functions
  - vector
  question: |
    Which set of features reflects Hibernate 6.4+/7 currency in query/DB-function support?
  options:
  - Removal of HQL in favor of Criteria only
  - Mandatory native SQL for any aggregate
  - Dropping support for window functions
  - JSON/XML HQL functions (json_value, json_table, xmltable), set-returning functions (unnest, generate_series),
    and the hibernate-vector module for embedding columns
  answer: 3
  explanation: |
    Hibernate 6.4+/7 added JSON/XML HQL functions (json_object/json_value/json_table,
    xmlelement/xmlagg/xmltable), from-clause set-returning functions (unnest,
    generate_series), and a hibernate-vector module for vector/embedding columns (e.g. pgvector).
  ref: concepts.md#new-query-and-session-apis-restriction-range-and-json-functions
- id: hibernate-6-7-and-jakarta-migration-069
  difficulty: expert
  tags:
  - soft-delete
  - generated-sql
  - hibernate-6.4
  question: |
    An entity is annotated `@SoftDelete(strategy = SoftDeleteType.DELETED)`. What SQL does
    `em.remove(entity)` and a subsequent repository read produce?
  options:
  - remove issues a physical DELETE; reads are unaffected
  - remove throws because soft-deleted entities cannot be removed
  - remove issues `update ... set deleted = true where id = ? and deleted = false`, and reads append `... and
    deleted = false`
  - remove sets deleted = true but reads still return the row
  answer: 2
  explanation: |
    @SoftDelete turns a delete into an UPDATE that sets the soft-delete flag and adds a
    predicate excluding soft-deleted rows from every read. Hibernate 7 additionally supports
    soft-delete timestamp tracking. This is the native replacement for hand-rolled @Where + custom delete SQL.
  ref: concepts.md#softdelete-struct-and-native-database-enum-types
- id: hibernate-6-7-and-jakarta-migration-070
  difficulty: expert
  tags:
  - struct
  - embeddable
  - udt
  question: |
    What does Hibernate 6.2's @Struct annotation do when placed on an @Embeddable?
  options:
  - Serializes the embeddable to JSON automatically
  - Forces the embeddable into a separate join table
  - Marks the embeddable immutable
  - Maps the embeddable to a SQL structured/user-defined type (Oracle OBJECT or PostgreSQL composite) instead
    of flattening its fields into the parent table
  answer: 3
  explanation: |
    @Struct maps an embeddable to a database structured type (a UDT) - an Oracle OBJECT
    type or a PostgreSQL composite type - rather than inlining the component's columns into
    the owning table. It complements the JSON-embeddable option (@JdbcTypeCode(SqlTypes.JSON)).
  ref: concepts.md#softdelete-struct-and-native-database-enum-types
- id: hibernate-6-7-and-jakarta-migration-071
  difficulty: advanced
  tags:
  - postgres-enum
  - named-enum
  - sqltypes
  question: |
    On PostgreSQL, what is the difference between @JdbcTypeCode(SqlTypes.NAMED_ENUM) and
    @JdbcTypeCode(SqlTypes.NAMED_ORDINAL_ENUM)?
  options:
  - NAMED_ENUM stores by enum name and NAMED_ORDINAL_ENUM by position, both backed by a real PostgreSQL ENUM
    type created via DDL
  - NAMED_ENUM is for MySQL only; NAMED_ORDINAL_ENUM for PostgreSQL
  - They are identical aliases
  - NAMED_ENUM stores JSON; NAMED_ORDINAL_ENUM stores an integer
  answer: 0
  explanation: |
    Both create and use a native PostgreSQL ENUM type via DDL; NAMED_ENUM maps the Java
    enum by its constant name and NAMED_ORDINAL_ENUM by ordinal position. This is the
    modern alternative to a varchar/int column plus @Enumerated.
  ref: concepts.md#softdelete-struct-and-native-database-enum-types
- id: hibernate-6-7-and-jakarta-migration-072
  difficulty: expert
  tags:
  - sqm
  - literal-type-checking
  - hql
  question: |
    The HQL `where e.createdOn > '2024-01-01'` worked on Hibernate 5 but throws at parse
    time on Hibernate 6. What is the cause and the correct rewrite?
  options:
  - Hibernate 6 dropped the where clause; use a Criteria query
  - SQM does eager literal type-checking, so comparing a temporal path to a String literal fails; use a typed
    literal `where e.createdOn > date '2024-01-01'` (or a bind parameter)
  - String literals must be double-quoted in Hibernate 6
  - createdOn must be renamed to created_on in HQL
  answer: 1
  explanation: |
    The SQM validates types eagerly at parse time, so a temporal-vs-String comparison is
    rejected. Use a typed literal (date '2024-01-01', time, timestamp) or a bound parameter
    of the correct java.time type. Hibernate 5's looser translator silently accepted the string.
  ref: concepts.md#sqm-gotchas-eager-literal-type-checking-and-native-query-aliases
- id: hibernate-6-7-and-jakarta-migration-073
  difficulty: expert
  tags:
  - sqm
  - native-query
  - duplicate-columns
  question: |
    A native query `SELECT p.*, a.* FROM person p JOIN address a ON ...` returned entities
    fine on Hibernate 5 but now raises a duplicate-column error on Hibernate 6. Why?
  options:
  - Native joins are forbidden in Hibernate 6
  - Because Hibernate 6 reads results by column position, duplicate column names across the joined tables (e.g.
    two "id" columns) now collide; alias columns uniquely or use an explicit @SqlResultSetMapping
  - p.* is invalid SQL in Hibernate 6
  - The query must be rewritten in HQL
  answer: 1
  explanation: |
    Hibernate 6 reads result columns by position and requires unambiguous column labels.
    A join whose SELECT * produces duplicate names (like two id columns) now errors. Fix by
    aliasing columns to unique names or defining a @SqlResultSetMapping.
  ref: concepts.md#sqm-gotchas-eager-literal-type-checking-and-native-query-aliases
- id: hibernate-6-7-and-jakarta-migration-074
  difficulty: expert
  tags:
  - statelesssession
  - hibernate-7
  - l2-cache
  question: |
    A batch job on a StatelessSession starts returning stale data after upgrading to
    Hibernate 7. Which change is the likely cause and the fix?
  options:
  - StatelessSession gained a first-level cache; call clear() periodically
  - StatelessSession now caches query plans forever; disable the query cache
  - StatelessSession no longer flushes; call flush() manually
  - In Hibernate 7 StatelessSession uses the second-level cache by default (it never did before); bypass it
    with session.setCacheMode(CacheMode.IGNORE)
  answer: 3
  explanation: |
    Hibernate 7 changed StatelessSession to use the second-level cache by default, whereas
    previously it never touched it - so it can now return cached (stale) data. Set
    CacheMode.IGNORE on the stateless session to bypass the L2 cache for the batch.
  ref: concepts.md#statelesssession-in-hibernate-7-second-level-cache-and-batching
- id: hibernate-6-7-and-jakarta-migration-075
  difficulty: expert
  tags:
  - statelesssession
  - hibernate-7
  - batching
  question: |
    On Hibernate 7 you set hibernate.jdbc.batch_size=50 but a StatelessSession-based bulk
    insert still issues one INSERT per row. What is the correct way to batch it?
  options:
  - hibernate.jdbc.batch_size does not affect StatelessSession in HB7; call setJdbcBatchSize(n) on the stateless
    session or use insertMultiple()/updateMultiple()/deleteMultiple()
  - StatelessSession cannot batch under any circumstances
  - Enable the second-level cache to trigger batching
  - Switch to EAGER fetching to batch the inserts
  answer: 0
  explanation: |
    In Hibernate 7 the global hibernate.jdbc.batch_size no longer governs StatelessSession.
    Configure batching with setJdbcBatchSize(n) on the stateless session, or use the
    explicit batch operations insertMultiple/updateMultiple/deleteMultiple that Hibernate 7 added.
  ref: concepts.md#statelesssession-in-hibernate-7-second-level-cache-and-batching
- id: hibernate-6-7-and-jakarta-migration-076
  difficulty: advanced
  tags:
  - bytecode-enhancement
  - lazy-attribute
  - hibernate-6.2
  question: |
    Which statement about bytecode enhancement defaults in Hibernate 6.2 is correct?
  options:
  - enableLazyInitialization and enableDirtyTracking default to false and must be enabled manually
  - enableLazyInitialization and enableDirtyTracking default to true and are deprecated for removal (becoming
    always-on), and use_reflection_optimizer also defaults to true
  - Bytecode enhancement was removed in Hibernate 6.2
  - Enhancement is only available at runtime, never at build time
  answer: 1
  explanation: |
    As of Hibernate 6.2, hibernate.enhancer.enableLazyInitialization and
    enableDirtyTracking default to true and are deprecated for removal (heading toward
    always-on), and use_reflection_optimizer defaults to true. This makes lazy attribute
    loading and field-level dirty tracking standard, and favors build-time enhancement for startup cost.
  ref: concepts.md#bytecode-enhancement-always-on-lazy-init-and-dirty-tracking
- id: hibernate-6-7-and-jakarta-migration-077
  difficulty: advanced
  tags:
  - persistence-xml
  - namespace
  - bootstrap-failure
  question: |
    A migrated app fails at bootstrap parsing persistence.xml. The file still declares
    `version="2.2"` with `http://xmlns.jcp.org/xml/ns/persistence`. What is required for
    Hibernate 6/7?
  options:
  - Nothing changes; persistence.xml is namespace-agnostic
  - Use schema https://jakarta.ee/xml/ns/persistence with a matching version (3.1 for HB6, 3.2 for HB7); the
    stale jcp.org namespace and 2.2 version fail parsing
  - Rename persistence.xml to jakarta-persistence.xml
  - Convert it to application.yml
  answer: 1
  explanation: |
    The persistence.xml must use the Jakarta schema https://jakarta.ee/xml/ns/persistence
    with a version attribute matching the runtime (3.0 rename, 3.1 for Hibernate 6, 3.2 for
    Hibernate 7). Leaving the old jcp.org namespace or version="2.2" breaks XML parsing at bootstrap.
  ref: concepts.md#jakarta-migration-mechanics-bytecode-transformation-and-persistencexml
- id: hibernate-6-7-and-jakarta-migration-078
  difficulty: advanced
  tags:
  - migration-tooling
  - eclipse-transformer
  - openrewrite
  question: |
    Which distinction between the two common javax->jakarta migration tools is accurate?
  options:
  - Both only work on source code and cannot touch dependencies
  - The Eclipse Transformer rewrites javax.* to jakarta.* inside compiled bytecode (for jars you cannot recompile),
    while the OpenRewrite recipe JavaxMigrationToJakarta rewrites your own source
  - OpenRewrite adds a runtime alias so javax classes resolve to jakarta
  - The Eclipse Transformer only edits persistence.xml
  answer: 1
  explanation: |
    The Eclipse Transformer operates on compiled bytecode, letting you migrate third-party
    jars you cannot recompile (Spring Boot's tooling wraps it). OpenRewrite's
    org.openrewrite.java.migrate.jakarta.JavaxMigrationToJakarta recipe rewrites your own
    source. Neither provides a runtime javax<->jakarta alias.
  ref: concepts.md#jakarta-migration-mechanics-bytecode-transformation-and-persistencexml
