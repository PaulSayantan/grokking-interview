    Hibernate 7 changed StatelessSession to use the second-level cache by default, whereas
    previously it never touched it - so it can now return cached (stale) data. Set
    CacheMode.IGNORE on the stateless session to bypass the L2 cache for the batch.
  ref: concepts.md#statelesssession-in-hibernate-7-second-level-cache-and-batching
- id: hibernate-6-7-and-jakarta-migration-075
  difficulty: expert
  tags:
  - statelesssession
  - hibernate-7
  - batching
  question: |
    On Hibernate 7 you set hibernate.jdbc.batch_size=50 but a StatelessSession-based bulk
    insert still issues one INSERT per row. What is the correct way to batch it?
  options:
  - hibernate.jdbc.batch_size does not affect StatelessSession in HB7; call setJdbcBatchSize(n) on the stateless
    session or use insertMultiple()/updateMultiple()/deleteMultiple()
  - A StatelessSession cannot batch DML under any circumstances in Hibernate 7; bulk inserts must be routed
    through a normal Session with periodic flush()/clear() to get JDBC batching at all
  - Enable the second-level cache so Hibernate coalesces the pending row-level inserts into a single batched
    statement when the stateless session flushes
  - Switch every association on the entity to EAGER fetching, which lets Hibernate group the inserts into one
    JDBC batch instead of a statement per row
  answer: 0
  explanation: |
    In Hibernate 7 the global hibernate.jdbc.batch_size no longer governs StatelessSession.
    Configure batching with setJdbcBatchSize(n) on the stateless session, or use the
    explicit batch operations insertMultiple/updateMultiple/deleteMultiple that Hibernate 7 added.
  ref: concepts.md#statelesssession-in-hibernate-7-second-level-cache-and-batching
- id: hibernate-6-7-and-jakarta-migration-076
  difficulty: advanced
  tags:
  - bytecode-enhancement
  - lazy-attribute
  - hibernate-6.2
  question: |
    Which statement about bytecode enhancement defaults in Hibernate 6.2 is correct?
  options:
  - enableLazyInitialization and enableDirtyTracking still default to false in Hibernate 6.2 and must be switched
    on manually, while use_reflection_optimizer defaults to true to compensate
  - enableLazyInitialization and enableDirtyTracking default to true and are deprecated for removal (becoming
    always-on), and use_reflection_optimizer also defaults to true
  - Bytecode enhancement was removed in Hibernate 6.2, so lazy-attribute loading and dirty tracking now rely
    entirely on runtime reflection through the reflection optimizer
  - Enhancement is available only as a runtime java agent in Hibernate 6.2, never through the Gradle/Maven
    build-time plugins that earlier versions offered
  answer: 1
  explanation: |
    As of Hibernate 6.2, hibernate.enhancer.enableLazyInitialization and
    enableDirtyTracking default to true and are deprecated for removal (heading toward
    always-on), and use_reflection_optimizer defaults to true. This makes lazy attribute
    loading and field-level dirty tracking standard, and favors build-time enhancement for startup cost.
  ref: concepts.md#bytecode-enhancement-always-on-lazy-init-and-dirty-tracking
- id: hibernate-6-7-and-jakarta-migration-077
  difficulty: advanced
  tags:
  - persistence-xml
  - namespace
  - bootstrap-failure
  question: |
    A migrated app fails at bootstrap parsing persistence.xml. The file still declares
    `version="2.2"` with `http://xmlns.jcp.org/xml/ns/persistence`. What is required for
    Hibernate 6/7?
  options:
  - Nothing changes; persistence.xml is namespace-agnostic and the provider resolves it purely by its file name
    regardless of the declared jcp.org schema or version="2.2"
  - Use schema https://jakarta.ee/xml/ns/persistence with a matching version (3.1 for HB6, 3.2 for HB7); the
    stale jcp.org namespace and 2.2 version fail parsing
  - Rename the descriptor from persistence.xml to jakarta-persistence.xml so the Jakarta bootstrap scanner
    recognizes it, keeping the existing jcp.org namespace and version="2.2" intact
  - Convert the descriptor from XML to an application.yml file, since Jakarta Persistence 3.x replaced the XML
    unit format with a YAML-based configuration model
  answer: 1
  explanation: |
    The persistence.xml must use the Jakarta schema https://jakarta.ee/xml/ns/persistence
    with a version attribute matching the runtime (3.0 rename, 3.1 for Hibernate 6, 3.2 for
    Hibernate 7). Leaving the old jcp.org namespace or version="2.2" breaks XML parsing at bootstrap.
  ref: concepts.md#jakarta-migration-mechanics-bytecode-transformation-and-persistencexml
- id: hibernate-6-7-and-jakarta-migration-078
  difficulty: advanced
  tags:
  - migration-tooling
  - eclipse-transformer
  - openrewrite
  question: |
    Which distinction between the two common javax->jakarta migration tools is accurate?
  options:
  - Both tools operate only on your own source files and cannot touch pre-compiled dependencies, so any javax
    jar you cannot rebuild has to be forked and recompiled against the jakarta APIs by hand
  - The Eclipse Transformer rewrites javax.* to jakarta.* inside compiled bytecode (for jars you cannot recompile),
    while the OpenRewrite recipe JavaxMigrationToJakarta rewrites your own source
  - OpenRewrite installs a classloading-time alias so javax.persistence classes transparently resolve to their
    jakarta.persistence counterparts without any code or bytecode being changed
  - The Eclipse Transformer only rewrites the XML namespace inside persistence.xml and orm.xml, leaving all of
    the javax.* imports in the Java sources for OpenRewrite to handle separately
  answer: 1
  explanation: |
    The Eclipse Transformer operates on compiled bytecode, letting you migrate third-party
    jars you cannot recompile (Spring Boot's tooling wraps it). OpenRewrite's
    org.openrewrite.java.migrate.jakarta.JavaxMigrationToJakarta recipe rewrites your own
    source. Neither provides a runtime javax<->jakarta alias.
  ref: concepts.md#jakarta-migration-mechanics-bytecode-transformation-and-persistencexml
