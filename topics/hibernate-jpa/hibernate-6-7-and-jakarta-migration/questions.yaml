topic: 'Modern Hibernate: 6/7 Changes & Jakarta Migration'
domain: hibernate-jpa
topic_slug: hibernate-6-7-and-jakarta-migration
version: 1
questions:
- id: hibernate-6-7-and-jakarta-migration-001
  difficulty: beginner
  tags:
  - jakarta
  - namespace
  - migration
  question: |
    In modern Jakarta Persistence (used by Hibernate 6/7), what is the correct
    import for the @Entity annotation?
  options:
  - javax.persistence.Entity
  - org.hibernate.annotations.Entity
  - jakarta.persistence.Entity
  - jakarta.orm.Entity
  answer: 2
  explanation: |
    Jakarta EE 9 renamed the persistence package root from javax.persistence to
    jakarta.persistence. Hibernate 6+/7 use the jakarta.persistence namespace
    exclusively. The org.hibernate.* package holds Hibernate-native extensions,
    not the standard @Entity.
  ref: concepts.md#the-jakarta-namespace-migration-javaxpersistence-to-jakartapersistence
- id: hibernate-6-7-and-jakarta-migration-002
  difficulty: intermediate
  tags:
  - jakarta
  - namespace
  - compatibility
  question: |
    Why is javax.persistence -> jakarta.persistence described as a "breaking
    change" rather than a normal version bump?
  options:
  - It renames the package, and since the fully-qualified name IS the type, old bytecode no longer links
    against the new jars
  - The annotation semantics changed, so mappings behave differently
  - It requires a database migration to rename columns
  - It only affects XML configuration, not annotations
  answer: 0
  explanation: |
    The rename carries zero behavioral change - the annotations and semantics are
    identical. But the fully-qualified class name is the type identity in the JVM,
    so javax.persistence.Entity and jakarta.persistence.Entity are unrelated types.
    Code/bytecode compiled against javax will not link against Jakarta jars.
  ref: concepts.md#the-jakarta-namespace-migration-javaxpersistence-to-jakartapersistence
- id: hibernate-6-7-and-jakarta-migration-003
  difficulty: intermediate
  tags:
  - trademark
  - eclipse
  - oracle
  - history
  question: |
    What is the actual reason the Java EE persistence APIs were renamed to the
    jakarta namespace?
  options:
  - The javax package hit a class-count limit in the JVM
  - The rename was needed to support Java modules (JPMS)
  - Hibernate requested the rename to decouple from Oracle
  - Oracle retained the javax trademark and froze it; when Java EE moved to the Eclipse Foundation, Eclipse
    could not add features under javax and had to relocate to a namespace it owned
  answer: 3
  explanation: |
    When Oracle donated Java EE to the Eclipse Foundation (rebranded Jakarta EE), it
    kept the javax package namespace as a trademark and did not license its evolution.
    Eclipse could ship existing javax APIs unchanged but could not add new features
    under javax, forcing the rename to the jakarta namespace it controls.
  ref: concepts.md#why-the-rename-happened-the-oracleeclipse-trademark-handoff
- id: hibernate-6-7-and-jakarta-migration-004
  difficulty: intermediate
  tags:
  - jakarta-ee-9
  - history
  question: |
    What was distinctive about the Jakarta EE 9 release specifically?
  options:
  - It added the SQM query engine
  - It was a big-bang javax -> jakarta rename with essentially no new features, done so the ecosystem
    could migrate before new functionality landed
  - It dropped support for JPA entirely
  - It introduced reactive persistence
  answer: 1
  explanation: |
    Jakarta EE 9 (2020) deliberately shipped only the namespace rename with no new
    features. This let downstream projects adopt the jakarta namespace first; new
    functionality then arrived in Jakarta EE 9.1, 10, and 11 (Persistence 3.1, 3.2).
  ref: concepts.md#why-the-rename-happened-the-oracleeclipse-trademark-handoff
- id: hibernate-6-7-and-jakarta-migration-005
  difficulty: intermediate
  tags:
  - spring-boot-3
  - versions
  question: |
    A team upgrades from Spring Boot 2.x to Spring Boot 3.0. Which set of
    requirements does Boot 3 impose?
  options:
  - Java 17+, jakarta namespace, Hibernate 6
  - Java 8+, javax namespace, Hibernate 5
  - Java 11+, jakarta namespace, Hibernate 5.6
  - Java 21+, either namespace, Hibernate 7
  answer: 0
  explanation: |
    Spring Boot 3.0 (Nov 2022) moved to the jakarta.* namespace, requires Java 17+,
    and depends on Hibernate 6. That is why a Boot 2->3 upgrade drags in the whole
    Jakarta + Hibernate 6 migration at once.
  ref: concepts.md#version-alignment-hibernate-5-vs-6-vs-7-jakarta-spec-jdk-baseline-spring-boot
- id: hibernate-6-7-and-jakarta-migration-006
  difficulty: advanced
  tags:
  - hibernate-5-6
  - bridge
  - migration-strategy
  question: |
    Why is Hibernate 5.6 useful as a stepping stone in a migration to the jakarta
    namespace?
  options:
  - It automatically rewrites your entities to Hibernate 6 APIs
  - It supports both SQM and the legacy translator simultaneously
  - It ships an experimental jakarta artifact, letting you flip the namespace before making the larger
    jump to Hibernate 6
  - It is the last version to support the jakarta namespace
  answer: 2
  explanation: |
    Hibernate 5.6 offers a jakarta-namespace build (hibernate-core-jakarta) as a bridge.
    A team can migrate the namespace while still on Hibernate 5.6, then tackle the
    larger Hibernate 6 changes (SQM, new type system, removed APIs) as a separate step.
  ref: concepts.md#version-alignment-hibernate-5-vs-6-vs-7-jakarta-spec-jdk-baseline-spring-boot
- id: hibernate-6-7-and-jakarta-migration-007
  difficulty: intermediate
  tags:
  - jakarta-persistence
  - versions
  - spec
  question: |
    Which Jakarta Persistence spec level ships with Hibernate 7?
  options:
  - JPA 2.2
  - Jakarta Persistence 3.2
  - Jakarta Persistence 3.0
  - Jakarta Persistence 3.1
  answer: 1
  explanation: |
    Hibernate 6.x targets Jakarta Persistence 3.1; Hibernate 7 (2025) targets Jakarta
    Persistence 3.2 (Jakarta EE 11) and bumps the Java baseline to 17. Jakarta
    Persistence 3.0 was the pure rename equivalent to JPA 2.2.
  ref: concepts.md#version-alignment-hibernate-5-vs-6-vs-7-jakarta-spec-jdk-baseline-spring-boot
- id: hibernate-6-7-and-jakarta-migration-008
  difficulty: intermediate
  tags:
  - jakarta-persistence
  - 3.0
  - rename
  question: |
    What did Jakarta Persistence 3.0 add functionally compared with JPA 2.2?
  options:
  - UUID generation and EXTRACT
  - The SQM query engine
  - Records for constructor projections
  - Nothing functional - it was the pure javax -> jakarta rename with JPA 2.2 semantics
  answer: 3
  explanation: |
    Jakarta Persistence 3.0 was purely the namespace rename; it carried JPA 2.2
    semantics under jakarta.*. Functional additions came in 3.1 (UUID generation,
    EXTRACT, math functions) and 3.2.
  ref: concepts.md#version-alignment-hibernate-5-vs-6-vs-7-jakarta-spec-jdk-baseline-spring-boot
- id: hibernate-6-7-and-jakarta-migration-009
  difficulty: advanced
  tags:
  - sqm
  - query-engine
  - hibernate-6
  question: |
    What is the Semantic Query Model (SQM) introduced in Hibernate 6?
  options:
  - A caching layer for compiled queries
  - A replacement for the persistence context
  - A new second-level cache provider
  - A typed, database-agnostic AST that both HQL/JPQL and the Criteria API compile into, before being
    lowered to a SQL AST and rendered by the dialect
  answer: 3
  explanation: |
    SQM is the heart of Hibernate 6's rewritten query engine: a typed, DB-agnostic
    abstract syntax tree. HQL/JPQL strings and the Criteria API both compile to the
    same SQM, which is then lowered to a SQL AST and translated to vendor SQL by the
    dialect.
  ref: concepts.md#hibernate-6-the-sqm-semantic-query-model-query-engine
- id: hibernate-6-7-and-jakarta-migration-010
  difficulty: advanced
  tags:
  - sqm
  - criteria
  - hql
  - consistency
  question: |
    A benefit of Hibernate 6 compiling both HQL/JPQL and Criteria into the same SQM is:
  options:
  - It makes native SQL queries type-safe
  - String queries and the Criteria API share one typed model, so their behavior is consistent and queries
    are validated against the entity metamodel before SQL is generated
  - It eliminates the need for a dialect
  - It removes the first-level cache overhead
  answer: 1
  explanation: |
    In Hibernate 5 the Criteria and HQL paths were largely separate. Unifying them on
    SQM means consistent behavior and early, metamodel-based type validation of the
    query before any SQL is produced.
  ref: concepts.md#hibernate-6-the-sqm-semantic-query-model-query-engine
- id: hibernate-6-7-and-jakarta-migration-011
  difficulty: advanced
  tags:
  - sqm
  - read-by-position
  - migration-gotcha
  question: |
    Hibernate 6 reads query results by column POSITION rather than by name/alias.
    Which practical consequence should a migrator watch for?
  options:
  - Some hand-tuned native queries or result-set mappings that relied on Hibernate 5's by-name behavior,
    or on a particular column order/casing, may need adjustment
  - Entity caching is disabled
  - Lazy loading stops working
  - All queries must be rewritten in Criteria
  answer: 0
  explanation: |
    Reading by position produces cleaner, more optimizable SQL but changes assumptions
    for code that depended on column names/aliases or a specific column order. Native
    queries and custom result mappings are the usual places this surfaces.
  ref: concepts.md#hibernate-6-the-sqm-semantic-query-model-query-engine
- id: hibernate-6-7-and-jakarta-migration-012
  difficulty: advanced
  tags:
  - type-system
  - javatype
  - jdbctype
  question: |
    In Hibernate 6's new type system, how is a mapped basic value modeled?
  options:
  - As a single monolithic org.hibernate.type.Type
  - As a UserType plus a TypeDef
  - As a pair of a JavaType (Java-side representation/handling) and a JdbcType (how it is read/written
    via JDBC)
  - As a JPA AttributeConverter only
  answer: 2
  explanation: |
    Hibernate 6 split the old monolithic Type into two descriptors: JavaType<T>
    (comparison, mutability, wrapping on the Java side) and JdbcType (which
    java.sql.Types code and how to set/get on statements/result sets). A basic mapping
    is a (JavaType, JdbcType) pair.
  ref: concepts.md#the-revamped-type-system-javatype-jdbctype-and-jdbctypecode
- id: hibernate-6-7-and-jakarta-migration-013
  difficulty: advanced
  tags:
  - type-system
  - jdbctypecode
  - migration-gotcha
  question: |
    Which Hibernate 6 annotation overrides the SQL/JDBC type used for a basic
    attribute (for example forcing a UUID to be stored as VARCHAR)?
  options:
  - '@Type("varchar")'
  - '@JdbcTypeCode(SqlTypes.VARCHAR)'
  - '@TypeDef'
  - '@Column(columnDefinition = "varchar")'
  answer: 1
  explanation: |
    @JdbcTypeCode with a SqlTypes constant is the modern way to control the JDBC/SQL
    side of a basic mapping. The string-based @Type and @TypeDef are legacy;
    @Column(columnDefinition) only affects DDL generation, not how Hibernate binds the
    value.
  ref: concepts.md#the-revamped-type-system-javatype-jdbctype-and-jdbctypecode
- id: hibernate-6-7-and-jakarta-migration-014
  difficulty: intermediate
  tags:
  - json
  - jdbctypecode
  - mapping
  question: |
    In Hibernate 6, how do you map a POJO attribute to a JSON/JSONB SQL column
    without a third-party library?
  options:
  - '@Type("jsonb") from the Hibernate-Types library'
  - '@Convert(converter = JsonConverter.class) is the only option'
  - '@Lob'
  - '@JdbcTypeCode(SqlTypes.JSON)'
  answer: 3
  explanation: |
    Hibernate 6 has built-in JSON support via @JdbcTypeCode(SqlTypes.JSON). Previously
    you needed a third-party UserType (e.g. the Hibernate-Types library). @Lob and a
    manual converter work but are not the built-in idiomatic solution.
  ref: concepts.md#the-revamped-type-system-javatype-jdbctype-and-jdbctypecode
- id: hibernate-6-7-and-jakarta-migration-015
  difficulty: advanced
  tags:
  - type-annotations
  - migration-gotcha
  - compile-error
  question: |
    A Hibernate 5 codebase uses @Type("json") and @TypeDef. What happens when
    compiling against Hibernate 6?
  options:
  - It compiles and behaves identically
  - It compiles but silently ignores the annotations
  - It will not compile unchanged - @Type now takes a UserType class (not a string) and @TypeDef is deprecated/removed,
    so string-based type mappings must be migrated to the new type-descriptor annotations
  - It works only if you keep the javax namespace
  answer: 2
  explanation: |
    In Hibernate 6, @Type's signature changed to accept a UserType class rather than a
    string name, and @TypeDef was deprecated/removed. String-based @Type("json") and
    Hibernate-Types annotations do not compile unchanged - a very common migration
    breakage that must be replaced with @JdbcTypeCode/@JavaType.
  ref: concepts.md#the-revamped-type-system-javatype-jdbctype-and-jdbctypecode
- id: hibernate-6-7-and-jakarta-migration-016
  difficulty: intermediate
  tags:
  - uuid
  - id-generation
  - jakarta-3.1
  question: |
    Jakarta Persistence 3.1 added a portable way to auto-generate a UUID primary key.
    Which annotation expresses it?
  options:
  - '@GeneratedValue(strategy = GenerationType.UUID)'
  - '@GeneratedValue(strategy = GenerationType.IDENTITY)'
  - '@GeneratedValue(generator = "uuid2")'
  - '@Id @UuidGenerator'
  answer: 0
  explanation: |
    Jakarta Persistence 3.1 standardized GenerationType.UUID so you can portably
    auto-generate a java.util.UUID id via @GeneratedValue(strategy = GenerationType.UUID),
    instead of relying on Hibernate-proprietary generators like "uuid2". (Hibernate's
    @UuidGenerator is a native extension.)
  ref: concepts.md#jakarta-persistence-31-features-hibernate-6
- id: hibernate-6-7-and-jakarta-migration-017
  difficulty: intermediate
  tags:
  - jakarta-3.1
  - hql
  - functions
  question: |
    Which capability was added by Jakarta Persistence 3.1 (shipped with Hibernate 6)?
  options:
  - The @TenantId annotation
  - The SQM query engine
  - The EXTRACT function and math functions (CEILING, FLOOR, ROUND, POWER, etc.) in JPQL/HQL
  - Records for constructor projections
  answer: 2
  explanation: |
    Jakarta Persistence 3.1 added EXTRACT(field FROM datetime) and standard math
    functions to JPQL. @TenantId and SQM are Hibernate features, and records in
    constructor projections are a 3.2/Hibernate-7-era enhancement.
  ref: concepts.md#jakarta-persistence-31-features-hibernate-6
- id: hibernate-6-7-and-jakarta-migration-018
  difficulty: advanced
  tags:
  - jakarta-3.2
  - hibernate-7
  - features
  question: |
    Which is an accurate statement about Jakarta Persistence 3.2 (with Hibernate 7)?
  options:
  - It makes java.time types and java.util.UUID first-class basic types and improves record/DTO projection
    support
  - It removes support for the Criteria API
  - It reverts the jakarta namespace back to javax
  - It drops the entity lifecycle callbacks
  answer: 0
  explanation: |
    Jakarta Persistence 3.2 elevates java.time and UUID to first-class basic types,
    improves DTO/record projections and EntityGraph typing, and adds Criteria set
    operations. The Criteria API and lifecycle callbacks remain; the namespace stays
    jakarta.
  ref: concepts.md#jakarta-persistence-32-and-hibernate-627-enhancements
- id: hibernate-6-7-and-jakarta-migration-019
  difficulty: intermediate
  tags:
  - hibernate-7
  - jdk-baseline
  question: |
    What is the minimum Java (JDK) baseline for Hibernate 7?
  options:
  - JDK 8
  - JDK 11
  - JDK 21
  - JDK 17
  answer: 3
  explanation: |
    Hibernate 7 bumps the Java baseline to JDK 17 (matching the Spring Boot 3 / Jakarta
    EE 11 era). Hibernate 6 targeted JDK 11.
  ref: concepts.md#jakarta-persistence-32-and-hibernate-627-enhancements
- id: hibernate-6-7-and-jakarta-migration-020
  difficulty: advanced
  tags:
  - statelesssession
  - batch
  - first-level-cache
  question: |
    Which statement about Hibernate's StatelessSession is correct?
  options:
  - It provides a larger first-level cache for better performance
  - It has no persistence context - no first-level cache, no dirty checking, no cascade, and no auto-flush
    - so it suits high-volume batch work
  - It automatically enables the second-level cache
  - It is the default session type in Hibernate 7
  answer: 1
  explanation: |
    StatelessSession is a command-oriented API with no persistence context: no
    first-level cache, no automatic dirty checking, no cascade, no lazy proxies, and no
    auto-flush. You issue insert/update/delete explicitly. It exists for bulk/batch work
    where tracking many managed entities is the bottleneck.
  ref: concepts.md#statelesssession-jakarta-data--hibernate-reactive
- id: hibernate-6-7-and-jakarta-migration-021
  difficulty: advanced
  tags:
  - statelesssession
  - lazy-loading
  - gotcha
  question: |
    You process one million rows in a batch job using a StatelessSession and try to
    navigate a lazy @OneToMany association on a loaded entity. What happens?
  options:
  - There is no backing persistence context, so lazy loading is not available - you must fetch associations
    explicitly (e.g. via a join)
  - It lazily loads the collection as usual
  - It throws OptimisticLockException
  - It silently returns an empty collection every time
  answer: 0
  explanation: |
    A StatelessSession has no persistence context to back lazy proxies, so lazy loading
    of associations is not available. You must fetch the data you need explicitly. This
    is a deliberate trade-off for batch throughput and low memory.
  ref: concepts.md#statelesssession-jakarta-data--hibernate-reactive
- id: hibernate-6-7-and-jakarta-migration-022
  difficulty: advanced
  tags:
  - hibernate-reactive
  - mutiny
  - non-blocking
  question: |
    What is Hibernate Reactive?
  options:
  - A second-level cache that reacts to invalidation events
  - The default runtime mode of Hibernate 7
  - A non-blocking implementation built on Mutiny/Vert.x reactive DB clients, exposing reactive sessions
    that return Uni/CompletionStage instead of blocking
  - A tool that reactively regenerates the database schema
  answer: 2
  explanation: |
    Hibernate Reactive is a separate project layered on Hibernate ORM core that provides
    non-blocking persistence using SmallRye Mutiny and Vert.x reactive DB clients (used
    heavily by Quarkus). It returns Uni/CompletionStage rather than blocking. It is not
    the default ORM runtime.
  ref: concepts.md#statelesssession-jakarta-data--hibernate-reactive
- id: hibernate-6-7-and-jakarta-migration-023
  difficulty: intermediate
  tags:
  - jakarta-data
  - repositories
  - spring-data
  question: |
    What is Jakarta Data?
  options:
  - A new database engine bundled with Hibernate 7
  - A specification for repository abstractions (@Repository, CrudRepository, @Find, @Query) - a standardized,
    Spring-Data-like repository model at the Jakarta level
  - A replacement for JDBC
  - The new name for the second-level cache
  answer: 1
  explanation: |
    Jakarta Data standardizes repository-style data access (@Repository, CrudRepository,
    @Find, @Query, @Save) at the Jakarta EE level - conceptually similar to Spring Data.
    Hibernate provides an implementation via an annotation processor. See
    spring-data-jpa-repositories for the Spring equivalent most teams use today.
  ref: concepts.md#statelesssession-jakarta-data--hibernate-reactive
- id: hibernate-6-7-and-jakarta-migration-024
  difficulty: advanced
  tags:
  - tenantid
  - multi-tenancy
  - hibernate-6
  question: |
    What does Hibernate 6's @TenantId annotation do for discriminator-based
    multi-tenancy?
  options:
  - Creates a separate database per tenant automatically
  - Encrypts the tenant column
  - Disables the second-level cache for multi-tenant entities
  - Marks a tenant-discriminator attribute that Hibernate auto-populates on insert and auto-filters with
    a WHERE tenant_id = ? predicate on reads/updates/deletes
  answer: 3
  explanation: |
    @TenantId marks the tenant-discriminator field. Hibernate auto-populates it on
    insert (from the CurrentTenantIdentifierResolver) and automatically appends a
    tenant predicate to generated SQL, so application queries need not reference the
    tenant column. Separate-database/schema tenancy uses a MultiTenantConnectionProvider
    instead.
  ref: concepts.md#tenantid-and-multi-tenancy-improvements
- id: hibernate-6-7-and-jakarta-migration-025
  difficulty: advanced
  tags:
  - multi-tenancy
  - models
  question: |
    Which multi-tenancy models does Hibernate support besides the discriminator
    (shared table) model enabled by @TenantId?
  options:
  - Only the discriminator model is supported
  - Row-level encryption tenancy
  - Column-sharded tenancy only
  - Separate database and separate schema per tenant, via a MultiTenantConnectionProvider
  answer: 3
  explanation: |
    Hibernate supports three classic models: separate database, separate schema, and
    discriminator (shared table). The first two are driven by a
    MultiTenantConnectionProvider; @TenantId made the discriminator model a low-ceremony
    first-class feature.
  ref: concepts.md#tenantid-and-multi-tenancy-improvements
- id: hibernate-6-7-and-jakarta-migration-026
  difficulty: advanced
  tags:
  - dialect
  - migration-gotcha
  - hibernate-6
  question: |
    A Hibernate 5 app sets hibernate.dialect=org.hibernate.dialect.PostgreSQL95Dialect.
    After upgrading to Hibernate 6 it fails to boot. Why?
  options:
  - Hibernate 6 no longer supports PostgreSQL
  - Version-specific dialect classes were removed; Hibernate 6 auto-detects the dialect from the JDBC
    connection and uses a single versioned PostgreSQLDialect - the old class name is invalid
  - PostgreSQL requires the reactive driver in Hibernate 6
  - The dialect must now be set in persistence.xml, not application.properties
  answer: 1
  explanation: |
    Hibernate 6 auto-detects the dialect from the connection metadata, so you usually
    stop specifying hibernate.dialect. The version-numbered dialect classes (e.g.
    PostgreSQL95Dialect, MySQL8Dialect) were removed/deprecated in favor of single
    versioned dialects. Keeping the old class name is a frequent boot failure.
  ref: concepts.md#migration-gotchas-what-actually-breaks-a-hibernate-56-upgrade
- id: hibernate-6-7-and-jakarta-migration-027
  difficulty: advanced
  tags:
  - boolean-mapping
  - migration-gotcha
  - schema
  question: |
    An existing Oracle schema stores a flag as CHAR(1) 'Y'/'N', historically mapped as
    a Java boolean. After a Hibernate 6 upgrade the app misbehaves on that column. What
    is the likely cause?
  options:
  - Hibernate 6's type system maps boolean to a BOOLEAN/BIT type by default, so a column that relied on
    legacy Y/N or 0/1 behavior now mismatches and needs an explicit @JdbcTypeCode or converter
  - Hibernate 6 cannot map boolean at all
  - boolean columns must now be @Transient
  - The column must be renamed to match the field
  answer: 0
  explanation: |
    Hibernate 6's new type system changed default boolean handling (BOOLEAN/BIT). Apps
    that stored booleans as CHAR(1) 'Y'/'N' or 0/1 via legacy defaults can hit a
    type/value mismatch and must pin the mapping explicitly (e.g. @JdbcTypeCode or an
    AttributeConverter). These silent type mismatches against a brownfield schema are the
    most dangerous migration gotchas.
  ref: concepts.md#migration-gotchas-what-actually-breaks-a-hibernate-56-upgrade
- id: hibernate-6-7-and-jakarta-migration-028
  difficulty: advanced
  tags:
  - uuid-mapping
  - migration-gotcha
  - schema
  question: |
    Why can a UUID column mapping break when upgrading an existing schema to
    Hibernate 6?
  options:
  - UUIDs are no longer supported as primary keys
  - UUIDs must now be stored as auto-increment integers
  - Hibernate 6 has a proper UUID JavaType and may map UUID to a native uuid/binary type differently than
    Hibernate 5 (which often used VARBINARY or a string), causing a column-type mismatch
  - '@GeneratedValue(strategy = UUID) rewrites the column to VARCHAR automatically'
  answer: 2
  explanation: |
    Hibernate 6's UUID JavaType may choose a different default JDBC type than Hibernate 5
    did (which frequently used VARBINARY or a string form). Against an existing column,
    this can mismatch. The fix is to pin the mapping with @JdbcTypeCode
    (e.g. CHAR/VARCHAR/UUID) to match the live column type.
  ref: concepts.md#migration-gotchas-what-actually-breaks-a-hibernate-56-upgrade
- id: hibernate-6-7-and-jakarta-migration-029
  difficulty: advanced
  tags:
  - migration-gotcha
  - brownfield
  - hbm2ddl-validate
  question: |
    Before deploying a Hibernate 6 upgrade against an existing production database, what
    is the safest way to catch silent column-type mismatches (boolean, UUID, enum)?
  options:
  - Enable hbm2ddl=create to rebuild the schema
  - Run hbm2ddl in validate mode to compare Hibernate 6's expected column types against the live schema
    before deploying
  - Disable the second-level cache
  - Switch every column to @Lob
  answer: 1
  explanation: |
    hbm2ddl validate mode compares the entity mappings against the actual schema without
    altering it, surfacing type/column mismatches introduced by Hibernate 6's new type
    defaults. create/create-drop would be catastrophic on production data.
  ref: concepts.md#migration-gotchas-what-actually-breaks-a-hibernate-56-upgrade
- id: hibernate-6-7-and-jakarta-migration-030
  difficulty: advanced
  tags:
  - removed-apis
  - criteria
  - migration
  question: |
    Which legacy Hibernate API was removed in Hibernate 6, forcing migration to the
    JPA equivalent?
  options:
  - The EntityManager interface
  - The @Entity annotation
  - The Session interface
