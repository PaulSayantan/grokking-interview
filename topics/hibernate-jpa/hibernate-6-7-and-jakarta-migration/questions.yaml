  - hibernate-6.2
  question: |
    An entity maps `Byte[] payload;`. The app started fine on Hibernate 6.0 but fails to
    boot on 6.2. Which explanation and fix set is correct?
  options:
  - Byte[] is fine; the failure is unrelated to Hibernate
  - Byte[] must now be annotated @Lob to compile
  - 6.2 changed hibernate.type.wrapper_array_handling default to DISALLOW, so Byte[]/Character[] mappings
    error at boot; fix by using primitive byte[], or @JavaType(ByteArrayJavaType.class), or setting the property to ALLOW/LEGACY
  - The fix is to switch the dialect to community dialects
  answer: 2
  explanation: |
    Hibernate 6.2 defaults hibernate.type.wrapper_array_handling to DISALLOW, which makes
    ambiguous Byte[]/Character[] mappings raise an error at startup. Preferred fix is the
    primitive byte[]/char[]; alternatively pin @JavaType(ByteArrayJavaType.class) or set
    wrapper_array_handling=ALLOW or LEGACY as a bridge.
  ref: concepts.md#byte-and-wrapper-array-handling-wrapper_array_handling
- id: hibernate-6-7-and-jakarta-migration-059
  difficulty: advanced
  tags:
  - wrapper-array
  - values
  question: |
    With hibernate.type.wrapper_array_handling=ALLOW, how is a Byte[] attribute mapped?
  options:
  - As SqlTypes.VARBINARY (and Character[] as VARCHAR)
  - As a JSON column
  - As an array of nullable rows in a join table
  - It still throws - ALLOW is not a valid value
  answer: 0
  explanation: |
    ALLOW maps Byte[] to SqlTypes.VARBINARY and Character[] to VARCHAR (treating them as
    binary/character data). DISALLOW (the 6.2 default) raises an error; LEGACY reproduces
    the Hibernate 5 nullable-element array behavior.
  ref: concepts.md#byte-and-wrapper-array-handling-wrapper_array_handling
- id: hibernate-6-7-and-jakarta-migration-060
  difficulty: expert
  tags:
  - hibernate-7
  - removed-methods
  - compile-error
  question: |
    After upgrading to Hibernate 7, `session.saveOrUpdate(entity)` no longer compiles.
    What happened and what is the correct replacement?
  options:
  - saveOrUpdate was renamed to save(); use session.save(entity)
  - The method moved to StatelessSession only
  - Hibernate 7 removed save/update/saveOrUpdate/load/delete from Session; use JPA persist()/merge()/getReference()/remove()
    instead
  - You must enable a legacy-methods compatibility flag
  answer: 2
  explanation: |
    Hibernate 7 removed the legacy Session methods save, update, saveOrUpdate, load, and
    delete (get is deprecated for find). The spec-aligned replacements are persist/merge
    for writes, getReference/find for lookups, and remove for deletion.
  ref: concepts.md#hibernate-7-removed-session-methods-annotations-and-license-change
- id: hibernate-6-7-and-jakarta-migration-061
  difficulty: expert
  tags:
  - hibernate-7
  - removed-annotations
  - where
  question: |
    A Hibernate-5-era entity uses `@Where(clause = "deleted = false")`. It fails to compile
    on Hibernate 7. What replaced @Where?
  options:
  - '@Filter with no parameters'
  - '@SQLRestriction("deleted = false")'
  - '@SecondaryTable'
  - '@Check(constraints = "deleted = false")'
  answer: 1
  explanation: |
    Hibernate 7 removed @Where and @WhereJoinTable; the replacement is @SQLRestriction
    (and @SQLJoinTableRestriction). Other removed annotations include @Proxy,
    @LazyCollection, @LazyToOne, @SelectBeforeUpdate, and the Hibernate @Table/@Index/@ForeignKey.
  ref: concepts.md#hibernate-7-removed-session-methods-annotations-and-license-change
- id: hibernate-6-7-and-jakarta-migration-062
