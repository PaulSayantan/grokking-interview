topic: "Configuration, Bootstrapping & Schema Generation"
domain: hibernate-jpa
topic_slug: configuration-bootstrapping-schema-generation
version: 1
questions:
  - id: configuration-bootstrapping-schema-generation-001
    difficulty: beginner
    tags: [persistence-xml, persistence-unit, jpa-standard]
    question: |
      In the JPA-standard (non-Spring) bootstrap, what artifact defines a
      persistence unit and where does it live?
    options:
      - "application.properties in src/main/resources"
      - "META-INF/persistence.xml on the classpath"
      - "hibernate.cfg.xml in the project root"
      - "A @PersistenceUnit-annotated class"
    answer: 1
    explanation: |
      The JPA standard bootstrap reads META-INF/persistence.xml, which declares
      one or more named persistence-units and their properties. You then call
      Persistence.createEntityManagerFactory("unit-name"). hibernate.cfg.xml is
      Hibernate's legacy native config, not the JPA standard.
    ref: "concepts.md#persistencexml-and-the-persistence-unit"

  - id: configuration-bootstrapping-schema-generation-002
    difficulty: beginner
    tags: [jakarta, namespace, versions]
    question: |
      Which property name is correct for a JDBC URL under Jakarta Persistence
      3.1/3.2 with Hibernate 6/7?
    options:
      - "javax.persistence.jdbc.url"
      - "hibernate.legacy.jdbc.url"
      - "jakarta.persistence.jdbc.url"
      - "spring.datasource.legacy.url"
    answer: 2
    explanation: |
      Jakarta EE 9+ renamed the namespace from javax.* to jakarta.*. The
      standard property is jakarta.persistence.jdbc.url. The old
      javax.persistence.* names do not work with Hibernate 6/7. See
      hibernate-6-7-and-jakarta-migration.
    ref: "concepts.md#persistencexml-and-the-persistence-unit"

  - id: configuration-bootstrapping-schema-generation-003
    difficulty: beginner
    tags: [spring-boot, auto-config, persistence-xml]
    question: |
      Does a Spring Boot application require a persistence.xml to use JPA?
    options:
      - "No — Boot builds the EntityManagerFactory programmatically from properties and entity scanning"
      - "Yes, Spring Boot parses persistence.xml at startup"
      - "Only if you use Hibernate as the provider"
      - "Only in production profiles"
    answer: 0
    explanation: |
      Spring Boot's HibernateJpaAutoConfiguration assembles a DataSource, a
      JpaVendorAdapter, and a LocalContainerEntityManagerFactoryBean from
      spring.* / spring.jpa.* properties and classpath @Entity scanning. No
      persistence.xml is needed; both paths configure the same Hibernate engine.
    ref: "concepts.md#spring-boot-auto-configuration-no-persistencexml"

  - id: configuration-bootstrapping-schema-generation-004
    difficulty: intermediate
    tags: [ddl-auto, validate, production]
    question: |
      A team runs a production service. Which hibernate.hbm2ddl.auto value is
      the recommended runtime setting when schema is managed by Flyway?
    options:
      - "update"
      - "create"
      - "validate"
      - "create-drop"
    answer: 2
    explanation: |
      validate asserts that the mapped entities match the live schema and fails
      fast on drift while changing nothing. The actual DDL is owned by the
      versioned migration tool. update/create/create-drop all mutate or destroy
      schema and are unsafe in prod.
    ref: "concepts.md#hbm2ddlauto-and-jakarta-schema-generation"

  - id: configuration-bootstrapping-schema-generation-005
    difficulty: intermediate
    tags: [ddl-auto, create-drop, data-loss]
    question: |
      What does hibernate.hbm2ddl.auto=create-drop do?
    options:
      - "Creates missing columns without dropping anything"
      - "Validates the schema and drops only unused indexes"
      - "Creates/recreates the schema at startup and drops it again at shutdown"
      - "Creates the schema once and never touches it afterward"
    answer: 2
    explanation: |
      create-drop drops and recreates the schema when the SessionFactory is
      built, then drops it when the SessionFactory closes. It is meant for
      throwaway test databases — pointing it at real data destroys everything.
    ref: "concepts.md#hbm2ddlauto-and-jakarta-schema-generation"

  - id: configuration-bootstrapping-schema-generation-006
    difficulty: advanced
    tags: [ddl-auto, update, danger, migrations]
    question: |
      Why is hibernate.hbm2ddl.auto=update considered dangerous in production
      even though it only adds missing schema objects?
    options:
      - "It locks all tables exclusively for the life of the application"
      - "It always drops the database first before adding objects"
      - "It only works with H2 and silently fails on Postgres"
      - "It is additive-only and best-effort: no drops/renames, no data migrations, no versioning or rollback, and can race across instances"
    answer: 3
    explanation: |
      update never removes or narrows columns, cannot backfill or transform
      data, keeps no version history, offers no rollback, and two instances
      booting together can race on the same ALTER. Schema drift accumulates
      invisibly. Use validate + Flyway/Liquibase instead.
    ref: "concepts.md#why-update-and-create-are-dangerous-in-production"

  - id: configuration-bootstrapping-schema-generation-007
    difficulty: intermediate
    tags: [migrations, flyway, liquibase, best-practice]
    question: |
      What is the recommended way to evolve a production database schema for a
      Hibernate application?
    options:
      - "Let hibernate.hbm2ddl.auto=update apply changes on each deploy"
      - "Recreate the schema on each release with create-drop"
      - "Edit tables by hand in production during a maintenance window"
      - "Run the app on validate/none and evolve the schema with a versioned migration tool (Flyway/Liquibase)"
    answer: 3
    explanation: |
      Versioned migrations are ordered, checksummed, reviewable, support data
      changes, and can be rolled forward deliberately. The app runs on validate
      so it fails fast if the deployed schema does not match the mappings. See
      messaging-databases / devops-cicd for zero-downtime strategy.
    ref: "concepts.md#why-update-and-create-are-dangerous-in-production"

  - id: configuration-bootstrapping-schema-generation-008
    difficulty: intermediate
    tags: [bootstrap, sessionfactory, lifecycle]
    question: |
      How many EntityManagerFactory / SessionFactory instances should a typical
      application create?
    options:
      - "One per HTTP request"
      - "One per thread"
      - "One per database, created once at startup"
      - "One per entity class"
    answer: 2
    explanation: |
      The SessionFactory/EntityManagerFactory is heavyweight and thread-safe:
      it parses all mappings, builds caches, and owns the connection pool. You
      create one per database at startup and use it to vend cheap, short-lived
      Sessions/EntityManagers per unit of work.
    ref: "concepts.md#bootstrapping-the-entitymanagerfactory--sessionfactory"

  - id: configuration-bootstrapping-schema-generation-009
    difficulty: advanced
    tags: [bootstrap, service-registry, metadata, hibernate6]
    question: |
      In Hibernate 6/7's native bootstrap, what is the correct order of the
      three main stages?
    options:
      - "SessionFactory -> Metadata -> ServiceRegistry"
      - "Metadata -> ServiceRegistry -> SessionFactory"
      - "ServiceRegistry -> SessionFactory -> Metadata"
      - "ServiceRegistry -> Metadata -> SessionFactory"
    answer: 3
    explanation: |
      You first build a StandardServiceRegistry (JDBC, dialect, transaction
      services), then build Metadata (the parsed domain model) from
      MetadataSources against that registry, then build the SessionFactory from
      the Metadata.
    ref: "concepts.md#bootstrapping-the-entitymanagerfactory--sessionfactory"

  - id: configuration-bootstrapping-schema-generation-010
    difficulty: intermediate
    tags: [emf, sessionfactory, unwrap]
    question: |
      In Hibernate, how are EntityManagerFactory and SessionFactory related?
    options:
      - "They are unrelated; you must configure them separately"
      - "SessionFactory wraps a pool of EntityManagerFactory instances"
      - "The EntityManagerFactory is a SessionFactory under the hood; you can unwrap it via emf.unwrap(SessionFactory.class)"
      - "EntityManagerFactory replaced SessionFactory, which no longer exists in HB6"
    answer: 2
    explanation: |
      Hibernate's implementation of the JPA EntityManagerFactory is also a
      SessionFactory. You can call emf.unwrap(SessionFactory.class) and
      em.unwrap(Session.class) to reach the native API. SessionFactory very much
      still exists in HB6/7.
    ref: "concepts.md#bootstrapping-the-entitymanagerfactory--sessionfactory"

  - id: configuration-bootstrapping-schema-generation-011
    difficulty: intermediate
    tags: [dialect, auto-detect, hibernate6]
    question: |
      In Hibernate 6/7, do you normally need to set hibernate.dialect explicitly?
    options:
      - "Yes, it is mandatory or startup fails"
      - "Yes, but only for embedded databases"
      - "No, because HB6 supports only one universal dialect"
      - "No — Hibernate auto-detects the dialect from the JDBC DatabaseMetaData"
    answer: 3
    explanation: |
      HB6/7 resolve the dialect automatically from the JDBC driver's reported
      product name and version via the DialectResolver. Setting it manually is
      discouraged and can hide version-specific behavior; you only do it for
      special cases like a proxy that misreports its version.
    ref: "concepts.md#the-dialect-auto-detected-in-hibernate-6"

  - id: configuration-bootstrapping-schema-generation-012
    difficulty: beginner
    tags: [dialect, purpose]
    question: |
      What is the role of the Hibernate Dialect?
    options:
      - "It encrypts SQL before it is sent to the database"
      - "It manages the JDBC connection pool"
      - "It defines the entity-to-table naming rules"
      - "It teaches Hibernate the specific SQL flavor of the target database (identity/sequence support, LIMIT syntax, type mappings, lock clauses)"
    answer: 3
    explanation: |
      The Dialect abstracts database-specific SQL: how to page results, whether
      sequences or identity columns are supported, column type mappings, function
      names, and lock-clause syntax. It is how one ORM speaks to Postgres, MySQL,
      Oracle, etc.
    ref: "concepts.md#the-dialect-auto-detected-in-hibernate-6"

  - id: configuration-bootstrapping-schema-generation-013
    difficulty: advanced
    tags: [dialect, migration, hibernate6]
    question: |
      A Hibernate 5 app set hibernate.dialect=org.hibernate.dialect.PostgreSQL95Dialect.
      After upgrading to Hibernate 6 startup fails. Why?
    options:
      - "PostgreSQL is no longer supported by Hibernate"
      - "The dialect must now be lowercase"
      - "HB6 requires the dialect to be set in persistence.xml only"
      - "Version-specific dialect subclasses were consolidated; PostgreSQL95Dialect was removed in favor of a single PostgreSQLDialect"
    answer: 3
    explanation: |
      HB6 collapsed the version-specific dialect subclasses (e.g.
      PostgreSQL95Dialect) into a single PostgreSQLDialect that adapts to the
      reported version. Best practice is to remove the explicit setting and let
      auto-detection handle it. See hibernate-6-7-and-jakarta-migration.
    ref: "concepts.md#the-dialect-auto-detected-in-hibernate-6"

  - id: configuration-bootstrapping-schema-generation-014
    difficulty: beginner
    tags: [connection-pool, hikaricp, spring-boot]
    question: |
      What is the default connection pool in Spring Boot?
    options:
      - "Apache DBCP"
      - "C3P0"
      - "HikariCP"
      - "Hibernate's built-in pool"
    answer: 2
    explanation: |
      Spring Boot ships HikariCP as the default DataSource pool, tuned via
      spring.datasource.hikari.* (maximum-pool-size, connection-timeout,
      max-lifetime, etc.). It is chosen for performance and reliability.
    ref: "concepts.md#connection-pool-hikaricp-by-default-in-boot"

  - id: configuration-bootstrapping-schema-generation-015
    difficulty: intermediate
    tags: [connection-pool, built-in, production]
    question: |
      You see the log line "Using built-in connection pool (not intended for
      production use)". What does it indicate?
    options:
      - "No real pool was configured, so Hibernate's trivial internal pool is being used"
      - "HikariCP is running in a degraded mode"
      - "The database rejected all connections"
      - "Connection pooling is disabled by the dialect"
    answer: 0
    explanation: |
      hibernate.connection.pool_size uses a minimal built-in pool suitable only
      for tests. Seeing this in a service means no proper pool (Hikari, Agroal,
      or a JNDI/JTA datasource) was wired — a production red flag.
    ref: "concepts.md#connection-pool-hikaricp-by-default-in-boot"

  - id: configuration-bootstrapping-schema-generation-016
    difficulty: intermediate
    tags: [show-sql, logging, parameters]
    question: |
      A developer enables spring.jpa.show-sql=true to debug a query but cannot
      see the actual parameter values. Why?
    options:
      - "show_sql prints statements with ? placeholders and does not log bind parameter values"
      - "The parameters are encrypted by the dialect"
      - "show_sql only works for SELECT, not parameterized queries"
      - "You must also set hibernate.dialect for parameters to appear"
    answer: 0
    explanation: |
      hibernate.show_sql (which show-sql maps to) prints the SQL to System.out
      with ? placeholders and never the bound values. To see values use the
      org.hibernate.orm.jdbc.bind logger at TRACE (HB6) or a datasource proxy
      like p6spy.
    ref: "concepts.md#sql-logging-show_sql-vs-loggers-vs-proxies"

  - id: configuration-bootstrapping-schema-generation-017
    difficulty: advanced
    tags: [logging, bind-parameters, hibernate6]
    question: |
      In Hibernate 6, which logger set to TRACE reveals the actual bound
      parameter values of executed SQL?
    options:
      - "org.hibernate.SQL"
      - "org.hibernate.type.descriptor.sql.BasicBinder"
      - "org.hibernate.orm.jdbc.bind"
      - "org.hibernate.show_sql"
    answer: 2
    explanation: |
      In HB6 the bind-parameter logger is org.hibernate.orm.jdbc.bind at TRACE.
      org.hibernate.SQL at DEBUG logs the statements themselves. In Hibernate 5
      the binder logger was org.hibernate.type.descriptor.sql.BasicBinder — a
      common upgrade gotcha.
    ref: "concepts.md#sql-logging-show_sql-vs-loggers-vs-proxies"

  - id: configuration-bootstrapping-schema-generation-018
    difficulty: intermediate
    tags: [logging, p6spy, datasource-proxy]
    question: |
      Why might a team use p6spy or datasource-proxy instead of just enabling
      org.hibernate.SQL logging?
    options:
      - "They make queries run faster"
      - "They automatically fix N+1 problems"
      - "They are required for Hibernate to connect to the database"
      - "They wrap the DataSource and log fully-inlined SQL with real parameter values, timing, and batch info"
    answer: 3
    explanation: |
      A datasource proxy intercepts at the JDBC layer and logs the exact SQL
      that hit the wire with parameters inlined, plus timings and batch counts —
      ideal for diagnosing N+1 and slow queries. See
      fetching-lazy-eager-n-plus-one and performance-tuning-pitfalls.
    ref: "concepts.md#sql-logging-show_sql-vs-loggers-vs-proxies"

  - id: configuration-bootstrapping-schema-generation-019
    difficulty: intermediate
    tags: [batching, batch-size, performance]
    question: |
      Which property enables JDBC statement batching so multiple inserts/updates
      are sent in one round trip?
    options:
      - "hibernate.jdbc.fetch_size"
      - "hibernate.default_batch_fetch_size"
      - "hibernate.order_inserts"
      - "hibernate.jdbc.batch_size"
    answer: 3
    explanation: |
      hibernate.jdbc.batch_size sets the JDBC batch size; when >0 Hibernate
      groups up to N inserts/updates into addBatch/executeBatch. fetch_size is
      about reads, default_batch_fetch_size is for initializing lazy proxies,
      and order_inserts only reorders statements to help batching.
    ref: "concepts.md#batching-and-statement-ordering-properties"

  - id: configuration-bootstrapping-schema-generation-020
    difficulty: advanced
    tags: [batching, order-inserts, order-updates]
    question: |
      You set hibernate.jdbc.batch_size=50 but batching still isn't happening
      across your mixed inserts of different entity types. What most likely fixes
      it?
    options:
      - "Set hibernate.show_sql=true"
      - "Enable hibernate.order_inserts=true (and order_updates=true) so same-type statements group together"
      - "Increase the connection pool size"
      - "Switch the dialect to Oracle"
    answer: 1
    explanation: |
      A JDBC batch must contain statements against the same target. Interleaved
      inserts of different entity types break the batch. order_inserts and
      order_updates reorder pending statements by type so they can actually
      batch.
    ref: "concepts.md#batching-and-statement-ordering-properties"

  - id: configuration-bootstrapping-schema-generation-021
    difficulty: advanced
    tags: [batching, identity, sequence, id-generation]
    question: |
      Why does IDENTITY id generation prevent Hibernate from batching inserts?
    options:
      - "IDENTITY columns are not supported by JDBC"
      - "IDENTITY forces EAGER fetching"
      - "IDENTITY disables the first-level cache"
      - "Hibernate must execute each insert individually to read back the DB-generated key"
    answer: 3
    explanation: |
      With IDENTITY the primary key is assigned by the database on insert, so
      Hibernate must run each insert and immediately retrieve its generated key —
      it cannot defer and group them into a batch. SEQUENCE lets Hibernate
      pre-allocate ids and batch inserts. See primary-keys-and-id-generation.
    ref: "concepts.md#batching-and-statement-ordering-properties"

  - id: configuration-bootstrapping-schema-generation-022
    difficulty: advanced
    tags: [n-plus-one, default-batch-fetch-size, lazy]
    question: |
      What does hibernate.default_batch_fetch_size do?
    options:
      - "Sets how many rows a SELECT returns at once"
      - "Groups the initialization of multiple lazy associations/proxies into fewer SELECT ... IN (?,?,...) queries, mitigating N+1"
      - "Controls the JDBC insert batch size"
      - "Limits the number of entities in the persistence context"
    answer: 1
    explanation: |
      When Hibernate initializes lazy proxies/collections, default_batch_fetch_size
      makes it fetch up to N of them per SELECT using an IN clause instead of one
      query each — a broad, low-effort N+1 mitigation. See
      fetching-lazy-eager-n-plus-one.
    ref: "concepts.md#batching-and-statement-ordering-properties"

  - id: configuration-bootstrapping-schema-generation-023
    difficulty: intermediate
    tags: [time-zone, jdbc, timestamps]
    question: |
      What is the purpose of hibernate.jdbc.time_zone=UTC?
    options:
      - "It sets the JVM default time zone"
      - "It converts all LocalDate values to epoch seconds"
      - "It disables temporal type mapping"
      - "It tells Hibernate the time zone to use when reading/writing timestamps via JDBC, so values are stored consistently regardless of server zone"
    answer: 3
    explanation: |
      hibernate.jdbc.time_zone normalizes how java.time/Timestamp values are
      passed to and read from JDBC. Setting it to UTC avoids the classic bug
      where timestamps shift when the app is deployed to a host in a different
      time zone than the DB.
    ref: "concepts.md#time-zone-and-miscellaneous-properties"

  - id: configuration-bootstrapping-schema-generation-024
    difficulty: intermediate
    tags: [naming-strategy, spring-boot, physical]
    question: |
      In a Spring Boot app, an entity field firstName with no @Column maps to a
      column named first_name. Which mechanism causes this?
    options:
      - "Hibernate always lowercases and underscores column names"
      - "The JPA spec mandates snake_case columns"
      - "The dialect converts the name at query time"
      - "Spring Boot's default PhysicalNamingStrategy (CamelCaseToUnderscoresNamingStrategy)"
    answer: 3
    explanation: |
      Spring Boot installs CamelCaseToUnderscoresNamingStrategy as the physical
      naming strategy, converting camelCase logical names to lowercased
      snake_case physical identifiers. This is a Boot default, not a JPA or
      Hibernate-core default.
    ref: "concepts.md#naming-strategies-physical-and-implicit"

  - id: configuration-bootstrapping-schema-generation-025
    difficulty: advanced
    tags: [naming-strategy, implicit, physical]
    question: |
      What is the difference between the ImplicitNamingStrategy and the
      PhysicalNamingStrategy?
    options:
      - "Implicit determines the logical name when none was specified; Physical transforms the logical name into the actual database identifier"
      - "Implicit runs at query time; Physical runs at startup only"
      - "They are two names for the same strategy"
      - "Implicit handles columns; Physical handles only table names"
    answer: 0
    explanation: |
      Naming happens in two stages: ImplicitNamingStrategy fills in logical names
      you did not specify (e.g. deriving a column/join-table/FK name), and
      PhysicalNamingStrategy maps that logical name to the real DB identifier
      (e.g. camelCase to snake_case).
    ref: "concepts.md#naming-strategies-physical-and-implicit"

  - id: configuration-bootstrapping-schema-generation-026
    difficulty: advanced
    tags: [naming-strategy, portability, plain-hibernate]
    question: |
      Code that mapped firstName to first_name in a Spring Boot app suddenly maps
      it to firstName when moved to a plain JPA/Hibernate app. Why?
    options:
      - "The plain-Hibernate default physical naming strategy is a near pass-through, unlike Boot's camelCase-to-underscores default"
      - "Plain Hibernate ignores @Entity annotations"
      - "The JPA spec forbids underscores in column names"
      - "Hibernate 7 removed naming strategies entirely"
    answer: 0
    explanation: |
      Plain Hibernate defaults to PhysicalNamingStrategyStandardImpl, which keeps
      the logical name as-is (firstName stays firstName). The snake_case behavior
      is specific to Spring Boot's CamelCaseToUnderscoresNamingStrategy default —
      a frequent surprise when porting code.
    ref: "concepts.md#naming-strategies-physical-and-implicit"

  - id: configuration-bootstrapping-schema-generation-027
    difficulty: intermediate
    tags: [schema-generation, jakarta, standard]
    question: |
      Which JPA-standard property controls whether the schema is generated at
      startup (the standard equivalent of hbm2ddl.auto)?
    options:
      - "jakarta.persistence.schema.mode"
      - "jakarta.persistence.schema-generation.database.action"
      - "hibernate.schema.create"
      - "spring.jpa.schema.action"
    answer: 1
    explanation: |
      jakarta.persistence.schema-generation.database.action is the JPA-standard
      knob, with values none, create, drop-and-create, and drop. It overlaps with
      Hibernate's proprietary hibernate.hbm2ddl.auto.
    ref: "concepts.md#hbm2ddlauto-and-jakarta-schema-generation"

  - id: configuration-bootstrapping-schema-generation-028
    difficulty: intermediate
    tags: [ddl-auto, validate, behavior]
    question: |
      With hibernate.hbm2ddl.auto=validate, what happens at startup if an entity
      maps a column that does not exist in the database?
    options:
      - "Hibernate silently creates the missing column"
      - "Hibernate logs a warning and continues"
      - "Startup fails with a schema validation error and no changes are made"
      - "Hibernate drops and recreates the table"
    answer: 2
    explanation: |
      validate compares mappings to the live schema and makes no changes; on a
      mismatch it throws and startup fails fast. That fail-fast behavior is
      exactly why it is the safe production setting — it catches drift instead of
      hiding it.
    ref: "concepts.md#hbm2ddlauto-and-jakarta-schema-generation"

  - id: configuration-bootstrapping-schema-generation-029
    difficulty: beginner
    tags: [spring-boot, property-passthrough]
    question: |
      In Spring Boot, how do you set an arbitrary Hibernate property that has no
      dedicated spring.jpa.* shortcut?
    options:
      - "Under spring.jpa.properties.hibernate.* which is passed to Hibernate verbatim"
      - "You cannot; only shortcut properties are supported"
      - "In a mandatory persistence.xml"
      - "Via the HibernateJpaVendorAdapter constructor only"
    answer: 0
    explanation: |
      Anything under spring.jpa.properties.* is forwarded directly to the
      Hibernate EntityManagerFactory. For example
      spring.jpa.properties.hibernate.jdbc.batch_size sets
      hibernate.jdbc.batch_size.
    ref: "concepts.md#spring-boot-auto-configuration-no-persistencexml"

  - id: configuration-bootstrapping-schema-generation-030
    difficulty: advanced
    tags: [spring-boot, ddl-auto, defaults]
    question: |
      What is Spring Boot's default value of spring.jpa.hibernate.ddl-auto for an
      embedded in-memory database (H2) versus a normal external database?
    options:
      - "validate for embedded, update for external"
      - "update for both"
      - "create for embedded, validate for external"
      - "create-drop for embedded, none for external"
    answer: 3
    explanation: |
      With an embedded in-memory DB and no schema manager, Boot defaults ddl-auto
      to create-drop (convenient for tests). For any other DataSource it defaults
      to none, expecting you to manage the schema explicitly.
    ref: "concepts.md#spring-boot-auto-configuration-no-persistencexml"

  - id: configuration-bootstrapping-schema-generation-031
    difficulty: intermediate
    tags: [session, thread-safety]
    question: |
      Which statement about the SessionFactory and Session is correct?
    options:
      - "The SessionFactory is thread-safe and long-lived; a Session is not thread-safe and lives for one unit of work"
      - "Both are thread-safe and shared across the app"
      - "The Session is thread-safe; the SessionFactory is per-request"
      - "Neither is thread-safe, so both must be created per request"
    answer: 0
    explanation: |
      The SessionFactory/EntityManagerFactory is thread-safe and application
      scoped. A Session/EntityManager holds the per-transaction persistence
      context, is not thread-safe, and should be opened per unit of work. See
      session-entitymanager-persistence-context.
    ref: "concepts.md#bootstrapping-the-entitymanagerfactory--sessionfactory"

  - id: configuration-bootstrapping-schema-generation-032
    difficulty: advanced
    tags: [ddl-auto, script-generation, jakarta]
    question: |
      You want Hibernate to write the generated DDL to a .sql file instead of
      executing it against the database. Which JPA-standard properties do this?
    options:
      - "hibernate.hbm2ddl.auto=export"
      - "jakarta.persistence.schema-generation.scripts.action + scripts.create-target"
      - "spring.jpa.generate-ddl-file=true"
      - "hibernate.dialect.export-ddl=true"
    answer: 1
    explanation: |
      Setting jakarta.persistence.schema-generation.scripts.action (e.g. create)
      together with scripts.create-target (the output file) makes Hibernate emit
      DDL to a script rather than the database. This is useful for reviewing DDL
      before adopting a migration tool.
    ref: "concepts.md#hbm2ddlauto-and-jakarta-schema-generation"

  - id: configuration-bootstrapping-schema-generation-033
    difficulty: intermediate
    tags: [transaction-type, resource-local, jta]
    question: |
      In persistence.xml, what does transaction-type="RESOURCE_LOCAL" mean?
    options:
      - "Transactions are managed by a JTA transaction manager"
      - "You drive transactions yourself via the EntityTransaction API"
      - "Transactions are disabled"
      - "Each query runs in its own autocommit transaction"
    answer: 1
    explanation: |
      RESOURCE_LOCAL means the application manages transactions directly through
      EntityManager.getTransaction() (EntityTransaction). JTA means an external
      JTA/container transaction manager coordinates them, typical in Jakarta EE
      servers.
    ref: "concepts.md#persistencexml-and-the-persistence-unit"

  - id: configuration-bootstrapping-schema-generation-034
    difficulty: beginner
    tags: [show-sql, format-sql, logging]
    question: |
      Which property makes Hibernate pretty-print (indent) the SQL it logs?
    options:
      - "hibernate.format_sql=true"
      - "hibernate.pretty_print=true"
      - "hibernate.sql.indent=true"
      - "hibernate.show_sql=formatted"
    answer: 0
    explanation: |
      hibernate.format_sql=true reformats logged SQL with line breaks and
      indentation. It pairs with show_sql or the org.hibernate.SQL logger;
      use_sql_comments=true additionally annotates statements with context.
    ref: "concepts.md#sql-logging-show_sql-vs-loggers-vs-proxies"

  - id: configuration-bootstrapping-schema-generation-035
    difficulty: advanced
    tags: [dialect, startup-error, connectivity]
    question: |
      Startup fails with "Unable to determine Dialect without JDBC metadata".
      What is the most likely root cause in Hibernate 6/7?
    options:
      - "The entity classes have no @Id"
      - "Hibernate could not open a connection at boot to auto-detect the dialect (bad URL/creds or metadata lookup disabled)"
      - "The batch_size property is missing"
      - "The naming strategy is misconfigured"
    answer: 1
    explanation: |
      Because HB6/7 auto-detect the dialect from JDBC DatabaseMetaData, they need
      a working connection at startup. A bad URL/credentials or disabled metadata
      access prevents detection. The fix is to restore connectivity, not to
      hard-code a dialect.
    ref: "concepts.md#the-dialect-auto-detected-in-hibernate-6"

  - id: configuration-bootstrapping-schema-generation-036
    difficulty: intermediate
    tags: [ddl-auto, tests-vs-prod, judgment]
    question: |
      Why is create-drop perfectly reasonable for an integration-test suite but
      catastrophic in production?
    options:
      - "Tests run faster with create-drop"
      - "Tests want a fresh, throwaway schema each run, whereas production data is permanent and dropping it is irreversible"
      - "create-drop only works against H2"
      - "Production databases ignore create-drop"
    answer: 1
    explanation: |
      Test databases are disposable, so building the schema from mappings and
      tearing it down is convenient and deterministic. Production data is
      long-lived; create-drop would delete it on startup/shutdown with no
      migration history or recovery path.
    ref: "concepts.md#hbm2ddlauto-and-jakarta-schema-generation"

  - id: configuration-bootstrapping-schema-generation-037
    difficulty: advanced
    tags: [flyway, validate, remediation, judgment]
    question: |
      You inherit a service running ddl-auto=update against production. What is
      the safest remediation path?
    options:
      - "Immediately switch to create to normalize the schema"
      - "Switch to validate, baseline the existing schema into Flyway/Liquibase, then route all future changes through versioned migrations"
      - "Leave update on but back up nightly"
      - "Switch to none and edit the schema manually as needed"
    answer: 1
    explanation: |
      validate makes the app assert-only, a migration tool baseline captures the
      current schema as the starting version, and future changes become ordered,
      reviewable migrations. This removes update's risks (no rollback, no data
      migrations, cross-instance races) without a disruptive schema rebuild.
    ref: "concepts.md#why-update-and-create-are-dangerous-in-production"

  - id: configuration-bootstrapping-schema-generation-038
    difficulty: intermediate
    tags: [statistics, observability, tuning]
    question: |
      Which property exposes Hibernate query counts and cache hit ratios for
      metrics and diagnostics?
    options:
      - "hibernate.show_sql=true"
      - "hibernate.generate_statistics=true"
      - "hibernate.jdbc.batch_size=1"
      - "hibernate.format_sql=true"
    answer: 1
    explanation: |
      hibernate.generate_statistics=true activates the Statistics API (query
      execution counts, second-level cache hit/miss ratios, connection counts),
      often surfaced via Micrometer. See observability. It adds overhead, so
      enable deliberately.
    ref: "concepts.md#time-zone-and-miscellaneous-properties"

  - id: configuration-bootstrapping-schema-generation-039
    difficulty: advanced
    tags: [in-clause-padding, statement-cache, tuning]
    question: |
      What problem does hibernate.query.in_clause_parameter_padding=true address?
    options:
      - "It prevents SQL injection in IN clauses"
      - "It rounds the IN (?) parameter count up to a power of two so similar queries share the same SQL string and prepared-statement cache entry"
      - "It limits IN clauses to 1000 parameters"
      - "It converts IN clauses to JOINs"
    answer: 1
    explanation: |
      Varying IN-list sizes produce different SQL strings, blowing the database's
      prepared-statement cache. Padding the bind count to the next power of two
      reduces the number of distinct statements and improves cache reuse.
    ref: "concepts.md#time-zone-and-miscellaneous-properties"

  - id: configuration-bootstrapping-schema-generation-040
    difficulty: intermediate
    tags: [connection-pool, transactions, sizing]
    question: |
      How can an oversized HikariCP maximum-pool-size combined with long
      transactions harm a database?
    options:
      - "Connections are typically held for the whole transaction, so too many long transactions can exhaust the database's connection limit"
      - "It makes Hibernate skip the persistence context"
      - "It disables the dialect auto-detection"
      - "It forces EAGER fetching on all associations"
    answer: 0
    explanation: |
      A connection is generally bound to a transaction for its duration. A large
      pool plus long-running transactions can hold many connections at once and
      exceed the DB's max_connections, starving other clients. For sizing theory
      and DB connection limits see messaging-databases / reliability-ops.
    ref: "concepts.md#connection-pool-hikaricp-by-default-in-boot"

  - id: configuration-bootstrapping-schema-generation-041
    difficulty: advanced
    tags: [batch-versioned-data, optimistic-locking]
    question: |
      What does hibernate.jdbc.batch_versioned_data=true enable?
    options:
      - "Encryption of versioned columns"
      - "Batching of UPDATEs on @Version-annotated (optimistically-locked) entities"
      - "Automatic version increment on read"
      - "Disabling optimistic locking entirely"
    answer: 1
    explanation: |
      By default some drivers/dialects could not reliably return per-row update
      counts needed to verify optimistic-lock version checks in a batch.
      batch_versioned_data=true allows Hibernate to batch updates of @Version
      entities where the driver reports counts correctly. See
      concurrency-optimistic-pessimistic-locking.
    ref: "concepts.md#batching-and-statement-ordering-properties"

  - id: configuration-bootstrapping-schema-generation-042
    difficulty: beginner
    tags: [flyway, spring-boot, backoff]
    question: |
      When Flyway is on a Spring Boot app's classpath, what changes about the
      embedded-database ddl-auto default?
    options:
      - "Boot forces ddl-auto=create-drop to help Flyway"
      - "Boot backs off the create-drop default and expects the migration tool to own the schema"
      - "Flyway is ignored unless ddl-auto=update"
      - "Nothing changes"
    answer: 1
    explanation: |
      With a migration tool present, Boot no longer applies the embedded
      create-drop default because the schema is now managed by Flyway/Liquibase.
      You should still set ddl-auto=validate explicitly to be safe.
    ref: "concepts.md#spring-boot-auto-configuration-no-persistencexml"

  - id: configuration-bootstrapping-schema-generation-043
    difficulty: intermediate
    tags: [sql-load-script, seed-data, schema-generation]
    question: |
      Which JPA-standard property points to a SQL script that seeds data after
      schema generation?
    options:
      - "jakarta.persistence.sql-load-script-source"
      - "hibernate.import_data"
      - "spring.jpa.seed-file"
      - "jakarta.persistence.data-init"
    answer: 0
    explanation: |
      jakarta.persistence.sql-load-script-source names a SQL file executed to
      load seed/reference data after schema generation. It is the standard
      analogue of Hibernate's legacy import.sql mechanism.
    ref: "concepts.md#hbm2ddlauto-and-jakarta-schema-generation"

  - id: configuration-bootstrapping-schema-generation-044
    difficulty: advanced
    tags: [bootstrap, metadata, service-registry, roles]
    question: |
      In Hibernate's native bootstrap, which layer holds pluggable services such
      as the JDBC connection provider, the dialect, and the transaction
      coordinator?
    options:
      - "The SessionFactory"
      - "The ServiceRegistry"
      - "The Metadata"
      - "The persistence.xml parser"
    answer: 1
    explanation: |
      The ServiceRegistry is the lowest bootstrap layer and hosts the pluggable
      services (JDBC/ConnectionProvider, Dialect, transaction coordinator, JMX,
      etc.). Metadata is the parsed domain model built against it, and the
      SessionFactory is built from Metadata.
    ref: "concepts.md#bootstrapping-the-entitymanagerfactory--sessionfactory"

  - id: configuration-bootstrapping-schema-generation-045
    difficulty: intermediate
    tags: [logging, production, cost]
    question: |
      Why should statement-level SQL logging (show_sql or org.hibernate.SQL
      DEBUG) not be left on in production?
    options:
      - "It adds performance overhead and can leak sensitive parameter/PII data into logs"
      - "It corrupts the persistence context"
      - "It disables batching automatically"
      - "It forces the built-in connection pool"
    answer: 0
    explanation: |
      Logging every statement costs CPU and I/O under load, and inlined SQL/
      parameters can expose PII in log files. Enable it deliberately for
      diagnosis; prefer a targeted proxy tool over always-on stdout logging in
      production.
    ref: "concepts.md#sql-logging-show_sql-vs-loggers-vs-proxies"

  - id: configuration-bootstrapping-schema-generation-046
    difficulty: advanced
    tags: [jpa-3-2, persistence-configuration, bootstrap]
    question: |
      Your new Java SE service has no persistence.xml and you do not want to use
      Hibernate-native MetadataSources API. Under Jakarta Persistence 3.2, what is
      the spec-standard programmatic way to build an EntityManagerFactory?
    options:
      - "Call Persistence.generateSchema() with a Map of properties"
      - "new PersistenceConfiguration(\"pu\").managedClass(...).property(...).createEntityManagerFactory()"
      - "Annotate a config class with @PersistenceUnit and let the container scan it"
      - "new StandardServiceRegistryBuilder().build() then buildMetadata()"
    answer: 1
    explanation: |
      PersistenceConfiguration is new in Jakarta Persistence 3.2 (Hibernate 7): a
      fluent, type-safe, all-Java bootstrap that needs neither persistence.xml nor
      Hibernate-native API. MetadataSources/StandardServiceRegistryBuilder is the
      vendor-native path (not spec-standard). The result is always a Java SE
      persistence unit.
    ref: "concepts.md#programmatic-bootstrap-with-persistenceconfiguration-jpa-32"

  - id: configuration-bootstrapping-schema-generation-047
    difficulty: intermediate
    tags: [jpa-3-2, persistence-configuration, constants]
    question: |
      Why does PersistenceConfiguration expose String constants like
      PersistenceConfiguration.JDBC_URL and SCHEMAGEN_DATABASE_ACTION?
    options:
      - "They enable runtime encryption of the JDBC URL"
      - "They are required to switch the persistence unit to JTA"
      - "They provide standard, typo-proof property keys instead of magic strings"
      - "They replace the need for a JDBC driver on the classpath"
    answer: 2
    explanation: |
      The constants (JDBC_URL, JDBC_USER, JDBC_PASSWORD, JDBC_DRIVER,
      JDBC_DATASOURCE, LOCK_TIMEOUT, QUERY_TIMEOUT, and the SCHEMAGEN_* family)
      give you compile-checked, standard property keys so you avoid mistyped
      magic-string property names. They do not change transaction type or add
      encryption.
    ref: "concepts.md#programmatic-bootstrap-with-persistenceconfiguration-jpa-32"

  - id: configuration-bootstrapping-schema-generation-048
    difficulty: intermediate
    tags: [versions, hibernate7, java-baseline]
    question: |
      Which pairing correctly describes Hibernate 7's baselines?
    options:
      - "Java 8 baseline, javax.persistence namespace, JPA 2.2"
      - "Java 11 baseline, jakarta.persistence namespace, Jakarta Persistence 3.1"
      - "Java 17 baseline, jakarta.persistence namespace, Jakarta Persistence 3.2"
      - "Java 21 baseline, javax.persistence namespace, JPA 3.0"
    answer: 2
    explanation: |
      HB7 = Java 17 baseline + Jakarta Persistence 3.2. For contrast: HB5 = Java 8
      + javax + JPA 2.1/2.2; HB6 = Java 11 + jakarta + Jakarta Persistence 3.0/3.1.
      Getting the version/namespace pairing wrong is the worst defect in this area.
    ref: "concepts.md#version-matrix-hb5-vs-hb6-vs-hb7"

  - id: configuration-bootstrapping-schema-generation-049
    difficulty: expert
    tags: [hibernate7, jandex, scanning, migration]
    question: |
      After upgrading a standalone (non-Spring) app from HB6 to HB7, entities
      declared implicitly via persistence.xml scanning are no longer discovered and
      startup fails with unknown-entity errors. What is the most likely fix?
    options:
      - "Add the org.hibernate.orm:hibernate-scan-jandex dependency"
      - "Set hibernate.hbm2ddl.auto=create so tables are generated"
      - "Downgrade the jakarta.persistence-api to 3.1"
      - "Add hibernate.dialect explicitly to re-enable scanning"
    answer: 0
    explanation: |
      HB7 moved the Jandex-based classpath scanner out of core. Apps that relied on
      auto-scanning @Entity classes (rather than listing every <class>) must add
      org.hibernate.orm:hibernate-scan-jandex. Spring Boot is unaffected because it
      does its own component scan and passes an explicit managed-class list.
    ref: "concepts.md#classpath-scanning-in-hb7-hibernate-scan-jandex"

  - id: configuration-bootstrapping-schema-generation-050
    difficulty: expert
    tags: [connection-handling-mode, lease-window, performance]
    question: |
      A RESOURCE_LOCAL @Transactional method runs ~200 ms of pure computation
      before its first SQL query. With Hibernate defaults, when is the physical JDBC
      connection borrowed from the pool?
    options:
      - "Only after the transaction commits"
      - "Lazily, at the first SQL statement"
      - "When the transaction begins (to disable autocommit), so it is held during the 200 ms"
      - "Never — RESOURCE_LOCAL uses autocommit per statement"
    answer: 2
    explanation: |
      Even with delayed-acquisition handling mode, Hibernate by default grabs the
      connection at transaction start to turn off autocommit, so it is held during
      the 200 ms of non-DB work. That inflated lease window hurts pool concurrency
      until you enable provider_disables_autocommit.
    ref: "concepts.md#connection-acquisition-and-release-modes"

  - id: configuration-bootstrapping-schema-generation-051
    difficulty: expert
    tags: [provider-disables-autocommit, hikari, tuning]
    question: |
      Which combination lets Hibernate defer physical connection acquisition until
      the first SQL statement (shrinking the lease window) in a RESOURCE_LOCAL app?
    options:
      - "hibernate.connection.pool_size=1 and show_sql=true"
      - "spring.jpa.open-in-view=true and a larger maximum-pool-size"
      - "hibernate.jdbc.batch_size=50 and order_inserts=true"
      - "Hikari auto-commit=false plus hibernate.connection.provider_disables_autocommit=true"
    answer: 3
    explanation: |
      Setting the pool to hand out connections with autocommit already disabled
      (Hikari auto-commit=false) and telling Hibernate about it
      (provider_disables_autocommit=true) removes the reason to acquire at tx start,
      so acquisition is deferred to the first statement. Only set the flag if the
      pool truly disables autocommit.
    ref: "concepts.md#connection-acquisition-and-release-modes"

  - id: configuration-bootstrapping-schema-generation-052
    difficulty: advanced
    tags: [connection-handling-mode, jta, defaults]
    question: |
      What is the default hibernate.connection.handling_mode under JTA versus
      RESOURCE_LOCAL?
    options:
      - "IMMEDIATE_ACQUISITION_AND_HOLD for both"
      - "DELAYED_ACQUISITION_AND_RELEASE_AFTER_STATEMENT (JTA); DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION (RESOURCE_LOCAL)"
      - "DELAYED_ACQUISITION_AND_HOLD (JTA); IMMEDIATE_ACQUISITION_AND_HOLD (RESOURCE_LOCAL)"
      - "RELEASE_AFTER_TRANSACTION for both"
    answer: 1
    explanation: |
      Under JTA the default is DELAYED_ACQUISITION_AND_RELEASE_AFTER_STATEMENT so
      the JTA transaction manager can enlist/aggregate resources; under
      RESOURCE_LOCAL it is DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION,
      holding the connection until commit/rollback.
    ref: "concepts.md#connection-acquisition-and-release-modes"

  - id: configuration-bootstrapping-schema-generation-053
    difficulty: advanced
    tags: [open-in-view, spring-boot, defaults]
    question: |
      A Spring Boot app logs at startup: "spring.jpa.open-in-view is enabled by
      default." What does this warning actually tell you?
    options:
      - "The persistence context (and its connection) is held open through view/response rendering because OSIV defaults to true"
      - "Hibernate could not detect the dialect"
      - "The second-level cache is disabled"
      - "ddl-auto is set to update and will mutate the schema"
    answer: 0
    explanation: |
      Spring Boot defaults spring.jpa.open-in-view to true and warns when it is
      active but not explicitly set. OSIV keeps the EntityManager open for the whole
      request, so lazy loads work during rendering but at the cost of late N+1 and a
      long connection lease. Seniors typically set it to false.
    ref: "concepts.md#open-session-in-view-springjpaopen-in-view"

  - id: configuration-bootstrapping-schema-generation-054
    difficulty: expert
    tags: [open-in-view, n-plus-one, connection-lease]
    question: |
      Why is leaving spring.jpa.open-in-view=true considered an anti-pattern in a
      high-throughput service?
    options:
      - "It forces EAGER fetching on every association"
      - "It disables JDBC batching"
      - "It prevents the app from starting without a persistence.xml"
      - "Lazy associations initialize during view rendering (late N+1) and the connection is held through the response, inflating pool contention"
    answer: 3
    explanation: |
      With OSIV the persistence context and its connection stay bound to the request
      thread until the response is written, so serialization/rendering can trigger
      N+1 SELECTs outside the service layer and the connection is leased far longer
      than the business transaction. Disable it and fetch what the view needs
      explicitly.
    ref: "concepts.md#open-session-in-view-springjpaopen-in-view"

  - id: configuration-bootstrapping-schema-generation-055
    difficulty: expert
    tags: [bytecode-enhancement, hibernate7, maven-plugin]
    question: |
      After upgrading to Hibernate 7.0 with the Maven enhancement plugin, dirty
      tracking and lazy basic-attribute loading silently stopped working. What
      happened?
    options:
      - "HB7 removed bytecode enhancement entirely"
      - "In HB 7.0 the plugin's enableLazyInitialization and enableDirtyTracking wrongly defaulted to false (fixed in 7.1)"
      - "Enhancement now only runs at runtime, never build time"
      - "The plugin requires ddl-auto=create to enhance entities"
    answer: 1
    explanation: |
      HB 7.0's Maven plugin (GAV org.hibernate.orm:hibernate-maven-plugin) regressed
      enableLazyInitialization and enableDirtyTracking to default false; 7.1 restored
      the intended behavior. Set them explicitly or move to 7.1. Enhancement itself
      is still supported at build time.
    ref: "concepts.md#build-time-bytecode-enhancement"

  - id: configuration-bootstrapping-schema-generation-056
    difficulty: advanced
    tags: [bytecode-enhancement, dirty-tracking, lazy]
    question: |
      What does the enableDirtyTracking bytecode-enhancement flag give you?
    options:
      - "It encrypts changed fields before flush"
      - "It makes all associations EAGER"
      - "The entity self-reports which fields changed, so flush-time dirty checking skips the field-by-field snapshot comparison"
      - "It enables the second-level cache automatically"
    answer: 2
    explanation: |
      With dirty tracking the enhanced entity records its own modified fields, so at
      flush Hibernate does not have to compare the entity against its loaded
      snapshot attribute by attribute. enableLazyInitialization (lazy basics) and
      enableAssociationManagement (maintain both sides) are separate flags.
    ref: "concepts.md#build-time-bytecode-enhancement"

  - id: configuration-bootstrapping-schema-generation-057
    difficulty: advanced
    tags: [jpa-3-2, schema-manager, testing]
    question: |
      In Jakarta Persistence 3.2, how can you programmatically truncate or validate
      the schema at runtime (e.g. between tests) without a restart or external tool?
    options:
      - "Call emf.getSchemaManager().truncate() / .validate()"
      - "Set hibernate.hbm2ddl.auto=create-drop and reopen the EntityManagerFactory"
      - "Call Persistence.generateSchema() each time"
      - "Use EntityManager.clear() which drops tables"
    answer: 0
    explanation: |
      JPA 3.2 adds EntityManagerFactory.getSchemaManager(), returning a
      SchemaManager with create(), drop(), validate(), and truncate(). truncate()
      wipes rows while keeping tables — ideal for resetting state between tests
      without a create-drop restart.
    ref: "concepts.md#the-schemamanager-api-jpa-32"

  - id: configuration-bootstrapping-schema-generation-058
    difficulty: expert
    tags: [schema-generation, scripts, dba, no-touch]
    question: |
      You must hand the DBA a DDL script for review and must NOT let Hibernate
      execute anything against the live database. Which property set does this?
    options:
      - "database.action=drop-and-create with scripts.action=none"
      - "hibernate.hbm2ddl.auto=validate and show_sql=true"
      - "scripts.action=create + scripts.create-target=schema.sql, with database.action=none"
      - "database.action=create + provider_disables_autocommit=true"
    answer: 2
    explanation: |
      schema-generation.scripts.action=create tells Hibernate to emit DDL, and
      scripts.create-target names the output file. Keeping
      schema-generation.database.action=none ensures nothing runs against the DB —
      exactly the review-before-apply workflow.
    ref: "concepts.md#schema-generation-scripts-and-source-properties"

  - id: configuration-bootstrapping-schema-generation-059
    difficulty: advanced
    tags: [schema-generation, create-source, script]
    question: |
      What does jakarta.persistence.schema-generation.create-source=metadata-then-script
      instruct Hibernate to do?
    options:
      - "Generate DDL from the entity metadata first, then also apply the DDL from a supplied script"
      - "Ignore entity metadata and use only the script"
      - "Validate the metadata against an existing script but change nothing"
      - "Convert the script into entity metadata"
    answer: 0
    explanation: |
      create-source controls where the create DDL comes from: metadata (from
      mappings), script (from a supplied file via create-script-source), or the
      combined orders metadata-then-script / script-then-metadata. metadata-then-script
      runs the mapping-derived DDL first, then the script.
    ref: "concepts.md#schema-generation-scripts-and-source-properties"

  - id: configuration-bootstrapping-schema-generation-060
    difficulty: expert
    tags: [data-sql, defer-datasource-initialization, spring-boot, gotcha]
    question: |
      In a Spring Boot + Hibernate app, data.sql inserts fail because the target
      tables do not exist yet when the script runs. What is the correct fix?
    options:
      - "Rename data.sql to import.sql"
      - "Set spring.jpa.defer-datasource-initialization=true so data.sql runs after Hibernate creates the tables"
      - "Set ddl-auto=update so data.sql can create the tables"
      - "Move the inserts into persistence.xml"
    answer: 1
    explanation: |
      With JPA/Hibernate present, Boot runs data.sql before Hibernate's schema
      generation by default, so inserts hit missing tables.
      spring.jpa.defer-datasource-initialization=true reorders it to run after
      Hibernate creates the schema. (For real projects, prefer Flyway/Liquibase
      seed migrations.)
    ref: "concepts.md#data-seeding-importsql-datasql-and-load-scripts"

  - id: configuration-bootstrapping-schema-generation-061
    difficulty: advanced
    tags: [import-sql, seeding, create-drop]
    question: |
      A team relied on a classpath import.sql to seed reference data. After moving
      the app to ddl-auto=validate (schema now owned by Flyway), the seed data no
      longer loads. Why?
    options:
      - "validate deletes seed data on startup"
      - "import.sql must be renamed to data.sql under validate"
      - "Hibernate's import.sql runs only when it creates the schema (create/create-drop), not under validate/none"
      - "import.sql requires hibernate.dialect to be set explicitly"
    answer: 2
    explanation: |
      Hibernate auto-executes import.sql only as part of schema creation
      (create/create-drop). Under validate/none Hibernate does not create the schema,
      so import.sql is never run. Move the seeds into a Flyway/Liquibase (repeatable)
      migration.
    ref: "concepts.md#data-seeding-importsql-datasql-and-load-scripts"

  - id: configuration-bootstrapping-schema-generation-062
    difficulty: intermediate
    tags: [seeding, mechanisms, jakarta]
    question: |
      Which of these is the JPA-standard (portable) way to run a data-seeding script
      after schema generation?
    options:
      - "hibernate.hbm2ddl.import_files"
      - "jakarta.persistence.sql-load-script-source"
      - "spring.sql.init.data-locations"
      - "The classpath import.sql file"
    answer: 1
    explanation: |
      jakarta.persistence.sql-load-script-source is the spec-standard load script.
      hibernate.hbm2ddl.import_files and classpath import.sql are Hibernate-native;
      spring.sql.init.data-locations is Spring Boot's mechanism. All seed data but
      only the jakarta.* one is portable across JPA providers.
    ref: "concepts.md#data-seeding-importsql-datasql-and-load-scripts"

  - id: configuration-bootstrapping-schema-generation-063
    difficulty: expert
    tags: [hibernate7, ddl-defaults, validate, char]
    question: |
      Right after a HB6 to HB7 upgrade, ddl-auto=validate fails on a String field
      mapped to a single-character column that nobody changed. What is the likely
      cause?
    options:
      - "HB7 requires @Column(length) on all String fields"
      - "validate no longer works in HB7"
      - "HB7 now maps char/Character to varchar(1) instead of char(1), so the expected type differs from the HB6-created column"
      - "The dialect can no longer be auto-detected in HB7"
    answer: 2
    explanation: |
      HB7 changed several generated DDL defaults, including char/Character now
      mapping to varchar(1) rather than char(1). validate compares expected vs live
      types, so a column created under HB6 as char(1) now mismatches. Reconcile the
      migration DDL (or override the setting) to match HB7 defaults.
    ref: "concepts.md#hb7-ddl-default-changes-validate-gotchas"

  - id: configuration-bootstrapping-schema-generation-064
    difficulty: expert
    tags: [hibernate7, oracle, binary-floats, ddl]
    question: |
      A HB7 app on Oracle fails validate because double columns are now expected to
      be binary_double instead of the HB6-era float type. How do you revert to the
      old float mapping without rewriting the schema?
    options:
      - "Set hibernate.dialect.oracle.use_binary_floats=false"
      - "Set ddl-auto=update to patch the column type"
      - "Downgrade the Oracle JDBC driver"
      - "Set hibernate.jdbc.time_zone=UTC"
    answer: 0
    explanation: |
      HB7 changed Oracle float/double to binary_float/binary_double. Setting
      hibernate.dialect.oracle.use_binary_floats=false restores the previous
      mapping so validate passes against the existing schema. update is not a
      migration tool and should not be used to paper over the difference.
    ref: "concepts.md#hb7-ddl-default-changes-validate-gotchas"

  - id: configuration-bootstrapping-schema-generation-065
    difficulty: advanced
    tags: [slow-query-log, diagnostics, production]
    question: |
      Which setting logs only queries that exceed a millisecond threshold — a
      production-safe alternative to logging every statement?
    options:
      - "hibernate.show_sql=true"
      - "hibernate.highlight_sql=true"
      - "hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=<millis>"
      - "hibernate.format_sql=true"
    answer: 2
    explanation: |
      LOG_QUERIES_SLOWER_THAN_MS makes Hibernate emit only outlier queries via the
      org.hibernate.SQL_SLOW logger, so it is safe to leave on in production.
      show_sql/format_sql/highlight_sql are dev-only, always-on statement formatting
      that add overhead under load.
    ref: "concepts.md#slow-query-logging-and-statistics"

  - id: configuration-bootstrapping-schema-generation-066
    difficulty: intermediate
    tags: [highlight-sql, logging, dev-only]
    question: |
      What does hibernate.highlight_sql=true do?
    options:
      - "Colorizes logged SQL keywords with ANSI escape codes (a dev-only readability aid)"
      - "Highlights slow queries in the database's query planner"
      - "Encrypts SQL sent over the wire"
      - "Rewrites SQL to use covering indexes"
    answer: 0
    explanation: |
      highlight_sql (HB6+) adds ANSI color to logged SQL keywords to make it easier
      to read in a console. Like show_sql and format_sql it is a development
      convenience, not a production feature.
    ref: "concepts.md#slow-query-logging-and-statistics"

  - id: configuration-bootstrapping-schema-generation-067
    difficulty: advanced
    tags: [hibernate7, connection-provider, vibur-proxool-ucp]
    question: |
      A legacy config sets a Vibur ConnectionProvider. On upgrading to Hibernate 7
      it fails to wire the pool. Why?
    options:
      - "Vibur now requires a JTA transaction manager"
      - "HB7 dropped built-in support for Vibur/Proxool/UCP; sanctioned providers are Agroal and HikariCP"
      - "ConnectionProviders were removed entirely in HB7"
      - "Vibur only works with the javax.persistence namespace"
    answer: 1
    explanation: |
      HB7 removed built-in ConnectionProvider support for Vibur, Proxool, and UCP.
      Production deployments should use HikariCP (Spring Boot default) or Agroal
      (Quarkus default), or a JTA/JNDI DataSource. The toy built-in pool
      (connection.pool_size) remains test-only.
    ref: "concepts.md#connection-providers-beyond-the-built-in-pool"

  - id: configuration-bootstrapping-schema-generation-068
    difficulty: expert
    tags: [batching, stateless-session, hibernate7]
    question: |
      In Hibernate 7 you set hibernate.jdbc.batch_size=50 globally, but bulk inserts
      through a StatelessSession still run one INSERT per row. Why?
    options:
      - "StatelessSession does not support INSERT"
      - "batch_size only applies to SELECTs"
      - "In HB7 the global batch_size has no effect on StatelessSession; you must call StatelessSession.setJdbcBatchSize(int)"
      - "batch_size requires order_inserts, which StatelessSession ignores"
    answer: 2
    explanation: |
      In HB7 the global hibernate.jdbc.batch_size does not apply to StatelessSession.
      You set batching explicitly with StatelessSession.setJdbcBatchSize(int) (and
      per-session on a regular Session via session.setJdbcBatchSize). This is a real
      HB7 gotcha for high-volume batch jobs.
    ref: "concepts.md#batching-and-statement-ordering-properties"

  - id: configuration-bootstrapping-schema-generation-069
    difficulty: expert
    tags: [batching, batch-size, judgment, identity, ordering]
    question: |
      You set batch_size=50 yet the logs show 50 individual INSERTs instead of a
      batch. Which TWO causes are the classic culprits?
    options:
      - "The dialect is Postgres; and the entity has a @Version field"
      - "The @Id uses @GeneratedValue(strategy=IDENTITY); and inserts of different entity types are interleaved without order_inserts"
      - "show_sql is off; and format_sql is on"
      - "The connection pool is too small; and open-in-view is disabled"
    answer: 1
    explanation: |
      IDENTITY generation forces Hibernate to execute each insert to read back the
      DB-assigned key, disabling batching; and interleaving different entity types
      breaks a batch unless order_inserts groups same-type statements. Switch to
      SEQUENCE (pooled optimizer) and enable order_inserts. See
      primary-keys-and-id-generation.
    ref: "concepts.md#batching-and-statement-ordering-properties"

  - id: configuration-bootstrapping-schema-generation-070
    difficulty: expert
    tags: [id-generation, sequence, pooled, batching]
    question: |
      Why can a SEQUENCE generator with a pooled (or pooled-lo) optimizer batch
      inserts whereas IDENTITY cannot?
    options:
      - "SEQUENCE columns are always cached in the second-level cache"
      - "Pooled optimizers pre-allocate a block of ids client-side, so Hibernate can assign keys without a per-row round trip and defer/group the inserts"
      - "IDENTITY inserts run in autocommit mode"
      - "SEQUENCE disables optimistic locking, which enables batching"
    answer: 1
    explanation: |
      A pooled/pooled-lo optimizer fetches a range of sequence values in one call
      and assigns ids in memory, so Hibernate does not need getGeneratedKeys() after
      each insert and can defer and addBatch() the rows. IDENTITY requires reading
      the key back per row, forcing individual inserts. See
      primary-keys-and-id-generation.
    ref: "concepts.md#batching-and-statement-ordering-properties"

  - id: configuration-bootstrapping-schema-generation-071
    difficulty: intermediate
    tags: [hibernate7, session-factory-name, jndi]
    question: |
      In Hibernate 7, if hibernate.session_factory_name is not set, what name does
      the SessionFactory take?
    options:
      - "A random UUID"
      - "The persistence-unit name"
      - "The fully-qualified Dialect class name"
      - "Always 'default'"
    answer: 1
    explanation: |
      When hibernate.session_factory_name is unset in HB7, the persistence-unit name
      is used as the SessionFactory name (and for JNDI binding where applicable).
      HB7 also adds hibernate.session_factory_jndi_name to separate the logical name
      from the JNDI name.
    ref: "concepts.md#sessionfactory-name-in-hb7"

  - id: configuration-bootstrapping-schema-generation-072
    difficulty: advanced
    tags: [connection-handling-mode, release-after-statement, tradeoffs]
    question: |
      What is the practical downside of DELAYED_ACQUISITION_AND_RELEASE_AFTER_STATEMENT
      (the JTA default) if you forced it under RESOURCE_LOCAL?
    options:
      - "It disables the persistence context"
      - "The connection is returned to the pool after every statement and re-borrowed for the next, adding acquire/release churn within one transaction"
      - "It commits each statement immediately, breaking atomicity"
      - "It prevents Hibernate from generating any SQL"
    answer: 1
    explanation: |
      RELEASE_AFTER_STATEMENT hands the connection back after each statement so it
      must be reacquired for the next one — extra churn that suits JTA resource
      aggregation but wastes cycles under RESOURCE_LOCAL, where RELEASE_AFTER_TRANSACTION
      (hold for the transaction) is the sensible default. It does not commit per
      statement or break atomicity.
    ref: "concepts.md#connection-acquisition-and-release-modes"
