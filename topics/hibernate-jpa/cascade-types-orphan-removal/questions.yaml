topic: "Cascade Types & Orphan Removal"
domain: hibernate-jpa
topic_slug: cascade-types-orphan-removal
version: 1
questions:
- id: cascade-types-orphan-removal-001
  difficulty: beginner
  tags: [cascade, basics, persist]
  question: |
    What does "cascading" a persistence operation mean in JPA?
  options:
  - "It configures a database ON DELETE CASCADE foreign-key constraint"
  - "It propagates an EntityManager operation from a parent entity to its associated entities"
  - "It automatically fetches associations eagerly to avoid N+1 queries"
  - "It merges the first-level and second-level caches on flush"
  answer: 1
  explanation: |
    Cascading tells the provider to walk an association and apply the same
    EntityManager operation (persist, merge, remove, refresh, detach) to the
    associated entities. It is an in-memory graph traversal, not a DB constraint
    and unrelated to fetching or caching.
  ref: "concepts.md#what-cascading-is-and-how-hibernate-applies-it"

- id: cascade-types-orphan-removal-002
  difficulty: beginner
  tags: [cascade, defaults]
  question: |
    By default, if you declare `@OneToMany List<OrderLine> lines;` with no
    `cascade` attribute, which operations are cascaded to the lines?
  options:
  - "PERSIST and MERGE only"
  - "REMOVE only"
  - "ALL operations"
  - "None — nothing is cascaded unless you specify it"
  answer: 3
  explanation: |
    There is no default cascade in JPA. An association with no `cascade` attribute
    propagates nothing; you must persist/remove children yourself. (Don't confuse
    this with the fetch default, which is LAZY for @OneToMany.)
  ref: "concepts.md#the-jpa-cascadetype-values"

- id: cascade-types-orphan-removal-003
  difficulty: intermediate
  tags: [orphan-removal, remove, key-distinction]
  question: |
    You have `@OneToMany(cascade = CascadeType.REMOVE)` (orphanRemoval NOT set).
    You do `order.getLines().remove(line)` but never call `em.remove(line)` and
    the FK column is nullable. What happens on flush?
  options:
  - "Hibernate issues `UPDATE OrderLine SET order_id = NULL` — the row survives as an orphan"
  - "Hibernate issues `DELETE FROM OrderLine` for that line"
  - "Nothing changes until the parent Order is removed"
  - "A dereferenced-collection exception is thrown"
  answer: 0
  explanation: |
    CascadeType.REMOVE only reacts to an explicit `em.remove(parent)`, not to
    dereferencing a child from the collection. Without orphanRemoval, dropping the
    line just nulls its FK (or violates a NOT NULL constraint); the row is not
    deleted.
  ref: "concepts.md#orphanremoval-vs-cascadetyperemove"

- id: cascade-types-orphan-removal-004
  difficulty: intermediate
  tags: [orphan-removal, key-distinction]
  question: |
    Same mapping but now `@OneToMany(orphanRemoval = true)`. You do
    `order.getLines().remove(line)` and flush, without calling `em.remove(line)`.
    What SQL runs?
  options:
  - "`UPDATE OrderLine SET order_id = NULL`"
  - "No SQL — orphanRemoval only fires when the parent is removed"
  - "`DELETE FROM \"Order\"` cascading down"
  - "`DELETE FROM OrderLine WHERE id = ?` for the removed line"
  answer: 3
  explanation: |
    orphanRemoval reacts to dereferencing: when a child is removed from the managed
    collection, Hibernate schedules a DELETE for that row on flush, even though the
    parent is still alive and em.remove was never called.
  ref: "concepts.md#orphanremoval-vs-cascadetyperemove"

- id: cascade-types-orphan-removal-005
  difficulty: beginner
  tags: [orphan-removal, cascade-type]
  question: |
    Is `orphanRemoval` one of the values of `jakarta.persistence.CascadeType`?
  options:
  - "No — it is a separate boolean attribute on @OneToOne/@OneToMany"
  - "Yes — it is `CascadeType.ORPHAN`"
  - "Yes — it is included inside `CascadeType.ALL`"
  - "No — it only exists as a Hibernate-native cascade style"
  answer: 0
  explanation: |
    orphanRemoval is a distinct boolean element of @OneToOne and @OneToMany, not a
    CascadeType. CascadeType.ALL (PERSIST, MERGE, REMOVE, REFRESH, DETACH) does not
    include orphan removal.
  ref: "concepts.md#the-jpa-cascadetype-values"

- id: cascade-types-orphan-removal-006
  difficulty: intermediate
  tags: [cascade-type, all]
  question: |
    Which set of operations does `CascadeType.ALL` expand to in Jakarta
    Persistence?
  options:
  - "PERSIST, MERGE, REMOVE, REFRESH, DETACH"
  - "PERSIST, MERGE, REMOVE, REFRESH, DETACH, and orphanRemoval"
  - "SAVE_UPDATE, REPLICATE, LOCK, PERSIST, REMOVE"
  - "PERSIST, MERGE, REMOVE only"
  answer: 0
  explanation: |
    CascadeType.ALL is shorthand for the five spec cascade types: PERSIST, MERGE,
    REMOVE, REFRESH, DETACH. orphanRemoval is separate; SAVE_UPDATE/REPLICATE/LOCK
    are Hibernate-native, not JPA.
  ref: "concepts.md#the-jpa-cascadetype-values"

- id: cascade-types-orphan-removal-007
  difficulty: intermediate
  tags: [shared-reference, remove, judgment]
  question: |
    Many `Employee` entities reference one shared `Department` via `@ManyToOne`.
    Why is putting `cascade = CascadeType.REMOVE` on that association dangerous?
  options:
  - "It causes a LazyInitializationException when loading employees"
  - "Removing one employee would delete the shared Department other employees still reference"
  - "It forces the Department association to become EAGER"
  - "It prevents the Employee row from ever being deleted"
  answer: 1
  explanation: |
    Cascading REMOVE across a shared reference means em.remove(employee) tries to
    delete the Department too — but that Department is shared by other employees,
    causing FK violations or silent data loss. Only cascade REMOVE for exclusive
    ownership.
  ref: "concepts.md#when-to-cascade-vs-when-not-to"

- id: cascade-types-orphan-removal-008
  difficulty: intermediate
  tags: [judgment, composition, aggregate]
  question: |
    Which relationship is the BEST candidate for `cascade = ALL` +
    `orphanRemoval = true`?
  options:
  - "Employee → Department (many employees per department)"
  - "Order → OrderLine (a line exists only within its order)"
  - "Book → Author in a @ManyToMany"
  - "Product → Category (a shared lookup category)"
  answer: 1
  explanation: |
    Order→OrderLine is true composition: the line has no independent existence and
    is not shared, so its whole lifecycle should flow through the aggregate root.
    The others are shared/reference associations where cascading REMOVE would
    delete data still in use.
  ref: "concepts.md#modeling-a-true-parent-child-aggregate"

- id: cascade-types-orphan-removal-009
  difficulty: advanced
  tags: [orphan-removal, mechanism, dirty-checking]
  question: |
    How does Hibernate detect that a child has become an orphan when
    `orphanRemoval = true`?
  options:
  - "It compares the managed persistent collection against its snapshot during dirty checking at flush"
  - "It relies on a database trigger installed by schema generation"
  - "It polls the database for rows whose FK no longer matches any parent"
  - "It marks orphans immediately when remove() is called, before any flush"
  answer: 0
  explanation: |
    Loaded collections are wrapped in a persistent collection that records contents.
    At flush, dirty checking diffs the current collection against the snapshot; any
    element present before but absent now is an orphan and is scheduled for DELETE.
  ref: "concepts.md#orphanremoval-mechanism-and-generated-sql"

- id: cascade-types-orphan-removal-010
  difficulty: intermediate
  tags: [orphan-removal, clear]
  question: |
    With `orphanRemoval = true` on `Order.lines`, what does
    `order.getLines().clear()` followed by a flush do?
  options:
  - "Nulls the FK of every line but keeps all rows"
  - "Issues a DELETE for every line that was in the collection"
  - "Only detaches the lines from the persistence context"
  - "Throws because you cannot clear an orphan-removal collection"
  answer: 1
  explanation: |
    clear() dereferences every element. With orphanRemoval=true each becomes an
    orphan and is scheduled for DELETE on flush, removing all child rows.
  ref: "concepts.md#orphanremoval-mechanism-and-generated-sql"

- id: cascade-types-orphan-removal-011
  difficulty: advanced
  tags: [orphan-removal, gotcha, reassign-collection]
  question: |
    With `orphanRemoval = true`, a developer writes
    `order.setLines(new ArrayList<>(newLines))` to swap in a fresh list. What is
    the likely result?
  options:
  - "A HibernateException: 'A collection with orphan deletion was no longer referenced by the owning entity instance'"
  - "The new list is silently ignored"
  - "It works fine and orphans the old elements cleanly"
  - "All new lines are deleted instead of inserted"
  answer: 0
  explanation: |
    Hibernate manages the original persistent collection instance. Reassigning the
    field to a brand-new List can trigger the 'dereferenced collection with orphan
    deletion' exception. The correct idiom is to mutate the existing collection
    (clear() + addAll()).
  ref: "concepts.md#gotchas-reassigning-collections-and-reattachment"

- id: cascade-types-orphan-removal-012
  difficulty: intermediate
  tags: [orphan-removal, validity, mapping]
  question: |
    On which association types is `orphanRemoval = true` valid?
  options:
  - "@ManyToOne and @ManyToMany"
  - "Any association type"
  - "Only @OneToMany"
  - "@OneToOne and @OneToMany"
  answer: 3
  explanation: |
    orphanRemoval expresses private ownership of the target, so it is only valid on
    @OneToOne and @OneToMany. It is illegal on @ManyToOne/@ManyToMany, where the
    target is inherently shared.
  ref: "concepts.md#orphanremoval-vs-cascadetyperemove"

- id: cascade-types-orphan-removal-013
  difficulty: intermediate
  tags: [cascade, persist, transient]
  question: |
    You call `em.persist(order)` where `order.lines` holds new transient OrderLine
    objects, and the @OneToMany has NO cascade. What is the likely outcome on
    flush?
  options:
  - "All lines are inserted automatically because persist is always transitive"
  - "Only the Order is inserted; the transient lines cause an error or stay unsaved"
  - "Hibernate silently ignores the Order and inserts only the lines"
  - "The lines are inserted lazily on the next query"
  answer: 1
  explanation: |
    persist is not transitive without cascade=PERSIST. Hibernate inserts the Order;
    the references to transient lines cause a TransientObjectException/
    PropertyValueException on flush or leave the children unsaved.
  ref: "concepts.md#what-cascading-is-and-how-hibernate-applies-it"

- id: cascade-types-orphan-removal-014
  difficulty: intermediate
  tags: [cascade, direction, gotcha]
  question: |
    A developer puts `cascade = CascadeType.REMOVE` on the CHILD side
    (`OrderLine.order` @ManyToOne). What is the consequence of
    `em.remove(someLine)`?
  options:
  - "Only that line is removed, as expected"
  - "Nothing — cascade on @ManyToOne is ignored"
  - "It tries to delete the parent Order (and possibly its other lines)"
  - "It nulls the order_id of every line in the order"
  answer: 2
  explanation: |
    Cascade is directional and fires toward the target of the annotated
    association. REMOVE on OrderLine.order means removing a line cascades to delete
    the whole Order — and if the Order cascades REMOVE to its lines, every sibling
    line too. This is a classic destructive mistake.
  ref: "concepts.md#where-cascade-is-declared-and-direction"

- id: cascade-types-orphan-removal-015
  difficulty: advanced
  tags: [cascade, merge, orphan-removal, gotcha]
  question: |
    You load an Order with 3 lines, detach it, remove one line from the detached
    list (now 2 lines), then `em.merge(order)`. The mapping has
    `orphanRemoval = true`. What happens to the third line in the DB?
  options:
  - "It is kept — merge never deletes rows"
  - "It is deleted, because the merged collection is missing it and orphanRemoval fires"
  - "It causes an OptimisticLockException"
  - "It is duplicated"
  answer: 1
  explanation: |
    On merge, Hibernate reconciles the collection; the element present in the DB but
    absent from the merged graph is treated as an orphan and deleted. This surprises
    developers who merge partial graphs.
  ref: "concepts.md#gotchas-reassigning-collections-and-reattachment"

- id: cascade-types-orphan-removal-016
  difficulty: beginner
  tags: [cascade-type, mapping]
  question: |
    Where is the `cascade` attribute specified?
  options:
  - "On the association mapping annotation (e.g. @OneToMany(cascade = ...))"
  - "In persistence.xml as a global setting"
  - "On the @Entity annotation of the parent class"
  - "On the @Id field of the child entity"
  answer: 0
  explanation: |
    Cascade is a property of a single association, set as an attribute of the
    relationship annotation (@OneToMany, @ManyToOne, @OneToOne, @ManyToMany).
  ref: "concepts.md#where-cascade-is-declared-and-direction"

- id: cascade-types-orphan-removal-017
  difficulty: intermediate
  tags: [cascade, bidirectional, direction]
  question: |
    In a bidirectional relationship, if `Order.lines` has `cascade = ALL`, what
    cascade does `OrderLine.order` have?
  options:
  - "It automatically inherits cascade = ALL"
  - "Whatever is declared on its own @ManyToOne — cascade is per-association"
  - "It is forced to have no cascade"
  - "It inherits only PERSIST and MERGE"
  answer: 1
  explanation: |
    Cascade is a property of each individual association. The two sides of a
    bidirectional relationship have independent cascade settings; declaring cascade
    on one side says nothing about the other.
  ref: "concepts.md#where-cascade-is-declared-and-direction"

- id: cascade-types-orphan-removal-018
  difficulty: advanced
  tags: [hibernate-native, save-update, replicate]
  question: |
    Which of these is a Hibernate-NATIVE cascade style that has no direct equivalent
    in `jakarta.persistence.CascadeType`?
  options:
  - "PERSIST"
  - "REMOVE"
  - "SAVE_UPDATE (and REPLICATE / LOCK)"
  - "DETACH"
  answer: 2
  explanation: |
    SAVE_UPDATE, REPLICATE, and LOCK are Hibernate-native styles tied to legacy
    Session methods (saveOrUpdate, replicate, lock). PERSIST, REMOVE, and DETACH are
    standard JPA cascade types.
  ref: "concepts.md#hibernate-native-cascade-types"

- id: cascade-types-orphan-removal-019
  difficulty: intermediate
  tags: [cascade-type, refresh]
  question: |
    What does `CascadeType.REFRESH` cause?
  options:
  - "It flushes pending changes to children before a query"
  - "It reloads the second-level cache for the entity"
  - "It re-reads the parent and its associated children from the database when em.refresh(parent) is called"
  - "It reattaches detached children to the persistence context"
  answer: 2
  explanation: |
    REFRESH propagates em.refresh(parent) to associated entities, overwriting their
    in-memory state with the current database values. It is not about flushing,
    caching, or reattachment.
  ref: "concepts.md#the-jpa-cascadetype-values"

- id: cascade-types-orphan-removal-020
  difficulty: intermediate
  tags: [cascade-type, detach]
  question: |
    What does `CascadeType.DETACH` do when `em.detach(parent)` is called?
  options:
  - "Deletes the children from the database"
  - "Evicts the associated children from the persistence context along with the parent"
  - "Marks the children as read-only"
  - "Refreshes children from the DB before detaching"
  answer: 1
  explanation: |
    DETACH cascades em.detach(parent) so associated entities are also evicted from
    the persistence context, becoming detached. No SQL runs; it only changes managed
    state.
  ref: "concepts.md#the-jpa-cascadetype-values"

- id: cascade-types-orphan-removal-021
  difficulty: advanced
  tags: [cascade, back-reference, gotcha]
  question: |
    You cascade PERSIST correctly and call `em.persist(order)`, but you forgot to
    call `line.setOrder(order)`. The @ManyToOne owns the FK. What is the likely
    result?
  options:
  - "The line is inserted with order_id = NULL (or a NOT NULL constraint fails)"
  - "The line is not inserted at all"
  - "Hibernate infers the FK automatically from the collection"
  - "An OptimisticLockException is thrown"
  answer: 0
  explanation: |
    Cascade propagates the operation, not the link. The owning @ManyToOne side sets
    the FK; if you never set line.setOrder(order), the order_id is null (or violates
    NOT NULL). Use an addLine() helper that sets both sides.
  ref: "concepts.md#gotchas-reassigning-collections-and-reattachment"

- id: cascade-types-orphan-removal-022
  difficulty: advanced
  tags: [cascade, db-cascade, comparison]
  question: |
    What is a key difference between `CascadeType.REMOVE` and a database
    `ON DELETE CASCADE` constraint?
  options:
  - "They are identical; JPA just generates the DDL constraint"
  - "CascadeType.REMOVE runs in the persistence context (issuing child DELETEs and firing callbacks); ON DELETE CASCADE is enforced by the DB and bypasses Hibernate"
  - "ON DELETE CASCADE fires JPA lifecycle callbacks; CascadeType.REMOVE does not"
  - "CascadeType.REMOVE only works on @ManyToMany associations"
  answer: 1
  explanation: |
    CascadeType.REMOVE is an application-level, in-context operation: Hibernate loads
    and deletes children and fires @PreRemove/@PostRemove callbacks. A DB
    ON DELETE CASCADE is enforced by the database itself and bypasses Hibernate
    entirely (no callbacks, no context updates).
  ref: "concepts.md#what-cascading-is-and-how-hibernate-applies-it"

- id: cascade-types-orphan-removal-023
  difficulty: intermediate
  tags: [shared-reference, judgment, safe-cascade]
  question: |
    For a shared reference where you want to save a new object graph in one call but
    must never delete the shared target, which cascade setting is safest?
  options:
  - "cascade = ALL"
  - "cascade = REMOVE only"
  - "orphanRemoval = true"
  - "cascade = {PERSIST, MERGE} (never REMOVE)"
  answer: 3
  explanation: |
    Cascading only PERSIST and MERGE lets you save/merge the graph conveniently while
    never propagating a delete to the shared target. Cascading REMOVE (or ALL, or
    orphanRemoval) risks deleting shared data.
  ref: "concepts.md#when-to-cascade-vs-when-not-to"

- id: cascade-types-orphan-removal-024
  difficulty: intermediate
  tags: [many-to-many, remove, judgment]
  question: |
    For a `@ManyToMany` between Book and Author, why is cascading REMOVE almost
    always wrong?
  options:
  - "@ManyToMany does not support the cascade attribute"
  - "Deleting one Book could delete Authors referenced by other Books"
  - "It would only delete the join-table rows, which is never useful"
  - "REMOVE is not a valid cascade type for collections"
  answer: 1
  explanation: |
    In @ManyToMany the targets are shared by definition. Cascading REMOVE means
    deleting one Book tries to delete its Authors, who are still referenced by other
    Books — data loss. Removing the association should only affect the join table,
    which is handled by mutating the collection, not by cascade REMOVE.
  ref: "concepts.md#when-to-cascade-vs-when-not-to"

- id: cascade-types-orphan-removal-025
  difficulty: advanced
  tags: [aggregate, both-features, judgment]
  question: |
    Why does modeling a private parent-child aggregate need BOTH `cascade = ALL`
    AND `orphanRemoval = true`, rather than either alone?
  options:
  - "cascade=ALL handles persist/merge/refresh/detach and parent-remove; orphanRemoval adds delete-on-dereference which cascade does not cover"
  - "They are redundant; either one alone gives full aggregate behavior"
  - "cascade=ALL only inserts, orphanRemoval only updates"
  - "orphanRemoval propagates persist while cascade=ALL handles deletes"
  answer: 0
  explanation: |
    cascade=ALL alone won't delete a child you merely drop from the collection;
    orphanRemoval alone won't propagate persist/merge/refresh/detach. Combined, the
    children are fully subordinate to the root.
  ref: "concepts.md#modeling-a-true-parent-child-aggregate"

- id: cascade-types-orphan-removal-026
  difficulty: advanced
  tags: [orphan-removal, notnull, sql]
  question: |
    Mapping has `cascade = REMOVE` only (no orphanRemoval) and the child FK is
    `NOT NULL`. You remove a child from the collection and flush. What happens?
  options:
  - "The child is silently deleted"
  - "The removal is queued until the parent is removed"
  - "Hibernate skips the flush with a warning"
  - "Hibernate tries UPDATE ... SET order_id = NULL and the DB rejects it with a NOT NULL constraint violation"
  answer: 3
  explanation: |
    Without orphanRemoval, dereferencing a child makes Hibernate try to null its FK.
    With a NOT NULL column the database rejects the UPDATE, producing a constraint
    violation. Orphan removal (which deletes instead) avoids this.
  ref: "concepts.md#orphanremoval-vs-cascadetyperemove"

- id: cascade-types-orphan-removal-027
  difficulty: beginner
  tags: [cascade-type, persist]
  question: |
    Which EntityManager call is propagated by `CascadeType.PERSIST`?
  options:
  - "em.merge()"
  - "em.persist()"
  - "em.remove()"
  - "em.refresh()"
  answer: 1
  explanation: |
    Each CascadeType maps to the matching EntityManager method. PERSIST propagates
    em.persist(parent) so new children reachable through the association are also
    inserted.
  ref: "concepts.md#the-jpa-cascadetype-values"

- id: cascade-types-orphan-removal-028
  difficulty: intermediate
  tags: [orphan-removal, when-fires, flush]
  question: |
    At what point does the DELETE for an orphaned child actually execute?
  options:
  - "Immediately when remove() is called on the collection"
  - "Only when the transaction is rolled back"
  - "At flush time, within the transaction, during dirty checking"
  - "At the next em.find() on the child"
  answer: 2
  explanation: |
    Removing an element from the collection only changes in-memory state. The DELETE
    is scheduled and issued at flush, when Hibernate dirty-checks the collection and
    writes changes in flush order.
  ref: "concepts.md#orphanremoval-mechanism-and-generated-sql"

- id: cascade-types-orphan-removal-029
  difficulty: advanced
  tags: [orphan-removal, batching, performance]
  question: |
    With `orphanRemoval = true` and 500 children cleared from a collection, why
    might you see 500 individual DELETE statements, and how do you improve it?
  options:
  - "Hibernate always uses one bulk DELETE; 500 statements indicate a bug"
  - "Each orphan is a separate DELETE unless JDBC batching (hibernate.jdbc.batch_size) is enabled"
  - "You must switch to CascadeType.REMOVE to get a single DELETE"
  - "Orphan removal cannot be batched under any configuration"
  answer: 1
  explanation: |
    Orphan removal issues per-row DELETEs by default. Enabling
    hibernate.jdbc.batch_size lets Hibernate batch them into fewer round trips. This
    is a performance-tuning concern (see performance-tuning-pitfalls).
  ref: "concepts.md#orphanremoval-mechanism-and-generated-sql"

- id: cascade-types-orphan-removal-030
  difficulty: intermediate
  tags: [cascade, persist, sql, scenario]
  question: |
    With `cascade = ALL` on Order.lines, you build a new Order with two new lines
    (FKs set) and call `em.persist(order)`. How many INSERTs run on flush?
  options:
  - "One INSERT (only the Order)"
  - "Two INSERTs (only the lines)"
  - "Three INSERTs (one Order + one per line)"
  - "None until you also call em.persist on each line"
  answer: 2
  explanation: |
    cascade=ALL includes PERSIST, so persisting the order cascades to both lines:
    one INSERT for the Order and one INSERT per line = three total.
  ref: "concepts.md#what-cascading-is-and-how-hibernate-applies-it"

- id: cascade-types-orphan-removal-031
  difficulty: advanced
  tags: [orphan-removal, clear-addall, identity, gotcha]
  question: |
    A developer replaces a collection's contents with `clear()` then `addAll(...)`,
    including some of the same logical rows. With orphanRemoval on, what is the risk?
  options:
  - "Nothing — Hibernate reuses the existing rows by natural key"
  - "It throws a dereferenced-collection exception"
  - "The addAll is ignored because the rows already exist"
  - "clear() orphans and DELETEs all rows, then addAll re-INSERTs them, losing row identity/history"
  answer: 3
  explanation: |
    clear() dereferences every element (DELETE via orphan removal) and addAll inserts
    fresh rows. Even 'unchanged' rows get new identities, losing PK stability, audit
    history, and any FKs pointing at them. Prefer surgical add/remove.
  ref: "concepts.md#gotchas-reassigning-collections-and-reattachment"

- id: cascade-types-orphan-removal-032
  difficulty: intermediate
  tags: [cascade, remove, detached, gotcha]
  question: |
    Cascading REMOVE through a detached object graph via `em.remove(detachedParent)`
    often throws which exception, and what is the fix?
  options:
  - "IllegalArgumentException (remove requires a managed instance); merge first, then remove"
  - "LazyInitializationException; enable eager fetching"
  - "OptimisticLockException; retry the transaction"
  - "TransientObjectException; call persist first"
  answer: 0
  explanation: |
    em.remove requires a managed entity. Removing a detached instance throws
    IllegalArgumentException. Merge the graph into the context first, then remove the
    managed result so cascade REMOVE can traverse managed children.
  ref: "concepts.md#gotchas-reassigning-collections-and-reattachment"

- id: cascade-types-orphan-removal-033
  difficulty: beginner
  tags: [cascade-type, merge]
  question: |
    `CascadeType.MERGE` propagates which operation?
  options:
  - "em.merge(parent) — merging a detached parent also merges its children"
  - "em.persist(parent)"
  - "em.detach(parent)"
  - "em.flush()"
  answer: 0
  explanation: |
    MERGE cascades em.merge(parent): the detached state of the parent and its
    associated (merge-cascaded) children is copied back into managed instances.
  ref: "concepts.md#the-jpa-cascadetype-values"

- id: cascade-types-orphan-removal-034
  difficulty: advanced
  tags: [aggregate, ddd, references, judgment]
  question: |
    In a well-modeled aggregate (Order root, OrderLine internal), how should
    OTHER entities in the system reference the order's data?
  options:
  - "Hold direct references to individual OrderLine instances for efficiency"
  - "Reference both the Order and each OrderLine to keep FKs consistent"
  - "Reference the aggregate root (Order) and never hold their own references to internal OrderLines"
  - "Reference OrderLines only, since the root is just a container"
  answer: 2
  explanation: |
    Aggregate rules say external entities reference the root only; internal children
    (OrderLine) are reached through the root. This keeps orphanRemoval + cascade safe
    because nothing outside shares the children. See system-design/ddd-aggregates.
  ref: "concepts.md#modeling-a-true-parent-child-aggregate"

- id: cascade-types-orphan-removal-035
  difficulty: intermediate
  tags: [cascade, in-memory, mechanism]
  question: |
    When you call `em.persist(parent)` with cascade=PERSIST, when is the actual
    INSERT SQL for the children emitted?
  options:
  - "Immediately during the persist() call"
  - "As soon as the child object is constructed"
  - "Only after the transaction commits successfully"
  - "Later, when the persistence context flushes (before commit or a triggering query)"
  answer: 3
  explanation: |
    Cascading schedules the operation in the persistence context in memory. The SQL
    is emitted later at flush time, in dependency order. See
    transactions-dirty-checking-flushing.
  ref: "concepts.md#what-cascading-is-and-how-hibernate-applies-it"

- id: cascade-types-orphan-removal-036
  difficulty: expert
  tags: [orphan-removal, one-to-one, scenario]
  question: |
    An `@OneToOne(orphanRemoval = true)` maps Person → Address. You do
    `person.setAddress(newAddress)`, replacing the previous managed Address, then
    flush. What happens to the OLD address row?
  options:
  - "It is kept and simply unlinked"
  - "Both old and new addresses coexist"
  - "It is deleted, because the previously-owned Address was dereferenced"
  - "A unique-constraint violation is thrown"
  answer: 2
  explanation: |
    orphanRemoval on @OneToOne means replacing the owned target dereferences the old
    one, marking it an orphan. On flush Hibernate DELETEs the old Address (after
    wiring the new one). This is the single-valued analogue of removing from a
    collection.
  ref: "concepts.md#orphanremoval-vs-cascadetyperemove"

- id: cascade-types-orphan-removal-037
  difficulty: intermediate
  tags: [cascade, remove, parent, scenario]
  question: |
    With `cascade = REMOVE` on Order.lines, what does `em.remove(order)` do?
  options:
  - "Removes only the Order row, leaving orphaned lines"
  - "Throws because you must remove lines first"
  - "Nulls the order_id on all lines but keeps them"
  - "Removes the Order and cascades DELETE to all its lines"
  answer: 3
  explanation: |
    A removed parent orphans all children, and cascade REMOVE propagates the delete:
    Hibernate deletes the lines then the order (in FK-safe order) on flush.
  ref: "concepts.md#orphanremoval-vs-cascadetyperemove"

- id: cascade-types-orphan-removal-038
  difficulty: expert
  tags: [orphan-removal, cascade-remove, parent-delete, subtlety]
  question: |
    When the parent is deleted via `em.remove(parent)`, both `cascade=REMOVE` and
    `orphanRemoval=true` result in the children being deleted. So what is the ONLY
    scenario where their behavior actually diverges?
  options:
  - "When persisting a brand-new parent"
  - "When refreshing the parent from the database"
  - "When a child is removed from the collection while the parent stays managed (dereferencing)"
  - "When the parent is detached"
  answer: 2
  explanation: |
    For an explicit parent remove, both delete the children. They diverge only on
    dereferencing: dropping a child from the collection while keeping the parent
    triggers a DELETE under orphanRemoval but only a FK-null UPDATE under
    cascade=REMOVE.
  ref: "concepts.md#orphanremoval-vs-cascadetyperemove"

- id: cascade-types-orphan-removal-039
  difficulty: advanced
  tags: [hibernate-native, save-update, modern]
  question: |
    What is required to use Hibernate-native cascade styles like `SAVE_UPDATE`, and
    why are they discouraged in Hibernate 6/7?
  options:
  - "Nothing special; they are part of jakarta.persistence and fully recommended"
  - "They require enabling a persistence.xml flag and are the recommended default"
  - "The native @org.hibernate.annotations.Cascade annotation is required, and they are discouraged because Hibernate 6/7 aligns on the JPA/EntityManager API"
  - "They only work with XML mappings and are mandatory for @OneToMany"
  answer: 2
  explanation: |
    Native styles need @org.hibernate.annotations.Cascade and tie to legacy Session
    methods (saveOrUpdate, replicate, lock). Modern Hibernate standardizes on the JPA
    EntityManager API, so prefer the JPA cascade attribute unless you truly need those
    legacy operations.
  ref: "concepts.md#hibernate-native-cascade-types"

- id: cascade-types-orphan-removal-040
  difficulty: intermediate
  tags: [helper-method, both-sides, best-practice]
  question: |
    Why is an `addLine(OrderLine l) { lines.add(l); l.setOrder(this); }` helper
    recommended on a bidirectional aggregate?
  options:
  - "It enables second-level caching of the lines"
  - "It replaces the need for cascade = PERSIST"
  - "It forces eager loading of the collection"
  - "It keeps both sides of the association in sync so the FK is set and the managed collection is correct"
  answer: 3
  explanation: |
    Cascade propagates operations, not the link. A helper that sets both the
    collection and the owning @ManyToOne keeps object state consistent, avoiding null
    FKs and dirty-checking surprises.
  ref: "concepts.md#gotchas-reassigning-collections-and-reattachment"

- id: cascade-types-orphan-removal-041
  difficulty: expert
  tags: [orphan-removal, persistent-collection, mechanism]
  question: |
    Why must a collection be LOADED (initialized) for orphan-removal dirty checking
    to detect a removed element?
  options:
  - "Because orphan removal is disabled on lazy collections"
  - "Because uninitialized collections are always treated as empty and everything is deleted"
  - "Because Hibernate diffs the current contents against the snapshot it captured when the persistent collection was initialized"
  - "Because dirty checking runs only on EAGER associations"
  answer: 2
  explanation: |
    Orphan detection compares the live persistent collection against the snapshot
    taken at initialization. Hibernate needs that baseline to know which elements
    disappeared. (This does not require making the association EAGER; it just must be
    initialized before you mutate and flush.)
  ref: "concepts.md#orphanremoval-mechanism-and-generated-sql"

- id: cascade-types-orphan-removal-042
  difficulty: intermediate
  tags: [cascade-type, judgment, precision]
  question: |
    Which statement about cascade types is CORRECT?
  options:
  - "There is a CascadeType.FLUSH that propagates em.flush()"
  - "There is no default cascade; you must opt in per association"
  - "CascadeType.ALL automatically enables orphanRemoval"
  - "@ManyToOne cascades REMOVE by default"
  answer: 1
  explanation: |
    No cascade happens unless declared. There is no CascadeType.FLUSH (flush walks
    the whole context anyway), ALL does not enable orphanRemoval, and @ManyToOne
    cascades nothing by default.
  ref: "concepts.md#the-jpa-cascadetype-values"

- id: cascade-types-orphan-removal-043
  difficulty: advanced
  tags: [callbacks, cascade-remove, db-cascade, scenario]
  question: |
    Your OrderLine has a `@PreRemove` callback that must run for auditing. You need
    children deleted when the order is deleted. Which approach guarantees the
    callback fires?
  options:
  - "A database ON DELETE CASCADE constraint"
  - "A native SQL bulk DELETE via em.createNativeQuery"
  - "cascade = REMOVE (or orphanRemoval) so Hibernate deletes each child and fires @PreRemove"
  - "Truncating the table on schema regeneration"
  answer: 2
  explanation: |
    JPA lifecycle callbacks fire only when Hibernate performs the delete per entity.
    cascade=REMOVE/orphanRemoval load and delete each child through the context,
    firing @PreRemove. DB-level cascade and bulk/native DELETEs bypass Hibernate and
    skip callbacks.
  ref: "concepts.md#what-cascading-is-and-how-hibernate-applies-it"

- id: cascade-types-orphan-removal-044
  difficulty: intermediate
  tags: [orphan-removal, vs-remove, summary]
  question: |
    In one phrase, what extra behavior does `orphanRemoval = true` add that
    `CascadeType.REMOVE` does NOT provide?
  options:
  - "It cascades persist to new children"
  - "It makes the association eager"
  - "It adds a database ON DELETE CASCADE constraint"
  - "It deletes a child when it is dereferenced/removed from the collection, even if the parent is not removed"
  answer: 3
  explanation: |
    The defining extra of orphan removal is delete-on-dereference: a child dropped
    from the collection is deleted even though the parent stays alive. CascadeType
    .REMOVE only reacts to an explicit parent remove.
  ref: "concepts.md#orphanremoval-vs-cascadetyperemove"

- id: cascade-types-orphan-removal-045
  difficulty: advanced
  tags: [namespace, jakarta, version]
  question: |
    In Jakarta Persistence 3.x with Hibernate 6/7, which import is correct for the
    cascade enum?
  options:
  - "javax.persistence.CascadeType"
  - "org.hibernate.CascadeType (only)"
  - "jakarta.orm.CascadeType"
  - "jakarta.persistence.CascadeType"
  answer: 3
  explanation: |
    Jakarta EE 9+ moved the namespace from javax.persistence to jakarta.persistence,
    and Hibernate 6/7 use it. The standard cascade enum is
    jakarta.persistence.CascadeType (Hibernate's native one is
    org.hibernate.annotations.CascadeType).
  ref: "concepts.md#the-jpa-cascadetype-values"

- id: cascade-types-orphan-removal-046
  difficulty: expert
  tags: [scenario, blog, comments, judgment]
  question: |
    A blog Post has Comments (`@OneToMany`). Comments should disappear if removed
    from a post's list AND if the post is deleted, and comments are never shared
    across posts. Which mapping best expresses this?
  options:
  - "@OneToMany(cascade = PERSIST) with no orphanRemoval"
  - "@OneToMany with a database ON DELETE CASCADE only, no JPA cascade"
  - "@ManyToMany(cascade = REMOVE)"
  - "@OneToMany(cascade = ALL, orphanRemoval = true)"
  answer: 3
  explanation: |
    Comments are privately owned by the post: they should be inserted/updated/deleted
    through the post (cascade=ALL) and deleted when removed from the list
    (orphanRemoval=true). That is the canonical aggregate mapping. @ManyToMany is
    wrong (comments aren't shared) and PERSIST-only won't delete them.
  ref: "concepts.md#modeling-a-true-parent-child-aggregate"

- id: cascade-types-orphan-removal-047
  difficulty: expert
  tags: [action-queue, flush-order, unique-constraint, scenario]
  question: |
    `Order` has a unique `slug`. In one transaction you call
    `em.remove(oldOrder)` (slug "sale") then `em.persist(new Order("sale"))`, then
    commit. Why does this throw a ConstraintViolationException?
  options:
  - "The ActionQueue runs ordinary entity deletes LAST (after inserts), so the INSERT fires while the old row still exists, tripping the unique constraint"
  - "persist and remove cannot be mixed in one transaction"
  - "Hibernate never flushes deletes and inserts in the same transaction"
  - "The slug column must be @Version-annotated to allow reuse"
  answer: 0
  explanation: |
    At flush the ActionQueue executes by action type, not call order: inserts run
    before EntityDeleteAction. So the new row is inserted while the old one is still
    present, violating the unique constraint. Fix: update the existing row in place
    rather than remove-then-insert (an intervening flush() only masks it).
  ref: "concepts.md#flush-time-action-ordering-actionqueue"

- id: cascade-types-orphan-removal-048
  difficulty: expert
  tags: [action-queue, orphan-removal, flush-order, subtlety]
  question: |
    Why does replacing an orphan-removed child with a NEW child that shares a unique
    key usually succeed, whereas remove-then-persist of a top-level entity sharing a
    unique key fails?
  options:
  - "Orphan removal disables unique constraints during flush"
  - "Orphan removal defers the insert to a second transaction"
  - "New children are never checked against unique constraints"
  - "OrphanRemovalAction runs FIRST in the ActionQueue (before inserts), while ordinary EntityDeleteAction runs LAST (after inserts)"
  answer: 3
  explanation: |
    The ActionQueue ordering is asymmetric: orphan-removal deletes fire before
    inserts, but ordinary em.remove deletes fire after inserts. So the orphan's
    DELETE clears the key before the replacement's INSERT, whereas a top-level
    remove-then-persist inserts first and collides.
  ref: "concepts.md#flush-time-action-ordering-actionqueue"

- id: cascade-types-orphan-removal-049
  difficulty: advanced
  tags: [action-queue, flush-order, mechanism]
  question: |
    In the Hibernate ActionQueue, in what order are these executed at flush?
  options:
  - "Exactly the order the EntityManager methods were called"
  - "Orphan-removal deletes, then inserts, then updates, then collection actions, then ordinary deletes"
  - "All deletes first, then all inserts, then all updates"
  - "Inserts first, then all deletes (orphan and ordinary together), then updates"
  answer: 1
  explanation: |
    Hibernate orders by action type to satisfy FK dependencies: OrphanRemovalAction,
    then inserts, then updates, then collection actions, then EntityDeleteAction
    (ordinary deletes) last. This is independent of the order you called the methods.
  ref: "concepts.md#flush-time-action-ordering-actionqueue"

- id: cascade-types-orphan-removal-050
  difficulty: expert
  tags: [on-delete, ddl, performance, scenario]
  question: |
    Deleting an Order with 300 lines via `cascade=REMOVE` issues ~301 DELETEs and is
    too slow. You add `@OnDelete(action = OnDeleteAction.CASCADE)` on the
    collection. What changes in the emitted SQL and DDL?
  options:
  - "The child FK is generated with 'on delete cascade'; deleting the parent removes children in a single DB-driven statement, and Hibernate no longer loads the collection"
  - "Hibernate still issues per-row DELETEs but batches them automatically"
  - "It creates a database trigger that logs each child deletion"
  - "It converts the mapping to @ElementCollection"
  answer: 0
  explanation: |
    @OnDelete makes hbm2ddl emit the FK with 'on delete cascade', pushing the
    cascade into the database. The parent DELETE removes children in one statement
    and Hibernate skips loading/deleting them per row.
  ref: "concepts.md#ondelete-database-level-fk-cascade"

- id: cascade-types-orphan-removal-051
  difficulty: expert
  tags: [on-delete, callbacks, l2-cache, version, tradeoff]
  question: |
    What do you LOSE by using `@OnDelete(OnDeleteAction.CASCADE)` instead of JPA
    `cascade=REMOVE` for child deletion?
  options:
  - "Nothing — it is behaviorally identical, just faster"
  - "Support for @OneToMany mappings"
  - "The ability to delete the parent at all"
  - "@PreRemove/@PostRemove callbacks, second-level-cache eviction of the children, and optimistic-lock @Version checks — because the DB does the delete, bypassing the persistence context"
  answer: 3
  explanation: |
    @OnDelete is a database FK cascade: the DB deletes children without Hibernate's
    involvement, so lifecycle callbacks never fire, the L2 cache is not evicted
    (stale-cache risk), and no version checks run. That is the price of the single
    set-based delete.
  ref: "concepts.md#ondelete-database-level-fk-cascade"

- id: cascade-types-orphan-removal-052
  difficulty: advanced
  tags: [on-delete, package, api]
  question: |
    Which annotation and enum generate a database-level ON DELETE CASCADE from
    Hibernate mappings?
  options:
  - "@org.hibernate.annotations.OnDelete(action = OnDeleteAction.CASCADE), with OnDeleteAction in org.hibernate.annotations"
  - "jakarta.persistence.CascadeType.REMOVE on the @JoinColumn"
  - "@ForeignKey(onDelete = CASCADE) from jakarta.persistence"
  - "@OnDelete is part of jakarta.persistence 3.2"
  answer: 0
  explanation: |
    @OnDelete and OnDeleteAction (values CASCADE, NO_ACTION; older RESTRICT) are
    Hibernate-native, in org.hibernate.annotations. JPA has no standard annotation
    for generating ON DELETE CASCADE DDL.
  ref: "concepts.md#ondelete-database-level-fk-cascade"

- id: cascade-types-orphan-removal-053
  difficulty: expert
  tags: [bulk-delete, jpql, cascade-bypass, scenario]
  question: |
    With `@OneToMany(cascade=ALL, orphanRemoval=true)` on Order.lines, a developer
    runs `em.createQuery("delete from Order o where o.id=:id").executeUpdate()`.
    What happens to the child OrderLines?
  options:
  - "They are deleted too, because cascade=ALL applies to bulk deletes"
  - "The query is rejected because the entity has cascaded children"
  - "orphanRemoval deletes them since the parent is gone"
  - "They are NOT deleted — bulk JPQL bypasses cascade and orphanRemoval, so you get an FK violation or orphaned child rows"
  answer: 3
  explanation: |
    Bulk JPQL/HQL DELETE is one SQL statement executed directly; it does not load
    entities, so cascade, orphanRemoval, and lifecycle callbacks are all bypassed.
    The child rows remain, causing an FK-constraint violation or orphaned data.
  ref: "concepts.md#bulk-jpqlhql-deletes-bypass-cascade-and-orphan-removal"

- id: cascade-types-orphan-removal-054
  difficulty: advanced
  tags: [bulk-delete, pattern, performance, judgment]
  question: |
    You must delete an Order and its thousands of lines efficiently. Which approach
    is the set-based pattern that avoids per-row cascade deletes?
  options:
  - "em.remove(order) with cascade=REMOVE"
  - "Two bulk JPQL deletes: children by FK first, then the parent — accepting that callbacks and L2-cache sync are bypassed"
  - "Call order.getLines().clear() then em.flush()"
  - "Iterate the collection calling em.remove on each line"
  answer: 1
  explanation: |
    Manual bulk deletes (delete children by order_id, then the parent) turn N+1
    per-row deletes into two set-based statements. The trade-off is the same as any
    bulk op: no cascade traversal, no callbacks, and you should clear/evict the L2
    cache and persistence context afterward.
  ref: "concepts.md#bulk-jpqlhql-deletes-bypass-cascade-and-orphan-removal"

- id: cascade-types-orphan-removal-055
  difficulty: expert
  tags: [performance, cascade-remove, sql-count, scenario]
  question: |
    An Order has 200 lazily-loaded lines and `cascade=REMOVE`. How many SQL
    statements does `em.remove(order)` roughly generate, and why?
  options:
  - "1 — Hibernate issues a single cascading DELETE"
  - "2 — one for lines, one for the order, using set-based deletes"
  - "About 202 — a SELECT to load the collection, 200 per-row child DELETEs, then the parent DELETE"
  - "0 — deletion is deferred to the database via the FK"
  answer: 2
  explanation: |
    Cascade REMOVE operates on managed entities, so Hibernate first SELECTs the
    collection, then issues one DELETE per child (200), then deletes the parent —
    roughly 202 statements. This motivates @OnDelete or a bulk delete.
  ref: "concepts.md#performance-cascade-remove-loads-the-collection-and-deletes-per-row"

- id: cascade-types-orphan-removal-056
  difficulty: expert
  tags: [performance, version, optimistic-lock, sql]
  question: |
    A child entity in an orphan-removal collection has a `@Version` column. What does
    each per-row DELETE look like on flush?
  options:
  - "delete from OrderLine where id=?"
  - "delete from OrderLine where id=? and version=?  — the version predicate enforces optimistic locking"
  - "update OrderLine set deleted=true where id=?"
  - "delete from OrderLine where order_id=? for all rows at once"
  answer: 1
  explanation: |
    With an optimistic-lock @Version column, Hibernate appends the version to the
    DELETE's WHERE clause so a stale in-memory child fails the delete (0 rows
    affected -> OptimisticLockException) rather than silently deleting a changed row.
  ref: "concepts.md#performance-cascade-remove-loads-the-collection-and-deletes-per-row"

- id: cascade-types-orphan-removal-057
  difficulty: advanced
  tags: [transitive, recursion, graph]
  question: |
    Order cascades PERSIST to OrderLine, and OrderLine cascades PERSIST to
    LineDetail. You persist a new Order graph. What is inserted?
  options:
  - "The whole graph — Order, OrderLines, and LineDetails — because cascade is transitive through each declaring association"
  - "Only the Order and its OrderLines; LineDetails are ignored"
  - "Only the Order; cascade never goes past one level"
  - "Nothing, because multi-level cascade requires cascade=ALL everywhere"
  answer: 0
  explanation: |
    Cascade is recursive: it follows each association's own cascade settings down the
    graph. Since every hop declares PERSIST, the entire Order -> OrderLine ->
    LineDetail graph is inserted. A hop that omitted PERSIST would stop propagation
    there.
  ref: "concepts.md#cascade-is-transitive-across-the-object-graph"

- id: cascade-types-orphan-removal-058
  difficulty: advanced
  tags: [transitive, cyclic, mechanism]
  question: |
    How does Hibernate avoid infinite recursion when cascading across a bidirectional
    or cyclic entity graph?
  options:
  - "It limits cascade depth to a fixed constant (default 10)"
  - "It refuses to cascade on bidirectional associations"
  - "It tracks the set of already-visited entities during the cascade traversal so each is processed once"
  - "It requires @JsonIgnore to break the cycle"
  answer: 2
  explanation: |
    During a cascade the provider records visited entities, so an entity reachable by
    multiple paths (or via a back-reference) is handled only once, preventing
    infinite loops on cyclic graphs.
  ref: "concepts.md#cascade-is-transitive-across-the-object-graph"

- id: cascade-types-orphan-removal-059
  difficulty: expert
  tags: [one-to-one, orphan-removal, set-null, scenario]
  question: |
    `@OneToOne(orphanRemoval = true)` maps Person -> Address. You call
    `person.setAddress(null)` and flush. What SQL runs for the previously-owned
    Address?
  options:
  - "update Address set person_id = null where id=?"
  - "It throws because you cannot null an orphan-removal @OneToOne"
  - "No SQL; the Address is only detached"
  - "delete from Address where id=?  — dereferencing the owned child schedules its deletion"
  answer: 3
  explanation: |
    orphanRemoval on a single-valued @OneToOne treats setting the reference to null
    as dereferencing the owned child, so the old Address row is DELETEd on flush -
    the single-valued analogue of removing an element from a collection.
  ref: "concepts.md#orphanremoval-vs-cascadetyperemove"

- id: cascade-types-orphan-removal-060
  difficulty: advanced
  tags: [element-collection, value-type, distinction]
  question: |
    How does removing an element from an `@ElementCollection<String>` differ from
    removing an entity from a `@OneToMany(orphanRemoval=true)`?
  options:
  - "@ElementCollection elements are value types with no identity, so their DELETE from the collection table is automatic — there is no cascade or orphanRemoval attribute"
  - "You must set orphanRemoval=true on the @ElementCollection too"
  - "@ElementCollection removal only nulls the FK, it never deletes"
  - "They behave identically; @ElementCollection is just shorthand for @OneToMany"
  answer: 0
  explanation: |
    Element collections hold value types (embeddables/basics) with no independent
    identity or lifecycle, so removal-is-deletion is intrinsic and automatic. There is
    no orphanRemoval to enable. @OneToMany targets entities, where orphanRemoval is an
    opt-in that turns dereference into a DELETE.
  ref: "concepts.md#elementcollection-implicit-orphan-removal"

- id: cascade-types-orphan-removal-061
  difficulty: expert
  tags: [persistent-bag, clear-addall, sql, code-reading]
  question: |
    Order.lines is a `List` with NO @OrderColumn (a PersistentBag), orphanRemoval on.
    You call `lines.clear()` then `lines.addAll(sameLogicalRows)` and flush. What SQL
    is most likely?
  options:
  - "Surgical DELETEs only for rows that truly changed"
  - "No SQL, because the contents are logically the same"
  - "delete from OrderLine where order_id=? (all rows) followed by INSERTs for every element — a full recreate"
  - "A single UPDATE per row to refresh values"
  answer: 2
  explanation: |
    A bag has no per-row identity Hibernate can diff, so clear()+addAll() degenerates
    into deleting the whole collection and re-inserting every element, losing PK
    identity and history. A Set or an @OrderColumn list could diff and delete
    surgically.
  ref: "concepts.md#collection-type-affects-the-delete-sql"

- id: cascade-types-orphan-removal-062
  difficulty: expert
  tags: [persistent-bag, single-remove, sql, distinction]
  question: |
    Same PersistentBag with orphanRemoval. You instead call `lines.remove(oneLine)`
    and flush. What SQL runs?
  options:
  - "A full delete-all then re-insert of the survivors"
  - "update OrderLine set order_id=null where id=?"
  - "A targeted `delete from OrderLine where id=?` for just that line"
  - "Nothing until the parent is removed"
  answer: 2
  explanation: |
    Removing a single element is detected as an orphan and deleted surgically
    (delete ... where id=?). It is the bulk clear()+addAll() pattern - not an
    individual remove - that degenerates into delete-all/insert-all on a bag.
  ref: "concepts.md#collection-type-affects-the-delete-sql"

- id: cascade-types-orphan-removal-063
  difficulty: expert
  tags: [unidirectional, join-column, sql, gotcha]
  question: |
    A UNIDIRECTIONAL `@OneToMany` with a `@JoinColumn` (no mappedBy) manages children.
    Why can this produce extra UPDATE statements compared with a bidirectional mapping
    where the child owns the FK?
  options:
  - "Unidirectional mappings always use a join table, which is slower"
  - "It forces EAGER loading, adding SELECTs"
  - "Unidirectional @OneToMany disables batching entirely"
  - "Because the child does not own the FK, Hibernate may INSERT children then UPDATE their FK (and null-then-reset it on changes) instead of setting it in the insert"
  answer: 3
  explanation: |
    When the child doesn't own the FK (unidirectional @OneToMany with @JoinColumn),
    Hibernate can't set order_id in the child INSERT via the child's own mapping, so
    it issues extra UPDATEs to maintain the FK. Prefer a bidirectional mapping (child
    owns the FK) or add @OrderColumn.
  ref: "concepts.md#collection-type-affects-the-delete-sql"

- id: cascade-types-orphan-removal-064
  difficulty: expert
  tags: [many-to-many, remove, join-table, data-loss]
  question: |
    Book and Author have a `@ManyToMany`. You mistakenly set `cascade=CascadeType.ALL`
    and call `em.remove(book)`. What is the danger beyond deleting join rows?
  options:
  - "It only deletes the book_author join rows, which is always safe"
  - "It cascades REMOVE to the Author entities, deleting authors that other books still reference (data loss / FK violations)"
  - "It converts the relationship to @OneToMany"
  - "It throws because @ManyToMany ignores cascade"
  answer: 1
  explanation: |
    Removing the book's association would only delete join-table rows, but
    cascade=ALL/REMOVE also propagates the delete to the shared Author entities, which
    other books reference. Never use ALL/REMOVE on @ManyToMany; orphanRemoval isn't
    even legal there.
  ref: "concepts.md#manytomany-cascade-remove-and-join-table-rows"

- id: cascade-types-orphan-removal-065
  difficulty: advanced
  tags: [many-to-many, remove-link, sql]
  question: |
    For a properly-mapped `@ManyToMany` (no REMOVE cascade), what SQL runs when you
    remove one Author from `book.getAuthors()` and flush?
  options:
  - "delete from Author where id=?"
  - "update Author set book_id=null where id=?"
  - "delete from book_author where book_id=? and author_id=?  — only the join-table link is removed"
  - "Nothing; @ManyToMany links can't be removed by collection mutation"
  answer: 2
  explanation: |
    Mutating a @ManyToMany collection changes only the association, so Hibernate
    deletes the join-table row linking the two entities. The Author entity itself is
    untouched, which is correct because it is shared.
  ref: "concepts.md#manytomany-cascade-remove-and-join-table-rows"

- id: cascade-types-orphan-removal-066
  difficulty: expert
  tags: [remove-helper, set-null, update-vs-delete, code-reading]
  question: |
    A helper does `removeLine(l){ lines.remove(l); l.setOrder(null); }`. With
    `orphanRemoval=FALSE`, what SQL results on flush?
  options:
  - "delete from OrderLine where id=?"
  - "update OrderLine set order_id=null where id=?  (or a NOT NULL violation) — the child survives, disowned"
  - "No SQL runs at all"
  - "A dereferenced-collection exception"
  answer: 1
  explanation: |
    Without orphanRemoval, dropping the child and nulling its back-reference just
    disowns it: Hibernate issues UPDATE ... SET order_id=NULL (or fails on a NOT NULL
    column). With orphanRemoval=true the same helper would issue a DELETE instead.
  ref: "concepts.md#removal-helper-setparentnull--update-vs-delete"

- id: cascade-types-orphan-removal-067
  difficulty: advanced
  tags: [remove-helper, orphan-removal, update-vs-delete, distinction]
  question: |
    Same `removeLine` helper, but now `orphanRemoval=true`. What changes?
  options:
  - "Hibernate now issues DELETE FROM OrderLine WHERE id=? instead of nulling the FK"
  - "Nothing changes; both settings null the FK"
  - "It throws because setOrder(null) conflicts with orphan removal"
  - "It cascades the delete up to the Order"
  answer: 0
  explanation: |
    The lines.remove(l) is detected by the orphan-removal dirty check, so the child is
    DELETEd rather than having its FK nulled. setOrder(null) merely keeps the in-memory
    back-reference consistent. This is the exact UPDATE-vs-DELETE distinction between
    the two settings.
  ref: "concepts.md#removal-helper-setparentnull--update-vs-delete"

- id: cascade-types-orphan-removal-068
  difficulty: intermediate
  tags: [hibernate6, deprecation, save-update]
  question: |
    In Hibernate 6/7, what is the status of the native `Session.saveOrUpdate()` /
    `replicate()` methods that back cascade styles SAVE_UPDATE and REPLICATE?
  options:
  - "They are the recommended API for all new code"
  - "They were removed entirely in Hibernate 6"
  - "They are deprecated in favor of the JPA persist/merge API; prefer JPA cascade unless you truly need a native Session op"
  - "They are required for any @OneToMany mapping"
  answer: 2
  explanation: |
    Hibernate 6 deprecates saveOrUpdate/replicate in favor of the JPA
    EntityManager persist/merge API. The native @Cascade styles still exist and are
    listed in the User Guide, but the JPA cascade attribute is preferred for new code.
  ref: "concepts.md#hibernate-67-version-specifics"

- id: cascade-types-orphan-removal-069
  difficulty: advanced
  tags: [jakarta32, version, cascade-values]
  question: |
    A candidate claims Jakarta Persistence 3.2 (the Hibernate 7 baseline) added a new
    CascadeType. What is correct?
  options:
  - "True — it added CascadeType.ORPHAN"
  - "True — it added CascadeType.LOCK to match Hibernate"
  - "False — Jakarta Persistence 3.2 added no new CascadeType values; the set is still PERSIST, MERGE, REMOVE, REFRESH, DETACH (+ ALL)"
  - "True — it added CascadeType.REPLICATE"
  answer: 2
  explanation: |
    Jakarta Persistence 3.2 introduced no new cascade constants. The JPA set remains
    the five values plus ALL. LOCK/REPLICATE are Hibernate-native only, and there is
    no ORPHAN cascade type (orphanRemoval is a separate boolean).
  ref: "concepts.md#hibernate-67-version-specifics"

- id: cascade-types-orphan-removal-070
  difficulty: expert
  tags: [on-delete, callbacks, scenario, judgment]
  question: |
    Your OrderLine has a `@PostRemove` auditing callback that MUST fire for every
    deleted line. You also want single-statement parent deletes for performance. Why
    are these two goals in tension?
  options:
  - "They aren't; @OnDelete fires @PostRemove too"
  - "@PostRemove requires disabling cascade entirely"
  - "Callbacks only fire on inserts, so deletion strategy is irrelevant"
  - "Single-statement deletion means @OnDelete (DB FK cascade) or bulk JPQL, both of which bypass the persistence context and never fire @PostRemove; firing the callback requires per-entity Hibernate deletes"
  answer: 3
  explanation: |
    Lifecycle callbacks fire only when Hibernate deletes each entity through the
    context (cascade REMOVE / orphanRemoval), which is inherently per-row. The
    single-statement options (@OnDelete FK cascade, bulk JPQL) bypass the context and
    skip callbacks. You must trade one for the other.
  ref: "concepts.md#ondelete-database-level-fk-cascade"

- id: cascade-types-orphan-removal-071
  difficulty: advanced
  tags: [bulk-delete, l2-cache, staleness, gotcha]
  question: |
    After a bulk JPQL `delete from OrderLine where ...`, a later `em.find` in the same
    context or another transaction returns a line you just deleted. Why?
  options:
  - "The delete silently failed"
  - "The bulk delete is only applied at commit, not immediately"
  - "find always ignores deletes"
  - "Bulk DML bypasses the persistence context and second-level cache, so stale entities can remain cached; you should evict the L2 region / clear the context"
  answer: 3
  explanation: |
    Bulk operations execute directly in the database and do not synchronize the
    first- or second-level cache. A stale row can be served from cache afterward, so
    evict the affected L2 cache region and/or clear the persistence context after a
    bulk delete.
  ref: "concepts.md#bulk-jpqlhql-deletes-bypass-cascade-and-orphan-removal"

- id: cascade-types-orphan-removal-072
  difficulty: expert
  tags: [element-collection, set, sql, code-reading]
  question: |
    `@ElementCollection Set<String> tags` on Order. You do
    `order.getTags().remove("vip")` and flush. What SQL runs, and did you need any
    cascade/orphanRemoval setting?
  options:
  - "delete from order_tags where order_id=? and tag=?  — and no cascade/orphanRemoval is needed or available"
  - "update order_tags set tag=null — orphanRemoval must be true"
  - "delete from Tag where value='vip' — cascade=REMOVE required"
  - "Nothing runs unless you call em.remove"
  answer: 0
  explanation: |
    Element-collection values have no identity; removing one deletes the row from the
    collection table automatically. There is no cascade or orphanRemoval attribute on
    @ElementCollection because value types are always fully owned by their parent.
  ref: "concepts.md#elementcollection-implicit-orphan-removal"

- id: cascade-types-orphan-removal-073
  difficulty: advanced
  tags: [order-column, surgical-delete, sql, distinction]
  question: |
    You add `@OrderColumn` to Order.lines (was a plain-List PersistentBag). How does
    this affect the SQL when you remove a middle element with orphanRemoval on?
  options:
  - "It makes no difference; bags and ordered lists delete identically"
  - "Hibernate can now identify rows by position/id and issue a surgical DELETE (plus index-shifting UPDATEs) rather than recreating the whole collection"
  - "It forces a full delete-all then insert-all"
  - "It disables orphan removal"
  answer: 1
  explanation: |
    With @OrderColumn Hibernate maintains an index and can locate individual rows, so
    it deletes the removed element surgically and shifts the order indexes of the
    following rows, instead of the delete-all/insert-all a plain bag can trigger on
    bulk mutation.
  ref: "concepts.md#collection-type-affects-the-delete-sql"

- id: cascade-types-orphan-removal-074
  difficulty: expert
  tags: [on-delete, merge, orphan-removal, integration, scenario]
  question: |
    A service loads an Order WITHOUT its lines (lazy, uninitialized), maps it to a DTO,
    and later merges a reconstructed Order whose `lines` list is empty. Mapping is
    `orphanRemoval=true`. What is the risk?
  options:
  - "Nothing; uninitialized collections are ignored by merge"
  - "merge reconciles the (empty) collection against the DB and treats every existing line as an orphan, silently DELETEing all of them"
  - "It throws a LazyInitializationException that prevents any data loss"
  - "It duplicates all the lines"
  answer: 1
  explanation: |
    On merge, Hibernate copies the detached collection state onto the managed
    snapshot; lines present in the DB but absent from the merged (empty) collection are
    seen as orphans and deleted. Loading a partial/empty collection then merging is a
    classic silent-child-deletion bug. Load the full collection or manage removals
    explicitly.
  ref: "concepts.md#gotchas-reassigning-collections-and-reattachment"
