topic: "Caching: First & Second Level Cache"
domain: hibernate-jpa
topic_slug: caching-first-second-level
version: 1
questions:
  - id: caching-first-second-level-001
    difficulty: beginner
    tags: [l1-cache, persistence-context, fundamentals]
    question: |
      In Hibernate, what *is* the first-level (L1) cache?
    options:
      - "A shared cache at the SessionFactory level"
      - "An optional cache you enable with a provider like Ehcache"
      - "The result cache for JPQL and Criteria query executions"
      - "The persistence context of a single EntityManager/Session"
    answer: 3
    explanation: |
      The first-level cache is not a separate feature — it *is* the persistence
      context (the EntityManager/Session). Every managed entity lives there keyed by
      entity type + primary key. It is mandatory and per-Session.
    ref: "concepts.md#first-level-cache-is-the-persistence-context"

  - id: caching-first-second-level-002
    difficulty: beginner
    tags: [l1-cache, defaults]
    question: |
      Is the first-level cache enabled by default, and can you turn it off?
    options:
      - "It is off by default and must be explicitly enabled via a property"
      - "It is on by default and can be disabled via a property"
      - "It is always on and cannot be disabled — it is the persistence context"
      - "It is only active once you configure and register a cache provider"
    answer: 2
    explanation: |
      L1 is mandatory and always on because it is the persistence context itself. You
      cannot disable it; you can only clear(), detach/evict individual entities, or
      close the Session.
    ref: "concepts.md#first-level-cache-is-the-persistence-context"

  - id: caching-first-second-level-003
    difficulty: beginner
    tags: [l1-cache, repeated-read, sql]
    question: |
      Within a single transaction, you call `em.find(Author.class, 1L)` twice. How
      many SELECT statements does Hibernate issue?
    options:
      - "One — the second find is served from the first-level cache"
      - "Two — Hibernate re-executes the SELECT on every find call"
      - "Zero — find resolves from mapping metadata, never SQL"
      - "Two, but only if the second-level cache is disabled"
    answer: 0
    explanation: |
      The first find issues the SELECT and stores the entity in the persistence
      context (L1). The second find looks up the same EntityKey in L1 and returns the
      existing instance with no SQL.
    ref: "concepts.md#first-level-cache-is-the-persistence-context"

  - id: caching-first-second-level-004
    difficulty: intermediate
    tags: [l1-cache, identity]
    question: |
      Two `em.find(Author.class, 1L)` calls in the same Session return references `a1`
      and `a2`. What is guaranteed?
    options:
      - "a1 and a2 are equal by equals() but are different instances"
      - "a1 == a2 — the same object instance is returned"
      - "a2 is a fresh copy reloaded from the database"
      - "a2 is a proxy while a1 is the real entity"
    answer: 1
    explanation: |
      L1 provides guaranteed object identity within a Session: one database row maps to
      exactly one Java instance. Both calls return the same object, so `a1 == a2` holds
      (reference equality, not just equals()).
    ref: "concepts.md#first-level-cache-is-the-persistence-context"

  - id: caching-first-second-level-005
    difficulty: beginner
    tags: [l1-cache, scope, sharing]
    question: |
      Is the first-level cache shared between two concurrent Sessions?
    options:
      - "Yes — all Sessions in a SessionFactory share one L1 cache"
      - "Yes, but only for entities explicitly marked read-only"
      - "No — each Session has its own private, unshared L1 cache"
      - "Only when the query cache has been explicitly enabled"
    answer: 2
    explanation: |
      L1 is strictly per-Session and never shared. Anything one Session loads is
      invisible to another Session's L1. Cross-Session sharing is the job of the
      optional second-level cache.
    ref: "concepts.md#first-level-cache-is-the-persistence-context"

  - id: caching-first-second-level-006
    difficulty: intermediate
    tags: [l1-cache, clear, lifecycle]
    question: |
      What does `em.clear()` do to the first-level cache?
    options:
      - "Flushes pending changes but keeps entities managed"
      - "Detaches all managed entities, emptying the persistence context"
      - "Detaches only the entities annotated with @Cacheable"
      - "Closes the EntityManager and releases its JDBC connection"
    answer: 1
    explanation: |
      clear() detaches ALL managed entities, emptying the persistence context. It does
      not flush automatically, and it does not close the EntityManager. After clear(),
      a find for the same id re-hits the database.
    ref: "concepts.md#l1-lifecycle-clear-detach-evict-close"

  - id: caching-first-second-level-007
    difficulty: intermediate
    tags: [l1-cache, detach, evict]
    question: |
      Which operation removes a *single* entity from the persistence context, leaving
      the rest managed?
    options:
      - "em.clear() (drops just the one target entity from L1)"
      - "em.flush() (evicts that single entity after syncing it)"
      - "em.detach(entity) (Hibernate session.evict(entity))"
      - "em.close() (detaches only the most recently loaded entity)"
    answer: 2
    explanation: |
      em.detach(entity) — Hibernate's session.evict(entity) — removes just that one
      entity from L1, making it detached. clear() removes everything; flush()
      synchronizes changes without detaching; close() ends the Session.
    ref: "concepts.md#l1-lifecycle-clear-detach-evict-close"

  - id: caching-first-second-level-008
    difficulty: advanced
    tags: [l1-cache, batch, memory, oom]
    question: |
      A batch job persists 1,000,000 entities in one transaction and throws
      OutOfMemoryError. What is the standard fix?
    options:
      - "Enable the second-level cache so entities are offloaded"
      - "Switch every lazy association to EAGER fetching mode"
      - "Periodically call em.flush() then em.clear() every N entities"
      - "Mark the entity @Cacheable(false) to skip caching it"
    answer: 2
    explanation: |
      The L1 cache is not size-bounded — it retains every persisted entity for the
      life of the Session. Flushing (to push INSERTs) then clearing (to drop them from
      L1) in batches of N keeps memory bounded. L2 does not solve this.
    ref: "concepts.md#l1-lifecycle-clear-detach-evict-close"

  - id: caching-first-second-level-009
    difficulty: intermediate
    tags: [l1-cache, memory]
    question: |
      Is the first-level cache a size-limited LRU cache?
    options:
      - "Yes, it evicts the least-recently-used entity when full"
      - "Yes, its size is set by hibernate.cache.l1.max_entries"
      - "No — it is capped at 1000 entities by default before eviction"
      - "No — it holds every entity the Session touched until clear()/close()"
    answer: 3
    explanation: |
      L1 has no eviction policy or size cap. It accumulates every entity the Session
      loads or persists until you clear()/close() the Session. That is precisely why
      unbounded batch inserts cause OutOfMemoryError.
    ref: "concepts.md#l1-lifecycle-clear-detach-evict-close"

  - id: caching-first-second-level-010
    difficulty: beginner
    tags: [l2-cache, scope, fundamentals]
    question: |
      What is the scope of the second-level (L2) cache?
    options:
      - "Per SessionFactory — shared across all Sessions in the application"
      - "Per EntityManager/Session — private to each open Session"
      - "Per transaction — scoped to a single active transaction"
      - "Per HTTP request — one cache per inbound web request"
    answer: 0
    explanation: |
      L2 is scoped to the SessionFactory (the persistence unit / application) and is
      shared across all Sessions and threads. That shared scope is what lets a later
      transaction on a different Session avoid hitting the DB.
    ref: "concepts.md#second-level-cache-shared-across-sessions"

  - id: caching-first-second-level-011
    difficulty: beginner
    tags: [l2-cache, defaults]
    question: |
      Is the second-level cache enabled by default in Hibernate?
    options:
      - "No — it is optional and must be enabled and configured with a provider"
      - "Yes — it is enabled by default for every mapped entity"
      - "Yes — but only for entities with a @ManyToOne association"
      - "No — but it turns on automatically when you add @Entity"
    answer: 0
    explanation: |
      L2 is optional and off by default. You must set
      hibernate.cache.use_second_level_cache=true, provide a cache region factory
      (Ehcache, Infinispan, Caffeine, Hazelcast...), and mark entities as cacheable.
    ref: "concepts.md#second-level-cache-shared-across-sessions"

  - id: caching-first-second-level-012
    difficulty: intermediate
    tags: [l2-cache, lookup-path]
    question: |
      With both L1 and L2 enabled, in what order does Hibernate look for an entity by
      id?
    options:
      - "L2, then L1, then the database"
      - "The database, then L2, then L1"
      - "L1, then L2, then the database"
      - "L1 and L2 in parallel, then the database"
    answer: 2
    explanation: |
      Hibernate checks the Session-local L1 first. On a miss it checks the shared L2.
      Only on an L2 miss does it issue SQL, after which it stores dehydrated state in
      L2 and the managed instance in L1.
    ref: "concepts.md#second-level-cache-shared-across-sessions"

  - id: caching-first-second-level-013
    difficulty: intermediate
    tags: [l2-cache, providers]
    question: |
      Which of these is a legitimate second-level cache provider for Hibernate?
    options:
      - "Log4j"
      - "HikariCP"
      - "Flyway"
      - "Infinispan"
    answer: 3
    explanation: |
      Infinispan is a real L2 provider (often for clustered caches), as are Ehcache,
      Caffeine, and Hazelcast. HikariCP is a connection pool, Log4j is logging, and
      Flyway is schema migration — none are cache providers.
    ref: "concepts.md#second-level-cache-shared-across-sessions"

  - id: caching-first-second-level-014
    difficulty: intermediate
    tags: [l2-cache, shared-cache-mode, jpa]
    question: |
      Which `shared-cache-mode` caches only entities explicitly annotated
      `@Cacheable(true)`?
    options:
      - "ENABLE_SELECTIVE"
      - "ALL"
      - "DISABLE_SELECTIVE"
      - "NONE"
    answer: 0
    explanation: |
      ENABLE_SELECTIVE caches only entities marked @Cacheable(true) — opt-in, the
      common production choice. DISABLE_SELECTIVE caches everything except
      @Cacheable(false); ALL caches all entities; NONE disables L2.
    ref: "concepts.md#enabling-l2-shared-cache-mode-cacheable-cache"

  - id: caching-first-second-level-015
    difficulty: advanced
    tags: [l2-cache, shared-cache-mode]
    question: |
      Under `shared-cache-mode = DISABLE_SELECTIVE`, which entities are cached?
    options:
      - "Only entities annotated @Cacheable(true)"
      - "No entities at all — L2 stays completely empty"
      - "All entities except those annotated @Cacheable(false)"
      - "Only entities with a @Cache annotation and a READ_ONLY strategy"
    answer: 2
    explanation: |
      DISABLE_SELECTIVE is opt-out: everything is cached except entities explicitly
      marked @Cacheable(false). It is the inverse of ENABLE_SELECTIVE, which is opt-in.
    ref: "concepts.md#enabling-l2-shared-cache-mode-cacheable-cache"

  - id: caching-first-second-level-016
    difficulty: intermediate
    tags: [l2-cache, annotations, jakarta]
    question: |
      In current Jakarta Persistence (Hibernate 6/7), which package is the standard
      `@Cacheable` annotation in?
    options:
      - "javax.persistence"
      - "org.hibernate.annotations"
      - "jakarta.persistence"
      - "org.springframework.cache.annotation"
    answer: 2
    explanation: |
      The JPA-standard @Cacheable is jakarta.persistence.Cacheable (the jakarta.*
      namespace since Jakarta EE 9 / Hibernate 6). The legacy javax.persistence
      namespace is obsolete. Hibernate's richer @Cache lives in
      org.hibernate.annotations.
    ref: "concepts.md#enabling-l2-shared-cache-mode-cacheable-cache"

  - id: caching-first-second-level-017
    difficulty: intermediate
    tags: [l2-cache, annotations, concurrency-strategy]
    question: |
      What does Hibernate's `@Cache` annotation add beyond the JPA-standard
      `@Cacheable` marker?
    options:
      - "Nothing — they are aliases for each other"
      - "It enables and configures the first-level cache"
      - "It sets the concurrency strategy and cache region"
      - "It marks the entity as immutable and read-only"
    answer: 2
    explanation: |
      @Cacheable is just a boolean eligibility marker. Hibernate's @Cache
      (org.hibernate.annotations.Cache) additionally specifies usage (the
      CacheConcurrencyStrategy) and the cache region, which JPA-standard annotations
      cannot express.
    ref: "concepts.md#enabling-l2-shared-cache-mode-cacheable-cache"

  - id: caching-first-second-level-018
    difficulty: beginner
    tags: [l2-cache, concurrency-strategy, read-only]
    question: |
      Which L2 concurrency strategy is correct for a lookup table whose rows never
      change after insertion?
    options:
      - "TRANSACTIONAL"
      - "READ_WRITE"
      - "NONSTRICT_READ_WRITE"
      - "READ_ONLY"
    answer: 3
    explanation: |
      READ_ONLY is the cheapest strategy (no locking) and is intended for immutable
      reference data. Attempting to update a READ_ONLY-cached entity throws an
      exception, which is exactly the constraint that fits never-changing data.
    ref: "concepts.md#l2-concurrency-strategies"

  - id: caching-first-second-level-019
    difficulty: advanced
    tags: [l2-cache, concurrency-strategy, read-only]
    question: |
      What happens if you update an entity cached with `READ_ONLY` concurrency
      strategy?
    options:
      - "The update succeeds and the L2 cached copy is silently refreshed"
      - "Hibernate throws an exception — READ_ONLY data must not be modified"
      - "The update succeeds but the now-stale cached value silently remains"
      - "The entity is silently evicted from L2 and reloaded on next access"
    answer: 1
    explanation: |
      READ_ONLY forbids updates; attempting to modify such an entity results in an
      exception. That constraint is precisely why READ_ONLY can skip all locking and be
      the fastest strategy — it assumes immutability.
    ref: "concepts.md#l2-concurrency-strategies"

  - id: caching-first-second-level-020
    difficulty: advanced
    tags: [l2-cache, concurrency-strategy, nonstrict]
    question: |
      How does `NONSTRICT_READ_WRITE` handle a concurrent update to a cached entity?
    options:
      - "It acquires an exclusive lock on the cache entry for the whole transaction"
      - "It refuses the update outright, throwing an exception like READ_ONLY does"
      - "It evicts (invalidates) the entry on write; no locking, small stale-read window"
      - "It enlists the cache entry in the JTA transaction, committing via XA"
    answer: 2
    explanation: |
      NONSTRICT_READ_WRITE does no locking; on a write it simply invalidates/evicts the
      cached entry so the next read reloads from the DB. Because invalidation is not
      perfectly synchronized with commit, there is a brief window where a stale value
      can be read.
    ref: "concepts.md#l2-concurrency-strategies"

  - id: caching-first-second-level-021
    difficulty: advanced
    tags: [l2-cache, concurrency-strategy, read-write]
    question: |
      Which mechanism does the `READ_WRITE` concurrency strategy use to keep concurrent
      transactions consistent?
    options:
      - "Soft locks on the cache entry during the transaction"
      - "It participates directly in a JTA/XA transaction"
      - "It never writes updates to the cache, only reads"
      - "Optimistic locking via a @Version column only"
    answer: 0
    explanation: |
      READ_WRITE uses soft locks on the cache entry so concurrent transactions see a
      consistent view, at higher overhead than NONSTRICT_READ_WRITE. Full JTA
      participation is TRANSACTIONAL. READ_WRITE is the safe default for mutable but
      read-mostly data.
    ref: "concepts.md#l2-concurrency-strategies"

  - id: caching-first-second-level-022
    difficulty: advanced
    tags: [l2-cache, concurrency-strategy, transactional, jta]
    question: |
      When is the `TRANSACTIONAL` concurrency strategy applicable?
    options:
      - "For any entity mapping, with any L2 cache provider configured"
      - "Only for read-only reference data never modified after insertion"
      - "Only when the query cache has also been explicitly enabled"
      - "Only with a JTA transaction manager and a transactional cache provider"
    answer: 3
    explanation: |
      TRANSACTIONAL makes the cache participate in the JTA transaction, giving full
      transactional consistency, but it requires a JTA transaction manager and a
      transactional provider (e.g. Infinispan). It has the highest overhead and is
      rarely used.
    ref: "concepts.md#l2-concurrency-strategies"

  - id: caching-first-second-level-023
    difficulty: advanced
    tags: [l2-cache, staleness, bulk-update]
    question: |
      You run a bulk JPQL `UPDATE Product p SET p.price = ...` while Product is
      L2-cached. Reads afterward still show old prices. Why?
    options:
      - "Bulk JPQL updates automatically flush the L2 cache — this is a config bug"
      - "Bulk JPQL/HQL and raw SQL bypass the L2 invalidation path, leaving stale entries"
      - "The READ_WRITE strategy's soft locks permanently block cache invalidation"
      - "The first-level cache is overriding the second-level cache"
    answer: 1
    explanation: |
      Bulk JPQL UPDATE/DELETE, raw SQL, DB triggers, and other applications all write
      the table without going through Hibernate's per-entity lifecycle, so L2 is not
      invalidated and serves stale data. Evict the region explicitly after such
      operations.
    ref: "concepts.md#l2-concurrency-strategies"

  - id: caching-first-second-level-024
    difficulty: expert
    tags: [l2-cache, dehydrated-state, internals]
    question: |
      What does the second-level cache actually store for a cached entity?
    options:
      - "The live managed entity instance itself, shared directly across Sessions"
      - "A serialized proxy object holding the entity's initialized field values"
      - "A JSON document of the entity graph including all associations"
      - "A dehydrated representation of the entity's state (column values + fk ids), by id"
    answer: 3
    explanation: |
      L2 stores dehydrated state — the disassembled scalar/column values plus
      foreign-key identifiers — keyed by entity id, with no object references or
      proxies. On a hit, Hibernate rehydrates a fresh instance into the current Session.
    ref: "concepts.md#l2-stores-dehydrated-state-not-objects"

  - id: caching-first-second-level-025
    difficulty: expert
    tags: [l2-cache, dehydrated-state, thread-safety]
    question: |
      Why is it safe for many threads to read the same entity from L2 concurrently?
    options:
      - "Because each hit rehydrates a NEW entity instance into the requesting Session"
      - "Because Hibernate synchronizes all access with a global lock"
      - "Because L2 hands out deeply immutable, frozen entity instances"
      - "Because entities loaded from L2 are always accessed in read-only mode"
    answer: 0
    explanation: |
      L2 stores dehydrated state, not shared object instances. Each cache hit produces a
      freshly hydrated entity in the requesting Session, so no mutable object is shared
      across threads — that is exactly why the shared cache is thread-safe to read.
    ref: "concepts.md#l2-stores-dehydrated-state-not-objects"

  - id: caching-first-second-level-026
    difficulty: expert
    tags: [l2-cache, associations, dehydrated-state]
    question: |
      A cached `Author` has a `@ManyToOne Publisher`. How is that association stored in
      L2?
    options:
      - "As the fully hydrated Publisher object cached inline in the entry"
      - "It is not stored at all and is always reset to null on rehydration"
      - "As the publisher_id foreign key, resolved separately on rehydration"
      - "As a serialized proxy that lazily loads on access"
    answer: 2
    explanation: |
      Associations are stored as foreign-key identifiers, not as the associated
      objects. The cached Author holds publisher_id; the Publisher is resolved
      separately (from L2 if it too is cached, otherwise the DB).
    ref: "concepts.md#l2-stores-dehydrated-state-not-objects"

  - id: caching-first-second-level-027
    difficulty: advanced
    tags: [l2-cache, collections, associations]
    question: |
      You annotate `Author` with `@Cacheable` and `@Cache`. Does that also cache its
      `@OneToMany List<Book> books`?
    options:
      - "Yes — caching an entity caches all its collections automatically"
      - "Yes, but only when the collection is mapped as EAGER fetching"
      - "No — the collection needs its own @Cache annotation to be cached"
      - "No — collections are entirely ineligible for L2 caching"
    answer: 2
    explanation: |
      Entity caching covers only the entity's own scalar state. Collections/associations
      are separate cache regions and require their own @Cache on the collection field.
      Otherwise navigating the collection re-queries the DB (and can reintroduce N+1).
    ref: "concepts.md#what-l2-does-not-cache-by-default"

  - id: caching-first-second-level-028
    difficulty: advanced
    tags: [l2-cache, collections, ids]
    question: |
      A `@OneToMany` collection is L2-cached with its own `@Cache`. What does the
      collection cache region store?
    options:
      - "Only the ids of the associated entities"
      - "The fully hydrated child entities"
      - "Just the count of associated child rows"
      - "The parent entity's full state"
    answer: 0
    explanation: |
      The collection cache stores only the identifiers of the associated entities. To
      avoid re-fetching each child by id, the child entities themselves must also be
      L2-cached via their own @Cache.
    ref: "concepts.md#what-l2-does-not-cache-by-default"

  - id: caching-first-second-level-029
    difficulty: intermediate
    tags: [l2-cache, query-cache, boundaries]
    question: |
      Does enabling the entity L2 cache also cache the results of a JPQL query?
    options:
      - "Yes — every JPQL query result is automatically cached too"
      - "Yes, but only for JPQL queries that take no bind parameters"
      - "No — query results need the separate query cache, enabled explicitly"
      - "No — Hibernate never caches query results under any configuration"
    answer: 2
    explanation: |
      The entity cache serves lookups by id (find/getReference). Results of a
      JPQL/HQL/Criteria query are not cached unless you separately enable the query
      cache and mark the query cacheable.
    ref: "concepts.md#what-l2-does-not-cache-by-default"

  - id: caching-first-second-level-030
    difficulty: advanced
    tags: [query-cache, enable, mechanism]
    question: |
      What must be true to actually use Hibernate's query cache?
    options:
      - "Nothing extra — it turns on automatically whenever L2 is enabled"
      - "Simply annotate each queried entity with @Cacheable and nothing more"
      - "Just set shared-cache-mode=ALL to cache every query result"
      - "Set hibernate.cache.use_query_cache=true AND mark each query cacheable"
    answer: 3
    explanation: |
      The query cache is doubly opt-in: enable it globally
      (hibernate.cache.use_query_cache=true) AND request it per query
      (setCacheable(true) or the org.hibernate.cacheable hint). Entity caching alone
      does not enable it.
    ref: "concepts.md#the-query-cache-is-separate-and-often-a-net-negative"

  - id: caching-first-second-level-031
    difficulty: expert
    tags: [query-cache, internals, ids]
    question: |
      What does the query cache store for a cacheable query?
    options:
      - "The fully hydrated result entities materialized inline in the region"
      - "Only the generated SQL string, keyed by the original query text"
      - "The primary keys returned by the query, keyed by query string + bind params"
      - "A serialized snapshot of the raw JDBC ResultSet from the query"
    answer: 2
    explanation: |
      The query cache stores only the list of primary keys the query returned, keyed by
      the query text plus bind parameters. Materializing the results then looks each id
      up in L1, the L2 entity cache, or the DB.
    ref: "concepts.md#the-query-cache-is-separate-and-often-a-net-negative"

  - id: caching-first-second-level-032
    difficulty: expert
    tags: [query-cache, n-plus-one, gotcha]
    question: |
      Why can the query cache be actively harmful if the returned entities are NOT also
      in the L2 entity cache?
    options:
      - "It silently disables the first-level cache for every result entity"
      - "A query-cache hit still fires N SELECTs by id — an N+1 plus cache overhead"
      - "It throws a LazyInitializationException when ids are materialized"
      - "It permanently caches stale results with no invalidation"
    answer: 1
    explanation: |
      Because the query cache stores only ids, a hit must resolve each id. If those
      entities are not L2-cached, it issues N SELECTs by id — reintroducing N+1 — while
      still paying the cost of maintaining the query cache. Enable it only alongside
      entity caching for the same types.
    ref: "concepts.md#the-query-cache-is-separate-and-often-a-net-negative"

  - id: caching-first-second-level-033
    difficulty: expert
    tags: [query-cache, invalidation, update-timestamps]
    question: |
      Why does the query cache often have a poor hit rate on tables with any write
      traffic?
    options:
      - "The query cache is capped at a hard limit of 100 entries and overflows"
      - "Any insert/update/delete to a referenced table invalidates all cached queries over it"
      - "Every cached query entry expires automatically after exactly one second"
      - "The query cache ignores bind parameters, so keys always collide"
    answer: 1
    explanation: |
      The UpdateTimestampsCache tracks the last-write timestamp per table (query space).
      Any DML on a table invalidates every cached query touching it, so on a
      write-active table cached queries are evicted constantly and the hit rate
      collapses while you still pay maintenance cost.
    ref: "concepts.md#the-query-cache-is-separate-and-often-a-net-negative"

  - id: caching-first-second-level-034
    difficulty: intermediate
    tags: [l2-cache, judgment, reference-data]
    question: |
      Which entity is the BEST candidate for the second-level cache?
    options:
      - "A Country/currency reference table read constantly and almost never changed"
      - "A high-volume OrderEvent table written thousands of times per second"
      - "A large BlobDocument entity storing multi-megabyte payloads"
      - "A ShoppingCart entity mutated on nearly every single user click"
    answer: 0
    explanation: |
      L2 is a by-id cache for read-mostly data. A rarely-changing reference table read
      constantly is ideal. Write-heavy entities suffer constant invalidation, and large
      entities blow up memory with little reuse.
    ref: "concepts.md#when-l2-helps-vs-when-it-hurts"

  - id: caching-first-second-level-035
    difficulty: advanced
    tags: [l2-cache, judgment, anti-pattern]
    question: |
      Which is a poor use of the second-level cache?
    options:
      - "A rarely-updated product-category lookup table"
      - "An immutable currency reference table never changed"
      - "A write-heavy entity updated on nearly every request"
      - "A small config table read on every request and edited monthly"
    answer: 2
    explanation: |
      Write-heavy entities are a classic L2 anti-pattern: constant invalidation kills
      the hit rate and adds pure overhead. L2 pays off for read-mostly, by-id,
      reference-style data with infrequent writes.
    ref: "concepts.md#when-l2-helps-vs-when-it-hurts"

  - id: caching-first-second-level-036
    difficulty: advanced
    tags: [l2-cache, external-writes, staleness]
    question: |
      A second application writes directly to the same table Hibernate has L2-cached.
      What is the consequence?
    options:
      - "Hibernate serves the stale cached copy silently"
      - "Hibernate detects the change and refreshes L2 automatically"
      - "Hibernate throws an OptimisticLockException on next read"
      - "The L2 cache is disabled for that entity permanently"
    answer: 0
    explanation: |
      L2 is only invalidated by writes that go through this Hibernate instance. Another
      app, raw SQL, or triggers write the table without notifying Hibernate, so it keeps
      serving the stale cached copy — the classic multi-writer L2 staleness trap.
    ref: "concepts.md#when-l2-helps-vs-when-it-hurts"

  - id: caching-first-second-level-037
    difficulty: advanced
    tags: [l2-cache, judgment, interview]
    question: |
      An interviewer asks: "Should we just turn on L2 to speed up the app?" What is the
      strongest senior answer?
    options:
      - "Yes — L2 always improves performance, turn it on globally with shared-cache-mode=ALL"
      - "Measure first; L2 helps read-mostly, by-id reference data and adds distributed-invalidation complexity"
      - "No — L2 was deprecated in Hibernate 6 and removed from Hibernate 7's ORM core"
      - "Yes, but only after switching every association to EAGER so the cache prefills"
    answer: 1
    explanation: |
      L2 is not a general speedup. It helps read-mostly, by-id, reference-style data and
      introduces cross-node invalidation concerns. For general read scaling an explicit
      cache-aside layer (Redis) with deliberate invalidation is often clearer — see
      messaging-databases/caching-patterns.
    ref: "concepts.md#when-l2-helps-vs-when-it-hurts"

  - id: caching-first-second-level-038
    difficulty: advanced
    tags: [l2-cache, clustered, invalidation]
    question: |
      In a 3-node deployment where each JVM has its own SessionFactory, what problem
      does a local-only L2 cache (e.g. per-node Ehcache) create?
    options:
      - "The Session-local first-level cache silently stops functioning on every node"
      - "Node B can serve a stale copy after node A updates the entity, until B's TTL expires"
      - "All three nodes automatically discover and share one unified L2 cache region"
      - "The query cache is forcibly enabled across the entire three-node cluster"
    answer: 1
    explanation: |
      Each node's L2 is independent. If node A updates a cached entity, node B's
      local-only L2 is not notified and serves stale data until its own TTL expires.
      Cross-node coherency needs a replicated/distributed cache like Infinispan or
      Hazelcast — at added latency.
    ref: "concepts.md#clustered-l2-and-invalidation-across-nodes"

  - id: caching-first-second-level-039
    difficulty: expert
    tags: [l2-cache, clustered, tradeoffs]
    question: |
      What is the main trade-off of a replicated/distributed L2 (Infinispan/Hazelcast)
      versus a local-only L2?
    options:
      - "It becomes unable to cache entities and can only cache query results"
      - "It adds network latency and chatter for eventual cross-node consistency"
      - "It silently disables the first-level persistence context on all cluster nodes"
      - "It requires the separate query cache to be enabled on every node first"
    answer: 1
    explanation: |
      A distributed L2 propagates entries and invalidation messages across the cluster,
      solving cross-node staleness but adding network latency and chatter, with
      eventually-consistent invalidation. Local-only caches are faster but can hold stale
      copies per node.
    ref: "concepts.md#clustered-l2-and-invalidation-across-nodes"

  - id: caching-first-second-level-040
    difficulty: intermediate
    tags: [l1-cache, l2-cache, comparison]
    question: |
      Same two `find(Author, 1L)` calls occur in two *different* transactions on two
      different Sessions, with L2 disabled. How many SELECTs?
    options:
      - "Two — L1 is not shared, so each Session hits the DB once"
      - "One — both Sessions read from a single shared L1 cache"
      - "Zero — the query cache silently serves both find calls"
      - "One — the second Session reuses the first Session's instance"
    answer: 0
    explanation: |
      L1 is per-Session and unshared, so each Session's first load hits the DB — two
      SELECTs. Only with L2 enabled and the entity @Cacheable would the second
      transaction get an L2 hit and issue zero SELECTs.
    ref: "concepts.md#second-level-cache-shared-across-sessions"

  - id: caching-first-second-level-041
    difficulty: intermediate
    tags: [l1-cache, l2-cache, comparison]
    question: |
      Which statement correctly contrasts L1 and L2?
    options:
      - "L1 is optional and shared; L2 is mandatory and per-Session"
      - "L1 is mandatory and per-Session; L2 is optional and shared across Sessions"
      - "Both are mandatory and shared at the SessionFactory level"
      - "L1 caches only queries while L2 caches entities keyed by primary id"
    answer: 1
    explanation: |
      L1 (the persistence context) is mandatory, per-Session, and unshared. L2 is
      optional, configured with a provider, and shared across all Sessions at the
      SessionFactory level.
    ref: "concepts.md#second-level-cache-shared-across-sessions"

  - id: caching-first-second-level-042
    difficulty: intermediate
    tags: [l1-cache, l2-cache, api, evict]
    question: |
      What is the difference between `em.clear()` and
      `em.getEntityManagerFactory().getCache().evict(Product.class)`?
    options:
      - "clear() empties the L1 persistence context; getCache().evict() removes entries from the shared L2 cache"
      - "They are effectively identical — each one clears both the L1 and the L2 cache"
      - "clear() removes L2 entries; getCache().evict() empties the L1 persistence context"
      - "Both operate exclusively on the query cache region and leave L1 and L2 untouched"
    answer: 0
    explanation: |
      clear() detaches all managed entities from the Session-local L1 persistence
      context and does not touch L2. EntityManagerFactory.getCache().evict(...) removes
      entries from the shared, SessionFactory-scoped L2 cache. They act on different
      caches — clear() before a bulk operation frees L1 memory, whereas evict() is what
      fixes L2 staleness after a bypassing write.
    ref: "concepts.md#managing-the-cache-programmatically"

  - id: caching-first-second-level-043
    difficulty: beginner
    tags: [l1-cache, close, lifecycle]
    question: |
      What happens to managed entities when you call `em.close()`?
    options:
      - "They all become detached"
      - "They stay managed until garbage-collected"
      - "They are deleted from the database"
      - "They are copied into the second-level cache"
    answer: 0
    explanation: |
      Closing the EntityManager/Session ends the persistence context, so all previously
      managed entities become detached. Accessing an uninitialized lazy association on
      them afterward throws LazyInitializationException (see
      hibernate-jpa/entity-lifecycle-states).
    ref: "concepts.md#l1-lifecycle-clear-detach-evict-close"

  - id: caching-first-second-level-044
    difficulty: advanced
    tags: [l2-cache, query-cache, judgment]
    question: |
      Under which condition is the query cache most likely to be worthwhile?
    options:
      - "Frequently-repeated queries with identical params against rarely-written tables, whose entities are L2-cached"
      - "One-off queries that carry unique, never-repeated bind parameters on every run"
      - "Queries against a table that receives inserts or updates on nearly every request"
      - "Any query at all, since the query cache always stores fully hydrated entities"
    answer: 0
    explanation: |
      The query cache pays off only for frequently-repeated queries with identical bind
      parameters against rarely-written tables — and only when the returned entities are
      also L2-cached, otherwise a hit still fans out into N SELECTs by id.
    ref: "concepts.md#the-query-cache-is-separate-and-often-a-net-negative"

  - id: caching-first-second-level-045
    difficulty: intermediate
    tags: [l2-cache, access-pattern]
    question: |
      The second-level cache is fundamentally organized as a cache of what?
    options:
      - "Arbitrary query result sets keyed by SQL string"
      - "Entire database tables replicated in memory"
      - "Pooled JDBC connections to the database"
      - "Entity state keyed by primary key (a by-id cache)"
    answer: 3
    explanation: |
      L2 is a by-id cache: it stores dehydrated entity state keyed by primary key. That
      is why it accelerates lookups by id (find/getReference) but not arbitrary queries,
      which need the separate query cache.
    ref: "concepts.md#l2-stores-dehydrated-state-not-objects"

  - id: caching-first-second-level-046
    difficulty: expert
    tags: [l2-cache, staleness, tradeoffs, interview]
    question: |
      Your team enabled L2 with NONSTRICT_READ_WRITE on an entity that is updated
      several times a minute, and users occasionally report seeing old values right
      after an edit. What is the correct diagnosis?
    options:
      - "A genuine bug in Hibernate's L2 implementation; file a ticket with the maintainers"
      - "The brief stale-read window inherent to NONSTRICT_READ_WRITE — use READ_WRITE if that is unacceptable"
      - "The first-level persistence context is incorrectly leaking managed entities across Sessions"
      - "The query cache is silently corrupting the cached entity state on each read"
    answer: 1
    explanation: |
      NONSTRICT_READ_WRITE does no locking and only invalidates on write, so there is an
      inherent brief window where a stale value can be read. If stale reads are
      unacceptable for this update frequency, switch to READ_WRITE (soft locks) — at
      higher cost — or reconsider whether the entity belongs in L2 at all.
    ref: "concepts.md#l2-concurrency-strategies"

  - id: caching-first-second-level-047
    difficulty: expert
    tags: [read-write, soft-lock, internals, mechanism]
    question: |
      Under the READ_WRITE strategy, what does Hibernate place in the cache region for a
      key *during* an update transaction, before the DB commit?
    options:
      - "The new post-update dehydrated state, stored immediately and marked dirty until commit"
      - "A non-readable Lock (soft-lock) placeholder; the real value is written only after commit"
      - "Nothing — the entry is deleted immediately and re-added on commit"
      - "The old value with an incremented @Version so readers can detect staleness"
    answer: 1
    explanation: |
      READ_WRITE is asynchronous: the synchronous update() call installs a Lock (soft-lock)
      placeholder that is never readable. Only after the DB transaction commits does the
      afterUpdate callback replace the Lock with a real Item holding the freshly disassembled
      state.
    ref: "concepts.md#read_write-internals-soft-locks-and-async-refresh"

  - id: caching-first-second-level-048
    difficulty: expert
    tags: [read-write, soft-lock, consistency]
    question: |
      While a READ_WRITE cache entry holds a soft Lock, a concurrent transaction looks up
      that key. What does it get, and why does this prevent stale reads?
    options:
      - "It reads the Lock's stored value, which is guaranteed fresh"
      - "It blocks and waits until the writing transaction finally commits"
      - "A cache miss (the Lock is not readable), so it falls through to the DB"
      - "An immediate OptimisticLockException raised by the cache layer"
    answer: 2
    explanation: |
      A Lock reports isReadable() == false, so any concurrent lookup during the write window
      is a cache miss and falls through to the database. Because neither a pre- nor
      post-commit value is served from the cache during that window, no stale value can be
      read — that is exactly how READ_WRITE preserves consistency.
    ref: "concepts.md#read_write-internals-soft-locks-and-async-refresh"

  - id: caching-first-second-level-049
    difficulty: expert
    tags: [read-write, identity-generator, insert, gotcha]
    question: |
      An entity uses `@GeneratedValue(strategy = IDENTITY)` and is `@Cacheable` with
      READ_WRITE. After `persist()` + commit, the very next request in a new Session is a
      cache miss and hits the DB. Why?
    options:
      - "IDENTITY-generated entities are NOT put into L2 on insert; only SEQUENCE/TABLE cache on insert"
      - "A configuration bug — the @Cacheable annotation was silently ignored at bootstrap"
      - "READ_WRITE never caches newly inserted rows, regardless of generator"
      - "The soft lock installed by the insert has not yet reached its timeout window"
    answer: 0
    explanation: |
      IDENTITY forces the INSERT to execute immediately to obtain the generated key, which
      breaks Hibernate's transactional write-behind design, so the afterInsert cache put is
      skipped. Generators whose id is known before flush (SEQUENCE, TABLE, UUID) do cache the
      entity on insert.
    ref: "concepts.md#read_write-internals-soft-locks-and-async-refresh"

  - id: caching-first-second-level-050
    difficulty: expert
    tags: [read-write, soft-lock, timeout, rollback]
    question: |
      A READ_WRITE-cached entity's update transaction rolls back. For roughly the next 60
      seconds, reads of that entity miss L2 and hit the DB. What is happening?
    options:
      - "The query cache was fully invalidated and slowly rebuilds itself over the next 60 seconds"
      - "The entry is stuck as a soft Lock (never replaced); it clears at the ~60s DEFAULT_CACHE_LOCK_TIMEOUT"
      - "Hibernate automatically retries the failed update transaction once every 60 seconds"
      - "The L1 persistence context is being flushed on a fixed 60-second interval"
    answer: 1
    explanation: |
      When the write fails/rolls back, the afterUpdate callback that would replace the Lock
      with a real value does not install a readable value, so the entry stays a non-readable
      Lock. Reads fall through to the DB until the soft lock times out — the default
      DEFAULT_CACHE_LOCK_TIMEOUT is 60000 ms.
    ref: "concepts.md#read_write-internals-soft-locks-and-async-refresh"

  - id: caching-first-second-level-051
    difficulty: advanced
    tags: [read-write, nonstrict, contrast]
    question: |
      Which best contrasts READ_WRITE with NONSTRICT_READ_WRITE on an update?
    options:
      - "Both strategies acquire exclusive database-level locks; READ_WRITE simply holds them longer"
      - "READ_WRITE evicts the entry on write while NONSTRICT_READ_WRITE refreshes it in place with a new value"
      - "READ_WRITE refreshes the entry via a two-phase soft lock; NONSTRICT_READ_WRITE just evicts and can briefly serve stale data"
      - "Neither strategy writes to the cache on update; both operate purely in a read-only fashion"
    answer: 2
    explanation: |
      READ_WRITE is write-through/refresh: soft-lock before commit, install dehydrated state
      after commit. NONSTRICT_READ_WRITE is read-through/invalidate: it evicts on write with
      no locking, and because eviction is not atomic with the commit there is a brief window
      where a stale value can be read.
    ref: "concepts.md#read_write-internals-soft-locks-and-async-refresh"

  - id: caching-first-second-level-052
    difficulty: advanced
    tags: [cache-store-mode, refresh, jpa]
    question: |
      You want a specific `find` to force-reload an entity from the DB and overwrite its L2
      entry (not just read the cached copy). Which JPA-standard setting does this?
    options:
      - "jakarta.persistence.cache.retrieveMode = USE"
      - "jakarta.persistence.cache.retrieveMode = BYPASS"
      - "jakarta.persistence.cache.storeMode = BYPASS"
      - "jakarta.persistence.cache.storeMode = REFRESH"
    answer: 3
    explanation: |
      storeMode = REFRESH forces Hibernate to reload from the database and refresh the L2
      entry. retrieveMode controls whether L2 is consulted on read; BYPASS storeMode would
      instead prevent writing to L2; USE is the default (read from L2 if present).
    ref: "concepts.md#forcing-refresh-and-bypass-cachemode-cachestoremode-cacheretrievemode"

  - id: caching-first-second-level-053
    difficulty: advanced
    tags: [cache-retrieve-mode, bypass, jpa]
    question: |
      Which setting makes a query or `find` ignore any L2 entry and read straight from the
      database, while still allowing the fresh result to be stored back into L2?
    options:
      - "retrieveMode = BYPASS (with storeMode left at USE)"
      - "storeMode = BYPASS (with retrieveMode left at USE)"
      - "CacheMode.IGNORE (neither reads from nor writes to L2)"
      - "shared-cache-mode = NONE (disables L2 globally)"
    answer: 0
    explanation: |
      retrieveMode = BYPASS ignores L2 on the read path; leaving storeMode at its USE default
      still lets the fresh result be written back. storeMode = BYPASS would do the opposite
      (read L2, don't write); CacheMode.IGNORE neither reads nor writes; shared-cache-mode is
      a global setting, not per-operation.
    ref: "concepts.md#forcing-refresh-and-bypass-cachemode-cachestoremode-cacheretrievemode"

  - id: caching-first-second-level-054
    difficulty: expert
    tags: [cache-mode, warm-cache, hibernate]
    question: |
      You want to pre-warm the L2 cache by loading entities without ever *reading* existing
      cached entries (so a batch job populates fresh state). Which Hibernate `CacheMode`?
    options:
      - "CacheMode.GET"
      - "CacheMode.NORMAL"
      - "CacheMode.PUT"
      - "CacheMode.IGNORE"
    answer: 2
    explanation: |
      CacheMode.PUT writes to L2 but never reads from it — ideal for warming the cache. GET
      is read-only (never writes), NORMAL reads and writes, and IGNORE does neither.
    ref: "concepts.md#forcing-refresh-and-bypass-cachemode-cachestoremode-cacheretrievemode"

  - id: caching-first-second-level-055
    difficulty: expert
    tags: [cache-mode, mapping, jpa]
    question: |
      Hibernate's `CacheMode.GET` is equivalent to which combination of the two JPA-standard
      modes?
    options:
      - "retrieveMode = USE, storeMode = BYPASS"
      - "retrieveMode = BYPASS, storeMode = USE"
      - "retrieveMode = USE, storeMode = REFRESH"
      - "retrieveMode = BYPASS, storeMode = BYPASS"
    answer: 0
    explanation: |
      CacheMode is the product of the two JPA modes. GET means read from L2 but never write:
      retrieveMode = USE, storeMode = BYPASS. (PUT is BYPASS×USE, NORMAL is USE×USE, IGNORE is
      BYPASS×BYPASS, REFRESH is BYPASS×REFRESH.)
    ref: "concepts.md#forcing-refresh-and-bypass-cachemode-cachestoremode-cacheretrievemode"

  - id: caching-first-second-level-056
    difficulty: advanced
    tags: [natural-id, natural-id-cache, lookup]
    question: |
      With `@NaturalId` on `sku` and `@NaturalIdCache` on the entity,
      `session.byNaturalId(Product.class).using("sku", "ABC").load()` performs which lookup
      sequence?
    options:
      - "Resolves the primary key from the natural-id cache, then loads the entity from the L2 entity cache by that id"
      - "Compiles a JPQL query behind the scenes and serves it from the enabled query-result cache region"
      - "Scans the entire entity cache region for a matching sku"
      - "Always issues a SELECT ... WHERE sku = ? ignoring any cache"
    answer: 0
    explanation: |
      The natural-id cache stores a natural-id -> primary-key mapping. byNaturalId().load()
      first resolves the PK from that region, then loads the entity from the L2 entity cache
      by id. This is why the entity itself must also be L2-cached.
    ref: "concepts.md#natural-id-cache"

  - id: caching-first-second-level-057
    difficulty: intermediate
    tags: [natural-id, natural-id-cache, requirement]
    question: |
      You added `@NaturalIdCache` but the entity is not `@Cache`-annotated. What is the
      result of a `byNaturalId(...).load()`?
    options:
      - "It fails to compile because @NaturalIdCache is invalid without a companion @Cache on the entity"
      - "The entity is cached automatically because @NaturalIdCache implies @Cache"
      - "The natural-id cache is ignored entirely and every lookup falls back to a WHERE-clause SELECT"
      - "The natural-id cache resolves the id, but a SELECT still loads the entity because it is not L2-cached"
    answer: 3
    explanation: |
      The natural-id cache only stores the id mapping. If the entity itself is not L2-cached,
      resolving the id saves the WHERE-clause lookup but the entity load still hits the DB.
      To get a full cache hit you must @Cache the entity too.
    ref: "concepts.md#natural-id-cache"

  - id: caching-first-second-level-058
    difficulty: expert
    tags: [query-cache, cache-layout, version]
    question: |
      On Hibernate 6.5+, a cacheable query returns entities that are NOT in the L2 entity
      cache, yet a query-cache hit materializes results with no per-id SELECTs. Which
      configuration explains this?
    options:
      - "The query cache has always stored fully hydrated entities inline, so no per-id SELECT is ever needed"
      - "Setting shared-cache-mode = ALL forces the query cache to store complete result rows rather than ids"
      - "@QueryCacheLayout(FULL) (or AUTO resolving to FULL), which stores full state, not just ids"
      - "Using CacheMode.REFRESH on the query causes it to store full entity rows instead of primary keys"
    answer: 2
    explanation: |
      Since Hibernate 6.5 the CacheLayout is configurable. FULL (or AUTO when the entity is
      not L2-cacheable) stores the full entity/DTO state in the query cache, so a hit needs no
      per-id refetch. SHALLOW (the classic behavior) stores only ids.
    ref: "concepts.md#query-cache-layout-hibernate-65"

  - id: caching-first-second-level-059
    difficulty: expert
    tags: [query-cache, cache-layout, auto]
    question: |
      What does `CacheLayout.AUTO` (Hibernate 6.5+) do?
    options:
      - "Automatically disables the query cache whenever the referenced table receives heavy write traffic"
      - "Stores ids if the entity is L2-cacheable, otherwise stores full state"
      - "Always stores the full entity state inline regardless of whether the entity is L2-cacheable"
      - "Picks the SHALLOW_WITH_DISCRIMINATOR layout for every query to disambiguate subclasses"
    answer: 1
    explanation: |
      AUTO chooses SHALLOW (ids only) when the returned entity is itself L2-cacheable — so ids
      resolve cheaply from the entity cache — and FULL otherwise, so the query cache can stand
      alone without fanning out into N SELECTs.
    ref: "concepts.md#query-cache-layout-hibernate-65"

  - id: caching-first-second-level-060
    difficulty: advanced
    tags: [query-cache, version, cache-layout]
    question: |
      A teammate insists "the query cache can only ever store primary keys." When is that
      claim correct?
    options:
      - "Only on Hibernate 6.4 and earlier; since 6.5 CacheLayout (SHALLOW/FULL/AUTO) is configurable"
      - "Always — the query cache has only ever supported a single ids-only storage layout in every version"
      - "Only when the query cache is disabled, in which case it degrades to storing bare primary keys"
      - "Only for native SQL queries, since JPQL results are instead cached as fully hydrated entities"
    answer: 0
    explanation: |
      Through Hibernate 6.4 the query cache stored ids only. Hibernate 6.5 introduced the
      configurable CacheLayout (@QueryCacheLayout / hibernate.cache.query_cache_layout) with
      SHALLOW, FULL, SHALLOW_WITH_DISCRIMINATOR, and AUTO — so the old blanket claim is now
      version-dependent.
    ref: "concepts.md#query-cache-layout-hibernate-65"

  - id: caching-first-second-level-061
    difficulty: expert
    tags: [tuning, collection-cache, auto-evict, gotcha]
    question: |
      `Author` and its `@OneToMany books` collection are both L2-cached. You add a new `Book`
      through the association and commit, but the parent's cached `books` still shows the old
      list. What is the likely cause?
    options:
      - "The collection cache never reflects changes and must be manually rebuilt every time"
      - "READ_ONLY was configured on the collection region, so Hibernate refuses to apply the added child"
      - "The query cache is silently overriding the collection cache and serving the pre-insert list back"
      - "hibernate.cache.auto_evict_collection_cache defaults to false, so the collection region was not auto-evicted"
    answer: 3
    explanation: |
      auto_evict_collection_cache defaults to false: mutating one side of an association does
      NOT automatically evict the collection cache region unless you enable it. Otherwise you
      must evict the collection region explicitly.
    ref: "concepts.md#cache-tuning-properties"

  - id: caching-first-second-level-062
    difficulty: expert
    tags: [tuning, reference-entries, dehydration]
    question: |
      You set `hibernate.cache.use_reference_entries = true` hoping to skip dehydration and
      store entities by reference. For which entities does this actually take effect?
    options:
      - "Every entity marked @Cacheable, regardless of mutability or its association mappings"
      - "Only immutable entities with no to-one associations; otherwise it is silently ignored"
      - "Only entities configured with the READ_WRITE concurrency strategy and a soft-lock timeout"
      - "Only entities carrying an @Version field used for optimistic-locking staleness checks"
    answer: 1
    explanation: |
      use_reference_entries stores entities by reference (no disassembly) only when they are
      immutable and have no to-one associations — sharing a mutable/associated instance across
      threads would be unsafe, so those cases silently fall back to normal dehydration.
    ref: "concepts.md#cache-tuning-properties"

  - id: caching-first-second-level-063
    difficulty: advanced
    tags: [tuning, missing-cache-strategy, config]
    question: |
      An entity references a cache region that is not defined in the provider's
      configuration. Which `hibernate.cache.missing_cache_strategy` value makes Hibernate
      throw at startup so you catch the typo, rather than silently auto-creating it?
    options:
      - "create"
      - "create-warn"
      - "fail"
      - "ignore"
    answer: 2
    explanation: |
      missing_cache_strategy = fail throws when a referenced region is undefined — safest for
      production so a mis-named region is caught. create auto-creates silently; create-warn
      auto-creates and logs a warning.
    ref: "concepts.md#cache-tuning-properties"

  - id: caching-first-second-level-064
    difficulty: advanced
    tags: [tuning, minimal-puts, clustered]
    question: |
      What does `hibernate.cache.use_minimal_puts` do, and why is it defaulted on for
      clustered providers?
    options:
      - "Coalesces all pending cache puts in a transaction into a single batched network round-trip"
      - "Caps each region at a minimal fixed number of entries, evicting the oldest beyond that"
      - "Stores only the primary key instead of the full dehydrated state to shrink each entry"
      - "Skips a put when the entry is already present, avoiding redundant (network) writes"
    answer: 3
    explanation: |
      use_minimal_puts skips a cache put when the value is already cached, avoiding redundant
      writes. For clustered/distributed providers a put crosses the network, so avoiding
      unnecessary puts is a real win — hence the default-true for those providers.
    ref: "concepts.md#cache-tuning-properties"

  - id: caching-first-second-level-065
    difficulty: intermediate
    tags: [tuning, default-strategy, config]
    question: |
      Which property lets you set the L2 concurrency strategy globally so you can omit
      `usage` on each `@Cache`?
    options:
      - "hibernate.cache.default_cache_concurrency_strategy"
      - "hibernate.cache.region_prefix"
      - "hibernate.cache.use_structured_entries"
      - "jakarta.persistence.sharedCache.mode"
    answer: 0
    explanation: |
      default_cache_concurrency_strategy sets the strategy applied when @Cache does not
      specify usage. region_prefix names regions, use_structured_entries changes storage
      format, and sharedCache.mode selects which entities are cached, not the strategy.
    ref: "concepts.md#cache-tuning-properties"

  - id: caching-first-second-level-066
    difficulty: advanced
    tags: [eviction, bulk-update, api]
    question: |
      After a bulk JPQL `UPDATE` on `Product` (which bypasses L2), which call correctly drops
      all stale `Product` entries from the second-level cache using the JPA-standard API?
    options:
      - "em.clear() to detach everything and let the stale Product entries fall out of L2"
      - "em.getEntityManagerFactory().getCache().evict(Product.class)"
      - "em.flush() to push the bulk changes down and synchronize the L2 region"
      - "session.refresh(product) to reload each Product and overwrite its cached copy"
    answer: 1
    explanation: |
      The JPA Cache API is reached via EntityManagerFactory.getCache(); evict(Product.class)
      removes all Product entries from L2. clear()/flush() affect only the L1 persistence
      context, and refresh() reloads a single managed instance, not the whole region.
    ref: "concepts.md#managing-the-cache-programmatically"

  - id: caching-first-second-level-067
    difficulty: advanced
    tags: [eviction, query-cache, api, hibernate]
    question: |
      After the same bulk update, cached *query* results over `Product` are also stale. Which
      Hibernate-native call clears them?
    options:
      - "sessionFactory.getCache().evictQueryRegions()"
      - "sessionFactory.getCache().evictEntityData(Product.class) to purge the Product entity region"
      - "em.getCache().evict(Product.class) to drop the cached query results for Product"
      - "sessionFactory.close() to tear down and rebuild every cache region from scratch"
    answer: 0
    explanation: |
      evictQueryRegions() on org.hibernate.Cache clears cached query results. evictEntityData
      clears the entity region (not query results), the JPA evict handles entities, and
      closing the SessionFactory is not an eviction mechanism.
    ref: "concepts.md#managing-the-cache-programmatically"

  - id: caching-first-second-level-068
    difficulty: intermediate
    tags: [api, contains, introspection]
    question: |
      Which JPA `Cache` method tells you whether a given entity id currently sits in the L2
      cache?
    options:
      - "getCache().contains(Product.class, 42L)"
      - "getCache().evict(Product.class, 42L) to check presence by attempting a targeted removal"
      - "em.contains(product) to test whether that id is held in the shared L2 region"
      - "getCache().getHitCount() to read the running L2 hit tally for that entity type"
    answer: 0
    explanation: |
      jakarta.persistence.Cache.contains(Class, id) reports whether that entity is in L2.
      evict removes it; em.contains checks the L1 persistence context (managed state), not L2;
      getHitCount is not part of the standard Cache API.
    ref: "concepts.md#managing-the-cache-programmatically"

  - id: caching-first-second-level-069
    difficulty: expert
    tags: [region-factory, hibernate6, providers, version]
    question: |
      Migrating to Hibernate 6, your config referencing the native `EhCacheRegionFactory`
      from the ORM jar fails. What is the correct current approach for a local L2 cache?
    options:
      - "Downgrade Ehcache to the 2.x line so the native EhCacheRegionFactory resolves again"
      - "Use hibernate-jcache (JCacheRegionFactory) backed by Ehcache 3 or Caffeine"
      - "Keep the native region factories, which remain the only supported L2 option in Hibernate 6"
      - "Abandon the entity cache and rely on the query-result cache to cover the same lookups"
    answer: 1
    explanation: |
      Hibernate 6 removed the native Ehcache/Infinispan region factories. For a local cache
      you now use hibernate-jcache (JSR-107, JCacheRegionFactory) backed by Ehcache 3 or
      Caffeine; for clustered caches you use infinispan-hibernate-cache-v60.
    ref: "concepts.md#region-factories-in-hibernate-67"

  - id: caching-first-second-level-070
    difficulty: expert
    tags: [clustered, infinispan, invalidation-mode]
    question: |
      For a clustered Hibernate L2 with Infinispan, which cache mode is typically recommended
      because only eviction messages cross the network (each node keeps its own copy)?
    options:
      - "Replication mode"
      - "Distributed mode"
      - "Invalidation mode"
      - "Local mode"
    answer: 2
    explanation: |
      Invalidation mode is the common L2 recommendation: each node holds its own copy and only
      invalidation messages propagate on writes. Replication copies full state to every node
      (chatty); distributed shards data across owners; local has no cross-node coherence.
    ref: "concepts.md#region-factories-in-hibernate-67"

  - id: caching-first-second-level-071
    difficulty: expert
    tags: [cache-annotation, include, lazy]
    question: |
      What does the `include = "non-lazy"` attribute on Hibernate's `@Cache` do?
    options:
      - "Restricts caching to only those entities that declare no lazy-loaded associations at all"
      - "Excludes lazy-loaded properties from the cached state"
      - "Overrides each property's fetch plan to EAGER so the whole entity is fetched up front"
      - "Turns off the separate collection cache region for the entity's mapped associations"
    answer: 1
    explanation: |
      @Cache(include = ...) defaults to "all"; setting it to "non-lazy" excludes lazy
      properties from the entity's cached (dehydrated) state, so those properties are loaded
      separately rather than cached.
    ref: "concepts.md#cacheable-vs-cache-precision"

  - id: caching-first-second-level-072
    difficulty: advanced
    tags: [cache-annotation, region, defaults]
    question: |
      If you cache `com.example.Author` and its `@OneToMany books` collection without naming
      regions explicitly, what are the default region names?
    options:
      - "author and author_books"
      - "Both share one region named com.example.Author"
      - "com.example.Author for the entity and com.example.Author.books for the collection"
      - "A single auto-generated UUID per region"
    answer: 2
    explanation: |
      By default an entity's region is its fully-qualified class name (com.example.Author),
      and a collection's region is OwnerEntity.collectionField (com.example.Author.books). You
      can override with @Cache(region = ...).
    ref: "concepts.md#cacheable-vs-cache-precision"

  - id: caching-first-second-level-073
    difficulty: advanced
    tags: [cacheable, cache-annotation, shared-cache-mode]
    question: |
      Under `shared-cache-mode = ENABLE_SELECTIVE`, which annotation is required for an entity
      to be L2-cached, and what does the other add?
    options:
      - "@Cache alone is required; @Cacheable only supplies the concurrency strategy and region"
      - "Neither is needed, because ENABLE_SELECTIVE caches every mapped entity by default"
      - "Both are exact aliases, so either annotation used alone caches nothing at all"
      - "@Cacheable (JPA) marks eligibility; @Cache (Hibernate) adds usage/region/include"
    answer: 3
    explanation: |
      Under ENABLE_SELECTIVE, JPA needs @Cacheable(true) to opt an entity in. Hibernate's
      @Cache is the richer annotation that sets the concurrency strategy (usage), region name,
      and include policy. @Cacheable is a boolean marker only.
    ref: "concepts.md#cacheable-vs-cache-precision"

  - id: caching-first-second-level-074
    difficulty: expert
    tags: [nonstrict, read-write, contrast, judgment]
    question: |
      For an entity that is read constantly but updated a few times per hour, and where a
      sub-second stale read right after an edit is acceptable, which strategy is the leanest
      correct choice — and why not the other?
    options:
      - "READ_ONLY, because updates are rare enough that the occasional modification can just be tolerated"
      - "NONSTRICT_READ_WRITE, because it avoids soft-lock overhead and the brief stale window is tolerated"
      - "TRANSACTIONAL, because it is the only strategy that can serve any read without a stale-data risk"
      - "READ_WRITE, because NONSTRICT_READ_WRITE is restricted to immutable entities and cannot cache mutable ones"
    answer: 1
    explanation: |
      NONSTRICT_READ_WRITE just evicts on write (no soft-lock overhead) and is designed for
      read-heavy data that tolerates a brief stale window. READ_ONLY is wrong because the
      entity IS updated (updates would throw); TRANSACTIONAL adds JTA overhead unnecessarily;
      READ_WRITE's soft-lock cost is not needed when the stale window is acceptable.
    ref: "concepts.md#read_write-internals-soft-locks-and-async-refresh"

  - id: caching-first-second-level-075
    difficulty: expert
    tags: [scenario, bulk-update, predict-sql, eviction]
    question: |
      Product is `@Cacheable` (READ_WRITE) and L2 is warm. In one flow you: (1) `find(Product,
      5L)` in Tx-A, (2) `find(Product, 5L)` again in a later Tx-B, (3) run
      `UPDATE Product p SET p.price = p.price * 1.1` as a bulk JPQL, then (4) `find(Product,
      5L)` in Tx-C — all with no explicit eviction. Which describes the result?
    options:
      - "Steps 1 and 4 both SELECT while steps 2 and 3 are cache hits, because a bulk UPDATE is itself served from the warm L2 entry"
      - "Step 1 SELECTs (warms L2); step 2 is an L2 hit; step 4 returns the STALE cached price because bulk JPQL bypassed L2 invalidation"
      - "All four steps issue a SELECT, because any bulk JPQL UPDATE flushes and clears the entire second-level cache region before running"
      - "Step 4 SELECTs fresh data, because bulk JPQL detects the touched primary keys and automatically evicts exactly those entries from L2"
    answer: 1
    explanation: |
      Step 1 loads from L2 (or DB) and step 2 is a straightforward L2 hit. The bulk JPQL
      UPDATE writes rows directly without going through the per-entity lifecycle, so L2 is not
      invalidated; step 4 therefore returns the stale cached price. The fix is an explicit
      getCache().evict(Product.class) (or a targeted evict) after the bulk operation.
    ref: "concepts.md#managing-the-cache-programmatically"
