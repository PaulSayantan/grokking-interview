topic: "Querying: JPQL, HQL, Criteria API & Native SQL"
domain: hibernate-jpa
topic_slug: querying-jpql-hql-criteria-native
version: 1
questions:
  - id: querying-jpql-hql-criteria-native-001
    difficulty: beginner
    tags:
      - jpql
      - fundamentals
    question: |
      What does a JPQL query operate against?
    options:
      - Database tables and their columns, referenced directly by name
      - The raw JDBC ResultSet rows returned by the driver
      - Entity classes and their persistent fields/associations
      - Only stored procedures registered in the database catalog
    answer: 2
    explanation: |
      JPQL (Jakarta Persistence Query Language) is object-oriented: you name entity
      classes and their fields/associations, never tables or columns. The provider
      translates the query to dialect SQL against the mapped schema, which is what
      makes JPQL portable across databases.
    ref: concepts.md#jpql-querying-objects-not-tables
  - id: querying-jpql-hql-criteria-native-002
    difficulty: beginner
    tags:
      - jpql
      - portability
    question: |
      Why is JPQL considered portable across different database vendors?
    options:
      - It targets the object/entity model, and the provider generates dialect-specific SQL from it
      - It ships the identical literal SQL string to every database engine unchanged
      - It only works against embedded in-memory databases like H2 or HSQLDB
      - The JDBC driver transparently rewrites the SQL for each vendor at runtime
    answer: 0
    explanation: |
      JPQL is expressed in terms of entities and fields. Hibernate parses it into its
      Semantic Query Model (SQM) and then emits SQL for the configured dialect. The same
      JPQL runs everywhere; only the generated SQL differs per database.
    ref: concepts.md#jpql-querying-objects-not-tables
  - id: querying-jpql-hql-criteria-native-003
    difficulty: intermediate
    tags:
      - jpql
      - managed-entities
      - persistence-context
    question: |
      A query `SELECT a FROM Author a` returns Author objects. What is their state?
    options:
      - Detached — they are not tracked by the EntityManager
      - Transient — they have no database identity
      - Removed — they are scheduled for deletion
      - Managed — they enter the persistence context and are dirty-checked
    answer: 3
    explanation: |
      A JPQL query that selects entities returns MANAGED entities: they are placed in the
      persistence context (L1 cache) and included in dirty checking. Mutating one and
      committing will trigger an UPDATE, even though you never called a save method.
    ref: concepts.md#scalar-vs-entity-results-and-managed-state
  - id: querying-jpql-hql-criteria-native-004
    difficulty: intermediate
    tags:
      - hql
      - jpql
      - superset
    question: |
      What is the relationship between HQL and JPQL in modern Hibernate 6/7?
    options:
      - They are unrelated languages compiled by entirely separate, incompatible parsers
      - HQL is a strict superset of JPQL — every JPQL query is valid HQL, plus Hibernate extras
      - JPQL is a strict superset of HQL, adding features HQL's grammar cannot express
      - HQL was removed in Hibernate 6 and fully replaced by the standard JPQL grammar
    answer: 1
    explanation: |
      HQL is Hibernate's native query language and a strict superset of JPQL. In Hibernate
      6/7 both go through the same SQM-based parser. HQL adds features the spec does not
      require, such as INSERT ... VALUES, the WITH join clause, and extra functions.
    ref: concepts.md#hql-hibernates-superset-of-jpql
  - id: querying-jpql-hql-criteria-native-005
    difficulty: advanced
    tags:
      - hql
      - jpql
      - insert
    question: |
      Which statement about INSERT support in JPQL versus HQL is correct?
    options:
      - HQL supports INSERT (both ... SELECT and ... VALUES); standard JPQL defines no INSERT statement at all
      - Standard JPQL supports INSERT ... SELECT but not INSERT ... VALUES
      - Both JPQL and HQL fully support INSERT ... VALUES
      - Neither JPQL nor HQL can execute any INSERT
    answer: 0
    explanation: |
      Standard JPQL defines only SELECT, UPDATE, and DELETE — it has NO INSERT statement.
      INSERT is a Hibernate HQL extension: HQL supports INSERT ... SELECT and, since
      Hibernate 6.1, INSERT ... VALUES with literal rows. Both run via executeUpdate().
    ref: concepts.md#hql-hibernates-superset-of-jpql
  - id: querying-jpql-hql-criteria-native-006
    difficulty: intermediate
    tags:
      - criteria
      - use-case
    question: |
      For which scenario is the Criteria API the best fit?
    options:
      - A single fixed query whose exact text is reused unchanged everywhere in the app
      - Bulk-deleting millions of rows in one statement as fast as the database allows
      - Dynamic queries whose set of filters/sorts is only known at runtime
      - Invoking a vendor-specific stored procedure that returns a REF_CURSOR
    answer: 2
    explanation: |
      The Criteria API builds queries programmatically, so it excels at DYNAMIC queries —
      search screens where predicates are added conditionally based on which filters the
      user supplied. For static queries a one-line JPQL string is clearer and less verbose.
    ref: concepts.md#the-criteria-api--the-jpa-metamodel
  - id: querying-jpql-hql-criteria-native-007
    difficulty: advanced
    tags:
      - criteria
      - metamodel
      - type-safety
    question: |
      What is the purpose of the JPA static metamodel (e.g. the generated `Author_` class)?
    options:
      - It caches query result sets between transactions to speed up repeated Criteria calls
      - It provides type-safe references to entity attributes (e.g. Author_.name) for Criteria queries
      - It holds the second-level cache region configuration for each mapped entity type
      - It generates the database schema DDL from the entity attributes at build time
    answer: 1
    explanation: |
      The static metamodel classes (suffixed with an underscore, generated by
      hibernate-jpamodelgen at compile time) let Criteria queries reference attributes as
      Author_.name instead of the string "name". This makes queries type-safe and
      refactor-safe: renaming a field breaks compilation rather than failing at runtime.
    ref: concepts.md#the-criteria-api--the-jpa-metamodel
  - id: querying-jpql-hql-criteria-native-008
    difficulty: intermediate
    tags:
      - criteria
      - trade-offs
    question: |
      Which is a genuine drawback of the Criteria API compared to a JPQL string?
    options:
      - It is vulnerable to injection because it concatenates raw user input into the query
      - It cannot express joins between entities, so associations must be queried separately
      - It cannot be executed by the EntityManager without first stringifying it to JPQL
      - It is verbose and harder to read, especially for static queries
    answer: 3
    explanation: |
      Criteria queries are verbose — a simple query becomes many lines of builder calls.
      For static queries a JPQL string reads far better. Criteria is NOT injection-prone
      (it is always parameterized) and it fully supports joins.
    ref: concepts.md#the-criteria-api--the-jpa-metamodel
  - id: querying-jpql-hql-criteria-native-009
    difficulty: intermediate
    tags:
      - native-sql
      - when-to-use
    question: |
      When is a native SQL query the appropriate choice over JPQL?
    options:
      - Whenever you want queries that stay portable across every database vendor
      - For every read query in the app, because native SQL is always faster than JPQL
      - When you need vendor-specific SQL, hints, or constructs JPQL cannot express (e.g. recursive CTEs)
      - Only for INSERT statements, since JPQL cannot express any INSERT at all
    answer: 2
    explanation: |
      Native SQL is the escape hatch for database-specific features JPQL/HQL cannot
      express: vendor functions, optimizer hints, recursive CTEs, or a hand-tuned query.
      The cost is loss of portability and bypassing SQM, so prefer JPQL/HQL first.
    ref: concepts.md#native-sql-queries--result-mapping
  - id: querying-jpql-hql-criteria-native-010
    difficulty: advanced
    tags:
      - native-sql
      - result-mapping
    question: |
      Which annotation maps a native query's result set to a complex shape such as a DTO
      built via a constructor?
    options:
      - "@SqlResultSetMapping with @ConstructorResult"
      - "@ResultMapping with a target constructor reference on the native query"
      - "@NativeResult declaring the DTO class and its ordered column list"
      - "@ColumnMapping binding each result column to a constructor argument"
    answer: 0
    explanation: |
      @SqlResultSetMapping defines how native-query columns map to entities, scalars, or
      DTOs. @ConstructorResult inside it invokes a target class constructor with
      @ColumnResult-mapped columns — the standard way to project native SQL into a DTO.
    ref: concepts.md#native-sql-queries--result-mapping
  - id: querying-jpql-hql-criteria-native-011
    difficulty: intermediate
    tags:
      - native-sql
      - entity-results
    question: |
      `em.createNativeQuery("SELECT * FROM author WHERE id = ?1", Author.class)` returns
      Author objects. What state are they in?
    options:
      - Detached — native queries never register their results in the persistence context
      - Transient — they carry no database identity despite being loaded from a row
      - They come back as raw Object[] arrays regardless of the entity class argument passed
      - Managed — they are placed in the persistence context just like a JPQL entity result
    answer: 3
    explanation: |
      When you pass an entity class to createNativeQuery, the mapped rows become MANAGED
      entities in the persistence context, exactly like a JPQL entity result. Only when
      you omit the class (scalar native query) do you get unmanaged Object[]/values.
    ref: concepts.md#native-sql-queries--result-mapping
  - id: querying-jpql-hql-criteria-native-012
    difficulty: beginner
    tags:
      - named-queries
      - startup-validation
    question: |
      What is a key advantage of a `@NamedQuery` (JPQL) over an inline `em.createQuery(...)`
      string?
    options:
      - It executes outside any transaction, so no transaction boundary is required
      - It is parsed and validated at startup, so syntax/field errors fail fast
      - It automatically caches every result it returns in the second-level cache forever
      - It bypasses the persistence context, avoiding all dirty-checking overhead
    answer: 1
    explanation: |
      Named JPQL queries are parsed and validated when the persistence unit is built (at
      startup). A typo or reference to a non-existent field fails fast at boot rather than
      at runtime. They can also be precompiled/reused and centralize the query text.
    ref: concepts.md#named-queries-namedquery--namednativequery
  - id: querying-jpql-hql-criteria-native-013
    difficulty: advanced
    tags:
      - named-queries
      - native
      - validation
    question: |
      Why is the startup validation of a `@NamedNativeQuery` weaker than that of a JPQL
      `@NamedQuery`?
    options:
      - Native queries are never validated at any point, not even for basic syntax
      - Named native queries are only validated when the app runs in a production profile
      - Hibernate cannot semantically check raw SQL against the entity model — it is just a string
      - JPQL named queries are validated lazily at runtime, while native ones are validated at startup
    answer: 2
    explanation: |
      A JPQL named query can be parsed against the entity model at startup (fields, types,
      associations are known). A native query is opaque SQL text that Hibernate cannot
      semantically validate against the model, so its startup check is limited compared to
      a JPQL named query.
    ref: concepts.md#named-queries-namedquery--namednativequery
  - id: querying-jpql-hql-criteria-native-014
    difficulty: beginner
    tags:
      - parameters
      - binding
      - injection
    question: |
      What is the correct way to pass a user-supplied name into a JPQL query?
    options:
      - "Use a bound parameter: \"... WHERE a.name = :name\" with setParameter(\"name\", name)"
      - "Concatenate it into the query string: \"... WHERE a.name = '\" + name + \"'\""
      - URL-encode the value and append it to the query text so quotes are neutralized
      - Manually escape embedded quotes in the value and concatenate the result into the query
    answer: 0
    explanation: |
      Always use bound parameters (named :name or positional ?1). The value is sent to the
      database separately from the query text, so it can never be interpreted as query
      syntax. Concatenating user input is textbook JPQL/SQL injection.
    ref: concepts.md#parameter-binding-named-vs-positional-and-injection
  - id: querying-jpql-hql-criteria-native-015
    difficulty: intermediate
    tags:
      - parameters
      - positional
    question: |
      In JPQL, positional parameters use the syntax `?1`, `?2`. What is their base index?
    options:
      - 0-based (?0 is the first parameter)
      - 1-based (?1 is the first parameter)
      - They can be either, depending on the dialect
      - There are no positional parameters in JPQL
    answer: 1
    explanation: |
      JPQL positional parameters are 1-based: ?1 is the first parameter, bound with
      setParameter(1, value). This is a common gotcha for developers used to 0-based
      indexing. Named parameters (:name) avoid the ambiguity entirely.
    ref: concepts.md#parameter-binding-named-vs-positional-and-injection
  - id: querying-jpql-hql-criteria-native-016
    difficulty: intermediate
    tags:
      - parameters
      - security
      - plan-cache
    question: |
      Besides preventing injection, what performance benefit do bound parameters provide?
    options:
      - They compress the network payload so bind values travel to the database faster
      - They let the optimizer skip evaluating the WHERE clause on already-cached rows
      - They force a full table scan so every call returns perfectly consistent results
      - They let the database reuse the prepared-statement plan cache across calls with different values
    answer: 3
    explanation: |
      With bound parameters the SQL text is identical across invocations (only the bind
      values change), so the database can reuse its cached execution plan. String
      concatenation produces a distinct SQL string every time, defeating the plan cache.
    ref: concepts.md#parameter-binding-named-vs-positional-and-injection
  - id: querying-jpql-hql-criteria-native-017
    difficulty: intermediate
    tags:
      - projections
      - dto
      - constructor-expression
    question: |
      What does `SELECT new com.example.AuthorDto(a.name, a.email) FROM Author a` return?
    options:
      - Unmanaged AuthorDto objects built via a matching constructor — no dirty-check overhead
      - Managed AuthorDto entities tracked and dirty-checked by the persistence context
      - A List<Object[]> of raw column values that you must index and cast to AuthorDto manually
      - A single scalar value concatenating the selected name and email into one string
    answer: 0
    explanation: |
      A constructor expression returns plain, UNMANAGED DTOs constructed with the given
      arguments. They are not in the persistence context, carry no dirty-check overhead,
      and contain exactly the columns you selected — ideal for read-only screens.
    ref: concepts.md#projections-scalar-constructor-expressions-tuple--interface
  - id: querying-jpql-hql-criteria-native-018
    difficulty: advanced
    tags:
      - projections
      - constructor-expression
      - gotcha
    question: |
      Which of these is ILLEGAL in a JPQL constructor expression `SELECT new Dto(...)`?
    options:
      - Passing scalar fields like a.name and a.email
      - Passing a computed value like count(a)
      - Passing a collection association such as a.books
      - Passing a path expression a.address.city
    answer: 2
    explanation: |
      Constructor expressions accept scalars and path expressions (and aggregates), but you
      cannot pass a collection association such as a.books — you can only project
      scalar/single-valued arguments into the constructor.
    ref: concepts.md#projections-scalar-constructor-expressions-tuple--interface
  - id: querying-jpql-hql-criteria-native-019
    difficulty: intermediate
    tags:
      - projections
      - performance
      - read-only
    question: |
      Why is projecting to a DTO preferable to loading full entities for a read-only report
      screen?
    options:
      - DTOs are automatically stored in the second-level cache and reused across sessions
      - DTOs re-check every not-null and unique constraint before the rows are returned
      - Managed entities cannot be read at all once their transaction has committed
      - DTOs fetch fewer columns, skip entity hydration, and are unmanaged (no dirty-check overhead)
    answer: 3
    explanation: |
      A DTO projection selects only the columns you need, skips entity hydration, and
      returns unmanaged objects that never participate in dirty checking. For read-only
      data this is faster and avoids accidental writes from mutating a managed entity.
    ref: concepts.md#projections-scalar-constructor-expressions-tuple--interface
  - id: querying-jpql-hql-criteria-native-020
    difficulty: intermediate
    tags:
      - projections
      - tuple
      - scalar
    question: |
      A query `SELECT a.name, a.email FROM Author a` executed with `getResultList()`
      (untyped) returns what by default?
    options:
      - List<Author>, one fully managed entity returned per selected row
      - List<Object[]>, where each row is an array of the selected values
      - A single String concatenating the name and email with a comma
      - List<Tuple> automatically, keyed by each selected column alias
    answer: 1
    explanation: |
      Selecting multiple scalar expressions without a DTO or Tuple type yields
      List<Object[]>, each array holding the selected values in order. You can instead
      request Tuple.class to access values by alias, or use a constructor expression for a DTO.
    ref: concepts.md#projections-scalar-constructor-expressions-tuple--interface
  - id: querying-jpql-hql-criteria-native-021
    difficulty: advanced
    tags:
      - join-fetch
      - n-plus-one
    question: |
      You load 100 authors and then loop calling `author.getBooks()` on a LAZY collection.
      Which query rewrite eliminates the resulting N+1 selects?
    options:
      - SELECT a FROM Author a JOIN a.books b (plain join, no FETCH)
      - Marking the books collection EAGER in the entity mapping
      - Adding setMaxResults(1) to the original author query
      - SELECT DISTINCT a FROM Author a JOIN FETCH a.books
    answer: 3
    explanation: |
      JOIN FETCH initializes the collection in the same query, collapsing N+1 into one
      SELECT. A plain JOIN (no FETCH) only filters and does NOT initialize the collection,
      so the lazy loads still fire. Making the mapping EAGER just moves the N+1 to every
      load path. DISTINCT de-duplicates the parent rows a to-many join produces.
    ref: concepts.md#fetching-in-queries-join-fetch-vs-entity-graphs
  - id: querying-jpql-hql-criteria-native-022
    difficulty: intermediate
    tags:
      - join-fetch
      - plain-join
    question: |
      What is the difference between `JOIN a.books` and `JOIN FETCH a.books` in JPQL?
    options:
      - Plain JOIN affects filtering only; JOIN FETCH also initializes the association in the same query
      - Nothing — they are exact synonyms that compile to identical SQL
      - JOIN FETCH is invalid JPQL and is accepted only by native HQL queries
      - Plain JOIN loads the collection eagerly; JOIN FETCH keeps it lazy
    answer: 0
    explanation: |
      A plain JOIN participates in the WHERE/filtering but leaves the association lazy
      (accessing it later triggers separate selects). JOIN FETCH additionally initializes
      the association as part of the same SQL query, avoiding N+1.
    ref: concepts.md#fetching-in-queries-join-fetch-vs-entity-graphs
  - id: querying-jpql-hql-criteria-native-023
    difficulty: advanced
    tags:
      - join-fetch
      - cartesian-product
      - multiplebagfetch
    question: |
      What happens if you try to `JOIN FETCH` two separate collection associations in one
      query (e.g. `JOIN FETCH a.books JOIN FETCH a.awards`, both List/bags)?
    options:
      - Hibernate silently picks the first collection and ignores the second
      - It is the officially recommended way to eliminate N+1 on two collections
      - It produces a Cartesian product and throws MultipleBagFetchException for bags
      - It works fine and Hibernate de-duplicates the Cartesian rows for you
    answer: 2
    explanation: |
      Fetching two collections in one query multiplies their rows into a Cartesian product;
      for List/bag collections Hibernate throws MultipleBagFetchException. Fetch one
      collection per query and use batch fetching or separate queries for the others.
    ref: concepts.md#fetching-in-queries-join-fetch-vs-entity-graphs
  - id: querying-jpql-hql-criteria-native-024
    difficulty: advanced
    tags:
      - entity-graph
      - fetching
    question: |
      What does `@EntityGraph` let you do that a plain mapping fetch type cannot?
    options:
      - Permanently rewrite a mapping's fetch type from LAZY to EAGER at the class level
      - Declaratively specify which associations to fetch for a specific query/find, without editing the query text
      - Disable the persistence context so loaded entities are never dirty-checked
      - Force every query in the persistence unit to be issued as native SQL
    answer: 1
    explanation: |
      An entity graph declares a fetch plan (which associations to eagerly load) that you
      attach to a find or query as a hint. It gives per-use-case control over fetching
      without baking EAGER into the mapping or rewriting the query with JOIN FETCH.
    ref: concepts.md#fetching-in-queries-join-fetch-vs-entity-graphs
  - id: querying-jpql-hql-criteria-native-025
    difficulty: expert
    tags:
      - pagination
      - join-fetch
      - hhh000104
    question: |
      You run `SELECT a FROM Author a JOIN FETCH a.books` with `setMaxResults(10)`.
      Hibernate logs `HHH000104: firstResult/maxResults specified with collection fetch;
      applying in memory`. Why?
    options:
      - One parent maps to many joined child rows, so a SQL LIMIT would truncate a parent's children; Hibernate loads all rows and paginates in memory
      - The configured database dialect emits no LIMIT clause for this query
      - JOIN FETCH is not allowed with pagination and the query fails
      - The entity is missing the @Version column that paging requires
    answer: 0
    explanation: |
      With a to-many JOIN FETCH, each parent yields multiple joined rows. A SQL LIMIT
      applied to those rows could cut off a parent's children mid-collection, corrupting
      results. Hibernate refuses to do that, so it fetches the whole result set and
      paginates in memory — an OOM risk on large tables — and warns via HHH000104.
    ref: concepts.md#pagination--the-join-fetch-collection-trap-hhh000104
  - id: querying-jpql-hql-criteria-native-026
    difficulty: expert
    tags:
      - pagination
      - join-fetch
      - fix
    question: |
      What is the recommended fix for paginating a query that must also fetch a collection?
    options:
      - Increase the JVM heap so the in-memory pagination does not OOM
      - Add DISTINCT and it paginates correctly with a real SQL LIMIT
      - Switch the fetched collection to EAGER on the mapping
      - Page over the root entity IDs first (real SQL LIMIT), then run a second query WHERE id IN :ids JOIN FETCH the collection
    answer: 3
    explanation: |
      The two-query approach pages the root IDs with a normal SQL LIMIT (no fetch, correct
      cardinality), then loads the full collection only for that page via WHERE id IN :ids
      JOIN FETCH. Batch fetching (@BatchSize) is another valid approach. DISTINCT and EAGER
      do not solve the in-memory pagination problem.
    ref: concepts.md#pagination--the-join-fetch-collection-trap-hhh000104
  - id: querying-jpql-hql-criteria-native-027
    difficulty: intermediate
    tags:
      - pagination
      - api
    question: |
      Which pair of Query methods implements pagination in JPA?
    options:
      - setOffset() and setLimit()
      - setFirstResult() and setMaxResults()
      - skip() and take()
      - page() and size()
    answer: 1
    explanation: |
      setFirstResult(int) sets the 0-based offset of the first row and setMaxResults(int)
      caps the number of rows. Hibernate translates them into dialect-specific SQL
      (LIMIT/OFFSET, FETCH FIRST ... ROWS ONLY, Oracle ROWNUM/OFFSET, etc.).
    ref: concepts.md#pagination--the-join-fetch-collection-trap-hhh000104
  - id: querying-jpql-hql-criteria-native-028
    difficulty: advanced
    tags:
      - pagination
      - to-one
      - safe
    question: |
      Why does paginating a query that `JOIN FETCH`es a to-ONE association (e.g.
      `JOIN FETCH b.author`) work fine with `setMaxResults`, unlike a collection fetch?
    options:
      - To-one fetch joins are always served from the second-level cache
      - Hibernate silently ignores the fetch clause for to-one associations
      - The cardinality is 1:1, so each root produces exactly one row and SQL LIMIT slices rows correctly
      - To-one associations are never lazy, so no cursor is needed
    answer: 2
    explanation: |
      A to-one JOIN FETCH does not multiply rows (one root = one row), so a SQL LIMIT maps
      cleanly to the number of roots. There is no risk of truncating a collection, so
      pagination is applied in SQL and HHH000104 does not occur.
    ref: concepts.md#pagination--the-join-fetch-collection-trap-hhh000104
  - id: querying-jpql-hql-criteria-native-029
    difficulty: advanced
    tags:
      - bulk-dml
      - executeupdate
      - persistence-context
    question: |
      A bulk `UPDATE Author a SET a.active = false WHERE ...` is run via `executeUpdate()`.
      An Author was already loaded in the same persistence context. What is true?
    options:
      - The loaded Author's active field is automatically updated to false in memory
      - The bulk update refuses to run while any matching entity is still managed
      - The loaded Author is automatically detached from the context by the bulk update
      - The bulk update bypasses the persistence context, so the loaded Author holds stale state until you clear/refresh
    answer: 3
    explanation: |
      Bulk update/delete runs SQL directly against the database and does NOT synchronize the
      persistence context or L1 cache. Already-loaded entities keep their old values. You
      should flush pending changes first, run the bulk DML, then em.clear() so later reads
      reload fresh state.
    ref: concepts.md#bulk-update--delete-executeupdate--the-persistence-context
  - id: querying-jpql-hql-criteria-native-030
    difficulty: advanced
    tags:
      - bulk-dml
      - cascade
      - callbacks
      - version
    question: |
      Which of the following does a JPQL bulk UPDATE/DELETE NOT do automatically?
    options:
      - Cascade to associations, fire @PreUpdate callbacks, and bump @Version
      - Run as a single SQL statement issued directly against the database
      - Return the count of rows affected by the statement as an int
      - Execute inside the caller's current transaction boundary
    answer: 0
    explanation: |
      Bulk DML is a direct SQL statement: it does not cascade, does not fire entity
      lifecycle callbacks, and does not increment @Version unless you set it explicitly in
      the query. It does run in the current transaction and returns the affected-row count.
    ref: concepts.md#bulk-update--delete-executeupdate--the-persistence-context
  - id: querying-jpql-hql-criteria-native-031
    difficulty: expert
    tags:
      - bulk-dml
      - clear
      - best-practice
    question: |
      What is the correct pattern around a bulk update that touches entities you may read
      later in the same persistence context?
    options:
      - Do nothing special; Hibernate synchronizes the context automatically after it
      - Detach every managed entity by hand before issuing the update statement
      - flush() any pending changes, run executeUpdate(), then clear() the EntityManager
      - Wrap the update in a read-only transaction so stale reads are prevented
    answer: 2
    explanation: |
      Flush first so pending in-memory changes are not lost or overwritten, run the bulk
      statement, then clear() to discard now-stale managed entities. Subsequent reads then
      reload the correct post-update state from the database.
    ref: concepts.md#bulk-update--delete-executeupdate--the-persistence-context
  - id: querying-jpql-hql-criteria-native-032
    difficulty: intermediate
    tags:
      - scalar-vs-entity
      - managed-state
    question: |
      Which query result is NOT placed in the persistence context (not managed)?
    options:
      - SELECT a FROM Author a
      - SELECT a.name, a.email FROM Author a (scalar projection)
      - createNativeQuery(sql, Author.class)
      - em.find(Author.class, id)
    answer: 1
    explanation: |
      A scalar/multi-column projection returns plain values (Object[]), which are not
      managed. Entity results from JPQL, entity-mapped native queries, and find() are all
      managed and dirty-checked.
    ref: concepts.md#scalar-vs-entity-results-and-managed-state
  - id: querying-jpql-hql-criteria-native-033
    difficulty: advanced
    tags:
      - native-sql
      - flush
      - cache
    question: |
      By default, why might Hibernate flush the entire persistence context before running a
      native SQL query?
    options:
      - Hibernate does not know which tables the raw SQL reads, so it flushes to keep the DB consistent with pending changes
      - Native queries always open and run inside a brand-new nested transaction
      - Native queries fully evict the second-level cache before executing
      - It is a long-standing bug that was finally fixed in Hibernate 6
    answer: 0
    explanation: |
      Because a native query is opaque SQL, Hibernate cannot tell which entities/tables it
      touches. To avoid the query reading stale data, it may flush the whole persistence
      context first. You can narrow this by declaring the synchronized entity classes/tables.
    ref: concepts.md#native-sql-queries--result-mapping
  - id: querying-jpql-hql-criteria-native-034
    difficulty: intermediate
    tags:
      - jpql
      - implicit-join
    question: |
      What does the JPQL `WHERE b.author.name = :n` (path navigation through an association)
      generate at the SQL level?
    options:
      - A separate query per author
      - A subquery that cannot be optimized
      - Nothing — path navigation is not allowed in WHERE
      - An implicit SQL join to the author table
    answer: 3
    explanation: |
      Navigating an association in a path expression (b.author.name) causes Hibernate to
      emit an implicit SQL join to the associated table. It is convenient but can hide the
      cost of joins, so being explicit with JOIN is often clearer for complex queries.
    ref: concepts.md#jpql-querying-objects-not-tables
  - id: querying-jpql-hql-criteria-native-035
    difficulty: advanced
    tags:
      - jpql
      - polymorphism
    question: |
      In JPQL, `SELECT p FROM Payment p` where Payment is a mapped inheritance hierarchy
      returns what?
    options:
      - Only concrete Payment instances, with every mapped subclass row excluded
      - A compile error, because a mapped supertype like Payment cannot be selected
      - All instances of Payment and its mapped subclasses (polymorphic query)
      - Only the subclass rows, silently excluding rows of the base Payment type
    answer: 2
    explanation: |
      JPQL is polymorphic: querying a base entity returns instances of it and all mapped
      subclasses. The generated SQL depends on the inheritance strategy (single table,
      joined, or table-per-class) — see the inheritance topic for details.
    ref: concepts.md#jpql-querying-objects-not-tables
  - id: querying-jpql-hql-criteria-native-036
    difficulty: intermediate
    tags:
      - sqm
      - hibernate-6
      - mechanism
    question: |
      In Hibernate 6/7, what intermediate representation does a JPQL/HQL query pass through
      before SQL is generated?
    options:
      - The JDBC driver's PreparedStatement cache keyed by the raw SQL text
      - The Semantic Query Model (SQM) — an AST of the query in terms of the entity model
      - The second-level cache region configured for the queried entity
      - The build-time bytecode enhancer applied to the entity classes
    answer: 1
    explanation: |
      Hibernate 6 introduced the Semantic Query Model (SQM): JPQL/HQL is parsed into an
      SQM abstract syntax tree expressed against the entity model, then translated to SQL
      for the target dialect. Both JPQL and HQL share this pipeline.
    ref: concepts.md#hql-hibernates-superset-of-jpql
  - id: querying-jpql-hql-criteria-native-037
    difficulty: intermediate
    tags:
      - distinct
      - join-fetch
      - hibernate-6
    question: |
      Why is `DISTINCT` commonly used with a to-many `JOIN FETCH` in JPQL?
    options:
      - To order the parent rows alphabetically before the collection join is applied
      - To force the query result to be cached in the shared second-level cache across sessions
      - To cap the number of child rows fetched per parent so the collection stays small
      - To de-duplicate the parent entities that the collection join multiplies into several rows
    answer: 3
    explanation: |
      A to-many join returns one row per child, so the same parent appears multiple times.
      DISTINCT collapses the duplicated parents. In Hibernate 6+ this de-duplication for
      entity queries is applied in memory and not necessarily pushed to the SQL DISTINCT.
    ref: concepts.md#fetching-in-queries-join-fetch-vs-entity-graphs
  - id: querying-jpql-hql-criteria-native-038
    difficulty: intermediate
    tags:
      - choosing
      - decision
    question: |
      You must build a search query where any of five filters may or may not be present at
      runtime, chosen by the user. Which approach is most appropriate?
    options:
      - Use the Criteria API to conditionally add predicates
      - Concatenate the JPQL string based on which filters are set
      - Write five separate named queries and pick one
      - Use a native query with all filters always applied
    answer: 0
    explanation: |
      Dynamic, optional filters are the Criteria API's sweet spot: build a list of
      Predicates, adding only the ones that apply, and combine them. Concatenating JPQL
      strings is error-prone and risks injection; five named queries do not scale to
      arbitrary filter combinations.
    ref: concepts.md#choosing-the-right-query-approach
  - id: querying-jpql-hql-criteria-native-039
    difficulty: beginner
    tags:
      - parameters
      - named
    question: |
      Which method binds a value to the named parameter `:name` in a query?
    options:
      - query.bind("name", value)
      - query.setParameter("name", value)
      - query.addParameter("name", value)
      - query.set("name", value)
    answer: 1
    explanation: |
      The Query interface uses setParameter(String name, Object value) for named parameters
      and setParameter(int position, Object value) for positional ones. Both send the value
      to the DB separately from the query text.
    ref: concepts.md#parameter-binding-named-vs-positional-and-injection
  - id: querying-jpql-hql-criteria-native-040
    difficulty: advanced
    tags:
      - criteria
      - root
      - mechanism
    question: |
      In the Criteria API, what does `Root<Author> root = cq.from(Author.class)` represent?
    options:
      - The pooled JDBC database connection that the CriteriaQuery will execute against
      - The materialized result list, pre-populated once the CriteriaQuery has been run
      - The query's FROM clause root — the entity being queried, from which you navigate paths and joins
      - A single fetched row of the result set, wrapped so its columns can be read by name
    answer: 2
    explanation: |
      A Root represents an entity in the FROM clause and is the starting point for path
      expressions (root.get(Author_.name)) and joins (root.join(Author_.books)). You build
      the query tree by combining the Root with the CriteriaBuilder's predicates and selections.
    ref: concepts.md#the-criteria-api--the-jpa-metamodel
  - id: querying-jpql-hql-criteria-native-041
    difficulty: intermediate
    tags:
      - native-sql
      - portability
      - trade-offs
    question: |
      Which is a real downside of using native SQL instead of JPQL?
    options:
      - It loses database portability and bypasses SQM, so Hibernate can't semantically optimize it
      - Native SQL cannot use bound parameters, forcing you to concatenate literal values into the text
      - It always returns unmanaged detached rows even when you explicitly pass an entity class argument
      - It cannot be defined as a named query, so every native statement must be built inline at runtime
    answer: 0
    explanation: |
      Native SQL ties you to a specific dialect and bypasses the Semantic Query Model, so
      Hibernate treats it as opaque text. It CAN use bound parameters, can map to managed
      entities, and can be a @NamedNativeQuery — those options are all available.
    ref: concepts.md#native-sql-queries--result-mapping
  - id: querying-jpql-hql-criteria-native-042
    difficulty: expert
    tags:
      - scenario
      - n-plus-one
      - projection
    question: |
      A dashboard needs each author's name and their total book count, read-only, for
      thousands of authors. Which query is best?
    options:
      - Load every Author entity while EAGER-fetching the books collection, then count each list in Java
      - Load the authors first, then call getBooks().size() inside a per-author loop to tally each count
      - SELECT a FROM Author a JOIN FETCH a.books with setMaxResults to page through the fetched authors
      - SELECT new AuthorSummary(a.name, count(b)) FROM Author a LEFT JOIN a.books b GROUP BY a.name
    answer: 3
    explanation: |
      A DTO projection with a GROUP BY aggregate computes the counts in the database and
      returns lightweight unmanaged objects — no N+1, no loading entire book collections,
      no dirty-check overhead. The other options either trigger N+1, drag whole
      collections into memory, or hit the HHH000104 in-memory pagination trap.
    ref: concepts.md#projections-scalar-constructor-expressions-tuple--interface
  - id: querying-jpql-hql-criteria-native-043
    difficulty: intermediate
    tags:
      - named-queries
      - definition
    question: |
      Which annotation defines a reusable JPQL query by name on an entity?
    options:
      - "@Query"
      - "@NamedNativeQuery"
      - "@NamedQuery"
      - "@SqlResultSetMapping"
    answer: 2
    explanation: |
      @NamedQuery holds a JPQL/HQL query referenced by name via createNamedQuery.
      @NamedNativeQuery holds native SQL. @Query is Spring Data's annotation (repository
      layer), and @SqlResultSetMapping maps native result sets — not query definitions.
    ref: concepts.md#named-queries-namedquery--namednativequery
  - id: querying-jpql-hql-criteria-native-044
    difficulty: advanced
    tags:
      - hql
      - with-clause
      - jpql
      - "on"
    question: |
      HQL offers a `WITH` clause on joins (e.g. `JOIN a.books b WITH b.price > 10`). What is
      the standard JPQL equivalent for adding an extra join condition?
    options:
      - The HAVING clause, which attaches the extra predicate directly to the join it filters
      - The ON clause (e.g. JOIN a.books b ON b.price > 10)
      - A nested correlated subquery in the FROM clause, since JPQL joins take no inline condition
      - There is no equivalent; JPQL cannot add join conditions
    answer: 1
    explanation: |
      JPQL added the ON clause to attach extra conditions to a join, mirroring HQL's WITH
      clause. Both restrict the join itself (as opposed to WHERE, which filters after the
      join, and can change outer-join semantics).
    ref: concepts.md#hql-hibernates-superset-of-jpql
  - id: querying-jpql-hql-criteria-native-045
    difficulty: intermediate
    tags:
      - jakarta
      - namespace
      - versions
    question: |
      In current Jakarta Persistence (3.1/3.2) and Hibernate 6/7, which package holds the
      Criteria API and query annotations like @NamedQuery?
    options:
      - javax.persistence.*
      - org.hibernate.query.*
      - java.sql.*
      - jakarta.persistence.*
    answer: 3
    explanation: |
      Since Jakarta EE 9 the namespace moved from javax.persistence.* to
      jakarta.persistence.*. Hibernate 6/7 use the jakarta.persistence.* namespace for the
      spec types (CriteriaBuilder, @NamedQuery, @SqlResultSetMapping, FetchType, etc.).
    ref: concepts.md#the-criteria-api--the-jpa-metamodel
  - id: querying-jpql-hql-criteria-native-046
    difficulty: advanced
    tags:
      - scenario
      - criteria
      - type-safety
    question: |
      A team wants queries that break at COMPILE time if someone renames an entity field.
      Which approach delivers that?
    options:
      - The Criteria API using the generated static metamodel (Author_.name)
      - JPQL strings validated at persistence-unit startup, which flags a renamed field before compile time
      - Native SQL referencing raw column names, which the compiler resolves against the entity attributes
      - Named native queries, whose field references are checked by the annotation processor at build time
    answer: 0
    explanation: |
      Only the Criteria API with the static metamodel gives compile-time safety: Author_.name
      is a real field reference, so renaming the entity attribute regenerates the metamodel
      and breaks compilation. JPQL/native strings are only checked at startup or runtime.
    ref: concepts.md#the-criteria-api--the-jpa-metamodel
  - id: querying-jpql-hql-criteria-native-047
    difficulty: expert
    tags:
      - scenario
      - bulk-dml
      - stale-cache
    question: |
      After running a bulk `DELETE FROM Order o WHERE o.status = 'CANCELLED'` via
      executeUpdate() in a long-running EntityManager, a later `em.find(Order.class, id)`
      for a cancelled order returns a non-null managed object. Why?
    options:
      - The bulk delete silently failed and rolled itself back because no rows matched the status filter
      - find() always re-checks the database and ignores pending deletes, so it reloaded the deleted row
      - The order was still in the L1 cache from earlier; bulk DML bypasses the persistence context, so find() returned the stale cached instance
      - The surrounding transaction was rolled back by the delete, restoring the cancelled order to the table
    answer: 2
    explanation: |
      Bulk DML runs SQL directly and does not evict entities from the persistence context.
      If that Order was already loaded, it remains in the L1 cache, and find() returns the
      cached (now stale) instance without hitting the DB. Calling em.clear() after the bulk
      delete prevents this.
    ref: concepts.md#bulk-update--delete-executeupdate--the-persistence-context
  - id: querying-jpql-hql-criteria-native-048
    difficulty: intermediate
    tags:
      - jpql
      - distinct-vs-plain-join
      - scenario
    question: |
      You write `SELECT a FROM Author a JOIN FETCH a.books` (no DISTINCT) and get more
      Author elements in the list than there are authors. What explains this?
    options:
      - A known bug in Hibernate's fetch-join handling that duplicates parent references in the result list
      - The to-many join returns one row per book, so each author appears once per book; add DISTINCT to de-duplicate
      - The books collection was accidentally fetched twice, doubling every parent element in the returned list
      - setMaxResults was applied incorrectly and multiplied the page size by the number of joined child rows
    answer: 1
    explanation: |
      A collection JOIN FETCH produces one SQL row per child, so an author with 3 books
      appears 3 times in the raw result. Adding DISTINCT collapses the duplicated parent
      references so the list contains each author once.
    ref: concepts.md#fetching-in-queries-join-fetch-vs-entity-graphs
  - id: querying-jpql-hql-criteria-native-049
    difficulty: advanced
    tags:
      - aggregates
      - group-by
      - having
    question: |
      In an aggregate JPQL query, what is the difference between the WHERE clause and the
      HAVING clause?
    options:
      - WHERE filters the aggregated groups after grouping; HAVING filters the individual rows beforehand
      - WHERE filters rows before grouping; HAVING filters aggregated groups after grouping
      - They are fully interchangeable and Hibernate rewrites one into the other during SQM translation
      - HAVING is only valid in native SQL statements and is rejected by the JPQL grammar at parse time
    answer: 1
    explanation: |
      WHERE is applied to rows before aggregation/grouping; HAVING filters the groups
      produced by GROUP BY (so it can reference aggregates like COUNT(b) > 5). Putting an
      aggregate condition in WHERE is illegal — it must go in HAVING.
    ref: concepts.md#aggregates-group-by--having
  - id: querying-jpql-hql-criteria-native-050
    difficulty: intermediate
    tags:
      - aggregates
      - return-types
    question: |
      What Java types do JPQL `COUNT(...)` and `AVG(...)` return?
    options:
      - COUNT returns Long, AVG returns Double
      - COUNT returns Integer, AVG returns Float, matching the operand's default numeric widths
      - Both COUNT and AVG return BigDecimal for lossless precision regardless of the operand type
      - Both COUNT and AVG return the operand's own declared type, mirroring how MIN and MAX behave
    answer: 0
    explanation: |
      COUNT returns Long and AVG returns Double per the spec. SUM returns
      Long/Double/BigDecimal/BigInteger depending on the operand, while MIN/MAX return the
      operand type. Declaring a DTO constructor argument as int for a COUNT causes a
      runtime type-mapping error.
    ref: concepts.md#aggregates-group-by--having
  - id: querying-jpql-hql-criteria-native-051
    difficulty: expert
    tags:
      - subqueries
      - exists
      - correlated
    question: |
      What best characterizes a correlated `EXISTS` subquery such as
      `WHERE EXISTS (SELECT b FROM Book b WHERE b.author = a AND b.price > 100)`?
    options:
      - It is evaluated exactly once and its result cached, completely independent of each outer row
      - It is illegal JPQL because subqueries are permitted only in the FROM clause, never inside WHERE
      - The subquery references the outer row (a) and is conceptually evaluated per outer row, short-circuiting on the first match
      - It always fully materializes the entire subquery result set into memory before the outer query runs
    answer: 2
    explanation: |
      EXISTS here is correlated: it references the outer alias `a`, so it is logically
      evaluated relative to each outer row and short-circuits on the first matching child.
      An uncorrelated `IN (subquery)` instead materializes the subquery's value set. Both
      are portable JPQL and legal in WHERE.
    ref: concepts.md#subqueries-exists--quantifiers
  - id: querying-jpql-hql-criteria-native-052
    difficulty: advanced
    tags:
      - subqueries
      - member-of
      - collections
    question: |
      What does the JPQL operator `:book MEMBER OF a.books` test?
    options:
      - Whether the enclosed subquery over the books table returns at least one matching row
      - Whether the a.books association handle itself is null rather than an initialized collection
      - Whether :book compares greater than every element currently held in the author's books
      - Whether the :book entity is an element of the author's mapped books collection
    answer: 3
    explanation: |
      MEMBER OF tests membership of a value in a mapped collection association — here,
      whether :book is one of a.books. It operates on the collection, not a subquery
      result. IS EMPTY / IS NOT EMPTY test collection emptiness; NOT MEMBER OF is its
      negation.
    ref: concepts.md#subqueries-exists--quantifiers
  - id: querying-jpql-hql-criteria-native-053
    difficulty: advanced
    tags:
      - subqueries
      - spec
      - hibernate-6
    question: |
      Per the standard JPA spec, where are subqueries legal in JPQL — and how does
      Hibernate 6 differ?
    options:
      - Spec JPQL allows subqueries only in WHERE and HAVING; Hibernate 6 relaxes this to also allow them in SELECT and FROM (including lateral joins)
      - Spec JPQL allows subqueries in any clause; Hibernate 6 tightens this to permit them only inside WHERE
      - Subqueries are illegal in both spec JPQL and Hibernate 6, which force you to rewrite them as explicit joins
      - Only Hibernate 6 supports subqueries at all; standard spec JPQL has no subquery grammar whatsoever
    answer: 0
    explanation: |
      Standard JPQL permits subqueries only in WHERE and HAVING. Hibernate 6 (HQL) relaxes
      this, allowing subqueries in the SELECT list and in the FROM clause, including
      lateral joins — a Hibernate extension beyond the spec.
    ref: concepts.md#subqueries-exists--quantifiers
  - id: querying-jpql-hql-criteria-native-054
    difficulty: advanced
    tags:
      - treat
      - inheritance
      - downcast
    question: |
      In an inheritance hierarchy, what does `TREAT(p AS CreditCardPayment)` do in a JPQL
      query over `Payment p`?
    options:
      - Downcasts the supertype reference to the subtype so subtype-only fields can be referenced (in SELECT/WHERE/FROM)
      - Casts the selected entity result into a formatted String representation of its discriminator value
      - Filters the result set to exclude every mapped subclass, returning only base-type Payment instances
      - Converts the surrounding JPQL statement into an equivalent hand-tuned native SQL query at runtime
    answer: 0
    explanation: |
      TREAT is JPQL's polymorphic downcast: it narrows a supertype reference to a subtype so
      you can reference subtype-specific fields (e.g. cardNumber). It generates a join
      (JOINED strategy) or discriminator filter (SINGLE_TABLE). Hibernate 6 supports it in
      SELECT/FROM/WHERE (an old HB5.1 restriction limited it to WHERE).
    ref: concepts.md#treat-case--jpql-functions
  - id: querying-jpql-hql-criteria-native-055
    difficulty: expert
    tags:
      - case
      - order-by
      - scenario
    question: |
      You must sort authors so GOLD-tier ones come first, then alphabetically by name,
      using a single JPQL query. Which construct expresses the tier priority?
    options:
      - A native SQL query is the only option, since JPQL's ORDER BY accepts only bare persistent entity fields
      - A correlated subquery in the ORDER BY that counts each author's books and sorts by that returned count
      - A searched CASE expression in ORDER BY (e.g. ORDER BY CASE WHEN a.tier = 'GOLD' THEN 0 ELSE 1 END, a.name)
      - GROUP BY a.tier, which reorders the result so each tier's rows are emitted together in a contiguous block
    answer: 2
    explanation: |
      CASE expressions (simple and searched) are legal in SELECT, WHERE, and ORDER BY. A
      searched CASE mapping GOLD→0 and others→1 gives the computed sort priority, followed
      by a.name as the secondary key — all in portable JPQL, no native SQL needed.
    ref: concepts.md#treat-case--jpql-functions
  - id: querying-jpql-hql-criteria-native-056
    difficulty: advanced
    tags:
      - function
      - escape-hatch
      - portability
    question: |
      You need to call a PostgreSQL function like `date_part('year', ...)` from a query but
      want to keep managed-entity results and avoid native SQL. What does JPQL offer?
    options:
      - Nothing — any vendor-specific DB function forces you to drop to a native query and give up managed entities
      - The TREAT operator, which registers the database function against the entity metamodel so JPQL can invoke it
      - The FUNCTION('date_part', 'year', a.createdAt) escape hatch, which calls a DB function from portable JPQL
      - The "@SqlResultSetMapping" annotation, which whitelists the vendor function so the JPQL parser accepts its name
    answer: 2
    explanation: |
      FUNCTION('native_fn', args) (JPA 2.1+) is the portable escape hatch: it invokes a
      database function from within JPQL/HQL while still returning managed entities and
      staying in the persistence context. You only drop to native SQL when the whole query
      shape can't be expressed portably.
    ref: concepts.md#treat-case--jpql-functions
  - id: querying-jpql-hql-criteria-native-057
    difficulty: expert
    tags:
      - size
      - subquery
      - performance
    question: |
      What SQL does `SELECT a.name, SIZE(a.books) FROM Author a` tend to generate for the
      SIZE expression?
    options:
      - A LEFT JOIN to the book table with a GROUP BY a.id and a COUNT(b.id) in the projection list
      - A second round-trip query per author (N+1), one COUNT statement issued lazily as each row is read
      - Nothing — SIZE eagerly loads every author's full books collection and counts it in Java after fetching
      - A correlated subquery counting the author's books, e.g. (select count(*) from book b where b.author_id = a.id)
    answer: 3
    explanation: |
      SIZE(a.books) is translated into a correlated subquery that counts the child rows for
      each author — not a join and GROUP BY. Placed in a SELECT list it can fire a
      correlated subselect per row, so for many rows an explicit JOIN ... GROUP BY COUNT is
      often cheaper.
    ref: concepts.md#collection--map-operators-size-key-value-entry-index
  - id: querying-jpql-hql-criteria-native-058
    difficulty: intermediate
    tags:
      - map
      - key
      - value
    question: |
      For a `Map`-valued association (`@MapKey` phones), which JPQL operators extract the
      map key and the map value respectively?
    options:
      - INDEX() for the map key and ELEMENT() for the value it is associated with in the map
      - MEMBER() for the key and OF() for the value stored under it in the mapped association
      - KEY() and VALUE()
      - FIRST() for the lowest-ordered key and LAST() for the value under the highest-ordered key
    answer: 2
    explanation: |
      KEY(m) yields the map key, VALUE(m) the value, and ENTRY(m) a Map.Entry. You can also
      filter on them, e.g. WHERE KEY(phones) = 'MOBILE'. INDEX() is for the position of an
      element in an ordered List mapped with @OrderColumn.
    ref: concepts.md#collection--map-operators-size-key-value-entry-index
  - id: querying-jpql-hql-criteria-native-059
    difficulty: expert
    tags:
      - single-result
      - exceptions
      - transactions
    question: |
      A method does `try { return q.getSingleResult(); } catch (NoResultException e) { return null; }`.
      Beyond returning null, what subtle risk does this pattern carry?
    options:
      - Throwing a PersistenceException can mark the current transaction for rollback, so catching it for control flow may leave a rollback-only transaction
      - getSingleResult never actually throws NoResultException, so the catch block is dead code that the compiler quietly optimizes away
      - It silently swallows NonUniqueResultException too, returning the first of the matching rows instead of surfacing the ambiguity
      - It forces a full table scan because getSingleResult disables the query plan cache and index usage for that call
    answer: 0
    explanation: |
      getSingleResult throws NoResultException (0 rows) or NonUniqueResultException (>1),
      both unchecked PersistenceExceptions. A thrown PersistenceException can mark the
      transaction rollback-only, so using try/catch around it for normal control flow is an
      anti-pattern. JPA 3.2 / Hibernate 6 add getSingleResultOrNull() to avoid it.
    ref: concepts.md#getsingleresult-getsingleresultornull--result-streaming
  - id: querying-jpql-hql-criteria-native-060
    difficulty: advanced
    tags:
      - single-result
      - jpa-3-2
      - hibernate-6
    question: |
      What is the behavior of `getSingleResultOrNull()` (JPA 3.2 / Hibernate 6)?
    options:
      - Returns null for zero rows, the single result for one row, and still throws for more than one row
      - Returns null for any number of rows, including when exactly one result actually matches the query
      - Returns the first row when multiple match, silently ordering by primary key to pick a deterministic one
      - It is identical to getResultList().get(0), throwing IndexOutOfBoundsException when the list is empty
    answer: 0
    explanation: |
      getSingleResultOrNull() returns null when there are no rows (instead of throwing
      NoResultException) and the single result when exactly one matches. It still throws
      NonUniqueResultException when more than one row matches — it only removes the
      zero-row exception, letting you avoid try/catch for control flow.
    ref: concepts.md#getsingleresult-getsingleresultornull--result-streaming
  - id: querying-jpql-hql-criteria-native-061
    difficulty: expert
    tags:
      - streaming
      - scroll
      - lazy-init
    question: |
      A `@Transactional` method returns the `Stream<Author>` from `getResultStream()`, and
      the caller iterates it after the method returns. What happens?
    options:
      - It works fine because getResultStream() eagerly buffers every matching row into a detached list before returning
      - It silently returns an empty stream once the transactional method has committed and closed its session
      - It reopens the transaction automatically on first access, lazily attaching a fresh session to the live cursor
      - It throws (closed cursor / LazyInitializationException) because the cursor is only valid while the session/transaction is open
    answer: 3
    explanation: |
      getResultStream()/scroll() are backed by a live JDBC cursor that is only valid while
      the session and transaction are open. Returning the stream and consuming it after the
      transactional method commits/closes the session throws on the now-closed cursor (or a
      LazyInitializationException). Consume the stream inside the open transaction.
    ref: concepts.md#getsingleresult-getsingleresultornull--result-streaming
  - id: querying-jpql-hql-criteria-native-062
    difficulty: expert
    tags:
      - streaming
      - scenario
      - oom
    question: |
      You must process 10 million rows in a batch job without exhausting heap. Which
      approach is most appropriate?
    options:
      - getResultList() into a List and iterate it, relying on Hibernate to spill overflow rows to a temp file
      - Load all entities EAGER and process them in parallel streams so the JVM reclaims each row after processing
      - Increase the heap and use getResultList(), sizing the JVM so all ten million managed rows fit at once
      - getResultStream()/scroll() over a JDBC cursor inside an open transaction, closed in try-with-resources, with periodic flush()/clear() or a StatelessSession
    answer: 3
    explanation: |
      getResultList() materializes all rows at once — an OOM on 10M rows. Streaming/scrolling
      pulls rows via a forward-only cursor as consumed; you must run inside an open tx, close
      the cursor (try-with-resources), and use a StatelessSession or periodic flush()/clear()
      so the persistence context doesn't grow unbounded.
    ref: concepts.md#getsingleresult-getsingleresultornull--result-streaming
  - id: querying-jpql-hql-criteria-native-063
    difficulty: advanced
    tags:
      - stored-procedures
      - parameter-mode
    question: |
      When calling a stored procedure that returns a value through an output parameter via
      StoredProcedureQuery, which ParameterMode do you register for it, and how do you read it?
    options:
      - Mode IN; the procedure writes the value back into that same bind, so read it from getResultList()
      - Mode OUT (or INOUT); after execute(), read it via getOutputParameterValue(name)
      - Mode REF_CURSOR always; supply an empty holder with setParameter() and the driver fills it in place
      - You cannot read output parameters in JPA; StoredProcedureQuery exposes only returned result-set rows
    answer: 1
    explanation: |
      Register the parameter with ParameterMode.OUT (or INOUT), call execute(), then read it
      with getOutputParameterValue(name-or-position). ParameterMode also includes IN and
      REF_CURSOR (for procedures returning a cursor/result set, common on Oracle/PostgreSQL).
    ref: concepts.md#stored-procedures
  - id: querying-jpql-hql-criteria-native-064
    difficulty: expert
    tags:
      - plan-cache
      - performance
      - dynamic-queries
    question: |
      A service builds JPQL by concatenating optional filters, producing a different query
      string almost every call. Under load, CPU spikes. What is the likely root cause?
    options:
      - Unique query text each call thrashes the query plan cache (default size 2048), forcing constant re-parsing/re-compilation to SQM
      - The second-level cache is disabled, so every filtered query re-hydrates entities from the database on each call
      - The connection pool is sized too large, so idle connections consume CPU spinning on health-check validation queries
      - Bound parameters slow down the optimizer by forcing it to re-plan the statement for each distinct value supplied
    answer: 0
    explanation: |
      Hibernate caches the parsed SQM plan per query string (hibernate.query.plan_cache_max_size,
      default 2048). Concatenated dynamic filters generate a distinct string each call, so
      the cache thrashes and every call re-parses/re-compiles — burning CPU. Build dynamic
      queries with Criteria/parameters so the text is stable.
    ref: concepts.md#query-plan-cache--in-clause-parameter-padding
  - id: querying-jpql-hql-criteria-native-065
    difficulty: expert
    tags:
      - plan-cache
      - in-clause
      - padding
    question: |
      What does `hibernate.query.in_clause_parameter_padding=true` accomplish for queries
      with variable-length `IN` lists?
    options:
      - It removes duplicate values from the IN list before binding, shrinking each list to its distinct elements
      - It converts the IN clause into a join against a session-scoped temporary table holding the bind values
      - It pads the bind-parameter count up to the next power of two, so many different IN-list lengths collapse into a few query shapes, reducing plan-cache and DB execution-plan entries
      - It caps the IN list at a fixed maximum length, splitting any longer list into several chained queries
    answer: 2
    explanation: |
      Padding rounds the number of IN bind parameters up to the next power of two (repeating
      the last value), so IN with 3, 4 params both become a 4-param query. Fewer distinct SQL
      shapes means fewer query-plan-cache entries and less pressure on the DB's own execution
      plan cache for variable-length IN queries.
    ref: concepts.md#query-plan-cache--in-clause-parameter-padding
  - id: querying-jpql-hql-criteria-native-066
    difficulty: advanced
    tags:
      - set-operations
      - hql
      - hibernate-6
    question: |
      Which set operations are first-class in HQL (Hibernate 6) that standard JPQL
      historically lacked?
    options:
      - JOIN, GROUP BY, and HAVING, none of which the standard JPQL grammar has ever supported
      - INSERT, UPDATE, and DELETE bulk statements, absent from standard JPQL's data-manipulation grammar
      - PIVOT and UNPIVOT crosstab operators for reshaping rows into columns within the query
      - UNION, INTERSECT, and EXCEPT (with optional ALL)
    answer: 3
    explanation: |
      Hibernate 6 makes UNION [ALL], INTERSECT [ALL], and EXCEPT [ALL] first-class in HQL.
      Standard JPQL historically had no set operations (JPA 3.2 begins adding some) — a
      classic 'what can HQL do that spec JPQL can't' answer.
    ref: concepts.md#set-operations-union-intersect-except
  - id: querying-jpql-hql-criteria-native-067
    difficulty: expert
    tags:
      - keyset
      - pagination
      - performance
      - scenario
    question: |
      A screen paginates with `ORDER BY created_at LIMIT 10 OFFSET 500000` and deep pages are
      slow. What is the correct fix?
    options:
      - Add a covering index on created_at and keep the OFFSET, letting the index alone satisfy the deep-page scan
      - Increase setMaxResults so fewer paged round-trips are needed to walk through the deep offsets
      - Keyset/seek pagination: WHERE (created_at, id) > (:lastCreated, :lastId) ORDER BY created_at, id LIMIT 10, on a stable unique indexed order
      - Cache the whole table in the second-level cache so deep pages are served from memory instead of the DB
    answer: 2
    explanation: |
      OFFSET 500000 forces the DB to scan and discard 500k rows to return 10. Keyset (seek)
      pagination filters on the last-seen sort key so it seeks directly via the index — a
      constant-cost deep page — and is stable under concurrent inserts. The sort key must be
      stable and unique (append the PK). Hibernate 6.5+ exposes Order/Page/KeyedPage.
    ref: concepts.md#keyset-seek-pagination
  - id: querying-jpql-hql-criteria-native-068
    difficulty: expert
    tags:
      - keyset
      - pagination
      - correctness
    question: |
      Why must the ORDER BY key used for keyset (seek) pagination be both stable and unique
      (e.g. include the primary key as a tiebreaker)?
    options:
      - Because otherwise Hibernate throws HHH000104 and silently falls back to slow in-memory pagination
      - Because keyset pagination requires a native query, and native SQL rejects non-unique ORDER BY columns
      - Because the primary key is always the fastest column to sort, so leading with it minimizes the seek cost
      - Because a non-unique sort key can drop or duplicate rows at page boundaries when multiple rows share the same key value, so a unique tiebreaker guarantees a total order to seek past
    answer: 3
    explanation: |
      Keyset pagination advances by 'give me rows after the last-seen key'. If the sort key
      is not unique, rows sharing a key value straddle the boundary and can be skipped or
      repeated. Appending the unique PK gives a total order, so the WHERE (cols) > (lastSeen)
      predicate unambiguously resumes after the exact last row.
    ref: concepts.md#keyset-seek-pagination
  - id: querying-jpql-hql-criteria-native-069
    difficulty: advanced
    tags:
      - dynamic-queries
      - specification
      - querydsl
    question: |
      Which options are idiomatic ways to build dynamic queries on top of the JPA Criteria
      machinery in a Spring stack?
    options:
      - Spring Data Specification<T> (composable Predicates via JpaSpecificationExecutor) and QueryDSL (fluent Q-types)
      - String concatenation of JPQL fragments, appending each optional filter's clause into one growing query
      - Only raw JPA CriteriaBuilder, hand-assembling every Predicate and Root with no higher-level abstraction
      - Named native queries, one per possible filter combination, selected at runtime by a lookup switch
    answer: 0
    explanation: |
      Specification<T> wraps Criteria with composable toPredicate(...) building blocks run
      via JpaSpecificationExecutor; QueryDSL offers a fluent DSL over generated Q-types.
      Both are type-safe and avoid the injection/plan-cache-thrash problems of string
      concatenation. Blaze-Persistence adds CTEs/set-ops/keyset on top of Criteria.
    ref: concepts.md#building-dynamic-queries-criteria-alternatives
  - id: querying-jpql-hql-criteria-native-070
    difficulty: advanced
    tags:
      - hibernate-6
      - legacy-criteria
      - removed
    question: |
      A developer copies `session.createCriteria(Author.class)` from an old tutorial and it
      won't compile on Hibernate 6. Why?
    options:
      - The legacy org.hibernate.Criteria API was removed in Hibernate 6; use the JPA CriteriaBuilder instead
      - It needs an extra import from the org.hibernate.criterion package that is no longer on the default classpath
      - createCriteria was renamed to createQuery in Hibernate 6 but keeps the same Criteria-building signature
      - Criteria only works with native SQL now, so createCriteria requires a raw SQL string as its first argument
    answer: 0
    explanation: |
      The legacy org.hibernate.Criteria interface (and session.createCriteria) was removed
      in Hibernate 6. Modern code must use the JPA jakarta.persistence.criteria API
      (CriteriaBuilder/CriteriaQuery/Root), which in HB6 translates through the same SQM
      pipeline as HQL/JPQL.
    ref: concepts.md#building-dynamic-queries-criteria-alternatives
  - id: querying-jpql-hql-criteria-native-071
    difficulty: advanced
    tags:
      - metamodel
      - annotation-processor
      - setup
    question: |
      The IDE reports 'cannot resolve symbol Author_' for the static metamodel. What is the
      usual cause and fix?
    options:
      - Author_ must be written by hand, since JPA provides no generator and expects you to author it alongside the entity
      - The entity must be declared final before the metamodel processor will emit its matching Author_ companion class
      - The metamodel only exists at runtime, reflectively synthesized on first use, so it can never resolve at compile time
      - hibernate-jpamodelgen (an annotation processor) isn't enabled on the compile path, or the generated-sources folder isn't marked as a source root — enable annotation processing and re-compile
    answer: 3
    explanation: |
      Author_ is generated by hibernate-jpamodelgen, an annotation processor on the compiler
      path, which emits classes into generated-sources on each compile. 'Cannot resolve
      Author_' means annotation processing is off or the generated-sources directory isn't a
      source root. Enable it and rebuild; it re-runs when entities change.
    ref: concepts.md#static-metamodel-generation-mechanics
  - id: querying-jpql-hql-criteria-native-072
    difficulty: expert
    tags:
      - native-sql
      - flush
      - query-spaces
    question: |
      Under FlushModeType.AUTO, why does Hibernate flush the ENTIRE persistence context
      before each native query, and how do you scope it?
    options:
      - Native queries always run in their own autocommit connection, so the flush is unavoidable and nothing can scope it
      - It flushes to reset the JDBC connection's session state before handing it to the opaque native statement
      - The flush only happens for JPQL entity queries; native SQL never triggers an automatic pre-query flush at all
      - Hibernate can't parse the native SQL to learn its query spaces (tables), so it conservatively flushes everything; unwrap to SynchronizeableQuery and addSynchronizedEntityClass(...) to scope the flush and 2LC invalidation
    answer: 3
    explanation: |
      Because native SQL is opaque, Hibernate can't determine which tables (query spaces) it
      reads, so under AUTO flush it flushes the whole context before every native query to
      avoid reading stale data. Declaring synchronized entities/tables (via
      SynchronizeableQuery.addSynchronizedEntityClass or @NamedNativeQuery synchronization)
      scopes both the flush and second-level-cache invalidation.
    ref: concepts.md#native-query-flush-scope--column-alias-mapping
  - id: querying-jpql-hql-criteria-native-073
    difficulty: expert
    tags:
      - distinct
      - hibernate-6
      - fetch-join
    question: |
      In Hibernate 6, what is the behavior of `DISTINCT` on an entity to-many `JOIN FETCH`
      query compared to Hibernate 5?
    options:
      - HB6 keeps HB5's behavior unchanged, always emitting a SQL DISTINCT for entity fetch joins and still honoring the hibernate.query.passDistinctThrough hint to toggle it on and off
      - HB6 never pushes DISTINCT to SQL for entity fetch joins (it de-duplicates parent references in memory), and the hibernate.query.passDistinctThrough hint was removed; in HB5 DISTINCT was wrongly pushed to SQL, adding a useless sort
      - DISTINCT is rejected by the HB6 parser whenever it is combined with a to-many JOIN FETCH, throwing a QueryException that forces you to remove either the DISTINCT or the fetch
      - HB6 still requires you to set hibernate.query.passDistinctThrough=true explicitly, otherwise the parent entities come back duplicated in the returned result list
    answer: 1
    explanation: |
      For scalar queries DISTINCT still goes to SQL. For entity fetch joins, HB5 wrongly
      pushed DISTINCT to SQL (needless sort), controllable via passDistinctThrough=false.
      HB6 removed that hint and never pushes DISTINCT to SQL for fetch joins — you can even
      drop DISTINCT entirely and still get de-duplicated parents.
    ref: concepts.md#distinct-semantics--the-multiplebagfetchexception-fix
  - id: querying-jpql-hql-criteria-native-074
    difficulty: expert
    tags:
      - multiplebagfetch
      - fix
      - cartesian
    question: |
      `JOIN FETCH a.books JOIN FETCH a.awards` throws MultipleBagFetchException because both
      are `List`s. What actually fixes the compile error, and what caveat remains?
    options:
      - Add DISTINCT to the query; it collapses the two bags into one virtual collection so both can be fetched together with no Cartesian product and no downside
      - Mark both the books and awards collections FetchType.EAGER on the mapping, which lets Hibernate merge them into a single non-bag fetch plan at bootstrap
      - Change the Lists to Sets (or add @OrderColumn) so they aren't bags; but the result is still a Cartesian product (books x awards), so @BatchSize or two queries is often still better
      - Wrap the query in an explicit REQUIRES_NEW transaction so each collection is fetched in its own isolated unit of work, sidestepping the bag conflict
    answer: 2
    explanation: |
      MultipleBagFetchException fires because two List-mapped collections are bags. Making
      them Sets (or ordered Lists via @OrderColumn) lets both be fetched — but the join still
      multiplies rows into a Cartesian product (books x awards), so batch fetching or two
      separate queries usually performs better even once it compiles.
    ref: concepts.md#distinct-semantics--the-multiplebagfetchexception-fix
  - id: querying-jpql-hql-criteria-native-075
    difficulty: expert
    tags:
      - bulk-dml
      - version
      - optimistic-locking
    question: |
      Why can a bulk `UPDATE Author a SET a.active = false WHERE ...` silently break
      optimistic locking, and what is the fix?
    options:
      - It takes a table-level write lock for its whole duration, so switching the isolation level to READ_COMMITTED releases the lock early and restores correct version checks
      - It optimistically retries and then rolls back the entire batch whenever any row's version differs, so wrapping the call in a retry loop is the only fix
      - "@Version is incremented automatically by the bulk statement just as it is for entity flushes, so optimistic locking keeps working with no extra effort"
      - Bulk DML doesn't touch the @Version column, so concurrent version checks pass against a stale version; bump it explicitly in the SET clause (a.version = a.version + 1)
    answer: 3
    explanation: |
      Bulk DML runs raw SQL and does not increment @Version. Rows modified by the bulk update
      keep their old version, so other transactions' optimistic checks won't detect the
      change. Bump the version manually in the SET clause (a.version = a.version + 1). The
      Spring Data equivalent adds @Modifying(clearAutomatically, flushAutomatically).
    ref: concepts.md#sqm-pipeline--bulk-dml-versioncascade-edge-cases
  - id: querying-jpql-hql-criteria-native-076
    difficulty: advanced
    tags:
      - bulk-dml
      - cascade
      - delete
    question: |
      A bulk `DELETE FROM Author a WHERE a.id = :id` fails with a foreign-key constraint
      violation even though Author has `cascade = REMOVE` on its books. Why?
    options:
      - Bulk DELETE ignores cascade = REMOVE and orphanRemoval; it issues one DELETE, so existing child rows violate the FK unless deleted first or handled by DB ON DELETE CASCADE
      - CascadeType.REMOVE is not a real cascade type for collection associations; only orphanRemoval=true can trigger child deletion, and the two are mutually exclusive on one mapping
      - The bulk DELETE fails because it lacks a setMaxResults bound, so Hibernate refuses to plan a delete whose affected-row count is unbounded and open-ended
      - Bulk DELETE always cascades to and removes the mapped child rows first, so the FK error must instead come from a second unrelated table referencing Author
    answer: 0
    explanation: |
      Bulk DML bypasses the persistence context, so JPA cascade = REMOVE and orphanRemoval do
      not apply — Hibernate issues a single DELETE against the parent table. If child rows
      still reference it, the FK constraint fails. Delete children first, or rely on a
      database ON DELETE CASCADE constraint.
    ref: concepts.md#sqm-pipeline--bulk-dml-versioncascade-edge-cases
  - id: querying-jpql-hql-criteria-native-077
    difficulty: expert
    tags:
      - pagination
      - count-query
      - join-fetch
    question: |
      When paginating results that use a collection `JOIN FETCH`, why must the separate
      COUNT query drop the JOIN FETCH?
    options:
      - A COUNT query is always faster when every join is stripped out, so Hibernate mandates removing the fetch purely as a blanket performance optimization unrelated to correctness
      - The COUNT query must itself carry the same setFirstResult/setMaxResults window as the page query so both agree on the row range being counted
      - JOIN FETCH must be preserved in the count query for correctness, because the count has to include each initialized child row to match the paged result size
      - You cannot fetch a collection in a scalar COUNT, and the collection join would inflate the count by the number of child rows; Spring Data supplies a distinct countQuery for this
    answer: 3
    explanation: |
      A scalar COUNT can't fetch a collection, and a collection join multiplies rows so
      COUNT(*) would return rows-with-children, not the number of roots. The count query must
      omit the fetch (and count distinct roots). Spring Data handles this via a separate
      derived/count query so the total reflects root entities.
    ref: concepts.md#sqm-pipeline--bulk-dml-versioncascade-edge-cases
  - id: querying-jpql-hql-criteria-native-078
    difficulty: intermediate
    tags:
      - sqm
      - criteria
      - hibernate-6
    question: |
      In Hibernate 6/7, how is a Criteria query processed relative to HQL/JPQL?
    options:
      - Criteria is first serialized to an equivalent JPQL string and then handed to the same text parser HQL uses, so the two paths converge only after that stringification step
      - Criteria builds SQM directly (the same Semantic Query Model as HQL/JPQL), so it shares the plan cache and optimizer, then is translated to SQL
      - Criteria bypasses the SQM layer entirely and emits dialect SQL straight from the CriteriaBuilder tree, so it never touches the shared query plan cache
      - Criteria is translated into a native SQL string at build time and can only run against databases whose dialect supports raw passthrough
    answer: 1
    explanation: |
      In Hibernate 6/7, HQL, JPQL, and Criteria all translate through the same SQM (Semantic
      Query Model) → SQL AST → dialect SQL pipeline. Criteria is not stringified to JPQL
      first; it constructs SQM directly, so it shares the query plan cache and optimizer with
      HQL/JPQL.
    ref: concepts.md#sqm-pipeline--bulk-dml-versioncascade-edge-cases
  - id: querying-jpql-hql-criteria-native-079
    difficulty: advanced
    tags:
      - native-sql
      - column-alias
      - mapping
    question: |
      Why is a native query using `SELECT *` mapped to an entity class fragile, and what is
      the robust alternative?
    options:
      - SELECT * is always the fastest form because the database skips column-list parsing, so there is no correctness or maintenance downside to mapping it onto an entity
      - Native queries can only ever return scalar Object[] rows and can never be mapped onto a managed entity class, so the whole premise of entity mapping is invalid
      - You must always wrap native queries in @ConstructorResult and project into a DTO, because Hibernate forbids mapping any native result set directly onto an entity type
      - Mapping to an entity needs every mapped column present with the aliases the entity expects; SELECT * breaks on schema changes and column reordering. Use explicit aliases (or @FieldResult in @EntityResult) to remap
    answer: 3
    explanation: |
      Entity mapping requires each mapped column to be present under the alias Hibernate
      expects. SELECT * is brittle across schema changes and column reordering. Select
      columns explicitly with the right aliases, or use @FieldResult inside @EntityResult (or
      addScalar/addEntity on the unwrapped NativeQuery) to remap and set scalar types.
    ref: concepts.md#native-query-flush-scope--column-alias-mapping
  - id: querying-jpql-hql-criteria-native-080
    difficulty: expert
    tags:
      - subqueries
      - quantifier
      - all-any
    question: |
      What does `WHERE a.royalty > ALL (SELECT b.advance FROM Book b WHERE b.author = a)`
      evaluate to?
    options:
      - True as soon as a.royalty exceeds at least one advance returned by the subquery, matching the ANY/SOME quantifier semantics
      - True when a.royalty exceeds every advance returned by the subquery
      - True whenever a.royalty is exactly equal to any single advance value the subquery yields, treating ALL as an equality membership test
      - It is invalid JPQL because the ALL quantifier is only permitted on the right side of an IN predicate, never a > comparison
    answer: 1
    explanation: |
      The ALL quantifier is true only when the comparison holds against every value the
      subquery returns — here, a.royalty greater than every advance. ANY/SOME are true when
      the comparison holds for at least one value. If the subquery is empty, > ALL is
      trivially true.
    ref: concepts.md#subqueries-exists--quantifiers
