topic: "Fetching Strategies: Lazy vs Eager & the N+1 Problem"
domain: hibernate-jpa
topic_slug: fetching-lazy-eager-n-plus-one
version: 1
questions:
  - id: fetching-lazy-eager-n-plus-one-001
    difficulty: beginner
    tags: [fetch-type, defaults, many-to-one]
    question: |
      What is the JPA-spec default fetch type of a plain `@ManyToOne` association?
    options: ["LAZY", "It has no default; you must specify one", "EAGER", "SUBSELECT"]
    answer: 2
    explanation: |
      Per the Jakarta Persistence spec, to-one associations (`@ManyToOne`,
      `@OneToOne`) default to EAGER. To-many associations (`@OneToMany`,
      `@ManyToMany`) default to LAZY. The mnemonic: to-one is EAGER, to-many is LAZY.
    ref: "concepts.md#fetchtype-lazy-vs-eager"

  - id: fetching-lazy-eager-n-plus-one-002
    difficulty: beginner
    tags: [fetch-type, defaults, one-to-many]
    question: |
      What is the default fetch type of `@OneToMany` and `@ManyToMany`?
    options: ["LAZY", "EAGER", "SELECT", "JOIN"]
    answer: 0
    explanation: |
      Collection (to-many) associations default to LAZY. This is deliberate: a
      collection could contain thousands of rows, so loading it eagerly on every
      parent load would be catastrophic.
    ref: "concepts.md#fetchtype-lazy-vs-eager"

  - id: fetching-lazy-eager-n-plus-one-003
    difficulty: beginner
    tags: [fetch-type, semantics]
    question: |
      According to the JPA specification, what is the difference in guarantee between
      LAZY and EAGER?
    options: ["Both are strict requirements the provider must honor exactly", "EAGER is a hint the provider may ignore; LAZY is a strict requirement", "Both are only hints with no binding meaning", "LAZY is a hint the provider may ignore; EAGER is a requirement the provider must honor"]
    answer: 3
    explanation: |
      The spec says LAZY is a *hint* — the provider is permitted to fetch eagerly
      anyway. EAGER is a *requirement* — the association must be loaded when the owner
      is loaded. In practice Hibernate honors LAZY for collections and proxied to-ones.
    ref: "concepts.md#fetchtype-lazy-vs-eager"

  - id: fetching-lazy-eager-n-plus-one-004
    difficulty: intermediate
    tags: [eager, code-smell, best-practice]
    question: |
      Why do senior developers recommend making even `@ManyToOne` associations
      `fetch = FetchType.LAZY`, despite EAGER being the spec default?
    options: ["LAZY associations use less disk space in the database", "EAGER associations are not supported in Hibernate 6", "EAGER cannot be easily overridden per-query, forcing joins/extra selects on every load path, whereas LAZY can be upgraded to eager per query", "LAZY automatically enables second-level caching"]
    answer: 2
    explanation: |
      EAGER is baked into the mapping and applies to every query and `find()` — you
      cannot cheaply make it lazy for one query. LAZY is the flexible default: keep it
      lazy, then fetch eagerly per use case with JOIN FETCH or an entity graph.
    ref: "concepts.md#why-eager-is-a-code-smell"

  - id: fetching-lazy-eager-n-plus-one-005
    difficulty: intermediate
    tags: [proxy, mechanism, to-one]
    question: |
      How does Hibernate implement a LAZY `@ManyToOne` association at runtime (without
      bytecode enhancement)?
    options: ["It returns a runtime-generated proxy subclass holding only the foreign-key id; the first non-id method call fires a SELECT to initialize it", "It returns null until the association is accessed", "It stores the association as a JSON string and parses it on access", "It eagerly loads the row but marks it hidden"]
    answer: 0
    explanation: |
      For a lazy to-one, Hibernate hands you a proxy — a ByteBuddy-generated subclass
      of the entity that knows only the id. Calling any real method triggers
      initialization: a SELECT hydrates the actual state. `getReference()` returns
      exactly such an uninitialized proxy.
    ref: "concepts.md#how-lazy-works-proxies-and-bytecode-enhancement"

  - id: fetching-lazy-eager-n-plus-one-006
    difficulty: intermediate
    tags: [collection, mechanism, persistent-collection]
    question: |
      How does Hibernate defer loading of a LAZY `@OneToMany` collection?
    options: ["It keeps the collection null until commit", "It loads the first element only and streams the rest", "It caches the whole collection in the second-level cache immediately", "It replaces your List/Set with a persistent-collection wrapper (e.g. PersistentBag) that fires its SELECT only when first accessed"]
    answer: 3
    explanation: |
      Hibernate substitutes its own persistent-collection type (PersistentBag,
      PersistentSet, etc.) for your field. The collection stays uninitialized until you
      call size(), iterate, etc., at which point the SELECT for its rows runs.
    ref: "concepts.md#how-lazy-works-proxies-and-bytecode-enhancement"

  - id: fetching-lazy-eager-n-plus-one-007
    difficulty: advanced
    tags: [one-to-one, proxy, gotcha]
    question: |
      Why can an *optional* `@OneToOne` on the non-owning (`mappedBy`) side not be made
      truly LAZY with a plain proxy?
    options: ["Because Hibernate must run a query to know whether the association is null, so it can't hand back a lazy proxy without bytecode enhancement", "Because @OneToOne never supports LAZY under any circumstances", "Because the owning side always overrides the fetch type", "Because optional relationships are stored in a separate table"]
    answer: 0
    explanation: |
      To decide whether to hand back a proxy or null, Hibernate must know if the row
      exists — which requires a query. So an optional inverse `@OneToOne` is effectively
      EAGER unless build-time bytecode enhancement is enabled.
    ref: "concepts.md#why-eager-is-a-code-smell"

  - id: fetching-lazy-eager-n-plus-one-008
    difficulty: intermediate
    tags: [lazy-initialization-exception, session, classic]
    question: |
      What condition throws `LazyInitializationException`?
    options: ["Accessing an uninitialized lazy association/collection after the Session (persistence context) that owned it has been closed", "Accessing any lazy association inside an open transaction", "Calling save() twice on the same entity", "Mapping a @ManyToOne as EAGER"]
    answer: 0
    explanation: |
      A lazy proxy/collection needs an open Session to run its initializing SELECT. If
      the persistence context is already closed (e.g., transaction committed, then the
      view layer touches the collection), there is "no Session" and the exception fires.
    ref: "concepts.md#lazyinitializationexception"

  - id: fetching-lazy-eager-n-plus-one-009
    difficulty: intermediate
    tags: [lazy-initialization-exception, osiv, anti-pattern]
    question: |
      A service returns an entity with a lazy collection; the JSON serializer then hits
      `LazyInitializationException`. Which is the RIGHT fix at senior level?
    options: ["Change the collection mapping to EAGER", "Enable Open Session In View so the Session stays open during serialization", "Fetch the collection inside the transaction in the query (JOIN FETCH / entity graph) or return a DTO that already contains the data", "Catch and ignore the exception"]
    answer: 2
    explanation: |
      The proper fix keeps the mapping LAZY and eagerly initializes only what the use
      case needs, in the query, before the Session closes — via JOIN FETCH, an entity
      graph, or a DTO projection. EAGER and OSIV are the well-known wrong "fixes" that
      hide the design flaw and reintroduce N+1.
    ref: "concepts.md#lazyinitializationexception"

  - id: fetching-lazy-eager-n-plus-one-010
    difficulty: intermediate
    tags: [n-plus-one, definition]
    question: |
      What exactly is the "N+1 problem"?
    options: ["N inserts require N+1 flushes", "A query returns N+1 duplicate rows due to a bad join", "The first-level cache holds N+1 stale copies of an entity", "1 query loads N parents, then N additional queries fire — one per parent — to load each parent's lazy association"]
    answer: 3
    explanation: |
      You pay 1 query for the parents plus N more (one per parent) to satisfy each
      parent's lazy association, for N+1 round trips total. It is the most common
      Hibernate performance defect.
    ref: "concepts.md#the-n1-problem"

  - id: fetching-lazy-eager-n-plus-one-011
    difficulty: advanced
    tags: [n-plus-one, eager, mechanism]
    question: |
      You run `select c from Comment c` where `Comment.post` is `@ManyToOne(EAGER)`.
      What SQL pattern is Hibernate most likely to produce, and why is it a problem?
    options: ["A single join — EAGER always folds into the main query with no downside", "No SQL at all until the post is accessed", "A Cartesian product across all posts and comments", "1 query for the comments, then one extra SELECT per distinct post to satisfy the EAGER contract — an N+1 you cannot turn off for that query"]
    answer: 3
    explanation: |
      When a JPQL query returns rows with an EAGER association that Hibernate doesn't
      fold into the select, it fires a secondary SELECT per distinct associated row.
      This is EAGER-induced N+1, and because EAGER is in the mapping you can't scope it
      away for this query.
    ref: "concepts.md#the-n1-problem"

  - id: fetching-lazy-eager-n-plus-one-012
    difficulty: intermediate
    tags: [n-plus-one, detection, logging]
    question: |
      Which is the most reliable way to *detect* an N+1 problem during development?
    options: ["Enable SQL logging (org.hibernate.SQL at DEBUG) or assert a query count in tests, and look for the same parameterized SELECT firing repeatedly in a loop", "Watch heap usage in a profiler", "Check the size of the second-level cache", "Count the number of @Entity classes"]
    answer: 0
    explanation: |
      N+1 shows up as the identical parameterized SELECT executing many times. SQL
      logging, Hibernate `Statistics` query counts, or a test that asserts an expected
      query count (datasource-proxy / QuickPerf) all surface it directly.
    ref: "concepts.md#detecting-n1"

  - id: fetching-lazy-eager-n-plus-one-013
    difficulty: intermediate
    tags: [join-fetch, jpql, fix]
    question: |
      Which JPQL query loads all posts and their comments in a single SQL statement?
    options: ["select p from Post p", "select p from Post p where p.comments is not null", "select p from Post p join fetch p.comments", "select p, c from Post p, Comment c"]
    answer: 2
    explanation: |
      `join fetch` tells Hibernate to load the association in the same SQL join,
      eliminating the per-parent SELECTs. It overrides the LAZY mapping for that query.
    ref: "concepts.md#fix-join-fetch"

  - id: fetching-lazy-eager-n-plus-one-014
    difficulty: advanced
    tags: [join-fetch, distinct, duplicates]
    question: |
      A collection `join fetch` returns duplicate parent references (one per child row).
      How do you get distinct parents, and what does Hibernate 6 do about the SQL?
    options: ["Add `group by p.id`; Hibernate always emits SQL DISTINCT", "There is no way to de-duplicate a fetch join", "Use `setMaxResults(1)`", "Use `select distinct p ...`; in Hibernate 6 `distinct` de-duplicates the Java list by default without adding a needless SQL DISTINCT for entity queries"]
    answer: 3
    explanation: |
      `select distinct p` removes the duplicate Java references. In Hibernate 6 the
      former `hibernate.query.passDistinctThrough=false` behavior is the default, so it
      de-duplicates in memory without pushing a superfluous SQL `DISTINCT` to the DB.
    ref: "concepts.md#fix-join-fetch"

  - id: fetching-lazy-eager-n-plus-one-015
    difficulty: advanced
    tags: [join-fetch, pagination, gotcha, oom]
    question: |
      You add `setMaxResults(20)` to a JPQL query that does `join fetch p.comments`.
      What happens?
    options: ["The DB applies LIMIT 20 to the joined result correctly", "It throws MultipleBagFetchException", "Only 20 comments are loaded across all posts", "Hibernate warns (HHH000104) and paginates in memory after fetching everything — a silent OOM risk"]
    answer: 3
    explanation: |
      A collection fetch multiplies rows, so a SQL LIMIT cannot page parents correctly.
      Hibernate loads the entire result set and paginates in application memory, logging
      `HHH000104: firstResult/maxResults specified with collection fetch; applying in
      memory`. Use batch fetching or a two-query approach for pagination + collections.
    ref: "concepts.md#fix-join-fetch"

  - id: fetching-lazy-eager-n-plus-one-016
    difficulty: intermediate
    tags: [join-fetch, inner-vs-left]
    question: |
      Using an inner `join fetch p.comments`, posts with no comments disappear from the
      result. How do you keep them?
    options: ["Use `left join fetch p.comments`", "Add `select distinct`", "Switch the collection to EAGER", "Add `where p.comments is empty`"]
    answer: 0
    explanation: |
      An inner join drops parents whose collection is empty. `left join fetch` performs
      an outer join so parents with no children are still returned (with an empty
      collection).
    ref: "concepts.md#fix-join-fetch"

  - id: fetching-lazy-eager-n-plus-one-017
    difficulty: intermediate
    tags: [entity-graph, jpa, fix]
    question: |
      What is the primary advantage of `@EntityGraph` over hardcoding `join fetch` in
      every query?
    options: ["It generates a Cartesian-product-free query using IN clauses", "It caches results in the second-level cache automatically", "It is a declarative, reusable, JPA-standard fetch plan that overrides mapping fetch types per query and integrates with Spring Data methods", "It is the only way to avoid LazyInitializationException"]
    answer: 2
    explanation: |
      An entity graph is the JPA-standard, declarative fetch plan. Hibernate implements
      it as a single join query (like JOIN FETCH), but it is reusable and works
      cleanly on Spring Data repository methods via `@EntityGraph(attributePaths=...)`.
    ref: "concepts.md#fix-entitygraph"

  - id: fetching-lazy-eager-n-plus-one-018
    difficulty: advanced
    tags: [entity-graph, fetch-graph, load-graph]
    question: |
      What is the difference between a JPA *fetch graph* and a *load graph*?
    options: ["Fetch graph is for reads; load graph is for writes", "They are identical aliases", "A load graph ignores the mapping entirely; a fetch graph respects it", "In a fetch graph, listed attributes are EAGER and everything else is LAZY; in a load graph, listed attributes are EAGER and everything else keeps its mapping default"]
    answer: 3
    explanation: |
      Fetch graph (`jakarta.persistence.fetchgraph`): attributes in the graph are EAGER,
      everything else becomes LAZY (even if mapped EAGER). Load graph
      (`jakarta.persistence.loadgraph`): listed attributes are EAGER, unlisted attributes
      keep their mapping default.
    ref: "concepts.md#fix-entitygraph"

  - id: fetching-lazy-eager-n-plus-one-019
    difficulty: advanced
    tags: [batch-size, in-clause, fix]
    question: |
      With `@BatchSize(size = 10)` on a lazy collection, roughly how many queries load
      N parents' collections, and what SQL does Hibernate use?
    options: ["About 1 + ceil(N/10) queries, initializing collections in batches via an IN (...) clause", "Always exactly 2 queries, using a subselect", "Exactly 1 query, using a fetch join", "N queries — @BatchSize only affects inserts"]
    answer: 0
    explanation: |
      Batch fetching keeps laziness but initializes up to `size` collections/proxies at
      once with a `WHERE post_id IN (?, ?, ...)`, turning N+1 into roughly
      1 + ⌈N/size⌉ queries.
    ref: "concepts.md#fix-batch-fetching-batchsize"

  - id: fetching-lazy-eager-n-plus-one-020
    difficulty: intermediate
    tags: [batch-size, global-config, best-practice]
    question: |
      Which Hibernate property sets a global default batch fetch size as an N+1 safety
      net?
    options: ["hibernate.default_batch_fetch_size", "hibernate.jdbc.fetch_size", "hibernate.max_fetch_depth", "hibernate.batch_versioned_data"]
    answer: 0
    explanation: |
      `hibernate.default_batch_fetch_size` (in Spring Boot,
      `spring.jpa.properties.hibernate.default_batch_fetch_size`) applies batch fetching
      globally without per-association `@BatchSize`. `hibernate.jdbc.fetch_size` is the
      unrelated JDBC row-prefetch hint.
    ref: "concepts.md#fix-batch-fetching-batchsize"

  - id: fetching-lazy-eager-n-plus-one-021
    difficulty: advanced
    tags: [batch-size, trade-offs, pagination]
    question: |
      Why is batch fetching often the best *general-purpose* N+1 defense?
    options: ["It always uses exactly one query", "It eliminates the need for a database entirely", "It disables lazy loading globally", "It works for both collections and to-one proxies, produces no Cartesian product, and is compatible with pagination"]
    answer: 3
    explanation: |
      Unlike JOIN FETCH, batch fetching avoids Cartesian products and works with
      pagination; unlike subselect it can batch by size; and it applies to both
      collections and to-one proxies. That is why many teams enable
      `default_batch_fetch_size` as a safety net.
    ref: "concepts.md#fix-batch-fetching-batchsize"

  - id: fetching-lazy-eager-n-plus-one-022
    difficulty: advanced
    tags: [subselect, fetch-mode]
    question: |
      What does `@Fetch(FetchMode.SUBSELECT)` do?
    options: ["Loads each collection with a separate query per parent", "Forces an inner join in the primary query", "Disables the collection entirely", "Initializes all lazy collections of the original query's parents with one second query that re-runs the original query as a subselect in an IN clause"]
    answer: 3
    explanation: |
      SUBSELECT fetching runs two queries total: the original one, then a single query
      loading all children `WHERE parent_id IN (subselect of the original query)`. The
      downside is it re-executes the original query and always loads everything.
    ref: "concepts.md#fix-subselect-fetching-fetchsubselect"

  - id: fetching-lazy-eager-n-plus-one-023
    difficulty: expert
    tags: [multiple-bag, cartesian, gotcha]
    question: |
      A query does `join fetch p.comments join fetch p.tags` where both are `List`s
      mapped without `@OrderColumn`. What happens?
    options: ["MultipleBagFetchException is thrown, because Hibernate cannot simultaneously fetch two bags", "It works but returns sorted results", "A silent Cartesian product with no error", "It falls back to batch fetching automatically"]
    answer: 0
    explanation: |
      A `List` without `@OrderColumn` is a *bag*. Hibernate cannot de-duplicate two
      unordered bags in one query, so it throws
      `MultipleBagFetchException: cannot simultaneously fetch multiple bags`.
    ref: "concepts.md#multiplebagfetchexception--cartesian-products"

  - id: fetching-lazy-eager-n-plus-one-024
    difficulty: expert
    tags: [multiple-bag, set, cartesian, judgment]
    question: |
      Changing both collections from `List` to `Set` makes the two-collection JOIN FETCH
      *compile and run*. Why is it still usually the wrong choice?
    options: ["Sets are not supported by JPA", "Sets cannot be lazily loaded", "You still get a Cartesian product (comments x tags rows), which grows multiplicatively and ships duplicated data over the wire", "It forces EAGER on both collections permanently"]
    answer: 2
    explanation: |
      `Set` avoids `MultipleBagFetchException`, but joining two collections still
      multiplies rows (M x K). The right approach is to fetch at most one collection per
      query and get the others via batch or subselect fetching, or a second query.
    ref: "concepts.md#multiplebagfetchexception--cartesian-products"

  - id: fetching-lazy-eager-n-plus-one-025
    difficulty: advanced
    tags: [dto, projection, read-model, fix]
    question: |
      For a read-only list/reporting endpoint that only needs a few columns, what is the
      cleanest way to avoid both N+1 and LazyInitializationException?
    options: ["Make every association EAGER", "Enable OSIV globally", "Detach every entity before returning", "Project directly into a DTO (e.g. a JPQL constructor expression) so no lazy associations exist and only needed columns are fetched"]
    answer: 3
    explanation: |
      A DTO has no managed associations, so there is nothing to lazily initialize and no
      N+1. Constructor expressions (`select new ...`) or Spring Data projections fetch
      exactly the columns needed. Entities are for the write model, DTOs for the read
      model.
    ref: "concepts.md#dto-projections"

  - id: fetching-lazy-eager-n-plus-one-026
    difficulty: intermediate
    tags: [dto, jpql, constructor-expression]
    question: |
      Which JPQL feature maps query rows directly into a DTO type?
    options: ["A constructor expression: `select new com.example.PostSummary(p.id, p.title) from Post p`", "The `fetch` keyword", "The `@EntityGraph` annotation", "The `distinct` keyword"]
    answer: 0
    explanation: |
      JPQL constructor expressions (`select new FQCN(...)`) instantiate a DTO per row
      using a matching constructor. This projects only the selected columns, bypassing
      entity loading entirely.
    ref: "concepts.md#dto-projections"

  - id: fetching-lazy-eager-n-plus-one-027
    difficulty: intermediate
    tags: [get-reference, proxy, mechanism]
    question: |
      What does `entityManager.getReference(Post.class, 1L)` return, and when is a SELECT
      issued?
    options: ["An uninitialized proxy holding only the id; a SELECT fires on first access of a non-id property (while the Session is open)", "A fully loaded Post immediately", "null if the row is not yet cached", "A detached copy that never triggers SQL"]
    answer: 0
    explanation: |
      `getReference` deliberately returns a lazy proxy without hitting the DB — ideal for
      setting a foreign key without a SELECT. Accessing a non-id property later triggers
      initialization (or throws EntityNotFoundException if the row is gone).
    ref: "concepts.md#how-lazy-works-proxies-and-bytecode-enhancement"

  - id: fetching-lazy-eager-n-plus-one-028
    difficulty: intermediate
    tags: [initialize, api, session]
    question: |
      Which call forces initialization of a lazy proxy or collection while the Session is
      still open?
    options: ["Hibernate.detach(proxy)", "proxy.getClass()", "entityManager.clear()", "Hibernate.initialize(proxy)"]
    answer: 3
    explanation: |
      `Hibernate.initialize(proxy)` forces the load, and `Hibernate.isInitialized(proxy)`
      checks state. Note `getClass()` returns the proxy subclass and does NOT initialize;
      `clear()` detaches everything, making later lazy access throw.
    ref: "concepts.md#how-lazy-works-proxies-and-bytecode-enhancement"

  - id: fetching-lazy-eager-n-plus-one-029
    difficulty: advanced
    tags: [osiv, spring-boot, anti-pattern]
    question: |
      In Spring Boot, what is the default value of `spring.jpa.open-in-view`, and why is
      turning it off often recommended?
    options: ["false; turning it on is recommended for performance", "true; it should always stay on", "true; disabling it avoids masking N+1 and holding DB connections open during view rendering", "It has no default and must be set explicitly"]
    answer: 2
    explanation: |
      Spring Boot defaults OSIV to true (and logs a warning). Leaving the Session open
      for the whole request lets lazy loads succeed in the view layer — but that hides
      N+1 and keeps connections held during rendering. Senior teams commonly set it to
      false. See spring-boot for request-scope mechanics.
    ref: "concepts.md#lazyinitializationexception"

  - id: fetching-lazy-eager-n-plus-one-030
    difficulty: beginner
    tags: [fetch-type, syntax]
    question: |
      Which annotation attribute overrides the default fetch behavior of an association?
    options: ["fetch", "cascade", "mappedBy", "optional"]
    answer: 0
    explanation: |
      The `fetch` attribute (e.g. `@ManyToOne(fetch = FetchType.LAZY)`) sets FetchType.
      `cascade` controls cascading operations, `mappedBy` marks the inverse side, and
      `optional` controls nullability.
    ref: "concepts.md#fetchtype-lazy-vs-eager"

  - id: fetching-lazy-eager-n-plus-one-031
    difficulty: advanced
    tags: [bytecode-enhancement, mechanism]
    question: |
      What capability does Hibernate build-time bytecode enhancement add beyond runtime
      proxies?
    options: ["It removes the need for a database connection", "It converts all associations to EAGER", "It replaces JPQL with native SQL", "Attribute-level lazy loading (e.g. lazy @Lob columns) and no-proxy lazy to-one associations, including the optional inverse @OneToOne case"]
    answer: 3
    explanation: |
      The enhancer weaves lazy-loading logic into the entity class itself, enabling
      per-attribute laziness (big columns) and lazy to-one loading without a separate
      proxy object — solving the optional inverse `@OneToOne` problem.
    ref: "concepts.md#how-lazy-works-proxies-and-bytecode-enhancement"

  - id: fetching-lazy-eager-n-plus-one-032
    difficulty: advanced
    tags: [judgment, scenario, pagination, batch]
    question: |
      You must return a *paginated* list of posts, each with its comments, without N+1.
      Which approach is appropriate?
    options: ["JOIN FETCH the comments and add setMaxResults() — it pages correctly", "Make comments EAGER", "Use two JOIN FETCH collections at once", "Page the posts normally, and initialize comments via @BatchSize / default_batch_fetch_size (or a second query on the page's ids)"]
    answer: 3
    explanation: |
      Collection JOIN FETCH breaks pagination (in-memory paging / OOM). The correct
      pattern: paginate parents with LIMIT, then initialize the collections for that page
      via batch fetching or a targeted second query using the page's parent ids.
    ref: "concepts.md#fix-batch-fetching-batchsize"

  - id: fetching-lazy-eager-n-plus-one-033
    difficulty: intermediate
    tags: [scenario, join-fetch, judgment]
    question: |
      Given `Order` (many) -> `Customer` (one, LAZY) and you need order id + customer
      name for 500 orders in a report, which single query best avoids N+1?
    options: ["select o from Order o  (then access o.getCustomer().getName() in a loop)", "select o from Order o where o.customer is not null", "select o from Order o join fetch o.customer  (or a DTO projecting o.id, o.customer.name)", "Set Order.customer to EAGER and query normally"]
    answer: 2
    explanation: |
      Fetching the customer in the same query (JOIN FETCH) — or better, projecting the
      two needed columns into a DTO — loads everything in one round trip. The naive loop
      causes N+1; EAGER solves this one query but pollutes every other query.
    ref: "concepts.md#fix-join-fetch"

  - id: fetching-lazy-eager-n-plus-one-034
    difficulty: expert
    tags: [scenario, multiple-collections, judgment]
    question: |
      You need a `Post` with both its `comments` and `tags` collections initialized, no
      N+1, no MultipleBagFetchException, no Cartesian product. Best strategy?
    options: ["Fetch one collection with JOIN FETCH (or entity graph) and load the other via @BatchSize / subselect — or run two separate fetch queries", "JOIN FETCH both collections in one query", "Make both collections EAGER", "Convert both to @ManyToOne"]
    answer: 0
    explanation: |
      Fetch at most one collection per query. Get the second collection through batch or
      subselect fetching (no Cartesian product) or a separate query. Fetching two
      collections at once causes MultipleBagFetchException (bags) or a Cartesian product
      (sets).
    ref: "concepts.md#multiplebagfetchexception--cartesian-products"

  - id: fetching-lazy-eager-n-plus-one-035
    difficulty: intermediate
    tags: [namespace, jakarta, fetch-type]
    question: |
      In Jakarta Persistence 3.x / Hibernate 6+, which package declares `FetchType`?
    options: ["javax.persistence", "jakarta.persistence", "org.hibernate.annotations", "java.persistence"]
    answer: 1
    explanation: |
      Since Jakarta EE 9 the namespace moved from `javax.persistence.*` to
      `jakarta.persistence.*`, and Hibernate 6/7 use `jakarta.persistence.FetchType`. The
      legacy `javax.persistence` package is no longer used. See
      hibernate-6-7-and-jakarta-migration.
    ref: "concepts.md#fetchtype-lazy-vs-eager"

  - id: fetching-lazy-eager-n-plus-one-036
    difficulty: advanced
    tags: [scenario, eager, cartesian]
    question: |
      An entity has two `@OneToMany` collections both mapped EAGER. What is the likely
      symptom when you load it?
    options: ["A single small query", "A MultipleBagFetchException at startup only", "No SQL until access", "A Cartesian product multiplying the two collections' rows (plus the inability to disable it per query)"]
    answer: 3
    explanation: |
      Two EAGER collections force Hibernate to join both, producing a Cartesian product
      (rows = |coll1| x |coll2|) on every load, and you cannot scope it away per query.
      This is a strong reason to keep collections LAZY.
    ref: "concepts.md#why-eager-is-a-code-smell"

  - id: fetching-lazy-eager-n-plus-one-037
    difficulty: intermediate
    tags: [is-initialized, api, mechanism]
    question: |
      Does calling `proxy.getClass()` on an uninitialized lazy proxy trigger a SELECT?
    options: ["No — getClass() returns the proxy subclass and does not initialize it; use Hibernate.initialize() or access a real property instead", "Yes, it always initializes the proxy", "Yes, but only for collections", "No, because proxies never hit the database"]
    answer: 0
    explanation: |
      `getClass()` is not overridden to initialize; it returns the runtime proxy class
      (e.g. `Post$HibernateProxy$xxx`). This is also why `instanceof`/`getClass()`
      comparisons and naive equals on proxies are error-prone. To force loading use
      `Hibernate.initialize()` or access a mapped property.
    ref: "concepts.md#how-lazy-works-proxies-and-bytecode-enhancement"

  - id: fetching-lazy-eager-n-plus-one-038
    difficulty: expert
    tags: [subselect, vs-batch, trade-offs]
    question: |
      Compared to `@BatchSize`, what is a downside of `@Fetch(FetchMode.SUBSELECT)`?
    options: ["It causes MultipleBagFetchException", "It requires EAGER on the collection", "It re-executes the (possibly expensive) original query as a subselect and always loads all children with no batching granularity", "It only works for @ManyToOne"]
    answer: 2
    explanation: |
      SUBSELECT runs the whole original query again inside an IN subquery, which can be
      costly, and it loads every child at once (no size control). Batch fetching uses a
      simple IN list of ids and lets you tune the batch size.
    ref: "concepts.md#fix-subselect-fetching-fetchsubselect"

  - id: fetching-lazy-eager-n-plus-one-039
    difficulty: beginner
    tags: [best-practice, lazy, default]
    question: |
      What is the recommended professional default for association fetch types?
    options: ["Make everything EAGER for simplicity", "Make all associations LAZY (including @ManyToOne/@OneToOne) and fetch eagerly per use case in the query", "Use EAGER for collections and LAZY for to-ones", "Never specify fetch and rely on OSIV"]
    answer: 1
    explanation: |
      The professional default is LAZY everywhere, then upgrade to eager per-query with
      JOIN FETCH / entity graphs / DTOs. This gives per-use-case control and avoids
      surprise joins and N+1.
    ref: "concepts.md#why-eager-is-a-code-smell"

  - id: fetching-lazy-eager-n-plus-one-040
    difficulty: advanced
    tags: [statistics, detection, testing]
    question: |
      Which Hibernate API lets a test assert how many SQL statements a code path issued
      (to catch N+1 regressions)?
    options: ["SessionFactory.getCache()", "EntityManager.getMetamodel()", "Session.getFlushMode()", "sessionFactory.getStatistics().getPrepareStatementCount()"]
    answer: 3
    explanation: |
      Enabling `hibernate.generate_statistics` and reading
      `Statistics.getPrepareStatementCount()` (or query-execution counts) lets a test pin
      the expected number of statements, failing if an N+1 regression sneaks in.
      datasource-proxy / QuickPerf offer similar assertions.
    ref: "concepts.md#detecting-n1"

  - id: fetching-lazy-eager-n-plus-one-041
    difficulty: intermediate
    tags: [entity-graph, spring-data, api]
    question: |
      In Spring Data JPA, how do you apply an ad-hoc entity graph to a repository method
      to fetch an association and avoid N+1?
    options: ["@Fetch(\"comments\") on the method", "@Query(fetch = \"comments\")", "@EntityGraph(attributePaths = {\"comments\"}) on the repository method", "@Transactional(readOnly = true)"]
    answer: 2
    explanation: |
      `@EntityGraph(attributePaths = {...})` on a Spring Data method declares an ad-hoc
      fetch graph, so Hibernate fetches those paths in one join query. The repository
      abstraction itself is covered in spring-data-jpa-repositories.
    ref: "concepts.md#fix-entitygraph"

  - id: fetching-lazy-eager-n-plus-one-042
    difficulty: advanced
    tags: [scenario, dto, write-vs-read]
    question: |
      Which statement best captures when to use entities vs DTOs regarding fetching?
    options: ["Use managed entities for the write model (dirty checking, cascades) with a tailored fetch plan; use DTO projections for read-heavy list/reporting endpoints", "Always use entities; DTOs are legacy", "Always use DTOs; entities cause N+1 by definition", "Use EAGER entities for reads and DTOs for writes"]
    answer: 0
    explanation: |
      Entities shine for writes because Hibernate tracks changes and cascades
      (see transactions-dirty-checking-flushing). For reads, especially lists, DTOs load
      only needed columns and sidestep lazy/eager and N+1 concerns entirely.
    ref: "concepts.md#dto-projections"

  - id: fetching-lazy-eager-n-plus-one-043
    difficulty: expert
    tags: [scenario, eager, find, mechanism]
    question: |
      With `Comment.post` mapped `@ManyToOne(fetch = EAGER)`, what happens on
      `em.find(Comment.class, 5L)`?
    options: ["Only the comment row is loaded; the post loads on access", "It throws LazyInitializationException", "Nothing loads until commit", "Hibernate loads the comment and its post together, typically in one join (EAGER is honored for find())"]
    answer: 3
    explanation: |
      For a direct `find()`, Hibernate can satisfy an EAGER to-one with a single join,
      loading the post alongside the comment. (The N+1 danger with EAGER surfaces more on
      multi-row JPQL/HQL queries than on single-entity find().)
    ref: "concepts.md#why-eager-is-a-code-smell"

  - id: fetching-lazy-eager-n-plus-one-044
    difficulty: intermediate
    tags: [bag, order-column, list]
    question: |
      By default, how does Hibernate treat a `@OneToMany List<...>` with no
      `@OrderColumn`?
    options: ["As an ordered indexed list", "As a bag (unordered, allowing duplicates) — which is why two such lists can't be fetch-joined together", "As a Set with uniqueness enforced", "As a Map keyed by id"]
    answer: 1
    explanation: |
      A `List` without `@OrderColumn` is a *bag*: unordered, no index column. Two bags
      can't be fetch-joined simultaneously (MultipleBagFetchException). Adding
      `@OrderColumn` makes it a true ordered list (with an index column).
    ref: "concepts.md#multiplebagfetchexception--cartesian-products"

  - id: fetching-lazy-eager-n-plus-one-045
    difficulty: advanced
    tags: [scenario, lazy-init, transaction-boundary]
    question: |
      Your controller calls a `@Transactional` service that returns a `Post`; the
      controller then reads `post.getComments()` and gets LazyInitializationException,
      even though OSIV is disabled. What is the cleanest fix?
    options: ["Add @Transactional to the controller too", "Re-enable OSIV", "Have the service initialize/return the needed data inside its transaction — e.g. JOIN FETCH the comments, use an @EntityGraph, or return a DTO", "Call Hibernate.initialize() in the controller"]
    answer: 2
    explanation: |
      With OSIV off, the Session closes when the service transaction commits, so the
      controller can't lazily load. The fix is to fetch what the caller needs while the
      transaction is open (JOIN FETCH / entity graph) or return a fully-populated DTO —
      not to widen the transaction or re-enable OSIV.
    ref: "concepts.md#lazyinitializationexception"

  - id: fetching-lazy-eager-n-plus-one-046
    difficulty: intermediate
    tags: [comparison, techniques, judgment]
    question: |
      Which N+1 fix runs in a *single* SQL statement but risks a Cartesian product when
      applied to two collections?
    options: ["JOIN FETCH / @EntityGraph", "@BatchSize", "@Fetch(SUBSELECT)", "DTO projection with grouping"]
    answer: 0
    explanation: |
      JOIN FETCH and entity graphs collapse the load into one join query, but joining
      two collections multiplies rows (Cartesian product) and can trip
      MultipleBagFetchException. Batch and subselect fetching avoid the Cartesian product
      by using separate queries with IN clauses.
    ref: "concepts.md#fix-join-fetch"

  - id: fetching-lazy-eager-n-plus-one-047
    difficulty: expert
    tags: [scenario, eager-n-plus-one, root-cause]
    question: |
      A dashboard endpoint suddenly fires hundreds of tiny identical SELECTs after a
      teammate added `@ManyToOne(fetch = EAGER)` to a widely-queried entity. What is the
      root cause and the correct remedy?
    options: ["Second-level cache miss; enable the query cache", "Missing database index; add one", "Connection pool too small; increase it", "EAGER-induced N+1: revert the association to LAZY and fetch it per-query where actually needed (JOIN FETCH / entity graph)"]
    answer: 3
    explanation: |
      Making a frequently-queried to-one EAGER forces a secondary SELECT per row across
      every query that returns that entity — classic EAGER N+1. The fix is to restore
      LAZY and fetch the association explicitly only where the use case needs it.
      (Index/pool tuning would only mask the symptom; see messaging-databases for DB-side
      concerns.)
    ref: "concepts.md#the-n1-problem"

  - id: fetching-lazy-eager-n-plus-one-048
    difficulty: beginner
    tags: [lazy-init, message, recognition]
    question: |
      "failed to lazily initialize a collection of role ... could not initialize proxy -
      no Session" is the message of which exception?
    options: ["MultipleBagFetchException", "LazyInitializationException", "EntityNotFoundException", "TransientObjectException"]
    answer: 1
    explanation: |
      That message is the signature of `LazyInitializationException` — a lazy
      collection/proxy was accessed with no open Session to run its initializing query.
    ref: "concepts.md#lazyinitializationexception"

  - id: fetching-lazy-eager-n-plus-one-049
    difficulty: advanced
    tags: [entity-graph, subgraph, deep-fetch]
    question: |
      To fetch a nested path like Post -> comments -> author in one plan, what does an
      entity graph use?
    options: ["Multiple @BatchSize annotations", "The SUBSELECT fetch mode", "A subgraph (e.g. @NamedSubgraph or nested attributePaths) describing the nested attributes to fetch", "A native SQL query only"]
    answer: 2
    explanation: |
      Entity graphs support subgraphs to describe nested fetch plans (comments, and
      within each comment, its author). Programmatic graphs use `addSubgraph`, named
      graphs use `@NamedSubgraph`. This keeps the whole plan in one join query.
    ref: "concepts.md#fix-entitygraph"

  - id: fetching-lazy-eager-n-plus-one-050
    difficulty: intermediate
    tags: [scenario, judgment, single-parent]
    question: |
      You load ONE post by id and then read its comments once, inside the same
      transaction. Is this an N+1 problem?
    options: ["Yes — any lazy access is N+1", "Yes, unless OSIV is enabled", "Only if the collection is EAGER", "No — with a single parent it is just 2 queries (1 parent + 1 collection); N+1 refers to the fan-out when iterating N parents"]
    answer: 3
    explanation: |
      N+1 is specifically the fan-out of N extra queries when you process N parents. A
      single parent plus one lazy collection load is just two queries — usually fine. The
      problem scales with the number of parents in a loop.
    ref: "concepts.md#the-n1-problem"

  - id: fetching-lazy-eager-n-plus-one-051
    difficulty: expert
    tags: [fetch-mode, join, jpql, gotcha]
    question: |
      A developer annotates `Comment.post` with `@ManyToOne(fetch = LAZY)` plus
      `@Fetch(FetchMode.JOIN)`, expecting the repository's `select c from Comment c` JPQL
      to avoid N+1. It still fires N secondary SELECTs. Why?
    options:
      - "`@Fetch(FetchMode.JOIN)` is silently ignored for JPQL/HQL and Criteria queries; it only takes effect for find()/getReference()"
      - "FetchMode.JOIN is not a valid Hibernate enum value"
      - "The LAZY fetch type always wins over FetchMode.JOIN"
      - "You must also set hibernate.default_batch_fetch_size"
    answer: 0
    explanation: |
      `@Fetch(FetchMode.JOIN)` only influences the fetch plan of `EntityManager.find()` and
      `getReference()`. JPQL/HQL and Criteria build their own fetch plan and disregard it,
      so the association still loads via secondary SELECTs (N+1). To eager-join inside a
      JPQL query you must write an explicit `join fetch` or use an entity graph.
    ref: "concepts.md#the-fetchmode-triad-select-join-subselect"

  - id: fetching-lazy-eager-n-plus-one-052
    difficulty: advanced
    tags: [fetch-mode, select, n-plus-one]
    question: |
      Which Hibernate `FetchMode` is the implicit default and the mechanism directly
      responsible for the classic N+1 pattern?
    options:
      - "FetchMode.JOIN"
      - "FetchMode.SUBSELECT"
      - "FetchMode.SELECT — one secondary SELECT per association, fired lazily on access"
      - "FetchMode.BATCH"
    answer: 2
    explanation: |
      `FetchMode.SELECT` is the default: each association is initialized with its own
      secondary SELECT when accessed, producing 1 + N queries for N parents. `JOIN` folds
      an eager outer join into the owner's query; `SUBSELECT` uses two queries. There is no
      `FetchMode.BATCH` (batch fetching is via `@BatchSize`).
    ref: "concepts.md#the-fetchmode-triad-select-join-subselect"

  - id: fetching-lazy-eager-n-plus-one-053
    difficulty: expert
    tags: [proxy, getclass, identity, gotcha]
    question: |
      You load `a = em.find(Post.class, 1L)` and `b = em.getReference(Post.class, 1L)` in
      the same persistence context. What does `a.getClass() == b.getClass()` evaluate to?
    options:
      - "true — both are Post.class"
      - "false — `a` is Post, but `b` is a ByteBuddy proxy subclass like Post$HibernateProxy$xxx"
      - "It throws WrongClassException"
      - "true, but only after b is initialized"
    answer: 1
    explanation: |
      `getReference` returns an uninitialized proxy whose runtime class is a ByteBuddy
      subclass (`Post$HibernateProxy$…`), while `find` returns the real `Post`. So the
      `getClass()` values differ even though both denote the same row. Use
      `Hibernate.getClass()` to compare real types.
    ref: "concepts.md#proxy-identity-gotchas"

  - id: fetching-lazy-eager-n-plus-one-054
    difficulty: expert
    tags: [proxy, equals-hashcode, field-access]
    question: |
      Why can an `equals()` method that reads fields directly (e.g. `this.email`) return
      wrong results when one operand is an uninitialized lazy proxy?
    options:
      - "Proxies override equals() to always return false"
      - "Field access does not trigger proxy initialization (only getter/method calls do), so the fields read as null on the proxy"
      - "The proxy stores fields in a separate database table"
      - "equals() is not allowed on entities"
    answer: 1
    explanation: |
      A proxy initializes on *method/getter* access, not on direct field reads. Reading
      `this.email` on the proxy sees the uninitialized (null) field, so the comparison is
      wrong. Always use getters inside `equals`/`hashCode`, and prefer a stable business
      key over the generated `@Id`.
    ref: "concepts.md#proxy-identity-gotchas"

  - id: fetching-lazy-eager-n-plus-one-055
    difficulty: expert
    tags: [proxy, polymorphism, classcastexception]
    question: |
      `Order.payment` is a LAZY `@ManyToOne` to a `Payment` hierarchy; the actual row is a
      `CreditCardPayment`. `(CreditCardPayment) order.getPayment()` throws
      ClassCastException. Why, and what is the fix?
    options:
      - "Hibernate corrupted the row; re-fetch it"
      - "The proxy is of the base type Payment (not the concrete subclass), so the downcast fails; unproxy it with Hibernate.unproxy(payment, CreditCardPayment.class)"
      - "@ManyToOne cannot point to an inheritance hierarchy"
      - "You must make the association EAGER for polymorphism to work"
    answer: 1
    explanation: |
      A lazy to-one proxy is generated for the *declared* (base) type, so it is not an
      instance of the concrete subclass — downcasting throws ClassCastException
      (WrongClassException territory). `Hibernate.unproxy(proxy, CreditCardPayment.class)`
      returns the real initialized subclass instance.
    ref: "concepts.md#proxy-identity-gotchas"

  - id: fetching-lazy-eager-n-plus-one-056
    difficulty: advanced
    tags: [proxy, unproxy, hibernate-api]
    question: |
      Which call returns the real, initialized entity class of a possibly-proxied entity
      (e.g. `Post.class` rather than `Post$HibernateProxy$xxx`)?
    options:
      - "entity.getClass()"
      - "Hibernate.getClass(entity)"
      - "entity.getClass().getSuperclass() — always correct"
      - "EntityManager.getDelegate()"
    answer: 1
    explanation: |
      `Hibernate.getClass(entity)` returns the true persistent class regardless of
      proxying. `entity.getClass()` returns the ByteBuddy subclass for a proxy. (While a
      proxy's superclass often is the entity, `getSuperclass()` is not a reliable general
      answer, e.g. for non-proxied instances or enhanced classes.)
    ref: "concepts.md#proxy-identity-gotchas"

  - id: fetching-lazy-eager-n-plus-one-057
    difficulty: expert
    tags: [anti-pattern, enable_lazy_load_no_trans, judgment]
    question: |
      What is the primary problem with setting `hibernate.enable_lazy_load_no_trans=true`
      to silence LazyInitializationException?
    options:
      - "It disables the first-level cache"
      - "It opens a temporary Session + transaction (auto-commit) per lazy access, inflating connection/transaction count and giving inconsistent reads across one logical operation"
      - "It only works with EAGER associations"
      - "It forces every query to use SUBSELECT fetching"
    answer: 1
    explanation: |
      The setting makes lazy access "work" outside a transaction by spinning up a fresh
      Session and transaction for each lazy load. That means one round trip per access,
      connection churn, and each lazy load seeing a different snapshot — inconsistent reads
      within a single logical operation. It masks the design flaw rather than fixing it.
    ref: "concepts.md#more-anti-patterns-enable_lazy_load_no_trans-and-jackson"

  - id: fetching-lazy-eager-n-plus-one-058
    difficulty: expert
    tags: [anti-pattern, ranking, osiv, judgment]
    question: |
      Ranking EAGER mapping, `enable_lazy_load_no_trans`, and OSIV as ways to avoid
      LazyInitializationException, which statement is most accurate?
    options:
      - "All three are equally good production solutions"
      - "OSIV is worst because it never reuses a Session"
      - "All three are workarounds that mask the flaw; EAGER is worst (pollutes every query, unfixable per use case), while OSIV at least reuses one Session/transaction per request"
      - "enable_lazy_load_no_trans is the recommended fix"
    answer: 2
    explanation: |
      None is the right fix — that is fetching per use case in the query. Among the bad
      options, EAGER is worst (baked into every query, causes N+1/Cartesian products,
      cannot be scoped). `enable_lazy_load_no_trans` adds per-access transactions and
      inconsistent reads. OSIV holds a connection for the whole request and fires view-layer
      N+1, but reuses a single Session/transaction.
    ref: "concepts.md#more-anti-patterns-enable_lazy_load_no_trans-and-jackson"

  - id: fetching-lazy-eager-n-plus-one-059
    difficulty: advanced
    tags: [jackson, serialization, lazy-init, judgment]
    question: |
      A REST controller serializes a managed entity with lazy proxies after the
      transaction closed, hitting LazyInitializationException. A teammate adds the
      `jackson-datatype-hibernate` module. What does this actually do?
    options:
      - "It eagerly loads all lazy associations before serialization"
      - "It teaches Jackson to render uninitialized proxies as null/omit them — masking the problem the way OSIV does, rather than solving it; a DTO is the right boundary"
      - "It rewrites the entity mappings to EAGER at runtime"
      - "It reopens the Hibernate Session for serialization"
    answer: 1
    explanation: |
      `Hibernate6Module` makes Jackson skip/nullify uninitialized proxies so serialization
      no longer throws — but the data simply isn't there, and it masks the underlying
      fetch-plan problem just like OSIV. The correct answer at a serialization boundary is
      to project into a DTO that already holds exactly what the response needs.
    ref: "concepts.md#more-anti-patterns-enable_lazy_load_no_trans-and-jackson"

  - id: fetching-lazy-eager-n-plus-one-060
    difficulty: expert
    tags: [pagination, two-query, recipe, scenario]
    question: |
      You must return page 3 (20 per page) of posts ordered by createdAt, each with its
      comments, with no in-memory pagination. Which recipe is correct?
    options:
      - "One query: `select distinct p from Post p left join fetch p.comments order by p.createdAt` with setMaxResults(20)"
      - "Query 1 pages the parent IDs (order by + LIMIT, no collection); query 2 does `left join fetch p.comments where p.id in :ids`, re-applying the order by"
      - "Make comments EAGER and paginate normally"
      - "Use two JOIN FETCH collections and setFirstResult"
    answer: 1
    explanation: |
      A collection join fetch can't be paginated in SQL (HHH000104, in-memory paging). The
      production recipe is two queries: first select a page of parent IDs (LIMIT is legal
      with no collection), then fetch those parents with their comments via an IN clause —
      re-applying the order by in the second query, since IN does not preserve order.
    ref: "concepts.md#paginating-a-parent-with-its-children-two-query-recipe"

  - id: fetching-lazy-eager-n-plus-one-061
    difficulty: expert
    tags: [pagination, ordering, gotcha]
    question: |
      In the two-query pagination recipe (page IDs, then fetch entities with `where p.id in
      :ids`), why must the second query repeat the `order by`?
    options:
      - "To avoid a MultipleBagFetchException"
      - "The IN (:ids) clause does not preserve the ordering from query 1, so without an explicit order by the page rows can return in arbitrary order"
      - "Hibernate caches only ordered results"
      - "Because setMaxResults requires an order by"
    answer: 1
    explanation: |
      An `IN` predicate is a set membership test and gives no ordering guarantee. The
      database may return the matched rows in any order, so the second query must re-apply
      the same `order by` to preserve the intended page order.
    ref: "concepts.md#paginating-a-parent-with-its-children-two-query-recipe"

  - id: fetching-lazy-eager-n-plus-one-062
    difficulty: expert
    tags: [fetch-join, filter, destructive, data-loss]
    question: |
      `select p from Post p join fetch p.comments c where c.status = 'APPROVED'` returns
      managed Posts. What is the danger?
    options:
      - "The query throws because you can't filter a fetch join"
      - "Post.comments is hydrated with ONLY the approved comments but marked initialized; if the Post is flushed, Hibernate may delete the 'missing' comment rows or persist a corrupted collection"
      - "It silently switches to batch fetching"
      - "It always returns an empty collection"
    answer: 1
    explanation: |
      Filtering a fetch-joined collection produces a partial-but-initialized managed
      collection. On flush, Hibernate diffs it against the DB and can delete the rows it
      thinks were removed (for owned collections/orphan removal). Never put a WHERE
      predicate on a fetch-joined collection; filter in a DTO query, via @Where/@Filter, or
      in memory.
    ref: "concepts.md#filtering-a-fetch-joined-collection-destructive-fetch"

  - id: fetching-lazy-eager-n-plus-one-063
    difficulty: advanced
    tags: [fetch-join, filter, correct-approach]
    question: |
      You need Posts along with only their APPROVED comments for a read-only screen.
      Which approach avoids corrupting a managed collection?
    options:
      - "join fetch p.comments c where c.status = 'APPROVED' and return the entities"
      - "Project into a DTO/read query (not a managed collection), or filter in memory, or apply @Where/@Filter at the mapping level"
      - "Set the comments collection to EAGER"
      - "Use setMaxResults to limit comments"
    answer: 1
    explanation: |
      The safe options don't mutate a managed collection: project into DTOs (read-only, no
      managed state), fetch the full collection and filter in memory, or declare a
      consistent mapping-level filter (`@Where`/`@Filter`). A WHERE on a fetch-joined
      managed collection risks data loss on flush.
    ref: "concepts.md#filtering-a-fetch-joined-collection-destructive-fetch"

  - id: fetching-lazy-eager-n-plus-one-064
    difficulty: expert
    tags: [second-level-cache, query-cache, n-plus-one]
    question: |
      A team enables the query cache but not entity-region caching. Replaying a cached
      query becomes slower and fires many SELECTs. Why?
    options:
      - "The query cache is corrupt"
      - "The query cache stores only entity IDs; with the entities themselves not cached, replaying the query resolves each ID with a SELECT-by-id — reintroducing N+1"
      - "Query cache always disables lazy loading"
      - "The second-level cache evicts the query on every read"
    answer: 1
    explanation: |
      The query cache holds only the ordered list of entity IDs, not the entity data. If
      the referenced entity regions aren't cached (or were evicted), Hibernate rehydrates
      each row with a separate SELECT-by-id — a cache 'hit' that produces N SELECTs. Cache
      both the query and the entities it returns.
    ref: "concepts.md#second-level-cache-can-cause-n1"

  - id: fetching-lazy-eager-n-plus-one-065
    difficulty: advanced
    tags: [read-only, dirty-checking, performance]
    question: |
      What does loading entities under `@Transactional(readOnly = true)` (or the
      `org.hibernate.readOnly` query hint) change about how Hibernate manages them?
    options:
      - "It converts all associations to EAGER"
      - "It skips taking the dirty-checking snapshot (the detached-state copy), reducing memory/CPU since those entities won't be flushed"
      - "It disables lazy loading entirely"
      - "It bypasses the first-level cache"
    answer: 1
    explanation: |
      Read-only entities are loaded without the extra state snapshot Hibernate normally
      keeps to diff at flush time, so there's no dirty checking and no automatic UPDATE.
      This lowers memory and CPU on read paths and pairs with DTO projections as the
      'read model' strategy.
    ref: "concepts.md#read-only-reads-readonly-and-query-hints"

  - id: fetching-lazy-eager-n-plus-one-066
    difficulty: advanced
    tags: [entity-graph, type, fetch-vs-load]
    question: |
      In Spring Data, `@EntityGraph(value = "Post.withComments", type = EntityGraphType.LOAD)`
      differs from `EntityGraphType.FETCH` how?
    options:
      - "LOAD keeps unlisted attributes at their mapping default; FETCH makes unlisted attributes LAZY"
      - "LOAD is for writes, FETCH is for reads"
      - "They are identical aliases"
      - "LOAD ignores the graph entirely"
    answer: 0
    explanation: |
      A LOAD graph (`jakarta.persistence.loadgraph`) makes listed attributes EAGER and
      leaves unlisted ones at their mapping default. A FETCH graph
      (`jakarta.persistence.fetchgraph`) makes listed attributes EAGER and treats all
      unlisted ones as LAZY.
    ref: "concepts.md#entity-graphs-types-named-graphs-subgraphs"

  - id: fetching-lazy-eager-n-plus-one-067
    difficulty: advanced
    tags: [entity-graph, named-graph, api]
    question: |
      Which declares a reusable, named fetch plan on the entity that can be referenced by
      name from a repository or `em.getEntityGraph("...")`?
    options:
      - "@BatchSize(size = ...)"
      - "@Fetch(FetchMode.JOIN)"
      - "@NamedEntityGraph(name = \"...\", attributeNodes = @NamedAttributeNode(\"...\"))"
      - "@Transactional(readOnly = true)"
    answer: 2
    explanation: |
      `@NamedEntityGraph` on the entity defines a named graph; you reference it via
      `@EntityGraph(value = "name")` in Spring Data or `em.getEntityGraph("name")` and pass
      it as a fetch/load hint to `find()`. `attributePaths` (ad-hoc) is the unnamed
      alternative.
    ref: "concepts.md#entity-graphs-types-named-graphs-subgraphs"

  - id: fetching-lazy-eager-n-plus-one-068
    difficulty: expert
    tags: [entity-graph, subgraph, nested]
    question: |
      To fetch Post -> comments -> author in one plan programmatically, which is correct?
    options:
      - "graph.addAttributeNodes(\"comments\", \"author\")"
      - "graph.addSubgraph(\"comments\").addAttributeNodes(\"author\")"
      - "graph.addSubgraph(\"author\").addAttributeNodes(\"comments\")"
      - "You cannot express nested fetches with an entity graph"
    answer: 1
    explanation: |
      Nested fetch plans use subgraphs: `addSubgraph("comments")` descends into the
      comments association, and `addAttributeNodes("author")` on that subgraph fetches each
      comment's author. Flatly adding both as attribute nodes on the root would treat
      "author" as an attribute of Post, which is wrong.
    ref: "concepts.md#entity-graphs-types-named-graphs-subgraphs"

  - id: fetching-lazy-eager-n-plus-one-069
    difficulty: expert
    tags: [entity-graph, fetch-graph, eager-override, spec-vs-impl]
    question: |
      You define a FETCH graph that omits a `@ManyToOne(fetch = EAGER)` attribute, expecting
      it to be treated as LAZY. What is the realistic caveat?
    options:
      - "The spec and Hibernate both guarantee it becomes LAZY"
      - "The spec says unlisted attributes in a fetch graph are LAZY, but Hibernate has historically NOT reliably demoted a mapped-EAGER to-one to lazy — don't rely on a graph to turn off a mapped EAGER"
      - "It throws an exception at bootstrap"
      - "It silently switches the whole query to a load graph"
    answer: 1
    explanation: |
      Per spec, a fetch graph makes unlisted attributes LAZY. In practice Hibernate's
      honoring of that for mapped-EAGER to-one associations has been inconsistent across
      versions, so the EAGER association may still load. Fix the mapping rather than relying
      on a fetch graph to demote it.
    ref: "concepts.md#entity-graphs-types-named-graphs-subgraphs"

  - id: fetching-lazy-eager-n-plus-one-070
    difficulty: expert
    tags: [bytecode-enhancement, basic-lazy, gotcha]
    question: |
      You annotate a `@Lob String content` with `@Basic(fetch = FetchType.LAZY)` but the
      column still loads on every entity fetch. What is the most likely cause?
    options:
      - "@Basic does not have a fetch attribute"
      - "Build-time bytecode enhancement (enableLazyInitialization) is not enabled, so attribute-level laziness is silently ignored and the column loads eagerly"
      - "@Lob cannot be lazy under any configuration"
      - "You must also add @BatchSize to the field"
    answer: 1
    explanation: |
      Lazy basic attributes and no-proxy lazy to-one require the Hibernate bytecode
      enhancer at build time. Without `enableLazyInitialization`, `@Basic(fetch = LAZY)` is
      silently treated as EAGER. Enable the Gradle `org.hibernate.orm` plugin or the
      hibernate-enhance-maven-plugin.
    ref: "concepts.md#bytecode-enhancement-setup-and-lazygroup"

  - id: fetching-lazy-eager-n-plus-one-071
    difficulty: expert
    tags: [lazy-group, bytecode-enhancement, basic-lazy]
    question: |
      With bytecode enhancement on, an entity has three lazy `@Basic` attributes. Without
      `@LazyGroup`, how many secondary SELECTs load them, and what does `@LazyGroup` change?
    options:
      - "One SELECT already; @LazyGroup has no effect"
      - "Each lazy attribute loads via its own secondary SELECT; @LazyGroup(\"g\") batches attributes sharing a group name into a single secondary SELECT"
      - "They never load; @LazyGroup forces EAGER"
      - "Three SELECTs always, regardless of @LazyGroup"
    answer: 1
    explanation: |
      By default each lazy basic attribute is fetched by its own secondary SELECT on first
      access. Annotating several with the same `@LazyGroup("g")` batches them so they load
      together in one secondary SELECT.
    ref: "concepts.md#bytecode-enhancement-setup-and-lazygroup"

  - id: fetching-lazy-eager-n-plus-one-072
    difficulty: expert
    tags: [one-to-one, inverse, eager, maps-id]
    question: |
      An inverse (`mappedBy`) `@OneToOne(fetch = LAZY)` still triggers an eager SELECT. What
      is the root reason, and which mapping change lets it be lazy without bytecode
      enhancement?
    options:
      - "The FK lives on the child, so Hibernate must query to know if the association is null (can't proxy 'maybe null'); using @MapsId / a shared PK ties existence to the parent id and enables laziness"
      - "@OneToOne never supports LAZY; there is no fix"
      - "The owning side must also be LAZY; no other change needed"
      - "It is a Hibernate bug with no workaround"
    answer: 0
    explanation: |
      On the inverse side there is no FK column in the parent row, so Hibernate cannot know
      whether the child exists without a query, and it can't hand back a proxy for a
      possibly-null association — hence the eager SELECT. `@MapsId`/shared primary key ties
      the child's existence to the parent id, allowing laziness (bytecode enhancement is the
      other escape).
    ref: "concepts.md#why-an-inverse-lazy-onetoone-is-really-eager"

  - id: fetching-lazy-eager-n-plus-one-073
    difficulty: expert
    tags: [hibernate6, distinct, pass-distinct-through]
    question: |
      In Hibernate 6, what happened to `hibernate.query.passDistinctThrough`, and what does
      `select distinct p from Post p join fetch p.comments` do at the SQL level?
    options:
      - "It defaults to true; SQL DISTINCT is always emitted"
      - "It was removed; for entity fetch-join queries `distinct` de-duplicates the result list in memory and does NOT emit a SQL DISTINCT"
      - "It now forces a GROUP BY on all columns"
      - "It throws an error if distinct is used with join fetch"
    answer: 1
    explanation: |
      `hibernate.query.passDistinctThrough` was removed in Hibernate 6. For entity
      fetch-join queries, `distinct` only de-duplicates the Java result list in memory and
      does not push a needless SQL `DISTINCT`. (Scalar/DTO queries still emit SQL DISTINCT.)
    ref: "concepts.md#hibernate-67-fetching-behavior-changes"

  - id: fetching-lazy-eager-n-plus-one-074
    difficulty: intermediate
    tags: [hibernate6, batch-fetch-size, default]
    question: |
      What is the default value of `hibernate.default_batch_fetch_size`?
    options:
      - "16"
      - "1"
      - "-1 (batch fetching is disabled unless you set a positive value)"
      - "It equals the JDBC fetch size"
    answer: 2
    explanation: |
      The default is `-1`, meaning global batch fetching is off. You must set a positive
      value (e.g. 16) to enable it as a global N+1 safety net.
    ref: "concepts.md#hibernate-67-fetching-behavior-changes"

  - id: fetching-lazy-eager-n-plus-one-075
    difficulty: expert
    tags: [hibernate6, batch-fetch, in-clause-padding]
    question: |
      With batch fetching in Hibernate 6, a batch of 3 parent ids often generates
      `... where post_id in (?, ?, ?, ?)` — four binds for three ids. Why?
    options:
      - "It's a bug that duplicates rows"
      - "In-clause padding rounds the IN list up to the next power of two (2,4,8,16...) by repeating a bind value, to maximize prepared-statement / execution-plan cache reuse"
      - "The fourth bind is always NULL"
      - "Hibernate adds a bind for the parent table itself"
    answer: 1
    explanation: |
      Hibernate 6 pads the `IN (…)` list up to a power-of-two size (repeating an existing
      id as filler) so that batches of similar size share the same SQL string and thus the
      same prepared-statement and DB execution-plan cache entry — reducing plan-cache churn.
    ref: "concepts.md#hibernate-67-fetching-behavior-changes"

  - id: fetching-lazy-eager-n-plus-one-076
    difficulty: advanced
    tags: [testing, query-count, regression, ci]
    question: |
      Which is the senior-recommended way to prevent N+1 regressions from silently
      reappearing in CI?
    options:
      - "Manually eyeball show_sql output before each release"
      - "Assert the SQL statement count around a read path in a test — e.g. Hypersistence Utils' SQLStatementCountValidator.assertSelectCount(n), Statistics.getPrepareStatementCount(), or datasource-proxy/p6spy"
      - "Increase the connection pool size"
      - "Enable OSIV so lazy loads always succeed"
    answer: 1
    explanation: |
      Asserting the expected statement count in an automated test fails the build if an
      N+1 sneaks in. Tools: Hypersistence Utils `SQLStatementCountValidator`, Hibernate
      `Statistics.getPrepareStatementCount()` (with generate_statistics), or the
      datasource-proxy/p6spy JDBC proxies.
    ref: "concepts.md#asserting-query-counts-in-tests"

  - id: fetching-lazy-eager-n-plus-one-077
    difficulty: expert
    tags: [multiple-bag, fixes, ranking, multiset]
    question: |
      For MultipleBagFetchException on two `List` collections, rank the fixes. Which is the
      MODERN single-query option that avoids both the exception and a Cartesian product?
    options:
      - "Change both to Set — the best fix"
      - "Hibernate 6 array/multiset constructors (or Blaze-Persistence/jOOQ MULTISET), which fetch multiple collections in one query without a Cartesian product"
      - "Add @OrderColumn to only one list"
      - "Enable OSIV"
    answer: 1
    explanation: |
      List->Set works but still causes a Cartesian product ('so simple, so wrong'). Two
      queries in the same persistence context is the classic correct fix; @OrderColumn
      makes a list non-bag. The modern single-query-no-Cartesian option is HB6
      array/multiset constructors (or MULTISET via Blaze-Persistence/jOOQ), which aggregate
      each collection into a nested structure instead of multiplying rows.
    ref: "concepts.md#multiplebagfetchexception--cartesian-products"

