topic: "Entity Lifecycle Callbacks, Auditing & Interceptors"
domain: hibernate-jpa
topic_slug: lifecycle-callbacks-auditing-interceptors
version: 1
questions:
  - id: lifecycle-callbacks-auditing-interceptors-001
    difficulty: beginner
    tags: [callbacks, annotations, fundamentals]
    question: |
      How many JPA lifecycle callback annotations does Jakarta Persistence define, and which
      set is correct?
    options:
      - "Seven: @PrePersist, @PostPersist, @PreUpdate, @PostUpdate, @PreRemove, @PostRemove, @PostLoad"
      - "Four: @PrePersist, @PostPersist, @PreRemove, @PostRemove"
      - "Six: @PrePersist, @PostPersist, @PreUpdate, @PostUpdate, @PreRemove, @PostRemove"
      - "Eight, including @PreLoad and @PostLoad"
    answer: 0
    explanation: |
      JPA defines seven: the pre/post pairs for persist, update, and remove, plus @PostLoad.
      There is no @PreLoad callback.
    ref: "concepts.md#jpa-lifecycle-callbacks"

  - id: lifecycle-callbacks-auditing-interceptors-002
    difficulty: beginner
    tags: [prepersist, timestamps]
    question: |
      You want to set `createdAt` automatically when an entity is first inserted. Which
      callback should populate it?
    options:
      - "@PrePersist"
      - "@PostRemove"
      - "@PostLoad"
      - "@PreUpdate"
    answer: 0
    explanation: |
      @PrePersist fires when persist() is called, before the INSERT is scheduled — the right
      place to stamp a creation timestamp.
    ref: "concepts.md#jpa-lifecycle-callbacks"

  - id: lifecycle-callbacks-auditing-interceptors-003
    difficulty: intermediate
    tags: [preupdate, dirty-checking, gotcha]
    question: |
      A managed entity is loaded, and you set `order.setStatus(order.getStatus())` (same
      value) then commit. Does @PreUpdate fire?
    options:
      - "Yes, because the transaction committed"
      - "No, because @PreUpdate never fires inside a transaction"
      - "Yes, because a setter was called"
      - "No, because dirty checking finds no actual change so no UPDATE is generated"
    answer: 3
    explanation: |
      @PreUpdate is gated by dirty checking. Setting a field to its existing value is not a
      change, so no UPDATE is emitted at flush and the update callbacks do not run.
    ref: "concepts.md#why-preupdate-only-fires-on-a-real-dirty-update"

  - id: lifecycle-callbacks-auditing-interceptors-004
    difficulty: intermediate
    tags: [callback-restrictions, entitymanager, spec]
    question: |
      Per the Jakarta Persistence spec, what happens if you call `entityManager.persist()`
      on another entity from inside a @PrePersist callback?
    options:
      - "It throws IllegalStateException deterministically"
      - "It is guaranteed to work and cascades normally"
      - "It is undefined behavior — callbacks must not invoke EntityManager operations"
      - "It is allowed only for @PostPersist, not @PrePersist"
    answer: 2
    explanation: |
      The spec forbids invoking EntityManager/Query operations or touching other entities
      inside a callback; the result is undefined because callbacks run mid-flush.
    ref: "concepts.md#callback-rules-and-gotchas"

  - id: lifecycle-callbacks-auditing-interceptors-005
    difficulty: intermediate
    tags: [entitylisteners, signatures]
    question: |
      A lifecycle callback method declared on a separate @EntityListeners class must have
      which signature?
    options:
      - "One argument, returns the modified entity"
      - "Exactly one argument (the entity instance), returns void"
      - "Two arguments (entity, EntityManager), returns void"
      - "No arguments, returns void (same as on the entity)"
    answer: 1
    explanation: |
      On a listener class the callback takes exactly one argument — the entity (typed as the
      entity or Object) — and returns void. On the entity itself it takes no arguments.
    ref: "concepts.md#entitylisteners-and-external-listener-classes"

  - id: lifecycle-callbacks-auditing-interceptors-006
    difficulty: beginner
    tags: [auditing, spring-data]
    question: |
      Which Spring Data JPA annotation auto-populates the timestamp of the most recent
      modification on both insert and update?
    options:
      - "@Temporal"
      - "@Version"
      - "@LastModifiedDate"
      - "@CreatedDate"
    answer: 2
    explanation: |
      @LastModifiedDate is set on both insert and update. @CreatedDate is set only on insert;
      @Version is optimistic locking; @Temporal is a mapping annotation.
    ref: "concepts.md#spring-data-jpa-auditing"

  - id: lifecycle-callbacks-auditing-interceptors-007
    difficulty: intermediate
    tags: [auditing, enablejpaauditing, wiring]
    question: |
      To make Spring Data auditing populate @CreatedDate/@LastModifiedDate on an entity, what
      is the minimum wiring required?
    options:
      - "Only add @CreatedDate/@LastModifiedDate fields — auditing is on by default"
      - "Register a BeanPostProcessor for each entity"
      - "Just annotate the repository with @EnableJpaAuditing"
      - "@EnableJpaAuditing on a config class AND @EntityListeners(AuditingEntityListener.class) on the entity"
    answer: 3
    explanation: |
      You must enable auditing globally with @EnableJpaAuditing and attach the
      AuditingEntityListener to the entity (often via a @MappedSuperclass). @CreatedBy also
      needs an AuditorAware bean.
    ref: "concepts.md#spring-data-jpa-auditing"

  - id: lifecycle-callbacks-auditing-interceptors-008
    difficulty: intermediate
    tags: [auditing, createdby, auditoraware]
    question: |
      With Spring Data auditing, how does @CreatedBy learn *who* the current user is?
    options:
      - "It reads a thread-local set by Hibernate automatically"
      - "It calls a bean you provide implementing AuditorAware.getCurrentAuditor()"
      - "It parses the JDBC connection username"
      - "It reads the @CreatedBy value from the previous row"
    answer: 1
    explanation: |
      @CreatedBy/@LastModifiedBy are filled from your AuditorAware bean, typically reading the
      Spring Security context to return the current principal.
    ref: "concepts.md#spring-data-jpa-auditing"

  - id: lifecycle-callbacks-auditing-interceptors-009
    difficulty: advanced
    tags: [auditing, envers, comparison, judgment]
    question: |
      A compliance requirement is "reconstruct exactly what any record looked like at any
      past point in time." Which tool fits best?
    options:
      - "A @SQLRestriction filter"
      - "JPA @PreUpdate on the entity"
      - "Hibernate Envers @Audited with revision tables"
      - "Spring Data @LastModifiedDate/@LastModifiedBy"
    answer: 2
    explanation: |
      Envers stores full revision history in _AUD tables queryable as-of any revision. Spring
      auditing only keeps current who/when on the same row and no history.
    ref: "concepts.md#hibernate-envers-for-revision-history"

  - id: lifecycle-callbacks-auditing-interceptors-010
    difficulty: intermediate
    tags: [envers, tables, mechanism]
    question: |
      When you annotate an entity with @Audited, what does Envers create and maintain?
    options:
      - "A parallel audit table (default `<table>_AUD`) plus a global REVINFO table"
      - "An extra column on the same table storing a JSON diff"
      - "An in-memory log only, cleared on restart"
      - "Nothing until you call AuditReader.enable()"
    answer: 0
    explanation: |
      Envers writes each change to a `<table>_AUD` table (entity columns + revision number +
      revision type) and records revision timestamps in the shared REVINFO table.
    ref: "concepts.md#hibernate-envers-for-revision-history"

  - id: lifecycle-callbacks-auditing-interceptors-011
    difficulty: advanced
    tags: [envers, audit-strategy, tradeoff]
    question: |
      Your audit tables are heavily *read* (frequent "state as of revision N" queries) and
      you want faster reads. Which Envers audit strategy helps, and at what cost?
    options:
      - "DefaultAuditStrategy — faster reads, no write cost"
      - "There is only one strategy; you cannot change it"
      - "ValidityAuditStrategy — adds a REVEND column for faster reads, slightly slower writes"
      - "Switch to Spring Data auditing for faster reads"
    answer: 2
    explanation: |
      ValidityAuditStrategy writes a REVEND column marking when each audit row stopped being
      valid, avoiding the max-revision subquery on read — faster reads but it must update the
      prior row's REVEND, so writes are a bit slower.
    ref: "concepts.md#hibernate-envers-for-revision-history"

  - id: lifecycle-callbacks-auditing-interceptors-012
    difficulty: intermediate
    tags: [soft-delete, sqldelete]
    question: |
      What does annotating an entity with `@SQLDelete(sql = "UPDATE orders SET deleted=true
      WHERE id=?")` accomplish?
    options:
      - "It deletes the row and logs an UPDATE for auditing"
      - "It prevents the entity from ever being removed"
      - "It runs the UPDATE only for bulk JPQL deletes"
      - "It replaces the generated DELETE so em.remove() flips the flag instead of deleting"
    answer: 3
    explanation: |
      @SQLDelete overrides Hibernate's generated DELETE with your custom UPDATE, turning an
      entity-level remove() into a soft delete.
    ref: "concepts.md#soft-deletes-with-sqldelete-sqlrestriction-and-softdelete"

  - id: lifecycle-callbacks-auditing-interceptors-013
    difficulty: intermediate
    tags: [soft-delete, sqlrestriction, where]
    question: |
      In Hibernate 6.3+, which annotation replaces the deprecated `@Where` for filtering
      soft-deleted rows out of every SELECT?
    options:
      - "@SQLRestriction"
      - "@PostLoad"
      - "@Filter"
      - "@SoftDelete"
    answer: 0
    explanation: |
      @SQLRestriction("deleted = false") is the modern name for the deprecated @Where; it is
      appended to every SELECT for the entity and its collections.
    ref: "concepts.md#soft-deletes-with-sqldelete-sqlrestriction-and-softdelete"

  - id: lifecycle-callbacks-auditing-interceptors-014
    difficulty: advanced
    tags: [soft-delete, bulk, gotcha, judgment]
    question: |
      An entity uses @SQLDelete + @SQLRestriction for soft delete. A teammate runs
      `@Modifying @Query("DELETE FROM Order o WHERE o.old = true")`. What happens?
    options:
      - "The rows are soft-deleted and @PreRemove fires for each"
      - "The query is rejected at startup"
      - "The rows are hard-deleted — bulk JPQL bypasses @SQLDelete"
      - "The rows are soft-deleted via the @SQLDelete UPDATE"
    answer: 2
    explanation: |
      Bulk JPQL and native SQL bypass the persistence context, so @SQLDelete is not applied
      and no lifecycle callbacks fire — the rows are physically removed.
    ref: "concepts.md#soft-deletes-with-sqldelete-sqlrestriction-and-softdelete"

  - id: lifecycle-callbacks-auditing-interceptors-015
    difficulty: advanced
    tags: [post-callbacks, transaction, side-effects, judgment]
    question: |
      You want to publish a "shipment confirmed" message only after the DB change is durably
      committed. Why is @PostUpdate the wrong hook?
    options:
      - "@PostUpdate does not have access to the entity"
      - "@PostUpdate runs before the transaction commits and could still roll back"
      - "@PostUpdate runs asynchronously on another thread"
      - "@PostUpdate is only for inserts"
    answer: 1
    explanation: |
      Post callbacks fire after the SQL statement but still inside the flush/transaction,
      which can roll back. Use @TransactionalEventListener(phase = AFTER_COMMIT) for durable
      after-commit side effects.
    ref: "concepts.md#callback-rules-and-gotchas"

  - id: lifecycle-callbacks-auditing-interceptors-016
    difficulty: intermediate
    tags: [interceptor, spi, scope]
    question: |
      A SessionFactory-scoped `org.hibernate.Interceptor` (set via
      hibernate.session_factory.interceptor) has what key requirement?
    options:
      - "It must extend the entity class"
      - "It runs only in tests"
      - "It must be thread-safe because it is shared across all sessions"
      - "It may only implement onLoad"
    answer: 2
    explanation: |
      A SessionFactory-scoped interceptor is shared by every session, so it must be
      thread-safe. A session-scoped interceptor may be stateful since it is per-Session.
    ref: "concepts.md#hibernate-interceptor-and-the-event-listener-spi"

  - id: lifecycle-callbacks-auditing-interceptors-017
    difficulty: advanced
    tags: [interceptor, onflushdirty, mechanism]
    question: |
      Which Interceptor method lets you inspect and modify an entity's state right before its
      UPDATE is generated?
    options:
      - "postFlush"
      - "onLoad"
      - "onDelete"
      - "onFlushDirty(entity, id, currentState, previousState, ...)"
    answer: 3
    explanation: |
      onFlushDirty receives currentState and previousState arrays; mutating currentState and
      returning true changes the UPDATE. onLoad is for reads; postFlush is after flush.
    ref: "concepts.md#hibernate-interceptor-and-the-event-listener-spi"

  - id: lifecycle-callbacks-auditing-interceptors-018
    difficulty: expert
    tags: [event-listeners, envers, integrator]
    question: |
      How is Hibernate Envers itself implemented under the hood?
    options:
      - "As a JPA @EntityListeners class on every audited entity"
      - "As a database trigger generated at startup"
      - "As registered Hibernate event listeners (e.g. post-insert/update/delete) via an Integrator"
      - "As a Spring AOP aspect around repositories"
    answer: 2
    explanation: |
      Envers hooks Hibernate's event-listener SPI, registering post-event listeners through an
      Integrator/EventListenerRegistry to write audit rows in the same transaction.
    ref: "concepts.md#hibernate-interceptor-and-the-event-listener-spi"

  - id: lifecycle-callbacks-auditing-interceptors-019
    difficulty: intermediate
    tags: [postload, lazy, gotcha]
    question: |
      Why can touching a LAZY association inside a @PostLoad callback be dangerous?
    options:
      - "It permanently marks the entity dirty"
      - "It skips the second-level cache"
      - "It is illegal and fails to compile"
      - "It forces an extra SELECT, or a LazyInitializationException if the session later closes"
    answer: 3
    explanation: |
      @PostLoad runs when the entity is materialized; touching a lazy field triggers
      initialization (an extra query) and can throw LazyInitializationException once the
      session is closed. Keep @PostLoad to scalar post-processing.
    ref: "concepts.md#callback-rules-and-gotchas"

  - id: lifecycle-callbacks-auditing-interceptors-020
    difficulty: beginner
    tags: [callbacks, entity-method, signature]
    question: |
      A lifecycle callback method declared *on the entity itself* must have which signature?
    options:
      - "One argument (the entity), returns void"
      - "Static, no arguments, returns void"
      - "No arguments, returns boolean"
      - "No arguments, returns void"
    answer: 3
    explanation: |
      On the entity, a callback is an instance method with no arguments returning void (any
      name, any access modifier). The one-argument form is only for external listener classes.
    ref: "concepts.md#jpa-lifecycle-callbacks"

  - id: lifecycle-callbacks-auditing-interceptors-021
    difficulty: intermediate
    tags: [prepersist, timing, mechanism]
    question: |
      When exactly does @PrePersist run relative to persist()?
    options:
      - "Only when the entity is later loaded"
      - "Synchronously when persist() is called, before the INSERT is scheduled"
      - "After the transaction commits"
      - "At the next flush, just before the INSERT"
    answer: 1
    explanation: |
      @PrePersist (and @PreRemove) fire synchronously during the persist()/remove() call, not
      at flush. The post-callbacks and the update callbacks fire during flush when SQL runs.
    ref: "concepts.md#jpa-lifecycle-callbacks"

  - id: lifecycle-callbacks-auditing-interceptors-022
    difficulty: advanced
    tags: [postpersist, identity, timing]
    question: |
      With `GenerationType.IDENTITY`, why does @PostPersist fire earlier than it would with a
      sequence generator?
    options:
      - "@PostPersist always runs at persist() time regardless of strategy"
      - "IDENTITY disables dirty checking"
      - "Hibernate must run the INSERT immediately at persist() to obtain the generated key"
      - "IDENTITY skips the flush entirely"
    answer: 2
    explanation: |
      IDENTITY keys are produced by the DB on INSERT, so Hibernate cannot batch/delay it — it
      inserts at persist() time, and @PostPersist fires then rather than at a later flush.
    ref: "concepts.md#jpa-lifecycle-callbacks"

  - id: lifecycle-callbacks-auditing-interceptors-023
    difficulty: intermediate
    tags: [entitylisteners, ordering]
    question: |
      Given `@EntityListeners({A.class, B.class})` plus a @PrePersist method on the entity,
      what is the invocation order for a persist?
    options:
      - "B, then A, then the entity method"
      - "A, then B, then the entity's own callback method"
      - "Entity method, then A, then B"
      - "Only the entity method runs; listeners are ignored"
    answer: 1
    explanation: |
      Listeners run in declared order (A then B), superclass listeners before subclass
      listeners, and the entity's own callback methods run last.
    ref: "concepts.md#entitylisteners-and-external-listener-classes"

  - id: lifecycle-callbacks-auditing-interceptors-024
    difficulty: advanced
    tags: [auditing, mappedsuperclass, reuse]
    question: |
      What is the idiomatic way to give every entity in a codebase created/modified auditing
      without repeating annotations?
    options:
      - "Annotate each repository with @CreatedDate"
      - "Use a database trigger per table"
      - "Copy the four fields into each @Entity by hand"
      - "Put the audit fields + @EntityListeners(AuditingEntityListener.class) on a @MappedSuperclass base and extend it"
    answer: 3
    explanation: |
      A @MappedSuperclass carrying the audit fields and the AuditingEntityListener is inherited
      by all entities, centralizing the wiring. See inheritance-embeddables-composite-keys.
    ref: "concepts.md#spring-data-jpa-auditing"

  - id: lifecycle-callbacks-auditing-interceptors-025
    difficulty: intermediate
    tags: [callbacks, bulk, auditing-gap, gotcha]
    question: |
      Why is running audit-timestamp logic only in @PreUpdate risky when the app also uses
      bulk @Modifying update queries?
    options:
      - "Bulk updates throw if a @PreUpdate callback exists"
      - "Bulk JPQL/native updates bypass the persistence context, so callbacks never fire and timestamps are skipped"
      - "Bulk updates run @PreUpdate twice, double-stamping"
      - "There is no risk; bulk updates also trigger @PreUpdate"
    answer: 1
    explanation: |
      Bulk and native updates operate directly on the database and do not load entities into
      the context, so no lifecycle callback (and no AuditingEntityListener) runs — a classic
      auditing gap.
    ref: "concepts.md#why-preupdate-only-fires-on-a-real-dirty-update"

  - id: lifecycle-callbacks-auditing-interceptors-026
    difficulty: beginner
    tags: [postload, purpose]
    question: |
      Which callback is the correct place to derive a transient (non-persistent) display field
      right after an entity is read from the database?
    options:
      - "@PostRemove"
      - "@PreUpdate"
      - "@PostLoad"
      - "@PrePersist"
    answer: 2
    explanation: |
      @PostLoad fires after the entity is loaded/refreshed, making it the place to compute
      derived/transient state from persistent fields.
    ref: "concepts.md#jpa-lifecycle-callbacks"

  - id: lifecycle-callbacks-auditing-interceptors-027
    difficulty: advanced
    tags: [callbacks, exceptions, transaction]
    question: |
      What happens if a @PreUpdate callback throws a RuntimeException during flush?
    options:
      - "It propagates out of the flush and marks the transaction for rollback"
      - "Only that entity's update is skipped; others commit"
      - "It is swallowed and the UPDATE proceeds"
      - "Hibernate retries the callback three times"
    answer: 0
    explanation: |
      A RuntimeException from a callback propagates out of the flush and causes the transaction
      to roll back — callbacks are part of the persistence operation, not isolated from it.
    ref: "concepts.md#callback-rules-and-gotchas"

  - id: lifecycle-callbacks-auditing-interceptors-028
    difficulty: intermediate
    tags: [soft-delete, softdelete, hibernate-6-4]
    question: |
      What does Hibernate 6.4+'s `@SoftDelete` annotation provide over the manual @SQLDelete +
      @SQLRestriction approach?
    options:
      - "It hard-deletes but keeps a backup table"
      - "Nothing; it is just an alias"
      - "First-class soft delete: Hibernate manages the indicator column, rewrites deletes to updates, and auto-filters selects"
      - "It only works with native queries"
    answer: 2
    explanation: |
      @SoftDelete is first-class support: you declare the indicator column (and DELETED vs
      ACTIVE strategy) and Hibernate handles the delete-to-update rewrite and select filtering
      automatically, reducing boilerplate.
    ref: "concepts.md#soft-deletes-with-sqldelete-sqlrestriction-and-softdelete"

  - id: lifecycle-callbacks-auditing-interceptors-029
    difficulty: advanced
    tags: [interceptor, event-listener, judgment]
    question: |
      You must transparently set a `tenant_id` on every INSERT across all entities in a
      multi-tenant app. Which mechanism is most appropriate?
    options:
      - "A @PrePersist method copied into every entity"
      - "A Hibernate Interceptor / event listener applied SessionFactory-wide"
      - "A native trigger only"
      - "Spring Data @CreatedBy"
    answer: 1
    explanation: |
      Global cross-cutting concerns like multi-tenancy stamping belong in a Hibernate
      Interceptor or event listener that applies to every session/entity, not scattered
      per-entity callbacks. (Hibernate also has dedicated multi-tenancy support.)
    ref: "concepts.md#choosing-callbacks-vs-listeners-vs-envers-vs-interceptors"

  - id: lifecycle-callbacks-auditing-interceptors-030
    difficulty: intermediate
    tags: [callbacks, multiple, rules]
    question: |
      Which statement about combining callback annotations on one entity is correct?
    options:
      - "A single method may not carry more than one callback annotation"
      - "You can have several @PrePersist methods to run in sequence"
      - "Callback annotations cannot be combined with @EntityListeners"
      - "One method may carry multiple annotations (e.g. @PrePersist @PreUpdate), but you can declare at most one method per callback type per class"
    answer: 3
    explanation: |
      A method can be annotated with multiple callback types, but you may not declare two
      methods of the same callback type in one entity class.
    ref: "concepts.md#jpa-lifecycle-callbacks"

  - id: lifecycle-callbacks-auditing-interceptors-031
    difficulty: advanced
    tags: [envers, transaction, mechanism]
    question: |
      When are Envers audit rows written relative to the business transaction?
    options:
      - "Within the same transaction as the change (Envers hooks the flush/post-event listeners)"
      - "In a separate background transaction after commit"
      - "Only when you explicitly call AuditReader.save()"
      - "Before the transaction starts"
    answer: 0
    explanation: |
      Envers writes audit rows inside the same transaction via Hibernate's event listeners, so
      the audit trail is atomic with the change — if the tx rolls back, no audit row remains.
    ref: "concepts.md#hibernate-envers-for-revision-history"

  - id: lifecycle-callbacks-auditing-interceptors-032
    difficulty: intermediate
    tags: [auditing, envers, revinfo]
    question: |
      In Envers, how would you also record *which user* made each revision (not just the
      timestamp)?
    options:
      - "Add @CreatedBy to every audited entity"
      - "It is impossible; Envers only stores timestamps"
      - "Enable @SQLRestriction"
      - "Define a custom @RevisionEntity with an extra user column populated per revision"
    answer: 3
    explanation: |
      A custom @RevisionEntity (with @RevisionNumber and @RevisionTimestamp) can add fields
      such as the acting user, populated when a new revision is created.
    ref: "concepts.md#hibernate-envers-for-revision-history"

  - id: lifecycle-callbacks-auditing-interceptors-033
    difficulty: expert
    tags: [interceptor, hibernate-6, api-change]
    question: |
      Which change to the Interceptor SPI arrived with Hibernate 6.x?
    options:
      - "Interceptor was removed entirely"
      - "Method id parameters changed from Serializable to Object, and methods gained default bodies"
      - "Interceptors must now be Spring beans"
      - "onFlushDirty was renamed onLoad"
    answer: 1
    explanation: |
      Hibernate 6 changed id parameters from Serializable to Object and gave Interceptor
      methods default implementations (so you override only what you need); onSave/onDelete are
      being superseded by onPersist/onRemove-style methods.
    ref: "concepts.md#hibernate-interceptor-and-the-event-listener-spi"

  - id: lifecycle-callbacks-auditing-interceptors-034
    difficulty: intermediate
    tags: [postremove, timing]
    question: |
      When does @PostRemove fire?
    options:
      - "Only if the entity is later re-persisted"
      - "Before @PreRemove"
      - "After the DELETE statement executes at flush"
      - "Synchronously when remove() is called"
    answer: 2
    explanation: |
      @PreRemove fires synchronously at remove(); @PostRemove fires after the DELETE runs
      during flush.
    ref: "concepts.md#jpa-lifecycle-callbacks"

  - id: lifecycle-callbacks-auditing-interceptors-035
    difficulty: advanced
    tags: [auditing, async, auditoraware, gotcha]
    question: |
      @CreatedBy returns empty when an entity is saved from a background @Async thread but
      works in web requests. Why?
    options:
      - "AuditorAware reads the thread-bound SecurityContext, which is not propagated to the async thread"
      - "AuditingEntityListener is disabled off the request thread"
      - "The database connection differs"
      - "@Async threads cannot run JPA callbacks"
    answer: 0
    explanation: |
      A typical AuditorAware reads Spring Security's thread-bound SecurityContext. Background
      threads lack it unless you propagate the context, so the auditor resolves to empty.
    ref: "concepts.md#spring-data-jpa-auditing"

  - id: lifecycle-callbacks-auditing-interceptors-036
    difficulty: beginner
    tags: [auditing, createddate, insert-only]
    question: |
      When is a field annotated with @CreatedDate populated?
    options:
      - "On every update"
      - "On load"
      - "On delete"
      - "Only on the initial insert"
    answer: 3
    explanation: |
      @CreatedDate is set once at insert time. @LastModifiedDate is the one refreshed on every
      update.
    ref: "concepts.md#spring-data-jpa-auditing"

  - id: lifecycle-callbacks-auditing-interceptors-037
    difficulty: advanced
    tags: [soft-delete, unique-constraint, cross-domain, judgment]
    question: |
      With soft delete, you still need email addresses to be unique among *active* users.
      Where does this constraint properly live?
    options:
      - "As a partial/filtered unique index (e.g. UNIQUE ... WHERE deleted = false) at the DB level"
      - "In the AuditorAware bean"
      - "In @SQLRestriction on the entity"
      - "In a @PreUpdate callback that scans all rows"
    answer: 0
    explanation: |
      Enforcing uniqueness only among non-deleted rows is a data-model/DB concern — a partial
      unique index. Hibernate's soft-delete annotations only hide rows from queries; see
      messaging-databases for the modeling.
    ref: "concepts.md#soft-deletes-with-sqldelete-sqlrestriction-and-softdelete"

  - id: lifecycle-callbacks-auditing-interceptors-038
    difficulty: intermediate
    tags: [entitylisteners, spring, autowiring, gotcha]
    question: |
      Why does @Autowired typically return null inside a plain JPA @EntityListeners class?
    options:
      - "@Autowired is not supported in Java"
      - "JPA listeners run on a separate JVM"
      - "Plain JPA instantiates listener classes reflectively, so they are not Spring-managed beans"
      - "Listeners are proxied by Hibernate and lose their fields"
    answer: 2
    explanation: |
      The JPA provider constructs listener classes itself, not the Spring container, so
      injection does not happen. Spring's AuditingEntityListener is a wired exception via a
      static BeanFactory bridge installed by @EnableJpaAuditing.
    ref: "concepts.md#entitylisteners-and-external-listener-classes"

  - id: lifecycle-callbacks-auditing-interceptors-039
    difficulty: advanced
    tags: [version, preupdate, force-increment]
    question: |
      An entity's scalar fields are unchanged but you call
      `em.lock(entity, OPTIMISTIC_FORCE_INCREMENT)`. Can @PreUpdate fire even though no scalar
      field changed?
    options:
      - "Only @PostLoad can fire in this case"
      - "Yes — forcing a @Version increment produces an UPDATE, which can trigger the update callbacks"
      - "No — @PreUpdate needs a scalar field change"
      - "No — locking never generates SQL"
    answer: 1
    explanation: |
      A forced @Version bump (or a collection change) generates an UPDATE even when scalar
      fields look unchanged, so the update callbacks can run. See
      concurrency-optimistic-pessimistic-locking.
    ref: "concepts.md#why-preupdate-only-fires-on-a-real-dirty-update"

  - id: lifecycle-callbacks-auditing-interceptors-040
    difficulty: intermediate
    tags: [filter, sqlrestriction, comparison]
    question: |
      You need row visibility that varies per request (e.g. a tenant id chosen at runtime),
      not a fixed condition. Which Hibernate feature fits better than @SQLRestriction?
    options:
      - "@PostLoad"
      - "@Where"
      - "@SoftDelete"
      - "@Filter enabled per-session with session.enableFilter(...)"
    answer: 3
    explanation: |
      @SQLRestriction is static with no parameters. @Filter/@FilterDef supports parameterized
      conditions enabled per session, ideal for dynamic tenant/row filtering.
    ref: "concepts.md#soft-deletes-with-sqldelete-sqlrestriction-and-softdelete"

  - id: lifecycle-callbacks-auditing-interceptors-041
    difficulty: beginner
    tags: [callbacks, provider-invoked]
    question: |
      Who calls JPA lifecycle callback methods?
    options:
      - "The Spring container on bean creation"
      - "The persistence provider (Hibernate), automatically, at the right event"
      - "Your application code, explicitly"
      - "The database via a trigger"
    answer: 1
    explanation: |
      Lifecycle callbacks are provider-invoked; you never call them yourself. They fire around
      persistence events for managed entities.
    ref: "concepts.md#jpa-lifecycle-callbacks"

  - id: lifecycle-callbacks-auditing-interceptors-042
    difficulty: advanced
    tags: [envers, tradeoff, storage]
    question: |
      Which is a real operational drawback of enabling Envers broadly?
    options:
      - "Write amplification and unbounded audit-table growth without a retention/purge strategy"
      - "It forces EAGER fetching everywhere"
      - "It disables the second-level cache"
      - "It prevents optimistic locking"
    answer: 0
    explanation: |
      Every change writes an extra audit row, doubling writes and growing storage; you need a
      purge/retention plan and to migrate audit tables alongside the main schema.
    ref: "concepts.md#hibernate-envers-for-revision-history"

  - id: lifecycle-callbacks-auditing-interceptors-043
    difficulty: intermediate
    tags: [callbacks, allowed-mutation, rules]
    question: |
      According to the spec, what *is* a callback allowed to modify safely?
    options:
      - "Other entities in the same persistence context"
      - "The non-relationship (scalar) state of the entity the callback is invoked on"
      - "Relationships/associations of the entity"
      - "Nothing at all"
    answer: 1
    explanation: |
      A portable callback may modify the non-relationship state of its own entity (e.g. set a
      timestamp). Touching other entities or relationships is undefined behavior.
    ref: "concepts.md#callback-rules-and-gotchas"

  - id: lifecycle-callbacks-auditing-interceptors-044
    difficulty: expert
    tags: [event-listeners, integrator, mechanism]
    question: |
      How do you register a custom Hibernate event listener (e.g. for EventType.POST_INSERT)
      across the SessionFactory?
    options:
      - "Annotate the entity with @PostInsert"
      - "Call session.addListener() per query"
      - "Obtain the EventListenerRegistry (via an Integrator) and appendListeners for the event type"
      - "Add it to application.properties as a comma list"
    answer: 2
    explanation: |
      Hibernate's engine is event-driven; you register listeners through the
      EventListenerRegistry, typically from an Integrator, e.g.
      registry.appendListeners(EventType.POST_INSERT, listener).
    ref: "concepts.md#hibernate-interceptor-and-the-event-listener-spi"

  - id: lifecycle-callbacks-auditing-interceptors-045
    difficulty: intermediate
    tags: [judgment, layer-choice, summary]
    question: |
      A team just needs `createdAt`/`updatedAt` on one entity with no history and no framework
      dependency. What is the simplest correct choice?
    options:
      - "Hibernate Envers @Audited"
      - "@SoftDelete"
      - "A custom SessionFactory Interceptor"
      - "A @PrePersist/@PreUpdate pair on the entity (or Spring Data auditing if already using it)"
    answer: 3
    explanation: |
      Reach for the highest, simplest layer that solves the problem. Plain @PrePersist/@PreUpdate
      (or Spring Data auditing) cover simple timestamps; Envers and interceptors are overkill.
    ref: "concepts.md#choosing-callbacks-vs-listeners-vs-envers-vs-interceptors"

  - id: lifecycle-callbacks-auditing-interceptors-046
    difficulty: advanced
    tags: [postpersist, commit, durability, gotcha]
    question: |
      True or false: when @PostPersist runs, the inserted row is guaranteed to be durably
      committed to the database.
    options:
      - "False — @PostPersist runs before the INSERT"
      - "False — @PostPersist runs after the INSERT but still inside the transaction, which can roll back"
      - "True — the INSERT is auto-committed independently"
      - "True — post callbacks only run after commit"
    answer: 1
    explanation: |
      @PostPersist fires after the INSERT statement executes during flush, but the transaction
      has not committed yet and may still roll back — do not treat it as durability.
    ref: "concepts.md#callback-rules-and-gotchas"

  - id: lifecycle-callbacks-auditing-interceptors-047
    difficulty: intermediate
    tags: [auditing, datetimeprovider, testing]
    question: |
      In a test you want @CreatedDate to use a fixed clock for deterministic assertions. Which
      hook lets you override the time source for Spring Data auditing?
    options:
      - "Provide a DateTimeProvider bean referenced via @EnableJpaAuditing(dateTimeProviderRef=...)"
      - "Set @CreatedDate(fixed=true)"
      - "Use @PostLoad to reset the time"
      - "Mock the database clock"
    answer: 0
    explanation: |
      @EnableJpaAuditing(dateTimeProviderRef=...) points auditing at a custom DateTimeProvider,
      letting tests inject a fixed Clock for deterministic timestamps.
    ref: "concepts.md#spring-data-jpa-auditing"

  - id: lifecycle-callbacks-auditing-interceptors-048
    difficulty: expert
    tags: [callback-ordering, default-listeners, spec]
    question: |
      An entity extends a @MappedSuperclass that carries @EntityListeners(AuditListener.class),
      the entity itself declares @EntityListeners({A.class, B.class}) and a @PrePersist method,
      and orm.xml declares a <default-entity-listeners> class D. On persist, what is the exact
      invocation order?
    options:
      - "A, B, AuditListener, D, entity method"
      - "D, AuditListener, A, B, entity method"
      - "entity method, A, B, AuditListener, D"
      - "AuditListener, D, A, B, entity method"
    answer: 1
    explanation: |
      Spec order: default listeners (D) first, then superclass-hierarchy listeners (top-down,
      so AuditListener on the mapped superclass), then the entity's own @EntityListeners in
      array order (A then B), and finally the entity's own annotated callback method.
    ref: "concepts.md#callback-ordering-default-listeners-and-exclusions"

  - id: lifecycle-callbacks-auditing-interceptors-049
    difficulty: advanced
    tags: [exclusions, exclude-default-listeners, spec]
    question: |
      What is the effect of placing @ExcludeDefaultListeners on an entity?
    options:
      - "It removes the entity's own @EntityListeners"
      - "It disables all lifecycle callbacks for the entity"
      - "It suppresses the orm.xml <default-entity-listeners> for that class (and its subclasses)"
      - "It stops listeners inherited from mapped superclasses"
    answer: 2
    explanation: |
      @ExcludeDefaultListeners suppresses the default listeners declared in orm.xml. Suppressing
      listeners inherited from superclasses is a different annotation, @ExcludeSuperclassListeners;
      neither disables the entity's own declared listeners or callbacks.
    ref: "concepts.md#callback-ordering-default-listeners-and-exclusions"

  - id: lifecycle-callbacks-auditing-interceptors-050
    difficulty: advanced
    tags: [auditing, silent-bug, entitylisteners]
    question: |
      @EnableJpaAuditing is on your @Configuration class and the entity has @CreatedDate /
      @LastModifiedDate fields, but the fields stay null on every save with no error. What is
      the most likely cause?
    options:
      - "The entity is missing @EntityListeners(AuditingEntityListener.class) and no default listener is registered"
      - "AuditorAware is not defined"
      - "@CreatedDate must be a java.util.Date, not Instant"
      - "@EnableJpaAuditing must be on the main application class only"
    answer: 0
    explanation: |
      Auditing rides on the AuditingEntityListener. Without attaching it to the entity (directly,
      via a @MappedSuperclass, or as an orm.xml default listener) nothing populates the fields —
      and no exception is thrown, so it fails silently.
    ref: "concepts.md#callback-ordering-default-listeners-and-exclusions"

  - id: lifecycle-callbacks-auditing-interceptors-051
    difficulty: expert
    tags: [dynamic-update, sql, mechanism]
    question: |
      Without @DynamicUpdate, you change one field of a 40-column entity and flush. What SQL
      does Hibernate emit, and why?
    options:
      - "An UPDATE touching only the one changed column, rebuilt each flush"
      - "No UPDATE — single-column changes are batched separately"
      - "An UPDATE setting all 40 columns, using a statement string built once and cached per entity"
      - "A DELETE followed by an INSERT"
    answer: 2
    explanation: |
      By default Hibernate generates one static UPDATE that sets every column, and caches that
      SQL string per entity type for reuse. @DynamicUpdate is what makes it regenerate SQL per
      flush to include only the dirty columns.
    ref: "concepts.md#dynamicupdate-dynamicinsert-and-callback-interplay"

  - id: lifecycle-callbacks-auditing-interceptors-052
    difficulty: expert
    tags: [dynamic-update, preupdate, interplay]
    question: |
      An entity has @DynamicUpdate and a @PreUpdate that sets `updatedAt = Instant.now()`. You
      change only `status` and flush. Which columns appear in the dynamic UPDATE's SET clause?
    options:
      - "Only status — @PreUpdate runs after the SQL is built"
      - "All columns, because @PreUpdate defeats dynamic update"
      - "Only updatedAt, because the callback overrides the dirty set"
      - "Both status and updatedAt — @PreUpdate runs before the SQL is built and dirty state is re-derived"
    answer: 3
    explanation: |
      @PreUpdate runs before Hibernate builds the UPDATE SQL, so the updatedAt mutation is part
      of the dirty set. With @DynamicUpdate the SET clause contains exactly the dirty columns:
      status and updatedAt.
    ref: "concepts.md#dynamicupdate-dynamicinsert-and-callback-interplay"

  - id: lifecycle-callbacks-auditing-interceptors-053
    difficulty: advanced
    tags: [dynamic-update, tradeoff, performance]
    question: |
      What is the primary cost of enabling @DynamicUpdate on a frequently-updated entity?
    options:
      - "It forces EAGER loading of all associations"
      - "The UPDATE SQL is no longer cached and is regenerated on every flush"
      - "It disables dirty checking"
      - "It prevents @PreUpdate from firing"
    answer: 1
    explanation: |
      Because the SET clause varies with the dirty column set, Hibernate cannot cache one
      prepared statement string; it builds new SQL each flush, costing CPU/allocation. It does
      not change whether callbacks fire or how dirty checking works.
    ref: "concepts.md#dynamicupdate-dynamicinsert-and-callback-interplay"

  - id: lifecycle-callbacks-auditing-interceptors-054
    difficulty: intermediate
    tags: [creation-timestamp, hibernate-native, no-spring]
    question: |
      You want automatic createdAt/updatedAt but the project does not use Spring Data (no
      @EnableJpaAuditing). Which Hibernate-native annotations achieve this with no listener?
    options:
      - "@CreatedDate / @LastModifiedDate"
      - "@Temporal / @Version"
      - "@CreationTimestamp / @UpdateTimestamp"
      - "@PrePersist only"
    answer: 2
    explanation: |
      Hibernate's @CreationTimestamp (set at insert) and @UpdateTimestamp (refreshed on update)
      populate timestamps with no AuditingEntityListener or Spring wiring. @CreatedDate/
      @LastModifiedDate are the Spring Data equivalents that require @EnableJpaAuditing.
    ref: "concepts.md#hibernate-native-timestamps-creationtimestamp-updatetimestamp-currenttimestamp"

  - id: lifecycle-callbacks-auditing-interceptors-055
    difficulty: advanced
    tags: [current-timestamp, source-db-vm, clock]
    question: |
      Your app servers occasionally have clock skew and you want timestamps to come from a
      single authoritative source. Which Hibernate 6 option uses the database clock?
    options:
      - "@CreationTimestamp (it always uses the DB clock)"
      - "@CurrentTimestamp(source = SourceType.DB), which generates current_timestamp in SQL"
      - "@LastModifiedDate with a DateTimeProvider"
      - "There is no way; JPA always uses the JVM clock"
    answer: 1
    explanation: |
      @CurrentTimestamp(source = SourceType.DB) emits current_timestamp so the database supplies
      the time. SourceType.VM (the default, and what @CreationTimestamp/@UpdateTimestamp use)
      relies on the JVM clock.
    ref: "concepts.md#hibernate-native-timestamps-creationtimestamp-updatetimestamp-currenttimestamp"

  - id: lifecycle-callbacks-auditing-interceptors-056
    difficulty: expert
    tags: [soft-delete, defaults, sql]
    question: |
      You annotate an entity with a bare `@SoftDelete` (no attributes). What column and
      semantics does Hibernate 6.4+ use by default?
    options:
      - "A column named `active` with ACTIVE semantics"
      - "A column named `deleted` (boolean) with DELETED semantics"
      - "A column named `is_deleted` with a timestamp"
      - "No column; it uses a separate audit table"
    answer: 1
    explanation: |
      Default strategy is SoftDeleteType.DELETED and the default column is a boolean `deleted`.
      With strategy = ACTIVE the convention flips to an `active` column with inverted meaning.
    ref: "concepts.md#softdelete-internals-defaults-converters-and-generated-sql"

  - id: lifecycle-callbacks-auditing-interceptors-057
    difficulty: expert
    tags: [soft-delete, generated-sql, code-reading]
    question: |
      For a default @SoftDelete entity, what UPDATE does `em.remove(account)` generate at flush?
    options:
      - "delete from Account where id=?"
      - "update Account set deleted=true where id=?"
      - "update Account set deleted=true where id=? and deleted=false"
      - "update Account set active=false where id=?"
    answer: 2
    explanation: |
      @SoftDelete rewrites the delete to a guarded UPDATE that also asserts the row was not
      already deleted: `update Account set deleted=true where id=? and deleted=false`. The same
      predicate is appended to selects, including primary-key fetches.
    ref: "concepts.md#softdelete-internals-defaults-converters-and-generated-sql"

  - id: lifecycle-callbacks-auditing-interceptors-058
    difficulty: advanced
    tags: [soft-delete, converter, legacy-schema]
    question: |
      A legacy table stores its soft-delete flag as a CHAR 'Y'/'N' rather than a boolean. How do
      you map it with @SoftDelete?
    options:
      - "@SoftDelete(converter = YesNoConverter.class)"
      - "@SoftDelete(columnType = CHAR)"
      - "You cannot; @SoftDelete only supports boolean columns"
      - "@SoftDelete(strategy = SoftDeleteType.CHAR)"
    answer: 0
    explanation: |
      The indicator's Java type is Boolean, but a converter maps it to the physical column.
      Hibernate ships YesNoConverter ('Y'/'N') and NumericBooleanConverter (1/0) for legacy
      schemas; the generated SQL then uses those literals.
    ref: "concepts.md#softdelete-internals-defaults-converters-and-generated-sql"

  - id: lifecycle-callbacks-auditing-interceptors-059
    difficulty: expert
    tags: [soft-delete, jpql, hard-delete, judgment]
    question: |
      An entity uses @SoftDelete. A developer runs a JPQL `DELETE FROM Account a WHERE a.id = 1`.
      What happens to the row?
    options:
      - "It is soft-deleted (deleted=true) like em.remove()"
      - "The statement is rejected at parse time"
      - "It is physically hard-deleted — bulk JPQL bypasses the soft-delete rewrite"
      - "Both a soft-delete UPDATE and a DELETE run"
    answer: 2
    explanation: |
      Like @SQLDelete, @SoftDelete only intercepts entity-level remove(). Bulk JPQL/native DELETE
      operates directly on the table and hard-deletes the row, bypassing the indicator rewrite.
    ref: "concepts.md#softdelete-internals-defaults-converters-and-generated-sql"

  - id: lifecycle-callbacks-auditing-interceptors-060
    difficulty: advanced
    tags: [soft-delete, in-memory-state, sqldelete, distinction]
    question: |
      With the classic @SQLDelete + @SQLRestriction pattern, after `em.remove(order)` the managed
      `order.deleted` field is still false in memory. Why, and what is the clean fix?
    options:
      - "Hibernate does not parse your native @SQLDelete SQL, so it can't update the field; add a @PreRemove to set deleted=true (or migrate to @SoftDelete)"
      - "Hibernate cached the entity; call em.refresh() — no other fix exists"
      - "It is a bug with no workaround"
      - "The field updates only after commit; nothing to fix"
    answer: 0
    explanation: |
      Hibernate treats the @SQLDelete SQL as opaque native text and does not reflect it back onto
      the managed instance, so the in-memory flag goes stale. Add a @PreRemove that sets the flag,
      or use @SoftDelete which manages the in-session state automatically.
    ref: "concepts.md#sqldelete-gotchas-loader-sqldeleteall-and-stale-in-memory-state"

  - id: lifecycle-callbacks-auditing-interceptors-061
    difficulty: expert
    tags: [sqldelete, where, loader, findById]
    question: |
      Using @SQLDelete + @Where("deleted=false") (Hibernate 5.2+), a bug report says
      `findById(deletedId)` still returns the deleted row. Why historically, and what was the fix?
    options:
      - "@Where only filters query/collection loads, not direct PK fetch; a custom @Loader was needed to filter direct fetches too"
      - "findById never applies @Where or @SQLRestriction under any version"
      - "The row was cached in the second-level cache; disable 2LC"
      - "@Where must be spelled @SQLRestriction to work at all"
    answer: 0
    explanation: |
      Historically @Where/@SQLRestriction applied to queries and collections but not to a direct
      em.find() by primary key, so a custom @Loader(namedQuery=...) was required to filter direct
      fetches. @SoftDelete filters PK fetches automatically, removing the need for @Loader.
    ref: "concepts.md#sqldelete-gotchas-loader-sqldeleteall-and-stale-in-memory-state"

  - id: lifecycle-callbacks-auditing-interceptors-062
    difficulty: advanced
    tags: [sqldelete, sqldeleteall, collections]
    question: |
      You added @SQLDelete to soft-delete an entity, but clearing a @ManyToMany collection still
      hard-deletes the join-table rows. What did you miss?
    options:
      - "@SQLRestriction on the collection"
      - "@SQLDeleteAll to override the bulk collection remove"
      - "orphanRemoval = false"
      - "@Filter on the join table"
    answer: 1
    explanation: |
      @SQLDelete overrides the per-row delete; the bulk remove issued when a collection is
      cleared/replaced is overridden by @SQLDeleteAll. Without it the collection DML still runs a
      hard DELETE on the join rows.
    ref: "concepts.md#sqldelete-gotchas-loader-sqldeleteall-and-stale-in-memory-state"

  - id: lifecycle-callbacks-auditing-interceptors-063
    difficulty: expert
    tags: [envers, auditquery, as-of, code-reading]
    question: |
      You must answer "which orders had total over $100 as the database stood at revision 500?"
      Which Envers AuditQuery form is correct?
    options:
      - "reader.getRevisions(Order.class, id)"
      - "reader.createQuery().forRevisionsOfEntity(Order.class, false, true)"
      - "reader.find(Order.class, id, 500)"
      - "reader.createQuery().forEntitiesAtRevision(Order.class, 500).add(AuditEntity.property(\"total\").gt(100))"
    answer: 3
    explanation: |
      forEntitiesAtRevision(type, rev) reconstructs the DB state of that type at a revision
      (horizontal query), and AuditEntity.property("total").gt(100) filters it. forRevisionsOfEntity
      is the vertical "all revisions of one entity" query; find() and getRevisions() target a
      single id.
    ref: "concepts.md#envers-deep-dive-auditquery-revisionlistener-and-configuration"

  - id: lifecycle-callbacks-auditing-interceptors-064
    difficulty: expert
    tags: [envers, revision-listener, acting-user, distinction]
    question: |
      How does Envers record *who* performed each change, and how does that differ structurally
      from Spring Data's @CreatedBy?
    options:
      - "It reads AuditorAware directly; there is no structural difference"
      - "A RevisionListener.newRevision() stamps the user into REVINFO — one row per transaction — vs @CreatedBy stamping per changed row"
      - "It stores the user in a thread-local read at query time"
      - "Envers cannot capture the user; only timestamps"
    answer: 1
    explanation: |
      A custom @RevisionEntity + RevisionListener.newRevision() writes the acting user into the
      shared REVINFO revision (one row per transaction). Spring's @CreatedBy/@LastModifiedBy write
      the user onto each entity row via AuditorAware.
    ref: "concepts.md#envers-deep-dive-auditquery-revisionlistener-and-configuration"

  - id: lifecycle-callbacks-auditing-interceptors-065
    difficulty: expert
    tags: [envers, store-data-at-delete, null-row]
    question: |
      `reader.find(Order.class, 42L, delRev)` for the revision that deleted the entity returns
      null/all-null fields. Why, and how do you keep the last state?
    options:
      - "The revision number is wrong; there is no fix"
      - "By default a DEL row stores only the id with other columns NULL; set org.hibernate.envers.store_data_at_delete=true (or query with selectDeletedEntities=true)"
      - "Envers purged the row; restore from backup"
      - "find() never returns deleted revisions; use getRevisions()"
    answer: 1
    explanation: |
      Envers' DEL (REVTYPE=2) rows store only the id with the rest NULL by default. Enable
      store_data_at_delete=true to snapshot the last state into the delete revision, or query
      forRevisionsOfEntity(..., selectDeletedEntities=true).
    ref: "concepts.md#envers-deep-dive-auditquery-revisionlistener-and-configuration"

  - id: lifecycle-callbacks-auditing-interceptors-066
    difficulty: advanced
    tags: [envers, revtype, audit-table-reading]
    question: |
      Reading a raw _AUD table, you see a REVTYPE column with values 0, 1, and 2. What do they
      mean?
    options:
      - "0=DEL, 1=ADD, 2=MOD"
      - "0=ADD, 1=MOD, 2=DEL"
      - "0=MOD, 1=DEL, 2=ADD"
      - "They are revision numbers, not types"
    answer: 1
    explanation: |
      RevisionType is stored as an integer: 0=ADD (insert), 1=MOD (update), 2=DEL (delete).
      Knowing this lets you interpret audit tables directly in SQL.
    ref: "concepts.md#envers-deep-dive-auditquery-revisionlistener-and-configuration"

  - id: lifecycle-callbacks-auditing-interceptors-067
    difficulty: expert
    tags: [second-level-cache, soft-delete, leak, judgment]
    question: |
      A soft-deleted (via @SQLRestriction) row keeps appearing when navigated through a cached
      @ManyToOne association or via em.getReference(). Why?
    options:
      - "@SQLRestriction is buggy for associations"
      - "The predicate is applied to generated SQL only; the 2LC/getReference serve the entity without re-running that SQL, so the filter isn't re-checked"
      - "getReference always bypasses soft delete by design and cannot be fixed"
      - "The row was never actually soft-deleted"
    answer: 1
    explanation: |
      @SQLRestriction/@Filter/@SoftDelete are query-time SQL predicates. When an entity is served
      from the second-level cache or via getReference (no SELECT executed), the predicate isn't
      re-evaluated in memory, so filtered/soft-deleted rows can leak. Treat filters as query-time,
      not entity-state, invariants.
    ref: "concepts.md#second-level-cache-filters-and-soft-delete-leaks"

  - id: lifecycle-callbacks-auditing-interceptors-068
    difficulty: expert
    tags: [statement-inspector, interceptor, distinction]
    question: |
      You need to rewrite/annotate the raw SQL string Hibernate sends (e.g. add a query tag
      comment) just before execution. Which hook is designed for that?
    options:
      - "Interceptor.onFlushDirty"
      - "A @PostLoad callback"
      - "StatementInspector"
      - "A PRE_INSERT event listener"
    answer: 2
    explanation: |
      StatementInspector is the SPI for inspecting/rewriting the SQL text before execution.
      Interceptor works at the entity-state level and never sees SQL text; event listeners hook
      entity operations, not the SQL string.
    ref: "concepts.md#statementinspector-veto-and-post-commit-listeners"

  - id: lifecycle-callbacks-auditing-interceptors-069
    difficulty: expert
    tags: [event-listener, veto, pre-update]
    question: |
      What capability does a Hibernate PRE_UPDATE (or PRE_INSERT/PRE_DELETE) event listener have
      that a JPA @PreUpdate callback does not?
    options:
      - "It can veto the operation by returning true, cancelling the SQL"
      - "It can set the created timestamp"
      - "It runs after commit"
      - "It can modify the entity's scalar fields"
    answer: 0
    explanation: |
      Pre-event listeners can return true to veto (cancel) the operation. A JPA @PreUpdate cannot
      cancel the UPDATE; it can only mutate the entity's own non-relationship fields and throw to
      trigger rollback.
    ref: "concepts.md#statementinspector-veto-and-post-commit-listeners"

  - id: lifecycle-callbacks-auditing-interceptors-070
    difficulty: expert
    tags: [interceptor, preupdate, event-listener, distinction]
    question: |
      Which statement best distinguishes Interceptor.onFlushDirty from a @PreUpdate callback?
    options:
      - "They are identical; onFlushDirty is just the older name"
      - "@PreUpdate can veto the UPDATE; onFlushDirty cannot"
      - "onFlushDirty can mutate the currentState[] array (changing the SQL directly) and is Hibernate-only; @PreUpdate is portable JPA and only mutates the entity's own fields"
      - "onFlushDirty runs after commit; @PreUpdate runs before flush"
    answer: 2
    explanation: |
      onFlushDirty receives and can mutate the currentState[] snapshot array (changing what the
      UPDATE writes) and is a Hibernate-specific SessionFactory/session hook. @PreUpdate is
      portable JPA, per-entity, and can only modify the entity's own non-relationship fields.
    ref: "concepts.md#statementinspector-veto-and-post-commit-listeners"

  - id: lifecycle-callbacks-auditing-interceptors-071
    difficulty: advanced
    tags: [postload, second-level-cache, timing]
    question: |
      Does @PostLoad fire for an entity that is served from the second-level cache (no SQL SELECT
      executed)?
    options:
      - "No — @PostLoad only fires after an actual SELECT"
      - "Yes — @PostLoad fires when the entity is materialized into the context, including from the 2LC"
      - "Only if you call em.refresh()"
      - "Only for EAGER associations"
    answer: 1
    explanation: |
      @PostLoad is about materialization into the persistence context, not about SQL. It fires on
      find, JPQL load, refresh, lazy-proxy initialization, and even for entities assembled from the
      second-level cache with no SELECT.
    ref: "concepts.md#callback-rules-and-gotchas"

  - id: lifecycle-callbacks-auditing-interceptors-072
    difficulty: advanced
    tags: [preupdate, autoflush, timing, gotcha]
    question: |
      You run a JPQL SELECT while a dirty managed entity sits in the persistence context. You are
      surprised to see @PreUpdate fire mid-method. Why?
    options:
      - "JPQL SELECTs always modify entities"
      - "Auto-flush before the query flushes pending changes, triggering the dirty entity's UPDATE and its @PreUpdate"
      - "@PreUpdate fires on every query regardless of state"
      - "The entity was reloaded, calling @PreUpdate"
    answer: 1
    explanation: |
      To keep query results consistent, Hibernate auto-flushes pending changes before executing a
      query that touches the affected tables. That flush emits the UPDATE for the dirty entity, so
      @PreUpdate fires at a surprising point mid-method.
    ref: "concepts.md#why-preupdate-only-fires-on-a-real-dirty-update"

  - id: lifecycle-callbacks-auditing-interceptors-073
    difficulty: advanced
    tags: [auditing, modifyOnCreate, spring-data]
    question: |
      By default with Spring Data auditing, is @LastModifiedDate also set at insert time (not just
      on updates)?
    options:
      - "No — @LastModifiedDate is only ever set on updates"
      - "Only if the entity has no @CreatedDate"
      - "It is set on insert only for new-style Instant fields"
      - "Yes by default; @EnableJpaAuditing(modifyOnCreate=false) can suppress setting it on insert"
    answer: 3
    explanation: |
      By default @LastModifiedDate is populated on insert as well as update (so created and
      modified match initially). @EnableJpaAuditing(modifyOnCreate=false) tells the handler not to
      set the modified fields during the initial insert.
    ref: "concepts.md#spring-data-jpa-auditing"

  - id: lifecycle-callbacks-auditing-interceptors-074
    difficulty: expert
    tags: [auditing, internals, objectfactory, autowiring]
    question: |
      Why can Spring's AuditingEntityListener resolve an AuditorAware bean while a plain
      @EntityListeners class cannot @Autowired anything?
    options:
      - "AuditingEntityListener is a Spring @Component scanned normally"
      - "@EnableJpaAuditing registers a BeanFactory-backed bridge (a lazily-injected ObjectFactory<AuditingHandler>) that the listener resolves through, since JPA instantiates listeners reflectively"
      - "Plain listeners can also @Autowired; the question is wrong"
      - "AuditingEntityListener uses a database trigger to fetch collaborators"
    answer: 1
    explanation: |
      The JPA provider constructs listener instances reflectively, outside the Spring container, so
      normal @Autowired is null. @EnableJpaAuditing installs a static BeanFactory-backed bridge
      (an ObjectFactory<AuditingHandler>) that AuditingEntityListener uses to obtain its
      collaborators lazily.
    ref: "concepts.md#entitylisteners-and-external-listener-classes"

  - id: lifecycle-callbacks-auditing-interceptors-075
    difficulty: intermediate
    tags: [tenant-id, multi-tenancy, hibernate-6]
    question: |
      In Hibernate 6, what is the modern declarative way to stamp and filter by a tenant
      discriminator, rather than hand-rolling a @PrePersist tenant setter?
    options:
      - "@TenantId with a CurrentTenantIdentifierResolver"
      - "@CreatedBy on a tenant field"
      - "@SQLRestriction(\"tenant_id = ?\")"
      - "A @PostLoad that checks the tenant"
    answer: 0
    explanation: |
      Hibernate 6's @TenantId, combined with a CurrentTenantIdentifierResolver, declaratively sets
      the tenant on insert and filters reads by it — the current answer for discriminator-based
      multi-tenancy, superseding manual @PrePersist stamping.
    ref: "concepts.md#hibernate-native-timestamps-creationtimestamp-updatetimestamp-currenttimestamp"
