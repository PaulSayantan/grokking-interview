topic: ORM Fundamentals & JPA vs Hibernate
domain: hibernate-jpa
topic_slug: orm-fundamentals-jpa-vs-hibernate
version: 1
questions:
- id: orm-fundamentals-jpa-vs-hibernate-001
  difficulty: beginner
  tags:
  - jpa
  - spec-vs-impl
  - definitions
  question: |
    Which statement most accurately describes the relationship between JPA and
    Hibernate?
  options:
  - JPA and Hibernate are two independent ORM libraries you choose between at runtime
  - JPA replaced Hibernate; Hibernate is no longer maintained
  - Hibernate is the specification and JPA is Oracle's implementation of it
  - JPA is a specification (interfaces + annotations) and Hibernate is an implementation of it plus native
    features
  answer: 3
  explanation: |
    JPA (Jakarta Persistence) is a specification: a set of interfaces
    (EntityManager, etc.) and annotations in jakarta.persistence.*. Hibernate is
    the most-used provider that implements that spec and adds a large superset of
    native features. You use JPA *through* Hibernate.
  ref: concepts.md#jpa-the-specification-jakarta-persistence
- id: orm-fundamentals-jpa-vs-hibernate-002
  difficulty: beginner
  tags:
  - impedance-mismatch
  - orm
  question: |
    The "object-relational impedance mismatch" refers to which fundamental problem?
  options:
  - Objects and relational tables use incompatible character encodings
  - JDBC drivers are slower than object serialization
  - The object model (classes, references, inheritance, reference identity) and the relational model (tables,
    foreign keys, PK identity) follow fundamentally different rules that an ORM must reconcile
  - Databases cannot store objects, only strings
  answer: 2
  explanation: |
    The impedance mismatch is the set of structural differences between the object
    world and the relational world — granularity, inheritance, identity,
    associations, and data navigation — that an ORM has to bridge.
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-003
  difficulty: intermediate
  tags:
  - reference-implementation
  - providers
  - eclipselink
  question: |
    Which product is the OFFICIAL reference implementation of the Jakarta
    Persistence specification?
  options:
  - Hibernate ORM
  - Apache OpenJPA
  - Spring Data JPA
  - EclipseLink
  answer: 3
  explanation: |
    EclipseLink (descended from Oracle TopLink) is the official reference
    implementation of Jakarta Persistence. Hibernate is the most *popular* provider
    and Spring Boot's default, but "most used" is not the same as "reference
    implementation." Spring Data JPA is not a provider at all — it's a repository
    abstraction on top of a provider.
  ref: concepts.md#other-jpa-providers-eclipselink-and-openjpa
- id: orm-fundamentals-jpa-vs-hibernate-004
  difficulty: beginner
  tags:
  - namespace
  - jakarta
  - versions
  question: |
    In the current Jakarta Persistence 3.x era (Hibernate 6/7, Spring Boot 3), which
    package prefix do the persistence annotations and interfaces use?
  options:
  - jakarta.persistence.*
  - javax.persistence.*
  - org.hibernate.jpa.*
  - java.sql.persistence.*
  answer: 0
  explanation: |
    Jakarta EE 9 renamed javax.* to jakarta.*. Jakarta Persistence 3.0+ uses
    jakarta.persistence.*, and Hibernate 6+ / Spring Boot 3+ adopted it. The
    javax.persistence.* namespace is legacy (JPA 2.2 / Hibernate 5 / Spring Boot 2).
  ref: concepts.md#javax-to-jakarta-the-namespace-migration
- id: orm-fundamentals-jpa-vs-hibernate-005
  difficulty: intermediate
  tags:
  - entitymanagerfactory
  - entitymanager
  - thread-safety
  - architecture
  question: |
    Which pair of statements about EntityManagerFactory (EMF) and EntityManager (EM)
    is correct?
  options:
  - EMF is not thread-safe and short-lived; EM is thread-safe and long-lived
  - Both EMF and EM are thread-safe and can be shared freely across threads
  - EMF is expensive, thread-safe, and created once; EM is cheap, NOT thread-safe, and one per transaction/request
  - EM is expensive and created once per app; EMF is created per request
  answer: 2
  explanation: |
    EntityManagerFactory is expensive to build, thread-safe, and created once per
    persistence unit for the app lifetime. EntityManager is cheap, short-lived, NOT
    thread-safe, one per transaction/request, and owns the persistence context.
  ref: concepts.md#the-jpa-architecture-entitymanagerfactory-entitymanager-and-the-persistence-unit
- id: orm-fundamentals-jpa-vs-hibernate-006
  difficulty: intermediate
  tags:
  - n-plus-one
  - data-navigation
  - mechanism
  question: |
    You run one query to load 50 orders, then iterate and call
    order.getCustomer().getName() on each (customer is lazy). How many SQL
    statements does Hibernate typically execute in total, and what is this called?
  options:
  - 1 statement total, because the customer is cached; no name for this
  - '2 statements (a single join): eager fetching'
  - '50 statements total: the Cartesian product problem'
  - '51 statements (1 for orders + 50 for customers): the N+1 select problem'
  answer: 3
  explanation: |
    This is the classic N+1 problem: 1 query loads the N orders, then lazily
    navigating each order's customer triggers 1 additional query per order (N),
    totaling N+1 = 51. It's a direct symptom of the data-navigation impedance
    mismatch and is fixed with JOIN FETCH, entity graphs, or batch fetching.
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-007
  difficulty: advanced
  tags:
  - hibernate-native
  - session
  - entitymanager
  - unwrap
  question: |
    In Hibernate 6/7, how does the native Session interface relate to JPA's
    EntityManager, and how do you obtain a Session from an EntityManager?
  options:
  - Session and EntityManager are unrelated types; you must open a separate Session from a SessionFactory
  - EntityManager extends Session; you call em.getSession()
  - Session extends EntityManager; you call em.unwrap(Session.class)
  - They are the same class under different names; a simple cast works
  answer: 2
  explanation: |
    In Hibernate 6/7, Session extends EntityManager (and SessionFactory extends
    EntityManagerFactory). To reach native features you unwrap:
    em.unwrap(Session.class). A raw cast is not guaranteed because Spring/JPA often
    hand you a proxy, so unwrap is the correct API.
  ref: concepts.md#hibernates-native-api-sessionfactory-and-session
- id: orm-fundamentals-jpa-vs-hibernate-008
  difficulty: intermediate
  tags:
  - bulk
  - when-not-to-use-orm
  - judgment
  question: |
    You need to update a status column on 10 million rows. Which approach best fits
    an ORM-aware senior engineer's judgment?
  options:
  - Use a set-based bulk JPQL/HQL UPDATE, JDBC batch, or Hibernate StatelessSession instead of managing
    entities one by one
  - Load all 10M rows as managed entities, mutate each, and rely on dirty checking to flush
  - Call em.merge() in a tight loop over all 10M rows
  - Increase the JVM heap so all 10M managed entities fit in the persistence context
  answer: 0
  explanation: |
    Managing millions of entities one at a time floods the persistence context and
    is slow and memory-hungry — the ORM is the wrong tool for bulk. A set-based
    UPDATE (JPQL/HQL), JDBC batch, or StatelessSession (no persistence context/cache/
    dirty checking) is the right approach.
  ref: concepts.md#when-to-use-an-orm-vs-plain-jdbc-jooq-or-mybatis
- id: orm-fundamentals-jpa-vs-hibernate-009
  difficulty: intermediate
  tags:
  - namespace
  - migration
  - history
  question: |
    Why did persistence packages change from javax.persistence.* to
    jakarta.persistence.*?
  options:
  - Because jakarta.* packages are significantly faster at runtime
  - Because Hibernate forked JPA and renamed the packages to avoid a lawsuit
  - Because a security vulnerability was found in all javax packages
  - Because Oracle donated Java EE to the Eclipse Foundation but retained the javax trademark, forcing
    a rename in Jakarta EE 9
  answer: 3
  explanation: |
    Java EE was moved to the Eclipse Foundation and rebranded Jakarta EE. Oracle
    kept the javax trademark, so Jakarta EE 9 performed a package-level rename
    (javax.* -> jakarta.*) with no new features. It's purely a naming change;
    annotation names and semantics are unchanged.
  ref: concepts.md#javax-to-jakarta-the-namespace-migration
- id: orm-fundamentals-jpa-vs-hibernate-010
  difficulty: beginner
  tags:
  - jpql
  - spec
  question: |
    What is JPQL (Jakarta Persistence Query Language)?
  options:
  - A binary wire protocol between Hibernate and the database
  - A Hibernate-only extension not part of any specification
  - An object-oriented query language defined by the JPA spec that queries entities and their fields rather
    than tables and columns
  - A JSON-based query format for NoSQL stores
  answer: 2
  explanation: |
    JPQL is the query language defined by the JPA specification. It looks SQL-like
    but operates over the entity model (entity names and fields) rather than tables
    and columns. Hibernate's HQL is a superset of JPQL.
  ref: concepts.md#jpa-the-specification-jakarta-persistence
- id: orm-fundamentals-jpa-vs-hibernate-011
  difficulty: advanced
  tags:
  - identity
  - equals-hashcode
  - mechanism
  question: |
    Within a single EntityManager, you call em.find(Book.class, 1L) twice. What does
    JPA guarantee about the two returned references, and why?
  options:
  - They may be different instances; you must compare them with equals()
  - The second call returns null because the row is already loaded
  - They are always different instances because each find() hits the database
  - They are the same object instance (==), because the persistence context (first-level cache) guarantees
    identity for a given row within the session
  answer: 3
  explanation: |
    The persistence context guarantees a single managed instance per database row
    within one EntityManager, so repeated finds of the same id return the *same*
    object (== is true). This is how JPA bridges the object-identity vs PK-identity
    mismatch inside a session.
  ref: concepts.md#the-jpa-architecture-entitymanagerfactory-entitymanager-and-the-persistence-unit
- id: orm-fundamentals-jpa-vs-hibernate-012
  difficulty: intermediate
  tags:
  - providers
  - portability
  question: |
    An application is written strictly against jakarta.persistence.* types with no
    provider-specific annotations. What does this buy you?
  options:
  - Guaranteed 10x performance over provider-specific code
  - Immunity to the N+1 problem
  - Automatic second-level caching without configuration
  - The theoretical ability to swap JPA providers (e.g. Hibernate to EclipseLink) by changing configuration/dependencies
    rather than code
  answer: 3
  explanation: |
    Coding strictly to the spec keeps you provider-portable — in principle you can
    change the provider by swapping the dependency and persistence.xml provider
    setting. It says nothing about performance or N+1. In practice most apps use
    native features and rarely migrate.
  ref: concepts.md#other-jpa-providers-eclipselink-and-openjpa
- id: orm-fundamentals-jpa-vs-hibernate-013
  difficulty: intermediate
  tags:
  - statelesssession
  - hibernate-native
  - bulk
  question: |
    What distinguishes Hibernate's StatelessSession from a normal Session?
  options:
  - StatelessSession has no persistence context, no first-level cache, no automatic dirty checking, and
    no cascade — suited to bulk work
  - StatelessSession keeps a larger first-level cache for faster reads
  - StatelessSession automatically enables the second-level cache
  - StatelessSession runs every operation in its own transaction automatically
  answer: 0
  explanation: |
    StatelessSession is a command-oriented API with no persistence context: no L1
    cache, no dirty checking, no cascading, no lazy proxies. Because it doesn't
    accumulate managed entities, it's ideal for bulk inserts/updates/exports where a
    normal Session would consume too much memory.
  ref: concepts.md#hibernates-native-api-sessionfactory-and-session
- id: orm-fundamentals-jpa-vs-hibernate-014
  difficulty: beginner
  tags:
  - orm-definition
  question: |
    At the simplest level, what does an ORM do?
  options:
  - Compiles Java source into SQL stored procedures
  - Replaces the relational database with an in-memory object store
  - Maps rows in relational tables to objects (and back), so you work with persistent data as ordinary
    objects instead of raw JDBC ResultSets
  - Encrypts database rows transparently
  answer: 2
  explanation: |
    ORM (Object-Relational Mapping) maps table rows to objects and objects back to
    rows, letting you manipulate persistent data as objects rather than hand-writing
    SQL and JDBC plumbing for every operation.
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-015
  difficulty: advanced
  tags:
  - hibernate-history
  - sqm
  - versions
  question: |
    Which statement about Hibernate ORM 6 is correct?
  options:
  - Hibernate 6 dropped JPA support to focus on its native API
  - Hibernate 6 removed HQL in favor of native SQL only
  - Hibernate 6 still uses javax.persistence.* for backward compatibility
  - Hibernate 6 moved to the jakarta.* namespace and introduced a rewritten query engine based on the
    Semantic Query Model (SQM)
  answer: 3
  explanation: |
    Hibernate 6 adopted the jakarta.persistence.* namespace and rebuilt its query
    engine around the SQM (Semantic Query Model), which parses HQL/JPQL into a
    semantic AST before translating to SQL, improving type safety and SQL
    generation. It fully supports JPA and retains HQL.
  ref: concepts.md#hibernate-the-implementation-reference-grade-jpa-provider-plus-native-features
- id: orm-fundamentals-jpa-vs-hibernate-016
  difficulty: intermediate
  tags:
  - thread-safety
  - entitymanager
  - gotcha
  question: |
    A developer stores a single EntityManager in a static field and uses it from
    multiple request threads. What is the core problem?
  options:
  - Nothing — EntityManager is designed to be shared across threads
  - It only fails on Oracle databases
  - EntityManager is NOT thread-safe; its persistence context will be corrupted by concurrent access
  - The EntityManagerFactory will leak connections, but the EntityManager is fine
  answer: 2
  explanation: |
    EntityManager is not thread-safe — it owns a mutable persistence context.
    Sharing one across threads corrupts that state. The correct pattern is one EM per
    transaction/request; in Spring a thread-bound proxy handles this for you.
  ref: concepts.md#the-jpa-architecture-entitymanagerfactory-entitymanager-and-the-persistence-unit
- id: orm-fundamentals-jpa-vs-hibernate-017
  difficulty: intermediate
  tags:
  - associations
  - directionality
  - impedance-mismatch
  question: |
    Regarding the "associations" dimension of the impedance mismatch, which
    statement is accurate?
  options:
  - Object references and foreign keys are identical concepts requiring no reconciliation
  - Foreign keys are directional and object references are bidirectional
  - Object references are inherently directional (one object points to another), while foreign keys are
    inherently bidirectional (a join can go either way), so mapping must define an owning/inverse side
  - Associations only exist in the relational model, never in the object model
  answer: 2
  explanation: |
    An object reference is a one-way pointer (A holds B). A foreign key is
    relationally bidirectional — you can join in either direction. JPA reconciles
    this with owning vs inverse sides (mappedBy) when modeling bidirectional
    associations.
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-018
  difficulty: intermediate
  tags:
  - when-not-to-use-orm
  - reporting
  - judgment
  question: |
    For a heavy analytical report with wide aggregations, pivots, and window
    functions, what is the most appropriate approach in a Hibernate-based app?
  options:
  - Use native SQL / a database view / jOOQ or scalar projections rather than materializing entities
  - Load all involved entities into the persistence context and compute the report in Java
  - Add more @OneToMany EAGER associations so everything loads at once
  - Increase the second-level cache size until the report fits in memory
  answer: 0
  explanation: |
    Reporting is a poor fit for entity materialization. Running native SQL, a view,
    jOOQ, or reading scalar projections is far more efficient than fetching entities
    to compute aggregates. Senior engineers pick SQL-first tools for analytics and
    reserve the ORM for the transactional domain model.
  ref: concepts.md#when-to-use-an-orm-vs-plain-jdbc-jooq-or-mybatis
- id: orm-fundamentals-jpa-vs-hibernate-019
  difficulty: beginner
  tags:
  - persistence-unit
  - bootstrap
  question: |
    In standard JPA, what is a "persistence unit"?
  options:
  - A single database transaction
  - A connection pool managed by the JDBC driver
  - One managed entity instance in the persistence context
  - A named grouping of entity classes plus configuration, typically declared in META-INF/persistence.xml,
    from which an EntityManagerFactory is built
  answer: 3
  explanation: |
    A persistence unit is a named set of entity classes and configuration (declared
    in persistence.xml or built programmatically). An EntityManagerFactory is created
    for a persistence unit, and it in turn creates EntityManagers.
  ref: concepts.md#the-jpa-architecture-entitymanagerfactory-entitymanager-and-the-persistence-unit
- id: orm-fundamentals-jpa-vs-hibernate-020
  difficulty: advanced
  tags:
  - hibernate-native
  - portability
  - tradeoff
  question: |
    Your codebase uses org.hibernate.annotations.NaturalId and @Formula. What is the
    key trade-off of using such annotations?
  options:
  - They are slower than JPA-standard annotations at runtime
  - They silently disable the first-level cache
  - They couple the code to Hibernate; the app is no longer portable to another JPA provider like EclipseLink
  - They are deprecated in Hibernate 6 and will be removed
  answer: 2
  explanation: |
    @NaturalId and @Formula are Hibernate-native (org.hibernate.annotations.*), not
    part of JPA. Using them ties you to Hibernate — you lose provider portability.
    That's often an acceptable trade-off (Hibernate is rarely swapped), but it should
    be a conscious decision.
  ref: concepts.md#hibernate-the-implementation-reference-grade-jpa-provider-plus-native-features
- id: orm-fundamentals-jpa-vs-hibernate-021
  difficulty: intermediate
  tags:
  - inheritance
  - granularity
  - impedance-mismatch
  question: |
    The "inheritance" dimension of the impedance mismatch exists because:
  options:
  - Java does not support inheritance
  - Foreign keys automatically model inheritance, so no mapping is needed
  - Relational databases have no native concept of table inheritance/polymorphism, so an ORM must map
    a class hierarchy onto flat tables via strategies like SINGLE_TABLE, JOINED, or TABLE_PER_CLASS
  - Inheritance only matters for NoSQL databases
  answer: 2
  explanation: |
    Object models use inheritance and polymorphism; relational schemas are flat with
    no native inheritance. An ORM reconciles this by mapping a hierarchy to tables
    using SINGLE_TABLE, JOINED, or TABLE_PER_CLASS strategies (covered in the
    inheritance topic).
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-022
  difficulty: beginner
  tags:
  - namespace
  - versions
  - boundary
  question: |
    Which combination correctly reflects the javax vs jakarta split?
  options:
  - Hibernate 6+ / Spring Boot 3+ use jakarta.persistence.*; Hibernate 5 / Spring Boot 2 use javax.persistence.*
  - Hibernate 6+ still uses javax.persistence.*; only Spring Boot changed
  - Both namespaces can be freely mixed in one running application
  - Spring Boot 3 uses javax while Hibernate 6 uses jakarta
  answer: 0
  explanation: |
    The jakarta namespace arrived with Jakarta Persistence 3.0. Hibernate 6+ and
    Spring Boot 3+ (Java 17+) use jakarta.persistence.*, while Hibernate 5 and Spring
    Boot 2 use javax.persistence.*. You cannot mix the two in one running app because
    they are different types.
  ref: concepts.md#javax-to-jakarta-the-namespace-migration
- id: orm-fundamentals-jpa-vs-hibernate-023
  difficulty: advanced
  tags:
  - n-plus-one
  - fix
  - join-fetch
  - scenario
  question: |
    Given the N+1 problem when loading orders and their customers, which single
    change most directly reduces it to one query?
  options:
  - Change the customer association to FetchType.EAGER globally
  - Add @Transactional to the loop method
  - Wrap each getCustomer() call in a new transaction
  - 'Use a JPQL query with JOIN FETCH: ''select o from Order o join fetch o.customer'''
  answer: 3
  explanation: |
    JOIN FETCH tells Hibernate to fetch the associated customers in the same SQL
    query via a join, collapsing N+1 into a single statement. Marking the association
    EAGER globally is a blunt instrument (it fires for every load path and can cause
    its own N+1 or cartesian issues); transactions don't reduce the query count.
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-024
  difficulty: intermediate
  tags:
  - jooq
  - mybatis
  - sql-first
  - judgment
  question: |
    A team wants to write hand-tuned SQL but keep it type-safe and refactor-safe,
    generated from the actual schema. Which tool best fits?
  options:
  - jOOQ, a type-safe SQL DSL generated from the schema
  - Hibernate with everything mapped EAGER
  - Spring Data JPA derived query methods
  - Plain string concatenation with JdbcTemplate
  answer: 0
  explanation: |
    jOOQ is a SQL-first, type-safe DSL generated from your schema — you write SQL but
    get compile-time checking and refactor safety. It's the natural pick when you
    want to write SQL yourself but avoid stringly-typed queries.
  ref: concepts.md#when-to-use-an-orm-vs-plain-jdbc-jooq-or-mybatis
- id: orm-fundamentals-jpa-vs-hibernate-025
  difficulty: intermediate
  tags:
  - hql
  - jpql
  - hibernate-native
  question: |
    How does Hibernate's HQL relate to JPQL?
  options:
  - HQL is a completely different language unrelated to JPQL
  - HQL is the SQL dialect Hibernate emits, not a query language you write
  - JPQL is a superset of HQL
  - HQL is a superset of JPQL — it supports the standard JPQL plus Hibernate-specific extensions
  answer: 3
  explanation: |
    HQL (Hibernate Query Language) is a superset of the JPA-standard JPQL: any valid
    JPQL is valid HQL, and HQL adds Hibernate-specific features. HQL is a query
    language you write, distinct from the SQL Hibernate ultimately generates.
  ref: concepts.md#hibernate-the-implementation-reference-grade-jpa-provider-plus-native-features
- id: orm-fundamentals-jpa-vs-hibernate-026
  difficulty: expert
  tags:
  - equals-hashcode
  - identity
  - detached
  - gotcha
  question: |
    Why is basing an entity's equals()/hashCode() on a database-generated @Id
    (auto-increment) considered risky?
  options:
  - Because the id is a Long, and Long has a broken hashCode
  - Because generated ids are not unique across tables
  - Because the id is null for a transient (not-yet-persisted) entity, so its hashCode changes after insert
    — breaking Set membership and identity across the transient/persistent boundary
  - Because equals() cannot legally reference private fields
  answer: 2
  explanation: |
    A DB-generated id is null before insert and assigned on flush. If equals/hashCode
    depend on it, an entity added to a HashSet while transient becomes "lost" once the
    id is assigned (its hashCode changed). A stable business/natural key is safer for
    the equals contract. This is why identity handling is subtle in ORM.
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-027
  difficulty: beginner
  tags:
  - providers
  - list
  question: |
    Which of these is NOT a JPA provider (implementation of the spec)?
  options:
  - Hibernate ORM
  - EclipseLink
  - Apache OpenJPA
  - Spring Data JPA
  answer: 3
  explanation: |
    Hibernate, EclipseLink, and OpenJPA are JPA providers (they implement the spec).
    Spring Data JPA is NOT a provider — it's a repository abstraction that sits on top
    of a provider (usually Hibernate) to reduce boilerplate.
  ref: concepts.md#other-jpa-providers-eclipselink-and-openjpa
- id: orm-fundamentals-jpa-vs-hibernate-028
  difficulty: intermediate
  tags:
  - sessionfactory
  - entitymanagerfactory
  - hibernate-native
  question: |
    In Hibernate 6/7, what is the relationship between SessionFactory and JPA's
    EntityManagerFactory?
  options:
  - SessionFactory extends EntityManagerFactory, so you can unwrap the JPA factory to the Hibernate one
  - They are unrelated and must be created separately
  - EntityManagerFactory extends SessionFactory
  - SessionFactory was removed in Hibernate 6 in favor of EntityManagerFactory only
  answer: 0
  explanation: |
    Mirroring Session extends EntityManager, in Hibernate 6/7 SessionFactory extends
    EntityManagerFactory. You can call emf.unwrap(SessionFactory.class) to reach
    Hibernate-native factory features while using JPA elsewhere.
  ref: concepts.md#hibernates-native-api-sessionfactory-and-session
- id: orm-fundamentals-jpa-vs-hibernate-029
  difficulty: intermediate
  tags:
  - persistence-context
  - dirty-checking
  - mechanism
  question: |
    Which of the following is a service the persistence context (owned by the
    EntityManager) provides, that plain JDBC does not?
  options:
  - It compiles JPQL to bytecode
  - It encrypts all columns transparently
  - 'Automatic dirty checking: it tracks changes to managed entities and generates the UPDATE SQL on flush
    without you calling save()'
  - It guarantees SERIALIZABLE isolation for every transaction
  answer: 2
  explanation: |
    A defining benefit of the persistence context is automatic dirty checking:
    Hibernate snapshots managed entities and, at flush time, generates UPDATEs for
    any that changed — no explicit save call needed. Plain JDBC has no such tracking.
    (Isolation levels are a DB concern — see messaging-databases.)
  ref: concepts.md#the-jpa-architecture-entitymanagerfactory-entitymanager-and-the-persistence-unit
- id: orm-fundamentals-jpa-vs-hibernate-030
  difficulty: advanced
  tags:
  - migration
  - javax-jakarta
  - mixing
  - gotcha
  question: |
    During a Hibernate 5 to 6 upgrade, a module still imports
    javax.persistence.Entity while the rest imports jakarta.persistence.Entity. What
    happens?
  options:
  - javax.persistence.Entity and jakarta.persistence.Entity are DIFFERENT types, so entities annotated
    with the javax one won't be recognized by Hibernate 6 — you must migrate all imports
  - It works fine; Hibernate treats them as aliases
  - Only the runtime performance degrades slightly
  - The database schema is silently dropped
  answer: 0
  explanation: |
    The two annotations are entirely distinct types in different packages. Hibernate
    6 scans for jakarta.persistence.Entity; classes annotated with the legacy
    javax.persistence.Entity are not recognized as entities. The migration is
    all-or-nothing — tools like OpenRewrite or Eclipse Transformer rewrite the
    imports.
  ref: concepts.md#javax-to-jakarta-the-namespace-migration
- id: orm-fundamentals-jpa-vs-hibernate-031
  difficulty: beginner
  tags:
  - granularity
  - embeddable
  - impedance-mismatch
  question: |
    An Address is a fine-grained value type you don't want its own table for. Which
    ORM feature addresses the "granularity" mismatch by flattening it into the
    owner's columns?
  options:
  - '@Embeddable / @Embedded'
  - '@OneToMany'
  - '@Inheritance(strategy = JOINED)'
  - '@Version'
  answer: 0
  explanation: |
    The granularity mismatch (many small classes vs few coarse tables) is handled by
    embeddables: marking Address @Embeddable and embedding it (@Embedded) inlines its
    fields as columns of the owning entity's table rather than a separate table.
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-032
  difficulty: intermediate
  tags:
  - bootstrap
  - api
  - code
  question: |
    In standard (non-Spring) JPA, which call creates the EntityManagerFactory for a
    persistence unit named "my-unit"?
  options:
  - Persistence.createEntityManagerFactory("my-unit")
  - new EntityManagerFactory("my-unit")
  - EntityManager.open("my-unit")
  - SessionFactory.build("my-unit")
  answer: 0
  explanation: |
    The bootstrap entry point is the Persistence class:
    Persistence.createEntityManagerFactory("my-unit") reads persistence.xml and builds
    the EMF. You then call emf.createEntityManager() for each unit of work.
  ref: concepts.md#the-jpa-architecture-entitymanagerfactory-entitymanager-and-the-persistence-unit
- id: orm-fundamentals-jpa-vs-hibernate-033
  difficulty: advanced
  tags:
  - orm-value
  - tradeoff
  - judgment
  question: |
    Which of these is the strongest reason to CHOOSE an ORM like Hibernate for a
    transactional line-of-business application?
  options:
  - It always produces faster SQL than a human could write
  - It guarantees your queries can never hit the database more than once
  - It removes the need to understand SQL entirely
  - It provides the persistence context (dirty checking, identity, write batching, cascading, caching)
    and high developer productivity on a rich domain model with lots of navigation and CRUD
  answer: 3
  explanation: |
    The ORM's value is the persistence context and productivity on a rich domain
    model: automatic change tracking, identity guarantees, batching, cascades, and
    caching. It does NOT guarantee faster-than-human SQL, and understanding SQL
    remains essential (N+1, generated SQL). Overselling it is a junior tell.
  ref: concepts.md#when-to-use-an-orm-vs-plain-jdbc-jooq-or-mybatis
- id: orm-fundamentals-jpa-vs-hibernate-034
  difficulty: intermediate
  tags:
  - annotations
  - entity
  - jpa
  question: |
    Which set of annotations is defined by the JPA specification (portable across
    providers)?
  options:
  - '@Entity, @Id, @GeneratedValue, @Column, @OneToMany'
  - '@NaturalId, @Formula, @Where, @Filter'
  - '@DynamicUpdate, @BatchSize, @SQLRestriction'
  - '@Immutable, @Cache (org.hibernate), @Type'
  answer: 0
  explanation: |
    @Entity, @Id, @GeneratedValue, @Column, and @OneToMany are all JPA-standard
    (jakarta.persistence.*), so they're portable. The other lists
    (@NaturalId/@Formula/@Where, @DynamicUpdate/@BatchSize, @Immutable/@Type) are
    Hibernate-native extensions (org.hibernate.annotations.*).
  ref: concepts.md#hibernate-the-implementation-reference-grade-jpa-provider-plus-native-features
- id: orm-fundamentals-jpa-vs-hibernate-035
  difficulty: expert
  tags:
  - sqm
  - hibernate6
  - query-engine
  - mechanism
  question: |
    What does Hibernate 6's Semantic Query Model (SQM) do in the query pipeline?
  options:
  - It caches ResultSets in the second-level cache
  - It parses HQL/JPQL into a strongly-typed semantic AST that is then translated into SQL, improving
    type safety and enabling richer SQL generation
  - It is a connection pool implementation
  - It replaces JDBC with a proprietary wire protocol
  answer: 1
  explanation: |
    SQM is the semantic representation at the heart of Hibernate 6's rewritten query
    engine: HQL/JPQL is parsed into a typed semantic AST, which is then translated to
    a SQL AST and finally SQL. This gives better type checking and more capable SQL
    generation than the old Hibernate 5 translator.
  ref: concepts.md#hibernate-the-implementation-reference-grade-jpa-provider-plus-native-features
- id: orm-fundamentals-jpa-vs-hibernate-036
  difficulty: beginner
  tags:
  - jpa-acronym
  - history
  question: |
    In current usage, what does "JPA" stand for, and what was its earlier name?
  options:
  - Java Persistence Adapter; earlier called Jakarta Persistence Adapter
  - JDBC Persistence Abstraction; formerly Java Programming API
  - Jakarta Provider Architecture; formerly Java Provider API
  - Jakarta Persistence API; formerly the Java Persistence API
  answer: 3
  explanation: |
    JPA is the Jakarta Persistence API, formerly the Java Persistence API. The rename
    accompanied the move of Java EE to the Eclipse Foundation (Jakarta EE) and the
    javax -> jakarta namespace change.
  ref: concepts.md#jpa-the-specification-jakarta-persistence
- id: orm-fundamentals-jpa-vs-hibernate-037
  difficulty: intermediate
  tags:
  - spring-data-jpa
  - boundary
  - cross-ref
  question: |
    Where does Spring Data JPA sit in the stack?
  options:
  - It is a JPA provider that competes with Hibernate
  - It is the JDBC driver Hibernate uses
  - It is a repository abstraction layered ON TOP of a JPA provider (usually Hibernate), giving derived
    queries, @Query, pagination, and projections
  - It is the specification that Hibernate implements
  answer: 2
  explanation: |
    Spring Data JPA is a repository abstraction on top of a JPA provider (Hibernate by
    default), not a provider or a spec. It reduces boilerplate with derived query
    methods, @Query, pagination, and projections. Details are in
    spring-data-jpa-repositories; the container/tx proxying is a spring-* concern.
  ref: concepts.md#jpa-the-specification-jakarta-persistence
- id: orm-fundamentals-jpa-vs-hibernate-038
  difficulty: advanced
  tags:
  - boundary
  - isolation
  - cross-ref
  - judgment
  question: |
    An interviewer asks how Hibernate relates to database ACID isolation levels and
    anomalies (dirty reads, phantom reads). What is the accurate boundary?
  options:
  - Hibernate defines and enforces isolation levels itself, independent of the database
  - Isolation levels and anomalies are a database-level concern; Hibernate/JPA USE them (e.g. via transactions
    and optimistic/pessimistic locking) but the underlying semantics belong to the DB
  - Hibernate always upgrades every transaction to SERIALIZABLE
  - Isolation levels only apply when using StatelessSession
  answer: 1
  explanation: |
    Isolation levels, anomalies, and transaction semantics are database mechanics
    (see messaging-databases/transactions-acid-isolation-levels). Hibernate/JPA use
    the database's transactions and add JPA locking (optimistic @Version, pessimistic
    lock modes), but they don't redefine isolation. Knowing this boundary is a
    seniority signal.
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-039
  difficulty: intermediate
  tags:
  - spring-data-jdbc
  - alternatives
  - judgment
  question: |
    A team wants repository-style data access but finds JPA's lazy loading and dirty
    checking too much "magic" for their simple aggregate model. Which lighter
    alternative fits?
  options:
  - Spring Data JDBC, which offers repositories without lazy loading or a persistence context
  - Adding more @OneToMany EAGER mappings to Hibernate
  - Switching to EclipseLink
  - Using StatelessSession for all reads and writes in web requests
  answer: 0
  explanation: |
    Spring Data JDBC deliberately omits JPA's persistence context, lazy loading, and
    dirty checking, giving a simpler mental model for aggregate-oriented designs. It's
    a reasonable choice when JPA's machinery is more than the domain needs.
  ref: concepts.md#when-to-use-an-orm-vs-plain-jdbc-jooq-or-mybatis
- id: orm-fundamentals-jpa-vs-hibernate-040
  difficulty: expert
  tags:
  - statelesssession
  - cascade
  - mechanism
  - gotcha
  question: |
    A developer switches a batch import to StatelessSession expecting cascade to save
    child entities automatically, but children are not persisted. Why?
  options:
  - StatelessSession requires @Cascade(ALL) which was omitted
  - StatelessSession has no persistence context and does NOT apply cascade or dirty checking — each entity
    operation must be issued explicitly
  - StatelessSession only works with EAGER associations
  - The database rejected the child inserts silently
  answer: 1
  explanation: |
    StatelessSession bypasses the persistence context entirely: no dirty checking, no
    cascading, no lazy proxies. Operations are direct commands, so you must explicitly
    insert children yourself. That lack of overhead is exactly what makes it fast for
    bulk, but it surprises developers expecting normal Session semantics.
  ref: concepts.md#hibernates-native-api-sessionfactory-and-session
- id: orm-fundamentals-jpa-vs-hibernate-041
  difficulty: beginner
  tags:
  - entitymanager
  - api
  - operations
  question: |
    Which of these is a core EntityManager operation defined by JPA?
  options:
  - compile()
  - persist()
  - vacuum()
  - reindex()
  answer: 1
  explanation: |
    persist() is a core EntityManager method (along with find, merge, remove,
    getReference, createQuery, flush, etc.). The others are not JPA operations.
  ref: concepts.md#the-jpa-architecture-entitymanagerfactory-entitymanager-and-the-persistence-unit
- id: orm-fundamentals-jpa-vs-hibernate-042
  difficulty: advanced
  tags:
  - hibernate-history
  - gavin-king
  - inspired-jpa
  question: |
    Which statement about Hibernate's history relative to JPA is correct?
  options:
  - JPA was created first, and Hibernate was written years later to implement it
  - Hibernate and JPA were released simultaneously by Oracle
  - Hibernate predates JPA (created ~2001 by Gavin King) and its design strongly influenced the JPA specification
  - Hibernate is a fork of EclipseLink
  answer: 2
  explanation: |
    Hibernate came first (around 2001, by Gavin King) and was influential enough that
    its concepts shaped the JPA specification. That heritage is why Hibernate maps so
    naturally onto JPA and remains the most-used provider.
  ref: concepts.md#hibernate-the-implementation-reference-grade-jpa-provider-plus-native-features
- id: orm-fundamentals-jpa-vs-hibernate-043
  difficulty: intermediate
  tags:
  - versions
  - jakarta-persistence
  - features
  question: |
    Which feature was introduced in Jakarta Persistence 3.1 (not present in the 3.0
    big-bang rename)?
  options:
  - The javax -> jakarta package rename
  - The @Entity annotation
  - The removal of JPQL
  - Standardized UUID id generation (GenerationType.UUID) and additional JPQL functions like ceiling,
    floor, power, round, and extract
  answer: 3
  explanation: |
    Jakarta Persistence 3.0 was purely the namespace rename with no new features.
    Jakarta Persistence 3.1 added standardized UUID generation and several new JPQL
    numeric/date functions (ceiling, floor, power, round, sign, extract, local
    date/time).
  ref: concepts.md#jpa-the-specification-jakarta-persistence
- id: orm-fundamentals-jpa-vs-hibernate-044
  difficulty: intermediate
  tags:
  - data-navigation
  - lazy
  - gotcha
  question: |
    The "data navigation" mismatch describes which tension?
  options:
  - Objects encourage walking the graph via references, while the database favors set-based access in
    few round-trips — naive navigation causes problems like N+1
  - Objects can only be read, never written, unlike database rows
  - The database navigates faster than objects in all cases
  - Navigation is identical in both models, so no mismatch exists
  answer: 0
  explanation: |
    Object code invites walking references (order -> customer -> address), but the
    database is set-oriented and wants minimal round-trips. Naively navigating lazy
    associations in a loop produces the N+1 select problem — the data-navigation
    mismatch made concrete.
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-045
  difficulty: advanced
  tags:
  - portability
  - unwrap
  - mechanism
  question: |
    You want to keep most code JPA-portable but occasionally use Hibernate's
    bySimpleNaturalId load. What is the recommended pattern?
  options:
  - Rewrite the whole app against org.hibernate.Session
  - Keep coding against jakarta.persistence.EntityManager and call em.unwrap(Session.class) only where
    you need the native feature
  - Cast the EntityManager directly to SessionImpl
  - Add EclipseLink alongside Hibernate to get the feature
  answer: 1
  explanation: |
    The idiomatic pattern is to stay on the JPA API for the bulk of the code and
    unwrap to the Hibernate Session only at the specific call sites needing native
    features. This isolates the coupling. A direct cast to an internal impl class is
    fragile because you may hold a proxy.
  ref: concepts.md#hibernates-native-api-sessionfactory-and-session
- id: orm-fundamentals-jpa-vs-hibernate-046
  difficulty: beginner
  tags:
  - emf-lifecycle
  - resource
  - gotcha
  question: |
    What is the correct lifecycle discipline for EntityManagerFactory in a typical
    application?
  options:
  - Create a new EntityManagerFactory for every request and close it after
  - Create it once (it's expensive and thread-safe), keep it for the app's lifetime, and close it on shutdown
  - Never close it; the GC handles everything
  - Create one per thread and store it in a ThreadLocal
  answer: 1
  explanation: |
    Building an EMF is expensive (it parses metadata, builds mappings, etc.), and it
    is thread-safe, so you create it once per persistence unit, share it for the app
    lifetime, and close it at shutdown. EntityManagers are the cheap, per-request
    objects — not the factory.
  ref: concepts.md#the-jpa-architecture-entitymanagerfactory-entitymanager-and-the-persistence-unit
- id: orm-fundamentals-jpa-vs-hibernate-047
  difficulty: expert
  tags:
  - n-plus-one
  - eager-trap
  - scenario
  - judgment
  question: |
    A developer "fixes" N+1 by marking every @ManyToOne and @OneToMany as
    FetchType.EAGER. Why is this often a poor solution?
  options:
  - EAGER is not allowed on @ManyToOne
  - EAGER only works with the second-level cache enabled
  - Global EAGER fetching loads associations on EVERY query path whether needed or not, can produce its
    own N+1 or Cartesian-product joins, and removes the ability to optimize per use case
  - It makes all entities immutable
  answer: 2
  explanation: |
    Making everything EAGER forces associations to load on every fetch path even when
    unused, can itself trigger N+1 (for collections not join-fetched) or huge
    Cartesian-product result sets when multiple collections are joined, and takes away
    per-query control. The right fix is targeted JOIN FETCH / entity graphs / batch
    fetching while keeping associations LAZY by default.
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-048
  difficulty: intermediate
  tags:
  - entity-design
  - immutability
  - best-practice
  question: |
    Which entity-design guidance reflects senior best practice?
  options:
  - Entities should be immutable and never define equals/hashCode
  - Entities are mutable managed objects; when you need equals/hashCode (e.g. for Sets), base them on
    a stable business/natural key rather than a DB-generated id, and never rely on the object being immutable
  - Always base equals/hashCode on the auto-generated primary key for correctness
  - Entities should override equals() to always return true for the same class
  answer: 1
  explanation: |
    Entities are inherently mutable managed objects tracked for dirty checking, so
    full immutability isn't the model. When equals/hashCode are needed, a stable
    business/natural key is safer than a DB-generated id (which is null before insert
    and changes membership in Sets). The other options are misconceptions.
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-049
  difficulty: advanced
  tags:
  - versions
  - hibernate7
  - java-version
  question: |
    Which statement about Java version requirements is correct for recent Hibernate
    releases?
  options:
  - Hibernate 6 requires Java 8 and Hibernate 7 requires Java 11
  - Both Hibernate 6 and 7 still run on Java 8
  - Hibernate 7 dropped the JVM and runs on GraalVM only
  - Hibernate 6 requires Java 11+ while Hibernate 7 requires Java 17+
  answer: 3
  explanation: |
    Hibernate ORM 6 baselines on Java 11+, and Hibernate ORM 7 raises the baseline to
    Java 17+ (aligning with the jakarta ecosystem and Spring Boot 3+). Both use the
    jakarta.persistence.* namespace.
  ref: concepts.md#hibernate-the-implementation-reference-grade-jpa-provider-plus-native-features
- id: orm-fundamentals-jpa-vs-hibernate-050
  difficulty: beginner
  tags:
  - boundary
  - cross-ref
  - sql
  question: |
    In this library's boundaries, which topic OWNS the mechanics of SQL itself,
    B-tree/LSM storage, and ACID isolation levels — so this ORM topic references
    rather than duplicates it?
  options:
  - spring-core
  - system-design
  - messaging-databases
  - interview-craft
  answer: 2
  explanation: |
    messaging-databases owns SQL, storage-engine internals (B-tree/LSM), indexing,
    and ACID isolation/transactions at the DB level. The Hibernate/JPA domain teaches
    how the ORM USES the database and cross-references messaging-databases for the
    underlying mechanics.
  ref: concepts.md#when-to-use-an-orm-vs-plain-jdbc-jooq-or-mybatis
- id: orm-fundamentals-jpa-vs-hibernate-051
  difficulty: expert
  tags:
  - jsr
  - history
  - spec-lineage
  question: |
    Under the old Java Community Process, which JSR first introduced JPA 1.0?
  options:
  - JSR 338, released standalone in 2013
  - There was never a JSR; JPA began as a Jakarta EE specification
  - JSR 317, released in 2009 alongside the Criteria API
  - JSR 220 (EJB 3.0), in 2006 — JPA was extracted from EJB container-managed persistence
  answer: 3
  explanation: |
    JPA 1.0 shipped as part of JSR 220 (EJB 3.0) in 2006, breaking persistence out of
    EJB CMP into its own model. JSR 317 was JPA 2.0 (2009, Criteria API) and JSR 338
    was JPA 2.1/2.2 (the last javax JSRs). Naming the JSR chain is a seniority signal.
  ref: concepts.md#the-spec-lineage-jsrs-the-jcp-to-jakarta-handoff-and-version-by-version-changes
- id: orm-fundamentals-jpa-vs-hibernate-052
  difficulty: expert
  tags:
  - governance
  - jakarta
  - jesp
  - history
  question: |
    Why does Jakarta Persistence 3.0 and later have no JSR number?
  options:
  - Because Eclipse decided version numbers replace JSRs for all releases
  - Because the JSR process was suspended industry-wide in 2019
  - Because the spec left the JCP when Java EE moved to the Eclipse Foundation; it is now governed by the Jakarta EE Specification Process (JESP), which does not issue JSRs
  - Because 3.0 was only a namespace rename and reused JSR 338's number
  answer: 2
  explanation: |
    JSRs are artifacts of the Java Community Process. When Oracle donated Java EE to the
    Eclipse Foundation, governance moved to the Jakarta EE Specification Process (JESP),
    which issues specifications by version, not JSRs. JSR 338 (JPA 2.1/2.2) was the last
    JPA JSR.
  ref: concepts.md#the-spec-lineage-jsrs-the-jcp-to-jakarta-handoff-and-version-by-version-changes
- id: orm-fundamentals-jpa-vs-hibernate-053
  difficulty: advanced
  tags:
  - versions
  - jakarta-persistence
  - features
  question: |
    Which mapping of Jakarta Persistence version to its headline change is correct?
  options:
  - 3.0 = UUID generation; 3.1 = AutoCloseable; 3.2 = namespace rename
  - All three versions only added JPQL functions and nothing else
  - 3.0 = Criteria API; 3.1 = records; 3.2 = the javax->jakarta rename
  - 3.0 = namespace rename only; 3.1 = UUID generation + JPQL functions; 3.2 = AutoCloseable, records, options-based find/lock
  answer: 3
  explanation: |
    3.0 was the big-bang javax->jakarta rename with no new features. 3.1 added
    GenerationType.UUID and math/date JPQL functions. 3.2 added AutoCloseable EM/EMF,
    record support, and options-based find/refresh/lock. 4.0 is the next major, in
    development (targeted by Hibernate 8).
  ref: concepts.md#the-spec-lineage-jsrs-the-jcp-to-jakarta-handoff-and-version-by-version-changes
- id: orm-fundamentals-jpa-vs-hibernate-054
  difficulty: expert
  tags:
  - spi
  - service-loader
  - bootstrap
  - mechanism
  question: |
    At runtime, how does Persistence.createEntityManagerFactory("unit") locate
    Hibernate as the provider?
  options:
  - Hibernate is hard-coded as a default inside the jakarta.persistence API jar
  - It scans the database for a provider registration table
  - It reads a JAVA_PROVIDER environment variable set by the JDBC driver
  - Via the ServiceLoader SPI: Hibernate ships META-INF/services/jakarta.persistence.spi.PersistenceProvider naming org.hibernate.jpa.HibernatePersistenceProvider, and Persistence asks each discovered provider to build the named unit
  answer: 3
  explanation: |
    JPA uses the standard Java ServiceLoader mechanism. Each provider jar declares its
    PersistenceProvider implementation under META-INF/services. The
    PersistenceProviderResolver enumerates them, and Persistence delegates unit creation
    to the first provider that recognizes the unit (or the one pinned via the
    jakarta.persistence.provider property).
  ref: concepts.md#how-jpa-finds-hibernate-the-persistence-provider-spi
- id: orm-fundamentals-jpa-vs-hibernate-055
  difficulty: advanced
  tags:
  - spi
  - persistence-xml
  - configuration
  question: |
    Two JPA providers (Hibernate and EclipseLink) are both on the classpath. How do you
    ensure a persistence unit is built by Hibernate specifically?
  options:
  - Name it in a <provider>org.hibernate.jpa.HibernatePersistenceProvider</provider> element (or the jakarta.persistence.provider property) in persistence.xml
  - Remove the EclipseLink jar at runtime with a classloader hook
  - Providers are chosen alphabetically, so rename the Hibernate jar to start with 'a'
  - Set hibernate.dialect; that forces provider selection
  answer: 0
  explanation: |
    When multiple providers are present, the resolver may pick either, so you pin the
    one you want with the <provider> element in the persistence unit (or the
    jakarta.persistence.provider property). Dialect settings do not select a provider.
  ref: concepts.md#how-jpa-finds-hibernate-the-persistence-provider-spi
- id: orm-fundamentals-jpa-vs-hibernate-056
  difficulty: expert
  tags:
  - bootstrap
  - service-registry
  - metadata
  - mechanism
  question: |
    In Hibernate's native bootstrap, what is the correct order of the layers that
    produce a SessionFactory?
  options:
  - SessionFactory -> Metadata -> ServiceRegistry (built lazily, top-down)
  - MetadataSources -> Dialect -> EntityManager -> SessionFactory
  - ServiceRegistry (Bootstrap then Standard) -> MetadataSources/Metadata -> SessionFactory
  - persistence.xml -> Session -> Transaction -> SessionFactory
  answer: 2
  explanation: |
    Native bootstrap builds a BootstrapServiceRegistry, then a StandardServiceRegistry
    (ConnectionProvider, dialect, JDBC services), then collects mapping inputs in
    MetadataSources to build the immutable Metadata, from which buildSessionFactory()
    creates the SessionFactory. The JPA Persistence path drives this underneath.
  ref: concepts.md#hibernate-bootstrap-internals-serviceregistry-metadata-sessionfactory
- id: orm-fundamentals-jpa-vs-hibernate-057
  difficulty: advanced
  tags:
  - bootstrap
  - dialect
  - jdbc
  - mechanism
  question: |
    If you do not explicitly set hibernate.dialect, how does Hibernate 6/7 choose the
    SQL dialect?
  options:
  - It defaults to a generic ANSI dialect and ignores the database vendor
  - It requires the dialect and fails to start without it
  - It resolves the dialect automatically by probing the JDBC connection's DatabaseMetaData during ServiceRegistry setup
  - It reads the dialect from the entity annotations
  answer: 2
  explanation: |
    During StandardServiceRegistry/JdbcServices initialization, Hibernate opens a
    connection and inspects DatabaseMetaData (product name/version) to auto-resolve the
    appropriate Dialect. You can still pin it explicitly, but auto-detection is the
    default in modern Hibernate.
  ref: concepts.md#hibernate-bootstrap-internals-serviceregistry-metadata-sessionfactory
- id: orm-fundamentals-jpa-vs-hibernate-058
  difficulty: expert
  tags:
  - type-system
  - hibernate6
  - javatype
  - jdbctype
  question: |
    What was the core change to Hibernate's type system in Hibernate 6?
  options:
  - The single Type/UserType hierarchy was split into a JavaType (Java side) plus a JdbcType (SQL/JDBC side), composed into a BasicType
  - All custom types were removed; only JPA converters remain
  - Types were moved from annotations into persistence.xml only
  - Hibernate 6 replaced Java types with database-native types at compile time
  answer: 0
  explanation: |
    Hibernate 5's monolithic Type/UserType mixed Java-side and JDBC-side concerns.
    Hibernate 6 split it into a JavaType<T> descriptor (instantiate/compare/copy) and a
    JdbcType descriptor (bind/extract, keyed by a SqlTypes code), composed into a
    BasicType. This underlies modern enum/UUID/JSON mapping.
  ref: concepts.md#the-hibernate-6-type-system-javatype-jdbctype-and-jdbctypecode
- id: orm-fundamentals-jpa-vs-hibernate-059
  difficulty: advanced
  tags:
  - jdbctypecode
  - json
  - mapping
  - code
  question: |
    You want to persist a Map<String,Object> field into a Postgres jsonb column using
    modern Hibernate. Which annotation expresses this most directly?
  options:
  - '@Lob'
  - '@Convert(converter = JsonConverter.class) with a hand-written AttributeConverter only'
  - '@JdbcTypeCode(SqlTypes.JSON)'
  - '@Enumerated(EnumType.STRING)'
  answer: 2
  explanation: |
    @JdbcTypeCode(SqlTypes.JSON) tells Hibernate to use the JSON JdbcType for the SQL
    side, mapping the object to a json/jsonb column. It leverages the Hibernate 6
    JavaType/JdbcType model rather than requiring a bespoke UserType. (A converter also
    works but is more code; @Lob and @Enumerated are unrelated.)
  ref: concepts.md#the-hibernate-6-type-system-javatype-jdbctype-and-jdbctypecode
- id: orm-fundamentals-jpa-vs-hibernate-060
  difficulty: expert
  tags:
  - hibernate7
  - jdbctypecode
  - best-practice
  question: |
    In Hibernate 7, why is @JdbcTypeCode(SqlTypes.X) generally preferred over
    @JdbcType(SomeJdbcType.class) for standard SQL types?
  options:
  - '@JdbcType was removed entirely in Hibernate 7'
  - '@JdbcTypeCode is faster at runtime because it skips reflection'
  - '@JdbcType only works with EclipseLink'
  - Several built-in JdbcType classes moved to internal packages, so referencing them directly is fragile; the SqlTypes code is the stable, public way to select them
  answer: 3
  explanation: |
    In Hibernate 7 many concrete JdbcType implementations were relocated to internal
    packages. Selecting the SQL type by its stable SqlTypes code via @JdbcTypeCode
    avoids depending on internal classes. @JdbcType/@JavaType remain for genuinely custom
    descriptors.
  ref: concepts.md#the-hibernate-6-type-system-javatype-jdbctype-and-jdbctypecode
- id: orm-fundamentals-jpa-vs-hibernate-061
  difficulty: expert
  tags:
  - sqm
  - query-engine
  - criteria
  - mechanism
  question: |
    In Hibernate 6/7, what do HQL, JPQL, and the Criteria API have in common in the
    query pipeline?
  options:
  - They all bypass SQL and talk to the database over a binary protocol
  - They are each translated by three separate independent engines with no shared stage
  - They all produce a single typed Semantic Query Model (SQM) AST, which is then lowered to a SQL AST and rendered by the Dialect
  - They are all converted to native SQL strings before any validation occurs
  answer: 2
  explanation: |
    Hibernate 6 unified the front ends: HQL/JPQL parsing and Criteria building all yield
    an SQM (a typed semantic AST validated against the domain model). The SQM is lowered
    to a SQL AST and rendered per Dialect, giving consistent behavior and strong type
    safety across all three query forms.
  ref: concepts.md#sqm-the-semantic-query-model-query-pipeline
- id: orm-fundamentals-jpa-vs-hibernate-062
  difficulty: advanced
  tags:
  - sqm
  - hibernate5
  - hibernate6
  - versions
  question: |
    Compared with Hibernate 5's Antlr-based HQL walker, the main benefit of Hibernate
    6's SQM is:
  options:
  - It eliminates the need for a JDBC driver
  - It caches all query results in the second-level cache automatically
  - It makes JPQL case-insensitive
  - The query AST is typed and validated against the domain model before SQL generation, catching type errors early and enabling richer, more consistent SQL
  answer: 3
  explanation: |
    Hibernate 5's translator generated SQL more directly and was less type-aware. SQM
    introduces a strongly-typed semantic model validated against entities/attributes,
    which catches mistakes earlier and produces more capable, consistent SQL across HQL
    and Criteria.
  ref: concepts.md#sqm-the-semantic-query-model-query-pipeline
- id: orm-fundamentals-jpa-vs-hibernate-063
  difficulty: advanced
  tags:
  - hibernate7
  - annotations
  - migration
  question: |
    Migrating to Hibernate 7, you find @Where("deleted = false") no longer compiles.
    What is the replacement?
  options:
  - '@Filter("deleted = false")'
  - '@SQLRestriction("deleted = false")'
  - '@Check(constraints = "deleted = false")'
  - Remove it; Hibernate 7 filters soft-deletes automatically
  answer: 1
  explanation: |
    Hibernate 7 removed @Where (and @WhereJoinTable). The replacement is @SQLRestriction
    (and @SQLJoinTableRestriction). @Filter is a different, parameterized/enable-per-
    session mechanism. For soft-delete specifically, Hibernate 6.4+ also offers the
    first-class @SoftDelete.
  ref: concepts.md#hibernate-70-breaking-changes-and-new-defaults
- id: orm-fundamentals-jpa-vs-hibernate-064
  difficulty: expert
  tags:
  - hibernate7
  - session-api
  - removed-methods
  question: |
    Legacy code calls session.save(entity), session.update(entity), and
    session.delete(entity). These fail to compile on Hibernate 7. What replaces them?
  options:
  - saveObject(), updateObject(), deleteObject()
  - They were renamed to store(), modify(), and erase()
  - persist() for save, merge() (detached) or persist() (transient) for update, and remove() for delete — the JPA verbs
  - Nothing; you must downgrade to Hibernate 6 to keep them
  answer: 2
  explanation: |
    Hibernate 7 removed the legacy pre-JPA native methods save/update/saveOrUpdate/delete
    (and load). Use the JPA operations: persist, merge (for detached) or persist (for
    transient), and remove. get is deprecated in favor of find.
  ref: concepts.md#hibernate-70-breaking-changes-and-new-defaults
- id: orm-fundamentals-jpa-vs-hibernate-065
  difficulty: advanced
  tags:
  - hibernate7
  - cascade
  - migration
  question: |
    An entity uses @OneToMany(cascade = CascadeType.SAVE_UPDATE). Why does this break
    on Hibernate 7 and what is the fix?
  options:
  - CascadeType.SAVE_UPDATE (and DELETE) were removed; use CascadeType.PERSIST/MERGE (and REMOVE)
  - SAVE_UPDATE is fine; the error is unrelated to cascade
  - Cascade was removed from JPA entirely in Hibernate 7
  - Replace it with CascadeType.ALL_LEGACY
  answer: 0
  explanation: |
    Hibernate 7 removed the legacy Hibernate-only cascade styles CascadeType.SAVE_UPDATE
    and CascadeType.DELETE (which paired with the removed save/update/delete methods).
    Use the JPA cascade types PERSIST/MERGE and REMOVE instead.
  ref: concepts.md#hibernate-70-breaking-changes-and-new-defaults
- id: orm-fundamentals-jpa-vs-hibernate-066
  difficulty: expert
  tags:
  - hibernate7
  - statelesssession
  - l2-cache
  - behavior-change
  question: |
    A senior engineer states "StatelessSession never touches the second-level cache."
    For which Hibernate version is this now INCORRECT, and why?
  options:
  - It was never true for any version
  - It is incorrect for Hibernate 5 only
  - It remains correct for all versions including 7
  - It is incorrect for Hibernate 7: StatelessSession now uses the L2 cache by default; call setCacheMode(CacheMode.IGNORE) to opt out
  answer: 3
  explanation: |
    A behavior change in Hibernate 7: StatelessSession now participates in the
    second-level cache by default. To restore the old bypass behavior, set
    setCacheMode(CacheMode.IGNORE). StatelessSession still has no persistence context /
    L1 cache / dirty checking.
  ref: concepts.md#hibernate-70-breaking-changes-and-new-defaults
- id: orm-fundamentals-jpa-vs-hibernate-067
  difficulty: expert
  tags:
  - hibernate7
  - immutable
  - behavior-change
  question: |
    On Hibernate 7, a bulk HQL update statement targets an entity annotated
    @Immutable. What happens by default?
  options:
  - It silently updates the rows anyway
  - It logs a warning and proceeds, as in earlier versions
  - It throws an exception — updating/deleting an @Immutable entity via bulk DML is now rejected by default (previously a warning)
  - The @Immutable annotation is ignored for bulk operations
  answer: 2
  explanation: |
    Hibernate 7 tightened @Immutable: bulk update/delete queries against an immutable
    entity now throw by default, where earlier versions only warned. This makes the
    read-only contract enforceable rather than advisory.
  ref: concepts.md#hibernate-70-breaking-changes-and-new-defaults
- id: orm-fundamentals-jpa-vs-hibernate-068
  difficulty: expert
  tags:
  - hibernate7
  - detached
  - refresh
  - behavior-change
  question: |
    On Hibernate 7, calling em.refresh(entity) on a DETACHED entity now results in:
  options:
  - A silent no-op
  - An IllegalArgumentException, aligning with JPA semantics (the allow_refresh_detached_entity escape hatch was removed)
  - Automatic re-attachment of the entity
  - A full reload from the second-level cache
  answer: 1
  explanation: |
    Hibernate 7 aligns with the JPA spec: refresh (and lock) on a detached entity now
    throws IllegalArgumentException, and the hibernate.allow_refresh_detached_entity
    setting that previously tolerated it was removed. Re-attach with merge() first if you
    need to refresh.
  ref: concepts.md#hibernate-70-breaking-changes-and-new-defaults
- id: orm-fundamentals-jpa-vs-hibernate-069
  difficulty: advanced
  tags:
  - hibernate7
  - scanning
  - jandex
  - license
  question: |
    Which pair of statements about Hibernate 7 packaging/infrastructure is correct?
  options:
  - Classpath entity scanning now needs the hibernate-scan-jandex module, and Hibernate relicensed to Apache License 2.0
  - Hibernate 7 dropped classpath scanning entirely and switched to GPL
  - Hibernate 7 bundles its own connection pool and removed Agroal/Hikari support
  - Jandex was removed and scanning is now done via reflection only
  answer: 0
  explanation: |
    Hibernate 7 moved classpath-based entity discovery into the separate
    hibernate-scan-jandex module, dropped several built-in pools (Vibur/Proxool/UCP) in
    favor of Agroal/Hikari, and relicensed from LGPL to Apache License 2.0.
  ref: concepts.md#hibernate-70-breaking-changes-and-new-defaults
- id: orm-fundamentals-jpa-vs-hibernate-070
  difficulty: advanced
  tags:
  - jakarta-persistence-32
  - autocloseable
  - api
  question: |
    A new feature in Jakarta Persistence 3.2 lets you write:
    try (EntityManager em = emf.createEntityManager()) { ... }. What made this legal?
  options:
  - EntityManager was always AutoCloseable since JPA 1.0
  - Jakarta Persistence 3.2 made EntityManager and EntityManagerFactory implement AutoCloseable
  - try-with-resources was changed to accept any type with a close() method
  - Hibernate added a proprietary Closeable wrapper
  answer: 1
  explanation: |
    In Jakarta Persistence 3.2 both EntityManager and EntityManagerFactory implement
    AutoCloseable, so they can be used in try-with-resources for deterministic cleanup.
    Earlier versions had close() but did not declare AutoCloseable.
  ref: concepts.md#jakarta-persistence-32-developer-facing-changes
- id: orm-fundamentals-jpa-vs-hibernate-071
  difficulty: advanced
  tags:
  - jakarta-persistence-32
  - query
  - api
  question: |
    Which Jakarta Persistence 3.2 method returns null (instead of throwing) when a
    query matches zero rows, while still throwing if more than one row matches?
  options:
  - getResultList().get(0)
  - getSingleResult()
  - getSingleResultOrNull()
  - findFirstOrDefault()
  answer: 2
  explanation: |
    getSingleResultOrNull() (added in 3.2 to Query/TypedQuery/StoredProcedureQuery)
    returns null for zero results instead of throwing NoResultException, but still throws
    NonUniqueResultException for more than one. It removes the common try/catch around
    getSingleResult().
  ref: concepts.md#jakarta-persistence-32-developer-facing-changes
- id: orm-fundamentals-jpa-vs-hibernate-072
  difficulty: advanced
  tags:
  - jakarta-persistence-32
  - bootstrap
  - persistenceconfiguration
  question: |
    Jakarta Persistence 3.2 adds PersistenceConfiguration. What does it enable?
  options:
  - A programmatic way to build an EntityManagerFactory in code, as an alternative to persistence.xml
  - A new second-level cache provider
  - A YAML-based replacement that deprecates all annotations
  - Runtime editing of entity mappings after the EMF is built
  answer: 0
  explanation: |
    PersistenceConfiguration is a standardized programmatic bootstrap API: you configure
    the persistence unit in Java code and obtain an EntityManagerFactory without a
    persistence.xml descriptor. It complements, not replaces, annotation-based mapping.
  ref: concepts.md#jakarta-persistence-32-developer-facing-changes
- id: orm-fundamentals-jpa-vs-hibernate-073
  difficulty: intermediate
  tags:
  - jakarta-persistence-32
  - records
  - embeddable
  question: |
    Which becomes possible in Jakarta Persistence 3.2 regarding Java records?
  options:
  - Records can be used as @Entity classes with mutable managed state
  - Java records are supported as embeddable classes (and for DTO-style projections)
  - Records replace all entity classes
  - Records can only be used as query parameters
  answer: 1
  explanation: |
    Jakarta Persistence 3.2 adds support for Java record types as embeddable classes and
    they fit naturally as immutable DTO projections. Records cannot be mutable managed
    @Entity instances (entities need mutable state and a no-arg constructor for dirty
    checking/proxying).
  ref: concepts.md#jakarta-persistence-32-developer-facing-changes
- id: orm-fundamentals-jpa-vs-hibernate-074
  difficulty: advanced
  tags:
  - jakarta-data
  - spring-data-jpa
  - ecosystem
  question: |
    How does Jakarta Data 1.0 relate to Spring Data JPA?
  options:
  - Jakarta Data is a proprietary Spring module
  - Jakarta Data is a JPA provider that competes with Hibernate
  - Jakarta Data is a vendor-portable specification (Jakarta EE 11) that standardizes the repository abstraction Spring Data popularized; Hibernate 7 ships an implementation
  - Jakarta Data replaces JPA entirely
  answer: 2
  explanation: |
    Jakarta Data 1.0 (Jakarta EE 11) standardizes @Repository, CrudRepository, @Find/@Query,
    and Page/PageRequest as a spec — effectively a portable answer to Spring Data JPA.
    Hibernate 7 provides an implementation (Hibernate Data Repositories). It is not a
    provider and does not replace JPA.
  ref: concepts.md#jakarta-data-10-and-hibernate-data-repositories
- id: orm-fundamentals-jpa-vs-hibernate-075
  difficulty: advanced
  tags:
  - hibernate-native
  - formula
  - mapping
  question: |
    You want an entity property whose value is computed by a SQL sub-expression at read
    time, with no backing column. Which Hibernate-native annotation fits?
  options:
  - '@Formula("(select count(*) from review r where r.book_id = id)")'
  - '@Transient'
  - '@Column(insertable = false, updatable = false)'
  - '@Generated(GenerationTime.NEVER)'
  answer: 0
  explanation: |
    @Formula maps a read-only property to a SQL fragment evaluated in the SELECT, with no
    real column. @Transient means "not persisted at all" (no SQL). @Column mapping still
    requires a real column. @Formula is Hibernate-native (org.hibernate.annotations).
  ref: concepts.md#hibernate-native-features-beyond-the-spec
- id: orm-fundamentals-jpa-vs-hibernate-076
  difficulty: expert
  tags:
  - hibernate-native
  - filter
  - sqlrestriction
  - distinction
  question: |
    What is the key difference between @SQLRestriction and @Filter in Hibernate?
  options:
  - They are identical; @Filter is just the deprecated name
  - '@SQLRestriction is a static, always-applied condition; @Filter is parameterized and must be explicitly enabled per session via session.enableFilter(...)'
  - '@SQLRestriction is parameterized while @Filter is always on'
  - '@Filter only works on native SQL queries'
  answer: 1
  explanation: |
    @SQLRestriction adds a fixed WHERE condition that is always applied (good for
    soft-delete). @Filter/@FilterDef defines a parameterized filter that is inactive
    unless enabled for the current session with enableFilter(...) and setParameter(...),
    making it suited to per-session concerns like multi-tenancy or effective-dated data.
  ref: concepts.md#hibernate-native-features-beyond-the-spec
- id: orm-fundamentals-jpa-vs-hibernate-077
  difficulty: advanced
  tags:
  - hibernate-native
  - naturalid
  - mapping
  question: |
    An entity has a unique business key (email) besides its surrogate @Id. Which
    Hibernate-native feature gives you a first-class, separately cached lookup by that
    key?
  options:
  - '@Column(unique = true) alone is enough for a cached lookup API'
  - '@Id must be moved onto the email field'
  - '@NaturalId, queried via session.byNaturalId(...) / bySimpleNaturalId(...)'
  - '@SecondaryTable'
  answer: 2
  explanation: |
    @NaturalId marks a business key and enables session.byNaturalId(...) /
    bySimpleNaturalId(...), which have their own natural-id-to-PK cache resolution. A
    plain unique @Column enforces uniqueness but gives no dedicated cached lookup API.
  ref: concepts.md#hibernate-native-features-beyond-the-spec
- id: orm-fundamentals-jpa-vs-hibernate-078
  difficulty: expert
  tags:
  - hibernate-native
  - dynamicupdate
  - tradeoff
  question: |
    What is the trade-off of annotating a wide-table entity with @DynamicUpdate?
  options:
  - It disables optimistic locking
  - UPDATE SQL includes only the columns that actually changed (helpful for wide tables and column-level concurrency), but Hibernate cannot reuse a single cached prepared statement since the SQL varies per flush
  - It forces every column to be updated on every flush
  - It only works with StatelessSession
  answer: 1
  explanation: |
    By default Hibernate generates a static UPDATE touching all columns (cached, reusable
    prepared statement). @DynamicUpdate generates SQL for only the dirty columns, which
    helps wide tables and reduces write contention, but the SQL text varies per update so
    the prepared statement cannot be cached/reused — a CPU/parse trade-off.
  ref: concepts.md#hibernate-native-features-beyond-the-spec
- id: orm-fundamentals-jpa-vs-hibernate-079
  difficulty: expert
  tags:
  - bulk
  - persistence-context
  - stale
  - gotcha
  question: |
    You load an Account entity, then run a bulk JPQL "update Account set status =
    'CLOSED' where ...", then read account.getStatus() in the same persistence context.
    What do you see and why?
  options:
  - The new value CLOSED, because bulk updates flush into the persistence context
  - The OLD value, because bulk JPQL DML executes directly against the database and bypasses the persistence context / L1 cache; the managed instance is not refreshed
  - A LazyInitializationException
  - null, because the row was invalidated
  answer: 1
  explanation: |
    Bulk JPQL/HQL UPDATE/DELETE runs as a single SQL statement straight to the database
    and does not update already-managed entities in the persistence context. So the
    in-memory instance keeps its stale value until you em.refresh() it or clear() the
    context and reload.
  ref: concepts.md#bulk-operations-and-why-entity-by-entity-is-slow
- id: orm-fundamentals-jpa-vs-hibernate-080
  difficulty: expert
  tags:
  - bulk
  - cascade
  - callbacks
  - gotcha
  question: |
    Besides bypassing the persistence context, what else does a bulk JPQL
    UPDATE/DELETE NOT do?
  options:
  - It does not run within a transaction
  - It does not cascade to associated entities and does not fire lifecycle callbacks like @PreUpdate/@PreRemove
  - It cannot use bind parameters
  - It always locks the entire table with SERIALIZABLE isolation
  answer: 1
  explanation: |
    Bulk DML is set-based SQL, not entity-level operations, so it neither cascades to
    related entities nor triggers JPA lifecycle callbacks (@PreUpdate, @PreRemove, etc.).
    If you rely on cascade or callbacks (e.g. to delete children or audit), bulk DML will
    silently skip them.
  ref: concepts.md#bulk-operations-and-why-entity-by-entity-is-slow
- id: orm-fundamentals-jpa-vs-hibernate-081
  difficulty: expert
  tags:
  - statelesssession
  - hibernate7
  - batching
  - behavior-change
  question: |
    In Hibernate 7, why does setting hibernate.jdbc.batch_size no longer speed up a
    StatelessSession bulk insert, and what should you do instead?
  options:
  - Because StatelessSession cannot batch at all; you must use a normal Session
  - Because hibernate.jdbc.batch_size no longer applies to StatelessSession in HB7; call setJdbcBatchSize() on it or use insertMultiple()/updateMultiple()/deleteMultiple()
  - Because batching requires the second-level cache to be disabled first
  - Because StatelessSession ignores all inserts by default
  answer: 1
  explanation: |
    In Hibernate 7 the global hibernate.jdbc.batch_size setting no longer governs
    StatelessSession. Configure batching directly via setJdbcBatchSize(), or use the new
    insertMultiple()/updateMultiple()/deleteMultiple() bulk APIs designed for
    StatelessSession.
  ref: concepts.md#bulk-operations-and-why-entity-by-entity-is-slow
- id: orm-fundamentals-jpa-vs-hibernate-082
  difficulty: advanced
  tags:
  - persistence-context
  - l1-cache
  - l2-cache
  - architecture
  question: |
    How do the first-level and second-level caches differ in scope and whether they are
    optional in JPA/Hibernate?
  options:
  - Both caches are optional and must be explicitly enabled before any entity is managed
  - The first-level cache (the persistence context) is mandatory and always active, scoped to a single EntityManager/Session; the second-level cache is optional, opt-in, and shared across the whole EntityManagerFactory/SessionFactory
  - The first-level cache is optional and shared across threads; the second-level cache is mandatory and per-transaction
  - Both caches are shared across every EntityManager and are always on
  answer: 1
  explanation: |
    The first-level cache IS the persistence context: it is mandatory, always on, and
    scoped to one EntityManager/Session (it guarantees identity and drives dirty
    checking). The second-level cache is optional — you configure a provider and mark
    entities cacheable — and it is shared across the SessionFactory/EntityManagerFactory
    (all sessions). Deep L2 mechanics/concurrency strategies live in the caching topic;
    here just fix the L1-mandatory vs L2-optional distinction.
  ref: concepts.md#the-jpa-architecture-entitymanagerfactory-entitymanager-and-the-persistence-unit
- id: orm-fundamentals-jpa-vs-hibernate-083
  difficulty: expert
  tags:
  - associations
  - owning-side
  - mappedby
  - gotcha
  question: |
    You set child.setParent(p) but only add nothing to parent.getChildren(), OR you add
    to parent.getChildren() (the mappedBy inverse side) but never set child.parent.
    Which produces NO SQL update to the FK, and why?
  options:
  - Updating only the inverse @OneToMany collection produces no FK change, because only the owning side (the @ManyToOne holding the FK column) drives the FK write
  - Updating only the owning @ManyToOne produces no change
  - Both always produce identical SQL
  - Neither side can change the FK without a native query
  answer: 0
  explanation: |
    A bidirectional association is one FK but two references. The owning side is the one
    with the FK column (the @ManyToOne; mappedBy names the inverse). Hibernate only
    inspects the owning side to generate the FK UPDATE. Modifying just the inverse
    collection persists nothing, which is why helper methods should set both sides.
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-084
  difficulty: expert
  tags:
  - join-fetch
  - pagination
  - n-plus-one
  - gotcha
  question: |
    You run "select o from Order o join fetch o.lineItems" with setFirstResult(0) and
    setMaxResults(20) to page the results. What does Hibernate do?
  options:
  - Applies LIMIT/OFFSET in SQL and returns exactly 20 orders efficiently
  - Throws an exception refusing to run the query
  - Fetches the full joined result set and paginates the collection-fetch IN MEMORY (Hibernate 6 warns, e.g. HHH000104), which can be very expensive
  - Silently drops the join fetch and runs N+1 queries
  answer: 2
  explanation: |
    Because a collection join fetch multiplies rows per parent, applying SQL
    LIMIT/OFFSET would truncate a parent's collection. Hibernate instead reads all rows
    and paginates in memory, emitting a warning (HHH000104). The fix is to page parent
    ids first (or use a subquery / entity graph without paginating a fetched collection).
  ref: concepts.md#what-orm-is-and-the-object-relational-impedance-mismatch
- id: orm-fundamentals-jpa-vs-hibernate-085
  difficulty: advanced
  tags:
  - versions
  - hibernate5
  - hibernate6
  - hibernate7
  - summary
  question: |
    Which single line best summarizes the progression Hibernate 5 -> 6 -> 7?
  options:
  - 'HB5: jakarta, SQM; HB6: javax; HB7: removed HQL'
  - 'HB5: javax + Java 8 + old Type system + Antlr HQL; HB6: jakarta + Java 11 + SQM + JavaType/JdbcType; HB7: Java 17 + Jakarta Persistence 3.2 + legacy Session methods/@Proxy/@Where removed + Apache license'
  - All three are functionally identical apart from bug fixes
  - 'HB7 reverted to javax to improve compatibility'
  answer: 1
  explanation: |
    Hibernate 5 was javax / Java 8 with the monolithic Type system and Antlr-based HQL.
    Hibernate 6 moved to jakarta / Java 11+, introduced the SQM query engine and the
    JavaType/JdbcType type model. Hibernate 7 raised the baseline to Java 17, targets
    Jakarta Persistence 3.2, removed legacy native Session methods and annotations like
    @Proxy/@Where, and relicensed to Apache.
  ref: concepts.md#hibernate-70-breaking-changes-and-new-defaults
