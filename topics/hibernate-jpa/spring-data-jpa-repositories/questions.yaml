topic: Spring Data JPA & Repository Abstraction
domain: hibernate-jpa
topic_slug: spring-data-jpa-repositories
version: 1
questions:
- id: spring-data-jpa-repositories-001
  difficulty: beginner
  tags:
  - hierarchy
  - jpa-repository
  - crud-repository
  question: |
    In the Spring Data repository hierarchy, which interface adds JPA-specific
    operations like `flush()`, `saveAndFlush()`, and `deleteAllInBatch()`?
  options:
  - CrudRepository
  - Repository
  - PagingAndSortingRepository
  - JpaRepository
  answer: 3
  explanation: |
    `JpaRepository<T, ID>` is the JPA-specialized interface. It extends the CRUD and
    paging interfaces and adds `flush()`, `saveAndFlush()`, `deleteAllInBatch()`,
    `getReferenceById()`, and overrides `findAll`/`saveAll` to return `List`.
    `CrudRepository` and `PagingAndSortingRepository` are technology-neutral.
  ref: concepts.md#the-repository-interface-hierarchy
- id: spring-data-jpa-repositories-002
  difficulty: beginner
  tags:
  - hierarchy
  - marker-interface
  question: |
    What methods does the base `Repository<T, ID>` interface declare?
  options:
  - None — it is an empty marker interface
  - save and findById only
  - All CRUD methods
  - Only findAll and count
  answer: 0
  explanation: |
    `Repository<T, ID>` is a pure marker (no methods). Extending it registers the type
    as a Spring Data managed repository and lets you selectively expose methods without
    inheriting the whole CRUD surface.
  ref: concepts.md#the-repository-interface-hierarchy
- id: spring-data-jpa-repositories-003
  difficulty: beginner
  tags:
  - derived-query
  - method-name
  question: |
    What JPQL does the derived method `findByLastNameAndAgeGreaterThan(String ln, int age)`
    produce?
  options:
  - SELECT a FROM Author a WHERE a.lastName = ?1 OR a.age > ?2
  - SELECT a FROM Author a WHERE a.lastName = ?1 AND a.age > ?2
  - SELECT a FROM Author a WHERE a.lastName LIKE ?1 AND a.age >= ?2
  - SELECT a FROM Author a WHERE a.lastName = ?1 AND a.age < ?2
  answer: 1
  explanation: |
    The predicate after `By` is parsed into `WHERE lastName = ?1 AND age > ?2`. `And`
    joins the conditions and `GreaterThan` maps to a strict `>` on `age`, bound to the
    arguments in declaration order.
  ref: concepts.md#derived-query-methods
- id: spring-data-jpa-repositories-004
  difficulty: intermediate
  tags:
  - derived-query
  - startup-validation
  question: |
    A derived query method references a property name that does not exist on the entity.
    When does Spring Data report the error?
  options:
  - At application/context startup, when building the repository proxy
  - The first time the method is invoked at runtime
  - Only when the generated SQL fails at the database
  - Never — the property is silently ignored
  answer: 0
  explanation: |
    Spring validates derived query method names when it builds the repository proxy at
    startup, failing fast if a property expression cannot be resolved against the entity
    metamodel. This surfaces typos immediately rather than at request time.
  ref: concepts.md#derived-query-methods
- id: spring-data-jpa-repositories-005
  difficulty: intermediate
  tags:
  - save
  - persist
  - merge
  question: |
    For a detached entity (has a non-null id but is not in the persistence context),
    what does `SimpleJpaRepository.save(entity)` call internally?
  options:
  - entityManager.persist(entity)
  - entityManager.refresh(entity)
  - entityManager.merge(entity)
  - entityManager.lock(entity)
  answer: 2
  explanation: |
    `save` checks `isNew`. A detached entity is not new, so `save` calls
    `entityManager.merge(entity)`, which copies its state onto a managed instance
    (loading it first if needed) and returns that managed copy. `persist` is used only
    for new entities.
  ref: concepts.md#how-save-works-persist-vs-merge--isnew-detection
- id: spring-data-jpa-repositories-006
  difficulty: advanced
  tags:
  - save
  - merge
  - gotcha
  question: |
    You call `Author saved = repo.save(detachedAuthor)` and then keep mutating
    `detachedAuthor`. Why do those later mutations not get persisted?
  options:
  - merge returns a new managed instance; detachedAuthor stays detached, so only `saved` is tracked
  - save() only works on new entities, so it did nothing
  - You must call flush() before any mutation is tracked
  - Mutations after save are always ignored by dirty checking
  answer: 0
  explanation: |
    For a detached entity, `save` delegates to `merge`, which returns a *different*
    managed copy. The original argument remains detached and outside the persistence
    context, so its mutations aren't dirty-checked. Always use the returned instance.
  ref: concepts.md#how-save-works-persist-vs-merge--isnew-detection
- id: spring-data-jpa-repositories-007
  difficulty: advanced
  tags:
  - isnew
  - persistable
  - version
  question: |
    Absent a `Persistable` implementation and a `@Version` field, how does Spring Data's
    default `isNew` decide whether an entity is new?
  options:
  - It always returns true so save always calls persist
  - It queries the database with existsById
  - The entity is new if its @Id is null (or zero for a primitive id type)
  - The entity is new if it was created in the current transaction
  answer: 2
  explanation: |
    The default `JpaMetamodelEntityInformation` checks `Persistable.isNew()` first, then
    a null object-typed `@Version`, then falls back to the `@Id`: new when the id is null
    (object type) or zero (primitive type). No database query is involved in this branch.
  ref: concepts.md#how-save-works-persist-vs-merge--isnew-detection
- id: spring-data-jpa-repositories-008
  difficulty: advanced
  tags:
  - isnew
  - assigned-id
  - persistable
  - gotcha
  question: |
    An entity uses an application-assigned id (e.g. a UUID set in the constructor). What
    goes wrong when you `save()` a brand-new instance, and what is the fix?
  options:
  - save sees a non-null id, treats it as not-new, calls merge (extra SELECT); fix by implementing Persistable
  - Nothing goes wrong; persist is always used for assigned ids
  - save throws because assigned ids are not allowed with Spring Data
  - save inserts twice; fix by disabling dirty checking
  answer: 0
  explanation: |
    With an assigned non-null id, default `isNew` concludes the entity is not new, so
    `save` calls `merge`, which issues a wasteful `SELECT` (and copies state) before the
    insert. Implement `Persistable<ID>` with a transient `isNew` flag (managed via
    lifecycle callbacks) to force `persist`.
  ref: concepts.md#how-save-works-persist-vs-merge--isnew-detection
- id: spring-data-jpa-repositories-009
  difficulty: intermediate
  tags:
  - pagination
  - page
  - slice
  - count
  question: |
    What extra work does returning `Page<T>` do that returning `Slice<T>` does not?
  options:
  - It runs a separate COUNT query to compute total elements and pages
  - It caches the results in the second-level cache
  - It eagerly fetches all lazy associations
  - It opens a new transaction per page
  answer: 0
  explanation: |
    `Page` executes an additional `COUNT(*)` query so it can report total elements and
    total pages. `Slice` avoids the count: it fetches `size + 1` rows and infers
    `hasNext()` from whether the extra row exists.
  ref: concepts.md#pagination--sorting-page-vs-slice
- id: spring-data-jpa-repositories-010
  difficulty: intermediate
  tags:
  - pagination
  - slice
  - mechanism
  question: |
    How does a `Slice<T>` determine `hasNext()` without a COUNT query?
  options:
  - It always returns true and lets the caller discover the end
  - It reads the table's row-count statistics
  - It runs the data query twice
  - It requests one more row than the page size and checks if it came back
  answer: 3
  explanation: |
    Spring asks the database for `pageSize + 1` rows. If the extra row is present, there
    is a next page (`hasNext()` true) and the extra row is trimmed off; otherwise this is
    the last slice. No `COUNT` is needed, which is why `Slice` suits infinite scroll.
  ref: concepts.md#pagination--sorting-page-vs-slice
- id: spring-data-jpa-repositories-011
  difficulty: intermediate
  tags:
  - modifying
  - transactional
  - return-type
  question: |
    Which annotations must accompany a bulk JPQL `UPDATE` in a repository method?
  options:
  - '@Query and @Modifying, plus a write transaction (@Transactional)'
  - '@Query alone is enough'
  - '@Modifying alone; transactions are automatic'
  - '@BulkUpdate and @ReadOnly'
  answer: 0
  explanation: |
    An `UPDATE`/`DELETE` `@Query` needs `@Modifying` so Spring calls `executeUpdate()`
    instead of `getResultList()`, and it needs a writable transaction (repository query
    methods default to `readOnly`), so `@Transactional` on the method or a service.
  ref: concepts.md#modifying-queries-modifying-bulk-update--delete
- id: spring-data-jpa-repositories-012
  difficulty: advanced
  tags:
  - modifying
  - persistence-context
  - stale
  - gotcha
  question: |
    After a `@Modifying` bulk `UPDATE` sets `active = false`, you re-read the same entity
    in the same transaction and still see `active = true`. Why?
  options:
  - The update was rolled back
  - JPQL updates are asynchronous
  - Bulk DML bypasses the persistence context/L1 cache, which still holds the stale entity
  - The entity was detached by the update
  answer: 2
  explanation: |
    A bulk `UPDATE` runs as a single SQL statement directly against the DB, bypassing the
    persistence context and first-level cache. Any already-managed entity keeps its old
    in-memory state. Use `clearAutomatically = true` (or clear the context) so subsequent
    reads re-fetch fresh state.
  ref: concepts.md#modifying-queries-modifying-bulk-update--delete
- id: spring-data-jpa-repositories-013
  difficulty: advanced
  tags:
  - modifying
  - clear-automatically
  - flush-automatically
  question: |
    What does `@Modifying(clearAutomatically = true)` do?
  options:
  - Flushes pending changes before the bulk statement
  - Rolls back the transaction if no rows match
  - Clears the persistence context after the statement so later reads re-fetch fresh state
  - Deletes all cached query results globally
  answer: 2
  explanation: |
    `clearAutomatically = true` clears the persistence context *after* the bulk
    statement, detaching managed entities so subsequent reads reload current DB state
    (avoiding stale reads). `flushAutomatically = true` handles the *before* side —
    flushing pending changes first. Note clearing also discards unflushed changes.
  ref: concepts.md#modifying-queries-modifying-bulk-update--delete
- id: spring-data-jpa-repositories-014
  difficulty: advanced
  tags:
  - modifying
  - callbacks
  - version
  - cascade
  question: |
    Which is TRUE of a bulk `@Modifying` JPQL `UPDATE`?
  options:
  - It triggers @PreUpdate callbacks and increments @Version
  - It cascades to associated entities automatically
  - It does NOT fire lifecycle callbacks, cascade, or increment @Version
  - It loads each matched entity into the persistence context first
  answer: 2
  explanation: |
    Bulk update/delete operate at the SQL level and skip the object layer: no
    `@PrePersist`/`@PreUpdate` callbacks, no cascading, and no automatic `@Version`
    increment. That is the trade-off for efficiency — use load-modify-flush (dirty
    checking) when you need those behaviors.
  ref: concepts.md#modifying-queries-modifying-bulk-update--delete
- id: spring-data-jpa-repositories-015
  difficulty: intermediate
  tags:
  - query
  - jpql
  - native
  question: |
    How do you make a `@Query` execute raw SQL against real table/column names instead
    of JPQL?
  options:
  - Set nativeQuery = true on the @Query
  - 'Prefix the query with NATIVE:'
  - Use @NativeQuery instead of @Query
  - Set jpql = false on the @Query
  answer: 0
  explanation: |
    `@Query(value = "...", nativeQuery = true)` runs the string as native SQL, referencing
    real tables/columns and using DB-specific features. Without it, the string is treated
    as JPQL over entity/field names and Hibernate emits dialect SQL.
  ref: concepts.md#query-jpql-and-native-sql
- id: spring-data-jpa-repositories-016
  difficulty: advanced
  tags:
  - query
  - native
  - sort
  - gotcha
  question: |
    You pass a `Pageable` with a `Sort` to a repository method backed by a native
    `@Query`. What happens to the sort?
  options:
  - Hibernate rewrites the SQL to add ORDER BY
  - The method throws UnsupportedOperationException
  - It is silently not applied — you must put ORDER BY in the SQL yourself
  - The results are sorted in Java memory automatically
  answer: 2
  explanation: |
    Spring cannot safely inject `ORDER BY` into arbitrary native SQL, so `Sort` from a
    `Pageable` is not applied to native queries (silently ignored in current versions).
    Put the `ORDER BY` in the SQL, or use JPQL where the `Sort` is translated properly.
  ref: concepts.md#query-jpql-and-native-sql
- id: spring-data-jpa-repositories-017
  difficulty: advanced
  tags:
  - query
  - native
  - pagination
  - count-query
  question: |
    For a paginated native `@Query` returning `Page<T>`, what must you typically supply?
  options:
  - Nothing extra; Spring derives the count automatically for native queries
  - A manual COUNT executed in a custom impl only
  - A @Count annotation on the method
  - A separate countQuery attribute on the @Query
  answer: 3
  explanation: |
    For native `Page` queries Spring often cannot derive the count SQL from the data SQL,
    so you provide `countQuery = "SELECT count(*) ..."` on the `@Query`. JPQL queries, by
    contrast, get an auto-derived count.
  ref: concepts.md#query-jpql-and-native-sql
- id: spring-data-jpa-repositories-018
  difficulty: beginner
  tags:
  - query
  - param
  - named-parameters
  question: |
    In `@Query("SELECT a FROM Author a WHERE a.age > :age")`, how is the method argument
    bound to `:age`?
  options:
  - By annotating the argument with @Param("age")
  - By declaring @Bind("age")
  - By naming the argument exactly age with no annotation ever required
  - By its position only
  answer: 0
  explanation: |
    Named parameters (`:age`) are bound with `@Param("age")` on the corresponding method
    argument. (With `-parameters` compilation the annotation can sometimes be inferred,
    but including `@Param` is the robust, recommended practice.) Positional binding uses
    `?1`, `?2` instead.
  ref: concepts.md#named-parameters-positional-params--spel
- id: spring-data-jpa-repositories-019
  difficulty: advanced
  tags:
  - query
  - spel
  - entity-name
  question: |
    What is the most common use of SpEL inside `@Query`, e.g. `#{#entityName}`?
  options:
  - To concatenate user input directly into the SQL string
  - To force a native query
  - To disable parameter binding for performance
  - To write generic base-repository queries that resolve the managed entity's name
  answer: 3
  explanation: |
    `#{#entityName}` expands to the current repository's domain type name, letting you
    author generic base repositories (e.g. `SELECT e FROM #{#entityName} e ...`) reused
    across entities. SpEL expressions are still bound as parameters, not string-injected
    raw SQL.
  ref: concepts.md#named-parameters-positional-params--spel
- id: spring-data-jpa-repositories-020
  difficulty: intermediate
  tags:
  - projection
  - closed-interface
  question: |
    A closed interface projection declares only `getFirstName()` and `getLastName()`.
    What does Hibernate select?
  options:
  - The whole entity, then Spring copies two fields
  - Nothing until each getter is called (lazy per-column)
  - Only the first_name and last_name columns
  - All columns plus a discriminator
  answer: 2
  explanation: |
    A closed projection (getters matching properties exactly) lets Hibernate restrict the
    SELECT to just those columns (`SELECT a.first_name, a.last_name ...`). Spring returns
    a proxy implementing the interface — no full entity is hydrated.
  ref: concepts.md#projections-interface-dto--dynamic
- id: spring-data-jpa-repositories-021
  difficulty: advanced
  tags:
  - projection
  - open-interface
  - spel
  - gotcha
  question: |
    Why can an OPEN interface projection (a getter annotated with `@Value` using SpEL
    like `#{target.firstName + ' ' + target.lastName}`) NOT prune columns?
  options:
  - SpEL is disabled for projections
  - Column pruning only works for DTO classes, never interfaces
  - Open projections always run native SQL
  - Spring must load the whole entity so the SpEL can access target's fields
  answer: 3
  explanation: |
    An open projection's SpEL references `target`, the backing entity, so Spring must
    materialize the entire entity to evaluate the expression. That defeats the
    column-selection optimization that closed projections enjoy.
  ref: concepts.md#projections-interface-dto--dynamic
- id: spring-data-jpa-repositories-022
  difficulty: intermediate
  tags:
  - projection
  - dto
  - constructor-expression
  question: |
    Which JPQL feature backs a class/record DTO projection so only the needed columns are
    selected?
  options:
  - 'A constructor expression: SELECT new com.example.AuthorDto(a.firstName, a.lastName)'
  - Second-level cache regions
  - A @SqlResultSetMapping requirement for all DTOs
  - A discriminator column
  answer: 0
  explanation: |
    Class-based DTO projections use a JPQL constructor expression
    (`SELECT new ...Dto(a.firstName, a.lastName)`), so Hibernate selects only those
    columns and instantiates the DTO. Derived queries returning the DTO build the same
    constructor call. The DTOs are detached, non-managed objects.
  ref: concepts.md#projections-interface-dto--dynamic
- id: spring-data-jpa-repositories-023
  difficulty: advanced
  tags:
  - projection
  - dynamic
  question: |
    What does a dynamic projection method signature like
    `<T> List<T> findByLastName(String ln, Class<T> type)` enable?
  options:
  - The caller chooses the projection/entity shape at call time by passing a Class
  - It runs the query asynchronously
  - It projects into a Map keyed by column name
  - It forces a native query for every call
  answer: 0
  explanation: |
    A dynamic projection lets one method serve multiple result shapes: the caller passes
    the target type (`repo.findByLastName("Bloch", AuthorDto.class)` or `Author.class`)
    and Spring produces that projection, avoiding a separate method per shape.
  ref: concepts.md#projections-interface-dto--dynamic
- id: spring-data-jpa-repositories-024
  difficulty: intermediate
  tags:
  - projection
  - dto
  - lazy-init
  question: |
    Why do DTO projections sidestep `LazyInitializationException`?
  options:
  - They keep the session open forever
  - They run inside the view layer transaction
  - They force EAGER fetching on all associations
  - They return detached plain objects with no lazy proxies to initialize
  answer: 3
  explanation: |
    A DTO holds only the scalar values selected by the query — plain detached objects with
    no managed entity or lazy proxy. There is nothing to lazily initialize later, so the
    exception cannot occur. This makes DTOs ideal for read-only endpoints.
  ref: concepts.md#projections-interface-dto--dynamic
- id: spring-data-jpa-repositories-025
  difficulty: intermediate
  tags:
  - specifications
  - jpa-specification-executor
  - criteria
  question: |
    To use `Specification<T>` for dynamic Criteria-based queries, what must the repository
    interface do?
  options:
  - Extend QuerydslPredicateExecutor
  - Implement Specification<T> directly
  - Add @EnableSpecifications
  - Extend JpaSpecificationExecutor<T>
  answer: 3
  explanation: |
    Mixing in `JpaSpecificationExecutor<T>` adds `findAll(Specification)`,
    `count(Specification)`, etc. A `Specification` is a lambda that builds a Criteria
    `Predicate` from `(root, query, criteriaBuilder)`, and they compose with `and`/`or`.
  ref: concepts.md#specifications--querydsl-dynamic-queries
- id: spring-data-jpa-repositories-026
  difficulty: advanced
  tags:
  - specifications
  - querydsl
  - criteria
  question: |
    What do both Specifications and QueryDSL predicates ultimately compile down to?
  options:
  - Raw native SQL strings
  - Named queries in orm.xml
  - The JPA Criteria API (then JPQL/SQL)
  - Stored procedures
  answer: 2
  explanation: |
    Both are type-safe builders over the JPA Criteria API, which Hibernate translates to
    JPQL/SQL. Specifications are built into Spring Data (no codegen); QueryDSL needs an
    annotation processor to generate `Q`-classes but reads more fluently.
  ref: concepts.md#specifications--querydsl-dynamic-queries
- id: spring-data-jpa-repositories-027
  difficulty: intermediate
  tags:
  - entity-graph
  - n-plus-one
  question: |
    What does `@EntityGraph(attributePaths = {"books"})` on a repository method do?
  options:
  - Permanently changes the association's fetch type to EAGER on the entity
  - Creates a database view called books
  - Adds a second-level cache region for books
  - Fetches the `books` association in the same query for that method only
  answer: 3
  explanation: |
    `@EntityGraph` tells Hibernate to fetch the listed associations join-eagerly for that
    specific query, without altering the entity's default fetch type elsewhere. It emits
    a single query with joins, eliminating N+1 for that method.
  ref: concepts.md#fixing-n1-at-the-repository-entitygraph--fetch-joins
- id: spring-data-jpa-repositories-028
  difficulty: advanced
  tags:
  - n-plus-one
  - join-fetch
  - entity-graph
  question: |
    A method returns `List<Author>` and callers iterate `author.getBooks()` (LAZY),
    firing 1 + N queries. Which is the correct repository-level fix?
  options:
  - Change @OneToMany books to FetchType.EAGER
  - Enable Open-Session-In-View
  - Wrap each access in a new transaction
  - Add @EntityGraph(attributePaths = "books") or a JOIN FETCH @Query
  answer: 3
  explanation: |
    Fetch what the use case needs per query: `@EntityGraph(attributePaths="books")` or a
    `JOIN FETCH` `@Query`. Switching to global EAGER causes N+1/Cartesian products
    elsewhere, and OSIV merely hides the N+1 in the view layer rather than fixing it.
  ref: concepts.md#fixing-n1-at-the-repository-entitygraph--fetch-joins
- id: spring-data-jpa-repositories-029
  difficulty: expert
  tags:
  - join-fetch
  - pagination
  - in-memory
  - gotcha
  question: |
    What is the danger of combining `JOIN FETCH` of a collection with a `Pageable`
    (`firstResult`/`maxResults`)?
  options:
  - Hibernate throws MultipleBagFetchException
  - The COUNT query is skipped silently
  - Hibernate warns HHH000104 and paginates in memory after loading all rows
  - Pagination is applied but sorting is dropped
  answer: 2
  explanation: |
    With a collection fetch join, `LIMIT`/`OFFSET` cannot be applied at the SQL level
    (rows are multiplied by the join), so Hibernate loads the full result set and
    paginates in memory — logging `HHH000104`. On large data this is a severe footgun;
    fetch the collection in a second query or use batch fetching.
  ref: concepts.md#fixing-n1-at-the-repository-entitygraph--fetch-joins
- id: spring-data-jpa-repositories-030
  difficulty: expert
  tags:
  - join-fetch
  - multiple-bag-fetch
  - collections
  question: |
    Why does fetch-joining two `List`-typed `@OneToMany` collections in one query throw
    `MultipleBagFetchException`?
  options:
  - Lists are not supported by JPA
  - The second-level cache cannot hold two bags
  - JOIN FETCH only works with @ManyToOne
  - Two bag collections joined together create a Cartesian product Hibernate refuses
  answer: 3
  explanation: |
    Fetching two bag (unordered `List`) collections simultaneously multiplies rows into a
    Cartesian product, which Hibernate rejects with `MultipleBagFetchException`. Fetch one
    collection per query, switch a collection to `Set`, or use `@BatchSize`.
  ref: concepts.md#fixing-n1-at-the-repository-entitygraph--fetch-joins
- id: spring-data-jpa-repositories-031
  difficulty: intermediate
  tags:
  - custom-repository
  - fragment
  - naming
  question: |
    You add a custom fragment interface `AuthorRepositoryCustom`. What must the
    implementation class be named (default postfix)?
  options:
  - AuthorRepositoryCustomImpl
  - AuthorRepositoryCustomDefault
  - DefaultAuthorRepositoryCustom
  - AuthorRepositoryCustomBean
  answer: 0
  explanation: |
    Spring detects the impl by the fragment interface name plus the configured postfix,
    which defaults to `Impl` — so `AuthorRepositoryCustomImpl`. It is stitched into the
    generated proxy when the main repository composes the fragment interface.
  ref: concepts.md#custom-repository-implementations
- id: spring-data-jpa-repositories-032
  difficulty: advanced
  tags:
  - custom-repository
  - entity-manager
  question: |
    Inside a custom repository implementation, how do you get access to the
    `EntityManager` to build a `CriteriaQuery` or call `createQuery`?
  options:
  - Autowire the JpaRepository and call getEntityManager()
  - Inject it with @PersistenceContext EntityManager em
  - Use a static EntityManagerHolder
  - It is not possible; custom impls cannot use the EntityManager
  answer: 1
  explanation: |
    A custom fragment impl is a Spring bean, so you inject the container-managed
    `EntityManager` with `@PersistenceContext`. This is how you drop to raw JPA (Criteria,
    native, stored procs) where derived/`@Query` methods can't reach.
  ref: concepts.md#custom-repository-implementations
- id: spring-data-jpa-repositories-033
  difficulty: advanced
  tags:
  - osiv
  - lazy-init
  - default
  question: |
    In a default Spring Boot app, what does Open-Session-In-View (`spring.jpa.open-in-view=true`)
    do?
  options:
  - Opens a new transaction for every lazy load
  - Disables the first-level cache during rendering
  - Forces all associations to EAGER
  - Keeps the persistence context open for the whole web request, including view/serialization
  answer: 3
  explanation: |
    OSIV binds the `EntityManager`/persistence context to the whole request thread, so
    lazy associations touched during view rendering or JSON serialization can still
    initialize after the transactional service returned — preventing
    `LazyInitializationException` at the cost of hidden behavior.
  ref: concepts.md#open-session-in-view-osiv
- id: spring-data-jpa-repositories-034
  difficulty: advanced
  tags:
  - osiv
  - n-plus-one
  - connection-pool
  question: |
    Why do many senior engineers argue for disabling OSIV despite it preventing
    LazyInitializationException?
  options:
  - It disables the second-level cache
  - It makes derived queries fail at startup
  - It forces every query to be native
  - It hides view-layer N+1, holds DB connections longer, and runs queries outside the tx boundary
  answer: 3
  explanation: |
    OSIV lets lazy loads fire silently during serialization (view-layer N+1, each in
    auto-commit), can hold the DB connection for the entire request (hurting pool
    throughput), and scatters queries outside the explicit transaction. Disabling it turns
    a missing fetch into a loud, early exception.
  ref: concepts.md#open-session-in-view-osiv
- id: spring-data-jpa-repositories-035
  difficulty: expert
  tags:
  - osiv
  - lazy-load
  - auto-commit
  question: |
    With OSIV enabled, a Jackson serializer touches a lazy collection after the service's
    transaction has committed. In what mode does that lazy SELECT run?
  options:
  - In the original committed transaction, reopened
  - In a new REQUIRES_NEW transaction
  - In auto-commit, as a separate DB round-trip outside any explicit transaction
  - It does not run; a cached value is returned
  answer: 2
  explanation: |
    After the service transaction commits, OSIV keeps the session open but there is no
    active transaction, so each lazy initialization triggers its own auto-commit SELECT —
    a separate round-trip per association. This is exactly the silent view-layer N+1 that
    makes OSIV controversial.
  ref: concepts.md#open-session-in-view-osiv
- id: spring-data-jpa-repositories-036
  difficulty: intermediate
  tags:
  - derived-query
  - limiting
  - keywords
  question: |
    Which derived-query prefix limits results to the first 3 rows?
  options:
  - findLimit3By...
  - find3By...
  - findMax3By...
  - findTop3By... (or findFirst3By...)
  answer: 3
  explanation: |
    `findTop3By...` and `findFirst3By...` (equivalently `Top`/`First` with a number) limit
    the result set. Without a number, `findTop`/`findFirst` return a single result. There
    is no `Limit`/`Max` keyword in derived method names.
  ref: concepts.md#derived-query-methods
- id: spring-data-jpa-repositories-037
  difficulty: advanced
  tags:
  - derived-query
  - limits
  - judgment
  question: |
    Which requirement CANNOT be expressed by a derived query method name and forces you to
    use @Query, Specifications, or QueryDSL?
  options:
  - A simple equality on one property
  - Ordering by a field ascending
  - A subquery / GROUP BY / JOIN FETCH with conditions on both sides
  - Limiting to the first N results
  answer: 2
  explanation: |
    Derived names handle equality, ordering, and result-limiting, but cannot express
    subqueries, `GROUP BY`, arbitrary joins with conditions on both sides, or `JOIN FETCH`.
    Those need `@Query`, Specifications, or QueryDSL.
  ref: concepts.md#derived-query-methods
- id: spring-data-jpa-repositories-038
  difficulty: intermediate
  tags:
  - get-reference
  - getone
  - deprecation
  question: |
    In current Spring Data JPA, which `JpaRepository` method returns a lazy reference proxy
    via `EntityManager.getReference`, replacing the deprecated `getOne`?
  options:
  - findById
  - getReferenceById
  - loadById
  - referenceOf
  answer: 1
  explanation: |
    `getReferenceById(id)` wraps `EntityManager.getReference`, returning a lazy proxy
    without hitting the DB until a non-id property is accessed (throwing
    `EntityNotFoundException` then if the row is missing). It replaced the deprecated
    `getOne`. `findById` returns an `Optional` and eagerly loads.
  ref: concepts.md#the-repository-interface-hierarchy
- id: spring-data-jpa-repositories-039
  difficulty: intermediate
  tags:
  - paging-sorting-repository
  - spring-data-3
  question: |
    In Spring Data 3.x (Spring Boot 3), what changed about
    `PagingAndSortingRepository`?
  options:
  - It was removed entirely
  - It now requires native queries
  - It merged into Repository
  - It no longer extends CrudRepository; it is a standalone add-on interface
  answer: 3
  explanation: |
    In Spring Data 3.x `PagingAndSortingRepository` no longer extends `CrudRepository` —
    it is a standalone interface providing only the paging/sorting `findAll` overloads.
    `JpaRepository` composes both `CrudRepository` and `PagingAndSortingRepository`.
  ref: concepts.md#the-repository-interface-hierarchy
- id: spring-data-jpa-repositories-040
  difficulty: advanced
  tags:
  - simple-jpa-repository
  - transactional
  - read-only
  question: |
    Why are plain repository read methods executed with a read-only transaction by default?
  options:
  - SimpleJpaRepository is annotated @Transactional(readOnly = true) at class level, with writes overriding
  - The database enforces it
  - Spring opens no transaction at all for reads
  - Because JpaRepository forbids writes
  answer: 0
  explanation: |
    The default implementation `SimpleJpaRepository` is annotated
    `@Transactional(readOnly = true)` at the class level; mutating methods like `save` and
    `delete` override with a read-write `@Transactional`. This is also why a bulk
    `@Modifying` method needs its own write transaction.
  ref: concepts.md#the-repository-interface-hierarchy
- id: spring-data-jpa-repositories-041
  difficulty: beginner
  tags:
  - derived-query
  - return-types
  question: |
    Which return type is appropriate for a derived `existsBy...` method?
  options:
  - boolean
  - Page<T>
  - List<T>
  - Optional<T>
  answer: 0
  explanation: |
    `existsBy...` maps to an existence check and returns `boolean`. `countBy...` returns
    `long`. `find...` methods return entities/optionals/collections/`Page`/`Slice`
    depending on the shape you declare.
  ref: concepts.md#derived-query-methods
- id: spring-data-jpa-repositories-042
  difficulty: advanced
  tags:
  - merge
  - persistence-context
  - mechanism
  question: |
    What exactly does `entityManager.merge(detached)` return?
  options:
  - The same detached instance, now managed
  - void
  - A managed copy of the entity (loaded/created in the context) — not the argument
  - A proxy that throws on access
  answer: 2
  explanation: |
    `merge` copies the detached state onto a managed instance (fetching or creating it in
    the persistence context) and returns *that* managed instance. The passed argument
    stays detached. This is why `save()` on detached entities must be used via its return
    value.
  ref: concepts.md#how-save-works-persist-vs-merge--isnew-detection
- id: spring-data-jpa-repositories-043
  difficulty: intermediate
  tags:
  - pagination
  - offset
  - deep-page
  question: |
    Why does `LIMIT`/`OFFSET` pagination degrade on deep pages, and where is that DB
    mechanism owned?
  options:
  - It does not degrade; OFFSET is O(1)
  - Because Spring re-runs the COUNT for every page
  - Because Hibernate caches every prior page in memory
  - The DB still scans and discards the skipped rows; keyset pagination is covered in messaging-databases
  answer: 3
  explanation: |
    With `OFFSET`, the database still reads and discards all skipped rows, so deep pages
    get progressively slower. Keyset/seek pagination avoids this. The DB-level mechanics
    live in `messaging-databases/pagination`; here we stay at the ORM/repository altitude.
  ref: concepts.md#pagination--sorting-page-vs-slice
- id: spring-data-jpa-repositories-044
  difficulty: advanced
  tags:
  - query
  - param
  - in-clause
  question: |
    How do you bind an `IN` clause parameter such as `WHERE a.id IN :ids` in a `@Query`?
  options:
  - Pass a comma-separated String
  - Pass a Collection (e.g. List<Long>) bound to :ids
  - Use one @Param per element
  - IN clauses are unsupported in @Query
  answer: 1
  explanation: |
    Bind a `Collection` (e.g. `List<Long> ids`) to the `IN` parameter; JPA expands it into
    the placeholder list. A comma-separated string would be treated as a single value, not
    a list.
  ref: concepts.md#named-parameters-positional-params--spel
- id: spring-data-jpa-repositories-045
  difficulty: advanced
  tags:
  - judgment
  - dto
  - read-endpoint
  - n-plus-one
  question: |
    For a read-only REST endpoint returning a flat list of a few fields, which approach
    best avoids both N+1 and LazyInitializationException while minimizing data loaded?
  options:
  - Return managed entities and rely on OSIV
  - Return a DTO/closed projection via a query that selects only the needed columns
  - Set every association to EAGER
  - Fetch-join all collections with a Pageable
  answer: 1
  explanation: |
    A DTO or closed interface projection selects only the needed columns, returns detached
    objects (no lazy proxies, so no `LazyInitializationException`), and issues a single
    query (no N+1). Relying on OSIV or global EAGER reintroduces hidden N+1; collection
    fetch-join with paging causes in-memory pagination.
  ref: concepts.md#projections-interface-dto--dynamic
- id: spring-data-jpa-repositories-046
  difficulty: intermediate
  tags:
  - delete-in-batch
  - mechanism
  question: |
    How does `JpaRepository.deleteAllInBatch()` differ from `CrudRepository.deleteAll()`?
  options:
  - deleteAllInBatch issues a single bulk DELETE without loading entities; deleteAll loads and removes
    them one by one
  - They are identical
  - deleteAllInBatch is asynchronous
  - deleteAll uses native SQL while deleteAllInBatch uses JPQL SELECT
  answer: 0
  explanation: |
    `deleteAllInBatch()` runs a single bulk `DELETE` statement, bypassing the persistence
    context (no per-entity load, no cascade/callbacks). `deleteAll()` loads each entity and
    calls `remove`, honoring cascades and lifecycle callbacks but at higher cost.
  ref: concepts.md#the-repository-interface-hierarchy
- id: spring-data-jpa-repositories-047
  difficulty: expert
  tags:
  - scroll-api
  - keyset
  - window
  - pagination
  question: |
    An interviewer asks how to paginate a 50-million-row table in Spring Data JPA without
    the deep-`OFFSET` slowdown and without dropping to raw SQL. Which modern feature answers
    this directly?
  options:
  - Return Page<T> with a large page size so fewer COUNT queries run
  - Return Slice<T> with a very small page size
  - Wrap findAll in a @Transactional(readOnly=true) loop
  - Return a Window<T> using ScrollPosition.keyset() (Scroll API, Spring Data 3.1+)
  answer: 3
  explanation: |
    The Scroll API (Spring Data 3.1+) returns `Window<T>` and, with
    `ScrollPosition.keyset()`, rewrites the query into a seek predicate
    (`WHERE id > ? ORDER BY id LIMIT n+1`). It uses the index directly — no OFFSET scan and
    no COUNT — so any page is equally cheap. `Page`/`Slice` still use LIMIT/OFFSET.
  ref: concepts.md#scroll-api-window-and-keyset-pagination
- id: spring-data-jpa-repositories-048
  difficulty: advanced
  tags:
  - scroll-api
  - offset
  - keyset
  question: |
    What is the practical difference between `ScrollPosition.offset()` and
    `ScrollPosition.keyset()` in the Scroll API?
  options:
  - offset() emits LIMIT/OFFSET (deep pages still scan skipped rows); keyset() emits a seek predicate on the sort keys
  - offset() is for ascending sorts, keyset() for descending
  - keyset() runs a COUNT query while offset() does not
  - They are aliases; the runtime picks one automatically
  answer: 0
  explanation: |
    `offset()` scrolling still generates `LIMIT ... OFFSET ...`, so it does not fix deep-page
    degradation (it behaves like a `Slice`). `keyset()` scrolling emits a seek predicate
    (`WHERE (keys) > (?)`) against the sort columns, using the index and avoiding both the
    skipped-row scan and any COUNT.
  ref: concepts.md#scroll-api-window-and-keyset-pagination
- id: spring-data-jpa-repositories-049
  difficulty: advanced
  tags:
  - scroll-api
  - window
  - iteration
  question: |
    Given a `Window<User> window` from a keyset scroll, how do you obtain the position to
    fetch the next window, and how does the window know there is more data?
  options:
  - Call window.nextPageable(); it runs a COUNT to know the total
  - Call window.positionAt(window.size() - 1) for the next ScrollPosition; hasNext() uses a size+1 probe
  - Increment the page number manually; hasNext() reads table statistics
  - There is no next-position API; you must re-run with a larger limit
  answer: 1
  explanation: |
    `window.positionAt(index)` (or `positionAt(entity)`) yields the `ScrollPosition` to resume
    from — the keyset of that row. Like a `Slice`, the window fetches `size + 1` rows and
    `hasNext()` is true if the extra row came back. No COUNT is involved.
  ref: concepts.md#scroll-api-window-and-keyset-pagination
- id: spring-data-jpa-repositories-050
  difficulty: expert
  tags:
  - query-by-example
  - qbe
  - limitations
  question: |
    A teammate wants to build a filter with `age > 30` using Query By Example (QBE). Why
    won't it work, and what should they use instead?
  options:
  - QBE needs a native query; add nativeQuery=true
  - QBE only supports equality and string LIKE matching — no ranges/inequalities; use Specifications or QueryDSL
  - QBE requires the probe to be a managed entity; detach it first
  - QBE works only on numeric primary keys, not on age
  answer: 1
  explanation: |
    QBE derives predicates from a probe's non-null fields using only `=` and (for strings)
    `LIKE`. It has no `<`, `>`, `BETWEEN`, `IN`, or nested OR. A range like `age > 30` cannot
    be expressed — switch to Specifications or QueryDSL, which support operators.
  ref: concepts.md#query-by-example-qbe
- id: spring-data-jpa-repositories-051
  difficulty: advanced
  tags:
  - query-by-example
  - qbe
  - primitive
  - gotcha
  question: |
    You build a QBE probe for a `User` whose `boolean active` field defaults to `false` and
    you never set it. Unexpectedly, every result has `active = false`. Why?
  options:
  - QBE ignores boolean fields entirely
  - A primitive boolean cannot be null, so it always contributes `active = false` unless the path is ignored
  - QBE inverts unset booleans to false as a default filter
  - The matcher defaulted to matchingAny(), flipping the value
  answer: 1
  explanation: |
    QBE ignores `null` fields, but a primitive `boolean` can never be null — its default
    `false` is a real value, so it becomes an `active = false` predicate. Exclude it with
    `ExampleMatcher.matching().withIgnorePaths("active")`, or use a boxed `Boolean`.
  ref: concepts.md#query-by-example-qbe
- id: spring-data-jpa-repositories-052
  difficulty: intermediate
  tags:
  - query-by-example
  - qbe
  - matcher
  question: |
    In QBE, what does `ExampleMatcher.matchingAny()` change versus the default
    `matchingAll()`?
  options:
  - It combines the probe's field predicates with OR instead of AND
  - It makes all string matches case-insensitive
  - It ignores null fields (the default already does the opposite)
  - It switches the query to a native SQL query
  answer: 0
  explanation: |
    `matchingAll()` (the default) ANDs the probe's non-null field predicates; `matchingAny()`
    ORs them. Case handling (`withIgnoreCase`) and string matching mode (`withStringMatcher`)
    are configured separately.
  ref: concepts.md#query-by-example-qbe
- id: spring-data-jpa-repositories-053
  difficulty: advanced
  tags:
  - native-query
  - sql-result-set-mapping
  - constructor-result
  question: |
    You need a native SQL join mapped into a DTO with a constructor. Which JPA construct maps
    the result set columns to the DTO constructor arguments?
  options:
  - '@SqlResultSetMapping with @ConstructorResult (columns matched by position)'
  - '@EntityGraph on the DTO'
  - '@Embeddable on the DTO'
  - A closed interface projection is the only option for native queries
  answer: 0
  explanation: |
    `@SqlResultSetMapping` with `@ConstructorResult` (listing `@ColumnResult`s) maps a native
    result set into a DTO by invoking its constructor; the `@ColumnResult` order must match
    the constructor parameter order. A `@NamedNativeQuery` references the mapping by name.
  ref: concepts.md#native-query-result-mapping
- id: spring-data-jpa-repositories-054
  difficulty: expert
  tags:
  - native-query
  - interface-projection
  - alias
  - gotcha
  question: |
    An interface projection over a native query has `Long getBookCount()`, and the SQL is
    `SELECT ..., count(b.id) FROM ...`. The value comes back null. What is the fix?
  options:
  - Add nativeQuery=false to force JPQL
  - 'Alias the column to match the getter: count(b.id) AS bookCount'
  - Rename the getter to getCount()
  - Interface projections cannot use aggregate functions; use a DTO
  answer: 1
  explanation: |
    Spring binds native result-set columns to interface getters by matching the column
    **alias** to the getter name. An unaliased/snake_case column (`book_count`) won't bind to
    `getBookCount()`. Alias every column to match the getter (`AS bookCount`) so the
    projection populates correctly.
  ref: concepts.md#native-query-result-mapping
- id: spring-data-jpa-repositories-055
  difficulty: advanced
  tags:
  - get-reference
  - find-by-id
  - lazy-proxy
  question: |
    What SQL does `repo.getReferenceById(42L)` execute at the moment it is called (row 42
    exists)?
  options:
  - A SELECT loading all columns immediately, like findById
  - None — it returns an uninitialized proxy; the SELECT fires only when a non-id property is accessed
  - A SELECT of just the id column to verify existence
  - A SELECT ... FOR UPDATE to lock the row
  answer: 1
  explanation: |
    `getReferenceById` wraps `EntityManager.getReference` and returns a lazy proxy with **no**
    SQL. The `SELECT` is deferred until the first non-id property is touched. `findById`, by
    contrast, loads the full row immediately and returns an `Optional`.
  ref: concepts.md#getreferencebyid-lazy-proxy-semantics
- id: spring-data-jpa-repositories-056
  difficulty: expert
  tags:
  - get-reference
  - foreign-key
  - insert
  - optimization
  question: |
    You are inserting a `Book` and only need to set its `@ManyToOne Author` FK by id. Which
    approach avoids an extra SELECT on the author table?
  options:
  - findById(authorId).get() then setAuthor(...)
  - book.setAuthor(repo.getReferenceById(authorId)) then save
  - Load the author with an @EntityGraph then attach it
  - Use a native INSERT bypassing JPA entirely
  answer: 1
  explanation: |
    `getReferenceById` returns an uninitialized proxy holding only the id. Assigning it as the
    FK lets Hibernate write `author_id` on the `INSERT` without ever loading the parent row —
    `findById` would fire a needless `SELECT`. This is the idiomatic FK-setting optimization.
  ref: concepts.md#getreferencebyid-lazy-proxy-semantics
- id: spring-data-jpa-repositories-057
  difficulty: expert
  tags:
  - get-reference
  - entity-not-found
  - osiv
  - gotcha
  question: |
    You call `getReferenceById(999L)` where row 999 does not exist, then return the proxy from
    a controller so Jackson serializes it. When and where does the failure surface?
  options:
  - Immediately at getReferenceById, as EmptyResultDataAccessException
  - At transaction commit, as OptimisticLockException
  - Lazily during serialization when a property is read, as EntityNotFoundException (often outside the tx under OSIV)
  - Never — Jackson serializes an empty object
  answer: 2
  explanation: |
    The proxy is created without checking existence. `EntityNotFoundException` is thrown
    lazily on the first non-id property access — here during Jackson serialization, which
    (under OSIV) runs after the transaction, producing a confusing stack trace far from the
    call site.
  ref: concepts.md#getreferencebyid-lazy-proxy-semantics
- id: spring-data-jpa-repositories-058
  difficulty: advanced
  tags:
  - delete
  - delete-in-batch
  - cascade
  - gotcha
  question: |
    A cleanup job calls `repo.deleteAll(fiveThousandEntities)` and the logs show 5,000
    individual DELETE statements plus SELECTs. Why, and how do you make it a single statement?
  options:
  - deleteAll is buggy; upgrade Spring Data
  - deleteAll loads then removes each entity (per-entity DELETE, cascades/@PreRemove fire); use deleteAllInBatch for one bulk DELETE
  - The DELETEs are batched by default; enable batch_size to reduce them
  - Wrap it in @Modifying to collapse into one statement
  answer: 1
  explanation: |
    `deleteAll(entities)` removes each entity through the persistence context — one DELETE per
    row, honoring `@OneToMany(cascade=REMOVE)` and `@PreRemove`. `deleteAllInBatch()` /
    `deleteAllByIdInBatch(ids)` issue a single `DELETE ... WHERE id IN (...)`, bypassing
    cascade and callbacks.
  ref: concepts.md#derived-deletes-vs-batch-deletes
- id: spring-data-jpa-repositories-059
  difficulty: expert
  tags:
  - derived-delete
  - modifying
  - mechanism
  - subtle-distinction
  question: |
    What is the behavioral difference between a derived `deleteByStatus("OLD")` and
    `@Modifying @Query("DELETE FROM Item i WHERE i.status = 'OLD'")`?
  options:
  - They are identical; both issue one bulk DELETE
  - Derived deleteBy SELECTs matching rows then deletes each (cascade/callbacks fire); the @Modifying query is one bulk DELETE bypassing them
  - The @Modifying query loads entities; the derived delete does not
  - Derived deleteBy requires @Transactional; the @Modifying one does not
  answer: 1
  explanation: |
    Derived `deleteBy...` first runs a `SELECT` to load matching entities, then deletes each
    via the persistence context — so cascades, `@PreRemove`, and `@Version` apply. The
    `@Modifying @Query DELETE` is a single bulk statement that bypasses the context, cascades,
    and callbacks. They are different mechanisms.
  ref: concepts.md#derived-deletes-vs-batch-deletes
- id: spring-data-jpa-repositories-060
  difficulty: intermediate
  tags:
  - delete-by-id
  - no-op
  question: |
    What happens when you call `repo.deleteById(id)` for an id that does not exist in current
    Spring Data JPA?
  options:
  - It is a no-op (internally findById().ifPresent), no exception
  - It always throws EmptyResultDataAccessException
  - It inserts a tombstone row
  - It throws EntityNotFoundException
  answer: 0
  explanation: |
    `deleteById` internally loads via `findById` and only removes if present, so a missing id
    is a silent no-op. (The older `delete(entity)` path could raise
    `EmptyResultDataAccessException` when the row is already gone.)
  ref: concepts.md#derived-deletes-vs-batch-deletes
- id: spring-data-jpa-repositories-061
  difficulty: advanced
  tags:
  - batching
  - save-all
  - performance
  question: |
    You call `repo.saveAll(tenThousandEntities)` and see 10,000 separate INSERT round-trips.
    What is the most likely cause?
  options:
  - saveAll never batches; you must call save() in a loop
  - JDBC batching is off by default; hibernate.jdbc.batch_size is unset
  - The entities are detached, forcing merge
  - The transaction isolation level is too high
  answer: 1
  explanation: |
    Hibernate does not batch JDBC statements unless `hibernate.jdbc.batch_size` is set.
    Without it, `saveAll` issues one INSERT per entity. Set `batch_size` (and
    `order_inserts`) to group them into `executeBatch()` calls.
  ref: concepts.md#jdbc-batching-for-saveall-and-bulk-inserts
- id: spring-data-jpa-repositories-062
  difficulty: expert
  tags:
  - batching
  - identity
  - sequence
  - id-generation
  question: |
    Even after setting `hibernate.jdbc.batch_size=50`, batch INSERTs still don't happen for a
    given entity. Its id uses `GenerationType.IDENTITY`. Why, and what is the fix?
  options:
  - IDENTITY requires a separate connection; switch pools
  - IDENTITY forces Hibernate to execute each INSERT immediately to read back the generated key, disabling insert batching; use SEQUENCE
  - batch_size only affects UPDATEs, never INSERTs
  - You must also set order_updates=true for INSERT batching
  answer: 1
  explanation: |
    With `IDENTITY`, the DB assigns the key during the INSERT, so Hibernate must run each
    INSERT immediately to retrieve it — it cannot buffer a batch. Switch to `SEQUENCE` (ideally
    with a `pooled` optimizer) to enable true batch inserts.
  ref: concepts.md#jdbc-batching-for-saveall-and-bulk-inserts
- id: spring-data-jpa-repositories-063
  difficulty: expert
  tags:
  - save-all
  - assigned-id
  - merge
  - batching
  - gotcha
  question: |
    `saveAll(newEntities)` where each entity has an application-assigned UUID id fires a SELECT
    before every INSERT. Why, and how do you fix it?
  options:
  - Assigned ids require refresh(); call it once
  - Default isNew sees a non-null id, so save takes the merge path (SELECT-then-INSERT); implement Persistable or add a @Version field
  - UUIDs are not indexed; add an index
  - saveAll always SELECTs first; use save() in a loop instead
  answer: 1
  explanation: |
    With an assigned non-null id, default `isNew` decides the entity is not new, so `save`
    calls `merge`, which SELECTs the (nonexistent) row before inserting — N SELECTs + N
    INSERTs, and merge also breaks insert batching. Implement `Persistable<ID>` (or use an
    object `@Version`) so `isNew` returns true and `persist` is used.
  ref: concepts.md#jdbc-batching-for-saveall-and-bulk-inserts
- id: spring-data-jpa-repositories-064
  difficulty: expert
  tags:
  - transactional
  - read-only
  - flush-mode
  question: |
    At the Hibernate level, what is the primary effect of `@Transactional(readOnly = true)` on
    a method that loads and (accidentally) mutates a managed entity?
  options:
  - It throws an exception the moment the entity is mutated
  - Flush mode becomes MANUAL/NEVER, so no dirty-check flush runs at commit and the UPDATE is never issued
  - It commits the UPDATE but rolls back at the end
  - It has no effect; readOnly is pure documentation
  answer: 1
  explanation: |
    `readOnly = true` sets the Hibernate flush mode to MANUAL/NEVER, so the automatic
    dirty-check flush at commit is skipped and no `UPDATE` is generated — a perf win and a
    guard against accidental writes. It is not merely advisory.
  ref: concepts.md#transactionalreadonly--true-at-the-orm-layer
- id: spring-data-jpa-repositories-065
  difficulty: advanced
  tags:
  - transactional
  - read-only
  - snapshot
  - memory
  question: |
    Besides changing flush behavior, how does `readOnly = true` reduce memory/CPU when loading
    a large read result set?
  options:
  - It streams rows instead of buffering them
  - Entities load read-only (Session.setDefaultReadOnly), so Hibernate skips the dehydrated dirty-checking snapshot
  - It enables the second-level cache automatically
  - It compresses entities in the persistence context
  answer: 1
  explanation: |
    `readOnly = true` propagates `Session.setDefaultReadOnly(true)`, so loaded entities are
    read-only and Hibernate skips taking the snapshot it would otherwise keep for dirty
    checking — saving memory and CPU on large read result sets.
  ref: concepts.md#transactionalreadonly--true-at-the-orm-layer
- id: spring-data-jpa-repositories-066
  difficulty: advanced
  tags:
  - return-type
  - single-result
  - exception
  question: |
    A derived method `Optional<User> findByEmail(String email)` matches two rows because the
    data isn't actually unique. What happens?
  options:
  - It returns the first row silently
  - It returns Optional.empty()
  - Spring throws IncorrectResultSizeDataAccessException (translating NonUniqueResultException)
  - It returns Optional of a merged entity
  answer: 2
  explanation: |
    A single-result query that matches more than one row throws Hibernate's
    `NonUniqueResultException`, which Spring translates to
    `IncorrectResultSizeDataAccessException`. Fix with a unique predicate,
    `findFirstBy`/`findTopBy`, or a `List` return type.
  ref: concepts.md#single-result-return-contract
- id: spring-data-jpa-repositories-067
  difficulty: expert
  tags:
  - page
  - join-fetch
  - count-query
  - gotcha
  question: |
    A `@Query` with `JOIN FETCH a.books` returns `Page<Author>` and Hibernate throws
    `QueryException: query specified join fetching, but the owner ... was not present`. What is
    the fix?
  options:
  - Remove JOIN FETCH; you cannot fetch and paginate at all
  - Supply an explicit countQuery that uses a plain JOIN (or no join) instead of JOIN FETCH
  - Switch the return type to Slice
  - Add clearAutomatically=true
  answer: 1
  explanation: |
    Spring auto-derives the count query by rewriting the select, keeping the `join fetch`,
    which Hibernate rejects in a count. Provide an explicit `countQuery` without the fetch
    join (e.g. `SELECT count(a) FROM Author a WHERE ...`). This is distinct from the
    collection-fetch + Pageable in-memory pagination (HHH000104) issue.
  ref: concepts.md#count-queries-and-the-page--join-fetch-footgun
- id: spring-data-jpa-repositories-068
  difficulty: expert
  tags:
  - page
  - count
  - optimization
  question: |
    Does a repository method returning `Page<T>` always execute a separate COUNT query?
  options:
  - Yes, always, on every page
  - No — Spring skips COUNT when it can infer the total, e.g. the first page returns fewer rows than the page size
  - No — COUNT only runs for native queries
  - Yes, but only when Sort is present
  answer: 1
  explanation: |
    Spring optimizes the COUNT away when the total is inferable from the returned window —
    for example, on the first page when the content size is less than the page size (total =
    offset + content size), or when a page comes back empty. So `Page` does not always fire
    COUNT.
  ref: concepts.md#count-queries-and-the-page--join-fetch-footgun
- id: spring-data-jpa-repositories-069
  difficulty: advanced
  tags:
  - sort
  - jpa-sort
  - expression
  question: |
    You need to sort a `Pageable` query by `LENGTH(name)`. `Sort.by("LENGTH(name)")` throws.
    What works?
  options:
  - JpaSort.unsafe("LENGTH(name)")
  - Sort.by("name").ascending() only
  - Passing the expression as a @Param
  - Sorting is impossible on functions; sort in Java
  answer: 0
  explanation: |
    Plain `Sort` validates against entity properties and rejects expressions as an
    injection-safety measure. `JpaSort.unsafe("LENGTH(name)")` bypasses that check so the
    expression is used in `ORDER BY`. Never build the unsafe fragment from untrusted input.
  ref: concepts.md#sort-safety-and-sorting-by-expressions
- id: spring-data-jpa-repositories-070
  difficulty: intermediate
  tags:
  - sort
  - property-reference
  - startup
  question: |
    A `Sort.by("emailAddres")` (typo) is passed to a repository query. What happens?
  options:
  - It is silently ignored
  - A PropertyReferenceException is thrown because the property can't be resolved on the entity
  - The results come back unsorted with a warning
  - It sorts by the id instead
  answer: 1
  explanation: |
    `Sort` paths are validated against the entity metamodel; an unresolvable property throws
    `PropertyReferenceException` when the query is built. This catches typos rather than
    silently ignoring them.
  ref: concepts.md#sort-safety-and-sorting-by-expressions
- id: spring-data-jpa-repositories-071
  difficulty: advanced
  tags:
  - lock
  - pessimistic
  - select-for-update
  question: |
    How do you make a repository `findById` acquire a `SELECT ... FOR UPDATE` row lock?
  options:
  - Annotate the method with @Lock(LockModeType.PESSIMISTIC_WRITE)
  - Set @Transactional(readOnly=false) only
  - Add @Modifying to findById
  - Use @QueryHints(@QueryHint(name="lock", value="true"))
  answer: 0
  explanation: |
    `@Lock(LockModeType.PESSIMISTIC_WRITE)` on the repository method makes Hibernate emit
    `SELECT ... FOR UPDATE`. `PESSIMISTIC_READ` takes a shared lock; the optimistic modes use
    the `@Version` column. A companion `jakarta.persistence.lock.timeout` hint controls
    NOWAIT/skip-locked behavior.
  ref: concepts.md#locking-and-query-hints
- id: spring-data-jpa-repositories-072
  difficulty: advanced
  tags:
  - query-hints
  - jakarta
  - timeout
  question: |
    Which is the correct hint name to set a per-query timeout on a Jakarta Persistence 3.x
    repository method via `@QueryHints`?
  options:
  - javax.persistence.query.timeout
  - jakarta.persistence.query.timeout
  - org.hibernate.query.maxTime
  - spring.jpa.query.timeout
  answer: 1
  explanation: |
    On Jakarta Persistence 3.x the namespace is `jakarta.persistence.*`, so the query-timeout
    hint is `jakarta.persistence.query.timeout` (milliseconds). The legacy `javax.*` keys are
    from the old namespace and no longer apply.
  ref: concepts.md#locking-and-query-hints
- id: spring-data-jpa-repositories-073
  difficulty: expert
  tags:
  - stream
  - resource-leak
  - transaction
  question: |
    A repository method returns `Stream<Author>`. What two conditions must hold to consume it
    safely?
  options:
  - It must be called outside any transaction and cached
  - It must run within an open transaction AND be closed (try-with-resources), or it leaks the ResultSet/connection
  - It must return fewer than 1000 rows
  - It must be annotated @Modifying
  answer: 1
  explanation: |
    A `Stream` holds an open cursor (ResultSet + connection), so it must be consumed inside an
    open transaction/`EntityManager` and closed via try-with-resources or `.close()`.
    Forgetting to close it leaks the connection.
  ref: concepts.md#streaming-large-result-sets
- id: spring-data-jpa-repositories-074
  difficulty: expert
  tags:
  - stream
  - fetch-size
  - mysql
  question: |
    Your `Stream<T>` repository query still loads the entire result into memory before
    processing. What is typically missing (and what is the MySQL-specific quirk)?
  options:
  - A @Modifying annotation
  - A fetch-size hint (org.hibernate.fetchSize) with a forward-only cursor; MySQL streams only with fetchSize = Integer.MIN_VALUE
  - A larger heap; streaming always buffers first
  - A @Transactional(readOnly=false)
  answer: 1
  explanation: |
    Without a fetch-size hint the driver may buffer the whole result. Set
    `org.hibernate.fetchSize` (forward-only cursor) so rows are streamed. MySQL's driver is a
    special case: it streams row-by-row only when the fetch size is `Integer.MIN_VALUE`.
  ref: concepts.md#streaming-large-result-sets
- id: spring-data-jpa-repositories-075
  difficulty: advanced
  tags:
  - no-repository-bean
  - base-interface
  question: |
    Why do you annotate a shared intermediate repository interface (e.g.
    `BaseRepository<T,ID> extends JpaRepository<T,ID>`) with `@NoRepositoryBean`?
  options:
  - To make it read-only
  - So Spring does NOT create a proxy/bean for the generic base interface itself (it has no concrete domain type)
  - To enable second-level caching for all subtypes
  - To force all subtypes to use native queries
  answer: 1
  explanation: |
    `@NoRepositoryBean` tells Spring Data not to instantiate a repository proxy for that
    intermediate interface — it has no concrete entity type. Concrete repositories extend it
    and inherit its methods, while only they become beans.
  ref: concepts.md#customizing-all-repositories-base-class-and-norepositorybean
- id: spring-data-jpa-repositories-076
  difficulty: expert
  tags:
  - repository-base-class
  - customization
  - enable-jpa-repositories
  question: |
    You want `findByIdOrThrow` available on EVERY repository without adding a fragment to each
    one. What is the idiomatic mechanism?
  options:
  - Add a default method to JpaRepository via a bytecode agent
  - Subclass SimpleJpaRepository and register it with @EnableJpaRepositories(repositoryBaseClass=...)
  - Put the method in a @NoRepositoryBean interface and instantiate it directly
  - Use an aspect around every repository call
  answer: 1
  explanation: |
    Extend `SimpleJpaRepository` in a custom base class implementing the new method, then set
    `@EnableJpaRepositories(repositoryBaseClass = CustomBaseRepositoryImpl.class)`. Spring uses
    it as the base implementation for all repositories, so the method is available everywhere.
  ref: concepts.md#customizing-all-repositories-base-class-and-norepositorybean
- id: spring-data-jpa-repositories-077
  difficulty: advanced
  tags:
  - exists-by-id
  - find-by-id
  - efficiency
  question: |
    You only need to know whether a row exists before proceeding. Why prefer `existsById(id)`
    (or a derived `existsBy...`) over `findById(id).isPresent()`?
  options:
  - findById caches results; existsById does not
  - existsById issues a lightweight existence/count query, while findById hydrates the full entity into the context
  - They compile to identical SQL, so it is purely stylistic
  - existsById bypasses the transaction, making it faster
  answer: 1
  explanation: |
    `existsById`/`existsBy` run a cheap existence check (e.g. `SELECT 1`/count) and return a
    boolean, whereas `findById(...).isPresent()` selects and hydrates the whole entity into
    the persistence context just to throw it away. Prefer the existence query when you only
    need a yes/no.
  ref: concepts.md#single-result-return-contract
