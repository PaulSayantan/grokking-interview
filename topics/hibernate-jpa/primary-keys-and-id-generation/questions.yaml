topic: "Primary Keys & ID Generation Strategies"
domain: hibernate-jpa
topic_slug: primary-keys-and-id-generation
version: 1
questions:
  - id: primary-keys-and-id-generation-001
    difficulty: beginner
    tags: [generated-value, annotations, basics]
    question: |
      Which annotation tells the JPA provider to populate an entity's identifier
      automatically instead of you assigning it before persist()?
    options:
      - "@GeneratedValue"
      - "@Id"
      - "@Column(insertable = false)"
      - "@SequenceGenerator"
    answer: 0
    explanation: |
      @Id marks the field as the identifier; @GeneratedValue additionally instructs the
      provider to generate the value (via IDENTITY, SEQUENCE, TABLE, AUTO, or UUID). Without
      @GeneratedValue the id is "assigned" and you must set it yourself before persist().
    ref: "concepts.md#generatedvalue-strategies-overview"

  - id: primary-keys-and-id-generation-002
    difficulty: intermediate
    tags: [identity, batching, mechanism]
    question: |
      Why does GenerationType.IDENTITY prevent Hibernate from using JDBC batch inserts?
    options:
      - "Identity columns cannot be indexed, so batching is pointless"
      - "The id is only known after the INSERT executes, so each insert must run immediately to read the generated key"
      - "Hibernate disables batching for all auto-generated ids as a safety measure"
      - "Identity columns require a separate transaction per row"
    answer: 1
    explanation: |
      To batch, Hibernate buffers pending INSERTs and flushes them together, but it can only
      manage an entity once it has an id (the id keys the persistence context). With IDENTITY
      the value doesn't exist until the INSERT runs and returns getGeneratedKeys(), so
      Hibernate must fire each INSERT immediately on persist(). There is nothing to buffer.
    ref: "concepts.md#why-identity-disables-jdbc-batch-inserts"

  - id: primary-keys-and-id-generation-003
    difficulty: intermediate
    tags: [sequence, default, preferred]
    question: |
      For most databases that support it, which generation strategy is generally
      preferred because it supports both JDBC batching and pooled id allocation?
    options:
      - "GenerationType.TABLE"
      - "GenerationType.IDENTITY"
      - "GenerationType.SEQUENCE"
      - "Application-assigned ids only"
    answer: 2
    explanation: |
      SEQUENCE queries the id up front (before the INSERT), so Hibernate can buffer inserts
      for batching AND use pooled/hi-lo optimizers to amortize the nextval round-trip.
      It is the default preferred choice on Postgres, Oracle, H2, DB2, and SQL Server.
    ref: "concepts.md#sequence-strategy"

  - id: primary-keys-and-id-generation-004
    difficulty: beginner
    tags: [allocation-size, defaults]
    question: |
      What is the default value of allocationSize on @SequenceGenerator in JPA/Hibernate?
    options:
      - "1"
      - "10"
      - "100"
      - "50"
    answer: 3
    explanation: |
      allocationSize defaults to 50. It is the block of ids the pooled optimizer reserves per
      nextval call, amortizing the round-trip across up to 50 inserts.
    ref: "concepts.md#allocationsize-and-the-pooled-optimizers"

  - id: primary-keys-and-id-generation-005
    difficulty: intermediate
    tags: [table-strategy, contention, mechanism]
    question: |
      Why is GenerationType.TABLE considered slow and a contention hotspot?
    options:
      - "It stores ids as strings, requiring conversion on every insert"
      - "It must run SELECT ... FOR UPDATE and UPDATE on a generator row, serializing id allocation across transactions"
      - "It creates one table per entity instance"
      - "It cannot be batched, like IDENTITY"
    answer: 1
    explanation: |
      TABLE emulates a sequence with a row in a table. To allocate a block it takes a
      row-level lock via SELECT ... FOR UPDATE, then UPDATEs the value. That lock serializes
      id allocation across all transactions inserting that entity. A large allocationSize
      mitigates but doesn't eliminate the contention.
    ref: "concepts.md#table-strategy"

  - id: primary-keys-and-id-generation-006
    difficulty: advanced
    tags: [hilo, pooled, optimizers, interoperability]
    question: |
      A second application inserts rows directly into the same table using its own logic.
      Which sequence optimizer is UNSAFE because it assumes it owns the entire id space?
    options:
      - "pooled"
      - "pooled-lo"
      - "hi-lo (legacy)"
      - "none — all optimizers are interoperable"
    answer: 2
    explanation: |
      The legacy hi-lo optimizer computes ids as hi * allocationSize + lo and assumes it owns
      the whole id space, so external writers collide with it. pooled and pooled-lo persist the
      real boundary value in the sequence itself, keeping external writers consistent.
    ref: "concepts.md#allocationsize-and-the-pooled-optimizers"

  - id: primary-keys-and-id-generation-007
    difficulty: intermediate
    tags: [uuid, jpa-3-1, spec]
    question: |
      Jakarta Persistence 3.1 standardized UUID identifier generation. How do you request it
      declaratively via the spec?
    options:
      - "@Id(type = UUID.class)"
      - "@GeneratedValue(strategy = GenerationType.RANDOM)"
      - "@UuidColumn on the id field"
      - "@GeneratedValue(strategy = GenerationType.UUID)"
    answer: 3
    explanation: |
      JPA 3.1 added GenerationType.UUID to the standard GenerationType enum, letting you write
      @GeneratedValue(strategy = GenerationType.UUID) on a UUID or String id. Hibernate also
      offers the richer @UuidGenerator annotation with style options.
    ref: "concepts.md#uuid-generation"

  - id: primary-keys-and-id-generation-008
    difficulty: advanced
    tags: [uuid, uuidv7, index-locality, key-design]
    question: |
      Why does a random UUIDv4 primary key hurt insert performance compared to a
      time-ordered UUIDv7?
    options:
      - "UUIDv4 inserts land at random positions in the primary-key B-tree, causing page splits and fragmentation, while v7's timestamp prefix keeps inserts monotonic"
      - "UUIDv4 values are larger than UUIDv7 values"
      - "UUIDv4 requires a database round-trip to generate while v7 does not"
      - "UUIDv4 cannot be stored as binary(16)"
    answer: 0
    explanation: |
      Both are 16 bytes and both are generated client-side. The difference is locality: v4 is
      fully random so new rows scatter across the index (page splits, write amplification,
      buffer-pool churn), whereas v7 embeds a millisecond timestamp prefix so rows append at
      the right edge like an auto-increment. The B-tree mechanics are owned by
      messaging-databases/indexing-b-tree-lsm.
    ref: "concepts.md#uuid-generation"

  - id: primary-keys-and-id-generation-009
    difficulty: advanced
    tags: [equals-hashcode, generated-id, collections]
    question: |
      You add a new entity to a HashSet, then persist it. Afterwards set.contains(entity)
      returns false. What is the most likely cause?
    options:
      - "persist() replaces the object with a proxy"
      - "HashSet does not support entities"
      - "The entity's hashCode is derived from its id, which was null when added and became non-null after persist(), changing its bucket"
      - "The transaction hasn't committed yet"
    answer: 2
    explanation: |
      This is the assigned-after-persist problem. If hashCode is based on the generated id,
      it changes when persist() assigns the id, so the object now hashes to a different bucket
      and contains() looks in the wrong place. Fix with a constant hashCode, an app-assigned
      UUID, or a stable business key.
    ref: "concepts.md#equals-and-hashcode-with-generated-ids"

  - id: primary-keys-and-id-generation-010
    difficulty: intermediate
    tags: [equals-hashcode, patterns, best-practice]
    question: |
      Using the recommended pattern for a JPA entity with a DB-generated numeric id, what
      should hashCode() return to stay stable across persist()?
    options:
      - "The id's hashCode"
      - "A hash of all business fields"
      - "System.identityHashCode(this)"
      - "A constant value (e.g. getClass().hashCode())"
    answer: 3
    explanation: |
      To keep hashCode stable before and after the id is assigned, return a constant such as
      getClass().hashCode(). equals() then compares the id only when it is non-null (and the
      classes match). This keeps the Set/Map contract intact through state transitions.
    ref: "concepts.md#equals-and-hashcode-with-generated-ids"

  - id: primary-keys-and-id-generation-011
    difficulty: intermediate
    tags: [surrogate, natural-keys, design]
    question: |
      What is the strongest argument against using a natural key (like an email) as an
      entity's primary key?
    options:
      - "\"Unique and immutable forever\" is a promise the business usually breaks, and the wide value then propagates into every foreign key"
      - "JPA forbids @Id on business fields"
      - "Natural keys cannot be indexed"
      - "Natural keys always require @GeneratedValue"
    answer: 0
    explanation: |
      Natural keys make poor primary keys because supposedly-stable business values change
      (emails, reformatted SSNs) and are often wide, so every child FK and join carries the
      cost. Prefer a narrow surrogate key and enforce the natural key with a separate unique
      constraint or @NaturalId.
    ref: "concepts.md#surrogate-vs-natural-keys"

  - id: primary-keys-and-id-generation-012
    difficulty: advanced
    tags: [auto, hibernate-6, dialect]
    question: |
      In Hibernate 6/7, what does GenerationType.AUTO resolve to for a numeric id?
    options:
      - "Always IDENTITY, regardless of dialect"
      - "A SequenceStyleGenerator — a real sequence if the dialect supports one, otherwise a table-backed sequence emulation"
      - "Always TABLE for portability"
      - "It throws unless a generator is named explicitly"
    answer: 1
    explanation: |
      In Hibernate 6/7, AUTO for a numeric id maps to SequenceStyleGenerator: a real sequence
      where supported, otherwise a table-backed emulation. For a UUID-typed id, AUTO resolves
      to UUID generation. This differs from older, more dialect-dependent behavior.
    ref: "concepts.md#auto-strategy"

  - id: primary-keys-and-id-generation-013
    difficulty: advanced
    tags: [auto, mysql, hibernate-6, migration]
    question: |
      A team migrates to Hibernate 6 and, using @GeneratedValue with no strategy on MySQL,
      is surprised to see a new <entity>_seq table appear. Why?
    options:
      - "MySQL 8 introduced native sequences that Hibernate now uses"
      - "Hibernate 6 requires a table for all ids"
      - "The migration corrupted the schema"
      - "AUTO prefers a sequence-style generator; since MySQL has no sequences, Hibernate creates a table-backed sequence instead of using AUTO_INCREMENT"
    answer: 3
    explanation: |
      AUTO in Hibernate 6 prefers a SequenceStyleGenerator. MySQL lacks sequence objects, so
      Hibernate emulates one with a table (<entity>_seq). If you specifically want
      AUTO_INCREMENT on MySQL, request GenerationType.IDENTITY explicitly rather than relying
      on AUTO.
    ref: "concepts.md#auto-strategy"

  - id: primary-keys-and-id-generation-014
    difficulty: intermediate
    tags: [identity, generated-keys, sql]
    question: |
      With GenerationType.IDENTITY, how does Hibernate learn the id value after inserting a row?
    options:
      - "It reads it back from the INSERT via JDBC Statement.getGeneratedKeys()"
      - "It queries the sequence with nextval before the insert"
      - "It computes it from a hi-lo optimizer in memory"
      - "It reruns a SELECT MAX(id) after each insert"
    answer: 0
    explanation: |
      IDENTITY relies on the database assigning the value during the INSERT. Hibernate then
      reads it back through JDBC getGeneratedKeys(). Because the value only exists after the
      INSERT, the insert cannot be deferred or batched.
    ref: "concepts.md#identity-strategy"

  - id: primary-keys-and-id-generation-015
    difficulty: expert
    tags: [batching, performance, scenario]
    question: |
      Bulk-inserting 100,000 rows through Hibernate is slow even with
      hibernate.jdbc.batch_size=50. The entity uses @GeneratedValue(strategy = IDENTITY).
      What is the single most effective fix?
    options:
      - "Increase batch_size to 500"
      - "Switch the id strategy to SEQUENCE with a pooled optimizer so inserts can be batched"
      - "Disable the first-level cache"
      - "Wrap each insert in its own transaction"
    answer: 1
    explanation: |
      IDENTITY silently disables JDBC batching no matter what batch_size is set to, because
      each insert must run immediately to obtain the id. Switching to SEQUENCE (with pooled
      allocation) lets Hibernate buffer and executeBatch, typically an order-of-magnitude
      speedup. Pair with order_inserts and periodic flush()+clear().
    ref: "concepts.md#why-identity-disables-jdbc-batch-inserts"

  - id: primary-keys-and-id-generation-016
    difficulty: intermediate
    tags: [allocation-size, gaps, trade-offs]
    question: |
      What is the main downside of setting a large allocationSize (e.g. 1000) on a sequence
      generator?
    options:
      - "It slows down every insert"
      - "It causes id collisions"
      - "It creates large gaps in the id sequence when a JVM restarts or a transaction rolls back, since unused blocks are discarded"
      - "It disables JDBC batching"
    answer: 2
    explanation: |
      A large allocationSize means fewer nextval round-trips but larger discarded id blocks on
      restart/rollback, producing bigger gaps. Gaps are cosmetic (ids need not be contiguous)
      but surprise people expecting 1,2,3. It does not cause collisions or disable batching.
    ref: "concepts.md#allocationsize-and-the-pooled-optimizers"

  - id: primary-keys-and-id-generation-017
    difficulty: advanced
    tags: [allocation-size, sequence, increment-by, gotcha]
    question: |
      When using the pooled optimizer, why must allocationSize match the database sequence's
      INCREMENT BY?
    options:
      - "If they disagree, the pooled optimizer can hand out ids that overlap with other allocations, causing collisions"
      - "It only affects readability of generated ids"
      - "INCREMENT BY controls the batch size for inserts"
      - "Otherwise Hibernate will not compile the mapping"
    answer: 0
    explanation: |
      The pooled optimizer reserves a block whose size it assumes equals allocationSize. If the
      real sequence increments by a different amount, the reserved ranges overlap and ids
      collide. Hibernate matches them when it generates DDL, but with a pre-existing sequence
      (Flyway/Liquibase) you must keep them in sync yourself.
    ref: "concepts.md#sequencegenerator-and-tablegenerator-configuration"

  - id: primary-keys-and-id-generation-018
    difficulty: beginner
    tags: [sequence-generator, config, annotations]
    question: |
      In @GeneratedValue(strategy = SEQUENCE, generator = "book_seq") together with
      @SequenceGenerator(name = "book_seq", ...), what must be true?
    options:
      - "sequenceName must equal the entity name"
      - "The generator element and the @SequenceGenerator name element must match"
      - "allocationSize must be 1"
      - "Both annotations must be on the class, not the field"
    answer: 1
    explanation: |
      @GeneratedValue's generator attribute references a named generator; the
      @SequenceGenerator's name attribute defines that logical name. They must match for the
      binding to resolve. sequenceName is the actual DB object name and is independent.
    ref: "concepts.md#sequencegenerator-and-tablegenerator-configuration"

  - id: primary-keys-and-id-generation-019
    difficulty: intermediate
    tags: [mysql, sequence, dialect]
    question: |
      You annotate an entity with GenerationType.SEQUENCE and deploy to MySQL 8. What
      actually happens?
    options:
      - "MySQL uses its native SEQUENCE object"
      - "It falls back to AUTO_INCREMENT transparently"
      - "Hibernate emulates the sequence with a table, since MySQL has no sequence objects"
      - "Startup fails because MySQL rejects the strategy"
    answer: 2
    explanation: |
      MySQL (even 8.x) has no SEQUENCE object. Hibernate emulates one using a table, so
      requesting SEQUENCE on MySQL is effectively the TABLE strategy. The real MySQL choice is
      between IDENTITY (AUTO_INCREMENT) and a table-backed sequence.
    ref: "concepts.md#sequence-strategy"

  - id: primary-keys-and-id-generation-020
    difficulty: advanced
    tags: [uuid-generator, style, versions, hibernate]
    question: |
      Which Hibernate @UuidGenerator style produces a time-based value rather than a random
      one, and which RFC 4122 version is that value?
    options:
      - "Style.RANDOM — an RFC 4122 v4 value"
      - "Style.TIME — an RFC 4122 version-1-style value (NOT v7, and not guaranteed monotonic)"
      - "Style.ORDERED — a monotonic UUIDv7"
      - "Style.SEQUENTIAL — a right-edge-ordered v7"
    answer: 1
    explanation: |
      @UuidGenerator ships exactly two styles: RANDOM (default, RFC 4122 v4) and TIME, an
      RFC 4122 version-1-style time value using Hibernate's own layout (IP instead of MAC).
      TIME is NOT UUIDv7 and does not guarantee monotonic right-edge index locality. There is
      no built-in ORDERED/SEQUENTIAL/v7 style — for true v7 supply a custom algorithm/library.
    ref: "concepts.md#uuid-generation"

  - id: primary-keys-and-id-generation-021
    difficulty: expert
    tags: [equals-hashcode, lombok, lazy, gotcha]
    question: |
      Why is putting Lombok @Data (which generates equals/hashCode from all fields) on a
      JPA entity dangerous?
    options:
      - "@Data is incompatible with @Entity and won't compile"
      - "Including all fields pulls lazy associations (risking LazyInitializationException or extra queries) and uses mutable fields that break the Set/Map contract"
      - "It makes the entity immutable"
      - "It forces EAGER fetching on every field"
    answer: 1
    explanation: |
      All-field equals/hashCode reads every field including lazy associations, which can
      trigger LazyInitializationException or extra SELECTs, and mutable fields cause the hash
      to change while the object is in a collection. Base identity on a stable id instead, and
      avoid @Data / default @EqualsAndHashCode on entities.
    ref: "concepts.md#equals-and-hashcode-with-generated-ids"

  - id: primary-keys-and-id-generation-022
    difficulty: intermediate
    tags: [composite-key, generated-value, gotcha]
    question: |
      Can you place @GeneratedValue on a composite key (@EmbeddedId or @IdClass)?
    options:
      - "Yes, on each component field"
      - "Yes, but only with TABLE strategy"
      - "No — composite key components are assigned, not generated"
      - "Only if the components are UUIDs"
    answer: 2
    explanation: |
      @GeneratedValue applies to a single simple identifier. Composite key components are
      assigned (often derived from parent rows). If you need generation, prefer a surrogate
      @Id on the join entity and enforce the pair with a unique constraint. Full mechanics
      live in the composite keys topic.
    ref: "concepts.md#composite-keys-preview"

  - id: primary-keys-and-id-generation-023
    difficulty: intermediate
    tags: [no-generated-value, assigned, exception]
    question: |
      An entity has @Id but no @GeneratedValue, and you call persist() without setting the id.
      What happens?
    options:
      - "Hibernate auto-assigns a random id"
      - "Hibernate falls back to IDENTITY"
      - "The row is inserted with id = 0"
      - "It throws an IdentifierGenerationException / requires the id to be set"
    answer: 3
    explanation: |
      Without @GeneratedValue the id is application-assigned; you must set it before persist().
      Leaving it null causes an identifier generation error. Assigned ids are common with
      natural keys or application-generated UUIDs.
    ref: "concepts.md#generatedvalue-strategies-overview"

  - id: primary-keys-and-id-generation-024
    difficulty: advanced
    tags: [uuid, storage, width]
    question: |
      What is the recommended way to store a UUID primary key in the database to avoid
      wasting space?
    options:
      - "As a native uuid type or binary(16), not varchar(36)"
      - "As TEXT"
      - "As two BIGINT columns"
      - "As varchar(36) for readability"
    answer: 0
    explanation: |
      Storing a UUID as varchar(36) roughly triples the storage versus a native uuid /
      binary(16) representation (16 bytes), bloating the PK and all FK indexes. Use the native
      uuid type (Postgres) or binary(16) (MySQL). UUIDs are already wider than BIGINT, so don't
      compound it.
    ref: "concepts.md#uuid-generation"

  - id: primary-keys-and-id-generation-025
    difficulty: intermediate
    tags: [sequence, sql, ordering]
    question: |
      With SEQUENCE + pooled optimizer and allocationSize 50, roughly how often does
      Hibernate issue a nextval call while inserting many rows in one session?
    options:
      - "Once per insert"
      - "Twice per insert"
      - "Approximately once per 50 inserts"
      - "Never — ids are computed purely client-side"
    answer: 2
    explanation: |
      The pooled optimizer reserves a block of allocationSize (50) ids per nextval and hands
      them out from memory, so it hits the DB roughly once every 50 inserts. This amortization
      is why SEQUENCE outperforms IDENTITY (one round-trip per row) at scale.
    ref: "concepts.md#allocationsize-and-the-pooled-optimizers"

  - id: primary-keys-and-id-generation-026
    difficulty: beginner
    tags: [strategies, enum]
    question: |
      Which of these is NOT a value in jakarta.persistence.GenerationType?
    options:
      - "IDENTITY"
      - "SEQUENCE"
      - "TABLE"
      - "CLUSTERED"
    answer: 3
    explanation: |
      The GenerationType enum contains IDENTITY, SEQUENCE, TABLE, AUTO, and (since JPA 3.1)
      UUID. CLUSTERED is not a JPA generation type.
    ref: "concepts.md#generatedvalue-strategies-overview"

  - id: primary-keys-and-id-generation-027
    difficulty: advanced
    tags: [hibernate-6, default-sequence, migration, gotcha]
    question: |
      In Hibernate 6+, if you use SEQUENCE without naming a @SequenceGenerator, what sequence
      name is used by default?
    options:
      - "A per-entity sequence named <entity>_seq"
      - "No sequence — it errors until you name one"
      - "The primary key column name"
      - "A single shared hibernate_sequence for all entities"
    answer: 0
    explanation: |
      Hibernate 6 changed the implicit naming so each entity gets its own <entity>_seq, unlike
      Hibernate 5's single shared hibernate_sequence. This is a common migration surprise (extra
      sequences appear, and pre-5 apps relying on the shared sequence must adjust).
    ref: "concepts.md#sequence-strategy"

  - id: primary-keys-and-id-generation-028
    difficulty: intermediate
    tags: [identity, persist, mechanism]
    question: |
      With IDENTITY generation, at what point does the INSERT statement actually execute?
    options:
      - "At flush/commit time, batched with other inserts"
      - "Immediately during persist(), to obtain the generated id"
      - "Lazily, only when the id is first read"
      - "When the second-level cache is populated"
    answer: 1
    explanation: |
      Because the persistence context needs the id to manage the entity, and IDENTITY only
      yields the id after the row exists, Hibernate executes the INSERT immediately on
      persist(). This is why persist() is no longer purely in-memory with IDENTITY, and why
      batching is impossible.
    ref: "concepts.md#identity-strategy"

  - id: primary-keys-and-id-generation-029
    difficulty: expert
    tags: [decision, scenario, strategy-choice]
    question: |
      You need to generate ids on multiple app servers offline (no DB round-trip) and merge
      records later, while keeping good PK-index insert locality. What should you choose?
    options:
      - "IDENTITY on each server"
      - "TABLE with a large allocationSize"
      - "SEQUENCE with hi-lo"
      - "A client-side UUIDv7 (via a v7 library/custom algorithm) or a TSID"
    answer: 3
    explanation: |
      Offline/distributed generation rules out DB-dependent IDENTITY/SEQUENCE/TABLE. A
      client-side, globally-unique, time-ordered id (true UUIDv7 or a TSID) preserves monotonic
      right-edge insert locality, avoiding the page-split penalty of random v4. Note Hibernate's
      built-in @UuidGenerator(style = TIME) is v1-style, NOT v7, so it does not give this
      locality — supply a v7 algorithm/library or a TSID.
    ref: "concepts.md#id-generation-strategy-comparison"

  - id: primary-keys-and-id-generation-030
    difficulty: intermediate
    tags: [natural-id, unique-constraint, design]
    question: |
      You use a surrogate key as the PK but still need to enforce that email is unique. What
      is the idiomatic approach?
    options:
      - "Keep the surrogate PK and add a unique constraint (or @NaturalId) on email"
      - "Make email the primary key after all"
      - "Store email in a separate table with its own PK"
      - "Rely on application code to check uniqueness"
    answer: 0
    explanation: |
      The standard pattern is a narrow surrogate PK plus a separate unique constraint
      (@Column(unique = true)) or Hibernate's @NaturalId on the business field. You keep FKs
      narrow while still guaranteeing natural-key integrity at the DB level.
    ref: "concepts.md#surrogate-vs-natural-keys"

  - id: primary-keys-and-id-generation-031
    difficulty: advanced
    tags: [pooled-lo, optimizer, mechanism]
    question: |
      How does the pooled-lo optimizer differ from pooled in interpreting the sequence value?
    options:
      - "pooled-lo stores the value as a string"
      - "pooled-lo treats the returned value as the bottom (lo) of the block and counts upward, while pooled treats it as the top and counts downward"
      - "pooled-lo disables in-memory allocation"
      - "There is no difference; the names are aliases"
    answer: 1
    explanation: |
      Both are interoperable optimizers that persist the real boundary in the sequence. pooled
      interprets the returned nextval as the top of the current block; pooled-lo interprets it
      as the low boundary and counts upward. Both avoid hi-lo's non-interoperability problem.
    ref: "concepts.md#allocationsize-and-the-pooled-optimizers"

  - id: primary-keys-and-id-generation-032
    difficulty: beginner
    tags: [surrogate, definition]
    question: |
      What best describes a surrogate key?
    options:
      - "A key that carries business meaning, like an ISBN"
      - "A composite of two natural columns"
      - "A synthetic, meaningless value that exists solely to identify a row"
      - "A foreign key to a parent table"
    answer: 2
    explanation: |
      A surrogate key is synthetic and has no business meaning (e.g. an auto-increment BIGINT
      or a UUID); it exists only to identify the row. A natural key, by contrast, already has
      business meaning.
    ref: "concepts.md#surrogate-vs-natural-keys"

  - id: primary-keys-and-id-generation-033
    difficulty: intermediate
    tags: [table-generator, config]
    question: |
      In @TableGenerator, what does the pkColumnValue element specify?
    options:
      - "The row key identifying which generator this entity uses within the id table"
      - "The starting id value"
      - "The primary key of the entity"
      - "The batch size"
    answer: 0
    explanation: |
      A single id table can hold multiple generators, one row each. pkColumnValue is the value
      in pkColumnName that identifies this entity's generator row; valueColumnName holds the
      current value. This lets many entities share one generator table.
    ref: "concepts.md#sequencegenerator-and-tablegenerator-configuration"

  - id: primary-keys-and-id-generation-034
    difficulty: advanced
    tags: [equals-hashcode, uuid, best-practice]
    question: |
      Why does an application-assigned UUID (set in the constructor) make equals/hashCode
      simplest for a JPA entity?
    options:
      - "UUIDs are shorter than numeric ids"
      - "The id is stable from object creation through persistence, so id-based equals/hashCode never changes"
      - "UUIDs bypass the persistence context"
      - "JPA ignores UUID ids in collections"
    answer: 1
    explanation: |
      With an app-assigned UUID the identifier exists from construction, before persist(), and
      never changes. So basing equals/hashCode on it is safe across all lifecycle transitions,
      avoiding the assigned-after-persist hash-change problem entirely.
    ref: "concepts.md#equals-and-hashcode-with-generated-ids"

  - id: primary-keys-and-id-generation-035
    difficulty: intermediate
    tags: [identity, sql, insert]
    question: |
      For an IDENTITY-mapped entity, what does the generated INSERT typically look like?
    options:
      - "It performs SELECT ... FOR UPDATE first"
      - "It calls nextval and includes the id in the VALUES list"
      - "It omits the id column and lets the DB assign it, then reads it back"
      - "It inserts id = 0 and updates it afterward"
    answer: 2
    explanation: |
      With IDENTITY the INSERT omits the auto-increment/identity column so the DB assigns it,
      and Hibernate reads the value back via getGeneratedKeys(). SEQUENCE, by contrast, calls
      nextval up front and includes the id in the VALUES.
    ref: "concepts.md#identity-strategy"

  - id: primary-keys-and-id-generation-036
    difficulty: advanced
    tags: [comparison, judgment, postgres]
    question: |
      Your service runs on PostgreSQL and does high-volume inserts. Which id strategy best
      balances throughput and correctness?
    options:
      - "IDENTITY, for simplicity"
      - "TABLE, for portability"
      - "AUTO, to let Hibernate decide"
      - "SEQUENCE with a pooled optimizer"
    answer: 3
    explanation: |
      Postgres has first-class sequences. SEQUENCE with a pooled optimizer enables JDBC
      batching and amortizes nextval calls, giving the best insert throughput. IDENTITY would
      disable batching; TABLE is a slow contention point; AUTO's semantics are less predictable
      than being explicit.
    ref: "concepts.md#id-generation-strategy-comparison"

  - id: primary-keys-and-id-generation-037
    difficulty: intermediate
    tags: [uuid, batching, mechanism]
    question: |
      Why do UUID-generated ids allow JDBC batch inserts while IDENTITY does not?
    options:
      - "UUIDs are stored as strings"
      - "The UUID is generated by the application before the INSERT, so Hibernate can buffer inserts and batch them at flush"
      - "UUID inserts skip the persistence context"
      - "Hibernate uses a special batch mode only for UUIDs"
    answer: 1
    explanation: |
      Like SEQUENCE, UUID generation produces the id before the row is inserted (client-side).
      Hibernate can therefore manage the entity, buffer the INSERT, and executeBatch at flush.
      IDENTITY can't because its id only exists after the insert.
    ref: "concepts.md#uuid-generation"

  - id: primary-keys-and-id-generation-038
    difficulty: expert
    tags: [batching, order-inserts, flush-clear, scenario]
    question: |
      After switching a bulk-insert job to SEQUENCE, which additional settings most help
      throughput and memory during a large batch?
    options:
      - "Disable the transaction and autocommit each row"
      - "Set allocationSize = 1 to avoid gaps"
      - "Enable order_inserts/order_updates and periodically flush() then clear() the persistence context"
      - "Switch fetch type of all associations to EAGER"
    answer: 2
    explanation: |
      Ordering inserts/updates groups same-table statements so JDBC batches are effective, and
      periodic flush()+clear() bounds the first-level cache so it doesn't grow unbounded and
      cause memory pressure/slowdown. allocationSize = 1 would defeat pooled amortization;
      EAGER everything hurts. (See performance-tuning-pitfalls.)
    ref: "concepts.md#why-identity-disables-jdbc-batch-inserts"

  - id: primary-keys-and-id-generation-039
    difficulty: beginner
    tags: [uuid, jpa-version, namespace]
    question: |
      In which Jakarta Persistence version was GenerationType.UUID standardized?
    options:
      - "JPA 2.1"
      - "JPA 2.2"
      - "It has never been standardized; only Hibernate supports it"
      - "Jakarta Persistence 3.1"
    answer: 3
    explanation: |
      GenerationType.UUID was added in Jakarta Persistence 3.1 (jakarta.persistence namespace).
      Before that, UUID generation was a Hibernate-specific extension. Hibernate still offers
      the richer @UuidGenerator on top.
    ref: "concepts.md#uuid-generation"

  - id: primary-keys-and-id-generation-040
    difficulty: advanced
    tags: [table-strategy, transaction, mechanism]
    question: |
      Why does Hibernate's TABLE generator typically run its allocation in a separate
      transaction/connection?
    options:
      - "To avoid holding the row lock on the generator for the duration of the business transaction"
      - "To make the ids readable"
      - "Because JPA requires a new transaction for every insert"
      - "To enable second-level caching of ids"
    answer: 0
    explanation: |
      The SELECT ... FOR UPDATE lock on the generator row would otherwise be held for the whole
      business transaction, serializing all inserts. Running allocation in its own short
      transaction releases the lock quickly, reducing contention (though it remains a hotspot).
    ref: "concepts.md#table-strategy"

  - id: primary-keys-and-id-generation-041
    difficulty: intermediate
    tags: [equals, null-guard, pattern]
    question: |
      In the recommended entity equals() implementation, how should a null id be handled?
    options:
      - "Treat two entities with null ids as equal"
      - "Return true whenever either id is null"
      - "Return false when this.id is null (only compare ids when non-null), after confirming the classes match"
      - "Throw an exception"
    answer: 2
    explanation: |
      The safe pattern compares ids only when this.id is non-null (id != null && id.equals(...)),
      so two unpersisted transient entities are not treated as equal just because both ids are
      null. Combined with a constant hashCode, this keeps collection behavior correct.
    ref: "concepts.md#equals-and-hashcode-with-generated-ids"

  - id: primary-keys-and-id-generation-042
    difficulty: advanced
    tags: [comparison, mysql, judgment]
    question: |
      On MySQL 8 you need decent insert batching. Given MySQL has no sequences, what is the
      pragmatic choice?
    options:
      - "UUIDv4 stored as varchar(36)"
      - "SEQUENCE, which MySQL supports natively"
      - "AUTO, which always picks the fastest option"
      - "IDENTITY, accepting that batching is disabled — or a table-backed sequence if batching is essential"
    answer: 3
    explanation: |
      On MySQL the practical choice is IDENTITY (AUTO_INCREMENT), accepting that it disables
      JDBC batching, or a table-backed sequence (via SEQUENCE/TABLE emulation) when batching
      truly matters — trading its contention/overhead for the ability to batch. SEQUENCE isn't
      native, AUTO's behavior is version-dependent, and varchar UUIDs bloat storage.
    ref: "concepts.md#id-generation-strategy-comparison"

  - id: primary-keys-and-id-generation-043
    difficulty: intermediate
    tags: [gaps, ids, misconception]
    question: |
      A colleague worries that the pooled sequence optimizer produces non-contiguous ids
      (gaps) and wants to switch to allocationSize = 1. What is the correct response?
    options:
      - "Gaps are cosmetic — ids need not be contiguous — and allocationSize = 1 sacrifices batching-amortization for no correctness benefit"
      - "Gaps indicate data corruption and must be eliminated"
      - "allocationSize = 1 is required for referential integrity"
      - "Gaps break foreign keys"
    answer: 0
    explanation: |
      Surrogate ids only need to be unique, not contiguous. Gaps from discarded blocks are
      harmless. Dropping to allocationSize = 1 forces a nextval per insert, losing the whole
      point of pooled allocation, without improving correctness or FK integrity.
    ref: "concepts.md#allocationsize-and-the-pooled-optimizers"

  - id: primary-keys-and-id-generation-044
    difficulty: expert
    tags: [uuid-v7, locality, database, cross-ref]
    question: |
      Two teams debate UUIDv4 vs v7 for a high-write table's PK on a clustered-index database.
      Which statement is accurate?
    options:
      - "v4 is better because randomness spreads writes evenly and avoids hotspots"
      - "v7's timestamp prefix keeps new rows near the right edge of the index, reducing page splits and write amplification compared to v4's random scatter"
      - "There is no measurable difference on a clustered index"
      - "v7 requires a database round-trip that v4 avoids"
    answer: 1
    explanation: |
      On a clustered/PK index, v4's randomness causes inserts across the whole index, forcing
      frequent page splits and buffer-pool churn. v7's leading timestamp makes inserts largely
      sequential (right-edge), like auto-increment, cutting write amplification. Both are
      client-side (no round-trip). See messaging-databases/indexing-b-tree-lsm for the mechanics.
    ref: "concepts.md#uuid-generation"

  - id: primary-keys-and-id-generation-045
    difficulty: intermediate
    tags: [auto, uuid, hibernate-6]
    question: |
      In Hibernate 6, what does @GeneratedValue (AUTO) resolve to when the id field is typed
      as java.util.UUID?
    options:
      - "IDENTITY"
      - "A table-backed sequence"
      - "It throws because AUTO only works with numeric ids"
      - "UUID generation (equivalent to GenerationType.UUID)"
    answer: 3
    explanation: |
      Hibernate 6's AUTO inspects the id type: numeric ids get a SequenceStyleGenerator, while a
      UUID-typed id resolves to UUID generation, equivalent to GenerationType.UUID. So AUTO on a
      UUID field just works as UUID generation.
    ref: "concepts.md#auto-strategy"

  - id: primary-keys-and-id-generation-046
    difficulty: advanced
    tags: [persistence-context, id, mechanism]
    question: |
      Fundamentally, why does an entity need an identifier before Hibernate can fully manage
      it in the persistence context?
    options:
      - "The id is the key by which the first-level cache tracks and dedupes the managed instance"
      - "JPA requires ids for lazy loading only"
      - "The id is used as the transaction id"
      - "Without an id the entity cannot be serialized"
    answer: 0
    explanation: |
      The persistence context (first-level cache) is keyed by entity type + id, guaranteeing one
      managed instance per row. An entity without an id cannot be placed in that map, which is
      exactly why IDENTITY must insert immediately to obtain the id before the entity is managed.
    ref: "concepts.md#why-identity-disables-jdbc-batch-inserts"

  - id: primary-keys-and-id-generation-047
    difficulty: beginner
    tags: [comparison, batching]
    question: |
      Which set of strategies allows Hibernate to know the id BEFORE the INSERT, enabling
      batch inserts?
    options:
      - "IDENTITY and AUTO only"
      - "SEQUENCE, TABLE, and UUID"
      - "Only TABLE"
      - "None; the id is always known after insert"
    answer: 1
    explanation: |
      SEQUENCE (nextval up front), TABLE (allocate from the generator row), and UUID
      (client-side) all yield the id before the INSERT, so inserts can be buffered and batched.
      IDENTITY is the outlier — its id is only known after the insert.
    ref: "concepts.md#generatedvalue-strategies-overview"

  - id: primary-keys-and-id-generation-048
    difficulty: advanced
    tags: [natural-id, composite, foreign-keys, design]
    question: |
      What is a hidden cost of choosing a composite natural key as the primary key of a
      widely-referenced entity?
    options:
      - "It cannot be indexed"
      - "JPA forbids joins on composite keys"
      - "The composite value propagates into every child table's foreign key and every join, widening indexes and complicating queries"
      - "It disables the second-level cache"
    answer: 2
    explanation: |
      A composite (or wide) natural PK is copied into each referencing FK and appears in every
      join condition, bloating indexes and complicating queries. A narrow surrogate PK keeps FKs
      compact and joins cheap; enforce the natural key with a unique constraint instead.
    ref: "concepts.md#surrogate-vs-natural-keys"

  - id: primary-keys-and-id-generation-049
    difficulty: expert
    tags: [uuid-generator, style-time, uuidv7, correction]
    question: |
      A candidate claims "@UuidGenerator(style = Style.TIME) gives you UUIDv7, so you get
      right-edge index locality for free." What is the accurate correction?
    options:
      - "Style.TIME produces a version-1-style time-based UUID with Hibernate's own layout (low timestamp bits first); it is NOT UUIDv7 and is not guaranteed monotonic"
      - "Correct — Style.TIME is Hibernate's implementation of UUIDv7"
      - "Style.TIME actually produces v4; only Style.ORDERED gives v7"
      - "Style.TIME gives v7 but only on PostgreSQL"
    answer: 0
    explanation: |
      Hibernate ships v4 (RANDOM, default) and a v1-style time value (TIME). Style.TIME uses
      Hibernate's own layout that places the low bits of the timestamp first, so it does not
      append at the right edge the way UUIDv7's Unix-millis prefix does. For true v7 you supply
      a custom UuidValueGenerator via @UuidGenerator(algorithm = ...), use a library, or a TSID.
    ref: "concepts.md#uuid-generation"

  - id: primary-keys-and-id-generation-050
    difficulty: advanced
    tags: [uuid-generator, style, defaults]
    question: |
      What does @UuidGenerator(style = Style.AUTO) produce?
    options:
      - "A version-1 time-based UUID"
      - "A UUIDv7"
      - "The same as Style.RANDOM — an RFC 4122 v4 (random) UUID"
      - "It chooses v7 on databases with clustered indexes, v4 otherwise"
    answer: 2
    explanation: |
      In Hibernate's @UuidGenerator, AUTO is equivalent to RANDOM, producing an RFC 4122
      version 4 (random) UUID. Only Style.TIME departs from random, producing a v1-style
      time-based value (not v7).
    ref: "concepts.md#uuid-generation"

  - id: primary-keys-and-id-generation-051
    difficulty: advanced
    tags: [uuid, generation-type, uuid-generator, distinction]
    question: |
      When should you prefer @GeneratedValue(strategy = GenerationType.UUID) over Hibernate's
      @UuidGenerator?
    options:
      - "When you want provider-portable UUID generation and are fine with random v4"
      - "When you need the TIME style layout"
      - "When you need to plug in a custom v7 algorithm"
      - "Never — GenerationType.UUID is deprecated"
    answer: 0
    explanation: |
      GenerationType.UUID is the JPA 3.1 spec-portable option; in Hibernate it yields a random
      v4 and offers no customization. Use @UuidGenerator when you specifically need Hibernate's
      TIME layout or a custom algorithm (e.g. a v7 generator). GenerationType.UUID is not
      deprecated.
    ref: "concepts.md#uuid-generation"

  - id: primary-keys-and-id-generation-052
    difficulty: expert
    tags: [spring-data, save, merge, persistable, scenario]
    question: |
      You switch to UUID PKs assigned in the entity constructor and Spring Data repository
      save() now emits a SELECT before every INSERT, halving insert throughput. Why?
    options:
      - "The pre-assigned id makes isNew() return false, so save() routes to merge(), which SELECTs to check for an existing row before writing"
      - "Hibernate always selects before inserting UUID entities"
      - "UUID columns require a uniqueness pre-check by the JDBC driver"
      - "The second-level cache forces a read-through on every save"
    answer: 0
    explanation: |
      SimpleJpaRepository.save() calls persist() only when isNew() is true (default: id is
      null). An assigned UUID is never null, so isNew() is false, save() calls merge(), and
      merge() must SELECT to decide INSERT vs UPDATE. This is the #1 UUID-PK prod bug.
    ref: "concepts.md#spring-data-save-with-assigned-or-uuid-ids-the-select-before-insert-trap"

  - id: primary-keys-and-id-generation-053
    difficulty: expert
    tags: [spring-data, persistable, isnew, fix]
    question: |
      What is the idiomatic fix for the SELECT-before-INSERT problem when using
      application-assigned ids with Spring Data JPA?
    options:
      - "Set spring.jpa.hibernate.ddl-auto=create"
      - "Switch all ids back to IDENTITY"
      - "Implement Persistable<ID> with a custom isNew() (e.g. backed by a transient flag reset in @PostPersist/@PostLoad, or a null @Version check), or call persist() directly"
      - "Annotate the repository method with @Modifying"
    answer: 2
    explanation: |
      Overriding isNew() lets Spring Data route new entities to persist() instead of merge().
      A common approach is a transient boolean flag flipped to false in @PostPersist/@PostLoad,
      or checking whether an auto-managed @Version/@CreatedDate is still null. Alternatively,
      bypass save() and call entityManager.persist() for known-new entities.
    ref: "concepts.md#spring-data-save-with-assigned-or-uuid-ids-the-select-before-insert-trap"

  - id: primary-keys-and-id-generation-054
    difficulty: expert
    tags: [persist, merge, state, mechanism]
    question: |
      You call merge(detachedEntity) and keep using the original reference. Why do your later
      changes to that reference not get persisted?
    options:
      - "merge() throws if the argument is detached"
      - "merge() makes the argument managed, so the changes should persist — this is a bug"
      - "merge() copies state onto a DIFFERENT managed instance and returns it; the argument stays detached, so changes to it are not tracked"
      - "merge() only works inside a new transaction"
    answer: 2
    explanation: |
      Unlike persist() (which makes the passed object managed), merge() returns a new managed
      copy and leaves the argument detached. You must use the returned instance. This is a
      classic source of "my update silently disappeared" bugs.
    ref: "concepts.md#persist-vs-merge-vs-legacy-save-and-id-state"

  - id: primary-keys-and-id-generation-055
    difficulty: expert
    tags: [hibernate-7, mapsid, cascade, transient, migration]
    question: |
      After upgrading to Hibernate 7, persisting a child that shares its PK with a parent via
      @MapsId now throws TransientObjectException, though it worked on Hibernate 6. Why?
    options:
      - "@MapsId was removed in Hibernate 7"
      - "Hibernate 7 requires @GeneratedValue on the child id"
      - "TransientObjectException is a false positive that can be ignored"
      - "Hibernate 7 no longer auto-enables cascade=PERSIST on @Id/@MapsId associations, so you must add cascade=PERSIST or persist the parent first"
    answer: 3
    explanation: |
      HB6 and earlier implicitly cascaded PERSIST through the derived-id association. HB7
      dropped that convenience, so an unsaved parent referenced by a @MapsId child triggers
      TransientObjectException unless you add cascade=PERSIST (or persist the parent first).
    ref: "concepts.md#derived-identity-mapsid-and-shared-primary-keys"

  - id: primary-keys-and-id-generation-056
    difficulty: advanced
    tags: [mapsid, one-to-one, shared-pk, mechanism]
    question: |
      What does @MapsId achieve on a @OneToOne child entity's association field?
    options:
      - "It generates a new sequence for the child"
      - "It makes the child's primary key column also serve as the foreign key to the parent, reusing the parent's id (a shared/derived PK)"
      - "It marks the association as read-only"
      - "It forces EAGER fetching of the parent"
    answer: 1
    explanation: |
      @MapsId tells JPA the child's identifier is derived from the associated parent's id. The
      single column is both PK and FK, guaranteeing a 1:1 relationship without a separate FK
      column. The child's @Id must NOT carry @GeneratedValue in this case.
    ref: "concepts.md#derived-identity-mapsid-and-shared-primary-keys"

  - id: primary-keys-and-id-generation-057
    difficulty: expert
    tags: [hibernate-7, validation, sequence, table, boot-failure]
    question: |
      On Hibernate 7 an app that booted fine on Hibernate 5 now fails at startup with a
      mapping like @GeneratedValue(strategy = SEQUENCE) paired with @TableGenerator. Why?
    options:
      - "Hibernate 7 dropped support for SEQUENCE entirely"
      - "@TableGenerator was renamed in Hibernate 7"
      - "Hibernate 7 added strict validation: SEQUENCE must pair with @SequenceGenerator and TABLE with @TableGenerator; the mismatch now errors at boot"
      - "The sequence must be created manually first"
    answer: 2
    explanation: |
      HB7 validates the strategy/generator pairing that earlier versions silently tolerated. A
      SEQUENCE strategy must reference a @SequenceGenerator; TABLE must reference a
      @TableGenerator. A cross-paired mapping now fails fast at boot instead of behaving
      unexpectedly.
    ref: "concepts.md#custom-generators-the-hibernate-6-and-7-generator-spi"

  - id: primary-keys-and-id-generation-058
    difficulty: expert
    tags: [generator-spi, before-execution, on-execution, hibernate-6]
    question: |
      In Hibernate 6's generator SPI, what distinguishes a BeforeExecutionGenerator from an
      OnExecutionGenerator, and why does it matter for batching?
    options:
      - "BeforeExecutionGenerator runs on a background thread; OnExecutionGenerator runs inline"
      - "They are aliases for the same interface"
      - "BeforeExecutionGenerator computes the value before the INSERT (batchable); OnExecutionGenerator has the DB produce it during INSERT/UPDATE (needs read-back, forces immediate execution)"
      - "OnExecutionGenerator is only for UPDATE, never INSERT"
    answer: 2
    explanation: |
      The split is exactly the mechanical root of the batching story. BeforeExecutionGenerator
      (sequence, UUID, app logic) yields the id up front so inserts can be buffered and
      batched. OnExecutionGenerator (IDENTITY, DB defaults, computed columns) needs a read-back
      after execution, forcing each statement to run immediately.
    ref: "concepts.md#custom-generators-the-hibernate-6-and-7-generator-spi"

  - id: primary-keys-and-id-generation-059
    difficulty: advanced
    tags: [id-generator-type, custom-generator, generic-generator, hibernate-6]
    question: |
      What is the modern (Hibernate 6+) recommended way to bind a custom id generator to an
      entity, replacing the deprecated string-based @GenericGenerator?
    options:
      - "@GeneratedValue(generator = \"com.example.MyGen\")"
      - "The @IdGeneratorType meta-annotation on a self-describing custom annotation that points at the Generator class"
      - "Registering the class in persistence.xml only"
      - "Implementing IdentifierGenerator.configure(Type, Properties, ServiceRegistry)"
    answer: 1
    explanation: |
      @IdGeneratorType is a meta-annotation you place on your own annotation (e.g. @TsidId) that
      references the Generator implementation. It replaces the fragile
      @GenericGenerator(strategy = "fqcn", parameters = ...) string approach, which is
      deprecated in HB6+. The legacy configure(Type, Properties, ServiceRegistry) signature is
      also legacy.
    ref: "concepts.md#custom-generators-the-hibernate-6-and-7-generator-spi"

  - id: primary-keys-and-id-generation-060
    difficulty: expert
    tags: [hibernate-7, configurable, generator-creation-context, migration]
    question: |
      A custom generator written for Hibernate 5 implements
      configure(Type, Properties, ServiceRegistry). What must change to work on Hibernate 7?
    options:
      - "Nothing; the signature is unchanged"
      - "It must be rewritten in Kotlin"
      - "configure() must return the generated id directly"
      - "Configurable#configure now receives a GeneratorCreationContext instead of a ServiceRegistry (old signature deprecated-for-removal); ideally migrate to the new Generator SPI / @IdGeneratorType"
    answer: 3
    explanation: |
      In HB7 the Configurable#configure signature changed from taking a ServiceRegistry to the
      new GeneratorCreationContext. The old form is deprecated-for-removal. Hibernate recommends
      porting to the Generator SPI and binding via @IdGeneratorType. @GeneratorType and
      GenerationTime were also removed in HB7.
    ref: "concepts.md#custom-generators-the-hibernate-6-and-7-generator-spi"

  - id: primary-keys-and-id-generation-061
    difficulty: expert
    tags: [pooled, increment-by, allocation-size, outage, scenario]
    question: |
      A DBA created the sequence as INCREMENT BY 1 but the entity maps allocationSize = 50 with
      the pooled optimizer. Under concurrent inserts you see duplicate-key violations. Why?
    options:
      - "allocationSize only affects readability, so this is unrelated"
      - "INCREMENT BY 1 disables batching, causing races"
      - "The pooled optimizer treats each nextval as the boundary of a 50-wide block and hands out 49 ids that were never reserved by the sequence; the next nextval falls inside that range, so two rows get the same id"
      - "Duplicate keys mean the PK index is corrupt"
    answer: 2
    explanation: |
      pooled/pooled-lo assume the sequence's INCREMENT BY equals allocationSize. With
      INCREMENT BY 1 but allocationSize 50, the optimizer reserves phantom ranges the sequence
      never skipped, so subsequent nextval values collide with already-issued ids. The rule:
      allocationSize MUST equal the live sequence's INCREMENT BY.
    ref: "concepts.md#allocationsize-and-the-pooled-optimizers"

  - id: primary-keys-and-id-generation-062
    difficulty: expert
    tags: [pooled, sql, boundary-math, code-reading]
    question: |
      With the pooled optimizer and allocationSize = 50 on a fresh sequence, the first
      "select nextval('book_seq')" returns 50. Which id range does that call reserve?
    options:
      - "50 through 99"
      - "1 through 50 (the returned value is the TOP of the block; ids are handed out below it)"
      - "51 through 100"
      - "Only id 50"
    answer: 1
    explanation: |
      pooled interprets the returned value as the top of the current block, so returning 50
      reserves ids 1..50. The next nextval returns 100, reserving 51..100. (pooled-lo returns
      the bottom instead: 1 reserves 1..50, then 51 reserves 51..100.)
    ref: "concepts.md#allocationsize-and-the-pooled-optimizers"

  - id: primary-keys-and-id-generation-063
    difficulty: advanced
    tags: [multi-node, sequence, pooled, gaps]
    question: |
      Two application nodes share one database sequence with the pooled optimizer. Are the
      generated ids safe, and what should you expect?
    options:
      - "Unsafe — the nodes will generate colliding ids"
      - "Safe — the real boundary lives in the DB sequence, so each node reserves a disjoint block; gaps between blocks are expected and harmless"
      - "Safe only if both nodes use allocationSize = 1"
      - "Safe only with hi-lo"
    answer: 1
    explanation: |
      Because pooled/pooled-lo persist the true boundary in the sequence itself, each node's
      nextval hands back a disjoint block (e.g. node A 1..50, node B 51..100). Ids stay unique;
      the only visible effect is non-contiguous gaps, which are fine. hi-lo would be unsafe here.
    ref: "concepts.md#allocationsize-and-the-pooled-optimizers"

  - id: primary-keys-and-id-generation-064
    difficulty: expert
    tags: [hilo, collision, interoperability, mechanism]
    question: |
      A legacy entity uses hi-lo with allocationSize = 1000 and nextval returns 5. An ETL job
      later does a manual INSERT using the raw sequence value 6. What goes wrong?
    options:
      - "Nothing — hi-lo reserves the value 6 for the ETL job"
      - "The ETL insert is silently rejected"
      - "hi-lo automatically switches to pooled to avoid the collision"
      - "hi-lo interprets 5 as a bucket multiplier and claims ids 5000..5999, so the ETL's manual id 6 will eventually collide with hi-lo-generated ids in an unrelated range"
    answer: 3
    explanation: |
      hi-lo treats the sequence value as a hi bucket: value 5 with size 1000 owns 5000..5999.
      It assumes it owns the whole id space, so any external writer using raw sequence values
      collides. This non-interoperability is why pooled replaced hi-lo (via
      hibernate.id.new_generator_mappings); hi-lo is discouraged in modern Hibernate.
    ref: "concepts.md#allocationsize-and-the-pooled-optimizers"

  - id: primary-keys-and-id-generation-065
    difficulty: expert
    tags: [postgres, serial, sequence, identity, batching, scenario]
    question: |
      A 1M-row batch insert into a PostgreSQL table with a SERIAL / GENERATED AS IDENTITY
      column is slow because the entity maps the column as GenerationType.IDENTITY. What is the
      senior "gotcha reversal" fix that regains JDBC batching?
    options:
      - "Increase hibernate.jdbc.batch_size only"
      - "Drop the identity column and use a client-side counter"
      - "Map the column as GenerationType.SEQUENCE pointing at the column's backing sequence, so Hibernate knows the id up front and can batch"
      - "Wrap each insert in REQUIRES_NEW"
    answer: 2
    explanation: |
      Postgres SERIAL / GENERATED AS IDENTITY columns are backed by a real sequence. Mapping
      the column as IDENTITY inherits the no-batching penalty; mapping the SAME column as
      SEQUENCE (nextval on the backing sequence) lets Hibernate obtain ids before insert and
      batch them. batch_size alone cannot help IDENTITY.
    ref: "concepts.md#identity-strategy"

  - id: primary-keys-and-id-generation-066
    difficulty: advanced
    tags: [identity, order-inserts, batching, mechanism]
    question: |
      Why does enabling hibernate.order_inserts NOT restore batching for an IDENTITY-mapped
      entity?
    options:
      - "order_inserts only works with UUIDs"
      - "IDENTITY executes each INSERT immediately on persist() to read the generated key, so there is never a buffer of statements to reorder or batch"
      - "order_inserts requires a second-level cache"
      - "It does restore batching; the premise is wrong"
    answer: 1
    explanation: |
      Insert ordering groups buffered same-table statements so a batch can form. IDENTITY never
      buffers — each persist() fires its INSERT at once to obtain the id via getGeneratedKeys().
      With nothing buffered, there is nothing for order_inserts to reorder.
    ref: "concepts.md#identity-strategy"

  - id: primary-keys-and-id-generation-067
    difficulty: advanced
    tags: [natural-id, api, cache, hibernate]
    question: |
      Which Hibernate Session API loads an entity by its @NaturalId, potentially resolving the
      id from the natural-id cache without querying the table?
    options:
      - "session.get(Book.class, isbn)"
      - "session.find(Book.class, isbn)"
      - "session.byNaturalId(Book.class).using(\"isbn\", value).load() (or bySimpleNaturalId(...).load(value))"
      - "session.createQuery(...).setNaturalId(...)"
    answer: 2
    explanation: |
      byNaturalId(...)/bySimpleNaturalId(...) are the dedicated natural-id lookup APIs.
      Hibernate maintains a natural-id resolution cache (natural-id to PK), so with an immutable
      @NaturalId the lookup can behave like a PK lookup. session.get/find take the primary key,
      not the natural id.
    ref: "concepts.md#enforcing-business-keys-with-naturalid"

  - id: primary-keys-and-id-generation-068
    difficulty: advanced
    tags: [natural-id, unique-constraint, design]
    question: |
      Does annotating a field with @NaturalId remove the need for a database unique constraint
      on that column?
    options:
      - "Yes — @NaturalId adds a unique constraint automatically and enforces it in the DB"
      - "Yes, but only with mutable = false"
      - "No — @NaturalId forbids unique constraints"
      - "No — @NaturalId enables the natural-id API and cache but does not itself guarantee DB-level uniqueness; you should still declare a unique constraint"
    answer: 3
    explanation: |
      @NaturalId marks the business key for Hibernate's lookup API and caching. It does not
      substitute for database-enforced integrity, so you still declare @Column(unique = true)
      / a unique constraint. Declare both: the constraint for correctness, @NaturalId for the API.
    ref: "concepts.md#enforcing-business-keys-with-naturalid"

  - id: primary-keys-and-id-generation-069
    difficulty: expert
    tags: [uuid, storage, jdbc-type, hibernate-6]
    question: |
      On PostgreSQL with default settings in Hibernate 6, how is a java.util.UUID @Id column
      stored, and how can you force a human-readable 36-char form for one specific column?
    options:
      - "Stored as varchar(36) by default; use @JdbcTypeCode(SqlTypes.BINARY) to shrink it"
      - "Always stored as BINARY(16) on every dialect, with no override available"
      - "Stored as the native uuid type by default; use @JdbcTypeCode(SqlTypes.CHAR) on that field to force char(36)"
      - "Stored as two BIGINTs; use @Convert to change it"
    answer: 2
    explanation: |
      Hibernate 6 maps UUID to the dialect's native uuid type where available (Postgres uuid),
      else BINARY(16). The global default is controlled by
      hibernate.type.preferred_uuid_jdbc_type (default BINARY); a per-field override uses
      @JdbcTypeCode(SqlTypes.CHAR) (or VARBINARY/BINARY) via the JavaType/JdbcType system.
    ref: "concepts.md#uuid-storage-and-jdbc-type-mapping"

  - id: primary-keys-and-id-generation-070
    difficulty: advanced
    tags: [uuid, preferred-jdbc-type, config]
    question: |
      Which Hibernate property globally controls how UUID attributes are mapped to a JDBC type,
      and what is its default?
    options:
      - "hibernate.type.uuid_storage, default CHAR"
      - "hibernate.type.preferred_uuid_jdbc_type, default BINARY (can be set to CHAR or VARCHAR)"
      - "hibernate.uuid.format, default UUID"
      - "hibernate.dialect.uuid_type, default VARCHAR"
    answer: 1
    explanation: |
      hibernate.type.preferred_uuid_jdbc_type sets the global preference for UUID storage. Its
      default is BINARY (16-byte binary), with CHAR and VARCHAR as alternatives. Per-attribute
      overrides use @JdbcTypeCode.
    ref: "concepts.md#uuid-storage-and-jdbc-type-mapping"

  - id: primary-keys-and-id-generation-071
    difficulty: advanced
    tags: [tsid, snowflake, alternatives, design]
    question: |
      A team rejects UUIDs to keep the PK narrow but still wants distributed, time-sorted ids.
      What is the common modern choice and its key property?
    options:
      - "A TSID / Snowflake-style 64-bit id (fits BIGINT, timestamp + node/random bits, time-ordered like v7 but half a UUID's width)"
      - "A 256-bit hash of the row contents"
      - "IDENTITY on every node"
      - "A varchar(36) UUIDv4"
    answer: 0
    explanation: |
      TSIDs / Snowflake ids pack a millisecond timestamp with a node/random component into 64
      bits, fitting a BIGINT (8 bytes vs a UUID's 16) while staying time-sorted for good index
      locality. The trade-off is a smaller random component, so schemes usually reserve node-id
      bits to avoid cross-node collisions.
    ref: "concepts.md#uuid-generation"

  - id: primary-keys-and-id-generation-072
    difficulty: expert
    tags: [equals, proxy, getclass, instanceof, lazy]
    question: |
      Why can an entity equals() written with "getClass() == o.getClass()" wrongly return false
      when comparing a lazily-loaded reference to a fully-loaded entity for the same row?
    options:
      - "getClass() is not allowed in equals()"
      - "Lazy references always have a null id"
      - "Hibernate returns a runtime proxy subclass for lazy references, so its getClass() is not the entity class; use instanceof (or Hibernate.getClass(o)) instead"
      - "The two objects are in different persistence contexts"
    answer: 2
    explanation: |
      A lazy/getReference() association is a proxy subclass (e.g. Book$HibernateProxy$xyz), so
      proxy.getClass() != Book.class. A getClass()-equality check then fails against a real
      instance of the same row. The instanceof pattern tolerates proxies; Hibernate.getClass(o)
      unwraps the proxy to the real class if you need it.
    ref: "concepts.md#equals-and-hashcode-with-generated-ids"

  - id: primary-keys-and-id-generation-073
    difficulty: advanced
    tags: [equals, natural-id, hashcode, best-practice]
    question: |
      For an entity with a stable, immutable @NaturalId (e.g. isbn), why is basing
      equals/hashCode on the natural id often preferable to the constant-hashCode trick?
    options:
      - "It lets you skip equals() entirely"
      - "It makes the entity immutable"
      - "It removes the need for a primary key"
      - "The natural id is stable from construction AND gives a real hash distribution, avoiding piling every instance into one HashSet bucket"
    answer: 3
    explanation: |
      A constant hashCode is stable but degenerate — all instances share one bucket, degrading
      HashSet/HashMap to O(n). An immutable natural id is equally stable across persistence yet
      distributes hashes properly, so it is the better choice when such a key exists.
    ref: "concepts.md#equals-and-hashcode-with-generated-ids"

  - id: primary-keys-and-id-generation-074
    difficulty: advanced
    tags: [generated, on-execution, non-id, boundary]
    question: |
      Which mechanism populates a NON-id column from a database default/trigger and, like
      IDENTITY, requires Hibernate to read the value back after execution?
    options:
      - "@GeneratedValue(strategy = SEQUENCE)"
      - "@Generated / @GeneratedColumn (the OnExecutionGenerator path), which needs a read-back after INSERT/UPDATE"
      - "@Version"
      - "@NaturalId"
    answer: 1
    explanation: |
      @Generated / @GeneratedColumn (and @ColumnDefault with insertable/updatable=false) let
      the DB compute a non-id column during execution, so Hibernate must read it back — the
      OnExecutionGenerator path, the same family as IDENTITY. This is distinct from
      @GeneratedValue, which populates the identifier.
    ref: "concepts.md#database-generated-non-id-values-boundary-note"

  - id: primary-keys-and-id-generation-075
    difficulty: expert
    tags: [sequence, sql, allocation-size, code-reading]
    question: |
      An entity uses @SequenceGenerator(allocationSize = 50). In one transaction you call
      persist() three times. How many "select nextval" statements does Hibernate issue?
    options:
      - "Three — one per persist()"
      - "One — it reserves a block of 50 and serves all three ids from memory"
      - "Zero — ids are computed purely client-side"
      - "Fifty"
    answer: 1
    explanation: |
      The pooled optimizer (used because allocationSize > 1) fetches one block of 50 with a
      single nextval and hands out the three ids from memory. If allocationSize were 1, the
      none optimizer would fire one nextval per row (three calls).
    ref: "concepts.md#sequence-strategy"

  - id: primary-keys-and-id-generation-076
    difficulty: advanced
    tags: [allocation-size, optimizer, none, mechanism]
    question: |
      What optimizer does Hibernate use when allocationSize = 1, and what is the effect?
    options:
      - "pooled — it still reserves blocks"
      - "hi-lo by default"
      - "The none optimizer — one nextval per inserted row, no in-memory block (losing the round-trip amortization)"
      - "It refuses to boot"
    answer: 2
    explanation: |
      With allocationSize = 1 Hibernate selects the none optimizer, calling nextval once per
      row. That is safe and interoperable but forfeits the batching-amortization benefit of
      pooled allocation, adding a round-trip per insert.
    ref: "concepts.md#allocationsize-and-the-pooled-optimizers"

  - id: primary-keys-and-id-generation-077
    difficulty: advanced
    tags: [hibernate-5, shared-sequence, migration, contention]
    question: |
      Hibernate 5 defaulted unnamed sequence-based ids to a single shared "hibernate_sequence".
      Besides the naming change to per-entity "<entity>_seq" in Hibernate 6, what problem did
      the shared sequence cause?
    options:
      - "It made ids non-unique across entities"
      - "It disabled the pooled optimizer"
      - "Cross-entity contention on one hot counter (and trouble with clustered MySQL/Galera setups) since all entities drew from the same sequence"
      - "It forced every id to be a UUID"
    answer: 2
    explanation: |
      A single shared sequence is a global bottleneck: every entity's inserts serialize on the
      same counter, and it interacts badly with multi-primary clustered databases. Hibernate 6's
      per-entity <entity>_seq removes that shared hotspot in addition to changing the name.
    ref: "concepts.md#sequence-strategy"

  - id: primary-keys-and-id-generation-078
    difficulty: expert
    tags: [uuidv4, write-latency, index, scenario, cross-ref]
    question: |
      Production write latency on a large, growing table degrades over time; the PK is a random
      UUIDv4 stored as char(36). What two-part fix best addresses both symptoms?
    options:
      - "Add more RAM and keep everything as-is"
      - "Rebuild the index nightly and keep UUIDv4"
      - "Change isolation level to READ UNCOMMITTED"
      - "Switch the id to a time-ordered id (UUIDv7 or a BIGINT sequence/TSID) to restore right-edge insert locality, and store it as binary(16)/uuid instead of char(36) to cut index size ~2-3x"
    answer: 3
    explanation: |
      Random v4 scatters inserts across the B-tree (page splits, buffer-pool churn) and char(36)
      roughly triples index size vs binary. A time-ordered id (v7/TSID/BIGINT sequence) restores
      monotonic right-edge inserts, and binary(16)/native uuid shrinks the PK and every FK index.
      See messaging-databases/indexing-b-tree-lsm for the B-tree mechanics.
    ref: "concepts.md#uuid-generation"
