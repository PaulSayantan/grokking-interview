topic: "Session, EntityManager & Persistence Context"
domain: hibernate-jpa
topic_slug: session-entitymanager-persistence-context
version: 1
questions:
  - id: session-entitymanager-persistence-context-001
    difficulty: beginner
    tags: [persistence-context, l1-cache, definition]
    question: |
      What best describes the JPA/Hibernate persistence context?
    options:
      - "A shared cache visible to all EntityManagers across the whole application"
      - "A first-level cache plus a unit of work that tracks managed entities"
      - "A connection pool that hands out JDBC connections to threads"
      - "A read-only snapshot of the database taken at transaction start"
    answer: 1
    explanation: |
      The persistence context is both the mandatory first-level (L1) cache — a map of
      entity-key to instance — and a unit of work that records loaded state so it can
      dirty-check and flush SQL. It is per-context, not shared (that is the second-level
      cache), and it is not a connection pool.
    ref: "concepts.md#what-the-persistence-context-is"

  - id: session-entitymanager-persistence-context-002
    difficulty: beginner
    tags: [namespace, jakarta, imports]
    question: |
      In Hibernate ORM 6/7, which package should the EntityManager type be imported from?
    options:
      - "javax.persistence"
      - "org.hibernate.jpa"
      - "jakarta.persistence"
      - "java.persistence"
    answer: 2
    explanation: |
      Hibernate 6/7 targets Jakarta Persistence 3.1/3.2, which uses the
      jakarta.persistence.* namespace. The legacy javax.persistence.* packages (JPA <=2.2)
      were dropped in Jakarta EE 9+ and are not supported.
    ref: "concepts.md#entitymanager-and-session-as-the-interface"

  - id: session-entitymanager-persistence-context-003
    difficulty: beginner
    tags: [thread-safety, factory]
    question: |
      Which statement about thread-safety is correct?
    options:
      - "Both EntityManagerFactory and EntityManager are thread-safe"
      - "EntityManager is thread-safe; EntityManagerFactory is not"
      - "Neither is thread-safe; both need external synchronization"
      - "EntityManagerFactory is thread-safe; EntityManager is not"
    answer: 3
    explanation: |
      The EntityManagerFactory/SessionFactory is an expensive, thread-safe, application-wide
      singleton. The EntityManager/Session is cheap, holds the mutable first-level cache,
      and is NOT thread-safe — use one per request/transaction.
    ref: "concepts.md#factory-vs-context-entitymanagerfactory-and-sessionfactory"

  - id: session-entitymanager-persistence-context-004
    difficulty: intermediate
    tags: [object-identity, l1-cache, find]
    question: |
      Within a single persistence context you call em.find(Author.class, 1L) twice and
      assign the results to a1 and a2. What is guaranteed?
    options:
      - "a1 and a2 are distinct instances with equal field values"
      - "a1 == a2 (the exact same object instance is returned)"
      - "a2 reflects the latest DB row even if the row changed after a1 loaded"
      - "The second find always issues a fresh SELECT to re-read the row"
    answer: 1
    explanation: |
      The persistence context guarantees object identity within its scope: the same PK
      returns the same instance. The second find is served from the L1 cache with no SQL,
      so a1 == a2 by reference. It does NOT re-read a changed row within the same context.
    ref: "concepts.md#the-first-level-cache-and-object-identity"

  - id: session-entitymanager-persistence-context-005
    difficulty: intermediate
    tags: [dirty-checking, flush, update]
    question: |
      A managed Employee is loaded, then you call e.setSalary(6000) and never call any
      EntityManager method. At commit, what happens?
    options:
      - "Hibernate dirty-checks the entity and issues an UPDATE automatically"
      - "Nothing — you must call em.merge(e) or em.persist(e) to save the change"
      - "A LazyInitializationException is thrown because the entity was mutated"
      - "The change is silently discarded because setters are not tracked"
    answer: 0
    explanation: |
      Managed entities are dirty-checked: Hibernate compares current field values to the
      loaded-state snapshot at flush and emits an UPDATE for any that differ. No explicit
      save/merge call is needed for a managed entity.
    ref: "concepts.md#dirty-checking-and-automatic-flush"

  - id: session-entitymanager-persistence-context-006
    difficulty: intermediate
    tags: [lazy-init-exception, scope, transaction]
    question: |
      A transaction-scoped EntityManager loads an Order (with a LAZY lineItems collection),
      the @Transactional method returns, and later the controller calls
      order.getLineItems().size(). What is the most likely result?
    options:
      - "The collection loads fine because entities stay managed after commit"
      - "An empty list, since lazy collections default to empty when detached"
      - "A fresh SELECT via a new persistence context created on demand"
      - "A LazyInitializationException because the persistence context is closed"
    answer: 3
    explanation: |
      With a transaction-scoped PC, the context closes at commit and the returned Order is
      detached. Touching an uninitialized lazy collection outside its context throws
      LazyInitializationException. Fix by fetching in-tx (JOIN FETCH / entity graph / DTO),
      not by enabling Open Session In View.
    ref: "concepts.md#persistence-context-scope-transaction-scoped-vs-extended"

  - id: session-entitymanager-persistence-context-007
    difficulty: intermediate
    tags: [merge, detached, gotcha]
    question: |
      You have a detached Order o. Which snippet correctly applies a status change and
      persists it?
    options:
      - "em.merge(o); o.setStatus(SHIPPED);"
      - "o.setStatus(SHIPPED); em.persist(o);"
      - "Order m = em.merge(o); m.setStatus(SHIPPED);"
      - "em.detach(o); o.setStatus(SHIPPED);"
    answer: 2
    explanation: |
      merge does not make its argument managed — it returns a separate managed copy. You
      must mutate the RETURN value. Calling persist on a detached entity risks
      EntityExistsException, and mutating o after merge changes only the still-detached o.
    ref: "concepts.md#core-operations"

  - id: session-entitymanager-persistence-context-008
    difficulty: intermediate
    tags: [getReference, proxy, find]
    question: |
      What is the key difference between em.getReference(Class, id) and em.find(Class, id)?
    options:
      - "getReference returns a lazy proxy without hitting the DB; find loads eagerly now"
      - "getReference runs an eager SELECT immediately; find hands back a lazy proxy"
      - "getReference returns null if absent; find throws an exception"
      - "There is no difference; getReference is just an alias for find"
    answer: 0
    explanation: |
      getReference returns a lazy proxy and defers the SELECT until a non-id property is
      accessed (throwing EntityNotFoundException then if the row is missing). find loads
      immediately and returns null when the row does not exist.
    ref: "concepts.md#core-operations"

  - id: session-entitymanager-persistence-context-009
    difficulty: beginner
    tags: [operations, clear]
    question: |
      What does EntityManager.clear() do?
    options:
      - "Detaches all entities, emptying the persistence context"
      - "Flushes all pending INSERT/UPDATE SQL and commits the transaction"
      - "Rolls back the current transaction and releases the JDBC connection"
      - "Deletes all managed entities from the database via cascading DELETEs"
    answer: 0
    explanation: |
      clear() evicts every managed entity, emptying the first-level cache. All previously
      managed entities become detached. It does not flush, commit, or delete rows.
    ref: "concepts.md#contains-detach-and-clear"

  - id: session-entitymanager-persistence-context-010
    difficulty: advanced
    tags: [batch, flush, clear, memory]
    question: |
      When bulk-inserting a million rows through the EntityManager, why do you periodically
      call flush() then clear() inside the loop?
    options:
      - "To commit each batch so a failure doesn't roll back everything"
      - "To force Hibernate to switch from IDENTITY to SEQUENCE id generation"
      - "To push pending INSERTs and empty the L1 cache so memory stays bounded"
      - "To disable dirty checking for the remaining iterations"
    answer: 2
    explanation: |
      flush() sends the accumulated INSERTs to the DB; clear() empties the L1 cache so it
      does not grow unbounded (which would exhaust memory and slow dirty checking as it
      scans every managed entity). flush/clear does not commit — the transaction still
      commits at the end.
    ref: "concepts.md#contains-detach-and-clear"

  - id: session-entitymanager-persistence-context-011
    difficulty: beginner
    tags: [factory, lifecycle, cost]
    question: |
      How many EntityManagerFactory instances should a typical application create per
      persistence unit?
    options:
      - "One per request-handling thread"
      - "One for each open transaction"
      - "One for the whole application"
      - "One for every EntityManager opened"
    answer: 2
    explanation: |
      The EntityManagerFactory is expensive to build (parses mappings, builds the
      metamodel, opens the connection pool) and is thread-safe, so you create exactly one
      per persistence unit for the application's lifetime and share it.
    ref: "concepts.md#factory-vs-context-entitymanagerfactory-and-sessionfactory"

  - id: session-entitymanager-persistence-context-012
    difficulty: intermediate
    tags: [session, hibernate, unwrap]
    question: |
      In a Hibernate ORM 6/7 application, how do the Session and EntityManager types
      relate?
    options:
      - "They are unrelated APIs that cannot be converted between each other"
      - "EntityManager extends Session, so every EntityManager is a Session subclass"
      - "Session was removed in Hibernate 6 in favor of EntityManager only"
      - "Session extends EntityManager, and you can em.unwrap(Session.class)"
    answer: 3
    explanation: |
      In Hibernate 6/7 the Hibernate Session interface extends the Jakarta
      EntityManager. A JPA EntityManager backed by Hibernate can be unwrapped to a Session
      via em.unwrap(Session.class) to access Hibernate-specific features.
    ref: "concepts.md#entitymanager-and-session-as-the-interface"

  - id: session-entitymanager-persistence-context-013
    difficulty: intermediate
    tags: [extended, scope, stateful]
    question: |
      What characterizes an EXTENDED persistence context
      (@PersistenceContext(type = EXTENDED))?
    options:
      - "It shares the L1 cache across multiple threads safely"
      - "Its entities are detached immediately after each method returns"
      - "It spans multiple transactions, keeping entities managed between them"
      - "It disables the first-level cache to reduce memory usage"
    answer: 2
    explanation: |
      An extended persistence context lives as long as the owning stateful bean and spans
      multiple transactions, keeping entities managed across them — useful for multi-step
      conversations. A transaction-scoped PC (the default) detaches entities at commit.
    ref: "concepts.md#persistence-context-scope-transaction-scoped-vs-extended"

  - id: session-entitymanager-persistence-context-014
    difficulty: beginner
    tags: [l1-cache, mandatory]
    question: |
      Can the first-level (L1) cache be disabled?
    options:
      - "Yes, via hibernate.cache.use_first_level_cache=false"
      - "Only in Hibernate 7; it was mandatory in earlier versions"
      - "No — it is mandatory and inherent to every persistence context"
      - "Yes, but only for entities annotated with @Cacheable(false)"
    answer: 2
    explanation: |
      The first-level cache IS the persistence context; it is mandatory and cannot be
      turned off. Only the optional second-level cache (shared across contexts) can be
      enabled/disabled per entity.
    ref: "concepts.md#the-first-level-cache-and-object-identity"

  - id: session-entitymanager-persistence-context-015
    difficulty: intermediate
    tags: [dirty-checking, snapshot, mechanism]
    question: |
      How does Hibernate know a managed entity is dirty at flush time?
    options:
      - "It registers JVM field-change listeners on every setter"
      - "It compares current field values to a loaded-state snapshot taken at load time"
      - "It re-reads the row from the DB and diffs it against the entity"
      - "It requires you to call em.markDirty(entity) before flush"
    answer: 1
    explanation: |
      At load time Hibernate snapshots the entity's property values into the PC. At flush
      it compares current values against that snapshot; differing entities are dirty and
      get an UPDATE. It does not use JVM listeners, re-read the row, or need a manual mark.
    ref: "concepts.md#dirty-checking-and-automatic-flush"

  - id: session-entitymanager-persistence-context-016
    difficulty: advanced
    tags: [dynamic-update, columns, update-sql]
    question: |
      By default, when a managed entity with 10 columns has one field changed, what UPDATE
      does Hibernate generate at flush?
    options:
      - "An UPDATE touching only the single changed column, computed by diffing the snapshot"
      - "No UPDATE — Hibernate merges the field change into the row's next scheduled INSERT"
      - "One UPDATE statement per column, all batched together into a single round-trip"
      - "An UPDATE listing all columns, so a cached prepared statement can be reused"
    answer: 3
    explanation: |
      By default Hibernate UPDATEs all columns so it can reuse one cached prepared
      statement per entity type. @DynamicUpdate makes it generate SQL for only the dirty
      columns, at the cost of statement-cache churn. See transactions-dirty-checking-flushing.
    ref: "concepts.md#dirty-checking-and-automatic-flush"

  - id: session-entitymanager-persistence-context-017
    difficulty: intermediate
    tags: [contains, managed, detached]
    question: |
      What does em.contains(entity) return?
    options:
      - "true if the entity exists as a row in the database"
      - "true if the entity has any dirty (unflushed) changes"
      - "true if the entity is present in the second-level cache"
      - "true if the entity is currently managed by this persistence context"
    answer: 3
    explanation: |
      contains reports whether the given instance is currently managed by THIS persistence
      context. It says nothing about DB existence, dirtiness, or the second-level cache.
    ref: "concepts.md#contains-detach-and-clear"

  - id: session-entitymanager-persistence-context-018
    difficulty: intermediate
    tags: [persist, merge, semantics]
    question: |
      When should you prefer persist over merge?
    options:
      - "For a brand-new entity created inside the current transaction"
      - "When reattaching a detached entity edited across web requests"
      - "When you want a separate managed copy returned"
      - "When the entity already exists in the database"
    answer: 0
    explanation: |
      persist is for new (transient) entities inside the current transaction; it keeps YOUR
      reference managed and can throw EntityExistsException if the id already exists. merge
      is for reattaching detached state and returns a separate managed copy.
    ref: "concepts.md#core-operations"

  - id: session-entitymanager-persistence-context-019
    difficulty: advanced
    tags: [object-identity, jpql, l1-cache]
    question: |
      An entity with id=5 is already managed in the context (loaded earlier). A JPQL query
      then returns the row for id=5, whose salary was changed in the DB meanwhile. What
      instance/value do you get?
    options:
      - "A new instance reflecting the changed salary from the DB"
      - "The already-managed instance; its entity identity wins over the query row"
      - "A LazyInitializationException because two versions conflict"
      - "The managed instance but with salary refreshed to the DB value"
    answer: 1
    explanation: |
      For entity identity, the L1 cache wins: a JPQL query returning an already-managed
      entity yields the cached instance, not a fresh copy, even if the DB row changed. To
      get DB values you would need refresh() or a new context. This is guaranteed object
      identity within a context.
    ref: "concepts.md#the-first-level-cache-and-object-identity"

  - id: session-entitymanager-persistence-context-020
    difficulty: intermediate
    tags: [flush, sql, mechanism]
    question: |
      What does em.flush() do?
    options:
      - "Commits the current transaction and permanently releases all database locks"
      - "Clears the first-level cache, detaching every entity from the context"
      - "Closes the EntityManager and returns its JDBC connection to the pool"
      - "Synchronizes the persistence context to the DB by running pending SQL now"
    answer: 3
    explanation: |
      flush synchronizes in-memory changes to the database by executing pending INSERT /
      UPDATE / DELETE statements immediately. It does not commit (the tx still needs to
      commit), does not clear the cache, and does not close the EntityManager.
    ref: "concepts.md#core-operations"

  - id: session-entitymanager-persistence-context-021
    difficulty: advanced
    tags: [detach, dirty-checking, gotcha]
    question: |
      After em.detach(order), you call order.setTotal(999). At commit, what happens to the
      DB?
    options:
      - "The total column is updated to 999 via dirty checking"
      - "Nothing — a detached entity is no longer dirty-checked"
      - "A LazyInitializationException is thrown on commit"
      - "The entire order row is deleted because it left the context"
    answer: 1
    explanation: |
      Dirty checking only applies to managed entities. Once detached, the entity's setters
      no longer reach the DB; you would have to merge it back to persist the change.
    ref: "concepts.md#dirty-checking-and-automatic-flush"

  - id: session-entitymanager-persistence-context-022
    difficulty: advanced
    tags: [equals-hashcode, id, set]
    question: |
      Why is using a DB-generated @Id (GenerationType.IDENTITY) inside equals/hashCode
      dangerous for an entity stored in a HashSet?
    options:
      - "The id column is not indexed, so hash bucket lookups degrade badly"
      - "Hibernate forbids overriding equals on entities mapped with @Id"
      - "The id is null before persist and gets assigned at flush, changing the hashCode"
      - "IDENTITY ids are always Strings internally, which hash inconsistently"
    answer: 2
    explanation: |
      A transient entity has id == null; persist/flush later assigns the id, mutating the
      hashCode. If the entity was already in a HashSet, it becomes unfindable. Prefer a
      stable business key or a pre-assigned UUID. See entity-mappings-associations.
    ref: "concepts.md#equals-and-hashcode-gotchas"

  - id: session-entitymanager-persistence-context-023
    difficulty: beginner
    tags: [lifecycle, states, managed]
    question: |
      Which lifecycle state means the entity is tracked by the persistence context and its
      changes are auto-flushed?
    options:
      - "Managed"
      - "Detached"
      - "Transient"
      - "Removed"
    answer: 0
    explanation: |
      Managed (a.k.a. persistent) entities live in the persistence context, are
      dirty-checked, and their changes are flushed automatically. Transient is unknown to
      any context; Detached was managed but no longer is; Removed is scheduled for DELETE.
    ref: "concepts.md#entity-lifecycle-at-a-glance"

  - id: session-entitymanager-persistence-context-024
    difficulty: intermediate
    tags: [remove, lifecycle]
    question: |
      What does em.remove(entity) do to a managed entity?
    options:
      - "Immediately issues a DELETE and closes the connection"
      - "Detaches it from the persistence context without touching the DB"
      - "Transitions it to the Removed state, scheduling a DELETE at flush"
      - "Throws IllegalStateException unless the entity has no child associations"
    answer: 2
    explanation: |
      remove transitions a managed entity to the Removed state; the actual DELETE is issued
      at flush (typically before commit). It does not detach it or necessarily run SQL
      immediately.
    ref: "concepts.md#core-operations"

  - id: session-entitymanager-persistence-context-025
    difficulty: advanced
    tags: [spring, thread-bound, proxy]
    question: |
      In Spring, an @PersistenceContext EntityManager field appears usable from many
      concurrent requests. Why is this safe despite EntityManager not being thread-safe?
    options:
      - "Spring makes the real EntityManager thread-safe via synchronization"
      - "Spring creates a single shared EntityManager guarded by a global lock"
      - "The injected EntityManager is a thread-bound proxy routing each thread to its own context"
      - "EntityManager became fully thread-safe as of the Jakarta Persistence 3.1 spec"
    answer: 2
    explanation: |
      Spring injects a shared proxy that delegates to the current thread's/transaction's
      actual EntityManager, so each thread gets its own persistence context. The underlying
      EntityManager remains non-thread-safe. Container/tx proxying details belong to
      spring-core/spring-boot.
    ref: "concepts.md#factory-vs-context-entitymanagerfactory-and-sessionfactory"

  - id: session-entitymanager-persistence-context-026
    difficulty: intermediate
    tags: [find, l1-cache, sql-count]
    question: |
      Within one transaction you call em.find(Author.class, 1L) three times. How many
      SELECTs for author id=1 does Hibernate normally issue?
    options:
      - "Three — one SELECT is issued per find call"
      - "Zero — find is always served from the L2 cache"
      - "Two — the first and last, skipping the middle"
      - "One — subsequent calls hit the first-level cache"
    answer: 3
    explanation: |
      The first find issues a SELECT and stores the entity in the L1 cache; the next two
      calls return the cached instance with no SQL. This is the repeatable-read-within-a-
      context behavior of the persistence context.
    ref: "concepts.md#the-first-level-cache-and-object-identity"

  - id: session-entitymanager-persistence-context-027
    difficulty: intermediate
    tags: [refresh, mechanism]
    question: |
      What is the effect of em.refresh(entity)?
    options:
      - "Detaches the entity and reloads a fresh copy into a brand-new context"
      - "Flushes only that entity's pending changes, leaving others untouched"
      - "Adds the entity to the second-level cache for cross-context sharing"
      - "Overwrites the in-memory entity state with the current values from the DB"
    answer: 3
    explanation: |
      refresh re-reads the row and overwrites the managed instance's state with the DB
      values, discarding unflushed in-memory changes to that entity. It issues a SELECT.
    ref: "concepts.md#core-operations"

  - id: session-entitymanager-persistence-context-028
    difficulty: advanced
    tags: [open-session-in-view, lazy, anti-pattern]
    question: |
      A team turns on spring.jpa.open-in-view=true to stop LazyInitializationExceptions.
      What is the main downside senior reviewers point out?
    options:
      - "It disables the first-level cache during view rendering, so identity breaks"
      - "It forces every association to EAGER globally, breaking all lazy loading"
      - "It keeps the persistence context open into the view layer, masking N+1 queries"
      - "It makes the EntityManager thread-safe, which serializes and slows requests"
    answer: 2
    explanation: |
      Open Session In View holds the PC open through view rendering so lazy access no
      longer fails, but it hides the underlying fetch design — lazy associations trigger
      extra queries during rendering (N+1). Prefer fetching what you need in-tx via JOIN
      FETCH / entity graphs / DTOs. See fetching-lazy-eager-n-plus-one.
    ref: "concepts.md#persistence-context-scope-transaction-scoped-vs-extended"

  - id: session-entitymanager-persistence-context-029
    difficulty: beginner
    tags: [persist, insert, timing]
    question: |
      For an entity using GenerationType.IDENTITY, when is the INSERT typically issued
      relative to em.persist()?
    options:
      - "Never — IDENTITY entities are inserted only at commit via a batch"
      - "Only when the entity is first read back with a subsequent find call"
      - "Immediately during persist, because the DB must generate the id"
      - "At clear(), once the context is emptied and entities detach"
    answer: 2
    explanation: |
      With IDENTITY, Hibernate must run the INSERT during persist to obtain the
      DB-generated key, which also disables JDBC batching for that entity. Other strategies
      (SEQUENCE/TABLE) can defer the INSERT to flush. See primary-keys-and-id-generation.
    ref: "concepts.md#core-operations"

  - id: session-entitymanager-persistence-context-030
    difficulty: intermediate
    tags: [l1-cache, scope, sharing]
    question: |
      Is the first-level cache shared between two different EntityManagers?
    options:
      - "Yes, all EntityManagers from the same factory share one L1 cache"
      - "Only if both EntityManagers participate in the same transaction"
      - "Only for entities explicitly marked with the @Cacheable annotation"
      - "No, each persistence context has its own private L1 cache"
    answer: 3
    explanation: |
      The L1 cache is per-persistence-context and private to one EntityManager/Session. A
      cache shared across contexts is the second-level cache (see caching-first-second-level),
      which is a separate, optional feature.
    ref: "concepts.md#the-first-level-cache-and-object-identity"

  - id: session-entitymanager-persistence-context-031
    difficulty: advanced
    tags: [getReference, proxy, exception]
    question: |
      You call em.getReference(Order.class, 999L) for a row that does not exist, then later
      access order.getTotal(). What happens?
    options:
      - "EntityNotFoundException is thrown when the proxy is first accessed"
      - "getTotal returns 0 because the proxy is uninitialized"
      - "getReference returns null immediately at the call site"
      - "A new empty Order row with id=999 is inserted"
    answer: 0
    explanation: |
      getReference returns a proxy without checking existence. The SELECT fires on first
      access to a non-id property; if the row is missing, Hibernate throws
      EntityNotFoundException at that point. (find, by contrast, returns null up front.)
    ref: "concepts.md#core-operations"

  - id: session-entitymanager-persistence-context-032
    difficulty: intermediate
    tags: [factory, cost, startup]
    question: |
      Why is creating an EntityManagerFactory expensive?
    options:
      - "It opens a dedicated TCP connection to the database for every mapped entity type"
      - "It loads the entire database into memory as the second-level cache"
      - "It parses mappings, builds the metamodel, and initializes the connection pool"
      - "It compiles and validates all JPQL queries in the application ahead of time"
    answer: 2
    explanation: |
      Building the factory involves scanning/parsing entity mappings, constructing the JPA
      metamodel, wiring the second-level cache, and starting the connection pool — heavy
      one-time work. That is why it is created once and shared for the app's lifetime.
    ref: "concepts.md#factory-vs-context-entitymanagerfactory-and-sessionfactory"

  - id: session-entitymanager-persistence-context-033
    difficulty: intermediate
    tags: [detach, single-entity]
    question: |
      What is the difference between em.detach(e) and em.clear()?
    options:
      - "detach flushes pending changes first; clear silently discards them"
      - "detach evicts one entity; clear evicts all entities from the context"
      - "detach deletes the row; clear only removes it from the L1 cache"
      - "There is no difference; detach is simply an alias for clear"
    answer: 1
    explanation: |
      detach removes a single entity from the persistence context (making it detached),
      while clear evicts every managed entity, emptying the whole context. Neither issues
      SQL or deletes rows.
    ref: "concepts.md#contains-detach-and-clear"

  - id: session-entitymanager-persistence-context-034
    difficulty: advanced
    tags: [dirty-checking, performance, scaling]
    question: |
      A read-mostly transaction loads 50,000 entities into one context and changes two of
      them. Why can flush still be slow?
    options:
      - "Because flush re-reads all 50,000 rows from the DB to compare them"
      - "Because each managed entity opens and holds its own dedicated JDBC connection"
      - "Because the L1 cache is serialized to disk on every flush for durability"
      - "Because dirty checking scans every managed entity's fields against its snapshot"
    answer: 3
    explanation: |
      Default dirty checking compares each managed entity's current state to its snapshot,
      so cost scales with the number of managed entities x fields — not just the changed
      ones. Loading huge graphs into one context is a known pitfall; use read-only queries,
      projections, or clear(). See performance-tuning-pitfalls.
    ref: "concepts.md#dirty-checking-and-automatic-flush"

  - id: session-entitymanager-persistence-context-035
    difficulty: beginner
    tags: [lifecycle, transient]
    question: |
      A newly created object via new Order() that has never been passed to any
      EntityManager is in which state?
    options:
      - "Managed"
      - "Detached"
      - "Transient"
      - "Removed"
    answer: 2
    explanation: |
      A plain new object unknown to any persistence context and with no DB row is transient.
      persist() would make it managed. See entity-lifecycle-states.
    ref: "concepts.md#entity-lifecycle-at-a-glance"

  - id: session-entitymanager-persistence-context-036
    difficulty: intermediate
    tags: [transaction-scoped, default, spring]
    question: |
      In a typical Spring @Transactional service method, what is the scope of the
      persistence context by default?
    options:
      - "Extended — entities remain managed across calls even after the method returns"
      - "Application-scoped — a single shared context reused by all incoming requests"
      - "Transaction-scoped — created at tx start, closed at commit, entities then detached"
      - "Thread-scoped — bound to the thread and never closed until the thread itself dies"
    answer: 2
    explanation: |
      The default is transaction-scoped: the PC is created when the transaction begins and
      closed when it commits, detaching any returned entities. Extended contexts must be
      explicitly requested and are used for stateful conversations.
    ref: "concepts.md#persistence-context-scope-transaction-scoped-vs-extended"

  - id: session-entitymanager-persistence-context-037
    difficulty: advanced
    tags: [merge, sql, mechanism]
    question: |
      When you merge a detached entity whose id is not currently in the persistence context
      or second-level cache, what does Hibernate typically do first?
    options:
      - "Issues an INSERT immediately for the detached entity without any prior SELECT probe"
      - "Throws EntityExistsException at once because the detached id already maps to a row"
      - "Reuses your detached instance directly as the managed entity, skipping any copy step"
      - "Issues a SELECT to load the current managed state before copying your changes onto it"
    answer: 3
    explanation: |
      merge loads the current managed instance (a SELECT if not already cached), copies the
      detached entity's state onto it, and returns the managed copy; the UPDATE is emitted
      at flush. It does not reuse your detached instance as the managed one.
    ref: "concepts.md#core-operations"

  - id: session-entitymanager-persistence-context-038
    difficulty: intermediate
    tags: [equals-hashcode, business-key]
    question: |
      What is the generally recommended basis for an entity's equals/hashCode to remain
      stable across persistence contexts?
    options:
      - "The DB-generated surrogate id, since it is unique and never changes once assigned"
      - "The default Object.hashCode() identity, leaving equals/hashCode entirely unoverridden"
      - "A stable business/natural key, or a UUID assigned before persist"
      - "The entity's @Version field, because the optimistic-lock counter is guaranteed unique"
    answer: 2
    explanation: |
      Because object identity is only guaranteed within one context, cross-context equality
      needs a value that is stable from creation — a natural/business key or a
      pre-assigned UUID — rather than a surrogate id that is null until flush.
    ref: "concepts.md#equals-and-hashcode-gotchas"

  - id: session-entitymanager-persistence-context-039
    difficulty: advanced
    tags: [identity, cross-context]
    question: |
      An entity loaded in context A and the same-PK entity loaded in context B are compared
      with ==. What is true?
    options:
      - "They are always ==, since instance identity is shared globally across the SessionFactory"
      - "The comparison throws an exception, because a managed entity may not cross context boundaries"
      - "They may be different instances; == identity is only guaranteed within one context"
      - "They are == only when the shared second-level cache is disabled for that entity type"
    answer: 2
    explanation: |
      Guaranteed object identity is scoped to a single persistence context. Two different
      contexts can hold distinct instances for the same PK, so == is unreliable across
      contexts — which is exactly why entities need a proper equals/hashCode.
    ref: "concepts.md#the-first-level-cache-and-object-identity"

  - id: session-entitymanager-persistence-context-040
    difficulty: beginner
    tags: [operations, persist-vs-save]
    question: |
      In JPA, which method makes a transient entity managed and schedules it for insertion?
    options:
      - "em.save(entity)"
      - "em.persist(entity)"
      - "em.store(entity)"
      - "em.insert(entity)"
    answer: 1
    explanation: |
      persist is the JPA method to make a transient entity managed. save is a
      Hibernate-native Session method (and Spring Data's repository method), not part of the
      Jakarta EntityManager API; store/insert do not exist.
    ref: "concepts.md#core-operations"

  - id: session-entitymanager-persistence-context-041
    difficulty: advanced
    tags: [clear, lazy, gotcha]
    question: |
      Inside a transaction you load an Order, then call em.clear(), then access
      order.getLineItems() (a LAZY collection not yet initialized). What happens?
    options:
      - "The collection loads normally since the transaction is still open"
      - "LazyInitializationException — clear() detached the Order"
      - "An empty collection is returned, since clear() nulls out uninitialized proxies"
      - "clear() eagerly initializes all lazy collections before evicting"
    answer: 1
    explanation: |
      clear() detaches every managed entity, including the Order. Even though the
      transaction is still active, the Order is no longer associated with a context, so
      touching an uninitialized lazy collection throws LazyInitializationException.
    ref: "concepts.md#contains-detach-and-clear"

  - id: session-entitymanager-persistence-context-042
    difficulty: intermediate
    tags: [unit-of-work, write-behind]
    question: |
      Why is the persistence context often described as a "write-behind" cache?
    options:
      - "It writes each change to an append-only log file on disk before touching the DB"
      - "It writes to the shared second-level cache first, then back-fills the first-level cache"
      - "It only supports write operations and delegates every read straight to the JDBC layer"
      - "It defers SQL, accumulating changes and flushing them together (usually before commit)"
    answer: 3
    explanation: |
      Rather than issuing SQL on every setter, the PC accumulates changes and flushes them
      as a batch, typically just before commit. This write-behind behavior enables batching,
      SQL statement reuse, and ordering of statements at flush.
    ref: "concepts.md#what-the-persistence-context-is"

  - id: session-entitymanager-persistence-context-043
    difficulty: advanced
    tags: [fix, lazy, join-fetch]
    question: |
      What is the preferred fix for a LazyInitializationException when a controller needs an
      Order's lineItems after the service transaction ends?
    options:
      - "Mark the association EAGER globally so every query always loads the lineItems up front"
      - "Fetch lineItems inside the transaction (JOIN FETCH or an entity graph) and return a fully-loaded result"
      - "Catch the LazyInitializationException in the controller and quietly return an empty list"
      - "Switch every service to an extended persistence context that outlives the transaction"
    answer: 1
    explanation: |
      The robust fix is to initialize exactly what the caller needs while the context is
      open — via JOIN FETCH, an EntityGraph, or a DTO projection. Blanket EAGER causes its
      own over-fetching/N+1 issues, and swallowing the exception hides bugs. See
      fetching-lazy-eager-n-plus-one.
    ref: "concepts.md#persistence-context-scope-transaction-scoped-vs-extended"

  - id: session-entitymanager-persistence-context-044
    difficulty: intermediate
    tags: [second-level, factory, ownership]
    question: |
      Which component owns/holds the second-level cache, the metamodel, and the connection
      pool?
    options:
      - "The EntityManager / Session"
      - "Each individual managed entity"
      - "The JTA transaction manager"
      - "The EntityManagerFactory / SessionFactory"
    answer: 3
    explanation: |
      The factory (EntityManagerFactory/SessionFactory) is the long-lived, thread-safe
      singleton that holds the metamodel, connection pool, and shared second-level cache.
      The EntityManager only holds the first-level cache (the persistence context).
    ref: "concepts.md#factory-vs-context-entitymanagerfactory-and-sessionfactory"

  - id: session-entitymanager-persistence-context-045
    difficulty: expert
    tags: [merge, lost-update, gotcha]
    question: |
      A developer writes: em.merge(order); return order; and the caller reads
      order.getStatus(), expecting the merged/managed status. What is the subtle bug?
    options:
      - "merge mutates the order argument in place, so returning it is actually correct"
      - "The returned order is still the detached instance; the managed copy (merge's return value) was discarded"
      - "merge throws an IllegalArgumentException because the order passed in is detached"
      - "getStatus triggers a LazyInitializationException while resolving the managed copy"
    answer: 1
    explanation: |
      merge returns a distinct managed instance and does NOT make the argument managed. By
      ignoring the return value and returning the original detached order, the code hands
      back stale/detached state. Capture and use the returned managed instance.
    ref: "concepts.md#core-operations"

  - id: session-entitymanager-persistence-context-046
    difficulty: intermediate
    tags: [lifecycle, detach-triggers]
    question: |
      Which of the following does NOT cause a managed entity to become detached?
    options:
      - "The EntityManager is closed"
      - "em.clear() is called"
      - "The entity's setter is invoked to change a field"
      - "The transaction-scoped context's transaction commits"
    answer: 2
    explanation: |
      Closing the EntityManager, clear(), and end of the transaction-scoped context all
      detach entities. Calling a setter simply mutates a still-managed entity (which will be
      dirty-checked) — it does not detach it.
    ref: "concepts.md#entity-lifecycle-at-a-glance"

  - id: session-entitymanager-persistence-context-047
    difficulty: expert
    tags: [flush-mode, query, auto]
    question: |
      With the default FlushModeType.AUTO, when might Hibernate flush pending changes before
      you explicitly ask?
    options:
      - "Never — under AUTO a flush is triggered exclusively by the transaction commit"
      - "Before executing a query whose results could be affected by unflushed changes"
      - "After every single setter call on any managed entity in the context"
      - "Only when clear() is invoked to evict the managed entities from the context"
    answer: 1
    explanation: |
      Under FlushModeType.AUTO, Hibernate flushes before commit and before executing a
      query that could be affected by pending changes, so the query sees consistent data.
      It does not flush on every setter. Flush ordering/modes are detailed in
      transactions-dirty-checking-flushing.
    ref: "concepts.md#dirty-checking-and-automatic-flush"

  - id: session-entitymanager-persistence-context-048
    difficulty: intermediate
    tags: [scope, detached, return-dto]
    question: |
      A service returns managed entities from a @Transactional method to a web layer that
      serializes them, occasionally hitting lazy associations. Which approach most cleanly
      avoids both LazyInitializationException and leaking the entity model?
    options:
      - "Return the raw managed entities and switch on Open Session In View for the web layer"
      - "Map to DTOs inside the transaction, projecting only the needed fields"
      - "Make every association EAGER so nothing is ever left uninitialized on return"
      - "Switch all services to an extended persistence context spanning the whole request"
    answer: 1
    explanation: |
      Building DTOs inside the transaction fetches exactly what is needed while the context
      is open and decouples the API from the entity graph, avoiding both the exception and
      accidental lazy triggering during serialization. OSIV and blanket EAGER trade one
      problem for another. See spring-data-jpa-repositories and fetching-lazy-eager-n-plus-one.
    ref: "concepts.md#persistence-context-scope-transaction-scoped-vs-extended"

  - id: session-entitymanager-persistence-context-049
    difficulty: expert
    tags: [hibernate-7, session-api, removals]
    question: |
      In Hibernate ORM 7, which set of Session methods was REMOVED (not merely deprecated)?
    options:
      - "save, update, saveOrUpdate, delete, load"
      - "persist, merge, remove, find"
      - "flush, clear, detach, contains"
      - "getReference, refresh, lock, getFlushMode"
    answer: 0
    explanation: |
      Hibernate 7 removed the legacy native mutators save(), update(), saveOrUpdate(),
      delete(), and load(). get() is deprecated (use find()). The JPA-standard operations
      (persist/merge/remove/find/getReference) remain — they are the replacements.
    ref: "concepts.md#hibernate-7-session-api-removals"

  - id: session-entitymanager-persistence-context-050
    difficulty: advanced
    tags: [hibernate-7, load, getReference]
    question: |
      Legacy code calls session.load(Book.class, id) and session.save(book). What are the
      Hibernate 7 replacements with the same semantics?
    options:
      - "getReference(...) for load, and persist(...) for save"
      - "find(...) for load, and persist(...) for save"
      - "find(...) for load, and merge(...) for save"
      - "getReference(...) for load, and merge(...) for save"
    answer: 0
    explanation: |
      load() returned a lazy proxy without checking existence — its direct replacement is
      getReference(), which has the same lazy-proxy semantics. save() (for a transient
      entity) maps to persist(). update() (detached) is what maps to merge().
    ref: "concepts.md#hibernate-7-session-api-removals"

  - id: session-entitymanager-persistence-context-051
    difficulty: expert
    tags: [stateless-session, batch, memory]
    question: |
      You must insert 10 million rows from a stream. Why is StatelessSession often preferred
      over a stateful Session with periodic flush()/clear()?
    options:
      - "StatelessSession has no persistence context, so no snapshots, dirty checking, or L1 growth"
      - "StatelessSession auto-commits after each row, so a mid-stream failure never rolls anything back"
      - "StatelessSession forces GenerationType.IDENTITY, which reserves keys faster for bulk inserts"
      - "StatelessSession keeps every inserted entity managed so it can transparently retry failed rows"
    answer: 0
    explanation: |
      StatelessSession bypasses the persistence context entirely: no L1 cache, no
      loaded-state snapshots, no dirty checking, no cascade or auto-flush. Each operation
      maps to a direct SQL statement. The stateful flush/clear idiom still pays snapshot and
      dirty-check costs even when you clear the L1 map periodically.
    ref: "concepts.md#statelesssession-for-high-volume-batch-work"

  - id: session-entitymanager-persistence-context-052
    difficulty: expert
    tags: [stateless-session, hibernate-7, l2-cache]
    question: |
      In Hibernate 7, what changed about StatelessSession and the second-level cache?
    options:
      - "StatelessSession can no longer read from or write to the second-level cache under any setting"
      - "StatelessSession now shares the parent Session's first-level cache for loaded entities"
      - "StatelessSession now uses the L2 cache by default; use setCacheMode(CacheMode.IGNORE) to bypass it"
      - "StatelessSession now requires an explicit @Cacheable annotation on every entity it loads"
    answer: 2
    explanation: |
      Hibernate 7 made StatelessSession use the second-level cache by default. To recover
      the pre-7 behavior of bypassing L2 (important for large one-off batch jobs that would
      otherwise pollute the cache), call setCacheMode(CacheMode.IGNORE).
    ref: "concepts.md#statelesssession-for-high-volume-batch-work"

  - id: session-entitymanager-persistence-context-053
    difficulty: advanced
    tags: [stateless-session, dirty-checking, update]
    question: |
      Using a StatelessSession, you load an entity, mutate a field, and commit. The DB row
      is unchanged. Why?
    options:
      - "StatelessSession is strictly read-only and is not permitted to issue write statements"
      - "The change was staged in the first-level cache but the commit never triggered a flush"
      - "StatelessSession silently rolls back all in-memory mutations when the transaction commits"
      - "StatelessSession has no dirty checking; you must call update(entity) explicitly"
    answer: 3
    explanation: |
      A StatelessSession has no persistence context and therefore no dirty checking. Setter
      changes are not tracked; you must explicitly call update(entity) (or the bulk
      updateMultiple) to write them. This is the deliberate trade-off for its low overhead.
    ref: "concepts.md#statelesssession-for-high-volume-batch-work"

  - id: session-entitymanager-persistence-context-054
    difficulty: expert
    tags: [flush-mode, auto-flush, query-spaces]
    question: |
      Inside a transaction you call employee.setSalary(9000) on a managed entity, then
      execute a JPQL query "select e from Employee e where e.salary > 8000". With the default
      FlushModeType.AUTO, what SQL runs and in what order?
    options:
      - "Only the SELECT runs; the UPDATE is deferred until commit"
      - "An UPDATE of the employee row runs first, then the SELECT"
      - "The SELECT runs first, then Hibernate discards the pending UPDATE"
      - "A LazyInitializationException is thrown before either statement runs"
    answer: 1
    explanation: |
      Under AUTO, before running a query Hibernate checks the query spaces (tables the query
      reads). Because the pending change touches the employee table, it auto-flushes the
      UPDATE first so the query sees consistent, up-to-date data — then issues the SELECT.
    ref: "concepts.md#flush-modes-and-auto-flush-before-queries"

  - id: session-entitymanager-persistence-context-055
    difficulty: expert
    tags: [flush-mode, native-query, gotcha]
    question: |
      With unflushed changes pending and FlushModeType.AUTO, you run a NATIVE SQL query
      (createNativeQuery) instead of JPQL. How does auto-flush behave differently?
    options:
      - "It parses the native SQL just like JPQL and flushes only the specific tables that statement reads"
      - "It skips auto-flush completely for native queries, so pending changes are never written before commit"
      - "It cannot parse the SQL to infer tables, so it flushes the whole PC (unless synchronized tables are declared)"
      - "It throws a PersistenceException because native SQL queries are incompatible with AUTO flush mode"
    answer: 2
    explanation: |
      Hibernate can compute query spaces for JPQL/HQL and flush only overlapping changes.
      For native SQL it cannot parse the affected tables, so it conservatively flushes the
      entire persistence context — unless you declare synchronized tables/entity classes to
      scope the flush.
    ref: "concepts.md#flush-modes-and-auto-flush-before-queries"

  - id: session-entitymanager-persistence-context-056
    difficulty: advanced
    tags: [flush-mode, commit, own-writes]
    question: |
      A method sets FlushModeType.COMMIT, then persists a new entity, then runs a JPQL query
      that would match it. Within the same transaction, does the query see the new row?
    options:
      - "Yes — COMMIT still auto-flushes the affected tables before executing any JPQL query"
      - "Yes — persist under COMMIT writes its INSERT immediately, so the query always finds the new row"
      - "No — COMMIT blocks all read queries from running until the enclosing transaction has committed"
      - "No — under COMMIT, pending changes are not flushed before queries, so the query may miss them"
    answer: 3
    explanation: |
      FlushModeType.COMMIT flushes only at commit, NOT before queries. So a query issued
      before commit may not see your own unflushed writes — a classic read-your-writes
      surprise. AUTO (the default) would flush the affected tables first.
    ref: "concepts.md#flush-modes-and-auto-flush-before-queries"

  - id: session-entitymanager-persistence-context-057
    difficulty: expert
    tags: [internals, entity-entry, snapshot]
    question: |
      In Hibernate's StatefulPersistenceContext, what does the EntityEntry's loadedState
      array hold, and what is it used for?
    options:
      - "A copy of the row's raw JDBC bytes, used to rebuild the connection on reconnect"
      - "The hydrated property values at load time, diffed against current values for dirty checking"
      - "The ordered list of pending INSERT/UPDATE/DELETE statements queued for this specific entity at flush"
      - "The serialized second-level cache key that Hibernate uses to evict this entity's region on flush"
    answer: 1
    explanation: |
      Each managed entity has an EntityEntry (status, EntityKey, LockMode, loadedState). The
      loadedState is a snapshot array of hydrated property values taken at load; default
      dirty checking diffs current values against it index-by-index to decide which entities
      need UPDATEs.
    ref: "concepts.md#persistence-context-internals-entityentry-snapshots-actionqueue"

  - id: session-entitymanager-persistence-context-058
    difficulty: expert
    tags: [action-queue, flush-order, unique-constraint]
    question: |
      Within one transaction you call em.remove(userA) then em.persist(userB), where both
      share the same unique email. At flush you get a unique-constraint violation. Why?
    options:
      - "The persistence context keeps both userA and userB live in the L1 cache simultaneously, and Hibernate validates the unique constraint in memory before any SQL is sent"
      - "The remove is silently ignored because userB reuses the identity slot that userA occupied in the L1 cache"
      - "Hibernate is not permitted to issue a DELETE and an INSERT against the same table within one transaction"
      - "The ActionQueue executes inserts before deletes, so userB's INSERT collides with the not-yet-deleted userA"
    answer: 3
    explanation: |
      The ActionQueue flushes in a fixed order regardless of call order:
      orphan-removal, inserts, updates, collections, then deletes LAST. So userB's INSERT
      runs while userA's row still exists, violating the unique constraint. The clean fix is
      usually to update the row in place rather than delete-then-insert.
    ref: "concepts.md#action-queue-flush-order-and-the-unique-constraint-trap"

  - id: session-entitymanager-persistence-context-059
    difficulty: advanced
    tags: [action-queue, flush-order, workaround]
    question: |
      For the remove-then-persist-with-same-unique-key problem, why is inserting an
      em.flush() between remove() and persist() considered a code smell rather than a fix?
    options:
      - "It forces statement ordering and breaks batching, papering over a delete-then-insert design"
      - "The intermediate flush() actually rolls the pending DELETE back, so userA's row survives and it never helps"
      - "Calling flush() mid-transaction is prohibited by the JPA specification outside of commit boundaries"
      - "It permanently switches the session into FlushMode.MANUAL, disabling all later auto-flush behavior"
    answer: 0
    explanation: |
      The intermediate flush forces the DELETE out before the INSERT, but it defeats JDBC
      batching and hides the real issue: the code is deleting and re-inserting a row that
      shares a unique key. Updating the existing row in place is the proper fix.
    ref: "concepts.md#action-queue-flush-order-and-the-unique-constraint-trap"

  - id: session-entitymanager-persistence-context-060
    difficulty: expert
    tags: [bytecode-enhancement, dirty-tracking, performance]
    question: |
      With Hibernate bytecode enhancement and enableDirtyTracking active, how does dirty
      detection differ from the default?
    options:
      - "Hibernate re-reads each managed row from the database at flush time and diffs it against the in-memory entity"
      - "Entities self-report their changed attributes in-line, so flush skips full snapshot diffing"
      - "Dirty checking is disabled entirely, so every managed entity is UPDATEd unconditionally on every flush"
      - "Only entities explicitly annotated with @DynamicUpdate are dirty-checked; all others are skipped at flush"
    answer: 1
    explanation: |
      Bytecode enhancement instruments entities to track their own dirty attributes as they
      are mutated. Flush then consults the self-reported dirty set instead of diffing every
      field against the loadedState snapshot, cutting flush cost on large persistence
      contexts. It also enables lazy @Basic columns and no-proxy lazy to-one.
    ref: "concepts.md#bytecode-enhancement-and-in-line-dirty-tracking"

  - id: session-entitymanager-persistence-context-061
    difficulty: expert
    tags: [read-only, snapshot, memory]
    question: |
      To reduce memory and eliminate dirty-check work on a large read-only query result, you
      set the org.hibernate.readOnly query hint. What does Hibernate do differently for those
      entities?
    options:
      - "It loads them detached, so they are not in the persistence context"
      - "It stores them only in the second-level cache, not the first-level cache"
      - "It converts them to immutable records that throw on any setter"
      - "It skips taking the loaded-state snapshot and never issues UPDATEs for them"
    answer: 3
    explanation: |
      Read-only entities get an EntityEntry with READ_ONLY status; Hibernate never takes the
      loaded-state snapshot (roughly halving per-entity memory) and never dirty-checks or
      UPDATEs them, even if fields are mutated in memory. Ideal for large read paths and OSIV
      render.
    ref: "concepts.md#read-only-entities-and-skipping-snapshots"

  - id: session-entitymanager-persistence-context-062
    difficulty: advanced
    tags: [read-only, api]
    question: |
      Which call makes ALL subsequently loaded entities in a Hibernate Session read-only
      (no snapshot, no dirty checking)?
    options:
      - "session.setDefaultReadOnly(true)"
      - "session.setFlushMode(FlushMode.MANUAL), which suppresses snapshots since nothing will ever flush"
      - "session.clear(), which evicts entities and therefore stops any further snapshotting on load"
      - "session.setHibernateFlushMode(FlushMode.COMMIT), deferring flush so no loaded-state snapshot is kept"
    answer: 0
    explanation: |
      session.setDefaultReadOnly(true) makes every entity loaded afterward read-only. Per
      entity you would use setReadOnly(entity, true); per query the org.hibernate.readOnly
      hint. MANUAL flush mode and clear() are unrelated to snapshot suppression.
    ref: "concepts.md#read-only-entities-and-skipping-snapshots"

  - id: session-entitymanager-persistence-context-063
    difficulty: expert
    tags: [getReference, exception, timing]
    question: |
      em.getReference(Order.class, 42L) is called for a row that was deleted, and the proxy
      is later dereferenced (order.getTotal()) AFTER the persistence context has closed. What
      is thrown?
    options:
      - "EntityNotFoundException, thrown eagerly at the getReference call itself when the row is found missing"
      - "Nothing is thrown; the uninitialized proxy simply returns null for getTotal() after the context closes"
      - "A LazyInitializationException, because the proxy cannot initialize outside its closed context"
      - "EntityExistsException at dereference time, since the deleted id is treated as a re-inserted duplicate"
    answer: 2
    explanation: |
      getReference defers the SELECT to first non-id access. Normally a missing row throws
      EntityNotFoundException at that deref. But if the PC is already closed when you
      dereference, the proxy cannot initialize at all, so you get a LazyInitializationException
      first. Either way, it is not null and not thrown at the getReference call.
    ref: "concepts.md#getreference-vs-find-in-depth"

  - id: session-entitymanager-persistence-context-064
    difficulty: advanced
    tags: [getReference, foreign-key, optimization]
    question: |
      You need to set child.setParent(parent) purely to write the parent_id FK, and you
      already have the parent's id but no reason to read the parent row. What is the idiomatic
      way to avoid a needless SELECT?
    options:
      - "Call em.find(Parent.class, parentId) to fetch the row, then pass the loaded parent to setParent(...)"
      - "child.setParent(em.getReference(Parent.class, parentId))"
      - "Call em.merge(new Parent(parentId)) to obtain a managed copy, then pass that copy to setParent(...)"
      - "Construct a new Parent, call em.refresh on it to pull its row, then pass it to setParent(...)"
    answer: 1
    explanation: |
      getReference returns an uninitialized proxy carrying only the id. Assigning it to the
      FK association lets Hibernate write parent_id at flush without ever SELECTing the parent
      row. find() would eagerly load the parent unnecessarily.
    ref: "concepts.md#getreference-vs-find-in-depth"

  - id: session-entitymanager-persistence-context-065
    difficulty: expert
    tags: [merge, assigned-id, version]
    question: |
      An entity uses an application-assigned id (always non-null). Calling em.merge(e) for a
      brand-new instance fires a redundant SELECT before the INSERT. What removes that probe
      SELECT?
    options:
      - "Switching the id to GenerationType.IDENTITY so Hibernate defers key assignment and skips the existence probe"
      - "Calling em.persist instead — but the requirement is merge, so nothing removes the probe SELECT"
      - "Annotating the entity with @DynamicInsert, which lets merge INSERT directly without first checking existence"
      - "Adding a wrapper-type @Version field (e.g. Long) so a null version marks the instance transient"
    answer: 3
    explanation: |
      With an always-set id, Hibernate cannot tell transient from detached, so merge SELECTs
      to check existence. A wrapper-type @Version field lets Hibernate treat a null version
      as transient and INSERT directly, skipping the probe. A primitive (long) version can't
      be null, so it wouldn't help.
    ref: "concepts.md#merge-generated-sql-and-edge-cases"

  - id: session-entitymanager-persistence-context-066
    difficulty: advanced
    tags: [merge, redundant-save, dirty-checking]
    question: |
      A service loads a managed entity, mutates it, then calls repository.save(entity) (which
      delegates to merge). Is the save necessary, and what does it cost?
    options:
      - "Necessary — without an explicit save, mutations on a managed entity are never written to the database"
      - "Necessary — the repository save call is what actually flushes and commits the surrounding transaction"
      - "Unnecessary — dirty checking already emits the UPDATE; the save adds MergeEvent overhead"
      - "Unnecessary and harmful — calling save detaches the entity from the context, silencing dirty checking"
    answer: 2
    explanation: |
      A managed entity is auto-synchronized by dirty checking, so the UPDATE happens at flush
      regardless. Calling merge/save on it is redundant: it fires a MergeEvent and re-copies
      the already-hydrated state. It doesn't detach the entity, but it is wasted work.
    ref: "concepts.md#merge-generated-sql-and-edge-cases"

  - id: session-entitymanager-persistence-context-067
    difficulty: advanced
    tags: [merge, sql, cached]
    question: |
      When exactly does merge(detachedEntity) SKIP the SELECT that loads current managed
      state?
    options:
      - "Whenever the entity declares a @Version field, since the version alone tells merge the current state"
      - "When the entity with that id is already in the L1 cache (or loadable from L2)"
      - "It never issues a SELECT for merge under any condition; merge always copies state without reading first"
      - "Only when the current FlushModeType is COMMIT, which lets merge defer and skip the state-loading SELECT"
    answer: 1
    explanation: |
      merge needs the current managed state to copy onto. If the entity is already in the
      first-level cache (or can be pulled from the second-level cache), the SELECT is skipped;
      otherwise Hibernate issues it. The UPDATE is then emitted at flush if the state differs.
    ref: "concepts.md#merge-generated-sql-and-edge-cases"

  - id: session-entitymanager-persistence-context-068
    difficulty: advanced
    tags: [refresh, unsaved-changes, gotcha]
    question: |
      You load an entity, call e.setName("new"), then em.refresh(e) before flushing. What is
      the value of e.getName() afterward?
    options:
      - "\"new\" — refresh merges the DB row into your instance while preserving your unflushed in-memory edits"
      - "null — refresh first nulls out every field of the instance before reloading the row from the database"
      - "It throws a PersistenceException because refresh is illegal on an entity with pending unflushed changes"
      - "The original DB value — refresh overwrites in-memory state and discards the unflushed edit"
    answer: 3
    explanation: |
      refresh re-reads the row and overwrites the managed instance's state with the DB
      values, discarding any unflushed in-memory changes. So the setName edit is lost and
      getName returns the current DB value.
    ref: "concepts.md#refresh-gotchas-and-the-hibernate-7-detached-rule"

  - id: session-entitymanager-persistence-context-069
    difficulty: expert
    tags: [refresh, hibernate-7, detached]
    question: |
      In Hibernate 7, calling em.refresh(detachedEntity) on a detached instance results in
      what?
    options:
      - "It silently reattaches the detached instance to the context and reloads its state from the database"
      - "It returns a separate new managed copy of the entity, leaving the detached original untouched, like merge"
      - "It throws IllegalArgumentException; the allow_refresh_detached_entity escape hatch was removed"
      - "It works only when the legacy hibernate.allow_refresh_detached_entity property is explicitly enabled"
    answer: 2
    explanation: |
      Hibernate 7 is JPA-compliant: refresh (and lock) on a detached entity throws
      IllegalArgumentException. The prior escape-hatch property
      hibernate.allow_refresh_detached_entity was removed. Reattach with merge first if you
      need DB state.
    ref: "concepts.md#refresh-gotchas-and-the-hibernate-7-detached-rule"

  - id: session-entitymanager-persistence-context-070
    difficulty: expert
    tags: [requires-new, propagation, identity]
    question: |
      Method A (@Transactional) loads Order id=1 and calls method B annotated
      @Transactional(REQUIRES_NEW), which also loads Order id=1. Is orderInA == orderInB, and
      does B see A's unflushed changes?
    options:
      - "Same instance, and B sees A's unflushed changes because REQUIRES_NEW shares the outer persistence context"
      - "Same instance, but B sees only changes A has already committed, not A's pending in-memory edits"
      - "B throws a PessimisticLockException because the outer transaction still holds a lock on Order id=1"
      - "Different instances and B does NOT see A's unflushed changes — REQUIRES_NEW uses a fresh, independent PC"
    answer: 3
    explanation: |
      REQUIRES_NEW suspends the outer transaction and runs with a fresh, independent
      persistence context. So B loads a distinct instance (== breaks), and A's unflushed,
      uncommitted changes live in a separate PC that B cannot see.
    ref: "concepts.md#persistence-context-propagation-across-transactions"

  - id: session-entitymanager-persistence-context-071
    difficulty: advanced
    tags: [propagation, required, shared-pc]
    question: |
      With default Propagation.REQUIRED, an outer @Transactional method mutates a managed
      entity, then calls an inner @Transactional method that finds the same id. What does the
      inner method observe?
    options:
      - "A different instance freshly loaded from the DB, reflecting none of the outer method's pending changes"
      - "A LazyInitializationException, because the inner @Transactional method opens its own separate context"
      - "The same managed instance, including the outer method's unflushed changes"
      - "A read-only copy of the entity whose setters are ignored and which cannot be mutated by the inner method"
    answer: 2
    explanation: |
      REQUIRED joins the existing transaction, so both methods share the same persistence
      context (Spring binds the EM to the thread). The inner find hits the L1 cache and
      returns the same instance, seeing the outer method's pending in-memory changes.
    ref: "concepts.md#persistence-context-propagation-across-transactions"

  - id: session-entitymanager-persistence-context-072
    difficulty: advanced
    tags: [extended-pc, spring, ejb]
    question: |
      Why is @PersistenceContext(type = EXTENDED) not directly usable in a plain Spring
      @Transactional singleton service?
    options:
      - "Spring's JPA integration does not support the jakarta.persistence namespace that EXTENDED contexts require"
      - "Extended persistence contexts are restricted by the JPA spec to read-only data and reject any write operation"
      - "An extended PC belongs to a stateful bean; a Spring singleton would share one PC across all threads, which is unsafe"
      - "Spring silently converts every extended context declaration into a transaction-scoped one, so it just works"
    answer: 2
    explanation: |
      The extended PC is a Jakarta EE @Stateful EJB feature — one PC per stateful bean
      instance across calls. Spring @Transactional beans are effectively singletons, so an
      extended PC held there would be shared and thread-unsafe. Spring's conversation story
      uses custom scopes or a manually managed EntityManager instead.
    ref: "concepts.md#extended-persistence-context-in-spring-vs-jakarta-ee"

  - id: session-entitymanager-persistence-context-073
    difficulty: expert
    tags: [open-session-in-view, flush-mode, mechanism]
    question: |
      With spring.jpa.open-in-view=true, why does OSIV force the EntityManager's flush mode
      to MANUAL/COMMIT during view rendering?
    options:
      - "To make lazy loading during rendering faster by skipping the dirty-check pass AUTO flush would otherwise run first"
      - "To keep the shared second-level cache consistent across concurrent requests by flushing pending writes before each render"
      - "So lazy-init reads triggered by the view don't accidentally flush dirty state after the service transaction already committed"
      - "Because AUTO flush mode is illegal once the service transaction has committed and the request is outside any transaction"
    answer: 2
    explanation: |
      OSIV keeps the EM (and its L1 cache + connection) bound to the request through
      rendering so lazy access works. Forcing MANUAL/COMMIT flush prevents those render-time
      reads from auto-flushing pending changes into the DB after the actual service
      transaction has ended.
    ref: "concepts.md#open-session-in-view-mechanics"

  - id: session-entitymanager-persistence-context-074
    difficulty: advanced
    tags: [open-session-in-view, connection, cost]
    question: |
      A senior reviewer objects that OSIV is on by default. Which concrete cost is a valid
      reason to disable it?
    options:
      - "It disables dirty checking for the whole application, so all entity mutations must be saved with an explicit merge"
      - "It forces every association across the app to EAGER, eliminating lazy proxies and their exceptions entirely"
      - "It makes the EntityManagerFactory non-thread-safe, requiring one factory per request-handling thread"
      - "It holds the JDBC connection for the entire request including rendering, increasing pool pressure"
    answer: 3
    explanation: |
      OSIV binds the EM (and its connection) to the request thread through view rendering, so
      the connection is held far longer than the service call — increasing connection-pool
      pressure under load. It also hides N+1 queries behind the view. It neither disables
      dirty checking nor changes fetch types.
    ref: "concepts.md#open-session-in-view-mechanics"

  - id: session-entitymanager-persistence-context-075
    difficulty: expert
    tags: [multi-load, batch, natural-id]
    question: |
      You need to load 500 Book entities given a List of 500 ids, minimizing round-trips.
      Which Hibernate API is the senior choice?
    options:
      - "Call em.find(Book.class, id) in a tight loop over the 500 ids, relying on the L1 cache to collapse the round-trips"
      - "Call em.getReference(Book.class, id) for each of the 500 ids, then dereference them all so the proxies batch-initialize"
      - "Issue one createNativeQuery per id inside a single transaction so the driver pipelines the 500 statements together"
      - "session.byMultipleIds(Book.class).multiLoad(ids) — one batched SELECT ... IN (...)"
    answer: 3
    explanation: |
      byMultipleIds().multiLoad(ids) issues a single (or a few chunked) SELECT ... WHERE id
      IN (...) instead of 500 separate finds, drastically cutting round-trips. Looping find()
      or getReference() is N queries; per-id native queries are worse.
    ref: "concepts.md#loading-by-id-set-and-natural-id"

  - id: session-entitymanager-persistence-context-076
    difficulty: advanced
    tags: [clear, close, boundary]
    question: |
      After you call em.clear(), what is true about the EntityManager and its entities?
    options:
      - "The EntityManager is closed and unusable afterward, and its JDBC connection is returned to the pool"
      - "The EntityManager stays open and usable, but its persistence context is empty and prior entities are detached"
      - "All prior entities remain managed and dirty-checked; only the shared second-level cache region is evicted"
      - "Pending INSERT/UPDATE changes are flushed to the DB first, and then the prior entities stay managed"
    answer: 1
    explanation: |
      clear() empties the persistence context (all prior entities become detached) but the
      EntityManager remains open and usable — the batch-loop tool. close() is what ends the
      EM entirely and releases the JDBC connection. clear() does not flush.
    ref: "concepts.md#clear-vs-close-vs-detach"

  - id: session-entitymanager-persistence-context-077
    difficulty: expert
    tags: [hibernate-7, cascade, entity-exists]
    question: |
      In Hibernate 7, flushing a parent whose CascadeType.PERSIST association points at a
      DETACHED child instance now results in what?
    options:
      - "The detached child is silently re-attached to the context and persisted as before, exactly like pre-7 Hibernate"
      - "jakarta.persistence.EntityExistsException is thrown (JPA-compliant behavior)"
      - "A brand-new duplicate child row is inserted under a freshly generated id, orphaning the original detached row"
      - "The parent's association is quietly set to null and the flush succeeds without touching the child at all"
    answer: 1
    explanation: |
      Hibernate 7 aligns with JPA: cascading PERSIST onto a detached instance throws
      EntityExistsException at flush. The fix is to merge the detached child (or point the
      association at a getReference proxy) rather than cascade-persist a detached entity.
    ref: "concepts.md#hibernate-7-session-api-removals"

  - id: session-entitymanager-persistence-context-078
    difficulty: intermediate
    tags: [natural-id, load-api]
    question: |
      An entity has an @NaturalId isbn field. Which API loads it by that natural key with
      L1/L2 caching support?
    options:
      - "em.find(Book.class, isbn), which treats the isbn as the primary key and still consults the L1/L2 caches"
      - "session.bySimpleNaturalId(Book.class).load(isbn)"
      - "session.getReference(Book.class, isbn), returning a lazy proxy keyed on the isbn natural id with cache support"
      - "em.createQuery with the isbn string-concatenated into the JPQL where clause so the cache can key on it"
    answer: 1
    explanation: |
      bySimpleNaturalId(...).load(isbn) is the dedicated natural-id lookup, which leverages
      natural-id caching in the L1/L2 caches. find() takes the primary key, not a natural key;
      getReference also takes the PK.
    ref: "concepts.md#loading-by-id-set-and-natural-id"

  - id: session-entitymanager-persistence-context-079
    difficulty: expert
    tags: [hibernate-7, session-factory, createEntityManager]
    question: |
      In Hibernate 7, what does SessionFactory.createEntityManager() return, and why does it
      matter?
    options:
      - "A plain jakarta.persistence.EntityManager that must still be unwrapped via em.unwrap(Session.class) to reach Hibernate APIs"
      - "A Session (narrowed return type), so Hibernate-specific APIs are available without unwrap"
      - "A StatelessSession by default, since stateful persistence-context sessions were removed from the factory in Hibernate 7"
      - "A thread-safe EntityManager proxy that can be shared and reused safely across concurrent request threads"
    answer: 1
    explanation: |
      Hibernate 7 narrows the return type of SessionFactory.createEntityManager() to Session,
      so you can call Hibernate-specific methods directly without em.unwrap(Session.class). It
      is still a single-threaded unit of work, not thread-safe.
    ref: "concepts.md#hibernate-7-session-api-removals"

  - id: session-entitymanager-persistence-context-080
    difficulty: expert
    tags: [stateless-session, hibernate-7, batch-size]
    question: |
      In Hibernate 7, you configure hibernate.jdbc.batch_size=50 and run inserts through a
      StatelessSession. Why are the inserts not batched?
    options:
      - "StatelessSession is architecturally incapable of JDBC batching under any configuration, so inserts always go one at a time"
      - "hibernate.jdbc.batch_size no longer affects StatelessSession; use setJdbcBatchSize() or insertMultiple()"
      - "The batch_size property only takes effect with GenerationType.SEQUENCE ids, and StatelessSession forces IDENTITY instead"
      - "StatelessSession opens and commits an implicit transaction after each insert, flushing the batch buffer every row"
    answer: 1
    explanation: |
      In Hibernate 7 the global hibernate.jdbc.batch_size property no longer governs a
      StatelessSession. You set batching explicitly with ss.setJdbcBatchSize(n), or use the
      new bulk operations insertMultiple()/updateMultiple()/deleteMultiple().
    ref: "concepts.md#statelesssession-for-high-volume-batch-work"

  - id: session-entitymanager-persistence-context-081
    difficulty: advanced
    tags: [flush-mode, manual, osiv]
    question: |
      Which Hibernate FlushMode means "never auto-flush; the developer must call flush()
      explicitly" and is used during OSIV rendering?
    options:
      - "FlushMode.ALWAYS, which suppresses every automatic flush and defers all SQL until an explicit flush() call"
      - "FlushMode.AUTO, the mode that requires the developer to call flush() by hand before each query executes"
      - "FlushMode.MANUAL"
      - "FlushMode.COMMIT, which turns off all flushing entirely, including the final flush at transaction commit"
    answer: 2
    explanation: |
      FlushMode.MANUAL suppresses all automatic flushing — including before queries and at
      commit — until you call flush() yourself. OSIV switches the render-phase EM to a
      MANUAL/COMMIT mode so lazy reads don't flush dirty state. ALWAYS flushes before every
      query; AUTO is the default.
    ref: "concepts.md#flush-modes-and-auto-flush-before-queries"

  - id: session-entitymanager-persistence-context-082
    difficulty: expert
    tags: [internals, action-queue, write-behind]
    question: |
      When you call em.persist(newEntity) with a SEQUENCE-based id inside a transaction (no
      flush yet), what has Hibernate actually done by the time persist returns?
    options:
      - "Executed the INSERT immediately and committed the row to the database as soon as the sequence value was fetched"
      - "Nothing at all — persist is a deferred no-op until you separately call save() or saveOrUpdate() on the session"
      - "Added the entity only to the shared second-level cache, leaving the first-level context untouched until flush"
      - "Assigned the id and enqueued an EntityInsertAction in the ActionQueue, deferring the INSERT to flush"
    answer: 3
    explanation: |
      With SEQUENCE the id can be obtained without inserting, so persist assigns the id, marks
      the entity managed with an EntityEntry, and queues an EntityInsertAction; the actual
      INSERT is deferred to flush (write-behind). IDENTITY differs — it must INSERT during
      persist to get the key.
    ref: "concepts.md#persistence-context-internals-entityentry-snapshots-actionqueue"

  - id: session-entitymanager-persistence-context-083
    difficulty: advanced
    tags: [detach, cascade, boundary]
    question: |
      em.detach(parent) is called on a managed parent with a child association mapped
      cascade = CascadeType.DETACH. What happens to the child?
    options:
      - "The child row is deleted from the database when the parent's detach is flushed at commit time"
      - "The child remains managed and dirty-checked, because detach is defined by JPA to never cascade to associations"
      - "A LazyInitializationException is thrown for the child as detaching the parent invalidates its uninitialized proxy"
      - "The detach cascades and the child is also evicted from the persistence context"
    answer: 3
    explanation: |
      detach respects CascadeType.DETACH: evicting the parent also evicts the cascaded child
      from the persistence context, making it detached too. Without that cascade type the
      child would stay managed. No SQL is issued and nothing is deleted.
    ref: "concepts.md#clear-vs-close-vs-detach"
