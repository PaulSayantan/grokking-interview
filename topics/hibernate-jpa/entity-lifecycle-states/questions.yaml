topic: "Entity Lifecycle States"
domain: hibernate-jpa
topic_slug: entity-lifecycle-states
version: 1
questions:
  - id: entity-lifecycle-states-001
    difficulty: beginner
    tags: [states, fundamentals]
    question: |
      How many entity lifecycle states does JPA define, and which set is correct?
    options:
      - "Three: transient, persistent, detached"
      - "Two: attached and detached"
      - "Four: transient (new), managed (persistent), detached, removed"
      - "Five: new, managed, detached, removed, evicted"
    answer: 2
    explanation: |
      JPA defines exactly four lifecycle states: TRANSIENT/new, MANAGED/persistent,
      DETACHED, and REMOVED. "Evicted" is not a separate state — evicting simply detaches.
    ref: "concepts.md#the-four-entity-states"

  - id: entity-lifecycle-states-002
    difficulty: beginner
    tags: [transient, definition]
    question: |
      You write `Order o = new Order();` and do nothing else. What state is `o` in?
    options:
      - "Managed"
      - "Detached"
      - "Transient (new)"
      - "Removed"
    answer: 2
    explanation: |
      A freshly constructed entity that no persistence context knows about is transient:
      no DB row, usually no generated PK, and no dirty checking.
    ref: "concepts.md#transient-new"

  - id: entity-lifecycle-states-003
    difficulty: beginner
    tags: [persist, transitions]
    question: |
      Which EntityManager operation moves a transient entity to the managed state?
    options:
      - "persist()"
      - "merge()"
      - "refresh()"
      - "detach()"
    answer: 0
    explanation: |
      persist() associates a transient entity with the persistence context, making it
      managed and scheduling an INSERT. merge is for detached entities.
    ref: "concepts.md#persist-transient-to-managed"

  - id: entity-lifecycle-states-004
    difficulty: intermediate
    tags: [merge, gotcha, mechanism]
    question: |
      You call `em.merge(detachedOrder)` on a detached entity and then keep mutating
      `detachedOrder`. Why don't those mutations reach the database?
    options:
      - "merge deletes the original object"
      - "merge returns a separate managed copy; the argument stays detached and untracked"
      - "merge only works inside a read-only transaction"
      - "merge requires the entity to be transient"
    answer: 1
    explanation: |
      merge copies the detached state into a managed instance and RETURNS that instance.
      The object you passed in remains detached, so it is not dirty-checked. You must use
      the returned reference: `order = em.merge(order);`.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-005
    difficulty: intermediate
    tags: [managed, dirty-checking, mechanism]
    question: |
      An entity is managed. You call a setter to change a field but never call any
      "update" method. What happens at flush/commit?
    options:
      - "Nothing — you must call em.update() explicitly"
      - "A DELETE then INSERT is issued"
      - "An exception is thrown because the entity was not saved"
      - "Hibernate dirty-checks the change and issues an UPDATE automatically"
    answer: 3
    explanation: |
      Managed entities are dirty-checked: at flush Hibernate compares current field values
      to the load-time snapshot and issues UPDATEs for any differences. There is no
      update() call in JPA.
    ref: "concepts.md#managed-persistent"

  - id: entity-lifecycle-states-006
    difficulty: intermediate
    tags: [detached, gotcha]
    question: |
      After a Spring service transaction commits, its returned entity is detached. The
      controller then calls `order.setStatus(SHIPPED)`. What is the database effect?
    options:
      - "No effect — a detached entity is not tracked, so nothing is flushed"
      - "The row is updated immediately"
      - "The row is updated on the next HTTP request"
      - "A LazyInitializationException is always thrown"
    answer: 0
    explanation: |
      A detached entity has no persistence context watching it, so field changes are never
      dirty-checked or flushed. To persist the change you must merge it back inside a
      transaction.
    ref: "concepts.md#detached"

  - id: entity-lifecycle-states-007
    difficulty: beginner
    tags: [removed, remove]
    question: |
      You call `em.remove(managedOrder)`. When is the DELETE actually sent to the database?
    options:
      - "At the next flush/commit"
      - "Immediately, synchronously inside remove()"
      - "Never — remove only detaches"
      - "Only if you also call em.flush() with a boolean flag"
    answer: 0
    explanation: |
      remove() transitions the entity to REMOVED and schedules the DELETE; the SQL is
      issued at the next flush (which commit triggers). Like other writes, it is deferred.
    ref: "concepts.md#removed"

  - id: entity-lifecycle-states-008
    difficulty: intermediate
    tags: [remove, detached, errors]
    question: |
      What happens if you pass a DETACHED entity to `em.remove(...)`?
    options:
      - "It is silently ignored"
      - "It is re-attached and then deleted"
      - "The entity becomes transient"
      - "It throws IllegalArgumentException — remove requires a managed instance"
    answer: 3
    explanation: |
      remove() operates only on managed instances. A detached argument throws
      IllegalArgumentException; you must find/merge it into the context first (or use
      getReference), then remove.
    ref: "concepts.md#removed"

  - id: entity-lifecycle-states-009
    difficulty: intermediate
    tags: [find, getreference, mechanism]
    question: |
      What is the key behavioral difference between `em.find(Order.class, 1L)` and
      `em.getReference(Order.class, 1L)`?
    options:
      - "find returns detached; getReference returns managed"
      - "getReference issues the SELECT immediately; find is always lazy"
      - "They are identical aliases"
      - "find issues a SELECT immediately and returns null if missing; getReference returns a lazy proxy with no SELECT until touched"
    answer: 3
    explanation: |
      find eagerly SELECTs (or hits the cache) and returns null for a missing row.
      getReference returns a proxy, deferring the SELECT until a non-id property is
      accessed, and throws EntityNotFoundException then if the row is absent.
    ref: "concepts.md#find-and-getreference-loading-as-managed"

  - id: entity-lifecycle-states-010
    difficulty: intermediate
    tags: [find, null, errors]
    question: |
      You call `em.find(Order.class, 999L)` for an id that does not exist. What do you get?
    options:
      - "null"
      - "An EntityNotFoundException"
      - "A lazy proxy"
      - "A transient Order instance"
    answer: 0
    explanation: |
      find returns null when no matching row exists. It is getReference (and its proxy)
      that throws EntityNotFoundException — and only when the proxy is first dereferenced.
    ref: "concepts.md#find-and-getreference-loading-as-managed"

  - id: entity-lifecycle-states-011
    difficulty: advanced
    tags: [merge, mechanism, sql]
    question: |
      When you `em.merge(detached)` and no entity with that id is currently managed in the
      context, what does Hibernate typically do first?
    options:
      - "Immediately issues an UPDATE without reading"
      - "Throws because the entity is not managed"
      - "Converts the detached instance in place to managed with no SQL"
      - "Loads the entity by id (a SELECT) to create a managed instance, then copies the detached state into it"
    answer: 3
    explanation: |
      merge must obtain a managed instance. If none is in the context, it loads by id
      (SELECT, unless cached) to get one, then copies the detached field values in. This
      hidden SELECT is why merging in tight loops is a performance trap.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-012
    difficulty: intermediate
    tags: [persist, merge, comparison]
    question: |
      Which statement about persist versus merge is correct?
    options:
      - "Both return a managed copy of the argument"
      - "persist returns void and makes the ARGUMENT managed; merge RETURNS a managed copy and leaves the argument detached"
      - "persist is for detached entities; merge is for transient ones"
      - "Neither cascades to associated entities"
    answer: 1
    explanation: |
      persist returns void and transitions the passed transient instance to managed. merge
      returns a (usually different) managed instance and does not change the argument's
      state. Both cascade along their respective cascade types.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"

  - id: entity-lifecycle-states-013
    difficulty: advanced
    tags: [persist, identity, sql, mechanism]
    question: |
      With `@GeneratedValue(strategy = GenerationType.IDENTITY)`, when is the INSERT most
      commonly issued relative to `em.persist(e)`?
    options:
      - "Immediately, because Hibernate must run the INSERT to obtain the DB-generated key"
      - "Always deferred to commit and batched with others"
      - "Never — IDENTITY entities are inserted only by merge"
      - "Only after em.flush() is called manually"
    answer: 0
    explanation: |
      IDENTITY keys are assigned by the database on INSERT, so Hibernate cannot know the id
      without executing the INSERT immediately. This also disables JDBC batch inserts for
      such entities. SEQUENCE/TABLE can pre-allocate ids and defer/batch.
    ref: "concepts.md#persist-transient-to-managed"

  - id: entity-lifecycle-states-014
    difficulty: intermediate
    tags: [clear, detached, transitions]
    question: |
      What does `em.clear()` do to the entities currently in the persistence context?
    options:
      - "Flushes and commits them"
      - "Deletes them from the database"
      - "Refreshes all of them from the database"
      - "Detaches all of them, discarding un-flushed changes"
    answer: 3
    explanation: |
      clear() empties the persistence context (first-level cache): every managed entity
      becomes detached and any pending, un-flushed changes are lost. flush() first if you
      want them persisted.
    ref: "concepts.md#remove-detach-clear-refresh-and-close"

  - id: entity-lifecycle-states-015
    difficulty: advanced
    tags: [refresh, mechanism, sql]
    question: |
      You modify a managed entity's fields in memory (not yet flushed) and then call
      `em.refresh(entity)`. What happens?
    options:
      - "Your changes are flushed as an UPDATE, then re-read"
      - "A SELECT re-reads the DB values and overwrites your in-memory changes, discarding them"
      - "The entity becomes detached"
      - "Nothing — refresh is a no-op on dirty entities"
    answer: 1
    explanation: |
      refresh pulls the current database state into the managed object, throwing away any
      un-flushed in-memory modifications. It is the mirror image of dirty checking and
      requires a managed entity.
    ref: "concepts.md#remove-detach-clear-refresh-and-close"

  - id: entity-lifecycle-states-016
    difficulty: intermediate
    tags: [transient, detached, comparison]
    question: |
      Both transient and detached entities are "unmanaged." What distinguishes them?
    options:
      - "A transient entity has no DB row and usually no PK; a detached entity corresponds to a row and carries its PK, but is untracked"
      - "Transient entities are read-only; detached are writable"
      - "Detached entities cannot be garbage-collected"
      - "There is no real difference"
    answer: 0
    explanation: |
      Neither is tracked, but a transient entity was never persisted (no row, no generated
      id) while a detached entity was managed before (it has a PK and a corresponding row),
      it just lost its association to a context.
    ref: "concepts.md#detached"

  - id: entity-lifecycle-states-017
    difficulty: advanced
    tags: [spring-data, save, merge, gotcha]
    question: |
      In Spring Data JPA, what does `SimpleJpaRepository.save(entity)` do for an entity
      that is NOT new (has an existing id)?
    options:
      - "Calls em.persist(entity)"
      - "Calls session.saveOrUpdate(entity)"
      - "Calls em.merge(entity) and returns the managed result"
      - "Throws EntityExistsException"
    answer: 2
    explanation: |
      save() checks isNew(): if new it calls persist, otherwise it calls merge and returns
      the merged (managed) instance. So for existing entities save is merge — you must use
      the returned value.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"

  - id: entity-lifecycle-states-018
    difficulty: advanced
    tags: [hibernate6, deprecation, api]
    question: |
      Which native Hibernate Session methods were deprecated in Hibernate 6+ in favor of
      the JPA-standard operations?
    options:
      - "persist, find, getReference"
      - "flush, clear, close"
      - "save, update, saveOrUpdate"
      - "createQuery, createNativeQuery"
    answer: 2
    explanation: |
      Hibernate 6/7 deprecated the legacy save, update, saveOrUpdate (and saveOrUpdateCopy,
      Session.load) in favor of the JPA operations persist, merge, find, getReference.
      Modern code should use the JPA methods.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"

  - id: entity-lifecycle-states-019
    difficulty: intermediate
    tags: [first-level-cache, identity, mechanism]
    question: |
      Within one persistence context you call `em.find(Order.class, 1L)` twice. How many
      SELECTs run and what is the relationship between the two returned objects?
    options:
      - "Two SELECTs; two distinct objects"
      - "One SELECT; the second call returns the same object reference (==) from the context"
      - "Two SELECTs; the same object reference"
      - "Zero SELECTs; both are proxies"
    answer: 1
    explanation: |
      The persistence context is a mandatory first-level cache. The first find SELECTs and
      caches the entity by id; the second find returns the identical reference with no SQL.
      The identity (==) guarantee holds within a single context.
    ref: "concepts.md#the-persistence-context-as-first-level-cache"

  - id: entity-lifecycle-states-020
    difficulty: advanced
    tags: [equals-hashcode, identity, gotcha]
    question: |
      Why is basing an entity's equals/hashCode on a database-GENERATED id considered
      dangerous?
    options:
      - "Generated ids are always negative"
      - "Hibernate forbids overriding equals on entities"
      - "It makes the entity eligible for second-level caching"
      - "The id is null while transient and only set after persist, so the hashCode changes across the transient to managed transition, breaking HashSet membership"
    answer: 3
    explanation: |
      A generated id is null before persist. If hashCode depends on it, adding the entity
      to a HashSet while transient and then persisting changes its hashCode, so it can no
      longer be located — corrupting sets and bidirectional associations. Prefer a stable
      natural/business key.
    ref: "concepts.md#equals-and-hashcode-for-entities"

  - id: entity-lifecycle-states-021
    difficulty: beginner
    tags: [detach, transitions]
    question: |
      Which operation detaches a SINGLE entity from the persistence context without
      affecting the others?
    options:
      - "em.clear()"
      - "em.detach(entity)"
      - "em.remove(entity)"
      - "em.flush()"
    answer: 1
    explanation: |
      detach(entity) evicts just that one entity (managed to detached). clear() detaches
      everything; remove schedules a delete; flush synchronizes changes without changing
      state.
    ref: "concepts.md#remove-detach-clear-refresh-and-close"

  - id: entity-lifecycle-states-022
    difficulty: intermediate
    tags: [close, detached, spring]
    question: |
      What happens to all managed entities when the EntityManager / persistence context is
      closed?
    options:
      - "They are deleted"
      - "They all become detached"
      - "They are automatically merged into a global cache"
      - "They remain managed until garbage-collected"
    answer: 1
    explanation: |
      Closing the context ends management of every entity it held; they all become
      detached. This is exactly why entities returned from a committed Spring transaction
      are detached in the web layer.
    ref: "concepts.md#detached"

  - id: entity-lifecycle-states-023
    difficulty: advanced
    tags: [lazy, lazyinitializationexception, detached]
    question: |
      A detached entity has an uninitialized lazy `@OneToMany` collection. The view layer
      iterates it. What is the typical result and why?
    options:
      - "The collection loads fine because Hibernate reopens the session"
      - "An empty collection is returned silently"
      - "The entity is automatically re-attached"
      - "LazyInitializationException, because there is no open persistence context/session to run the SELECT"
    answer: 3
    explanation: |
      Lazy loading needs an open session. On a detached entity the proxy/collection cannot
      be initialized, producing LazyInitializationException. Fixes (JOIN FETCH, entity
      graphs, initializing in the tx) are covered in fetching-lazy-eager-n-plus-one.
    ref: "concepts.md#detached"

  - id: entity-lifecycle-states-024
    difficulty: intermediate
    tags: [persist, managed, no-op]
    question: |
      What happens if you call `em.persist(e)` on an entity that is ALREADY managed?
    options:
      - "It is essentially a no-op (the entity stays managed)"
      - "It throws EntityExistsException"
      - "It duplicates the row"
      - "It detaches then re-persists the entity"
    answer: 0
    explanation: |
      persist on an already-managed entity has no additional effect. It is calling persist
      on a DETACHED entity that is illegal (EntityExistsException / IllegalArgumentException) —
      use merge for detached instances.
    ref: "concepts.md#persist-transient-to-managed"

  - id: entity-lifecycle-states-025
    difficulty: expert
    tags: [removed, re-persist, spec]
    question: |
      After `em.remove(e)` but BEFORE flush, you call `em.persist(e)` on the same entity.
      Per the JPA spec, what is the result?
    options:
      - "The scheduled delete is cancelled and the entity becomes managed again"
      - "IllegalStateException"
      - "Both a DELETE and an INSERT are issued"
      - "The entity becomes detached"
    answer: 0
    explanation: |
      The spec states that a removed instance re-persisted before flush becomes managed
      again, cancelling the scheduled deletion. Between remove and flush it is still a live
      object in the context.
    ref: "concepts.md#removed"

  - id: entity-lifecycle-states-026
    difficulty: intermediate
    tags: [merge, transient, behavior]
    question: |
      You call `em.merge(e)` on a TRANSIENT entity (no id). How does merge behave?
    options:
      - "It throws because merge requires an existing row"
      - "It silently does nothing"
      - "It behaves like persist on a fresh managed copy and returns it"
      - "It marks the entity removed"
    answer: 2
    explanation: |
      For a transient argument, merge creates a new managed instance (effectively a
      persist) and returns it. merge thus works for both detached and transient inputs,
      unlike persist which is for transient only.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-027
    difficulty: intermediate
    tags: [getreference, proxy, fk]
    question: |
      Why might you use `em.getReference(Parent.class, parentId)` when setting a child's
      parent association before saving the child?
    options:
      - "To set the foreign key without issuing a SELECT to load the full parent row"
      - "To force an eager load of the parent"
      - "Because find cannot be used inside a transaction"
      - "To detach the parent"
    answer: 0
    explanation: |
      getReference returns a proxy carrying just the id, enough to write the FK on the
      child's INSERT, avoiding a wasteful SELECT of the parent you never otherwise touch.
    ref: "concepts.md#find-and-getreference-loading-as-managed"

  - id: entity-lifecycle-states-028
    difficulty: advanced
    tags: [spring-data, isnew, assigned-id, gotcha]
    question: |
      A Spring Data entity uses an application-ASSIGNED id (not generated). You call
      save() for a brand-new row. What inefficiency can occur and why?
    options:
      - "save skips the INSERT entirely"
      - "save always throws for assigned ids"
      - "isNew() sees a non-null id, so save calls merge — which issues a pre-SELECT to check for an existing row"
      - "save deletes the existing row first"
    answer: 2
    explanation: |
      The default isNew() is 'id is null'. With an assigned id set before save, isNew()
      returns false, so save calls merge, which does a load-by-id SELECT first. Implement
      Persistable#isNew() or use @Version/auditing to fix.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"

  - id: entity-lifecycle-states-029
    difficulty: beginner
    tags: [managed, query, states]
    question: |
      In what state are entities returned in the result list of a JPQL query
      (`em.createQuery(...).getResultList()`)?
    options:
      - "Managed"
      - "Transient"
      - "Detached"
      - "Removed"
    answer: 0
    explanation: |
      Query results are managed: they are placed in the persistence context and are
      dirty-checked like any other managed entity. Modifying them and committing issues
      UPDATEs.
    ref: "concepts.md#managed-persistent"

  - id: entity-lifecycle-states-030
    difficulty: intermediate
    tags: [flush, states, mechanism]
    question: |
      Does calling `em.flush()` change an entity's lifecycle state?
    options:
      - "Yes — it detaches all managed entities"
      - "No — flush synchronizes pending changes to the DB; entities keep their current state"
      - "Yes — it makes transient entities managed"
      - "Yes — it converts managed entities to removed"
    answer: 1
    explanation: |
      flush pushes queued INSERT/UPDATE/DELETE statements to the database but does not
      change lifecycle states: managed stays managed, removed stays removed (now deleted in
      the DB but still tracked until commit).
    ref: "concepts.md#remove-detach-clear-refresh-and-close"

  - id: entity-lifecycle-states-031
    difficulty: advanced
    tags: [merge, cascade, associations]
    question: |
      When you `em.merge(parent)`, what determines whether the merge propagates to the
      parent's child associations?
    options:
      - "Only associations mapped with cascade = MERGE (or ALL) are merged"
      - "It always cascades to all associations"
      - "It never cascades"
      - "Only EAGER associations are merged"
    answer: 0
    explanation: |
      Cascade behavior is per-association: merge propagates only across associations
      declared with CascadeType.MERGE (or ALL). Fetch type (lazy/eager) is orthogonal to
      cascade. See cascade-types-orphan-removal.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-032
    difficulty: intermediate
    tags: [detached, merge, workflow]
    question: |
      You loaded an entity in a previous transaction (now detached), changed a field, and
      want the change persisted. What is the correct JPA-portable approach?
    options:
      - "Call `entity = em.merge(entity)` in a new transaction and use the returned instance"
      - "Call em.persist(entity) in a new transaction"
      - "Call em.refresh(entity)"
      - "Just call a setter — dirty checking handles detached entities"
    answer: 0
    explanation: |
      persist would throw for a detached entity; refresh would discard the change; setters
      do nothing off-context. merge re-associates the state into a managed copy that gets
      dirty-checked, and you should keep the returned reference.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-033
    difficulty: expert
    tags: [batch, detach, clear, performance]
    question: |
      In a bulk insert of a million rows, why do experienced developers periodically call
      `em.flush(); em.clear();`?
    options:
      - "To commit each batch to a separate transaction"
      - "To force IDENTITY id generation"
      - "To bound the first-level cache size and keep dirty checking cheap by detaching already-flushed entities"
      - "To disable the second-level cache"
    answer: 2
    explanation: |
      Without clearing, every persisted entity accumulates in the persistence context,
      growing memory and making dirty checking scan an ever-larger set. flush then clear
      writes the batch and detaches it, keeping the context small. See
      performance-tuning-pitfalls.
    ref: "concepts.md#remove-detach-clear-refresh-and-close"

  - id: entity-lifecycle-states-034
    difficulty: beginner
    tags: [transient, java-keyword, gotcha]
    question: |
      The JPA "transient" lifecycle state is the same concept as the Java `transient`
      keyword. True or false?
    options:
      - "True — both exclude the entity from persistence"
      - "True — the keyword is required to mark new entities"
      - "False — the JPA term refers to detached entities"
      - "False — the JPA state means 'not yet associated with a context'; the Java keyword excludes a field from serialization"
    answer: 3
    explanation: |
      They are unrelated despite the shared word. The lifecycle state describes an object
      with no persistence-context association; the Java keyword controls Java
      serialization of a field.
    ref: "concepts.md#transient-new"

  - id: entity-lifecycle-states-035
    difficulty: intermediate
    tags: [merge, identity, mechanism]
    question: |
      After `Order managed = em.merge(detached);` in the common detached case, what is true
      about object identity?
    options:
      - "managed == detached"
      - "managed != detached — they are different object references"
      - "detached becomes null"
      - "Both point to a proxy of each other"
    answer: 1
    explanation: |
      In the detached case merge returns a different managed instance, so managed !=
      detached. Only if the detached instance happened to already be the managed one in the
      context would they coincide (uncommon).
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-036
    difficulty: advanced
    tags: [refresh, errors, mechanism]
    question: |
      What does `em.refresh(entity)` do if the underlying row was deleted by another
      transaction?
    options:
      - "Silently re-inserts the row"
      - "Returns without changes"
      - "Marks the entity transient"
      - "Throws EntityNotFoundException"
    answer: 3
    explanation: |
      refresh re-reads the row; if it no longer exists it throws EntityNotFoundException.
      refresh also requires a managed argument (IllegalArgumentException otherwise).
    ref: "concepts.md#remove-detach-clear-refresh-and-close"

  - id: entity-lifecycle-states-037
    difficulty: intermediate
    tags: [persist, void, return]
    question: |
      What does `em.persist(entity)` return?
    options:
      - "The managed entity"
      - "The generated id"
      - "void — it mutates the passed instance to managed"
      - "A boolean indicating success"
    answer: 2
    explanation: |
      persist returns void; it makes the argument itself managed (and populates its
      generated id). Contrast with merge, which returns a managed copy, and Hibernate's
      legacy save, which returned the generated id.
    ref: "concepts.md#persist-transient-to-managed"

  - id: entity-lifecycle-states-038
    difficulty: intermediate
    tags: [identity, two-contexts, gotcha]
    question: |
      The same DB row is loaded in two separate EntityManagers. What is the relationship of
      the two resulting managed objects?
    options:
      - "They are the same reference (== true) because of the shared row"
      - "They are two distinct objects; the == identity guarantee holds only within a single context"
      - "The second load throws a NonUniqueObjectException"
      - "Both are detached"
    answer: 1
    explanation: |
      The first-level cache identity guarantee is per persistence context. Two contexts
      produce two independent managed instances for the same row; == is not guaranteed
      across them.
    ref: "concepts.md#the-persistence-context-as-first-level-cache"

  - id: entity-lifecycle-states-039
    difficulty: advanced
    tags: [equals-hashcode, lombok, gotcha]
    question: |
      Why is putting Lombok's `@Data` on a JPA entity discouraged?
    options:
      - "Lombok cannot compile with Jakarta annotations"
      - "It makes all fields final"
      - "It generates id-based, association-traversing equals/hashCode/toString that break across the transient to managed transition and can trigger LazyInitializationException or infinite recursion"
      - "It forces EAGER fetching"
    answer: 2
    explanation: |
      @Data generates equals/hashCode over all fields (including generated id and
      bidirectional associations) and a toString that traverses them, causing broken
      HashSet semantics, lazy-loading exceptions, and recursion. Prefer hand-written,
      natural-key-based equals/hashCode.
    ref: "concepts.md#equals-and-hashcode-for-entities"

  - id: entity-lifecycle-states-040
    difficulty: intermediate
    tags: [spring-data, save, return-value, gotcha]
    question: |
      A developer reports "I called `repository.save(order)` but later changes to `order`
      weren't saved." What is the most likely explanation?
    options:
      - "save silently failed"
      - "save requires @Modifying"
      - "The entity needs a @Transient id"
      - "After the transaction, the argument/returned entity is detached, so later mutations aren't dirty-checked"
    answer: 3
    explanation: |
      save (merge) returns a managed instance only for the duration of the transaction.
      Once it commits, the entity is detached and further mutations are not flushed. Keep
      work in one transaction on the managed instance, or save again.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"

  - id: entity-lifecycle-states-041
    difficulty: beginner
    tags: [states, removed, definition]
    question: |
      An entity that has been passed to remove() but not yet flushed is in which state?
    options:
      - "Detached"
      - "Transient"
      - "Removed"
      - "Managed"
    answer: 2
    explanation: |
      It is in the REMOVED state: still associated with the context and still corresponding
      to a row, but scheduled for DELETE at the next flush.
    ref: "concepts.md#removed"

  - id: entity-lifecycle-states-042
    difficulty: advanced
    tags: [getreference, entitynotfoundexception, timing]
    question: |
      With `Order p = em.getReference(Order.class, 5L);` where id 5 does NOT exist, when is
      the error raised?
    options:
      - "At the getReference call itself"
      - "At transaction commit only"
      - "Never — p is just null"
      - "When a non-id property of the proxy is first accessed, as EntityNotFoundException"
    answer: 3
    explanation: |
      getReference returns a proxy without hitting the DB. The SELECT (and thus
      EntityNotFoundException for a missing row) is deferred until you dereference a
      non-identifier property.
    ref: "concepts.md#find-and-getreference-loading-as-managed"

  - id: entity-lifecycle-states-043
    difficulty: intermediate
    tags: [transitions, mapping]
    question: |
      Which mapping correctly pairs an operation with its state transition?
    options:
      - "persist: transient to managed"
      - "detach: transient to managed"
      - "merge: managed to removed"
      - "refresh: managed to detached"
    answer: 0
    explanation: |
      persist takes a transient entity to managed. detach takes managed to detached; merge
      takes detached to a managed copy; remove takes managed to removed; refresh keeps it
      managed (reloading from the DB).
    ref: "concepts.md#the-four-entity-states"

  - id: entity-lifecycle-states-044
    difficulty: expert
    tags: [merge, second-level-cache, sql, mechanism]
    question: |
      You merge 10,000 detached entities one by one in a loop. Ignoring cascade, what is
      the dominant hidden cost, absent caching?
    options:
      - "10,000 extra DELETE statements"
      - "A load-by-id SELECT per merge to obtain a managed instance before copying state"
      - "A full table scan per merge"
      - "Nothing — merge never reads"
    answer: 1
    explanation: |
      Each merge for a not-currently-managed id triggers a SELECT to fetch/attach the
      managed instance, then copies the detached state. In a loop that is 10,000 SELECTs
      plus the UPDATEs. Prefer loading managed entities and mutating, or batch strategies.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-045
    difficulty: intermediate
    tags: [remove, transient, no-op]
    question: |
      What happens if you call `em.remove(e)` on a TRANSIENT entity?
    options:
      - "Effectively nothing meaningful — there is no row to delete (spec treats a new instance as ignored)"
      - "It throws EntityExistsException"
      - "It inserts then deletes the row"
      - "It detaches the entity"
    answer: 0
    explanation: |
      There is no persistent row behind a transient instance, so removing it has no
      database effect. (Passing a detached instance, by contrast, throws
      IllegalArgumentException.)
    ref: "concepts.md#removed"

  - id: entity-lifecycle-states-046
    difficulty: advanced
    tags: [namespace, jakarta, versions]
    question: |
      In Hibernate 6/7 and Jakarta Persistence 3.x, which package do the entity lifecycle
      annotations and EntityManager live in?
    options:
      - "javax.persistence"
      - "jakarta.persistence"
      - "org.hibernate.jpa"
      - "javax.jpa"
    answer: 1
    explanation: |
      Since Jakarta EE 9 the namespace moved from javax.persistence to jakarta.persistence.
      Hibernate 6+ targets the jakarta.* namespace. Legacy javax.persistence is Jakarta
      Persistence 2.2 and earlier. See hibernate-6-7-and-jakarta-migration.
    ref: "concepts.md#the-four-entity-states"

  - id: entity-lifecycle-states-047
    difficulty: intermediate
    tags: [managed, cascade, lazy]
    question: |
      Why does lazy-association loading work on a managed entity but fail on a detached one?
    options:
      - "Managed entities are always eagerly fetched"
      - "A managed entity has an open persistence context/session available to run the deferred SELECT; a detached one does not"
      - "Detached entities have their proxies stripped"
      - "Lazy loading is disabled for detached entities by configuration"
    answer: 1
    explanation: |
      Lazy initialization needs a live session to execute the SELECT. While managed, the
      context is open; once detached, there is no session, so touching an uninitialized
      lazy association throws LazyInitializationException.
    ref: "concepts.md#managed-persistent"

  - id: entity-lifecycle-states-048
    difficulty: expert
    tags: [snapshot, dirty-checking, mechanism]
    question: |
      Dirty checking on flush compares each managed entity's current field values against
      what?
    options:
      - "The values currently in the database (a fresh SELECT per entity)"
      - "A hash stored in the second-level cache"
      - "The loaded-state snapshot the context captured when the entity was loaded or attached"
      - "The values from the previous flush of a different entity"
    answer: 2
    explanation: |
      The persistence context keeps a snapshot of each managed entity's state at
      load/attach time. At flush it diffs current values against that snapshot to decide
      which columns changed and emit UPDATEs — no extra SELECT is needed. Detail in
      transactions-dirty-checking-flushing.
    ref: "concepts.md#managed-persistent"

  - id: entity-lifecycle-states-049
    difficulty: advanced
    tags: [persist, sequence, batch, mechanism]
    question: |
      With SEQUENCE generation, why can Hibernate defer and batch INSERTs for persisted
      entities in a way it cannot with IDENTITY?
    options:
      - "SEQUENCE entities are never inserted"
      - "Hibernate can pre-allocate ids from the sequence without running the INSERT, so inserts can be queued and batched at flush"
      - "SEQUENCE forces immediate inserts too"
      - "IDENTITY uses a separate connection pool"
    answer: 1
    explanation: |
      A sequence yields the next id via a separate call, so Hibernate can assign ids up
      front and defer/batch the INSERTs to flush. IDENTITY only yields the key as a
      side-effect of the INSERT, forcing an immediate, unbatched INSERT. See
      primary-keys-and-id-generation.
    ref: "concepts.md#persist-transient-to-managed"

  - id: entity-lifecycle-states-050
    difficulty: intermediate
    tags: [evict, hibernate-native, detach]
    question: |
      The Hibernate-native `session.evict(entity)` is equivalent to which JPA operation?
    options:
      - "em.remove(entity)"
      - "em.refresh(entity)"
      - "em.detach(entity)"
      - "em.persist(entity)"
    answer: 2
    explanation: |
      evict removes a single entity from the persistence context, making it detached — the
      same effect as JPA's detach. clear() is the bulk equivalent (evict all).
    ref: "concepts.md#detached"

  - id: entity-lifecycle-states-051
    difficulty: beginner
    tags: [transitions, merge, direction]
    question: |
      Which transition does merge primarily serve?
    options:
      - "Managed to removed"
      - "Transient to managed"
      - "Detached to managed (via a returned managed copy)"
      - "Managed to detached"
    answer: 2
    explanation: |
      merge's core purpose is re-associating a detached entity: it copies its state into a
      managed instance and returns that instance. persist handles transient to managed;
      detach/clear/close handle managed to detached.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-052
    difficulty: advanced
    tags: [scenario, workflow, judgment]
    question: |
      A REST endpoint receives a JSON Order (deserialized POJO with an existing id) and
      must update the DB. Which is the cleanest JPA-portable persistence call?
    options:
      - "em.persist(order) — it is a known id"
      - "em.refresh(order) to sync it"
      - "em.getReference(Order.class, order.getId()) and discard order"
      - "order = em.merge(order) inside a transaction, using the returned managed instance"
    answer: 3
    explanation: |
      The deserialized object is effectively detached (has id + state, no context). merge
      copies its state onto a managed instance and returns it for dirty checking. persist
      would throw; refresh discards the incoming changes; getReference alone ignores the
      new field values.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-053
    difficulty: intermediate
    tags: [states, summary, judgment]
    question: |
      Which single statement about the lifecycle is FALSE?
    options:
      - "Only managed entities are dirty-checked and auto-flushed"
      - "A detached entity retains its primary key"
      - "remove schedules a DELETE at flush, not immediately"
      - "merge makes the passed-in argument managed"
    answer: 3
    explanation: |
      merge does NOT make the argument managed — it returns a separate managed copy. The
      other three statements are true and are the crux of the lifecycle model.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"
