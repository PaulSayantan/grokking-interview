topic: "Entity Lifecycle States"
domain: hibernate-jpa
topic_slug: entity-lifecycle-states
version: 1
questions:
  - id: entity-lifecycle-states-001
    difficulty: beginner
    tags: [states, fundamentals]
    question: |
      How many entity lifecycle states does JPA define, and which set is correct?
    options:
      - "Three: transient, persistent, and detached only"
      - "Two: attached (managed) and detached states only"
      - "Four: transient (new), managed (persistent), detached, removed"
      - "Five: new, managed, detached, removed, evicted"
    answer: 2
    explanation: |
      JPA defines exactly four lifecycle states: TRANSIENT/new, MANAGED/persistent,
      DETACHED, and REMOVED. "Evicted" is not a separate state — evicting simply detaches.
    ref: "concepts.md#the-four-entity-states"

  - id: entity-lifecycle-states-002
    difficulty: beginner
    tags: [transient, definition]
    question: |
      You write `Order o = new Order();` and do nothing else. What state is `o` in?
    options:
      - "Managed"
      - "Detached"
      - "Transient (new)"
      - "Removed"
    answer: 2
    explanation: |
      A freshly constructed entity that no persistence context knows about is transient:
      no DB row, usually no generated PK, and no dirty checking.
    ref: "concepts.md#transient-new"

  - id: entity-lifecycle-states-003
    difficulty: beginner
    tags: [persist, transitions]
    question: |
      Which EntityManager operation moves a transient entity to the managed state?
    options:
      - "persist()"
      - "merge()"
      - "refresh()"
      - "detach()"
    answer: 0
    explanation: |
      persist() associates a transient entity with the persistence context, making it
      managed and scheduling an INSERT. merge is for detached entities.
    ref: "concepts.md#persist-transient-to-managed"

  - id: entity-lifecycle-states-004
    difficulty: intermediate
    tags: [merge, gotcha, mechanism]
    question: |
      You call `em.merge(detachedOrder)` on a detached entity and then keep mutating
      `detachedOrder`. Why don't those mutations reach the database?
    options:
      - "merge deletes the original object from memory once the copy is made"
      - "merge returns a separate managed copy; the argument stays detached and untracked"
      - "merge only works inside a read-only transaction, so writes are ignored"
      - "merge requires the entity to be transient, so a detached one is ignored"
    answer: 1
    explanation: |
      merge copies the detached state into a managed instance and RETURNS that instance.
      The object you passed in remains detached, so it is not dirty-checked. You must use
      the returned reference: `order = em.merge(order);`.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-005
    difficulty: intermediate
    tags: [managed, dirty-checking, mechanism]
    question: |
      An entity is managed. You call a setter to change a field but never call any
      "update" method. What happens at flush/commit?
    options:
      - "Nothing — you must call em.update() explicitly to flag the field as changed"
      - "A DELETE of the old row then an INSERT of the new values is issued"
      - "A TransientObjectException is thrown because the entity was never explicitly saved"
      - "Hibernate dirty-checks the change and issues an UPDATE automatically"
    answer: 3
    explanation: |
      Managed entities are dirty-checked: at flush Hibernate compares current field values
      to the load-time snapshot and issues UPDATEs for any differences. There is no
      update() call in JPA.
    ref: "concepts.md#managed-persistent"

  - id: entity-lifecycle-states-006
    difficulty: intermediate
    tags: [detached, gotcha]
    question: |
      After a Spring service transaction commits, its returned entity is detached. The
      controller then calls `order.setStatus(SHIPPED)`. What is the database effect?
    options:
      - "No effect — a detached entity is not tracked, so nothing is flushed"
      - "The row is updated immediately through a background flush thread"
      - "The row is updated on the next HTTP request when the context reopens"
      - "A LazyInitializationException is always thrown on the setter call"
    answer: 0
    explanation: |
      A detached entity has no persistence context watching it, so field changes are never
      dirty-checked or flushed. To persist the change you must merge it back inside a
      transaction.
    ref: "concepts.md#detached"

  - id: entity-lifecycle-states-007
    difficulty: beginner
    tags: [removed, remove]
    question: |
      You call `em.remove(managedOrder)`. When is the DELETE actually sent to the database?
    options:
      - "At the next flush/commit"
      - "Immediately, synchronously inside remove()"
      - "Never — remove only detaches"
      - "Only if you also call em.flush() with a boolean flag"
    answer: 0
    explanation: |
      remove() transitions the entity to REMOVED and schedules the DELETE; the SQL is
      issued at the next flush (which commit triggers). Like other writes, it is deferred.
    ref: "concepts.md#removed"

  - id: entity-lifecycle-states-008
    difficulty: intermediate
    tags: [remove, detached, errors]
    question: |
      What happens if you pass a DETACHED entity to `em.remove(...)`?
    options:
      - "It is silently ignored because there is nothing in the context to remove"
      - "It is automatically re-attached via merge and then scheduled for deletion"
      - "The entity is downgraded to the transient state with its id cleared"
      - "It throws IllegalArgumentException — remove requires a managed instance"
    answer: 3
    explanation: |
      remove() operates only on managed instances. A detached argument throws
      IllegalArgumentException; you must find/merge it into the context first (or use
      getReference), then remove.
    ref: "concepts.md#removed"

  - id: entity-lifecycle-states-009
    difficulty: intermediate
    tags: [find, getreference, mechanism]
    question: |
      What is the key behavioral difference between `em.find(Order.class, 1L)` and
      `em.getReference(Order.class, 1L)`?
    options:
      - "find returns a detached instance while getReference returns a managed one"
      - "getReference issues the SELECT immediately while find defers it lazily"
      - "They are identical aliases that compile to the same generated SQL"
      - "find issues a SELECT immediately and returns null if missing; getReference returns a lazy proxy with no SELECT until touched"
    answer: 3
    explanation: |
      find eagerly SELECTs (or hits the cache) and returns null for a missing row.
      getReference returns a proxy, deferring the SELECT until a non-id property is
      accessed, and throws EntityNotFoundException then if the row is absent.
    ref: "concepts.md#find-and-getreference-loading-as-managed"

  - id: entity-lifecycle-states-010
    difficulty: intermediate
    tags: [find, null, errors]
    question: |
      You call `em.find(Order.class, 999L)` for an id that does not exist. What do you get?
    options:
      - "null"
      - "An EntityNotFoundException"
      - "A lazy proxy"
      - "A transient Order instance"
    answer: 0
    explanation: |
      find returns null when no matching row exists. It is getReference (and its proxy)
      that throws EntityNotFoundException — and only when the proxy is first dereferenced.
    ref: "concepts.md#find-and-getreference-loading-as-managed"

  - id: entity-lifecycle-states-011
    difficulty: advanced
    tags: [merge, mechanism, sql]
    question: |
      When you `em.merge(detached)` and no entity with that id is currently managed in the
      context, what does Hibernate typically do first?
    options:
      - "Immediately issues a blind UPDATE of all columns without any prior read"
      - "Throws an IllegalArgumentException because the argument is not currently managed"
      - "Converts the detached instance in place to managed, emitting no SQL at all"
      - "Loads the entity by id (a SELECT) to create a managed instance, then copies the detached state into it"
    answer: 3
    explanation: |
      merge must obtain a managed instance. If none is in the context, it loads by id
      (SELECT, unless cached) to get one, then copies the detached field values in. This
      hidden SELECT is why merging in tight loops is a performance trap.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-012
    difficulty: intermediate
    tags: [persist, merge, comparison]
    question: |
      Which statement about persist versus merge is correct?
    options:
      - "Both return a managed copy of the argument and leave the original detached"
      - "persist returns void and makes the ARGUMENT managed; merge RETURNS a managed copy and leaves the argument detached"
      - "persist is only for detached entities while merge is only for transient ones"
      - "Neither cascades to associated entities regardless of the CascadeType"
    answer: 1
    explanation: |
      persist returns void and transitions the passed transient instance to managed. merge
      returns a (usually different) managed instance and does not change the argument's
      state. Both cascade along their respective cascade types.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"

  - id: entity-lifecycle-states-013
    difficulty: advanced
    tags: [persist, identity, sql, mechanism]
    question: |
      With `@GeneratedValue(strategy = GenerationType.IDENTITY)`, when is the INSERT most
      commonly issued relative to `em.persist(e)`?
    options:
      - "Immediately, because Hibernate must run the INSERT to obtain the DB-generated key"
      - "Always deferred to commit and JDBC-batched together with every other pending insert"
      - "Never at persist time — IDENTITY entities are only ever inserted by a later merge call"
      - "Only after em.flush() is invoked manually, since IDENTITY suppresses auto-flush"
    answer: 0
    explanation: |
      IDENTITY keys are assigned by the database on INSERT, so Hibernate cannot know the id
      without executing the INSERT immediately. This also disables JDBC batch inserts for
      such entities. SEQUENCE/TABLE can pre-allocate ids and defer/batch.
    ref: "concepts.md#persist-transient-to-managed"

  - id: entity-lifecycle-states-014
    difficulty: intermediate
    tags: [clear, detached, transitions]
    question: |
      What does `em.clear()` do to the entities currently in the persistence context?
    options:
      - "Flushes and commits them, ending the current transaction"
      - "Deletes them from the database with a batched DELETE per entity"
      - "Refreshes all of them from the database, reloading current values"
      - "Detaches all of them, discarding un-flushed changes"
    answer: 3
    explanation: |
      clear() empties the persistence context (first-level cache): every managed entity
      becomes detached and any pending, un-flushed changes are lost. flush() first if you
      want them persisted.
    ref: "concepts.md#remove-detach-clear-refresh-and-close"

  - id: entity-lifecycle-states-015
    difficulty: advanced
    tags: [refresh, mechanism, sql]
    question: |
      You modify a managed entity's fields in memory (not yet flushed) and then call
      `em.refresh(entity)`. What happens?
    options:
      - "Your changes are flushed as an UPDATE first, then the row is re-read on top of them"
      - "A SELECT re-reads the DB values and overwrites your in-memory changes, discarding them"
      - "The entity is evicted and becomes detached, keeping your in-memory edits"
      - "Nothing happens — refresh is treated as a no-op on any dirty managed entity"
    answer: 1
    explanation: |
      refresh pulls the current database state into the managed object, throwing away any
      un-flushed in-memory modifications. It is the mirror image of dirty checking and
      requires a managed entity.
    ref: "concepts.md#remove-detach-clear-refresh-and-close"

  - id: entity-lifecycle-states-016
    difficulty: intermediate
    tags: [transient, detached, comparison]
    question: |
      Both transient and detached entities are "unmanaged." What distinguishes them?
    options:
      - "A transient entity has no DB row and usually no PK; a detached entity corresponds to a row and carries its PK, but is untracked"
      - "Transient entities are strictly read-only while detached entities remain writable"
      - "Detached entities cannot be garbage-collected until the session that loaded them closes"
      - "There is no real difference; the two terms are interchangeable synonyms"
    answer: 0
    explanation: |
      Neither is tracked, but a transient entity was never persisted (no row, no generated
      id) while a detached entity was managed before (it has a PK and a corresponding row),
      it just lost its association to a context.
    ref: "concepts.md#detached"

  - id: entity-lifecycle-states-017
    difficulty: advanced
    tags: [spring-data, save, merge, gotcha]
    question: |
      In Spring Data JPA, what does `SimpleJpaRepository.save(entity)` do for an entity
      that is NOT new (has an existing id)?
    options:
      - "Calls em.persist(entity) and returns the same argument instance"
      - "Calls the legacy session.saveOrUpdate(entity) to re-attach it in place"
      - "Calls em.merge(entity) and returns the managed result"
      - "Throws EntityExistsException because the id already exists in the table"
    answer: 2
    explanation: |
      save() checks isNew(): if new it calls persist, otherwise it calls merge and returns
      the merged (managed) instance. So for existing entities save is merge — you must use
      the returned value.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"

  - id: entity-lifecycle-states-018
    difficulty: advanced
    tags: [hibernate6, deprecation, api]
    question: |
      Which native Hibernate Session methods were deprecated in Hibernate 6+ in favor of
      the JPA-standard operations?
    options:
      - "persist, find, getReference"
      - "flush, clear, close"
      - "save, update, saveOrUpdate"
      - "createQuery, createNativeQuery"
    answer: 2
    explanation: |
      Hibernate 6/7 deprecated the legacy save, update, saveOrUpdate (and saveOrUpdateCopy,
      Session.load) in favor of the JPA operations persist, merge, find, getReference.
      Modern code should use the JPA methods.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"

  - id: entity-lifecycle-states-019
    difficulty: intermediate
    tags: [first-level-cache, identity, mechanism]
    question: |
      Within one persistence context you call `em.find(Order.class, 1L)` twice. How many
      SELECTs run and what is the relationship between the two returned objects?
    options:
      - "Two SELECTs run, returning two entirely distinct object instances"
      - "One SELECT; the second call returns the same object reference (==) from the context"
      - "Two SELECTs run, yet both calls hand back the very same object reference"
      - "Zero SELECTs run because both calls return uninitialized lazy proxies"
    answer: 1
    explanation: |
      The persistence context is a mandatory first-level cache. The first find SELECTs and
      caches the entity by id; the second find returns the identical reference with no SQL.
      The identity (==) guarantee holds within a single context.
    ref: "concepts.md#the-persistence-context-as-first-level-cache"

  - id: entity-lifecycle-states-020
    difficulty: advanced
    tags: [equals-hashcode, identity, gotcha]
    question: |
      Why is basing an entity's equals/hashCode on a database-GENERATED id considered
      dangerous?
    options:
      - "Database-generated ids are always negative, so they collide in the hashCode buckets and silently corrupt every HashSet that stores the entity"
      - "Hibernate strictly forbids overriding equals or hashCode on a mapped entity and throws a MappingException during bootstrap if you attempt it"
      - "Keying equals on the generated id quietly enrolls the entity in the second-level cache, which then hands stale shared copies to other sessions"
      - "The id is null while transient and only set after persist, so the hashCode changes across the transient to managed transition, breaking HashSet membership"
    answer: 3
    explanation: |
      A generated id is null before persist. If hashCode depends on it, adding the entity
      to a HashSet while transient and then persisting changes its hashCode, so it can no
      longer be located — corrupting sets and bidirectional associations. Prefer a stable
      natural/business key.
    ref: "concepts.md#equals-and-hashcode-for-entities"

  - id: entity-lifecycle-states-021
    difficulty: beginner
    tags: [detach, transitions]
    question: |
      Which operation detaches a SINGLE entity from the persistence context without
      affecting the others?
    options:
      - "em.clear()"
      - "em.detach(entity)"
      - "em.remove(entity)"
      - "em.flush()"
    answer: 1
    explanation: |
      detach(entity) evicts just that one entity (managed to detached). clear() detaches
      everything; remove schedules a delete; flush synchronizes changes without changing
      state.
    ref: "concepts.md#remove-detach-clear-refresh-and-close"

  - id: entity-lifecycle-states-022
    difficulty: intermediate
    tags: [close, detached, spring]
    question: |
      What happens to all managed entities when the EntityManager / persistence context is
      closed?
    options:
      - "They are deleted"
      - "They all become detached"
      - "They are automatically merged into a global cache"
      - "They remain managed until garbage-collected"
    answer: 1
    explanation: |
      Closing the context ends management of every entity it held; they all become
      detached. This is exactly why entities returned from a committed Spring transaction
      are detached in the web layer.
    ref: "concepts.md#detached"

  - id: entity-lifecycle-states-023
    difficulty: advanced
    tags: [lazy, lazyinitializationexception, detached]
    question: |
      A detached entity has an uninitialized lazy `@OneToMany` collection. The view layer
      iterates it. What is the typical result and why?
    options:
      - "The collection loads fine because Hibernate transparently reopens the original session for it"
      - "An empty collection is returned silently because Hibernate treats a detached lazy bag as size zero"
      - "The entity is automatically re-attached to a new session so the collection initializes on access"
      - "LazyInitializationException, because there is no open persistence context/session to run the SELECT"
    answer: 3
    explanation: |
      Lazy loading needs an open session. On a detached entity the proxy/collection cannot
      be initialized, producing LazyInitializationException. Fixes (JOIN FETCH, entity
      graphs, initializing in the tx) are covered in fetching-lazy-eager-n-plus-one.
    ref: "concepts.md#detached"

  - id: entity-lifecycle-states-024
    difficulty: intermediate
    tags: [persist, managed, no-op]
    question: |
      What happens if you call `em.persist(e)` on an entity that is ALREADY managed?
    options:
      - "It is essentially a no-op (the entity stays managed)"
      - "It throws an EntityExistsException for the duplicate id"
      - "It duplicates the row via a second scheduled INSERT"
      - "It detaches then re-persists the entity"
    answer: 0
    explanation: |
      persist on an already-managed entity has no additional effect. It is calling persist
      on a DETACHED entity that is illegal (EntityExistsException / IllegalArgumentException) —
      use merge for detached instances.
    ref: "concepts.md#persist-transient-to-managed"

  - id: entity-lifecycle-states-025
    difficulty: expert
    tags: [removed, re-persist, spec]
    question: |
      After `em.remove(e)` but BEFORE flush, you call `em.persist(e)` on the same entity.
      Per the JPA spec, what is the result?
    options:
      - "The scheduled delete is cancelled and the entity becomes managed again"
      - "An IllegalStateException is thrown for re-persisting it"
      - "Both a DELETE and a subsequent INSERT are issued at flush"
      - "The entity is evicted from the context and left detached"
    answer: 0
    explanation: |
      The spec states that a removed instance re-persisted before flush becomes managed
      again, cancelling the scheduled deletion. Between remove and flush it is still a live
      object in the context.
    ref: "concepts.md#removed"

  - id: entity-lifecycle-states-026
    difficulty: intermediate
    tags: [merge, transient, behavior]
    question: |
      You call `em.merge(e)` on a TRANSIENT entity (no id). How does merge behave?
    options:
      - "It throws because merge requires an existing row"
      - "It silently does nothing since there is no row to load"
      - "It behaves like persist on a fresh managed copy and returns it"
      - "It marks the entity as removed and schedules a DELETE"
    answer: 2
    explanation: |
      For a transient argument, merge creates a new managed instance (effectively a
      persist) and returns it. merge thus works for both detached and transient inputs,
      unlike persist which is for transient only.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-027
    difficulty: intermediate
    tags: [getreference, proxy, fk]
    question: |
      Why might you use `em.getReference(Parent.class, parentId)` when setting a child's
      parent association before saving the child?
    options:
      - "To set the foreign key without issuing a SELECT to load the full parent row"
      - "To force an eager SELECT that loads the entire parent row"
      - "Because find() cannot legally be called inside a transaction"
      - "To detach the parent entity from the persistence context"
    answer: 0
    explanation: |
      getReference returns a proxy carrying just the id, enough to write the FK on the
      child's INSERT, avoiding a wasteful SELECT of the parent you never otherwise touch.
    ref: "concepts.md#find-and-getreference-loading-as-managed"

  - id: entity-lifecycle-states-028
    difficulty: advanced
    tags: [spring-data, isnew, assigned-id, gotcha]
    question: |
      A Spring Data entity uses an application-ASSIGNED id (not generated). You call
      save() for a brand-new row. What inefficiency can occur and why?
    options:
      - "save skips the INSERT entirely and instead only ever performs an UPDATE statement"
      - "save always throws an EntityExistsException whenever the id is application-assigned"
      - "isNew() sees a non-null id, so save calls merge — which issues a pre-SELECT to check for an existing row"
      - "save deletes any existing row first and then re-inserts it under the assigned id"
    answer: 2
    explanation: |
      The default isNew() is 'id is null'. With an assigned id set before save, isNew()
      returns false, so save calls merge, which does a load-by-id SELECT first. Implement
      Persistable#isNew() or use @Version/auditing to fix.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"

  - id: entity-lifecycle-states-029
    difficulty: beginner
    tags: [managed, query, states]
    question: |
      In what state are entities returned in the result list of a JPQL query
      (`em.createQuery(...).getResultList()`)?
    options:
      - "Managed"
      - "Transient"
      - "Detached"
      - "Removed"
    answer: 0
    explanation: |
      Query results are managed: they are placed in the persistence context and are
      dirty-checked like any other managed entity. Modifying them and committing issues
      UPDATEs.
    ref: "concepts.md#managed-persistent"

  - id: entity-lifecycle-states-030
    difficulty: intermediate
    tags: [flush, states, mechanism]
    question: |
      Does calling `em.flush()` change an entity's lifecycle state?
    options:
      - "Yes — it detaches every managed entity after writing their changes"
      - "No — flush synchronizes pending changes to the DB; entities keep their current state"
      - "Yes — it promotes every transient entity in scope to the managed state"
      - "Yes — it converts every managed entity into the removed state at flush"
    answer: 1
    explanation: |
      flush pushes queued INSERT/UPDATE/DELETE statements to the database but does not
      change lifecycle states: managed stays managed, removed stays removed (now deleted in
      the DB but still tracked until commit).
    ref: "concepts.md#remove-detach-clear-refresh-and-close"

  - id: entity-lifecycle-states-031
    difficulty: advanced
    tags: [merge, cascade, associations]
    question: |
      When you `em.merge(parent)`, what determines whether the merge propagates to the
      parent's child associations?
    options:
      - "Only associations mapped with cascade = MERGE (or ALL) are merged"
      - "It always cascades the merge to every associated entity"
      - "It never cascades the merge to any child association"
      - "Only associations mapped with fetch = EAGER are merged"
    answer: 0
    explanation: |
      Cascade behavior is per-association: merge propagates only across associations
      declared with CascadeType.MERGE (or ALL). Fetch type (lazy/eager) is orthogonal to
      cascade. See cascade-types-orphan-removal.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-032
    difficulty: intermediate
    tags: [detached, merge, workflow]
    question: |
      You loaded an entity in a previous transaction (now detached), changed a field, and
      want the change persisted. What is the correct JPA-portable approach?
    options:
      - "Call `entity = em.merge(entity)` in a new transaction and use the returned instance"
      - "Call em.persist(entity) inside a fresh transaction to re-save it"
      - "Call em.refresh(entity) so the change is written back to the row"
      - "Just call a setter — dirty checking handles detached entities"
    answer: 0
    explanation: |
      persist would throw for a detached entity; refresh would discard the change; setters
      do nothing off-context. merge re-associates the state into a managed copy that gets
      dirty-checked, and you should keep the returned reference.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-033
    difficulty: expert
    tags: [batch, detach, clear, performance]
    question: |
      In a bulk insert of a million rows, why do experienced developers periodically call
      `em.flush(); em.clear();`?
    options:
      - "To commit each processed batch within its own separate database transaction for durability"
      - "To force the database into assigning IDENTITY-generated primary keys during the load"
      - "To bound the first-level cache size and keep dirty checking cheap by detaching already-flushed entities"
      - "To disable the shared second-level cache entirely for the duration of the import"
    answer: 2
    explanation: |
      Without clearing, every persisted entity accumulates in the persistence context,
      growing memory and making dirty checking scan an ever-larger set. flush then clear
      writes the batch and detaches it, keeping the context small. See
      performance-tuning-pitfalls.
    ref: "concepts.md#remove-detach-clear-refresh-and-close"

  - id: entity-lifecycle-states-034
    difficulty: beginner
    tags: [transient, java-keyword, gotcha]
    question: |
      The JPA "transient" lifecycle state is the same concept as the Java `transient`
      keyword. True or false?
    options:
      - "True — both the state and the keyword mean the entity or field is excluded from persistence"
      - "True — the Java transient keyword is required in order to mark new entity instances as such"
      - "False — the JPA transient term actually refers to entities that have been detached from a context"
      - "False — the JPA state means 'not yet associated with a context'; the Java keyword excludes a field from serialization"
    answer: 3
    explanation: |
      They are unrelated despite the shared word. The lifecycle state describes an object
      with no persistence-context association; the Java keyword controls Java
      serialization of a field.
    ref: "concepts.md#transient-new"

  - id: entity-lifecycle-states-035
    difficulty: intermediate
    tags: [merge, identity, mechanism]
    question: |
      After `Order managed = em.merge(detached);` in the common detached case, what is true
      about object identity?
    options:
      - "managed == detached, the exact same instance is returned"
      - "Both variables end up pointing at a proxy of one another"
      - "detached is reset to null after the merge returns"
      - "managed != detached — they are different object references"
    answer: 3
    explanation: |
      In the detached case merge returns a different managed instance, so managed !=
      detached. Only if the detached instance happened to already be the managed one in the
      context would they coincide (uncommon).
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-036
    difficulty: advanced
    tags: [refresh, errors, mechanism]
    question: |
      What does `em.refresh(entity)` do if the underlying row was deleted by another
      transaction?
    options:
      - "Silently re-inserts the row"
      - "Returns without changes"
      - "Marks the entity transient"
      - "Throws EntityNotFoundException"
    answer: 3
    explanation: |
      refresh re-reads the row; if it no longer exists it throws EntityNotFoundException.
      refresh also requires a managed argument (IllegalArgumentException otherwise).
    ref: "concepts.md#remove-detach-clear-refresh-and-close"

  - id: entity-lifecycle-states-037
    difficulty: intermediate
    tags: [persist, void, return]
    question: |
      What does `em.persist(entity)` return?
    options:
      - "The now-managed entity instance, exactly the way merge hands one back"
      - "The database-generated primary key value returned as a Long"
      - "void — it mutates the passed instance to managed"
      - "A boolean flag that is true when the underlying INSERT succeeded"
    answer: 2
    explanation: |
      persist returns void; it makes the argument itself managed (and populates its
      generated id). Contrast with merge, which returns a managed copy, and Hibernate's
      legacy save, which returned the generated id.
    ref: "concepts.md#persist-transient-to-managed"

  - id: entity-lifecycle-states-038
    difficulty: intermediate
    tags: [identity, two-contexts, gotcha]
    question: |
      The same DB row is loaded in two separate EntityManagers. What is the relationship of
      the two resulting managed objects?
    options:
      - "They are the same reference (== true) because Hibernate keeps one shared instance per row across every context"
      - "They are two distinct objects; the == identity guarantee holds only within a single context"
      - "The second load throws a NonUniqueObjectException because that row is already managed in the other EntityManager"
      - "Both objects come back already detached, since a row loaded in two contexts can belong to neither one"
    answer: 1
    explanation: |
      The first-level cache identity guarantee is per persistence context. Two contexts
      produce two independent managed instances for the same row; == is not guaranteed
      across them.
    ref: "concepts.md#the-persistence-context-as-first-level-cache"

  - id: entity-lifecycle-states-039
    difficulty: advanced
    tags: [equals-hashcode, lombok, gotcha]
    question: |
      Why is putting Lombok's `@Data` on a JPA entity discouraged?
    options:
      - "Lombok's annotation processor cannot run against jakarta.persistence types and aborts the build with a MappingException before any entity class is ever mapped"
      - "It marks every mapped field final, which stops Hibernate's no-arg constructor and runtime proxy generation from ever instantiating the entity"
      - "It generates id-based, association-traversing equals/hashCode/toString that break across the transient to managed transition and can trigger LazyInitializationException or infinite recursion"
      - "It silently rewrites every association to fetch = EAGER, defeating lazy loading and pulling the whole object graph into memory on a single find"
    answer: 2
    explanation: |
      @Data generates equals/hashCode over all fields (including generated id and
      bidirectional associations) and a toString that traverses them, causing broken
      HashSet semantics, lazy-loading exceptions, and recursion. Prefer hand-written,
      natural-key-based equals/hashCode.
    ref: "concepts.md#equals-and-hashcode-for-entities"

  - id: entity-lifecycle-states-040
    difficulty: intermediate
    tags: [spring-data, save, return-value, gotcha]
    question: |
      A developer reports "I called `repository.save(order)` but later changes to `order`
      weren't saved." What is the most likely explanation?
    options:
      - "The save call silently failed and swallowed its exception, so the row was never actually written"
      - "save requires a @Modifying annotation on the repository method before it will flush any pending changes"
      - "The entity's id field is missing the @Transient annotation Spring Data needs to keep tracking it"
      - "After the transaction, the argument/returned entity is detached, so later mutations aren't dirty-checked"
    answer: 3
    explanation: |
      save (merge) returns a managed instance only for the duration of the transaction.
      Once it commits, the entity is detached and further mutations are not flushed. Keep
      work in one transaction on the managed instance, or save again.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"

  - id: entity-lifecycle-states-041
    difficulty: beginner
    tags: [states, removed, definition]
    question: |
      An entity that has been passed to remove() but not yet flushed is in which state?
    options:
      - "Detached"
      - "Transient"
      - "Removed"
      - "Managed"
    answer: 2
    explanation: |
      It is in the REMOVED state: still associated with the context and still corresponding
      to a row, but scheduled for DELETE at the next flush.
    ref: "concepts.md#removed"

  - id: entity-lifecycle-states-042
    difficulty: advanced
    tags: [getreference, entitynotfoundexception, timing]
    question: |
      With `Order p = em.getReference(Order.class, 5L);` where id 5 does NOT exist, when is
      the error raised?
    options:
      - "At the getReference call itself, which eagerly runs the SELECT to validate that the id exists"
      - "At transaction commit only, when the context flushes and finally validates every outstanding proxy"
      - "Never — getReference just returns null whenever the requested id has no matching row"
      - "When a non-id property of the proxy is first accessed, as EntityNotFoundException"
    answer: 3
    explanation: |
      getReference returns a proxy without hitting the DB. The SELECT (and thus
      EntityNotFoundException for a missing row) is deferred until you dereference a
      non-identifier property.
    ref: "concepts.md#find-and-getreference-loading-as-managed"

  - id: entity-lifecycle-states-043
    difficulty: intermediate
    tags: [transitions, mapping]
    question: |
      Which mapping correctly pairs an operation with its state transition?
    options:
      - "persist: transient to managed"
      - "detach: transient to managed"
      - "merge: managed to removed"
      - "refresh: managed to detached"
    answer: 0
    explanation: |
      persist takes a transient entity to managed. detach takes managed to detached; merge
      takes detached to a managed copy; remove takes managed to removed; refresh keeps it
      managed (reloading from the DB).
    ref: "concepts.md#the-four-entity-states"

  - id: entity-lifecycle-states-044
    difficulty: expert
    tags: [merge, second-level-cache, sql, mechanism]
    question: |
      You merge 10,000 detached entities one by one in a loop. Ignoring cascade, what is
      the dominant hidden cost, absent caching?
    options:
      - "10,000 extra DELETE statements, one issued to purge the stale row before each row is re-written"
      - "A load-by-id SELECT per merge to obtain a managed instance before copying state"
      - "A full unindexed table scan per merge to locate the matching row by its business key"
      - "Nothing measurable — merge copies fields purely in memory and never reads from the database"
    answer: 1
    explanation: |
      Each merge for a not-currently-managed id triggers a SELECT to fetch/attach the
      managed instance, then copies the detached state. In a loop that is 10,000 SELECTs
      plus the UPDATEs. Prefer loading managed entities and mutating, or batch strategies.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-045
    difficulty: intermediate
    tags: [remove, transient, no-op]
    question: |
      What happens if you call `em.remove(e)` on a TRANSIENT entity?
    options:
      - "Effectively nothing meaningful — there is no row to delete (spec treats a new instance as ignored)"
      - "It throws EntityExistsException because remove rejects any instance that lacks a persistent row"
      - "It first INSERTs the transient row and then immediately schedules a DELETE of it at flush"
      - "It transitions the transient instance straight into the detached state and clears its context"
    answer: 0
    explanation: |
      There is no persistent row behind a transient instance, so removing it has no
      database effect. (Passing a detached instance, by contrast, throws
      IllegalArgumentException.)
    ref: "concepts.md#removed"

  - id: entity-lifecycle-states-046
    difficulty: advanced
    tags: [namespace, jakarta, versions]
    question: |
      In Hibernate 6/7 and Jakarta Persistence 3.x, which package do the entity lifecycle
      annotations and EntityManager live in?
    options:
      - "javax.persistence"
      - "jakarta.persistence"
      - "org.hibernate.jpa"
      - "javax.jpa"
    answer: 1
    explanation: |
      Since Jakarta EE 9 the namespace moved from javax.persistence to jakarta.persistence.
      Hibernate 6+ targets the jakarta.* namespace. Legacy javax.persistence is Jakarta
      Persistence 2.2 and earlier. See hibernate-6-7-and-jakarta-migration.
    ref: "concepts.md#the-four-entity-states"

  - id: entity-lifecycle-states-047
    difficulty: intermediate
    tags: [managed, cascade, lazy]
    question: |
      Why does lazy-association loading work on a managed entity but fail on a detached one?
    options:
      - "Managed entities always have every association eagerly fetched, so no deferred load is ever needed"
      - "A managed entity has an open persistence context/session available to run the deferred SELECT; a detached one does not"
      - "Detaching an entity strips all of its lazy proxies and replaces them with plain empty collections"
      - "Lazy loading is switched off for detached entities by a default configuration flag Hibernate sets on eviction"
    answer: 1
    explanation: |
      Lazy initialization needs a live session to execute the SELECT. While managed, the
      context is open; once detached, there is no session, so touching an uninitialized
      lazy association throws LazyInitializationException.
    ref: "concepts.md#managed-persistent"

  - id: entity-lifecycle-states-048
    difficulty: expert
    tags: [snapshot, dirty-checking, mechanism]
    question: |
      Dirty checking on flush compares each managed entity's current field values against
      what?
    options:
      - "The values currently in the database, read back via a fresh SELECT issued per entity at flush time"
      - "A precomputed hash of the entity's columns that is kept and looked up in the second-level cache"
      - "The loaded-state snapshot the context captured when the entity was loaded or attached"
      - "The values recorded during the previous flush of a different entity of the same mapped type"
    answer: 2
    explanation: |
      The persistence context keeps a snapshot of each managed entity's state at
      load/attach time. At flush it diffs current values against that snapshot to decide
      which columns changed and emit UPDATEs — no extra SELECT is needed. Detail in
      transactions-dirty-checking-flushing.
    ref: "concepts.md#managed-persistent"

  - id: entity-lifecycle-states-049
    difficulty: advanced
    tags: [persist, sequence, batch, mechanism]
    question: |
      With SEQUENCE generation, why can Hibernate defer and batch INSERTs for persisted
      entities in a way it cannot with IDENTITY?
    options:
      - "SEQUENCE-keyed entities are never actually inserted; the sequence row itself stores their data"
      - "Hibernate can pre-allocate ids from the sequence without running the INSERT, so inserts can be queued and batched at flush"
      - "SEQUENCE forces an immediate unbatched insert too, exactly like IDENTITY, so there is no real difference"
      - "IDENTITY routes every insert through a separate dedicated connection pool that disallows JDBC batching"
    answer: 1
    explanation: |
      A sequence yields the next id via a separate call, so Hibernate can assign ids up
      front and defer/batch the INSERTs to flush. IDENTITY only yields the key as a
      side-effect of the INSERT, forcing an immediate, unbatched INSERT. See
      primary-keys-and-id-generation.
    ref: "concepts.md#persist-transient-to-managed"

  - id: entity-lifecycle-states-050
    difficulty: intermediate
    tags: [evict, hibernate-native, detach]
    question: |
      The Hibernate-native `session.evict(entity)` is equivalent to which JPA operation?
    options:
      - "em.remove(entity)"
      - "em.refresh(entity)"
      - "em.detach(entity)"
      - "em.persist(entity)"
    answer: 2
    explanation: |
      evict removes a single entity from the persistence context, making it detached — the
      same effect as JPA's detach. clear() is the bulk equivalent (evict all).
    ref: "concepts.md#detached"

  - id: entity-lifecycle-states-051
    difficulty: beginner
    tags: [transitions, merge, direction]
    question: |
      Which transition does merge primarily serve?
    options:
      - "Managed to removed, scheduling the row for deletion at the next flush"
      - "Transient to managed, associating a brand-new instance with the context"
      - "Detached to managed (via a returned managed copy)"
      - "Managed to detached, evicting the instance so it is no longer tracked"
    answer: 2
    explanation: |
      merge's core purpose is re-associating a detached entity: it copies its state into a
      managed instance and returns that instance. persist handles transient to managed;
      detach/clear/close handle managed to detached.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-052
    difficulty: advanced
    tags: [scenario, workflow, judgment]
    question: |
      A REST endpoint receives a JSON Order (deserialized POJO with an existing id) and
      must update the DB. Which is the cleanest JPA-portable persistence call?
    options:
      - "em.persist(order) — it carries a known id, so persist will simply re-attach and update it"
      - "em.refresh(order) to sync the incoming JSON field values down into the matching database row"
      - "em.getReference(Order.class, order.getId()) and discard the deserialized order object entirely"
      - "order = em.merge(order) inside a transaction, using the returned managed instance"
    answer: 3
    explanation: |
      The deserialized object is effectively detached (has id + state, no context). merge
      copies its state onto a managed instance and returns it for dirty checking. persist
      would throw; refresh discards the incoming changes; getReference alone ignores the
      new field values.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-053
    difficulty: intermediate
    tags: [states, summary, judgment]
    question: |
      Which single statement about the lifecycle is FALSE?
    options:
      - "Only managed entities are dirty-checked and auto-flushed"
      - "A detached entity retains its primary key"
      - "remove schedules a DELETE at flush, not immediately"
      - "merge makes the passed-in argument managed"
    answer: 3
    explanation: |
      merge does NOT make the argument managed — it returns a separate managed copy. The
      other three statements are true and are the crux of the lifecycle model.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"

  - id: entity-lifecycle-states-054
    difficulty: expert
    tags: [nonuniqueobjectexception, update, merge, re-attachment]
    question: |
      The context already holds a managed `Order#1` (from an earlier `find`). You then call
      the legacy `session.update(detachedOrder1)` on a DIFFERENT object with the same id.
      What happens, and why does `merge` avoid it?
    options:
      - "NonUniqueObjectException — update tries to attach a second instance of that identity, while merge copies state into the existing managed instance"
      - "Nothing — update quietly evicts the first managed instance and installs the passed object as the new one for that identity"
      - "OptimisticLockException, because the two objects share the same id and version and update treats that as a concurrent-modification collision"
      - "The second object is inserted as a brand-new row under a freshly generated id, leaving the original row untouched"
    answer: 0
    explanation: |
      The context guarantees one managed instance per type+id. update/saveOrUpdate try to
      make the passed object THE managed one, but that slot is taken -> NonUniqueObjectException.
      merge never attaches the passed object; it copies its state into the already-managed
      instance, so there is no collision.
    ref: "concepts.md#nonuniqueobjectexception-and-re-attachment-collisions"

  - id: entity-lifecycle-states-055
    difficulty: expert
    tags: [optimistic-lock, version, merge, sql]
    question: |
      You merge a detached entity carrying `@Version` = 3, but another transaction already
      bumped the DB row to version 4. Predict the flush SQL and the outcome.
    options:
      - "UPDATE ... where id=? (no version clause); the change silently overwrites version 4"
      - "A SELECT ... FOR UPDATE that blocks until the other tx releases the lock"
      - "UPDATE ... where id=? and version=3 matches 0 rows -> OptimisticLockException"
      - "No SQL — merge detects the mismatch and returns the DB copy unchanged"
    answer: 2
    explanation: |
      Versioned updates are guarded by `where id=? and version=?` using the stale version you
      carried. Since the DB is now version 4, zero rows match; Hibernate sees rowCount==0 and
      throws OptimisticLockException / StaleObjectStateException. No row lock is held — the
      check lives entirely in the WHERE clause.
    ref: "concepts.md#optimistic-locking-when-merging-a-stale-version"

  - id: entity-lifecycle-states-056
    difficulty: advanced
    tags: [version, wrapper, isnew, mechanism]
    question: |
      Why do Hibernate experts recommend a `Long` (wrapper) `@Version` field rather than a
      primitive `long`?
    options:
      - "A primitive long version field cannot be mapped to a SQL version column at all, so Hibernate refuses to bootstrap the entity"
      - "A null Long is an unambiguous 'transient/new' signal; a primitive long defaults to 0, a valid version that defeats the new-vs-detached heuristic"
      - "Wrapper Long versions are incremented atomically by the JVM while primitive long increments are not thread-safe, corrupting the count"
      - "A primitive long version silently disables optimistic locking entirely, so Hibernate never adds the version predicate to the UPDATE"
    answer: 1
    explanation: |
      merge and Spring Data isNew() use a null version to mean 'this instance is new'. A
      primitive long defaults to 0 — a legitimate version value — so a genuinely new entity
      looks like an existing detached one, causing a wasteful pre-SELECT/merge path.
    ref: "concepts.md#optimistic-locking-when-merging-a-stale-version"

  - id: entity-lifecycle-states-057
    difficulty: expert
    tags: [statelesssession, dirty-checking, bulk]
    question: |
      Which statement about Hibernate's `StatelessSession` is correct?
    options:
      - "It shares the same first-level cache and identity map as the regular Session, so entities loaded through either are deduplicated"
      - "It dirty-checks entities against a load-time snapshot and auto-flushes every pending change on transaction commit, exactly like Session"
      - "It automatically cascades persist and merge to mapped associations, walking the whole object graph just as the stateful Session does"
      - "It has no persistence context, no dirty checking, and no cascades — you must call update() explicitly and it fires immediate SQL"
    answer: 3
    explanation: |
      StatelessSession deliberately drops the lifecycle machinery: no L1 cache/identity, no
      dirty checking, no cascades, no lifecycle callbacks/interceptors, ignores collections.
      Its entities are effectively always detached and each operation is immediate SQL — ideal
      for constant-memory bulk streaming.
    ref: "concepts.md#statelesssession-a-no-lifecycle-api"

  - id: entity-lifecycle-states-058
    difficulty: expert
    tags: [statelesssession, update, mechanism]
    question: |
      With a `StatelessSession`, you load an entity via `ss.get(...)`, change a field, and
      commit WITHOUT calling `ss.update(...)`. What is persisted?
    options:
      - "Nothing — StatelessSession has no dirty checking, so the change is never written"
      - "The change is persisted via automatic snapshot-based dirty checking at commit, just as a normal Session would flush it"
      - "The change is persisted, but only after you invoke ss.flush() to push the queued update to the database explicitly"
      - "A NonUniqueObjectException is thrown at commit because the loaded row is already tracked under that identity in the session"
    answer: 0
    explanation: |
      StatelessSession does not track or dirty-check entities. Without an explicit ss.update()
      the modification is silently lost. (And ss.update() ALWAYS issues an UPDATE, since there
      is no snapshot to compare against.)
    ref: "concepts.md#statelesssession-a-no-lifecycle-api"

  - id: entity-lifecycle-states-059
    difficulty: expert
    tags: [bulk-insert, statelesssession, flush-clear, judgment]
    question: |
      You must import 1,000,000 rows in one job without exhausting heap. Which two
      approaches are the standard, correct choices?
    options:
      - "Load all one million rows into the persistence context first, then issue a single commit so everything flushes together at the end"
      - "Use a StatelessSession, OR use a regular session and flush()+clear() every N rows"
      - "Set the shared second-level cache to an unlimited region size and rely on its background eviction to reclaim heap as the job runs"
      - "Use em.merge() in a tight loop with EAGER fetching so each row and its graph are attached and written in a single managed pass"
    answer: 1
    explanation: |
      Both bound memory. StatelessSession has no L1 cache to grow. On a regular session,
      flush()+clear() every N writes the batch then detaches it, keeping the context small so
      dirty checking stays cheap. Accumulating a million managed entities OOMs and slows dirty
      checking to a crawl.
    ref: "concepts.md#statelesssession-a-no-lifecycle-api"

  - id: entity-lifecycle-states-060
    difficulty: expert
    tags: [upsert, hibernate63, sql, incubating]
    question: |
      Hibernate 6.3+ adds `StatelessSession.upsert(entity)`. What does it do, and what
      happens if the entity has no id?
    options:
      - "It always issues a plain INSERT, and when the entity carries no id Hibernate auto-generates one from the configured strategy"
      - "It emits a SQL MERGE INTO (insert-or-update); with no id it throws TransientObjectException"
      - "It behaves exactly like persist, scheduling an INSERT and silently ignoring any existing row that already shares the identity"
      - "It deletes any existing row for that identity first and then re-inserts it, so a missing id simply produces a no-op delete"
    answer: 1
    explanation: |
      upsert (@Incubating since 6.3) maps to a SQL MERGE INTO / insert-or-update keyed on the
      identity. Because it must know which row to target, it throws TransientObjectException
      when the entity carries no id. Note: upsert is a StatelessSession method — the regular
      Session interface has no upsert.
    ref: "concepts.md#hibernate-6-and-7-lifecycle-api-changes"

  - id: entity-lifecycle-states-061
    difficulty: advanced
    tags: [deprecation, update, merge, mapping]
    question: |
      Per the Hibernate 6 Session Javadoc, what is the recommended 1:1 replacement for the
      deprecated `session.update(entity)`?
    options:
      - "persist(entity)"
      - "refresh(entity)"
      - "merge(entity)"
      - "getReference(entity.getClass(), entity.getId())"
    answer: 2
    explanation: |
      update -> merge. merge re-associates a detached entity by copying its state into a
      managed instance, avoiding NonUniqueObjectException. (save -> persist; saveOrUpdate ->
      merge-or-persist; load(Class,id) -> getReference.)
    ref: "concepts.md#deprecated-session-methods-and-their-modern-replacements"

  - id: entity-lifecycle-states-062
    difficulty: expert
    tags: [update, dirty-checking, selectbeforeupdate, behavior]
    question: |
      A legacy code path calls `session.update(detached)` on an entity whose fields were
      never changed. Absent `@SelectBeforeUpdate`, what SQL runs at flush?
    options:
      - "No SQL at all — update re-attaches the entity, then snapshot dirty checking runs at flush and sees nothing changed, so it skips the write"
      - "A full UPDATE of all columns, because update re-attaches and marks the entity dirty wholesale, bypassing the field-level dirty check"
      - "Only a lightweight SELECT to verify the detached row still exists, after which update leaves the unchanged columns alone"
      - "A DELETE of the existing row followed by a fresh INSERT, because update always re-materializes a detached instance from scratch"
    answer: 1
    explanation: |
      Session.update forces an UPDATE even for unchanged entities — it bypasses snapshot dirty
      checking. Adding @SelectBeforeUpdate makes Hibernate SELECT first and compare so it can
      SKIP the UPDATE when nothing actually changed (trading a read to avoid a needless write).
    ref: "concepts.md#deprecated-session-methods-and-their-modern-replacements"

  - id: entity-lifecycle-states-063
    difficulty: advanced
    tags: [load, getreference, deprecation, nuance]
    question: |
      Regarding Hibernate 6 deprecations of `Session.load(...)`, which statement is accurate?
    options:
      - "Every load overload is deprecated and removed outright in Hibernate 6 with no JPA-standard replacement offered for any of them"
      - "load(Class, id) maps to getReference; the LockMode/LockOptions overloads map to get(...); load(Object, id) that reads state into a supplied instance is NOT deprecated"
      - "load(Class, id) maps to find(), and the LockMode/LockOptions locking overloads all map to getReference() returning a lazy proxy"
      - "load is simply renamed to fetch across every overload in Hibernate 6, keeping identical lazy-proxy semantics under the new name"
    answer: 1
    explanation: |
      The id-only load(Class,id) -> getReference (lazy proxy). The locking overloads
      (LockMode/LockOptions) -> get(...). The form that reads state into a caller-supplied
      transient instance, load(Object,id), is not deprecated.
    ref: "concepts.md#deprecated-session-methods-and-their-modern-replacements"

  - id: entity-lifecycle-states-064
    difficulty: advanced
    tags: [replicate, deprecation]
    question: |
      Which deprecated Hibernate operation has NO direct modern replacement among the JPA
      lifecycle methods?
    options:
      - "save"
      - "update"
      - "saveOrUpdate"
      - "replicate"
    answer: 3
    explanation: |
      save->persist, update->merge, saveOrUpdate->merge/persist all have replacements.
      replicate (copying a detached graph into another datastore/session with a replication
      mode) has no equivalent JPA operation — its capability was simply removed.
    ref: "concepts.md#deprecated-session-methods-and-their-modern-replacements"

  - id: entity-lifecycle-states-065
    difficulty: advanced
    tags: [cascade, lifecycle, mapping]
    question: |
      Which set of `CascadeType` values corresponds exactly to the JPA lifecycle operations
      (i.e. equals `CascadeType.ALL`)?
    options:
      - "PERSIST, MERGE, REMOVE, REFRESH, DETACH"
      - "PERSIST, MERGE, SAVE, UPDATE, DELETE"
      - "INSERT, UPDATE, DELETE, SELECT, LOCK"
      - "PERSIST, MERGE, REMOVE, LOAD, EVICT"
    answer: 0
    explanation: |
      The five JPA cascade types map 1:1 to the lifecycle ops: PERSIST, MERGE, REMOVE,
      REFRESH, DETACH; CascadeType.ALL = all five. LOCK and REPLICATE are Hibernate-native
      extras, not part of the JPA set.
    ref: "concepts.md#cascade-types-keyed-to-lifecycle-operations"

  - id: entity-lifecycle-states-066
    difficulty: advanced
    tags: [cascade, refresh, detach]
    question: |
      A parent's `@OneToMany` is mapped `cascade = {REFRESH, DETACH}`. You call
      `em.detach(parent)`. What happens to the children?
    options:
      - "Nothing happens to the children — detach never cascades across an association regardless of the CascadeType values declared on it"
      - "The children are detached from the context too, because CascadeType.DETACH propagates the detach"
      - "The children are deleted from the database, because detaching the parent orphans them and CascadeType.DETACH triggers removal"
      - "The children are refreshed from the DB, because listing REFRESH first in the cascade set makes it take precedence over DETACH"
    answer: 1
    explanation: |
      CascadeType.DETACH propagates detach across the association, so the children are evicted
      from the context as well. CascadeType.REFRESH would similarly propagate a refresh. Each
      cascade type mirrors its lifecycle operation.
    ref: "concepts.md#cascade-types-keyed-to-lifecycle-operations"

  - id: entity-lifecycle-states-067
    difficulty: intermediate
    tags: [cascade, fetch, orthogonal]
    question: |
      True or false: marking an association `fetch = EAGER` also causes `persist`/`merge` to
      cascade to it.
    options:
      - "True — declaring an association EAGER implies a full cascade of every lifecycle operation, so persist and merge always propagate to it"
      - "False — fetch type (LAZY/EAGER) is orthogonal to cascade; you must declare CascadeType explicitly"
      - "True, but only for @OneToMany associations; @ManyToOne and @OneToOne require an explicit CascadeType even when marked EAGER"
      - "False — marking an association EAGER actually disables all cascading on it, so you must switch it to LAZY for persist/merge to propagate"
    answer: 1
    explanation: |
      Fetching controls WHEN associated data is loaded; cascading controls WHICH lifecycle
      operations propagate. They are independent: an EAGER association is not auto-cascaded,
      and a cascaded association need not be eager.
    ref: "concepts.md#cascade-types-keyed-to-lifecycle-operations"

  - id: entity-lifecycle-states-068
    difficulty: expert
    tags: [merge, n-plus-one, graph, sql]
    question: |
      A detached `Order` with `@OneToMany(cascade = MERGE)` holds 100 detached line items,
      none currently in the context. How many SELECTs does `em.merge(order)` trigger before
      any UPDATE, and why?
    options:
      - "1 — merge issues a single load-by-id for the parent and then copies the whole detached child collection in memory without further reads"
      - "0 — merge never reads; it blindly copies the detached graph's state straight into the context and emits only UPDATEs at flush"
      - "Up to 101 — one load-by-id per uncached entity (parent + each child) to obtain managed instances to copy into"
      - "200 — two round-trips per child, one SELECT to check existence and a second to lock the row, before the parent is even touched"
    answer: 2
    explanation: |
      merge cascades recursively; each uncached child must be loaded by id to get a managed
      instance to copy the detached state into. That is 1 (parent) + 100 (children) = up to
      101 SELECTs — the merge N+1. Loading the managed graph via JOIN FETCH and mutating it
      avoids the storm.
    ref: "concepts.md#merging-an-entity-graph-and-the-merge-n1-trap"

  - id: entity-lifecycle-states-069
    difficulty: expert
    tags: [merge, transient-children, graph, sql]
    question: |
      You merge a detached parent whose cascaded child collection mixes children WITH ids and
      children with NO id (transient). What SQL does each kind produce?
    options:
      - "Both kinds produce an UPDATE, since merge treats every cascaded child as an existing row and rewrites its columns at flush regardless of id"
      - "Children with ids get a load-SELECT then UPDATE; id-less (transient) children are treated like persist and get INSERTed"
      - "Both kinds get INSERTed, because merge always creates a fresh managed copy for each cascaded child and lets the database assign new ids"
      - "The id-less transient children throw an IllegalArgumentException, because merge strictly requires every cascaded child to carry an id"
    answer: 1
    explanation: |
      merge on a child with an id loads it (SELECT) and copies state (UPDATE at flush). A
      child with no id is transient, so merge behaves like persist and INSERTs it. Mixed graphs
      therefore emit a mix of SELECT+UPDATE and INSERT.
    ref: "concepts.md#merging-an-entity-graph-and-the-merge-n1-trap"

  - id: entity-lifecycle-states-070
    difficulty: advanced
    tags: [identity-generation, batch, sql, performance]
    question: |
      A team sets `hibernate.jdbc.batch_size=50` but inserts of an IDENTITY-keyed entity are
      still one round-trip each. What is the cause?
    options:
      - "The hibernate.jdbc.batch_size setting only ever applies to UPDATE and DELETE statements, so INSERTs are always sent one round-trip at a time"
      - "IDENTITY generation forces an immediate INSERT to read the generated key, which disables JDBC insert batching; SEQUENCE/TABLE pre-allocate ids and can batch"
      - "The entity is missing the @DynamicInsert annotation, without which Hibernate cannot group multiple INSERTs into one JDBC batch"
      - "JDBC insert batching only works inside a StatelessSession; the ordinary Session flushes each queued INSERT individually no matter the batch_size"
    answer: 1
    explanation: |
      IDENTITY yields the key only as a side-effect of the INSERT, so Hibernate must execute
      each INSERT immediately and cannot batch them. Switch to a SEQUENCE (ideally pooled) so
      ids are pre-allocated and INSERTs batch at flush.
    ref: "concepts.md#predicting-the-generated-sql-for-each-transition"

  - id: entity-lifecycle-states-071
    difficulty: intermediate
    tags: [refresh, merge, direction, judgment]
    question: |
      Both `refresh` and `merge` re-synchronize an object with the database. What is the
      DIRECTION of data flow in each?
    options:
      - "Both push object state to the DB — refresh writes your in-memory edits as an UPDATE and merge does the same, differing only in return value"
      - "refresh pulls DB -> object (discarding in-memory edits); merge pushes object -> DB (copying your state onto a managed instance)"
      - "Both pull DB -> object — merge re-reads the row and overwrites your fields exactly as refresh does, so neither writes your edits back"
      - "refresh pushes object -> DB flushing your edits, while merge pulls DB -> object and discards them; the directions are exactly reversed"
    answer: 1
    explanation: |
      refresh overwrites the in-memory object with current DB values, throwing away unflushed
      edits (DB -> object). merge takes your (detached) object's state and copies it onto a
      managed instance so it is written back (object -> DB). Opposite directions.
    ref: "concepts.md#predicting-the-generated-sql-for-each-transition"

  - id: entity-lifecycle-states-072
    difficulty: expert
    tags: [getreference, proxy, equals, identity]
    question: |
      `em.getReference(Order.class, 1L)` returns a proxy. Which subtlety about that proxy is
      correct?
    options:
      - "The proxy's runtime class is a Hibernate-generated subclass, so `x.getClass() == Order.class` is false and naive getClass-based equals can misbehave; use instanceof or Hibernate.unproxy"
      - "The proxy is returned in the detached state, not managed, so touching it always throws LazyInitializationException even inside the transaction"
      - "The proxy eagerly triggers a full SELECT at the getReference call itself, so it offers no deferred-loading advantage over find()"
      - "The proxy can never be used to set a foreign key, because a child INSERT requires the fully loaded parent row rather than a bare id proxy"
    answer: 0
    explanation: |
      getReference returns a MANAGED lazy proxy whose class is a generated subclass of Order.
      So getClass() != Order.class, which can break getClass-based equals/instanceof checks.
      Use instanceof and Hibernate.unproxy()/Hibernate.isInitialized() when comparing. It is
      ideal for setting an FK without loading the row.
    ref: "concepts.md#hibernate-6-and-7-lifecycle-api-changes"

  - id: entity-lifecycle-states-073
    difficulty: advanced
    tags: [spring-data, getreferencebyid, lazy, gotcha]
    question: |
      In current Spring Data JPA, `getReferenceById(id)` (formerly `getOne`) returns a lazy
      proxy. What is the common 2024/2025 gotcha?
    options:
      - "It always issues an eager SELECT at the call, fully loading the row up front so the proxy behaves exactly like a findById result"
      - "It returns null for missing rows at call time, so callers just null-check the result instead of ever catching EntityNotFoundException"
      - "Accessing its properties outside an open transaction/session throws LazyInitializationException (and EntityNotFoundException if the row is missing)"
      - "It is deprecated with no replacement in current Spring Data, so getReferenceById should be swapped out for a plain findById call everywhere"
    answer: 2
    explanation: |
      getReferenceById returns an uninitialized proxy. If you touch a non-id property after the
      transaction has closed, there is no session to run the deferred SELECT ->
      LazyInitializationException; and if the row does not exist, EntityNotFoundException on
      first access. Use findById when you need the loaded state.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"

  - id: entity-lifecycle-states-074
    difficulty: advanced
    tags: [spring-data, saveandflush, version, isnew]
    question: |
      For a VERSIONED entity, how does a well-configured Spring Data `isNew()` decide
      new-vs-existing more robustly than the default id-null check?
    options:
      - "It issues a load-by-id SELECT on every single save to check whether the row already exists before choosing persist or merge"
      - "It inspects whether the @Version field is null (unset) — more reliable than id, especially with assigned ids"
      - "It checks whether the entity class implements Serializable, treating serializable entities as existing and the rest as brand-new"
      - "It always treats the entity as new and calls persist, relying on the database unique constraint to reject any accidental duplicate"
    answer: 1
    explanation: |
      Spring Data's JpaEntityInformation can use a null @Version as the isNew signal, which is
      more robust than 'id is null' when ids are application-assigned. saveAndFlush additionally
      forces an immediate flush rather than deferring to transaction commit.
    ref: "concepts.md#persist-vs-merge-vs-save-and-spring-data-save"

  - id: entity-lifecycle-states-075
    difficulty: expert
    tags: [detach, unflushed, flush, gotcha]
    question: |
      You change two fields on a managed entity and then call `em.detach(entity)` before any
      flush. What is the effect on those pending changes?
    options:
      - "detach performs an implicit flush of the pending edits first and only then evicts the entity, so both fields are safely written"
      - "The changes are silently lost — detach does NOT flush; the entity leaves the context untracked with its edits unpersisted"
      - "The changes are queued on the detached instance and automatically re-applied the next time it is merged into any transaction"
      - "detach throws an IllegalStateException because Hibernate refuses to evict an entity that still has unflushed dirty fields"
    answer: 1
    explanation: |
      detach removes the entity from the context without flushing. Any unflushed field changes
      are discarded (never written). If you need them persisted, call em.flush() BEFORE detach.
    ref: "concepts.md#remove-detach-clear-refresh-and-close"

  - id: entity-lifecycle-states-076
    difficulty: expert
    tags: [persist, detached, exception, timing]
    question: |
      You call `em.persist(order)` on an object that already carries an id from a previous
      session (i.e. it is detached). Per typical Hibernate behavior, what happens?
    options:
      - "It is treated as an in-place update, and Hibernate silently reattaches the row and dirty-checks it exactly as merge would have"
      - "It becomes managed with no error, because a non-null id tells persist the row already exists and can simply be re-associated"
      - "A PersistenceException / EntityExistsException is raised — possibly not until flush/commit rather than at the persist call"
      - "It is converted back to a transient entity, its id is cleared, and a fresh INSERT under a new key is scheduled at flush"
    answer: 2
    explanation: |
      persist is for transient entities. On a detached instance the provider MAY throw
      EntityExistsException immediately OR defer detection to flush/commit (Hibernate often
      surfaces a PersistenceException/EntityExistsException at flush). Use merge for detached
      objects.
    ref: "concepts.md#persist-transient-to-managed"

  - id: entity-lifecycle-states-077
    difficulty: expert
    tags: [merge, return-value, argument-state, code-reading]
    question: |
      Given `Order result = em.merge(input);` where `input` is detached with id 1 and no
      Order#1 is yet in the context — after the call, which is true about `result` and `input`?
    options:
      - "result is managed (a freshly loaded-then-updated instance); input remains detached and untracked; result != input"
      - "Both result and input end up managed and are the identical reference, because merge attaches the argument and returns that same object"
      - "input is now the managed instance and result is merely a throwaway copy of it that can be discarded once the call returns"
      - "result comes back detached while input is the one promoted to managed, so you keep using input and ignore the returned value"
    answer: 0
    explanation: |
      merge loads Order#1 (SELECT) into a managed instance, copies input's fields onto it, and
      RETURNS that managed instance. input is never attached — it stays detached. So result is
      managed, input is not, and result != input. Always keep the return value.
    ref: "concepts.md#merge-detached-to-a-managed-copy"

  - id: entity-lifecycle-states-078
    difficulty: advanced
    tags: [namespace, jakarta, upsert, versions]
    question: |
      Which pairing of Hibernate/Jakarta version detail is correct?
    options:
      - "javax.persistence remains the current namespace in Hibernate 6+, with jakarta.persistence offered only as an optional compatibility alias"
      - "jakarta.persistence.* is the Jakarta EE 9+ namespace targeted by Hibernate 6+, and StatelessSession.upsert was added (as @Incubating) in Hibernate 6.3+"
      - "upsert has existed on the Session interface since Hibernate 4 and has long been a stable, non-incubating insert-or-update operation"
      - "Hibernate 7 reverted the namespace back to javax.persistence to restore source compatibility with pre-Jakarta application code"
    answer: 1
    explanation: |
      The javax.persistence -> jakarta.persistence rename landed with Jakarta EE 9; Hibernate 6+
      targets jakarta.*. upsert (SQL MERGE INTO) was introduced as @Incubating in 6.3 on
      StatelessSession (the regular Session interface has no upsert).
    ref: "concepts.md#hibernate-6-and-7-lifecycle-api-changes"

  - id: entity-lifecycle-states-079
    difficulty: expert
    tags: [bytecode-enhancement, dirty-tracking, managed, mechanism]
    question: |
      With Hibernate bytecode enhancement and dirty tracking enabled, how does the mechanism
      of the MANAGED state's dirty checking change?
    options:
      - "Dirty checking is disabled entirely, so bytecode-enhanced entities require an explicit merge call to flag any modified field for update"
      - "Entities self-track which fields were modified (instrumented setters) instead of Hibernate diffing a load-time snapshot at flush — cheaper for wide tables"
      - "Every flush issues a fresh SELECT per entity to compare the row against the DB, making enhanced dirty checking a read-heavy operation"
      - "Managed entities become immutable once enhanced, so any setter call after load throws an UnsupportedOperationException at runtime"
    answer: 1
    explanation: |
      Default dirty checking diffs each managed entity's current state against a load-time
      snapshot at flush. Bytecode enhancement instruments setters so the entity records its own
      dirty fields, avoiding the snapshot diff — a meaningful win for entities with many columns.
    ref: "concepts.md#hibernate-6-and-7-lifecycle-api-changes"

  - id: entity-lifecycle-states-080
    difficulty: expert
    tags: [statelesssession, get, identity, aliasing]
    question: |
      Using a `StatelessSession`, you call `ss.get(Order.class, 1L)` twice. What is the
      relationship between the two returned objects, and what risk does this create?
    options:
      - "Same reference (==) both times, guaranteed by the StatelessSession's first-level cache deduplicating the row by identity"
      - "Two distinct objects each from a fresh SELECT — there is no persistence context, so no identity guarantee; this 'data aliasing' means edits to one are invisible to the other"
      - "The second call throws NonUniqueObjectException, because the row is already tracked under that identity from the first get"
      - "The second call returns a lazy detached proxy that wraps the first object, so mutating either one updates the shared underlying row"
    answer: 1
    explanation: |
      StatelessSession has no first-level cache, so each get issues a fresh SELECT and returns a
      new object. Without identity dedup you can hold two independent instances of the same row
      (data aliasing), so mutating one does not reflect in the other — a correctness hazard the
      normal Session's identity guarantee prevents.
    ref: "concepts.md#statelesssession-a-no-lifecycle-api"
