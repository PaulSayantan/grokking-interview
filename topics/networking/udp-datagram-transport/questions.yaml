topic: "UDP & Datagram Transport"
domain: networking
topic_slug: udp-datagram-transport
version: 1
questions:
  - id: udp-datagram-transport-001
    difficulty: beginner
    tags: [header, size, rfc768]
    question: |
      How large is the UDP header?
    options:
      - "8 bytes, fixed"
      - "4 bytes, fixed"
      - "20 bytes, fixed"
      - "20 to 60 bytes, variable"
    answer: 0
    explanation: |
      The UDP header is a fixed 8 bytes: source port, destination port, length,
      and checksum, each 16 bits. Unlike TCP (20–60 bytes with options), UDP has
      no options and a constant size.
    ref: "concepts.md#the-udp-datagram-and-its-8-byte-header"

  - id: udp-datagram-transport-002
    difficulty: beginner
    tags: [header, fields]
    question: |
      Which four fields make up the UDP header?
    options:
      - "Source port, destination port, sequence number, checksum"
      - "Source IP, destination IP, length, checksum"
      - "Source port, destination port, length, checksum"
      - "Source port, destination port, window size, checksum"
    answer: 2
    explanation: |
      The UDP header contains exactly four 16-bit fields: source port,
      destination port, length, and checksum. Sequence numbers and window sizes
      are TCP concepts; IP addresses live in the IP header.
    ref: "concepts.md#the-udp-datagram-and-its-8-byte-header"

  - id: udp-datagram-transport-003
    difficulty: intermediate
    tags: [header, length-field]
    question: |
      What does the UDP Length field measure?
    options:
      - "The length of the payload only, excluding all header bytes"
      - "The length of the UDP header plus the data (minimum 8)"
      - "The length of the IP packet including its header"
      - "The number of datagrams remaining to be sent in the flow"
    answer: 1
    explanation: |
      Length counts the UDP header (8 bytes) plus the payload, so its minimum
      legal value is 8 for an empty datagram. It does not include the IP header.
    ref: "concepts.md#the-udp-datagram-and-its-8-byte-header"

  - id: udp-datagram-transport-004
    difficulty: intermediate
    tags: [protocol-number, ip]
    question: |
      What IP protocol number identifies UDP in the IP header's Protocol field?
    options:
      - "6"
      - "41"
      - "1"
      - "17"
    answer: 3
    explanation: |
      UDP is IP protocol number 17; TCP is 6 and ICMP is 1. This is a value in
      the IP header, not a port number.
    ref: "concepts.md#the-udp-datagram-and-its-8-byte-header"

  - id: udp-datagram-transport-005
    difficulty: advanced
    tags: [payload-size, mtu, ipv4]
    question: |
      What is the maximum UDP payload that can be carried in a single IPv4
      datagram (ignoring fragmentation limits)?
    options:
      - "65,535 bytes"
      - "65,507 bytes"
      - "1,472 bytes"
      - "65,527 bytes"
    answer: 1
    explanation: |
      The 16-bit Length field caps the datagram at 65,535 bytes. Subtracting the
      8-byte UDP header and the minimum 20-byte IPv4 header leaves 65,507 bytes
      of payload. In practice you stay within the path MTU to avoid fragmentation.
    ref: "concepts.md#the-udp-datagram-and-its-8-byte-header"

  - id: udp-datagram-transport-006
    difficulty: beginner
    tags: [source-port, optional]
    question: |
      In UDP, what is special about the source port field?
    options:
      - "It is optional and may be set to 0 when no reply is expected"
      - "It must always numerically match the destination port field"
      - "It must be a well-known port below 1024 assigned by IANA"
      - "It carries the segment sequence number used for reordering"
    answer: 0
    explanation: |
      The source port is optional in UDP; a sender that expects no reply may set
      it to 0. When present it tells the receiver where to send a response.
    ref: "concepts.md#the-udp-datagram-and-its-8-byte-header"

  - id: udp-datagram-transport-007
    difficulty: beginner
    tags: [best-effort, guarantees]
    question: |
      Which guarantee does UDP provide?
    options:
      - "In-order delivery using per-datagram sequence numbers"
      - "Reliable delivery with automatic retransmission of losses"
      - "Multiplexing to a port and an optional integrity check"
      - "Congestion control that adapts the send rate to the path"
    answer: 2
    explanation: |
      UDP provides port-based multiplexing/demultiplexing and an optional
      checksum. It does not provide ordering, reliable delivery, retransmission,
      or congestion control — those are absent or left to the application.
    ref: "concepts.md#connectionless-best-effort-delivery"

  - id: udp-datagram-transport-008
    difficulty: beginner
    tags: [connectionless, handshake]
    question: |
      Why is UDP described as "connectionless"?
    options:
      - "It cannot be used with the standard BSD sockets API"
      - "It quietly requires a persistent TCP connection underneath it"
      - "It only works between hosts within a single local subnet"
      - "It performs no handshake and keeps no per-connection state on the wire"
    answer: 3
    explanation: |
      UDP has no handshake and no connection state; each datagram is independent
      ("fire and forget"). This is why it has lower latency and overhead than TCP.
    ref: "concepts.md#connectionless-best-effort-delivery"

  - id: udp-datagram-transport-009
    difficulty: intermediate
    tags: [best-effort, loss]
    question: |
      A UDP datagram is silently dropped due to receiver buffer overflow. What
      does UDP do?
    options:
      - "Retransmits the datagram after a timeout"
      - "Nothing — loss is not detected or corrected by UDP itself"
      - "Sends a NAK to the sender to trigger resend"
      - "Slows the sender via a reduced window"
    answer: 1
    explanation: |
      UDP is best-effort: it neither detects nor recovers loss. There is no
      retransmission, NAK, or flow-control window. Recovery, if needed, is the
      application's responsibility.
    ref: "concepts.md#connectionless-best-effort-delivery"

  - id: udp-datagram-transport-010
    difficulty: advanced
    tags: [connected-socket, api]
    question: |
      What does calling connect() on a UDP socket actually do?
    options:
      - "Performs a SYN/SYN-ACK/ACK three-way handshake with the peer"
      - "Establishes a reliable, in-order byte-stream channel to the peer"
      - "Fixes the default peer address locally and enables receipt of async ICMP errors, but creates no connection on the wire"
      - "Switches the socket to full TCP semantics with ACKs and windows"
    answer: 2
    explanation: |
      A connected UDP socket is purely a local convenience: it sets the default
      destination and lets the kernel deliver asynchronous ICMP errors (like port
      unreachable). No packets are exchanged and no reliability is added.
    ref: "concepts.md#connectionless-best-effort-delivery"

  - id: udp-datagram-transport-011
    difficulty: intermediate
    tags: [ordering, duplicates]
    question: |
      Which of these can happen to UDP datagrams and is NOT handled by UDP?
    options:
      - "Loss, reordering, and duplication can all occur unhandled"
      - "Only loss can occur; IP guarantees datagrams never reorder"
      - "Only duplication can occur; loss is impossible over IP"
      - "None of these occur because IP prevents them at the network layer"
    answer: 0
    explanation: |
      Because datagrams travel independently over IP, they can be lost,
      reordered, or duplicated, and UDP handles none of it. Applications needing
      protection must add sequence numbers and dedup logic.
    ref: "concepts.md#connectionless-best-effort-delivery"

  - id: udp-datagram-transport-012
    difficulty: intermediate
    tags: [message-boundaries, datagram]
    question: |
      An application sends three separate UDP datagrams of 100 bytes each, and
      all arrive. How does the receiver read them?
    options:
      - "As one 300-byte read, since UDP coalesces data"
      - "In an unpredictable number of reads depending on Nagle's algorithm"
      - "As a continuous stream to be re-framed by the application"
      - "As three reads of 100 bytes each — message boundaries are preserved"
    answer: 3
    explanation: |
      UDP is message-oriented: one send equals one datagram equals one receive.
      Boundaries are preserved, unlike TCP's byte stream where the app must add
      its own framing. Nagle is a TCP mechanism.
    ref: "concepts.md#message-boundaries-vs-tcps-byte-stream"

  - id: udp-datagram-transport-013
    difficulty: intermediate
    tags: [byte-stream, tcp-contrast]
    question: |
      Why must a TCP application add its own message framing (e.g. length
      prefixes) but a UDP application typically does not?
    options:
      - "TCP encrypts the data by default, which hides message boundaries"
      - "UDP guarantees every message is padded to a fixed size for framing"
      - "TCP is a byte stream with no message boundaries, while UDP preserves datagram boundaries"
      - "TCP is restricted to a smaller MTU than UDP, forcing extra framing"
    answer: 2
    explanation: |
      TCP delivers an unstructured byte stream; a single send may be split or
      coalesced across reads, so the app needs framing. UDP delivers whole
      datagrams, preserving boundaries.
    ref: "concepts.md#message-boundaries-vs-tcps-byte-stream"

  - id: udp-datagram-transport-014
    difficulty: advanced
    tags: [truncation, recv]
    question: |
      In the BSD socket model, what happens if a received UDP datagram is larger
      than the buffer supplied to the read call?
    options:
      - "The excess is buffered and returned on the next read"
      - "The datagram is truncated and the excess is discarded"
      - "The read blocks until a larger buffer is provided"
      - "The kernel reassembles it across multiple reads automatically"
    answer: 1
    explanation: |
      A datagram is all-or-nothing: if the read buffer is too small, the datagram
      is truncated and the remainder is lost (not held for a later read). This
      contrasts with TCP's stream, where leftover bytes remain readable.
    ref: "concepts.md#message-boundaries-vs-tcps-byte-stream"

  - id: udp-datagram-transport-015
    difficulty: intermediate
    tags: [checksum, ipv4, optional]
    question: |
      What does a UDP checksum field of all-zeros mean in IPv4?
    options:
      - "The checksum was computed and happened to equal exactly zero"
      - "The datagram is corrupt and must be dropped by the receiver"
      - "The checksum was not computed (checksum disabled)"
      - "The datagram is a link-local broadcast to every host"
    answer: 2
    explanation: |
      In IPv4 the UDP checksum is optional; a transmitted value of 0 means "no
      checksum computed." If a real checksum happens to compute to zero, it is
      sent as 0xFFFF instead, since 0 is reserved to mean "disabled."
    ref: "concepts.md#the-udp-checksum-and-why-its-optional"

  - id: udp-datagram-transport-016
    difficulty: advanced
    tags: [checksum, ipv6, mandatory]
    question: |
      Why is the UDP checksum mandatory in IPv6 but optional in IPv4?
    options:
      - "IPv6 datagrams are larger and thus inherently more error-prone on the wire"
      - "IPv4 routers recompute the UDP checksum at each hop, so it isn't needed there"
      - "IPv6 forbids the use of the checksum field entirely and zeroes it out"
      - "IPv6 has no header checksum of its own, so the transport checksum is the only integrity check"
    answer: 3
    explanation: |
      IPv4 headers carry their own checksum, so a UDP-level check is redundant
      enough to be optional. IPv6 dropped the header checksum for performance, so
      UDP's checksum becomes the only end-to-end integrity check and is required.
    ref: "concepts.md#the-udp-checksum-and-why-its-optional"

  - id: udp-datagram-transport-017
    difficulty: advanced
    tags: [checksum, pseudo-header]
    question: |
      The UDP checksum is computed over the UDP header, the payload, and what
      additional data?
    options:
      - "The Ethernet frame header including the MAC addresses"
      - "A pseudo-header including source IP, destination IP, protocol number, and UDP length"
      - "The TCP options field copied from the segment"
      - "The path MTU value discovered for the destination"
    answer: 1
    explanation: |
      UDP (like TCP) prepends a pseudo-header of the source and destination IP
      addresses, the protocol number (17), and the UDP length. Including the IPs
      lets the receiver detect misdelivered datagrams.
    ref: "concepts.md#the-udp-checksum-and-why-its-optional"

  - id: udp-datagram-transport-018
    difficulty: intermediate
    tags: [checksum, corruption]
    question: |
      A UDP datagram arrives but fails its checksum. What happens?
    options:
      - "It is silently discarded, appearing to the application as a loss"
      - "UDP corrects the error using built-in redundancy and then delivers it"
      - "UDP requests a retransmission of the datagram from the sender"
      - "It is delivered to the application with a corruption flag set"
    answer: 0
    explanation: |
      The checksum only detects errors; UDP cannot correct them. A failing
      datagram is dropped silently, which to the application is indistinguishable
      from any other loss.
    ref: "concepts.md#the-udp-checksum-and-why-its-optional"

  - id: udp-datagram-transport-019
    difficulty: advanced
    tags: [udp-lite, rfc3828]
    question: |
      What does UDP-Lite (RFC 3828) let an application do that plain UDP cannot?
    options:
      - "Guarantee in-order delivery of datagrams using per-message sequence numbers"
      - "Transparently compress the payload with a built-in DEFLATE-style codec"
      - "Checksum only a prefix (partial coverage) so partially-corrupt payloads still get delivered"
      - "Establish a lightweight connection with a two-way handshake before sending"
    answer: 2
    explanation: |
      UDP-Lite lets an application specify how many leading bytes the checksum
      covers, so error-tolerant codecs (audio/video) can accept slightly corrupt
      payloads rather than have the whole datagram dropped.
    ref: "concepts.md#the-udp-checksum-and-why-its-optional"

  - id: udp-datagram-transport-020
    difficulty: beginner
    tags: [dns, use-cases]
    question: |
      Why does DNS traditionally use UDP for queries?
    options:
      - "DNS requires the guaranteed in-order byte stream that only TCP can provide"
      - "DNS servers are configured to listen exclusively on UDP port 53 and never on TCP"
      - "UDP transparently encrypts every query with DNSSEC-derived session keys"
      - "A query/response usually fits in one small datagram, and UDP avoids a TCP handshake's added round-trips"
    answer: 3
    explanation: |
      Most DNS lookups are a single small request and response, so UDP avoids the
      latency of a TCP handshake. DNS also uses TCP as a fallback for large or
      truncated responses and zone transfers.
    ref: "concepts.md#when-udp-wins-dns-voip-gaming-video-metrics"

  - id: udp-datagram-transport-021
    difficulty: intermediate
    tags: [dns, tcp-fallback, truncation]
    question: |
      A DNS resolver sends a UDP query and gets a response with the TC
      (truncated) flag set. What should it do?
    options:
      - "Accept the partial answer as-is and cache whatever records did arrive"
      - "Retry the query over TCP, which has no small size ceiling"
      - "Resend the same query to a different UDP source port on the server"
      - "Discard the query permanently and return SERVFAIL to the caller"
    answer: 1
    explanation: |
      The TC bit signals the response didn't fit the UDP payload the resolver
      would accept. The standard behavior is to retry over TCP, which can carry
      arbitrarily large responses.
    ref: "concepts.md#when-udp-wins-dns-voip-gaming-video-metrics"

  - id: udp-datagram-transport-022
    difficulty: intermediate
    tags: [voip, real-time, head-of-line]
    question: |
      Why do VoIP and real-time audio applications prefer UDP over TCP?
    options:
      - "A retransmitted late audio packet is useless, and TCP's in-order retransmission causes audible stalls (head-of-line blocking)"
      - "TCP is fundamentally unable to carry compressed audio codec frames as payload"
      - "UDP guarantees zero packet loss for audio via built-in link-layer retransmission"
      - "TCP does not expose the high-numbered ports that real-time audio streams require"
    answer: 0
    explanation: |
      For real-time media, data has a deadline; a packet that arrives too late is
      worthless. TCP would hold up later audio waiting to retransmit an old lost
      segment, causing stalls. UDP lets the app drop and conceal losses instead.
    ref: "concepts.md#when-udp-wins-dns-voip-gaming-video-metrics"

  - id: udp-datagram-transport-023
    difficulty: intermediate
    tags: [gaming, use-cases]
    question: |
      Why is UDP well-suited to fast-paced online games sending frequent state
      updates?
    options:
      - "Because games require guaranteed reliable delivery that only UDP's ACK scheme provides"
      - "Because UDP guarantees strictly ordered delivery of every game-state update in sequence"
      - "Because a lost update is soon superseded by the next one, so latency matters more than retransmitting stale state"
      - "Because UDP automatically delta-compresses successive game-state snapshots on the wire"
    answer: 2
    explanation: |
      Game state is sent frequently; a dropped position update is quickly replaced
      by a newer one, so retransmitting stale data (as TCP would) only adds
      latency. Low latency wins over perfect reliability.
    ref: "concepts.md#when-udp-wins-dns-voip-gaming-video-metrics"

  - id: udp-datagram-transport-024
    difficulty: beginner
    tags: [use-cases, protocols]
    question: |
      Which set of protocols/services classically runs over UDP?
    options:
      - "SSH, SMTP, and FTP"
      - "DHCP, TFTP, SNMP, NTP, and syslog"
      - "HTTP/1.1 and IMAP"
      - "Telnet and POP3"
    answer: 1
    explanation: |
      DHCP, TFTP, SNMP, NTP, and syslog are classic UDP protocols — small,
      transactional, or broadcast-based exchanges. SSH, SMTP, FTP, HTTP/1.1,
      IMAP, Telnet, and POP3 use TCP.
    ref: "concepts.md#when-udp-wins-dns-voip-gaming-video-metrics"

  - id: udp-datagram-transport-025
    difficulty: intermediate
    tags: [metrics, statsd, fire-and-forget]
    question: |
      A telemetry system sends metrics via UDP (e.g. StatsD). What is the main
      rationale?
    options:
      - "Metrics must never be lost, and UDP guarantees delivery of every sample sent"
      - "TCP is unable to transport numeric counter and gauge data as its payload"
      - "UDP provides stronger delivery ordering than TCP for high-frequency metric streams"
      - "Fire-and-forget counters where dropping an occasional sample is acceptable and the telemetry path must never block the app"
    answer: 3
    explanation: |
      Metric emission should be cheap and non-blocking; losing a sample now and
      then is tolerable. UDP's fire-and-forget model prevents the telemetry path
      from applying backpressure to the application.
    ref: "concepts.md#when-udp-wins-dns-voip-gaming-video-metrics"

  - id: udp-datagram-transport-026
    difficulty: intermediate
    tags: [reliability, application-layer]
    question: |
      To add reliability on top of UDP, which mechanisms would an application
      typically implement?
    options:
      - "Sequence numbers, acknowledgements, retransmission timers, and congestion control"
      - "Just a larger SO_RCVBUF socket buffer to absorb every burst without loss"
      - "Only payload encryption, which by itself makes the transport reliable"
      - "A second parallel UDP socket that duplicates each datagram for redundancy"
    answer: 0
    explanation: |
      Reliable-UDP designs add sequence numbers (detect loss/reorder/dups), ACKs
      and retransmission timeouts, and congestion/flow control to avoid harming
      the network — essentially rebuilding the useful parts of TCP in user space.
    ref: "concepts.md#building-reliability-on-top-of-udp"

  - id: udp-datagram-transport-027
    difficulty: advanced
    tags: [fec, reliability, real-time]
    question: |
      What advantage does Forward Error Correction (FEC) offer over
      retransmission when adding reliability to a real-time UDP stream?
    options:
      - "It compresses the media stream to save bandwidth on the wire"
      - "It guarantees perfect, complete delivery while adding zero bandwidth overhead"
      - "It lets the receiver reconstruct lost packets without waiting for a round-trip retransmission"
      - "It eliminates the need for per-packet sequence numbers in the stream"
    answer: 2
    explanation: |
      FEC sends redundant data so the receiver can rebuild lost packets locally,
      avoiding the latency of a retransmission round-trip. That extra bandwidth
      cost is worth it for real-time media where a resend would arrive too late.
    ref: "concepts.md#building-reliability-on-top-of-udp"

  - id: udp-datagram-transport-028
    difficulty: advanced
    tags: [congestion-collapse, reliability]
    question: |
      Why is congestion control an important thing to add when building a
      high-throughput reliable protocol on UDP?
    options:
      - "UDP already has built-in congestion control that must be explicitly disabled first"
      - "It is only needed when the reliable protocol runs over multicast group traffic"
      - "It is a required input to correctly compute the UDP checksum over the payload"
      - "Without it, a naive UDP sender can overwhelm links and contribute to congestion collapse, since UDP itself does no rate limiting"
    answer: 3
    explanation: |
      UDP does no congestion control, so an application that blasts data
      regardless of network conditions is a bad citizen and can cause congestion
      collapse. Serious UDP-based transports implement algorithms like BBR or
      NewReno-style control in user space.
    ref: "concepts.md#building-reliability-on-top-of-udp"

  - id: udp-datagram-transport-029
    difficulty: intermediate
    tags: [webrtc, reliability, data-channels]
    question: |
      WebRTC data channels provide configurable reliability/ordering. What stack
      do they run on?
    options:
      - "TCP directly, with reliability toggled per message via socket options"
      - "SCTP over DTLS over UDP"
      - "Raw IP datagrams using a dedicated WebRTC protocol number"
      - "QUIC layered on top of a long-lived TCP connection"
    answer: 1
    explanation: |
      WebRTC data channels layer SCTP over DTLS over UDP, letting the app choose
      reliable/ordered, partially reliable, or unreliable semantics per channel —
      a concrete example of picking reliability semantics on top of UDP.
    ref: "concepts.md#building-reliability-on-top-of-udp"

  - id: udp-datagram-transport-030
    difficulty: beginner
    tags: [tcp-vs-udp, comparison]
    question: |
      Which statement correctly contrasts UDP and TCP?
    options:
      - "UDP is connectionless and best-effort; TCP is connection-oriented and reliable"
      - "UDP is connection-oriented with a handshake; TCP is connectionless and best-effort"
      - "Both provide fully in-order, reliable delivery with automatic retransmission"
      - "TCP supports one-to-many multicast delivery, whereas UDP is strictly unicast"
    answer: 0
    explanation: |
      UDP is connectionless and best-effort (no handshake, no reliability). TCP
      is connection-oriented and reliable (handshake, ordered delivery, ACKs).
      Multicast is a UDP capability, not TCP.
    ref: "concepts.md#udp-vs-tcp-trade-off-table"

  - id: udp-datagram-transport-031
    difficulty: intermediate
    tags: [head-of-line, tcp-vs-udp]
    question: |
      Which transport is free of head-of-line blocking at the transport layer,
      and why?
    options:
      - "TCP, because its sliding receive window structurally prevents any blocking"
      - "Neither transport can ever experience head-of-line blocking at layer 4"
      - "Both suffer equally from head-of-line blocking under identical loss conditions"
      - "UDP, because datagrams are independent so one loss doesn't stall others"
    answer: 3
    explanation: |
      UDP datagrams are independent, so a lost one doesn't hold up the rest. TCP,
      being an ordered byte stream, must deliver in order, so one lost segment
      stalls everything behind it — classic head-of-line blocking.
    ref: "concepts.md#udp-vs-tcp-trade-off-table"

  - id: udp-datagram-transport-032
    difficulty: intermediate
    tags: [overhead, tcp-vs-udp, header]
    question: |
      Comparing per-packet overhead, which is true?
    options:
      - "TCP's header is a fixed 8 bytes, while UDP's is a variable 20–60 bytes with options"
      - "Both protocols carry identical fixed 20-byte transport headers on every packet"
      - "UDP's header is 8 bytes fixed; TCP's is 20–60 bytes variable"
      - "UDP carries no transport header at all, embedding ports in the IP header"
    answer: 2
    explanation: |
      UDP's header is a fixed 8 bytes with no options. TCP's is 20 bytes minimum
      and up to 60 bytes with options, contributing to UDP's lower overhead.
    ref: "concepts.md#udp-vs-tcp-trade-off-table"

  - id: udp-datagram-transport-033
    difficulty: intermediate
    tags: [selection, tcp-vs-udp, scenario]
    question: |
      You are designing a service that transfers large files where every byte
      must arrive intact and in order, over a single connection. Which transport
      is the natural fit and why?
    options:
      - "TCP, because it provides reliable, ordered, congestion-controlled delivery out of the box"
      - "UDP, because its lower per-packet overhead always transfers large files faster"
      - "UDP, because its preserved message boundaries reassemble the file automatically"
      - "Broadcast UDP, so every host on the subnet receives the file in one pass"
    answer: 0
    explanation: |
      Bulk file transfer needs complete, ordered delivery — exactly what TCP
      provides without you reimplementing it. UDP would force you to build
      reliability and ordering yourself for no benefit here.
    ref: "concepts.md#udp-vs-tcp-trade-off-table"

  - id: udp-datagram-transport-034
    difficulty: beginner
    tags: [broadcast, multicast, unicast]
    question: |
      Which delivery modes does UDP support that TCP does not?
    options:
      - "Only point-to-point unicast, exactly like TCP connections"
      - "None; both transports support the identical set of delivery modes"
      - "Anycast delivery only, routed to the nearest group member"
      - "Broadcast and multicast"
    answer: 3
    explanation: |
      UDP can do one-to-many delivery via broadcast and multicast. TCP is strictly
      unicast because a connection has exactly two endpoints.
    ref: "concepts.md#broadcast-and-multicast"

  - id: udp-datagram-transport-035
    difficulty: intermediate
    tags: [multicast, address-range, igmp]
    question: |
      Which IPv4 address range is reserved for multicast, and what protocol do
      hosts use to join a group?
    options:
      - "10.0.0.0/8, joined via ARP"
      - "224.0.0.0/4 (class D), joined via IGMP"
      - "169.254.0.0/16, joined via DHCP"
      - "192.168.0.0/16, joined via ICMP"
    answer: 1
    explanation: |
      IPv4 multicast uses 224.0.0.0/4 (the old class D space). Hosts join and
      leave groups using IGMP; routers build distribution trees with protocols
      like PIM.
    ref: "concepts.md#broadcast-and-multicast"

  - id: udp-datagram-transport-036
    difficulty: intermediate
    tags: [broadcast, subnet, scenario]
    question: |
      On the network 192.168.1.0/24, which address is the subnet-directed
      broadcast, and how far does it propagate by default?
    options:
      - "192.168.1.0, propagated across all routers to every connected subnet"
      - "192.168.1.1, forwarded out the default gateway toward the wider internet"
      - "192.168.1.255, confined to the local L2 segment (routers don't forward it by default)"
      - "255.255.255.255, forwarded globally to reach all hosts everywhere"
    answer: 2
    explanation: |
      The subnet-directed broadcast sets the host bits to all ones:
      192.168.1.255 for a /24. Routers do not forward directed or limited
      broadcast by default, so it stays on the local segment.
    ref: "concepts.md#broadcast-and-multicast"

  - id: udp-datagram-transport-037
    difficulty: advanced
    tags: [ipv6, broadcast, multicast]
    question: |
      Which statement about broadcast in IPv6 is correct?
    options:
      - "IPv6 has no broadcast; it replaces it entirely with multicast (e.g. all-nodes ff02::1)"
      - "IPv6 uses the address 255.255.255.255 for subnet broadcast, exactly as IPv4 does"
      - "IPv6 broadcast is mandatory, and every datagram must reach every host on the link"
      - "IPv6 supports broadcast only when the payload is carried over the UDP-Lite variant"
    answer: 0
    explanation: |
      IPv6 removed broadcast altogether and uses multicast for one-to-many
      delivery, such as the all-nodes group ff02::1. IPv6 multicast lives in
      ff00::/8 with MLD for membership.
    ref: "concepts.md#broadcast-and-multicast"

  - id: udp-datagram-transport-038
    difficulty: beginner
    tags: [quic, http3, rfc9000]
    question: |
      QUIC (RFC 9000) is a reliable, secure, multiplexed transport built on top
      of which underlying protocol?
    options:
      - "TCP"
      - "Raw IP with a new protocol number"
      - "SCTP"
      - "UDP"
    answer: 3
    explanation: |
      QUIC runs on top of UDP and reimplements reliability, ordering, and
      congestion control in user space. It is the transport that carries HTTP/3.
    ref: "concepts.md#quic-reliable-transport-built-on-udp"

  - id: udp-datagram-transport-039
    difficulty: advanced
    tags: [quic, ossification, middleboxes]
    question: |
      Why was QUIC built on UDP rather than as a brand-new transport protocol
      directly on IP?
    options:
      - "UDP moves data across the wire measurably faster than raw IP can on the same path"
      - "IP has no concept of ports, so a new transport must borrow UDP's port fields to demultiplex"
      - "Middleboxes and firewalls routinely drop anything that isn't TCP (6) or UDP (17), making a new L4 protocol undeployable on the real internet"
      - "UDP is the only IP transport that offers a built-in payload encryption layer of its own"
    answer: 2
    explanation: |
      A genuinely new IP protocol number would be blocked by NATs, firewalls, and
      middleboxes that only pass TCP and UDP. UDP was the pragmatic vehicle to get
      a new transport deployed across the existing internet.
    ref: "concepts.md#quic-reliable-transport-built-on-udp"

  - id: udp-datagram-transport-040
    difficulty: advanced
    tags: [quic, ossification, user-space]
    question: |
      "Kernel TCP ossification" is often cited as a reason for QUIC. What does it
      mean and how does building on UDP help?
    options:
      - "TCP is fundamentally too slow, and UDP moves the same bytes faster on any given wire"
      - "TCP behavior is baked into OS kernels and middleboxes, so changing it at internet scale is nearly impossible; UDP lets QUIC live in user space and evolve at app/browser cadence"
      - "TCP is structurally unable to carry encrypted payloads, so UDP is required to add TLS"
      - "Ossification means the 16-bit TCP port space has been exhausted by existing services"
    answer: 1
    explanation: |
      TCP's semantics are frozen in kernels and in middleboxes that inspect/mangle
      TCP headers, so new features can't be deployed. Because QUIC sits above UDP,
      it can be implemented and updated in user space without kernel or OS changes.
    ref: "concepts.md#quic-reliable-transport-built-on-udp"

  - id: udp-datagram-transport-041
    difficulty: advanced
    tags: [quic, streams, head-of-line]
    question: |
      What key advantage does QUIC's per-stream reliability have over running
      HTTP/2 on TCP?
    options:
      - "A packet loss on one stream does not stall the other independent streams (no transport-level head-of-line blocking)"
      - "It removes the need for encryption because per-stream framing hides the payload from observers"
      - "It eliminates packet loss entirely by retransmitting each segment before it can ever be dropped"
      - "It requires no congestion control since independent streams cannot collectively overload a link"
    answer: 0
    explanation: |
      HTTP/2 multiplexes streams over one TCP connection, so a single lost segment
      blocks all streams (TCP HoL blocking). QUIC's streams are independent, so a
      loss affects only its own stream.
    ref: "concepts.md#quic-reliable-transport-built-on-udp"

  - id: udp-datagram-transport-042
    difficulty: advanced
    tags: [quic, connection-migration, connection-id]
    question: |
      QUIC connections can survive a client's IP/port change (e.g. Wi-Fi to
      cellular). What feature enables this?
    options:
      - "Broadcast rebinding that re-announces the session to every host on the new subnet"
      - "Re-running the DNS lookup to rediscover the server and silently open a fresh session"
      - "A TCP keepalive timer that holds the old 4-tuple mapping open across the network change"
      - "Connection IDs that identify the connection independently of the 4-tuple"
    answer: 3
    explanation: |
      QUIC identifies a connection by a connection ID rather than the source/dest
      IP-port 4-tuple, so the connection can migrate to a new network path without
      being torn down. This is connection migration.
    ref: "concepts.md#quic-reliable-transport-built-on-udp"

  - id: udp-datagram-transport-043
    difficulty: intermediate
    tags: [quic, tls, handshake, latency]
    question: |
      How does QUIC reduce connection-setup latency compared with TCP + TLS 1.3?
    options:
      - "It skips encryption entirely, so no key-exchange round trips are ever needed at setup"
      - "It uses a deliberately longer multi-round handshake that buys extra reliability up front"
      - "It integrates the TLS 1.3 handshake with the transport handshake, achieving 1-RTT setup (and 0-RTT on resumption)"
      - "It performs the cryptographic handshake over a separate short-lived TCP connection first"
    answer: 2
    explanation: |
      QUIC folds the TLS 1.3 handshake into its transport handshake, so a new
      connection is ready in one round trip, and resumed connections can send data
      in zero round trips — faster than establishing TCP then TLS separately.
    ref: "concepts.md#quic-reliable-transport-built-on-udp"

  - id: udp-datagram-transport-044
    difficulty: intermediate
    tags: [buffers, drops, backpressure]
    question: |
      An application reads its UDP socket too slowly and the receive buffer fills.
      What happens, and is the sender slowed down?
    options:
      - "The kernel expands the buffer indefinitely, so nothing is dropped"
      - "Incoming datagrams are dropped; the sender is NOT slowed (no backpressure)"
      - "TCP-style flow control kicks in and shrinks an advertised window to throttle the sender"
      - "The socket transparently switches to a TCP fallback so the buffered data is not lost"
    answer: 1
    explanation: |
      When a UDP receive buffer overflows, further datagrams are dropped (visible
      as RcvbufErrors in netstat -su). Unlike TCP, there is no window/backpressure
      to slow the sender.
    ref: "concepts.md#sockets-buffers-and-operational-gotchas"

  - id: udp-datagram-transport-045
    difficulty: advanced
    tags: [fragmentation, mtu, gotchas]
    question: |
      Why do well-behaved UDP applications try to keep datagrams within the path
      MTU?
    options:
      - "If IP fragments the datagram, losing any single fragment loses the whole datagram, and many firewalls drop fragments"
      - "Larger datagrams are encrypted with a different cipher, so keeping them small avoids the mismatch"
      - "The 16-bit UDP Length field is structurally forbidden from ever exceeding the path MTU value"
      - "Fragmentation is explicitly illegal for UDP, so oversized datagrams are refused by the sender"
    answer: 0
    explanation: |
      A datagram exceeding the path MTU is IP-fragmented; loss of one fragment
      destroys the entire datagram, and firewalls frequently drop fragments. So
      apps size datagrams within the MTU or probe for it.
    ref: "concepts.md#sockets-buffers-and-operational-gotchas"

  - id: udp-datagram-transport-046
    difficulty: intermediate
    tags: [icmp, port-unreachable, gotchas]
    question: |
      What typically happens when a UDP datagram is sent to a closed port on a
      reachable host?
    options:
      - "The host sends back a TCP RST segment to explicitly refuse the connection attempt"
      - "The datagram is queued in the kernel until a matching listener eventually binds the port"
      - "UDP retransmits the datagram on a timer until the destination port finally opens up"
      - "The host may return an ICMP port-unreachable, though its delivery isn't guaranteed and unconnected sockets often don't surface it"
    answer: 3
    explanation: |
      A closed UDP port usually elicits an ICMP port-unreachable, but that ICMP
      may be lost or filtered, and unconnected sockets often don't report it —
      part of why UDP feels silent. TCP, not UDP, uses RST.
    ref: "concepts.md#sockets-buffers-and-operational-gotchas"

  - id: udp-datagram-transport-047
    difficulty: advanced
    tags: [performance, gso, gro, syscalls]
    question: |
      High-throughput UDP servers (like QUIC endpoints) use sendmmsg/recvmmsg and
      UDP GSO/GRO. What problem do these address?
    options:
      - "They add reliable, acknowledged delivery to UDP by tracking each datagram in the kernel"
      - "They amortize per-packet CPU/syscall cost, since UDP lacks TCP's built-in large-segment offload story"
      - "They offload per-datagram encryption to dedicated crypto hardware on the network card"
      - "They guarantee strictly in-order delivery by buffering and resequencing datagrams first"
    answer: 1
    explanation: |
      Because UDP handles many small datagrams, per-packet syscall and kernel
      overhead dominates. Batching syscalls (sendmmsg/recvmmsg) and segmentation
      offloads (GSO/GRO) reduce that cost so UDP can match high throughput.
    ref: "concepts.md#sockets-buffers-and-operational-gotchas"

  - id: udp-datagram-transport-048
    difficulty: advanced
    tags: [nat, traversal, gotchas]
    question: |
      Why do UDP-based peer-to-peer applications rely on keepalives and
      STUN/TURN/ICE?
    options:
      - "UDP forbids NAT entirely, so peers must obtain public IPs before they can communicate"
      - "STUN adds reliability to UDP datagrams by acknowledging and retransmitting each one it relays"
      - "UDP NAT mappings are shorter-lived and less predictable than TCP's, so hole-punched paths must be discovered and kept alive"
      - "UDP is fundamentally unable to traverse any firewall, so every path needs a relay server"
    answer: 2
    explanation: |
      NAT bindings for UDP tend to expire quickly and behave less predictably than
      for TCP. Apps use STUN/TURN/ICE to discover reachable paths and periodic
      keepalives to keep the NAT hole open.
    ref: "concepts.md#sockets-buffers-and-operational-gotchas"

  - id: udp-datagram-transport-049
    difficulty: advanced
    tags: [rfc8085, congestion-control, standards]
    question: |
      RFC 8085 (UDP Usage Guidelines) says an application that can send more than a
      few datagrams MUST do what?
    options:
      - "Implement congestion control (e.g. TFRC or TCP-like windowing)"
      - "Set the UDP checksum field to zero on every datagram to save receiver-side CPU cycles"
      - "Open a parallel TCP connection alongside the flow to carry all of the acknowledgements"
      - "Restrict the application to multicast group addresses instead of ordinary unicast ones"
    answer: 0
    explanation: |
      RFC 8085 makes congestion control mandatory for any UDP application beyond
      trivial volumes; bulk transfers SHOULD use TFRC or TCP-like windowing and
      compete fairly within an order of magnitude of TCP. Ignoring it risks
      congestion collapse.
    ref: "concepts.md#rfc-8085-udp-usage-guidelines-and-mandatory-congestion-control"

  - id: udp-datagram-transport-050
    difficulty: expert
    tags: [rfc8085, rate-limit, no-feedback]
    question: |
      Per RFC 8085 §3.1.3, if a UDP application has no RTT estimate and receives no
      return traffic to gauge the path, what is the recommended maximum send rate?
    options:
      - "No more than one datagram per millisecond, roughly matching a typical LAN round trip"
      - "As fast as the socket send buffer will drain, letting the kernel meter the flow"
      - "No more than one datagram every 3 seconds"
      - "One datagram every 100 ms, a fixed rate that assumes a conservative default RTT"
    answer: 2
    explanation: |
      With no feedback at all, RFC 8085 says SHOULD NOT send more than one datagram
      every 3 seconds; a low-volume app with some feedback SHOULD send at most one
      per RTT. This bounds damage when the sender is flying blind.
    ref: "concepts.md#rfc-8085-udp-usage-guidelines-and-mandatory-congestion-control"

  - id: udp-datagram-transport-051
    difficulty: expert
    tags: [rfc8085, rto, karn, rtt]
    question: |
      An application builds retransmission over UDP per RFC 8085 guidance. Which
      pair of choices matches the BCP?
    options:
      - "Initial RTO of 3 seconds; take a fresh RTT sample from every retransmitted exchange too"
      - "No RTO timer at all; rely purely on the receiver returning NAKs to trigger any resend"
      - "Initial RTO of 200 ms; halve it on every loss to retransmit the missing data more quickly"
      - "Initial RTO of 1 second; use EWMA and apply Karn's algorithm (don't sample RTT from ambiguous/retransmitted exchanges)"
    answer: 3
    explanation: |
      RFC 8085 §3.1.1 recommends an initial RTO of 1 second, maintained via an EWMA
      of RTT samples with Karn's algorithm — you must not sample RTT from a
      retransmitted exchange because you can't tell which copy the reply answered,
      and you back off exponentially on repeated loss.
    ref: "concepts.md#rfc-8085-udp-usage-guidelines-and-mandatory-congestion-control"

  - id: udp-datagram-transport-052
    difficulty: intermediate
    tags: [rfc8085, keepalive, nat]
    question: |
      RFC 8085 gives what guidance on UDP keep-alives?
    options:
      - "Send them as frequently as the socket allows so RTT and loss estimates stay continuously fresh"
      - "They are mandatory once every second for all UDP flows, regardless of whether a NAT is present"
      - "They are NOT RECOMMENDED; if used, no more than once every 15 seconds (with jitter)"
      - "They must be carried over a separate parallel TCP connection kept open beside the UDP flow"
    answer: 2
    explanation: |
      Keep-alives are NOT RECOMMENDED (§3.5); if an app needs them (e.g. to hold a
      NAT mapping whose floor is ~2 minutes per RFC 4787), it should send at most one
      every 15 seconds and add jitter to avoid synchronization.
    ref: "concepts.md#rfc-8085-udp-usage-guidelines-and-mandatory-congestion-control"

  - id: udp-datagram-transport-053
    difficulty: expert
    tags: [pmtu, plpmtud, black-hole, debugging]
    question: |
      A UDP service works on the LAN but silently loses ~5% of its *large* datagrams
      across the internet; small datagrams are fine. Classic PMTU Discovery isn't
      helping. What is the most likely cause and fix?
    options:
      - "Receive buffer too small; raise SO_RCVBUF and net.core.rmem_max so large datagrams aren't dropped"
      - "A PMTU black hole (middleboxes filter the ICMP Too Big / Frag Needed); use PLPMTUD or cap payload near 1200 bytes"
      - "The UDP checksum is disabled on large datagrams; enable it so corrupt big packets stop being silently dropped"
      - "The source port is not randomized; enable port randomization so large datagrams hash onto a working path"
    answer: 1
    explanation: |
      Only large datagrams dying points at fragmentation/PMTU. Classic PMTUD depends
      on ICMP that middleboxes often drop (a black hole), so the sender never learns.
      PLPMTUD (RFC 8899) probes upward without relying on ICMP; alternatively cap the
      payload near the QUIC 1200-byte floor.
    ref: "concepts.md#datagram-sizing-path-mtu-plpmtud-and-safe-payload-floors"

  - id: udp-datagram-transport-054
    difficulty: expert
    tags: [pmtu, emtu, floor, ipv6]
    question: |
      With the path MTU unknown, what are the safe minimum "effective MTU for
      sending" floors an application should assume for IPv4 and IPv6?
    options:
      - "IPv4 = 1500 and IPv6 = 1500, assuming the ubiquitous Ethernet link MTU end to end"
      - "IPv4 = 68 (the IPv4 minimum) and IPv6 = 576, taken from the legacy IPv4 reassembly floor"
      - "IPv4 = min(576, first-hop MTU); IPv6 = 1280"
      - "IPv4 = 1280 and IPv6 = 576, swapping the IPv6 minimum link MTU onto the IPv4 path"
    answer: 2
    explanation: |
      The EMTU_S fallback is min(576, first-hop MTU) for IPv4 and 1280 bytes for IPv6
      (IPv6's minimum link MTU). Subtract the IP header plus 8 UDP bytes to get the
      safe payload. QUIC uses a related 1200-byte initial datagram floor.
    ref: "concepts.md#datagram-sizing-path-mtu-plpmtud-and-safe-payload-floors"

  - id: udp-datagram-transport-055
    difficulty: advanced
    tags: [plpmtud, icmp, rfc8899]
    question: |
      What is the key robustness advantage of Packetization-Layer PMTUD (RFC 8899)
      over classic PMTUD (RFC 1191/8201)?
    options:
      - "It probes upward and confirms via the transport's own loss signal, so it does not depend on ICMP messages at all"
      - "It sends larger ICMP probes that middleboxes are obligated to forward, so the too-big message reliably reaches the sender"
      - "It signals every router along the path to disable fragmentation, so oversized packets are dropped and the MTU learned instantly"
      - "It negotiates the exact path MTU up front through a dedicated three-way handshake before any data packets are sent"
    answer: 0
    explanation: |
      Classic PMTUD relies on routers returning ICMP Fragmentation Needed / Packet
      Too Big, which middleboxes frequently filter. PLPMTUD sends progressively
      larger probe packets and uses whether they arrive (transport feedback) to find
      the MTU, so it is immune to ICMP black-holing.
    ref: "concepts.md#datagram-sizing-path-mtu-plpmtud-and-safe-payload-floors"

  - id: udp-datagram-transport-056
    difficulty: expert
    tags: [fragmentation, ip-layer, reassembly]
    question: |
      A 4000-byte UDP datagram is sent over a 1500-byte-MTU IPv4 path and fragmented
      into three fragments; the middle fragment is lost. What does the receiver
      deliver to the application?
    options:
      - "The first and third fragments as two separate datagrams"
      - "Nothing — the entire datagram is discarded when reassembly fails"
      - "A truncated 2500-byte datagram containing only the two fragments that arrived"
      - "The UDP layer requests retransmission of the missing fragment"
    answer: 1
    explanation: |
      IP reassembly is all-or-nothing: losing any one fragment means the whole
      datagram is dropped after the reassembly timer expires. UDP has no per-fragment
      retransmission. This is why large UDP datagrams have a compounded effective loss
      rate.
    ref: "concepts.md#ip-fragmentation-of-udp-datagrams"

  - id: udp-datagram-transport-057
    difficulty: expert
    tags: [fragmentation, firewall, ports]
    question: |
      Why do stateful firewalls and ECMP hashers often mishandle or drop
      non-initial IP fragments of a UDP datagram?
    options:
      - "Non-initial fragments carry a deliberately corrupted checksum that stateful devices treat as a signal to discard them on sight"
      - "Non-initial fragments are re-tagged with a distinct IP protocol number that firewall rule sets are not configured to permit"
      - "Only the first fragment carries the UDP header (and thus the port numbers), so later fragments lack L4 tuple information"
      - "Fragments are always individually encrypted with a per-fragment key that middleboxes cannot decrypt to classify the flow"
    answer: 2
    explanation: |
      The UDP header (with source/destination ports) sits only in the first fragment.
      Later fragments have no L4 ports, so devices that make decisions on the 5-tuple
      can't classify them consistently and frequently drop them — another reason to
      avoid fragmentation.
    ref: "concepts.md#ip-fragmentation-of-udp-datagrams"

  - id: udp-datagram-transport-058
    difficulty: advanced
    tags: [fragmentation, ipv6, rfc8900]
    question: |
      Which statement about IP fragmentation is correct?
    options:
      - "IPv6 routers fragment oversized packets in transit exactly as IPv4 routers do, inserting a Fragment header on the sender's behalf"
      - "In IPv6 only the source may fragment (via a Fragment header); routers return Packet Too Big instead, and RFC 8900 advises upper layers to avoid relying on fragmentation"
      - "RFC 8900 mandates in-network fragmentation for every UDP datagram larger than the 1280-byte IPv6 minimum link MTU"
      - "IPv4 explicitly forbids routers from fragmenting UDP datagrams, unlike TCP segments which routers are free to split"
    answer: 1
    explanation: |
      IPv6 removed in-network fragmentation: only the source host may fragment, and a
      too-big packet triggers ICMPv6 Packet Too Big. RFC 8900 ("IP Fragmentation
      Considered Fragile") recommends upper layers not depend on fragmentation at all.
    ref: "concepts.md#ip-fragmentation-of-udp-datagrams"

  - id: udp-datagram-transport-059
    difficulty: expert
    tags: [checksum, ones-complement, algorithm]
    question: |
      When a receiver verifies a UDP checksum, it sums the pseudo-header, header, and
      payload (including the received checksum field) using one's-complement
      addition. A valid datagram yields what result?
    options:
      - "Zero (0x0000)"
      - "All-ones (0xFFFF)"
      - "The IP header checksum value"
      - "The UDP length field value"
    answer: 1
    explanation: |
      One's-complement addition of all 16-bit words, including the transmitted
      checksum, should produce 0xFFFF (all ones) for an intact datagram. Carries out
      of the top bit are wrapped back into the low bit (end-around carry). A zero
      result would indicate an error.
    ref: "concepts.md#checksum-internals-ones-complement-and-incremental-update"

  - id: udp-datagram-transport-060
    difficulty: expert
    tags: [checksum, nat, rfc1624, incremental]
    question: |
      A NAT rewrites the source IP and port of a UDP datagram. Rather than
      recompute the checksum over the whole packet, RFC 1624 lets it do what?
    options:
      - "Zero out the checksum field entirely, since rewriting the addresses invalidates it and IPv4 treats a zero UDP checksum as disabled"
      - "Copy the freshly recomputed IP header checksum straight into the UDP checksum field, since both cover the rewritten address bytes"
      - "Apply an incremental arithmetic delta to the existing checksum reflecting only the changed 16-bit words"
      - "Recompute the checksum over just the pseudo-header words and leave the payload contribution untouched to save cycles"
    answer: 2
    explanation: |
      Because the checksum is a one's-complement sum, changing a few fields lets a
      device adjust it by a small delta (subtract old words, add new) — RFC 1624
      gives the correct formula. This is cheap for NATs/routers versus rescanning the
      whole datagram.
    ref: "concepts.md#checksum-internals-ones-complement-and-incremental-update"

  - id: udp-datagram-transport-061
    difficulty: advanced
    tags: [checksum, zero-checksum, tunnels, rfc6935]
    question: |
      RFC 6935/6936 permit a zero UDP checksum in IPv6 under what condition?
    options:
      - "For any IPv6 UDP traffic, because the IPv6 header carries its own checksum that already covers the transport payload"
      - "Only for specific tunnel/encapsulation protocols in controlled environments, explicitly enabled per destination port"
      - "Whenever the payload is already encrypted, since the cipher's authentication tag substitutes for the transport checksum"
      - "For all multicast datagrams, since group delivery makes per-receiver checksum verification impractical to enforce"
    answer: 1
    explanation: |
      Normally IPv6 mandates the UDP checksum (no IP header checksum exists). RFC
      6935/6936 carve a narrow exception for certain tunnel protocols in controlled
      settings where an inner integrity check exists, and it must be enabled
      deliberately per port — not a general opt-out.
    ref: "concepts.md#checksum-internals-ones-complement-and-incremental-update"

  - id: udp-datagram-transport-062
    difficulty: expert
    tags: [gso, pacing, bbr, performance]
    question: |
      A QUIC server enables UDP_SEGMENT (GSO) to batch up to 64 datagrams per
      syscall, but its BBR pacing now sends bursts. What is the underlying tension
      and the fix?
    options:
      - "GSO segmentation recomputes each datagram's checksum incorrectly on the NIC; disable checksum offload so the kernel fills them in by hand"
      - "Batching hands many packets to the NIC at once, defeating per-packet pacing; use kernel/NIC pacing via SO_MAX_PACING_RATE or SO_TXTIME (EDT model)"
      - "GSO forces every super-buffer to be IP-fragmented on the wire; lower the interface MTU so each segment fits without splitting"
      - "BBR's model is fundamentally incompatible with connectionless UDP; switch the congestion controller to NewReno to restore pacing"
    answer: 1
    explanation: |
      GSO improves CPU efficiency by segmenting one super-buffer, but releasing a
      batch simultaneously undermines the spacing pacing depends on. The resolution
      is to offload pacing to the kernel/NIC via SO_MAX_PACING_RATE or per-packet
      transmit timestamps (SO_TXTIME, Earliest Departure Time), so segments still
      leave spaced.
    ref: "concepts.md#gso-gro-and-batched-syscalls"

  - id: udp-datagram-transport-063
    difficulty: advanced
    tags: [recvmmsg, syscalls, performance]
    question: |
      What is the primary purpose of sendmmsg/recvmmsg for a high-throughput UDP
      server?
    options:
      - "To add acknowledged, in-order delivery to UDP by having the kernel track each datagram sent through the call"
      - "To transparently encrypt each datagram inside the kernel before it leaves the socket send queue"
      - "To enlarge the maximum datagram size past the 65,535-byte limit imposed by the 16-bit UDP length field"
      - "To send or receive many datagrams in a single syscall, amortizing per-packet syscall overhead"
    answer: 3
    explanation: |
      These calls process an array of datagrams per syscall. Since UDP throughput is
      dominated by many small packets, batching drastically cuts syscalls (Cloudflare
      reported ~900k → ~15k/sec), freeing CPU for actual work.
    ref: "concepts.md#gso-gro-and-batched-syscalls"

  - id: udp-datagram-transport-064
    difficulty: expert
    tags: [amplification, reflection, security]
    question: |
      What two properties must a UDP service have to be usable in a reflection/
      amplification DDoS?
    options:
      - "It must complete a connection handshake before replying and return responses smaller than the triggering request"
      - "It must run exclusively over IPv6 and deliver its responses to a multicast group rather than a single host"
      - "It must respond to spoofed-source requests (no source validation) and return a response much larger than the request"
      - "It must randomize its source port on every reply and sign each response with DNSSEC before sending it"
    answer: 2
    explanation: |
      Reflection needs the server to answer requests with a spoofed source IP (UDP's
      lack of a handshake enables this), and amplification needs the reply to be much
      larger than the request (high BAF). Together the attacker aims a magnified flood
      at the spoofed victim.
    ref: "concepts.md#amplification-and-reflection-attacks"

  - id: udp-datagram-transport-065
    difficulty: expert
    tags: [amplification, baf, memcached, cldap]
    question: |
      An internal service is found answering on UDP/11211 reachable from the
      internet. Why is this the most dangerous amplification exposure of the common
      vectors, and what network-side control best addresses spoofing generally?
    options:
      - "memcached has the highest BAF (~10,000–51,000×, seen in the 1.35 Tbps GitHub attack); BCP 38 ingress filtering (source-address validation) stops spoofed sources"
      - "UDP/11211 is CLDAP with a modest ~6× BAF; signing zone data with DNSSEC removes the amplification exposure entirely"
      - "UDP/11211 is SNMP with a ~556× BAF; disabling the legacy monlist command on the daemon closes the vector completely"
      - "UDP/11211 is chargen with a ~30× BAF; enabling Response Rate Limiting (RRL) is the definitive network-side spoofing control"
    answer: 0
    explanation: |
      UDP/11211 is memcached, whose amplification factor (~10,000–51,000×) is by far
      the largest and powered the record 1.35 Tbps GitHub attack. The general
      network-side fix for the spoofing that enables reflection is BCP 38 / RFC 2827
      ingress filtering (SAV). NTP/monlist is ~556×, SNMP ~6×, SSDP ~30×.
    ref: "concepts.md#amplification-and-reflection-attacks"

  - id: udp-datagram-transport-066
    difficulty: advanced
    tags: [ingress-filtering, bcp38, mitigation]
    question: |
      What does BCP 38 (RFC 2827) ingress filtering do, and why does it curb UDP
      amplification attacks?
    options:
      - "It rate-limits DNS ANY responses at open resolvers so each reflector can emit only a bounded volume of amplified replies"
      - "It drops packets whose source address could not legitimately originate from the sending network, defeating the source-IP spoofing that reflection relies on"
      - "It forces all UDP traffic that lacks source validation to fall back to TCP, where the handshake blocks spoofed senders"
      - "It encrypts the outer UDP header fields so amplification middleboxes can no longer inspect and classify the reflected flow"
    answer: 1
    explanation: |
      Reflection depends on spoofing the victim's IP as the source. BCP 38 (with BCP
      84/RFC 3704) has networks perform source-address validation and drop packets
      that couldn't have legitimately come from them, removing the spoofing capability
      at the origin — the definitive network-side fix.
    ref: "concepts.md#amplification-and-reflection-attacks"

  - id: udp-datagram-transport-067
    difficulty: expert
    tags: [quic, anti-amplification, rfc9000]
    question: |
      How does QUIC prevent its own handshake from being abused as a UDP
      amplification reflector?
    options:
      - "It refuses every datagram from a client whose address it has not already seen in a prior validated connection"
      - "It requires each new client to solve a CPU-bound proof-of-work puzzle before the server will send any handshake bytes"
      - "Before validating the client's address, the server MUST NOT send more than 3× the bytes it has received (RFC 9000 §8.1); address validation uses handshake completion or a Retry token"
      - "It falls back to running the entire connection setup over a short-lived TCP session, then resumes on UDP once validated"
    answer: 2
    explanation: |
      RFC 9000 §8.1 caps the server at 3× the received bytes until it has validated
      the client's address (via handshake progress or a Retry token round-trip). This
      bounds amplification, unlike open DNS/NTP resolvers that reply with large
      responses to any spoofed request.
    ref: "concepts.md#quic-internals-anti-amplification-connection-ids-and-header-protection"

  - id: udp-datagram-transport-068
    difficulty: expert
    tags: [quic, connection-id, load-balancer, migration]
    question: |
      A stateful L4 load balancer sends a client's QUIC packets to a different
      backend after the client switches Wi-Fi→LTE, breaking the session. What is the
      cause and the correct fix?
    options:
      - "The 5-tuple changed, so 5-tuple hashing re-buckets the flow; route on the QUIC Connection ID (which the LB parses and which is stable across migration)"
      - "The client's TLS session ticket expired during the network switch; shortening the ticket lifetime keeps the session pinned to its backend"
      - "The MTU dropped when moving to LTE; enabling IP fragmentation on the balancer restores delivery to the original backend"
      - "The UDP checksum changed with the new source address; disabling checksum validation on the balancer stops it re-bucketing the flow"
    answer: 0
    explanation: |
      A network switch changes the source IP/port, so a load balancer hashing the
      5-tuple picks a different backend. QUIC decouples identity from the 4-tuple via
      Connection IDs (RFC 9000 §5); the LB should route on the CID (often with routing
      info encoded in it) so migration stays pinned to the right backend.
    ref: "concepts.md#quic-internals-anti-amplification-connection-ids-and-header-protection"

  - id: udp-datagram-transport-069
    difficulty: advanced
    tags: [quic, header-protection, ossification, rfc9001]
    question: |
      QUIC encrypts most of its transport header fields (packet numbers, parts of the
      connection ID) via header protection (RFC 9001). What is the main motivation?
    options:
      - "To hide the application payload from the destination server that ultimately terminates the connection and decrypts it"
      - "To shrink the transport header below UDP's fixed 8 bytes by encoding the fields into fewer bits on the wire"
      - "To prevent middleboxes from inspecting or depending on those fields, avoiding the ossification that froze TCP"
      - "To let routers along the path reassemble IP fragments faster by reading the protected packet-number fields directly"
    answer: 2
    explanation: |
      By encrypting header fields (plus GREASE and version negotiation), QUIC stops
      middleboxes from reading or ossifying on them, preserving the protocol's ability
      to evolve — the same ossification that made changing TCP nearly impossible.
    ref: "concepts.md#quic-internals-anti-amplification-connection-ids-and-header-protection"

  - id: udp-datagram-transport-070
    difficulty: expert
    tags: [dns-spoofing, kaminsky, port-randomization, rfc5452]
    question: |
      Why does source-port randomization (RFC 6056) meaningfully harden a DNS
      resolver against off-path (Kaminsky-style) cache poisoning?
    options:
      - "It adds ~16 bits of entropy on top of the 16-bit transaction ID, so an off-path attacker must guess both the txn ID and the random source port to forge a reply"
      - "It encrypts the DNS query end-to-end so an off-path attacker cannot read the transaction ID needed to forge a matching reply"
      - "It forces every query onto TCP, where the connection handshake makes off-path source-address spoofing effectively impossible"
      - "It cryptographically authenticates each returned record, so a forged off-path reply fails signature validation and is discarded"
    answer: 0
    explanation: |
      A forged reply is accepted only if it matches the 4-tuple and the 16-bit txn ID.
      A fixed source port leaves just ~16 bits to guess; randomizing the source port
      (RFC 5452/6056) roughly doubles the entropy to ~32 bits. The cryptographic fix
      is DNSSEC; port randomization only raises the bar.
    ref: "concepts.md#source-port-randomization-and-off-path-spoofing"

  - id: udp-datagram-transport-071
    difficulty: expert
    tags: [source-port, ecmp, flow-hash, rfc8085]
    question: |
      RFC 8085 §5.1.1 notes the UDP source port doubles as flow entropy for ECMP and
      L4 load balancers. What follows for a long-lived flow?
    options:
      - "The source port should be rotated on every datagram so the ECMP hash spreads the flow's packets evenly across all available paths"
      - "The source port must be fixed at 0 for load-balanced traffic so the balancer hashes solely on the address pair instead"
      - "The source port should stay stable for the flow's life (in 49152–65535); changing it mid-flow re-hashes the path, causing reordering and breaking stateful LB pinning"
      - "The source port must be set equal to the destination port so both directions of the flow hash onto the identical path"
    answer: 2
    explanation: |
      Routers and LBs hash the 5-tuple (including source port) to pick a path/backend.
      A stable ephemeral source port keeps the flow on one path; changing it mid-flow
      moves the flow to a different path (reordering) and breaks stateful pinning —
      the flip side of randomizing it once for security.
    ref: "concepts.md#the-source-port-as-flow-hash-entropy-ecmp-and-l4-load-balancing"

  - id: udp-datagram-transport-072
    difficulty: expert
    tags: [nat, symmetric, hole-punching, turn]
    question: |
      Two peers behind NATs try UDP hole punching using addresses learned from a
      STUN server, but it fails. Both NATs are symmetric. Why, and what is the
      fallback?
    options:
      - "Symmetric NAT assigns a new external port per destination, so the STUN-observed mapping is useless for a different peer; fall back to a TURN relay"
      - "Symmetric NAT drops every inbound UDP datagram regardless of mapping; switching the media path to TCP is the only way through"
      - "STUN messages are only routable over IPv6, so enabling dual-stack IPv6 on both peers lets the hole punching succeed"
      - "The peers must first exchange their ICE candidate lists over a multicast group before any direct path can be established"
    answer: 0
    explanation: |
      A symmetric NAT creates a distinct external mapping per destination, so the
      port a STUN server reported won't match what the peer needs to reach — hole
      punching can't line up. ICE falls back to relaying traffic through a TURN
      server (RFC 8656), at the cost of extra latency/bandwidth.
    ref: "concepts.md#nat-behavior-nat-types-and-traversal-stunturnice"

  - id: udp-datagram-transport-073
    difficulty: advanced
    tags: [stun, turn, ice, roles]
    question: |
      In the STUN/TURN/ICE trio, which role does each play?
    options:
      - "STUN relays all media through a public server; TURN merely reports the external server-reflexive mapping; ICE encrypts the media stream with its own keys"
      - "All three are simply vendor aliases for one NAT-keepalive protocol, differing only in which RFC number a given implementation happens to cite on the wire"
      - "ICE discovers the host's external mapping directly; STUN relays the traffic whenever a direct path fails; TURN randomizes the source port to add flow entropy"
      - "STUN discovers a host's external (server-reflexive) address; TURN relays traffic when direct paths fail; ICE gathers candidates and picks the best working pair"
    answer: 3
    explanation: |
      STUN (RFC 8489) tells a host its external IP:port as seen by a public server;
      TURN (RFC 8656) is the relay fallback for when direct connectivity fails
      (e.g. symmetric NAT); ICE (RFC 8445) is the framework that collects host/
      server-reflexive/relayed candidates and probes to select the best pair.
    ref: "concepts.md#nat-behavior-nat-types-and-traversal-stunturnice"

  - id: udp-datagram-transport-074
    difficulty: expert
    tags: [dtls, tls, security, rfc9147]
    question: |
      Why can't standard TLS run directly over UDP, and what does DTLS
      (RFC 6347/9147) add to make datagram security work?
    options:
      - "TLS assumes a reliable ordered byte stream (loss/reorder breaks its record sequencing); DTLS adds explicit epoch/sequence numbers, a replay window, and its own handshake retransmission"
      - "TLS records are too large to fit a single UDP datagram; DTLS solves this by compressing each record with DEFLATE before it is transmitted on the wire"
      - "TLS is designed to operate only over multicast group addresses; DTLS extends it by adding the plain point-to-point unicast delivery mode that UDP requires"
      - "TLS itself performs no payload encryption and only authenticates; DTLS is the layer that actually supplies the AEAD cipher suites needed to keep datagrams confidential"
    answer: 0
    explanation: |
      TLS records are tied to an in-order reliable stream, so a lost or reordered
      datagram would desynchronize it. DTLS adapts TLS to datagrams with explicit
      epoch + sequence numbers, an anti-replay window, and timer-based handshake
      retransmission (plus cookie/anti-amplification). QUIC instead integrates TLS 1.3
      directly rather than using DTLS.
    ref: "concepts.md#dtls-securing-datagrams"

  - id: udp-datagram-transport-075
    difficulty: advanced
    tags: [encapsulation, vxlan, gtp, tunneling]
    question: |
      Tunneling protocols like VXLAN (UDP/4789) and GTP-U (UDP/2152) carry an entire
      inner packet as UDP payload. Why is the outer UDP source port often set to a
      hash of the inner flow?
    options:
      - "To encrypt the encapsulated inner packet by deriving a per-flow key from the hash and mixing it into the outer UDP source port field"
      - "To satisfy a VXLAN requirement that the outer UDP checksum be computed from the inner flow hash rather than over the datagram payload"
      - "To let ECMP/L4 load balancers spread the tunneled flows across multiple paths using the outer 5-tuple, since they can't see the inner headers"
      - "To prevent the underlay NAT mapping from expiring by continuously varying the outer source port on every encapsulated datagram"
    answer: 2
    explanation: |
      Underlay routers hash only the outer 5-tuple and can't inspect the encapsulated
      inner packet. By setting the outer source port to a hash of the inner flow, the
      tunnel endpoint injects entropy so ECMP spreads many inner flows across paths
      instead of pinning the whole tunnel to one link.
    ref: "concepts.md#udp-based-protocols-and-encapsulation"

  - id: udp-datagram-transport-076
    difficulty: expert
    tags: [multicast, igmpv3, ssm, scoping]
    question: |
      Which statement about IPv4 multicast is correct?
    options:
      - "IGMPv2 was the version that introduced per-source filtering, and that capability is exactly what enables Source-Specific Multicast in the 232.0.0.0/8 range"
      - "Every address in the 224.0.0.0/4 block is globally routable, so multicast groups can be reached across the public internet just like ordinary unicast destinations"
      - "IGMPv3 (RFC 3376) adds source filtering enabling SSM in 232.0.0.0/8, and 224.0.0.0/24 is link-local and never forwarded off the segment"
      - "Multicast group membership in IPv6 is signalled with IGMP exactly as in IPv4, since MLD is merely IGMP carried inside an IPv6 header"
    answer: 2
    explanation: |
      IGMPv3 added per-source filtering, which enables SSM (source subscribes to a
      (S,G) pair) in 232.0.0.0/8. The 224.0.0.0/24 block is link-local (e.g. OSPF
      224.0.0.5) and never forwarded. IPv6 uses MLD, not IGMP. Multicast is not
      delivered across the public internet.
    ref: "concepts.md#multicast-depth-igmpmld-versions-scoping-and-ssm"
