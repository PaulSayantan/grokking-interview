topic: "Link Layer: Ethernet, MAC, ARP & Switching"
domain: networking
topic_slug: link-layer-ethernet-arp-switching
version: 1
questions:
  - id: link-layer-ethernet-arp-switching-001
    difficulty: beginner
    tags: [ethernet, frame, structure]
    question: |
      What is the standard maximum payload (MTU) of a classic Ethernet II frame?
    options:
      - "1500 bytes"
      - "1518 bytes"
      - "1522 bytes"
      - "9000 bytes"
    answer: 0
    explanation: |
      The classic Ethernet MTU is 1500 bytes of payload. Including the 14-byte
      header and 4-byte FCS (but not the preamble/SFD), the maximum frame is 1518
      bytes — or 1522 with an 802.1Q VLAN tag.
    ref: "concepts.md#ethernet-frame-structure"

  - id: link-layer-ethernet-arp-switching-002
    difficulty: beginner
    tags: [ethernet, frame, fcs]
    question: |
      Which Ethernet frame field is used to detect bit errors in a received frame?
    options:
      - "Preamble"
      - "EtherType"
      - "Frame Check Sequence (FCS)"
      - "Start Frame Delimiter"
    answer: 2
    explanation: |
      The 4-byte FCS carries a CRC-32 computed over the destination MAC through
      the payload. The receiver recomputes it and discards the frame on mismatch.
    ref: "concepts.md#ethernet-frame-structure"

  - id: link-layer-ethernet-arp-switching-003
    difficulty: intermediate
    tags: [ethernet, minimum-frame, csma-cd]
    question: |
      Why does classic Ethernet enforce a 64-byte minimum frame size (padding
      short payloads to 46 bytes)?
    options:
      - "To leave room for a future VLAN tag"
      - "Because the FCS requires at least 64 bytes of input"
      - "So a station is still transmitting when the earliest collision signal returns, guaranteeing detection under CSMA/CD"
      - "To align frames to a 64-byte cache line for faster NIC processing"
    answer: 2
    explanation: |
      On half-duplex CSMA/CD Ethernet, the minimum frame (slot time) ensures a
      transmitting station is still sending when a collision from the far end
      propagates back, so it can detect the collision. Short payloads are padded
      to 46 bytes to reach the 64-byte minimum.
    ref: "concepts.md#ethernet-frame-structure"

  - id: link-layer-ethernet-arp-switching-004
    difficulty: beginner
    tags: [ethernet, ethertype, arp]
    question: |
      Which EtherType value identifies an ARP frame?
    options:
      - "0x0800"
      - "0x86DD"
      - "0x8100"
      - "0x0806"
    answer: 3
    explanation: |
      0x0806 is ARP. For reference: 0x0800 = IPv4, 0x86DD = IPv6, 0x8100 = an
      802.1Q VLAN-tagged frame.
    ref: "concepts.md#ethernet-frame-structure"

  - id: link-layer-ethernet-arp-switching-005
    difficulty: intermediate
    tags: [ethernet, ethertype, length, 802.3]
    question: |
      In the 2-byte field after the source MAC, how does a station tell whether
      the value is an EtherType or an 802.3 length?
    options:
      - "Values >= 1536 (0x0600) are an EtherType; values <= 1500 (0x05DC) are a length"
      - "It is always an EtherType in modern Ethernet; length was removed"
      - "The high bit is set for a length and clear for an EtherType"
      - "It depends on whether the frame carries a VLAN tag"
    answer: 0
    explanation: |
      The field is overloaded. A value of 1536 (0x0600) or greater is interpreted
      as an EtherType (protocol identifier); 1500 (0x05DC) or less is a length,
      indicating the older IEEE 802.3 framing (typically with LLC/SNAP inside).
    ref: "concepts.md#ethernet-frame-structure"

  - id: link-layer-ethernet-arp-switching-006
    difficulty: intermediate
    tags: [ethernet, preamble, framing]
    question: |
      Are the 7-byte preamble and 1-byte Start Frame Delimiter counted in the
      1518-byte maximum frame size?
    options:
      - "Yes, they are part of the 1518-byte total"
      - "They are counted only for jumbo frames"
      - "Only the SFD is counted; the preamble is not"
      - "No — they are physical-layer sync bytes, stripped by the NIC and not counted"
    answer: 3
    explanation: |
      The 8 bytes of preamble + SFD exist purely for clock synchronization and
      frame delimiting at the physical layer. The NIC strips them, and they are
      not included in the 64–1518 byte frame size range.
    ref: "concepts.md#ethernet-frame-structure"

  - id: link-layer-ethernet-arp-switching-007
    difficulty: beginner
    tags: [mac, addressing, size]
    question: |
      How many bits is a standard Ethernet MAC address?
    options:
      - "32 bits"
      - "64 bits"
      - "48 bits"
      - "128 bits"
    answer: 2
    explanation: |
      A MAC address is 48 bits (6 bytes), typically written as six hex octets
      such as 00:1A:2B:3C:4D:5E.
    ref: "concepts.md#mac-addressing"

  - id: link-layer-ethernet-arp-switching-008
    difficulty: beginner
    tags: [mac, oui]
    question: |
      What does the first 3 bytes (24 bits) of a universally-administered MAC
      address represent?
    options:
      - "The Organizationally Unique Identifier (OUI) assigned to the vendor by the IEEE"
      - "A checksum over the remaining bytes"
      - "The VLAN the interface belongs to"
      - "The device's serial number chosen at random"
    answer: 0
    explanation: |
      The first 3 bytes are the OUI, assigned by the IEEE to the manufacturer.
      The vendor assigns the last 3 bytes to make the whole 48-bit address
      globally unique.
    ref: "concepts.md#mac-addressing"

  - id: link-layer-ethernet-arp-switching-009
    difficulty: beginner
    tags: [mac, broadcast]
    question: |
      What is the Ethernet broadcast MAC address?
    options:
      - "00:00:00:00:00:00"
      - "01:00:5E:00:00:00"
      - "FF:FF:FF:FF:FF:FF"
      - "FE:FF:FF:FF:FF:FF"
    answer: 2
    explanation: |
      FF:FF:FF:FF:FF:FF (all 48 bits set) is the broadcast address; every
      interface on the segment accepts frames sent to it.
    ref: "concepts.md#mac-addressing"

  - id: link-layer-ethernet-arp-switching-010
    difficulty: advanced
    tags: [mac, ig-bit, multicast]
    question: |
      A frame has destination MAC 01:00:5E:0A:0B:0C. What does the least-significant
      bit of the first octet (the I/G bit being 1) tell the switch?
    options:
      - "It is a multicast/group address (here, an IPv4 multicast mapping)"
      - "It is a locally administered address"
      - "It is an invalid address and should be dropped"
      - "It is the sender's own address (loopback)"
    answer: 0
    explanation: |
      The first octet 0x01 is odd, so the I/G bit is 1, marking a multicast/group
      address. The 01:00:5E prefix specifically is the IPv4-multicast-to-MAC
      mapping range.
    ref: "concepts.md#mac-addressing"

  - id: link-layer-ethernet-arp-switching-011
    difficulty: advanced
    tags: [mac, ul-bit, locally-administered]
    question: |
      A device advertises the MAC 02:11:22:33:44:55. What does the U/L bit
      (set to 1 here) indicate?
    options:
      - "The address is a broadcast address"
      - "The address is universally administered from an IEEE OUI"
      - "The address is locally administered (software-assigned), not burned-in from an OUI"
      - "The address belongs to a multicast group"
    answer: 2
    explanation: |
      Bit 1 of the first octet is the U/L bit. 0x02 has it set to 1, meaning the
      address is locally administered — e.g. a randomized privacy MAC or a
      virtual NIC — rather than a vendor OUI-based universal address.
    ref: "concepts.md#mac-addressing"

  - id: link-layer-ethernet-arp-switching-012
    difficulty: beginner
    tags: [arp, purpose]
    question: |
      What does ARP (Address Resolution Protocol) resolve?
    options:
      - "A hostname to an IP address"
      - "A MAC address to a manufacturer name"
      - "A known IPv4 address to an unknown MAC address on the same link"
      - "A private IP address to a public IP address"
    answer: 2
    explanation: |
      ARP (RFC 826) maps a known IPv4 address to the corresponding MAC address on
      the local link, so a host can build the Ethernet header to reach a neighbor.
      Hostname-to-IP is DNS; IP-to-IP translation is NAT.
    ref: "concepts.md#arp-request-and-reply"

  - id: link-layer-ethernet-arp-switching-013
    difficulty: beginner
    tags: [arp, request, broadcast]
    question: |
      How is an ARP request delivered on the segment?
    options:
      - "As a unicast to the target's MAC"
      - "It is sent to the default gateway for forwarding"
      - "As a multicast to 01:00:5E:00:00:01"
      - "As a broadcast to FF:FF:FF:FF:FF:FF so every host receives it"
    answer: 3
    explanation: |
      The requester does not yet know the target's MAC, so the ARP request is
      broadcast to FF:FF:FF:FF:FF:FF. Only the host owning the queried IP replies.
    ref: "concepts.md#arp-request-and-reply"

  - id: link-layer-ethernet-arp-switching-014
    difficulty: intermediate
    tags: [arp, reply, unicast]
    question: |
      How is the ARP reply typically delivered back to the requester?
    options:
      - "As a unicast directly to the requester's MAC"
      - "As a broadcast, so all hosts can update their caches"
      - "As a multicast to the all-hosts group"
      - "It is not sent; the requester infers the MAC from timing"
    answer: 0
    explanation: |
      The replying host learned the requester's MAC from the request, so it sends
      the ARP reply as a unicast directly back. (Gratuitous ARP, by contrast, is
      broadcast.)
    ref: "concepts.md#arp-request-and-reply"

  - id: link-layer-ethernet-arp-switching-015
    difficulty: intermediate
    tags: [arp, gateway, subnet]
    question: |
      Host 10.0.0.2/24 needs to send a packet to 192.168.5.9. Whose MAC does it
      resolve with ARP?
    options:
      - "The MAC of 192.168.5.9 directly"
      - "The broadcast MAC, since the destination is remote"
      - "The MAC of its default gateway"
      - "No ARP is needed for remote destinations"
    answer: 2
    explanation: |
      192.168.5.9 is on a different subnet, so the host ARPs for its default
      gateway's MAC. The Ethernet frame is addressed to the gateway, but the IP
      destination remains 192.168.5.9.
    ref: "concepts.md#arp-request-and-reply"

  - id: link-layer-ethernet-arp-switching-016
    difficulty: advanced
    tags: [arp, ipv6, ndp]
    question: |
      Which statement about ARP and IPv6 is correct?
    options:
      - "IPv6 replaces ARP with Neighbor Discovery Protocol (NDP) over ICMPv6"
      - "IPv6 uses the same ARP protocol as IPv4"
      - "IPv6 requires no address resolution because addresses embed the MAC"
      - "IPv6 uses DNS instead of ARP for L2 resolution"
    answer: 0
    explanation: |
      IPv6 does not use ARP. It uses NDP (RFC 4861) with ICMPv6 Neighbor
      Solicitation/Advertisement messages, riding on multicast rather than L2
      broadcast.
    ref: "concepts.md#arp-request-and-reply"

  - id: link-layer-ethernet-arp-switching-017
    difficulty: beginner
    tags: [arp-cache, purpose]
    question: |
      What is the purpose of the ARP cache?
    options:
      - "To store hostname-to-IP mappings from DNS"
      - "To remember which VLAN each MAC belongs to"
      - "To buffer outgoing frames during congestion"
      - "To cache recently resolved IP-to-MAC mappings so hosts need not ARP before every packet"
    answer: 3
    explanation: |
      The ARP cache holds IP-to-MAC mappings with expiry timers, avoiding a fresh
      ARP exchange for every packet to a known neighbor.
    ref: "concepts.md#arp-cache"

  - id: link-layer-ethernet-arp-switching-018
    difficulty: intermediate
    tags: [arp-cache, dynamic, static]
    question: |
      How do dynamic and static ARP entries differ?
    options:
      - "Dynamic entries never expire; static entries expire quickly"
      - "Static entries are learned automatically; dynamic entries are manual"
      - "Dynamic entries are learned from replies and time out; static entries are configured manually and do not expire"
      - "There is no functional difference"
    answer: 2
    explanation: |
      Dynamic entries are learned from ARP replies and age out after a timeout;
      static entries are administratively configured and persist, sometimes used
      to harden critical hosts against spoofing.
    ref: "concepts.md#arp-cache"

  - id: link-layer-ethernet-arp-switching-019
    difficulty: advanced
    tags: [arp-cache, gratuitous-arp, failover]
    question: |
      A load balancer performs a failover and a virtual IP moves from one node to
      another. It broadcasts an unsolicited ARP announcing the VIP with its own
      MAC. What is this called and why?
    options:
      - "A gratuitous ARP, to update neighbors' caches so traffic follows the VIP to the new MAC"
      - "An ARP probe, to check for duplicate IPs before use"
      - "A proxy ARP, to answer on behalf of another host"
      - "A reverse ARP, to obtain an IP from a MAC"
    answer: 0
    explanation: |
      A gratuitous ARP is an unsolicited announcement of a host's own IP-to-MAC
      mapping. After a failover (VRRP/keepalived), it updates neighbor and switch
      caches so traffic for the virtual IP is sent to the new MAC/port.
    ref: "concepts.md#arp-cache"

  - id: link-layer-ethernet-arp-switching-020
    difficulty: beginner
    tags: [hubs, switches, layer]
    question: |
      At which OSI layer does an Ethernet switch operate, and what does it forward
      based on?
    options:
      - "Layer 1; it repeats bits to all ports"
      - "Layer 4; it forwards based on port number"
      - "Layer 3; it forwards packets based on destination IP"
      - "Layer 2; it forwards frames based on destination MAC"
    answer: 3
    explanation: |
      A switch is a Layer 2 device. It reads each frame's destination MAC and
      forwards it out only the port where that MAC resides. A hub (L1) blindly
      repeats bits to all ports.
    ref: "concepts.md#hubs-vs-switches"

  - id: link-layer-ethernet-arp-switching-021
    difficulty: intermediate
    tags: [hubs, switches, collision-domain]
    question: |
      Compared with a hub, how does a switch affect collision domains?
    options:
      - "A switch merges all ports into one collision domain"
      - "Switches and hubs both create one collision domain per device"
      - "A switch gives each port its own collision domain, enabling full-duplex"
      - "A switch eliminates broadcast domains instead of collision domains"
    answer: 2
    explanation: |
      A hub is a single shared collision domain (half-duplex CSMA/CD). A switch
      isolates each port into its own collision domain, so ports run full-duplex
      with dedicated bandwidth.
    ref: "concepts.md#hubs-vs-switches"

  - id: link-layer-ethernet-arp-switching-022
    difficulty: intermediate
    tags: [hubs, switches, bandwidth]
    question: |
      Eight devices connect to a single 1 Gbps hub versus a single 1 Gbps switch.
      Which statement is correct?
    options:
      - "On the hub the 1 Gbps is shared among all devices (half-duplex); on the switch each port gets dedicated full-duplex bandwidth"
      - "On the hub each device gets a dedicated 1 Gbps; on the switch they share 1 Gbps"
      - "Both give each device a dedicated 1 Gbps full-duplex link"
      - "Both share the 1 Gbps equally with no difference"
    answer: 0
    explanation: |
      A hub shares one collision domain, so total bandwidth is shared and
      half-duplex. A switch dedicates bandwidth per port and runs full-duplex,
      forwarding independent conversations simultaneously.
    ref: "concepts.md#hubs-vs-switches"

  - id: link-layer-ethernet-arp-switching-023
    difficulty: beginner
    tags: [cam-table, mac-learning]
    question: |
      How does a switch populate its MAC address (CAM) table?
    options:
      - "By reading the destination MAC of each frame"
      - "By running ARP for every connected host"
      - "By querying a central DHCP server"
      - "By recording the source MAC and ingress port of each incoming frame"
    answer: 3
    explanation: |
      The switch learns by mapping the source MAC of each arriving frame to the
      port it came in on. It then uses the destination MAC for the forwarding
      decision.
    ref: "concepts.md#mac-learning-and-the-cam-table"

  - id: link-layer-ethernet-arp-switching-024
    difficulty: intermediate
    tags: [cam-table, unknown-unicast, flooding]
    question: |
      A switch receives a unicast frame whose destination MAC is not in its CAM
      table. What does it do?
    options:
      - "Drops the frame"
      - "Sends an ARP request for the destination"
      - "Floods the frame out all ports except the ingress port"
      - "Returns the frame to the sender"
    answer: 2
    explanation: |
      An unknown-unicast frame is flooded out all ports in the VLAN except the
      one it arrived on. The eventual reply lets the switch learn the destination's
      port for future frames.
    ref: "concepts.md#mac-learning-and-the-cam-table"

  - id: link-layer-ethernet-arp-switching-025
    difficulty: advanced
    tags: [cam-table, aging, learning]
    question: |
      Why do CAM-table entries have an aging timer (commonly ~5 minutes)?
    options:
      - "To keep the table small enough to fit in DRAM"
      - "To force periodic re-flooding of all traffic"
      - "So the table adapts when devices move ports or leave, preventing forwarding to stale locations"
      - "Because MAC addresses change every few minutes"
    answer: 2
    explanation: |
      Aging removes entries not refreshed by traffic, so the table reflects the
      current topology when hosts move ports or go offline. Frames to an aged-out
      MAC are flooded until relearned.
    ref: "concepts.md#mac-learning-and-the-cam-table"

  - id: link-layer-ethernet-arp-switching-026
    difficulty: advanced
    tags: [cam-table, tcam, hardware]
    question: |
      What distinguishes CAM (used for L2 MAC lookups) from TCAM (used in L3
      switches)?
    options:
      - "TCAM supports 'don't-care' wildcard bits, enabling longest-prefix matching and ACLs, whereas CAM does exact-match lookups"
      - "CAM stores IP routes; TCAM stores MAC addresses"
      - "CAM is software; TCAM is a database"
      - "There is no difference; the terms are interchangeable"
    answer: 0
    explanation: |
      CAM does exact-match lookups (perfect for a full 48-bit MAC). TCAM adds a
      third 'don't-care' state per bit, supporting longest-prefix IP matching and
      ACL rules — used for L3 routing/filtering hardware.
    ref: "concepts.md#mac-learning-and-the-cam-table"

  - id: link-layer-ethernet-arp-switching-027
    difficulty: beginner
    tags: [broadcast-domain, collision-domain]
    question: |
      Which device separates broadcast domains?
    options:
      - "A hub"
      - "A switch (by default, without VLANs)"
      - "A router (or a VLAN boundary)"
      - "A repeater"
    answer: 2
    explanation: |
      Routers do not forward broadcasts, so each router interface (or a VLAN
      boundary) bounds a broadcast domain. A plain switch forwards broadcasts to
      the whole segment, keeping it in one broadcast domain.
    ref: "concepts.md#broadcast-vs-collision-domains"

  - id: link-layer-ethernet-arp-switching-028
    difficulty: intermediate
    tags: [broadcast-domain, switch, ports]
    question: |
      A 24-port switch with no VLANs configured has how many collision domains
      and broadcast domains?
    options:
      - "1 collision domain and 24 broadcast domains"
      - "1 collision domain and 1 broadcast domain"
      - "24 collision domains and 24 broadcast domains"
      - "24 collision domains and 1 broadcast domain"
    answer: 3
    explanation: |
      Each switch port is its own collision domain (24 total), but by default all
      ports share a single broadcast domain since the switch floods broadcasts to
      every port.
    ref: "concepts.md#broadcast-vs-collision-domains"

  - id: link-layer-ethernet-arp-switching-029
    difficulty: intermediate
    tags: [broadcast-domain, vlan]
    question: |
      A switch is configured with 3 VLANs across its ports. How many broadcast
      domains does it now have?
    options:
      - "3"
      - "1"
      - "Equal to the number of ports"
      - "0 — VLANs do not affect broadcast domains"
    answer: 0
    explanation: |
      Each VLAN is a separate broadcast domain (and typically a separate IP
      subnet). Three VLANs therefore create three broadcast domains; traffic
      between them must be routed.
    ref: "concepts.md#broadcast-vs-collision-domains"

  - id: link-layer-ethernet-arp-switching-030
    difficulty: beginner
    tags: [vlan, definition]
    question: |
      What does a VLAN provide?
    options:
      - "Faster physical cabling"
      - "Automatic IP address assignment"
      - "A logically isolated broadcast domain within shared physical switch infrastructure"
      - "Encryption of frames between ports"
    answer: 2
    explanation: |
      A VLAN logically partitions a switch into isolated broadcast domains. Hosts
      in different VLANs cannot reach one another at L2; inter-VLAN traffic must be
      routed.
    ref: "concepts.md#vlans-and-8021q-trunking"

  - id: link-layer-ethernet-arp-switching-031
    difficulty: intermediate
    tags: [vlan, 802.1q, tag]
    question: |
      Where does an 802.1Q tag insert its 4 bytes into an Ethernet frame?
    options:
      - "Before the destination MAC"
      - "Inside the payload, after the IP header"
      - "After the FCS"
      - "Between the source MAC and the EtherType/Length field"
    answer: 3
    explanation: |
      The 802.1Q tag is inserted between the source MAC address and the
      EtherType/Length field. It begins with TPID 0x8100, followed by PCP, DEI,
      and the 12-bit VLAN ID.
    ref: "concepts.md#vlans-and-8021q-trunking"

  - id: link-layer-ethernet-arp-switching-032
    difficulty: intermediate
    tags: [vlan, vid, range]
    question: |
      The 802.1Q VLAN ID field is 12 bits. How many usable VLAN IDs does that give?
    options:
      - "4094 (0 and 4095 are reserved)"
      - "4096"
      - "1024"
      - "65534"
    answer: 0
    explanation: |
      12 bits allow 4096 values (0–4095), but VID 0 and 4095 are reserved,
      leaving 4094 usable VLAN IDs.
    ref: "concepts.md#vlans-and-8021q-trunking"

  - id: link-layer-ethernet-arp-switching-033
    difficulty: intermediate
    tags: [vlan, access-port, trunk-port]
    question: |
      What is the difference between an access port and a trunk port?
    options:
      - "An access port carries multiple tagged VLANs; a trunk carries one untagged VLAN"
      - "Both carry all VLANs but a trunk is faster"
      - "An access port carries a single VLAN untagged to the host; a trunk carries multiple VLANs, tagging frames with their VID"
      - "An access port is for routers; a trunk is for end hosts"
    answer: 2
    explanation: |
      An access port belongs to one VLAN and delivers untagged frames to the end
      host. A trunk port carries many VLANs between switches (or to a
      router/hypervisor), tagging each frame with its VID.
    ref: "concepts.md#vlans-and-8021q-trunking"

  - id: link-layer-ethernet-arp-switching-034
    difficulty: advanced
    tags: [vlan, native-vlan, trunk]
    question: |
      On an 802.1Q trunk, what is special about the native VLAN?
    options:
      - "Its frames are sent double-tagged"
      - "It is always VLAN 4095"
      - "It cannot carry any user traffic"
      - "Its frames are sent untagged across the trunk"
    answer: 3
    explanation: |
      Frames belonging to the native VLAN traverse a trunk untagged (default
      native VLAN is 1). Native-VLAN mismatches are a classic misconfiguration and
      a vector for VLAN-hopping attacks.
    ref: "concepts.md#vlans-and-8021q-trunking"

  - id: link-layer-ethernet-arp-switching-035
    difficulty: advanced
    tags: [vlan, tag, frame-size]
    question: |
      An 802.1Q-tagged frame can be up to how many bytes (excluding preamble/SFD),
      and why does it exceed the usual 1518?
    options:
      - "1522 bytes; the 4-byte VLAN tag adds to the frame"
      - "1518 bytes; the tag replaces existing header bytes"
      - "9000 bytes; VLAN tagging requires jumbo frames"
      - "1500 bytes; the tag is inside the payload"
    answer: 0
    explanation: |
      The 4-byte 802.1Q tag is added to the header, so a tagged frame can reach
      1522 bytes versus the untagged maximum of 1518.
    ref: "concepts.md#vlans-and-8021q-trunking"

  - id: link-layer-ethernet-arp-switching-036
    difficulty: intermediate
    tags: [l2-l3, forwarding, mac]
    question: |
      Which addresses change as a packet is routed hop-by-hop across multiple
      routers (no NAT)?
    options:
      - "The IP source/destination change; the MAC addresses stay the same"
      - "Both IP and MAC addresses are rewritten at every hop"
      - "Both IP and MAC addresses stay constant end-to-end"
      - "The MAC source/destination are rewritten at every hop; the IP source/destination stay the same"
    answer: 3
    explanation: |
      L2 (MAC) addresses are locally significant and rewritten at each router hop.
      The IP source/destination remain constant end-to-end (barring NAT), which is
      what allows the packet to reach the correct final host.
    ref: "concepts.md#l2-vs-l3-forwarding"

  - id: link-layer-ethernet-arp-switching-037
    difficulty: intermediate
    tags: [l2-l3, ttl, routing]
    question: |
      Which of the following is the fingerprint of an L3 (routing) hop, as opposed
      to an L2 (switching) hop?
    options:
      - "The FCS is recomputed"
      - "The VLAN tag is stripped"
      - "The IPv4 TTL is decremented (and header checksum recomputed)"
      - "The payload is encrypted"
    answer: 2
    explanation: |
      A router decrements the IPv4 TTL by one at each hop and recomputes the IP
      header checksum. A switch does neither — it forwards the frame unchanged at
      L2 (aside from any VLAN tag handling).
    ref: "concepts.md#l2-vs-l3-forwarding"

  - id: link-layer-ethernet-arp-switching-038
    difficulty: intermediate
    tags: [l2-l3, same-subnet, gateway]
    question: |
      Host A (10.0.0.2/24) sends to Host B (10.0.0.8/24) on the same switch. How is
      the frame addressed at L2?
    options:
      - "Destination MAC = the default gateway's MAC"
      - "Destination MAC = Host B's MAC, learned via ARP"
      - "Destination MAC = broadcast, since they share a subnet"
      - "No L2 header is needed within a subnet"
    answer: 1
    explanation: |
      Same-subnet delivery is switched: A ARPs for B directly and addresses the
      frame to B's MAC. Only off-subnet destinations use the gateway's MAC.
    ref: "concepts.md#l2-vs-l3-forwarding"

  - id: link-layer-ethernet-arp-switching-039
    difficulty: advanced
    tags: [l2-l3, l3-switch]
    question: |
      What is an L3 switch?
    options:
      - "A hub with more ports"
      - "A switch with routing hardware (e.g. TCAM) that can perform inter-VLAN routing at near-wire speed"
      - "A router that has no switching capability"
      - "A switch that only forwards IPv6"
    answer: 1
    explanation: |
      An L3 switch combines L2 switching with hardware-accelerated IP routing
      (typically using TCAM), enabling fast inter-VLAN routing while still
      switching within each VLAN.
    ref: "concepts.md#l2-vs-l3-forwarding"

  - id: link-layer-ethernet-arp-switching-040
    difficulty: advanced
    tags: [l2-l3, scenario, capture]
    question: |
      In a capture on the link between a router and a remote host, you see the
      IP destination is a server three networks away but the Ethernet destination
      MAC belongs to the local router interface. Which statement is correct?
    options:
      - "The capture is corrupted; the MAC and IP must match the same device"
      - "The host is misconfigured and sending to the wrong gateway"
      - "The packet will be dropped because the MAC and IP differ"
      - "This is normal — the frame is L2-addressed to the next hop while the IP names the final destination"
    answer: 3
    explanation: |
      This is expected behavior. L2 addressing targets the next hop (the router),
      while the IP destination remains the final host. Each hop rewrites the L2
      header; the IP header is unchanged (except TTL).
    ref: "concepts.md#l2-vs-l3-forwarding"

  - id: link-layer-ethernet-arp-switching-041
    difficulty: beginner
    tags: [arp-spoofing, security]
    question: |
      Why is ARP vulnerable to spoofing?
    options:
      - "ARP replies are encrypted but the key is public"
      - "ARP has no authentication, so any host can send a forged reply claiming to own an IP"
      - "ARP requires a password that is often left blank"
      - "ARP only works over wireless, which is insecure"
    answer: 1
    explanation: |
      ARP has no authentication or verification. An attacker can send unsolicited
      or crafted ARP replies binding a victim's or gateway's IP to the attacker's
      MAC, poisoning caches.
    ref: "concepts.md#arp-spoofing"

  - id: link-layer-ethernet-arp-switching-042
    difficulty: intermediate
    tags: [arp-spoofing, mitm, scenario]
    question: |
      An attacker on the LAN sends forged ARP replies to a victim mapping the
      gateway's IP to the attacker's MAC, and to the gateway mapping the victim's
      IP to the attacker's MAC. What is the result?
    options:
      - "A man-in-the-middle position, with the attacker relaying traffic in both directions"
      - "A routing loop across the internet"
      - "The victim gets a new public IP"
      - "The gateway reboots"
    answer: 0
    explanation: |
      Poisoning both directions places the attacker in the middle: victim-to-gateway
      and gateway-to-victim traffic both flow through the attacker, who can read or
      modify it before relaying.
    ref: "concepts.md#arp-spoofing"

  - id: link-layer-ethernet-arp-switching-043
    difficulty: advanced
    tags: [arp-spoofing, dai, mitigation]
    question: |
      Which switch feature validates ARP packets against a trusted DHCP-snooping
      binding table to block forged ARP replies?
    options:
      - "Spanning Tree Protocol"
      - "Dynamic ARP Inspection (DAI)"
      - "Port mirroring"
      - "Link aggregation"
    answer: 1
    explanation: |
      Dynamic ARP Inspection checks ARP packets against the IP/MAC/port bindings
      built by DHCP snooping and drops those that don't match, defeating ARP
      spoofing on trusted ports.
    ref: "concepts.md#arp-spoofing"

  - id: link-layer-ethernet-arp-switching-044
    difficulty: advanced
    tags: [arp-spoofing, scope, encryption]
    question: |
      Which statement about the scope and mitigation of ARP spoofing is correct?
    options:
      - "It can be launched from anywhere on the internet against any host"
      - "Only static IP hosts are vulnerable; DHCP hosts are immune"
      - "Enabling jumbo frames prevents it"
      - "It is a local-segment attack that cannot cross a router; encryption (TLS/IPsec) prevents the attacker from reading intercepted traffic"
    answer: 3
    explanation: |
      ARP spoofing works only within a broadcast domain and does not cross a
      router. Encryption doesn't stop the poisoning but ensures the MITM sees only
      ciphertext, protecting confidentiality and integrity.
    ref: "concepts.md#arp-spoofing"

  - id: link-layer-ethernet-arp-switching-045
    difficulty: beginner
    tags: [mtu, definition]
    question: |
      What does MTU (Maximum Transmission Unit) refer to?
    options:
      - "The maximum number of hosts on a subnet"
      - "The largest payload a link can carry in a single frame"
      - "The maximum transmission speed of a link"
      - "The maximum number of VLANs on a trunk"
    answer: 1
    explanation: |
      MTU is the largest payload (e.g. IP packet) that fits in one link-layer
      frame. Standard Ethernet MTU is 1500 bytes.
    ref: "concepts.md#mtu-and-framing"

  - id: link-layer-ethernet-arp-switching-046
    difficulty: intermediate
    tags: [mtu, mss, tcp]
    question: |
      For standard IPv4 over Ethernet with no options, what is the TCP MSS derived
      from a 1500-byte MTU?
    options:
      - "1500 bytes"
      - "1480 bytes"
      - "1460 bytes"
      - "1518 bytes"
    answer: 2
    explanation: |
      MSS = MTU − IP header (20) − TCP header (20) = 1500 − 40 = 1460 bytes for
      standard IPv4/TCP with no options.
    ref: "concepts.md#mtu-and-framing"

  - id: link-layer-ethernet-arp-switching-047
    difficulty: advanced
    tags: [mtu, pmtud, icmp]
    question: |
      In IPv4 Path MTU Discovery, what happens when a router must forward a
      DF-marked packet larger than the next-hop MTU?
    options:
      - "It fragments the packet and forwards the pieces"
      - "It drops the packet and returns an ICMP 'Fragmentation needed' (Type 3, Code 4) with the next-hop MTU"
      - "It buffers the packet until the MTU increases"
      - "It strips the DF bit and forwards it"
    answer: 1
    explanation: |
      With DF set, the router cannot fragment, so it drops the packet and sends
      ICMP Type 3 Code 4 back to the source, reporting the next-hop MTU. The source
      lowers its packet size accordingly.
    ref: "concepts.md#mtu-and-framing"

  - id: link-layer-ethernet-arp-switching-048
    difficulty: advanced
    tags: [mtu, pmtud, blackhole, scenario]
    question: |
      Over a VPN tunnel, small requests and TLS handshakes succeed but large file
      transfers hang. A firewall drops ICMP. What is the most likely cause?
    options:
      - "The DNS server is unreachable"
      - "The TCP window is set too large"
      - "ARP cache poisoning on the gateway"
      - "A PMTUD black hole — the tunnel lowered the path MTU, but blocked ICMP prevents the sender from learning to shrink its packets, so full-size segments are silently dropped"
    answer: 3
    explanation: |
      Tunnels reduce the path MTU. Full-size TCP segments with DF set are dropped,
      but the ICMP 'Frag needed' messages that would tell the sender are blocked,
      so PMTUD fails silently. Small packets fit and succeed; bulk transfer stalls.
      Fixes include MSS clamping or allowing the ICMP messages.
    ref: "concepts.md#mtu-and-framing"

  - id: link-layer-ethernet-arp-switching-049
    difficulty: intermediate
    tags: [mtu, jumbo-frames]
    question: |
      What are jumbo frames and where are they typically used?
    options:
      - "Frames smaller than 64 bytes, used for control traffic"
      - "Frames with payloads up to ~9000 bytes, used in data-center/storage networks to reduce per-packet overhead"
      - "Frames that carry multiple VLAN tags"
      - "Standard 1518-byte frames on gigabit links"
    answer: 1
    explanation: |
      Jumbo frames carry payloads up to about 9000 bytes, cutting per-packet
      overhead and CPU in data-center and storage networks. They are non-standard
      and require consistent end-to-end support.
    ref: "concepts.md#mtu-and-framing"

  - id: link-layer-ethernet-arp-switching-050
    difficulty: advanced
    tags: [mtu, mss-clamping, tunnel]
    question: |
      Why do operators often configure MSS clamping on routers at the edge of a
      PPPoE or tunnel link?
    options:
      - "To increase throughput by allowing larger segments"
      - "To force endpoints to negotiate a smaller TCP MSS so segments fit the reduced tunnel MTU, avoiding fragmentation and PMTUD black holes"
      - "To encrypt the TCP handshake"
      - "To disable TCP entirely over the tunnel"
    answer: 1
    explanation: |
      The router rewrites the MSS option in TCP SYNs to a value that fits the
      reduced MTU (e.g. 1492 for PPPoE, less for tunnels). This prevents oversize
      segments that would be fragmented or silently dropped when ICMP is filtered.
    ref: "concepts.md#mtu-and-framing"

  - id: link-layer-ethernet-arp-switching-051
    difficulty: beginner
    tags: [ethernet, ethertype, ipv6]
    question: |
      Which EtherType indicates an IPv6 payload?
    options:
      - "0x0800"
      - "0x0806"
      - "0x86DD"
      - "0x8100"
    answer: 2
    explanation: |
      0x86DD is the EtherType for IPv6. 0x0800 is IPv4, 0x0806 is ARP, and 0x8100
      marks an 802.1Q VLAN tag.
    ref: "concepts.md#ethernet-frame-structure"

  - id: link-layer-ethernet-arp-switching-052
    difficulty: intermediate
    tags: [cam-table, mac-flooding, security]
    question: |
      A MAC-flooding attack sends huge numbers of frames with random source MACs.
      What is the intended effect on a switch?
    options:
      - "It resets the switch to factory defaults"
      - "It changes the switch's IP address"
      - "It merges all VLANs into one"
      - "It overflows the CAM table so the switch floods traffic to all ports, letting the attacker sniff frames"
    answer: 3
    explanation: |
      By exhausting the CAM table with bogus entries, the attacker forces the
      switch into fail-open flooding (behaving like a hub), so unicast traffic is
      broadcast to all ports and can be captured. Port security mitigates this.
    ref: "concepts.md#mac-learning-and-the-cam-table"

  - id: link-layer-ethernet-arp-switching-053
    difficulty: expert
    tags: [stp, loop, broadcast-storm]
    question: |
      Why is a single mispatched cable that creates a bridging loop catastrophic
      at L2, whereas an equivalent routing loop at L3 is self-limiting?
    options:
      - "L2 switches lack a routing table, so they cannot detect the loop, but routers can"
      - "Ethernet frames have no TTL/hop-count field, so looped BUM traffic circulates forever, causing a broadcast storm and MAC-table flapping; IP's TTL kills looped packets within a bounded hop count"
      - "L2 loops corrupt the FCS on every pass, whereas IP checksums are recomputed"
      - "Switches forward at wire speed while routers rate-limit, so only the switch saturates"
    answer: 1
    explanation: |
      An Ethernet frame has no TTL. A broadcast/unknown-unicast/multicast frame on
      a looped topology is flooded endlessly, multiplying into a broadcast storm and
      making the same source MAC appear on multiple ports (CAM flapping). IP packets
      carry a TTL that decrements each hop and drops the packet at zero, so routing
      loops self-terminate. STP/RSTP exist to give L2 the loop-prevention IP gets for free.
    ref: "concepts.md#spanning-tree-loop-prevention-stp-rstp-mstp"

  - id: link-layer-ethernet-arp-switching-054
    difficulty: advanced
    tags: [stp, root-bridge, bridge-id]
    question: |
      In STP (802.1D), how is the root bridge elected and what is a Bridge ID
      composed of?
    options:
      - "The bridge with the highest MAC address wins; Bridge ID is just the 6-byte MAC"
      - "The bridge with the most ports wins; Bridge ID is a port count plus MAC"
      - "The first bridge to boot wins and advertises itself permanently as root"
      - "The bridge with the numerically lowest Bridge ID wins; Bridge ID = 2-byte priority (default 32768, set in steps of 4096) followed by the 6-byte MAC, ties broken by lowest MAC"
    answer: 3
    explanation: |
      Every bridge initially claims to be root; the lowest Bridge ID wins. Bridge ID
      is a 2-byte priority (default 32768, adjustable in 4096 increments because the
      low 12 bits are the 802.1t extended system ID) plus the 6-byte MAC, with the
      MAC breaking priority ties.
    ref: "concepts.md#spanning-tree-loop-prevention-stp-rstp-mstp"

  - id: link-layer-ethernet-arp-switching-055
    difficulty: advanced
    tags: [stp, port-states, convergence]
    question: |
      With default 802.1D timers (hello 2 s, forward delay 15 s, max age 20 s),
      roughly how long does a port take to go from blocking to forwarding, and why?
    options:
      - "About 30–50 seconds — up to max-age plus one forward-delay in listening and another in learning"
      - "About 2 seconds — one hello interval"
      - "Instantly — 802.1D ports forward as soon as a link comes up"
      - "About 5 minutes — matching the CAM aging timer"
    answer: 0
    explanation: |
      Classic STP moves blocking → listening → learning → forwarding, spending one
      15 s forward-delay in listening and another in learning (plus up to max-age
      waiting to detect a change), giving the well-known 30–50 s convergence. This is
      why a host can miss PXE/DHCP on boot until the port converges (fixed by PortFast).
    ref: "concepts.md#spanning-tree-loop-prevention-stp-rstp-mstp"

  - id: link-layer-ethernet-arp-switching-056
    difficulty: expert
    tags: [rstp, convergence, proposal-agreement]
    question: |
      How does RSTP (802.1w) achieve sub-second convergence on a point-to-point link
      compared with classic STP?
    options:
      - "It shortens all timers to 1 second while keeping the same state machine"
      - "It uses three states (discarding/learning/forwarding), adds alternate/backup port roles, and uses a proposal/agreement handshake on point-to-point links to unblock a port immediately without waiting out forward-delay timers"
      - "It disables loop detection entirely and relies on BPDU Guard"
      - "It floods a special fast-forward BPDU that resets every switch's CAM table"
    answer: 1
    explanation: |
      RSTP collapses the states to discarding/learning/forwarding, precomputes
      alternate and backup roles for fast failover, and performs a proposal/agreement
      handshake between adjacent bridges on full-duplex point-to-point links. That
      handshake lets a port transition to forwarding immediately rather than timing
      out forward-delay, yielding sub-second convergence.
    ref: "concepts.md#spanning-tree-loop-prevention-stp-rstp-mstp"

  - id: link-layer-ethernet-arp-switching-057
    difficulty: expert
    tags: [mstp, region, vlan]
    question: |
      Two switches running MSTP (802.1s) are trunked together but end up in different
      MST regions, so they interoperate only via a single common instance. Which
      mismatch most likely caused this?
    options:
      - "Their region name, revision number, or VLAN-to-instance mapping digest do not match"
      - "They have different management IP addresses"
      - "One uses copper and the other fiber uplinks"
      - "Their CAM aging timers differ"
    answer: 0
    explanation: |
      Switches belong to the same MST region only if their region name, revision
      number, and VLAN-to-instance mapping (compared via an MD5 digest) are identical.
      Any mismatch — commonly a differing VLAN-to-instance map — splits them into
      separate regions that interoperate only through the common/IST instance.
    ref: "concepts.md#spanning-tree-loop-prevention-stp-rstp-mstp"

  - id: link-layer-ethernet-arp-switching-058
    difficulty: advanced
    tags: [stp, bpdu-guard, security]
    question: |
      A PortFast-enabled access port suddenly goes err-disabled the moment a user
      plugs a small unmanaged switch into it. Which feature did this, and why?
    options:
      - "Root Guard, because the new switch tried to become root"
      - "Loop Guard, because BPDUs stopped arriving"
      - "Port Security, because the switch had too many MACs"
      - "BPDU Guard, because a PortFast/edge port received a BPDU, which should never happen on a host-facing port"
    answer: 3
    explanation: |
      BPDU Guard err-disables a PortFast/edge port the instant it receives any BPDU.
      Edge ports are supposed to face end hosts, so a BPDU means another bridge was
      connected — a topology risk. Root Guard (only rejects superior BPDUs) and Loop
      Guard (acts when BPDUs stop) address different failure modes.
    ref: "concepts.md#spanning-tree-loop-prevention-stp-rstp-mstp"

  - id: link-layer-ethernet-arp-switching-059
    difficulty: advanced
    tags: [stp, portfast, edge-port, scenario]
    question: |
      Workstations on a set of access ports intermittently fail DHCP/PXE at boot but
      work fine seconds later. STP is running with defaults. What is the fix?
    options:
      - "Lower the switch's MTU to 1492"
      - "Enable PortFast/edge on the host-facing access ports so they skip the listening/learning delay"
      - "Increase the ARP cache timeout on the workstations"
      - "Disable full-duplex on those ports"
    answer: 1
    explanation: |
      With default STP, the port sits in listening/learning (~30 s) before
      forwarding, so DHCP/PXE that runs at boot times out. Enabling PortFast/edge on
      host-facing ports transitions them straight to forwarding. Pair it with BPDU
      Guard so a rogue switch on that port is still caught.
    ref: "concepts.md#spanning-tree-loop-prevention-stp-rstp-mstp"

  - id: link-layer-ethernet-arp-switching-060
    difficulty: expert
    tags: [stp, bpdu, multicast-mac]
    question: |
      To which destination MAC are STP/RSTP Configuration and TCN BPDUs sent?
    options:
      - "FF:FF:FF:FF:FF:FF (broadcast)"
      - "01:00:5E:00:00:00 (IPv4 multicast base)"
      - "01:80:C2:00:00:00 (the reserved IEEE bridge-group multicast)"
      - "33:33:00:00:00:01 (IPv6 all-nodes)"
    answer: 2
    explanation: |
      Spanning-tree BPDUs use the reserved bridge-group multicast address
      01:80:C2:00:00:00. This is a link-local reserved range that switches process
      locally and do not forward, distinguishing it from IP multicast (01:00:5E /
      33:33) and broadcast.
    ref: "concepts.md#spanning-tree-loop-prevention-stp-rstp-mstp"

  - id: link-layer-ethernet-arp-switching-061
    difficulty: expert
    tags: [vlan-hopping, double-tagging, security]
    question: |
      In an 802.1Q double-tagging VLAN-hopping attack, how does a frame with two tags
      reach a VLAN the attacker is not a member of?
    options:
      - "Both switches read only the inner tag, so the outer tag is decorative"
      - "The first switch strips the outer tag (which matches the trunk's native/untagged VLAN) and forwards over the trunk; the second switch then reads the inner tag and delivers the frame to the target VLAN"
      - "The frame is routed at L3 based on the outer tag's VLAN subnet"
      - "The switch duplicates the frame into every VLAN listed in either tag"
    answer: 1
    explanation: |
      The attacker crafts outer tag = native VLAN, inner tag = target VLAN. Switch 1
      removes the outer tag because native-VLAN frames egress the trunk untagged, and
      forwards the still-inner-tagged frame. Switch 2 sees a single tag and delivers
      it to the target VLAN. The attack is unidirectional (no return path) and relies
      entirely on the native VLAN being untagged.
    ref: "concepts.md#vlan-hopping-attacks"

  - id: link-layer-ethernet-arp-switching-062
    difficulty: advanced
    tags: [vlan-hopping, dtp, switch-spoofing]
    question: |
      An attacker connects to an access port left at its default trunking setting and
      suddenly sees traffic for every VLAN. Which attack is this and how is it prevented?
    options:
      - "Double-tagging; prevented by enabling jumbo frames"
      - "MAC flooding; prevented by DAI"
      - "Switch spoofing via DTP; prevented by hard-setting switchport mode access and disabling DTP with switchport nonegotiate"
      - "ARP poisoning; prevented by static ARP entries"
    answer: 2
    explanation: |
      Dynamic Trunking Protocol can auto-negotiate a trunk on a port left at
      dynamic auto/desirable. The attacker sends DTP frames to form a trunk and gains
      all-VLAN visibility. Hard-set the port to access mode and disable DTP
      (switchport nonegotiate) to close it.
    ref: "concepts.md#vlan-hopping-attacks"

  - id: link-layer-ethernet-arp-switching-063
    difficulty: expert
    tags: [vlan, native-vlan, security]
    question: |
      Which native-VLAN hardening measures specifically defeat 802.1Q double-tagging?
    options:
      - "Set the trunk native VLAN to an unused ID (not VLAN 1) and/or force the native VLAN to be tagged (e.g. vlan dot1q tag native)"
      - "Increase the number of usable VLAN IDs from 4094 to 4096"
      - "Enable Proxy ARP on the trunk"
      - "Move all hosts onto the native VLAN"
    answer: 0
    explanation: |
      Double-tagging works only because native-VLAN frames traverse the trunk
      untagged. Assigning the native VLAN to an unused, non-1 ID that no access port
      uses (so an attacker cannot originate outer-tag = native), and/or tagging the
      native VLAN so it is never sent untagged, removes the prerequisite for the attack.
    ref: "concepts.md#vlan-hopping-attacks"

  - id: link-layer-ethernet-arp-switching-064
    difficulty: expert
    tags: [mac-flooding, fail-open, port-security]
    question: |
      Why does a CAM-overflow (macof) attack turn a switch into an effective hub, and
      what is the precise mechanism that lets the attacker sniff other hosts' unicast?
    options:
      - "The switch reboots into a diagnostic hub mode after overflow"
      - "Once the CAM table is full it cannot learn new source-MAC/port mappings, so legitimate destination MACs are unknown-unicast and get flooded out every port in the VLAN — including the attacker's"
      - "The overflow rewrites the switch's ARP cache to point all IPs at the attacker"
      - "The attack disables the FCS check so corrupt sniffed frames are accepted"
    answer: 1
    explanation: |
      A full CAM table can no longer install the real hosts' MAC-to-port entries, so
      frames destined to those MACs are treated as unknown unicast and flooded to all
      ports in the VLAN. The attacker's port therefore receives copies of other hosts'
      unicast traffic. Port Security (MAC limits, sticky MAC) prevents the table from
      being exhausted.
    ref: "concepts.md#mac-flooding-and-port-security"

  - id: link-layer-ethernet-arp-switching-065
    difficulty: advanced
    tags: [port-security, violation-modes]
    question: |
      A port-security policy is set to 'restrict'. What happens when a frame arrives
      from a MAC beyond the configured limit?
    options:
      - "The port is immediately err-disabled (shut down)"
      - "The frame is accepted and the oldest learned MAC is evicted"
      - "The switch reboots to clear the violation"
      - "The offending frames are dropped and a counter/alert is incremented, but the port stays up"
    answer: 3
    explanation: |
      'restrict' drops violating frames and raises a counter/SNMP notification while
      keeping the port forwarding for allowed MACs. 'protect' drops silently (no
      alert), and 'shutdown' (the default) err-disables the entire port.
    ref: "concepts.md#mac-flooding-and-port-security"

  - id: link-layer-ethernet-arp-switching-066
    difficulty: advanced
    tags: [8021q, isl, encapsulation]
    question: |
      Which statement correctly contrasts IEEE 802.1Q with the legacy Cisco ISL?
    options:
      - "802.1Q wraps the whole frame with a 30-byte external header/CRC; ISL inserts a 4-byte inline tag"
      - "Both are IEEE standards, differing only in the size of the VLAN ID field"
      - "802.1Q inserts a 4-byte tag inline and supports an untagged native VLAN; ISL is a deprecated Cisco scheme that externally encapsulates the entire frame (26-byte header + 4-byte CRC) and has no native-VLAN concept"
      - "ISL is the current IEEE standard and 802.1Q is deprecated"
    answer: 2
    explanation: |
      802.1Q inserts a 4-byte tag between src MAC and EtherType and carries a native
      (untagged) VLAN. ISL is Cisco-proprietary and now obsolete: it externally
      encapsulates the whole original frame with a 26-byte header plus a 4-byte CRC
      and has no untagged native VLAN. The standard, lower-overhead 802.1Q won.
    ref: "concepts.md#8021q-vs-isl"

  - id: link-layer-ethernet-arp-switching-067
    difficulty: expert
    tags: [lacp, link-aggregation, hashing]
    question: |
      Two 10G links are bonded with LACP, but a single large backup (one TCP flow)
      still tops out near 10G. Why?
    options:
      - "Frames are distributed by a per-flow hash of header fields to preserve ordering, so a single flow is pinned to one member link and cannot exceed that link's speed"
      - "LACP caps every bundle at the speed of its slowest member"
      - "The backup software does not support jumbo frames"
      - "LACP disables one link whenever a large transfer starts"
    answer: 0
    explanation: |
      Link aggregation hashes each flow (from src/dst MAC/IP/L4 ports) onto a single
      member link to keep per-flow frame ordering, rather than striping round-robin.
      One TCP flow therefore rides one member and is capped at ~10G. Aggregate gains
      appear only across many flows whose hashes spread over members.
    ref: "concepts.md#link-aggregation-and-lacp"

  - id: link-layer-ethernet-arp-switching-068
    difficulty: advanced
    tags: [lacp, modes]
    question: |
      An LACP bundle fails to form because both ends are configured 'passive'. Why?
    options:
      - "Passive mode uses a different EtherType than active mode"
      - "Passive mode requires jumbo frames, which were disabled"
      - "Passive mode is only valid on fiber links"
      - "Passive ports only respond to LACPDUs and never initiate; at least one side must be active to start the negotiation"
    answer: 3
    explanation: |
      In LACP, active ports send LACPDUs to initiate negotiation; passive ports only
      reply when they receive them. Passive-passive never starts the handshake, so the
      bundle stays down. At least one end (or both) must be active.
    ref: "concepts.md#link-aggregation-and-lacp"

  - id: link-layer-ethernet-arp-switching-069
    difficulty: expert
    tags: [gratuitous-arp, failover, scenario]
    question: |
      After a VRRP failover the virtual IP is unreachable for ~30 seconds even though
      the new active node is healthy, then it recovers. What is the most likely cause?
    options:
      - "The new node has a smaller MTU than the old one"
      - "Neighbors and the switch still cache the old MAC/port for the VIP; the gratuitous ARP that would update them was missing, delayed, or dropped (e.g. by DAI), so traffic follows the stale mapping until it ages out"
      - "The VIP subnet mask changed during failover"
      - "STP put the new node's port into blocking for 30 seconds"
    answer: 1
    explanation: |
      On failover the new node must send a gratuitous ARP so neighbors' ARP caches
      and the switch CAM redirect the VIP to the new MAC/port. If that GARP is not
      sent or is dropped (a strict DAI/DHCP-snooping binding can reject it),
      traffic keeps going to the stale mapping until it times out — matching the
      ~30 s stall.
    ref: "concepts.md#gratuitous-arp-and-proxy-arp"

  - id: link-layer-ethernet-arp-switching-070
    difficulty: advanced
    tags: [proxy-arp, legacy]
    question: |
      What does Proxy ARP (RFC 1027) do, and why is it generally discouraged today?
    options:
      - "It encrypts ARP replies; discouraged because the cipher is weak"
      - "A router answers ARP requests for off-subnet IPs it can reach on the host's behalf, so hosts treat everything as on-link; discouraged because it bloats ARP tables, masks misconfiguration, and misbehaves with overlapping subnets"
      - "It compresses ARP traffic; discouraged because it adds latency"
      - "It is the IPv6 replacement for ARP; discouraged in favor of DHCP"
    answer: 1
    explanation: |
      With Proxy ARP a router replies to ARP for addresses it can route to, so a
      misconfigured or subnet-unaware host can still reach remote destinations via the
      router's MAC. It is legacy: it inflates ARP caches, hides bad configuration, and
      breaks when subnets overlap. Proper subnetting/gateways are preferred.
    ref: "concepts.md#gratuitous-arp-and-proxy-arp"

  - id: link-layer-ethernet-arp-switching-071
    difficulty: expert
    tags: [fcs, crc, error-handling]
    question: |
      A switch receives a frame whose recomputed CRC-32 does not match the FCS field.
      What does it do, and what does this tell you about L2 error handling?
    options:
      - "It repairs the frame using the CRC and forwards it — L2 does forward error correction"
      - "It silently discards the frame and increments a CRC/FCS error counter — L2 does error detection only, leaving retransmission to higher layers like TCP"
      - "It forwards the frame anyway and lets the destination NIC decide"
      - "It returns the frame to the sender with an error flag set"
    answer: 1
    explanation: |
      The FCS provides error detection, not correction. A frame failing the CRC check
      is dropped and counted (CRC/FCS errors), and nothing at L2 repairs or
      retransmits it — recovery is the job of upper layers (e.g. TCP). Rising CRC
      counters point to a bad cable, EMI, or duplex mismatch.
    ref: "concepts.md#fcs-error-handling-and-switching-modes"

  - id: link-layer-ethernet-arp-switching-072
    difficulty: expert
    tags: [cut-through, store-and-forward, switching-mode]
    question: |
      Compared with store-and-forward, why can a cut-through switch propagate a
      corrupt frame?
    options:
      - "Cut-through disables the FCS field entirely"
      - "Cut-through recomputes the FCS incorrectly"
      - "Store-and-forward also forwards corrupt frames, so there is no difference"
      - "Cut-through begins forwarding after reading only the destination MAC, before the FCS at the end of the frame has arrived, so it cannot yet know the CRC is bad; store-and-forward buffers the whole frame and validates the FCS first"
    answer: 3
    explanation: |
      Cut-through minimizes latency by forwarding as soon as it reads the destination
      MAC (first ~6–14 bytes), well before the trailing FCS is received — so it can
      relay a frame that later turns out corrupt. Store-and-forward buffers the entire
      frame and checks the CRC before forwarding, dropping errors. Fragment-free is a
      middle ground that waits for the first 64 bytes.
    ref: "concepts.md#fcs-error-handling-and-switching-modes"

  - id: link-layer-ethernet-arp-switching-073
    difficulty: intermediate
    tags: [counters, runts, giants]
    question: |
      On a switch interface, what do the 'runts' and 'giants' counters indicate?
    options:
      - "Runts are frames larger than the maximum; giants are frames below 64 bytes"
      - "Runts are frames below the 64-byte minimum; giants are frames larger than the allowed maximum (e.g. oversized frames from an MTU/tagging mismatch, or unconfigured jumbo frames)"
      - "Both count only frames that pass the FCS check"
      - "Runts and giants both count broadcast frames"
    answer: 1
    explanation: |
      Runts are undersized frames (< 64 bytes), often from collisions or truncation.
      Giants exceed the maximum allowed size — commonly oversized frames from an MTU
      or tagging mismatch, or jumbo frames arriving at a port not configured for them.
    ref: "concepts.md#fcs-error-handling-and-switching-modes"

  - id: link-layer-ethernet-arp-switching-074
    difficulty: expert
    tags: [duplex-mismatch, late-collision, debugging]
    question: |
      A link between two switches shows CRC errors and climbing 'late collision'
      counters, and throughput is terrible. What is the classic root cause?
    options:
      - "A duplex mismatch — one side full-duplex, the other half-duplex (typically an autonegotiation failure)"
      - "A VLAN native-mismatch"
      - "An oversubscribed uplink"
      - "An MTU set too high on both ends"
    answer: 0
    explanation: |
      A late collision (detected after the 512-bit slot time / first 64 bytes) is not
      normal on a healthy network; combined with CRC errors and awful throughput it is
      the textbook signature of a duplex mismatch — the half-duplex side sees the
      full-duplex side transmit while it is receiving and registers collisions. Fix by
      matching duplex (or fixing autonegotiation) on both ends.
    ref: "concepts.md#csmacd-slot-time-and-duplex-mismatch"

  - id: link-layer-ethernet-arp-switching-075
    difficulty: advanced
    tags: [csma-cd, slot-time, minimum-frame]
    question: |
      How does the 64-byte minimum frame relate to CSMA/CD's slot time?
    options:
      - "It is unrelated; 64 bytes was chosen to fit an IP header"
      - "The 64-byte minimum equals the 512-bit slot time, ensuring a station is still transmitting when the farthest possible collision propagates back, which also bounds the maximum cable length"
      - "The slot time is 64 bits and the minimum frame is 512 bytes"
      - "The minimum frame exists only to leave room for the VLAN tag"
    answer: 1
    explanation: |
      The 64-byte (512-bit) minimum frame is the slot time: a sender must still be
      transmitting when a collision from the most distant station returns, so it can
      detect it. That round-trip requirement is what limits maximum segment/cable
      length in half-duplex CSMA/CD Ethernet.
    ref: "concepts.md#csmacd-slot-time-and-duplex-mismatch"

  - id: link-layer-ethernet-arp-switching-076
    difficulty: expert
    tags: [ndp, solicited-node-multicast, ipv6]
    question: |
      How does IPv6 Neighbor Discovery avoid the 'interrupt every host' cost of ARP's
      broadcast when resolving a neighbor's link-layer address?
    options:
      - "It sends the Neighbor Solicitation as an L2 broadcast but with a low TTL"
      - "It unicasts the solicitation to the router, which relays it"
      - "It uses DNS to look up the MAC instead of multicasting"
      - "It sends the Neighbor Solicitation to the target's solicited-node multicast address (FF02::1:FFxx:xxxx, from the low 24 bits of the target IPv6 address), which maps to a 33:33-prefixed multicast MAC that only matching hosts process"
    answer: 3
    explanation: |
      NDP (RFC 4861) sends the NS to the target's solicited-node multicast address
      FF02::1:FFxx:xxxx, derived from the low 24 bits of the target address. That maps
      to a 33:33:FFxx:xxxx multicast MAC, so typically only the intended host's NIC
      accepts and processes it — unlike ARP's all-hosts broadcast.
    ref: "concepts.md#neighbor-discovery-protocol-ndp-internals"

  - id: link-layer-ethernet-arp-switching-077
    difficulty: advanced
    tags: [ndp, dad, ipv6]
    question: |
      What is Duplicate Address Detection (DAD) in IPv6 NDP?
    options:
      - "Before using a tentative address, a host sends a Neighbor Solicitation for it; any Neighbor Advertisement in response means the address is already in use"
      - "A router feature that blocks duplicate MAC addresses on a trunk"
      - "A method to detect duplicate VLAN IDs across switches"
      - "The IPv6 equivalent of Proxy ARP"
    answer: 0
    explanation: |
      DAD sends an NS for a host's own tentative address before committing to it. If
      another node answers with an NA, the address is a duplicate and must not be used.
      It is the IPv6 analog of IPv4 Address Conflict Detection (gratuitous ARP probe).
    ref: "concepts.md#neighbor-discovery-protocol-ndp-internals"

  - id: link-layer-ethernet-arp-switching-078
    difficulty: expert
    tags: [ndp, nud, states]
    question: |
      In the IPv6 Neighbor Unreachability Detection (NUD) state machine, what does the
      STALE state signify?
    options:
      - "The neighbor entry is confirmed reachable and actively verified"
      - "A previously known reachability is now unconfirmed; the entry is kept and used, but the next packet triggers reconfirmation (DELAY, then unicast PROBE) rather than immediate deletion"
      - "The address failed DAD and must be discarded"
      - "The neighbor has been permanently removed from the table"
    answer: 1
    explanation: |
      NUD tracks INCOMPLETE → REACHABLE → STALE → DELAY → PROBE. STALE means the
      reachability timer expired without positive confirmation; the entry is still
      usable, but sending to it moves to DELAY and then unicast PROBE (NS) to
      revalidate — avoiding both stale forwarding and constant re-resolution.
    ref: "concepts.md#neighbor-discovery-protocol-ndp-internals"

  - id: link-layer-ethernet-arp-switching-079
    difficulty: advanced
    tags: [ndp, rogue-ra, security]
    question: |
      What is the IPv6 analog of a rogue-DHCP / ARP-spoofing attack, and which switch
      feature defends against it?
    options:
      - "Rogue Router Advertisements that hijack the default gateway/prefix; defended by RA Guard (plus ND inspection / SEND)"
      - "DTP switch spoofing; defended by disabling trunk negotiation"
      - "CAM overflow; defended by port security"
      - "Double-tagging; defended by native-VLAN hardening"
    answer: 0
    explanation: |
      Because NDP is unauthenticated, an attacker can send forged Router
      Advertisements (or NA spoofing) to become the default gateway or advertise a
      malicious prefix. RA Guard filters unauthorized RAs at the switch; ND inspection
      and SEND (RFC 3971) provide further protection.
    ref: "concepts.md#neighbor-discovery-protocol-ndp-internals"

  - id: link-layer-ethernet-arp-switching-080
    difficulty: advanced
    tags: [mac-randomization, nac, operations]
    question: |
      Modern phones present a different, locally-administered MAC per SSID. What
      operational problem does this most directly create?
    options:
      - "It prevents the phone from obtaining an IPv6 address"
      - "It breaks MAC-based controls — NAC allow-lists, ACLs, DHCP reservations, and device tracking — because the device's MAC is no longer stable or OUI-derived"
      - "It disables 802.1Q tagging on the wireless link"
      - "It forces the switch into cut-through mode"
    answer: 1
    explanation: |
      Per-SSID randomized MACs (U/L bit set, not from an IEEE OUI) change per network
      and over time, so any scheme keyed on a stable hardware MAC — NAC allow-lists,
      MAC ACLs, DHCP reservations, asset tracking — no longer reliably identifies the
      device. It is a real 2025 operations challenge, pushing teams toward 802.1X.
    ref: "concepts.md#mac-address-randomization-and-special-ranges"

  - id: link-layer-ethernet-arp-switching-081
    difficulty: intermediate
    tags: [poe, 8023bt, power]
    question: |
      Under IEEE 802.3bt (PoE++/Type 4), roughly how much power reaches the powered
      device, and how is it delivered?
    options:
      - "About 90 W at the powered device, over two pairs"
      - "About 71 W at the powered device (from ~90 W at the source, the rest lost in the cable), using all four pairs"
      - "Exactly 15.4 W, the same as 802.3af"
      - "About 100 W at the powered device, over a separate power cable"
    answer: 1
    explanation: |
      802.3bt Type 4 uses all four twisted pairs and sources up to ~90 W, of which
      about 71.3 W reaches the PD after cable loss. (802.3af delivers ~12.95 W at the
      PD, 802.3at ~25.5 W.) Numbers at the source and at the PD differ because of
      resistive loss in the cable.
    ref: "concepts.md#power-over-ethernet-poe"

  - id: link-layer-ethernet-arp-switching-082
    difficulty: expert
    tags: [jumbo-frames, mtu-mismatch, scenario]
    question: |
      In a data-center subnet where jumbo frames were enabled, ping and small
      requests work between two hosts, but NFS and large transfers hang. One switch in
      the path was left at the default 1500 MTU. What is happening?
    options:
      - "An ARP cache poisoning attack is dropping large frames"
      - "The NFS server ran out of TCP sockets"
      - "STP is blocking the path only for large frames"
      - "An MTU mismatch: the 1500-MTU switch silently drops the ~9000-byte jumbo frames as giants, so small frames pass but bulk transfers stall — an L2 black hole analogous to a PMTUD black hole"
    answer: 3
    explanation: |
      Jumbo frames require consistent MTU on every hop. The switch left at 1500 drops
      oversized frames as giants, so pings and small packets (which fit) succeed while
      bulk transfers, NFS, and iSCSI hang. Probe with a DF-bit ping (e.g.
      ping -M do -s 8972) to find the largest size that still replies and reveal the
      true path MTU.
    ref: "concepts.md#jumbo-frames-and-mtu-mismatch"

  - id: link-layer-ethernet-arp-switching-083
    difficulty: expert
    tags: [mac-flapping, stp, debugging, scenario]
    question: |
      Switch logs report the same source MAC repeatedly flapping between two ports,
      and users on that VLAN see intermittent connectivity. Which set of causes should
      you investigate first?
    options:
      - "A DNS misconfiguration or an expired TLS certificate"
      - "A physical L2 loop with STP failed/disabled, a duplicate MAC on two hosts, or a misconfigured NIC team — all of which make one source MAC appear on multiple ports and destabilize the CAM table"
      - "An MTU set too low on the uplink"
      - "The ARP cache timeout being too long on the clients"
    answer: 1
    explanation: |
      MAC flapping means the switch keeps relearning the same source MAC on different
      ports. The usual culprits are a bridging loop where STP is not blocking a
      redundant path, two devices sharing a MAC (duplicate/cloned), or a broken NIC
      teaming/bonding config. All corrupt the forwarding table and cause the
      intermittent outages users report.
    ref: "concepts.md#mac-learning-and-the-cam-table"
