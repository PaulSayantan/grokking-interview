topic: "Network Troubleshooting, Tools & Metrics"
domain: networking
topic_slug: network-troubleshooting-tools-metrics
version: 1
questions:
  - id: network-troubleshooting-tools-metrics-001
    difficulty: beginner
    tags: [methodology, layered-diagnosis]
    question: |
      In a "bottom-up" network diagnosis, which check comes FIRST?
    options:
      - "Whether the HTTP endpoint returns a 200 response"
      - "Whether the TLS certificate is valid"
      - "Whether the host has an IP address and a reachable default gateway"
      - "Whether the DNS name resolves to the correct record"
    answer: 2
    explanation: |
      Bottom-up starts at the lowest layers and works up: link/IP configuration and
      gateway reachability first, then DNS, then TCP, TLS, and finally the application.
      HTTP, TLS, and DNS are all higher-layer checks that only matter once basic L3
      connectivity exists.
    ref: "concepts.md#systematic-layered-diagnosis"

  - id: network-troubleshooting-tools-metrics-002
    difficulty: intermediate
    tags: [methodology, isolation, dns]
    question: |
      A service call to https://api.example.com fails. You want to determine whether the
      problem is DNS or the backend itself. Which single command best ISOLATES DNS out of
      the picture?
    options:
      - "curl --resolve api.example.com:443:203.0.113.10 https://api.example.com"
      - "ping api.example.com"
      - "dig api.example.com"
      - "traceroute api.example.com"
    answer: 0
    explanation: |
      --resolve pins the hostname to a specific IP, so curl skips DNS entirely and talks
      straight to that backend. If it now works, DNS was the culprit; if it still fails,
      the backend/transport is. `dig` tests DNS but not the backend; ping/traceroute test
      neither the app nor cleanly separate DNS.
    ref: "concepts.md#systematic-layered-diagnosis"

  - id: network-troubleshooting-tools-metrics-003
    difficulty: beginner
    tags: [ping, icmp, rtt]
    question: |
      What does the `time=` value in a `ping` reply measure?
    options:
      - "The processing time on the target host only"
      - "The round-trip time (RTT) for the echo request and its reply"
      - "The time since the connection was established"
      - "The one-way delay from the sender to the target"
    answer: 1
    explanation: |
      ping sends an ICMP Echo Request and times how long until the matching Echo Reply
      returns — that is the round-trip time. One-way delay is only RTT/2 if the path is
      symmetric, which it often is not.
    ref: "concepts.md#ping--icmp-echo-and-rtt"

  - id: network-troubleshooting-tools-metrics-004
    difficulty: beginner
    tags: [ping, icmp]
    question: |
      Which protocol and message types does `ping` (IPv4) rely on?
    options:
      - "TCP SYN and SYN-ACK"
      - "UDP datagrams to port 7"
      - "ICMP Echo Request (type 8) and Echo Reply (type 0)"
      - "ARP Request and ARP Reply"
    answer: 2
    explanation: |
      ping uses ICMP Echo Request (type 8) and Echo Reply (type 0) for IPv4 (types 128/129
      for ICMPv6). It does not use TCP or UDP for the probe itself.
    ref: "concepts.md#ping--icmp-echo-and-rtt"

  - id: network-troubleshooting-tools-metrics-005
    difficulty: intermediate
    tags: [ping, icmp, false-negative]
    question: |
      A monitoring script marks a server "down" because `ping` gets 100% loss, yet users
      are browsing its website fine. What is the most likely explanation?
    options:
      - "The server's TCP stack has crashed but ICMP still works"
      - "DNS is returning the wrong IP for the ping target"
      - "The website is served from the browser cache, not the server"
      - "A firewall/policy drops ICMP Echo while TCP 443 remains open"
    answer: 3
    explanation: |
      Many hosts and firewalls drop ICMP Echo by policy while still serving TCP traffic.
      Ping failure only proves ICMP is blocked/unreachable, not that the host or app is
      down. Confirm reachability with a transport probe (nc -vz / curl).
    ref: "concepts.md#ping--icmp-echo-and-rtt"

  - id: network-troubleshooting-tools-metrics-006
    difficulty: intermediate
    tags: [traceroute, ttl, icmp]
    question: |
      Which IP-header mechanism does traceroute exploit to discover intermediate hops?
    options:
      - "It increments the TTL field (1, 2, 3, …) so each router in turn returns ICMP Time Exceeded"
      - "It sets the DF bit so each router returns Fragmentation Needed"
      - "It uses the IP Record Route option to log every hop"
      - "It broadcasts to 255.255.255.255 and collects replies"
    answer: 0
    explanation: |
      traceroute sends probes with increasing TTL. Each router decrements TTL; when it hits
      zero the router discards the packet and returns ICMP Time Exceeded (type 11),
      revealing that hop. Increasing TTL by one each round walks the path outward.
    ref: "concepts.md#traceroute-and-tracert--ttl-based-hop-discovery"

  - id: network-troubleshooting-tools-metrics-007
    difficulty: intermediate
    tags: [traceroute, interpretation]
    question: |
      A traceroute shows `* * *` at hop 3, but hops 4, 5, and the destination all reply
      normally with low latency. What should you conclude?
    options:
      - "The path is broken at hop 3 and traffic cannot get through"
      - "There is 100% packet loss to the destination"
      - "Hop 3 is the destination and the trace should have stopped"
      - "Hop 3 is simply not replying to probes (ICMP filtered/deprioritized); traffic still passes"
    answer: 3
    explanation: |
      `* * *` means no ICMP Time Exceeded came back from that hop — commonly because the
      router filters or deprioritizes ICMP to its own control plane. Since later hops and
      the destination respond, data traffic is clearly passing through it.
    ref: "concepts.md#traceroute-and-tracert--ttl-based-hop-discovery"

  - id: network-troubleshooting-tools-metrics-008
    difficulty: advanced
    tags: [traceroute, probes, firewall]
    question: |
      A firewalled path drops the default UDP/high-port probes of Unix `traceroute`, so you
      see stars all the way. Which option is most likely to trace successfully to a web
      server?
    options:
      - "traceroute -T -p 443 host   (TCP SYN to the open HTTPS port)"
      - "traceroute -U host          (force even more UDP probes)"
      - "traceroute -n host          (skip DNS resolution)"
      - "traceroute -q 10 host       (send more queries per hop)"
    answer: 0
    explanation: |
      `-T -p 443` sends TCP SYN probes to a port the firewall actually allows (the web
      port), so probes traverse the path like real traffic. `-n` only disables name
      resolution, `-q` changes query count, and more UDP probes won't help if UDP is
      filtered.
    ref: "concepts.md#traceroute-and-tracert--ttl-based-hop-discovery"

  - id: network-troubleshooting-tools-metrics-009
    difficulty: intermediate
    tags: [traceroute, tracert, os-differences]
    question: |
      By default, what probe type does Windows `tracert` use, versus classic Unix
      `traceroute`?
    options:
      - "tracert uses ICMP Echo; classic Unix traceroute uses UDP to high ports"
      - "Both use TCP SYN by default"
      - "tracert uses UDP; Unix traceroute uses ICMP Echo"
      - "Both use ARP by default"
    answer: 0
    explanation: |
      Windows tracert defaults to ICMP Echo probes, while classic Unix traceroute defaults
      to UDP datagrams sent to high, unlikely ports (the destination replies with ICMP Port
      Unreachable to signal arrival). Unix traceroute can switch to ICMP with -I or TCP
      with -T.
    ref: "concepts.md#traceroute-and-tracert--ttl-based-hop-discovery"

  - id: network-troubleshooting-tools-metrics-010
    difficulty: beginner
    tags: [dig, dns]
    question: |
      Which `dig` invocation queries a SPECIFIC resolver (8.8.8.8) instead of the system
      default?
    options:
      - "dig example.com +8.8.8.8"
      - "dig example.com --server=8.8.8.8"
      - "dig @8.8.8.8 example.com"
      - "dig -r 8.8.8.8 example.com"
    answer: 2
    explanation: |
      The `@server` syntax directs the query to a specific resolver. Comparing your local
      resolver against a public one (e.g., @8.8.8.8) is a fast way to detect a stale or
      poisoned local cache.
    ref: "concepts.md#dig-and-nslookup--dns-diagnostics"

  - id: network-troubleshooting-tools-metrics-011
    difficulty: intermediate
    tags: [dig, dns, delegation]
    question: |
      You suspect a delegation problem — the name resolves for some users but not others.
      Which `dig` feature walks the delegation chain from the root down, bypassing the
      recursive cache?
    options:
      - "dig +short example.com"
      - "dig +noall +answer example.com"
      - "dig -x example.com"
      - "dig +trace example.com"
    answer: 3
    explanation: |
      `+trace` starts at the root servers and follows referrals down through the TLD to the
      authoritative servers, bypassing your recursive resolver's cache. It pinpoints exactly
      where delegation breaks. `-x` does reverse lookups; the others just format the answer.
    ref: "concepts.md#dig-and-nslookup--dns-diagnostics"

  - id: network-troubleshooting-tools-metrics-012
    difficulty: intermediate
    tags: [dns, status-codes]
    question: |
      A `dig` query returns header status `SERVFAIL`. What does this most commonly indicate?
    options:
      - "The resolver or an authoritative server failed to answer (e.g., DNSSEC validation failure or upstream timeout)"
      - "The domain name definitively does not exist"
      - "The query succeeded and returned a valid answer"
      - "The record exists but has a TTL of zero"
    answer: 0
    explanation: |
      SERVFAIL means the resolver could not complete the query — commonly a DNSSEC
      validation failure, an unreachable/broken authoritative server, or an upstream
      timeout. A non-existent name returns NXDOMAIN, and a successful query returns NOERROR.
    ref: "concepts.md#dig-and-nslookup--dns-diagnostics"

  - id: network-troubleshooting-tools-metrics-013
    difficulty: advanced
    tags: [dns, resolver, hosts-file]
    question: |
      `dig myservice.internal` resolves correctly, but your application reports "name not
      found" for the same host. What is the most likely cause?
    options:
      - "dig is buggy and should be replaced with nslookup"
      - "The DNS record's TTL is too high"
      - "The application is using IPv6 and DNS only has an A record"
      - "dig and the app use the resolution path differently — the app honors /etc/hosts, nsswitch ordering, or a stub-resolver cache that dig bypasses"
    answer: 3
    explanation: |
      dig talks straight to a resolver and typically bypasses /etc/hosts, nsswitch.conf
      ordering, and systemd-resolved caching that the application (via the OS stub resolver)
      honors. `getent hosts <name>` uses the same nsswitch path as the app and is the better
      comparison.
    ref: "concepts.md#dig-and-nslookup--dns-diagnostics"

  - id: network-troubleshooting-tools-metrics-014
    difficulty: intermediate
    tags: [dns, ttl, propagation]
    question: |
      You changed an A record 10 minutes ago but still get the old IP. The record's TTL is
      3600. What is happening?
    options:
      - "The change failed; you must re-apply it"
      - "DNS never caches A records, so this is a bug"
      - "A cached copy of the old record is still valid for up to the TTL (3600s) at resolvers/clients"
      - "The authoritative server rejected the update"
    answer: 2
    explanation: |
      Resolvers and clients cache records for the TTL. With TTL 3600, cached copies of the
      old answer can persist for up to an hour before a fresh lookup occurs. Lowering the
      TTL *before* a planned change speeds cutover.
    ref: "concepts.md#dig-and-nslookup--dns-diagnostics"

  - id: network-troubleshooting-tools-metrics-015
    difficulty: beginner
    tags: [ss, netstat, listening]
    question: |
      Which command lists all TCP sockets that are in the LISTEN state, numerically, with
      the owning process?
    options:
      - "ss -ltnp"
      - "ss -u"
      - "ss -x"
      - "ss -s"
    answer: 0
    explanation: |
      `-l` listening, `-t` TCP, `-n` numeric (no name/port resolution), `-p` show the owning
      process. This is the canonical "is my service actually listening, and where?" check.
      `-u` is UDP, `-x` is Unix sockets, `-s` is summary stats.
    ref: "concepts.md#netstat-and-ss--sockets-and-connection-states"

  - id: network-troubleshooting-tools-metrics-016
    difficulty: intermediate
    tags: [ss, binding, remote-access]
    question: |
      A service works from localhost but not from other machines. `ss -ltn` shows
      `LISTEN 0 128 127.0.0.1:8080`. What is the problem?
    options:
      - "The backlog of 128 is too small"
      - "TCP is disabled; it should be using UDP"
      - "The Recv-Q of 0 means the socket is closed"
      - "It is bound only to the loopback address 127.0.0.1, so it accepts only local connections"
    answer: 3
    explanation: |
      Binding to 127.0.0.1 makes the listener reachable only from the same host. To accept
      remote connections it must bind to a routable interface address or 0.0.0.0 (all
      interfaces). This is a classic "works locally, not remotely" cause.
    ref: "concepts.md#netstat-and-ss--sockets-and-connection-states"

  - id: network-troubleshooting-tools-metrics-017
    difficulty: advanced
    tags: [ss, accept-queue, backlog]
    question: |
      On a busy server's LISTEN socket, `ss -ltn` shows Recv-Q climbing toward the Send-Q
      value (the backlog limit) and clients report intermittent connection failures. What
      does this indicate?
    options:
      - "The application is not calling accept() fast enough, so the accept queue is filling and new connections are being dropped"
      - "The network link is saturated at layer 1"
      - "DNS resolution is slow for incoming clients"
      - "TIME_WAIT sockets are exhausting memory"
    answer: 0
    explanation: |
      On a LISTEN socket, Recv-Q is the count of completed handshakes waiting to be
      accept()ed and Send-Q is the accept-queue limit. When Recv-Q approaches Send-Q the app
      isn't accepting fast enough; further completed connections get dropped/reset. Scale the
      accept loop or raise the backlog and fix the app throughput.
    ref: "concepts.md#netstat-and-ss--sockets-and-connection-states"

  - id: network-troubleshooting-tools-metrics-018
    difficulty: beginner
    tags: [time-wait, close-wait, states]
    question: |
      On which side of a TCP connection does the TIME_WAIT state appear?
    options:
      - "The side that received the first FIN (passive close)"
      - "Both sides simultaneously, always"
      - "The side that sent the first FIN (active close)"
      - "Only on the server, never the client"
    answer: 2
    explanation: |
      TIME_WAIT appears on the endpoint that initiated the close (sent the first FIN). After
      the final ACK it lingers for 2×MSL to ensure the final ACK arrives and to let old
      duplicate segments die out before the 4-tuple is reused.
    ref: "concepts.md#interpreting-time_wait-and-close_wait-buildup"

  - id: network-troubleshooting-tools-metrics-019
    difficulty: intermediate
    tags: [time-wait, msl]
    question: |
      Why does TCP keep a socket in TIME_WAIT for roughly 2×MSL instead of closing
      immediately?
    options:
      - "To keep the connection available for reuse without a new handshake"
      - "To let the application read any remaining buffered data"
      - "It is an arbitrary delay with no functional purpose"
      - "To ensure the final ACK is delivered and to let delayed duplicate segments expire before the 4-tuple is reused"
    answer: 3
    explanation: |
      TIME_WAIT guarantees the last ACK can be retransmitted if lost (the peer would resend
      its FIN) and ensures any lingering old segments on this 4-tuple die out (within 2×MSL)
      so they cannot be mistaken for data on a new connection reusing the same tuple.
    ref: "concepts.md#interpreting-time_wait-and-close_wait-buildup"

  - id: network-troubleshooting-tools-metrics-020
    difficulty: advanced
    tags: [close-wait, application-bug]
    question: |
      A long-running service accumulates thousands of sockets in CLOSE_WAIT that never
      clear, eventually running out of file descriptors. What is the root cause?
    options:
      - "The application received a FIN from peers but is not calling close() on its sockets — a socket/FD leak"
      - "The kernel is too slow to release TIME_WAIT sockets"
      - "The peer keeps reopening connections too quickly"
      - "MSS is misconfigured, blocking connection teardown"
    answer: 0
    explanation: |
      CLOSE_WAIT means the peer sent FIN and the local kernel is waiting for the application
      to close its end. Sockets stuck there indefinitely signal an application bug — the code
      isn't calling close() (leaked connections, a pool that never reaps, a missing close in
      an error path) — and this leaks file descriptors.
    ref: "concepts.md#interpreting-time_wait-and-close_wait-buildup"

  - id: network-troubleshooting-tools-metrics-021
    difficulty: intermediate
    tags: [time-wait, remediation, ephemeral-ports]
    question: |
      A busy reverse proxy shows a very large number of TIME_WAIT sockets to a single
      backend and begins failing with ephemeral-port exhaustion. What is the BEST fix?
    options:
      - "Disable TIME_WAIT entirely so sockets close instantly"
      - "Reboot the proxy on a schedule to clear the sockets"
      - "Enable connection reuse / keep-alive (pooling) to cut connection churn"
      - "Block the backend's IP temporarily to reduce load"
    answer: 2
    explanation: |
      Mass TIME_WAIT reflects high connection churn (many short-lived connections). The right
      fix is to reuse connections via keep-alive/pooling so far fewer are opened and closed.
      Blindly disabling TIME_WAIT risks data corruption from stale segments; tcp_tw_reuse can
      help outbound, but reducing churn is the durable answer.
    ref: "concepts.md#interpreting-time_wait-and-close_wait-buildup"

  - id: network-troubleshooting-tools-metrics-022
    difficulty: intermediate
    tags: [close-wait, states]
    question: |
      Which statement correctly contrasts TIME_WAIT and CLOSE_WAIT buildup?
    options:
      - "Both indicate application bugs equally"
      - "TIME_WAIT is on the passive closer; CLOSE_WAIT is on the active closer"
      - "CLOSE_WAIT self-clears after 2×MSL; TIME_WAIT never clears"
      - "TIME_WAIT buildup is usually benign high churn on the active closer; CLOSE_WAIT buildup usually means the app failed to close() after receiving a FIN"
    answer: 3
    explanation: |
      TIME_WAIT lives on the active closer and self-clears after 2×MSL — usually a benign
      symptom of connection churn. CLOSE_WAIT lives on the side that received the FIN and
      persists until the app calls close(); a growing pile signals an application FD leak.
    ref: "concepts.md#interpreting-time_wait-and-close_wait-buildup"

  - id: network-troubleshooting-tools-metrics-023
    difficulty: beginner
    tags: [tcpdump, capture]
    question: |
      Which tcpdump command captures traffic to/from host 203.0.113.7 on TCP port 443 and
      writes raw packets to a file for later analysis?
    options:
      - "tcpdump -i eth0 --http --json > cap.json"
      - "tcpdump -A 'http.request'"
      - "tcpdump -i eth0 -nn 'tcp port 443 and host 203.0.113.7' -w cap.pcap"
      - "tcpdump -r 203.0.113.7:443"
    answer: 2
    explanation: |
      `-w cap.pcap` writes raw pcap for offline analysis; the BPF filter
      'tcp port 443 and host 203.0.113.7' scopes the capture; `-nn` disables host and port
      name resolution. `http.request` is Wireshark display-filter syntax, not a BPF capture
      filter, and `-r` reads a file rather than a host.
    ref: "concepts.md#tcpdump-and-wireshark--packet-capture-and-filtering"

  - id: network-troubleshooting-tools-metrics-024
    difficulty: advanced
    tags: [tcpdump, wireshark, filters]
    question: |
      What is the key difference between a tcpdump/BPF "capture filter" and a Wireshark
      "display filter"?
    options:
      - "There is no difference; the syntax is identical"
      - "Display filters run in the kernel; capture filters run after capture"
      - "Capture filters only work on UDP; display filters only work on TCP"
      - "Capture filters (BPF) run in the kernel and decide what to record; display filters run in Wireshark on already-captured packets and use richer, different syntax"
    answer: 3
    explanation: |
      BPF capture filters are applied in the kernel before packets are stored (you cannot
      re-filter what you never captured). Wireshark display filters are applied after
      capture, are far richer (e.g., http.request.method == "POST"), and use a completely
      different syntax from BPF.
    ref: "concepts.md#tcpdump-and-wireshark--packet-capture-and-filtering"

  - id: network-troubleshooting-tools-metrics-025
    difficulty: intermediate
    tags: [tcpdump, wireshark, reset, diagnosis]
    question: |
      Clients get "connection reset." A capture shows the RST originating from the server's
      IP immediately after the SYN, before any data. Which conclusion is best supported?
    options:
      - "Something at the server end actively refused the connection (no listener on that port, or a reject rule), rather than silently dropping it"
      - "The network dropped the packet in transit"
      - "It is a DNS failure"
      - "The client's TCP window is too small"
    answer: 0
    explanation: |
      A RST returned in response to a SYN means the destination actively refused the
      connection — typically nothing is listening on that port or a firewall is configured to
      reject (send RST) rather than drop. A silent drop would instead cause a timeout, not an
      immediate RST.
    ref: "concepts.md#tcpdump-and-wireshark--packet-capture-and-filtering"

  - id: network-troubleshooting-tools-metrics-026
    difficulty: beginner
    tags: [curl, http, verbose]
    question: |
      In `curl -v` output, what do lines beginning with `> ` represent?
    options:
      - "Response headers received from the server"
      - "curl's own diagnostic/connection messages"
      - "The response body content"
      - "Request headers curl is sending to the server"
    answer: 3
    explanation: |
      In curl verbose output, `> ` marks request headers sent, `< ` marks response headers
      received, and `* ` marks curl's own diagnostics (DNS, connection, TLS). This lets you
      see the entire request/response conversation.
    ref: "concepts.md#curl--v-and-application-layer-debugging"

  - id: network-troubleshooting-tools-metrics-027
    difficulty: intermediate
    tags: [curl, timing, latency-breakdown]
    question: |
      You want curl to report a phase-by-phase latency breakdown (DNS vs TCP connect vs TLS
      vs time-to-first-byte). Which mechanism provides this?
    options:
      - "curl -I (HEAD request)"
      - "curl -k (insecure)"
      - "curl -w with variables like %{time_namelookup} %{time_connect} %{time_appconnect} %{time_starttransfer} %{time_total}"
      - "curl -L (follow redirects)"
    answer: 2
    explanation: |
      curl's -w (write-out) format variables expose the elapsed time at each phase:
      time_namelookup (DNS), time_connect (TCP), time_appconnect (TLS), time_starttransfer
      (TTFB), and time_total. This localizes "slow" to a specific phase without a packet
      capture.
    ref: "concepts.md#curl--v-and-application-layer-debugging"

  - id: network-troubleshooting-tools-metrics-028
    difficulty: intermediate
    tags: [curl, failure-modes]
    question: |
      `curl https://svc.example.com` returns "Connection refused." Which layer is the
      problem MOST likely at?
    options:
      - "DNS — the name did not resolve"
      - "TLS — the certificate is untrusted"
      - "Transport — a host was reached but nothing is listening on that port (or a firewall reject sent an RST)"
      - "Application — the server returned an HTTP 5xx"
    answer: 2
    explanation: |
      "Connection refused" means the SYN reached a host that responded with a RST — a
      transport-level refusal (no listener or a reject rule). A DNS failure would say "Could
      not resolve host," a TLS trust issue would mention the certificate, and an HTTP error
      would show a status code.
    ref: "concepts.md#curl--v-and-application-layer-debugging"

  - id: network-troubleshooting-tools-metrics-029
    difficulty: intermediate
    tags: [curl, tls, isolation]
    question: |
      A request over HTTPS fails with a certificate error. To confirm the issue is
      certificate-trust and NOT connectivity, which flag temporarily bypasses cert
      validation for a diagnostic test?
    options:
      - "curl -k (--insecure)"
      - "curl -s"
      - "curl -L"
      - "curl -I"
    answer: 0
    explanation: |
      `-k`/`--insecure` skips certificate validation. If the request then succeeds, the
      problem is cert trust (expired, wrong CN/SAN, untrusted CA), not connectivity. This is
      strictly a diagnostic — never use it in production clients.
    ref: "concepts.md#curl--v-and-application-layer-debugging"

  - id: network-troubleshooting-tools-metrics-030
    difficulty: beginner
    tags: [mtr, path, loss]
    question: |
      How does `mtr` differ from a one-shot `traceroute`?
    options:
      - "mtr only works over IPv6"
      - "mtr combines ping and traceroute and probes continuously, showing per-hop loss % and latency stats over time"
      - "mtr shows only the final destination, not intermediate hops"
      - "mtr uses TCP exclusively"
    answer: 1
    explanation: |
      mtr merges ping and traceroute and runs continuously, updating per-hop loss percentage
      and last/avg/best/worst/stddev latency. This makes it far better than a single
      traceroute at catching intermittent loss or latency spikes.
    ref: "concepts.md#mtr-and-nc--continuous-path-and-swiss-army-tools"

  - id: network-troubleshooting-tools-metrics-031
    difficulty: advanced
    tags: [mtr, loss, interpretation]
    question: |
      An `mtr` report shows 40% loss at hop 5, but 0% loss at hop 6 and at the final
      destination (hop 8). What is the correct interpretation?
    options:
      - "There is real 40% packet loss to the destination"
      - "Hop 6 is repairing the lost packets from hop 5"
      - "The destination is unreachable"
      - "Hop 5 is rate-limiting ICMP to its own control plane; since loss is 0% at the destination, forwarded traffic is fine"
    answer: 3
    explanation: |
      Loss that appears at an intermediate hop but clears at later hops and the destination
      is not real end-to-end loss — that router simply deprioritizes ICMP addressed to
      itself. Real forward-path loss would persist through every subsequent hop including the
      destination.
    ref: "concepts.md#mtr-and-nc--continuous-path-and-swiss-army-tools"

  - id: network-troubleshooting-tools-metrics-032
    difficulty: beginner
    tags: [nc, netcat, port-check]
    question: |
      Which `nc` (netcat) command simply tests whether TCP port 443 on 203.0.113.10 accepts
      a connection, without exchanging any application data?
    options:
      - "nc -l 443"
      - "nc -u 203.0.113.10 443"
      - "nc -k 203.0.113.10"
      - "nc -vz 203.0.113.10 443"
    answer: 3
    explanation: |
      `-z` performs a zero-I/O scan (just connect and report), `-v` makes it verbose. This
      is the cleanest "is the listener accepting?" probe. `-l` listens, `-u` switches to UDP,
      and `-k` keeps a listener open.
    ref: "concepts.md#mtr-and-nc--continuous-path-and-swiss-army-tools"

  - id: network-troubleshooting-tools-metrics-033
    difficulty: beginner
    tags: [metrics, bandwidth, throughput]
    question: |
      What is the difference between bandwidth and throughput?
    options:
      - "Bandwidth is the maximum capacity of a link; throughput is the rate actually achieved over it"
      - "They are two words for the same thing"
      - "Bandwidth is measured in seconds; throughput in bytes"
      - "Throughput can exceed bandwidth on a good link"
    answer: 0
    explanation: |
      Bandwidth is the link's capacity (max bits/sec it could carry); throughput is the rate
      actually delivered, which is always ≤ bandwidth due to overhead, loss, window limits,
      and contention.
    ref: "concepts.md#latency-bandwidth-throughput-and-goodput"

  - id: network-troubleshooting-tools-metrics-034
    difficulty: intermediate
    tags: [metrics, goodput]
    question: |
      Why is goodput always less than or equal to throughput on the same link?
    options:
      - "Goodput is measured over a longer time window"
      - "Goodput includes retransmitted bytes but throughput does not"
      - "Goodput is capacity while throughput is achieved rate"
      - "Throughput counts all bytes on the wire (protocol headers, retransmissions, ACKs) while goodput counts only application-useful payload"
    answer: 3
    explanation: |
      Throughput counts every byte transferred, including Ethernet/IP/TCP/TLS headers,
      retransmitted segments, and pure ACKs. Goodput counts only the useful payload the
      application consumes, so it can never exceed throughput.
    ref: "concepts.md#latency-bandwidth-throughput-and-goodput"

  - id: network-troubleshooting-tools-metrics-035
    difficulty: advanced
    tags: [metrics, bdp, window-scaling]
    question: |
      A link has 1 Gbps bandwidth and 80 ms RTT. Approximately how much data must be "in
      flight" (the bandwidth-delay product) to keep the pipe full?
    options:
      - "About 64 KB"
      - "About 1 MB"
      - "About 10 MB"
      - "About 100 MB"
    answer: 2
    explanation: |
      BDP = bandwidth × RTT = 10^9 bits/s × 0.08 s = 8×10^7 bits = 10^7 bytes ≈ 10 MB. Since
      this vastly exceeds the classic 64 KB default window, TCP window scaling (RFC 7323) is
      required to saturate such a long-fat link.
    ref: "concepts.md#latency-bandwidth-throughput-and-goodput"

  - id: network-troubleshooting-tools-metrics-036
    difficulty: intermediate
    tags: [metrics, latency, bandwidth]
    question: |
      For an interactive request/response workload with tiny payloads over a single
      connection, which change is likely to help MOST?
    options:
      - "Doubling the link bandwidth"
      - "Increasing the MTU to 9000 (jumbo frames)"
      - "Enabling more aggressive packet fragmentation"
      - "Reducing RTT (latency), e.g., via a CDN edge or connection reuse"
    answer: 3
    explanation: |
      Small interactive exchanges are latency-bound: each round trip costs RTT, and
      throughput on a single connection is roughly window/RTT. Cutting RTT (CDN edges,
      connection reuse, fewer round trips) helps far more than adding bandwidth the workload
      can't use.
    ref: "concepts.md#latency-bandwidth-throughput-and-goodput"

  - id: network-troubleshooting-tools-metrics-037
    difficulty: beginner
    tags: [metrics, jitter, realtime]
    question: |
      What does "jitter" measure, and why does it matter for VoIP/video calls?
    options:
      - "Total bandwidth used; it caps call quality"
      - "The number of dropped packets; it forces retransmission"
      - "The variation in packet latency; real-time media needs steady arrival, so high jitter causes choppy playback"
      - "The size of the receive buffer; it limits throughput"
    answer: 2
    explanation: |
      Jitter is the variation (variance) in packet delay. Average latency can be fine while
      high jitter disrupts real-time media, which depend on steady, predictable arrival.
      Jitter buffers smooth this by adding a little latency to reorder/pace playout.
    ref: "concepts.md#rtt-jitter-and-packet-loss"

  - id: network-troubleshooting-tools-metrics-038
    difficulty: advanced
    tags: [metrics, packet-loss, tcp-throughput]
    question: |
      Why can as little as 1% packet loss cause a disproportionately large drop in TCP
      throughput on a high-RTT path?
    options:
      - "Because TCP retransmits every packet twice regardless of loss"
      - "Because 1% loss corrupts the DNS cache"
      - "Because lost packets increase the MTU"
      - "Because TCP treats loss as congestion and shrinks the congestion window; throughput scales roughly as MSS/(RTT·√loss), so high RTT and loss compound"
    answer: 3
    explanation: |
      TCP uses loss as its congestion signal and cuts its window on each loss event. By the
      Mathis approximation, throughput ∝ MSS/(RTT·√p) for loss probability p, so even small
      loss combined with a long RTT sharply reduces throughput on a single flow.
    ref: "concepts.md#rtt-jitter-and-packet-loss"

  - id: network-troubleshooting-tools-metrics-039
    difficulty: intermediate
    tags: [metrics, packet-loss, udp]
    question: |
      Why do real-time UDP applications (e.g., live voice) usually NOT retransmit lost
      packets?
    options:
      - "A retransmitted packet would arrive too late to be useful for real-time playout, so loss is concealed (PLC/FEC) or quality is degraded instead"
      - "UDP has no way to detect loss at all"
      - "UDP retransmits automatically at the kernel level"
      - "Retransmission is illegal over UDP by RFC"
    answer: 0
    explanation: |
      For live media, a retransmitted packet would arrive after its playout deadline, so
      resending is pointless. Applications instead conceal loss (packet-loss concealment,
      forward error correction) or reduce quality, trading perfect delivery for timeliness.
    ref: "concepts.md#rtt-jitter-and-packet-loss"

  - id: network-troubleshooting-tools-metrics-040
    difficulty: beginner
    tags: [mtu, mss]
    question: |
      On a standard IPv4 Ethernet link (MTU 1500), what is the typical TCP MSS?
    options:
      - "1500 bytes"
      - "1460 bytes (1500 − 20 IP − 20 TCP)"
      - "9000 bytes"
      - "536 bytes"
    answer: 1
    explanation: |
      MSS is the TCP payload size = MTU − IP header (20) − TCP header (20) = 1500 − 40 =
      1460 bytes on standard IPv4 Ethernet without options. Sizing segments to the MSS avoids
      IP fragmentation.
    ref: "concepts.md#mtu-pmtud-and-fragmentation"

  - id: network-troubleshooting-tools-metrics-041
    difficulty: intermediate
    tags: [pmtud, icmp, mtu]
    question: |
      How does Path MTU Discovery (PMTUD) work for a sender that sets the DF (Don't
      Fragment) bit?
    options:
      - "Routers fragment the packet and forward the pieces"
      - "The sender always uses 576-byte packets to be safe"
      - "The receiver advertises the path MTU during the TCP handshake"
      - "A router with a smaller MTU drops the packet and returns ICMP 'Fragmentation Needed / Packet Too Big' carrying the next-hop MTU, prompting the sender to shrink"
    answer: 3
    explanation: |
      With DF set, a router whose outgoing link MTU is too small cannot fragment; it drops the
      packet and returns ICMP Fragmentation Needed (IPv4 type 3 code 4) / Packet Too Big
      (ICMPv6 type 2), including the next-hop MTU. The sender then lowers its packet size to
      fit the path.
    ref: "concepts.md#mtu-pmtud-and-fragmentation"

  - id: network-troubleshooting-tools-metrics-042
    difficulty: advanced
    tags: [pmtud, blackhole, tunnel, troubleshooting]
    question: |
      Over a VPN tunnel, TCP connections establish and small requests succeed, but large
      POST bodies and HTTPS responses hang indefinitely. What is the most likely cause?
    options:
      - "A PMTUD black hole — a device is filtering the ICMP 'Fragmentation Needed / Packet Too Big' messages, so the sender never learns to shrink large packets that exceed the tunnel MTU"
      - "DNS is intermittently failing"
      - "The server's TIME_WAIT sockets are exhausted"
      - "The TCP window is scaled too aggressively"
    answer: 0
    explanation: |
      The signature — handshake and small packets work, large packets vanish — is a classic
      PMTUD black hole. The tunnel's encapsulation lowers the MTU, but a firewall blocking the
      ICMP "too big" messages prevents the sender from learning to reduce packet size.
      Mitigate with MSS clamping on the gateway, PLPMTUD, or allowing that ICMP type.
    ref: "concepts.md#mtu-pmtud-and-fragmentation"

  - id: network-troubleshooting-tools-metrics-043
    difficulty: intermediate
    tags: [mtu, ipv6, fragmentation]
    question: |
      Which statement about IPv6 and fragmentation is correct?
    options:
      - "IPv6 routers fragment oversized packets just like IPv4 routers"
      - "IPv6 always uses a fixed 1280-byte MTU that never changes"
      - "IPv6 has no concept of MTU"
      - "IPv6 routers do NOT fragment in transit; only the source host may fragment, so IPv6 depends on PMTUD (via ICMPv6 Packet Too Big)"
    answer: 3
    explanation: |
      IPv6 removed in-transit router fragmentation. Routers that receive a too-large packet
      drop it and send ICMPv6 Packet Too Big; only the source host may fragment (using a
      fragment extension header). This makes working PMTUD essential in IPv6. (1280 is the
      minimum MTU, not a fixed value.)
    ref: "concepts.md#mtu-pmtud-and-fragmentation"

  - id: network-troubleshooting-tools-metrics-044
    difficulty: intermediate
    tags: [mtu, mss-clamping, remediation]
    question: |
      What does "MSS clamping" on a gateway/router accomplish?
    options:
      - "It blocks all packets larger than the MTU"
      - "It disables the DF bit on all traffic"
      - "It increases the receive window to fill the pipe"
      - "It rewrites the TCP MSS option in passing SYN packets downward so endpoints negotiate segments that fit the tunnel MTU, avoiding fragmentation and PMTUD reliance"
    answer: 3
    explanation: |
      MSS clamping (aka MSS fixing) rewrites the MSS value advertised in TCP SYN options to a
      lower number so both endpoints agree on a segment size that fits the reduced (e.g.,
      tunnel) MTU. This sidesteps fragmentation and PMTUD black holes on encapsulated paths.
    ref: "concepts.md#mtu-pmtud-and-fragmentation"

  - id: network-troubleshooting-tools-metrics-045
    difficulty: intermediate
    tags: [bufferbloat, latency, symptom]
    question: |
      During a large upload, users on the same link report that video calls become choppy
      and web pages load slowly, even though the link has plenty of bandwidth. What is this?
    options:
      - "A DNS caching problem"
      - "A TLS renegotiation storm"
      - "Bufferbloat — oversized buffers hold a persistent queue, adding large queueing latency and jitter to latency-sensitive flows during saturation"
      - "Ephemeral port exhaustion"
    answer: 2
    explanation: |
      This is bufferbloat: a saturating bulk transfer fills oversized buffers in the
      modem/router, and because TCP only backs off when the buffer overflows, the queue stays
      full and injects hundreds of ms of delay/jitter into interactive traffic. Bandwidth
      isn't the constraint — queueing delay is.
    ref: "concepts.md#bufferbloat"

  - id: network-troubleshooting-tools-metrics-046
    difficulty: advanced
    tags: [bufferbloat, aqm, codel]
    question: |
      Which set of remedies most directly addresses bufferbloat?
    options:
      - "Buying more bandwidth and enabling jumbo frames"
      - "Disabling TCP window scaling and lowering the MTU"
      - "Increasing router buffer sizes to absorb more packets"
      - "Active Queue Management such as CoDel/FQ-CoDel/CAKE, ECN marking, and latency-based congestion control like BBR"
    answer: 3
    explanation: |
      Bufferbloat is fixed by keeping queues short: AQM (CoDel/FQ-CoDel/CAKE) drops or marks
      early based on queue sojourn time, ECN marks instead of dropping, and a model/latency-
      based congestion controller (BBR) avoids filling buffers. Bigger buffers make it worse;
      more bandwidth doesn't cure queueing delay.
    ref: "concepts.md#bufferbloat"

  - id: network-troubleshooting-tools-metrics-047
    difficulty: beginner
    tags: [bufferbloat, diagnosis]
    question: |
      What is the simplest test to detect bufferbloat on your own link?
    options:
      - "Run a DNS lookup and time it"
      - "Check the TLS certificate expiry"
      - "Run ping (or mtr) continuously while starting a large upload/download and watch whether RTT spikes dramatically"
      - "Count the number of ESTABLISHED sockets"
    answer: 2
    explanation: |
      Ping under load: measure idle RTT, then start a bulk transfer and watch RTT. If latency
      jumps from tens of ms to hundreds/thousands of ms during saturation, oversized buffers
      are queueing packets — the hallmark of bufferbloat.
    ref: "concepts.md#bufferbloat"

  - id: network-troubleshooting-tools-metrics-048
    difficulty: intermediate
    tags: [failure-patterns, refused-vs-timeout]
    question: |
      Two clients fail to connect to a service. Client A gets an immediate "Connection
      refused"; Client B's connection just "times out." What do these two signatures most
      likely indicate, respectively?
    options:
      - "Both mean the same thing: the server is down"
      - "A: a host was reached and actively rejected (RST) — no listener or reject rule; B: SYNs are being silently dropped — a drop firewall rule, bad route, or dead host"
      - "A: DNS failure; B: TLS failure"
      - "A: bufferbloat; B: MTU black hole"
    answer: 1
    explanation: |
      "Connection refused" is an immediate RST from a reachable host (nothing listening or a
      reject rule). A timeout means the SYNs got no response at all — silently dropped by a
      drop-style firewall rule, a routing problem, or a host that's down. The distinction
      guides where to look next.
    ref: "concepts.md#common-failure-patterns"

  - id: network-troubleshooting-tools-metrics-049
    difficulty: beginner
    tags: [failure-patterns, dns-vs-routing]
    question: |
      A site loads fine when you connect directly by its IP address but fails when you use
      its hostname. Where is the problem?
    options:
      - "Transport/TCP is broken"
      - "The TLS certificate has expired"
      - "The link MTU is too small"
      - "Name resolution (DNS) — the name isn't resolving, or resolves to a wrong/stale IP"
    answer: 3
    explanation: |
      If the IP works but the name doesn't, connectivity and the service are fine — the
      failure is in resolving the name to that IP. Compare `dig <name>` against
      `curl --resolve` to confirm and find whether DNS returns nothing or the wrong record.
    ref: "concepts.md#common-failure-patterns"

  - id: network-troubleshooting-tools-metrics-050
    difficulty: intermediate
    tags: [failure-patterns, triage, tools]
    question: |
      For fast first-pass triage of "the service is unreachable," which trio of commands
      most efficiently covers DNS, transport/application, and the path/loss respectively?
    options:
      - "ifconfig, arp, route"
      - "ping only, run three times"
      - "dig <name>; curl -v (or nc -vz <ip> <port>); mtr <ip>"
      - "tcpdump, tcpdump, tcpdump"
    answer: 2
    explanation: |
      `dig` tests resolution (DNS), `curl -v` / `nc -vz` tests whether the transport connects
      and the app answers (L4/L7), and `mtr` tests the path and per-hop loss (L3). Together
      they localize the failing layer in seconds before you reach for a full packet capture.
    ref: "concepts.md#common-failure-patterns"

  - id: network-troubleshooting-tools-metrics-051
    difficulty: expert
    tags: [ss, tcp-internals, diagnosis]
    question: |
      On a slow-transferring flow, `ss -ti` shows `cwnd:2 ssthresh:2 retrans:12/840
      bytes_retrans:1.2M rtt:9.1/1.0 lastsnd:3`. A second flow that's also "slow" shows
      `cwnd:40 retrans:0/0 lastsnd:5200`. What do these two states point to, respectively?
    options:
      - "First: network loss repeatedly collapsing the congestion window; second: the application isn't writing (idle ~5.2s, no retransmits) — an app/upstream problem, not the network"
      - "Both are network loss; the second just has more total data"
      - "First: the receiver's window is closed; second: DNS latency"
      - "First: an oversized send buffer; second: MTU black hole"
    answer: 0
    explanation: |
      The first socket has a tiny cwnd/ssthresh and heavy retransmits (bytes_retrans high) —
      the network is dropping and TCP keeps shrinking the window. The second has a healthy
      cwnd, zero retransmits, and lastsnd growing to seconds — the kernel has nothing to send
      because the application isn't writing. `ss -i` distinguishes network-limited from
      app-limited flows without a capture.
    ref: "concepts.md#per-socket-tcp-internals-with-ss"

  - id: network-troubleshooting-tools-metrics-052
    difficulty: advanced
    tags: [ss, tcp-internals, congestion-control]
    question: |
      Which `ss -i` fields most directly reveal (a) the congestion-control algorithm in use
      and (b) the current effective send window in segments?
    options:
      - "`rto` and `mss`"
      - "`rtt` and `pmtu`"
      - "the algorithm name (e.g. `cubic`, `bbr:(...)`) and `cwnd`"
      - "`bytes_acked` and `rcv_space`"
    answer: 2
    explanation: |
      `ss -i` prints the congestion-control algorithm as a bare token (`cubic`, `reno`, or
      `bbr:(bw:...,mrtt:...)`) and `cwnd` as the congestion window in segments. `rto`/`rtt`
      are timers, `mss`/`pmtu` are sizing, and `bytes_acked`/`rcv_space` are counters — none
      of those name the algorithm or give the window.
    ref: "concepts.md#per-socket-tcp-internals-with-ss"

  - id: network-troubleshooting-tools-metrics-053
    difficulty: expert
    tags: [ebpf, tcpdrop, root-cause]
    question: |
      You must determine whether "packet loss" for a service is happening on the wire or
      inside the local kernel (e.g., dropped due to a full backlog or bad checksum), including
      the exact kernel code path. Which tool is designed for this?
    options:
      - "tcpdump with a `tcp.analysis.lost_segment` filter"
      - "The eBPF tool `tcpdrop`, which reports each kernel-dropped packet with the stack location and drop reason"
      - "ping with a large payload"
      - "ss -s (socket summary statistics)"
    answer: 1
    explanation: |
      `tcpdrop` (bcc/bpftrace) hooks the kernel's drop points and prints the socket state plus
      the *stack trace / reason* for each drop — revealing whether a packet died from a full
      accept queue, a checksum error, or a RST, and where. A pcap only shows bytes on the wire,
      not why the kernel discarded something; `tcp.analysis` is a Wireshark display filter, not
      a BPF/tcpdump capability.
    ref: "concepts.md#ebpf-network-observability"

  - id: network-troubleshooting-tools-metrics-054
    difficulty: advanced
    tags: [ebpf, observability, tools]
    question: |
      Why are eBPF tools like `tcpconnect`/`tcplife`/`tcpretrans` often preferred over a full
      `tcpdump` capture for host-wide connection debugging in production?
    options:
      - "They decrypt TLS automatically"
      - "They attach to kernel tracepoints/kprobes to observe every connection host-wide at near-zero overhead, with per-event process/PID context you can't get from the wire"
      - "They can capture traffic on interfaces that have no IP address"
      - "They replace the need for the TCP/IP stack entirely"
    answer: 1
    explanation: |
      eBPF programs run in-kernel on tracepoints/kprobes, so they see all connections with tiny
      overhead and attach syscall/PID/stack context to each event — answering "which process,
      which path" rather than just showing bytes. A broad tcpdump on a busy host is expensive
      and lacks that process-level attribution. eBPF does not decrypt TLS or bypass the stack.
    ref: "concepts.md#ebpf-network-observability"

  - id: network-troubleshooting-tools-metrics-055
    difficulty: expert
    tags: [iperf3, throughput, bdp, tuning]
    question: |
      A single-stream `iperf3 -c` test over a 10 GbE LAN plateaus around 1.1 Gbps, but
      `iperf3 -c ... -P 8` reaches ~9.4 Gbps. Which explanation and fix are correct?
    options:
      - "A single flow is limited by its window/BDP, slow-start ramp, and single-CPU softirq processing; parallel streams spread across CPUs/queues and aggregate window — raise socket buffers (rmem_max/wmem_max) and use RSS/RPS for single-flow gains"
      - "The LAN is only 1 Gbps; parallel streams cannot exceed the physical link"
      - "iperf3 caps every stream at ~1 Gbps by design; you must use netperf instead"
      - "The 1.1 Gbps result is packet loss; there is no way to improve single-stream throughput"
    answer: 0
    explanation: |
      One TCP flow is bounded by its congestion/receive window relative to the BDP, by
      slow-start ramp for short tests, and by being handled largely on one CPU's softirq.
      Parallel streams parallelize across CPUs/NIC queues and sum more in-flight window,
      exposing the true link capacity. Single-flow throughput improves with larger socket
      buffers/window scaling and multiqueue steering, not more physical bandwidth.
    ref: "concepts.md#active-throughput-measurement-iperf3-netperf"

  - id: network-troubleshooting-tools-metrics-056
    difficulty: advanced
    tags: [iperf3, udp, measurement]
    question: |
      You need to measure packet loss and jitter (not just a throughput number) between two
      hosts. Which iperf3 mode is appropriate and why?
    options:
      - "TCP mode, because TCP reports loss directly in its output"
      - "UDP mode (`-u`), because UDP does not retransmit, so the receiver can report per-packet loss and jitter at a controlled send rate"
      - "TCP mode with `-P 100`, because more streams average out loss"
      - "Reverse mode (`-R`) only, because loss only occurs on the return path"
    answer: 1
    explanation: |
      In UDP mode iperf3 sends at a target rate and the receiver counts missing/late datagrams,
      reporting loss percentage and jitter — impossible to see cleanly in TCP mode where the
      stack hides loss via retransmission and backoff. Parallel TCP streams and reverse mode
      change throughput measurement, not loss/jitter reporting.
    ref: "concepts.md#active-throughput-measurement-iperf3-netperf"

  - id: network-troubleshooting-tools-metrics-057
    difficulty: expert
    tags: [host-stack, nic, drops, diagnosis]
    question: |
      `mtr` to a server is 0% loss to the destination, yet the application reports dropped
      packets under bursty load. `ethtool -S` shows rising `rx_missed_errors`/`rx_fifo_errors`
      and `/proc/net/softnet_stat` shows nonzero drops. Where is the loss?
    options:
      - "On the WAN path, which mtr is failing to detect"
      - "In DNS resolution"
      - "On the receiving host: the NIC ring buffer / per-CPU backlog overflows because softirq can't drain fast enough — enlarge the ring (ethtool -g), raise netdev_max_backlog, and tune RSS/RPS"
      - "In the TCP TIME_WAIT recycling logic"
    answer: 2
    explanation: |
      rx_missed_errors/rx_fifo_errors are NIC-side overruns (the ring filled before the CPU
      drained it), and softnet_stat drops are per-CPU backlog overflows — both are local
      receive-path drops under bursty load, not WAN loss (which mtr would show at the
      destination). Fixes are larger RX rings, higher netdev_max_backlog, and spreading
      interrupts/softirq via RSS/RPS.
    ref: "concepts.md#host-stack-drops-and-nic-counters"

  - id: network-troubleshooting-tools-metrics-058
    difficulty: advanced
    tags: [host-stack, socket-buffers, throughput]
    question: |
      On a high-BDP path a receiver keeps advertising a small window and throughput stalls,
      even though the link and CPU are lightly loaded. Which host-side cause is most likely?
    options:
      - "The DF bit is unset"
      - "The socket receive buffer cap (net.core.rmem_max / tcp_rmem) is too small, so the advertised window can't grow to the BDP — window scaling has nothing to scale to"
      - "The NIC MTU is 9000 instead of 1500"
      - "TIME_WAIT sockets are consuming the window"
    answer: 1
    explanation: |
      TCP's advertised receive window is bounded by the socket receive buffer. If rmem_max /
      tcp_rmem cap the buffer below the bandwidth-delay product, the window can never open wide
      enough to keep a long-fat pipe full, capping throughput regardless of window scaling
      being enabled. Raising the buffer caps (and enabling autotuning) fixes it.
    ref: "concepts.md#host-stack-drops-and-nic-counters"

  - id: network-troubleshooting-tools-metrics-059
    difficulty: expert
    tags: [nagle, delayed-ack, latency]
    question: |
      A synchronous RPC that sends a small header then a small body in two separate write()
      calls shows a consistent ~40 ms latency floor per call; bulk transfers on the same path
      are fast. What is happening and what is the cleanest fix?
    options:
      - "TLS renegotiation on every call; disable session tickets"
      - "The server is CPU-bound for exactly 40 ms per request"
      - "Nagle's algorithm holds the second small write until the first is ACKed, while the peer's delayed-ACK timer (~40 ms) withholds that ACK — the two deadlock; set TCP_NODELAY (or coalesce into one write)"
      - "DNS is re-resolved every call, costing 40 ms"
    answer: 2
    explanation: |
      This is the classic Nagle × delayed-ACK interaction: with unacknowledged data
      outstanding, Nagle withholds the next small segment; the receiver's delayed ACK waits up
      to ~40 ms before acknowledging, so nothing moves until that timer fires — a fixed ~40 ms
      penalty per round trip. Large writes fill full segments and don't trigger it. Disable
      Nagle with TCP_NODELAY or send the request as a single write.
    ref: "concepts.md#nagles-algorithm-and-delayed-ack"

  - id: network-troubleshooting-tools-metrics-060
    difficulty: advanced
    tags: [nagle, rfc, tcp]
    question: |
      Which statement about Nagle's algorithm (RFC 896) is accurate?
    options:
      - "It coalesces small writes by withholding a new small segment while previously sent data remains unacknowledged, sending it once an ACK arrives or a full segment accumulates"
      - "It delays ACKs to batch them, adding up to 200 ms"
      - "It disables the congestion window during slow start"
      - "It applies only to UDP datagrams"
    answer: 0
    explanation: |
      Nagle reduces tinygram overhead: while there is unacknowledged in-flight data, a small
      write is buffered until an ACK returns or enough data forms a full MSS segment. Delaying
      ACKs is the *receiver-side* delayed-ACK behavior (RFC 1122), a different mechanism; the
      40 ms problem is their interaction. Nagle is TCP-only.
    ref: "concepts.md#nagles-algorithm-and-delayed-ack"

  - id: network-troubleshooting-tools-metrics-061
    difficulty: expert
    tags: [accept-queue, syn-queue, backlog, diagnosis]
    question: |
      Under peak load, a fraction of clients get "connection timed out" while the server's
      CPU, memory, and network are all lightly used. `nstat` shows `TcpExtListenDrops` and
      `TcpExtListenOverflows` incrementing. What is the cause?
    options:
      - "The upstream DNS server is rate-limiting"
      - "The accept queue is overflowing: completed handshakes are dropped because the application isn't calling accept() fast enough (or somaxconn/backlog is too small) — the connection silently dies and the client retransmits until timeout"
      - "TLS handshakes are failing on cipher mismatch"
      - "The MTU is too large for the path"
    answer: 1
    explanation: |
      ListenOverflows/ListenDrops count completed connections dropped because the accept queue
      (min(backlog, somaxconn)) was full — the app isn't accepting quickly enough. The client's
      final ACK/connection is dropped, so it retransmits and eventually times out, even though
      server resources look idle. Fix: larger backlog/somaxconn and a faster accept loop.
    ref: "concepts.md#syn-queue-accept-queue-and-backlog-overflow"

  - id: network-troubleshooting-tools-metrics-062
    difficulty: advanced
    tags: [syn-cookies, syn-flood, tradeoff]
    question: |
      Enabling `net.ipv4.tcp_syncookies` helps a server survive a SYN flood. What is the
      trade-off for connections that are validated via cookies?
    options:
      - "It permanently disables the accept queue"
      - "It doubles the RTT of every handshake"
      - "It forces all connections to use IPv6"
      - "Because the server stores no state for the half-open connection (it encodes state in the SYN-ACK sequence number), some negotiated SYN options can be lost for cookie-validated connections"
    answer: 3
    explanation: |
      SYN cookies let the server avoid keeping SYN-queue state by encoding it into the SYN-ACK
      initial sequence number, validated when the final ACK returns. The downside is limited
      room to preserve TCP options (window scale, SACK, timestamps) for those connections, so
      some negotiated options can be lost — an acceptable trade to survive a flood.
    ref: "concepts.md#syn-queue-accept-queue-and-backlog-overflow"

  - id: network-troubleshooting-tools-metrics-063
    difficulty: expert
    tags: [conntrack, nat, kubernetes, exhaustion]
    question: |
      A Kubernetes NAT/egress node intermittently drops new connections during traffic spikes;
      dmesg shows `nf_conntrack: table full, dropping packet`. Which is the correct diagnosis
      and mitigation?
    options:
      - "The netfilter connection-tracking table (nf_conntrack_max) is full — every tracked flow (including lingering UDP entries) consumes a slot; raise nf_conntrack_max / tune timeouts, or reduce flow volume"
      - "The ephemeral port range is exhausted; lower tcp_fin_timeout"
      - "The DNS cache is poisoned; flush it"
      - "TIME_WAIT sockets exhausted memory; enable tcp_tw_recycle"
    answer: 0
    explanation: |
      The message is specific to netfilter conntrack: the flow table hit nf_conntrack_max and
      new packets/connections are dropped. This is common on NAT gateways and k8s nodes under
      high connection rates (UDP DNS entries also linger). Raise nf_conntrack_max, tune entry
      timeouts, or cut flow churn. It is distinct from port exhaustion, and tcp_tw_recycle is
      removed/harmful.
    ref: "concepts.md#conntrack-and-ephemeral-port-exhaustion"

  - id: network-troubleshooting-tools-metrics-064
    difficulty: expert
    tags: [ephemeral-ports, snat, exhaustion]
    question: |
      A service opening thousands of concurrent connections to ONE backend IP:port starts
      failing with `EADDRNOTAVAIL` ("cannot assign requested address"), even though connection
      churn is low. Why, and how does this differ from TIME_WAIT exhaustion?
    options:
      - "It's a DNS failure; the backend name stopped resolving"
      - "The source-port space for that single (srcIP→dstIP:port) tuple is exhausted by high concurrency; unlike TIME_WAIT exhaustion (driven by churn of closed connections), this happens from too many simultaneous open connections to one destination"
      - "The backend rejected the certificate"
      - "The MTU is too small for the number of connections"
    answer: 1
    explanation: |
      A connection is keyed by the 4-tuple; with a fixed source IP and one destination
      IP:port, only the ~28k ephemeral source ports distinguish connections. Enough concurrent
      connections to that single destination exhausts them → EADDRNOTAVAIL. TIME_WAIT
      exhaustion is instead driven by rapid open/close churn leaving many sockets lingering.
      Fixes: widen the port range, spread to more destination IPs/ports, or add source IPs.
    ref: "concepts.md#conntrack-and-ephemeral-port-exhaustion"

  - id: network-troubleshooting-tools-metrics-065
    difficulty: advanced
    tags: [keepalive, nat, idle-timeout]
    question: |
      A long-lived connection through a cloud load balancer works, then "dies" after a few
      minutes of idle — the next request hangs or gets a RST. Default TCP keepalive
      (tcp_keepalive_time=7200) doesn't help. Why?
    options:
      - "TCP keepalive is disabled in all clouds"
      - "The LB/NAT drops the idle flow from its state table (e.g., after 60–350s), but the default keepalive first probes only after 2 hours — far too late — so nothing keeps the middlebox's state alive; lower keepalive below the LB idle timeout or add app heartbeats"
      - "The DNS TTL expired, changing the backend IP"
      - "The receive window closed to zero during the idle period"
    answer: 1
    explanation: |
      Middleboxes evict idle flows from their connection-tracking tables after a short idle
      timeout; subsequent packets hit a box with no state and are dropped/reset. The default
      2-hour keepalive fires long after that eviction, so it can't hold the state. The fix is
      to send keepalive/heartbeat traffic more frequently than the middlebox's idle timeout.
    ref: "concepts.md#tcp-keepalive"

  - id: network-troubleshooting-tools-metrics-066
    difficulty: expert
    tags: [dns, ndots, kubernetes, latency]
    question: |
      Pods in a Kubernetes cluster show elevated latency and extra DNS queries when calling an
      external API by its FQDN `api.vendor.com`. `/etc/resolv.conf` contains `ndots:5` and
      several `search` domains. What is happening?
    options:
      - "DNSSEC validation is failing for the external name"
      - "The pod has no default route"
      - "Because the name has fewer than 5 dots, the stub resolver tries each search-domain permutation first (api.vendor.com.<ns>.svc.cluster.local, ...), each an A+AAAA query returning NXDOMAIN, before the absolute lookup — adding queries and latency"
      - "The external API changed its IP and the TTL hasn't expired"
    answer: 2
    explanation: |
      ndots:5 means names with fewer than 5 dots are treated as relative first, so the resolver
      walks the search list, issuing A and AAAA queries per permutation that all NXDOMAIN
      before finally querying the absolute name. That multiplies query count and latency. Fixes:
      append a trailing dot to FQDNs, reduce ndots, or use NodeLocal DNSCache.
    ref: "concepts.md#dns-resolver-configuration-and-latency"

  - id: network-troubleshooting-tools-metrics-067
    difficulty: expert
    tags: [dns, truncation, tcp-fallback]
    question: |
      Resolving a domain with a large DNSSEC/many-record response fails intermittently for
      some clients, while small responses for other names succeed. Captures show a DNS reply
      with the TC (truncated) bit set. What is the most likely root cause?
    options:
      - "The authoritative server is down"
      - "A firewall permits DNS over UDP/53 but blocks DNS over TCP/53, so clients that must retry the truncated response over TCP fail"
      - "The client is using the wrong resolver IP"
      - "The record's TTL is zero"
    answer: 1
    explanation: |
      When a response exceeds the negotiated EDNS0/UDP size it is returned with the TC bit set,
      instructing the client to retry over TCP. If a middlebox allows UDP/53 but blocks TCP/53
      (a common misconfiguration), the retry fails — so large responses break while small
      UDP-fitting ones work. Allow DNS over TCP (and sensible EDNS0 sizing).
    ref: "concepts.md#dns-resolver-configuration-and-latency"

  - id: network-troubleshooting-tools-metrics-068
    difficulty: advanced
    tags: [happy-eyeballs, dual-stack, ipv6]
    question: |
      On a dual-stack host, `curl https://site.example` is sometimes slow to connect, while
      `curl -4 https://site.example` is consistently fast. What does Happy Eyeballs v2
      (RFC 8305) explain here?
    options:
      - "IPv6 is always slower than IPv4 by protocol design"
      - "The IPv6 (AAAA) path is black-holing; Happy Eyeballs races AAAA first with a short stagger before falling back to IPv4, so the wasted delay before fallback adds latency — the broken IPv6 path is the culprit"
      - "curl caches IPv4 results but not IPv6"
      - "The DNS server refuses AAAA queries"
    answer: 1
    explanation: |
      Happy Eyeballs v2 resolves both families and starts the IPv6 attempt first, launching the
      IPv4 attempt after a small delay if IPv6 hasn't connected. If the IPv6 route is broken,
      the client burns that stagger interval before succeeding on IPv4 — explaining the
      intermittent slow connects that vanish when you force `-4`. Fix the IPv6 path.
    ref: "concepts.md#happy-eyeballs-and-dual-stack-racing"

  - id: network-troubleshooting-tools-metrics-069
    difficulty: expert
    tags: [percentiles, coordinated-omission, measurement]
    question: |
      A closed-loop load generator (send next request only after the previous response) reports
      an excellent p99, yet real users experience severe tail latency during backend stalls.
      What measurement flaw most likely causes the optimistic p99?
    options:
      - "Coordinated omission: while the system stalls, the generator stops issuing requests, so the requests that *would* have queued are never sampled — the tail that real (open-loop) traffic experiences is omitted"
      - "The generator used too few threads"
      - "The percentiles were computed with a histogram"
      - "The clock resolution was too fine"
    answer: 0
    explanation: |
      In a closed loop, a stall pauses request submission, so the long waits that queued
      arrivals would have suffered are never measured — the reported tail is artificially good.
      This is coordinated omission (Gil Tene). Correct it by measuring latency relative to the
      intended send schedule (open-loop / constant-rate) or using tools that compensate.
    ref: "concepts.md#percentiles-and-tail-latency-measurement"

  - id: network-troubleshooting-tools-metrics-070
    difficulty: advanced
    tags: [percentiles, tail-at-scale, fanout]
    question: |
      A request fans out to 50 independent backends and must wait for all to respond. Each
      backend has a 1% chance of a slow (tail) response. Why is the parent request's tail
      latency far worse than any single backend's p99, and what mitigates it?
    options:
      - "It isn't worse; the parent p99 equals the backend p99"
      - "With 50 independent backends, the chance that at least one is slow is ~1−0.99^50 ≈ 39%, so the parent frequently waits on a tail; hedged/tied requests, fewer dependencies, and tail-tolerant design mitigate it (Tail at Scale)"
      - "Averaging the 50 latencies removes the tail"
      - "TCP retransmission automatically hides backend tails"
    answer: 1
    explanation: |
      Because the parent waits for the slowest of many independent calls, the probability that
      *some* backend is in its tail grows with fan-out (1−0.99^50 ≈ 39%), so parent tail
      latency is dominated by dependency tails — the "tail at scale" effect (Dean & Barroso).
      Hedged/tied requests, reducing fan-out, and tail-tolerant techniques address it.
    ref: "concepts.md#percentiles-and-tail-latency-measurement"

  - id: network-troubleshooting-tools-metrics-071
    difficulty: expert
    tags: [littles-law, utilization, queueing]
    question: |
      A latency-sensitive service has ample CPU/bandwidth headroom, yet p99 latency is fine at
      60% utilization and terrible at 90%. Using elementary queueing theory, why?
    options:
      - "Latency is independent of utilization; this must be a bandwidth cap"
      - "For an M/M/1-like system, queueing delay scales as 1/(1−ρ); as utilization ρ rises from 0.6 to 0.9 the factor jumps from 2.5× to 10×, so latency explodes near the knee even with spare capacity — run with headroom"
      - "Little's Law says latency falls as utilization rises"
      - "The MTU must be reduced to lower latency"
    answer: 1
    explanation: |
      Mean time in system scales as 1/(1−ρ): at ρ=0.6 that's 2.5×, at ρ=0.9 it's 10× — latency
      grows nonlinearly and blows up as ρ→1, independent of raw bandwidth/CPU limits. This is
      the utilization knee; latency-sensitive systems must run with headroom rather than at
      near-100% utilization.
    ref: "concepts.md#littles-law-and-the-utilization-latency-knee"

  - id: network-troubleshooting-tools-metrics-072
    difficulty: advanced
    tags: [littles-law, concurrency, capacity]
    question: |
      A service sustains 2,000 requests/sec with an average end-to-end latency of 50 ms. By
      Little's Law, roughly how many requests are being processed concurrently on average?
    options:
      - "40"
      - "100"
      - "1,000"
      - "40,000"
    answer: 1
    explanation: |
      Little's Law: L = λ · W = 2000 req/s × 0.050 s = 100 concurrent requests on average. This
      is how you size thread/connection pools: required concurrency = throughput × latency.
    ref: "concepts.md#littles-law-and-the-utilization-latency-knee"

  - id: network-troubleshooting-tools-metrics-073
    difficulty: expert
    tags: [quic, http3, observability, udp]
    question: |
      An HTTP/3 service "isn't being used" on a corporate network — browsers silently fall
      back to HTTP/2 — yet HTTPS pages load fine. A `tcpdump 'tcp port 443'` shows normal TLS
      traffic and nothing unusual. What is the most likely cause and the right capture change?
    options:
      - "The firewall blocks/rate-limits UDP/443, so QUIC can't establish and clients fall back to TCP; capture `udp port 443` to confirm QUIC attempts are dropped"
      - "The certificate is invalid; re-issue it"
      - "HTTP/3 requires a separate DNS record that is missing; add an A record"
      - "The server's TCP accept queue is overflowing"
    answer: 0
    explanation: |
      QUIC/HTTP-3 runs over UDP/443; if the network blocks UDP/443, QUIC handshakes fail and
      clients transparently fall back to HTTP/2 over TCP — so TLS-over-TCP looks healthy while
      HTTP/3 is never used. A `tcp port 443` filter can't see the missing QUIC; capture
      `udp port 443` to observe the dropped/unanswered QUIC Initial packets.
    ref: "concepts.md#quic-and-http3-observability"

  - id: network-troubleshooting-tools-metrics-074
    difficulty: expert
    tags: [quic, connection-id, migration]
    question: |
      Why can a QUIC connection survive a client's network change (e.g., Wi-Fi to cellular)
      that changes its IP and port, whereas a TCP connection would break?
    options:
      - "QUIC pins the connection to the MAC address"
      - "QUIC identifies a connection by a Connection ID rather than the 4-tuple, so it can migrate across IP/port changes; TCP is bound to the 4-tuple and breaks when it changes"
      - "QUIC re-runs DNS on every packet"
      - "QUIC disables NAT entirely"
    answer: 1
    explanation: |
      QUIC (RFC 9000) uses Connection IDs to identify a connection independent of the
      IP/port 4-tuple, enabling connection migration when the client's address changes. TCP is
      identified strictly by the 4-tuple, so a NAT rebinding or interface change tears it down.
      This also means you can't reliably track a QUIC flow by 5-tuple in a capture.
    ref: "concepts.md#quic-and-http3-observability"

  - id: network-troubleshooting-tools-metrics-075
    difficulty: expert
    tags: [tls, sslkeylogfile, wireshark]
    question: |
      You captured a TLS 1.3 session and want to read the HTTP/2 requests inside it in
      Wireshark. You have the server's RSA private key. What actually works?
    options:
      - "Load the server's private key into Wireshark; TLS 1.3 decrypts from it directly"
      - "Nothing can decrypt TLS 1.3 under any circumstances"
      - "Set SSLKEYLOGFILE before running the client so it writes the session secrets, then load that keylog into Wireshark; the server private key alone cannot decrypt TLS 1.3 because key exchange is ephemeral (EC)DHE"
      - "Use `curl -k` on the capture file to strip encryption"
    answer: 2
    explanation: |
      TLS 1.3 uses ephemeral (EC)DHE key exchange, so there is no static-RSA path to recover
      the session key from the server's private key. The practical method is SSLKEYLOGFILE:
      the client writes per-session secrets to a file that Wireshark uses to decrypt the
      captured records (including HTTP/2 frames and QUIC). `-k` only skips validation on a live
      request; it doesn't decrypt a pcap.
    ref: "concepts.md#decrypting-tls-captures"

  - id: network-troubleshooting-tools-metrics-076
    difficulty: expert
    tags: [capture, sack, reordering, dsack]
    question: |
      In a Wireshark capture you must distinguish real packet loss from packet reordering.
      Which observation most specifically indicates reordering / a spurious retransmit rather
      than genuine loss?
    options:
      - "A burst of `tcp.analysis.retransmission` frames"
      - "A `tcp.analysis.zero_window` from the receiver"
      - "A D-SACK block (the receiver SACK-acknowledging a segment it already had), often flagged as spurious_retransmission — it means data arrived (late/duplicated), not that it was lost"
      - "A SYN with the SACK-permitted option set"
    answer: 2
    explanation: |
      D-SACK (RFC 2883) reports a duplicate segment the receiver already possessed, which
      happens with reordering or an unnecessary retransmit — evidence the data was NOT lost,
      just late/duplicated. Plain retransmissions and zero-window indicate loss or a stalled
      receiver respectively; SACK-permitted in the SYN merely negotiates the capability.
    ref: "concepts.md#reading-a-capture-handshake-and-loss-signatures"

  - id: network-troubleshooting-tools-metrics-077
    difficulty: advanced
    tags: [capture, handshake, syn-options]
    question: |
      While reviewing a captured TCP handshake to explain poor throughput on a long-fat
      network, which SYN/SYN-ACK option is most important to verify was negotiated?
    options:
      - "The Window Scale option (RFC 7323) — without it the window is capped at 65,535 bytes, far below the BDP, throttling throughput"
      - "The DF bit in the IP header"
      - "The TTL value in the SYN"
      - "The source port being in the ephemeral range"
    answer: 0
    explanation: |
      On a high-BDP path, throughput needs a window ≥ BDP, which requires the window scale
      option to exceed the 64 KB unscaled limit. If either side omitted window scaling in its
      SYN, the window caps at 65,535 bytes and throughput is throttled regardless of bandwidth.
      DF/TTL/source port don't gate window size.
    ref: "concepts.md#reading-a-capture-handshake-and-loss-signatures"

  - id: network-troubleshooting-tools-metrics-078
    difficulty: expert
    tags: [rst, injection, security, tcp]
    question: |
      You suspect a middlebox is injecting forged RSTs to tear down connections. Which TCP
      behavior determines whether an injected RST is actually honored by an endpoint?
    options:
      - "The RST is honored only if it carries a valid TLS certificate"
      - "Any RST with the correct 4-tuple is always honored regardless of sequence number"
      - "The RST is honored only if it arrives on IPv6"
      - "The RST is accepted only if its sequence number falls within the receiver's current receive window (RFC 9293); out-of-window RSTs are ignored"
    answer: 3
    explanation: |
      TCP validates a RST's sequence number against the current receive window; a RST whose
      sequence number is outside the window is discarded (a hardening against blind/forged
      RSTs). An injector must guess a sequence number within the window for the RST to take
      effect — which is why some injected RSTs are ignored and helps identify forged resets.
    ref: "concepts.md#rst-diagnosis-and-connection-timeout-timing"

  - id: network-troubleshooting-tools-metrics-079
    difficulty: advanced
    tags: [connection-timeout, syn-retries, backoff]
    question: |
      Why does a connection attempt to a silently-dropping (drop-rule) host take on the order
      of two minutes to fail with "connection timed out," rather than failing immediately?
    options:
      - "The DNS lookup retries for two minutes"
      - "The kernel retransmits the unanswered SYN with exponential backoff (1s, 2s, 4s, …) up to tcp_syn_retries times, so the cumulative delay before giving up is ~127 s+ by default"
      - "TLS negotiation blocks for two minutes"
      - "The application layer imposes a fixed 120 s timeout unrelated to TCP"
    answer: 1
    explanation: |
      With no SYN-ACK, TCP retransmits the SYN using exponential backoff (roughly 1,2,4,8,…
      seconds) for tcp_syn_retries attempts; the default (~6 retries) sums to about 127+
      seconds before the kernel reports the connection timed out. The specific, long duration
      is a direct consequence of SYN retransmit backoff, not DNS/TLS/app timeouts.
    ref: "concepts.md#rst-diagnosis-and-connection-timeout-timing"

  - id: network-troubleshooting-tools-metrics-080
    difficulty: advanced
    tags: [tcp-states, fin-wait-2, close-wait]
    question: |
      A client accumulates sockets in FIN_WAIT_2 to a server that simultaneously accumulates
      sockets in CLOSE_WAIT. What is happening?
    options:
      - "The client is under a SYN flood"
      - "The client actively closed (its FIN was ACKed → FIN_WAIT_2) and is waiting for the server's FIN, but the server's application received the FIN (CLOSE_WAIT) and never calls close() — a server-side socket leak seen from both ends"
      - "Both sides are in TIME_WAIT and will clear in 2×MSL"
      - "The MSS was negotiated incorrectly, stalling teardown"
    answer: 1
    explanation: |
      FIN_WAIT_2 on the active closer means our FIN was acknowledged and we're waiting for the
      peer's FIN. The peer sits in CLOSE_WAIT because its kernel received our FIN but the
      application hasn't called close(). The mirrored buildup is the same root cause — the
      server app leaking sockets — observed from each side.
    ref: "concepts.md#tcp-states-beyond-time_wait-and-close_wait"

  - id: network-troubleshooting-tools-metrics-081
    difficulty: expert
    tags: [policing, congestion, loss, capture]
    question: |
      Two flows both show ~1% loss, but analysis reveals different mechanisms. Flow A loses
      packets only above a fixed rate ceiling with a flat throughput plateau regardless of
      queue depth; Flow B's loss rises with queue occupancy and RTT. Which is which, and what
      are the right fixes?
    options:
      - "Flow A is traffic policing (hard rate cap dropping bursts even when uncongested) → fix by shaping to the rate; Flow B is congestion/queue-overflow loss → fix with AQM (e.g., FQ-CoDel)"
      - "Both are congestion; add buffers to each"
      - "Flow A is congestion, Flow B is policing; both need bigger buffers"
      - "Both are reordering; enable SACK"
    answer: 0
    explanation: |
      Policing enforces a hard rate and drops any burst above it independent of buffer state,
      producing a rate-ceiling plateau and loss even when the link isn't congested — the cure
      is shaping (buffer/pace to the rate). Congestion loss tracks queue occupancy/RTT and is
      addressed by AQM (FQ-CoDel/CAKE). Bigger buffers worsen bufferbloat; SACK addresses
      reordering, not either loss type here.
    ref: "concepts.md#one-way-delay-asymmetry-and-loss-types"

  - id: network-troubleshooting-tools-metrics-082
    difficulty: advanced
    tags: [owamp, twamp, one-way-delay, asymmetry]
    question: |
      You must measure one-way delay on a path you suspect is asymmetric (forward and return
      routes differ). Why is halving the ping RTT inadequate, and what measures it properly?
    options:
      - "RTT/2 is always exact; no other tool is needed"
      - "Use traceroute, which reports one-way delay per hop"
      - "RTT/2 assumes a symmetric path, which fails when forward/return routes differ; use OWAMP (RFC 4656) / TWAMP (RFC 5357) with synchronized clocks to measure each direction separately"
      - "Use tcpdump, which prints one-way delay in its default output"
    answer: 2
    explanation: |
      RTT/2 only equals one-way delay when the two directions are symmetric; asymmetric routing
      makes forward and return delays unequal, so halving RTT is wrong. OWAMP/TWAMP measure one
      direction at a time using time-synchronized endpoints (NTP/PTP). Traceroute and tcpdump
      don't report true one-way delay.
    ref: "concepts.md#one-way-delay-asymmetry-and-loss-types"

  - id: network-troubleshooting-tools-metrics-083
    difficulty: expert
    tags: [congestion-control, bbr, cubic, bufferbloat]
    question: |
      Why does BBR (as opposed to CUBIC/Reno) tend to avoid inducing bufferbloat on a
      bottleneck link?
    options:
      - "BBR disables retransmission entirely"
      - "BBR is loss-based and fills the buffer faster, draining it sooner"
      - "BBR models the bottleneck bandwidth and minimum RTT and paces near that operating point, so it doesn't keep pushing until the buffer overflows the way loss-based CUBIC/Reno do"
      - "BBR only works on datacenter links with ECN"
    answer: 2
    explanation: |
      BBR estimates the bottleneck bandwidth and minimum RTT and paces its send rate around
      that point, so it doesn't rely on filling the buffer until a drop signals congestion.
      Loss-based CUBIC/Reno keep increasing until the buffer overflows, building a standing
      queue (bufferbloat). This is why BBR generally keeps queues — and latency — lower.
    ref: "concepts.md#modern-congestion-control-and-aqm-l4s"

  - id: network-troubleshooting-tools-metrics-084
    difficulty: expert
    tags: [l4s, aqm, ecn, low-latency]
    question: |
      L4S (RFC 9330/9331/9332) targets ultra-low queuing latency without starving classic
      traffic. Which mechanism does it use?
    options:
      - "It enlarges router buffers to absorb all bursts"
      - "It marks L4S traffic with the ECN codepoint ECT(1) and uses a DualQ Coupled AQM to give scalable-congestion-control flows a separate, very-low-latency queue coupled to the classic queue"
      - "It disables ECN and relies purely on packet drops"
      - "It forces all flows onto a single FIFO queue with a large buffer"
    answer: 1
    explanation: |
      L4S identifies its traffic with the ECN codepoint ECT(1) and uses a DualQ Coupled AQM
      (RFC 9332): a low-latency queue for scalable-CC (L4S) flows coupled to a classic queue,
      so L4S gets near-zero queuing delay while remaining fair to classic traffic. It relies on
      fine-grained ECN marking, not bigger buffers or pure drops.
    ref: "concepts.md#modern-congestion-control-and-aqm-l4s"

  - id: network-troubleshooting-tools-metrics-085
    difficulty: expert
    tags: [dplpmtud, quic, pmtud, blackhole]
    question: |
      QUIC-based transports avoid the classic PMTUD black hole even when ICMP "Packet Too Big"
      is filtered. How?
    options:
      - "They always fragment at the IP layer"
      - "They query the path MTU from DNS"
      - "They set the DF bit to zero and rely on router fragmentation"
      - "They use DPLPMTUD (RFC 8899): the transport probes the path MTU by sending progressively larger probe packets and observing acknowledgements, requiring no ICMP — and QUIC pads its Initial packets to at least 1200 bytes as a safe floor"
    answer: 3
    explanation: |
      DPLPMTUD (RFC 8899) discovers the path MTU at the packetization layer by probing with
      larger packets and confirming via transport ACKs, so it doesn't depend on ICMP messages
      that firewalls often drop. QUIC uses this and additionally pads Initial packets to ≥1200
      bytes to guarantee a workable minimum, sidestepping black holes that plague ICMP-based
      PMTUD.
    ref: "concepts.md#modern-congestion-control-and-aqm-l4s"
