topic: "TCP Deep Dive: Handshake, Flow & Congestion Control"
domain: networking
topic_slug: tcp-deep-dive-handshake-flow-congestion
version: 1
questions:
  - id: tcp-deep-dive-handshake-flow-congestion-001
    difficulty: beginner
    tags: [handshake, syn, setup]
    question: |
      Which sequence of segments correctly describes the TCP three-way handshake?
    options:
      - "SYN → SYN-ACK → ACK"
      - "SYN → ACK → SYN-ACK"
      - "SYN-ACK → SYN → ACK"
      - "ACK → SYN → SYN-ACK"
    answer: 0
    explanation: |
      The client sends SYN, the server replies with SYN-ACK (its own SYN plus an
      acknowledgment of the client's SYN), and the client finishes with an ACK. That
      third ACK moves both sides to ESTABLISHED.
    ref: "concepts.md#the-three-way-handshake-and-sequence-numbers"

  - id: tcp-deep-dive-handshake-flow-congestion-002
    difficulty: beginner
    tags: [handshake, sequence-numbers]
    question: |
      A client sends a SYN with seq=5000. Assuming no data in the SYN, what
      acknowledgment number will the server's SYN-ACK carry?
    options:
      - "5001"
      - "5000"
      - "4999"
      - "0 (ACKs start at zero)"
    answer: 0
    explanation: |
      The SYN flag consumes one sequence number even though it carries no data. The
      server therefore acknowledges the next expected byte, seq+1 = 5001.
    ref: "concepts.md#the-three-way-handshake-and-sequence-numbers"

  - id: tcp-deep-dive-handshake-flow-congestion-003
    difficulty: beginner
    tags: [handshake, purpose]
    question: |
      Why does TCP use three messages in its handshake rather than two?
    options:
      - "To negotiate the maximum transmission unit of the physical link so segments never fragment mid-path"
      - "So the two endpoints can exchange TLS session keys inline before any application data flows"
      - "So both directions of the byte stream have their initial sequence numbers synchronized and acknowledged"
      - "To measure the available path bandwidth with a probe burst before any application data is sent"
    answer: 2
    explanation: |
      TCP is full-duplex, so each direction needs its ISN synchronized and acknowledged.
      The server piggy-backs its SYN onto the ACK of the client's SYN, collapsing four
      logical steps into three segments.
    ref: "concepts.md#the-three-way-handshake-and-sequence-numbers"

  - id: tcp-deep-dive-handshake-flow-congestion-004
    difficulty: intermediate
    tags: [isn, security, randomization]
    question: |
      Why does modern TCP (RFC 9293/6528) randomize the Initial Sequence Number
      rather than starting from a fixed value?
    options:
      - "To make it harder for off-path attackers to guess sequence numbers and spoof segments, and to avoid confusion with old connection incarnations"
      - "To compress the segment header by letting the stack encode shorter, lower-valued sequence numbers"
      - "Because randomized ISNs feed the AIMD estimator and improve congestion-control fairness across flows"
      - "To let the receiver reconstruct the sender's clock frequency for more accurate round-trip sampling"
    answer: 0
    explanation: |
      A predictable ISN lets an off-path attacker inject or spoof segments into a
      connection. Randomization (RFC 6528) also prevents delayed segments from a previous
      incarnation of the same 4-tuple from being mistaken for the new connection's data.
    ref: "concepts.md#the-three-way-handshake-and-sequence-numbers"

  - id: tcp-deep-dive-handshake-flow-congestion-005
    difficulty: intermediate
    tags: [4-tuple, identity]
    question: |
      Two TCP connections have identical source IP, destination IP, and destination
      port, but different source ports. Are they the same connection?
    options:
      - "No — a connection is identified by the full 4-tuple, and the source ports differ"
      - "Yes — three of the four fields match, so the kernel coalesces them into one shared connection"
      - "Yes, but only when both connections happen to use the same congestion-control algorithm"
      - "It is undefined behavior in TCP and the outcome depends entirely on the operating system"
    answer: 0
    explanation: |
      A TCP connection is uniquely identified by the 4-tuple (source IP, source port,
      destination IP, destination port). Differing in any one field — here the source
      port — makes them distinct connections.
    ref: "concepts.md#the-three-way-handshake-and-sequence-numbers"

  - id: tcp-deep-dive-handshake-flow-congestion-006
    difficulty: advanced
    tags: [syn-flood, syn-cookies, security]
    question: |
      A server is under a SYN flood that fills its backlog with half-open connections.
      How do SYN cookies mitigate this?
    options:
      - "They drop every third incoming SYN so the backlog fills more slowly and sheds load statistically"
      - "They encrypt each SYN with a per-server key so only legitimate clients can complete the handshake"
      - "They encode the needed connection state into the ISN of the SYN-ACK, so no memory is allocated until a valid final ACK returns"
      - "They lengthen the TIME_WAIT interval so stale half-open backlog entries expire much faster"
    answer: 2
    explanation: |
      SYN cookies avoid allocating backlog memory for half-open connections by encoding
      the required state in the server's chosen ISN. State is reconstructed only when the
      client's final ACK arrives carrying the validated cookie value.
    ref: "concepts.md#the-three-way-handshake-and-sequence-numbers"

  - id: tcp-deep-dive-handshake-flow-congestion-007
    difficulty: beginner
    tags: [header, ack-number, cumulative]
    question: |
      What does the acknowledgment number field in a TCP header represent?
    options:
      - "The number of segments received so far"
      - "The sequence number of the last byte successfully received"
      - "The next byte the sender of the ACK expects to receive"
      - "A random nonce echoed back for security"
    answer: 2
    explanation: |
      The ACK number is the next expected byte — it is cumulative, meaning all bytes
      below it have been received contiguously. It is one past the last in-order byte
      received.
    ref: "concepts.md#tcp-segment-header-and-flags"

  - id: tcp-deep-dive-handshake-flow-congestion-008
    difficulty: intermediate
    tags: [header, rst, fin]
    question: |
      What is the key difference between a FIN and an RST segment?
    options:
      - "FIN is a graceful close of one direction; RST is an abrupt abort of the whole connection with no graceful teardown"
      - "FIN aborts the connection immediately; RST closes it gracefully after fully draining both send buffers"
      - "They are functionally identical; RST is simply the IPv6-era renaming of the classic FIN flag"
      - "FIN may be sent only by servers, whereas RST may be sent only by the connecting client side"
    answer: 0
    explanation: |
      FIN signals 'I have finished sending' and begins an orderly, four-way close. RST
      immediately tears the connection down — it is sent, for example, when a segment
      arrives for a nonexistent connection (like connecting to a closed port).
    ref: "concepts.md#tcp-segment-header-and-flags"

  - id: tcp-deep-dive-handshake-flow-congestion-009
    difficulty: beginner
    tags: [header, sequence-numbers, bytes]
    question: |
      TCP sequence numbers count which of the following?
    options:
      - "Bytes in the stream"
      - "Segments transmitted"
      - "Round trips completed"
      - "Windows advertised"
    answer: 0
    explanation: |
      TCP is a byte-stream protocol. Sequence numbers are byte offsets, not segment
      counts, which lets the receiver reorder data and detect exactly which bytes are
      missing.
    ref: "concepts.md#tcp-segment-header-and-flags"

  - id: tcp-deep-dive-handshake-flow-congestion-010
    difficulty: intermediate
    tags: [header, window-scale, options]
    question: |
      A high-bandwidth, high-latency link needs a window far larger than 64 KiB. Which
      mechanism makes that possible despite the 16-bit Window field?
    options:
      - "The Window Scale option negotiated during the handshake (RFC 7323)"
      - "The 16-bit Urgent Pointer field, which extends the window when the URG flag is set"
      - "Setting the PSH flag on every segment so the receiver advertises a larger buffer"
      - "Opening several parallel SYN segments and summing their individual advertised windows"
    answer: 0
    explanation: |
      The base Window field is only 16 bits (max 65535). The Window Scale option (RFC
      7323), negotiated in the SYN exchange, applies a left-shift so effective windows
      can be much larger, which is essential on high bandwidth-delay-product links.
    ref: "concepts.md#tcp-segment-header-and-flags"

  - id: tcp-deep-dive-handshake-flow-congestion-011
    difficulty: intermediate
    tags: [rst, closed-port]
    question: |
      A client sends a SYN to TCP port 9999 on a host where nothing is listening on that
      port. What is the typical response?
    options:
      - "The SYN is silently queued in the backlog until an application eventually binds the port"
      - "A SYN-ACK advertising window=0, telling the client to wait for a listener to appear"
      - "An RST segment, indicating no such connection/listener exists"
      - "An ICMP redirect message steering the client toward a host that is listening"
    answer: 2
    explanation: |
      When a segment arrives for a connection/port that does not exist, TCP responds with
      an RST. That is how a client learns a port is closed ('connection refused'), as
      opposed to a filtered port that simply drops the SYN.
    ref: "concepts.md#tcp-segment-header-and-flags"

  - id: tcp-deep-dive-handshake-flow-congestion-012
    difficulty: beginner
    tags: [state-machine, listen]
    question: |
      Which TCP state is a server in while it waits for incoming connection requests?
    options:
      - "SYN_SENT"
      - "ESTABLISHED"
      - "LISTEN"
      - "TIME_WAIT"
    answer: 2
    explanation: |
      A passive opener (server) sits in LISTEN awaiting SYNs. On receiving one it moves to
      SYN_RECEIVED, then to ESTABLISHED after the final ACK.
    ref: "concepts.md#tcp-state-machine"

  - id: tcp-deep-dive-handshake-flow-congestion-013
    difficulty: intermediate
    tags: [state-machine, close-wait, debugging]
    question: |
      You observe hundreds of sockets stuck in CLOSE_WAIT on your server. What is the
      most likely cause?
    options:
      - "The application received the peer's FIN but never called close() on its socket"
      - "The network path is repeatedly dropping the connection's final ACK, stranding the sockets"
      - "The kernel's TIME_WAIT timer is configured far too high, holding sockets open past 2·MSL"
      - "The client is under a SYN flood that is spilling half-open entries into CLOSE_WAIT"
    answer: 0
    explanation: |
      CLOSE_WAIT means the peer sent FIN and TCP acked it, but the local application has
      not yet closed its side. A pile-up of CLOSE_WAIT sockets is almost always an
      application bug — a leaked/unclosed socket.
    ref: "concepts.md#tcp-state-machine"

  - id: tcp-deep-dive-handshake-flow-congestion-014
    difficulty: intermediate
    tags: [state-machine, active-close, time-wait]
    question: |
      Which endpoint ends up in the TIME_WAIT state?
    options:
      - "The endpoint that sends the first FIN (performs the active close)"
      - "The endpoint that receives the first FIN and performs the passive close of the connection"
      - "Whichever endpoint holds the numerically higher IP address in the connection 4-tuple"
      - "Both endpoints always enter TIME_WAIT simultaneously once the final ACK is exchanged"
    answer: 0
    explanation: |
      The active closer — the side that sends the first FIN — passes through FIN_WAIT_1/2
      and ends in TIME_WAIT. The passive closer goes CLOSE_WAIT → LAST_ACK → CLOSED.
    ref: "concepts.md#tcp-state-machine"

  - id: tcp-deep-dive-handshake-flow-congestion-015
    difficulty: advanced
    tags: [state-machine, simultaneous-close, closing]
    question: |
      If both endpoints send FIN at nearly the same time before receiving the other's
      FIN, which state do they transition through?
    options:
      - "LAST_ACK"
      - "CLOSE_WAIT"
      - "CLOSING"
      - "SYN_RECEIVED"
    answer: 2
    explanation: |
      A simultaneous close leads both sides through the CLOSING state (each has sent a FIN
      and is awaiting the ACK of its own FIN), after which both enter TIME_WAIT.
    ref: "concepts.md#tcp-state-machine"

  - id: tcp-deep-dive-handshake-flow-congestion-016
    difficulty: beginner
    tags: [teardown, four-way, fin]
    question: |
      Why is a graceful TCP connection teardown described as a four-way exchange?
    options:
      - "Because each direction of the full-duplex connection is closed independently with its own FIN and ACK"
      - "Because four intermediate routers along the path must each confirm and forward the close request"
      - "Because TCP retransmits every FIN exactly three times and then follows it with a single final ACK"
      - "Because both an IPv4-format FIN and an IPv6-format FIN must be sent to close the connection"
    answer: 0
    explanation: |
      TCP is full-duplex, so each direction is shut down separately: each side sends a FIN
      and receives an ACK. That is four segments, though the middle two can sometimes be
      combined when one side has no more data.
    ref: "concepts.md#connection-teardown-and-time_wait"

  - id: tcp-deep-dive-handshake-flow-congestion-017
    difficulty: intermediate
    tags: [time-wait, 2msl, reliability]
    question: |
      What are the two purposes of the TIME_WAIT state lasting 2·MSL?
    options:
      - "To measure the connection's round-trip time accurately and to renegotiate the window-scale factor"
      - "To keep the congestion window warm for reuse and to shield the closer from incoming SYN floods"
      - "To reliably retransmit the final ACK if the peer's FIN is repeated, and to let old duplicate segments drain before the 4-tuple is reused"
      - "To exchange fresh encryption keys for the next connection and to reset both sides' sequence numbers"
    answer: 2
    explanation: |
      2·MSL guarantees the active closer is still present to re-ACK a retransmitted FIN if
      the final ACK is lost, and it ensures any lingering segments from this connection
      expire before the same 4-tuple can be reused by a new connection.
    ref: "concepts.md#connection-teardown-and-time_wait"

  - id: tcp-deep-dive-handshake-flow-congestion-018
    difficulty: advanced
    tags: [time-wait, port-exhaustion, tuning]
    question: |
      A busy service that actively closes many short-lived connections runs out of local
      ports due to TIME_WAIT accumulation. Which is a SOUND mitigation?
    options:
      - "Enable Linux tcp_tw_recycle to aggressively recycle TIME_WAIT sockets the moment their FIN is acked"
      - "Disable the TIME_WAIT state entirely with a kernel flag so ports are freed the instant a connection closes"
      - "Reuse connections via keep-alive and rely on tcp_tw_reuse for outbound connections when safe"
      - "Set the maximum segment lifetime to zero so the TIME_WAIT interval collapses and never lasts"
    answer: 2
    explanation: |
      Connection reuse (keep-alive) and tcp_tw_reuse for outbound connections are safe,
      recommended mitigations. tcp_tw_recycle was removed from Linux because it broke
      clients behind NAT; disabling TIME_WAIT or zeroing MSL is unsafe and breaks TCP's
      correctness guarantees.
    ref: "concepts.md#connection-teardown-and-time_wait"

  - id: tcp-deep-dive-handshake-flow-congestion-019
    difficulty: beginner
    tags: [reliability, cumulative-ack]
    question: |
      A receiver sends ACK=3001. What does this cumulative acknowledgment guarantee?
    options:
      - "That only the single byte at offset 3001 arrived, with no claim about earlier bytes"
      - "That a total of 3001 individual segments have arrived at the receiver so far"
      - "All bytes up to and including offset 3000 have been received contiguously"
      - "That the receiver's currently advertised window is exactly 3001 bytes of free space"
    answer: 2
    explanation: |
      A cumulative ACK of 3001 means every byte through 3000 arrived in order; 3001 is the
      next byte expected. It says nothing definitive about bytes beyond a gap — that is
      what SACK adds.
    ref: "concepts.md#reliable-delivery-and-cumulative-ack"

  - id: tcp-deep-dive-handshake-flow-congestion-020
    difficulty: intermediate
    tags: [reliability, duplicate-ack, loss]
    question: |
      Four 1000-byte segments are sent starting at seq 1. Segment 2 (bytes 1001–2000) is
      lost, but segments 1, 3, and 4 arrive. What ACK number does the receiver keep
      sending as 3 and 4 arrive?
    options:
      - "ACK=4001"
      - "ACK=2001"
      - "ACK=1001"
      - "ACK=3001"
    answer: 2
    explanation: |
      Cumulative ACKs cannot advance past the missing byte 1001. Each out-of-order
      arrival (segments 3 and 4) makes the receiver re-send ACK=1001 — these duplicate
      ACKs are what trigger fast retransmit.
    ref: "concepts.md#reliable-delivery-and-cumulative-ack"

  - id: tcp-deep-dive-handshake-flow-congestion-021
    difficulty: advanced
    tags: [reliability, paws, timestamps]
    question: |
      On a very high-bandwidth link, the 32-bit sequence space could wrap within a single
      MSL, risking confusion between old and new data. Which mechanism protects against
      this?
    options:
      - "SYN cookies, which stamp a per-segment nonce into each sequence number"
      - "Nagle's algorithm, by coalescing small writes so sequence values advance slower"
      - "PAWS, using the TCP Timestamps option (RFC 7323)"
      - "Delayed ACK, which spaces acknowledgments to keep the sequence space from wrapping"
    answer: 2
    explanation: |
      PAWS (Protection Against Wrapped Sequence numbers) uses the monotonically increasing
      Timestamps option to reject segments whose timestamps indicate they belong to an old
      incarnation, preventing wrap-around confusion on fast links.
    ref: "concepts.md#reliable-delivery-and-cumulative-ack"

  - id: tcp-deep-dive-handshake-flow-congestion-022
    difficulty: intermediate
    tags: [rto, estimation, rfc6298]
    question: |
      According to RFC 6298, how is the retransmission timeout computed from the smoothed
      RTT (SRTT) and RTT variance (RTTVAR)?
    options:
      - "RTO = SRTT × 2, doubling the smoothed estimate to leave a fixed safety margin"
      - "RTO = RTTVAR alone, using pure variance and discarding the smoothed RTT term"
      - "RTO = SRTT + 4·RTTVAR"
      - "RTO = the single largest RTT sample ever observed on the connection so far"
    answer: 2
    explanation: |
      RFC 6298 sets RTO = SRTT + 4·RTTVAR (clamped to a minimum and maximum). Including
      four times the variance gives headroom so normal RTT jitter does not trigger
      spurious timeouts.
    ref: "concepts.md#retransmission-and-rto"

  - id: tcp-deep-dive-handshake-flow-congestion-023
    difficulty: advanced
    tags: [rto, karn, ambiguity]
    question: |
      Karn's algorithm says the sender must NOT take an RTT sample from a retransmitted
      segment. Why?
    options:
      - "Retransmitted segments carry corrupted Timestamp option values that poison the SRTT estimator"
      - "The receiver is required by RFC 6298 to silently discard and never acknowledge any retransmitted segment"
      - "Retransmissions are always rerouted onto a longer backup path, so their RTT is meaningless"
      - "You cannot tell whether the ACK is for the original transmission or the retransmission, making the RTT sample ambiguous"
    answer: 3
    explanation: |
      If a segment is retransmitted, an incoming ACK could be acknowledging either copy,
      so the measured RTT is ambiguous. Karn's algorithm ignores such samples and applies
      exponential backoff to the RTO on repeated timeouts.
    ref: "concepts.md#retransmission-and-rto"

  - id: tcp-deep-dive-handshake-flow-congestion-024
    difficulty: intermediate
    tags: [rto, backoff]
    question: |
      What does TCP do to its RTO on each successive timeout for the same unacknowledged
      segment?
    options:
      - "Halves it to retry faster"
      - "Leaves it unchanged"
      - "Doubles it (exponential backoff)"
      - "Resets it to the minimum RTO"
    answer: 2
    explanation: |
      TCP applies exponential backoff, roughly doubling the RTO after each timeout for the
      same segment. This avoids hammering an already-congested or unreachable path with
      rapid retransmissions.
    ref: "concepts.md#retransmission-and-rto"

  - id: tcp-deep-dive-handshake-flow-congestion-025
    difficulty: intermediate
    tags: [fast-retransmit, duplicate-ack]
    question: |
      How many duplicate ACKs trigger a fast retransmit, and why that number?
    options:
      - "One dup ACK, so the sender reacts to the very first sign of a possible gap"
      - "None at all — fast retransmit is driven only by the RTO timer expiring, not by dup ACKs"
      - "Ten dup ACKs, a deliberately high bar to be absolutely certain the segment is truly gone"
      - "Three dup ACKs, chosen to tolerate mild packet reordering that can cause one or two dup ACKs without real loss"
    answer: 3
    explanation: |
      RFC 5681 triggers fast retransmit on three duplicate ACKs. Requiring three tolerates
      the one or two dup ACKs that harmless reordering can cause, reducing spurious
      retransmissions while still reacting well before the RTO.
    ref: "concepts.md#fast-retransmit-and-fast-recovery"

  - id: tcp-deep-dive-handshake-flow-congestion-026
    difficulty: intermediate
    tags: [fast-recovery, cwnd]
    question: |
      During fast recovery (loss detected via three dup ACKs rather than a timeout), how
      does TCP adjust the congestion window?
    options:
      - "Resets cwnd all the way to 1 MSS and restarts slow start from the very beginning"
      - "Leaves cwnd completely unchanged, since dup ACKs prove the pipe is still flowing"
      - "Doubles cwnd to aggressively push the retransmitted data through the momentary loss"
      - "Halves cwnd (to the new ssthresh) and continues in congestion avoidance"
    answer: 3
    explanation: |
      Because duplicate ACKs show packets are still flowing, the network is not badly
      congested, so TCP performs a multiplicative decrease (cwnd halved to ssthresh) and
      stays in congestion avoidance, rather than collapsing to slow start as it does on an
      RTO.
    ref: "concepts.md#fast-retransmit-and-fast-recovery"

  - id: tcp-deep-dive-handshake-flow-congestion-027
    difficulty: advanced
    tags: [fast-retransmit, rto, comparison]
    question: |
      Compared to waiting for an RTO, what is the primary advantage of fast retransmit?
    options:
      - "It guarantees that the very same segment can never be dropped a second time on the path"
      - "It automatically grows the receiver's advertised window to absorb the recovered data faster"
      - "It temporarily suspends all congestion control so the retransmit can be sent at full line rate"
      - "It recovers the lost segment much sooner (within about one RTT of the dup ACKs) instead of after a full timeout, and avoids collapsing cwnd to 1 MSS"
    answer: 3
    explanation: |
      Fast retransmit reacts to duplicate ACKs long before the coarse RTO timer would
      fire, and pairs with fast recovery so cwnd is only halved rather than reset to 1
      MSS — preserving far more throughput than a timeout-driven retransmit.
    ref: "concepts.md#fast-retransmit-and-fast-recovery"

  - id: tcp-deep-dive-handshake-flow-congestion-028
    difficulty: intermediate
    tags: [sack, rfc2018]
    question: |
      What problem does Selective Acknowledgment (SACK, RFC 2018) solve that plain
      cumulative ACKs cannot?
    options:
      - "It cryptographically encrypts the acknowledgment numbers to prevent off-path ACK spoofing"
      - "It doubles the maximum advertised window size by adding a second 16-bit window field"
      - "It removes the need for sequence numbers by tagging each segment with a unique block ID"
      - "It lets the receiver report non-contiguous blocks it has already received, so the sender retransmits only the true gaps"
    answer: 3
    explanation: |
      With only cumulative ACKs, a sender learns about just the first hole and may
      needlessly resend data that already arrived. SACK reports the specific out-of-order
      blocks received, so only the genuinely missing ranges are retransmitted.
    ref: "concepts.md#selective-acknowledgment-sack"

  - id: tcp-deep-dive-handshake-flow-congestion-029
    difficulty: advanced
    tags: [sack, example, scenario]
    question: |
      A receiver has bytes 1–1000 and 2001–4000, but is missing 1001–2000. Using SACK,
      what does it report and what does the sender do?
    options:
      - "ACK=4001 with no SACK block at all; the sender assumes everything arrived and does nothing"
      - "It abandons the connection and sends an RST because the out-of-order gap is unrecoverable"
      - "ACK=2001 plus SACK {1001–2000}; the sender resends 2001–4000"
      - "ACK=1001 plus a SACK block {2001–4000}; the sender retransmits only 1001–2000"
    answer: 3
    explanation: |
      The cumulative ACK stays at 1001 (the first missing byte), while the SACK option
      reports the already-received block {2001–4000}. The sender then retransmits only the
      real gap 1001–2000, not the data already buffered.
    ref: "concepts.md#selective-acknowledgment-sack"

  - id: tcp-deep-dive-handshake-flow-congestion-030
    difficulty: advanced
    tags: [d-sack, spurious-retransmit]
    question: |
      What additional information does D-SACK (RFC 2883) convey beyond ordinary SACK?
    options:
      - "The number of bytes of free space remaining in the receiver's advertised window"
      - "The discovered path MTU, so the sender can resize its segments to avoid fragmentation"
      - "Which congestion-control algorithm the receiver is currently running for this connection"
      - "That a segment was received more than once (a duplicate), helping detect spurious retransmissions"
    answer: 3
    explanation: |
      D-SACK reports duplicate segments the receiver got. This lets the sender realize a
      retransmission was unnecessary (e.g., the original was merely delayed) and, if
      appropriate, undo an over-aggressive congestion-window reduction.
    ref: "concepts.md#selective-acknowledgment-sack"

  - id: tcp-deep-dive-handshake-flow-congestion-031
    difficulty: beginner
    tags: [flow-control, rwnd, receiver]
    question: |
      What does TCP flow control, via the receive window (rwnd), protect against?
    options:
      - "Overwhelming the network's intermediate routers and bottleneck links with too much data"
      - "Sequence-number wrap-around on very fast links where the 32-bit space cycles quickly"
      - "Off-path attackers spoofing sequence numbers to inject data into an established stream"
      - "Overwhelming the receiver's buffer with more data than it can consume"
    answer: 3
    explanation: |
      Flow control protects the receiver: rwnd tells the sender how much buffer space is
      free so a fast sender cannot overrun a slow receiver. Protecting the network is the
      job of congestion control (cwnd).
    ref: "concepts.md#sliding-window-flow-control-and-zero-window"

  - id: tcp-deep-dive-handshake-flow-congestion-032
    difficulty: intermediate
    tags: [flow-control, in-flight, min]
    question: |
      At any instant, the maximum amount of unacknowledged data a TCP sender may have in
      flight is bounded by which value?
    options:
      - "rwnd only"
      - "cwnd only"
      - "min(rwnd, cwnd)"
      - "max(rwnd, cwnd)"
    answer: 2
    explanation: |
      The sender must respect both limits: the receiver's advertised window (rwnd) and its
      own congestion window (cwnd). In-flight data is capped at the smaller of the two.
    ref: "concepts.md#sliding-window-flow-control-and-zero-window"

  - id: tcp-deep-dive-handshake-flow-congestion-033
    difficulty: advanced
    tags: [zero-window, probe, deadlock]
    question: |
      A receiver advertises window=0. Later it frees buffer space and sends a
      window-update segment, but that segment is lost. What prevents the connection from
      deadlocking?
    options:
      - "The receiver arms its own RTO timer and retransmits the lost pure-ACK window update"
      - "Nagle's algorithm detects the stall and forces the receiver's window back open"
      - "The connection is automatically reset and re-established from scratch to clear the deadlock"
      - "The sender periodically sends zero-window probes to elicit a fresh window advertisement"
    answer: 3
    explanation: |
      Pure ACKs (including window updates) are not retransmitted, so a lost update could
      deadlock the connection. The sender guards against this by sending periodic
      zero-window probes (typically 1 byte) that force the receiver to re-advertise its
      current window.
    ref: "concepts.md#sliding-window-flow-control-and-zero-window"

  - id: tcp-deep-dive-handshake-flow-congestion-034
    difficulty: advanced
    tags: [bdp, window-scale, throughput]
    question: |
      A link has 1 Gbps bandwidth and 80 ms RTT. Roughly what window is needed to keep the
      pipe full, and what does this imply?
    options:
      - "About 64 KiB — the default 16-bit window is already large enough for this link"
      - "Exactly one MSS — a single full-sized segment per RTT is enough to fill any pipe"
      - "About 1 KB — because the bandwidth term is irrelevant and only RTT matters for sizing"
      - "About 10 MB — well beyond 64 KiB, so the Window Scale option is required"
    answer: 3
    explanation: |
      BDP = bandwidth × RTT ≈ 1e9 bits/s × 0.08 s ≈ 8e7 bits ≈ 10 MB. That vastly exceeds
      the 64 KiB base window, so window scaling (RFC 7323) is mandatory to achieve full
      throughput on this long-fat network.
    ref: "concepts.md#sliding-window-flow-control-and-zero-window"

  - id: tcp-deep-dive-handshake-flow-congestion-035
    difficulty: advanced
    tags: [silly-window-syndrome, sws]
    question: |
      Silly Window Syndrome degrades throughput by exchanging many tiny segments. What is
      the standard receiver-side avoidance rule?
    options:
      - "Advertise a window increase only when it is at least one MSS (or half the buffer), not tiny openings"
      - "Advertise window=0 permanently and let the sender drive everything via zero-window probes"
      - "Send an immediate standalone ACK for every single byte the moment it is received"
      - "Disable the sliding window entirely and fall back to lock-step stop-and-wait delivery"
    answer: 0
    explanation: |
      The receiver avoids SWS by not advertising small window increments — it waits until
      it can open the window by at least an MSS or half the buffer. The sender side of SWS
      is addressed by Nagle's algorithm coalescing small writes.
    ref: "concepts.md#sliding-window-flow-control-and-zero-window"

  - id: tcp-deep-dive-handshake-flow-congestion-036
    difficulty: beginner
    tags: [slow-start, cwnd]
    question: |
      Despite its name, how does the congestion window grow during TCP slow start (no loss
      yet)?
    options:
      - "Linearly, gaining only about one additional MSS of window per full round trip"
      - "It actually shrinks steadily until the very first acknowledgment arrives back"
      - "It stays frozen at its initial value until cwnd finally reaches the ssthresh boundary"
      - "Exponentially, roughly doubling cwnd each RTT"
    answer: 3
    explanation: |
      In slow start, cwnd increases by 1 MSS for every ACK, which doubles cwnd each round
      trip — exponential growth. It is 'slow' only relative to immediately blasting a huge
      window; it ramps quickly.
    ref: "concepts.md#slow-start-and-congestion-avoidance-aimd"

  - id: tcp-deep-dive-handshake-flow-congestion-037
    difficulty: intermediate
    tags: [congestion-avoidance, linear, ssthresh]
    question: |
      Once cwnd reaches ssthresh, TCP switches to congestion avoidance. How does cwnd grow
      there?
    options:
      - "It continues doubling every RTT just as it did during slow start"
      - "It grows as a cubic function regardless of algorithm"
      - "It stays frozen at ssthresh until a packet loss finally occurs"
      - "It grows linearly, roughly +1 MSS per RTT (additive increase)"
    answer: 3
    explanation: |
      In congestion avoidance the window grows additively — about one MSS per RTT — to
      gently probe for extra bandwidth without overshooting, in classic (Reno-style)
      congestion control.
    ref: "concepts.md#slow-start-and-congestion-avoidance-aimd"

  - id: tcp-deep-dive-handshake-flow-congestion-038
    difficulty: intermediate
    tags: [aimd, timeout, reaction]
    question: |
      In classic TCP, how does the sender react to a full RTO timeout (severe loss signal)?
    options:
      - "Sets ssthresh = cwnd/2, then cwnd = 1 MSS and restarts slow start"
      - "Halves cwnd and simply stays in congestion avoidance without slow start"
      - "Doubles cwnd to push through what it treats as a transient dip in capacity"
      - "Ignores the timeout entirely until three duplicate ACKs also arrive to confirm it"
    answer: 0
    explanation: |
      A timeout is treated as severe congestion: ssthresh is set to half the current
      window and cwnd collapses to 1 MSS, re-entering slow start. This is far more drastic
      than the multiplicative-decrease response to three dup ACKs.
    ref: "concepts.md#slow-start-and-congestion-avoidance-aimd"

  - id: tcp-deep-dive-handshake-flow-congestion-039
    difficulty: intermediate
    tags: [aimd, fairness, sawtooth]
    question: |
      What property does AIMD (Additive Increase / Multiplicative Decrease) give to
      multiple TCP flows sharing a bottleneck link?
    options:
      - "It gives the longest-lived flow strict priority over newer arrivals on the link"
      - "It maximizes router buffer occupancy so the bottleneck queue always stays full"
      - "It guarantees zero packet loss by never letting any flow overshoot the link rate"
      - "It drives the flows toward a fair, roughly equal share of the bottleneck"
    answer: 3
    explanation: |
      AIMD's additive increase and proportional (multiplicative) decrease cause competing
      flows to converge toward an equal share of the bottleneck — the classic fairness
      argument — producing the characteristic cwnd sawtooth over time.
    ref: "concepts.md#slow-start-and-congestion-avoidance-aimd"

  - id: tcp-deep-dive-handshake-flow-congestion-040
    difficulty: intermediate
    tags: [ecn, congestion-signal]
    question: |
      How does Explicit Congestion Notification (ECN, RFC 3168) signal congestion
      differently from classic congestion control?
    options:
      - "It grows the congestion window on congestion so senders push harder through the queue"
      - "It shrinks the negotiated MSS at every hop to make each congested link's packets smaller"
      - "It suspends all retransmission during congestion so the router buffer can drain first"
      - "It lets routers mark packets to signal congestion without dropping them, avoiding the loss classic algorithms rely on"
    answer: 3
    explanation: |
      Classic Reno/CUBIC infer congestion from packet loss. ECN lets a router set a mark
      in the IP/TCP header (ECE/CWR) so the endpoints can back off before the buffer
      overflows and drops packets.
    ref: "concepts.md#slow-start-and-congestion-avoidance-aimd"

  - id: tcp-deep-dive-handshake-flow-congestion-041
    difficulty: intermediate
    tags: [cubic, linux, default]
    question: |
      Which statement about CUBIC (specified in RFC 9438, which obsoleted RFC 8312) is
      correct?
    options:
      - "It is a purely delay-based algorithm that reacts only to RTT growth and never treats loss as a signal"
      - "It is the default congestion control in Linux and grows cwnd as a cubic function of time since the last congestion event, independent of RTT"
      - "It requires SACK to be disabled on both endpoints before its cubic window function can operate"
      - "It is used only inside a single data center and is unsafe to deploy over the public Internet"
    answer: 1
    explanation: |
      CUBIC is Linux's default loss-based algorithm. Its window is a cubic function of the
      time since the last loss, making growth RTT-independent — fairer to high-latency
      flows and far more scalable than Reno on high-BDP links.
    ref: "concepts.md#modern-congestion-control-cubic-and-bbr"

  - id: tcp-deep-dive-handshake-flow-congestion-042
    difficulty: advanced
    tags: [bbr, model-based, bufferbloat]
    question: |
      How does BBR fundamentally differ from CUBIC in what it uses as its congestion
      signal?
    options:
      - "BBR treats every packet loss as an even stronger congestion signal than CUBIC, cutting its window harder on each drop"
      - "BBR models the bottleneck bandwidth and minimum RTT and paces sending to the bandwidth-delay product, rather than treating loss as the primary signal"
      - "BBR relies entirely on router ECN marks for its signal and never estimates the path's available bandwidth at all"
      - "BBR pins cwnd to a single fixed constant for the whole connection and never adjusts it in response to feedback"
    answer: 1
    explanation: |
      BBR (Google) is model-based: it estimates bottleneck bandwidth and min RTT and paces
      to their product, aiming for a full pipe with minimal queueing. This avoids
      bufferbloat and performs well on lossy links where loss does not equal congestion.
    ref: "concepts.md#modern-congestion-control-cubic-and-bbr"

  - id: tcp-deep-dive-handshake-flow-congestion-043
    difficulty: advanced
    tags: [bbr, fairness, tradeoff]
    question: |
      What is a commonly cited criticism of BBRv1 when it shares a bottleneck with
      CUBIC/Reno flows?
    options:
      - "It is unable to achieve high throughput even when it has the bottleneck link entirely to itself"
      - "It can be unfair to loss-based flows, sometimes starving them or causing loss by not backing off on packet loss"
      - "It functions only over IPv6 paths and silently falls back to CUBIC on any IPv4 connection"
      - "It requires the receiving endpoint to also run BBR, otherwise the connection cannot be established"
    answer: 1
    explanation: |
      Because BBRv1 does not treat loss as a back-off signal, it can grab more than its
      fair share against loss-based CUBIC/Reno flows and even induce loss. BBRv2/v3 were
      designed to improve this fairness and add an ECN response.
    ref: "concepts.md#modern-congestion-control-cubic-and-bbr"

  - id: tcp-deep-dive-handshake-flow-congestion-044
    difficulty: intermediate
    tags: [cubic, reno, lossy-link, scenario]
    question: |
      On a Wi-Fi link with occasional random (non-congestion) packet loss, why might a
      loss-based algorithm like Reno underperform BBR?
    options:
      - "Reno interprets every loss as congestion and repeatedly cuts its window, throttling throughput even when the link is not actually congested"
      - "Reno is unable to negotiate or use the SACK option over any wireless link, forcing slow whole-window retransmits"
      - "BBR turns off retransmission on lossy links, so it is unconditionally faster than Reno there"
      - "Wireless links do not maintain a congestion window at all, so Reno's control loop simply does not run"
    answer: 0
    explanation: |
      Reno/CUBIC treat any loss as a congestion signal and reduce cwnd. On lossy wireless
      links with random loss, that causes needless throughput collapse. BBR's model-based
      approach does not overreact to loss that is not congestion-related.
    ref: "concepts.md#modern-congestion-control-cubic-and-bbr"

  - id: tcp-deep-dive-handshake-flow-congestion-045
    difficulty: intermediate
    tags: [hol-blocking, definition]
    question: |
      What is head-of-line (HOL) blocking at the TCP transport layer?
    options:
      - "When a bottleneck router deliberately drops the very first packet of every new flow it sees"
      - "When one lost segment forces the receiver to withhold all already-arrived subsequent bytes from the application until the gap is filled"
      - "When the sender exhausts its 32-bit sequence-number space mid-transfer and must pause to renumber"
      - "When the receiver advertises a zero window and the sender stalls waiting for buffer space to free up"
    answer: 1
    explanation: |
      Because TCP delivers a single strictly-ordered byte stream, a single missing segment
      blocks delivery of everything received after it until the retransmission arrives —
      even though those later bytes are already in the receiver's buffer.
    ref: "concepts.md#head-of-line-blocking"

  - id: tcp-deep-dive-handshake-flow-congestion-046
    difficulty: advanced
    tags: [hol-blocking, http2, scenario]
    question: |
      HTTP/2 multiplexes many streams over one TCP connection to remove application-level
      HOL blocking. Why can HOL blocking still occur?
    options:
      - "HTTP/2 actually forbids more than one active stream per connection, so multiplexing never really happens"
      - "All HTTP/2 streams share one ordered TCP byte stream, so a single lost TCP segment stalls delivery of every stream until it is retransmitted"
      - "HTTP/2 turns off the SACK option on its connection, which forces frequent whole-window retransmission timeouts"
      - "HTTP/2 runs directly over UDP, whose out-of-order delivery reintroduces blocking at the application layer"
    answer: 1
    explanation: |
      HTTP/2's multiplexing lives above TCP. TCP still provides one in-order byte stream,
      so a single lost segment blocks all multiplexed streams — transport-level HOL
      blocking that HTTP/2 alone cannot escape.
    ref: "concepts.md#head-of-line-blocking"

  - id: tcp-deep-dive-handshake-flow-congestion-047
    difficulty: advanced
    tags: [hol-blocking, http3, quic]
    question: |
      How does HTTP/3 over QUIC eliminate the transport-level head-of-line blocking that
      affects HTTP/2?
    options:
      - "By opening a fresh dedicated TCP connection for every single request the client makes"
      - "By running over UDP and implementing independent per-stream ordering, so loss on one stream does not block others"
      - "By disabling retransmission entirely and letting the application layer recover any lost data itself"
      - "By widening the sequence-number space to 64 bits so segments can no longer arrive out of order"
    answer: 1
    explanation: |
      QUIC runs on UDP and moves stream multiplexing and ordering into the transport with
      per-stream delivery. A packet loss affecting one stream does not stall the others,
      though ordering within a single stream still applies.
    ref: "concepts.md#head-of-line-blocking"

  - id: tcp-deep-dive-handshake-flow-congestion-048
    difficulty: intermediate
    tags: [nagle, small-writes]
    question: |
      What does Nagle's algorithm (RFC 896) do?
    options:
      - "Delays outgoing acknowledgments briefly so several can be combined into one ACK packet"
      - "Buffers small writes until a full-MSS segment can be sent or previously sent data is acknowledged, reducing tiny 'tinygram' packets"
      - "Grows the congestion window faster than slow start so small writes clear the send buffer sooner"
      - "Encrypts small segments before transmission so short interactive messages cannot be trivially sniffed"
    answer: 1
    explanation: |
      Nagle coalesces small application writes: if there is unacknowledged data
      outstanding, it holds new small data until a full segment can be sent or the
      outstanding data is ACKed — cutting per-packet header overhead for chatty senders.
    ref: "concepts.md#nagles-algorithm-and-delayed-ack"

  - id: tcp-deep-dive-handshake-flow-congestion-049
    difficulty: advanced
    tags: [nagle, delayed-ack, interaction, scenario]
    question: |
      An RPC client sends small requests and sees ~200 ms stalls on each round trip. The
      sender has Nagle enabled and the receiver uses delayed ACK. What is happening?
    options:
      - "The congestion window is stuck too small, so slow start throttles each request to a single segment per RTT"
      - "Nagle withholds the next small write until the prior data is ACKed, while delayed ACK sits on that ACK waiting for data or its ~200 ms timer — the two combine into a stall"
      - "The receive window has collapsed to zero, so the sender must pause for a window update on every request"
      - "SACK has been disabled on the connection, so each tiny request triggers a full retransmission timeout"
    answer: 1
    explanation: |
      This is the classic Nagle + delayed-ACK deadlock. The sender waits for an ACK before
      sending its next small segment; the receiver delays that ACK hoping to piggy-back
      it. The result is a ~200 ms stall per exchange, hurting small request/response
      traffic.
    ref: "concepts.md#nagles-algorithm-and-delayed-ack"

  - id: tcp-deep-dive-handshake-flow-congestion-050
    difficulty: intermediate
    tags: [nagle, tcp-nodelay, tuning]
    question: |
      When is it appropriate to set TCP_NODELAY (disable Nagle) on a socket?
    options:
      - "Always, on every socket — Nagle is an obsolete 1980s heuristic that should be turned off everywhere by default"
      - "For small, latency-sensitive request/response traffic (e.g., RPC, interactive protocols) where Nagle can add latency"
      - "For bulk file transfers that write in large multi-megabyte chunks, to push each chunk out immediately"
      - "Only on the server side of a connection, since the client side never benefits from disabling Nagle"
    answer: 1
    explanation: |
      TCP_NODELAY helps chatty, latency-sensitive small-message workloads by sending small
      segments immediately. For bulk transfers with large well-buffered writes it gains
      nothing and can increase packet count, so it should not be enabled blindly.
    ref: "concepts.md#nagles-algorithm-and-delayed-ack"

  - id: tcp-deep-dive-handshake-flow-congestion-051
    difficulty: beginner
    tags: [delayed-ack, rfc1122]
    question: |
      What is the purpose of TCP delayed ACK (RFC 1122)?
    options:
      - "To deliberately slow the sender's congestion-window growth by spacing out its acknowledgments"
      - "To reduce pure-ACK traffic by waiting briefly to piggy-back the ACK on outgoing data or acknowledge two segments at once"
      - "To speed up recovery by retransmitting lost segments the moment a small gap is first detected"
      - "To randomize the acknowledgment numbers it returns so off-path attackers cannot predict them"
    answer: 1
    explanation: |
      Delayed ACK holds an acknowledgment for a short interval (commonly up to ~200 ms),
      hoping to piggy-back it on a response or to acknowledge two full segments together,
      cutting the number of standalone ACK packets.
    ref: "concepts.md#nagles-algorithm-and-delayed-ack"

  - id: tcp-deep-dive-handshake-flow-congestion-052
    difficulty: intermediate
    tags: [initial-window, rfc6928, slow-start]
    question: |
      RFC 6928 changed a key slow-start parameter to speed up short flows. What did it
      raise?
    options:
      - "The maximum segment lifetime used by TIME_WAIT"
      - "The TCP initial congestion window to about 10 MSS"
      - "The minimum RTO floor down to about 200 ms"
      - "The dup-ACK count for fast retransmit, down to two"
    answer: 1
    explanation: |
      RFC 6928 raised the initial window to roughly 10 MSS, letting a connection send more
      data in the first RTT before waiting for ACKs. This markedly improves latency for
      short flows like typical web responses.
    ref: "concepts.md#slow-start-and-congestion-avoidance-aimd"

  - id: tcp-deep-dive-handshake-flow-congestion-053
    difficulty: beginner
    tags: [rfc9293, spec, standards]
    question: |
      Which RFC is the current authoritative specification for TCP, obsoleting the classic
      RFC 793?
    options:
      - "RFC 2616, the HTTP/1.1 specification later folded into the TCP core standard"
      - "RFC 9293"
      - "RFC 5681, the consolidated document that fully replaced RFC 793's core mechanics"
      - "RFC 8446, the modern rewrite that superseded the original RFC 793 text"
    answer: 1
    explanation: |
      RFC 9293 (2022) is the consolidated, current TCP specification and obsoletes RFC 793.
      RFC 5681 covers congestion control, and RFC 8446 is TLS 1.3 — not the core TCP spec.
    ref: "concepts.md#the-three-way-handshake-and-sequence-numbers"

  - id: tcp-deep-dive-handshake-flow-congestion-054
    difficulty: intermediate
    tags: [flow-vs-congestion, comparison]
    question: |
      Which pairing correctly matches the mechanism to what it protects?
    options:
      - "rwnd guards the network's bottleneck routers, while cwnd guards the receiver's socket buffer"
      - "rwnd protects the receiver's buffer; cwnd protects the network from congestion"
      - "Both rwnd and cwnd protect only the receiver's buffer, and neither has any role in guarding the network"
      - "Both rwnd and cwnd protect only the network's routers, and neither has any role in guarding the receiver"
    answer: 1
    explanation: |
      The receive window (rwnd), set by the receiver, prevents overrunning the receiver's
      buffer (flow control). The congestion window (cwnd), computed by the sender,
      prevents overrunning the network (congestion control). The sender obeys the smaller.
    ref: "concepts.md#sliding-window-flow-control-and-zero-window"

  - id: tcp-deep-dive-handshake-flow-congestion-055
    difficulty: advanced
    tags: [tcp-fast-open, tfo, rfc7413]
    question: |
      What does TCP Fast Open (RFC 7413) enable, and what is a caveat?
    options:
      - "It eliminates sequence numbers by tagging each segment with a UUID; caveat: reliability is dropped and any reordering silently corrupts the stream"
      - "It lets a client send data in the SYN on a repeat connection using a server cookie, saving an RTT; caveat: replay considerations and uneven deployment"
      - "It permanently doubles the initial congestion window to about 20 MSS on every connection; caveat: it starves competing flows sharing the bottleneck"
      - "It skips the TIME_WAIT state so ports free instantly after any close; caveat: stale duplicate segments can be mistaken for a new connection's data"
    answer: 1
    explanation: |
      TFO uses a server-issued cookie so a returning client can include data in its SYN,
      saving one round trip on connection setup. The trade-offs are replay concerns for
      the early data and incomplete deployment across middleboxes and stacks.
    ref: "concepts.md#the-three-way-handshake-and-sequence-numbers"

  - id: tcp-deep-dive-handshake-flow-congestion-056
    difficulty: intermediate
    tags: [sack, options-space, limits]
    question: |
      Why can a single TCP segment carry only about 3–4 SACK blocks?
    options:
      - "SACK blocks must fit in the 40-byte TCP options space, which is further reduced if the Timestamps option is present"
      - "The SACK specification hard-caps each option at exactly four blocks because the 32-bit sequence-number field cannot index more gaps than that"
      - "The 16-bit receive window field can only enumerate four distinct out-of-order gaps before it saturates and wraps"
      - "Intermediate routers rewrite the TCP header and silently strip every SACK block beyond the first four in transit"
    answer: 0
    explanation: |
      TCP options are capped at 40 bytes. Each SACK block needs 8 bytes (two 32-bit edges)
      plus option overhead, so only about 3–4 fit — and fewer when the 10-byte Timestamps
      option is also present.
    ref: "concepts.md#selective-acknowledgment-sack"

  - id: tcp-deep-dive-handshake-flow-congestion-057
    difficulty: expert
    tags: [rack-tlp, tail-loss, loss-detection]
    question: |
      A short HTTP response is sent as five segments; only the last two are lost. The
      connection has been idle since. Why does classic three-dup-ACK fast retransmit fail
      to recover here, and what modern mechanism does?
    options:
      - "There is no data behind the lost tail to generate dup ACKs, so recovery falls to the RTO — RACK's time-based detection plus TLP's tail-loss probe recover it sooner"
      - "SACK alone recovers the tail because it reports the missing blocks; fast retransmit only fails when SACK has been disabled on the connection"
      - "Delayed ACK on the receiver suppresses the duplicate ACKs the sender needs; turning off delayed ACK restores three-dup-ACK recovery here"
      - "Nagle's algorithm on the sender withholds the retransmission until prior data is acked; setting TCP_NODELAY releases it and recovers the tail"
    answer: 0
    explanation: |
      Tail losses produce no subsequent segments to trigger duplicate ACKs, so dup-ACK
      counting never reaches three and the sender waits for a full RTO. RACK-TLP (RFC 8985)
      arms a PTO (~2·SRTT) tail-loss probe to elicit an ACK/SACK, and RACK infers the loss
      from transmit timestamps, converting a slow RTO into fast recovery.
    ref: "concepts.md#rack-tlp-time-based-loss-detection"

  - id: tcp-deep-dive-handshake-flow-congestion-058
    difficulty: expert
    tags: [rack, reordering-window, dsack]
    question: |
      In RACK (RFC 8985), how is a segment declared lost, and how does the reordering
      window behave over the life of a connection?
    options:
      - "Only after exactly three separate SACK blocks name a later segment; the reordering window is hard-fixed at three segments for the whole connection"
      - "Only when the retransmission timeout fires; RACK is merely a cosmetic rename of the existing RTO timer with no new logic"
      - "Only when the peer's advertised window closes to zero; the reordering window is set equal to the full receive-buffer size"
      - "When a later segment is SACKed and the unacked segment's time-since-transmit exceeds RTT plus a reordering window that starts near min_RTT/4 and grows adaptively (bounded by SRTT) when D-SACK reveals real reordering"
    answer: 3
    explanation: |
      RACK is time- and SACK-based: once a later segment is acknowledged, an earlier
      still-unacked segment is deemed lost when now − xmit_time > RTT + reorder_window. The
      reordering window starts small (≈min_RTT/4) and adapts upward via D-SACK evidence of
      genuine reordering, bounded by SRTT — replacing the rigid 3-dup-ACK threshold.
    ref: "concepts.md#rack-tlp-time-based-loss-detection"

  - id: tcp-deep-dive-handshake-flow-congestion-059
    difficulty: advanced
    tags: [tlp, pto, tail-loss]
    question: |
      The Tail Loss Probe (TLP) component of RACK-TLP arms a timer to probe a quiet flight.
      Roughly what is that Probe Timeout (PTO), and why is it set that way?
    options:
      - "About 2·SRTT — short enough to probe well before the coarse RTO, long enough to let a real ACK arrive first"
      - "Exactly equal to the full RTO value, because TLP is simply the retransmission timer under a new name with identical timing"
      - "One full maximum segment lifetime, set that high to guarantee every old duplicate segment has drained from the network first"
      - "A fixed 200 ms in all cases, deliberately matched to the receiver's delayed-ACK timer so the two never interfere"
    answer: 0
    explanation: |
      TLP sets a PTO of roughly 2·SRTT, much shorter than the RTO but long enough to avoid
      firing before a legitimately delayed ACK returns. When the flight goes silent, TLP
      transmits a probe (the last or a new segment) to trigger an ACK/SACK and drive fast
      recovery instead of an expensive RTO.
    ref: "concepts.md#rack-tlp-time-based-loss-detection"

  - id: tcp-deep-dive-handshake-flow-congestion-060
    difficulty: expert
    tags: [prr, recovery, cwnd]
    question: |
      Proportional Rate Reduction (RFC 6937), the Linux default, changes how cwnd is
      reduced during loss recovery. Compared with the textbook "halve cwnd instantly,"
      what does PRR actually do?
    options:
      - "It collapses cwnd all the way to 1 MSS and re-enters slow start from scratch, exactly as a full RTO timeout would"
      - "It doubles the usual reduction as a safety margin, landing cwnd at ssthresh/2 by the end of the recovery round trip"
      - "It leaves cwnd completely untouched during recovery and relies solely on the receiver's advertised window to throttle sending"
      - "It paces the reduction across the recovery RTT using per-ACK delivery info, so cwnd converges smoothly to ssthresh, keeping the ACK clock alive and cutting follow-on timeouts"
    answer: 3
    explanation: |
      PRR spreads the window reduction over the recovery round trip, sending in proportion
      to data leaving the network (from ACK/SACK feedback). This lands cwnd near ssthresh
      smoothly rather than in one abrupt step, preserving the ACK clock, avoiding a stall,
      and reducing the chance of a subsequent timeout.
    ref: "concepts.md#proportional-rate-reduction-prr"

  - id: tcp-deep-dive-handshake-flow-congestion-061
    difficulty: expert
    tags: [hystart, slow-start, cubic]
    question: |
      HyStart++ (RFC 9406), which RFC 9438 says CUBIC SHOULD use, changes slow-start exit.
      What signal does it use and what happens on exit?
    options:
      - "It counts three duplicate ACKs as its exit signal, then jumps straight into congestion avoidance skipping any intermediate phase"
      - "It exits the moment cwnd first equals the receiver's advertised window, then freezes cwnd there for the remainder of the connection"
      - "It detects a sustained RTT increase (queue starting to fill) and enters a Conservative/Limited Slow Start phase rather than jumping directly to congestion avoidance"
      - "It waits for the first ECN congestion mark to arrive and, on seeing it, immediately halves cwnd before leaving slow start"
    answer: 2
    explanation: |
      Classic slow start overshoots by doubling until loss. HyStart++ watches for a
      sustained rise in the round's minimum RTT (indicating the bottleneck queue is
      filling) and leaves exponential growth early, entering a cautious Limited Slow Start
      phase to hedge against a premature exit from transient jitter.
    ref: "concepts.md#hystart-and-slow-start-exit"

  - id: tcp-deep-dive-handshake-flow-congestion-062
    difficulty: advanced
    tags: [pacing, ack-clocking, bbr]
    question: |
      What problem does TCP pacing address that pure ACK-clocking does not, and which
      algorithm depends on it?
    options:
      - "Pacing spreads a window's packets evenly over the RTT to avoid micro-bursts (from large cwnd, TSO/GSO, or stretch ACKs) that overrun shallow buffers — BBR fundamentally paces to its computed rate"
      - "Pacing encrypts the inter-packet timing gaps to hide traffic patterns; TLS 1.3 fundamentally depends on it for its record layer"
      - "Pacing replaces TCP sequence numbers with timestamp-based ordering; QUIC fundamentally depends on it to reassemble streams"
      - "Pacing doubles the initial congestion window to speed the first RTT; classic slow start fundamentally depends on it to ramp"
    answer: 0
    explanation: |
      ACK-clocking releases new data as ACKs return, which can produce bursts (a big cwnd,
      segmentation offload, or clumped ACKs), overflowing shallow buffers even at a fine
      average rate. Pacing spaces packets by ≈RTT/cwnd. BBR relies on pacing to a computed
      rate (pacing_gain × bottleneck bandwidth) so its model-based rate does not arrive as
      bursts.
    ref: "concepts.md#pacing-and-ack-clocking"

  - id: tcp-deep-dive-handshake-flow-congestion-063
    difficulty: expert
    tags: [ecn, rfc3168, handshake, codepoints]
    question: |
      In classic ECN (RFC 3168), which statement about how congestion is signaled and
      echoed is correct?
    options:
      - "A congested router simply drops the packet and the sender infers the ECN signal purely from the resulting gap in the acknowledged sequence numbers"
      - "The receiving endpoint sets the CE codepoint on inbound packets and the congested router then echoes that mark back upstream using the CWR flag"
      - "A congested router sets CE in the IP DS field on an ECT-marked packet; the receiver echoes with the ECE flag on its ACKs, and the sender reduces cwnd as if one loss and sets CWR"
      - "ECN state is carried entirely inside the 16-bit TCP window field and requires no support or codepoints from the underlying IP layer at all"
    answer: 2
    explanation: |
      The sender marks packets ECT(0)/ECT(1) in the two-bit IP DS codepoint. A congested
      router sets CE ("Congestion Experienced") instead of dropping. The receiver reflects
      this by setting ECE on ACKs; the sender then reduces cwnd as though a single loss
      occurred and sets CWR to acknowledge the signal.
    ref: "concepts.md#ecn-in-detail-accecn-and-l4s"

  - id: tcp-deep-dive-handshake-flow-congestion-064
    difficulty: expert
    tags: [accecn, l4s, feedback]
    question: |
      Why do L4S scalable congestion controllers require Accurate ECN (AccECN, RFC 9768)
      rather than classic RFC 3168 ECN feedback?
    options:
      - "AccECN cryptographically encrypts the two ECN codepoint bits end-to-end so middleboxes along the path can no longer read or strip them"
      - "AccECN relocates the ECN signaling out of the IP header and into UDP so that only QUIC-based transports are able to make use of it"
      - "Classic ECN feedback conveys only a single 'congestion happened' bit per RTT, whereas L4S needs a per-RTT count of CE marks to respond proportionally to frequent, immediate marking"
      - "Classic RFC 3168 ECN operates only over IPv4 paths, and AccECN's sole purpose is to extend the same feedback mechanism to IPv6"
    answer: 2
    explanation: |
      Classic ECN's ECE bit signals only that congestion occurred in an RTT, not how much.
      L4S marks packets frequently and immediately (marks are not drop-equivalent), so a
      scalable controller must know the count of CE marks to react proportionally. AccECN
      feeds back a running count, which requires both endpoints to be upgraded.
    ref: "concepts.md#ecn-in-detail-accecn-and-l4s"

  - id: tcp-deep-dive-handshake-flow-congestion-065
    difficulty: expert
    tags: [l4s, dualq, ect1]
    question: |
      In the L4S architecture (RFC 9330/9331/9332), what role does the ECT(1) codepoint
      play and how does the DualQ Coupled AQM use it?
    options:
      - "ECT(1) is a 'do not mark under any load' directive, so the DualQ AQM preferentially drops those packets first when its buffer fills"
      - "ECT(1) classifies traffic into the low-latency L4S queue, which the DualQ AQM keeps shallow and couples with the classic queue so both share bandwidth fairly"
      - "ECT(1) is a request for in-network fragmentation of oversized segments, which the DualQ AQM reassembles before forwarding downstream"
      - "ECT(1) is the legacy marker reserved for Reno flows, which the DualQ AQM always routes into the classic queue and never the L4S queue"
    answer: 1
    explanation: |
      L4S uses ECT(1) as the classifier that steers scalable-CC traffic into a separate
      low-latency queue. The DualQ Coupled AQM runs a classic queue (CUBIC/Reno) and an L4S
      queue, coupling their marking/dropping so the two share the link fairly while the L4S
      queue stays near-empty for sub-millisecond delay.
    ref: "concepts.md#ecn-in-detail-accecn-and-l4s"

  - id: tcp-deep-dive-handshake-flow-congestion-066
    difficulty: expert
    tags: [rfc5961, challenge-ack, rst]
    question: |
      Under RFC 5961, an established connection receives an RST whose sequence number falls
      inside the receive window but is NOT the exact next-expected byte. What does TCP do?
    options:
      - "Immediately tears the connection down, because any RST whose sequence number lands anywhere inside the receive window is treated as valid"
      - "Silently discards the RST and never sends any response, leaving the peer with no indication the segment was received or rejected"
      - "Does not reset; it sends a challenge ACK carrying the true expected sequence number, forcing the sender to prove it knows the correct sequence"
      - "Escalates by initiating a fresh three-way SYN handshake to re-validate the connection before honoring or rejecting the RST"
    answer: 2
    explanation: |
      RFC 5961 hardens against blind (off-path) RST attacks: an RST is honored only if its
      sequence number exactly matches the next expected byte. An in-window-but-inexact RST
      triggers a challenge ACK instead of a reset; a legitimate peer replies with the
      correct sequence, while a blind attacker cannot.
    ref: "concepts.md#rfc-5961-blind-attacks-and-the-challenge-ack"

  - id: tcp-deep-dive-handshake-flow-congestion-067
    difficulty: expert
    tags: [rfc5961, side-channel, cve]
    question: |
      The challenge-ACK mechanism (RFC 5961) introduced a subtle vulnerability
      (CVE-2016-5696). What was the root cause?
    options:
      - "Challenge ACKs were transmitted without encryption, so an on-path observer could read the exact sequence numbers they carried and hijack the stream"
      - "A global (system-wide) rate limit on challenge ACKs let an off-path attacker infer whether two hosts shared a connection by observing the shared counter"
      - "Each challenge ACK reset the sender's congestion window back to 1 MSS, letting an attacker throttle a victim's throughput to a crawl"
      - "The mechanism silently disabled the PAWS timestamp check, reopening the door to old-duplicate sequence-number wrap attacks on fast links"
    answer: 1
    explanation: |
      The challenge-ACK rate limiter was global rather than per-connection. An attacker
      could probe the shared counter as a side channel to detect an existing connection and
      then infer sequence numbers off-path. The fix was to randomize/localize the rate
      limit so it no longer leaks cross-connection state.
    ref: "concepts.md#rfc-5961-blind-attacks-and-the-challenge-ack"

  - id: tcp-deep-dive-handshake-flow-congestion-068
    difficulty: advanced
    tags: [half-open, half-closed, reset]
    question: |
      A server crashes and reboots, losing all TCP state. A client that still thinks the
      connection is ESTABLISHED sends data. What happens, and what is this called?
    options:
      - "The rebooted server has no matching TCB for the 4-tuple and replies with an RST; this is a half-open connection"
      - "The connection silently continues because the server rebuilds its state from the incoming sequence number; this is called a half-closed connection"
      - "The client immediately transitions into the TIME_WAIT state and re-acks the segment; this scenario is called a simultaneous close"
      - "The server buffers the client's data until it re-learns the connection parameters from the next SYN; this is called fast open"
    answer: 0
    explanation: |
      With no TCB for the arriving segment's 4-tuple, the rebooted peer sends an RST and the
      survivor discovers the connection is dead — a half-open connection. This differs from
      a half-closed connection, where one direction was intentionally shut with FIN while
      the other remains valid.
    ref: "concepts.md#half-open-connections"

  - id: tcp-deep-dive-handshake-flow-congestion-069
    difficulty: intermediate
    tags: [mss, mtu, options]
    question: |
      Which statement about the TCP MSS option is correct?
    options:
      - "MSS is defined to equal the link's full MTU including headers and is renegotiated fresh in the options of every data segment sent"
      - "MSS is the largest TCP payload a host will accept, advertised only in the SYN; if absent it defaults to 536 (IPv4) or 1220 (IPv6), and each side advertises independently"
      - "MSS is derived directly from the current receive-window value and shrinks or grows dynamically as the receive buffer fills and drains"
      - "MSS is a field used only by intermediate routers for segment sizing and is entirely invisible to the two connection endpoints"
    answer: 1
    explanation: |
      MSS is the maximum TCP payload (MTU minus IP and TCP headers), carried in the MSS
      option of the SYN and only the SYN. Each side advertises the MSS it is willing to
      receive; absent the option the defaults are 536 (IPv4) and 1220 (IPv6) per RFC 9293/
      6691.
    ref: "concepts.md#path-mtu-discovery-mss-and-clamping"

  - id: tcp-deep-dive-handshake-flow-congestion-070
    difficulty: expert
    tags: [pmtud, blackhole, mss-clamping, scenario]
    question: |
      SSH sessions and pings to a host work fine, but large file transfers stall and
      eventually reset. A capture shows big data packets leaving but never acknowledged.
      What is the most likely cause and fix?
    options:
      - "A PMTUD black-hole: a middlebox filters the ICMP 'fragmentation needed' messages, so the sender never shrinks its segments — fix with MSS clamping on the tunnel or PLPMTUD"
      - "The receive window is too small for the transfer, so large packets are refused; enlarge the socket buffer to let big data segments through"
      - "A Nagle plus delayed-ACK deadlock is stalling the big transfers; setting TCP_NODELAY on the sending socket clears the periodic stall"
      - "The congestion window has collapsed from random non-congestion loss on the path; switching the connection to BBR restores the large transfers"
    answer: 0
    explanation: |
      The signature — small packets pass, large ones vanish — is a classic PMTUD black-hole
      caused by filtered ICMP Fragmentation-Needed/Packet-Too-Big messages. The DF-bit
      packets are dropped silently. Remedies are MSS clamping (rewrite the SYN's MSS down to
      fit the path) or PLPMTUD (RFC 4821/8899), which probes the path MTU without relying on
      ICMP.
    ref: "concepts.md#path-mtu-discovery-mss-and-clamping"

  - id: tcp-deep-dive-handshake-flow-congestion-071
    difficulty: advanced
    tags: [plpmtud, pmtud, icmp]
    question: |
      Why is PLPMTUD (RFC 4821/8899) more robust than classic ICMP-based PMTUD on the
      modern Internet?
    options:
      - "It pre-fragments every packet at the sending host down to the smallest possible size, so the path MTU never matters and probing is unnecessary"
      - "It probes the path MTU using the transport's own loss/acknowledgment signals, so it works even when ICMP 'too big' messages are filtered by firewalls"
      - "It negotiates the exact path MTU inside the TCP SYN exchange, extending the MSS option to carry the full end-to-end MTU value"
      - "It relies on every router along the path advertising its link MTU to the endpoints through the interior routing protocol"
    answer: 1
    explanation: |
      Classic PMTUD depends on receiving ICMP Fragmentation-Needed/Packet-Too-Big messages,
      which are widely filtered, causing black-holes. PLPMTUD instead sends probe packets of
      increasing size and uses the transport's acknowledgment/loss feedback to find the
      largest that gets through — no ICMP dependency.
    ref: "concepts.md#path-mtu-discovery-mss-and-clamping"

  - id: tcp-deep-dive-handshake-flow-congestion-072
    difficulty: expert
    tags: [cubic, beta, model, rfc9438]
    question: |
      In CUBIC's window model W_cubic(t) = C·(t−K)³ + W_max (RFC 9438), which set of facts
      is correct?
    options:
      - "C = 0.5 and β = 0.5, and the cubic term makes window growth strictly proportional to the connection's current RTT"
      - "C = 1.0 and β = 0.9, and the inflection constant K is defined to equal the most recently measured round-trip time"
      - "C is just the receiver's advertised window, β is the observed packet-loss rate, and K is simply the negotiated MSS in bytes"
      - "C = 0.4, the multiplicative-decrease factor β = 0.7, K is the time to climb back to W_max, and growth is RTT-independent because t is wall-clock time"
    answer: 3
    explanation: |
      RFC 9438 fixes C = 0.4 and β_cubic = 0.7 (window kept at 70% on loss vs Reno's 50%).
      K = cbrt(W_max·β/C) is the time to return to W_max. Since t is elapsed wall-clock time
      since the last congestion event, growth does not depend on RTT — a key CUBIC property.
    ref: "concepts.md#deeper-congestion-control-internals"

  - id: tcp-deep-dive-handshake-flow-congestion-073
    difficulty: advanced
    tags: [cubic, regions, reno-friendly]
    question: |
      CUBIC's growth curve has concave and convex regions around W_max, plus a
      "Reno-friendly" region. What is the purpose of the Reno-friendly region?
    options:
      - "To disable the cubic growth curve entirely on wireless links, falling back to plain stop-and-wait whenever random radio loss is detected"
      - "To track an estimated Reno window (W_est) so CUBIC does not underperform Reno on low-BDP paths where Reno would otherwise grow faster"
      - "To force the connection to hand off to the BBR algorithm whenever the measured RTT climbs above a fixed 100 ms threshold"
      - "To guarantee zero packet loss during the convex phase by freezing the window as it approaches the previous W_max value"
    answer: 1
    explanation: |
      On low-BDP paths a pure cubic curve could grow more slowly than Reno right after a
      loss, so CUBIC computes an estimated Reno window W_est and uses the larger of the two.
      This keeps CUBIC at least as aggressive as Reno there, preserving fairness with
      Reno-style flows.
    ref: "concepts.md#deeper-congestion-control-internals"

  - id: tcp-deep-dive-handshake-flow-congestion-074
    difficulty: expert
    tags: [bbr, phases, startup, probe-rtt]
    question: |
      BBRv1 cycles through phases while estimating BtlBw and RTprop. What is the purpose of
      its PROBE_RTT phase?
    options:
      - "To exponentially ramp cwnd at connection start by doubling the pacing gain every round trip until the first packet loss is seen"
      - "To drain the standing queue built up during startup by pausing all transmission for exactly one full round-trip time"
      - "To periodically cut inflight data low enough to re-measure the minimum RTT (RTprop), since a persistently full pipe would hide the true propagation delay"
      - "To probe for additional bottleneck bandwidth by holding the pacing gain at a fixed 2.0 for eight consecutive round trips"
    answer: 2
    explanation: |
      BBR's RTprop estimate is the minimum RTT observed, but if the pipe is kept full the
      queue inflates every RTT sample. PROBE_RTT periodically drops inflight to a small
      value so BBR can observe the true, unqueued minimum RTT. STARTUP ramps, DRAIN empties
      the startup queue, and PROBE_BW is the steady-state bandwidth-probing phase.
    ref: "concepts.md#deeper-congestion-control-internals"

  - id: tcp-deep-dive-handshake-flow-congestion-075
    difficulty: advanced
    tags: [bbr, versions, fairness, ecn]
    question: |
      What is the main behavioral change BBRv2 introduced over BBRv1 to address v1's
      coexistence problems?
    options:
      - "It removed packet pacing entirely and reverted to pure ACK-clocking, releasing new data only as returning acknowledgments free up window space"
      - "It abandoned the bandwidth-delay model and instead counts three duplicate ACKs, adopting the same loss trigger that classic Reno has always used"
      - "It pinned cwnd to a single fixed constant for the whole connection to avoid any queue buildup, disabling the bandwidth-probing phase completely"
      - "It added an explicit loss and ECN response (including AccECN/L4S awareness) plus an inflight cap, improving fairness with loss-based CUBIC/Reno flows"
    answer: 3
    explanation: |
      BBRv1 ignored loss and could starve CUBIC/Reno or build a standing queue in deep
      buffers. BBRv2 added a response to loss and ECN (with AccECN/L4S support) and an
      inflight cap so it coexists more fairly; BBRv3 further refined convergence and probing
      bugs.
    ref: "concepts.md#deeper-congestion-control-internals"

  - id: tcp-deep-dive-handshake-flow-congestion-076
    difficulty: advanced
    tags: [so-reuseport, so-reuseaddr, scaling]
    question: |
      A service wants many worker processes to accept connections on the same port with the
      kernel load-balancing across them. Which socket option provides this, and how does it
      differ from SO_REUSEADDR?
    options:
      - "SO_REUSEADDR is the option that load-balances accepts across worker sockets, while SO_REUSEPORT exists only to silence spurious 'address already in use' bind errors on restart"
      - "SO_REUSEPORT (Linux 3.9+) lets multiple sockets bind the identical address+port and the kernel spreads incoming connections across them; SO_REUSEADDR merely allows binding a port that has a lingering/TIME_WAIT socket and does not load-balance"
      - "Both are simply identical aliases for the same kernel flag, so either one enables the kernel to distribute accepted connections across the worker processes"
      - "Neither option can do this; you must funnel every connection through a single accept thread guarded by a mutex and hand sockets to workers manually"
    answer: 1
    explanation: |
      SO_REUSEPORT (Linux 3.9+) allows several sockets to bind the same address+port and has
      the kernel distribute incoming connections, removing the single-accept bottleneck.
      SO_REUSEADDR only permits rebinding when a previous socket lingers (e.g., TIME_WAIT)
      and does not distribute load.
    ref: "concepts.md#time_wait-scaling-so_reuseaddr-vs-so_reuseport"

  - id: tcp-deep-dive-handshake-flow-congestion-077
    difficulty: expert
    tags: [time-wait, active-close, load-balancer, architecture]
    question: |
      A server behind a load balancer that terminates and actively closes connections is
      exhausting local ephemeral ports under load. Which change most directly attacks the
      root cause?
    options:
      - "Enable the tcp_tw_recycle sysctl so the kernel recycles TIME_WAIT sockets the instant their FIN is acked, immediately returning each ephemeral port to the pool"
      - "Shorten the maximum segment lifetime to a few seconds via a kernel tunable so every TIME_WAIT entry clears in a fraction of the usual 2·MSL window"
      - "Arrange for the client to perform the active close (so TIME_WAIT lands on clients) and use keep-alive/connection pooling; SO_REUSEPORT scales accepts"
      - "Randomize the Initial Sequence Numbers more aggressively so that closed connections release their bound ephemeral ports back to the allocator sooner"
    answer: 2
    explanation: |
      TIME_WAIT accumulates on whichever side does the active close. Moving the active close
      to the client (plus keep-alive/pooling to reduce connection churn) removes the
      accumulation from the server. tcp_tw_recycle was removed for breaking NAT, and
      shortening MSL breaks TCP's correctness guarantees.
    ref: "concepts.md#time_wait-scaling-so_reuseaddr-vs-so_reuseport"

  - id: tcp-deep-dive-handshake-flow-congestion-078
    difficulty: expert
    tags: [incast, datacenter, dctcp, rto]
    question: |
      In a partition/aggregate datacenter workload, many servers reply to one client at
      once, collapsing throughput far below link capacity. What is this, and which
      mitigation is most on-point?
    options:
      - "Bufferbloat from an over-large router queue inflating latency — switch every flow on the fabric to BBR so the standing queue drains and throughput recovers"
      - "TCP incast: synchronized senders overflow a shallow ToR buffer causing synchronized RTOs — mitigate with DCTCP's fine-grained ECN and a microsecond-scale RTO_min"
      - "Silly Window Syndrome from tiny window openings — apply the receiver-side SWS avoidance rule so the aggregator stops advertising sub-MSS windows"
      - "A Nagle plus delayed-ACK deadlock stalling each reply — set TCP_NODELAY on every server socket in the fabric to eliminate the periodic 200 ms pauses"
    answer: 1
    explanation: |
      TCP incast collapse arises when many synchronized senders overrun a shallow switch
      buffer, dropping packets and causing many flows to time out together and retransmit in
      lockstep after the large default RTO_min. DCTCP (RFC 8257) uses proportional ECN
      marking to keep queues short, and lowering RTO_min to microsecond scale matches
      datacenter RTTs.
    ref: "concepts.md#datacenter-tcp-and-incast"

  - id: tcp-deep-dive-handshake-flow-congestion-079
    difficulty: advanced
    tags: [dctcp, ecn, proportional]
    question: |
      How does DCTCP (RFC 8257) use ECN differently from classic RFC 3168 ECN?
    options:
      - "It marks CE based on a shallow queue threshold and reduces cwnd in proportion to the FRACTION of marked packets, rather than halving on any single mark"
      - "It ignores the ECN codepoints entirely and, exactly like RFC 3168, relies solely on detected packet loss as its only congestion signal inside the fabric"
      - "It sets the CE mark only on the SYN and SYN-ACK during the handshake, negotiating the expected congestion level once up front before any data segments flow"
      - "It uses inbound ECN marks as a green light to grow the congestion window whenever switch queues are short, ramping more aggressively than classic slow start"
    answer: 0
    explanation: |
      Classic ECN treats a mark like a loss (roughly halve cwnd). DCTCP has switches mark CE
      once a shallow instantaneous-queue threshold is crossed and reduces cwnd proportional
      to the estimated fraction of marked packets — a gentle, fine-grained response that
      keeps datacenter queues very short. This proportional-marking idea underlies L4S/TCP
      Prague.
    ref: "concepts.md#datacenter-tcp-and-incast"

  - id: tcp-deep-dive-handshake-flow-congestion-080
    difficulty: expert
    tags: [window-scale, middlebox, throughput, scenario]
    question: |
      A 10 Gbps, 100 ms RTT path delivers only a few Mbps for a single flow. A capture of
      the handshake shows the SYN carries a Window Scale option but the SYN-ACK does not.
      What is happening?
    options:
      - "Window scaling is off for the connection (both sides must send the option), so the window is capped at 64 KiB and throughput ≤ 64 KiB / RTT — a middlebox likely stripped the option from the SYN-ACK"
      - "The receiving application is draining its socket buffer too slowly, so rwnd keeps closing; raising the application's read rate and enlarging SO_RCVBUF restores full throughput"
      - "The sender's congestion window has collapsed because a router on the path is setting ECN CE marks, forcing repeated multiplicative decreases down to a tiny cwnd"
      - "PAWS is rejecting the bulk data segments because the 32-bit timestamp clock wrapped mid-transfer, so each large packet is discarded as an apparently stale duplicate"
    answer: 0
    explanation: |
      Window scaling is enabled only if BOTH SYN and SYN-ACK carry the option. If one side's
      option is missing (often stripped by a firewall/middlebox), scaling is disabled and
      the effective window is capped at 65535 bytes, limiting throughput to window/RTT ≈ a
      few Mbps on a 100 ms path regardless of link speed.
    ref: "concepts.md#window-scale-and-paws-wire-details"

  - id: tcp-deep-dive-handshake-flow-congestion-081
    difficulty: expert
    tags: [window-scale, wire-format, options]
    question: |
      Which statement about the Window Scale option (RFC 7323) on the wire is correct?
    options:
      - "It is a 4-byte multiplier value stamped into the options of every single data segment, and the receiver multiplies the advertised window by it on each arrival"
      - "It is negotiated through a mid-connection option exchange and either side can renegotiate the scale factor dynamically whenever the receive buffer is resized"
      - "It is a 1-byte shift count (0–14) carried only in SYN/SYN-ACK, yielding a maximum effective window of about 1 GiB (65535 << 14), and it applies to all later segments including retransmits"
      - "It replaces the 16-bit Window field with a full 32-bit window field in every TCP header, doubling header size for the life of the scaled connection"
    answer: 2
    explanation: |
      The option is a single-byte shift count in the range 0–14, exchanged only in the SYN
      and SYN-ACK. The negotiated shift left-shifts the 16-bit Window field on all
      subsequent segments (including retransmissions), giving a maximum of 65535 << 14 ≈ 1
      GiB. It cannot change after the handshake.
    ref: "concepts.md#window-scale-and-paws-wire-details"

  - id: tcp-deep-dive-handshake-flow-congestion-082
    difficulty: advanced
    tags: [paws, timestamps, sequence-wrap]
    question: |
      Why does PAWS become necessary on very high-speed links, and what does it reuse to do
      its job?
    options:
      - "Because the receive window itself overflows its 16-bit field at high speed; PAWS reuses the SACK block edges to renumber the window and keep it from wrapping"
      - "Because the 32-bit sequence space can wrap within an MSL at high rates (≈17 s at 1 Gbps, sub-second at 10–100 Gbps), so PAWS uses the Timestamps option (which also serves as the RTT clock) to reject old segments"
      - "Because the 16-bit TCP checksum grows too weak to catch errors at line rate, so PAWS reuses the Urgent Pointer field as an extra integrity check on each segment"
      - "Because Initial Sequence Numbers begin to collide across rapidly reopened connections, so PAWS reuses the SYN-cookie construction to keep each incarnation distinct"
    answer: 1
    explanation: |
      At high throughput the 4 GiB sequence space wraps quickly — within one MSL — so an old
      delayed segment could masquerade as new data. PAWS uses the monotonically increasing
      Timestamps option (TSval/TSecr) to discard segments with stale timestamps. The same
      Timestamps option doubles as the RTT clock for SRTT/RTTVAR, which is why both live in
      RFC 7323.
    ref: "concepts.md#window-scale-and-paws-wire-details"
