topic: "WebSockets & Server-Sent Events (SSE)"
domain: networking
topic_slug: realtime-websockets-sse
version: 1
questions:
  - id: realtime-websockets-sse-001
    difficulty: beginner
    tags: [polling, http, request-response]
    question: |
      Why can't a plain HTTP/1.1 server push a new event to an already-loaded
      web page without the client asking first?
    options:
      - "Because HTTP is strictly client-initiated request/response; the server has no channel to speak unsolicited"
      - "Because HTTP encrypts the connection, blocking server writes"
      - "Because TCP only allows one direction of data at a time"
      - "Because browsers disable server writes for security"
    answer: 0
    explanation: |
      Classic HTTP is a client-driven request/response protocol. The server can
      only respond to a request; it has no way to originate a message to an idle,
      already-loaded page. That limitation is what polling, SSE, and WebSocket
      each work around.
    ref: "concepts.md#the-polling-problem"

  - id: realtime-websockets-sse-002
    difficulty: beginner
    tags: [polling, latency, overhead]
    question: |
      What is the fundamental trade-off when tuning the interval of a short-polling client?
    options:
      - "Freshness (latency) versus wasted overhead"
      - "Security versus compression"
      - "Binary versus text payloads"
      - "IPv4 versus IPv6 reachability"
    answer: 0
    explanation: |
      Polling too often wastes round trips on empty "nothing new" responses;
      polling too rarely makes data stale. The whole point of push protocols is
      to escape this latency-versus-overhead tension.
    ref: "concepts.md#the-polling-problem"

  - id: realtime-websockets-sse-003
    difficulty: intermediate
    tags: [polling, overhead, headers]
    question: |
      In a high-frequency short-polling setup where most responses are "no new
      data," what dominates the wasted cost?
    options:
      - "The size of the event payloads themselves"
      - "TLS session ticket rotation"
      - "Full HTTP request/response overhead (headers, cookies, round trip) on each empty poll"
      - "DNS lookups repeated on every poll"
    answer: 2
    explanation: |
      Each poll carries full request/response machinery — cookies, User-Agent,
      Accept headers, plus a round trip — which can dwarf a tiny "nothing new"
      body. Multiplied across many clients this is the core inefficiency of
      short polling.
    ref: "concepts.md#the-polling-problem"

  - id: realtime-websockets-sse-004
    difficulty: beginner
    tags: [long-polling, short-polling]
    question: |
      What is the key behavioral difference between long polling and short polling?
    options:
      - "Long polling uses UDP; short polling uses TCP"
      - "Short polling requires WebSocket; long polling does not"
      - "Long polling is one-directional; short polling is full-duplex"
      - "In long polling the server holds the request open until it has data or times out"
    answer: 3
    explanation: |
      Both use ordinary HTTP requests. Short polling responds immediately (even
      with an empty body); long polling holds the request open and only responds
      when data is available or a timeout fires, giving near-real-time delivery.
    ref: "concepts.md#short-polling-vs-long-polling"

  - id: realtime-websockets-sse-005
    difficulty: intermediate
    tags: [long-polling, scalability, servers]
    question: |
      Why does long polling put pressure on thread-per-request servers specifically?
    options:
      - "Each held-open request occupies a connection (and a thread) doing nothing while it waits"
      - "It forces the server to poll a database in a tight loop"
      - "Each request opens a new TCP connection to every other server"
      - "It requires the server to buffer the entire response in memory before sending"
    answer: 0
    explanation: |
      A long-polled request that is held open ties up a connection — and on a
      blocking thread-per-request model, a thread — for the whole wait. Async /
      event-driven servers mitigate this by not dedicating a thread per waiting
      connection.
    ref: "concepts.md#short-polling-vs-long-polling"

  - id: realtime-websockets-sse-006
    difficulty: intermediate
    tags: [long-polling, proxies, timeouts]
    question: |
      Why do long-polling servers typically cap how long they hold a request
      (e.g. 30–60s) and then return an empty response?
    options:
      - "To comply with the HTTP/1.1 maximum response time in the RFC"
      - "Because browsers refuse any response older than 60 seconds"
      - "Because intermediaries may kill idle connections, so the server responds before that happens and lets the client re-poll"
      - "To reset the TCP sequence number counter"
    answer: 2
    explanation: |
      Proxies, load balancers and NATs drop idle connections. Long-polling
      servers cap the hold time and return empty so the client immediately opens
      a fresh request, avoiding a silently-killed connection.
    ref: "concepts.md#short-polling-vs-long-polling"

  - id: realtime-websockets-sse-007
    difficulty: intermediate
    tags: [long-polling, fallback, socket-io]
    question: |
      A corporate proxy blocks the WebSocket Upgrade. Which technique do many
      real-time libraries fall back to because it works nearly everywhere?
    options:
      - "Raw UDP datagrams"
      - "ICMP echo tunneling"
      - "gRPC bidirectional streaming"
      - "Long polling over ordinary HTTP"
    answer: 3
    explanation: |
      Long polling uses plain HTTP requests, so it traverses virtually every
      proxy and firewall. Libraries like Socket.IO fall back to it when a
      WebSocket upgrade is blocked. It is a lowest-common-denominator, not
      obsolete.
    ref: "concepts.md#short-polling-vs-long-polling"

  - id: realtime-websockets-sse-008
    difficulty: beginner
    tags: [websocket, handshake, status-code]
    question: |
      What HTTP status code does a server return to accept a WebSocket upgrade?
    options:
      - "200 OK"
      - "204 No Content"
      - "101 Switching Protocols"
      - "426 Upgrade Required"
    answer: 2
    explanation: |
      A successful WebSocket handshake replies with 101 Switching Protocols,
      the HTTP mechanism for changing the connection off HTTP onto another
      protocol (here, WebSocket).
    ref: "concepts.md#websocket-http-upgrade-handshake"

  - id: realtime-websockets-sse-009
    difficulty: beginner
    tags: [websocket, handshake, headers]
    question: |
      Which two headers must the client send to request a WebSocket upgrade?
    options:
      - "Upgrade: websocket and Connection: Upgrade"
      - "Transfer-Encoding: chunked and Content-Type: websocket"
      - "Accept: websocket and Cache-Control: no-cache"
      - "Sec-Fetch-Mode: websocket and Origin: *"
    answer: 0
    explanation: |
      The opening handshake is an HTTP GET carrying Upgrade: websocket and
      Connection: Upgrade. These signal the intent to switch protocols; the
      server confirms with 101 and echoes both headers.
    ref: "concepts.md#websocket-http-upgrade-handshake"

  - id: realtime-websockets-sse-010
    difficulty: intermediate
    tags: [websocket, handshake, sec-websocket-accept]
    question: |
      How does a server compute the Sec-WebSocket-Accept value?
    options:
      - "It encrypts the client key with the server's TLS private key"
      - "It returns the client's Sec-WebSocket-Key unchanged"
      - "MD5 of the Host header concatenated with the current timestamp"
      - "base64( SHA1( Sec-WebSocket-Key + the fixed RFC 6455 GUID ) )"
    answer: 3
    explanation: |
      The server appends the magic GUID 258EAFA5-E914-47DA-95CA-C5AB0DC85B11 to
      the client's Sec-WebSocket-Key, takes SHA-1, and base64-encodes the result.
      This proves the server understands WebSocket; it is not encryption.
    ref: "concepts.md#websocket-http-upgrade-handshake"

  - id: realtime-websockets-sse-011
    difficulty: intermediate
    tags: [websocket, handshake, security]
    question: |
      What is the purpose of the Sec-WebSocket-Key / Sec-WebSocket-Accept exchange?
    options:
      - "To authenticate the user and establish a session"
      - "To encrypt the WebSocket payload end-to-end"
      - "To prove the server actually speaks WebSocket and guard against caching proxies replaying responses"
      - "To negotiate the maximum frame size"
    answer: 2
    explanation: |
      The key is a random nonce, not a secret. The deterministic accept value
      proves the peer implements WebSocket and defends against caching
      intermediaries / cross-protocol confusion. Confidentiality comes from TLS
      (wss://), not this exchange.
    ref: "concepts.md#websocket-http-upgrade-handshake"

  - id: realtime-websockets-sse-012
    difficulty: intermediate
    tags: [websocket, subprotocol, negotiation]
    question: |
      What does the Sec-WebSocket-Protocol header negotiate?
    options:
      - "The TLS cipher suite"
      - "The maximum number of frames per message"
      - "Whether masking is enabled"
      - "An application-level subprotocol the two sides agree to speak over the socket"
    answer: 3
    explanation: |
      Sec-WebSocket-Protocol lets the client offer application subprotocols
      (e.g. a chat or WAMP format); the server echoes the single one it selects.
      Sec-WebSocket-Extensions negotiates wire extensions like
      permessage-deflate.
    ref: "concepts.md#websocket-http-upgrade-handshake"

  - id: realtime-websockets-sse-013
    difficulty: beginner
    tags: [websocket, version]
    question: |
      What value does Sec-WebSocket-Version carry for the WebSocket protocol
      defined by RFC 6455?
    options:
      - "1"
      - "8"
      - "13"
      - "6455"
    answer: 2
    explanation: |
      RFC 6455 defines version 13, the only version in use for standard
      WebSocket. Earlier draft numbers (like 8) predate the final RFC.
    ref: "concepts.md#websocket-http-upgrade-handshake"

  - id: realtime-websockets-sse-014
    difficulty: advanced
    tags: [websocket, http2, upgrade]
    question: |
      A candidate claims "you use the Upgrade: websocket header to open a
      WebSocket over HTTP/2." Why is this wrong?
    options:
      - "HTTP/2 removed the Upgrade mechanism; WebSocket over HTTP/2 uses an extended CONNECT (RFC 8441) instead"
      - "HTTP/2 does not support WebSocket at all under any mechanism"
      - "The Upgrade header only works over UDP transports"
      - "HTTP/2 requires Sec-WebSocket-Version: 2 instead"
    answer: 0
    explanation: |
      HTTP/2 dropped the HTTP/1.1 Upgrade mechanism entirely. Bootstrapping
      WebSocket over HTTP/2 uses the extended CONNECT method from RFC 8441 (and
      RFC 9220 for HTTP/3). The classic Upgrade: websocket header is HTTP/1.1-only.
    ref: "concepts.md#websocket-http-upgrade-handshake"

  - id: realtime-websockets-sse-015
    difficulty: beginner
    tags: [websocket, full-duplex]
    question: |
      After a successful 101 handshake, how does the connection behave?
    options:
      - "It reverts to normal HTTP request/response for each message"
      - "It becomes a persistent full-duplex channel carrying WebSocket frames"
      - "It closes and reopens for every message"
      - "It only allows server-to-client data, like SSE"
    answer: 1
    explanation: |
      Once upgraded, the TCP connection is a persistent, bidirectional
      (full-duplex) pipe. There is no more HTTP request/response structure — both
      sides send WebSocket frames whenever they want.
    ref: "concepts.md#websocket-framing-and-full-duplex-data-transfer"

  - id: realtime-websockets-sse-016
    difficulty: intermediate
    tags: [websocket, framing, opcode]
    question: |
      In a WebSocket frame, which opcode indicates a text (UTF-8) data frame?
    options:
      - "0x1"
      - "0x0"
      - "0x2"
      - "0x8"
    answer: 0
    explanation: |
      Opcode 0x1 is text (UTF-8), 0x2 is binary, 0x0 is a continuation frame,
      and 0x8/0x9/0xA are close/ping/pong control frames respectively.
    ref: "concepts.md#websocket-framing-and-full-duplex-data-transfer"

  - id: realtime-websockets-sse-017
    difficulty: intermediate
    tags: [websocket, framing, fin, fragmentation]
    question: |
      What does the FIN bit in a WebSocket frame header signify?
    options:
      - "That the connection is being closed"
      - "That the payload is masked"
      - "That the frame is the final fragment of a message"
      - "That the frame is a control frame"
    answer: 2
    explanation: |
      FIN=1 marks the last frame of a message. A message can be fragmented across
      multiple frames using FIN=0 plus continuation (0x0) frames; the receiver
      reassembles them into one message.
    ref: "concepts.md#websocket-framing-and-full-duplex-data-transfer"

  - id: realtime-websockets-sse-018
    difficulty: advanced
    tags: [websocket, framing, payload-length]
    question: |
      A WebSocket frame's 7-bit "Payload len" field contains the value 126.
      What does that mean?
    options:
      - "The payload is exactly 126 bytes"
      - "The real length is given by the following 16 bits"
      - "The real length is given by the following 64 bits"
      - "The frame has no payload"
    answer: 1
    explanation: |
      Values 0–125 are the literal length. The sentinel 126 means the actual
      length is in the next 16 bits; 127 means it is in the next 64 bits. This
      variable-length encoding keeps small frames compact.
    ref: "concepts.md#websocket-framing-and-full-duplex-data-transfer"

  - id: realtime-websockets-sse-019
    difficulty: intermediate
    tags: [websocket, masking, security]
    question: |
      Which statement about WebSocket masking is correct?
    options:
      - "Server-to-client frames must be masked; client-to-server frames must not"
      - "Both directions must always be masked"
      - "Masking provides payload confidentiality, replacing the need for TLS"
      - "Client-to-server frames must be masked; server-to-client frames must not"
    answer: 3
    explanation: |
      Every client→server frame MUST be masked (XORed with a per-frame random
      key); server→client frames MUST NOT be masked. Masking defends
      intermediaries against cache-poisoning, not confidentiality — use wss:// for
      that.
    ref: "concepts.md#websocket-framing-and-full-duplex-data-transfer"

  - id: realtime-websockets-sse-020
    difficulty: advanced
    tags: [websocket, masking, rationale]
    question: |
      Why does RFC 6455 mandate masking of client-originated frames?
    options:
      - "To compress the payload"
      - "To prevent intermediaries from misinterpreting attacker-controlled bytes as a crafted HTTP request (cache poisoning)"
      - "To let the server verify the client's identity"
      - "To randomize TCP sequence numbers"
    answer: 1
    explanation: |
      Masking exists so that a malicious client cannot craft payload bytes that a
      naive proxy/cache might interpret as a separate HTTP request and poison its
      cache. Because the mask is random per frame, the on-wire bytes are
      unpredictable to intermediaries.
    ref: "concepts.md#websocket-framing-and-full-duplex-data-transfer"

  - id: realtime-websockets-sse-021
    difficulty: intermediate
    tags: [websocket, message-oriented, tcp]
    question: |
      How does WebSocket differ from writing directly to a raw TCP socket for
      application data?
    options:
      - "WebSocket is message-oriented (frames reassembled into whole messages) whereas raw TCP is an unframed byte stream"
      - "WebSocket uses UDP under the hood"
      - "Raw TCP guarantees message boundaries but WebSocket does not"
      - "WebSocket cannot carry binary data but raw TCP can"
    answer: 0
    explanation: |
      TCP is an unframed byte stream — you must delimit messages yourself.
      WebSocket adds framing so the receiver reassembles frames into discrete
      messages, and the opcode marks text vs binary explicitly.
    ref: "concepts.md#websocket-framing-and-full-duplex-data-transfer"

  - id: realtime-websockets-sse-022
    difficulty: beginner
    tags: [websocket, ping-pong, keepalive]
    question: |
      When a WebSocket endpoint receives a Ping frame, what must it do?
    options:
      - "Reply with a Pong frame echoing the same payload"
      - "Close the connection immediately"
      - "Send back another Ping"
      - "Ignore it unless it contains data"
    answer: 0
    explanation: |
      Per RFC 6455 the receiver of a Ping (0x9) MUST respond with a Pong (0xA)
      carrying the same application data, as soon as practical. This is the
      protocol-level liveness check.
    ref: "concepts.md#pingpong-keepalive-and-heartbeats"

  - id: realtime-websockets-sse-023
    difficulty: intermediate
    tags: [websocket, keepalive, idle-timeout]
    question: |
      Besides detecting a dead peer, what practical benefit do periodic
      ping/pong frames provide?
    options:
      - "They compress subsequent frames"
      - "They re-run the TLS handshake for forward secrecy"
      - "They renegotiate a larger frame size"
      - "They reset idle timers on NATs, proxies, and load balancers so the connection isn't reaped"
    answer: 3
    explanation: |
      Idle connections get dropped by intermediaries. Periodic ping/pong traffic
      keeps the idle timers from firing, preventing silent connection reaping, in
      addition to confirming the peer is alive.
    ref: "concepts.md#pingpong-keepalive-and-heartbeats"

  - id: realtime-websockets-sse-024
    difficulty: advanced
    tags: [websocket, keepalive, tcp-keepalive]
    question: |
      How does WebSocket ping/pong differ from TCP keepalive?
    options:
      - "They are identical mechanisms with different names"
      - "TCP keepalive works only over TLS; ping/pong works only in plaintext"
      - "Ping/pong is at the WebSocket protocol layer and app-tunable; TCP keepalive is OS-level, off by default, and often on a ~2-hour timer"
      - "Ping/pong is sent by the OS; TCP keepalive is sent by the application"
    answer: 2
    explanation: |
      Ping/pong lives in the WebSocket protocol and is controlled by the
      application at whatever cadence it likes. TCP keepalive is an OS feature,
      usually disabled by default and with a very coarse (~2h) default interval —
      too slow for real-time liveness.
    ref: "concepts.md#pingpong-keepalive-and-heartbeats"

  - id: realtime-websockets-sse-025
    difficulty: advanced
    tags: [websocket, heartbeat, unsolicited-pong]
    question: |
      Is an endpoint allowed to send a Pong frame that was not preceded by a Ping?
    options:
      - "No, every Pong must answer a Ping"
      - "Yes; an unsolicited Pong is a legal one-way heartbeat"
      - "Only the server may send unsolicited Pongs"
      - "Only if masking is disabled"
    answer: 1
    explanation: |
      RFC 6455 permits unsolicited Pong frames as a unidirectional heartbeat
      ("I'm alive") that does not require a preceding Ping and needs no response.
    ref: "concepts.md#pingpong-keepalive-and-heartbeats"

  - id: realtime-websockets-sse-026
    difficulty: beginner
    tags: [websocket, close, close-code]
    question: |
      Which WebSocket close code indicates a normal, intended closure?
    options:
      - "1000"
      - "1006"
      - "1011"
      - "1002"
    answer: 0
    explanation: |
      1000 is "normal closure." 1001 is going away, 1002 protocol error, 1011 an
      unexpected server condition, and 1006 an abnormal drop with no close frame.
    ref: "concepts.md#websocket-close-handshake-and-close-codes"

  - id: realtime-websockets-sse-027
    difficulty: intermediate
    tags: [websocket, close, close-handshake]
    question: |
      What does a clean WebSocket close look like at the protocol level?
    options:
      - "One side just stops sending; no frame is needed"
      - "The client sends an HTTP DELETE request"
      - "The server sends a 410 Gone status"
      - "A two-way exchange: one side sends a Close frame, the peer replies with its own Close frame, then TCP tears down"
    answer: 3
    explanation: |
      Closing is a two-way handshake mirroring TCP's FIN/FIN: one endpoint sends
      a Close frame (0x8), the peer echoes a Close frame, then the underlying TCP
      connection is closed.
    ref: "concepts.md#websocket-close-handshake-and-close-codes"

  - id: realtime-websockets-sse-028
    difficulty: intermediate
    tags: [websocket, close, code-1006, reconnect]
    question: |
      A client library reports close code 1006. What does that tell you?
    options:
      - "The server explicitly requested a normal shutdown"
      - "The TCP connection dropped without a proper close handshake — usually a crash or network loss, so reconnect"
      - "The payload was too large"
      - "A required extension was not negotiated"
    answer: 1
    explanation: |
      1006 is a reserved code the API reports locally (it is never sent on the
      wire) meaning the connection closed abnormally with no Close frame — a
      crash or network partition. It is the usual trigger to reconnect.
    ref: "concepts.md#websocket-close-handshake-and-close-codes"

  - id: realtime-websockets-sse-029
    difficulty: advanced
    tags: [websocket, close, reserved-codes]
    question: |
      Which set of WebSocket close codes must NEVER appear inside an actual Close
      frame on the wire (they are only reported locally by APIs)?
    options:
      - "1000, 1001, 1011"
      - "1002, 1003, 1007"
      - "1005, 1006, 1015"
      - "1008, 1009, 1010"
    answer: 2
    explanation: |
      1005 (no status present), 1006 (abnormal closure), and 1015 (TLS handshake
      failure) are reserved codes an implementation may report to the application
      but must never actually transmit in a Close frame.
    ref: "concepts.md#websocket-close-handshake-and-close-codes"

  - id: realtime-websockets-sse-030
    difficulty: intermediate
    tags: [websocket, close, code-1007]
    question: |
      A server receives a "text" frame whose bytes are not valid UTF-8. Which
      close code is appropriate?
    options:
      - "1009 (message too big)"
      - "1007 (invalid payload data)"
      - "1000 (normal closure)"
      - "1010 (extension required)"
    answer: 1
    explanation: |
      Text frames must carry valid UTF-8. Non-UTF-8 data in a text frame is a
      protocol-defined reason to close with 1007 (invalid payload data).
    ref: "concepts.md#websocket-close-handshake-and-close-codes"

  - id: realtime-websockets-sse-031
    difficulty: beginner
    tags: [sse, content-type, direction]
    question: |
      What Content-Type does a Server-Sent Events response use, and what
      direction does data flow?
    options:
      - "text/event-stream; server-to-client only"
      - "application/json; bidirectional"
      - "text/websocket; full-duplex"
      - "multipart/x-mixed-replace; client-to-server only"
    answer: 0
    explanation: |
      SSE responses use Content-Type: text/event-stream and stream events in one
      direction only, server→client, over a long-lived HTTP response consumed by
      the browser's EventSource API.
    ref: "concepts.md#server-sent-events-sse-textevent-stream"

  - id: realtime-websockets-sse-032
    difficulty: intermediate
    tags: [sse, format, dispatch]
    question: |
      In the SSE text format, what signals the end of one event so the browser
      dispatches it?
    options:
      - "A line containing END"
      - "A null byte"
      - "Reaching the Content-Length"
      - "A blank line (an empty line / bare newline)"
    answer: 3
    explanation: |
      Events are separated by a blank line. Fields (data:, event:, id:, retry:)
      accumulate until a blank line, at which point the event is dispatched.
      Multiple data: lines within one event are joined with newlines.
    ref: "concepts.md#server-sent-events-sse-textevent-stream"

  - id: realtime-websockets-sse-033
    difficulty: intermediate
    tags: [sse, comments, heartbeat]
    question: |
      In an SSE stream, what does a line beginning with a colon (:) do?
    options:
      - "Defines the event name"
      - "Sets the reconnection delay"
      - "It is a comment that clients ignore, often used as a keep-alive heartbeat"
      - "Marks the end of the stream"
    answer: 2
    explanation: |
      A line starting with ':' is a comment and is ignored by clients. It is
      commonly emitted periodically as a heartbeat to keep the connection and any
      intermediaries from timing out.
    ref: "concepts.md#server-sent-events-sse-textevent-stream"

  - id: realtime-websockets-sse-034
    difficulty: intermediate
    tags: [sse, payload, text-only]
    question: |
      Which statement about SSE payloads is correct?
    options:
      - "SSE natively carries raw binary frames"
      - "SSE is UTF-8 text only; binary must be base64-encoded (with overhead) or you use WebSocket"
      - "SSE requires all payloads to be valid JSON"
      - "SSE can only send one line of data per event"
    answer: 1
    explanation: |
      text/event-stream is UTF-8 text only. There is no binary framing; to send
      binary you must base64-encode it (paying ~33% overhead) or choose WebSocket,
      which has a binary opcode.
    ref: "concepts.md#server-sent-events-sse-textevent-stream"

  - id: realtime-websockets-sse-035
    difficulty: advanced
    tags: [sse, http1, connection-limit]
    question: |
      Why can opening many independent SSE streams to a single origin over
      HTTP/1.1 cause problems?
    options:
      - "SSE requires a dedicated TCP port per stream"
      - "HTTP/1.1 forbids more than one text/event-stream response per session"
      - "SSE disables HTTP caching for the whole origin"
      - "Browsers cap ~6 connections per origin, so multiple long-lived SSE streams exhaust the pool and starve other requests"
    answer: 3
    explanation: |
      Over HTTP/1.1 browsers allow only ~6 concurrent connections per origin.
      Each SSE stream holds one open, so several streams can consume the pool and
      block ordinary requests. HTTP/2 multiplexing removes this limit.
    ref: "concepts.md#server-sent-events-sse-textevent-stream"

  - id: realtime-websockets-sse-036
    difficulty: beginner
    tags: [sse, reconnect]
    question: |
      What does the browser's EventSource do when an SSE connection drops?
    options:
      - "It automatically reconnects after a delay"
      - "Nothing; the application must manually reconnect"
      - "It falls back to WebSocket"
      - "It reloads the entire page"
    answer: 0
    explanation: |
      Automatic reconnection is built into EventSource — a headline SSE feature.
      When the stream drops it reconnects after a delay (tunable via the retry
      field). WebSocket, by contrast, has no built-in reconnect.
    ref: "concepts.md#sse-auto-reconnect-and-last-event-id"

  - id: realtime-websockets-sse-037
    difficulty: intermediate
    tags: [sse, retry, reconnect]
    question: |
      How does a server influence how long an EventSource client waits before
      reconnecting?
    options:
      - "By setting the Retry-After response header"
      - "By sending a Ping frame"
      - "It cannot; the delay is fixed at 3 seconds"
      - "By emitting a retry: <milliseconds> field in the stream"
    answer: 3
    explanation: |
      The server can send a retry: field with a millisecond value in the event
      stream; the client uses it as the reconnection delay for subsequent drops.
    ref: "concepts.md#sse-auto-reconnect-and-last-event-id"

  - id: realtime-websockets-sse-038
    difficulty: intermediate
    tags: [sse, last-event-id, resume]
    question: |
      How does SSE let a client resume a stream without losing events after a
      reconnect?
    options:
      - "The client sends a Range header with byte offsets"
      - "The server assigns id: values; on reconnect the browser sends Last-Event-ID and the server replays events after that id"
      - "The client re-requests the whole history each time"
      - "SSE cannot resume; gaps are unavoidable"
    answer: 1
    explanation: |
      When the server tags events with id:, EventSource remembers the last id and
      sends it in the Last-Event-ID request header on reconnect. The server reads
      it and replays events after that id, giving a resumable stream.
    ref: "concepts.md#sse-auto-reconnect-and-last-event-id"

  - id: realtime-websockets-sse-039
    difficulty: advanced
    tags: [sse, last-event-id, gotcha]
    question: |
      A team relies on Last-Event-ID for guaranteed delivery but sees gaps after
      reconnects. What is the most likely cause?
    options:
      - "Last-Event-ID is sent as a query parameter, not a header"
      - "The server does not persist/buffer events by id, so it cannot actually replay events after the given id"
      - "Browsers strip the Last-Event-ID header for security"
      - "SSE only supports numeric ids below 1000"
    answer: 1
    explanation: |
      The resume guarantee is only as good as the server's ability to replay by
      id. If events aren't persisted/buffered, the server cannot fill the gap even
      though the client sent Last-Event-ID correctly.
    ref: "concepts.md#sse-auto-reconnect-and-last-event-id"

  - id: realtime-websockets-sse-040
    difficulty: intermediate
    tags: [comparison, direction, choosing]
    question: |
      For a read-only live dashboard that only needs server→client updates and
      values simplicity plus HTTP/2 friendliness, which is the best fit?
    options:
      - "WebSocket"
      - "SSE"
      - "Short polling every 500ms"
      - "Raw UDP multicast"
    answer: 1
    explanation: |
      One-directional server-to-client streaming with auto-reconnect over plain
      HTTP is exactly SSE's sweet spot. WebSocket would add framing, custom
      reconnect logic, and proxy friction you don't need for a read-only feed.
    ref: "concepts.md#websocket-vs-sse-vs-long-polling-choosing"

  - id: realtime-websockets-sse-041
    difficulty: intermediate
    tags: [comparison, choosing, binary]
    question: |
      A multiplayer game needs low-latency, bidirectional, binary messages
      between client and server. Which transport fits best?
    options:
      - "SSE"
      - "Long polling"
      - "WebSocket"
      - "Short polling"
    answer: 2
    explanation: |
      Bidirectional + low-latency + binary points to WebSocket: it is full-duplex
      and has an explicit binary opcode. SSE is text-only and one-way; polling
      adds latency and overhead.
    ref: "concepts.md#websocket-vs-sse-vs-long-polling-choosing"

  - id: realtime-websockets-sse-042
    difficulty: intermediate
    tags: [comparison, reconnect]
    question: |
      Which statement about built-in reconnection is correct?
    options:
      - "Both WebSocket and SSE reconnect automatically"
      - "WebSocket reconnects automatically; SSE does not"
      - "Neither reconnects; both require a page reload"
      - "SSE reconnects automatically; WebSocket has no built-in reconnect and you must implement it"
    answer: 3
    explanation: |
      SSE/EventSource reconnects automatically (with retry and Last-Event-ID
      resume). WebSocket has no built-in reconnection — applications add their own
      logic, typically jittered exponential backoff.
    ref: "concepts.md#websocket-vs-sse-vs-long-polling-choosing"

  - id: realtime-websockets-sse-043
    difficulty: intermediate
    tags: [comparison, proxies, firewalls]
    question: |
      Regarding proxy and firewall traversal, which ordering is most accurate?
    options:
      - "WebSocket traverses proxies most reliably; long polling least"
      - "Long polling / plain HTTP traverses proxies best; WebSocket can be blocked because it needs the Upgrade to pass through"
      - "All three are equally likely to be blocked"
      - "SSE is always blocked by firewalls"
    answer: 1
    explanation: |
      Long polling and SSE are ordinary HTTP, so they traverse nearly all
      intermediaries. WebSocket requires the Upgrade/Connection headers to be
      forwarded and can be blocked by proxies; wss:// (over TLS) survives far
      better than plaintext ws://.
    ref: "concepts.md#websocket-vs-sse-vs-long-polling-choosing"

  - id: realtime-websockets-sse-044
    difficulty: advanced
    tags: [comparison, connection-limit]
    question: |
      Which is true about how these approaches interact with the browser's
      ~6-connections-per-origin limit on HTTP/1.1?
    options:
      - "SSE streams tie up one of the ~6 per-origin connections each; WebSocket connections do not count against that cap"
      - "WebSocket connections count against the 6-per-origin cap; SSE streams do not"
      - "Neither SSE nor WebSocket uses a browser connection"
      - "Both are exempt from all connection limits"
    answer: 0
    explanation: |
      Each SSE stream holds one of the ~6 HTTP/1.1 connections per origin, so many
      streams starve the pool. WebSocket connections are not counted against that
      per-origin HTTP cap.
    ref: "concepts.md#websocket-vs-sse-vs-long-polling-choosing"

  - id: realtime-websockets-sse-045
    difficulty: intermediate
    tags: [comparison, long-poll, sse-efficiency]
    question: |
      Both long polling and SSE hold a connection open. Why is SSE generally more
      efficient for a stream of many events?
    options:
      - "SSE uses UDP so it avoids TCP overhead"
      - "Long polling cannot deliver more than one event ever"
      - "SSE keeps one connection open for many events with tiny framing, whereas long polling pays a full request/response cycle per event"
      - "SSE compresses every event with gzip automatically"
    answer: 2
    explanation: |
      Long polling completes and re-establishes a request for each event (full
      headers, round trip). SSE streams many events over one persistent
      connection with minimal per-event framing, plus built-in reconnect/resume.
    ref: "concepts.md#websocket-vs-sse-vs-long-polling-choosing"

  - id: realtime-websockets-sse-046
    difficulty: intermediate
    tags: [scaling, connections, io-model]
    question: |
      Why does holding hundreds of thousands of mostly-idle WebSocket/SSE
      connections require an event-driven (epoll/kqueue) server model?
    options:
      - "Because each connection needs its own CPU core"
      - "Because a thread-per-connection model would need one thread per idle socket, exhausting memory; async I/O multiplexes many sockets per thread"
      - "Because TCP forbids more than 1024 connections per process"
      - "Because idle connections must be polled in a busy loop"
    answer: 1
    explanation: |
      The bottleneck is open-connection count, not request rate. Thread-per-
      connection can't scale to hundreds of thousands of idle sockets; an
      event-driven readiness model (epoll/kqueue) lets one thread watch many
      sockets, which is why async I/O underpins real-time servers.
    ref: "concepts.md#scaling-stateful-real-time-connections"

  - id: realtime-websockets-sse-047
    difficulty: advanced
    tags: [scaling, fanout, pubsub]
    question: |
      User A's socket is on server 1; user B's socket is on server 3. How do
      real-time systems typically deliver A's message to B?
    options:
      - "Server 1 opens a direct WebSocket to user B"
      - "All servers share connection state in a single global socket table"
      - "Servers subscribe to a shared pub/sub bus (e.g. Redis/Kafka); each node delivers only to the sockets it locally owns"
      - "The message is broadcast to every client of every server"
    answer: 2
    explanation: |
      Because a socket is pinned to one node, cross-node fan-out uses a shared
      pub/sub bus. Each server publishes messages and delivers to the connections
      it locally holds, decoupling "who is connected where" from "who needs the
      message."
    ref: "concepts.md#scaling-stateful-real-time-connections"

  - id: realtime-websockets-sse-048
    difficulty: intermediate
    tags: [scaling, load-balancer, l7]
    question: |
      What must an L7 (HTTP-aware) load balancer be configured to do for
      WebSocket to work through it?
    options:
      - "Terminate the connection after every frame"
      - "Convert WebSocket frames into HTTP requests"
      - "Block the 101 response for security"
      - "Forward the Upgrade/Connection headers and permit long-lived connections (raise idle timeouts)"
    answer: 3
    explanation: |
      Upgrade and Connection are hop-by-hop headers; an L7 LB must forward them
      and allow the connection to stay open (higher idle timeouts) for the
      upgraded WebSocket to persist. L4 LBs pass TCP through transparently.
    ref: "concepts.md#scaling-stateful-real-time-connections"

  - id: realtime-websockets-sse-049
    difficulty: advanced
    tags: [scaling, reconnect-storm, backoff]
    question: |
      After a deploy disconnects all clients simultaneously, what mitigates the
      reconnect storm / thundering herd?
    options:
      - "Having every client reconnect immediately at the same instant"
      - "Jittered exponential backoff on reconnects (and tuning SSE retry)"
      - "Switching all clients to short polling permanently"
      - "Disabling TLS to speed up handshakes"
    answer: 1
    explanation: |
      If everyone reconnects at once you get a synchronized spike. Jittered
      exponential backoff spreads reconnect attempts over time; for SSE the retry
      field tunes the base delay. Graceful shutdown (close 1001) and connection
      draining also help.
    ref: "concepts.md#scaling-stateful-real-time-connections"

  - id: realtime-websockets-sse-050
    difficulty: advanced
    tags: [scaling, backpressure]
    question: |
      Why is backpressure a concern for a server pushing to many WebSocket
      clients?
    options:
      - "A slow client whose send buffer fills can bloat server memory unless per-connection queues are bounded and slow consumers dropped"
      - "Fast clients force the server to slow all other clients"
      - "TCP automatically discards data for slow clients, causing corruption"
      - "Backpressure only affects SSE, never WebSocket"
    answer: 0
    explanation: |
      If a client reads slowly, its server-side send buffer grows. Without bounded
      per-connection queues (and dropping/closing chronically slow consumers), a
      few slow clients can exhaust server memory.
    ref: "concepts.md#scaling-stateful-real-time-connections"

  - id: realtime-websockets-sse-051
    difficulty: beginner
    tags: [websocket, scheme, tls]
    question: |
      What is the difference between the ws:// and wss:// schemes?
    options:
      - "ws:// is faster because it skips framing"
      - "wss:// is one-directional like SSE"
      - "ws:// uses UDP; wss:// uses TCP"
      - "wss:// runs the same WebSocket handshake inside TLS (typically on port 443); ws:// is plaintext"
    answer: 3
    explanation: |
      wss:// is WebSocket over TLS (usually port 443) — the encrypted form. It
      uses the same handshake but wrapped in TLS, and it traverses intercepting
      proxies far more reliably than plaintext ws://.
    ref: "concepts.md#websocket-http-upgrade-handshake"

  - id: realtime-websockets-sse-052
    difficulty: advanced
    tags: [websocket, control-frames, framing]
    question: |
      Which constraint does RFC 6455 place on control frames (close, ping, pong)?
    options:
      - "They must be at least 126 bytes"
      - "They must be masked in both directions"
      - "They must be ≤125 bytes and must not be fragmented"
      - "They can only be sent by the server"
    answer: 2
    explanation: |
      Control frames (0x8/0x9/0xA) must carry a payload of 125 bytes or fewer and
      must not be fragmented. They may, however, be interleaved between fragments
      of a larger data message.
    ref: "concepts.md#websocket-framing-and-full-duplex-data-transfer"

  - id: realtime-websockets-sse-053
    difficulty: expert
    tags: [websocket, security, cswsh, origin]
    question: |
      An attacker's page at https://evil.com runs `new WebSocket("wss://bank.example/ws")`.
      The victim is logged into bank.example. The bank authenticates the socket purely by
      its session cookie and sends no CORS headers. What happens?
    options:
      - "The socket opens as the authenticated victim, because WS handshakes aren't bound by SOP/CORS and the cookie rides along cross-site (CSWSH)"
      - "The browser blocks the handshake because it violates the Same-Origin Policy"
      - "The handshake is blocked because the server sent no Access-Control-Allow-Origin header"
      - "The browser opens the socket but strips the cookie for cross-origin requests"
    answer: 0
    explanation: |
      WebSocket handshakes are not subject to the Same-Origin Policy or CORS, and unlike
      fetch they fail *open* — no CORS headers still means the connection proceeds. The
      victim's cookie is attached cross-site, so the attacker gets an authenticated
      bidirectional channel. This is Cross-Site WebSocket Hijacking (CWE-1385).
    ref: "concepts.md#websocket-security-cswsh-origin-and-authentication"

  - id: realtime-websockets-sse-054
    difficulty: expert
    tags: [websocket, security, origin, validation]
    question: |
      A team defends against CSWSH by checking `Origin.endsWith("bank.example")`. Why is
      this still exploitable?
    options:
      - "Origin is only sent over plaintext ws://, never wss://"
      - "A suffix check passes attacker origins like https://bank.example.evil.com"
      - "The Origin header is not sent by browsers on WebSocket handshakes"
      - "endsWith is case-sensitive so it never matches real browsers"
    answer: 1
    explanation: |
      Substring/suffix matching is the classic bypass: `https://bank.example.evil.com`
      ends with `bank.example`, and `https://notbank.example` would pass a naive contains
      check. Origin must be compared against a full-value allowlist, not matched by
      suffix/prefix/contains.
    ref: "concepts.md#websocket-security-cswsh-origin-and-authentication"

  - id: realtime-websockets-sse-055
    difficulty: advanced
    tags: [websocket, security, authentication, headers]
    question: |
      Why can't a browser-based WebSocket client send `Authorization: Bearer <token>` on
      the handshake, and what is a common workaround that still works from the browser?
    options:
      - "The constructor exposes no custom request headers; smuggle the token via the Sec-WebSocket-Protocol (subprotocols) argument"
      - "Authorization is a hop-by-hop header the browser drops; send it as a trailer instead"
      - "TLS forbids Authorization on upgrade requests; downgrade to ws:// to send it"
      - "The 101 response cannot carry auth; retry the handshake with a 200 instead"
    answer: 0
    explanation: |
      The browser `WebSocket` constructor cannot set arbitrary request headers, so there is
      no way to attach Authorization. A widespread hack is to pass the token as a
      "subprotocol" in the constructor's second argument (which the browser does send as
      Sec-WebSocket-Protocol) and extract it server-side. Cookies or query-string tokens are
      the other options, each with trade-offs.
    ref: "concepts.md#websocket-security-cswsh-origin-and-authentication"

  - id: realtime-websockets-sse-056
    difficulty: advanced
    tags: [websocket, security, authentication, query-string]
    question: |
      A design passes the auth token as `wss://app/ws?token=<jwt>`. What is the main
      security drawback of this approach?
    options:
      - "The token lands in access logs, proxy logs, and browser history where it can leak"
      - "Query strings are stripped during the WebSocket Upgrade"
      - "TLS does not encrypt the query string, so it travels in cleartext"
      - "WebSocket URLs cannot contain query parameters per RFC 6455"
    answer: 0
    explanation: |
      TLS does encrypt the URL on the wire, and WebSocket URLs can carry query strings. The
      real problem is that URLs (including query strings) are routinely written to server
      access logs, proxy logs, and browser history, so a token there is prone to leaking —
      hence short-lived tokens if you must use this pattern.
    ref: "concepts.md#websocket-security-cswsh-origin-and-authentication"

  - id: realtime-websockets-sse-057
    difficulty: advanced
    tags: [websocket, security, rfc6455, authentication]
    question: |
      What does RFC 6455 itself say about how a WebSocket server should authenticate clients?
    options:
      - "It mandates HTTP Basic auth on the handshake"
      - "It prescribes no authentication mechanism; auth is layered on via ordinary HTTP means"
      - "It requires a bearer token in Sec-WebSocket-Key"
      - "It defers all authentication to TLS client certificates only"
    answer: 1
    explanation: |
      RFC 6455 §10.5 explicitly declines to define an authentication mechanism. The
      handshake is an HTTP request, so servers reuse whatever HTTP-layer auth they want
      (cookies, tokens, etc.) — which is exactly why insecure cookie-only defaults lead to
      CSWSH.
    ref: "concepts.md#websocket-security-cswsh-origin-and-authentication"

  - id: realtime-websockets-sse-058
    difficulty: expert
    tags: [permessage-deflate, compression, rsv1, framing]
    question: |
      With `permessage-deflate` negotiated, how does a receiver know a given message is
      compressed?
    options:
      - "The opcode is changed from 0x1/0x2 to a dedicated compressed opcode"
      - "The RSV1 bit is set on the first frame of the message"
      - "A Sec-WebSocket-Compressed header precedes the frame"
      - "The MASK bit is cleared to indicate compression"
    answer: 1
    explanation: |
      permessage-deflate signals a compressed message by setting the RSV1 reserved bit on
      the first frame of that message. That is why RSV1 must otherwise be 0 unless an
      extension defining it has been negotiated. Opcodes and the MASK bit are unchanged.
    ref: "concepts.md#permessage-deflate-compression"

  - id: realtime-websockets-sse-059
    difficulty: expert
    tags: [permessage-deflate, compression, tail-trimming, rfc7692]
    question: |
      RFC 7692 specifies that after DEFLATE-compressing a message payload, the sender
      removes a specific trailing byte sequence. Which bytes, and why?
    options:
      - "Trailing 0x00 0x00 0xFF 0xFF (the empty DEFLATE block marker), re-appended by the receiver before inflating"
      - "A trailing CRC32 checksum, recomputed by the receiver"
      - "The leading 0x78 0x9C zlib header, which the receiver reconstructs"
      - "Trailing 0xFF 0xFF padding bytes added for alignment"
    answer: 0
    explanation: |
      The compressor appends an empty DEFLATE block that ends in 0x00 0x00 0xFF 0xFF, then
      strips those 4 bytes for transmission; the decompressor re-appends them before
      inflating. This "tail trimming" (RFC 7692 §7.2.1) saves 4 bytes per message.
    ref: "concepts.md#permessage-deflate-compression"

  - id: realtime-websockets-sse-060
    difficulty: expert
    tags: [permessage-deflate, security, crime, context-takeover]
    question: |
      A security scan flags a WebSocket endpoint that uses permessage-deflate with context
      takeover enabled and mixes a secret token with attacker-influenced text in the same
      compressed messages. What is the concern, and the mitigation?
    options:
      - "A CRIME/BREACH-style size oracle leaks the secret; disable context takeover (client/server_no_context_takeover)"
      - "Zip-bomb amplification; fix by increasing the max window bits"
      - "Frame masking is bypassed by compression; re-enable masking on server frames"
      - "TLS renegotiation is triggered; pin the cipher suite"
    answer: 0
    explanation: |
      With context takeover, compressed size depends on previously-seen bytes, so an attacker
      who injects guesses and observes compressed length can infer the secret (CRIME/BREACH
      class). Disabling context takeover (*_no_context_takeover) resets the window per message,
      removing the cross-message correlation.
    ref: "concepts.md#permessage-deflate-compression"

  - id: realtime-websockets-sse-061
    difficulty: expert
    tags: [permessage-deflate, context-takeover, memory, scaling]
    question: |
      Why do many large-scale WebSocket servers disable context takeover (or compression
      entirely) despite the worse compression ratio?
    options:
      - "Context takeover requires a separate TCP connection per message"
      - "It forces every frame to be masked twice"
      - "It reuses the LZ77 window across messages, holding a per-connection window in memory that dominates at hundreds of thousands of connections"
      - "It disables HTTP/2 multiplexing"
    answer: 2
    explanation: |
      Context takeover keeps the LZ77 sliding window alive for the connection's lifetime (per
      direction), so each connection holds compression/decompression state in memory. At huge
      connection counts that memory dominates, so operators trade ratio for
      *_no_context_takeover or turn compression off.
    ref: "concepts.md#permessage-deflate-compression"

  - id: realtime-websockets-sse-062
    difficulty: advanced
    tags: [permessage-deflate, max-window-bits, negotiation]
    question: |
      In `Sec-WebSocket-Extensions: permessage-deflate; server_max_window_bits=10`, what does
      the value 10 mean?
    options:
      - "The server will buffer at most 10 messages before flushing"
      - "Compression level 10 on a 0–15 scale"
      - "At most 10 frames per compressed message"
      - "The LZ77 window is 2^10 = 1024 bytes (the value is the base-2 log of the window size)"
    answer: 3
    explanation: |
      server_max_window_bits / client_max_window_bits give the base-2 logarithm of the LZ77
      window size, valid 8–15. So 10 means a 1 KiB window; 15 means the maximum 32 KiB.
      Smaller windows use less memory but compress worse.
    ref: "concepts.md#permessage-deflate-compression"

  - id: realtime-websockets-sse-063
    difficulty: expert
    tags: [websocket, masking, xor, rfc6455]
    question: |
      Per RFC 6455 §5.3, how is masked payload octet i produced from the original octet and
      the 32-bit masking key?
    options:
      - "transformed[i] = original[i] XOR masking-key[i mod 4]"
      - "transformed[i] = original[i] + masking-key[i] (mod 256)"
      - "transformed[i] = original[i] XOR masking-key[i mod 32]"
      - "transformed[i] = ROT13(original[i]) with key as seed"
    answer: 0
    explanation: |
      Masking XORs each payload octet with one of the four key bytes, cycling by (i mod 4).
      The 4-byte key is chosen fresh per frame from a strong RNG; a predictable key would
      undermine the anti-cache-poisoning purpose.
    ref: "concepts.md#websocket-framing-and-full-duplex-data-transfer"

  - id: realtime-websockets-sse-064
    difficulty: expert
    tags: [websocket, masking, protocol-error, close-1002]
    question: |
      A server receives a data frame from a client with the MASK bit cleared (unmasked). What
      does RFC 6455 require?
    options:
      - "Fail the connection, typically closing with 1002 (protocol error)"
      - "Silently unmask it as if it were masked with a zero key"
      - "Reply with a Pong and continue"
      - "Mask the frame itself before processing"
    answer: 0
    explanation: |
      All client-to-server frames MUST be masked; an unmasked one is a protocol violation, and
      the server must fail the connection (close code 1002). Symmetrically, a client must fail
      if it receives a masked server-to-client frame.
    ref: "concepts.md#websocket-framing-and-full-duplex-data-transfer"

  - id: realtime-websockets-sse-065
    difficulty: expert
    tags: [websocket, fragmentation, interleaving, rfc6455]
    question: |
      During a large fragmented binary message (opcode 0x2, FIN=0, then 0x0 continuations),
      which frames may legally appear interleaved before the final FIN=1 fragment?
    options:
      - "Fragments of a second data message, to multiplex two messages"
      - "Nothing at all; the connection is exclusively that message until FIN"
      - "Control frames such as Ping/Pong/Close, but not fragments of another data message"
      - "Only unmasked heartbeat frames from the server"
    answer: 2
    explanation: |
      Control frames may be injected between the fragments of a data message (so a Ping can be
      answered promptly), but you cannot interleave a second data message — one fragmented
      message must complete before another begins on the same connection.
    ref: "concepts.md#websocket-framing-and-full-duplex-data-transfer"

  - id: realtime-websockets-sse-066
    difficulty: expert
    tags: [websocket, fragmentation, dos, close-1009]
    question: |
      A peer keeps sending continuation frames with FIN=0 and never terminates the message.
      What is the risk and the correct defense?
    options:
      - "Risk of TCP sequence wraparound; reset the connection"
      - "Unbounded reassembly buffer growth (DoS); enforce a max message size and close with 1009"
      - "The frames will be silently dropped by TCP; no action needed"
      - "Masking keys will be exhausted; renegotiate the extension"
    answer: 1
    explanation: |
      A receiver must buffer fragments until FIN=1. An endless stream of FIN=0 fragments can
      exhaust memory — a DoS vector. Implementations cap the maximum message size and close
      with 1009 (message too big) when exceeded.
    ref: "concepts.md#websocket-framing-and-full-duplex-data-transfer"

  - id: realtime-websockets-sse-067
    difficulty: advanced
    tags: [websocket, framing, payload-length, byte-order]
    question: |
      For a WebSocket frame using the 64-bit extended payload length, which statement is
      correct?
    options:
      - "The length is big-endian (network byte order) and its most significant bit must be 0"
      - "The 8 bytes are little-endian and all 64 bits are usable"
      - "The length is sent as an ASCII decimal string"
      - "The high 32 bits are the masking key and the low 32 bits are the length"
    answer: 0
    explanation: |
      Multi-byte length and masking-key fields are network byte order (big-endian). For the
      64-bit form the most significant bit MUST be 0, capping a single frame's payload at
      2^63-1 bytes.
    ref: "concepts.md#websocket-framing-and-full-duplex-data-transfer"

  - id: realtime-websockets-sse-068
    difficulty: advanced
    tags: [websocket, subprotocol, extension, distinction]
    question: |
      Which pairing correctly separates a WebSocket subprotocol from an extension?
    options:
      - "Subprotocol = permessage-deflate; extension = STOMP"
      - "Both terms describe the same negotiated value"
      - "Subprotocol = graphql-transport-ws (message grammar); extension = permessage-deflate (wire transform)"
      - "Subprotocol = TLS cipher; extension = the application message format"
    answer: 2
    explanation: |
      A subprotocol (Sec-WebSocket-Protocol) defines the application message grammar — e.g.
      WAMP, STOMP, MQTT-over-WS, graphql-transport-ws — and the server echoes exactly one. An
      extension (Sec-WebSocket-Extensions) transforms the frames on the wire, e.g.
      permessage-deflate. They are different negotiation axes.
    ref: "concepts.md#websocket-http-upgrade-handshake"

  - id: realtime-websockets-sse-069
    difficulty: expert
    tags: [websocket, http2, rfc8441, extended-connect]
    question: |
      Under RFC 8441, what two things make WebSocket-over-HTTP/2 work?
    options:
      - "An Upgrade: h2c header and a 101 response inside the stream"
      - "A CONNECT to port 443 followed by a plaintext RFC 6455 handshake"
      - "The server advertises SETTINGS_ENABLE_CONNECT_PROTOCOL, and the client uses an extended CONNECT with :protocol = websocket"
      - "Sec-WebSocket-Version: 2 plus an ALPN token of ws2"
    answer: 2
    explanation: |
      HTTP/2 has no Upgrade mechanism. RFC 8441 has the server advertise
      SETTINGS_ENABLE_CONNECT_PROTOCOL=1, after which the client issues an extended CONNECT
      whose :protocol pseudo-header is "websocket"; the WebSocket then lives inside one H2
      stream.
    ref: "concepts.md#websocket-http-upgrade-handshake"

  - id: realtime-websockets-sse-070
    difficulty: expert
    tags: [websocket, http2, head-of-line, http3]
    question: |
      A team moves WebSocket from HTTP/1.1 to HTTP/2 (RFC 8441) hoping to fix head-of-line
      blocking under packet loss. What actually happens?
    options:
      - "HOL blocking is eliminated because H2 streams are independent"
      - "HOL blocking gets worse than HTTP/1.1 because of header compression"
      - "The WebSocket silently downgrades to HTTP/1.1, so nothing changes"
      - "HOL blocking remains, because all H2 streams share one TCP connection; only HTTP/3/QUIC (RFC 9220) fixes it"
    answer: 3
    explanation: |
      HTTP/2 multiplexes streams over a single TCP connection, so a lost TCP segment still
      stalls all streams (TCP-level HOL blocking). Real per-stream loss isolation requires
      QUIC — i.e. WebSocket over HTTP/3 (RFC 9220) or WebTransport.
    ref: "concepts.md#webtransport-over-http3-the-modern-alternative"

  - id: realtime-websockets-sse-071
    difficulty: expert
    tags: [webtransport, http3, quic, datagrams]
    question: |
      For a fast-paced multiplayer game where a stale positional update is worthless, which
      WebTransport capability is the key advantage over WebSocket?
    options:
      - "Mandatory TLS 1.2 for lower handshake latency"
      - "Automatic gzip of every message"
      - "A built-in Last-Event-ID replay mechanism"
      - "Unreliable, unordered datagrams over QUIC — drop-stale rather than retransmit, with no TCP HOL blocking"
    answer: 3
    explanation: |
      WebTransport (over HTTP/3/QUIC) offers unreliable, unordered datagrams so the app can
      send the next state instead of waiting on a retransmit of a now-useless old one, and
      QUIC isolates loss per stream — avoiding the single-TCP-stream HOL blocking that limits
      WebSocket.
    ref: "concepts.md#webtransport-over-http3-the-modern-alternative"

  - id: realtime-websockets-sse-072
    difficulty: advanced
    tags: [webtransport, quic, streams, transport]
    question: |
      Which set of capabilities does WebTransport provide on a single connection that plain
      WebSocket does not?
    options:
      - "One ordered reliable stream plus mandatory message compression"
      - "UDP broadcast to multiple clients at once"
      - "Guaranteed in-order delivery across all datagrams"
      - "Both unreliable datagrams and multiple independent reliable bidirectional streams, with per-stream loss isolation"
    answer: 3
    explanation: |
      WebTransport runs on QUIC and exposes unreliable/unordered datagrams AND many parallel
      reliable uni/bidirectional streams on one connection, each loss-isolated. WebSocket
      gives you a single ordered reliable stream and no datagram mode.
    ref: "concepts.md#webtransport-over-http3-the-modern-alternative"

  - id: realtime-websockets-sse-073
    difficulty: advanced
    tags: [sse, eventsource, fetch, authentication]
    question: |
      Why do most LLM token-streaming APIs deliver SSE over `fetch` + a `ReadableStream`
      reader instead of the browser `EventSource`?
    options:
      - "EventSource cannot parse the text/event-stream format"
      - "fetch-based streaming is the only way to receive binary SSE"
      - "EventSource is GET-only with no custom headers/body, so it can't send POST + Authorization + a JSON request body"
      - "EventSource does not support HTTP/2"
    answer: 2
    explanation: |
      EventSource issues a GET and exposes no way to set an Authorization header or send a
      body. Token-streaming endpoints need POST with an auth header and a JSON prompt body, so
      they read the stream via fetch/getReader and hand-parse the SSE grammar (giving up
      built-in reconnect/Last-Event-ID).
    ref: "concepts.md#sse-in-practice-eventsource-limits-fetch-based-sse-and-buffering-pitfalls"

  - id: realtime-websockets-sse-074
    difficulty: expert
    tags: [sse, eventsource, status-code, reconnect]
    question: |
      An SSE endpoint returns `204 No Content` on a reconnect attempt. Per the WHATWG spec,
      how does EventSource react?
    options:
      - "It retries after the retry delay, treating 204 as transient"
      - "It reconnects immediately with Last-Event-ID"
      - "It stops reconnecting — 204 is the clean signal to permanently end the stream"
      - "It fires onmessage with an empty event"
    answer: 2
    explanation: |
      A 204 tells EventSource to stop reconnecting, i.e. a graceful permanent shutdown. This
      contrasts with a network drop (auto-reconnect) and with a non-2xx/wrong-Content-Type
      response (fatal error, no reconnect).
    ref: "concepts.md#sse-in-practice-eventsource-limits-fetch-based-sse-and-buffering-pitfalls"

  - id: realtime-websockets-sse-075
    difficulty: expert
    tags: [sse, eventsource, readystate, error-handling]
    question: |
      An SSE reconnect gets an HTTP 403 with Content-Type application/json. What does
      EventSource do, and how can code distinguish it from a retriable network drop?
    options:
      - "It fires onerror and permanently closes (readyState CLOSED, no auto-reconnect); a network drop instead leaves readyState CONNECTING"
      - "It reconnects; readyState stays OPEN in both cases"
      - "It follows the 403 as a redirect"
      - "It queues events until a 200 arrives"
    answer: 0
    explanation: |
      A non-2xx status (or a 200 with the wrong Content-Type) is fatal: onerror fires,
      readyState becomes CLOSED, and there is no auto-reconnect. A transport-level drop is
      retriable, leaving readyState at CONNECTING — so checking readyState in onerror tells you
      "will retry" vs "permanent failure."
    ref: "concepts.md#sse-in-practice-eventsource-limits-fetch-based-sse-and-buffering-pitfalls"

  - id: realtime-websockets-sse-076
    difficulty: advanced
    tags: [sse, buffering, nginx, debugging]
    question: |
      SSE events stream fine under `curl`, but in the browser (behind nginx) they all arrive
      in one burst when the connection finally closes. What is the most likely cause and fix?
    options:
      - "TLS is buffering; disable TLS on the endpoint"
      - "The EventSource retry is too low; raise it"
      - "Response buffering (nginx proxy_buffering / gzip); disable it via proxy_buffering off or X-Accel-Buffering: no and turn off compression"
      - "The browser caps SSE at one event; add Cache-Control: no-store"
    answer: 2
    explanation: |
      curl shows raw bytes as they arrive, so a burst-at-the-end in the browser points to
      buffering in the chain — nginx's default proxy_buffering, or gzip filling a compression
      block. Fix with proxy_buffering off / X-Accel-Buffering: no, disable compression on the
      SSE route, and flush after each event.
    ref: "concepts.md#sse-in-practice-eventsource-limits-fetch-based-sse-and-buffering-pitfalls"

  - id: realtime-websockets-sse-077
    difficulty: advanced
    tags: [sse, cors, withcredentials, cross-origin]
    question: |
      A cross-origin `EventSource` created with `{ withCredentials: true }` must have the
      server respond with which combination for cookies to be sent?
    options:
      - "Access-Control-Allow-Origin: * only"
      - "Access-Control-Allow-Credentials: true plus an explicit (non-wildcard) Access-Control-Allow-Origin"
      - "No CORS headers, since SSE is exempt from CORS"
      - "Only a Set-Cookie header with SameSite=None"
    answer: 1
    explanation: |
      Credentialed CORS requires Access-Control-Allow-Credentials: true and an explicit origin
      echoed in Access-Control-Allow-Origin — the wildcard * is rejected with credentials. This
      is standard CORS applied to the SSE GET.
    ref: "concepts.md#sse-in-practice-eventsource-limits-fetch-based-sse-and-buffering-pitfalls"

  - id: realtime-websockets-sse-078
    difficulty: advanced
    tags: [websocket, close-handshake, ordering, shutdown]
    question: |
      During a graceful WebSocket close initiated by one side, what is the correct sequence
      before the TCP connection is torn down?
    options:
      - "Send Close, immediately close the TCP socket without waiting"
      - "Send a TCP FIN first, then a Close frame"
      - "Send Close, stop sending further data frames, wait for the peer's echoed Close, then close TCP (with a timeout to avoid hanging)"
      - "Send Close and keep sending data frames until the peer replies"
    answer: 2
    explanation: |
      The initiator sends its Close frame, stops sending data, waits for the peer to echo a
      Close, then closes TCP — mirroring FIN/FIN. A closing-handshake timeout forces the socket
      shut if the peer never replies, so you don't wait forever.
    ref: "concepts.md#websocket-close-handshake-and-close-codes"

  - id: realtime-websockets-sse-079
    difficulty: expert
    tags: [websocket, close-code, ranges, iana]
    question: |
      Your library needs a reusable custom close code and your application needs private,
      unregistered ones. Which ranges are appropriate?
    options:
      - "1000–1999 for the library; 2000–2999 for the application"
      - "3000–3999 (IANA-registered, for libraries/frameworks) for the library; 4000–4999 (private/application) for the app"
      - "0–999 for the library; 1000–2999 for the app"
      - "4000–4999 for the library; 3000–3999 for the app"
    answer: 1
    explanation: |
      Per RFC 6455 §7.4.2, 1000–2999 are reserved for the protocol/IANA, 3000–3999 are
      registered with IANA for libraries and frameworks, and 4000–4999 are private /
      application-defined and need no registration.
    ref: "concepts.md#websocket-close-handshake-and-close-codes"

  - id: realtime-websockets-sse-080
    difficulty: advanced
    tags: [websocket, load-balancer, idle-timeout, debugging]
    question: |
      A WebSocket app works locally but every connection drops after about 60 seconds once
      deployed behind a cloud L7 load balancer. What is the most likely cause and fix?
    options:
      - "The LB's idle timeout reaps connections with no traffic; send periodic heartbeats/pings within the timeout window"
      - "The 101 handshake expired; re-send Sec-WebSocket-Key periodically"
      - "TLS session tickets expire at 60s; disable session resumption"
      - "The browser caps WebSocket lifetime at 60s; reconnect on a timer"
    answer: 0
    explanation: |
      L7 LBs (and NAT/proxies) close connections idle past a timeout. A traffic-free WebSocket
      gets reaped near that limit; sending app-level heartbeats or protocol pings within the
      idle window keeps it alive. Browsers can't send protocol pings from JS, so app-level
      heartbeat messages are the usual answer.
    ref: "concepts.md#pingpong-keepalive-and-heartbeats"

  - id: realtime-websockets-sse-081
    difficulty: expert
    tags: [websocket, half-open, tcp-keepalive, liveness]
    question: |
      A remote peer's host is abruptly powered off (no FIN/RST sent). Which mechanism most
      reliably lets the application detect this "half-open" WebSocket in seconds?
    options:
      - "The OS immediately reports the socket as closed"
      - "Default TCP keepalive fires within a second"
      - "An application ping/pong (or heartbeat) with a short timeout, since TCP won't signal a vanished peer promptly (keepalive defaults to ~2 hours)"
      - "The masking key mismatch triggers an error"
    answer: 2
    explanation: |
      When a peer vanishes without a FIN/RST, TCP has nothing to report; the OS keepalive
      default is ~2 hours — far too slow. Only an application-layer ping/pong (or heartbeat)
      with a short timeout reveals a half-open connection in real time.
    ref: "concepts.md#pingpong-keepalive-and-heartbeats"

  - id: realtime-websockets-sse-082
    difficulty: expert
    tags: [scaling, fanout, delivery-semantics, ordering]
    question: |
      A chat system fans out over a Redis-pub/sub backplane. A user reconnects to a different
      node and complains about missed and occasionally duplicated messages. Which design
      change addresses both, and what does it require of consumers?
    options:
      - "Switch to fire-and-forget pub/sub; consumers need no changes"
      - "Pin every user to one node forever so reconnects never move"
      - "Persist to a durable log and replay by monotonic per-channel sequence id on reconnect (at-least-once); consumers must be idempotent to tolerate duplicates"
      - "Broadcast every message to every node and let clients filter; consumers dedupe by timestamp"
    answer: 2
    explanation: |
      Plain pub/sub is at-most-once, so a message published mid-reconnect is lost. Persisting
      to a durable log and replaying "everything after seq N" (the WebSocket analogue of SSE's
      Last-Event-ID) gives at-least-once delivery and ordering across reconnect — but
      at-least-once means duplicates, so consumers must be idempotent.
    ref: "concepts.md#scaling-stateful-real-time-connections"
