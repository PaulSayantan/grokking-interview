topic: "DNS Deep Dive"
domain: networking
topic_slug: dns-deep-dive
version: 1
questions:
- id: dns-deep-dive-001
  difficulty: beginner
  tags:
  - resolution-path
  - actors
  question: |
    In a full DNS lookup, which component actually walks the hierarchy
    (root → TLD → authoritative) on the client's behalf and caches what it learns?
  options:
  - The recursive resolver
  - The stub resolver in the OS
  - The root nameserver
  - The authoritative nameserver
  answer: 0
  explanation: |
    The recursive resolver (e.g. 8.8.8.8, an ISP resolver) does the legwork of
    chasing referrals and caches results. The stub resolver just forwards the
    question once and waits for the final answer.
  ref: concepts.md#the-resolution-path-stub-recursive-resolver-root-tld-authoritative

- id: dns-deep-dive-002
  difficulty: beginner
  tags:
  - stub
  - rd-bit
  question: |
    What does the stub resolver typically do when it needs to resolve a name?
  options:
  - It queries the root servers directly, then the TLD, then authoritative servers
  - It sets the Recursion Desired bit and forwards the whole question to a configured recursive resolver
  - It performs the iterative walk itself, following every root, TLD, and authoritative referral in turn
  - It answers directly from the local authoritative zone file it loads and hosts for the domain
  answer: 1
  explanation: |
    The stub resolver is deliberately simple: it sets RD=1 and sends the full
    question to its configured recursive resolver, then waits for the complete
    answer. It does not chase referrals itself.
  ref: concepts.md#the-resolution-path-stub-recursive-resolver-root-tld-authoritative

- id: dns-deep-dive-003
  difficulty: beginner
  tags:
  - root-servers
  question: |
    What do the root nameservers return when asked for the A record of
    www.example.com?
  options:
  - The final A record for www.example.com
  - A SERVFAIL error, since they don't recurse
  - A referral to the .com TLD nameservers
  - A CNAME pointing to example.com
  answer: 2
  explanation: |
    Root servers don't know individual host records. They answer iteratively with
    a referral to the appropriate TLD servers (here, the .com servers), which in
    turn refer down to the zone's authoritative servers.
  ref: concepts.md#the-resolution-path-stub-recursive-resolver-root-tld-authoritative

- id: dns-deep-dive-004
  difficulty: intermediate
  tags:
  - root-servers
  - anycast
  question: |
    There are 13 root server "letters" (a–m .root-servers.net). Which statement is
    most accurate about them?
  options:
  - There are exactly 13 physical machines, one for each letter, worldwide
  - Each letter is a single server in a different country, 13 total
  - There are 13 because DNS responses can hold at most 13 records
  - They are 13 identities, each backed by a large anycast fleet of servers
  answer: 3
  explanation: |
    The 13 root identities exist because of the old 512-byte UDP limit on the
    priming response, but each identity is served by many physically distributed
    servers via anycast routing — hundreds of instances globally.
  ref: concepts.md#the-resolution-path-stub-recursive-resolver-root-tld-authoritative

- id: dns-deep-dive-005
  difficulty: intermediate
  tags:
  - aa-bit
  - authoritative
  question: |
    A response has the AA (Authoritative Answer) bit set. What does this indicate?
  options:
  - The answering server is authoritative for the zone containing the queried name
  - The answer was served from the resolver's cache and may be stale or expired
  - The answer was cryptographically validated by the DNSSEC chain of trust
  - The response was truncated and the client should retry the query over TCP
  answer: 0
  explanation: |
    The AA bit means the responding server is authoritative for the queried name's
    zone (i.e., it holds the zone data directly), as opposed to a cached answer from
    a recursive resolver. DNSSEC validation is signalled by the AD bit; truncation
    by the TC bit.
  ref: concepts.md#the-resolution-path-stub-recursive-resolver-root-tld-authoritative

- id: dns-deep-dive-006
  difficulty: intermediate
  tags:
  - priming
  - root-hints
  question: |
    How does a freshly started recursive resolver with an empty cache know where the
    root servers are?
  options:
  - It broadcasts a discovery request on the local network and waits for a root server to reply
  - It uses a built-in root hints file (well-known root IPs) and may issue a priming query for NS .
  - It asks its configured TLD servers to return the current list of root server addresses
  - It downloads the current root server list from its domain registrar each time it boots
  answer: 1
  explanation: |
    Resolvers ship with a root hints file listing the root server addresses, and
    typically issue a priming query (NS .) to refresh the authoritative root NS set
    at startup.
  ref: concepts.md#the-resolution-path-stub-recursive-resolver-root-tld-authoritative

- id: dns-deep-dive-007
  difficulty: beginner
  tags:
  - recursive-vs-iterative
  question: |
    What is the key difference between a recursive and an iterative query?
  options:
  - Recursive queries always run over TCP for reliability, while iterative queries use UDP and never fall back to TCP
  - Recursive queries are always encrypted end to end, whereas iterative queries travel in plaintext over the wire
  - In a recursive query the queried server chases referrals and returns the final answer; in an iterative
    query the querying client follows referrals itself
  - Iterative queries can only ever return an NXDOMAIN error and never carry an actual answer record
  answer: 2
  explanation: |
    Recursive vs iterative describes who chases referrals. A recursive query asks the
    server to return the final answer (or error). An iterative query accepts a
    referral, leaving the client to continue the walk.
  ref: concepts.md#recursive-vs-iterative-queries

- id: dns-deep-dive-008
  difficulty: intermediate
  tags:
  - recursive-vs-iterative
  - root-tld
  question: |
    Why do root and TLD servers refuse to perform recursion?
  options:
  - Recursion is only defined for IPv6 lookups, so servers predating IPv6 cannot perform it
  - They lack the CPU headroom to run DNSSEC validation for every client on the Internet
  - Recursion requires a persistent TCP session, which root and TLD servers deliberately do not support
  - If they recursed for every client on the Internet they would be overwhelmed; they only answer iteratively
    with referrals
  answer: 3
  explanation: |
    Root and TLD servers answer only iteratively (referrals). Recursing on behalf of
    the entire Internet would be an impossible load, so recursion is the job of
    dedicated recursive resolvers.
  ref: concepts.md#recursive-vs-iterative-queries

- id: dns-deep-dive-009
  difficulty: intermediate
  tags:
  - recursive-vs-iterative
  - ra-bit
  question: |
    A single user's name lookup involves how many recursive vs iterative queries in
    the common case (cold cache)?
  options:
  - One recursive query (stub → recursor) driving many iterative queries (recursor → root/TLD/auth)
  - Many recursive queries from the stub, each resolved after a single iterative query upstream
  - Only iterative queries throughout, with the stub walking root, TLD, and authoritative servers
  - Only recursive queries throughout, with each server in the chain recursing on the stub's behalf
  answer: 0
  explanation: |
    The stub sends one recursive query to its resolver. The resolver internally issues
    a series of iterative queries to root, TLD, and authoritative servers to build the
    answer.
  ref: concepts.md#recursive-vs-iterative-queries

- id: dns-deep-dive-010
  difficulty: advanced
  tags:
  - recursive-vs-iterative
  - ra-bit
  question: |
    A resolver that offers recursion (RA bit set) receives a recursive query it can
    resolve. Which of the following is it NOT allowed to return?
  options:
  - The final answer
  - A referral to other nameservers
  - An error such as SERVFAIL or NXDOMAIN
  - A NODATA (NOERROR with empty answer) response
  answer: 1
  explanation: |
    When a server accepts a recursive query, it must return the answer or an error —
    never a referral. Referrals are only for iterative responses. NODATA is a valid
    final answer meaning the name exists but the type doesn't.
  ref: concepts.md#recursive-vs-iterative-queries

- id: dns-deep-dive-011
  difficulty: beginner
  tags:
  - record-types
  - a-aaaa
  question: |
    Which record type maps a hostname to an IPv6 address?
  options:
  - A
  - CNAME
  - AAAA
  - PTR
  answer: 2
  explanation: |
    A maps to IPv4 (32-bit); AAAA ("quad-A") maps to IPv6 (128-bit). CNAME is an
    alias to another name; PTR is the reverse (IP → name) record.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-012
  difficulty: beginner
  tags:
  - record-types
  - mx
  question: |
    In an MX record `10 mail.example.com.`, what does the number 10 represent, and how
    is it interpreted?
  options:
  - A weight, where a higher number attracts more mail traffic
  - The record's time-to-live value, given in minutes
  - The TCP port number the receiving SMTP server listens on
  - A preference; lower values are tried first (higher priority)
  answer: 3
  explanation: |
    MX preference is a priority where lower numbers are preferred. An MX with
    preference 10 is tried before one with preference 20.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-013
  difficulty: intermediate
  tags:
  - record-types
  - txt
  question: |
    Which of these is a typical legitimate use of a TXT record?
  options:
  - Publishing SPF/DKIM email authentication policies or domain-ownership verification tokens
  - Delegating authority for a subdomain to a different set of nameservers
  - Mapping a numeric IP address back to its canonical hostname
  - Specifying the network port, priority, and weight of a service
  answer: 0
  explanation: |
    TXT records carry arbitrary text and are widely used for SPF, DKIM, and
    domain-verification tokens. Delegation is NS; reverse mapping is PTR; service
    location is SRV.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-014
  difficulty: intermediate
  tags:
  - record-types
  - cname-rules
  question: |
    According to RFC 1034, what is a fundamental restriction on a name that has a
    CNAME record?
  options:
  - It may not be assigned a TTL below 3600 seconds
  - It may not coexist with other record types at the same name
  - It must always resolve to an IPv4 (A) address target
  - It can only appear in reverse (in-addr.arpa) zones
  answer: 1
  explanation: |
    A CNAME must be the only record type at its owner name — no other RR types may
    coexist with it. This is precisely why a CNAME can't sit at a zone apex, which
    must carry SOA and NS records.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-015
  difficulty: intermediate
  tags:
  - record-types
  - soa
  question: |
    Which field of the SOA record today governs how long negative answers
    (NXDOMAIN/NODATA) may be cached?
  options:
  - The refresh field
  - The serial field
  - The minimum field
  - The expire field
  answer: 2
  explanation: |
    Per RFC 2308, the SOA MINIMUM field (once a default record TTL) now defines the
    negative-caching TTL — capped by the SOA record's own TTL. Refresh/retry/expire
    govern secondary zone-transfer timing; serial detects zone changes.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-016
  difficulty: intermediate
  tags:
  - record-types
  - srv
  question: |
    An SRV record is written `_sip._tcp.example.com. 3600 IN SRV 10 60 5060 sipserver.example.com.`.
    Which statement about it is correct?
  options:
  - 5060 is the load-balancing weight and 60 is the target port
  - It maps a numeric IP address directly to the service name
  - SRV records are used by web browsers to find HTTP servers
  - 10 is the priority, 60 the weight, and 5060 the target port
  answer: 3
  explanation: |
    SRV format is `priority weight port target`. Lower priority wins; weight
    distributes load among equal priorities. Web (HTTP) historically ignored SRV;
    the modern equivalent for web is the HTTPS/SVCB record (RFC 9460).
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-017
  difficulty: intermediate
  tags:
  - record-types
  - ptr
  - reverse
  question: |
    Which statement about PTR (reverse) records is correct?
  options:
  - PTR records live under the in-addr.arpa (IPv4) or ip6.arpa (IPv6) tree and are managed independently
    of forward records
  - Creating a forward A record automatically creates the matching PTR record in the reverse zone
  - PTR records map a hostname forward to its corresponding IPv6 address in the ip6.arpa tree
  - PTR records exist solely to support DNSSEC chain-of-trust validation and nothing else
  answer: 0
  explanation: |
    Reverse DNS lives in the .in-addr.arpa / .ip6.arpa zones, which are separate from
    forward zones. Adding an A record does not create a PTR; reverse delegation is
    controlled by whoever owns the IP block.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-018
  difficulty: intermediate
  tags:
  - record-types
  - caa
  question: |
    What is the purpose of a CAA record, and who acts on it?
  options:
  - It tells browsers which TLS cipher suites are permitted for the domain; browsers enforce it at connect time
  - It specifies which Certificate Authorities may issue certificates for the domain; CAs check it at
    issuance time
  - It lists which recursive resolvers are permitted to cache the domain; those resolvers enforce it
  - It cryptographically authenticates the zone's records; validating resolvers enforce it at lookup
  answer: 1
  explanation: |
    CAA (RFC 8659) lets a domain declare which CAs are permitted to issue certs for
    it. Certificate Authorities are required to check CAA at issuance; browsers do not
    consult CAA.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-019
  difficulty: beginner
  tags:
  - ttl
  - caching
  question: |
    What does a resource record's TTL tell caches?
  options:
  - The maximum size in bytes the record may occupy in a single UDP packet
  - How many resolver hops the query may traverse before it is dropped
  - How many seconds the answer may be reused before it must be re-fetched
  - The priority of the record relative to others of the same type
  answer: 2
  explanation: |
    TTL (time-to-live) is the number of seconds a cache may reuse the answer. When it
    reaches zero the cache must re-query the authoritative source.
  ref: concepts.md#ttl-and-caching-layers

- id: dns-deep-dive-020
  difficulty: intermediate
  tags:
  - ttl
  - caching-layers
  question: |
    A recursive resolver cached an A record with TTL 3600 and now serves it to a
    client 1000 seconds later. What TTL does the client see, and why?
  options:
  - 3600, because TTL is fixed by the authoritative server and never changes
  - 0, because any cached record is considered expired
  - 60, because resolvers clamp all TTLs to 60 seconds
  - Approximately 2600, because caches decrement the TTL as time passes
  answer: 3
  explanation: |
    Caches count TTLs down. After 1000s of a 3600s TTL, roughly 2600s remain, and that
    decremented value is what the resolver hands the client — so the effective
    freshness is governed by the smallest remaining TTL on the path.
  ref: concepts.md#ttl-and-caching-layers

- id: dns-deep-dive-021
  difficulty: intermediate
  tags:
  - ttl
  - tradeoffs
  question: |
    What is the main trade-off of setting a very LOW TTL (e.g. 30 seconds) on your
    records?
  options:
  - Faster change propagation and failover, but more query load and resolver round-trips
  - Slower change propagation but far less query load, since caches hold answers longer
  - DNSSEC signatures become invalid because the RRSIG validity window is tied to the TTL
  - The records can no longer be cached at all by browsers, forcing a lookup on every request
  answer: 0
  explanation: |
    Low TTLs mean caches expire quickly, so changes/failover take effect fast — at the
    cost of more frequent queries hitting the authoritative servers and slightly more
    latency for clients on cache misses.
  ref: concepts.md#ttl-and-caching-layers

- id: dns-deep-dive-022
  difficulty: advanced
  tags:
  - ttl
  - migration
  - gotcha
  question: |
    You plan to migrate a service and want fast cutover. Your record currently has
    TTL 86400 and was last changed a month ago. You lower the TTL to 60 one hour
    before the migration. What actually happens?
  options:
  - All resolvers immediately honor the 60s TTL because the change is instant
  - Resolvers that cached the old record before your change may keep serving it (with the old 86400 TTL)
    for up to a day, so the low TTL only helps those that re-fetch after it
  - The migration is impossible until the old TTL naturally reaches zero on the authoritative server
  - The 60s TTL retroactively shortens all previously cached copies
  answer: 1
  explanation: |
    Cached copies keep the TTL they were fetched with. To make a low TTL effective at
    cutover you must publish it at least one OLD-TTL window ahead, so every cache has
    re-fetched the record with the new low TTL before you migrate.
  ref: concepts.md#ttl-and-caching-layers

- id: dns-deep-dive-023
  difficulty: beginner
  tags:
  - caching-layers
  question: |
    Which sequence correctly lists DNS caching layers from client-side to source of
    truth?
  options:
  - Authoritative → recursive resolver → OS stub → browser
  - Root → TLD → authoritative → browser
  - Browser cache → OS stub cache → recursive resolver cache → authoritative (source of truth)
  - Recursive resolver → browser → OS stub → authoritative
  answer: 2
  explanation: |
    A query may be answered by the browser's in-process cache, then the OS stub cache,
    then the recursive resolver's cache, before finally reaching the authoritative
    server that owns the data.
  ref: concepts.md#ttl-and-caching-layers

- id: dns-deep-dive-024
  difficulty: intermediate
  tags:
  - negative-caching
  - nxdomain-nodata
  question: |
    What is the difference between NXDOMAIN and NODATA responses?
  options:
  - NXDOMAIN means the authoritative server is down; NODATA means the query timed out upstream
  - They are two interchangeable names for the very same NOERROR response condition
  - NXDOMAIN applies only to AAAA/IPv6 lookups, while NODATA applies only to A/IPv4 lookups
  - NXDOMAIN means the name does not exist at all; NODATA (NOERROR with empty answer) means the name exists
    but has no record of the requested type
  answer: 3
  explanation: |
    NXDOMAIN (rcode 3) says the name itself doesn't exist. NODATA is NOERROR (rcode 0)
    with an empty answer section plus an SOA in authority — the name exists but not for
    that record type (e.g., an AAAA query on an IPv4-only host).
  ref: concepts.md#negative-caching

- id: dns-deep-dive-025
  difficulty: intermediate
  tags:
  - negative-caching
  - rfc-2308
  question: |
    Per RFC 2308, how long should a negative (NXDOMAIN/NODATA) answer be cached?
  options:
  - For the minimum of the SOA MINIMUM field and the SOA record's own TTL
  - For a fixed 300 seconds regardless of the zone's configured SOA values
  - Indefinitely, until the resolver process is restarted and its cache is flushed
  - For the same duration as the positive TTL of the A record at the zone apex
  answer: 0
  explanation: |
    RFC 2308 sets the negative cache duration to the lesser of the SOA MINIMUM value
    and the SOA's TTL. That's why a high SOA minimum can keep a newly-created name
    "invisible" for a while after a prior negative answer was cached.
  ref: concepts.md#negative-caching

- id: dns-deep-dive-026
  difficulty: advanced
  tags:
  - negative-caching
  - gotcha
  question: |
    You just created a new AAAA record, but some clients still can't resolve it for
    several minutes despite a low TTL on the record itself. What is the most likely
    cause?
  options:
  - The AAAA record type is not supported by most recursive resolvers and is silently dropped
  - An earlier NODATA/NXDOMAIN answer for that name was negatively cached for the SOA minimum window
  - IPv6 records always take a mandatory 24-hour activation window to become globally resolvable
  - The authoritative server rejected the record because publishing AAAA data requires DNSSEC signing
  answer: 1
  explanation: |
    Before the record existed, resolvers may have cached the negative answer for the
    SOA-minimum duration. The new record's own TTL doesn't shorten that already-cached
    negative entry — you wait for it to expire.
  ref: concepts.md#negative-caching

- id: dns-deep-dive-027
  difficulty: beginner
  tags:
  - transport
  - udp-tcp
  question: |
    Which transport and port does classic DNS use by default, and what is the fallback?
  options:
  - TCP port 53 by default, with UDP as fallback
  - UDP port 853 by default, with HTTPS as fallback
  - UDP port 53 by default, with TCP port 53 as a mandatory fallback
  - TCP port 443 by default, with UDP port 53 as fallback
  answer: 2
  explanation: |
    DNS uses UDP:53 by default for speed. TCP:53 is a mandatory fallback (RFC 7766),
    used for truncated responses, zone transfers, and large/DNSSEC answers. Port 853
    is DoT; 443 is DoH.
  ref: concepts.md#dns-over-udp53-tcp-fallback-and-message-size

- id: dns-deep-dive-028
  difficulty: intermediate
  tags:
  - transport
  - tc-bit
  question: |
    A client receives a DNS response over UDP with the TC (Truncated) bit set. What
    should it do?
  options:
  - Discard the response and give up
  - Retry over UDP with a smaller buffer
  - Treat the partial answer as authoritative
  - Retry the same query over TCP:53
  answer: 3
  explanation: |
    The TC bit signals the response didn't fit the UDP payload. The client should
    retry over TCP:53, where message length is prefixed and large responses fit.
  ref: concepts.md#dns-over-udp53-tcp-fallback-and-message-size

- id: dns-deep-dive-029
  difficulty: intermediate
  tags:
  - transport
  - edns
  - message-size
  question: |
    What problem does EDNS(0) (RFC 6891) solve for DNS over UDP?
  options:
  - It lets a client advertise a larger UDP payload size (e.g. 1232 bytes), reducing the need to fall
    back to TCP
  - It encrypts DNS queries end to end between the stub and the authoritative server
  - It compresses AXFR/IXFR zone transfers so large zones move in fewer TCP segments
  - It replaces UDP with QUIC for all DNS traffic, mandating encrypted streams everywhere
  answer: 0
  explanation: |
    Original DNS capped UDP payloads at 512 bytes. EDNS(0) adds an OPT pseudo-record
    so the client can advertise a bigger buffer (1232 is the modern recommended
    default), cutting down TCP fallback while avoiding IP fragmentation.
  ref: concepts.md#dns-over-udp53-tcp-fallback-and-message-size

- id: dns-deep-dive-030
  difficulty: intermediate
  tags:
  - transport
  - zone-transfer
  question: |
    Which DNS operation always uses TCP rather than UDP?
  options:
  - A simple A record lookup for a single hostname from a stub resolver
  - A zone transfer (AXFR/IXFR) between primary and secondary servers
  - A PTR (reverse) lookup for an address in the in-addr.arpa tree
  - An NS referral handed back by a TLD server during the iterative walk
  answer: 1
  explanation: |
    Zone transfers move an entire zone (potentially large and requiring reliability),
    so AXFR/IXFR use TCP. Ordinary lookups start on UDP and only fall back to TCP when
    truncated.
  ref: concepts.md#dns-over-udp53-tcp-fallback-and-message-size

- id: dns-deep-dive-031
  difficulty: advanced
  tags:
  - transport
  - edns
  - fragmentation
  question: |
    Why do modern recommendations favor an EDNS UDP buffer size around 1232 bytes
    rather than 4096?
  options:
  - 1232 is the absolute maximum size any DNS message may ever reach on the wire
  - 4096 is not a valid EDNS buffer value and is rejected by RFC 6891 parsers
  - Smaller advertised buffers reduce the chance of IP fragmentation (and the reliability/security problems
    it brings), triggering clean TCP fallback instead
  - Resolvers are unable to parse any UDP response larger than 1232 bytes
  answer: 2
  explanation: |
    Large UDP responses can get IP-fragmented, which is unreliable and a security risk.
    Advertising ~1232 bytes keeps responses within a safe path MTU, so oversize answers
    cleanly truncate and retry over TCP rather than fragment.
  ref: concepts.md#dns-over-udp53-tcp-fallback-and-message-size

- id: dns-deep-dive-032
  difficulty: beginner
  tags:
  - load-balancing
  - round-robin
  question: |
    What is "round-robin DNS"?
  options:
  - A resolver strategy that queries the 13 root-server letters in a rotating order
  - A DNSSEC key-rollover scheme that alternates the KSK and ZSK on a fixed schedule
  - A way to compress a single large response so it spans several ordered UDP packets
  - Returning multiple A/AAAA records so clients/resolvers rotate among several IPs, spreading load crudely
  answer: 3
  explanation: |
    Round-robin DNS returns several address records; clients rotate through them,
    giving crude load spreading. It has no health awareness and caching/ordering can
    skew the actual distribution.
  ref: concepts.md#dns-based-load-balancing-failover-and-geodns

- id: dns-deep-dive-033
  difficulty: intermediate
  tags:
  - load-balancing
  - failover
  - ttl
  question: |
    Why is DNS-based failover inherently slower than an in-band load balancer removing
    a dead backend?
  options:
  - Clients keep using cached answers until the record's TTL expires, so a dead endpoint may still be
    handed out until caches refresh
  - DNS servers are physically farther away, so each failover query adds propagation latency
  - DNS cannot return more than one address record, so it can never list a standby endpoint
  - Failover records must always be resolved over TCP:53, which adds a handshake to every query
  answer: 0
  explanation: |
    DNS has no cache-invalidation mechanism. Even after you stop returning a dead
    endpoint, resolvers and clients keep serving the cached answer until its TTL
    elapses — hence low TTLs (30–60s) on failover records, and still slower than an LB.
  ref: concepts.md#dns-based-load-balancing-failover-and-geodns

- id: dns-deep-dive-034
  difficulty: advanced
  tags:
  - geodns
  - ecs
  - gotcha
  question: |
    A GeoDNS system maps users to their nearest region based on the query's source IP.
    A user configured to use a public resolver in another country gets routed to that
    distant region. What is the underlying cause and the standard mitigation?
  options:
  - The user's browser DNS cache is stale from an earlier region; clearing it corrects the routing
  - GeoDNS sees the recursive resolver's IP, not the end user's; EDNS Client Subnet (RFC 7871) forwards
    a truncated client subnet to improve accuracy
  - GeoDNS requires DNSSEC validation to geolocate, and the user has disabled it on their resolver
  - The record's TTL was set too high, so the wrong region's answer was cached and kept being served
  answer: 1
  explanation: |
    Authoritative servers normally see the resolver's source IP, not the user's. If
    that resolver is far away, geo-mapping is wrong. EDNS Client Subnet (RFC 7871)
    passes a truncated client subnet so the authoritative server can map more
    accurately — at a privacy cost.
  ref: concepts.md#dns-based-load-balancing-failover-and-geodns

- id: dns-deep-dive-035
  difficulty: intermediate
  tags:
  - load-balancing
  - limitations
  question: |
    Which limitation makes DNS best suited for coarse regional steering rather than
    fine-grained per-request load balancing?
  options:
  - DNS responses can carry only one address record, so a single query can never spread load
  - DNS cannot resolve IPv6 (AAAA) targets, restricting balancing to a subset of backends
  - DNS has no real-time server-load feedback and answers are cached for the TTL, so it can't react per-request
  - DNS load balancing requires a fresh TCP:53 connection for every single client query
  answer: 2
  explanation: |
    DNS doesn't know backend load in real time and its answers are cached, so it can't
    make per-request decisions. It's good for coarse regional/weighted steering, with a
    real L4/L7 load balancer doing fine-grained distribution inside each region.
  ref: concepts.md#dns-based-load-balancing-failover-and-geodns

- id: dns-deep-dive-036
  difficulty: intermediate
  tags:
  - cname-apex
  - restriction
  question: |
    Why can't you put a CNAME record at a zone apex (e.g. example.com with no host
    label)?
  options:
  - Apex records must be IPv6-only, and CNAME targets can only resolve to IPv4 addresses
  - CNAMEs are only permitted in reverse (in-addr.arpa) zones, never in forward zones
  - The registrar charges an extra fee to enable CNAME records at the zone apex
  - The apex must carry SOA and NS records, and a CNAME cannot coexist with other record types at the
    same name
  answer: 3
  explanation: |
    The zone apex must hold SOA and NS records that define the zone. Since RFC 1034
    forbids a CNAME from coexisting with any other record type at the same name, a
    CNAME at the apex is illegal.
  ref: concepts.md#the-cname-at-apex-problem

- id: dns-deep-dive-037
  difficulty: intermediate
  tags:
  - cname-apex
  - alias
  question: |
    How do providers like Route 53, Cloudflare, and NS1 let you effectively "point the
    apex at a CDN hostname" despite the CNAME-at-apex restriction?
  options:
  - They use ALIAS/ANAME / CNAME-flattening pseudo-records that resolve the target's A/AAAA at query time
    and return them as apex A/AAAA records
  - They allow a real standard CNAME at the apex as an approved RFC 1034 extension that overrides the coexistence rule
  - They require you to delete the zone's SOA record so a standard CNAME can legally sit at the apex
  - They convert the apex into a reverse-DNS (in-addr.arpa) zone where CNAME records are permitted at the top
  answer: 0
  explanation: |
    ALIAS/ANAME (or CNAME flattening) is a provider-side synthesis: the authoritative
    server resolves the target's addresses at query time and returns them as ordinary
    A/AAAA records at the apex. It is not a standard record type.
  ref: concepts.md#the-cname-at-apex-problem

- id: dns-deep-dive-038
  difficulty: advanced
  tags:
  - cname-apex
  - svcb-https
  question: |
    Which standards-track record type is the emerging answer for aliasing and service
    binding (including at the apex) for web traffic?
  options:
  - The SRV record (RFC 2782)
  - The HTTPS/SVCB record (RFC 9460)
  - The CAA record (RFC 8659)
  - The NAPTR record
  answer: 1
  explanation: |
    SVCB and its HTTPS variant (RFC 9460) can live at the apex, carry an AliasMode
    target, and include ALPN/port/ECH hints — the standards-track successor to
    provider-specific ALIAS/ANAME hacks for the web.
  ref: concepts.md#the-cname-at-apex-problem

- id: dns-deep-dive-039
  difficulty: beginner
  tags:
  - dnssec
  - purpose
  question: |
    What security property does DNSSEC provide?
  options:
  - Confidentiality — it encrypts every DNS query and answer end to end between the stub and the authoritative server
  - Rate limiting of malicious clients by throttling floods of queries from a single source address at the resolver
  - Origin authentication and integrity of DNS answers — not encryption
  - Anonymization of the client's IP address by rewriting the query's source before it reaches upstream servers
  answer: 2
  explanation: |
    DNSSEC (RFC 4033–4035) cryptographically signs records so resolvers can verify
    answers are authentic and unmodified. It does NOT encrypt; confidentiality is the
    job of DoT/DoH.
  ref: concepts.md#dnssec-brief

- id: dns-deep-dive-040
  difficulty: advanced
  tags:
  - dnssec
  - chain-of-trust
  question: |
    In DNSSEC, what role does the DS (Delegation Signer) record play?
  options:
  - It encrypts the zone's records with the validating resolver's public key so only that resolver can read them
  - It sits in the child zone and directly signs each individual RRset the authoritative server returns
  - It stores the zone's negative-caching TTL, telling resolvers how long NXDOMAIN answers may be held
  - It sits in the PARENT zone and hashes the child zone's key, linking the chain of trust from parent
    to child
  answer: 3
  explanation: |
    The DS record lives in the parent zone and is a hash of the child's DNSKEY, extending
    the chain of trust downward. RRSIG signs RRsets; DNSKEY publishes the keys; the root
    key is the trust anchor.
  ref: concepts.md#dnssec-brief

- id: dns-deep-dive-041
  difficulty: advanced
  tags:
  - dnssec
  - nsec
  question: |
    How does DNSSEC provide authenticated proof that a name does NOT exist, and why is
    NSEC3 sometimes preferred over NSEC?
  options:
  - NSEC/NSEC3 records authenticate non-existence; NSEC3 hashes names to resist zone enumeration (walking)
    that plain NSEC allows
  - It returns a plain unsigned NXDOMAIN that the resolver trusts on faith; NSEC3 is merely a faster-to-compute variant
  - It relies on the AD bit alone to assert the name is absent; NSEC3 additionally encrypts that denial response
  - It relies on the SOA minimum field to prove non-existence; NSEC3 simply shortens that minimum value
  answer: 0
  explanation: |
    NSEC/NSEC3 records provide signed proof of non-existence. Plain NSEC lets an attacker
    "walk" the zone by following the chain of names; NSEC3 stores hashed names to make
    zone enumeration much harder.
  ref: concepts.md#dnssec-brief

- id: dns-deep-dive-042
  difficulty: intermediate
  tags:
  - dnssec
  - ad-bit
  question: |
    When a validating resolver successfully verifies the DNSSEC chain for an answer,
    what does it set, and what happens on a bad signature?
  options:
  - It sets the TC (Truncated) bit; a bad signature makes the resolver return NXDOMAIN to the client
  - It sets the AD (Authenticated Data) bit; a bad signature yields SERVFAIL
  - It sets the AA (Authoritative Answer) bit; a bad signature is silently dropped and the answer served anyway
  - It sets the RD (Recursion Desired) bit; a bad signature makes the resolver return a downward referral
  answer: 1
  explanation: |
    A validating resolver sets the AD bit when the chain of trust verifies. If validation
    fails (bad/missing signatures), it returns SERVFAIL rather than a potentially forged
    answer.
  ref: concepts.md#dnssec-brief

- id: dns-deep-dive-043
  difficulty: beginner
  tags:
  - privacy
  - doh-dot
  question: |
    What do DoT and DoH primarily add to DNS?
  options:
  - Load balancing that spreads a client's queries evenly across a pool of recursive resolvers
  - Cryptographic signing of authoritative zone data so resolvers can verify each answer's integrity
  - Confidentiality/encryption of queries between the stub and the recursive resolver
  - Automatic failover that reroutes lookups to a backup TLD when the primary one is unreachable
  answer: 2
  explanation: |
    DNS over TLS (RFC 7858) and DNS over HTTPS (RFC 8484) encrypt the stub→resolver hop,
    protecting queries from on-path observers. That's confidentiality — orthogonal to
    DNSSEC's integrity/authentication.
  ref: concepts.md#dns-privacy-doh-and-dot

- id: dns-deep-dive-044
  difficulty: intermediate
  tags:
  - privacy
  - doh-dot
  - ports
  question: |
    What is the main operational difference between DoT and DoH?
  options:
  - DoT encrypts the query while DoH sends it in plaintext and only encrypts the response coming back
  - DoH works only over IPv6, whereas DoT can run on both IPv4 and IPv6 networks
  - DoT additionally signs each record with DNSSEC for integrity, while DoH provides no such signing
  - DoT uses a dedicated port 853 (easy to identify/block), while DoH rides HTTPS on port 443 and blends
    in with normal web traffic
  answer: 3
  explanation: |
    DoT uses its own port 853, so network admins can readily identify and manage it. DoH
    runs over HTTPS on 443, making it indistinguishable from ordinary web traffic and
    therefore hard to block — great for privacy, controversial for network operators.
  ref: concepts.md#dns-privacy-doh-and-dot

- id: dns-deep-dive-045
  difficulty: advanced
  tags:
  - privacy
  - doh
  - limitations
  question: |
    Which statement about the privacy limits of DoT/DoH is correct?
  options:
  - They encrypt the stub→resolver hop but the resolver operator still sees your queries; TLS SNI and
    destination IP can still leak the site to on-path observers unless ECH is used
  - They hide which sites you visit even from the resolver operator, who sees only opaque encrypted blobs
  - They encrypt the resolver→authoritative queries as well by default, covering the entire lookup chain
  - They make DNSSEC unnecessary because the transport encryption also cryptographically authenticates the data
  answer: 0
  explanation: |
    DoT/DoH protect the query in transit to the resolver, but you still trust the resolver
    operator, and TLS SNI plus the destination IP can reveal the site to on-path observers
    unless Encrypted Client Hello is used. They also don't cover the resolver→authoritative
    hop and don't replace DNSSEC.
  ref: concepts.md#dns-privacy-doh-and-dot

- id: dns-deep-dive-046
  difficulty: beginner
  tags:
  - propagation
  - misconception
  question: |
    An engineer says "my DNS change hasn't propagated to all servers yet." Why is
    "propagation" a misleading way to describe what's happening?
  options:
  - Because DNS changes never take effect until an operator manually pushes them out to every resolver worldwide
  - Because authoritative changes are effectively instant; the delay is old cached copies expiring from
    resolvers as their TTL counts down, not updates flooding outward
  - Because only the root servers can approve a change, and that global approval step takes a day or two to clear
  - Because every recursive resolver must re-sign the updated records with its own key before it may serve them
  answer: 1
  explanation: |
    There is no push/propagation in DNS. The authoritative answer changes immediately;
    what you wait for is stale cached copies expiring across resolvers as their TTL
    elapses. There's no mechanism to force-flush caches worldwide.
  ref: concepts.md#the-dns-propagation-misconception

- id: dns-deep-dive-047
  difficulty: intermediate
  tags:
  - propagation
  - ttl
  question: |
    Given the propagation misconception, roughly what determines how long a DNS change
    takes to be seen everywhere?
  options:
  - The physical distance between resolvers and the authoritative server, which adds propagation latency per hop
  - A fixed 24–48 hour convergence window that ICANN mandates for all record changes across every zone
  - Approximately the record's TTL (plus resolvers that clamp TTLs and any negative-cache windows for
    new names)
  - The number of root servers currently online, since fewer live roots slow the spread of any change
  answer: 2
  explanation: |
    The delay is essentially the TTL of the old cached record, extended by resolvers that
    cap/clamp TTLs and by negative-caching windows for newly created names. Lowering the
    TTL ahead of time shortens it.
  ref: concepts.md#the-dns-propagation-misconception

- id: dns-deep-dive-048
  difficulty: intermediate
  tags:
  - propagation
  - secondaries
  question: |
    When you update a primary (master) zone, how do secondary authoritative servers
    typically get the change, and how fast?
  options:
  - They never update at all; only the primary is authoritative and secondaries just relay queries to it
  - They poll the root servers once an hour and pull down any zones that have changed since the last check
  - The registrar pushes the full zone out to every secondary once per day on a fixed schedule
  - Via NOTIFY and IXFR/AXFR zone transfers, usually within seconds — so authoritative data is consistent
    quickly; the visible delay is resolver caching
  answer: 3
  explanation: |
    The primary sends NOTIFY messages and secondaries pull the delta via IXFR (or full
    AXFR), usually within seconds. So authoritative servers converge quickly; the
    user-visible "propagation" delay is downstream resolver caching, not the transfer.
  ref: concepts.md#the-dns-propagation-misconception

- id: dns-deep-dive-049
  difficulty: advanced
  tags:
  - wire-format
  - header
  question: |
    In the 12-byte DNS header, which set of fields tells the parser how many entries to
    expect in each of the four message sections?
  options:
  - QDCOUNT, ANCOUNT, NSCOUNT, ARCOUNT
  - ID, QR, Opcode, RCODE
  - AA, TC, RD, RA
  - RDLENGTH for each of the four sections
  answer: 0
  explanation: |
    The four 16-bit counts QDCOUNT/ANCOUNT/NSCOUNT/ARCOUNT give the number of entries in
    the Question, Answer, Authority, and Additional sections respectively. RDLENGTH is a
    per-RR field, not a section count; ID/flags/RCODE carry other header state.
  ref: concepts.md#dns-message-format-on-the-wire

- id: dns-deep-dive-050
  difficulty: expert
  tags:
  - wire-format
  - name-encoding
  question: |
    How is the name `www.example.com` encoded in the question section, and how is the
    root represented?
  options:
  - As the literal ASCII string "www.example.com" including the dots, terminated by a single NUL byte, with the root being an empty string
  - As a fixed 4-byte hash of the full name, with the root encoded as the reserved hash value 0x00000000
  - As a sequence of length-prefixed labels `3www7example3com` terminated by a zero-length
    octet (0x00), which alone represents the root
  - As dot-separated ASCII labels with each separating dot encoded as the byte 0xFF and the root written as a lone 0xFF
  answer: 2
  explanation: |
    DNS names are sequences of length-prefixed labels ending in a zero-length octet. So
    `www.example.com` becomes 3 w w w 7 e x a m p l e 3 c o m 0. The lone terminating 0x00
    is the root label; a bare root name (".") is just that single zero octet.
  ref: concepts.md#dns-message-format-on-the-wire

- id: dns-deep-dive-051
  difficulty: advanced
  tags:
  - wire-format
  - transport
  question: |
    Why do DNS messages over TCP, DoT, and DoQ carry a 2-octet length prefix that UDP
    messages do not?
  options:
  - TCP mandates that all application-layer data begin with a 2-byte checksum, and DNS reuses that field for framing
  - The 2-octet prefix carries the negotiated EDNS UDP buffer size, which stream transports still require per message
  - It repeats the 16-bit transaction ID a second time so a reliable stream can detect a corrupted header
  - A byte stream has no inherent message boundaries, so the length prefix delimits each
    message; a UDP datagram is self-delimiting
  answer: 3
  explanation: |
    UDP delivers one datagram per message, so its boundary is implicit. TCP/TLS/QUIC
    streams are byte streams with no framing, so DNS prepends a 2-octet length so the
    receiver knows where each message ends.
  ref: concepts.md#dns-message-format-on-the-wire

- id: dns-deep-dive-052
  difficulty: expert
  tags:
  - name-compression
  question: |
    In DNS name compression (RFC 1035 §4.1.4), how is a compression pointer recognized and
    what does it reference?
  options:
  - A label whose first byte is 0x00 acts as the pointer, and the two bytes after it name the message the target lives in
  - A 4-octet field holding an absolute memory address into the resolver's in-process cache where the name is stored
  - A 2-octet field with the two high bits set (0xC0 mask); the low 14 bits are an offset
    from the start of the message to an earlier name
  - Any label whose length byte exceeds 63 octets, which parsers treat as a forward reference to a later name
  answer: 2
  explanation: |
    A pointer is two octets with the top two bits set (0xC0). The remaining 14 bits are an
    offset, measured from the start of the DNS message, to a previously-encoded name. The
    two high bits distinguish it from a normal label length (0-63).
  ref: concepts.md#name-compression

- id: dns-deep-dive-053
  difficulty: expert
  tags:
  - name-compression
  - edns
  question: |
    Which statement about DNS name compression is correct?
  options:
  - The OPT (EDNS) pseudo-record's owner name is compressed to save space
  - Compression pointers may reference names in a later part of the message (forward
    references) for efficiency
  - Compression may only point backward within the same message, and some RDATA names
    must not be compressed so type-agnostic parsers stay correct
  - Compression is mandatory for every repeated label, and a message that leaves any duplicate name uncompressed is rejected as malformed
  answer: 2
  explanation: |
    Pointers only reference earlier offsets in the same message. The OPT record's owner is
    always the root (uncompressed), and names inside certain RDATA must not be compressed
    so a parser that doesn't know the RR type can still skip it correctly. Compression is
    optional.
  ref: concepts.md#name-compression

- id: dns-deep-dive-054
  difficulty: advanced
  tags:
  - rcode
  - refused
  question: |
    A recursive resolver query to an authoritative server returns RCODE 5 (REFUSED). What
    is the most likely meaning?
  options:
  - The queried name definitively does not exist anywhere in the zone and no record will ever be returned for it
  - The server hit an internal failure while building the answer and the resolver should retry the query shortly
  - The server declined for policy reasons — e.g. it doesn't serve that zone or an ACL
    blocked the query
  - The response was too large to fit the UDP buffer, was truncated, and must be retried over TCP:53
  answer: 2
  explanation: |
    REFUSED (5) is a policy refusal: the server won't answer, commonly because it isn't
    authoritative/recursive for the query or an ACL denied it. NXDOMAIN (3) is
    non-existence; SERVFAIL (2) is failure; truncation is signalled by the TC bit.
  ref: concepts.md#response-codes-rcodes-and-extended-dns-errors

- id: dns-deep-dive-055
  difficulty: expert
  tags:
  - servfail
  - ede
  - debugging
  question: |
    Users intermittently get SERVFAIL for a DNSSEC-signed domain. Which is NOT a plausible
    root cause to investigate?
  options:
  - An expired RRSIG or a DS at the registrar that doesn't match the current DNSKEY
  - A large signed response being dropped by a middlebox with no working TCP fallback
  - The resolver rejecting the answer because the CAA record names the wrong CA
  - Authoritative servers timing out or being rate-limited
  answer: 2
  explanation: |
    CAA is consulted by certificate authorities at issuance, never by resolvers during
    lookups, so it cannot cause SERVFAIL. Expired signatures, a broken DS chain,
    EDNS/fragmentation blackholes, and auth timeouts are all classic SERVFAIL causes —
    an Extended DNS Error (RFC 8914) code usually pinpoints which.
  ref: concepts.md#response-codes-rcodes-and-extended-dns-errors

- id: dns-deep-dive-056
  difficulty: advanced
  tags:
  - ede
  question: |
    What do Extended DNS Errors (EDE, RFC 8914) add over the classic 4-bit RCODE?
  options:
  - They swap the 4-bit SERVFAIL rcode for a three-digit HTTP-style status number carried in the DNS header, so DNS failures read exactly like web-server error codes
  - They encrypt the failure reason with the resolver's TLS key so that only the originating client, and no on-path observer, can decrypt and read why the lookup failed
  - They force the resolver to automatically retry the failed query over a different transport, first DoT on port 853 and then DoH on 443, before surfacing any error
  - They provide a machine-readable reason (e.g. DNSSEC Bogus, Signature Expired, Blocked,
    Stale Answer) as an EDNS option, without changing the RCODE
  answer: 3
  explanation: |
    EDE is an informational EDNS option carrying a code and optional text explaining why a
    (usually SERVFAIL/REFUSED) response occurred. It does not alter the RCODE; it turns an
    opaque failure into an actionable reason for operators.
  ref: concepts.md#response-codes-rcodes-and-extended-dns-errors

- id: dns-deep-dive-057
  difficulty: expert
  tags:
  - qname-minimization
  - privacy
  question: |
    With QNAME minimization (RFC 9156) enabled, what does a resolver send to the root
    servers when a client asks for `A shop.eu.example.com`?
  options:
  - The full name `shop.eu.example.com` with QTYPE A, since the root is trusted to strip the extra labels itself
  - "`example.com` with QTYPE NS, revealing the second-level domain so the root can pre-fetch the delegation"
  - Nothing at all, because QNAME minimization skips the root and starts the walk at the cached .com servers
  - Just `com` (typically with QTYPE A/AAAA), because the root only needs one label to
    return the .com referral
  answer: 3
  explanation: |
    QNAME minimization sends each server only one more label than known. Querying the root,
    the resolver reveals only `com`; it uses A/AAAA (not NS) for the probe to avoid servers
    that misbehave on non-apex NS queries. The root never learns the full name.
  ref: concepts.md#qname-minimization

- id: dns-deep-dive-058
  difficulty: advanced
  tags:
  - qname-minimization
  - privacy
  question: |
    QNAME minimization primarily improves privacy on which segment, and how does it relate
    to DoH/DoT?
  options:
  - The stub→resolver hop, hiding queries from the local network and making DoH/DoT completely redundant for a client that already runs it
  - It encrypts the resolver→authoritative hop with a TLS tunnel exactly the way DoT encrypts the stub→resolver hop, giving end-to-end confidentiality
  - The resolver→authoritative hops (limiting what root/TLD servers learn); it complements
    DoH/DoT, which instead encrypt the stub→resolver hop
  - It only affects negative caching, not privacy
  answer: 2
  explanation: |
    QNAME minimization limits how much of the name each upstream authoritative server sees
    — a recursive-side privacy win. DoH/DoT encrypt the stub-to-resolver hop. They address
    different exposures and are complementary.
  ref: concepts.md#qname-minimization

- id: dns-deep-dive-059
  difficulty: expert
  tags:
  - dns-cookies
  - security
  question: |
    Which class of attacker do DNS Cookies (RFC 7873/9018) primarily defend against, and
    what is their key limitation?
  options:
  - On-path attackers who can already read the wire traffic; cookies fail entirely against the far cheaper off-path spoofing that most poisoning relies on
  - Only DNSSEC-validation failures, acting as a lightweight replacement for RRSIG chain checks when a zone is unsigned or its keys have expired
  - Off-path spoofers and reflection/amplification abuse (a forged request can't echo a
    valid Server Cookie); they do NOT stop an on-path attacker who can observe the cookie
  - Zone-transfer thieves, replacing TSIG for AXFR authentication
  answer: 2
  explanation: |
    Cookies give a cheap proof that a client can receive replies at its source address,
    defeating off-path spoofers and blunting amplification (no valid cookie → BADCOOKIE or
    rate-limited). An on-path attacker who sees the cookie is unaffected; that needs
    DoT/DoQ or DNSSEC.
  ref: concepts.md#dns-cookies

- id: dns-deep-dive-060
  difficulty: advanced
  tags:
  - dns-cookies
  - edns
  question: |
    Where do DNS Cookies live on the wire, and what does a mismatched/absent Server Cookie
    trigger?
  options:
  - In a reserved field of the 12-byte DNS header flags; a mismatched or absent cookie sets the TC bit so the client retries the whole query over TCP:53
  - In a dedicated COOKIE resource record placed in the Answer section; a mismatch makes the server return NXDOMAIN so the resolver treats the name as non-existent
  - In the TLS session ticket negotiated for the connection; a mismatch aborts the TLS session and forces a fresh handshake before any query is answered
  - In an EDNS OPT option (code 10); a bad or missing cookie can yield BADCOOKIE (RCODE 23)
    or rate-limited handling
  answer: 3
  explanation: |
    DNS Cookies are an EDNS0 OPT option (code 10) carrying an 8-byte Client Cookie and an
    8-32 byte Server Cookie. A missing/invalid cookie can prompt BADCOOKIE (extended RCODE
    23) so the client re-queries with the correct cookie, or the server rate-limits it.
  ref: concepts.md#dns-cookies

- id: dns-deep-dive-061
  difficulty: expert
  tags:
  - doq
  - transport
  question: |
    What advantage does DNS over QUIC (RFC 9250) have over DoT and DoH-over-HTTP/2 for
    multiplexed queries?
  options:
  - It runs entirely unencrypted over UDP, so it skips the TLS handshake cost that DoT and DoH pay and is therefore consistently faster on every query
  - It removes the need for the 2-octet length prefix because QUIC datagrams are self-delimiting the way plain UDP datagrams are, saving two bytes per message
  - Independent QUIC streams eliminate the TCP head-of-line blocking that stalls all
    multiplexed queries when a single packet is lost
  - It allows the DNS transaction ID to be any 32-bit value
  answer: 2
  explanation: |
    DoT and DoH/2 ride a single TCP connection, so one lost segment head-of-line-blocks
    every multiplexed query. QUIC's per-stream delivery means loss on one stream doesn't
    stall the others. DoQ still uses length-prefixed messages and is fully encrypted.
  ref: concepts.md#dns-over-quic-doq

- id: dns-deep-dive-062
  difficulty: expert
  tags:
  - doq
  - message-id
  question: |
    RFC 9250 requires the DNS Message ID to be set to 0 on DoQ, and it restricts 0-RTT to
    QUERY and NOTIFY. Why?
  options:
  - The ID is 0 because the QUIC stream itself correlates request/response; 0-RTT is limited
    to replay-safe opcodes so a replayed early-data message can't cause state changes
  - The ID must be 0 so the compression pointers inside the message resolve correctly; 0-RTT is restricted to QUERY and NOTIFY purely to keep the early-data packet small
  - Both rules exist only so DoQ can share configuration with DoT on port 853; the zero ID and the 0-RTT opcode list are copied verbatim from the DoT specification
  - The ID is forced to 0 so that DNSSEC RRSIG signatures validate over the stream; 0-RTT is extended to cover UPDATE so that dynamic zone writes commit in fewer round-trips
  answer: 0
  explanation: |
    On DoQ each query has its own stream, so the 16-bit ID is redundant and MUST be 0.
    QUIC 0-RTT data is replayable, so it is restricted to idempotent/replay-safe opcodes
    (QUERY, NOTIFY); allowing UPDATE in 0-RTT would let an attacker replay a zone change.
  ref: concepts.md#dns-over-quic-doq

- id: dns-deep-dive-063
  difficulty: expert
  tags:
  - amplification
  - ddos
  - security
  question: |
    In a DNS amplification DDoS, what makes DNS an effective reflector and which defense
    operates at the network layer to stop the spoofing itself?
  options:
  - DNS answers are always encrypted on the wire, and Response Rate Limiting works by decrypting each answer to inspect and discard the abusive ones before they leave
  - DNS relies on TCP for every query, so SYN cookies on the resolver stop the flood outright, and DNSSEC signing of the responses is what prevents the reflection
  - A small spoofed-source query yields a much larger response aimed at the victim; BCP 38
    ingress filtering prevents spoofed source IPs from leaving a network
  - The victim must run an open resolver; disabling AAAA records stops the attack
  answer: 2
  explanation: |
    Attackers spoof the victim's IP as source and pick large-response query types, so the
    victim receives amplified traffic. Response Rate Limiting and DNS Cookies help at the
    server, but BCP 38 ingress filtering is the network-level fix: it drops packets whose
    source address doesn't belong to the originating network.
  ref: concepts.md#dns-amplification-and-reflection-attacks

- id: dns-deep-dive-064
  difficulty: advanced
  tags:
  - amplification
  - open-resolver
  question: |
    Why are "open resolvers" a particular problem in the context of DNS amplification?
  options:
  - They cache popular records for far too long, so the stale answers they hand back can be redirected to a victim's address during an attack
  - They refuse all EDNS(0) options and thereby force every query onto TCP:53, whose three-way handshake is what the attacker abuses to amplify traffic
  - They answer recursive queries from anyone, so attackers use them as reflectors to
    amplify spoofed queries toward a victim
  - They can only serve DNSSEC-signed zones
  answer: 2
  explanation: |
    An open resolver recurses for any client, making it a convenient amplifier: the attacker
    sends spoofed-source queries and the resolver blasts large responses at the victim.
    Resolvers should be restricted to their intended users.
  ref: concepts.md#dns-amplification-and-reflection-attacks

- id: dns-deep-dive-065
  difficulty: expert
  tags:
  - glue-records
  - delegation
  question: |
    `example.com` is served by `ns1.example.com` and `ns2.example.com`. Why must the .com
    servers include glue records, and what are they?
  options:
  - Glue is a specially formatted TXT record the registrant publishes at the apex to prove domain ownership to the registry before delegation completes
  - Glue records are CNAMEs that alias the two nameserver names over to the registrar's own hostnames so the registrar can answer on the domain's behalf
  - Glue is only needed when the two nameservers live in a different TLD from the domain they serve, so the parent can bridge across the two registries
  - Without A/AAAA glue for the in-bailiwick nameservers, a resolver can't resolve
    ns1.example.com (which itself lives in example.com), so the parent publishes their
    addresses in the referral's Additional section
  answer: 3
  explanation: |
    When nameservers are inside the zone they serve (in-bailiwick), resolving their names
    requires querying the very zone they define — a deadlock. The parent breaks it by
    publishing A/AAAA glue for those names in the Additional section of the delegation.
    Out-of-bailiwick nameservers need no glue.
  ref: concepts.md#registration-delegation-and-glue-records

- id: dns-deep-dive-066
  difficulty: advanced
  tags:
  - delegation
  - registry
  question: |
    In the registration chain, which party actually publishes your domain's NS records in
    the TLD zone?
  options:
  - The registrant, by logging into the root zone and editing the TLD's delegation entries directly through ICANN's public portal
  - Every recursive resolver on the Internet, which writes the NS set into the TLD zone the first time it caches and validates the domain
  - The registry that operates the TLD (e.g. Verisign for .com), based on the delegation
    the registrar submits
  - ICANN itself, synthesizing and inserting the NS records on demand each time a resolver first queries the TLD for the domain
  answer: 2
  explanation: |
    The registrant registers via a registrar, which submits the delegation to the registry
    operating the TLD. The registry publishes the NS delegation in the TLD zone. Resolvers
    merely cache what they learn.
  ref: concepts.md#registration-delegation-and-glue-records

- id: dns-deep-dive-067
  difficulty: advanced
  tags:
  - zone-transfer
  - ixfr-axfr
  question: |
    What is the practical difference between AXFR and IXFR for keeping secondaries in sync?
  options:
  - AXFR runs over connectionless UDP for speed while IXFR runs over reliable TCP, which is the whole reason IXFR carries the deltas
  - IXFR is always sent unauthenticated in the clear, whereas AXFR mandates a full DNSSEC-signed exchange before any records are transferred
  - AXFR transfers the entire zone; IXFR transfers only the delta since the secondary's
    serial, falling back to AXFR when the delta isn't available
  - AXFR is the incremental delta transfer and IXFR sends the full zone — the two acronyms were historically defined with their meanings swapped
  answer: 2
  explanation: |
    AXFR (RFC 1035) sends the whole zone; IXFR (RFC 1995) sends only changes since the
    secondary's known serial, which is far cheaper for big zones with small edits, and
    falls back to AXFR if the incremental history isn't retained.
  ref: concepts.md#zone-transfers-axfr-ixfr-notify-and-tsig

- id: dns-deep-dive-068
  difficulty: expert
  tags:
  - notify
  - tsig
  - ha
  question: |
    Design a resilient authoritative setup. Which combination correctly pairs each
    mechanism with its job?
  options:
  - NOTIFY authenticates the transfer with an HMAC; TSIG is the timer that triggers the periodic refresh; AXFR encrypts the zone data end to end on the wire
  - TSIG signs each RRset in the zone so end resolvers can validate authenticity, serving as a lighter-weight drop-in replacement for DNSSEC
  - NOTIFY pushes a "zone changed" trigger to secondaries; IXFR/AXFR pull the data; TSIG
    (HMAC + timestamp) authenticates the transfer/update
  - NOTIFY performs the full transfer; TSIG caps the negative-cache TTL
  answer: 2
  explanation: |
    NOTIFY (RFC 1996) is a lightweight push telling secondaries the zone changed; they then
    pull via IXFR/AXFR. TSIG (RFC 8945) authenticates those transfers/dynamic updates with a
    shared-secret HMAC and timestamp. TSIG protects the transfer, distinct from DNSSEC which
    signs data for resolvers.
  ref: concepts.md#zone-transfers-axfr-ixfr-notify-and-tsig

- id: dns-deep-dive-069
  difficulty: expert
  tags:
  - serve-stale
  - resilience
  question: |
    A record's TTL expired, but your authoritative servers are briefly unreachable. Under
    RFC 8767, what may a resolver do, and what side effect does this explain?
  options:
  - It must immediately return SERVFAIL to the client the instant the TTL hits zero, because RFC 8767 defines no fallback path for an unreachable origin
  - It must hand the client a referral to the authoritative server's address so the stub can connect and query the origin directly itself
  - It may keep serving the expired (stale) answer within a bounded stale window to preserve
    availability, which also explains why a change can linger past its nominal TTL
  - It re-signs the record with its own key and serves it as authentic
  answer: 2
  explanation: |
    Serve-stale lets a resolver return an expired answer when it cannot refresh from the
    authoritative source, trading strict freshness for availability during outages. It is
    also one reason a change may appear to persist beyond the record's TTL.
  ref: concepts.md#serve-stale-and-prefetching

- id: dns-deep-dive-070
  difficulty: expert
  tags:
  - happy-eyeballs
  - dual-stack
  question: |
    A packet capture of a single browser navigation shows two DNS questions for the same
    hostname — one A and one AAAA — and the AAAA returns NOERROR with an empty answer. What
    is happening?
  options:
  - The resolver is misconfigured and is duplicating every outbound query, sending a redundant second lookup for each name it is asked to resolve
  - The empty AAAA response is a hard error condition that will abort the connection attempt and break the page load once the browser sees it
  - The browser is performing DNSSEC validation, which by design splits each name into a separate A query and AAAA query to fetch the signatures
  - "Happy Eyeballs (RFC 8305): the dual-stack client queries both families in parallel;
    the empty AAAA is NODATA (the host is IPv4-only), which is normal"
  answer: 3
  explanation: |
    Happy Eyeballs v2 issues A and AAAA lookups and races connections across families. An
    IPv4-only host returns NODATA (NOERROR, empty) for AAAA — expected, not an error. This
    is why one navigation shows two DNS questions.
  ref: concepts.md#happy-eyeballs-and-dual-stack-lookups

- id: dns-deep-dive-071
  difficulty: expert
  tags:
  - soa
  - expire
  question: |
    A secondary authoritative server has been unable to reach the primary for longer than
    the SOA EXPIRE value. What happens, and how does EXPIRE differ from MINIMUM?
  options:
  - The secondary keeps serving the zone forever regardless; EXPIRE and MINIMUM are two names for the same field that both set the default record TTL
  - The secondary clamps every record in the zone down to the MINIMUM value and continues answering with those shortened TTLs indefinitely
  - The secondary stops serving the whole zone (SERVFAIL/refused) because its data is too
    stale to trust; EXPIRE is zone-level, whereas MINIMUM caps the negative-cache TTL in
    resolvers
  - EXPIRE governs how long downstream resolvers may cache positive answers, while MINIMUM sets the REFRESH interval at which the secondary re-polls the primary
  answer: 2
  explanation: |
    EXPIRE bounds how long a secondary will serve a zone without successfully contacting the
    primary; past it, the secondary stops answering rather than serve very stale data. That
    is a zone-level, secondary-side timer — completely different from MINIMUM, which (per RFC
    2308) caps how long resolvers cache negative answers.
  ref: concepts.md#soa-timers-in-depth

- id: dns-deep-dive-072
  difficulty: advanced
  tags:
  - soa
  - serial
  question: |
    You edit a zone on the primary but secondaries never pick up the change, even though
    NOTIFY is configured. Which SOA-related mistake is the classic cause?
  options:
  - You forgot to bump the SOA SERIAL, so secondaries compare serials and conclude nothing
    changed
  - You set the SOA REFRESH interval too low, so secondaries poll faster than the primary can rebuild the zone and abandon each transfer midway
  - The SOA EXPIRE value is set to a negative number, which secondaries interpret as "never transfer" and so they silently ignore every NOTIFY
  - You used the YYYYMMDDnn date-based serial format, which secondaries reject in favor of a plain monotonically increasing integer counter
  answer: 0
  explanation: |
    Secondaries decide whether to transfer by comparing the SOA serial (with wraparound
    arithmetic, RFC 1982). If you edit records but don't increment the serial, the secondary
    sees the same version and skips the transfer, even after a NOTIFY.
  ref: concepts.md#soa-timers-in-depth

- id: dns-deep-dive-073
  difficulty: expert
  tags:
  - svcb-https
  - alias-mode
  question: |
    In an HTTPS/SVCB record (RFC 9460), what distinguishes AliasMode from ServiceMode?
  options:
  - AliasMode has SvcPriority = 0 and aliases the owner to a TargetName; ServiceMode has a
    non-zero priority and describes an endpoint with SvcParams
  - AliasMode is carried in RR type 65 and ServiceMode in type 64, so the two are told apart
    by the record type number alone rather than by any SvcPriority value
  - AliasMode is the mode that carries the ech SvcParam and other hints, whereas ServiceMode
    is a bare redirection that cannot include any SvcParams at all
  - ServiceMode records are only legal at the zone apex, while AliasMode records may appear
    only on labels below it, so a record's position in the zone decides its mode
  answer: 0
  explanation: |
    SvcPriority = 0 signals AliasMode (a CNAME-like redirection to TargetName, usable at the
    apex). A non-zero SvcPriority signals ServiceMode, where the record advertises endpoint
    parameters (alpn, port, hints, ech) and priority orders multiple records.
  ref: concepts.md#svcb-and-https-records-in-depth

- id: dns-deep-dive-074
  difficulty: expert
  tags:
  - svcb-https
  - ech
  - http3
  question: |
    How does an HTTPS record let a browser reach an HTTP/3 origin with a hidden SNI in
    fewer round-trips?
  options:
  - It forces the browser to open an ordinary TCP connection first and read an Alt-Svc header
    to negotiate h3, so the HTTPS record adds a mandatory extra round-trip rather than saving one
  - Its SvcParams can advertise `alpn=h3` (so the client uses HTTP/3 without an Alt-Svc
    round-trip) and carry the `ech` config for Encrypted Client Hello; resolvers can bundle
    the target's A/AAAA in Additional
  - It stores the origin's TLS private key inside the record so the browser can itself decrypt
    the ClientHello SNI locally before the connection is even opened
  - It replaces the need for any A/AAAA record entirely by embedding the resolved IPv4 and IPv6
    addresses directly in the SvcParams, so no separate address lookup ever occurs
  answer: 1
  explanation: |
    The `alpn` SvcParam lets the client jump straight to HTTP/3 without discovering it via
    Alt-Svc over an initial HTTP connection, and the `ech` param (key 5) carries the ECH
    config to encrypt the ClientHello (hiding SNI). Bundling A/AAAA in Additional saves
    another lookup — address, ALPN, and ECH in one query.
  ref: concepts.md#svcb-and-https-records-in-depth

- id: dns-deep-dive-075
  difficulty: expert
  tags:
  - dnssec
  - ksk-zsk
  question: |
    Why does DNSSEC split signing into a KSK and a ZSK?
  options:
  - The KSK signs only the DNSKEY RRset (and is what the parent's DS references), while the
    ZSK signs zone data — so you can roll the ZSK frequently without involving the registrar's
    DS
  - The KSK encrypts each RRset with the resolver's public key and the ZSK is the private half
    the validating resolver uses to decrypt and read the answer
  - The KSK is used to sign the A/AAAA records of IPv4-only zones while the ZSK signs the
    AAAA-bearing records of dual-stack and IPv6-only zones
  - The ZSK is the key hashed into the parent's DS record and the KSK signs the zone data,
    exactly reversing the normal parent-to-child chain of trust
  answer: 0
  explanation: |
    The KSK signs the DNSKEY RRset and is hashed into the parent's DS, anchoring trust. The
    ZSK signs the actual RRsets. This separation lets operators roll the operationally-active
    ZSK often without a registrar DS change, which is only needed for KSK rollovers.
  ref: concepts.md#dnssec-internals-ksk-zsk-rrsig-and-denial-of-existence

- id: dns-deep-dive-076
  difficulty: expert
  tags:
  - dnssec
  - nsec3
  - zone-walking
  question: |
    Why do RFC 9276 and providers using "compact denial / black lies" push beyond ordinary
    NSEC3 for denial of existence?
  options:
  - NSEC3 cannot prove non-existence at all and can only authenticate positive answers, so a
    zone that wants signed denial of existence has to fall back to plain NSEC records instead
  - Plain NSEC lets attackers walk the zone, and NSEC3's hashed names are still crackable
    offline (especially with high iterations), so RFC 9276 recommends iterations=0 and
    on-the-fly minimally-covering records avoid enumeration entirely
  - NSEC3 responses are returned unsigned and therefore cannot be validated, so RFC 9276 replaces
    them with a newer signed record type to close that verification gap
  - Black lies work by encrypting the entire zone's contents so that recursive resolvers can no
    longer read the names and are thus unable to enumerate them
  answer: 1
  explanation: |
    NSEC exposes the zone to enumeration via its name chain; NSEC3 hashes names but remains
    vulnerable to offline dictionary/brute-force cracking, worsened by high iteration counts.
    RFC 9276 recommends iterations=0 and an empty salt; compact-denial/"black lies" synthesize
    minimally-covering signed records per query so there is nothing to walk.
  ref: concepts.md#dnssec-internals-ksk-zsk-rrsig-and-denial-of-existence

- id: dns-deep-dive-077
  difficulty: expert
  tags:
  - dnssec
  - cd-bit
  question: |
    A troubleshooter wants a resolver to return DNSSEC-signed data even if validation would
    normally fail as bogus. Which mechanism does that, and what is its purpose?
  options:
  - Setting the DO (DNSSEC OK) bit, which instructs the resolver to strip all RRSIG signatures
    from the zone so there is nothing left for validation to reject as bogus
  - Setting the AD (Authenticated Data) bit in the outgoing query, which forces the resolver to
    accept the answer as already-validated and skip its own chain-of-trust checks
  - Setting the TC (Truncated) bit so the query is retried over TCP, where the resolver bypasses
    signature verification and returns the data unchecked
  - Setting the CD (Checking Disabled) bit, which tells the resolver to skip validation and
    return the data — useful for debugging or when the client validates itself
  answer: 3
  explanation: |
    CD (Checking Disabled) in the query tells the resolver not to reject on validation
    failure and to return the data regardless — useful for diagnosing a broken chain or when
    the stub does its own validation. DO requests signatures; AD is a response flag saying the
    resolver validated.
  ref: concepts.md#dnssec-internals-ksk-zsk-rrsig-and-denial-of-existence

- id: dns-deep-dive-078
  difficulty: expert
  tags:
  - cache-poisoning
  - sad-dns
  - security
  question: |
    Source-port randomization added ~16 bits of entropy against off-path cache poisoning.
    How did SAD DNS (CVE-2020-25705) defeat it?
  options:
  - It brute-forced the combined 32-bit port-plus-transaction-ID space directly, using GPU
    clusters to guess every combination fast enough to win the race before the real answer
  - It abused the shared global ICMP rate limit (RFC 1812) as a side channel to infer which
    source port was open, collapsing the problem back to guessing the 16-bit transaction ID
  - It first disabled DNSSEC validation on the victim resolver, removing the signature check so
    that a forged unsigned answer would then be accepted and cached without objection
  - It forced every outstanding query onto TCP, where the source port is allocated predictably in
    sequence, letting the attacker guess it and inject a spoofed response
  answer: 1
  explanation: |
    SAD DNS probes ports and observes ICMP "port unreachable" behavior through a shared
    global ICMP rate-limit counter, leaking which port is open. Once the source port is
    known, the attacker only needs to guess the 16-bit TXID. Mitigations include randomized
    ICMP rate limits (Linux 5.10+), DNS Cookies, and DNSSEC.
  ref: concepts.md#cache-poisoning-and-sad-dns

- id: dns-deep-dive-079
  difficulty: expert
  tags:
  - cache-poisoning
  - bailiwick
  question: |
    In the original off-path poisoning threat, an attacker stuffs a malicious record into a
    response. What is the resolver's first-line defense that rejects out-of-zone records?
  options:
  - Source-port randomization, rejecting any record that arrives on the wrong query port
  - Bailiwick checking — discarding records the answering server is not authoritative for
  - DNS 0x20 case randomization, dropping records whose owner-name case fails to match
  - Truncation via the TC bit, forcing the whole response to be re-fetched over TCP:53
  answer: 1
  explanation: |
    Bailiwick checking rejects records outside the zone the responding server is authoritative
    for, so an attacker can't inject, say, a bank's A record in a response about an unrelated
    name. Port randomization and 0x20 add entropy on top, but bailiwick is the structural
    first defense.
  ref: concepts.md#cache-poisoning-and-sad-dns

- id: dns-deep-dive-080
  difficulty: expert
  tags:
  - edns
  - opt
  - wire-format
  question: |
    In the EDNS(0) OPT pseudo-record, how are the requestor's UDP payload size and the
    DNSSEC OK (DO) bit encoded?
  options:
  - Both the UDP payload size and the DO bit are carried in brand-new fixed fields appended
    immediately after the 12-byte DNS header, ahead of the question section
  - The CLASS field is repurposed as the UDP payload size, and the DO bit lives in the
    repurposed TTL field (alongside the extended RCODE and EDNS version)
  - The requestor's UDP payload size is encoded in the OPT record's RDATA while the DO bit is
    carried in the reserved Z field of the main DNS header flags
  - The payload size is written into the 16-bit ID field of the header and the DO bit travels as
    its own separate single-byte resource record in the Additional section
  answer: 1
  explanation: |
    OPT (type 41, owner = root) repurposes RR fields: CLASS carries the requestor's UDP
    payload size (e.g. 1232), and the TTL field encodes the extended RCODE, EDNS version, and
    the DO bit. Options like ECS(8), COOKIE(10), and EDE(15) travel in RDATA.
  ref: concepts.md#edns0-opt-pseudo-record-in-depth

- id: dns-deep-dive-081
  difficulty: advanced
  tags:
  - edns
  - flag-day
  - fragmentation
  question: |
    DNS Flag Day 2020 recommended an EDNS UDP buffer of 1232 bytes. What is the reasoning
    behind that specific number?
  options:
  - It is the absolute maximum size any single DNS message may ever reach on the wire, a hard
    ceiling defined by the protocol that no response is permitted to exceed
  - It exactly matches the TCP maximum segment size negotiated on essentially all networks, so a
    signed answer of that size always fits into one TCP segment without splitting
  - It is the largest unsigned value the 16-bit CLASS field of the OPT record can physically
    hold, so no resolver is able to advertise any buffer bigger than that number
  - It fits within the IPv6 minimum MTU (1280) minus IPv6 and UDP headers, avoiding
    fragmentation while staying above the legacy 512-byte limit
  answer: 3
  explanation: |
    1232 = 1280 (IPv6 minimum MTU) minus 40 bytes IPv6 header minus 8 bytes UDP header. Staying
    at or below it keeps UDP responses inside the guaranteed path and avoids fragmentation,
    which is unreliable and a poisoning vector; oversize answers cleanly fall back to TCP.
  ref: concepts.md#edns0-opt-pseudo-record-in-depth

- id: dns-deep-dive-082
  difficulty: expert
  tags:
  - acceptance-tuple
  - security
  question: |
    For a resolver to accept a UDP response as the answer to its outstanding query, which
    combination must all match — the exact set an off-path attacker must forge?
  options:
  - Only the 16-bit transaction ID and the destination IP need to match, since a modern resolver
    ignores the source port and question and trusts any record the packet happens to carry
  - Source IP, source port (53), destination port (the resolver's query port), transaction
    ID, the question, and bailiwick of the returned records
  - Just the ALPN token and the SNI presented on the connection have to line up, and once those
    two application-layer values agree the resolver accepts the datagram as its answer
  - Only the record's TTL and the advertised EDNS buffer size must match the outstanding query,
    with the transaction ID and port checked only for zone transfers rather than lookups
  answer: 1
  explanation: |
    The implicit acceptance tuple is src IP = queried server, src port = 53, dst port = the
    resolver's randomized query port, matching TXID, matching question (subject to 0x20 case),
    and in-bailiwick records. All poisoning attacks must forge every element at once — which is
    why DoT/DoQ, by authenticating the channel, remove the race entirely.
  ref: concepts.md#the-response-acceptance-tuple

- id: dns-deep-dive-083
  difficulty: advanced
  tags:
  - reverse-dns
  - ip6-arpa
  question: |
    How is the reverse-DNS name for an IPv6 address constructed?
  options:
  - The 32 hex nibbles are reversed, one per label, under ip6.arpa
  - The 8 hextets are reversed and placed under in-addr.arpa
  - The address is base64-encoded under ip6.arpa
  - IPv6 has no reverse DNS; only IPv4 PTR records exist
  answer: 0
  explanation: |
    IPv6 reverse names expand the address to its 32 nibbles, reverse them, and place one nibble
    per label under ip6.arpa. IPv4 uses reversed octets under in-addr.arpa. Both trees are
    independent of forward zones.
  ref: concepts.md#reverse-dns-and-ptr-in-depth

- id: dns-deep-dive-084
  difficulty: expert
  tags:
  - reverse-dns
  - rfc-2317
  question: |
    A provider assigns you a /26 and wants you to manage its reverse DNS. Since /26 is not on
    an octet boundary, how does RFC 2317 classless delegation solve this?
  options:
  - It simply delegates the entire enclosing /24 reverse zone to you regardless of the boundary,
    handing you authority over all 256 addresses even though only 64 are actually yours
  - The provider CNAMEs each address's PTR name into a specially-named child zone that you
    control, so sub-/24 reverse delegation works
  - It requires renumbering the block into IPv6 first, because classless reverse delegation is
    defined only for the nibble-per-label ip6.arpa tree and never for IPv4 in-addr.arpa
  - It stores each PTR mapping inside a TXT record in the parent /24 instead, since sub-octet
    blocks cannot hold real PTR records and must encode the name as free-form text
  answer: 1
  explanation: |
    Reverse zones naturally delegate on octet boundaries. RFC 2317 works around sub-/24 blocks
    by having the parent /24 CNAME each PTR owner name to a differently-named subzone that the
    customer is delegated authority over, enabling classless reverse delegation.
  ref: concepts.md#reverse-dns-and-ptr-in-depth

- id: dns-deep-dive-085
  difficulty: advanced
  tags:
  - reverse-dns
  - fcrdns
  - mail
  question: |
    Why does running a legitimate mail server usually require a correctly configured PTR
    record?
  options:
  - Because the SMTP protocol itself refuses to open the TCP connection on port 25 until the
    connecting client presents a valid PTR record for its address during the initial handshake
  - "Because receivers perform FCrDNS: the connecting IP's PTR must resolve to a name whose
    forward A/AAAA points back to that IP, and a mismatch is treated as a spam signal"
  - Because the PTR record supplies the key material that STARTTLS uses to encrypt the message
    body in transit, so mail sent without one is rejected as unencrypted by the receiver
  - Because a domain's MX records are actually stored inside the in-addr.arpa reverse zone, so a
    missing PTR delegation means receivers can never look up where to deliver the mail
  answer: 1
  explanation: |
    Forward-confirmed reverse DNS checks that the sending IP's PTR maps to a hostname that
    forward-resolves back to the same IP. Missing or mismatched PTR is a common reason mail is
    rejected or scored as spam. PTR is set by the IP block's owner, independent of your forward
    zone.
  ref: concepts.md#reverse-dns-and-ptr-in-depth

- id: dns-deep-dive-086
  difficulty: advanced
  tags:
  - resolv-conf
  - ndots
  - debugging
  question: |
    `dig api.internal` returns the right answer, but an application in a Kubernetes pod is slow
    to resolve the same name and logs several NXDOMAINs first. What is the most likely cause?
  options:
  - dig sends its query over TCP:53 whereas the pod's application uses UDP, and the extra UDP
    retransmit timers inside the container are what make getaddrinfo log NXDOMAINs and stall
  - The pod's resolv.conf has ndots:5, so the stub appends each search domain and fires several
    NXDOMAIN lookups before trying the name as absolute
  - The application is missing a DNSSEC trust anchor, so it retries each lookup as bogus several
    times and emits an NXDOMAIN for every failed validation before finally accepting the answer
  - The app cannot parse AAAA records and keeps re-issuing the query hoping for an A-only reply,
    producing the repeated NXDOMAINs and the delay that dig avoids by asking for A directly
  answer: 1
  explanation: |
    With ndots:5, a name with fewer than 5 dots is first tried with each search-domain suffix,
    producing multiple NXDOMAIN round-trips before the bare/absolute name resolves. dig queries
    the name directly and skips that expansion, so it looks fine while getaddrinfo is slow.
  ref: concepts.md#happy-eyeballs-and-dual-stack-lookups

- id: dns-deep-dive-087
  difficulty: expert
  tags:
  - fragmentation
  - edns
  - debugging
  question: |
    A large DNSSEC/TXT answer resolves fine from one network but times out from another, with
    no explicit error. What is the most likely mechanism and fix?
  options:
  - The zone happens to be served unsigned on the path the second network reaches, so its
    resolver silently discards the answer as bogus; re-signing the zone on that server fixes it
  - The EDNS buffer is large enough that the UDP response IP-fragments, and a middlebox on the
    second path drops the fragments; lowering the buffer to 1232 and ensuring TCP:53 is
    reachable fixes it
  - The second network routes the query over IPv6, and TXT records cannot be represented in
    AAAA-based transport, so the large answer is dropped whenever the path is IPv6 end to end
  - The recursive resolver on that network clamps the record's TTL to zero, forcing an endless
    re-query loop for the large answer that manifests to the client as a silent timeout
  answer: 1
  explanation: |
    Oversize UDP responses fragment at the IP layer; some firewalls/middleboxes drop non-first
    fragments, so the answer silently never completes and no clean TC-triggered TCP retry
    happens. Advertising ~1232 avoids fragmentation, and reachable TCP:53 provides the fallback.
  ref: concepts.md#edns0-opt-pseudo-record-in-depth

