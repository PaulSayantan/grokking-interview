topic: "DNS Deep Dive"
domain: networking
topic_slug: dns-deep-dive
version: 1
questions:
- id: dns-deep-dive-001
  difficulty: beginner
  tags:
  - resolution-path
  - actors
  question: |
    In a full DNS lookup, which component actually walks the hierarchy
    (root → TLD → authoritative) on the client's behalf and caches what it learns?
  options:
  - The recursive resolver
  - The stub resolver in the OS
  - The root nameserver
  - The authoritative nameserver
  answer: 0
  explanation: |
    The recursive resolver (e.g. 8.8.8.8, an ISP resolver) does the legwork of
    chasing referrals and caches results. The stub resolver just forwards the
    question once and waits for the final answer.
  ref: concepts.md#the-resolution-path-stub-recursive-resolver-root-tld-authoritative

- id: dns-deep-dive-002
  difficulty: beginner
  tags:
  - stub
  - rd-bit
  question: |
    What does the stub resolver typically do when it needs to resolve a name?
  options:
  - It queries the root servers directly, then the TLD, then authoritative servers
  - It sets the Recursion Desired bit and forwards the whole question to a configured recursive resolver
  - It performs iterative queries and follows every referral itself
  - It answers from the authoritative zone file it hosts
  answer: 1
  explanation: |
    The stub resolver is deliberately simple: it sets RD=1 and sends the full
    question to its configured recursive resolver, then waits for the complete
    answer. It does not chase referrals itself.
  ref: concepts.md#the-resolution-path-stub-recursive-resolver-root-tld-authoritative

- id: dns-deep-dive-003
  difficulty: beginner
  tags:
  - root-servers
  question: |
    What do the root nameservers return when asked for the A record of
    www.example.com?
  options:
  - The final A record for www.example.com
  - A SERVFAIL error, since they don't recurse
  - A referral to the .com TLD nameservers
  - A CNAME pointing to example.com
  answer: 2
  explanation: |
    Root servers don't know individual host records. They answer iteratively with
    a referral to the appropriate TLD servers (here, the .com servers), which in
    turn refer down to the zone's authoritative servers.
  ref: concepts.md#the-resolution-path-stub-recursive-resolver-root-tld-authoritative

- id: dns-deep-dive-004
  difficulty: intermediate
  tags:
  - root-servers
  - anycast
  question: |
    There are 13 root server "letters" (a–m .root-servers.net). Which statement is
    most accurate about them?
  options:
  - There are exactly 13 physical machines worldwide
  - Each letter is a single server in a different country, 13 total
  - There are 13 because DNS responses can hold at most 13 records
  - They are 13 identities, each backed by a large anycast fleet of servers
  answer: 3
  explanation: |
    The 13 root identities exist because of the old 512-byte UDP limit on the
    priming response, but each identity is served by many physically distributed
    servers via anycast routing — hundreds of instances globally.
  ref: concepts.md#the-resolution-path-stub-recursive-resolver-root-tld-authoritative

- id: dns-deep-dive-005
  difficulty: intermediate
  tags:
  - aa-bit
  - authoritative
  question: |
    A response has the AA (Authoritative Answer) bit set. What does this indicate?
  options:
  - The answering server is authoritative for the zone containing the queried name
  - The answer came from a cache and may be stale
  - The answer was validated by DNSSEC
  - The response was truncated and should be retried over TCP
  answer: 0
  explanation: |
    The AA bit means the responding server is authoritative for the queried name's
    zone (i.e., it holds the zone data directly), as opposed to a cached answer from
    a recursive resolver. DNSSEC validation is signalled by the AD bit; truncation
    by the TC bit.
  ref: concepts.md#the-resolution-path-stub-recursive-resolver-root-tld-authoritative

- id: dns-deep-dive-006
  difficulty: intermediate
  tags:
  - priming
  - root-hints
  question: |
    How does a freshly started recursive resolver with an empty cache know where the
    root servers are?
  options:
  - It broadcasts on the local network to discover them
  - It uses a built-in root hints file (well-known root IPs) and may issue a priming query for NS .
  - It asks its configured TLD servers for the root list
  - It downloads them from the registrar during boot
  answer: 1
  explanation: |
    Resolvers ship with a root hints file listing the root server addresses, and
    typically issue a priming query (NS .) to refresh the authoritative root NS set
    at startup.
  ref: concepts.md#the-resolution-path-stub-recursive-resolver-root-tld-authoritative

- id: dns-deep-dive-007
  difficulty: beginner
  tags:
  - recursive-vs-iterative
  question: |
    What is the key difference between a recursive and an iterative query?
  options:
  - Recursive queries use TCP; iterative queries use UDP
  - Recursive queries are encrypted; iterative queries are plaintext
  - In a recursive query the queried server chases referrals and returns the final answer; in an iterative
    query the querying client follows referrals itself
  - Iterative queries can only return NXDOMAIN
  answer: 2
  explanation: |
    Recursive vs iterative describes who chases referrals. A recursive query asks the
    server to return the final answer (or error). An iterative query accepts a
    referral, leaving the client to continue the walk.
  ref: concepts.md#recursive-vs-iterative-queries

- id: dns-deep-dive-008
  difficulty: intermediate
  tags:
  - recursive-vs-iterative
  - root-tld
  question: |
    Why do root and TLD servers refuse to perform recursion?
  options:
  - Recursion is only defined for IPv6
  - They lack the CPU to run DNSSEC validation
  - Recursion requires TCP, which they don't support
  - If they recursed for every client on the Internet they would be overwhelmed; they only answer iteratively
    with referrals
  answer: 3
  explanation: |
    Root and TLD servers answer only iteratively (referrals). Recursing on behalf of
    the entire Internet would be an impossible load, so recursion is the job of
    dedicated recursive resolvers.
  ref: concepts.md#recursive-vs-iterative-queries

- id: dns-deep-dive-009
  difficulty: intermediate
  tags:
  - recursive-vs-iterative
  - ra-bit
  question: |
    A single user's name lookup involves how many recursive vs iterative queries in
    the common case (cold cache)?
  options:
  - One recursive query (stub → recursor) driving many iterative queries (recursor → root/TLD/auth)
  - Many recursive queries and one iterative query
  - Only iterative queries throughout
  - Only recursive queries throughout
  answer: 0
  explanation: |
    The stub sends one recursive query to its resolver. The resolver internally issues
    a series of iterative queries to root, TLD, and authoritative servers to build the
    answer.
  ref: concepts.md#recursive-vs-iterative-queries

- id: dns-deep-dive-010
  difficulty: advanced
  tags:
  - recursive-vs-iterative
  - ra-bit
  question: |
    A resolver that offers recursion (RA bit set) receives a recursive query it can
    resolve. Which of the following is it NOT allowed to return?
  options:
  - The final answer
  - A referral to other nameservers
  - An error such as SERVFAIL or NXDOMAIN
  - A NODATA (NOERROR with empty answer) response
  answer: 1
  explanation: |
    When a server accepts a recursive query, it must return the answer or an error —
    never a referral. Referrals are only for iterative responses. NODATA is a valid
    final answer meaning the name exists but the type doesn't.
  ref: concepts.md#recursive-vs-iterative-queries

- id: dns-deep-dive-011
  difficulty: beginner
  tags:
  - record-types
  - a-aaaa
  question: |
    Which record type maps a hostname to an IPv6 address?
  options:
  - A
  - CNAME
  - AAAA
  - PTR
  answer: 2
  explanation: |
    A maps to IPv4 (32-bit); AAAA ("quad-A") maps to IPv6 (128-bit). CNAME is an
    alias to another name; PTR is the reverse (IP → name) record.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-012
  difficulty: beginner
  tags:
  - record-types
  - mx
  question: |
    In an MX record `10 mail.example.com.`, what does the number 10 represent, and how
    is it interpreted?
  options:
  - A weight; higher means more traffic
  - The TTL in minutes
  - The port number for SMTP
  - A preference; lower values are tried first (higher priority)
  answer: 3
  explanation: |
    MX preference is a priority where lower numbers are preferred. An MX with
    preference 10 is tried before one with preference 20.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-013
  difficulty: intermediate
  tags:
  - record-types
  - txt
  question: |
    Which of these is a typical legitimate use of a TXT record?
  options:
  - Publishing SPF/DKIM email authentication policies or domain-ownership verification tokens
  - Delegating a subdomain to another set of nameservers
  - Mapping an IP address back to a hostname
  - Specifying the port and priority of a service
  answer: 0
  explanation: |
    TXT records carry arbitrary text and are widely used for SPF, DKIM, and
    domain-verification tokens. Delegation is NS; reverse mapping is PTR; service
    location is SRV.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-014
  difficulty: intermediate
  tags:
  - record-types
  - cname-rules
  question: |
    According to RFC 1034, what is a fundamental restriction on a name that has a
    CNAME record?
  options:
  - It may not have a TTL below 3600 seconds
  - It may not coexist with other record types at the same name
  - It must always point to an IPv4 address
  - It can only appear in reverse (in-addr.arpa) zones
  answer: 1
  explanation: |
    A CNAME must be the only record type at its owner name — no other RR types may
    coexist with it. This is precisely why a CNAME can't sit at a zone apex, which
    must carry SOA and NS records.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-015
  difficulty: intermediate
  tags:
  - record-types
  - soa
  question: |
    Which field of the SOA record today governs how long negative answers
    (NXDOMAIN/NODATA) may be cached?
  options:
  - The refresh field
  - The serial field
  - The minimum field
  - The expire field
  answer: 2
  explanation: |
    Per RFC 2308, the SOA MINIMUM field (once a default record TTL) now defines the
    negative-caching TTL — capped by the SOA record's own TTL. Refresh/retry/expire
    govern secondary zone-transfer timing; serial detects zone changes.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-016
  difficulty: intermediate
  tags:
  - record-types
  - srv
  question: |
    An SRV record is written `_sip._tcp.example.com. 3600 IN SRV 10 60 5060 sipserver.example.com.`.
    Which statement about it is correct?
  options:
  - 5060 is the weight and 60 is the port
  - It maps an IP address to the service name
  - SRV records are used by web browsers to find HTTP servers
  - 10 is the priority, 60 the weight, and 5060 the target port
  answer: 3
  explanation: |
    SRV format is `priority weight port target`. Lower priority wins; weight
    distributes load among equal priorities. Web (HTTP) historically ignored SRV;
    the modern equivalent for web is the HTTPS/SVCB record (RFC 9460).
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-017
  difficulty: intermediate
  tags:
  - record-types
  - ptr
  - reverse
  question: |
    Which statement about PTR (reverse) records is correct?
  options:
  - PTR records live under the in-addr.arpa (IPv4) or ip6.arpa (IPv6) tree and are managed independently
    of forward records
  - Creating an A record automatically creates the matching PTR record
  - PTR records map a hostname to its IPv6 address
  - PTR records are only used by DNSSEC
  answer: 0
  explanation: |
    Reverse DNS lives in the .in-addr.arpa / .ip6.arpa zones, which are separate from
    forward zones. Adding an A record does not create a PTR; reverse delegation is
    controlled by whoever owns the IP block.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-018
  difficulty: intermediate
  tags:
  - record-types
  - caa
  question: |
    What is the purpose of a CAA record, and who acts on it?
  options:
  - It tells browsers which cipher suites to use; browsers enforce it
  - It specifies which Certificate Authorities may issue certificates for the domain; CAs check it at
    issuance time
  - It lists which resolvers may cache the domain; resolvers enforce it
  - It authenticates the zone's records; validating resolvers enforce it
  answer: 1
  explanation: |
    CAA (RFC 8659) lets a domain declare which CAs are permitted to issue certs for
    it. Certificate Authorities are required to check CAA at issuance; browsers do not
    consult CAA.
  ref: concepts.md#dns-record-types-a-aaaa-cname-mx-txt-ns-soa-srv-ptr-caa

- id: dns-deep-dive-019
  difficulty: beginner
  tags:
  - ttl
  - caching
  question: |
    What does a resource record's TTL tell caches?
  options:
  - The maximum size of the record in bytes
  - How many hops the query may traverse
  - How many seconds the answer may be reused before it must be re-fetched
  - The priority of the record relative to others
  answer: 2
  explanation: |
    TTL (time-to-live) is the number of seconds a cache may reuse the answer. When it
    reaches zero the cache must re-query the authoritative source.
  ref: concepts.md#ttl-and-caching-layers

- id: dns-deep-dive-020
  difficulty: intermediate
  tags:
  - ttl
  - caching-layers
  question: |
    A recursive resolver cached an A record with TTL 3600 and now serves it to a
    client 1000 seconds later. What TTL does the client see, and why?
  options:
  - 3600, because TTL is fixed by the authoritative server and never changes
  - 0, because any cached record is considered expired
  - 60, because resolvers clamp all TTLs to 60 seconds
  - Approximately 2600, because caches decrement the TTL as time passes
  answer: 3
  explanation: |
    Caches count TTLs down. After 1000s of a 3600s TTL, roughly 2600s remain, and that
    decremented value is what the resolver hands the client — so the effective
    freshness is governed by the smallest remaining TTL on the path.
  ref: concepts.md#ttl-and-caching-layers

- id: dns-deep-dive-021
  difficulty: intermediate
  tags:
  - ttl
  - tradeoffs
  question: |
    What is the main trade-off of setting a very LOW TTL (e.g. 30 seconds) on your
    records?
  options:
  - Faster change propagation and failover, but more query load and resolver round-trips
  - Records propagate slower but use less query load
  - DNSSEC signatures become invalid
  - The records can no longer be cached at all by browsers
  answer: 0
  explanation: |
    Low TTLs mean caches expire quickly, so changes/failover take effect fast — at the
    cost of more frequent queries hitting the authoritative servers and slightly more
    latency for clients on cache misses.
  ref: concepts.md#ttl-and-caching-layers

- id: dns-deep-dive-022
  difficulty: advanced
  tags:
  - ttl
  - migration
  - gotcha
  question: |
    You plan to migrate a service and want fast cutover. Your record currently has
    TTL 86400 and was last changed a month ago. You lower the TTL to 60 one hour
    before the migration. What actually happens?
  options:
  - All resolvers immediately honor the 60s TTL because the change is instant
  - Resolvers that cached the old record before your change may keep serving it (with the old 86400 TTL)
    for up to a day, so the low TTL only helps those that re-fetch after it
  - The migration is impossible until the old TTL naturally reaches zero on the authoritative server
  - The 60s TTL retroactively shortens all previously cached copies
  answer: 1
  explanation: |
    Cached copies keep the TTL they were fetched with. To make a low TTL effective at
    cutover you must publish it at least one OLD-TTL window ahead, so every cache has
    re-fetched the record with the new low TTL before you migrate.
  ref: concepts.md#ttl-and-caching-layers

- id: dns-deep-dive-023
  difficulty: beginner
  tags:
  - caching-layers
  question: |
    Which sequence correctly lists DNS caching layers from client-side to source of
    truth?
  options:
  - Authoritative → recursive resolver → OS stub → browser
  - Root → TLD → authoritative → browser
  - Browser cache → OS stub cache → recursive resolver cache → authoritative (source of truth)
  - Recursive resolver → browser → OS stub → authoritative
  answer: 2
  explanation: |
    A query may be answered by the browser's in-process cache, then the OS stub cache,
    then the recursive resolver's cache, before finally reaching the authoritative
    server that owns the data.
  ref: concepts.md#ttl-and-caching-layers

- id: dns-deep-dive-024
  difficulty: intermediate
  tags:
  - negative-caching
  - nxdomain-nodata
  question: |
    What is the difference between NXDOMAIN and NODATA responses?
  options:
  - NXDOMAIN means the server is down; NODATA means the query timed out
  - They are two names for the same error
  - NXDOMAIN applies only to IPv6; NODATA only to IPv4
  - NXDOMAIN means the name does not exist at all; NODATA (NOERROR with empty answer) means the name exists
    but has no record of the requested type
  answer: 3
  explanation: |
    NXDOMAIN (rcode 3) says the name itself doesn't exist. NODATA is NOERROR (rcode 0)
    with an empty answer section plus an SOA in authority — the name exists but not for
    that record type (e.g., an AAAA query on an IPv4-only host).
  ref: concepts.md#negative-caching

- id: dns-deep-dive-025
  difficulty: intermediate
  tags:
  - negative-caching
  - rfc-2308
  question: |
    Per RFC 2308, how long should a negative (NXDOMAIN/NODATA) answer be cached?
  options:
  - For the minimum of the SOA MINIMUM field and the SOA record's own TTL
  - For a fixed 5 minutes regardless of the zone
  - Forever, until the resolver restarts
  - For the same duration as the positive TTL of an A record in the zone
  answer: 0
  explanation: |
    RFC 2308 sets the negative cache duration to the lesser of the SOA MINIMUM value
    and the SOA's TTL. That's why a high SOA minimum can keep a newly-created name
    "invisible" for a while after a prior negative answer was cached.
  ref: concepts.md#negative-caching

- id: dns-deep-dive-026
  difficulty: advanced
  tags:
  - negative-caching
  - gotcha
  question: |
    You just created a new AAAA record, but some clients still can't resolve it for
    several minutes despite a low TTL on the record itself. What is the most likely
    cause?
  options:
  - The AAAA record type is not supported by resolvers
  - An earlier NODATA/NXDOMAIN answer for that name was negatively cached for the SOA minimum window
  - IPv6 records always take 24 hours to become active
  - The authoritative server rejected the record because AAAA requires DNSSEC
  answer: 1
  explanation: |
    Before the record existed, resolvers may have cached the negative answer for the
    SOA-minimum duration. The new record's own TTL doesn't shorten that already-cached
    negative entry — you wait for it to expire.
  ref: concepts.md#negative-caching

- id: dns-deep-dive-027
  difficulty: beginner
  tags:
  - transport
  - udp-tcp
  question: |
    Which transport and port does classic DNS use by default, and what is the fallback?
  options:
  - TCP port 53 by default, with UDP as fallback
  - UDP port 853 by default, with HTTPS as fallback
  - UDP port 53 by default, with TCP port 53 as a mandatory fallback
  - TCP port 443 by default, with UDP port 53 as fallback
  answer: 2
  explanation: |
    DNS uses UDP:53 by default for speed. TCP:53 is a mandatory fallback (RFC 7766),
    used for truncated responses, zone transfers, and large/DNSSEC answers. Port 853
    is DoT; 443 is DoH.
  ref: concepts.md#dns-over-udp53-tcp-fallback-and-message-size

- id: dns-deep-dive-028
  difficulty: intermediate
  tags:
  - transport
  - tc-bit
  question: |
    A client receives a DNS response over UDP with the TC (Truncated) bit set. What
    should it do?
  options:
  - Discard the response and give up
  - Retry over UDP with a smaller buffer
  - Treat the partial answer as authoritative
  - Retry the same query over TCP:53
  answer: 3
  explanation: |
    The TC bit signals the response didn't fit the UDP payload. The client should
    retry over TCP:53, where message length is prefixed and large responses fit.
  ref: concepts.md#dns-over-udp53-tcp-fallback-and-message-size

- id: dns-deep-dive-029
  difficulty: intermediate
  tags:
  - transport
  - edns
  - message-size
  question: |
    What problem does EDNS(0) (RFC 6891) solve for DNS over UDP?
  options:
  - It lets a client advertise a larger UDP payload size (e.g. 1232 bytes), reducing the need to fall
    back to TCP
  - It encrypts DNS queries end to end
  - It compresses zone transfers
  - It replaces UDP with QUIC for all DNS traffic
  answer: 0
  explanation: |
    Original DNS capped UDP payloads at 512 bytes. EDNS(0) adds an OPT pseudo-record
    so the client can advertise a bigger buffer (1232 is the modern recommended
    default), cutting down TCP fallback while avoiding IP fragmentation.
  ref: concepts.md#dns-over-udp53-tcp-fallback-and-message-size

- id: dns-deep-dive-030
  difficulty: intermediate
  tags:
  - transport
  - zone-transfer
  question: |
    Which DNS operation always uses TCP rather than UDP?
  options:
  - A simple A record lookup
  - A zone transfer (AXFR/IXFR) between primary and secondary servers
  - A PTR lookup
  - An NS referral from a TLD server
  answer: 1
  explanation: |
    Zone transfers move an entire zone (potentially large and requiring reliability),
    so AXFR/IXFR use TCP. Ordinary lookups start on UDP and only fall back to TCP when
    truncated.
  ref: concepts.md#dns-over-udp53-tcp-fallback-and-message-size

- id: dns-deep-dive-031
  difficulty: advanced
  tags:
  - transport
  - edns
  - fragmentation
  question: |
    Why do modern recommendations favor an EDNS UDP buffer size around 1232 bytes
    rather than 4096?
  options:
  - 1232 is the maximum size DNS messages can ever be
  - 4096 is not a valid EDNS value
  - Smaller advertised buffers reduce the chance of IP fragmentation (and the reliability/security problems
    it brings), triggering clean TCP fallback instead
  - Resolvers cannot parse responses larger than 1232 bytes
  answer: 2
  explanation: |
    Large UDP responses can get IP-fragmented, which is unreliable and a security risk.
    Advertising ~1232 bytes keeps responses within a safe path MTU, so oversize answers
    cleanly truncate and retry over TCP rather than fragment.
  ref: concepts.md#dns-over-udp53-tcp-fallback-and-message-size

- id: dns-deep-dive-032
  difficulty: beginner
  tags:
  - load-balancing
  - round-robin
  question: |
    What is "round-robin DNS"?
  options:
  - A resolver that queries root servers in a rotating order
  - A DNSSEC key-rollover scheme
  - A way to compress large responses into multiple UDP packets
  - Returning multiple A/AAAA records so clients/resolvers rotate among several IPs, spreading load crudely
  answer: 3
  explanation: |
    Round-robin DNS returns several address records; clients rotate through them,
    giving crude load spreading. It has no health awareness and caching/ordering can
    skew the actual distribution.
  ref: concepts.md#dns-based-load-balancing-failover-and-geodns

- id: dns-deep-dive-033
  difficulty: intermediate
  tags:
  - load-balancing
  - failover
  - ttl
  question: |
    Why is DNS-based failover inherently slower than an in-band load balancer removing
    a dead backend?
  options:
  - Clients keep using cached answers until the record's TTL expires, so a dead endpoint may still be
    handed out until caches refresh
  - DNS servers are physically farther away
  - DNS cannot return more than one address
  - Failover records must always use TCP, which adds latency
  answer: 0
  explanation: |
    DNS has no cache-invalidation mechanism. Even after you stop returning a dead
    endpoint, resolvers and clients keep serving the cached answer until its TTL
    elapses — hence low TTLs (30–60s) on failover records, and still slower than an LB.
  ref: concepts.md#dns-based-load-balancing-failover-and-geodns

- id: dns-deep-dive-034
  difficulty: advanced
  tags:
  - geodns
  - ecs
  - gotcha
  question: |
    A GeoDNS system maps users to their nearest region based on the query's source IP.
    A user configured to use a public resolver in another country gets routed to that
    distant region. What is the underlying cause and the standard mitigation?
  options:
  - The user's browser cache is stale; clearing it fixes routing
  - GeoDNS sees the recursive resolver's IP, not the end user's; EDNS Client Subnet (RFC 7871) forwards
    a truncated client subnet to improve accuracy
  - GeoDNS requires DNSSEC, which the user disabled
  - The TTL was too high, so the wrong region was cached
  answer: 1
  explanation: |
    Authoritative servers normally see the resolver's source IP, not the user's. If
    that resolver is far away, geo-mapping is wrong. EDNS Client Subnet (RFC 7871)
    passes a truncated client subnet so the authoritative server can map more
    accurately — at a privacy cost.
  ref: concepts.md#dns-based-load-balancing-failover-and-geodns

- id: dns-deep-dive-035
  difficulty: intermediate
  tags:
  - load-balancing
  - limitations
  question: |
    Which limitation makes DNS best suited for coarse regional steering rather than
    fine-grained per-request load balancing?
  options:
  - DNS responses can only contain one record
  - DNS cannot resolve IPv6 addresses
  - DNS has no real-time server-load feedback and answers are cached for the TTL, so it can't react per-request
  - DNS load balancing requires TCP for every query
  answer: 2
  explanation: |
    DNS doesn't know backend load in real time and its answers are cached, so it can't
    make per-request decisions. It's good for coarse regional/weighted steering, with a
    real L4/L7 load balancer doing fine-grained distribution inside each region.
  ref: concepts.md#dns-based-load-balancing-failover-and-geodns

- id: dns-deep-dive-036
  difficulty: intermediate
  tags:
  - cname-apex
  - restriction
  question: |
    Why can't you put a CNAME record at a zone apex (e.g. example.com with no host
    label)?
  options:
  - Apex records must be IPv6-only
  - CNAMEs are only allowed in reverse zones
  - The registrar charges extra for apex CNAMEs
  - The apex must carry SOA and NS records, and a CNAME cannot coexist with other record types at the
    same name
  answer: 3
  explanation: |
    The zone apex must hold SOA and NS records that define the zone. Since RFC 1034
    forbids a CNAME from coexisting with any other record type at the same name, a
    CNAME at the apex is illegal.
  ref: concepts.md#the-cname-at-apex-problem

- id: dns-deep-dive-037
  difficulty: intermediate
  tags:
  - cname-apex
  - alias
  question: |
    How do providers like Route 53, Cloudflare, and NS1 let you effectively "point the
    apex at a CDN hostname" despite the CNAME-at-apex restriction?
  options:
  - They use ALIAS/ANAME / CNAME-flattening pseudo-records that resolve the target's A/AAAA at query time
    and return them as apex A/AAAA records
  - They allow a real standard CNAME at the apex as an extension to the RFC
  - They require you to disable the SOA record
  - They convert the apex into a reverse-DNS zone
  answer: 0
  explanation: |
    ALIAS/ANAME (or CNAME flattening) is a provider-side synthesis: the authoritative
    server resolves the target's addresses at query time and returns them as ordinary
    A/AAAA records at the apex. It is not a standard record type.
  ref: concepts.md#the-cname-at-apex-problem

- id: dns-deep-dive-038
  difficulty: advanced
  tags:
  - cname-apex
  - svcb-https
  question: |
    Which standards-track record type is the emerging answer for aliasing and service
    binding (including at the apex) for web traffic?
  options:
  - The SRV record (RFC 2782)
  - The HTTPS/SVCB record (RFC 9460)
  - The CAA record (RFC 8659)
  - The NAPTR record
  answer: 1
  explanation: |
    SVCB and its HTTPS variant (RFC 9460) can live at the apex, carry an AliasMode
    target, and include ALPN/port/ECH hints — the standards-track successor to
    provider-specific ALIAS/ANAME hacks for the web.
  ref: concepts.md#the-cname-at-apex-problem

- id: dns-deep-dive-039
  difficulty: beginner
  tags:
  - dnssec
  - purpose
  question: |
    What security property does DNSSEC provide?
  options:
  - Confidentiality — it encrypts DNS queries and answers
  - Rate limiting of malicious clients
  - Origin authentication and integrity of DNS answers — not encryption
  - Anonymization of the client's IP address
  answer: 2
  explanation: |
    DNSSEC (RFC 4033–4035) cryptographically signs records so resolvers can verify
    answers are authentic and unmodified. It does NOT encrypt; confidentiality is the
    job of DoT/DoH.
  ref: concepts.md#dnssec-brief

- id: dns-deep-dive-040
  difficulty: advanced
  tags:
  - dnssec
  - chain-of-trust
  question: |
    In DNSSEC, what role does the DS (Delegation Signer) record play?
  options:
  - It encrypts the zone's records with the resolver's public key
  - It signs each individual RRset in the child zone
  - It stores the negative-caching TTL for the zone
  - It sits in the PARENT zone and hashes the child zone's key, linking the chain of trust from parent
    to child
  answer: 3
  explanation: |
    The DS record lives in the parent zone and is a hash of the child's DNSKEY, extending
    the chain of trust downward. RRSIG signs RRsets; DNSKEY publishes the keys; the root
    key is the trust anchor.
  ref: concepts.md#dnssec-brief

- id: dns-deep-dive-041
  difficulty: advanced
  tags:
  - dnssec
  - nsec
  question: |
    How does DNSSEC provide authenticated proof that a name does NOT exist, and why is
    NSEC3 sometimes preferred over NSEC?
  options:
  - NSEC/NSEC3 records authenticate non-existence; NSEC3 hashes names to resist zone enumeration (walking)
    that plain NSEC allows
  - It returns an unsigned NXDOMAIN; NSEC3 is just a faster version
  - It uses the AD bit alone; NSEC3 adds encryption
  - It relies on the SOA minimum field; NSEC3 shortens it
  answer: 0
  explanation: |
    NSEC/NSEC3 records provide signed proof of non-existence. Plain NSEC lets an attacker
    "walk" the zone by following the chain of names; NSEC3 stores hashed names to make
    zone enumeration much harder.
  ref: concepts.md#dnssec-brief

- id: dns-deep-dive-042
  difficulty: intermediate
  tags:
  - dnssec
  - ad-bit
  question: |
    When a validating resolver successfully verifies the DNSSEC chain for an answer,
    what does it set, and what happens on a bad signature?
  options:
  - It sets the TC bit; a bad signature returns NXDOMAIN
  - It sets the AD (Authenticated Data) bit; a bad signature yields SERVFAIL
  - It sets the AA bit; a bad signature is silently ignored
  - It sets the RD bit; a bad signature returns a referral
  answer: 1
  explanation: |
    A validating resolver sets the AD bit when the chain of trust verifies. If validation
    fails (bad/missing signatures), it returns SERVFAIL rather than a potentially forged
    answer.
  ref: concepts.md#dnssec-brief

- id: dns-deep-dive-043
  difficulty: beginner
  tags:
  - privacy
  - doh-dot
  question: |
    What do DoT and DoH primarily add to DNS?
  options:
  - Load balancing across resolvers
  - Cryptographic signing of authoritative zone data
  - Confidentiality/encryption of queries between the stub and the recursive resolver
  - Automatic failover between TLDs
  answer: 2
  explanation: |
    DNS over TLS (RFC 7858) and DNS over HTTPS (RFC 8484) encrypt the stub→resolver hop,
    protecting queries from on-path observers. That's confidentiality — orthogonal to
    DNSSEC's integrity/authentication.
  ref: concepts.md#dns-privacy-doh-and-dot

- id: dns-deep-dive-044
  difficulty: intermediate
  tags:
  - privacy
  - doh-dot
  - ports
  question: |
    What is the main operational difference between DoT and DoH?
  options:
  - DoT is encrypted while DoH is plaintext
  - DoH only works over IPv6
  - DoT signs records with DNSSEC while DoH does not
  - DoT uses a dedicated port 853 (easy to identify/block), while DoH rides HTTPS on port 443 and blends
    in with normal web traffic
  answer: 3
  explanation: |
    DoT uses its own port 853, so network admins can readily identify and manage it. DoH
    runs over HTTPS on 443, making it indistinguishable from ordinary web traffic and
    therefore hard to block — great for privacy, controversial for network operators.
  ref: concepts.md#dns-privacy-doh-and-dot

- id: dns-deep-dive-045
  difficulty: advanced
  tags:
  - privacy
  - doh
  - limitations
  question: |
    Which statement about the privacy limits of DoT/DoH is correct?
  options:
  - They encrypt the stub→resolver hop but the resolver operator still sees your queries; TLS SNI and
    destination IP can still leak the site to on-path observers unless ECH is used
  - They hide which sites you visit even from the resolver operator
  - They encrypt the resolver→authoritative queries as well by default
  - They make DNSSEC unnecessary because encryption also authenticates the data
  answer: 0
  explanation: |
    DoT/DoH protect the query in transit to the resolver, but you still trust the resolver
    operator, and TLS SNI plus the destination IP can reveal the site to on-path observers
    unless Encrypted Client Hello is used. They also don't cover the resolver→authoritative
    hop and don't replace DNSSEC.
  ref: concepts.md#dns-privacy-doh-and-dot

- id: dns-deep-dive-046
  difficulty: beginner
  tags:
  - propagation
  - misconception
  question: |
    An engineer says "my DNS change hasn't propagated to all servers yet." Why is
    "propagation" a misleading way to describe what's happening?
  options:
  - Because DNS changes never take effect without a manual push
  - Because authoritative changes are effectively instant; the delay is old cached copies expiring from
    resolvers as their TTL counts down, not updates flooding outward
  - Because only the root servers can approve changes, which takes time
  - Because DNS records must be re-signed by every resolver before use
  answer: 1
  explanation: |
    There is no push/propagation in DNS. The authoritative answer changes immediately;
    what you wait for is stale cached copies expiring across resolvers as their TTL
    elapses. There's no mechanism to force-flush caches worldwide.
  ref: concepts.md#the-dns-propagation-misconception

- id: dns-deep-dive-047
  difficulty: intermediate
  tags:
  - propagation
  - ttl
  question: |
    Given the propagation misconception, roughly what determines how long a DNS change
    takes to be seen everywhere?
  options:
  - The physical distance between resolvers and the authoritative server
  - A fixed 24–48 hours mandated by ICANN
  - Approximately the record's TTL (plus resolvers that clamp TTLs and any negative-cache windows for
    new names)
  - The number of root servers currently online
  answer: 2
  explanation: |
    The delay is essentially the TTL of the old cached record, extended by resolvers that
    cap/clamp TTLs and by negative-caching windows for newly created names. Lowering the
    TTL ahead of time shortens it.
  ref: concepts.md#the-dns-propagation-misconception

- id: dns-deep-dive-048
  difficulty: intermediate
  tags:
  - propagation
  - secondaries
  question: |
    When you update a primary (master) zone, how do secondary authoritative servers
    typically get the change, and how fast?
  options:
  - They never update; only the primary is authoritative
  - They poll the root servers hourly for updates
  - Registrars push the zone to secondaries once per day
  - Via NOTIFY and IXFR/AXFR zone transfers, usually within seconds — so authoritative data is consistent
    quickly; the visible delay is resolver caching
  answer: 3
  explanation: |
    The primary sends NOTIFY messages and secondaries pull the delta via IXFR (or full
    AXFR), usually within seconds. So authoritative servers converge quickly; the
    user-visible "propagation" delay is downstream resolver caching, not the transfer.
  ref: concepts.md#the-dns-propagation-misconception

