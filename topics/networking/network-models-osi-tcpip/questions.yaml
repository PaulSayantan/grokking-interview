topic: 'Network Models: OSI & TCP/IP'
domain: networking
topic_slug: network-models-osi-tcpip
version: 1
questions:
- id: network-models-osi-tcpip-001
  difficulty: beginner
  tags:
  - osi
  - layers
  - fundamentals
  question: |
    How many layers does the OSI reference model define?
  options:
  - '7'
  - '4'
  - '5'
  - '8'
  answer: 0
  explanation: |
    The OSI (Open Systems Interconnection) model, standardized in ISO/IEC 7498-1,
    defines seven layers: Physical, Data Link, Network, Transport, Session,
    Presentation, and Application.
  ref: concepts.md#the-osi-seven-layer-model
- id: network-models-osi-tcpip-002
  difficulty: beginner
  tags:
  - osi
  - layers
  - ordering
  question: |
    Which OSI layer is Layer 1 (the bottom layer)?
  options:
  - Data Link
  - Physical
  - Network
  - Application
  answer: 1
  explanation: |
    Layer 1 is the Physical layer, which transmits raw bits over the medium
    (voltages, light pulses, radio). The layers count upward from Physical (1)
    to Application (7).
  ref: concepts.md#the-osi-seven-layer-model
- id: network-models-osi-tcpip-003
  difficulty: beginner
  tags:
  - osi
  - application
  - protocols
  question: |
    At which OSI layer does the HTTP protocol operate?
  options:
  - Transport (Layer 4)
  - Session (Layer 5)
  - Application (Layer 7)
  - Presentation (Layer 6)
  answer: 2
  explanation: |
    HTTP is an application-layer protocol (OSI Layer 7). It defines how clients and
    servers exchange requests and responses; it relies on lower layers (TCP, IP,
    Ethernet) to actually move the bytes.
  ref: concepts.md#protocols-at-each-layer
- id: network-models-osi-tcpip-004
  difficulty: beginner
  tags:
  - transport
  - ports
  - layer4
  question: |
    Which OSI layer introduces port numbers to identify individual processes?
  options:
  - Network (Layer 3)
  - Session (Layer 5)
  - Data Link (Layer 2)
  - Transport (Layer 4)
  answer: 3
  explanation: |
    Port numbers are a Transport-layer (Layer 4) concept. TCP and UDP use source
    and destination ports to multiplex data among the many processes running on a
    single host.
  ref: concepts.md#the-osi-seven-layer-model
- id: network-models-osi-tcpip-005
  difficulty: beginner
  tags:
  - pdu
  - terminology
  - layer2
  question: |
    What is the name of the protocol data unit (PDU) at the Data Link layer?
  options:
  - Frame
  - Packet
  - Segment
  - Bit
  answer: 0
  explanation: |
    The Data Link layer (L2) PDU is a frame. Above it, the Network layer PDU is a
    packet, the Transport PDU is a segment/datagram, and the Physical layer deals in
    bits.
  ref: concepts.md#protocol-data-units-at-each-layer
- id: network-models-osi-tcpip-006
  difficulty: beginner
  tags:
  - pdu
  - terminology
  - layer3
  question: |
    What is the PDU at the Network layer (Layer 3)?
  options:
  - Frame
  - Packet
  - Segment
  - Data
  answer: 1
  explanation: |
    The Network-layer PDU is a packet (an IP packet, sometimes called an IP
    datagram). Frames are L2, segments/datagrams are L4, and "data" is the term for
    the upper (application) layers.
  ref: concepts.md#protocol-data-units-at-each-layer
- id: network-models-osi-tcpip-007
  difficulty: intermediate
  tags:
  - pdu
  - transport
  - tcp
  - udp
  question: |
    In OSI/TCP/IP terminology, what is a TCP transport-layer PDU called, and what is
    the equivalent UDP unit called?
  options:
  - 'TCP: packet; UDP: frame'
  - 'TCP: frame; UDP: segment'
  - 'TCP: segment; UDP: datagram'
  - 'TCP: datagram; UDP: packet'
  answer: 2
  explanation: |
    At Layer 4, TCP's PDU is a segment while UDP's is a datagram. Note "datagram" is
    overloaded: it names both the UDP L4 unit and the IP L3 unit, so context matters.
  ref: concepts.md#protocol-data-units-at-each-layer
- id: network-models-osi-tcpip-008
  difficulty: beginner
  tags:
  - tcpip
  - model
  - rfc1122
  question: |
    How many layers does the TCP/IP model define as described in RFC 1122?
  options:
  - Seven, matching OSI exactly
  - Three (Application, Network, Physical)
  - Six, adding a distinct Presentation layer for encoding
  - Four (Application, Transport, Internet, Link)
  answer: 3
  explanation: |
    RFC 1122 defines four layers: Application, Transport, Internet, and Link. Many
    textbooks show a five-layer version by splitting the Link layer into separate
    Data Link and Physical layers.
  ref: concepts.md#the-tcpip-model
- id: network-models-osi-tcpip-009
  difficulty: intermediate
  tags:
  - tcpip
  - osi
  - mapping
  question: |
    Which OSI layers are collapsed into the single Application layer of the TCP/IP
    model?
  options:
  - Layers 5, 6, and 7
  - Layers 1 and 2
  - Layers 3 and 4
  - Layers 2, 3, and 4
  answer: 0
  explanation: |
    The TCP/IP model folds OSI's Session (5), Presentation (6), and Application (7)
    layers into one Application layer, reflecting that few real protocols map cleanly
    to just the session or presentation layer.
  ref: concepts.md#osi-vs-tcpip-mapping
- id: network-models-osi-tcpip-010
  difficulty: intermediate
  tags:
  - tcpip
  - link
  - mapping
  question: |
    In RFC 1122's four-layer TCP/IP model, which OSI layers does the "Link" layer
    correspond to?
  options:
  - Data Link and Network (OSI 2 and 3)
  - Physical and Data Link (OSI 1 and 2)
  - The Network layer alone (OSI layer 3)
  - The Transport layer alone (OSI layer 4)
  answer: 1
  explanation: |
    RFC 1122's Link (Network Access) layer bundles OSI's Physical (1) and Data Link
    (2) layers. The five-layer textbook variant splits these back apart.
  ref: concepts.md#the-tcpip-model
- id: network-models-osi-tcpip-011
  difficulty: beginner
  tags:
  - network
  - layer3
  - ip
  question: |
    Which OSI layer is responsible for logical addressing (IP addresses) and routing
    packets between different networks?
  options:
  - Data Link (Layer 2)
  - Transport (Layer 4)
  - Network (Layer 3)
  - Physical (Layer 1)
  answer: 2
  explanation: |
    The Network layer (L3) handles logical addressing (IP) and routing/forwarding
    across networks. It is the first layer that can reach a host not on the local
    link.
  ref: concepts.md#the-osi-seven-layer-model
- id: network-models-osi-tcpip-012
  difficulty: beginner
  tags:
  - datalink
  - layer2
  - mac
  question: |
    MAC (hardware) addresses are used for node-to-node delivery at which layer?
  options:
  - Network (Layer 3)
  - Transport (Layer 4)
  - Session (Layer 5)
  - Data Link (Layer 2)
  answer: 3
  explanation: |
    MAC addresses operate at the Data Link layer (L2). They deliver a frame across a
    single hop (one link/segment). IP addresses (L3) handle end-to-end delivery
    across many hops.
  ref: concepts.md#the-osi-seven-layer-model
- id: network-models-osi-tcpip-013
  difficulty: intermediate
  tags:
  - arp
  - layer2
  - protocols
  question: |
    At which layer is ARP (Address Resolution Protocol) generally classified?
  options:
  - Data Link (Layer 2)
  - Application (Layer 7)
  - Transport (Layer 4)
  - Network (Layer 3)
  answer: 0
  explanation: |
    ARP maps an IP address to a MAC address and is carried directly inside an
    Ethernet frame (not inside IP), so it is treated as a Layer 2 protocol —
    sometimes called "Layer 2.5" because it bridges L2 and L3.
  ref: concepts.md#protocols-at-each-layer
- id: network-models-osi-tcpip-014
  difficulty: intermediate
  tags:
  - icmp
  - layer3
  - protocols
  question: |
    Ping and traceroute rely on ICMP. At which layer does ICMP operate?
  options:
  - Layer 4 (Transport)
  - Layer 3 (Network)
  - Layer 7 (Application)
  - Layer 2 (Data Link)
  answer: 1
  explanation: |
    ICMP is a Layer 3 (Network) protocol. It rides inside IP packets and provides
    control and error reporting (echo request/reply, destination unreachable). It has
    no port numbers because it is not a transport protocol.
  ref: concepts.md#protocols-at-each-layer
- id: network-models-osi-tcpip-015
  difficulty: beginner
  tags:
  - encapsulation
  - headers
  - fundamentals
  question: |
    What is "encapsulation" in the context of network models?
  options:
  - Encrypting the application data with TLS before it is placed on the wire
  - Compressing each packet's payload so that it fits within the link MTU
  - Each layer wrapping the data from the layer above with its own header (and trailer)
  - Splitting a large file into equal-sized blocks for storage on the disk
  answer: 2
  explanation: |
    Encapsulation is the process by which each layer, on the way down the stack, adds
    its own header (and at L2 a trailer) around the PDU handed down from the layer
    above. The receiver reverses this via de-encapsulation.
  ref: concepts.md#encapsulation-and-de-encapsulation
- id: network-models-osi-tcpip-016
  difficulty: intermediate
  tags:
  - encapsulation
  - routing
  - mac
  question: |
    As a packet is forwarded across multiple router hops, which addresses are
    rewritten at each hop and which stay the same end-to-end (ignoring NAT)?
  options:
  - IP addresses change each hop; MAC addresses stay the same
  - Both the IP and the MAC addresses are rewritten at every hop along the path
  - Neither changes; the entire packet is copied byte-for-byte and forwarded verbatim
  - MAC addresses (L2) are rewritten each hop; IP addresses (L3) stay the same
  answer: 3
  explanation: |
    At every router hop the Layer 2 frame header (source and destination MAC) is
    rewritten for the next link, while the Layer 3 source/destination IP addresses
    stay constant end-to-end (barring NAT). The TTL also decrements each hop.
  ref: concepts.md#encapsulation-and-de-encapsulation
- id: network-models-osi-tcpip-017
  difficulty: beginner
  tags:
  - devices
  - hub
  - layer1
  question: |
    At which OSI layer does a traditional network hub operate?
  options:
  - Layer 1 (Physical)
  - Layer 2 (Data Link)
  - Layer 3 (Network)
  - Layer 4 (Transport)
  answer: 0
  explanation: |
    A hub is a Layer 1 (Physical) device. It simply regenerates and floods the
    electrical signal out of all ports with no understanding of addresses, keeping
    everything in a single collision domain.
  ref: concepts.md#devices-at-each-layer
- id: network-models-osi-tcpip-018
  difficulty: beginner
  tags:
  - devices
  - switch
  - layer2
  question: |
    A standard network switch makes forwarding decisions based on which information?
  options:
  - IP addresses
  - MAC addresses
  - TCP/UDP port numbers
  - HTTP URLs
  answer: 1
  explanation: |
    A switch operates at Layer 2 and forwards frames based on MAC addresses, learning
    a MAC-address table so it sends each frame only out the correct port instead of
    flooding like a hub.
  ref: concepts.md#devices-at-each-layer
- id: network-models-osi-tcpip-019
  difficulty: beginner
  tags:
  - devices
  - router
  - layer3
  question: |
    At which layer does a router operate?
  options:
  - Layer 2 (Data Link)
  - Layer 4 (Transport)
  - Layer 3 (Network)
  - Layer 7 (Application)
  answer: 2
  explanation: |
    A router is a Layer 3 device. It reads IP addresses, consults a routing table to
    forward packets between networks, and rewrites the Layer 2 frame header at each
    hop.
  ref: concepts.md#devices-at-each-layer
- id: network-models-osi-tcpip-020
  difficulty: intermediate
  tags:
  - devices
  - load-balancer
  - layer4
  - layer7
  question: |
    What is the key difference between a Layer 4 and a Layer 7 load balancer?
  options:
  - L4 works only with connectionless UDP flows, while L7 is restricted to TCP-based protocols
  - L4 load balancers terminate TLS and decrypt HTTPS, whereas L7 cannot decrypt any traffic
  - There is no real difference; L4 and L7 are interchangeable marketing terms for one device
  - L4 balances by IP and port; L7 reads application data such as HTTP URLs, headers, and cookies
  answer: 3
  explanation: |
    An L4 load balancer distributes traffic based on IP address and TCP/UDP port,
    with no visibility into the application payload — fast and protocol-agnostic. An
    L7 load balancer inspects the HTTP request (path, headers, cookies) for
    content-based routing and can terminate TLS.
  ref: concepts.md#devices-at-each-layer
- id: network-models-osi-tcpip-021
  difficulty: intermediate
  tags:
  - devices
  - decision-rule
  - layers
  question: |
    What is the general rule for deciding "what layer" a networking device operates at?
  options:
  - The highest-layer header it reads to make a forwarding decision
  - The layer number always equals the count of physical ports on the chassis
  - The physical rack size of the device, where larger units live at higher layers
  - Whichever layer the vendor prints on the datasheet, regardless of headers read
  answer: 0
  explanation: |
    A device operates "at layer N" if N is the highest header it inspects to make a
    forwarding decision. A switch could carry an IP packet but decides using the MAC
    header (L2); an L7 load balancer decides using the HTTP request (L7).
  ref: concepts.md#devices-at-each-layer
- id: network-models-osi-tcpip-022
  difficulty: intermediate
  tags:
  - tls
  - presentation
  - debate
  question: |
    In the strict OSI model, which layer is most commonly associated with TLS/SSL
    encryption?
  options:
  - Transport (Layer 4)
  - Presentation (Layer 6)
  - Network (Layer 3)
  - Data Link (Layer 2)
  answer: 1
  explanation: |
    OSI purists map TLS/SSL to the Presentation layer (L6) because it handles
    encryption/encoding, with its handshake/session aspects touching the Session layer
    (L5). In the TCP/IP model, however, TLS is simply part of the application layer.
  ref: concepts.md#where-does-tls-sit
- id: network-models-osi-tcpip-023
  difficulty: advanced
  tags:
  - tls
  - layers
  - debate
  question: |
    Operationally, where does TLS sit relative to the other protocols in a typical
    HTTPS connection?
  options:
  - Below IP at Layer 3, encrypting packets directly as they hit the physical transmission medium
  - Inside the Ethernet frame header at Layer 2, so each frame is encrypted before it reaches IP
  - On top of TCP (Layer 4) and beneath the application protocol like HTTP (Layer 7)
  - Between the IP layer and the Data Link layer, wrapping every packet just before framing occurs
  answer: 2
  explanation: |
    TLS runs on top of the reliable TCP byte stream (Layer 4) and beneath the
    application protocol (HTTP, Layer 7), handing the application an encrypted stream.
    That "between L4 and L7" position is why it is sometimes informally called
    "Layer 4.5."
  ref: concepts.md#where-does-tls-sit
- id: network-models-osi-tcpip-024
  difficulty: beginner
  tags:
  - mnemonic
  - layers
  - ordering
  question: |
    The mnemonic "Please Do Not Throw Sausage Pizza Away" lists the OSI layers in
    which direction?
  options:
  - 'Top-down: Application, Presentation, Session, Transport, Network, Data Link, Physical'
  - In order of raw throughput, listing the fastest-switching layers before the slower ones
  - In strict alphabetical order of each layer name, from Application through Transport
  - 'Bottom-up: Physical, Data Link, Network, Transport, Session, Presentation, Application'
  answer: 3
  explanation: |
    "Please Do Not Throw Sausage Pizza Away" reads bottom-up (L1→L7): Physical, Data
    Link, Network, Transport, Session, Presentation, Application. The top-down version
    is "All People Seem To Need Data Processing."
  ref: concepts.md#mnemonics
- id: network-models-osi-tcpip-025
  difficulty: beginner
  tags:
  - why-layering
  - abstraction
  - fundamentals
  question: |
    What is a primary benefit of organizing networking into layers?
  options:
  - 'Abstraction: each layer solves one problem and hides its internals, enabling interoperability and
    independent evolution'
  - It guarantees zero header overhead by sharing one combined header across all layers
  - It removes the need for IP addresses because each layer resolves destinations on its own
  - It forces every network link to run at an identical, standardized transmission speed
  answer: 0
  explanation: |
    Layering provides separation of concerns: each layer exposes a simple service and
    hides its internals. This enables interoperability across vendors and independent
    evolution (e.g., IPv4→IPv6, or Wi-Fi replacing the physical layer) without
    rewriting the whole stack.
  ref: concepts.md#why-layering-matters
- id: network-models-osi-tcpip-026
  difficulty: advanced
  tags:
  - why-layering
  - hourglass
  - ip
  question: |
    The "hourglass" model of the Internet refers to the idea that:
  options:
  - Aggregate Internet traffic peaks at midday and tapers overnight, tracing an hourglass curve
  - There are many application and link technologies, but everyone agrees on IP as the narrow waist in
    the middle
  - TCP and UDP each carry almost exactly half of all packets sent across the Internet
  - The total number of deployed backbone routers roughly doubles in size every single year
  answer: 1
  explanation: |
    The hourglass describes IP as the narrow waist: many diverse protocols exist above
    (HTTP, DNS, etc.) and below (Ethernet, Wi-Fi, fiber), but nearly everything
    converges on IP in the middle. This is what lets any application run over any
    link technology.
  ref: concepts.md#why-layering-matters
- id: network-models-osi-tcpip-027
  difficulty: intermediate
  tags:
  - pdu
  - mnemonic
  - ordering
  question: |
    Reading the stack from the top (application) down to the physical layer, what is
    the correct order of PDU names?
  options:
  - Bits, Frame, Packet, Segment, Data
  - Packet, Segment, Data, Frame, Bits
  - Data, Segment, Packet, Frame, Bits
  - Segment, Data, Packet, Bits, Frame
  answer: 2
  explanation: |
    Top-down the PDUs are Data (upper layers), Segment (Transport), Packet (Network),
    Frame (Data Link), Bits (Physical) — mnemonic "Do Sergeants Pay For Beer?"
  ref: concepts.md#protocol-data-units-at-each-layer
- id: network-models-osi-tcpip-028
  difficulty: intermediate
  tags:
  - dns
  - application
  - protocols
  question: |
    At which layer does DNS operate?
  options:
  - Network (Layer 3)
  - Transport (Layer 4)
  - Data Link (Layer 2)
  - Application (Layer 7)
  answer: 3
  explanation: |
    DNS is an application-layer (L7) protocol, even though it is core infrastructure.
    It typically runs over UDP (and TCP) on port 53. DHCP is similarly an
    application-layer protocol.
  ref: concepts.md#protocols-at-each-layer
- id: network-models-osi-tcpip-029
  difficulty: intermediate
  tags:
  - transport
  - tcp
  - udp
  - layer4
  question: |
    Which pair of protocols are the primary Transport-layer (Layer 4) protocols?
  options:
  - TCP and UDP
  - IP and ICMP
  - Ethernet and ARP
  - HTTP and DNS
  answer: 0
  explanation: |
    TCP and UDP are the main Layer 4 transport protocols. IP and ICMP are Layer 3;
    Ethernet and ARP are Layer 2; HTTP and DNS are Layer 7 applications.
  ref: concepts.md#protocols-at-each-layer
- id: network-models-osi-tcpip-030
  difficulty: beginner
  tags:
  - physical
  - layer1
  - pdu
  question: |
    What does the Physical layer (Layer 1) actually transmit?
  options:
  - Frames with MAC addresses
  - Raw bits as signals (voltages, light, radio)
  - IP packets with routing headers
  - TCP segments with port numbers
  answer: 1
  explanation: |
    The Physical layer transmits raw bits as physical signals over the medium —
    voltages on copper, light pulses on fiber, radio waves for wireless. It has no
    concept of addressing or framing.
  ref: concepts.md#the-osi-seven-layer-model
- id: network-models-osi-tcpip-031
  difficulty: intermediate
  tags:
  - de-encapsulation
  - receiving
  - layers
  question: |
    On the receiving host, in what order do the layers process an incoming message?
  options:
  - Application first, reading the user data before handing bits down toward the Physical layer
  - Transport first to reassemble segments, then Physical to read bits, and finally the Network layer
  - Physical first (bits → frame), then up the stack, stripping each header until the application gets
    the data
  - All seven layers process the incoming message simultaneously in parallel to reduce latency
  answer: 2
  explanation: |
    Receiving reverses encapsulation: the NIC reassembles bits into a frame (L1→L2),
    the link layer checks the FCS and strips the Ethernet header, IP strips its header
    (L3), TCP strips its header and reorders/acks (L4), and finally the application
    receives the raw data (L7).
  ref: concepts.md#encapsulation-and-de-encapsulation
- id: network-models-osi-tcpip-032
  difficulty: intermediate
  tags:
  - osi
  - tcpip
  - differences
  question: |
    Which statement best captures a real difference between the OSI model and the
    TCP/IP model?
  options:
  - OSI protocols run the actual Internet backbone today, while TCP/IP remains a purely theoretical model
  - TCP/IP defines strictly more layers than OSI by splitting the transport layer into two halves
  - The two models are identical apart from the layer names, so either can be used interchangeably
  - OSI was designed as a reference/teaching framework before its protocols; TCP/IP was distilled from
    protocols that already worked
  answer: 3
  explanation: |
    OSI was designed top-down as a protocol-independent reference model; its protocol
    suite saw little deployment. TCP/IP was built from running code (TCP, IP) and is
    what the Internet actually runs on. OSI survives as the vocabulary for describing
    layers.
  ref: concepts.md#osi-vs-tcpip-mapping
- id: network-models-osi-tcpip-033
  difficulty: intermediate
  tags:
  - scenario
  - troubleshooting
  - layers
  question: |
    You can successfully ping a web server by IP, but the web page will not load in a
    browser. Which layers are most likely fine, and where should you look?
  options:
  - Layer 3 connectivity is fine; look higher — DNS, TCP handshake, TLS, or the L7 application
  - Layer 7 is fine, so the problem must be a bad cable or dead port down at the Physical layer
  - The router along the path is down at Layer 3, which is why the browser cannot reach the server
  - MAC-address resolution has failed at Layer 2, breaking delivery on the local network segment
  answer: 0
  explanation: |
    A successful ping proves Layer 3 (IP) reachability and everything below it works.
    The failure is therefore higher up: DNS resolution, the TCP handshake on port
    80/443, TLS negotiation, or the application itself. Debugging by layer localizes
    the fault quickly.
  ref: concepts.md#common-interview-mapping-questions
- id: network-models-osi-tcpip-034
  difficulty: intermediate
  tags:
  - scenario
  - devices
  - layer7
  question: |
    An operations team needs to route incoming requests to different backend pools
    based on the URL path (e.g., /images vs /api). Which device is appropriate?
  options:
  - A Layer 1 hub that floods bits to all ports
  - A Layer 7 (application) load balancer
  - A Layer 2 switch forwarding on MAC addresses
  - A Layer 4 load balancer keyed on IP and port
  answer: 1
  explanation: |
    Routing by URL path requires reading the HTTP request, which only a Layer 7
    (application) load balancer or reverse proxy can do. A Layer 4 load balancer sees
    only IP and port and cannot inspect the path.
  ref: concepts.md#devices-at-each-layer
- id: network-models-osi-tcpip-035
  difficulty: advanced
  tags:
  - routing-protocols
  - layer3
  - gotcha
  question: |
    Routing protocols like OSPF, RIP, and BGP run over different transports (IP,
    UDP, and TCP respectively). Conceptually, which layer's function do they all
    serve?
  options:
  - They are Layer 2 framing protocols that build and switch Ethernet frames on the local link
  - They are Layer 4 congestion-control algorithms that pace segment transmission end-to-end
  - They manage Layer 3 (Network) routing tables
  - They are Layer 7 encryption protocols that secure application payloads before transmission
  answer: 2
  explanation: |
    Despite running over different transports (OSPF directly over IP protocol 89, RIP
    over UDP, BGP over TCP), all of them exist to build and maintain Layer 3 routing
    tables — their purpose is a Network-layer function.
  ref: concepts.md#protocols-at-each-layer
- id: network-models-osi-tcpip-036
  difficulty: beginner
  tags:
  - presentation
  - layer6
  - roles
  question: |
    Which of the following is a core responsibility of the OSI Presentation layer
    (Layer 6)?
  options:
  - Routing packets between separate networks and choosing the next hop from a routing table
  - Assigning MAC hardware addresses and arbitrating access to the shared physical medium
  - Establishing and tearing down reliable TCP connections with sequence numbers and acks
  - Data translation, encoding, compression, and encryption
  answer: 3
  explanation: |
    The Presentation layer ensures data is in a form the application understands:
    character-set translation, serialization/encoding, compression, and encryption.
    Routing is L3, MAC addressing is L2, and TCP connections are L4.
  ref: concepts.md#the-osi-seven-layer-model
- id: network-models-osi-tcpip-037
  difficulty: beginner
  tags:
  - session
  - layer5
  - roles
  question: |
    What is the main job of the OSI Session layer (Layer 5)?
  options:
  - Establishing, managing, and terminating sessions/dialogs between applications
  - Transmitting raw bits as voltage signals over the copper physical medium
  - Fragmenting oversized IP packets so they fit within the next link's MTU
  - Calculating the Ethernet frame check sequence used to detect bit errors
  answer: 0
  explanation: |
    The Session layer opens, maintains, synchronizes (checkpointing), and closes
    conversations between applications — dialog control. In TCP/IP this function is
    absorbed into the application layer.
  ref: concepts.md#the-osi-seven-layer-model
- id: network-models-osi-tcpip-038
  difficulty: intermediate
  tags:
  - tcpip
  - five-layer
  - textbook
  question: |
    In the five-layer TCP/IP model commonly used in textbooks, what are the two
    bottom layers (from top to bottom)?
  options:
  - Transport and Network
  - Data Link and Physical
  - Internet and Transport
  - Session and Presentation
  answer: 1
  explanation: |
    The five-layer textbook model splits RFC 1122's single "Link" layer into Data Link
    and Physical, giving Application, Transport, Network, Data Link, Physical from top
    to bottom.
  ref: concepts.md#the-tcpip-model
- id: network-models-osi-tcpip-039
  difficulty: advanced
  tags:
  - quic
  - transport
  - layers
  - gotcha
  question: |
    Why is QUIC's placement in the layered model considered ambiguous?
  options:
  - It runs directly on the physical medium as raw signaling, bypassing IP, UDP, and every transport header
  - It fully replaces IP at Layer 3, providing its own end-to-end packet addressing and routing across networks
  - It builds reliability, encryption (TLS 1.3), and multiplexed streams on top of UDP, blurring the transport
    and higher layers
  - It is strictly an application-layer protocol with no transport features, relying entirely on TCP beneath it
  answer: 2
  explanation: |
    QUIC runs over UDP (a minimal L4 protocol) but re-implements reliability,
    ordering, congestion control, and TLS 1.3 encryption plus stream multiplexing —
    functions that span transport and higher layers — which is why its exact layer is
    debated.
  ref: concepts.md#where-does-tls-sit
- id: network-models-osi-tcpip-040
  difficulty: intermediate
  tags:
  - nat
  - layers
  - gotcha
  question: |
    Network Address Translation (NAT), and specifically NAPT/PAT, operates at which
    layer(s) and why does it break strict layering?
  options:
  - Layer 1 only; it operates by altering the physical voltages on the wire, well below any IP or port fields
  - Layer 7 only; it works by rewriting fields inside the application's HTTP headers rather than any IP or port
  - Layer 2 only; it operates by rewriting the source and destination MAC addresses inside each Ethernet frame
  - Layer 3 (rewrites IP addresses), and NAPT also touches Layer 4 (rewrites ports), violating clean layer
    separation
  answer: 3
  explanation: |
    NAT rewrites Layer 3 IP addresses, and port-based NAPT/PAT also rewrites Layer 4
    port numbers. Because a device is reaching into both L3 and L4 headers, NAT
    deliberately breaks the clean separation between layers.
  ref: concepts.md#common-follow-up-questions
- id: network-models-osi-tcpip-041
  difficulty: beginner
  tags:
  - transport
  - tcp
  - reliability
  question: |
    Which Transport-layer protocol adds reliability, ordering, flow control, and
    congestion control?
  options:
  - TCP
  - UDP
  - IP
  - ARP
  answer: 0
  explanation: |
    TCP provides reliable, ordered, connection-oriented delivery with flow and
    congestion control. UDP is the minimal alternative (just ports plus a checksum)
    used when speed matters more than reliability.
  ref: concepts.md#protocols-at-each-layer
- id: network-models-osi-tcpip-042
  difficulty: intermediate
  tags:
  - scenario
  - layer2
  - subnets
  question: |
    Why can a plain Layer 2 switch not route traffic between two different IP subnets?
  options:
  - Because switches forward only UDP datagrams and silently discard any TCP or ICMP traffic between subnets
  - Because it only reads MAC addresses and has no concept of IP networks; crossing subnets requires a
    Layer 3 device
  - Because a switch drops every broadcast frame, so the ARP needed to reach the other subnet never completes
  - Because Layer 2 switches understand only IPv6 addressing and cannot bridge legacy IPv4 subnet traffic
  answer: 1
  explanation: |
    A Layer 2 switch forwards based solely on MAC addresses and has no understanding
    of IP subnets. Moving traffic between different subnets is a routing (Layer 3)
    function requiring a router or a Layer 3 switch.
  ref: concepts.md#common-interview-mapping-questions
- id: network-models-osi-tcpip-043
  difficulty: intermediate
  tags:
  - encapsulation
  - headers
  - overhead
  question: |
    A typical IPv4 + TCP header adds how much overhead before any application payload,
    and why does this matter?
  options:
  - Exactly 1 byte of framing overhead; it is negligible and never affects throughput on any link
  - About 1500 bytes per packet, matching the MTU, so header overhead effectively doubles every transmission
  - About 40 bytes (20 IPv4 + 20 TCP); it matters most for small packets
  - Zero bytes; the headers are transmitted out-of-band on a separate control channel from the payload
  answer: 2
  explanation: |
    A minimal IPv4 header (20 bytes) plus a minimal TCP header (20 bytes) is 40 bytes
    of overhead before payload. For small packets this is proportionally large, which
    motivates header compression and larger MTUs/jumbo frames.
  ref: concepts.md#common-follow-up-questions
- id: network-models-osi-tcpip-044
  difficulty: beginner
  tags:
  - devices
  - load-balancer
  - layer4
  question: |
    A Layer 4 load balancer distributes connections based primarily on what?
  options:
  - The HTTP cookies and URL paths carried inside each request's application-layer payload
  - The source and destination MAC hardware addresses read from the Ethernet frame header
  - The DNS record types (A, AAAA, CNAME) returned when resolving the backend hostname
  - IP addresses and TCP/UDP port numbers
  answer: 3
  explanation: |
    An L4 load balancer works at the transport layer, balancing traffic by IP address
    and port. It cannot see into the HTTP payload — that content-based routing is the
    job of an L7 load balancer.
  ref: concepts.md#devices-at-each-layer
- id: network-models-osi-tcpip-045
  difficulty: advanced
  tags:
  - scenario
  - arp
  - layers
  - troubleshooting
  question: |
    Two hosts on the same LAN cannot communicate, and packet captures show ARP
    requests going unanswered. At which layer is the fault, and what is failing?
  options:
  - Layer 2 — IP-to-MAC address resolution (ARP) is failing on the local link
  - Layer 4 — the TCP three-way handshake is failing to complete between the two hosts
  - Layer 7 — the client application is misconfigured and refusing to open the connection
  - Layer 3 — a router along the path is silently dropping the forwarded packets
  answer: 0
  explanation: |
    Unanswered ARP means the host cannot resolve the target IP to a MAC address, so it
    cannot even build the Ethernet frame. ARP is a Layer 2 mechanism, so the fault is
    at the Data Link layer on the local segment — not at L3, L4, or L7.
  ref: concepts.md#protocols-at-each-layer
- id: network-models-osi-tcpip-046
  difficulty: intermediate
  tags:
  - icmp
  - layer3
  - gotcha
  question: |
    Why does ICMP not use port numbers?
  options:
  - Because ICMP payloads are always encrypted, so the port fields are hidden from intermediate devices
  - Because it is a Layer 3 control protocol, not a Layer 4 transport protocol
  - Because port numbers are an optional feature that every protocol may omit to save header space
  - Because ICMP always uses the reserved port 0 implicitly, making an explicit port number unnecessary
  answer: 1
  explanation: |
    Ports are a Transport-layer (L4) construct used to multiplex among processes. ICMP
    is a Layer 3 protocol that provides IP-level control and error messaging, so it has
    no notion of ports.
  ref: concepts.md#protocols-at-each-layer
- id: network-models-osi-tcpip-047
  difficulty: beginner
  tags:
  - mnemonic
  - ordering
  - osi
  question: |
    "All People Seem To Need Data Processing" is a mnemonic for the OSI layers in
    which order?
  options:
  - 'Bottom-up: Physical, Data Link, Network, Transport, Session, Presentation, Application'
  - In descending order of each layer's typical packet size, from the largest PDU down to the smallest
  - 'Top-down: Application, Presentation, Session, Transport, Network, Data Link, Physical'
  - By the chronological year in which each layer's protocols were first standardized by ISO
  answer: 2
  explanation: |
    "All People Seem To Need Data Processing" maps top-down (L7→L1): Application,
    Presentation, Session, Transport, Network, Data Link, Physical. The reverse
    (bottom-up) mnemonic is "Please Do Not Throw Sausage Pizza Away."
  ref: concepts.md#mnemonics
- id: network-models-osi-tcpip-048
  difficulty: intermediate
  tags:
  - payload
  - encapsulation
  - principle
  question: |
    When a layer receives a PDU from the layer above, how does it treat that PDU?
  options:
  - It rewrites the upper layer's existing header so that it conforms to its own layer's framing format
  - It strips off and discards the upper layer's header, forwarding only the raw data portion that remains
  - It parses and directly modifies the application data inside the PDU before passing it further down
  - It treats the entire upper-layer PDU as opaque payload and prepends its own header
  answer: 3
  explanation: |
    Each layer treats the PDU from above as opaque payload and wraps it with its own
    header (and trailer at L2), without inspecting or altering the upper layer's
    contents. This opacity is exactly what makes the abstraction between layers work.
  ref: concepts.md#encapsulation-and-de-encapsulation
- id: network-models-osi-tcpip-049
  difficulty: advanced
  tags:
  - osi
  - history
  - adoption
  question: |
    Why did the Internet end up running on TCP/IP rather than the "official" OSI
    protocol suite?
  options:
  - TCP/IP was simpler, already working, and freely implementable while the OSI protocol suite was still
    being standardized
  - The OSI protocol suite was legally restricted and could not be implemented without an ISO license fee
  - OSI protocols required specialized purpose-built networking hardware that simply did not exist at the time
  - TCP/IP was formally mandated by ISO as the required standard, forcing vendors to abandon the OSI stack
  answer: 0
  explanation: |
    TCP/IP had running, freely implementable code when the OSI protocols were still in
    committee, so the market adopted it. The OSI reference model nonetheless remains
    the universal vocabulary for describing and comparing network layers.
  ref: concepts.md#common-follow-up-questions
- id: network-models-osi-tcpip-050
  difficulty: beginner
  tags:
  - network
  - pdu
  - terminology
  question: |
    Which single term is correctly matched to its layer?
  options:
  - Frame → Network layer
  - Segment → Transport layer
  - Packet → Data Link layer
  - Bit → Application layer
  answer: 1
  explanation: |
    Segment is the correct PDU for the Transport layer (TCP). A frame is Data Link, a
    packet is Network, and bits are Physical — the other options are all mismatched.
  ref: concepts.md#protocol-data-units-at-each-layer
- id: network-models-osi-tcpip-051
  difficulty: advanced
  tags:
  - sdu
  - pdu
  - encapsulation
  - terminology
  question: |
    In ISO 7498 terminology, what is the precise relationship between a Service Data
    Unit (SDU) and a Protocol Data Unit (PDU)?
  options:
  - An SDU is simply the encrypted form of a PDU, produced once a layer applies confidentiality protection
  - SDU and PDU are two interchangeable names for the exact same object, differing only by which layer speaks
  - A PDU is always exactly half the size of its SDU because the header consumes the other half of the unit
  - A layer's PDU is its header (PCI) plus the SDU handed down from the layer above; equivalently, the SDU
    at layer N is the PDU of layer N+1
  answer: 3
  explanation: |
    A layer receives an SDU (the payload it is asked to deliver unchanged) through its
    service interface, prepends its protocol control information (header) to form a PDU,
    and passes that down. So the SDU at layer N equals the PDU produced by layer N+1 —
    e.g., an HTTP message is TCP's SDU, and the resulting TCP segment is TCP's PDU.
  ref: concepts.md#sdu-pdu-and-sap-the-formal-vocabulary
- id: network-models-osi-tcpip-052
  difficulty: advanced
  tags:
  - sap
  - demultiplexing
  - ports
  - ethertype
  question: |
    A Service Access Point (SAP) is the demultiplexing key a layer uses to decide which
    upper-layer entity a payload belongs to. Which set correctly names the SAP at three
    layers?
  options:
  - The TTL field at L3, the frame check sequence at L2, and the TCP sequence number at the transport layer
  - EtherType/LLC-SAP at the data link, IP Protocol number at the network layer, and TCP/UDP port at the
    transport layer
  - The MAC address at L2, the IP address at L3, and the TCP receive-window size at the transport layer
  - The link MTU at L2, the DSCP priority marking at L3, and the transport-layer checksum field at L4
  answer: 1
  explanation: |
    The SAP is the field that says "hand this up to which entity." The EtherType (or
    802.2 DSAP/SSAP) selects the L3 protocol, the IP Protocol number selects the L4
    protocol (6=TCP, 17=UDP, 1=ICMP), and the port selects the process. Addresses,
    TTL, FCS, and window size are not demultiplexing keys for upper-layer selection.
  ref: concepts.md#sdu-pdu-and-sap-the-formal-vocabulary
- id: network-models-osi-tcpip-053
  difficulty: advanced
  tags:
  - horizontal-vertical
  - peer-layer
  - protocol-vs-service
  question: |
    In layered-model terms, what is the difference between a "protocol" and a "service"?
  options:
  - A protocol is horizontal — rules governing communication between peer layers on different hosts; a service
    is vertical — what a layer offers to the adjacent layer on the same host
  - A protocol always encrypts the data it carries, whereas a service exposes that same data in plaintext
  - A protocol is a concept used only within the TCP/IP model, while a service exists only within the OSI model
  - They are exact synonyms with no meaningful distinction, describing the same layered interaction twice
  answer: 0
  explanation: |
    A protocol defines the horizontal, peer-to-peer conversation (TCP-to-TCP,
    IP-to-IP) — logically direct even though bits physically traverse both full stacks.
    A service is the vertical interface a layer exposes to the layer directly above/below
    on the same host, accessed via SAPs. OSI carefully separates the two.
  ref: concepts.md#horizontal-vs-vertical-communication
- id: network-models-osi-tcpip-054
  difficulty: intermediate
  tags:
  - datalink
  - llc
  - mac
  - sublayers
  question: |
    The IEEE splits the Data Link layer into two sublayers. What does each do?
  options:
  - LLC handles voltages; MAC handles routing
  - MAC assigns IP addresses; LLC assigns port numbers
  - MAC handles physical addressing and medium access; LLC (802.2) handles protocol multiplexing and optional
    flow/error control
  - Both sublayers do identical work for redundancy
  answer: 2
  explanation: |
    The MAC sublayer handles framing, MAC addressing, and medium-access arbitration
    (CSMA/CD on Ethernet, CSMA/CA on Wi-Fi) — where 802.3 and 802.11 differ. The LLC
    sublayer (IEEE 802.2) multiplexes upper-layer protocols via DSAP/SSAP and can add
    flow/error control. Neither deals with IP addresses or ports.
  ref: concepts.md#data-link-sublayers-llc-and-mac
- id: network-models-osi-tcpip-055
  difficulty: expert
  tags:
  - ethernet
  - ethertype
  - framing
  - wire-format
  question: |
    In an Ethernet II frame, the 2-byte field after the source MAC can be interpreted as
    either a length or an EtherType. How is the ambiguity resolved, and what does 0x0800
    indicate?
  options:
  - Values ≤ 1500 are treated as an 802.3 length field, values ≥ 1536 (0x0600) as an EtherType; 0x0800 is
    an EtherType meaning the payload is IPv4
  - The field is always a length in Ethernet II, so 0x0800 decodes to exactly 2048 bytes of payload
    that the receiver reads off the wire
  - The field is always an EtherType regardless of its value, and 0x0800 is the code that selects
    802.11 Wi-Fi framing for the encapsulated payload
  - 0x0800 is the initialization seed for the frame check sequence CRC-32 and has nothing to do with
    selecting the upper-layer protocol
  answer: 0
  explanation: |
    Because the maximum Ethernet payload is 1500, values up to 1500 are a length field
    (802.3/LLC framing) and values of 1536 (0x0600) or greater are an EtherType (Ethernet
    II). 0x0800 is the EtherType for IPv4 (0x86DD IPv6, 0x0806 ARP, 0x8100 VLAN), acting
    as the data-link SAP that selects the L3 protocol.
  ref: concepts.md#data-link-sublayers-llc-and-mac
- id: network-models-osi-tcpip-056
  difficulty: expert
  tags:
  - demux-chain
  - encapsulation
  - wire-format
  - scenario
  question: |
    A receiver dissects an incoming Ethernet frame. Which sequence of header fields does
    it read, in order, to deliver the payload to the correct listening socket for an
    HTTPS connection?
  options:
  - TCP destination port (443) → IP Protocol field (6) → EtherType (0x0800) → destination MAC address
  - IP TTL field → Ethernet FCS trailer → TCP sequence number → TCP receive-window size
  - EtherType (0x0800 → IPv4) → IP Protocol field (6 → TCP) → TCP destination port (443)
  - IP destination address → destination MAC address → EtherType (0x0800) → the TLS SNI hostname extension
  answer: 2
  explanation: |
    Demultiplexing walks down-to-up through one SAP per layer: the EtherType selects the
    L3 protocol (0x0800 = IPv4), the IP Protocol field selects the L4 protocol (6 = TCP),
    and the TCP destination port selects the socket/process (443). Each layer reads
    exactly the one field that identifies the next entity.
  ref: concepts.md#byte-level-encapsulation-and-the-demux-chain
- id: network-models-osi-tcpip-057
  difficulty: expert
  tags:
  - ethernet
  - mtu
  - frame-size
  - wire-format
  question: |
    Standard Ethernet has a 1500-byte MTU. Including headers and trailer (but excluding
    preamble and interframe gap), what is the size of a full-payload untagged Ethernet II
    frame, and how does an 802.1Q VLAN tag change it?
  options:
  - 1500 bytes untagged, because the MTU already includes the header and FCS; an 802.1Q VLAN tag leaves
    it unchanged at 1500 bytes
  - 1460 bytes untagged, matching the TCP MSS payload size; a VLAN tag reduces it by 20 bytes to 1440
  - 9000 bytes untagged, since standard Ethernet frames are jumbo-sized by default; a VLAN tag does not
    change the total
  - 1518 bytes untagged (14 B header + 1500 payload + 4 B FCS); 1522 bytes with a 4-byte 802.1Q tag
  answer: 3
  explanation: |
    The 1500 B MTU is the IP payload. Adding the 14 B Ethernet header and 4 B FCS gives a
    1518 B frame; an 802.1Q VLAN tag adds 4 bytes for 1522. The 7+1 B preamble/SFD and the
    12 B interframe gap are Layer 1 and are not part of the frame or MTU. 1460 is the IPv4
    MSS, not a frame size.
  ref: concepts.md#byte-level-encapsulation-and-the-demux-chain
- id: network-models-osi-tcpip-058
  difficulty: expert
  tags:
  - mss
  - mtu
  - tcp
  - ipv6
  question: |
    Two hosts negotiate a TCP connection over an IPv6 path with a 1500-byte link MTU.
    Assuming no IPv6 extension headers, what MSS should each host advertise, and where is
    that value carried?
  options:
  - 1460 bytes (1500 − 20 B IP header − 20 B TCP header), carried as a field in every TCP data segment's header
  - 1500 bytes, equal to the full link MTU, carried directly inside the fixed IPv6 header as a dedicated field
  - 9000 bytes, the jumbo-frame value negotiated by ICMPv6 messages exchanged right after the handshake completes
  - 1440 bytes (1500 − 40 B IPv6 header − 20 B TCP header), advertised as a TCP option in the SYN only
  answer: 3
  explanation: |
    MSS = MTU − IP header − TCP header. IPv6's base header is 40 bytes (vs 20 for IPv4),
    so 1500 − 40 − 20 = 1440 B (IPv4 would give 1460). MSS is advertised as a TCP option
    present only in the SYN, and each side announces what it is willing to receive; it is
    not repeated in every segment.
  ref: concepts.md#mtu-mss-and-path-mtu-discovery
- id: network-models-osi-tcpip-059
  difficulty: expert
  tags:
  - pmtud
  - scenario
  - troubleshooting
  - icmp
  question: |
    Over a GRE tunnel, small requests and SSH work fine, but any large file download or
    bulk HTTP response stalls and eventually times out. What is the most likely root
    cause?
  options:
  - The application is single-threaded, so it can only service one small request at a time and stalls the
    moment a large sequential transfer is requested
  - A PMTUD blackhole — the tunnel lowers the effective MTU, and a firewall is dropping the ICMP "fragmentation
    needed / packet too big" messages, so the sender never shrinks its full-size segments
  - A DNS misconfiguration on the tunnel endpoint that resolves the server correctly for short-lived lookups
    but times out whenever a larger record set must be returned
  - The TCP receive window is configured far too large at both ends, overflowing router buffers and forcing
    every large transfer into repeated retransmission
  answer: 1
  explanation: |
    The signature — small packets pass, large transfers hang — is the classic PMTUD
    blackhole. GRE reduces the path MTU; a full-size DF packet is dropped downstream, but
    the ICMP Type 3 Code 4 (or ICMPv6 Type 2) that would tell the sender to shrink is
    being filtered, so the sender keeps retransmitting the too-big segment. Fixes:
    unblock the ICMP, clamp MSS on the tunnel, or use PLPMTUD.
  ref: concepts.md#mtu-mss-and-path-mtu-discovery
- id: network-models-osi-tcpip-060
  difficulty: advanced
  tags:
  - mss-clamping
  - cross-layer
  - tunnel
  question: |
    Why is TCP MSS clamping on a router or tunnel gateway described as a cross-layer
    violation, and what problem does it solve?
  options:
  - An L3/L2 device rewrites an L4 TCP option (the MSS in transiting SYNs) so both hosts size segments for
    the smallest link MTU on the path, avoiding fragmentation/PMTUD-blackhole failures
  - It encrypts the transiting payload at Layer 3 specifically to hide the L4 TCP and UDP port numbers from
    any downstream middlebox on the path
  - It transparently converts IPv4 packets into IPv6 packets while they sit in the transport layer, so both
    endpoints can interoperate across address families
  - It reorders out-of-sequence TCP segments back into order down at the data link layer before the frames
    are handed up to the IP layer
  answer: 0
  explanation: |
    MSS clamping has a router/firewall/tunnel endpoint (an L2/L3 device) reach into the
    TCP header — an L4 field — and lower the MSS advertised in SYN packets. This forces
    both endpoints to send segments that fit the path's smallest MTU, sidestepping
    fragmentation and PMTUD blackholes. Editing an L4 option from an L3 box is precisely
    the layering violation.
  ref: concepts.md#mtu-mss-and-path-mtu-discovery
- id: network-models-osi-tcpip-061
  difficulty: expert
  tags:
  - ipv6
  - fragmentation
  - pmtud
  - gotcha
  question: |
    How does fragmentation differ between IPv4 and IPv6?
  options:
  - Both IPv4 and IPv6 allow any router along the path to fragment an oversized packet freely and independently,
    reassembling it at the very next hop
  - IPv6 routers along the path may fragment oversized packets in flight, whereas IPv4 routers are forbidden
    from ever fragmenting and must drop anything too large
  - In IPv4 a router may fragment an oversized packet in flight; in IPv6 routers never fragment — only the
    source host may, via a Fragment extension header, and the minimum link MTU is 1280 bytes
  - Neither IPv4 nor IPv6 supports fragmentation at all; both simply discard any datagram that exceeds the
    outgoing link MTU and rely on the transport layer to resize it
  answer: 2
  explanation: |
    IPv4 permits in-network fragmentation by routers (unless DF is set). IPv6 forbids
    router fragmentation entirely: only the source may fragment, using a Fragment
    extension header, and it is expected to run PMTUD. Every IPv6 link must support at
    least a 1280-byte MTU. IPv6 also dropped the header checksum to reduce per-hop work.
  ref: concepts.md#ipv4-vs-ipv6-fragmentation
- id: network-models-osi-tcpip-062
  difficulty: expert
  tags:
  - router-hop
  - ipv6
  - checksum
  - scenario
  question: |
    Comparing an IPv4 packet and an IPv6 packet each traversing a router, which statement
    about what the router modifies is correct?
  options:
  - Both the IPv4 and IPv6 routers recompute their header checksum after the TTL / Hop-Limit field has been
    decremented, since both protocols carry a mandatory header checksum
  - Neither the IPv4 TTL nor the IPv6 Hop Limit is changed by a router; both fields are set once by the source
    host and remain constant across every hop on the path
  - The IPv4 router decrements TTL and recomputes the IPv4 header checksum; the IPv6 router decrements Hop
    Limit but recomputes no header checksum because IPv6 has none
  - Both routers rewrite the source and destination IP addresses at each hop to reflect the next segment,
    much as they rewrite the source and destination MAC addresses
  answer: 2
  explanation: |
    Every router decrements the IPv4 TTL / IPv6 Hop Limit. In IPv4 the header checksum
    must be recomputed because a header field changed. IPv6 deliberately has no header
    checksum, so nothing is recomputed there — a favorite gotcha. Source/destination IPs
    stay constant end-to-end (barring NAT); only MAC addresses are rewritten per hop.
  ref: concepts.md#what-changes-at-each-router-hop
- id: network-models-osi-tcpip-063
  difficulty: advanced
  tags:
  - mpls
  - layer-2.5
  - encapsulation
  question: |
    MPLS is frequently called a "Layer 2.5" protocol. Why?
  options:
  - Because it runs encapsulated inside a TCP connection on the reserved transport port 2.5, sitting halfway
    between the transport and application layers
  - Because label switch routers process it at roughly half the forwarding rate of an ordinary Layer 2
    Ethernet switch, placing it just below Layer 2 in practice
  - Because a single MPLS deployment replaces both the Ethernet framing at Layer 2 and the IP packet header
    at Layer 3 simultaneously, merging the two into one
  - Because it inserts a label shim between the L2 frame header and the L3 packet header, and label-switching
    routers forward on the label without inspecting the IP header
  answer: 3
  explanation: |
    MPLS pushes a 4-byte label between the Layer 2 header and the Layer 3 packet. Label
    switch routers forward based solely on the label, behaving like L2 switching applied
    to L3 traffic — genuinely between the two layers, hence "Layer 2.5." (ARP shares the
    nickname for a different reason: it resolves L3 addresses but rides directly in L2.)
  ref: concepts.md#mpls-and-layer-25
- id: network-models-osi-tcpip-064
  difficulty: expert
  tags:
  - control-plane
  - data-plane
  - sdn
  - devices
  question: |
    In the control-plane / data-plane framing, where do OSPF route computation and
    per-packet forwarding each belong, and why does this refine "a router is a Layer 3
    device"?
  options:
  - Both OSPF route computation and per-packet forwarding are data-plane functions; the control plane exists
    only to encrypt traffic and enforce ACLs on the fast path
  - OSPF route computation runs in the data plane at line rate in the ASIC, while per-packet forwarding is a
    control-plane task handled in software off the fast path
  - OSPF is a control-plane function that builds the forwarding table; per-packet forwarding is the data
    plane (often ASIC) that consumes it — "L3 device" really means "its data plane forwards on the L3 header"
  - Both OSPF computation and per-packet forwarding are management-plane functions, provisioned and driven
    entirely through SNMP set operations from a central manager
  answer: 2
  explanation: |
    OSPF is a control-plane protocol: it computes routes and populates the FIB, off the
    fast path, in software. The data plane then forwards each packet at line rate using
    that table, typically in hardware. So "a router is L3" precisely means its data plane
    makes forwarding decisions from the L3 (IP) header. SDN formalizes this split by
    centralizing the control plane.
  ref: concepts.md#control-plane-data-plane-and-management-plane
- id: network-models-osi-tcpip-065
  difficulty: advanced
  tags:
  - control-plane
  - management-plane
  - planes
  question: |
    Which grouping correctly assigns these functions to the data, control, and management
    planes of a network device?
  options:
  - Data plane = SNMP polling of counters; control plane = per-packet ASIC forwarding; management plane =
    running the BGP routing protocol
  - Data plane = operator SSH configuration sessions; control plane = streaming telemetry export; management
    plane = per-packet forwarding of user traffic
  - Data plane = per-packet ASIC forwarding using the FIB; control plane = BGP/OSPF/ARP/STP building that
    state; management plane = SSH/SNMP/NETCONF config and telemetry
  - All three planes forward user packets identically at line rate, differing only in which management
    console an operator uses to view the same forwarding statistics
  answer: 2
  explanation: |
    The data plane forwards packets per-packet (fast path, ASIC) from pre-built tables;
    the control plane runs routing/adjacency protocols (BGP, OSPF, ARP/NDP, STP, ICMP
    generation) that build those tables; the management plane handles configuration and
    telemetry (SSH/CLI, SNMP, NETCONF). Only the data plane actually forwards.
  ref: concepts.md#control-plane-data-plane-and-management-plane
- id: network-models-osi-tcpip-066
  difficulty: expert
  tags:
  - end-to-end
  - checksum
  - udp
  - design
  question: |
    Ethernet already protects each frame with a 32-bit CRC (FCS). Why do UDP and TCP
    still carry their own checksums?
  options:
  - The L2 CRC only guards a single hop and cannot detect corruption introduced inside a router's memory or
    across store-and-forward; end-to-end integrity must be verified end-to-end (the end-to-end argument)
  - Because the Ethernet FCS is only an 8-bit checksum and is statistically too weak to catch multi-bit
    errors, so the transport layer adds a stronger one
  - Because UDP and TCP run below Ethernet in the stack, so their checksums cover the frame before the
    weaker L2 CRC is ever appended
  - Purely for backward compatibility with legacy hardware; on modern NICs the transport checksums are
    left as zero and never actually computed or verified
  answer: 0
  explanation: |
    The Ethernet FCS is recomputed at every hop, so it only certifies that a frame
    survived the last link intact — it cannot catch bit flips that happen in a router's
    RAM/buses while the packet is being forwarded. The end-to-end argument
    (Saltzer/Reed/Clark) says a correctness check must live at the endpoints, which is why
    transport checksums exist despite the L2 CRC.
  ref: concepts.md#connection-oriented-vs-connectionless-services
- id: network-models-osi-tcpip-067
  difficulty: advanced
  tags:
  - connectionless
  - connection-oriented
  - ip
  - tcp
  question: |
    IP is a connectionless (datagram) service, yet it routinely carries connection-oriented
    TCP. What does this illustrate about layering?
  options:
  - It is a design bug; connection-oriented traffic like TCP should only ever run over a connection-oriented
    network service such as X.25 or ATM, never over connectionless IP
  - It proves TCP is actually a Layer 3 protocol that merely borrows the IP header, since only a network-layer
    protocol can add connection state to datagrams
  - It means IP must quietly establish and tear down a per-flow connection before and after every single TCP
    segment it carries across the network
  - A layer's service model (connection-oriented vs connectionless) is independent of the layers above and
    below it — reliability is layered on top of a best-effort network
  answer: 3
  explanation: |
    Reliability and connection state are service properties of a layer, not inherent to a
    layer number. IP offers a connectionless, best-effort datagram service; TCP builds
    connection-oriented reliability on top of it end-to-end. The service model of each
    layer is independent — which is exactly why IP is called a datagram protocol yet
    carries TCP fine.
  ref: concepts.md#connection-oriented-vs-connectionless-services
- id: network-models-osi-tcpip-068
  difficulty: expert
  tags:
  - ndp
  - arp
  - ipv6
  - icmpv6
  question: |
    IPv6 replaces ARP with Neighbor Discovery (NDP). What is the significant layering
    change this introduces?
  options:
  - NDP moves neighbor resolution all the way down to Layer 1, resolving addresses directly from the physical
    signaling on the medium instead of from any header
  - NDP eliminates the need for MAC addresses entirely, so IPv6 hosts deliver frames on the local link using
    only their IPv6 addresses with no hardware address at all
  - NDP is built on ICMPv6 (IP Protocol 58), so IPv6 neighbor resolution runs inside IP at Layer 3, whereas
    ARP rides directly in an Ethernet frame (EtherType 0x0806) at Layer 2
  - NDP runs over a reliable TCP connection on port 546 as a full application-layer protocol, replacing ARP's
    link-layer broadcasts with unicast transport sessions
  answer: 2
  explanation: |
    ARP has its own EtherType (0x0806) and rides directly in the L2 frame, arguing for
    Layer 2. NDP (RFC 4861) is carried in ICMPv6 messages, which live inside IPv6 — so
    IPv6 pulled neighbor/address resolution up from L2 to L3. "ARP is L2 but its IPv6
    successor NDP is L3" is a strong differentiator.
  ref: concepts.md#arp-rarp-dhcp-and-ndp-the-ipv6-twist
- id: network-models-osi-tcpip-069
  difficulty: advanced
  tags:
  - icmp
  - traceroute
  - ttl
  - scenario
  question: |
    Traceroute maps the routers along a path. Which ICMP behavior does it fundamentally
    rely on?
  options:
  - Every intermediate router along the path reflecting the probe's payload straight back to the source with
    an ICMP Type 0 echo reply that also names the router
  - Each hop proactively emitting an ICMP Type 3 Code 4 "fragmentation needed" message that carries the
    router's own address so the source can list it
  - Sending packets with increasing TTL/Hop Limit so each successive router decrements it to zero and returns
    an ICMP Type 11 "Time Exceeded" naming itself
  - Setting the DF (don't fragment) bit on each probe, which forces every router on the path to advertise its
    link MTU back to the sender along with its address
  answer: 2
  explanation: |
    Traceroute sends probes with TTL=1, 2, 3, … The router at which the TTL hits zero
    discards the packet and sends back an ICMP Type 11 (Time/Hop-Limit Exceeded), which
    reveals that hop's address. Type 3 Code 4 is PMTUD, and Type 0 is the echo reply used
    by ping — not the traceroute mechanism.
  ref: concepts.md#icmp-nuance
- id: network-models-osi-tcpip-070
  difficulty: advanced
  tags:
  - quic
  - http3
  - layers
  - ossification
  question: |
    QUIC is described as deliberately collapsing traditional layer boundaries. Which
    statement best captures how and why?
  options:
  - QUIC replaces IP at Layer 3 and runs its own interior routing protocol, so it computes next-hop paths
    across networks instead of relying on the existing IP infrastructure
  - QUIC is a user-space transport over UDP that integrates reliability, per-stream multiplexing, and mandatory
    TLS 1.3 into one protocol, letting it evolve without kernel/middlebox changes and avoiding L4 ossification
  - QUIC is a pure application-layer protocol with no transport features of its own, delegating all ordering,
    retransmission, and congestion control to the TCP connection running beneath it
  - QUIC runs directly over raw Ethernet frames, bypassing both IP and UDP entirely so that it never incurs
    any network- or transport-layer header overhead
  answer: 1
  explanation: |
    QUIC (RFC 9000) runs in user space over UDP and folds together L4 reliability/
    congestion control, per-stream multiplexing (no cross-stream head-of-line blocking),
    connection migration, and integrated TLS 1.3 (RFC 9001) — even encrypting most of its
    transport header. Living over UDP in user space lets it deploy without OS or middlebox
    upgrades, sidestepping the ossification that blocked new L4 protocols. HTTP/3 (RFC
    9114) rides on top.
  ref: concepts.md#quic-and-http3-collapsing-the-layers
- id: network-models-osi-tcpip-071
  difficulty: advanced
  tags:
  - tunneling
  - encapsulation
  - vxlan
  - distinction
  question: |
    How does tunneling differ from ordinary encapsulation?
  options:
  - Tunneling only applies to wireless links, where the encapsulated packet must be re-wrapped to survive the
    radio medium, while ordinary encapsulation is used exclusively on wired connections
  - Tunneling strips off and discards all of the inner packet's existing headers to save space on the wire,
    then rebuilds them from scratch once the packet exits the far end of the tunnel
  - Tunneling encapsulates a complete packet (a full protocol stack) inside another packet — e.g. VXLAN carries
    L2 Ethernet frames inside UDP — whereas ordinary encapsulation just wraps the next-higher PDU one layer
    deeper
  - There is no difference between the two; tunneling and ordinary encapsulation are fully interchangeable
    terms that describe the exact same header-wrapping operation
  answer: 2
  explanation: |
    Ordinary encapsulation wraps layer N+1's PDU as layer N's payload — one layer deeper.
    Tunneling puts an entire packet (its own full stack) inside another packet's payload:
    GRE and IP-in-IP carry IP inside IP, VXLAN carries Ethernet frames inside UDP/IP,
    IPsec ESP encrypts and encapsulates IP. This nesting is exactly why tunnels reduce the
    effective MTU.
  ref: concepts.md#encapsulation-vs-tunneling-vs-multiplexing
- id: network-models-osi-tcpip-072
  difficulty: expert
  tags:
  - cross-layer
  - middlebox
  - dscp
  - qos
  question: |
    Which of the following is the clearest example of an application-layer intent being
    encoded into a network-layer field, deliberately crossing layers?
  options:
  - A switch learning source MAC addresses into its CAM table so it can forward later frames out the correct
    egress port instead of flooding them to every port
  - Setting the DSCP bits in the IPv4/IPv6 header to mark a packet's QoS class based on the application's
    priority
  - TCP retransmitting a segment that was lost in transit after its retransmission timer expires without an
    acknowledgement arriving from the receiver
  - A router decrementing the IPv4 TTL (or IPv6 Hop Limit) field by one at each hop and discarding the packet
    once that counter reaches zero
  answer: 1
  explanation: |
    DSCP marking takes an application/business notion of priority (L7 intent) and writes
    it into the Differentiated Services field of the IP header (L3) so routers can apply
    per-hop queuing. That is application intent expressed in a network-layer field — a
    deliberate cross-layer coupling. MAC learning, retransmission, and TTL decrement each
    stay within one layer.
  ref: concepts.md#cross-layer-violations-in-practice
- id: network-models-osi-tcpip-073
  difficulty: expert
  tags:
  - layering-harmful
  - rfc3439
  - tradeoffs
  question: |
    RFC 3439 §3 ("Layering Considered Harmful") argues strict layering has real costs.
    Which is a concrete example of such a cost?
  options:
  - Layering makes IP addresses unnecessary, since each layer independently discovers its own destination
    and forwards data without any shared network-wide addressing scheme
  - Redundant work and hidden cross-layer interactions — e.g. checksums computed at both L2 and L4, or TCP
    misinterpreting wireless loss as congestion and needlessly throttling
  - Layering forces every packet to be encrypted twice, once by the presentation layer and again by the
    transport layer, permanently doubling the CPU cost of all traffic
  - Layering prevents any protocol from ever being replaced, because every layer is permanently hard-wired
    to the exact implementation of the layers directly above and below it
  answer: 1
  explanation: |
    RFC 3439 highlights costs like duplicated functionality (error checks at multiple
    layers) and harmful hidden interactions — the canonical case being TCP treating
    packet loss on a lossy wireless link as congestion and cutting its window, hurting
    throughput. These are why high-performance systems sometimes violate strict layering.
    Layering's benefits still usually win, but a senior answer acknowledges the trade-off.
  ref: concepts.md#why-the-osi-model-persists-and-its-critics
- id: network-models-osi-tcpip-074
  difficulty: advanced
  tags:
  - osi-persistence
  - vocabulary
  - judgment
  question: |
    TCP/IP decisively won as the deployed protocol suite, yet the seven-layer OSI model
    is still used everywhere. What is the strongest reason it persists?
  options:
  - OSI protocols are secretly still running the Internet backbone, and every core router quietly translates
    IP into the OSI protocol suite before forwarding it between autonomous systems
  - ISO legally requires its use and can fine any vendor whose equipment fails to implement all seven OSI
    layers exactly as written in the ISO/IEC 7498-1 standard
  - It is faster than the TCP/IP model at runtime because seven discrete layers pipeline packet processing
    more efficiently than the four-layer TCP/IP stack ever could
  - It is the shared troubleshooting/design lingua franca and the taxonomy vendors sell products by ("L2 switch,"
    "L7 LB"), and it cleanly separates concepts TCP/IP muddles — outliving its own failed protocol suite
  answer: 3
  explanation: |
    The OSI reference model survives as a conceptual tool, not a protocol stack: it gives
    engineers and vendors a common vocabulary ("that's an L3 problem," "L7 load
    balancer"), underpins product categories, and cleanly distinguishes session vs
    presentation, service vs protocol — distinctions TCP/IP blurs. It outlived the OSI
    protocols that failed in the market.
  ref: concepts.md#why-the-osi-model-persists-and-its-critics
- id: network-models-osi-tcpip-075
  difficulty: expert
  tags:
  - scenario
  - l7-lb
  - cross-layer
  - tls
  question: |
    An L7 load balancer terminates the client's TLS/TCP connection and opens a new one to
    the backend chosen from the HTTP path. Why is this a layering violation, and what is
    a consequence?
  options:
  - It is not a violation; L7 LBs only ever read Layer 4 IP-and-port information and never parse the HTTP
    request, so they remain strictly within the transport layer at all times
  - It rewrites MAC addresses only, staying purely at Layer 2 and forwarding each frame out the correct port
    without ever inspecting the IP, TCP, or TLS headers above it
  - It uses Layer 7 information (URL/headers/SNI) to make what is nominally a forwarding decision and terminates
    the end-to-end L4 connection — so the backend never sees the client's original TCP connection or (without
    extra headers) its source IP
  - It forwards raw bits without inspecting any header, acting as a Layer 1 repeater that simply regenerates
    the electrical signal onward and therefore cannot violate any higher layer
  answer: 2
  explanation: |
    An L7 LB reads application-layer data (path, headers, SNI) to route and terminates the
    client's TCP/TLS session, then originates a separate connection to the backend. That
    couples L7 inspection with connection handling across L4–L7. A consequence: the client
    IP and original connection are hidden from the backend unless propagated explicitly
    (e.g., X-Forwarded-For / PROXY protocol). Contrast an L4 LB, which can preserve the
    connection and even do DSR.
  ref: concepts.md#cross-layer-violations-in-practice
- id: network-models-osi-tcpip-076
  difficulty: advanced
  tags:
  - devices
  - multilayer-switch
  - l4-l7-lb
  - tradeoffs
  question: |
    Comparing an L4 load balancer with an L7 load balancer, which trade-off statement is
    accurate?
  options:
  - L7 is always faster because it reads more headers, and parsing the full HTTP request lets it shortcut the
    forwarding path that a header-blind L4 balancer must traverse
  - L4 can do path-based routing by reading the URL and cookies, whereas L7 sees only the IP-and-port 5-tuple
    and therefore cannot make content-based decisions
  - Only L4 can terminate TLS, because decryption must happen at the transport layer before any application
    data exists for an L7 device to inspect
  - L4 balances by IP+port, is content-oblivious, keeps the connection intact (enabling direct server return),
    and is fast; L7 terminates the connection to read HTTP for path/header routing and TLS termination, adding
    latency and state
  answer: 3
  explanation: |
    An L4 LB forwards on the 5-tuple without reading the payload, so it is fast, can
    preserve the client connection, and supports direct server return (DSR). An L7 LB must
    terminate the connection to parse HTTP, enabling path/header/cookie routing and TLS
    termination but adding per-connection latency and state. Each buys capability at a
    cost — the reason both tiers coexist.
  ref: concepts.md#devices-at-each-layer
- id: network-models-osi-tcpip-077
  difficulty: intermediate
  tags:
  - devices
  - multilayer-switch
  - l3-switch
  question: |
    A device forwards frames within a VLAN using MAC addresses but also routes between
    VLANs at wire speed using a hardware-programmed IP forwarding table. What is it, and
    at what layer(s) does it operate?
  options:
  - A hub, operating purely at Layer 1 and flooding bits to every port
  - A multilayer (L3) switch, operating at Layer 2 and Layer 3 simultaneously
  - An L7 load balancer, operating only at Layer 7 by parsing HTTP paths
  - A repeater, operating at Layer 2 only and rewriting each frame's MAC
  answer: 1
  explanation: |
    A device that switches within VLANs (L2, MAC-based) and also routes between them in
    hardware (L3, IP-based) is a multilayer or Layer 3 switch. It demonstrates that a
    single device can operate at multiple layers at once — a router likewise does L2 to
    reach each next hop while forwarding on L3.
  ref: concepts.md#devices-at-each-layer
- id: network-models-osi-tcpip-078
  difficulty: expert
  tags:
  - encapsulation
  - vxlan
  - mtu
  - scenario
  question: |
    A data-center overlay uses VXLAN (which adds ~50 bytes of outer Ethernet/IP/UDP/VXLAN
    headers) on links with a standard 1500-byte MTU, but the underlay was never adjusted.
    What symptom is most likely, and what is the fix?
  options:
  - No effect; VXLAN has zero overhead because its outer headers are stripped on the same link before the
    frame is ever transmitted onto the underlay
  - VXLAN converts everything to IPv6 automatically, so the larger address space absorbs the extra 50 bytes
    of encapsulation and nothing on the underlay ever breaks
  - The switches will fragment the oversized inner frames at Layer 2 transparently and reassemble them at the
    next hop, so large flows continue with no downside
  - Inner full-size (1500 B) frames plus 50 B of overhead exceed the underlay MTU and are dropped, so large
    flows fail while small ones work; fix by raising the underlay MTU (jumbo) or lowering the inner MTU/MSS
    to ~1450
  answer: 3
  explanation: |
    VXLAN's ~50 B outer headers shrink the usable inner MTU to ~1450. If tenants still
    send 1500 B frames and the underlay MTU is left at 1500, the encapsulated packets
    exceed it and are dropped (or trigger PMTUD issues) — large flows fail, small ones
    pass. The standard fixes are enabling jumbo frames on the underlay or clamping the
    inner MTU/MSS to account for the overhead.
  ref: concepts.md#encapsulation-vs-tunneling-vs-multiplexing
- id: network-models-osi-tcpip-079
  difficulty: intermediate
  tags:
  - ip-protocol-number
  - demultiplexing
  - ethertype
  question: |
    Inside an IPv4 header, the Protocol field is a demultiplexing key. Which mapping of
    Protocol number to protocol is correct?
  options:
  - 6 = UDP, 17 = TCP, 1 = OSPF (and 58 = GRE, 89 = ICMP, 47 = ICMPv6)
  - 6 = TCP, 17 = UDP, 1 = ICMP (and 58 = ICMPv6, 89 = OSPF, 47 = GRE)
  - 6 = ICMP, 17 = GRE, 1 = TCP (and 58 = UDP, 89 = ICMPv6, 47 = OSPF)
  - 6 = OSPF, 17 = ICMP, 1 = UDP (and 58 = TCP, 89 = GRE, 47 = ICMPv6)
  answer: 1
  explanation: |
    The IP Protocol field selects the next (transport-ish) protocol: 6 = TCP, 17 = UDP,
    1 = ICMP, 58 = ICMPv6, 89 = OSPF, 47 = GRE. It is the network-layer SAP. (EtherType,
    by contrast, is the data-link SAP: 0x0800 IPv4, 0x86DD IPv6, 0x0806 ARP.)
  ref: concepts.md#byte-level-encapsulation-and-the-demux-chain
- id: network-models-osi-tcpip-080
  difficulty: expert
  tags:
  - pmtud
  - plpmtud
  - rfc4821
  - troubleshooting
  question: |
    Classic ICMP-based PMTUD is unreliable because firewalls often drop the ICMP
    "too big" messages. What mechanism was standardized to discover the path MTU without
    depending on those ICMP messages?
  options:
  - Disabling the DF bit on every packet so routers along the path always fragment oversized datagrams in
    flight, letting the destination reassemble them regardless of the path MTU
  - Lowering every host's interface MTU to a permanent 576 bytes, the IPv4 minimum, so no packet can ever
    exceed any link's MTU anywhere along the path
  - Packetization Layer Path MTU Discovery (PLPMTUD, RFC 4821; RFC 8899 for datagrams), which probes with progressively
    larger packets and infers the MTU from whether they are acknowledged
  - Switching all traffic to UDP, whose connectionless datagrams are exempt from MTU limits and are delivered
    whole no matter how large the transfer becomes
  answer: 2
  explanation: |
    PLPMTUD (RFC 4821, and RFC 8899 for datagram transports like QUIC) sidesteps the
    ICMP-blackhole problem by having the transport itself send probe packets of
    increasing size and observe acknowledgements: if a probe is delivered, the MTU is at
    least that large; if not, it backs off. It needs no ICMP feedback at all. Disabling DF
    reintroduces fragmentation, and clamping to 576 is a crude workaround, not discovery.
  ref: concepts.md#mtu-mss-and-path-mtu-discovery
