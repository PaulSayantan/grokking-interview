topic: "HTTP Protocol Fundamentals"
domain: networking
topic_slug: http-protocol-fundamentals
version: 1
questions:
  - id: http-protocol-fundamentals-001
    difficulty: beginner
    tags: [tcp, text-protocol, framing]
    question: |
      HTTP/1.1 runs over TCP. Why must HTTP define its own message framing rules
      (start line, headers, blank line, body)?
    options:
      - "Because TCP randomly reorders bytes, so HTTP must number them"
      - "Because TCP delivers a stream of bytes with no built-in message boundaries"
      - "Because TCP encrypts data and HTTP must mark where decryption starts"
      - "Because TCP drops packets that HTTP must retransmit itself"
    answer: 1
    explanation: |
      TCP is a reliable, ordered byte stream but has no notion of "one HTTP
      message." HTTP therefore frames messages itself (start line + headers +
      blank line + body) so the receiver knows where one message ends.
    ref: "concepts.md#http-as-a-text-protocol-over-tcp"

  - id: http-protocol-fundamentals-002
    difficulty: beginner
    tags: [ports, tcp]
    question: |
      What are the default TCP ports for http:// and https:// respectively?
    options:
      - "80 and 443"
      - "8080 and 8443"
      - "443 and 80"
      - "21 and 22"
    answer: 0
    explanation: |
      Plain HTTP defaults to TCP port 80; HTTPS (HTTP over TLS) defaults to TCP
      port 443. The HTTP bytes are identical — TLS just wraps them.
    ref: "concepts.md#http-as-a-text-protocol-over-tcp"

  - id: http-protocol-fundamentals-003
    difficulty: beginner
    tags: [line-ending, crlf, syntax]
    question: |
      What character sequence terminates each line in an HTTP/1.1 message?
    options:
      - "A single LF (\\n)"
      - "A single CR (\\r)"
      - "A null byte (\\0)"
      - "CRLF (\\r\\n)"
    answer: 3
    explanation: |
      HTTP/1.1 lines end with CRLF (0x0D 0x0A). Recipients MAY tolerate a bare LF
      for robustness, but senders MUST emit CRLF.
    ref: "concepts.md#request-and-response-message-structure"

  - id: http-protocol-fundamentals-004
    difficulty: beginner
    tags: [message-structure, headers, body]
    question: |
      In an HTTP/1.1 message, what separates the header section from the body?
    options:
      - "An empty line (a CRLF by itself)"
      - "A line containing only the word BODY"
      - "The Content-Type header"
      - "A semicolon after the last header"
    answer: 0
    explanation: |
      A blank line — a CRLF on its own — marks the end of the headers. The parser
      relies on it to know headers are complete and the body (if any) follows.
    ref: "concepts.md#request-and-response-message-structure"

  - id: http-protocol-fundamentals-005
    difficulty: beginner
    tags: [request-line, syntax]
    question: |
      Which is a correctly formed HTTP/1.1 request line?
    options:
      - "HTTP/1.1 GET /index.html"
      - "GET HTTP/1.1 /index.html"
      - "/index.html GET HTTP/1.1"
      - "GET /index.html HTTP/1.1"
    answer: 3
    explanation: |
      A request line is: method SP request-target SP HTTP-version. So
      "GET /index.html HTTP/1.1" is correct.
    ref: "concepts.md#request-and-response-message-structure"

  - id: http-protocol-fundamentals-006
    difficulty: intermediate
    tags: [reason-phrase, status-line]
    question: |
      A server sends "HTTP/1.1 404 Not Found". If it instead sent
      "HTTP/1.1 404 Totally Missing", how should a conformant client behave?
    options:
      - "Act on the numeric code 404; the reason phrase is advisory only"
      - "Reject the response as malformed because the reason phrase is wrong"
      - "Treat it as a 400 because the phrase is unrecognized"
      - "Retry the request until the standard phrase is returned"
    answer: 0
    explanation: |
      The reason phrase is purely informational. Clients act on the numeric
      status code, not the text. (HTTP/2 and HTTP/3 drop the reason phrase
      entirely.)
    ref: "concepts.md#request-and-response-message-structure"

  - id: http-protocol-fundamentals-007
    difficulty: advanced
    tags: [request-target, proxy, connect]
    question: |
      A request line reads "CONNECT example.com:443 HTTP/1.1". Which request-target
      form is this and what is it used for?
    options:
      - "Origin-form, used for normal same-origin GETs"
      - "Absolute-form, used when talking to a forward proxy for HTTP"
      - "Asterisk-form, used to query server-wide options"
      - "Authority-form, used to ask a proxy to open a raw TCP tunnel"
    answer: 3
    explanation: |
      CONNECT uses authority-form (host:port) to ask a proxy to establish a raw
      TCP tunnel — the mechanism used to proxy HTTPS. Origin-form is path+query,
      absolute-form is a full URI (forward proxy), and asterisk-form (*) is for
      OPTIONS.
    ref: "concepts.md#request-and-response-message-structure"

  - id: http-protocol-fundamentals-008
    difficulty: beginner
    tags: [http10, http11, keep-alive]
    question: |
      What was the default connection behavior in HTTP/1.0?
    options:
      - "One request per TCP connection; the server closed it after responding"
      - "Persistent connections reused for many requests without ever closing"
      - "Multiplexed streams over a single long-lived connection"
      - "UDP datagrams exchanged with no connection setup at all"
    answer: 0
    explanation: |
      HTTP/1.0 defaulted to one request per connection (closed after the
      response). Clients could opt into reuse with Connection: keep-alive.
    ref: "concepts.md#http-10-vs-11-persistent-connections-and-the-host-header"

  - id: http-protocol-fundamentals-009
    difficulty: beginner
    tags: [http11, keep-alive, connection]
    question: |
      In HTTP/1.1, how does a party signal it wants the TCP connection closed
      after the current response?
    options:
      - "Send Connection: close"
      - "Send Connection: keep-alive"
      - "Omit the Host header"
      - "Send Transfer-Encoding: close"
    answer: 0
    explanation: |
      HTTP/1.1 connections are persistent by default; sending "Connection: close"
      tells the peer the connection will be closed after this message.
    ref: "concepts.md#http-10-vs-11-persistent-connections-and-the-host-header"

  - id: http-protocol-fundamentals-010
    difficulty: intermediate
    tags: [host-header, virtual-hosting]
    question: |
      Why is the Host header mandatory in HTTP/1.1, and what does omitting it cause?
    options:
      - "It sets the response compression; omitting it disables gzip"
      - "It carries the session cookie; omitting it logs the user out"
      - "It enables name-based virtual hosting; omitting it should yield a 400"
      - "It selects the TCP port; omitting it defaults to port 8080"
    answer: 2
    explanation: |
      The Host header lets one IP serve many hostnames (name-based virtual
      hosting). HTTP/1.1 requires it, and a request without Host MUST be answered
      with 400 Bad Request.
    ref: "concepts.md#http-10-vs-11-persistent-connections-and-the-host-header"

  - id: http-protocol-fundamentals-011
    difficulty: intermediate
    tags: [http10, http11, comparison]
    question: |
      Which feature was introduced in HTTP/1.1 (not present in HTTP/1.0)?
    options:
      - "Text-based request lines"
      - "The GET method"
      - "Status code 200"
      - "Chunked transfer-encoding"
    answer: 3
    explanation: |
      Chunked transfer-encoding, persistent-by-default connections, mandatory
      Host, byte ranges, and 100 Continue were all HTTP/1.1 additions. GET,
      text framing, and 200 existed in HTTP/1.0.
    ref: "concepts.md#http-10-vs-11-persistent-connections-and-the-host-header"

  - id: http-protocol-fundamentals-012
    difficulty: beginner
    tags: [methods, head]
    question: |
      What is the defining wire-level behavior of a HEAD response?
    options:
      - "It returns the same headers as GET but omits the message body"
      - "It returns only the message body and strips out every response header"
      - "It always returns 204 No Content regardless of the target resource"
      - "It creates the resource on the server if it does not already exist"
    answer: 0
    explanation: |
      HEAD is identical to GET except the server MUST NOT return a body. It's used
      for cheap metadata/freshness checks (e.g. reading Content-Length or ETag).
    ref: "concepts.md#http-methods-at-the-wire-level"

  - id: http-protocol-fundamentals-013
    difficulty: intermediate
    tags: [methods, case-sensitivity]
    question: |
      A client sends "get /path HTTP/1.1" (lowercase method). What is correct?
    options:
      - "It is fine; method names are case-insensitive and normalized by the server"
      - "It automatically upgrades to an uppercase GET after following a 301 redirect"
      - "Method names are case-sensitive; 'get' is not the valid GET token"
      - "Only the request-target is case-sensitive, not the method"
    answer: 2
    explanation: |
      HTTP method tokens are case-sensitive and conventionally uppercase. "get" is
      a different (and unregistered) token from "GET".
    ref: "concepts.md#http-methods-at-the-wire-level"

  - id: http-protocol-fundamentals-014
    difficulty: intermediate
    tags: [methods, options, cors]
    question: |
      Which method both queries server capabilities (with target *) and serves as
      the CORS preflight request?
    options:
      - "TRACE"
      - "PATCH"
      - "CONNECT"
      - "OPTIONS"
    answer: 3
    explanation: |
      OPTIONS asks about capabilities (OPTIONS * HTTP/1.1 for the whole server)
      and is the method browsers use for CORS preflight checks.
    ref: "concepts.md#http-methods-at-the-wire-level"

  - id: http-protocol-fundamentals-015
    difficulty: advanced
    tags: [methods, trace, security]
    question: |
      Why is the TRACE method commonly disabled on production servers?
    options:
      - "It permanently deletes the target resource and cannot be undone by the server"
      - "It is the only HTTP method that mandates a TLS-secured connection to operate"
      - "It forces the underlying TCP connection to close immediately after each request"
      - "It echoes the received request back, which can leak headers (Cross-Site Tracing)"
    answer: 3
    explanation: |
      TRACE reflects the request back for diagnostics. Combined with a browser
      exploit it could expose sensitive headers (Cross-Site Tracing), so it's
      usually disabled.
    ref: "concepts.md#http-methods-at-the-wire-level"

  - id: http-protocol-fundamentals-016
    difficulty: beginner
    tags: [status-codes, classes]
    question: |
      What does the first digit of an HTTP status code indicate?
    options:
      - "The major HTTP protocol version the responding server negotiated for this exchange"
      - "The class of response (1xx informational, 2xx success, 3xx redirect, 4xx client error, 5xx server error)"
      - "The number of automatic retries the client is permitted to attempt on failure"
      - "The size class of the response body, from smallest (1) to largest (5) payload"
    answer: 1
    explanation: |
      The leading digit defines the class: 1xx informational, 2xx success, 3xx
      redirection, 4xx client error, 5xx server error.
    ref: "concepts.md#status-codes-at-the-wire-level"

  - id: http-protocol-fundamentals-017
    difficulty: intermediate
    tags: [status-codes, unknown-codes]
    question: |
      A client receives status code 499, which it does not recognize. How should
      it treat it?
    options:
      - "As a 500, since every unrecognized status code defaults to a server error"
      - "As a 200, since unknown codes are optimistically treated as a success"
      - "As the x00 of its class — here 400 (generic client error)"
      - "Reject the response entirely as invalid and surface a parse error"
    answer: 2
    explanation: |
      A client that doesn't recognize a specific code treats it as the x00 of its
      class. A 499 is handled generically like 400. This is why the class digit is
      the real contract.
    ref: "concepts.md#status-codes-at-the-wire-level"

  - id: http-protocol-fundamentals-018
    difficulty: intermediate
    tags: [status-codes, no-body, framing]
    question: |
      Which responses MUST NOT include a message body?
    options:
      - "200 OK and 201 Created success responses always omit a body"
      - "301 Moved Permanently and 302 Found redirect responses"
      - "400 Bad Request and 500 Internal Server Error responses"
      - "204 No Content and 304 Not Modified"
    answer: 3
    explanation: |
      204 No Content and 304 Not Modified (and responses to HEAD) carry no body,
      so no Content-Length-delimited body follows.
    ref: "concepts.md#status-codes-at-the-wire-level"

  - id: http-protocol-fundamentals-019
    difficulty: intermediate
    tags: [status-codes, 100-continue, expect]
    question: |
      What is the purpose of "100 Continue" paired with "Expect: 100-continue"?
    options:
      - "It compresses the request body with gzip before sending so the server receives fewer octets"
      - "It upgrades the idle connection to a full-duplex WebSocket channel before the body is sent"
      - "It instructs the client to pause and retry the entire request after a server-specified delay"
      - "It lets the client withhold a large body until the server signals willingness to receive it"
    answer: 3
    explanation: |
      With Expect: 100-continue, the client sends headers first and waits; the
      server replies 100 Continue if willing, avoiding wasted transfer of a large
      body the server would reject.
    ref: "concepts.md#status-codes-at-the-wire-level"

  - id: http-protocol-fundamentals-020
    difficulty: advanced
    tags: [status-codes, 101, websocket, upgrade]
    question: |
      A server responds with "101 Switching Protocols" and "Upgrade: websocket".
      What is true after this response?
    options:
      - "The connection is immediately closed and a brand-new TCP connection must be opened to continue"
      - "The server will resend the original request with a gzip-compressed body on the same socket"
      - "The bytes on the socket are no longer HTTP; the connection is now a WebSocket"
      - "The client must now send a second Host header to confirm the upgrade before continuing"
    answer: 2
    explanation: |
      101 completes the WebSocket upgrade handshake. After it, the socket carries
      the WebSocket protocol, not HTTP messages.
    ref: "concepts.md#status-codes-at-the-wire-level"

  - id: http-protocol-fundamentals-021
    difficulty: beginner
    tags: [headers, case-insensitive]
    question: |
      Are HTTP header field names case-sensitive?
    options:
      - "Yes, they are case-sensitive, so Content-Type and content-type name two distinct fields"
      - "No, field names are case-insensitive (Content-Type == content-type)"
      - "Only in HTTP/1.0, where the original parsers compared field names byte-for-byte"
      - "Only for custom X- prefixed headers, which the standard requires to match case exactly"
    answer: 1
    explanation: |
      Header field names are case-insensitive. (HTTP/2 and HTTP/3 additionally
      require them to be lowercase on the wire.)
    ref: "concepts.md#headers-structure-and-parsing-rules"

  - id: http-protocol-fundamentals-022
    difficulty: intermediate
    tags: [headers, list-values, set-cookie]
    question: |
      Two "Accept" headers appear: "Accept: a" and "Accept: b". Also present are two
      "Set-Cookie" lines. Which statement is correct?
    options:
      - "Both Accept and Set-Cookie can be comma-folded into one line"
      - "Neither can be folded; both must be on separate lines"
      - "Accept can be folded to 'Accept: a, b', but Set-Cookie must stay on separate lines"
      - "Set-Cookie can be folded but Accept cannot"
    answer: 2
    explanation: |
      List-valued headers like Accept are equivalent to a comma-joined single
      line. Set-Cookie is the notable exception: it must NOT be folded — each
      cookie needs its own line.
    ref: "concepts.md#headers-structure-and-parsing-rules"

  - id: http-protocol-fundamentals-023
    difficulty: advanced
    tags: [headers, hop-by-hop, proxy]
    question: |
      Which of these is a hop-by-hop header that a proxy MUST NOT forward to the
      next hop?
    options:
      - "Connection"
      - "Content-Type"
      - "ETag"
      - "Authorization"
    answer: 0
    explanation: |
      Connection (along with Transfer-Encoding, Keep-Alive, TE, Upgrade) is
      hop-by-hop and applies only to a single connection; it must not be
      forwarded. Content-Type, ETag, Authorization are end-to-end.
    ref: "concepts.md#headers-structure-and-parsing-rules"

  - id: http-protocol-fundamentals-024
    difficulty: advanced
    tags: [headers, trailers, chunked]
    question: |
      What are HTTP trailers?
    options:
      - "Mandatory metadata headers that must appear before the request line in every message"
      - "A gzip-compressed footer block automatically appended to the end of every HTTP response"
      - "The status line's reason phrase repeated verbatim at the very end of the message body"
      - "Header fields sent after a chunked body, announced by the Trailer header"
    answer: 3
    explanation: |
      Trailers are header fields sent after the chunked message body (declared via
      the Trailer header). They're handy for values computable only after the body,
      like a checksum.
    ref: "concepts.md#headers-structure-and-parsing-rules"

  - id: http-protocol-fundamentals-025
    difficulty: intermediate
    tags: [headers, limits, 431]
    question: |
      A client sends an enormous set of request headers exceeding the server's cap.
      Which status is designed for this?
    options:
      - "413 Payload Too Large, the status reserved specifically for oversized header sections"
      - "414 URI Too Long, which the spec extends to cover the combined size of all headers"
      - "400 Bad Request only, since HTTP defines no dedicated status for excessive headers"
      - "431 Request Header Fields Too Large"
    answer: 3
    explanation: |
      431 Request Header Fields Too Large specifically signals that the header
      section (individually or in total) is too big. 413 is for the body; 414 is
      for the URI.
    ref: "concepts.md#headers-structure-and-parsing-rules"

  - id: http-protocol-fundamentals-026
    difficulty: beginner
    tags: [cookies, set-cookie]
    question: |
      How does a server ask a client to store a cookie, and how does the client
      return it?
    options:
      - "Server sends a Cookie: header in the response; the client then returns Set-Cookie: on later requests"
      - "Server sends Set-Cookie:; client returns Cookie:"
      - "Both the server and client exchange the value using a single shared Session: header field"
      - "The cookie is never sent in a header and travels only as a parameter in the URL query string"
    answer: 1
    explanation: |
      The server issues Set-Cookie in the response; the client stores it and echoes
      it back in a Cookie request header on subsequent matching requests.
    ref: "concepts.md#cookies-set-cookie-and-sessions"

  - id: http-protocol-fundamentals-027
    difficulty: intermediate
    tags: [cookies, httponly, security]
    question: |
      What does the HttpOnly attribute on a cookie do?
    options:
      - "Restricts the cookie to plain HTTP so it is stripped whenever the request is upgraded to HTTPS"
      - "Forces the cookie to expire the instant the browser tab closes, turning it into a session cookie"
      - "Prevents the cookie from ever being attached to any cross-site or third-party request"
      - "Makes the cookie unreadable to JavaScript, mitigating XSS token theft"
    answer: 3
    explanation: |
      HttpOnly hides the cookie from document.cookie / JavaScript, reducing the
      risk of session-token theft via XSS. (Secure restricts to HTTPS; SameSite
      controls cross-site sending.)
    ref: "concepts.md#cookies-set-cookie-and-sessions"

  - id: http-protocol-fundamentals-028
    difficulty: intermediate
    tags: [cookies, samesite, csrf]
    question: |
      A cookie is set with "SameSite=None" but without "Secure". What is the
      problem?
    options:
      - "SameSite=None requires the Secure attribute, so browsers reject it"
      - "Nothing at all; SameSite=None without Secure is an explicitly valid and recommended combination"
      - "SameSite=None automatically clears the HttpOnly flag, exposing the cookie to page JavaScript"
      - "It silently forces the cookie to become a session cookie that is dropped when the tab closes"
    answer: 0
    explanation: |
      Modern browsers require SameSite=None cookies to also be Secure (HTTPS-only);
      otherwise the cookie is rejected. SameSite is a CSRF-mitigation control.
    ref: "concepts.md#cookies-set-cookie-and-sessions"

  - id: http-protocol-fundamentals-029
    difficulty: intermediate
    tags: [cookies, session, statelessness]
    question: |
      In the classic server-side session pattern, what does the cookie typically
      contain?
    options:
      - "The full user record, including the account password, serialized directly into the cookie"
      - "A cached copy of the last response body so the server can skip regenerating the page"
      - "An opaque session ID that the server uses to look up state stored server-side"
      - "The client's current public IP address, which the server matches on every request"
    answer: 2
    explanation: |
      The cookie holds an opaque session ID; the actual state (login, cart) lives
      server-side keyed by that ID. This keeps HTTP itself stateless while giving
      the app the illusion of state.
    ref: "concepts.md#cookies-set-cookie-and-sessions"

  - id: http-protocol-fundamentals-030
    difficulty: advanced
    tags: [cookies, max-age, expires]
    question: |
      A Set-Cookie contains both "Expires" and "Max-Age" with conflicting values.
      Which wins, and what does a cookie with neither become?
    options:
      - "Max-Age wins; without either it becomes a session cookie dropped on browser close"
      - "Expires always wins over Max-Age; without either the cookie becomes a permanent, never-expiring cookie"
      - "Expires wins; a cookie carrying neither Expires nor Max-Age is rejected outright by the browser"
      - "The two values are averaged together; without either the cookie is capped at a fixed 24-hour lifetime"
    answer: 0
    explanation: |
      When both are present Max-Age takes precedence. A cookie with neither Expires
      nor Max-Age is a session cookie, discarded when the browser session ends.
    ref: "concepts.md#cookies-set-cookie-and-sessions"

  - id: http-protocol-fundamentals-031
    difficulty: beginner
    tags: [content-negotiation, accept, content-type]
    question: |
      Which request header does a client use to advertise which media types it can
      accept, and which response header declares what was actually sent?
    options:
      - "Content-Type (request) and Accept (response)"
      - "Accept-Encoding (request) and Vary (response)"
      - "Accept (request) and Content-Type (response)"
      - "Allow (request) and Content-Type (response)"
    answer: 2
    explanation: |
      The client sends Accept to state preferred media types; the server declares
      the chosen representation with Content-Type.
    ref: "concepts.md#content-negotiation-and-content-type"

  - id: http-protocol-fundamentals-032
    difficulty: intermediate
    tags: [content-negotiation, quality-values]
    question: |
      Given "Accept: application/json, text/html;q=0.9, */*;q=0.1", which
      representation does the client most prefer?
    options:
      - "application/json, because it has an implicit q of 1.0"
      - "text/html, because it is listed with an explicit q value"
      - "Any type, because */* matches everything"
      - "The server decides randomly among the three"
    answer: 0
    explanation: |
      Quality values default to 1.0 when absent, so application/json (q=1.0) beats
      text/html (q=0.9) and */* (q=0.1). Higher q wins.
    ref: "concepts.md#content-negotiation-and-content-type"

  - id: http-protocol-fundamentals-033
    difficulty: intermediate
    tags: [content-negotiation, 406, vary]
    question: |
      The server cannot produce any representation matching the client's Accept
      constraints. Which status is appropriate?
    options:
      - "406 Not Acceptable"
      - "415 Unsupported Media Type"
      - "409 Conflict"
      - "417 Expectation Failed"
    answer: 0
    explanation: |
      406 Not Acceptable indicates the server can't satisfy the Accept* negotiation
      constraints. (415 is for a request body media type the server can't process.)
    ref: "concepts.md#content-negotiation-and-content-type"

  - id: http-protocol-fundamentals-034
    difficulty: intermediate
    tags: [content-type, uploads, multipart]
    question: |
      A file-upload form posts binary parts. Which Content-Type uses a "boundary"
      parameter to delimit the parts?
    options:
      - "application/x-www-form-urlencoded"
      - "text/plain"
      - "application/octet-stream"
      - "multipart/form-data"
    answer: 3
    explanation: |
      multipart/form-data separates each part with the declared boundary string,
      suitable for file uploads. x-www-form-urlencoded percent-encodes flat
      key/value pairs.
    ref: "concepts.md#content-negotiation-and-content-type"

  - id: http-protocol-fundamentals-035
    difficulty: beginner
    tags: [framing, content-length]
    question: |
      What does "Content-Length: 1256" tell the receiver?
    options:
      - "The connection will be kept alive and stay open for the next 1256 seconds before closing"
      - "The body is exactly 1256 octets long"
      - "The header section contains exactly 1256 individual header fields before the body starts"
      - "The body was compressed and achieved a 1256-to-1 reduction ratio versus its original size"
    answer: 1
    explanation: |
      Content-Length gives the exact size of the message body in octets, so the
      receiver knows precisely where the body (and message) ends.
    ref: "concepts.md#message-framing-content-length-vs-chunked-transfer-encoding"

  - id: http-protocol-fundamentals-036
    difficulty: intermediate
    tags: [framing, chunked, streaming]
    question: |
      Why would a server choose "Transfer-Encoding: chunked" over Content-Length?
    options:
      - "To encrypt the body inline without needing a TLS layer wrapped around the connection"
      - "To guarantee the total body stays smaller than the 64 KB chunked-encoding size ceiling"
      - "Because the standard mandates chunked encoding for every GET response that returns a body"
      - "To stream a response whose total length is not known when sending begins"
    answer: 3
    explanation: |
      Chunked encoding lets the server start sending before it knows the total
      size — ideal for dynamically generated or streamed responses. Each chunk is
      prefixed by its size, and a 0-size chunk ends the body.
    ref: "concepts.md#message-framing-content-length-vs-chunked-transfer-encoding"

  - id: http-protocol-fundamentals-037
    difficulty: intermediate
    tags: [framing, chunked, hex]
    question: |
      In chunked transfer-encoding, in what base is each chunk's size prefix
      written, and what terminates the body?
    options:
      - "Decimal size prefix on each chunk; the body is terminated by a matching Content-Length"
      - "Binary size prefix on each chunk; the body is terminated by the server closing the connection"
      - "Hexadecimal size prefix; terminated by a zero-length (0) chunk"
      - "Base64-encoded size prefix on each chunk; the body is terminated by a single trailing CRLF"
    answer: 2
    explanation: |
      Each chunk begins with its length in hexadecimal followed by CRLF; a
      zero-length chunk (0 CRLF CRLF) marks the end of the body.
    ref: "concepts.md#message-framing-content-length-vs-chunked-transfer-encoding"

  - id: http-protocol-fundamentals-038
    difficulty: advanced
    tags: [framing, smuggling, security]
    question: |
      A message arrives with BOTH "Content-Length: 10" and "Transfer-Encoding:
      chunked". What is the correct handling, and why does it matter?
    options:
      - "Honor Content-Length and ignore the chunked encoding; the mismatch is harmless because Content-Length always wins"
      - "Reject the message with 505 HTTP Version Not Supported, since two framing headers imply an unsupported protocol version"
      - "Sum the Content-Length value together with the total chunked byte count to determine where the body ends"
      - "Transfer-Encoding takes precedence and Content-Length must be ignored/removed; disagreement between hops enables request smuggling"
    answer: 3
    explanation: |
      Per spec, Transfer-Encoding wins and Content-Length must be dropped. If a
      front-end and back-end disagree about which to honor, an attacker can smuggle
      a second request (CL.TE / TE.CL attacks).
    ref: "concepts.md#message-framing-content-length-vs-chunked-transfer-encoding"

  - id: http-protocol-fundamentals-039
    difficulty: advanced
    tags: [framing, http10, connection-close]
    question: |
      In HTTP/1.0 without Content-Length or chunked encoding, how did the receiver
      know the response body had ended?
    options:
      - "It counted the number of header lines and multiplied to estimate the body size"
      - "A special ASCII END sentinel line was appended after the last body byte"
      - "The server closed the TCP connection to delimit the body"
      - "It waited for a fixed 30-second inactivity timeout and then assumed the body was complete"
    answer: 2
    explanation: |
      HTTP/1.0 could delimit a body by closing the connection ("Connection: close"
      framing). That's why HTTP/1.0 keep-alive required Content-Length — otherwise
      the client couldn't tell where the response ended.
    ref: "concepts.md#message-framing-content-length-vs-chunked-transfer-encoding"

  - id: http-protocol-fundamentals-040
    difficulty: beginner
    tags: [compression, accept-encoding, content-encoding]
    question: |
      Which header does the client send to advertise supported compression, and
      which does the server set to say what it applied?
    options:
      - "Content-Encoding (client) and Accept-Encoding (server)"
      - "Compression (client) and Vary (server)"
      - "Accept-Encoding (client) and Content-Encoding (server)"
      - "TE (client) and Transfer-Encoding (server)"
    answer: 2
    explanation: |
      The client sends Accept-Encoding (e.g. "br, gzip"); the server compresses and
      declares the applied coding with Content-Encoding.
    ref: "concepts.md#compression-gzip-and-brotli"

  - id: http-protocol-fundamentals-041
    difficulty: intermediate
    tags: [compression, vary, caching]
    question: |
      Why must a server that compresses based on Accept-Encoding also send
      "Vary: Accept-Encoding"?
    options:
      - "To force the client to re-request the resource on every page load, bypassing its local cache"
      - "To disable browser caching entirely so compressed bodies are never stored on disk"
      - "So caches key correctly and don't serve a br/gzip body to a client that can't decode it"
      - "To tell the client the body length changed after compression so it can resize its buffer"
    answer: 2
    explanation: |
      Because the body varies by the client's Accept-Encoding, Vary tells shared
      caches to store/serve variants separately — otherwise a cache might hand a
      Brotli body to a client that only accepts gzip.
    ref: "concepts.md#compression-gzip-and-brotli"

  - id: http-protocol-fundamentals-042
    difficulty: intermediate
    tags: [compression, content-length]
    question: |
      When a response is gzip-compressed and includes Content-Length, what does
      that length measure?
    options:
      - "The size of the original uncompressed body, before the gzip coding was applied"
      - "The arithmetic sum of the compressed size and the original uncompressed size combined"
      - "The number of independent gzip DEFLATE blocks the encoder emitted for the body"
      - "The size of the compressed (encoded) body actually on the wire"
    answer: 3
    explanation: |
      Content-Length is the size of the encoded body as sent — i.e. the compressed
      bytes. The recipient decodes Content-Encoding after receiving those bytes.
    ref: "concepts.md#compression-gzip-and-brotli"

  - id: http-protocol-fundamentals-043
    difficulty: advanced
    tags: [compression, transfer-encoding, content-encoding]
    question: |
      What distinguishes Content-Encoding from Transfer-Encoding?
    options:
      - "They are exact synonyms for the same header and either name can be used interchangeably on the wire"
      - "Content-Encoding is a hop-by-hop framing directive, while Transfer-Encoding is preserved end-to-end by every intermediary"
      - "Content-Encoding is an end-to-end property of the representation; Transfer-Encoding is a hop-by-hop framing of the body for one connection"
      - "Content-Encoding only applies to request bodies, while Transfer-Encoding is only ever valid on response bodies"
    answer: 2
    explanation: |
      Content-Encoding (gzip/br) describes the representation itself and is
      preserved end-to-end. Transfer-Encoding (chunked) is how the body is framed on
      a single hop and may be undone by an intermediary.
    ref: "concepts.md#compression-gzip-and-brotli"

  - id: http-protocol-fundamentals-044
    difficulty: advanced
    tags: [compression, security, breach]
    question: |
      Compressing responses that mix a secret with reflected attacker input enabled
      which class of attack?
    options:
      - "SQL injection, where the compressed body smuggles a query into the backend database"
      - "DNS cache poisoning, triggered when the compressed response rewrites cached resolver records"
      - "Slowloris connection-exhaustion, amplified by holding compressed request streams open"
      - "BREACH/CRIME compression side-channel attacks"
    answer: 3
    explanation: |
      BREACH/CRIME exploit the fact that compression ratio leaks information about
      secrets when attacker-controlled data is compressed alongside them.
      Mitigations include not compressing sensitive responses or masking tokens.
    ref: "concepts.md#compression-gzip-and-brotli"

  - id: http-protocol-fundamentals-045
    difficulty: beginner
    tags: [statelessness, definition]
    question: |
      What does it mean that HTTP is "stateless"?
    options:
      - "Each request/response is self-contained; the server is not required to retain info between requests"
      - "The server must durably remember every prior request from a client to process the next one"
      - "HTTP is fundamentally unable to use cookies or any other mechanism to carry client state"
      - "The client must tear down and reopen the connection for every single byte it transfers"
    answer: 0
    explanation: |
      Statelessness means every request carries everything needed to process it and
      the server needn't keep per-client state between requests. State, when needed,
      is carried in the messages (cookies/tokens).
    ref: "concepts.md#statelessness"

  - id: http-protocol-fundamentals-046
    difficulty: intermediate
    tags: [statelessness, scalability, load-balancing]
    question: |
      What is the main scalability benefit of HTTP being stateless?
    options:
      - "Response payloads are always smaller because no session data is appended to them"
      - "TLS handshakes become unnecessary since there is no per-client state to protect"
      - "Any server behind a load balancer can handle any request, enabling easy horizontal scaling"
      - "Clients never need to send request headers, cutting the size of every message on the wire"
    answer: 2
    explanation: |
      Because requests are self-contained, no server holds mandatory per-connection
      state, so a load balancer can send any request to any node — easing
      horizontal scaling and fault tolerance.
    ref: "concepts.md#statelessness"

  - id: http-protocol-fundamentals-047
    difficulty: intermediate
    tags: [statelessness, keep-alive, misconception]
    question: |
      A candidate claims "persistent (keep-alive) connections make HTTP stateful."
      Why is that wrong?
    options:
      - "Keep-alive is a feature exclusive to HTTP/2 and never applied to HTTP/1.1 connections"
      - "Keep-alive obliges the server to store the client's full session state for the connection's lifetime"
      - "Keep-alive silently disables cookies because the connection itself now carries the client's identity"
      - "Keep-alive is a transport optimization for connection reuse; it doesn't change HTTP's stateless request semantics"
    answer: 3
    explanation: |
      Reusing a TCP connection avoids repeated handshakes but each HTTP request is
      still self-describing and independent. Statelessness is about message
      semantics, not whether the socket is reused.
    ref: "concepts.md#statelessness"

  - id: http-protocol-fundamentals-048
    difficulty: intermediate
    tags: [hol-blocking, pipelining]
    question: |
      What is the fatal limitation of HTTP/1.1 pipelining?
    options:
      - "It requires TLS 1.3 on the connection and silently fails on any earlier TLS version"
      - "It only works over UDP transport, so it cannot be used on a standard TCP connection"
      - "Responses must return in request order, so a slow first response blocks all queued responses (head-of-line blocking)"
      - "It disables the Host header, breaking name-based virtual hosting for every pipelined request"
    answer: 2
    explanation: |
      Pipelining sends requests back-to-back, but responses must come back in
      order. A slow/large early response stalls everything behind it — HTTP-level
      head-of-line blocking. That, plus buggy proxies, is why pipelining was never
      enabled by default.
    ref: "concepts.md#http-11-head-of-line-blocking-and-pipelining"

  - id: http-protocol-fundamentals-049
    difficulty: beginner
    tags: [hol-blocking, parallel-connections]
    question: |
      In practice, how did HTTP/1.1 browsers achieve concurrency for many resources
      from one origin?
    options:
      - "By enabling HTTP/1.1 pipelining by default so requests overlap on one socket"
      - "By multiplexing independent request streams over a single shared connection"
      - "By switching the transport to UDP so requests are no longer strictly ordered"
      - "By opening multiple parallel TCP connections per origin (around 6)"
    answer: 3
    explanation: |
      Because pipelining was unusable, browsers opened several parallel TCP
      connections per origin (commonly ~6) to fetch resources concurrently — at the
      cost of more sockets and handshakes.
    ref: "concepts.md#http-11-head-of-line-blocking-and-pipelining"

  - id: http-protocol-fundamentals-050
    difficulty: advanced
    tags: [hol-blocking, http2, http3, quic]
    question: |
      HTTP/2 multiplexes many streams over one TCP connection, yet a single lost TCP
      segment can still stall all streams. Which statement best captures this and
      its fix?
    options:
      - "HTTP/2 fully fixes transport-layer HOL blocking at the TCP level, and HTTP/3 then reintroduces it by moving to UDP"
      - "Both HTTP/2 and HTTP/3 run over ordinary TCP, so neither protocol is able to remove transport-layer HOL blocking at all"
      - "HTTP/2 removes application-layer HOL blocking but shares one ordered TCP stream, so transport-layer HOL remains; HTTP/3 over QUIC gives each stream independent ordering"
      - "HTTP/3 fixes HOL blocking simply by disabling stream multiplexing and sending one request per connection"
    answer: 2
    explanation: |
      HTTP/2's multiplexing removes application-level HOL blocking, but all streams
      ride one ordered TCP stream, so a lost segment stalls everyone (transport
      HOL). HTTP/3 runs over QUIC (UDP) where each stream is independently ordered,
      so one lost packet only stalls its own stream.
    ref: "concepts.md#http-11-head-of-line-blocking-and-pipelining"

  - id: http-protocol-fundamentals-051
    difficulty: intermediate
    tags: [security, smuggling, headers]
    question: |
      Why must servers reject a bare CR or LF embedded inside a header field value?
    options:
      - "It wastes bandwidth by padding each header line with unnecessary control bytes"
      - "It breaks gzip compression because the DEFLATE stream cannot encode raw CR or LF bytes"
      - "A smuggled CRLF can split a message, enabling request smuggling / response splitting"
      - "It silently changes the negotiated HTTP version recorded in the request line"
    answer: 2
    explanation: |
      CRLF is structural in HTTP/1.x. A CRLF injected into a value can prematurely
      end headers or inject a new message line — the basis of request smuggling and
      response splitting.
    ref: "concepts.md#request-and-response-message-structure"

  - id: http-protocol-fundamentals-052
    difficulty: beginner
    tags: [content-type, mime-sniffing, security]
    question: |
      Which response header instructs browsers not to guess (sniff) a body's type
      when Content-Type is absent or generic?
    options:
      - "X-Content-Type-Options: nosniff"
      - "Content-Disposition: inline"
      - "Cache-Control: no-store"
      - "X-Frame-Options: DENY"
    answer: 0
    explanation: |
      X-Content-Type-Options: nosniff disables MIME sniffing, forcing the browser to
      honor the declared Content-Type — a defense against content-type confusion
      attacks.
    ref: "concepts.md#content-negotiation-and-content-type"

  - id: http-protocol-fundamentals-053
    difficulty: expert
    tags: [request-target, host, absolute-form, security]
    question: |
      A forward proxy receives "GET http://internal/admin HTTP/1.1" with a header
      "Host: public.example.com". Per RFC 9112, which authority governs routing?
    options:
      - "The absolute-form authority (internal); the server MUST ignore the Host header"
      - "The Host header (public.example.com); absolute-form authority is advisory"
      - "Whichever the operator configured as primary; the spec leaves it undefined"
      - "The request is malformed and MUST be rejected with 505 HTTP Version Not Supported"
    answer: 0
    explanation: |
      RFC 9112 §3.2.1: when the request-target is in absolute-form, the recipient MUST
      use the authority from the request line and ignore any Host header. Front-end and
      back-end disagreeing on this precedence is a routing/smuggling vector.
    ref: "concepts.md#request-target-forms-and-host-reconciliation"

  - id: http-protocol-fundamentals-054
    difficulty: advanced
    tags: [host, duplicate-headers, smuggling]
    question: |
      An HTTP/1.1 request arrives with two Host headers carrying different values.
      What is the correct server behavior?
    options:
      - "Concatenate the two values into one comma-separated Host, treating it like any list header"
      - "Use the first Host header encountered and silently discard the second duplicate value"
      - "Reject the request with 400, because the ambiguity is a routing/desync risk"
      - "Use the second Host, since later headers always override earlier ones of the same name"
    answer: 2
    explanation: |
      Duplicate/conflicting Host headers are ambiguous and must be rejected with 400.
      Host is not a list-valued field, and letting different hops resolve the ambiguity
      differently is a classic smuggling/routing desync.
    ref: "concepts.md#request-target-forms-and-host-reconciliation"

  - id: http-protocol-fundamentals-055
    difficulty: expert
    tags: [host-injection, password-reset, security]
    question: |
      A password-reset email links to https://attacker.com/reset?token=... instead of
      the real site. The app builds the link from the incoming request. What is the
      most likely root cause and fix?
    options:
      - "A poisoned DNS record for the mail server; fix by enabling DNSSEC so the resolver rejects the forged host"
      - "A weak TLS cipher let the link be rewritten in transit; fix by disabling TLS 1.2 and older cipher suites"
      - "Host header injection — the app trusted the Host to build an absolute URL; validate Host against an allowlist"
      - "A missing SameSite attribute on the session cookie leaks it cross-site; fix by setting SameSite=Strict"
    answer: 2
    explanation: |
      When an application constructs absolute links from the untrusted Host header, an
      attacker setting Host: attacker.com poisons those links (and caches). The fix is to
      validate Host against an allowlist of expected authorities and never trust it to
      build absolute URLs.
    ref: "concepts.md#request-target-forms-and-host-reconciliation"

  - id: http-protocol-fundamentals-056
    difficulty: expert
    tags: [conditional-requests, etag, weak-validator, range]
    question: |
      A cache holds a representation validated only by a weak ETag (W/"v3"). A client
      sends a Range request with If-Range: W/"v3". What must the server do?
    options:
      - "Serve the full 200 representation, because range/byte-level use requires a strong validator"
      - "Serve 206 Partial Content, treating the weak validator match as sufficient to slice a byte range"
      - "Return 412 Precondition Failed, since a weak ETag can never satisfy any If-Range precondition"
      - "Return 416 Range Not Satisfiable, because a weak validator makes the requested range invalid"
    answer: 0
    explanation: |
      Range requests and If-Range require a STRONG validator, because a weak ETag only
      guarantees semantic (not byte-for-byte) equivalence. With only a weak validator the
      server cannot safely serve a byte range, so it returns the full 200 representation.
    ref: "concepts.md#conditional-requests-and-validators"

  - id: http-protocol-fundamentals-057
    difficulty: advanced
    tags: [conditional-requests, optimistic-concurrency, if-match, 412]
    question: |
      Two clients read a resource (ETag "7"), then both PUT updates with If-Match: "7".
      The first PUT succeeds and the resource's ETag becomes "8". What does the second
      PUT receive, and what problem did this prevent?
    options:
      - "200 OK; the second write also succeeds and it prevented a needless cache miss on the resource"
      - "409 Conflict; the server refuses the write and it prevented two clients from causing a deadlock"
      - "412 Precondition Failed; it prevented the lost-update problem"
      - "304 Not Modified; the body is skipped and it prevented an unnecessary re-transfer of the resource"
    answer: 2
    explanation: |
      After the first write the ETag no longer matches "7", so the second conditional PUT
      fails with 412 Precondition Failed. If-Match + 412 is optimistic concurrency: it
      stops the second writer from silently overwriting the first (lost update) without any
      server-side lock.
    ref: "concepts.md#conditional-requests-and-validators"

  - id: http-protocol-fundamentals-058
    difficulty: intermediate
    tags: [conditional-requests, 304, revalidation]
    question: |
      A client sends If-None-Match with its cached ETag and the resource is unchanged.
      What does the 304 Not Modified response contain on the wire?
    options:
      - "No body; it echoes current validators and the client reuses its cached copy"
      - "The full body again, so the client can byte-compare it against its stored copy before reusing it"
      - "A 302 redirect pointing back to the same cached URL, telling the client to fetch it once more"
      - "Only a Content-Length of 0 in the head, with the unchanged body delivered afterward in a trailer"
    answer: 0
    explanation: |
      304 Not Modified carries no message body. It refreshes the cached response's
      validators/metadata so the client (or cache) can keep using its stored copy without
      re-downloading it.
    ref: "concepts.md#conditional-requests-and-validators"

  - id: http-protocol-fundamentals-059
    difficulty: advanced
    tags: [range, 206, content-range]
    question: |
      A server honoring "Range: bytes=1000-1999" on a 1048576-byte file responds 206.
      Which header correctly reports the range, and what does it look like?
    options:
      - "Content-Range: bytes 1000-1999/1048576"
      - "Content-Length: bytes 1000-1999/1048576"
      - "Accept-Ranges: 1000-1999"
      - "Range: bytes 1000-1999 of 1048576"
    answer: 0
    explanation: |
      A 206 Partial Content response uses Content-Range: bytes start-end/total (here
      bytes 1000-1999/1048576) and a Content-Length equal to the range size (1000). The
      client separately learns support via Accept-Ranges: bytes.
    ref: "concepts.md#range-requests-and-partial-content"

  - id: http-protocol-fundamentals-060
    difficulty: expert
    tags: [range, multipart-byteranges, dos]
    question: |
      Why can a request with a very large number of tiny, overlapping byte ranges be a
      denial-of-service vector, and how do servers defend?
    options:
      - "Each range triggers a fresh TLS renegotiation, exhausting handshake capacity; servers defend by disabling renegotiation entirely"
      - "The overlapping ranges exhaust the TCP receive window and stall the socket; servers defend by shrinking the advertised window"
      - "The many small ranges bypass gzip and inflate transfer size; servers defend by forcing chunked transfer-encoding on the response"
      - "The multipart/byteranges response can be amplified far larger than the resource and cost CPU; servers cap the number/size of ranges or ignore pathological Range"
    answer: 3
    explanation: |
      Many overlapping ranges make the server assemble a multipart/byteranges body with
      large per-part overhead — potentially much bigger than the file — plus CPU cost.
      Hardened servers bound the count/size of ranges or serve the whole 200 instead.
    ref: "concepts.md#range-requests-and-partial-content"

  - id: http-protocol-fundamentals-061
    difficulty: advanced
    tags: [range, 416, if-range]
    question: |
      A client requests "Range: bytes=9999999-" on a resource only 500000 bytes long.
      What status should the server return, and what extra info helps the client?
    options:
      - "200 OK with the whole body and no range header, since any out-of-bounds start silently means the full file"
      - "206 Partial Content with an empty body and Content-Range: bytes 500000-500000/500000 marking the clamped range"
      - "416 Range Not Satisfiable with Content-Range: bytes */500000"
      - "400 Bad Request, since a start offset past the resource size counts as invalid range syntax the parser rejects"
    answer: 2
    explanation: |
      An unsatisfiable range (start beyond the resource size) yields 416 Range Not
      Satisfiable, and the server includes Content-Range: bytes */<total> so the client
      learns the actual size. The syntax itself is valid, so 400 is wrong.
    ref: "concepts.md#range-requests-and-partial-content"

  - id: http-protocol-fundamentals-062
    difficulty: expert
    tags: [expect-100-continue, upload, handshake]
    question: |
      A client PUTs a 2 GB file to an endpoint that will reject it for authorization
      reasons. Using Expect: 100-continue, how is the wasted upload avoided?
    options:
      - "The client sends headers and pauses; the server can reply 401 immediately before the body is sent"
      - "The client gzip-compresses the 2 GB body first, so even when the upload is rejected only a small payload was sent"
      - "The server always answers 100 Continue and then closes the connection, forcing the client to abandon the upload"
      - "The client streams the body inside a trailer block that the server is free to parse and then silently discard"
    answer: 0
    explanation: |
      With Expect: 100-continue the client sends only the headers and waits. If the server
      would reject regardless of the body (e.g. 401 auth, 413 too large, or 417), it sends
      that final status immediately, so the 2 GB body is never transmitted.
    ref: "concepts.md#the-expect-100-continue-handshake"

  - id: http-protocol-fundamentals-063
    difficulty: advanced
    tags: [expect-100-continue, timeout, proxy]
    question: |
      A client sent Expect: 100-continue but the (old) server never responds with any
      1xx. What should a conformant client do to avoid a deadlock?
    options:
      - "Abort the request and return an error to the caller"
      - "Wait indefinitely for 100 Continue"
      - "Send the body anyway after a short timeout"
      - "Downgrade to HTTP/1.0 and retry"
    answer: 2
    explanation: |
      A server (or proxy) that doesn't understand Expect may just ignore it. To avoid
      deadlock, the client should send the body after a short timeout (a few seconds)
      rather than waiting forever for a 100 Continue that will never come.
    ref: "concepts.md#the-expect-100-continue-handshake"

  - id: http-protocol-fundamentals-064
    difficulty: expert
    tags: [redirects, method-preservation, 308]
    question: |
      A payment POST returns a redirect and you must guarantee the browser re-submits the
      same body to the new URL as a POST. Which redirect status guarantees this?
    options:
      - "301 Moved Permanently"
      - "302 Found"
      - "303 See Other"
      - "308 Permanent Redirect"
    answer: 3
    explanation: |
      308 (and 307) preserve the method and body exactly. 301/302 historically let clients
      rewrite POST to GET (dropping the body), and 303 always forces a GET — both dangerous
      for a payment that must remain a POST.
    ref: "concepts.md#redirects-and-method-preservation"

  - id: http-protocol-fundamentals-065
    difficulty: advanced
    tags: [redirects, 303, post-redirect-get]
    question: |
      After a successful form POST you want the browser to follow up with a GET (the
      Post/Redirect/Get pattern) so a refresh doesn't re-submit. Which status fits?
    options:
      - "307 Temporary Redirect"
      - "303 See Other"
      - "308 Permanent Redirect"
      - "304 Not Modified"
    answer: 1
    explanation: |
      303 See Other tells the client to issue a GET to the Location (dropping the body),
      which is exactly the Post/Redirect/Get pattern. 307/308 would preserve the POST, and
      304 is a conditional-cache response, not a redirect.
    ref: "concepts.md#redirects-and-method-preservation"

  - id: http-protocol-fundamentals-066
    difficulty: advanced
    tags: [authentication, 401, 403, www-authenticate]
    question: |
      What is the precise wire-level difference between 401 Unauthorized and 403
      Forbidden?
    options:
      - "401 means 'not authenticated' and includes a WWW-Authenticate challenge; 403 means authenticated-but-not-allowed and carries no such challenge"
      - "401 is reserved strictly for tokens that have expired, while 403 is reserved strictly for requests that carry no token at all"
      - "They are fully interchangeable synonyms; a server may pick either one at random for any denied request, and clients treat them identically"
      - "403 is the code that must include the WWW-Authenticate challenge header naming the scheme, whereas 401 is defined to never carry one"
    answer: 0
    explanation: |
      401 signals the request lacks valid authentication and MUST carry a WWW-Authenticate
      header naming how to authenticate. 403 means the server understood who you are (or
      auth won't help) and refuses — no authentication challenge is offered.
    ref: "concepts.md#http-authentication-framing"

  - id: http-protocol-fundamentals-067
    difficulty: advanced
    tags: [authentication, proxy, 407]
    question: |
      A proxy (not the origin) requires credentials. Which status and header pair does it
      use, and how does the client respond?
    options:
      - "401 with WWW-Authenticate; client sends Authorization"
      - "403 with Allow; client sends Authorization"
      - "511 with WWW-Authenticate; client sends Proxy-Authorization"
      - "407 with Proxy-Authenticate; client sends Proxy-Authorization"
    answer: 3
    explanation: |
      Proxy authentication uses 407 Proxy Authentication Required with a
      Proxy-Authenticate challenge; the client answers with Proxy-Authorization. The
      401/WWW-Authenticate/Authorization triple is for the origin server.
    ref: "concepts.md#http-authentication-framing"

  - id: http-protocol-fundamentals-068
    difficulty: intermediate
    tags: [authentication, basic, security]
    question: |
      Why is HTTP Basic authentication considered safe only over TLS?
    options:
      - "Because Authorization: Basic is base64 encoding, not encryption — anyone on the path can trivially decode the credentials"
      - "Because Basic relies on a single-use nonce that expires after one request, so a dropped packet locks the user out without TLS"
      - "Because Basic delivers the password inside a normal cookie that page JavaScript can read back and exfiltrate cross-origin"
      - "Because Basic requires the origin server to store every user's password in plaintext so it can compare the header directly"
    answer: 0
    explanation: |
      Basic sends base64(user:pass) in the Authorization header. Base64 is reversible
      encoding, not encryption, so the credentials are exposed to any on-path observer
      unless the whole exchange is protected by TLS.
    ref: "concepts.md#http-authentication-framing"

  - id: http-protocol-fundamentals-069
    difficulty: expert
    tags: [url-encoding, fragment, normalization]
    question: |
      Which statement about URL components on the wire is correct?
    options:
      - "The fragment is never transmitted to the server; it is client-side only"
      - "The fragment (#...) is sent to the server in the request line so the origin can scroll the page to the anchor"
      - "The query string is stripped by the browser before the request is sent and re-attached only in the Referer header"
      - "A literal '+' in the path always denotes a plus sign and is never interpreted by any component as an encoded space"
    answer: 0
    explanation: |
      Per RFC 3986, the fragment identifier is processed client-side and is never sent in
      the request. The path and query are sent. '+' means space only in
      application/x-www-form-urlencoded, not generally in the path.
    ref: "concepts.md#url-percent-encoding-and-normalization"

  - id: http-protocol-fundamentals-070
    difficulty: expert
    tags: [cache-deception, normalization, security]
    question: |
      A request for /account/settings/nonexistent.css gets cached by a CDN and later
      served to other users, leaking a victim's private account page. What attack class
      is this, and what is the underlying cause?
    options:
      - "Server-side request forgery, caused by the CDN being tricked into fetching internal-only URLs on the user's behalf"
      - "Request smuggling, caused by a CL.TE desync where the CDN and origin disagree on the request body boundary"
      - "Response splitting, caused by an unescaped CRLF injected into the Location header of the cached redirect response"
      - "Web cache deception, caused by proxy/origin path-normalization differences and caching by file extension"
    answer: 3
    explanation: |
      Web cache deception tricks a cache into storing a private, dynamic page because the
      URL looks like a static asset (.css) while the origin serves the account page. The
      root cause is inconsistent path normalization/caching rules between the cache and
      origin; fix by keying on the normalized path and not caching by extension alone.
    ref: "concepts.md#url-percent-encoding-and-normalization"

  - id: http-protocol-fundamentals-071
    difficulty: expert
    tags: [smuggling, cl-te, desync]
    question: |
      In a CL.TE request-smuggling attack, how do the front-end and back-end disagree?
    options:
      - "Front-end uses Content-Length, back-end uses Transfer-Encoding, so the back-end de-chunks and treats trailing bytes as a new request"
      - "Front-end honors Transfer-Encoding while the back-end honors Content-Length, so the front-end de-chunks and forwards the leftover bytes"
      - "Both hops read Content-Length but parse two different declared values, and the mismatch cancels out to frame the body correctly"
      - "Both the front-end and back-end reject the ambiguous request with 400, and the retries bounce between them in an endless loop"
    answer: 0
    explanation: |
      In CL.TE the front-end frames the body by Content-Length while the back-end honors
      Transfer-Encoding: chunked. The back-end de-chunks and interprets the leftover bytes
      (past the front-end's CL) as the start of the next request — smuggled onto the next
      victim.
    ref: "concepts.md#request-smuggling-and-desync-attacks"

  - id: http-protocol-fundamentals-072
    difficulty: expert
    tags: [smuggling, te-te, obfuscation]
    question: |
      A TE.TE smuggling attack targets servers that both support chunked encoding. How is
      the desync actually achieved?
    options:
      - "By sending a message body that is deliberately larger than the declared Content-Length so one hop truncates it and the other reads the overflow as a fresh request"
      - "By obfuscating the Transfer-Encoding header (e.g. 'Transfer-Encoding: xchunked', a space before the colon, a duplicate TE line, or a bare-LF-prefixed value) so one hop ignores it and falls back to Content-Length"
      - "By omitting the Host header entirely so the front-end and back-end route the request to two different virtual hosts and desynchronize"
      - "By smuggling HTTP/2 binary pseudo-headers such as :method and :path into an HTTP/1.1 request so one hop reframes the message"
    answer: 1
    explanation: |
      In TE.TE, both hops understand chunked, so the attacker obfuscates the
      Transfer-Encoding header so that exactly one hop fails to recognize it and falls back
      to Content-Length, recreating a CL/TE-style desync.
    ref: "concepts.md#request-smuggling-and-desync-attacks"

  - id: http-protocol-fundamentals-073
    difficulty: expert
    tags: [smuggling, http2, downgrade]
    question: |
      An HTTP/2 front-end terminates the client and forwards requests to a back-end over
      HTTP/1.1. How does H2.CL / H2.TE smuggling arise?
    options:
      - "HTTP/2's binary framing makes request smuggling structurally impossible under all conditions, so no injected header can ever affect the back-end"
      - "The front-end trusts an attacker-injected Content-Length or Transfer-Encoding header and forwards it, even though HTTP/2 carries its own message length"
      - "The back-end silently upgrades every downgraded request to HTTP/3 over QUIC, and that protocol renegotiation is what desynchronizes the two hops"
      - "The client sends two conflicting Host headers that the front-end merges into one value, which the HTTP/1.1 back-end then re-splits into requests"
    answer: 1
    explanation: |
      HTTP/2 determines message length from its own framing, so any CL/TE header a client
      injects should be stripped. If the front-end forwards that attacker-controlled
      CL/TE when downgrading to HTTP/1.1, the back-end desyncs — H2.CL/H2.TE smuggling.
    ref: "concepts.md#request-smuggling-and-desync-attacks"

  - id: http-protocol-fundamentals-074
    difficulty: expert
    tags: [crlf-injection, response-splitting, http2]
    question: |
      Why does HTTP/2 structurally prevent classic response splitting, and when does the
      risk return?
    options:
      - "HTTP/2 encrypts every header name and value with HPACK's Huffman coding, so an injected CRLF is ciphertext that can never act as a delimiter, and the risk never returns even after a downgrade"
      - "HTTP/2 carries headers as length-prefixed binary fields, so a CRLF in a value is just data — but the risk returns on downgrade to HTTP/1.1 if field values aren't validated"
      - "HTTP/2 forbids the Location and Set-Cookie headers on the wire, so response splitting is eliminated permanently because there is no redirect header left for an attacker to inject a CRLF into"
      - "HTTP/2 runs directly over UDP like QUIC does, so any injected CRLF bytes fall outside the datagram framing and are silently dropped before reaching the parser"
    answer: 1
    explanation: |
      In HTTP/2/3 headers are length-prefixed binary (HPACK/QPACK), so a \r\n in a value
      isn't a delimiter. But when a front-end translates to CRLF-delimited HTTP/1.1 without
      validating values, the injected CRLF becomes a delimiter again — splitting returns.
    ref: "concepts.md#crlf-injection-and-response-splitting"

  - id: http-protocol-fundamentals-075
    difficulty: advanced
    tags: [caching, no-cache, no-store]
    question: |
      What is the precise difference between Cache-Control: no-cache and no-store?
    options:
      - "no-cache forbids storing the response in any cache entirely, whereas no-store permits storage indefinitely but only over a TLS-secured HTTPS connection"
      - "no-cache allows storage but requires revalidation with the origin before each reuse; no-store forbids storing the response at all"
      - "They are exact synonyms; both directives simply prevent any cache from ever storing or reusing the response under all circumstances"
      - "no-cache applies only to shared proxy caches while leaving them fresh, whereas no-store applies only to the browser's private cache and forces revalidation"
    answer: 1
    explanation: |
      no-cache means the response MAY be stored but MUST be revalidated (a conditional
      request) before being reused. no-store means the response must not be written to any
      cache at all. They are commonly confused but are not the same.
    ref: "concepts.md#http-caching-protocol-mechanics"

  - id: http-protocol-fundamentals-076
    difficulty: expert
    tags: [caching, s-maxage, private, shared-cache]
    question: |
      A response carries "Cache-Control: private, max-age=600, s-maxage=0". A CDN (shared
      cache) sits in front of the browser. How should each cache treat it?
    options:
      - "Both the CDN and the browser store it and serve it fresh for the full 600 seconds, since max-age applies uniformly to shared and private caches alike"
      - "The CDN must not store it (private), and even ignoring that, s-maxage=0 forces revalidation for shared caches; the browser may cache it for 600s"
      - "The browser must not cache it because private bars the origin's own client, so only the CDN stores it and serves it fresh for the full 600 seconds"
      - "Neither cache may store it at all, because an s-maxage of 0 is a global directive that overrides max-age and private for every cache on the path"
    answer: 1
    explanation: |
      private bars shared caches (the CDN) from storing the response; s-maxage=0 separately
      tells any shared cache its freshness is zero. The private browser cache honors
      max-age=600. This shows private/public and max-age/s-maxage scoping.
    ref: "concepts.md#http-caching-protocol-mechanics"

  - id: http-protocol-fundamentals-077
    difficulty: advanced
    tags: [caching, stale-while-revalidate, rfc5861]
    question: |
      What does "Cache-Control: max-age=60, stale-while-revalidate=300" let a cache do?
    options:
      - "Add the two values so the response stays fully fresh for a combined 360 seconds, then hard-delete it from the cache with no revalidation"
      - "Serve fresh for 60s, then for up to 300s more serve the stale copy immediately while revalidating in the background"
      - "Ignore the 60s freshness window and instead force a blocking origin revalidation exactly every 300 seconds regardless of the response's actual freshness lifetime"
      - "Store the response only when its body is smaller than 300 bytes, discarding anything larger after the 60-second freshness window elapses"
    answer: 1
    explanation: |
      stale-while-revalidate (RFC 5861) lets the cache, once the 60s freshness expires,
      serve the stale response instantly for up to 300 more seconds while asynchronously
      refreshing it — hiding origin latency from users.
    ref: "concepts.md#http-caching-protocol-mechanics"

  - id: http-protocol-fundamentals-078
    difficulty: expert
    tags: [caching, vary, cache-key]
    question: |
      A team adds "Vary: Cookie" to a page served through a shared CDN to a logged-in
      audience. What is the likely consequence?
    options:
      - "Better hit rates, because the Cookie value lets the cache group requests for the same popular page together into one shared, highly-reused entry"
      - "Cache-key explosion — a distinct cache entry per unique Cookie value — collapsing the shared-cache hit rate"
      - "The CDN silently strips the Cookie header from every request before hashing the key, so the Vary directive has no measurable effect on the stored entries"
      - "Nothing at all; the Vary: Cookie directive is quietly ignored by every shared and private cache, so hit rates remain exactly as they were before"
    answer: 1
    explanation: |
      Varying on Cookie (or Authorization) makes the cache key include a header that is
      unique per user/session, so almost every request is a distinct entry — cache-key
      explosion. It's an anti-pattern that destroys shared-cache efficiency.
    ref: "concepts.md#http-caching-protocol-mechanics"

  - id: http-protocol-fundamentals-079
    difficulty: expert
    tags: [connection, idle-timeout, retry, idempotency]
    question: |
      curl works reliably but a browser intermittently gets a truncated/failed response on
      a reused keep-alive connection. Which explanation and remediation is most accurate?
    options:
      - "The server's TLS certificate expired mid-session, so the browser silently drops the connection while curl ignores the chain; renew the certificate to fix it"
      - "An idle-timeout race — the client reused a socket the server was closing; clients transparently retry idempotent requests, but non-idempotent POSTs must not be blindly retried"
      - "The browser silently disabled cookies for the origin, so the session context is lost on reuse and the body arrives truncated; re-enable cookies to restore it"
      - "gzip encoding corrupted the body during transfer because the browser negotiated Brotli the server could not produce; disable response compression to fix it"
    answer: 1
    explanation: |
      On a persistent connection there's a race where the client sends on a socket the
      server is simultaneously closing for idleness, yielding a reset/failed request.
      Idempotent requests can be safely retried on a fresh connection; a POST cannot be
      blindly retried. Aligning idle timeouts reduces the race.
    ref: "concepts.md#connection-management-and-lifecycle"

  - id: http-protocol-fundamentals-080
    difficulty: expert
    tags: [connection, framing, truncation]
    question: |
      Why is framing a response solely by connection close (HTTP/1.0 style) dangerous for
      integrity, and what removes the ambiguity?
    options:
      - "It exposes the exact Content-Length to on-path observers, leaking the body size; switch to chunked transfer-encoding to conceal the total length from eavesdroppers"
      - "A premature close is indistinguishable from a complete response, so a truncated body looks 'successful'; Content-Length or the chunked 0-terminator reveals truncation"
      - "It forces the TLS layer to renegotiate its session keys after every single byte of the body, which corrupts integrity whenever a renegotiation is interrupted mid-stream"
      - "It permanently disables keep-alive for that entire origin, so every subsequent request must pay a fresh TCP and TLS handshake cost that degrades integrity guarantees"
    answer: 1
    explanation: |
      With close-delimited framing there is no explicit end marker, so a connection dropped
      mid-body cannot be distinguished from a legitimately finished response — silent
      truncation. Content-Length or chunked encoding's terminating 0-size chunk provides an
      explicit end, exposing truncation.
    ref: "concepts.md#connection-management-and-lifecycle"

  - id: http-protocol-fundamentals-081
    difficulty: advanced
    tags: [connection, hop-by-hop, header-stripping]
    question: |
      A proxy receives "Connection: close, X-Internal-Trace". Besides closing after the
      response, what else does the Connection header instruct the proxy to do?
    options:
      - "Forward the X-Internal-Trace header unchanged to the next hop, since only the literal 'close' token in a Connection header ever affects a proxy's forwarding behavior"
      - "Treat X-Internal-Trace as hop-by-hop and strip it before forwarding"
      - "Rename the X-Internal-Trace header to X-Forwarded-Trace before relaying it, mirroring how a proxy rewrites the Forwarded and X-Forwarded-For headers on each hop"
      - "Reject the whole request with 400 because the Connection header is permitted to name only the reserved tokens 'close' or 'keep-alive' and nothing else"
    answer: 1
    explanation: |
      The Connection header may list other field names that are hop-by-hop for this
      connection. A conformant proxy must remove those named headers (here
      X-Internal-Trace) before forwarding, in addition to acting on 'close'.
    ref: "concepts.md#connection-management-and-lifecycle"

  - id: http-protocol-fundamentals-082
    difficulty: expert
    tags: [status-codes, 421, http2, coalescing]
    question: |
      An HTTP/2 client reuses a connection (coalesced because two hostnames share a TLS
      cert) to request an authority this server is not authoritative for. Which status
      should the server return?
    options:
      - "404 Not Found, since the target authority has no matching resource on this particular server and the client should treat it as a missing path"
      - "400 Bad Request, because reusing a coalesced connection for a different authority is a malformed request the server cannot parse"
      - "421 Misdirected Request, so the client retries on a fresh connection"
      - "426 Upgrade Required, telling the client it must switch to a newer HTTP version before the coalesced authority can be served correctly"
    answer: 2
    explanation: |
      421 Misdirected Request tells the client the request reached a server that cannot
      produce a response for the target :authority (a connection-coalescing mismatch). The
      client should open a new connection to the correct origin and retry.
    ref: "concepts.md#specialized-and-modern-status-codes"

  - id: http-protocol-fundamentals-083
    difficulty: expert
    tags: [status-codes, 425, 0-rtt, tls13]
    question: |
      Why might a server respond 425 Too Early to a request carried in TLS 1.3 0-RTT
      early data?
    options:
      - "The client's system clock is skewed far enough that the 0-RTT early-data timestamp fails the server's freshness window and is rejected as arriving before it was valid"
      - "0-RTT data is replayable, so the server defers the request until the handshake completes to avoid replay attacks"
      - "TLS 1.3 0-RTT early data is permitted only for safe GET requests, and this request arrived as a POST, which the early-data path forbids outright"
      - "The server exhausted its pool of TLS 1.3 session resumption tickets, so it could not decrypt the early data and asks the client to try again shortly"
    answer: 1
    explanation: |
      TLS 1.3 0-RTT early data can be replayed by an attacker. A server unwilling to
      process a potentially-replayed request in early data returns 425 Too Early; the
      client retries once the full handshake provides replay protection.
    ref: "concepts.md#specialized-and-modern-status-codes"

  - id: http-protocol-fundamentals-084
    difficulty: advanced
    tags: [status-codes, 103-early-hints, preload]
    question: |
      What does a 103 Early Hints interim response let a client do?
    options:
      - "Abort the in-flight connection early to save bandwidth whenever the origin signals the final response will be too large to download completely"
      - "Begin preloading critical assets (via Link: rel=preload) while the origin is still computing the final response"
      - "Switch the current connection over to the WebSocket protocol so the interim response can stream incremental updates to the page"
      - "Store and reuse the final response from cache before it actually arrives, using the interim hints as a placeholder body until the real one lands"
    answer: 1
    explanation: |
      103 Early Hints (RFC 8297) is a 1xx interim sent before the final response, carrying
      Link headers so the browser can start preloading/connecting to critical resources
      while the server finishes generating the page — a server-push replacement.
    ref: "concepts.md#specialized-and-modern-status-codes"

  - id: http-protocol-fundamentals-085
    difficulty: expert
    tags: [trailers, grpc, forbidden-fields]
    question: |
      Which statement about HTTP trailers is correct?
    options:
      - "Trailers may carry any header field whatsoever, including framing-critical ones like Content-Length and Transfer-Encoding, since a recipient re-reads them after the body arrives"
      - "Framing/routing/auth-sensitive fields (e.g. Transfer-Encoding, Content-Length, Host) are forbidden in trailers, most clients discard trailers unless they sent TE: trailers, and gRPC relies on them for grpc-status"
      - "Trailers are transmitted before the message body and immediately after the request line, effectively acting as a second header block the parser reads up front"
      - "Trailers are mandatory for every chunked response, and a chunked message that omits its trailer section MUST be rejected by the recipient as malformed"
    answer: 1
    explanation: |
      Trailers follow a chunked body; fields that affect framing, routing, or auth are
      forbidden because a recipient may have already acted on them. Clients generally
      ignore trailers unless they advertised TE: trailers. gRPC is the main real-world
      consumer (grpc-status/grpc-message in trailers).
    ref: "concepts.md#headers-structure-and-parsing-rules"

  - id: http-protocol-fundamentals-086
    difficulty: advanced
    tags: [cookies, samesite, default-lax, chips]
    question: |
      A cookie is set with NO SameSite attribute in Chrome. Which is true today?
    options:
      - "It is treated as SameSite=None and therefore attached to every cross-site request, including third-party iframes and images, exactly as if None had been set explicitly"
      - "It is treated as SameSite=Lax by default, with a 2-minute top-level POST exception that an explicit Lax does not receive"
      - "It is rejected by the browser and never stored at all unless the Set-Cookie line also carries the Secure attribute alongside an explicit SameSite value"
      - "It is treated as SameSite=Strict, so the browser withholds it from every cross-site navigation including top-level links the user clicks from another origin"
    answer: 1
    explanation: |
      Since 2020 browsers treat an absent SameSite as Lax by default. The implicit default
      additionally allows a top-level cross-site POST for the cookie's first ~2 minutes — a
      grace behavior that an explicitly-set SameSite=Lax does not get.
    ref: "concepts.md#cookies-set-cookie-and-sessions"

  - id: http-protocol-fundamentals-087
    difficulty: advanced
    tags: [cookies, host-prefix, security]
    question: |
      What constraints must a cookie satisfy for the browser to accept a "__Host-" prefixed
      name?
    options:
      - "It must be marked HttpOnly and carry SameSite=Strict, locking the cookie away from JavaScript and from every cross-site request before the browser will honor the prefix"
      - "Secure, Path=/, and no Domain attribute"
      - "It must set an explicit Domain equal to the registrable eTLD+1 and include a Max-Age, so the prefixed cookie is pinned to the whole site with a fixed lifetime"
      - "It must be marked Secure and carry SameSite=None so the host-scoped cookie can still be delivered on the cross-site requests the prefix is designed to allow"
    answer: 1
    explanation: |
      The __Host- prefix requires the cookie to be Secure, have Path=/, and have NO Domain
      attribute — locking it to the exact host and path. __Secure- only requires Secure.
      These prefixes are browser-enforced integrity guarantees.
    ref: "concepts.md#cookies-set-cookie-and-sessions"

  - id: http-protocol-fundamentals-088
    difficulty: expert
    tags: [framing, both-headers, rfc9112, reject]
    question: |
      Modern hardened servers receiving BOTH Content-Length and Transfer-Encoding: chunked
      increasingly do what, and why is this stricter than "just prefer Transfer-Encoding"?
    options:
      - "Sum the Content-Length value and the total chunked byte count together, because combining both framing signals is the most permissive and forgiving interpretation of the message"
      - "Reject with 400 (or, for a proxy, close the connection), because silently preferring TE is exactly what CL.TE smuggling exploits"
      - "Prefer the Content-Length header and discard the chunked encoding, since a fixed decimal length is simpler and cheaper for the parser to validate than a chunk stream"
      - "Ignore both framing headers entirely and instead delimit the body by waiting for the peer to close the TCP connection, as HTTP/1.0 originally did"
    answer: 1
    explanation: |
      RFC 9112 §6.1 treats a message with both as an error. Reconciling by 'preferring TE'
      still leaves room for a differing hop to prefer CL — the desync. Rejecting outright
      (400 / close) removes the ambiguity that smuggling depends on.
    ref: "concepts.md#request-smuggling-and-desync-attacks"
