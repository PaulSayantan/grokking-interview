topic: "TLS, SSL & HTTPS"
domain: networking
topic_slug: tls-ssl-https
version: 1
questions:
  - id: tls-ssl-https-001
    difficulty: beginner
    tags: [ssl, tls, terminology]
    question: |
      A candidate says "we use SSL to secure our site." What is the most accurate
      correction?
    options:
      - "SSL is the obsolete predecessor of TLS; modern 'SSL' is really TLS 1.2/1.3"
      - "SSL and TLS are two independent protocols used side by side today"
      - "SSL is the newer, more secure version that replaced TLS"
      - "SSL only handles encryption, while TLS handles only peer authentication"
    answer: 0
    explanation: |
      SSL 2.0/3.0 are the deprecated, broken ancestors of TLS. What people casually
      call "SSL" today is actually TLS (currently 1.2 and 1.3). The name stuck for
      historical reasons.
    ref: "concepts.md#common-follow-up-questions"

  - id: tls-ssl-https-002
    difficulty: beginner
    tags: [stack, layering, tcp]
    question: |
      Where does TLS sit relative to TCP and HTTP?
    options:
      - "Below TCP at the network layer, sitting directly on top of IP"
      - "Between TCP and the application protocol (e.g. HTTP)"
      - "Inside IP, replacing the transport layer"
      - "Above HTTP, wrapping the application's own message logic"
    answer: 1
    explanation: |
      TLS is a shim between the reliable transport (TCP) and the application (HTTP).
      The app writes plaintext, TLS encrypts it into records, and TCP delivers those
      bytes reliably.
    ref: "concepts.md#tls-position-in-the-protocol-stack"

  - id: tls-ssl-https-003
    difficulty: beginner
    tags: [three-guarantees, security]
    question: |
      Which three security properties does TLS provide?
    options:
      - "Compression, caching, and load balancing"
      - "Routing, addressing, and fragmentation"
      - "Authentication, confidentiality, and integrity"
      - "Availability, redundancy, and failover"
    answer: 2
    explanation: |
      TLS authenticates the peer (via certificates), keeps data confidential
      (encryption), and detects tampering (AEAD/MAC integrity). It does not provide
      availability or routing.
    ref: "concepts.md#symmetric-vs-asymmetric-cryptography-in-the-handshake"

  - id: tls-ssl-https-004
    difficulty: beginner
    tags: [https, ports]
    question: |
      What is HTTPS?
    options:
      - "A separate protocol unrelated to HTTP with its own message format"
      - "HTTP compressed with gzip encoding just before transmission"
      - "HTTP that always runs over UDP datagrams instead of TCP"
      - "Ordinary HTTP carried inside a TLS session, typically on port 443"
    answer: 3
    explanation: |
      HTTPS is just HTTP running inside an established TLS session. The HTTP bytes are
      unchanged; TLS wraps them as encrypted records. Default port is 443.
    ref: "concepts.md#https--http-over-tls"

  - id: tls-ssl-https-005
    difficulty: intermediate
    tags: [https, privacy, leakage]
    question: |
      Even over HTTPS, which piece of information is normally visible to a passive
      network observer on the path?
    options:
      - "The destination IP address"
      - "The full request URL path and query string"
      - "The HTTP request headers and cookies"
      - "The response body"
    answer: 0
    explanation: |
      TLS encrypts the HTTP method, path, headers, and body. But the destination IP
      and port are always visible, traffic size/timing leaks, and (without ECH) the
      SNI hostname is in cleartext.
    ref: "concepts.md#https--http-over-tls"

  - id: tls-ssl-https-006
    difficulty: intermediate
    tags: [symmetric, asymmetric, performance]
    question: |
      Why does TLS use asymmetric cryptography only during the handshake and symmetric
      cryptography for the bulk of the session?
    options:
      - "Symmetric crypto is far faster, so asymmetric is reserved for authentication and key agreement"
      - "Asymmetric crypto cannot encrypt large messages at all"
      - "Symmetric crypto provides authentication that asymmetric cannot"
      - "Browsers only ship symmetric algorithms, so no asymmetric primitives are available client-side"
    answer: 0
    explanation: |
      Asymmetric operations (RSA/ECDSA/DH) are orders of magnitude slower than
      symmetric ciphers (AES/ChaCha20). TLS uses asymmetric crypto briefly to
      authenticate and agree on a shared key, then switches to fast symmetric encryption.
    ref: "concepts.md#symmetric-vs-asymmetric-cryptography-in-the-handshake"

  - id: tls-ssl-https-007
    difficulty: intermediate
    tags: [key-agreement, dhe, session-key]
    question: |
      With (EC)DHE key exchange, how does the client and server end up with the same
      symmetric session key?
    options:
      - "The server encrypts the key with its public key and sends it"
      - "The key is transmitted in cleartext during the ClientHello"
      - "Both exchange public key-share values and independently compute the same shared secret, which is never sent"
      - "The client downloads the session key from the issuing CA over a side channel"
    answer: 2
    explanation: |
      In ephemeral Diffie-Hellman, each side sends a public key share; both compute the
      identical shared secret locally. The secret itself never crosses the wire, which
      is what gives forward secrecy.
    ref: "concepts.md#symmetric-vs-asymmetric-cryptography-in-the-handshake"

  - id: tls-ssl-https-008
    difficulty: intermediate
    tags: [tls12, rtt, handshake]
    question: |
      How many round trips does a full TLS 1.2 handshake require before the client can
      send application data?
    options:
      - "0-RTT"
      - "1-RTT"
      - "3-RTT"
      - "2-RTT"
    answer: 3
    explanation: |
      A full TLS 1.2 handshake is 2-RTT: ClientHello/ServerHello exchange, then
      ClientKeyExchange/Finished exchange, before application data flows.
    ref: "concepts.md#tls-12-handshake"

  - id: tls-ssl-https-009
    difficulty: intermediate
    tags: [tls12, rsa, forward-secrecy]
    question: |
      In TLS 1.2, why is static RSA key exchange (client encrypts the premaster secret
      with the server's RSA public key) considered a liability?
    options:
      - "It provides no forward secrecy — if the server's private key later leaks, all recorded past sessions can be decrypted"
      - "It is slower than every other key exchange method"
      - "It cannot authenticate the server, since RSA transport skips the certificate check"
      - "It only works with self-signed certificates"
    answer: 0
    explanation: |
      With static RSA key transport, the session secret is protected only by the
      long-term private key. If that key leaks, an attacker who recorded old traffic can
      decrypt it all. Ephemeral (EC)DHE avoids this.
    ref: "concepts.md#tls-12-handshake"

  - id: tls-ssl-https-010
    difficulty: intermediate
    tags: [tls13, rtt, handshake]
    question: |
      What is the headline improvement of the TLS 1.3 full handshake over TLS 1.2?
    options:
      - "It requires 2-RTT instead of 3-RTT"
      - "It removes bulk encryption during setup to save handshake time"
      - "It reduces the full handshake to 1-RTT (with 0-RTT possible on resumption)"
      - "It moves the entire handshake onto UDP for lower latency"
    answer: 2
    explanation: |
      TLS 1.3 cuts the full handshake to 1-RTT because the client sends a key_share in
      its first message. Resumed sessions can even use 0-RTT early data.
    ref: "concepts.md#tls-13-handshake"

  - id: tls-ssl-https-011
    difficulty: intermediate
    tags: [tls13, forward-secrecy, rsa]
    question: |
      Which key-exchange change did TLS 1.3 make mandatory for forward secrecy?
    options:
      - "It removed Diffie-Hellman and kept only RSA"
      - "It made all key exchange purely symmetric with a pre-shared master key"
      - "It removed static RSA key exchange entirely, allowing only ephemeral (EC)DHE"
      - "It made key exchange optional for low-value connections"
    answer: 2
    explanation: |
      TLS 1.3 dropped static RSA key transport completely; only ephemeral (EC)DHE is
      allowed, so every session has forward secrecy by design.
    ref: "concepts.md#tls-13-handshake"

  - id: tls-ssl-https-012
    difficulty: advanced
    tags: [tls13, certificate, privacy]
    question: |
      In TLS 1.3, at what point is the server's certificate transmitted, compared to
      TLS 1.2?
    options:
      - "In cleartext during ServerHello, exactly as it was sent in TLS 1.2"
      - "It is no longer sent at all; the client fetches it from a CA directory"
      - "Only if the client explicitly requests it via a certificate_request extension"
      - "Encrypted under the handshake keys (after ServerHello), unlike the cleartext certificate in TLS 1.2"
    answer: 3
    explanation: |
      TLS 1.3 encrypts the Certificate message under handshake keys, hiding the server's
      identity from passive observers. In TLS 1.2 the certificate is sent in the clear.
    ref: "concepts.md#tls-13-handshake"

  - id: tls-ssl-https-013
    difficulty: advanced
    tags: [tls13, hello-retry-request, key-share]
    question: |
      In a TLS 1.3 handshake, the client guesses a key-exchange group and sends a
      key_share in its first ClientHello. What happens if the server does not support
      that group?
    options:
      - "The server sends a HelloRetryRequest, costing one extra round trip"
      - "The handshake fails immediately with no recovery"
      - "The connection silently downgrades to TLS 1.0"
      - "The server picks a random group and continues"
    answer: 0
    explanation: |
      If the client's guessed group is unacceptable, the server responds with
      HelloRetryRequest asking the client to resend with a supported group, adding one
      RTT. A good guess keeps it at 1-RTT.
    ref: "concepts.md#tls-13-handshake"

  - id: tls-ssl-https-014
    difficulty: intermediate
    tags: [cipher-suite, anatomy]
    question: |
      In the TLS 1.2 cipher suite TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256, what does the
      "RSA" component specify?
    options:
      - "The key-exchange algorithm used to agree on the shared secret"
      - "The hash function used to seed the pseudo-random function (PRF)"
      - "The bulk encryption cipher applied to application data"
      - "The authentication (the server certificate's signature type)"
    answer: 3
    explanation: |
      Reading left to right: ECDHE = key exchange, RSA = authentication (server cert),
      AES-128-GCM = bulk cipher + mode, SHA-256 = PRF/HMAC hash. The RSA field is the
      certificate/authentication method.
    ref: "concepts.md#cipher-suites"

  - id: tls-ssl-https-015
    difficulty: intermediate
    tags: [cipher-suite, tls13]
    question: |
      Why are TLS 1.3 cipher suite names (e.g. TLS_AES_128_GCM_SHA256) shorter than TLS
      1.2 names?
    options:
      - "TLS 1.3 dropped the hash function from the suite"
      - "TLS 1.3 uses numeric codes instead of names"
      - "TLS 1.3 suites specify only the AEAD cipher and hash; key exchange and authentication are negotiated separately"
      - "TLS 1.3 no longer encrypts, so fewer algorithms are needed"
    answer: 2
    explanation: |
      TLS 1.3 decoupled key exchange (supported_groups) and authentication
      (signature_algorithms) from the cipher suite, so the suite name only lists the AEAD
      cipher and hash.
    ref: "concepts.md#cipher-suites"

  - id: tls-ssl-https-016
    difficulty: intermediate
    tags: [aead, integrity, gcm]
    question: |
      What does an AEAD cipher (like AES-GCM or ChaCha20-Poly1305) provide that a plain
      cipher does not?
    options:
      - "Faster asymmetric key exchange during the handshake"
      - "Automatic validation of the peer's certificate chain"
      - "Built-in compression of the plaintext before encryption"
      - "Confidentiality plus built-in authentication/integrity in one primitive"
    answer: 3
    explanation: |
      AEAD = Authenticated Encryption with Associated Data. It combines encryption and
      integrity in one operation, eliminating the encrypt-then-MAC vs MAC-then-encrypt
      pitfalls of older CBC constructions. TLS 1.3 mandates AEAD.
    ref: "concepts.md#cipher-suites"

  - id: tls-ssl-https-017
    difficulty: advanced
    tags: [chacha20, aes-ni, performance]
    question: |
      On a mobile device with no AES hardware acceleration, which cipher suite is often
      preferred and why?
    options:
      - "ChaCha20-Poly1305, because it is fast and constant-time in software"
      - "AES-256-GCM, because its larger 256-bit key is always faster than a 128-bit key"
      - "3DES, because its triple-round design is lightweight on mobile CPUs"
      - "RC4, because its stream-based keystream avoids block-cipher overhead"
    answer: 0
    explanation: |
      Without AES-NI, AES is slower and harder to make constant-time in software.
      ChaCha20-Poly1305 was designed to be fast and side-channel-resistant in pure
      software, so it's preferred on such devices.
    ref: "concepts.md#cipher-suites"

  - id: tls-ssl-https-018
    difficulty: beginner
    tags: [certificate, x509, pki]
    question: |
      What does an X.509 TLS certificate primarily bind together?
    options:
      - "An identity (domain name) and a public key, signed by a CA"
      - "A username and a password hash for the origin server"
      - "An IP address and the network interface's MAC address"
      - "A negotiated session key and the chosen cipher suite"
    answer: 0
    explanation: |
      A certificate binds an identity (the domain names in the SAN) to a public key, and
      is signed by a Certificate Authority so relying parties can verify the binding.
    ref: "concepts.md#certificates-and-the-pki-chain-of-trust"

  - id: tls-ssl-https-019
    difficulty: intermediate
    tags: [chain-of-trust, root, intermediate]
    question: |
      In the PKI chain of trust, what does the client typically already have locally,
      and what does the server send during the handshake?
    options:
      - "Client caches the leaf certificate locally, and the server sends only its root CA at handshake"
      - "Client has nothing; server sends the entire chain including all roots"
      - "Client has the root CA in its trust store; server sends the leaf plus intermediate cert(s)"
      - "Client caches the intermediate CA locally, and the server sends only its root certificate down"
    answer: 2
    explanation: |
      Roots live in the client's trust store (kept offline by CAs). The server presents
      the leaf plus any intermediates so the client can build and verify the chain up to
      a trusted root.
    ref: "concepts.md#certificates-and-the-pki-chain-of-trust"

  - id: tls-ssl-https-020
    difficulty: intermediate
    tags: [missing-intermediate, troubleshooting]
    question: |
      A site loads fine in one client but fails with an "unable to verify" error in
      another. The server config was recently changed. What is the most common cause?
    options:
      - "The certificate's private key was accidentally published to a public code repository on deploy"
      - "The affected client has had all of its supported cipher suites disabled, so nothing can be negotiated"
      - "The root CA certificate expired across every trust store on earth at the exact same moment"
      - "The server is sending only the leaf certificate and omitting the intermediate, so some clients can't build the chain to a trusted root"
    answer: 3
    explanation: |
      A very common misconfiguration: the server omits the intermediate certificate.
      Clients that don't already cache that intermediate can't chain to a trusted root
      and fail. Always serve the full chain (leaf + intermediates).
    ref: "concepts.md#certificates-and-the-pki-chain-of-trust"

  - id: tls-ssl-https-021
    difficulty: intermediate
    tags: [root-ca, offline, security]
    question: |
      Why do CAs keep their root private keys offline and use intermediate CAs for
      day-to-day signing?
    options:
      - "So a compromised intermediate can be revoked without replacing the widely-trusted root"
      - "Root CA keys are computationally too slow to sign with for high daily issuance volumes"
      - "Because browsers are hard-coded to trust only intermediate CAs, never the roots directly"
      - "To avoid paying the per-signature licensing fees charged for using a root certificate"
    answer: 0
    explanation: |
      Replacing a root means updating every trust store on earth. Keeping roots offline
      and signing with intermediates means a compromised or retired intermediate can be
      revoked/rotated without touching the root.
    ref: "concepts.md#certificates-and-the-pki-chain-of-trust"

  - id: tls-ssl-https-022
    difficulty: beginner
    tags: [self-signed, validation]
    question: |
      Why do browsers reject a self-signed certificate by default?
    options:
      - "Self-signed certificates are structurally unable to carry a public key, so they cannot encrypt data"
      - "There is no CA above it in a trusted chain, so trust can't be established without manual configuration"
      - "Self-signed certificates always embed a mismatched hostname, so name validation is guaranteed to fail"
      - "They are restricted to a deliberately weaker encryption algorithm that browsers refuse to accept"
    answer: 1
    explanation: |
      A self-signed cert isn't signed by any CA in the trust store, so the client can't
      verify it chains to a trusted anchor. It can still encrypt, but authentication
      can't be established unless manually trusted.
    ref: "concepts.md#certificates-and-the-pki-chain-of-trust"

  - id: tls-ssl-https-023
    difficulty: intermediate
    tags: [hostname, san, cn]
    question: |
      Which certificate field do modern clients use to verify the requested hostname
      matches the certificate?
    options:
      - "The Common Name (CN) only"
      - "The Issuer field"
      - "The Subject Alternative Name (SAN)"
      - "The serial number"
    answer: 2
    explanation: |
      Modern clients match the hostname against the Subject Alternative Name (SAN).
      CN-only matching is deprecated and ignored by current browsers.
    ref: "concepts.md#certificate-validation"

  - id: tls-ssl-https-024
    difficulty: advanced
    tags: [certificate-verify, private-key, proof-of-possession]
    question: |
      A server presents a valid, correctly-chained certificate for example.com. Why is
      that alone NOT sufficient to prove the server's identity?
    options:
      - "Certificates are single-use tokens that expire the very instant they are transmitted across the connection"
      - "The certificate must first be decrypted using the client's own private key before it can be trusted at all"
      - "A valid certificate on its own can never be used for authentication, only for bulk data encryption"
      - "Anyone can copy a public certificate; the server must also sign the handshake (CertificateVerify) to prove it holds the matching private key"
    answer: 3
    explanation: |
      A certificate is public — anyone can download a site's cert. Identity is proven by
      the server signing the handshake transcript with the private key (CertificateVerify),
      demonstrating possession of the key matching the cert's public key.
    ref: "concepts.md#certificate-validation"

  - id: tls-ssl-https-025
    difficulty: intermediate
    tags: [validation, date-error, clock]
    question: |
      A user gets NET::ERR_CERT_DATE_INVALID on many unrelated HTTPS sites at once. What
      is the most likely root cause?
    options:
      - "The user's system clock is wrong, so certificates appear out of their validity window"
      - "Every unrelated site's certificate happened to expire at exactly the same moment"
      - "The user's browser silently purged every trusted root from its certificate store"
      - "The user's ISP is transparently blocking all OCSP revocation lookups on the path"
    answer: 0
    explanation: |
      When many sites fail with a date error simultaneously, the shared cause is almost
      always a wrong local clock — the browser sees valid certs as not-yet-valid or
      expired relative to the bad time.
    ref: "concepts.md#certificate-validation"

  - id: tls-ssl-https-026
    difficulty: advanced
    tags: [basic-constraints, ca-flag, validation]
    question: |
      What does the X.509 "basic constraints CA:TRUE" flag control, and why does it
      matter for validation?
    options:
      - "It flags a certificate as expired past its notAfter date so clients reject it during validation"
      - "It signals that the server is permitted to enable OCSP stapling for this certificate"
      - "It marks a certificate as a CA that is allowed to sign other certificates; leaf certs lack it, preventing them from issuing certs"
      - "It forces every connection using this certificate to negotiate AES-256 encryption only"
    answer: 2
    explanation: |
      basicConstraints CA:TRUE identifies a CA cert permitted to sign other certificates.
      Leaf certs have CA:FALSE, so a stolen leaf cert can't be used to mint new certs —
      the flaw that existed before this constraint was enforced.
    ref: "concepts.md#certificate-validation"

  - id: tls-ssl-https-027
    difficulty: beginner
    tags: [expiry, outage]
    question: |
      What is one of the most common causes of a sudden, total HTTPS outage for a site?
    options:
      - "The TLS 1.3 protocol suddenly being deprecated by browsers"
      - "The client happening to negotiate the ChaCha20 cipher"
      - "An expired TLS certificate that was not renewed"
      - "ALPN negotiating HTTP/2 for the connection"
    answer: 2
    explanation: |
      Certificates have a hard notAfter date. A forgotten renewal means every client
      rejects the cert at once — a classic and very common outage, which is why automated
      renewal (ACME) is standard.
    ref: "concepts.md#certificate-expiry-and-revocation-crl-ocsp-stapling"

  - id: tls-ssl-https-028
    difficulty: intermediate
    tags: [ocsp, revocation, privacy]
    question: |
      What is a key privacy drawback of plain OCSP (Online Certificate Status Protocol)?
    options:
      - "It inadvertently reveals the client's own private key to the origin server during the check"
      - "It transmits the full server certificate in cleartext during every status check"
      - "It silently disables forward secrecy for the whole session while the check runs"
      - "The client contacts the CA's responder for each cert, so the CA learns which sites the client visits"
    answer: 3
    explanation: |
      With plain OCSP, the client asks the CA "is this cert still valid?" for each site,
      leaking the user's browsing destinations to the CA. It also adds latency and
      soft-fails if the responder is down.
    ref: "concepts.md#certificate-expiry-and-revocation-crl-ocsp-stapling"

  - id: tls-ssl-https-029
    difficulty: intermediate
    tags: [ocsp-stapling, revocation]
    question: |
      How does OCSP stapling improve on plain OCSP?
    options:
      - "The server fetches a signed, time-stamped OCSP response and includes ('staples') it in the TLS handshake, so the client gets fresh revocation proof without contacting the CA"
      - "The client downloads and caches the CA's entire certificate revocation list locally for every site"
      - "It disables revocation checking entirely and simply trusts every certificate presented"
      - "It moves the OCSP responder queries to run over UDP instead of TCP for lower latency"
    answer: 0
    explanation: |
      With stapling, the server periodically fetches a CA-signed OCSP response and
      delivers it in the handshake. This removes the client's latency and privacy leak
      while still proving the cert isn't revoked. Must-Staple can force it.
    ref: "concepts.md#certificate-expiry-and-revocation-crl-ocsp-stapling"

  - id: tls-ssl-https-030
    difficulty: advanced
    tags: [crl, soft-fail, revocation]
    question: |
      Why is certificate revocation considered one of PKI's hardest problems?
    options:
      - "Revocation forces the CA to re-issue and redistribute the root certificate every single time"
      - "Browsers have no reliable way to detect that a certificate has already passed its expiry date"
      - "Revoked certificates automatically become valid again after a fixed 24-hour cooldown window"
      - "CRLs grow too large to fetch reliably, live OCSP adds latency and leaks browsing history, and soft-fail means a blocked/down responder is treated as 'valid'"
    answer: 3
    explanation: |
      CRLs are huge, OCSP adds latency and privacy leaks, and clients soft-fail (accept
      the cert if the check can't be reached) — so an attacker can simply block the check.
      The industry answer is stapling + short-lived certs + browser-pushed revocation sets.
    ref: "concepts.md#certificate-expiry-and-revocation-crl-ocsp-stapling"

  - id: tls-ssl-https-031
    difficulty: intermediate
    tags: [short-lived-certs, acme, revocation]
    question: |
      Why do short certificate lifetimes (e.g. ~90 days) reduce reliance on heavyweight
      revocation mechanisms?
    options:
      - "Short-lived certificates are technically impossible to revoke, so revocation simply does not apply"
      - "Short-lived certificates are issued with a stronger encryption algorithm than long-lived ones"
      - "A short validity window limits the exposure time if a key is compromised, so the certificate self-expires soon anyway"
      - "Short-lived certificates skip the hostname validation step entirely during issuance"
    answer: 2
    explanation: |
      A short lifetime means even a compromised cert expires quickly on its own, bounding
      the damage window. Combined with automated ACME renewal, this reduces dependence on
      unreliable live revocation.
    ref: "concepts.md#certificate-expiry-and-revocation-crl-ocsp-stapling"

  - id: tls-ssl-https-032
    difficulty: intermediate
    tags: [resumption, session-ticket, tls12]
    question: |
      What is the main advantage of a TLS session ticket (RFC 5077) over a server-side
      session ID cache for resumption?
    options:
      - "Session tickets uniquely enable full 0-RTT early data even in TLS 1.2 handshakes"
      - "Session tickets are permanent credentials that never expire once issued to a client"
      - "Session tickets remove the need to present any server certificate on resumption"
      - "The server encrypts the session state into an opaque ticket the client stores, so the server stays stateless"
    answer: 3
    explanation: |
      With session tickets, the server encrypts the session state and hands it to the
      client to store; the server keeps no per-session table. Session IDs, by contrast,
      require the server to cache state for every resumable session.
    ref: "concepts.md#session-resumption-and-0-rtt"

  - id: tls-ssl-https-033
    difficulty: intermediate
    tags: [resumption, psk, tls13]
    question: |
      How does TLS 1.3 implement session resumption?
    options:
      - "With a pre-shared key (PSK) derived from the prior session, delivered via NewSessionTicket and offered in the next ClientHello"
      - "By reusing the exact same symmetric session key from the original handshake indefinitely"
      - "By skipping the certificate step yet redoing a complete static RSA key exchange each time"
      - "By securely caching a copy of the server's long-term private key on the client side"
    answer: 0
    explanation: |
      TLS 1.3 resumption uses a PSK derived from a previous handshake, sent in a
      NewSessionTicket and presented by the client on return. This enables a fast 1-RTT
      resumption or 0-RTT with early data.
    ref: "concepts.md#session-resumption-and-0-rtt"

  - id: tls-ssl-https-034
    difficulty: advanced
    tags: [0-rtt, replay, idempotent]
    question: |
      What is the primary security risk of TLS 1.3 0-RTT early data?
    options:
      - "Early data can be captured and replayed by an attacker, so only idempotent requests should be allowed in 0-RTT"
      - "It exposes the server's long-term private key to any passive on-path observer"
      - "It permanently disables forward secrecy for the entire remainder of the connection"
      - "It silently forces the whole connection to downgrade all the way to TLS 1.2"
    answer: 0
    explanation: |
      0-RTT early data has no forward secrecy and can be replayed — the server can't be
      sure it hasn't seen the same early data before. Only safe/idempotent requests
      (e.g. GET) should be permitted; a replayed POST could cause duplicate side effects.
    ref: "concepts.md#session-resumption-and-0-rtt"

  - id: tls-ssl-https-035
    difficulty: advanced
    tags: [0-rtt, anti-replay, scenario]
    question: |
      An API allows 0-RTT for "POST /transfer" to shave latency. Why is this dangerous?
    options:
      - "POST request bodies are never actually encrypted when sent as 0-RTT early data"
      - "0-RTT is restricted to GET requests at the protocol level, so a POST would simply fail"
      - "0-RTT data can be replayed, so an attacker could resend the captured transfer, executing it multiple times"
      - "The server is unable to decrypt any POST request body carried in 0-RTT early data"
    answer: 2
    explanation: |
      Because 0-RTT early data is replayable, an attacker who captures the request can
      resend it, triggering repeated money transfers. Non-idempotent, state-changing
      operations must never be permitted in 0-RTT.
    ref: "concepts.md#session-resumption-and-0-rtt"

  - id: tls-ssl-https-036
    difficulty: beginner
    tags: [sni, virtual-hosting]
    question: |
      What problem does SNI (Server Name Indication) solve?
    options:
      - "It compresses the server's certificate chain to reduce the bytes sent during the handshake"
      - "It encrypts the entire ClientHello message so no observer can read it on the wire"
      - "It negotiates which application-layer protocol, such as HTTP/2, the connection will use"
      - "It tells the server which hostname the client wants, so a server hosting many sites on one IP can present the correct certificate"
    answer: 3
    explanation: |
      With many virtual hosts on one IP, the server must know the target hostname before
      choosing a certificate. SNI carries that hostname in the ClientHello so the right
      cert is served.
    ref: "concepts.md#sni-esni-and-ech"

  - id: tls-ssl-https-037
    difficulty: intermediate
    tags: [sni, cleartext, privacy]
    question: |
      What is the privacy weakness of traditional SNI?
    options:
      - "It is sent in cleartext in the ClientHello, so a network observer learns which hostname the client is connecting to"
      - "It forces the client to disclose its own source IP address to the server inside the SNI field, which the server would otherwise never see"
      - "It transmits the negotiated symmetric session key alongside the hostname, so anyone reading the SNI can decrypt the session"
      - "It causes the client to skip validating the server's certificate chain whenever many virtual hosts share one IP"
    answer: 0
    explanation: |
      SNI is sent before encryption is established, so it's visible on the wire. Even over
      HTTPS, an observer can see which site you're contacting — a censorship/surveillance
      vector that ECH aims to close.
    ref: "concepts.md#sni-esni-and-ech"

  - id: tls-ssl-https-038
    difficulty: advanced
    tags: [ech, esni, dns]
    question: |
      How does ECH (Encrypted Client Hello) protect the SNI, and what does it depend on?
    options:
      - "It encrypts only the SNI field on its own, using the server's leaf certificate public key obtained during a prior handshake"
      - "It encrypts the entire ClientHello using a public key the client fetches from a DNS HTTPS/SVCB record; an outer ClientHello carries only a generic public name"
      - "It removes the SNI extension from the handshake entirely, so the server must guess the intended hostname from the destination IP"
      - "It tunnels the SNI over a separate, pre-encrypted TCP connection opened to the CA before the main handshake begins"
    answer: 1
    explanation: |
      ECH encrypts the whole inner ClientHello (SNI, ALPN, etc.) with a key published in
      DNS HTTPS records. The outer hello reveals only a generic public name. It's most
      effective with DoH/DoT so the DNS query itself doesn't leak the hostname.
    ref: "concepts.md#sni-esni-and-ech"

  - id: tls-ssl-https-039
    difficulty: intermediate
    tags: [esni, deprecated, ech]
    question: |
      What is the relationship between ESNI and ECH?
    options:
      - "They are two identical names for the exact same current IETF standard, fully interchangeable in every specification and browser"
      - "ECH was the original, older mechanism, and ESNI is the newer standard that deprecated and fully replaced it"
      - "ESNI was an earlier experimental attempt to encrypt just the SNI; it is deprecated in favour of ECH, which encrypts the whole ClientHello"
      - "ESNI encrypts the server's certificate message, while ECH is limited to encrypting only the SNI hostname field"
    answer: 2
    explanation: |
      ESNI encrypted only the SNI field and had weaknesses; it's deprecated. ECH is the
      current IETF approach and encrypts the entire ClientHello, closing more leaks.
    ref: "concepts.md#sni-esni-and-ech"

  - id: tls-ssl-https-040
    difficulty: beginner
    tags: [alpn, http2, negotiation]
    question: |
      What does ALPN (Application-Layer Protocol Negotiation) do?
    options:
      - "Selects which TLS protocol version, such as 1.2 or 1.3, both peers will use for the connection"
      - "Encrypts the SNI hostname field so on-path observers cannot see which site the client requested"
      - "Chooses which certificate authority the server's leaf certificate must chain up to during validation"
      - "Lets client and server agree on the application protocol (e.g. h2, http/1.1, h3) inside the TLS handshake with no extra round trip"
    answer: 3
    explanation: |
      ALPN is a TLS extension where the client offers protocol IDs and the server picks
      one, negotiating e.g. HTTP/2 (h2) vs HTTP/1.1 during the handshake itself — no extra
      RTT.
    ref: "concepts.md#alpn-application-layer-protocol-negotiation"

  - id: tls-ssl-https-041
    difficulty: intermediate
    tags: [alpn, http2, identifiers]
    question: |
      In a modern browser negotiating with an HTTPS server, how is HTTP/2 selected?
    options:
      - "Via the ALPN extension advertising 'h2' during the TLS handshake"
      - "Via a cleartext HTTP Upgrade header exchanged after the handshake"
      - "Via a special DNS SVCB record queried just before connecting"
      - "Via a separate parallel TCP connection opened on port 8080"
    answer: 0
    explanation: |
      Over TLS, HTTP/2 is negotiated entirely by ALPN: the client offers 'h2' (and
      'http/1.1' as fallback) and the server picks. There's no cleartext Upgrade dance for
      the TLS case.
    ref: "concepts.md#alpn-application-layer-protocol-negotiation"

  - id: tls-ssl-https-042
    difficulty: intermediate
    tags: [alpn, rtt]
    question: |
      Why is ALPN considered "free" in terms of latency?
    options:
      - "It runs entirely before the TCP three-way handshake even begins, so it adds no latency"
      - "It is carried over UDP instead of TCP, which makes the protocol negotiation faster"
      - "It is carried inside the existing TLS handshake messages, so it costs no additional round trip"
      - "It caches the negotiated protocol choice in a DNS record for later reuse"
    answer: 2
    explanation: |
      ALPN piggybacks on the ClientHello/ServerHello already being exchanged, so protocol
      selection adds zero extra round trips — unlike an HTTP Upgrade negotiation.
    ref: "concepts.md#alpn-application-layer-protocol-negotiation"

  - id: tls-ssl-https-043
    difficulty: beginner
    tags: [mtls, client-cert]
    question: |
      How does mutual TLS (mTLS) differ from ordinary TLS?
    options:
      - "mTLS runs over UDP datagrams instead of TCP so the extra client certificate can be exchanged in parallel"
      - "mTLS skips authenticating the server entirely and instead verifies only the client's presented certificate"
      - "In mTLS the client also presents a certificate, so both client and server authenticate each other cryptographically"
      - "mTLS removes the need for any certificate authority, since both peers simply trust each other's raw public keys"
    answer: 2
    explanation: |
      Ordinary TLS authenticates only the server. In mTLS the server sends a
      CertificateRequest and the client presents its own certificate plus a
      CertificateVerify, so both sides are authenticated.
    ref: "concepts.md#mtls-mutual-tls"

  - id: tls-ssl-https-044
    difficulty: intermediate
    tags: [mtls, certificate-request, handshake]
    question: |
      Which handshake message signals that the server wants the client to authenticate
      with a certificate in mTLS?
    options:
      - "ServerHelloDone"
      - "ChangeCipherSpec"
      - "NewSessionTicket"
      - "CertificateRequest"
    answer: 3
    explanation: |
      The server sends a CertificateRequest (optionally restricting acceptable CAs). The
      client then supplies its Certificate and a CertificateVerify proving it holds the
      matching private key.
    ref: "concepts.md#mtls-mutual-tls"

  - id: tls-ssl-https-045
    difficulty: intermediate
    tags: [mtls, zero-trust, trade-offs]
    question: |
      Why is mTLS common inside service meshes/zero-trust infrastructure but rare for
      public consumer websites?
    options:
      - "mTLS requires operating a client-certificate PKI (issuing, rotating, revoking client certs), which is practical internally but infeasible for the general public"
      - "Consumer browsers are incapable of performing any TLS handshake at all, so mutual authentication over the web is technically impossible for them"
      - "mTLS is dramatically slower than plaintext HTTP, since verifying two certificates forces a fresh asymmetric handshake on every single request"
      - "Public-facing websites are explicitly forbidden by the TLS RFCs from ever requesting a client certificate during the handshake"
    answer: 0
    explanation: |
      mTLS gives strong credential-less service identity, but you must issue and manage
      client certs. That's tractable for controlled workloads (e.g. SPIFFE/SPIRE in a
      mesh) but impractical for millions of anonymous public users.
    ref: "concepts.md#mtls-mutual-tls"

  - id: tls-ssl-https-046
    difficulty: intermediate
    tags: [quic, tls13, http3]
    question: |
      How does QUIC (used by HTTP/3) relate to TLS?
    options:
      - "QUIC does not use TLS at all and instead relies on a bespoke IPsec-style encryption layer defined in its own RFC"
      - "QUIC uses the TLS 1.2 handshake exclusively and cannot negotiate the newer TLS 1.3 key-exchange mechanisms"
      - "QUIC runs the complete, unchanged TLS record layer directly over UDP datagrams, exactly as TCP-based TLS does"
      - "QUIC integrates the TLS 1.3 handshake into the transport (RFC 9001) and encrypts its own packets, rather than layering a TLS record layer on top"
    answer: 3
    explanation: |
      QUIC uses the TLS 1.3 handshake for key agreement but performs its own packet
      protection — there is no separate TLS record layer. This is why "TLS over UDP" is
      imprecise; QUIC integrates the TLS 1.3 handshake.
    ref: "concepts.md#tls-over-tcp-vs-quic"

  - id: tls-ssl-https-047
    difficulty: intermediate
    tags: [tls-over-tcp, rtt, setup]
    question: |
      For a fresh HTTP/2 connection (TLS over TCP), why is connection setup slower than
      QUIC's?
    options:
      - "TCP performs its own encryption pass and then TLS encrypts a second time, so setup data is needlessly encrypted twice"
      - "TLS running over TCP is architecturally unable to use TLS 1.3 and is capped at the slower TLS 1.2 handshake"
      - "The TCP three-way handshake and the TLS handshake run sequentially, so setup costs TCP-RTT plus TLS-RTT, whereas QUIC combines transport and crypto setup into 1-RTT"
      - "HTTP/2 requires opening a brand-new TCP connection for every single request, multiplying the handshake cost"
    answer: 2
    explanation: |
      Over TCP, you first complete the TCP handshake, then the separate TLS handshake.
      QUIC merges transport and cryptographic setup, achieving 1-RTT (or 0-RTT on
      resumption).
    ref: "concepts.md#tls-over-tcp-vs-quic"

  - id: tls-ssl-https-048
    difficulty: advanced
    tags: [hol-blocking, quic, tcp]
    question: |
      A single packet is lost on a connection carrying many concurrent streams. Compare
      TLS-over-TCP (HTTP/2) with QUIC (HTTP/3).
    options:
      - "Both protocols stall every multiplexed stream equally, since packet loss always halts the whole connection"
      - "In QUIC every stream stalls on any loss, while in HTTP/2 over TCP no stream is ever affected by a dropped segment"
      - "Neither protocol is affected by packet loss, because both silently reconstruct the missing data without stalling"
      - "In HTTP/2 over TCP the lost segment stalls all streams (transport HOL blocking); in QUIC only the affected stream stalls"
    answer: 3
    explanation: |
      TCP delivers one ordered byte stream, so a lost segment blocks every multiplexed
      HTTP/2 stream. QUIC provides independent streams, so loss only stalls the stream(s)
      whose data was in the lost packet.
    ref: "concepts.md#tls-over-tcp-vs-quic"

  - id: tls-ssl-https-049
    difficulty: intermediate
    tags: [quic, encryption, mandatory]
    question: |
      Regarding encryption, how does QUIC/HTTP/3 differ from TLS-over-TCP?
    options:
      - "Encryption is mandatory in QUIC/HTTP/3 (no cleartext mode), whereas TLS over TCP is technically optional in the spec"
      - "QUIC deliberately makes encryption optional to improve compatibility with legacy middleboxes on the path"
      - "QUIC provides no encryption of its own and instead depends entirely on an underlying IPsec tunnel for security"
      - "Both QUIC and TLS-over-TCP treat encryption as an optional, negotiable feature that can be switched off"
    answer: 0
    explanation: |
      QUIC has no unencrypted mode — TLS 1.3 protection is built in and mandatory. Over
      TCP, HTTP can technically run cleartext (though HTTPS is used in practice).
    ref: "concepts.md#tls-over-tcp-vs-quic"

  - id: tls-ssl-https-050
    difficulty: advanced
    tags: [quic, connection-migration]
    question: |
      A mobile user switches from Wi-Fi to cellular, changing their IP address. Why can a
      QUIC connection survive this while a TCP+TLS connection breaks?
    options:
      - "QUIC identifies connections by a Connection ID rather than the 4-tuple, so it can migrate to the new IP without a new handshake"
      - "QUIC instantly re-runs the entire TLS 1.3 handshake from scratch the moment the client's IP address changes"
      - "TCP automatically renegotiates its sequence numbers and window to follow the endpoint onto the new IP address"
      - "QUIC ignores IP addresses entirely and instead keys each connection on the endpoint's hardware MAC address"
    answer: 0
    explanation: |
      TCP connections are keyed on the (src IP, src port, dst IP, dst port) 4-tuple, so an
      IP change breaks them. QUIC uses a Connection ID, letting the session migrate across
      network changes without re-handshaking.
    ref: "concepts.md#tls-over-tcp-vs-quic"

  - id: tls-ssl-https-051
    difficulty: beginner
    tags: [record, framing]
    question: |
      What is the unit of data that the TLS record layer emits on the wire?
    options:
      - "A raw IP packet at the network layer"
      - "A single link-layer Ethernet frame"
      - "A TLS record (up to ~16 KB of plaintext each)"
      - "A DNS resolver query datagram"
    answer: 2
    explanation: |
      TLS chops application data into records, each carrying up to 2^14 (16 KB) bytes of
      plaintext, which are then encrypted and handed to TCP. A single write may span
      multiple records.
    ref: "concepts.md#tls-position-in-the-protocol-stack"

  - id: tls-ssl-https-052
    difficulty: advanced
    tags: [forward-secrecy, definition]
    question: |
      Which statement best defines forward secrecy in TLS?
    options:
      - "Past sessions can always be decrypted retroactively whenever the issuing certificate authority's signing key is compromised"
      - "Future sessions are automatically encrypted with the exact same symmetric key that protected all of the past ones"
      - "The client and server agree on a single permanent shared secret key that is reused for every session between them"
      - "Compromise of the server's long-term private key in the future does not let an attacker decrypt previously recorded sessions, because session keys came from ephemeral (EC)DHE"
    answer: 3
    explanation: |
      Forward secrecy means recording ciphertext today and stealing the private key later
      still won't reveal past sessions, because each session's key derives from ephemeral
      Diffie-Hellman values that are discarded. TLS 1.3 mandates this.
    ref: "concepts.md#tls-13-handshake"

  - id: tls-ssl-https-053
    difficulty: intermediate
    tags: [dns, privacy, doh, scenario]
    question: |
      A privacy-conscious user enables HTTPS everywhere but still finds their ISP can see
      which hostnames they visit. What combination actually hides the hostname?
    options:
      - "Encrypted DNS (DoH/DoT) plus ECH, so neither the DNS query nor the SNI reveals the hostname"
      - "HTTPS on its own is entirely sufficient, since it already encrypts the hostname end to end"
      - "Merely switching the connection from TLS 1.2 up to TLS 1.3 hides the hostname on its own"
      - "Using a longer RSA certificate key length conceals which hostname the client is visiting"
    answer: 0
    explanation: |
      HTTPS encrypts content but plain DNS leaks the hostname and cleartext SNI leaks it
      too. Hiding the hostname requires encrypted DNS (DoH/DoT) plus ECH (encrypted
      ClientHello). The destination IP still remains visible.
    ref: "concepts.md#https--http-over-tls"

  - id: tls-ssl-https-054
    difficulty: advanced
    tags: [tls12, weaknesses, cbc]
    question: |
      Which of these vulnerability classes is associated with misconfigured TLS 1.2 (and
      earlier), and was largely eliminated by TLS 1.3's AEAD-only design?
    options:
      - "TCP SYN flood connection-exhaustion attacks"
      - "CBC-mode padding-oracle attacks (e.g. Lucky13/POODLE-style)"
      - "DNS resolver cache-poisoning attacks"
      - "Local-network ARP spoofing attacks"
    answer: 1
    explanation: |
      Older CBC cipher modes enabled padding-oracle attacks (Lucky13, POODLE on SSLv3),
      and RC4/EXPORT ciphers had their own flaws. TLS 1.3 removed CBC/RC4 and mandates
      AEAD, eliminating that whole class.
    ref: "concepts.md#tls-12-handshake"

  - id: tls-ssl-https-055
    difficulty: intermediate
    tags: [dv-ov-ev, validation-levels]
    question: |
      What does a Domain Validation (DV) certificate actually attest, compared to
      Organization/Extended Validation?
    options:
      - "That the operator has been confirmed as a legally registered business with a verified street address"
      - "That the site was scanned and certified free of malware and phishing content at issuance time"
      - "Only that the requester demonstrated control of the domain, not any organizational identity"
      - "That the private key is generated and stored inside a certified hardware security module (HSM)"
    answer: 2
    explanation: |
      DV certs (e.g. Let's Encrypt) only prove control of the domain. OV/EV involve
      additional organizational vetting. Browsers no longer show special EV UI, so the
      practical difference is mostly the issuance process, not user-visible security.
    ref: "concepts.md#certificates-and-the-pki-chain-of-trust"

  - id: tls-ssl-https-056
    difficulty: advanced
    tags: [quic, tls-record, misconception]
    question: |
      Why is describing HTTP/3 as "TLS over UDP" technically imprecise?
    options:
      - "HTTP/3 uses no TLS keys at all, relying instead on a bespoke QUIC-native cipher unrelated to the TLS key schedule"
      - "HTTP/3 actually runs over TCP underneath, and only the outermost framing layer is switched to UDP for compatibility"
      - "QUIC negotiates with the TLS 1.2 handshake and wraps its payload in the classic TLS record layer over UDP"
      - "QUIC uses the TLS 1.3 handshake for key agreement but does its own packet encryption; it does not run the TLS record layer over UDP"
    answer: 3
    explanation: |
      QUIC integrates the TLS 1.3 handshake for keys but protects its own packets rather
      than wrapping a TLS record layer around UDP. The accurate phrasing is "QUIC
      integrates the TLS 1.3 handshake."
    ref: "concepts.md#tls-over-tcp-vs-quic"

  - id: tls-ssl-https-057
    difficulty: expert
    tags: [key-schedule, hkdf, tls13]
    question: |
      In the TLS 1.3 key schedule, both peers derive identical traffic keys without
      transmitting them. Which set of inputs is fed into the HKDF ladder to produce the
      handshake and application traffic secrets?
    options:
      - "Only the server's long-term certificate private key, decrypted and expanded directly into traffic keys"
      - "The negotiated cipher suite ID and the session ticket lifetime, concatenated and run through HKDF-Expand"
      - "The client and server random values alone, hashed with SHA-256 to seed a per-record keystream"
      - "The optional PSK, the (EC)DHE shared secret, and the running transcript hash"
    answer: 3
    explanation: |
      HKDF-Extract mixes in the PSK (Early Secret) then the (EC)DHE secret (Handshake
      Secret), and Derive-Secret binds each stage to the transcript hash. Both sides share
      those inputs, so they compute the same keys — nothing is sent on the wire.
    ref: "concepts.md#tls-13-key-schedule-and-hkdf"

  - id: tls-ssl-https-058
    difficulty: expert
    tags: [hkdf, derive-secret, transcript]
    question: |
      What distinguishes Derive-Secret from a plain HKDF-Expand-Label in the TLS 1.3 key
      schedule?
    options:
      - "Derive-Secret substitutes an AES-GCM keystream for the underlying hash function when expanding the label"
      - "Derive-Secret omits the mandatory 'tls13 ' label prefix that HKDF-Expand-Label always prepends to the info field"
      - "Derive-Secret passes the transcript hash of the handshake messages as the context, binding the derived secret to the negotiation so far"
      - "Derive-Secret invokes HKDF-Extract twice in succession instead of performing any HKDF-Expand step at all"
    answer: 2
    explanation: |
      Derive-Secret(secret, label, messages) = HKDF-Expand-Label(secret, label,
      Transcript-Hash(messages), Hash.length). Folding the transcript hash into the context
      cryptographically ties each derived secret to the exact handshake seen so far.
    ref: "concepts.md#tls-13-key-schedule-and-hkdf"

  - id: tls-ssl-https-059
    difficulty: expert
    tags: [certificate-verify, transcript, tls13]
    question: |
      A TLS 1.3 CertificateVerify message is a signature over what, and why does that scope
      matter?
    options:
      - "A fresh server-chosen nonce only, which proves the peer is live in this exchange but says nothing about handshake integrity"
      - "The transcript hash of the whole handshake so far, proving key possession AND that the signer observed this exact negotiation"
      - "The server's certificate serial number and issuer name, so the signature binds the leaf to its issuing CA record"
      - "The negotiated cipher suite identifier alone, so a tampered suite selection can be detected and cipher downgrade prevented"
    answer: 1
    explanation: |
      CertificateVerify signs the transcript hash (RFC 8446 §4.4.3). This simultaneously
      proves possession of the leaf's private key and binds the identity to the specific
      handshake, defeating an attacker who tampered with earlier messages.
    ref: "concepts.md#tls-13-message-semantics-encryptedextensions-certificateverify-finished"

  - id: tls-ssl-https-060
    difficulty: advanced
    tags: [encrypted-extensions, tls13, privacy]
    question: |
      Which extensions belong in the TLS 1.3 EncryptedExtensions message rather than the
      cleartext ServerHello?
    options:
      - "key_share and supported_versions, since these must be readable to bootstrap the encryption keys themselves"
      - "pre_shared_key alone, since it names the resumption ticket the whole encrypted flight is keyed from"
      - "Extensions not needed to establish keys, such as the ALPN selection and SNI acknowledgement"
      - "The full certificate chain together with its stapled OCSP revocation status response"
    answer: 2
    explanation: |
      Key-establishment extensions (key_share, supported_versions, pre_shared_key) stay in
      the cleartext ServerHello. Everything else — ALPN, SNI ack, transport params — moves
      into EncryptedExtensions so passive observers cannot read it.
    ref: "concepts.md#tls-13-message-semantics-encryptedextensions-certificateverify-finished"

  - id: tls-ssl-https-061
    difficulty: expert
    tags: [downgrade, serverhello-random, sentinel]
    question: |
      A TLS 1.3-capable client completes a handshake and finds the last 8 bytes of
      ServerHello.random equal to 44 4F 57 4E 47 52 44 01 ("DOWNGRD\x01"), yet it expected
      1.3. What does it do and why is the canary trustworthy?
    options:
      - "It proceeds silently and completes the handshake, because those trailing bytes are simply uninitialised random padding with no defined protocol meaning"
      - "It aborts with illegal_parameter; the server set the sentinel to signal it negotiated 1.2, and the value is covered by the signature/Finished so an attacker cannot strip it"
      - "It obediently downgrades all the way to TLS 1.1, since the sentinel is a server instruction telling the client which lower version to fall back to"
      - "It retries the handshake with TLS_FALLBACK_SCSV in the ClientHello, treating the embedded sentinel as an explicit server-issued fallback request"
    answer: 1
    explanation: |
      A 1.3 server negotiating 1.2 embeds the DOWNGRD\x01 sentinel in ServerHello.random. A
      1.3-capable client that sees it despite expecting 1.3 concludes an active downgrade
      occurred and aborts. Because random is signed/covered by Finished, it can't be forged.
    ref: "concepts.md#downgrade-protection"

  - id: tls-ssl-https-062
    difficulty: expert
    tags: [fallback-scsv, downgrade, poodle]
    question: |
      What is the specific purpose of TLS_FALLBACK_SCSV (RFC 7507)?
    options:
      - "It is sent only on a fallback retry to tell the server 'this is a downgrade dance'; a server supporting a higher version than offered then aborts with inappropriate_fallback"
      - "It is a strong AES-256-GCM AEAD cipher suite introduced in TLS 1.3 to replace the deprecated CBC-mode suites"
      - "It signals to the server that the client supports abbreviated session resumption via a cached session ticket"
      - "It advertises the full list of elliptic curves and finite-field DH groups the client is willing to use"
    answer: 0
    explanation: |
      When a client retries at a lower version after a failed handshake, it includes
      FALLBACK_SCSV. A server capable of a higher version recognizes the forced downgrade and
      rejects it, defeating the POODLE-era attack of breaking the first handshake to force TLS 1.0.
    ref: "concepts.md#downgrade-protection"

  - id: tls-ssl-https-063
    difficulty: expert
    tags: [certificate-transparency, sct, precertificate]
    question: |
      Why must a CA log a "precertificate" with a poison extension before issuing the final
      certificate, when SCTs are to be embedded in the cert?
    options:
      - "The poison extension encrypts the certificate's public key until the subscriber's payment to the CA clears settlement"
      - "To resolve a chicken-and-egg problem: the SCT must be signed by the log before the cert is finalized, so a poisoned (TLS-unusable) precert is logged first to obtain SCTs to embed"
      - "The precertificate is the artifact browsers actually download and validate at handshake time instead of the final certificate"
      - "It lets the CA reuse a single log-signed SCT across many unrelated certificates issued to different domains"
    answer: 1
    explanation: |
      Embedding an SCT requires the log to sign the cert, but the SCT changes the cert —
      circular. The CA logs a precertificate carrying a critical poison extension (unusable
      for TLS), gets SCTs, then embeds them into the real cert.
    ref: "concepts.md#certificate-transparency-and-scts"

  - id: tls-ssl-https-064
    difficulty: advanced
    tags: [certificate-transparency, sct, mmd]
    question: |
      What does a Signed Certificate Timestamp (SCT) actually represent?
    options:
      - "A log's signed promise to include the certificate in its Merkle tree within the Maximum Merge Delay (typically 24h)"
      - "The certificate's notBefore validity timestamp, counter-signed by the issuing CA to prove issuance time"
      - "A revocation timestamp issued by an OCSP responder recording the instant the cert was marked invalid"
      - "A record of the exact moment the end-user's browser first observed and cached the certificate"
    answer: 0
    explanation: |
      An SCT is a CT log's signed commitment to merge the (pre)certificate into its
      append-only tree within the MMD. Browsers require enough SCTs from qualifying logs or
      they reject the certificate.
    ref: "concepts.md#certificate-transparency-and-scts"

  - id: tls-ssl-https-065
    difficulty: advanced
    tags: [hsts, ssl-stripping, preload]
    question: |
      HSTS with a plain response header still leaves one attack window. What is it, and what
      closes it?
    options:
      - "It leaks the SNI hostname to on-path observers during the handshake; Encrypted Client Hello (ECH) closes that window"
      - "The trust-on-first-use gap on the very first visit before any header is seen; the HSTS preload list (baked into the browser binary) closes it"
      - "It exposes session cookies to plaintext interception; marking every cookie with the Secure attribute closes it"
      - "It disables OCSP revocation checking for the domain; enabling OCSP stapling on the server closes the gap"
    answer: 1
    explanation: |
      A header-only HSTS policy is TOFU — the first-ever request (before the header arrives)
      can still be stripped. The preload list compiles qualifying domains into the browser so
      even the first request is forced to HTTPS.
    ref: "concepts.md#hsts-and-ssl-stripping"

  - id: tls-ssl-https-066
    difficulty: advanced
    tags: [hsts, ssl-stripping, redirect]
    question: |
      For a host already known to the browser via HSTS, how does the browser prevent any
      plaintext HTTP request from leaving the machine?
    options:
      - "It transmits the plaintext HTTP request as normal but strips all cookies and authentication headers from it first"
      - "It sends the plaintext request anyway and waits for the origin server to reply with a 301 redirect pointing at HTTPS"
      - "It issues a browser-internal 307 Internal Redirect to https:// before any packet is sent, and forbids click-through on cert errors"
      - "It quietly opens the connection over QUIC on UDP instead of TCP, which forces the traffic to be encrypted"
    answer: 2
    explanation: |
      For a known-HSTS host the browser upgrades http:// to https:// with an internal 307
      redirect before transmitting anything, so an SSL-stripping MITM never sees a plaintext
      request. It also removes the ability to bypass certificate errors.
    ref: "concepts.md#hsts-and-ssl-stripping"

  - id: tls-ssl-https-067
    difficulty: advanced
    tags: [hpkp, pinning, ct]
    question: |
      Why was HTTP Public Key Pinning (HPKP) deprecated and removed from browsers?
    options:
      - "It functioned only over HTTP/1.1 and broke entirely once sites migrated their connections to HTTP/2 multiplexing"
      - "Its failure modes were catastrophic and irreversible: 'HPKP suicide' (locking yourself out) and hostile/ransom pinning; it was replaced by Certificate Transparency"
      - "It depended on TLS 1.3 features that had not yet shipped in any mainstream browser at the time of the proposal"
      - "It transmitted the pinned public-key hashes in a cleartext header, leaking them to any passive on-path observer"
    answer: 1
    explanation: |
      A site could brick itself for the pin's lifetime by mispinning, and an attacker with a
      brief foothold could pin a hostile key to lock out the owner. The blast radius was
      unacceptable, so CT (global mis-issuance detection) replaced it.
    ref: "concepts.md#certificate-pinning-and-why-hpkp-was-abandoned"

  - id: tls-ssl-https-068
    difficulty: expert
    tags: [post-quantum, store-now-decrypt-later, forward-secrecy]
    question: |
      An attacker records all your ECDHE-protected TLS 1.3 traffic today. Forward secrecy
      means stealing the server key later reveals nothing — so why is post-quantum key
      exchange still urgent now?
    options:
      - "Because ephemeral ECDHE key shares silently expire and become decryptable roughly 47 days after the session is recorded"
      - "Because RSA-PSS handshake signatures can already be forged on today's commodity GPU hardware in a matter of hours"
      - "Because forward secrecy is silently disabled on any connection that uses session resumption via a PSK ticket"
      - "Because a future quantum computer running Shor's algorithm could break the recorded ECDHE key exchange retroactively (store-now-decrypt-later)"
    answer: 3
    explanation: |
      Forward secrecy protects against later theft of the long-term key, not against a future
      quantum computer that can solve the discrete log underlying ECDHE. Harvested ciphertext
      could be decrypted retroactively, so PQ key exchange must be deployed before that machine exists.
    ref: "concepts.md#post-quantum-key-exchange"

  - id: tls-ssl-https-069
    difficulty: expert
    tags: [post-quantum, hybrid, ml-kem]
    question: |
      Why do current deployments use a HYBRID group like X25519MLKEM768 rather than ML-KEM
      alone?
    options:
      - "ML-KEM's encapsulation is far too slow to complete within a normal TLS handshake round-trip budget on its own"
      - "To hedge: the session stays secure if EITHER X25519 or ML-KEM survives, protecting against both future quantum attacks and implementation bugs in young PQ code"
      - "Browsers are structurally unable to parse a standalone ML-KEM key share unless a classical share precedes it"
      - "Hybrid mode is mandatory because a lone ML-KEM key share is too small to fill a single ClientHello packet"
    answer: 1
    explanation: |
      Hybrid concatenates a classical X25519 share with an ML-KEM-768 (FIPS 203) share and
      mixes both secrets. Security holds if either algorithm is unbroken — an algorithm hedge
      plus an implementation hedge against bugs like KyberSlash.
    ref: "concepts.md#post-quantum-key-exchange"

  - id: tls-ssl-https-070
    difficulty: expert
    tags: [post-quantum, ossification, clienthello]
    question: |
      What new on-the-wire problem does adding an ML-KEM key share to the ClientHello create?
    options:
      - "Adding the share silently encrypts the whole ClientHello, so on-path middleboxes can no longer read the plaintext SNI"
      - "The large (~1.1 KB) key share pushes the ClientHello beyond a single TCP/QUIC initial packet, exposing middlebox ossification and anti-amplification interactions"
      - "It forces every single connection through a mandatory extra HelloRetryRequest round trip before any data flows"
      - "It cannot be carried by TLS 1.3 at all, so every such handshake must fall back to the older TLS 1.2 negotiation"
    answer: 1
    explanation: |
      ML-KEM shares are large, so the ClientHello no longer fits one packet. Middleboxes that
      assumed a small hello may choke, and it interacts with QUIC anti-amplification limits;
      clients may fast-send and fall back to HRR if dropped.
    ref: "concepts.md#post-quantum-key-exchange"

  - id: tls-ssl-https-071
    difficulty: advanced
    tags: [certificate-lifetime, sc-081, acme]
    question: |
      The CA/Browser Forum ballot SC-081 phases maximum public certificate validity down to
      47 days by 2029. What is the main operational consequence?
    options:
      - "Certificates become substantially cheaper to buy because CAs amortise validation costs over shorter terms"
      - "Manual renewal becomes infeasible, making ACME-style automated issuance effectively mandatory"
      - "OCSP stapling is prohibited outright, since short-lived certs are assumed to make revocation checks redundant"
      - "Wildcard certificates are banned entirely under the new maximum-validity rules and must be replaced with SAN lists"
    answer: 1
    explanation: |
      At 47-day validity (and DCV reuse shrinking toward 10 days), no team can renew by hand
      reliably. Automated ACME issuance/renewal becomes a hard requirement.
    ref: "concepts.md#certificate-lifetimes-caa-and-mpic"

  - id: tls-ssl-https-072
    difficulty: advanced
    tags: [caa, mpic, mis-issuance]
    question: |
      What do CAA DNS records and MPIC each contribute to reducing certificate mis-issuance?
    options:
      - "CAA encrypts the domain-control validation traffic end to end, while MPIC caches prior validation results to skip repeat checks"
      - "Both are browser-side revocation mechanisms that let clients query whether an issued certificate has since been withdrawn"
      - "CAA lists which CAs may issue for a domain; MPIC requires the CA to corroborate domain control from multiple network vantage points"
      - "CAA pins the leaf certificate's public key in DNS, while MPIC pins the intermediate CA's key across the issuance path"
    answer: 2
    explanation: |
      CAA (RFC 8659) lets a domain owner restrict issuance to named CAs. MPIC requires the CA
      to validate domain control from several network perspectives, defeating a localized BGP
      hijack or on-path spoof near the CA.
    ref: "concepts.md#certificate-lifetimes-caa-and-mpic"

  - id: tls-ssl-https-073
    difficulty: expert
    tags: [record-layer, tlsinnerplaintext, wire-format]
    question: |
      A passive observer captures a TLS 1.3 connection. After ServerHello, what ContentType
      appears in the outer record headers of the encrypted records, and why?
    options:
      - "handshake(22) for the certificate and Finished messages, then application_data(23) once the encrypted session traffic begins to flow"
      - "application_data(23) for ALL protected records, because the real content type is moved inside the encrypted TLSInnerPlaintext"
      - "The true content type of each record appears in the header, since the TLS 1.3 record header is transmitted in cleartext and never encrypted"
      - "change_cipher_spec(20), because TLS 1.3 retains the ChangeCipherSpec record type on every protected record to signal the active cipher"
    answer: 1
    explanation: |
      In TLS 1.3 the real content type moves inside the encrypted TLSInnerPlaintext (content
      || type || zero-padding). The outer opaque_type is always application_data(23), so an
      observer cannot distinguish handshake, alert, or app-data records, nor learn true lengths.
    ref: "concepts.md#tls-record-layer-wire-format"

  - id: tls-ssl-https-074
    difficulty: advanced
    tags: [record-layer, legacy-version, header]
    question: |
      In a TLS 1.3 record header, the legacy_record_version field is set to 0x0303 (TLS 1.2).
      Why?
    options:
      - "Because TLS 1.3 records are actually encrypted using the TLS 1.2 key-derivation schedule, so the header must advertise the matching 1.2 version"
      - "To signal that the record carries a downgrade sentinel, warning the peer that a lower protocol version was selected during negotiation"
      - "It is a long-standing bug in most TLS libraries that mislabel the record version field, and the value is simply ignored by every compliant peer"
      - "For middlebox compatibility — the true version is negotiated via supported_versions, and pinning the record version to 1.2 avoids tripping ossified middleboxes"
    answer: 3
    explanation: |
      TLS 1.3 disguises itself as 1.2 on the wire; the real version lives in the
      supported_versions extension. Pinning legacy_record_version to 0x0303 prevents
      middleboxes that ossified around 1.2 from dropping the records.
    ref: "concepts.md#tls-record-layer-wire-format"

  - id: tls-ssl-https-075
    difficulty: expert
    tags: [aead, nonce, sequence-number]
    question: |
      How is the per-record AEAD nonce constructed in TLS 1.3, given that no explicit IV
      appears on the wire?
    options:
      - "A fresh random 96-bit IV is generated per record and prepended to each record's ciphertext on the wire"
      - "The static write_iv is XORed with the 64-bit record sequence number, which each side increments locally"
      - "The nonce is the SHA-256 hash of the previous record's ciphertext, chaining each record's IV to the one that came before it"
      - "The client and server exchange a freshly negotiated nonce inside every ChangeCipherSpec message before sending the next batch of data"
    answer: 1
    explanation: |
      Each direction has a static write_iv from the key schedule; the nonce is write_iv XOR
      the monotonically increasing record sequence number. Both peers track the counter
      independently, so no per-record IV is transmitted.
    ref: "concepts.md#aead-nonces-sequence-numbers-and-keyupdate"

  - id: tls-ssl-https-076
    difficulty: expert
    tags: [key-update, aead-limits, forward-secrecy]
    question: |
      Why does TLS 1.3 provide the post-handshake KeyUpdate message?
    options:
      - "To rekey traffic keys mid-connection — staying under AES-GCM record-count limits and giving forward secrecy within a long-lived connection"
      - "To renegotiate the cipher suite mid-connection, letting either peer switch to a stronger AEAD algorithm without tearing down the session"
      - "To switch the transport from TCP to QUIC without dropping the session, migrating the encrypted stream onto UDP transparently"
      - "To request the peer's certificate again after connect, forcing a fresh CertificateVerify so the identity can be re-checked mid-session"
    answer: 0
    explanation: |
      KeyUpdate derives a new traffic secret (via the "traffic upd" label) and resets the
      sequence number. It keeps AEAD usage under safe bounds and refreshes keys so a later
      compromise cannot decrypt earlier data in the same long connection.
    ref: "concepts.md#aead-nonces-sequence-numbers-and-keyupdate"

  - id: tls-ssl-https-077
    difficulty: expert
    tags: [psk-modes, forward-secrecy, resumption]
    question: |
      A client resumes a TLS 1.3 session using a ticket. Under which condition is the resumed
      connection forward-secret?
    options:
      - "Always — TLS 1.3 mandates forward secrecy for every connection, including resumptions, because ticket state is always mixed with a fresh key"
      - "Only if psk_dhe_ke was used (PSK combined with a fresh ECDHE exchange); psk_ke alone has no fresh DH and therefore no forward secrecy"
      - "Only if the client also sends 0-RTT early data, since the early-data secret is what injects fresh entropy into the resumed key"
      - "Only if the server rotated its certificate since the original handshake, because a new leaf key reseeds the resumption secret"
    answer: 1
    explanation: |
      psk_key_exchange_modes selects psk_ke (PSK-only, no new DH, no FS) or psk_dhe_ke (PSK +
      fresh ECDHE, FS restored). Resumption is forward-secret only under psk_dhe_ke — a common
      trap question.
    ref: "concepts.md#signature-algorithms-and-named-groups"

  - id: tls-ssl-https-078
    difficulty: expert
    tags: [signature-algorithms, rsa-pss, pkcs1]
    question: |
      In the TLS 1.3 handshake, which RSA signature scheme is mandated for CertificateVerify,
      and what is banned?
    options:
      - "PKCS#1 v1.5 is mandated for CertificateVerify; RSA-PSS is banned outright because its randomized salt breaks transcript binding"
      - "RSA-PSS (rsa_pss_rsae_*) is required for handshake signatures; legacy PKCS#1 v1.5 handshake signatures and SHA-1/MD5 schemes are banned"
      - "Both PKCS#1 v1.5 and RSA-PSS are forbidden in the handshake; only ECDSA over the P-256 curve is permitted for CertificateVerify"
      - "Any scheme the client offers in signature_algorithms, including MD5 and SHA-1, is acceptable as long as both peers agree on it"
    answer: 1
    explanation: |
      TLS 1.3 requires RSA-PSS for signing in the handshake and disallows PKCS#1 v1.5
      handshake signatures (they survive only for older cert-chain signatures under a distinct
      code point). SHA-1/MD5 signature schemes are banned. ROBOT/Bleichenbacher motivated this.
    ref: "concepts.md#signature-algorithms-and-named-groups"

  - id: tls-ssl-https-079
    difficulty: advanced
    tags: [renegotiation, prefix-injection, rfc5746]
    question: |
      What did the 2009 TLS renegotiation attack exploit, and how was it fixed?
    options:
      - "A CBC-mode padding oracle in the renegotiation flight; fixed by mandating AEAD ciphers that leak no padding-validity signal"
      - "Renegotiation handshakes were not cryptographically linked to the prior context, allowing MITM prefix injection; fixed by the renegotiation_info extension (RFC 5746) binding each renegotiation to prior Finished values"
      - "A compression side channel exposed during renegotiation; fixed by permanently removing record-layer TLS compression from the protocol"
      - "A weak finite-field Diffie-Hellman group reused across renegotiations; fixed by requiring named ffdhe2048+ groups with fresh parameters"
    answer: 1
    explanation: |
      An MITM could inject an authenticated prefix by splicing a renegotiation onto an
      attacker-started connection, since the two handshakes weren't linked. RFC 5746 binds
      renegotiations to the previous Finished. TLS 1.3 removes renegotiation entirely.
    ref: "concepts.md#renegotiation-and-the-secure-renegotiation-extension"

  - id: tls-ssl-https-080
    difficulty: expert
    tags: [middlebox-compat, change-cipher-spec, wireshark]
    question: |
      A Wireshark capture of a TLS 1.3 connection shows a ChangeCipherSpec record even though
      TLS 1.3 removed CCS semantics. Why is it there?
    options:
      - "The connection actually fell back to TLS 1.2, so the ChangeCipherSpec carries genuine 1.2 semantics activating the negotiated cipher"
      - "It is a dummy CCS sent for middlebox compatibility mode, so boxes expecting the classic 1.2 pattern don't choke; it carries no cryptographic meaning in 1.3"
      - "It signals that a post-handshake KeyUpdate is about to occur, telling the peer to roll its traffic keys before the next record"
      - "It is an active attacker injecting a downgrade record to force the session onto an older, weaker protocol version"
    answer: 1
    explanation: |
      TLS 1.3's middlebox compatibility mode emits a dummy ChangeCipherSpec (and pins
      legacy_version to 0x0303, uses a non-empty legacy_session_id) to look like 1.2 on the
      wire. The CCS has no 1.3 semantics; it just placates ossified middleboxes.
    ref: "concepts.md#middlebox-compatibility-mode-and-grease"

  - id: tls-ssl-https-081
    difficulty: advanced
    tags: [grease, ossification, extensibility]
    question: |
      What is the purpose of GREASE (RFC 8701) values that clients advertise in the
      ClientHello?
    options:
      - "They are strong post-quantum cipher suites advertised early so servers can begin negotiating quantum-safe key exchange during the handshake"
      - "They encrypt the SNI hostname before ECH is available, acting as a lightweight interim shield against on-path hostname observation"
      - "They compress the ClientHello so its extensions and key shares fit within a single TCP or QUIC initial packet on the wire"
      - "They are reserved dummy values (cipher suites, extensions, groups) that train servers/middleboxes to ignore unknown values, preventing ossification that would block future extensions"
    answer: 3
    explanation: |
      GREASE injects random-looking reserved values so implementations learn to tolerate
      unknown ones. This keeps the protocol extensible — new real extensions/versions won't be
      dropped by intermediaries that assumed a fixed value set.
    ref: "concepts.md#middlebox-compatibility-mode-and-grease"

  - id: tls-ssl-https-082
    difficulty: expert
    tags: [hello-retry-request, cookie, stateless]
    question: |
      Beyond a DoS/reachability check, how does the TLS 1.3 cookie extension help a server
      handle a HelloRetryRequest?
    options:
      - "It lets the server stay stateless across the HRR by encoding a hash of the first ClientHello (and the HRR) into the cookie instead of holding connection state in memory"
      - "It caches the negotiated session key inside the cookie so future connections can resume without repeating the ECDHE exchange"
      - "It carries the server's certificate chain inside the HelloRetryRequest so the client can pre-validate identity before resending"
      - "It selects the elliptic curve group on the client's behalf, overriding the key_share the client originally guessed in its first hello"
    answer: 0
    explanation: |
      The cookie both proves the client is reachable at its claimed address (anti-DoS) and
      lets the server avoid storing state between the two client flights by carrying a digest
      of the prior ClientHello/HRR, which it verifies when the second ClientHello returns.
    ref: "concepts.md#helloretryrequest-and-the-cookie-extension"

  - id: tls-ssl-https-083
    difficulty: expert
    tags: [0-rtt, anti-replay, design]
    question: |
      You must design safe 0-RTT for a checkout service. Which combination correctly applies
      RFC 8446 §8 anti-replay mechanisms?
    options:
      - "Enable 0-RTT for all endpoints, including checkout, since TLS 1.3 guarantees each resumption ticket is single-use and cannot be replayed"
      - "Allow 0-RTT only on idempotent paths, use single-use tickets plus a tight freshness window (obfuscated_ticket_age), and route the checkout POST through the full handshake"
      - "Disable forward secrecy on the early-data path so replays can be detected by observing repeated session-key reuse across requests"
      - "Accept 0-RTT for the checkout POST but log duplicate requests so any replayed transfers can be reversed with later refunds"
    answer: 1
    explanation: |
      0-RTT is replayable and not forward-secret. Safe design: restrict early data to
      idempotent requests, combine single-use tickets (§8.1) and freshness checks (§8.3), and
      force non-idempotent operations like checkout through the full 1-RTT handshake.
    ref: "concepts.md#0-rtt-anti-replay-in-depth"

  - id: tls-ssl-https-084
    difficulty: expert
    tags: [stek, forward-secrecy, resumption]
    question: |
      A server uses ECDHE (forward secrecy) plus session-ticket resumption, but never rotates
      its Session Ticket Encryption Key (STEK). What is the consequence?
    options:
      - "Nothing — ECDHE alone guarantees forward secrecy regardless of ticket keys, since the ephemeral exchange fully protects every resumed session"
      - "Resumption stops working after the first session, because an unrotated STEK can only decrypt a single ticket before it is exhausted"
      - "A compromise of the long-lived STEK lets an attacker decrypt every ticket it protected and recover the resumed sessions, undermining forward secrecy despite ECDHE"
      - "The server certificate is exposed to passive observers, because a static STEK forces the Certificate message back into cleartext"
    answer: 2
    explanation: |
      Tickets are encrypted under the STEK. If it is long-lived and leaks, all tickets it
      protected — and the resumed session secrets — are exposed, defeating forward secrecy.
      The fix is frequent STEK rotation with secure fleet-wide distribution.
    ref: "concepts.md#session-ticket-forward-secrecy-caveat-stek-rotation"

  - id: tls-ssl-https-085
    difficulty: expert
    tags: [heartbleed, protocol-vs-implementation, vulnerabilities]
    question: |
      Which statement about Heartbleed is correct in an interview?
    options:
      - "It was a fundamental flaw in the TLS protocol specification itself, requiring a revision of the heartbeat extension in RFC 6520 to fix"
      - "It was an OpenSSL implementation bug — a missing bounds check on the heartbeat extension causing buffer over-read — not a weakness in the TLS protocol itself"
      - "It was a CBC-mode padding-oracle attack against the record layer, fixed by mandating AEAD ciphers that reveal no padding-validity signal"
      - "It was a protocol downgrade attack forcing a weak version, fixed by the TLS_FALLBACK_SCSV signaling cipher suite in RFC 7507"
    answer: 1
    explanation: |
      Heartbleed was a memory-safety bug in OpenSSL's heartbeat handling that leaked adjacent
      memory (keys, data). The distinction interviewers want: it was an implementation defect,
      not a protocol flaw — unlike POODLE or the renegotiation attack.
    ref: "concepts.md#legacy-tls-attack-catalog"

  - id: tls-ssl-https-086
    difficulty: advanced
    tags: [crime, breach, compression]
    question: |
      Why was compression removed from TLS, and which attacks demonstrated the problem?
    options:
      - "Compression measurably slowed the handshake under load; the BEAST attack demonstrated the resulting timing problem against CBC records"
      - "Compression corrupted the certificate chain during transit; the DROWN attack exploited the resulting malformed handshake messages"
      - "Compression broke AEAD integrity tags on large records; the Lucky13 timing attack exploited the resulting authentication gap"
      - "Compressing plaintext with attacker-controlled data leaks secrets via ciphertext length; CRIME (TLS compression) and BREACH (HTTP compression) exploited this"
    answer: 3
    explanation: |
      When a secret and attacker-influenced data are compressed together, the compressed size
      reveals how much they share, allowing byte-by-byte secret recovery. CRIME (TLS-level)
      and BREACH (HTTP-level) proved it, so TLS compression was removed.
    ref: "concepts.md#legacy-tls-attack-catalog"

  - id: tls-ssl-https-087
    difficulty: expert
    tags: [chain-building, root-expiry, android]
    question: |
      A leaf certificate is valid and modern browsers accept it, but old Android (<7.1.1)
      devices fail after September 2021. What is the classic cause?
    options:
      - "The leaf certificate expired only on Android devices, because older Android builds enforce a shorter maximum notAfter window on leaf certs"
      - "The server stopped stapling OCSP responses, and old Android hard-fails the handshake when a stapled revocation proof is absent"
      - "Old Android does not support SNI, so a server hosting many virtual hosts on one IP returns the wrong certificate to those clients"
      - "Old Android lacked the newer ISRG Root X1 and relied on the cross-signed DST Root CA X3, which expired — so path building on those devices hit an expired anchor"
    answer: 3
    explanation: |
      Let's Encrypt's DST Root CA X3 cross-sign expired in Sept 2021. Modern devices trusted
      ISRG Root X1 directly, but old Android lacked X1 and depended on the expired cross-sign,
      so it failed despite a valid leaf — a path-building/anchor-expiry problem.
    ref: "concepts.md#chain-building-and-famous-root-expiry-outages"

  - id: tls-ssl-https-088
    difficulty: advanced
    tags: [debugging, openssl, sslkeylogfile]
    question: |
      A page works in curl but a browser rejects it with a certificate error. Which cause is
      most consistent with that specific asymmetry?
    options:
      - "The server's private key leaked, and browsers detect the compromised key through a revocation feed that curl does not consult"
      - "The certificate lacks sufficient SCTs — browsers enforce Certificate Transparency while curl does not"
      - "The client clock is wrong, and the browser enforces certificate validity dates far more strictly than curl does on the same host"
      - "TLS 1.3 is disabled on the server, and modern browsers reject the older negotiated version while curl silently accepts the downgrade"
    answer: 1
    explanation: |
      Browsers enforce CT (requiring embedded/served SCTs) and stricter policies; curl does
      not. A CT-insufficient cert therefore fails in the browser but works in curl. Other
      strong candidates: missing intermediate the browser doesn't cache, or a private CA.
    ref: "concepts.md#debugging-tls-on-the-wire"

  - id: tls-ssl-https-089
    difficulty: advanced
    tags: [debugging, wireshark, ecdhe]
    question: |
      To decrypt a captured TLS 1.3 (ECDHE) session in Wireshark for debugging, what do you
      use, and why not just the server's private key?
    options:
      - "Point the client at SSLKEYLOGFILE to log per-session secrets and load that in Wireshark; the server private key alone can't decrypt ECDHE sessions"
      - "Extract the negotiated session key directly from the server's certificate and import it into Wireshark's TLS decryption settings"
      - "Use the server's RSA private key in Wireshark, which can derive and decrypt all ECDHE session traffic once loaded into the key list"
      - "Replay the captured handshake in Wireshark to recompute the traffic keys purely from the ClientHello and ServerHello random values"
    answer: 0
    explanation: |
      Under ECDHE the private key never derives the session key, so it can't decrypt captures.
      SSLKEYLOGFILE records the negotiated secrets from the client, and Wireshark uses that
      file to decrypt the session — the standard TLS 1.3 debugging method.
    ref: "concepts.md#debugging-tls-on-the-wire"

  - id: tls-ssl-https-090
    difficulty: advanced
    tags: [san, wildcard, matching]
    question: |
      A certificate's SAN contains dNSName *.example.com. Which host does it correctly match?
    options:
      - "example.com (the bare apex, which a leading wildcard also covers automatically)"
      - "a.b.example.com (two labels below, matched because a wildcard spans any depth)"
      - "api.example.com (exactly one left-most label)"
      - "any host, since the wildcard is unrestricted"
    answer: 2
    explanation: |
      A wildcard matches exactly one left-most label: *.example.com matches api.example.com
      but NOT the bare apex example.com, NOT a.b.example.com, and never partial labels or *.*.
    ref: "concepts.md#certificate-san-name-constraints-and-eku-detail"

  - id: tls-ssl-https-091
    difficulty: expert
    tags: [name-constraints, eku, internal-ca]
    question: |
      You are designing an internal CA and want a delegated sub-CA that provably cannot issue
      certificates for arbitrary public domains. Which X.509 mechanism enforces this?
    options:
      - "Set basicConstraints CA:FALSE on the sub-CA so it may only sign leaf certs inside the corporate domain tree"
      - "Put a Name Constraints extension on the sub-CA restricting its permitted namespaces (e.g. only *.corp.example.com)"
      - "Add the TLS_FALLBACK_SCSV marker to certs the sub-CA issues, rejecting any hostname outside the corporate domain"
      - "Pin the sub-CA's public key with HPKP so browsers reject any cert it mints outside the corporate domain"
    answer: 1
    explanation: |
      The nameConstraints extension on a CA certificate limits the DNS/IP namespaces it may
      issue within. A constrained sub-CA cannot mint valid certs outside its permitted tree —
      the standard way to safely delegate issuance internally. EKU further scopes usage.
    ref: "concepts.md#certificate-san-name-constraints-and-eku-detail"

  - id: tls-ssl-https-092
    difficulty: intermediate
    tags: [eku, mtls, client-auth]
    question: |
      In an mTLS setup, which Extended Key Usage (EKU) value should a client certificate
      carry?
    options:
      - "serverAuth"
      - "codeSigning"
      - "clientAuth"
      - "emailProtection"
    answer: 2
    explanation: |
      Client certificates used for mTLS carry the clientAuth EKU OID; server certificates
      carry serverAuth. Chains are validated for EKU consistency, so a serverAuth-only cert
      won't be accepted as a client credential.
    ref: "concepts.md#certificate-san-name-constraints-and-eku-detail"

  - id: tls-ssl-https-093
    difficulty: intermediate
    tags: [certificate-transparency, sct, delivery]
    question: |
      Which is NOT one of the three standard ways an SCT can be delivered to a browser?
    options:
      - "Embedded in the certificate as an X.509v3 extension"
      - "Via a TLS handshake extension (signed_certificate_timestamp)"
      - "Inside a stapled OCSP response"
      - "Published in a TXT record at the domain apex"
    answer: 3
    explanation: |
      The three RFC 6962 delivery methods are embedded X.509v3 extension (most common), a TLS
      extension, and OCSP stapling. There is no DNS TXT delivery method for SCTs.
    ref: "concepts.md#certificate-transparency-and-scts"

  - id: tls-ssl-https-094
    difficulty: expert
    tags: [finished, downgrade, transcript]
    question: |
      An active attacker edits the ClientHello to remove strong cipher suites, hoping to force
      a weak one. Ignoring the ServerHello.random sentinel, what other single mechanism causes
      this tampering to be detected?
    options:
      - "The Finished MAC is computed over the full transcript hash, so a modified ClientHello yields mismatched Finished values and the handshake aborts"
      - "The server echoes back the original ClientHello bytes so the client can diff them and spot any edited cipher-suite list"
      - "The stapled OCSP response includes a hash of the offered cipher suites, so a modified suite list fails the revocation check"
      - "The AEAD record sequence number silently resets to zero when a suite is dropped, and the peer treats that reset as tampering"
    answer: 0
    explanation: |
      Both Finished messages are HMACs over the transcript hash of every handshake message. If
      the attacker altered the ClientHello, the two sides' transcripts differ, their Finished
      values disagree, and the handshake fails — protecting the whole negotiation.
    ref: "concepts.md#tls-13-message-semantics-encryptedextensions-certificateverify-finished"
