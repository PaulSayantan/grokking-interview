topic: "HTTP/2, HTTP/3 & QUIC"
domain: networking
topic_slug: http2-http3-quic
version: 1
questions:
  - id: http2-http3-quic-001
    difficulty: beginner
    tags: [http-versions, semantics, framing]
    question: |
      What is the essential thing that stays the SAME across HTTP/1.1, HTTP/2, and HTTP/3?
    options:
      - "The wire format (byte layout on the network)"
      - "The transport protocol used underneath"
      - "The header compression algorithm"
      - "The HTTP semantics (methods, status codes, headers)"
    answer: 3
    explanation: |
      All three versions express identical HTTP semantics (defined in RFC 9110): the same
      methods, status codes, and header meanings. What changes is the wire format and the
      transport — text/TCP, binary/TCP, binary/QUIC-UDP.
    ref: "concepts.md#evolution-from-http11-to-http2-to-http3"

  - id: http2-http3-quic-002
    difficulty: beginner
    tags: [transport, udp, tcp]
    question: |
      Which transport protocol does HTTP/3 rely on?
    options:
      - "A brand-new IP protocol number"
      - "TCP directly"
      - "QUIC, which runs over UDP"
      - "SCTP"
    answer: 2
    explanation: |
      HTTP/3 runs over QUIC (RFC 9000), and QUIC runs on top of UDP. A brand-new IP protocol
      would be blocked by middleboxes that only pass TCP and UDP, so UDP was chosen.
    ref: "concepts.md#quic-transport-fundamentals"

  - id: http2-http3-quic-003
    difficulty: beginner
    tags: [http2, transport, common-trap]
    question: |
      An interviewer says "HTTP/2 uses UDP for speed." Is this correct?
    options:
      - "Yes, HTTP/2 introduced UDP transport"
      - "No — HTTP/2 runs over TCP; only HTTP/3 (via QUIC) uses UDP"
      - "Yes, but only for server push"
      - "Only when 0-RTT is enabled"
    answer: 1
    explanation: |
      HTTP/2 runs over TCP. UDP enters the picture only with HTTP/3, which uses the QUIC
      transport on top of UDP. This is a very common interview trap.
    ref: "concepts.md#evolution-from-http11-to-http2-to-http3"

  - id: http2-http3-quic-004
    difficulty: intermediate
    tags: [http11, pipelining, hol]
    question: |
      Why did HTTP/1.1 pipelining fail to deliver true concurrency?
    options:
      - "Responses had to be returned in request order, so a slow response blocked the ones behind it"
      - "It required TLS 1.3, which wasn't available"
      - "It used UDP, which dropped packets"
      - "Browsers limited it to one request per connection"
    answer: 0
    explanation: |
      Pipelining lets a client send multiple requests without waiting, but the server must
      return responses in order. A slow first response head-of-line-blocks everything behind
      it, so pipelining was effectively never deployed and is deprecated.
    ref: "concepts.md#evolution-from-http11-to-http2-to-http3"

  - id: http2-http3-quic-005
    difficulty: intermediate
    tags: [http11, connections, browsers]
    question: |
      A browser typically opens how many parallel TCP connections per origin for HTTP/1.1,
      and what is the main downside of doing so?
    options:
      - "1 connection; it serializes all requests"
      - "Unlimited connections; there is no downside"
      - "About 100 connections; it exhausts ephemeral ports"
      - "About 6 connections; it wastes resources and each connection runs its own congestion control"
    answer: 3
    explanation: |
      Browsers cap around 6 connections per origin. Each connection duplicates TLS handshakes
      and runs congestion control independently (they can't share bandwidth estimates), which
      is wasteful compared to one multiplexed connection.
    ref: "concepts.md#evolution-from-http11-to-http2-to-http3"

  - id: http2-http3-quic-006
    difficulty: beginner
    tags: [http2, binary-framing]
    question: |
      How does HTTP/2 encode messages on the wire compared to HTTP/1.1?
    options:
      - "As human-readable text lines, same as HTTP/1.1"
      - "As XML documents"
      - "As length-prefixed binary frames tagged with a stream ID"
      - "As gzip-compressed text blobs"
    answer: 2
    explanation: |
      HTTP/2 introduces a binary framing layer. Everything is split into frames with a 9-byte
      header carrying length, type, flags, and a 31-bit stream ID, enabling interleaving of
      multiple streams on one connection.
    ref: "concepts.md#http2-binary-framing-layer"

  - id: http2-http3-quic-007
    difficulty: intermediate
    tags: [http2, frames, frame-types]
    question: |
      Which HTTP/2 frame carries the credit used for flow control?
    options:
      - "SETTINGS"
      - "PING"
      - "RST_STREAM"
      - "WINDOW_UPDATE"
    answer: 3
    explanation: |
      WINDOW_UPDATE frames grant additional flow-control credit as the receiver consumes data.
      SETTINGS configures the connection, RST_STREAM cancels a stream, and PING measures
      liveness/RTT.
    ref: "concepts.md#http2-binary-framing-layer"

  - id: http2-http3-quic-008
    difficulty: intermediate
    tags: [http2, frames, goaway, rst-stream]
    question: |
      What is the difference between GOAWAY and RST_STREAM in HTTP/2?
    options:
      - "GOAWAY gracefully shuts down the whole connection; RST_STREAM aborts a single stream"
      - "GOAWAY aborts a single stream; RST_STREAM shuts down the connection"
      - "Both terminate the entire connection immediately"
      - "Both only apply to server push streams"
    answer: 0
    explanation: |
      GOAWAY tells the peer to stop opening new streams and begins graceful connection
      shutdown. RST_STREAM abruptly terminates one stream while the connection stays alive —
      a big improvement over HTTP/1.1 where cancelling meant closing the TCP connection.
    ref: "concepts.md#http2-binary-framing-layer"

  - id: http2-http3-quic-009
    difficulty: beginner
    tags: [http2, streams, multiplexing]
    question: |
      What does multiplexing in HTTP/2 allow?
    options:
      - "Compressing the response body more aggressively"
      - "Automatically retrying failed requests"
      - "Encrypting each request with a different key"
      - "Many concurrent requests/responses interleaved over a single TCP connection"
    answer: 3
    explanation: |
      Multiplexing interleaves frames from many independent streams over one connection, so
      requests and responses proceed concurrently without opening multiple TCP connections.
    ref: "concepts.md#http2-streams-and-multiplexing"

  - id: http2-http3-quic-010
    difficulty: intermediate
    tags: [http2, streams, stream-ids]
    question: |
      In HTTP/2, which stream IDs does a client use, and which does a server use for push?
    options:
      - "Clients use even IDs; servers use odd IDs"
      - "Both use random IDs"
      - "Clients use odd IDs; servers use even IDs for pushed streams"
      - "All streams use ID 0"
    answer: 2
    explanation: |
      Client-initiated streams use odd IDs (1, 3, 5, …); server-initiated (push) streams use
      even IDs. Stream 0 is reserved for connection-level control frames. IDs only increase and
      are never reused.
    ref: "concepts.md#http2-streams-and-multiplexing"

  - id: http2-http3-quic-011
    difficulty: intermediate
    tags: [http2, settings, concurrency]
    question: |
      Which SETTINGS parameter bounds how many streams can be open at once on an HTTP/2
      connection?
    options:
      - "SETTINGS_INITIAL_WINDOW_SIZE"
      - "SETTINGS_MAX_FRAME_SIZE"
      - "SETTINGS_HEADER_TABLE_SIZE"
      - "SETTINGS_MAX_CONCURRENT_STREAMS"
    answer: 3
    explanation: |
      SETTINGS_MAX_CONCURRENT_STREAMS caps concurrently open streams (commonly 100+).
      INITIAL_WINDOW_SIZE controls flow control, MAX_FRAME_SIZE the frame payload limit, and
      HEADER_TABLE_SIZE the HPACK dynamic table size.
    ref: "concepts.md#http2-streams-and-multiplexing"

  - id: http2-http3-quic-012
    difficulty: advanced
    tags: [http2, security, rapid-reset, dos]
    question: |
      The HTTP/2 Rapid Reset attack (CVE-2023-44487) works by:
      opening a stream and immediately sending RST_STREAM, repeatedly. Why is this effective
      as a denial-of-service technique?
    options:
      - "Each open+reset pair is cheap for the attacker but makes the server do request setup work, bypassing the concurrent-stream limit"
      - "RST_STREAM forces the server to close the TCP connection each time"
      - "It corrupts the HPACK dynamic table"
      - "It forces a TLS renegotiation on every stream"
    answer: 0
    explanation: |
      By resetting immediately, the attacker frees the stream slot instantly (bypassing
      SETTINGS_MAX_CONCURRENT_STREAMS) yet still triggers server-side request processing setup.
      The asymmetry lets a client generate huge server load. Mitigation: count/limit resets.
    ref: "concepts.md#http2-streams-and-multiplexing"

  - id: http2-http3-quic-013
    difficulty: beginner
    tags: [hpack, compression]
    question: |
      What problem does HPACK solve in HTTP/2?
    options:
      - "Encrypting the request body"
      - "Negotiating the protocol version"
      - "Reordering out-of-order TCP segments"
      - "Compressing the highly repetitive HTTP headers sent on every request"
    answer: 3
    explanation: |
      HTTP headers (cookies, user-agent, accept) are verbose and repetitive. HPACK (RFC 7541)
      compresses them using a static table, a per-connection dynamic table, and Huffman coding.
    ref: "concepts.md#hpack-header-compression"

  - id: http2-http3-quic-014
    difficulty: intermediate
    tags: [hpack, static-table, dynamic-table]
    question: |
      Which THREE mechanisms make up HPACK?
    options:
      - "gzip, deflate, and brotli"
      - "TLS, ALPN, and Alt-Svc"
      - "A static table, a per-connection dynamic table, and Huffman coding"
      - "Round-robin, least-connections, and IP-hash"
    answer: 2
    explanation: |
      HPACK combines a fixed static table of 61 common header entries, a dynamic table both
      peers update in lockstep, and Huffman coding for literal string values.
    ref: "concepts.md#hpack-header-compression"

  - id: http2-http3-quic-015
    difficulty: advanced
    tags: [hpack, security, crime]
    question: |
      Why was a purpose-built header compressor (HPACK) created instead of just gzip-ing
      HTTP/2 headers?
    options:
      - "gzip was patented and could not be used"
      - "gzip cannot compress text"
      - "HPACK produces larger output but is faster"
      - "Generic stream compression like gzip is vulnerable to CRIME-style attacks that leak secret header values (e.g. cookies)"
    answer: 3
    explanation: |
      CRIME exploited gzip's back-references: mixing attacker-controlled plaintext with a secret
      (like a session cookie) leaks the secret via compressed-size changes. HPACK is designed
      not to cross security boundaries and lets senders mark fields "never indexed."
    ref: "concepts.md#hpack-header-compression"

  - id: http2-http3-quic-016
    difficulty: intermediate
    tags: [http2, pseudo-headers]
    question: |
      In HTTP/2, what replaces the HTTP/1.1 request line (e.g. "GET /path HTTP/1.1")?
    options:
      - "Pseudo-headers such as :method, :scheme, :authority, and :path"
      - "A single DATA frame"
      - "The SETTINGS frame"
      - "An ALPN identifier"
    answer: 0
    explanation: |
      HTTP/2 uses pseudo-headers (:method, :scheme, :authority, :path, and :status for
      responses) that must appear before regular headers. They encode what the request/status
      lines carried in HTTP/1.1.
    ref: "concepts.md#hpack-header-compression"

  - id: http2-http3-quic-017
    difficulty: intermediate
    tags: [http2, flow-control]
    question: |
      HTTP/2 flow control is applied at which levels?
    options:
      - "Only per-stream"
      - "Only per-connection"
      - "Per-packet, like TCP"
      - "Both per-stream and whole-connection"
    answer: 3
    explanation: |
      HTTP/2 uses credit-based flow control at two levels: each stream has its own window and
      there is a connection-wide window. A stream's sending is bounded by both.
    ref: "concepts.md#http2-flow-control"

  - id: http2-http3-quic-018
    difficulty: intermediate
    tags: [http2, flow-control, frames]
    question: |
      In HTTP/2 flow control, which frames count against the flow-control window?
    options:
      - "HEADERS frames"
      - "SETTINGS frames"
      - "DATA frames"
      - "PING frames"
    answer: 2
    explanation: |
      Only DATA frames consume the flow-control window. HEADERS and control frames do not count.
      As the receiver consumes data it issues WINDOW_UPDATE to replenish credit.
    ref: "concepts.md#http2-flow-control"

  - id: http2-http3-quic-019
    difficulty: advanced
    tags: [http2, flow-control, throughput, bdp]
    question: |
      On a high bandwidth-delay-product link, an HTTP/2 download is capped well below the link
      speed. The initial flow-control window is left at the default 65,535 bytes. What is the
      most likely explanation?
    options:
      - "The connection is using UDP, which is slower"
      - "HPACK is compressing the body too aggressively"
      - "Server push is consuming all the bandwidth"
      - "Throughput is limited to window/RTT; a small window on a high-RTT link caps throughput, so the window must be increased"
    answer: 3
    explanation: |
      A credit-based window caps throughput at roughly window/RTT. On a high-BDP path the default
      64 KB window is far too small, so throughput stalls. Raising SETTINGS_INITIAL_WINDOW_SIZE
      (and connection window) fixes it.
    ref: "concepts.md#http2-flow-control"

  - id: http2-http3-quic-020
    difficulty: intermediate
    tags: [http2, prioritization, rfc9218]
    question: |
      What happened to HTTP/2's original dependency-tree stream prioritization?
    options:
      - "It was deprecated (kept for wire compatibility) and replaced by the simpler Extensible Prioritization Scheme, RFC 9218"
      - "It became mandatory in RFC 9113"
      - "It was moved into HPACK"
      - "It was renamed server push"
    answer: 0
    explanation: |
      The dependency-tree model was complex and buggy in practice. RFC 9113 deprecated it, and
      RFC 9218 defines a simpler scheme using an urgency level (0–7) and an incremental flag,
      usable by both HTTP/2 and HTTP/3.
    ref: "concepts.md#http2-stream-prioritization"

  - id: http2-http3-quic-021
    difficulty: intermediate
    tags: [prioritization, rfc9218]
    question: |
      The modern Extensible Prioritization Scheme (RFC 9218) expresses priority using:
    options:
      - "A dependency tree with parent stream and weight"
      - "The order of ALPN identifiers"
      - "The TCP window size"
      - "An urgency level (0–7) plus an incremental flag"
    answer: 3
    explanation: |
      RFC 9218 replaces the tree with two simple parameters: urgency (0–7, lower is more urgent)
      and an incremental boolean indicating whether the resource can be processed as it arrives.
      It works across HTTP/2 and HTTP/3.
    ref: "concepts.md#http2-stream-prioritization"

  - id: http2-http3-quic-022
    difficulty: intermediate
    tags: [http2, server-push, deprecated]
    question: |
      What is the current status of HTTP/2 server push?
    options:
      - "It is the recommended way to deliver critical CSS"
      - "It is mandatory in RFC 9113"
      - "It is effectively deprecated; Chrome removed support and preload/103 Early Hints are preferred"
      - "It was renamed to QPACK"
    answer: 2
    explanation: |
      Server push often wasted bandwidth (pushing already-cached resources) and was hard to
      coordinate. Chrome removed it in 2022, and RFC 9113 treats it as effectively deprecated.
      Use `preload` hints and `103 Early Hints` (RFC 8297) instead.
    ref: "concepts.md#http2-server-push-deprecated"

  - id: http2-http3-quic-023
    difficulty: intermediate
    tags: [http2, server-push, push-promise]
    question: |
      Which HTTP/2 frame did a server use to announce a resource it was about to push?
    options:
      - "WINDOW_UPDATE"
      - "PRIORITY"
      - "GOAWAY"
      - "PUSH_PROMISE"
    answer: 3
    explanation: |
      A server sent PUSH_PROMISE to reserve an even-numbered stream and announce the pushed
      resource before delivering it. Push is now deprecated in practice.
    ref: "concepts.md#http2-server-push-deprecated"

  - id: http2-http3-quic-024
    difficulty: intermediate
    tags: [server-push, early-hints, preload]
    question: |
      Instead of HTTP/2 server push, what is the recommended modern approach to hint at
      critical sub-resources early?
    options:
      - "Use `preload` resource hints and 103 Early Hints (RFC 8297)"
      - "Open more TCP connections"
      - "Disable HPACK"
      - "Switch back to HTTP/1.1 pipelining"
    answer: 0
    explanation: |
      `<link rel=preload>` and 103 Early Hints let the server tell the client what to fetch
      without blindly pushing bytes that may already be cached, which is why they superseded
      server push.
    ref: "concepts.md#http2-server-push-deprecated"

  - id: http2-http3-quic-025
    difficulty: advanced
    tags: [http2, hol-blocking, tcp]
    question: |
      A client fetches three resources as three multiplexed HTTP/2 streams. A single TCP
      segment carrying stream B's data is lost. What happens to streams A and C?
    options:
      - "Only stream B stalls; A and C are delivered immediately"
      - "The whole connection resets"
      - "A and C are automatically retransmitted on new connections"
      - "All three stall until the lost segment is retransmitted, because TCP delivers a single in-order byte stream"
    answer: 3
    explanation: |
      TCP guarantees in-order delivery of one byte stream. A lost segment forces TCP to hold
      back all later bytes — including other streams' data — until retransmission. This is
      TCP-level head-of-line blocking, HTTP/2's key remaining weakness.
    ref: "concepts.md#tcp-head-of-line-blocking-in-http2"

  - id: http2-http3-quic-026
    difficulty: advanced
    tags: [http2, http11, packet-loss, comparison]
    question: |
      Under significant packet loss, why can a single HTTP/2 connection sometimes perform
      WORSE than HTTP/1.1 with 6 parallel connections?
    options:
      - "HTTP/2 has no compression"
      - "HTTP/1.1 uses UDP under loss"
      - "With one connection, a single loss stalls all multiplexed streams; with 6 connections a loss only stalls ~1/6 of traffic"
      - "HTTP/2 disables retransmission"
    answer: 2
    explanation: |
      TCP HOL blocking means one lost segment stalls everything on HTTP/2's single connection.
      HTTP/1.1's 6 connections isolate loss to one connection (~1/6 of traffic), so on very
      lossy paths the parallel-connection approach can win.
    ref: "concepts.md#tcp-head-of-line-blocking-in-http2"

  - id: http2-http3-quic-027
    difficulty: beginner
    tags: [http2, hol-blocking]
    question: |
      HTTP/2 solved head-of-line blocking at which layer, while leaving it at which layer?
    options:
      - "Solved it at the TCP layer, left it at the application layer"
      - "Solved it at the application layer, left it at the TCP layer"
      - "Solved it at both layers"
      - "Solved it at neither layer"
    answer: 1
    explanation: |
      Independent streams remove application-layer HOL blocking, but because all streams ride on
      one TCP connection, transport-layer HOL blocking remains. Fixing that required a new
      transport (QUIC/HTTP-3).
    ref: "concepts.md#tcp-head-of-line-blocking-in-http2"

  - id: http2-http3-quic-028
    difficulty: intermediate
    tags: [quic, transport, user-space]
    question: |
      Which statement about QUIC (RFC 9000) is correct?
    options:
      - "It is a general-purpose, encrypted transport running in user space over UDP, with HTTP/3 as its first major user"
      - "It is an HTTP-specific protocol that only HTTP/3 can use"
      - "It runs directly on IP as a new protocol number"
      - "It is an extension of TCP implemented in the kernel"
    answer: 0
    explanation: |
      QUIC is a general-purpose reliable, encrypted transport implemented in user space over
      UDP. It is not HTTP-specific; HTTP/3 is simply its first widely deployed application.
    ref: "concepts.md#quic-transport-fundamentals"

  - id: http2-http3-quic-029
    difficulty: intermediate
    tags: [quic, udp, middleboxes, rationale]
    question: |
      Why does QUIC run over UDP rather than as a brand-new transport protocol directly on IP?
    options:
      - "UDP guarantees ordered delivery, which QUIC needs"
      - "IP does not support new protocol numbers"
      - "UDP is encrypted by default"
      - "Middleboxes (NATs, firewalls) generally only pass TCP and UDP, so a new IP protocol would be blocked; UDP also lets QUIC live in user space and evolve"
    answer: 3
    explanation: |
      Deploying a new IP-level transport is infeasible because middleboxes drop unknown
      protocols. UDP is universally passed, and running in user space lets QUIC evolve without
      OS/kernel upgrades.
    ref: "concepts.md#quic-transport-fundamentals"

  - id: http2-http3-quic-030
    difficulty: advanced
    tags: [quic, packet-numbers, retransmission]
    question: |
      QUIC packet numbers never repeat and always increase, even for retransmitted data.
      What problem does this design solve compared with TCP?
    options:
      - "It reduces header size to zero"
      - "It eliminates the need for congestion control"
      - "It removes TCP's retransmission ambiguity (not knowing whether an ACK covers the original or the retransmitted segment)"
      - "It allows plaintext transport"
    answer: 2
    explanation: |
      TCP reuses sequence numbers on retransmission, creating ambiguity about which
      transmission an ACK acknowledges. QUIC's monotonically increasing packet numbers make
      acknowledgements unambiguous, improving loss detection and RTT estimation.
    ref: "concepts.md#quic-transport-fundamentals"

  - id: http2-http3-quic-031
    difficulty: advanced
    tags: [quic, encryption, ossification]
    question: |
      QUIC encrypts almost the entire packet, including most header fields. What is the primary
      motivation for this?
    options:
      - "To reduce CPU usage"
      - "Ossification resistance — preventing middleboxes from inspecting and depending on internals, which would freeze protocol evolution"
      - "To make packets smaller"
      - "To avoid needing TLS"
    answer: 1
    explanation: |
      Encrypting headers stops middleboxes from reading and depending on protocol internals the
      way they ossified TCP. The trade-off is reduced passive visibility for network operators.
    ref: "concepts.md#quic-transport-fundamentals"

  - id: http2-http3-quic-032
    difficulty: intermediate
    tags: [http3, quic, hol-blocking]
    question: |
      Why does HTTP/3 over QUIC eliminate the transport head-of-line blocking that HTTP/2 has?
    options:
      - "QUIC streams are independently ordered and reliable, so a lost packet only stalls the stream(s) whose data it carried"
      - "QUIC compresses packets so none are lost"
      - "QUIC disables retransmission entirely"
      - "HTTP/3 uses one stream per connection"
    answer: 0
    explanation: |
      QUIC provides independent per-stream ordering and reliability. A packet loss only blocks
      the affected stream(s); other streams' already-arrived data is delivered immediately —
      unlike TCP's single in-order byte stream.
    ref: "concepts.md#http3-over-quic-and-hol-blocking-elimination"

  - id: http2-http3-quic-033
    difficulty: advanced
    tags: [http3, hol-blocking, within-stream]
    question: |
      Does HTTP/3 eliminate head-of-line blocking entirely?
    options:
      - "Yes, all forms of HOL blocking are gone"
      - "Yes, because QUIC delivers data out of order to the application"
      - "No — it actually makes HOL blocking worse than HTTP/2"
      - "No — it removes cross-stream (transport) HOL blocking, but bytes within a single stream must still arrive in order"
    answer: 3
    explanation: |
      HTTP/3 stops one stream's loss from blocking OTHER streams. But a single response is still
      an ordered byte stream, so a loss within that stream still delays that stream's remaining
      bytes.
    ref: "concepts.md#http3-over-quic-and-hol-blocking-elimination"

  - id: http2-http3-quic-034
    difficulty: intermediate
    tags: [http3, framing, streams]
    question: |
      In HTTP/3, why don't the HTTP frames themselves carry stream IDs (as HTTP/2 frames do)?
    options:
      - "Because HTTP/3 has no streams"
      - "Because HTTP/3 uses only one stream"
      - "Because the QUIC transport layer provides and manages stream multiplexing beneath HTTP/3"
      - "Because stream IDs moved into the TLS handshake"
    answer: 2
    explanation: |
      QUIC itself provides the streams and their identifiers. HTTP/3 maps each request/response
      to a QUIC stream, so the HTTP/3 framing layer doesn't need to re-encode stream IDs the way
      HTTP/2 (which runs on a single TCP byte stream) does.
    ref: "concepts.md#http3-over-quic-and-hol-blocking-elimination"

  - id: http2-http3-quic-035
    difficulty: intermediate
    tags: [quic, tls, handshake]
    question: |
      How does QUIC incorporate TLS?
    options:
      - "It layers TLS on top of QUIC exactly like HTTPS-over-TCP"
      - "It uses TLS 1.2 only"
      - "It makes TLS optional for internal traffic"
      - "It integrates TLS 1.3 directly; the handshake travels in QUIC CRYPTO frames and encryption is mandatory"
    answer: 3
    explanation: |
      QUIC integrates TLS 1.3 (RFC 8446 / RFC 9001) into the transport. TLS handshake messages
      travel in QUIC CRYPTO frames and the derived keys protect QUIC packets. There is no
      unencrypted QUIC.
    ref: "concepts.md#quic-handshake-and-integrated-tls-13"

  - id: http2-http3-quic-036
    difficulty: intermediate
    tags: [quic, handshake, rtt]
    question: |
      A fresh HTTP/3 connection reaches application data in how many round trips, versus a
      fresh HTTP/2-over-(TCP + TLS 1.3) connection?
    options:
      - "HTTP/3: 1 RTT; HTTP/2 over TCP+TLS 1.3: about 2 RTT"
      - "HTTP/3: 3 RTT; HTTP/2: 1 RTT"
      - "Both take exactly 2 RTT"
      - "HTTP/3: 2 RTT; HTTP/2: 0 RTT"
    answer: 0
    explanation: |
      TCP needs a round trip for its handshake before TLS 1.3 adds another — about 2 RTT total.
      QUIC combines transport and crypto into a single 1-RTT handshake (and 0-RTT on resumption).
    ref: "concepts.md#quic-handshake-and-integrated-tls-13"

  - id: http2-http3-quic-037
    difficulty: advanced
    tags: [quic, handshake, rtt, reasoning]
    question: |
      What specifically lets QUIC save a round trip compared with TCP+TLS?
    options:
      - "It skips encryption on the first flight"
      - "It disables congestion control during setup"
      - "It uses smaller packets"
      - "It combines the transport handshake and the crypto handshake, instead of requiring TCP's three-way handshake to finish before TLS can start"
    answer: 3
    explanation: |
      With TCP+TLS, the TCP three-way handshake must complete before TLS begins. QUIC folds the
      transport and TLS 1.3 handshakes together, so keys and connection state are established in
      one round trip.
    ref: "concepts.md#quic-handshake-and-integrated-tls-13"

  - id: http2-http3-quic-038
    difficulty: intermediate
    tags: [0-rtt, resumption, performance]
    question: |
      What does 0-RTT connection establishment let a client do?
    options:
      - "Connect without any encryption"
      - "Avoid DNS resolution"
      - "Send application data (e.g. a GET) in its very first flight, using keys derived from a cached pre-shared secret from a prior connection"
      - "Skip ALPN negotiation permanently"
    answer: 2
    explanation: |
      With a cached PSK/session ticket from a previous connection, the client can encrypt and
      send a request in the first flight, achieving 0-RTT to first byte on resumption.
    ref: "concepts.md#0-rtt-connection-establishment"

  - id: http2-http3-quic-039
    difficulty: advanced
    tags: [0-rtt, replay, idempotency, security]
    question: |
      A team wants to send a POST that charges a customer's card using 0-RTT to shave latency.
      Why is this a bad idea?
    options:
      - "0-RTT early data can be captured and replayed by an attacker, so only idempotent/safe requests should use it"
      - "0-RTT data cannot be encrypted"
      - "POST is not allowed over HTTP/3"
      - "0-RTT disables TLS entirely"
    answer: 0
    explanation: |
      The 0-RTT first flight is not protected against replay: an attacker can re-send it,
      re-triggering the operation. Non-idempotent actions (charging a card) must not run from
      0-RTT data; restrict 0-RTT to safe/idempotent requests like GET.
    ref: "concepts.md#0-rtt-connection-establishment"

  - id: http2-http3-quic-040
    difficulty: intermediate
    tags: [0-rtt, trade-offs, common-trap]
    question: |
      Which statement best captures the trade-off of 0-RTT?
    options:
      - "It trades a round trip for a replay-attack surface, so it must be limited to idempotent requests"
      - "It is free performance with no downside"
      - "It only works over TCP"
      - "It requires disabling TLS 1.3"
    answer: 0
    explanation: |
      0-RTT is a performance win but introduces replayability of the first flight. The correct
      interview answer notes this trade-off and restricts 0-RTT to idempotent requests.
    ref: "concepts.md#0-rtt-connection-establishment"

  - id: http2-http3-quic-041
    difficulty: intermediate
    tags: [quic, connection-migration, connection-id]
    question: |
      A user on a phone moves from Wi-Fi to cellular, changing their IP address. Why does a
      QUIC connection survive this while a TCP connection breaks?
    options:
      - "QUIC re-runs the full handshake instantly"
      - "TCP also survives; the premise is wrong"
      - "QUIC uses a fixed IP address"
      - "QUIC identifies a connection by a Connection ID rather than the IP/port 4-tuple, so the connection continues after the address changes"
    answer: 3
    explanation: |
      TCP connections are keyed on the 4-tuple (src/dst IP and port); any change breaks them.
      QUIC uses opaque Connection IDs decoupled from the address, so it migrates to the new path
      (connection migration) without a new handshake, preserving streams and congestion state.
    ref: "concepts.md#connection-migration-and-connection-ids"

  - id: http2-http3-quic-042
    difficulty: advanced
    tags: [quic, path-validation, security]
    question: |
      Before shifting significant traffic to a client's new network path during migration, what
      does a QUIC endpoint do?
    options:
      - "Nothing; it trusts the new address immediately"
      - "Reset the connection and force a new handshake"
      - "Validate the new path using PATH_CHALLENGE / PATH_RESPONSE frames to defend against address spoofing"
      - "Downgrade to HTTP/2"
    answer: 2
    explanation: |
      QUIC performs path validation with PATH_CHALLENGE/PATH_RESPONSE before committing to a new
      path, preventing an attacker from redirecting traffic by spoofing a source address.
    ref: "concepts.md#connection-migration-and-connection-ids"

  - id: http2-http3-quic-043
    difficulty: advanced
    tags: [quic, connection-id, privacy]
    question: |
      Endpoints issue multiple Connection IDs (via NEW_CONNECTION_ID) and rotate them as the
      path changes. Besides enabling migration, what privacy benefit does rotation provide?
    options:
      - "It prevents on-path observers from linking a user's activity across different networks"
      - "It compresses headers further"
      - "It disables logging"
      - "It reduces packet numbers"
    answer: 0
    explanation: |
      Rotating the Connection ID when the path changes stops passive observers from correlating
      (linking) the same connection across networks, protecting user privacy during migration.
    ref: "concepts.md#connection-migration-and-connection-ids"

  - id: http2-http3-quic-044
    difficulty: intermediate
    tags: [qpack, http3, compression]
    question: |
      Why can't HTTP/3 simply reuse HPACK for header compression?
    options:
      - "HPACK's dynamic table requires header blocks to be processed in the exact order sent, which QUIC's independent, possibly out-of-order streams cannot guarantee"
      - "HPACK is patented"
      - "HPACK does not support Huffman coding"
      - "HPACK only works with UDP"
    answer: 0
    explanation: |
      HPACK assumes strict ordering of header-block updates (TCP guarantees it). Over QUIC's
      independent streams, out-of-order arrival would reintroduce HOL blocking. QPACK (RFC 9204)
      redesigns this.
    ref: "concepts.md#qpack-header-compression"

  - id: http2-http3-quic-045
    difficulty: advanced
    tags: [qpack, streams, hol-blocking]
    question: |
      How does QPACK avoid reintroducing head-of-line blocking in HTTP/3?
    options:
      - "It disables the dynamic table entirely"
      - "It requires TCP underneath"
      - "It sends all headers uncompressed"
      - "It moves dynamic-table updates onto dedicated unidirectional streams and lets the encoder bound how many streams may block (trading compression ratio vs. blocking risk)"
    answer: 3
    explanation: |
      QPACK uses separate encoder/decoder streams for table maintenance and lets the encoder
      choose whether to reference entries that might not have arrived. Via
      SETTINGS_QPACK_BLOCKED_STREAMS it bounds blocking, preserving QUIC's HOL-free property.
    ref: "concepts.md#qpack-header-compression"

  - id: http2-http3-quic-046
    difficulty: intermediate
    tags: [alpn, tls, negotiation]
    question: |
      What is ALPN (RFC 7301) and where does it happen?
    options:
      - "A DNS record listing supported protocols"
      - "An HTTP header sent after the connection is established"
      - "A TLS extension where the client lists protocol IDs (e.g. h2, http/1.1) in the ClientHello and the server picks one — negotiated inside the TLS handshake with no extra round trip"
      - "A UDP port-scanning technique"
    answer: 2
    explanation: |
      Application-Layer Protocol Negotiation is a TLS extension. The client advertises protocol
      identifiers in the ClientHello; the server selects one in the ServerHello, all within the
      existing TLS handshake, so no extra round trip is needed.
    ref: "concepts.md#alpn-negotiation-and-protocol-discovery"

  - id: http2-http3-quic-047
    difficulty: intermediate
    tags: [alpn, identifiers]
    question: |
      Which ALPN identifier corresponds to HTTP/3 over QUIC?
    options:
      - "h3"
      - "h2"
      - "http/1.1"
      - "h2c"
    answer: 0
    explanation: |
      The identifiers are: http/1.1, h2 (HTTP/2 over TLS), h2c (HTTP/2 cleartext), and h3
      (HTTP/3 over QUIC). QUIC's handshake negotiates h3 via ALPN.
    ref: "concepts.md#alpn-negotiation-and-protocol-discovery"

  - id: http2-http3-quic-048
    difficulty: advanced
    tags: [http3, alt-svc, discovery]
    question: |
      A browser first connects to a site over HTTP/2 and later switches to HTTP/3. Which
      mechanism most likely told it that HTTP/3 was available?
    options:
      - "An Alt-Svc response header (RFC 7838), e.g. `Alt-Svc: h3=\":443\"; ma=86400`, which the client cached"
      - "The TCP window size"
      - "A PUSH_PROMISE frame"
      - "A RST_STREAM frame"
    answer: 0
    explanation: |
      The Alt-Svc header advertises alternative endpoints/protocols. `h3=":443"` tells the client
      it can reach the origin via HTTP/3 on UDP 443; the client caches this and upgrades on later
      connections. An HTTPS DNS record (RFC 9460) can advertise it even earlier.
    ref: "concepts.md#alpn-negotiation-and-protocol-discovery"

  - id: http2-http3-quic-049
    difficulty: intermediate
    tags: [http3, dns, https-record, discovery]
    question: |
      What advantage does advertising HTTP/3 support via an HTTPS DNS resource record (RFC 9460)
      have over the Alt-Svc header?
    options:
      - "It compresses headers better"
      - "It removes the need for ALPN"
      - "It encrypts the connection twice"
      - "The client can attempt HTTP/3 on the very first connection, avoiding an initial TCP round trip just to learn about HTTP/3"
    answer: 3
    explanation: |
      Alt-Svc is learned only after a first (non-HTTP/3) connection. An HTTPS DNS record delivers
      the h3 hint during DNS resolution, so the client can go straight to QUIC on the first
      connection.
    ref: "concepts.md#alpn-negotiation-and-protocol-discovery"

  - id: http2-http3-quic-050
    difficulty: intermediate
    tags: [http2, tls, browsers]
    question: |
      Do browsers support cleartext HTTP/2 (h2c)?
    options:
      - "Yes, it is the default for browsers"
      - "Only for localhost over UDP"
      - "No — browsers require TLS for HTTP/2 (ALPN h2); h2c is used mostly for server-to-server"
      - "Only when server push is enabled"
    answer: 2
    explanation: |
      Although the spec permits cleartext h2c (negotiated via an HTTP/1.1 Upgrade header), every
      major browser requires TLS for HTTP/2. h2c is seen mainly in server-to-server contexts.
    ref: "concepts.md#alpn-negotiation-and-protocol-discovery"

  - id: http2-http3-quic-051
    difficulty: advanced
    tags: [comparison, hol-blocking, versions]
    question: |
      Consider application-layer HOL blocking (pipelined responses in order). Which version(s)
      SUFFER from it?
    options:
      - "HTTP/2 only"
      - "HTTP/1.1 only"
      - "HTTP/3 only"
      - "Both HTTP/2 and HTTP/3"
    answer: 1
    explanation: |
      Application-layer HOL blocking is the pipelining problem where responses must return in
      order. HTTP/2 and HTTP/3 both use independent streams and don't have it; HTTP/1.1 pipelining
      does.
    ref: "concepts.md#head-of-line-blocking-comparison-across-versions"

  - id: http2-http3-quic-052
    difficulty: advanced
    tags: [comparison, packet-loss, when-to-use]
    question: |
      On a clean, low-latency wired network with no packet loss, how do HTTP/2 and HTTP/3 compare
      in throughput/latency for typical page loads?
    options:
      - "They perform similarly; HTTP/3's main advantages (per-stream loss recovery) only materialize under loss/high RTT"
      - "HTTP/3 is always dramatically faster"
      - "HTTP/2 is always faster because TCP is faster than UDP"
      - "HTTP/3 cannot be used on wired networks"
    answer: 0
    explanation: |
      HTTP/3's edge comes from eliminating TCP HOL blocking under loss and from faster handshakes
      on high-RTT links. On clean, low-latency paths there's little loss to recover from, so the
      two are close.
    ref: "concepts.md#head-of-line-blocking-comparison-across-versions"

  - id: http2-http3-quic-053
    difficulty: intermediate
    tags: [when-to-use, http3, mobile]
    question: |
      For which client population does HTTP/3 tend to help the MOST?
    options:
      - "Internal datacenter traffic on clean, low-latency links"
      - "Only clients using HTTP/1.1 pipelining"
      - "Clients that never use TLS"
      - "Mobile/global users on lossy, high-latency networks that also switch networks"
    answer: 3
    explanation: |
      HTTP/3's per-stream loss recovery, faster handshake, and connection migration shine on
      lossy, high-RTT, mobile networks. On clean internal links, HTTP/2 (or even keep-alive
      HTTP/1.1) is fine and cheaper on CPU.
    ref: "concepts.md#when-each-version-helps-trade-offs-and-gotchas"

  - id: http2-http3-quic-054
    difficulty: advanced
    tags: [http3, costs, cpu, deployment]
    question: |
      Which of the following is a genuine COST or gotcha of deploying HTTP/3 / QUIC?
    options:
      - "It cannot be encrypted"
      - "It only works with HTTP/1.1 clients"
      - "Higher CPU usage (user-space, per-packet encryption), possible UDP throttling/blocking requiring a TCP fallback, and reduced middlebox visibility"
      - "It removes the need for congestion control"
    answer: 2
    explanation: |
      QUIC historically costs more CPU (user space, per-packet crypto). Some networks throttle or
      block UDP, so a TCP/HTTP-2 fallback is required, and encrypted headers reduce passive
      observability for operators.
    ref: "concepts.md#when-each-version-helps-trade-offs-and-gotchas"

  - id: http2-http3-quic-055
    difficulty: intermediate
    tags: [http3, fallback, deployment]
    question: |
      Why must HTTP/3 deployments keep an HTTP/2-over-TCP fallback?
    options:
      - "Because some networks throttle or block UDP/443, so the client may be unable to reach the server over QUIC"
      - "Because HTTP/3 does not support GET requests"
      - "Because HTTP/3 has no encryption"
      - "Because ALPN does not work with QUIC"
    answer: 0
    explanation: |
      A client can't know in advance whether UDP/443 is open. If QUIC is blocked or fails, the
      client must fall back to HTTP/2 over TCP — often implemented as a race ("happy eyeballs").
    ref: "concepts.md#when-each-version-helps-trade-offs-and-gotchas"

  - id: http2-http3-quic-056
    difficulty: beginner
    tags: [rfc, versions]
    question: |
      Which RFC currently defines HTTP/2 (obsoleting the original RFC 7540)?
    options:
      - "RFC 9113"
      - "RFC 9000"
      - "RFC 9114"
      - "RFC 7541"
    answer: 0
    explanation: |
      RFC 9113 (2022) is the current HTTP/2 specification, obsoleting RFC 7540. RFC 9114 is
      HTTP/3, RFC 9000 is QUIC, and RFC 7541 is HPACK.
    ref: "concepts.md#evolution-from-http11-to-http2-to-http3"

  - id: http2-http3-quic-057
    difficulty: intermediate
    tags: [rfc, quic, qpack]
    question: |
      Match the specification to its purpose: which RFC defines QPACK header compression for
      HTTP/3?
    options:
      - "RFC 7541"
      - "RFC 8446"
      - "RFC 9000"
      - "RFC 9204"
    answer: 3
    explanation: |
      RFC 9204 defines QPACK for HTTP/3. RFC 7541 is HPACK (HTTP/2), RFC 9000 is the QUIC
      transport, and RFC 8446 is TLS 1.3.
    ref: "concepts.md#qpack-header-compression"

  - id: http2-http3-quic-058
    difficulty: beginner
    tags: [http3, encryption]
    question: |
      Is unencrypted HTTP/3 possible?
    options:
      - "Yes, encryption is optional like HTTP/2's h2c"
      - "Yes, for localhost only"
      - "No — encryption is mandatory because QUIC integrates TLS 1.3 into the transport"
      - "Only when connection migration is disabled"
    answer: 2
    explanation: |
      QUIC builds TLS 1.3 into the transport, so there is no cleartext QUIC/HTTP-3. Encryption is
      mandatory, unlike HTTP/2 where the spec technically allowed cleartext h2c.
    ref: "concepts.md#quic-handshake-and-integrated-tls-13"

  - id: http2-http3-quic-059
    difficulty: advanced
    tags: [scenario, capture, comparison]
    question: |
      A packet capture shows: a single UDP/443 flow, TLS 1.3 handshake messages inside CRYPTO
      frames, multiple independent streams, and the connection surviving a client IP change.
      Which protocol is this?
    options:
      - "HTTP/1.1 over TCP"
      - "HTTP/3 over QUIC"
      - "HTTP/2 over TCP"
      - "WebSocket over TCP"
    answer: 1
    explanation: |
      UDP/443, TLS 1.3 in CRYPTO frames, independent streams, and survival of an IP change
      (connection migration via Connection IDs) are all hallmarks of HTTP/3 over QUIC.
    ref: "concepts.md#quic-transport-fundamentals"

  - id: http2-http3-quic-060
    difficulty: advanced
    tags: [scenario, hpack, dynamic-table]
    question: |
      An HTTP/2 client sends the same large Authorization header on 100 requests over one
      connection. Thanks to HPACK's dynamic table, what happens after the first request?
    options:
      - "The header value is inserted into the dynamic table once, then referenced by a small index on subsequent requests"
      - "The header is re-sent in full text every time"
      - "The header is dropped to save bandwidth"
      - "The connection resets to clear the table"
    answer: 0
    explanation: |
      HPACK's dynamic table inserts a repeated custom header once; subsequent requests reference
      it by index instead of re-sending the full value, dramatically shrinking header overhead on
      repetitive requests.
    ref: "concepts.md#hpack-header-compression"

  - id: http2-http3-quic-061
    difficulty: expert
    tags: [http2, continuation, dos, scenario]
    question: |
      Your HTTP/2 edge server's memory climbs until the process is OOM-killed, yet the access
      logs show almost no completed requests during the incident. A capture shows many streams
      with a HEADERS frame followed by a long run of CONTINUATION frames. What is happening?
    options:
      - "A CONTINUATION Flood: the attacker never sets END_HEADERS, so the server keeps buffering/decoding an ever-growing header block that never completes (hence no log line)"
      - "A Rapid Reset attack, identifiable by the RST_STREAM churn"
      - "HPACK dynamic-table corruption from out-of-order frames"
      - "Normal behavior — large cookies simply need many CONTINUATION frames"
    answer: 0
    explanation: |
      The CONTINUATION Flood (VU#421644, CVE-2023-45288 et al.) sends HEADERS + endless
      CONTINUATION frames without ever setting END_HEADERS. The header block never completes, so
      the request never logs, while the server buffers or Huffman-decodes discarded fragments —
      OOM or CPU exhaustion. Rapid Reset instead shows visible open+RST_STREAM churn.
    ref: "concepts.md#http2-dos-attacks-rapid-reset-and-continuation-flood"

  - id: http2-http3-quic-062
    difficulty: expert
    tags: [http2, rapid-reset, concurrency, dos]
    question: |
      Why does Rapid Reset (CVE-2023-44487) bypass SETTINGS_MAX_CONCURRENT_STREAMS, and why is
      simply lowering that setting a poor mitigation?
    options:
      - "It exploits an HPACK integer overflow; lowering the setting has no effect on HPACK"
      - "Only open/half-closed streams count toward the limit, so an immediate RST_STREAM frees the slot instantly and lets the client churn unbounded requests; lowering the limit makes conformant clients (assuming ~100) overshoot and get 499/502 errors"
      - "RST_STREAM increments the limit each time; lowering it just delays the overflow"
      - "The setting only applies to server-pushed streams, so it never constrained the attack"
    answer: 1
    explanation: |
      Reset streams leave the open/half-closed states immediately, freeing the concurrency slot,
      so the attacker never trips the limit while still forcing per-request setup (and often
      backend dispatch before the proxy sees the reset). Dropping the limit backfires because
      legitimate clients that assume 100 concurrent streams will exceed it and see errors. Correct
      fix: count/rate-limit resets and jail abusive peers.
    ref: "concepts.md#http2-dos-attacks-rapid-reset-and-continuation-flood"

  - id: http2-http3-quic-063
    difficulty: advanced
    tags: [http2, continuation, end-headers, end-stream]
    question: |
      In HTTP/2, what is the difference between the END_HEADERS and END_STREAM flags?
    options:
      - "END_HEADERS ends the entire connection; END_STREAM ends one frame"
      - "They are synonyms for the same wire bit"
      - "END_HEADERS marks the last fragment of a header block (HEADERS + CONTINUATION*); END_STREAM half-closes the stream, signalling the end of the message"
      - "END_HEADERS applies only to PUSH_PROMISE; END_STREAM only to SETTINGS"
    answer: 2
    explanation: |
      A header block is a HEADERS/PUSH_PROMISE frame plus zero or more CONTINUATION frames,
      terminated when END_HEADERS is set. END_STREAM (on HEADERS or DATA) is independent: it
      marks the end of the message body and half-closes the stream. A stream can carry a header
      block that sets END_HEADERS without END_STREAM (more DATA follows).
    ref: "concepts.md#http2-header-block-framing-and-continuation"

  - id: http2-http3-quic-064
    difficulty: advanced
    tags: [http2, continuation, contiguity, hol]
    question: |
      Why must an HTTP/2 header block (HEADERS + any CONTINUATION frames) be sent contiguously,
      with no other stream's frames interleaved in the middle?
    options:
      - "Because TCP cannot reorder frames"
      - "Because HPACK mutates a single shared dynamic table that must be updated in one uninterrupted sequence; interleaving would corrupt the shared compression state"
      - "Because the 9-byte frame header has no stream ID for CONTINUATION"
      - "Because CONTINUATION frames carry their own TLS record"
    answer: 1
    explanation: |
      HPACK's dynamic table is shared connection state updated in strict order. A header block must
      complete before any other frame so both peers apply table mutations identically. This
      contiguity is itself a subtle HOL cost: while a large header block streams out, no other
      stream's frames can be sent.
    ref: "concepts.md#http2-header-block-framing-and-continuation"

  - id: http2-http3-quic-065
    difficulty: expert
    tags: [prioritization, rfc9218, priority-header]
    question: |
      Using RFC 9218, how would you signal that a stylesheet is more urgent than an image, and
      what is the default urgency if you send nothing?
    options:
      - "Set the stylesheet's TCP window higher; default urgency is 0"
      - "Send `Priority: u=0` on the CSS and a higher `u` (e.g. u=5) on images; default urgency is 3"
      - "Build a dependency tree with the CSS as parent of the image; there is no default"
      - "Send `Priority: i=1` on the CSS; default urgency is 7"
    answer: 1
    explanation: |
      The Priority structured-field header uses u= (0–7, lower is more urgent, default 3) and the
      Boolean i (incremental, default false). CSS at u=0 outranks images at a higher u. The
      RFC 7540 dependency tree is deprecated; SETTINGS_NO_RFC7540_PRIORITIES (0x9) can announce you
      don't use it.
    ref: "concepts.md#modern-prioritization-the-priority-header-and-priority_update"

  - id: http2-http3-quic-066
    difficulty: expert
    tags: [prioritization, rfc9218, priority-update]
    question: |
      What distinguishes the PRIORITY_UPDATE frame from the Priority header in RFC 9218?
    options:
      - "PRIORITY_UPDATE is end-to-end; the Priority header is hop-by-hop"
      - "The Priority header is end-to-end (survives intermediaries); PRIORITY_UPDATE is a hop-by-hop frame that reprioritizes an already-sent request"
      - "They are identical; PRIORITY_UPDATE is just the HTTP/3 name for the header"
      - "PRIORITY_UPDATE can only lower urgency, the header can only raise it"
    answer: 1
    explanation: |
      The Priority header is carried end-to-end with the message. PRIORITY_UPDATE (HTTP/2 type
      0x10; HTTP/3 0xF0700 request / 0xF0701 push) is a hop-by-hop frame letting a client change
      an in-flight request's priority after it was sent.
    ref: "concepts.md#modern-prioritization-the-priority-header-and-priority_update"

  - id: http2-http3-quic-067
    difficulty: advanced
    tags: [hpack, dynamic-table, sizing]
    question: |
      Per RFC 7541, how is the "size" of an HPACK dynamic-table entry calculated for eviction
      accounting?
    options:
      - "Just the value length in bytes"
      - "Name length + value length, with no overhead"
      - "Name length + value length + 32 bytes of overhead"
      - "A fixed 64 bytes regardless of contents"
    answer: 2
    explanation: |
      RFC 7541 §4.1 defines entry size as the octet length of the name plus the value plus 32
      bytes of estimated overhead. The table is a FIFO bounded by SETTINGS_HEADER_TABLE_SIZE;
      inserts evict the oldest entries until it fits.
    ref: "concepts.md#hpack-dynamic-table-internals"

  - id: http2-http3-quic-068
    difficulty: expert
    tags: [qpack, insert-count, blocking]
    question: |
      In QPACK, a field section's prefix encodes a Required Insert Count larger than the number of
      dynamic-table insertions the decoder has currently received. What happens?
    options:
      - "The stream is 'blocked' until the referenced insertions arrive; SETTINGS_QPACK_BLOCKED_STREAMS (default 0) bounds how many such streams are allowed"
      - "The decoder immediately fails the connection with QPACK_DECOMPRESSION_FAILED"
      - "The header is silently dropped and decoding continues"
      - "The decoder falls back to HPACK for that section"
    answer: 0
    explanation: |
      Required Insert Count is the minimum number of insertions needed to decode the section. If it
      exceeds what the decoder has seen, the stream blocks awaiting those encoder-stream inserts.
      SETTINGS_QPACK_BLOCKED_STREAMS (default 0) caps how many streams may be blocked; exceeding
      the encoder's promised limit is what triggers QPACK_DECOMPRESSION_FAILED.
    ref: "concepts.md#qpack-internals-encoderdecoder-streams-and-insert-counts"

  - id: http2-http3-quic-069
    difficulty: expert
    tags: [qpack, encoder-stream, decoder-stream]
    question: |
      Which of these is a DECODER-stream instruction in QPACK (feedback from decoder to encoder),
      rather than an encoder-stream instruction?
    options:
      - "Insert with Name Reference"
      - "Set Dynamic Table Capacity"
      - "Duplicate"
      - "Section Acknowledgment"
    answer: 3
    explanation: |
      Decoder-stream instructions are Section Acknowledgment, Stream Cancellation, and Insert Count
      Increment. Insert with Name Reference, Insert with Literal Name, Duplicate, and Set Dynamic
      Table Capacity are encoder-stream instructions that mutate the dynamic table.
    ref: "concepts.md#qpack-internals-encoderdecoder-streams-and-insert-counts"

  - id: http2-http3-quic-070
    difficulty: expert
    tags: [quic, packet-header, middlebox]
    question: |
      An on-path middlebox inspects a steady-state (post-handshake) QUIC packet. Which fields can
      it actually read?
    options:
      - "The full source and destination Connection IDs plus the packet number"
      - "Essentially only the Destination Connection ID, a few fixed bits, and the UDP framing — the packet number is masked by header protection and the payload is AEAD-encrypted"
      - "Nothing at all; even the UDP header is encrypted"
      - "The TLS SNI, which QUIC always sends in the clear"
    answer: 1
    explanation: |
      1-RTT short-header packets carry only the Destination CID (no source CID, no version). Header
      protection (RFC 9001 §5.4) masks the packet-number bytes and some header bits, and AEAD
      encrypts the payload. So a middlebox sees little beyond the DCID and UDP framing. (Long-header
      Initial packets expose more, e.g. both CIDs and version, during setup.)
    ref: "concepts.md#quic-packet-headers-and-packet-types"

  - id: http2-http3-quic-071
    difficulty: advanced
    tags: [quic, packet-types, long-header]
    question: |
      Which set correctly lists QUIC's long-header packet types used during connection setup?
    options:
      - "SYN, SYN-ACK, ACK, FIN"
      - "Initial, 0-RTT, Handshake, Retry"
      - "Control, Push, Encoder, Decoder"
      - "DATA, HEADERS, SETTINGS, GOAWAY"
    answer: 1
    explanation: |
      QUIC long-header packets (carrying both source and destination CIDs plus a version) are
      Initial, 0-RTT, Handshake, and Retry. After the handshake, traffic uses short-header (1-RTT)
      packets carrying only the destination CID.
    ref: "concepts.md#quic-packet-headers-and-packet-types"

  - id: http2-http3-quic-072
    difficulty: expert
    tags: [quic, packet-number-spaces, crypto]
    question: |
      QUIC maintains three independent packet-number spaces (Initial, Handshake, Application).
      What is a direct consequence of this design?
    options:
      - "All packets share one monotonic counter, so an ACK can cover any of the three"
      - "CRYPTO offsets are global across the whole connection"
      - "Each space has its own numbering and keys, CRYPTO offsets restart at 0 per space, and an ACK frame only acknowledges packets within its own space"
      - "0-RTT and 1-RTT must share the same keys to keep numbering consistent"
    answer: 2
    explanation: |
      Independent spaces mean handshake and application data are numbered, keyed, and acknowledged
      separately; CRYPTO frame offsets restart per space; and an ACK is scoped to its space. This
      cleanly separates 0-RTT/1-RTT/handshake key epochs.
    ref: "concepts.md#quic-packet-number-spaces"

  - id: http2-http3-quic-073
    difficulty: expert
    tags: [quic, anti-amplification, retry, security]
    question: |
      Before validating a client's address, a QUIC server receives a 1200-byte Initial packet from
      a possibly-spoofed source. How much may it send back, and what mechanism forces stronger
      validation?
    options:
      - "Unlimited data, since TLS protects it; no extra validation is needed"
      - "At most 3× the bytes received (≈3600 bytes) until the path is validated; a Retry packet can force the client to echo a token proving return-routability"
      - "At most 1× the bytes received; a PATH_CHALLENGE forces validation"
      - "At most 10× the bytes received; SYN cookies force validation"
    answer: 1
    explanation: |
      RFC 9000 §8.1 caps the server at 3× the bytes received from an unvalidated address,
      preventing large reflected amplification. A Retry packet makes the client echo a token in a
      new Initial, proving it truly receives at that address before the server commits state — the
      QUIC analogue of TCP SYN cookies.
    ref: "concepts.md#quic-address-validation-retry-and-anti-amplification"

  - id: http2-http3-quic-074
    difficulty: advanced
    tags: [quic, ack, loss-detection, rfc9002]
    question: |
      Which statement about QUIC acknowledgements and loss recovery (RFC 9002) is correct?
    options:
      - "QUIC ACK frames carry selective ACK Ranges by default plus an ACK Delay field, and loss is inferred by packet-number-gap and time thresholds with a PTO replacing TCP's RTO"
      - "QUIC uses cumulative ACKs only, exactly like base TCP without SACK"
      - "QUIC disables congestion control because packet numbers never repeat"
      - "QUIC requires the receiver to ACK every packet immediately with no delay reporting"
    answer: 0
    explanation: |
      QUIC ACK frames report selective ACK Ranges (SACK-like, but the default) and an ACK Delay so
      the sender can correct RTT samples. Loss is detected via a packet-number-gap threshold
      (default 3) and a time threshold; the Probe Timeout (PTO) handles tail loss. CC is pluggable
      (NewReno default; CUBIC/BBR common), and ECN is validated via ACK-frame counts.
    ref: "concepts.md#quic-ack-frames-loss-detection-and-congestion-control"

  - id: http2-http3-quic-075
    difficulty: expert
    tags: [quic, stateless-reset, connection-close]
    question: |
      A QUIC server reboots and loses all connection state. A client keeps sending 1-RTT packets on
      the old connection. How does the server cleanly signal that the connection is dead?
    options:
      - "It sends a CONNECTION_CLOSE frame, which it can still generate without keys"
      - "It sends a TCP RST"
      - "It emits a Stateless Reset using a stateless-reset token the client received earlier in a NEW_CONNECTION_ID frame, which the client recognizes as an unusable connection"
      - "It replies with GOAWAY on the control stream"
    answer: 2
    explanation: |
      After losing state the server can't decrypt packets or produce a valid CONNECTION_CLOSE. The
      Stateless Reset mechanism lets it send a packet ending in a stateless-reset token previously
      delivered via NEW_CONNECTION_ID; the client recognizes the token and tears the connection
      down instead of hanging.
    ref: "concepts.md#quic-connection-close-and-stateless-reset"

  - id: http2-http3-quic-076
    difficulty: advanced
    tags: [quic, connection-close, error-codes]
    question: |
      QUIC's CONNECTION_CLOSE frame comes in two forms distinguished by frame type. What do 0x1c
      and 0x1d indicate?
    options:
      - "0x1c is a graceful close; 0x1d is an abrupt reset"
      - "0x1c signals a QUIC transport-level error; 0x1d signals an application (e.g. HTTP/3) error"
      - "0x1c closes a single stream; 0x1d closes the whole connection"
      - "0x1c is client-initiated; 0x1d is server-initiated"
    answer: 1
    explanation: |
      CONNECTION_CLOSE type 0x1c carries a QUIC transport error code; type 0x1d carries an
      application-layer error code (such as an HTTP/3 error). Both end the entire connection, unlike
      HTTP/3 GOAWAY which is a graceful shutdown signal at the application layer.
    ref: "concepts.md#quic-connection-close-and-stateless-reset"

  - id: http2-http3-quic-077
    difficulty: expert
    tags: [quic, stream-id, encoding]
    question: |
      A QUIC endpoint sees an incoming stream with ID whose low two bits are 0b10 (0x2). What kind
      of stream is it?
    options:
      - "Client-initiated bidirectional"
      - "Server-initiated bidirectional"
      - "Client-initiated unidirectional"
      - "Server-initiated unidirectional"
    answer: 2
    explanation: |
      QUIC stream IDs encode role in the low two bits: bit 0 = initiator (0 client, 1 server),
      bit 1 = directionality (0 bidi, 1 uni). 0b10 = bit0 0 (client) + bit1 1 (unidirectional) =
      client-initiated unidirectional (0x02). HTTP/3 uses these for control/QPACK streams.
    ref: "concepts.md#quic-and-http3-stream-types-and-ids"

  - id: http2-http3-quic-078
    difficulty: expert
    tags: [http3, unidirectional-streams, stream-types]
    question: |
      On an HTTP/3 unidirectional stream, the first byte is the stream type. Which mapping is
      correct?
    options:
      - "control 0x00, push 0x01, QPACK encoder 0x02, QPACK decoder 0x03"
      - "control 0x01, push 0x00, QPACK encoder 0x03, QPACK decoder 0x02"
      - "control 0x04, push 0x05, QPACK encoder 0x06, QPACK decoder 0x07"
      - "control 0x02, push 0x03, QPACK encoder 0x00, QPACK decoder 0x01"
    answer: 0
    explanation: |
      HTTP/3 unidirectional stream types are: control 0x00, push 0x01, QPACK encoder 0x02, QPACK
      decoder 0x03. Each peer must allow at least 3 unidirectional streams (control + two QPACK
      streams). Closing a control or QPACK stream is fatal: H3_CLOSED_CRITICAL_STREAM.
    ref: "concepts.md#quic-and-http3-stream-types-and-ids"

  - id: http2-http3-quic-079
    difficulty: advanced
    tags: [http3, control-stream, errors]
    question: |
      An HTTP/3 endpoint opens its control stream but the first frame it sends is a HEADERS frame
      rather than SETTINGS. What error does the peer raise?
    options:
      - "H3_FRAME_UNEXPECTED"
      - "H3_MISSING_SETTINGS"
      - "QPACK_DECOMPRESSION_FAILED"
      - "H3_ID_ERROR"
    answer: 1
    explanation: |
      The first frame on an HTTP/3 control stream MUST be SETTINGS; if it is missing, the peer
      raises H3_MISSING_SETTINGS. (HEADERS on the control stream would independently be an
      H3_FRAME_UNEXPECTED, but the specific 'no SETTINGS first' violation is H3_MISSING_SETTINGS.)
    ref: "concepts.md#quic-and-http3-stream-types-and-ids"

  - id: http2-http3-quic-080
    difficulty: expert
    tags: [http3, frame-codes, flow-control]
    question: |
      Which statement about HTTP/3 framing is correct?
    options:
      - "HTTP/3 has its own WINDOW_UPDATE and RST_STREAM frames just like HTTP/2"
      - "HTTP/3 frame codes include DATA 0x00, HEADERS 0x01, SETTINGS 0x04, GOAWAY 0x06; flow control and stream reset are handled by QUIC (MAX_STREAM_DATA, RESET_STREAM/STOP_SENDING), not HTTP/3 frames"
      - "HTTP/3 frames carry a stream ID field like HTTP/2 frames"
      - "HTTP/3 GOAWAY may only carry increasing IDs across successive frames"
    answer: 1
    explanation: |
      HTTP/3 reuses frame concepts with codes DATA 0x00, HEADERS 0x01, CANCEL_PUSH 0x03,
      SETTINGS 0x04, PUSH_PROMISE 0x05, GOAWAY 0x06, MAX_PUSH_ID 0x07. There is no HTTP-layer
      WINDOW_UPDATE/RST_STREAM — QUIC provides flow control and RESET_STREAM/STOP_SENDING. GOAWAY
      IDs must be non-increasing across successive GOAWAYs.
    ref: "concepts.md#http3-frame-types-and-error-codes"

  - id: http2-http3-quic-081
    difficulty: advanced
    tags: [http3, excessive-load, dos]
    question: |
      Under an HTTP/3 request flood analogous to Rapid Reset, which HTTP/3 error code does a server
      use to shed abusive load while shutting a connection down?
    options:
      - "H3_MESSAGE_ERROR"
      - "H3_ID_ERROR"
      - "H3_EXCESSIVE_LOAD"
      - "H3_FRAME_UNEXPECTED"
    answer: 2
    explanation: |
      H3_EXCESSIVE_LOAD is the code an HTTP/3 endpoint uses (e.g. in a GOAWAY/CONNECTION_CLOSE) to
      signal it is closing a connection because the peer is generating too much load — the HTTP/3
      analogue of the Rapid Reset mitigation.
    ref: "concepts.md#http3-frame-types-and-error-codes"

  - id: http2-http3-quic-082
    difficulty: expert
    tags: [grease, ossification, extensibility]
    question: |
      Why do HTTP/2 and HTTP/3 implementations deliberately send reserved "GREASE" type/setting
      values that the peer must ignore?
    options:
      - "To pad packets to a fixed size for traffic analysis resistance"
      - "To exercise peers' tolerance of unknown values, catching intolerant middleboxes/parsers early so future extensions aren't blocked by ossification"
      - "To negotiate the compression algorithm"
      - "To reserve bandwidth for control frames"
    answer: 1
    explanation: |
      GREASE (RFC 8701 for TLS; analogous reserved code points in HTTP/2 and HTTP/3, e.g. HTTP/3's
      0x1f*N+0x21 pattern) is sent precisely so that any implementation that mishandles unknown
      values is caught immediately, keeping parsers tolerant and preventing the protocol from
      ossifying.
    ref: "concepts.md#grease-and-ossification-resistance"

  - id: http2-http3-quic-083
    difficulty: expert
    tags: [coalescing, sharding, 421, scenario]
    question: |
      After splitting static assets across img1/img2/img3.example.com to speed up an HTTP/1.1 site,
      you migrate to HTTP/2 and page loads get slower. Why, and what is the fix?
    options:
      - "HTTP/2 disables caching for subdomains; disable caching to fix it"
      - "Domain sharding forces multiple connections that defeat HTTP/2's multiplexing and connection coalescing; consolidate the assets onto one origin"
      - "HTTP/2 requires a separate TCP connection per file type; merge file types"
      - "The subdomains broke HPACK; disable header compression"
    answer: 1
    explanation: |
      Sharding was an HTTP/1.1 hack to get more parallel connections. Under HTTP/2 (and HTTP/3) one
      multiplexed connection is the goal, and coalescing can even serve multiple cert-covered
      origins on one connection. Sharding fragments that into extra connections/handshakes, hurting
      performance. Consolidate to a single origin.
    ref: "concepts.md#connection-coalescing-and-origin-reuse"

  - id: http2-http3-quic-084
    difficulty: advanced
    tags: [coalescing, 421, misdirected]
    question: |
      When does a server return 421 Misdirected Request in the context of HTTP/2/HTTP/3 connection
      coalescing?
    options:
      - "When the client sends malformed HPACK"
      - "When a request coalesced onto a shared connection targets an authority that this server cannot actually serve, telling the client to retry on a fresh connection"
      - "When the TLS certificate has expired"
      - "When the flow-control window is exhausted"
    answer: 1
    explanation: |
      Coalescing reuses one connection for multiple origins when the cert covers them and IPs match.
      If a request lands on a server that isn't authoritative for that :authority, it returns 421
      Misdirected Request, signalling the client to open a separate connection for that origin.
    ref: "concepts.md#connection-coalescing-and-origin-reuse"

  - id: http2-http3-quic-085
    difficulty: advanced
    tags: [h2c, upgrade, cleartext]
    question: |
      In the HTTP/1.1 Upgrade mechanism for cleartext HTTP/2 (h2c), which headers and response does
      the client/server exchange?
    options:
      - "Client sends `Alt-Svc: h2c`; server replies 200 OK"
      - "Client sends `Connection: Upgrade`, `Upgrade: h2c`, and `HTTP2-Settings`; server replies 101 Switching Protocols"
      - "Client sends a QUIC Initial packet; server replies with Retry"
      - "Client sends ALPN h2c in the ClientHello; server picks it in ServerHello"
    answer: 1
    explanation: |
      The h2c upgrade sends Connection: Upgrade, Upgrade: h2c, and a base64url HTTP2-Settings header;
      the server switches with 101 Switching Protocols. (Alternatively, 'prior knowledge' starts the
      HTTP/2 preface directly.) Over TLS there's no Upgrade — ALPN chooses the version. Browsers do
      neither h2c path.
    ref: "concepts.md#h2c-upgrade-and-prior-knowledge"

  - id: http2-http3-quic-086
    difficulty: expert
    tags: [extended-connect, websocket, rfc8441]
    question: |
      How is WebSocket carried over HTTP/2, and what must be negotiated first?
    options:
      - "Via a standard CONNECT tunnel; no negotiation needed"
      - "Via Extended CONNECT using the :protocol pseudo-header (value websocket), enabled by SETTINGS_ENABLE_CONNECT_PROTOCOL (RFC 8441); RFC 9220 extends this to HTTP/3"
      - "WebSocket cannot run over HTTP/2; it requires HTTP/1.1 Upgrade only"
      - "Via a PUSH_PROMISE frame that opens the WebSocket stream"
    answer: 1
    explanation: |
      RFC 8441 defines Extended CONNECT: a stream becomes a tunnel for another protocol via the
      :protocol pseudo-header, gated by SETTINGS_ENABLE_CONNECT_PROTOCOL. That's how WebSocket runs
      over HTTP/2; RFC 9220 extends it to HTTP/3. (The old HTTP/1.1 Upgrade: websocket handshake
      doesn't map onto HTTP/2 streams, which is why Extended CONNECT was needed.)
    ref: "concepts.md#extended-connect-and-protocol-tunneling-websocket-masque"

  - id: http2-http3-quic-087
    difficulty: expert
    tags: [http2, flow-control, connection-window, bdp]
    question: |
      An HTTP/2 server raised SETTINGS_INITIAL_WINDOW_SIZE to 16 MB but aggregate download
      throughput across many concurrent streams is still capped. What is the most likely cause?
    options:
      - "The connection-level flow-control window was left at the 65,535 default and never grown, so it bounds the sum of all streams"
      - "HPACK is limiting the DATA frame size"
      - "SETTINGS_INITIAL_WINDOW_SIZE only affects HEADERS, not DATA"
      - "The server needs to enable server push to raise throughput"
    answer: 0
    explanation: |
      HTTP/2 has two windows. SETTINGS_INITIAL_WINDOW_SIZE governs per-stream windows only; the
      connection-level window is separate and is NOT auto-scaled. If it stays at 65,535, it caps the
      combined outstanding DATA of all streams. The server must actively grow the connection window
      via WINDOW_UPDATE on stream 0.
    ref: "concepts.md#http2-flow-control-edge-cases-and-quic-flow-control"

  - id: http2-http3-quic-088
    difficulty: expert
    tags: [quic, flow-control, max-streams]
    question: |
      What flow-control capability does QUIC provide that HTTP/2 lacks, and how did that gap relate
      to Rapid Reset?
    options:
      - "QUIC provides per-packet windows; HTTP/2 has per-byte windows"
      - "QUIC's MAX_STREAMS frame gives first-class stream-COUNT flow control, whereas HTTP/2 relies only on the SETTINGS_MAX_CONCURRENT_STREAMS setting — and because resets instantly freed slots, that setting failed to bound Rapid Reset"
      - "QUIC has no flow control, so it cannot be attacked this way"
      - "QUIC uses TCP's window scaling option; HTTP/2 does not"
    answer: 1
    explanation: |
      QUIC has MAX_DATA (connection) and MAX_STREAM_DATA (per-stream) byte credit, plus MAX_STREAMS
      which limits the number of streams the peer may open — genuine stream-count flow control.
      HTTP/2 has no such frame; it only advertises SETTINGS_MAX_CONCURRENT_STREAMS, which Rapid Reset
      sidestepped by closing streams immediately to free slots.
    ref: "concepts.md#http2-flow-control-edge-cases-and-quic-flow-control"

  - id: http2-http3-quic-089
    difficulty: expert
    tags: [quic, migration, congestion-control, scenario]
    question: |
      A mobile app's QUIC connection survives a Wi-Fi→cellular handoff, but you observe a brief
      throughput dip right after the switch. Why?
    options:
      - "The connection silently reconnected with a new handshake"
      - "On confirming the new path, the sender resets its congestion controller and RTT estimate to conservative values (the old path's capacity doesn't predict the new one, and it limits abuse), so it must re-probe bandwidth"
      - "QPACK tables are rebuilt from scratch on migration"
      - "TLS keys are renegotiated, pausing data flow"
    answer: 1
    explanation: |
      Connection migration preserves streams and CID, but the new path's capacity is unknown, so
      RFC 9000 requires resetting the congestion controller and RTT estimate on a new path (also an
      anti-abuse measure). Re-probing bandwidth causes the transient dip — no new handshake or key
      renegotiation occurs.
    ref: "concepts.md#connection-migration-deep-dive"

  - id: http2-http3-quic-090
    difficulty: advanced
    tags: [quic, migration, privacy, connection-id]
    question: |
      During connection migration, why must an endpoint switch to a fresh Connection ID rather than
      reusing the same one on the new path?
    options:
      - "Reusing a CID would cause a packet-number collision"
      - "The old CID's encryption keys expire on migration"
      - "Reusing the same CID across paths lets an on-path observer link (correlate) the user's activity across networks, defeating migration's privacy benefit"
      - "QUIC forbids more than one packet per Connection ID"
    answer: 2
    explanation: |
      Endpoints pre-issue multiple CIDs via NEW_CONNECTION_ID. On migration they use a fresh,
      previously-unused CID so a passive observer on either path can't correlate the pre- and
      post-migration flows as the same connection — preserving the privacy property of migration.
    ref: "concepts.md#connection-migration-deep-dive"

  - id: http2-http3-quic-091
    difficulty: expert
    tags: [0-rtt, new-token, session-ticket]
    question: |
      In QUIC, what is the difference between the NEW_TOKEN frame and a TLS session ticket?
    options:
      - "They are the same thing under two names"
      - "NEW_TOKEN provides an address-validation token to skip Retry on the next connection; the TLS session ticket provides the resumption secret that enables 0-RTT keys — different purposes"
      - "NEW_TOKEN enables 0-RTT; the session ticket only validates the address"
      - "NEW_TOKEN encrypts the payload; the session ticket compresses headers"
    answer: 1
    explanation: |
      The NEW_TOKEN frame gives the client a token to prove its address on a future connection
      (avoiding a Retry round trip). The TLS session ticket carries the PSK/resumption material that
      enables 0-RTT early-data keys. Conflating them is a common error; they solve address validation
      vs. resumption respectively.
    ref: "concepts.md#0-rtt-deep-dive-replay-defenses-and-keys"

  - id: http2-http3-quic-092
    difficulty: expert
    tags: [0-rtt, replay, anti-replay, scenario]
    question: |
      A non-idempotent POST occasionally executes twice on an HTTP/3 service. Investigation shows it
      was sent as 0-RTT early data. What is the root cause and the correct fix?
    options:
      - "QUIC lost the packet and retransmitted it with the same number; disable retransmission"
      - "0-RTT early data is replayable, so an attacker or retry re-sent it; restrict 0-RTT to safe/idempotent methods and/or enforce server-side anti-replay (single-use tickets or a strike register)"
      - "The 1-RTT keys leaked; rotate the certificate"
      - "HPACK duplicated the request; switch to QPACK"
    answer: 1
    explanation: |
      0-RTT early data is not replay-protected: an on-path attacker (or a client retry) can resend
      the captured first flight, re-triggering the operation. Non-idempotent requests must not use
      0-RTT. Fixes: limit 0-RTT to safe methods, and use TLS 1.3 anti-replay (single-use session
      tickets or a strike register), bounding early data with max_early_data_size.
    ref: "concepts.md#0-rtt-deep-dive-replay-defenses-and-keys"

  - id: http2-http3-quic-093
    difficulty: advanced
    tags: [0-rtt, rejection, fallback]
    question: |
      If a QUIC server rejects a client's 0-RTT early data (e.g. it lost the PSK or anti-replay
      fired), what happens to that data?
    options:
      - "It is silently discarded and the request is lost forever"
      - "The connection is torn down and the client must resolve DNS again"
      - "The client retransmits that data in 1-RTT after the handshake completes"
      - "The server downgrades the connection to HTTP/2"
    answer: 2
    explanation: |
      0-RTT rejection is a normal, safe path: the client simply resends the early data using 1-RTT
      keys once the handshake finishes. This is why 0-RTT is best-effort and the application must be
      resilient to it not being accepted.
    ref: "concepts.md#0-rtt-deep-dive-replay-defenses-and-keys"

  - id: http2-http3-quic-094
    difficulty: intermediate
    tags: [http3, discovery, alt-svc, dns, scenario]
    question: |
      You enabled HTTP/3 but a capture shows clients still use HTTP/2 for their very first request
      to your site, only switching to h3 afterward. Why?
    options:
      - "HTTP/3 requires two TCP handshakes before it can start"
      - "Alt-Svc advertises h3 only over an existing (non-h3) connection, so the first request can't be h3; only an HTTPS/SVCB DNS record (RFC 9460) lets a client try h3 on the very first connection"
      - "Browsers always send the first request over HTTP/2 by specification"
      - "QPACK must warm up its dynamic table over HTTP/2 first"
    answer: 1
    explanation: |
      With only the Alt-Svc header, the client must first connect over H2/H1 to learn h3 is
      available, then upgrade on subsequent connections. Publishing an HTTPS (SVCB) DNS record per
      RFC 9460 advertises h3 during resolution, enabling first-flight HTTP/3. (UDP/443 blocking would
      instead cause a fallback, not this pattern.)
    ref: "concepts.md#alpn-negotiation-and-protocol-discovery"

  - id: http2-http3-quic-095
    difficulty: expert
    tags: [http3, within-stream, hol, scenario]
    question: |
      A client downloads one large JSON response over HTTP/3 and it still stalls under packet loss,
      despite HTTP/3 "eliminating HOL blocking." Explain.
    options:
      - "HTTP/3 does not actually use QUIC for large responses"
      - "HTTP/3 removes only CROSS-stream HOL blocking; within a single stream bytes must still arrive in order, so a lost packet carrying an earlier byte offset stalls that stream's remaining bytes"
      - "The JSON should have been compressed with HPACK"
      - "QUIC retransmits the entire stream on any loss"
    answer: 1
    explanation: |
      QUIC gives each stream independent ordering, so one stream's loss doesn't block OTHER streams.
      But a single response is one ordered byte stream: losing the packet with an earlier offset
      forces later bytes of that same stream to wait for retransmission. HTTP/3 doesn't remove
      within-stream ordering.
    ref: "concepts.md#http3-over-quic-and-hol-blocking-elimination"
