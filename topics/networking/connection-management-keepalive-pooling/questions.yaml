topic: "Connection Management: Keep-Alive, Pooling & Multiplexing"
domain: networking
topic_slug: connection-management-keepalive-pooling
version: 1
questions:
  - id: connection-management-keepalive-pooling-001
    difficulty: beginner
    tags: [tcp, handshake, latency]
    question: |
      How many round trips does the TCP 3-way handshake add before a client can send
      request data?
    options:
      - "About 1 RTT"
      - "About 2 RTTs"
      - "About 3 RTTs"
      - "Zero — the client sends data in the SYN"
    answer: 0
    explanation: |
      The handshake is SYN, SYN-ACK, ACK. The client can piggyback/begin its request with
      the third packet, so the setup adds roughly one full round trip before the request
      goes out.
    ref: "concepts.md#tcp-connection-setup-cost-handshake-and-slow-start"

  - id: connection-management-keepalive-pooling-002
    difficulty: beginner
    tags: [slow-start, congestion-window]
    question: |
      Why does a brand-new TCP connection not immediately deliver a large response at full
      speed even after the handshake completes?
    options:
      - "Because TLS is still negotiating in the background"
      - "Because TCP starts in slow start with a small congestion window that grows over several RTTs"
      - "Because DNS must be re-resolved for each segment"
      - "Because the receive window is always 1 byte at first"
    answer: 1
    explanation: |
      TCP slow start (RFC 5681) begins with a small congestion window (modern stacks use an
      initial window of ~10 MSS, RFC 6928) and roughly doubles it each RTT. A large response
      thus takes several RTTs to ramp to full throughput on a cold connection.
    ref: "concepts.md#tcp-connection-setup-cost-handshake-and-slow-start"

  - id: connection-management-keepalive-pooling-003
    difficulty: intermediate
    tags: [initial-window, slow-start]
    question: |
      What is the modern default TCP initial congestion window recommended by RFC 6928?
    options:
      - "1 MSS"
      - "2 MSS"
      - "10 MSS (~14 KB)"
      - "4 MSS"
    answer: 2
    explanation: |
      RFC 6928 raised the initial window to 10 MSS (roughly 14 KB), letting a fresh
      connection send about 10 segments before waiting for an ACK, which speeds the early
      part of slow start.
    ref: "concepts.md#tcp-connection-setup-cost-handshake-and-slow-start"

  - id: connection-management-keepalive-pooling-004
    difficulty: intermediate
    tags: [tls, handshake, rtt]
    question: |
      Over a fresh connection, roughly how many round trips does a full TLS 1.3 handshake add
      on top of the TCP handshake?
    options:
      - "0 RTTs"
      - "2 RTTs"
      - "3 RTTs"
      - "1 RTT"
    answer: 3
    explanation: |
      A full TLS 1.3 handshake (RFC 8446) is 1-RTT, compared to TLS 1.2's 2-RTT handshake.
      So a cold HTTPS connection over TLS 1.3 is about 1 RTT (TCP) + 1 RTT (TLS) before data
      flows.
    ref: "concepts.md#tcp-connection-setup-cost-handshake-and-slow-start"

  - id: connection-management-keepalive-pooling-005
    difficulty: intermediate
    tags: [scenario, cold-connection, latency]
    question: |
      On a path with 100 ms RTT, a client opens a fresh HTTPS (TLS 1.3) connection for a
      single small request. Approximately how much latency is spent on connection setup
      before the request data is on its way?
    options:
      - "~200 ms (~1 RTT TCP + ~1 RTT TLS)"
      - "~50 ms (half a round trip)"
      - "~100 ms (TCP only; TLS is free)"
      - "~400 ms (2 RTT TCP + 2 RTT TLS)"
    answer: 0
    explanation: |
      TCP handshake ~1 RTT (100 ms) plus a full TLS 1.3 handshake ~1 RTT (100 ms) ≈ 200 ms of
      setup before useful data flows, on top of any slow-start ramp for the response.
    ref: "concepts.md#tcp-connection-setup-cost-handshake-and-slow-start"

  - id: connection-management-keepalive-pooling-006
    difficulty: intermediate
    tags: [warm-connection, reuse, throughput]
    question: |
      Besides skipping the handshakes, why is a reused ("warm") connection often faster for
      large transfers than a brand-new one?
    options:
      - "It uses a larger MSS than new connections"
      - "Its congestion window has already grown past slow start"
      - "It bypasses TCP checksums"
      - "It is exempt from the receiver's flow-control window"
    answer: 1
    explanation: |
      A warm connection has already ramped its congestion window during earlier transfers, so
      it can push a large response at higher throughput immediately instead of climbing out
      of slow start again.
    ref: "concepts.md#tcp-connection-setup-cost-handshake-and-slow-start"

  - id: connection-management-keepalive-pooling-007
    difficulty: beginner
    tags: [http-keepalive, persistent-connections, http11]
    question: |
      In HTTP/1.1, what is the default behavior for the TCP connection after a response is
      sent?
    options:
      - "The connection is closed after every response"
      - "The connection is upgraded to HTTP/2 automatically"
      - "The connection stays open (persistent) unless a party sends Connection: close"
      - "The connection is closed only for POST requests"
    answer: 2
    explanation: |
      HTTP/1.1 (RFC 9112) made persistent connections the default. Reuse is automatic; a peer
      must explicitly send Connection: close to signal it will close after the current
      response.
    ref: "concepts.md#http-persistent-connections-and-the-connection-header"

  - id: connection-management-keepalive-pooling-008
    difficulty: intermediate
    tags: [http10, connection-header]
    question: |
      In which HTTP version did the header `Connection: keep-alive` actually matter to enable
      reuse (because the default was to close)?
    options:
      - "HTTP/1.1"
      - "HTTP/2"
      - "HTTP/3"
      - "HTTP/1.0"
    answer: 3
    explanation: |
      HTTP/1.0 closed connections by default, so `Connection: keep-alive` was needed to opt
      into reuse. In HTTP/1.1 persistence is already the default, making the header largely a
      no-op.
    ref: "concepts.md#http-persistent-connections-and-the-connection-header"

  - id: connection-management-keepalive-pooling-009
    difficulty: intermediate
    tags: [connection-header, hop-by-hop, proxy]
    question: |
      Why must an intermediary (proxy) NOT blindly forward the `Connection` header to the next
      hop?
    options:
      - "Because it is a hop-by-hop header that applies only to the single connection between adjacent parties"
      - "Because it is end-to-end and only the origin may read it"
      - "Because forwarding it would corrupt Content-Length"
      - "Because it must be renamed to X-Connection first"
    answer: 0
    explanation: |
      `Connection` (and any header it names) is hop-by-hop: it governs only the single TCP hop
      between two adjacent parties. A proxy must strip it and the headers it lists rather than
      pass them on.
    ref: "concepts.md#http-persistent-connections-and-the-connection-header"

  - id: connection-management-keepalive-pooling-010
    difficulty: intermediate
    tags: [framing, content-length, chunked]
    question: |
      Reusing an HTTP/1.1 connection requires the receiver to know where each response body
      ends. Which mechanisms provide that framing?
    options:
      - "Only closing the connection"
      - "Content-Length or Transfer-Encoding: chunked"
      - "The Date header timestamp"
      - "A mandatory trailing empty line after every byte"
    answer: 1
    explanation: |
      Without a Content-Length or chunked transfer encoding, the only way to mark the end of a
      body is to close the connection — which defeats keep-alive. Proper framing is a
      prerequisite for reuse.
    ref: "concepts.md#http-persistent-connections-and-the-connection-header"

  - id: connection-management-keepalive-pooling-011
    difficulty: advanced
    tags: [http2, connection-header, forbidden]
    question: |
      What is the status of the `Connection` header in HTTP/2?
    options:
      - "Required on every request"
      - "Optional but recommended"
      - "Forbidden — connection management is handled by the protocol itself"
      - "Replaced by a Connection2 frame"
    answer: 2
    explanation: |
      HTTP/2 (RFC 9113) forbids connection-specific/hop-by-hop headers like `Connection`.
      Multiplexing and connection lifecycle are managed by the protocol's framing layer, so
      the header is not used.
    ref: "concepts.md#http-persistent-connections-and-the-connection-header"

  - id: connection-management-keepalive-pooling-012
    difficulty: beginner
    tags: [pooling, definition]
    question: |
      What is a client-side connection pool?
    options:
      - "A server-side queue of pending requests"
      - "A DNS cache for resolved hostnames"
      - "A buffer that stores response bodies for replay"
      - "A cache of open, reusable connections keyed by destination that clients borrow and return"
    answer: 3
    explanation: |
      A connection pool caches open connections (keyed by scheme/host/port and TLS config) so
      a client borrows a warm connection per request instead of opening a fresh socket each
      time.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-013
    difficulty: beginner
    tags: [pooling, per-host-limit, browser]
    question: |
      Approximately how many concurrent HTTP/1.1 connections do browsers typically allow per
      origin?
    options:
      - "About 6"
      - "About 2"
      - "About 32"
      - "Unlimited"
    answer: 0
    explanation: |
      Browsers cap around 6 concurrent HTTP/1.1 connections per origin. This bounds server
      load but also bounds parallelism, which was a major motivation for HTTP/2 multiplexing.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-014
    difficulty: intermediate
    tags: [pooling, little-law, sizing, scenario]
    question: |
      A service calls a downstream at 1000 requests/second with a mean response time of
      50 ms. Using Little's Law, roughly how many concurrent connections does it need as a
      floor?
    options:
      - "About 5"
      - "About 50"
      - "About 20"
      - "About 1000"
    answer: 1
    explanation: |
      Little's Law: L = λ × W = 1000 req/s × 0.05 s = 50 concurrent connections as the floor.
      You then add headroom for tail latency and bursts.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-015
    difficulty: intermediate
    tags: [pooling, sizing, latency]
    question: |
      What is the main symptom of a connection pool that is sized too SMALL for the load?
    options:
      - "Excessive idle sockets consuming memory"
      - "TLS certificates expire faster"
      - "Requests block waiting to borrow a connection, causing latency spikes"
      - "The server closes connections more aggressively"
    answer: 2
    explanation: |
      Too few connections means requests queue for an available connection, adding latency —
      especially under bursts. Too large a pool wastes memory/FDs and can exhaust server-side
      connection slots.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-016
    difficulty: intermediate
    tags: [pooling, keying, tls]
    question: |
      Connections in a pool are typically keyed by which attributes?
    options:
      - "Only the destination IP address"
      - "The HTTP method of the last request"
      - "The client's ephemeral source port"
      - "Scheme + host + port (and effectively TLS config for HTTPS)"
    answer: 3
    explanation: |
      A pooled connection is reusable only for the same destination, so pools key on
      scheme/host/port; for HTTPS the TLS parameters matter too since you can't reuse a TLS
      session negotiated for a different config.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-017
    difficulty: advanced
    tags: [pooling, validation, stale-connection]
    question: |
      Why should a connection pool validate or probe a connection before handing it out for
      reuse?
    options:
      - "Because the server, LB, or NAT may have silently closed the idle connection, so a borrowed one may be dead"
      - "To re-run the TLS handshake on every borrow"
      - "To re-resolve DNS for every request"
      - "Because Content-Length changes between requests"
    answer: 0
    explanation: |
      Idle connections can be closed out-of-band by the server, a load balancer, or a NAT that
      dropped its state. Borrowing a dead connection yields errors, so pools validate/evict
      stale connections before reuse.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-018
    difficulty: beginner
    tags: [pipelining, http11, definition]
    question: |
      What does HTTP/1.1 pipelining allow a client to do?
    options:
      - "Open unlimited parallel TCP connections"
      - "Send multiple requests back-to-back without waiting for each response"
      - "Compress request headers with HPACK"
      - "Receive responses in any order the server chooses"
    answer: 1
    explanation: |
      Pipelining lets a client send several requests on one connection without waiting for
      responses. However, responses must return in strict request order (FIFO).
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-019
    difficulty: intermediate
    tags: [pipelining, hol-blocking]
    question: |
      What fundamental limitation causes head-of-line blocking with HTTP/1.1 pipelining?
    options:
      - "Requests must be encrypted individually"
      - "Each request opens its own TCP connection"
      - "Responses must be returned in the same order the requests were sent"
      - "Headers cannot be compressed"
    answer: 2
    explanation: |
      Pipelined responses must come back in FIFO order. A slow first response blocks all the
      responses queued behind it — application-layer head-of-line blocking.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-020
    difficulty: intermediate
    tags: [pipelining, deployment, browsers]
    question: |
      Which of the following is a real reason HTTP/1.1 pipelining failed in practice?
    options:
      - "It required TLS 1.3, which was not yet available"
      - "It could only be used with UDP transport"
      - "It doubled the number of TCP connections needed"
      - "Buggy intermediaries mishandled pipelined requests, and retrying non-idempotent requests after failure is unsafe"
    answer: 3
    explanation: |
      Beyond HOL blocking, many proxies/servers mishandled pipelining, and on failure a client
      can't safely retry a pipelined non-idempotent request (it can't tell what was processed).
      Browsers ship with it disabled.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-021
    difficulty: intermediate
    tags: [http2, multiplexing, streams]
    question: |
      How does HTTP/2 multiplexing improve on HTTP/1.1 pipelining?
    options:
      - "It carries many independent streams whose responses can be interleaved and returned in any order"
      - "It opens more TCP connections per origin"
      - "It forces all responses to be returned strictly in order but faster"
      - "It compresses bodies instead of headers"
    answer: 0
    explanation: |
      HTTP/2 (RFC 9113) multiplexes many independent streams over one connection as
      interleaved binary frames. Responses need not be in order, eliminating application-layer
      head-of-line blocking.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-022
    difficulty: advanced
    tags: [http2, tcp-hol, transport]
    question: |
      HTTP/2 removes application-layer head-of-line blocking. What kind of head-of-line
      blocking can it still suffer?
    options:
      - "DNS-layer HOL blocking"
      - "TCP-layer HOL blocking — a single lost TCP segment stalls all streams"
      - "TLS-layer HOL blocking on every record"
      - "None; HTTP/2 eliminates all HOL blocking"
    answer: 1
    explanation: |
      Because all HTTP/2 streams share one TCP connection, a lost TCP segment stalls delivery
      of every stream until retransmission. HTTP/3 over QUIC fixes this with per-stream loss
      recovery.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-023
    difficulty: intermediate
    tags: [scenario, pipelining, ordering]
    question: |
      A client pipelines three GETs on one HTTP/1.1 connection in this order: /slow (2 s),
      /fast1 (5 ms), /fast2 (5 ms). What happens?
    options:
      - "/fast1 and /fast2 return immediately; /slow returns last"
      - "All three responses arrive in whatever order they finish"
      - "/fast1 and /fast2 must wait until /slow's response is sent first"
      - "The server processes only /slow and drops the rest"
    answer: 2
    explanation: |
      Pipelining requires FIFO response ordering. Even though the fast responses are ready,
      they cannot be sent until /slow's response goes out first — the classic HOL-blocking
      pathology.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-024
    difficulty: beginner
    tags: [nagle, tcp, small-packets]
    question: |
      What problem was Nagle's algorithm (RFC 896) designed to solve?
    options:
      - "Encrypting small packets"
      - "Resolving DNS faster"
      - "Preventing TCP sequence-number wraparound"
      - "Reducing the number of tiny packets ('tinygrams') from apps that write a few bytes at a time"
    answer: 3
    explanation: |
      Nagle coalesces small writes: if there is unacknowledged data outstanding, small writes
      are buffered until a full segment can be sent or the outstanding data is ACKed —
      reducing tinygram congestion.
    ref: "concepts.md#nagles-algorithm-and-tcp_nodelay"

  - id: connection-management-keepalive-pooling-025
    difficulty: beginner
    tags: [tcp-nodelay, nagle]
    question: |
      What does setting the `TCP_NODELAY` socket option do?
    options:
      - "Disables Nagle's algorithm so small segments are sent immediately"
      - "Enables Nagle's algorithm"
      - "Disables delayed ACK on the receiver"
      - "Enables TCP keepalive probes"
    answer: 0
    explanation: |
      TCP_NODELAY turns off Nagle's algorithm, sending small segments right away. It is common
      in latency-sensitive systems (RPC frameworks, databases, HTTP/2 stacks).
    ref: "concepts.md#nagles-algorithm-and-tcp_nodelay"

  - id: connection-management-keepalive-pooling-026
    difficulty: advanced
    tags: [nagle, delayed-ack, latency]
    question: |
      What is the classic pathological interaction that can add ~200 ms of latency to small
      request/response exchanges?
    options:
      - "Slow start combined with a large initial window"
      - "Nagle's algorithm interacting with TCP delayed ACK"
      - "TLS session resumption failing repeatedly"
      - "DNS negative caching"
    answer: 1
    explanation: |
      Nagle withholds a small final segment waiting for an ACK while delayed ACK (RFC 1122)
      withholds that ACK for up to ~200 ms waiting for data. The stall clears only when the
      delayed-ACK timer fires — a ~200 ms latency spike.
    ref: "concepts.md#nagles-algorithm-and-tcp_nodelay"

  - id: connection-management-keepalive-pooling-027
    difficulty: intermediate
    tags: [nagle, best-practice]
    question: |
      For an application that already batches each request into a single full write, what is
      the effect of Nagle's algorithm?
    options:
      - "It significantly reduces bandwidth usage"
      - "It improves throughput dramatically"
      - "It only adds latency and provides no benefit, so TCP_NODELAY is preferred"
      - "It is required for correct framing"
    answer: 2
    explanation: |
      Nagle helps only chatty apps that emit many tiny writes. If your app already writes whole
      messages at once, Nagle just adds latency, so disabling it with TCP_NODELAY is the norm.
    ref: "concepts.md#nagles-algorithm-and-tcp_nodelay"

  - id: connection-management-keepalive-pooling-028
    difficulty: advanced
    tags: [tcp-cork, coalescing]
    question: |
      What is the effect of TCP_CORK / TCP_NOPUSH, in contrast to TCP_NODELAY?
    options:
      - "It sends every byte immediately, like TCP_NODELAY"
      - "It disables the receive window"
      - "It forces the connection to close after each write"
      - "It aggressively coalesces writes until a full segment forms or the cork is released"
    answer: 3
    explanation: |
      TCP_CORK/TCP_NOPUSH is the opposite of TCP_NODELAY: it deliberately holds data to
      coalesce into full segments (e.g., sending headers plus a file body as few packets),
      until uncorked or a full segment accumulates.
    ref: "concepts.md#nagles-algorithm-and-tcp_nodelay"

  - id: connection-management-keepalive-pooling-029
    difficulty: beginner
    tags: [tcp-keepalive, http-keepalive, distinction]
    question: |
      TCP keepalive and HTTP keep-alive share a name but are different. Which statement is
      correct?
    options:
      - "TCP keepalive detects dead peers at the transport layer; HTTP keep-alive reuses a connection at the application layer"
      - "Both are application-layer features of HTTP"
      - "HTTP keep-alive sends periodic TCP probe packets"
      - "TCP keepalive is enabled by the Connection header"
    answer: 0
    explanation: |
      TCP keepalive (SO_KEEPALIVE) is a transport-layer liveness probe for idle connections.
      HTTP keep-alive is application-layer connection reuse. They operate at different layers
      and are configured independently.
    ref: "concepts.md#tcp-keepalive-vs-http-keep-alive-two-different-things"

  - id: connection-management-keepalive-pooling-030
    difficulty: intermediate
    tags: [tcp-keepalive, so-keepalive]
    question: |
      Which socket option enables TCP keepalive probes on an idle connection?
    options:
      - "TCP_NODELAY"
      - "SO_KEEPALIVE"
      - "SO_REUSEADDR"
      - "SO_LINGER"
    answer: 1
    explanation: |
      SO_KEEPALIVE turns on TCP's periodic keepalive probes, which detect whether an idle
      peer is still reachable (crashed host, cut link, dropped NAT state).
    ref: "concepts.md#tcp-keepalive-vs-http-keep-alive-two-different-things"

  - id: connection-management-keepalive-pooling-031
    difficulty: intermediate
    tags: [tcp-keepalive, default-timing]
    question: |
      What is notable about the DEFAULT timing of TCP keepalive on typical systems?
    options:
      - "It probes every second"
      - "It never probes unless data is flowing"
      - "It waits about 2 hours of idle before sending the first probe"
      - "It probes only during the handshake"
    answer: 2
    explanation: |
      The classic default (tcp_keepalive_time) waits about 2 hours of idle before the first
      probe — far too slow for app-level dead-peer detection, which is why apps use heartbeats
      or tune the value down.
    ref: "concepts.md#tcp-keepalive-vs-http-keep-alive-two-different-things"

  - id: connection-management-keepalive-pooling-032
    difficulty: intermediate
    tags: [tcp-keepalive, http-keepalive, trap]
    question: |
      Does enabling HTTP keep-alive cause TCP keepalive probes to be sent on the connection?
    options:
      - "Yes, HTTP keep-alive turns on TCP probes automatically"
      - "Only for HTTPS connections"
      - "Only if Content-Length is omitted"
      - "No, they are independent; HTTP keep-alive just leaves the socket open for reuse and sends no probes"
    answer: 3
    explanation: |
      They are unrelated. HTTP keep-alive keeps the socket open to reuse it and sends no probe
      traffic. TCP keepalive is a separate socket option (SO_KEEPALIVE) that must be enabled
      explicitly.
    ref: "concepts.md#tcp-keepalive-vs-http-keep-alive-two-different-things"

  - id: connection-management-keepalive-pooling-033
    difficulty: beginner
    tags: [idle-timeout, server]
    question: |
      Why do servers close keep-alive connections after an idle timeout?
    options:
      - "To reclaim resources rather than hold thousands of idle sockets indefinitely"
      - "To force clients to re-authenticate"
      - "Because HTTP forbids connections older than 60 seconds"
      - "To rotate TLS keys on every request"
    answer: 0
    explanation: |
      Holding idle sockets consumes memory, file descriptors, and connection slots. Servers
      bound idle connections with a keep-alive timeout to reclaim those resources.
    ref: "concepts.md#idle-timeouts"

  - id: connection-management-keepalive-pooling-034
    difficulty: intermediate
    tags: [idle-timeout, keep-alive-header]
    question: |
      What does the response header `Keep-Alive: timeout=5, max=100` advertise?
    options:
      - "That the connection will be closed after 5 requests"
      - "That the server allows ~5 seconds idle and up to ~100 requests per connection"
      - "That the client must send a request every 100 ms"
      - "That TLS resumption is valid for 5 minutes"
    answer: 1
    explanation: |
      The Keep-Alive header advertises the idle timeout (timeout, in seconds) and the maximum
      number of requests (max) the server will serve on this persistent connection before
      closing it.
    ref: "concepts.md#idle-timeouts"

  - id: connection-management-keepalive-pooling-035
    difficulty: advanced
    tags: [idle-timeout, race-condition, reuse]
    question: |
      What is the classic keep-alive race condition on connection reuse?
    options:
      - "Two clients try to use the same connection simultaneously"
      - "The DNS record changes between requests"
      - "The server/LB closes an idle connection at the same moment the client sends a request on it, so the request fails"
      - "The congestion window resets to zero mid-request"
    answer: 2
    explanation: |
      If the server or load balancer decides to close an idle connection just as the client
      dispatches a request on it, the request meets a FIN/RST and fails. Mitigations include
      lower client timeouts and retrying idempotent requests.
    ref: "concepts.md#idle-timeouts"

  - id: connection-management-keepalive-pooling-036
    difficulty: advanced
    tags: [idle-timeout, tuning, scenario]
    question: |
      To minimize failed reuses, how should idle timeouts be ordered along the path from
      client to load balancer to server?
    options:
      - "LB timeout < server timeout < client timeout"
      - "All three should be identical"
      - "server timeout < client timeout < LB timeout"
      - "client timeout < server keep-alive timeout < LB idle timeout"
    answer: 3
    explanation: |
      Keeping timeouts strictly increasing (client < server < LB) means the client retires a
      connection before any upstream closes it, avoiding the race where one end reuses a
      connection the other just closed.
    ref: "concepts.md#idle-timeouts"

  - id: connection-management-keepalive-pooling-037
    difficulty: intermediate
    tags: [idle-timeout, nat, middlebox]
    question: |
      Why can a NAT gateway or firewall cause a keep-alive connection to fail even when both
      endpoints think it is alive?
    options:
      - "It may silently drop idle flow state after its own timeout, so the mapping is gone"
      - "It re-encrypts the traffic and breaks TLS"
      - "It changes the HTTP method"
      - "It forces the connection into slow start"
    answer: 0
    explanation: |
      NATs and firewalls track flow state and expire idle mappings after a timeout. Once the
      mapping is dropped, packets no longer traverse, so the connection is dead even though the
      endpoints never saw a FIN.
    ref: "concepts.md#idle-timeouts"

  - id: connection-management-keepalive-pooling-038
    difficulty: beginner
    tags: [reuse, tls-resumption, benefit]
    question: |
      What is the biggest latency benefit of reusing the exact same TCP+TLS connection for a
      subsequent request?
    options:
      - "It compresses the response body automatically"
      - "The request pays zero setup — no handshake, no key exchange — and rides a warm cwnd"
      - "It guarantees the response is cached"
      - "It halves the MTU"
    answer: 1
    explanation: |
      Full reuse of the same connection means subsequent requests skip both handshakes
      entirely and benefit from the already-grown congestion window — the cheapest possible
      request.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-039
    difficulty: intermediate
    tags: [tls-resumption, session-ticket, tls12]
    question: |
      TLS session resumption on a NEW connection primarily saves what, compared to a full
      handshake?
    options:
      - "It skips the TCP handshake"
      - "It removes the need for certificates entirely"
      - "It avoids the full TLS handshake by reusing prior TLS state (cutting RTTs and expensive key exchange)"
      - "It disables encryption for that session"
    answer: 2
    explanation: |
      Resumption (session IDs/tickets in TLS 1.2, PSK in TLS 1.3) reuses previously negotiated
      TLS state so a new connection avoids the full handshake — cutting RTTs and skipping the
      costly key-exchange work. It does not skip the TCP handshake.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-040
    difficulty: intermediate
    tags: [tls13, zero-rtt, resumption]
    question: |
      What does TLS 1.3 0-RTT resumption allow the client to do?
    options:
      - "Skip the TCP handshake as well as TLS"
      - "Negotiate a brand-new certificate faster"
      - "Reuse the server's private key"
      - "Send application data ('early data') in its very first flight, alongside the ClientHello"
    answer: 3
    explanation: |
      With a cached PSK from a prior session (via NewSessionTicket), TLS 1.3 0-RTT lets the
      client send early data in its first flight, before the handshake finishes — zero TLS
      round trips to first data.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-041
    difficulty: advanced
    tags: [zero-rtt, replay, idempotency]
    question: |
      Why must TLS 1.3 0-RTT early data be restricted to idempotent, replay-safe requests?
    options:
      - "Because an attacker can capture and replay the first flight, so non-idempotent operations could be duplicated"
      - "Because 0-RTT data is sent unencrypted"
      - "Because 0-RTT breaks Content-Length"
      - "Because early data cannot be larger than one packet"
    answer: 0
    explanation: |
      0-RTT early data has no anti-replay guarantee at the TLS layer — a captured first flight
      can be resent. So only idempotent, replay-safe requests (e.g., GET) belong in 0-RTT;
      never a payment or state-mutating POST.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-042
    difficulty: intermediate
    tags: [quic, http3, handshake]
    question: |
      How does QUIC (used by HTTP/3) change connection setup compared to TCP+TLS?
    options:
      - "It removes encryption to save a round trip"
      - "It folds the transport and TLS 1.3 handshakes together, so fresh is 1-RTT and resumed can be 0-RTT"
      - "It requires a separate DNS lookup for TLS"
      - "It always needs two round trips regardless of resumption"
    answer: 1
    explanation: |
      QUIC (RFC 9000) integrates the transport handshake with TLS 1.3, combining connection and
      crypto setup into one exchange: 1-RTT for a fresh connection and 0-RTT for a resumed one.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-043
    difficulty: intermediate
    tags: [tls12, session-id, session-ticket]
    question: |
      In TLS 1.2, which two mechanisms enable session resumption?
    options:
      - "Cookies and ETags"
      - "HSTS and OCSP stapling"
      - "Session IDs (server-side cache) and session tickets (RFC 5077, client-stored encrypted state)"
      - "SNI and ALPN"
    answer: 2
    explanation: |
      TLS 1.2 offers session IDs (the server caches the session state) and session tickets
      (RFC 5077; the server encrypts state into a ticket the client stores and presents),
      cutting the handshake from 2 RTTs to 1.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-044
    difficulty: intermediate
    tags: [http2, pooling, connections]
    question: |
      Compared to HTTP/1.1, why does an HTTP/2 client typically need far FEWER connections to
      a given origin?
    options:
      - "Because HTTP/2 forbids TLS"
      - "Because HTTP/2 responses are always cached"
      - "Because HTTP/2 uses UDP"
      - "Because a single HTTP/2 connection multiplexes many concurrent streams"
    answer: 3
    explanation: |
      A single HTTP/2 connection can carry many concurrent multiplexed streams, so the client
      does not need ~6 parallel connections per origin to get concurrency the way HTTP/1.1
      does.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-045
    difficulty: advanced
    tags: [scenario, pooling, exhaustion]
    question: |
      A service under a traffic spike opens a new TCP+TLS connection for every downstream call
      instead of pooling. Which set of symptoms best matches this mistake?
    options:
      - "High latency from repeated handshakes/slow start, high CPU from TLS, and possible source-port/FD exhaustion"
      - "Lower CPU usage and fewer file descriptors than pooling"
      - "Perfect throughput because each request gets a dedicated connection"
      - "Reduced server load because connections are short-lived"
    answer: 0
    explanation: |
      Per-request connections repeatedly pay handshake and slow-start cost, burn CPU on TLS key
      exchange, and can exhaust ephemeral source ports and file descriptors — the opposite of
      what pooling provides.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-046
    difficulty: intermediate
    tags: [scenario, keepalive, retry]
    question: |
      A client borrows a pooled connection and its GET fails immediately with a connection
      reset. What is the appropriate, safe behavior?
    options:
      - "Give up; the request can never succeed"
      - "Retry the idempotent GET on a fresh connection, since the peer likely closed the idle connection"
      - "Retry on the same dead connection repeatedly"
      - "Convert the GET to a POST and retry"
    answer: 1
    explanation: |
      A reset on a reused idle connection usually means the peer closed it out-of-band. Because
      GET is idempotent, retrying it on a fresh connection is safe and is the standard
      mitigation for this race.
    ref: "concepts.md#idle-timeouts"

  - id: connection-management-keepalive-pooling-047
    difficulty: beginner
    tags: [connection-close, http11]
    question: |
      In HTTP/1.1, which header explicitly tells the peer the connection will be closed after
      the current response?
    options:
      - "Connection: keep-alive"
      - "Keep-Alive: 0"
      - "Connection: close"
      - "Cache-Control: no-store"
    answer: 2
    explanation: |
      Since persistence is the HTTP/1.1 default, `Connection: close` is the meaningful signal:
      it tells the peer this is the last message on the connection and it should be closed
      afterward.
    ref: "concepts.md#http-persistent-connections-and-the-connection-header"

  - id: connection-management-keepalive-pooling-048
    difficulty: advanced
    tags: [scenario, tls-resumption, latency]
    question: |
      A mobile client repeatedly connects to the same HTTPS origin over TLS 1.3 but the pool
      often has no warm connection, so it must open new ones. Which technique most reduces the
      per-connection crypto latency?
    options:
      - "Disabling TLS entirely"
      - "Increasing the initial congestion window to 100 MSS"
      - "Switching all requests to non-idempotent POSTs"
      - "Using TLS 1.3 session resumption (PSK) so new connections skip the full handshake, ideally 0-RTT for GETs"
    answer: 3
    explanation: |
      When you cannot reuse the same connection, TLS 1.3 resumption via cached PSK avoids the
      full handshake on each new connection — 1-RTT resumed, or 0-RTT early data for
      replay-safe GETs — which is the main lever for cutting crypto setup latency.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-049
    difficulty: intermediate
    tags: [tcp-keepalive, purpose]
    question: |
      What is the primary purpose of TCP keepalive probes?
    options:
      - "To detect dead peers and clean up connections that are no longer usable"
      - "To improve throughput on active connections"
      - "To compress idle-connection headers"
      - "To renegotiate TLS keys periodically"
    answer: 0
    explanation: |
      TCP keepalive is about liveness detection and resource cleanup: probing idle connections
      to discover crashed peers, cut links, or dropped NAT state so dead connections can be
      reaped.
    ref: "concepts.md#tcp-keepalive-vs-http-keep-alive-two-different-things"

  - id: connection-management-keepalive-pooling-050
    difficulty: beginner
    tags: [multiplexing, hol, comparison]
    question: |
      Which statement correctly contrasts pipelining and multiplexing regarding response
      ordering?
    options:
      - "Both require strict FIFO response ordering"
      - "Pipelining requires FIFO ordering; multiplexing allows interleaved, any-order responses"
      - "Multiplexing requires FIFO ordering; pipelining allows any order"
      - "Neither imposes any ordering constraint"
    answer: 1
    explanation: |
      Pipelining forces responses back in request order (causing HOL blocking), whereas HTTP/2
      multiplexing carries independent streams whose frames can be interleaved and completed in
      any order.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-051
    difficulty: advanced
    tags: [ephemeral-ports, 4-tuple, exhaustion]
    question: |
      A client with a single source IP opens connections to exactly one downstream endpoint
      (one destination IP and one port). Assuming the default Linux ephemeral range
      (32768–60999), what is the approximate hard ceiling on simultaneous connections, and why?
    options:
      - "~28,000 — only the source port can vary in the 4-tuple, and that range is ~28k ports"
      - "~65,000 — any of the 16-bit port fields can be reused freely"
      - "Unlimited — the kernel multiplexes many connections onto one source port"
      - "~1,024 — connections must use privileged ports below 1024"
    answer: 0
    explanation: |
      A TCP connection is a unique 4-tuple (src IP, src port, dst IP, dst port). With src IP,
      dst IP, and dst port all fixed, only the ephemeral source port varies — and the default
      range 32768–60999 is ~28k ports. That caps simultaneous connections to that single
      destination, which is why pooling/keep-alive matters at scale.
    ref: "concepts.md#ephemeral-ports-the-4-tuple-and-time_wait"

  - id: connection-management-keepalive-pooling-052
    difficulty: expert
    tags: [ephemeral-ports, ip-bind-address-no-port, mitigation]
    question: |
      A client must maintain many concurrent connections spread across thousands of different
      destinations and is hitting source-port allocation failures. Which mechanism most directly
      raises the usable source-port count?
    options:
      - "Enabling SO_REUSEADDR on every outbound socket"
      - "IP_BIND_ADDRESS_NO_PORT, so the kernel defers source-port selection until connect() and picks a port unique per destination"
      - "Setting TCP_NODELAY to disable Nagle"
      - "Lowering the MSS so more connections fit in memory"
    answer: 1
    explanation: |
      Normally binding a source address reserves a port immediately, so it must be globally
      unique. IP_BIND_ADDRESS_NO_PORT defers port choice to connect() time, letting the kernel
      pick a port that only needs to be unique for that specific (dst IP, dst port) — vastly
      expanding capacity when connecting to many destinations. SO_REUSEADDR and TCP_NODELAY
      address unrelated problems.
    ref: "concepts.md#ephemeral-ports-the-4-tuple-and-time_wait"

  - id: connection-management-keepalive-pooling-053
    difficulty: advanced
    tags: [time-wait, active-closer, msl]
    question: |
      Which endpoint holds a socket in TIME_WAIT after a normal close, roughly how long, and
      why does the state exist?
    options:
      - "The passive closer, for 30 seconds, to renegotiate TLS keys"
      - "Both endpoints equally, for one RTT, to flush the receive buffer"
      - "The active closer, for ~2×MSL (~60 s on Linux), to absorb delayed segments and allow final-ACK retransmission"
      - "Whichever side has the higher IP address, indefinitely, until reboot"
    answer: 2
    explanation: |
      The side that sends the first FIN and completes the close (the active closer) enters
      TIME_WAIT for 2×MSL. This ensures stray delayed segments from the old connection can't be
      mis-delivered to a new connection reusing the same 4-tuple, and lets the final ACK be
      retransmitted if lost.
    ref: "concepts.md#ephemeral-ports-the-4-tuple-and-time_wait"

  - id: connection-management-keepalive-pooling-054
    difficulty: expert
    tags: [close-wait, time-wait, debugging]
    question: |
      `ss` on a server shows thousands of sockets stuck in CLOSE_WAIT that never clear. What is
      the most likely root cause?
    options:
      - "Normal protocol behavior — CLOSE_WAIT clears after 2×MSL like TIME_WAIT"
      - "The load balancer is sending too many keepalive probes"
      - "The application received the peer's FIN but is not calling close() on those sockets — a connection leak"
      - "The ephemeral port range is exhausted"
    answer: 2
    explanation: |
      CLOSE_WAIT means the peer closed and the local TCP received the FIN, but the socket stays
      in CLOSE_WAIT until the application calls close(). It is not timer-governed. A growing pile
      indicates the app is leaking connections (not closing them after the peer hung up) — a code
      bug, distinct from the timer-based TIME_WAIT on the active closer.
    ref: "concepts.md#ephemeral-ports-the-4-tuple-and-time_wait"

  - id: connection-management-keepalive-pooling-055
    difficulty: expert
    tags: [tcp-tw-recycle, tcp-tw-reuse, nat]
    question: |
      Why was Linux's `tcp_tw_recycle` removed, whereas `tcp_tw_reuse` remains?
    options:
      - "tcp_tw_recycle keyed on per-source-IP timestamps and dropped connections from clients behind NAT; tcp_tw_reuse safely reuses only for outbound connections using timestamp validation"
      - "tcp_tw_recycle disabled encryption; tcp_tw_reuse keeps it"
      - "They are identical; the rename was cosmetic"
      - "tcp_tw_reuse breaks NAT, so it is the one being phased out"
    answer: 0
    explanation: |
      tcp_tw_recycle applied per-source-IP timestamp checks, so multiple clients sharing one NAT
      IP with unsynchronized timestamps had connections silently dropped — it was removed.
      tcp_tw_reuse only lets the client reuse a TIME_WAIT socket for a new outbound connection
      when timestamps prove it is safe, without the NAT hazard.
    ref: "concepts.md#ephemeral-ports-the-4-tuple-and-time_wait"

  - id: connection-management-keepalive-pooling-056
    difficulty: advanced
    tags: [happy-eyeballs, dual-stack, rfc8305]
    question: |
      Under Happy Eyeballs v2 (RFC 8305), if the A (IPv4) DNS answer arrives before the AAAA
      (IPv6) answer, what does the client do?
    options:
      - "Immediately connect over IPv4 and ignore IPv6 entirely"
      - "Wait a short Resolution Delay (default ~50 ms) for the AAAA answer so IPv6 gets a fair chance before starting attempts"
      - "Abort and restart both DNS queries"
      - "Wait a full 2 seconds before doing anything"
    answer: 1
    explanation: |
      RFC 8305 prefers IPv6 when it works. If A arrives first, the client waits a Resolution
      Delay (default 50 ms) for the AAAA record rather than racing straight to IPv4, so a working
      IPv6 path is still preferred. Only if AAAA doesn't arrive in time does it proceed on IPv4.
    ref: "concepts.md#happy-eyeballs-dual-stack-connection-racing"

  - id: connection-management-keepalive-pooling-057
    difficulty: expert
    tags: [happy-eyeballs, connection-attempt-delay, scenario]
    question: |
      IPv6 users of a service report multi-second stalls establishing connections, while IPv4
      users connect instantly. The client uses serial fallback (try IPv6, then IPv4 only after a
      timeout). What is the correct fix?
    options:
      - "Disable IPv6 on all clients permanently"
      - "Increase the TCP handshake timeout so IPv6 has more time"
      - "Implement Happy Eyeballs v2: race families with a ~250 ms Connection Attempt Delay so a broken IPv6 path fails over in ~250 ms instead of a full TCP timeout"
      - "Switch to UDP so there is no handshake"
    answer: 2
    explanation: |
      Serial fallback stalls on the long IPv6 TCP timeout when IPv6 is broken. Happy Eyeballs v2
      staggers connection attempts by the Connection Attempt Delay (default 250 ms, floor 100 ms,
      max 2 s) and takes whichever handshake completes first — so a broken IPv6 path is bypassed
      in ~250 ms. Disabling IPv6 abandons a working transport; raising timeouts makes it worse.
    ref: "concepts.md#happy-eyeballs-dual-stack-connection-racing"

  - id: connection-management-keepalive-pooling-058
    difficulty: advanced
    tags: [http2, flow-control, window-update]
    question: |
      In HTTP/2 (RFC 9113), which frames are subject to flow control, and at what levels does it
      operate?
    options:
      - "All frame types, at the stream level only"
      - "Only DATA frames, at both the stream level and the whole-connection level"
      - "HEADERS and DATA frames, at the connection level only"
      - "SETTINGS frames, at the stream level only"
    answer: 1
    explanation: |
      HTTP/2 flow-controls only DATA frames (control/HEADERS/SETTINGS frames are exempt), and it
      does so simultaneously at two levels: per-stream and for the entire connection. A sender may
      send DATA only up to the smaller of the two available windows, replenished by WINDOW_UPDATE.
    ref: "concepts.md#http2-flow-control-and-concurrent-stream-limits"

  - id: connection-management-keepalive-pooling-059
    difficulty: expert
    tags: [http2, flow-control, bdp, debugging]
    question: |
      After migrating to HTTP/2, a single large download over a high-bandwidth, high-latency path
      is much slower than HTTP/1.1 was, even with no packet loss. Windows show the stream
      frequently idle waiting. What is the most likely cause?
    options:
      - "TCP-layer head-of-line blocking from lost segments"
      - "HPACK header compression is corrupting the body"
      - "The default 65,535-octet flow-control window is too small for the bandwidth-delay product, so the stream stalls waiting for WINDOW_UPDATE"
      - "Nagle's algorithm is buffering the DATA frames"
    answer: 2
    explanation: |
      The default SETTINGS_INITIAL_WINDOW_SIZE is 65,535 octets. On a large bandwidth-delay-product
      path that's far too little data in flight, so the sender exhausts the window and stalls
      waiting for WINDOW_UPDATE — self-inflicted throttling that mimics HOL blocking. The fix is to
      raise the initial stream and connection windows. There's no loss here, ruling out TCP HOL.
    ref: "concepts.md#http2-flow-control-and-concurrent-stream-limits"

  - id: connection-management-keepalive-pooling-060
    difficulty: advanced
    tags: [http2, max-concurrent-streams, settings]
    question: |
      HTTP/2 removes the ~6-connection-per-origin browser limit. What replaces it as the bound on
      how many requests run concurrently on one connection?
    options:
      - "The TCP receive window size"
      - "A hard protocol limit of exactly 100 streams"
      - "The peer-advertised SETTINGS_MAX_CONCURRENT_STREAMS (spec recommends ≥100)"
      - "The number of CPU cores on the server"
    answer: 2
    explanation: |
      Concurrency on one HTTP/2 connection is bounded per-peer by SETTINGS_MAX_CONCURRENT_STREAMS,
      which the spec recommends be at least 100 and SHOULD NOT be 0. It is a negotiated setting,
      not a fixed protocol constant — the honest answer to "how many concurrent requests can one H2
      connection run?"
    ref: "concepts.md#http2-flow-control-and-concurrent-stream-limits"

  - id: connection-management-keepalive-pooling-061
    difficulty: expert
    tags: [refused-stream, retry, idempotency]
    question: |
      A server sends RST_STREAM with error code REFUSED_STREAM for a stream carrying a POST. Is it
      safe for the client to automatically retry that POST, and why?
    options:
      - "No — POST is never safe to retry under any circumstances"
      - "Yes — REFUSED_STREAM guarantees the server did not start processing the stream, so retrying (even a non-idempotent POST) is safe"
      - "Only if the POST body is smaller than one DATA frame"
      - "Yes, but only after re-running the TLS handshake"
    answer: 1
    explanation: |
      REFUSED_STREAM explicitly means the stream was not processed (e.g., over the concurrent-stream
      limit or during shutdown). Because processing definitively did not begin, the client may safely
      retry even a non-idempotent POST — this is the precise wire signal that makes an otherwise-unsafe
      retry safe. PROTOCOL_ERROR/INTERNAL_ERROR give no such guarantee.
    ref: "concepts.md#settings_max_concurrent_streams-refused_stream-and-safe-retries"

  - id: connection-management-keepalive-pooling-062
    difficulty: advanced
    tags: [refused-stream, protocol-error, distinction]
    question: |
      Why is retrying a non-idempotent request safe after REFUSED_STREAM but NOT after
      INTERNAL_ERROR?
    options:
      - "REFUSED_STREAM guarantees the request was not processed; INTERNAL_ERROR gives no such guarantee, so the request may have taken effect"
      - "INTERNAL_ERROR only occurs for GET requests"
      - "REFUSED_STREAM closes the whole connection, forcing a clean retry"
      - "They are identical; both are always safe to retry"
    answer: 0
    explanation: |
      The safety of an auto-retry hinges on whether the request could have been processed.
      REFUSED_STREAM is a promise of non-processing. INTERNAL_ERROR (or PROTOCOL_ERROR) can occur
      after the server began work, so a duplicate of a non-idempotent request might double-apply —
      unsafe to retry blindly.
    ref: "concepts.md#settings_max_concurrent_streams-refused_stream-and-safe-retries"

  - id: connection-management-keepalive-pooling-063
    difficulty: expert
    tags: [goaway, graceful-shutdown, last-stream-id]
    question: |
      In the canonical double-GOAWAY graceful shutdown, why does the server first send a GOAWAY
      with Last-Stream-ID set to the maximum (2^31 − 1) before later sending one with the real
      last-stream-id?
    options:
      - "To immediately abort all in-flight streams"
      - "To reset all stream IDs back to 1"
      - "Because the real last-stream-id is unknown until the TCP FIN"
      - "To tell the peer to stop opening new streams while promising every in-flight stream will still be processed, allowing a clean drain"
    answer: 3
    explanation: |
      The first GOAWAY with NO_ERROR and the maximum Last-Stream-ID signals 'no new streams,'
      while guaranteeing that everything already in flight (all lower IDs) will be honored. After
      those drain, a second GOAWAY carries the real highest processed ID and the connection closes
      — no in-flight requests are lost during a restart.
    ref: "concepts.md#goaway-and-graceful-connection-draining"

  - id: connection-management-keepalive-pooling-064
    difficulty: advanced
    tags: [goaway, last-stream-id, retry]
    question: |
      A client receives a GOAWAY frame with Last-Stream-ID = 101. It had opened streams up to ID
      107. What can it conclude about streams 103, 105, and 107?
    options:
      - "They were definitively not processed and are safe to retry on a new connection"
      - "They completed successfully"
      - "They must be retried only if they were GETs"
      - "Their state is unknowable"
    answer: 0
    explanation: |
      GOAWAY's Last-Stream-ID is the highest stream the sender processed or might have processed.
      Streams with a higher ID (103, 105, 107) are guaranteed not processed, so the client can
      safely re-issue them (even non-idempotent ones) on a fresh connection — same guarantee as
      REFUSED_STREAM.
    ref: "concepts.md#goaway-and-graceful-connection-draining"

  - id: connection-management-keepalive-pooling-065
    difficulty: expert
    tags: [coalescing, 421, http2]
    question: |
      An HTTP/2 client reuses one connection for api.example.com and cdn.example.com because the
      certificate covers both and they resolved to the same IP. The backend serving that
      connection cannot serve cdn.example.com and returns 421 Misdirected Request. What should the
      client do?
    options:
      - "Treat 421 as a permanent failure and stop requesting cdn.example.com"
      - "Downgrade the connection to HTTP/1.1 and retry"
      - "Retry the request on a fresh connection to the correct origin (and stop coalescing it)"
      - "Ignore the 421 and resend on the same connection"
    answer: 2
    explanation: |
      421 Misdirected Request means the request was coalesced onto a connection whose server won't
      serve that authority. The correct response is to open a fresh connection to the right origin
      and retry there, ceasing to coalesce that authority onto the mis-targeted connection. It is
      not permanent, nor does it require a protocol downgrade.
    ref: "concepts.md#http2-connection-coalescing-and-421-misdirected-request"

  - id: connection-management-keepalive-pooling-066
    difficulty: advanced
    tags: [coalescing, requirements, http2]
    question: |
      Under RFC 9113, which two conditions must both hold before an HTTP/2 client may coalesce
      requests for a different authority onto an existing connection?
    options:
      - "The two hosts share a common TLD, and the connection is idle"
      - "Both hosts use the same HTTP method, and the pool has spare capacity"
      - "The client has visited both hosts before, and cookies match"
      - "The connection's TLS certificate is valid for the new host, AND the new host resolves to the same IP address as the existing connection"
    answer: 3
    explanation: |
      Coalescing requires (1) the connection's certificate to be authoritative for the new host
      (e.g., a wildcard/SAN covering both) and (2) the new host to resolve to the same IP as the
      connection. Both must hold; otherwise the client opens a separate connection. A shared TLD or
      matching method is insufficient.
    ref: "concepts.md#http2-connection-coalescing-and-421-misdirected-request"

  - id: connection-management-keepalive-pooling-067
    difficulty: advanced
    tags: [http2-ping, liveness, rtt]
    question: |
      What are the mechanics of an HTTP/2 PING frame (RFC 9113 §6.7)?
    options:
      - "It carries 8 opaque octets; the receiver must echo them back in a PING with the ACK flag set — used for liveness and RTT measurement"
      - "It carries the current stream ID and must be answered with a SETTINGS frame"
      - "It carries a 32-bit timestamp the receiver rewrites and forwards"
      - "It is sent only during the connection preface and never again"
    answer: 0
    explanation: |
      A PING frame carries 8 opaque octets on stream 0. The receiver MUST reply with a PING that
      sets the ACK flag (0x1) and repeats the identical payload. This lets the sender both verify
      the peer is responsive (liveness) and measure round-trip time. It is a genuine fourth
      liveness tool distinct from TCP keepalive and HTTP keep-alive.
    ref: "concepts.md#http2-ping-and-grpc-keepalive"

  - id: connection-management-keepalive-pooling-068
    difficulty: expert
    tags: [grpc, keepalive, enhance-your-calm, debugging]
    question: |
      gRPC clients are being disconnected with a GOAWAY carrying ENHANCE_YOUR_CALM and debug data
      "too_many_pings". What is the cause and fix?
    options:
      - "The server ran out of memory; add more replicas"
      - "TLS certificates expired; rotate them"
      - "The client's keepalive PING interval is below the server's PERMIT_KEEPALIVE_TIME (default 5 min); raise the client interval or lower the server's minimum"
      - "The client is sending too much request data; enable compression"
    answer: 2
    explanation: |
      Servers enforce a minimum keepalive interval via PERMIT_KEEPALIVE_TIME (default 5 minutes).
      A client PINGing more aggressively than that gets a GOAWAY with ENHANCE_YOUR_CALM and
      "too_many_pings," and is disconnected. The fix is to align the two sides: increase the
      client's KEEPALIVE_TIME or reduce the server's permitted minimum (and set
      KEEPALIVE_WITHOUT_CALLS deliberately).
    ref: "concepts.md#http2-ping-and-grpc-keepalive"

  - id: connection-management-keepalive-pooling-069
    difficulty: advanced
    tags: [grpc, max-connection-age, rebalancing]
    question: |
      What is the primary purpose of gRPC's MAX_CONNECTION_AGE (with MAX_CONNECTION_AGE_GRACE) on
      a server?
    options:
      - "To cap the size of individual RPC messages"
      - "To disable TLS after a fixed period"
      - "To limit the number of concurrent streams per connection"
      - "To force periodic graceful cycling of long-lived connections (via GOAWAY) so load balancers can rebalance them across backends"
    answer: 3
    explanation: |
      Long-lived multiplexed connections tend to pin traffic to whichever backend they landed on.
      MAX_CONNECTION_AGE bounds a connection's lifetime and, after MAX_CONNECTION_AGE_GRACE for
      draining, sends a graceful GOAWAY so the client reconnects — letting the load balancer
      re-spread connections across the fleet.
    ref: "concepts.md#http2-ping-and-grpc-keepalive"

  - id: connection-management-keepalive-pooling-070
    difficulty: expert
    tags: [load-balancing, l4, l7, multiplexing, debugging]
    question: |
      A gRPC service scaled to 20 replicas, but nearly all traffic lands on a handful of pods
      while the rest sit idle. Traffic passes through an L4 (connection-level) load balancer. What
      explains this and what is the best fix?
    options:
      - "The L4 LB pins each long-lived HTTP/2 connection (and all its multiplexed streams) to one backend; use an L7/per-request balancer or churn connections with MAX_CONNECTION_AGE"
      - "The pods have different CPU limits; make them uniform"
      - "HTTP/2 flow-control windows are too large; shrink them"
      - "DNS is caching a single pod IP; disable DNS caching only"
    answer: 0
    explanation: |
      An L4 LB balances connections, not requests. Because gRPC keeps a few long-lived HTTP/2
      connections and multiplexes all streams over them, every stream on a connection lands on the
      one backend it was pinned to — hotspotting. The fix is request-level (L7 / client-side)
      balancing, or forcing connection churn via MAX_CONNECTION_AGE so the balancer re-spreads them.
    ref: "concepts.md#connection-affinity-vs-stateless-pooling"

  - id: connection-management-keepalive-pooling-071
    difficulty: advanced
    tags: [quic, connection-migration, connection-id]
    question: |
      A user on HTTP/3 walks out of Wi-Fi range and their device switches to cellular, changing
      its IP address. Why does the QUIC connection survive when an equivalent TCP connection would
      break?
    options:
      - "QUIC re-runs the TLS handshake fast enough that the user doesn't notice"
      - "QUIC uses TCP underneath, which handles roaming natively"
      - "QUIC identifies the connection by a Connection ID rather than the 4-tuple, so packets from the new address still map to the same connection"
      - "The cellular network preserves the old IP address"
    answer: 2
    explanation: |
      QUIC (RFC 9000) keys a connection on a Connection ID carried in the header, decoupling
      identity from the IP/port 4-tuple. When the client's address changes, packets from the new
      address still match the existing connection, so it migrates without a new handshake or lost
      TLS state. TCP's connection IS its 4-tuple, so the same event kills it.
    ref: "concepts.md#quic-connection-migration-and-connection-ids"

  - id: connection-management-keepalive-pooling-072
    difficulty: expert
    tags: [quic, path-validation, migration, security]
    question: |
      When a QUIC endpoint sees packets arrive from a new peer address (a possible migration), it
      does not immediately send large amounts of data to that address. What safeguard is it
      applying and why?
    options:
      - "It renegotiates the session ticket to prevent replay"
      - "It downgrades to HTTP/2 until the address stabilizes"
      - "It resets the congestion window to the maximum to speed migration"
      - "It performs path validation (a path challenge/response) and honors an anti-amplification limit, to prevent using the connection as a spoofed-address reflection amplifier"
    answer: 3
    explanation: |
      An attacker could spoof a victim's address to make the server flood the victim. QUIC requires
      path validation (PATH_CHALLENGE/PATH_RESPONSE) to confirm the peer owns the new address, and
      limits how much it sends to an unvalidated address (anti-amplification, ~3× received bytes).
      This makes migration safe against reflection/amplification abuse.
    ref: "concepts.md#quic-connection-migration-and-connection-ids"

  - id: connection-management-keepalive-pooling-073
    difficulty: expert
    tags: [slow-start-after-idle, cwnd, pooling]
    question: |
      A pooled, long-lived TCP connection is used for a burst, sits idle for several seconds, then
      is reused for another large transfer — and that transfer starts slowly despite the
      connection being "warm." What is happening?
    options:
      - "The TLS session expired and had to be renegotiated"
      - "The receive window shrank to zero during idle"
      - "With tcp_slow_start_after_idle enabled, the connection's congestion window was reset to the initial window after being idle beyond an RTO, so it must slow-start again"
      - "The connection silently downgraded to HTTP/1.0"
    answer: 2
    explanation: |
      cwnd is per-connection state that decays when idle. By default (tcp_slow_start_after_idle=1),
      a connection idle longer than one RTO resets cwnd to the initial window and slow-starts again
      on the next send. So even a pooled 'warm' connection can be slow after a quiet period —
      disabling the setting or sending periodic traffic keeps the window warm.
    ref: "concepts.md#congestion-window-state-slow-start-after-idle"

  - id: connection-management-keepalive-pooling-074
    difficulty: advanced
    tags: [bbr, cubic, congestion-control]
    question: |
      How does BBR differ fundamentally from CUBIC in how it decides sending rate?
    options:
      - "BBR encrypts congestion signals; CUBIC does not"
      - "BBR models the path's bottleneck bandwidth and RTT directly, rather than treating packet loss as the primary congestion signal the way loss-based CUBIC does"
      - "BBR only works over UDP; CUBIC only over TCP"
      - "BBR disables the congestion window entirely"
    answer: 1
    explanation: |
      CUBIC is loss-based: it grows cwnd until loss, then backs off, which can under-fill high-BDP
      paths and overreact to random loss. BBR estimates the bottleneck bandwidth and round-trip
      propagation time and paces to that model, often ramping faster and sustaining higher
      throughput on lossy long-fat networks — relevant to how quickly fresh/post-idle connections
      reach full speed.
    ref: "concepts.md#congestion-window-state-slow-start-after-idle"

  - id: connection-management-keepalive-pooling-075
    difficulty: advanced
    tags: [idempotency, method-semantics, retry]
    question: |
      Per RFC 9110 semantics, which grouping of methods is correct?
    options:
      - "GET and POST are both safe; PUT is idempotent"
      - "GET/HEAD are safe; PUT and DELETE are idempotent but not safe; POST is neither safe nor idempotent"
      - "All methods are idempotent except HEAD"
      - "DELETE is safe; PUT is neither safe nor idempotent"
    answer: 1
    explanation: |
      Safe methods (GET, HEAD, OPTIONS, TRACE) are read-only. Idempotent methods add PUT and
      DELETE — repeating them has the same effect as once, but they do mutate. POST (and PATCH) are
      neither safe nor idempotent by default. Only safe/idempotent requests may be auto-retried on
      a broken connection or placed in 0-RTT.
    ref: "concepts.md#retry-safety-idempotency-and-method-semantics"

  - id: connection-management-keepalive-pooling-076
    difficulty: expert
    tags: [idempotency-key, post, retry]
    question: |
      Your client must safely auto-retry a POST that creates an order, even when the transport
      gives no 'not processed' guarantee (e.g., a plain connection reset mid-flight). What is the
      most robust approach?
    options:
      - "Convert the POST to a PUT so it becomes idempotent automatically"
      - "Always retry POSTs; duplicate orders are acceptable"
      - "Place the POST in TLS 1.3 0-RTT early data"
      - "Send an application-level idempotency key with the request so the server dedups duplicates, making retries safe regardless of transport signals"
    answer: 3
    explanation: |
      Transport signals (REFUSED_STREAM, GOAWAY last-stream-id) only cover specific cases. For a
      plain reset with unknown processing state, an application-level idempotency key lets the
      server recognize and dedup a retried request, making the POST safely retryable. Blindly
      re-issuing POSTs risks duplicates; 0-RTT is itself replayable and worsens the problem.
    ref: "concepts.md#retry-safety-idempotency-and-method-semantics"

  - id: connection-management-keepalive-pooling-077
    difficulty: expert
    tags: [zero-rtt, anti-replay, tls13]
    question: |
      Which mechanism is a legitimate server-side defense against TLS 1.3 0-RTT early-data replay
      attacks?
    options:
      - "Encrypting the early data twice"
      - "Requiring the client to send early data in exactly one packet"
      - "Single-use session tickets combined with a freshness/strike register that rejects duplicate ClientHellos within a time window"
      - "Disabling session tickets so resumption is impossible"
    answer: 2
    explanation: |
      RFC 8446 §8 describes anti-replay defenses: single-use tickets (a replayed flight presents an
      already-consumed ticket), strike/freshness registers tracking recently-seen ClientHellos, and
      bounded early-data windows. Servers may also reject early data outright, requiring the client
      to resend at 1-RTT. Doubling encryption or one-packet limits don't stop replay.
    ref: "concepts.md#0-rtt-anti-replay-defenses"

  - id: connection-management-keepalive-pooling-078
    difficulty: advanced
    tags: [zero-rtt, rejection, client-behavior]
    question: |
      Because a server MAY reject TLS 1.3 0-RTT early data, what must a compliant client always be
      prepared to do?
    options:
      - "Fall back to plaintext HTTP"
      - "Re-send the request as normal 1-RTT data once the handshake completes"
      - "Abort the connection permanently"
      - "Downgrade to TLS 1.2"
    answer: 1
    explanation: |
      0-RTT is best-effort: the server can respond as if the early data were never sent. The client
      must be able to re-transmit the request at 1-RTT after the handshake finishes. This is why
      0-RTT is suitable only for requests the client can safely resend — reinforcing the idempotency
      requirement.
    ref: "concepts.md#0-rtt-anti-replay-defenses"

  - id: connection-management-keepalive-pooling-079
    difficulty: expert
    tags: [quic, retry, address-validation, amplification]
    question: |
      What is the purpose of a QUIC server sending a Retry packet during connection establishment?
    options:
      - "To retransmit a lost handshake packet"
      - "To renegotiate the cipher suite"
      - "To force the client to prove ownership of its source address (via an echoed token) before the server commits expensive resources, mitigating spoofed-address amplification"
      - "To migrate the connection to a new Connection ID"
    answer: 2
    explanation: |
      A QUIC Retry packet carries a token the client must echo in a new Initial, proving it can
      receive at its claimed source address. Combined with the anti-amplification limit (server
      sends at most ~3× bytes received from an unvalidated address), this prevents attackers from
      using spoofed Initials to make the server flood a victim.
    ref: "concepts.md#0-rtt-anti-replay-defenses"

  - id: connection-management-keepalive-pooling-080
    difficulty: advanced
    tags: [affinity, stateless-pooling, load-balancing]
    question: |
      Which statement best contrasts sticky/affinity routing with stateless pooling?
    options:
      - "Affinity routing pins a client to a specific backend (needed for stateful sessions); stateless pooling lets any request go to any backend"
      - "Stateless pooling requires the client to reconnect on every request; affinity keeps one connection forever"
      - "Affinity routing only works over UDP; stateless pooling only over TCP"
      - "They are the same thing described at different layers"
    answer: 0
    explanation: |
      Affinity/sticky routing deliberately sends a given client (or connection) to the same backend,
      which is required when the backend holds session state. Stateless pooling treats backends as
      interchangeable so any request can go anywhere. The tension with HTTP/2 is that an L4 LB
      inadvertently creates affinity by pinning a whole multiplexed connection to one backend.
    ref: "concepts.md#connection-affinity-vs-stateless-pooling"
