topic: "Connection Management: Keep-Alive, Pooling & Multiplexing"
domain: networking
topic_slug: connection-management-keepalive-pooling
version: 1
questions:
  - id: connection-management-keepalive-pooling-001
    difficulty: beginner
    tags: [tcp, handshake, latency]
    question: |
      How many round trips does the TCP 3-way handshake add before a client can send
      request data?
    options:
      - "About 1 RTT"
      - "About 2 RTTs"
      - "About 3 RTTs"
      - "Zero — the client sends data in the SYN"
    answer: 0
    explanation: |
      The handshake is SYN, SYN-ACK, ACK. The client can piggyback/begin its request with
      the third packet, so the setup adds roughly one full round trip before the request
      goes out.
    ref: "concepts.md#tcp-connection-setup-cost-handshake-and-slow-start"

  - id: connection-management-keepalive-pooling-002
    difficulty: beginner
    tags: [slow-start, congestion-window]
    question: |
      Why does a brand-new TCP connection not immediately deliver a large response at full
      speed even after the handshake completes?
    options:
      - "Because TLS is still negotiating in the background"
      - "Because TCP starts in slow start with a small congestion window that grows over several RTTs"
      - "Because DNS must be re-resolved for each segment"
      - "Because the receive window is always 1 byte at first"
    answer: 1
    explanation: |
      TCP slow start (RFC 5681) begins with a small congestion window (modern stacks use an
      initial window of ~10 MSS, RFC 6928) and roughly doubles it each RTT. A large response
      thus takes several RTTs to ramp to full throughput on a cold connection.
    ref: "concepts.md#tcp-connection-setup-cost-handshake-and-slow-start"

  - id: connection-management-keepalive-pooling-003
    difficulty: intermediate
    tags: [initial-window, slow-start]
    question: |
      What is the modern default TCP initial congestion window recommended by RFC 6928?
    options:
      - "1 MSS"
      - "2 MSS"
      - "10 MSS (~14 KB)"
      - "4 MSS"
    answer: 2
    explanation: |
      RFC 6928 raised the initial window to 10 MSS (roughly 14 KB), letting a fresh
      connection send about 10 segments before waiting for an ACK, which speeds the early
      part of slow start.
    ref: "concepts.md#tcp-connection-setup-cost-handshake-and-slow-start"

  - id: connection-management-keepalive-pooling-004
    difficulty: intermediate
    tags: [tls, handshake, rtt]
    question: |
      Over a fresh connection, roughly how many round trips does a full TLS 1.3 handshake add
      on top of the TCP handshake?
    options:
      - "0 RTTs"
      - "2 RTTs"
      - "3 RTTs"
      - "1 RTT"
    answer: 3
    explanation: |
      A full TLS 1.3 handshake (RFC 8446) is 1-RTT, compared to TLS 1.2's 2-RTT handshake.
      So a cold HTTPS connection over TLS 1.3 is about 1 RTT (TCP) + 1 RTT (TLS) before data
      flows.
    ref: "concepts.md#tcp-connection-setup-cost-handshake-and-slow-start"

  - id: connection-management-keepalive-pooling-005
    difficulty: intermediate
    tags: [scenario, cold-connection, latency]
    question: |
      On a path with 100 ms RTT, a client opens a fresh HTTPS (TLS 1.3) connection for a
      single small request. Approximately how much latency is spent on connection setup
      before the request data is on its way?
    options:
      - "~200 ms (~1 RTT TCP + ~1 RTT TLS)"
      - "~50 ms (half a round trip)"
      - "~100 ms (TCP only; TLS is free)"
      - "~400 ms (2 RTT TCP + 2 RTT TLS)"
    answer: 0
    explanation: |
      TCP handshake ~1 RTT (100 ms) plus a full TLS 1.3 handshake ~1 RTT (100 ms) ≈ 200 ms of
      setup before useful data flows, on top of any slow-start ramp for the response.
    ref: "concepts.md#tcp-connection-setup-cost-handshake-and-slow-start"

  - id: connection-management-keepalive-pooling-006
    difficulty: intermediate
    tags: [warm-connection, reuse, throughput]
    question: |
      Besides skipping the handshakes, why is a reused ("warm") connection often faster for
      large transfers than a brand-new one?
    options:
      - "It uses a larger MSS than new connections"
      - "Its congestion window has already grown past slow start"
      - "It bypasses TCP checksums"
      - "It is exempt from the receiver's flow-control window"
    answer: 1
    explanation: |
      A warm connection has already ramped its congestion window during earlier transfers, so
      it can push a large response at higher throughput immediately instead of climbing out
      of slow start again.
    ref: "concepts.md#tcp-connection-setup-cost-handshake-and-slow-start"

  - id: connection-management-keepalive-pooling-007
    difficulty: beginner
    tags: [http-keepalive, persistent-connections, http11]
    question: |
      In HTTP/1.1, what is the default behavior for the TCP connection after a response is
      sent?
    options:
      - "The connection is closed after every response"
      - "The connection is upgraded to HTTP/2 automatically"
      - "The connection stays open (persistent) unless a party sends Connection: close"
      - "The connection is closed only for POST requests"
    answer: 2
    explanation: |
      HTTP/1.1 (RFC 9112) made persistent connections the default. Reuse is automatic; a peer
      must explicitly send Connection: close to signal it will close after the current
      response.
    ref: "concepts.md#http-persistent-connections-and-the-connection-header"

  - id: connection-management-keepalive-pooling-008
    difficulty: intermediate
    tags: [http10, connection-header]
    question: |
      In which HTTP version did the header `Connection: keep-alive` actually matter to enable
      reuse (because the default was to close)?
    options:
      - "HTTP/1.1"
      - "HTTP/2"
      - "HTTP/3"
      - "HTTP/1.0"
    answer: 3
    explanation: |
      HTTP/1.0 closed connections by default, so `Connection: keep-alive` was needed to opt
      into reuse. In HTTP/1.1 persistence is already the default, making the header largely a
      no-op.
    ref: "concepts.md#http-persistent-connections-and-the-connection-header"

  - id: connection-management-keepalive-pooling-009
    difficulty: intermediate
    tags: [connection-header, hop-by-hop, proxy]
    question: |
      Why must an intermediary (proxy) NOT blindly forward the `Connection` header to the next
      hop?
    options:
      - "Because it is a hop-by-hop header that applies only to the single connection between adjacent parties"
      - "Because it is end-to-end and only the origin may read it"
      - "Because forwarding it would corrupt Content-Length"
      - "Because it must be renamed to X-Connection first"
    answer: 0
    explanation: |
      `Connection` (and any header it names) is hop-by-hop: it governs only the single TCP hop
      between two adjacent parties. A proxy must strip it and the headers it lists rather than
      pass them on.
    ref: "concepts.md#http-persistent-connections-and-the-connection-header"

  - id: connection-management-keepalive-pooling-010
    difficulty: intermediate
    tags: [framing, content-length, chunked]
    question: |
      Reusing an HTTP/1.1 connection requires the receiver to know where each response body
      ends. Which mechanisms provide that framing?
    options:
      - "Only closing the connection"
      - "Content-Length or Transfer-Encoding: chunked"
      - "The Date header timestamp"
      - "A mandatory trailing empty line after every byte"
    answer: 1
    explanation: |
      Without a Content-Length or chunked transfer encoding, the only way to mark the end of a
      body is to close the connection — which defeats keep-alive. Proper framing is a
      prerequisite for reuse.
    ref: "concepts.md#http-persistent-connections-and-the-connection-header"

  - id: connection-management-keepalive-pooling-011
    difficulty: advanced
    tags: [http2, connection-header, forbidden]
    question: |
      What is the status of the `Connection` header in HTTP/2?
    options:
      - "Required on every request"
      - "Optional but recommended"
      - "Forbidden — connection management is handled by the protocol itself"
      - "Replaced by a Connection2 frame"
    answer: 2
    explanation: |
      HTTP/2 (RFC 9113) forbids connection-specific/hop-by-hop headers like `Connection`.
      Multiplexing and connection lifecycle are managed by the protocol's framing layer, so
      the header is not used.
    ref: "concepts.md#http-persistent-connections-and-the-connection-header"

  - id: connection-management-keepalive-pooling-012
    difficulty: beginner
    tags: [pooling, definition]
    question: |
      What is a client-side connection pool?
    options:
      - "A server-side queue of pending requests"
      - "A DNS cache for resolved hostnames"
      - "A buffer that stores response bodies for replay"
      - "A cache of open, reusable connections keyed by destination that clients borrow and return"
    answer: 3
    explanation: |
      A connection pool caches open connections (keyed by scheme/host/port and TLS config) so
      a client borrows a warm connection per request instead of opening a fresh socket each
      time.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-013
    difficulty: beginner
    tags: [pooling, per-host-limit, browser]
    question: |
      Approximately how many concurrent HTTP/1.1 connections do browsers typically allow per
      origin?
    options:
      - "About 6"
      - "About 2"
      - "About 32"
      - "Unlimited"
    answer: 0
    explanation: |
      Browsers cap around 6 concurrent HTTP/1.1 connections per origin. This bounds server
      load but also bounds parallelism, which was a major motivation for HTTP/2 multiplexing.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-014
    difficulty: intermediate
    tags: [pooling, little-law, sizing, scenario]
    question: |
      A service calls a downstream at 1000 requests/second with a mean response time of
      50 ms. Using Little's Law, roughly how many concurrent connections does it need as a
      floor?
    options:
      - "About 5"
      - "About 50"
      - "About 20"
      - "About 1000"
    answer: 1
    explanation: |
      Little's Law: L = λ × W = 1000 req/s × 0.05 s = 50 concurrent connections as the floor.
      You then add headroom for tail latency and bursts.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-015
    difficulty: intermediate
    tags: [pooling, sizing, latency]
    question: |
      What is the main symptom of a connection pool that is sized too SMALL for the load?
    options:
      - "Excessive idle sockets consuming memory"
      - "TLS certificates expire faster"
      - "Requests block waiting to borrow a connection, causing latency spikes"
      - "The server closes connections more aggressively"
    answer: 2
    explanation: |
      Too few connections means requests queue for an available connection, adding latency —
      especially under bursts. Too large a pool wastes memory/FDs and can exhaust server-side
      connection slots.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-016
    difficulty: intermediate
    tags: [pooling, keying, tls]
    question: |
      Connections in a pool are typically keyed by which attributes?
    options:
      - "Only the destination IP address"
      - "The HTTP method of the last request"
      - "The client's ephemeral source port"
      - "Scheme + host + port (and effectively TLS config for HTTPS)"
    answer: 3
    explanation: |
      A pooled connection is reusable only for the same destination, so pools key on
      scheme/host/port; for HTTPS the TLS parameters matter too since you can't reuse a TLS
      session negotiated for a different config.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-017
    difficulty: advanced
    tags: [pooling, validation, stale-connection]
    question: |
      Why should a connection pool validate or probe a connection before handing it out for
      reuse?
    options:
      - "Because the server, LB, or NAT may have silently closed the idle connection, so a borrowed one may be dead"
      - "To re-run the TLS handshake on every borrow"
      - "To re-resolve DNS for every request"
      - "Because Content-Length changes between requests"
    answer: 0
    explanation: |
      Idle connections can be closed out-of-band by the server, a load balancer, or a NAT that
      dropped its state. Borrowing a dead connection yields errors, so pools validate/evict
      stale connections before reuse.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-018
    difficulty: beginner
    tags: [pipelining, http11, definition]
    question: |
      What does HTTP/1.1 pipelining allow a client to do?
    options:
      - "Open unlimited parallel TCP connections"
      - "Send multiple requests back-to-back without waiting for each response"
      - "Compress request headers with HPACK"
      - "Receive responses in any order the server chooses"
    answer: 1
    explanation: |
      Pipelining lets a client send several requests on one connection without waiting for
      responses. However, responses must return in strict request order (FIFO).
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-019
    difficulty: intermediate
    tags: [pipelining, hol-blocking]
    question: |
      What fundamental limitation causes head-of-line blocking with HTTP/1.1 pipelining?
    options:
      - "Requests must be encrypted individually"
      - "Each request opens its own TCP connection"
      - "Responses must be returned in the same order the requests were sent"
      - "Headers cannot be compressed"
    answer: 2
    explanation: |
      Pipelined responses must come back in FIFO order. A slow first response blocks all the
      responses queued behind it — application-layer head-of-line blocking.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-020
    difficulty: intermediate
    tags: [pipelining, deployment, browsers]
    question: |
      Which of the following is a real reason HTTP/1.1 pipelining failed in practice?
    options:
      - "It required TLS 1.3, which was not yet available"
      - "It could only be used with UDP transport"
      - "It doubled the number of TCP connections needed"
      - "Buggy intermediaries mishandled pipelined requests, and retrying non-idempotent requests after failure is unsafe"
    answer: 3
    explanation: |
      Beyond HOL blocking, many proxies/servers mishandled pipelining, and on failure a client
      can't safely retry a pipelined non-idempotent request (it can't tell what was processed).
      Browsers ship with it disabled.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-021
    difficulty: intermediate
    tags: [http2, multiplexing, streams]
    question: |
      How does HTTP/2 multiplexing improve on HTTP/1.1 pipelining?
    options:
      - "It carries many independent streams whose responses can be interleaved and returned in any order"
      - "It opens more TCP connections per origin"
      - "It forces all responses to be returned strictly in order but faster"
      - "It compresses bodies instead of headers"
    answer: 0
    explanation: |
      HTTP/2 (RFC 9113) multiplexes many independent streams over one connection as
      interleaved binary frames. Responses need not be in order, eliminating application-layer
      head-of-line blocking.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-022
    difficulty: advanced
    tags: [http2, tcp-hol, transport]
    question: |
      HTTP/2 removes application-layer head-of-line blocking. What kind of head-of-line
      blocking can it still suffer?
    options:
      - "DNS-layer HOL blocking"
      - "TCP-layer HOL blocking — a single lost TCP segment stalls all streams"
      - "TLS-layer HOL blocking on every record"
      - "None; HTTP/2 eliminates all HOL blocking"
    answer: 1
    explanation: |
      Because all HTTP/2 streams share one TCP connection, a lost TCP segment stalls delivery
      of every stream until retransmission. HTTP/3 over QUIC fixes this with per-stream loss
      recovery.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-023
    difficulty: intermediate
    tags: [scenario, pipelining, ordering]
    question: |
      A client pipelines three GETs on one HTTP/1.1 connection in this order: /slow (2 s),
      /fast1 (5 ms), /fast2 (5 ms). What happens?
    options:
      - "/fast1 and /fast2 return immediately; /slow returns last"
      - "All three responses arrive in whatever order they finish"
      - "/fast1 and /fast2 must wait until /slow's response is sent first"
      - "The server processes only /slow and drops the rest"
    answer: 2
    explanation: |
      Pipelining requires FIFO response ordering. Even though the fast responses are ready,
      they cannot be sent until /slow's response goes out first — the classic HOL-blocking
      pathology.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-024
    difficulty: beginner
    tags: [nagle, tcp, small-packets]
    question: |
      What problem was Nagle's algorithm (RFC 896) designed to solve?
    options:
      - "Encrypting small packets"
      - "Resolving DNS faster"
      - "Preventing TCP sequence-number wraparound"
      - "Reducing the number of tiny packets ('tinygrams') from apps that write a few bytes at a time"
    answer: 3
    explanation: |
      Nagle coalesces small writes: if there is unacknowledged data outstanding, small writes
      are buffered until a full segment can be sent or the outstanding data is ACKed —
      reducing tinygram congestion.
    ref: "concepts.md#nagles-algorithm-and-tcp_nodelay"

  - id: connection-management-keepalive-pooling-025
    difficulty: beginner
    tags: [tcp-nodelay, nagle]
    question: |
      What does setting the `TCP_NODELAY` socket option do?
    options:
      - "Disables Nagle's algorithm so small segments are sent immediately"
      - "Enables Nagle's algorithm"
      - "Disables delayed ACK on the receiver"
      - "Enables TCP keepalive probes"
    answer: 0
    explanation: |
      TCP_NODELAY turns off Nagle's algorithm, sending small segments right away. It is common
      in latency-sensitive systems (RPC frameworks, databases, HTTP/2 stacks).
    ref: "concepts.md#nagles-algorithm-and-tcp_nodelay"

  - id: connection-management-keepalive-pooling-026
    difficulty: advanced
    tags: [nagle, delayed-ack, latency]
    question: |
      What is the classic pathological interaction that can add ~200 ms of latency to small
      request/response exchanges?
    options:
      - "Slow start combined with a large initial window"
      - "Nagle's algorithm interacting with TCP delayed ACK"
      - "TLS session resumption failing repeatedly"
      - "DNS negative caching"
    answer: 1
    explanation: |
      Nagle withholds a small final segment waiting for an ACK while delayed ACK (RFC 1122)
      withholds that ACK for up to ~200 ms waiting for data. The stall clears only when the
      delayed-ACK timer fires — a ~200 ms latency spike.
    ref: "concepts.md#nagles-algorithm-and-tcp_nodelay"

  - id: connection-management-keepalive-pooling-027
    difficulty: intermediate
    tags: [nagle, best-practice]
    question: |
      For an application that already batches each request into a single full write, what is
      the effect of Nagle's algorithm?
    options:
      - "It significantly reduces bandwidth usage"
      - "It improves throughput dramatically"
      - "It only adds latency and provides no benefit, so TCP_NODELAY is preferred"
      - "It is required for correct framing"
    answer: 2
    explanation: |
      Nagle helps only chatty apps that emit many tiny writes. If your app already writes whole
      messages at once, Nagle just adds latency, so disabling it with TCP_NODELAY is the norm.
    ref: "concepts.md#nagles-algorithm-and-tcp_nodelay"

  - id: connection-management-keepalive-pooling-028
    difficulty: advanced
    tags: [tcp-cork, coalescing]
    question: |
      What is the effect of TCP_CORK / TCP_NOPUSH, in contrast to TCP_NODELAY?
    options:
      - "It sends every byte immediately, like TCP_NODELAY"
      - "It disables the receive window"
      - "It forces the connection to close after each write"
      - "It aggressively coalesces writes until a full segment forms or the cork is released"
    answer: 3
    explanation: |
      TCP_CORK/TCP_NOPUSH is the opposite of TCP_NODELAY: it deliberately holds data to
      coalesce into full segments (e.g., sending headers plus a file body as few packets),
      until uncorked or a full segment accumulates.
    ref: "concepts.md#nagles-algorithm-and-tcp_nodelay"

  - id: connection-management-keepalive-pooling-029
    difficulty: beginner
    tags: [tcp-keepalive, http-keepalive, distinction]
    question: |
      TCP keepalive and HTTP keep-alive share a name but are different. Which statement is
      correct?
    options:
      - "TCP keepalive detects dead peers at the transport layer; HTTP keep-alive reuses a connection at the application layer"
      - "Both are application-layer features of HTTP"
      - "HTTP keep-alive sends periodic TCP probe packets"
      - "TCP keepalive is enabled by the Connection header"
    answer: 0
    explanation: |
      TCP keepalive (SO_KEEPALIVE) is a transport-layer liveness probe for idle connections.
      HTTP keep-alive is application-layer connection reuse. They operate at different layers
      and are configured independently.
    ref: "concepts.md#tcp-keepalive-vs-http-keep-alive-two-different-things"

  - id: connection-management-keepalive-pooling-030
    difficulty: intermediate
    tags: [tcp-keepalive, so-keepalive]
    question: |
      Which socket option enables TCP keepalive probes on an idle connection?
    options:
      - "TCP_NODELAY"
      - "SO_KEEPALIVE"
      - "SO_REUSEADDR"
      - "SO_LINGER"
    answer: 1
    explanation: |
      SO_KEEPALIVE turns on TCP's periodic keepalive probes, which detect whether an idle
      peer is still reachable (crashed host, cut link, dropped NAT state).
    ref: "concepts.md#tcp-keepalive-vs-http-keep-alive-two-different-things"

  - id: connection-management-keepalive-pooling-031
    difficulty: intermediate
    tags: [tcp-keepalive, default-timing]
    question: |
      What is notable about the DEFAULT timing of TCP keepalive on typical systems?
    options:
      - "It probes every second"
      - "It never probes unless data is flowing"
      - "It waits about 2 hours of idle before sending the first probe"
      - "It probes only during the handshake"
    answer: 2
    explanation: |
      The classic default (tcp_keepalive_time) waits about 2 hours of idle before the first
      probe — far too slow for app-level dead-peer detection, which is why apps use heartbeats
      or tune the value down.
    ref: "concepts.md#tcp-keepalive-vs-http-keep-alive-two-different-things"

  - id: connection-management-keepalive-pooling-032
    difficulty: intermediate
    tags: [tcp-keepalive, http-keepalive, trap]
    question: |
      Does enabling HTTP keep-alive cause TCP keepalive probes to be sent on the connection?
    options:
      - "Yes, HTTP keep-alive turns on TCP probes automatically"
      - "Only for HTTPS connections"
      - "Only if Content-Length is omitted"
      - "No, they are independent; HTTP keep-alive just leaves the socket open for reuse and sends no probes"
    answer: 3
    explanation: |
      They are unrelated. HTTP keep-alive keeps the socket open to reuse it and sends no probe
      traffic. TCP keepalive is a separate socket option (SO_KEEPALIVE) that must be enabled
      explicitly.
    ref: "concepts.md#tcp-keepalive-vs-http-keep-alive-two-different-things"

  - id: connection-management-keepalive-pooling-033
    difficulty: beginner
    tags: [idle-timeout, server]
    question: |
      Why do servers close keep-alive connections after an idle timeout?
    options:
      - "To reclaim resources rather than hold thousands of idle sockets indefinitely"
      - "To force clients to re-authenticate"
      - "Because HTTP forbids connections older than 60 seconds"
      - "To rotate TLS keys on every request"
    answer: 0
    explanation: |
      Holding idle sockets consumes memory, file descriptors, and connection slots. Servers
      bound idle connections with a keep-alive timeout to reclaim those resources.
    ref: "concepts.md#idle-timeouts"

  - id: connection-management-keepalive-pooling-034
    difficulty: intermediate
    tags: [idle-timeout, keep-alive-header]
    question: |
      What does the response header `Keep-Alive: timeout=5, max=100` advertise?
    options:
      - "That the connection will be closed after 5 requests"
      - "That the server allows ~5 seconds idle and up to ~100 requests per connection"
      - "That the client must send a request every 100 ms"
      - "That TLS resumption is valid for 5 minutes"
    answer: 1
    explanation: |
      The Keep-Alive header advertises the idle timeout (timeout, in seconds) and the maximum
      number of requests (max) the server will serve on this persistent connection before
      closing it.
    ref: "concepts.md#idle-timeouts"

  - id: connection-management-keepalive-pooling-035
    difficulty: advanced
    tags: [idle-timeout, race-condition, reuse]
    question: |
      What is the classic keep-alive race condition on connection reuse?
    options:
      - "Two clients try to use the same connection simultaneously"
      - "The DNS record changes between requests"
      - "The server/LB closes an idle connection at the same moment the client sends a request on it, so the request fails"
      - "The congestion window resets to zero mid-request"
    answer: 2
    explanation: |
      If the server or load balancer decides to close an idle connection just as the client
      dispatches a request on it, the request meets a FIN/RST and fails. Mitigations include
      lower client timeouts and retrying idempotent requests.
    ref: "concepts.md#idle-timeouts"

  - id: connection-management-keepalive-pooling-036
    difficulty: advanced
    tags: [idle-timeout, tuning, scenario]
    question: |
      To minimize failed reuses, how should idle timeouts be ordered along the path from
      client to load balancer to server?
    options:
      - "LB timeout < server timeout < client timeout"
      - "All three should be identical"
      - "server timeout < client timeout < LB timeout"
      - "client timeout < server keep-alive timeout < LB idle timeout"
    answer: 3
    explanation: |
      Keeping timeouts strictly increasing (client < server < LB) means the client retires a
      connection before any upstream closes it, avoiding the race where one end reuses a
      connection the other just closed.
    ref: "concepts.md#idle-timeouts"

  - id: connection-management-keepalive-pooling-037
    difficulty: intermediate
    tags: [idle-timeout, nat, middlebox]
    question: |
      Why can a NAT gateway or firewall cause a keep-alive connection to fail even when both
      endpoints think it is alive?
    options:
      - "It may silently drop idle flow state after its own timeout, so the mapping is gone"
      - "It re-encrypts the traffic and breaks TLS"
      - "It changes the HTTP method"
      - "It forces the connection into slow start"
    answer: 0
    explanation: |
      NATs and firewalls track flow state and expire idle mappings after a timeout. Once the
      mapping is dropped, packets no longer traverse, so the connection is dead even though the
      endpoints never saw a FIN.
    ref: "concepts.md#idle-timeouts"

  - id: connection-management-keepalive-pooling-038
    difficulty: beginner
    tags: [reuse, tls-resumption, benefit]
    question: |
      What is the biggest latency benefit of reusing the exact same TCP+TLS connection for a
      subsequent request?
    options:
      - "It compresses the response body automatically"
      - "The request pays zero setup — no handshake, no key exchange — and rides a warm cwnd"
      - "It guarantees the response is cached"
      - "It halves the MTU"
    answer: 1
    explanation: |
      Full reuse of the same connection means subsequent requests skip both handshakes
      entirely and benefit from the already-grown congestion window — the cheapest possible
      request.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-039
    difficulty: intermediate
    tags: [tls-resumption, session-ticket, tls12]
    question: |
      TLS session resumption on a NEW connection primarily saves what, compared to a full
      handshake?
    options:
      - "It skips the TCP handshake"
      - "It removes the need for certificates entirely"
      - "It avoids the full TLS handshake by reusing prior TLS state (cutting RTTs and expensive key exchange)"
      - "It disables encryption for that session"
    answer: 2
    explanation: |
      Resumption (session IDs/tickets in TLS 1.2, PSK in TLS 1.3) reuses previously negotiated
      TLS state so a new connection avoids the full handshake — cutting RTTs and skipping the
      costly key-exchange work. It does not skip the TCP handshake.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-040
    difficulty: intermediate
    tags: [tls13, zero-rtt, resumption]
    question: |
      What does TLS 1.3 0-RTT resumption allow the client to do?
    options:
      - "Skip the TCP handshake as well as TLS"
      - "Negotiate a brand-new certificate faster"
      - "Reuse the server's private key"
      - "Send application data ('early data') in its very first flight, alongside the ClientHello"
    answer: 3
    explanation: |
      With a cached PSK from a prior session (via NewSessionTicket), TLS 1.3 0-RTT lets the
      client send early data in its first flight, before the handshake finishes — zero TLS
      round trips to first data.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-041
    difficulty: advanced
    tags: [zero-rtt, replay, idempotency]
    question: |
      Why must TLS 1.3 0-RTT early data be restricted to idempotent, replay-safe requests?
    options:
      - "Because an attacker can capture and replay the first flight, so non-idempotent operations could be duplicated"
      - "Because 0-RTT data is sent unencrypted"
      - "Because 0-RTT breaks Content-Length"
      - "Because early data cannot be larger than one packet"
    answer: 0
    explanation: |
      0-RTT early data has no anti-replay guarantee at the TLS layer — a captured first flight
      can be resent. So only idempotent, replay-safe requests (e.g., GET) belong in 0-RTT;
      never a payment or state-mutating POST.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-042
    difficulty: intermediate
    tags: [quic, http3, handshake]
    question: |
      How does QUIC (used by HTTP/3) change connection setup compared to TCP+TLS?
    options:
      - "It removes encryption to save a round trip"
      - "It folds the transport and TLS 1.3 handshakes together, so fresh is 1-RTT and resumed can be 0-RTT"
      - "It requires a separate DNS lookup for TLS"
      - "It always needs two round trips regardless of resumption"
    answer: 1
    explanation: |
      QUIC (RFC 9000) integrates the transport handshake with TLS 1.3, combining connection and
      crypto setup into one exchange: 1-RTT for a fresh connection and 0-RTT for a resumed one.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-043
    difficulty: intermediate
    tags: [tls12, session-id, session-ticket]
    question: |
      In TLS 1.2, which two mechanisms enable session resumption?
    options:
      - "Cookies and ETags"
      - "HSTS and OCSP stapling"
      - "Session IDs (server-side cache) and session tickets (RFC 5077, client-stored encrypted state)"
      - "SNI and ALPN"
    answer: 2
    explanation: |
      TLS 1.2 offers session IDs (the server caches the session state) and session tickets
      (RFC 5077; the server encrypts state into a ticket the client stores and presents),
      cutting the handshake from 2 RTTs to 1.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-044
    difficulty: intermediate
    tags: [http2, pooling, connections]
    question: |
      Compared to HTTP/1.1, why does an HTTP/2 client typically need far FEWER connections to
      a given origin?
    options:
      - "Because HTTP/2 forbids TLS"
      - "Because HTTP/2 responses are always cached"
      - "Because HTTP/2 uses UDP"
      - "Because a single HTTP/2 connection multiplexes many concurrent streams"
    answer: 3
    explanation: |
      A single HTTP/2 connection can carry many concurrent multiplexed streams, so the client
      does not need ~6 parallel connections per origin to get concurrency the way HTTP/1.1
      does.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"

  - id: connection-management-keepalive-pooling-045
    difficulty: advanced
    tags: [scenario, pooling, exhaustion]
    question: |
      A service under a traffic spike opens a new TCP+TLS connection for every downstream call
      instead of pooling. Which set of symptoms best matches this mistake?
    options:
      - "High latency from repeated handshakes/slow start, high CPU from TLS, and possible source-port/FD exhaustion"
      - "Lower CPU usage and fewer file descriptors than pooling"
      - "Perfect throughput because each request gets a dedicated connection"
      - "Reduced server load because connections are short-lived"
    answer: 0
    explanation: |
      Per-request connections repeatedly pay handshake and slow-start cost, burn CPU on TLS key
      exchange, and can exhaust ephemeral source ports and file descriptors — the opposite of
      what pooling provides.
    ref: "concepts.md#client-side-connection-pooling-why-sizing-and-per-host-limits"

  - id: connection-management-keepalive-pooling-046
    difficulty: intermediate
    tags: [scenario, keepalive, retry]
    question: |
      A client borrows a pooled connection and its GET fails immediately with a connection
      reset. What is the appropriate, safe behavior?
    options:
      - "Give up; the request can never succeed"
      - "Retry the idempotent GET on a fresh connection, since the peer likely closed the idle connection"
      - "Retry on the same dead connection repeatedly"
      - "Convert the GET to a POST and retry"
    answer: 1
    explanation: |
      A reset on a reused idle connection usually means the peer closed it out-of-band. Because
      GET is idempotent, retrying it on a fresh connection is safe and is the standard
      mitigation for this race.
    ref: "concepts.md#idle-timeouts"

  - id: connection-management-keepalive-pooling-047
    difficulty: beginner
    tags: [connection-close, http11]
    question: |
      In HTTP/1.1, which header explicitly tells the peer the connection will be closed after
      the current response?
    options:
      - "Connection: keep-alive"
      - "Keep-Alive: 0"
      - "Connection: close"
      - "Cache-Control: no-store"
    answer: 2
    explanation: |
      Since persistence is the HTTP/1.1 default, `Connection: close` is the meaningful signal:
      it tells the peer this is the last message on the connection and it should be closed
      afterward.
    ref: "concepts.md#http-persistent-connections-and-the-connection-header"

  - id: connection-management-keepalive-pooling-048
    difficulty: advanced
    tags: [scenario, tls-resumption, latency]
    question: |
      A mobile client repeatedly connects to the same HTTPS origin over TLS 1.3 but the pool
      often has no warm connection, so it must open new ones. Which technique most reduces the
      per-connection crypto latency?
    options:
      - "Disabling TLS entirely"
      - "Increasing the initial congestion window to 100 MSS"
      - "Switching all requests to non-idempotent POSTs"
      - "Using TLS 1.3 session resumption (PSK) so new connections skip the full handshake, ideally 0-RTT for GETs"
    answer: 3
    explanation: |
      When you cannot reuse the same connection, TLS 1.3 resumption via cached PSK avoids the
      full handshake on each new connection — 1-RTT resumed, or 0-RTT early data for
      replay-safe GETs — which is the main lever for cutting crypto setup latency.
    ref: "concepts.md#connection-reuse-and-tls-session-resumption"

  - id: connection-management-keepalive-pooling-049
    difficulty: intermediate
    tags: [tcp-keepalive, purpose]
    question: |
      What is the primary purpose of TCP keepalive probes?
    options:
      - "To detect dead peers and clean up connections that are no longer usable"
      - "To improve throughput on active connections"
      - "To compress idle-connection headers"
      - "To renegotiate TLS keys periodically"
    answer: 0
    explanation: |
      TCP keepalive is about liveness detection and resource cleanup: probing idle connections
      to discover crashed peers, cut links, or dropped NAT state so dead connections can be
      reaped.
    ref: "concepts.md#tcp-keepalive-vs-http-keep-alive-two-different-things"

  - id: connection-management-keepalive-pooling-050
    difficulty: beginner
    tags: [multiplexing, hol, comparison]
    question: |
      Which statement correctly contrasts pipelining and multiplexing regarding response
      ordering?
    options:
      - "Both require strict FIFO response ordering"
      - "Pipelining requires FIFO ordering; multiplexing allows interleaved, any-order responses"
      - "Multiplexing requires FIFO ordering; pipelining allows any order"
      - "Neither imposes any ordering constraint"
    answer: 1
    explanation: |
      Pipelining forces responses back in request order (causing HOL blocking), whereas HTTP/2
      multiplexing carries independent streams whose frames can be interleaved and completed in
      any order.
    ref: "concepts.md#http11-pipelining-vs-http2-multiplexing"
