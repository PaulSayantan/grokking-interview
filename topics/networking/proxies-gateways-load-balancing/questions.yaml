topic: "Proxies, Gateways & Load Balancing (L4 vs L7)"
domain: networking
topic_slug: proxies-gateways-load-balancing
version: 1
questions:
  - id: proxies-gateways-load-balancing-001
    difficulty: beginner
    tags: [forward-proxy, reverse-proxy, definitions]
    question: |
      What fundamentally distinguishes a forward proxy from a reverse proxy?
    options:
      - "A forward proxy acts on behalf of clients; a reverse proxy acts on behalf of servers"
      - "A forward proxy relies on TCP while a reverse proxy communicates only over UDP"
      - "A forward proxy can terminate TLS while a reverse proxy is unable to"
      - "A forward proxy operates at L4 and a reverse proxy at L7 by definition"
    answer: 0
    explanation: |
      The defining axis is direction/intent: a forward proxy sits in front of clients and
      acts on their behalf to reach arbitrary origins, whereas a reverse proxy sits in front
      of servers and acts on their behalf. Layer, transport, and TLS handling are independent
      of this distinction.
    ref: "concepts.md#forward-proxy-vs-reverse-proxy"

  - id: proxies-gateways-load-balancing-002
    difficulty: beginner
    tags: [reverse-proxy, awareness]
    question: |
      From the client's perspective, a well-configured reverse proxy is usually:
    options:
      - "Explicitly listed in the client's browser or OS proxy settings"
      - "Reachable only over connectionless UDP datagrams rather than TCP"
      - "Invisible — the client thinks it is talking directly to the origin server"
      - "Required to sit on the very same LAN segment as the originating client"
    answer: 2
    explanation: |
      A reverse proxy sits on the server side and is typically transparent to clients: they
      believe they are talking to the origin. A forward proxy, by contrast, is usually
      explicitly configured on the client.
    ref: "concepts.md#forward-proxy-vs-reverse-proxy"

  - id: proxies-gateways-load-balancing-003
    difficulty: intermediate
    tags: [forward-proxy, connect, https]
    question: |
      A client behind a forward proxy wants to reach an HTTPS site. What does it typically
      send to the proxy first?
    options:
      - "A plaintext GET with the full https:// URL that the proxy decrypts"
      - "A recursive DNS query that the proxy resolves on the origin's behalf"
      - "A TLS ClientHello addressed directly to the proxy's certificate"
      - "An HTTP CONNECT request to open a blind TCP tunnel that the proxy relays"
    answer: 3
    explanation: |
      For HTTPS through a forward proxy, the client issues an HTTP CONNECT to establish a
      tunnel; the proxy then blindly relays the encrypted bytes and cannot see inside unless
      it performs TLS interception with a trusted CA.
    ref: "concepts.md#forward-proxy-vs-reverse-proxy"

  - id: proxies-gateways-load-balancing-004
    difficulty: intermediate
    tags: [forward-proxy, use-cases]
    question: |
      Which of these is a classic use case specifically for a FORWARD proxy?
    options:
      - "Corporate egress filtering and caching for outbound employee traffic"
      - "Distributing incoming traffic across a pool of web servers"
      - "Terminating TLS for a public API and injecting X-Forwarded-For"
      - "Serving as an API gateway front door for microservices"
    answer: 0
    explanation: |
      Egress control, caching, and content inspection for outbound client traffic are
      hallmark forward-proxy uses. Load balancing, TLS termination for public services, and
      API gateways are reverse-proxy roles.
    ref: "concepts.md#forward-proxy-vs-reverse-proxy"

  - id: proxies-gateways-load-balancing-005
    difficulty: beginner
    tags: [api-gateway, role]
    question: |
      An API gateway is best described as:
    options:
      - "An L4 packet forwarder that simply hashes the connection 4-tuple"
      - "An L7 reverse proxy specialized for API traffic with cross-cutting concerns"
      - "A specialized DNS server that resolves API hostnames to backend IPs"
      - "A client-side SDK library that transparently retries failed API calls"
    answer: 1
    explanation: |
      An API gateway is an L7 reverse proxy that acts as the single front door for backend
      services and offloads cross-cutting concerns like auth, rate limiting, routing, and TLS
      termination.
    ref: "concepts.md#api-gateway-role"

  - id: proxies-gateways-load-balancing-006
    difficulty: intermediate
    tags: [api-gateway, vs-load-balancer]
    question: |
      What does an API gateway typically add beyond what a plain load balancer does?
    options:
      - "It merely picks a healthy backend from the pool using round-robin rotation"
      - "It rewrites the destination IP address of each packet at the transport level"
      - "It authenticates callers, enforces rate limits/quotas, and transforms requests"
      - "It performs Direct Server Return so responses bypass the balancer entirely"
    answer: 2
    explanation: |
      A load balancer answers 'which healthy backend gets this connection?'. A gateway adds
      API-aware policy: authentication/authorization, rate limiting and quotas, request
      transformation, and observability on top of routing.
    ref: "concepts.md#api-gateway-role"

  - id: proxies-gateways-load-balancing-007
    difficulty: intermediate
    tags: [api-gateway, service-mesh, north-south]
    question: |
      In the gateway-vs-service-mesh split, an API gateway primarily handles which traffic?
    options:
      - "East–west traffic flowing between services deployed inside the cluster"
      - "Only intra-process function calls within a single service binary"
      - "Only the database replication traffic between primary and replica nodes"
      - "North–south traffic from external clients to the cluster edge"
    answer: 3
    explanation: |
      An API gateway governs north–south traffic (external clients entering at the edge),
      while a service mesh of sidecars governs east–west service-to-service traffic inside
      the cluster. They complement each other.
    ref: "concepts.md#api-gateway-role"

  - id: proxies-gateways-load-balancing-008
    difficulty: advanced
    tags: [api-gateway, anti-pattern]
    question: |
      Why is putting significant business logic into the API gateway considered an
      anti-pattern?
    options:
      - "Gateways are physically incapable of executing code and can only forward packets"
      - "It creates a shared bottleneck and deployment chokepoint — a distributed monolith at the edge"
      - "It forces every backend service behind it to be rewritten to speak HTTP/3"
      - "Gateways are strictly stateless and therefore cannot store any data at all"
    answer: 1
    explanation: |
      Concentrating business logic at the gateway turns it into a shared bottleneck and a
      coupling point that every team must coordinate to deploy through — effectively a
      distributed monolith at the edge. Keep gateways limited to cross-cutting concerns.
    ref: "concepts.md#api-gateway-role"

  - id: proxies-gateways-load-balancing-009
    difficulty: beginner
    tags: [l4, transport, 4-tuple]
    question: |
      An L4 load balancer makes its forwarding decision primarily based on:
    options:
      - "The connection 4-tuple (source/dest IP and port) plus protocol"
      - "The HTTP Host header together with the requested URL path"
      - "The Subject and SAN fields parsed from the TLS server certificate"
      - "The JSON field values contained within the request body payload"
    answer: 0
    explanation: |
      L4 operates at the transport layer, using source/destination IP and port (the 4-tuple)
      and protocol. It does not parse the application payload — Host headers, URLs, and
      bodies live above L4.
    ref: "concepts.md#l4-load-balancing-transport-layer"

  - id: proxies-gateways-load-balancing-010
    difficulty: beginner
    tags: [l4, characteristics]
    question: |
      Which statement about L4 load balancing is TRUE?
    options:
      - "It can route incoming requests based on the requested URL path"
      - "It always terminates TLS in order to inspect the payload content"
      - "It is protocol-agnostic and works for any TCP/UDP traffic, not just HTTP"
      - "It rewrites HTTP headers such as X-Forwarded-For before forwarding"
    answer: 2
    explanation: |
      Because L4 is opaque to application content, it works for any TCP/UDP protocol (SMTP,
      databases, game traffic, HTTP). It cannot route on URL path, does not terminate TLS to
      inspect, and cannot rewrite HTTP headers.
    ref: "concepts.md#l4-load-balancing-transport-layer"

  - id: proxies-gateways-load-balancing-011
    difficulty: intermediate
    tags: [l4, connection-pinning]
    question: |
      In a typical L4 load balancer, once a TCP connection is assigned to backend B:
    options:
      - "All packets for that connection continue to go to backend B for the connection's life"
      - "Each individual packet is independently re-balanced to the least-loaded backend"
      - "The connection is mirrored to every backend in the pool for redundancy"
      - "The LB decrypts the stream and re-routes on each individual HTTP request"
    answer: 0
    explanation: |
      L4 balancing is connection-oriented: the backend is pinned per connection, so every
      packet of that TCP connection is forwarded to the same backend for its lifetime. Per-
      request re-balancing is an L7 capability.
    ref: "concepts.md#l4-load-balancing-transport-layer"

  - id: proxies-gateways-load-balancing-012
    difficulty: beginner
    tags: [l7, application-layer]
    question: |
      An L7 load balancer can route traffic based on all of the following EXCEPT:
    options:
      - "HTTP Host header"
      - "URL path"
      - "Raw Ethernet frame CRC"
      - "Cookies and other request headers"
    answer: 2
    explanation: |
      L7 terminates the application protocol (HTTP) and routes on host, path, headers,
      cookies, and method. An Ethernet frame CRC is an L2 detail that plays no role in L7
      routing.
    ref: "concepts.md#l7-load-balancing-application-layer"

  - id: proxies-gateways-load-balancing-013
    difficulty: intermediate
    tags: [l7, connection-pooling]
    question: |
      A key capability unique to L7 (full-proxy) load balancing is:
    options:
      - "Forwarding stateless UDP datagrams without tracking any connection"
      - "Bypassing the return path via Direct Server Return to the client"
      - "Routing traffic based solely on the packet's destination port number"
      - "Multiplexing many client requests onto a small pool of reusable backend connections"
    answer: 3
    explanation: |
      Because an L7 LB terminates the client connection and opens its own backend
      connections, it can pool/multiplex requests onto reusable backend connections and even
      bridge protocols. DSR and stateless UDP forwarding are L4 behaviors.
    ref: "concepts.md#l7-load-balancing-application-layer"

  - id: proxies-gateways-load-balancing-014
    difficulty: advanced
    tags: [l7, per-request, http2]
    question: |
      With HTTP/2 multiplexing in front of an L7 load balancer, two requests arriving on the
      SAME client connection:
    options:
      - "Can be routed to different backends because balancing is per-request at L7"
      - "Must always be dispatched together to the exact same backend server"
      - "Cannot be balanced at all and must be rejected with a protocol error"
      - "Force the load balancer to silently drop down into L4 forwarding mode"
    answer: 0
    explanation: |
      L7 balancing is per-request, so multiplexed HTTP/2 streams on one client connection can
      each be routed to a different backend. This is not possible with connection-pinned L4
      balancing.
    ref: "concepts.md#l7-load-balancing-application-layer"

  - id: proxies-gateways-load-balancing-015
    difficulty: intermediate
    tags: [l4, sni, https]
    question: |
      An L4 load balancer is fronting HTTPS traffic without decrypting it. How can it still
      route by hostname?
    options:
      - "By reading the HTTP Host header carried inside the encrypted request body"
      - "By inspecting the cleartext SNI field in the TLS ClientHello"
      - "By decrypting the server's certificate chain to extract the common name"
      - "It cannot — hostname routing is impossible without full TLS termination"
    answer: 1
    explanation: |
      The TLS ClientHello carries the Server Name Indication (SNI) in cleartext, so an L4 LB
      can peek at it to route by hostname without decrypting the payload. The HTTP Host header
      itself is encrypted and unavailable to L4.
    ref: "concepts.md#l7-load-balancing-application-layer"

  - id: proxies-gateways-load-balancing-016
    difficulty: beginner
    tags: [l4-vs-l7, decision]
    question: |
      You need to load balance a PostgreSQL database's raw TCP connections with the lowest
      possible latency and no payload inspection. Which is the natural fit?
    options:
      - "L7 load balancing with path-based routing"
      - "An API gateway with JWT validation"
      - "L4 load balancing"
      - "A forward proxy with CONNECT tunneling"
    answer: 2
    explanation: |
      Non-HTTP protocols that need raw speed and no content inspection are the textbook case
      for L4 balancing, which is protocol-agnostic and low-overhead.
    ref: "concepts.md#l4-vs-l7-when-to-use-which"

  - id: proxies-gateways-load-balancing-017
    difficulty: intermediate
    tags: [l4-vs-l7, decision]
    question: |
      Which requirement most strongly pushes you toward L7 over L4 load balancing?
    options:
      - "You must forward UDP game traffic at line rate"
      - "You must keep TLS end-to-end encrypted and never terminate it"
      - "You want the LB to stay entirely out of the crypto path"
      - "You need to route /api to one pool and /static to another based on URL path"
    answer: 3
    explanation: |
      Path-based (content) routing requires parsing the HTTP request, which is an L7
      capability. The other three requirements (UDP forwarding, end-to-end TLS, staying out
      of crypto) all argue for L4.
    ref: "concepts.md#l4-vs-l7-when-to-use-which"

  - id: proxies-gateways-load-balancing-018
    difficulty: advanced
    tags: [l4-vs-l7, architecture]
    question: |
      A common large-scale design places an L4 load balancer at the very edge in front of a
      fleet of L7 proxies. What is the main rationale?
    options:
      - "L4 can fully inspect HTTP itself, which makes the separate L7 tier redundant"
      - "The L4 tier absorbs volume/DDoS at high speed while the L7 tier does smart HTTP routing"
      - "L7 proxies are incapable of terminating TLS, so the L4 tier must do it first"
      - "It lets the overall design avoid running backend health checks entirely"
    answer: 1
    explanation: |
      Layering gets both properties: a fast, cheap L4 edge absorbs huge packet volume and
      DDoS and can use DSR, while the L7 tier behind it performs content-based routing,
      rewriting, and other application-aware work.
    ref: "concepts.md#l4-vs-l7-when-to-use-which"

  - id: proxies-gateways-load-balancing-019
    difficulty: beginner
    tags: [algorithms, round-robin]
    question: |
      The round-robin algorithm distributes requests by:
    options:
      - "Handing each new request to the next backend in rotation"
      - "Sending each new request to the backend with the fewest active connections"
      - "Hashing the client IP to a fixed backend"
      - "Choosing the backend with the lowest measured latency"
    answer: 0
    explanation: |
      Round robin simply cycles through backends in order. It is fair only when backends and
      request costs are equal; it does not consider current load, connection counts, or
      latency.
    ref: "concepts.md#load-balancing-algorithms"

  - id: proxies-gateways-load-balancing-020
    difficulty: intermediate
    tags: [algorithms, least-connections]
    question: |
      Why does 'least connections' often outperform plain round robin?
    options:
      - "It needs no per-connection state kept on the load balancer"
      - "It guarantees the same client always hits the same backend"
      - "It adapts to uneven request durations by favoring less-busy backends"
      - "It encrypts all backend traffic with TLS before forwarding it"
    answer: 2
    explanation: |
      When request durations vary (some connections are long-lived or slow), round robin can
      pile work onto a node because it ignores load. Least connections routes to the backend
      with the fewest active connections, adapting to real load.
    ref: "concepts.md#load-balancing-algorithms"

  - id: proxies-gateways-load-balancing-021
    difficulty: intermediate
    tags: [algorithms, weighted]
    question: |
      You have a mix of large and small backend servers and want to send a new canary version
      only 5% of traffic. Which algorithm fits both needs?
    options:
      - "Weighted round robin (weights per backend)"
      - "IP hash pinning each client to one backend"
      - "Plain round robin across all backends equally"
      - "Random selection uniformly across the pool"
    answer: 0
    explanation: |
      Weighted round robin assigns proportional shares, so beefier servers can take more
      traffic and a canary can be given a small weight (e.g. 5%). Plain round robin and IP
      hash cannot express proportions.
    ref: "concepts.md#load-balancing-algorithms"

  - id: proxies-gateways-load-balancing-022
    difficulty: advanced
    tags: [algorithms, consistent-hashing]
    question: |
      For a pool of cache servers, why prefer consistent hashing over a plain modulo hash of
      the key?
    options:
      - "It replicates every key to all servers in the pool for redundancy"
      - "It removes the need for backend health checks across the pool entirely"
      - "When the pool size changes, only about 1/N of keys remap instead of nearly all"
      - "It guarantees perfectly even key distribution without any virtual nodes"
    answer: 2
    explanation: |
      A plain modulo hash reshuffles almost all keys when the server count changes, wrecking
      cache hit rates. Consistent hashing moves only ~1/N of keys when the pool changes size,
      which is why it is favored for cache/affinity use.
    ref: "concepts.md#load-balancing-algorithms"

  - id: proxies-gateways-load-balancing-023
    difficulty: intermediate
    tags: [algorithms, power-of-two]
    question: |
      The 'power of two choices' (random-of-two) algorithm works by:
    options:
      - "Always selecting exactly two backends and mirroring the request to both"
      - "Hashing each request deterministically onto one of just two backends"
      - "Alternating strictly between the first two backends in the pool"
      - "Picking two backends at random and sending to the less loaded of the two"
    answer: 3
    explanation: |
      Power-of-two-choices samples two random backends and routes to the less loaded one. It
      is cheap (no global state) yet gets close to optimal load distribution, avoiding the
      herd behavior of picking the single global minimum.
    ref: "concepts.md#load-balancing-algorithms"

  - id: proxies-gateways-load-balancing-024
    difficulty: beginner
    tags: [tls, termination]
    question: |
      With TLS termination (offload) at the load balancer:
    options:
      - "The LB decrypts TLS and forwards plaintext HTTP to backends over the internal network"
      - "The backend alone holds the private key, so the LB never decrypts any traffic"
      - "Traffic stays encrypted end-to-end from the client all the way to the backend"
      - "No TLS certificate needs to be provisioned anywhere in the path"
    answer: 0
    explanation: |
      TLS termination means the LB holds the cert/key, decrypts the client's TLS, and speaks
      plaintext HTTP to backends. This offloads crypto and enables inspection/routing, but the
      internal hop is cleartext and it is not end-to-end encrypted.
    ref: "concepts.md#tls-termination-vs-passthrough-vs-re-encryption"

  - id: proxies-gateways-load-balancing-025
    difficulty: intermediate
    tags: [tls, passthrough]
    question: |
      A compliance rule requires that the load balancer never be able to see decrypted
      traffic, yet you still want to balance HTTPS across backends. Which mode fits?
    options:
      - "TLS termination"
      - "TLS passthrough"
      - "TLS re-encryption"
      - "Plaintext HTTP with no TLS"
    answer: 1
    explanation: |
      TLS passthrough forwards the encrypted bytes without decrypting; the backend terminates
      TLS. The LB can only route on the 4-tuple or SNI. This preserves true end-to-end
      encryption and keeps the LB out of the crypto/inspection path.
    ref: "concepts.md#tls-termination-vs-passthrough-vs-re-encryption"

  - id: proxies-gateways-load-balancing-026
    difficulty: intermediate
    tags: [tls, re-encryption, zero-trust]
    question: |
      You need L7 features (path routing, WAF) AND the traffic between the LB and backends
      must be encrypted (zero-trust internal network). Which TLS mode do you use?
    options:
      - "Passthrough, forwarding the encrypted bytes untouched to the backend"
      - "Termination only, decrypting once at the LB and stopping there"
      - "Re-encryption (bridging): terminate client TLS, then open a new TLS to the backend"
      - "Disable TLS on the internal hop entirely to save backend CPU"
    answer: 2
    explanation: |
      Re-encryption terminates the client TLS so the LB can inspect and route at L7, then
      establishes a new TLS connection to the backend so the internal hop is also encrypted.
      Plain termination leaves the internal hop plaintext; passthrough forbids L7 features.
    ref: "concepts.md#tls-termination-vs-passthrough-vs-re-encryption"

  - id: proxies-gateways-load-balancing-027
    difficulty: advanced
    tags: [tls, threat-model]
    question: |
      An engineer argues that TLS termination at the LB gives full end-to-end encryption.
      What is the accurate critique?
    options:
      - "It is correct; TLS termination is end-to-end encryption by definition"
      - "Termination only works for UDP flows, so the claim about it is irrelevant"
      - "Termination requires the client itself to hold the server's private key"
      - "After termination the LB→backend hop is plaintext, so it is not end-to-end; use re-encryption if the internal network is untrusted"
    answer: 3
    explanation: |
      Termination decrypts at the LB and speaks plaintext to backends, so the internal
      segment is exposed. If the threat model includes the internal network, re-encryption
      (or passthrough) is required for true wire encryption to the backend.
    ref: "concepts.md#tls-termination-vs-passthrough-vs-re-encryption"

  - id: proxies-gateways-load-balancing-028
    difficulty: beginner
    tags: [health-checks, active]
    question: |
      An active L7 health check typically works by:
    options:
      - "Opening a TCP connection to the port and closing it"
      - "Sending an HTTP request (e.g. GET /healthz) and requiring a specific status/body"
      - "Pinging the backend's IP with ICMP echo and awaiting a reply"
      - "Reading the backend's CPU temperature over an out-of-band sensor bus"
    answer: 1
    explanation: |
      An L7 health check issues an actual HTTP request and validates the status code and/or
      body, confirming the application really works. A bare TCP connect is an L4 check and is
      less meaningful.
    ref: "concepts.md#health-checks"

  - id: proxies-gateways-load-balancing-029
    difficulty: intermediate
    tags: [health-checks, l4-vs-l7]
    question: |
      Why can an L4 (TCP-connect) health check report a backend as healthy when it actually
      cannot serve requests?
    options:
      - "The process can accept the TCP connection while being unable to process application requests (e.g. DB down)"
      - "A TCP connect attempt always fails outright on any broken server"
      - "L4 checks decrypt the application payload and then misread its contents"
      - "L4 checks run only once at process startup and are never repeated"
    answer: 0
    explanation: |
      A TCP-connect check only proves the port is listening. A process can accept connections
      while its dependencies (database, cache) are down and it cannot serve real requests — a
      case an L7 health check on a meaningful endpoint would catch.
    ref: "concepts.md#health-checks"

  - id: proxies-gateways-load-balancing-030
    difficulty: intermediate
    tags: [health-checks, thresholds]
    question: |
      Why do load balancers use an 'unhealthy threshold' of several consecutive failures
      before ejecting a backend?
    options:
      - "To deliberately make backend failures take longer to detect and report"
      - "Because the ICMP probe standard mandates exactly three attempts before ejection"
      - "To add hysteresis so a single transient blip doesn't flap the node in and out of rotation"
      - "To bypass the need for a corresponding healthy threshold entirely"
    answer: 2
    explanation: |
      Requiring N consecutive failures (and N successes to re-add) adds hysteresis, preventing
      a momentary blip from flapping a backend in and out of the pool, which would churn
      connections and destabilize the fleet.
    ref: "concepts.md#health-checks"

  - id: proxies-gateways-load-balancing-031
    difficulty: advanced
    tags: [health-checks, passive]
    question: |
      Passive health checking (outlier detection) differs from active checks in that it:
    options:
      - "Infers health from real traffic (e.g. ejecting a backend after N 5xx/timeouts) without dedicated probes"
      - "Proactively probes each backend on a fixed, scheduled interval with dedicated requests"
      - "Only works over UDP datagram transport and never over TCP"
      - "Requires the backend to expose live CPU and memory metrics for scoring"
    answer: 0
    explanation: |
      Passive checks observe live request outcomes and eject backends that fail (5xx,
      timeouts) beyond a threshold, adding no probe overhead and reacting to real failures.
      Active checks send dedicated probes on an interval.
    ref: "concepts.md#health-checks"

  - id: proxies-gateways-load-balancing-032
    difficulty: advanced
    tags: [health-checks, deep-check, cascading-failure]
    question: |
      What is a risk of making the health endpoint 'deep' (checking every downstream
      dependency on each probe)?
    options:
      - "It can only ever run at L4 and never inspect an application response"
      - "It makes the backend fully immune to failure of its dependencies"
      - "The check itself becomes a load source and can cause correlated/cascading failures"
      - "It silently disables the configured unhealthy-failure threshold"
    answer: 2
    explanation: |
      A heavy deep check that hammers dependencies on every probe adds load and can turn a
      shared-dependency hiccup into a fleet-wide eject-storm and cascading failure. Deep checks
      should be cheap and rate-limited.
    ref: "concepts.md#health-checks"

  - id: proxies-gateways-load-balancing-033
    difficulty: beginner
    tags: [sticky-sessions, affinity]
    question: |
      Sticky sessions (session affinity) are used to:
    options:
      - "Encrypt the connection between LB and backend"
      - "Spread each request evenly regardless of prior requests"
      - "Compress HTTP responses before returning them to the client"
      - "Pin a given client to the same backend across multiple requests"
    answer: 3
    explanation: |
      Session affinity ensures a client keeps hitting the same backend, which is needed when
      that backend holds local session state (in-memory session, local cache, a WebSocket)
      that other backends don't share.
    ref: "concepts.md#sticky-sessions-session-affinity"

  - id: proxies-gateways-load-balancing-034
    difficulty: intermediate
    tags: [sticky-sessions, cookie]
    question: |
      In LB-inserted cookie affinity, how does the load balancer keep a client on the same
      backend?
    options:
      - "It sets its own cookie identifying the chosen backend and reads it on later requests"
      - "It rewrites the client's source IP to match the backend"
      - "It requires the client to send an X-Forwarded-For header"
      - "It hashes the request URL path to select the backend"
    answer: 0
    explanation: |
      With LB-inserted cookies, the load balancer sets a cookie that encodes/identifies the
      chosen backend and reads it back on subsequent requests to route the client to the same
      backend — transparent to the application.
    ref: "concepts.md#sticky-sessions-session-affinity"

  - id: proxies-gateways-load-balancing-035
    difficulty: intermediate
    tags: [sticky-sessions, source-ip, nat]
    question: |
      Why can source-IP based stickiness distribute load poorly?
    options:
      - "Because a client's source IP is always globally unique per individual user"
      - "Because many clients behind a shared NAT/CGNAT appear as one IP and all land on one backend"
      - "Because source-IP stickiness mandates TLS termination at the balancer"
      - "Because source-IP affinity can only be combined with round robin"
    answer: 1
    explanation: |
      Source-IP affinity hashes the client IP to a backend. When many users sit behind one
      NAT/CGNAT address, they all hash to the same backend, creating a hotspot. Mobile clients
      whose IPs change also break the affinity.
    ref: "concepts.md#sticky-sessions-session-affinity"

  - id: proxies-gateways-load-balancing-036
    difficulty: advanced
    tags: [sticky-sessions, stateless, design]
    question: |
      What is the senior-level recommendation to avoid depending on sticky sessions?
    options:
      - "Increase the session-affinity timeout to effectively infinity"
      - "Switch all traffic to connection-pinned L4 balancing instead"
      - "Make services stateless by externalizing session state to a shared store or a signed client cookie"
      - "Disable health checks so backends never leave rotation"
    answer: 2
    explanation: |
      Stickiness is a crutch for stateful backends. Externalizing session state (shared
      Redis/DB or a signed client-held cookie) makes services stateless so any backend can
      serve any request, enabling free balancing, easy deploys, and horizontal scaling.
    ref: "concepts.md#sticky-sessions-session-affinity"

  - id: proxies-gateways-load-balancing-037
    difficulty: beginner
    tags: [x-forwarded-for, client-ip]
    question: |
      Why does a reverse proxy add an X-Forwarded-For header?
    options:
      - "To compress the request body before forwarding it, reducing bandwidth on the backend hop"
      - "To negotiate the TLS 1.3 cipher suite with the backend on the client's behalf"
      - "To perform recursive DNS resolution of the origin hostname on the backend's behalf"
      - "Because after termination the backend would otherwise see the proxy's IP, not the real client's"
    answer: 3
    explanation: |
      When a proxy terminates the client connection, the backend's source IP is the proxy's.
      X-Forwarded-For carries the original client IP (and the proxy chain) so backends can log,
      geolocate, and rate-limit by real client.
    ref: "concepts.md#x-forwarded-for-and-the-forwarded-header"

  - id: proxies-gateways-load-balancing-038
    difficulty: intermediate
    tags: [x-forwarded-for, chain]
    question: |
      Given `X-Forwarded-For: 203.0.113.7, 10.0.0.1, 10.0.0.2`, which address is claimed to be
      the original client?
    options:
      - "10.0.0.2 (rightmost)"
      - "203.0.113.7 (leftmost)"
      - "10.0.0.1 (middle)"
      - "It cannot be determined from XFF at all"
    answer: 1
    explanation: |
      Each proxy appends the address it received from, building a left-to-right chain, so the
      leftmost entry is the claimed original client and each entry rightward is a subsequent
      proxy. (Note the leftmost is client-supplied and spoofable.)
    ref: "concepts.md#x-forwarded-for-and-the-forwarded-header"

  - id: proxies-gateways-load-balancing-039
    difficulty: advanced
    tags: [x-forwarded-for, security, spoofing]
    question: |
      Why is it dangerous to trust the leftmost X-Forwarded-For value for an IP allowlist?
    options:
      - "A client can set an arbitrary X-Forwarded-For, spoofing the leftmost value"
      - "The header is always stripped during the TLS handshake, so it can never reach the backend"
      - "XFF can only contain IPv6 addresses, so IPv4 client allowlists silently fail to match"
      - "The leftmost value is guaranteed to be the first proxy in the chain, never the real client"
    answer: 0
    explanation: |
      XFF is client-controllable: a client can send any leftmost value it likes. For security
      you should trust XFF only from proxies you control and derive the client by counting a
      known number of trusted hops from the right (or trusted-proxy CIDRs). The L4 peer IP your
      edge actually received is the only fully trustworthy source.
    ref: "concepts.md#x-forwarded-for-and-the-forwarded-header"

  - id: proxies-gateways-load-balancing-040
    difficulty: intermediate
    tags: [x-forwarded-proto, tls]
    question: |
      After TLS termination at the LB, why is X-Forwarded-Proto important to the backend?
    options:
      - "It tells the backend which load-balancing algorithm the LB used to pick it for this request"
      - "It carries the client's session cookies so the backend need not read them from the request itself"
      - "It tells the backend the client actually used https, even though the LB→backend hop is http"
      - "It sets the response compression level the backend should apply before returning the payload"
    answer: 2
    explanation: |
      Since the LB speaks plaintext http to the backend after terminating TLS, the backend
      can't tell the client was on https. X-Forwarded-Proto conveys the original scheme so the
      app can build correct https URLs, set Secure cookies, and enforce HTTPS-only logic.
    ref: "concepts.md#x-forwarded-for-and-the-forwarded-header"

  - id: proxies-gateways-load-balancing-041
    difficulty: intermediate
    tags: [forwarded, rfc7239]
    question: |
      The `Forwarded` header (RFC 7239) differs from the older X-Forwarded-* set in that it:
    options:
      - "Is the standardized single header combining for, proto, by, and host information"
      - "Only works over UDP transports and is silently dropped on ordinary TCP connections"
      - "Is populated by the originating client itself rather than being appended by each proxy"
      - "Automatically encrypts the client IP with the session key so intermediaries cannot read it"
    answer: 0
    explanation: |
      RFC 7239 defines a single standardized Forwarded header (e.g.
      `Forwarded: for=192.0.2.60;proto=http;by=203.0.113.43`) to replace the ad-hoc
      X-Forwarded-* family, though XFF remains more widely deployed in practice.
    ref: "concepts.md#x-forwarded-for-and-the-forwarded-header"

  - id: proxies-gateways-load-balancing-042
    difficulty: beginner
    tags: [dsr, direct-server-return]
    question: |
      In Direct Server Return (DSR), the response from the backend to the client:
    options:
      - "Goes back through the load balancer as usual so it can rewrite the source address"
      - "Is dropped by the backend and re-requested by the client over a freshly opened connection"
      - "Is sent directly to the client, bypassing the load balancer on the return path"
      - "Is always larger than the request by design because DSR appends tunnel-encapsulation headers"
    answer: 2
    explanation: |
      DSR forwards requests through the LB but lets backends reply directly to the client,
      bypassing the LB on the return path. This keeps large responses off the LB, removing it
      as a bandwidth bottleneck.
    ref: "concepts.md#direct-server-return-dsr"

  - id: proxies-gateways-load-balancing-043
    difficulty: intermediate
    tags: [dsr, use-case]
    question: |
      DSR is most beneficial for which traffic profile?
    options:
      - "Small symmetric request/response pairs where both halves are of roughly equal byte size"
      - "Purely UDP broadcast traffic fanned out to every host on the local subnet at once"
      - "Traffic requiring deep L7 response rewriting of headers and bodies on the return path"
      - "Highly asymmetric traffic where responses (video/downloads) are far larger than requests"
    answer: 3
    explanation: |
      DSR shines when responses vastly exceed requests (streaming, downloads): keeping the big
      response half off the LB lets it scale enormously since it only handles the small inbound
      half. It cannot help when you need L7 response processing.
    ref: "concepts.md#direct-server-return-dsr"

  - id: proxies-gateways-load-balancing-044
    difficulty: advanced
    tags: [dsr, limitations]
    question: |
      Which is a genuine limitation of DSR?
    options:
      - "The LB never sees responses, so it cannot do L7 response rewriting and is inherently L4"
      - "It requires the LB to terminate TLS and hold every backend's private key to decrypt replies"
      - "It only works with the round-robin algorithm and is incompatible with least-connections"
      - "It doubles the number of TCP connections per request because each reply opens a new socket"
    answer: 0
    explanation: |
      Because responses bypass the LB, it has no visibility into the reply path — no L7
      response rewriting or reverse-direction connection tracking. It also needs specific
      topology (loopback VIP with ARP suppression, L2 adjacency or tunneling). DSR is
      inherently an L4 technique.
    ref: "concepts.md#direct-server-return-dsr"

  - id: proxies-gateways-load-balancing-045
    difficulty: advanced
    tags: [dsr, vip, arp]
    question: |
      For MAC-rewrite DSR to work, each backend must be configured so that it:
    options:
      - "Runs a full HTTP parser on every arriving packet to rewrite the destination before replying"
      - "Holds the service VIP on a non-ARPing loopback interface so it accepts VIP-addressed packets and replies as the VIP"
      - "Uses a unique VIP per connected client so the LB can tell their return flows apart"
      - "Terminates TLS on behalf of the load balancer using a copy of the LB's private key"
    answer: 1
    explanation: |
      In DSR, the LB forwards the packet without rewriting the destination (VIP). Each backend
      must own the VIP on a loopback with ARP suppressed, so it accepts the VIP-addressed
      packets and sends replies sourced from the VIP directly to the client.
    ref: "concepts.md#direct-server-return-dsr"

  - id: proxies-gateways-load-balancing-046
    difficulty: intermediate
    tags: [nat-mode, dnat]
    question: |
      In NAT-mode (DNAT) L4 load balancing, why must return traffic pass back through the load
      balancer?
    options:
      - "To encrypt the response payload with TLS before it is handed back to the client"
      - "To append an X-Forwarded-For header carrying the original client IP to the reply"
      - "So the LB can reverse the destination NAT (un-NAT) it applied on the way in"
      - "Because backends are physically unable to originate packets toward a remote client"
    answer: 2
    explanation: |
      DNAT rewrites the destination from the VIP to the chosen backend inbound; the reply must
      traverse the LB so it can rewrite the source back to the VIP. Otherwise the client would
      see replies from an unexpected backend IP and drop them.
    ref: "concepts.md#nat-mode-vs-proxy-mode"

  - id: proxies-gateways-load-balancing-047
    difficulty: intermediate
    tags: [proxy-mode, full-proxy]
    question: |
      In full-proxy mode, how many TCP connections are involved for one client request path,
      and what source IP does the backend see?
    options:
      - "One single end-to-end connection spliced through the LB; the backend sees the client IP"
      - "One single end-to-end connection spliced through the LB; the backend sees the LB's IP"
      - "Zero connections; the LB statelessly forwards raw packets without any TCP termination"
      - "Two separate connections (client↔LB and LB↔backend); backend sees the LB's IP"
    answer: 3
    explanation: |
      A full proxy terminates the client's TCP connection and opens a separate connection to
      the backend — two independent connections stitched together. The backend therefore sees
      the LB's IP as source, which is why X-Forwarded-For is needed to convey the client IP.
    ref: "concepts.md#nat-mode-vs-proxy-mode"

  - id: proxies-gateways-load-balancing-048
    difficulty: advanced
    tags: [proxy-mode, buffering, capabilities]
    question: |
      Which capability is unlocked specifically by full-proxy mode (and NOT by NAT mode)?
    options:
      - "Preserving the client's original source IP all the way to the backend without any header"
      - "Buffering slow clients, connection pooling, per-side TCP tuning, and TLS termination"
      - "Lower per-packet forwarding overhead than NAT because it rewrites only the headers once"
      - "Bypassing the LB entirely on the return path so replies flow straight to the client"
    answer: 1
    explanation: |
      Because a full proxy owns two independent connections, it can buffer slow clients, pool
      and multiplex backend connections, tune each side's TCP independently, and terminate TLS
      / do L7 work. NAT mode just rewrites packets and can't do any of that (though it more
      easily preserves the client IP).
    ref: "concepts.md#nat-mode-vs-proxy-mode"

  - id: proxies-gateways-load-balancing-049
    difficulty: intermediate
    tags: [nat-mode, client-ip]
    question: |
      One advantage of NAT (DNAT-only) mode over full-proxy mode is that:
    options:
      - "The backend often sees the client's real source IP without needing X-Forwarded-For"
      - "It can rewrite HTTP response bodies on the fly to inject or strip application content"
      - "It supports HTTP/2 multiplexing so each stream can be sent to a different backend server"
      - "It caches responses in the LB and serves later identical requests without touching a backend"
    answer: 0
    explanation: |
      In one-arm DNAT-only setups the source IP is left as the client's, so the backend sees
      the real client IP directly. A full proxy replaces the source with the LB's IP, requiring
      X-Forwarded-For to convey the client. L7 features like body rewriting/caching are the
      proxy's domain, not NAT's.
    ref: "concepts.md#nat-mode-vs-proxy-mode"

  - id: proxies-gateways-load-balancing-050
    difficulty: intermediate
    tags: [load-balancer, reverse-proxy, definitions]
    question: |
      Which statement about the relationship between load balancers and reverse proxies is
      most accurate?
    options:
      - "They are unrelated; a load balancer is always L4 and a reverse proxy always L7"
      - "A reverse proxy is simply a kind of forward proxy pointed at internal servers instead of clients"
      - "A connection-terminating load balancer is a kind of reverse proxy, but a reverse proxy need not balance across a pool"
      - "Only reverse proxies can perform backend health checks; a load balancer relies on external monitoring"
    answer: 2
    explanation: |
      A load balancer that terminates connections is effectively a reverse proxy, but not
      every reverse proxy load-balances — a single reverse proxy can front one backend purely
      for TLS termination or caching. 'Load balancer' stresses distribution; 'reverse proxy'
      stresses the intermediary role.
    ref: "concepts.md#forward-proxy-vs-reverse-proxy"

  - id: proxies-gateways-load-balancing-051
    difficulty: advanced
    tags: [scenario, l4-vs-l7, capture]
    question: |
      A capture shows the load balancer forwarding an unmodified TLS ClientHello to a backend
      and never sending any application-layer bytes of its own, yet traffic still reaches the
      correct hostname's pool. Which statement is correct?
    options:
      - "The LB is doing L4 with SNI-based routing — it read the cleartext SNI but did not decrypt the payload"
      - "The LB must be terminating TLS and decrypting the stream to read the encrypted Host header for routing"
      - "This is impossible without the client supplying an X-Forwarded-Host header the LB can key on"
      - "The LB rewrote the HTTP URL path inside the request to select the correct backend pool"
    answer: 0
    explanation: |
      Routing by hostname without any decryption or added application bytes is SNI-based L4
      routing: the LB reads the cleartext SNI in the ClientHello to pick a pool, then passes
      the encrypted stream through untouched. The Host header and path are encrypted and never
      seen.
    ref: "concepts.md#l7-load-balancing-application-layer"

  - id: proxies-gateways-load-balancing-052
    difficulty: advanced
    tags: [scenario, algorithms, least-connections]
    question: |
      A pool of identical servers uses round robin. One endpoint runs occasional 30-second
      report queries while most requests finish in 20 ms. Users report one server is
      periodically overloaded. What is the best fix?
    options:
      - "Switch to IP hash so the heavy report queries always stick to the same designated server"
      - "Enable Direct Server Return so responses bypass the LB and relieve the overloaded server"
      - "Switch to least connections (or least response time) so busy servers stop receiving new work"
      - "Turn on TLS passthrough so the LB stops decrypting and frees CPU on the busy backend"
    answer: 2
    explanation: |
      Round robin ignores load, so a server that happens to catch several long report queries
      keeps getting new fast requests too. Least connections (or least response time) routes
      new work away from servers already busy with long-running requests, smoothing the load.
    ref: "concepts.md#load-balancing-algorithms"

  - id: proxies-gateways-load-balancing-053
    difficulty: advanced
    tags: [scenario, websocket, sticky-sessions]
    question: |
      Your app uses long-lived WebSocket connections. Which statement about load balancing
      them is correct?
    options:
      - "WebSockets must be re-balanced per message, with each frame routed to a different backend"
      - "Only L4 passthrough can carry WebSockets, because an L7 proxy cannot handle the upgrade handshake"
      - "WebSockets require Direct Server Return so the long-lived downstream frames bypass the LB"
      - "A WebSocket is pinned to one backend for the connection's life, so affinity is inherent — externalizing state helps for reconnects, not for the live connection"
    answer: 3
    explanation: |
      A WebSocket is a single upgraded TCP connection bound to one backend for its lifetime, so
      it is inherently sticky — you can't move an open socket per message. Externalizing state
      helps when a client reconnects (it can land on any backend), but not for the live
      connection itself.
    ref: "concepts.md#sticky-sessions-session-affinity"

  - id: proxies-gateways-load-balancing-054
    difficulty: intermediate
    tags: [scenario, tls, re-encryption, cost]
    question: |
      Compared with plain TLS termination, TLS re-encryption (bridging) primarily costs you:
    options:
      - "Extra CPU, because the LB runs two TLS sessions (client-side and backend-side) per request path"
      - "The ability to route on URL path, since re-encryption forces the LB back down to opaque L4"
      - "The ability to preserve the client IP, because bridging overwrites it with the backend's address"
      - "Compatibility with HTTP entirely, forcing every backend behind the LB to switch to raw TCP"
    answer: 0
    explanation: |
      Re-encryption keeps L7 routing (it terminates client TLS) but adds a second TLS session
      to each backend, roughly doubling crypto work versus termination-only. The benefit is
      that the LB→backend hop stays encrypted.
    ref: "concepts.md#tls-termination-vs-passthrough-vs-re-encryption"

  - id: proxies-gateways-load-balancing-055
    difficulty: intermediate
    tags: [scenario, forward-proxy, connect]
    question: |
      A forward proxy logs `CONNECT secure.example.com:443` followed by opaque encrypted bytes
      in both directions. What can the proxy see about the HTTP request inside?
    options:
      - "The full request line, URL path, and every header, since CONNECT forces the proxy to decode the HTTP layer before it tunnels"
      - "Nothing at the HTTP layer — it is a blind tunnel; it sees only the destination host:port from CONNECT and the encrypted bytes"
      - "Only the response status line and code, which the proxy strips out of the tunnel to log per-request outcomes for auditing"
      - "The decrypted request body but not the headers, because CONNECT tunnels expose payloads while keeping request metadata sealed"
    answer: 1
    explanation: |
      With CONNECT the proxy establishes a blind TCP tunnel and relays encrypted TLS bytes; it
      only knows the target host:port requested in the CONNECT line. It cannot see paths,
      headers, or bodies without active TLS interception via a trusted CA.
    ref: "concepts.md#forward-proxy-vs-reverse-proxy"

  - id: proxies-gateways-load-balancing-056
    difficulty: beginner
    tags: [l4-vs-l7, health-checks]
    question: |
      Which pairing correctly matches the layer to the kind of health check it naturally
      performs?
    options:
      - "L4 → parses the response body and asserts an HTTP 200; L7 → merely opens a bare TCP connection and closes it"
      - "L4 → terminates and decrypts the TLS session to score health; L7 → sends an ICMP echo and waits for a ping reply"
      - "L4 → TCP connect / port open; L7 → HTTP request expecting a specific status/body"
      - "Both layers only fire periodic ICMP echo pings and infer health purely from whether a ping reply comes back"
    answer: 2
    explanation: |
      L4 health checks confirm the port accepts a TCP connection; L7 checks send an HTTP
      request and validate status/body, which more truly reflects whether the application can
      serve traffic.
    ref: "concepts.md#health-checks"

  - id: proxies-gateways-load-balancing-057
    difficulty: advanced
    tags: [consistent-hashing, modulo, cache]
    question: |
      A distributed cache uses `server = hash(key) % N` to shard keys. You add one node,
      growing the pool from 4 to 5, and the origin database is instantly overwhelmed. What
      happened?
    options:
      - "Changing the divisor N remaps roughly (N-1)/N of all keys, so ~80% of keys now resolve to a different (empty) shard, causing a mass cache miss and origin stampede"
      - "The new node advertised a duplicate VIP that blackholed cache traffic, so lookups fell straight through to the origin database"
      - "Adding the node rotated the shared TLS session tickets, invalidating every cached session and forcing full re-fetches from origin"
      - "Round robin funneled all new lookups onto the freshly added node during its slow-start window, which then stampeded the origin"
    answer: 0
    explanation: |
      With modulo hashing, every key's mapping depends on N. Going 4→5 changes the result for
      about (N-1)/N ≈ 80% of keys, so most lookups miss their old shard and fall through to the
      origin at once. Consistent/Maglev hashing bounds the remap to ~K/N keys precisely to
      avoid this.
    ref: "concepts.md#consistent-hashing-done-right-ring-and-virtual-nodes"

  - id: proxies-gateways-load-balancing-058
    difficulty: advanced
    tags: [consistent-hashing, virtual-nodes]
    question: |
      Why do consistent-hashing rings place each physical backend at MANY points (virtual
      nodes) rather than a single point?
    options:
      - "To cryptographically sign and encrypt each ring position so a malicious backend cannot forge a placement and hijack another node's keys"
      - "Because a single point per backend gives uneven arc sizes (load skew) and cannot express weights; many small arcs smooth load and let weight be tuned by vnode count"
      - "To guarantee that exactly zero keys ever move whenever the pool grows or shrinks, giving a perfectly stable mapping under membership change"
      - "Because the hash ring is mathematically required to hold exactly 2^32 distinct backends before any lookups can resolve correctly"
    answer: 1
    explanation: |
      One point per node yields arcs of wildly different sizes, so load is skewed and you can't
      express heterogeneous capacity. Hashing each node to many points averages many small arcs
      toward even load, and assigning a bigger box more virtual nodes expresses its weight. The
      cost is more ring memory and lookup work.
    ref: "concepts.md#consistent-hashing-done-right-ring-and-virtual-nodes"

  - id: proxies-gateways-load-balancing-059
    difficulty: expert
    tags: [maglev, hashing, l4]
    question: |
      Maglev hashing is preferred over a literal hash ring for per-packet L4 load balancing at
      line rate primarily because it:
    options:
      - "Mirrors each packet to every backend in the pool for redundancy, letting the fastest replica win the race per packet"
      - "Eliminates any hashing of the connection 4-tuple, indexing packets by arrival order into a rotating slot instead"
      - "Precomputes a fixed-size lookup table giving O(1) per-packet lookup with near-perfect even balance and minimal disruption on membership change"
      - "Decrypts and parses the TLS SNI extension far faster than a ring walk can, then routes on the recovered hostname"
    answer: 2
    explanation: |
      Maglev builds a prime-size lookup table from per-backend permutations, so each packet is a
      single O(1) table index rather than a ring walk. It achieves near-perfect balance and only
      minimal reshuffling when membership changes — exactly the properties a per-packet L4
      forwarder needs.
    ref: "concepts.md#maglev-and-rendezvous-hashing"

  - id: proxies-gateways-load-balancing-060
    difficulty: expert
    tags: [rendezvous, hrw, hashing]
    question: |
      In rendezvous (Highest-Random-Weight) hashing, how is a key assigned to a node, and what
      is the main cost?
    options:
      - "The key is hashed modulo N to pick a node directly; the cost is that nearly all keys remap whenever the node count changes on resize"
      - "The key walks clockwise around a hash ring to the next node position; the cost is maintaining virtual-node bookkeeping for even arcs"
      - "The key is broadcast to every node and stored on all of them; the cost is the duplicated storage and fan-out write amplification"
      - "For the key, compute hash(key, node) for every node and pick the maximum; cost is O(N) work per lookup"
    answer: 3
    explanation: |
      HRW scores every node for the key with hash(key, node) and selects the highest. Removing a
      node only reshuffles the keys that scored highest on it, so disruption is minimal and there
      is no ring/vnode state — but you must score all N nodes per lookup, making it O(N).
    ref: "concepts.md#maglev-and-rendezvous-hashing"

  - id: proxies-gateways-load-balancing-061
    difficulty: advanced
    tags: [draining, deregistration, deploy]
    question: |
      During a zero-downtime backend removal, what does a 'deregistration delay' / drain timeout
      accomplish?
    options:
      - "It lets in-flight connections finish while no new connections are sent, before the backend is force-closed"
      - "It postpones the backend's health checks during shutdown so the node keeps appearing healthy and stays in rotation longer"
      - "It rewrites the client's source IP to the load balancer's address for the duration of the shutdown sequence"
      - "It renegotiates every live connection down to HTTP/1.1 so the backend can close them one request at a time"
    answer: 0
    explanation: |
      Draining stops routing new work to the backend but allows existing in-flight requests to
      complete up to the drain timeout, after which remaining connections are closed. This is how
      you deploy/scale-in without resetting live requests.
    ref: "concepts.md#connection-draining-and-graceful-backend-removal"

  - id: proxies-gateways-load-balancing-062
    difficulty: expert
    tags: [http2, goaway, draining]
    question: |
      An L7 proxy needs to gracefully move clients off a backend that holds long-lived HTTP/2
      connections. The cleanest wire mechanism is to:
    options:
      - "Send an immediate TCP RST on each connection so the client is forced to reconnect and land on a live backend right away"
      - "Send an HTTP/2 GOAWAY frame (RFC 9113 §6.8) so peers finish streams below the last-stream-ID and open a new connection for the rest"
      - "Return an HTTP 429 Too Many Requests on every open stream so clients back off and rebuild their connections elsewhere"
      - "Lower the TCP receive window to zero so the client stalls and eventually times out into opening a fresh connection"
    answer: 1
    explanation: |
      GOAWAY tells the peer the highest stream ID that will be processed; streams above it are not
      served and the client establishes a fresh connection (landing on a live backend). An RST
      would abort in-flight streams; GOAWAY drains them gracefully.
    ref: "concepts.md#connection-draining-and-graceful-backend-removal"

  - id: proxies-gateways-load-balancing-063
    difficulty: advanced
    tags: [lame-duck, draining, health-checks]
    question: |
      What is 'lame-duck' mode when retiring a backend?
    options:
      - "The backend refuses all new TLS handshakes but keeps serving existing clients over plaintext HTTP until they naturally disconnect"
      - "The backend deliberately starts failing its health check (or reports not-ready) so the LB bleeds traffic off it before the process actually stops"
      - "The LB mirrors the retiring backend's live traffic to a standby node so it can take over instantly once the primary is killed"
      - "The backend downgrades itself from L7 to L4 forwarding so it can shed the CPU cost of parsing HTTP while draining"
    answer: 1
    explanation: |
      In lame-duck mode the shutting-down backend intentionally fails readiness/health checks so
      the LB stops routing to it and existing work drains, converting an abrupt kill into a
      graceful removal. It ties into readiness gates.
    ref: "concepts.md#connection-draining-and-graceful-backend-removal"

  - id: proxies-gateways-load-balancing-064
    difficulty: expert
    tags: [grpc, http2, connection-pinning, scenario]
    question: |
      You scale a gRPC service from 3 to 13 pods, but the original 3 pods stay pinned at 100%
      CPU while the 10 new pods sit idle. What is the root cause?
    options:
      - "All ten new pods silently failed their readiness health checks and were ejected from the pool, so only the original three ever receive traffic"
      - "gRPC runs over UDP datagrams rather than TCP, so a connection-oriented load balancer cannot spread its calls across pods at all"
      - "Clients hold long-lived multiplexed HTTP/2 connections pinned to the original backends, so per-connection balancing never routes new requests to the new pods"
      - "The load balancer silently switched to IP-hash affinity when the pool grew, pinning each client to its original backend by source address"
    answer: 2
    explanation: |
      HTTP/2 multiplexes all of a client's requests onto one persistent connection. A connection-
      level (L4 or connect-time L7) LB pins that connection to a backend, so existing clients
      never reach the new pods. Fixes: L7 per-request balancing, client-side/lookaside (xDS) LB,
      or max-connection-age + GOAWAY to force rebalancing.
    ref: "concepts.md#load-balancing-http2-and-grpc-long-lived-connections"

  - id: proxies-gateways-load-balancing-065
    difficulty: expert
    tags: [grpc, lookaside, xds]
    question: |
      In lookaside (one-arm) gRPC load balancing (e.g. gRPC-LB / xDS), how does the request path
      work?
    options:
      - "Every request is proxied inline through the control plane, which terminates the call and then forwards it on to a chosen backend"
      - "The client queries a control plane for the current endpoint set, then connects directly to backends, keeping the control plane off the data path"
      - "The control plane sits inline and rewrites the client's source IP to a backend address on a per-request basis before forwarding"
      - "Backends continuously poll the control plane and pull pending client requests off a shared work queue when they are free"
    answer: 1
    explanation: |
      Lookaside balancing separates the control plane (which hands clients the endpoint list and
      policy) from the data plane (client connects straight to the chosen backend). This keeps
      per-request latency low while centralizing membership decisions — unlike a proxy that sits
      inline on every request.
    ref: "concepts.md#load-balancing-http2-and-grpc-long-lived-connections"

  - id: proxies-gateways-load-balancing-066
    difficulty: advanced
    tags: [max-connection-age, http2, rebalancing]
    question: |
      Even behind a dumb L4 LB, setting a server-side 'max-connection-age' on an HTTP/2 service
      helps rebalancing because:
    options:
      - "It shrinks the negotiated TLS record size so more distinct connections fit through the balancer and get spread across the pool"
      - "It periodically sends GOAWAY and closes aged connections, forcing clients to reconnect and land on (possibly newer) backends"
      - "It disables HTTP/2 multiplexing so each individual request opens its own connection that the L4 balancer can place independently"
      - "It transparently switches the connection down to HTTP/1.1 once the age limit is hit so the balancer can pin it afresh"
    answer: 1
    explanation: |
      Long-lived HTTP/2 connections stay pinned indefinitely under an L4 LB. Bounding connection
      age makes the server emit GOAWAY and recycle the connection, so clients reconnect and the
      L4 LB gets a fresh chance to spread them across the current (including newly added) pool.
    ref: "concepts.md#load-balancing-http2-and-grpc-long-lived-connections"

  - id: proxies-gateways-load-balancing-067
    difficulty: advanced
    tags: [transparent-proxy, tproxy, client-ip]
    question: |
      A transparent (intercepting) proxy differs from an ordinary reverse proxy chiefly in that:
    options:
      - "It requires the client to name it explicitly in browser or OS proxy settings before any traffic will flow through it"
      - "It is restricted to forwarding connectionless UDP datagrams and cannot intercept ordinary TCP flows at all"
      - "The network redirects traffic into it with no client configuration, and with TPROXY/IP_TRANSPARENT it can originate backend connections spoofing the client's real source IP"
      - "It always terminates TLS by presenting the client's own certificate back to the origin server during the handshake"
    answer: 2
    explanation: |
      A transparent proxy is spliced in by routing/WCCP/iptables/eBPF with no client config. Using
      TPROXY / IP_TRANSPARENT it can preserve the client's source IP toward the backend by
      spoofing it — something a normal terminating proxy cannot do (it would use its own IP).
    ref: "concepts.md#transparent-intercepting-proxies"

  - id: proxies-gateways-load-balancing-068
    difficulty: intermediate
    tags: [transparent-proxy, service-mesh, sidecar]
    question: |
      How does a service-mesh sidecar typically capture a pod's outbound traffic without the
      application being reconfigured?
    options:
      - "The application must be recompiled and re-linked against the mesh's client SDK so its socket calls route through the sidecar"
      - "The mesh installs iptables/eBPF rules that transparently redirect the pod's traffic into the local sidecar proxy"
      - "The pod's DNS resolver is disabled so every name lookup fails over to the sidecar, which then handles all outbound traffic"
      - "The kernel is reconfigured to route the pod's entire traffic to a central cluster-wide gateway that fans it back to the sidecar"
    answer: 1
    explanation: |
      Meshes use transparent interception: iptables or eBPF rules on the pod redirect outbound
      (and inbound) connections into the co-located sidecar, so the unmodified app's traffic is
      proxied without any client-side configuration.
    ref: "concepts.md#transparent-intercepting-proxies"

  - id: proxies-gateways-load-balancing-069
    difficulty: expert
    tags: [proxy-protocol, client-ip, l4]
    question: |
      Why is the PROXY protocol needed to convey the client IP through an L4 proxy, when
      X-Forwarded-For already exists?
    options:
      - "X-Forwarded-For is always encrypted inside the TLS record, so the backend can never read it and needs PROXY protocol instead"
      - "At L4 there is no HTTP layer to carry XFF, so PROXY protocol prepends the real client/dest addresses as a header before the application bytes"
      - "PROXY protocol compresses the client IP address into a compact binary form that XFF's textual header cannot represent"
      - "X-Forwarded-For can only carry IPv6 addresses, so PROXY protocol is required whenever the real client connects over IPv4"
    answer: 1
    explanation: |
      XFF is an HTTP header and requires the proxy to parse/inject HTTP — an L7 activity. An L4
      proxy forwards opaque bytes and can't add HTTP headers, so PROXY protocol prepends a small
      out-of-band header (before the app stream) carrying the true source/destination addresses.
    ref: "concepts.md#proxy-protocol-v1-and-v2"

  - id: proxies-gateways-load-balancing-070
    difficulty: expert
    tags: [proxy-protocol, security]
    question: |
      What is the critical security requirement when a backend is configured to expect the PROXY
      protocol?
    options:
      - "It must accept the PROXY header from any sender whatsoever, since rejecting unknown senders would break interoperability across proxies"
      - "It must accept the header only from a trusted set of upstream proxies and reject connections that lack it; otherwise any client can forge its source IP"
      - "It must silently strip the PROXY header off every connection and ignore its contents, relying on the L4 peer address instead"
      - "It must re-encrypt the PROXY header under the connection's TLS session key before the addresses inside it can be trusted"
    answer: 1
    explanation: |
      If a backend trusts a PROXY header from arbitrary senders, a client can prepend a forged
      line and spoof its source IP — the same trust problem as XFF. The receiver must allowlist
      trusted senders and, when expecting the header, reject connections that omit it.
    ref: "concepts.md#proxy-protocol-v1-and-v2"

  - id: proxies-gateways-load-balancing-071
    difficulty: intermediate
    tags: [proxy-protocol, v1-v2, wire-format]
    question: |
      Which correctly describes the PROXY protocol v1 vs v2 wire formats?
    options:
      - "v1 is a human-readable ASCII line (e.g. `PROXY TCP4 <src> <dst> <sport> <dport>`); v2 is binary starting with a fixed 12-byte signature and supports TLV extensions"
      - "v1 is a compact binary header with a fixed signature, while v2 replaced it with a readable ASCII line for easier debugging"
      - "Both v1 and v2 are JSON documents carrying the address fields as named keys the backend parses before the request"
      - "v2 drops the source and destination address fields entirely to save bandwidth, keeping only a version and command byte"
    answer: 0
    explanation: |
      v1 is a textual line ending in CRLF listing family, source/dest IPs and ports; v2 is a
      compact binary header beginning with a 12-byte signature, followed by version/command and
      family bytes, addresses, and optional TLVs (ALPN, SNI, TLS info, cloud VPCE IDs).
    ref: "concepts.md#proxy-protocol-v1-and-v2"

  - id: proxies-gateways-load-balancing-072
    difficulty: expert
    tags: [outlier-detection, panic-threshold, scenario]
    question: |
      During an incident, ~60% of your backends start failing health checks and, surprisingly,
      overall latency gets WORSE, not better. The LB defaults to a 50% panic threshold. What is
      it doing?
    options:
      - "It ejected the 60% of failing hosts and is now queueing all incoming requests behind the surviving healthy 40%, inflating wait time"
      - "The healthy fraction fell below the panic threshold, so the LB ignores health status and load-balances across ALL hosts, including ones marked unhealthy"
      - "It automatically switched the pool to Direct Server Return so responses bypass the balancer and shed the load driving the latency up"
      - "It disabled all request retries the moment the incident began, so backend failures now surface to clients immediately as raw errors"
    answer: 1
    explanation: |
      When the healthy fraction drops below the panic threshold (Envoy default 50%), the LB
      assumes its health view is unreliable (likely correlated failure) and stops honoring health
      status, spreading traffic across every host. That's usually safer than hammering a tiny
      'healthy' subset, but it means unhealthy hosts receive traffic — which can look like worse
      latency.
    ref: "concepts.md#outlier-detection-and-the-panic-threshold"

  - id: proxies-gateways-load-balancing-073
    difficulty: advanced
    tags: [outlier-detection, max-ejection-percent]
    question: |
      What does the 'max-ejection-percent' parameter in outlier detection protect against?
    options:
      - "Ejecting so many backends that the pool is decimated, leaving too few hosts to serve traffic"
      - "Clients spoofing the X-Forwarded-For header to bypass the edge per-IP rate limiter"
      - "TLS renegotiation attacks that exhaust backend CPU during repeated handshakes"
      - "Round robin overloading a single node by ignoring its active-connection count"
    answer: 0
    explanation: |
      max-ejection-percent caps the fraction of the pool that outlier detection may eject at once.
      Without it, a correlated failure signal (or a bad dependency) could eject nearly every
      host, removing capacity exactly when it's needed. It bounds the blast radius of ejection.
    ref: "concepts.md#outlier-detection-and-the-panic-threshold"

  - id: proxies-gateways-load-balancing-074
    difficulty: expert
    tags: [outlier-detection, success-rate]
    question: |
      Which ejection mode distinguishes 'statistical/success-rate' outlier detection from
      simple consecutive-5xx ejection?
    options:
      - "It ejects a host only after a fixed number of back-to-back 5xx responses on that same host"
      - "It ejects a host whose success rate is a set number of standard deviations below the pool mean, catching a host that is merely worse than its peers rather than fully broken"
      - "It ejects on any single request timeout, immediately removing the host after one slow response"
      - "It only ejects hosts that fail the load balancer's scheduled active health probes, ignoring live traffic"
    answer: 1
    explanation: |
      Success-rate ejection compares each host against the population: a host statistically worse
      than the fleet mean (below a standard-deviation threshold) is ejected even without a run of
      consecutive hard failures. Consecutive-5xx only reacts to back-to-back errors on one host.
    ref: "concepts.md#outlier-detection-and-the-panic-threshold"

  - id: proxies-gateways-load-balancing-075
    difficulty: advanced
    tags: [slow-start, scenario]
    question: |
      A just-restarted backend with least-connections balancing immediately gets flooded because
      it shows zero active connections, then times out and flaps. Which feature addresses this?
    options:
      - "Sticky sessions by cookie, pinning each client to the backend it first landed on"
      - "TLS passthrough, forwarding encrypted bytes so the backend does its own crypto"
      - "Slow start — ramping the new backend's traffic share up gradually over a warm-up window instead of giving it full share instantly"
      - "Direct Server Return, letting replies bypass the balancer straight to the client"
    answer: 2
    explanation: |
      A cold backend has empty caches/pools and un-JITed code; with least-connections its zero
      connection count makes it look most attractive, so it gets slammed and flaps. Slow start
      ramps its weight up over a window so it warms under partial load before taking full share.
    ref: "concepts.md#slow-start-for-new-backends"

  - id: proxies-gateways-load-balancing-076
    difficulty: expert
    tags: [quic, http3, connection-migration, scenario]
    question: |
      A client downloading over HTTP/3 roams from Wi-Fi to LTE mid-transfer (its IP and port
      change) but the download continues uninterrupted. For an L4 LB fronting the QUIC servers,
      what must it route on?
    options:
      - "The 4-tuple, which QUIC pins for the connection's life so it stays constant across the roam"
      - "The TLS SNI, which QUIC re-sends in the header of every packet for the LB to read"
      - "The QUIC Destination Connection ID (not the 4-tuple), since connection migration changes the client's IP/port but keeps the same Connection ID"
      - "The source MAC address, which the client re-advertises to the LB after each network change"
    answer: 2
    explanation: |
      QUIC connection migration (RFC 9000 §9) lets the client change IP/port while keeping the
      connection alive, so the 4-tuple is not a stable key. QUIC identifies connections by
      Connection IDs; the LB must route on the Destination Connection ID (per QUIC-LB, with a
      routing prefix encoded into the CID) to keep a migrating client on the same backend.
    ref: "concepts.md#load-balancing-quic-and-http3"

  - id: proxies-gateways-load-balancing-077
    difficulty: expert
    tags: [quic-lb, connection-id, ecmp]
    question: |
      The QUIC-LB draft has the server encode a routing prefix into the Connection ID it issues.
      Why is that useful for a stateless L4 LB fleet?
    options:
      - "It lets any LB node derive the correct backend from the CID without shared connection-tracking state, so an ECMP re-pin to a different LB node still resolves the same backend"
      - "It encrypts the QUIC payload with the routing key so the LB can decrypt and read it"
      - "It removes the need for UDP by letting QUIC run its streams directly over raw IP"
      - "It forces every packet of a connection onto one physical link, disabling ECMP spreading"
    answer: 0
    explanation: |
      Encoding a backend-routing prefix into the CID means every LB node can independently map a
      packet to its backend just by reading the CID — no synchronized flow table. So even if ECMP
      shifts a flow to a different LB node, that node still routes it to the same backend, which
      is the stateless analog of connection tracking.
    ref: "concepts.md#load-balancing-quic-and-http3"

  - id: proxies-gateways-load-balancing-078
    difficulty: expert
    tags: [ech, sni, tls, scenario]
    question: |
      You do TLS passthrough and route by SNI. After a browser update, a fraction of clients can
      no longer be routed to the correct backend pool. What most likely changed?
    options:
      - "Those clients switched to HTTP/1.0, which omits the SNI extension from its handshake"
      - "The clients enabled Encrypted Client Hello (ECH), which encrypts the inner ClientHello including server_name, so the LB now sees only the outer/public name and can't route on the real SNI"
      - "The LB's wildcard certificate expired, so it silently stopped matching those hostnames"
      - "The clients started using IPv6, whose ClientHello moves the SNI field out of the LB's view"
    answer: 1
    explanation: |
      ECH (a TLS 1.3 extension) encrypts the inner ClientHello, hiding server_name from anyone who
      can't decrypt it. A passthrough LB then sees only the outer public name and loses the SNI it
      relied on for routing — so ECH-enabled clients can't be steered to the right pool without
      terminating TLS at a node that holds the ECH keys.
    ref: "concepts.md#encrypted-client-hello-ech-and-sni-routing"

  - id: proxies-gateways-load-balancing-079
    difficulty: expert
    tags: [request-smuggling, cl-te, security]
    question: |
      In a CL.TE request-smuggling attack, the desync arises because:
    options:
      - "The client opens two separate TCP connections that the front-end LB splices into one stream"
      - "The request includes both Content-Length and Transfer-Encoding, and the front-end uses one to delimit the body while the back-end uses the other, so their request boundaries disagree"
      - "The TLS record is fragmented across packets, so the back-end reassembles the body incorrectly"
      - "The HTTP/2 stream ID counter overflows, causing the proxy to reassign the request to a new stream"
    answer: 1
    explanation: |
      CL.TE means the front-end honors Content-Length while the back-end honors Transfer-Encoding
      (chunked). Because they parse the body length differently, part of the attacker's payload is
      treated as the start of the next request on the back-end — smuggling. RFC 9112 §6.3 says
      Transfer-Encoding overrides Content-Length and such messages ought to be handled as an error.
    ref: "concepts.md#http-request-smuggling"

  - id: proxies-gateways-load-balancing-080
    difficulty: expert
    tags: [request-smuggling, cache-poisoning, scenario]
    question: |
      After putting a caching reverse proxy in front of your app, users occasionally receive
      other users' authenticated pages. Which class of bug most directly explains this?
    options:
      - "TLS session resumption landing on the wrong backend, which then replays another user's cached page"
      - "Request smuggling / cache poisoning — a desync (e.g. CL.TE or an HTTP/2→1.1 downgrade) lets a smuggled request's response be cached and served to other users, compounded by a bad cache key"
      - "Round robin sending requests to the wrong pool, so one user's session data leaks to the next"
      - "Slow start ramping a cold backend, which serves half-warmed responses containing stale user data"
    answer: 1
    explanation: |
      When a smuggled request's response gets stored in the shared cache under a normal key, later
      users are served that poisoned entry — including someone else's authenticated content. The
      caching layer amplifies a front/back-end framing desync into cross-user data exposure.
    ref: "concepts.md#http-request-smuggling"

  - id: proxies-gateways-load-balancing-081
    difficulty: expert
    tags: [request-smuggling, http2-downgrade, mitigation]
    question: |
      Which mitigation most fundamentally eliminates HTTP/2-downgrade (H2.CL / H2.TE) smuggling?
    options:
      - "Increasing the LB's idle timeout so the downgraded request fully arrives before parsing"
      - "Speaking HTTP/2 end-to-end so there is no HTTP/2→HTTP/1.1 downgrade to mis-serialize length/chunking"
      - "Enabling sticky sessions so the smuggled request stays pinned to its originating backend"
      - "Switching to least-connections balancing so no single backend accumulates smuggled requests"
    answer: 1
    explanation: |
      H2.CL/H2.TE arise when the front-end downgrades HTTP/2 to HTTP/1.1 and mis-serializes the
      body framing. Keeping HTTP/2 to the backend removes the downgrade step (HTTP/2 has explicit,
      length-prefixed framing without CL/TE ambiguity), eliminating that smuggling vector.
    ref: "concepts.md#http-request-smuggling"

  - id: proxies-gateways-load-balancing-082
    difficulty: expert
    tags: [ecmp, consistent-hashing, connection-tracking, scenario]
    question: |
      You run a fleet of stateless L4 LB nodes behind ECMP, all advertising the same VIP. A node
      dies, ECMP re-pins some existing flows to a different LB node, and those connections reset.
      What design prevents the resets?
    options:
      - "Give each LB node a unique VIP so ECMP never re-pins a flow to a different advertising node"
      - "Have every LB node independently pick the SAME backend for a given flow using Maglev/consistent hashing (plus connection tracking), so a re-pinned flow still reaches its original backend"
      - "Disable ECMP and route every flow through one LB node so no re-pinning can ever occur"
      - "Terminate TLS on the LB so its session cache adds stickiness that survives the node failover"
    answer: 1
    explanation: |
      ECMP can move a live flow to a different LB node when membership changes. If each node
      independently maps the flow to the same backend (via Maglev/consistent hashing, backed by
      connection tracking for correctness), the re-pinned packets still reach the original
      backend and the connection survives. This is why consistent hashing matters at the LB tier.
    ref: "concepts.md#ecmp-and-anycast-for-scaling-l4-fleets"

  - id: proxies-gateways-load-balancing-083
    difficulty: advanced
    tags: [anycast, vip, ddos]
    question: |
      Advertising the same VIP via BGP from many geographic sites (anycast) primarily provides:
    options:
      - "Guaranteed in-order packet delivery across all sites advertising the shared VIP"
      - "Automatic TLS termination at whichever site the BGP fabric selects for the client"
      - "Routing clients to the nearest site for lower latency and spreading/absorbing DDoS across sites"
      - "Per-request L7 routing without a proxy, keyed on the URL path of each inbound request"
    answer: 2
    explanation: |
      Anycast lets the routing fabric steer each client to the topologically nearest site
      advertising the VIP, cutting latency and dispersing volumetric attacks across many
      points-of-presence. It operates at the routing layer, independent of L7 features or TLS.
    ref: "concepts.md#ecmp-and-anycast-for-scaling-l4-fleets"

  - id: proxies-gateways-load-balancing-084
    difficulty: advanced
    tags: [buffering, slowloris, streaming, scenario]
    question: |
      A proxy fully buffers each client request before forwarding it to the backend. This
      defends against Slowloris, but users report that a Server-Sent Events (SSE) endpoint and
      large streaming uploads no longer work in real time. What is the correct fix?
    options:
      - "Increase the connect timeout so the proxy waits longer before finishing the buffer"
      - "Enable streaming/pass-through mode for those routes so bytes flow as they arrive, while keeping request buffering for ordinary endpoints"
      - "Switch those routes to L4 passthrough only, giving up all L7 routing and WAF on them"
      - "Disable health checks on the streaming backend so buffering no longer stalls its probes"
    answer: 1
    explanation: |
      Request buffering absorbs slow/trickle clients (Slowloris defense) but delays streaming
      because it withholds bytes until the message is complete. SSE, gRPC streaming, and large
      uploads/downloads need pass-through/streaming so data flows incrementally — typically
      configured per-route rather than globally.
    ref: "concepts.md#timeouts-buffering-and-streaming"

  - id: proxies-gateways-load-balancing-085
    difficulty: advanced
    tags: [timeouts, idle-timeout, scenario]
    question: |
      Clients intermittently see 'connection reset' on reused keep-alive connections through a
      proxy. The proxy's idle timeout is 60 s; the backend's is 5 s. What is happening?
    options:
      - "The backend closes the idle connection at 5 s while the proxy still considers it usable and sends a request onto the half-closed connection, racing into a reset"
      - "The proxy is buffering responses too aggressively, overflowing its pool and dropping the reused connection"
      - "TLS re-encryption doubled the crypto load, timing out the handshake on the reused keep-alive connection"
      - "Round robin chose a backend that was already drained from rotation, so the reused connection had no live peer"
    answer: 0
    explanation: |
      When the backend's idle timeout is shorter than the proxy's, the backend closes the pooled
      connection first; the proxy, unaware, dispatches a new request onto a connection the backend
      is tearing down, producing a reset. The fix is to make the proxy's idle timeout shorter than
      the backend's (and/or retry idempotent requests).
    ref: "concepts.md#timeouts-buffering-and-streaming"

  - id: proxies-gateways-load-balancing-086
    difficulty: expert
    tags: [retries, idempotency, scenario]
    question: |
      A proxy is configured to auto-retry any request that times out. After a latency blip,
      customers report being double-charged. What went wrong?
    options:
      - "Retries should never be used on any request, so enabling them at all caused the duplicate charges"
      - "The proxy retried non-idempotent POST requests; a timed-out payment that actually succeeded got resent, so the charge happened twice"
      - "The retries used the wrong load-balancing algorithm, sending each retry to a second charging backend"
      - "TLS termination corrupted the request body, so the backend re-parsed and re-applied the payment"
    answer: 1
    explanation: |
      A timeout doesn't mean the request failed — the backend may have processed it and the
      response was just slow. Retrying a non-idempotent POST (a payment) re-executes the side
      effect. Only safe/idempotent methods, or requests with an idempotency key, should be
      auto-retried.
    ref: "concepts.md#retries-hedging-and-idempotency-at-the-proxy"

  - id: proxies-gateways-load-balancing-087
    difficulty: expert
    tags: [retries, retry-storm, retry-budget]
    question: |
      A multi-tier system where every layer retries 3× melts down under partial failure. Which
      pair of techniques best contains the retry amplification?
    options:
      - "Longer timeouts and larger connection pools so each tier absorbs the retries instead of failing"
      - "Sticky sessions and IP hashing so retries from one client always reuse the same failing backend"
      - "Retry budgets (cap retries to a small fraction of requests) and circuit breaking (stop sending to a failing dependency for a cooldown)"
      - "Direct Server Return and anycast so retried responses bypass the overloaded balancer tier"
    answer: 2
    explanation: |
      Naive per-layer retries multiply (3×3×3 = 27× load) precisely during failure. A retry budget
      caps retries as a percentage of traffic so they can't explode, and a circuit breaker stops
      hammering a downstream that is already failing, letting it recover. Together they bound the
      amplification.
    ref: "concepts.md#retries-hedging-and-idempotency-at-the-proxy"

  - id: proxies-gateways-load-balancing-088
    difficulty: advanced
    tags: [hedging, tail-latency]
    question: |
      Request hedging reduces tail latency by:
    options:
      - "Caching every response for reuse so slow tail requests are served from the proxy's store"
      - "Sending a duplicate of an idempotent request to another backend after a latency threshold (e.g. p95) and taking whichever response returns first"
      - "Compressing the request before sending so the slowest backends spend less time parsing it"
      - "Pinning every request to the single fastest-measured backend permanently to avoid slow hosts"
    answer: 1
    explanation: |
      Hedging fires a second copy of an idempotent request to a different backend once the first
      exceeds a latency threshold, then uses the first response to arrive — trading extra load for
      lower tail latency. It must be bounded by a hedge budget or it becomes a self-inflicted
      retry storm.
    ref: "concepts.md#retries-hedging-and-idempotency-at-the-proxy"

  - id: proxies-gateways-load-balancing-089
    difficulty: expert
    tags: [service-mesh, mtls, spiffe]
    question: |
      In a service mesh, how do two services authenticate each other for east-west mTLS?
    options:
      - "By comparing each peer's source IP address against a per-service allowlist maintained on every node"
      - "By a shared static API key passed in a header that both services embed at deploy time"
      - "By cryptographic identity — a SPIFFE ID carried in an SVID (X.509 or JWT) presented during the mTLS handshake — rather than by IP"
      - "By reusing the edge gateway's JWT validation, which stamps north-south tokens onto east-west calls"
    answer: 2
    explanation: |
      Mesh east-west security binds identity to a SPIFFE ID encoded in an SVID (X.509 cert or
      JWT), verified in the mTLS handshake, so services trust cryptographic identity, not spoofable
      IPs. That complements the gateway's north-south auth (API keys/JWT/OAuth) at the edge.
    ref: "concepts.md#service-mesh-xds-and-the-gateway-boundary"

  - id: proxies-gateways-load-balancing-090
    difficulty: advanced
    tags: [xds, control-plane, service-mesh]
    question: |
      The xDS API family (LDS/RDS/CDS/EDS) used by modern proxies and meshes serves what role?
    options:
      - "It is a wire encryption protocol that replaces TLS on the proxy-to-backend hop"
      - "It is a control-plane API that streams listener, route, cluster, and endpoint configuration to data-plane proxies"
      - "It is a load-balancing algorithm, similar to least-connections, that the proxy runs per request"
      - "It is a standardized health-check probe format that data-plane proxies emit to backends"
    answer: 1
    explanation: |
      xDS is the discovery/config plane: LDS (listeners), RDS (routes), CDS (clusters), and EDS
      (endpoints) push dynamic configuration to data-plane proxies. It embodies the control-plane
      / data-plane split — the same idea behind lookaside gRPC balancing.
    ref: "concepts.md#service-mesh-xds-and-the-gateway-boundary"

  - id: proxies-gateways-load-balancing-091
    difficulty: advanced
    tags: [ambient-mesh, sidecarless, service-mesh]
    question: |
      The 2024-25 'ambient' / sidecarless service-mesh model restructures the data plane by:
    options:
      - "Moving all proxying into the kernel via eBPF with no user-space component, so every packet is handled entirely inside kernel space"
      - "Splitting work into a per-node L4 layer plus a shared L7 'waypoint' proxy, instead of a full per-pod sidecar, to cut the sidecar's memory/latency tax"
      - "Eliminating mTLS between workloads entirely and relying on network-level firewall rules instead, so no per-connection encryption overhead remains"
      - "Requiring every application to embed the mesh's client library and recompile against it so proxying happens in-process without a separate agent"
    answer: 1
    explanation: |
      Ambient mesh removes the per-pod sidecar, handling secure L4 transport at a per-node layer
      and doing L7 policy in a shared waypoint proxy only when needed. This reduces the resource
      and latency overhead of running a sidecar next to every workload while keeping mTLS/policy.
    ref: "concepts.md#service-mesh-xds-and-the-gateway-boundary"

  - id: proxies-gateways-load-balancing-092
    difficulty: advanced
    tags: [xff, trusted-hop, security]
    question: |
      Your edge appends to X-Forwarded-For and you have two trusted reverse proxies in the chain.
      What is the correct way to extract the real client IP for a per-IP rate limiter?
    options:
      - "Always take the leftmost XFF value, since the first proxy in the chain writes the genuine client address there before anything else touches it"
      - "Walk the XFF list from the right, skipping addresses that are your known trusted-proxy CIDRs; the first untrusted address is the real client"
      - "Take the rightmost XFF value, which is always the client because the last proxy to append overwrites earlier spoofed entries"
      - "Average the numeric octets of all the IPs in the list to derive a single canonical client address the limiter can key on"
    answer: 1
    explanation: |
      The leftmost value is client-supplied and spoofable. Because each trusted proxy appends the
      peer it received from, you walk right-to-left over your own trusted hops and stop at the
      first address you did not add — that is the genuine client. The edge must also overwrite (not
      merely append to) any client-supplied XFF.
    ref: "concepts.md#x-forwarded-for-and-the-forwarded-header"

  - id: proxies-gateways-load-balancing-093
    difficulty: expert
    tags: [dsr, tunnel, mtu, scenario]
    question: |
      You deploy DSR across subnets using IPIP/GRE tunneling and start seeing large downloads
      fail or stall while small requests work. The most likely cause is:
    options:
      - "The loopback VIP has ARP enabled, so backends answer ARP for the VIP and the switch floods large download flows to the wrong port"
      - "Encapsulation overhead reduced the effective MTU/MSS, so full-size packets exceed the path MTU and are dropped when DF is set (a PMTUD black hole)"
      - "Round robin is sending the larger download requests to a dead node while the small requests happen to hash onto the surviving healthy backends"
      - "TLS termination is failing on the LB for the larger payloads because their handshake records exceed the balancer's configured buffer size"
    answer: 1
    explanation: |
      IPIP/GRE add header bytes, shrinking the usable MTU. If the backend doesn't lower its
      advertised MSS and PMTUD is broken (ICMP filtered), full-size data packets get dropped —
      small requests succeed but bulk transfers stall. L2/MAC-rewrite DSR avoids the encapsulation
      overhead but requires L2 adjacency.
    ref: "concepts.md#direct-server-return-dsr"

  - id: proxies-gateways-load-balancing-094
    difficulty: expert
    tags: [sticky-sessions, tls-resumption, passthrough, scenario]
    question: |
      With TLS passthrough and imperfect affinity, some clients experience full TLS handshakes
      instead of fast resumptions. Why does affinity interact with TLS session resumption here?
    options:
      - "Resumption requires the LB to decrypt the session and cache the negotiated master secret, so imperfect affinity leaves it without the keys to short-circuit the handshake"
      - "TLS session-ID/session-ticket resumption only succeeds if the client lands on a backend that holds (or can validate) that session; if affinity sends it elsewhere, the backend can't resume and forces a full handshake"
      - "Passthrough disables resumption entirely by spec, so every request over a passthrough listener is required to perform a fresh full handshake regardless of affinity"
      - "Session tickets are stored only on the LB rather than the backend, so whenever affinity routes a client to a new backend the ticket is unreachable and must be reissued"
    answer: 1
    explanation: |
      In passthrough, each backend terminates TLS itself. Session-ID resumption relies on the same
      backend's cache, and session tickets must be decryptable by whichever backend receives them
      (shared ticket keys). If affinity is imperfect, a client can hit a backend that can't resume
      its session, triggering a costlier full handshake.
    ref: "concepts.md#sticky-sessions-session-affinity"

  - id: proxies-gateways-load-balancing-095
    difficulty: advanced
    tags: [algorithms, p2c, ewma, envoy]
    question: |
      Which statement about modern load-balancing policies is correct?
    options:
      - "Envoy's default 'least request' uses power-of-two-choices to approximate least-loaded without scanning the whole pool, and latency-weighted policies like peak-EWMA bias toward historically faster backends"
      - "Power-of-two-choices requires scanning every backend on each request and sorting them by active-request count before dispatching"
      - "EWMA policies pick backends purely at random and ignore any measured latency signal when choosing where to route"
      - "Ring-hash and Maglev are latency-based policies that continuously re-rank backends by observed response time rather than hashing a key"
    answer: 0
    explanation: |
      Least-request-with-P2C samples two hosts and picks the one with fewer active requests,
      approximating least-loaded cheaply. Peak-EWMA (as in Finagle/Linkerd) weights by a decaying
      latency estimate to favor faster hosts. Ring-hash and Maglev are hash-based (affinity)
      policies, distinct from these load-aware ones.
    ref: "concepts.md#load-balancing-algorithms"

  - id: proxies-gateways-load-balancing-096
    difficulty: advanced
    tags: [health-checks, thundering-herd, jitter]
    question: |
      A large LB fleet probes a shared backend pool on identical fixed intervals. What
      operational problem can this cause, and what mitigates it?
    options:
      - "Nothing; synchronized probes are always ideal because coordinating them gives the cleanest single snapshot of pool health at each interval"
      - "Synchronized probes create a thundering herd (N LBs × M backends spiking together); adding jitter to probe timing spreads the load"
      - "Probes decrypt TLS and leak the backend's private key over the health-check port; switching to passthrough mode avoids the exposure"
      - "It silently forces the pool's round-robin scheduler to degrade into least-connections, skewing traffic toward whichever backend answered a probe last"
    answer: 1
    explanation: |
      If every LB probes on the same schedule, all probes hit the backends simultaneously — an
      amplified, synchronized load spike (N×M) that can itself degrade the backends. Jittering the
      probe intervals de-synchronizes them and smooths the health-check load.
    ref: "concepts.md#health-checks"

