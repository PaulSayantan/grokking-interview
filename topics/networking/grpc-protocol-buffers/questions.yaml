topic: "gRPC & Protocol Buffers"
domain: networking
topic_slug: grpc-protocol-buffers
version: 1
questions:
  - id: grpc-protocol-buffers-001
    difficulty: beginner
    tags: [http2, transport]
    question: |
      Which transport protocol does standard (native) gRPC run on?
    options:
      - "HTTP/2"
      - "HTTP/1.1 with chunked transfer encoding"
      - "Raw TCP with a custom framing header"
      - "UDP with an application-level reliability layer"
    answer: 0
    explanation: |
      Native gRPC is defined over HTTP/2. It relies on HTTP/2 features like stream
      multiplexing, binary framing, header compression, flow control, and trailers.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-002
    difficulty: beginner
    tags: [http2, method]
    question: |
      In gRPC over HTTP/2, what HTTP method is used and how is the RPC method encoded?
    options:
      - "GET, with the RPC name in the query string"
      - "RPC, a custom HTTP method, with the name in a header"
      - "POST, with the RPC name in the :path pseudo-header as /package.Service/Method"
      - "PUT, with the RPC name in the request body"
    answer: 2
    explanation: |
      Every gRPC call is a single HTTP/2 POST. The fully-qualified method is placed in the
      :path pseudo-header as /package.Service/Method; payloads travel in DATA frames.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-003
    difficulty: intermediate
    tags: [http2, trailers, status]
    question: |
      A gRPC unary call completes with an application-level error. What is the HTTP/2
      :status of the response, and where is the real gRPC outcome?
    options:
      - ":status is 500; there is no separate gRPC status"
      - ":status is 400; the outcome is in the response body as JSON"
      - ":status is 502; the outcome is in a leading header named grpc-error"
      - ":status is 200; the outcome is in the grpc-status trailer"
    answer: 3
    explanation: |
      For a well-formed call, HTTP status is 200 even on gRPC errors. The RPC result is
      carried separately in the grpc-status trailer (a HEADERS frame sent after DATA).
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-004
    difficulty: intermediate
    tags: [http2, trailers]
    question: |
      Why does gRPC depend on HTTP/2 trailers (trailing headers)?
    options:
      - "To send the final grpc-status after the response body, which is required for streaming outcomes"
      - "To compress the request body more effectively"
      - "To negotiate the protobuf version before sending data"
      - "To carry the TLS session ticket for resumption"
    answer: 0
    explanation: |
      The final status of a call (especially a stream) isn't known until the response ends,
      so gRPC delivers grpc-status/grpc-message as trailers after the DATA frames.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-005
    difficulty: intermediate
    tags: [http2, multiplexing]
    question: |
      Which HTTP/2 capability lets many concurrent gRPC calls share one TCP connection
      without application-layer head-of-line blocking?
    options:
      - "HPACK header compression"
      - "Server push"
      - "Stream multiplexing"
      - "The CONNECT method"
    answer: 2
    explanation: |
      HTTP/2 multiplexes independent streams over one connection, so many RPCs run
      concurrently without the HTTP/1.1 one-request-at-a-time constraint.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-006
    difficulty: advanced
    tags: [http2, framing, length-prefix]
    question: |
      Inside HTTP/2 DATA frames, how is each individual gRPC message delimited?
    options:
      - "A null byte terminator after each message"
      - "A 5-byte prefix: 1-byte compressed flag + 4-byte big-endian length, then the bytes"
      - "A JSON envelope with a length field"
      - "A 2-byte little-endian length only"
    answer: 1
    explanation: |
      Each gRPC message has a 5-byte prefix: one compressed-flag byte (0/1) plus a 4-byte
      big-endian length, followed by the message bytes. This lets a stream carry many
      discrete messages.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-007
    difficulty: intermediate
    tags: [http2, headers, te]
    question: |
      Why does a gRPC client send the header `te: trailers`?
    options:
      - "To request Transfer-Encoding chunked from the server"
      - "To enable TLS early data (0-RTT)"
      - "To ask the server to translate errors into JSON"
      - "To signal it accepts HTTP/2 trailers, which gRPC needs to deliver grpc-status"
    answer: 3
    explanation: |
      te: trailers tells the peer and intermediaries the client accepts trailing headers.
      gRPC requires trailers to send the final grpc-status; proxies that strip them break gRPC.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-008
    difficulty: beginner
    tags: [idl, field-numbers]
    question: |
      In a Protocol Buffers message, what is actually transmitted on the wire to identify
      a field?
    options:
      - "The field's numeric tag (field number), not its name"
      - "The field's name as a UTF-8 string"
      - "Both the name and the number for redundancy"
      - "A hash of the field name"
    answer: 0
    explanation: |
      Field names are not sent; only the field number (encoded into the tag) is. Both sides
      share the .proto, so the numeric identity is the stable contract and keeps messages compact.
    ref: "concepts.md#protocol-buffers-idl-messages-fields-and-field-numbers"

  - id: grpc-protocol-buffers-009
    difficulty: intermediate
    tags: [idl, field-numbers, optimization]
    question: |
      Why are field numbers 1 through 15 special in protobuf?
    options:
      - "They are reserved for protobuf internal use and can't be assigned"
      - "They cannot be used with repeated fields"
      - "Their tag encodes in a single byte, so they're best for frequently populated fields"
      - "They are always required fields"
    answer: 2
    explanation: |
      Field numbers 1–15 encode their tag in one byte (16–2047 take two), so assign them to
      the most frequently set fields for compactness.
    ref: "concepts.md#protocol-buffers-idl-messages-fields-and-field-numbers"

  - id: grpc-protocol-buffers-010
    difficulty: intermediate
    tags: [idl, proto3, presence]
    question: |
      In proto3, how can you distinguish a scalar field that was explicitly set to 0 from
      one that was never set?
    options:
      - "You cannot; proto3 removed all field presence"
      - "Use a negative field number"
      - "Set the `required` keyword"
      - "Mark the field `optional`, which adds explicit presence tracking (a hasbit)"
    answer: 3
    explanation: |
      proto3 re-added explicit presence via the `optional` keyword, which tracks whether the
      field was set, letting you distinguish 0/"" from unset. Wrapper types are another option.
    ref: "concepts.md#protocol-buffers-idl-messages-fields-and-field-numbers"

  - id: grpc-protocol-buffers-011
    difficulty: intermediate
    tags: [idl, oneof]
    question: |
      What does a protobuf `oneof` express?
    options:
      - "A group of fields where setting one clears the others (at most one is set)"
      - "A field that must always be present"
      - "An enum with exactly one value"
      - "A field that can only be read once"
    answer: 0
    explanation: |
      A oneof groups fields so that only one can be set at a time; assigning one member
      clears any previously-set member.
    ref: "concepts.md#protocol-buffers-idl-messages-fields-and-field-numbers"

  - id: grpc-protocol-buffers-012
    difficulty: advanced
    tags: [idl, enum, proto3]
    question: |
      What constraint does proto3 place on the first entry of an enum?
    options:
      - "It must be the largest value"
      - "It must have value 0 and serves as the default"
      - "It must be named DEFAULT"
      - "There is no constraint"
    answer: 1
    explanation: |
      In proto3 the first enum value must be 0 and acts as the default. Keeping an
      UNSPECIFIED = 0 makes a missing/unknown enum meaningful.
    ref: "concepts.md#protocol-buffers-idl-messages-fields-and-field-numbers"

  - id: grpc-protocol-buffers-013
    difficulty: intermediate
    tags: [wire-format, tag, wire-type]
    question: |
      A protobuf field tag is computed as (field_number << 3) | wire_type. What do the low
      3 bits represent?
    options:
      - "The field number"
      - "A checksum of the value"
      - "The wire type"
      - "The message length"
    answer: 2
    explanation: |
      The low 3 bits are the wire type (e.g., 0=VARINT, 2=LEN, 5=I32); the remaining upper
      bits are the field number.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-014
    difficulty: advanced
    tags: [wire-format, varint]
    question: |
      In a protobuf varint, what does the most-significant bit (MSB) of each byte indicate?
    options:
      - "The sign of the number"
      - "A continuation flag: 1 means more bytes follow, 0 means this is the last byte"
      - "Whether the value is compressed"
      - "The wire type of the field"
    answer: 1
    explanation: |
      Each varint byte uses its MSB as a continuation bit (1 = more bytes, 0 = last). The
      remaining 7 bits carry the payload, stored least-significant group first.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-015
    difficulty: advanced
    tags: [wire-format, varint, decoding]
    question: |
      The bytes `08 96 01` appear in a protobuf message. What field number, wire type, and
      value do they represent?
    options:
      - "Field 8, LEN, value 150"
      - "Field 1, I32, value 406"
      - "Field 2, VARINT, value 22"
      - "Field 1, VARINT, value 150"
    answer: 3
    explanation: |
      0x08 = (1<<3)|0 → field 1, wire type VARINT. 96 01: 0x96 has MSB set (continue),
      low 7 bits 0010110; next byte 0x01 → 0000001. Combined little-endian:
      0000001 0010110 = 150.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-016
    difficulty: advanced
    tags: [wire-format, varint, decoding]
    question: |
      How is the integer 300 encoded as a protobuf varint?
    options:
      - "0xAC 0x02"
      - "0x2C 0x01"
      - "0x01 0x2C"
      - "0x96 0x02"
    answer: 0
    explanation: |
      300 = 100101100. 7-bit groups LSB-first: 0101100 and 0000010. Add continuation bits:
      first byte 1 0101100 = 0xAC, second 0 0000010 = 0x02 → AC 02.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-017
    difficulty: intermediate
    tags: [wire-format, len, tlv]
    question: |
      How are strings, bytes, and embedded messages encoded on the protobuf wire?
    options:
      - "As a null-terminated sequence of bytes"
      - "Always base64-encoded inside a VARINT"
      - "As LEN fields: tag, then a varint length, then that many raw bytes (tag-length-value)"
      - "As fixed 32-byte blocks"
    answer: 2
    explanation: |
      Wire type 2 (LEN) is length-delimited: tag, a varint byte-length, then the payload
      bytes. This is the classic tag-length-value form used for strings, bytes, and sub-messages.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-018
    difficulty: advanced
    tags: [wire-format, zigzag, signed]
    question: |
      Why would you choose `sint32` over `int32` for a field that often holds small negative
      numbers?
    options:
      - "sint32 is stored as a fixed 4 bytes, which is smaller"
      - "sint32 is human-readable on the wire"
      - "int32 cannot represent negative numbers at all"
      - "sint32 uses ZigZag encoding so small-magnitude negatives stay compact instead of taking 10 bytes"
    answer: 3
    explanation: |
      Plain int32 sign-extends negatives to 10-byte varints. sint32/sint64 apply ZigZag
      encoding ((n<<1)^(n>>31)) mapping -1→1, 1→2, -2→3, so small negatives stay small.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-019
    difficulty: advanced
    tags: [wire-format, packed, repeated]
    question: |
      How are repeated scalar numeric fields encoded by default in proto3?
    options:
      - "Each element gets its own tag repeated once per value"
      - "Packed: one LEN field holds all the values concatenated"
      - "As a JSON array inside a bytes field"
      - "They cannot be repeated"
    answer: 1
    explanation: |
      In proto3 repeated scalar numeric fields are packed by default: a single
      length-delimited field carries all elements back-to-back, avoiding a tag per element.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-020
    difficulty: intermediate
    tags: [wire-format, tag, decoding]
    question: |
      For the field `int32 retries = 2;` set to the value 300, which byte sequence is
      correct?
    options:
      - "02 AC 02"
      - "16 2C 01"
      - "10 AC 02"
      - "20 96 01"
    answer: 2
    explanation: |
      tag = (2<<3)|0 = 16 = 0x10 (field 2, VARINT). 300 as varint = AC 02. So the field is
      10 AC 02.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-021
    difficulty: beginner
    tags: [evolution, add-field]
    question: |
      What happens when an old client (built from an older .proto) receives a message
      containing a new field number it doesn't recognize?
    options:
      - "The parse fails with an error"
      - "It treats the field as unknown and either preserves or ignores it, without failing"
      - "It reuses the field for the first known field"
      - "It crashes because required fields are missing"
    answer: 1
    explanation: |
      Protobuf is forward/backward compatible: unknown fields are skipped (and often
      preserved for re-serialization), so adding new fields with new numbers doesn't break old peers.
    ref: "concepts.md#backward-and-forward-compatible-schema-evolution"

  - id: grpc-protocol-buffers-022
    difficulty: intermediate
    tags: [evolution, reserved]
    question: |
      When you delete a field from a protobuf message, what is the recommended safe practice?
    options:
      - "Immediately reuse its field number for a new field"
      - "Renumber all subsequent fields to fill the gap"
      - "Mark its number (and name) as `reserved` so they can never be reused"
      - "Change its type to bytes"
    answer: 2
    explanation: |
      Reserve the removed field's number and name (reserved 3; reserved "old_name";) so a
      future field can't accidentally reuse it and misinterpret in-flight data.
    ref: "concepts.md#backward-and-forward-compatible-schema-evolution"

  - id: grpc-protocol-buffers-023
    difficulty: advanced
    tags: [evolution, unsafe]
    question: |
      Which of the following is an UNSAFE, data-corrupting schema change?
    options:
      - "Adding a new field with a brand-new field number"
      - "Renaming a field while keeping its number"
      - "Reserving a deleted field's number"
      - "Reusing a previously-deleted field number for a different field/type"
    answer: 3
    explanation: |
      Reusing a field number for a different field silently corrupts data for peers using
      the old schema, which is why deleted numbers must be reserved. Renames are wire-safe
      (names aren't sent).
    ref: "concepts.md#backward-and-forward-compatible-schema-evolution"

  - id: grpc-protocol-buffers-024
    difficulty: advanced
    tags: [evolution, type-compat]
    question: |
      Which pair of scalar types is NOT wire-compatible for in-place schema evolution?
    options:
      - "int32 and int64 (both VARINT)"
      - "int32 and sint32"
      - "fixed32 and sfixed32"
      - "bool and int32 (both VARINT)"
    answer: 1
    explanation: |
      int32 and sint32 are both conceptually integers but use different encodings (sint32 is
      ZigZag), so they are NOT wire-compatible. The other listed pairs share a wire type/encoding.
    ref: "concepts.md#backward-and-forward-compatible-schema-evolution"

  - id: grpc-protocol-buffers-025
    difficulty: intermediate
    tags: [evolution, proto3, required]
    question: |
      Why did proto3 remove the `required` keyword?
    options:
      - "Because required fields made messages larger"
      - "Because a required field can never be safely removed and forces old peers to reject messages omitting it"
      - "Because required fields broke JSON mapping"
      - "Because it conflicted with field numbers 1–15"
    answer: 1
    explanation: |
      required was a design mistake: once shipped it can't be removed without breaking
      compatibility, since peers reject messages missing it. proto3 dropped it entirely.
    ref: "concepts.md#backward-and-forward-compatible-schema-evolution"

  - id: grpc-protocol-buffers-026
    difficulty: beginner
    tags: [rpc-types, unary]
    question: |
      Which gRPC RPC type is a classic single request / single response call?
    options:
      - "Bidirectional streaming"
      - "Server streaming"
      - "Client streaming"
      - "Unary"
    answer: 3
    explanation: |
      Unary RPC sends one request message and gets one response message back — the most
      common and REST-like shape.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-protocol-buffers-027
    difficulty: beginner
    tags: [rpc-types, server-streaming]
    question: |
      The signature `rpc List (Query) returns (stream Item);` describes which RPC type?
    options:
      - "Unary"
      - "Server streaming"
      - "Client streaming"
      - "Bidirectional streaming"
    answer: 1
    explanation: |
      `stream` on the response type only means one request, many response messages: server
      streaming, ideal for feeds, large result sets, or progress updates.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-protocol-buffers-028
    difficulty: intermediate
    tags: [rpc-types, client-streaming]
    question: |
      A client uploads many chunks and gets a single summary response at the end. Which RPC
      type fits, and how is it declared?
    options:
      - "Server streaming: rpc M (Req) returns (stream Resp)"
      - "Unary: rpc M (Req) returns (Resp)"
      - "Client streaming: rpc M (stream Req) returns (Resp)"
      - "Bidirectional: rpc M (stream Req) returns (stream Resp)"
    answer: 2
    explanation: |
      Client streaming (stream on the request) sends many messages then half-closes; the
      server replies once — perfect for uploads/aggregation.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-protocol-buffers-029
    difficulty: intermediate
    tags: [rpc-types, bidi]
    question: |
      In bidirectional streaming, what ordering guarantee does gRPC provide?
    options:
      - "Messages are globally ordered across both directions"
      - "No ordering is guaranteed at all"
      - "Only the first and last messages are ordered"
      - "Ordering is guaranteed within each direction of the single stream"
    answer: 3
    explanation: |
      Both sides read and write independently on one HTTP/2 stream; message order is
      preserved within each direction, but the two directions interleave freely.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-protocol-buffers-030
    difficulty: intermediate
    tags: [rpc-types, http2-mapping]
    question: |
      How many HTTP/2 streams does a single bidirectional-streaming gRPC call use?
    options:
      - "One stream per message"
      - "One stream for the whole call, carrying DATA frames both ways"
      - "Two streams, one per direction"
      - "A new stream each time the direction switches"
    answer: 1
    explanation: |
      All four gRPC RPC types map onto exactly one HTTP/2 stream per call. Streaming just
      changes how many DATA frames flow each way and when END_STREAM (half-close) is set.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-protocol-buffers-031
    difficulty: beginner
    tags: [codegen, contract-first]
    question: |
      What is the role of `protoc` (the protobuf compiler) in gRPC development?
    options:
      - "It runs the gRPC server at runtime"
      - "It compresses protobuf messages on the wire"
      - "It generates message types and service stubs from the .proto contract"
      - "It load-balances gRPC connections"
    answer: 2
    explanation: |
      protoc with language plugins reads the .proto and generates strongly-typed message
      classes and client/server stubs, enabling contract-first, cross-language development.
    ref: "concepts.md#code-generation-and-contract-first-development"

  - id: grpc-protocol-buffers-032
    difficulty: intermediate
    tags: [codegen, contract-first]
    question: |
      Why is gRPC described as "contract-first" and how does that differ from typical REST?
    options:
      - "gRPC generates the .proto from running code; REST is defined upfront"
      - "The .proto is the single shared source of truth generating clients/servers; REST's OpenAPI is often optional documentation that can drift"
      - "gRPC has no schema at all; REST always does"
      - "There is no difference; both are contract-first"
    answer: 1
    explanation: |
      In gRPC the .proto is authoritative and drives codegen for every language. REST
      schemas (OpenAPI) are frequently optional and can drift from the implementation.
    ref: "concepts.md#code-generation-and-contract-first-development"

  - id: grpc-protocol-buffers-033
    difficulty: advanced
    tags: [codegen, reflection]
    question: |
      A tool like grpcurl can call a server's methods without having the local .proto file.
      Which gRPC feature makes this possible?
    options:
      - "Server Reflection, which exposes the schema at runtime"
      - "HPACK header compression"
      - "TLS ALPN negotiation"
      - "The grpc-timeout header"
    answer: 0
    explanation: |
      The gRPC Server Reflection protocol lets a server advertise its service/message
      descriptors at runtime, so clients can construct calls dynamically without a local .proto.
    ref: "concepts.md#code-generation-and-contract-first-development"

  - id: grpc-protocol-buffers-034
    difficulty: beginner
    tags: [deadlines, timeout]
    question: |
      How is a per-call timeout transmitted in gRPC over HTTP/2?
    options:
      - "As a query parameter on the :path"
      - "As a field inside every protobuf message"
      - "As the grpc-timeout header, e.g. `grpc-timeout: 100m`"
      - "In the TLS handshake"
    answer: 2
    explanation: |
      The client sends grpc-timeout as an HTTP/2 header with a value and unit (H, M, S, m,
      u, n), e.g. 100m = 100 milliseconds.
    ref: "concepts.md#deadlines-timeouts-and-cancellation"

  - id: grpc-protocol-buffers-035
    difficulty: intermediate
    tags: [deadlines, propagation]
    question: |
      Why are gRPC deadlines preferred over independent per-hop timeouts in a call chain
      A → B → C?
    options:
      - "Deadlines are encrypted; timeouts are not"
      - "A deadline propagates the remaining budget down the chain so the whole chain gives up together"
      - "Deadlines disable retries automatically"
      - "Timeouts are not supported by HTTP/2"
    answer: 1
    explanation: |
      A deadline is an absolute time that B forwards (as remaining budget) to C. Per-hop
      timeouts that reset can let downstream work continue after the original caller quit.
    ref: "concepts.md#deadlines-timeouts-and-cancellation"

  - id: grpc-protocol-buffers-036
    difficulty: intermediate
    tags: [deadlines, status]
    question: |
      When a gRPC call's deadline elapses, which status code is returned?
    options:
      - "CANCELLED (1)"
      - "UNAVAILABLE (14)"
      - "DEADLINE_EXCEEDED (4)"
      - "RESOURCE_EXHAUSTED (8)"
    answer: 2
    explanation: |
      Exceeding the deadline terminates the RPC with DEADLINE_EXCEEDED (code 4). CANCELLED
      (1) is when the client explicitly cancels.
    ref: "concepts.md#deadlines-timeouts-and-cancellation"

  - id: grpc-protocol-buffers-037
    difficulty: advanced
    tags: [deadlines, antipattern]
    question: |
      A 4-hop gRPC chain sets a fresh 1-second timeout at each hop instead of propagating a
      deadline. The original caller gave up after 1 second. What is the consequence?
    options:
      - "Nothing; the behavior is identical to deadline propagation"
      - "Downstream hops can keep working up to ~4 seconds on a request already abandoned, wasting resources"
      - "The call immediately fails with INVALID_ARGUMENT"
      - "The TCP connection is forcibly reset at hop 2"
    answer: 1
    explanation: |
      Resetting a full timeout per hop means the chain can run far longer than the caller's
      budget, doing wasted work on abandoned requests and risking cascading exhaustion.
    ref: "concepts.md#deadlines-timeouts-and-cancellation"

  - id: grpc-protocol-buffers-038
    difficulty: beginner
    tags: [metadata]
    question: |
      What is gRPC "metadata" essentially, at the protocol level?
    options:
      - "The protobuf schema embedded in each message"
      - "A checksum of the payload"
      - "Key-value pairs carried as HTTP/2 headers (and trailers)"
      - "The TLS certificate chain"
    answer: 2
    explanation: |
      Metadata is a key-value side channel mapped onto HTTP/2 headers (leading) and trailers
      (trailing), used for auth tokens, tracing IDs, and custom context.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-039
    difficulty: intermediate
    tags: [metadata, binary]
    question: |
      How are binary-valued metadata entries handled on the wire?
    options:
      - "They are rejected; metadata must be ASCII"
      - "The key uses a `-bin` suffix and the value is base64-encoded"
      - "They are sent as a separate protobuf message"
      - "They are gzip-compressed and prefixed with 0x1f 0x8b"
    answer: 1
    explanation: |
      Binary metadata keys end in -bin (e.g. trace-context-bin) and their values are
      base64-encoded on the wire; plain keys carry ASCII values.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-040
    difficulty: beginner
    tags: [status, codes]
    question: |
      What does `grpc-status: 0` mean?
    options:
      - "The call is still in progress"
      - "An unknown error occurred"
      - "OK — the call succeeded"
      - "The server is unavailable"
    answer: 2
    explanation: |
      gRPC status code 0 is OK (success). gRPC has its own canonical code set, independent
      of HTTP status codes.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-041
    difficulty: advanced
    tags: [status, codes, semantics]
    question: |
      A client requests deletion of a directory, but the directory is non-empty so the
      server refuses. Which status code best fits — and how does it differ from
      INVALID_ARGUMENT?
    options:
      - "INVALID_ARGUMENT (3), because any refusal means bad input"
      - "FAILED_PRECONDITION (9): the argument is fine but the system isn't in the required state; INVALID_ARGUMENT is for input bad regardless of state"
      - "UNAVAILABLE (14), because the resource can't be served"
      - "NOT_FOUND (5), because the operation can't complete"
    answer: 1
    explanation: |
      Use FAILED_PRECONDITION when the request is well-formed but the system state blocks it
      (non-empty directory). INVALID_ARGUMENT is for arguments that are wrong regardless of state.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-042
    difficulty: intermediate
    tags: [status, retry]
    question: |
      Which gRPC status code specifically signals a transient failure that is generally safe
      to retry with backoff?
    options:
      - "INTERNAL (13)"
      - "FAILED_PRECONDITION (9)"
      - "UNAVAILABLE (14)"
      - "PERMISSION_DENIED (7)"
    answer: 2
    explanation: |
      UNAVAILABLE (14) indicates a transient condition (e.g., server briefly down); it's the
      canonical retry-with-backoff code. INTERNAL and FAILED_PRECONDITION are not retry-safe.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-043
    difficulty: intermediate
    tags: [status, codes]
    question: |
      A request arrives with a missing or invalid credential. Which status code applies?
    options:
      - "UNAUTHENTICATED (16)"
      - "PERMISSION_DENIED (7)"
      - "INVALID_ARGUMENT (3)"
      - "ABORTED (10)"
    answer: 0
    explanation: |
      UNAUTHENTICATED (16) is for missing/invalid credentials (identity not established).
      PERMISSION_DENIED (7) is when identity is known but not authorized for the action.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-044
    difficulty: beginner
    tags: [grpc-web, browser]
    question: |
      Why can't a web browser speak native gRPC directly?
    options:
      - "Browsers don't support TLS 1.3"
      - "Protobuf is banned in browsers for security reasons"
      - "Browser fetch/XHR APIs don't expose the raw HTTP/2 frame layer or let JS read HTTP trailers"
      - "Browsers only allow GET and POST, but gRPC needs a custom method"
    answer: 2
    explanation: |
      Browsers can't control HTTP/2 DATA frames or read HTTP/2 trailers via fetch/XHR, and
      can't force HTTP/2 at that level — so they can't produce gRPC's exact wire behavior.
    ref: "concepts.md#grpc-web-and-the-browser-limitation"

  - id: grpc-protocol-buffers-045
    difficulty: intermediate
    tags: [grpc-web, trailers]
    question: |
      How does gRPC-Web deliver the gRPC status, given browsers can't read HTTP trailers?
    options:
      - "It omits the status entirely"
      - "It uses a WebSocket side channel"
      - "It sends the status as a cookie"
      - "It encodes the trailers into the response body as a trailer frame after the message frames"
    answer: 3
    explanation: |
      gRPC-Web moves trailers in-band: a trailer frame is appended to the response body so
      the browser client can parse grpc-status without native trailer support.
    ref: "concepts.md#grpc-web-and-the-browser-limitation"

  - id: grpc-protocol-buffers-046
    difficulty: intermediate
    tags: [grpc-web, proxy, streaming]
    question: |
      Which statement about gRPC-Web is correct?
    options:
      - "It supports all four RPC types identically to native gRPC"
      - "It typically needs a translating proxy (e.g. Envoy) and does not generally support client or bidirectional streaming"
      - "It requires HTTP/3 and QUIC"
      - "It sends JSON instead of protobuf"
    answer: 1
    explanation: |
      gRPC-Web needs a proxy to translate to native gRPC and supports unary and
      server-streaming; client and bidirectional streaming aren't generally supported in browsers.
    ref: "concepts.md#grpc-web-and-the-browser-limitation"

  - id: grpc-protocol-buffers-047
    difficulty: beginner
    tags: [comparison, rest, readability]
    question: |
      Compared with REST/JSON, what is a primary trade-off of gRPC/protobuf?
    options:
      - "gRPC payloads are larger than JSON"
      - "gRPC cannot be encrypted"
      - "gRPC is not human-readable and needs protobuf-aware tooling, unlike JSON you can read with curl"
      - "gRPC lacks a schema"
    answer: 2
    explanation: |
      Protobuf is compact binary, not human-readable; you can't just curl it and read the
      body. That's the debuggability/tooling cost of gRPC's efficiency and strong contract.
    ref: "concepts.md#grpc-vs-rest-vs-graphql-trade-offs"

  - id: grpc-protocol-buffers-048
    difficulty: intermediate
    tags: [comparison, graphql]
    question: |
      What problem does GraphQL specifically address that plain REST often struggles with?
    options:
      - "Binary payload efficiency"
      - "Over-fetching and under-fetching, by letting the client specify exactly which fields it wants"
      - "Native bidirectional streaming"
      - "Contract-first codegen across languages"
    answer: 1
    explanation: |
      GraphQL lets clients request precisely the fields they need from a single endpoint,
      reducing over/under-fetching. Its weaknesses include hard HTTP caching and resolver complexity.
    ref: "concepts.md#grpc-vs-rest-vs-graphql-trade-offs"

  - id: grpc-protocol-buffers-049
    difficulty: intermediate
    tags: [comparison, fit-for-purpose]
    question: |
      Which scenario is the strongest fit for gRPC over REST or GraphQL?
    options:
      - "A public API consumed directly by many third-party browsers"
      - "A simple static website's content API needing HTTP caching"
      - "Low-latency, high-throughput internal (east-west) service-to-service communication with streaming"
      - "An API whose main requirement is being readable and debuggable with curl"
    answer: 2
    explanation: |
      gRPC excels at internal microservice traffic: typed contracts, low overhead, HTTP/2
      multiplexing, and native streaming. Public/browser-facing needs favor REST/GraphQL for reach.
    ref: "concepts.md#grpc-vs-rest-vs-graphql-trade-offs"

  - id: grpc-protocol-buffers-050
    difficulty: advanced
    tags: [comparison, load-balancing]
    question: |
      Why can a naive L4 (connection-level) load balancer poorly distribute gRPC traffic?
    options:
      - "gRPC uses UDP, which L4 balancers can't route"
      - "One long-lived HTTP/2 connection carries many streams, so an L4 balancer pins all of them to a single backend"
      - "gRPC opens a new connection per RPC, overwhelming the balancer"
      - "gRPC disables keep-alive, so connections churn constantly"
    answer: 1
    explanation: |
      Because gRPC multiplexes many RPCs over one persistent HTTP/2 connection, an L4
      balancer that balances by connection sends all those streams to one backend. L7/gRPC-aware
      balancing is needed to spread load.
    ref: "concepts.md#grpc-vs-rest-vs-graphql-trade-offs"

  - id: grpc-protocol-buffers-051
    difficulty: intermediate
    tags: [status, http-mapping]
    question: |
      In native gRPC, when would the HTTP/2 :status be something other than 200?
    options:
      - "Whenever the gRPC status is not OK"
      - "Only for streaming calls"
      - "For transport/protocol-level errors (e.g. a 404 for a missing service), not for application RPC errors"
      - "Never; it is always 200"
    answer: 2
    explanation: |
      Application RPC errors keep HTTP 200 with a non-zero grpc-status trailer. Non-200 HTTP
      is reserved for transport/protocol failures like an unroutable path.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-052
    difficulty: advanced
    tags: [idl, field-numbers, range]
    question: |
      What is the valid range of protobuf field numbers, and which sub-range is reserved for
      protobuf's own use?
    options:
      - "1 to 65535; 0–1023 reserved"
      - "0 to 255; 200–255 reserved"
      - "1 to 536,870,911 (2^29−1); 19000–19999 reserved"
      - "1 to 2,147,483,647; none reserved"
    answer: 2
    explanation: |
      Field numbers run 1 to 2^29−1 (536,870,911). The range 19000–19999 is reserved for the
      Protocol Buffers implementation and can't be used.
    ref: "concepts.md#protocol-buffers-idl-messages-fields-and-field-numbers"

  - id: grpc-protocol-buffers-053
    difficulty: intermediate
    tags: [http2, hpack, headers]
    question: |
      Which HTTP/2 feature reduces the overhead of repeated gRPC metadata like auth tokens
      and content-type across many calls?
    options:
      - "Server push"
      - "HPACK header compression (RFC 7541)"
      - "The CONNECT protocol"
      - "TLS session tickets"
    answer: 1
    explanation: |
      HPACK compresses HTTP/2 headers per connection, so repeated gRPC metadata is sent
      efficiently rather than re-transmitted in full each call.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-054
    difficulty: advanced
    tags: [status, rich-errors]
    question: |
      Where does gRPC carry rich, structured error details (e.g. a google.rpc.Status with
      error_details)?
    options:
      - "In the response DATA frame as a second message"
      - "In the :status pseudo-header"
      - "In the grpc-status-details-bin trailer"
      - "In a separate follow-up RPC"
    answer: 2
    explanation: |
      Structured error payloads travel base64-encoded in the grpc-status-details-bin trailer,
      alongside the numeric grpc-status and grpc-message.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-055
    difficulty: intermediate
    tags: [rpc-types, half-close]
    question: |
      In a client-streaming RPC, what does the client do to signal it has finished sending
      request messages?
    options:
      - "Closes the entire TCP connection"
      - "Sends a special protobuf message with field 0"
      - "Half-closes its side of the stream (sets END_STREAM), after which the server sends its single response"
      - "Waits for the server to time out"
    answer: 2
    explanation: |
      The client sends all its messages then half-closes (END_STREAM on its direction). The
      server, having read the full stream, then returns its one response and final status.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-protocol-buffers-056
    difficulty: beginner
    tags: [comparison, streaming]
    question: |
      Which statement about streaming support is accurate?
    options:
      - "REST natively supports full bidirectional streaming; gRPC does not"
      - "gRPC natively supports all four streaming modes, while REST bolts streaming on via SSE/WebSocket"
      - "Neither gRPC nor REST can stream"
      - "GraphQL has richer native streaming than gRPC"
    answer: 1
    explanation: |
      gRPC has unary plus server-, client-, and bidirectional streaming as first-class
      modes over HTTP/2. REST relies on add-ons (SSE, WebSocket) for streaming.
    ref: "concepts.md#grpc-vs-rest-vs-graphql-trade-offs"
