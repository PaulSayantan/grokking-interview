topic: "gRPC & Protocol Buffers"
domain: networking
topic_slug: grpc-protocol-buffers
version: 1
questions:
  - id: grpc-protocol-buffers-001
    difficulty: beginner
    tags: [http2, transport]
    question: |
      Which transport protocol does standard (native) gRPC run on?
    options:
      - "HTTP/2"
      - "HTTP/1.1 with chunked transfer encoding"
      - "Raw TCP with a custom framing header"
      - "UDP with an application-level reliability layer"
    answer: 0
    explanation: |
      Native gRPC is defined over HTTP/2. It relies on HTTP/2 features like stream
      multiplexing, binary framing, header compression, flow control, and trailers.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-002
    difficulty: beginner
    tags: [http2, method]
    question: |
      In gRPC over HTTP/2, what HTTP method is used and how is the RPC method encoded?
    options:
      - "GET, with the RPC name in the query string"
      - "RPC, a custom HTTP method, with the name in a header"
      - "POST, with the RPC name in the :path pseudo-header as /package.Service/Method"
      - "PUT, with the RPC name in the request body"
    answer: 2
    explanation: |
      Every gRPC call is a single HTTP/2 POST. The fully-qualified method is placed in the
      :path pseudo-header as /package.Service/Method; payloads travel in DATA frames.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-003
    difficulty: intermediate
    tags: [http2, trailers, status]
    question: |
      A gRPC unary call completes with an application-level error. What is the HTTP/2
      :status of the response, and where is the real gRPC outcome?
    options:
      - ":status is 500; there is no separate gRPC status"
      - ":status is 400; the outcome is in the response body as JSON"
      - ":status is 502; the outcome is in a leading header named grpc-error"
      - ":status is 200; the outcome is in the grpc-status trailer"
    answer: 3
    explanation: |
      For a well-formed call, HTTP status is 200 even on gRPC errors. The RPC result is
      carried separately in the grpc-status trailer (a HEADERS frame sent after DATA).
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-004
    difficulty: intermediate
    tags: [http2, trailers]
    question: |
      Why does gRPC depend on HTTP/2 trailers (trailing headers)?
    options:
      - "To send the final grpc-status after the response body, which is required for streaming outcomes"
      - "To compress the request body more effectively"
      - "To negotiate the protobuf version before sending data"
      - "To carry the TLS session ticket for resumption"
    answer: 0
    explanation: |
      The final status of a call (especially a stream) isn't known until the response ends,
      so gRPC delivers grpc-status/grpc-message as trailers after the DATA frames.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-005
    difficulty: intermediate
    tags: [http2, multiplexing]
    question: |
      Which HTTP/2 capability lets many concurrent gRPC calls share one TCP connection
      without application-layer head-of-line blocking?
    options:
      - "HPACK header compression"
      - "Server push"
      - "Stream multiplexing"
      - "The CONNECT method"
    answer: 2
    explanation: |
      HTTP/2 multiplexes independent streams over one connection, so many RPCs run
      concurrently without the HTTP/1.1 one-request-at-a-time constraint.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-006
    difficulty: advanced
    tags: [http2, framing, length-prefix]
    question: |
      Inside HTTP/2 DATA frames, how is each individual gRPC message delimited?
    options:
      - "A null byte terminator after each message"
      - "A 5-byte prefix: 1-byte compressed flag + 4-byte big-endian length, then the bytes"
      - "A JSON envelope with a length field"
      - "A 2-byte little-endian length only"
    answer: 1
    explanation: |
      Each gRPC message has a 5-byte prefix: one compressed-flag byte (0/1) plus a 4-byte
      big-endian length, followed by the message bytes. This lets a stream carry many
      discrete messages.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-007
    difficulty: intermediate
    tags: [http2, headers, te]
    question: |
      Why does a gRPC client send the header `te: trailers`?
    options:
      - "To request Transfer-Encoding chunked from the server"
      - "To enable TLS early data (0-RTT)"
      - "To ask the server to translate errors into JSON"
      - "To signal it accepts HTTP/2 trailers, which gRPC needs to deliver grpc-status"
    answer: 3
    explanation: |
      te: trailers tells the peer and intermediaries the client accepts trailing headers.
      gRPC requires trailers to send the final grpc-status; proxies that strip them break gRPC.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-008
    difficulty: beginner
    tags: [idl, field-numbers]
    question: |
      In a Protocol Buffers message, what is actually transmitted on the wire to identify
      a field?
    options:
      - "The field's numeric tag (field number), not its name"
      - "The field's name as a UTF-8 string"
      - "Both the name and the number for redundancy"
      - "A hash of the field name"
    answer: 0
    explanation: |
      Field names are not sent; only the field number (encoded into the tag) is. Both sides
      share the .proto, so the numeric identity is the stable contract and keeps messages compact.
    ref: "concepts.md#protocol-buffers-idl-messages-fields-and-field-numbers"

  - id: grpc-protocol-buffers-009
    difficulty: intermediate
    tags: [idl, field-numbers, optimization]
    question: |
      Why are field numbers 1 through 15 special in protobuf?
    options:
      - "They are reserved for protobuf internal use and can't be assigned"
      - "They cannot be used with repeated fields"
      - "Their tag encodes in a single byte, so they're best for frequently populated fields"
      - "They are always required fields"
    answer: 2
    explanation: |
      Field numbers 1–15 encode their tag in one byte (16–2047 take two), so assign them to
      the most frequently set fields for compactness.
    ref: "concepts.md#protocol-buffers-idl-messages-fields-and-field-numbers"

  - id: grpc-protocol-buffers-010
    difficulty: intermediate
    tags: [idl, proto3, presence]
    question: |
      In proto3, how can you distinguish a scalar field that was explicitly set to 0 from
      one that was never set?
    options:
      - "You cannot; proto3 removed all field presence"
      - "Use a negative field number"
      - "Set the `required` keyword"
      - "Mark the field `optional`, which adds explicit presence tracking (a hasbit)"
    answer: 3
    explanation: |
      proto3 re-added explicit presence via the `optional` keyword, which tracks whether the
      field was set, letting you distinguish 0/"" from unset. Wrapper types are another option.
    ref: "concepts.md#protocol-buffers-idl-messages-fields-and-field-numbers"

  - id: grpc-protocol-buffers-011
    difficulty: intermediate
    tags: [idl, oneof]
    question: |
      What does a protobuf `oneof` express?
    options:
      - "A group of fields where setting one clears the others (at most one is set)"
      - "A field that must always be present"
      - "An enum with exactly one value"
      - "A field that can only be read once"
    answer: 0
    explanation: |
      A oneof groups fields so that only one can be set at a time; assigning one member
      clears any previously-set member.
    ref: "concepts.md#protocol-buffers-idl-messages-fields-and-field-numbers"

  - id: grpc-protocol-buffers-012
    difficulty: advanced
    tags: [idl, enum, proto3]
    question: |
      What constraint does proto3 place on the first entry of an enum?
    options:
      - "It must be the largest value"
      - "It must have value 0 and serves as the default"
      - "It must be named DEFAULT"
      - "There is no constraint"
    answer: 1
    explanation: |
      In proto3 the first enum value must be 0 and acts as the default. Keeping an
      UNSPECIFIED = 0 makes a missing/unknown enum meaningful.
    ref: "concepts.md#protocol-buffers-idl-messages-fields-and-field-numbers"

  - id: grpc-protocol-buffers-013
    difficulty: intermediate
    tags: [wire-format, tag, wire-type]
    question: |
      A protobuf field tag is computed as (field_number << 3) | wire_type. What do the low
      3 bits represent?
    options:
      - "The field number"
      - "A checksum of the value"
      - "The wire type"
      - "The message length"
    answer: 2
    explanation: |
      The low 3 bits are the wire type (e.g., 0=VARINT, 2=LEN, 5=I32); the remaining upper
      bits are the field number.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-014
    difficulty: advanced
    tags: [wire-format, varint]
    question: |
      In a protobuf varint, what does the most-significant bit (MSB) of each byte indicate?
    options:
      - "The sign of the number"
      - "A continuation flag: 1 means more bytes follow, 0 means this is the last byte"
      - "Whether the value is compressed"
      - "The wire type of the field"
    answer: 1
    explanation: |
      Each varint byte uses its MSB as a continuation bit (1 = more bytes, 0 = last). The
      remaining 7 bits carry the payload, stored least-significant group first.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-015
    difficulty: advanced
    tags: [wire-format, varint, decoding]
    question: |
      The bytes `08 96 01` appear in a protobuf message. What field number, wire type, and
      value do they represent?
    options:
      - "Field 8, LEN, value 150"
      - "Field 1, I32, value 406"
      - "Field 2, VARINT, value 22"
      - "Field 1, VARINT, value 150"
    answer: 3
    explanation: |
      0x08 = (1<<3)|0 → field 1, wire type VARINT. 96 01: 0x96 has MSB set (continue),
      low 7 bits 0010110; next byte 0x01 → 0000001. Combined little-endian:
      0000001 0010110 = 150.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-016
    difficulty: advanced
    tags: [wire-format, varint, decoding]
    question: |
      How is the integer 300 encoded as a protobuf varint?
    options:
      - "0xAC 0x02"
      - "0x2C 0x01"
      - "0x01 0x2C"
      - "0x96 0x02"
    answer: 0
    explanation: |
      300 = 100101100. 7-bit groups LSB-first: 0101100 and 0000010. Add continuation bits:
      first byte 1 0101100 = 0xAC, second 0 0000010 = 0x02 → AC 02.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-017
    difficulty: intermediate
    tags: [wire-format, len, tlv]
    question: |
      How are strings, bytes, and embedded messages encoded on the protobuf wire?
    options:
      - "As a null-terminated sequence of bytes"
      - "Always base64-encoded inside a VARINT"
      - "As LEN fields: tag, then a varint length, then that many raw bytes (tag-length-value)"
      - "As fixed 32-byte blocks"
    answer: 2
    explanation: |
      Wire type 2 (LEN) is length-delimited: tag, a varint byte-length, then the payload
      bytes. This is the classic tag-length-value form used for strings, bytes, and sub-messages.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-018
    difficulty: advanced
    tags: [wire-format, zigzag, signed]
    question: |
      Why would you choose `sint32` over `int32` for a field that often holds small negative
      numbers?
    options:
      - "sint32 is stored as a fixed 4 bytes, which is smaller"
      - "sint32 is human-readable on the wire"
      - "int32 cannot represent negative numbers at all"
      - "sint32 uses ZigZag encoding so small-magnitude negatives stay compact instead of taking 10 bytes"
    answer: 3
    explanation: |
      Plain int32 sign-extends negatives to 10-byte varints. sint32/sint64 apply ZigZag
      encoding ((n<<1)^(n>>31)) mapping -1→1, 1→2, -2→3, so small negatives stay small.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-019
    difficulty: advanced
    tags: [wire-format, packed, repeated]
    question: |
      How are repeated scalar numeric fields encoded by default in proto3?
    options:
      - "Each element gets its own tag repeated once per value"
      - "Packed: one LEN field holds all the values concatenated"
      - "As a JSON array inside a bytes field"
      - "They cannot be repeated"
    answer: 1
    explanation: |
      In proto3 repeated scalar numeric fields are packed by default: a single
      length-delimited field carries all elements back-to-back, avoiding a tag per element.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-020
    difficulty: intermediate
    tags: [wire-format, tag, decoding]
    question: |
      For the field `int32 retries = 2;` set to the value 300, which byte sequence is
      correct?
    options:
      - "02 AC 02"
      - "16 2C 01"
      - "10 AC 02"
      - "20 96 01"
    answer: 2
    explanation: |
      tag = (2<<3)|0 = 16 = 0x10 (field 2, VARINT). 300 as varint = AC 02. So the field is
      10 AC 02.
    ref: "concepts.md#protobuf-wire-format-varints-and-tag-length-value"

  - id: grpc-protocol-buffers-021
    difficulty: beginner
    tags: [evolution, add-field]
    question: |
      What happens when an old client (built from an older .proto) receives a message
      containing a new field number it doesn't recognize?
    options:
      - "The parse fails with an error"
      - "It treats the field as unknown and either preserves or ignores it, without failing"
      - "It reuses the field for the first known field"
      - "It crashes because required fields are missing"
    answer: 1
    explanation: |
      Protobuf is forward/backward compatible: unknown fields are skipped (and often
      preserved for re-serialization), so adding new fields with new numbers doesn't break old peers.
    ref: "concepts.md#backward-and-forward-compatible-schema-evolution"

  - id: grpc-protocol-buffers-022
    difficulty: intermediate
    tags: [evolution, reserved]
    question: |
      When you delete a field from a protobuf message, what is the recommended safe practice?
    options:
      - "Immediately reuse its field number for a new field"
      - "Renumber all subsequent fields to fill the gap"
      - "Mark its number (and name) as `reserved` so they can never be reused"
      - "Change its type to bytes"
    answer: 2
    explanation: |
      Reserve the removed field's number and name (reserved 3; reserved "old_name";) so a
      future field can't accidentally reuse it and misinterpret in-flight data.
    ref: "concepts.md#backward-and-forward-compatible-schema-evolution"

  - id: grpc-protocol-buffers-023
    difficulty: advanced
    tags: [evolution, unsafe]
    question: |
      Which of the following is an UNSAFE, data-corrupting schema change?
    options:
      - "Adding a new field with a brand-new field number"
      - "Renaming a field while keeping its number"
      - "Reserving a deleted field's number"
      - "Reusing a previously-deleted field number for a different field/type"
    answer: 3
    explanation: |
      Reusing a field number for a different field silently corrupts data for peers using
      the old schema, which is why deleted numbers must be reserved. Renames are wire-safe
      (names aren't sent).
    ref: "concepts.md#backward-and-forward-compatible-schema-evolution"

  - id: grpc-protocol-buffers-024
    difficulty: advanced
    tags: [evolution, type-compat]
    question: |
      Which pair of scalar types is NOT wire-compatible for in-place schema evolution?
    options:
      - "int32 and int64 (both VARINT)"
      - "int32 and sint32"
      - "fixed32 and sfixed32"
      - "bool and int32 (both VARINT)"
    answer: 1
    explanation: |
      int32 and sint32 are both conceptually integers but use different encodings (sint32 is
      ZigZag), so they are NOT wire-compatible. The other listed pairs share a wire type/encoding.
    ref: "concepts.md#backward-and-forward-compatible-schema-evolution"

  - id: grpc-protocol-buffers-025
    difficulty: intermediate
    tags: [evolution, proto3, required]
    question: |
      Why did proto3 remove the `required` keyword?
    options:
      - "Because required fields made messages larger"
      - "Because a required field can never be safely removed and forces old peers to reject messages omitting it"
      - "Because required fields broke JSON mapping"
      - "Because it conflicted with field numbers 1–15"
    answer: 1
    explanation: |
      required was a design mistake: once shipped it can't be removed without breaking
      compatibility, since peers reject messages missing it. proto3 dropped it entirely.
    ref: "concepts.md#backward-and-forward-compatible-schema-evolution"

  - id: grpc-protocol-buffers-026
    difficulty: beginner
    tags: [rpc-types, unary]
    question: |
      Which gRPC RPC type is a classic single request / single response call?
    options:
      - "Bidirectional streaming"
      - "Server streaming"
      - "Client streaming"
      - "Unary"
    answer: 3
    explanation: |
      Unary RPC sends one request message and gets one response message back — the most
      common and REST-like shape.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-protocol-buffers-027
    difficulty: beginner
    tags: [rpc-types, server-streaming]
    question: |
      The signature `rpc List (Query) returns (stream Item);` describes which RPC type?
    options:
      - "Unary"
      - "Server streaming"
      - "Client streaming"
      - "Bidirectional streaming"
    answer: 1
    explanation: |
      `stream` on the response type only means one request, many response messages: server
      streaming, ideal for feeds, large result sets, or progress updates.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-protocol-buffers-028
    difficulty: intermediate
    tags: [rpc-types, client-streaming]
    question: |
      A client uploads many chunks and gets a single summary response at the end. Which RPC
      type fits, and how is it declared?
    options:
      - "Server streaming: rpc M (Req) returns (stream Resp)"
      - "Unary: rpc M (Req) returns (Resp)"
      - "Client streaming: rpc M (stream Req) returns (Resp)"
      - "Bidirectional: rpc M (stream Req) returns (stream Resp)"
    answer: 2
    explanation: |
      Client streaming (stream on the request) sends many messages then half-closes; the
      server replies once — perfect for uploads/aggregation.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-protocol-buffers-029
    difficulty: intermediate
    tags: [rpc-types, bidi]
    question: |
      In bidirectional streaming, what ordering guarantee does gRPC provide?
    options:
      - "Messages are globally ordered across both directions"
      - "No ordering is guaranteed at all"
      - "Only the first and last messages are ordered"
      - "Ordering is guaranteed within each direction of the single stream"
    answer: 3
    explanation: |
      Both sides read and write independently on one HTTP/2 stream; message order is
      preserved within each direction, but the two directions interleave freely.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-protocol-buffers-030
    difficulty: intermediate
    tags: [rpc-types, http2-mapping]
    question: |
      How many HTTP/2 streams does a single bidirectional-streaming gRPC call use?
    options:
      - "One stream per message"
      - "One stream for the whole call, carrying DATA frames both ways"
      - "Two streams, one per direction"
      - "A new stream each time the direction switches"
    answer: 1
    explanation: |
      All four gRPC RPC types map onto exactly one HTTP/2 stream per call. Streaming just
      changes how many DATA frames flow each way and when END_STREAM (half-close) is set.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-protocol-buffers-031
    difficulty: beginner
    tags: [codegen, contract-first]
    question: |
      What is the role of `protoc` (the protobuf compiler) in gRPC development?
    options:
      - "It runs the gRPC server at runtime"
      - "It compresses protobuf messages on the wire"
      - "It generates message types and service stubs from the .proto contract"
      - "It load-balances gRPC connections"
    answer: 2
    explanation: |
      protoc with language plugins reads the .proto and generates strongly-typed message
      classes and client/server stubs, enabling contract-first, cross-language development.
    ref: "concepts.md#code-generation-and-contract-first-development"

  - id: grpc-protocol-buffers-032
    difficulty: intermediate
    tags: [codegen, contract-first]
    question: |
      Why is gRPC described as "contract-first" and how does that differ from typical REST?
    options:
      - "gRPC generates the .proto from running code; REST is defined upfront"
      - "The .proto is the single shared source of truth generating clients/servers; REST's OpenAPI is often optional documentation that can drift"
      - "gRPC has no schema at all; REST always does"
      - "There is no difference; both are contract-first"
    answer: 1
    explanation: |
      In gRPC the .proto is authoritative and drives codegen for every language. REST
      schemas (OpenAPI) are frequently optional and can drift from the implementation.
    ref: "concepts.md#code-generation-and-contract-first-development"

  - id: grpc-protocol-buffers-033
    difficulty: advanced
    tags: [codegen, reflection]
    question: |
      A tool like grpcurl can call a server's methods without having the local .proto file.
      Which gRPC feature makes this possible?
    options:
      - "Server Reflection, which exposes the schema at runtime"
      - "HPACK header compression"
      - "TLS ALPN negotiation"
      - "The grpc-timeout header"
    answer: 0
    explanation: |
      The gRPC Server Reflection protocol lets a server advertise its service/message
      descriptors at runtime, so clients can construct calls dynamically without a local .proto.
    ref: "concepts.md#code-generation-and-contract-first-development"

  - id: grpc-protocol-buffers-034
    difficulty: beginner
    tags: [deadlines, timeout]
    question: |
      How is a per-call timeout transmitted in gRPC over HTTP/2?
    options:
      - "As a query parameter on the :path"
      - "As a field inside every protobuf message"
      - "As the grpc-timeout header, e.g. `grpc-timeout: 100m`"
      - "In the TLS handshake"
    answer: 2
    explanation: |
      The client sends grpc-timeout as an HTTP/2 header with a value and unit (H, M, S, m,
      u, n), e.g. 100m = 100 milliseconds.
    ref: "concepts.md#deadlines-timeouts-and-cancellation"

  - id: grpc-protocol-buffers-035
    difficulty: intermediate
    tags: [deadlines, propagation]
    question: |
      Why are gRPC deadlines preferred over independent per-hop timeouts in a call chain
      A → B → C?
    options:
      - "Deadlines are encrypted; timeouts are not"
      - "A deadline propagates the remaining budget down the chain so the whole chain gives up together"
      - "Deadlines disable retries automatically"
      - "Timeouts are not supported by HTTP/2"
    answer: 1
    explanation: |
      A deadline is an absolute time that B forwards (as remaining budget) to C. Per-hop
      timeouts that reset can let downstream work continue after the original caller quit.
    ref: "concepts.md#deadlines-timeouts-and-cancellation"

  - id: grpc-protocol-buffers-036
    difficulty: intermediate
    tags: [deadlines, status]
    question: |
      When a gRPC call's deadline elapses, which status code is returned?
    options:
      - "CANCELLED (1)"
      - "UNAVAILABLE (14)"
      - "DEADLINE_EXCEEDED (4)"
      - "RESOURCE_EXHAUSTED (8)"
    answer: 2
    explanation: |
      Exceeding the deadline terminates the RPC with DEADLINE_EXCEEDED (code 4). CANCELLED
      (1) is when the client explicitly cancels.
    ref: "concepts.md#deadlines-timeouts-and-cancellation"

  - id: grpc-protocol-buffers-037
    difficulty: advanced
    tags: [deadlines, antipattern]
    question: |
      A 4-hop gRPC chain sets a fresh 1-second timeout at each hop instead of propagating a
      deadline. The original caller gave up after 1 second. What is the consequence?
    options:
      - "Nothing; the behavior is identical to deadline propagation"
      - "Downstream hops can keep working up to ~4 seconds on a request already abandoned, wasting resources"
      - "The call immediately fails with INVALID_ARGUMENT"
      - "The TCP connection is forcibly reset at hop 2"
    answer: 1
    explanation: |
      Resetting a full timeout per hop means the chain can run far longer than the caller's
      budget, doing wasted work on abandoned requests and risking cascading exhaustion.
    ref: "concepts.md#deadlines-timeouts-and-cancellation"

  - id: grpc-protocol-buffers-038
    difficulty: beginner
    tags: [metadata]
    question: |
      What is gRPC "metadata" essentially, at the protocol level?
    options:
      - "The protobuf schema embedded in each message"
      - "A checksum of the payload"
      - "Key-value pairs carried as HTTP/2 headers (and trailers)"
      - "The TLS certificate chain"
    answer: 2
    explanation: |
      Metadata is a key-value side channel mapped onto HTTP/2 headers (leading) and trailers
      (trailing), used for auth tokens, tracing IDs, and custom context.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-039
    difficulty: intermediate
    tags: [metadata, binary]
    question: |
      How are binary-valued metadata entries handled on the wire?
    options:
      - "They are rejected; metadata must be ASCII"
      - "The key uses a `-bin` suffix and the value is base64-encoded"
      - "They are sent as a separate protobuf message"
      - "They are gzip-compressed and prefixed with 0x1f 0x8b"
    answer: 1
    explanation: |
      Binary metadata keys end in -bin (e.g. trace-context-bin) and their values are
      base64-encoded on the wire; plain keys carry ASCII values.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-040
    difficulty: beginner
    tags: [status, codes]
    question: |
      What does `grpc-status: 0` mean?
    options:
      - "The call is still in progress"
      - "An unknown error occurred"
      - "OK — the call succeeded"
      - "The server is unavailable"
    answer: 2
    explanation: |
      gRPC status code 0 is OK (success). gRPC has its own canonical code set, independent
      of HTTP status codes.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-041
    difficulty: advanced
    tags: [status, codes, semantics]
    question: |
      A client requests deletion of a directory, but the directory is non-empty so the
      server refuses. Which status code best fits — and how does it differ from
      INVALID_ARGUMENT?
    options:
      - "INVALID_ARGUMENT (3), because any refusal means bad input"
      - "FAILED_PRECONDITION (9): the argument is fine but the system isn't in the required state; INVALID_ARGUMENT is for input bad regardless of state"
      - "UNAVAILABLE (14), because the resource can't be served"
      - "NOT_FOUND (5), because the operation can't complete"
    answer: 1
    explanation: |
      Use FAILED_PRECONDITION when the request is well-formed but the system state blocks it
      (non-empty directory). INVALID_ARGUMENT is for arguments that are wrong regardless of state.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-042
    difficulty: intermediate
    tags: [status, retry]
    question: |
      Which gRPC status code specifically signals a transient failure that is generally safe
      to retry with backoff?
    options:
      - "INTERNAL (13)"
      - "FAILED_PRECONDITION (9)"
      - "UNAVAILABLE (14)"
      - "PERMISSION_DENIED (7)"
    answer: 2
    explanation: |
      UNAVAILABLE (14) indicates a transient condition (e.g., server briefly down); it's the
      canonical retry-with-backoff code. INTERNAL and FAILED_PRECONDITION are not retry-safe.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-043
    difficulty: intermediate
    tags: [status, codes]
    question: |
      A request arrives with a missing or invalid credential. Which status code applies?
    options:
      - "UNAUTHENTICATED (16)"
      - "PERMISSION_DENIED (7)"
      - "INVALID_ARGUMENT (3)"
      - "ABORTED (10)"
    answer: 0
    explanation: |
      UNAUTHENTICATED (16) is for missing/invalid credentials (identity not established).
      PERMISSION_DENIED (7) is when identity is known but not authorized for the action.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-044
    difficulty: beginner
    tags: [grpc-web, browser]
    question: |
      Why can't a web browser speak native gRPC directly?
    options:
      - "Browsers don't support TLS 1.3"
      - "Protobuf is banned in browsers for security reasons"
      - "Browser fetch/XHR APIs don't expose the raw HTTP/2 frame layer or let JS read HTTP trailers"
      - "Browsers only allow GET and POST, but gRPC needs a custom method"
    answer: 2
    explanation: |
      Browsers can't control HTTP/2 DATA frames or read HTTP/2 trailers via fetch/XHR, and
      can't force HTTP/2 at that level — so they can't produce gRPC's exact wire behavior.
    ref: "concepts.md#grpc-web-and-the-browser-limitation"

  - id: grpc-protocol-buffers-045
    difficulty: intermediate
    tags: [grpc-web, trailers]
    question: |
      How does gRPC-Web deliver the gRPC status, given browsers can't read HTTP trailers?
    options:
      - "It omits the status entirely"
      - "It uses a WebSocket side channel"
      - "It sends the status as a cookie"
      - "It encodes the trailers into the response body as a trailer frame after the message frames"
    answer: 3
    explanation: |
      gRPC-Web moves trailers in-band: a trailer frame is appended to the response body so
      the browser client can parse grpc-status without native trailer support.
    ref: "concepts.md#grpc-web-and-the-browser-limitation"

  - id: grpc-protocol-buffers-046
    difficulty: intermediate
    tags: [grpc-web, proxy, streaming]
    question: |
      Which statement about gRPC-Web is correct?
    options:
      - "It supports all four RPC types identically to native gRPC"
      - "It typically needs a translating proxy (e.g. Envoy) and does not generally support client or bidirectional streaming"
      - "It requires HTTP/3 and QUIC"
      - "It sends JSON instead of protobuf"
    answer: 1
    explanation: |
      gRPC-Web needs a proxy to translate to native gRPC and supports unary and
      server-streaming; client and bidirectional streaming aren't generally supported in browsers.
    ref: "concepts.md#grpc-web-and-the-browser-limitation"

  - id: grpc-protocol-buffers-047
    difficulty: beginner
    tags: [comparison, rest, readability]
    question: |
      Compared with REST/JSON, what is a primary trade-off of gRPC/protobuf?
    options:
      - "gRPC payloads are larger than JSON"
      - "gRPC cannot be encrypted"
      - "gRPC is not human-readable and needs protobuf-aware tooling, unlike JSON you can read with curl"
      - "gRPC lacks a schema"
    answer: 2
    explanation: |
      Protobuf is compact binary, not human-readable; you can't just curl it and read the
      body. That's the debuggability/tooling cost of gRPC's efficiency and strong contract.
    ref: "concepts.md#grpc-vs-rest-vs-graphql-trade-offs"

  - id: grpc-protocol-buffers-048
    difficulty: intermediate
    tags: [comparison, graphql]
    question: |
      What problem does GraphQL specifically address that plain REST often struggles with?
    options:
      - "Binary payload efficiency"
      - "Over-fetching and under-fetching, by letting the client specify exactly which fields it wants"
      - "Native bidirectional streaming"
      - "Contract-first codegen across languages"
    answer: 1
    explanation: |
      GraphQL lets clients request precisely the fields they need from a single endpoint,
      reducing over/under-fetching. Its weaknesses include hard HTTP caching and resolver complexity.
    ref: "concepts.md#grpc-vs-rest-vs-graphql-trade-offs"

  - id: grpc-protocol-buffers-049
    difficulty: intermediate
    tags: [comparison, fit-for-purpose]
    question: |
      Which scenario is the strongest fit for gRPC over REST or GraphQL?
    options:
      - "A public API consumed directly by many third-party browsers"
      - "A simple static website's content API needing HTTP caching"
      - "Low-latency, high-throughput internal (east-west) service-to-service communication with streaming"
      - "An API whose main requirement is being readable and debuggable with curl"
    answer: 2
    explanation: |
      gRPC excels at internal microservice traffic: typed contracts, low overhead, HTTP/2
      multiplexing, and native streaming. Public/browser-facing needs favor REST/GraphQL for reach.
    ref: "concepts.md#grpc-vs-rest-vs-graphql-trade-offs"

  - id: grpc-protocol-buffers-050
    difficulty: advanced
    tags: [comparison, load-balancing]
    question: |
      Why can a naive L4 (connection-level) load balancer poorly distribute gRPC traffic?
    options:
      - "gRPC uses UDP, which L4 balancers can't route"
      - "One long-lived HTTP/2 connection carries many streams, so an L4 balancer pins all of them to a single backend"
      - "gRPC opens a new connection per RPC, overwhelming the balancer"
      - "gRPC disables keep-alive, so connections churn constantly"
    answer: 1
    explanation: |
      Because gRPC multiplexes many RPCs over one persistent HTTP/2 connection, an L4
      balancer that balances by connection sends all those streams to one backend. L7/gRPC-aware
      balancing is needed to spread load.
    ref: "concepts.md#grpc-vs-rest-vs-graphql-trade-offs"

  - id: grpc-protocol-buffers-051
    difficulty: intermediate
    tags: [status, http-mapping]
    question: |
      In native gRPC, when would the HTTP/2 :status be something other than 200?
    options:
      - "Whenever the gRPC status is not OK"
      - "Only for streaming calls"
      - "For transport/protocol-level errors (e.g. a 404 for a missing service), not for application RPC errors"
      - "Never; it is always 200"
    answer: 2
    explanation: |
      Application RPC errors keep HTTP 200 with a non-zero grpc-status trailer. Non-200 HTTP
      is reserved for transport/protocol failures like an unroutable path.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-052
    difficulty: advanced
    tags: [idl, field-numbers, range]
    question: |
      What is the valid range of protobuf field numbers, and which sub-range is reserved for
      protobuf's own use?
    options:
      - "1 to 65535; 0–1023 reserved"
      - "0 to 255; 200–255 reserved"
      - "1 to 536,870,911 (2^29−1); 19000–19999 reserved"
      - "1 to 2,147,483,647; none reserved"
    answer: 2
    explanation: |
      Field numbers run 1 to 2^29−1 (536,870,911). The range 19000–19999 is reserved for the
      Protocol Buffers implementation and can't be used.
    ref: "concepts.md#protocol-buffers-idl-messages-fields-and-field-numbers"

  - id: grpc-protocol-buffers-053
    difficulty: intermediate
    tags: [http2, hpack, headers]
    question: |
      Which HTTP/2 feature reduces the overhead of repeated gRPC metadata like auth tokens
      and content-type across many calls?
    options:
      - "Server push"
      - "HPACK header compression (RFC 7541)"
      - "The CONNECT protocol"
      - "TLS session tickets"
    answer: 1
    explanation: |
      HPACK compresses HTTP/2 headers per connection, so repeated gRPC metadata is sent
      efficiently rather than re-transmitted in full each call.
    ref: "concepts.md#grpc-over-http2-why-http2"

  - id: grpc-protocol-buffers-054
    difficulty: advanced
    tags: [status, rich-errors]
    question: |
      Where does gRPC carry rich, structured error details (e.g. a google.rpc.Status with
      error_details)?
    options:
      - "In the response DATA frame as a second message"
      - "In the :status pseudo-header"
      - "In the grpc-status-details-bin trailer"
      - "In a separate follow-up RPC"
    answer: 2
    explanation: |
      Structured error payloads travel base64-encoded in the grpc-status-details-bin trailer,
      alongside the numeric grpc-status and grpc-message.
    ref: "concepts.md#metadata-and-grpc-status-codes"

  - id: grpc-protocol-buffers-055
    difficulty: intermediate
    tags: [rpc-types, half-close]
    question: |
      In a client-streaming RPC, what does the client do to signal it has finished sending
      request messages?
    options:
      - "Closes the entire TCP connection"
      - "Sends a special protobuf message with field 0"
      - "Half-closes its side of the stream (sets END_STREAM), after which the server sends its single response"
      - "Waits for the server to time out"
    answer: 2
    explanation: |
      The client sends all its messages then half-closes (END_STREAM on its direction). The
      server, having read the full stream, then returns its one response and final status.
    ref: "concepts.md#the-four-rpc-types"

  - id: grpc-protocol-buffers-056
    difficulty: beginner
    tags: [comparison, streaming]
    question: |
      Which statement about streaming support is accurate?
    options:
      - "REST natively supports full bidirectional streaming; gRPC does not"
      - "gRPC natively supports all four streaming modes, while REST bolts streaming on via SSE/WebSocket"
      - "Neither gRPC nor REST can stream"
      - "GraphQL has richer native streaming than gRPC"
    answer: 1
    explanation: |
      gRPC has unary plus server-, client-, and bidirectional streaming as first-class
      modes over HTTP/2. REST relies on add-ons (SSE, WebSocket) for streaming.
    ref: "concepts.md#grpc-vs-rest-vs-graphql-trade-offs"

  - id: grpc-protocol-buffers-057
    difficulty: expert
    tags: [http2, trailers-only, errors]
    question: |
      A gRPC server rejects a request before producing any response message, sending a
      single HEADERS frame with :status 200, content-type, grpc-status 3, grpc-message, and
      END_STREAM — no DATA and no separate leading-headers frame. What is this called, and
      why does it matter for automatic retries?
    options:
      - "A Trailers-Only response; because no leading headers were sent, the RPC hasn't committed and can still be retried"
      - "A malformed response; the client must treat it as a transport error and reconnect"
      - "A server-push response; it commits the RPC immediately and blocks retries"
      - "A GOAWAY response; it drains the connection and all streams must migrate"
    answer: 0
    explanation: |
      Combining leading and trailing metadata into one HEADERS frame is the Trailers-Only
      form, used for errors known before any message is produced. Because the client never
      received leading response headers, the attempt is not committed and remains retryable.
    ref: "concepts.md#http2-mapping-internals-flow-control-goaway-and-trailers-only"

  - id: grpc-protocol-buffers-058
    difficulty: expert
    tags: [http2, flow-control, backpressure]
    question: |
      A server-streaming RPC pushes results far faster than a slow client consumes them.
      At the protocol level, what stops the server from buffering unbounded data?
    options:
      - "The grpc-timeout header forces the server to drop messages after the deadline"
      - "TCP Nagle's algorithm coalesces and discards excess frames"
      - "HTTP/2 flow control: once the stream/connection receive window is exhausted, the server must stop sending until WINDOW_UPDATE frames replenish it"
      - "HPACK compression shrinks the backlog until it fits in one frame"
    answer: 2
    explanation: |
      gRPC streaming backpressure is HTTP/2 flow control. Per-stream and per-connection
      windows bound in-flight bytes; a producer blocks when the window is empty and resumes
      when the receiver issues WINDOW_UPDATE, so a slow reader throttles a fast writer.
    ref: "concepts.md#http2-mapping-internals-flow-control-goaway-and-trailers-only"

  - id: grpc-protocol-buffers-059
    difficulty: advanced
    tags: [http2, goaway, drain]
    question: |
      During a graceful server shutdown, the server sends a GOAWAY frame carrying a
      last-stream-ID. What does a client learn about streams with IDs greater than that
      value?
    options:
      - "They were accepted and must be allowed to finish on this connection"
      - "They must be downgraded to HTTP/1.1"
      - "They will be migrated automatically to a new connection by the transport"
      - "They were not processed by this server and are safe to retry on another connection"
    answer: 3
    explanation: |
      GOAWAY's last-stream-ID is the highest stream the sender will process. Streams above
      it were never accepted, so the client can safely re-issue them elsewhere — the basis
      for transparent retries on drain.
    ref: "concepts.md#http2-mapping-internals-flow-control-goaway-and-trailers-only"

  - id: grpc-protocol-buffers-060
    difficulty: expert
    tags: [retries, retry-policy, service-config]
    question: |
      A team sets retryPolicy.maxAttempts to 12 in their service config to be extra
      resilient. What actually happens?
    options:
      - "All 12 attempts run; there is no cap"
      - "The config is rejected and retries are disabled entirely"
      - "The client caps maxAttempts at 5, so at most 5 total attempts occur"
      - "maxAttempts above 10 silently switches the method to hedging"
    answer: 2
    explanation: |
      Per gRFC A6, retryPolicy.maxAttempts must be greater than 1 and is capped at 5 by the
      client. Larger values are clamped to 5, so the extra attempts never happen.
    ref: "concepts.md#retries-hedging-and-retry-throttling"

  - id: grpc-protocol-buffers-061
    difficulty: expert
    tags: [retries, hedging, tail-latency]
    question: |
      How does a hedgingPolicy differ from a retryPolicy in when it issues additional
      attempts?
    options:
      - "Hedging retries only after the first attempt returns a fatal error, exactly like retryPolicy but faster"
      - "Hedging opens a second TCP connection but sends the request only once"
      - "Hedging sends a parallel attempt to another backend after hedgingDelay without waiting for the first to fail, reducing tail latency"
      - "Hedging and retryPolicy can both be active on the same method for layered protection"
    answer: 2
    explanation: |
      Hedging proactively fires another attempt after hedgingDelay without waiting for a
      failure, taking the first non-fatal response and cancelling the rest — trading
      duplicate work for lower tail latency. A method uses retry OR hedging, not both.
    ref: "concepts.md#retries-hedging-and-retry-throttling"

  - id: grpc-protocol-buffers-062
    difficulty: expert
    tags: [retries, throttling, metastable]
    question: |
      With retryThrottling { maxTokens: 100, tokenRatio: 0.1 }, a backend starts failing
      broadly. What behavior prevents a retry storm?
    options:
      - "Each success decrements a token and each failure adds tokenRatio, blocking retries when tokens exceed maxTokens/2"
      - "Every RPC (success or failure) costs one token, and retries stop when the bucket empties"
      - "Each failure decrements the token count by 1 and each success adds tokenRatio (0.1); retries are disabled while tokens are below maxTokens/2 (50)"
      - "Tokens are per-RPC, so a single failing call can never affect other calls' retries"
    answer: 2
    explanation: |
      The retry token bucket starts at maxTokens; failures cost 1 token, successes add
      tokenRatio. Retries are suppressed once the count drops below maxTokens/2, so a broad
      failure rapidly exhausts the budget and halts amplification — the metastable defense.
    ref: "concepts.md#retries-hedging-and-retry-throttling"

  - id: grpc-protocol-buffers-063
    difficulty: expert
    tags: [retries, commit-point, trailers-only]
    question: |
      To keep early server errors retryable under gRPC's automatic retry rules, how should a
      server behave, and why?
    options:
      - "Always send leading headers immediately, because commit happens only on the response DATA frame"
      - "Defer leading headers until the first response message and use Trailers-Only for early errors, because receiving response headers commits the RPC and makes it non-retryable"
      - "Send an RST_STREAM with REFUSED_STREAM for every error so the client retries"
      - "Set grpc-retry-pushback-ms to 0 on all responses to force a retry"
    answer: 1
    explanation: |
      An attempt commits (becomes non-retryable) once the client receives response headers
      or an outgoing message overflows the send buffer. Deferring leading headers and using
      Trailers-Only for pre-message errors keeps the call within the retry-eligible window.
    ref: "concepts.md#retries-hedging-and-retry-throttling"

  - id: grpc-protocol-buffers-064
    difficulty: advanced
    tags: [retries, pushback, metadata]
    question: |
      A server includes grpc-retry-pushback-ms with a negative value in its response
      trailers. How must a compliant client interpret it?
    options:
      - "Retry immediately, since negative means zero delay"
      - "Wait the absolute value of the number of milliseconds, then retry"
      - "Do not retry this RPC at all"
      - "Ignore it and fall back to the exponential backoff schedule"
    answer: 2
    explanation: |
      grpc-retry-pushback-ms lets the server dictate retry timing. A non-negative value is a
      delay before the next retry; a negative or unparseable value instructs the client to
      stop retrying entirely.
    ref: "concepts.md#retries-hedging-and-retry-throttling"

  - id: grpc-protocol-buffers-065
    difficulty: expert
    tags: [retries, transparent, refused-stream]
    question: |
      A client's RPC hits a RST_STREAM with error code REFUSED_STREAM (the server never ran
      any application logic). Under gRFC A6, how is this handled relative to the retry budget?
    options:
      - "It is a transparent retry that does NOT count against maxAttempts or the retry budget"
      - "It is a normal retry and decrements both maxAttempts and the retry token budget"
      - "It is fatal and surfaces UNAVAILABLE to the caller without retry"
      - "It is retried only if the method appears in retryableStatusCodes"
    answer: 0
    explanation: |
      REFUSED_STREAM proves the request never reached application logic, so the client
      retries transparently. Transparent retries are free — they don't consume maxAttempts
      or retry-throttling tokens, since no work was done and no state was affected.
    ref: "concepts.md#retries-hedging-and-retry-throttling"

  - id: grpc-protocol-buffers-066
    difficulty: advanced
    tags: [service-config, wait-for-ready, unavailable]
    question: |
      During a rolling deploy, a channel briefly has no ready subchannel. With default
      settings, what does an RPC issued in that instant do, and how does wait_for_ready=true
      change it?
    options:
      - "Default queues the RPC forever; wait_for_ready makes it fail fast"
      - "Default returns DEADLINE_EXCEEDED instantly; wait_for_ready retries three times"
      - "Both behave identically because HTTP/2 auto-reconnects transparently"
      - "Default fails fast with UNAVAILABLE; wait_for_ready=true queues the RPC until a connection is ready or the deadline elapses"
    answer: 3
    explanation: |
      By default an RPC with no ready connection fails fast with UNAVAILABLE.
      wait_for_ready=true instead holds the RPC until the channel connects (or the deadline
      passes), trading fail-fast shedding for resilience across transient reconnects.
    ref: "concepts.md#service-config-and-wait_for_ready"

  - id: grpc-protocol-buffers-067
    difficulty: advanced
    tags: [service-config, control-plane, dns]
    question: |
      Which statement best describes gRPC service config?
    options:
      - "A compile-time annotation in the .proto that fixes timeouts per method"
      - "A channel-level JSON control plane (methodConfig timeouts, retry/hedging, waitForReady, LB policy, retryThrottling) delivered via DNS TXT or xDS"
      - "A per-message header that overrides the grpc-timeout value"
      - "The TLS configuration that selects cipher suites for the channel"
    answer: 1
    explanation: |
      Service config is a JSON document (per-service/per-method timeouts, retry/hedging,
      waitForReady, message size limits, load-balancing policy, and top-level
      retryThrottling) delivered through DNS TXT records or xDS — the runtime control plane.
    ref: "concepts.md#service-config-and-wait_for_ready"

  - id: grpc-protocol-buffers-068
    difficulty: expert
    tags: [load-balancing, xds, orca]
    question: |
      In "look-aside" (lookaside) load balancing, an external service tells a gRPC client
      which backends to use and reports their load. Which control plane has largely
      superseded the original gRPCLB protocol for this, and how is per-backend load reported?
    options:
      - "xDS (the Envoy control-plane API, gRFC A27/A52); backend load is reported in-band via ORCA metrics or out-of-band"
      - "DNS SRV records refreshed on every RPC; load is inferred from measured TCP round-trip time"
      - "HTTP/2 server push; load is advertised by the server in SETTINGS frames"
      - "The HPACK dynamic table; load is encoded in the table-size update"
    answer: 0
    explanation: |
      The original gRPCLB lookaside protocol is now largely superseded by xDS (the Envoy
      control-plane API, gRFC A27/A52). Backends report load to the client either in-band via
      ORCA (Open Request Cost Aggregation) metrics or out-of-band, informing LB decisions.
    ref: "concepts.md#client-side-load-balancing-and-the-l4-pinning-pitfall"

  - id: grpc-protocol-buffers-069
    difficulty: expert
    tags: [load-balancing, max-connection-age, rebalance]
    question: |
      You must keep an L4 balancer but want gRPC traffic to spread onto newly added backends
      without adopting a client-side LB library. Which server-side setting most directly
      forces periodic rebalancing?
    options:
      - "KEEPALIVE_TIMEOUT, so dead connections are pruned faster"
      - "MAX_CONNECTION_AGE, so connections are recycled via GOAWAY, forcing clients to re-resolve and reconnect (and be rebalanced)"
      - "MAX_CONCURRENT_STREAMS, so each connection carries fewer RPCs"
      - "PERMIT_KEEPALIVE_TIME, so clients ping less often"
    answer: 1
    explanation: |
      MAX_CONNECTION_AGE bounds connection lifetime; when it expires the server sends GOAWAY
      and the client re-resolves and opens a fresh connection, which the L4 balancer can
      route to a different (possibly new) backend — spreading load over time.
    ref: "concepts.md#client-side-load-balancing-and-the-l4-pinning-pitfall"

  - id: grpc-protocol-buffers-070
    difficulty: advanced
    tags: [load-balancing, channel, picker]
    question: |
      In gRPC's client channel architecture, which component selects a specific subchannel
      for each individual RPC and therefore must be extremely fast?
    options:
      - "The name resolver"
      - "The HPACK encoder"
      - "The picker produced by the LB policy"
      - "The interceptor chain"
    answer: 2
    explanation: |
      The pipeline is resolver -> LB policy -> subchannels -> picker. The picker runs on the
      hot path, choosing a subchannel per RPC (e.g. round-robin), so it must be O(1) and
      allocation-light.
    ref: "concepts.md#client-side-load-balancing-and-the-l4-pinning-pitfall"

  - id: grpc-protocol-buffers-071
    difficulty: expert
    tags: [keepalive, goaway, enhance-your-calm]
    question: |
      A fleet of clients is configured with KEEPALIVE_TIME far below the server's
      PERMIT_KEEPALIVE_TIME and KEEPALIVE_WITHOUT_CALLS enabled. Clients report connections
      being dropped shortly after connecting. What is happening?
    options:
      - "The clients exceed the server's permitted ping rate, so the server sends GOAWAY with debug data too_many_pings (ENHANCE_YOUR_CALM, 0x0b) and closes the connection"
      - "The TLS session tickets expired and force renegotiation"
      - "The server's MAX_CONCURRENT_STREAMS is exhausted by the pings"
      - "The clients' deadlines are elapsing and returning DEADLINE_EXCEEDED"
    answer: 0
    explanation: |
      Pinging more frequently than PERMIT_KEEPALIVE_TIME (default 5 min) triggers the
      server's abuse defense: it returns GOAWAY with too_many_pings, the HTTP/2
      ENHANCE_YOUR_CALM (0x0b) code, and drops the connection.
    ref: "concepts.md#keepalive-and-connection-lifecycle"

  - id: grpc-protocol-buffers-072
    difficulty: advanced
    tags: [keepalive, connection-lifecycle, drain]
    question: |
      What is the purpose of MAX_CONNECTION_AGE_GRACE on a gRPC server?
    options:
      - "It sets how long a connection may sit idle before being closed"
      - "It caps the total number of connections a server accepts"
      - "It provides a grace window after MAX_CONNECTION_AGE for in-flight RPCs to drain (via GOAWAY) before the connection is forcibly closed"
      - "It delays keepalive pings until the connection is that old"
    answer: 2
    explanation: |
      After MAX_CONNECTION_AGE fires, the server sends GOAWAY and allows
      MAX_CONNECTION_AGE_GRACE for existing RPCs to complete gracefully before forcing the
      connection shut. MAX_CONNECTION_IDLE is the separate idle timeout.
    ref: "concepts.md#keepalive-and-connection-lifecycle"

  - id: grpc-protocol-buffers-073
    difficulty: expert
    tags: [health-checking, service-string, semantics]
    question: |
      Using the standard grpc.health.v1.Health service, what does a Check request with an
      empty service string ("") mean, and what happens if you Check a service name the
      server doesn't know?
    options:
      - "Empty string is invalid; unknown services return SERVING by default"
      - "Empty string queries overall server health; an unknown service on Check returns the gRPC status NOT_FOUND"
      - "Empty string queries every registered service; unknown services return UNAVAILABLE"
      - "Empty string means the reflection service; unknown services return UNIMPLEMENTED"
    answer: 1
    explanation: |
      An empty service string queries the server's overall health. Checking a service the
      server hasn't registered returns the gRPC status NOT_FOUND (5). SERVICE_UNKNOWN status
      is used by Watch, not returned as a Check error.
    ref: "concepts.md#health-checking-protocol"

  - id: grpc-protocol-buffers-074
    difficulty: advanced
    tags: [health-checking, watch, streaming]
    question: |
      How do the Check and Watch methods of the gRPC health protocol differ?
    options:
      - "Check is a one-shot unary query; Watch is server-streaming and pushes status changes over time"
      - "Check is server-streaming; Watch is unary"
      - "Both are unary, but Watch requires mTLS"
      - "Check returns a boolean; Watch returns the full descriptor set"
    answer: 0
    explanation: |
      Check is unary (a single status snapshot). Watch is server-streaming: the server pushes
      an initial status and then a new HealthCheckResponse each time the service's serving
      status changes, letting a load balancer react without polling.
    ref: "concepts.md#health-checking-protocol"

  - id: grpc-protocol-buffers-075
    difficulty: expert
    tags: [compression, security, crime-breach]
    question: |
      A security review flags that per-message gRPC compression is enabled on an RPC whose
      responses embed a secret token alongside attacker-influenced fields. What is the
      concern?
    options:
      - "Compression corrupts the 5-byte length prefix, causing framing errors"
      - "Compressing secret-bearing data mixed with attacker-controlled input before encryption enables CRIME/BREACH-class attacks that recover secrets via compressed-length side channels"
      - "gzip is not supported by gRPC, so the peer will return UNIMPLEMENTED"
      - "Compression forces all messages to identity encoding, leaking the plaintext"
    answer: 1
    explanation: |
      When compression runs before encryption and a payload mixes a secret with
      attacker-controlled content, compressed size leaks information about the secret —
      CRIME/BREACH. Being able to disable compression on secret-bearing messages mitigates it.
    ref: "concepts.md#message-compression"

  - id: grpc-protocol-buffers-076
    difficulty: advanced
    tags: [compression, headers, unimplemented]
    question: |
      A client sends a message with grpc-encoding: snappy, but the server can't decompress
      snappy. What should the server do?
    options:
      - "Silently drop the message and return OK"
      - "Return UNIMPLEMENTED (12) and advertise the codecs it supports via grpc-accept-encoding"
      - "Return INVALID_ARGUMENT (3) because the payload is malformed"
      - "Transcode the message to identity and process it anyway"
    answer: 1
    explanation: |
      A peer that receives a message compressed with an algorithm it can't handle returns
      UNIMPLEMENTED (12), and uses grpc-accept-encoding to advertise which algorithms it does
      support so the sender can retry appropriately.
    ref: "concepts.md#message-compression"

  - id: grpc-protocol-buffers-077
    difficulty: expert
    tags: [compression, framing, per-message]
    question: |
      Within a single server-streaming response, message 1 is sent gzip-compressed and
      message 2 uncompressed. How is this expressed on the wire, and is it legal?
    options:
      - "It is illegal; all messages in a stream must use the same compression"
      - "It is legal; the 1-byte compressed-flag in each message's 5-byte length prefix is set per message (1 for gzip, 0 for identity)"
      - "It is legal, but only if grpc-encoding is re-sent as a DATA frame between messages"
      - "It is legal only over HTTP/3, where each message is its own QUIC stream"
    answer: 1
    explanation: |
      The compressed-flag byte in each message's 5-byte prefix indicates whether that
      specific message is compressed, so compression can vary message-to-message (and by
      direction) within one stream. Message 1 sets the flag to 1, message 2 to 0.
    ref: "concepts.md#message-compression"

  - id: grpc-protocol-buffers-078
    difficulty: expert
    tags: [wire-format, determinism, hashing]
    question: |
      A team hashes serialized protobuf bytes to dedupe logically identical messages and
      finds duplicates slipping through (false negatives). What is the fundamental problem?
    options:
      - "Protobuf adds a random nonce to every message"
      - "Protobuf serialization is non-deterministic by default (map order, encoder choices), so equal messages can produce different bytes; there is no canonical form stable across languages/versions"
      - "The hash function collides on protobuf's varint encoding"
      - "Unknown fields are always stripped, changing the bytes each time"
    answer: 1
    explanation: |
      Protobuf has no canonical serialization. Map ordering and encoder choices vary, and
      even deterministic mode is only stable within one binary. Two encoders can emit
      different bytes for the same logical message, so hashing serialized bytes is unreliable.
    ref: "concepts.md#wire-format-edge-cases-maps-merge-and-determinism"

  - id: grpc-protocol-buffers-079
    difficulty: expert
    tags: [wire-format, merge, concatenation]
    question: |
      Two serialized protobuf messages a and b of the same type are concatenated and parsed
      as parse(a + b). For a singular sub-message field present in both, a repeated field,
      and a singular scalar, what is the result?
    options:
      - "Parsing fails because a field number appears twice"
      - "Only the fields from a survive; b is ignored after the first message ends"
      - "Sub-messages merge recursively, repeated fields concatenate, and the singular scalar takes the last (b's) value — i.e. parse(a).MergeFrom(parse(b))"
      - "All duplicate fields are dropped and set to their defaults"
    answer: 2
    explanation: |
      Concatenation equals merge: parse(a+b) == parse(a).MergeFrom(parse(b)). Repeated fields
      concatenate, singular scalars are last-one-wins (b), and embedded messages merge
      recursively. This is a defining property of the wire format.
    ref: "concepts.md#wire-format-edge-cases-maps-merge-and-determinism"

  - id: grpc-protocol-buffers-080
    difficulty: advanced
    tags: [wire-format, map, encoding]
    question: |
      How is a protobuf map<string, int32> represented on the wire?
    options:
      - "As a single JSON object inside a bytes field"
      - "As a repeated entry message with key = field 1 and value = field 2 (LEN records); entry order is not guaranteed"
      - "As two parallel packed arrays, one of keys and one of values"
      - "As a special MAP wire type (6) with inline key/value pairs"
    answer: 1
    explanation: |
      A map is syntactic sugar for repeated message { key = 1; value = 2; } encoded as LEN
      records. There is no dedicated map wire type, and entry ordering on the wire is
      unspecified — a common reason not to rely on serialized-byte equality.
    ref: "concepts.md#wire-format-edge-cases-maps-merge-and-determinism"

  - id: grpc-protocol-buffers-081
    difficulty: advanced
    tags: [wire-format, packed, interop]
    question: |
      A field defined as repeated int32 was originally serialized in unpacked form by an old
      writer; a new schema marks it [packed=true]. Can a new (packed-expecting) parser read
      the old unpacked bytes?
    options:
      - "No; unpacked and packed encodings are wire-incompatible and parsing fails"
      - "Only if the field number is below 16"
      - "Only if the values are non-negative"
      - "Yes; compliant parsers must accept both packed and unpacked repeated encodings, so toggling [packed] is wire-compatible"
    answer: 3
    explanation: |
      For interoperability the spec requires parsers to accept a repeated numeric field in
      either packed or unpacked form regardless of the current schema setting, so switching
      the [packed] option is a safe, wire-compatible change.
    ref: "concepts.md#wire-format-edge-cases-maps-merge-and-determinism"

  - id: grpc-protocol-buffers-082
    difficulty: expert
    tags: [presence, fieldmask, patch]
    question: |
      An API offers PATCH semantics where a client wants to set count to 0 (explicitly) or
      leave it unchanged. Why does an implicit-presence proto3 int32 fail here, and what
      fixes it?
    options:
      - "It fails because int32 can't hold 0; switch to int64"
      - "It fails because PATCH requires the required keyword, which proto3 removed"
      - "It fails because implicit-presence defaults aren't serialized, so 0 is indistinguishable from unset; use optional (explicit presence) or a FieldMask of paths to update"
      - "It works fine; proto3 always tracks presence for scalars"
    answer: 2
    explanation: |
      With implicit presence, a field equal to its default isn't serialized and reads as the
      default whether set or absent, so 0 and unset collapse. Marking it optional (explicit
      presence) or using a FieldMask to name updated paths restores clear PATCH semantics.
    ref: "concepts.md#field-presence-deeper"

  - id: grpc-protocol-buffers-083
    difficulty: expert
    tags: [presence, oneof, serialization]
    question: |
      Which of these fields will serialize its value even when that value equals the type
      default (e.g. 0 or "")?
    options:
      - "A proto3 scalar declared without optional (implicit presence)"
      - "A repeated field with a single zero element removed"
      - "An explicit-presence field: an optional scalar, a message field, or a oneof member that was explicitly set"
      - "A map entry whose value is the default"
    answer: 2
    explanation: |
      Explicit presence (optional scalar, message-typed field, or a set oneof member) tracks
      a hasbit, so an explicitly-set default value is still serialized. Implicit-presence
      scalars at their default are omitted, and repeated/maps never track presence.
    ref: "concepts.md#field-presence-deeper"

  - id: grpc-protocol-buffers-084
    difficulty: expert
    tags: [editions, features, proto2-proto3]
    question: |
      Protobuf Editions (edition = "2023") replace the proto2/proto3 syntax split. How is a
      field's presence behavior or an enum's openness now controlled?
    options:
      - "By choosing syntax = proto2 vs proto3 at the top of the file, as before"
      - "Via features such as field_presence (IMPLICIT/EXPLICIT/LEGACY_REQUIRED) and enum_type (OPEN/CLOSED) applied at file/message/field scope"
      - "By setting a runtime flag in the generated code"
      - "Editions removed enums and implicit presence entirely"
    answer: 1
    explanation: |
      Editions unify proto2 and proto3 into one language whose behaviors are tuned by
      features (field_presence, enum_type, repeated_field_encoding, utf8_validation) scoped
      per file/message/field, rather than a single syntax keyword.
    ref: "concepts.md#protobuf-editions-2023-and-2024"

  - id: grpc-protocol-buffers-085
    difficulty: advanced
    tags: [interceptors, middleware, cross-cutting]
    question: |
      Where in a gRPC application do concerns like auth validation, tracing propagation, and
      metrics typically live, without polluting business logic?
    options:
      - "Inside each generated message's serialize method"
      - "In the .proto file as service-level annotations executed by protoc"
      - "In the HPACK dynamic table configuration"
      - "In interceptors (client/server, unary/streaming) that chain around the handler/stub"
    answer: 3
    explanation: |
      Interceptors are gRPC's middleware: unary/streaming and client/server variants that
      chain around each call. Auth, deadline injection, retries, logging, metrics, and
      tracing live there, mirroring HTTP middleware and keeping handlers focused.
    ref: "concepts.md#interceptors-and-middleware"

  - id: grpc-protocol-buffers-086
    difficulty: expert
    tags: [security, tls, alpn]
    question: |
      A gRPC client fails to establish HTTP/2 to a TLS endpoint and silently negotiates
      HTTP/1.1, breaking gRPC. Which TLS-handshake mechanism is responsible for selecting
      HTTP/2, and what token must be negotiated?
    options:
      - "SNI, which must carry the value grpc"
      - "The TLS session ticket, which must contain http2"
      - "ALPN, which must negotiate the token h2 to select HTTP/2"
      - "OCSP stapling, which advertises h2 support"
    answer: 2
    explanation: |
      HTTP/2 over TLS is selected by ALPN negotiating the token h2 during the handshake. If
      ALPN doesn't agree on h2 (misconfigured endpoint/proxy), the peer may fall back to
      HTTP/1.1, which native gRPC cannot use.
    ref: "concepts.md#transport-security-tls-mtls-and-credentials"

  - id: grpc-protocol-buffers-087
    difficulty: advanced
    tags: [security, credentials, composition]
    question: |
      In gRPC, what is the distinction between channel credentials and call credentials, and
      how do they relate?
    options:
      - "Channel credentials are the per-RPC token; call credentials are the TLS certificate"
      - "Channel credentials secure the transport (TLS/mTLS identity); call credentials attach per-RPC caller identity (e.g. a bearer token in authorization metadata) and compose on top of a secured channel"
      - "They are two names for the same TLS certificate"
      - "Call credentials replace channel credentials once the first RPC succeeds"
    answer: 1
    explanation: |
      Channel credentials establish transport security/identity (TLS or mTLS) for the
      connection; call credentials carry per-RPC identity such as an OAuth bearer token in
      authorization metadata. They compose, and call credentials are only sent over a secured
      channel so tokens aren't exposed in plaintext.
    ref: "concepts.md#transport-security-tls-mtls-and-credentials"

  - id: grpc-protocol-buffers-088
    difficulty: expert
    tags: [http2, status-details-bin, errors]
    question: |
      A client needs structured error details — an error code plus a QuotaFailure describing
      which quota was exceeded. Where does gRPC carry this, and in what form?
    options:
      - "In the grpc-message trailer as a human-readable string only"
      - "As a second DATA frame after the response message"
      - "In the :status pseudo-header extended with a sub-code"
      - "In the grpc-status-details-bin trailer, a base64-encoded google.rpc.Status whose details field holds Any-packed messages like QuotaFailure"
    answer: 3
    explanation: |
      Rich errors travel in grpc-status-details-bin: a base64-encoded google.rpc.Status
      (numeric code, message, and a details list of Any-packed payloads such as QuotaFailure,
      BadRequest, RetryInfo) — far richer than the flat grpc-status/grpc-message trailers.
    ref: "concepts.md#http2-mapping-internals-flow-control-goaway-and-trailers-only"

  - id: grpc-protocol-buffers-089
    difficulty: advanced
    tags: [wire-format, groups, limits]
    question: |
      Which statement about protobuf groups and message size limits is correct?
    options:
      - "Groups use wire types 3/4 (SGROUP/EGROUP) as a deprecated delimited framing, and a single message is limited to 2 GiB"
      - "Groups are the modern replacement for embedded messages and have no size limit"
      - "Groups use wire type 2 (LEN) exactly like sub-messages and are recommended"
      - "There is no size limit on a protobuf message; only the transport imposes one"
    answer: 0
    explanation: |
      Groups bracket a submessage with start/end tags (wire types 3 and 4) instead of a
      length prefix; they're deprecated but still legal on the wire. A single protobuf
      message is capped at 2 GiB, and string/bytes lengths are int32 varints (~2 GB).
    ref: "concepts.md#wire-format-edge-cases-maps-merge-and-determinism"

  - id: grpc-protocol-buffers-090
    difficulty: intermediate
    tags: [retries, previous-attempts, metadata]
    question: |
      When gRPC's automatic retry mechanism re-issues an RPC, how can the server tell it is a
      retry and which attempt number it is?
    options:
      - "The :path pseudo-header gains a ?retry=N query parameter"
      - "The client adds grpc-previous-rpc-attempts metadata with the count of prior attempts"
      - "The grpc-status trailer of the prior attempt is echoed in the new request body"
      - "There is no way; retries are invisible to the server"
    answer: 1
    explanation: |
      On each retry the client sets grpc-previous-rpc-attempts to the integer number of
      already-completed attempts, so a server (or observability tooling) can distinguish
      retries and correlate them.
    ref: "concepts.md#retries-hedging-and-retry-throttling"
