topic: "Socket Programming & I/O Multiplexing"
domain: networking
topic_slug: socket-programming-io-multiplexing
version: 1
questions:
  - id: socket-programming-io-multiplexing-001
    difficulty: beginner
    tags: [bsd-sockets, api, fundamentals]
    question: |
      In the BSD socket API, what does the return value of a successful
      `socket()` call represent?
    options:
      - "An integer file descriptor referring to the socket"
      - "A pointer to a kernel connection structure"
      - "The ephemeral source port the kernel picked for it"
      - "A copy of the remote peer's IP address bytes"
    answer: 0
    explanation: |
      `socket()` returns an integer file descriptor. Because it is an fd, the same
      read/write/close and select/poll machinery that works on files and pipes also
      works on sockets — the uniformity is the point of the abstraction.
    ref: "concepts.md#the-bsd-socket-api-model"

  - id: socket-programming-io-multiplexing-002
    difficulty: beginner
    tags: [socket-type, tcp, udp]
    question: |
      Which socket `type` produces a reliable, ordered byte stream (i.e. TCP)?
    options:
      - "SOCK_DGRAM"
      - "SOCK_STREAM"
      - "SOCK_RAW"
      - "SOCK_SEQPACKET"
    answer: 1
    explanation: |
      `SOCK_STREAM` gives a reliable, ordered, connection-oriented byte stream, which
      over AF_INET maps to TCP. `SOCK_DGRAM` gives connectionless, message-oriented
      datagrams (UDP).
    ref: "concepts.md#the-bsd-socket-api-model"

  - id: socket-programming-io-multiplexing-003
    difficulty: beginner
    tags: [byte-order, sockaddr, gotcha]
    question: |
      In what byte order must the port number be stored in a `sockaddr_in`
      structure before calling `bind()` or `connect()`?
    options:
      - "Host byte order (whatever the CPU uses)"
      - "Little-endian order regardless of the CPU"
      - "Network byte order (big-endian)"
      - "A decimal port number encoded as ASCII text"
    answer: 2
    explanation: |
      Addresses and ports in sockaddr are stored in network byte order (big-endian).
      You convert with htons()/htonl(); forgetting this byte-swaps the port (e.g. 8080
      becomes 0x901F) and the server appears to bind to the wrong port.
    ref: "concepts.md#the-bsd-socket-api-model"

  - id: socket-programming-io-multiplexing-004
    difficulty: beginner
    tags: [tcp, lifecycle, server]
    question: |
      What is the correct call sequence for a blocking TCP server?
    options:
      - "socket → connect → listen → accept"
      - "socket → accept → bind → listen"
      - "socket → listen → bind → recv"
      - "socket → bind → listen → accept"
    answer: 3
    explanation: |
      A TCP server does socket() → bind() (attach to a local IP:port) → listen() (mark
      it passive, start queuing completed handshakes) → accept() (dequeue a connection).
      connect() is a client call.
    ref: "concepts.md#tcp-sockets-the-connection-lifecycle"

  - id: socket-programming-io-multiplexing-005
    difficulty: intermediate
    tags: [accept, fd, gotcha]
    question: |
      A server calls `int c = accept(listen_fd, ...)`. Over which descriptor should it
      exchange data with that specific client?
    options:
      - "listen_fd, the original listening socket"
      - "Either one; they are aliases for the same connection"
      - "c, the new descriptor accept() returned"
      - "A new descriptor obtained from a second connect()"
    answer: 2
    explanation: |
      accept() returns a *new* fd bound to that one client connection; you send/recv on
      it. The listening fd stays open only to accept further connections and never
      carries application data.
    ref: "concepts.md#tcp-sockets-the-connection-lifecycle"

  - id: socket-programming-io-multiplexing-006
    difficulty: intermediate
    tags: [tcp, 4-tuple, connections]
    question: |
      How can a single server listening on TCP port 443 maintain thousands of
      simultaneous connections on that one port?
    options:
      - "The kernel silently rotates the server's port to a fresh one for each client"
      - "TCP multiplexes them all into a single stream demultiplexed by sequence number"
      - "Each connection is handed a unique destination port assigned during its handshake"
      - "Each connection is identified by the full 4-tuple (src IP, src port, dst IP, dst port), so tuples stay distinct"
    answer: 3
    explanation: |
      A TCP connection is keyed by the 4-tuple. All clients share the server's dst IP:port
      but differ in their (src IP, src port), so every connection has a unique tuple. The
      server port is not duplicated per client.
    ref: "concepts.md#tcp-sockets-the-connection-lifecycle"

  - id: socket-programming-io-multiplexing-007
    difficulty: beginner
    tags: [ephemeral-ports, client]
    question: |
      When a TCP client calls `connect()` without first calling `bind()`, where does
      its source port come from?
    options:
      - "The kernel auto-assigns an ephemeral port (typically 49152–65535)"
      - "It stays fixed at port 0 until the server assigns one back"
      - "The client reuses the server's destination port number as its own"
      - "The connection fails, because bind() is mandatory for clients"
    answer: 0
    explanation: |
      Clients normally skip bind(); the kernel auto-assigns an ephemeral source port from
      the dynamic range (49152–65535 per RFC 6335, though Linux defaults differ). This
      source port is part of the connection's identifying 4-tuple.
    ref: "concepts.md#tcp-sockets-the-connection-lifecycle"

  - id: socket-programming-io-multiplexing-008
    difficulty: beginner
    tags: [udp, connectionless]
    question: |
      Which pair of calls is used by a UDP application instead of accept/recv, because
      UDP has no connection to accept?
    options:
      - "listen() and accept()"
      - "sendto() and recvfrom()"
      - "connect() and send()"
      - "poll() and epoll_wait()"
    answer: 1
    explanation: |
      UDP (SOCK_DGRAM) is connectionless: there is no listen()/accept(). You bind() then
      use recvfrom()/sendto(), where recvfrom() also yields the sender's address so you
      know who to reply to.
    ref: "concepts.md#udp-sockets-connectionless-datagrams"

  - id: socket-programming-io-multiplexing-009
    difficulty: intermediate
    tags: [udp, message-boundaries]
    question: |
      A UDP receiver calls `recvfrom()` with a 512-byte buffer, but the arriving
      datagram is 900 bytes. What happens by default?
    options:
      - "recvfrom() returns all 900 bytes, growing the buffer"
      - "recvfrom() blocks until a smaller datagram arrives"
      - "recvfrom() returns 512 bytes now and the rest on the next call"
      - "recvfrom() reads 512 bytes and the remaining 388 are discarded"
    answer: 3
    explanation: |
      UDP preserves message boundaries: one recvfrom() reads exactly one datagram. If the
      buffer is too small, the excess is discarded (MSG_TRUNC lets you detect it). Unlike
      TCP, the leftover is not queued for a later read.
    ref: "concepts.md#udp-sockets-connectionless-datagrams"

  - id: socket-programming-io-multiplexing-010
    difficulty: advanced
    tags: [udp, connect, icmp]
    question: |
      Why might an application call `connect()` on a UDP socket even though UDP is
      connectionless?
    options:
      - "To set a default peer for send/recv and receive asynchronous ICMP errors like port-unreachable"
      - "To perform a 3-way handshake so datagrams are then delivered reliably"
      - "To enable guaranteed in-order delivery of the datagrams that follow"
      - "It is illegal to call connect() on a connectionless UDP socket"
    answer: 0
    explanation: |
      connect() on UDP sends no packets; it records a default peer so you can use
      send/recv and, crucially, lets the socket surface asynchronous ICMP errors (e.g.
      ECONNREFUSED for port-unreachable) — which an unconnected UDP socket cannot report.
    ref: "concepts.md#udp-sockets-connectionless-datagrams"

  - id: socket-programming-io-multiplexing-011
    difficulty: beginner
    tags: [blocking, recv]
    question: |
      On a default (blocking) TCP socket, what does `recv()` do when no data is
      currently available but the connection is still open?
    options:
      - "Returns -1 immediately and sets errno to EAGAIN"
      - "Blocks the calling thread until data arrives"
      - "Returns 0 at once to signal that no data is ready"
      - "Returns a buffer of whatever stale bytes remain"
    answer: 1
    explanation: |
      A blocking recv() sleeps the calling thread until data arrives (or the peer closes).
      That is exactly why one blocking thread can only wait on one connection at a time,
      motivating non-blocking sockets and multiplexing.
    ref: "concepts.md#blocking-vs-non-blocking-sockets"

  - id: socket-programming-io-multiplexing-012
    difficulty: intermediate
    tags: [non-blocking, errno, eagain]
    question: |
      On a non-blocking TCP socket, `recv()` is called but no data is available. What is
      returned?
    options:
      - "0, indicating the peer reached end of stream"
      - "The number of bytes still buffered by the peer"
      - "-1 with errno set to EAGAIN/EWOULDBLOCK"
      - "It blocks for a short grace period, then returns 0"
    answer: 2
    explanation: |
      A non-blocking recv() with no data returns -1 and sets errno to EAGAIN/EWOULDBLOCK
      (same value on Linux). This is distinct from recv() returning 0, which means the
      peer performed an orderly shutdown (FIN).
    ref: "concepts.md#blocking-vs-non-blocking-sockets"

  - id: socket-programming-io-multiplexing-013
    difficulty: intermediate
    tags: [recv, shutdown, eof]
    question: |
      A blocking `recv()` returns exactly 0. What does this indicate?
    options:
      - "The peer performed an orderly shutdown (sent FIN); end of stream"
      - "The socket receive buffer is momentarily empty but the connection is fine"
      - "A transient error occurred; you should simply retry the call"
      - "A zero-length TCP keepalive probe was received and consumed"
    answer: 0
    explanation: |
      recv() == 0 means end of stream: the peer closed its send side (FIN received). It is
      not an error and not 'try again' — it signals you should stop reading and typically
      close your side.
    ref: "concepts.md#blocking-vs-non-blocking-sockets"

  - id: socket-programming-io-multiplexing-014
    difficulty: advanced
    tags: [non-blocking, connect, einprogress]
    question: |
      A non-blocking `connect()` returns -1 with errno EINPROGRESS. How do you correctly
      detect that the handshake has completed successfully?
    options:
      - "Call connect() repeatedly in a loop until it finally returns 0"
      - "Wait for the socket to become writable, then check SO_ERROR for success/failure"
      - "Call accept() on the client socket to reap the finished handshake"
      - "Sleep for one round-trip time and then assume the connect succeeded"
    answer: 1
    explanation: |
      EINPROGRESS means the handshake is underway. You register the fd for writability in
      your event loop; when it becomes writable you read SO_ERROR via getsockopt to
      distinguish a completed connect (0) from a failure (e.g. ECONNREFUSED).
    ref: "concepts.md#blocking-vs-non-blocking-sockets"

  - id: socket-programming-io-multiplexing-015
    difficulty: intermediate
    tags: [tcp, byte-stream, framing]
    question: |
      An application sends one 8 KB logical message over TCP. The receiver's first
      `recv()` returns only 1460 bytes. What is the correct interpretation?
    options:
      - "The connection is corrupted and must be reset before reading further"
      - "The sender must have split the message into two separate send() calls"
      - "TCP is a byte stream with no message boundaries; loop and re-read until the full message is assembled"
      - "The receive buffer size must be increased or the extra data will be lost"
    answer: 2
    explanation: |
      TCP delivers a byte stream, not messages. A single send can arrive as multiple recv
      chunks (and vice versa). The application must frame messages (length prefix,
      delimiter, or fixed size) and loop reading until a complete message is assembled.
    ref: "concepts.md#partial-reads-and-writes"

  - id: socket-programming-io-multiplexing-016
    difficulty: intermediate
    tags: [send, short-write, semantics]
    question: |
      `send(fd, buf, 4096, 0)` returns 1500. What is the correct next step?
    options:
      - "Treat the short count as a fatal error and close the socket"
      - "Assume the peer already received 1500 bytes and stop sending"
      - "Resend the entire 4096-byte buffer again from the beginning"
      - "Loop and send the remaining 2596 bytes starting at the returned offset"
    answer: 3
    explanation: |
      A short write means the kernel send buffer accepted only part of the data. Correct
      code loops, advancing the offset by the returned count until all bytes are handed
      off (waiting for writability if EAGAIN on a non-blocking socket).
    ref: "concepts.md#partial-reads-and-writes"

  - id: socket-programming-io-multiplexing-017
    difficulty: intermediate
    tags: [send, delivery-semantics, gotcha]
    question: |
      A `send()` call returns successfully with the full byte count. What has this
      actually guaranteed?
    options:
      - "The peer application has read the bytes"
      - "The peer's kernel has received and ACKed the bytes"
      - "The bytes were copied into the local kernel send buffer"
      - "The bytes have been rendered on the peer's screen"
    answer: 2
    explanation: |
      A successful send() only means the data was copied into the local kernel socket
      buffer. It says nothing about delivery — that requires TCP ACKs and, for
      application-level confirmation, a reply. Never treat send success as end-to-end
      delivery.
    ref: "concepts.md#partial-reads-and-writes"

  - id: socket-programming-io-multiplexing-018
    difficulty: beginner
    tags: [so-reuseaddr, time-wait]
    question: |
      Which socket option is commonly set before `bind()` so a server can restart
      immediately without an "Address already in use" error?
    options:
      - "TCP_NODELAY"
      - "SO_LINGER"
      - "SO_KEEPALIVE"
      - "SO_REUSEADDR"
    answer: 3
    explanation: |
      SO_REUSEADDR lets bind() reuse a local port still held by a connection in TIME_WAIT
      (~2×MSL) from the previous run, avoiding EADDRINUSE on restart. Nearly every server
      sets it.
    ref: "concepts.md#key-socket-options"

  - id: socket-programming-io-multiplexing-019
    difficulty: advanced
    tags: [so-reuseport, scaling, load-balancing]
    question: |
      What is the primary purpose of `SO_REUSEPORT` (as distinct from SO_REUSEADDR)?
    options:
      - "It allows multiple sockets to bind the same IP:port so the kernel load-balances incoming connections across them"
      - "It lets a bind() reuse a local port still stuck in TIME_WAIT from a previous run, skipping the 2×MSL wait"
      - "It disables Nagle's algorithm on every socket using that port so small writes flush without any coalescing delay"
      - "It exclusively reserves the port for the calling process so no other process on the host may ever bind it"
    answer: 0
    explanation: |
      SO_REUSEPORT allows several distinct sockets (e.g. one per worker process/core) to
      bind the same IP:port; the kernel distributes incoming connections among them. It
      scales the accept path across cores and avoids single-listener thundering herds —
      different from SO_REUSEADDR's TIME_WAIT reuse.
    ref: "concepts.md#key-socket-options"

  - id: socket-programming-io-multiplexing-020
    difficulty: intermediate
    tags: [tcp-nodelay, nagle, latency]
    question: |
      Setting `TCP_NODELAY` on a socket does what?
    options:
      - "Enlarges the socket's send buffer so it can queue more outbound bytes"
      - "Disables Nagle's algorithm so small writes are sent immediately"
      - "Enables periodic TCP keepalive probes on idle connections"
      - "Turns off the receiver's delayed-ACK timer for that socket"
    answer: 1
    explanation: |
      TCP_NODELAY disables Nagle's algorithm, which otherwise coalesces small writes
      until the previous small segment is ACKed. Disabling it reduces latency for
      interactive request/response protocols at the cost of more small packets.
    ref: "concepts.md#key-socket-options"

  - id: socket-programming-io-multiplexing-021
    difficulty: advanced
    tags: [nagle, delayed-ack, latency, scenario]
    question: |
      An RPC client sees ~40 ms latency spikes on small requests over a healthy LAN with
      sub-millisecond RTT. Which combination is the most likely culprit?
    options:
      - "A SYN flood saturating the server's half-open connection queue"
      - "Edge-triggered epoll missing readiness events from an undrained socket"
      - "An undersized listen backlog forcing repeated connection retransmits"
      - "Nagle's algorithm interacting with the peer's delayed ACK, stalling small writes"
    answer: 3
    explanation: |
      The classic Nagle + delayed-ACK deadlock: the sender withholds a small segment
      waiting for an ACK, while the receiver delays its ACK (~40 ms) waiting for data to
      piggyback on. Setting TCP_NODELAY on latency-sensitive request/response sockets
      eliminates the stall.
    ref: "concepts.md#key-socket-options"

  - id: socket-programming-io-multiplexing-022
    difficulty: intermediate
    tags: [so-keepalive, half-open]
    question: |
      What problem is `SO_KEEPALIVE` designed to detect?
    options:
      - "A silently dead peer on an idle connection that never sent a FIN (half-open)"
      - "Excessive small packets flooding the network and starving throughput"
      - "A full listen backlog overflowing under sudden burst traffic"
      - "Byte-order mistakes in the sockaddr port and address fields"
    answer: 0
    explanation: |
      SO_KEEPALIVE sends periodic probes on idle TCP connections to detect a peer that
      vanished without a FIN (crash, cable pull, NAT timeout) — a half-open connection.
      Defaults are coarse (Linux: 2 hours), so tune TCP_KEEPIDLE/INTVL/CNT.
    ref: "concepts.md#key-socket-options"

  - id: socket-programming-io-multiplexing-023
    difficulty: advanced
    tags: [so-rcvbuf, bandwidth-delay-product, throughput]
    question: |
      On a long-distance, high-latency link, TCP throughput is capped well below the
      available bandwidth. Which socket-level setting most directly influences this?
    options:
      - "TCP_NODELAY, by removing the small-write Nagle delays on the connection"
      - "SO_RCVBUF, because the receive buffer caps the receive window versus the bandwidth-delay product"
      - "SO_REUSEADDR, by allowing the port to be rebound for additional connections"
      - "SO_LINGER, by controlling how long close() lingers to flush queued outbound data"
    answer: 1
    explanation: |
      Throughput is limited by window / RTT. A receive buffer (SO_RCVBUF) smaller than the
      bandwidth-delay product caps the advertised receive window and thus throughput on
      high-latency links. Sizing the buffer (or enabling autotuning) is the fix.
    ref: "concepts.md#key-socket-options"

  - id: socket-programming-io-multiplexing-024
    difficulty: advanced
    tags: [so-linger, rst, close]
    question: |
      Setting `SO_LINGER` with a timeout of 0 and then calling `close()` causes what TCP
      behavior?
    options:
      - "A graceful FIN-based shutdown that first flushes all queued outbound data"
      - "The close() call to block the caller for exactly one 2×MSL interval"
      - "An abortive close sending a RST, discarding unsent data and skipping TIME_WAIT"
      - "The connection to silently downgrade from TCP to UDP framing"
    answer: 2
    explanation: |
      SO_LINGER with a zero timeout makes close() send an abortive RST rather than a
      graceful FIN: unsent data is discarded and the connection skips the normal
      TIME_WAIT. Useful in narrow cases but risks data loss.
    ref: "concepts.md#key-socket-options"

  - id: socket-programming-io-multiplexing-025
    difficulty: intermediate
    tags: [backlog, listen, accept-queue]
    question: |
      What does the `backlog` argument to `listen(fd, backlog)` primarily bound on
      modern Linux?
    options:
      - "The number of fully established connections waiting to be accept()ed"
      - "The maximum number of payload bytes the kernel will buffer per accepted connection"
      - "The number of worker threads the server is permitted to spawn to handle accepts"
      - "The advertised TCP receive window size applied to every accepted connection"
    answer: 0
    explanation: |
      backlog bounds the accept queue of completed (established) connections awaiting
      accept(). The effective cap is min(backlog, net.core.somaxconn). A separate SYN
      queue holds half-open handshakes.
    ref: "concepts.md#the-listen-backlog-and-accept-queue"

  - id: socket-programming-io-multiplexing-026
    difficulty: advanced
    tags: [backlog, somaxconn, gotcha]
    question: |
      A service passes `listen(fd, 1024)` but under load still drops connections as if the
      queue were much smaller. What is the most likely explanation?
    options:
      - "backlog values above 128 are ignored by the API"
      - "The effective queue is min(backlog, somaxconn), and somaxconn was left at a low default"
      - "TCP_NODELAY must be set to enlarge the queue"
      - "The accept queue is unlimited, so drops must be from bad checksums"
    answer: 1
    explanation: |
      The kernel caps the accept queue at min(backlog, net.core.somaxconn). If somaxconn is
      at a low default (historically 128), passing 1024 doesn't help — you must raise the
      sysctl as well.
    ref: "concepts.md#the-listen-backlog-and-accept-queue"

  - id: socket-programming-io-multiplexing-027
    difficulty: advanced
    tags: [syn-queue, syn-cookies, security]
    question: |
      SYN cookies defend against SYN flood attacks by doing what?
    options:
      - "Rate-limiting all inbound TCP by source IP"
      - "Requiring TLS before the TCP handshake"
      - "Encoding connection state into the SYN-ACK sequence number so no per-connection state is held until the handshake completes"
      - "Dropping every third SYN to slow attackers"
    answer: 2
    explanation: |
      A SYN flood exhausts the SYN (incomplete) queue with half-open handshakes. SYN
      cookies encode the needed state into the SYN-ACK's initial sequence number, so the
      server allocates no per-connection state until the client returns a valid final ACK.
    ref: "concepts.md#the-listen-backlog-and-accept-queue"

  - id: socket-programming-io-multiplexing-028
    difficulty: intermediate
    tags: [c10k, definition]
    question: |
      What does the "C10K problem" refer to?
    options:
      - "Compressing 10,000 small packets into a single Ethernet frame for efficiency"
      - "A hard kernel limit of 10,000 open file descriptors per process"
      - "A fixed 10-kilobyte maximum TCP segment size negotiated at handshake"
      - "Handling 10,000 concurrent connections efficiently on a single server"
    answer: 3
    explanation: |
      Coined by Dan Kegel (~1999), C10K asks how one server handles 10,000 simultaneous
      connections. The naive thread-per-connection + O(n) select/poll model breaks down;
      the answer is non-blocking I/O plus a scalable readiness API.
    ref: "concepts.md#the-c10k-problem"

  - id: socket-programming-io-multiplexing-029
    difficulty: intermediate
    tags: [c10k, thread-per-connection, memory]
    question: |
      Why does a pure thread-per-connection model struggle at 10,000 connections?
    options:
      - "TCP connections themselves each consume gigabytes of pinned kernel memory"
      - "The connection 4-tuple space is exhausted once you reach 10,000 connections"
      - "Per-thread stacks and context-switch/scheduling overhead grow with connection count"
      - "select() may not be called from more than one thread, forcing serialization"
    answer: 2
    explanation: |
      TCP connections are cheap; the coordination model is the problem. Each thread needs a
      stack (often ~1 MB) and adds scheduler/context-switch overhead, so 10K threads is
      expensive in memory and CPU. Event loops multiplex many connections per thread.
    ref: "concepts.md#the-c10k-problem"

  - id: socket-programming-io-multiplexing-030
    difficulty: advanced
    tags: [c10k, select, complexity]
    question: |
      Beyond thread cost, which property of `select`/`poll` makes them poor for the C10K
      problem specifically?
    options:
      - "They only work with connectionless UDP sockets, never with TCP streams"
      - "They require a dedicated OS thread for each monitored file descriptor"
      - "They cannot be combined with non-blocking sockets set via O_NONBLOCK"
      - "They are O(n) per call, rescanning all monitored fds each wakeup even if few are ready"
    answer: 3
    explanation: |
      select/poll are O(n): the kernel and application walk the entire fd set on every
      call, so cost scales with total connections regardless of how few are active. epoll/
      kqueue are O(ready), scaling with activity instead.
    ref: "concepts.md#the-c10k-problem"

  - id: socket-programming-io-multiplexing-031
    difficulty: intermediate
    tags: [select, fd-setsize, limits]
    question: |
      A well-known limitation of `select()` is that the fd values it can monitor are
      capped by which constant (commonly 1024)?
    options:
      - "FD_SETSIZE"
      - "SOMAXCONN"
      - "MSS"
      - "TCP_MAXWIN"
    answer: 0
    explanation: |
      select() uses fixed-size fd_set bitmaps limited by FD_SETSIZE, commonly 1024. poll()
      removes this limit by taking an array of pollfd structs; epoll/kqueue also have no
      such cap.
    ref: "concepts.md#readiness-io-models-select-poll-epoll-kqueue"

  - id: socket-programming-io-multiplexing-032
    difficulty: intermediate
    tags: [select, poll, comparison]
    question: |
      What is the main practical advantage of `poll()` over `select()`?
    options:
      - "poll() runs in O(1) time regardless of how many fds are being monitored"
      - "poll() takes an array of pollfd structs, so it has no FD_SETSIZE limit and separates input events from returned events"
      - "poll() keeps its interest set registered inside the kernel across successive calls"
      - "poll() natively supports edge-triggered notification for fewer wakeups"
    answer: 1
    explanation: |
      poll() uses a pollfd array (no FD_SETSIZE cap) with separate `events`/`revents`
      fields, so you don't rebuild the set each call. It is still O(n), though — epoll/
      kqueue are the O(ready), stateful upgrades.
    ref: "concepts.md#readiness-io-models-select-poll-epoll-kqueue"

  - id: socket-programming-io-multiplexing-033
    difficulty: advanced
    tags: [epoll, complexity, scaling]
    question: |
      Why does `epoll` scale to hundreds of thousands of connections where `poll` does
      not?
    options:
      - "epoll uses a UDP-based control channel internally to speed up notifications"
      - "epoll compresses the monitored fd set with run-length encoding before scanning it"
      - "epoll schedules each registered fd onto its own dedicated kernel worker thread"
      - "epoll keeps the interest set in the kernel (registered once via epoll_ctl) and epoll_wait returns only the ready fds — O(ready) not O(total)"
    answer: 3
    explanation: |
      With epoll you register fds once with epoll_ctl; epoll_wait returns only the ready
      fds, so cost tracks activity, not total connection count. poll re-scans and re-copies
      the whole array on every call.
    ref: "concepts.md#readiness-io-models-select-poll-epoll-kqueue"

  - id: socket-programming-io-multiplexing-034
    difficulty: intermediate
    tags: [kqueue, bsd, macos]
    question: |
      `kqueue` is the scalable readiness API on which platforms, and what makes it more
      general than epoll?
    options:
      - "BSD/macOS; a single kevent interface reports socket readiness plus timers, signals, and file/process events"
      - "Windows only; it integrates directly with I/O completion ports and the registry"
      - "Linux only; it is a newer syscall that fully replaces and deprecates epoll"
      - "All POSIX systems uniformly; it is simply another standardized name for poll()"
    answer: 0
    explanation: |
      kqueue is the BSD/macOS equivalent of epoll and is more general: the kevent interface
      can report not only socket readiness but timers, signals, file, and process events
      through one mechanism. It is also O(ready).
    ref: "concepts.md#readiness-io-models-select-poll-epoll-kqueue"

  - id: socket-programming-io-multiplexing-035
    difficulty: intermediate
    tags: [select, gotcha, fd-set]
    question: |
      Why must code using `select()` typically rebuild its fd_sets before every call?
    options:
      - "Because select() closes and reopens every monitored socket after each call"
      - "Because select() modifies the fd_sets in place to indicate which fds are ready"
      - "Because the value of FD_SETSIZE is recomputed and changes at runtime"
      - "Because the kernel reshuffles and randomizes the fd numbers between calls"
    answer: 1
    explanation: |
      select() overwrites the passed fd_sets in place with only the ready fds, destroying
      your original interest set. You must rebuild the sets each iteration — one reason
      epoll's persistent kernel-side interest set is more efficient.
    ref: "concepts.md#readiness-io-models-select-poll-epoll-kqueue"

  - id: socket-programming-io-multiplexing-036
    difficulty: intermediate
    tags: [level-triggered, epoll, default]
    question: |
      In level-triggered (LT) mode, if data is readable and you read only part of it,
      what does the next `epoll_wait()` report for that fd?
    options:
      - "Nothing further, until additional new data arrives from the peer"
      - "An error condition indicating the previous read was left incomplete"
      - "The fd as still ready, because the readable condition still holds"
      - "The fd as writable instead of readable on the next wakeup"
    answer: 2
    explanation: |
      Level-triggered mode reports readiness as long as the condition holds. If unread data
      remains, the next epoll_wait still reports the fd ready — forgiving behavior that
      matches select/poll semantics.
    ref: "concepts.md#level-triggered-vs-edge-triggered"

  - id: socket-programming-io-multiplexing-037
    difficulty: advanced
    tags: [edge-triggered, drain, gotcha]
    question: |
      When using edge-triggered (ET) epoll, why must you read from a ready socket until it
      returns EAGAIN?
    options:
      - "Because ET notifies only on a state transition; unread data yields no further notification and the connection stalls"
      - "To force the kernel to reset the TCP receive window back to its advertised maximum value after each individual read"
      - "Because edge-triggered mode automatically closes the file descriptor if any unread bytes remain after the handler returns"
      - "To force the peer to send an immediate ACK so the sender's congestion window can continue growing without stalling"
    answer: 0
    explanation: |
      ET fires once per new edge (e.g. empty → data). If you don't drain the fd fully, the
      leftover data produces no new notification, so the connection appears to hang until
      the next edge. Hence ET requires looping reads/writes to EAGAIN and non-blocking
      sockets.
    ref: "concepts.md#level-triggered-vs-edge-triggered"

  - id: socket-programming-io-multiplexing-038
    difficulty: advanced
    tags: [edge-triggered, non-blocking, requirement]
    question: |
      Why does edge-triggered mode effectively require non-blocking sockets?
    options:
      - "Because edge-triggered mode disables the kernel socket receive buffer, so every byte must be read the instant it arrives"
      - "Because the drain loop's final recv (when the buffer is empty) would block on a blocking socket instead of returning EAGAIN"
      - "Because edge-triggered notification is only ever implemented for connectionless UDP datagram sockets, never for TCP streams"
      - "Because blocking sockets are rejected by epoll_ctl with EPERM and therefore cannot be placed in an edge-triggered interest set"
    answer: 1
    explanation: |
      ET requires draining to EAGAIN. On a blocking socket the last recv (after the buffer
      empties) would block the whole event-loop thread instead of returning
      EAGAIN/EWOULDBLOCK, so ET is used with non-blocking sockets.
    ref: "concepts.md#level-triggered-vs-edge-triggered"

  - id: socket-programming-io-multiplexing-039
    difficulty: intermediate
    tags: [edge-triggered, performance, nginx]
    question: |
      What is the main performance benefit of edge-triggered over level-triggered
      notification under high load?
    options:
      - "It guarantees strictly in-order packet delivery even when the underlying network reorders segments in flight"
      - "It automatically grows the socket receive buffer under load so recv() never has to be called in a loop"
      - "It generates fewer wakeups and syscalls because it fires only on transitions"
      - "It removes the need for non-blocking sockets by letting recv() drain the buffer in a single guaranteed read"
    answer: 2
    explanation: |
      ET fires only on state transitions, so a busy fd produces fewer redundant wakeups and
      epoll_wait/recv syscalls than LT, which keeps re-reporting readiness. High-performance
      servers like nginx use ET (with careful full draining).
    ref: "concepts.md#level-triggered-vs-edge-triggered"

  - id: socket-programming-io-multiplexing-040
    difficulty: intermediate
    tags: [event-loop, blocking-call, gotcha]
    question: |
      In a single-threaded event-loop server, what is the danger of a handler that makes a
      blocking database call or does heavy CPU work?
    options:
      - "It only slows down that one connection while every other client on the loop keeps being serviced normally"
      - "It causes the kernel to silently close the listening socket, so no new connections can be accepted afterward"
      - "It automatically spawns a fresh worker thread to run the handler, so the main loop keeps going untouched"
      - "It stalls the entire event loop, blocking every other connection on that thread"
    answer: 3
    explanation: |
      In an event loop, one thread multiplexes all connections, so any blocking call or
      CPU-heavy handler freezes the loop and every connection it serves. Such work must be
      offloaded to a thread pool or made non-blocking.
    ref: "concepts.md#thread-per-connection-vs-event-loop"

  - id: socket-programming-io-multiplexing-041
    difficulty: intermediate
    tags: [thread-per-connection, event-loop, tradeoffs]
    question: |
      For a mostly-idle chat service holding 200,000 long-lived connections, which
      architecture is generally the better fit?
    options:
      - "Thread-per-connection, dedicating one blocking OS thread to each of the 200,000 idle clients"
      - "A new process forked per inbound message, torn down again once the reply has been sent"
      - "An event loop (reactor) over epoll/kqueue with a few threads multiplexing all connections"
      - "Pure busy-polling that spins through all 200,000 sockets in a tight loop calling recv on each"
    answer: 2
    explanation: |
      High-connection, I/O-bound, mostly-idle workloads are the sweet spot for event loops:
      a few threads over epoll/kqueue multiplex hundreds of thousands of connections
      cheaply. Thread-per-connection would need 200K stacks and is impractical.
    ref: "concepts.md#thread-per-connection-vs-event-loop"

  - id: socket-programming-io-multiplexing-042
    difficulty: intermediate
    tags: [thread-per-connection, ergonomics]
    question: |
      What is the primary programming-model advantage of the thread-per-connection model?
    options:
      - "It scales to millions of concurrent connections with essentially zero per-thread memory cost"
      - "It requires no operating-system threads at all, running every handler on a single shared stack"
      - "It never context-switches, so the CPU scheduler overhead stays flat as connections grow"
      - "Each handler is straight-line blocking code that is easy to write and debug"
    answer: 3
    explanation: |
      Thread-per-connection lets each request handler be simple, linear, blocking code —
      easy to reason about and debug — versus the inverted control flow (callbacks/state
      machines/async) of an event loop. Its cost is memory and scaling ceiling.
    ref: "concepts.md#thread-per-connection-vs-event-loop"

  - id: socket-programming-io-multiplexing-043
    difficulty: advanced
    tags: [virtual-threads, goroutines, netpoller]
    question: |
      How do runtimes with green threads/goroutines/virtual threads serve 100,000
      connections without 100,000 OS threads?
    options:
      - "They park a blocked logical thread and use an epoll/kqueue-backed poller to resume it when its fd is ready, multiplexing many logical threads onto few OS threads"
      - "They funnel all 100,000 connections through a single shared UDP socket that the runtime demultiplexes internally by peer address"
      - "They disable the operating-system scheduler entirely and let the language runtime drive the CPU cores directly"
      - "They convert every socket to a non-blocking select() loop with FD_SETSIZE raised to 100,000 at compile time"
    answer: 0
    explanation: |
      These runtimes let you write blocking-style code, but under the hood a blocked
      logical thread is parked and an epoll/kqueue netpoller resumes it when the fd is
      ready — combining event-loop scalability with thread-per-connection ergonomics.
    ref: "concepts.md#thread-per-connection-vs-event-loop"

  - id: socket-programming-io-multiplexing-044
    difficulty: advanced
    tags: [reactor, proactor, io-uring]
    question: |
      What distinguishes the Proactor (completion-based) model from the Reactor
      (readiness-based) model?
    options:
      - "Proactor waits for an fd to be reported 'ready' and then has the application perform the actual read itself"
      - "In Proactor you submit an operation and the OS performs the I/O into your buffer, notifying you when it is complete"
      - "Proactor is built only on top of select(), while Reactor is built only on top of the newer epoll interface"
      - "Proactor is restricted to connectionless UDP datagrams, whereas Reactor works exclusively with TCP byte streams"
    answer: 1
    explanation: |
      Reactor (epoll/kqueue) reports readiness and you then perform the non-blocking I/O.
      Proactor (Windows IOCP, Linux io_uring) is completion-based: you submit the operation,
      the kernel does the transfer into your buffer and notifies you when finished — avoiding
      the ready-then-syscall round-trip.
    ref: "concepts.md#reactor-proactor-and-true-async-io"

  - id: socket-programming-io-multiplexing-045
    difficulty: advanced
    tags: [epoll, regular-files, io-uring]
    question: |
      Why is `epoll` ineffective for asynchronous access to regular disk files, motivating
      APIs like `io_uring`?
    options:
      - "Regular disk files cannot be assigned a file descriptor, so there is nothing for epoll_ctl to register"
      - "The kernel outright forbids adding a regular-file descriptor to an epoll interest set, returning EPERM"
      - "epoll accepts only connectionless UDP socket descriptors and rejects everything backed by the page cache"
      - "Regular files are always reported as ready, so readiness notification provides no useful signal for disk I/O"
    answer: 3
    explanation: |
      Regular files never 'block' in the readiness sense — they are always reported ready —
      so epoll gives no useful signal for disk I/O. Completion-based io_uring performs the
      actual transfer asynchronously and notifies on completion, working for files and
      sockets alike.
    ref: "concepts.md#reactor-proactor-and-true-async-io"

  - id: socket-programming-io-multiplexing-046
    difficulty: beginner
    tags: [close, fin, teardown]
    question: |
      For a TCP socket, calling `close()` on the connected fd normally triggers what?
    options:
      - "Connection teardown beginning with a FIN"
      - "An immediate RST that abortively resets the connection and discards any queued outbound data"
      - "A fresh 3-way SYN handshake to renegotiate the connection parameters before releasing it"
      - "Nothing at all on the wire until the remote peer independently calls close() on its own end first"
    answer: 0
    explanation: |
      close() releases the fd and, for TCP, initiates graceful teardown by sending a FIN
      (barring a zero-timeout SO_LINGER, which forces an abortive RST). The peer's recv
      then returns 0.
    ref: "concepts.md#tcp-sockets-the-connection-lifecycle"

  - id: socket-programming-io-multiplexing-047
    difficulty: advanced
    tags: [ephemeral-ports, client, exhaustion, scenario]
    question: |
      A load-test client from a single source IP opens tens of thousands of connections to
      one server IP:port and starts failing to make new connections. What is the most
      likely limit being hit?
    options:
      - "The server's SO_KEEPALIVE probe interval firing and tearing down the client's freshly opened connections"
      - "Exhaustion of the client's ~28K ephemeral source ports for that (src IP, dst IP:port), worsened by TIME_WAIT accumulation"
      - "The TCP maximum segment size being too small to carry the load-test request payloads in one packet"
      - "FD_SETSIZE on the server's epoll interest set capping the number of descriptors it can watch at once"
    answer: 1
    explanation: |
      With a fixed source IP and a fixed destination IP:port, only the ephemeral source
      port varies, giving ~28K possible 4-tuples. Rapid connect/close cycles pile up
      TIME_WAIT entries and exhaust that space. Mitigations: multiple source IPs/dest ports,
      connection reuse, or tuning.
    ref: "concepts.md#tcp-sockets-the-connection-lifecycle"

  - id: socket-programming-io-multiplexing-048
    difficulty: intermediate
    tags: [udp, single-fd, server]
    question: |
      Unlike a TCP server, a UDP server typically serves all of its peers through how many
      sockets?
    options:
      - "One socket per peer, each obtained from a separate accept() call as datagrams arrive"
      - "Two sockets per peer: a read-only socket for recvfrom() and a write-only socket for sendto()"
      - "A single bound socket that receives datagrams from all peers via recvfrom()"
      - "One socket per source-port range, with the kernel sharding incoming datagrams across them"
    answer: 2
    explanation: |
      UDP has no per-connection fd. A single bound socket receives datagrams from every
      peer; recvfrom() tells you each sender's address. There is no accept() creating a new
      fd per client as in TCP.
    ref: "concepts.md#udp-sockets-connectionless-datagrams"

  - id: socket-programming-io-multiplexing-049
    difficulty: intermediate
    tags: [non-blocking, spin, event-loop]
    question: |
      Why is repeatedly calling `recv()` on a non-blocking socket in a tight loop (busy
      polling) a poor design?
    options:
      - "It burns CPU spinning while the socket has no data; the correct pattern pairs non-blocking sockets with a readiness API that sleeps until an fd is ready"
      - "It violates the TCP specification, which forbids issuing more than one recv() per round-trip time on a stream socket"
      - "recv() is not permitted on non-blocking sockets and immediately fails with ENOTSUP on the second consecutive call"
      - "It silently causes the socket to revert to blocking mode, so the loop then stalls the whole thread anyway"
    answer: 0
    explanation: |
      Spinning on a non-blocking recv() wastes CPU returning EAGAIN. The efficient pattern
      is non-blocking sockets plus epoll/kqueue: the thread sleeps in epoll_wait until at
      least one fd is ready, then does non-blocking I/O only on ready fds.
    ref: "concepts.md#blocking-vs-non-blocking-sockets"

  - id: socket-programming-io-multiplexing-050
    difficulty: intermediate
    tags: [socket-address, sockaddr, api]
    question: |
      Which structure is used to hold an IPv4 address and port for `bind()`/`connect()`?
    options:
      - "sockaddr_in6, which carries a 128-bit IPv6 address, port, flow label, and scope id"
      - "sockaddr_in"
      - "sockaddr_un, which holds a filesystem pathname for an AF_UNIX local domain socket"
      - "in6_addr, the bare 128-bit IPv6 address structure with no port or address-family field"
    answer: 1
    explanation: |
      sockaddr_in holds an AF_INET (IPv4) address family, port, and 32-bit address.
      sockaddr_in6 is for IPv6 and sockaddr_un for AF_UNIX local sockets. They are passed
      via a generic sockaddr pointer.
    ref: "concepts.md#the-bsd-socket-api-model"

  - id: socket-programming-io-multiplexing-051
    difficulty: advanced
    tags: [so-reuseport, thundering-herd, scaling, scenario]
    question: |
      An 8-core server runs 8 worker processes that all block in accept() on one shared
      listening socket, and you observe uneven load and wakeup contention. Which technique
      most directly addresses this?
    options:
      - "Set TCP_NODELAY on the listening socket so completed handshakes are handed to accept() without buffering delay"
      - "Increase FD_SETSIZE and recompile so each worker can track more descriptors in its select() fd_set"
      - "Give each worker its own socket bound to the same port with SO_REUSEPORT so the kernel load-balances accepts"
      - "Switch all eight workers' sockets to blocking mode so the kernel serializes their accept() calls fairly"
    answer: 2
    explanation: |
      SO_REUSEPORT lets each worker bind its own socket to the same IP:port; the kernel
      hashes incoming connections across the sockets, spreading accept load evenly and
      avoiding the thundering-herd contention of many workers waking on one shared listener.
    ref: "concepts.md#key-socket-options"

  - id: socket-programming-io-multiplexing-052
    difficulty: intermediate
    tags: [readiness, workflow, epoll]
    question: |
      What is the intended workflow when using a readiness API like epoll or kqueue?
    options:
      - "Block in a plain recv() on each registered socket in turn, one fd at a time in a fixed rotation"
      - "Submit each operation and let the kernel copy the data directly into your buffer, notifying you on completion"
      - "Poll every registered fd with a non-blocking recv() each iteration regardless of what readiness the API reported"
      - "Wait for the API to report which fds are ready, then perform non-blocking I/O only on those fds"
    answer: 3
    explanation: |
      Readiness (synchronous multiplexing) APIs report which fds are ready to read/write;
      you then do non-blocking I/O only on the ready ones. (Copy-then-notify-on-completion
      describes completion-based models like io_uring/IOCP, not epoll.)
    ref: "concepts.md#readiness-io-models-select-poll-epoll-kqueue"

  - id: socket-programming-io-multiplexing-053
    difficulty: beginner
    tags: [udp, listen, misconception]
    question: |
      Which statement about a UDP server is correct?
    options:
      - "It must call listen() to mark the socket passive and accept() to dequeue a peer before any datagram can be read"
      - "It performs a miniature 3-way SYN handshake for every individual datagram before delivering the payload"
      - "It does not call listen() or accept(); after bind() it uses recvfrom()"
      - "It uses SOCK_STREAM sockets and relies on the kernel to frame each datagram back into discrete messages"
    answer: 2
    explanation: |
      UDP is connectionless, so there is nothing to listen for or accept. A UDP server does
      socket() → bind() → recvfrom()/sendto(). listen()/accept() are TCP (SOCK_STREAM)
      concepts.
    ref: "concepts.md#udp-sockets-connectionless-datagrams"

  - id: socket-programming-io-multiplexing-054
    difficulty: advanced
    tags: [level-triggered, edge-triggered, tradeoff]
    question: |
      Which statement best contrasts level-triggered and edge-triggered modes?
    options:
      - "Level-triggered mode works only on connectionless UDP sockets, while edge-triggered works only on TCP streams"
      - "ET reports readiness continuously while the condition persists, whereas LT reports it just once per state transition"
      - "Both modes require the application to busy-poll each fd in a tight loop to actually detect that it has become ready"
      - "LT reports readiness while the condition persists (forgiving); ET reports once per transition (fewer wakeups but you must fully drain the fd)"
    answer: 3
    explanation: |
      Level-triggered keeps reporting an fd ready as long as the condition holds (like
      select/poll). Edge-triggered notifies only on transitions, giving fewer wakeups but
      requiring you to drain the fd to EAGAIN or lose the notification.
    ref: "concepts.md#level-triggered-vs-edge-triggered"

  - id: socket-programming-io-multiplexing-055
    difficulty: intermediate
    tags: [c10m, kernel-bypass, scaling]
    question: |
      The "C10M" evolution of the C10K problem pushes toward which kinds of techniques?
    options:
      - "Kernel-bypass user-space networking (e.g. DPDK) and SO_REUSEPORT sharding across cores"
      - "Reverting to a simple one-thread-per-connection model with a blocking accept loop"
      - "Using select() with FD_SETSIZE recompiled to a far larger per-process ceiling"
      - "Switching all connection traffic to UDP to shed TCP's per-socket state"
    answer: 0
    explanation: |
      C10M (10 million connections) goes beyond epoll to kernel-bypass/user-space
      networking (DPDK), per-core SO_REUSEPORT sharding, and careful lock-free designs to
      remove per-packet kernel and syscall overhead.
    ref: "concepts.md#the-c10k-problem"

  - id: socket-programming-io-multiplexing-056
    difficulty: expert
    tags: [shutdown, close, dup, fork]
    question: |
      A connection's fd was inherited by a forked child process. The parent calls
      `close(fd)` on it, yet the peer's `recv` never returns 0 (no FIN arrives). Why, and
      what call would have sent the FIN regardless?
    options:
      - "close() always transmits a FIN on the very first call regardless of any other references, so the peer must be buggy — the fix is simply to retry the teardown with a second close() on the parent's fd"
      - "close() only decrements the open file description's refcount, so the FIN is deferred until the child also closes; shutdown(fd, SHUT_WR) sends FIN immediately regardless of refcount"
      - "The FIN was actually sent on the wire but the kernel's retransmit queue silently dropped it under load; setting SO_LINGER with a nonzero timeout would have forced the stack to resend it reliably"
      - "fork() quietly converts an inherited stream socket into a UDP datagram socket, which carries no FIN at all, so only the child's eventual close() has any effect on teardown"
    answer: 1
    explanation: |
      close() decrements the reference count on the underlying open file description; TCP
      sends FIN only when the *last* referencing fd is closed. A forked (or dup'd) copy
      keeps the connection alive. shutdown(fd, SHUT_WR) acts on the connection itself and
      sends FIN immediately, independent of how many fds reference it.
    ref: "concepts.md#graceful-shutdown-shutdown-vs-close"

  - id: socket-programming-io-multiplexing-057
    difficulty: advanced
    tags: [shutdown, graceful-drain, deploy]
    question: |
      You want a zero-downtime deploy where in-flight responses are not truncated. What is
      the correct per-connection drain sequence?
    options:
      - "close() every socket immediately the moment the deploy starts, then launch the new process and let the peers re-establish any connections they still need"
      - "Set SO_LINGER to 0 and close(), forcing a fast abortive RST on each connection so the old process exits without waiting on any in-flight bytes"
      - "shutdown(SHUT_RD) on each socket to stop reading, then exit the process and rely on the kernel to flush whatever remains in the send buffers"
      - "Stop accepting, shutdown(fd, SHUT_WR) to send FIN, keep recv-ing until recv returns 0, then close()"
    answer: 3
    explanation: |
      The graceful drain half-closes your write side with shutdown(SHUT_WR) (sends FIN)
      while you continue reading the peer's remaining data until EOF (recv == 0), then
      close(). Immediately closing — especially with a zero-linger RST — can discard
      in-flight response bytes.
    ref: "concepts.md#graceful-shutdown-shutdown-vs-close"

  - id: socket-programming-io-multiplexing-058
    difficulty: advanced
    tags: [close-wait, debugging, teardown]
    question: |
      `ss -tan` shows thousands of sockets stuck in `CLOSE_WAIT` on your server, growing
      until it hits the fd limit. What does this indicate?
    options:
      - "Your application received the peer's FIN (recv == 0) but never called close()/shutdown() on those fds"
      - "Your side is actively closing many connections, so these are the expected transient states of a normal active close and they drain on their own within a 2×MSL timer"
      - "A SYN flood is filling the incomplete-handshake SYN queue, and CLOSE_WAIT is how the kernel parks those half-open embryonic connections until they are validated"
      - "The peer is refusing to send its final ACK to your FIN, a network-side problem that leaves your sockets pinned in CLOSE_WAIT until the route recovers"
    answer: 0
    explanation: |
      CLOSE_WAIT means the peer sent FIN but your application never responded by closing
      the fd. Unlike TIME_WAIT (which drains on a timer), CLOSE_WAIT never clears until your
      code acts — a growing pile is a classic fd-leak bug where EOF is detected but close()
      is forgotten.
    ref: "concepts.md#tcp-teardown-states-time-wait-and-close-wait"

  - id: socket-programming-io-multiplexing-059
    difficulty: expert
    tags: [time-wait, teardown, active-close]
    question: |
      Which end of a TCP connection enters `TIME_WAIT`, and what is its primary purpose?
    options:
      - "The passive listener that received the first FIN; it holds the state to reserve the local port so the next accept() on that listener can reuse it cleanly"
      - "Whichever end sends the first FIN (the active closer); it absorbs delayed duplicate segments and lets the final ACK be retransmitted"
      - "Both ends enter it simultaneously as the connection tears down; the paired timers synchronize their final sequence numbers before the 4-tuple is released"
      - "The end that advertised the larger receive window; it lingers in the state to throttle the connection's closing rate and drain any queued congestion-window data"
    answer: 1
    explanation: |
      The active closer (sender of the first FIN) enters TIME_WAIT for ~2×MSL. It ensures
      any delayed duplicates from the old connection die out before the 4-tuple is reused,
      and that the final ACK can be re-sent if the peer retransmits its FIN (RFC 9293 §3.5).
    ref: "concepts.md#tcp-teardown-states-time-wait-and-close-wait"

  - id: socket-programming-io-multiplexing-060
    difficulty: expert
    tags: [epollexclusive, thundering-herd, epoll]
    question: |
      Eight worker processes each add the same shared listening fd to their own epoll
      instance. Under load you see all eight wake per incoming connection, seven getting
      EAGAIN on accept(). Which epoll flag directly addresses this?
    options:
      - "EPOLLRDHUP on the listening fd, so the kernel reports peer half-close and coalesces the redundant accept wakeups into one"
      - "EPOLLONESHOT on each worker's registration, so the listener fires just once per worker and the other seven are permanently disarmed"
      - "EPOLLEXCLUSIVE, added with EPOLL_CTL_ADD, so the kernel wakes only a subset of waiters"
      - "EPOLLET, converting the listener to edge-triggered so a single connection edge wakes exactly one of the eight blocked workers"
    answer: 2
    explanation: |
      This is the epoll-level thundering herd (many epoll instances on one shared listener).
      EPOLLEXCLUSIVE (Linux 4.5+) tells the kernel to wake only one/a subset of waiters. It
      is valid only with EPOLL_CTL_ADD; EPOLL_CTL_MOD on it returns EINVAL.
    ref: "concepts.md#epoll-flags-epollexclusive-epolloneshot-epollrdhup"

  - id: socket-programming-io-multiplexing-061
    difficulty: expert
    tags: [epollexclusive, constraints, epoll-ctl]
    question: |
      Which statement about `EPOLLEXCLUSIVE` is correct?
    options:
      - "It can be freely toggled on and off at runtime with EPOLL_CTL_MOD, letting a worker opt in or out of exclusive wakeups between epoll_wait cycles"
      - "It is only valid with EPOLL_CTL_ADD; calling EPOLL_CTL_MOD on an EPOLLEXCLUSIVE fd fails with EINVAL, and only EPOLLIN/OUT/WAKEUP/ET may accompany it"
      - "It is a drop-in replacement for SO_REUSEPORT that operates on separate per-worker sockets, sharding accepts across cores via a kernel 4-tuple hash"
      - "It guarantees that exactly one waiter wakes per event, chosen by a strict round-robin rotation across all registered epoll instances for fairness"
    answer: 1
    explanation: |
      EPOLLEXCLUSIVE may only be set at EPOLL_CTL_ADD time; EPOLL_CTL_MOD returns EINVAL,
      and the only companion flags permitted are EPOLLIN/EPOLLOUT/EPOLLWAKEUP/EPOLLET. It
      wakes one or more (a subset), not with guaranteed strict fairness, and it addresses a
      *shared* fd — distinct from SO_REUSEPORT's separate sockets.
    ref: "concepts.md#epoll-flags-epollexclusive-epolloneshot-epollrdhup"

  - id: socket-programming-io-multiplexing-062
    difficulty: expert
    tags: [epolloneshot, multithreaded, re-arm]
    question: |
      In a multi-threaded epoll server, you use `EPOLLONESHOT` on each connection fd. What
      is its effect and what must you do after handling an event?
    options:
      - "It disables the fd after one event so only one thread processes it at a time; you must re-arm it with EPOLL_CTL_MOD when done"
      - "It fires the fd's event exactly once for the whole lifetime of the connection; after that single delivery the descriptor is spent and must be closed"
      - "It permanently converts the fd from edge-triggered to level-triggered mode after the first event, so no re-arming or further bookkeeping is needed"
      - "It broadcasts the same event to all worker threads simultaneously, so you must take an explicit per-fd lock to keep them from racing on the connection"
    answer: 0
    explanation: |
      EPOLLONESHOT disables further events for the fd after one is delivered, guaranteeing
      only one worker thread handles a given connection concurrently. Once the handler
      finishes, you re-arm the fd via EPOLL_CTL_MOD to receive the next event.
    ref: "concepts.md#epoll-flags-epollexclusive-epolloneshot-epollrdhup"

  - id: socket-programming-io-multiplexing-063
    difficulty: advanced
    tags: [epollrdhup, half-close, edge-triggered]
    question: |
      Under edge-triggered epoll, you want to detect that the peer has half-closed (sent
      FIN via shutdown(SHUT_WR)) while you may still be writing. Which mechanism is designed
      for this?
    options:
      - "SO_KEEPALIVE probes, whose idle-connection heartbeats surface a peer's SHUT_WR half-close as soon as the next probe interval elapses"
      - "EPOLLRDHUP, which fires on peer half-close so you notice it without waiting for a failed recv"
      - "EPOLLONESHOT re-arming, which redelivers the read edge on every EPOLL_CTL_MOD and thereby exposes the peer's FIN to your handler"
      - "Polling SO_ERROR via getsockopt on every write, since a peer half-close latches a pending error there that the next write can read back"
    answer: 1
    explanation: |
      EPOLLRDHUP (Linux 2.6.17+) reports that the peer shut down its write side / sent FIN,
      the correct edge-triggered way to learn a peer went away while you might still have
      data to send, rather than discovering it later on a failing recv.
    ref: "concepts.md#epoll-flags-epollexclusive-epolloneshot-epollrdhup"

  - id: socket-programming-io-multiplexing-064
    difficulty: expert
    tags: [thundering-herd, accept, so-reuseport]
    question: |
      A candidate proposes "add EPOLLEXCLUSIVE" to fix a herd where each worker has its own
      separate socket bound to the same port via SO_REUSEPORT. Why is this misguided?
    options:
      - "EPOLLEXCLUSIVE is implemented only for connectionless UDP datagram sockets, so it can never be attached to the TCP listeners a SO_REUSEPORT group uses"
      - "SO_REUSEPORT already gives each worker a distinct socket with no shared wait queue, so there is no herd on a shared fd for EPOLLEXCLUSIVE to fix"
      - "EPOLLEXCLUSIVE, once set on any socket in the group, disables the kernel's SO_REUSEPORT load balancing and funnels every accept back to a single worker"
      - "SO_REUSEPORT can only be used with level-triggered epoll registrations, and that mode is fundamentally incompatible with the EPOLLEXCLUSIVE flag"
    answer: 1
    explanation: |
      EPOLLEXCLUSIVE fixes a herd on a *shared* listening fd watched by multiple epoll
      instances. SO_REUSEPORT removes the shared fd entirely — each worker has its own
      socket and the kernel picks one per connection — so there is no shared wait queue to
      stampede and EPOLLEXCLUSIVE is irrelevant.
    ref: "concepts.md#the-three-thundering-herd-cases"

  - id: socket-programming-io-multiplexing-065
    difficulty: expert
    tags: [accept4, cloexec, race]
    question: |
      Why is `accept4(fd, ..., SOCK_NONBLOCK | SOCK_CLOEXEC)` preferred over `accept()`
      followed by `fcntl()` to set the same flags?
    options:
      - "accept4 is faster because it dequeues the connection before the TCP handshake finishes, skipping the final ACK wait that plain accept() blocks on"
      - "fcntl() is unable to set the non-blocking flag on a freshly accepted socket at all, so accept4 is the only way to obtain a non-blocking connection fd"
      - "accept() plus fcntl() leaves a race window in which a concurrent fork()+exec() can leak the new socket into a child; accept4 sets both flags atomically"
      - "accept4 hands back the original listening fd instead of a new one, avoiding the extra descriptor that plain accept() would otherwise allocate per client"
    answer: 2
    explanation: |
      Plain accept() returns a blocking fd without close-on-exec; setting the flags after
      the fact leaves a window where another thread's fork()+exec() inherits the socket,
      leaking the connection into the child. accept4 sets SOCK_NONBLOCK|SOCK_CLOEXEC
      atomically at accept time, closing the race.
    ref: "concepts.md#accept4-and-the-epoll-fd-lifetime-gotcha"

  - id: socket-programming-io-multiplexing-066
    difficulty: expert
    tags: [epoll, fd-lifetime, dup, gotcha]
    question: |
      You `EPOLL_CTL_ADD` an fd, then `dup()` it. You later `close()` the original fd but
      epoll keeps reporting events for the connection. Why?
    options:
      - "epoll caches a copy of each fd's pending events for 2×MSL after close(), replaying them until that TIME_WAIT-style grace interval expires"
      - "An fd is removed from the interest set only when all fds referring to the same open file description are closed; the dup keeps it registered — you must EPOLL_CTL_DEL explicitly"
      - "dup() automatically re-adds the duplicated fd to the same epoll interest set, forcing it back into level-triggered mode in the process"
      - "close() on a duplicated fd is treated as a no-op by the kernel and is deferred entirely until the owning process exits or calls exec()"
    answer: 1
    explanation: |
      epoll tracks the underlying open file description. It drops the registration only when
      every fd referring to that description is closed. After dup()/fork(), closing one copy
      does not stop events — you must EPOLL_CTL_DEL (or close all duplicates).
    ref: "concepts.md#accept4-and-the-epoll-fd-lifetime-gotcha"

  - id: socket-programming-io-multiplexing-067
    difficulty: expert
    tags: [epoll, stale-event, batch, debugging]
    question: |
      Processing a batch returned by one `epoll_wait`, you close a connection while handling
      event #13. Later in the same batch, event #47 references the same fd number and you
      operate on the wrong connection. What is the root cause and a robust fix?
    options:
      - "epoll_wait handed back a partially corrupted event array; the fix is to discard the batch and call epoll_wait again to refresh the ready list with clean data"
      - "The fd number was reused by a new connection after you closed it mid-batch; track a per-fd generation/validity marker or defer closes until the batch is fully processed"
      - "The kernel is required never to recycle a file-descriptor number while any pending epoll event references it, so a repeated fd number here is a genuine kernel bug"
      - "Edge-triggered mode emitted a spurious duplicate event for the same connection; switching the interest set to level-triggered mode makes the stale second event disappear"
    answer: 1
    explanation: |
      Closing an fd mid-batch frees its integer, which the kernel can immediately reassign
      to a new connection. A stale event later in the same batch then points at the reused
      number. Robust loops validate each event against a generation counter or defer closes
      until the batch completes.
    ref: "concepts.md#accept4-and-the-epoll-fd-lifetime-gotcha"

  - id: socket-programming-io-multiplexing-068
    difficulty: expert
    tags: [tcp-cork, nodelay, sendfile]
    question: |
      A server uses `TCP_CORK` around a header write plus a `sendfile()` body. It also has
      `TCP_NODELAY` set. What is the interaction?
    options:
      - "TCP_NODELAY always takes precedence over TCP_CORK, so the cork is silently ignored and the header flushes as its own tiny segment ahead of the body"
      - "The two options are mutually exclusive, so setsockopt() rejects the second one with EINVAL once the first has been set on the socket"
      - "While TCP_CORK is set it overrides TCP_NODELAY, coalescing the header and body into full segments; toggling TCP_NODELAY while corked forces a one-time flush"
      - "Both TCP_CORK and TCP_NODELAY must be enabled together before sendfile() will transfer any bytes from the file to the socket at all"
    answer: 2
    explanation: |
      TCP_CORK holds partial segments (up to ~200 ms) so header+body coalesce into
      full-sized packets, and it overrides TCP_NODELAY while set. Explicitly toggling
      TCP_NODELAY on a corked socket triggers a one-time flush of what is buffered.
    ref: "concepts.md#tcp-latency-and-buffering-knobs"

  - id: socket-programming-io-multiplexing-069
    difficulty: expert
    tags: [nagle, delayed-ack, quickack, mechanics]
    question: |
      Explain precisely why Nagle plus delayed-ACK produces a ~40 ms stall, and which knob
      resets on its own.
    options:
      - "Nagle withholds a new small segment until the prior one is ACKed, while the peer's delayed-ACK withholds that ACK (~40 ms) hoping to piggyback — a mutual wait; TCP_QUICKACK disables delayed ACK but is non-permanent and must be re-set"
      - "The receiver silently discards the small segments, forcing a fixed 40 ms retransmission timer on the sender; enlarging SO_RCVBUF removes the drops and fixes the stall permanently"
      - "The 40 ms delay is the initial SYN retransmit timer firing during the handshake; enabling TCP_DEFER_ACCEPT on the listener resets that timer exactly once per connection"
      - "Delayed ACK causes the congestion window to double each RTT during slow start, and setting TCP_NODELAY on the receiving side is the only knob that suppresses the growth"
    answer: 0
    explanation: |
      Nagle (RFC 896) holds a new small segment until the previous unacked one is ACKed; the
      peer's delayed ACK (RFC 1122) holds the ACK up to ~40–200 ms awaiting piggyback data.
      Each waits for the other. TCP_QUICKACK disables delayed ACK but the kernel resets it,
      so it is not permanent.
    ref: "concepts.md#tcp-latency-and-buffering-knobs"

  - id: socket-programming-io-multiplexing-070
    difficulty: advanced
    tags: [tcp-fastopen, rfc7413, 0-rtt]
    question: |
      What does `TCP_FASTOPEN` (RFC 7413) enable, and what is its key caveat?
    options:
      - "It carries application data in the SYN using a Fast Open cookie so data can be delivered before the handshake completes; the caveat is SYN data can be replayed, so only idempotent requests are safe"
      - "It compresses the entire three-way handshake into a single round-trip packet with no security or reliability downside whatsoever for any workload"
      - "It removes the need for a listening socket entirely, letting the kernel accept and route incoming connections straight to the process without bind()/listen()"
      - "It transparently encrypts the SYN and its payload, replacing the TLS handshake so the very first application byte is already confidential on the wire"
    answer: 0
    explanation: |
      TCP Fast Open lets a client include data in the SYN using a server-issued cookie,
      giving a 0-RTT data path for repeat clients so accept() can return before the
      handshake fully completes. Because SYN payloads can be replayed by the network or an
      attacker, only idempotent operations should use it.
    ref: "concepts.md#tcp-latency-and-buffering-knobs"

  - id: socket-programming-io-multiplexing-071
    difficulty: advanced
    tags: [tcp-defer-accept, wakeup, request-response]
    question: |
      What does `TCP_DEFER_ACCEPT` change about when `accept()` returns?
    options:
      - "accept() returns the moment the initial SYN arrives, handing the server a connection fd before the three-way handshake has actually completed"
      - "accept() blocks the calling thread until the listener's accept queue has filled to its backlog limit, then returns all the queued connections in one batch"
      - "accept() returns only once the client has sent data, not merely completed the handshake — saving a wakeup for request/response servers whose first read then has data waiting"
      - "accept() returns exactly one connection fd for every SYN cookie the kernel issued during the last SYN-flood mitigation window"
    answer: 2
    explanation: |
      TCP_DEFER_ACCEPT delays the accept()-visible completion until the client sends its
      first data (e.g. the HTTP request). The server thread is not woken for a bare
      connection with nothing to read, and its first recv immediately has data.
    ref: "concepts.md#tcp-latency-and-buffering-knobs"

  - id: socket-programming-io-multiplexing-072
    difficulty: expert
    tags: [tcp-user-timeout, keepalive, dead-peer]
    question: |
      You need to detect a dead peer within seconds on a connection that is actively trying
      to send, faster than the 2-hour keepalive default. Which option is the direct answer?
    options:
      - "Lower SO_RCVBUF sharply so the shrunken receive window forces the stack to time out and abort a stalled connection within a few seconds"
      - "TCP_NODELAY, which by disabling Nagle's buffering makes the stack surface an unreachable-peer error on the very next unacknowledged send"
      - "SO_LINGER configured with a short nonzero timeout, so close() blocks only briefly and then reports the dead peer via an error return"
      - "TCP_USER_TIMEOUT, which bounds how long unacknowledged data may sit before TCP fails the connection with ETIMEDOUT (and also modifies keepalive tolerance)"
    answer: 3
    explanation: |
      TCP_USER_TIMEOUT (RFC 5482) caps how long transmitted-but-unacknowledged data may
      remain outstanding before TCP errors with ETIMEDOUT. Unlike keepalive it applies to
      actively-sending connections, and it also overrides how long keepalive probes are
      tolerated.
    ref: "concepts.md#detecting-dead-peers-keepalive-and-user-timeout"

  - id: socket-programming-io-multiplexing-073
    difficulty: expert
    tags: [io-uring, sqpoll, rings]
    question: |
      In `io_uring`, what does `SQPOLL` mode achieve?
    options:
      - "It makes io_uring rescan and poll every registered socket individually like select() on each submission to find which fds are ready"
      - "It disables the completion queue ring to save memory, so results are read back synchronously from each submission entry instead"
      - "A dedicated kernel thread polls the submission queue, so submitting work needs zero syscalls in steady state"
      - "It converts io_uring from completion-based into a readiness-based Reactor interface that only signals when an fd is ready to read"
    answer: 2
    explanation: |
      io_uring uses shared submission (SQ) and completion (CQ) rings. In SQPOLL mode a kernel
      thread continuously polls the SQ, so the application enqueues SQEs without calling
      io_uring_enter() — eliminating submission syscalls in the steady state.
    ref: "concepts.md#io_uring-internals"

  - id: socket-programming-io-multiplexing-074
    difficulty: advanced
    tags: [io-uring, security, multishot]
    question: |
      Which statement about `io_uring` is accurate?
    options:
      - "It is a readiness-notification API like epoll that only signals when a descriptor is ready, and like epoll it cannot perform regular-file I/O because files always report ready"
      - "It requires a separate submission and completion ring pair to be allocated for every single file descriptor, so a busy server must maintain thousands of independent rings at once"
      - "It works exclusively with connectionless UDP datagram sockets and cannot be used for TCP stream connections or for any form of regular-file or pipe I/O"
      - "It is completion-based, supports multishot accept/recv and registered buffers, works for regular-file I/O, and is disabled by default in some hardened environments due to kernel CVEs"
    answer: 3
    explanation: |
      io_uring is a completion-based (Proactor) interface: multishot ops keep producing
      completions without re-submission, registered/fixed buffers avoid per-op overhead, and
      it handles regular files unlike epoll. Because of several kernel CVEs, some hardened
      setups disable it by default.
    ref: "concepts.md#io_uring-internals"

  - id: socket-programming-io-multiplexing-075
    difficulty: expert
    tags: [msg-zerocopy, errqueue, zero-copy]
    question: |
      With `MSG_ZEROCOPY` on `send()`, why is completion notification delivered
      asynchronously via the error queue (`MSG_ERRQUEUE`), and when is it worthwhile?
    options:
      - "Because the kernel actually copies the data twice and posts the second redundant copy to the error queue as a checksum; it is worthwhile mainly for very tiny sub-page buffers"
      - "Because zero-copy send disables normal TCP acknowledgements and the resulting ACKs are instead redirected onto the socket's error queue for the application to reap manually"
      - "Because the kernel pins the user pages and transmits directly from them, so they must stay stable until the NIC is done; worthwhile mainly for large buffers where the saved copy outweighs pinning/tracking overhead"
      - "Because MSG_ZEROCOPY silently converts the stream socket to UDP datagram mode, and UDP surfaces all of its delivery errors asynchronously through the error queue"
    answer: 2
    explanation: |
      Zero-copy send pins user pages and DMAs from them, so the buffer cannot be reused until
      transmission completes — hence an async completion on MSG_ERRQUEUE. The page-pinning
      and completion bookkeeping only pay off for large transfers.
    ref: "concepts.md#zero-copy-transmit-sendfile-splice-and-zero-copy-send"

  - id: socket-programming-io-multiplexing-076
    difficulty: advanced
    tags: [sendfile, splice, zero-copy]
    question: |
      A static-file server wants to send a file to a socket without copying bytes through
      user space. Which call does this, and what generalizes it for socket-to-socket
      proxying?
    options:
      - "A plain read()+write() loop through a user-space buffer; splice() merely generalizes that same copy-through-user-space pattern to arbitrary descriptor pairs"
      - "mmap() the file then send() the mapping, which avoids the read copy; sendmsg() with multiple iovecs generalizes it to socket-to-socket forwarding"
      - "sendfile() copies file→socket entirely in-kernel; splice() moves bytes between two fds via a kernel pipe, useful for socket→socket proxying"
      - "recvfrom()+sendto() bouncing each chunk through user space; writev() generalizes it by gathering the chunks into one vectored socket-to-socket write"
    answer: 2
    explanation: |
      sendfile() transfers file→socket inside the kernel with no user-space buffer. splice()
      generalizes zero-copy movement between two descriptors through a kernel pipe, which is
      the basis for zero-copy socket-to-socket proxying.
    ref: "concepts.md#zero-copy-transmit-sendfile-splice-and-zero-copy-send"

  - id: socket-programming-io-multiplexing-077
    difficulty: expert
    tags: [unix-sockets, scm-rights, fd-passing]
    question: |
      A privilege-separated design must hand an already-accepted TCP connection from one
      process to another on the same host. Which mechanism does this?
    options:
      - "Serialize the connection's established 4-tuple to the other process and have it call connect() with the same local and remote addresses to re-attach"
      - "Copy the integer fd number into a shared-memory segment both processes map, so the second process can read/write the same socket through that number"
      - "Bind both processes to the same port with SO_REUSEPORT so the kernel routes the already-accepted connection's packets to whichever process reads next"
      - "Pass the open file descriptor as SCM_RIGHTS ancillary data over a Unix domain socket via sendmsg()/recvmsg()"
    answer: 3
    explanation: |
      SCM_RIGHTS over an AF_UNIX socket passes an actual open file descriptor (including a
      live connection) to another process using sendmsg()/recvmsg() ancillary data. Merely
      sharing the integer fd number is meaningless across processes; the kernel must
      duplicate the description.
    ref: "concepts.md#unix-domain-sockets-vs-tcp-loopback"

  - id: socket-programming-io-multiplexing-078
    difficulty: advanced
    tags: [unix-sockets, so-peercred, seqpacket]
    question: |
      Which capability is unique to Unix domain sockets (versus TCP over loopback)?
    options:
      - "Per-connection congestion control that throttles the byte rate between the two communicating processes as if they were remote peers on a lossy WAN"
      - "A full 3-way SYN handshake with initial sequence-number negotiation and window scaling exchanged between the two local processes before data flows"
      - "Automatic transparent TLS encryption of the byte stream between the two processes, negotiated by the kernel without any application-level library"
      - "Peer authentication via SO_PEERCRED/SCM_CREDENTIALS (kernel-verified PID/UID) and fd passing, plus SOCK_SEQPACKET for reliable message-boundary-preserving streams"
    answer: 3
    explanation: |
      Unix domain sockets skip the TCP/IP stack and add features TCP cannot: SO_PEERCRED /
      SCM_CREDENTIALS give kernel-verified peer identity for authorization, SCM_RIGHTS passes
      fds, and SOCK_SEQPACKET offers connection-oriented, reliable, message-bounded delivery.
    ref: "concepts.md#unix-domain-sockets-vs-tcp-loopback"

  - id: socket-programming-io-multiplexing-079
    difficulty: expert
    tags: [so-reuseport, rebalance-race, drain]
    question: |
      A worker in a `SO_REUSEPORT` group calls `close()` on its socket to exit. Some
      in-flight client connections are reset. Why, and how do you avoid it?
    options:
      - "SO_REUSEPORT groups never lose in-flight connections on close(), so the observed resets must be coming from an unrelated firewall or client-side timeout"
      - "The kernel automatically migrates a closing socket's queued connections to the surviving group members, so the resets can only be a bug in the client's retry logic"
      - "Connections already committed to that socket's accept/SYN queue are dropped when it closes; the worker must stop accepting but drain its queue before closing"
      - "close() on any REUSEPORT socket broadcasts an RST to every connection in the whole group, so you must always tear workers down with shutdown() rather than close()"
    answer: 2
    explanation: |
      The kernel commits an incoming connection to a specific socket in the group (by 4-tuple
      hash). Connections already queued on the closing socket are lost on close(). Graceful
      worker shutdown stops accepting new work but drains the existing accept queue before
      closing.
    ref: "concepts.md#so_reuseport-internals-and-the-rebalance-race"

  - id: socket-programming-io-multiplexing-080
    difficulty: expert
    tags: [so-reuseport, bpf, incoming-cpu, numa]
    question: |
      To improve cache/NUMA locality you want each connection handled by the worker running
      on the same CPU as the NIC RX queue that received it. Which facilities enable this?
    options:
      - "Only the kernel's fixed default 4-tuple hash is available for REUSEPORT selection, so which worker handles a connection cannot be steered toward the RX-queue CPU at all"
      - "Setting TCP_NODELAY to disable Nagle plus enlarging SO_RCVBUF on each worker socket, which together bias the kernel toward delivering connections to the nearest CPU"
      - "Registering the shared listener with EPOLLEXCLUSIVE together with per-worker CPU-affinity flags, which makes the kernel wake only the worker pinned to the NIC's CPU"
      - "SO_ATTACH_REUSEPORT_CBPF/EBPF (or BPF_PROG_TYPE_SK_REUSEPORT) to steer selection, combined with SO_INCOMING_CPU to pin to the RX-queue CPU"
    answer: 3
    explanation: |
      The default SO_REUSEPORT selection is a 4-tuple hash, but SO_ATTACH_REUSEPORT_CBPF/EBPF
      and BPF_PROG_TYPE_SK_REUSEPORT let you replace it with a custom program that, together
      with SO_INCOMING_CPU, steers a connection to the worker on the NIC RX-queue's CPU.
    ref: "concepts.md#so_reuseport-internals-and-the-rebalance-race"

  - id: socket-programming-io-multiplexing-081
    difficulty: expert
    tags: [sigpipe, msg-nosignal, crash]
    question: |
      Your server occasionally dies with no logged error right when a client disconnects
      abruptly. The handler does a plain `write()`/`send()` to the socket. What is the cause
      and fix?
    options:
      - "The kernel send buffer overflowed on the disconnect and silently aborted the process; enlarging SO_SNDBUF so writes never fill the buffer removes the crash"
      - "The peer's connection reset corrupted the process's memory through the socket buffer; enabling ASLR hardens the address space and stops the crashes"
      - "Writing to a socket whose peer sent FIN/RST raises SIGPIPE, whose default action kills the process; pass MSG_NOSIGNAL (or ignore SIGPIPE / set SO_NOSIGPIPE) so send returns -1/EPIPE instead"
      - "The abrupt disconnect made recv return 0 and a later length calculation divided by that zero, so guarding the divisor before the write is the fix"
    answer: 2
    explanation: |
      send()/write() to a socket whose peer has closed generates SIGPIPE, which by default
      terminates the process — a classic silent crash on client disconnect. MSG_NOSIGNAL per
      call (or globally ignoring SIGPIPE, or SO_NOSIGPIPE on BSD) makes it return -1 with
      EPIPE for normal error handling.
    ref: "concepts.md#vectored-io-and-sendrecv-flags"

  - id: socket-programming-io-multiplexing-082
    difficulty: advanced
    tags: [writev, sendmsg, scatter-gather]
    question: |
      Why send a message header and body with a single `writev()`/`sendmsg()` scatter-gather
      call instead of two separate writes?
    options:
      - "It transparently encrypts the header buffer while leaving the body in clear text, so a single call gives you authenticated framing without a TLS library"
      - "It guarantees the receiving peer will read the header and the body back as exactly two distinct datagrams with a preserved boundary between them on a TCP stream"
      - "It emits header and body in one syscall from separate buffers, avoiding an extra concatenation copy and the tiny-header-then-body pattern that can trigger Nagle stalls; sendmsg also carries ancillary data (cmsg)"
      - "It disables partial writes entirely, so writev() is guaranteed to either transfer every byte of both buffers atomically or return -1 without sending anything"
    answer: 2
    explanation: |
      Vectored I/O gathers multiple buffers into one syscall, so you avoid copying to
      concatenate and avoid sending a small header packet followed separately by the body
      (which can incur Nagle delay). sendmsg/recvmsg additionally carry ancillary data such
      as SCM_RIGHTS.
    ref: "concepts.md#vectored-io-and-sendrecv-flags"

  - id: socket-programming-io-multiplexing-083
    difficulty: expert
    tags: [edge-triggered, epollout, starvation]
    question: |
      In an edge-triggered server, which practice about `EPOLLOUT` and fairness is correct?
    options:
      - "Register EPOLLOUT permanently on every connection so a socket is always reported writable and you can send at any time without checking readiness"
      - "Never register EPOLLOUT at all, because under edge-triggered mode writes to a connected socket can never block or return EAGAIN and so never need a writable edge"
      - "Always keep reading one hot fd until it returns EAGAIN before touching any other descriptor, since fully draining the busiest connection first maximizes overall throughput"
      - "Register EPOLLOUT only after a write returns EAGAIN, drain the send buffer on the writable edge, then deregister EPOLLOUT; and cap per-fd reads with a round-robin ready list to avoid starving other fds"
    answer: 3
    explanation: |
      A connected socket is usually writable, so a permanent EPOLLOUT registration causes
      busy wakeups. The correct ET pattern arms EPOLLOUT only when a write hits EAGAIN,
      drains on the writable edge, then disarms it. Draining one hot fd to EAGAIN can starve
      others, so cap per-fd work and round-robin a ready list (epoll(7)).
    ref: "concepts.md#edge-triggered-writes-and-starvation"

  - id: socket-programming-io-multiplexing-084
    difficulty: advanced
    tags: [kqueue, ev-clear, one-syscall]
    question: |
      Which pair of statements about `kqueue` (versus epoll) is correct?
    options:
      - "kqueue needs a separate registration syscall analogous to epoll_ctl before you can wait, and its EV_CLEAR flag selects level-triggered delivery just like epoll's default mode"
      - "kqueue can only report socket read/write readiness, so for timers and signals you still need auxiliary timerfd/signalfd-style descriptors exactly as on Linux"
      - "A single kevent() call passes both a changelist and an eventlist (modify and wait in one syscall); EV_CLEAR gives edge-triggered semantics and filters like EVFILT_TIMER/SIGNAL/VNODE unify timers, signals and file events"
      - "kqueue is a Linux-only syscall whose semantics are byte-for-byte identical to epoll_wait, so code written against one ports to the other without any change"
    answer: 2
    explanation: |
      kevent() takes a changelist and eventlist together, so registration and waiting happen
      in one syscall (epoll splits them into epoll_ctl + epoll_wait). EV_CLEAR is kqueue's
      edge-triggered mode, and filters (EVFILT_READ/WRITE/TIMER/SIGNAL/VNODE/PROC) unify
      event sources that Linux handles with separate fds.
    ref: "concepts.md#kqueue-specifics"

  - id: socket-programming-io-multiplexing-085
    difficulty: advanced
    tags: [accept-queue, overflow, debugging, scenario]
    question: |
      Under load, clients see occasional connection timeouts/resets but the server's CPU is
      low. `ss -lnt` shows the listener's Recv-Q at its Send-Q (backlog) limit and
      `nstat` reports rising `TcpExtListenOverflows`. What is happening?
    options:
      - "Ephemeral source-port exhaustion on the server's listening side, so the kernel runs out of 4-tuples and refuses the completed handshakes with a reset"
      - "A SYN flood is filling only the incomplete-handshake SYN queue, so half-open embryonic connections are dropped before the final ACK arrives"
      - "The accept queue is overflowing — the app is accepting too slowly or the backlog/somaxconn is too small — so completed connections are dropped and clients retransmit"
      - "TCP_NODELAY is missing on the listener, so Nagle's algorithm adds a fixed ~40 ms buffering delay to every new connection before it can be accepted"
    answer: 2
    explanation: |
      Recv-Q hitting the backlog on a listening socket plus ListenOverflows/ListenDrops
      means the accept queue is full: the application dequeues too slowly or the effective
      backlog (min(backlog, somaxconn)) is too small. Completed connections get dropped,
      forcing client retransmits seen as latency/resets despite low CPU.
    ref: "concepts.md#the-listen-backlog-and-accept-queue"

  - id: socket-programming-io-multiplexing-086
    difficulty: advanced
    tags: [ephemeral-ports, proxy, exhaustion, mitigation]
    question: |
      A reverse proxy fanning out to a single backend IP:port under high load starts failing
      to open new upstream connections. Which mitigation does NOT address the underlying
      4-tuple exhaustion?
    options:
      - "Connection pooling / keep-alive to reuse established upstream connections"
      - "Adding more source IPs on the proxy (or more backend ports) to widen the tuple space"
      - "Enabling TCP_NODELAY on the upstream sockets"
      - "Widening net.ipv4.ip_local_port_range (and enabling tcp_tw_reuse)"
    answer: 2
    explanation: |
      With fixed proxy-IP and fixed backend IP:port, only the source port varies (~28K
      tuples). Pooling, more source IPs/dest ports, and widening the local port range (plus
      tw_reuse) all enlarge or conserve the tuple space. TCP_NODELAY only affects Nagle
      buffering and does nothing for port exhaustion.
    ref: "concepts.md#tcp-teardown-states-time-wait-and-close-wait"

  - id: socket-programming-io-multiplexing-087
    difficulty: expert
    tags: [select, epoll, scaling, comparison]
    question: |
      Why can `epoll` scale to ~1M connections while `select` struggles past ~10K, stated
      precisely?
    options:
      - "select is implemented over an internal UDP control channel while epoll rides on TCP, and that transport difference is what lets epoll carry far more descriptors"
      - "epoll transparently schedules each registered connection onto its own dedicated kernel worker thread, so the kernel parallelizes the fd scanning that select does serially"
      - "select is fundamentally incompatible with non-blocking O_NONBLOCK sockets, so it is forced into a one-thread-per-fd model that epoll's non-blocking support avoids"
      - "select is capped by FD_SETSIZE (~1024), rescans all fds O(n), and rebuilds the fd_sets each call; epoll keeps a kernel-resident interest set and returns only ready fds (O(ready))"
    answer: 3
    explanation: |
      select is bounded by FD_SETSIZE (~1024), performs an O(n) rescan of every monitored
      fd, and destroys/rebuilds its fd_sets every call. epoll registers fds once in a
      kernel-resident interest set and epoll_wait returns only the ready fds, so cost tracks
      activity rather than total connections.
    ref: "concepts.md#readiness-io-models-select-poll-epoll-kqueue"

  - id: socket-programming-io-multiplexing-088
    difficulty: intermediate
    tags: [somaxconn, sysctl, current]
    question: |
      On a current mainstream Linux kernel (5.4+), what is the default value of
      `net.core.somaxconn` that caps the accept queue?
    options:
      - "128, the historical value left completely unchanged since the 1990s across every modern kernel release"
      - "1024, deliberately set to match the FD_SETSIZE limit that select() imposes on monitored descriptors"
      - "4096, raised from the old 128 default in Linux 5.4"
      - "65535, chosen to equal the maximum possible TCP port number so the queue can never be the bottleneck"
    answer: 2
    explanation: |
      net.core.somaxconn defaulted to 128 for decades but was raised to 4096 in Linux 5.4
      (2019). The effective accept-queue cap is still min(backlog, somaxconn), so passing a
      large backlog now works without a sysctl bump on modern kernels.
    ref: "concepts.md#the-listen-backlog-and-accept-queue"

  - id: socket-programming-io-multiplexing-089
    difficulty: advanced
    tags: [non-blocking, connect, writable-readable]
    question: |
      After a non-blocking `connect()` returns EINPROGRESS, the socket becomes both readable
      and writable at once in your event loop. How do you tell success from failure?
    options:
      - "A socket becoming both readable and writable is the kernel's unambiguous signal of a completed handshake, so you may simply proceed to send and receive"
      - "Call connect() a second time on the same fd; getting another EINPROGRESS on that retry confirms the original handshake has now finished successfully"
      - "Interpret the two conditions directly: a readable edge always means the connect failed and a writable edge always means it succeeded, with no further check needed"
      - "Check SO_ERROR via getsockopt (or a getpeername that fails): 0 means connected, a non-zero errno like ECONNREFUSED means the connect failed — writable-with-error can look identical to writable-with-data"
    answer: 3
    explanation: |
      A failed non-blocking connect can make the socket appear both readable and writable, so
      readiness alone is ambiguous. The definitive test is SO_ERROR (0 = connected, else the
      connection error); a failing getpeername() is a secondary signal.
    ref: "concepts.md#blocking-vs-non-blocking-sockets"
