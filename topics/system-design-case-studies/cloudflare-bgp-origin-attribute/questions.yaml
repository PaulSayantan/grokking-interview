topic: "Cloudflare: How Transit Providers Quietly Rewrite the BGP ORIGIN Attribute"
domain: system-design-case-studies
topic_slug: cloudflare-bgp-origin-attribute
version: 1
questions:
  - id: cloudflare-bgp-origin-attribute-001
    difficulty: beginner
    tags: [bgp, origin, routing]
    question: |
      According to the BGP RFC, what is the intended lifecycle of the ORIGIN
      attribute after the originating AS sets it?
    options:
      - "It is recomputed at every hop by each receiving router from its own local routing table"
      - "It should not be changed by any other BGP speaker along the path"
      - "It is stripped off entirely before the route ever leaves the originating AS's network"
      - "It is renegotiated between each pair of peering networks"
    answer: 1
    explanation: |
      The RFC says ORIGIN "SHOULD NOT be changed by any other speaker" — it is
      meant to be set once at the source and carried untouched. Cloudflare's point
      is that this promise is widely violated in practice.
    ref: "concepts.md#the-problem-an-immutable-routing-signal-that-everyone-edits"
  - id: cloudflare-bgp-origin-attribute-002
    difficulty: intermediate
    tags: [origin, values, path-selection]
    question: |
      Why does rewriting a route's ORIGIN value to IGP make that copy of the route
      more attractive to downstream routers?
    options:
      - "IGP is the lowest ORIGIN value, and BGP prefers the lower value on that tie-breaker"
      - "IGP forces the route to skip the AS_PATH length comparison entirely and jump ahead"
      - "IGP automatically raises the route's Local Preference value above all competing paths"
      - "IGP marks the route as customer-originated, a class routers are configured to always prefer"
    answer: 0
    explanation: |
      ORIGIN values are IGP (0), EGP (1), INCOMPLETE (2). BGP prefers the LOWER
      value at the ORIGIN tie-breaker, so rewriting to IGP (0) makes a network's
      copy win any tie that reaches that rung.
    ref: "concepts.md#the-three-origin-values-and-what-they-were-supposed-to-mean"
  - id: cloudflare-bgp-origin-attribute-003
    difficulty: intermediate
    tags: [best-path, tie-breaker, as-path]
    question: |
      In BGP's best-path decision ladder, when does the ORIGIN comparison actually
      decide the winner?
    options:
      - "Always first, evaluated before Local Preference is ever considered at all"
      - "Only after the MED comparison and the router ID tie-breaker are both already equal"
      - "Whenever the two routes originate from different ASes"
      - "Only when Local Preference and AS_PATH length are already tied"
    answer: 3
    explanation: |
      ORIGIN is the third rung: it is evaluated only after higher Local Preference
      and shorter AS_PATH fail to separate the candidates. Ties at the top two rungs
      are common on the real Internet, so ORIGIN quietly decides many routes.
    ref: "concepts.md#where-origin-sits-in-bgps-best-path-decision-and-why-that-matters"
  - id: cloudflare-bgp-origin-attribute-004
    difficulty: advanced
    tags: [incentives, arms-race, deprecation]
    question: |
      Why did merely disclosing ORIGIN rewriting (and the expired IETF draft) fail
      to stop the practice?
    options:
      - "Router vendors shipped firmware that was simply incapable of preserving the attribute unchanged"
      - "The incentives make it a revenue-driven arms race, so operators rewrite to level the playing field"
      - "The public BGP collectors could not observe the rewrites reliably enough to name the offenders"
      - "The RFC text itself was too ambiguous about which of the three values ORIGIN should default to"
    answer: 1
    explanation: |
      The failure was economic, not technical: a more-preferred path attracts
      traffic and revenue, so an operator who stops rewriting just cedes traffic to
      competitors who do not. Asking networks to obey the spec fought economics with
      etiquette.
    ref: "concepts.md#why-the-communitys-prior-approach-didnt-fix-it"
  - id: cloudflare-bgp-origin-attribute-005
    difficulty: advanced
    tags: [measurement, methodology, path-hunting]
    question: |
      Why did Cloudflare withdraw its test prefixes after confirming they had
      propagated?
    options:
      - "To reset the caches of every collector cleanly before starting the next measurement run"
      - "To measure precisely how quickly each individual transit provider reconverges after a failure"
      - "Withdrawal triggers path hunting, which exposes more of the normally hidden paths"
      - "To confirm that none of the test prefixes had been silently hijacked by some other AS"
    answer: 2
    explanation: |
      Withdrawing a prefix makes routers scramble for alternates ("path hunting"),
      momentarily surfacing paths that best-path selection normally hides behind the
      single chosen route — giving Cloudflare more paths to inspect for rewrites.
    ref: "concepts.md#the-measurement-architecture-how-cloudflare-proved-it"
  - id: cloudflare-bgp-origin-attribute-006
    difficulty: intermediate
    tags: [measurement, updates, rib]
    question: |
      Why did Cloudflare analyze BGP Update messages rather than static routing-table
      (RIB) dumps?
    options:
      - "Analyzing Update messages captures the maximum number of distinct paths"
      - "RIB table dumps are simply never published by either the RIPE RIS or the RouteViews collectors"
      - "Update messages come cryptographically signed by the sender whereas static RIB dumps do not"
      - "RIB dumps deliberately omit the ORIGIN attribute entirely in order to save on storage space"
    answer: 0
    explanation: |
      A RIB dump only shows each router's chosen best path, hiding alternatives.
      Updates (especially during path hunting) reveal many more distinct paths, so
      analyzing them maximizes the routes available to check for ORIGIN rewrites.
    ref: "concepts.md#the-measurement-architecture-how-cloudflare-proved-it"
  - id: cloudflare-bgp-origin-attribute-007
    difficulty: advanced
    tags: [numbers, prevalence, tier-1]
    question: |
      Which figure from the study best supports the claim that ORIGIN rewriting is
      widespread and concentrated at the top of the AS hierarchy?
    options:
      - "89.8% of all paths seen at the public collectors carried the EGP value in their ORIGIN field"
      - "Every single one of the 16 Tier-1 networks was found rewriting ORIGIN to INCOMPLETE"
      - "All 352 IPv4 direct peers preserved the advertised value exactly"
      - "6 of 16 Tier-1s rewrite to IGP, and 26% of the top-50 ASes manipulate ORIGIN"
    answer: 3
    explanation: |
      Cloudflare found 6 of 16 Tier-1s rewrite to IGP and that 26% of top-50 (20% of
      top-100) ASes manipulate ORIGIN. The 89.8% figure is IGP not EGP, and peers did
      NOT all preserve the value — those distractors invert the real numbers.
    ref: "concepts.md#concrete-numbers-from-the-study"
  - id: cloudflare-bgp-origin-attribute-008
    difficulty: intermediate
    tags: [worked-example, manipulation, transit]
    question: |
      In Cloudflare's worked example, AS64501 originates a route as INCOMPLETE and
      AS64503 rewrites it to IGP. What is AS64503's motive?
    options:
      - "To make AS64504 prefer AS64503's route so traffic (and revenue) flows through it"
      - "To shorten the advertised AS_PATH so that the route wins at the second tie-breaker rung"
      - "To comply with an RFC requirement that all transit-carried routes be marked as IGP"
      - "To conceal AS64501 as the true originating source of the prefix from everyone downstream"
    answer: 0
    explanation: |
      By lowering ORIGIN to IGP (0), AS64503 wins the ORIGIN tie-breaker at AS64504,
      so AS64504 sends traffic via AS64503 — "which allows the transit provider to
      draw traffic and profit." It does not alter AS_PATH or hide the origin.
    ref: "concepts.md#a-worked-example-of-the-manipulation"
  - id: cloudflare-bgp-origin-attribute-009
    difficulty: advanced
    tags: [recommendation, deprecation, fix]
    question: |
      What pragmatic fix does Cloudflare propose, given that fully deprecating a
      mandatory attribute is infeasible?
    options:
      - "Require BGP implementations to set ORIGIN to IGP on all routes received and advertised"
      - "Cryptographically sign the ORIGIN attribute at every single hop along the path"
      - "Move the ORIGIN comparison up above Local Preference in the best-path decision ladder"
      - "Delete the ORIGIN attribute outright from the BGP message wire format everywhere"
    answer: 0
    explanation: |
      Since IGP already dominates (89.8%), Cloudflare suggests forcing ORIGIN to IGP
      everywhere, neutralizing it as a lever so all networks are equal. Signing it or
      deleting a mandatory field across ~70k networks and every vendor is infeasible.
    ref: "concepts.md#trade-offs-gotchas-and-the-recommended-fix"
  - id: cloudflare-bgp-origin-attribute-010
    difficulty: advanced
    tags: [security, rpki, limitations]
    question: |
      Why is it wrong to describe "force ORIGIN to IGP everywhere" as a BGP security
      improvement?
    options:
      - "It measurably slows overall route convergence and drives up the total number of Update messages exchanged between routers"
      - "It works only for IPv4 prefixes and leaves IPv6 routing unprotected"
      - "It removes a distorting knob but authenticates nothing; who may announce a prefix is a separate RPKI problem"
      - "It forces operators to disable Local Preference altogether, seriously weakening their day-to-day control over routing"
    answer: 2
    explanation: |
      Uniform IGP just removes a distorting lever by making the value the same
      everywhere — it does not authenticate anything. Validating who is allowed to
      announce a prefix is a separate problem addressed by RPKI/route origin
      validation, which this post does not cover.
    ref: "concepts.md#trade-offs-gotchas-and-the-recommended-fix"
