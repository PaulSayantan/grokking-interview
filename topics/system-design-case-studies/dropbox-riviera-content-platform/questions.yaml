topic: "Dropbox Riviera: One Content-Processing Platform for Previews, Search, and AI"
domain: system-design-case-studies
topic_slug: dropbox-riviera-content-platform
version: 1
questions:
  - id: dropbox-riviera-content-platform-001
    difficulty: beginner
    tags: [platform, content-processing, motivation]
    question: |
      What core problem does Dropbox's Riviera platform address?
    options:
      - "Many Dropbox products need the same content-transformation work over slightly different files"
      - "Encrypting every uploaded file at rest and in transit across multiple geographic storage regions worldwide"
      - "Storing file blobs cheaply with deduplication"
      - "Load-balancing HTTP requests across data centers"
    answer: 0
    explanation: |
      Riviera exists because previews, search, Sign, Replay, and AI all need the
      same messy transformation work (rendering, text extraction, transcoding) over
      different inputs. It centralizes that shared work instead of storage,
      encryption, or load balancing.
    ref: "concepts.md#the-problem-the-same-file-wrangling-work-demanded-by-every-product"
  - id: dropbox-riviera-content-platform-002
    difficulty: intermediate
    tags: [naive-approach, drift, duplication]
    question: |
      Why did Dropbox reject building a separate service per file format and output?
    options:
      - "Per-format services are slower at the network layer"
      - "Cloud vendors charge more for many small services"
      - "It would require far more distinct programming languages and runtimes than any single team could reasonably maintain"
      - "Duplicated logic would drift — configurations and package versions would skew across copies"
    answer: 3
    explanation: |
      PDF logic is needed by PowerPoint, Word, and raw PDFs alike. Duplicating it
      per service means configurations drift and package versions skew, so the
      copies diverge and each becomes its own operational burden.
    ref: "concepts.md#why-the-naive-approach-broke-a-separate-service-per-format-and-output"
  - id: dropbox-riviera-content-platform-003
    difficulty: intermediate
    tags: [decomposition, reuse, transformations]
    question: |
      What is the key insight behind how Riviera handles a PowerPoint preview?
    options:
      - "It caches the entire presentation deck as one single immutable binary blob that is never regenerated or re-rendered"
      - "It decomposes the job into small reusable steps like PPTX to PDF to per-page images"
      - "It renders every slide on the client device to save server cost"
      - "It converts everything to a proprietary Dropbox format first"
    answer: 1
    explanation: |
      A PowerPoint preview is really PPTX to PDF to per-page images. The
      PDF-to-images step is reused by raw PDFs and other workflows, so decomposing
      into small reusable transformations lets new formats compose existing steps.
    ref: "concepts.md#the-key-insight-decompose-previews-into-small-reusable-transformations"
  - id: dropbox-riviera-content-platform-004
    difficulty: intermediate
    tags: [architecture, coordinator, caching]
    question: |
      According to the post, why does Riviera's central coordinator cache responses?
    options:
      - "To reduce cloud storage costs for output files"
      - "To comply with data-retention regulations"
      - "To protect backend workers from duplicate or invalid work"
      - "To keep a permanent, tamper-evident audit log recording every single transformation ever performed by a worker"
    answer: 2
    explanation: |
      The coordinator collects, composes, validates, and dispatches requests, and
      caches responses specifically to shield workers from duplicate or invalid
      work — if the same 160x160 thumbnail is requested twice, it is served from
      cache rather than recomputed.
    ref: "concepts.md#the-architecture-a-central-coordinator-over-single-purpose-workers"
  - id: dropbox-riviera-content-platform-005
    difficulty: intermediate
    tags: [architecture, workers, scaling]
    question: |
      What is the benefit of each backend worker belonging to exactly one transformation type?
    options:
      - "It guarantees absolutely zero downtime and no dropped requests during rolling code deployments"
      - "One point of maintenance and scaling per capability"
      - "It removes the need for a coordinator entirely"
      - "It lets workers share a single global cache"
    answer: 1
    explanation: |
      One capability per worker gives one place to patch that logic and lets each
      capability scale independently — PDF-rendering workers scale separately from
      video-transcoding workers.
    ref: "concepts.md#the-architecture-a-central-coordinator-over-single-purpose-workers"
  - id: dropbox-riviera-content-platform-006
    difficulty: beginner
    tags: [plugins, extensibility]
    question: |
      How are new file formats and transformations added to Riviera?
    options:
      - "By carefully modifying the central coordinator's core request-routing and dispatch code for each new format"
      - "By deploying a brand-new standalone service each time"
      - "By adding plugins to Riviera's shared library of transformations"
      - "By manually editing each existing worker's source"
    answer: 2
    explanation: |
      New capabilities are added as plugins, not by changing core infrastructure.
      The plugins collectively became Riviera's shared library of transformations,
      which is what lets Dropbox grow past 100 capabilities without destabilizing
      the coordinator.
    ref: "concepts.md#the-architecture-a-central-coordinator-over-single-purpose-workers"
  - id: dropbox-riviera-content-platform-007
    difficulty: intermediate
    tags: [numbers, scale]
    question: |
      Which figure is actually stated in the Riviera post?
    options:
      - "It runs on exactly 5,000 GPU-backed hosts"
      - "It supports more than 300 file formats"
      - "It maintains a 99.99% cache hit rate"
      - "It sustains a fixed 50ms p99 latency"
    answer: 1
    explanation: |
      The post quotes more than 300 file formats, more than 100 capabilities,
      hundreds of thousands of transformations per second, and daily output
      equivalent to 8 years of video. It gives no GPU counts, cache hit rates, or
      latency figures — don't invent those.
    ref: "concepts.md#concrete-numbers-from-the-post"
  - id: dropbox-riviera-content-platform-008
    difficulty: advanced
    tags: [ai, dash, reuse]
    question: |
      Why was serving Dropbox's AI product (Dash) relatively cheap for Riviera?
    options:
      - "Dash's needs (OCR, text extraction, normalization) were content-transformation problems Riviera had already solved"
      - "Dash ran entirely on the client and needed no backend work"
      - "Dash required a completely new GPU-backed model inference and embedding platform to be designed and built entirely from scratch"
      - "Dash replaced Riviera's previews pipeline altogether"
    answer: 0
    explanation: |
      The post reframes Dash's demands as content-transformation problems, not AI
      problems: text extraction, OCR, metadata, and normalization were already
      first-class Riviera capabilities, so the AI product mostly composed existing
      steps rather than building new infrastructure.
    ref: "concepts.md#how-it-evolved-for-ai-and-why-that-was-almost-free"
  - id: dropbox-riviera-content-platform-009
    difficulty: advanced
    tags: [platform-thinking, compounding]
    question: |
      What compounding benefit did Riviera's shared approach produce for AI and search?
    options:
      - "AI and search each received their own private, isolated, and independently maintained copy of the full transformation pipeline"
      - "Search was deprecated once AI reused its transformations"
      - "Improving one step, like text extraction, improved both AI answers and search accuracy at once"
      - "Each product had to re-add file-type support independently"
    answer: 2
    explanation: |
      Because AI and search rely on the same transformation work, better text
      extraction improved both simultaneously, and new file-type support only had
      to be added once to benefit everyone — the essence of platform value.
    ref: "concepts.md#how-it-evolved-for-ai-and-why-that-was-almost-free"
  - id: dropbox-riviera-content-platform-010
    difficulty: advanced
    tags: [trade-offs, platform-vs-feature, boundaries]
    question: |
      Which statement best captures the platform trade-off Dropbox highlights with Riviera?
    options:
      - "A feature keeps getting more valuable while a platform is used once"
      - "A platform grows more valuable each time another team builds on it, but needs clear boundaries to stay focused"
      - "Platforms should aggressively absorb every possible request type and responsibility they encounter in order to maximize overall reuse"
      - "Central coordination removes all shared-dependency risk"
    answer: 1
    explanation: |
      The post's philosophy is that a platform becomes more valuable every time
      another team builds on it (unlike a one-time feature), but keeping clear
      boundaries around what belongs in Riviera is what stops it from sprawling
      into a catch-all.
    ref: "concepts.md#trade-offs-gotchas-and-the-platform-lesson"
