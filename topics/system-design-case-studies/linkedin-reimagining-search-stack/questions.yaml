topic: "LinkedIn: Reimagining the Search Stack with LLMs at Query-per-Second Scale"
domain: system-design-case-studies
topic_slug: linkedin-reimagining-search-stack
version: 1
questions:
  - id: linkedin-reimagining-search-stack-001
    difficulty: beginner
    tags: [problem, keyword-search, intent]
    question: |
      What core limitation of LinkedIn's legacy keyword-matching search motivated
      the rewrite?
    options:
      - "It required far too much disk space to store its ever-growing inverted keyword index"
      - "It relied on exact word overlap and could not understand member intent"
      - "It could only run on CPUs and never on GPUs"
      - "It supported only English-language queries"
    answer: 1
    explanation: |
      The legacy system matched on exact word overlap between queries and postings,
      which suffered from vocabulary gaps and failed to understand what the member
      actually wanted. Understanding intent is what LLMs bring to the new stack.
    ref: "concepts.md#the-naive-approach-and-why-it-broke-keyword-matching--brittle-ner"

  - id: linkedin-reimagining-search-stack-002
    difficulty: intermediate
    tags: [scale, constraints, cost]
    question: |
      The central engineering challenge of the rebuild was best summarized as which
      trade-off?
    options:
      - "Getting LLM-level quality at RecSys-level cost and latency, at millions of QPS"
      - "Choosing between SQL and NoSQL for the document store"
      - "Deciding whether to index jobs or people first"
      - "Migrating the search UI from server-rendered to client-rendered pages"
    answer: 0
    explanation: |
      LLMs can obviously improve quality; the hard part is doing it at millions of
      real-time queries per second without blowing up latency and cost. Every design
      choice aims to hit LLM quality at cost comparable to traditional RecSys models.
    ref: "concepts.md#the-problem-llm-quality-search-at-millions-of-queries-per-second"

  - id: linkedin-reimagining-search-stack-003
    difficulty: intermediate
    tags: [retrieval, ranking, bi-encoder, cross-encoder]
    question: |
      Why does LinkedIn use a bi-encoder (dual-tower) model for retrieval but a
      cross-encoder for ranking?
    options:
      - "Cross-encoders are cheaper to train, so they are used on the larger set"
      - "Bi-encoders are more accurate, so they are reserved for the final ordering"
      - "Bi-encoders encode query and document separately so document vectors precompute offline, while cross-encoders read both together for accuracy but cannot be precomputed"
      - "Both are identical architectures; the names only reflect where they run"
    answer: 2
    explanation: |
      A bi-encoder embeds query and document independently, so item vectors are
      precomputed offline and retrieval over 1.6B+ items stays cheap. A cross-encoder
      feeds query and document together for much higher accuracy but cannot be
      precomputed, so it is only run on the few hundred retrieved candidates.
    ref: "concepts.md#the-rebuild-a-four-stage-llm-pipeline"

  - id: linkedin-reimagining-search-stack-004
    difficulty: advanced
    tags: [compression, throughput, ranking, quadratic-cost]
    question: |
      Moving the SLM ranker from raw text to embedding compression changed throughput
      and quality how, per the post's table?
    options:
      - "Throughput fell from 22,000 to 290 items/sec/GPU while NDCG@10 rose sharply"
      - "Throughput rose from 290 to 22,000 items/sec/GPU (~76x) with a modest NDCG@10 drop (0.9432 to 0.9239)"
      - "Both throughput and NDCG@10 stayed essentially unchanged"
      - "Throughput doubled while NDCG@10 collapsed below the EBR baseline"
    answer: 1
    explanation: |
      Raw text ran at 290 items/sec/GPU (NDCG@10 0.9432); embedding compression hit
      22,000 items/sec/GPU (NDCG@10 0.9239). That is roughly a 76x throughput gain for
      a modest quality drop — the trade that makes LLM ranking affordable at scale.
    ref: "concepts.md#making-it-fast-and-cheap-distillation-pruning-compression"

  - id: linkedin-reimagining-search-stack-005
    difficulty: advanced
    tags: [context-compression, gotcha, relevance]
    question: |
      Job descriptions are over 94% of the SLM prompt. Why not just drop them to save
      cost?
    options:
      - "Dropping them would violate GDPR data-retention rules that require full descriptions to be kept"
      - "Descriptions are needed to render the results page UI"
      - "Removing them severely degrades relevance quality, so they are summarized offline instead"
      - "The ranker cannot run at all without a fixed-length prompt"
    answer: 2
    explanation: |
      The description carries the signal the ranker needs, so removing it severely
      degrades relevance. Instead LinkedIn summarizes descriptions offline with a
      semantics-preserving, length-aware objective — keeping meaning while cutting the
      quadratic cost of long inputs.
    ref: "concepts.md#making-it-fast-and-cheap-distillation-pruning-compression"

  - id: linkedin-reimagining-search-stack-006
    difficulty: advanced
    tags: [pruning, hardware, structured]
    question: |
      Why did LinkedIn choose structured pruning over unstructured pruning for the SLM?
    options:
      - "Unstructured pruning often gives no meaningful speedup without specialized hardware"
      - "Structured pruning never reduces model accuracy at all"
      - "Unstructured pruning is not supported by the SGLang serving engine that LinkedIn uses to host the ranker"
      - "Structured pruning removes the need for any post-pruning fine-tuning"
    answer: 0
    explanation: |
      Unstructured pruning zeros individual weights, but sparse weights do not run
      faster on normal GPUs without specialized hardware. Structured pruning removes
      whole neurons, heads, or layers, which actually speeds up inference; they then
      fine-tune again to recover the accuracy pruning costs.
    ref: "concepts.md#making-it-fast-and-cheap-distillation-pruning-compression"

  - id: linkedin-reimagining-search-stack-007
    difficulty: intermediate
    tags: [foundation, evaluation, judge, distillation]
    question: |
      What did LinkedIn build first, before the retrieval and ranking models?
    options:
      - "A brand-new front-end search UI framework rebuilt from scratch for the redesigned results page"
      - "A migration tool to move the index off Elasticsearch"
      - "A dedicated GPU procurement pipeline"
      - "An LLM-based, product-policy-grounded quality evaluation framework, distilled to an 8B judge"
    answer: 3
    explanation: |
      They built the evaluation framework first so 'better' had a stable definition.
      The large judge could not meet throughput needs, so it was distilled to an 8B
      evaluator and calibrated against human PMs at weighted Cohen's Kappa >= 0.8.
    ref: "concepts.md#foundation-first-build-the-judge-before-the-models"

  - id: linkedin-reimagining-search-stack-008
    difficulty: intermediate
    tags: [retrieval, knn, gpu, scale]
    question: |
      How does the Embedding-Based Retrieval layer find candidates among 1.6B+ items?
    options:
      - "Approximate nearest-neighbor search on CPU with an HNSW index"
      - "Exhaustive k-NN dot-product search on CUDA-enabled GPUs"
      - "A traditional inverted keyword index with BM25 scoring"
      - "A cross-encoder scoring every item against the query"
    answer: 1
    explanation: |
      Retrieval uses precomputed job embeddings in GPU-backed indexes and runs an
      exhaustive (brute-force) k-nearest-neighbor search with dot-product similarity on
      CUDA GPUs over 1.6B+ items — fast enough at their scale and avoiding the recall
      loss of approximate methods.
    ref: "concepts.md#the-rebuild-a-four-stage-llm-pipeline"

  - id: linkedin-reimagining-search-stack-009
    difficulty: advanced
    tags: [distillation, model-size, metrics]
    question: |
      What was notable about LinkedIn's distilled 0.6B ranking student relative to its
      1.7B teachers?
    options:
      - "It ran considerably slower but scored dramatically higher than its teachers on every single metric"
      - "It failed to converge and was abandoned"
      - "It nearly matched the teachers (e.g., NDCG@10 0.9239 vs 0.9484) despite being far smaller"
      - "It could only be used offline, never for online serving"
    answer: 2
    explanation: |
      Multi-teacher, multi-task distillation (via KL divergence) produced a 0.6B
      student that nearly matched the 1.7B teachers: NDCG@10 0.9239 vs 0.9484, Apply
      AUC 0.8007 vs 0.8049, Click AUC 0.6704 vs 0.6772 — most of the quality at a
      fraction of the size.
    ref: "concepts.md#making-it-fast-and-cheap-distillation-pruning-compression"

  - id: linkedin-reimagining-search-stack-010
    difficulty: beginner
    tags: [impact, results, auc]
    question: |
      What quality improvement did LinkedIn report for Job Ranking?
    options:
      - "Click AUC improved from a 0.61 RecSys baseline to 0.67"
      - "Click AUC dropped from 0.67 to 0.61 as a cost-saving trade"
      - "Latency improved but AUC was unchanged at 0.61"
      - "NDCG@10 fell below the EBR baseline of 0.838"
    answer: 0
    explanation: |
      Job Ranking Click AUC rose from the legacy RecSys baseline of 0.61 to 0.67, part
      of what LinkedIn describes as double-digit improvements in search quality and
      member engagement — achieved while keeping inference cost comparable to
      traditional RecSys models.
    ref: "concepts.md#concrete-numbers-from-the-post"
