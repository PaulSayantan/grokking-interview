topic: "Design a Card Game (Deck and Blackjack)"
domain: lld-and-ood
topic_slug: design-card-game
version: 1
questions:
  - id: design-card-game-001
    difficulty: beginner
    tags: [reuse, separation-of-concerns, layering]
    question: |
      What is the single most important structural goal an interviewer is
      testing with the "design a card game / Blackjack" problem?
    options:
      - "Implementing the fastest possible shuffle algorithm"
      - "Building a game-agnostic Card/Deck core that specific games layer rules on top of"
      - "Modeling every casino side-bet as its own class"
      - "Storing the full game history in a database"
    answer: 1
    explanation: |
      The problem exists to test whether you can find the seam between generic
      card mechanics (Card, Deck, Suit, Rank) and game-specific rules (Blackjack's
      Ace = 1/11, bust at 21, dealer policy). A reusable core that poker could also
      use, with Blackjack specialized above it, is the headline goal. Shuffle speed
      and persistence are peripheral.
    ref: "concepts.md#design-a-card-game-deck-and-blackjack"

  - id: design-card-game-002
    difficulty: beginner
    tags: [enums, modeling, noun-extraction]
    question: |
      During noun extraction you list "suit" and "rank". How should they be
      modeled?
    options:
      - "As String fields on Card for flexibility"
      - "As separate class hierarchies (HeartsSuit extends Suit, etc.)"
      - "As enums, since each is a fixed, finite set of values"
      - "As integer constants on the Deck class"
    answer: 2
    explanation: |
      Suit (4 values) and Rank (13 values) are fixed, finite, closed sets — the
      textbook case for enums. Strings invite typos and invalid values; a class
      hierarchy per suit is over-engineering with no behavioral difference between
      suits. Enums give type safety and let Rank carry a baseValue().
    ref: "concepts.md#noun-verb-object-identification"

  - id: design-card-game-003
    difficulty: intermediate
    tags: [strategy, dealer, inheritance]
    question: |
      How should the Dealer be modeled relative to a human Player?
    options:
      - "As a subtype of Player whose decision-making is a fixed Strategy (hit-until-17)"
      - "As a completely separate class with its own duplicated Hand logic"
      - "As a static utility class with no state"
      - "As a subclass of Deck, since the dealer owns the cards"
    answer: 0
    explanation: |
      The Dealer IS-A player: it holds a Hand and takes turns under the same
      contract (LSP holds). Its only real difference is the decision algorithm,
      which Strategy captures (DealerStrategy = must-hit-17). A separate class
      would duplicate all hand mechanics; subclassing Deck confuses roles.
    ref: "concepts.md#use-cases-and-actors"

  - id: design-card-game-004
    difficulty: intermediate
    tags: [state, game-flow, patterns]
    question: |
      Which GoF pattern best models the Blackjack round flow (Betting → Dealing →
      PlayerTurn → DealerTurn → Settlement)?
    options:
      - "Visitor, to visit each phase"
      - "Template Method, since the steps are fixed"
      - "Decorator, wrapping each phase"
      - "State, with one class per phase controlling valid actions and transitions"
    answer: 3
    explanation: |
      Each phase permits only certain actions (you can't hit during betting) and
      decides the next phase. The State pattern gives one class per phase, making
      illegal transitions impossible and localizing each phase's logic — far
      cleaner than an if/switch ladder on a phase enum.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-card-game-005
    difficulty: intermediate
    tags: [hand-value, algorithm, ace]
    question: |
      A hand holds Ace, Ace, and 9. What value should getValue() return, and why?
    options:
      - "31, counting both aces as 11"
      - "11, counting only one card"
      - "21, counting one Ace as 11 and the other as 1 (plus the 9)"
      - "29, counting both aces as 11 minus the 9"
    answer: 2
    explanation: |
      Only one Ace can be 11 without busting (two 11s = 22). Sum aces as 1 first
      (1 + 1 + 9 = 11), then promote one Ace by +10 while total + 10 <= 21:
      11 + 10 = 21. The guard prevents promoting the second Ace. Result: 21, a
      soft 21.
    ref: "concepts.md#hand-value-calculation"

  - id: design-card-game-006
    difficulty: intermediate
    tags: [reuse, placement, srp]
    question: |
      Where should the getValue() (hand-total-with-soft-aces) logic live?
    options:
      - "On Card, so each card knows its Blackjack value"
      - "On Deck, since it created the cards"
      - "On Hand, because the 1-or-11 decision is contextual to the whole hand and Blackjack-specific"
      - "As a static method on the BlackjackGame class only"
    answer: 2
    explanation: |
      A single Card has only a generic base rank value; the Ace's 1-or-11 choice
      depends on the entire hand and is specific to Blackjack. Putting getValue on
      Hand keeps Card and Deck reusable across games — that placement IS the reuse
      seam.
    ref: "concepts.md#hand-value-calculation"

  - id: design-card-game-007
    difficulty: beginner
    tags: [composition, relationships]
    question: |
      What is the correct relationship between Deck and Card?
    options:
      - "Aggregation — cards exist independently of the deck"
      - "Composition — the deck owns and creates its cards"
      - "Inheritance — Card extends Deck"
      - "Association only — the deck merely references shared global cards"
    answer: 1
    explanation: |
      The deck builds its 52 cards and they belong to it for the deck's lifetime —
      composition. Card does not extend Deck (no IS-A). While cards could
      conceptually be flyweights shared globally, the standard interview model is
      composition of freshly created immutable Cards.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-card-game-008
    difficulty: intermediate
    tags: [over-modeling, noun-filtering]
    question: |
      A candidate proposes a Value class and a Turn class after extracting nouns.
      What is the best critique?
    options:
      - "Both are essential domain entities and should be kept"
      - "Value is a computed property of a Hand and Turn is a phase of the state machine — neither should be a class"
      - "They should be merged into a single ValueTurn class"
      - "They should become enums"
    answer: 1
    explanation: |
      Noun extraction produces candidates; the filtering step removes ones that
      aren't really objects. A hand's value is computed by getValue(); a turn is a
      phase handled by the State machine. Promoting them to classes is the exact
      over-modeling mistake the filtering step exists to catch.
    ref: "concepts.md#noun-verb-object-identification"

  - id: design-card-game-009
    difficulty: advanced
    tags: [testability, dependency-injection, shuffle]
    question: |
      An interviewer asks: "How would you unit-test that dealing is deterministic?"
      Which design choice makes this straightforward?
    options:
      - "Making Deck a Singleton so tests share one instance"
      - "Calling new Random() inside shuffle() for freshness"
      - "Storing the shuffled order in a static field"
      - "Injecting the Random (RNG) through the Deck constructor so tests can seed it"
    answer: 3
    explanation: |
      Injecting the RNG (Dependency Injection) lets a test pass a seeded Random for
      a reproducible shuffle/deal, and statistical tests over many seeds check
      fairness. new Random() inline is untestable; a Singleton deck couples tests
      and breaks multi-table play.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-card-game-010
    difficulty: intermediate
    tags: [singleton, anti-pattern, concurrency]
    question: |
      Why is making Deck a Singleton a poor decision in this design?
    options:
      - "Singletons are always slower than regular objects"
      - "Singletons cannot hold a list of cards"
      - "It would force Card to also be a Singleton"
      - "It couples all tables/games to one shared deck, breaks multi-table concurrency, and hurts testability"
    answer: 3
    explanation: |
      Each Game should compose its own Deck so tables run independently with no
      shared mutable state. A Singleton deck would serialize unrelated games,
      create cross-table coupling, and make deterministic testing hard. Independence
      of Game instances is exactly why the deck is per-game.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-card-game-011
    difficulty: intermediate
    tags: [strategy, player-decision, ocp]
    question: |
      You must add an AI card-counting player without changing Player or
      BlackjackGame. What is the cleanest approach?
    options:
      - "Add an isAI boolean flag and branch inside Player.decide"
      - "Subclass BlackjackGame for AI games"
      - "Add a new PlayerStrategy implementation and inject it into a Player"
      - "Add a switch on player type in the state machine"
    answer: 2
    explanation: |
      Player delegates decisions to a PlayerStrategy. Adding a new strategy
      implementation (CardCountingStrategy) and injecting it leaves Player and Game
      untouched — Open/Closed via Strategy and dependency inversion. Flags and
      type switches violate OCP.
    ref: "concepts.md#extensibility"

  - id: design-card-game-012
    difficulty: beginner
    tags: [immutability, value-object, card]
    question: |
      Why should Card be immutable (final fields, no setters)?
    options:
      - "Immutable objects are required by the JVM for enums"
      - "A card's suit and rank never change, so immutability prevents aliasing bugs and enables safe sharing"
      - "Because Deck cannot compile otherwise"
      - "So the garbage collector runs faster"
    answer: 1
    explanation: |
      A physical card's identity (two of hearts) is fixed for its lifetime, so it
      is a natural immutable value object. Immutability removes a class of aliasing
      bugs and even allows sharing the same Card instance (flyweight) safely. It is
      a modeling choice, not a compiler requirement.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-card-game-013
    difficulty: advanced
    tags: [reuse, poker, ocp, extensibility]
    question: |
      An interviewer says "now support poker using the same code base." Which
      change set demonstrates the reuse seam working?
    options:
      - "Rewrite Card and Deck to add poker-specific fields"
      - "Add poker methods directly onto the Deck class"
      - "Copy the Blackjack classes and rename them for poker"
      - "Reuse Card/Deck/Suit/Rank unchanged; add a poker hand evaluator (ScoringStrategy) and poker states"
    answer: 3
    explanation: |
      Because the core knows nothing about any game, poker reuses Card/Deck/Suit/
      Rank untouched and only adds its own scoring/hand-evaluation logic and its own
      flow states. Modifying Deck or copy-pasting Blackjack would prove the seam was
      never really there.
    ref: "concepts.md#extensibility"

  - id: design-card-game-014
    difficulty: intermediate
    tags: [split, design-foresight, collections]
    question: |
      Why does Player hold a List<Hand> rather than a single Hand?
    options:
      - "To store the discard pile"
      - "Because Java requires collections for all fields"
      - "To cache previous rounds' hands"
      - "To support splitting a pair into two independent hands"
    answer: 3
    explanation: |
      Splitting a pair creates a second hand the player plays independently.
      Designing Player with a List<Hand> up front means the Split action just adds a
      hand — no structural change later. This is design foresight for a known
      follow-up.
    ref: "concepts.md#extensibility"

  - id: design-card-game-015
    difficulty: intermediate
    tags: [factory, creational, construction]
    question: |
      Which pattern best isolates the knowledge of "how to build a standard 52-card
      deck (or a multi-deck shoe)"?
    options:
      - "Observer"
      - "State"
      - "Factory (a DeckFactory)"
      - "Adapter"
    answer: 2
    explanation: |
      A Factory centralizes construction so callers ask for a kind of deck rather
      than looping suits x ranks themselves, and variants (multi-deck shoe, pinochle
      deck) live in one place. This is a Creational concern (object construction),
      unlike Observer (events) or State (flow).
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-card-game-016
    difficulty: intermediate
    tags: [observer, events, decoupling]
    question: |
      The engine must notify a UI, a logger, and a stats module when cards are
      dealt or a player busts, without knowing about any of them. Which pattern
      applies?
    options:
      - "Strategy — swap the notification algorithm"
      - "Proxy — stand in for the UI"
      - "Observer — publish GameEvents to registered GameObservers"
      - "Builder — assemble the notifications"
    answer: 2
    explanation: |
      Observer decouples the publisher (Game) from subscribers (UI, logger, stats).
      The engine notifies GameObservers of events rather than calling println or
      importing UI code — presentation and logging stay out of the game logic.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-card-game-017
    difficulty: advanced
    tags: [ace, edge-case, correctness]
    question: |
      A hand is Ace, Ace, Ace, 8. What value does the correct soft-ace algorithm
      return?
    options:
      - "41"
      - "21"
      - "31"
      - "11"
    answer: 1
    explanation: |
      Count all aces as 1: 1+1+1+8 = 11. Then promote one ace while total+10 <= 21:
      11+10 = 21, and 21+10 would bust so stop. Only one ace becomes 11; the rest
      stay 1. Result 21. The while-loop guard is what prevents multiple promotions.
    ref: "concepts.md#hand-value-calculation"

  - id: design-card-game-018
    difficulty: intermediate
    tags: [dealer-policy, soft-17, edge-case]
    question: |
      Why does the DealerStrategy need to know whether a 17 is "soft"?
    options:
      - "Soft hands are worth double"
      - "House rules differ on hit-soft-17 vs stand-soft-17, so the dealer's action at 17 depends on softness"
      - "A soft 17 automatically wins"
      - "Softness determines the suit of the next card"
    answer: 1
    explanation: |
      Many casinos require the dealer to hit a soft 17 (Ace+6) but stand on a hard
      17. So DealerStrategy must query Hand.isSoft() to decide at exactly 17. This
      is a clarify-the-requirement point and a real correctness distinction.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-card-game-019
    difficulty: intermediate
    tags: [payout, strategy, extensibility]
    question: |
      The table changes from "Blackjack pays 3:2" to "6:5". Which design lets you
      make this change without editing settlement logic?
    options:
      - "Hard-code both ratios in the Game and branch on a boolean"
      - "Add a new subclass of Card for 6:5 games"
      - "A PayoutRule Strategy: swap the implementation, settlement code unchanged"
      - "Change the Deck constructor"
    answer: 2
    explanation: |
      Payout ratios are a policy that varies per table, so a PayoutRule Strategy
      computes winnings from result + bet. Swapping the implementation changes the
      payout without touching the settlement flow — Open/Closed. Booleans and Card
      subclasses are the wrong axes.
    ref: "concepts.md#extensibility"

  - id: design-card-game-020
    difficulty: beginner
    tags: [scoping, requirements, hld-boundary]
    question: |
      Which of these should you explicitly declare OUT of scope for a 45-minute
      LLD Blackjack design?
    options:
      - "Scaling to thousands of concurrent online tables"
      - "Hand value calculation with soft aces"
      - "Dealer hit-until-17 policy"
      - "Player hit/stand actions"
    answer: 0
    explanation: |
      Scaling across many machines/tables is a distributed-systems (HLD) concern —
      one Game object per table in the LLD, distribution belongs to system design.
      Hand value, dealer policy, and player actions are core LLD scope.
    ref: "concepts.md#requirements-clarification"

  - id: design-card-game-021
    difficulty: intermediate
    tags: [shuffle, algorithm, correctness]
    question: |
      Which shuffle approach should you use and why?
    options:
      - "Fisher-Yates (e.g., Collections.shuffle with an injected Random) because it is unbiased"
      - "Sort the cards by a random key each time"
      - "Reverse the deck each round"
      - "Swap only the top and bottom cards"
    answer: 0
    explanation: |
      Fisher-Yates produces a uniformly random permutation in O(n). Sorting by a
      random key can introduce bias (and is O(n log n)); reversing or single swaps
      aren't shuffles. Injecting the Random keeps it testable and, if needed,
      provably fair.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-card-game-022
    difficulty: advanced
    tags: [state-machine, validation, ocp]
    question: |
      A player sends a "hit" request during the betting phase. In a well-designed
      State machine, what happens?
    options:
      - "The Game crashes with a null pointer"
      - "The card is dealt anyway and reconciled later"
      - "The BettingState simply does not accept the hit action, so the invalid transition is impossible"
      - "A global boolean flag is checked in ten places"
    answer: 2
    explanation: |
      Each state only exposes/handles the actions valid in that phase. BettingState
      has no hit behavior, so a hit is rejected by construction — the State pattern
      makes illegal transitions impossible without scattering phase checks.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-card-game-023
    difficulty: intermediate
    tags: [reuse-seam, dependency-direction, dip]
    question: |
      Which statement, if true of your design, signals the reuse seam has been
      BREACHED?
    options:
      - "Deck imports BlackjackGame or Deck contains bust-at-21 logic"
      - "Hand.getValue() implements the Ace 1-or-11 rule"
      - "Rank exposes a generic baseValue()"
      - "BlackjackGame composes its own Deck"
    answer: 0
    explanation: |
      The core (Card/Deck/Suit/Rank) must have zero knowledge of any specific game.
      If Deck depends on BlackjackGame or contains 21-specific logic, the dependency
      arrow points the wrong way and poker can no longer reuse it. The other options
      are the seam working correctly.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-card-game-024
    difficulty: intermediate
    tags: [push, settlement, edge-case]
    question: |
      Player and dealer both finish with 20. What is the correct outcome?
    options:
      - "Dealer wins all ties"
      - "Player wins all ties"
      - "Push — the player's bet is returned, neither wins"
      - "Both lose their stakes to the house"
    answer: 2
    explanation: |
      Equal non-bust totals are a push (tie): the bet is returned and no chips
      change hands (beyond returning the stake). Treating a push as a loss or a win
      is a common settlement off-by-one bug. A natural blackjack, however, beats a
      drawn 21.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-card-game-025
    difficulty: advanced
    tags: [natural-blackjack, ordering, edge-case]
    question: |
      Why must a "natural blackjack" (21 on the first two cards) be handled before
      the normal hit/stand turn loop?
    options:
      - "Because it pays differently (typically 3:2) and can end the hand immediately, and both player and dealer naturals must be compared"
      - "Because naturals require a reshuffle"
      - "Because the deck is empty after a natural"
      - "Because naturals change the suit ordering"
    answer: 0
    explanation: |
      A natural is a special result: it pays 3:2, ends the hand before any hit
      decision, and if the dealer also has a natural the round is a push. Folding it
      into the normal turn loop misses the special payout and the both-natural push
      case.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-card-game-026
    difficulty: intermediate
    tags: [aggregation, players, relationships]
    question: |
      What is the appropriate relationship between BlackjackGame and its Players?
    options:
      - "Composition — players are created and destroyed with the game and cannot exist without it"
      - "Aggregation — players can join/leave the table and exist independently of a single round"
      - "Inheritance — Game extends Player"
      - "No relationship — players are global static objects"
    answer: 1
    explanation: |
      Players have their own identity and chips and can sit at different tables over
      time, so the Game aggregates them (has-a, independent lifetime). By contrast
      the Game composes its Deck and GameState, whose lifetimes are tied to it.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-card-game-027
    difficulty: beginner
    tags: [facade, api, entry-point]
    question: |
      Which class should be the primary public entry point (facade) that players
      interact with?
    options:
      - "Deck"
      - "Card"
      - "BlackjackGame"
      - "Hand"
    answer: 2
    explanation: |
      BlackjackGame orchestrates the round: it enforces turn order and state,
      exposes startRound/placeBet/playerAction, and owns the deck and dealer.
      Callers shouldn't manipulate Deck or Hand directly — the game mediates all
      actions so rules can't be bypassed.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-card-game-028
    difficulty: advanced
    tags: [multi-deck, shoe, extensibility]
    question: |
      To support a 6-deck shoe with reshuffle at a cut card, the cleanest change is:
    options:
      - "Rewrite Deck to be a fixed 52-card structure and add a separate Shoe subsystem that bypasses it"
      - "Make Card mutable so cards can be reused"
      - "Store six separate Deck singletons"
      - "Parameterize the number of decks in the Deck/Shoe constructor and add a discard pile + cut-card threshold triggering reset()"
    answer: 3
    explanation: |
      A Deck built from numDecks x 52 cards handles multi-deck naturally; adding a
      discard pile and a cut-card threshold that triggers a reshuffle (reset) keeps
      the caller API unchanged. No mutability or singleton hacks are needed.
    ref: "concepts.md#extensibility"

  - id: design-card-game-029
    difficulty: intermediate
    tags: [srp, hand, responsibilities]
    question: |
      Which set of responsibilities correctly belongs to the Hand class (CRC-style)?
    options:
      - "Shuffle the deck and deal cards to players"
      - "Enforce turn order and game state transitions"
      - "Hold its cards and bet, compute getValue with soft aces, and answer isBust/isBlackjack/isSoft"
      - "Compute payouts for every player at the table"
    answer: 2
    explanation: |
      Hand knows its cards and bet and computes derived facts about itself (value,
      bust, blackjack, soft). Shuffling/dealing is Deck's job; turn order and phases
      belong to Game/State; payouts belong to a PayoutRule. Single Responsibility
      keeps each class focused.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-card-game-030
    difficulty: intermediate
    tags: [rank, base-value, reuse]
    question: |
      Why does Rank expose baseValue() with ACE returning 1 (not 11)?
    options:
      - "Because 11 would overflow an int"
      - "Because the base value is game-neutral; the 1-or-11 promotion is Blackjack-specific and belongs in Hand"
      - "Because the Ace is the lowest card in every game"
      - "Because face cards also return 1"
    answer: 1
    explanation: |
      Rank is part of the reusable core, so it exposes a generic base value (ACE=1,
      face cards=10). Blackjack's rule that an Ace may count as 11 is a hand-level,
      game-specific decision, kept out of Rank so other games can reuse Rank
      unchanged.
    ref: "concepts.md#hand-value-calculation"

  - id: design-card-game-031
    difficulty: advanced
    tags: [concurrency, locking, turn-based]
    question: |
      What level of concurrency control does a single Blackjack table actually
      need, and why?
    options:
      - "Fine-grained locks on every Card and Hand, because many threads deal at once"
      - "A single lock on the Game (turn-based play means one actor acts at a time); different tables are independent Game instances"
      - "A distributed lock service across all tables"
      - "No synchronization at all, ever"
    answer: 1
    explanation: |
      Blackjack is turn-based: within a table only one actor acts at a time,
      enforced by the state machine. A single game-level lock stops double-submits
      and out-of-turn actions. Separate tables are independent Game objects with no
      shared state, so no cross-table or fine-grained locking is needed.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-card-game-032
    difficulty: intermediate
    tags: [empty-deck, edge-case, api]
    question: |
      What should deal() do when the shoe is empty?
    options:
      - "Make the empty condition explicit — throw, or reshuffle from a discard pile — never return null"
      - "Return null and let the caller check"
      - "Silently deal a duplicate of the last card"
      - "Freeze the game indefinitely"
    answer: 0
    explanation: |
      An empty shoe is an explicit condition: either throw IllegalStateException or
      reshuffle the discard pile into the deck (casino behavior). Returning null
      pushes a NullPointerException risk onto every caller and hides the real
      condition.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-card-game-033
    difficulty: advanced
    tags: [bust-ordering, settlement, edge-case]
    question: |
      A player busts (goes over 21), then the dealer later also busts. Who wins that
      player's bet?
    options:
      - "The house — the player already lost the moment they busted, before the dealer played"
      - "The player, because the dealer busted too"
      - "It is a push since both busted"
      - "Both split the pot"
    answer: 0
    explanation: |
      The player acts first; busting is an immediate loss regardless of what the
      dealer does afterward. A later dealer bust only helps players who are still
      standing. Getting this ordering wrong is a classic settlement bug.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-card-game-034
    difficulty: intermediate
    tags: [strategy, dealer, no-argument]
    question: |
      DealerStrategy.decide returns HIT while value < 17 and STAND at 17+ (hitting
      soft 17 only if configured). What OO benefit does encapsulating this in a
      strategy give over hard-coding it in the Dealer class?
    options:
      - "It makes the dealer play faster"
      - "It removes the need for a Hand class"
      - "It lets the same Player mechanics support different decision policies and swaps rules without touching Player/Game"
      - "It guarantees the dealer never busts"
    answer: 2
    explanation: |
      By delegating the decision to a PlayerStrategy, the Player and Game don't
      change when the policy changes (stand-17 vs hit-soft-17, or a smarter AI). The
      dealer reuses the same hand/turn mechanics as humans and only its strategy
      differs — Open/Closed and no duplication.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-card-game-035
    difficulty: beginner
    tags: [actors, use-cases, dealer]
    question: |
      In the actor analysis, the Dealer is unusual because it is:
    options:
      - "Only a system component with no hand"
      - "Both a participant (has a Hand and plays) and the game operator (deals and settles)"
      - "A pure data structure holding the deck"
      - "The same object as the human Player"
    answer: 1
    explanation: |
      The Dealer both takes part in the game (holds a Hand, plays by house policy)
      and operates it (deals cards, settles payouts). Recognizing this dual role is
      why modeling it as a Player subtype with a fixed strategy is elegant.
    ref: "concepts.md#use-cases-and-actors"

  - id: design-card-game-036
    difficulty: advanced
    tags: [over-engineering, patterns, judgment]
    question: |
      Which of these would an interviewer most likely flag as OVER-engineering for
      this problem?
    options:
      - "A PlayerStrategy interface with Dealer and Human implementations"
      - "A State machine for the round phases"
      - "A class hierarchy for the four suits (HeartsSuit, SpadesSuit, ...) plus a Singleton Deck"
      - "A PayoutRule interface for different table payouts"
    answer: 2
    explanation: |
      Suits have no differing behavior, so a class per suit is needless hierarchy —
      an enum suffices. A Singleton Deck breaks multi-table play and testing. The
      other three (Strategy, State, PayoutRule) each add real, justified flexibility.
      Good LLD is the minimum set of patterns that keeps the design clean.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-card-game-037
    difficulty: intermediate
    tags: [double-down, action, extensibility]
    question: |
      Adding the "Double Down" action requires which changes?
    options:
      - "A rewrite of Deck and Card"
      - "A new subclass of BlackjackGame"
      - "Changing the hand value algorithm"
      - "A new Action enum value plus a branch in PlayerTurnState (double the bet, take exactly one card, then stand)"
    answer: 3
    explanation: |
      Double is just another player action: add it to the Action enum and handle it
      in the player-turn state (double the bet, deal one card, force stand). The
      reusable core, scoring, and other states are unaffected — clean Open/Closed
      extension.
    ref: "concepts.md#extensibility"

  - id: design-card-game-038
    difficulty: intermediate
    tags: [chips, bet, placement]
    question: |
      Where do the bet amount and a player's chip balance belong?
    options:
      - "bet on the Card, chips on the Deck"
      - "Both on the Deck"
      - "bet on the Hand, chips on the Player, with a PayoutRule computing winnings"
      - "Both as global static counters"
    answer: 2
    explanation: |
      A bet is placed on a specific hand (important once splitting creates multiple
      hands), while chips are the player's balance. A separate PayoutRule Strategy
      turns a result + bet into winnings, keeping money logic thin and pluggable.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-card-game-039
    difficulty: advanced
    tags: [lsp, substitutability, dealer]
    question: |
      Modeling Dealer as a subclass of Player relies on which SOLID principle
      holding true?
    options:
      - "Interface Segregation, since Dealer needs fewer methods"
      - "Liskov Substitution — Dealer honors the same Hand/turn contract and can stand in wherever a Player is expected"
      - "Single Responsibility, since Dealer does only one thing"
      - "Dependency Inversion, since Dealer depends on abstractions"
    answer: 1
    explanation: |
      Dealer extends Player only if it is genuinely substitutable — it holds a Hand,
      takes a turn, and obeys the same contract, differing only in its decision
      strategy. That substitutability is Liskov Substitution; violating it (e.g., a
      Dealer that can't take a turn) would make the inheritance wrong.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-card-game-040
    difficulty: intermediate
    tags: [state-transitions, cohesion, design]
    question: |
      In the State-machine design, where does the decision "what phase comes next"
      live?
    options:
      - "In a central switch inside BlackjackGame"
      - "In the Deck class"
      - "In the PlayerStrategy"
      - "Inside each GameState, which chooses and sets its own successor"
    answer: 3
    explanation: |
      Each state encapsulates both the actions valid in it and the transition to the
      next state (e.g., PlayerTurnState -> DealerTurnState). Localizing transitions
      per state avoids a central switch that must be edited whenever phases change,
      keeping the machine cohesive and open for extension.
    ref: "concepts.md#code-skeleton"

  - id: design-card-game-041
    difficulty: beginner
    tags: [verbs, methods, extraction]
    question: |
      During verb extraction for Blackjack, which verb most naturally maps to a
      method on Deck (not Hand or Game)?
    options:
      - "settle()"
      - "shuffle()"
      - "getValue()"
      - "payout()"
    answer: 1
    explanation: |
      shuffle() (and deal/draw) are deck operations. getValue() is a Hand method,
      while settle() and payout() are Game/PayoutRule responsibilities. Mapping
      verbs to the class that owns the relevant state is the point of the exercise.
    ref: "concepts.md#noun-verb-object-identification"

  - id: design-card-game-042
    difficulty: advanced
    tags: [flyweight, memory, judgment]
    question: |
      An interviewer notes that many decks contain identical cards. Which pattern
      COULD reduce duplicate Card objects, and what is the right interview posture?
    options:
      - "Flyweight — but mention it as an option and don't build it unless asked; a plain immutable Card is usually enough"
      - "Prototype — and always implement it for card games"
      - "Memento — to snapshot cards"
      - "Composite — to nest cards into decks"
    answer: 0
    explanation: |
      Because Cards are immutable value objects, the same instance (e.g., one
      two-of-hearts) could be shared via Flyweight to cut allocations across many
      decks. In an interview you name the option to show awareness but usually keep a
      plain immutable Card — premature optimization otherwise.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-card-game-043
    difficulty: intermediate
    tags: [split-rules, clarification, edge-case]
    question: |
      For the Split action, which detail must be clarified rather than assumed?
    options:
      - "Whether cards have suits"
      - "Whether the deck is shuffled"
      - "The color of the table"
      - "Which pairs are splittable (equal rank only, or any equal ten-value), and re-split / split-aces rules"
    answer: 3
    explanation: |
      Split legality varies by house rules: some allow splitting any two ten-value
      cards, some only equal ranks; re-splitting and drawing to split aces also vary.
      These are requirement clarifications; assuming one variant silently can make
      the design wrong for the interviewer's intent.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-card-game-044
    difficulty: advanced
    tags: [hld-boundary, scaling, cross-ref]
    question: |
      "Scale to thousands of online tables with spectators across the world." How
      should an LLD candidate respond?
    options:
      - "Redesign Card and Deck to be network-serializable first"
      - "Note in-process spectators use Observer, but cross-machine scaling is an HLD/system-design conversation — one Game per table, shard tables, persist logs"
      - "Add a Singleton GameServer holding all games"
      - "Refuse to answer since it's off-topic"
    answer: 1
    explanation: |
      Keep the LLD single-machine and clean: Observer covers in-process listeners;
      distribution (sharding tables, persistence, remote broadcast) is explicitly an
      HLD concern to redirect to the system-design domain. Per-table state is small
      and independent, which makes sharding natural.
    ref: "concepts.md#extensibility"

  - id: design-card-game-045
    difficulty: intermediate
    tags: [cross-ref, state, comparison]
    question: |
      The Blackjack round's use of the State pattern is most directly analogous to
      which other LLD designs in this domain?
    options:
      - "design-splitwise and design-cache-oo"
      - "design-vending-machine and design-atm, which also model phases as states"
      - "design-rate-limiter-oo only"
      - "design-parking-lot, which is purely compositional"
    answer: 1
    explanation: |
      Vending machine (idle/collecting/dispensing) and ATM (card/pin/transaction)
      model their workflow phases as State machines, the same technique used for the
      Blackjack round. Recognizing shared structure across problems is a senior
      signal; parking lot is composition-driven, not state-driven.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-card-game-046
    difficulty: intermediate
    tags: [dip, rng, testability]
    question: |
      Passing the Random into the Deck constructor rather than calling new Random()
      inside shuffle() is an application of which principle?
    options:
      - "Dependency Inversion / Injection — depend on an injected abstraction so behavior (the RNG) is controllable and testable"
      - "Interface Segregation"
      - "Liskov Substitution"
      - "Single Responsibility"
    answer: 0
    explanation: |
      Injecting the RNG means the Deck depends on a supplied Random rather than
      creating its own, so tests can pass a seeded (deterministic) or provably-fair
      source. That is Dependency Injection / Inversion — control and testability over
      a hard-wired collaborator.
    ref: "concepts.md#api-and-method-signatures"
