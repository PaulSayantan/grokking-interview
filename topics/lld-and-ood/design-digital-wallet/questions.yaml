topic: "Design a Digital Wallet"
domain: lld-and-ood
topic_slug: design-digital-wallet
version: 1
questions:
  - id: design-digital-wallet-001
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      In the first five minutes of a "Design a Digital Wallet" interview, which clarifying
      question most directly shapes the class structure you will draw?
    options:
      - "Which cloud region should host the wallet service?"
      - "What is the maximum number of transactions per second at peak?"
      - "Which funding sources (bank, card, UPI) and transaction states (pending vs instant) must be supported?"
      - "What font should the mobile balance screen use?"
    answer: 2
    explanation: |
      Funding sources drive a Strategy hierarchy (PaymentMethod), and whether transactions
      can be pending vs instant is what justifies a State machine — both are core class-
      structure decisions. TPS and hosting are HLD concerns; UI is out of scope for this round.
    ref: "concepts.md#requirements-clarification"

  - id: design-digital-wallet-002
    difficulty: beginner
    tags: [money, correctness]
    question: |
      Why should wallet balances and transaction amounts be modeled with BigDecimal (or
      integer minor units) rather than double?
    options:
      - "double is slower than BigDecimal on modern CPUs"
      - "Binary floating point cannot represent most decimal fractions exactly, so sums drift and the ledger's sum-to-zero invariant silently breaks"
      - "double cannot represent values above one million"
      - "YAML cannot serialize double values"
    answer: 1
    explanation: |
      0.1 + 0.2 != 0.3 in IEEE-754 binary floating point. Over many transactions the error
      accumulates and reconciliation (entries must sum to zero) fails nondeterministically.
      BigDecimal gives exact decimal arithmetic with an explicit rounding mode.
    ref: "concepts.md#money-as-a-value-object"

  - id: design-digital-wallet-003
    difficulty: beginner
    tags: [scoping, boundaries]
    question: |
      Which item is legitimately IN scope for the LLD round of a digital wallet, versus a
      distraction to explicitly scope out?
    options:
      - "Implementing the TLS handshake with the bank gateway"
      - "Training a fraud-detection ML model"
      - "The class model for atomic transfers and the transaction ledger"
      - "Sharding the ledger across data centers"
    answer: 2
    explanation: |
      The transfer/ledger class model is the heart of the LLD round. Gateway wire protocols,
      fraud ML, and distributed sharding are out of scope — model the PaymentGateway interface
      and hand distribution to the system-design (HLD) domain.
    ref: "concepts.md#requirements-clarification"

  - id: design-digital-wallet-004
    difficulty: intermediate
    tags: [invariant, ledger]
    question: |
      What is the single correctness invariant you should state out loud in minute one?
    options:
      - "Every balance-changing operation records ledger entries whose signed amounts sum to zero, and no account may go negative"
      - "Every user must have a unique email address"
      - "Every transaction must complete within 200 milliseconds"
      - "Every wallet must support at least ten currencies"
    answer: 0
    explanation: |
      Double-entry (signed legs sum to zero) plus non-negativity is the entire correctness
      story: money is conserved and never fabricated. Latency, email uniqueness, and currency
      count are not correctness invariants.
    ref: "concepts.md#requirements-clarification"

  - id: design-digital-wallet-005
    difficulty: beginner
    tags: [noun-verb, method]
    question: |
      Using noun/verb extraction, "balance" appears repeatedly in the requirements. How
      should it be modeled?
    options:
      - "As a standalone Balance class with its own service"
      - "As a derived attribute of Account (a Money), reconstructable from the ledger"
      - "As a subclass of Transaction"
      - "As a global mutable static field"
    answer: 1
    explanation: |
      Not every noun becomes a class. A balance is a derived attribute of an Account — it is
      the running sum of that account's ledger entries — so it does not warrant its own class
      or service, and it is certainly not a transaction subtype.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-digital-wallet-006
    difficulty: intermediate
    tags: [noun-verb, filtering]
    question: |
      During noun extraction you list: User, Wallet, "PayTM", Account, "rupee symbol", Money.
      Which of these are NOISE that should be filtered out rather than becoming classes?
    options:
      - "User and Wallet"
      - "Account and Money"
      - "PayTM and rupee symbol"
      - "Wallet and Account"
    answer: 2
    explanation: |
      Brand names (PayTM) and UI/presentation tokens (currency symbol glyph) are noise — they
      are not domain concepts. User, Wallet, Account, and Money are genuine domain entities/
      value objects. Filtering noise is the discipline interviewers grade.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-digital-wallet-007
    difficulty: intermediate
    tags: [state-pattern, transaction]
    question: |
      A transaction moves Initiated -> Pending -> Success/Failed, and Success -> Reversed.
      Which pattern best models this so illegal transitions (e.g., Failed -> Success) are
      impossible by construction?
    options:
      - "Singleton"
      - "Flyweight"
      - "Adapter"
      - "State"
    answer: 3
    explanation: |
      The State pattern encapsulates legal transitions inside state objects, so an illegal
      move simply is not offered. It also satisfies OCP: a new state (e.g., Disputed) is a new
      class, not edits scattered across switch statements. The others solve unrelated problems.
    ref: "concepts.md#transaction-state-machine"

  - id: design-digital-wallet-008
    difficulty: intermediate
    tags: [strategy-pattern, payment-method]
    question: |
      Bank account, debit card, and UPI can each fund a wallet with different logic behind a
      common pull/push interface. Which pattern fits, and what principle does it uphold?
    options:
      - "Strategy, upholding the Open/Closed Principle"
      - "Observer, upholding the Single Responsibility Principle"
      - "Decorator, upholding the Liskov Substitution Principle"
      - "Prototype, upholding the Interface Segregation Principle"
    answer: 0
    explanation: |
      Interchangeable funding algorithms behind one PaymentMethod interface is textbook
      Strategy, and it upholds OCP: adding UPI is a new class with no change to WalletService.
      A switch on method type inside the service would violate OCP.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-digital-wallet-009
    difficulty: advanced
    tags: [double-entry, ledger]
    question: |
      In double-entry bookkeeping, transferring 100 from A to B produces which ledger legs?
    options:
      - "One entry: A -100"
      - "One entry: B +100"
      - "Two entries: A -100 and B +100, whose signed sum is 0"
      - "Two entries: A -100 and B -100, so both accounts drop"
    answer: 2
    explanation: |
      Every transaction posts balanced legs that sum to zero: debit the source (-100) and
      credit the destination (+100). This conserves money — it is only moved, never created or
      destroyed — and makes reconciliation a one-line sum check. Two equal-sign legs would
      violate conservation.
    ref: "concepts.md#double-entry-bookkeeping-and-the-ledger"

  - id: design-digital-wallet-010
    difficulty: advanced
    tags: [concurrency, deadlock]
    question: |
      Thread 1 transfers A->B while thread 2 transfers B->A, each locking one account first.
      What is the risk and the standard fix?
    options:
      - "Livelock; fix by adding more threads"
      - "Starvation; fix by using double instead of BigDecimal"
      - "Deadlock; fix by acquiring account locks in a canonical order (e.g., by account id)"
      - "Priority inversion; fix by making Account immutable"
    answer: 2
    explanation: |
      Each thread holds one lock and waits for the other — a classic deadlock cycle. Acquiring
      locks in a canonical global order (sort by account id, lock the smaller first) prevents a
      cycle from forming. This ordering rule is the graded concurrency detail.
    ref: "concepts.md#concurrency-and-atomic-transfers"

  - id: design-digital-wallet-011
    difficulty: advanced
    tags: [idempotency, retries]
    question: |
      A client sends "transfer 100", times out, and retries — but the first request already
      succeeded. What design element prevents a double-charge?
    options:
      - "A per-request idempotency key recorded atomically with the commit, so repeats return the original transaction"
      - "Increasing the client's socket timeout"
      - "Storing balances in a ConcurrentHashMap"
      - "Retrying with exponential backoff"
    answer: 0
    explanation: |
      An idempotency key makes the operation at-most-once in effect under at-least-once
      delivery: the service records key->transaction atomically and returns the original result
      for repeat keys. Timeouts, backoff, and a concurrent map do not stop the second execution.
    ref: "concepts.md#idempotency-and-retries"

  - id: design-digital-wallet-012
    difficulty: intermediate
    tags: [value-object, money]
    question: |
      Why is Money designed as an IMMUTABLE value object whose add/subtract return new
      instances?
    options:
      - "So it can be shared safely across threads and cannot be accidentally mutated mid-transfer, with equality by value"
      - "Because Java requires all money types to be final"
      - "To make it faster than a primitive long"
      - "Because immutable objects use less heap memory than mutable ones"
    answer: 0
    explanation: |
      Immutability makes Money thread-safe to share and impossible to mutate by accident during
      a transfer, and value equality (by amount+currency) is what you want for money. It is not
      a language requirement, a speed trick, or primarily a memory optimization.
    ref: "concepts.md#money-as-a-value-object"

  - id: design-digital-wallet-013
    difficulty: intermediate
    tags: [value-object, currency-safety]
    question: |
      What should Money.add(otherMoney) do when the two Money values have different
      currencies?
    options:
      - "Silently convert using today's exchange rate"
      - "Add the raw amounts and keep the first currency"
      - "Throw a CurrencyMismatchException — cross-currency arithmetic must go through an explicit converter"
      - "Return zero"
    answer: 2
    explanation: |
      A currency-safe value object refuses to add USD to INR; silently converting or ignoring
      currency corrupts money. Cross-currency movement must be explicit via a CurrencyConverter.
      Bundling this rule into Money is why it exists as a value object.
    ref: "concepts.md#money-as-a-value-object"

  - id: design-digital-wallet-014
    difficulty: advanced
    tags: [command-pattern, audit]
    question: |
      Modeling each Transaction as an object with execute() and reverse() reflects which
      pattern, and what does it buy you?
    options:
      - "Command — a first-class, auditable, replayable, reversible unit of work"
      - "Mediator — centralizing all transaction routing"
      - "Memento — snapshotting the entire wallet"
      - "Builder — assembling transactions step by step"
    answer: 0
    explanation: |
      A transaction with execute()/reverse() is a Command: the object itself is the audit
      record, and it enables replay, retry, and reversal. That is a natural fit for a wallet
      that must be fully auditable. Mediator, Memento, and Builder solve different problems.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-digital-wallet-015
    difficulty: intermediate
    tags: [srp, entities]
    question: |
      Why should the User class NOT carry a mutable balance field?
    options:
      - "Because Java forbids numeric fields on entities"
      - "Because balances change too rarely to store"
      - "Because balance belongs to an Account/ledger; keeping it off User preserves single responsibility (identity) and keeps money invariants in one place"
      - "Because User objects must be Serializable"
    answer: 2
    explanation: |
      A user is an identity/profile; money lives in Accounts and the Ledger. Putting balance on
      User spreads money logic and invariants across the codebase, violating SRP and inviting
      inconsistency. It is not a language restriction.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-digital-wallet-016
    difficulty: advanced
    tags: [modeling, inheritance-vs-composition]
    question: |
      Credit/Debit/Transfer differ in shape (a transfer has two accounts, a credit one), while
      status behavior (Initiated/Pending/Success...) varies orthogonally. What is the clean
      modeling call?
    options:
      - "Subclass along both axes: TransferPendingSuccess, CreditFailed, etc."
      - "Put everything in one Transaction class with boolean flags"
      - "Use inheritance only for status and store operation kind as a string"
      - "Use inheritance for the operation kind (Credit/Debit/Transfer) and State composition for the varying status behavior"
    answer: 3
    explanation: |
      Inheritance for the operation kind (genuinely different shape) and State composition for
      the orthogonal status behavior avoids a combinatorial subclass explosion. Subclassing both
      axes multiplies classes; boolean flags and stringly-typed kinds throw away type safety.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-digital-wallet-017
    difficulty: intermediate
    tags: [observer-pattern, notifications]
    question: |
      "Send an SMS and a push notification when a transfer completes." How do you add this
      without touching WalletService's transfer logic?
    options:
      - "Register TransactionObservers that the service notifies after commit; new channels are new observers"
      - "Add an if-block in transfer() for each channel"
      - "Make WalletService a subclass of SmsService"
      - "Poll the ledger from the UI every second"
    answer: 0
    explanation: |
      Observer decouples notification from the core: the service fires onCommitted(txn) and new
      channels are new observer implementations — zero service change (OCP). Inlining channels
      or subclassing a notifier couples the core to delivery mechanics.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-digital-wallet-018
    difficulty: intermediate
    tags: [extensibility, ocp]
    question: |
      To add "top up via UPI" to an existing wallet, what should change if the design is
      correct?
    options:
      - "Edit the transfer() and topUp() methods to add a UPI branch"
      - "Add a new column to the User table"
      - "Rewrite the Money class to understand UPI"
      - "Add a new PaymentMethod implementation (and a factory line); WalletService is untouched"
    answer: 3
    explanation: |
      With PaymentMethod as a Strategy, a new funding source is a new class plus a factory
      registration — WalletService stays closed for modification. Editing service branches
      would violate OCP; UPI has nothing to do with Money's internals.
    ref: "concepts.md#extensibility"

  - id: design-digital-wallet-019
    difficulty: advanced
    tags: [ledger, immutability]
    question: |
      How should the system handle an edit or reversal of a completed transaction?
    options:
      - "Mutate the original ledger rows in place to reflect the new amounts"
      - "Delete the original entries and insert corrected ones"
      - "Post NEW compensating entries and move the original transaction to REVERSED, never mutating past rows"
      - "Recompute all balances from scratch and overwrite the ledger"
    answer: 2
    explanation: |
      An append-only, immutable ledger gives you a trustworthy audit trail. Reversals are new
      compensating double-entry postings; the original stays intact and moves to REVERSED.
      Mutating or deleting history destroys auditability and reconciliation.
    ref: "concepts.md#double-entry-bookkeeping-and-the-ledger"

  - id: design-digital-wallet-020
    difficulty: beginner
    tags: [actors, use-cases]
    question: |
      Which of these is an EXTERNAL actor that drives a transaction from Pending to
      Success/Failed?
    options:
      - "The payment gateway / bank"
      - "The Ledger"
      - "The Money value object"
      - "The TransactionFactory"
    answer: 0
    explanation: |
      The bank/payment gateway asynchronously confirms or rejects a top-up or withdrawal,
      driving the Pending -> Success/Failed transition. The ledger, Money, and factory are
      internal collaborators, not external actors.
    ref: "concepts.md#actors-and-use-cases"

  - id: design-digital-wallet-021
    difficulty: intermediate
    tags: [relationships, composition]
    question: |
      What is the correct UML relationship between Wallet and Account, and why?
    options:
      - "Aggregation — accounts outlive their wallet"
      - "Inheritance — Account is a kind of Wallet"
      - "Composition — an account has no meaning outside its wallet and shares its lifecycle"
      - "Dependency — Wallet only uses Account transiently"
    answer: 2
    explanation: |
      An Account belongs to exactly one Wallet and dies with it, so it is composition (filled
      diamond). Aggregation implies independent lifetime; Account is not a subtype of Wallet;
      and the relationship is structural ownership, not a transient dependency.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-digital-wallet-022
    difficulty: advanced
    tags: [concurrency, atomicity]
    question: |
      Why is a ConcurrentHashMap of account balances NOT sufficient to make a transfer safe?
    options:
      - "ConcurrentHashMap is not thread-safe"
      - "ConcurrentHashMap cannot store BigDecimal values"
      - "A transfer's check-then-debit on the source plus the credit on the destination and the ledger post must be one atomic critical section across multiple accounts, which per-key thread-safety does not provide"
      - "It uses too much memory"
    answer: 2
    explanation: |
      ConcurrentHashMap gives per-key atomicity, but a transfer spans two accounts plus the
      ledger and requires check-then-act atomicity across all of them. Without a shared critical
      section a reader can see a debit without its credit, or a balance can go negative in a race.
    ref: "concepts.md#concurrency-and-atomic-transfers"

  - id: design-digital-wallet-023
    difficulty: advanced
    tags: [concurrency, optimistic-locking]
    question: |
      What characterizes an OPTIMISTIC locking approach to updating an account balance?
    options:
      - "Hold a mutex on the account for the whole transfer"
      - "Read balance plus a version, compute, then compare-and-set on the version; retry if it changed"
      - "Never check the balance and allow negatives to be fixed later"
      - "Serialize all transfers through a single global lock"
    answer: 1
    explanation: |
      Optimistic concurrency reads a version with the balance and does a compare-and-set on
      commit, retrying on conflict — no lock held across the operation, good under low
      contention. Holding a mutex is pessimistic; skipping the check or a global lock are wrong.
    ref: "concepts.md#concurrency-and-atomic-transfers"

  - id: design-digital-wallet-024
    difficulty: intermediate
    tags: [factory-pattern, creational]
    question: |
      A TransactionFactory that builds the right Transaction subtype wired to its initial state
      is an example of which GoF category?
    options:
      - "Behavioral"
      - "Structural"
      - "Creational"
      - "Concurrency"
    answer: 2
    explanation: |
      Factory patterns are Creational — they encapsulate object construction so clients do not
      new up concrete transaction subtypes. State/Strategy/Command/Observer are Behavioral;
      Adapter/Decorator are Structural.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-digital-wallet-025
    difficulty: intermediate
    tags: [edge-cases, validation]
    question: |
      A transfer request has amount = -50. What should the design do?
    options:
      - "Accept it and reverse the direction of the transfer"
      - "Convert it to +50 silently"
      - "Set the balance to zero"
      - "Reject it in validation — amounts must be strictly positive"
    answer: 3
    explanation: |
      Negative or zero amounts are invalid and must be rejected during validation; the direction
      of a transfer is expressed by source/destination, never by a negative amount. Silently
      flipping the sign or zeroing balances corrupts intent.
    ref: "concepts.md#edge-cases"

  - id: design-digital-wallet-026
    difficulty: intermediate
    tags: [edge-cases, insufficient-funds]
    question: |
      When a debit would drive the source account below zero (baseline: no overdraft), what
      happens?
    options:
      - "The debit proceeds and the balance goes negative"
      - "The system borrows from another user's account"
      - "The transaction is silently dropped with no record"
      - "The debit is rejected, the transaction moves to FAILED, and no ledger entries are posted"
    answer: 3
    explanation: |
      The non-negativity invariant means the debit is refused, the transaction transitions to
      FAILED, and nothing is posted to the ledger. Never allow negative balances, borrow from
      others, or drop the request without a FAILED record.
    ref: "concepts.md#edge-cases"

  - id: design-digital-wallet-027
    difficulty: advanced
    tags: [state-pattern, reversal]
    question: |
      A guard state.canReverse() is checked before reversing a transaction. Which state should
      return true?
    options:
      - "FAILED"
      - "PENDING"
      - "SUCCESS"
      - "INITIATED"
    answer: 2
    explanation: |
      Only a SUCCESS transaction represents committed money movement that can be undone by a
      compensating transaction. Failed/initiated/pending transactions never committed balances,
      so there is nothing to reverse — canReverse() returns false for them.
    ref: "concepts.md#transaction-state-machine"

  - id: design-digital-wallet-028
    difficulty: advanced
    tags: [extensibility, limits]
    question: |
      To add per-transaction caps and daily limits without editing execute(), what is the
      cleanest approach?
    options:
      - "Hard-code the limits inside Transfer.execute()"
      - "Add limit fields to the Money class"
      - "Store limits as global static constants"
      - "A TransactionLimitPolicy interface checked during validation, with new rules as new policy objects"
    answer: 3
    explanation: |
      A pluggable limit policy (Strategy / chain of rules) checked during validation keeps
      execute() closed for modification — new limit rules are new policy objects. Hard-coding
      limits or bolting them onto Money couples unrelated concerns and violates OCP/SRP.
    ref: "concepts.md#extensibility"

  - id: design-digital-wallet-029
    difficulty: advanced
    tags: [extensibility, cashback]
    question: |
      Product wants "1% cashback credited on qualifying transactions." Which existing mechanism
      absorbs this with no core change?
    options:
      - "A TransactionObserver that credits a rewards account on qualifying committed transactions"
      - "A new subclass of Money called CashbackMoney"
      - "A boolean cashback flag threaded through every method"
      - "A rewrite of the Ledger to special-case cashback"
    answer: 0
    explanation: |
      Cashback is a reaction to committed transactions — a natural Observer that credits a
      rewards account, requiring no change to the transfer core. Subclassing Money, threading
      flags, or special-casing the ledger all leak the feature into the core.
    ref: "concepts.md#extensibility"

  - id: design-digital-wallet-030
    difficulty: intermediate
    tags: [multi-currency, strategy]
    question: |
      Supporting cross-currency transfer is cheap in this design mainly because...
    options:
      - "the database is already sharded by currency"
      - "double already handles currency conversion"
      - "Money carries its currency from day one, so you inject a CurrencyConverter strategy and convert at the boundary"
      - "every account stores all currencies at once"
    answer: 2
    explanation: |
      Because Money is a currency-aware value object from the start, adding conversion is
      additive: inject a CurrencyConverter and convert at the boundary, crediting the destination
      in its own currency. A raw long/double amount would force a painful retrofit.
    ref: "concepts.md#extensibility"

  - id: design-digital-wallet-031
    difficulty: advanced
    tags: [edge-cases, rounding]
    question: |
      When converting currency, sub-unit rounding is unavoidable. What is the correct handling?
    options:
      - "Use double so rounding never happens"
      - "Always round up in the bank's favor without documenting it"
      - "Choose an explicit RoundingMode (e.g., HALF_EVEN) and decide who absorbs the remainder"
      - "Ignore the fractional remainder"
    answer: 2
    explanation: |
      Rounding must be deliberate: pick an explicit RoundingMode (banker's rounding / HALF_EVEN
      is common) and decide who absorbs the sub-unit remainder. double does not eliminate
      rounding — it makes it nondeterministic — and silently ignoring the remainder loses money.
    ref: "concepts.md#edge-cases"

  - id: design-digital-wallet-032
    difficulty: intermediate
    tags: [facade, orchestration]
    question: |
      What is the role of WalletService in the design?
    options:
      - "It stores the raw balance as a global variable"
      - "It is the value object for money"
      - "It is a Facade that orchestrates validation, transaction creation, ledger posting, and observer notification"
      - "It replaces the Ledger entirely"
    answer: 2
    explanation: |
      WalletService is the Facade/orchestrator: one entry point that validates, creates the
      right transaction, commits it, and notifies observers — keeping controllers thin. It is
      not a global balance store, a value object, or a replacement for the ledger.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-digital-wallet-033
    difficulty: advanced
    tags: [ledger, reconciliation]
    question: |
      With an append-only double-entry ledger, how is an account's current balance obtained?
    options:
      - "By reading a single authoritative mutable balance field that the ledger ignores"
      - "By asking the payment gateway"
      - "By averaging all transaction amounts"
      - "As the running sum of that account's signed ledger entries (optionally cached/materialized)"
    answer: 3
    explanation: |
      In an event/ledger-sourced model the balance is the running sum of the account's signed
      entries — it can be materialized/cached but is always rebuildable from the log. This is
      what makes reconciliation and audit possible; a lone mutable field is not the source of truth.
    ref: "concepts.md#double-entry-bookkeeping-and-the-ledger"

  - id: design-digital-wallet-034
    difficulty: intermediate
    tags: [edge-cases, self-transfer]
    question: |
      A user attempts to transfer money from their account to the same account. What is the
      correct behavior?
    options:
      - "Allow it and post +100 and -100 entries as usual"
      - "Double the balance as a reward"
      - "Route it through the bank gateway"
      - "Reject or no-op it, never creating phantom ledger entries"
    answer: 3
    explanation: |
      A self-transfer is a no-op economically; allowing it would create meaningless ledger
      churn and could mask bugs. Reject it (or treat as a validated no-op) — do not post entries,
      double balances, or involve the gateway.
    ref: "concepts.md#edge-cases"

  - id: design-digital-wallet-035
    difficulty: advanced
    tags: [concurrency, critical-section]
    question: |
      Why must the ledger post be inside the SAME critical section as the balance mutations
      during a transfer?
    options:
      - "To reduce the number of database connections"
      - "Because BigDecimal is not thread-safe"
      - "So a concurrent reader can never observe a debit without its matching credit (preserving sum-to-zero)"
      - "To make the transfer faster"
    answer: 2
    explanation: |
      If the balance change and ledger post are not atomic together, a reader can see half a
      transaction applied — a debit with no matching credit — breaking the sum-to-zero invariant.
      BigDecimal is immutable/thread-safe; atomicity is about cross-step visibility, not speed.
    ref: "concepts.md#concurrency-and-atomic-transfers"

  - id: design-digital-wallet-036
    difficulty: intermediate
    tags: [idempotency, concurrency]
    question: |
      Two retries of the same idempotency key arrive concurrently. What must the design
      guarantee?
    options:
      - "Both execute and the balances net out later"
      - "The second request is rejected with a fatal error and the user is logged out"
      - "Only one transaction is executed; the key mapping is recorded atomically (e.g., putIfAbsent / unique constraint)"
      - "The key is ignored under concurrency"
    answer: 2
    explanation: |
      Idempotency must hold even under concurrent retries: record the key->transaction mapping
      atomically (putIfAbsent or a unique DB constraint) so exactly one execution wins and both
      callers see the same result. Executing both, hard-failing, or ignoring the key all break it.
    ref: "concepts.md#idempotency-and-retries"

  - id: design-digital-wallet-037
    difficulty: beginner
    tags: [api, signatures]
    question: |
      Why does every mutating WalletService method (topUp, transfer, withdraw) take an
      idempotencyKey parameter?
    options:
      - "To sort transactions alphabetically"
      - "To encrypt the amount"
      - "To choose the currency"
      - "To de-duplicate client retries so the same logical operation executes at most once"
    answer: 3
    explanation: |
      The idempotency key lets the service recognize a retried request and return the original
      result instead of re-executing, preventing double-spend. It is not for sorting, encryption,
      or currency selection.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-digital-wallet-038
    difficulty: intermediate
    tags: [api, reversal]
    question: |
      The reverse(transactionId, key) API is specified to CREATE a new compensating
      transaction rather than delete the original. Which principle/behavior does this protect?
    options:
      - "An immutable, auditable history where money movements are never erased"
      - "Faster response times"
      - "Lower memory usage"
      - "Alphabetical ordering of transactions"
    answer: 0
    explanation: |
      Creating a compensating transaction preserves an immutable audit trail — the original and
      its reversal both remain visible and reconcilable. Deleting records would destroy
      auditability. It is not primarily about speed, memory, or ordering.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-digital-wallet-039
    difficulty: advanced
    tags: [extensibility, overdraft]
    question: |
      A follow-up asks for a "credit line" allowing certain accounts to go negative up to a
      limit. What is the cleanest change?
    options:
      - "Delete the non-negativity check everywhere"
      - "Add a global boolean allowNegative"
      - "Store negative balances as positive with a sign flag string"
      - "Introduce an OverdraftPolicy on the account (baseline = no negative); credit accounts use a limit-based policy"
    answer: 3
    explanation: |
      Making the balance guard policy-driven (OverdraftPolicy) turns a hard-coded invariant into
      a pluggable rule: normal accounts keep "no negative," credit accounts allow a bounded
      negative. Deleting the check or a global flag loses per-account control and safety.
    ref: "concepts.md#extensibility"

  - id: design-digital-wallet-040
    difficulty: advanced
    tags: [scale, hld-boundary]
    question: |
      The interviewer says "now handle millions of TPS with a distributed ledger and 2-phase
      commit across services." How should you respond in the LLD round?
    options:
      - "Acknowledge it is an HLD concern (sharding, saga/2PC, event-sourced ledger) and point to the system-design domain, keeping this design single-node"
      - "Immediately redesign every class for distribution"
      - "Claim the current design already scales infinitely as-is"
      - "Switch the money type to double for speed"
    answer: 0
    explanation: |
      Distributed ledgers, sharding, and cross-service commit are high-level design concerns.
      The right senior move is to acknowledge them, name the techniques, and hand them to the
      HLD/system-design domain while keeping the LLD single-node. Never trade correctness (double)
      for speed.
    ref: "concepts.md#concurrency-and-atomic-transfers"

  - id: design-digital-wallet-041
    difficulty: intermediate
    tags: [ledger-entry, immutability]
    question: |
      Why is LedgerEntry modeled as immutable (no setters)?
    options:
      - "To allow editing amounts after posting"
      - "Because immutable objects cannot be garbage collected"
      - "To let two threads write the same entry simultaneously"
      - "So the audit record of each posting can never be silently altered after the fact"
    answer: 3
    explanation: |
      An immutable LedgerEntry is a permanent, tamper-evident record of one posting leg; you
      correct mistakes by posting new compensating entries, never by mutating old ones. It is not
      about editing, GC behavior, or concurrent writes to one entry.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-digital-wallet-042
    difficulty: beginner
    tags: [state-machine, lifecycle]
    question: |
      An instant wallet-to-wallet transfer with sufficient funds and no external gateway may
      legitimately go directly from...
    options:
      - "Failed to Success"
      - "Initiated to Success, skipping Pending"
      - "Reversed to Initiated"
      - "Success to Initiated"
    answer: 1
    explanation: |
      Pending exists to await external confirmation; an instant internal transfer needs no
      gateway, so Initiated -> Success is a legal shortcut. Failed/Reversed are terminal and
      cannot flow back to Success/Initiated.
    ref: "concepts.md#transaction-state-machine"

  - id: design-digital-wallet-043
    difficulty: advanced
    tags: [state-pattern, ocp]
    question: |
      Adding a new "Disputed" transaction state demonstrates the payoff of the State pattern
      because...
    options:
      - "it is a new state class defining its own legal transitions, with no scattered conditionals to hunt down"
      - "it requires editing every switch statement across the codebase"
      - "it forces Money to become mutable"
      - "it removes the need for a Ledger"
    answer: 0
    explanation: |
      With State, a new status is a self-contained class declaring its own transitions — the
      Open/Closed payoff, since existing code is not modified. An enum-and-switch design would
      require chasing conditionals everywhere. It does not affect Money or the Ledger.
    ref: "concepts.md#transaction-state-machine"

  - id: design-digital-wallet-044
    difficulty: intermediate
    tags: [dependency, injection]
    question: |
      In the class diagram, WalletService has a DEPENDENCY (dashed) relationship to
      PaymentMethod and CurrencyConverter rather than composition. Why?
    options:
      - "Because it owns their entire lifecycle as internal state"
      - "Because they are subclasses of WalletService"
      - "Because they are value objects"
      - "Because it uses them transiently as injected collaborators, not as owned state"
    answer: 3
    explanation: |
      A dashed dependency signals transient use of an injected collaborator, not ownership. The
      service invokes a PaymentMethod/CurrencyConverter passed to it; it does not manage their
      lifecycle as composed state, and they are neither subclasses nor value objects.
    ref: "concepts.md#class-diagram"

  - id: design-digital-wallet-045
    difficulty: advanced
    tags: [edge-cases, gateway]
    question: |
      A top-up is PENDING while the bank gateway processes it, then the gateway declines. What
      should happen?
    options:
      - "Credit the wallet anyway to keep the user happy"
      - "Release any reservation, move the transaction to FAILED, and leave the balance unchanged"
      - "Leave the transaction stuck in PENDING forever"
      - "Delete the transaction record"
    answer: 1
    explanation: |
      A declined gateway response means no funds arrived: release the hold, transition to FAILED,
      and make no balance change. Crediting anyway invents money, and leaving it stuck or deleting
      it breaks auditability and lifecycle correctness.
    ref: "concepts.md#edge-cases"

  - id: design-digital-wallet-046
    difficulty: intermediate
    tags: [noun-verb, state-vs-enum]
    question: |
      During object identification, "transaction status" surfaces as a noun. Why elevate it to
      a State object rather than leave it a bare enum with switch statements?
    options:
      - "Because the status carries BEHAVIOR (legal transitions, entry actions), which a State object encapsulates while an enum-plus-switch scatters it"
      - "Enums are not allowed in Java"
      - "Because enums cannot be persisted"
      - "Because a State object uses less memory than an enum"
    answer: 0
    explanation: |
      Status is not just a label — it governs which transitions are legal and what happens on
      entry. A State object encapsulates that behavior (and stays OCP-friendly), whereas an enum
      with switches spreads the logic. The enum can still exist for persistence; that is not the reason.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-digital-wallet-047
    difficulty: advanced
    tags: [reconciliation, invariant]
    question: |
      What is the reconciliation check that double-entry bookkeeping makes almost trivial?
    options:
      - "Every user has logged in at least once"
      - "Every transaction completed under 100 ms"
      - "The number of accounts equals the number of users"
      - "The sum of all internal ledger entries equals total funds in minus total funds out"
    answer: 3
    explanation: |
      Because every internal movement posts balanced legs summing to zero, the only way the
      internal total changes is external funding in/out. So reconciliation reduces to: sum of all
      entries == funded in - funded out. Latency and account counts are unrelated to reconciliation.
    ref: "concepts.md#double-entry-bookkeeping-and-the-ledger"

  - id: design-digital-wallet-048
    difficulty: intermediate
    tags: [patterns, gof-intent]
    question: |
      Classified by GoF intent, which grouping is CORRECT for this design's patterns?
    options:
      - "State, Strategy, Command, Observer are all Behavioral; Factory is Creational"
      - "Strategy and Observer are Creational; State is Structural"
      - "Command and Factory are both Structural"
      - "State and Strategy are Creational; Factory is Behavioral"
    answer: 0
    explanation: |
      State, Strategy, Command, and Observer all address how objects behave/collaborate and
      distribute responsibility — Behavioral. Factory encapsulates construction — Creational.
      The other groupings misclassify them.
    ref: "concepts.md#key-design-decisions-and-patterns"
