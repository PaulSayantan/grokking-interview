topic: "The LLD Interview Method"
domain: lld-and-ood
topic_slug: lld-interview-method
version: 1
questions:
  - id: lld-interview-method-001
    difficulty: beginner
    tags: [round-basics, scope]
    question: |
      What is the LLD (machine-coding / OO design) interview round primarily testing?
    options:
      - "Your ability to pick the right sharding key and datastore for millions of users"
      - "Your ability to turn fuzzy requirements into clean, extensible object-oriented classes in 45-90 minutes"
      - "Your ability to solve a graph or dynamic-programming algorithm within optimal Big-O time complexity"
      - "Your knowledge of a specific framework's annotations, dependency-injection wiring, and XML configuration"
    answer: 1
    explanation: |
      The LLD round sits between DSA and high-level design. It is about clean, extensible
      class design under time pressure — single-machine, in-memory OO. Sharding/datastores
      are system-design; algorithmic optimization is DSA; framework trivia is neither.
    ref: "concepts.md#how-interviewers-evaluate-you"

  - id: lld-interview-method-002
    difficulty: beginner
    tags: [method, first-step]
    question: |
      The interviewer says "Design a parking lot." What should you do FIRST?
    options:
      - "Start writing the ParkingLot class skeleton immediately"
      - "Draw the full UML class diagram with every attribute"
      - "List all 23 GoF design patterns you might use"
      - "Ask clarifying questions about actors, scope, and constraints"
    answer: 3
    explanation: |
      The very first step is to clarify requirements: identify actors and use-cases, agree
      what is in and out of scope, and confirm constraints (single machine? concurrent?).
      Jumping straight to code on a vague one-liner is the most common way strong coders
      fail this round.
    ref: "concepts.md#step-1--clarify-requirements-5-min"

  - id: lld-interview-method-003
    difficulty: beginner
    tags: [time-budget, planning]
    question: |
      In a 45-minute LLD round, roughly how long should you spend clarifying requirements
      before designing?
    options:
      - "About 5 minutes"
      - "About 20 minutes"
      - "Zero — clarification wastes coding time"
      - "The entire first half"
    answer: 0
    explanation: |
      A rough budget allots about 5 minutes to clarification. Two or three sharp questions
      bound the problem; spending 20 minutes there leaves no time to code, while skipping it
      risks building the wrong thing.
    ref: "concepts.md#the-round-at-a-glance"

  - id: lld-interview-method-004
    difficulty: intermediate
    tags: [scope, boundaries]
    question: |
      Mid-round the interviewer asks, "How would this handle a million requests per second
      across a fleet of servers?" Within the LLD round, the best response is to:
    options:
      - "Immediately add a Redis cache, a Kafka message queue, and horizontal sharding directly into your object model"
      - "Refuse to answer entirely, insisting the question is out of scope and unrelated to object-oriented design"
      - "Note it is a distributed-systems / system-design concern, sketch the direction briefly, and keep your design single-machine"
      - "Rewrite the entire design as stateless functions deployed behind a load balancer to spread the traffic"
    answer: 2
    explanation: |
      Scaling across machines belongs to system-design. The senior move is to acknowledge
      the boundary, point at the direction (sharding, datastore, eventing), and keep the LLD
      solution single-machine and in-memory. Bolting distributed infra onto an OO class model
      is over-engineering for this round.
    ref: "concepts.md#step-7--discuss-extensibility-and-edge-cases-5-min"

  - id: lld-interview-method-005
    difficulty: beginner
    tags: [core-objects, nouns]
    question: |
      A fast, defensible way to seed your candidate classes from the requirements is to:
    options:
      - "Extract the nouns as candidate classes and the verbs as candidate methods"
      - "Create one class for each of the 23 GoF design patterns you can recall"
      - "Make a single Manager class and add methods as needed"
      - "Copy the class list from a parking-lot solution you memorized"
    answer: 0
    explanation: |
      The noun-and-verb pass — nouns become candidate classes, verbs become methods — is a
      quick, defensible way to seed the model directly from the agreed requirements. You then
      prune and assign single responsibilities.
    ref: "concepts.md#step-2--identify-core-objects-5-min"

  - id: lld-interview-method-006
    difficulty: intermediate
    tags: [srp, god-class]
    question: |
      You notice your ParkingLotManager class parses input, assigns spots, computes fees, and
      processes payments. What is the problem and the fix?
    options:
      - "It is a god class violating SRP; redistribute responsibilities across focused classes"
      - "Nothing — centralizing logic in one class is good encapsulation"
      - "It needs to be a Singleton so one shared instance coordinates the whole system"
      - "It should be split only once the interviewer explicitly complains about its size"
    answer: 0
    explanation: |
      One class accumulating every verb is the classic god class, violating the Single
      Responsibility Principle and becoming impossible to extend. Redistribute:
      pricing to a PricingStrategy, payment to a Payment/PaymentService, assignment to the
      lot, etc. — before writing code.
    ref: "concepts.md#step-2--identify-core-objects-5-min"

  - id: lld-interview-method-007
    difficulty: intermediate
    tags: [relationships, composition]
    question: |
      A ParkingLot contains Floors, and Floors contain ParkingSpots. What relationship is
      this, and which design guidance does it reflect?
    options:
      - "has-a composition; favor composition over inheritance"
      - "is-a inheritance; reuse the base class implementation"
      - "A Singleton relationship; share one global instance"
      - "A circular dependency; break it with an interface"
    answer: 0
    explanation: |
      A lot HAS floors and a floor HAS spots — this is composition/aggregation (has-a), and
      it reflects the 'favor composition over inheritance' guidance. Inheritance (is-a) is for
      genuine subtypes like Car is-a Vehicle.
    ref: "concepts.md#step-3--establish-relationships-5-min"

  - id: lld-interview-method-008
    difficulty: intermediate
    tags: [relationships, is-a-has-a]
    question: |
      Which of the following is the correct is-a (inheritance/interface) relationship rather
      than a has-a?
    options:
      - "A ParkingLot and its Floors"
      - "A Ticket and its entry timestamp"
      - "A Car and Vehicle"
      - "An Order and its LineItems"
    answer: 2
    explanation: |
      Car is-a Vehicle is a genuine subtype relationship (inheritance / interface
      implementation). The others are has-a: a lot has floors, a ticket has a timestamp, an
      order has line items — all composition.
    ref: "concepts.md#step-3--establish-relationships-5-min"

  - id: lld-interview-method-009
    difficulty: advanced
    tags: [patterns, strategy, ocp]
    question: |
      Requirements say the pricing model must be pluggable (hourly, flat, surge). Which
      pattern fits best, and what is the one-sentence justification you should say aloud?
    options:
      - "Singleton — so there is only one pricing instance shared across the whole system"
      - "Observer — so the pricing component is notified whenever a car exits the lot"
      - "Strategy — a new fee model is a new class, so ParkingLot stays closed for modification"
      - "Decorator — so we can stack multiple independent price adjustments onto one ticket"
    answer: 2
    explanation: |
      A varying algorithm is the Strategy trigger. Naming it plus the OCP justification —
      'a new pricing model becomes a new class rather than an edit to ParkingLot' —
      demonstrates pattern knowledge and SOLID adherence in one breath.
    ref: "concepts.md#step-5--apply-patterns-ongoing"

  - id: lld-interview-method-010
    difficulty: intermediate
    tags: [patterns, justification]
    question: |
      What matters most about using a design pattern in an LLD interview?
    options:
      - "Using as many patterns as you possibly can to demonstrate the breadth of your knowledge"
      - "Choosing obscure, exotic patterns the interviewer has probably never encountered before"
      - "Naming the pattern, stating the problem it solves, and noting the alternative you rejected"
      - "Implementing every pattern with the exact class structure written in the original GoF book"
    answer: 2
    explanation: |
      The skill tested is judgment: name the pattern, justify why (the problem it solves),
      and mention the alternative you rejected. Reflexively dropping pattern names, or forcing
      many patterns in, signals cargo-culting rather than judgment.
    ref: "concepts.md#step-5--apply-patterns-ongoing"

  - id: lld-interview-method-011
    difficulty: intermediate
    tags: [patterns, state]
    question: |
      A vending machine moves through idle -> has-money -> dispensing -> idle, and you find
      yourself writing long if (status == ...) chains. Which pattern cleans this up?
    options:
      - "State"
      - "Factory"
      - "Observer"
      - "Builder"
    answer: 0
    explanation: |
      A finite state machine with behavior that depends on the current state is the State
      pattern's trigger; it replaces sprawling status-based conditionals with state objects.
      Factory is for creation, Observer for notifications, Builder for construction.
    ref: "concepts.md#step-5--apply-patterns-ongoing"

  - id: lld-interview-method-012
    difficulty: intermediate
    tags: [patterns, observer]
    question: |
      When a parking spot is freed, a waiting-display board should update automatically.
      Which pattern models 'state change notifies interested parties'?
    options:
      - "Observer"
      - "Strategy"
      - "Singleton"
      - "Template Method"
    answer: 0
    explanation: |
      Observer is for one-to-many notification when a subject's state changes — spot freed
      notifies the display. Strategy varies an algorithm, Singleton limits instances,
      Template Method fixes an algorithm skeleton.
    ref: "concepts.md#step-5--apply-patterns-ongoing"

  - id: lld-interview-method-013
    difficulty: advanced
    tags: [over-engineering, pitfalls]
    question: |
      For a problem that needs a two-line fee calculation, a candidate wraps it in a Factory,
      a Strategy, and an Observer. How does an interviewer most likely read this?
    options:
      - "As strong pattern knowledge that will score highly and impress the panel"
      - "As a textbook-correct application of the Open/Closed Principle worth extra credit"
      - "As over-engineering / cargo-culting that signals poor judgment"
      - "As a prudent, necessary safeguard against future requirement changes and growth"
    answer: 2
    explanation: |
      Forcing multiple patterns onto a trivial problem is over-engineering. It burns limited
      time and signals that the candidate applies patterns reflexively rather than in response
      to real variation or duplication. Introduce structure only when the problem demands it.
    ref: "concepts.md#step-5--apply-patterns-ongoing"

  - id: lld-interview-method-014
    difficulty: intermediate
    tags: [api-design, interfaces]
    question: |
      In the 'define key interfaces and methods' step, where should you introduce interfaces?
    options:
      - "Around every single class, to maximize abstraction and future flexibility everywhere"
      - "Only at the very end, after the concrete code has been fully written and tested"
      - "At the variation points the requirements identified (pricing, assignment, notification)"
      - "Nowhere at all — concrete classes are simpler and faster to write in an interview"
    answer: 2
    explanation: |
      Define an interface anywhere requirements said 'this can vary.' Those seams are where
      the Open/Closed Principle and the Strategy pattern pay off. Interfacing everything is
      over-abstraction; interfacing nothing forecloses extension.
    ref: "concepts.md#step-4--define-key-interfaces-and-methods-10-min"

  - id: lld-interview-method-015
    difficulty: advanced
    tags: [api-design, return-types]
    question: |
      Your ParkingLot.park(Vehicle) can fail when the lot is full. Which API choice best
      communicates that outcome to the caller?
    options:
      - "Return void and print an error message to the console when the lot happens to be full"
      - "Return a plain boolean true/false flag and hand back no ticket object to the caller at all"
      - "Silently return null on failure and let the calling code figure out what went wrong on its own"
      - "Return an Optional<Ticket> or throw a clear exception, and say which you chose and why"
    answer: 3
    explanation: |
      Return types carry meaning. Returning Optional<Ticket> (or throwing a specific
      exception) makes the 'lot full' case explicit and gives the caller a handle. Choosing a
      signaling mechanism and justifying it is exactly what the API step is for. Returning bare
      null or void hides the failure.
    ref: "concepts.md#step-4--define-key-interfaces-and-methods-10-min"

  - id: lld-interview-method-016
    difficulty: beginner
    tags: [coding, skeleton]
    question: |
      When you begin writing code, what is the recommended sequence?
    options:
      - "Fully implement one class to perfection, including every getter, before touching any other class"
      - "Write all of the methods out as detailed pseudocode comments only, deferring real code entirely"
      - "Lay down the class skeleton first, then fully implement the 2-3 critical methods, stubbing the rest"
      - "Start with the payment-provider integration first, since it is the hardest and riskiest part"
    answer: 2
    explanation: |
      Skeleton first makes the whole structure visible and lets the interviewer redirect
      early; then implement the few critical methods (the heart of the problem) fully and stub
      peripheral ones. Gold-plating one class while core methods stay unwritten is a time-
      management pitfall.
    ref: "concepts.md#step-6--write-the-code-20-40-min"

  - id: lld-interview-method-017
    difficulty: intermediate
    tags: [coding, compile-ready]
    question: |
      In the LLD coding phase, you should aim to produce:
    options:
      - "Compile-ready code with real types and real bodies for the critical paths"
      - "High-level pseudocode only, since real code is too slow to write"
      - "A full working system with persistence and a UI"
      - "Only a UML diagram; code is optional"
    answer: 0
    explanation: |
      The round expects compile-ready code — real types and real method bodies for the
      critical paths — not pseudocode. You will not finish everything, so you stub peripheral
      methods, but the core must be concrete and correct.
    ref: "concepts.md#step-6--write-the-code-20-40-min"

  - id: lld-interview-method-018
    difficulty: advanced
    tags: [encapsulation, tell-dont-ask]
    question: |
      Which method call best reflects encapsulation / Tell-Don't-Ask on a ParkingSpot?
    options:
      - "spot.setOccupied(true)"
      - "spot.getStatus().setValue(OCCUPIED)"
      - "spot.occupy(vehicle)"
      - "spot.fields.put(\"occupied\", true)"
    answer: 2
    explanation: |
      spot.occupy(vehicle) tells the object to perform behavior and keeps its state
      encapsulated, following Tell-Don't-Ask. Exposing setters or internal fields leaks state
      and pushes logic outside the object, tending toward an anemic model.
    ref: "concepts.md#step-6--write-the-code-20-40-min"

  - id: lld-interview-method-019
    difficulty: intermediate
    tags: [concurrency, scope]
    question: |
      The requirements explicitly said the system is single-threaded. Should you add locks and
      concurrent data structures anyway to be safe?
    options:
      - "Yes — production systems are always concurrent, so defensive locking is the safe default regardless of scope"
      - "Yes — interviewers secretly grade for concurrency, so sprinkling in synchronized blocks preemptively earns extra credit"
      - "No — adding threading beyond the agreed scope is over-engineering; mention it only if concurrency is in scope"
      - "Only if you have time left over at the very end regardless of scope"
    answer: 2
    explanation: |
      Address concurrency only when requirements call for it. Bolting synchronization onto a
      single-threaded scope is over-engineering and wastes time. If concurrency IS in scope,
      then discuss per-floor locks or atomic compare-and-set on spot state.
    ref: "concepts.md#step-6--write-the-code-20-40-min"

  - id: lld-interview-method-020
    difficulty: advanced
    tags: [concurrency, correctness]
    question: |
      Concurrency IS in scope: two entry gates try to assign the last free spot on a floor at
      the same time. What is the core risk and a valid single-machine fix?
    options:
      - "Risk of a memory leak from the retained vehicle references; fix by allocating a larger JVM heap and tuning GC"
      - "Risk of both gates assigning the same spot; fix with a per-floor lock or an atomic compare-and-set on spot state"
      - "Risk of slow response times under load; fix by caching the floor's free-spot list in an external Redis cluster"
      - "There is no real risk here because Java object field access is atomic and thread-safe by default under the JMM"
    answer: 1
    explanation: |
      Without synchronization, two threads can both observe the spot as free and assign it —
      a race condition (over-admission). A per-floor lock or an atomic CAS on the spot's state
      serializes the check-and-set. Java objects are not thread-safe by default, and Redis is
      out of single-machine LLD scope.
    ref: "concepts.md#step-6--write-the-code-20-40-min"

  - id: lld-interview-method-021
    difficulty: intermediate
    tags: [extensibility, ocp]
    question: |
      The interviewer asks, "What if we add electric vehicles with charging spots?" Your
      design shines if the answer is:
    options:
      - "I would rewrite ParkingLot, the EntryGate, and the assignment logic to add explicit handling for the new electric case"
      - "I add a boolean isElectric flag to Vehicle and scatter an if-branch through every place that assigns or prices spots"
      - "That is simply not possible without tearing down the current model and redesigning the whole class hierarchy from scratch"
      - "I add an ElectricVehicle type and ElectricSpot; because assignment goes through a strategy interface, I add a new class without editing existing ones"
    answer: 3
    explanation: |
      This is an Open/Closed Principle probe. A strong design absorbs the new feature by
      adding classes behind an existing interface (a new strategy/type) with zero edits to
      existing classes. Rewrites or scattered if-branches indicate the design failed OCP.
    ref: "concepts.md#step-7--discuss-extensibility-and-edge-cases-5-min"

  - id: lld-interview-method-022
    difficulty: intermediate
    tags: [follow-ups, mindset]
    question: |
      How should you view the interviewer's "what if we add X?" follow-up?
    options:
      - "As a deliberate trap engineered by the interviewer to make you stumble and fail the round"
      - "As a clear signal that you got everything wrong so far and ought to scrap it and start over"
      - "As an invitation to prove your design is extensible via the seams you built"
      - "As irrelevant since the core problem is already solved"
    answer: 2
    explanation: |
      The follow-up is the payoff for the interfaces and patterns you set up: it is a chance
      to demonstrate extensibility. If adding the feature means one new class behind an
      existing interface, you nailed it; if it means editing five classes, the design failed
      OCP.
    ref: "concepts.md#step-7--discuss-extensibility-and-edge-cases-5-min"

  - id: lld-interview-method-023
    difficulty: intermediate
    tags: [evaluation, communication]
    question: |
      Two candidates produce equally correct code. One narrates decisions, draws a shared
      diagram, and checks in; the other works in silence. Why does the first usually score
      higher?
    options:
      - "Because narrating your reasoning out loud makes the interviewer's compiler accept the code faster"
      - "Because communication clarity is an explicit scoring dimension and the round is collaborative"
      - "Because silent candidates are always assumed to be memorizing or copying a canonical solution"
      - "They actually do not score higher — in the end only the correctness of the final code is graded"
    answer: 1
    explanation: |
      Communication clarity is one of the explicit evaluation dimensions, and many LLD rounds
      are collaborative — the interviewer is assessing 'would I want to design with this
      person?' A clear communicator with good code often outscores a silent coder with great
      code.
    ref: "concepts.md#how-interviewers-evaluate-you"

  - id: lld-interview-method-024
    difficulty: beginner
    tags: [evaluation, criteria]
    question: |
      Which of these is NOT one of the core dimensions interviewers use to score an LLD round?
    options:
      - "Correctness and completeness against the agreed requirements"
      - "SOLID adherence and clean class structure"
      - "The number of lines of code written"
      - "Communication clarity and handling of follow-ups"
    answer: 2
    explanation: |
      Interviewers score correctness, SOLID/clean structure, pattern judgment, communication,
      and follow-up handling. Raw line count is not a criterion — a concise, well-factored
      design beats a verbose one.
    ref: "concepts.md#how-interviewers-evaluate-you"

  - id: lld-interview-method-025
    difficulty: intermediate
    tags: [pitfalls, anemic-model]
    question: |
      A candidate creates data-only classes with getters/setters and puts all logic in a
      service that reaches into their fields. What smell is this, and what is the fix?
    options:
      - "God class; the fix is to merge every data class and the service into one coordinating class that owns all state"
      - "Over-engineering; the fix is to delete the service layer entirely and let callers read the data classes directly"
      - "Anemic model / feature envy; put behavior with the data it uses (Information Expert)"
      - "Premature optimization; the fix is to add a caching layer in front of the service to hide the extra field lookups"
    answer: 2
    explanation: |
      Data-only classes with logic living elsewhere is the anemic domain model / feature-envy
      smell. The fix is to move behavior next to the data it operates on (GRASP Information
      Expert, Tell-Don't-Ask), giving behavior-rich objects.
    ref: "concepts.md#common-pitfalls"

  - id: lld-interview-method-026
    difficulty: beginner
    tags: [pitfalls, scope]
    question: |
      Which pitfall is directly prevented by Step 1 of the method?
    options:
      - "The monolithic god class that accumulates every responsibility in one place"
      - "Not clarifying scope and building the wrong or unbounded thing"
      - "Over-engineering the design by forcing in far too many patterns for the problem"
      - "Coding the entire round in silence without narrating any decisions"
    answer: 1
    explanation: |
      Step 1 (clarify requirements) directly prevents the 'not clarifying scope' pitfall —
      building the wrong thing or an unbounded thing. God class is prevented by SRP in Step 2,
      over-engineering by disciplined pattern use, and silence by narrating throughout.
    ref: "concepts.md#common-pitfalls"

  - id: lld-interview-method-027
    difficulty: intermediate
    tags: [clarify, questions]
    question: |
      Which set of questions is most valuable to ask in the first five minutes of an LLD
      round?
    options:
      - "What programming language, framework, and CI/CD pipeline does the team use in production for this service?"
      - "What Big-O time and space complexity is expected for each operation, and which inputs dominate the cost?"
      - "Who are the actors, what are the core use-cases, what is out of scope, single-threaded or concurrent?"
      - "Which cloud provider, region, and managed datastore will this system eventually be deployed onto?"
    answer: 2
    explanation: |
      The high-value clarifying checklist covers actors, core use-cases, explicit
      out-of-scope items, and the concurrency/persistence constraints. Tech stack, Big-O, and
      cloud region are not what shapes the class model in this round.
    ref: "concepts.md#step-1--clarify-requirements-5-min"

  - id: lld-interview-method-028
    difficulty: advanced
    tags: [value-objects, modeling]
    question: |
      Modeling monetary amounts as a Money value type instead of a raw double primarily
      signals what to the interviewer?
    options:
      - "Premature optimization aimed at squeezing out arithmetic performance you do not yet need"
      - "Care about correctness (rounding) and domain modeling"
      - "Over-engineering that wastes limited interview time on a needless wrapper type"
      - "A misunderstanding of encapsulation, since wrapping a primitive hides nothing meaningful"
    answer: 1
    explanation: |
      A Money value object prevents floating-point rounding bugs and expresses domain intent —
      a small choice that signals care and correctness, which interviewers probe. It is not
      over-engineering; it is standard good OO modeling for money/time/coordinates.
    ref: "concepts.md#step-2--identify-core-objects-5-min"

  - id: lld-interview-method-029
    difficulty: intermediate
    tags: [creator, relationships]
    question: |
      Deciding whether the EntryGate or the ParkingLot creates the Ticket is an example of
      resolving which concern early?
    options:
      - "Who creates whom — the Creator responsibility"
      - "Which sorting algorithm to use for ordering the tickets by issue time"
      - "Whether to make the Ticket a Singleton so only one instance ever exists"
      - "The database schema and table layout used to persist each issued ticket"
    answer: 0
    explanation: |
      Deciding ownership of object creation is the GRASP Creator responsibility. Resolving it
      during the relationships step prevents tangled dependencies and hints at where a Factory
      may help.
    ref: "concepts.md#step-3--establish-relationships-5-min"

  - id: lld-interview-method-030
    difficulty: advanced
    tags: [patterns, factory]
    question: |
      You have a switch on vehicle type that you expect to grow as new types are added. Which
      pattern localizes that growth, and what benefit do you cite?
    options:
      - "Factory — it centralizes creation so adding a type touches one place"
      - "Observer — so each newly added vehicle type is automatically notified whenever the lot's state changes"
      - "State — so every vehicle type is modeled as a distinct state the parking lot transitions between"
      - "Singleton — so exactly one shared instance of each vehicle type exists across the whole system"
    answer: 0
    explanation: |
      A Factory centralizes conditional/growing object creation. Citing 'adding a new type
      touches one place (the factory) instead of scattered switch statements' shows you
      understand why the pattern helps maintainability.
    ref: "concepts.md#step-5--apply-patterns-ongoing"

  - id: lld-interview-method-031
    difficulty: advanced
    tags: [singleton, trade-offs]
    question: |
      A candidate proposes a Singleton for a shared configuration object. What follow-up
      concerns should they be ready to address?
    options:
      - "Thread-safety of initialization and the testability downsides of global state"
      - "Which sorting algorithm the singleton uses internally to order its configuration keys"
      - "How to shard the singleton's data across a fleet of servers behind a load balancer"
      - "Nothing at all — the Singleton pattern has no meaningful downsides worth discussing"
    answer: 0
    explanation: |
      Interviewers probe Singleton on thread-safe initialization (double-checked locking, enum
      singleton) and its downsides: global mutable state that hurts testability and hides
      dependencies. Use it sparingly and know its trade-offs.
    ref: "concepts.md#step-5--apply-patterns-ongoing"

  - id: lld-interview-method-032
    difficulty: intermediate
    tags: [testability, dependency-injection]
    question: |
      Injecting PricingStrategy (and a Clock) through the ParkingLot constructor primarily
      buys you what?
    options:
      - "Swappability and testability — you can substitute or mock the dependency in tests"
      - "Faster runtime performance, since injected fields resolve more quickly than internally constructed ones"
      - "A smaller memory footprint, because constructor-injected objects are garbage-collected sooner"
      - "Automatic thread-safety, since dependencies passed through the constructor are inherently synchronized"
    answer: 0
    explanation: |
      Constructor injection of interfaces makes dependencies swappable and mockable, so you
      can unit-test pricing in isolation and vary behavior without editing the class. That is
      the seam that makes 'how would you test this?' answerable.
    ref: "concepts.md#step-6--write-the-code-20-40-min"

  - id: lld-interview-method-033
    difficulty: intermediate
    tags: [worked-example, rate-limiter]
    question: |
      In the rate-limiter walkthrough, the interviewer says "make the algorithm pluggable."
      Which design choice directly satisfies this?
    options:
      - "Hard-code the token-bucket refill logic directly inside the RateLimiter class body"
      - "Define a RateLimitStrategy interface and inject a concrete strategy into RateLimiter"
      - "Make RateLimiter a Singleton so a single shared instance governs every algorithm choice"
      - "Store the per-client request counts in an external distributed cache such as Redis"
    answer: 1
    explanation: |
      Pluggable algorithm = Strategy. A RateLimitStrategy interface with concrete
      implementations (token bucket, sliding window) injected into RateLimiter means a new
      algorithm is a new class, leaving RateLimiter closed for modification.
    ref: "concepts.md#a-worked-mini-walkthrough--rate-limiter"

  - id: lld-interview-method-034
    difficulty: advanced
    tags: [worked-example, testability]
    question: |
      In the rate-limiter design, why inject a Clock rather than calling Instant.now()
      directly inside the strategy?
    options:
      - "It is a required GoF pattern that every rate-limiter implementation is expected to include"
      - "To make the limiter distributed by synchronizing time across multiple server nodes"
      - "So time becomes a controllable seam, making the time-based logic testable"
      - "To reduce memory usage by reusing a single shared clock instance instead of many timestamps"
    answer: 2
    explanation: |
      An injected Clock is a testability seam: tests can advance time deterministically to
      verify refill and window logic. It is not itself a named pattern — it is a dependency-
      injection practice that makes time-dependent behavior testable.
    ref: "concepts.md#a-worked-mini-walkthrough--rate-limiter"

  - id: lld-interview-method-035
    difficulty: beginner
    tags: [boundaries, cross-topic]
    question: |
      During an LLD round you want to explain how an LRU cache's doubly-linked-list + hashmap
      internals work in detail. Which concern is that closest to?
    options:
      - "System design — the distributed architecture of a cache tier spread across many nodes"
      - "DSA / data-structure internals — keep the LLD focus on the OO class design"
      - "Requirements clarification — pinning down the actors and scope of the cache up front"
      - "The Singleton pattern — ensuring only one cache instance exists in the whole system"
    answer: 1
    explanation: |
      Deep data-structure internals belong to DSA. In an LLD round you still use the right
      structures, but the focus is the object-oriented class design (interfaces, eviction
      strategy, responsibilities), not re-deriving the data-structure mechanics.
    ref: "concepts.md#common-pitfalls"

  - id: lld-interview-method-036
    difficulty: intermediate
    tags: [diagram, communication]
    question: |
      What is the recommended way to use a class diagram during the round?
    options:
      - "Draw a rough diagram with the interviewer, narrating each relationship and why you chose it"
      - "Skip the diagram entirely and go straight to typing the concrete class implementations"
      - "Draw the complete diagram silently and perfectly first, then start speaking once it is finished"
      - "Only produce the diagram after all the coding is done, purely as after-the-fact documentation"
    answer: 0
    explanation: |
      Draw a rough diagram collaboratively and narrate each arrow ('ParkingLot owns Floors —
      composition, since floors don't exist without the lot'). A narrated shared diagram is a
      communication win and one of the explicit scoring criteria. Perfection and silence both
      waste the opportunity.
    ref: "concepts.md#step-3--establish-relationships-5-min"

  - id: lld-interview-method-037
    difficulty: advanced
    tags: [time-management, prioritization]
    question: |
      With 8 minutes left you have a working park() but exit() and Payment are unwritten. The
      best move is to:
    options:
      - "Silently keep polishing park() until it is flawless, ignoring exit() and Payment since park() is the visible method"
      - "Scrap what you have and start over with a cleaner design, since a fresh model will finish faster than fixing this one"
      - "Say your plan aloud: fully implement exit(), stub Payment behind an interface, and offer to flesh it out if wanted"
      - "Add multithreading with synchronized blocks and a thread pool to impress the interviewer with your concurrency skills"
    answer: 2
    explanation: |
      Visibly managing time is a positive signal. Prioritize the remaining critical method
      (exit), stub the peripheral one (Payment) behind an interface, and communicate the plan.
      Polishing in silence, restarting, or adding out-of-scope threading all waste the clock.
    ref: "concepts.md#step-6--write-the-code-20-40-min"

  - id: lld-interview-method-038
    difficulty: intermediate
    tags: [pruning, yagni]
    question: |
      From the requirements, 'Driver' appears as a noun but the agreed scope only needs a
      driver identifier. What is the right modeling decision for v1?
    options:
      - "Create a full Driver class hierarchy with profile, history, and preferences"
      - "Skip drivers entirely from the model even though they are clearly an actor in the system"
      - "Represent the driver as a simple id (e.g., a String) unless requirements demand more"
      - "Make Driver a Singleton so exactly one shared driver instance coordinates the whole parking lot"
    answer: 2
    explanation: |
      Not every noun deserves a class. Per YAGNI, model the driver as a simple id in v1;
      elaborate only if requirements demand it. Over-modeling wastes limited time. (You still
      acknowledge the driver as an actor — you just don't over-build the class.)
    ref: "concepts.md#step-2--identify-core-objects-5-min"

  - id: lld-interview-method-039
    difficulty: advanced
    tags: [patterns, strategy-vs-switch]
    question: |
      The interviewer asks, "Why a Strategy here instead of a simple if/switch?" What is the
      most honest, senior answer?
    options:
      - "Strategy is always strictly better than a switch in every situation, with no exceptions worth considering"
      - "Because the algorithms vary and are expected to grow; if there were only two fixed cases, a switch would be fine"
      - "Because the Java language does not permit switch statements to branch on object types like vehicle categories"
      - "Because a Strategy dispatch resolves measurably faster at runtime than the branch prediction of a switch"
    answer: 1
    explanation: |
      The honest justification ties the pattern to expected variation and growth (OCP). It
      also concedes the alternative: for a fixed, small number of cases a switch is perfectly
      reasonable. That nuance shows judgment, not dogma.
    ref: "concepts.md#common-interview-follow-ups"

  - id: lld-interview-method-040
    difficulty: beginner
    tags: [method, sequence]
    question: |
      Which ordering reflects the recommended LLD method?
    options:
      - "Write code -> clarify requirements -> draw diagram -> discuss extensibility"
      - "Apply patterns -> write code -> clarify requirements -> identify objects"
      - "Clarify requirements -> identify objects -> establish relationships -> define interfaces -> write code -> discuss extensibility"
      - "Draw diagram -> write code -> clarify requirements -> identify objects"
    answer: 2
    explanation: |
      The method flows: clarify requirements, identify core objects, establish relationships,
      define key interfaces/methods, write code (applying patterns throughout), then discuss
      extensibility and edge cases. Patterns are applied ongoing, not as a first step.
    ref: "concepts.md#the-round-at-a-glance"

  - id: lld-interview-method-041
    difficulty: intermediate
    tags: [framing, opening]
    question: |
      A strong way to open the round right after hearing the prompt is to:
    options:
      - "Announce your plan: clarify scope, sketch classes and relationships, agree the APIs, then code"
      - "Immediately declare which specific GoF patterns you intend to use before hearing any details"
      - "Ask the interviewer to draw the class diagram for you so you can start coding right away"
      - "Begin typing out the first concrete class immediately, without any comment or narration"
    answer: 0
    explanation: |
      Announcing your method up front frames the session and signals process maturity:
      'I'll clarify scope, sketch the classes and relationships, agree the key APIs, then
      code — does that work?' It sets expectations and invites collaboration.
    ref: "concepts.md#the-round-at-a-glance"

  - id: lld-interview-method-042
    difficulty: advanced
    tags: [edge-cases, completeness]
    question: |
      In the final phase, which is the best use of your remaining minutes?
    options:
      - "Rename variables and reformat whitespace for style consistency across all the classes you wrote"
      - "Add every remaining GoF pattern you can recall to demonstrate the full breadth of your pattern knowledge"
      - "Begin designing the database layer with tables, indexes, and a persistence mapping for each entity"
      - "Walk through edge cases (lot full, lost ticket, double-exit), answer extension questions via OCP, and note what you'd test"
    answer: 3
    explanation: |
      The last few minutes demonstrate the design bends without breaking: walk edge cases you
      didn't fully code, answer 'what if we add X?' by pointing at the seams (OCP), and note
      your testing approach. Cosmetic renames, extra patterns, and DB design are low-value here.
    ref: "concepts.md#step-7--discuss-extensibility-and-edge-cases-5-min"

  - id: lld-interview-method-043
    difficulty: intermediate
    tags: [collaboration, feedback]
    question: |
      Midway, the interviewer suggests your Ticket should not hold pricing logic. The best
      response is to:
    options:
      - "Take the feedback gracefully, move pricing to a PricingStrategy, and explain the SRP reasoning"
      - "Defend your original design at length, arguing that keeping pricing inside Ticket is simpler and more cohesive"
      - "Ignore the remark and keep coding, since changing course now would only cost you valuable time"
      - "Ask to restart the whole design from scratch so the pricing concern is separated cleanly from the start"
    answer: 0
    explanation: |
      LLD rounds are collaborative; taking feedback gracefully and acting on it (moving
      pricing out of Ticket to honor SRP) raises your score. Defending a weaker design or
      ignoring the interviewer signals poor collaboration.
    ref: "concepts.md#how-interviewers-evaluate-you"

  - id: lld-interview-method-044
    difficulty: beginner
    tags: [srp, single-responsibility]
    question: |
      A quick heuristic for whether a class has a single responsibility is:
    options:
      - "You can describe its job in one sentence without using the word 'and'"
      - "It has fewer than 100 lines of code, keeping the whole class small enough to fit on one screen"
      - "It implements at least one interface, since abstraction is what guarantees a focused responsibility"
      - "It exposes no public methods, keeping all of its behavior private and therefore single-purpose"
    answer: 0
    explanation: |
      If you cannot state a class's job in one sentence without 'and,' it likely has multiple
      responsibilities and should be split. Line count, interfaces, and method visibility are
      not reliable SRP tests.
    ref: "concepts.md#step-2--identify-core-objects-5-min"

  - id: lld-interview-method-045
    difficulty: advanced
    tags: [state-machine, patterns]
    question: |
      For an order lifecycle (CREATED -> PAID -> SHIPPED -> DELIVERED) where allowed
      transitions and behavior differ per stage, which approach best avoids brittle
      conditionals?
    options:
      - "A single large method with deeply nested if/else branches switching on a status string field"
      - "A Singleton holding the current status so one shared instance tracks the order's stage globally"
      - "The State pattern, with each state controlling valid transitions and behavior"
      - "An Observer that watches the status field and reacts each time the order's stage changes"
    answer: 2
    explanation: |
      A lifecycle with per-stage behavior and transition rules is the State pattern's sweet
      spot: each state object encapsulates its behavior and legal transitions, replacing
      brittle nested conditionals. Singleton and Observer solve different problems.
    ref: "concepts.md#step-5--apply-patterns-ongoing"

  - id: lld-interview-method-046
    difficulty: intermediate
    tags: [boundaries, cross-topic]
    question: |
      In the LLD round you should reference GoF patterns by name but not spend minutes
      re-teaching how each pattern works internally. Why?
    options:
      - "Because design patterns are explicitly forbidden in coding interviews and count against your score"
      - "Because the interviewer has almost certainly never heard of design patterns and would be confused"
      - "Because the round tests recognizing and justifying the pattern for the problem, not lecturing its mechanics"
      - "Because design patterns only ever matter in high-level system design, never in class-level LLD"
    answer: 2
    explanation: |
      The LLD round tests whether you recognize the trigger, name the pattern, and justify it
      for the problem at hand. Re-teaching a pattern's textbook mechanics wastes time; the deep
      mechanics belong to the dedicated design-pattern topics.
    ref: "concepts.md#step-5--apply-patterns-ongoing"

  - id: lld-interview-method-047
    difficulty: advanced
    tags: [liskov, inheritance]
    question: |
      When should you reach for inheritance (is-a) over composition in an LLD design?
    options:
      - "Whenever two classes happen to share any code at all, to avoid duplicating those lines"
      - "Only when there is a genuine subtype relationship that honors Liskov substitution; otherwise prefer composition"
      - "Always, because inheritance maximizes code reuse and should be the default modeling choice"
      - "Never, because inheritance is considered an anti-pattern and is banned in modern object-oriented design"
    answer: 1
    explanation: |
      Use inheritance only for genuine subtypes where a subclass can substitute for its base
      without breaking behavior (Liskov). Sharing code alone is not a reason — that leads to
      fragile hierarchies; prefer composition, which is more flexible.
    ref: "concepts.md#step-3--establish-relationships-5-min"

  - id: lld-interview-method-048
    difficulty: intermediate
    tags: [api-design, collaboration]
    question: |
      After sketching your public API but before implementing, a useful check-in is:
    options:
      - "Does this interface look right to you before I implement it?"
      - "Should I indent this code with tabs or with spaces for the rest of the round?"
      - "Can I skip revisiting the requirements now that I have the interface sketched out?"
      - "Which IDE or code editor do you personally prefer that I use for the coding part?"
    answer: 0
    explanation: |
      Confirming the API before implementing catches misunderstandings early and turns the
      interviewer into a collaborator — exactly the dynamic senior interviewers reward. It
      protects you from implementing the wrong shape.
    ref: "concepts.md#step-4--define-key-interfaces-and-methods-10-min"

  - id: lld-interview-method-049
    difficulty: beginner
    tags: [pitfalls, silence]
    question: |
      A candidate writes completely correct code but says almost nothing the entire round.
      What score impact is most likely?
    options:
      - "Full marks, because the correctness of the final code is the only thing that actually matters"
      - "They lose the communication score, which can drop them below a clearer candidate with merely good code"
      - "Bonus points for focus, since staying quiet shows deep concentration the panel rewards"
      - "No impact whatsoever, since silence and narration are weighted identically by the rubric"
    answer: 1
    explanation: |
      Coding in silence forfeits the communication dimension entirely. Because the round is
      collaborative and communication is explicitly scored, a silent coder often lands below a
      candidate who narrates well with good (not perfect) code.
    ref: "concepts.md#common-pitfalls"

  - id: lld-interview-method-050
    difficulty: advanced
    tags: [worked-example, edge-cases]
    question: |
      In the rate limiter, which is a genuine edge case worth calling out?
    options:
      - "The choice of programming language the limiter is implemented in and its standard library"
      - "The very first request initializing the bucket, clock moving backwards, and a burst at the window boundary"
      - "The color scheme and font of the class diagram you sketch on the whiteboard"
      - "How many physical servers the company owns and how they are racked in the datacenter"
    answer: 1
    explanation: |
      Real rate-limiter edge cases include lazy initialization of a client's bucket on the
      first request, non-monotonic clocks (time going backwards), and bursts straddling a
      window boundary. These show you thought about correctness beyond the happy path.
    ref: "concepts.md#a-worked-mini-walkthrough--rate-limiter"

  - id: lld-interview-method-051
    difficulty: intermediate
    tags: [multiplicity, relationships]
    question: |
      Stating "one ParkingLot to many Floors (1..*)" and "one Ticket to one ParkingSpot"
      during design demonstrates attention to:
    options:
      - "Multiplicity of relationships"
      - "Runtime performance, by minimizing the number of objects allocated per parking event"
      - "Thread safety, by controlling how many threads may touch a floor concurrently"
      - "The Singleton pattern, ensuring only one instance of each related class ever exists"
    answer: 0
    explanation: |
      Declaring how many of one class relate to another (1-to-many, 1-to-1, many-to-many) is
      specifying multiplicity. Saying it out loud shows rigor in modeling the relationships.
    ref: "concepts.md#step-3--establish-relationships-5-min"

  - id: lld-interview-method-052
    difficulty: expert
    tags: [judgment, trade-offs]
    question: |
      An interviewer gives a deliberately open prompt and watches how you decide the depth of
      abstraction. Which behavior best reflects senior judgment?
    options:
      - "Build the most abstract, future-proof design possible with interfaces everywhere, regardless of the stated scope"
      - "Match abstraction to the agreed scope: interfaces at real variation points, simple classes elsewhere, and articulate the trade-off"
      - "Use the fewest classes possible and hard-code every value inline to finish the coding as quickly as you can"
      - "Copy a canonical memorized solution verbatim without adapting it to the specific stated requirements"
    answer: 1
    explanation: |
      Senior judgment is calibrating abstraction to scope: introduce interfaces/strategies
      where requirements said things vary, keep the rest simple, and explain why. Maximal
      abstraction is over-engineering; hard-coding everything forecloses extension; copying
      ignores the actual requirements.
    ref: "concepts.md#step-5--apply-patterns-ongoing"

  - id: lld-interview-method-053
    difficulty: intermediate
    tags: [immutability, modeling]
    question: |
      Making Ticket and Money immutable (final fields, no setters) in your design mainly
      helps because:
    options:
      - "Immutable objects always run measurably faster than mutable ones in every single case"
      - "It prevents accidental state changes, is safer to share (incl. across threads), and reads as careful modeling"
      - "It is required by the Java compiler, which rejects value classes that expose any setter method"
      - "It eliminates the need for any interfaces, since immutable types cannot participate in abstraction"
    answer: 1
    explanation: |
      Immutability for value objects like Ticket/Money prevents accidental mutation, makes
      objects safe to share (helpful under concurrency), and signals careful modeling. It is
      not a compiler requirement and does not replace interfaces.
    ref: "concepts.md#step-6--write-the-code-20-40-min"

  - id: lld-interview-method-054
    difficulty: intermediate
    tags: [follow-ups, srp]
    question: |
      The interviewer remarks, "This class does a lot — is that a problem?" This is most
      likely a probe of your grasp of:
    options:
      - "The Single Responsibility Principle and recognizing a god class"
      - "Big-O time and space complexity of the methods that class exposes"
      - "Network latency introduced by the class making too many remote calls"
      - "The Builder pattern and how to construct that class with many optional fields"
    answer: 0
    explanation: |
      That remark is an SRP probe. The expected response is to recognize the class has taken
      on too many responsibilities (a god class forming) and to split it into focused classes.
    ref: "concepts.md#common-interview-follow-ups"
