topic: "Design a Task Management System"
domain: lld-and-ood
topic_slug: design-task-management
version: 1
questions:
  - id: design-task-management-001
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      In the first five minutes of "Design a Task Management System", which clarifying
      question most changes the object model you will build?
    options:
      - "What font and color theme should the task cards use in the web UI?"
      - "Is the status workflow fixed, or configurable per board?"
      - "Which database vendor and connection pool will store the tasks?"
      - "What is the company's brand logo color in the top navigation bar?"
    answer: 1
    explanation: |
      Whether each board defines its own columns/statuses and legal transitions decides
      whether status is a hard-coded switch or a configurable Workflow object owned by the
      board. That single answer reshapes the core of the design. Fonts, DB vendor, and
      branding do not touch the class model.
    ref: "concepts.md#requirements-clarification"

  - id: design-task-management-002
    difficulty: beginner
    tags: [requirements, hld-vs-lld, boundaries]
    question: |
      The interviewer asks "How do you sync tasks across a million concurrent users in real
      time?" What is the strongest LLD-round response?
    options:
      - "Immediately redesign every class around a CRDT replication engine and a gossip protocol before writing any OO"
      - "Claim a single global synchronized HashMap trivially handles a million concurrent writers with no contention"
      - "Spend fifteen minutes drawing a Kafka topology with partitions, consumer groups, and a schema registry"
      - "Acknowledge it as an HLD concern (event streaming, CRDT/OT, sharding), note the Observer seam is where it plugs in, and keep the design single-process"
    answer: 3
    explanation: |
      The machine-coding round evaluates single-process OO. Naming the distributed answer in
      a sentence and pointing at the seam (the Observer event stream) shows judgment;
      diving into infrastructure burns the round. Real-time collaborative sync is out of scope.
    ref: "concepts.md#requirements-clarification"

  - id: design-task-management-003
    difficulty: beginner
    tags: [scoping, out-of-scope]
    question: |
      Which of these is most appropriate to explicitly declare OUT of scope for a 60-minute
      task-manager LLD round?
    options:
      - "The core Task entity and its status field that every board reads"
      - "Real-time collaborative editing with operational transforms / CRDTs"
      - "Moving a task between columns as a user drags it on the board"
      - "Assigning a task to a specific user who then owns the work"
    answer: 1
    explanation: |
      Collaborative real-time editing (OT/CRDT) is a distributed-systems problem, not
      single-process OO. The other three are core task-manager behaviors you must design.
      Calling the boundary out early keeps the round focused.
    ref: "concepts.md#requirements-clarification"

  - id: design-task-management-004
    difficulty: beginner
    tags: [actors, use-cases]
    question: |
      A user subscribed to a task's changes who is notified but takes no action is best
      modeled as:
    options:
      - "A dedicated subclass of User called WatcherUser with its own login and profile"
      - "A separate top-level actor class with its own identity fields"
      - "A relationship (a watcher list on the task referencing existing Users), not a new subclass"
      - "A single boolean flag isWatcher stored directly on the shared User class"
    answer: 2
    explanation: |
      Watching is a relationship between a User and a Task, not a distinct kind of person. A
      WatcherUser subclass or a global isWatcher flag both break down the moment one user
      watches some tasks and not others. Model it as a watcher list on the task.
    ref: "concepts.md#actors-and-use-cases"

  - id: design-task-management-005
    difficulty: beginner
    tags: [actors, roles]
    question: |
      What distinguishes a Project Admin from a regular Member in the actor analysis?
    options:
      - "The admin can configure the board's columns/statuses and transition rules; a member cannot"
      - "The admin is a different physical person who never creates or is assigned any tasks"
      - "Only the admin is allowed to be assigned tasks, while members may only comment on them"
      - "The member has no identity fields and cannot be referenced as an assignee at all"
    answer: 0
    explanation: |
      Admins do everything members do plus workflow/board configuration and sprint
      management. That extra capability is the distinction, which suggests role-based
      behavior (or permission checks) rather than entirely separate identities.
    ref: "concepts.md#actors-and-use-cases"

  - id: design-task-management-006
    difficulty: intermediate
    tags: [noun-verb, method, priority]
    question: |
      During noun/verb extraction you list "Priority" as a candidate. Should Priority become
      its own class?
    options:
      - "Yes, always create a dedicated class for every noun found anywhere in the requirements text"
      - "Yes, because priorities change frequently at runtime and each needs its own behavior methods"
      - "No, it should be a free-form String field that callers set to any label they like"
      - "No, it is a fixed vocabulary with no behavior of its own, so an enum is the right model"
    answer: 3
    explanation: |
      The filter step is the point of noun extraction: not every noun is a class. Priority is
      a small fixed set (LOW..CRITICAL) with no distinct behavior, so an enum captures it
      precisely. Over-classing fixed vocabularies is the classic junior mistake; a free String
      allows invalid values.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-task-management-007
    difficulty: intermediate
    tags: [noun-verb, method, assignee]
    question: |
      "Assignee" appears as a noun in the requirements. The best modeling verdict is:
    options:
      - "A new Assignee class holding its own duplicated name and email identity fields"
      - "A subclass of Task named AssignedTask that adds the assignee's details"
      - "An enum whose constants are the possible assignees on the board"
      - "A reference to a User (assignee is a role a User plays on a Task), not a new class"
    answer: 3
    explanation: |
      Assignee is a role a User plays with respect to a task, not a separate kind of entity.
      Modeling it as a User reference avoids duplicating identity fields and lets the same
      person be assignee on one task and reporter on another.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-task-management-008
    difficulty: intermediate
    tags: [noun-verb, method, dependency]
    question: |
      A "dependency" (task A blocks task B) is best represented as:
    options:
      - "A heavyweight Dependency entity with its own lifecycle and status"
      - "A subtask of task B that decomposes B into a smaller child unit of work"
      - "A directed edge between tasks (adjacency stored as blockedBy/blocks sets)"
      - "A single field on the Board listing every dependency across all tasks"
    answer: 2
    explanation: |
      A dependency is a relationship (edge) between two tasks that may live in different
      projects, not an owned object with behavior. Storing it as adjacency lets you run cycle
      detection and topological sort. It is not a subtask (which decomposes one piece of work).
    ref: "concepts.md#nounverb-object-identification"

  - id: design-task-management-009
    difficulty: intermediate
    tags: [noun-verb, method, filter]
    question: |
      Which mapping from requirement-verbs to methods is correct?
    options:
      - "\"move task\" maps to a Board field holding the column name, not to any method"
      - "\"block / depend on\" maps to addDependency; \"move / transition\" maps to transitionTo"
      - "\"comment\" maps to a new Comment subclass of User that stores the message text"
      - "\"sort\" maps to a private mutable field on Task that caches the row position"
    answer: 1
    explanation: |
      Verbs become methods: moving/transitioning a task is transitionTo(Status); declaring a
      block is addDependency(task). Sorting is a strategy applied at the board, and commenting
      creates a Comment owned by the task, not a User subclass.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-task-management-010
    difficulty: beginner
    tags: [composite, subtasks, pattern]
    question: |
      A Task can contain subtasks, and you want to call getEstimate() on either a single task
      or a parent-with-children and get a correct total. Which pattern fits?
    options:
      - "Composite"
      - "Singleton"
      - "Adapter"
      - "Proxy"
    answer: 0
    explanation: |
      Composite lets clients treat individual objects (leaf tasks) and compositions of objects
      (parent tasks with children) uniformly. Task implements a TaskComponent interface, and
      getEstimate() on a parent recursively sums its children. See dp-composite.
    ref: "concepts.md#task-hierarchy-and-dependencies"

  - id: design-task-management-011
    difficulty: intermediate
    tags: [composite, relationships, deletion]
    question: |
      The relationship between a Task and its subtasks is best drawn as composition (Task *--
      Task) because:
    options:
      - "Subtasks are stored in a separate database table joined by a foreign key"
      - "Subtasks are always assigned to the same user who owns the parent task"
      - "Composition dereferences faster than aggregation because it inlines the child objects"
      - "Deleting a parent task should delete its subtasks — they have no independent existence"
    answer: 3
    explanation: |
      Composition denotes ownership with a shared lifetime: a subtask exists only as part of
      its parent, so deleting the parent cascades to its children. That lifetime dependency,
      not storage or performance, is what distinguishes composition from aggregation.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-task-management-012
    difficulty: intermediate
    tags: [aggregation, relationships, column]
    question: |
      Why is the Column-to-Task relationship modeled as aggregation (Column o-- Task) rather
      than composition?
    options:
      - "Because tasks are immutable value objects with no identity of their own"
      - "Because deleting a column must not delete its tasks — they move to another column and outlive the column"
      - "Because a column can hold at most one task at a time by design"
      - "Because aggregation uses less heap memory than composition per reference"
    answer: 1
    explanation: |
      Tasks outlive the column that references them: dragging a task to another column, or
      deleting a column, must not destroy the tasks. That independent lifetime is aggregation.
      Composition would wrongly imply tasks die with the column.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-task-management-013
    difficulty: intermediate
    tags: [workflow, state, configurability]
    question: |
      To keep the status workflow configurable per board without changing code, the legal
      transitions should live:
    options:
      - "In a hard-coded switch statement inside Task.transitionTo recompiled per release"
      - "As boolean flags isTodo, isDone on each task, toggled directly by callers"
      - "In a Workflow object owned by the Board (a Map<Status, Set<Status>>)"
      - "In the Status enum's constructor, hard-wired identically for every board"
    answer: 2
    explanation: |
      Storing allowed transitions in a per-board Workflow object means a Kanban board and a
      dev board simply get different Workflow instances — Open/Closed, no code change. A
      hard-coded switch or enum-embedded rules force identical behavior on every board.
    ref: "concepts.md#task-status-workflow"

  - id: design-task-management-014
    difficulty: advanced
    tags: [state, pattern, trade-off]
    question: |
      You start with a Map-based Workflow for transition validation. When is upgrading to the
      full State pattern (one class per status) justified?
    options:
      - "Never — a transition map is always sufficient regardless of per-state behavior"
      - "When each status must carry distinct behavior (e.g., IN_REVIEW auto-assigns a reviewer, BLOCKED freezes edits)"
      - "As soon as the workflow contains more than three distinct statuses total"
      - "Only when the team writes the service in Kotlin rather than plain Java"
    answer: 1
    explanation: |
      A transition map handles pure legality checks cheaply. The State pattern earns its extra
      classes only when each state has its own behavior beyond "which moves are legal" — then a
      class per state encapsulates that behavior and its transitions. See dp-state.
    ref: "concepts.md#task-status-workflow"

  - id: design-task-management-015
    difficulty: intermediate
    tags: [state, invariant, done]
    question: |
      Where should the rule "a task cannot move to DONE while it has incomplete subtasks or
      unmet blocking dependencies" be enforced?
    options:
      - "In the UI layer only, by disabling the Done button when subtasks remain"
      - "Nowhere — trust users and the client app not to attempt the illegal move"
      - "As a guard inside transitionTo, the single mutator of status"
      - "In each observer's onEvent method, rejecting the change after it fires"
    answer: 2
    explanation: |
      Invariants belong in the domain, at the single choke point that mutates status.
      Enforcing it in transitionTo guarantees no code path (UI, API, batch job) can bypass it.
      A UI-only check is trivially circumvented; observers run after the change, too late.
    ref: "concepts.md#code-skeleton"

  - id: design-task-management-016
    difficulty: intermediate
    tags: [observer, notifications, pattern]
    question: |
      On every task change you must notify the assignee and all watchers, and tomorrow maybe an
      analytics sink. Which pattern, and what does the Task know about its listeners?
    options:
      - "Strategy; the Task hard-references each listener's concrete class to call it"
      - "Command; the Task stores every listener's email address and dispatches directly"
      - "Decorator; the Task wraps each listener in a chain that mutates the event"
      - "Observer; the Task knows THAT it has observers but never WHO they are"
    answer: 3
    explanation: |
      Observer decouples the subject (Task) from its listeners: the Task fires an event to a
      list of observers without knowing their concrete types. Adding a Slack or analytics
      listener registers a new observer and touches zero Task code. See dp-observer.
    ref: "concepts.md#key-design-decisions"

  - id: design-task-management-017
    difficulty: intermediate
    tags: [observer, single-point, correctness]
    question: |
      Why route the observer fan-out through transitionTo rather than calling notify() from
      every place that changes a task?
    options:
      - "It makes the code longer overall, which looks more thorough to the interviewer"
      - "It avoids using interfaces, so the design needs no abstraction at all"
      - "It lets registered observers rewrite the board's legal transition rules on the fly"
      - "It creates a single choke point, so no code path can forget to notify"
    answer: 3
    explanation: |
      A single mutator that both validates the transition and fires observers guarantees every
      status change notifies listeners — you cannot add a new code path that silently skips
      notifications. Scattered notify() calls inevitably get forgotten on some path.
    ref: "concepts.md#code-skeleton"

  - id: design-task-management-018
    difficulty: intermediate
    tags: [strategy, sorting, pattern]
    question: |
      A board must sort by priority, due date, or created time, and these rules change over
      time. The cleanest design is:
    options:
      - "A giant if/else chain switching on a sortMode string buried inside the Board"
      - "Hard-coding the priority sort and silently ignoring the due-date and created-time orders"
      - "Storing separate pre-sorted copies of the list for every possible ordering"
      - "A TaskSortStrategy interface with pluggable implementations passed to board()"
    answer: 3
    explanation: |
      Strategy encapsulates each sort rule behind a common interface; new sorts are added as
      classes/lambdas without modifying the board (Open/Closed), and each is independently
      testable. An if/else chain grows and must be re-tested on every change. See dp-strategy.
    ref: "concepts.md#key-design-decisions"

  - id: design-task-management-019
    difficulty: intermediate
    tags: [command, audit, undo, pattern]
    question: |
      The interviewer adds: "log every action and support undo of the last action." Which
      pattern most directly satisfies both?
    options:
      - "Observer — listeners record each action after it fires and can replay them in reverse to undo"
      - "Composite — actions nest inside each other, so undoing collapses the whole action tree at once"
      - "Command — each action is an object with execute() and undo(); the history is the audit log and an undo stack"
      - "Singleton — one global action object that holds the current command and rewinds itself on undo"
    answer: 2
    explanation: |
      Command reifies each action as an object carrying enough state to execute() and undo().
      The list of executed commands is the activity log, and a stack of them provides undo.
      See dp-command.
    ref: "concepts.md#key-design-decisions"

  - id: design-task-management-020
    difficulty: intermediate
    tags: [factory, creation, pattern]
    question: |
      Creating a "bug", a "story", and an "epic" each set different default fields. To keep
      callers from doing new Task(...) and hand-populating divergent defaults, use:
    options:
      - "A Prototype clone of a random existing task"
      - "Public setters and hope callers remember the defaults"
      - "A separate top-level class per type with no shared code"
      - "A TaskFactory that centralizes type-specific creation"
    answer: 3
    explanation: |
      Factory Method centralizes construction logic so type-specific defaults live in one place
      and callers request a task by type rather than assembling it. This prevents inconsistent
      initialization scattered across call sites. See dp-factory-method.
    ref: "concepts.md#key-design-decisions"

  - id: design-task-management-021
    difficulty: advanced
    tags: [concurrency, optimistic-locking, versioning]
    question: |
      Two users load the same task at version 5 and both save their edits. With naive
      last-write-wins, one user's changes vanish. The standard LLD fix is:
    options:
      - "A global mutex on the entire board that every edit must acquire first, forcing all writers and even readers to serialize"
      - "Ignore the problem entirely, assuming simultaneous edits to the same task are so rare the occasional lost update is fine"
      - "Give every user their own private, permanently forked copy of the task so edits never collide, abandoning a shared source of truth"
      - "Optimistic versioning: each save carries the base version; the second save sees a bumped version and gets OptimisticLockException to retry/merge"
    answer: 3
    explanation: |
      Optimistic concurrency uses a version token: the first save advances it; the second
      save's stale base version no longer matches, so it is rejected for retry/merge. On a
      read-heavy board this beats coarse locking, which serializes even readers. See
      concurrency-in-lld.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-task-management-022
    difficulty: advanced
    tags: [concurrency, state-machine, race]
    question: |
      Two threads call transitionTo on the same task concurrently. Given transitionTo is
      synchronized and validates against the current status, what happens?
    options:
      - "Both transitions apply, possibly leaving an impossible state"
      - "The two threads deadlock, each blocking forever waiting for the lock"
      - "Exactly one wins; the loser's precondition no longer holds and it throws"
      - "The status field ends up corrupted and null once both writes interleave"
    answer: 2
    explanation: |
      Because the single synchronized mutator re-checks the current status, only one
      transition can validly apply; the second observes the already-changed status, fails its
      legality check, and throws. The guarded state machine is itself the concurrency guard —
      this is why booleans lose to an explicit state machine.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-task-management-023
    difficulty: advanced
    tags: [dependencies, cycle-detection, dag]
    question: |
      A user tries to add "A blocks B" when B already transitively blocks A. The correct
      behavior is:
    options:
      - "Silently allow the new edge and hope nobody ever calls executionOrder"
      - "Detect the cycle (e.g., DFS) at addDependency and reject with CyclicDependencyException"
      - "Automatically convert task A into a subtask of B so the edge collapses"
      - "Automatically delete task A so the offending back-edge disappears"
    answer: 1
    explanation: |
      The dependency graph must stay acyclic so topological ordering terminates. Detecting the
      cycle at insertion time (DFS/coloring) and rejecting the edge preserves the DAG
      invariant. Allowing cycles breaks executionOrder; the other options corrupt the model.
    ref: "concepts.md#task-hierarchy-and-dependencies"

  - id: design-task-management-024
    difficulty: advanced
    tags: [dependencies, topological-sort, dsa-cross-ref]
    question: |
      To produce a valid order in which to work tasks given their blocks/blocked-by edges, you
      apply:
    options:
      - "Binary search over the sorted task ids to locate each blocker"
      - "Topological sort (Kahn's algorithm or DFS) over the dependency DAG"
      - "Quicksort the tasks by their priority field to order them"
      - "A breadth-first shortest-path search from the root task"
    answer: 1
    explanation: |
      Ordering tasks so every blocker precedes the tasks it blocks is exactly topological sort
      over the directed acyclic dependency graph. It is a dsa-coding primitive — you name it
      and call it, not re-derive it, in an LLD round.
    ref: "concepts.md#task-hierarchy-and-dependencies"

  - id: design-task-management-025
    difficulty: intermediate
    tags: [composite, dependency, distinction]
    question: |
      Which statement correctly distinguishes subtasks from dependencies?
    options:
      - "They are the same underlying relationship, just given two different names by convention"
      - "Dependencies are owned by and cascade-delete with their parent, while subtasks are fully independent"
      - "Subtasks form a containment tree (ownership); dependencies form a DAG of independent tasks (edges, no ownership)"
      - "Both must always live inside the same project and can never cross a project boundary"
    answer: 2
    explanation: |
      Subtasks decompose one piece of work and are owned by their parent (composition, tree).
      Dependencies sequence independent tasks that may live in different projects (edges in a
      DAG, no ownership). Conflating them breaks deletion semantics and ordering.
    ref: "concepts.md#task-hierarchy-and-dependencies"

  - id: design-task-management-026
    difficulty: intermediate
    tags: [srp, responsibilities, god-class]
    question: |
      A candidate puts task CRUD, workflow validation, notification delivery, sorting, and
      persistence all inside one Task class. Which principle is most violated?
    options:
      - "Liskov Substitution Principle"
      - "Interface Segregation Principle"
      - "Single Responsibility Principle"
      - "Dependency Inversion Principle"
    answer: 2
    explanation: |
      A class with many unrelated reasons to change (workflow rules, delivery channels, sort
      logic, storage) violates SRP. Splitting into Task, Workflow, NotificationService,
      SortStrategy, and a repository gives each a single responsibility.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-task-management-027
    difficulty: intermediate
    tags: [ocp, extensibility, status]
    question: |
      Adding a new IN_QA status to one board's workflow should ideally require:
    options:
      - "One new enum value plus transition configuration on that board's Workflow — no logic change"
      - "Rewriting Task.transitionTo to add fresh if-branches handling the new status"
      - "A brand-new subclass of Board dedicated to boards that use the QA status"
      - "Updating every registered observer to recognize and handle the new status"
    answer: 0
    explanation: |
      Because legality lives in per-board Workflow data, adding IN_QA is configuration plus one
      enum value; transitionTo, observers, and other boards are untouched. That is the
      Open/Closed payoff of externalizing the transition rules.
    ref: "concepts.md#extensibility"

  - id: design-task-management-028
    difficulty: intermediate
    tags: [dip, injection, testing]
    question: |
      Why prefer constructor-injecting the Workflow, sort strategy, and notification channel
      into the service rather than hard-coding getInstance() singletons?
    options:
      - "It lets tests substitute fakes and follows Dependency Inversion, depending on abstractions"
      - "Constructor injection is mandated by the Java language spec for collaborator fields"
      - "Singleton instances simply cannot be created at all in the Java runtime"
      - "It deliberately makes the service class impossible to instantiate without a framework"
    answer: 0
    explanation: |
      Depending on injected abstractions (DIP) lets tests pass fakes/mocks and lets the same
      service run with different collaborators. Hard getInstance() couples the service to
      concrete globals and makes isolation testing painful.
    ref: "concepts.md#key-design-decisions"

  - id: design-task-management-029
    difficulty: intermediate
    tags: [immutability, comment, ownership]
    question: |
      Deleting a Task should cascade to its Comments but must NOT delete the assignee User.
      This is because:
    options:
      - "Comments are composed by the task (die with it); the assignee is only referenced (association) and outlives the task"
      - "Comments are aggregated by the task while the assignee User is composed and owned by it"
      - "Users are immutable value objects with no identity, whereas comments are full entities"
      - "Both the comments and the assignee User should always be deleted together with the task"
    answer: 0
    explanation: |
      Comments have no existence outside their task (composition, cascade delete). The assignee
      is an independent User merely referenced by the task (association), so it must survive the
      task's deletion. Matching lifetime to relationship kind is the point.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-task-management-030
    difficulty: advanced
    tags: [concurrency, observer, collection]
    question: |
      A watcher unsubscribes while a status-change event is fanning out to the watcher list.
      Which choice prevents a ConcurrentModificationException?
    options:
      - "Use a plain ArrayList for watchers and hope the iteration and unsubscribe timing never overlap"
      - "Make each observer's onEvent method synchronized on the User being notified"
      - "Iterate over a CopyOnWriteArrayList (or a snapshot copy) of watchers"
      - "Remove all watchers up front before firing, then re-add the survivors afterward"
    answer: 2
    explanation: |
      Firing events while the observer collection mutates is a classic concurrent-modification
      hazard. A CopyOnWriteArrayList (or iterating a snapshot) lets the fan-out proceed over a
      stable view while unsubscribes happen safely. A plain ArrayList risks the exception.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-task-management-031
    difficulty: intermediate
    tags: [class-diagram, relationships, uml]
    question: |
      In the class diagram, which UML arrow correctly expresses "Board owns exactly one
      configurable Workflow that dies with it"?
    options:
      - "Board o-- Workflow (aggregation)"
      - "Board ..|> Workflow (realization)"
      - "Board *-- Workflow (composition)"
      - "Board --|> Workflow (inheritance)"
    answer: 2
    explanation: |
      A board owns its workflow, and the workflow has no meaning without the board — a shared
      lifetime, which is composition (filled diamond, *--). Aggregation would imply the
      workflow outlives the board; realization/inheritance are wrong relationship kinds entirely.
    ref: "concepts.md#class-diagram"

  - id: design-task-management-032
    difficulty: beginner
    tags: [class-diagram, uml, notation]
    question: |
      Which UML arrow denotes that NotificationService realizes (implements) the TaskObserver
      interface?
    options:
      - "TaskObserver <|.. NotificationService"
      - "TaskObserver <|-- NotificationService"
      - "TaskObserver *-- NotificationService"
      - "TaskObserver --> NotificationService"
    answer: 0
    explanation: |
      Realization (a class implementing an interface) uses a dashed line with a hollow triangle:
      <|.. in Mermaid. A solid hollow triangle (<|--) is class inheritance; *-- is composition;
      --> is a plain association/dependency.
    ref: "concepts.md#class-diagram"

  - id: design-task-management-033
    difficulty: intermediate
    tags: [workflow, blocked, dependencies]
    question: |
      When is it correct for a task to be in the BLOCKED status?
    options:
      - "Whenever it has any subtasks attached, regardless of their completion state"
      - "Only when its due date has passed and the task is now considered overdue"
      - "When at least one of its blockedBy tasks is not yet DONE"
      - "When it has accumulated more than three watchers subscribed to its changes"
    answer: 2
    explanation: |
      BLOCKED reflects that a dependency (a task in its blockedBy set) is unresolved — the work
      cannot proceed until that blocker reaches DONE. Subtasks, due dates, and watcher counts
      are unrelated to the blocked condition.
    ref: "concepts.md#task-hierarchy-and-dependencies"

  - id: design-task-management-034
    difficulty: intermediate
    tags: [edge-cases, column-deletion]
    question: |
      A user deletes a column that still contains tasks. The safest design behavior is:
    options:
      - "Forbid deleting a non-empty column, or require a target column to move the tasks to"
      - "Silently delete every task in the column along with the column itself"
      - "Move the orphaned tasks to some arbitrarily chosen other project on the board"
      - "Convert each contained task into a subtask of the column being removed"
    answer: 0
    explanation: |
      Because tasks are aggregated (they outlive the column), deleting a column must not orphan
      or destroy them. Refusing deletion of a non-empty column, or forcing a move target,
      preserves the tasks. Silent deletion loses data.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-task-management-035
    difficulty: intermediate
    tags: [strategy, filter, extensibility]
    question: |
      Filtering a board is modeled as a Predicate<Task> passed into board(...). What is the
      main benefit when a new "filter by label" requirement arrives?
    options:
      - "The board() signature must gain a new boolean parameter for the label filter"
      - "Every existing filter has to be re-implemented to stay compatible with the new one"
      - "A new filter is just a new predicate/lambda; board() and existing filters are untouched"
      - "The Task class must add a dedicated new field to support each additional filter"
    answer: 2
    explanation: |
      Passing behavior as a predicate makes new filters additive: you supply a new lambda
      without touching the board method or existing filters (Open/Closed). Boolean-flag
      signatures grow with every new option and force re-testing.
    ref: "concepts.md#extensibility"

  - id: design-task-management-036
    difficulty: intermediate
    tags: [sprint, extensibility, agile]
    question: |
      Adding sprints (time-boxed sets of tasks) to the existing design is low-impact mainly
      because:
    options:
      - "Sprints replace the Task class entirely with a new time-boxed unit of work"
      - "Sprints require rewriting the workflow engine to add sprint-specific transitions"
      - "A Sprint just aggregates a set of tasks; tasks already key off status, so downstream logic is unchanged"
      - "Sprints eliminate the need for boards, since tasks now live inside the sprint"
    answer: 2
    explanation: |
      A Sprint is an aggregation of existing tasks with a start/end window; incomplete tasks
      roll to the backlog at sprint end. Because the rest of the system already reacts to task
      status, adding sprints does not disturb the workflow, hierarchy, or notification code.
    ref: "concepts.md#extensibility"

  - id: design-task-management-037
    difficulty: intermediate
    tags: [time-tracking, observer, extensibility]
    question: |
      To add burn-down/time-tracking analytics without modifying the Task class, you would:
    options:
      - "Register an AnalyticsObserver implementing TaskObserver that accumulates metrics off existing events"
      - "Add burn-down accumulation logic directly inside Task.transitionTo, editing the core mutator itself"
      - "Stash the running burn-down counters inside the per-board Workflow transition map beside the edges"
      - "Create an AnalyticsTask subclass of Task overriding its methods to record metrics on each change"
    answer: 0
    explanation: |
      The event stream that already powers notifications is the natural feed for analytics: a
      new observer accumulates burn-down and cycle-time off the same events, adding zero code to
      Task. This is the Observer seam paying off again.
    ref: "concepts.md#extensibility"

  - id: design-task-management-038
    difficulty: advanced
    tags: [command, undo, redo]
    question: |
      Given the Command-based action model, adding redo (after undo) requires:
    options:
      - "A redo stack mirroring the undo stack — undone commands move to redo, redo re-executes them"
      - "Rewriting every task, comment, and board entity to be fully immutable and copy-on-write first"
      - "Converting each Command object into a TaskObserver that replays itself when the event refires"
      - "Discarding the activity log entirely, since redo and the audit trail cannot coexist together"
    answer: 0
    explanation: |
      Since each Command already supports execute()/undo(), redo is just a second stack: undoing
      pops from the undo stack and pushes onto redo; redo pops from redo and re-executes. The
      Command abstraction makes both operations symmetric and cheap to add.
    ref: "concepts.md#extensibility"

  - id: design-task-management-039
    difficulty: intermediate
    tags: [api, signatures, actor]
    question: |
      Why does moveTask(String taskId, Status to, User actor) take the actor parameter?
    options:
      - "Purely to satisfy the compiler, which rejects any three-argument mutator that omits a User"
      - "The activity log and permission checks need to record WHO performed the transition"
      - "Because a Status value is invalid unless it is paired with the User who defined that status"
      - "So the task can be automatically renamed to include the actor's display name after the move"
    answer: 1
    explanation: |
      Auditing and authorization both need the acting user: the activity log records who moved
      the task, and permission rules may gate the move. Threading the actor through the mutator
      keeps that information at the single choke point rather than reconstructing it later.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-task-management-040
    difficulty: intermediate
    tags: [api, exceptions, dependencies]
    question: |
      What should addDependency(taskId, blockedByTaskId) do when the new edge would create a
      cycle?
    options:
      - "Return null quietly and leave the dependency graph in its current unchanged state"
      - "Throw CyclicDependencyException so the caller must handle the reject"
      - "Silently swap the two task ids so the edge points the other, non-cyclic direction instead"
      - "Add the edge anyway and log a warning, deferring cycle handling to the executionOrder call"
    answer: 1
    explanation: |
      A cyclic dependency is an invalid state that would break topological ordering, so the
      operation must fail loudly with a typed exception the caller handles. Silent nulls or
      logging-and-continuing let the DAG invariant rot undetected.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-task-management-041
    difficulty: beginner
    tags: [enum, status, modeling]
    question: |
      Modeling Status as an enum (rather than a free-form String) primarily gives you:
    options:
      - "Faster network calls, because enum ordinals are serialized in fewer bytes than status strings"
      - "The ability to attach new status-handling behavior methods directly onto the Board at runtime"
      - "Automatic persistence, since the ORM saves and reloads enum-typed fields with no mapping needed"
      - "A closed, type-safe vocabulary that prevents invalid values like \"in-progres\""
    answer: 3
    explanation: |
      An enum constrains status to a known, compile-time-checked set, eliminating typo-driven
      invalid states that a String would allow. Combined with the Workflow map, it makes both
      the values and the transitions between them explicit and safe.
    ref: "concepts.md#task-status-workflow"

  - id: design-task-management-042
    difficulty: advanced
    tags: [concurrency, subtasks, invariant]
    question: |
      A parent task is being moved to DONE at the same moment a subtask is reopened. How does
      the design keep the "no DONE with open subtasks" invariant safe?
    options:
      - "It doesn't; a parent DONE with an open subtask is an explicitly permitted transient state"
      - "transitionTo checks subtask completion inside its synchronized guard, so the move to DONE fails if a subtask is not complete at that moment"
      - "Subtasks are frozen at creation and can never be reopened, so the race can never arise"
      - "The UI disables the Done button whenever any subtask is still open, blocking the move"
    answer: 1
    explanation: |
      The completion check lives inside the synchronized transitionTo guard, evaluated against
      current subtask state. If a subtask is incomplete when the parent's move is validated, the
      transition throws. Enforcing the invariant at the guarded mutator, not the UI, keeps it correct under races.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-task-management-043
    difficulty: intermediate
    tags: [label, relationships, aggregation]
    question: |
      A Label (name + color) is applied to many tasks and reused across the board. The
      Task-to-Label relationship is best modeled as:
    options:
      - "Composition — each task owns its own private Label copy that is deleted with the task"
      - "Aggregation/association (many-to-many) — labels are shared and outlive any single task"
      - "A subtask relationship — each label is a child work-item decomposed under its parent task"
      - "Inheritance — Task extends Label so every task is a specialized kind of colored label"
    answer: 1
    explanation: |
      Labels are shared value objects referenced by many tasks and independent of any one task's
      lifetime, so the relationship is aggregation/association (many-to-many). Composition would
      wrongly duplicate a private label per task and lose sharing.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-task-management-044
    difficulty: advanced
    tags: [method, crc, responsibility]
    question: |
      In CRC terms, what is the Board's core responsibility?
    options:
      - "To store user credentials and run the login and authentication flow for every board member"
      - "To compute the topological execution order of the dependency graph across all its tasks"
      - "To hold ordered columns and the workflow, and coordinate moving/sorting tasks across columns"
      - "To render and deliver email notifications to each watcher whenever a task on it changes"
    answer: 2
    explanation: |
      A Board knows its ordered columns and its Workflow and does the moving/sorting of tasks
      among columns. Notification delivery belongs to NotificationService, and dependency
      ordering is a graph operation — assigning each class one clear responsibility is the CRC exercise.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-task-management-045
    difficulty: intermediate
    tags: [method, design-process, order]
    question: |
      Following the LLD method for this problem, which sequence of steps is correct?
    options:
      - "Write the code first, then reverse-engineer the requirements from it, then draw a diagram last"
      - "Clarify requirements, identify actors/use-cases, extract nouns/verbs, assign responsibilities, draw the class diagram, then choose patterns"
      - "Start by designing the normalized database schema, then derive the classes from its tables"
      - "Pick the design patterns first, then reshape and force the classes to fit those patterns"
    answer: 1
    explanation: |
      The disciplined flow is requirements to actors/use-cases to noun/verb object identification
      to responsibilities/relationships to class diagram to pattern selection to code. Patterns
      serve the design; choosing them first (pattern-driven design) leads to over-engineering.
      See lld-interview-method.
    ref: "concepts.md#actors-and-use-cases"

  - id: design-task-management-046
    difficulty: advanced
    tags: [state, boolean-flags, anti-pattern]
    question: |
      Why is modeling task status with separate booleans (isTodo, isInProgress, isDone,
      isBlocked) inferior to a Status enum plus a Workflow?
    options:
      - "Four separate boolean fields consume noticeably more heap per task than one enum reference"
      - "Booleans allow contradictory combinations (e.g., isDone and isBlocked both true) and scatter transition logic; an enum plus workflow makes illegal states unrepresentable and centralizes rules"
      - "Reading four boolean fields is measurably slower at runtime than reading a single enum value"
      - "Enum-typed fields cannot be persisted by standard ORMs, whereas boolean columns always can"
    answer: 1
    explanation: |
      Independent booleans can encode impossible states and force every mutation site to keep
      them consistent. A single Status enum makes a task be in exactly one state, and the
      Workflow centralizes which transitions are legal — illegal states become unrepresentable.
    ref: "concepts.md#task-status-workflow"

  - id: design-task-management-047
    difficulty: intermediate
    tags: [notification, strategy, channel]
    question: |
      The notification DELIVERY mechanism (email vs. push vs. Slack) is best modeled as:
    options:
      - "A NotificationChannel strategy injected into NotificationService, so channels swap without changing the observer"
      - "A hard-coded SMTP email send call written directly inside the NotificationService observer body"
      - "A Channel enum carrying no behavior, with a switch on it re-checked at every send site"
      - "A dedicated subclass of Task per delivery channel — EmailTask, PushTask, SlackTask, and so on"
    answer: 0
    explanation: |
      Delivery is an interchangeable algorithm, so a NotificationChannel Strategy lets you add or
      swap channels (email, push, Slack) without modifying the observer that decides WHAT to send.
      Hard-coding email couples the observer to one channel. See dp-strategy.
    ref: "concepts.md#key-design-decisions"

  - id: design-task-management-048
    difficulty: advanced
    tags: [dsa-cross-ref, boundaries, ordering]
    question: |
      In the LLD round, when the design needs topological ordering and cycle detection for
      dependencies, the right level of detail is to:
    options:
      - "Re-derive Kahn's algorithm on the whiteboard step by step, tracing in-degree counts by hand"
      - "Implement a bespoke embedded graph database to store and traverse the dependency edges"
      - "Name topological sort / DFS cycle detection as the technique and call it, keeping focus on the OO design (dsa-coding owns the internals)"
      - "Skip dependencies entirely, declaring that any graph structure is out of scope for LLD rounds"
    answer: 2
    explanation: |
      dsa-coding owns algorithm internals; the LLD round wants you to recognize that ordering is
      topological sort and cycle checks are DFS, name them, and integrate them behind clean
      methods (executionOrder, addDependency) — not spend the round re-deriving the algorithm.
    ref: "concepts.md#task-hierarchy-and-dependencies"
