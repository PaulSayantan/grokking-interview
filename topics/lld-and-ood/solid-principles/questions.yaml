topic: "SOLID Principles Deep Dive"
domain: lld-and-ood
topic_slug: solid-principles
version: 1
questions:
  - id: solid-principles-001
    difficulty: beginner
    tags: [solid, overview, design-reasoning]
    question: |
      What single underlying goal do all five SOLID principles serve?
    options:
      - "Reducing the total number of lines of code in a system"
      - "Maximizing runtime performance of object allocation"
      - "Localizing change so a new requirement touches few, obvious classes"
      - "Guaranteeing thread safety across the object graph"
    answer: 2
    explanation: |
      SOLID exists to make change cheap and local. Bad design shows up as rigidity
      (one change cascades), fragility (a change breaks unrelated code), and immobility
      (a class can't be reused because of dependencies). Each principle attacks one or
      more of those symptoms. SOLID says nothing directly about line count, allocation
      speed, or thread safety.
    ref: "concepts.md#what-solid-buys-you"

  - id: solid-principles-002
    difficulty: beginner
    tags: [srp, definition]
    question: |
      The Single Responsibility Principle says a class should have "one reason to
      change." What does a "reason to change" best correspond to?
    options:
      - "One public method"
      - "One actor or concern (a business rule, a storage format, a report layout)"
      - "One instance field"
      - "One package or module"
    answer: 1
    explanation: |
      A "reason to change" maps to an actor/concern — finance owns pricing rules, ops
      owns persistence, design owns report layout. A class serving multiple such concerns
      has multiple reasons to change. SRP is emphatically NOT "one method per class"; a
      cohesive class can have many methods serving a single responsibility.
    ref: "concepts.md#single-responsibility-principle"

  - id: solid-principles-003
    difficulty: intermediate
    tags: [srp, violation, refactor]
    question: |
      An Invoice class computes totals, renders itself to HTML, and writes itself to a
      file. Which SOLID principle does this most directly violate, and why?
    options:
      - "OCP — you cannot add a new invoice type without editing it"
      - "SRP — it has three reasons to change: pricing rules, layout, and storage"
      - "LSP — subclasses of Invoice would not be substitutable"
      - "DIP — it depends on a concrete file system"
    answer: 1
    explanation: |
      Three distinct concerns (business logic, presentation, persistence) each give a
      different actor edit rights to the same file, so it has three reasons to change —
      the textbook SRP violation. A layout tweak risks breaking tax math, and the class
      can't be unit-tested without disk I/O. The fix is to split into Invoice,
      InvoiceRenderer, and InvoiceRepository.
    ref: "concepts.md#single-responsibility-principle"

  - id: solid-principles-004
    difficulty: intermediate
    tags: [srp, misconception]
    question: |
      A candidate refactors a cohesive OrderValidator (which has five private helper
      methods that all validate one order) into five separate one-method classes,
      claiming "SRP." What is the flaw in this reasoning?
    options:
      - "The original already served one cohesive responsibility; splitting it creates anemic classes and shotgun surgery"
      - "SRP requires exactly one method per class, so the refactor is correct"
      - "Validation should always live in the entity itself, never a separate class"
      - "The five methods should have been merged into one giant method instead"
    answer: 0
    explanation: |
      SRP targets one *responsibility*, not one method. A class with several methods that
      together fulfill a single cohesive concern already satisfies SRP. Over-splitting
      produces anemic classes and forces you to edit many files for one logical change
      (shotgun surgery) — the opposite failure. Cohesion is the real target.
    ref: "concepts.md#single-responsibility-principle"

  - id: solid-principles-005
    difficulty: beginner
    tags: [srp, heuristic]
    question: |
      What is a fast interview heuristic for spotting an SRP violation while describing
      a class?
    options:
      - "The class name ends in 'Manager' or 'Service'"
      - "You need the word 'and' to describe what it does (e.g. 'calculates totals AND writes files')"
      - "The class has more than one constructor"
      - "The class implements more than one interface"
    answer: 1
    explanation: |
      If a one-sentence description needs an "and" joining two concerns, the class likely
      has two responsibilities. Naming conventions, constructor count, and interface count
      are not reliable signals (implementing several *role* interfaces is actually good
      ISP practice).
    ref: "concepts.md#single-responsibility-principle"

  - id: solid-principles-006
    difficulty: beginner
    tags: [ocp, definition]
    question: |
      "Open for extension, closed for modification" means:
    options:
      - "You can add new behavior by adding new code without editing existing, tested code"
      - "Source files should be read-only in version control"
      - "All fields must be final and all classes immutable"
      - "Public methods are open but private methods are closed"
    answer: 0
    explanation: |
      OCP means new behavior arrives as *new* code (a new subtype/strategy) rather than
      edits to working, tested code. It has nothing to do with file permissions,
      immutability, or method visibility. The point is to isolate expected variation
      points behind an abstraction.
    ref: "concepts.md#open-closed-principle"

  - id: solid-principles-007
    difficulty: intermediate
    tags: [ocp, violation, smell]
    question: |
      Which code smell most reliably signals an Open/Closed Principle violation in an
      LLD design?
    options:
      - "A constructor with more than three parameters"
      - "A class that implements two interfaces"
      - "A growing if-else / switch that type-checks and must be edited for each new variant"
      - "A method that returns void"
    answer: 2
    explanation: |
      An if-else or switch that inspects a type tag and must be extended every time a new
      variant is added is the hallmark OCP violation — each new case edits (and risks
      breaking) tested code. The fix is polymorphism/Strategy: each variant implements a
      shared interface and plugs in as a new class. The other options are unrelated.
    ref: "concepts.md#open-closed-principle"

  - id: solid-principles-008
    difficulty: intermediate
    tags: [ocp, refactor, strategy]
    question: |
      An AreaCalculator has `if (shape instanceof Circle) ... else if (shape instanceof
      Square) ...`. What refactor makes it open/closed?
    options:
      - "Add a `type` string field to each shape and switch on the string instead"
      - "Move the if-else chain into a static utility method"
      - "Make AreaCalculator a singleton so there is only one place to edit"
      - "Define a Shape interface with an area() method; each shape implements it, and the calculator just sums shape.area()"
    answer: 3
    explanation: |
      Pushing area() into each Shape implementation lets the calculator iterate
      polymorphically and never change when a new shape is added — the new shape is a new
      file. Switching on a string tag is the same OCP violation in disguise. Singletons
      and static utilities don't address the modification-on-extension problem at all.
    ref: "concepts.md#open-closed-principle"

  - id: solid-principles-009
    difficulty: advanced
    tags: [ocp, yagni, tradeoff]
    question: |
      When is it a mistake to aggressively apply OCP by adding abstraction layers for
      every conceivable variation?
    options:
      - "Never — more abstraction is always safer"
      - "When there is no concrete second variant or stated extension need; this is speculative generality (YAGNI)"
      - "Only when using a language without interfaces"
      - "Only in production code, never in interview code"
    answer: 1
    explanation: |
      OCP means isolating the variation points you actually expect, not guessing every
      axis of change. Building interfaces and strategies for a single implementation with
      no stated need for another is speculative generality / YAGNI — it adds cost and
      indirection without payoff. Apply OCP where the interviewer signals variation.
    ref: "concepts.md#open-closed-principle"

  - id: solid-principles-010
    difficulty: intermediate
    tags: [ocp, interview, signal]
    question: |
      In a live LLD round, the interviewer says "now also support motorcycles" for your
      parking system. Which response best demonstrates OCP judgment?
    options:
      - "Add a new Motorcycle type implementing the existing Vehicle abstraction, leaving existing classes untouched"
      - "Edit the existing `switch (vehicleType)` to add a MOTORCYCLE branch"
      - "Add a boolean isMotorcycle flag to the Vehicle class"
      - "Duplicate the Car class and rename it Motorcycle"
    answer: 0
    explanation: |
      Extending by adding a new implementation of an existing abstraction keeps existing,
      tested code closed to modification — the OCP win, and a strong senior signal when
      narrated. Editing a switch or adding type flags reintroduces the type-check
      violation; duplicating a class violates DRY and doesn't integrate polymorphically.
    ref: "concepts.md#open-closed-principle"

  - id: solid-principles-011
    difficulty: beginner
    tags: [lsp, definition]
    question: |
      The Liskov Substitution Principle requires that:
    options:
      - "Every subclass overrides every method of its parent"
      - "Subclasses must have more methods than their parent"
      - "Objects of a subtype can replace objects of the base type without breaking code written against the base"
      - "Inheritance hierarchies must be at most two levels deep"
    answer: 2
    explanation: |
      LSP is about behavioral substitutability: code written against the base type must
      work unchanged with any subtype. Subtypes may not strengthen preconditions, weaken
      postconditions, or break invariants the base promised. Method counts and hierarchy
      depth are irrelevant to the principle.
    ref: "concepts.md#liskov-substitution-principle"

  - id: solid-principles-012
    difficulty: intermediate
    tags: [lsp, square-rectangle]
    question: |
      Why does `Square extends Rectangle` (where setWidth also sets height) violate LSP?
    options:
      - "Client code relying on Rectangle's contract (set width 5, set height 4, expect area 20) breaks when given a Square"
      - "A square has fewer fields than a rectangle"
      - "Squares cannot be represented with integer coordinates"
      - "Rectangle should have been an interface, which is the only issue"
    answer: 0
    explanation: |
      Rectangle's contract lets you set width and height independently. Square overrides
      the setters to keep sides equal, so code that sets width=5 then height=4 and expects
      area=20 gets 16 — the substitution silently breaks the base's postcondition. English
      "a square is a rectangle" is true; behavioral substitutability is not.
    ref: "concepts.md#liskov-substitution-principle"

  - id: solid-principles-013
    difficulty: intermediate
    tags: [lsp, fix, immutability]
    question: |
      What is the cleanest fix for the Square/Rectangle LSP problem?
    options:
      - "Make Square override area() to return side*side and keep the inheritance"
      - "Make Rectangle a subclass of Square instead"
      - "Add a validation check in setHeight that throws if called on a Square"
      - "Model both as immutable value types implementing a shared Shape interface, with no inheritance between them"
    answer: 3
    explanation: |
      The contradiction comes from mutable setters plus a forced is-a relationship.
      Immutable Rectangle and Square that each implement a shared Shape interface (with
      area()) removes both problems — there are no mutating setters to contradict, and
      neither inherits the other's contract. Throwing in a setter is itself an LSP
      violation; inverting the hierarchy just moves the break.
    ref: "concepts.md#liskov-substitution-principle"

  - id: solid-principles-014
    difficulty: advanced
    tags: [lsp, detection, heuristic]
    question: |
      Which of the following is the strongest red flag that an inheritance relationship
      violates LSP?
    options:
      - "A subclass adds new public methods not on the base"
      - "A subclass has a longer constructor than the base"
      - "A subclass overrides a base method to throw UnsupportedOperationException or to ignore arguments the base honored"
      - "A subclass is in a different package from the base"
    answer: 2
    explanation: |
      Overriding an inherited method to throw or to no-op an argument the base type
      honored means the subtype cannot stand in for the base — the defining LSP failure.
      (Java's Collections.unmodifiableList throwing on add() is a famous example.) Adding
      new methods, longer constructors, and package placement don't break substitutability.
    ref: "concepts.md#liskov-substitution-principle"

  - id: solid-principles-015
    difficulty: intermediate
    tags: [lsp, isp, bird-fly]
    question: |
      A Penguin extends Bird and overrides fly() to throw an exception because penguins
      can't fly. This violates LSP; what refactor also improves interface design?
    options:
      - "Extract a Flyable interface so only flying birds implement fly(), segregating the capability"
      - "Add an isFlightless boolean to Bird and check it before calling fly()"
      - "Catch the exception wherever fly() is called"
      - "Make Penguin's fly() a no-op that returns silently"
    answer: 0
    explanation: |
      Segregating flight into a Flyable interface means Penguin simply doesn't implement
      it, so no client can call fly() on a penguin and nothing throws — this fixes LSP by
      way of ISP. Boolean flags push the problem to every caller, catching hides it, and a
      silent no-op still lies about behavior.
    ref: "concepts.md#liskov-substitution-principle"

  - id: solid-principles-016
    difficulty: beginner
    tags: [isp, definition]
    question: |
      The Interface Segregation Principle states that:
    options:
      - "Interfaces should have exactly one method"
      - "Every class must implement at least one interface"
      - "No client should be forced to depend on methods it does not use"
      - "Interfaces should never be split across packages"
    answer: 2
    explanation: |
      ISP says clients shouldn't be forced to depend on (and recompile against) methods
      irrelevant to them. It favors small, role-focused interfaces but does NOT mandate
      exactly one method each — Comparable, Runnable, and Closeable are one-method by
      nature, but a cohesive multi-method role interface is fine.
    ref: "concepts.md#interface-segregation-principle"

  - id: solid-principles-017
    difficulty: intermediate
    tags: [isp, violation, fat-interface]
    question: |
      A Worker interface declares work(), eat(), and sleep(). A RobotWorker implements it
      but throws UnsupportedOperationException from eat() and sleep(). This is primarily
      an ISP violation, but it simultaneously violates which other principle?
    options:
      - "SRP, because Worker has one responsibility"
      - "OCP, because you can extend Worker freely"
      - "LSP, because RobotWorker is not substitutable for Worker (it throws on contract methods)"
      - "DIP, because Worker is an abstraction"
    answer: 2
    explanation: |
      Being forced to implement eat()/sleep() is the ISP problem; implementing them by
      throwing means a RobotWorker can't safely stand in for a Worker — an LSP violation.
      This is the classic way ISP and LSP violations co-occur. The fix is role interfaces
      (Workable, Eatable, Sleepable) so RobotWorker implements only Workable.
    ref: "concepts.md#interface-segregation-principle"

  - id: solid-principles-018
    difficulty: intermediate
    tags: [isp, refactor]
    question: |
      What is the correct ISP refactor for a fat Worker { work(); eat(); sleep(); }
      interface used by both humans and robots?
    options:
      - "Make Worker abstract and have robots override eat()/sleep() as final no-ops"
      - "Add default methods to Worker so robots inherit empty eat()/sleep()"
      - "Keep Worker but document that robots should not call eat()"
      - "Split into role interfaces Workable, Eatable, Sleepable; humans implement all three, robots implement only Workable"
    answer: 3
    explanation: |
      Splitting the fat interface into cohesive role interfaces lets each client depend
      only on what it needs — humans implement all three, robots only Workable. Default
      no-op methods and abstract no-ops still leave the meaningless methods callable
      (LSP smell) and couple robots to eat/sleep changes; documentation doesn't enforce
      anything.
    ref: "concepts.md#interface-segregation-principle"

  - id: solid-principles-019
    difficulty: advanced
    tags: [isp, coupling, blast-radius]
    question: |
      Beyond forcing empty method stubs, what is the deeper cost of a fat interface that
      ISP addresses?
    options:
      - "It makes the interface file physically larger"
      - "A change to one method's signature forces every implementer to recompile/redeploy even those that never use it"
      - "It increases object memory footprint at runtime"
      - "It prevents the interface from being generic"
    answer: 1
    explanation: |
      Needless coupling is the core cost: changing eat()'s signature forces RobotWorker to
      recompile and redeploy though it never eats, widening the blast radius of every
      change. Role interfaces contain that radius. File size and runtime footprint aren't
      the concern, and interfaces can be generic regardless of segregation.
    ref: "concepts.md#interface-segregation-principle"

  - id: solid-principles-020
    difficulty: beginner
    tags: [dip, definition]
    question: |
      The Dependency Inversion Principle states that high-level modules and low-level
      modules should:
    options:
      - "Both live in the same package"
      - "Never communicate directly"
      - "Both depend on abstractions, not on each other's concrete details"
      - "Be merged into a single class for cohesion"
    answer: 2
    explanation: |
      DIP: high-level policy should not depend on low-level detail; both depend on
      abstractions, and abstractions don't depend on details. This decouples policy from
      implementation so details can be swapped. It is not about package layout, forbidding
      communication, or merging classes.
    ref: "concepts.md#dependency-inversion-principle"

  - id: solid-principles-021
    difficulty: intermediate
    tags: [dip, violation, smell]
    question: |
      Which line inside a high-level OrderService most clearly violates DIP?
    options:
      - "private final OrderRepository repo; (a field typed as an interface)"
      - "OrderService(OrderRepository repo) { this.repo = repo; }"
      - "void place(Order o) { repo.save(o); }"
      - "private final MySqlOrderRepository repo = new MySqlOrderRepository();"
    answer: 3
    explanation: |
      `new MySqlOrderRepository()` inside the high-level policy hard-wires it to a
      concrete detail — the DIP violation. It can't be unit-tested without a real DB and
      can't swap to Postgres without editing the policy. Depending on the OrderRepository
      interface and receiving it via the constructor is exactly the correct, inverted form.
    ref: "concepts.md#dependency-inversion-principle"

  - id: solid-principles-022
    difficulty: intermediate
    tags: [dip, refactor, injection]
    question: |
      What is the standard refactor to make a high-level service satisfy DIP?
    options:
      - "Make all its fields static"
      - "Move the concrete instantiation into a static initializer block"
      - "Define an interface for each dependency and inject implementations via the constructor"
      - "Mark the concrete dependency class as final"
    answer: 2
    explanation: |
      Extract an interface (e.g. OrderRepository, Notifier) and inject a conforming
      implementation through the constructor. The policy then depends only on the
      abstraction, so MySQL/Postgres/in-memory doubles all plug in without editing it.
      Static fields and static initializers still bind to a concrete type; final changes
      nothing about the dependency direction.
    ref: "concepts.md#dependency-inversion-principle"

  - id: solid-principles-023
    difficulty: intermediate
    tags: [dip, di, distinction]
    question: |
      What is the difference between Dependency Inversion (DIP) and Dependency Injection (DI)?
    options:
      - "They are two names for the same thing"
      - "DI is the principle; DIP is the Spring framework feature"
      - "DIP is the design principle (depend on abstractions); DI is a mechanism (constructor/setter injection, IoC containers) that helps achieve it"
      - "DIP applies only to databases; DI applies only to web controllers"
    answer: 2
    explanation: |
      DIP is the principle: high-level policy depends on abstractions. DI is one mechanism
      for satisfying it — passing dependencies in rather than constructing them, whether by
      hand, a factory, or an IoC container like Spring. You can honor DIP with no framework
      at all. Neither is limited to a specific layer.
    ref: "concepts.md#dependency-inversion-principle"

  - id: solid-principles-024
    difficulty: advanced
    tags: [dip, ownership, inversion]
    question: |
      What does the word "inversion" specifically refer to in the Dependency Inversion
      Principle?
    options:
      - "The call stack is reversed at runtime"
      - "Method arguments are passed in reverse order"
      - "The dependency direction is inverted: the abstraction is owned by (defined for) the high-level policy, and the low-level detail conforms to it"
      - "Inheritance is replaced by composition"
    answer: 2
    explanation: |
      Normally high-level code would depend on low-level code. DIP inverts that: the
      high-level module defines the abstraction it needs, and the low-level detail
      implements/conforms to that abstraction — so the dependency arrow points from detail
      to abstraction. It's about ownership of the interface, not call order or argument
      order (composition-over-inheritance is a separate idea).
    ref: "concepts.md#dependency-inversion-principle"

  - id: solid-principles-025
    difficulty: intermediate
    tags: [dip, testability]
    question: |
      An interviewer asks "how would you unit-test OrderService without a database?"
      Which prior design decision makes this possible?
    options:
      - "Making OrderService a singleton"
      - "Having OrderService depend on an OrderRepository interface injected via constructor, so a test can pass an InMemoryOrderRepository"
      - "Adding a lot of logging to OrderService"
      - "Marking the save() method synchronized"
    answer: 1
    explanation: |
      Because the policy depends on the OrderRepository abstraction and receives it via
      injection, a test can supply an in-memory implementation — no real database needed.
      This is DIP's payoff for testability. Singletons actually hinder testing; logging
      and synchronization are unrelated to substituting the dependency.
    ref: "concepts.md#dependency-inversion-principle"

  - id: solid-principles-026
    difficulty: advanced
    tags: [compounding, srp, ocp]
    question: |
      Why does an SRP violation (a class doing I/O plus business logic) tend to drag in an
      OCP violation as well?
    options:
      - "Because I/O is always slower than computation"
      - "Because every kind of change — logic, storage, format — now edits the same mega-class, so it can't stay closed to modification"
      - "Because business logic cannot be polymorphic"
      - "Because I/O classes cannot implement interfaces"
    answer: 1
    explanation: |
      When one class owns several concerns, any change to any concern edits that class, so
      it can never be closed to modification — the SRP violation forces the OCP violation.
      This compounding is why interviewers treat SOLID as a system: fixing the root
      SRP/DIP problem early tends to make the others fall out naturally.
    ref: "concepts.md#how-the-violations-compound"

  - id: solid-principles-027
    difficulty: advanced
    tags: [compounding, isp, lsp]
    question: |
      A fat interface that forces implementers to throw UnsupportedOperationException
      illustrates which pair of principles being violated together?
    options:
      - "SRP and DIP"
      - "DIP and OCP"
      - "OCP and SRP"
      - "ISP and LSP"
    answer: 3
    explanation: |
      The fat interface forcing unused methods is the ISP violation; implementing those
      methods by throwing makes the type non-substitutable, an LSP violation. ISP and LSP
      routinely co-occur this way, which is why splitting the interface into role
      interfaces fixes both at once.
    ref: "concepts.md#how-the-violations-compound"

  - id: solid-principles-028
    difficulty: advanced
    tags: [compounding, dip, ocp]
    question: |
      How does a DIP violation (`new Concrete()` inside high-level code) freeze a design
      against OCP?
    options:
      - "It makes compilation slower, so developers avoid changes"
      - "It prevents the class from being instantiated at all"
      - "It forces all methods to be final"
      - "The concrete type is hard-wired, so you cannot extend behavior by swapping in a different implementation"
    answer: 3
    explanation: |
      Hard-wiring a concrete class means the only way to change behavior is to edit the
      high-level code — you can't extend by providing a different implementation of an
      abstraction. So the DIP violation blocks the OCP win. Injecting an abstraction
      restores both extensibility and testability.
    ref: "concepts.md#how-the-violations-compound"

  - id: solid-principles-029
    difficulty: intermediate
    tags: [checklist, interview-method]
    question: |
      According to the interview checklist, at which two moments should you run a quick
      SOLID pass during a live LLD round?
    options:
      - "After sketching your classes, and each time the interviewer adds a new requirement"
      - "Only at the very start, before writing any code"
      - "Only after the interview ends, as a retrospective"
      - "Every time you rename a variable"
    answer: 0
    explanation: |
      The checklist is most valuable right after you sketch the class set (to catch
      SRP/ISP issues) and whenever a new requirement lands (to protect OCP and re-check
      LSP/DIP). Running it only up front misses the follow-up requirements interviewers
      always add; a post-hoc retrospective is too late to influence the design.
    ref: "concepts.md#solid-as-an-interview-checklist"

  - id: solid-principles-030
    difficulty: beginner
    tags: [checklist, smells]
    question: |
      An interviewer shows you code with `new SmtpMailer()` constructed directly inside a
      high-level NotificationService. Which SOLID smell is this?
    options:
      - "SRP smell — too many methods"
      - "DIP smell — high-level policy hard-wired to a concrete detail"
      - "ISP smell — interface too fat"
      - "LSP smell — subtype not substitutable"
    answer: 1
    explanation: |
      Constructing a concrete dependency inside a high-level policy is the signature DIP
      smell — the policy depends on a detail instead of an abstraction. The fix is to
      depend on a Notifier/Mailer interface and inject the SMTP implementation, which also
      makes the service testable.
    ref: "concepts.md#solid-as-an-interview-checklist"

  - id: solid-principles-031
    difficulty: intermediate
    tags: [checklist, mapping]
    question: |
      Match the smell to the principle: "a method overridden to throw an exception."
    options:
      - "OCP"
      - "LSP (often ISP too)"
      - "DIP"
      - "SRP"
    answer: 1
    explanation: |
      An override that throws instead of honoring the base contract signals the subtype
      isn't substitutable — an LSP violation, and frequently a symptom of a fat interface
      (ISP) forcing the class to implement something irrelevant. Learning these
      smell-to-principle mappings is exactly what "which principle does this violate?"
      follow-ups test.
    ref: "concepts.md#common-interview-follow-ups"

  - id: solid-principles-032
    difficulty: intermediate
    tags: [checklist, mapping]
    question: |
      An interviewer asks you to "fix this without modifying the existing class." Which
      SOLID move is the expected answer?
    options:
      - "Make the existing class abstract and delete its methods"
      - "Add another else-if branch to the existing method"
      - "Copy the class and edit the copy"
      - "Add a new subtype/strategy implementing an existing interface, and inject it if needed (OCP via DIP)"
    answer: 3
    explanation: |
      "Without modifying the existing class" is a direct OCP prompt: extend by adding a new
      implementation of an existing abstraction (a strategy/subtype), wiring it in via
      injection. Editing branches modifies the class; copying violates DRY and doesn't
      integrate; deleting methods breaks existing callers.
    ref: "concepts.md#common-interview-follow-ups"

  - id: solid-principles-033
    difficulty: intermediate
    tags: [ocp, strategy, patterns-boundary]
    question: |
      Which design pattern most directly embodies the Open/Closed Principle for swapping
      algorithms (e.g. pricing rules) at runtime?
    options:
      - "Singleton"
      - "Strategy"
      - "Observer"
      - "Flyweight"
    answer: 1
    explanation: |
      Strategy encapsulates each algorithm behind a common interface so new algorithms
      plug in without editing the context — the essence of OCP. (The design-patterns
      domain, dp-strategy, owns the full pattern treatment; here we just note the SOLID
      link.) Singleton controls instantiation, Observer handles notifications, Flyweight
      shares state — none is the OCP-for-algorithms answer.
    ref: "concepts.md#open-closed-principle"

  - id: solid-principles-034
    difficulty: advanced
    tags: [patterns-boundary, dip, adapter]
    question: |
      Patterns "embody" SOLID principles. Which pairing is correct?
    options:
      - "Iterator achieves DIP; Memento achieves OCP"
      - "Singleton achieves LSP; Observer achieves ISP"
      - "Decorator achieves SRP; Facade achieves LSP"
      - "Adapter/Bridge achieve DIP-style decoupling; Strategy/Template Method achieve OCP"
    answer: 3
    explanation: |
      Adapter and Bridge decouple abstraction from implementation (DIP flavor), while
      Strategy and Template Method let you extend behavior without modification (OCP). The
      other pairings are mismatched. Patterns are concrete recipes that realize SOLID —
      see the dp-* domain for the full taxonomy.
    ref: "concepts.md#common-interview-follow-ups"

  - id: solid-principles-035
    difficulty: intermediate
    tags: [srp, scenario, splitwise]
    question: |
      In a Splitwise design, one ExpenseManager class parses input, validates users,
      computes splits, persists to a DB, and formats a settlement report. What is the best
      first refactor?
    options:
      - "Add more comments to clarify each section"
      - "Convert every method to static so no state is held"
      - "Make ExpenseManager a singleton so state is shared"
      - "Separate the concerns into distinct classes (e.g. SplitCalculator, ExpenseRepository, SettlementReporter) each with one reason to change"
    answer: 3
    explanation: |
      ExpenseManager is a god class with many reasons to change — the SRP violation.
      Splitting into cohesive collaborators (split calculation, persistence, reporting)
      localizes each future change and makes the split logic unit-testable. Comments,
      singletons, and static methods do nothing to separate the concerns.
    ref: "concepts.md#single-responsibility-principle"

  - id: solid-principles-036
    difficulty: advanced
    tags: [dip, scenario, layering]
    question: |
      Your domain layer defines a PaymentGateway interface, and the infrastructure layer's
      StripeGateway implements it. In which layer should the PaymentGateway interface live
      to properly honor DIP?
    options:
      - "In the domain/high-level layer, so the detail (StripeGateway) depends on the abstraction the policy owns"
      - "In the infrastructure layer next to StripeGateway"
      - "In a shared 'utils' package unrelated to either"
      - "It doesn't matter where the interface lives"
    answer: 0
    explanation: |
      DIP's inversion means the abstraction is owned by the high-level policy that needs
      it, and low-level details conform to it. Placing PaymentGateway in the domain layer
      makes StripeGateway (infrastructure) depend inward on the domain — the dependency
      arrow points toward the policy. Putting it beside Stripe would leave the domain
      depending on infrastructure.
    ref: "concepts.md#dependency-inversion-principle"

  - id: solid-principles-037
    difficulty: intermediate
    tags: [ocp, lsp, distinction]
    question: |
      What distinguishes an OCP concern from an LSP concern when adding a new subtype?
    options:
      - "OCP applies only to interfaces; LSP applies only to abstract classes"
      - "OCP is about runtime speed; LSP is about compile time"
      - "OCP asks whether you had to edit existing code to add the subtype; LSP asks whether the subtype behaves correctly wherever the base is used"
      - "They are identical concerns"
    answer: 2
    explanation: |
      OCP is about *extensibility*: can you add the subtype without modifying existing
      code? LSP is about *correctness of substitution*: does the subtype honor the base's
      contract everywhere the base is expected? A design can be open/closed yet still ship
      an LSP-violating subtype (e.g. one that throws), so both must be checked.
    ref: "concepts.md#liskov-substitution-principle"

  - id: solid-principles-038
    difficulty: beginner
    tags: [srp, cohesion]
    question: |
      SRP is closely tied to which broader design quality?
    options:
      - "Low latency"
      - "Backward compatibility"
      - "High cohesion (a class's members serve one purpose) and low coupling"
      - "Memory locality"
    answer: 2
    explanation: |
      SRP maximizes cohesion — every member of a class serves the same single concern —
      and, combined with DIP/ISP, minimizes coupling. Cohesion/coupling is the deeper lens
      SRP operationalizes. Latency, compatibility, and memory locality are unrelated
      dimensions.
    ref: "concepts.md#single-responsibility-principle"

  - id: solid-principles-039
    difficulty: advanced
    tags: [isp, scenario, repository]
    question: |
      A ReadOnlyReportViewer only needs to fetch data, but it depends on a fat Repository
      interface with save(), update(), delete(), and find(). What is the ISP-aligned fix?
    options:
      - "Split into ReadRepository (find) and WriteRepository (save/update/delete); the viewer depends only on ReadRepository"
      - "Have the viewer implement the save/update/delete methods as no-ops"
      - "Add a boolean readOnly flag to Repository"
      - "Let the viewer catch exceptions from the write methods"
    answer: 0
    explanation: |
      Segregating the fat repository into read and write role interfaces lets the viewer
      depend only on ReadRepository — it no longer recompiles when write methods change and
      can't accidentally mutate. This mirrors CQRS-style separation. No-ops and flags leave
      the irrelevant methods coupled and callable.
    ref: "concepts.md#interface-segregation-principle"

  - id: solid-principles-040
    difficulty: intermediate
    tags: [overview, symptoms]
    question: |
      "A class cannot be reused in another project because it drags in irrelevant
      dependencies." Which symptom is this, and which principles most directly address it?
    options:
      - "Rigidity — addressed by SRP and OCP"
      - "Fragility — addressed by LSP only"
      - "Immobility — addressed by ISP and DIP"
      - "Verbosity — addressed by DRY"
    answer: 2
    explanation: |
      Immobility is the inability to reuse a component because it carries unwanted baggage.
      ISP (depend only on needed methods) and DIP (depend on abstractions, not concrete
      details) cut those dependencies so the class travels light. Rigidity and fragility
      are the other two symptoms; verbosity isn't one of the three.
    ref: "concepts.md#what-solid-buys-you"

  - id: solid-principles-041
    difficulty: advanced
    tags: [lsp, contracts, preconditions]
    question: |
      Per LSP, a subtype may NOT do which of the following relative to the base type's
      method contract?
    options:
      - "Strengthen preconditions (demand more from callers than the base did)"
      - "Weaken preconditions (accept a wider range of inputs)"
      - "Strengthen postconditions (guarantee more about results)"
      - "Preserve the base's invariants"
    answer: 0
    explanation: |
      LSP allows a subtype to weaken preconditions and strengthen postconditions (be more
      lenient about inputs, more specific about outputs) and requires it to preserve
      invariants. It must NOT strengthen preconditions — demanding more from callers than
      the base breaks code written to the base's looser contract.
    ref: "concepts.md#liskov-substitution-principle"

  - id: solid-principles-042
    difficulty: intermediate
    tags: [ocp, scenario, notification]
    question: |
      A NotificationService has `if (channel.equals("EMAIL")) {...} else if
      (channel.equals("SMS")) {...}`. Adding push notifications means editing this method.
      Which refactor best applies OCP?
    options:
      - "Define a NotificationChannel interface with send(); each channel is its own implementation, selected via a registry/map"
      - "Add an else-if for PUSH and add tests for it"
      - "Store the channel type as an enum and switch on the enum"
      - "Move the if-else into the caller instead"
    answer: 0
    explanation: |
      Encapsulating each channel behind a NotificationChannel interface and resolving the
      right one from a registry/map means adding PUSH is a new class, leaving existing
      channels untouched — OCP satisfied. Adding an else-if or switching on an enum keeps
      the modification-on-extension problem; moving the if-else just relocates it.
    ref: "concepts.md#open-closed-principle"

  - id: solid-principles-043
    difficulty: expert
    tags: [dip, tradeoff, over-abstraction]
    question: |
      A candidate wraps every single class behind its own interface "for DIP," even
      classes with exactly one implementation and no test or extension need. What is the
      most accurate critique?
    options:
      - "This is textbook DIP and should always be done"
      - "It's over-abstraction: DIP pays off at real seams (external systems, things you'll swap or mock); interfaces with one impl and no seam add indirection without benefit"
      - "DIP forbids interfaces, so this is wrong"
      - "Interfaces slow the program down too much to ever use"
    answer: 1
    explanation: |
      DIP is worth applying at genuine seams — dependencies on external systems, or
      collaborators you'll swap or mock in tests. Wrapping value objects and single-impl
      classes with no such seam just adds indirection and ceremony (speculative generality).
      Judgment about where the seams are is the senior signal; blanket interfaces are not.
    ref: "concepts.md#dependency-inversion-principle"

  - id: solid-principles-044
    difficulty: expert
    tags: [srp, actors, reason-to-change]
    question: |
      Uncle Bob later reframed SRP as "a module should be responsible to one, and only one,
      actor." Why is the actor framing sharper than "one reason to change"?
    options:
      - "Actors are easier to count than reasons"
      - "It pins 'reason to change' to concrete stakeholders (e.g. CFO vs. COO vs. CTO) whose differing requests would otherwise collide in one class"
      - "It means each class can serve only one user account"
      - "It replaces cohesion as the goal of SRP"
    answer: 1
    explanation: |
      The actor framing makes "reason to change" concrete: if the CFO's reporting logic and
      the COO's persistence logic live in one class, their independent change requests
      collide and one team's edit can break the other's feature. Separating by actor
      prevents that. It refines, not replaces, the cohesion goal, and has nothing to do
      with user accounts.
    ref: "concepts.md#single-responsibility-principle"

  - id: solid-principles-045
    difficulty: expert
    tags: [lsp, covariance, collections]
    question: |
      Why is `class ImmutableList extends ArrayList` (overriding add()/remove() to throw)
      considered an LSP violation even though it compiles and "is-a" List?
    options:
      - "Because ArrayList is final and cannot be extended"
      - "Because callers holding an ArrayList/List reference expect add() to succeed per the contract; throwing breaks that postcondition, so the subtype isn't substitutable"
      - "Because immutable objects cannot be stored in collections"
      - "Because List is an interface, not a class"
    answer: 1
    explanation: |
      Any code written to the List/ArrayList contract assumes add() mutates the list;
      substituting an instance that throws violates that promised behavior — the defining
      LSP failure. This is precisely why JDK's own unmodifiable wrappers are cited as an LSP
      wart. The better model is a separate read-only abstraction rather than inheriting a
      mutable contract and disabling it.
    ref: "concepts.md#liskov-substitution-principle"

  - id: solid-principles-046
    difficulty: intermediate
    tags: [checklist, ordering, method]
    question: |
      In the suggested interview SOLID pass, why check S (SRP) and D (DIP) issues early
      rather than chasing all five equally after the design is done?
    options:
      - "Fixing the root SRP/DIP violations (separate concerns, inject abstractions) tends to make OCP, LSP, and ISP fall out naturally"
      - "S and D are the only real principles"
      - "SRP and DIP are alphabetically first"
      - "OCP, LSP, and ISP cannot be fixed once code is written"
    answer: 0
    explanation: |
      Because the violations compound, addressing the root causes early — giving each class
      one concern and injecting abstractions — often resolves the downstream OCP/LSP/ISP
      issues automatically, whereas fixing them individually after the fact is far more
      work. All five are real and all remain fixable; ordering is about efficiency, not the
      alphabet.
    ref: "concepts.md#how-the-violations-compound"

  - id: solid-principles-047
    difficulty: beginner
    tags: [overview, history]
    question: |
      Which statement about the origin of SOLID is correct?
    options:
      - "The five principles were collected by Robert C. Martin; the acronym 'SOLID' was coined by Michael Feathers"
      - "All five principles and the acronym were invented by the Gang of Four"
      - "SOLID was defined by the Java language designers"
      - "The Open/Closed Principle was invented by Barbara Liskov"
    answer: 0
    explanation: |
      Robert C. Martin gathered and popularized the five principles; Michael Feathers
      arranged them into the SOLID acronym. The Open/Closed Principle traces to Bertrand
      Meyer, and LSP to Barbara Liskov — but the OCP/Liskov attribution in this option is
      swapped. The GoF wrote about patterns, not SOLID, and Java's designers didn't define it.
    ref: "concepts.md#references"

  - id: solid-principles-048
    difficulty: advanced
    tags: [scenario, multi-principle, diagnosis]
    question: |
      A GodService class computes totals, renders HTML, saves to MySQL via
      `new MySqlDao()`, and sends email via `new SmtpClient()`. Which set of principles
      does it violate?
    options:
      - "Only SRP"
      - "None — combining behavior in one class is efficient"
      - "Only LSP and ISP"
      - "SRP (many concerns), DIP (news concrete DAO and SMTP client), and OCP (any new format/storage edits this class)"
    answer: 3
    explanation: |
      It mixes four concerns (SRP), hard-wires concrete MySQL and SMTP dependencies (DIP),
      and forces edits to itself for any new format or storage (OCP) — a compounding
      failure. LSP/ISP aren't the primary issues here since there's no broken hierarchy or
      fat interface yet. Splitting concerns and injecting abstractions resolves all three.
    ref: "concepts.md#how-the-violations-compound"
