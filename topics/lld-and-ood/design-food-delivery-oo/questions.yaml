topic: "Design a Food Delivery App (OO)"
domain: lld-and-ood
topic_slug: design-food-delivery-oo
version: 1
questions:
  - id: design-food-delivery-oo-001
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      In the first five minutes of "Design a Food Delivery App", which clarifying
      question most changes the shape of your cart and checkout design?
    options:
      - "Which frontend framework will the mobile app use?"
      - "Can a cart contain items from multiple restaurants, or only one?"
      - "What color should the order-tracking screen be?"
      - "Which cloud region hosts the servers?"
    answer: 1
    explanation: |
      One-restaurant-per-cart is how real apps work (one partner picks up from one
      kitchen) and it decides whether checkout produces one order or must split the
      cart into several orders with separate state machines and partners. UI and
      hosting questions don't change the object model.
    ref: "concepts.md#requirements-clarification"

  - id: design-food-delivery-oo-002
    difficulty: beginner
    tags: [requirements, hld-vs-lld, boundaries]
    question: |
      The interviewer asks "How would you search restaurants across millions of
      locations with real-time GPS partner tracking?" What is the strongest response
      in a 60-minute LLD round?
    options:
      - "Redesign the classes around a distributed quadtree service immediately"
      - "Explain geohash sharding in depth for fifteen minutes"
      - "Acknowledge it as an HLD concern (geo-indexes, location streams), then keep the design a single-process linear scan behind a clean interface"
      - "Claim a HashMap keyed by city solves it at any scale"
    answer: 2
    explanation: |
      The machine-coding round evaluates single-process OO design. Naming the
      distributed answer in a sentence and deferring shows judgment; the seam (a
      search method behind the facade) is where the real geo-index would plug in
      later. Derailing into infrastructure burns the round.
    ref: "concepts.md#requirements-clarification"

  - id: design-food-delivery-oo-003
    difficulty: beginner
    tags: [actors, entities, inheritance]
    question: |
      Customer, DeliveryPartner, and RestaurantOwner all share id, name, phone, and
      location, but have completely different behaviors. What is the standard way to
      model them?
    options:
      - "One User class with a role string and if-checks in every method"
      - "Three unrelated classes duplicating the identity fields"
      - "Make Customer the base class since customers came first"
      - "An abstract User base holding shared identity, with role-specific subclasses"
    answer: 3
    explanation: |
      Shared state with divergent behavior is the textbook case for an abstract base:
      identity lives once, each subclass adds its own behavior. A role string with
      if-checks reinvents dynamic dispatch by hand and violates OCP; duplicating
      fields three times invites drift.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-food-delivery-oo-004
    difficulty: intermediate
    tags: [entities, immutability, order-item]
    question: |
      Why should OrderItem copy the MenuItem's name and price at checkout instead of
      holding a live reference to the MenuItem?
    options:
      - "Copying makes the order object smaller in memory"
      - "The order is a record of what was agreed; if the owner later edits the menu, a live reference would silently change historical orders"
      - "MenuItem objects cannot be shared between two classes in Java"
      - "It avoids a circular dependency between Menu and Order"
    answer: 1
    explanation: |
      Menus are mutable catalogs; orders are immutable commitments. Snapshotting
      name and unit price freezes the agreement, so a price change or deleted dish
      tomorrow can't rewrite yesterday's receipt. Memory and circularity are not the
      real concerns here.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-food-delivery-oo-005
    difficulty: intermediate
    tags: [cart, order, srp]
    question: |
      Why model Cart and Order as separate classes rather than one object with an
      "isPlaced" flag?
    options:
      - "A cart is mutable, private, and disposable; an order is an immutable commitment with payment and a state machine — merging them forces every consumer to handle 'still editable' states"
      - "Java forbids a class from having both a list of items and a status field"
      - "Two classes always outperform one class at runtime"
      - "Carts must be stored in a different database table"
    answer: 0
    explanation: |
      The two have different lifecycles, mutability, and interested parties. A
      single class with a flag means order-processing code must constantly guard
      against half-built carts, and cart-editing code must guard against mutating
      placed orders — a classic SRP violation.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-food-delivery-oo-006
    difficulty: beginner
    tags: [class-relationships, composition]
    question: |
      Which UML relationship best describes Order and its OrderItems?
    options:
      - "Inheritance — OrderItem extends Order"
      - "Dependency — Order briefly uses OrderItem in one method"
      - "Composition — order items are owned by the order and cannot exist without it"
      - "Simple association with independent lifecycles"
    answer: 2
    explanation: |
      OrderItems have no meaning or lifecycle outside their order — delete the order
      and its items go with it. That whole-part, shared-lifecycle bond is
      composition (filled diamond), not inheritance or a loose association.
    ref: "concepts.md#class-diagram"

  - id: design-food-delivery-oo-007
    difficulty: intermediate
    tags: [class-relationships, aggregation]
    question: |
      Which relationship should connect Order and DeliveryPartner in the class
      diagram?
    options:
      - "Composition — the partner is destroyed when the order completes"
      - "Inheritance — DeliveryPartner is a kind of Order"
      - "The Order should create its own DeliveryPartner via new"
      - "Aggregation/association — the partner exists independently and serves many orders over time"
    answer: 3
    explanation: |
      The partner outlives any single order and is merely assigned to it; the order
      holds a reference, not ownership. Contrast with Order→OrderItem, which is
      composition. Interviewers frequently probe exactly this pair to test
      composition-vs-aggregation understanding.
    ref: "concepts.md#class-diagram"

  - id: design-food-delivery-oo-008
    difficulty: beginner
    tags: [class-relationships, menu]
    question: |
      Restaurant and Menu are drawn with a filled diamond (Restaurant *-- Menu).
      What does this claim about their lifecycles?
    options:
      - "A menu is meaningless without its restaurant — it is owned by and dies with it"
      - "A menu can be freely shared across many restaurants"
      - "Restaurant inherits all methods of Menu"
      - "The menu must be created before the restaurant"
    answer: 0
    explanation: |
      Composition asserts exclusive ownership and a shared lifecycle: the menu
      belongs to exactly one restaurant. If the design needed shared menus across a
      franchise, you'd weaken this to aggregation — which is why interviewers ask.
    ref: "concepts.md#class-diagram"

  - id: design-food-delivery-oo-009
    difficulty: beginner
    tags: [state-pattern, order-lifecycle]
    question: |
      Which pattern (or mechanism) fits the requirement "an order moves through
      PLACED, CONFIRMED, PREPARING, PICKED_UP, IN_TRANSIT, DELIVERED, CANCELLED and
      illegal jumps must be impossible"?
    options:
      - "Builder — construct the order step by step"
      - "An explicit state machine: a status enum with a validated transition map, or the State pattern"
      - "Adapter — convert one status to another"
      - "Prototype — clone the order for each new status"
    answer: 1
    explanation: |
      A lifecycle with legal and illegal transitions is exactly what a state machine
      models. Booleans like isConfirmed/isCancelled can drift into impossible
      combinations; a transition map (or State classes) makes illegal moves
      unrepresentable. Builder, Adapter, and Prototype solve unrelated problems.
    ref: "concepts.md#order-state-machine"

  - id: design-food-delivery-oo-010
    difficulty: intermediate
    tags: [state-pattern, trade-offs]
    question: |
      When should you upgrade from "enum + transition map" to full State-pattern
      classes (one class per order state)?
    options:
      - "Never — the State pattern is enterprise overkill in all interviews"
      - "Immediately — enums are not object-oriented"
      - "Only when there are more than ten states"
      - "When each state carries distinct behavior, such as per-state cancellation-fee rules or per-state allowed actions"
    answer: 3
    explanation: |
      The transition map validates moves cheaply and is the pragmatic default for a
      mostly-linear lifecycle. Once states need their own behavior (not just legal
      next moves), per-state classes localize that logic instead of switch-ing on
      the enum everywhere. State count alone is not the trigger — behavior is.
    ref: "concepts.md#order-state-machine"

  - id: design-food-delivery-oo-011
    difficulty: beginner
    tags: [order-lifecycle, cancellation]
    question: |
      In the standard order state machine, from which state onward is customer
      cancellation no longer allowed?
    options:
      - "CONFIRMED — once the restaurant accepts, cancellation is impossible"
      - "PLACED — orders can never be cancelled after payment"
      - "PICKED_UP — once the food leaves the kitchen, cancellation is disallowed"
      - "DELIVERED — customers may cancel any time before delivery completes"
    answer: 2
    explanation: |
      Cancellation (with refund) is allowed through PLACED, CONFIRMED, and
      PREPARING; once the partner collects the food (PICKED_UP) the order is
      physically in motion and cancellation is blocked. This guard lives in the
      transition validation, not in UI code.
    ref: "concepts.md#order-state-machine"

  - id: design-food-delivery-oo-012
    difficulty: intermediate
    tags: [order-lifecycle, terminal-states]
    question: |
      An engineer adds code that moves a CANCELLED order back to CONFIRMED when the
      customer "un-cancels". What should the design do with this transition?
    options:
      - "Reject it — CANCELLED is terminal; re-ordering means creating a new Order (payment was refunded, the partner released)"
      - "Allow it — customers should always be able to change their mind"
      - "Allow it but skip the observer notifications"
      - "Allow it only if the same delivery partner is still free"
    answer: 0
    explanation: |
      DELIVERED and CANCELLED are terminal states: refunds have fired and resources
      were released, so resurrecting the record creates inconsistent payment and
      assignment state. The clean model is a fresh order. The transition map should
      simply not contain this edge.
    ref: "concepts.md#order-state-machine"

  - id: design-food-delivery-oo-013
    difficulty: beginner
    tags: [strategy-pattern, assignment]
    question: |
      "The delivery-partner matching rule (nearest vs. least-loaded vs.
      rating-weighted) will be tuned by ops every month." Which pattern does this
      requirement point to?
    options:
      - "Singleton — one global assigner"
      - "Template Method — a base class with the rule hard-coded in a final method"
      - "Strategy — encapsulate each matching rule behind a PartnerAssignmentStrategy interface"
      - "Flyweight — share partner objects to save memory"
    answer: 2
    explanation: |
      A volatile, swappable algorithm is the Strategy pattern's home turf: each rule
      becomes an independently testable class, and changing the rule means injecting
      a different implementation — no dispatcher edits. Singleton and Flyweight
      address different concerns entirely.
    ref: "concepts.md#delivery-partner-assignment-strategy"

  - id: design-food-delivery-oo-014
    difficulty: intermediate
    tags: [strategy-pattern, trade-offs, ocp]
    question: |
      Why is a PartnerAssignmentStrategy interface preferred over an if-else chain
      like `if (mode == NEAREST) {...} else if (mode == LEAST_LOADED) {...}` inside
      the order service?
    options:
      - "Interfaces execute faster than if-else at the CPU level"
      - "if-else chains are deprecated in modern Java"
      - "The chain would need a default branch, which is forbidden"
      - "New rules are added as new classes without modifying or re-testing the dispatcher (OCP), each rule is unit-testable in isolation, and the service depends only on the abstraction (DIP)"
    answer: 3
    explanation: |
      The win is structural, not performance: Open/Closed (add, don't modify),
      isolated testability per rule, and dependency inversion so tests inject a
      FakeStrategy. The if-else chain forces every new rule through the same
      ever-growing, ever-re-tested method.
    ref: "concepts.md#delivery-partner-assignment-strategy"

  - id: design-food-delivery-oo-015
    difficulty: intermediate
    tags: [strategy-pattern, api-design, optional]
    question: |
      Why should PartnerAssignmentStrategy.assign() return
      Optional<DeliveryPartner> rather than DeliveryPartner?
    options:
      - "Optional makes the method run asynchronously"
      - "Returning null would not compile in Java"
      - "'No partner currently available' is an expected outcome, not an error — the order waits in CONFIRMED with a retry instead of the caller handling null or a thrown exception"
      - "Optional guarantees thread safety during assignment"
    answer: 2
    explanation: |
      At 8 pm on a rainy Friday every partner may be busy. Encoding that as
      Optional.empty() forces callers to handle the case explicitly and keeps
      exceptions for genuine failures. Optional has nothing to do with async
      execution or locking.
    ref: "concepts.md#delivery-partner-assignment-strategy"

  - id: design-food-delivery-oo-016
    difficulty: intermediate
    tags: [strategy-pattern, assignment, trade-offs]
    question: |
      What is the main operational drawback of a pure NearestPartnerStrategy that a
      LeastLoadedStrategy addresses?
    options:
      - "Partners near restaurant clusters get repeatedly overloaded while distant partners sit idle"
      - "Distance cannot be computed without a distributed system"
      - "It requires the State pattern to work correctly"
      - "Nearest-partner assignment always violates the Liskov Substitution Principle"
    answer: 0
    explanation: |
      Minimizing pickup distance concentrates work on whoever is parked near busy
      kitchens — fast pickups, unfair load. Least-loaded balances active orders per
      partner at the cost of longer pickup distances. Real systems converge on a
      weighted composite, which is exactly why the rule sits behind a Strategy.
    ref: "concepts.md#delivery-partner-assignment-strategy"

  - id: design-food-delivery-oo-017
    difficulty: beginner
    tags: [observer-pattern, notifications]
    question: |
      "On every order status change, the customer app, the restaurant dashboard, and
      the partner app must all be updated — and next quarter an analytics sink will
      be added." Which pattern fits?
    options:
      - "Chain of Responsibility — pass the status to handlers until one consumes it"
      - "Memento — save each status for later restore"
      - "Facade — hide the three apps behind one class"
      - "Observer — the Order notifies registered OrderObservers on each transition"
    answer: 3
    explanation: |
      One event, many independent listeners, with more coming later — the Observer
      pattern's defining scenario. The subject knows only that it has observers,
      never who they are, so the analytics sink registers itself with zero changes
      to Order. CoR is for exactly-one-handler flows.
    ref: "concepts.md#key-design-decisions"

  - id: design-food-delivery-oo-018
    difficulty: intermediate
    tags: [observer-pattern, design-reasoning]
    question: |
      Why should observer notification fire inside Order.transitionTo() rather than
      at each call site that changes the status?
    options:
      - "Call sites cannot legally invoke observer methods in Java"
      - "transitionTo is the single choke point that mutates status, so no code path — present or future — can change state and forget to notify"
      - "It makes notifications run in parallel automatically"
      - "Observers can only be stored on enum types"
    answer: 1
    explanation: |
      If notification lives at call sites, every new flow (partner declines,
      scheduled orders, admin overrides) must remember to notify — one will forget.
      Centralizing mutation and fan-out in one guarded method makes the invariant
      structural rather than a convention.
    ref: "concepts.md#code-skeleton"

  - id: design-food-delivery-oo-019
    difficulty: beginner
    tags: [factory-pattern, payments]
    question: |
      Checkout must support CardPayment, UpiPayment, and CashOnDeliveryPayment, and
      new methods will appear. How should checkout obtain the right payment object?
    options:
      - "Instantiate each concrete class with new directly inside placeOrder"
      - "Use reflection to scan the classpath for payment classes at runtime"
      - "Ask a PaymentFactory to create the implementation and program against the Payment interface"
      - "Make Payment a singleton that internally switches on a global mode flag"
    answer: 2
    explanation: |
      A factory centralizes the method-to-class mapping in one place; checkout
      depends only on the Payment interface. Adding a wallet type is one new class
      plus one factory case — no switch statements scattered through checkout.
      Direct new couples checkout to every concrete type.
    ref: "concepts.md#key-design-decisions"

  - id: design-food-delivery-oo-020
    difficulty: intermediate
    tags: [facade-pattern, api-design]
    question: |
      What role does FoodDeliveryService play in this design?
    options:
      - "An Observer that listens to restaurant menu changes"
      - "A god class that should implement all business logic itself"
      - "A Facade — one entry point that delegates to cart, assignment strategy, and order components, keeping the live-coding session navigable"
      - "A Data Transfer Object carrying order fields between layers"
    answer: 2
    explanation: |
      The facade gives the demo/driver one coherent surface while real logic lives
      in focused collaborators. The failure mode to avoid is letting it become a god
      class that does the work instead of delegating — the facade coordinates, the
      components implement.
    ref: "concepts.md#key-design-decisions"

  - id: design-food-delivery-oo-021
    difficulty: intermediate
    tags: [invariants, cart, encapsulation]
    question: |
      Where should the "one restaurant per cart" rule be enforced?
    options:
      - "In every UI screen that can add items"
      - "In the database schema only"
      - "In the DeliveryPartner class, since partners visit one restaurant"
      - "Inside Cart.addItem — the invariant lives in the object that owns the data, so no caller can bypass it"
    answer: 3
    explanation: |
      Invariants belong with the state they protect. If Cart.addItem throws (or
      prompts a clear-cart flow) when an item from a different restaurant arrives,
      every current and future caller inherits the rule for free. UI-level checks
      are bypassable and get duplicated.
    ref: "concepts.md#key-design-decisions"

  - id: design-food-delivery-oo-022
    difficulty: intermediate
    tags: [dependency-injection, testability, singleton]
    question: |
      Why does the design prefer constructor-injecting the
      PartnerAssignmentStrategy into FoodDeliveryService over a hard-coded
      Singleton.getInstance() call inside it?
    options:
      - "getInstance() is slower than constructor calls"
      - "Injection lets tests pass a FakeStrategy and lets production swap rules without editing the service — a hard-coded singleton weld makes both impossible"
      - "Singletons cannot implement interfaces"
      - "Constructor injection is required by the Java language specification"
    answer: 1
    explanation: |
      The test seam is the point: with injection, a unit test drives the service
      with a deterministic fake; with a hard getInstance() the concrete strategy is
      welded in. This is Dependency Inversion applied pragmatically, and a common
      senior-signal talking point.
    ref: "concepts.md#key-design-decisions"

  - id: design-food-delivery-oo-023
    difficulty: intermediate
    tags: [api-design, exceptions]
    question: |
      placeOrder can fail because the cart is empty, the restaurant closed, or
      payment was declined. How should the API surface these?
    options:
      - "Return null for all failures and let callers guess the cause"
      - "Return an int error code from placeOrder"
      - "Typed exceptions (EmptyCartException, RestaurantClosedException, PaymentFailedException) so each caller can react appropriately to each cause"
      - "Log the failure and return a half-initialized Order"
    answer: 2
    explanation: |
      Distinct failure causes demand distinct reactions (retry payment vs. show
      "restaurant closed"). Typed exceptions carry that intent; null and error
      codes lose it and invite silent bugs. A half-initialized order is worst — it
      leaks an invalid object into the system.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-food-delivery-oo-024
    difficulty: intermediate
    tags: [api-design, cancellation]
    question: |
      Why does cancelOrder(orderId, byUserId) take the identity of who is
      cancelling?
    options:
      - "To write the user's name into the application log"
      - "Because Java methods must have at least two parameters"
      - "To let the UI display a personalized farewell message"
      - "Customer, restaurant, and system cancellations carry different refund and penalty consequences, so the policy needs the actor"
    answer: 3
    explanation: |
      A restaurant rejecting an order refunds fully; a customer cancelling late may
      forfeit a fee; a system cancellation (no partner found) refunds and may issue
      credit. The actor is an input to the refund policy, so it belongs in the
      signature — not something to reverse-engineer later.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-food-delivery-oo-025
    difficulty: advanced
    tags: [concurrency, race-conditions, assignment]
    question: |
      Two orders run assignPartner concurrently; both filter the pool, both see
      partner P as available, and both assign P. What is this bug and the
      interview-grade fix?
    options:
      - "A check-then-act race — fix with an atomic claim per partner (synchronized tryAcceptOrder or CAS on an availability flag) that re-checks inside the lock; the loser retries the next candidate"
      - "A deadlock — fix by acquiring locks in alphabetical order of partner names"
      - "A memory-visibility bug — fix by making the partner list volatile"
      - "An ABA problem — fix by garbage-collecting partner objects sooner"
    answer: 0
    explanation: |
      The availability check and the assignment are separate steps, so both threads
      pass the check before either acts. Making the claim atomic on the partner
      (re-validating inside the lock) guarantees one winner. Locking the whole pool
      also works but needlessly serializes every assignment.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-food-delivery-oo-026
    difficulty: advanced
    tags: [concurrency, state-machine, cancellation]
    question: |
      The customer taps Cancel at the same instant the partner marks PICKED_UP. Why
      does the synchronized, validated transitionTo method resolve this correctly
      without extra code?
    options:
      - "Both transitions succeed and the observers reconcile the difference"
      - "The lock serializes the two transitions — whichever commits first wins, and the other fails validation against the now-current state with IllegalStateTransitionException"
      - "The customer always wins because customer threads have higher priority"
      - "The JVM detects the conflict and retries both transitions automatically"
    answer: 1
    explanation: |
      Per-order locking plus validation against current state makes the state
      machine itself the concurrency guard: PICKED_UP first means the cancel is
      rejected (food already moving); cancel first means the pickup fails. Scattered
      boolean flags could record both outcomes simultaneously.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-food-delivery-oo-027
    difficulty: advanced
    tags: [edge-cases, cart, validation]
    question: |
      A customer's cart holds an item whose price the owner raised (and another item
      the kitchen 86'd) while the customer was browsing. Where should this be
      caught, and what protects the order afterward?
    options:
      - "Re-validate price and availability at placeOrder, failing with a clear 'cart changed' error; after placement the OrderItem snapshot freezes the agreed prices"
      - "Lock the menu against edits while any cart references it"
      - "Catch nothing — the customer pays whatever price is current at delivery time"
      - "Have the Cart subscribe to menu edits and silently update quantities"
    answer: 0
    explanation: |
      Carts reference live menu items, so checkout is the natural validation gate.
      Locking menus against edits while carts exist would freeze restaurant
      operations. After placement, the snapshot makes the order immune to further
      menu changes — the two mechanisms pair.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-food-delivery-oo-028
    difficulty: intermediate
    tags: [edge-cases, payments, refunds]
    question: |
      Payment succeeds, the order is PLACED, and then the restaurant rejects it.
      What must the design guarantee?
    options:
      - "The order silently returns to the cart for re-checkout"
      - "The customer forfeits payment since the restaurant made the decision"
      - "The order is deleted so no record remains"
      - "The transition PLACED to CANCELLED fires and payment.refund() runs — every cancellation path is paired with its refund consequence"
    answer: 3
    explanation: |
      Money moved, so cancellation must move it back: the cancel transition and the
      refund are one logical action. Deleting the record destroys the audit trail;
      silently re-carting confuses the customer and orphans the charge.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-food-delivery-oo-029
    difficulty: intermediate
    tags: [edge-cases, ratings, guards]
    question: |
      What guards should the rating flow enforce?
    options:
      - "Only the order's own customer may rate, only after DELIVERED, and only once per order"
      - "Anyone may rate any restaurant at any time to maximize feedback volume"
      - "Ratings are allowed from PREPARING onward since the customer has committed"
      - "Only delivery partners may rate restaurants"
    answer: 0
    explanation: |
      Keying the rating to the order id gives all three guards a natural home: the
      order knows its customer, its state, and whether it was already rated.
      Allowing pre-delivery or third-party ratings invites abuse and rates an
      experience that hasn't happened.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-food-delivery-oo-030
    difficulty: intermediate
    tags: [extensibility, discounts, decorator]
    question: |
      The interviewer asks: "Add promo codes — flat, percentage, and
      free-delivery-over-amount — without touching checkout." What is the
      extensible design?
    options:
      - "Add an if-else ladder over promo code strings inside placeOrder"
      - "Store the discount as a negative-priced MenuItem in the cart"
      - "Discount policies behind a PricingRule/DiscountPolicy interface applied by the pricer — a Strategy per code, or Decorator to stack rules over the base bill"
      - "Hard-code each campaign's dates and amounts into the Cart class"
    answer: 2
    explanation: |
      Total computation already flows through one pricer, so discounts plug in as
      policies: Strategy when one rule applies, Decorator when rules stack
      (percentage then free delivery). The if-else ladder reopens checkout for every
      campaign; negative-priced items corrupt the item model.
    ref: "concepts.md#extensibility"

  - id: design-food-delivery-oo-031
    difficulty: intermediate
    tags: [extensibility, surge-pricing, boundaries]
    question: |
      For "add surge pricing on the delivery fee", what is the correct LLD/HLD
      split?
    options:
      - "Both the policy and the demand signal are pure LLD concerns"
      - "Both are HLD, so decline to design anything"
      - "The seam is LLD — a DeliveryFeePolicy strategy (FlatFee, DistanceBasedFee, SurgeFee taking a demand factor); computing the real-time demand factor from citywide signals is HLD"
      - "Surge pricing requires rewriting the order state machine"
    answer: 2
    explanation: |
      LLD owns the pluggable policy seam; the SurgeFee strategy takes a demand
      factor as input. Where that factor comes from (streaming demand aggregation)
      is distributed-systems territory. Naming the split precisely is exactly the
      judgment the round tests.
    ref: "concepts.md#extensibility"

  - id: design-food-delivery-oo-032
    difficulty: advanced
    tags: [extensibility, scheduled-orders, state-machine]
    question: |
      To support scheduled orders ("deliver at 8 pm tomorrow"), what is the minimal
      change to this design?
    options:
      - "A separate ScheduledOrder class hierarchy duplicating the whole lifecycle"
      - "A boolean isScheduled flag checked in every service method"
      - "A cron job that edits the order's status field directly, bypassing transitionTo"
      - "A scheduledFor timestamp plus a new SCHEDULED state that transitions to PLACED when due — one added row in the transition map, everything downstream already keys off states"
    answer: 3
    explanation: |
      Because all behavior keys off the state machine, adding a state is cheap: one
      enum value, one transition edge, one trigger. A parallel class hierarchy
      duplicates logic; a boolean flag reintroduces the scattered-conditional
      problem; bypassing transitionTo skips validation and observers.
    ref: "concepts.md#extensibility"

  - id: design-food-delivery-oo-033
    difficulty: intermediate
    tags: [extensibility, observer-pattern, analytics]
    question: |
      "Add a restaurant analytics dashboard tracking order volume, prep times, and
      cancellation rates." How does the existing design absorb this with zero
      changes to Order?
    options:
      - "Have the dashboard poll every order object once per second"
      - "Add metric-recording calls inside every Order method"
      - "Register an AnalyticsObserver implementing OrderObserver — it accumulates metrics from the same status-change events all other listeners receive"
      - "Subclass Order as AnalyticsOrder and override transitionTo"
    answer: 2
    explanation: |
      This is the Observer pattern paying rent: new listeners register; the subject
      never changes. Instrumenting Order directly couples it to analytics; polling
      wastes work and misses transient states; subclassing forks the lifecycle
      logic.
    ref: "concepts.md#extensibility"

  - id: design-food-delivery-oo-034
    difficulty: advanced
    tags: [extensibility, payments, cod]
    question: |
      "Add cash on delivery." Which design change is required?
    options:
      - "A new isCashOrder boolean on Order checked throughout checkout"
      - "A CashOnDeliveryPayment implementing Payment whose pay() defers capture, settling via an observer when the order reaches DELIVERED, plus one PaymentFactory case"
      - "Skipping the Payment object entirely for cash orders"
      - "A second, parallel order state machine for cash orders"
    answer: 1
    explanation: |
      COD is just a Payment whose capture timing differs: authorize nothing at
      checkout, settle on the DELIVERED transition (an observer is the natural
      hook). The interface and factory absorb it; checkout code is untouched.
      Skipping Payment breaks refund and audit paths.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-food-delivery-oo-035
    difficulty: intermediate
    tags: [extensibility, multi-restaurant-cart]
    question: |
      The interviewer asks: "Now allow a cart with items from multiple
      restaurants." What is the clean evolution?
    options:
      - "Checkout splits the cart into one Order per restaurant, each with its own state machine and partner; the invariant moves from Cart into a CartGroup partitioned by restaurant"
      - "Assign one delivery partner to visit all restaurants sequentially"
      - "Let one Order reference many restaurants and one shared status"
      - "Forbid the feature — the design cannot support it"
    answer: 0
    explanation: |
      Orders stay single-restaurant (one kitchen, one pickup, one lifecycle);
      multiplicity is handled above them by splitting at checkout. One order with
      one status spanning two kitchens breaks immediately — kitchen A can be
      PREPARING while kitchen B already handed off.
    ref: "concepts.md#extensibility"

  - id: design-food-delivery-oo-036
    difficulty: beginner
    tags: [value-objects, location]
    question: |
      Location (lat, lng) with a distanceTo() method is modeled as a value object.
      What does that imply?
    options:
      - "It must be stored in its own database table"
      - "It needs a unique id like every entity"
      - "It must be a mutable singleton shared by all users"
      - "It is immutable, compared by value not identity, and carries its own behavior (distanceTo) so distance math has exactly one home"
    answer: 3
    explanation: |
      Two Locations with the same coordinates are interchangeable — no identity
      needed. Putting distanceTo on the value object keeps the haversine/euclidean
      choice in one testable place instead of re-implemented across strategies.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-food-delivery-oo-037
    difficulty: intermediate
    tags: [srp, god-class]
    question: |
      A candidate puts browse, cart math, payment processing, partner matching, and
      notification sending all as methods on the Order class. What is the core
      critique?
    options:
      - "Order violates SRP — it accumulates reasons to change from five unrelated concerns; matching belongs in a strategy, notification in observers, payment behind its interface"
      - "Order has too many import statements"
      - "The methods should be static for performance"
      - "Order should instead inherit from FoodDeliveryService"
    answer: 0
    explanation: |
      A pricing change, a matching-rule change, a gateway change, and a
      notification-channel change would all edit the same class — the definition of
      SRP violation. The design distributes these into strategy, observer, and
      interface seams so each concern changes independently.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-food-delivery-oo-038
    difficulty: intermediate
    tags: [state-machine, encapsulation]
    question: |
      Why should Order expose transitionTo(next) and keep setStatus(status) private
      or nonexistent?
    options:
      - "Setters are forbidden by Java naming conventions"
      - "transitionTo is shorter to type than setStatus"
      - "A public setter lets any caller jump PLACED straight to DELIVERED, skipping validation and observer notification; transitionTo makes the guarded path the only path"
      - "Private setters compile to faster bytecode"
    answer: 2
    explanation: |
      Encapsulation here is about protecting the invariant: if status can be set
      directly, the transition map and the notification fan-out become optional
      conventions. Making transitionTo the sole mutator turns them into structural
      guarantees.
    ref: "concepts.md#code-skeleton"

  - id: design-food-delivery-oo-039
    difficulty: advanced
    tags: [concurrency, observers, data-structures]
    question: |
      The Order stores observers in a CopyOnWriteArrayList. What problem does this
      choice address in this design?
    options:
      - "It sorts observers so notifications arrive in priority order"
      - "Observers may be registered (e.g., a late analytics sink) while another thread is iterating the list to fire notifications — copy-on-write avoids ConcurrentModificationException without locking every notify"
      - "It compresses the observer list to save memory"
      - "It guarantees each observer is notified exactly once across restarts"
    answer: 1
    explanation: |
      Notification fan-out iterates the list inside transitionTo while registration
      can happen from other threads. Copy-on-write gives safe iteration over a
      snapshot; writes are rare (registrations), reads are frequent (every
      transition) — the exact workload the structure suits.
    ref: "concepts.md#code-skeleton"

  - id: design-food-delivery-oo-040
    difficulty: beginner
    tags: [entities, menu-item]
    question: |
      Which class should own the fact that a dish is temporarily unavailable
      ("86'd") tonight?
    options:
      - "Order — since orders are what fail when the dish is gone"
      - "DeliveryPartner — partners see the kitchen's stock"
      - "Cart — carts should hide unavailable items"
      - "MenuItem — availability is a property of the catalog item, checked by carts and validated again at placeOrder"
    answer: 3
    explanation: |
      Availability is catalog state, so it lives on MenuItem where the owner toggles
      it. Carts and checkout read it (and re-validate at placeOrder), but they don't
      own it — putting it elsewhere scatters menu state across consumers.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-food-delivery-oo-041
    difficulty: intermediate
    tags: [edge-cases, assignment, retry]
    question: |
      No delivery partner is available when an order is CONFIRMED. What should
      happen?
    options:
      - "The order waits in CONFIRMED and assignment retries (or the order queues) — Optional.empty() is a normal outcome, not an exception"
      - "The order is immediately CANCELLED and refunded"
      - "assignPartner throws NoPartnerException and crashes the checkout flow"
      - "The nearest busy partner is force-assigned a second concurrent order"
    answer: 0
    explanation: |
      Peak-hour scarcity is expected, so the design treats it as a wait state:
      the order sits in CONFIRMED while assignment retries. Instant cancellation
      punishes the customer for a transient condition; force-assigning overloaded
      partners corrupts the availability model.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-food-delivery-oo-042
    difficulty: intermediate
    tags: [edge-cases, restaurant, lifecycle]
    question: |
      A restaurant closes for the night while three orders are IN_TRANSIT or
      PREPARING. What is the correct semantics of "closed"?
    options:
      - "All in-flight orders are cancelled and refunded immediately"
      - "Closing blocks new carts and new placeOrder calls, but in-flight orders complete — open/closed is validated at placement time, not retroactively"
      - "In-flight orders pause until the restaurant reopens tomorrow"
      - "Closed restaurants transfer their orders to the nearest open restaurant"
    answer: 1
    explanation: |
      "Open" is an admission-control check at the placeOrder gate. Food already
      being prepared or carried is unaffected by the sign flipping to closed —
      cancelling or pausing it would be absurd operationally and inconsistent with
      the state machine.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-food-delivery-oo-043
    difficulty: advanced
    tags: [concurrency, locking, granularity]
    question: |
      For fixing the double-assignment race, why lock per delivery partner instead
      of one global lock over the whole partner pool?
    options:
      - "Global locks are impossible to implement in Java"
      - "Per-partner locks use less memory than one global lock"
      - "The global lock changes the assignment result to a worse partner"
      - "A pool-wide lock serializes every assignment in the city; per-partner atomic claims let concurrent orders proceed and only collide when they want the same partner"
    answer: 3
    explanation: |
      Correctness is achievable either way; granularity is a throughput decision.
      The contention hot spot is a specific partner, so scope the lock there — the
      loser retries the next candidate. Naming this trade-off is a senior-level
      signal in the round.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-food-delivery-oo-044
    difficulty: intermediate
    tags: [assignment, composite, strategy-pattern]
    question: |
      Ops wants: "try nearest partner; if none within 5 km, fall back to
      least-loaded; if still none, queue the order." How do you express this without
      changing the service?
    options:
      - "Add nested if-else fallbacks inside NearestPartnerStrategy"
      - "A CompositeStrategy implementing PartnerAssignmentStrategy that chains child strategies and returns the first non-empty result"
      - "Call assignPartner three times from the UI layer"
      - "Merge all three rules into one 400-line method for efficiency"
    answer: 1
    explanation: |
      Because every rule shares the PartnerAssignmentStrategy interface, a composite
      that delegates down a chain is itself just another strategy — the service
      still sees one interface. Editing NearestPartnerStrategy pollutes a clean rule
      with fallback logic it shouldn't know about.
    ref: "concepts.md#delivery-partner-assignment-strategy"

  - id: design-food-delivery-oo-045
    difficulty: beginner
    tags: [order-lifecycle, tracking]
    question: |
      trackOrder(orderId) should return what, in this single-process design?
    options:
      - "The current OrderStatus from the order's state machine"
      - "A live GPS map tile of the partner's position"
      - "A machine-learned ETA prediction"
      - "The full payment gateway transaction log"
    answer: 0
    explanation: |
      In-scope tracking is lifecycle state: the customer sees PREPARING,
      IN_TRANSIT, etc., pushed via observers and queryable via trackOrder. Live GPS
      rendering and ETA models are explicitly deferred to HLD — repeating that
      boundary when asked is the right move.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-food-delivery-oo-046
    difficulty: advanced
    tags: [observer-pattern, state-machine, payments]
    question: |
      For cash on delivery, payment capture should happen when the order reaches
      DELIVERED. Which existing mechanism is the natural hook, and why?
    options:
      - "A background thread polling all orders for DELIVERED status every second"
      - "The delivery partner's mobile app calling the payment gateway directly"
      - "An OrderObserver listening for the DELIVERED transition that triggers settlement — the state machine already broadcasts exactly this event to registered listeners"
      - "Overriding Order.equals() to trigger payment on comparison"
    answer: 2
    explanation: |
      The design already guarantees every transition flows through one notifying
      choke point, so "do X when state becomes Y" is always an observer. Polling
      wastes work and adds latency; letting the partner app talk to the gateway
      scatters payment logic outside the Payment abstraction.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-food-delivery-oo-047
    difficulty: intermediate
    tags: [cart, checkout, snapshot]
    question: |
      At placeOrder, cart.snapshotItems() converts CartItems into OrderItems. What
      is this step's precise job?
    options:
      - "Compressing the cart to reduce network payload"
      - "Freezing each item's name and unit price into immutable OrderItems, converting the cart's live references into the order's owned record"
      - "Sorting items alphabetically for the kitchen ticket"
      - "Encrypting item names for payment compliance"
    answer: 1
    explanation: |
      This is the moment the mutable-catalog world (Cart referencing MenuItems)
      crosses into the immutable-record world (Order owning OrderItems). Everything
      about menu-edit safety after placement hinges on this copy happening exactly
      here.
    ref: "concepts.md#code-skeleton"

  - id: design-food-delivery-oo-048
    difficulty: advanced
    tags: [edge-cases, assignment, partner-decline]
    question: |
      An assigned partner goes offline before pickup. The correct handling is to
      re-run assignment excluding that partner. Why does this NOT require a new
      order state like PARTNER_LOST?
    options:
      - "Because states are expensive objects at runtime"
      - "Because partners never actually go offline in production"
      - "It does require the new state — the design is wrong without it"
      - "Assignment is an activity within CONFIRMED/PREPARING, not a lifecycle stage of the food — the order legitimately stays in its current state while a replacement is found"
    answer: 3
    explanation: |
      States model the order's lifecycle, not every operational hiccup. Losing a
      partner before pickup returns the order to "needs assignment" within its
      existing state; the strategy re-runs with the offline partner excluded. State
      proliferation for transient conditions bloats the machine. (After PICKED_UP,
      it becomes an ops escalation instead.)
    ref: "concepts.md#concurrency-and-edge-cases"
