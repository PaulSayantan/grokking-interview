topic: "Design a Ride-Sharing Service (OO)"
domain: lld-and-ood
topic_slug: design-ride-sharing
version: 1
questions:
  - id: design-ride-sharing-001
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      In the first five minutes of "Design a Ride-Sharing Service", which clarifying
      question most shapes your matching and pricing design?
    options:
      - "Which vehicle types exist and how is a driver chosen for a request?"
      - "What color scheme should the rider app use?"
      - "Which cloud provider hosts the service?"
      - "What database engine stores trip history?"
    answer: 0
    explanation: |
      Vehicle types drive both matching (filter candidates by type) and pricing
      (per-type rates), and "how is a driver chosen" is the cue for a matching
      Strategy. UI, hosting, and storage-engine questions don't change the OO model
      of a machine-coding round.
    ref: "concepts.md#requirements-clarification"

  - id: design-ride-sharing-002
    difficulty: beginner
    tags: [hld-vs-lld, boundaries, scoping]
    question: |
      The interviewer asks how you would match drivers across millions of live GPS
      locations in real time. What is the strongest response in a 60-minute LLD round?
    options:
      - "Immediately redesign the classes around a distributed quadtree service"
      - "Spend fifteen minutes deriving geohash sharding math"
      - "Acknowledge it as HLD (geo-index, location streams), then keep matching a single-process scan behind a clean MatchingStrategy interface"
      - "Claim one big HashMap keyed by city solves it at any scale"
    answer: 2
    explanation: |
      The machine-coding round evaluates single-process OO design. Naming the
      distributed answer in a sentence and deferring shows judgment; the
      MatchingStrategy seam is exactly where a real geo-index would plug in later.
      Derailing into infrastructure burns the round.
    ref: "concepts.md#requirements-clarification"

  - id: design-ride-sharing-003
    difficulty: beginner
    tags: [actors, use-cases]
    question: |
      Who are the two primary human actors in the core ride-sharing model, and what
      mediates their interaction?
    options:
      - "Rider and Driver, who call each other's methods directly"
      - "Rider and Admin, mediated by a database"
      - "Driver and Dispatcher, mediated by a message queue"
      - "Rider and Driver, whose every interaction is mediated by a Trip and the RideService"
    answer: 3
    explanation: |
      Rider and Driver are the two actors, but they never talk directly — every
      interaction flows through a Trip and the RideService facade. That mediation is
      what keeps the design from collapsing into two god classes that know too much
      about each other.
    ref: "concepts.md#use-cases-and-actors"

  - id: design-ride-sharing-004
    difficulty: beginner
    tags: [actors, inheritance, entities]
    question: |
      Rider and Driver share id, name, phone, and location but have completely
      different behaviors. What is the standard way to model them?
    options:
      - "An abstract User base holding shared identity, with Rider and Driver subclasses"
      - "One User class with a role string and if-checks in every method"
      - "Two unrelated classes each duplicating the identity fields"
      - "Make Rider the base class because riders register first"
    answer: 0
    explanation: |
      Shared state with divergent behavior is the textbook case for an abstract base:
      identity lives once, each subclass adds its own behavior. A role string with
      if-checks reinvents dynamic dispatch by hand and violates OCP; duplicating fields
      invites drift.
    ref: "concepts.md#use-cases-and-actors"

  - id: design-ride-sharing-005
    difficulty: intermediate
    tags: [noun-verb-extraction, method]
    question: |
      Using noun-verb extraction, the verb "match" in "the system matches the nearest
      available driver" should become what in the design?
    options:
      - "A method on DriverMatchingStrategy, not a class of its own"
      - "A boolean field isMatched on the Driver class"
      - "A new Match entity stored in the database"
      - "A static utility method on the Location value object"
    answer: 0
    explanation: |
      Verbs map to methods/behavior. "Match" is the responsibility of a
      DriverMatchingStrategy.match(...), not an entity. Turning every verb into a class
      (a Match entity) over-models; keeping matching behind a strategy keeps the rule
      swappable and testable.
    ref: "concepts.md#core-objects-via-noun-verb-extraction"

  - id: design-ride-sharing-006
    difficulty: intermediate
    tags: [noun-verb-extraction, value-object, filtering]
    question: |
      During noun extraction you list "Location" and "Fare" as candidate classes. What
      is the correct filtering verdict for both?
    options:
      - "Location is an entity but Fare is just a double"
      - "Both are long-lived entities with their own database tables"
      - "Neither should appear in the design at all"
      - "Both are value objects (immutable, no identity), not entities"
    answer: 3
    explanation: |
      Filtering discipline: not every noun is an entity. Location (lat, lng with
      distanceTo) and Fare (the computed result of pricing) are immutable value objects
      with no lifecycle identity. Modeling them as entities with identity and tables is
      over-modeling.
    ref: "concepts.md#core-objects-via-noun-verb-extraction"

  - id: design-ride-sharing-007
    difficulty: intermediate
    tags: [noun-verb-extraction, god-class, decomposition]
    question: |
      The requirements mention "the system." How should this vague noun be handled in
      the object model?
    options:
      - "Model it as one System class that owns all state and logic"
      - "Ignore it — systems are not modeled in OO design"
      - "Decompose it into a thin RideService facade plus focused services (matching, pricing, payment, notification)"
      - "Rename Driver to System since the driver does most of the work"
    answer: 2
    explanation: |
      "The system" is a red flag for a god class. Decompose it into a thin RideService
      facade that orchestrates, delegating to focused single-responsibility services.
      This keeps each class cohesive and the live-coding session navigable.
    ref: "concepts.md#core-objects-via-noun-verb-extraction"

  - id: design-ride-sharing-008
    difficulty: intermediate
    tags: [relationships, composition, aggregation]
    question: |
      A Trip owns its Fare but merely references its Driver. How should these two
      relationships be modeled?
    options:
      - "Both as composition, since the Trip holds both"
      - "Both as aggregation, since neither is truly owned"
      - "Fare as composition (created by and dies with the trip); Driver as aggregation (outlives the trip, shared across many)"
      - "Fare as inheritance from Trip; Driver as a static field"
    answer: 2
    explanation: |
      The fare is created by the trip and has no meaning without it — composition. The
      driver exists independently and serves many trips over time — aggregation
      /association. Getting this composition-vs-aggregation pair right is a classic
      diagram probe.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-ride-sharing-009
    difficulty: intermediate
    tags: [relationships, composition]
    question: |
      How should the relationship between Driver and Vehicle be modeled in this design?
    options:
      - "Aggregation — the vehicle is shared across all drivers"
      - "Inheritance — Driver extends Vehicle"
      - "No relationship — vehicles are stored globally and looked up by plate"
      - "Composition — the vehicle is part of the driver's model for its lifetime"
    answer: 3
    explanation: |
      A driver owns a vehicle for the model's lifetime, so composition is the natural
      fit. Inheritance would be wrong (a driver is not a kind of vehicle), and a shared
      global vehicle contradicts the one-driver-one-vehicle reality of the model.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-ride-sharing-010
    difficulty: intermediate
    tags: [crc, single-responsibility]
    question: |
      In a CRC breakdown, which responsibility correctly belongs to the Trip class
      rather than elsewhere?
    options:
      - "Guarding its own status transitions and notifying observers on change"
      - "Computing the base + per-km + per-minute fare formula"
      - "Deciding which driver is nearest to the pickup"
      - "Storing the global registry of all riders and drivers"
    answer: 0
    explanation: |
      Trip knows its own lifecycle, so guarding transitions and firing observers is its
      job. Matching belongs to a MatchingStrategy, fare formula to a PricingStrategy,
      and the global registries to RideService. Single responsibility per class.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-ride-sharing-011
    difficulty: intermediate
    tags: [multiplicity, relationships]
    question: |
      What is the correct multiplicity between a Driver and active Trips at any single
      moment?
    options:
      - "A driver has many active trips simultaneously"
      - "A driver has exactly one active trip at a time, but many over its lifetime"
      - "A driver has zero trips ever; trips belong only to riders"
      - "A trip can have many drivers assigned at once"
    answer: 1
    explanation: |
      In the base (non-pool) design a driver serves one active trip at a time, and many
      trips across its lifetime. Allowing many simultaneous active trips per driver would
      break the availability/state model and enable double-booking.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-ride-sharing-012
    difficulty: beginner
    tags: [state-machine, trip-status]
    question: |
      Why model the trip lifecycle as an explicit TripStatus enum with guarded
      transitions rather than a set of booleans like isAssigned, isInProgress,
      isCancelled?
    options:
      - "Booleans allow impossible combinations (e.g. cancelled and in progress); an explicit state machine makes illegal states unrepresentable"
      - "Booleans use more memory than an enum"
      - "Enums are faster than booleans at runtime"
      - "Enums automatically persist to the database"
    answer: 0
    explanation: |
      Independent booleans can drift into contradictory combinations like "cancelled and
      in progress." A single status enum plus a validated transition map makes illegal
      states impossible by construction, and it centralizes the transition rules.
    ref: "concepts.md#driver-and-trip-state-machines"

  - id: design-ride-sharing-013
    difficulty: intermediate
    tags: [state-machine, cancellation]
    question: |
      In the trip state machine, from which state is cancellation disallowed entirely?
    options:
      - "IN_PROGRESS"
      - "DRIVER_ASSIGNED"
      - "REQUESTED"
      - "Cancellation is always allowed from any state"
    answer: 0
    explanation: |
      Cancellation is free before DRIVER_ASSIGNED, may incur a fee after assignment (the
      driver drove toward pickup), and is disallowed once IN_PROGRESS — the trip is
      actively running. This state-dependent guard lives in the transition validation,
      not the UI.
    ref: "concepts.md#driver-and-trip-state-machines"

  - id: design-ride-sharing-014
    difficulty: intermediate
    tags: [state-machine, coupling, driver-status]
    question: |
      How are the trip state machine and the driver state machine related?
    options:
      - "They are completely independent and never affect each other"
      - "They are coupled: assigning a trip flips the driver to EN_ROUTE_TO_PICKUP and removes them from the candidate pool; completing or cancelling frees them"
      - "The driver status is derived by querying the database on every read"
      - "Driver status is just a copy of the trip status with the same enum values"
    answer: 1
    explanation: |
      The two machines move in lockstep: assignment flips the driver to
      EN_ROUTE_TO_PICKUP and pulls them from the available pool; completion or
      cancellation returns them to AVAILABLE. Keeping driver status synced with trip
      status is precisely what prevents double-booking.
    ref: "concepts.md#driver-and-trip-state-machines"

  - id: design-ride-sharing-015
    difficulty: intermediate
    tags: [state-machine, terminal-states]
    question: |
      A code path tries to transition a trip from COMPLETED to IN_PROGRESS. What should
      happen?
    options:
      - "The transition succeeds silently and the trip restarts"
      - "It throws IllegalStateTransitionException because COMPLETED is terminal"
      - "The transition is ignored and returns the current state"
      - "The trip is automatically cloned into a new trip"
    answer: 1
    explanation: |
      COMPLETED and CANCELLED are terminal states with no outgoing transitions. Any
      attempt to leave them must throw IllegalStateTransitionException, surfacing the bug
      rather than silently corrupting the lifecycle.
    ref: "concepts.md#driver-and-trip-state-machines"

  - id: design-ride-sharing-016
    difficulty: advanced
    tags: [state-machine, state-pattern, transition-map]
    question: |
      When is upgrading from an enum-plus-transition-map to the full State pattern (one
      class per state) justified?
    options:
      - "Always — the State pattern is strictly better than a transition map"
      - "When each state needs distinct behavior (e.g. per-state cancellation-fee rules), not just transition validation"
      - "Never — transition maps can express any lifecycle"
      - "Only when there are more than three states"
    answer: 1
    explanation: |
      A transition map is the pragmatic answer when you only need to validate legal
      moves. Upgrade to State classes when states carry distinct behavior — each state
      computing its own cancellation fee or allowed actions. Start with the map and name
      the upgrade path.
    ref: "concepts.md#driver-and-trip-state-machines"

  - id: design-ride-sharing-017
    difficulty: intermediate
    tags: [strategy, matching, ocp]
    question: |
      Why is driver matching modeled as a Strategy interface rather than an if-else chain
      inside RideService?
    options:
      - "Strategy objects run faster than conditionals"
      - "Java forbids if-else inside service classes"
      - "The matching rule is volatile; Strategy lets new rules be added without modifying the dispatcher (OCP) and each rule is independently testable"
      - "It reduces the number of classes in the design"
    answer: 2
    explanation: |
      The matching rule (nearest, highest-rated, least-busy) changes constantly. Strategy
      makes each rule an independently unit-testable class, lets new rules be added
      without touching the dispatcher (Open/Closed), and keeps the service depending only
      on the interface (DIP).
    ref: "concepts.md#driver-matching-strategy"

  - id: design-ride-sharing-018
    difficulty: intermediate
    tags: [strategy, matching, optional]
    question: |
      What should DriverMatchingStrategy.match return when no suitable driver is
      available, and why?
    options:
      - "null, so callers can check for it"
      - "Optional<Driver> (empty when none), because no driver is a normal outcome, not an error"
      - "A default dummy driver so the trip always proceeds"
      - "It should throw a checked exception every time none is found"
    answer: 1
    explanation: |
      "No driver available" is an expected outcome, not an exceptional one. Returning
      Optional.empty() lets the caller cleanly route the trip to CANCELLED or a retry
      queue. null invites NPEs; a dummy driver corrupts the model; throwing on a routine
      case abuses exceptions.
    ref: "concepts.md#driver-matching-strategy"

  - id: design-ride-sharing-019
    difficulty: advanced
    tags: [strategy, matching, composite]
    question: |
      Ops wants matching to try "nearest available premium, else nearest economy, else
      none." What is the cleanest OO way to express this?
    options:
      - "Add nested if-else branches inside NearestDriverStrategy"
      - "Duplicate the whole RideService with a different method"
      - "Store the fallback order in a global static variable read everywhere"
      - "A CompositeMatchingStrategy that chains sub-strategies as fallbacks behind the same interface"
    answer: 3
    explanation: |
      Chaining fallbacks composes cleanly with a CompositeMatchingStrategy that holds
      ordered sub-strategies and returns the first non-empty match — all behind the same
      DriverMatchingStrategy interface. This keeps each rule simple and the composition
      itself swappable.
    ref: "concepts.md#driver-matching-strategy"

  - id: design-ride-sharing-020
    difficulty: intermediate
    tags: [strategy, matching, filtering]
    question: |
      In NearestDriverStrategy, before selecting the closest driver, what must the filter
      step check besides distance?
    options:
      - "The driver's status is AVAILABLE and the vehicle type matches the request"
      - "Nothing — closest driver always wins"
      - "The driver's bank account balance"
      - "Whether the rider has rated this driver before"
    answer: 0
    explanation: |
      Candidates must be filtered to AVAILABLE drivers whose vehicle type matches the
      request before minimizing distance. Selecting the geographically closest driver who
      is busy or driving the wrong vehicle type would produce an invalid match.
    ref: "concepts.md#driver-matching-strategy"

  - id: design-ride-sharing-021
    difficulty: intermediate
    tags: [pricing, strategy, surge]
    question: |
      Why is fare computation modeled as a PricingStrategy, and where does surge fit?
    options:
      - "Pricing is fixed, so a single hard-coded method is enough"
      - "Surge must be computed inside the Trip class using live demand data"
      - "The fare formula varies by city/vehicle and surge must plug in without touching call sites; surge is a strategy (e.g. SurgePricingStrategy) taking the multiplier as input"
      - "Pricing belongs in the Payment class since both deal with money"
    answer: 2
    explanation: |
      The formula and surge policy change per city and time, so a PricingStrategy keeps
      "add surge" an Open/Closed change — a new SurgePricingStrategy, no edits to Trip or
      Fare. The surge multiplier is an input; computing it from live demand is HLD.
    ref: "concepts.md#pricing-strategy"

  - id: design-ride-sharing-022
    difficulty: advanced
    tags: [pricing, surge, edge-cases]
    question: |
      To prevent the fare from jumping between when the rider requests and when the trip
      completes, when should the surge multiplier be captured?
    options:
      - "At trip completion, using the current multiplier"
      - "It should be recomputed every second during the trip"
      - "Surge should never be stored, only recomputed on demand"
      - "At request/quote time, snapshotting the multiplier into the trip"
    answer: 3
    explanation: |
      Capturing the surge multiplier at request/quote time and snapshotting it into the
      trip freezes the agreed price, so the fare doesn't jump if surge changes mid-trip.
      This mirrors how orders snapshot prices rather than reading live mutable values.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-ride-sharing-023
    difficulty: intermediate
    tags: [observer, notifications]
    question: |
      Trip status updates must reach the rider and driver, and later an analytics sink.
      Which pattern fits, and what does the Trip know about its listeners?
    options:
      - "Observer; the Trip knows that it has observers but never who they concretely are"
      - "Observer; the Trip must hold direct references to the Rider and Driver notification code"
      - "Strategy; the Trip picks one notification algorithm at a time"
      - "Singleton; there is one global notifier the Trip calls directly"
    answer: 0
    explanation: |
      Observer fits status fan-out. The Trip (subject) fires onStatusChange and knows
      only that observers exist, never their concrete types. Adding an analytics listener
      touches zero Trip code — the whole point of decoupling subject from observers.
    ref: "concepts.md#key-design-decisions"

  - id: design-ride-sharing-024
    difficulty: intermediate
    tags: [observer, single-choke-point]
    question: |
      How does the design guarantee that no code path can change a trip's status without
      firing notifications?
    options:
      - "Every service method manually calls the notifier after setting status"
      - "transitionTo is the only mutator of status, and it fires observers as part of the transition"
      - "A nightly job diffs statuses and sends missed notifications"
      - "The database emits a trigger on the status column"
    answer: 1
    explanation: |
      Making transitionTo the single mutator of status, which fires observers inline,
      creates one choke point. New code paths that change status must go through it, so
      notifications can never be forgotten — far safer than relying on every call site to
      remember.
    ref: "concepts.md#code-skeleton"

  - id: design-ride-sharing-025
    difficulty: intermediate
    tags: [factory, payment]
    question: |
      Adding a new payment method (say WalletPayment) should require what, given a
      PaymentFactory and Payment interface?
    options:
      - "Editing switch statements scattered throughout the checkout flow"
      - "A new subclass of Trip for wallet trips"
      - "Rewriting RideService.endTrip to know about wallets"
      - "One new Payment implementation class plus one new factory case; call sites work against the Payment interface unchanged"
    answer: 3
    explanation: |
      With a Payment interface and a PaymentFactory, a new method is one implementation
      class plus one factory case. Because charging code works against the interface, no
      call site changes — the classic Open/Closed payoff of Factory + polymorphism.
    ref: "concepts.md#key-design-decisions"

  - id: design-ride-sharing-026
    difficulty: intermediate
    tags: [facade, ride-service]
    question: |
      What is the primary role of the RideService class in this design?
    options:
      - "To hold all business logic including matching and pricing formulas inline"
      - "A data transfer object passed between the rider and driver apps"
      - "A Facade: a thin entry point that orchestrates the flow and delegates to matching, pricing, payment, and notification"
      - "A Singleton whose only job is to enforce one instance"
    answer: 2
    explanation: |
      RideService is a Facade — one navigable entry point for the demo/driver that
      delegates to focused components. Putting matching and pricing formulas inline would
      recreate a god class; being merely a DTO or a Singleton-for-its-own-sake misses the
      orchestration role.
    ref: "concepts.md#key-design-decisions"

  - id: design-ride-sharing-027
    difficulty: advanced
    tags: [singleton, dependency-injection, testability]
    question: |
      The interviewer suggests making the matching service a Singleton with getInstance().
      What is the better-justified alternative?
    options:
      - "Use a Singleton — it is the standard pattern for services"
      - "Wire a single RideService with its strategies via constructor injection, which is far easier to test with fakes"
      - "Use two Singletons for redundancy"
      - "Make every class static so no instances are needed"
    answer: 1
    explanation: |
      A hard getInstance() Singleton bakes in a global and makes swapping in a fake
      strategy for tests painful. Constructor-injecting the strategies into a single
      RideService instance gives the same "one instance" outcome while keeping the design
      testable. Mention Singleton, prefer injection.
    ref: "concepts.md#key-design-decisions"

  - id: design-ride-sharing-028
    difficulty: intermediate
    tags: [api, method-signatures]
    question: |
      Why does acceptTrip(driverId, tripId) return a boolean rather than void or throwing
      on failure?
    options:
      - "Booleans are required by the Java compiler for concurrency"
      - "To indicate whether the driver's app is online"
      - "Because void methods cannot be synchronized"
      - "So the loser of a concurrent race gets false and the offer is re-routed, rather than treating a lost race as an exception"
    answer: 3
    explanation: |
      Two drivers (or two trips racing one driver) can collide; the loser getting false
      lets the system cleanly re-route the offer to the next candidate. A lost race is an
      expected concurrent outcome, not an exceptional error, so boolean beats throwing.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-ride-sharing-029
    difficulty: intermediate
    tags: [api, single-responsibility, end-trip]
    question: |
      In the API, endTrip(tripId) is described as the single choke point for several
      actions. Which set?
    options:
      - "Registering the driver and setting their location"
      - "Matching a new driver and sending the first notification"
      - "Computing the fare via PricingStrategy, charging payment, transitioning to COMPLETED, and freeing the driver"
      - "Cancelling the trip and issuing a refund"
    answer: 2
    explanation: |
      endTrip is where price is computed (PricingStrategy), payment is charged, the trip
      transitions to COMPLETED, and the driver returns to AVAILABLE — all in one path.
      Consolidating these avoids duplicating the completion logic across call sites.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-ride-sharing-030
    difficulty: intermediate
    tags: [api, cancellation]
    question: |
      Why does cancelTrip take a byUserId parameter identifying who is cancelling?
    options:
      - "For logging only; it has no effect on behavior"
      - "To decide which database shard to write to"
      - "Because rider vs. driver cancellations carry different fee/penalty consequences"
      - "Because Java requires all methods to identify the caller"
    answer: 2
    explanation: |
      Who cancels matters: a rider cancelling after assignment may owe a fee, while a
      driver cancelling may incur a penalty and trigger re-matching. The parameter lets
      the state-dependent fee/penalty logic branch correctly.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-ride-sharing-031
    difficulty: advanced
    tags: [concurrency, double-match, check-then-act]
    question: |
      Two riders' requests match the same free driver at nearly the same instant. What is
      the underlying bug category and the correct fix?
    options:
      - "A check-then-act race (filter AVAILABLE, then assign); fix with an atomic per-driver claim like synchronized tryAccept or a CAS on status"
      - "A deadlock; fix by removing all locks"
      - "A memory leak; fix by nulling references"
      - "A stack overflow; fix by increasing thread stack size"
    answer: 0
    explanation: |
      Filtering for AVAILABLE and then assigning is a classic check-then-act race. The
      fix is an atomic claim on the driver — a synchronized tryAccept (or CAS on status)
      that re-checks availability inside the lock and returns false to the loser, who
      re-matches against the next candidate.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-ride-sharing-032
    difficulty: advanced
    tags: [concurrency, locking-granularity]
    question: |
      When making driver assignment atomic, why lock per driver rather than locking the
      entire driver pool?
    options:
      - "Per-pool locking is impossible in Java"
      - "Per-driver locks use less memory than a pool lock"
      - "Locking the whole pool serializes every assignment across the system, killing throughput; per-driver locking only contends when two requests target the same driver"
      - "The pool lock would cause a compile error"
    answer: 2
    explanation: |
      A single pool-wide lock forces every assignment to run one at a time, destroying
      throughput. Locking per driver means contention only occurs when two requests
      genuinely target the same driver — correct and far more scalable within the process.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-ride-sharing-033
    difficulty: advanced
    tags: [concurrency, cancel-vs-start, state-machine]
    question: |
      A rider cancels at the same instant the driver marks the trip IN_PROGRESS. How does
      the design ensure exactly one wins?
    options:
      - "It uses a database transaction with SERIALIZABLE isolation"
      - "Both operations are allowed and the last write wins silently"
      - "transitionTo is synchronized per trip and validates against the current state, so whichever commits first wins and the other throws IllegalStateTransitionException"
      - "A background thread reconciles the conflict every minute"
    answer: 2
    explanation: |
      Because transitionTo is synchronized per trip and checks the current state, the
      first transition to commit wins; the second sees an illegal move from the new state
      and throws. The guarded state machine itself is the concurrency guard — this is why
      booleans lose.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-ride-sharing-034
    difficulty: advanced
    tags: [concurrency, payment, edge-cases]
    question: |
      Payment fails during endTrip after the trip is already COMPLETED. What is the best
      handling?
    options:
      - "Roll the trip back to IN_PROGRESS and keep the driver occupied"
      - "Mark the fare unpaid and enqueue a retry/settlement, without blocking completion or leaving the driver stuck IN_TRIP"
      - "Silently discard the fare and free the driver"
      - "Throw an exception that aborts the whole endTrip and leaves status inconsistent"
    answer: 1
    explanation: |
      The service was already delivered, so completion should stand. Mark the fare unpaid
      and enqueue a retry/settlement, and be sure to free the driver. Rolling back a
      delivered trip or leaving the driver stuck IN_TRIP both corrupt the model.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-ride-sharing-035
    difficulty: intermediate
    tags: [edge-cases, ratings]
    question: |
      Where should the guard "only trip participants, only after COMPLETED, only once
      each" for ratings live?
    options:
      - "In the rating service, keyed by trip id"
      - "In the mobile UI layer only"
      - "Inside the Location value object"
      - "In the PaymentFactory"
    answer: 0
    explanation: |
      Rating rules are domain invariants, so they belong in the rating service keyed by
      trip id — not in the UI (which can be bypassed) nor in unrelated classes like
      Location or PaymentFactory. This keeps the guard authoritative and reusable.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-ride-sharing-036
    difficulty: intermediate
    tags: [edge-cases, driver-offline]
    question: |
      A driver goes offline just as an offer is routed to them. With an atomic tryAccept,
      what happens?
    options:
      - "tryAccept sees status is not AVAILABLE and returns false, so matching moves on to the next candidate"
      - "The trip is silently lost with no driver"
      - "The offline driver is forced to take the trip anyway"
      - "The system crashes because the driver reference is null"
    answer: 0
    explanation: |
      tryAccept re-checks status inside its lock; a driver no longer AVAILABLE returns
      false, and matching proceeds to the next candidate. This is the same atomic-claim
      mechanism that resolves the double-match race, handling the offline case for free.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-ride-sharing-037
    difficulty: advanced
    tags: [extensibility, carpool, ocp]
    question: |
      Adding carpool/pool rides (multiple riders sharing one trip) should ideally require
      what kind of change?
    options:
      - "A rewrite of the Trip, matching, and pricing classes from scratch"
      - "Deleting the single-rider Trip and replacing all references"
      - "Additions: multiple rider legs on the trip, a route-fit matching strategy, and a fare-split pricing strategy — not edits to existing rules"
      - "Adding boolean flags isPool and isShared throughout the codebase"
    answer: 2
    explanation: |
      Because matching and pricing sit behind strategy interfaces, pool rides come as
      additions: multiple TripLegs, a new route-fit MatchingStrategy, and a new
      fare-split PricingStrategy. Open/Closed in action — existing single-rider rules
      stay untouched.
    ref: "concepts.md#extensibility"

  - id: design-ride-sharing-038
    difficulty: intermediate
    tags: [extensibility, scheduled-rides, state-machine]
    question: |
      To support scheduled rides, what is the minimal change to the trip lifecycle?
    options:
      - "Rewrite the entire state machine to be time-based"
      - "Add a separate parallel class hierarchy for scheduled trips"
      - "Add a scheduledFor timestamp and a SCHEDULED state that transitions to REQUESTED when due; downstream logic already keys off states"
      - "Store scheduled trips in a different database and skip the state machine"
    answer: 2
    explanation: |
      Scheduled rides add one timestamp and one SCHEDULED state that fires into REQUESTED
      when due (via a scheduler/delay queue). Because everything downstream already keys
      off trip states, only the transition map gains a row — a clean, localized extension.
    ref: "concepts.md#extensibility"

  - id: design-ride-sharing-039
    difficulty: intermediate
    tags: [extensibility, analytics, observer]
    question: |
      Adding a driver-incentive tally that counts completed trips per driver should be
      implemented how, to avoid touching Trip?
    options:
      - "Add counting code directly inside Trip.transitionTo"
      - "Register an Analytics/incentive observer that reacts to the completion status-change event"
      - "Poll the database every minute for completed trips"
      - "Add an incentiveCount field to the Location value object"
    answer: 1
    explanation: |
      The completion event already flows through the observer hook, so an incentive
      observer can tally trips per driver with zero changes to Trip. This reuses the same
      event stream that powers notifications and analytics.
    ref: "concepts.md#extensibility"

  - id: design-ride-sharing-040
    difficulty: intermediate
    tags: [extensibility, vehicle-type]
    question: |
      Adding a new vehicle type such as BIKE requires what, given the existing design?
    options:
      - "A new subclass of Trip and Driver for bikes"
      - "Rewriting NearestDriverStrategy to special-case bikes"
      - "An enum value plus a pricing Rates entry; matching already filters by type, so no structural change"
      - "A separate RideService instance dedicated to bikes"
    answer: 2
    explanation: |
      VehicleType is an enum and pricing keys rates by type, while matching already
      filters candidates by type. So a new type is an enum value plus a rates entry — no
      structural change and no edits to matching logic.
    ref: "concepts.md#extensibility"

  - id: design-ride-sharing-041
    difficulty: advanced
    tags: [hld-vs-lld, boundaries, scaling]
    question: |
      When asked "how would this change for millions of drivers and live GPS," which
      answer stays in the LLD lane?
    options:
      - "Redesign the class model around Kafka topics and shards on the spot"
      - "Refuse to discuss it because it is out of scope"
      - "Add a distributedMode boolean to every class"
      - "Name the HLD pieces (geo-index like geohash/H3/quadtree, location streams, push infra, demand-based surge) and note the Strategy/Observer seams are where they plug in"
    answer: 3
    explanation: |
      The right move is to name the distributed pieces briefly and point out that the
      existing Strategy and Observer seams are exactly where those systems would attach,
      then keep this round's code single-process. Redesigning on the spot or refusing
      both miss the mark.
    ref: "concepts.md#extensibility"

  - id: design-ride-sharing-042
    difficulty: intermediate
    tags: [class-diagram, uml, relationships]
    question: |
      In the UML class diagram, which arrow correctly represents "NearestDriverStrategy
      realizes the DriverMatchingStrategy interface"?
    options:
      - "NearestDriverStrategy --|> DriverMatchingStrategy"
      - "DriverMatchingStrategy <|.. NearestDriverStrategy"
      - "NearestDriverStrategy --* DriverMatchingStrategy"
      - "NearestDriverStrategy o-- DriverMatchingStrategy"
    answer: 1
    explanation: |
      A dashed hollow-triangle arrow (..|> in Mermaid, shown as <|.. from the interface
      side) denotes realization — a class implementing an interface. Solid --|> is
      inheritance, --* is composition, and o-- is aggregation.
    ref: "concepts.md#class-diagram"

  - id: design-ride-sharing-043
    difficulty: intermediate
    tags: [class-diagram, uml, dependency]
    question: |
      PaymentFactory creates Payment objects but does not own them. Which UML relationship
      and arrow best captures this?
    options:
      - "A dependency, PaymentFactory ..> Payment (creates)"
      - "Composition, PaymentFactory --* Payment"
      - "Inheritance, PaymentFactory --|> Payment"
      - "Aggregation, PaymentFactory o-- Payment"
    answer: 0
    explanation: |
      "Creates but does not own" is a transient dependency, drawn with a dashed arrow
      (..> in Mermaid). Composition/aggregation would wrongly imply ownership/holding,
      and inheritance would wrongly imply the factory is a kind of payment.
    ref: "concepts.md#class-diagram"

  - id: design-ride-sharing-044
    difficulty: beginner
    tags: [entities, value-object, location]
    question: |
      What is the most appropriate design for Location in this system?
    options:
      - "A mutable entity with a database id and setter methods"
      - "A subclass of User"
      - "An immutable value object holding (lat, lng) with a distanceTo() method"
      - "A global Singleton shared by all trips"
    answer: 2
    explanation: |
      Location has no identity and should not change once created — an immutable value
      object with (lat, lng) and a distanceTo() helper. Giving it an id and setters, or
      making it a Singleton, contradicts its value semantics.
    ref: "concepts.md#core-objects-via-noun-verb-extraction"

  - id: design-ride-sharing-045
    difficulty: advanced
    tags: [pricing, code-skeleton, vehicle-type]
    question: |
      BasePricingStrategy computes base + per-km + per-minute. How should per-type rates
      be supplied so adding a vehicle type stays clean?
    options:
      - "Hard-code an if-else on VehicleType inside calculate()"
      - "Store rates as constants recompiled for each city"
      - "Hold a Map<VehicleType, Rates> and look up the trip's vehicle type; a new type is a new map entry"
      - "Ask the rider to type in the rate at request time"
    answer: 2
    explanation: |
      Keying rates by VehicleType in a Map lets calculate() look up the right rates and
      makes a new vehicle type a single map entry — no code edits. An if-else chain grows
      and must be re-tested every time a type is added.
    ref: "concepts.md#pricing-strategy"

  - id: design-ride-sharing-046
    difficulty: intermediate
    tags: [code-skeleton, concurrency, atomic-claim]
    question: |
      In the skeleton, Driver.tryAccept is synchronized and checks status before setting
      it to EN_ROUTE_TO_PICKUP. What property does this give the assignment?
    options:
      - "It makes assignment eventually consistent across nodes"
      - "It guarantees the nearest driver is always chosen"
      - "It turns the check-and-set on driver status into one atomic operation, so only one concurrent trip can claim the driver"
      - "It removes the need for the trip state machine"
    answer: 2
    explanation: |
      By checking availability and flipping status inside a single synchronized method,
      tryAccept is an atomic compare-and-set: only one of two racing trips can win the
      driver. It doesn't affect matching quality and doesn't replace the trip state
      machine — it complements it.
    ref: "concepts.md#code-skeleton"

  - id: design-ride-sharing-047
    difficulty: advanced
    tags: [entities, snapshot, fare, immutability]
    question: |
      Why does the design store the computed Fare (and its surge multiplier) on the Trip
      rather than recomputing it whenever someone reads the receipt?
    options:
      - "Recomputation is too slow to run twice"
      - "Java cannot recompute doubles reliably"
      - "The fare is a record of what was agreed; recomputing later against changed rates or surge would silently rewrite the receipt"
      - "It reduces the number of classes in the diagram"
    answer: 2
    explanation: |
      Like an order snapshotting prices, a completed trip's Fare is the agreed record.
      Recomputing against tomorrow's rates or a different surge would silently change a
      historical receipt. Storing the fare (with its captured surge) freezes the
      agreement.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-ride-sharing-048
    difficulty: intermediate
    tags: [requirements, scoping, surge]
    question: |
      When the interviewer mentions surge pricing, which part is fair game for the LLD
      round and which is HLD?
    options:
      - "Both the pricing seam and the demand computation are LLD"
      - "The pricing seam (a SurgePricingStrategy taking a multiplier) is LLD; computing the multiplier from real-time demand signals is HLD"
      - "Both are HLD and should be skipped entirely"
      - "The multiplier computation is LLD; the pricing strategy is HLD"
    answer: 1
    explanation: |
      Modeling surge as a pluggable pricing strategy that accepts a multiplier is squarely
      LLD. Deriving that multiplier from live demand, geography, and time-series signals
      is a distributed-systems/HLD problem — name it and keep the multiplier an input.
    ref: "concepts.md#requirements-clarification"

  - id: design-ride-sharing-049
    difficulty: advanced
    tags: [design-principles, dip, strategy]
    question: |
      RideService holds a DriverMatchingStrategy field and never references
      NearestDriverStrategy directly. Which principle does this most directly demonstrate?
    options:
      - "Single Responsibility Principle"
      - "Interface Segregation Principle"
      - "Dependency Inversion Principle — depend on the abstraction, not the concrete strategy"
      - "Liskov Substitution Principle"
    answer: 2
    explanation: |
      Depending on the DriverMatchingStrategy interface rather than a concrete
      implementation is the Dependency Inversion Principle: high-level policy
      (RideService) depends on an abstraction, and concrete strategies are injected. This
      is what enables swapping and fake-injection in tests.
    ref: "concepts.md#key-design-decisions"

  - id: design-ride-sharing-050
    difficulty: intermediate
    tags: [use-cases, driver, state-machine]
    question: |
      A driver's status typically moves through which sequence during one successful
      trip?
    options:
      - "OFFLINE to IN_TRIP to AVAILABLE, skipping pickup"
      - "AVAILABLE to COMPLETED to OFFLINE"
      - "IN_TRIP to AVAILABLE to EN_ROUTE_TO_PICKUP"
      - "AVAILABLE to EN_ROUTE_TO_PICKUP to IN_TRIP, then back to AVAILABLE on completion"
    answer: 3
    explanation: |
      Online driver is AVAILABLE; accepting an offer moves them to EN_ROUTE_TO_PICKUP;
      starting the trip moves them to IN_TRIP; completing the trip returns them to
      AVAILABLE (or OFFLINE). The status tracks the trip lifecycle in lockstep.
    ref: "concepts.md#driver-and-trip-state-machines"

  - id: design-ride-sharing-051
    difficulty: advanced
    tags: [patterns, boundaries, cross-reference]
    question: |
      In this problem, how should you treat the GoF pattern definitions themselves (e.g.
      the precise structure of Observer)?
    options:
      - "Re-derive each pattern's full UML from first principles during the round"
      - "Name the pattern and why it fits the requirement, cross-referencing the design-patterns topics rather than re-teaching the pattern's mechanics"
      - "Avoid naming patterns to keep the design original"
      - "Invent new pattern names specific to ride-sharing"
    answer: 1
    explanation: |
      The design-patterns (dp-*) domain owns the GoF taxonomy. In an LLD problem you name
      the pattern and justify it against a concrete requirement, cross-referencing the
      pattern topic — re-teaching Observer's full structure wastes the round, and avoiding
      pattern names hides your reasoning.
    ref: "concepts.md#key-design-decisions"

  - id: design-ride-sharing-052
    difficulty: beginner
    tags: [entities, trip-request]
    question: |
      What is the purpose of a separate TripRequest class distinct from Trip?
    options:
      - "It is a duplicate of Trip kept for backup"
      - "It stores the driver's earnings history"
      - "It carries the rider's ask (source, destination, requested vehicle type) into matching, before a driver and a full Trip exist"
      - "It is the persistence layer for Trip"
    answer: 2
    explanation: |
      TripRequest models the rider's ask — from, to, and desired vehicle type — that
      feeds the matching strategy before any driver is assigned. Once matched, the Trip
      becomes the full aggregate with a driver, status, and fare. Separating them keeps
      the pre-match ask distinct from the committed trip.
    ref: "concepts.md#core-objects-via-noun-verb-extraction"
