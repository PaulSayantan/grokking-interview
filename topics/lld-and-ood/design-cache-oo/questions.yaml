topic: "Design an LRU / LFU Cache (OO)"
domain: lld-and-ood
topic_slug: design-cache-oo
version: 1
questions:
  - id: design-cache-oo-001
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      In the first five minutes of "design a cache," the interviewer says nothing about
      distribution. What is the correct scoping move for the LLD round?
    options:
      - "Design a sharded cache with consistent hashing, since real caches are distributed"
      - "Ask, then explicitly scope to a single-machine in-process cache and note that distribution is an HLD concern"
      - "Skip scoping entirely and start coding the HashMap, since requirements are obvious for a cache"
      - "Design for Redis wire-protocol compatibility from the outset so the in-process design can be lifted into a cluster later"
    answer: 1
    explanation: |
      The machine-coding round grades single-machine OO design. The strong move is to
      surface the question, state the boundary ("in-process, single machine; a distributed
      cache is a system-design problem"), and move on. Jumping to sharding burns the clock
      on the wrong round; skipping clarification loses easy points.
    ref: "concepts.md#requirements-clarification"

  - id: design-cache-oo-002
    difficulty: beginner
    tags: [requirements, api-contract]
    question: |
      Why do most cache designs disallow null values (rather than storing them)?
    options:
      - "Null values make get(key) ambiguous: callers cannot distinguish 'cached null' from a miss"
      - "java.util.HashMap throws NullPointerException on null values, so the cache is forced to reject them"
      - "Null values corrupt the doubly linked recency list used by LRU during move-to-front operations"
      - "Storing null wastes an entry slot that the eviction policy can never select as a victim to reclaim"
    answer: 0
    explanation: |
      If null can be a legitimate stored value, a null return from get() no longer means
      "miss," and every caller needs a second containsKey check (which is also racy under
      concurrency). java.util.HashMap actually permits null values, so option B is false;
      the ambiguity of the get contract is the real design reason.
    ref: "concepts.md#requirements-clarification"

  - id: design-cache-oo-003
    difficulty: beginner
    tags: [requirements, lru-semantics]
    question: |
      For LRU semantics, which operations should refresh a key's recency?
    options:
      - "Only get hits refresh recency; put is a write path, not a read access"
      - "Only put on a brand-new key counts; reads never affect recency"
      - "Both get hits and put (insert or update) count as accesses"
      - "Only explicit touch(key) calls made by the client"
    answer: 2
    explanation: |
      The standard contract is that any interaction with a key — reading it or writing it —
      marks it as recently used. Clarifying this up front ("does put refresh recency?") is
      exactly the kind of question the first five minutes are for; the conventional answer
      is yes for both.
    ref: "concepts.md#requirements-clarification"

  - id: design-cache-oo-004
    difficulty: beginner
    tags: [entities, srp]
    question: |
      In the recommended decomposition, what is the responsibility of InMemoryCache itself?
    options:
      - "Maintain the doubly linked recency list directly and move nodes to the front of it on every access"
      - "Track per-key access frequencies and maintain the minimum-frequency bucket for eviction decisions"
      - "Compute per-entry TTL deadlines and lazily expire stale entries when they are read back"
      - "Orchestrate: manage storage and capacity, delegate victim selection to the policy, and fire eviction events"
    answer: 3
    explanation: |
      The cache class is an orchestrator. Recency lists belong to LruEvictionPolicy,
      frequency buckets to LfuEvictionPolicy, and TTL to a decorator. If the cache knows
      *how* victims are chosen, the Strategy seam is gone and every new policy reopens
      cache code.
    ref: "concepts.md#core-objects-and-responsibilities"

  - id: design-cache-oo-005
    difficulty: beginner
    tags: [entities, cache-entry]
    question: |
      What is the design purpose of a CacheEntry<K,V> class rather than storing raw values
      in the map?
    options:
      - "It is what makes the cache generic over both its key and its value type parameters"
      - "It holds per-entry metadata (timestamps, hit count) without polluting the stored value type"
      - "It is required for the backing HashMap to compute correct hash codes for stored entries"
      - "It reduces memory usage compared to storing the values directly in the backing map"
    answer: 1
    explanation: |
      CacheEntry is a small value object carrying the key, value, and bookkeeping metadata
      (createdAt, lastAccessedAt, hitCount). Without it, metadata would have to live in
      parallel maps or inside the user's value objects. It costs a little memory (option D
      is backwards) and has nothing to do with generics or hashing.
    ref: "concepts.md#core-objects-and-responsibilities"

  - id: design-cache-oo-006
    difficulty: intermediate
    tags: [entities, god-class]
    question: |
      A candidate writes a single 200-line LRUCache class that does hashing, linked-list
      surgery, TTL checks, and locking. In the LLD round, what is the primary criticism?
    options:
      - "It violates Single Responsibility: storage, eviction, expiry, and concurrency are separate reasons to change fused into one class"
      - "It is too slow, because fusing hashing and list surgery into one class breaks O(1) operations"
      - "At 200 lines it exceeds the strict class-size limit that most machine-coding interviewers enforce"
      - "It cannot be unit tested at all, since its private helper methods are unreachable from tests"
    answer: 0
    explanation: |
      The code may be perfectly correct and O(1) — it would pass a DSA round. The LLD round
      grades class boundaries: eviction strategy, expiry, and locking should be separable
      concerns (Strategy, Decorator, Decorator/lock wrapper), so each can change or be
      swapped without touching the others.
    ref: "concepts.md#core-objects-and-responsibilities"

  - id: design-cache-oo-007
    difficulty: beginner
    tags: [design-patterns, strategy]
    question: |
      The requirement "support LRU, LFU, and FIFO eviction, selectable at construction time"
      most directly calls for which pattern?
    options:
      - "State — the cache transitions between LRU, LFU, and FIFO states as its load changes at runtime"
      - "Template Method — a base cache with abstract evict() overridden per subclass"
      - "Strategy — an EvictionPolicy interface with interchangeable implementations injected into the cache"
      - "Singleton — one globally shared eviction-policy instance reused across every cache in the process"
    answer: 2
    explanation: |
      Eviction is a family of interchangeable algorithms chosen per cache instance — the
      textbook Strategy setup. Template Method (option B) gets close but forces an
      inheritance hierarchy: you cannot swap policies at runtime, and combining policy
      variation with other axes (TTL, locking) explodes the subclass count. State models
      mode transitions, which eviction is not.
    ref: "concepts.md#key-design-decisions"

  - id: design-cache-oo-008
    difficulty: intermediate
    tags: [design-patterns, strategy, trade-offs]
    question: |
      Why is `if (policy == LRU) {...} else if (policy == LFU) {...}` inside put() worse
      than an injected EvictionPolicy, even though both "work"?
    options:
      - "The if-else chain is measurably slower because the CPU's branch predictor mispredicts on enum comparisons"
      - "Every new policy forces edits to tested cache code (Open-Closed violation) and the cache must carry every policy's bookkeeping fields"
      - "if-else chains cannot handle more than three branches without becoming unreadable and error-prone"
      - "Java enums are final and cannot be extended with new constant values at a later time"
    answer: 1
    explanation: |
      The cost is structural, not performance. With the conditional, adding SLRU means
      reopening put()/get() and adding SLRU's data structures as more fields on the cache —
      the class accretes every policy's state. With Strategy, a new policy is a new class
      plus one factory line; InMemoryCache is closed to modification.
    ref: "concepts.md#key-design-decisions"

  - id: design-cache-oo-009
    difficulty: intermediate
    tags: [design-patterns, observer]
    question: |
      You need to flush evicted entries to a database asynchronously (write-behind) without
      coupling the cache to persistence. Which mechanism fits?
    options:
      - "Subclass InMemoryCache and override evictOne() so the subclass writes the victim to the DB"
      - "Have the EvictionPolicy perform the database write at the moment it selects a victim key"
      - "Add a DatabaseWriter field to InMemoryCache and call it directly inside the evictOne() method"
      - "Register a CacheEventListener (Observer) whose onEviction enqueues the entry for an async flusher"
    answer: 3
    explanation: |
      The Observer hook lets persistence, metrics, and logging all react to evictions
      without the cache knowing any of them exist. Subclassing or a direct DatabaseWriter
      field couples the cache to persistence; putting the write inside the policy violates
      its single responsibility (victim selection only).
    ref: "concepts.md#key-design-decisions"

  - id: design-cache-oo-010
    difficulty: intermediate
    tags: [design-patterns, decorator, ttl]
    question: |
      Why is TTL expiry modeled as a decorator wrapping Cache rather than as subclasses
      like TtlLruCache and TtlLfuCache?
    options:
      - "Decorators run faster than subclasses because delegation avoids the cost of virtual method dispatch"
      - "Subclassing a generic class such as InMemoryCache<K,V> is not permitted by the Java type system"
      - "TTL is orthogonal to eviction policy; subclassing multiplies classes per combination, while one decorator composes with any base cache"
      - "A decorator is the only mechanism in Java capable of intercepting get() calls before they run"
    answer: 2
    explanation: |
      TTL, statistics, thread-safety, and eviction policy are independent axes. With
      inheritance you need a subclass per combination (TtlLru, TtlLfu, SyncTtlLfu, ...);
      with Decorator you stack TtlCacheDecorator (and others) around any Cache. This is
      Effective Java's "favor composition over inheritance" applied directly.
    ref: "concepts.md#key-design-decisions"

  - id: design-cache-oo-011
    difficulty: intermediate
    tags: [design-patterns, factory]
    question: |
      A switch statement mapping PolicyType.LRU/LFU/FIFO to concrete policy classes has to
      live somewhere. Where does it belong, and why?
    options:
      - "In CacheFactory (creation code), so operational cache logic stays free of concrete policy knowledge"
      - "Inside InMemoryCache.put(), so eviction and selection stay together"
      - "Nowhere — switches over types always violate Open-Closed and must be eliminated"
      - "In each EvictionPolicy implementation, so policies self-register"
    answer: 0
    explanation: |
      Some code must name concrete classes to build the object graph; the design goal is to
      quarantine that knowledge in creation code (Factory), not eliminate it. The cache's
      runtime logic then depends only on the EvictionPolicy abstraction. Option C
      overstates OCP — a single switch at the composition root is the accepted idiom.
    ref: "concepts.md#key-design-decisions"

  - id: design-cache-oo-012
    difficulty: intermediate
    tags: [api-design, responsibilities]
    question: |
      In the recommended contract, evictKey() returns the victim but does NOT remove it from
      storage — the cache does the removal. What is the design reason?
    options:
      - "The policy is physically unable to touch the storage map because that field is private to the cache"
      - "Storage mutation is the cache's single responsibility; splitting it across policy and cache would desynchronize ownership and duplicate removal logic"
      - "Returning the victim key is a cheaper O(1) operation than actually unlinking and removing it"
      - "It allows evictKey() to be called speculatively as a pure read, leaving the policy's own structures untouched"
    answer: 1
    explanation: |
      One class owns storage mutation: the cache. The policy's job ends at *selection*.
      If policies also removed entries, every policy would duplicate removal + listener
      logic, and a buggy policy could corrupt storage. (Option A describes an enforcement
      mechanism, not the reason; note evictKey does mutate the policy's own structures,
      so D is false.)
    ref: "concepts.md#api-and-method-signatures"

  - id: design-cache-oo-013
    difficulty: beginner
    tags: [api-design, interfaces]
    question: |
      Callers of the cache should declare their dependency as which type?
    options:
      - "LruEvictionPolicy<K>, so the compiler statically guarantees least-recently-used behavior at the call site"
      - "InMemoryCache<K,V>, since that is the real concrete implementation clients ultimately run against"
      - "HashMap<K,V>, since a cache is fundamentally just a map with a bounded number of entries"
      - "Cache<K,V>, the interface — so implementations and decorators can be substituted freely"
    answer: 3
    explanation: |
      Program to the interface. If clients hold Cache<K,V>, the factory can hand them a
      TTL-decorated, synchronized, or tiered cache without any client change. Depending on
      InMemoryCache freezes the concrete type into every call site and breaks decorator
      composition.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-cache-oo-014
    difficulty: intermediate
    tags: [api-design, policy-contract]
    question: |
      Why does EvictionPolicy<K> take only keys (keyAccessed, keyRemoved, evictKey) and
      never see values?
    options:
      - "Values may be null, and eviction policies have no defined way to handle a null payload"
      - "Java generics forbid declaring two separate type parameters on a single interface definition"
      - "Victim selection only needs ordering metadata about keys; excluding values keeps the policy lightweight and reusable across caches"
      - "Passing values in would force the policy to defensively deep-copy each one to stay safe"
    answer: 2
    explanation: |
      LRU needs recency order, LFU needs counts — both are properties of *keys*. Giving the
      policy values would widen its interface for no benefit and tie it to a specific value
      type. This is Interface Segregation applied to the policy contract.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-cache-oo-015
    difficulty: intermediate
    tags: [code-skeleton, eviction-trigger]
    question: |
      In put(), where must the capacity check and eviction happen?
    options:
      - "Before checking whether the key already exists, so the cache size never once exceeds maxSize"
      - "After confirming the key is new, and before inserting it — updates to existing keys must never trigger eviction"
      - "After inserting the new entry, then evict a victim if the resulting size exceeds maxSize"
      - "In a background sweeper thread that periodically trims the cache back down to maxSize"
    answer: 1
    explanation: |
      Updating an existing key doesn't grow the cache, so evicting on update is a classic
      bug (option A's ordering causes it). Evicting *before* insert keeps size <= maxSize
      as a hard invariant; insert-then-evict (option C) transiently breaks it, which
      matters once you add concurrency or size-based listeners.
    ref: "concepts.md#code-skeleton"

  - id: design-cache-oo-016
    difficulty: intermediate
    tags: [code-skeleton, dependency-injection]
    question: |
      InMemoryCache receives its EvictionPolicy through the constructor rather than
      instantiating `new LruEvictionPolicy()` internally. What does this buy?
    options:
      - "Dependency Inversion: the cache depends only on the abstraction, so policies can be swapped (including scripted fakes in tests) without touching cache code"
      - "It removes the need for a defensive null check on the policy field inside every method"
      - "Constructor injection is a language prerequisite for declaring the class generic over K and V"
      - "It makes the resulting cache instance fully immutable and safe to share across threads"
    answer: 0
    explanation: |
      Constructor injection is the mechanism that makes the Strategy pattern real: the
      high-level cache never names a concrete policy. A bonus payoff is testability — cache
      tests can inject a fake policy with a scripted evictKey(), and policy tests run
      without any cache at all.
    ref: "concepts.md#code-skeleton"

  - id: design-cache-oo-017
    difficulty: beginner
    tags: [lru, data-structures]
    question: |
      Why does the LRU policy pair its doubly linked list with a HashMap<K, Node<K>> index?
    options:
      - "The map stores the actual values while the linked list separately stores just the keys"
      - "The linked list on its own has no way to remember the insertion order of its nodes"
      - "Pairing the two structures roughly halves the total memory footprint of the recency list"
      - "Without the index, finding a key's node to move it to the front is O(n) list traversal; the index makes keyAccessed O(1)"
    answer: 3
    explanation: |
      The linked list gives O(1) moveToFront/removeLast *once you hold the node*; the map
      is what locates the node for a given key in O(1). Together they deliver O(1) get and
      put. Values never enter the policy at all (option A confuses it with the cache's own
      storage map).
    ref: "concepts.md#lru-internals-from-an-oo-lens"

  - id: design-cache-oo-018
    difficulty: intermediate
    tags: [lru, data-structures, trade-offs]
    question: |
      Why is java.util.LinkedList<K> (used via its public API) a poor recency structure for
      the LRU policy, compared to a hand-rolled DoublyLinkedList with an external node index?
    options:
      - "java.util.LinkedList is singly linked internally, which makes its removeLast operation O(n)"
      - "Removing a specific key from the middle requires an O(n) scan, because callers never hold node references — only the hand-rolled list plus node map gives O(1) unlink"
      - "java.util.LinkedList reorders its elements on iteration and does not preserve insertion order"
      - "java.util.LinkedList is a raw-typed collection that cannot hold generic key types"
    answer: 1
    explanation: |
      java.util.LinkedList is doubly linked (A is false), but its API hides nodes:
      remove(Object) must scan. The LRU trick depends on holding direct Node references in
      a map so moveToFront and unlink are pointer operations. This is why the design wraps
      a custom list rather than reusing the JDK class.
    ref: "concepts.md#lru-internals-from-an-oo-lens"

  - id: design-cache-oo-019
    difficulty: intermediate
    tags: [lru, encapsulation]
    question: |
      In the OO decomposition, why should the linked-list Node<K> type be package-private
      and never appear in EvictionPolicy's public interface?
    options:
      - "Public inner classes are a JVM performance anti-pattern because each one forces the compiler to emit a hidden synthetic accessor that defeats method inlining"
      - "Node objects hold the cached values directly, so exposing them would let callers mutate stored payloads behind the cache's back and break encapsulation"
      - "Nodes are an implementation detail of the LRU strategy; leaking them would couple the cache to one policy's internals and break substitutability with LFU/FIFO"
      - "The garbage collector reclaims package-private classes more efficiently, since their tighter visibility lets the JIT prove the instances never escape"
    answer: 2
    explanation: |
      The whole point of EvictionPolicy is that the cache doesn't know whether recency is
      tracked with a list, buckets, or a queue. If the interface traded in Node objects,
      LFU (which has no linked list) couldn't implement it — the abstraction would be
      shaped around one implementation.
    ref: "concepts.md#lru-internals-from-an-oo-lens"

  - id: design-cache-oo-020
    difficulty: intermediate
    tags: [lru, java, breadth]
    question: |
      An interviewer asks: "Why not just use LinkedHashMap with accessOrder=true and
      removeEldestEntry?" What is the strongest answer?
    options:
      - "LinkedHashMap was deprecated in Java 9 in favor of SequencedMap, so relying on its access-order mode is no longer supported"
      - "LinkedHashMap's access-order reordering degrades to O(log n) per get because it rebalances an internal red-black tree to track recency"
      - "removeEldestEntry can only signal a boolean and cannot actually unlink the eldest entry, so you must still evict manually on every put"
      - "It is the right production shortcut for LRU-only, but the explicit design exists for policy pluggability (LFU/FIFO drop into the same seam) — which LinkedHashMap cannot offer"
    answer: 3
    explanation: |
      Acknowledging the shortcut shows breadth; explaining why you still build the explicit
      design shows judgment. LinkedHashMap hard-codes recency ordering — there is no seam
      for LFU or FIFO. The interview is testing whether you can create that seam.
    ref: "concepts.md#lru-internals-from-an-oo-lens"

  - id: design-cache-oo-021
    difficulty: beginner
    tags: [lru, sentinels]
    question: |
      What do head/tail sentinel nodes buy the DoublyLinkedList implementation?
    options:
      - "They eliminate null checks at the list edges — addFirst, removeLast, and unlink follow the same pointer logic regardless of list size"
      - "They cache the most and least recently used values inside the two sentinels so peek operations skip the node map entirely"
      - "They keep the list from ever being logically empty, which the eviction routine relies on to avoid returning a null victim on the last removal"
      - "They make the list operations thread-safe by acting as fixed lock points that every writer must acquire before mutating"
    answer: 0
    explanation: |
      With sentinels, every real node always has non-null prev and next, so there are no
      special cases for empty or single-element lists. This is a small detail interviewers
      notice — pointer-surgery bugs at list edges are the most common live-coding failure
      in this problem.
    ref: "concepts.md#lru-internals-from-an-oo-lens"

  - id: design-cache-oo-022
    difficulty: intermediate
    tags: [lfu, data-structures]
    question: |
      In the O(1) LFU policy, what is the role of the minFrequency field?
    options:
      - "It caps how high any single key's access frequency may grow, so counts saturate rather than overflow the frequency map's integer values"
      - "It points at the lowest non-empty frequency bucket so evictKey() finds a victim in O(1) instead of scanning bucket levels"
      - "It counts the number of distinct frequency buckets currently in use, letting the policy resize its bucket array when the count crosses a threshold"
      - "It records the frequency level of the most recently evicted key so the next eviction can resume scanning from that same bucket"
    answer: 1
    explanation: |
      Without minFrequency, evictKey() would need to search upward from frequency 1 for a
      non-empty bucket — potentially O(max frequency). Tracking the minimum keeps eviction
      O(1). The two update rules to know: a new key resets minFrequency to 1, and when a
      bump drains the current min bucket, minFrequency becomes freq+1.
    ref: "concepts.md#lfu-internals-from-an-oo-lens"

  - id: design-cache-oo-023
    difficulty: intermediate
    tags: [lfu, tie-breaking]
    question: |
      Two LFU entries tie at the minimum frequency. Which one does the standard design evict,
      and what structure encodes that choice?
    options:
      - "The one holding the larger value, found by comparing the two entries' payloads with the value type's natural ordering"
      - "A uniformly random one of the tied keys, selected by iterating a plain HashSet bucket whose order is effectively arbitrary"
      - "The least recently used of the tied keys — the LinkedHashSet bucket's insertion order makes it the first element"
      - "The most recently inserted of the tied keys, popped from a stack-ordered (LIFO) bucket that tracks arrival order"
    answer: 2
    explanation: |
      The standard tie-break is LRU-within-frequency. Using LinkedHashSet (not HashSet) for
      each bucket preserves the order keys entered that frequency level, so the iterator's
      first element is the stalest tied key. Stating this tie-break unprompted is a
      recognized signal of depth.
    ref: "concepts.md#lfu-internals-from-an-oo-lens"

  - id: design-cache-oo-024
    difficulty: advanced
    tags: [lfu, weaknesses]
    question: |
      A scan-heavy workload (many one-time keys) hits a plain LFU cache holding long-lived
      hot entries. What pathology emerges?
    options:
      - "The long-lived hot entries are evicted first, because each one-time scan key raises minFrequency and drags the eviction pointer up past them"
      - "New keys enter at frequency 1 (the minimum) and evict each other, while old high-frequency keys stay pinned even if they are no longer accessed"
      - "The frequency map overflows because per-key counts grow without bound and eventually wrap past Integer.MAX_VALUE into negative territory"
      - "minFrequency drifts negative once empty buckets accumulate below it, and eviction then indexes an invalid bucket and corrupts the policy"
    answer: 1
    explanation: |
      Plain LFU has no aging: history dominates. One-time scan keys churn at frequency 1
      while stale-but-formerly-hot keys squat. Mitigations worth naming: frequency
      decay/aging windows, or TinyLFU-style admission (Caffeine) that compares an incoming
      key's estimated frequency against the would-be victim's.
    ref: "concepts.md#lfu-internals-from-an-oo-lens"

  - id: design-cache-oo-025
    difficulty: advanced
    tags: [lfu, strategy, ocp]
    question: |
      After LRU is built, the interviewer says "now support LFU." In the recommended design,
      which code changes?
    options:
      - "A new LfuEvictionPolicy class is added and the factory gains one case — InMemoryCache is untouched"
      - "InMemoryCache.put() gains an extra frequency-tracking branch that increments a per-key counter before delegating to the policy"
      - "CacheEntry is subclassed into an LfuCacheEntry that carries a frequency field the policy reads during eviction"
      - "Cache<K,V> gains a getFrequency(key) method so callers can inspect an entry's access count directly"
    answer: 0
    explanation: |
      This is the payoff sentence of the whole design and worth saying verbatim in the
      interview: LFU drops in without one line of the cache changing. The policy owns its
      own frequency state (so no CacheEntry subclassing), and the public Cache contract is
      policy-agnostic (so no interface change).
    ref: "concepts.md#lfu-internals-from-an-oo-lens"

  - id: design-cache-oo-026
    difficulty: advanced
    tags: [concurrency, rw-lock]
    question: |
      Why is guarding get() with the READ lock of a ReentrantReadWriteLock incorrect for
      this LRU cache?
    options:
      - "A read lock carries higher acquisition overhead than a write lock because it must atomically increment a shared reader counter on every entry"
      - "ReentrantReadWriteLock serializes readers just like writers, so multiple threads can never hold the read lock at the same time anyway"
      - "get() must fully return its value before the read lock can be released, which serializes callers and defeats the point of a shared lock"
      - "get() is not read-only here: it calls keyAccessed, which restructures the recency list — concurrent 'readers' would corrupt shared pointers"
    answer: 3
    explanation: |
      The classic trap. In an LRU cache, every get mutates policy state (move-to-front), so
      it needs exclusive access — meaning get would need the write lock, making the RW lock
      pointless. RW locks only pay off when reads are truly read-only, e.g., with a FIFO
      policy whose ordering ignores gets.
    ref: "concepts.md#concurrency-and-thread-safety"

  - id: design-cache-oo-027
    difficulty: advanced
    tags: [concurrency, atomicity]
    question: |
      Replacing the storage HashMap with ConcurrentHashMap still leaves the cache unsafe
      under concurrent puts. Why?
    options:
      - "ConcurrentHashMap cannot be parameterized with generic key types, so the cache loses its compile-time key safety"
      - "put() is a compound check-then-act (containsKey, size check, evict, insert) that must be atomic with the policy update — a thread-safe map does not make multi-step operations atomic"
      - "ConcurrentHashMap takes a single table-wide lock on every write, which deadlocks against the lock the eviction policy already holds"
      - "ConcurrentHashMap silently permits null keys and values, breaking the cache's no-null contract and turning misses into ambiguous results"
    answer: 1
    explanation: |
      Two threads can both pass the size check and both evict (or neither), and the map and
      policy structures can interleave into inconsistent states. Thread safety must cover
      the whole invariant "storage and policy track the same key set," which requires
      locking around the compound operation, not just a concurrent map.
    ref: "concepts.md#concurrency-and-thread-safety"

  - id: design-cache-oo-028
    difficulty: intermediate
    tags: [concurrency, decorator]
    question: |
      What is the design advantage of providing thread safety via a SynchronizedCache
      decorator instead of putting synchronized on InMemoryCache's methods?
    options:
      - "The decorator eliminates lock contention entirely by giving each caller its own private copy of the underlying cache"
      - "A synchronized method cannot invoke the class's private helper methods, so the base cache would have to expose its internals"
      - "Single-threaded users pay no locking cost, and concurrency composes as a layer like TTL — the base cache stays simple"
      - "Java forbids the synchronized keyword on methods of a class declared generic over its type parameters"
    answer: 2
    explanation: |
      Same rationale as Collections.synchronizedMap: keep the core lock-free and wrap when
      needed. It also keeps the concurrency decision at composition time (in the factory)
      alongside TTL and stats decorators, rather than baked into the one implementation
      everyone shares.
    ref: "concepts.md#concurrency-and-thread-safety"

  - id: design-cache-oo-029
    difficulty: expert
    tags: [concurrency, production, caffeine]
    question: |
      Asked "how do production caches like Caffeine get high concurrent read throughput when
      every LRU read mutates recency?", what is the accurate one-line answer?
    options:
      - "They shard the cache into fixed segments and take one segment-scoped lock per read, so contention is bounded but every get still blocks"
      - "They make reads lock-free on a concurrent map and record accesses into buffers that are replayed into the eviction policy asynchronously, accepting slightly stale ordering"
      - "They automatically downgrade to a FIFO policy under high load, since FIFO ordering needs no per-read recency update"
      - "They pin all frequently hit entries into a separate lock-free region so reads of hot keys never touch the eviction policy at all"
    answer: 1
    explanation: |
      Caffeine decouples the read path from policy maintenance: gets hit a ConcurrentHashMap
      without locks, and recency events go into ring buffers drained asynchronously. The
      trade-off is relaxed (approximate) LRU order for large throughput gains — a great
      "beyond the interview" mention after you've shown the correct coarse-lock answer.
    ref: "concepts.md#concurrency-and-thread-safety"

  - id: design-cache-oo-030
    difficulty: intermediate
    tags: [ttl, extensibility, trade-offs]
    question: |
      For TTL expiry, what is the core trade-off between lazy expiration (check on get) and
      active cleanup (background sweeper)?
    options:
      - "Lazy is O(1) with no extra threads but lets expired entries occupy capacity until touched; active reclaims memory promptly at the cost of a background thread and coordination"
      - "Lazy expiry is strictly more accurate because it checks the clock on every access, whereas an active sweeper can never expire an entry at its exact deadline"
      - "Active cleanup is always the better choice; lazy expiration exists only as a fallback for single-threaded languages that cannot spawn a sweeper"
      - "Lazy expiry requires maintaining a min-heap of deadlines to know which entry to check next, while active cleanup needs no such structure"
    answer: 0
    explanation: |
      The interview-grade answer is "lazy first, sweeper as an optional enhancement — they
      compose." Lazy expiry piggybacks on get (expired = treat as miss, remove); its cost
      is zombie entries holding capacity. The heap-of-deadlines belongs to the *active*
      approach (option D is inverted).
    ref: "concepts.md#extensibility"

  - id: design-cache-oo-031
    difficulty: intermediate
    tags: [extensibility, write-policies]
    question: |
      Which statement correctly contrasts write-through and write-behind caching?
    options:
      - "Write-through persists to the backing store asynchronously at eviction time, while write-behind writes both cache and store synchronously on every put"
      - "Write-through writes cache and backing store synchronously on put (simple, consistent, slower writes); write-behind defers persistence to an async flusher (fast writes, loss risk on crash)"
      - "Write-through bypasses the cache entirely and writes straight to the backing store, so the cache is only ever populated on subsequent reads"
      - "Write-behind guarantees durability because it always flushes an entry to the store before that entry is allowed to be evicted"
    answer: 1
    explanation: |
      Write-through trades write latency for simplicity and consistency; write-behind
      trades durability risk for speed. In this design, write-behind falls out of the
      Observer seam (an eviction listener plus a queue), which is exactly why that hook
      was designed in.
    ref: "concepts.md#extensibility"

  - id: design-cache-oo-032
    difficulty: intermediate
    tags: [extensibility, composition]
    question: |
      To build a two-level cache (L1 in-memory, L2 Redis-backed), the recommended structure is
      a TieredCache that:
    options:
      - "Extends InMemoryCache and overrides get() so that after an L1 miss the same instance also queries the Redis-backed store"
      - "Merges both levels' entries into a single HashMap keyed by a (level, key) pair so one lookup can span L1 and L2"
      - "Requires adding a getFromLevel(int level) method to the Cache interface so callers can address each tier explicitly"
      - "Implements Cache and composes two Cache instances — get checks L1, falls back to L2, and promotes hits into L1"
    answer: 3
    explanation: |
      Because everything speaks the Cache interface, tiering is pure composition (Composite
      flavor): L2 can be a Redis adapter implementing the same interface. Inheritance
      (option A) welds tiering to one implementation; changing the interface (option C)
      leaks tiering into every existing client.
    ref: "concepts.md#extensibility"

  - id: design-cache-oo-033
    difficulty: advanced
    tags: [extensibility, load-through, concurrency]
    question: |
      You add a LoadingCacheDecorator that computes values on miss via a loader function.
      Under concurrency, what additional problem must you design for?
    options:
      - "The loader may return a subtype of V rather than V exactly, which breaks the decorator's generic bounds at runtime with a ClassCastException"
      - "Cache stampede: many threads missing the same key simultaneously all invoke the expensive loader — mitigate with per-key locking or a Future-based entry so one thread loads while others wait"
      - "The decorator cannot observe misses at all, because a miss makes get return null before any decorator code on the wrapped cache runs"
      - "Values inserted by the loader bypass the eviction policy's bookkeeping entirely, so the cache can silently grow past its configured maxSize"
    answer: 1
    explanation: |
      Thundering herd on a hot missing key is the signature load-through problem. The
      standard fix is to insert a placeholder (a Future/CompletableFuture) atomically so
      the first thread computes and the rest block on the same result — the approach
      ConcurrentHashMap.computeIfAbsent and Guava's LoadingCache take.
    ref: "concepts.md#extensibility"

  - id: design-cache-oo-034
    difficulty: beginner
    tags: [extensibility, meta]
    question: |
      The interviewer asks "now add hit-rate statistics." Applying this design's meta-rule
      for extensions, your first question to yourself should be:
    options:
      - "Which existing seam (Strategy, Decorator, Observer, Factory) does this land on, so I add a class instead of editing one?"
      - "Which existing class currently has the most room to absorb a new counter field without growing too large to review?"
      - "Can I tuck the hit/miss counters into CacheEntry itself so the feature needs no new classes at all?"
      - "Should I first rewrite the cache in a more dynamic language where adding cross-cutting counters is easier?"
    answer: 0
    explanation: |
      Every follow-up in this problem maps to a seam: stats fit a StatsCacheDecorator (or a
      listener if hit/miss events are emitted). Framing extensions as "add a class at an
      existing seam" is precisely what Open-Closed looks like under interview pressure.
    ref: "concepts.md#extensibility"

  - id: design-cache-oo-035
    difficulty: intermediate
    tags: [edge-cases, correctness]
    question: |
      A candidate writes: `if (storage.size() >= maxSize) evictOne();` as the FIRST line of
      put(), before checking whether the key exists. What bug results?
    options:
      - "New keys are silently dropped whenever the cache is full, because the early eviction consumes the slot before the insert can use it"
      - "The cache can transiently exceed maxSize on updates, since the size check runs before the update rather than after the new entry lands"
      - "Updating an existing key in a full cache wrongly evicts some other entry, even though the update does not grow the cache"
      - "evictOne() throws an exception because the selected victim may turn out to equal the incoming key being written"
    answer: 2
    explanation: |
      Updates don't change size, so they must never evict. With the check first, a full
      cache evicts a resident on every update — shrinking effective capacity and, worse,
      possibly evicting the very key being updated (depending on policy state), then
      re-inserting it with fresh metadata. Check containsKey first.
    ref: "concepts.md#edge-cases-and-error-handling"

  - id: design-cache-oo-036
    difficulty: intermediate
    tags: [edge-cases, invariants]
    question: |
      The central correctness invariant introduced by splitting the cache from its eviction
      policy is:
    options:
      - "The policy's internal structures must never hold more than maxSize keys, even momentarily during an evict-then-insert sequence"
      - "Storage and policy must always track exactly the same key set — every storage mutation is mirrored by a keyAccessed or keyRemoved call"
      - "minFrequency must always equal 1 so that the very next eviction is guaranteed to find a victim in the lowest bucket"
      - "CacheEntry timestamps must be strictly monotonically increasing across every key, so recency comparisons never see a tie"
    answer: 1
    explanation: |
      Separation of concerns creates a synchronization obligation: if a key exists in
      storage but not the policy (or vice versa), evictKey() can return a phantom key or
      never evict a resident one. The defense is funneling ALL mutations through
      put/remove/evictOne so the mirroring calls cannot be forgotten.
    ref: "concepts.md#edge-cases-and-error-handling"

  - id: design-cache-oo-037
    difficulty: advanced
    tags: [edge-cases, observer, reentrancy]
    question: |
      A CacheEventListener's onEviction handler calls cache.put() to reinsert a transformed
      entry. Under the coarse-lock decorator, what risk does this create and what is a sound
      mitigation?
    options:
      - "Unbounded stack growth from infinite recursion, because each reinsert fires onEviction again; the only safe fix is to cap the cache to a single registered listener so the cycle cannot form"
      - "No risk at all, because CacheEventListener callbacks are dispatched on a dedicated notification thread by default, so the reinserting put never runs inside the caller's locked section"
      - "The listener's nested put silently no-ops, since the coarse lock is already held and the decorator detects the same owning thread and deliberately skips the second write to avoid a conflict"
      - "Re-entrancy: the callback runs inside evictOne, so the nested put can re-trigger eviction mid-eviction or deadlock (with non-reentrant locks); mitigate by firing notifications outside the critical section or documenting the constraint"
    answer: 3
    explanation: |
      Calling out listener re-entrancy is a senior-level signal. The nested put executes
      while the cache is mid-mutation; with a non-reentrant lock it deadlocks, and even
      with a reentrant one it can evict recursively. Standard fixes: collect events and
      fire after releasing the lock, or dispatch notifications to an executor.
    ref: "concepts.md#edge-cases-and-error-handling"

  - id: design-cache-oo-038
    difficulty: beginner
    tags: [edge-cases, validation]
    question: |
      How should the design handle construction with maxSize = 0?
    options:
      - "Accept it silently — a zero-capacity cache is a valid degenerate state where storage simply stays empty and every put returns without inserting anything"
      - "Reject with IllegalArgumentException in the constructor: a zero-capacity cache would have to evict the very key it is inserting"
      - "Round it up to a sensible default capacity of 16 entries, matching HashMap's default table size, so the cache is always usable straight out of the box"
      - "Defer validation to the first put call, which then throws IllegalStateException once it discovers there is no slot available for the incoming key"
    answer: 1
    explanation: |
      Fail fast at construction. A zero-capacity cache makes put's contract incoherent
      (evict-before-insert would select a victim from an empty policy). Silent no-op puts
      (option A) hide bugs; silently changing the requested capacity (option C) violates
      least surprise.
    ref: "concepts.md#edge-cases-and-error-handling"

  - id: design-cache-oo-039
    difficulty: beginner
    tags: [solid, srp]
    question: |
      Which mapping of concern to class correctly reflects Single Responsibility in this
      design?
    options:
      - "Victim selection in EvictionPolicy, expiry in the TTL decorator, storage in the cache's map, assembly in the factory"
      - "Victim selection and expiry both in EvictionPolicy, since both ultimately remove entries and can therefore share one class's eviction pathway"
      - "Storage and victim selection both in InMemoryCache, since both operate on keys and keeping them together avoids an extra delegation call per put"
      - "Assembly and notification both in CacheFactory, since both are infrastructure concerns that sit outside the cache's core read/write path"
    answer: 0
    explanation: |
      Five reasons to change, five homes: storage (map inside the cache), selection
      (policy), expiry (decorator), notification (listeners), assembly (factory). Merging
      expiry into the policy (option B) couples two independent axes — a TTL'd LRU and a
      TTL'd LFU would each need their own combined class.
    ref: "concepts.md#solid-in-this-design"

  - id: design-cache-oo-040
    difficulty: intermediate
    tags: [solid, lsp]
    question: |
      Which EvictionPolicy implementation behavior would violate Liskov Substitution?
    options:
      - "Evicting the most recently used key on every eviction (an MRU policy), which inverts the usual recency heuristic but still returns a resident key"
      - "Returning victims in strict FIFO insertion order regardless of subsequent access patterns, ignoring how recently or often each key was touched"
      - "evictKey() returning a key that was never passed to keyAccessed — the cache would try to remove a phantom entry"
      - "Using O(log n) internal structures such as a balanced tree of timestamps instead of the O(1) list-and-map combination the contract expects"
    answer: 2
    explanation: |
      LSP is about honoring the behavioral contract, not about which victim heuristic you
      choose — MRU and FIFO are legitimate strategies (A, B fine), and performance class
      isn't part of the contract (D). Returning an untracked key breaks the postcondition
      clients rely on: the victim must be a key currently in the cache.
    ref: "concepts.md#solid-in-this-design"

  - id: design-cache-oo-041
    difficulty: intermediate
    tags: [solid, isp]
    question: |
      Why do keyAccessed/keyRemoved/evictKey live on EvictionPolicy rather than on the public
      Cache interface?
    options:
      - "They must be private implementation helpers, and since interfaces can only declare public abstract methods they cannot legally be added to the Cache interface at all"
      - "Putting them on the Cache interface would slow down dynamic dispatch, because a wider method table forces the JVM to fall back from monomorphic to megamorphic call sites"
      - "They are stateless static utility methods that belong in a shared CacheUtils helper class rather than on any instance-level interface"
      - "Interface Segregation: cache clients should not see (or be able to call) policy-maintenance callbacks — those belong to the cache-to-policy contract only"
    answer: 3
    explanation: |
      A client that could call evictKey() directly could corrupt the storage/policy
      invariant. Splitting the interfaces means each consumer sees only the operations it
      legitimately needs: clients get get/put/remove; only the cache orchestrator speaks
      the policy protocol.
    ref: "concepts.md#solid-in-this-design"

  - id: design-cache-oo-042
    difficulty: intermediate
    tags: [solid, dip]
    question: |
      Which dependency arrangement demonstrates Dependency Inversion in this design?
    options:
      - "LruEvictionPolicy depends on InMemoryCache and reaches into its storage map on each eviction to scan for the least-recently-used entry directly"
      - "InMemoryCache depends on the EvictionPolicy abstraction (injected), and only the factory names concrete policy classes"
      - "InMemoryCache instantiates LruEvictionPolicy directly in its constructor so a sensible default policy works out of the box without any factory wiring"
      - "Cache extends EvictionPolicy so the two abstractions vary together and a single subclass can satisfy both roles at once"
    answer: 1
    explanation: |
      High-level module (the cache) and low-level modules (concrete policies) both depend
      on the abstraction. The only place concrete names appear is creation code. Option A
      inverts the data flow badly (the policy scanning cache storage is the O(n) anti-design);
      option C hard-wires a concrete dependency.
    ref: "concepts.md#solid-in-this-design"

  - id: design-cache-oo-043
    difficulty: beginner
    tags: [relationships, uml]
    question: |
      In the class diagram, the link between InMemoryCache and EvictionPolicy is best
      described as which relationship?
    options:
      - "Inheritance — the cache is a specialized kind of eviction policy that overrides selection behavior while reusing the policy's base bookkeeping"
      - "Composition — the policy's lifetime is bound to the cache: it is created inside the cache's constructor and becomes garbage the moment the cache is discarded"
      - "Aggregation ('has-a' via constructor injection) — the cache holds a reference to an interchangeable policy created elsewhere"
      - "Dependency only — the cache does not hold a policy field at all and instead receives a fresh policy as a method parameter on each get and put call"
    answer: 2
    explanation: |
      The policy is created outside (by the factory) and handed in, and conceptually it is
      a swappable collaborator — the defining traits of aggregation over composition. By
      contrast, CacheEntry objects ARE composition: the cache creates and owns them, and
      they are meaningless outside it.
    ref: "concepts.md#class-diagram"

  - id: design-cache-oo-044
    difficulty: intermediate
    tags: [relationships, decorator, uml]
    question: |
      TtlCacheDecorator both implements Cache and holds a Cache reference. Why does the
      pattern require BOTH relationships?
    options:
      - "Implementing the interface lets it substitute anywhere a Cache is expected; wrapping a Cache lets it delegate and layer behavior — remove either and it is no longer a decorator"
      - "It is a hard Java language limitation: any object that delegates calls to another is required by the compiler to implement that delegate's interface first"
      - "Holding the wrapped Cache reference is actually optional boilerplate; only implementing the Cache interface is strictly required for the decorator to work"
      - "Implementing the Cache interface is optional; only holding and delegating to the wrapped instance is what genuinely defines the decorator pattern"
    answer: 0
    explanation: |
      Is-a plus has-a is the decorator signature. Without the interface it can't stack or
      substitute (clients would need a new type); without the wrapped delegate it would
      have to reimplement caching itself. This dual relationship is what lets
      TTL + stats + synchronization stack in any order.
    ref: "concepts.md#class-diagram"

  - id: design-cache-oo-045
    difficulty: intermediate
    tags: [interview-strategy, scoping]
    question: |
      With 45 minutes on the clock, which sequencing of this problem earns the most signal?
    options:
      - "Write the full LFU frequency-bucket code first since it is the hardest part to get right, then backfill the Cache and EvictionPolicy interfaces around the finished implementation"
      - "Clarify requirements, state the O(1) target, define Cache/EvictionPolicy interfaces and the class diagram, implement LRU end-to-end, then discuss LFU/TTL/concurrency as extensions on the seams"
      - "Start with the fully thread-safe locked version first, since real production caches are always concurrent and retrofitting locks later is riskier"
      - "Draw a complete UML diagram of all nine classes including every decorator and listener before writing a single line of code"
    answer: 1
    explanation: |
      Interfaces-first proves the design; one working policy end-to-end proves you can
      execute; extensions-on-seams proves extensibility without the clock cost of coding
      them all. Leading with LFU or locking spends time where the marginal signal is low;
      exhaustive up-front UML leaves no time to demonstrate working code.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-cache-oo-046
    difficulty: intermediate
    tags: [testing, design-payoff]
    question: |
      How does the Strategy split concretely improve testability of this design?
    options:
      - "It removes the need for most unit tests, since well-named Strategy interfaces are self-documenting and their contracts can be verified by inspection alone"
      - "It lets tests reach the cache's private storage fields indirectly through the injected policy, exposing internals that would otherwise be untestable"
      - "It automatically guarantees 100% branch coverage of the eviction paths, because every Strategy implementation is exercised through the same shared interface"
      - "Policies unit-test in isolation (feed an access sequence, assert the victim) with no cache involved, and cache logic tests inject a scripted fake policy"
    answer: 3
    explanation: |
      With the god-class, testing LFU tie-breaks requires driving the whole cache through
      puts and gets. With the split, LfuEvictionPolicy is tested directly — keyAccessed
      calls in, expected victims out — and InMemoryCache's capacity/eviction/listener logic
      is tested against a deterministic fake. Cite this when asked "how do you test it?"
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-cache-oo-047
    difficulty: advanced
    tags: [boundaries, hld]
    question: |
      The interviewer pushes: "now make the cache shared across 20 service hosts." The
      LLD-appropriate response is to:
    options:
      - "Design a peer-to-peer gossip protocol between the 20 hosts so their in-process caches continuously synchronize entries and eviction decisions with each other"
      - "Refuse the question as strictly out of scope for the LLD round and move on to the next topic without engaging with it"
      - "Note that a shared remote cache (consistency, invalidation, sharding) is an HLD problem, and show that the LLD answer is an adapter implementing Cache over a Redis/Memcached client — possibly as L2 in a tiered cache"
      - "Periodically serialize the entire InMemoryCache to disk and rsync the snapshot file between all 20 hosts so each stays roughly in sync"
    answer: 2
    explanation: |
      Recognizing the boundary IS the answer: name the concerns that make it distributed
      (invalidation, consistency, partitioning), point to where they're addressed (HLD),
      and demonstrate that your abstraction absorbs the change (a Cache-shaped Redis
      adapter slots into the tiered design). Flat refusal wastes the chance to show the
      seam.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-cache-oo-048
    difficulty: advanced
    tags: [extensibility, weigher, strategy]
    question: |
      Follow-up: "bound the cache by total memory weight instead of entry count." Which
      change best preserves the existing design?
    options:
      - "Add a getSizeInBytes() method to the Cache interface so that every client is responsible for measuring the total footprint and enforcing the memory bound itself"
      - "Introduce a Weigher<K,V> strategy (like Caffeine's maximumWeight); the cache tracks total weight and evictOne loops until under the limit"
      - "Require all cached values to implement a Sizeable interface exposing a bytes() method so the cache can sum each entry's self-reported size"
      - "Move the capacity check into each EvictionPolicy implementation so that individual policies become responsible for enforcing the total weight limit"
    answer: 1
    explanation: |
      Weighing is another axis of variation — so it gets another injected strategy, mirroring
      Guava/Caffeine's Weigher. Forcing values to implement an interface (option C) leaks the
      cache's concern into domain types; pushing the bound into policies (option D) breaks
      SRP (policies select victims, they don't enforce capacity); option A shifts
      enforcement onto clients.
    ref: "concepts.md#common-interview-follow-ups"
