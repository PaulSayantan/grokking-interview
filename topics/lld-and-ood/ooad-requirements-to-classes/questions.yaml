topic: 'OOAD: From Requirements to Classes'
domain: lld-and-ood
topic_slug: ooad-requirements-to-classes
version: 1
questions:
  - id: ooad-requirements-to-classes-001
    difficulty: beginner
    tags: [ooad, analysis-vs-design]
    question: |
      In OOAD, what is the primary concern of Object-Oriented ANALYSIS (as opposed to design)?
    options: ["Understanding the problem domain: what the significant concepts are and what they are responsible for, independent of implementation", "Choosing method signatures, visibility modifiers, and interfaces for software classes", "Selecting which GoF design patterns to apply and mapping each to a UML stereotype", "Deciding how objects will be persisted to a relational database and mapping fields to columns"]
    answer: 0
    explanation: |
      Analysis (OOA) is about the problem domain — the conceptual classes and their
      responsibilities — independent of any implementation. Method signatures, visibility,
      patterns, and persistence are all design (OOD) concerns that come afterward.
    ref: "concepts.md#analysis-vs-design-what-ooad-actually-means"

  - id: ooad-requirements-to-classes-002
    difficulty: beginner
    tags: [noun-verb, abbott, candidate-classes]
    question: |
      In Abbott's noun/verb textual analysis, the NOUNS and noun-phrases in a requirements
      statement are treated as candidates for what?
    options: ["Design patterns", "Classes or attributes", "Methods only", "Test cases"]
    answer: 1
    explanation: |
      Nouns and noun-phrases become candidate classes or attributes; verbs become candidate
      responsibilities (methods). It is a heuristic starting point, not a final answer — the
      candidates must then be filtered.
    ref: "concepts.md#nounverb-abbott-textual-analysis"

  - id: ooad-requirements-to-classes-003
    difficulty: beginner
    tags: [noun-verb, verbs, responsibilities]
    question: |
      In noun/verb analysis, verbs and verb-phrases (e.g. "books", "cancels", "pays") are
      candidates for what?
    options: ["Value objects", "Responsibilities / methods", "Inheritance hierarchies", "Package names"]
    answer: 1
    explanation: |
      Verbs map to candidate responsibilities (methods) — the things classes DO. Where those
      methods ultimately live is decided later by responsibility assignment (GRASP Information
      Expert).
    ref: "concepts.md#nounverb-abbott-textual-analysis"

  - id: ooad-requirements-to-classes-004
    difficulty: intermediate
    tags: [noun-verb, heuristic, filtering]
    question: |
      A candidate correctly says noun/verb analysis is "a heuristic, not a mechanical rule."
      What is the BEST justification for that statement?
    options: ["It over-generates candidates and misses implicit design objects, so results must be filtered and supplemented", "It works only for statically typed languages like Java and cannot be applied to dynamic ones", "It deterministically produces exactly the right number of classes with no filtering pass needed", "It fully replaces the class diagram, so no UML modeling step is required afterward"]
    answer: 0
    explanation: |
      Natural language is messy: the technique over-produces candidates (many nouns are
      attributes or synonyms), and it misses design classes (services, strategies) that never
      appear as nouns. So it is a first pass to defeat the blank page, requiring filtering and
      RDD-driven additions.
    ref: "concepts.md#nounverb-abbott-textual-analysis"

  - id: ooad-requirements-to-classes-005
    difficulty: intermediate
    tags: [noun-verb, filtering, attribute-vs-class]
    question: |
      Running noun/verb analysis on a booking prompt yields the noun "price." What is the most
      appropriate treatment in a first-cut model?
    options: ["Make Price a top-level entity with its own repository and a database-generated identity", "Discard it entirely because prices are purely a UI presentation concern with no place in the model", "Treat it as an attribute (often a Money value object), not a standalone class, unless it has its own behaviour or identity", "Make Price an interface so different pricing rules can implement it polymorphically"]
    answer: 2
    explanation: |
      "Price" has no distinct identity and is defined by its value, so it is an attribute —
      best modeled as a Money value object (currency + rounding). Promote a noun to a class
      only when it has its own behaviour or identity.
    ref: "concepts.md#nounverb-abbott-textual-analysis"

  - id: ooad-requirements-to-classes-006
    difficulty: intermediate
    tags: [noun-verb, synonyms, filtering]
    question: |
      The requirements mention "customer," "user," and "patron" in different sentences,
      clearly referring to the same actor. During filtering you should:
    options: ["Create three classes and relate them through a shared inheritance hierarchy with a common base", "Recognize them as synonyms for one concept and model a single class", "Keep all three as separate classes, since a larger model is always the safer choice", "Discard all three from the model because ambiguous terms should never be modeled"]
    answer: 1
    explanation: |
      Synonyms are a classic filtering case: collapse them into one concept (one class).
      Natural language uses different words for the same domain concept; the model should not.
    ref: "concepts.md#nounverb-abbott-textual-analysis"

  - id: ooad-requirements-to-classes-007
    difficulty: advanced
    tags: [noun-verb, limits, design-classes]
    question: |
      Your design needs a PricingStrategy and a SeatAllocator, but neither word appears as a
      noun anywhere in the requirements. What does this illustrate about noun/verb analysis?
    options: ["Noun/verb analysis misses implicit design objects; such classes come from responsibility-driven design and pattern recognition, not the text", "The requirements are defective and must be rewritten until every needed class appears as a noun", "You should force these words into the requirements text first, then re-run the noun pass on the edit", "These classes are unnecessary and can be dropped, since anything not named in the text is out of scope"]
    answer: 0
    explanation: |
      A known blind spot of Abbott's method is that design classes (service providers,
      coordinators, strategies) rarely appear as nouns. They are discovered via RDD role
      stereotypes and pattern recognition, layered on top of the noun pass.
    ref: "concepts.md#nounverb-abbott-textual-analysis"

  - id: ooad-requirements-to-classes-008
    difficulty: beginner
    tags: [crc-cards, structure]
    question: |
      A CRC card is divided into three sections. What are they?
    options: ["Class name, Responsibilities, Collaborators", "Class name, Attributes, Methods", "Class name, Interfaces, Implementations", "Class name, Inputs, Outputs"]
    answer: 0
    explanation: |
      CRC = Class, Responsibilities, Collaborators. The card names the class and lists what it
      knows/does (responsibilities) and which other classes it must message (collaborators).
    ref: "concepts.md#crc-cards-classresponsibilitycollaborator"

  - id: ooad-requirements-to-classes-009
    difficulty: beginner
    tags: [crc-cards, responsibility-definition]
    question: |
      In CRC terminology, a "responsibility" is defined as:
    options: ["A public method that returns void and mutates internal state", "A collaborator dependency injected through the class constructor", "Something a class knows or does", "A private field that is hidden behind an accessor method"]
    answer: 2
    explanation: |
      Beck and Cunningham defined a responsibility as "something a class knows or does" — both
      knowing (holding information) and doing (performing an action) count.
    ref: "concepts.md#crc-cards-classresponsibilitycollaborator"

  - id: ooad-requirements-to-classes-010
    difficulty: beginner
    tags: [crc-cards, collaborator-definition]
    question: |
      In CRC terminology, a "collaborator" of a class is:
    options: ["A subclass that inherits from it and overrides its responsibilities", "Another class it sends a message to — a request for information or to do something", "A unit test that exercises its public responsibilities in isolation", "A design pattern the class implements to structure its internals"]
    answer: 1
    explanation: |
      A collaborator is another class the current class must message — either to get
      information or to have work done. Collaborations reveal the coupling in the design.
    ref: "concepts.md#crc-cards-classresponsibilitycollaborator"

  - id: ooad-requirements-to-classes-011
    difficulty: intermediate
    tags: [crc-cards, session, role-play]
    question: |
      What is the core activity of a CRC design session that makes it valuable?
    options: ["Statically counting the number of classes and checking the total against a target budget", "Role-playing use-case scenarios by walking through the cards, assigning responsibilities and discovering collaborators as you go", "Writing full Java method implementations on each card before any scenario is walked through", "Ranking candidate design patterns by popularity and applying the most common ones first"]
    answer: 1
    explanation: |
      The value is the role-play: you enact each use-case across the cards, which forces
      responsibilities onto the right class and surfaces collaborations. It is design-thinking
      in motion — exactly what senior interviewers want to hear narrated.
    ref: "concepts.md#crc-cards-classresponsibilitycollaborator"

  - id: ooad-requirements-to-classes-012
    difficulty: intermediate
    tags: [crc-cards, if-in-doubt, heuristic]
    question: |
      A well-known CRC heuristic is "if in doubt, make it a class." What is the rationale?
    options: ["More classes always run faster because each one has a smaller method table to dispatch", "Splitting everything into classes automatically guarantees full SOLID compliance for the design", "Interviewers tally the number of classes and award a higher score for more of them", "An extra card is cheap to discard later, whereas a missing concept is expensive to retrofit"]
    answer: 3
    explanation: |
      The heuristic favors over-generation early because an unused card is trivially discarded,
      while a concept you failed to identify is costly to weave in later. It biases the first
      pass toward breadth, then you refine.
    ref: "concepts.md#crc-cards-classresponsibilitycollaborator"

  - id: ooad-requirements-to-classes-013
    difficulty: advanced
    tags: [crc-cards, srp, overloaded-card]
    question: |
      During a CRC session, one card's responsibility list keeps growing until it no longer
      fits on the card. What does this most likely signal?
    options: ["The class is taking on too many responsibilities — an SRP smell suggesting it should be split", "The card is correctly designed, since a class with many responsibilities is more efficient at runtime", "You need to introduce a Singleton so the overloaded card can be shared across the whole design", "The requirements are incomplete and the extra responsibilities should be dropped until they are"]
    answer: 0
    explanation: |
      An overflowing card is a visual SRP warning: the class is doing too much. The remedy is
      to split responsibilities onto separate cohesive classes, which is precisely the kind of
      iterative refinement CRC sessions are meant to trigger.
    ref: "concepts.md#crc-cards-classresponsibilitycollaborator"

  - id: ooad-requirements-to-classes-014
    difficulty: advanced
    tags: [crc-cards, anemic-model, feature-envy]
    question: |
      In a CRC session you assign "mark seat as booked" to BookingService, which flips
      seat.isBooked = true directly. Which smell does this introduce, and what is the fix?
    options: ["Premature optimization; add a caching layer in front of the seat state to speed it up", "Circular dependency between the two classes; introduce a mediator to break the cycle", "Feature envy / anemic model; the behaviour belongs on Seat, so Seat should own reserve()/book()", "Over-engineering; remove the Seat class and fold its flag directly into BookingService"]
    answer: 2
    explanation: |
      A service reaching into another object's fields to change them is feature envy and leaves
      Seat anemic (data-only). Information Expert says the seat owns its state, so book()/reserve()
      belongs on Seat. Behaviour should sit with the data it operates on.
    ref: "concepts.md#crc-cards-classresponsibilitycollaborator"

  - id: ooad-requirements-to-classes-015
    difficulty: intermediate
    tags: [rdd, wirfs-brock, mindset]
    question: |
      Responsibility-Driven Design reframes the central design question. Which question does
      RDD tell you to ask?
    options: ["What data fields does this class need?", "How many lines of code will this class have?", "Which database table maps to this class?", "What responsibilities should this object own?"]
    answer: 3
    explanation: |
      Wirfs-Brock's RDD shifts the question from "what data / what does it do" to "what
      responsibilities should this object OWN?" — modeling software as a community of
      collaborating objects, each with a clear role.
    ref: "concepts.md#responsibility-driven-design-wirfs-brock"

  - id: ooad-requirements-to-classes-016
    difficulty: intermediate
    tags: [rdd, metaphor, collaboration]
    question: |
      What is the guiding mental model of Responsibility-Driven Design?
    options: ["Software as a single central controller object that owns all logic and drives every operation", "Software as a community of collaborating objects, each playing a clear role and fulfilling a contract with its collaborators", "Software as a flat database of records with all behaviour expressed in queries against them", "Software as a stateless pipeline of pure functions passing data through, with no objects at all"]
    answer: 1
    explanation: |
      RDD models the system as cooperating objects, each with a defined role and a contract
      with collaborators — like a well-run organization where everyone has clear duties and
      knows whom to ask for what.
    ref: "concepts.md#responsibility-driven-design-wirfs-brock"

  - id: ooad-requirements-to-classes-017
    difficulty: advanced
    tags: [rdd, role-stereotypes, service-provider]
    question: |
      A use-case requires calculating a dynamic surge price, but no domain entity naturally
      owns that computation. Which RDD role stereotype best fits a new class created for it?
    options: ["Information holder", "Structurer", "Service provider", "Interfacer"]
    answer: 2
    explanation: |
      A class that performs work/computation on request is a service provider (e.g.
      PricingStrategy). Inventing such a non-domain class to keep responsibilities cohesive is
      GRASP Pure Fabrication — and it is how RDD surfaces design classes the noun pass misses.
    ref: "concepts.md#responsibility-driven-design-wirfs-brock"

  - id: ooad-requirements-to-classes-018
    difficulty: advanced
    tags: [rdd, role-stereotypes, interfacer]
    question: |
      You wrap an external Stripe SDK behind a PaymentGateway class so the rest of the system
      talks to a stable interface. Which RDD role stereotype does PaymentGateway play?
    options: ["Information holder that stores payment data and answers queries about it", "Coordinator that sequences the internal payment steps across domain objects", "Interfacer (translates between the system and the outside world)", "Structurer that maintains the relationships among the payment-related objects"]
    answer: 2
    explanation: |
      An interfacer translates between the system and external systems/users. Wrapping an
      external SDK to a stable in-app interface is the interfacer role — and in GoF terms this
      is typically realized with the Adapter pattern (see dp-adapter).
    ref: "concepts.md#responsibility-driven-design-wirfs-brock"

  - id: ooad-requirements-to-classes-019
    difficulty: intermediate
    tags: [rdd, coordinator, controller]
    question: |
      In the movie-booking example, BookingService orchestrates hold -> pay -> confirm across
      Show, PaymentGateway, and Booking. Which role stereotype is it playing?
    options: ["Coordinator / controller that directs and sequences the work of others", "Information holder that simply stores and answers queries about show and seat data", "Value object defined purely by its attributes and freely interchangeable when equal", "Structurer that merely maintains the static relationships among Show, Seat, and Booking"]
    answer: 0
    explanation: |
      BookingService coordinates and sequences the work of other objects — the
      coordinator/controller stereotype. Such classes rarely appear as nouns in requirements;
      RDD is how you discover them.
    ref: "concepts.md#responsibility-driven-design-wirfs-brock"

  - id: ooad-requirements-to-classes-020
    difficulty: beginner
    tags: [domain-modeling, entity]
    question: |
      What defines an ENTITY in domain modeling?
    options: ["It is always immutable and can never change any of its field values after construction", "It has no behaviour at all, only data fields exposed through plain getters and setters", "It has a distinct identity that persists over time, so two entities with identical attributes are still different", "It is defined entirely by its attribute values, so two with equal fields are the same entity"]
    answer: 2
    explanation: |
      An entity has a distinct identity (usually an id) that persists through state changes;
      two entities are different even if all their attributes match. A Booking or User is an
      entity — you track this specific one.
    ref: "concepts.md#domain-modeling-entities-value-objects-relationships"

  - id: ooad-requirements-to-classes-021
    difficulty: beginner
    tags: [domain-modeling, value-object]
    question: |
      What best characterizes a VALUE OBJECT?
    options: ["It has a unique database-generated id that is tracked across its whole lifecycle", "It must extend a shared base Entity class and inherit that class's identity semantics", "It always contains business logic and coordinates other objects through their public methods", "It is defined entirely by its attribute values, has no conceptual identity, and is ideally immutable"]
    answer: 3
    explanation: |
      A value object (Money, DateRange, SeatPosition) is defined solely by its values, has no
      identity, and should be immutable with value-based equals/hashCode. Two equal value
      objects are interchangeable.
    ref: "concepts.md#domain-modeling-entities-value-objects-relationships"

  - id: ooad-requirements-to-classes-022
    difficulty: intermediate
    tags: [domain-modeling, money, value-object]
    question: |
      Why model Money as a value object rather than a raw double?
    options: ["Doubles cannot be stored in a relational database column, so amounts need a wrapper class", "A value object encapsulates currency and rounding, prevents rounding bugs, and enables value-based equality", "Value objects are always faster than primitives because the JIT can stack-allocate every instance", "It is required by the Java Language Specification, which forbids storing monetary amounts in doubles"]
    answer: 1
    explanation: |
      Money-as-value-object bundles currency and rounding rules, avoids floating-point rounding
      errors, and gives correct value equality. Interviewers probe raw-double money precisely
      because it invites subtle bugs.
    ref: "concepts.md#domain-modeling-entities-value-objects-relationships"

  - id: ooad-requirements-to-classes-023
    difficulty: intermediate
    tags: [domain-modeling, entity-vs-value, classification]
    question: |
      Which of these is best modeled as an ENTITY rather than a value object?
    options: ["A DateRange (start, end) that is equal to any other range with the same two dates", "A SeatPosition (row, column) that is interchangeable with any equal row-and-column pair", "A Money amount with currency that is equal to any other amount holding the same value", "A Booking with its own id and lifecycle status"]
    answer: 3
    explanation: |
      A Booking has a distinct identity and a lifecycle (created -> confirmed -> cancelled) you
      must track over time — an entity. DateRange, SeatPosition, and Money are value-defined and
      have no identity — value objects.
    ref: "concepts.md#domain-modeling-entities-value-objects-relationships"

  - id: ooad-requirements-to-classes-024
    difficulty: intermediate
    tags: [domain-modeling, composition, aggregation]
    question: |
      What is the deciding test for composition versus aggregation between a whole and a part?
    options: ["Lifecycle ownership: if the whole is destroyed, must the part be destroyed too?", "The number of attributes each class has, with the larger class treated as the composing whole", "Whether the two classes are declared in the same package and compilation unit", "Whether inheritance is involved, since a subclass part always implies composition"]
    answer: 0
    explanation: |
      Composition (filled diamond) means the part's lifecycle is bound to the whole — destroy
      the whole and the part goes too. Aggregation (hollow diamond) means the part can outlive
      the whole. The test is lifecycle ownership, not size or feel.
    ref: "concepts.md#domain-modeling-entities-value-objects-relationships"

  - id: ooad-requirements-to-classes-025
    difficulty: advanced
    tags: [domain-modeling, composition, aggregation, example]
    question: |
      Seats belonging to a specific Show versus Movies shown at a Theatre. Which relationship
      classification is correct?
    options: ["Both are composition, since a part always shares the lifecycle of whatever whole references it", "Both are aggregation, since neither part is ever destroyed together with its enclosing whole", "Show-to-Seat is composition (seats die with the show); Theatre-to-Movie is aggregation (a movie plays elsewhere too)", "Show-to-Seat is aggregation because seats outlive shows; Theatre-to-Movie is composition because a movie dies with its theatre"]
    answer: 2
    explanation: |
      A show's seat assignments are meaningless without that show, so composition. A movie
      exists independently of any one theatre (it plays elsewhere), so aggregation. Lifecycle
      ownership decides each case.
    ref: "concepts.md#domain-modeling-entities-value-objects-relationships"

  - id: ooad-requirements-to-classes-026
    difficulty: intermediate
    tags: [domain-modeling, multiplicity]
    question: |
      A Booking contains one or more seats, and a seat can be in at most one active booking.
      How should this be annotated on the class diagram?
    options: ["Booking 1 -- 1 Seat, forcing every booking to hold exactly one seat and no more", "Multiplicity does not need to be shown, since the association line alone conveys the cardinality", "Booking * -- * Seat with no constraints, letting any seat sit in unlimited active bookings", "Booking 1 -- 1..* Seat, and Seat 0..1 -- Booking (active)"]
    answer: 3
    explanation: |
      One booking has 1..* seats; a seat participates in 0..1 active bookings. Annotating
      multiplicity precisely (including the 0..1 for a possibly-unbooked seat) demonstrates
      rigor and prevents modeling errors like double-booking.
    ref: "concepts.md#domain-modeling-entities-value-objects-relationships"

  - id: ooad-requirements-to-classes-027
    difficulty: beginner
    tags: [grasp, information-expert]
    question: |
      GRASP Information Expert says a responsibility should be assigned to:
    options: ["The class with the fewest methods, to keep the responsibility spread evenly", "Whichever class was instantiated first during the running scenario", "A central manager or controller class that owns all the system's logic", "The class that has the information needed to fulfil it"]
    answer: 3
    explanation: |
      Information Expert assigns a responsibility to the class that holds the information
      required to carry it out. This keeps behaviour with data and directly prevents anemic
      models.
    ref: "concepts.md#tying-it-to-grasp-information-expert--creator"

  - id: ooad-requirements-to-classes-028
    difficulty: intermediate
    tags: [grasp, information-expert, total-price]
    question: |
      Who should compute a booking's total price, per Information Expert?
    options: ["A BookingService that loops over booking.getSeats() externally and sums the prices itself", "The Booking itself, since it knows its seats and their prices", "A static utility PriceUtils class that takes the seat list and returns the computed total", "The database via a stored procedure that aggregates the seat rows for that booking"]
    answer: 1
    explanation: |
      The Booking knows its seats (and can delegate to a PricingStrategy), so it is the
      information expert for its own total. A service looping over getSeats() externally is the
      anemic/feature-envy anti-pattern.
    ref: "concepts.md#tying-it-to-grasp-information-expert--creator"

  - id: ooad-requirements-to-classes-029
    difficulty: intermediate
    tags: [grasp, creator]
    question: |
      GRASP Creator suggests class A should create instances of class B when:
    options: ["A is declared in the same source file and package as B", "B is a value object with no identity of its own", "A has more attributes than B and so is the heavier of the two classes", "A aggregates, contains, records, or closely uses B, or has B's initializing data"]
    answer: 3
    explanation: |
      Creator assigns creation of B to A when A aggregates/contains/records/closely uses B or
      holds the data to initialize B. E.g. a Show aggregates Seats so it creates them; a
      BookingService has the request data so it creates the Booking.
    ref: "concepts.md#tying-it-to-grasp-information-expert--creator"

  - id: ooad-requirements-to-classes-030
    difficulty: advanced
    tags: [grasp, pipeline, method-integration]
    question: |
      Which sequence correctly describes how the techniques dovetail in the
      requirements-to-classes pipeline?
    options: ["Noun/verb surfaces candidates -> CRC role-play distributes responsibilities -> Information Expert decides which class each lands on -> Creator decides who instantiates whom", "Choose GoF patterns first, then run noun/verb to name them, then delete any candidate classes left unused", "Write the implementation code first, then reverse-engineer a domain model, then backfill the requirements to match", "Draw the finished class diagram up front, then invent the requirements afterward so they justify each class"]
    answer: 0
    explanation: |
      The pipeline flows: noun/verb generates candidate classes, CRC role-play distributes
      responsibilities and finds collaborators, Information Expert pins each responsibility on
      the right class, and Creator resolves instantiation ownership.
    ref: "concepts.md#tying-it-to-grasp-information-expert--creator"

  - id: ooad-requirements-to-classes-031
    difficulty: intermediate
    tags: [worked-example, filtering, seat-hold]
    question: |
      In the kiosk example, the requirement "hold selected seats for 5 minutes" leads to a
      SeatHold class even though "hold" is barely a noun. Why promote it to a class?
    options: ["Every verb in the requirements must be promoted to its own dedicated class", "To increase the total class count, since a larger diagram scores better in reviews", "It carries its own state (held seats + expiry) and behaviour (isExpired), so it is a genuine entity the design needs", "Because holds are persisted in a database table and every persisted row needs a class"]
    answer: 2
    explanation: |
      SeatHold has its own state (which seats, expiry timestamp) and behaviour (isExpired) — it
      is a real, discovered entity that the concurrency requirement demands. Promoting it is
      justified by behaviour/identity, not by grammar.
    ref: "concepts.md#worked-example-requirements--classes-for-a-movie-booking-kiosk"

  - id: ooad-requirements-to-classes-032
    difficulty: intermediate
    tags: [worked-example, pricing-strategy, ocp, patterns]
    question: |
      In the kiosk design, PricingStrategy is modeled as an interface. When the interviewer
      says "add a loyalty discount," what should change?
    options: ["Edit BookingService's pricing method to add a new if-branch that checks for loyalty customers", "Rewrite the Booking class so its total() method hard-codes the loyalty discount logic inline", "Add a boolean isLoyalty field to Seat and branch on it wherever prices are computed", "Add a new PricingStrategy implementation; existing classes stay closed for modification"]
    answer: 3
    explanation: |
      A Strategy interface makes pricing extensible: a new rule is a new implementation class,
      and BookingService/Booking remain closed for modification (OCP). This is the payoff of
      spotting the variation point during analysis. See dp-strategy.
    ref: "concepts.md#worked-example-requirements--classes-for-a-movie-booking-kiosk"

  - id: ooad-requirements-to-classes-033
    difficulty: advanced
    tags: [worked-example, seat-type, inheritance-vs-composition]
    question: |
      A candidate wants PremiumSeat and RegularSeat as subclasses of Seat. In the kiosk design,
      what is the recommended alternative and why?
    options: ["Keep the subclasses, since inheritance is always the cleaner way to express seat variation", "Make Seat an abstract base with no attributes and push every field down into the subclasses", "Delete the Seat class entirely and inline the seat fields directly into the Show class", "Model type as a SeatType enum attribute plus a PricingStrategy, since only price varies — subclassing here is over-modeling"]
    answer: 3
    explanation: |
      When the only thing that differs between seat kinds is price, a SeatType enum plus a
      strategy captures the variation without a subclass explosion. Reserve inheritance for
      genuine substitutable subtypes; prefer composition otherwise.
    ref: "concepts.md#worked-example-requirements--classes-for-a-movie-booking-kiosk"

  - id: ooad-requirements-to-classes-034
    difficulty: advanced
    tags: [worked-example, adapter, payment-gateway, patterns]
    question: |
      The kiosk's PaymentGateway is an interface with concrete implementations wrapping Stripe
      or Razorpay. Which GoF pattern does this represent, and what is the benefit?
    options: ["Observer; the gateway notifies subscribed listeners whenever a payment is completed", "Adapter; it wraps external SDKs behind a stable interface so the rest of the system is insulated from vendor differences", "Singleton; the design guarantees exactly one gateway instance exists across the whole system", "Decorator; each implementation dynamically layers extra behaviour onto a base payment object"]
    answer: 1
    explanation: |
      Wrapping incompatible external SDKs behind one stable interface is the Adapter pattern.
      It isolates vendor-specific code so switching providers touches only the adapter. Pattern
      mechanics live in dp-adapter.
    ref: "concepts.md#worked-example-requirements--classes-for-a-movie-booking-kiosk"

  - id: ooad-requirements-to-classes-035
    difficulty: beginner
    tags: [worked-example, refund, operation-vs-class]
    question: |
      In the kiosk noun/verb pass, "refund" appears. How is it best treated?
    options: ["As an operation (a method on Payment / BookingService), not a class", "As a top-level entity with its own id and a created -> approved -> settled lifecycle", "As an immutable value object defined solely by its amount and currency", "As an interface with implementations for each supported refund channel"]
    answer: 0
    explanation: |
      "Refund" is an action, not a thing with persistent state or identity — it is a method
      (e.g. PaymentGateway.refund / BookingService.cancel). Not every noun-ish token deserves a
      class.
    ref: "concepts.md#worked-example-requirements--classes-for-a-movie-booking-kiosk"

  - id: ooad-requirements-to-classes-036
    difficulty: intermediate
    tags: [model-to-code, association, reference-field]
    question: |
      When converting a domain association with multiplicity 1..* into a design-level class,
      what does it typically become?
    options: ["A single static field shared across all instances of the owning class", "A new inheritance relationship in which the whole extends the part type", "A collection reference field (e.g. List<Seat>) with the appropriate multiplicity", "A database join defined only in the schema, with no corresponding field on the class"]
    answer: 2
    explanation: |
      A 1..* association becomes a collection reference (List<Seat>); a 0..1 becomes an Optional
      or nullable reference. The conversion preserves multiplicity as the field's cardinality.
    ref: "concepts.md#putting-it-together-from-model-to-class-diagram"

  - id: ooad-requirements-to-classes-037
    difficulty: intermediate
    tags: [model-to-code, design-classes, transition]
    question: |
      What is added during the transition from the analysis-phase domain model to the
      design-phase class diagram?
    options: ["Nothing; the domain model is already the finished class diagram and needs no further software-level detail before implementation", "Database indexes, query execution plans, and the physical storage layout chosen for each persisted table", "Only the removal of value objects, which get collapsed into primitive fields on their owning entity", "Visibility, method signatures, constructors, and design classes (services, factories, strategies, adapters) the domain model omitted"]
    answer: 3
    explanation: |
      The design pass adds software detail — visibility, signatures, constructors — and
      introduces design classes (RDD service providers, coordinators, interfacers) that the
      conceptual domain model did not include.
    ref: "concepts.md#putting-it-together-from-model-to-class-diagram"

  - id: ooad-requirements-to-classes-038
    difficulty: beginner
    tags: [iteration, refinement]
    question: |
      Which statement best reflects how OOAD's requirements-to-classes process should be run?
    options: ["A single forward pass that must be modeled correctly the first time, with no later revision permitted", "An iterative loop: over-generate, refine on scenarios, refine on change, refine on smells", "A one-time activity completed up front before any requirements have been gathered or clarified", "A purely automated transformation from text straight to classes that requires no human design judgment"]
    answer: 1
    explanation: |
      OOAD is iterative. You over-generate first, then refine by role-playing scenarios,
      applying "add X" follow-ups, and fixing smells. The first model is a hypothesis to be
      refined, not a final answer.
    ref: "concepts.md#iteration-and-refinement"

  - id: ooad-requirements-to-classes-039
    difficulty: intermediate
    tags: [iteration, ocp, refine-on-change]
    question: |
      During refinement, adding a requested feature forces edits across five existing classes.
      What does this reveal and what should you do?
    options: ["The design is fine; touching five classes for a single feature is a normal, expected amount of change", "Delete the feature request as out of scope, since any change spanning five classes is too costly to justify", "You should add a Singleton so one shared instance can centralize all five of the edits in a single place", "The model failed the Open/Closed Principle at that seam; refactor (often extract an interface + Strategy) before continuing"]
    answer: 3
    explanation: |
      A change rippling across many classes is an OCP failure. The senior move is to recognize
      the smell and refactor the seam — typically extract an interface and a Strategy — so
      future extensions add a class instead of editing many.
    ref: "concepts.md#iteration-and-refinement"

  - id: ooad-requirements-to-classes-040
    difficulty: advanced
    tags: [iteration, god-class, srp, smell]
    question: |
      After a first pass, every verb (hold, pay, confirm, cancel, price, notify) landed as a
      method on BookingService. What smell is this and what is the fix?
    options: ["A god/coordinator class violating SRP; redistribute responsibilities to their information experts (Seat owns its state, Booking computes its total, etc.)", "It is fine; a coordinator class is meant to own every operation, so concentrating all the verbs on it is correct by design", "It is a value object defined purely by its attribute values, so the proper fix is to make it immutable with value-based equality", "It is a legitimate Facade offering one simple entry point, so every method should be left exactly where it is"]
    answer: 0
    explanation: |
      When one coordinator accumulates every verb, it becomes a god class violating SRP.
      Redistribute using Information Expert so behaviour lives with the data, keeping the
      coordinator to genuine sequencing responsibilities.
    ref: "concepts.md#iteration-and-refinement"

  - id: ooad-requirements-to-classes-041
    difficulty: beginner
    tags: [attribution, abbott, history]
    question: |
      Which technique is attributed to Russell Abbott's 1983 work on program design from
      informal English descriptions?
    options: ["CRC cards, the class/responsibility/collaborator index-card brainstorming technique", "Responsibility-Driven Design, which frames each object around the role it plays", "Noun/verb textual analysis for extracting candidate classes and methods", "GRASP, the set of general responsibility-assignment software patterns"]
    answer: 2
    explanation: |
      Abbott (1983) introduced deriving candidate objects and operations from the nouns and
      verbs of an informal English program description — the textual-analysis technique.
    ref: "concepts.md#nounverb-abbott-textual-analysis"

  - id: ooad-requirements-to-classes-042
    difficulty: beginner
    tags: [attribution, crc, beck-cunningham]
    question: |
      Who introduced CRC cards, and at which venue?
    options: ["Martin Fowler, at a Refactoring workshop", "Rebecca Wirfs-Brock, in Object Design", "Grady Booch, in the UML specification", "Kent Beck and Ward Cunningham, at OOPSLA 1989"]
    answer: 3
    explanation: |
      Beck and Cunningham presented CRC cards at OOPSLA 1989 as a tool for teaching and doing
      object-oriented design. Wirfs-Brock is associated with RDD; Booch with OOAD notation.
    ref: "concepts.md#crc-cards-classresponsibilitycollaborator"

  - id: ooad-requirements-to-classes-043
    difficulty: intermediate
    tags: [attribution, larman, grasp]
    question: |
      Which book is most associated with GRASP and use-case-driven OOA/OOD, and is a canonical
      OOAD reference?
    options: ["Design Patterns (Gang of Four)", "Applying UML and Patterns (Craig Larman)", "Clean Code (Robert Martin)", "The Pragmatic Programmer"]
    answer: 1
    explanation: |
      Larman's Applying UML and Patterns popularized GRASP (Information Expert, Creator, Pure
      Fabrication, etc.) and the domain-model-first, use-case-driven OOA/OOD approach.
    ref: "concepts.md#tying-it-to-grasp-information-expert--creator"

  - id: ooad-requirements-to-classes-044
    difficulty: advanced
    tags: [grasp, pure-fabrication, design-class]
    question: |
      Inventing a PricingStrategy class that does not correspond to any real-world domain
      concept, purely to keep responsibilities cohesive, is an example of which GRASP principle?
    options: ["Information Expert", "Creator", "Pure Fabrication", "Controller"]
    answer: 2
    explanation: |
      Pure Fabrication assigns a highly cohesive responsibility to an artificial class that is
      not part of the domain model, to preserve cohesion and low coupling. Service providers
      like PricingStrategy are classic pure fabrications.
    ref: "concepts.md#responsibility-driven-design-wirfs-brock"

  - id: ooad-requirements-to-classes-045
    difficulty: intermediate
    tags: [analysis-vs-design, anti-pattern, procedural]
    question: |
      A candidate skips domain analysis and immediately writes XxxManager and XxxService
      classes holding all the logic, with data-only entities. What is the likely result?
    options: ["An anemic, procedural design whose classes do not map to the problem domain", "A highly object-oriented, cohesive design whose classes each own one clear responsibility", "A correct application of Information Expert, with behaviour placed on the data-owning class", "A textbook use of immutable value objects compared by their attribute values"]
    answer: 0
    explanation: |
      Jumping to manager/service classes with data-only entities yields a procedural, anemic
      model. Analysis-first — modeling domain concepts and their responsibilities — produces
      classes that mirror reality and hold their own behaviour.
    ref: "concepts.md#analysis-vs-design-what-ooad-actually-means"

  - id: ooad-requirements-to-classes-046
    difficulty: advanced
    tags: [value-object, immutability, bug]
    question: |
      Why is immutability strongly recommended for value objects like Money or DateRange?
    options: ["Immutable objects are guaranteed to use strictly less memory than mutable ones in every case because the JVM interns them", "The Java compiler categorically requires it and refuses to compile any value class that declares a setter method", "Because they are shared by value/equality, a mutable value object shared by reference can be changed under another holder, causing subtle bugs", "Mutable value objects are technically forbidden from overriding equals() and hashCode(), so equality comparison would break"]
    answer: 2
    explanation: |
      Value objects are compared and used by value; if mutable and shared by reference, one
      holder mutating it corrupts state for others. Immutability (plus value-based
      equals/hashCode) is the safe, idiomatic design and a common interview probe.
    ref: "concepts.md#domain-modeling-entities-value-objects-relationships"

  - id: ooad-requirements-to-classes-047
    difficulty: intermediate
    tags: [noun-verb, vague-nouns, filtering]
    question: |
      Which of these candidate nouns from a requirements document is LEAST likely to become a
      domain class?
    options: ["A confirmed Booking record", "A settled Payment transaction", "An individual bookable Seat", "The system / the application"]
    answer: 3
    explanation: |
      Vague/meta nouns like "system," "application," "data," or "information" almost never map
      to domain classes — they are filtered out. Booking, Seat, and Payment are concrete domain
      concepts with identity and behaviour.
    ref: "concepts.md#nounverb-abbott-textual-analysis"

  - id: ooad-requirements-to-classes-048
    difficulty: advanced
    tags: [crc, collaboration, coupling]
    question: |
      During CRC role-play, Booking cannot determine seat availability on its own and must ask
      Show. What does recording "Show" as a collaborator of Booking make explicit?
    options: ["That Booking is a subtype of Show and should inherit its fields via generalization", "A coupling/dependency: Booking depends on Show to fulfil part of its responsibility", "That Show is a value object with no identity, defined solely by its attribute values", "That the two classes are so tightly related they should be merged into one"]
    answer: 1
    explanation: |
      A collaborator entry documents that one class depends on another to complete a
      responsibility — making coupling explicit and visible. It does not imply inheritance or
      merging; it is a message/dependency relationship.
    ref: "concepts.md#crc-cards-classresponsibilitycollaborator"

  - id: ooad-requirements-to-classes-049
    difficulty: intermediate
    tags: [domain-modeling, structurer, role]
    question: |
      A Theatre class mainly maintains the set of Screens and Shows it offers and their
      relationships. Which RDD role stereotype fits it best?
    options: ["Structurer (maintains relationships among objects)", "Service provider (performs work or computation on request)", "Interfacer (translates between the system and the outside world)", "Value object (defined purely by its attribute values)"]
    answer: 0
    explanation: |
      A structurer maintains relationships among a group of objects — a Theatre holding and
      organizing its Screens/Shows fits this stereotype. It mostly knows and organizes rather
      than computes or translates.
    ref: "concepts.md#responsibility-driven-design-wirfs-brock"

  - id: ooad-requirements-to-classes-050
    difficulty: advanced
    tags: [creator, factory, patterns]
    question: |
      GRASP Creator says Show should create its Seats. When the creation logic grows conditional
      or likely to expand, which GoF pattern commonly formalizes this creation responsibility?
    options: ["Observer (notifies subscribers whenever its state changes)", "Factory (Factory Method / Abstract Factory)", "Strategy (encapsulates interchangeable algorithms)", "Proxy (a stand-in controlling access to another object)"]
    answer: 1
    explanation: |
      Creator identifies who should instantiate an object; when that creation is conditional or
      apt to grow, a Factory formalizes it so adding a variant touches one place. Pattern
      mechanics live in dp-factory-method.
    ref: "concepts.md#tying-it-to-grasp-information-expert--creator"

  - id: ooad-requirements-to-classes-051
    difficulty: expert
    tags: [worked-example, concurrency, seat-hold]
    question: |
      Why does the "hold seats for 5 minutes so two users can't book the same seat" requirement
      most directly justify introducing SeatHold with an expiry, rather than just a boolean on
      Seat?
    options: ["Booleans cannot be persisted or stored in memory reliably, so a dedicated holder class is required to carry the flag", "A boolean field would automatically make the enclosing Seat class immutable, which the concurrency design forbids", "SeatHold is mandated by the Strategy pattern, which cannot function unless reservations are modeled as separate objects", "The hold has its own state (which seats, when it expires) and behaviour (isExpired) that a single boolean cannot represent, and it models the temporary reservation as a first-class concept"]
    answer: 3
    explanation: |
      The temporary-reservation concept carries state (held seats + expiry timestamp) and
      behaviour (isExpired(now)) that a bare boolean cannot express. Modeling it as SeatHold
      captures the time-boxed reservation cleanly and supports releasing on expiry — a
      discovered design entity driven by the concurrency requirement.
    ref: "concepts.md#worked-example-requirements--classes-for-a-movie-booking-kiosk"

  - id: ooad-requirements-to-classes-052
    difficulty: intermediate
    tags: [method-integration, lld-method, cross-ref]
    question: |
      How does this OOAD topic relate to the seven-step LLD interview method?
    options: ["It replaces the entire seven-step method, making the other six steps unnecessary to perform", "It zooms into steps 2 and 3 (identify objects, establish relationships), giving the concrete techniques for translating requirements into a class model", "It applies only to the final coding step and has nothing to say about the earlier modeling steps", "It is entirely unrelated, since OOAD techniques are never actually applied in real LLD interviews"]
    answer: 1
    explanation: |
      OOAD's noun/verb, CRC, RDD, and GRASP techniques are the concrete mechanics behind steps
      2 (identify core objects) and 3 (establish relationships) of the LLD interview method —
      the how-to-think for turning a prompt into classes.
    ref: "concepts.md#analysis-vs-design-what-ooad-actually-means"

  - id: ooad-requirements-to-classes-053
    difficulty: advanced
    tags: [adjective, subclass-vs-attribute, noun-verb]
    question: |
      Noun/verb analysis of "a premium seat" surfaces the adjective "premium." What are the two
      reasonable modeling options, and which is usually preferred first?
    options: ["Either a type attribute (e.g. SeatType enum) or a subclass; prefer the attribute unless the subtypes have genuinely different behaviour", "Always a new subclass PremiumSeat and never an attribute, because an adjective always signals a distinct subtype", "Always extract the adjective into its own separate microservice with an independent deployment lifecycle", "Ignore adjectives entirely during modeling, since only nouns and verbs carry any design significance"]
    answer: 0
    explanation: |
      Adjectives hint at either an attribute (SeatType enum) or a subtype. Prefer an attribute
      when only data/price differs; reach for a subclass only when subtypes exhibit genuinely
      different, substitutable behaviour that honours Liskov.
    ref: "concepts.md#nounverb-abbott-textual-analysis"

  - id: ooad-requirements-to-classes-054
    difficulty: intermediate
    tags: [rdd, information-holder, role]
    question: |
      A Seat class mainly knows its type and current status and answers questions about them.
      Which RDD role stereotype does it primarily play?
    options: ["Coordinator", "Interfacer", "Information holder", "Service provider"]
    answer: 2
    explanation: |
      An information holder knows and provides information (and manages its own small state).
      Seat, knowing its type and availability status, is a classic information holder — though
      it still owns behaviour to transition its own state (Information Expert).
    ref: "concepts.md#responsibility-driven-design-wirfs-brock"

  - id: ooad-requirements-to-classes-055
    difficulty: expert
    tags: [analysis-design, domain-first, senior-signal]
    question: |
      Why do experienced interviewers value narrating a conceptual (domain-model) pass — "in
      this domain we have shows, seats, bookings…" — before writing any class keyword?
    options: ["It is a mandatory step the UML specification requires before any class diagram may legally be drawn", "It lets you skip the separate requirement-clarification phase, since the domain vocabulary captures every constraint on its own", "It reliably reduces any design to exactly five core classes, the count interviewers regard as optimal", "It grounds the design in the real domain so classes are intuitive and cohesive, and it demonstrates analysis maturity before jumping to implementation machinery"]
    answer: 3
    explanation: |
      A domain-first pass (Larman's conceptual classes) makes the model mirror reality, keeping
      it intuitive and cohesive, and signals that the candidate analyzes before coding rather
      than reflexively producing manager/service scaffolding.
    ref: "concepts.md#analysis-vs-design-what-ooad-actually-means"

  - id: ooad-requirements-to-classes-056
    difficulty: intermediate
    tags: [homonym, noun-verb, limits]
    question: |
      In a library system, the word "book" appears both as "book a copy" and "a book on the
      shelf." What limitation of noun/verb analysis does this highlight?
    options: ["It cannot be applied to any English text unless the requirements are first rewritten in a controlled formal grammar", "Homonyms/grammar accidents can mislead: the same word may be a verb or a noun with different meanings, so blind extraction needs human filtering", "It proves the requirements document itself is defective and must be sent back to the stakeholders for rewriting", "It means both occurrences of the word must be collapsed into a single shared class regardless of their meaning"]
    answer: 1
    explanation: |
      Whether a concept surfaces as noun or verb, and homonyms like "book," are accidents of
      phrasing. The technique over-weights grammar, so a human must disambiguate meaning during
      filtering rather than mechanically extracting.
    ref: "concepts.md#nounverb-abbott-textual-analysis"

  - id: ooad-requirements-to-classes-057
    difficulty: advanced
    tags: [state-pattern, seat-status, patterns]
    question: |
      Seat status moves AVAILABLE -> HELD -> BOOKED (and back on release/expiry). If these
      transitions and their rules grow complex, which pattern is a natural fit, and where is it
      taught?
    options: ["Strategy; its full mechanics are taught here because seat transitions are really interchangeable pricing algorithms in disguise", "State pattern; its mechanics are owned by dp-state and referenced here by name", "Singleton; taught in dp-singleton, since only one seat-status object may ever exist across the system", "Visitor; taught here in full because each status transition is a visitor traversing the seat structure"]
    answer: 1
    explanation: |
      A finite set of states with rules governing transitions is the State pattern's sweet
      spot. Per the domain boundary, this topic references it by name for extensibility; the
      full mechanics live in dp-state.
    ref: "concepts.md#worked-example-requirements--classes-for-a-movie-booking-kiosk"

  - id: ooad-requirements-to-classes-058
    difficulty: expert
    tags: [iteration, feature-envy, refine-on-smells]
    question: |
      Refining a first-cut model, you notice ReportGenerator repeatedly calls
      booking.getSeats(), seat.getType(), seat.getPrice() to build totals. Which smell is this,
      and what is the OOAD-aligned remedy?
    options: ["Feature envy; move the total-computing behaviour onto Booking/Seat (Information Expert) so the report just asks booking.total()", "Shotgun surgery; merge ReportGenerator, Booking, and Seat into one class so a change touches only that single unit", "Speculative generality; delete the Seat class entirely and inline its type and price fields into Booking", "Primitive obsession; replace the Money value objects with raw doubles so the report can sum them directly"]
    answer: 0
    explanation: |
      A class reaching repeatedly into another's data to compute something is feature envy. The
      fix, per Information Expert, is to move the computation to where the data lives (Booking
      delegating to Seat/PricingStrategy) so callers ask for the result instead of assembling it.
    ref: "concepts.md#iteration-and-refinement"

  - id: ooad-requirements-to-classes-059
    difficulty: intermediate
    tags: [domain-modeling, generalization, liskov]
    question: |
      When is generalization (is-a / inheritance) the right relationship to use in a domain
      model?
    options: ["Whenever two classes happen to share any field, since a common attribute is sufficient proof of an is-a relationship", "Only for genuine substitutable subtypes that honour the Liskov Substitution Principle", "Always, as the default relationship, because inheritance maximizes code reuse better than composition ever can", "Only between value objects, since entities with identity are barred from participating in generalization"]
    answer: 1
    explanation: |
      Inheritance should express a true is-a relationship where the subtype is substitutable
      for the base (Liskov). Sharing a field is not enough — that often calls for composition.
      Misusing inheritance for reuse creates fragile hierarchies.
    ref: "concepts.md#domain-modeling-entities-value-objects-relationships"

  - id: ooad-requirements-to-classes-060
    difficulty: expert
    tags: [pipeline, senior-signal, technique-naming]
    question: |
      In an LLD round, which behaviour most strongly signals senior-level OOAD skill when
      translating requirements to classes?
    options: ["Naming the technique in use (noun/verb, CRC role-play, Information Expert) while filtering candidates and moving a responsibility to a better-fitting class when a scenario reveals it belongs elsewhere", "Mechanically listing every noun in the prompt as its own class with no filtering pass, to guarantee nothing is missed", "Immediately committing to three named GoF design patterns up front before any domain modeling has been done", "Producing the largest possible class diagram, on the reasoning that more classes signal more thorough analysis"]
    answer: 0
    explanation: |
      Seniority shows in narrating the method and, crucially, in refining: filtering candidates
      and relocating responsibilities to their information experts when role-play reveals a
      mismatch. It is the reasoning and iteration, not raw class count or premature patterns,
      that scores.
    ref: "concepts.md#iteration-and-refinement"

