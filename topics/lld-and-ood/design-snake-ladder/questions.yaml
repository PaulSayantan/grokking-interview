topic: "Design a Snake & Ladder Game"
domain: lld-and-ood
topic_slug: design-snake-ladder
version: 1
questions:
  - id: design-snake-ladder-001
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      In the first five minutes of "Design Snake & Ladder", which clarifying question most
      directly changes the CODE of your game loop (not just configuration values)?
    options:
      - "How many snakes and ladders are on the board?"
      - "Is the win condition exact landing (with bounce/stay on overshoot) or reach-or-pass?"
      - "What are the players' names?"
      - "Should the board be 10x10 or 8x8?"
    answer: 1
    explanation: |
      Snake/ladder counts, names, and board dimensions are all data — they flow in through
      configuration without changing logic. The win rule changes the branch structure of the
      turn: reach-or-pass is a simple `>=` check, while exact-landing requires handling the
      overshoot case (stay put or bounce back). Surfacing rule ambiguities that alter control
      flow is exactly what requirements clarification is for.
    ref: "concepts.md#requirements-clarification"

  - id: design-snake-ladder-002
    difficulty: beginner
    tags: [entities, responsibilities]
    question: |
      In a clean Snake & Ladder design, which class should own the knowledge of WHERE the
      snakes and ladders are?
    options:
      - "Game — it orchestrates everything, so it should know the layout"
      - "Player — each player must know what they might land on"
      - "Board — it owns the static layout and answers 'where do you really end up?'"
      - "Dice — it decides movement, so it should apply jumps too"
    answer: 2
    explanation: |
      The Board encapsulates the playing surface: it holds the jump map and exposes
      getFinalPosition(pos). Game asks the board where a player ends up but never inspects
      the layout itself — that separation lets you swap board configurations without touching
      the game loop. Player and Dice knowing the layout would scatter one responsibility
      across multiple classes (an SRP violation).
    ref: "concepts.md#core-objects-and-entities"

  - id: design-snake-ladder-003
    difficulty: intermediate
    tags: [data-structures, design-decisions]
    question: |
      Why is a Map<Integer, Jump> (trigger position → jump) usually preferred over a
      100-element Cell[] array for representing the board?
    options:
      - "HashMap lookup is asymptotically faster than array indexing"
      - "Arrays cannot store objects in Java"
      - "A map prevents two players from occupying the same cell"
      - "Snakes and ladders are sparse, so a map avoids ~90 empty Cell objects and adapts to any board size"
    answer: 3
    explanation: |
      A standard board has ~8-10 snakes and ~8-10 ladders on 100 cells — the layout is
      sparse. A map stores only the interesting positions, gives O(1) lookup, and works
      unchanged for a 50- or 200-cell board. Array indexing is actually faster than hashing
      (option A is backwards), but both are O(1) and irrelevant at this scale; the real win
      is representing only what exists.
    ref: "concepts.md#key-design-decisions"

  - id: design-snake-ladder-004
    difficulty: intermediate
    tags: [abstraction, polymorphism]
    question: |
      A candidate unifies Snake and Ladder behind a common Jump interface with getTrigger()
      and getTarget(). What is the strongest justification?
    options:
      - "Both behave identically at lookup time ('land on trigger, move to target'), so Board needs one code path instead of two"
      - "It reduces the number of classes in the design"
      - "Interfaces are always preferable to concrete classes"
      - "It lets snakes be converted into ladders at runtime"
    answer: 0
    explanation: |
      From the Board's perspective, a snake and a ladder are the same thing: a redirect from
      one cell to another. Unifying them means getFinalPosition has a single
      jumps.get(pos).getTarget() path rather than separate snake-map and ladder-map checks.
      The classes differ only in their construction invariant (head > tail vs end > start),
      which each constructor enforces. It's polymorphism removing duplication — not class-count
      golf or dogma about interfaces.
    ref: "concepts.md#key-design-decisions"

  - id: design-snake-ladder-005
    difficulty: beginner
    tags: [strategy-pattern, testability]
    question: |
      Why should Dice be an interface injected into Game, rather than Game calling
      new Random().nextInt(6)+1 directly?
    options:
      - "Random is deprecated in modern Java"
      - "An interface makes rolling faster"
      - "Game must support thousands of dice types at launch"
      - "It enables deterministic tests (scripted dice) and makes 'two dice' or 'crooked dice' a config change, not a Game edit"
    answer: 3
    explanation: |
      Hard-coded randomness makes the game loop untestable — you can't assert positions when
      rolls are unpredictable. Injecting a Dice interface lets tests supply a scripted
      sequence, and the common follow-ups (two dice, loaded dice) become new implementations
      injected at construction: the Strategy pattern applied where change is genuinely
      expected. Performance and deprecation are red herrings.
    ref: "concepts.md#key-design-decisions"

  - id: design-snake-ladder-006
    difficulty: intermediate
    tags: [validation, invariants]
    question: |
      Which of these board configurations should Board's validation REJECT?
    options:
      - "A board with zero snakes and zero ladders"
      - "A ladder from 3 to 84"
      - "A snake with head 40 and tail 62"
      - "Two ladders ending at the same cell (different starts)"
    answer: 2
    explanation: |
      A snake must send you DOWN: head > tail is the invariant, so head 40 / tail 62 is
      invalid (it would act like a ladder). A jump-free board is legal (a plain race), a long
      ladder is fine, and two jumps sharing a TARGET is harmless — the constraint is that no
      two jumps share the same TRIGGER cell, since a cell can only redirect one way.
    ref: "concepts.md#requirements-clarification"

  - id: design-snake-ladder-007
    difficulty: intermediate
    tags: [validation, edge-cases]
    question: |
      Why must validation forbid a snake head (or ladder start) on the final cell (100)?
    options:
      - "Because the final cell is rendered differently in the UI"
      - "Reaching the final cell must end the game — a jump there makes 'landed on 100' ambiguous between winning and sliding away"
      - "Because HashMap cannot store the key 100"
      - "Because players never actually land on cell 100"
    answer: 1
    explanation: |
      The win condition is 'position == board size'. If cell 100 hosted a snake head, a player
      who lands there would simultaneously satisfy the win check and be owed a slide down —
      contradictory rules. Banning jumps on the winning cell (a construction-time validation)
      keeps the game-over condition unambiguous. The other options are technically false.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-snake-ladder-008
    difficulty: intermediate
    tags: [game-loop, turn-order]
    question: |
      A candidate models turn order with a Deque<Player>: poll the front, take the turn,
      offer to the back. What is the main design benefit over an int currentPlayerIndex
      into a List?
    options:
      - "Deque uses less memory than ArrayList"
      - "It makes turns run in parallel"
      - "It removes error-prone modular index arithmetic and makes 'player eliminated' or 'extra turn' natural queue operations"
      - "It guarantees fair dice rolls across players"
    answer: 2
    explanation: |
      (index + 1) % players.size() is a classic off-by-one/rotation bug site, and it gets
      worse when players are removed or a player earns an extra turn. With a queue, rotation
      is poll+offer, elimination is 'don't re-offer', and an extra turn is 'offer to the
      FRONT' (or just don't rotate). The structure encodes the turn semantics directly.
      Memory and parallelism are irrelevant here.
    ref: "concepts.md#class-diagram"

  - id: design-snake-ladder-009
    difficulty: beginner
    tags: [over-engineering, yagni]
    question: |
      The interviewer asks: "Why didn't you create a Cell class for all 100 cells?" What is
      the strongest answer for a v1 Snake & Ladder design?
    options:
      - "Cells are sparse in behavior — a position int plus a jump map suffices; a Cell class earns its place only when cells carry behavior (e.g., special-effect cells in v2)"
      - "Cell classes are an anti-pattern in all board games"
      - "Java object creation is too slow for 100 objects"
      - "The interviewer said the board is 10x10, so cells are unnecessary"
    answer: 0
    explanation: |
      This is the YAGNI-with-a-plan answer: 100 cell objects where ~85 are empty adds
      indirection without behavior. But the answer must include the growth path — when
      requirements add per-cell behavior (skip-turn, teleport), the Map<Integer, Jump> seam
      generalizes to Map<Integer, CellEffect>. Blanket claims ('always an anti-pattern') or
      performance excuses (100 objects is nothing) miss the design judgment being tested.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-snake-ladder-010
    difficulty: intermediate
    tags: [patterns, over-engineering]
    question: |
      Which pattern would be OVER-engineering for a v1 console Snake & Ladder game?
    options:
      - "Strategy for the dice"
      - "A State-machine hierarchy (WaitingState, RollingState, MovingState, WonState classes) for game status"
      - "A factory method that builds the classic board layout"
      - "Constructor validation with fail-fast exceptions"
    answer: 1
    explanation: |
      Snake & Ladder has essentially two statuses — in-progress and finished — and no
      per-state behavioral differences worth polymorphism. An enum (or boolean) suffices.
      Contrast with an elevator or vending machine, where each state genuinely handles the
      same events differently — there State earns its complexity. Dice Strategy (testability),
      a board factory (centralized validated construction), and fail-fast validation all pay
      for themselves immediately. Declining State here is a senior signal.
    ref: "concepts.md#key-design-decisions"

  - id: design-snake-ladder-011
    difficulty: intermediate
    tags: [edge-cases, game-loop]
    question: |
      A player is on cell 98 and rolls a 5 (board size 100). Under the classic
      "exact landing with bounce-back" rule, where does the player end up?
    options:
      - "100 — reaching or passing the last cell wins"
      - "98 — the move is simply forfeited"
      - "103 — positions can exceed the board temporarily"
      - "97 — advance to 100, then bounce back the 3 excess (98+5 → 100, then 3 back)"
    answer: 3
    explanation: |
      Bounce-back reflects the excess off the final cell: 98+5 needs 2 to reach 100, leaving
      3 excess, so the player bounces to 97. Option B describes the alternative 'stay put on
      overshoot' rule — also legitimate, but not bounce-back. The interview lesson: both rules
      exist, so you must ask which one applies and implement exactly that branch. Positions
      exceeding the board should never be stored.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-snake-ladder-012
    difficulty: advanced
    tags: [edge-cases, algorithms]
    question: |
      Board.getFinalPosition resolves jumps transitively (a ladder may land you on a snake's
      head). Why does the implementation need a 'seen' set (cycle detection)?
    options:
      - "To make lookup O(1) instead of O(n)"
      - "A misconfigured board could contain a jump cycle (A → B → A), which would loop forever without detection"
      - "HashMap iteration order is nondeterministic"
      - "Players might land on the same cell twice in one game"
    answer: 1
    explanation: |
      With transitive resolution, a config where jump targets form a cycle (snake 50→30,
      ladder 30→50) makes the while-loop infinite. A seen-set turns that into a loud
      IllegalStateException — and running getFinalPosition over every trigger at construction
      time surfaces the bad config before any game starts. This is defensive design against
      invalid configuration, not a performance or ordering concern.
    ref: "concepts.md#code-skeleton"

  - id: design-snake-ladder-013
    difficulty: intermediate
    tags: [api-design, separation-of-concerns]
    question: |
      Why should Game expose playTurn() (one turn per call) in addition to play()
      (run to completion)?
    options:
      - "play() cannot return a value in Java"
      - "playTurn() is required for the dice to be random"
      - "It doubles test coverage automatically"
      - "An externally driven loop lets a UI or server advance the game per user action, while play() remains a loop over playTurn() for console simulation"
    answer: 3
    explanation: |
      A self-driving play() is fine for a console demo, but any interactive frontend (or a
      game server processing one move per network message) needs to drive the loop from
      outside. Exposing playTurn() and implementing play() as a loop over it keeps one source
      of truth for turn logic while serving both callers. This 'who owns the loop?' insight
      is a classic game-design seam.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-snake-ladder-014
    difficulty: intermediate
    tags: [srp, separation-of-concerns]
    question: |
      playTurn() returns a TurnResult(player, rolled, from, to, won) instead of calling
      System.out.println inside Game. Which principle is this applying?
    options:
      - "Single Responsibility — Game computes state transitions; rendering/printing is the caller's job, which also keeps Game testable"
      - "Liskov Substitution — subclasses must be printable"
      - "Dependency Inversion — Game must depend on a PrintStream abstraction"
      - "Interface Segregation — println is too fat an interface"
    answer: 0
    explanation: |
      Mixing I/O into the game engine couples it to a console, makes assertions awkward
      (parsing stdout), and blocks reuse behind a GUI or server. Returning an immutable
      TurnResult separates computing what happened from presenting it. DIP would apply if
      Game genuinely needed to output — but the cleaner move is for Game not to know about
      output at all.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-snake-ladder-015
    difficulty: beginner
    tags: [relationships, uml]
    question: |
      In the class diagram, Game *-- Board is composition while Game o-- Player is
      aggregation. What is the reasoning?
    options:
      - "Composition is used for interfaces, aggregation for classes"
      - "The board's lifecycle is owned by its game, while players exist independently of any particular game"
      - "Aggregation allows more than one Player object"
      - "Board is mutable and Player is immutable"
    answer: 1
    explanation: |
      Composition denotes ownership and shared lifecycle: this game's board configuration
      lives and dies with the game. Players, by contrast, are identities that outlive a match
      (the same player can join the next game), so the whole-part link is weaker —
      aggregation. Multiplicity, mutability, and interface-vs-class have nothing to do with
      the composition/aggregation distinction.
    ref: "concepts.md#class-diagram"

  - id: design-snake-ladder-016
    difficulty: intermediate
    tags: [extensibility, open-closed]
    question: |
      The interviewer says: "Now the game uses two dice." With Dice as an injected interface,
      what is the cleanest change?
    options:
      - "Add a numDice field to Game and loop the roll inside playTurn"
      - "Change SixSidedDice.roll() to return random.nextInt(12)+2"
      - "Create DicePair implements Dice composing two Dice and injecting their summed roll — no changes to Game or Board"
      - "Subclass Game as TwoDiceGame and override playTurn"
    answer: 2
    explanation: |
      DicePair is the Open/Closed demo the follow-up is fishing for: one new class, zero
      modified ones. Option B is subtly WRONG math — two dice summed give a triangular
      distribution (7 most likely), while nextInt(12)+2 is uniform; a sharp interviewer will
      catch it. Options A and D modify or fork Game for what is purely a dice concern.
    ref: "concepts.md#extensibility"

  - id: design-snake-ladder-017
    difficulty: advanced
    tags: [extensibility, abstraction]
    question: |
      The interviewer adds: "Some cells should make a player skip their next turn." What is
      the recommended evolution of the design?
    options:
      - "Add an if (skipCells.contains(pos)) branch inside Board.getFinalPosition"
      - "Generalize Jump into a CellEffect interface whose apply(GameContext) can move a player or set a skip-next flag — snakes and ladders become two implementations among many"
      - "Create a SkipTurnSnake subclass of Snake with tail == head"
      - "Store a boolean skip on every Player and hard-code cell numbers in Game"
    answer: 1
    explanation: |
      Skip-turn is a fundamentally different effect from a positional jump — it mutates turn
      state, not position — so it doesn't fit getFinalPosition's int→int contract (option A
      contorts the Board API, and getFinalPosition has no access to turn state anyway).
      Generalizing the trigger-map to CellEffect.apply(context) makes the position map a
      registry of arbitrary cell behaviors: exactly the v2 the v1 seam anticipated.
      SkipTurnSnake abuses inheritance for an unrelated behavior.
    ref: "concepts.md#extensibility"

  - id: design-snake-ladder-018
    difficulty: intermediate
    tags: [testability, dependency-injection]
    question: |
      How do you unit-test that "landing on a snake head at 99 sends the player to 5" without
      flaky randomness?
    options:
      - "Run the game 10,000 times and assert the scenario statistically occurs"
      - "Use reflection to override Random's internal seed mid-game"
      - "Mock the Player class to report position 99"
      - "Inject a scripted Dice that returns a fixed sequence of rolls steering a player onto 99, then assert the position is 5"
    answer: 3
    explanation: |
      This is the direct payoff of the Dice abstraction: a test double returning a
      predetermined sequence makes every turn deterministic, so you assert exact positions.
      Statistical testing is slow and still flaky; reflection hacks are brittle; mocking
      Player tests a fiction rather than the real movement logic. Even simpler: test
      Board.getFinalPosition(99) == 5 in isolation — the design lets you test the board
      without any game at all.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-snake-ladder-019
    difficulty: intermediate
    tags: [concurrency, scoping]
    question: |
      The interviewer asks about thread safety for a single Snake & Ladder match. What is the
      best FIRST response?
    options:
      - "A single game is inherently sequential — turns are strictly ordered — so intra-game locking adds complexity with no benefit; concurrency only matters if external callers can race on playTurn()"
      - "Wrap every method in synchronized to be safe"
      - "Replace all collections with ConcurrentHashMap and CopyOnWriteArrayList"
      - "Use one thread per player so all players can roll simultaneously"
    answer: 0
    explanation: |
      Recognizing that a turn-based game has no intra-game parallelism is the senior answer —
      blanket synchronized or concurrent collections is cargo-cult defensiveness (and
      threads-per-player breaks the game's semantics entirely). The honest follow-through:
      IF multiple socket handlers could invoke playTurn() on the same instance, guard that
      entry point (synchronized method or a per-game single-threaded executor).
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-snake-ladder-020
    difficulty: advanced
    tags: [concurrency, server-design]
    question: |
      A server hosts thousands of concurrent Snake & Ladder matches. Which design choice
      makes per-game locking largely unnecessary?
    options:
      - "Making Game a Singleton so there is only one lock"
      - "Storing all player positions in one global static map guarded by a mutex"
      - "One Game instance per match with no shared mutable state (no statics, per-game RNG), so games are isolated units"
      - "Running every game on the same thread"
    answer: 2
    explanation: |
      Isolation beats synchronization: if each match is a self-contained object graph with no
      shared mutable state, thousands can run in parallel without contention — locking is
      only needed at the boundary of a single game if its own callers can race. A Singleton
      Game is the opposite of multi-game support; a global position map creates the very
      shared state you're trying to avoid; one thread for all games serializes everything.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-snake-ladder-021
    difficulty: beginner
    tags: [patterns, factory]
    question: |
      Where does a Factory (or Builder) genuinely earn its place in this design?
    options:
      - "Creating Player objects, since names vary"
      - "Constructing the validated board — assembling size, snakes, and ladders for the classic layout so main() stays clean and validation is centralized"
      - "Wrapping dice rolls in a DiceRollFactory"
      - "Instantiating TurnResult records each turn"
    answer: 1
    explanation: |
      Board construction is the one genuinely fiddly creation in this problem: a specific set
      of jumps that must pass validation. BoardFactory.standardBoard() (or a GameBuilder
      validating at build()) encapsulates that. Players are one-liner constructions,
      TurnResult is a trivial record, and a factory for dice ROLLS (not dice objects)
      confuses creation with behavior. Applying creational patterns only where creation is
      complex is the anti-over-engineering signal.
    ref: "concepts.md#key-design-decisions"

  - id: design-snake-ladder-022
    difficulty: intermediate
    tags: [patterns, observer]
    question: |
      Why is the Observer pattern deliberately OMITTED from the v1 design, and what is the
      seam for adding it later?
    options:
      - "Observer is incompatible with turn-based games"
      - "Observer would slow the game loop unacceptably"
      - "Java records cannot be observed"
      - "There is nothing to notify in a console v1 — but TurnResult is already an event object, so publishing it to listeners from playTurn() adds Observer without redesign"
    answer: 3
    explanation: |
      Patterns must answer a present need: with no UI, event log, or spectators, an observer
      list is dead code. But good v1 design leaves the seam — playTurn() already produces an
      immutable TurnResult describing what happened, which is precisely the event payload a
      listener would want. Naming both the omission AND the reintroduction path is the mark
      of judgment rather than pattern amnesia.
    ref: "concepts.md#key-design-decisions"

  - id: design-snake-ladder-023
    difficulty: intermediate
    tags: [validation, fail-fast]
    question: |
      Snake's constructor throws IllegalArgumentException when head <= tail. What design
      principle is this?
    options:
      - "Fail fast — invalid objects should be impossible to construct, so bad configs surface at setup, not as corrupted state mid-game"
      - "Defensive copying — protecting against mutation"
      - "Null-object pattern — returning a harmless default"
      - "Lazy validation — deferring checks until first use"
    answer: 0
    explanation: |
      Enforcing invariants at construction means every Snake in existence is valid — no
      downstream code ever re-checks. The alternative (validating inside getFinalPosition, or
      never) lets a mis-entered config produce a snake that moves players UP, discovered only
      by weird gameplay. Fail-fast converts a debugging session into a stack trace at board
      setup. Options B-D name real techniques that don't apply here.
    ref: "concepts.md#code-skeleton"

  - id: design-snake-ladder-024
    difficulty: intermediate
    tags: [extensibility, rules]
    question: |
      "Rolling a 6 grants an extra turn." With the Deque<Player> turn model, what is the
      minimal correct change?
    options:
      - "Push the player onto a separate priority queue of bonus turns"
      - "Recursively call playTurn() inside playTurn()"
      - "After the turn, skip the rotation (do not re-offer the player to the back) when rolled == 6 and the game isn't won"
      - "Give the player position += 6 instead of an extra roll"
    answer: 2
    explanation: |
      The queue model makes this a one-guard change: rotation is what passes the turn, so NOT
      rotating keeps the same player at the front for the next playTurn() call. Recursion
      couples turn-taking to call depth (and misbehaves for an externally driven loop where
      each call should be one turn). A bonus-turn priority queue is machinery without a
      requirement; position += 6 changes the rule, not the turn order.
    ref: "concepts.md#extensibility"

  - id: design-snake-ladder-025
    difficulty: advanced
    tags: [design-judgment, strategy-pattern]
    question: |
      The content argues you should extract a TurnPolicy or MovementRule strategy interface
      only under a specific condition. What is that condition?
    options:
      - "When the interviewer mentions the word 'pattern'"
      - "As soon as there is a single if-statement in the loop"
      - "When the game exceeds 500 lines of code"
      - "When the number of rule VARIANTS multiplies — one rule is a guard clause; several competing variants justify a strategy interface"
    answer: 3
    explanation: |
      This is the core anti-over-engineering judgment of the topic: a lone 'extra turn on 6'
      rule is one if-statement — wrapping it in an interface adds indirection for nothing.
      When the interviewer piles on variants (exact-landing vs pass, bounce vs stay, roll-6
      to start), the same axis is changing repeatedly and Strategy starts paying rent.
      Extract on the second or third variant, not the first if.
    ref: "concepts.md#extensibility"

  - id: design-snake-ladder-026
    difficulty: beginner
    tags: [scoping, boundaries]
    question: |
      The interviewer asks "how would you make this an online multiplayer game?" In an LLD
      round, what is the best-scoped answer?
    options:
      - "Redesign every class to be Serializable and add a Netty server to the diagram"
      - "Point to the existing seams — the externally driven playTurn() API and the TurnResult event stream a server would consume — and note that sessions, matchmaking, and realtime sync are HLD concerns"
      - "Decline to answer since networking is off-topic"
      - "Propose storing the game state in a distributed cache with leader election"
    answer: 1
    explanation: |
      The skill being tested is knowing WHERE the LLD ends: your object design should expose
      the right seams (per-action turn API, serializable event objects), and the distributed
      parts (WebSockets, server-authoritative state, matchmaking) belong to the system-design
      round. Refusing outright wastes the question; diving into caches and leader election
      answers the wrong round's question.
    ref: "concepts.md#extensibility"

  - id: design-snake-ladder-027
    difficulty: intermediate
    tags: [state-management, trade-offs]
    question: |
      Player position can live as a field on Player, or in a Map<Player, Integer> owned by
      Game. What is the honest trade-off?
    options:
      - "The map is required for more than 2 players"
      - "Position on Player breaks encapsulation and is always wrong"
      - "Position on Player is simpler; the map keeps Player immutable and centralizes all game state in one place (easier snapshot/resume) — both are defensible if justified"
      - "The map is faster because HashMap beats field access"
    answer: 2
    explanation: |
      This is a genuine both-are-fine decision, and interviewers reward candidates who name
      the trade-off rather than assert dogma. Mutable position-on-player is direct and reads
      naturally; state-in-game makes Player a pure identity (shareable across games) and puts
      everything needed for persistence in one object. Field access is faster than a map
      (option D is backwards), and neither choice is 'always wrong'.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-snake-ladder-028
    difficulty: intermediate
    tags: [edge-cases, chaining]
    question: |
      A ladder at 20 goes to 45, and a snake head sits at 45 going to 12. A player lands on
      20. Under transitive jump resolution, what should getFinalPosition(20) return?
    options:
      - "20 — conflicting jumps cancel out"
      - "12 — resolve the ladder to 45, then the snake to 12, looping until a jump-free cell"
      - "45 — only the first jump applies per landing"
      - "An exception — this configuration is always illegal"
    answer: 1
    explanation: |
      With transitive (classic) resolution, jumps chain: 20 → 45 (ladder) → 12 (snake), and
      12 has no jump, so the answer is 12. Option C describes single-jump resolution — an
      acceptable simpler rule IF you stated it during requirements, but not what transitive
      resolution yields. The config is legal (no shared triggers, no cycle); a cycle would be
      e.g. 45's snake going back to 20's trigger.
    ref: "concepts.md#code-skeleton"

  - id: design-snake-ladder-029
    difficulty: beginner
    tags: [anti-patterns, singleton]
    question: |
      Why is making Game a Singleton a poor choice here?
    options:
      - "Singletons cannot hold references to other objects"
      - "The GoF book forbids Singleton in games"
      - "Singleton requires synchronized access, which is too slow"
      - "It prevents running multiple matches (or parallel tests) in one process and hides the dependency — Game should just be an ordinary instantiable class"
    answer: 3
    explanation: |
      A server hosting many matches needs many Game instances; tests need fresh instances per
      case. A Singleton bakes in 'exactly one game per process' — an invariant nothing in the
      requirements asks for — while making dependencies implicit (global access) instead of
      injected. This is the most common reflexive-pattern mistake on simple LLD problems.
    ref: "concepts.md#key-design-decisions"

  - id: design-snake-ladder-030
    difficulty: intermediate
    tags: [persistence, memento]
    question: |
      "Persist and resume a game mid-match." What is the complete minimal state you must
      capture?
    options:
      - "Board configuration, player positions, turn order, and the RNG seed/state"
      - "Just player positions — everything else is reconstructable"
      - "The full history of every TurnResult since the game began"
      - "The Game object serialized with all its transient threads"
    answer: 0
    explanation: |
      Resume requires everything that determines future behavior: the board layout, where
      everyone stands, WHOSE TURN IS NEXT (a commonly forgotten piece — positions alone lose
      turn order), and the RNG state if you want bit-identical replay. The TurnResult history
      enables replay-from-start (an alternative approach, heavier than needed for resume);
      positions alone are insufficient. In pattern terms this snapshot is a Memento.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-snake-ladder-031
    difficulty: beginner
    tags: [entities, responsibilities]
    question: |
      Which responsibility belongs to Game rather than Board?
    options:
      - "Knowing that cell 62 hosts a snake to 19"
      - "Validating that no two jumps share a trigger cell"
      - "Rotating turn order and detecting the win condition"
      - "Resolving chained jumps to a final position"
    answer: 2
    explanation: |
      Game orchestrates the dynamic match: whose turn it is, applying the roll, and declaring
      a winner. Everything about the static layout — where jumps are, whether the
      configuration is valid, where a landing position finally resolves — is Board's job.
      This split means you can reuse Board across game variants and test each class in
      isolation.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-snake-ladder-032
    difficulty: intermediate
    tags: [inheritance, composition]
    question: |
      To support two dice, a candidate writes class TwoDice extends SixSidedDice and
      overrides roll() to call super.roll() twice. Why is DicePair (composing two Dice
      objects) better?
    options:
      - "Inheritance is slower than composition at runtime"
      - "TwoDice couples to one concrete die type — DicePair composes ANY two Dice (e.g., a fair and a crooked one) and models 'a pair of dice' honestly rather than 'a die that is secretly two'"
      - "Java forbids overriding methods that use Random"
      - "DicePair needs fewer lines of code"
    answer: 1
    explanation: |
      'A pair of dice IS-A six-sided die' fails the smell test — it's a HAS-A relationship.
      Composition lets DicePair aggregate any Dice implementations (mix fair and loaded dice,
      or two DicePairs for four dice), while the subclass is welded to SixSidedDice's
      behavior. This is the composition-over-inheritance judgment applied at the smallest
      possible scale — exactly where interviewers probe it.
    ref: "concepts.md#class-diagram"

  - id: design-snake-ladder-033
    difficulty: advanced
    tags: [concurrency, correctness]
    question: |
      In an online version, two WebSocket handlers might call game.playTurn() concurrently
      for the same match. Besides synchronizing, what correctness check does the content
      recommend when moves carry a player id?
    options:
      - "Verify the dice roll is between 1 and 6"
      - "Retry the move with exponential backoff"
      - "Check the board configuration has not changed"
      - "Validate that the move's player id matches the player whose turn it actually is, rejecting out-of-turn moves"
    answer: 3
    explanation: |
      Synchronization alone only prevents interleaved corruption — it doesn't stop player B
      from taking player A's turn if B's message arrives first. A server-authoritative game
      must validate turn ownership per request. Dice-bounds checks and board immutability are
      separate concerns; retries would happily replay the wrong player's move.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-snake-ladder-034
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      Which of these should you explicitly scope OUT (while saying so aloud) in a 45-minute
      Snake & Ladder LLD round?
    options:
      - "Validation of snake/ladder placement"
      - "GUI, persistence, matchmaking, and AI players"
      - "Handling more than two players"
      - "The win-condition rule"
    answer: 1
    explanation: |
      GUI, persistence, matchmaking, and AI are all real product features but not what the
      round measures — declare them out of scope so the interviewer can redirect if they
      disagree. Validation, multi-player turn handling, and the win rule are core to the
      problem; skipping any of those loses points. The habit being tested: scope decisions
      are made EXPLICITLY, not by silent omission.
    ref: "concepts.md#requirements-clarification"

  - id: design-snake-ladder-035
    difficulty: intermediate
    tags: [game-loop, correctness]
    question: |
      In the game loop, the correct ORDER of operations after a dice roll is:
    options:
      - "apply snake/ladder jump first, then add the roll, then check win"
      - "check win, then add the roll, then apply jumps"
      - "add the roll to the current position, check board overshoot, resolve snake/ladder jumps on the landing cell, then check win on the FINAL position"
      - "add the roll and check win immediately — jumps are applied at the start of the next turn"
    answer: 2
    explanation: |
      The sequence matters: movement first (with the overshoot rule applied to the tentative
      position), then jump resolution on where you LANDED, then the win check against the
      final resolved position. Checking win before jump resolution would crown a player who
      landed on 100 — which validation makes safe — but more importantly would miss a ladder
      delivering a player TO the final cell. Deferring jumps to next turn changes the game's
      semantics entirely.
    ref: "concepts.md#key-design-decisions"

  - id: design-snake-ladder-036
    difficulty: intermediate
    tags: [immutability, value-objects]
    question: |
      Snake, Ladder, and TurnResult are designed as immutable value objects. What is the
      practical benefit in THIS design?
    options:
      - "They validate once at construction and can then be shared freely — across turns, threads, and even multiple games using the same board layout — with no defensive copies"
      - "Immutable objects use less memory than mutable ones"
      - "Java requires records to be immutable, so there is no choice"
      - "Immutability makes the dice rolls reproducible"
    answer: 0
    explanation: |
      A validated-immutable Snake can never become invalid, so Board never re-checks it; a
      board's jump list can back multiple simultaneous matches without copying; TurnResult
      can be handed to loggers/UIs with no aliasing risk. Memory usage is roughly the same;
      you could model these mutably (records are a convenience, not a mandate); and
      reproducibility comes from the RNG, not immutability.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-snake-ladder-037
    difficulty: advanced
    tags: [extensibility, player-strategy]
    question: |
      Why does classic Snake & Ladder NOT need a PlayerStrategy abstraction (human vs bot),
      even though many board-game designs include one?
    options:
      - "Bots are out of scope for all LLD interviews"
      - "PlayerStrategy would require the Observer pattern first"
      - "The Dice interface already covers player decision-making"
      - "The game has zero player decisions — every move is fully forced by the dice roll — so there is no choice for a strategy to make"
    answer: 3
    explanation: |
      Strategy abstracts a CHOICE. In chess or Splitwise-style settlement there are genuine
      decisions to delegate; in Snake & Ladder the roll fully determines the move, so
      'human vs bot' differ only in who presses the roll button — a UI concern, not a game
      concern. Volunteering this observation shows you derive abstractions from the domain
      rather than copying them from other designs.
    ref: "concepts.md#extensibility"

  - id: design-snake-ladder-038
    difficulty: intermediate
    tags: [validation, api-design]
    question: |
      Overall board validation (no shared triggers, no jump on the final cell, no cycles)
      lives in Board's constructor rather than in Snake/Ladder constructors. Why?
    options:
      - "Constructors of small classes cannot throw exceptions"
      - "Each jump can only validate its OWN invariant (head > tail) — cross-jump rules like trigger collisions and cycles require seeing the whole configuration, which only Board has"
      - "Board validation is faster because it runs once"
      - "Snake and Ladder are records and records skip validation"
    answer: 1
    explanation: |
      Validation lives at the smallest scope that can see the rule's inputs: a Snake knows
      its own head and tail (local invariant), but 'two jumps share cell 40' or 'these jumps
      form a cycle' are properties OF THE SET of jumps — Board's domain. Placing each check
      at its natural owner is a miniature lesson in information expert / SRP.
    ref: "concepts.md#code-skeleton"

  - id: design-snake-ladder-039
    difficulty: beginner
    tags: [dice, contracts]
    question: |
      A LoadedDice test double buggy-returns 7. The content recommends the game "fail loudly"
      rather than accept it. Why bother, given Dice implementations are supposed to return 1-6?
    options:
      - "A cheap defensive assertion turns a contract violation into an immediate visible error instead of silently corrupting positions"
      - "Because real dice can physically land on 7"
      - "Java interfaces cannot express the 1-6 range, so runtime checks are the ONLY possible enforcement"
      - "To make the game loop run faster"
    answer: 0
    explanation: |
      The Dice contract is informal (an interface can't encode the range in the type system
      alone — though documentation and implementation tests help, so 'only possible
      enforcement' overstates option C). A one-line assertion at the trust boundary means a
      broken implementation produces a stack trace at the roll, not a player mysteriously on
      cell 105 three turns later. Cheap checks at contract boundaries are a hallmark of
      robust interview code.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-snake-ladder-040
    difficulty: intermediate
    tags: [design-judgment, interview-strategy]
    question: |
      On a deliberately simple problem like Snake & Ladder, what distinguishes a SENIOR
      candidate's answer according to the content?
    options:
      - "Applying at least five GoF patterns to demonstrate breadth"
      - "Finishing the code in under ten minutes"
      - "Explicitly DECLINING patterns that don't pay for themselves (State, Observer, Singleton) while naming the seam where each would enter if requirements demanded it"
      - "Drawing the UML diagram with all 23 pattern stereotypes annotated"
    answer: 2
    explanation: |
      Simple problems are over-engineering traps: the interviewer wants to see calibration.
      Saying 'a GameStatus enum, not a State hierarchy — State earns its cost in an elevator,
      not here' and 'no Observer yet, but TurnResult is the event when we need one' shows you
      choose designs by need, with a growth path. Pattern-count maximalism reads as junior;
      raw speed without narrated judgment misses what the round measures.
    ref: "concepts.md#key-design-decisions"

  - id: design-snake-ladder-041
    difficulty: intermediate
    tags: [edge-cases, degenerate-configs]
    question: |
      Should a Board with ZERO snakes and zero ladders be rejected by validation?
    options:
      - "Yes — a board without jumps violates the game's definition"
      - "No — it is a legal (if dull) configuration, the game degenerates to a dice race, and code must not assume a non-empty jump map"
      - "Yes — getFinalPosition would throw NullPointerException on an empty map"
      - "No, but only if the board has exactly 100 cells"
    answer: 1
    explanation: |
      An empty jump map is a valid boundary case: getFinalPosition simply returns the input
      position (the while loop never fires — no NPE with containsKey-based lookup). Rejecting
      it would encode an arbitrary rule nowhere in the requirements. The design lesson:
      identify which configurations are INVALID (wrong-direction snakes, shared triggers) vs
      merely UNUSUAL (no jumps), and only reject the former.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-snake-ladder-042
    difficulty: advanced
    tags: [randomness, reproducibility]
    question: |
      For a server running many games, the content suggests a per-game Random (or injected
      seeded RNG) instead of a shared static Random. Which benefit is NOT about thread
      contention?
    options:
      - "It reduces garbage collection pressure"
      - "It lets each game roll in constant time"
      - "A per-game seed makes an entire match REPRODUCIBLE — replay a bug report or a full game deterministically from the seed"
      - "It prevents integer overflow in nextInt"
    answer: 2
    explanation: |
      Beyond avoiding a contended shared Random, per-game seeded RNG buys determinism: given
      the seed, the whole match replays identically — invaluable for debugging ('game 4231
      had a wrong jump') and cheap persistence (store seed + move count instead of full
      history). GC pressure, roll latency, and overflow are unaffected either way.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-snake-ladder-043
    difficulty: beginner
    tags: [uml, relationships]
    question: |
      In the Mermaid class diagram, "Dice <|.. SixSidedDice" denotes which relationship?
    options:
      - "SixSidedDice composes a Dice"
      - "Dice inherits from SixSidedDice"
      - "SixSidedDice aggregates many Dice"
      - "SixSidedDice implements (realizes) the Dice interface"
    answer: 3
    explanation: |
      The dashed arrow with a hollow triangle (<|..) is UML realization: a concrete class
      implementing an interface. The direction reads 'SixSidedDice realizes Dice'. Solid
      <|-- would be class inheritance; *-- and o-- are composition and aggregation. Reading
      the arrows correctly matters when you whiteboard under time pressure.
    ref: "concepts.md#class-diagram"

  - id: design-snake-ladder-044
    difficulty: intermediate
    tags: [srp, code-quality]
    question: |
      A candidate's Game class rolls the dice, moves players, checks wins, prints the board
      as ASCII art, reads player names from stdin, AND validates snake placement. The
      interviewer frowns. What is the core critique?
    options:
      - "The class violates Single Responsibility — orchestration, I/O, and board validation are three different reasons to change and belong in Game, the caller/CLI layer, and Board respectively"
      - "The class should be split so each method is its own class"
      - "ASCII art is disallowed in interviews"
      - "stdin reading requires a separate thread"
    answer: 0
    explanation: |
      SRP is about reasons to change: rendering changes with the UI, validation changes with
      board rules, orchestration changes with game rules. A Game that does all three must be
      edited (and re-tested) for any of them. The fix is layering, not atomizing — one class
      per METHOD (option B) is the overcorrection that trades a god class for confetti.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-snake-ladder-045
    difficulty: intermediate
    tags: [requirements, variants]
    question: |
      The "kill rule" variant (landing on an opponent sends them back to start) is raised
      during clarification. If the interviewer wants it, which classes change?
    options:
      - "Only Board — it owns cell occupancy"
      - "Only Dice — rolls determine collisions"
      - "Game (its turn logic must check other players' positions after a move and reset the occupant) — Board stays untouched since occupancy is dynamic match state, not static layout"
      - "Snake and Ladder — they must track occupants"
    answer: 2
    explanation: |
      The kill rule concerns DYNAMIC state — where players currently stand — which is the
      Game's domain. Board deliberately knows nothing about players; it maps positions to
      positions. Keeping that boundary means the variant is a few lines in the turn logic
      (after resolving the final position, find any other player there and reset them).
      If your Board tracked occupancy, this 'simple variant' would ripple through two classes.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-snake-ladder-046
    difficulty: advanced
    tags: [api-design, game-loop]
    question: |
      Why should play() be implemented as a loop over playTurn(), rather than duplicating the
      turn logic inside play()?
    options:
      - "Because play() must be recursive to terminate"
      - "One source of truth: turn semantics live in exactly one method, so console mode and externally driven mode cannot drift apart when rules change"
      - "Loops over method calls are faster than inline logic"
      - "So play() can be static"
    answer: 1
    explanation: |
      If play() re-implemented rolling/moving/winning, every future rule change (extra turn
      on 6, bounce-back) would need to be made twice — and WOULD eventually be made once,
      creating divergent behavior between the console simulation and the server-driven game.
      Composing the coarse API from the fine one is the standard remedy. Performance and
      static-ness are irrelevant.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-snake-ladder-047
    difficulty: beginner
    tags: [boundaries, cross-domain]
    question: |
      Your design uses a HashMap for the jump table and a Deque for turn order. How deep
      should you go on these data structures' INTERNALS in the LLD round?
    options:
      - "Derive HashMap's bucket-and-rehash mechanics on the whiteboard to show depth"
      - "Avoid standard collections and hand-roll both structures"
      - "Explain Deque's node allocation strategy in detail"
      - "Name the structure and the property you rely on (O(1) lookup, O(1) rotate) and move on — internals belong to the DSA round"
    answer: 3
    explanation: |
      The LLD round evaluates object design, not data-structure derivations. State WHY the
      structure fits (sparse map → O(1) trigger lookup; queue → natural rotation) and spend
      your minutes on responsibilities and extensibility. Hand-rolling standard collections
      or lecturing on hash internals burns the clock on a different round's rubric.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-snake-ladder-048
    difficulty: intermediate
    tags: [extensibility, replay]
    question: |
      The interviewer asks for game REPLAY (watch a finished match again). Which two designs
      does the content offer, and what do they trade?
    options:
      - "Persist the RNG seed (tiny, recomputes the match) or persist the TurnResult stream (larger, but replayable without re-running game logic)"
      - "Screenshot the console after each turn, or record video"
      - "Store the final winner only, or store nothing"
      - "Deep-clone the Game object each turn, or use Java serialization on every tick"
    answer: 0
    explanation: |
      Because the game is fully deterministic given the seed (no player choices), replaying
      is just re-running with the same seed — the cheapest possible storage. The TurnResult
      event stream trades storage for independence: a viewer can render it without the game
      engine (or across engine versions where re-running might diverge). Per-turn deep clones
      are the memory-hungry version of the event stream with none of its portability.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-snake-ladder-049
    difficulty: intermediate
    tags: [patterns, strategy]
    question: |
      Which requirement change is the clearest trigger to introduce a Strategy pattern in
      this game?
    options:
      - "The board grows from 100 to 400 cells"
      - "Product wants THREE selectable dice modes at runtime: single die, double dice, and a demo 'always roll 6' mode"
      - "Players get colored tokens in the UI"
      - "Snakes should be drawn with curves instead of lines"
    answer: 1
    explanation: |
      Strategy fits when one axis of behavior has multiple interchangeable variants selected
      at runtime — exactly what three dice modes describe (and the Dice interface already IS
      that strategy seam, so the change is three implementations plus injection). Board size
      is a constructor parameter; token colors and snake rendering are presentation concerns
      that never reach the game engine.
    ref: "concepts.md#key-design-decisions"

  - id: design-snake-ladder-050
    difficulty: advanced
    tags: [design-judgment, evolution]
    question: |
      The content advocates "evolutionary design over speculative generality." In this
      problem, which pairing correctly matches a v1 decision with its named v2 evolution?
    options:
      - "v1 hard-codes board size 100 — v2 rewrites Board from scratch"
      - "v1 uses a State-machine hierarchy — v2 collapses it to an enum"
      - "v1 uses Map<Integer, Jump> for snakes/ladders — v2 generalizes the same map to Map<Integer, CellEffect> when special cells (skip turn, extra roll) arrive"
      - "v1 makes Game a Singleton — v2 adds a second Singleton for the board"
    answer: 2
    explanation: |
      Evolutionary design means v1 stays simple BUT its seams are chosen so known follow-ups
      extend rather than rewrite: the trigger-position map is that seam, and widening its
      value type from 'positional jump' to 'arbitrary cell effect' absorbs special cells
      without touching the loop's shape. Option A is speculative generality's mirror image
      (under-parameterizing a cheap config); B is over-engineering walked back; D compounds
      an anti-pattern.
    ref: "concepts.md#extensibility"

  - id: design-snake-ladder-051
    difficulty: beginner
    tags: [game-loop, win-condition]
    question: |
      Under the "reach or pass" win rule on a 100-cell board, a player on 97 rolls a 6.
      What happens?
    options:
      - "The player moves to 103 and keeps playing"
      - "The player wins — 97+6 passes 100, and passing counts"
      - "The move is forfeited because 103 > 100"
      - "The player bounces back to 97"
    answer: 1
    explanation: |
      Reach-or-pass means position >= board size wins (implementations typically cap the
      stored position at 100). Options C and D describe the exact-landing family of rules —
      forfeit-on-overshoot and bounce-back respectively. This is why the win rule is a
      day-one clarification question: three different rule sets give three different outcomes
      for the same roll.
    ref: "concepts.md#requirements-clarification"

  - id: design-snake-ladder-052
    difficulty: intermediate
    tags: [testability, board]
    question: |
      What makes Board independently testable WITHOUT constructing a Game, and why does that
      matter?
    options:
      - "Board is a Singleton, so tests share one instance"
      - "Board uses reflection to inject test data"
      - "Board depends only on its own config — getFinalPosition(int) is a pure position-in, position-out function — so jump and validation logic get fast, dice-free unit tests"
      - "Board extends Game, inheriting its test suite"
    answer: 2
    explanation: |
      Because Board has no reference to Game, Dice, or Player, testing 'snake at 99 goes to
      5' is a two-line assertion on getFinalPosition — no scripted rolls, no turn setup. This
      is the concrete payoff of separating static layout from dynamic match state: each half
      of the design tests at its own level. The other options describe couplings that would
      REDUCE testability.
    ref: "concepts.md#code-skeleton"
