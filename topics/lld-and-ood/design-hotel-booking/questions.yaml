topic: "Design a Hotel Booking System"
domain: lld-and-ood
topic_slug: design-hotel-booking
version: 1
questions:
  - id: design-hotel-booking-001
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      In the first five minutes of "Design a Hotel Booking System", which clarifying
      question most changes the shape of your availability logic?
    options:
      - "What color scheme should the booking website use?"
      - "How many receptionists staff the front desk on each shift?"
      - "Do guests book a specific room (Room 204) or a room type (any Double)?"
      - "Which cloud provider and region should host the system?"
    answer: 2
    explanation: |
      Booking by specific room means checking one room's bookings for overlap; booking
      by type means counting free rooms of that type on every night of the range —
      a structurally different availability check. UI, staffing, and hosting don't
      change the object model.
    ref: "concepts.md#requirements-clarification"

  - id: design-hotel-booking-002
    difficulty: beginner
    tags: [requirements, hld-vs-lld, boundaries]
    question: |
      Mid-round the interviewer asks, "How would you handle millions of concurrent
      searches across 10,000 hotels?" What is the strongest response in an LLD round?
    options:
      - "Acknowledge it as an HLD concern (caching, inventory service, idempotent APIs), then keep the design single-process"
      - "Redesign the classes around Kafka topics, a Redis cache, and message queues immediately"
      - "Explain database sharding and consistent-hashing strategies in detail for twenty minutes"
      - "Claim the design already scales fine because its in-memory HashMap lookups are all O(1)"
    answer: 0
    explanation: |
      The machine-coding round evaluates single-process OO design. Naming the shape of
      the distributed answer in a sentence and explicitly deferring shows judgment;
      derailing into infrastructure or hand-waving does not.
    ref: "concepts.md#requirements-clarification"

  - id: design-hotel-booking-003
    difficulty: beginner
    tags: [requirements, date-range]
    question: |
      Why should you establish early that a stay is the half-open interval
      [checkIn, checkOut) rather than a closed interval?
    options:
      - "Half-open intervals compress better in memory and speed up range queries"
      - "It lets one guest check out and another check in on the same date without a false conflict"
      - "Closed intervals cannot be represented using Java's LocalDate range types"
      - "Hotels are legally required to leave a 24-hour gap between consecutive guests"
    answer: 1
    explanation: |
      With [10th, 12th) and [12th, 14th), the strict overlap test reports no conflict,
      so back-to-back stays just work. Closed intervals force "-1 day" fudges scattered
      through the code — a classic off-by-one factory.
    ref: "concepts.md#requirements-clarification"

  - id: design-hotel-booking-004
    difficulty: intermediate
    tags: [requirements, overbooking, policy]
    question: |
      The interviewer asks whether your hotel should support overbooking. What is the
      best-scoped answer?
    options:
      - "Yes — always overbook every room type by exactly 10% because airlines do it and it lifts revenue"
      - "No, and the design can never support it because availability is a boolean flag with no room for a margin"
      - "It depends entirely on the database's transaction isolation level, which decides whether oversell is possible"
      - "Hotels usually don't overbook, so scope it out — but note the policy would plug into the availability check as an allowedOversell rule, not scattered if-statements"
    answer: 3
    explanation: |
      Scoping it out is correct for hotels, but naming exactly where the policy object
      would live shows you designed a seam rather than painting yourself into a corner.
      The other options are either unjustified, false, or irrelevant to the object model.
    ref: "concepts.md#requirements-clarification"

  - id: design-hotel-booking-005
    difficulty: beginner
    tags: [entities, room-booking]
    question: |
      In a well-modeled design, what is a RoomBooking?
    options:
      - "A boolean isBooked flag stored directly on the Room object"
      - "A first-class object carrying room, guest, date range, price, and status"
      - "A method on Guest that directly mutates the target room's status field"
      - "A row in the payments table keyed by the transaction id"
    answer: 1
    explanation: |
      The guest-room relationship carries data (dates, price, status, payment) and
      history, so it must be an association object. Availability is then derived by
      querying bookings — a flag on Room cannot represent "free tonight, booked next
      weekend".
    ref: "concepts.md#core-objects-and-entities"

  - id: design-hotel-booking-006
    difficulty: intermediate
    tags: [entities, value-object, date-range]
    question: |
      Why should DateRange be a value object with its own overlaps() method rather
      than two LocalDate fields spread across RoomBooking?
    options:
      - "Value objects are a mandatory prerequisite for UML class diagrams to render correctly"
      - "Two LocalDate fields cannot be compared for ordering without a custom Comparator"
      - "The overlap rule gets one testable home, so the half-open convention isn't re-implemented (differently) in several places"
      - "Wrapping the two dates in one object cuts the booking's memory footprint roughly in half"
    answer: 2
    explanation: |
      Interval overlap with half-open semantics is subtle enough to get wrong. Putting
      it inside an immutable DateRange means one implementation, unit-tested in
      isolation, used by availability, search, and validation alike.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-hotel-booking-007
    difficulty: intermediate
    tags: [entities, state, separation-of-concerns]
    question: |
      A candidate stores a single field on Room — status = AVAILABLE or BOOKED — and
      uses it to answer search queries. What is the fundamental flaw?
    options:
      - "Enum comparisons are measurably slower than boolean checks at query time"
      - "The status field should live on the Guest object rather than on Room"
      - "The AVAILABLE constant should really be renamed to VACANT for clarity"
      - "A single current-state field can't express date-dependent availability — the same room is free tonight and booked next week"
    answer: 3
    explanation: |
      Room availability is a function of a date range, derived from booking records.
      RoomStatus legitimately models today's operational state (occupied, under
      maintenance), but future availability must be computed from overlapping bookings.
      This conflation is the most common failure in this interview.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-hotel-booking-008
    difficulty: beginner
    tags: [entities, responsibilities, srp]
    question: |
      Which class should own the logic that answers "is Room 204 free from Aug 10 to
      Aug 14?"
    options:
      - "AvailabilityService, by scanning the room's active bookings for overlap"
      - "Guest, since guests are the ones who initiate availability searches"
      - "PaymentProcessor, since completing a booking always requires a payment step"
      - "RoomFactory, since it constructs and therefore knows about all the rooms"
    answer: 0
    explanation: |
      Availability is a query over booking records plus the room's operational state —
      a service responsibility. Guest, PaymentProcessor, and RoomFactory each have one
      unrelated job; giving them availability logic violates SRP.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-hotel-booking-009
    difficulty: intermediate
    tags: [entities, room-type, inheritance]
    question: |
      Should SingleRoom, DoubleRoom, SuiteRoom, and DeluxeRoom be subclasses of Room?
    options:
      - "Yes — inheritance is always the preferred way to model any set of categories"
      - "Usually no — the types differ in data (price, capacity), not behavior, so one Room class with a RoomType enum plus factory configuration is simpler"
      - "Yes — otherwise the Factory pattern has no concrete subclasses to instantiate"
      - "No — Room should instead be an interface with one implementation per physical room"
    answer: 1
    explanation: |
      Subclassing pays off when subtypes override behavior polymorphically. Room types
      vary only in configuration values, so subclasses add ceremony with nothing to
      override. A factory can construct differently-configured Room instances without
      a class hierarchy.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-hotel-booking-010
    difficulty: beginner
    tags: [entities, srp]
    question: |
      What is the single responsibility of BookingService in this design?
    options:
      - "Rendering and dispatching the booking confirmation emails to guests"
      - "Computing the seasonal and weekend price multipliers for each stay"
      - "Orchestrating the booking flow: lock, availability check, price, pay, save, notify"
      - "Holding and maintaining the hotel's full room inventory in memory"
    answer: 2
    explanation: |
      BookingService is the orchestrator. Pricing math lives in PricingStrategy, email
      rendering in an observer, and inventory in Hotel — the service coordinates them
      without doing their jobs.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-hotel-booking-011
    difficulty: beginner
    tags: [relationships, composition]
    question: |
      Which UML relationship best describes Hotel and Room?
    options:
      - "Inheritance — Room extends Hotel as a specialized subtype"
      - "Dependency — Hotel only occasionally uses a Room as a method argument"
      - "Association with no ownership — the two just reference each other"
      - "Composition — the hotel owns its rooms, and rooms don't exist outside their hotel"
    answer: 3
    explanation: |
      A room's identity and lifecycle are bound to its hotel — delete the hotel and its
      rooms go with it. That whole-part ownership with matching lifecycles is
      composition, drawn with a filled diamond on the Hotel side.
    ref: "concepts.md#class-diagram"

  - id: design-hotel-booking-012
    difficulty: intermediate
    tags: [relationships, association]
    question: |
      RoomBooking references both a Room and a Guest. Why are these plain associations
      rather than composition?
    options:
      - "The booking references but doesn't own them — room and guest both outlive any single booking"
      - "UML permits a composition relationship to appear only once anywhere in a diagram"
      - "Because both Room and Guest are actually modeled as enum types here"
      - "Plain associations render faster than composition in the Mermaid diagram engine"
    answer: 0
    explanation: |
      Composition implies lifecycle ownership. Cancelling a booking must not delete the
      room or the guest; both participate in many bookings over time. Contrast with
      RoomBooking's DateRange, which IS composed — a value object with no independent
      identity.
    ref: "concepts.md#class-diagram"

  - id: design-hotel-booking-013
    difficulty: intermediate
    tags: [relationships, dip, interfaces]
    question: |
      BookingService depends on the PricingStrategy and PaymentProcessor interfaces
      rather than on SeasonalPricing and StripeProcessor directly. Which principle is
      this, and what does it buy you in the interview?
    options:
      - "Liskov Substitution — it guarantees the concrete pricing subclasses can't be misused by the service"
      - "Dependency Inversion — high-level orchestration depends on abstractions, so you can swap pricing policies or mock the payment gateway without touching BookingService"
      - "Single Responsibility — depending on interfaces trims the service down to a single shorter method"
      - "Interface Segregation — it splits the fat pricing and payment interfaces into smaller ones"
    answer: 1
    explanation: |
      DIP: policy details (which pricing formula, which gateway) become injected
      implementations. In a live round this is what lets you answer "now add dynamic
      pricing" with "new class, no edits" — the Open/Closed payoff flows from the DIP
      seam.
    ref: "concepts.md#class-diagram"

  - id: design-hotel-booking-014
    difficulty: beginner
    tags: [relationships, value-object]
    question: |
      In the class diagram, RoomBooking *-- DateRange is drawn as composition. Why?
    options:
      - "The booking's DateRange must be garbage-collected before the booking itself"
      - "By UML convention every field of a class is drawn as a composition relationship"
      - "DateRange is a value object with no identity of its own — it exists only as part of the booking"
      - "Because DateRange happens to contain exactly two LocalDate fields"
    answer: 2
    explanation: |
      A value object is defined entirely by its values and has no independent lifecycle
      or identity. The stay [Aug 10, Aug 14) means nothing outside the booking that
      holds it, so whole-part composition is the honest relationship.
    ref: "concepts.md#class-diagram"

  - id: design-hotel-booking-015
    difficulty: intermediate
    tags: [facade, patterns, api-design]
    question: |
      HotelBookingService exposes search, book, cancel, checkIn, and checkOut while
      hiding BookingService, AvailabilityService, and the strategies behind it. Which
      pattern is this, and why is it worth building in a 60-minute round?
    options:
      - "Facade — the driver/demo talks to one entry point while internals stay swappable, which keeps your live demo simple"
      - "Singleton — it enforces that only one HotelBookingService instance can ever exist"
      - "Proxy — it wraps the services to control and authorize access for security reasons"
      - "Adapter — it converts between the guest's API and an incompatible internal interface"
    answer: 0
    explanation: |
      A facade gives the interviewer's test scenario one clean surface and lets you
      refactor internals mid-interview without breaking the demo. Nothing here is about
      instance-count control, access protection, or interface translation.
    ref: "concepts.md#class-diagram"

  - id: design-hotel-booking-016
    difficulty: beginner
    tags: [state-machine, room-status]
    question: |
      What does the RoomStatus state machine (AVAILABLE, RESERVED, OCCUPIED,
      CHECKED_OUT, UNDER_MAINTENANCE) actually model?
    options:
      - "The guest's loyalty tier and accumulated reward points"
      - "The room's operational lifecycle for the current day — the state housekeeping and the front desk care about"
      - "The room's forward availability calendar across the next twelve months"
      - "The payment and settlement status of the room's latest booking"
    answer: 1
    explanation: |
      RoomStatus is about the physical room today: is someone in it, is it dirty, is it
      broken. Future availability lives in booking records. Keeping these two concerns
      separate is a headline decision of this design.
    ref: "concepts.md#room-state-machine"

  - id: design-hotel-booking-017
    difficulty: intermediate
    tags: [state-machine, transitions]
    question: |
      Why does the state machine keep CHECKED_OUT distinct from AVAILABLE instead of
      returning the room straight to AVAILABLE at checkout?
    options:
      - "CHECKED_OUT rooms are billed at a different nightly rate than AVAILABLE ones"
      - "The AVAILABLE state is reserved exclusively for brand-new rooms that have never been booked"
      - "A well-formed state enum is required to declare an even number of distinct values"
      - "There's a real gap between guest departure and housekeeping completion — collapsing them lets you sell a dirty room"
    answer: 3
    explanation: |
      The transition CHECKED_OUT -> AVAILABLE happens when housekeeping finishes. If
      checkout went directly to AVAILABLE, a same-day booking could check into an
      uncleaned room — an edge case interviewers deliberately probe.
    ref: "concepts.md#room-state-machine"

  - id: design-hotel-booking-018
    difficulty: intermediate
    tags: [state-pattern, patterns, trade-offs]
    question: |
      When should you promote RoomStatus from an enum with a guarded transition table
      to the full State pattern (one class per state)?
    options:
      - "Never — the State pattern is deprecated and modern code should avoid it entirely"
      - "Immediately — using an enum for any lifecycle is always a design smell to be removed"
      - "When each state gains genuinely different behavior for operations like checkIn/checkOut/markMaintenance, so per-state classes replace growing switches"
      - "Only once the number of distinct states in the machine grows beyond ten values"
    answer: 2
    explanation: |
      The State pattern earns its class-count when behavior varies per state and
      switch statements start multiplying across methods. With five states and mostly
      transition-validation, an enum plus a transition table is the right-sized answer
      — say the promotion criterion out loud.
    ref: "concepts.md#room-state-machine"

  - id: design-hotel-booking-019
    difficulty: intermediate
    tags: [state-machine, availability, search]
    question: |
      A room is UNDER_MAINTENANCE and has zero bookings next month. Should next
      month's search return it?
    options:
      - "No — the availability check must also require room.isOperational(), not just absence of overlapping bookings"
      - "Yes — no overlapping bookings means available; the maintenance flag only blocks same-day walk-ins, never future search"
      - "Yes, but surface it at a maintenance-discounted nightly rate so the room still earns revenue while repairs are pending"
      - "Only if the guest is a loyalty member, since elite tiers may book rooms still flagged for pending maintenance work"
    answer: 0
    explanation: |
      Availability = operational AND no overlapping active booking. This is exactly
      where the operational state machine intersects the booking-derived calendar; a
      design that checks only bookings sells broken rooms.
    ref: "concepts.md#room-state-machine"

  - id: design-hotel-booking-020
    difficulty: advanced
    tags: [state-machine, transitions, validation]
    question: |
      Where should the rule "a room cannot go from OCCUPIED to UNDER_MAINTENANCE
      while a guest is inside" be enforced?
    options:
      - "In the email template that notifies maintenance staff, since that is the last step before a technician actually enters the room"
      - "In every caller that sets room status, with the same guard copy-pasted at each individual call site"
      - "Nowhere — trust every caller to behave correctly and check the guest's presence before flipping the status field itself"
      - "In one place: Room.transitionTo(next) validating against a transition table and throwing on illegal moves"
    answer: 3
    explanation: |
      Centralizing transition validation inside the room means no caller can corrupt
      the lifecycle, and the legal-transition set is readable in one table. Duplicating
      checks at call sites guarantees they drift apart.
    ref: "concepts.md#room-state-machine"

  - id: design-hotel-booking-021
    difficulty: beginner
    tags: [strategy, pricing, patterns]
    question: |
      The interviewer adds: "Prices are higher in summer, higher on weekends, and
      we're planning demand-based pricing next year." Which pattern fits, and why?
    options:
      - "Singleton — expose one global Price object so every booking reads the same nightly rate from a single shared instance"
      - "Strategy — each pricing policy is its own class behind PricingStrategy.price(room, range), so new policies are new classes, not edits to BookingService"
      - "Observer — model prices as subjects that notify all subscribed rooms whenever a seasonal or weekend rate is updated"
      - "Template Method — hardcode the seasonal, weekend, and demand steps in an abstract base class each room subtype extends"
    answer: 1
    explanation: |
      A growing family of interchangeable pricing algorithms selected at
      configuration time is Strategy's exact use case. An if/else chain in the booking
      flow would violate Open/Closed and tangle orchestration with pricing math.
    ref: "concepts.md#key-design-decisions"

  - id: design-hotel-booking-022
    difficulty: intermediate
    tags: [strategy, trade-offs, ocp]
    question: |
      Why is PricingStrategy preferable to an if/else chain on a season field inside
      BookingService, concretely?
    options:
      - "if/else statements are measurably slower than virtual dispatch, so the branch chain adds latency to every booking that a polymorphic strategy call would avoid at runtime"
      - "Strategy uses noticeably less heap because a single shared policy object replaces the many boolean season flags an if/else chain stores on each booking record"
      - "The chain forces you to edit tested orchestration code for every new policy, mixing pricing math into the booking flow — Strategy makes each policy a separately testable class added without touching the service"
      - "Java forbids chaining more than three else-if branches in one method, so a fourth pricing rule will not compile until you refactor to separate classes"
    answer: 2
    explanation: |
      The argument is Open/Closed plus SRP, not performance. Each new rate (seasonal,
      weekend, demand, promo) becomes an isolated class; the service you already
      demoed to the interviewer never changes.
    ref: "concepts.md#key-design-decisions"

  - id: design-hotel-booking-023
    difficulty: intermediate
    tags: [strategy, refund-policy, isp]
    question: |
      Why keep RefundPolicy as a separate interface from PricingStrategy instead of
      one PricingAndRefundStrategy?
    options:
      - "They compute essentially the same number, so one combined interface would create a circular call between the pricing and refund methods"
      - "Interfaces may only declare a single method in Java, so pricing and refund cannot legally share one type without becoming an abstract class"
      - "RefundPolicy must be an abstract class, not an interface, because computing a refund requires holding mutable cancellation-window state between calls"
      - "They change for different reasons and combine independently (a cheap rate often pairs with a strict refund) — merging them violates Interface Segregation"
    answer: 3
    explanation: |
      Purchase pricing and cancellation refunds are distinct axes of policy that the
      business mixes freely. Separate small interfaces let any pricing combine with
      any refund rule; a merged interface forces every combination to be its own class.
    ref: "concepts.md#key-design-decisions"

  - id: design-hotel-booking-024
    difficulty: beginner
    tags: [factory, patterns, room-creation]
    question: |
      What does RoomFactory.createRoom(RoomType.SUITE, "501") buy the design?
    options:
      - "Type-specific configuration (capacity, base rate, amenities) is centralized, so adding PENTHOUSE touches the enum and factory while booking/search code never mentions concrete setups"
      - "It guarantees that only one suite object can ever exist in the hotel, enforcing a single shared instance the way a registry of unique rooms would"
      - "It makes every constructed room deeply immutable, so its capacity and base rate can never be reconfigured once the factory hands it back"
      - "It removes the need for the Room class entirely, since the factory method itself holds all the capacity and rate data each booking needs"
    answer: 0
    explanation: |
      The factory concentrates construction knowledge in one place. Client code asks
      for a type and gets a correctly configured Room; new types don't ripple through
      the codebase. Instance-count control would be Singleton, which isn't the goal.
    ref: "concepts.md#key-design-decisions"

  - id: design-hotel-booking-025
    difficulty: beginner
    tags: [observer, notifications, patterns]
    question: |
      Booking confirmations must go out by email and SMS, and marketing wants to add
      a push channel next quarter. Which pattern decouples BookingService from the
      channels?
    options:
      - "Builder — assemble each notification step by step so email, SMS, and push messages share one fluent construction API"
      - "Flyweight — share one interned notification object so email and SMS reuse the same cached message instance"
      - "Observer — channels subscribe as BookingObservers and the service fires onBookingConfirmed without knowing who listens"
      - "Memento — snapshot the booking before sending so a failed channel can roll the notification back to a prior state"
    answer: 2
    explanation: |
      Observer inverts the dependency: the service publishes events; email, SMS, push,
      and later a loyalty accruer subscribe. Direct calls to each channel would force
      an edit to BookingService for every new listener.
    ref: "concepts.md#key-design-decisions"

  - id: design-hotel-booking-026
    difficulty: advanced
    tags: [observer, error-handling, ordering]
    question: |
      Where in the booking flow should observers be notified, and how should a
      failing email service be handled?
    options:
      - "Before the availability check runs, so guests receive early notice of their request even on the rare nights when no matching room turns out to be free"
      - "Notify after the booking is saved/committed, wrapping each observer in its own try/catch — a notification failure must never fail or roll back the booking"
      - "Inside the payment call itself, retrying the send in a tight loop until the email gateway finally accepts the confirmation message"
      - "Let the email exception propagate all the way up so the whole booking is cancelled and rolled back whenever a confirmation cannot be delivered"
    answer: 1
    explanation: |
      Notifications are best-effort side effects of a durable fact. Firing before
      commit can announce bookings that then fail; letting observer exceptions
      propagate makes a flaky SMTP server block revenue.
    ref: "concepts.md#key-design-decisions"

  - id: design-hotel-booking-027
    difficulty: intermediate
    tags: [patterns, boundaries]
    question: |
      During the round you say "I'll use Strategy here." What level of pattern detail
      does a strong candidate give next?
    options:
      - "Recite the full GoF intent, structure, and complete list of participants from memory before writing any of the pricing classes the requirement needs"
      - "Nothing further — naming the pattern out loud is enough signal, and elaborating on why it fits this requirement only wastes limited coding time"
      - "Draw the complete pattern UML straight from the GoF book on the whiteboard, labeling every abstract participant, before continuing the design"
      - "One sentence tying the pattern to THIS requirement — 'pricing policies are interchangeable algorithms the business swaps, so each becomes a class behind price(room, range)' — then move on"
    answer: 3
    explanation: |
      Interviewers reward pattern application, not recitation. Justify the choice
      against the concrete requirement and keep designing; pattern internals are
      covered by the design-patterns topics, and re-teaching them burns your clock.
    ref: "concepts.md#key-design-decisions"

  - id: design-hotel-booking-028
    difficulty: intermediate
    tags: [availability, overlap, algorithm]
    question: |
      With half-open stays [checkIn, checkOut), which condition correctly detects
      that two ranges A and B overlap?
    options:
      - "A.checkIn.isBefore(B.checkOut) && B.checkIn.isBefore(A.checkOut)"
      - "A.checkIn.equals(B.checkIn) && A.checkOut.equals(B.checkOut)"
      - "A.checkOut.isAfter(B.checkOut) || A.checkIn.isBefore(B.checkIn)"
      - "!A.checkIn.isAfter(B.checkOut) && !B.checkIn.isAfter(A.checkOut)"
    answer: 0
    explanation: |
      Two half-open intervals overlap iff each starts strictly before the other ends.
      Option D uses non-strict comparisons, which wrongly flags back-to-back stays
      (checkout on the 12th vs. check-in on the 12th) as conflicting.
    ref: "concepts.md#availability-and-date-range-overlap"

  - id: design-hotel-booking-029
    difficulty: beginner
    tags: [availability, derived-state]
    question: |
      How does the design answer "is Room 204 available Aug 10-14"?
    options:
      - "Read Room 204's single status field and return true whenever its current value equals AVAILABLE"
      - "Ask the guest whether they believe the room is free for those dates and simply trust that answer"
      - "Check the room is operational AND no active booking for it overlaps [Aug 10, Aug 14)"
      - "Check whether the room was ever booked at any point last year and infer availability from that history"
    answer: 2
    explanation: |
      Availability for a range is derived from booking records filtered to active
      statuses, plus the operational check. The status field alone only describes
      today's physical state and says nothing about next week.
    ref: "concepts.md#availability-and-date-range-overlap"

  - id: design-hotel-booking-030
    difficulty: intermediate
    tags: [availability, booking-status, bug]
    question: |
      Guests complain that rooms whose bookings were cancelled still show as
      unavailable for those dates. What is the most likely bug?
    options:
      - "The DateRange constructor rejects otherwise valid dates and quietly marks the whole range unavailable"
      - "The overlap scan considers ALL bookings instead of filtering to active statuses (CONFIRMED, CHECKED_IN) first"
      - "The pricing strategy returned a nightly price of zero, which availability misreads as the room being fully committed"
      - "The room factory produced two rooms sharing the same number, so another room's bookings shadow this one"
    answer: 1
    explanation: |
      CANCELLED and NO_SHOW bookings must not block availability. Forgetting the
      status filter before the overlap check is a classic bug — the cancelled record
      still exists (for history and refunds) but must be excluded from conflicts.
    ref: "concepts.md#availability-and-date-range-overlap"

  - id: design-hotel-booking-031
    difficulty: advanced
    tags: [availability, data-structures, complexity]
    question: |
      The interviewer asks how you'd speed up the per-room overlap scan beyond a
      linear pass. What is the right LLD-round move?
    options:
      - "Refuse the premise outright — a linear O(n) pass is always sufficient no matter how many bookings a room accumulates, so no better structure is warranted"
      - "Derive a full B+-tree implementation from scratch on the whiteboard, coding the node-splitting and rebalancing before returning to the booking design"
      - "Switch the whole discussion to database B-tree indexes for ten minutes, detailing which columns to index and how the query planner would use them"
      - "Name the upgrade path — bookings sorted by check-in for binary search, an interval tree, or a per-date bitmap — and note that structure internals belong to the DSA round"
    answer: 3
    explanation: |
      Naming the appropriate structure and its complexity shows depth; deriving its
      internals burns the clock on material owned by the dsa-coding domain. A linear
      scan per room is genuinely fine at single-hotel scale, and saying so is part of
      the answer.
    ref: "concepts.md#availability-and-date-range-overlap"

  - id: design-hotel-booking-032
    difficulty: advanced
    tags: [availability, book-by-type]
    question: |
      If guests book a room TYPE rather than a specific room, how does the
      availability check change?
    options:
      - "It becomes a count: on every night of the range, bookedCount(type, night) must be less than totalRooms(type)"
      - "It doesn't change at all — you still scan each individual room's bookings for an overlapping range exactly as before"
      - "You must acquire a lock on every physical room of that type in the hotel before the resulting count can be trusted"
      - "Availability becomes impossible to compute deterministically and now requires an ML demand model to estimate it per night"
    answer: 0
    explanation: |
      By-type booking turns a per-room overlap question into per-type nightly
      counting — a per-(type, date) counter map answers it in O(nights). The physical
      room is then assigned at check-in, splitting RoomBooking from RoomAssignment.
    ref: "concepts.md#availability-and-date-range-overlap"

  - id: design-hotel-booking-033
    difficulty: intermediate
    tags: [availability, half-open, edge-case]
    question: |
      Booking A is [Aug 10, Aug 12) and a request comes in for [Aug 12, Aug 14) on
      the same room. Under the strict-isBefore overlap test, what happens?
    options:
      - "The system deadlocks, because the two ranges touch at Aug 12 and both booking threads wait forever on the shared boundary date"
      - "No overlap is detected — checkout day equals check-in day is a legal back-to-back stay, which is exactly why half-open intervals were chosen"
      - "An overlap is detected and the request is rejected, since Aug 12 appears as both a checkout and a check-in day on the same room"
      - "The result depends on the server's timezone setting, which can shift Aug 12 across midnight and turn the boundary into a real conflict"
    answer: 1
    explanation: |
      A.checkIn (10th) isBefore B.checkOut (14th) is true, but B.checkIn (12th)
      isBefore A.checkOut (12th) is false — no overlap. Half-open semantics encode
      the hotel reality that a departing and an arriving guest share a calendar date.
    ref: "concepts.md#availability-and-date-range-overlap"

  - id: design-hotel-booking-034
    difficulty: intermediate
    tags: [api-design, exceptions]
    question: |
      Why should book(...) throw typed exceptions (RoomUnavailableException,
      PaymentFailedException) rather than return null or false on failure?
    options:
      - "Exceptions are measurably faster than checking return values, so throwing keeps the common booking path from paying any branch cost"
      - "Returning null is illegal in modern Java, so the compiler forces a thrown exception whenever a booking method cannot produce a result"
      - "The caller handles the two failures differently (offer alternative rooms vs. retry payment), so the API must distinguish WHY it failed"
      - "Boolean values cannot be serialized across service boundaries, so a remote caller could never receive a plain true or false result"
    answer: 2
    explanation: |
      A boolean collapses semantically different failures into one bit. Typed
      exceptions (or a result type) preserve the cause, letting the caller branch
      appropriately — and they make the failure modes visible in the method signature.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-hotel-booking-035
    difficulty: intermediate
    tags: [api-design, pricing, consistency]
    question: |
      Why should the quote(...) endpoint and the book(...) flow share the same
      PricingStrategy instance/configuration?
    options:
      - "To reduce the total class count, since one shared instance spares both the quote and book paths from needing their own strategy object"
      - "Quotes are legally binding contracts, so the quoted figure must be recomputed identically at booking time to satisfy consumer-protection law"
      - "Strategies cannot be instantiated more than once per JVM, so quote and book are forced to reference the very same object anyway"
      - "So the price shown to the guest equals the price charged — divergent code paths for quoting and charging drift and produce mismatched amounts"
    answer: 3
    explanation: |
      Two implementations of "compute the price" inevitably disagree after the next
      pricing change. Routing both through one strategy is the DRY answer and a
      quality signal interviewers notice.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-hotel-booking-036
    difficulty: beginner
    tags: [api-design, return-types]
    question: |
      What should cancel(bookingId) return in this design?
    options:
      - "void — cancellation produces no output the calling code could possibly need"
      - "A Refund object (amount plus payment reference) computed by the RefundPolicy"
      - "The full list of every remaining booking in the hotel after the removal"
      - "A brand-new RoomBooking object covering the freshly freed-up dates"
    answer: 1
    explanation: |
      The caller (and the guest) need to know how much money comes back and against
      which payment. Returning a Refund object surfaces the RefundPolicy's decision;
      void hides the flow's most important business output.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-hotel-booking-037
    difficulty: intermediate
    tags: [concurrency, race-condition]
    question: |
      Two guests both see the last Deluxe available and call book() concurrently.
      Without synchronization, why can both bookings succeed?
    options:
      - "The availability check followed by the save is a check-then-act sequence — both checks can pass before either booking is saved"
      - "Java's memory model gives each thread a private copy of the Room, so neither thread ever sees the other's booking write"
      - "The pricing strategy caches a stale nightly price and hands both threads the same figure, letting both charges settle"
      - "The bookings HashMap iterates in a nondeterministic order, so the overlap scan skips the freshly added conflicting entry"
    answer: 0
    explanation: |
      This is the textbook check-then-act race: both threads observe "no overlapping
      booking," then both write one. Mutual exclusion (or an atomic reserve) must span
      the check AND the save together.
    ref: "concepts.md#concurrency-booking-the-last-room"

  - id: design-hotel-booking-038
    difficulty: intermediate
    tags: [concurrency, lock-granularity]
    question: |
      Why a lock per Room rather than one global booking lock?
    options:
      - "A single global booking lock is impossible to implement in Java because ReentrantLock instances cannot be shared across more than one calling thread"
      - "Per-room locks consume far less total memory than one global lock, and that saved heap is the main reason to prefer them"
      - "A global lock serializes bookings for unrelated rooms — Room 101's booking should never wait on Room 902's — while per-room locks let independent bookings proceed in parallel"
      - "Per-room locks eliminate the need for the availability check entirely, since holding a room's lock already proves that room is free"
    answer: 2
    explanation: |
      Lock granularity should match the contended resource. The race is per-room, so
      the mutual exclusion should be too; a global lock is correct but needlessly
      throttles the whole hotel to one booking at a time.
    ref: "concepts.md#concurrency-booking-the-last-room"

  - id: design-hotel-booking-039
    difficulty: advanced
    tags: [concurrency, deadlock, lock-ordering]
    question: |
      You refine locking to per-(room, week-bucket) so disjoint-date bookings on the
      same room don't serialize. A booking spanning two buckets must acquire two
      locks. What discipline prevents deadlock?
    options:
      - "Acquire the two bucket locks in a randomized order so contention spreads evenly across buckets"
      - "Hold at most one bucket lock and rely on the fact that stays almost never span two week buckets"
      - "Insert a brief Thread.sleep between the two lock acquisitions so the second thread backs off first"
      - "Always acquire multiple bucket locks in a canonical order (e.g., sorted by date)"
    answer: 3
    explanation: |
      Deadlock requires a circular wait; imposing a global acquisition order (sorted
      buckets) makes cycles impossible. This is the standard answer whenever finer
      granularity forces multi-lock acquisition.
    ref: "concepts.md#concurrency-booking-the-last-room"

  - id: design-hotel-booking-040
    difficulty: advanced
    tags: [concurrency, optimistic-locking, trade-offs]
    question: |
      When would optimistic concurrency (book without a lock, let a version check or
      unique constraint reject the loser, retry) beat the pessimistic per-room lock?
    options:
      - "When conflicts are rare — you avoid lock overhead on the common uncontended path, paying with retries only on actual collisions"
      - "When two guests always contend for the exact same room, since optimistic retries settle that fight faster than a lock"
      - "Never — optimistic concurrency is fundamentally unsound and can silently confirm two bookings for one room"
      - "Only in the degenerate case where the hotel has exactly one room and therefore only one possible lock to contend on"
    answer: 0
    explanation: |
      Optimistic wins when contention is low: no lock management, full parallelism,
      occasional retry. Pessimistic is simpler to reason about live and is the
      expected interview default, but naming the trade-off is what earns senior
      signal.
    ref: "concepts.md#concurrency-booking-the-last-room"

  - id: design-hotel-booking-041
    difficulty: expert
    tags: [concurrency, payment, lock-scope]
    question: |
      The payment gateway takes 8 seconds. Your book() holds the per-room lock across
      the charge. The interviewer asks for a better design. What is the strongest
      answer?
    options:
      - "Switch to a single global lock held across the entire 8-second charge, so that every guest in the hotel waits their fair turn one at a time"
      - "Charge the guest's card first, before acquiring any room lock, and issue a refund afterward if the room turns out to already be taken"
      - "Create a short-lived PENDING booking (hold) inside the lock that blocks availability, release the lock, charge outside it, then confirm — expiring the hold on payment failure or timeout"
      - "Skip the post-payment availability re-check entirely, trusting that the check which passed before the 8-second charge is still valid"
    answer: 2
    explanation: |
      The PENDING hold reserves atomically under the brief lock, so the slow charge
      happens without blocking the room's other traffic and no double-charge is
      possible. Charging first risks charging two cards for one room; note that
      lock-across-payment is still acceptable to state first since it only stalls that
      one room.
    ref: "concepts.md#concurrency-booking-the-last-room"

  - id: design-hotel-booking-042
    difficulty: advanced
    tags: [concurrency, real-world, boundaries]
    question: |
      The interviewer asks, "In production with a real database, what replaces your
      in-memory ReentrantLock?" What is the right LLD-round response?
    options:
      - "Name it — SELECT ... FOR UPDATE on the room's bookings, or a unique constraint on (room, night) — then keep the in-memory design, since distributed locking is HLD territory"
      - "Insist that the in-memory ReentrantLock keeps working correctly across multiple application servers with no changes at all"
      - "Design a full ZooKeeper-based distributed lock service in detail, coding the ephemeral-znode leader election right on the board"
      - "Claim the database handles all of it automatically, so no locking or constraint design is needed on your part at all"
    answer: 0
    explanation: |
      One sentence mapping the in-memory mechanism to its DB equivalent shows you
      understand both layers; building distributed coordination is out of scope for
      the machine-coding round, and claiming ReentrantLock spans processes is wrong.
    ref: "concepts.md#concurrency-booking-the-last-room"

  - id: design-hotel-booking-043
    difficulty: intermediate
    tags: [edge-cases, validation]
    question: |
      Where should the rule "checkOut must be strictly after checkIn, and neither in
      the past" be enforced?
    options:
      - "In the UI form only, treating any backend re-validation of the range as redundant duplication"
      - "In the DateRange constructor, so an invalid range can never exist as an object"
      - "In the email notifier, checked just before each confirmation message is dispatched to the guest"
      - "In the RoomFactory at room-construction time, so every room is stamped with a valid default range"
    answer: 1
    explanation: |
      Validating at construction makes invalid states unrepresentable — every method
      receiving a DateRange can trust it. Scattering the check across callers (or
      leaving it to the UI) guarantees a path that skips it.
    ref: "concepts.md#edge-cases-and-error-states"

  - id: design-hotel-booking-044
    difficulty: intermediate
    tags: [edge-cases, booking-status]
    question: |
      A guest tries to cancel a booking that is already CHECKED_IN. What should
      happen?
    options:
      - "The cancellation is allowed to succeed and the system immediately evicts the currently checked-in guest from the room"
      - "The cancel call is silently ignored and returns success, leaving the CHECKED_IN booking exactly as it was"
      - "The room is flipped to UNDER_MAINTENANCE so that no further guest can be assigned to the disputed booking"
      - "markCancelled() validates the current BookingStatus and throws IllegalBookingStateException — CHECKED_IN is not cancellable"
    answer: 3
    explanation: |
      Booking status transitions need guarding just like room states. Validating
      inside the state-changing method (rather than at each call site) keeps the
      rule in one place; double-cancel gets the same treatment.
    ref: "concepts.md#edge-cases-and-error-states"

  - id: design-hotel-booking-045
    difficulty: advanced
    tags: [edge-cases, no-show]
    question: |
      A CONFIRMED booking's check-in date passes and the guest never arrives. How
      does the design handle it?
    options:
      - "The confirmed booking simply blocks the room's inventory forever, since nothing in the design ever revisits a passed check-in date"
      - "The room silently auto-transitions to OCCUPIED at midnight on the check-in date whether or not the guest ever arrived"
      - "A scheduled sweep marks the booking NO_SHOW, freeing remaining nights (and optionally charging a no-show fee via policy)"
      - "The next incoming guest's booking silently overwrites the no-show record and reclaims the dates without any sweep"
    answer: 2
    explanation: |
      No-show needs an active process — nothing else touches the booking. Marking it
      NO_SHOW excludes it from the availability scan's active statuses, releasing the
      inventory, and the fee is one more pluggable policy.
    ref: "concepts.md#edge-cases-and-error-states"

  - id: design-hotel-booking-046
    difficulty: advanced
    tags: [edge-cases, maintenance, conflicts]
    question: |
      Staff mark Room 305 UNDER_MAINTENANCE, but it has a confirmed booking arriving
      in three days. What should a well-designed transition do?
    options:
      - "Check for upcoming confirmed bookings before allowing the transition, and warn or require guest relocation"
      - "Allow the maintenance transition silently, on the principle that maintenance always outranks any existing booking"
      - "Immediately cancel the guest's confirmed booking with no notice, freeing the room for the maintenance crew"
      - "Block maintenance forever while any future booking exists, with no override"
    answer: 0
    explanation: |
      The operational state machine and the booking calendar intersect here: the
      transition guard should surface the conflict so the business decides (relocate,
      defer maintenance). Both silent extremes — clobbering the guest or making
      maintenance impossible — are wrong.
    ref: "concepts.md#edge-cases-and-error-states"

  - id: design-hotel-booking-047
    difficulty: intermediate
    tags: [edge-cases, payment, ordering]
    question: |
      In the skeleton, the payment charge happens BEFORE the booking is saved. What
      does this ordering buy when the charge throws PaymentFailedException?
    options:
      - "The guest ends up notified twice for redundancy, since the failed charge path re-fires the confirmation observer"
      - "Nothing was reserved yet, so there is no hold to clean up — the exception propagates and state is untouched"
      - "The booking is still written to storage anyway for audit purposes, even though the payment charge threw"
      - "The room is moved to UNDER_MAINTENANCE as a precaution until the failed payment can be manually reconciled"
    answer: 1
    explanation: |
      Charge-then-save (inside the lock) means a failed payment leaves zero residue.
      The alternative — save a PENDING hold first, charge, then confirm — requires
      explicit release on failure AND a timeout sweep; mention both designs and their
      cleanup obligations.
    ref: "concepts.md#edge-cases-and-error-states"

  - id: design-hotel-booking-048
    difficulty: intermediate
    tags: [extensibility, observer, loyalty]
    question: |
      "Add loyalty points: guests earn points on every confirmed booking." What is
      the Open/Closed-friendly implementation?
    options:
      - "Edit BookingService.book() so it calls loyaltyService.accrue() directly after each confirmed booking is saved"
      - "Subclass BookingService as LoyaltyBookingService and override book() to add the points-accrual step"
      - "Store the running loyalty-point total as a mutable field directly on each Room and increment it per booking"
      - "A LoyaltyObserver implementing BookingObserver that accrues points in onBookingConfirmed — zero edits to BookingService"
    answer: 3
    explanation: |
      The Observer seam exists precisely for this: new reactions to booking events
      are new subscribers. Editing or subclassing the service reopens tested
      orchestration code for a concern it shouldn't know about.
    ref: "concepts.md#extensibility"

  - id: design-hotel-booking-049
    difficulty: advanced
    tags: [extensibility, adapter, integration]
    question: |
      A third-party aggregator (an OTA like Booking.com) must search and book your
      inventory through its own API format. Which pattern integrates it without
      changing your core?
    options:
      - "Adapter — translate the aggregator's API calls into HotelBookingService calls, so all booking paths converge on the same per-room lock and availability logic"
      - "Observer — the aggregator subscribes as a listener to booking confirmations and reacts to each event it receives"
      - "Prototype — clone an existing booking object for the aggregator and hand back the copy through its own API"
      - "State — add a new AGGREGATED room status so the machine can route external bookings through a dedicated lifecycle"
    answer: 0
    explanation: |
      Interface translation between an external contract and your existing one is
      Adapter's exact job. Critically, routing OTA bookings through the same service
      keeps the concurrency guarantees intact — a separate write path would reopen
      the double-booking race.
    ref: "concepts.md#extensibility"

  - id: design-hotel-booking-050
    difficulty: advanced
    tags: [extensibility, waitlist, observer]
    question: |
      "Add a cancellation waitlist: when a fully-booked range frees up, offer it to
      waiting guests." How does this land in the existing design?
    options:
      - "Rewrite cancel() so it loops over every guest in the system and emails each one that the dates have just freed up"
      - "Store a single waitingGuest field directly on each Room and hand the freed dates to whoever occupies that slot"
      - "A WaitlistService subscribing to onBookingCancelled, keeping a FIFO queue per (roomType, dateRange) request and offering with an expiry — the cancel flow doesn't change"
      - "Poll every guest's email inbox on an hourly schedule to discover which of them still want the freed-up dates"
    answer: 2
    explanation: |
      The cancellation event already exists on the Observer seam; the waitlist is a
      new subscriber owning its own queue and offer-expiry logic. This is the payoff
      moment for having built the seam earlier in the round.
    ref: "concepts.md#extensibility"

  - id: design-hotel-booking-051
    difficulty: intermediate
    tags: [extensibility, amenities, pricing]
    question: |
      "Add bookable amenities and packages — breakfast, spa access, parking." Which
      change fits the existing structure best?
    options:
      - "Create dedicated BreakfastRoom, SpaRoom, and ParkingRoom subclasses of Room, one per bookable amenity offered"
      - "An Addon line-item list on RoomBooking, with costs folded in via the pricing pipeline — search and concurrency are untouched"
      - "A new global AmenityManager singleton that reaches in and mutates the stay's final price after payment settles"
      - "Hardcode a flat 15% amenities surcharge directly inside the payment processor's charge routine"
    answer: 1
    explanation: |
      Amenities are booking-level line items, not room subtypes — a guest chooses
      them per stay. Modeling them as data on the booking plus a pricing adjuster
      leaves availability and locking logic completely alone.
    ref: "concepts.md#extensibility"

  - id: design-hotel-booking-052
    difficulty: expert
    tags: [follow-ups, book-by-type, room-assignment]
    question: |
      Follow-up: "Guests book a room type and the desk assigns the physical room at
      check-in." Which refactoring does this force?
    options:
      - "Delete the Room class entirely, since guests now book only a type and the physical room no longer matters at all"
      - "Move the physical-room assignment logic onto the Guest class, letting each guest pick their own room at check-in"
      - "Merge RoomBooking and Payment into a single class so the type reservation and its charge live together"
      - "Split RoomBooking (type + date range) from RoomAssignment (physical room, created at check-in), with availability becoming per-type nightly counting"
    answer: 3
    explanation: |
      The booking no longer references a physical room — that binding happens at
      check-in as its own object. This split mirrors reality (hotels oversell types,
      not rooms) and is one of the most common senior-level follow-ups.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-hotel-booking-053
    difficulty: intermediate
    tags: [follow-ups, hourly-booking]
    question: |
      Follow-up: "Support hourly day-use bookings." How much of the design survives?
    options:
      - "Almost all of it — DateRange generalizes to a time range, half-open overlap logic is unchanged, and pricing gains an hourly strategy"
      - "None of it survives — hourly booking forces a full event-sourced rewrite of the entire reservation model"
      - "Only the Guest class survives; every other entity has to be rebuilt from scratch for sub-day granularity"
      - "The room state machine must double its number of states to track each occupied hour separately"
    answer: 0
    explanation: |
      The interval-overlap core is agnostic to granularity — that's the reward for
      putting overlap logic in a value object. Pricing per hour is just another
      Strategy. A design that hardcoded LocalDate arithmetic everywhere would not
      survive this follow-up.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-hotel-booking-054
    difficulty: beginner
    tags: [follow-ups, housekeeping, state-machine]
    question: |
      Follow-up: "Add housekeeping scheduling after checkout." Where is the natural
      hook?
    options:
      - "Inside the payment refund flow, triggered whenever a stay's final charge is settled at departure"
      - "Inside the pricing strategy, which recomputes the room's rate and schedules cleaning as a side effect"
      - "A HousekeepingService reacting to the room's CHECKED_OUT transition — the state machine already exposes the event"
      - "A nightly cron job that guesses which rooms are probably dirty by scanning recent booking dates"
    answer: 2
    explanation: |
      CHECKED_OUT exists precisely as the "needs cleaning" state; a service observing
      that transition schedules the task and later drives CHECKED_OUT -> AVAILABLE.
      The extension costs nothing because the lifecycle was modeled honestly.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-hotel-booking-055
    difficulty: intermediate
    tags: [srp, entities, design-review]
    question: |
      A candidate puts price(), overlapsWith(), sendConfirmation(), and chargeCard()
      all as methods on RoomBooking. What is the core critique?
    options:
      - "The real flaw is that price(), overlapsWith(), sendConfirmation(), and chargeCard() should all be static utility methods, since instance dispatch adds needless overhead on a plain booking record"
      - "The core critique is that RoomBooking ought to be an interface exposing these four methods as its contract, so alternate booking types can plug in their own pricing and charging logic"
      - "The main issue is naming: price(), overlapsWith(), sendConfirmation(), and chargeCard() are too terse, and expanding them into fully descriptive verb phrases would resolve the design concern"
      - "It violates SRP — pricing belongs to PricingStrategy, notification to observers, charging to PaymentProcessor; the booking is a record of the reservation, and only overlap (via its DateRange) is arguably its own concern"
    answer: 3
    explanation: |
      A god-entity accretes every behavior that touches it. Each listed method has a
      designed home; the booking entity holds state and simple derived queries.
      Spotting this in review is exactly what interviewers do to YOUR design.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-hotel-booking-056
    difficulty: advanced
    tags: [pricing, composition, decorator]
    question: |
      Seasonal rates AND a weekend uplift must apply to the same stay. How does the
      skeleton's WeekendPricing support combining policies?
    options:
      - "It can't — the skeleton allows exactly one PricingStrategy to be registered at a time, so applying seasonal and weekend rules together is structurally impossible without merging them into one class"
      - "It wraps another PricingStrategy (decorator-style), applying its uplift on top of the wrapped result, so policies compose as a chain"
      - "BookingService collects every registered strategy, computes each one's nightly figure independently, and charges the guest the arithmetic average of all those results"
      - "The guest is prompted at checkout to pick which single pricing rule — seasonal or weekend — should apply, and the unchosen strategy is discarded for that stay"
    answer: 1
    explanation: |
      Composing strategies — wrapping (Decorator-flavored) or folding a list of
      adjusters — answers the inevitable "policies stack" follow-up without a
      combinatorial explosion of SeasonalWeekendPricing-type classes.
    ref: "concepts.md#code-skeleton"

  - id: design-hotel-booking-057
    difficulty: beginner
    tags: [patterns, mapping]
    question: |
      Which pattern-to-requirement mapping from this design is WRONG?
    options:
      - "Strategy — pluggable pricing and refund policies behind price() and refund()"
      - "Observer — booking confirmation notifications fanned out to email and SMS channels"
      - "Factory — creating rooms configured per RoomType with the right capacity and rate"
      - "State — computing whether a date range overlaps existing bookings"
    answer: 3
    explanation: |
      Date-range overlap is plain interval arithmetic in the DateRange value object —
      no pattern needed. State applies to the ROOM's operational lifecycle
      (AVAILABLE, OCCUPIED, UNDER_MAINTENANCE...), not to availability computation.
    ref: "concepts.md#key-design-decisions"

  - id: design-hotel-booking-058
    difficulty: intermediate
    tags: [concurrency, observer, thread-safety]
    question: |
      The skeleton stores observers in a CopyOnWriteArrayList. Why is that a
      reasonable choice here?
    options:
      - "It keeps observers sorted by a priority field automatically, so higher-priority listeners like the payment auditor always fire ahead of the email channel"
      - "It is the only List implementation that can hold elements typed as an interface such as BookingObserver, since ArrayList rejects non-concrete element types"
      - "Observers are read (iterated) on every booking but mutated rarely — copy-on-write gives safe lock-free iteration for the read-heavy case"
      - "It guarantees each observer's onBookingConfirmed runs on its own parallel worker thread, so a slow email send never delays the SMS notification"
    answer: 2
    explanation: |
      Subscription changes are rare; notification iteration is constant. COW lists
      make iteration safe against concurrent subscribe/unsubscribe without
      synchronizing the hot path — a right-sized concurrency choice worth narrating.
    ref: "concepts.md#code-skeleton"
