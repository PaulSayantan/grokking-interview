topic: "OOP Principles & Pillars"
domain: lld-and-ood
topic_slug: oop-principles-pillars
version: 1
questions:
  - id: oop-principles-pillars-001
    difficulty: beginner
    tags: [encapsulation, design-reasoning]
    question: |
      A ParkingLot class declares `public List<ParkingSpot> spots;` so callers can find free
      spots easily. What is the core design problem?
    options:
      - "Lists are slower than arrays for spot lookup, adding latency to every free-spot scan"
      - "Any caller can mutate the list and break the lot's invariants — encapsulation is lost"
      - "The field should be static since all parking lots share one global pool of spots"
      - "It violates polymorphism because List is an interface type and callers can't subclass it"
    answer: 1
    explanation: |
      A public mutable field means every caller can add, remove, or reorder spots without
      going through the lot's logic — invariants like "a spot is occupied iff a ticket
      exists" can be silently broken from anywhere. Encapsulation means the state is
      private and only intention-revealing methods (findFreeSpot, reserveSpot) touch it.
      Performance and static-vs-instance are irrelevant here, and typing a field as the
      List interface is good practice, not a violation.
    ref: "concepts.md#encapsulation"

  - id: oop-principles-pillars-002
    difficulty: beginner
    tags: [polymorphism, extensibility]
    question: |
      Your fee calculator has `switch (vehicle.getType()) { case CAR: ...; case BIKE: ...; }`.
      The interviewer says "now add TRUCK". What is the polymorphic fix that avoids this
      question recurring for every new type?
    options:
      - "Add a TRUCK case to the switch and a comment reminding future devs to update every other switch too"
      - "Extract the switch into a static FeeUtils utility so the type logic is edited in only one central file"
      - "Move the varying behavior onto the Vehicle hierarchy (or a strategy), so a new type is a new class with zero edits to existing logic"
      - "Replace the enum with free-form string type names so adding a new type needs no enum edit anywhere"
    answer: 2
    explanation: |
      A type-switch reopens existing, tested code for every new variant. Runtime
      polymorphism inverts this: each subclass (or an injected strategy) carries its own
      behavior, and the caller just invokes the method — adding TRUCK becomes purely
      additive. Centralizing the switch reduces duplication but still requires
      modification; strings make it worse (no compile-time exhaustiveness at all).
    ref: "concepts.md#polymorphism"

  - id: oop-principles-pillars-003
    difficulty: intermediate
    tags: [composition, inheritance, trade-offs]
    question: |
      You need parking spots that vary by size (compact/large) AND cover (open/covered).
      A candidate proposes subclasses: CompactOpenSpot, CompactCoveredSpot, LargeOpenSpot,
      LargeCoveredSpot. Why is composition better here?
    options:
      - "Subclassing two independent axes multiplies classes (n×m); composing a SpotSize and CoverType field keeps it n+m and lets axes vary independently"
      - "Java forbids more than three concrete subclasses derived from any single parent class"
      - "Inheritance would force the spots to be immutable once their subclass is chosen at construction"
      - "Composition compiles measurably faster than inheritance because the JVM skips vtable setup"
    answer: 0
    explanation: |
      Two independent axes of variation encoded as a hierarchy explode combinatorially —
      add a third size and you write two more classes; add 'EV-charging' and you double
      everything. One ParkingSpot composed of a SpotSize and a CoverType grows linearly
      and can even change cover status at runtime. The other options are fabricated
      language claims.
    ref: "concepts.md#prefer-composition-over-inheritance"

  - id: oop-principles-pillars-004
    difficulty: beginner
    tags: [abstraction, interfaces]
    question: |
      In a parking-lot design, pricing may be hourly today but the interviewer hints at
      flat-rate and weekend pricing. Where should the seam go?
    options:
      - "A PricingUtils class with a static method per scheme, selected by a scheme-name argument"
      - "A boolean isFlatRate flag on ParkingLot checked inside computeFee to branch between schemes"
      - "Subclasses HourlyParkingLot and FlatRateParkingLot each overriding computeFee for their scheme"
      - "A PricingStrategy interface injected into ParkingLot, one implementation per scheme"
    answer: 3
    explanation: |
      The axis that varies is the pricing algorithm, so abstract exactly that: an interface
      the lot depends on, with implementations swapped by injection. Static utils and
      boolean flags both grow if/else logic inside the lot; subclassing the whole lot
      couples an unrelated axis (lot identity) to pricing and prevents runtime switching.
      This is the Strategy pattern — polymorphism plus composition.
    ref: "concepts.md#strategy-pattern-as-polymorphism-in-action"

  - id: oop-principles-pillars-005
    difficulty: intermediate
    tags: [encapsulation, getters]
    question: |
      `Inventory` keeps `private Map<String, Slot> slots;` and exposes
      `public Map<String, Slot> getSlots() { return slots; }`. Is this encapsulated?
    options:
      - "Yes — the field is private, and a private backing field is all that encapsulation actually requires"
      - "No — returning the live mutable map lets callers put/remove slots, bypassing every invariant; return an unmodifiable view or expose intent methods instead"
      - "Yes — Java automatically returns a defensive deep copy of any Map from an accessor method"
      - "No — getters are always forbidden in strict OO design because they expose the object's internals"
    answer: 1
    explanation: |
      Access modifiers are the mechanism; information hiding is the goal. Handing out the
      live map is functionally identical to a public field — callers can mutate state the
      class is supposed to guard. Java returns references, not copies. Getters aren't
      banned outright; getters that leak mutable internals are the violation. Prefer
      Collections.unmodifiableMap(...) or, better, methods like isAvailable(slotId).
    ref: "concepts.md#encapsulation"

  - id: oop-principles-pillars-006
    difficulty: intermediate
    tags: [tell-dont-ask, encapsulation]
    question: |
      Which call site best follows tell-don't-ask?
    options:
      - "if (wallet.getBalance() >= price) { wallet.setBalance(wallet.getBalance() - price); } // read then write"
      - "if (wallet.canAfford(price)) { wallet.setBalance(wallet.getBalance() - price); } // helper then external write"
      - "double b = wallet.getBalance(); wallet.setBalance(b - price); // pull balance out, compute, push back"
      - "wallet.debit(price);  // wallet checks funds and updates itself, throwing if insufficient"
    answer: 3
    explanation: |
      Tell-don't-ask: send one message and let the object apply its own rules to its own
      state. debit(price) keeps the check and the mutation together — one place to enforce
      invariants and one method to make thread-safe later. The others interrogate state
      and mutate from outside; option B still splits check from act (and a race can slip
      between them).
    ref: "concepts.md#tell-dont-ask"

  - id: oop-principles-pillars-007
    difficulty: intermediate
    tags: [inheritance, liskov]
    question: |
      A candidate writes `class ElectricCar extends Car` and overrides `refuel()` to throw
      UnsupportedOperationException ("EVs don't take fuel"). What does this signal?
    options:
      - "Good defensive programming — operations that make no sense for a subtype should throw at runtime"
      - "The hierarchy is wrong: ElectricCar is not substitutable where Car is expected, so the is-a relationship fails (Liskov violation)"
      - "The method should return silently and do nothing instead of throwing a runtime exception"
      - "refuel() should be marked static in Car so subclasses like ElectricCar cannot override it"
    answer: 1
    explanation: |
      Inheritance promises substitutability: any code holding a Car may call refuel().
      A subclass that must reject part of the parent's contract proves the is-a is false —
      the English sentence "an electric car is a car" doesn't survive the behavioral test.
      Restructure: e.g., a Vehicle base with an EnergySource component, or separate
      Fuelable/Chargeable capabilities. Silently ignoring the call is even worse (hides
      the bug); static is unrelated.
    ref: "concepts.md#inheritance"

  - id: oop-principles-pillars-008
    difficulty: advanced
    tags: [fragile-base-class, composition]
    question: |
      InstrumentedSet extends HashSet and increments addCount in both add() and addAll().
      Adding 3 elements via addAll reports addCount = 6. Why?
    options:
      - "HashSet.addAll internally calls add(), which dispatches to the subclass's override, so each element is counted twice"
      - "addAll dispatches its work onto a background worker thread that races with the counting add()"
      - "The @Override annotation makes the compiler emit two copies of the annotated method body"
      - "HashSet stores each inserted element twice internally until the next rehash compacts it"
    answer: 0
    explanation: |
      This is the fragile-base-class problem (Effective Java, Item 18). The subclass
      unknowingly depends on a self-use detail of the parent: HashSet.addAll delegates to
      add(), and dynamic dispatch routes those internal calls to the subclass override.
      Counting in addAll then double-counts. The robust fix is composition — wrap a Set
      and forward calls, so the inner set's self-calls stay internal.
    ref: "concepts.md#the-fragile-base-class-problem"

  - id: oop-principles-pillars-009
    difficulty: beginner
    tags: [abstraction, interfaces-vs-abstract]
    question: |
      In a chess design, King, Queen, and Knight all share `color` and `position` state plus
      a common `moveTo` implementation, but each computes legal moves differently. What is
      the most fitting construct for the shared parent?
    options:
      - "A final concrete class Piece with a moveType enum field switched on inside moveTo"
      - "A Piece interface whose default methods hold the shared color and position state"
      - "An abstract class Piece holding the shared fields, with abstract canMove(...) per subclass"
      - "A static PieceUtils class with helper methods for color, position, and move logic"
    answer: 2
    explanation: |
      Shared per-instance STATE plus partial behavior is exactly the abstract-class case:
      interfaces cannot hold instance fields, so 'default methods holding state' is not
      possible in Java. An enum-driven concrete class reintroduces type-switches for move
      logic, and static utils scatter behavior away from the data. The pieces are a true
      substitutable is-a family, so shallow inheritance is justified here.
    ref: "concepts.md#abstract-classes-vs-interfaces"

  - id: oop-principles-pillars-010
    difficulty: intermediate
    tags: [polymorphism, dynamic-dispatch]
    question: |
      Given `Vehicle v = new Truck();` where Truck overrides hourlyRateCents(), what does
      `v.hourlyRateCents()` execute, and why?
    options:
      - "Vehicle's version — the declared reference type is what decides which method body actually runs"
      - "It fails to compile — v must be declared as Truck for hourlyRateCents() to be callable"
      - "Both versions run in sequence, Vehicle's first via an implicit super call from the override"
      - "Truck's version — dynamic dispatch selects the override from the object's actual class at runtime"
    answer: 3
    explanation: |
      Instance-method calls in Java are virtual: the JVM looks up the implementation from
      the runtime class of the receiver (conceptually a vtable lookup). The static type
      Vehicle only constrains which methods may be *called*, not which body runs. There is
      no implicit super-chaining, and the code compiles fine because hourlyRateCents is
      declared on Vehicle.
    ref: "concepts.md#polymorphism"

  - id: oop-principles-pillars-011
    difficulty: intermediate
    tags: [overloading, overriding]
    question: |
      A class has `void handle(Vehicle v)` and `void handle(Truck t)`. You call
      `handle(x)` where x is declared `Vehicle x = new Truck();`. Which overload runs?
    options:
      - "handle(Vehicle) — overloads are resolved at compile time from the argument's static type"
      - "handle(Truck) — the argument's runtime type wins, exactly as it does with method overriding"
      - "It throws an AmbiguousMethodException at runtime because two overloads match the Truck object"
      - "The JVM picks randomly between the two matching overloads on each separate invocation"
    answer: 0
    explanation: |
      Overloading is compile-time polymorphism: the compiler picks the overload from the
      declared (static) types of the arguments, so handle(Vehicle) is chosen even though
      the object is a Truck. Only the receiver of an *overridden* instance method is
      dispatched on runtime type. Needing behavior to vary by an argument's runtime type
      is the cue for double dispatch / Visitor.
    ref: "concepts.md#compile-time-vs-runtime-polymorphism"

  - id: oop-principles-pillars-012
    difficulty: beginner
    tags: [interview-method, pillars]
    question: |
      Why do interviewers in a 45-minute LLD round care so much about the four pillars
      rather than asking for their definitions?
    options:
      - "Reciting all four definitions eats too much of the 45-minute slot to leave room for code"
      - "The pillars only matter for the whiteboard UML diagram, never for the code you actually write"
      - "The design must be right on the first pass — pillars applied well mean follow-up features land as new classes, not edits scattered across the design"
      - "Pillars are a screening topic used only to filter out junior, entry-level candidates"
    answer: 2
    explanation: |
      The round has no time for refactoring, and the standard interviewer move is the
      follow-up: "now add X". Encapsulation controls how far a change ripples, abstraction
      places seams where follow-ups land, composition keeps variants swappable, and
      polymorphism makes new variants additive. Candidates are graded on applying these
      reflexively while coding, not on recall.
    ref: "concepts.md#why-pillars-matter-in-a-45-minute-session"

  - id: oop-principles-pillars-013
    difficulty: intermediate
    tags: [encapsulation, api-design]
    question: |
      Which pair of methods best expresses an encapsulated BankAccount, per the
      'getter/setter pairs ≈ no encapsulation' guideline?
    options:
      - "getBalance() / setBalance(double) — a plain read and unrestricted write pair for the balance"
      - "deposit(amount) / withdraw(amount) with invariant checks inside"
      - "getBalance() / setBalanceUnsafe(double) plus a separate BalanceValidation utility class callers invoke"
      - "readField(\"balance\") / writeField(\"balance\", value) — generic reflective field accessors"
    answer: 1
    explanation: |
      setBalance lets any caller write any value — the overdraft rule must then be
      re-implemented (or forgotten) at every call site. deposit/withdraw are domain
      operations: they bundle the state change with the rules guarding it, in one place.
      Options C and D are the same leak with extra steps. A read-only getBalance()
      alongside deposit/withdraw is fine — reads don't break invariants.
    ref: "concepts.md#encapsulation"

  - id: oop-principles-pillars-014
    difficulty: advanced
    tags: [composition, runtime-flexibility]
    question: |
      A vending machine must switch from standard pricing to 'happy hour' pricing at 5 PM
      while running. Why does composition (an injected PricingStrategy field) handle this
      where inheritance (HappyHourVendingMachine subclass) cannot?
    options:
      - "A subclass method body is not permitted to contain time-of-day or clock-based branching logic"
      - "Inheritance would require reflective instantiation to swap the machine's class at exactly 5 PM"
      - "Composition sidesteps the JVM's per-instance class-loading overhead incurred when subclasses run"
      - "An object's class is fixed at construction — inheritance binds behavior statically, whereas a composed field can be reassigned mid-flight"
    answer: 3
    explanation: |
      Inheritance is a compile-time, per-class decision: once constructed, a machine IS a
      HappyHourVendingMachine forever, and switching means constructing a new object and
      migrating state. A composed strategy is per-instance and dynamic:
      machine.setPricing(happyHour) at 5 PM, one line, no state migration. This runtime
      swappability is a core reason to prefer composition for variant behavior.
    ref: "concepts.md#prefer-composition-over-inheritance"

  - id: oop-principles-pillars-015
    difficulty: beginner
    tags: [abstraction, leaky-abstraction]
    question: |
      Which TicketStore interface is the best abstraction?
    options:
      - "save(Ticket) and findById(String) — intention-revealing, hides the storage mechanism"
      - "getInternalHashMap() returning the live backing map so callers get maximally flexible access"
      - "writeToMySql(Ticket) and readFromMySql(String) — explicit about the MySQL backend behind it"
      - "serializeToDisk(Ticket, File) so every caller controls the on-disk persistence format itself"
    answer: 0
    explanation: |
      An abstraction should state WHAT callers can do, never HOW it is done. Naming MySQL,
      exposing the backing HashMap, or making callers manage files all leak mechanism into
      the contract — swap the implementation and every caller breaks. save/findById lets
      the store be a map today and a database tomorrow with zero caller changes.
    ref: "concepts.md#abstraction"

  - id: oop-principles-pillars-016
    difficulty: intermediate
    tags: [uml, relationships]
    question: |
      In a parking-lot class diagram: the lot creates and owns its Floors (they cannot
      outlive it), while Vehicles merely occupy floors and exist independently. Which UML
      relationships model Lot–Floor and Floor–Vehicle respectively?
    options:
      - "Both are composition (filled diamond) since Lot and Floor are each a HAS-A relationship"
      - "Composition (filled diamond) for Lot–Floor; aggregation (hollow diamond) for Floor–Vehicle"
      - "Aggregation (hollow diamond) for Lot–Floor; composition (filled diamond) for Floor–Vehicle"
      - "Inheritance (open triangle) for Lot–Floor; plain association (line) for Floor–Vehicle"
    answer: 1
    explanation: |
      The discriminator is lifecycle ownership. Floors are created by and die with the lot
      — strong ownership, composition, filled diamond. Vehicles exist before and after
      parking — shared/independent lifecycle, aggregation, hollow diamond. Naming this
      distinction while drawing is an easy senior signal; both are HAS-A but the ownership
      semantics differ, and inheritance is not involved at all.
    ref: "concepts.md#prefer-composition-over-inheritance"

  - id: oop-principles-pillars-017
    difficulty: intermediate
    tags: [strategy, trade-offs]
    question: |
      Why does Strategy beat an if-else chain for Splitwise's split rules (equal, exact,
      percentage), beyond aesthetics?
    options:
      - "if-else chains in Java cannot legally contain three or more branches for one decision"
      - "Strategy objects always execute faster than equivalent inline if-else branches at runtime"
      - "Each rule becomes an independently testable class, and a new rule (e.g., split-by-shares) is added without editing or re-testing the expense logic"
      - "Strategy removes the need to validate that the exact and percentage shares sum correctly"
    answer: 2
    explanation: |
      The design argument is open/closed plus isolation: with a SplitStrategy interface,
      each algorithm lives in its own unit-testable class, and new rules are additive —
      the Expense class never reopens. The chain version couples every rule together and
      forces a re-test of the whole method per addition. Performance is a wash, and
      validation is still needed inside the percentage strategy.
    ref: "concepts.md#strategy-pattern-as-polymorphism-in-action"

  - id: oop-principles-pillars-018
    difficulty: beginner
    tags: [inheritance, overriding]
    question: |
      Why should you always write @Override when overriding a superclass method in Java?
    options:
      - "It makes the overriding method run faster by giving the JIT compiler an inlining hint"
      - "It is required for dynamic dispatch to select the subclass method at runtime"
      - "It automatically inserts a call to the superclass implementation before the body runs"
      - "A signature typo would otherwise silently create a new overload instead of overriding — @Override turns that into a compile error"
    answer: 3
    explanation: |
      Without @Override, equals(MyType other) instead of equals(Object other) compiles
      happily as an unrelated overload — and your 'override' never runs, a notoriously
      silent bug. @Override asks the compiler to verify a superclass/interface method is
      actually being overridden. Dispatch works regardless of the annotation, there is no
      performance effect, and no implicit super call.
    ref: "concepts.md#inheritance"

  - id: oop-principles-pillars-019
    difficulty: advanced
    tags: [tell-dont-ask, concurrency]
    question: |
      Two threads race on: `if (spot.isFree()) { spot.assign(vehicle); }` and both park in
      the same spot. Which design change fixes this at the root?
    options:
      - "Merge check and mutation into one spot method — boolean tryPark(vehicle) — and synchronize inside it (tell-don't-ask enables the atomic boundary)"
      - "Call isFree() twice before assigning, to double-check no other thread grabbed the spot between the two reads"
      - "Make isFree() synchronized while leaving assign() unsynchronized, since guarding just the read closes the window"
      - "Add a short Thread.sleep between the check and the assignment so the second thread observes the update first"
    answer: 0
    explanation: |
      The bug is check-then-act across two calls — no amount of synchronizing the
      individual methods closes the gap between them. Tell-don't-ask fixes the design:
      tryPark owns both the check and the mutation, giving one method to make atomic
      (synchronized, per-spot lock, or compareAndSet). Double-checking and sleeping just
      reshuffle the race. This is why ask-style designs are hard to retrofit for
      concurrency.
    ref: "concepts.md#tell-dont-ask"

  - id: oop-principles-pillars-020
    difficulty: intermediate
    tags: [abstraction, over-engineering]
    question: |
      A candidate creates IParkingLot, ITicket, IVehicleFactory, and ILevel interfaces —
      each with exactly one implementation and no follow-up in sight. The interviewer
      frowns. Why?
    options:
      - "Interfaces are deprecated in modern Java now that sealed classes and records cover the same use cases"
      - "Interface names must never start with I in Java; the compiler reserves that prefix for JDK-internal types"
      - "Abstraction without a variation axis is ceremony: it spends scarce interview time and adds indirection with no swap-in benefit"
      - "Each interface should have declared at least five methods to justify the abstraction's existence"
    answer: 2
    explanation: |
      An abstraction earns its keep when you can name a second plausible implementation or
      a follow-up that lands on that seam (pricing, allocation, notification). Blanket
      one-implementation interfaces demonstrate pattern-cargo-culting, not judgment, and
      in a timed round the cost is real. The style-naming quibble exists but is not the
      design issue; method-count rules are invented.
    ref: "concepts.md#abstraction"

  - id: oop-principles-pillars-021
    difficulty: intermediate
    tags: [encapsulation, immutability]
    question: |
      Ticket exposes `public Date getEntryTime() { return entryTime; }` where entryTime is a
      private java.util.Date. A caller does `ticket.getEntryTime().setTime(0)` and the fee
      drops to zero. What went wrong?
    options:
      - "The getter needed the synchronized keyword so concurrent reads of entryTime wouldn't see a torn value"
      - "Date should have been compared with equals rather than ==, so the mutated timestamp still tests as unchanged"
      - "The field should have been protected instead of private, which would have blocked the external setTime call"
      - "The getter leaked a reference to a mutable object — return a defensive copy or use an immutable type like java.time.Instant"
    answer: 3
    explanation: |
      Private fields don't protect you if the getter hands out the mutable object itself —
      the caller mutated the ticket's own Date. Defensive copies (new Date(entryTime.getTime()))
      or immutable value types (Instant/LocalDateTime) close the hole; immutability is the
      cleaner modern answer. Visibility, equality, and synchronization don't address
      aliasing of mutable state.
    ref: "concepts.md#encapsulation"

  - id: oop-principles-pillars-022
    difficulty: intermediate
    tags: [interfaces-vs-abstract, design-reasoning]
    question: |
      NotificationSender must be implemented by EmailSender, SmsSender, and PushSender —
      stateless classes with completely different mechanisms and no shared code. Interface
      or abstract class for the contract, and why?
    options:
      - "Abstract class, because senders form an is-a family that should share a common transport base type"
      - "Interface — it's a pure capability with no shared state or partial implementation, and implementors keep their extends slot free"
      - "Abstract class, because a Java interface is capped at two concrete implementations per compilation unit"
      - "Neither — a single sender class with a channel enum switched inside a send() method is simpler"
    answer: 1
    explanation: |
      The decision rule: shared per-instance state or partial implementation → abstract
      class; pure contract → interface. Here there is nothing to share, so an interface
      gives maximal flexibility — any class, whatever its ancestry, can implement it.
      The enum version reintroduces a switch over channels inside one class, exactly the
      structure polymorphism should replace.
    ref: "concepts.md#abstract-classes-vs-interfaces"

  - id: oop-principles-pillars-023
    difficulty: advanced
    tags: [liskov, inheritance]
    question: |
      The classic: should Square extend Rectangle (which has setWidth and setHeight)?
    options:
      - "Yes — mathematically every square is a rectangle, so the is-a relationship holds and substitutability follows automatically"
      - "Yes, provided Square overrides both setters to keep the sides equal, which fully preserves the parent's contract"
      - "No — callers of Rectangle may set width independently of height; Square breaks that behavioral expectation, so it is not substitutable despite the English is-a"
      - "No — Java forbids overriding inherited setter methods that mutate protected fields"
    answer: 2
    explanation: |
      Substitutability is behavioral, not linguistic. Code like r.setWidth(5); r.setHeight(4);
      assert r.area()==20 holds for every Rectangle but fails for a side-syncing Square —
      the 'fix' in option B is precisely what breaks clients. With mutable setters the
      hierarchy is wrong; immutable shapes or separate types are the honest designs. This
      is the standard Liskov preview question in OOP discussions.
    ref: "concepts.md#inheritance"

  - id: oop-principles-pillars-024
    difficulty: beginner
    tags: [polymorphism, interfaces]
    question: |
      CreditCardPayment, UpiPayment, and CashPayment share no ancestor but must all be
      usable by a checkout flow. Which pillar/mechanism makes this work?
    options:
      - "Interface polymorphism — all three implement PaymentMethod, and checkout programs against the interface"
      - "Encapsulation — mark each class's fields private so checkout can treat the three types uniformly"
      - "Inheritance — make all three extend a shared AbstractMoney base class so checkout accepts the parent type"
      - "Overloading — write one checkout method per payment class and let the compiler pick the right one"
    answer: 0
    explanation: |
      Interface polymorphism lets unrelated classes satisfy one contract without spending
      their single extends slot or sharing implementation. Checkout holds a PaymentMethod
      and calls charge() — dynamic dispatch does the rest. Overloading one method per type
      hard-codes the type set into the caller (compile-time selection), and forcing an
      artificial base class couples classes that share nothing.
    ref: "concepts.md#polymorphism"

  - id: oop-principles-pillars-025
    difficulty: intermediate
    tags: [fragile-base-class, api-boundaries]
    question: |
      Why is extending a class you don't own (e.g., a third-party or JDK collection)
      riskier than wrapping it?
    options:
      - "Third-party classes are always final, so any attempt to extend them fails to compile"
      - "Wrapping guarantees thread safety automatically by serializing every forwarded call through a lock"
      - "Extending a library class prevents that library from ever being upgraded to a newer version"
      - "Your subclass silently depends on the parent's self-use patterns (which methods call which); a library update can change those and break you without any signature change"
    answer: 3
    explanation: |
      The fragile-base-class problem: overriding hooks into the parent's internal call
      graph, which is undocumented and can change in any release — your code breaks while
      compiling cleanly. A wrapper (composition + forwarding) interacts only through the
      public API, which is the part the library actually promises to keep stable. The
      other options are false absolutes.
    ref: "concepts.md#the-fragile-base-class-problem"

  - id: oop-principles-pillars-026
    difficulty: intermediate
    tags: [design-reasoning, checklists]
    question: |
      During the final review of your design, you spot `elevator.getRequestQueue().clear()`
      being called from the Building class. Which checklist items does this trip?
    options:
      - "Only a naming-convention issue — rename the accessor from getRequestQueue() to requestQueue()"
      - "Leaked mutable internals (encapsulation) AND external logic operating on another object's data (tell-don't-ask)"
      - "A polymorphism issue — the Queue field should be an abstract class so subclasses can vary it"
      - "A performance issue — clear() is O(n) and blocks the elevator's scheduling loop while it runs"
    answer: 1
    explanation: |
      Two pillars trip at once: the getter hands the live queue to outsiders (encapsulation
      broken — any caller can corrupt scheduling state), and the Building is making a
      decision that belongs to the Elevator (ask-then-mutate). The fix is one intent method
      — elevator.cancelAllRequests() — with the queue never leaving the elevator. Naming
      and big-O are beside the point.
    ref: "concepts.md#pillars-on-the-whiteboard-a-checklist"

  - id: oop-principles-pillars-027
    difficulty: beginner
    tags: [inheritance, is-a]
    question: |
      Which relationship is the legitimate use of inheritance among these LLD candidates?
    options:
      - "Stack extends ArrayList to reuse its element storage and resizing logic for free"
      - "Rook extends ChessBoard so it can reach the square-position arrays directly without a getter"
      - "King extends Piece where every Piece can report its legal moves and all pieces are handled uniformly by the Board"
      - "PremiumUser extends DiscountCalculator to inherit the discount-math methods it needs at checkout"
    answer: 2
    explanation: |
      King/Piece is true is-a with substitutability: the Board moves any Piece via the same
      contract and every subclass honors it. The others inherit for code REUSE or ACCESS:
      Stack-extends-ArrayList leaks insert-anywhere methods that break LIFO (a real JDK
      design mistake), a Rook is not a board, and a user is not a calculator — those want
      composition (HAS-A or uses-a).
    ref: "concepts.md#inheritance"

  - id: oop-principles-pillars-028
    difficulty: advanced
    tags: [composition, decorator]
    question: |
      To add 'notify owner on every state change' to an existing ParkingSpot without
      touching its code, you write NotifyingSpot implementing the same Spot interface,
      holding a Spot field, and forwarding calls while adding notifications. Which
      pillar-level idea (and named pattern) is this?
    options:
      - "Composition + interface polymorphism — the forwarding-wrapper structure, packaged as the Decorator pattern"
      - "Inheritance — NotifyingSpot is-a ParkingSpot subclass that overrides each method to add the notification"
      - "Encapsulation — the notification is hidden inside a private method that the interface never exposes to callers"
      - "Compile-time polymorphism — overloading the spot's methods with an extra listener argument the compiler selects"
    answer: 0
    explanation: |
      The wrapper HAS-A spot (composition) and IS-substitutable-for a spot via the shared
      interface (polymorphism) — extending behavior without modifying or subclassing the
      wrapped class. That exact recipe is the Decorator pattern (see dp-decorator for the
      full treatment); it's also the same forwarding structure that fixes the fragile base
      class. No extends, no overloading involved.
    ref: "concepts.md#prefer-composition-over-inheritance"

  - id: oop-principles-pillars-029
    difficulty: intermediate
    tags: [polymorphism, static-methods]
    question: |
      Parent declares `static String describe()` and Child re-declares
      `static String describe()`. Given `Parent p = new Child();`, what does
      `p.describe()` (i.e., Parent-typed reference) resolve to, and why?
    options:
      - "Child's version — statics participate in dynamic dispatch through the vtable just like instance methods"
      - "Parent's version — static methods are hidden, not overridden; resolution uses the reference's static type"
      - "A runtime error, since two static methods sharing one signature cannot coexist across a class hierarchy"
      - "Whichever describe() the JVM loaded first when it initialized the two classes at startup"
    answer: 1
    explanation: |
      Only instance methods participate in dynamic dispatch. A static method with the same
      signature in a subclass HIDES the parent's version; calls resolve at compile time
      from the reference's declared type, so Parent.describe() runs. Same story for
      fields. This is why behavior meant to vary by subtype must live in instance methods
      — statics can't be polymorphic.
    ref: "concepts.md#compile-time-vs-runtime-polymorphism"

  - id: oop-principles-pillars-030
    difficulty: intermediate
    tags: [strategy, cache-design]
    question: |
      In the LRU-cache LLD problem, the interviewer asks 'now support LFU too'. Which
      pillar-driven structure makes this a small change?
    options:
      - "A boolean isLfu flag switching the eviction logic inside both get() and put() at every access"
      - "Copy the LruCache class to a new LfuCache class and modify just the eviction bookkeeping bits"
      - "A static EvictionUtils.evict(cache, policyName) dispatcher that branches on the policy-name string"
      - "Eviction already extracted behind an EvictionPolicy interface composed into the cache — LFU is one new class implementing it"
    answer: 3
    explanation: |
      Encapsulate what varies: eviction is the varying algorithm, so it lives behind an
      interface (Strategy) that the cache composes. LFU then plugs in without touching
      cache code. Flags and string dispatchers grow conditional logic in place; class
      copying duplicates everything else the cache does. Note each policy may need its own
      bookkeeping structure — which the policy object encapsulates too.
    ref: "concepts.md#strategy-pattern-as-polymorphism-in-action"

  - id: oop-principles-pillars-031
    difficulty: beginner
    tags: [abstraction, definition]
    question: |
      What is the cleanest one-line distinction between encapsulation and abstraction?
    options:
      - "Encapsulation is a Java-only language feature, whereas abstraction is a Python-only language feature"
      - "Encapsulation applies strictly to instance fields, while abstraction applies strictly to method signatures"
      - "Encapsulation hides an object's STATE/representation; abstraction hides MECHANISM behind a minimal intention-revealing contract"
      - "They are exact synonyms, used interchangeably by different textbooks for the same underlying idea"
    answer: 2
    explanation: |
      Both hide, but different things at different granularity. Encapsulation is inward:
      private state plus the invariant-guarding methods around it. Abstraction is outward:
      the contract a caller sees (an interface like PricingStrategy) that conceals which
      algorithm or backend does the work. A class can be well-encapsulated yet a leaky
      abstraction (e.g., an interface method named writeToMySql), and vice versa.
    ref: "concepts.md#abstraction"

  - id: oop-principles-pillars-032
    difficulty: advanced
    tags: [follow-ups, extensibility]
    question: |
      Interviewer: 'Your lot handles cars and bikes. Add EVs that need charging spots.'
      Your Vehicle subclasses already override hourlyRateCents(), and spot matching goes
      through spot.canFit(vehicle). What is the strongest answer?
    options:
      - "Add an EV subclass of Vehicle and extend the spot-matching data (e.g., required capabilities on spots, needs on vehicles) — existing classes gain no new conditionals"
      - "Add if (vehicle instanceof EV) branches inside ParkingLot.parkVehicle to route EVs to charging spots"
      - "Create an EVParkingLot subclass extending ParkingLot and overriding parkVehicle for the charging case"
      - "Ask the interviewer to defer EV support to the high-level design round as an infrastructure concern"
    answer: 0
    explanation: |
      The design already has the right seams: rates are polymorphic on Vehicle, and
      canFit encapsulates matching inside the spot. EV becomes additive — a new subclass
      plus data-driven capability matching (spot 'provides charging', vehicle 'requires
      charging'). instanceof branches reopen the lot for every future type, subclassing
      the whole lot inherits everything to change one policy, and deferring is a dodge —
      EV support is squarely an LLD concern.
    ref: "concepts.md#common-interview-follow-ups"

  - id: oop-principles-pillars-033
    difficulty: intermediate
    tags: [encapsulation, invariants]
    question: |
      Where should the rule 'a withdrawal must not exceed the balance and must append a
      Transaction record' be enforced?
    options:
      - "In a standalone WithdrawalValidator service that every caller must remember to invoke before withdrawing"
      - "In the UI layer, since that is where users initiate withdrawals and the amount can be checked on entry"
      - "In each caller, kept consistent by a code-review checklist that reviewers apply on every pull request"
      - "Inside BankAccount.withdraw(), the only method allowed to decrement the balance"
    answer: 3
    explanation: |
      Invariants must live with the state they protect, in the single method that mutates
      it — then they CANNOT be bypassed, forgotten, or half-applied (decrement without the
      transaction record). Validators and checklists rely on every current and future
      caller cooperating; the UI is just one of many entry points. This colocation of data
      and guarding behavior is the essence of encapsulation.
    ref: "concepts.md#encapsulation"

  - id: oop-principles-pillars-034
    difficulty: intermediate
    tags: [interfaces-vs-abstract, template-method]
    question: |
      All report exporters share the same skeleton (open → writeHeader → writeRows → close)
      with per-instance state like the output stream, but writeRows differs per format.
      Which construct fits, and which pattern is it?
    options:
      - "A Runnable per format submitted to an executor, letting the thread pool sequence the shared skeleton steps"
      - "An abstract class with a final export() skeleton calling an abstract writeRows() — the Template Method pattern"
      - "An interface with a default export() method that holds the output stream as a field shared by implementors"
      - "Three unrelated concrete classes that each duplicate the open-header-rows-close skeleton independently"
    answer: 1
    explanation: |
      Shared skeleton + shared per-instance state + one varying step is Template Method's
      home turf, and it needs an abstract class: interfaces cannot hold the stream field
      (default methods are stateless). The final skeleton prevents subclasses from
      reordering the algorithm. See dp-template-method for the pattern proper; the pillar
      decision here is 'partial implementation with state → abstract class'.
    ref: "concepts.md#abstract-classes-vs-interfaces"

  - id: oop-principles-pillars-035
    difficulty: beginner
    tags: [composition, has-a]
    question: |
      'A Car HAS-A Engine' rather than 'Car extends Engine'. Which single question best
      decides between HAS-A and IS-A when modeling?
    options:
      - "Which of the two options ends up producing fewer total lines of code in the class?"
      - "Does the child class need direct access to the other class's protected members and fields?"
      - "Can the new class be substituted anywhere the other type is expected, honoring its full contract?"
      - "Will the two classes end up living in the same package and compilation unit?"
    answer: 2
    explanation: |
      Substitutability is the only reliable test. A Car cannot stand in wherever an Engine
      is expected — it merely USES one — so the engine is a field. Wanting protected
      access or code reuse are the classic WRONG reasons to inherit (they create fragile
      coupling); line counts and packaging are irrelevant. If substitution fails, compose.
    ref: "concepts.md#inheritance"

  - id: oop-principles-pillars-036
    difficulty: advanced
    tags: [tell-dont-ask, law-of-demeter]
    question: |
      You spot `order.getCustomer().getWallet().debit(total)` in a checkout flow. What is
      the Demeter/tell-don't-ask improvement?
    options:
      - "order.chargeCustomer(total) — the order tells its customer, which tells its wallet, each object talking only to direct collaborators"
      - "Cache the wallet in a local variable first, then debit it, so the getter chain appears only once"
      - "Make Wallet a static singleton so the getCustomer().getWallet() navigation chain disappears entirely"
      - "Inline the getters by making the customer and wallet public fields accessed directly from checkout"
    answer: 0
    explanation: |
      The chain couples checkout to the internal structure Order→Customer→Wallet — if
      wallets move (say, to a PaymentProfile), checkout breaks despite not owning any of
      it. Delegating one hop at a time means each class exposes behavior, not structure,
      and a refactor stays inside Customer. Caching the reference keeps the same coupling;
      singletons and public fields make everything worse.
    ref: "concepts.md#tell-dont-ask"

  - id: oop-principles-pillars-037
    difficulty: intermediate
    tags: [polymorphism, open-closed]
    question: |
      Replacing a type-switch with polymorphic dispatch is usually justified via which
      SOLID principle, and what is the causal link?
    options:
      - "Single Responsibility — a type-switch mixes two responsibilities in one method, so extracting each branch is what dispatch delivers"
      - "Interface Segregation — a type-switch forces one fat interface that every client must depend on wholesale"
      - "Dependency Inversion — a type-switch makes callers depend on concrete variant types rather than an abstraction"
      - "Open/Closed — new variants become new classes (extension) instead of edits to every switch site (modification)"
    answer: 3
    explanation: |
      The pillar-to-principle bridge: dynamic dispatch means the code that USES a variant
      never enumerates the variants, so the system is open to extension (add a subclass or
      strategy) and closed to modification (no existing method reopens). SRP, ISP, and DIP
      are real principles but the switch-vs-dispatch trade is OCP's textbook case — worth
      naming explicitly when you refactor one in an interview.
    ref: "concepts.md#polymorphism"

  - id: oop-principles-pillars-038
    difficulty: intermediate
    tags: [abstraction, seams]
    question: |
      You have time to abstract exactly ONE thing in your elevator design. Requirements
      mention 'we may later prioritize hospital floors' and nothing else unusual. Which
      seam do you cut?
    options:
      - "An IElevator interface over the Elevator class so the car itself can be swapped for an alternate implementation later"
      - "A SchedulingStrategy interface for choosing which request to serve next"
      - "An IButton interface over the panel buttons so each floor and cabin button type varies independently"
      - "A DoorMotor abstraction for the door hardware so the physical actuator can be replaced without code changes"
    answer: 1
    explanation: |
      Abstract along the axis the requirements say will vary: 'prioritize hospital floors'
      is a scheduling-policy change, so the request-selection algorithm is the seam that
      pays off — swap SCAN-style scheduling for a priority-aware one without touching the
      elevator. The other interfaces each have one plausible implementation and no named
      follow-up; cutting them is ceremony under time pressure.
    ref: "concepts.md#abstraction"

  - id: oop-principles-pillars-039
    difficulty: beginner
    tags: [overloading, api-design]
    question: |
      What is the legitimate design use of method overloading (compile-time polymorphism)?
    options:
      - "Making behavior vary based on an object's runtime type, with the JVM picking the overload from the receiver's actual class"
      - "Replacing scattered conditionals with additive extension points so the design satisfies the open/closed principle"
      - "Convenience API variants — e.g., park(vehicle) and park(vehicle, preference) — where one delegates to the other"
      - "Enabling subclasses to specialize a single step of an inherited algorithm while reusing the surrounding skeleton"
    answer: 2
    explanation: |
      Overloading is resolved at compile time from static argument types, so it cannot
      react to runtime types (that is overriding), cannot make a design open/closed, and
      has nothing to do with subclassing. Its honest job is ergonomic APIs: several entry
      points with different parameter lists, thin wrappers delegating to one canonical
      implementation so logic isn't duplicated.
    ref: "concepts.md#compile-time-vs-runtime-polymorphism"

  - id: oop-principles-pillars-040
    difficulty: advanced
    tags: [inheritance, effective-java]
    question: |
      Effective Java advises 'design and document for inheritance or else prohibit it.'
      In an LLD interview, what is the practical takeaway for the classes you write?
    options:
      - "Add protected hooks to every class up front so the interviewer can extend any of them without touching your code"
      - "Never use inheritance anywhere in the design and model every relationship as composition regardless of the domain"
      - "Document all private methods with Javadoc so future subclasses can safely depend on the internal call structure"
      - "Keep intended hierarchies shallow and deliberate (e.g., Piece, Vehicle); for everything else prefer composition or make the class effectively final rather than casually extensible"
    answer: 3
    explanation: |
      Inheritance is a commitment: subclasses couple to your self-use patterns, so a class
      must be designed for it (documented hook points, stable internal call structure) or
      closed to it. In interview terms: use extends only where you planned an is-a family,
      keep it 1-2 levels, and default other variation to composed strategies. Sprinkling
      protected hooks 'just in case' creates exactly the fragile surface the advice warns
      about.
    ref: "concepts.md#the-fragile-base-class-problem"

  - id: oop-principles-pillars-041
    difficulty: intermediate
    tags: [encapsulation, money]
    question: |
      Why does representing money as `double balance` draw an instant red flag, and what is
      the encapsulation-friendly fix?
    options:
      - "Binary floating point cannot represent amounts like 0.10 exactly, so arithmetic drifts — use integer cents or a Money value object that also centralizes currency rules"
      - "double is 64-bit and wastes memory on money fields — switch to a 32-bit float to halve the footprint per amount"
      - "double values cannot be marked private in Java, so a balance field is always exposed to callers regardless of visibility"
      - "Doubles cannot be compared with < or > at all in Java, so overdraft checks on a balance silently misbehave"
    answer: 0
    explanation: |
      0.1 + 0.2 != 0.3 in binary floating point; over many fee calculations the drift
      becomes real money. Integer cents (long) or BigDecimal fix correctness, and wrapping
      either in a Money value object adds encapsulation: rounding rules, currency, and
      formatting live in one class instead of leaking into every calculation. float is
      strictly worse; the other claims are false.
    ref: "concepts.md#encapsulation"

  - id: oop-principles-pillars-042
    difficulty: intermediate
    tags: [composition, splitwise]
    question: |
      In Splitwise, a Group contains Users, and Users exist across many groups and outlive
      any group. Group–User is therefore which relationship, and what does that imply for
      your code?
    options:
      - "Composition — the group owns its users' lifecycle, so deleting a group should cascade and delete every member with it"
      - "Inheritance — Group extends User to reuse the identity fields like name and email without redeclaring them"
      - "Aggregation — the group holds references to independently-owned User objects, so deleting a group must not cascade to users"
      - "Dependency only — groups should never hold user references and instead re-fetch members by id on each operation"
    answer: 2
    explanation: |
      Lifecycle decides: users are created, owned, and deleted independently of any group,
      so the group merely aggregates references (hollow diamond in UML). Getting this
      wrong as composition produces a real bug — group deletion cascading into user
      deletion. Inheritance is nonsensical here, and 'no reference' would make the group
      unable to do its one job.
    ref: "concepts.md#prefer-composition-over-inheritance"

  - id: oop-principles-pillars-043
    difficulty: beginner
    tags: [pillars, vocabulary]
    question: |
      Which narration, said while coding, demonstrates encapsulation-awareness to the
      interviewer?
    options:
      - "I'll make every field and method public for now and lock down visibility at the end of the round if there's time left"
      - "I'm returning an unmodifiable view of the transactions list so callers can read history but can't corrupt it"
      - "I'll add a matching getter and setter for every field up front so the class stays maximally flexible for callers"
      - "I'm using a HashMap for the slot lookup here because it gives amortized O(1) access on the key"
    answer: 1
    explanation: |
      The unmodifiable-view narration shows you know WHAT encapsulation protects
      (invariants) and the subtle failure mode (leaking mutable internals through a
      getter). 'Public now, private later' never gets cleaned up in a timed round;
      blanket getter/setter pairs are the anemic anti-pattern; the HashMap remark is a
      data-structure point, not an encapsulation signal.
    ref: "concepts.md#pillars-on-the-whiteboard-a-checklist"

  - id: oop-principles-pillars-044
    difficulty: advanced
    tags: [polymorphism, double-dispatch]
    question: |
      Collision handling in a game must vary by BOTH objects' runtime types (Asteroid–Ship
      vs Ship–Ship). Plain overloading `collide(Asteroid a)` / `collide(Ship s)` fails when
      objects are held as GameObject references. Why, and what's the standard remedy?
    options:
      - "Overloads become ambiguous at runtime once objects are GameObject references, so the JVM throws — you must catch it and retry the call"
      - "Java forbids declaring two methods both named collide in one class, so the second overload never compiles in the first place"
      - "The JIT compiler devirtualizes these polymorphic calls incorrectly under load — the remedy is to disable method inlining for the class"
      - "Overload selection uses static types, so GameObject-typed arguments always hit the general overload — use double dispatch (each object calls back with its concrete this), i.e., the Visitor mechanism"
    answer: 3
    explanation: |
      Java dispatches dynamically on the receiver only; arguments are matched by their
      STATIC types at compile time, so collide(gameObjectRef) can never select the
      Asteroid overload. Double dispatch fixes it with two virtual calls:
      a.collideWith(b) then b.collideWithAsteroid(this) — inside collideWith, 'this' has
      its concrete type. That mechanism generalized is the Visitor pattern (see
      dp-visitor).
    ref: "concepts.md#compile-time-vs-runtime-polymorphism"

  - id: oop-principles-pillars-045
    difficulty: intermediate
    tags: [abstraction, follow-ups]
    question: |
      The interviewer points at your single-implementation PricingStrategy interface and
      asks 'why does this interface exist?'. Which answer scores?
    options:
      - "All my classes get an interface as a matter of policy — extracting one for every concrete type is just standard best practice"
      - "It makes the code look more professional and signals to the interviewer that I know enterprise design conventions"
      - "Java's dependency-injection frameworks require an interface before a bean like PricingStrategy can be wired in at all"
      - "Pricing is the axis your requirements flag as changing — flat-rate and weekend pricing are plausible follow-ups, and this seam makes each a one-class addition"
    answer: 3
    explanation: |
      An abstraction is justified by a nameable variation, not by habit. Tying the seam to
      the requirements (or to a likely follow-up) shows judgment; 'best practice' and
      aesthetics signal cargo-culting, and DI works fine with concrete classes. Note the
      honest fallback also scores: if you cannot name a second implementation, concede
      and inline it.
    ref: "concepts.md#common-interview-follow-ups"

  - id: oop-principles-pillars-046
    difficulty: intermediate
    tags: [inheritance, state-vs-subclass]
    question: |
      A candidate models ticket states as subclasses: PaidTicket extends Ticket,
      LostTicket extends PaidTicket. What is the fundamental modeling error?
    options:
      - "An object's class cannot change at runtime, but a ticket's status does — status is state (a field or State-pattern object), not identity, so subclassing forces awkward object replacement on every transition"
      - "LostTicket should extend Ticket directly rather than PaidTicket, since a lost ticket was not necessarily paid first"
      - "Ticket subclasses must be declared abstract in Java whenever the parent Ticket class is itself instantiable"
      - "The subclasses should be renamed TicketPaid and TicketLost to follow the noun-then-adjective naming convention"
    answer: 0
    explanation: |
      Inheritance encodes IDENTITY fixed at construction; a ticket that gets paid is the
      same object with new status. Subclass-per-status means destroying and recreating
      the ticket (losing identity, references, and history) at every transition. Model
      status as an enum field or, when behavior varies richly per status, a composed
      State object (see dp-state). Rearranging the hierarchy doesn't fix the category
      error.
    ref: "concepts.md#inheritance"

  - id: oop-principles-pillars-047
    difficulty: beginner
    tags: [strategy, composition]
    question: |
      Structurally, the Strategy pattern is best described as which combination of pillars?
    options:
      - "Inheritance + encapsulation — the context is subclassed per algorithm and each subclass hides its own private implementation"
      - "An interface for the varying algorithm (polymorphism) + a field holding the chosen implementation (composition)"
      - "Overloading + static factory methods — one overloaded run() per algorithm, selected by a factory at compile time"
      - "Abstraction + reflection — the algorithm class is looked up by name at runtime and instantiated reflectively"
    answer: 1
    explanation: |
      Strategy is not new machinery — it is interface polymorphism (many classes, one
      contract, dynamic dispatch) delivered through composition (the context HAS-A
      strategy, injected and swappable). Seeing patterns as packaged pillar combinations
      makes them easier to derive under pressure than memorizing catalogs. Subclassing
      the context, overloading, and reflection are all non-answers here.
    ref: "concepts.md#strategy-pattern-as-polymorphism-in-action"

  - id: oop-principles-pillars-048
    difficulty: advanced
    tags: [extensibility, design-reasoning]
    question: |
      Follow-up: 'Reserve a spot ahead of arrival.' Your current API returns spots only via
      unmodifiable views, and parking goes through lot.parkVehicle(vehicle). What is the
      cleanest extension consistent with the pillars?
    options:
      - "Expose the mutable spot list so callers can flip a reserved flag on the spot they want directly from the checkout code"
      - "Subclass the lot as ReservableParkingLot and override parkVehicle to special-case the reservation path for arriving cars"
      - "Add lot.reserve(vehicleType, window) returning a Reservation, and have spot allocation honor active reservations inside the existing allocator seam"
      - "Tell the interviewer that reservations are a scheduling concern that belongs in the high-level design round, not here"
    answer: 2
    explanation: |
      The encapsulated design extends by adding intent-revealing behavior: a reserve()
      method and a Reservation entity, with the allocation strategy (already a seam)
      consulting reservations. Callers still never touch spot state directly — tell-don't-
      ask preserved, invariants intact, concurrency containable inside the lot. Leaking
      the list reverses your encapsulation win; subclassing the lot forks it for one
      feature; deferring is wrong — this is a single-machine OO concern.
    ref: "concepts.md#common-interview-follow-ups"
