topic: "Design a Vending Machine"
domain: lld-and-ood
topic_slug: design-vending-machine
version: 1
questions:
  - id: design-vending-machine-001
    difficulty: beginner
    tags: [state-pattern, design-reasoning]
    question: |
      A vending machine must respond differently to insertCoin() depending on whether it is
      idle, already holding money, or currently dispensing. Which design pattern is the
      canonical fit for this requirement?
    options:
      - "Strategy — encapsulate each behavior as an interchangeable algorithm"
      - "Observer — notify interested parties when the machine's mode changes"
      - "State — let the current state object define how each action behaves"
      - "Template Method — define the purchase skeleton and let subclasses fill steps"
    answer: 2
    explanation: |
      Behavior that varies by *what has happened so far* (the machine's phase) is the State
      pattern's exact problem statement: the context delegates each action to its current
      state object, and each concrete state implements the actions legal in that phase.
      Strategy also swaps behavior, but the choice there is made by a client/config, not
      driven by internal lifecycle transitions. Observer and Template Method solve
      unrelated problems (event fan-out, algorithm skeletons).
    ref: "concepts.md#key-design-decisions"

  - id: design-vending-machine-002
    difficulty: beginner
    tags: [requirements, interview-method]
    question: |
      In the first five minutes of a vending machine LLD interview, which clarifying question
      most directly changes the shape of your class model?
    options:
      - "Does the machine accept coins only, or also cards — and must it return change?"
      - "What color should the machine's display be?"
      - "How many machines will the operator deploy nationwide?"
      - "Which cloud provider hosts the telemetry backend?"
    answer: 0
    explanation: |
      Payment methods and change requirements decide whether you need a Payment abstraction,
      a CashRegister with a change-making strategy, and an InsufficientChange error path —
      all structural. Fleet size and telemetry hosting are HLD/system-design concerns to
      scope out explicitly, and display color is irrelevant to the object model.
    ref: "concepts.md#requirements-clarification"

  - id: design-vending-machine-003
    difficulty: beginner
    tags: [money-modeling, correctness]
    question: |
      How should prices and balances be represented in the vending machine model?
    options:
      - "double — currency naturally has decimal points"
      - "float — it uses less memory than double"
      - "String — formatted like \"$1.25\" for easy display"
      - "int cents (or a Money value object) — exact integer arithmetic"
    answer: 3
    explanation: |
      Binary floating point cannot represent most decimal fractions exactly (0.1 + 0.2 !=
      0.3), so accumulating coin values in double/float eventually produces off-by-a-cent
      bugs. Integer cents (or BigDecimal / a Money type) keeps arithmetic exact. Strings
      aren't arithmetic types at all. Saying "money is int cents" early is a cheap signal
      of production maturity in an interview.
    ref: "concepts.md#requirements-clarification"

  - id: design-vending-machine-004
    difficulty: intermediate
    tags: [state-pattern, class-responsibility]
    question: |
      In the State-pattern design, where should the running balance of inserted coins live?
    options:
      - "On HasMoneyState, since that's the state where money exists"
      - "On the VendingMachine context, with states holding behavior only"
      - "In a static field shared by all state classes"
      - "On the Coin enum, as an accumulating counter"
    answer: 1
    explanation: |
      States encapsulate *behavior*; the context owns *data*. If HasMoneyState held the
      balance, the state instance couldn't be shared, and the balance would be lost or
      awkwardly handed off on every transition. Keeping balance on the machine makes every
      concrete state stateless, so one flyweight instance of each can be reused. Static
      fields would break with multiple machines; enums are constants, not accumulators.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-vending-machine-005
    difficulty: intermediate
    tags: [state-machine, modeling]
    question: |
      A slot for "Cola" runs out while other slots still have stock. How should "sold out"
      be modeled in a multi-slot machine?
    options:
      - "A machine-level SoldOutState that all actions check first"
      - "Delete the Slot object from the Inventory map"
      - "A per-slot condition (slot.isEmpty()) checked during product selection"
      - "Transition the machine to Idle and refuse all coins until restocked"
    answer: 2
    explanation: |
      One empty slot must not brick the machine — users can still buy from other slots. So
      sold-out is a property of a Slot, checked in HasMoneyState.selectProduct, not a global
      machine state. A machine-level SoldOutState only makes sense for a single-product
      machine (worth saying which spec you're designing for). Deleting the slot loses its
      code, price, and restock target.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-vending-machine-006
    difficulty: beginner
    tags: [modeling, enums]
    question: |
      Why is Coin best modeled as an enum (NICKEL(5), DIME(10), QUARTER(25), DOLLAR(100))
      rather than a class hierarchy with a subclass per denomination?
    options:
      - "Enums are faster than classes at runtime"
      - "Denominations are a fixed, closed set of values with data but no varying behavior"
      - "Java doesn't allow more than four subclasses of an abstract class"
      - "A hierarchy would prevent adding new denominations later"
    answer: 1
    explanation: |
      Subclassing earns its keep when each variant has different *behavior*. Denominations
      differ only in a data value (cents), and the set is closed and small — the textbook
      profile for an enum with a field. A NickelCoin/DimeCoin hierarchy is ceremony with no
      payoff. (Adding a denomination is one new enum constant either way; option D is
      backwards, and there's no subclass limit.)
    ref: "concepts.md#core-objects-and-entities"

  - id: design-vending-machine-007
    difficulty: intermediate
    tags: [state-pattern, anti-pattern, solid]
    question: |
      Without the State pattern, VendingMachine.insertCoin() would contain a ladder like
      "if (status == IDLE) {...} else if (status == HAS_MONEY) {...} else if ...".
      What is the principal design cost of that approach as the machine grows?
    options:
      - "Every new state or action forces edits across all existing conditional ladders (Open/Closed violation)"
      - "The if-else chain makes the method too slow for hardware timing"
      - "Java switch statements cannot handle more than five cases"
      - "Enum comparison is unreliable across threads"
    answer: 0
    explanation: |
      With N actions and M states, conditionals scatter each state's rules across N methods.
      Adding a MaintenanceState means editing insertCoin, selectProduct, dispense, AND
      cancel — shotgun surgery and an Open/Closed violation. The State pattern inverts this:
      each state class is the single home for that phase's rules, and a new state is a new
      class with existing code untouched. Performance and switch-size claims are fictions.
    ref: "concepts.md#key-design-decisions"

  - id: design-vending-machine-008
    difficulty: intermediate
    tags: [strategy-pattern, change-making]
    question: |
      Why is the change-making algorithm placed behind a ChangeStrategy interface rather
      than hardcoded into CashRegister?
    options:
      - "Interfaces make the code compile faster"
      - "CashRegister must remain immutable, so it cannot contain algorithms"
      - "The State pattern requires every collaborator to be an interface"
      - "Greedy is only optimal for canonical denomination sets, so the algorithm may need swapping per market"
    answer: 3
    explanation: |
      Greedy (largest coin first) is provably optimal for canonical systems like
      {5,10,25,100} but produces suboptimal or failed results for arbitrary sets and can
      dead-end when the float is limited. A market with odd denominations swaps in a
      DP-based strategy without touching CashRegister — the Strategy seam isolates exactly
      the axis that varies. The other options invent rules that don't exist.
    ref: "concepts.md#key-design-decisions"

  - id: design-vending-machine-009
    difficulty: advanced
    tags: [change-making, algorithms, trade-offs]
    question: |
      With denominations {1, 3, 4} and change due of 6, greedy change-making returns
      4+1+1. What does this illustrate for the design?
    options:
      - "Greedy is always wrong and should never ship"
      - "The machine should refuse denominations that break greedy"
      - "Non-canonical coin systems need a different algorithm (e.g., DP), which is why the strategy is pluggable"
      - "Change should be computed on the server, not the machine"
    answer: 2
    explanation: |
      Greedy gives 3 coins where 3+3 (2 coins) is optimal — and with a limited float, greedy
      can fail outright (e.g., the last 4-coin was spent when 3+3 would have worked). This
      is the design justification for ChangeStrategy: the algorithm choice depends on the
      denomination system, so it's a pluggable policy, not a hardcoded loop. Greedy remains
      correct and simplest for canonical systems, so "never ship greedy" overcorrects.
    ref: "concepts.md#key-design-decisions"

  - id: design-vending-machine-010
    difficulty: intermediate
    tags: [edge-cases, ordering, correctness]
    question: |
      A user has inserted $1.50 for a $1.25 product. At what point must the machine verify
      it can make 25 cents of change?
    options:
      - "Before dispensing the product — a dispensed soda cannot be taken back"
      - "After dispensing, while counting out coins"
      - "Only at restock time, by policy"
      - "Never — greedy change always succeeds for US coins"
    answer: 0
    explanation: |
      Dispensing is irreversible. If the machine dispenses first and then discovers its
      float can't produce 25 cents, the user is shortchanged with no remedy. So
      canMakeChange(changeDue) is a guard in HasMoneyState.selectProduct, before any
      transition to Dispensing. And note: "greedy always succeeds" is false with a limited
      float — the register might simply not hold a quarter or smaller coins summing to 25.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-vending-machine-011
    difficulty: beginner
    tags: [state-machine, transitions]
    question: |
      In the machine's state diagram, what happens when insertCoin fires while the machine
      is already in HasMoney?
    options:
      - "Transition to Dispensing immediately"
      - "Stay in HasMoney and add the coin's value to the balance"
      - "Reject the coin — only one coin per transaction"
      - "Transition back to Idle and restart the transaction"
    answer: 1
    explanation: |
      Inserting more money is a self-transition: the balance accumulates and the phase is
      unchanged. Users routinely insert several coins before selecting. Dispensing only
      begins after a valid selectProduct, and rejecting additional coins or resetting would
      make most purchases impossible.
    ref: "concepts.md#state-machine"

  - id: design-vending-machine-012
    difficulty: intermediate
    tags: [state-machine, guards]
    question: |
      Which THREE guards must all pass in HasMoneyState.selectProduct before transitioning
      to Dispensing?
    options:
      - "Slot in stock, balance >= price, register can make the change"
      - "Machine powered, user authenticated, slot code uppercase"
      - "Balance >= price, coin float full, inventory above 50%"
      - "Slot in stock, exact change inserted, no other users nearby"
    answer: 0
    explanation: |
      The transition to Dispensing is legal only when the product exists to dispense (stock),
      the money covers it (balance >= price), and the machine can complete its side of the
      deal (change available for balance - price). Failing any guard keeps the machine in
      HasMoney with an informative error. The other options mix irrelevant or overly strict
      conditions — exact change is a degraded *mode*, not a standing requirement.
    ref: "concepts.md#state-machine"

  - id: design-vending-machine-013
    difficulty: intermediate
    tags: [state-pattern, invariants]
    question: |
      A user presses Cancel while the machine is in DispensingState. Per the design, what
      should happen and why?
    options:
      - "Refund the full balance — the customer is always right"
      - "Refund half the balance as a compromise"
      - "Reject the cancel — the product is already committed and dispensing is not user-interruptible"
      - "Pause dispensing and wait for the user to confirm"
    answer: 2
    explanation: |
      Once the machine transitions to Dispensing, the purchase is committed — inventory is
      being released and change computed. Allowing cancel there would let a user receive the
      product AND a refund. The State pattern makes this invariant structural:
      DispensingState.cancel simply throws. Cancel is legal in HasMoney (full refund of this
      session's coins) and a harmless no-op in Idle.
    ref: "concepts.md#state-machine"

  - id: design-vending-machine-014
    difficulty: intermediate
    tags: [class-relationships, uml]
    question: |
      In the class diagram, VendingMachine-to-Inventory is composition (filled diamond)
      while Slot-to-Product is a plain association. What justifies the difference?
    options:
      - "Inventory is a Map and Maps always compose, Product is a String wrapper"
      - "Composition is used whenever a field is private"
      - "UML requires at least one composition per diagram"
      - "Inventory has no life outside its machine, while a Product is catalog data that outlives any slot"
    answer: 3
    explanation: |
      Composition asserts exclusive ownership and shared lifecycle: destroy the machine and
      its Inventory/CashRegister go with it. A Product (id, name) is shared catalog data —
      many slots in many machines can reference the same product, and it exists
      independently, so a reference (association) is the honest relationship. The
      distinction is about lifecycle semantics, not field visibility or diagram rules.
    ref: "concepts.md#class-diagram"

  - id: design-vending-machine-015
    difficulty: intermediate
    tags: [modeling, pricing]
    question: |
      Why does priceCents live on Slot rather than on Product in this design?
    options:
      - "Products are immutable so they cannot hold a price"
      - "The same product may be sold at different prices in different slots or machines"
      - "Slot is the only class allowed to hold integers"
      - "It reduces the number of getters on Product"
    answer: 1
    explanation: |
      Price is a property of the *offer*, not the item: the same cola can cost 150 cents in
      an airport machine and 100 in an office. Binding price to the slot models this
      directly and makes admin setPrice(slotCode, price) natural. Nothing technically stops
      Product from holding a price — it's a domain-modeling choice you should be able to
      defend when asked.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-vending-machine-016
    difficulty: intermediate
    tags: [state-pattern, flyweight]
    question: |
      Because balance and selection live on the VendingMachine, the concrete state classes
      have no fields. What design benefit does this unlock?
    options:
      - "Each state instance can be shared (a single flyweight or enum constant) rather than allocated per transition"
      - "States can be garbage-collected mid-transaction"
      - "The compiler can inline the state methods"
      - "States can be serialized to JSON without annotations"
    answer: 0
    explanation: |
      Stateless objects are safely shareable: the machine constructs one IdleState, one
      HasMoneyState, one DispensingState and switches references between them — no
      allocation churn, and in Java the states can even be an enum implementing the State
      interface, which gives singleton semantics for free. Compiler inlining and JSON
      serialization are incidental, not the design point.
    ref: "concepts.md#key-design-decisions"

  - id: design-vending-machine-017
    difficulty: intermediate
    tags: [singleton, anti-pattern]
    question: |
      An interviewer asks: "There's only one vending machine, so should VendingMachine be a
      Singleton?" What's the strongest answer?
    options:
      - "Yes — one physical machine means one instance, enforced by the class"
      - "Yes, but use double-checked locking for thread safety"
      - "No — cardinality is the caller's concern: operators run fleets, and singletons hurt testability"
      - "No — Java forbids singletons holding mutable state"
    answer: 2
    explanation: |
      "There happens to be one" is not "there must only ever be one." An operator simulates
      fleets, tests spin up many machines in parallel, and a Singleton bakes global mutable
      state into everything it touches. Instantiate normally and let the composition root
      decide how many exist. Rejecting the reflexive Singleton is a known interviewer probe.
    ref: "concepts.md#key-design-decisions"

  - id: design-vending-machine-018
    difficulty: intermediate
    tags: [api-design, solid, interface-segregation]
    question: |
      The design splits VendingMachineApi (insertCoin, selectProduct, cancel) from AdminApi
      (restock, collectCash, setPrice). Which SOLID principle motivates this split?
    options:
      - "Liskov Substitution — admins must be substitutable for users"
      - "Single Responsibility — every class must have exactly one method"
      - "Dependency Inversion — high-level modules define the interfaces"
      - "Interface Segregation — the button panel shouldn't depend on collectCash()"
    answer: 3
    explanation: |
      ISP says clients shouldn't be forced to depend on methods they don't use. The customer
      panel needs coin/select/cancel; exposing collectCash() to it widens the attack and
      coupling surface for no benefit. Two small role interfaces let each client see only
      its slice. SRP is about reasons to change (not method counts), and LSP/DIP address
      different concerns.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-vending-machine-019
    difficulty: intermediate
    tags: [api-design, error-handling]
    question: |
      How should selectProduct report "you're 25 cents short" in the API design?
    options:
      - "Return null so the caller knows something failed"
      - "Throw a domain exception (or return a Result) carrying the shortfall — no magic values"
      - "Return -25 as an int status code"
      - "Print to the console and continue silently"
    answer: 1
    explanation: |
      InsufficientBalanceException(shortfallCents) — or an equivalent typed Result — names
      the failure and carries the data the display needs. Null and magic ints push
      interpretation onto every caller and invite bugs, and silent logging hides the failure
      from the display entirely. Consistency matters too: pick exceptions or Results and use
      one style across the API.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-vending-machine-020
    difficulty: intermediate
    tags: [code-structure, state-pattern]
    question: |
      In the code skeleton, what is the tell-tale sign that the State pattern is doing its
      job inside the VendingMachine class?
    options:
      - "Its public methods are one-line delegations with zero if/switch on machine status"
      - "It has more private fields than public methods"
      - "All its methods are static"
      - "It implements the State interface itself"
    answer: 0
    explanation: |
      insertCoin(c) is just currentState.insertCoin(this, c) — every piece of "what is legal
      right now" logic lives inside the state classes. If status conditionals creep back
      into the context, the pattern is decorative. The machine implementing State itself
      would conflate context and state roles, and static methods would kill the multiple-
      machine story.
    ref: "concepts.md#code-skeleton"

  - id: design-vending-machine-021
    difficulty: intermediate
    tags: [state-pattern, api-design]
    question: |
      Why does the State interface take the VendingMachine as a method parameter
      (insertCoin(VendingMachine m, Coin c)) instead of each state holding a machine field?
    options:
      - "Java interfaces cannot declare fields on implementors"
      - "It makes the methods easier to name"
      - "Parameter passing keeps state instances stateless, so one shared instance serves any machine"
      - "It avoids circular imports, which Java forbids"
    answer: 2
    explanation: |
      If each state held a machine reference, you'd need one set of state objects per
      machine and careful wiring. Passing the context per call keeps states pure
      behavior — the same three flyweight instances can serve a whole simulated fleet.
      (The GoF book shows both idioms; the parameter-passing one maximizes sharing.)
      Java handles circular references fine, and interfaces not declaring fields doesn't
      prevent implementors from having them.
    ref: "concepts.md#code-skeleton"

  - id: design-vending-machine-022
    difficulty: intermediate
    tags: [state-pattern, transitions]
    question: |
      In this design, who calls machine.setState(next) to perform a transition?
    options:
      - "A background timer thread that polls for changes"
      - "The concrete state itself, after handling an action (GoF state-driven transitions)"
      - "The user, via a public setState on the API"
      - "The Inventory, whenever stock changes"
    answer: 1
    explanation: |
      The standard GoF idiom used here: IdleState.insertCoin adds balance then calls
      m.setState(m.getHasMoneyState()). States know their successors, so the transition
      table reads directly from the state classes. Exposing setState publicly would let
      callers teleport the machine into illegal phases, and Inventory changing machine
      phase would tangle unrelated responsibilities.
    ref: "concepts.md#key-design-decisions"

  - id: design-vending-machine-023
    difficulty: advanced
    tags: [extensibility, payment, open-closed]
    question: |
      The interviewer asks you to add card payment. Which change preserves Open/Closed for
      the existing states?
    options:
      - "Add if (isCardPayment) branches inside each state method"
      - "Create CardVendingMachine extending VendingMachine and override everything"
      - "Rewrite HasMoneyState as CardOrCoinState with a mode flag"
      - "Introduce a PaymentMethod abstraction (authorize/capture/refund) that states consult instead of the coin balance"
    answer: 3
    explanation: |
      The states' real dependency is "does the payment cover the price?" — abstract that as
      PaymentMethod and CoinPayment/CardPayment both satisfy it. Card purchases capture the
      exact price and skip change-making. No state class is rewritten; new payment types are
      new classes. Branching inside states or forking the machine class reintroduces the
      conditional sprawl the design exists to avoid.
    ref: "concepts.md#extensibility"

  - id: design-vending-machine-024
    difficulty: intermediate
    tags: [extensibility, observer]
    question: |
      For "remote inventory monitoring," the design has Inventory publish SlotLevelChanged
      events to subscribed listeners. Why Observer here rather than having Inventory call
      the telemetry service directly?
    options:
      - "Observer batches network calls for efficiency"
      - "Inventory stays ignorant of who consumes its events, so adding restock alerts or dashboards means adding listeners, not editing Inventory"
      - "Direct calls are impossible from inside a Map-backed class"
      - "The State pattern requires Observer as a companion"
    answer: 1
    explanation: |
      The win is decoupling on the publisher side: Inventory emits facts about itself and
      doesn't know whether one listener or ten exist. TelemetryListener,
      RestockAlertListener, and a future DisplayUpdater all subscribe without touching
      Inventory. Fleet-scale aggregation of those events is HLD — note the boundary and
      point at system-design. (Pattern mechanics live in dp-behavioral-observer.)
    ref: "concepts.md#extensibility"

  - id: design-vending-machine-025
    difficulty: intermediate
    tags: [extensibility, state-pattern]
    question: |
      Adding a MaintenanceState (all user actions rejected while a technician services the
      machine) requires which changes to the existing code?
    options:
      - "One new State implementation plus the transitions into/out of it — existing states untouched"
      - "Editing every existing state to check a maintenance flag"
      - "A new subclass of VendingMachine with overridden public methods"
      - "A global boolean checked at the top of each public machine method"
    answer: 0
    explanation: |
      This is the State pattern's payoff moment: MaintenanceState implements State, rejects
      insertCoin/selectProduct/dispense/cancel, and the admin API gains
      enterMaintenance()/exitMaintenance() transitions. IdleState and friends are not
      edited. Flags and subclass forks both smear the new mode's logic across existing
      code — precisely the shotgun surgery the pattern prevents.
    ref: "concepts.md#extensibility"

  - id: design-vending-machine-026
    difficulty: intermediate
    tags: [extensibility, strategy-pattern, pricing]
    question: |
      "Add happy-hour discounts: 20% off between 2-4pm." Which seam handles this with the
      least disruption?
    options:
      - "Hardcode a time check inside HasMoneyState.selectProduct"
      - "Create DiscountedSlot subclasses for each discounted slot"
      - "A PricingStrategy consulted where price is read, mirroring the ChangeStrategy seam"
      - "Have the admin manually run setPrice twice a day"
    answer: 2
    explanation: |
      Pricing policy is an algorithm that varies independently of the machine's mechanics —
      the same Strategy reasoning as change-making. int price(Slot, Context) with a default
      pass-through strategy and a HappyHourStrategy keeps time logic out of states and slots.
      Subclassing slots conflates data with policy, and manual repricing is an operational
      hack, not a design.
    ref: "concepts.md#extensibility"

  - id: design-vending-machine-027
    difficulty: advanced
    tags: [concurrency, trade-offs]
    question: |
      For thread safety, the design recommends a single coarse lock (synchronized public
      methods) over per-slot fine-grained locking. Why is coarse locking the RIGHT call here
      rather than a lazy one?
    options:
      - "Fine-grained locking is impossible with enum-based coins"
      - "Coarse locks are always faster than fine-grained locks"
      - "The JVM optimizes synchronized blocks away entirely"
      - "Contention is negligible at vending-machine throughput, so the simpler design that's obviously correct wins"
    answer: 3
    explanation: |
      Lock granularity is a trade of complexity for throughput. A physical machine serves
      one user at a time with occasional background reads — there is no throughput problem
      to solve, so buying complexity (lock ordering, deadlock risk across slot+register)
      gains nothing. Matching the concurrency design to the actual load, and saying why,
      is what scores points; fine-grained locking here is over-engineering.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-vending-machine-028
    difficulty: advanced
    tags: [edge-cases, hardware, correctness]
    question: |
      Real machines decrement inventory only after the drop sensor confirms the product
      fell. What failure mode does this ordering protect against?
    options:
      - "A user inserting counterfeit coins"
      - "A hardware jam where the product never releases — inventory would show one fewer item than the machine holds"
      - "Two users selecting simultaneously"
      - "The change strategy running out of quarters"
    answer: 1
    explanation: |
      If you deduct on selection and the spiral jams, the model says "sold" while the item
      sits in the machine: the user paid for nothing and restock counts drift. Deducting on
      confirmed drop keeps the model synced to physical truth, and a DispenseFailed path can
      refund and flag maintenance. Counterfeit coins, concurrency, and change floats are
      real concerns but orthogonal to this ordering.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-vending-machine-029
    difficulty: advanced
    tags: [edge-cases, persistence]
    question: |
      To survive a power failure mid-transaction, what does the design persist, and when?
    options:
      - "A small snapshot (current state name, balance, selected slot) written after each transition"
      - "A full heap dump every second"
      - "Nothing — RAM contents survive power cycles"
      - "Only the total sales figure, at end of day"
    answer: 0
    explanation: |
      The recoverable essence of a transaction is tiny: which phase, how much money, which
      slot. Journaling it to non-volatile storage on each transition lets boot logic either
      resume or refund-and-reset — a Memento-style snapshot. Heap dumps are absurdly heavy
      and RAM does not survive power loss. In the interview, *mentioning* this persistence
      point matters more than implementing it.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-vending-machine-030
    difficulty: intermediate
    tags: [edge-cases, ux]
    question: |
      A user selects a sold-out slot while in HasMoney. What should the machine do?
    options:
      - "Transition to Dispensing and release nothing"
      - "Refund everything and force the user to start over"
      - "Report the error and stay in HasMoney so the user can pick another slot without re-inserting money"
      - "Silently substitute the cheapest in-stock product"
    answer: 2
    explanation: |
      The user's money is still valid — only their selection failed. Staying in HasMoney
      preserves the balance and lets them choose again or cancel for a refund on their own
      terms. Forcing a refund/restart punishes the user for the machine's stock situation,
      and substituting products or dispensing nothing are correctness failures.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-vending-machine-031
    difficulty: beginner
    tags: [state-machine, lifecycle]
    question: |
      After a successful dispense (product released, change returned), what must happen
      before the next customer?
    options:
      - "The machine stays in Dispensing until an admin resets it"
      - "Balance and selection reset, and the machine transitions back to Idle"
      - "The machine transitions to HasMoney to speed up the next sale"
      - "The Inventory object is rebuilt from scratch"
    answer: 1
    explanation: |
      Every terminal path of a transaction — successful purchase or cancel — must reset the
      per-transaction data (balance to zero, selectedSlot to null) and return to Idle.
      Leaking a previous customer's residual balance into the next session is a classic bug
      when the reset is scattered instead of owned by the dispense/cancel completion logic.
    ref: "concepts.md#state-machine"

  - id: design-vending-machine-032
    difficulty: intermediate
    tags: [design-reasoning, factory-pattern]
    question: |
      The topic notes that a StateFactory "collapses into constants" in this design. What
      is the underlying lesson about pattern usage in interviews?
    options:
      - "Factories are deprecated in modern Java"
      - "State and Factory can never be combined"
      - "Every pattern in the GoF book should appear somewhere in a good design"
      - "Knowing when a pattern is NOT needed (states are stateless flyweights, so no creation logic exists) is itself a signal of maturity"
    answer: 3
    explanation: |
      A factory earns its place when construction involves variation or wiring. Here the
      three states are stateless shared instances created once — there is nothing for a
      factory to decide, so adding one is ceremony. Interviewers notice candidates who
      name-drop patterns to fill space; explicitly declining a pattern with a reason scores
      higher than reflexively applying it.
    ref: "concepts.md#key-design-decisions"

  - id: design-vending-machine-033
    difficulty: intermediate
    tags: [class-responsibility, srp]
    question: |
      Which responsibility assignment below VIOLATES single responsibility in this design?
    options:
      - "CashRegister tracks the coin float and produces change"
      - "Inventory owns the slot map and stock mutations"
      - "HasMoneyState formats the display text, applies discounts, and logs telemetry alongside its selection logic"
      - "Slot knows its code, product, quantity, and price"
    answer: 2
    explanation: |
      A state class's single job is deciding what each user action does in that phase.
      Display formatting, pricing policy, and telemetry are three additional reasons for it
      to change — those belong to a Display observer, a PricingStrategy, and an event
      listener respectively. The other three assignments are cohesive: each class owns one
      tight cluster of data and the operations on it.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-vending-machine-034
    difficulty: intermediate
    tags: [boundaries, hld-vs-lld]
    question: |
      The interviewer asks "now scale this to 10,000 machines with a live inventory
      dashboard." What is the best response in an LLD round?
    options:
      - "Recognize the shift to HLD — outline event streaming/aggregation in a sentence and note the single-machine OO design already publishes the needed events"
      - "Start drawing Kafka partitions and consumer groups in detail"
      - "Say scaling is impossible with the State pattern"
      - "Refuse to answer because it's out of scope"
    answer: 0
    explanation: |
      Detecting the domain boundary is part of the test. The right move is one crisp
      sentence — machines publish inventory events (the Observer seam already exists),
      a backend aggregates them — then anchor back to the LLD artifacts. Deep-diving
      distributed infrastructure burns your remaining LLD time, and refusing outright
      wastes an easy chance to show you know where the boundary is.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-vending-machine-035
    difficulty: advanced
    tags: [change-making, correctness]
    question: |
      Why can canMakeChange(25) return false even for standard US denominations where
      greedy is provably optimal?
    options:
      - "Integer overflow at 25 cents"
      - "Optimality proofs assume unlimited coins, but the register's physical float may simply lack a quarter or coins summing to 25"
      - "Greedy algorithms cannot compute equality checks"
      - "canMakeChange is only defined for amounts above one dollar"
    answer: 1
    explanation: |
      "Greedy is optimal for canonical systems" is a statement about unlimited coin supply.
      A real register holds a finite float: if it has no quarters, one dime, and one nickel,
      then 25 cents is unmakeable regardless of algorithm. This is why canMakeChange must
      consult actual per-denomination counts, and why the guard runs before dispensing —
      the arithmetic answer and the physical answer can differ.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-vending-machine-036
    difficulty: intermediate
    tags: [testing, state-pattern]
    question: |
      Which property makes the concrete state classes especially easy to unit test?
    options:
      - "They inherit test cases from the State interface"
      - "They can only be tested through the physical hardware"
      - "They are stateless — each method is a pure function of (machine context, input), so tests just stub the machine and assert transitions/effects"
      - "The JVM auto-generates tests for enum-based states"
    answer: 2
    explanation: |
      Because all mutable data lives on the context, a test constructs a machine (or mock)
      in a known configuration, invokes one state method, and asserts the resulting
      setState call, balance change, or thrown exception. No hidden fields, no setup
      ordering. Pair this with property tests on ChangeStrategy (returned coins sum to the
      amount and exist in the float) for strong coverage cheaply.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-vending-machine-037
    difficulty: intermediate
    tags: [edge-cases, timeout]
    question: |
      A user inserts 75 cents and walks away. How does the design handle this?
    options:
      - "The next customer inherits the 75-cent balance"
      - "The machine keeps the money after 30 seconds as a fee"
      - "The machine transitions to Dispensing and picks a product costing 75 cents"
      - "A session timer fires cancel() after N minutes — refund to the coin return, back to Idle"
    answer: 3
    explanation: |
      An abandoned session must terminate deterministically. Reusing the existing cancel()
      path (refund inserted coins, reset, Idle) means the timeout adds no new state logic —
      just a timer that invokes an existing legal action. Letting balance leak to the next
      customer is a correctness bug, and confiscating money or auto-purchasing invents
      policies no operator wants.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-vending-machine-038
    difficulty: beginner
    tags: [entities, responsibilities]
    question: |
      In the entity model, what is CashRegister's responsibility?
    options:
      - "Tracking the machine's own per-denomination coin float and producing change via its ChangeStrategy"
      - "Deciding which state the machine transitions to next"
      - "Storing the product catalog and slot codes"
      - "Rendering the price display to the user"
    answer: 0
    explanation: |
      CashRegister owns the machine's money: it accepts inserted coins into the float,
      answers canMakeChange(cents), and produces physical coins for change by delegating
      the algorithm to ChangeStrategy. State transitions belong to the states/context,
      catalog data to Inventory/Slot, and display to whatever UI observes the machine.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-vending-machine-039
    difficulty: intermediate
    tags: [state-machine, diagramming]
    question: |
      Why does the topic recommend drawing the stateDiagram BEFORE writing any state
      classes?
    options:
      - "Mermaid diagrams compile into Java code"
      - "Interviewers deduct points for code written first"
      - "The diagram IS the behavioral spec — each arrow becomes exactly one setState call, so the code can be checked against it transition by transition"
      - "State classes cannot be named until the diagram exists"
    answer: 2
    explanation: |
      The diagram enumerates states, events, guards, and transitions in one glance — it
      surfaces missing cases (what does cancel do in Idle?) before they become code bugs.
      Then implementation is mechanical: every arrow maps to a setState call inside a state
      method, and every absent arrow maps to a rejection. It also gives the interviewer a
      shared artifact to probe, which structures the conversation in your favor.
    ref: "concepts.md#state-machine"

  - id: design-vending-machine-040
    difficulty: intermediate
    tags: [extensibility, ui]
    question: |
      The interviewer says "now the machine gets a touch screen instead of buttons." Why
      does the existing design absorb this cheaply?
    options:
      - "Touch screens use the same voltage as buttons"
      - "The machine exposes a UI-agnostic API (insertCoin, selectProduct, cancel) — any input device is just another driver of the same methods"
      - "The State pattern includes a built-in rendering engine"
      - "Slots can be re-sorted alphabetically for touch layout"
    answer: 1
    explanation: |
      Because states and machine expose behavior through a device-neutral API and never
      render UI themselves, swapping buttons for a touch screen (or a mobile app, or a test
      harness) changes only the adapter that calls the API. If the question makes you
      wince, it means display logic leaked into your states — which is exactly what the
      interviewer is probing for.
    ref: "concepts.md#extensibility"

  - id: design-vending-machine-041
    difficulty: advanced
    tags: [state-pattern, trade-offs]
    question: |
      "Why not just use an enum status field with a switch in each method — isn't the State
      pattern overkill?" What is the honest senior-level answer?
    options:
      - "The pattern is always mandatory once you have two states"
      - "Switches are slower than virtual dispatch on modern JVMs"
      - "Enums cannot represent more than a handful of states"
      - "For a tiny action-state matrix a switch is fine; the pattern wins as the matrix grows because each state's rules localize into one class and new states don't edit existing code"
    answer: 3
    explanation: |
      Senior candidates argue the crossover, not the dogma. With 4 actions and 3+ states
      (plus Maintenance, ExactChangeOnly... coming), switch ladders scatter each state's
      behavior across every method and each addition edits all of them. The pattern
      restructures that matrix by state. Performance differences are noise, and Java enums
      can even implement the pattern themselves (enum-with-behavior).
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-vending-machine-042
    difficulty: intermediate
    tags: [payment, change-making, extensibility]
    question: |
      When card payment is added via the PaymentMethod abstraction, what happens to
      change-making for card purchases?
    options:
      - "The card is charged the nearest round dollar and coins make up the difference"
      - "It's skipped entirely — the card captures the exact price, so no change is due"
      - "Change is credited as a coupon printed by the machine"
      - "The ChangeStrategy computes change and mails it to the user"
    answer: 1
    explanation: |
      Cards authorize then capture an exact amount — there is no inserted-cash overage to
      return. This is why the abstraction is authorize(amount)/capture()/refund() rather
      than a balance accumulator: CoinPayment tracks inserted value and triggers change,
      CardPayment captures price exactly. The change-making path simply doesn't activate,
      with no special-casing inside the states.
    ref: "concepts.md#extensibility"

  - id: design-vending-machine-043
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      Which concern should you explicitly scope OUT of the 45-minute vending machine LLD
      and name as belonging to another interview round?
    options:
      - "How the machine returns change"
      - "What happens when a slot is empty"
      - "Distributed fleet management and payment-gateway integration internals"
      - "Whether a user can cancel and get a refund"
    answer: 2
    explanation: |
      Fleet telemetry pipelines and gateway integrations are distributed-systems (HLD)
      material — naming them and setting them aside shows judgment and protects your time
      budget. Change-making, sold-out handling, and cancellation are core single-machine
      behaviors the interviewer expects your object model to cover.
    ref: "concepts.md#requirements-clarification"

  - id: design-vending-machine-044
    difficulty: intermediate
    tags: [class-relationships, state-pattern, uml]
    question: |
      In the diagram, why is VendingMachine-to-State drawn as a reference (o-->) rather
      than composition, even though the machine always has a current state?
    options:
      - "Mermaid does not support composition arrows to interfaces"
      - "State is an interface and interfaces cannot be composed"
      - "It's a drawing mistake — composition would be equally correct"
      - "The machine points at shared flyweight state instances it does not own — many machines could reference the same IdleState object"
    answer: 3
    explanation: |
      Composition asserts exclusive ownership and lifecycle binding. The current-state field
      is a rotating pointer into a set of shared, stateless instances — the machine doesn't
      create-and-destroy a state per transition, and conceptually the same instances could
      serve any machine. An aggregation/association arrow states that honestly. (If states
      were stateful and per-machine, composition would become defensible.)
    ref: "concepts.md#class-diagram"

  - id: design-vending-machine-045
    difficulty: advanced
    tags: [edge-cases, policy, design-reasoning]
    question: |
      The register's float is running low. Besides rejecting sales that need change, what
      alternative POLICY does the topic suggest, and what does choosing between them
      demonstrate?
    options:
      - "An 'exact change only' mode — and that error handling is a product policy decision worth surfacing to the interviewer, not just a throw statement"
      - "Overcharging users slightly until the float recovers"
      - "Dispensing IOUs redeemable at the next purchase"
      - "Shutting the machine down until a technician arrives"
    answer: 0
    explanation: |
      Real machines display "EXACT CHANGE ONLY" and keep selling to users who insert the
      precise price — strictly better for revenue than refusing all change-requiring sales.
      Presenting both options (reject-and-refund vs degraded mode) and asking which the
      interviewer prefers demonstrates that you see error paths as product decisions with
      trade-offs, not just exception plumbing. Overcharging and IOUs fail basic fairness;
      full shutdown is needlessly drastic.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-vending-machine-046
    difficulty: intermediate
    tags: [code-structure, encapsulation]
    question: |
      In the skeleton, setState/addBalance/resetBalance are package-private while
      insertCoin/selectProduct/cancel are public. What does this visibility split enforce?
    options:
      - "It reduces the compiled bytecode size"
      - "Only states (collaborators inside the package) may mutate machine internals — external callers can act on the machine solely through user-level actions"
      - "Package-private methods run faster than public ones"
      - "It is required for the enum-based Coin to compile"
    answer: 1
    explanation: |
      If setState were public, any caller could teleport the machine to Dispensing without
      passing the guards — the state machine's invariants would be advisory. Restricting
      mutators to the states' package means every transition flows through a state method
      that enforced its guards first. It's encapsulation applied to the state machine
      itself: the public API is actions, not internals.
    ref: "concepts.md#code-skeleton"

  - id: design-vending-machine-047
    difficulty: beginner
    tags: [state-machine, transitions]
    question: |
      What should cancel() do when the machine is in IdleState?
    options:
      - "Throw a fatal exception and require a restart"
      - "Transition to HasMoney to await coins"
      - "Refund the previous customer's purchase price"
      - "Return an empty refund — there is nothing to cancel, and the machine stays in Idle"
    answer: 3
    explanation: |
      No money has been inserted, so there is nothing to undo: the skeleton returns an
      empty coin list and stays in Idle — a graceful no-op. This is a nice example of how
      writing the state diagram first surfaces "trivial" cells of the action-state matrix
      (cancel-in-Idle) that conditional-ladder designs typically forget until they crash.
    ref: "concepts.md#code-skeleton"

  - id: design-vending-machine-048
    difficulty: advanced
    tags: [concurrency, design-reasoning]
    question: |
      A remote restock command arrives over the network while a purchase is mid-flight.
      Under the recommended concurrency design, what prevents a race on Inventory?
    options:
      - "Both the purchase and the restock serialize through the machine's single coarse lock (or its command queue)"
      - "Restocks are physically impossible while a user stands at the machine"
      - "Inventory uses a lock-free skip list internally"
      - "The State pattern makes all operations atomic automatically"
    answer: 0
    explanation: |
      The design's honest concurrency story: user actions are physically serial, so the only
      real races come from background/remote operations. Routing every mutation — user
      actions AND admin commands — through one lock or a single-threaded command queue makes
      interleaving impossible by construction. The State pattern provides no atomicity by
      itself, and exotic lock-free structures are exactly the over-engineering the topic
      warns against.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-vending-machine-049
    difficulty: intermediate
    tags: [state-pattern, java, enums]
    question: |
      The topic mentions modeling State as a Java enum implementing the interface methods.
      What does the enum approach buy over plain singleton classes?
    options:
      - "Enums allow states to hold per-transaction balance safely"
      - "Guaranteed single instances, serialization safety, and the ability to switch exhaustively over all states — with less boilerplate"
      - "Enum states transition automatically without setState calls"
      - "It removes the need for a State interface entirely in all designs"
    answer: 1
    explanation: |
      enum MachineState implements State { IDLE {...}, HAS_MONEY {...}, DISPENSING {...} }
      gives language-enforced singletons (no reflection or serialization loopholes), and
      tooling can verify exhaustive handling. It works precisely BECAUSE the states are
      stateless — an enum constant must not hold per-transaction data (option A inverts the
      rule). Transitions still require explicit setState; the enum is an implementation
      vehicle, not new semantics.
    ref: "concepts.md#key-design-decisions"

  - id: design-vending-machine-050
    difficulty: intermediate
    tags: [api-design, two-phase]
    question: |
      The design notes selectProduct could either complete the whole purchase or leave a
      separate dispense() step. When is the explicit two-phase version the better API?
    options:
      - "When the product price exceeds one dollar"
      - "Never — single-phase is strictly superior"
      - "When the hardware needs a confirm/handshake between commitment and physical release (or the UI wants a confirmation screen)"
      - "When the machine has more than 26 slots"
    answer: 2
    explanation: |
      Single-phase (selectProduct drives dispense internally) matches how real machines
      feel to users and keeps the API minimal. Two-phase earns its place when something
      must happen between commitment and release — a hardware handshake, a "confirm
      purchase?" screen, or a payment capture that can fail. The design point is to state
      the choice and its trigger, not to claim one is universally right.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-vending-machine-051
    difficulty: intermediate
    tags: [boundaries, cross-reference]
    question: |
      Per this library's domain boundaries, how deeply should you explain the internals of
      the coin-change dynamic-programming algorithm during the vending machine LLD?
    options:
      - "Name it as the pluggable ChangeStrategy alternative and note that algorithm internals are dsa-coding territory — the LLD point is the seam"
      - "Derive the full DP recurrence on the whiteboard before drawing classes"
      - "Skip change-making entirely since it's an algorithm"
      - "Implement both greedy and DP fully to prove competence"
    answer: 0
    explanation: |
      The LLD round rewards knowing WHERE the algorithm plugs in (Strategy interface), WHEN
      greedy suffices (canonical denominations, ample float), and WHY you'd swap it. Burning
      ten minutes on a DP derivation trades class-design signal for algorithm signal the
      interviewer isn't scoring here. But skipping change-making entirely misses a core
      requirement — cover the design, reference the algorithm.
    ref: "concepts.md#key-design-decisions"

  - id: design-vending-machine-052
    difficulty: beginner
    tags: [entities, hardware-abstraction]
    question: |
      The skeleton gives VendingMachine a DispenserHardware collaborator with
      releaseProduct and returnCoins. What is the design value of this abstraction?
    options:
      - "It makes the machine start up faster"
      - "Hardware effects sit behind an interface, so the whole state machine can run and be tested with a fake dispenser — no physical machine needed"
      - "It encrypts communication with the coin mechanism"
      - "It allows slots to contain liquid products"
    answer: 1
    explanation: |
      Isolating physical side effects (motor spins, coin tray) behind an interface is a
      ports-and-adapters move: the domain logic — states, guards, transitions, change
      math — becomes fully testable with a FakeDispenser that records calls. It also gives
      the DispenseFailed path a natural home when the drop sensor doesn't fire. The other
      options are irrelevant to the abstraction.
    ref: "concepts.md#code-skeleton"
