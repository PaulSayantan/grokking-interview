topic: "Design an Elevator System"
domain: lld-and-ood
topic_slug: design-elevator-system
version: 1
questions:
  - id: design-elevator-system-001
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      In the first five minutes of "Design an Elevator System", which clarification
      most directly shapes the overall class structure?
    options:
      - "What color are the elevator doors and how fast do they close?"
      - "Are there two request types — hall calls with (floor, direction) and cabin calls with (destination)?"
      - "Which cloud provider will host the elevator fleet management service?"
      - "What programming language should the implementation use?"
    answer: 1
    explanation: |
      The external-vs-internal request split drives the whole design: hall calls are
      dispatched by the controller across the fleet, while cabin calls are bound to one
      car. Door speed is physical detail, cloud hosting is HLD scope, and language
      choice doesn't change the object model.
    ref: "concepts.md#requirements-clarification"

  - id: design-elevator-system-002
    difficulty: beginner
    tags: [requirements, scoping, boundaries]
    question: |
      The interviewer asks "how would this work across 50 buildings on a campus?"
      during an LLD elevator round. What is the best move?
    options:
      - "Redesign the classes to include a BuildingCluster and network replication logic"
      - "Explain that request queues must move to a distributed message broker and detail the partitioning"
      - "Acknowledge it as a high-level-design concern (controller per building plus a coordination layer) and keep the LLD single-building"
      - "Refuse to answer because it is out of scope"
    answer: 2
    explanation: |
      LLD rounds are about single-process OO design. The strong answer names the shape
      of the distributed solution in one sentence and explicitly defers it to HLD,
      rather than derailing the class design or stonewalling.
    ref: "concepts.md#requirements-clarification"

  - id: design-elevator-system-003
    difficulty: beginner
    tags: [entities, responsibilities]
    question: |
      In a multi-elevator design, which decision belongs to the ElevatorSystem
      (controller) rather than to an individual Elevator?
    options:
      - "Whether the door must be closed before moving"
      - "Which of its own pending stops to serve next"
      - "When to transition from DOOR_OPEN back to MOVING_UP"
      - "Which elevator in the fleet should serve a new hall call"
    answer: 3
    explanation: |
      The controller makes the inter-elevator decision (assign a hall call to a car);
      each elevator makes intra-elevator decisions (next stop, state transitions, door
      safety). Splitting these two decision levels is the core structural choice of
      the design.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-elevator-system-004
    difficulty: intermediate
    tags: [entities, srp]
    question: |
      A candidate puts the nearest-car selection logic inside the HallButton class,
      so pressing the button loops over elevators and picks one. What is the main
      design problem?
    options:
      - "Buttons should be interfaces, not concrete classes"
      - "A button's responsibility is to emit a request; scheduling is the controller's job, so this violates SRP and duplicates dispatch logic across every button"
      - "The loop over elevators is O(n) and therefore too slow"
      - "HallButton cannot access elevator state because of package visibility"
    answer: 1
    explanation: |
      Buttons translate a press into a Request and hand it off. Embedding dispatch in
      buttons scatters scheduling across hundreds of button instances, makes the policy
      impossible to swap in one place, and violates the Single Responsibility
      Principle. Performance and visibility are not the real issue.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-elevator-system-005
    difficulty: beginner
    tags: [class-relationships, composition]
    question: |
      What is the correct relationship between Elevator and Door in this design?
    options:
      - "Composition — the elevator owns its door; the door's lifecycle is bound to the car"
      - "Inheritance — Door extends Elevator to reuse movement code"
      - "Association via a shared DoorPool that all elevators borrow from"
      - "The Door should be a static utility class with open and close methods"
    answer: 0
    explanation: |
      A door is a part of exactly one car and does not outlive it — that is
      composition. Inheritance fails "is-a" (a door is not an elevator), a shared pool
      is physically meaningless, and a static utility can't hold per-door state.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-elevator-system-006
    difficulty: intermediate
    tags: [class-relationships, aggregation, strategy]
    question: |
      The class diagram shows ElevatorSystem with a hollow-diamond (aggregation) link
      to SchedulingStrategy but a filled-diamond (composition) link to its Elevators.
      Why the difference?
    options:
      - "Aggregation is used because SchedulingStrategy is an interface and interfaces cannot be composed"
      - "It is arbitrary — the two diamonds are interchangeable in UML"
      - "Elevators are heavier objects, and UML requires composition for large objects"
      - "The strategy is a swappable collaborator with independent lifecycle, while the elevators are intrinsic parts the system creates and owns"
    answer: 3
    explanation: |
      The strategy can be replaced at runtime (setStrategy) and could be shared or
      exist independently — aggregation. The elevator objects are created, owned, and
      managed by the system for its whole life — composition. The distinction encodes
      lifecycle and ownership, not object size or interface-ness.
    ref: "concepts.md#class-diagram"

  - id: design-elevator-system-007
    difficulty: beginner
    tags: [patterns, strategy]
    question: |
      Which pattern should encapsulate the "which elevator serves this hall call?"
      algorithm, and why?
    options:
      - "Decorator, because dispatch policies wrap each other in layers"
      - "Strategy, because the selection policy varies (nearest-car, zoned, destination dispatch) while the surrounding machinery stays stable"
      - "Template Method, because every algorithm shares the same fixed skeleton of steps"
      - "Singleton, because there must be only one algorithm at a time"
    answer: 1
    explanation: |
      The dispatch policy is a family of interchangeable algorithms behind one
      interface — the textbook Strategy fit. Template Method would hard-wire an
      inheritance hierarchy for what is really whole-algorithm substitution, and
      "only one active at a time" is a field assignment, not Singleton.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-elevator-system-008
    difficulty: intermediate
    tags: [patterns, state]
    question: |
      Instead of an ElevatorState enum or State pattern, a candidate uses three
      booleans: isMoving, isDoorOpen, goingUp. What is the strongest objection?
    options:
      - "Booleans consume more memory than an enum"
      - "Java does not allow three boolean fields in one class"
      - "The booleans admit invalid combinations (moving with the door open) that an explicit state type makes unrepresentable"
      - "Booleans cannot be read by the Observer pattern"
    answer: 2
    explanation: |
      Three booleans yield 8 combinations, several of which are nonsense. An explicit
      state (enum or State pattern) reduces the space to exactly the legal states and
      gives one place to enforce transition rules. Memory and syntax objections are
      not real, and observers can read any field type.
    ref: "concepts.md#elevator-state-machine"

  - id: design-elevator-system-009
    difficulty: intermediate
    tags: [state-machine, transitions]
    question: |
      Why does the elevator state machine forbid a direct MOVING_UP to MOVING_DOWN
      transition?
    options:
      - "Because the State pattern only permits transitions to adjacent enum values"
      - "Because reversing requires notifying observers twice, which is expensive"
      - "Because UML stateDiagram-v2 cannot render bidirectional arrows"
      - "A reversal mid-flight is physically meaningless and funneling reversals through DOOR_OPEN or IDLE keeps the LOOK decision in one method"
    answer: 3
    explanation: |
      A real car cannot reverse without stopping, and allowing it in the model creates
      direction thrashing when opposing requests arrive. Requiring the reversal to
      pass through DOOR_OPEN/IDLE means chooseDirection() is the single place the
      sweep-or-reverse (LOOK) decision is made.
    ref: "concepts.md#elevator-state-machine"

  - id: design-elevator-system-010
    difficulty: beginner
    tags: [patterns, observer]
    question: |
      Cabin displays, per-floor displays, and a monitoring dashboard all need the
      elevator's current floor and direction. Which pattern decouples the elevator
      from these consumers?
    options:
      - "Observer — the elevator notifies registered listeners on state change, unaware of how many exist"
      - "Facade — displays call a simplified interface over the elevator"
      - "Adapter — each display adapts the elevator's interface to its own"
      - "Memento — the elevator saves snapshots that displays restore"
    answer: 0
    explanation: |
      One subject, many views that must react to changes, with the subject ignorant of
      its viewers: that is Observer. Adding a new dashboard is one more subscriber and
      zero elevator changes. Facade/Adapter address interface shape, not change
      notification, and Memento is for undo/rollback.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-elevator-system-011
    difficulty: intermediate
    tags: [algorithms, look, scan]
    question: |
      What distinguishes LOOK from SCAN in elevator scheduling?
    options:
      - "LOOK serves requests in strict arrival order, SCAN sorts them by floor"
      - "LOOK reverses at the last pending stop in the current direction, while SCAN travels to the end of the shaft before reversing"
      - "SCAN uses two queues while LOOK uses a single priority heap"
      - "LOOK is preemptive and SCAN is non-preemptive"
    answer: 1
    explanation: |
      Both sweep in one direction servicing stops. SCAN goes all the way to the
      terminal floor even with no pending stops there; LOOK reverses (or idles) at the
      furthest actual request, saving wasted travel with the same fairness. Neither is
      FCFS, and the data structure choice is an implementation detail.
    ref: "concepts.md#dispatching-algorithms-scan-look-nearest-car"

  - id: design-elevator-system-012
    difficulty: intermediate
    tags: [algorithms, fairness, starvation]
    question: |
      A pure "always serve the nearest pending floor" (SSTF-style) policy has a known
      failure mode in busy buildings. What is it?
    options:
      - "It requires O(n log n) time per decision, which is too slow"
      - "It cannot handle requests for the current floor"
      - "Requests at far floors can starve indefinitely while the car ping-pongs among busy nearby floors"
      - "It only works when the number of elevators is odd"
    answer: 2
    explanation: |
      Nearest-first keeps choosing close floors, so a lone request at a distant floor
      may never win. LOOK's directional sweep guarantees every floor is eventually
      passed and served. The complexity is trivial either way — fairness, not speed,
      is the issue.
    ref: "concepts.md#dispatching-algorithms-scan-look-nearest-car"

  - id: design-elevator-system-013
    difficulty: intermediate
    tags: [algorithms, look, direction]
    question: |
      An elevator is at floor 3 moving UP. A hall call comes from floor 7 with
      direction DOWN. Under a correct LOOK implementation, what happens?
    options:
      - "The call is rejected because the directions conflict"
      - "The car immediately reverses to prioritize the DOWN call"
      - "The car stops at 7 on its way up and the passenger boards a car going the wrong way"
      - "The call is queued to be served on the car's downward sweep, after upward stops are exhausted"
    answer: 3
    explanation: |
      The direction-pickup rule: a car moving UP picks up only UP hall calls ahead of
      it. A DOWN call above is served when the car reverses, so the passenger boards a
      car actually heading down. Stopping on the way up would strand the rider going
      the wrong way; reversing immediately abandons committed upward passengers.
    ref: "concepts.md#dispatching-algorithms-scan-look-nearest-car"

  - id: design-elevator-system-014
    difficulty: beginner
    tags: [data-structures, stops]
    question: |
      Why do sorted stop sets (upStops/downStops) beat a single FIFO queue for an
      elevator's pending floors?
    options:
      - "FIFO order can force the car to yo-yo between floors, while sorted sets let one directional sweep serve everything on the way"
      - "FIFO queues cannot store integers efficiently"
      - "Sorted sets automatically implement the Observer pattern"
      - "A FIFO queue cannot hold more than one request per floor"
    answer: 0
    explanation: |
      From floor 1, FIFO requests [9, 2, 8] cost 8+7+6 = 21 floors of travel; a sorted
      sweep serves 2, 8, 9 in 8 floors. Sets also collapse duplicate presses of the
      same floor for free. The other options are fabricated constraints.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-elevator-system-015
    difficulty: intermediate
    tags: [api-design, encapsulation]
    question: |
      Why does requestElevator(floor, direction) deliberately NOT take an elevatorId
      parameter?
    options:
      - "Because elevator ids are private implementation details that cannot be exposed"
      - "Riders at a hall panel do not choose a car — assigning one is the dispatcher's job, so the API mirrors the real interaction"
      - "Because passing two int parameters plus an id would exceed clean-code argument limits"
      - "Because the id is derivable from the floor number"
    answer: 1
    explanation: |
      The API models the domain: hall passengers request (floor, direction) and the
      system picks the car. Cabin calls, by contrast, are bound to a specific car.
      Getting this asymmetry right in the method signatures is a signal the candidate
      understands the two request types.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-elevator-system-016
    difficulty: intermediate
    tags: [api-design, testability]
    question: |
      What is the main design benefit of driving each elevator with an explicit
      moveOneStep() tick method rather than an internal timer thread?
    options:
      - "Timers are deprecated in modern Java"
      - "Tick methods use less CPU than threads"
      - "It makes movement deterministic and testable — a test scripts button presses, calls step() in a loop, and asserts the visited-floor sequence without sleeps or threads"
      - "It allows the elevator to skip floors when the building is empty"
    answer: 2
    explanation: |
      A tick-driven state machine can be simulated synchronously, so unit tests are
      deterministic and fast. Threads and timers can be layered on top in production
      by calling the same tick. This "simulation seam" is a hallmark of strong LLD
      answers.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-elevator-system-017
    difficulty: intermediate
    tags: [patterns, strategy, ocp]
    question: |
      The interviewer asks: "Why a SchedulingStrategy interface instead of a
      switch(algorithmType) inside the controller?" Which justification is strongest?
    options:
      - "Interfaces run faster than switch statements at the JVM level"
      - "Switch statements are forbidden by SOLID"
      - "It reduces the total number of classes in the system"
      - "A new policy becomes a new class instead of an edit to tested dispatch code, each policy unit-tests in isolation, and the active policy can be swapped at runtime"
    answer: 3
    explanation: |
      This is the Open/Closed Principle payoff stated concretely: extension without
      modification, isolated testability, and runtime swap (e.g., rush-hour policy
      from 8-10 am). Performance is irrelevant, SOLID doesn't ban switch, and Strategy
      actually adds classes — the win is where change lands, not class count.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-elevator-system-018
    difficulty: advanced
    tags: [concurrency, race-conditions]
    question: |
      Between the strategy reading fleet state and the chosen car receiving addStop(),
      the car moves past the requested floor. In a LOOK-based design, why is this
      check-then-act race often acceptable to ship?
    options:
      - "The race is impossible because Java synchronizes all method calls by default"
      - "The stop remains in the car's stop set and LOOK guarantees it is served on the reverse sweep — the outcome is a suboptimal assignment, never a lost request"
      - "The JVM memory model reorders the operations so the car never actually passes the floor"
      - "The strategy always re-runs automatically until the assignment is optimal"
    answer: 1
    explanation: |
      Correctness (every request eventually served) is preserved by LOOK's sweep even
      if the assignment was stale; only latency suffers slightly. If strict optimality
      matters, serialize decisions through a single dispatcher thread with a
      BlockingQueue. Knowing which races are benign is a senior signal.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-elevator-system-019
    difficulty: advanced
    tags: [concurrency, locking]
    question: |
      For thread safety, the design uses one lock per Elevator instance rather than a
      single global lock on ElevatorSystem. What is the primary benefit?
    options:
      - "Cars operate independently, so per-elevator locks avoid making every button press in the building contend on one monitor"
      - "Global locks are impossible to implement in Java"
      - "Per-elevator locks eliminate the need for any synchronization in the controller"
      - "It guarantees requests are served in exact arrival order"
    answer: 0
    explanation: |
      Each elevator's mutable state (floor, stop sets, state) is independent, so
      locking at that granularity lets cars progress in parallel. The controller may
      still need its own coordination (e.g., a dispatcher queue), and lock granularity
      says nothing about global ordering.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-elevator-system-020
    difficulty: intermediate
    tags: [concurrency, idempotency]
    question: |
      Five passengers inside the cabin all press "7" within a second. Why does the
      design handle this without special-case code?
    options:
      - "The button hardware debounces duplicate presses"
      - "The controller deduplicates requests with a background cleanup job"
      - "Pending stops are kept in a set, so adding floor 7 five times is naturally idempotent"
      - "Each press spawns a separate elevator trip to floor 7"
    answer: 2
    explanation: |
      Choosing set semantics for the stop collection makes duplicate requests a
      non-event: add is idempotent. This is a good example of a data-structure choice
      silently eliminating an entire edge-case category.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-elevator-system-021
    difficulty: intermediate
    tags: [edge-cases, state-machine]
    question: |
      A passenger presses the hall button for the floor the elevator is already
      standing on (car IDLE at floor 4, UP pressed at floor 4). What should happen?
    options:
      - "The request is queued for the next full sweep of the building"
      - "The car transitions to DOOR_OPEN immediately — no movement is needed"
      - "The system throws an InvalidRequestException"
      - "The car moves up one floor and comes back to establish direction"
    answer: 1
    explanation: |
      addStop compares the requested floor to the current floor; equality means "open
      the door here". Rejecting or deferring a same-floor request is a real usability
      bug, and moving away first is nonsense. This is a classic edge case interviewers
      probe.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-elevator-system-022
    difficulty: intermediate
    tags: [extensibility, maintenance-mode]
    question: |
      With MAINTENANCE modeled as an elevator state, what is the ONLY change the
      dispatch path needs so out-of-service cars stop receiving hall calls?
    options:
      - "Rewrite the Elevator movement logic to check a maintenance flag on every tick"
      - "Add a MaintenanceElevator subclass and swap instances at runtime"
      - "Introduce a separate MaintenanceRegistry service that buttons must consult"
      - "Strategies filter out cars whose state is MAINTENANCE when selecting — a one-line filter"
    answer: 3
    explanation: |
      Because mode is part of observable elevator state, selection strategies simply
      exclude MAINTENANCE cars (the skeleton already shows the filter). Subclassing
      for a temporary mode misuses inheritance for a state, and a separate registry
      duplicates state that the elevator already owns.
    ref: "concepts.md#extensibility"

  - id: design-elevator-system-023
    difficulty: advanced
    tags: [extensibility, vip]
    question: |
      "Now add a VIP mode: badge-holders' calls get a dedicated express car." Which
      approach best preserves the existing design?
    options:
      - "A VipRequest subtype carrying priority plus a priority-aware SchedulingStrategy that routes VIP calls to designated cars — elevator internals unchanged"
      - "Add isVip booleans to Elevator and if-checks inside moveOneStep()"
      - "Create a parallel VipElevatorSystem class duplicating the controller logic"
      - "Hard-code car 0 to only ever visit the penthouse floor"
    answer: 0
    explanation: |
      The extension lands in the two seams built for it: the Request hierarchy (new
      subtype with priority data) and the Strategy (new selection policy). Editing
      moveOneStep() means the seams failed; duplicating the controller violates DRY;
      hard-coding kills flexibility.
    ref: "concepts.md#extensibility"

  - id: design-elevator-system-024
    difficulty: advanced
    tags: [extensibility, weight-limit, state-machine]
    question: |
      Adding a weight limit: where does the check belong so an overloaded car never
      moves?
    options:
      - "In every SchedulingStrategy, which must predict passenger weight before assignment"
      - "In HallButton, which should refuse presses when cars are heavy"
      - "As a guard on the DOOR_OPEN to MOVING transition — the car refuses to depart until the WeightSensor reads within limit, and re-emits its hall call for redispatch"
      - "In the Display class, which shows a warning"
    answer: 2
    explanation: |
      The invariant is "never move while overloaded", so it guards the state
      transition where movement begins — one place, impossible to bypass. Strategies
      can't know boarding weight in advance, buttons have no business with load, and a
      display warning enforces nothing.
    ref: "concepts.md#extensibility"

  - id: design-elevator-system-025
    difficulty: intermediate
    tags: [extensibility, emergency-mode]
    question: |
      How should fire/emergency mode be modeled?
    options:
      - "A global static boolean EMERGENCY flag checked throughout the codebase"
      - "A new elevator state entered via a controller-level broadcast: clear stop sets, move to ground floor, open doors, reject new requests"
      - "Physically powering off the elevator objects by setting them to null"
      - "An EmergencyElevator subclass instantiated when the alarm rings"
    answer: 1
    explanation: |
      Emergency is a mode of behavior — exactly what the state machine exists for. A
      new state gets its own tick behavior and legal transitions. Static flags
      scatter if-checks everywhere (the boolean-soup anti-pattern), and you cannot
      re-instantiate running objects into a subclass when an alarm fires.
    ref: "concepts.md#extensibility"

  - id: design-elevator-system-026
    difficulty: beginner
    tags: [entities, requests]
    question: |
      What data does an ExternalRequest carry versus an InternalRequest?
    options:
      - "External: destination floor only. Internal: source floor and direction"
      - "Both carry source, destination, and the rider's identity"
      - "External: elevator id and floor. Internal: direction only"
      - "External: source floor and desired direction. Internal: destination floor"
    answer: 3
    explanation: |
      At the hall panel the rider knows only where they are and which way they want to
      go; inside the cabin they specify where to get off. This asymmetry is why hall
      calls need fleet-level dispatch while cabin calls bind to one car.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-elevator-system-027
    difficulty: intermediate
    tags: [algorithms, nearest-car, cost-function]
    question: |
      In the direction-aware nearest-car cost function, which elevator should score
      BEST for an UP hall call at floor 6?
    options:
      - "A car at floor 8 moving UP away from floor 6"
      - "A car at floor 9 moving DOWN toward 6 (it will serve the call on its next upward sweep)"
      - "A car at floor 3 moving UP toward floor 6 — moving toward the call in the call's desired direction"
      - "Any car in MAINTENANCE at floor 6 because distance is zero"
    answer: 2
    explanation: |
      Best case: moving toward the caller AND traveling the direction the caller
      wants — the rider boards without a reversal. Toward-but-wrong-direction is next
      (reverse-sweep pickup). Moving away is worst, and MAINTENANCE cars are filtered
      out entirely regardless of distance.
    ref: "concepts.md#dispatching-algorithms-scan-look-nearest-car"

  - id: design-elevator-system-028
    difficulty: advanced
    tags: [algorithms, load-balancing, strategy]
    question: |
      "Your nearest-car policy funnels every request to the same busy elevator near
      the lobby — fix it." What is the design-clean fix?
    options:
      - "Add a load term (pending-stop count) to the cost function inside the strategy — a strategy-local change touching no controller or elevator code"
      - "Add a busy flag to Elevator and make HallButton retry different cars"
      - "Modify moveOneStep() to randomly skip stops when the car is busy"
      - "Cap the building at fewer floors so no car gets busy"
    answer: 0
    explanation: |
      Load-awareness is a dispatch-policy concern, so it belongs in the strategy's
      cost function (the elevator already exposes pendingStopCount()). That the fix is
      contained in one strategy class IS the Strategy pattern's payoff — say that
      explicitly in the interview.
    ref: "concepts.md#dispatching-algorithms-scan-look-nearest-car"

  - id: design-elevator-system-029
    difficulty: advanced
    tags: [algorithms, starvation, aging]
    question: |
      During lunch rush, requests from floor 20 wait minutes while lobby traffic
      dominates. Which fix addresses the starvation without abandoning cost-based
      dispatch?
    options:
      - "Serve requests in strict FIFO order across the whole building"
      - "Add wait-time aging: a pending request's priority grows with time, eventually outweighing distance in the cost function"
      - "Reserve one elevator exclusively for floor 20"
      - "Reject lobby requests during rush hour"
    answer: 1
    explanation: |
      Aging is the standard anti-starvation technique: old requests accumulate
      priority until they win. Pure FIFO destroys sweep efficiency, a dedicated car
      wastes capacity off-peak, and rejecting requests is not a scheduling policy.
      Aging is also strategy-local — no core changes.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-elevator-system-030
    difficulty: intermediate
    tags: [patterns, singleton]
    question: |
      The candidate makes ElevatorSystem a Singleton with getInstance() called from
      every button. What caveat should a senior candidate raise?
    options:
      - "Singletons are always wrong and the interviewer should be corrected"
      - "getInstance() must be renamed to instance() per Java conventions"
      - "A building needs at least two controllers for redundancy"
      - "Prefer a single instance wired at the composition root and passed to collaborators — hard getInstance() calls create hidden global coupling and hurt testability"
    answer: 3
    explanation: |
      "One instance" is a reasonable domain fact; the problem is the access pattern.
      Injecting the controller keeps buttons testable with fakes and makes the
      dependency visible. Blanket "Singletons are evil" is dogma; the nuanced version
      is the senior answer.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-elevator-system-031
    difficulty: intermediate
    tags: [state-machine, invariants]
    question: |
      "The car must never move while its door is open." Where should this invariant
      be enforced?
    options:
      - "In every caller that asks the elevator to move"
      - "Inside the elevator's own state transition logic, so DOOR_OPEN can never tick into movement without the door closing first"
      - "In a nightly audit script that scans logs for violations"
      - "In the Display, which refuses to show a moving car with open doors"
    answer: 1
    explanation: |
      Invariants belong with the state they protect. If callers set elevator state
      directly, every new caller is a chance to break the rule; when all transitions
      funnel through the elevator's own methods, the check exists in exactly one
      place and cannot be bypassed.
    ref: "concepts.md#elevator-state-machine"

  - id: design-elevator-system-032
    difficulty: beginner
    tags: [edge-cases, validation]
    question: |
      A destination request arrives for floor 99 in a 30-floor building. Where should
      it be rejected?
    options:
      - "At the API boundary (requestFloor/requestElevator) with early validation, before it enters any queue"
      - "Inside moveOneStep(), when the car fails to find floor 99"
      - "By letting the TreeSet throw an exception naturally"
      - "In the SchedulingStrategy, which returns null for invalid floors"
    answer: 0
    explanation: |
      Validate at the boundary: reject bad input before it pollutes internal state.
      Detecting it deep in the movement loop means the system carried garbage for a
      while, TreeSet happily stores 99 without erroring, and returning null trades an
      error for an NPE later.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-elevator-system-033
    difficulty: advanced
    tags: [edge-cases, fault-handling, requests]
    question: |
      An elevator breaks down mid-trip. Why can its pending HALL calls be recovered
      but its pending CABIN calls cannot?
    options:
      - "Cabin calls are stored in volatile memory that is lost on fault"
      - "Hall calls have higher scheduling priority by definition"
      - "Hall passengers are still waiting on floors so their requests can be re-dispatched to other cars, but cabin passengers are physically inside the broken car — it must reach the nearest floor and open"
      - "The controller only keeps a log of hall calls, not cabin calls"
    answer: 2
    explanation: |
      This follow-up tests whether the candidate's request-type distinction is real
      understanding or ritual. Unserved hall calls re-enter dispatch; internal
      requests represent people in the car, so the only correct behavior is
      nearest-floor evacuation. The other options invent technical reasons for a
      physical fact.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-elevator-system-034
    difficulty: intermediate
    tags: [patterns, observer, concurrency]
    question: |
      Why does the skeleton use CopyOnWriteArrayList for the elevator's observer list?
    options:
      - "It is the fastest list implementation for all workloads"
      - "TreeSet cannot store observer references"
      - "It keeps observers sorted by subscription time"
      - "A display subscribing while a notification is iterating would otherwise risk ConcurrentModificationException — COW gives safe iteration with rare writes"
    answer: 3
    explanation: |
      Observer lists are read (iterated) on every state change and written (subscribe
      or unsubscribe) rarely — the exact profile CopyOnWriteArrayList is built for.
      Its per-write copy cost would be wrong for write-heavy data like stop sets.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-elevator-system-035
    difficulty: advanced
    tags: [concurrency, dispatcher, queues]
    question: |
      To fully eliminate dispatch races, the design routes all hall calls through a
      single dispatcher thread consuming a BlockingQueue of requests. What is the
      trade-off being made?
    options:
      - "Dispatch decisions are serialized — consistent fleet snapshots and no check-then-act races, at the cost of a throughput ceiling of one decision at a time"
      - "It doubles memory usage because every request is stored twice"
      - "BlockingQueue silently drops requests under load"
      - "It requires making every Elevator method static"
    answer: 0
    explanation: |
      Serializing decisions through one consumer removes the read-then-assign race
      entirely because each decision sees settled state. The cost is that dispatch
      becomes sequential — fine for a building (human-scale request rates), and a
      trade-off worth stating explicitly in the interview.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-elevator-system-036
    difficulty: intermediate
    tags: [testing, design-for-test]
    question: |
      "How would you test the scheduling logic?" Which answer shows the best design
      awareness?
    options:
      - "Spin up threads for each elevator and sleep long enough for requests to be served"
      - "Strategies are pure functions of fleet state plus a request, so unit-test them with fake elevator lists; test movement by scripting presses and asserting floor sequences over step() calls"
      - "Testing is unnecessary because the state machine prevents all bugs"
      - "Deploy to a staging building and watch the elevators for a day"
    answer: 1
    explanation: |
      The design earns its testability: selectElevator(fleet, request) needs no
      threads or mocks beyond stub elevators, and the tick loop makes movement
      deterministic. Sleep-based thread tests are flaky by construction — proposing
      them is a negative signal.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-elevator-system-037
    difficulty: advanced
    tags: [extensibility, destination-dispatch]
    question: |
      Modern high-rises use destination dispatch: riders enter their destination at
      the hall panel and are told which car to board. Which parts of the design
      change?
    options:
      - "The whole state machine must be redesigned because destinations arrive earlier"
      - "Every class changes because the request flow is reversed"
      - "The ExternalRequest gains a destination field, a new grouping SchedulingStrategy assigns cars, and hall displays (observers) announce the assignment — car movement logic is untouched"
      - "Only the Display class changes since it must show the assigned car"
    answer: 2
    explanation: |
      Destination dispatch is a richer input plus a smarter assignment policy — both
      land in existing seams (Request hierarchy, Strategy, Observer). The car still
      just sweeps its stop sets. Recognizing which follow-ups are seam-local versus
      structural is the extensibility skill being tested.
    ref: "concepts.md#extensibility"

  - id: design-elevator-system-038
    difficulty: beginner
    tags: [class-relationships, inheritance]
    question: |
      HallButton and ElevatorButton both extend an abstract Button. What justifies
      this inheritance?
    options:
      - "All classes in an LLD design should share a common base class"
      - "Inheritance saves memory compared to two unrelated classes"
      - "Buttons must be stored in a global button registry keyed by type"
      - "They share the is-a relationship and common press behavior, while differing in what request a press produces — a floor-plus-direction hall call versus a destination cabin call"
    answer: 3
    explanation: |
      Both genuinely ARE buttons (shared press lifecycle, illumination), and the
      variation point — the request each emits — is exactly what the subclasses
      specialize. Inheritance for true is-a with a clear variation point is correct;
      inheritance by default is not.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-elevator-system-039
    difficulty: intermediate
    tags: [requests, polymorphism, design-reasoning]
    question: |
      After the controller assigns a hall call to a car, the design converts both
      request types into a simple addStop(floor) on the elevator. Why is this
      collapse valuable?
    options:
      - "It lets the elevator delete the Request objects to save memory"
      - "Downstream of dispatch, a stop is a stop — the car's movement logic stays free of request-type conditionals, keeping the state machine simple"
      - "It is required because Java cannot pass subtype objects to a superclass method"
      - "It encrypts rider intent for privacy compliance"
    answer: 1
    explanation: |
      The external/internal distinction matters only for dispatch (who serves it).
      Once assigned, the car needs just a floor number. Erasing distinctions when
      they stop mattering prevents type-checking conditionals from leaking into the
      movement code.
    ref: "concepts.md#code-skeleton"

  - id: design-elevator-system-040
    difficulty: intermediate
    tags: [state-machine, look, code-structure]
    question: |
      In the code skeleton, where does the LOOK policy for a single car actually live?
    options:
      - "In chooseDirection(), which keeps the current direction while its stop set has entries, then flips or idles"
      - "In the SchedulingStrategy implementations"
      - "In the Door class's close() method"
      - "Distributed across HallButton and ElevatorButton"
    answer: 0
    explanation: |
      chooseDirection() is called at DOOR_OPEN and IDLE: continue the sweep if the
      current direction still has pending stops, otherwise reverse or go idle — that
      IS LOOK. The SchedulingStrategy answers a different question (which car gets a
      hall call), a distinction interviewers explicitly probe.
    ref: "concepts.md#code-skeleton"

  - id: design-elevator-system-041
    difficulty: beginner
    tags: [patterns, command]
    question: |
      A candidate mentions that a button press can be seen as creating a command
      object that gets queued. Which pattern are they referencing, and what is the
      right depth to give it in this problem?
    options:
      - "Observer — and it deserves a full class hierarchy"
      - "Builder — used to construct requests fluently"
      - "Command — worth naming since Request objects queued for execution fit it, but not worth extra ceremony beyond the existing Request classes"
      - "Chain of Responsibility — every request must pass through all elevators"
    answer: 2
    explanation: |
      A Request being created, queued, and later executed is Command in spirit. The
      senior move is to name it and move on — the Request value objects already give
      the benefit; adding execute()/undo() scaffolding here is ceremony without
      payoff in a 45-minute round.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-elevator-system-042
    difficulty: intermediate
    tags: [edge-cases, availability]
    question: |
      All elevators are in MAINTENANCE and a hall call arrives. Which behaviors are
      acceptable, per the design?
    options:
      - "Silently discard the request"
      - "Throw NullPointerException from the strategy"
      - "Assign the request to a maintenance car anyway"
      - "Either throw a domain exception (NoElevatorAvailableException) or queue the request until a car returns to service — but never fail silently or NPE"
    answer: 3
    explanation: |
      The strategy's filter can leave zero candidates, and the design must handle
      that deliberately: a named domain error or a held queue are both defensible.
      Silent loss and NPEs are the two failure modes the interviewer is fishing for.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-elevator-system-043
    difficulty: advanced
    tags: [state-machine, thrashing]
    question: |
      Requests keep arriving from both directions while a car is moving. Why does the
      design only re-decide direction at DOOR_OPEN and IDLE rather than on every new
      request?
    options:
      - "Re-deciding is computationally expensive at O(n squared)"
      - "Re-evaluating direction mid-flight lets opposing requests cause thrashing — commitment to the sweep until a natural stopping point gives passengers predictable service"
      - "The TreeSet cannot be read while the elevator is moving"
      - "Java's synchronized keyword prevents mid-flight decisions"
    answer: 1
    explanation: |
      If direction were recomputed on every arrival, alternating up/down requests
      could flip a moving car's intent repeatedly, abandoning committed passengers.
      Deciding only at stop points is what makes LOOK's sweep guarantee hold. The
      other options invent technical constraints.
    ref: "concepts.md#elevator-state-machine"

  - id: design-elevator-system-044
    difficulty: beginner
    tags: [boundaries, scope]
    question: |
      Which of these belongs IN scope for the LLD elevator round (as opposed to
      deferred)?
    options:
      - "Motor torque curves and door sensor firmware timing"
      - "Persisting every request to a database for audit"
      - "The state machine for a single car and the strategy for assigning hall calls across the fleet"
      - "Cross-datacenter replication of the controller"
    answer: 2
    explanation: |
      The state machine and dispatch strategy are the two places the interview signal
      lives. Physical/embedded detail, persistence, and distributed replication are
      all explicitly scoped out in the first five minutes (physical and distributed
      concerns are other domains entirely).
    ref: "concepts.md#requirements-clarification"

  - id: design-elevator-system-045
    difficulty: intermediate
    tags: [data-structures, treeset]
    question: |
      With upStops as an ascending TreeSet, how does a car moving up find its next
      stop, and why is this a good fit?
    options:
      - "upStops.ceiling(currentFloor) — the smallest pending floor at or above the car, in O(log n) with duplicates already collapsed"
      - "Linear scan of an ArrayList sorted on every insert"
      - "upStops.first() regardless of the car's position"
      - "A HashMap lookup keyed by direction"
    answer: 0
    explanation: |
      NavigableSet.ceiling gives exactly "nearest pending floor ahead of me" — the
      question LOOK asks each tick. first() would be wrong when the car is above the
      lowest pending stop; hash structures have no order. (How TreeSet works
      internally is dsa territory — here we just justify the choice.)
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-elevator-system-046
    difficulty: intermediate
    tags: [solid, ocp, extensibility]
    question: |
      The concepts note says every follow-up should land in a Strategy, a State, or
      an Observer — and "if a follow-up forces you to edit moveOneStep(), the seams
      were in the wrong place." What principle is this operationalizing?
    options:
      - "Liskov Substitution — subclasses must honor superclass contracts"
      - "Interface Segregation — no client should depend on unused methods"
      - "Dependency Inversion — depend on abstractions, not concretions"
      - "Open/Closed — the design's variation points absorb new requirements as additions, leaving tested core code unmodified"
    answer: 3
    explanation: |
      Placing seams (Strategy, State, Observer) exactly where requirements vary is
      OCP made concrete: extensions are new classes plugged into existing interfaces.
      DIP and ISP are involved in the mechanics, but the "extend without editing the
      core" criterion is Open/Closed.
    ref: "concepts.md#extensibility"

  - id: design-elevator-system-047
    difficulty: expert
    tags: [concurrency, correctness, scenario]
    question: |
      Two riders on floors 5 and 12 press UP within the same millisecond. Threads T1
      and T2 both call requestElevator concurrently against an unserialized
      nearest-car strategy. What is the worst outcome the design permits, and why?
    options:
      - "A deadlock, because both threads lock two elevators in opposite order"
      - "Both requests assigned to the same car when separate cars would have been faster — a mildly suboptimal assignment, but never a lost or unserved request"
      - "One request is silently dropped when the strategies collide"
      - "The elevator's TreeSet becomes corrupted, crashing moveOneStep()"
    answer: 1
    explanation: |
      Strategies only read; each addStop is synchronized on a single elevator (no
      multi-lock ordering, so no deadlock), and set insertion under the lock cannot
      corrupt or drop. The only degradation is assignment quality — both calls may
      pick the same car using stale snapshots. Being able to bound the damage
      precisely is the expert-level answer.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-elevator-system-048
    difficulty: expert
    tags: [patterns, state, trade-offs]
    question: |
      The skeleton uses an enum with a switch in moveOneStep() rather than full State
      pattern classes (IdleState, MovingUpState objects with their own tick methods).
      When does upgrading to full State classes become worth it?
    options:
      - "When per-state behavior grows rich (entry/exit actions, per-state timers, mode-specific request filtering) so each state's logic deserves its own class instead of bloating one switch"
      - "Never — the GoF State pattern is obsolete in modern Java"
      - "Immediately — enums with switches always violate the Open/Closed Principle"
      - "Only when the elevator count exceeds the number of states"
    answer: 0
    explanation: |
      For four states with a few lines each, enum-plus-switch in one transition
      function is honest and readable. When states accumulate behavior (EMERGENCY
      needing evacuation logic, MAINTENANCE draining rules), polymorphic state
      objects keep each behavior cohesive. Knowing when a pattern earns its weight —
      not applying it reflexively — is the expert signal.
    ref: "concepts.md#elevator-state-machine"
