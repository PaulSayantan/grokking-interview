topic: "Design an In-Memory File System"
domain: lld-and-ood
topic_slug: design-file-system
version: 1
questions:
  - id: design-file-system-001
    difficulty: beginner
    tags: [composite, core-abstraction]
    question: |
      What is the single most important class to identify in the in-memory file system
      design, and why?
    options:
      - "Path, because every operation takes a path string"
      - "FileSystemNode — the common abstract supertype of File and Directory, so operations recurse uniformly over the tree"
      - "FileSystem, because it is the facade clients call"
      - "Content, because files store data"
    answer: 1
    explanation: |
      FileSystemNode is the Composite pattern's Component: the shared type that lets File
      (leaf) and Directory (composite) be treated uniformly. Without it, getSize/delete/search
      degrade into instanceof ladders. Path and FileSystem matter, but the load-bearing OO
      insight is the common node abstraction.
    ref: "concepts.md#noun--verb-object-identification"

  - id: design-file-system-002
    difficulty: beginner
    tags: [composite, pattern-identification]
    question: |
      Which GoF pattern is the centerpiece of an in-memory file system design?
    options:
      - "Composite"
      - "Singleton"
      - "Observer"
      - "Builder"
    answer: 0
    explanation: |
      A file system is a tree where directories contain files and other directories.
      Composite lets clients treat individual objects (files) and compositions (directories)
      uniformly through one component interface — exactly the directory-tree structure.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-file-system-003
    difficulty: beginner
    tags: [composite, roles]
    question: |
      In the Composite structure for this design, what role does Directory play?
    options:
      - "The Leaf"
      - "The Component (abstract interface)"
      - "The Composite (holds a collection of child components)"
      - "The Client"
    answer: 2
    explanation: |
      FileSystemNode is the Component, File is the Leaf, and Directory is the Composite — it
      holds a collection of FileSystemNode children and implements operations by recursing
      over them.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-file-system-004
    difficulty: intermediate
    tags: [composite, derived-state]
    question: |
      How should a Directory report its size?
    options:
      - "Store a size field updated on every write"
      - "Return 0 — only files have size"
      - "Return the number of children"
      - "Recursively sum getSize() of all its children"
    answer: 3
    explanation: |
      A directory's size is derived, not stored: getSize() recurses and sums each child's
      getSize(). File.getSize() returns content length. This polymorphic recursion is the
      Composite payoff. Caching a size field adds an invariant to maintain on every mutation
      — an optional optimization, not the default.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-file-system-005
    difficulty: intermediate
    tags: [noun-verb, method]
    question: |
      Applying noun/verb extraction, which candidate noun should NOT become its own class in
      the baseline design?
    options:
      - "Content (the bytes stored in a file)"
      - "Directory"
      - "FileSystemNode"
      - "Path"
    answer: 0
    explanation: |
      Not every noun is a class. Content is an attribute (a byte[]/String field of File), not
      a standalone class — unless you later add versioning or streaming. Making a class per
      noun is a classic junior mistake. Directory, FileSystemNode, and Path each earn their
      keep as objects.
    ref: "concepts.md#noun--verb-object-identification"

  - id: design-file-system-006
    difficulty: intermediate
    tags: [composition, relationships]
    question: |
      The relationship between Directory and its children is best modeled as which, and why?
    options:
      - "Aggregation — children can exist independently of the directory"
      - "Composition — children are owned; deleting the directory deletes its whole subtree"
      - "Inheritance — a directory is a kind of child"
      - "Association only — no ownership implied"
    answer: 1
    explanation: |
      It is composition: the children have no independent lifecycle. Deleting a directory
      cascades to its entire subtree. In UML this is the filled diamond (Directory *--
      FileSystemNode). Aggregation would imply children survive their parent, which is wrong
      for a file tree.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-file-system-007
    difficulty: advanced
    tags: [composite, transparency-safety]
    question: |
      Should add(child) and remove(name) live on FileSystemNode (the component) or only on
      Directory? Which is the better choice for a file system and why?
    options:
      - "On FileSystemNode (transparency) — uniform interface even though File.add() must throw"
      - "On FileSystem only, never on nodes"
      - "On File only, since files are the common case"
      - "On Directory only (safety) — 'add a child to a file' becomes a compile-time type error"
    answer: 3
    explanation: |
      This is GoF's transparency-vs-safety trade-off. Transparency puts child ops on the
      component (uniform, but File.add() is nonsensical and must throw at runtime). Safety
      puts them only on Directory, so adding a child to a file cannot compile. For a file
      system, safety is cleaner — a throwing File.add() would also be an LSP smell.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-file-system-008
    difficulty: intermediate
    tags: [visitor, pattern-application]
    question: |
      You need to add operations like "calculate total size," "search," and "audit
      permissions" over the tree without bloating File and Directory. Which pattern fits?
    options:
      - "Strategy"
      - "Template Method"
      - "Visitor"
      - "Command"
    answer: 2
    explanation: |
      Visitor externalizes operations that vary independently of the node structure.
      NodeVisitor with visit(File)/visit(Directory) lets you add new operations as new visitor
      classes without reopening File/Directory (Open-Closed). This is exactly what "add
      operations without touching node classes" calls for.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-file-system-009
    difficulty: advanced
    tags: [visitor, trade-offs]
    question: |
      What is the key trade-off of using Visitor for tree operations here?
    options:
      - "It makes adding new operations hard but new node types easy"
      - "It makes adding new operations easy but adding a new node type (e.g., symlink) hard, since every visitor must gain a method"
      - "It eliminates all recursion from the design"
      - "It forces every node to store a reference to every visitor"
    answer: 1
    explanation: |
      Visitor trades node-type stability for operation flexibility: adding an operation is a
      new visitor class, but adding a node type forces every existing visitor to implement a
      new visit(...) method. It fits here because node types (file, directory) are stable
      while operations proliferate.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-file-system-010
    difficulty: intermediate
    tags: [strategy, search]
    question: |
      To support exact-name, substring, and glob (*.txt) search without an if/else chain on
      the match mode, which pattern applies?
    options:
      - "Strategy — a SearchStrategy.matches(node) interface with a class per matcher"
      - "Composite — nest the matchers"
      - "Singleton — one shared matcher"
      - "Adapter — wrap the file system in a matcher"
    answer: 0
    explanation: |
      Matching is the axis of variation, so Strategy fits: SearchStrategy.matches(node) with
      ExactNameStrategy, SubstringStrategy, GlobStrategy as swappable implementations. Adding
      a new match rule is a new class, not an edit to existing search code (Open-Closed).
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-file-system-011
    difficulty: intermediate
    tags: [iterator, traversal]
    question: |
      The interviewer asks to let clients traverse the tree in DFS or BFS without knowing it
      is a tree of maps. Which pattern decouples "how to traverse" from "what to do"?
    options:
      - "Mediator"
      - "Iterator"
      - "Memento"
      - "Proxy"
    answer: 1
    explanation: |
      Iterator exposes sequential access to the tree's nodes without revealing the underlying
      Map-of-children structure, and lets DFS vs BFS be a swappable iterator implementation.
      Clients get a uniform walk regardless of the internal representation.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-file-system-012
    difficulty: beginner
    tags: [facade, filesystem]
    question: |
      What role does the FileSystem class play relative to clients?
    options:
      - "It is a Facade — one entry point exposing path-string operations while hiding path parsing and tree walking"
      - "It is the leaf node holding file content"
      - "It is the abstract Component of the Composite"
      - "It is a Strategy for eviction"
    answer: 0
    explanation: |
      FileSystem is a Facade: clients call mkdir/createFile/read/ls/find with path strings,
      and it hides path parsing, tree traversal, and node wiring. This keeps Composite
      internals and recursion off the client's plate.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-file-system-013
    difficulty: intermediate
    tags: [path-resolution, dry]
    question: |
      Nearly every operation (read, delete, ls, mkdir) begins by locating a node from a path.
      What is the right design move?
    options:
      - "Re-implement the path walk inline in each operation for clarity"
      - "Store every node in a flat global map keyed by full path string"
      - "Implement a single resolve(path) helper that walks from root and reuse it everywhere"
      - "Cache the last accessed node and hope the next call is nearby"
    answer: 2
    explanation: |
      Path resolution is the shared workhorse: split the path, walk from root segment by
      segment, return the final node. Implement resolve(path) once and funnel every operation
      through it (DRY). Re-inlining the walk duplicates logic and diverges over time.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-file-system-014
    difficulty: intermediate
    tags: [path, value-object]
    question: |
      Why model Path as its own value object rather than passing raw strings around?
    options:
      - "Because Java forbids passing strings to methods"
      - "Because Path must be a Singleton"
      - "To make paths mutable so operations can edit them in place"
      - "To isolate path parsing (split on /, resolve . and ..) into one testable class, keeping string-munging out of FileSystem's operation logic"
    answer: 3
    explanation: |
      A Path value object concentrates parsing responsibility (splitting, . / .. resolution,
      parent/basename) in one place, keeps FileSystem's operations clean, and is trivially
      unit-testable in isolation — a Single Responsibility win.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-file-system-015
    difficulty: advanced
    tags: [open-closed, extensibility]
    question: |
      A follow-up asks to add glob/wildcard search. In a well-designed system, what must
      change?
    options:
      - "Modify FileSystem.find and the Directory class to add a glob branch"
      - "Add a new SearchStrategy implementation and plug it into the existing SearchVisitor — no changes to nodes or traversal"
      - "Add a glob() method to FileSystemNode"
      - "Rewrite the Composite hierarchy to support patterns"
    answer: 1
    explanation: |
      With Strategy + Visitor in place, glob search is a new GlobStrategy class fed to the
      existing search Visitor. Nodes, traversal, and FileSystem stay closed to modification —
      Open-Closed in action. Adding a branch or a node method reopens tested code.
    ref: "concepts.md#extensibility"

  - id: design-file-system-016
    difficulty: advanced
    tags: [symlink, extensibility, visitor]
    question: |
      Adding a SymbolicLink node type is easy structurally but exposes which weakness of the
      Visitor-based design?
    options:
      - "Every existing NodeVisitor must add a visit(SymbolicLink) method"
      - "Composition breaks and directories can no longer hold children"
      - "Path resolution becomes impossible"
      - "The root directory must be deleted and recreated"
    answer: 0
    explanation: |
      Visitor makes new operations cheap but new node types expensive: adding SymbolicLink
      forces every existing visitor (size, search, audit) to gain a visit(SymbolicLink)
      method. That is the acknowledged cost of Visitor, worth naming explicitly in the
      interview.
    ref: "concepts.md#extensibility"

  - id: design-file-system-017
    difficulty: advanced
    tags: [symlink, cycles, edge-case]
    question: |
      When resolving symbolic links, what edge case must you guard against?
    options:
      - "Links pointing to files larger than memory"
      - "Links with uppercase names"
      - "Symlink cycles causing infinite resolution loops — cap the hop count"
      - "Directories that contain more than 100 links"
    answer: 2
    explanation: |
      A symlink can point (directly or transitively) back to an ancestor, creating a cycle.
      Resolution must cap the number of link hops (or track visited targets) to avoid
      infinite loops, mirroring how real kernels bound symlink chains.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-file-system-018
    difficulty: intermediate
    tags: [copy, deep-copy, edge-case]
    question: |
      What must copy(srcDir, dstDir) do to be correct for a directory?
    options:
      - "Copy only the top-level directory node and share the same child references"
      - "Copy only the files, skipping subdirectories"
      - "Move the subtree instead of copying it"
      - "Deep-copy the entire subtree into new node objects so the two trees do not alias"
    answer: 3
    explanation: |
      Copying a directory must deep-copy the whole subtree — new File/Directory objects — so
      edits to one tree do not bleed into the other. Sharing child references (a shallow copy)
      aliases the trees and is a subtle, common bug.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-file-system-019
    difficulty: advanced
    tags: [move, edge-case, cycles]
    question: |
      Why must move(/a, /a/b/c) be rejected?
    options:
      - "Paths cannot exceed three segments"
      - "Moving a directory into its own subtree creates a cycle and orphans the tree"
      - "The destination already exists"
      - "move is only defined for files, not directories"
    answer: 1
    explanation: |
      Moving a directory under one of its own descendants would make the subtree its own
      parent — a cycle that detaches the tree from the root. Detect it by checking the
      destination is not a descendant of the source before performing the move.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-file-system-020
    difficulty: intermediate
    tags: [edge-case, path-resolution]
    question: |
      resolve("/a/file.txt/b") is called where file.txt is a file. What should happen?
    options:
      - "Silently create directory b under file.txt"
      - "Return the file, ignoring the trailing segment"
      - "Fail cleanly — a file has no children, so the path cannot continue through it"
      - "Throw a NullPointerException from the map lookup"
    answer: 2
    explanation: |
      A path cannot traverse through a file. The resolve loop's `instanceof Directory` guard
      catches this: once the current node is a File, there are no children to descend into, so
      resolution fails cleanly (return null / not-found) rather than corrupting state or
      throwing an opaque NPE.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-file-system-021
    difficulty: intermediate
    tags: [children-structure, srp]
    question: |
      Why store children as one Map<String, FileSystemNode> rather than a List<File> plus a
      List<Directory>?
    options:
      - "One uniform collection is the Composite payoff — operations loop once and never special-case file vs directory; name lookup is also O(1)"
      - "Maps use less memory than lists"
      - "Java does not allow two lists in one class"
      - "Directories are not allowed to contain files"
    answer: 0
    explanation: |
      Splitting into files and dirs lists forces every operation to iterate twice and
      special-case each type — defeating Composite. A single Map<String, FileSystemNode>
      treats all children uniformly and gives O(1) name lookup and uniqueness enforcement.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-file-system-022
    difficulty: beginner
    tags: [leaf, file]
    question: |
      In the Composite hierarchy, why is File a "leaf"?
    options:
      - "Because it is the smallest class"
      - "Because it is always created last"
      - "Because it cannot have a name"
      - "Because it has no children — it terminates a branch of the tree"
    answer: 3
    explanation: |
      A leaf is a Composite node with no children. File holds content but no child nodes, so
      it terminates a branch. Directory is the composite that can contain leaves and other
      composites.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-file-system-023
    difficulty: advanced
    tags: [concurrency, locking]
    question: |
      For a first thread-safe version in a 45-minute interview, what is the recommended
      locking approach?
    options:
      - "No locking — the tree is immutable"
      - "A coarse ReentrantReadWriteLock on the FileSystem: read lock for ls/read/find, write lock for structural changes"
      - "A separate thread per directory"
      - "Lock-free compare-and-swap on every node pointer"
    answer: 1
    explanation: |
      A single coarse read-write lock on the FileSystem is correct and simple: shared read
      lock for read-only ops, exclusive write lock for mkdir/create/write/delete/move. Its cost
      is no writer concurrency across unrelated subtrees — an acceptable first answer.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-file-system-024
    difficulty: expert
    tags: [concurrency, deadlock]
    question: |
      Switching to per-directory locking to allow parallelism in disjoint subtrees introduces
      which risk, and how is it mitigated?
    options:
      - "Memory leaks — mitigated by garbage collection"
      - "Stack overflow — mitigated by iterative traversal"
      - "Deadlock when two moves acquire path locks in opposite order — mitigated by a global lock ordering (e.g., always lock ancestors before descendants)"
      - "Cache invalidation — mitigated by TTLs"
    answer: 2
    explanation: |
      Fine-grained locking on the affected directories enables parallel disjoint-subtree work
      but two concurrent moves can grab locks in opposite orders and deadlock. Impose a
      consistent global lock ordering (by depth or path) so all threads acquire locks in the
      same sequence.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-file-system-025
    difficulty: expert
    tags: [concurrency, move, atomicity]
    question: |
      Why is a thread-safe ConcurrentHashMap for a directory's children insufficient to make
      mkdir and move correct under concurrency?
    options:
      - "The check-then-act sequences (exists? then create; detach then attach) are compound operations a thread-safe map does not make atomic"
      - "ConcurrentHashMap is slower than HashMap"
      - "ConcurrentHashMap cannot store FileSystemNode values"
      - "It does not support recursion"
    answer: 0
    explanation: |
      A thread-safe map makes each single operation atomic, not a compound one. mkdir's
      "does the child exist? no, create it" and move's "detach from source, attach to dest"
      span multiple map operations that must be atomic together — requiring a lock around the
      whole critical section.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-file-system-026
    difficulty: intermediate
    tags: [solid, single-responsibility]
    question: |
      Which class assignment correctly reflects Single Responsibility in this design?
    options:
      - "FileSystem parses paths, stores content, matches search patterns, and computes sizes"
      - "Directory both stores children and performs all searches and permission checks inline"
      - "One FileSystemNode class does everything to avoid subclassing"
      - "File holds content, Directory holds children, Path parses paths, FileSystem orchestrates, each Visitor is one operation, each Strategy is one matcher"
    answer: 3
    explanation: |
      SRP means each class has one reason to change. Content storage (File), child containment
      (Directory), path parsing (Path), orchestration (FileSystem), each operation (Visitor),
      and each match rule (Strategy) are distinct responsibilities in distinct classes.
    ref: "concepts.md#solid-in-this-design"

  - id: design-file-system-027
    difficulty: advanced
    tags: [solid, liskov]
    question: |
      How does the "add/remove on Directory only" choice relate to the Liskov Substitution
      Principle?
    options:
      - "It violates LSP by hiding methods"
      - "It supports LSP: a File placed where a FileSystemNode is expected never needs a throwing add() — every node's declared operations (getSize, accept) work safely"
      - "LSP is irrelevant to Composite designs"
      - "It forces File to inherit Directory, satisfying LSP"
    answer: 1
    explanation: |
      Keeping add/remove off the component means FileSystemNode only declares operations valid
      for both subtypes (getSize, accept). A File substituted for a FileSystemNode never hits a
      method that must throw — a throwing File.add() would be a classic LSP smell.
    ref: "concepts.md#solid-in-this-design"

  - id: design-file-system-028
    difficulty: intermediate
    tags: [solid, dependency-inversion]
    question: |
      How is the Dependency Inversion Principle expressed in this design?
    options:
      - "FileSystem hard-codes new File() and new Directory() everywhere"
      - "Every class extends FileSystemNode"
      - "FileSystem and visitors depend on the FileSystemNode abstraction and the NodeVisitor/SearchStrategy interfaces, not on concrete details of matching or operations"
      - "Path depends on FileSystem"
    answer: 2
    explanation: |
      DIP: high-level orchestration and operations depend on abstractions. FileSystem drives
      trees through FileSystemNode; search depends on the SearchStrategy interface; operations
      are NodeVisitor implementations. Concrete matchers/operations are swapped without
      changing the high-level code.
    ref: "concepts.md#solid-in-this-design"

  - id: design-file-system-029
    difficulty: beginner
    tags: [scope, boundaries]
    question: |
      A candidate starts sketching consistent hashing and replication for the file system.
      What is the scoping correction?
    options:
      - "This is an in-memory single-machine LLD problem; distributed/durable file systems are an HLD concern to redirect to system-design"
      - "Continue — distribution is core to any file system"
      - "Switch to designing a database instead"
      - "Add a Singleton to coordinate the shards"
    answer: 0
    explanation: |
      The LLD round grades single-machine OO design. Replication, metadata servers, and
      consistency are HLD topics (HDFS/S3/NFS). Acknowledge the boundary and keep the design an
      in-memory tree, pointing distribution follow-ups to system-design.
    ref: "concepts.md#requirements-clarification"

  - id: design-file-system-030
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      Which of these is a reasonable thing to explicitly scope OUT in the first five minutes?
    options:
      - "The mkdir and createFile operations"
      - "Path resolution"
      - "The Directory class"
      - "Persistence and distribution (durable, networked, replicated storage)"
    answer: 3
    explanation: |
      Persistence and distribution are HLD-scale concerns and safe to defer. mkdir/createFile,
      Directory, and path resolution are core to the in-memory design and cannot be scoped out.
    ref: "concepts.md#requirements-clarification"

  - id: design-file-system-031
    difficulty: intermediate
    tags: [actors, use-cases]
    question: |
      In the use-case analysis, what is the common thread across nearly every operation
      (ls, read, delete, find)?
    options:
      - "They all allocate new memory"
      - "They all resolve a path to a node, then act on that node — so path resolution is the shared workhorse"
      - "They all require a background thread"
      - "They all modify the root directory"
    answer: 1
    explanation: |
      Every use-case boils down to "resolve a path to a node, then do something to it."
      Recognizing this makes path resolution the reusable core routine that the rest of the
      API builds on.
    ref: "concepts.md#use-cases-and-actors"

  - id: design-file-system-032
    difficulty: intermediate
    tags: [visitor, mechanics]
    question: |
      In the accept(visitor) implementation, how does a Directory drive traversal?
    options:
      - "It calls visitor.visit(this), then calls accept(visitor) on each child so the visit recurses through the subtree"
      - "It calls visitor.visit(this) only and stops"
      - "It asks the visitor to iterate its children"
      - "It converts itself into a File first"
    answer: 0
    explanation: |
      Directory.accept visits itself, then delegates to each child's accept, which recurses.
      File.accept just calls visitor.visit(this). This double-dispatch plus recursion lets one
      visitor sweep the whole subtree without the visitor knowing the tree shape.
    ref: "concepts.md#code-skeleton"

  - id: design-file-system-033
    difficulty: advanced
    tags: [size-cache, optimization]
    question: |
      To make getSize() O(1) for very large trees, what is the trade-off of caching size on
      each Directory?
    options:
      - "There is no downside; always cache"
      - "Caching makes writes O(1) but reads O(n)"
      - "You gain O(1) reads but must propagate a dirty/delta up the parent chain on every write/delete/move — an invariant to maintain"
      - "It requires switching from Composite to Decorator"
    answer: 2
    explanation: |
      Cached directory sizes make getSize O(1) but every content write, delete, or move must
      update the cached size and propagate the delta up to the root. That invalidation
      bookkeeping is the cost — an optimization to mention, not the default design.
    ref: "concepts.md#extensibility"

  - id: design-file-system-034
    difficulty: intermediate
    tags: [permissions, extensibility]
    question: |
      A follow-up adds file permissions and owner. What is the least invasive design change?
    options:
      - "Add owner/permission fields and a Metadata object composed into FileSystemNode; operations consult it, and a PermissionCheckVisitor can audit"
      - "Add a permissions parameter to every method of FileSystem"
      - "Subclass File into SecureFile and PublicFile"
      - "Store permissions in a global static map keyed by path string"
    answer: 0
    explanation: |
      Composing a Metadata/Permission object into FileSystemNode localizes the new concern;
      operations consult it before acting, and a PermissionCheckVisitor audits the tree. The
      Composite structure is untouched. Subclassing by permission explodes the class count.
    ref: "concepts.md#extensibility"

  - id: design-file-system-035
    difficulty: advanced
    tags: [storage-backend, extensibility]
    question: |
      To support both in-memory and on-disk file content, which seam keeps the tree structure
      orthogonal to where bytes live?
    options:
      - "Add an if(onDisk) branch inside File.read and File.write"
      - "Move all content into the FileSystem facade"
      - "Make Directory responsible for reading disk blocks"
      - "Introduce a StorageBackend interface behind File's content so bytes can live in memory or on disk, independent of the tree"
    answer: 3
    explanation: |
      A StorageBackend abstraction behind File decouples "where the bytes are" from "the tree
      structure." In-memory vs disk becomes a swappable backend. If it grows networked/durable/
      replicated, that crosses into HLD territory.
    ref: "concepts.md#extensibility"

  - id: design-file-system-036
    difficulty: intermediate
    tags: [edge-case, duplicate-name]
    question: |
      Two entries with the same name in one directory — how is uniqueness enforced?
    options:
      - "A background job periodically deduplicates names"
      - "The Map<String, FileSystemNode> keying children by name enforces uniqueness; add() rejects collisions"
      - "Names are allowed to duplicate; resolution picks one at random"
      - "Only files must be unique; directories may repeat"
    answer: 1
    explanation: |
      Because children are keyed by name in a Map, a directory cannot hold two entries with the
      same name (file or directory). add() should reject a collision explicitly rather than
      silently overwrite.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-file-system-037
    difficulty: intermediate
    tags: [edge-case, delete-root]
    question: |
      What should delete("/") (deleting the root) do?
    options:
      - "Succeed and leave an empty tree with no root"
      - "Delete only the root's files but keep subdirectories"
      - "Be rejected — the root has no parent to detach from and is a structural invariant"
      - "Recreate the root automatically after deletion"
    answer: 2
    explanation: |
      The root is a structural invariant with no parent. Deleting it would leave the tree
      unrooted. Reject the operation. Deletion works by a parent removing a named child, which
      the root has no parent to do.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-file-system-038
    difficulty: advanced
    tags: [edge-case, mkdir-p]
    question: |
      createFile("/a/b/c.txt") is called when /a/b does not exist. What is the design
      decision to make explicit?
    options:
      - "Decide and state whether to fail, or auto-create intermediate directories (mkdir -p semantics) — never silently do nothing"
      - "Always crash the program"
      - "Create c.txt at the root instead"
      - "Convert /a and /b into files"
    answer: 0
    explanation: |
      Missing intermediate directories force a semantic choice: fail with a clear error, or
      auto-create parents (mkdir -p). Either is defensible, but you must state it. Silently
      doing nothing is the worst outcome — it hides bugs.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-file-system-039
    difficulty: beginner
    tags: [polymorphism, getsize]
    question: |
      getSize() returns different logic for File vs Directory but has the same signature on
      FileSystemNode. What OO concept is this?
    options:
      - "Encapsulation"
      - "Reflection"
      - "Serialization"
      - "Polymorphism — one interface, subtype-specific behavior, invoked without knowing the concrete type"
    answer: 3
    explanation: |
      Polymorphism: callers invoke node.getSize() through the FileSystemNode type; File returns
      content length while Directory recurses over children. The client never branches on the
      concrete type — the Composite pattern's core benefit.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-file-system-040
    difficulty: intermediate
    tags: [api, encapsulation]
    question: |
      Why should ls(path) return names (or lightweight entries) rather than the actual child
      FileSystemNode objects?
    options:
      - "Names are faster to serialize over a network"
      - "Returning node references leaks internal mutable objects clients could tamper with, breaking encapsulation"
      - "FileSystemNode cannot be returned from a method"
      - "It reduces the number of classes"
    answer: 1
    explanation: |
      Handing back live node references lets callers mutate the tree's internals directly,
      bypassing FileSystem's invariants. Returning names (or read-only views) preserves
      encapsulation and keeps all structural changes funneled through the facade.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-file-system-041
    difficulty: advanced
    tags: [versioning, memento]
    question: |
      A follow-up asks for file version history / undo. Which approach fits without changing
      the node interface?
    options:
      - "Add a version parameter to every FileSystem method"
      - "Store all versions in the Directory"
      - "Give File a history of content versions (or apply Memento for undo); the node interface stays the same"
      - "Replace File with a Strategy"
    answer: 2
    explanation: |
      Versioning is internal to a file: File can keep a list of prior content states, or use
      Memento to capture/restore snapshots for undo. The public FileSystemNode contract is
      unchanged, so the rest of the design is untouched.
    ref: "concepts.md#extensibility"

  - id: design-file-system-042
    difficulty: intermediate
    tags: [testing, separation]
    question: |
      Why is separating SearchStrategy and NodeVisitor from the node classes a testing win?
    options:
      - "Each strategy/visitor can be unit-tested in isolation, and path resolution tested separately, rather than only through end-to-end file operations"
      - "It lets you skip testing entirely"
      - "It makes the classes final and untestable"
      - "It removes the need for a root directory"
    answer: 0
    explanation: |
      Small, focused classes are independently testable: feed a SearchStrategy sample nodes and
      assert matches; drive a visitor over a scripted tree; test resolve() with crafted paths.
      This isolation is a direct payoff of separating responsibilities.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-file-system-043
    difficulty: beginner
    tags: [uml, relationships]
    question: |
      In the class diagram, which UML arrow correctly denotes that File and Directory realize
      the abstract FileSystemNode contract?
    options:
      - "..> (dependency)"
      - "--* (composition)"
      - "--o (aggregation)"
      - "--|> (inheritance / generalization) or ..|> (realization)"
    answer: 3
    explanation: |
      File and Directory generalize/realize FileSystemNode. Since FileSystemNode is an abstract
      class here, --|> (inheritance) applies; if it were a pure interface, ..|> (realization)
      would. Composition (--*) is used for Directory owning its children, not for the type
      hierarchy.
    ref: "concepts.md#class-diagram"

  - id: design-file-system-044
    difficulty: advanced
    tags: [god-class, anti-pattern]
    question: |
      A candidate writes one FileSystem class that stores a flat Map<String,byte[]> keyed by
      full path and does string prefix matching for ls/delete. Why is this a weaker LLD answer?
    options:
      - "It is actually optimal and should be preferred"
      - "It discards the tree/Composite structure — ls, recursive delete, size, and move become error-prone prefix-string hacks, and there is no polymorphic node abstraction to extend"
      - "Maps are not allowed in interviews"
      - "It uses too little memory"
    answer: 1
    explanation: |
      A flat path->bytes map may pass a DSA problem but fails an LLD round: there is no
      FileSystemNode abstraction, directory operations degrade into fragile prefix-string
      manipulation, and there is nowhere clean to add symlinks, permissions, or visitors. The
      graded skill is drawing the object boundaries.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-file-system-045
    difficulty: intermediate
    tags: [recursion, delete]
    question: |
      How does delete of a directory leverage the Composite structure?
    options:
      - "It must manually iterate a separate list of every descendant path"
      - "It converts all children to files first"
      - "Removing the directory node from its parent drops the whole owned subtree; the composition relationship makes the delete cascade naturally"
      - "It can only delete empty directories"
    answer: 2
    explanation: |
      Because a Directory composes (owns) its children, detaching the directory from its parent
      releases the entire subtree — a cascading delete that falls out of the composition
      relationship and garbage collection, no manual per-node bookkeeping needed.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-file-system-046
    difficulty: advanced
    tags: [pattern-classification, intent]
    question: |
      Classified by GoF intent, the four main patterns in this design are Composite, Visitor,
      Iterator, and Strategy. What do these categories represent?
    options:
      - "Composite is Structural (assembly); Visitor, Iterator, and Strategy are Behavioral (operation/traversal/algorithm responsibility)"
      - "All four are Creational patterns for object construction"
      - "Composite is Behavioral; the rest are Creational"
      - "All four are Structural patterns"
    answer: 0
    explanation: |
      Composite is Structural — it composes objects into tree structures. Visitor (operations),
      Iterator (traversal), and Strategy (interchangeable algorithms) are Behavioral, dealing
      with responsibility and interaction among objects. No Creational pattern dominates this
      problem (a Factory for node creation is optional).
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-file-system-047
    difficulty: intermediate
    tags: [parent-pointer, relationships]
    question: |
      Why does each FileSystemNode keep a reference to its parent Directory?
    options:
      - "To store the file content"
      - "To cache search results"
      - "Because Java requires bidirectional references"
      - "To enable operations like move, delete, and building an absolute path by walking up, and to enforce the single-parent invariant"
    answer: 3
    explanation: |
      A parent pointer supports upward navigation: detaching on delete/move, reconstructing an
      absolute path, and enforcing that every non-root node has exactly one parent (multiplicity
      1). It is set when a node is added to a directory.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-file-system-048
    difficulty: expert
    tags: [concurrency, move, atomicity]
    question: |
      Under fine-grained locking, what makes move(src, dst) atomic and safe?
    options:
      - "Copying the node before moving it"
      - "Locking both the source parent and destination parent in a fixed global order, and performing detach-then-attach as one critical section"
      - "Using a volatile boolean flag"
      - "Retrying the move until it succeeds"
    answer: 1
    explanation: |
      move touches two directories. To be atomic without deadlock, lock the source parent and
      destination parent in a consistent global order, then detach from source and attach to
      destination within that single locked section so the node is never in neither or both
      places.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-file-system-049
    difficulty: intermediate
    tags: [interface-segregation, solid]
    question: |
      How does the design honor the Interface Segregation Principle?
    options:
      - "By putting every possible method on FileSystemNode"
      - "By making FileSystem implement every interface"
      - "NodeVisitor and SearchStrategy are small, focused interfaces, and clients of FileSystem never see traversal internals"
      - "By merging all interfaces into one god interface"
    answer: 2
    explanation: |
      ISP favors small, role-specific interfaces. NodeVisitor (two visit methods) and
      SearchStrategy (one matches method) are minimal and focused, and FileSystem's public
      contract exposes only path operations — clients are not forced to depend on internals
      they do not use.
    ref: "concepts.md#solid-in-this-design"

  - id: design-file-system-050
    difficulty: advanced
    tags: [tiered, extensibility, boundary]
    question: |
      A follow-up asks for a two-level cache/tier where an in-memory tree fronts a remote
      store. At what point does this become an HLD concern?
    options:
      - "The moment the backing store is a remote, shared, durable system (consistency, invalidation, sharding) — keep the LLD at the node/backend interface and redirect to system-design"
      - "Immediately — any file system is HLD"
      - "Never — it is always pure LLD"
      - "Only when there are more than two tiers"
    answer: 0
    explanation: |
      The LLD contribution is an abstraction (e.g., a StorageBackend/remote adapter behind the
      node interface). Once the remote tier introduces distributed consistency, invalidation,
      and sharding, those are system-design concerns — acknowledge the boundary and keep the OO
      design single-machine.
    ref: "concepts.md#extensibility"
