topic: "Design Principles Beyond SOLID"
domain: lld-and-ood
topic_slug: design-principles-beyond-solid
version: 1
questions:
  - id: design-principles-beyond-solid-001
    difficulty: beginner
    tags: [dry, design-reasoning]
    question: |
      What does DRY actually forbid duplicating, per its original formulation in
      The Pragmatic Programmer?
    options:
      - "Any two code blocks that share more than three identical lines"
      - "Method names that appear in more than one class"
      - "A piece of knowledge (a business rule or fact) represented authoritatively in more than one place"
      - "Data stored in more than one object at runtime"
    answer: 2
    explanation: |
      DRY is about *knowledge*, not text: every rule or fact should have a single
      authoritative representation. Two blocks that look alike but encode different
      rules are NOT a DRY violation, while the same grace-period rule hand-coded in two
      gates IS — even if the code text differs. Line-count and naming heuristics miss
      the point, and runtime data duplication (caching, DTOs) is a different concern.
    ref: "concepts.md#dry--dont-repeat-yourself"

  - id: design-principles-beyond-solid-002
    difficulty: beginner
    tags: [dry, parking-lot]
    question: |
      A parking lot's EntryGate hard-codes "first 15 minutes free" and ExitGate
      independently hard-codes the same 15-minute check. The product owner changes the
      grace period to 10 minutes. What design principle would have prevented the bug
      where only one gate is updated?
    options:
      - "Law of Demeter — the gates talk to too many strangers"
      - "DRY — the grace-period rule should live in one authoritative place, e.g. a PricingPolicy"
      - "YAGNI — the grace period should not have been built until asked"
      - "Liskov substitution — both gates should extend a common AbstractGate"
    answer: 1
    explanation: |
      The grace period is one piece of business knowledge duplicated in two classes —
      the definition of a DRY violation. Centralizing it in a PricingPolicy that both
      gates delegate to means one change site. LoD is about call chains, YAGNI is about
      speculative features (the grace period was a real requirement), and inheriting
      from a shared base to share a constant is inheritance-for-reuse, a worse coupling.
    ref: "concepts.md#dry--dont-repeat-yourself"

  - id: design-principles-beyond-solid-003
    difficulty: intermediate
    tags: [dry, incidental-duplication]
    question: |
      Which of these duplications is generally ACCEPTABLE to leave in place during a
      45-minute design round?
    options:
      - "The fee-rounding rule implemented in both the receipt printer and the payment service"
      - "The max-capacity check copy-pasted into park() and reserve()"
      - "The same discount percentage hard-coded in three pricing strategies"
      - "Two validation blocks that currently look similar but guard different rules that will evolve independently"
    answer: 3
    explanation: |
      Incidental duplication — code that is coincidentally similar but represents
      different knowledge with different reasons to change — should not be merged;
      forcing it into one abstraction couples unrelated rules. The other three are the
      same business fact (rounding rule, capacity rule, discount value) represented in
      multiple places: true DRY violations that will drift out of sync.
    ref: "concepts.md#wrong-dry--premature-abstraction-and-incidental-duplication"

  - id: design-principles-beyond-solid-004
    difficulty: beginner
    tags: [dry, refactoring]
    question: |
      You notice mid-interview that you've written the same "compute parked duration and
      apply hourly rate" logic in two places. What is the strongest move?
    options:
      - "Say it out loud and centralize the rule into one owner (e.g., a PricingPolicy or a Ticket method) that both call sites delegate to"
      - "Leave both copies but add a TODO comment so the interviewer sees you noticed"
      - "Delete one call site entirely to remove the duplication"
      - "Extract a static DateUtils helper holding both the duration math and the rate"
    answer: 0
    explanation: |
      Catching your own duplication and naming the fix ("this rule now lives in two
      places — let me centralize it") is a senior signal. A TODO leaves the defect; deleting
      a call site removes a feature; and a grab-bag static util mixes two concerns
      (time math and pricing knowledge) into a low-cohesion dumping ground rather than
      giving the rule a meaningful owner.
    ref: "concepts.md#dry--dont-repeat-yourself"

  - id: design-principles-beyond-solid-005
    difficulty: intermediate
    tags: [wrong-dry, premature-abstraction]
    question: |
      After extracting a shared computeShares() method for two Splitwise split types, you
      find yourself adding a parameter `boolean isPercentageMode` so the method behaves
      differently per caller. What does this signal?
    options:
      - "Good defensive design — the flag documents the two modes explicitly"
      - "A need for a second boolean so each mode is independently toggleable"
      - "The abstraction is wrong — the two callers share text, not knowledge, and should each own their version again"
      - "The method should be made static so the flag becomes thread-safe"
    answer: 2
    explanation: |
      A mode flag that makes a shared method serve callers differently is the classic
      symptom of the wrong abstraction: you merged code that merely looked alike. The
      cure is to inline the method back into the variants and let each own its logic —
      "duplication is far cheaper than the wrong abstraction." Adding more flags deepens
      the coupling, and static/thread-safety is unrelated.
    ref: "concepts.md#wrong-dry--premature-abstraction-and-incidental-duplication"

  - id: design-principles-beyond-solid-006
    difficulty: intermediate
    tags: [wrong-dry, trade-offs]
    question: |
      Sandi Metz's guideline "duplication is far cheaper than the wrong abstraction"
      argues which trade-off?
    options:
      - "Copy-paste is always preferable to inheritance"
      - "Living with a second copy of similar code costs less than a shared abstraction that couples divergent rules and accretes conditional flags"
      - "Abstractions should be written before the first duplication appears, to prevent it"
      - "Wrong abstractions are acceptable if covered by unit tests"
    answer: 1
    explanation: |
      The insight is about cost asymmetry: duplicated code is easy to change independently
      and easy to merge later, but a wrong shared abstraction forces every future change
      through conditional branches that risk breaking unrelated callers — and it is
      psychologically hard to un-extract. It is not a blanket endorsement of copy-paste,
      nor about test coverage, and pre-emptive abstraction is the exact failure mode it warns against.
    ref: "concepts.md#wrong-dry--premature-abstraction-and-incidental-duplication"

  - id: design-principles-beyond-solid-007
    difficulty: beginner
    tags: [wrong-dry, rule-of-three]
    question: |
      The "rule of three" (AHA — Avoid Hasty Abstractions) says you should typically
      extract a shared abstraction when?
    options:
      - "On the third occurrence of the duplication, when you finally know the real axis of variation"
      - "Immediately on the second occurrence, before the copies drift"
      - "Never — duplication should always be tolerated"
      - "Only when a linter or code-quality tool flags the duplication"
    answer: 0
    explanation: |
      With only two copies you are guessing at what varies; by the third occurrence the
      genuine common knowledge and the variation axis are visible, so the abstraction you
      extract is much more likely to be right. Extracting at two risks premature
      abstraction; "never extract" abandons DRY entirely; and tooling flags textual
      similarity, not knowledge duplication.
    ref: "concepts.md#wrong-dry--premature-abstraction-and-incidental-duplication"

  - id: design-principles-beyond-solid-008
    difficulty: advanced
    tags: [wrong-dry, splitwise, extensibility]
    question: |
      In Splitwise you extracted BaseSplit.computeShares() shared by EqualSplit and
      PercentageSplit. The interviewer adds: "ExactSplit must validate that amounts sum to
      the total, and PercentageSplit needs banker's rounding that must NOT apply to
      ExactSplit." The shared method is growing if-chains. Best response?
    options:
      - "Add an enum SplitMode parameter and switch on it inside computeShares()"
      - "Override computeShares() in each subclass but call super() first to keep the shared part"
      - "Introduce a RoundingStrategy injected into BaseSplit so the flags become objects"
      - "Un-extract: move share computation fully into each Split subtype (polymorphism), keeping only truly common knowledge (e.g., participant list handling) shared"
    answer: 3
    explanation: |
      The requirements prove the split algorithms are different knowledge — validation
      and rounding vary per type. The polymorphic fix assigns each variant its own
      computeShares() (GRASP Polymorphism), deleting the conditional core. A mode enum is
      the flag anti-pattern; super()-then-tweak keeps the wrong shared core; injecting a
      RoundingStrategy into the base still forces ExactSplit to know about rounding it
      must not do.
    ref: "concepts.md#wrong-dry--premature-abstraction-and-incidental-duplication"

  - id: design-principles-beyond-solid-009
    difficulty: beginner
    tags: [kiss, over-engineering]
    question: |
      Forty-five minutes to design tic-tac-toe. A candidate starts with
      CellStateVisitor, AbstractBoardFactoryProvider, and an XML-driven rule engine.
      What is the core problem?
    options:
      - "Visitors are the wrong GoF pattern — an Observer should be used instead"
      - "Unpaid-for complexity: no stated requirement justifies these layers, and they consume time needed for working core logic (KISS)"
      - "XML is outdated — the rules should load from JSON or YAML"
      - "The classes violate DRY by repeating the word 'Board' in their names"
    answer: 1
    explanation: |
      KISS says complexity must be paid for by a requirement you can point to. Tic-tac-toe
      needs a Board with placeMark() and winner() — the elaborate scaffolding buys nothing
      the problem asked for and risks an unfinished happy path, which scores worse than a
      simple design that runs. Swapping which pattern or config format is used just
      redecorates the over-engineering.
    ref: "concepts.md#kiss--keep-it-simple"

  - id: design-principles-beyond-solid-010
    difficulty: intermediate
    tags: [kiss, patterns, strategy]
    question: |
      Per KISS, when is the RIGHT moment in a live design round to upgrade a plain method
      into a Strategy interface?
    options:
      - "At the very start — interfaces are always cheaper to add early"
      - "Never during the interview — patterns should be mentioned only verbally"
      - "Whenever a method exceeds roughly ten lines"
      - "When the requirements introduce a second genuine variant of the behavior (or explicitly flag the axis as variable)"
    answer: 3
    explanation: |
      KISS is "no UNPAID-FOR patterns," not "no patterns." The moment the interviewer says
      pricing differs by vehicle type — a second variant — the Strategy earns its cost.
      Blanket-interfacing everything up front is speculative (YAGNI); refusing patterns
      entirely underuses OO; and method length is a readability heuristic, not a
      variation signal.
    ref: "concepts.md#kiss--keep-it-simple"

  - id: design-principles-beyond-solid-011
    difficulty: beginner
    tags: [kiss, design-reasoning]
    question: |
      Which statement best captures KISS as applied to a machine-coding round?
    options:
      - "Add complexity only when a stated requirement pays for it; prefer the simplest design that satisfies what was actually asked"
      - "Minimize the number of files, even if classes take on multiple responsibilities"
      - "Avoid all abstraction — concrete classes only, since abstractions add reading cost"
      - "Choose whichever design uses the fewest total lines of code"
    answer: 0
    explanation: |
      KISS is requirement-anchored simplicity: every layer, interface, or pattern must be
      justified by something in the problem statement. It does not mean cramming
      responsibilities into fewer files (that destroys cohesion), banning abstraction
      (a justified Strategy IS the simple solution to a variability requirement), or
      code-golfing line counts.
    ref: "concepts.md#kiss--keep-it-simple"

  - id: design-principles-beyond-solid-012
    difficulty: intermediate
    tags: [kiss, interview-strategy]
    question: |
      With 15 minutes left, you must choose: finish a working park/unpark happy path with
      3 plain classes, or complete your 9-class layered architecture with no runnable
      flow. Per the guidance for this round, which wins and why?
    options:
      - "The 9-class architecture — structure demonstrates design skill better than behavior"
      - "Neither — spend the time writing unit tests for what exists"
      - "Ask the interviewer to extend the session"
      - "The working happy path — a simple design that runs scores better than a beautiful architecture that doesn't"
    answer: 3
    explanation: |
      Machine-coding rounds reward extensible code that WORKS. An unfinished architecture
      leaves the interviewer unable to verify behavior, while three cohesive classes with
      a demonstrable flow prove both coding and judgment (KISS under time pressure).
      Tests matter but not more than a runnable core, and session extensions aren't yours
      to grant.
    ref: "concepts.md#kiss--keep-it-simple"

  - id: design-principles-beyond-solid-013
    difficulty: beginner
    tags: [yagni, scope-control]
    question: |
      Why does YAGNI say the cost of building a speculative feature is more than just the
      time to build it?
    options:
      - "Because speculative features always contain more bugs per line"
      - "Because the compiler cannot optimize unused code paths"
      - "You also pay a carrying cost (everyone reads and maintains it) and it is likely WRONG when the real requirement finally arrives"
      - "Because interviewers deduct fixed points per extra class"
    answer: 2
    explanation: |
      YAGNI's triple cost: build cost now, carry cost (the code must be read, understood,
      and kept compiling by everyone forever), and repair cost — real future requirements
      rarely match the guess, so the speculative version usually must be reworked anyway.
      Bug density, compiler optimization, and per-class scoring rubrics are not the argument.
    ref: "concepts.md#yagni--you-arent-gonna-need-it"

  - id: design-principles-beyond-solid-014
    difficulty: advanced
    tags: [yagni, extensibility, trade-offs]
    question: |
      YAGNI seems to conflict with "design for extensibility." Per the recommended
      interview approach, how do you reconcile them for parking-lot pricing?
    options:
      - "YAGNI wins: use a concrete PricingCalculator class and refactor to an interface only if asked"
      - "Extensibility wins: implement Hourly, Weekend, and Surge pricing classes up front so follow-ups are pre-answered"
      - "Create the PricingStrategy interface (a cheap seam) but implement ONLY the required variant, narrating how the next one would slot in"
      - "Skip pricing entirely until the interviewer explicitly asks for it"
    answer: 2
    explanation: |
      YAGNI forbids speculative CODE, not cheap SEAMS. One interface file costs a minute
      and protects the axis the problem flags as volatile (Protected Variations);
      implementing multiple unasked-for strategies burns time on zero-scoring features.
      Going fully concrete forfeits the follow-up, and pricing was a stated requirement,
      so skipping it is under-delivery.
    ref: "concepts.md#yagni--you-arent-gonna-need-it"

  - id: design-principles-beyond-solid-015
    difficulty: beginner
    tags: [yagni, requirements-clarification]
    question: |
      In the first five minutes of "design a parking lot," the interviewer confirms a
      single lot and in-memory storage is fine. What does YAGNI tell you to do?
    options:
      - "Skip the LotRegistry and ORM discussion entirely — one ParkingLot object and a Map-backed repository"
      - "Build a LotRegistry anyway since multi-lot is an obvious future need"
      - "Add a database abstraction layer with connection pooling stubs to show depth"
      - "Design the multi-lot data model on the whiteboard but implement single-lot"
    answer: 0
    explanation: |
      YAGNI is your scope-control weapon: requirements were explicitly confirmed OUT, so
      any multi-lot or persistence machinery is speculative cost that crowds out required
      features. Even whiteboarding the unneeded model spends shared time on a
      non-requirement; a one-line verbal note ("multi-lot would wrap this in a registry")
      is the cheap version if you want credit.
    ref: "concepts.md#yagni--you-arent-gonna-need-it"

  - id: design-principles-beyond-solid-016
    difficulty: intermediate
    tags: [yagni, design-reasoning]
    question: |
      Which of these actions during a vending-machine design most clearly VIOLATES YAGNI?
    options:
      - "Defining an InventoryService interface because the interviewer said restocking rules will change next"
      - "Using an enum for coin denominations stated in the requirements"
      - "Returning a DispenseResult object so the CLI can print outcomes"
      - "Implementing a multi-currency exchange-rate module because vending machines abroad might need it"
    answer: 3
    explanation: |
      Multi-currency support was never asked for and "might need it someday" is exactly
      the speculation YAGNI forbids — it has build cost, carry cost, and will likely be
      wrong if internationalization ever really arrives. The interface for a flagged-
      volatile axis is Protected Variations (a paid-for seam), and the enum and result
      object directly serve stated requirements.
    ref: "concepts.md#yagni--you-arent-gonna-need-it"

  - id: design-principles-beyond-solid-017
    difficulty: intermediate
    tags: [composition-over-inheritance, class-explosion]
    question: |
      Vehicles vary independently by engine (electric, petrol, hybrid) and body (car,
      truck, van). Modeling every combination as a subclass needs up to 9 classes.
      What does composition need, and why?
    options:
      - "9 classes as well, but organized in two parallel trees"
      - "3 classes — body types absorb engine differences via overloaded constructors"
      - "6 components (3 engines + 3 bodies) composed into one Vehicle class, because independent axes multiply under inheritance but add under composition"
      - "1 class with a switch statement over an (engine, body) pair"
    answer: 2
    explanation: |
      With m and n independent variants, inheritance forces up to m x n subclasses (every
      combination), while composition needs m + n components each owning one axis, wired
      into a Vehicle that delegates. This additive-vs-multiplicative growth is the core
      argument for composition (and the motivation for the Bridge pattern). The switch
      version reintroduces the combinatorial logic in conditional form.
    ref: "concepts.md#composition-over-inheritance"

  - id: design-principles-beyond-solid-018
    difficulty: beginner
    tags: [composition-over-inheritance, delegation]
    question: |
      In "composition + delegation," what exactly does delegation mean?
    options:
      - "The subclass calls super() to reuse the parent's constructor"
      - "A static utility class performs the work on behalf of all instances"
      - "Two classes implement the same interface so callers can't tell them apart"
      - "The outer object forwards the work to a composed part (e.g., vehicle.start() calls engine.start()), optionally adding behavior around it"
    answer: 3
    explanation: |
      Delegation is the mechanism that makes composition do what inheritance does:
      instead of inheriting start(), Vehicle HOLDS an Engine and forwards start() to it.
      Strategy, State, and Decorator are all this shape with different intents. super()
      calls are inheritance, shared interfaces are polymorphism, and static utilities
      are procedural — none capture the forward-to-a-part relationship.
    ref: "concepts.md#composition-over-inheritance"

  - id: design-principles-beyond-solid-019
    difficulty: intermediate
    tags: [composition-over-inheritance, trade-offs]
    question: |
      Which capability does composition give you that class inheritance fundamentally
      CANNOT?
    options:
      - "Swapping the composed behavior at runtime — an object's class is fixed at construction, but its parts can be replaced"
      - "Sharing code between two classes"
      - "Substituting a specialized object where a general one is expected"
      - "Overriding a single method while keeping the rest"
    answer: 0
    explanation: |
      Inheritance binds behavior at compile time and an object can never change its
      class, but a composed field (a Strategy, a State) can be reassigned mid-flight —
      an elevator changes ElevatorState objects while remaining the same elevator.
      Code sharing and selective overriding are things inheritance does do, and
      substitution is precisely inheritance's strength (Liskov), so those aren't
      composition-exclusive.
    ref: "concepts.md#composition-over-inheritance"

  - id: design-principles-beyond-solid-020
    difficulty: advanced
    tags: [composition-over-inheritance, diamond-problem]
    question: |
      Class D wants behavior from both B and C, which each override method m() from
      their common ancestor A. Java forbids `class D extends B, C`. How does a
      composition-based design resolve this "diamond" cleanly?
    options:
      - "Make m() static in A so it can't be overridden and the ambiguity vanishes"
      - "Have D implement two marker interfaces and rely on the JVM to pick an m()"
      - "Use reflection to invoke whichever m() matches at runtime"
      - "D holds a B and a C as fields and explicitly chooses which one to forward m() to (possibly different ones per method)"
    answer: 3
    explanation: |
      The diamond problem is an ambiguity about which inherited implementation wins.
      Composition dissolves the ambiguity because forwarding is explicit: D decides,
      per call, whether b.m() or c.m() runs — there is no implicit resolution rule to
      fight. Static methods change dispatch semantics without giving D both behaviors,
      marker interfaces carry no implementation, and reflection is unrelated machinery.
    ref: "concepts.md#composition-over-inheritance"

  - id: design-principles-beyond-solid-021
    difficulty: intermediate
    tags: [composition-over-inheritance, patterns]
    question: |
      "Two independent axes of variation should each become a composed component instead
      of a subclass grid" is the motivating insight behind which GoF pattern?
    options:
      - "Singleton"
      - "Bridge"
      - "Template Method"
      - "Flyweight"
    answer: 1
    explanation: |
      Bridge exists precisely to split a class hierarchy that varies along two
      independent dimensions (abstraction and implementation) into two composed
      hierarchies, turning m x n subclasses into m + n classes. Template Method is
      inheritance-based reuse (the opposite lever), Singleton is about instance control,
      and Flyweight is about sharing state. See the dp-* topics for Bridge mechanics.
    ref: "concepts.md#composition-over-inheritance"

  - id: design-principles-beyond-solid-022
    difficulty: intermediate
    tags: [is-a-has-a, liskov]
    question: |
      Why does `Square extends Rectangle` fail the is-a checklist even though every
      square IS mathematically a rectangle?
    options:
      - "Behavioral substitution breaks: callers of setWidth() expect height unchanged, but Square must couple them — surprising every Rectangle client"
      - "Java would require Square to redeclare both width and height"
      - "Rectangle has more fields than Square needs, wasting memory"
      - "Squares should be immutable value objects, and Rectangle is mutable"
    answer: 0
    explanation: |
      The is-a test is about substitutable BEHAVIOR, not real-world taxonomy: code
      written against Rectangle's contract (independent width/height) breaks when handed
      a Square that silently changes both. That's a Liskov violation, which the
      checklist puts first. Memory and field-declaration concerns are irrelevant, and
      while immutability would dodge the issue, it isn't why the inheritance is wrong.
    ref: "concepts.md#the-is-a-vs-has-a-decision-test"

  - id: design-principles-beyond-solid-023
    difficulty: intermediate
    tags: [is-a-has-a, composition-over-inheritance]
    question: |
      You modeled FlyingBird and FlightlessBird subclasses. The interviewer says: "a bird
      can be injured and temporarily lose the ability to fly." Why does this requirement
      break the inheritance design, and what's the fix?
    options:
      - "Objects cannot change class at runtime, so a bird can't move between subclasses — compose a replaceable FlightBehavior instead"
      - "Java forbids sibling casting, so add a canFly boolean to the base class and check it everywhere"
      - "The subclasses violate DRY — merge them back into Bird with copy-pasted fly logic"
      - "Injury is a cross-cutting concern that requires an aspect-oriented framework"
    answer: 0
    explanation: |
      A FlyingBird instance is forever a FlyingBird — class is fixed at construction, but
      the requirement demands the capability vary at RUNTIME. Composing a FlightBehavior
      field (swap CanFly for CannotFly on injury) models it directly; this is checklist
      item 3 (will it vary at runtime → composition). A base-class boolean scatters
      conditionals through every caller, defeating polymorphism.
    ref: "concepts.md#the-is-a-vs-has-a-decision-test"

  - id: design-principles-beyond-solid-024
    difficulty: advanced
    tags: [is-a-has-a, api-design]
    question: |
      java.util.Stack extends Vector, so callers can legally do
      stack.insertElementAt(x, 2), corrupting LIFO order. Which checklist rule does this
      design violate, and what would the composition fix look like?
    options:
      - "The runtime-variation rule — Stack should hold a swappable OrderingStrategy"
      - "The single-axis rule — Stack varies along two dimensions"
      - "The data-sharing rule — Stack and Vector share fields, so a common parent was needed"
      - "The 'want only part of the parent's interface' rule — Stack should HOLD a list privately and expose only push/pop/peek"
    answer: 3
    explanation: |
      Stack wants a small slice of Vector's behavior but inheritance grants callers the
      ENTIRE surface, including operations that break the LIFO invariant. When you'd need
      to stub or forbid inherited methods, it was never is-a. Composition fixes it: a
      private list field, with push/pop/peek as the only public API — the invariant
      becomes unbreakable from outside. (This is also why ArrayDeque is preferred today.)
    ref: "concepts.md#the-is-a-vs-has-a-decision-test"

  - id: design-principles-beyond-solid-025
    difficulty: beginner
    tags: [law-of-demeter, coupling]
    question: |
      Under the Law of Demeter, a method may call methods on all of the following
      EXCEPT:
    options:
      - "Its own fields"
      - "An object returned by a call on one of its parameters (a 'stranger')"
      - "Objects it created locally within the method"
      - "Its parameters"
    answer: 1
    explanation: |
      LoD's allowed collaborators are: this, its fields, its parameters, and objects it
      creates locally. Objects OBTAINED from other calls are strangers — calling through
      them (a.getB().doX()) couples you to the internal structure of your collaborators.
      That reach-through is exactly what produces train-wreck chains and structural
      coupling.
    ref: "concepts.md#law-of-demeter--dont-talk-to-strangers"

  - id: design-principles-beyond-solid-026
    difficulty: intermediate
    tags: [law-of-demeter, parking-lot, refactoring]
    question: |
      ExitGate computes a fee via
      lot.getFloor(f).getSpot(s).getSpotType().getPricing().compute(d).
      What is the LoD-respecting fix?
    options:
      - "Cache the intermediate objects in local variables so each line has only one dot"
      - "Add null checks after each getter so the chain can't throw NPE"
      - "Delegate: expose lot.feeFor(ticket) so the lot internally navigates its own structure (or push fee() onto the ticket with a policy)"
      - "Make all the getters return Optionals and chain with map()"
    answer: 2
    explanation: |
      The defect is that ExitGate knows the lot's four-level internal graph, so any
      structural refactor breaks it. Delegation moves the navigation INSIDE the object
      that owns the structure — callers ask for the outcome (feeFor), not the internals.
      Local variables and Optional chains only re-spell the same coupling; null checks
      treat a symptom while deepening dependence on the chain.
    ref: "concepts.md#law-of-demeter--dont-talk-to-strangers"

  - id: design-principles-beyond-solid-027
    difficulty: intermediate
    tags: [law-of-demeter, fluent-api]
    question: |
      Why is ticketBuilder.spot(s).vehicle(v).entryTime(t).build() NOT a Law of Demeter
      violation despite having many dots?
    options:
      - "It is a violation, but an acceptable one because builders are short-lived"
      - "Builders are exempted because they are a GoF pattern"
      - "Every call returns the same builder (this), so there is only ONE collaborator — LoD counts strangers, not dots"
      - "Because the chain ends in build(), which resets the coupling"
    answer: 2
    explanation: |
      The train-wreck smell is traversing DIFFERENT objects' internals — each getB() hands
      you a new stranger. A fluent builder returns itself at every step, so the caller
      talks to exactly one object it created locally (explicitly allowed by LoD). The
      exemption comes from the collaborator count, not from pattern status, lifespan, or
      the terminal method's name.
    ref: "concepts.md#law-of-demeter--dont-talk-to-strangers"

  - id: design-principles-beyond-solid-028
    difficulty: advanced
    tags: [law-of-demeter, design-reasoning]
    question: |
      An interviewer pushes back: "getFloor().getSpot() chains are just a style issue."
      What is the strongest engineering (non-stylistic) counter-argument?
    options:
      - "Long lines exceed most teams' 120-character formatting limit"
      - "Chained calls are measurably slower due to repeated virtual dispatch"
      - "Debuggers cannot step into chained calls, hurting troubleshooting"
      - "The caller becomes coupled to the transitive object STRUCTURE — remove floors or move pricing, and this distant class breaks — and intermediate objects are forced to expose internals as getters"
    answer: 3
    explanation: |
      The real defect is structural coupling leaking across module boundaries: the
      caller encodes lot→floor→spot→pricing knowledge, multiplying the blast radius of
      any refactor along the chain, and it pressures every intermediate class into
      getter-exposing anemia (breaking encapsulation). Performance, line length, and
      debugger ergonomics are negligible or false — they'd rightly be dismissed as pedantry.
    ref: "concepts.md#law-of-demeter--dont-talk-to-strangers"

  - id: design-principles-beyond-solid-029
    difficulty: beginner
    tags: [tell-dont-ask, vending-machine]
    question: |
      Client code checks machine.getState(), machine.getBalance(), and inventory count,
      then calls three setters to perform a dispense. Which principle is violated, and
      what is the essence of the violation?
    options:
      - "DRY — the three getters repeat the machine's field names"
      - "Tell-Don't-Ask — the client queries state, makes the machine's decision outside it, and pushes results back via setters"
      - "YAGNI — the client checks conditions that were never requirements"
      - "Law of Demeter — three method calls on one object exceed the limit"
    answer: 1
    explanation: |
      Ask-then-decide moves the machine's business rules into client code: every entry
      point must re-implement the checks, the machine cannot defend its invariants, and
      the check/mutate gap invites races. Tell-Don't-Ask says expose one command —
      machine.dispense(code) — that decides internally. LoD permits many calls on a
      direct collaborator; the count of calls isn't the issue.
    ref: "concepts.md#tell-dont-ask"

  - id: design-principles-beyond-solid-030
    difficulty: beginner
    tags: [tell-dont-ask, api-design]
    question: |
      Which method signature best reflects Tell-Don't-Ask for a banking domain object?
    options:
      - "double getBalance() paired with void setBalance(double)"
      - "DebitResult debit(Money amount) — one command that checks and mutates atomically inside Account"
      - "boolean canDebit(double amount) called before setBalance()"
      - "AccountData toData() returning a struct for an AccountService to operate on"
    answer: 1
    explanation: |
      Telling means one intention-revealing command whose decision logic lives with the
      data: debit() internally validates funds and applies the change, returning an
      outcome. get/set pairs and canDebit-then-set both split the check from the
      mutation (every caller re-implements policy, races appear), and exporting a data
      struct for an external service is the anemic-domain version of the same ask smell.
    ref: "concepts.md#tell-dont-ask"

  - id: design-principles-beyond-solid-031
    difficulty: intermediate
    tags: [tell-dont-ask, trade-offs]
    question: |
      Does Tell-Don't-Ask mean getters are forbidden on domain objects?
    options:
      - "No — queries for display or another layer are fine; the smell is querying in order to make a decision the object could make itself"
      - "Yes — all state access must go through command methods"
      - "Yes for entities, no for services"
      - "No — getters are fine as long as each has a matching setter"
    answer: 0
    explanation: |
      The principle targets ask-THEN-DECIDE: reading state to run business logic that
      belongs inside the object. A receipt printer calling ticket.getEntryTime() to
      display it is a legitimate query — there is no decision to relocate. Banning all
      getters makes objects unusable at boundaries; and get/set symmetry is the anemic
      anti-pattern, not a defense.
    ref: "concepts.md#tell-dont-ask"

  - id: design-principles-beyond-solid-032
    difficulty: advanced
    tags: [tell-dont-ask, concurrency, parking-lot]
    question: |
      Two entry gates race for the last parking spot. How does a Tell-Don't-Ask design
      concretely improve the concurrency story versus ask-then-set?
    options:
      - "It removes the race entirely because commands are queued by the JVM"
      - "It doesn't — concurrency is orthogonal to where the logic lives"
      - "It makes the race benign because both gates read consistent snapshots"
      - "Check-and-occupy live inside ONE method (spot.occupy()/lot.assignSpot()), giving a single place to make atomic — ask-then-set scatters the check/act gap across every caller"
    answer: 3
    explanation: |
      With tell-style design the compare-and-act sequence is encapsulated in one method,
      so one synchronized block (or CAS on the occupied flag) fixes every caller at
      once. With ask-then-set, each gate separately reads isFree() then calls
      setOccupied(), and EVERY such call site must be independently locked — miss one and
      the race returns. The JVM queues nothing automatically, and stale snapshots are
      the problem, not the cure.
    ref: "concepts.md#tell-dont-ask"

  - id: design-principles-beyond-solid-033
    difficulty: beginner
    tags: [separation-of-concerns, testability]
    question: |
      Under time pressure a candidate puts System.out.println and Scanner input calls
      inside the Board class of a chess game. Why does this hurt beyond "style"?
    options:
      - "The domain becomes untestable in isolation and unreusable behind any other interface — I/O is a separate concern that belongs in a thin edge adapter"
      - "Console I/O is too slow for chess move validation"
      - "Scanner is deprecated and should be replaced with BufferedReader"
      - "println breaks thread-safety of the Board's internal arrays"
    answer: 0
    explanation: |
      Mixing I/O into domain logic welds two concerns together: you can't unit-test
      Board.movePiece() without stubbing a console, and exposing the game as an API
      later means surgery on the domain. The SoC fix is free — domain methods RETURN
      results (MoveResult) and the CLI layer prints them. Performance, deprecation, and
      thread-safety claims here are simply false.
    ref: "concepts.md#separation-of-concerns"

  - id: design-principles-beyond-solid-034
    difficulty: beginner
    tags: [separation-of-concerns, layering]
    question: |
      In a machine-coding round, where does "save and look up tickets" belong?
    options:
      - "Inside Ticket itself, since it has all the data to persist"
      - "In ParkingService, alongside the orchestration that uses it"
      - "In a TicketRepository (in-memory Map today) — storage is its own concern behind a narrow interface"
      - "In the CLI layer, which already handles all external interaction"
    answer: 2
    explanation: |
      Storage is a distinct concern: a repository isolates it so the domain stays clean
      and the Map can become a database without touching services or entities.
      Ticket-persists-itself is the Information Expert trap (data ≠ responsibility —
      cohesion vetoes it); burying storage in the service bloats the orchestrator; and
      the CLI is an I/O adapter, not a data store.
    ref: "concepts.md#separation-of-concerns"

  - id: design-principles-beyond-solid-035
    difficulty: intermediate
    tags: [separation-of-concerns, extensibility]
    question: |
      The interviewer asks: "You built this Splitwise as a CLI — now expose it as a REST
      API." Which prior design choice lets you answer 'only one layer changes'?
    options:
      - "Concerns were separated: parsing/printing lived in a thin adapter, and use cases were invoked through a service — so the CLI adapter is replaced and nothing else changes"
      - "All classes were made Serializable from the start"
      - "Every domain method already returned JSON strings"
      - "A singleton ApplicationContext wired all the classes together"
    answer: 0
    explanation: |
      This is SoC's payoff: because I/O was an edge concern and the domain communicated
      via plain objects (ExpenseResult, Balance), swapping CLI for HTTP controllers is a
      one-layer change. Returning JSON from domain methods would be the OPPOSITE —
      leaking a transport concern into the core. Serializable and a singleton context
      don't isolate anything.
    ref: "concepts.md#separation-of-concerns"

  - id: design-principles-beyond-solid-036
    difficulty: beginner
    tags: [cohesion, code-smells]
    question: |
      A ParkingManager class handles spot allocation, fee billing, gate hardware
      control, and monthly reports. Its methods use disjoint groups of fields. What is
      the diagnosis?
    options:
      - "High afferent coupling — too many classes depend on ParkingManager"
      - "Low cohesion — four unrelated responsibilities and reasons to change in one class; split until each has one describable job"
      - "Healthy design — a facade is supposed to aggregate operations"
      - "A Law of Demeter violation — the manager talks to strangers"
    answer: 1
    explanation: |
      Method groups using disjoint field sets is the textbook low-cohesion signal: the
      class is really four classes sharing a namespace, and any of four requirement
      changes churns the same file. A facade DELEGATES to cohesive parts — it doesn't
      implement four domains itself. Nothing in the description involves who depends on
      it (Ca) or call chains (LoD).
    ref: "concepts.md#high-cohesion-low-coupling"

  - id: design-principles-beyond-solid-037
    difficulty: advanced
    tags: [coupling, code-smells]
    question: |
      Rank these couplings from WORST to most acceptable: (a) passing exactly the values
      a method needs, (b) reaching into another object's fields directly, (c) passing a
      flag that tells another method which branch to execute, (d) two classes
      communicating through a mutable global.
    options:
      - "d, c, a, b"
      - "b, d, c, a"
      - "c, b, d, a"
      - "a, b, c, d"
    answer: 1
    explanation: |
      Content coupling (b — reading/writing another object's internals) is the tightest
      bond: any internal change breaks the intruder. Common/global coupling (d) is next —
      invisible shared state links everything touching it. Control coupling (c — flags
      dictating a callee's behavior) means the caller knows the callee's internals
      logically. Data coupling (a — passing just the needed values) is the healthy end
      you aim for.
    ref: "concepts.md#high-cohesion-low-coupling"

  - id: design-principles-beyond-solid-038
    difficulty: intermediate
    tags: [coupling-metrics, vocabulary]
    question: |
      In Robert Martin's package metrics, what do efferent coupling (Ce) and afferent
      coupling (Ca) measure for a class or package?
    options:
      - "Ce = lines importing it, Ca = lines it imports"
      - "Ce = inherited methods, Ca = overridden methods"
      - "Ce = how many things IT depends on (fan-out), Ca = how many things DEPEND ON IT (fan-in)"
      - "Ce = external API calls, Ca = internal method calls"
    answer: 2
    explanation: |
      Mnemonic: efferent flows OUT (its own outgoing dependencies — high Ce means fragile,
      changes elsewhere break it), afferent flows IN (incoming dependents — high Ca means
      changing IT is risky, so it should be stable). These two feed the instability
      metric I = Ce / (Ca + Ce). The other options invent line- and method-counting
      definitions that aren't the model.
    ref: "concepts.md#high-cohesion-low-coupling"

  - id: design-principles-beyond-solid-039
    difficulty: advanced
    tags: [coupling-metrics, instability]
    question: |
      A PricingStrategy interface has Ca = 6 (six classes depend on it) and Ce = 0.
      What is its instability I, and is that healthy for its role?
    options:
      - "I = 0.5 — balanced, the ideal value for all classes"
      - "I = 1 — maximally unstable, which is fine because interfaces are cheap to change"
      - "I = 6 — dangerously high, it should be split into six interfaces"
      - "I = 0 — maximally stable, which is exactly right: heavily-depended-on elements should be abstract and stable"
    answer: 3
    explanation: |
      I = Ce / (Ca + Ce) = 0 / 6 = 0: it depends on nothing and much depends on it. That
      is the healthy configuration — the things everyone leans on should be abstractions
      that rarely change (stable), while volatile concrete classes like WeekendPricing
      sit at I ≈ 1 as leaves nothing depends on. Pain is the opposite: a concrete,
      hard-to-change class with high Ca. There is no universal 'ideal 0.5'.
    ref: "concepts.md#high-cohesion-low-coupling"

  - id: design-principles-beyond-solid-040
    difficulty: intermediate
    tags: [cohesion, coupling, trade-offs]
    question: |
      "Just merge everything into one class — then there's no coupling at all!" What is
      the flaw in this argument?
    options:
      - "One class actually has infinite coupling by definition"
      - "Cohesion and coupling trade at the extremes: the god class has minimal external coupling but ZERO cohesion — all the dependencies still exist, just hidden inside one file where they're hardest to manage"
      - "Compilers reject classes above a certain size"
      - "It violates the Law of Demeter, which mandates at least three classes"
    answer: 1
    explanation: |
      Coupling doesn't disappear when you co-locate everything — the same
      interdependencies remain as tangled field access and method interplay, now without
      any boundaries to reason about. The design goal is the balance: cohesive units
      (each one describable job) coupled narrowly through stable abstractions. The
      thousand-nano-class extreme fails in the mirror-image way (a coupling web).
    ref: "concepts.md#high-cohesion-low-coupling"

  - id: design-principles-beyond-solid-041
    difficulty: beginner
    tags: [grasp, vocabulary]
    question: |
      What question do the GRASP patterns fundamentally answer, and how do they differ
      from GoF design patterns?
    options:
      - "'How do I structure a class hierarchy?' — they are stricter versions of GoF patterns"
      - "'How do I document a design?' — they are UML diagramming conventions"
      - "'Which class should own this responsibility?' — they are decision principles you demonstrate when placing methods, not class structures you instantiate"
      - "'How do I optimize object allocation?' — they are performance idioms"
    answer: 2
    explanation: |
      GRASP (from Larman's Applying UML and Patterns) guides responsibility ASSIGNMENT —
      the "who owns this method?" question you face dozens of times per design round.
      GoF patterns are reusable class STRUCTURES; GRASP patterns are the reasoning that
      often leads you to them (e.g., Polymorphism + Protected Variations lead to
      Strategy). You rarely name GRASP aloud — you demonstrate it.
    ref: "concepts.md#grasp--responsibility-assignment-overview"

  - id: design-principles-beyond-solid-042
    difficulty: beginner
    tags: [grasp, information-expert]
    question: |
      Per GRASP's Information Expert, who should compute an Order's total?
    options:
      - "Order sums its LineItems' subtotals, and each LineItem computes its own quantity x price — each class works on the data it holds"
      - "An OrderService that loops over order.getItems() reading each price and quantity"
      - "A TotalCalculator utility with a static method taking raw lists"
      - "The database, via a SUM query, to keep Java objects logic-free"
    answer: 0
    explanation: |
      Information Expert assigns responsibility to the holder of the needed data:
      LineItem knows quantity and price (expert on subtotal), Order aggregates its items
      (expert on total). The service-loop version demands data from the experts and does
      their job — the ask-not-tell anemic pattern that couples the service to LineItem
      internals. Expert is the DEFAULT first move for any new behavior.
    ref: "concepts.md#grasp-information-expert"

  - id: design-principles-beyond-solid-043
    difficulty: advanced
    tags: [grasp, information-expert, trade-offs]
    question: |
      Ticket holds all its own data, so Information Expert seems to say Ticket should
      save itself to storage. Why does the final design give persistence to a
      TicketRepository instead?
    options:
      - "Because repositories are required by the GoF catalog"
      - "Because Ticket lacks the data — it doesn't know its own ID"
      - "Because self-saving objects can't be garbage collected"
      - "Expert only PROPOSES an assignment — cohesion and separation of concerns veto it here, since storage is a different concern that would pollute a domain entity; the repository is a Pure Fabrication that absorbs it"
    answer: 3
    explanation: |
      GRASP patterns interact: Information Expert is the default proposal, but Low
      Coupling / High Cohesion are the evaluative pair that judge it. A Ticket that
      touches storage gains a second reason to change and drags infrastructure into the
      domain. Pure Fabrication exists precisely for this: invent a non-domain class
      (repository) when every domain assignment would damage cohesion.
    ref: "concepts.md#grasp-information-expert"

  - id: design-principles-beyond-solid-044
    difficulty: intermediate
    tags: [grasp, information-expert, parking-lot]
    question: |
      "Can this vehicle fit in this spot?" Per Information Expert, where does canFit()
      belong and why?
    options:
      - "In a SpotMatcher service, so the rule is reusable across lots"
      - "On ParkingSpot, taking the Vehicle as a parameter — the spot holds the deciding data (its size and occupancy)"
      - "On Vehicle, since the vehicle initiates parking"
      - "On ParkingLot, since it owns all the spots"
    answer: 1
    explanation: |
      The decision needs the spot's size and occupancy — data the spot holds — plus the
      vehicle's size, which arrives as a parameter. spot.canFit(vehicle) puts the logic
      with its data. Vehicle would need the spot's internals (backwards coupling);
      ParkingLot doing it per-spot drags spot internals upward; and a matcher service is
      a premature fabrication when a domain expert already exists.
    ref: "concepts.md#grasp-information-expert"

  - id: design-principles-beyond-solid-045
    difficulty: beginner
    tags: [grasp, creator, parking-lot]
    question: |
      Per GRASP's Creator, which class should construct Ticket objects in a parking-lot
      design?
    options:
      - "The CLI layer, since it receives the park command first"
      - "Ticket itself, via a static Ticket.create() that any class may call"
      - "ParkingLot (or the entry flow it owns) — it aggregates tickets and has the initializing data: spot, vehicle, entry time"
      - "A global TicketUtil helper so creation is findable in one file"
    answer: 2
    explanation: |
      Creator says: assign creation to a class that contains/aggregates the created
      object, closely uses it, or holds its initializing data — ParkingLot ticks all
      three. Letting the CLI or a random util call the constructor leaks creation
      knowledge (constructor args, invariants) to classes with no relationship to
      Ticket. A static factory method on Ticket is fine mechanics, but it doesn't answer
      WHO should invoke it.
    ref: "concepts.md#grasp-creator"

  - id: design-principles-beyond-solid-046
    difficulty: intermediate
    tags: [grasp, creator, factory, yagni]
    question: |
      When should the simple GRASP-Creator answer ("the aggregating class calls new")
      escalate to a dedicated Factory in an interview design?
    options:
      - "When construction becomes genuinely conditional — subtype chosen at runtime, or families of related objects — not before (YAGNI)"
      - "Immediately for every domain class, since direct new is a code smell"
      - "Only when the created class has more than three constructor parameters"
      - "Never — factories are enterprise overkill in a 45-minute round"
    answer: 0
    explanation: |
      A Factory is a Pure Fabrication that earns its place when creation logic itself is
      complex: `if premium then ... else ...` subtype selection, or coordinated
      families. Until then, new inside the natural creator is the KISS answer.
      Reflexive factories for every class burn interview minutes on indirection with no
      variability to protect; parameter count calls for a Builder, not a Factory.
    ref: "concepts.md#grasp-creator"

  - id: design-principles-beyond-solid-047
    difficulty: intermediate
    tags: [grasp, controller, code-smells]
    question: |
      Your ParkingService (the GRASP Controller) has grown to 300 lines containing fee
      math, spot-selection loops, and Map-based persistence. What is this smell called
      and what is the fix?
    options:
      - "God object — delete the service and let the CLI call domain objects directly"
      - "Leaky abstraction — the service needs an interface extracted above it"
      - "Feature envy — the domain objects should be merged into the service"
      - "Bloated controller (low cohesion) — a controller should DELEGATE, not do: move fee math to the pricing expert, spot choice to an assignment strategy, persistence to the repository, keeping only orchestration"
    answer: 3
    explanation: |
      The Controller pattern explicitly warns against controllers that perform the work
      they should coordinate. The fix redistributes each responsibility to its expert or
      fabrication and leaves the service as a thin use-case orchestrator. Deleting the
      controller pushes coordination into the UI layer (worse), and merging domain
      logic INTO the service is the direction that caused the bloat.
    ref: "concepts.md#grasp-controller"

  - id: design-principles-beyond-solid-048
    difficulty: beginner
    tags: [grasp, controller, architecture]
    question: |
      In GRASP terms, what is a Controller?
    options:
      - "The class holding the program's main() method"
      - "Any class that contains an if/else dispatching on user input"
      - "The MVC view-model that binds UI widgets to data"
      - "The first object BEHIND the UI that receives a system operation and coordinates the use case — a subsystem facade (VendingMachine) or per-use-case handler — which delegates the real work"
    answer: 3
    explanation: |
      Controller assigns the "receive external event" responsibility: the CLI/UI parses
      input and hands the operation to parkingService.parkVehicle(...), which
      coordinates the experts. It gives you a natural demo entry point and the seam
      where REST could replace CLI. main() is typically the UI edge itself, and a
      controller is defined by its coordination role, not by containing dispatch logic.
    ref: "concepts.md#grasp-controller"

  - id: design-principles-beyond-solid-049
    difficulty: intermediate
    tags: [grasp, polymorphism, extensibility]
    question: |
      Chess move generation is written as `switch (piece.kind) { case KNIGHT: ...; case
      BISHOP: ...; }` in a GameEngine. The interviewer says "add a custom fairy-chess
      piece." What does GRASP Polymorphism prescribe?
    options:
      - "Add the new case and extract the switch into its own MoveTable class"
      - "Keep the switch but sort cases alphabetically for maintainability"
      - "Assign the varying behavior to the types: piece.possibleMoves(board) overridden per piece class, so a new piece is a new class with ZERO edits to the engine"
      - "Use reflection to look up a moves method by the piece's kind string"
    answer: 2
    explanation: |
      When behavior varies by type, GRASP Polymorphism says put the behavior ON the
      types via a polymorphic operation instead of switching on a type tag — this is
      also how you achieve OCP in practice. Every new piece then plugs in without
      touching tested engine code. Relocating or tidying the switch keeps the
      shotgun-edit problem; reflection trades compile-time safety for stringly-typed
      dispatch.
    ref: "concepts.md#grasp-polymorphism-and-protected-variations"

  - id: design-principles-beyond-solid-050
    difficulty: advanced
    tags: [grasp, protected-variations, yagni]
    question: |
      GRASP's Protected Variations tells you to wrap instability points in stable
      interfaces. What is the SENIOR half of applying it in a live design round?
    options:
      - "Wrapping every class in an interface so all variation is pre-protected"
      - "Knowing where NOT to add protection: interface only the axes the requirements flag as volatile (pricing, spot assignment), and say aloud that stable parts stay plain classes (YAGNI)"
      - "Choosing abstract classes over interfaces for all variation points"
      - "Hiding all variation behind a single generic Handler<T> interface"
    answer: 1
    explanation: |
      PV requires PREDICTING instability, and prediction has a cost when wrong:
      blanket-interfacing everything is speculative generality that PV's own trade-off
      analysis (and YAGNI) rejects. The interview move is narrating the judgment:
      "pricing is volatile, interface it; spot layout looks stable, plain class."
      One-implementation-forever interfaces and god-generic handlers are noise, not
      protection.
    ref: "concepts.md#grasp-polymorphism-and-protected-variations"

  - id: design-principles-beyond-solid-051
    difficulty: intermediate
    tags: [grasp, pure-fabrication]
    question: |
      TicketRepository represents no real-world parking concept, yet GRASP endorses it.
      Under what condition does Pure Fabrication justify inventing such a class?
    options:
      - "Whenever a design has fewer than ten classes and needs more structure"
      - "When assigning the responsibility to ANY domain class would wreck its cohesion or coupling — the invented class absorbs it (storage, ID generation, spot-assignment policy)"
      - "When the interviewer explicitly asks for the repository pattern by name"
      - "When the domain class would otherwise exceed 100 lines"
    answer: 1
    explanation: |
      Pure Fabrication is the escape valve for when Information Expert's proposal damages
      the design: Ticket saving itself or ParkingLot generating IDs would drag foreign
      concerns into domain classes. Most GoF participants (factories, strategies,
      adapters) are fabrications. The guard rail: each fabrication must EARN its coupling
      cost — ten *Manager/*Helper classes shredding one use case is fabrication abuse.
    ref: "concepts.md#grasp-pure-fabrication-and-indirection"

  - id: design-principles-beyond-solid-052
    difficulty: advanced
    tags: [grasp, indirection, trade-offs]
    question: |
      "Any problem can be solved by another level of indirection." Per this topic, what
      discipline should govern ADDING an indirection (event bus, repository, mediator)
      in a 45-minute design?
    options:
      - "Add one level between every pair of communicating classes as standard hygiene"
      - "Avoid all indirection until the code is complete, then retrofit"
      - "Prefer indirection only for I/O classes, never between domain objects"
      - "Add it only to break a coupling you can NAME (elevator shouldn't know display panels), because each level adds a hop to trace — reflex indirection violates KISS"
    answer: 3
    explanation: |
      Indirection's benefit is decoupling two elements via an intermediary; its cost is
      comprehension — every hop is another file between a reader and the behavior. The
      test is being able to state the specific coupling being broken and why it matters
      (independent change, testability). Blanket rules in either direction replace the
      judgment the principle demands.
    ref: "concepts.md#grasp-pure-fabrication-and-indirection"

  - id: design-principles-beyond-solid-053
    difficulty: expert
    tags: [grasp, design-reasoning, parking-lot]
    question: |
      In the parking-lot decision trail, the exit flow calls lot.feeFor(ticket) instead
      of navigating lot.getFloor(...).getSpot(...) itself, and pricing sits behind a
      PricingStrategy with only HourlyPricing implemented. Which principle PAIRS
      correctly explain these two choices?
    options:
      - "feeFor: DRY / strategy interface: KISS"
      - "feeFor: Creator / strategy interface: Pure Fabrication"
      - "feeFor: Law of Demeter + Tell-Don't-Ask / strategy interface: Protected Variations constrained by YAGNI (seam now, one implementation)"
      - "feeFor: Controller / strategy interface: Indirection constrained by DRY"
    answer: 2
    explanation: |
      feeFor() replaces a stranger-chain with delegation (LoD) and asks the lot to DO
      the computation rather than exposing structure for the caller to decide with
      (Tell-Don't-Ask). The single-implementation interface is Protected Variations at
      the flagged-volatile pricing axis, with YAGNI capping it at the seam — implement
      only what's required, narrate the rest. Being able to name the principle behind
      each micro-decision is the hire signal this topic drills.
    ref: "concepts.md#putting-it-together-one-parking-lot-decision-trail"
