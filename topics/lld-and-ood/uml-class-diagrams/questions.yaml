topic: "UML Class Diagrams for Interviews"
domain: lld-and-ood
topic_slug: uml-class-diagrams
version: 1
questions:
  - id: uml-class-diagrams-001
    difficulty: beginner
    tags: [interview-method, diagram-purpose]
    question: |
      In a 45-minute machine-coding round, what is the PRIMARY purpose of sketching
      a class diagram in the first 10 minutes?
    options:
      - "To produce polished reference documentation the interviewer can file away afterward"
      - "To get agreement on structure while changes still cost seconds, not a mid-round refactor"
      - "To demonstrate command of the entire UML 2.5 specification and all fourteen diagram types"
      - "To avoid writing any production code at all until the class diagram is completely finished"
    answer: 1
    explanation: |
      The diagram is a design contract with the interviewer: it front-loads the feedback
      loop. If the structure is wrong, you find out while fixing it costs 30 seconds of
      eraser instead of 20 minutes of refactoring code. It is a sketch, not documentation,
      and interview UML is deliberately a small subset of the spec.
    ref: "concepts.md#why-class-diagrams-matter-in-a-45-minute-session"

  - id: uml-class-diagrams-002
    difficulty: beginner
    tags: [relationships, inheritance, notation]
    question: |
      Which UML notation correctly represents inheritance (generalization)?
    options:
      - "Dashed line with an open arrowhead pointing at the parent"
      - "Solid line with a filled diamond at the parent"
      - "Solid line with a hollow triangle pointing at the parent"
      - "Dashed line with a hollow triangle pointing at the child"
    answer: 2
    explanation: |
      Generalization is a solid line with a hollow (unfilled) triangle touching the
      PARENT class. A dashed shaft with the same triangle is interface realization; a
      filled diamond is composition; a dashed open arrow is dependency.
    ref: "concepts.md#inheritance-and-interface-realization"

  - id: uml-class-diagrams-003
    difficulty: beginner
    tags: [composition, aggregation, lifecycle]
    question: |
      A `ParkingLot` creates its `Floor` objects internally, no floor can belong to two
      lots, and deleting the lot makes the floors meaningless. Which relationship should
      you draw between `ParkingLot` and `Floor`?
    options:
      - "Composition — filled diamond at ParkingLot"
      - "Aggregation — hollow diamond at ParkingLot"
      - "Dependency — dashed arrow from ParkingLot to Floor"
      - "Inheritance — triangle at ParkingLot"
    answer: 0
    explanation: |
      All three composition tests pass: the part dies with the whole, the whole constructs
      the part, and the part belongs to at most one whole. That is a filled (solid)
      diamond on the whole's side. Aggregation would claim floors live independently of
      the lot, which contradicts the scenario.
    ref: "concepts.md#aggregation-vs-composition"

  - id: uml-class-diagrams-004
    difficulty: beginner
    tags: [mermaid, syntax, inheritance]
    question: |
      In Mermaid classDiagram syntax, which line correctly declares "Car is a Vehicle"?
    options:
      - "Vehicle --|> Car"
      - "Vehicle *-- Car"
      - "Vehicle ..> Car"
      - "Car --|> Vehicle"
    answer: 3
    explanation: |
      `Car --|> Vehicle` draws the hollow triangle at Vehicle, the parent. The equivalent
      spelling is `Vehicle <|-- Car`. Option A (`Vehicle --|> Car`) points the triangle at
      Car, claiming Vehicle is a kind of Car — the most common notation error in interviews.
    ref: "concepts.md#mermaid-classdiagram-cheat-sheet"

  - id: uml-class-diagrams-005
    difficulty: intermediate
    tags: [association, dependency, coupling]
    question: |
      `EntryGate.issueTicket(Vehicle v)` takes a `Vehicle` parameter but stores no
      `Vehicle` field. What relationship should the diagram show from `EntryGate`
      to `Vehicle`?
    options:
      - "Association — solid arrow, because the gate interacts with vehicles"
      - "Dependency — dashed arrow, because the vehicle appears only as a parameter"
      - "Aggregation — hollow diamond, because the gate temporarily holds the vehicle it is servicing"
      - "Composition — filled diamond, because the gate exclusively owns the vehicle while processing it"
    answer: 1
    explanation: |
      The mechanical test is: would this show up as a member field? Parameters, locals,
      and return types with no field are a dependency (dashed open arrow). Drawing a
      solid association would claim structural coupling the code doesn't have.
    ref: "concepts.md#dependency"

  - id: uml-class-diagrams-006
    difficulty: beginner
    tags: [multiplicity, notation]
    question: |
      On an association end, what does the multiplicity `1..*` mean?
    options:
      - "Exactly one instance"
      - "Zero or one instance"
      - "At least one instance (one or more)"
      - "Any number of instances including zero"
    answer: 2
    explanation: |
      `1..*` means one or more — the collection can never be empty, and your constructor
      should enforce that. `1` is exactly one, `0..1` is optional, and `*` (or `0..*`)
      allows zero or more.
    ref: "concepts.md#multiplicity"

  - id: uml-class-diagrams-007
    difficulty: intermediate
    tags: [noun-verb-method, requirements]
    question: |
      During a noun pass over "members borrow books and pay late fines," you list
      `Member`, `Book`, `Fine`, `LatePeriod`, and `Amount` as classes. What is the
      main problem with this candidate list?
    options:
      - "It should also include Library, Shelf, and Librarian to be complete"
      - "The nouns should have been modeled as methods instead"
      - "`Fine` cannot be a class because it has no behavior"
      - "`LatePeriod` and `Amount` are attributes/values masquerading as classes"
    answer: 3
    explanation: |
      The noun pass produces candidates, not a design. Step two is filtering: `LatePeriod`
      is likely a duration field and `Amount` a money value on `Fine`. Turning every noun
      into a box yields 20-class anemic diagrams. Adding more classes (option A) makes
      that worse, and `Fine` plausibly owns fine-calculation behavior.
    ref: "concepts.md#nouns-to-classes-verbs-to-methods-the-5-minute-sketch-method"

  - id: uml-class-diagrams-008
    difficulty: intermediate
    tags: [aggregation, lifecycle, design-reasoning]
    question: |
      A `Playlist` contains `Song` objects. Songs exist in the music library regardless
      of playlists, and the same song can appear in many playlists. Which relationship
      and why?
    options:
      - "Aggregation — songs are grouped by the playlist but live and are shared independently"
      - "Composition — filled diamond, because the playlist exclusively owns songs that die with it"
      - "Inheritance — solid triangle, because a Song is a specialized kind of Playlist entry"
      - "Dependency — dashed arrow, because the playlist only references songs transiently as parameters"
    answer: 0
    explanation: |
      Songs outlive playlists and can be shared across several wholes simultaneously —
      both facts rule out composition (which requires exclusive ownership and shared
      lifecycle). A whole-part grouping without lifecycle coupling is exactly aggregation:
      hollow diamond at Playlist.
    ref: "concepts.md#aggregation-vs-composition"

  - id: uml-class-diagrams-009
    difficulty: intermediate
    tags: [interfaces, realization, strategy]
    question: |
      You draw `HourlyPricing` and `FlatRatePricing` connected to a `PricingStrategy`
      interface. Which line style is correct for those connections?
    options:
      - "Solid line with hollow triangle at PricingStrategy"
      - "Solid arrow from PricingStrategy to each implementation"
      - "Dashed line with hollow triangle at PricingStrategy"
      - "Dashed open arrow from each implementation to PricingStrategy"
    answer: 2
    explanation: |
      Implementing an interface is realization: dashed shaft, hollow triangle touching
      the interface (`HourlyPricing ..|> PricingStrategy` in Mermaid). The solid-shaft
      triangle is reserved for class inheritance, where implementation (state) is
      inherited, not just a contract.
    ref: "concepts.md#inheritance-and-interface-realization"

  - id: uml-class-diagrams-010
    difficulty: beginner
    tags: [visibility, class-box]
    question: |
      In a UML class compartment, what do the `+`, `-`, and `#` prefixes on members mean?
    options:
      - "Required, optional, and deprecated members"
      - "Public, private, and protected visibility"
      - "Static, instance, and abstract members"
      - "Getter, setter, and constructor markers"
    answer: 1
    explanation: |
      `+` is public, `-` is private, `#` is protected (and `~` is package-private).
      Statics are underlined (Mermaid: `$` suffix) and abstract members are italicized
      (Mermaid: `*` suffix) — different notations entirely.
    ref: "concepts.md#drawing-a-class-name-attributes-methods"

  - id: uml-class-diagrams-011
    difficulty: intermediate
    tags: [common-mistakes, inheritance, enums]
    question: |
      A candidate draws `CompactCar` and `LargeCar` as subclasses of `Car`, differing
      only in a size value used for spot matching. What should the interviewer-preferred
      design be?
    options:
      - "Keep both subclasses but pull a shared abstract getSize() method up into Car"
      - "Make Car an abstract interface with CompactCar and LargeCar as its two realizations"
      - "Introduce a CarFactory that hides which of the two size subclasses gets instantiated"
      - "A single Car class with a SpotSize enum field — subclass only for different behavior"
    answer: 3
    explanation: |
      Subclassing for attribute differences creates hierarchy with no behavioral payoff:
      every new size means a new class. A `SpotSize` enum field captures the variation in
      data. Inheritance earns its coupling cost only when subtypes genuinely behave
      differently. Options A–C all preserve the unnecessary type explosion.
    ref: "concepts.md#common-mistakes"

  - id: uml-class-diagrams-012
    difficulty: beginner
    tags: [what-to-skip, interview-scope]
    question: |
      Which elements should you generally OMIT from an interview class diagram?
    options:
      - "Getters/setters, audit timestamps, and DTO/mapper/config classes"
      - "Interfaces that act as strategy seams where behavior is meant to be swapped"
      - "Multiplicity on associations that settle a real requirements question about counts"
      - "The 5–8 core domain entities that carry the system's identity and behavior"
    answer: 0
    explanation: |
      Interview diagrams are ruthlessly triaged: show identity/state-defining attributes
      and the public API other classes call. Accessors, audit fields, and infrastructure
      scaffolding are noise. Strategy seams, decision-carrying multiplicity, and core
      entities are exactly what you DO draw.
    ref: "concepts.md#what-to-draw-and-what-to-skip"

  - id: uml-class-diagrams-013
    difficulty: intermediate
    tags: [multiplicity, null-handling, code-mapping]
    question: |
      Your diagram shows `ParkingSpot "1" --> "0..1" Vehicle`. What does this imply
      for the ParkingSpot implementation?
    options:
      - "ParkingSpot holds a List<Vehicle> collection that is allowed to be empty at times"
      - "ParkingSpot's vehicle reference is nullable/Optional and code must handle the empty case"
      - "ParkingSpot's constructor must be handed a non-null Vehicle at the moment of creation"
      - "Vehicle must hold a mandatory non-null reference pointing back to its owning ParkingSpot"
    answer: 1
    explanation: |
      `0..1` maps to a nullable reference or `Optional<Vehicle>` — a free spot has no
      vehicle. `1` would demand a non-null field set at construction, and `*` would mean
      a collection. Multiplicity is load-bearing: it dictates field types and null
      handling before you write a line of code.
    ref: "concepts.md#multiplicity"

  - id: uml-class-diagrams-014
    difficulty: intermediate
    tags: [common-mistakes, god-class, srp]
    question: |
      On your board, one class box has 15 methods and lines radiating to every other
      box. What is this diagram telling you?
    options:
      - "The design is healthily centralized around a single well-chosen facade class"
      - "You need to add more associations to the other classes to balance it"
      - "A god class is forming — split responsibilities before writing code (SRP)"
      - "The class should be converted into an interface so subclasses can share the methods"
    answer: 2
    explanation: |
      A hub box with lines to everything is the visual radiograph of a Single
      Responsibility violation. The diagram's value is exposing this BEFORE code exists,
      when splitting costs an eraser. A deliberate Facade wraps a subsystem behind a
      small API — it doesn't accumulate 15 unrelated methods.
    ref: "concepts.md#common-mistakes"

  - id: uml-class-diagrams-015
    difficulty: beginner
    tags: [association, navigability]
    question: |
      In the association `Ticket --> ParkingSpot`, what does the arrowhead direction
      indicate?
    options:
      - "Construction order — ParkingSpot must be instantiated before any Ticket exists"
      - "Lifecycle ownership — ParkingSpot is automatically deleted whenever its Ticket is deleted"
      - "Generalization — Ticket inherits fields and behavior directly from ParkingSpot"
      - "Navigability — Ticket holds a reference to ParkingSpot, not vice versa"
    answer: 3
    explanation: |
      An open arrowhead on a solid association shows navigability: `Ticket` has a field
      of type `ParkingSpot`, while the spot knows nothing about tickets. Association
      makes no lifecycle claim (that's the diamonds) and no type claim (that's the
      triangle).
    ref: "concepts.md#association"

  - id: uml-class-diagrams-016
    difficulty: intermediate
    tags: [mermaid, syntax, composition]
    question: |
      Which Mermaid line correctly states that a `Floor` is composed of `ParkingSpot`s
      (spots die with the floor)?
    options:
      - "Floor *-- ParkingSpot"
      - "ParkingSpot *-- Floor"
      - "Floor o-- ParkingSpot"
      - "Floor ..> ParkingSpot"
    answer: 0
    explanation: |
      In Mermaid the diamond sits at the character next to the whole: `Floor *-- ParkingSpot`
      puts the FILLED diamond at Floor. Option B reverses ownership (spots own the floor),
      option C is aggregation (hollow diamond, independent lifecycles), and option D is a
      mere dependency.
    ref: "concepts.md#mermaid-classdiagram-cheat-sheet"

  - id: uml-class-diagrams-017
    difficulty: advanced
    tags: [coupling, relationships, trade-offs]
    question: |
      Ranked from weakest to strongest coupling, which ordering of UML relationships
      is correct?
    options:
      - "association < dependency < composition < aggregation < inheritance"
      - "dependency < association < aggregation < composition < inheritance"
      - "inheritance < composition < aggregation < association < dependency"
      - "dependency < aggregation < association < inheritance < composition"
    answer: 1
    explanation: |
      Dependency (transient use, no field) is weakest; association adds a structural
      field; aggregation adds whole-part semantics; composition adds exclusive ownership
      and lifecycle death; inheritance is strongest because the child couples to the
      parent's implementation, not just its interface. This ordering is why "composition
      over inheritance" is a coupling-reduction argument.
    ref: "concepts.md#mermaid-classdiagram-cheat-sheet"

  - id: uml-class-diagrams-018
    difficulty: intermediate
    tags: [abstract-class, interface, design-reasoning]
    question: |
      You must choose between `<<abstract>> Vehicle` and `<<interface>> Vehicle` for
      Car/Truck/Motorcycle. Vehicles share a plate number, an owner, and common
      validation logic. Which is the better call and why?
    options:
      - "Interface, because interfaces always produce looser coupling regardless of shared state"
      - "Interface, because Mermaid and most UML tools cannot render abstract classes at all"
      - "Abstract class, because there is shared state and behavior to inherit along with the contract"
      - "Neither — each vehicle type should be an unrelated concrete class with duplicated fields"
    answer: 2
    explanation: |
      The classic decision rule: pure contract → interface; shared state + partial
      implementation → abstract class. Plate, owner, and validation are inherited state
      and behavior, which realization (dashed triangle) cannot carry. On the diagram this
      choice is visible as solid-triangle generalization instead of dashed-triangle
      realization.
    ref: "concepts.md#inheritance-and-interface-realization"

  - id: uml-class-diagrams-019
    difficulty: beginner
    tags: [dependency, notation]
    question: |
      Which arrow represents a dependency ("uses") relationship in UML?
    options:
      - "Solid line with a filled arrowhead"
      - "Solid line with a hollow diamond"
      - "Dashed line with a hollow triangle"
      - "Dashed line with an open arrowhead"
    answer: 3
    explanation: |
      Dependency is the dashed open arrow (`A ..> B`): A uses B transiently as a
      parameter, local, or return type with no member field. The dashed triangle is
      interface realization, and diamonds are whole-part relationships.
    ref: "concepts.md#dependency"

  - id: uml-class-diagrams-020
    difficulty: intermediate
    tags: [worked-example, strategy, seams]
    question: |
      In the parking-lot diagram, `ParkingLot` has a solid arrow to the `PricingStrategy`
      INTERFACE rather than to `HourlyPricing`. What design property does this express?
    options:
      - "A swappable policy seam — the lot depends on the contract, so pricing changes without touching ParkingLot"
      - "That the concrete HourlyPricing object is garbage-collected the instant its owning ParkingLot is destroyed"
      - "That PricingStrategy is the abstract parent class that ParkingLot inherits its fee fields from"
      - "That every pricing calculation is dispatched to run on a separate background worker thread"
    answer: 0
    explanation: |
      Association to an interface, with implementations hanging off it via dashed
      triangles, is the diagram signature of the Strategy pattern (see dp-strategy):
      ParkingLot is coupled to the contract only. Swapping or adding pricing models never
      edits ParkingLot — the extensibility answer interviewers fish for.
    ref: "concepts.md#worked-example-parking-lot-in-six-boxes"

  - id: uml-class-diagrams-021
    difficulty: intermediate
    tags: [common-mistakes, notation, inheritance]
    question: |
      A candidate writes `Vehicle --|> Car` in Mermaid. What have they actually claimed?
    options:
      - "Car and Vehicle are associated bidirectionally"
      - "Vehicle is a kind of Car — the hierarchy is inverted"
      - "Vehicle is a whole composed of Car parts"
      - "Car realizes the Vehicle contract interface"
    answer: 1
    explanation: |
      `--|>` points the hollow triangle at the right-hand class, marking it as the
      parent. `Vehicle --|> Car` therefore says Vehicle inherits from Car. The triangle
      must always touch the parent — pointing it at the child is the single most common
      whiteboard notation error and inverts the entire hierarchy.
    ref: "concepts.md#common-mistakes"

  - id: uml-class-diagrams-022
    difficulty: advanced
    tags: [composition, code-mapping, encapsulation]
    question: |
      Which code shape most faithfully implements a COMPOSITION relationship
      (`ParkingLot *-- Floor`)?
    options:
      - "ParkingLot's constructor accepts a List<Floor> built by the caller and stores it"
      - "ParkingLot holds a shared static registry into which every floor in the process registers itself"
      - "ParkingLot constructs its floors internally and never leaks mutable references to the collection"
      - "Floor holds a back-reference to its ParkingLot and registers itself with the lot at startup"
    answer: 2
    explanation: |
      Composition means the whole creates, exclusively owns, and controls the lifetime of
      its parts. Internal construction plus no leaked mutable references enforces that.
      Accepting externally built floors (option A) is the code shape of AGGREGATION —
      parts exist independently and are handed in.
    ref: "concepts.md#aggregation-vs-composition"

  - id: uml-class-diagrams-023
    difficulty: beginner
    tags: [mermaid, syntax, generics]
    question: |
      How do you write the generic type `List<Ticket>` inside a Mermaid classDiagram
      member declaration?
    options:
      - "List(Ticket) — parentheses wrap the type"
      - "List[Ticket] — square brackets hold the type"
      - "List<Ticket> — angle brackets work as usual"
      - "List~Ticket~ — tildes replace angle brackets"
    answer: 3
    explanation: |
      Mermaid uses tildes for generics (`List~Ticket~`, `Optional~ParkingSpot~`) because
      `<` and `>` collide with its arrow syntax (`<|--`, `-->`). Angle brackets inside a
      class body break the parse.
    ref: "concepts.md#mermaid-classdiagram-cheat-sheet"

  - id: uml-class-diagrams-024
    difficulty: intermediate
    tags: [sketch-method, scenario-walk]
    question: |
      After drawing your boxes and lines, you mentally walk the scenario "vehicle
      arrives, strategy picks a spot, ticket is issued" through the diagram. What is
      this step primarily checking?
    options:
      - "That the whole diagram still fits inside the visible bounds of the whiteboard"
      - "That every class box carries at least three methods to look sufficiently detailed"
      - "That every hop in a real use case has a relationship line to travel on — missing lines are design bugs"
      - "That the multiplicities on each association end sum to a consistent total across the diagram"
    answer: 2
    explanation: |
      The scenario walk validates the structure against behavior: if the gate must ask a
      strategy for a spot but no line connects them, you found a missing relationship (or
      a missing class) for free, before coding. It's the cheapest design review you'll
      ever run.
    ref: "concepts.md#nouns-to-classes-verbs-to-methods-the-5-minute-sketch-method"

  - id: uml-class-diagrams-025
    difficulty: intermediate
    tags: [multiplicity, requirements, design-decisions]
    question: |
      For a library system, the difference between `Member "1" --> "0..1" Loan` and
      `Member "1" --> "*" Loan` is best described as:
    options:
      - "A product/requirements decision — can a member hold multiple simultaneous loans? — that should be asked, not assumed"
      - "Purely cosmetic notation — both multiplicities compile down to the exact same field type"
      - "A performance tuning choice between backing the loans with a HashMap versus an ArrayList"
      - "A notation difference between the UML 1.x and UML 2.x multiplicity specifications"
    answer: 0
    explanation: |
      `0..1` becomes a nullable reference; `*` becomes a collection — two different
      products, two different APIs. Multiplicity that encodes a real decision is exactly
      where you pause and ask the interviewer, which is why the requirements-clarification
      phase and the diagram feed each other.
    ref: "concepts.md#multiplicity"

  - id: uml-class-diagrams-026
    difficulty: beginner
    tags: [aggregation, notation]
    question: |
      What does a HOLLOW (open) diamond at one end of a solid line mean?
    options:
      - "Generalization — the diamond-side class is an abstract parent the other inherits from"
      - "Aggregation — the diamond-side class groups parts that can exist independently"
      - "Composition — the diamond-side class owns parts that die with it"
      - "The diamond-side class depends on the other class"
    answer: 1
    explanation: |
      Hollow diamond = aggregation, sitting on the WHOLE's side: a Team aggregates
      Players who exist before, after, and outside the team. The filled diamond upgrades
      the claim to exclusive ownership plus shared lifecycle (composition).
    ref: "concepts.md#aggregation-vs-composition"

  - id: uml-class-diagrams-027
    difficulty: advanced
    tags: [follow-ups, extensibility, ocp]
    question: |
      Interviewer: "Now add EV charging spots." Which diagram change best demonstrates
      the Open/Closed Principle?
    options:
      - "Add an isEV boolean flag to ParkingLot and branch on it inside the existing park() method"
      - "Redraw ParkingSpot with charging methods that quietly no-op for every regular non-EV spot"
      - "Add a new ParkingSpot subtype (or capability + strategy) so new boxes appear but no existing lines change"
      - "Create an EVParkingLot subclass that extends ParkingLot and overrides the whole park() method"
    answer: 2
    explanation: |
      The OCP answer on a diagram is visually checkable: extension adds boxes and lines
      without editing existing ones. A new spot subtype (or a charging capability behind
      an interface) does that. Booleans-plus-branches modify existing classes, no-op
      methods violate LSP/ISP, and forking the lot duplicates everything.
    ref: "concepts.md#common-interview-follow-ups"

  - id: uml-class-diagrams-028
    difficulty: intermediate
    tags: [what-to-draw, class-count]
    question: |
      Your parking-lot diagram has 22 boxes including `LicensePlate`, `Color`,
      `Timestamp`, and `SpotId`. What's the core problem?
    options:
      - "The boxes should be grouped into named UML packages to organize that many classes"
      - "The value classes are missing the <<value>> stereotypes that would make them valid"
      - "There are not enough interface seams defined to support that many concrete classes"
      - "Attributes and values are drawn as classes — an interview diagram carries roughly 5–10 boxes"
    answer: 3
    explanation: |
      A box per noun is a classic failure: `LicensePlate` is a String field on Vehicle,
      `Color` an attribute, `Timestamp` a field on Ticket. Classes earn a box by owning
      behavior or identity. Twenty boxes drown the 6 that matter and eat your 45 minutes.
    ref: "concepts.md#what-to-draw-and-what-to-skip"

  - id: uml-class-diagrams-029
    difficulty: intermediate
    tags: [association, bidirectional, trade-offs]
    question: |
      Why should you generally prefer a UNIDIRECTIONAL association (e.g., Ticket knows
      its ParkingSpot, but not vice versa) over a bidirectional one?
    options:
      - "Bidirectional associations are explicitly forbidden by the UML 2.x specification"
      - "Two mutual references must be kept consistent — a maintenance tax you should pay only when a real use case needs reverse traversal"
      - "Unidirectional association lines are rendered noticeably faster by the Mermaid engine"
      - "Bidirectional associations always create reference cycles that leak memory at runtime"
    answer: 1
    explanation: |
      Bidirectionality means two fields that can drift out of sync and coupling in both
      directions. Point the arrow the way queries actually flow, and add the reverse
      reference only when a concrete scenario demands it. It's legal UML — just usually
      a worse default.
    ref: "concepts.md#association"

  - id: uml-class-diagrams-030
    difficulty: beginner
    tags: [mermaid, static, abstract]
    question: |
      In Mermaid classDiagram member syntax, what do the `$` and `*` suffixes on a
      method mean, respectively?
    options:
      - "static and abstract"
      - "abstract and static"
      - "private and public"
      - "final and synchronized"
    answer: 0
    explanation: |
      `+getInstance()$` is static (UML renders statics underlined) and `+area()*` is
      abstract (UML renders abstract members in italics — impossible on a whiteboard,
      which is why the `<<abstract>>` stereotype is the practical substitute there).
    ref: "concepts.md#drawing-a-class-name-attributes-methods"

  - id: uml-class-diagrams-031
    difficulty: advanced
    tags: [design-reasoning, dependency, factory]
    question: |
      Your diagram shows `EntryGate ..> Ticket : creates`. The interviewer asks what
      you'd do if ticket creation later needs QR codes, digital receipts, and validation
      variants. What does the dashed "creates" arrow set you up for?
    options:
      - "Converting the dependency into a composition so that tickets are destroyed together with the gate"
      - "Making Ticket a subclass of EntryGate so it inherits the creation logic directly"
      - "Introducing a Factory (see dp-factory-method) at the creation point without restructuring the rest of the diagram"
      - "Moving all ticket creation responsibility into the Vehicle class that arrives at the gate"
    answer: 2
    explanation: |
      Explicitly drawing WHO creates tickets answers a question interviewers actually ask
      and localizes the creation decision. When construction grows complex, that single
      dashed arrow becomes an arrow to a TicketFactory — a one-box change. Tickets
      outliving the gate rules out composition, and the other options confuse
      responsibilities.
    ref: "concepts.md#dependency"

  - id: uml-class-diagrams-032
    difficulty: intermediate
    tags: [common-mistakes, composition, over-claiming]
    question: |
      A candidate connects EVERY pair of related classes with filled diamonds "to look
      thorough." Why is this worse than defaulting to plain associations?
    options:
      - "Filled diamonds force the layout engine to render the whole diagram noticeably slower"
      - "Each filled diamond claims exclusive ownership and lifecycle death — strong claims you'll be asked to defend and mostly can't"
      - "Composition has been formally deprecated in favor of aggregation in modern UML"
      - "Plain associations must always be drawn first before any diamond may be added to them"
    answer: 1
    explanation: |
      Composition is the strongest whole-part claim: at most one owner, part dies with
      whole. `Ticket *-- Vehicle` would claim vehicles are destroyed with their tickets —
      absurd, and a senior interviewer will probe it. An unjustified composition is a
      stronger error than a plain line, which claims almost nothing.
    ref: "concepts.md#common-mistakes"

  - id: uml-class-diagrams-033
    difficulty: beginner
    tags: [interfaces, stereotypes]
    question: |
      How do you mark a class box as an interface on a whiteboard or in Mermaid?
    options:
      - "Draw the class box with a dashed border instead of a solid one"
      - "Underline the class name in the top name compartment"
      - "Write the class name entirely in capital letters"
      - "Add the <<interface>> stereotype above/inside the name compartment"
    answer: 3
    explanation: |
      Guillemet stereotypes (`<<interface>>`, `<<abstract>>`, `<<enumeration>>`) annotate
      the name compartment, and Mermaid supports them directly inside the class body.
      Dashed lines are for realization/dependency edges, not class borders.
    ref: "concepts.md#drawing-a-class-name-attributes-methods"

  - id: uml-class-diagrams-034
    difficulty: intermediate
    tags: [sketch-method, responsibility-assignment]
    question: |
      In the verb-assignment step, "calculate parking fee" needs data from both the
      Ticket (duration) and the tariff rules. Neither class is a natural sole owner.
      What does the method suggest you do?
    options:
      - "Introduce a policy/strategy object (e.g., PricingStrategy) to own the behavior"
      - "Put the calculation method on Ticket, since tickets are the first object created in the flow"
      - "Put a copy of the method on both classes and keep the two implementations synchronized"
      - "Make the fee a free-floating static utility function that belongs to no owning class at all"
    answer: 0
    explanation: |
      A verb with no natural data owner is the classic birth of a service/strategy
      object — this is how `PricingStrategy` emerges from noun-verb analysis (Larman's
      responsibility-assignment thinking). Duplicating logic or dumping it in static
      utilities scatters the rule; putting it on Ticket couples tickets to tariff data
      they shouldn't hold.
    ref: "concepts.md#nouns-to-classes-verbs-to-methods-the-5-minute-sketch-method"

  - id: uml-class-diagrams-035
    difficulty: intermediate
    tags: [multiplicity, reading-direction]
    question: |
      Given `ParkingLot "1" *-- "1..*" Floor`, how do you read the multiplicities?
    options:
      - "One floor belongs to one-or-more parking lots at the same time"
      - "Each floor contains at least one parking lot nested inside it"
      - "One parking lot has one-or-more floors, and each floor belongs to exactly one lot"
      - "Both classes are permitted to exist with zero linked instances"
    answer: 2
    explanation: |
      Read the number at the FAR end from the class you start at: from ParkingLot, follow
      to `1..*` floors; from Floor, follow back to exactly `1` lot. The exactly-one on the
      lot side is also consistent with composition, which forbids a part having two owners.
    ref: "concepts.md#multiplicity"

  - id: uml-class-diagrams-036
    difficulty: advanced
    tags: [follow-ups, encapsulation, api-design]
    question: |
      The interviewer points at `+getSpots() List~ParkingSpot~` on your Floor box and
      asks "is that OK?" What's the strongest answer?
    options:
      - "Yes — callers need the list to find free spots efficiently"
      - "It risks callers mutating internal state — expose intent methods like findFreeSpot() or return an unmodifiable view"
      - "It's fine as long as the list is an ArrayList rather than a LinkedList"
      - "It should be static so all floors share one list"
    answer: 1
    explanation: |
      Returning a live mutable collection lets any caller do `getSpots().add(...)`,
      bypassing every invariant. The diagram should SHOW encapsulation: intent-revealing
      methods (`findFreeSpot(size)`) instead of raw state accessors. This is the
      encapsulation trap follow-up, and it's visible on the diagram before any code
      exists.
    ref: "concepts.md#common-interview-follow-ups"

  - id: uml-class-diagrams-037
    difficulty: beginner
    tags: [diagram-types, state-machines]
    question: |
      The interviewer asks you to show the LIFECYCLE of a Ticket (ACTIVE, PAID, LOST,
      EXITED). Which diagram type answers this question?
    options:
      - "A class diagram with a TicketStatus box per state"
      - "A deployment diagram of the runtime nodes"
      - "A component diagram of the modules"
      - "A state diagram (Mermaid stateDiagram-v2)"
    answer: 3
    explanation: |
      Class diagrams show STRUCTURE; state diagrams show one object's lifecycle and legal
      transitions; sequence diagrams show interactions over time. Knowing which diagram
      answers which question is itself interview signal — elevator and vending-machine
      designs lean on state diagrams heavily.
    ref: "concepts.md#common-interview-follow-ups"

  - id: uml-class-diagrams-038
    difficulty: intermediate
    tags: [aggregation, composition, code-mapping]
    question: |
      In code, `Team`'s constructor is `Team(List<Player> roster)` — players are created
      elsewhere and passed in. Which diagram relationship does this code shape correspond
      to?
    options:
      - "Composition — Team stores the players and therefore controls their lifetime exclusively"
      - "Aggregation — parts pre-exist and are injected, so no lifecycle ownership"
      - "Realization — Team implements the roster contract"
      - "Dependency — the list is only a constructor parameter"
    answer: 1
    explanation: |
      Injection of already-existing parts is the code smell-test for aggregation: the
      whole groups parts it did not create and does not destroy. Composition's shape is
      internal construction. It's not a mere dependency because the roster is stored as a
      structural field.
    ref: "concepts.md#aggregation-vs-composition"

  - id: uml-class-diagrams-039
    difficulty: intermediate
    tags: [interview-method, narration]
    question: |
      While drawing a filled diamond between ParkingLot and Floor, the strongest thing
      to do simultaneously is:
    options:
      - "Say nothing — the notation is self-explanatory, so narration only wastes precious round time"
      - "Recite every UML relationship type you know so the interviewer sees the full breadth of your notation vocabulary"
      - "Narrate the claim: 'filled diamond because floors can't exist without the lot — they die with it'"
      - "Ask the interviewer which diamond they would personally prefer to see drawn at that end of the line"
    answer: 2
    explanation: |
      One sentence of narration per line converts a silent sketch into continuous design
      signal, and forces you to justify the ownership claim to yourself. If you can't
      produce the sentence, you've caught your own error — downgrade to a plain
      association.
    ref: "concepts.md#why-class-diagrams-matter-in-a-45-minute-session"

  - id: uml-class-diagrams-040
    difficulty: advanced
    tags: [navigability, follow-ups, design-reasoning]
    question: |
      "Should Ticket know about Payment, or Payment about Ticket?" What's the guiding
      principle for choosing arrow direction?
    options:
      - "Point navigability the way queries flow (you look up payments from a ticket), unidirectional until a use case needs the reverse"
      - "Always point the arrow from the class defined later in the file toward the one defined earlier"
      - "Always make it bidirectional so no future traversal is ever accidentally blocked"
      - "Point from the class with the larger number of fields toward the one with fewer fields"
    answer: 0
    explanation: |
      Navigability is a query-flow decision: if the use cases ask "what was paid for this
      ticket?", Ticket → Payment serves them. Bidirectional-by-default doubles coupling
      and creates two references to keep consistent; add the reverse only when a concrete
      traversal needs it.
    ref: "concepts.md#common-interview-follow-ups"

  - id: uml-class-diagrams-041
    difficulty: beginner
    tags: [sketch-method, nouns]
    question: |
      In the nouns-to-classes pass, requirement nouns like "customer," "ticket," and
      "spot" become candidate:
    options:
      - "Methods"
      - "Classes"
      - "Multiplicities"
      - "Packages"
    answer: 1
    explanation: |
      Nouns → candidate classes, verbs → methods (assigned to the class owning the data
      the verb changes), and relationships between the nouns → lines. Then you FILTER:
      some nouns collapse to attributes, enums, or ids rather than boxes.
    ref: "concepts.md#nouns-to-classes-verbs-to-methods-the-5-minute-sketch-method"

  - id: uml-class-diagrams-042
    difficulty: intermediate
    tags: [worked-example, lifecycle, vehicles]
    question: |
      In the worked parking-lot diagram, `Vehicle` connects to `ParkingSpot` with a plain
      association rather than any diamond. Why is that correct?
    options:
      - "Vehicle is an abstract base class, and UML forbids any diamond touching an abstract class"
      - "Mermaid's parser rejects composition and aggregation diamonds that connect to abstract classes"
      - "It's a deliberate simplification — ideally the spot would compose the vehicle it holds"
      - "A vehicle's existence is independent of any lot or spot — no ownership or lifecycle claim is true"
    answer: 3
    explanation: |
      A car exists before it parks and after it leaves; no spot owns it and nothing dies
      together. Both diamond types would over-claim. The `0..1` multiplicity plus a plain
      line says exactly what's true: a spot may currently reference one vehicle.
    ref: "concepts.md#worked-example-parking-lot-in-six-boxes"

  - id: uml-class-diagrams-043
    difficulty: intermediate
    tags: [common-mistakes, floating-classes]
    question: |
      Your diagram includes a `NotificationService` box with no lines to anything.
      What's the right move?
    options:
      - "Leave it floating — service classes are standalone and never need relationship lines drawn to them"
      - "Connect it to every other class with dashed dependency arrows so the diagram looks complete"
      - "Walk a scenario that triggers a notification to discover the missing relationship, or cut the class if nothing uses it"
      - "Convert it into an enum of the notification types the system can send"
    answer: 2
    explanation: |
      Floating boxes mean either a forgotten relationship or an unneeded class. The
      scenario walk resolves it: "payment completes → who tells the customer?" reveals
      the real caller (and maybe an Observer seam — see dp-observer). Blanket-connecting
      everything creates spaghetti and hides real coupling decisions.
    ref: "concepts.md#common-mistakes"

  - id: uml-class-diagrams-044
    difficulty: expert
    tags: [relationships, semantics, edge-cases]
    question: |
      An `Order` has a `List<LineItem>` it creates internally, but your product allows
      moving a LineItem to another Order (e.g., order splitting). Strictly speaking,
      which relationship is now correct and why?
    options:
      - "Composition — the order still creates the items internally, and creation alone settles ownership"
      - "Aggregation — transferability between wholes violates composition's exclusive, whole-bound ownership"
      - "Dependency — the items are used only transiently as method parameters, never stored"
      - "Realization — LineItem implements the Order contract and inherits its interface"
    answer: 1
    explanation: |
      Composition (per UML semantics) requires a part to belong to at most one whole AND
      its lifecycle to be bound to that whole; parts being re-parented to another whole
      breaks the strict reading (a composite part removed before the whole's death must be
      the exception, not a designed operation). Designed transferability means aggregation.
      This nuance — creation alone doesn't imply composition — separates senior answers.
    ref: "concepts.md#aggregation-vs-composition"

  - id: uml-class-diagrams-045
    difficulty: intermediate
    tags: [what-to-draw, strategy, brevity]
    question: |
      You have five concrete `PricingStrategy` implementations. How should an
      interview-grade diagram handle them?
    options:
      - "Draw two representative implementations and say 'plus siblings' — the seam matters, not the census"
      - "Draw all five concrete boxes for completeness so no pricing model is left out of the diagram"
      - "Skip the PricingStrategy interface entirely and draw only the five concrete pricing classes"
      - "Merge all five into one class with an internal mode switch selecting the active pricing rule"
    answer: 0
    explanation: |
      The design information is the INTERFACE seam and the fact that implementations hang
      off it. Five near-identical boxes waste board space and minutes. Dropping the
      interface hides the seam, and a mode-switch class reintroduces the if/else chain
      Strategy exists to kill (see dp-strategy).
    ref: "concepts.md#what-to-draw-and-what-to-skip"

  - id: uml-class-diagrams-046
    difficulty: beginner
    tags: [mermaid, return-types]
    question: |
      In Mermaid classDiagram syntax, where does a method's return type go?
    options:
      - "Before the method name, Java-style: +boolean canFit(Vehicle v)"
      - "Inside the parentheses right after the last parameter, like canFit(Vehicle v, boolean)"
      - "After the closing parenthesis: +canFit(Vehicle v) boolean"
      - "Return types cannot be expressed at all in Mermaid classDiagram members"
    answer: 2
    explanation: |
      Mermaid places the return type after the parameter list: `+canFit(Vehicle v) boolean`.
      Writing it Java-style before the name won't render as intended. Small syntax slips
      like this matter when your study site and docs render the diagram literally.
    ref: "concepts.md#drawing-a-class-name-attributes-methods"

  - id: uml-class-diagrams-047
    difficulty: advanced
    tags: [diagram-evolution, interview-method]
    question: |
      Twenty minutes into coding you realize `Gate` should own ticket issuing instead of
      `ParkingLot`. What does strong interview practice look like?
    options:
      - "Silently change the code and hope the interviewer never compares it back to the agreed diagram"
      - "Keep the code aligned to the original diagram, since that structure was already agreed on together"
      - "Erase and redraw the entire diagram from scratch to keep the board perfectly consistent with the code"
      - "Announce the change, update the diagram live, and continue — the diagram is a living sketch, not a contract set in stone"
    answer: 3
    explanation: |
      "UML as sketch" (Fowler) means the diagram serves the design, not vice versa.
      Updating it aloud shows you keep your artifacts truthful and can revise decisions
      on evidence — senior signal. Diverging silently makes the board actively misleading,
      and freezing a known-worse design to honor a sketch is the worst of both.
    ref: "concepts.md#common-mistakes"

  - id: uml-class-diagrams-048
    difficulty: intermediate
    tags: [realization, dashed-lines, memory-hooks]
    question: |
      Why is interface realization drawn DASHED while class inheritance is SOLID, in the
      memory-hook logic of this topic?
    options:
      - "Dashed lines were introduced in a later UML revision than solid lines and gradually replaced them"
      - "Dashed = weaker/no inherited state: realization carries only a contract, while solid generalization inherits implementation"
      - "Solid lines are reserved exclusively for relationships that carry multiplicity annotations"
      - "It's an arbitrary stylistic choice — the two line styles are fully interchangeable in UML"
    answer: 1
    explanation: |
      The hook "dashed = weak" unifies the notation: dashed arrow = transient use (no
      field), dashed triangle = contract only (no inherited state). Solid-shaft
      generalization is the strongest coupling on the board because the child inherits
      the parent's implementation. The distinction is normative UML, not stylistic.
    ref: "concepts.md#inheritance-and-interface-realization"

  - id: uml-class-diagrams-049
    difficulty: intermediate
    tags: [multiplicity, invariants, code-mapping]
    question: |
      Your diagram claims `Floor "1" *-- "1..*" ParkingSpot`. Which implementation
      detail is REQUIRED to make the `1..*` truthful?
    options:
      - "The Floor constructor must establish at least one spot (reject empty), so the collection is never empty"
      - "The spots list must be kept sorted by ascending spot id at all times for the bound to hold"
      - "ParkingSpot must expose a public setFloor() method so each spot can be reassigned to its floor"
      - "The spots collection must be lazily initialized on first access rather than in the constructor"
    answer: 0
    explanation: |
      `1..*` is an invariant: a floor with zero spots must be unrepresentable. If the
      constructor can produce an empty floor, the diagram is aspirational fiction.
      Multiplicity annotations are promises your constructors and mutators must keep —
      that's what makes them worth drawing.
    ref: "concepts.md#multiplicity"

  - id: uml-class-diagrams-050
    difficulty: expert
    tags: [association, dependency, design-reasoning]
    question: |
      `ParkingLot` calls `PaymentGateway.charge(card, amount)` in exactly one method and
      holds no gateway field, obtaining it as a method parameter. A teammate's diagram
      shows `ParkingLot --> PaymentGateway` (solid). What's the precise critique?
    options:
      - "The arrow should be reversed — the gateway is what actually holds a reference back to the lot"
      - "It should be a filled-diamond composition, since the payment records die together with the lot"
      - "The solid line over-claims structural coupling — with no member field this is a dependency, and the diagram misrepresents how coupled the code is"
      - "Nothing is wrong — any call from one class to another fully justifies drawing a solid association"
    answer: 2
    explanation: |
      Association asserts a durable structural link (a field). Parameter-only usage is a
      dependency (dashed). The distinction matters practically: a reviewer reading solid
      lines everywhere concludes the design is far more coupled than it is, and coupling
      inventory is exactly what diagrams exist to communicate.
    ref: "concepts.md#dependency"

  - id: uml-class-diagrams-051
    difficulty: beginner
    tags: [worked-example, reading-diagrams]
    question: |
      In the worked example, `ParkingLot ..> Ticket : issues` tells a reader that:
    options:
      - "Tickets are stored inside the lot as a permanent structural field for its whole lifetime"
      - "Ticket generalizes ParkingLot, inheriting its fields and behavior via the dashed line"
      - "Tickets must be constructed before the lot exists, establishing the creation order"
      - "The lot creates tickets but does not hold them as a structural field"
    answer: 3
    explanation: |
      A dashed arrow labeled "issues/creates" answers the "who constructs tickets?"
      question without claiming storage or ownership. Tickets flow out to customers;
      structurally they point at their spot via a separate association.
    ref: "concepts.md#worked-example-parking-lot-in-six-boxes"

  - id: uml-class-diagrams-052
    difficulty: intermediate
    tags: [inheritance, composition-over-inheritance]
    question: |
      You catch yourself adding `AuditableParkingLot extends ParkingLot` purely to reuse
      logging helpers. Per the guidance in this topic, what should the diagram show
      instead?
    options:
      - "A deeper inheritance hierarchy with an intermediate AbstractAuditableLot layer between the two"
      - "An association from ParkingLot to a logging/audit collaborator — composition over inheritance"
      - "A dashed realization triangle from ParkingLot to a Loggable interface carrying default methods"
      - "A second, unrelated copy of the ParkingLot class with the logging calls inlined throughout it"
    answer: 1
    explanation: |
      Inheriting to reuse code (not to model substitutable is-a behavior) buys the
      strongest coupling on the board for a convenience. Composing a collaborator (a
      solid association to a helper) gets the reuse with swappability and no LSP
      obligations. This is the classic mid-level trap interviewers screen for.
    ref: "concepts.md#inheritance-and-interface-realization"
