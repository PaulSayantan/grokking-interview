topic: "Design a Traffic Signal Controller"
domain: lld-and-ood
topic_slug: design-traffic-signal
version: 1
questions:
  - id: design-traffic-signal-001
    difficulty: beginner
    tags: [state-pattern, design-reasoning]
    question: |
      A traffic light must behave differently depending on its current color: a RED light's
      next phase and hold time differ from a GREEN light's. Which pattern is the canonical
      fit for modeling this lifecycle?
    options:
      - "Observer — notify displays whenever the color changes"
      - "State — let each phase object define its own duration and successor"
      - "Strategy — swap the light's algorithm from a config file"
      - "Decorator — wrap the light to layer on extra colors at runtime"
    answer: 1
    explanation: |
      Behavior that varies by the object's current phase, with well-defined transitions
      between phases, is the State pattern's exact problem. Each concrete state (Red/Green/
      Yellow) knows how long to hold and what comes next, so there is no switch-on-color
      ladder. Observer handles fan-out of change events, Strategy swaps an interchangeable
      algorithm chosen externally, and Decorator adds responsibilities to an object — none
      model a lifecycle.
    ref: "concepts.md#key-design-decisions"

  - id: design-traffic-signal-002
    difficulty: beginner
    tags: [requirements, safety-invariant]
    question: |
      Which requirement, if missed during clarification, most fundamentally breaks a traffic
      signal design because it is a safety invariant rather than a feature?
    options:
      - "The display's font size for the countdown timer"
      - "Whether the machine logs each transition to disk"
      - "That perpendicular directions are never green at the same time"
      - "Whether green durations are expressed in seconds or milliseconds"
    answer: 2
    explanation: |
      Mutual exclusion of perpendicular movements (N-S green implies E-W red) is the core
      safety invariant: violating it causes collisions. It shapes the whole model (phase
      groups, a controller that owns the invariant). The other items are cosmetic or
      implementation details that don't threaten correctness.
    ref: "concepts.md#requirements-clarification"

  - id: design-traffic-signal-003
    difficulty: beginner
    tags: [noun-verb, object-identification]
    question: |
      Extracting candidate classes from the requirement nouns, which noun should NOT become
      its own class in a clean design?
    options:
      - "TrafficController (coordinates the phase sequence)"
      - "TrafficLight (one physical signal head)"
      - "TimingStrategy (computes the green length)"
      - "Duration (how long a phase lasts)"
    answer: 3
    explanation: |
      "Duration" is a field/value that a SignalState exposes (an int of seconds), not an
      entity with identity or behavior — promoting it to a class is noise. Controller, light,
      and timing strategy each carry distinct responsibilities and earn a class. Filtering
      nouns like this is the heart of the object-identification step.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-traffic-signal-004
    difficulty: intermediate
    tags: [modeling, enum-vs-class]
    question: |
      Why model SignalColor (RED/YELLOW/GREEN) as an enum but SignalState (RedState/
      GreenState/YellowState) as a class hierarchy?
    options:
      - "The color is a fixed value a driver sees; the state is behavior (duration + successor) that varies by phase"
      - "Enums are always faster than classes, so colors should be enums"
      - "There is no real difference; either could be used interchangeably for both"
      - "Java forbids enums from having methods, so states must be classes"
    answer: 0
    explanation: |
      SignalColor is a closed set of values with no behavior — an enum is the honest model.
      SignalState carries behavior that differs per phase (how long to hold, what state comes
      next), which is what a polymorphic hierarchy expresses. Conflating the display value
      with the behavior object is the classic beginner slip. (Java enums can have methods, so
      that reasoning is wrong.)
    ref: "concepts.md#nounverb-object-identification"

  - id: design-traffic-signal-005
    difficulty: intermediate
    tags: [responsibility, mutual-exclusion]
    question: |
      Where should the "at most one phase group is green at a time" invariant be enforced?
    options:
      - "Inside each TrafficLight, which checks its perpendicular sibling before turning green"
      - "In a global boolean flag any class may read and write"
      - "In the TrafficController, which owns phase sequencing and guards it centrally"
      - "In the SignalColor enum, whose values run a validation method rejecting conflicting pairs"
    answer: 2
    explanation: |
      The invariant belongs to the coordinator that has visibility of all groups. Pushing it
      into individual lights forces each light to know about its siblings (a cyclic, fragile
      dependency), and a shared global flag is an invariant no class owns. Centralizing it in
      the controller keeps the safety property in exactly one place.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-traffic-signal-006
    difficulty: beginner
    tags: [state-machine, correctness]
    question: |
      In the light's finite state machine, what is the correct cyclic order of phases?
    options:
      - "RED -> YELLOW -> GREEN -> RED"
      - "RED -> GREEN -> RED -> YELLOW"
      - "GREEN -> RED -> YELLOW -> GREEN"
      - "RED -> GREEN -> YELLOW -> RED"
    answer: 3
    explanation: |
      A light goes RED -> GREEN (its turn) -> YELLOW (clearance so vehicles exit) -> RED
      again. Yellow follows green, never precedes it, and a light never jumps green-to-red
      without a clearance interval. Getting this cycle right is the spec the state classes
      implement.
    ref: "concepts.md#state-machine"

  - id: design-traffic-signal-007
    difficulty: intermediate
    tags: [state-machine, safety]
    question: |
      What is the primary purpose of the YELLOW phase in the state machine?
    options:
      - "To let the controller recompute timing for the next cycle"
      - "A clearance interval so vehicles already in the intersection can exit before the perpendicular group greens"
      - "To signal to drivers that the controller has entered a malfunction diagnostic state"
      - "To reduce lamp electricity draw during the idle gap between green and red phases"
    answer: 1
    explanation: |
      Yellow is the clearance interval between a group's green and the perpendicular group's
      green. Removing it (RED-to-GREEN directly across groups) is an immediate safety red
      flag because it allows collisions during the swap. The other options misattribute
      yellow's role.
    ref: "concepts.md#state-machine"

  - id: design-traffic-signal-008
    difficulty: advanced
    tags: [strategy-pattern, extensibility]
    question: |
      The interviewer says "now make green duration adapt to how many cars are waiting." Which
      change honors Open/Closed and requires no edit to the state classes?
    options:
      - "Add an if-branch inside GreenState that polls the vehicle sensor each tick"
      - "Hardcode a longer green-duration constant directly in the controller loop"
      - "Add a subclass of TrafficLight that overrides advance() to check the queue"
      - "Swap in an AdaptiveTimingStrategy implementing the TimingStrategy interface"
    answer: 3
    explanation: |
      Timing is isolated behind a TimingStrategy interface, so introducing an
      AdaptiveTimingStrategy that reads sensors is a plug-in, not a modification — the FSM and
      existing states are untouched. Editing GreenState or hardcoding constants violates
      Open/Closed and couples timing to the state machine.
    ref: "concepts.md#extensibility"

  - id: design-traffic-signal-009
    difficulty: intermediate
    tags: [observer-pattern, decoupling]
    question: |
      Physical lamps, a dashboard, and a logger all need to react when the active phase flips.
      Which pattern keeps the controller ignorant of who reacts?
    options:
      - "Observer — the controller publishes phase-change events to subscribers"
      - "Singleton — a single shared display object every consumer reads"
      - "Adapter — convert the controller's interface for each consumer"
      - "State — each consumer becomes a state of the controller"
    answer: 0
    explanation: |
      Observer lets the controller emit onPhaseChange while subscribers (lamps, dashboards,
      loggers) register independently. The controller has no knowledge of concrete listeners,
      keeping rendering and telemetry out of the FSM. The other patterns solve unrelated
      problems.
    ref: "concepts.md#key-design-decisions"

  - id: design-traffic-signal-010
    difficulty: advanced
    tags: [singleton, trade-offs]
    question: |
      A candidate immediately makes TrafficController a Singleton "because there's one
      intersection." What is the best critique?
    options:
      - "Singletons are categorically an anti-pattern and must never appear in any correct design"
      - "The controller should be a Singleton, and each TrafficLight should be a Singleton as well"
      - "It's defensible for one intersection, but a corridor needs many controllers and Singletons hurt testability — state the assumption instead of hardcoding a global"
      - "Singleton is the wrong pattern here; an Abstract Factory should build the controller instead"
    answer: 2
    explanation: |
      For a single intersection one coordinating authority is reasonable, but reflexively
      hardcoding a global forecloses the corridor case (many intersections, many controllers)
      and makes testing harder. The mature answer states the cardinality assumption explicitly
      rather than baking in a Singleton. Neither blanket rejection nor "everything is a
      Singleton" is correct.
    ref: "concepts.md#key-design-decisions"

  - id: design-traffic-signal-011
    difficulty: intermediate
    tags: [concurrency, timer]
    question: |
      Why should durations be counted via an injected Timer firing onTick() rather than a
      Thread.sleep() inside each state?
    options:
      - "Thread.sleep() was deprecated in Java 17 and removed from the modern concurrency API"
      - "The State pattern forbids concrete state classes from containing any method calls"
      - "A scheduled Timer consumes strictly less CPU than a sleeping thread in every scenario"
      - "It keeps the FSM deterministically testable and lets requests interleave without blocking a thread inside a state"
    answer: 3
    explanation: |
      Externalizing time means tests can drive ticks directly and assert colors without real
      waiting, and the controller thread isn't blocked mid-state (so preemption and operator
      requests can be handled). Durations become data the timer consumes. The other options
      are inaccurate justifications.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-traffic-signal-012
    difficulty: advanced
    tags: [concurrency, race-condition]
    question: |
      A preempt() call from an emergency thread and an onTick() from the timer thread
      interleave, briefly greening two groups. What is the cheapest correct fix at
      traffic-signal throughput?
    options:
      - "Per-light fine-grained locks acquired in a strict global ordering to avoid deadlock"
      - "Make the controller's mutating methods synchronized (a single coarse lock), or funnel all mutations through one command queue"
      - "Remove the assertNoConflict safety guard so the conflicting-green exception is never thrown"
      - "Run each TrafficLight on its own dedicated thread with no shared coordination between them"
    answer: 1
    explanation: |
      Throughput is trivially low, so a single coarse lock (synchronized on the controller) or
      a single-threaded command queue eliminates the race with minimal complexity.
      Fine-grained per-light locks are over-engineering here; removing the guard hides the bug;
      independent per-light threads make it worse.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-traffic-signal-013
    difficulty: intermediate
    tags: [state-pattern, flyweight]
    question: |
      Because RedState/GreenState/YellowState hold no per-light mutable data, what optimization
      is natural?
    options:
      - "Share a single instance of each state (flyweight/singleton) across all lights"
      - "Store each state's fields in a single global mutable map keyed by color"
      - "Recreate a fresh state object on every tick to guarantee thread safety"
      - "Merge all three states back into one class with a mutable color field"
    answer: 0
    explanation: |
      Stateless state objects can be shared safely as flyweights (or modeled as an enum
      implementing the interface), avoiding needless allocation. Recreating them each tick is
      wasteful, a global mutable map reintroduces shared state, and merging back into one
      class defeats the pattern.
    ref: "concepts.md#code-skeleton"

  - id: design-traffic-signal-014
    difficulty: advanced
    tags: [extensibility, open-closed]
    question: |
      The interviewer asks to add an all-way flashing-red MAINTENANCE mode. What is the
      minimal, Open/Closed-respecting change?
    options:
      - "Add a maintenance boolean flag and sprinkle if-checks through every existing state method"
      - "Delete the yellow state and repurpose its object to drive the flashing behavior"
      - "Rewrite the whole state machine as one big switch statement keyed on a mode field"
      - "Add a new FlashingState (or controller mode) implementing SignalState; existing states untouched"
    answer: 3
    explanation: |
      A new phase is a new state class — additive, leaving existing states unmodified. That
      is precisely the payoff of the State pattern. Scattering flags/if-checks or rewriting the
      FSM as a switch reintroduces the conditional swamp the pattern eliminates.
    ref: "concepts.md#extensibility"

  - id: design-traffic-signal-015
    difficulty: intermediate
    tags: [relationships, composition]
    question: |
      What is the correct relationship between TrafficController and its TrafficLights?
    options:
      - "Inheritance — the controller extends TrafficLight and specializes its behavior"
      - "Composition — the lights have no life outside the intersection the controller owns"
      - "No relationship — they are decoupled and communicate only via a shared global event bus"
      - "Association — they are linked loosely through a persisted database foreign key"
    answer: 1
    explanation: |
      The lights are parts of the intersection that the controller owns and whose lifecycle it
      governs — composition (filled diamond). A controller is-not-a light (inheritance is
      wrong), and modeling them as unrelated via a global bus loses the ownership that the
      safety coordination depends on.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-traffic-signal-016
    difficulty: advanced
    tags: [preemption, safety]
    question: |
      When preempting for an ambulance, the currently GREEN group must not be slammed
      instantly to RED. Why?
    options:
      - "It would emit malformed phase-change events that confuse the telemetry logger"
      - "Red lamp filaments burn out prematurely when the color is switched too abruptly"
      - "Vehicles in motion need the yellow (and all-red) clearance to exit safely before the emergency group greens"
      - "Skipping the yellow phase would violate the controller's Singleton invariant"
    answer: 2
    explanation: |
      Safety requires winding the green group down through yellow and an all-red beat so
      moving vehicles clear the intersection before the emergency direction turns green.
      Skipping clearance causes exactly the collisions the design exists to prevent. The other
      options are irrelevant.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-traffic-signal-017
    difficulty: intermediate
    tags: [phase-group, modeling]
    question: |
      Why model N-S and E-W as PhaseGroups rather than four fully independent lights?
    options:
      - "It saves memory by allocating two group objects instead of four light objects"
      - "It lets each compass direction run independently on its own dedicated timer thread"
      - "Java's enum rules require signal directions to be declared in matched pairs"
      - "Opposite approaches share a phase, so grouping them makes mutual exclusion fall out naturally as 'one group green at a time'"
    answer: 3
    explanation: |
      North and South go green together, as do East and West; treating each pair as a phase
      group turns the safety rule into a simple "only one group is green," which is far easier
      to enforce than reasoning about four independent lights. It's a correctness/clarity
      choice, not a memory or threading one.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-traffic-signal-018
    difficulty: advanced
    tags: [defense-in-depth, invariant]
    question: |
      The controller both (a) only ever greens the active group and (b) runs assertNoConflict()
      every tick throwing if two groups are green. Why keep the assertion if (a) already
      prevents conflicts?
    options:
      - "Defense in depth on a safety-critical system: the assertion catches any future bug or preemption path that violates the invariant"
      - "It is strictly redundant given guarantee (a) and should be removed to simplify the tick"
      - "The assertNoConflict() call is what actually drives the lights to their red state"
      - "It exists only to pad the tick method's line count for the interviewer's benefit"
    answer: 0
    explanation: |
      On a system where a violated invariant causes collisions, a runtime assertion is cheap
      insurance that surfaces regressions the moment any code path (a new feature, a
      preemption branch) breaks mutual exclusion. This layered defense is good practice, not
      redundancy; the assertion detects, it doesn't drive the lights.
    ref: "concepts.md#code-skeleton"

  - id: design-traffic-signal-019
    difficulty: intermediate
    tags: [pattern-classification, gof]
    question: |
      Classified by GoF intent, State and Strategy are both which category?
    options:
      - "Creational — they govern how objects are instantiated and initialized"
      - "Structural — they govern how classes and objects are composed together"
      - "Behavioral — they govern algorithms and the assignment of responsibilities"
      - "Concurrency — they coordinate access when threads share one mutable object"
    answer: 2
    explanation: |
      State and Strategy are behavioral patterns: they concern how behavior/algorithms are
      selected and how responsibilities are distributed at runtime. Creational patterns handle
      construction (e.g., Singleton, Factory), and Structural patterns handle assembly (e.g.,
      Adapter, Decorator). GoF has no formal "concurrency" category.
    ref: "concepts.md#key-design-decisions"

  - id: design-traffic-signal-020
    difficulty: advanced
    tags: [state-vs-strategy, design-reasoning]
    question: |
      Both State and Strategy appear in this design. What best distinguishes their roles here?
    options:
      - "State and Strategy are really the same pattern under two different names, interchangeable anywhere"
      - "Strategy is used to drive the physical lights, while State is used only for writing log entries"
      - "State computes the green durations, while Strategy is what sequences the RED-GREEN-YELLOW cycle"
      - "State models the light's phase transitions driven by the FSM; Strategy swaps how the green duration is computed, chosen externally"
    answer: 3
    explanation: |
      State captures internal lifecycle transitions (the phase the light is in and where it
      goes next). Strategy captures an interchangeable algorithm selected by configuration
      (fixed vs adaptive timing). They have similar structure but different intent: transition
      by internal state vs pluggable algorithm chosen by a client. Option 2 swaps their roles.
    ref: "concepts.md#key-design-decisions"

  - id: design-traffic-signal-021
    difficulty: beginner
    tags: [failure-mode, safety]
    question: |
      On a controller fault or power blip, what is the correct safe degraded mode?
    options:
      - "Turn all lights off (dark intersection)"
      - "Freeze whatever colors were showing"
      - "Fall back to all-way flashing red (an all-stop)"
      - "Set every direction green to keep traffic moving"
    answer: 2
    explanation: |
      All-way flashing red degrades safely to a controlled all-stop that drivers understand.
      A dark or frozen intersection is dangerous and ambiguous, and all-green is catastrophic.
      Naming this fallback shows you treat the design as safety-critical.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-traffic-signal-022
    difficulty: advanced
    tags: [adaptive-timing, fairness]
    question: |
      An AdaptiveTimingStrategy lengthens green for the busier approach. What safeguard prevents
      a busy road from starving a quiet cross-street forever?
    options:
      - "Enforce a minimum guaranteed green and a maximum green cap per group"
      - "Run the timing strategy on a dedicated higher-priority thread"
      - "Give the busy road its own dedicated Singleton controller instance"
      - "Remove the quiet cross-street from the phase groups entirely"
    answer: 0
    explanation: |
      Clamping green between a guaranteed minimum and a maximum ensures every group gets a
      turn regardless of demand, preventing starvation and unbounded waits. Threading, a
      Singleton, or dropping a group don't address fairness (and dropping a group breaks the
      intersection).
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-traffic-signal-023
    difficulty: intermediate
    tags: [interface-segregation, solid]
    question: |
      The API splits TrafficControllerApi, OperatorApi, and PreemptionApi into separate
      interfaces. Which SOLID principle does this most directly serve?
    options:
      - "Single Responsibility Principle"
      - "Liskov Substitution Principle"
      - "Dependency Inversion Principle"
      - "Interface Segregation Principle"
    answer: 3
    explanation: |
      Interface Segregation says clients shouldn't depend on methods they don't use. The timer
      driver needs only onTick(); an operator needs config; an emergency system needs
      preemption. Splitting them keeps each client's surface minimal. It touches SRP in spirit,
      but the direct principle for narrow client-specific interfaces is ISP.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-traffic-signal-024
    difficulty: intermediate
    tags: [dependency-injection, testability]
    question: |
      Injecting the Timer/Clock into the controller rather than having it call new Timer()
      internally primarily improves which quality?
    options:
      - "Rendering performance — the lamp displays repaint noticeably faster"
      - "Testability — tests supply a fake clock and drive ticks deterministically"
      - "Network throughput — telemetry reaches subscribers with less latency"
      - "Binary size — the compiled controller class ships as a smaller artifact"
    answer: 1
    explanation: |
      Dependency injection of the clock lets tests substitute a controllable fake and advance
      time on demand, so the FSM can be verified without real waiting or flakiness. This is
      the Dependency Inversion idea applied for testability. The other qualities are unrelated.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-traffic-signal-025
    difficulty: advanced
    tags: [corridor, hld-boundary]
    question: |
      Asked to synchronize an entire city's intersections into a coordinated network in real
      time, how should an LLD candidate respond?
    options:
      - "Keep adding more if-statements and mode flags to the single controller until it tracks every intersection in the city"
      - "Refuse to answer entirely because coordinating a whole city is completely out of scope for any design interview"
      - "Make the controller one distributed Singleton instance shared across every intersection in all of the cities at once"
      - "Recognize a single-corridor 'green wave' via offsets is in-scope LLD, but city-scale coordination is a distributed HLD problem — point to system-design"
    answer: 3
    explanation: |
      A CorridorController offsetting a handful of intersections by travel time is a
      reasonable LLD seam. City-scale, real-time coordination is distributed systems territory
      (state sync, latency, failure) — the mature move is to acknowledge the boundary and
      redirect to HLD/system-design rather than cramming it into one OO controller.
    ref: "concepts.md#extensibility"

  - id: design-traffic-signal-026
    difficulty: beginner
    tags: [noun-verb, method-extraction]
    question: |
      Using verb extraction on the requirements, which verb most directly maps to the primary
      driving method of the controller?
    options:
      - "'advance/tick' -> onTick()"
      - "'paint' -> paint()"
      - "'purchase' -> buy()"
      - "'authenticate' -> login()"
    answer: 0
    explanation: |
      The system is advanced by the timer's tick, so "advance/tick" maps to onTick(), the
      heartbeat that drives every transition. Purchase and authenticate are verbs from
      unrelated domains, and painting is a display concern handled by observers, not the
      controller's core method.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-traffic-signal-027
    difficulty: intermediate
    tags: [state-pattern, who-transitions]
    question: |
      In the State-pattern design, who decides which state a light moves to next?
    options:
      - "A giant switch statement inside the controller keyed on the current color"
      - "The Timer thread randomly selects the next color to show on each firing"
      - "The current state object returns its successor (e.g., GreenState.next() returns YellowState)"
      - "The Observer subscribers vote on and choose the next state to enter"
    answer: 2
    explanation: |
      Each concrete state knows its own successor and returns it from next(), so transitions
      live with the states themselves — no centralized switch. The timer only triggers when to
      advance; observers merely react. This is what keeps transition logic cohesive and the
      controller free of color conditionals.
    ref: "concepts.md#code-skeleton"

  - id: design-traffic-signal-028
    difficulty: advanced
    tags: [pedestrian, extensibility]
    question: |
      Adding pedestrian WALK/DON'T-WALK signals and a crossing button should ideally require
      which change to the existing vehicle state machine?
    options:
      - "A full rewrite of the RedState, GreenState, and YellowState classes to embed pedestrian handling"
      - "Delete the existing vehicle phase groups and rebuild the entire state machine from scratch"
      - "Merge all the pedestrian WALK/DON'T-WALK logic directly into GreenState behind new boolean flags"
      - "None to the vehicle FSM — add a PedestrianSignal updated by an Observer plus a request API honoring a minimum WALK window"
    answer: 3
    explanation: |
      A pedestrian signal is a new component that observes phase changes and a request the
      controller schedules with a guaranteed minimum crossing time; it overlaps the
      perpendicular red without altering the vehicle states. Rewriting or entangling the
      existing states violates Open/Closed and risks the safety invariant.
    ref: "concepts.md#extensibility"

  - id: design-traffic-signal-029
    difficulty: intermediate
    tags: [state-machine, all-red]
    question: |
      What is the "all-red clearance" interval and why include it?
    options:
      - "A period where both phase groups show red between one group's yellow ending and the next group's green, so the intersection fully empties"
      - "A diagnostic test mode where every light in the intersection blinks red together during commissioning"
      - "The time the controller spends computing the next cycle's timing plan before the swap"
      - "A fixed percentage discount applied to shorten the green duration during off-peak overnight hours"
    answer: 0
    explanation: |
      The all-red clearance holds both groups red for a brief beat during the swap, ensuring
      the intersection is empty before the next group greens — an extra safety margin beyond
      yellow. It can be modeled as a short red hold rather than a distinct state. The other
      options describe unrelated behaviors.
    ref: "concepts.md#state-machine"

  - id: design-traffic-signal-030
    difficulty: advanced
    tags: [conflicting-preemption, policy]
    question: |
      Two emergency vehicles request preemption for perpendicular directions at the same
      moment. What must the design provide?
    options:
      - "Green both perpendicular directions at once so that both emergency vehicles are served together"
      - "A conflict-resolution policy (priority, or first-come with the other queued) — since both can't be green"
      - "Ignore both emergency requests and keep running the normal fixed timing cycle uninterrupted"
      - "Randomly toggle the two directions' lights back and forth until one emergency vehicle clears"
    answer: 1
    explanation: |
      Because mutual exclusion still holds, two perpendicular preemptions cannot both be
      served at once, so a documented policy (priority ordering, or first-come while the other
      waits) is required. Greening both violates the core safety invariant; ignoring or
      randomizing is unsafe and unspecified.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-traffic-signal-031
    difficulty: intermediate
    tags: [srp, responsibility]
    question: |
      A candidate puts lamp-rendering code, telemetry logging, and phase sequencing all inside
      TrafficController. Which principle is violated and what's the fix?
    options:
      - "Liskov — replace the controller with a subclass that overrides the mixed-in rendering methods"
      - "Nothing is wrong here; a central controller is supposed to handle rendering, logging, and sequencing"
      - "Open/Closed — mark all of the controller's methods final so that nothing can be extended"
      - "Single Responsibility — extract rendering/logging into Observers so the controller only sequences phases and guards safety"
    answer: 3
    explanation: |
      Mixing rendering, logging, and control gives the controller multiple reasons to change,
      violating SRP. Moving rendering and telemetry to Observers restores a single
      responsibility (coordinate phases + enforce safety) and decouples side effects. The
      other options misapply principles.
    ref: "concepts.md#key-design-decisions"

  - id: design-traffic-signal-032
    difficulty: intermediate
    tags: [relationships, aggregation-vs-composition]
    question: |
      A TrafficLight references its current SignalState, which is a shared flyweight instance.
      What relationship best describes this?
    options:
      - "Aggregation — the light references a shared state it does not exclusively own"
      - "Composition — the light exclusively owns and destroys its own state object"
      - "Inheritance — the light is a specialized kind of SignalState subclass"
      - "Realization — the light itself directly implements the SignalState interface"
    answer: 0
    explanation: |
      Because state instances are shared across lights and outlive any single light, the
      light merely holds a reference (aggregation), not an owned part (composition). The light
      is not a state (no inheritance) and does not implement SignalState (no realization); it
      delegates to it.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-traffic-signal-033
    difficulty: beginner
    tags: [actors, use-cases]
    question: |
      Which is the primary *driver* actor that pushes the traffic controller forward, even
      though it isn't a human?
    options:
      - "The motorist waiting at the intersection stop line"
      - "The Timer/Clock firing periodic ticks"
      - "The maintenance operator changing configuration"
      - "The backing database of recorded transitions"
    answer: 1
    explanation: |
      Unlike request-driven systems, the traffic controller advances on its own clock: the
      Timer firing ticks is the actor that drives transitions. Motorists merely obey lights,
      the operator intervenes occasionally, and there's no inherent database driving the FSM.
    ref: "concepts.md#use-cases-and-actors"

  - id: design-traffic-signal-034
    difficulty: advanced
    tags: [clock-drift, robustness]
    question: |
      To avoid phase drift when ticks are occasionally delayed, durations should be measured
      against what?
    options:
      - "The system's mutable wall-clock time, which users and NTP may adjust at any moment"
      - "A random jitter value added to the phase duration on each cycle to spread load"
      - "The running count of how many cars physically passed through the intersection"
      - "A monotonic clock / elapsed-time count, with a watchdog forcing flashing mode if ticks stall"
    answer: 3
    explanation: |
      Wall-clock time can jump (NTP, DST, manual changes), so a monotonic elapsed-time basis is
      correct for interval timing, and a watchdog that trips to flashing red on stalled ticks
      guards against a hung timer. Car counts and random jitter don't measure elapsed phase
      time.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-traffic-signal-035
    difficulty: intermediate
    tags: [cross-reference, patterns]
    question: |
      In this LLD topic, how should the State pattern's internal mechanics be treated relative
      to the dp-behavioral-state topic?
    options:
      - "Re-derive the full State pattern UML and participants from scratch here"
      - "Ignore the State pattern entirely and just use deeply nested if-statements instead"
      - "Reference it by name and cross-ref dp-behavioral-state for mechanics; here we just apply it"
      - "Rename State to something project-specific to avoid the cross-reference"
    answer: 2
    explanation: |
      The design-patterns topics own the pattern taxonomy and mechanics; a problem topic names
      the pattern, explains *why* it fits, and cross-references for the deep dive. Re-teaching
      it duplicates content, avoiding it loses the design win, and renaming obscures a
      well-known pattern.
    ref: "concepts.md#key-design-decisions"

  - id: design-traffic-signal-036
    difficulty: advanced
    tags: [warm-restart, memento]
    question: |
      If warm-restart after a brief power blip matters, what minimal state should be persisted?
    options:
      - "The full historical log of every car that has ever passed through the intersection"
      - "A small snapshot: the active group and current phase, so the controller can resume or safely reset"
      - "Nothing at all — the controller should always cold-reboot straight into all-green"
      - "The complete compiled source code of the controller and all of its state classes"
    answer: 1
    explanation: |
      A tiny snapshot (active group + phase) is enough to resume the cycle or fall back to
      flashing on boot; persisting full traffic history is wasteful and unnecessary, and
      booting into all-green is unsafe. This is a lightweight Memento-style journal.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-traffic-signal-037
    difficulty: intermediate
    tags: [observer, pedestrian]
    question: |
      A PedestrianSignal must switch to DON'T-WALK exactly when the perpendicular vehicle group
      is about to turn green. Which pattern connects them cleanly?
    options:
      - "Observer — PedestrianSignal subscribes to phase-change events and updates itself"
      - "The controller directly calls PedestrianSignal setters, hardcoding the dependency"
      - "Singleton — a single shared pedestrian signal instance reused across the whole city"
      - "Template Method — pedestrian logic overrides fixed steps in the controller's algorithm"
    answer: 0
    explanation: |
      Making PedestrianSignal an observer of phase changes decouples it from the controller,
      which stays ignorant of pedestrian rendering. Hardcoding setter calls couples the
      controller to every consumer; a Singleton or Template Method doesn't fit this event-
      reaction need.
    ref: "concepts.md#extensibility"

  - id: design-traffic-signal-038
    difficulty: advanced
    tags: [code-skeleton, no-switch]
    question: |
      What is the "tell" that the State pattern is applied correctly in the controller's tick
      logic?
    options:
      - "The tick method has a large switch statement on SignalColor with a branch handling the hold time and successor for each RED, GREEN, and YELLOW case"
      - "The controller stores every phase duration as string constants that it parses back into integers on each tick before comparing them"
      - "Every light keeps its own private copy of the full transition table and mutates it in place whenever the controller advances the active group"
      - "The tick contains no switch on color — transitions live inside the state objects; the controller only orchestrates which group advances and guards safety"
    answer: 3
    explanation: |
      When the pattern works, color-based conditionals disappear from the controller: states
      own their successor logic, and the controller just advances the active group and checks
      the invariant. A switch on color in the tick is the smell the pattern was meant to
      remove.
    ref: "concepts.md#code-skeleton"

  - id: design-traffic-signal-039
    difficulty: intermediate
    tags: [left-turn, extensibility]
    question: |
      Adding a protected left-turn arrow phase for the N-S group is best done how?
    options:
      - "Add a new SignalState (e.g., LeftArrowGreen) inserted into that group's cycle"
      - "Add nested if-statements inside GreenState to sometimes show an arrow"
      - "Create a second independent controller just for driving the left-turn arrow phase"
      - "Store the arrow indication as an extra boolean flag on the SignalColor enum"
    answer: 0
    explanation: |
      A protected left phase is another state in the cycle — introducing a LeftArrowGreen state
      is additive and Open/Closed-respecting. Overloading GreenState with conditionals rebuilds
      the conditional swamp, a second controller risks conflicting greens, and a boolean on the
      color enum confuses value with behavior.
    ref: "concepts.md#extensibility"

  - id: design-traffic-signal-040
    difficulty: beginner
    tags: [requirements, scope-out]
    question: |
      Which item should a candidate explicitly scope OUT as an HLD/ML concern during a
      45-minute LLD traffic-signal session?
    options:
      - "The core RED-GREEN-YELLOW phase state transitions that drive the light"
      - "Mutual exclusion ensuring perpendicular directions are never green together"
      - "Computer-vision vehicle detection and city-wide ML traffic optimization"
      - "The pluggable TimingStrategy interface that computes each green duration"
    answer: 2
    explanation: |
      Vision-based detection and city-scale ML optimization are separate systems/ML problems
      that would consume the whole session; scoping them out keeps the LLD focused on clean OO
      class design. The transitions, mutual exclusion, and timing strategy are core to the LLD
      itself.
    ref: "concepts.md#requirements-clarification"

  - id: design-traffic-signal-041
    difficulty: advanced
    tags: [testing, deterministic]
    question: |
      How can each state's behavior and the phase cycle be unit-tested without real time
      passing?
    options:
      - "Sleep for the real phase duration in the test thread and then check the light's color afterward"
      - "Because a finite state machine has too many interleavings, testing one thoroughly is fundamentally impossible"
      - "Deploy the controller to a real physical intersection and manually observe the lights over several cycles"
      - "Drive the injected fake clock/ticks directly and assert the resulting colors and group after each tick"
    answer: 3
    explanation: |
      With time externalized behind an injected clock/timer, tests advance ticks
      programmatically and assert the FSM's colors and active group deterministically — fast
      and flake-free. Real sleeping is slow and flaky, live deployment is absurd for a unit
      test, and FSMs are highly testable when time is injected.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-traffic-signal-042
    difficulty: intermediate
    tags: [error-handling, safety]
    question: |
      When the safety guard detects two groups green, the code throws ConflictingGreenException
      rather than silently continuing. Why is throwing appropriate here?
    options:
      - "As a universal rule, throwing exceptions is always strictly better than returning error codes in any situation"
      - "On a safety-critical system a violated invariant must fail loudly (fail-fast) so it's caught, not silently permitted"
      - "It makes the tick method's signature shorter by avoiding an extra boolean status return value"
      - "To force the calling code to catch the error and restart the entire JVM process for a clean slate"
    answer: 1
    explanation: |
      A conflicting green is a catastrophic invariant violation; failing fast surfaces the bug
      immediately (in tests or via a watchdog fallback to flashing) instead of allowing an
      unsafe state to persist. The choice is about safety semantics, not a general "exceptions
      beat return codes" rule.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-traffic-signal-043
    difficulty: intermediate
    tags: [context-object, state-pattern]
    question: |
      In the State pattern here, what role does TrafficLight (or the controller) play relative
      to the SignalState objects?
    options:
      - "It is the context that holds a reference to the current state and delegates behavior to it"
      - "It is itself a concrete state object that returns its own successor from next()"
      - "It is a factory whose only job is to construct and hand out the concrete state instances"
      - "It is an observer that subscribes to the state objects and reacts to their changes"
    answer: 0
    explanation: |
      The light/controller is the context: it maintains the current-state reference and
      delegates transitions to the state object, whose next() returns the successor. It is not
      itself a concrete state, a pure factory, or an observer in the pattern's structure.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-traffic-signal-044
    difficulty: advanced
    tags: [strategy, context-parameter]
    question: |
      TimingStrategy.greenDurationSeconds takes a TrafficContext parameter. Why pass context
      rather than have the strategy hold its own controller reference?
    options:
      - "To make the interface look more sophisticated and complex so it impresses the interviewer during the design walkthrough"
      - "So strategies stay stateless and reusable/shareable, receiving what they need per call instead of coupling to a specific controller"
      - "Because the Java language forbids strategy classes from declaring any instance fields of their own"
      - "To force every concrete strategy implementation to be written as a globally shared Singleton instance"
    answer: 1
    explanation: |
      Passing the needed context per call keeps strategy objects free of controller-specific
      state, so a single strategy instance can serve multiple contexts and remains easy to test
      in isolation. It's a decoupling choice; Java allows strategy fields, and Singleton isn't
      required.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-traffic-signal-045
    difficulty: beginner
    tags: [state-machine, gated-transition]
    question: |
      A RED light for the E-W group receives the timer signal, but it is currently the N-S
      group's turn. What happens?
    options:
      - "E-W turns green immediately as soon as its red light receives the timer signal"
      - "Both the N-S and E-W groups simultaneously switch to yellow for a clearance beat"
      - "The controller throws a conflicting-green exception and halts the entire cycle"
      - "E-W stays RED — the RED-to-GREEN edge is gated on 'this group is the active group'"
    answer: 3
    explanation: |
      The controller gates the RED-to-GREEN transition on whether it is that group's turn, so
      an inactive group's red light simply stays red. This gating is exactly how mutual
      exclusion is preserved during the cycle. Greening it immediately would create a conflict.
    ref: "concepts.md#state-machine"

  - id: design-traffic-signal-046
    difficulty: intermediate
    tags: [cross-reference, siblings]
    question: |
      Which sibling LLD topics are the closest relatives to reference when discussing the
      traffic signal's State + timer structure?
    options:
      - "design-splitwise and design-cache-oo"
      - "design-vending-machine and design-elevator-system"
      - "design-parking-lot and design-library-management"
      - "solid-principles and uml-class-diagrams only"
    answer: 1
    explanation: |
      The vending machine (canonical State-pattern problem) and the elevator (State + request
      scheduling with timing) are the closest structural relatives sharing the State + timer
      theme. Splitwise/cache and parking/library center on different concerns (money graphs,
      eviction policies, allocation), and the foundational topics are cross-cutting rather
      than sibling problems.
    ref: "concepts.md#references"

  - id: design-traffic-signal-047
    difficulty: advanced
    tags: [preemption, api-design]
    question: |
      The PreemptionApi exposes both preempt(Direction) and clearPreemption(). Why is
      clearPreemption() necessary rather than auto-resuming?
    options:
      - "To let calling systems conveniently forget to resume normal operation once the emergency vehicle has finally passed through"
      - "It is not actually necessary, and the method should be removed so the controller auto-resumes on an internal timer instead"
      - "Because the controller can't know when the emergency vehicle has passed; an explicit clear returns control to the normal cycle deterministically"
      - "To create and hold a dedicated Singleton instance representing the active preemption state across the whole controller"
    answer: 2
    explanation: |
      The controller has no inherent knowledge of when the emergency has cleared, so an
      explicit clearPreemption() gives the requesting system deterministic control over when
      normal cycling resumes. Auto-resuming on a guessed timer could green a direction while
      the emergency vehicle is still crossing.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-traffic-signal-048
    difficulty: intermediate
    tags: [flyweight-vs-enum, java]
    question: |
      A candidate proposes modeling SignalState as a Java enum implementing the SignalState
      interface. What is a fair assessment?
    options:
      - "Invalid — Java enums are strictly forbidden from implementing any interface, so a plain enum cannot satisfy the SignalState contract"
      - "Required — a polymorphic class hierarchy is never an acceptable way to model states and must always be replaced by an enum"
      - "Best only when each individual state object must hold its own mutable per-light fields that change during operation"
      - "Reasonable — an enum gives singletons, serialization safety, and an exhaustive set for free, provided the states stay stateless"
    answer: 3
    explanation: |
      Java enums can implement interfaces and provide free singleton instances plus a closed,
      exhaustive set — a clean fit for stateless states. The caveat is exactly that: it works
      because the states hold no per-light mutable data. It's a good option, not the only
      acceptable one, and it's the wrong choice if states needed per-instance mutable fields.
    ref: "concepts.md#code-skeleton"
