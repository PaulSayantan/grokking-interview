topic: "Design a Library Management System"
domain: lld-and-ood
topic_slug: design-library-management
version: 1
questions:
  - id: design-library-management-001
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      In the first five minutes of "Design a Library Management System", which
      clarifying question most directly shapes the class structure you will draw?
    options:
      - "Which database engine will store the catalog?"
      - "Can the library hold multiple physical copies of the same title?"
      - "What font should the search results page use?"
      - "How many librarians does the library employ?"
    answer: 1
    explanation: |
      Multiple copies per title forces the Book (title metadata) vs. BookItem
      (physical copy) split, which cascades into where availability, checkout, and
      reservations live. Database choice is a persistence detail, and the other two
      don't change the object model at all.
    ref: "concepts.md#requirements-clarification"

  - id: design-library-management-002
    difficulty: beginner
    tags: [requirements, boundaries, hld-vs-lld]
    question: |
      Mid-way through the LLD round the interviewer asks, "How would this serve a
      city-wide network of 200 branches with millions of members?" What is the
      strongest response?
    options:
      - "Redesign the classes around a distributed cache and message broker"
      - "Explain sharding the members table by region in detail"
      - "Acknowledge it as an HLD concern (per-branch service plus a coordination layer), then keep the LLD single-branch"
      - "Say the current design already handles it because HashMap is O(1)"
    answer: 2
    explanation: |
      The LLD round is about single-process OO design. Naming the shape of the
      distributed answer in one sentence and explicitly deferring it shows judgment;
      derailing into infrastructure or hand-waving about HashMap does not.
    ref: "concepts.md#requirements-clarification"

  - id: design-library-management-003
    difficulty: beginner
    tags: [entities, book-vs-bookitem]
    question: |
      The library owns seven copies of "Clean Code". In a well-modeled design, what
      does each of the seven copies map to?
    options:
      - "A BookItem instance, all referencing one shared Book"
      - "Seven separate Book instances with duplicated metadata"
      - "An entry in a copies counter field on Book"
      - "A Rack instance, since copies are identified by shelf position"
    answer: 0
    explanation: |
      Each physical copy is a BookItem with its own barcode, rack, and lifecycle
      state; the title metadata lives once in Book. Duplicating Book seven times
      duplicates metadata, a bare counter can't track per-copy state like Loaned or
      Lost, and racks are locations, not identities.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-library-management-004
    difficulty: intermediate
    tags: [entities, association-class]
    question: |
      Why should the checkout relationship between Member and BookItem be modeled as
      a first-class BookLending object rather than a direct reference like
      member.borrowedItems?
    options:
      - "Because Java cannot store lists of object references inside entities"
      - "Because Singleton requires all relationships to flow through one class"
      - "Because it reduces the total number of classes in the design"
      - "Because the relationship itself carries data — checkout date, due date, return date — that needs a home"
    answer: 3
    explanation: |
      A lending has attributes and history of its own (dates, fine linkage), which a
      bare reference cannot hold. This is the classic association-class move; it also
      preserves lending history for fines, audits, and future recommendations.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-library-management-005
    difficulty: beginner
    tags: [entities, srp]
    question: |
      Which responsibility does NOT belong on the Book class in a clean design?
    options:
      - "Holding the ISBN and title"
      - "Listing the authors"
      - "Tracking whether the book is currently loaned to member M-42"
      - "Exposing the subject/category for search"
    answer: 2
    explanation: |
      Loan state is a per-copy concern that belongs to BookItem (and the lending
      record), not the title. Putting lending state on Book breaks down the moment a
      second copy exists — one field can't represent seven copies' states.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-library-management-006
    difficulty: intermediate
    tags: [class-relationships, composition]
    question: |
      In the class diagram, Book to BookItem is drawn as composition (filled
      diamond). What justifies composition over plain association here?
    options:
      - "BookItem methods call Book methods frequently"
      - "A physical copy has no meaning without its title, and removing the title record removes its copies"
      - "Composition is required whenever multiplicity is one-to-many"
      - "BookItem inherits all of Book's fields"
    answer: 1
    explanation: |
      Composition expresses ownership with coupled lifecycles: a barcode-bearing copy
      only exists as a copy OF some title. One-to-many multiplicity alone doesn't
      imply composition (Member to BookLending is one-to-many but not ownership in
      the same lifecycle sense), and no inheritance is involved.
    ref: "concepts.md#class-diagram"

  - id: design-library-management-007
    difficulty: intermediate
    tags: [class-relationships, reservations]
    question: |
      Reservations point at Book while lendings point at BookItem. Why the asymmetry?
    options:
      - "Members reserve a title (any copy will do), but a lending records the specific physical copy handed over"
      - "It is a mistake — both should point at BookItem for consistency"
      - "BookReservation predates BookItem in the design's git history"
      - "Reservations are value objects and can only reference immutable classes"
    answer: 0
    explanation: |
      A member queueing for "Clean Code" doesn't care which barcode they get, so the
      claim is title-level; the checkout desk scans one concrete copy, so the lending
      is copy-level. Forcing both to the same target loses one of these facts.
    ref: "concepts.md#class-diagram"

  - id: design-library-management-008
    difficulty: beginner
    tags: [class-relationships, rack]
    question: |
      BookItem to Rack is modeled as a plain association rather than composition.
      Why?
    options:
      - "Racks are enums, and enums cannot participate in composition"
      - "Composition would prevent moving a copy between racks"
      - "The rack exists independently of any particular copy placed on it"
      - "UML forbids two composition relationships in one diagram"
    answer: 2
    explanation: |
      A rack is a shelf location with its own independent lifecycle — it doesn't get
      created or destroyed with a book copy. Independent lifecycle means association,
      not composition. (Moving copies is possible under either; that's not the
      deciding factor.)
    ref: "concepts.md#class-diagram"

  - id: design-library-management-009
    difficulty: intermediate
    tags: [state-machine, bookitem-lifecycle]
    question: |
      A loaned copy of a fully-reserved title is returned. Per the BookItem state
      machine, what state should the copy enter?
    options:
      - "Available, so the reserving member can find it on the shelf"
      - "Loaned, until the reserving member confirms"
      - "Lost, pending reconciliation"
      - "Reserved, held for the head of the reservation queue"
    answer: 3
    explanation: |
      Going straight to Available creates a race where a walk-in member checks out
      the copy that a queued member has been waiting weeks for. The Reserved state
      exists precisely to hold the copy for the notified reservation holder.
    ref: "concepts.md#bookitem-state-machine"

  - id: design-library-management-010
    difficulty: intermediate
    tags: [state-machine, expiry]
    question: |
      A member is notified their reserved copy is ready but never picks it up. What
      should the design do?
    options:
      - "After an expiry window, release the copy to the next queued reservation or back to Available"
      - "Keep the copy Reserved indefinitely — the member paid for the reservation"
      - "Transition the copy to Lost since its holder is unknown"
      - "Automatically create a BookLending on the member's behalf"
    answer: 0
    explanation: |
      Unclaimed holds must expire or copies leak out of circulation. The expiry
      transition (Reserved back to Available, or to the next queue entry) is one of
      the edge cases strong candidates volunteer before being asked.
    ref: "concepts.md#bookitem-state-machine"

  - id: design-library-management-011
    difficulty: advanced
    tags: [state-pattern, over-engineering, trade-offs]
    question: |
      For the four-state BookItem lifecycle, the candidate uses an enum with
      transition validation inside BookItem methods, and says "I'd promote this to
      State-pattern classes if per-state behavior grows." How should this be judged?
    options:
      - "Wrong — GoF State pattern is mandatory whenever a state machine exists"
      - "Well-calibrated — an enum plus guarded transitions fits the current complexity, and the upgrade path is named"
      - "Wrong — states should be tracked as boolean flags like isLoaned and isReserved"
      - "Wrong — state belongs in the database, not in objects"
    answer: 1
    explanation: |
      Interview-grade design matches mechanism to complexity. Four states with simple
      transitions don't justify four classes; naming the promotion trigger shows the
      candidate knows the pattern AND when not to use it. Boolean flags invite
      contradictory combinations (isLoaned && isReserved).
    ref: "concepts.md#bookitem-state-machine"

  - id: design-library-management-012
    difficulty: beginner
    tags: [strategy-pattern, fines]
    question: |
      The library charges a per-day overdue fine today, but policy changes are
      expected (caps, member-type exemptions). Which pattern isolates fine
      computation so lending code never changes when policy does?
    options:
      - "Singleton — one global FineCalculator"
      - "Decorator — wrap BookLending in fine layers"
      - "Strategy — a FineStrategy interface with pluggable implementations"
      - "Template Method — subclass LendingService per policy"
    answer: 2
    explanation: |
      Strategy encapsulates the varying algorithm behind a stable interface
      (calculate(BookLending) -> amount), injected into the return flow. Subclassing
      the whole service per policy (Template Method) couples policy to lending
      lifecycle; Singleton says nothing about varying the algorithm.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-library-management-013
    difficulty: intermediate
    tags: [strategy-pattern, trade-offs, ocp]
    question: |
      Why is an injected FineStrategy preferable to an if/else chain on member type
      inside returnBook()?
    options:
      - "Strategy objects execute faster than if/else branches"
      - "if/else chains cannot access the lending's due date"
      - "Strategy removes the need for unit tests on fine logic"
      - "New policies become additions (a new class) instead of modifications to tested lending code — the Open/Closed Principle"
    answer: 3
    explanation: |
      The win is OCP and isolation: each policy is independently testable and adding
      one can't break the return flow. Performance is irrelevant at this scale, and
      the other options are simply false.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-library-management-014
    difficulty: beginner
    tags: [observer-pattern, notifications]
    question: |
      When a copy of a reserved title is returned, the queued member must be told by
      email, SMS, or push — and channels will be added later. Which pattern fits?
    options:
      - "Factory Method — construct the right notification at checkout time"
      - "Adapter — convert BookLending into an email"
      - "Observer — the return flow publishes an event, notification channels subscribe"
      - "Memento — snapshot the reservation for later replay"
    answer: 2
    explanation: |
      Observer decouples the event source (lending/return flow) from reaction
      (channels). Adding push notifications means one more subscriber and zero
      changes to lending code. Factory addresses creation, not event fan-out.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-library-management-015
    difficulty: intermediate
    tags: [facade-pattern, api-design]
    question: |
      LibraryService exposes checkout/returnBook/reserve/search and internally wires
      Catalog, LendingService, ReservationService, and NotificationService. Which
      pattern is this, and what does it buy?
    options:
      - "Mediator — it prevents the services from ever being used together"
      - "Facade — callers get one simple entry point instead of orchestrating four subsystems themselves"
      - "Proxy — it controls access rights to the catalog"
      - "Composite — it treats the four services as one tree"
    answer: 1
    explanation: |
      Facade offers a simplified surface over a subsystem. The UI or librarian
      console shouldn't know that a return touches lending, reservations, fines, and
      notifications in a specific order — that orchestration lives behind the facade.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-library-management-016
    difficulty: advanced
    tags: [singleton, testability, anti-pattern]
    question: |
      A candidate reflexively makes Library a Singleton "because there is only one
      library." What is the strongest counter-argument in an interview?
    options:
      - "Singleton is deprecated in modern Java versions"
      - "Singletons cannot hold references to other services"
      - "It introduces hidden global state and hard-codes the single-instance assumption, hurting testability — just create one instance and inject it"
      - "The system will eventually need exactly two libraries"
    answer: 2
    explanation: |
      "There happens to be one" differs from "the class must enforce one." A plain
      instance injected where needed keeps tests isolated (fresh instance per test)
      and leaves multi-branch evolution open. Saying this unprompted is a senior
      signal.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-library-management-017
    difficulty: intermediate
    tags: [solid, dip]
    question: |
      LendingService depends on the FineStrategy and NotificationService interfaces,
      with concrete implementations injected via constructor. Which SOLID principle
      is this applying?
    options:
      - "Dependency Inversion — high-level lending logic depends on abstractions, not concretions"
      - "Liskov Substitution — subclasses can replace base classes"
      - "Interface Segregation — clients see only methods they use"
      - "Single Responsibility — each class has one reason to change"
    answer: 0
    explanation: |
      DIP is exactly this: the high-level policy (lending workflow) depends on
      abstract seams; details (per-day fines, email sender) depend on the same
      abstractions. LSP and ISP are about substitutability and interface width,
      which aren't the mechanism at work here.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-library-management-018
    difficulty: intermediate
    tags: [catalog, srp, responsibility]
    question: |
      Where should search-by-author live, and why?
    options:
      - "On Book, since books know their authors"
      - "On Member, since members initiate searches"
      - "On Librarian, since staff manage the collection"
      - "On Catalog, the class whose single responsibility is indexing and querying titles"
    answer: 3
    explanation: |
      Searching is a collection-level concern — a single Book can't search across
      titles, and putting it on Member or Librarian couples actors to storage
      layout. Catalog owns the indexes and exposes the query methods (SRP).
    ref: "concepts.md#searching-the-catalog"

  - id: design-library-management-019
    difficulty: intermediate
    tags: [catalog, data-structures, multiplicity]
    question: |
      In the Catalog's indexes, ISBN maps to a single Book while author maps to a
      list of Books. Why the difference?
    options:
      - "Lists are cheaper than single references in Java"
      - "ISBN uniquely identifies one title, while one author writes many titles"
      - "Author names are longer strings and need list buckets"
      - "It's arbitrary — either could be single-valued"
    answer: 1
    explanation: |
      Index value multiplicity mirrors real-world cardinality: ISBN is a unique key
      (Map<String, Book>), author/subject/title are one-to-many (Map<String,
      List<Book>>). Getting this small detail right signals careful modeling.
    ref: "concepts.md#searching-the-catalog"

  - id: design-library-management-020
    difficulty: beginner
    tags: [catalog, trade-offs]
    question: |
      The Catalog updates four maps on every addBook call. What trade-off is being
      made?
    options:
      - "Higher memory safety in exchange for thread safety"
      - "A write-time indexing cost in exchange for O(1)-lookup searches on each axis"
      - "Simpler code in exchange for slower searches"
      - "Referential integrity in exchange for duplicate Book instances"
    answer: 1
    explanation: |
      Each search axis (title, author, subject, ISBN) gets its own index so reads
      avoid a full scan; the price is doing four map updates per insertion. In a
      library, reads massively outnumber writes, so the trade is right.
    ref: "concepts.md#searching-the-catalog"

  - id: design-library-management-021
    difficulty: intermediate
    tags: [search, boundaries, extensibility]
    question: |
      The interviewer asks for fuzzy or prefix search on titles. What is the
      interview-grade response in an LLD round?
    options:
      - "Name the upgrade (trie or inverted index behind the Catalog interface, or a search engine at HLD scale) without building it live"
      - "Implement Levenshtein distance on the whiteboard immediately"
      - "Say hash maps already support prefix lookup"
      - "Move all search logic into the Book class to enable fuzziness"
    answer: 0
    explanation: |
      The Catalog interface is the seam: its implementation can swap a HashMap for a
      trie without callers changing. Deriving edit-distance code burns scarce time on
      dsa-coding territory, and HashMaps do not support prefix queries.
    ref: "concepts.md#searching-the-catalog"

  - id: design-library-management-022
    difficulty: intermediate
    tags: [checkout-flow, business-rules]
    question: |
      Which check does NOT belong in the checkout flow?
    options:
      - "The BookItem is Available (or Reserved by this same member)"
      - "The member is under the max-books limit"
      - "The member has no blocking unpaid fines"
      - "The reservation queue for every other title in the library is empty"
    answer: 3
    explanation: |
      Checkout validates this copy and this member; other titles' reservation queues
      are irrelevant. The Reserved-by-this-member allowance matters — that's how a
      notified reservation holder actually picks up their held copy.
    ref: "concepts.md#checkout-return-and-reserve-flows"

  - id: design-library-management-023
    difficulty: advanced
    tags: [return-flow, ordering-bug]
    question: |
      In the return flow, a candidate marks the copy Available first and then checks
      the reservation queue. What bug does this ordering create?
    options:
      - "Fines are computed twice for the same lending"
      - "A walk-in checkout can grab the copy in the window before the queued member is assigned, starving the reservation"
      - "The member's checked-out count goes negative"
      - "The Observer notification fires with a null Book reference"
    answer: 1
    explanation: |
      Between "Available" and "assigned to reservation" the copy is visibly free, so
      a concurrent checkout wins the race. Consulting the queue BEFORE choosing the
      new state (Reserved if non-empty, else Available) closes the window.
    ref: "concepts.md#checkout-return-and-reserve-flows"

  - id: design-library-management-024
    difficulty: intermediate
    tags: [reserve-flow, validation]
    question: |
      A member tries to reserve a title that currently has an Available copy on the
      shelf. What should the reserve operation do?
    options:
      - "Queue the reservation anyway — queues are harmless"
      - "Convert the reservation into an automatic checkout"
      - "Reject or redirect — the reservation queue exists only for fully-checked-out titles"
      - "Mark all Available copies as Reserved for this member"
    answer: 2
    explanation: |
      Reservations are a waiting mechanism for unavailable titles. Queueing when
      copies sit on the shelf creates a queue that the state machine never drains
      (no return event will fire), and auto-checkout skips the physical handover.
    ref: "concepts.md#checkout-return-and-reserve-flows"

  - id: design-library-management-025
    difficulty: intermediate
    tags: [reserve-flow, fairness, strategy-pattern]
    question: |
      The reservation queue is FIFO. The interviewer says "faculty should jump the
      queue." What is the cleanest evolution?
    options:
      - "Sort the queue by member name and hope faculty come first alphabetically"
      - "Add an if(member.isFaculty()) insertAtHead() call inside ReservationService"
      - "Create a separate FacultyReservationService with duplicated logic"
      - "Make queue ordering a pluggable policy — swap the FIFO queue for a priority queue behind the same interface"
    answer: 3
    explanation: |
      Ordering is a policy that varies, so put it behind a seam (comparator or a
      QueuePolicy strategy). Hard-coding faculty checks inside the service is the
      if/else creep Strategy exists to prevent; duplicating the service forks the
      lifecycle logic.
    ref: "concepts.md#checkout-return-and-reserve-flows"

  - id: design-library-management-026
    difficulty: advanced
    tags: [api-design, identifiers]
    question: |
      Why does checkout(barcode, memberId) take a barcode while reserve(isbn,
      memberId) takes an ISBN?
    options:
      - "Checkout hands over one scanned physical copy (copy-level), while a reservation claims the title, any copy (title-level)"
      - "Barcodes are shorter strings, so checkout is called more often"
      - "ISBNs are mutable, so lendings can't reference them"
      - "It's an inconsistency the design should fix by using barcodes everywhere"
    answer: 0
    explanation: |
      The parameter types encode the domain asymmetry: lendings bind to a concrete
      BookItem, reservations to a Book. Using barcodes everywhere would force
      members to reserve a specific copy — worse fairness and worse semantics.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-library-management-027
    difficulty: intermediate
    tags: [api-design, error-handling]
    question: |
      returnBook returns a ReturnResult containing an Optional<Fine> rather than
      returning null when no fine applies. Why?
    options:
      - "Optional uses less memory than null"
      - "Java requires Optional for all return types since JDK 17"
      - "The type makes 'there may be no fine' explicit, so callers can't forget the null check"
      - "It allows the fine to be recalculated lazily on each access"
    answer: 2
    explanation: |
      Encoding absence in the type moves a runtime NPE risk to a compile-time
      obligation. Business-rule outcomes should be explicit in signatures — the same
      reason the API throws typed exceptions instead of returning boolean flags.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-library-management-028
    difficulty: beginner
    tags: [api-design, exceptions]
    question: |
      A member at the 5-book limit attempts a checkout. Per the API design, what
      should happen?
    options:
      - "checkout returns null"
      - "checkout throws a specific CheckoutLimitExceededException the caller can handle"
      - "checkout returns a BookLending with a null due date"
      - "checkout silently succeeds but flags the member for review"
    answer: 1
    explanation: |
      Business-rule violations should surface as explicit, typed failures — never as
      null returns or half-valid objects that push the error downstream. The desk UI
      can catch the specific exception and show a precise message.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-library-management-029
    difficulty: intermediate
    tags: [code-skeleton, dependency-injection]
    question: |
      In the LendingService skeleton, FineStrategy, ReservationService, and
      NotificationService are constructor-injected. What is the main design payoff?
    options:
      - "Constructors run faster than setter methods"
      - "It guarantees the services are Singletons"
      - "It lets LendingService create its dependencies on demand"
      - "The three seams every follow-up pulls on (fine policy, queue policy, channels) can be swapped or mocked without touching lending logic"
    answer: 3
    explanation: |
      Injection makes the variability points explicit and testable: pass a fake
      NotificationService in tests, a capped FineStrategy in production. On-demand
      creation is the opposite of injection, and DI implies nothing about Singletons.
    ref: "concepts.md#code-skeleton"

  - id: design-library-management-030
    difficulty: intermediate
    tags: [code-skeleton, configuration, extensibility]
    question: |
      MAX_BOOKS and LOAN_DAYS start as constants in LendingService. Per the design,
      what should trigger promoting them to a LendingPolicy object?
    options:
      - "The moment limits vary by member type (student vs. faculty)"
      - "As soon as the code compiles — constants are always wrong"
      - "Only when the values exceed 100"
      - "When the interviewer asks about database persistence"
    answer: 0
    explanation: |
      Constants are fine while the policy is truly global. Per-member-type limits
      turn "a number" into "a policy resolved per member" — that's when a
      LendingPolicy abstraction earns its keep. Premature extraction is
      over-engineering.
    ref: "concepts.md#code-skeleton"

  - id: design-library-management-031
    difficulty: advanced
    tags: [concurrency, check-then-act]
    question: |
      Two self-checkout kiosks scan the last Available copy at the same instant.
      Kiosk code does: if (item.isAvailable()) { lendingService.checkout(item, m); }.
      What is wrong?
    options:
      - "isAvailable() should be renamed canCheckout() for clarity"
      - "Nothing — HashMap operations are atomic in Java"
      - "It's a check-then-act race — both kiosks can pass the check before either transitions the state — so the check and transition must be one atomic operation"
      - "The kiosks should share a single thread to avoid this"
    answer: 2
    explanation: |
      The gap between checking and acting lets both threads see Available. The fix
      is an atomic guarded transition — a synchronized checkout() on the BookItem
      that validates state inside the critical section (or a CAS on an
      AtomicReference<BookStatus>) — not renaming, and not serializing all kiosks.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-library-management-032
    difficulty: advanced
    tags: [concurrency, lock-granularity]
    question: |
      To fix races, a candidate wraps every LibraryService method in one global
      synchronized lock. What is the main objection?
    options:
      - "Global locks don't actually prevent race conditions"
      - "synchronized cannot be applied to service methods"
      - "It makes deadlocks more likely than fine-grained locks would"
      - "Every checkout, return, and search in the building now serializes through one lock — lock per BookItem and per title-queue instead"
    answer: 3
    explanation: |
      Correctness is achieved but concurrency collapses: unrelated operations on
      different copies contend on one monitor. Per-item and per-queue locks confine
      contention to actual conflicts. (A single lock actually makes deadlock less
      likely, not more — that distractor is backwards.)
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-library-management-033
    difficulty: intermediate
    tags: [edge-cases, idempotency]
    question: |
      A librarian accidentally scans the same returned book twice. The second
      returnBook call finds no active lending for the barcode. What should the
      design do?
    options:
      - "Treat it as an idempotent no-op or return an explicit 'no active lending' error — but never crash"
      - "Create a negative fine to compensate the member"
      - "Transition the item to Lost since its lending is missing"
      - "Re-open the previous lending and close it again"
    answer: 0
    explanation: |
      Double-scan is an operational reality; the API must handle "no active lending"
      as a defined outcome. The skeleton's activeLendings.remove(barcode) returning
      null is the detection point — the design decision is what to do with it,
      and crashing or corrupting state are the only wrong answers.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-library-management-034
    difficulty: advanced
    tags: [edge-cases, lost-books, strategy-pattern]
    question: |
      A member reports a borrowed book lost. Which combination of design elements
      handles this without new conditionals in the return flow?
    options:
      - "Delete the BookItem and the BookLending to keep the data clean"
      - "Transition the item to Lost, and charge via a replacement-cost FineStrategy implementation"
      - "Set the item to Available so the count of copies stays constant"
      - "Block the member permanently via a boolean on Member"
    answer: 1
    explanation: |
      Lost is a terminal lifecycle state, and the replacement charge is just another
      fine policy — a second FineStrategy implementation, showing the seam paying
      off. Deleting records destroys the audit trail the fine depends on.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-library-management-035
    difficulty: advanced
    tags: [extensibility, ebooks, polymorphism]
    question: |
      The interviewer asks you to add e-books with N simultaneous licenses. Which
      approach keeps the checkout flow unchanged?
    options:
      - "Add if (item.isDigital()) branches in LendingService.checkout"
      - "Create a parallel EBookLendingService duplicating the checkout logic"
      - "Introduce a LendableItem abstraction — physical copies and EBookItem both implement it, each owning its own availability rule"
      - "Model each license as a fake BookItem with a virtual barcode and a null rack"
    answer: 2
    explanation: |
      Putting the availability rule inside the item type (single-copy lifecycle vs.
      license counting) is polymorphism doing the work; the lending workflow calls
      the same interface. Type-check branches scatter digital logic across services,
      and null-rack fake copies abuse the physical model.
    ref: "concepts.md#extensibility"

  - id: design-library-management-036
    difficulty: intermediate
    tags: [extensibility, member-tiers, ocp]
    question: |
      "Faculty borrow 10 books for 30 days; students 5 for 10." Why does the
      existing design absorb this as pure addition?
    options:
      - "Because Member is a Singleton and can hold both limits"
      - "Because the Catalog indexes members by type"
      - "Because loan periods are stored on Book"
      - "Because services already depend on policy abstractions — add a LendingPolicy resolved per member type and tier-aware FineStrategy implementations, modifying nothing"
    answer: 3
    explanation: |
      This is OCP made concrete: the seams (policy and strategy interfaces) were
      placed where change was anticipated, so member tiers become new
      implementations plus a resolver — no edits to tested lending code.
    ref: "concepts.md#extensibility"

  - id: design-library-management-037
    difficulty: advanced
    tags: [extensibility, inter-library-loan, boundaries]
    question: |
      For inter-library loan, the design proposes a RemoteLibraryClient interface
      and an ExternalLoan lending subtype, while deferring multi-branch data
      consistency. Why is the deferral correct in this round?
    options:
      - "Cross-branch consistency is a distributed-systems (HLD) problem — the LLD contribution is clean seams that a remote implementation can plug into"
      - "Inter-library loans never fail, so consistency is a non-issue"
      - "The candidate should implement two-phase commit on the whiteboard"
      - "Remote clients can't be represented in UML class diagrams"
    answer: 0
    explanation: |
      Knowing which layer owns which problem is the boundary skill this round tests.
      The OO model contributes the interface seam and the ExternalLoan subtype;
      replication and consistency protocols belong to the system-design round.
    ref: "concepts.md#extensibility"

  - id: design-library-management-038
    difficulty: intermediate
    tags: [extensibility, notifications, observer-pattern]
    question: |
      Marketing wants WhatsApp reservation alerts added next quarter. In the current
      design, what does that change require?
    options:
      - "A new branch in LendingService.returnBook for WhatsApp"
      - "A WhatsApp field on BookReservation"
      - "Rewriting NotificationService as an abstract class"
      - "One new Observer subscriber implementing the notification interface — zero changes to lending code"
    answer: 3
    explanation: |
      This is the Observer payoff measured concretely: the event source doesn't
      enumerate channels, so a channel is added by registering one more subscriber.
      Any answer that touches the lending flow means the decoupling failed.
    ref: "concepts.md#extensibility"

  - id: design-library-management-039
    difficulty: beginner
    tags: [actors, requirements]
    question: |
      Which pair of actors is sufficient for the interview-scoped library system?
    options:
      - "Member and Publisher"
      - "Guest and Administrator"
      - "Member and Librarian"
      - "Author and Member"
    answer: 2
    explanation: |
      Members borrow, return, reserve, and search; librarians manage inventory,
      members, and fines. Publishers and authors are metadata on Book, not actors,
      and guest/admin roles add scope without adding design signal.
    ref: "concepts.md#requirements-clarification"

  - id: design-library-management-040
    difficulty: intermediate
    tags: [srp, responsibility, librarian]
    question: |
      Where should the logic that executes "add a new copy to the collection" live?
    options:
      - "Inside Librarian, which directly mutates the Catalog's internal maps"
      - "Inside Book, via a static addCopy factory"
      - "Inside Rack, since new copies need shelf space"
      - "Behind the LibraryService facade (delegating to Catalog/inventory), with Librarian as the calling actor"
    answer: 3
    explanation: |
      Librarian is an actor that initiates operations; the system logic belongs to
      the service layer. Letting actor classes reach into Catalog internals couples
      the actor to storage layout and duplicates logic if another actor needs it.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-library-management-041
    difficulty: intermediate
    tags: [state-machine, checkout, reserved-state]
    question: |
      Member A was notified their reserved copy is ready (state: Reserved). Member B
      walks up and tries to check out that exact copy. What does the state machine
      dictate?
    options:
      - "B's checkout is refused — a Reserved copy can only be checked out by the reserving member"
      - "B's checkout succeeds — first come, first served at the desk"
      - "The copy splits into two lendings until A arrives"
      - "The copy transitions to Lost to avoid the conflict"
    answer: 0
    explanation: |
      Reserved means "held for a specific member." The checkout guard allows
      Available for anyone, or Reserved only when the requesting member matches the
      assigned reservation — otherwise the hold would be meaningless.
    ref: "concepts.md#bookitem-state-machine"

  - id: design-library-management-042
    difficulty: advanced
    tags: [concurrency, reservations, race-condition]
    question: |
      Thread 1 is returning the last loaned copy of a title while Thread 2 is
      creating a reservation for the same title. Without synchronization on the
      title's reservation queue, what can go wrong?
    options:
      - "The return sees an empty queue and marks the copy Available, while the new reservation enqueues expecting to wait — the member waits forever despite a free copy"
      - "The Book's ISBN can be corrupted by concurrent writes"
      - "Both threads deadlock because HashMap is fair by default"
      - "The fine is charged to the reserving member instead of the borrower"
    answer: 0
    explanation: |
      The return's "check queue then choose state" and the reserve's "check
      availability then enqueue" interleave so each misses the other. Serializing
      per-title queue operations makes the two decisions mutually exclusive.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-library-management-043
    difficulty: beginner
    tags: [entities, fine]
    question: |
      What does the Fine class reference to justify its amount?
    options:
      - "The Member's full lending history"
      - "The Book title that was borrowed"
      - "The BookLending whose due and return dates prove the overdue period"
      - "The Librarian who collected it"
    answer: 2
    explanation: |
      A fine is evidence-backed: its amount derives from one lending's dates (or a
      lost-item event on that lending). Tying it to the lending record keeps the
      audit trail; tying it only to Member or Book loses the justification.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-library-management-044
    difficulty: expert
    tags: [design-reasoning, book-vs-bookitem, follow-up]
    question: |
      The interviewer challenges: "Merge Book and BookItem into one class — it's
      simpler." Which failure is the most precise rebuttal?
    options:
      - "One class cannot have both an isbn and a barcode field"
      - "Merging makes the class diagram look too small for a senior interview"
      - "UML notation has no way to draw a merged class"
      - "With one class, 'reserve this title' and 'how many copies are available' have no clean expression — a reservation would bind to one arbitrary copy, and availability needs a scan over duplicated metadata"
    answer: 3
    explanation: |
      The rebuttal must be behavioral, not aesthetic: title-level operations
      (reserve, count availability) and copy-level operations (checkout, lose)
      genuinely have different multiplicities. Merging forces either duplicated
      metadata per copy or a copies-counter that can't hold per-copy state.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-library-management-045
    difficulty: expert
    tags: [follow-up, persistence, boundaries]
    question: |
      Asked "how would you persist this?", the strong LLD answer is:
    options:
      - "Put repository interfaces (e.g., LendingRepository) behind the services so storage is a swappable detail, and note the OO model stays the same"
      - "Rewrite every entity as a database table and drop the object model"
      - "Serialize the whole Library object graph to one JSON file on every change"
      - "Explain the internals of B-tree indexes in the chosen database"
    answer: 0
    explanation: |
      Persistence is a detail behind a seam (DIP again): services talk to repository
      abstractions, and in the interview an in-memory map implementation suffices.
      Schema design and index internals belong to other rounds.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-library-management-046
    difficulty: intermediate
    tags: [notifications, dip, interfaces]
    question: |
      NotificationService is declared as an interface with notifyAvailable and
      notifyDueSoon. What does keeping it an interface (vs. a concrete EmailSender
      used directly) protect?
    options:
      - "It prevents members from receiving duplicate emails"
      - "It guarantees notifications are delivered exactly once"
      - "Lending code stays ignorant of delivery mechanics, so channels can be added, swapped, or faked in tests without touching the return flow"
      - "It makes notification sending asynchronous automatically"
    answer: 2
    explanation: |
      The interface is the decoupling; delivery guarantees and async behavior are
      implementation concerns it does NOT provide by itself. What it does provide is
      substitutability — the DIP/Observer combination that makes channel changes
      zero-touch for lending.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-library-management-047
    difficulty: advanced
    tags: [reserve-flow, data-structures]
    question: |
      Reservations for a title are stored as a Queue<BookReservation> per ISBN. What
      design property does the queue choice itself encode?
    options:
      - "Reservation expiry timing"
      - "The fairness policy — first to reserve is first served when a copy returns"
      - "The maximum number of reservations per member"
      - "Whether digital copies can be reserved"
    answer: 1
    explanation: |
      FIFO ordering IS the fairness rule, chosen at the data-structure level. That's
      also why "faculty jump the queue" is answered by swapping the queue for a
      priority queue behind the same interface — the policy lives in one place.
    ref: "concepts.md#checkout-return-and-reserve-flows"

  - id: design-library-management-048
    difficulty: beginner
    tags: [scoping, out-of-scope]
    question: |
      Which item is correctly scoped OUT of the 45-minute library LLD?
    options:
      - "Overdue fine calculation"
      - "The BookItem availability lifecycle"
      - "Reservation queues for checked-out titles"
      - "Payment-gateway integration for collecting fines online"
    answer: 3
    explanation: |
      Fines must be computed (core domain logic), but processing payments through a
      gateway is an integration concern that adds no OO-design signal. Scoping it
      out — while noting Fine records the amount owed — keeps time for the parts
      that are evaluated.
    ref: "concepts.md#requirements-clarification"
