topic: "Design a Parking Lot"
domain: lld-and-ood
topic_slug: design-parking-lot
version: 1
questions:
  - id: design-parking-lot-001
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      In the first five minutes of "Design a Parking Lot", which clarification most
      directly changes the shape of the spot-allocation logic?
    options:
      - "What color should the parking tickets be printed in?"
      - "Does a bus occupy one LARGE spot, or N consecutive regular spots?"
      - "Which relational database will store the tickets?"
      - "How many attendants work at the lot per shift?"
    answer: 1
    explanation: |
      One-large-spot-per-bus keeps allocation a simple per-type free-set lookup;
      N-consecutive-spots forces the allocator to track contiguous free ranges, a
      significantly harder data-structure problem. Ticket color is cosmetic, database
      choice is out of LLD scope, and staffing doesn't affect the object model.
    ref: "concepts.md#requirements-clarification"

  - id: design-parking-lot-002
    difficulty: beginner
    tags: [requirements, scoping, boundaries]
    question: |
      The interviewer asks "how would this handle 500 parking lots across a city with a
      mobile app for finding spots?" during an LLD round. What is the strongest response?
    options:
      - "Redesign the classes to add a CityLotRegistry that shards spot inventory across every lot with replication logic"
      - "Explain the sharding strategy for the tickets table in detail, partitioning rows by lotId across regional replicas"
      - "Acknowledge it as an HLD concern (lot-finder service, per-lot state) in one sentence and keep the LLD single-lot"
      - "Say the current design already handles it because the ParkingLot Singleton is shared safely across all city lots"
    answer: 2
    explanation: |
      LLD rounds are about single-process OO design. The strong answer names the shape of
      the distributed solution briefly and defers it to system design. Claiming a
      Singleton solves multi-lot scale is backwards — Singleton assumes one lot per
      process.
    ref: "concepts.md#requirements-clarification"

  - id: design-parking-lot-003
    difficulty: beginner
    tags: [requirements, compatibility]
    question: |
      Why is "can a car park in a LARGE spot when compact spots are full?" a high-signal
      clarifying question?
    options:
      - "It reveals that spot-vehicle compatibility and spot-preference order are two separate concerns"
      - "It determines whether the ParkingLot must be a Singleton shared across every entry and exit gate"
      - "It decides whether tickets need to store the entry time alongside the assigned spot number"
      - "It determines how many exit gates the lot needs to avoid queueing at peak arrival hours"
    answer: 0
    explanation: |
      Compatibility ("what CAN this vehicle use") is a fixed rule encoded in
      canFit(vehicle); preference ("what SHOULD it use first") is a policy that belongs
      in the assignment strategy. Recognizing they are different concerns — one stable,
      one pluggable — is exactly the separation the design is built on.
    ref: "concepts.md#requirements-clarification"

  - id: design-parking-lot-004
    difficulty: beginner
    tags: [entities, responsibilities]
    question: |
      In the standard design, which responsibility belongs to ParkingSpot?
    options:
      - "Choosing which vehicle among several waiting ones gets the spot"
      - "Calculating the parking fee for the vehicle occupying it"
      - "Knowing whether a given vehicle can physically fit in it"
      - "Tracking free-spot counts for the whole floor"
    answer: 2
    explanation: |
      canFit(vehicle) is intrinsic to the spot (its size/type vs. the vehicle's type).
      Choosing WHICH spot/vehicle pairing happens is the assignment strategy's job,
      pricing is the PricingStrategy's job, and per-floor free counts belong to
      ParkingFloor. Keeping each class to one responsibility is the SRP test here.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-parking-lot-005
    difficulty: beginner
    tags: [entities, ticket]
    question: |
      What is the primary design role of the Ticket class?
    options:
      - "It stores the pricing rules and rate tables that will be applied when the vehicle exits"
      - "It is the join point connecting a vehicle to a spot and an entry time, keying the exit flow"
      - "It manages the state transitions of the parking spot between free, reserved, and occupied"
      - "It notifies the display board to refresh its free-spot count when the vehicle finally leaves"
    answer: 1
    explanation: |
      Ticket is an immutable record (vehicle, spot, entryTime) created at entry and
      surrendered at exit — the artifact that lets the exit gate find the spot to free
      and the duration to bill. Pricing rules live in PricingStrategy, spot state in
      ParkingSpot/ParkingFloor, and notifications in the observer wiring.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-parking-lot-006
    difficulty: intermediate
    tags: [relationships, composition]
    question: |
      ParkingLot-to-ParkingFloor and ParkingFloor-to-ParkingSpot are modeled as
      composition. What justifies composition rather than plain association?
    options:
      - "Composition generates faster field-access code than a plain association reference"
      - "UML requires composition whenever a class holds a collection of another class"
      - "Floors and spots can be shared between multiple parking lots to save memory at runtime"
      - "A spot has no meaning or lifecycle outside its floor — parts don't outlive the whole"
    answer: 3
    explanation: |
      Composition expresses ownership with lifecycle dependency: destroy the lot and its
      floors/spots cease to exist; a spot is never shared with another lot. Collections
      don't imply composition (a Ticket holds references without owning them), and
      composition is a modeling statement, not a performance feature.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-parking-lot-007
    difficulty: intermediate
    tags: [relationships, association]
    question: |
      Why is Ticket -> ParkingSpot modeled as an association rather than composition?
    options:
      - "Because Ticket is immutable and composition requires mutable back-reference fields"
      - "Because the spot outlives every ticket ever issued against it — their lifecycles are independent"
      - "Because composition would create a circular dependency between Ticket and ParkingFloor"
      - "Because association relationships serialize to JSON more easily than composed ones"
    answer: 1
    explanation: |
      The ticket merely references the spot; when the ticket is closed the spot lives on
      and gets referenced by future tickets. Composition would wrongly claim the ticket
      owns the spot's lifecycle. Immutability, cycles, and serialization are not what
      distinguishes the two relationship kinds.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-parking-lot-008
    difficulty: beginner
    tags: [entities, gates]
    question: |
      What is the intended responsibility split between EntryGate and ParkingLot?
    options:
      - "EntryGate scans every floor for a free spot; ParkingLot only prints the physical ticket"
      - "EntryGate owns the assignment strategy while ParkingLot owns the pricing strategy for exits"
      - "EntryGate is a thin boundary that delegates allocation to ParkingLot and hands back the ticket"
      - "EntryGate and ParkingLot both independently search for spots to double-check each other's result"
    answer: 2
    explanation: |
      Gates are boundary objects: they accept the vehicle, call
      parkingLot.parkVehicle(), and emit the ticket. Allocation logic centralized in the
      lot (via its strategy) keeps multiple gates consistent — if each gate searched
      independently you would invite the double-assignment race and duplicate logic.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-parking-lot-009
    difficulty: beginner
    tags: [class-diagram, inheritance]
    question: |
      In the class diagram, Motorcycle, Car, and Bus extend an abstract Vehicle. What is
      the main thing this hierarchy provides in this problem?
    options:
      - "A shared identity/type abstraction so allocation and pricing code work on any vehicle uniformly"
      - "Different overriding implementations of a park() method, one specialized per concrete vehicle class"
      - "Per-vehicle runtime state machines that track each kind's own parked/moving lifecycle transitions"
      - "A place to store the fee-calculation logic that applies to each specific vehicle type at exit"
    answer: 0
    explanation: |
      Vehicles are essentially data (plate + type); the hierarchy lets the rest of the
      system treat them polymorphically. Vehicles do NOT park themselves (the lot does),
      they carry no state machine, and fees live in PricingStrategy — putting
      calculateFee on Vehicle would scatter pricing across the hierarchy.
    ref: "concepts.md#class-diagram"

  - id: design-parking-lot-010
    difficulty: intermediate
    tags: [class-diagram, aggregation]
    question: |
      The diagram shows ParkingLot o-- SpotAssignmentStrategy (aggregation) rather than
      composition. What does this express?
    options:
      - "The strategy object must be instantiated inside the ParkingLot constructor and nowhere else"
      - "The strategy object is deep-copied into each ParkingFloor so floors can allocate independently"
      - "There can be at most one strategy instance shared globally across the whole process"
      - "The strategy is a swappable collaborator with an independent lifecycle, not an owned part"
    answer: 3
    explanation: |
      Aggregation signals a has-a relationship without lifecycle ownership: the strategy
      can be constructed elsewhere, injected, shared, and replaced at runtime. That
      swappability is the entire point of making assignment a Strategy.
    ref: "concepts.md#class-diagram"

  - id: design-parking-lot-011
    difficulty: intermediate
    tags: [class-diagram, interview-judgment]
    question: |
      Your class diagram includes Address, CCTVCamera, ParkingAttendant, Shift, and
      InsurancePolicy classes. Why does this hurt you in a 45-minute round?
    options:
      - "UML style guides forbid drawing more than ten classes on a single diagram"
      - "It dilutes the design signal — time goes to inert data classes instead of allocation, pricing, and concurrency"
      - "Those classes cannot be expressed in Mermaid class-diagram syntax during a live round"
      - "Interviewers automatically deduct points for any class that exposes no methods of its own"
    answer: 1
    explanation: |
      The scarce resource is time and interviewer attention. The evaluated core is spot
      allocation, the ticket lifecycle, pricing strategies, and the concurrency story;
      enterprise garnish classes demonstrate none of that. Keep the diagram
      interview-grade: every class should earn its place.
    ref: "concepts.md#class-diagram"

  - id: design-parking-lot-012
    difficulty: beginner
    tags: [patterns, strategy, pricing]
    question: |
      The lot charges hourly today, but the product owner wants first-hour-free next
      quarter and a weekend flat rate later. Which pattern fits, and why?
    options:
      - "Observer — pricing observers subscribe to rate-change events and recompute fees on notify"
      - "Singleton — one global pricing table shared by every gate avoids cross-gate inconsistency"
      - "Strategy — pricing is a policy that varies independently of the exit mechanism"
      - "Template Method — subclass ExitGate for each rate plan and override the fee-calculation step"
    answer: 2
    explanation: |
      The fee-calculation policy varies while the exit flow stays fixed — the textbook
      Strategy setup. New plans become new PricingStrategy implementations, added not
      edited (OCP). Subclassing ExitGate per plan couples plans to gate machinery, and
      Observer/Singleton address different problems entirely.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-parking-lot-013
    difficulty: intermediate
    tags: [patterns, strategy, trade-offs]
    question: |
      Compared with an if-else chain over a PricingMode enum inside ExitGate, what is the
      strongest argument for a PricingStrategy interface?
    options:
      - "Interface dispatch executes faster than a tableswitch bytecode on the JVM's hot path"
      - "New rate plans are added as new classes without editing tested exit-flow code, and each plan is unit-testable in isolation"
      - "It reduces the total number of classes in the system by collapsing the enum branches"
      - "It removes the need to know the vehicle type at exit time when computing the fee"
    answer: 1
    explanation: |
      The OCP/testability argument is the real one: every new plan edited into a switch
      re-risks the exit flow and bloats one method, while strategies isolate change and
      tests. Strategy actually increases class count (a cost worth paying), performance
      is irrelevant at parking-lot scale, and vehicle type is still an input to pricing.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-parking-lot-014
    difficulty: intermediate
    tags: [patterns, strategy, allocation]
    question: |
      NearestFirstStrategy parks each vehicle in the closest compatible spot.
      BestFitStrategy parks it in the smallest compatible spot type. What real trade-off
      makes this worth a pluggable Strategy rather than hardcoding one?
    options:
      - "Nearest-first minimizes customer walking but can let cars consume LARGE spots, later stranding a bus"
      - "Best-fit is always superior at every occupancy level, so the strategy interface exists only for tests"
      - "Nearest-first requires a sorted database index on spot distance while best-fit needs none"
      - "The two strategies differ only in code style and naming, never in the spot they actually pick"
    answer: 0
    explanation: |
      There is a genuine tension: convenience (nearest) versus capacity preservation
      (best-fit keeps big spots for big vehicles). Different lots weigh it differently,
      so the policy is pluggable. Claiming one is always superior misses the trade-off —
      the thing the interviewer wants you to articulate.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-parking-lot-015
    difficulty: beginner
    tags: [patterns, factory]
    question: |
      Where does a Factory earn its place in the parking-lot design?
    options:
      - "Creating a brand-new PricingStrategy instance for every single vehicle that exits the lot"
      - "Wrapping every getter behind a factory method to preserve flexibility for future refactors"
      - "Constructing every Ticket object through a factory, on the grounds that tickets are immutable"
      - "Centralizing spot construction during lot initialization (IDs, types, floor wiring) in one place"
    answer: 3
    explanation: |
      Lot setup creates hundreds of spots with type-specific wiring — a
      ParkingSpotFactory keeps that construction logic in one place. A simple static
      factory suffices; per-exit strategy creation and blanket factory-wrapping are
      over-engineering, and immutability alone doesn't demand a factory.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-parking-lot-016
    difficulty: advanced
    tags: [patterns, singleton, testability]
    question: |
      The interviewer says "Make ParkingLot a Singleton — defend or attack." Which answer
      shows the most design maturity?
    options:
      - "Defend fully: a getInstance() with double-checked locking is the accepted industry-standard idiom"
      - "One-lot-per-process is real, but a global getInstance() hurts testability and future multi-lot support — prefer creating one instance in main() and injecting it"
      - "Attack fully: Singleton is a discredited anti-pattern and must never appear in any object design"
      - "Defend it because a Singleton is what guarantees thread safety for allocation across the gates"
    answer: 1
    explanation: |
      The nuanced answer accepts the single-instance premise while naming the costs:
      hidden global state blocks test isolation, and hard-wired getInstance() calls make
      the "support 10 lots" follow-up expensive. Injection of a single instance keeps
      the benefit without the coupling. Singleton also does nothing for thread safety of
      allocation — that's the lock's job.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-parking-lot-017
    difficulty: intermediate
    tags: [enums, inheritance, modeling]
    question: |
      Why encode vehicle/spot compatibility in a canFit(vehicle) method over enums,
      instead of creating subclasses like CompactSpotForCar and LargeSpotForBus?
    options:
      - "Enum constants occupy less heap memory than an equivalent set of subclass instances"
      - "Java caps how deep a single inheritance hierarchy is allowed to nest at compile time"
      - "Subclass-per-combination explodes combinatorially, and fitting is a rule (data), not a behavioral variation that warrants inheritance"
      - "The extra subclasses would structurally prevent ParkingLot from being implemented as a Singleton"
    answer: 2
    explanation: |
      With V vehicle types and S spot types you'd need up to V×S subclasses, each adding
      no distinct behavior — a classic misuse of inheritance. A compatibility matrix in
      one method (or table) captures the rule in one place and extends by adding an enum
      constant plus a rule line.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-parking-lot-018
    difficulty: intermediate
    tags: [data-structures, efficiency]
    question: |
      Each ParkingFloor keeps Map<SpotType, NavigableSet<ParkingSpot>> of free spots.
      What does this buy over a flat List<ParkingSpot> per floor?
    options:
      - "It removes the need for any locking during allocation because the map is self-synchronizing"
      - "Allocation probes compatible types in preference order without an O(n) scan over all spots, and the ordered set gives 'nearest' cheaply"
      - "It guarantees that buses always find five consecutive spots in the same row"
      - "It makes the ParkingSpot objects effectively immutable once stored in the set"
    answer: 1
    explanation: |
      Indexing free spots by type turns "find a compact spot" into a direct lookup, and
      a NavigableSet ordered by spot number yields the nearest/first spot in O(log n).
      It has nothing to do with locking, immutability, or contiguity — consecutive-spot
      allocation needs additional range tracking.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-parking-lot-019
    difficulty: beginner
    tags: [api, ticket]
    question: |
      Why should parkVehicle(vehicle) return a Ticket rather than a ParkingSpot?
    options:
      - "The ticket is the customer-facing artifact and the key for the exit flow; the spot is internal bookkeeping"
      - "ParkingSpot is mutable, so returning its reference would leak internal state and force the caller to synchronize on it"
      - "Returning a spot object would force ParkingLot to abandon the Singleton pattern that keeps allocation consistent"
      - "Tickets are far smaller objects than spots, so returning them is cheaper and reduces heap pressure on the exit path"
    answer: 0
    explanation: |
      The API should hand back what the domain hands back: a ticket recording vehicle,
      spot, and entry time, which the customer later presents at exit. Exposing the raw
      spot leaks internals and gives callers nothing to pay with. The mutability and
      size arguments are red herrings.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-parking-lot-020
    difficulty: intermediate
    tags: [api, error-handling]
    question: |
      The assignment strategy returns Optional<ParkingSpot> (or the facade throws
      ParkingFullException). What design goal does this serve versus returning null?
    options:
      - "Optional is an inherently thread-safe wrapper, so concurrent gates can share the returned value without any locking"
      - "It avoids allocating a Ticket object when the lot is empty, saving heap and garbage-collection work on the full-lot path"
      - "It makes the 'lot full' outcome explicit in the signature so callers must handle it, instead of risking a silent NullPointerException"
      - "It lets the strategy return several candidate spots at once so the gate can pick among them by proximity"
    answer: 2
    explanation: |
      "No spot available" is a normal, expected outcome, so it belongs in the method's
      type contract. Optional (or a checked exception at the facade) forces gate code to
      handle rejection paths — display 'FULL', refuse entry — rather than crashing on a
      null three calls later.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-parking-lot-021
    difficulty: intermediate
    tags: [api, money]
    question: |
      The design uses a Money type (amount + currency) for fees instead of double. Why?
    options:
      - "A double cannot store monetary values larger than one million, so large fees would silently overflow to infinity"
      - "Money objects render better on printed receipts because they carry their own currency-aware formatting logic"
      - "The JVM garbage-collects primitive doubles far more slowly than pooled objects, hurting throughput at the exit gate"
      - "Binary floating point cannot represent decimal amounts exactly, causing rounding errors in fee arithmetic"
    answer: 3
    explanation: |
      0.1 has no exact binary representation, so accumulating hourly fees in double
      drifts by fractions of a cent — unacceptable in billing. A Money value type
      (backed by BigDecimal or integer minor units) plus a currency prevents both
      rounding drift and cross-currency mistakes.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-parking-lot-022
    difficulty: beginner
    tags: [api, exit-flow]
    question: |
      Why does the exit flow take a ticketId string and look the ticket up in an
      activeTickets map, rather than taking a Ticket object directly?
    options:
      - "Ticket objects are too large to pass between methods, so passing the compact ID string keeps stack frames small and the exit call faster"
      - "The customer physically presents an ID; the lot must resolve it to the live ticket record it trusts, and a missing entry cleanly signals an invalid or already-used ticket"
      - "Strings are far easier to unit test than rich domain objects, so an ID-based exit API keeps the flow's unit tests simpler to write"
      - "It allows two customers to share a single ticket safely, since the lot keys the whole exit flow off the ID string rather than object identity"
    answer: 1
    explanation: |
      The system of record is the lot's active-ticket map. Accepting a caller-supplied
      Ticket object would trust unverified data; resolving an ID also makes duplicate
      exits fail naturally (second lookup finds nothing -> InvalidTicketException).
    ref: "concepts.md#api-and-method-signatures"

  - id: design-parking-lot-023
    difficulty: beginner
    tags: [code-skeleton, immutability]
    question: |
      Ticket is designed immutable (final fields, no setters). What is the main design
      benefit here?
    options:
      - "Immutable objects are exempt from garbage collection, so long-lived tickets never add pressure to the collector during a busy day"
      - "It lets Ticket safely subclass Vehicle, since final fields are required before a class can participate in an inheritance hierarchy"
      - "A parking event's facts (vehicle, spot, entry time) never change after creation, and immutable tickets can be shared across threads without synchronization"
      - "It reduces the number of constructor parameters the exit flow must pass, because immutable classes can default the fields they omit"
    answer: 2
    explanation: |
      The ticket records historical facts, so mutability would only invite corruption
      (e.g., someone editing entryTime before billing). Immutability also gives free
      thread-safety for reads — useful when gates on different threads handle the same
      ticket lifecycle.
    ref: "concepts.md#code-skeleton"

  - id: design-parking-lot-024
    difficulty: intermediate
    tags: [code-skeleton, pricing]
    question: |
      In HourlyPricing.calculateFee, the skeleton computes ceilHours(entry, exit) —
      rounding partial hours UP. Why is this called out explicitly in the skeleton?
    options:
      - "Rounding behavior is a business rule that must be deliberate — floor vs. ceiling changes every bill, and interviewers probe whether you noticed"
      - "Java's Duration class only supports ceiling division, so the skeleton is forced to round partial hours up regardless of intent"
      - "Rounding partial hours down would produce negative fees whenever a car stays less than a full hour, so the ceiling is mandatory"
      - "The ceiling operation lets the fee computation run in constant time instead of iterating minute-by-minute over the whole stay"
    answer: 0
    explanation: |
      61 minutes = 2 billable hours under ceiling, 1 under floor. Which one applies is a
      product decision that belongs visibly in the pricing strategy, not buried in
      integer division. Calling it out shows you treat billing edge behavior as a
      first-class requirement.
    ref: "concepts.md#code-skeleton"

  - id: design-parking-lot-025
    difficulty: advanced
    tags: [concurrency, race-condition]
    question: |
      Two cars arrive at two entry gates and one free spot remains. Both gate threads
      call findSpot(), both see the same spot, both occupy it. What is the precise
      nature of this bug?
    options:
      - "A deadlock — each gate holds a lock the other needs, so the two threads block each other forever and never advance"
      - "Livelock — both gates keep detecting the conflict and retrying their allocation, so neither ever makes forward progress"
      - "Priority inversion — the higher-priority gate thread is forced to wait on the lower-priority one holding the spot"
      - "A check-then-act race — the check (find) and the act (occupy) are not atomic, so both threads pass the check before either acts"
    answer: 3
    explanation: |
      Nothing blocks or spins — both threads make progress into a corrupt state (one
      spot, two tickets). The compound operation find-then-occupy must execute
      atomically; any interleaving between the two steps is the bug. Naming it
      "check-then-act" shows you know the concurrency vocabulary.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-parking-lot-026
    difficulty: advanced
    tags: [concurrency, locking]
    question: |
      Which fix for the two-gates race is the best FIRST answer in an interview?
    options:
      - "Mark every method in every class synchronized so that no two threads can ever run allocation code concurrently"
      - "A single lock held across find-and-occupy — correct, simple, and throughput at parking-lot arrival rates makes coarse locking fine"
      - "Give each entry gate its own private copy of the free-spot data so the gates never contend on shared allocation state"
      - "Add a 50ms sleep after findSpot so the other thread finishes first and simultaneous claims become vanishingly unlikely"
    answer: 1
    explanation: |
      Start correct and simple: one lock around the compound operation, then offer
      per-floor locks or CAS as refinements if asked about contention. Blanket
      synchronized shows no analysis, per-gate copies guarantee divergence (the bug,
      institutionalized), and sleeps shrink but never remove the race window.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-parking-lot-027
    difficulty: expert
    tags: [concurrency, cas, lock-free]
    question: |
      In the lock-free refinement, ParkingSpot.tryOccupy(vehicle) uses
      compareAndSet(null, vehicle) on an AtomicReference. What obligation does this
      design place on the assignment strategy's caller?
    options:
      - "It must hold the floor lock while calling tryOccupy so the compareAndSet always observes a stable spot state"
      - "It must call tryOccupy exactly twice and compare the two results to confirm the atomic claim actually succeeded"
      - "It must handle claim failure by retrying with the next candidate spot, since another thread may win the CAS"
      - "It must mark the vehicle object volatile so the compareAndSet publishes the reference safely to other threads"
    answer: 2
    explanation: |
      With CAS, the strategy only PROPOSES a spot; the atomic claim either wins or
      loses. Losers must loop to the next candidate (and eventually conclude
      lot-full). Forgetting the retry loop is the classic mistake when upgrading from
      lock-based to lock-free claiming — and holding a lock anyway would defeat the
      point.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-parking-lot-028
    difficulty: advanced
    tags: [concurrency, locking, granularity]
    question: |
      You replace the single allocation lock with one lock per ParkingFloor. What new
      concern must you now watch for?
    options:
      - "Any future operation that must touch two floors needs a consistent lock-acquisition order to avoid deadlock"
      - "Per-floor locks force the Ticket class to become mutable so it can record which floor lock is currently held"
      - "The JVM permits only one intrinsic lock object per class, so multiple per-floor locks cannot coexist at runtime"
      - "Reads of free-spot counts across floors become impossible once each floor guards its own state behind a separate lock"
    answer: 0
    explanation: |
      Finer granularity buys parallelism across floors but introduces the multi-lock
      hazard: if operation A locks floor 1 then floor 2 while B locks 2 then 1, they
      can deadlock. The standard discipline is a global lock order (e.g., ascending
      floor number). The other options are nonsense distractors.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-parking-lot-029
    difficulty: intermediate
    tags: [edge-cases, payment]
    question: |
      Payment fails at the exit gate. What must the system do with the spot and ticket?
    options:
      - "Free the spot immediately but keep the ticket active, letting the vehicle leave and billing the stored plate later"
      - "Free the spot and delete the ticket right away to keep the occupancy data consistent after the failed charge"
      - "Mark the spot free but flag the vehicle's plate for a fine, letting the allocator reuse the spot straight away"
      - "Keep the spot occupied and the ticket active — never release resources before payment succeeds, then retry payment"
    answer: 3
    explanation: |
      The invariant is: spot release happens only after successful payment. Freeing the
      spot first means the vehicle is still physically present in a spot the allocator
      now considers free — the next assignment double-books it in the real world.
      Ordering side effects around the payment boundary is the point of this edge case.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-parking-lot-030
    difficulty: intermediate
    tags: [edge-cases, lost-ticket]
    question: |
      A customer lost their ticket. Which design handles this cleanly?
    options:
      - "Impossible to support cleanly — the ticket ID is the only key in the system, so a lost ticket strands the record"
      - "An assessLostTicket(licensePlate) path that finds the active ticket by plate and applies a max-day-rate policy"
      - "Issue a fresh ticket at the exit gate with entry time set to now, so the computed fee comes out to exactly zero"
      - "Free the spot and skip payment entirely, since without the ticket the parking duration and fee cannot be computed"
    answer: 1
    explanation: |
      Active tickets store the vehicle, so a secondary lookup by license plate recovers
      the parking record. The common real-world fee policy is the maximum daily rate
      (the lot can't prove duration in the customer's favor). A zero fee or skipped
      payment creates an obvious fraud vector — "lose" your ticket every time.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-parking-lot-031
    difficulty: intermediate
    tags: [edge-cases, validation]
    question: |
      A customer tries to exit twice with the same ticket ID (e.g., a photocopied
      ticket). How does the activeTickets-map design handle the second attempt?
    options:
      - "The second exit recomputes a fee of exactly zero, since the stored entry and exit times make the duration unchanged"
      - "The second exit throws ParkingFullException, because the lot treats the replayed ticket as a brand-new arrival"
      - "The first successful exit removed the ticket from activeTickets, so the second lookup finds nothing and raises InvalidTicketException"
      - "The map silently allows both exits, because ticket IDs are generated per-gate and are therefore not globally unique"
    answer: 2
    explanation: |
      Because exit consumes the active-ticket entry (remove on success), replay attempts
      fail naturally at lookup — no special-case code needed. This is a nice example of
      choosing a data flow (consume-on-use) that makes an entire class of bugs
      structurally impossible.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-parking-lot-032
    difficulty: intermediate
    tags: [extensibility, ev-charging]
    question: |
      The interviewer asks: "Add EV charging spots." In the enum + compatibility-matrix
      design, what changes?
    options:
      - "Add SpotType.ELECTRIC, one rule in the compatibility logic, and compose a charging-fee strategy with the base pricing — no structural change"
      - "Create an ElectricParkingLot subclass that overrides parkVehicle to route electric cars to charging-enabled spots"
      - "Rewrite the assignment strategies from scratch to add electric routing, since existing spots cannot express charging capability"
      - "Add an isElectric boolean to every existing class in the system so each one can branch on whether it handles charging"
    answer: 0
    explanation: |
      The design absorbs the change at its extension points: a new enum constant, one
      compatibility rule, and a CompositePricingStrategy that sums parking and metered
      charging fees. That locality is Open/Closed working as intended — subclassing the
      whole lot or rewriting strategies signals the design had no extension points.
    ref: "concepts.md#extensibility"

  - id: design-parking-lot-033
    difficulty: intermediate
    tags: [extensibility, subscription, pricing]
    question: |
      Adding monthly passes should require changing which part of the system?
    options:
      - "The EntryGate must skip ticket creation for pass-holders so their monthly plan bypasses the normal per-visit billing"
      - "The ParkingSpot needs a passHolder flag so the allocator can reserve certain spots for monthly subscribers"
      - "The Vehicle hierarchy needs a dedicated PassVehicle subclass so pass-holders are recognized polymorphically at exit"
      - "Only fee calculation: a MonthlyPassPricing strategy keyed off the plate — entry and spot bookkeeping stay unchanged"
    answer: 3
    explanation: |
      Pass-holders still occupy spots, so the ticket must still be issued (the lot needs
      the bookkeeping); what differs is the exit-time charge, which is exactly the axis
      the PricingStrategy isolates. Skipping tickets would corrupt occupancy tracking,
      and neither spots nor the vehicle taxonomy have anything to do with billing plans.
    ref: "concepts.md#extensibility"

  - id: design-parking-lot-034
    difficulty: advanced
    tags: [extensibility, valet]
    question: |
      "Now add valet parking." Which design absorbs this with the least disruption?
    options:
      - "Add a valetMode boolean to ParkingLot that switches parkVehicle into a separate code path for attendant-driven cars"
      - "A ValetService in front of the lot: it accepts the car at a drop-off point, calls the existing parkVehicle, and maps claimCheckId to ticketId"
      - "Subclass every gate class into ValetEntryGate and ValetExitGate so the attendant workflow overrides the standard gate logic"
      - "Move spot assignment out of ParkingLot into the Vehicle class so a valet-driven car can place itself at the drop-off point"
    answer: 1
    explanation: |
      Valet changes WHO drives the car, not how the lot allocates spots — so it layers
      cleanly as a new client of the existing API plus a claim-check-to-ticket mapping.
      Mode flags and parallel gate hierarchies push valet concerns into core classes
      that shouldn't know valet exists.
    ref: "concepts.md#extensibility"

  - id: design-parking-lot-035
    difficulty: advanced
    tags: [extensibility, surge-pricing]
    question: |
      For occupancy-based surge pricing, the concepts note says the senior move is to
      raise one specific question. Which one?
    options:
      - "Whether surge pricing requires a distributed cache to share the current multiplier across all of the gates"
      - "Whether the display board has enough screen space to show the live surge multiplier to arriving drivers"
      - "Whether the rate is fixed at entry (stamped on the ticket) or computed from occupancy at exit"
      - "Whether motorcycles should be exempt from surge pricing because they occupy so little of the lot's capacity"
    answer: 2
    explanation: |
      The mechanism (another PricingStrategy reading occupancy) is easy; the product
      wrinkle is WHEN the rate binds. Stamp-at-entry means the ticket must carry the
      quoted rate; compute-at-exit means customers can't know their rate in advance.
      Surfacing that ambiguity before coding is the judgment being tested.
    ref: "concepts.md#extensibility"

  - id: design-parking-lot-036
    difficulty: advanced
    tags: [extensibility, reservations]
    question: |
      Why do reservations change the design more deeply than EV spots or monthly passes?
    options:
      - "Reservations require a customer-facing mobile app to book spots, which places the whole feature outside LLD scope"
      - "Reservations only affect the DisplayBoard rendering, since a reserved spot is simply shown in a different color to drivers"
      - "Reservations make the Ticket class mutable, because a held spot's reservation state must be updated on the ticket over time"
      - "Spots need a third state (RESERVED with expiry) beyond free/occupied, and the allocator must honor holds — the core allocation invariants change"
    answer: 3
    explanation: |
      EV spots and passes plug into existing extension points (compatibility matrix,
      pricing strategy). Reservations alter the spot lifecycle itself and add
      time-based state (expiring holds), forcing allocator changes. Honest scoping —
      "this one is structural" — beats hand-waving that everything is trivial.
    ref: "concepts.md#extensibility"

  - id: design-parking-lot-037
    difficulty: intermediate
    tags: [solid, srp]
    question: |
      A candidate puts calculateFee(), assignSpot(), and processPayment() all on the
      ParkingLot class. Which SOLID principle is most directly violated, and what is the
      practical cost?
    options:
      - "Single Responsibility — the class changes for pricing, allocation, AND payment reasons, so every policy change risks the others"
      - "Liskov Substitution — subclasses of ParkingLot can no longer be substituted for the base type without breaking pricing and payment callers"
      - "Interface Segregation — ParkingLot now forces every client to depend on pricing and payment methods that most of them never actually call"
      - "Dependency Inversion — ParkingLot depends on concrete pricing and payment classes instead of the abstractions it ought to invert toward"
    answer: 0
    explanation: |
      Three independent axes of change collapsed into one class means three reasons to
      modify it — the definition of an SRP violation. The fix is exactly the standard
      design: PricingStrategy, SpotAssignmentStrategy, and PaymentMethod as separate
      collaborators the facade coordinates.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-parking-lot-038
    difficulty: intermediate
    tags: [solid, ocp]
    question: |
      Which change to the parking-lot system best demonstrates the Open/Closed Principle
      in action?
    options:
      - "Editing HourlyPricing directly to add a weekend discount branch inside its existing calculateFee method"
      - "Adding WeekendFlatRatePricing as a new PricingStrategy implementation while HourlyPricing and ExitGate stay untouched"
      - "Adding a new if-branch inside ExitGate that checks the day of week and applies weekend rates before charging"
      - "Making all pricing fields public so any collaborating class can reach in and adjust the weekend rate at runtime"
    answer: 1
    explanation: |
      OCP: open for extension (new implementation), closed for modification (existing,
      tested classes untouched). Editing HourlyPricing or ExitGate is modification —
      exactly what the strategy seam exists to avoid — and public mutable fields are the
      opposite of a disciplined extension point.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-parking-lot-039
    difficulty: beginner
    tags: [entities, display-board]
    question: |
      What is the DisplayBoard's role, and which pattern naturally connects it to the
      floor's occupancy?
    options:
      - "It allocates spots for arriving vehicles, picking the target spot via a pluggable Strategy on each entry"
      - "It validates tickets at exit, passing each one down a Chain of Responsibility of validation handlers"
      - "It renders free-spot counts and updates when occupancy changes — a natural Observer of the floor"
      - "It caches shared pricing-rule objects across the lot, using Flyweight to avoid duplicating rate tables in memory"
    answer: 2
    explanation: |
      The board is render-only: it shows per-type free counts and must refresh when
      spots are taken or released. Having it observe floor occupancy events keeps the
      floor ignorant of how many boards exist. Allocation and validation belong to
      other classes entirely.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-parking-lot-040
    difficulty: advanced
    tags: [follow-ups, bus-consecutive-spots]
    question: |
      Follow-up: "A bus needs 5 consecutive spots in a row." Why is this a step-change
      in allocator complexity, and what is the honest interview move?
    options:
      - "It's trivial — just call findSpot() five times in a loop and collect whatever five spots come back"
      - "It only requires sorting the existing free set by spot ID so the five nearest entries are always contiguous"
      - "It requires spinning up a second dedicated ParkingLot instance that holds only bus-sized spots for these requests"
      - "Per-type free sets don't capture adjacency — you need free-RANGE tracking per row (ordered set + adjacency scan or interval merging); say so and scope it honestly"
    answer: 3
    explanation: |
      Five independent findSpot() calls return five spots anywhere in the lot — not
      adjacent, and not atomically claimed. Contiguity is a different invariant needing
      range-aware structures and an all-or-nothing claim. Recognizing the jump in
      difficulty (and scoping it) beats pretending a loop solves it.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-parking-lot-041
    difficulty: intermediate
    tags: [follow-ups, multi-lot]
    question: |
      Follow-up: "Support 10 lots in one process for a mall operator." Which earlier
      decision determines whether this is cheap or painful?
    options:
      - "Whether ParkingSpot modeled its size using enum constants or a separate subclass per spot type"
      - "Whether ParkingLot was accessed via a hard-wired getInstance() Singleton or injected as an instance"
      - "Whether Ticket stored entryTime as a java.time.Instant or as a raw epoch-millis long field"
      - "Whether the DisplayBoard refreshed its counts through the Observer pattern or by periodically polling the floor"
    answer: 1
    explanation: |
      If every gate and service calls ParkingLot.getInstance(), ten lots means hunting
      down each call site; if the lot instance was injected, you construct ten instances
      keyed by lotId and pass the right one in. This is why the hedge on Singleton is
      the answer interviewers reward — the follow-up is designed to expose it.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-parking-lot-042
    difficulty: beginner
    tags: [payment, abstraction]
    question: |
      Payment is modeled as a PaymentMethod interface with CashPayment and CardPayment
      implementations. What should the LLD deliberately NOT include here?
    options:
      - "Real payment-gateway integration details (network calls, retries, PCI concerns) — model the seam, not the plumbing"
      - "A pay(Money) method signature on the PaymentMethod interface that each concrete method implements"
      - "A PaymentResult value returned from pay(), indicating whether the charge succeeded or failed"
      - "The ability to add new payment methods later without editing the existing exit-flow code"
    answer: 0
    explanation: |
      The interview signal is the abstraction: a pay(amount) seam with a
      success/failure result, extensible to new methods. Gateway plumbing is
      integration detail that eats time without demonstrating OO design skill —
      name it as out of scope.
    ref: "concepts.md#requirements-clarification"

  - id: design-parking-lot-043
    difficulty: intermediate
    tags: [edge-cases, handicapped]
    question: |
      Handicapped spots must only be assigned to vehicles with a permit. Where does this
      rule belong?
    options:
      - "In the EntryGate's user-interface code, which prompts the driver for a permit before letting the request proceed"
      - "In the Ticket constructor, which should reject a handicapped spot when the vehicle carries no valid permit"
      - "In the eligibility check consulted during allocation — the compatibility logic or the assignment strategy — as a predicate on the vehicle/driver"
      - "In the PricingStrategy, by charging non-permit vehicles a steep penalty rate whenever they land in a handicapped spot"
    answer: 2
    explanation: |
      Permit eligibility is an allocation-time rule: a HANDICAPPED spot 'fits' only a
      permitted vehicle, so it lives with canFit or the strategy's filtering.
      Enforcing it in UI code is bypassable, the ticket is created after assignment
      (too late), and pricing-as-enforcement lets the violation happen and merely
      bills it.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-parking-lot-044
    difficulty: advanced
    tags: [concurrency, check-then-act]
    question: |
      A candidate makes findSpot() synchronized and occupy() synchronized as two
      separately-locked methods. Why does the two-gates race survive?
    options:
      - "The synchronized keyword has no effect on methods that read from or mutate collection objects"
      - "The race lives BETWEEN the calls: both threads can complete findSpot (seeing the same spot) before either enters occupy"
      - "The JVM is free to reorder two synchronized method calls at runtime, so occupy can run before findSpot"
      - "Because findSpot returns an Optional, and Optional wrappers are explicitly documented as not thread-safe"
    answer: 1
    explanation: |
      Locking each step individually makes each step atomic but not the compound
      operation. Thread A finds spot 42, releases the lock, thread B finds spot 42,
      then both occupy it in turn — each occupy() call itself perfectly synchronized.
      The lock must span the whole find-and-occupy sequence (or use a CAS claim).
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-parking-lot-045
    difficulty: intermediate
    tags: [entities, vehicle, responsibilities]
    question: |
      Why should Vehicle NOT have a park() method that finds and occupies a spot?
    options:
      - "Because an abstract Vehicle class is not permitted to contain any concrete method bodies like park()"
      - "Because a park() method would have to be copy-pasted and duplicated in every concrete vehicle subclass"
      - "Because each vehicle would then need to hold a direct reference to the Ticket class it creates on parking"
      - "Allocation needs lot-wide state (free sets, locking, strategy) that a vehicle has no business owning — the lot parks vehicles, not vice versa"
    answer: 3
    explanation: |
      Assignment requires visibility over floors, free-spot indexes, the strategy, and
      the allocation lock. Giving that to Vehicle inverts responsibilities and couples
      a dumb data object to the whole system (a form of feature envy). Information
      expert says: the class with the data (ParkingLot) gets the behavior.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-parking-lot-046
    difficulty: intermediate
    tags: [pricing, composition]
    question: |
      EV charging fees must be added ON TOP of normal parking fees. The concepts suggest
      a CompositePricingStrategy. What is the design idea?
    options:
      - "A strategy that holds other strategies and sums their results — parking fee plus charging fee — behind the same PricingStrategy interface"
      - "A subclass of HourlyPricing that overrides calculateFee to add the metered charging cost on top of the base rate"
      - "Two separate physical exit gates, one that collects the parking fee and another that collects the charging fee"
      - "A global static surcharge constant that the ExitGate tacks on after every pricing strategy call returns"
    answer: 0
    explanation: |
      Composing strategies keeps each fee component independently testable and
      combinable (hourly + charging, first-hour-free + charging...) without a subclass
      per combination. Subclassing HourlyPricing couples charging to one base plan, and
      gate-level surcharges hardcode what the strategy seam was built to keep pluggable.
    ref: "concepts.md#extensibility"

  - id: design-parking-lot-047
    difficulty: beginner
    tags: [scoping, hld-boundary]
    question: |
      Which of these belongs IN scope for the 45-minute LLD, as opposed to being
      deferred to HLD or hardware?
    options:
      - "The embedded firmware that drives the license-plate-recognition cameras at each gate"
      - "The database schema and cross-region replication strategy for durable ticket storage"
      - "The compatibility matrix between vehicle types and spot types"
      - "A city-wide lot-finder microservice that routes drivers to the nearest lot with capacity"
    answer: 2
    explanation: |
      Vehicle/spot compatibility is core object-model territory — it drives canFit, the
      enums, and the allocator. Cameras are hardware, persistence and city-scale
      services are HLD. Explicitly sorting requirements into these buckets in the first
      five minutes is itself an evaluated skill.
    ref: "concepts.md#requirements-clarification"

  - id: design-parking-lot-048
    difficulty: advanced
    tags: [design-decisions, pattern-restraint]
    question: |
      The concepts note warns: "If you're reaching for a fifth pattern, you're probably
      over-engineering." What underlying interview principle is this expressing?
    options:
      - "Design patterns are considered deprecated in modern codebases and interviewers dock points for using them"
      - "Interviewers only ever award credit for the Strategy and Factory patterns, so the rest are wasted effort"
      - "Using more than four distinct classes in a single design is itself a reliable signal of weak modeling"
      - "Patterns must be justified by a varying requirement — pattern-collecting without a driving force reads as cargo-culting, not judgment"
    answer: 3
    explanation: |
      Each pattern in this design maps to a real force: pricing varies (Strategy),
      assignment varies (Strategy), spot construction is repetitive (Factory), one lot
      per process (hedged Singleton). A Decorator or Visitor bolted on without a
      requirement demonstrates memorization. The evaluated skill is matching pattern to
      force, including the restraint not to.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-parking-lot-049
    difficulty: intermediate
    tags: [edge-cases, clock]
    question: |
      At exit, the computed duration is negative (exit time earlier than entry time,
      e.g., after a clock reset). What does the design recommend?
    options:
      - "Throw an exception and trap the car in the lot until the clock is reset"
      - "Charge the minimum fee and log the anomaly for investigation"
      - "Charge the maximum daily rate, exactly as with a lost ticket"
      - "Recompute the duration from the vehicle's own dashboard clock instead"
    answer: 1
    explanation: |
      A clock anomaly is the system's fault, not the customer's — trapping the car or
      charging max rate punishes them for it. Bill the defensible minimum, log loudly,
      and move on. Enumerating this kind of graceful-degradation edge case in one line
      is what "handles edge cases" means in the rubric.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-parking-lot-050
    difficulty: beginner
    tags: [entities, floor]
    question: |
      Which piece of state makes ParkingFloor more than a dumb list of spots?
    options:
      - "A back-reference to the enclosing ParkingLot Singleton so the floor can call back into it"
      - "The pricing table describing the hourly rates for every vehicle type parked on that floor"
      - "Its per-SpotType index of FREE spots, enabling fast type-aware allocation and per-floor availability display"
      - "A queue of vehicles currently waiting at the entrance for a spot on that floor to open up"
    answer: 2
    explanation: |
      The floor's job is fast, type-aware answers to "give me a free COMPACT spot" and
      "how many LARGE spots remain" — that requires the free-spots-by-type index it
      maintains as spots are occupied/released. Pricing lives in strategies and entry
      queues (if any) at the gates.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-parking-lot-051
    difficulty: advanced
    tags: [concurrency, consistency]
    question: |
      hasAvailableSpot(CAR) returns true, but the caller's subsequent parkVehicle call
      throws ParkingFullException. Is this a bug?
    options:
      - "Yes — the availability check must keep holding the allocation lock all the way until parkVehicle is eventually called"
      - "Yes — an availability query is required to always be exact, so any gap between it and park means the design is broken"
      - "No — queries are advisory point-in-time snapshots; only parkVehicle's internal find-and-occupy needs atomicity, and callers must handle rejection anyway"
      - "No — because hasAvailableSpot is hardwired to always return true and never actually inspects the free set"
    answer: 2
    explanation: |
      Making a read query pin the lock until an eventual park would serialize the whole
      lot on lookers-on (and invite lock leaks). The correct contract: queries are
      hints for display boards and routing; the authoritative, atomic decision happens
      inside parkVehicle, whose full path already handles the full-lot outcome.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-parking-lot-052
    difficulty: intermediate
    tags: [api, design]
    question: |
      Why does the design centralize activeTickets in a Map<String, Ticket> inside
      ParkingLot rather than having each ExitGate keep tickets it has seen?
    options:
      - "A vehicle can exit through ANY gate, so ticket lookup must work lot-wide from a single source of truth"
      - "Hash maps offer faster lookups than lists, so keeping tickets in a per-gate map speeds up exit"
      - "ExitGate objects are required to be completely stateless by standard UML modeling convention"
      - "It reduces overall memory usage, since a lot can have a large number of exit gates"
    answer: 0
    explanation: |
      Entry at gate 1, exit at gate 3 is the normal case — per-gate ticket stores would
      fail it. The multi-gate requirement forces shared, lot-level state, which is also
      exactly why concurrent access (ConcurrentHashMap, allocation locking) enters the
      design at all.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-parking-lot-053
    difficulty: expert
    tags: [patterns, strategy, runtime-selection]
    question: |
      The operator wants weekday-nearest-first but event-day-best-fit allocation. Which
      approach best preserves the design's structure?
    options:
      - "Add an if(eventDay) branch inside NearestFirstStrategy that falls back to best-fit logic on event days"
      - "Merge both algorithms into one ConfigurableStrategy with a mode enum and internal branching"
      - "Subclass ParkingLot into EventDayParkingLot that overrides parkVehicle to run the best-fit algorithm"
      - "Since the lot holds the strategy by aggregation, swap the strategy reference (or select via a small context-aware provider) — both implementations stay untouched"
    answer: 3
    explanation: |
      The strategy seam already supports runtime replacement — that's why the diagram
      shows aggregation, not composition. A time/context-based provider that returns
      the right strategy keeps each algorithm pure and testable. Branching inside a
      strategy or a mode enum reintroduces the if-else problem Strategy was chosen to
      remove.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-parking-lot-054
    difficulty: beginner
    tags: [interview-method, time-management]
    question: |
      Per the suggested 45-60 minute budget, where should the MOST design time go?
    options:
      - "Modeling DisplayBoard internals and receipt formatting"
      - "Spot allocation plus vehicle/spot compatibility, and the ticketing/pricing flow"
      - "Writing complete getter/setter boilerplate for every class"
      - "Drawing the largest possible class diagram"
    answer: 1
    explanation: |
      Allocation and pricing are where the evaluated signal lives — strategies,
      compatibility rules, the ticket lifecycle, and the concurrency story hang off
      them. Boards, boilerplate, and diagram bulk consume minutes without
      demonstrating design skill.
    ref: "concepts.md#requirements-clarification"

  - id: design-parking-lot-055
    difficulty: intermediate
    tags: [code-skeleton, interview-technique]
    question: |
      The code skeleton deliberately omits getters/setters, DisplayBoard internals, and
      payment plumbing. What interview principle does this reflect?
    options:
      - "Skeleton code must compile cleanly and pass a build before it is ever shown to the interviewer, or the whole design is discounted"
      - "Omitting large chunks of code is a deliberate tactic to hide the parts you are unsure about from the interviewer's scrutiny"
      - "Write only the code that carries design signal (structure, seams, invariants) and narrate the rest — completeness is not the rubric"
      - "Interview rubrics impose a hard cap of roughly 100 lines of code, so anything beyond that is automatically penalized"
    answer: 2
    explanation: |
      In a live round you're graded on structure and reasoning, not line count. The
      skeleton shows the seams (strategies, the lock, the immutable ticket, the
      compatibility switch) and elides ceremony. Narrating "getters elided" also frees
      time for follow-ups, where the real differentiation happens.
    ref: "concepts.md#code-skeleton"

  - id: design-parking-lot-056
    difficulty: advanced
    tags: [concurrency, data-structures]
    question: |
      activeTickets uses ConcurrentHashMap while spot allocation uses an explicit lock.
      Why isn't ConcurrentHashMap alone enough for allocation too?
    options:
      - "ConcurrentHashMap's lock-striping is measurably slower than a plain synchronized block, so allocation avoids it purely for throughput reasons"
      - "ConcurrentHashMap makes individual operations atomic, but allocation is a compound find-then-occupy across OTHER structures (the floor free-sets), which no single map can make atomic"
      - "ConcurrentHashMap rejects mutable value types like ParkingSpot, so allocation state cannot legally be stored inside one at all"
      - "The explicit allocation lock exists only to serialize log writes, so that audit entries for each parking event are emitted in strict order"
    answer: 1
    explanation: |
      The map protects its own put/remove operations — fine for ticket registration.
      Allocation's critical section spans a query on a floor's free set AND a mutation
      of it (and possibly several floors), which is exactly the compound-action case
      requiring an external lock or per-spot CAS claim. Knowing which tool covers which
      scope is the concurrency signal here.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-parking-lot-057
    difficulty: intermediate
    tags: [extensibility, observer]
    question: |
      "Notify waiting EV drivers when an ELECTRIC spot frees up." Which pattern fits,
      and why is it already almost wired?
    options:
      - "Observer — the floor already publishes occupancy changes to DisplayBoards, so a notifier subscribes to the same release events filtered by spot type"
      - "Factory — instantiate a fresh notification object for every freed spot, so a ParkingSpotFactory becomes the natural home for the alerting logic"
      - "Strategy — hot-swap the assignment strategy the instant an EV starts waiting, so the new policy funnels the next freed spot to that driver"
      - "Singleton — a single global NotificationManager that every waiting driver continuously polls to discover when an electric spot has opened up"
    answer: 0
    explanation: |
      Spot release is an event with multiple interested parties (boards, notifiers,
      future analytics) that the floor shouldn't know individually — the Observer
      shape. Since DisplayBoard already observes occupancy, notification is one more
      subscriber, not a new mechanism. Polling a global manager inverts the flow and
      wastes work.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-parking-lot-058
    difficulty: beginner
    tags: [boundaries, dsa]
    question: |
      During the LLD round you choose a NavigableSet for free spots. How deep should you
      go into the set's internal implementation (red-black tree mechanics)?
    options:
      - "Derive the full red-black tree rotation and recoloring algorithm live on the whiteboard to prove the depth of your data-structure knowledge"
      - "Refuse to name any concrete data structure at all, keeping every choice abstract so the design stays implementation-agnostic for the interviewer"
      - "Hand-implement your own balanced tree from scratch to avoid depending on the standard library's NavigableSet in the final design"
      - "Name the structure and its relevant property (ordered, O(log n) first/remove) and move on — internals belong to the DSA round, not LLD"
    answer: 3
    explanation: |
      LLD evaluates whether you pick appropriate structures and know WHY (ordered
      iteration for "nearest", log-time updates). Re-deriving library internals burns
      design time on another round's rubric; refusing to name a structure reads as
      not knowing one.
    ref: "concepts.md#key-design-decisions-and-patterns"
