topic: "Design an ATM"
domain: lld-and-ood
topic_slug: design-atm
version: 1
questions:
  - id: design-atm-001
    difficulty: beginner
    tags: [state-pattern, design-reasoning]
    question: |
      An ATM must respond to enterPin() completely differently depending on whether a card has
      just been inserted, the customer is already authenticated, or cash is being dispensed.
      Which pattern is the canonical fit for this "same action, phase-dependent behavior"?
    options:
      - "Observer — notify listeners when the ATM changes phase"
      - "Decorator — wrap the ATM to add behavior per phase"
      - "Singleton — ensure only one ATM instance handles the action"
      - "State — the current state object defines how each action behaves"
    answer: 3
    explanation: |
      Behavior that varies by *how far into the session you are* is the State pattern's exact
      problem statement: the ATM (context) delegates each action to its current state object,
      and each concrete state implements only the actions legal in that phase. Observer is
      event fan-out, Decorator adds responsibilities to objects, and Singleton constrains
      instance count — none address phase-dependent action handling.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-atm-002
    difficulty: beginner
    tags: [requirements, interview-method]
    question: |
      In the first five minutes of an ATM LLD interview, which clarifying question most
      directly changes the shape of your class model?
    options:
      - "What color and finish should the ATM's screen bezel and keypad surround be?"
      - "Which cloud region and availability zone hosts the core banking database cluster?"
      - "Which operations are in scope — withdrawal only, or also deposit/transfer/inquiry?"
      - "How many physical ATM units does the bank plan to deploy across the country?"
    answer: 2
    explanation: |
      The set of operations decides whether you need a Transaction hierarchy (Withdrawal /
      Deposit / BalanceInquiry / Transfer) and a factory to build them — a structural
      decision. Fleet size and DB region are HLD/system-design concerns to scope out
      explicitly, and bezel color is irrelevant to the object model.
    ref: "concepts.md#requirements-clarification"

  - id: design-atm-003
    difficulty: beginner
    tags: [money-modeling, correctness]
    question: |
      How should account balances and withdrawal amounts be represented in the ATM model?
    options:
      - "double — currency naturally has a decimal point, so a double models it fine"
      - "int minor units (or a Money value object) — exact integer arithmetic"
      - "float — it saves memory over double and rounds cents off automatically"
      - "String formatted like \"$100.00\" — human-readable and trivial to display anywhere"
    answer: 1
    explanation: |
      Binary floating point cannot represent most decimal fractions exactly, so accumulating
      money in double/float eventually produces off-by-a-cent errors — an instant red flag in
      a financial system. Integer minor units (or BigDecimal / a Money type) keeps arithmetic
      exact. Strings aren't arithmetic types at all.
    ref: "concepts.md#requirements-clarification"

  - id: design-atm-004
    difficulty: intermediate
    tags: [state-pattern, class-responsibility]
    question: |
      In the State-pattern ATM, where should the wrong-PIN attempt counter live?
    options:
      - "On the ATM context, so concrete states stay stateless and shareable"
      - "As a field on the HasCardState object, since PIN entry only happens there"
      - "On the Card object, which already carries the cardholder's stored credentials"
      - "As a static global counter in the State interface shared across every state"
    answer: 0
    explanation: |
      States hold *behavior*; the context holds *session data*. Keeping the attempt counter
      (and current card/account) on the ATM lets each concrete state be stateless, so a single
      shared instance (or an enum constant) suffices. Putting mutable session data on a state
      object breaks sharing and leaks session state across customers. It doesn't belong on the
      Card (the card is inert data), and a static global would be shared across all ATMs.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-atm-005
    difficulty: intermediate
    tags: [noun-verb, method, object-identification]
    question: |
      Applying noun/verb extraction to the ATM requirements, "PIN" appears as a noun. Why is
      modeling PIN as its own class usually the wrong call?
    options:
      - "PINs are too security-sensitive to appear anywhere in code, so no class may ever reference one"
      - "A PIN is a short secret with no behavior or identity — a String/char[] field verified by the bank, not an object"
      - "Java forbids defining classes that wrap numeric secrets such as a four-digit banking PIN"
      - "It must instead be modeled as an enum enumerating every one of the 10,000 possible PINs"
    answer: 1
    explanation: |
      The filter rule: a noun earns a class only if it has state + behavior or a distinct
      responsibility. A PIN is pure transient data with no behavior of its own — it is passed
      to BankService.authenticate and never stored. Wrapping it in a class is ceremony. (An
      enum of all PINs is absurd, and Java has no such prohibition.)
    ref: "concepts.md#nounverb-object-identification"

  - id: design-atm-006
    difficulty: intermediate
    tags: [noun-verb, actors, object-identification]
    question: |
      During noun extraction, "Customer" shows up as a noun. In the baseline ATM design, how is
      the customer best treated?
    options:
      - "As an external actor represented in-memory by the Card and Account they present, not a modeled object"
      - "As a rich Customer class holding all accounts, balances, and transaction history"
      - "As a subclass of Account, since a customer is essentially a kind of account holder"
      - "As a singleton, since only one customer ever uses the physical machine at any moment"
    answer: 0
    explanation: |
      The physical human is an *actor* in the use-case sense, not an in-memory object the ATM
      manipulates. What the ATM actually handles is the Card (credential) and the Account
      (bank-side). A full Customer aggregate belongs to the core banking system, not the ATM's
      single-session model — pulling it in violates the scope boundary.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-atm-007
    difficulty: intermediate
    tags: [transaction-hierarchy, inheritance]
    question: |
      Withdrawal, Deposit, BalanceInquiry, and Transfer share a lifecycle (validate → execute →
      receipt) but differ in the execute body. Which modeling choice best expresses this?
    options:
      - "One Transaction class with a big switch on an operationType enum inside execute()"
      - "A Transaction abstract type with an abstract execute(), subclassed per operation"
      - "Four unrelated classes with no common supertype or shared interface at all"
      - "A single God method on the ATM class that handles all four operations inline"
    answer: 1
    explanation: |
      The operations are genuine is-a variants sharing structure but differing in one step —
      a Transaction hierarchy (Template Method flavor) or Command objects. A switch inside one
      class centralizes but must be edited for every new operation (Open/Closed violation);
      unrelated classes lose the shared contract; a God method on ATM couples everything.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-atm-008
    difficulty: intermediate
    tags: [factory, creational, extensibility]
    question: |
      AuthenticatedState needs a Transaction object for the chosen operation. Why route creation
      through a TransactionFactory rather than calling new WithdrawalTransaction(...) directly?
    options:
      - "Factories are always measurably faster than direct constructor calls at runtime"
      - "Java disallows calling constructors directly from inside a state object's method"
      - "It makes the constructed Transaction objects automatically thread-safe for concurrent use"
      - "It centralizes construction so adding a new operation touches only the factory, not the state class"
    answer: 3
    explanation: |
      A Factory (Creational — intent: construction) isolates the switch over OperationType in
      one place. Adding PinChangeTransaction then means one factory branch, leaving
      AuthenticatedState (which just delegates) untouched — Open/Closed. Factories give no
      inherent speed or thread-safety benefit, and constructors are callable anywhere.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-atm-009
    difficulty: advanced
    tags: [cash-dispensing, strategy, algorithm]
    question: |
      The ATM must decide which notes to dispense for a requested amount. Why wrap this in a
      NoteDispensingStrategy interface instead of hardcoding greedy note selection in CashDispenser?
    options:
      - "It isolates the algorithm behind a seam so a DP/backtracking variant can replace greedy without rewriting CashDispenser"
      - "Greedy note selection is always wrong, so it must be hidden away behind an interface seam"
      - "Interface method dispatch runs measurably faster than direct concrete method calls in the JVM"
      - "It lets two different customers dispense cash from the same machine at the same time"
    answer: 0
    explanation: |
      Strategy (Behavioral — intent: interchangeable algorithm) isolates note selection. Greedy
      is optimal for canonical note sets and minimizes note count, but can strand a remainder
      with odd denominations or low inventory; swapping in a DP strategy is then a config change,
      not a rewrite. Greedy isn't *always* wrong, and interfaces don't add speed or concurrency.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-atm-010
    difficulty: advanced
    tags: [cash-dispensing, edge-case, correctness]
    question: |
      Greedy note selection dispenses the largest note first. On which situation can it fail to
      produce a valid payout even though the amount is a multiple of the smallest note?
    options:
      - "When the limited inventory of a needed denomination runs out, stranding a remainder greedy can't fill"
      - "When the requested withdrawal amount happens to be a prime number of currency units"
      - "When the customer is authenticated with a debit rather than a credit card"
      - "Never — greedy always works as long as the amount divides evenly by the smallest note"
    answer: 0
    explanation: |
      Greedy assumes unlimited notes of each denomination. With a *limited* inventory, taking
      the largest note first can leave a remainder that the remaining (exhausted) notes can't
      compose — e.g., needing a small note that's out of stock. canDispense must respect the
      real inventory, not just arithmetic divisibility. Primality and card type are irrelevant.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-atm-011
    difficulty: intermediate
    tags: [security, single-responsibility, bank-service]
    question: |
      Where should the customer's PIN be verified in the design?
    options:
      - "On the ATM, which caches a salted hash of every issued card's PIN locally for speed"
      - "By the BankService backend — the ATM forwards the PIN and never stores or compares the real one"
      - "In the Card object's equals() method, comparing the entered PIN against a stored field"
      - "In the DispensingState, re-verifying the PIN one last time right before releasing cash"
    answer: 1
    explanation: |
      The ATM must never hold the real PIN — it forwards enterPin to BankService.authenticate,
      which verifies bank-side. This is both a security requirement (PINs don't live on the
      terminal) and Single Responsibility (auth is the bank's job). Storing PIN hashes locally,
      or checking in Card.equals or the dispensing step, all misplace the responsibility.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-atm-012
    difficulty: intermediate
    tags: [state-machine, transitions]
    question: |
      From HasCardState, enterPin() with a wrong PIN can lead to three different outcomes. Which
      set correctly captures them?
    options:
      - "Always eject the card on any PIN entry; always stay put; always begin dispensing cash"
      - "Correct → Idle; wrong → Dispensing; a session timeout → stay in HasCard indefinitely"
      - "Correct → Authenticated; wrong with attempts left → stay in HasCard; wrong on final attempt → retain card and go to Idle"
      - "Correct → Dispensing; wrong → Authenticated; final wrong attempt → return to HasCard"
    answer: 2
    explanation: |
      The three outcomes: a correct PIN advances to Authenticated (and clears attempts); a wrong
      PIN with attempts remaining stays in HasCard with a message; a wrong PIN on the final
      allowed attempt retains (eats) the card and resets to Idle. This branching is exactly what
      a naive if-ladder gets wrong, and why the State pattern earns its keep here.
    ref: "concepts.md#state-machine"

  - id: design-atm-013
    difficulty: intermediate
    tags: [state-pattern, open-closed]
    question: |
      An interviewer asks you to add a MaintenanceState in which all customer actions are
      rejected and only an operator can service the machine. With a proper State design, what is
      the impact on existing state classes?
    options:
      - "Every existing state class must add a new branch to reject actions in maintenance mode"
      - "Add one new State class plus the transitions into/out of it; existing states are untouched"
      - "The ATM's public methods each gain an if (maintenance) guard at the top before delegating"
      - "You must rewrite the entire Transaction hierarchy to be aware of the maintenance phase"
    answer: 1
    explanation: |
      This is the Open/Closed payoff of State: a new phase is a new class implementing the State
      interface, plus wiring for the transitions in and out. Existing state classes and the ATM's
      delegating methods don't change. Adding if-guards or editing every state would be the
      anti-pattern the State design exists to prevent.
    ref: "concepts.md#extensibility"

  - id: design-atm-014
    difficulty: advanced
    tags: [order-of-operations, edge-case, correctness]
    question: |
      For a withdrawal, what is the correct ordering of fund check, cash check, dispensing, and
      debiting?
    options:
      - "Debit account → dispense cash → check funds → check cash"
      - "Guard funds AND cash before dispensing; dispense; then post the debit after cash is committed"
      - "Dispense cash first for speed, then debit and check funds"
      - "Debit first, and if dispensing later fails, ask the customer to return the cash"
    answer: 1
    explanation: |
      You can't un-dispense notes, so both guards (sufficient account funds and the dispenser
      can compose the amount) must pass *before* the Dispensing transition, and the debit is
      posted *after* cash is physically committed. Debiting first risks charging a customer for
      cash a jam never delivered; dispensing before checking risks giving money that isn't there.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-atm-015
    difficulty: intermediate
    tags: [dependency-inversion, solid, bank-service]
    question: |
      The ATM talks to the bank through a BankService interface injected in its constructor.
      Which SOLID principle does this most directly embody, and what does it buy you?
    options:
      - "Liskov Substitution — subtypes can replace the base"
      - "Interface Segregation — clients see only methods they use"
      - "Single Responsibility — a class has one reason to change"
      - "Dependency Inversion — the ATM depends on an abstraction, enabling a mock bank in tests"
    answer: 3
    explanation: |
      Depending on the BankService *abstraction* (not a concrete bank) is Dependency Inversion.
      It keeps the ATM testable (inject a mock/stub bank) and makes "the ATM doesn't own balances"
      literally true in code. ISP is also present in the API split, but the injected-interface
      dependency is the textbook DIP illustration.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-atm-016
    difficulty: intermediate
    tags: [relationships, composition, aggregation]
    question: |
      How should the relationship between ATM and its current State object be modeled, versus
      ATM and its CashDispenser?
    options:
      - "ATM aggregates/references the shared State instance; ATM composes the CashDispenser as a physical part"
      - "Both are composition (filled diamond), owned exclusively for the ATM's whole lifetime"
      - "Both are inheritance — ATM extends State and also extends CashDispenser as base types"
      - "ATM composes the State object as a part, while it merely references the CashDispenser"
    answer: 0
    explanation: |
      The concrete states are shared, stateless flyweights the ATM references (aggregation-like)
      — it doesn't own their lifecycle. The CashDispenser is a physical part with no life outside
      the machine (composition, filled diamond). Reversing them, or making either inheritance,
      misrepresents ownership and identity.
    ref: "concepts.md#class-diagram"

  - id: design-atm-017
    difficulty: beginner
    tags: [enum, denomination, modeling]
    question: |
      Why model Denomination (HUNDRED, FIFTY, TWENTY, TEN) as an enum rather than a class hierarchy?
    options:
      - "Enums are the only Java type the language permits to be used as a key in a Map"
      - "A denomination class hierarchy would dispense notes measurably faster at runtime"
      - "Denominations are a fixed, closed set carrying only a value with no varying behavior — an enum is the honest model"
      - "Enums uniquely allow each denomination to change its face value at runtime on demand"
    answer: 2
    explanation: |
      Denominations are a fixed closed set with data (a note value) and no per-type behavior —
      exactly what enums model. A class hierarchy would add subclasses with no behavioral
      difference (pointless polymorphism). Enums are constants (values don't change at runtime),
      and many types can be Map keys.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-atm-018
    difficulty: advanced
    tags: [command-pattern, audit, extensibility]
    question: |
      The interviewer adds: "We need a full audit log and the ability to reverse the last
      transaction." Which refinement of the transaction model fits best?
    options:
      - "Model each operation as a Command with execute()/undo(), keeping a history list for audit and reversal"
      - "Add a boolean reversed flag to a single Transaction class and branch on it when undoing"
      - "Store every transaction as a JSON string and compute a text diff to reverse the last one"
      - "Make Transaction a Singleton so there is one canonical record the audit log can point at"
    answer: 0
    explanation: |
      Command (Behavioral) reifies each operation as an object with execute()/undo(), which
      naturally yields a history list (audit) and reversal (undo). A boolean flag doesn't undo
      side effects, JSON diffing is not a design, and a Singleton transaction is nonsensical
      (there are many transactions). This is the classic reason to prefer Command over a plain
      hierarchy when reversibility/logging is required.
    ref: "concepts.md#extensibility"

  - id: design-atm-019
    difficulty: intermediate
    tags: [interface-segregation, api-design]
    question: |
      The design exposes separate AtmApi (customer), AdminApi (operator), and BankService (bank)
      interfaces rather than one fat interface. Which principle is this, and why does it matter?
    options:
      - "Liskov Substitution — so an AdminApi subtype can transparently stand in for the button panel"
      - "Open/Closed — so bolting on new operator methods extends the interface without touching old ones"
      - "Dependency Inversion — so the BankService backend is made to depend on the concrete ATM class"
      - "Interface Segregation — the button panel shouldn't see collectDeposits() or retrieveRetainedCards()"
    answer: 3
    explanation: |
      Splitting role-specific interfaces so no client is forced to depend on methods it doesn't
      use is Interface Segregation. The customer-facing panel has no business seeing admin
      operations like collecting deposits or retrieving retained cards. The other principles
      describe substitutability, extension, and dependency direction — not client-specific slicing.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-atm-020
    difficulty: advanced
    tags: [concurrency, bank-service, correctness]
    question: |
      Two ATMs perform a withdrawal against the same joint account at nearly the same moment.
      Where must the correctness of the final balance be enforced?
    options:
      - "On each ATM, using a local synchronized lock on its in-memory Account object instance"
      - "It cannot be made correct; one of the two withdrawals must always be rejected visibly"
      - "On the BankService backend, via an atomic/conditional debit under the bank's own transaction"
      - "In the DispensingState, which acquires a machine-wide monitor to serialize every withdrawal"
    answer: 2
    explanation: |
      The two ATMs are separate processes; a local lock on one's in-memory Account means nothing
      to the other. The authoritative, atomic debit (optimistic locking / conditional update)
      must happen bank-side. The ATM calls debit(account, amount) and trusts the backend for
      consistency — the distributed story belongs to system-design, not the ATM's LLD.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-atm-021
    difficulty: beginner
    tags: [state-machine, insert-card]
    question: |
      In which state is insertCard() a legal, meaningful action?
    options:
      - "AuthenticatedState"
      - "DispensingState"
      - "HasCardState"
      - "IdleState"
    answer: 3
    explanation: |
      Only IdleState should accept insertCard — in every other state a card is already inserted,
      so insertCard is rejected (IllegalState). The State pattern enforces this structurally:
      each state implements only what's legal for its phase, so the "card already inserted"
      guard lives in one obvious place rather than scattered conditionals.
    ref: "concepts.md#state-machine"

  - id: design-atm-022
    difficulty: intermediate
    tags: [state-machine, non-cash-operations]
    question: |
      After a balance inquiry completes, why does the machine stay in AuthenticatedState rather
      than returning to Idle?
    options:
      - "Because a balance inquiry is an illegal action in that phase and must be re-issued to succeed"
      - "Because IdleState is reachable only from DispensingState after cash has physically committed"
      - "So the authenticated customer can perform another operation without re-inserting the card and PIN"
      - "To force the card reader to retain the card as a security measure after every balance inquiry"
    answer: 2
    explanation: |
      Non-cash operations (balance inquiry, transfer, deposit) complete in place and leave the
      session authenticated so the customer can do another operation in the same session. Only a
      cash withdrawal transitions to Dispensing, and only cancel/eject or completion returns to
      Idle. Forcing re-authentication after each inquiry would be poor UX and isn't required.
    ref: "concepts.md#state-machine"

  - id: design-atm-023
    difficulty: intermediate
    tags: [state-pattern, transitions, design-reasoning]
    question: |
      In the state-driven design, who triggers the transition from AuthenticatedState to
      DispensingState for a valid withdrawal?
    options:
      - "The BankService backend, which flips the ATM's state as a side effect of posting the debit"
      - "The Card object, which detects sufficient funds from its stored balance and advances the machine"
      - "A global TransitionManager scheduler that centrally owns and applies every state change"
      - "The AuthenticatedState method itself, by calling atm.setState(dispensingState) once its guards pass"
    answer: 3
    explanation: |
      In the standard GoF state-driven idiom used here, the current state performs the transition
      by calling the context's setState once its guards (funds ok, cash ok) pass. The bank only
      debits; the Card is inert data; and a global scheduler would centralize what the pattern
      deliberately distributes into the state classes.
    ref: "concepts.md#code-skeleton"

  - id: design-atm-024
    difficulty: advanced
    tags: [extensibility, cardless, open-closed]
    question: |
      To add cardless (OTP/QR/UPI) withdrawal without breaking the card flow, what is the cleanest
      seam to introduce?
    options:
      - "Introduce an AuthMethod abstraction (CardAuth, OtpAuth, QrAuth) that early states depend on instead of a physical card"
      - "Add an if (cardless) branch inside every state method to fork between the card and OTP paths"
      - "Duplicate the entire ATM class into a parallel CardlessATM with its own copied state machine"
      - "Store the generated OTP inside the existing Card object and reuse the card-based auth flow"
    answer: 0
    explanation: |
      Abstracting authentication (AuthMethod with CardAuth/OtpAuth/QrAuth) lets the early states
      depend on the auth abstraction rather than a physical card, so adding a credential type is
      Open/Closed. Branching in every state is the shotgun-surgery smell; duplicating the ATM is
      copy-paste; stuffing an OTP into Card conflates two credential types.
    ref: "concepts.md#extensibility"

  - id: design-atm-025
    difficulty: intermediate
    tags: [edge-case, card-retention, policy]
    question: |
      On the final wrong-PIN attempt, the baseline design retains (eats) the card. Which sequence
      does HasCardState perform?
    options:
      - "Eject the card and stay in HasCardState, resetting the attempt counter for another try"
      - "Retain the card, reset the session, and transition to IdleState"
      - "Dispense a fixed penalty fee from inventory and keep the session authenticated"
      - "Transfer the retained card's ownership record to the operator's maintenance account"
    answer: 1
    explanation: |
      When attempts hit the limit, the card reader retains the card, the session is reset
      (card/account/attempts cleared), and the machine returns to Idle ready for the next
      customer. Ejecting-and-retrying would defeat the lockout; the other options are nonsensical
      for an authentication failure.
    ref: "concepts.md#code-skeleton"

  - id: design-atm-026
    difficulty: intermediate
    tags: [design-smell, anti-pattern, state-pattern]
    question: |
      What is the tell-tale sign that the State pattern is actually working in your ATM code?
    options:
      - "The ATM's public methods contain zero if/switch on machine status — they purely delegate to the current state"
      - "The ATM class carries many private boolean flags like cardInserted and pinOk that methods branch on"
      - "Every concrete state class keeps its own cached copy of the current account balance for speed"
      - "The whole Transaction hierarchy has been merged back into the ATM class as inline methods"
    answer: 0
    explanation: |
      The payoff of State is that the context stops branching on status: ATM.enterPin just calls
      currentState.enterPin(this, pin). Boolean status flags on the context are the exact smell
      the pattern removes; states holding balances breaks statelessness; merging Transaction into
      ATM is unrelated coupling.
    ref: "concepts.md#code-skeleton"

  - id: design-atm-027
    difficulty: advanced
    tags: [edge-case, hardware-jam, correctness]
    question: |
      The dispenser counts out the notes but a mechanical jam prevents release. Given the design's
      ordering, what state is the customer's account in?
    options:
      - "Already debited before dispensing, so the customer has lost the money and must file a dispute"
      - "Debited twice, once for each note tray the greedy algorithm drew notes from during the jam"
      - "Automatically credited with the jammed amount by the bank the instant the jam sensor trips"
      - "Not yet debited — because the debit is posted only after cash is physically committed; the jam path flags maintenance without debiting"
    answer: 3
    explanation: |
      Because the debit follows physical dispensing, a jam before release means no debit is
      posted; the jam path flags maintenance and reverses any partial commit. This is precisely
      why debit-after-dispense is the correct ordering — a debit-then-jam would wrongly charge
      the customer for cash they never received.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-atm-028
    difficulty: beginner
    tags: [scope, boundary, system-design]
    question: |
      The interviewer asks, "Now make this work across 50,000 ATMs with real-time fraud scoring."
      What is the right LLD-interview move?
    options:
      - "Redesign the single ATM class into a distributed cluster of communicating microservices on the spot"
      - "Acknowledge it's an HLD/system-design concern (event streaming, fraud pipelines), outline it in a sentence, and keep the ATM design single-machine OO"
      - "Add a FraudService dependency field to every concrete state class and score inside each method"
      - "Refuse to answer the follow-up entirely on the grounds that it falls outside the stated scope"
    answer: 1
    explanation: |
      Scaling to a fleet and fraud pipelines is distributed-systems territory — recognize the
      domain shift, sketch it in one sentence, and point to system-design, keeping the LLD focused
      on clean single-machine OO. Turning the class into microservices confuses LLD with HLD;
      injecting a fraud field everywhere is scope creep; refusing outright wastes the signal.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-atm-029
    difficulty: intermediate
    tags: [testing, state-pattern, mocking]
    question: |
      Why are the concrete state classes especially easy to unit-test in this design?
    options:
      - "Because they are declared final and therefore cannot be subclassed or overridden in tests"
      - "Because they hold the account balance internally and so require no injected collaborators at all"
      - "Because they are compiled into the production build only and skipped from the test classpath"
      - "Because they are stateless and take the ATM as a parameter, so each method can be tested against a mock ATM and mock BankService"
    answer: 3
    explanation: |
      Stateless states that receive the context as a parameter have no hidden dependencies — you
      construct a mock ATM (with a mock BankService and CashDispenser) and assert each state
      method's transitions and calls. Statelessness (not finality) is what makes them trivially
      testable; states deliberately do NOT hold the balance.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-atm-030
    difficulty: advanced
    tags: [extensibility, multi-currency, open-closed]
    question: |
      To support multi-currency dispensing, which change keeps the note-selection algorithm untouched?
    options:
      - "Rewrite GreedyDispensingStrategy to hardcode each supported currency's note set inside a switch"
      - "Give Denomination a Currency and let CashDispenser hold per-currency inventories; the strategy still just reads (value, inventory)"
      - "Add a currency parameter to every State method and thread it through the whole state machine"
      - "Store all amounts as doubles so per-currency exchange-rate multipliers can be applied inline"
    answer: 1
    explanation: |
      Because nothing hardcodes note values outside the Denomination enum, adding a Currency to
      Denomination and keeping per-currency inventories lets the same strategy run unchanged — it
      just operates over (value, inventory) pairs. Hardcoding currencies in the strategy defeats
      the seam; threading currency through states is unnecessary; and doubles reintroduce the
      float-money bug.
    ref: "concepts.md#extensibility"

  - id: design-atm-031
    difficulty: intermediate
    tags: [account, ownership, boundary]
    question: |
      Should the Account object stored/referenced by the ATM own the authoritative balance and
      mutate it locally on withdrawal?
    options:
      - "Yes — the ATM becomes the source of truth for the balance while the card remains inserted"
      - "Yes, but only for savings accounts, where the ATM caches and mutates the running balance"
      - "No — the Card's magnetic stripe holds the authoritative balance and the ATM updates it there"
      - "No — balance is authoritative on the bank; the ATM references account identity and calls BankService.debit/getBalance"
    answer: 3
    explanation: |
      The ATM does not own money; the bank does. The Account the ATM holds is essentially an
      identity/type reference, and all balance reads and mutations go through BankService so the
      backend stays authoritative and consistent across machines. Local balance mutation would
      diverge from the bank and break with concurrent withdrawals. The Card certainly doesn't
      hold a balance.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-atm-032
    difficulty: advanced
    tags: [state-vs-enum, trade-off, design-reasoning]
    question: |
      An interviewer asks, "Why not just use an enum of states and a switch statement instead of
      the State pattern?" What is the most accurate answer?
    options:
      - "A switch on state is never acceptable in production code and always signals a junior engineer"
      - "For very few states/actions a switch is fine; State wins as the action×state matrix grows — each state's rules live in one class and new states don't touch existing code"
      - "The State pattern dispatches faster at runtime than an equivalent switch on an enum constant"
      - "Enums are structurally incapable of representing distinct states in Java, so a switch is impossible"
    answer: 1
    explanation: |
      The honest answer names the crossover: with 2 states a switch is fine, but as actions ×
      states grow (4 × 4 here), the pattern localizes each state's rules, makes illegal-action
      handling structural, and keeps new states from editing existing code. It's a
      maintainability trade-off, not a performance one, and enums can absolutely model states
      (indeed enum-based State is a known idiom).
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-atm-033
    difficulty: intermediate
    tags: [state-machine, dispensing, input-rejection]
    question: |
      While in DispensingState, the customer presses buttons trying to start another operation.
      What should happen?
    options:
      - "The new operation is buffered in a queue and executed automatically once dispensing finishes"
      - "The machine transitions back to AuthenticatedState mid-dispense to handle the new request"
      - "The actions are rejected — DispensingState accepts no new user input until it completes and returns to Idle"
      - "The card is retained by the reader as a penalty for interacting during the dispense phase"
    answer: 2
    explanation: |
      Dispensing is a committed, input-free phase: it releases cash, posts the debit, prints, and
      ejects, rejecting insertCard/enterPin/selectOperation meanwhile. This invariant is enforced
      structurally by the state's method bodies. Queuing or bouncing back to Authenticated would
      risk interleaving a half-done withdrawal; retaining the card is not the right response to a
      button press.
    ref: "concepts.md#state-machine"

  - id: design-atm-034
    difficulty: beginner
    tags: [use-cases, actors, requirements]
    question: |
      In the ATM's use-case model, which of the following is best described as an external actor
      rather than an internal class the ATM manipulates?
    options:
      - "CashDispenser"
      - "DispensingState"
      - "The Bank (BankService)"
      - "Transaction"
    answer: 2
    explanation: |
      The Bank is an external actor the ATM is a *client* of — it authenticates and posts
      debits/credits, and the ATM depends on its interface. CashDispenser, the states, and
      Transaction are internal objects the ATM owns or manipulates. Identifying the bank as an
      external actor is what keeps core-banking logic out of the ATM's scope.
    ref: "concepts.md#use-cases-and-actors"

  - id: design-atm-035
    difficulty: advanced
    tags: [chain-of-responsibility, alternative, design-reasoning]
    question: |
      Some designs model the pre-withdrawal checks (card valid → PIN ok → funds ok → cash
      available) as a Chain of Responsibility. What is the intent of doing so?
    options:
      - "To let each validation check run on its own separate thread and finish the checks faster"
      - "To guarantee that exactly one handler in the chain ever runs for any given request"
      - "To replace the State pattern entirely with a single linear chain of validation handlers"
      - "To let each handler either process/veto or pass the request down a configurable chain of checks, decoupling the checks from one another"
    answer: 3
    explanation: |
      Chain of Responsibility (Behavioral) lets a request pass along a chain where each handler
      may act or forward, so validation steps become independently orderable/insertable without a
      monolithic if-block. It isn't about threading or running only one handler, and it complements
      rather than replaces State (which governs phase behavior).
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-atm-036
    difficulty: intermediate
    tags: [session, timeout, edge-case]
    question: |
      A customer authenticates, then walks away without selecting an operation. What mechanism
      handles this cleanly?
    options:
      - "A session timer that fires cancel() after N seconds, ejecting the card and resetting to Idle"
      - "Nothing — the card simply stays inserted and available for the next person who walks up"
      - "The BankService automatically logs the customer out and dispenses their full account balance"
      - "DispensingState starts on its own after a fixed delay and pays out a default withdrawal amount"
    answer: 0
    explanation: |
      A timeout should trigger cancel() to eject the card and reset the session (retaining it if
      not taken), protecting the abandoned session. Leaving the card available is a security hole,
      the bank doesn't auto-dispense a balance, and dispensing must never start without an explicit
      operation selection.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-atm-037
    difficulty: intermediate
    tags: [devices, hardware-boundary, abstraction]
    question: |
      Why model Screen, Keypad, CardReader, and Printer as thin interfaces/classes rather than
      inlining their logic into the ATM and states?
    options:
      - "To inflate the class count so the UML diagram looks more thorough and impressive to the interviewer during review"
      - "To keep a mockable hardware boundary so states/tests don't depend on real devices, and device swaps don't ripple into logic"
      - "Because the Java language specification mandates a dedicated class for every distinct attached peripheral device"
      - "So that each device object can cache and own its own copy of the customer's account balance for faster local reads"
    answer: 1
    explanation: |
      Thin device abstractions form a clean hardware boundary: the states drive them through
      interfaces, so tests use mocks and swapping a physical device doesn't touch business logic.
      It's about decoupling and testability, not class count or a language rule, and devices
      certainly don't own balances.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-atm-038
    difficulty: advanced
    tags: [power-failure, memento, edge-case]
    question: |
      To survive a power failure mid-transaction, the notes suggest persisting a small journal
      (state, account, pending txn). On reboot, what should the ATM do with it?
    options:
      - "Immediately re-dispense the pending amount on reboot before contacting the bank, so the customer is never left short of cash"
      - "Delete the journal on startup and assume nothing happened, treating every interrupted transaction as a clean no-op"
      - "Reconcile with the bank — determine whether the debit posted — then refund/retry or reset accordingly"
      - "Permanently retain any card still in the reader and forward it to the operator as evidence of the interrupted session"
    answer: 2
    explanation: |
      The journal lets the ATM reconcile on boot: query the bank to learn whether the debit was
      posted, then refund or retry consistently. Blindly re-dispensing risks double payout; blindly
      discarding risks a debit with no cash; permanent card retention is unrelated. (In an
      interview: mention this, don't build it.)
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-atm-039
    difficulty: beginner
    tags: [transaction-hierarchy, polymorphism]
    question: |
      What single method most naturally varies across WithdrawalTransaction, DepositTransaction,
      BalanceInquiryTransaction, and TransferTransaction?
    options:
      - "getId() — each subtype must generate its transaction identifier with a different ID scheme"
      - "toString() — each subtype needs a distinct human-readable string built from its own fields"
      - "hashCode() — each subtype has to hash over a different set of fields to stay collision-free"
      - "execute(ATM ctx) — each subtype implements its own operation body"
    answer: 3
    explanation: |
      The shared lifecycle lives in the abstract Transaction, but the operation body differs per
      type — so execute(ctx) is the polymorphic hook each subclass overrides (withdrawal dispenses
      + debits, inquiry just reads, etc.). Id generation, string form, and hashing are generic and
      belong to the base class.
    ref: "concepts.md#code-skeleton"

  - id: design-atm-040
    difficulty: intermediate
    tags: [insufficient-funds, state-machine, ux]
    question: |
      A withdrawal request exceeds the account balance. What should the design do?
    options:
      - "Dispense as much as the balance covers and silently debit the shortfall as an automatic overdraft advance"
      - "Retain the card on suspicion of fraud and reset the machine to Idle, treating overdraw attempts as an attack"
      - "Transition into DispensingState and let the dispense fail there, then bounce the customer back to Idle"
      - "Reject before dispensing and stay in AuthenticatedState so the customer can try a smaller amount"
    answer: 3
    explanation: |
      Insufficient funds is caught by the funds guard *before* any dispensing; the machine stays
      authenticated so the customer can retry a smaller amount without re-inserting the card.
      Auto-overdraft is a policy the bank owns (not a default), card retention is for auth failures,
      and you should never enter Dispensing when a guard already failed.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-atm-041
    difficulty: advanced
    tags: [single-responsibility, cohesion, design-reasoning]
    question: |
      A candidate puts note-selection math, bank authentication, and receipt formatting all inside
      the ATM class. Which principle is most violated and what's the fix?
    options:
      - "Liskov Substitution — split ATM into WithdrawalAtm and DepositAtm subclasses that override the bundled behavior"
      - "Open/Closed — mark the ATM class final so the three bundled concerns can never be extended or overridden"
      - "Single Responsibility — extract CashDispenser (note math), BankService (auth), and Printer/Receipt (formatting) so each has one reason to change"
      - "Interface Segregation — merge the three concerns behind one wide AtmOperations interface clients implement"
    answer: 2
    explanation: |
      Bundling unrelated concerns into one class violates Single Responsibility: note math,
      authentication, and receipt formatting each change for different reasons and belong in
      CashDispenser, BankService, and Printer/Receipt respectively. Subclassing, finalizing, or
      merging interfaces doesn't address the cohesion problem — extraction does.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-atm-042
    difficulty: intermediate
    tags: [cancel, state-machine, refund]
    question: |
      In which states is cancel() a clean, safe operation, and what does it do?
    options:
      - "In HasCard and Authenticated it ejects the card and resets; in Idle it's a no-op; in Dispensing it's rejected (too late)"
      - "Only in DispensingState, where it reverses the in-progress dispense and refunds the notes already counted out"
      - "In every state uniformly, where it always retains the customer's card and forces a full session reset to Idle"
      - "Only in IdleState, where pressing cancel powers the machine down and hands control to the maintenance operator"
    answer: 0
    explanation: |
      cancel is a safe eject-and-reset while the session hasn't committed cash (HasCard,
      Authenticated), a no-op in Idle (nothing to cancel), and rejected in Dispensing because the
      withdrawal is already committed. Reversing a dispense or blanket card retention on cancel
      would be wrong.
    ref: "concepts.md#state-machine"

  - id: design-atm-043
    difficulty: advanced
    tags: [cash-inventory, concurrency, locking]
    question: |
      The ATM's own cash inventory is read/written by the active withdrawal and by an operator
      replenishing cash. What is a proportionate concurrency approach at ATM throughput?
    options:
      - "Guard CashDispenser mutations with a coarse lock/synchronized — contention is negligible at ATM throughput"
      - "Lock-free compare-and-swap on every individual per-denomination note count to squeeze out maximum dispense parallelism"
      - "No synchronization at all, on the assumption that exactly one customer ever touches the machine at any moment"
      - "A distributed lock coordinated through the bank backend before every local inventory read or write"
    answer: 0
    explanation: |
      A single physical panel makes customer actions serial, but replenishment can still race the
      dispenser, so a coarse lock around inventory mutation is correct and cheap — fine-grained CAS
      is over-engineering at a few transactions per minute. Assuming zero concurrency ignores the
      operator seam; a distributed lock is absurd for a machine-local resource.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-atm-044
    difficulty: intermediate
    tags: [factory, extensibility, open-closed]
    question: |
      Adding a new PinChangeTransaction operation, which components must change if you used a
      TransactionFactory and delegating AuthenticatedState?
    options:
      - "Every concrete state class plus the ATM's public API, each gaining a branch for the new PIN-change operation"
      - "The BankService interface and all of its implementations, since a PIN change is fundamentally a new bank call"
      - "Only the factory (one branch) and the new Transaction subclass; AuthenticatedState is untouched"
      - "The Denomination enum and CashDispenser, which must learn about the new non-cash PIN-change operation"
    answer: 2
    explanation: |
      Because AuthenticatedState delegates creation to the factory and just calls execute, adding
      an operation means one new Transaction subclass plus one factory branch — existing states and
      the ATM API stay closed to modification (Open/Closed). The bank interface, denominations, and
      dispenser are unrelated to a PIN change.
    ref: "concepts.md#extensibility"

  - id: design-atm-045
    difficulty: beginner
    tags: [state-machine, entry, exit]
    question: |
      What is the correct entry state of the ATM and the state it returns to after every completed
      or cancelled session?
    options:
      - "Entry AuthenticatedState with a card assumed present; every completed session returns to HasCardState"
      - "Entry IdleState; returns to IdleState"
      - "Entry DispensingState paying a default amount; each session then returns to AuthenticatedState"
      - "Entry HasCardState awaiting a PIN; every completed or cancelled session returns to DispensingState"
    answer: 1
    explanation: |
      The machine starts in Idle (no card) and every terminal path — completion, cancel, timeout,
      lockout — resets the session and returns to Idle, ready for the next customer. The other
      pairings would leave stale session state or start mid-flow, both invariant violations.
    ref: "concepts.md#state-machine"

  - id: design-atm-046
    difficulty: advanced
    tags: [dispensing, guard, canDispense]
    question: |
      Why is a separate canDispense(amount) guard important before transitioning to
      DispensingState, rather than just calling dispense() and catching a failure?
    options:
      - "canDispense executes measurably faster than dispense(), so calling it first shortens the customer's overall wait"
      - "dispense() is declared to never throw exceptions, so failures cannot be caught and must be predicted in advance"
      - "canDispense automatically tops up the note inventory as a side effect so the following dispense() always succeeds"
      - "It lets the machine reject the withdrawal cleanly (stay authenticated, no debit) before committing, since dispense() has physical/irreversible effects"
    answer: 3
    explanation: |
      canDispense is a pure check that lets you veto the withdrawal *before* the committed
      Dispensing phase and before any debit, avoiding a half-committed transaction. Relying on
      dispense() to fail mid-way risks partial physical effects. The check has no refill side
      effect, and its value is correctness/ordering, not raw speed.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-atm-047
    difficulty: intermediate
    tags: [noun-verb, filtering, method]
    question: |
      Using the noun-earns-a-class filter, which candidate noun from the ATM requirements is
      correctly kept as a first-class class (has state + behavior/responsibility)?
    options:
      - "Balance — the numeric amount in an account, which needs its own class to guard against overdrafts"
      - "PIN — the four-digit secret, deserving a class that owns its own validation and lockout counting logic"
      - "CashDispenser — owns note inventory and the dispensing algorithm"
      - "Amount — the number the customer types, warranting a class to hold its currency and formatting rules"
    answer: 2
    explanation: |
      CashDispenser has both state (per-denomination inventory) and behavior (canDispense/dispense
      via a strategy) plus a clear responsibility — it earns a class. Balance and Amount are plain
      numeric attributes, and PIN is transient secret data forwarded to the bank; none carry
      independent behavior warranting a class.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-atm-048
    difficulty: advanced
    tags: [pattern-classification, gof, design-reasoning]
    question: |
      Classified by GoF intent, which grouping of the ATM's patterns is correct?
    options:
      - "State = Behavioral, Factory Method = Creational, Strategy = Behavioral"
      - "State = Creational, Factory Method = Behavioral, Strategy = Structural, Command = Creational"
      - "State = Structural, Strategy = Creational, Command = Structural, Factory Method = Behavioral"
      - "All four patterns fall under the Structural category because each one assembles collaborating objects"
    answer: 0
    explanation: |
      State, Strategy, and Command are Behavioral (they concern algorithms and the assignment of
      responsibility/behavior), while Factory Method is Creational (it concerns object
      construction). Getting these categories right — Creational = construction, Structural =
      assembly, Behavioral = algorithm/responsibility — is exactly the taxonomy the dp-* topics own.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-atm-049
    difficulty: intermediate
    tags: [singleton, anti-pattern, design-reasoning]
    question: |
      A candidate argues "there is only one ATM, so ATM should be a Singleton." Why is this
      usually a poor decision?
    options:
      - "Singletons are illegal in Java and the compiler rejects any class that hides its constructor this way"
      - "A Singleton ATM would cause the underlying state machine to initialize and run its transitions twice on startup"
      - "Operators run fleets of many ATMs and Singletons poison testability — cardinality is the caller's concern, so instantiate normally"
      - "Making the ATM a Singleton would force the injected BankService dependency to become a global Singleton as well"
    answer: 2
    explanation: |
      "One machine" is a deployment fact, not a reason to hardwire a single global instance:
      operators manage many ATMs, and Singletons introduce global state that wrecks
      testability/isolation. Let the caller decide cardinality and instantiate normally. Singletons
      are legal Java, don't duplicate state machines, and don't dictate the bank's lifecycle.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-atm-050
    difficulty: intermediate
    tags: [dispensing-strategy, testing, property-test]
    question: |
      Which property is the strongest correctness invariant to assert when testing a
      NoteDispensingStrategy?
    options:
      - "The strategy always returns the fewest possible notes for any denomination set"
      - "The dispensed notes sum exactly to the requested amount and no note count exceeds the available inventory"
      - "The strategy never throws an exception under any input, even when the amount cannot be composed from stock"
      - "The largest available denomination is always used at least once in every single successful payout the strategy returns"
    answer: 1
    explanation: |
      The load-bearing invariants are conservation (sum of dispensed notes equals the requested
      amount) and feasibility (no denomination is dispensed beyond its inventory). Minimal-note
      optimality holds only for canonical sets (not all strategies), throwing InsufficientCash is a
      *valid* outcome when composition is impossible, and forcing the largest note is simply false.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-atm-051
    difficulty: advanced
    tags: [deposit, extensibility, transaction-hierarchy]
    question: |
      Adding cheque deposit (credited on a clearing delay, unlike instant cash deposit) fits best as:
    options:
      - "A boolean isCheque flag inside DepositTransaction, with execute() branching between the instant and delayed credit paths"
      - "A new ChequeState inserted into the main state machine that the session enters whenever a cheque is being deposited"
      - "A new ChequeDepositTransaction subtype plus a factory branch, posting a hold via BankService.credit with a clearing delay"
      - "A change to the Denomination enum so it can represent cheques alongside the physical cash note values"
    answer: 2
    explanation: |
      A distinct settlement behavior is a genuine new transaction variant — a ChequeDepositTransaction
      subclass wired through the factory keeps existing code closed. A boolean-flag branch grows the
      class's conditionals; cheque handling isn't a machine *phase* (so no new state); and it has
      nothing to do with note denominations.
    ref: "concepts.md#extensibility"

  - id: design-atm-052
    difficulty: intermediate
    tags: [use-cases, primary-flow, requirements]
    question: |
      Which sequence best represents the primary success scenario (withdraw cash) that drives the
      ATM design?
    options:
      - "insert card → authenticate PIN → select withdrawal → check funds → dispense notes → post debit → print → eject"
      - "select operation → insert card → dispense → enter PIN → eject"
      - "enter PIN → insert card → dispense → debit → authenticate"
      - "dispense → insert card → authenticate → select → eject"
    answer: 0
    explanation: |
      The withdrawal happy path is the spine every alternate flow branches off: insert card,
      authenticate the PIN with the bank, select the withdrawal, guard funds/cash, dispense, then
      debit, print, and eject. The other orderings scramble authentication and dispensing in ways
      that violate the state machine and the debit-after-dispense invariant.
    ref: "concepts.md#use-cases-and-actors"

  - id: design-atm-053
    difficulty: advanced
    tags: [state-pattern, transition-ownership, trade-off]
    question: |
      Two idioms exist for triggering State transitions: the state calls context.setState(next),
      or the context inspects a return value and decides. What's the main caution with the
      state-driven idiom used here?
    options:
      - "It makes the state classes impossible to unit-test, since transitions can only be exercised through a live full ATM"
      - "It requires the ATM context to be implemented as a Singleton so that setState always mutates the one true instance"
      - "States know their successors, which is fine — but they must NOT hold mutable session data, or sharing the state instances breaks"
      - "It forces every setState transition to run on a dedicated background thread, adding hidden concurrency to the flow"
    answer: 2
    explanation: |
      State-driven transitions keep the transition table readable straight from the state classes,
      but the design only stays sound if states remain stateless (session data lives on the ATM), so
      the shared/singleton state instances don't leak one customer's data into another's session.
      It's perfectly testable, needs no Singleton, and doesn't imply threading.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-atm-054
    difficulty: beginner
    tags: [bank-service, interface, seam]
    question: |
      Which set of operations most appropriately belongs on the BankService interface?
    options:
      - "authenticate, getBalance, debit, credit"
      - "dispenseNotes, printReceipt, ejectCard"
      - "setState, incrementPinAttempts, resetSession"
      - "loadCash, collectDeposits, retrieveRetainedCards"
    answer: 0
    explanation: |
      BankService is the seam to the backend, so it owns authentication and account money
      operations: authenticate, getBalance, debit, credit. Dispensing/printing/ejecting are device
      concerns; setState/attempts/reset are ATM context internals; and loadCash/collectDeposits are
      the AdminApi. Keeping these on separate interfaces is Interface Segregation in action.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-atm-055
    difficulty: intermediate
    tags: [error-handling, api-design, consistency]
    question: |
      How should the ATM surface failures like insufficient funds, insufficient cash, and card
      retention?
    options:
      - "Return null from every failing operation and leave each caller to guess from context whether it was insufficient funds, no cash, or a retained card"
      - "Use consistent domain results/exceptions (InsufficientFundsException, InsufficientCashException, CardRetainedException) — pick one style and stay consistent"
      - "Return magic int codes like -1 for insufficient funds, -2 for insufficient cash, and -3 for a retained card, explained only in a code comment"
      - "Print the failure reason to the operator console log and continue the customer's session silently as though nothing had gone wrong"
    answer: 1
    explanation: |
      Meaningful failures deserve explicit, self-describing domain results or exceptions, chosen
      consistently (all exceptions or all Result objects). null and magic ints push interpretation
      onto callers and invite bugs; silent console prints lose the error entirely. Consistency is
      the key signal of a mature API.
    ref: "concepts.md#api-and-method-signatures"
