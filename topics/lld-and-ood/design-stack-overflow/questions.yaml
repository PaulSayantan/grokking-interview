topic: "Design a Q&A Site (Stack Overflow)"
domain: lld-and-ood
topic_slug: design-stack-overflow
version: 1
questions:
  - id: design-stack-overflow-001
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      In the first five minutes of "Design a Q&A site like Stack Overflow", which
      observation most directly shapes the class hierarchy you will draw?
    options:
      - "Questions and answers are both votable and commentable, suggesting a shared Post base type"
      - "The site must render Markdown in the browser"
      - "The database should be sharded by user id"
      - "Comments should support emoji reactions"
    answer: 0
    explanation: |
      Spotting that Question and Answer share voting, commenting, and scoring behavior is
      the pivotal modeling insight — it motivates a shared Post abstraction so that logic
      is written once. Markdown rendering, sharding, and emoji are either out of scope or
      HLD/UI concerns that do not change the core class diagram.
    ref: "concepts.md#requirements-clarification"

  - id: design-stack-overflow-002
    difficulty: beginner
    tags: [requirements, hld-boundary]
    question: |
      The interviewer asks, "How would this handle Stack Overflow's real production
      traffic?" during an LLD round. What is the strongest response?
    options:
      - "Redraw the class diagram around Kafka topics and read replicas"
      - "Acknowledge it as a distributed-systems/HLD concern (replicas, search index, caching), state it is out of LLD scope, and keep the single-process OO design clean"
      - "Add a LoadBalancer and CacheCluster class to the diagram"
      - "Replace every collection with a lock-free concurrent structure first"
    answer: 1
    explanation: |
      An LLD round evaluates clean, extensible single-machine OO design. Naming the
      scale-out concern and deferring it to the system-design domain shows judgment;
      injecting infrastructure into the class model muddies the domain and wastes the
      clock. Lock-free rewrites are premature for this scope.
    ref: "concepts.md#requirements-clarification"

  - id: design-stack-overflow-003
    difficulty: beginner
    tags: [scoping, non-functional]
    question: |
      Which item is most appropriate to explicitly declare OUT of scope for a 45-minute
      LLD design of a Q&A site?
    options:
      - "Whether a user can vote on their own post"
      - "The reputation delta for an accepted answer"
      - "Full-text search ranking and the OAuth login flow"
      - "Whether Question and Answer share a base type"
    answer: 2
    explanation: |
      Search ranking internals and authentication flows are infrastructure/UI concerns
      that do not exercise the domain modeling the round is testing. Self-vote rules,
      reputation deltas, and the Post abstraction are core LLD decisions you must address.
    ref: "concepts.md#requirements-clarification"

  - id: design-stack-overflow-004
    difficulty: intermediate
    tags: [actors, use-cases]
    question: |
      Real Stack Overflow gates privileges (vote up at 15 rep, close at 3000 rep) by
      reputation rather than a fixed role table. How should this inform your model?
    options:
      - "Create a subclass per privilege level: NewUser, Voter, Closer, Moderator"
      - "Hard-code privilege checks as constants inside each UI controller"
      - "Store a boolean flag per privilege on every User row"
      - "Derive privileges from a check against user.reputation, so new gates are just thresholds"
    answer: 3
    explanation: |
      Privileges as reputation thresholds keep User a single type and make new gates a
      matter of adding a threshold check — clean and extensible. A subclass-per-privilege
      hierarchy explodes combinatorially and forces object re-creation as users level up;
      boolean flags per privilege duplicate what reputation already encodes.
    ref: "concepts.md#use-cases-and-actors"

  - id: design-stack-overflow-005
    difficulty: beginner
    tags: [actors]
    question: |
      How should a Moderator best be modeled in this design?
    options:
      - "As a subclass Moderator extends User with overridden methods"
      - "As a separate top-level class unrelated to User"
      - "As a User with an elevated role/privilege rather than a distinct subclass"
      - "As an enum value replacing the User class"
    answer: 2
    explanation: |
      A moderator is still a user who also happens to hold elevated privileges. Modeling
      the role as a privilege/attribute avoids a rigid hierarchy and the awkwardness of a
      user being promoted (which under subclassing would require creating a new object).
    ref: "concepts.md#use-cases-and-actors"

  - id: design-stack-overflow-006
    difficulty: intermediate
    tags: [noun-verb, method]
    question: |
      Applying noun/verb extraction to "A user asks a question with tags; others post
      answers; the asker accepts one answer," which nouns should become classes rather
      than attributes or enums?
    options:
      - "title, body, and tags"
      - "upvote and downvote"
      - "asker and answerer"
      - "User, Question, Answer, and Tag"
    answer: 3
    explanation: |
      User, Question, Answer, and Tag are entities with identity and independent behavior.
      title/body are attributes of a post; upvote/downvote are two values of a VoteType
      enum; asker/answerer are roles (references), not types. Filtering the noun list is
      exactly the technique the round tests.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-stack-overflow-007
    difficulty: intermediate
    tags: [noun-verb, modeling, vote]
    question: |
      Why should "upvote" and "downvote" be a single VoteType enum on one Vote class
      rather than two separate classes UpVote and DownVote?
    options:
      - "Enums serialize faster than classes in Java"
      - "Java forbids more than one class per file"
      - "Downvotes are stored in a different database table"
      - "They are two values of one concept; separate classes would duplicate every voting rule and add no distinct behavior"
    answer: 3
    explanation: |
      Upvote and downvote differ only in a direction value, not behavior. Two classes would
      duplicate the one-vote-per-user, no-self-vote, and retraction logic. A VoteType enum
      on a single Vote keeps the rules in one place — a direct application of DRY.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-stack-overflow-008
    difficulty: intermediate
    tags: [noun-verb, modeling, vote]
    question: |
      What is the modeling problem with representing votes as a plain "int votes" counter
      on a post?
    options:
      - "Integers overflow after two billion votes"
      - "It cannot enforce one-vote-per-user, no-self-vote, or vote retraction because it stores no per-voter information"
      - "It uses more memory than a list of Vote objects"
      - "It prevents the score from ever being negative"
    answer: 1
    explanation: |
      A bare counter discards who voted, so you cannot prevent double-voting, block
      self-votes, or retract a vote. Reifying the act as Vote(voter, type, target, time)
      makes those invariants enforceable. Overflow and memory are non-issues at this scale.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-stack-overflow-009
    difficulty: beginner
    tags: [noun-verb, method]
    question: |
      In noun/verb analysis, the verbs (ask, answer, comment, vote, accept) become
      candidate ______.
    options:
      - "classes"
      - "methods"
      - "database tables"
      - "enums"
    answer: 1
    explanation: |
      Nouns yield candidate classes and attributes; verbs yield candidate methods/behaviors.
      Each verb is then assigned to the class that owns the data it manipulates
      (Information Expert), e.g., castVote on Post, acceptAnswer on Question.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-stack-overflow-010
    difficulty: intermediate
    tags: [inheritance, post, dry]
    question: |
      Why is inheritance (Question extends Post, Answer extends Post) justified here, when
      most LLD problems favor composition over inheritance?
    options:
      - "Because inheritance is always faster than composition"
      - "Because both truly are votable, commentable posts sharing real behavior — an is-a relationship that lets voting/scoring/commenting be written once"
      - "Because Java performs better with deep hierarchies"
      - "Because composition cannot express a title field"
    answer: 1
    explanation: |
      Inheritance is appropriate when there is a genuine is-a relationship with shared
      behavior. Question and Answer both are posts that are voted and commented on, so a
      Post base class removes real duplication. The alternative (Votable/Commentable
      interfaces + composition) is also defensible; the key is naming the trade-off.
    ref: "concepts.md#responsibilities-and-relationships-crc--associations"

  - id: design-stack-overflow-011
    difficulty: intermediate
    tags: [relationships, composition]
    question: |
      What is the correct relationship between Question and its Answer list?
    options:
      - "Aggregation — answers are shared across questions"
      - "Composition — an answer belongs to exactly one question and dies with it"
      - "Inheritance — Answer extends Question"
      - "Association only — no ownership either way"
    answer: 1
    explanation: |
      An answer has no meaning outside its question and should be deleted with it, which is
      the defining property of composition (a strong whole-part with coincident lifetimes).
      Answers are not shared (rules out aggregation) and Answer is-not-a Question.
    ref: "concepts.md#responsibilities-and-relationships-crc--associations"

  - id: design-stack-overflow-012
    difficulty: intermediate
    tags: [relationships, aggregation, tag]
    question: |
      Question-to-Tag is many-to-many, and tags are reused across questions and exist
      independently. Which relationship best models this?
    options:
      - "Composition — tags are owned by and die with a single question"
      - "Aggregation — tags are shared and independently owned"
      - "Inheritance — Tag extends Question"
      - "A one-to-one association"
    answer: 1
    explanation: |
      Because tags are shared across many questions and live independently of any one
      question, this is aggregation (has-a without exclusive ownership), not composition.
      Deleting a question must not delete the tag definition.
    ref: "concepts.md#responsibilities-and-relationships-crc--associations"

  - id: design-stack-overflow-013
    difficulty: intermediate
    tags: [relationships, composition, vote]
    question: |
      Votes and comments on a post should be modeled with which relationship to Post?
    options:
      - "Aggregation — they are shared with other posts"
      - "Inheritance — Vote extends Post"
      - "Composition — they have no life outside their post and cascade on delete"
      - "A static association with no multiplicity"
    answer: 2
    explanation: |
      A vote or comment exists only in the context of the post it targets and should be
      removed if the post is deleted — that coincident lifetime is composition. They are
      not shared across posts (not aggregation) and are not posts themselves.
    ref: "concepts.md#responsibilities-and-relationships-crc--associations"

  - id: design-stack-overflow-014
    difficulty: advanced
    tags: [patterns, strategy, reputation]
    question: |
      You must support configurable reputation rules (answer upvote +10, question upvote
      +5, downvote -2, accepted +15) that can change without editing existing code. Which
      pattern fits best?
    options:
      - "Strategy — map each event type to an interchangeable ReputationRule returning a point delta"
      - "Singleton — one global reputation counter"
      - "Adapter — wrap an external reputation library"
      - "Decorator — stack reputation modifiers at call time"
    answer: 0
    explanation: |
      A per-event-type rule that returns a point delta is a textbook Strategy: the
      calculation algorithm is interchangeable and new events are added as new rules,
      satisfying Open/Closed. The other patterns solve unrelated problems (instance count,
      interface mismatch, dynamic wrapping).
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-015
    difficulty: advanced
    tags: [patterns, observer, badges]
    question: |
      Badges must be awarded automatically when a user crosses a reputation or action
      threshold, and you may later add notifications and an activity feed reacting to the
      same events. Which pattern is the right seam?
    options:
      - "Template Method"
      - "Observer — listeners subscribe to an event stream and react without the publisher knowing them"
      - "Flyweight"
      - "Proxy"
    answer: 1
    explanation: |
      Observer decouples event producers (votes, acceptance) from consumers (badge
      awarding, notifications, feeds). New listeners are added without touching the code
      that fires events — Open/Closed. The other patterns address reuse, memory sharing,
      and access control, not event propagation.
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-016
    difficulty: intermediate
    tags: [patterns, state, lifecycle]
    question: |
      A question can be OPEN, CLOSED, DUPLICATE, or PROTECTED, and which operations are
      legal depends on the current status. Which pattern concept models this?
    options:
      - "Observer"
      - "Builder"
      - "State (often an enum guard for interview scope)"
      - "Chain of Responsibility"
    answer: 2
    explanation: |
      Behavior varying by lifecycle status is the State pattern. For an interview an enum
      guard (checking status before an operation) is usually sufficient; escalate to full
      State classes only if transition logic becomes complex. Cross-reference dp-state.
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-017
    difficulty: intermediate
    tags: [patterns, facade]
    question: |
      QnAService exposes postQuestion, castVote, acceptAnswer, and searchByTag over the
      entity graph and owns the registries. Which pattern does it embody?
    options:
      - "Facade — a simplified entry point over a subsystem"
      - "Mediator replacing all entity references"
      - "Abstract Factory"
      - "Visitor"
    answer: 0
    explanation: |
      A coarse service that provides one simplified API over the underlying entity graph
      is a Facade. It keeps controllers thin and entities free of cross-cutting
      orchestration, and is the natural place to publish events.
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-018
    difficulty: advanced
    tags: [grasp, information-expert, responsibilities]
    question: |
      By the Information Expert (GRASP) principle, where should the acceptAnswer logic
      (including the "only the asker may accept" check) live?
    options:
      - "In the UI controller that received the click"
      - "In a generic utility class AcceptanceHelper"
      - "On Question, which owns the answers list and knows its author (the asker)"
      - "On the Answer, which knows its own text"
    answer: 2
    explanation: |
      Information Expert assigns a responsibility to the class holding the data needed to
      fulfill it. Question owns the answers and knows the asker, so it can enforce the
      author check and single-accepted-answer invariant. Putting it in the UI or a helper
      scatters domain rules and invites bypass.
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-019
    difficulty: advanced
    tags: [solid, ocp, extensibility]
    question: |
      A new badge "award when a user reaches 10,000 reputation" must be added without
      modifying existing classes. With the Observer-based BadgeService and a badge catalog,
      how is this achieved?
    options:
      - "Add an if-branch in the vote-handling code for the new threshold"
      - "Subclass User to UserWith10kBadge"
      - "Modify ReputationManager to also award badges"
      - "Add a Badge with a qualifies(user) predicate to the catalog; the BadgeService awards it automatically on the next event"
    answer: 3
    explanation: |
      Adding a Badge entity with its own qualifies predicate to the catalog is a pure
      addition: the existing Observer iterates the catalog and awards any newly-qualifying
      badge. This is the Open/Closed Principle in action — no edits to publishers or the
      reputation engine.
    ref: "concepts.md#extensibility"

  - id: design-stack-overflow-020
    difficulty: advanced
    tags: [extensibility, bounties, patterns]
    question: |
      To add bounties (offer +50 rep to a good answerer), which change set keeps the design
      Open/Closed?
    options:
      - "Rewrite Post to include bounty fields and rebuild the vote logic"
      - "Add branching in castVote to detect bounty situations"
      - "Add a Bounty value object on Question plus new EventTypes/ReputationRules that funnel through the existing publish seam"
      - "Store bounties in a global static map read directly by the UI"
    answer: 2
    explanation: |
      A Bounty on Question plus BOUNTY_STARTED/BOUNTY_AWARDED events and matching rules
      reuses the existing Strategy (reputation) and publish (Observer) seams. Post, Vote,
      and existing rules are untouched — the feature is an addition, not a rewrite.
    ref: "concepts.md#extensibility"

  - id: design-stack-overflow-021
    difficulty: advanced
    tags: [extensibility, comments, composite]
    question: |
      To support threaded comment replies, what is the cleanest change?
    options:
      - "Give Comment a parentComment self-reference, forming a Composite-style tree, without touching Post"
      - "Create a new ThreadedPost subclass of Post"
      - "Store all replies as a flat string on the post"
      - "Add a separate Reply class duplicating Comment's fields"
    answer: 0
    explanation: |
      A self-referential parentComment turns comments into a tree (a Composite-flavored
      structure) and localizes the change to Comment. Subclassing Post or duplicating
      fields in a Reply class adds needless types; a flat string loses structure and
      identity.
    ref: "concepts.md#extensibility"

  - id: design-stack-overflow-022
    difficulty: intermediate
    tags: [concurrency, vote]
    question: |
      To enforce "one vote per user per post" under concurrent voting, how are votes best
      stored on a Post?
    options:
      - "In a ConcurrentHashMap keyed by voter id, so a duplicate is idempotent and different voters do not contend"
      - "In an ArrayList scanned linearly on each vote"
      - "As a running integer incremented per vote"
      - "In a ThreadLocal per request"
    answer: 0
    explanation: |
      Keying votes by voter id in a ConcurrentHashMap makes the uniqueness invariant atomic
      and lock-light: a repeat vote from the same user overwrites idempotently while
      different users write different keys without contention. A list requires external
      locking and O(n) scans; a counter cannot enforce uniqueness.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-stack-overflow-023
    difficulty: advanced
    tags: [concurrency, reputation]
    question: |
      Many upvotes across many posts credit the same author concurrently. What is the risk
      with a naive "reputation += delta" and the fix?
    options:
      - "No risk; integer addition is always atomic in Java"
      - "Deadlock; fix by removing all locks"
      - "Stack overflow; fix with recursion limits"
      - "Lost updates from the read-modify-write race; fix with AtomicInteger or a synchronized accumulator"
    answer: 3
    explanation: |
      reputation += delta is a read-modify-write that is not atomic, so concurrent credits
      can clobber each other and lose points. An AtomicInteger (or synchronized
      addReputation) makes the accumulation atomic. It is not a deadlock or recursion issue.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-stack-overflow-024
    difficulty: intermediate
    tags: [concurrency, observer]
    question: |
      Why should observer callbacks (badge awarding, notifications) be isolated with
      try/catch or dispatched asynchronously?
    options:
      - "To make the code shorter"
      - "Because Java requires checked exceptions on all listeners"
      - "So a failing or slow notifier cannot block the voting hot path or roll back a valid reputation change"
      - "Because observers must run before the vote is stored"
    answer: 2
    explanation: |
      Calling foreign listener code inline on the voting path is a hazard: a slow or
      throwing notifier could stall voting or undo a legitimate reputation update. Wrapping
      each onEvent (or dispatching async) isolates consumers from producers, preserving the
      core operation's correctness and latency.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-stack-overflow-025
    difficulty: intermediate
    tags: [concurrency, badges, idempotency]
    question: |
      Observers can fire repeatedly for the same user. What must BadgeService do to stay
      correct?
    options:
      - "Award the badge every time an event arrives"
      - "Check hasBadge before awarding so the same badge is never granted twice (idempotent award)"
      - "Delete and re-create the user's badge list on each event"
      - "Ignore all events after the first badge"
    answer: 1
    explanation: |
      Since events can recur, BadgeService must guard with a hasBadge check so a
      threshold-crossing badge is awarded exactly once. Re-awarding would double-count or
      spam notifications; ignoring all later events would block other badges.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-stack-overflow-026
    difficulty: beginner
    tags: [vote, rules]
    question: |
      Where should the "a user cannot vote on their own post" rule be enforced?
    options:
      - "In the browser via disabled buttons only"
      - "In the Vote constructor, which lacks the post's author"
      - "In Post.castVote, comparing the voter to the post's author"
      - "Nowhere; it is a UI-only concern"
    answer: 2
    explanation: |
      The rule is a domain invariant and belongs where the data lives: Post.castVote can
      compare the voter to the author and reject self-votes. UI disabling is a convenience,
      not a guarantee; the Vote object alone may not know the author to compare against.
    ref: "concepts.md#code-skeleton"

  - id: design-stack-overflow-027
    difficulty: intermediate
    tags: [reputation, numbers]
    question: |
      Using the classic Stack Overflow numbers modeled as ReputationRules, how much
      reputation does an answerer gain when their answer is upvoted once and then accepted?
    options:
      - "5"
      - "10"
      - "15"
      - "25"
    answer: 3
    explanation: |
      An answer upvote is +10 and acceptance is +15, totaling +25. Modeling these as two
      separate ReputationRules (ANSWER_UPVOTED and ANSWER_ACCEPTED) keeps each event's
      value independently configurable.
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-028
    difficulty: intermediate
    tags: [modeling, roles]
    question: |
      A person asks one question and answers another. Why is modeling Asker and Answerer as
      subclasses of User a mistake?
    options:
      - "Because Java disallows multiple inheritance"
      - "Because subclasses are slower to construct"
      - "Because the same person plays both roles, so a single user would need to be two objects — the role is a per-interaction relationship, not an identity type"
      - "Because User already has too many fields"
    answer: 2
    explanation: |
      Roles like asker/answerer are relationships to specific posts, not intrinsic types.
      Subclassing forces a dual-role user to exist as two objects, an immediate
      contradiction. Model the role on the association (question.author, answer.author),
      keeping User one identity.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-stack-overflow-029
    difficulty: intermediate
    tags: [patterns, strategy, search]
    question: |
      Answers can be sorted by score, newest, or most active, and more orders may be added.
      What is the cleanest design?
    options:
      - "A big if/else in the service switching on a sort string"
      - "A separate service method per sort order"
      - "A pluggable sort Strategy (Comparator) passed into searchByTag"
      - "Hard-code sorting by score and reject other requests"
    answer: 2
    explanation: |
      A pluggable comparator/sort Strategy lets new orders be added without editing the
      service (Open/Closed). Branching on a string or adding a method per order accretes
      conditional logic and duplicate code as orders grow.
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-030
    difficulty: intermediate
    tags: [solid, srp]
    question: |
      Putting reputation-calculation math directly inside the Vote class would most
      directly violate which principle?
    options:
      - "Single Responsibility Principle"
      - "Liskov Substitution Principle"
      - "Interface Segregation Principle"
      - "Dependency Inversion Principle"
    answer: 0
    explanation: |
      A Vote's job is to represent a single voting act. Making it also compute reputation
      deltas gives it a second reason to change (rule changes vs. vote-representation
      changes), violating SRP. That logic belongs in ReputationManager/ReputationRule.
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-031
    difficulty: advanced
    tags: [solid, dip]
    question: |
      QnAService.publish calls reputation.apply and notifies observers through the
      QnAObserver interface rather than concrete BadgeService/EmailNotifier types. Which
      principle does this exemplify?
    options:
      - "Interface Segregation Principle"
      - "Dependency Inversion Principle — depend on abstractions, not concretions"
      - "Single Responsibility Principle"
      - "Law of Demeter"
    answer: 1
    explanation: |
      Depending on the QnAObserver and ReputationRule abstractions rather than concrete
      consumers is the Dependency Inversion Principle. It lets new consumers or rules be
      injected without changing the publisher, and keeps high-level policy decoupled from
      low-level detail.
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-032
    difficulty: advanced
    tags: [solid, lsp, post]
    question: |
      Anywhere the code expects a votable Post, it must be able to accept a Question or an
      Answer without special-casing. Which principle guarantees this substitutability?
    options:
      - "Liskov Substitution Principle"
      - "Open/Closed Principle"
      - "Single Responsibility Principle"
      - "Composite Reuse Principle"
    answer: 0
    explanation: |
      LSP requires subtypes to be usable wherever the base type is expected without
      breaking correctness. Because Question and Answer honor the Post contract (voting,
      commenting, scoring), any code operating on Post works for either — the payoff of a
      well-designed base class.
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-033
    difficulty: intermediate
    tags: [modeling, entity-value]
    question: |
      Which of these is best modeled as a value/immutable-ish object rather than a mutable
      entity with a rich lifecycle?
    options:
      - "Question, which changes status and accumulates answers"
      - "User, whose reputation grows over time"
      - "A Vote, capturing voter + type + target + timestamp at the moment it is cast"
      - "QnAService, which owns all registries"
    answer: 2
    explanation: |
      A Vote records a single act at a point in time; treating it as an immutable value (a
      change of mind is a retract-then-recast) removes a class of races and makes vote
      history an audit trail. Question and User are long-lived entities; QnAService is the
      orchestrating facade.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-stack-overflow-034
    difficulty: intermediate
    tags: [state, lifecycle, rules]
    question: |
      Attempting to post an answer to a question whose status is CLOSED should be handled
      how?
    options:
      - "Silently accept the answer and hide it"
      - "Rejected via a status guard, since answering is only legal while the question is OPEN/PROTECTED"
      - "Throw only in the UI layer, never in the domain"
      - "Automatically reopen the question"
    answer: 1
    explanation: |
      Legal operations depend on the question's state, so addAnswer must guard on status
      (this is the State concept). Answering a CLOSED question is disallowed at the domain
      level; auto-reopening or silently accepting would corrupt the lifecycle model.
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-035
    difficulty: intermediate
    tags: [modeling, accept]
    question: |
      How many answers can be accepted on a single question, and who decides?
    options:
      - "At most one, decided by the asker (question author)"
      - "Any number, decided by any user"
      - "At most one, decided by the highest-reputation user"
      - "Exactly one, decided automatically by highest score"
    answer: 0
    explanation: |
      Exactly one accepted answer at a time, chosen by the asker. Re-accepting moves the
      flag (unset old, set new). The asker check lives on Question.acceptAnswer; automatic
      selection by score is not the model (though "highest voted" is a separate display
      concern).
    ref: "concepts.md#code-skeleton"

  - id: design-stack-overflow-036
    difficulty: advanced
    tags: [patterns, alternatives, tradeoffs]
    question: |
      Instead of a Post base class, a candidate proposes Votable and Commentable interfaces
      implemented via composition. What is the fair assessment?
    options:
      - "It is strictly wrong; only inheritance can model this"
      - "It is a valid alternative — more flexible and avoids a forced hierarchy, at the cost of some boilerplate — and the trade-off should be named"
      - "It is identical in every way, so the choice is arbitrary and not worth mentioning"
      - "It violates SOLID and should be rejected outright"
    answer: 1
    explanation: |
      Interfaces + composition is a legitimate alternative: it avoids a rigid base class
      and allows a type to opt into capabilities, at the price of re-wiring shared logic
      (or delegating to a helper). A strong candidate states the trade-off rather than
      claiming one option is universally correct.
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-037
    difficulty: intermediate
    tags: [modeling, tag]
    question: |
      Two different questions both use the tag "java". How should the Tag be represented?
    options:
      - "Each question owns its own private Tag copy"
      - "A single shared Tag entity referenced by both questions (many-to-many)"
      - "Tag should be a boolean flag on Question"
      - "Tag should be a subclass of Question"
    answer: 1
    explanation: |
      Tags are shared, reusable entities forming a many-to-many association with questions;
      one Tag("java") is referenced by many questions. Private copies duplicate data and
      break tag-based search/aggregation; a boolean or subclass cannot represent an
      open-ended tag vocabulary.
    ref: "concepts.md#responsibilities-and-relationships-crc--associations"

  - id: design-stack-overflow-038
    difficulty: advanced
    tags: [concurrency, vote-flip]
    question: |
      A user flips their vote from up to down on a post. How should this be handled to keep
      the score consistent?
    options:
      - "Add a downvote and leave the old upvote in place"
      - "Atomically replace the user's stored vote (remove-then-add under one guard) so the score never transiently double-counts"
      - "Increment a downvote counter and ignore the prior upvote"
      - "Create a second Vote object for the same user"
    answer: 1
    explanation: |
      Because votes are keyed per user, flipping means replacing that user's single stored
      vote atomically. Leaving the old vote or adding a second one would double-count and
      violate one-vote-per-user. The per-user map makes the replacement natural.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-stack-overflow-039
    difficulty: intermediate
    tags: [publish, seam, patterns]
    question: |
      Why route every reputation-affecting action through a single QnAService.publish(event)
      seam?
    options:
      - "To make the code run on a single thread"
      - "So Strategy (how much reputation) and Observer (who reacts) both attach in one place, making new rules/consumers additions rather than edits"
      - "Because Java requires a single entry point per class"
      - "To avoid using interfaces anywhere in the design"
    answer: 1
    explanation: |
      A single publish seam is where the reputation Strategy is applied and observers are
      notified. Funneling events there means adding a rule or a listener is a localized
      addition (Open/Closed) and guarantees no action bypasses reputation/badge processing.
    ref: "concepts.md#code-skeleton"

  - id: design-stack-overflow-040
    difficulty: beginner
    tags: [score, post]
    question: |
      How is a post's displayed score most cleanly derived?
    options:
      - "Stored as a mutable field updated by every caller"
      - "Computed as (upvotes minus downvotes) from the stored votes"
      - "Fetched from an external service each render"
      - "Equal to the number of comments"
    answer: 1
    explanation: |
      Deriving score as upvotes minus downvotes from the authoritative vote collection
      keeps it consistent with the stored votes and avoids update-anomaly bugs from a
      separately maintained counter. (At scale you might cache/denormalize it — an HLD
      concern.)
    ref: "concepts.md#code-skeleton"

  - id: design-stack-overflow-041
    difficulty: advanced
    tags: [extensibility, moderation, flags]
    question: |
      Adding a moderation/flagging feature should ideally require which changes?
    options:
      - "Rewriting Post and Vote to embed flag state"
      - "Adding flag-handling branches throughout castVote and acceptAnswer"
      - "Converting every User into a Moderator subclass"
      - "A new Flag entity and FlagQueue plus moderator-only QnAService methods guarded by a privilege check, reusing the existing QuestionStatus transitions"
    answer: 3
    explanation: |
      Flagging is additive: a Flag entity, a queue, and privilege-guarded moderator methods.
      Closing/protecting reuses the QuestionStatus state machine already present. Embedding
      flag logic in Post/Vote or scattering branches would violate SRP and Open/Closed.
    ref: "concepts.md#extensibility"

  - id: design-stack-overflow-042
    difficulty: intermediate
    tags: [crc, responsibilities]
    question: |
      In CRC terms, what does the Post class KNOW and DO?
    options:
      - "Knows reputation rules; does badge awarding"
      - "Knows its author, body, votes, and comments; does vote/comment handling and score computation"
      - "Knows all users in the system; does authentication"
      - "Knows the tag vocabulary; does search ranking"
    answer: 1
    explanation: |
      Post's responsibility is to own its content (author, body), its votes and comments,
      and to handle voting/commenting and compute its score. Reputation rules, badge
      awarding, global user registries, and search belong to other collaborators
      (ReputationManager, BadgeService, QnAService).
    ref: "concepts.md#responsibilities-and-relationships-crc--associations"

  - id: design-stack-overflow-043
    difficulty: advanced
    tags: [extensibility, events, strategy]
    question: |
      A new rule "an answer that reaches a score of 100 grants its author a Great Answer
      badge and bonus rep" must be added. What is the minimal Open/Closed change?
    options:
      - "Edit getScore to also mutate reputation"
      - "Add a special case in every voting method"
      - "Subclass Answer into GreatAnswer"
      - "Add a GREAT_ANSWER EventType with a matching ReputationRule and Badge, published when the score threshold is crossed"
    answer: 3
    explanation: |
      Introduce a new EventType plus a ReputationRule and a threshold Badge, published at
      the point where the score is checked. Both the Strategy (reputation) and Observer
      (badge) machinery absorb it without edits to existing rules or the voting code.
    ref: "concepts.md#extensibility"

  - id: design-stack-overflow-044
    difficulty: intermediate
    tags: [modeling, account]
    question: |
      An interviewer asks you to separate a user's public profile from their login
      credentials and settings. What is the reasonable modeling move?
    options:
      - "Merge everything into one giant User class with 40 fields"
      - "Store credentials as a comment on the user's first question"
      - "Make Account a subclass of Vote"
      - "Introduce an Account (credentials/settings) alongside User (public profile), splitting responsibilities"
    answer: 3
    explanation: |
      Splitting Account (private credentials/settings) from User (public profile) separates
      two distinct responsibilities and change reasons (SRP). Folding everything into one
      class or misusing unrelated types (comments, Vote) conflates concerns.
    ref: "concepts.md#nounverb-object-identification"

  - id: design-stack-overflow-045
    difficulty: advanced
    tags: [concurrency, delete, policy]
    question: |
      When a post with existing votes and comments is deleted, what is the correct handling
      of composition and previously granted reputation?
    options:
      - "Votes/comments cascade with the post; already-granted reputation is typically NOT auto-clawed-back, but the policy must be stated"
      - "Nothing is deleted; the post is only hidden and votes keep accruing"
      - "All reputation ever granted from the post is silently reversed with no discussion"
      - "Votes are orphaned and kept as top-level objects"
    answer: 0
    explanation: |
      Composition means the post's votes and comments are removed with it. Whether to claw
      back reputation is a policy decision (real sites often keep it) that you should call
      out explicitly. Orphaning votes contradicts composition; silent full reversal is a
      choice that must at least be discussed.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-stack-overflow-046
    difficulty: intermediate
    tags: [patterns, cross-ref]
    question: |
      In this LLD round you say "we use Observer to award badges." How much of the Observer
      pattern should you re-teach?
    options:
      - "Re-derive the full Observer class diagram and its history from scratch"
      - "Name it, state why it fits (decoupled event reaction), and cross-reference the dp-observer topic that owns the taxonomy"
      - "Avoid naming any pattern to keep the design original"
      - "Explain every GoF pattern to show breadth"
    answer: 1
    explanation: |
      The boundary rule: pattern taxonomy lives in the dp-* topics. Here you name the
      pattern, justify its fit for the requirement, and cross-reference dp-observer rather
      than re-deriving it. Re-teaching wastes the clock; refusing to name patterns hides
      your reasoning.
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-047
    difficulty: advanced
    tags: [patterns, classification]
    question: |
      Classifying the core patterns by GoF intent, which grouping is correct?
    options:
      - "Strategy and Observer are Creational; State is Structural"
      - "Strategy (reputation), Observer (badges), and State (question lifecycle) are all Behavioral; Facade is Structural"
      - "Facade is Creational; Observer is Structural"
      - "All four are Behavioral patterns"
    answer: 1
    explanation: |
      Strategy, Observer, and State are Behavioral patterns (they concern algorithms,
      event propagation, and state-dependent behavior). Facade is Structural (it composes a
      simplified interface over a subsystem). Naming the intent category signals command of
      the taxonomy.
    ref: "concepts.md#design-decisions-and-patterns"

  - id: design-stack-overflow-048
    difficulty: intermediate
    tags: [api, signatures]
    question: |
      Which castVote signature best supports idempotent, rule-enforcing voting at the
      service layer?
    options:
      - "void castVote(int postId)"
      - "boolean addUpvote() with a separate addDownvote()"
      - "VoteResult castVote(User voter, Post target, VoteType type) returning accept/reject with a reason"
      - "int vote() that just increments a counter"
    answer: 2
    explanation: |
      Passing the voter, target, and VoteType and returning a VoteResult lets the method
      enforce no-self-vote/one-per-user and report why a vote was rejected. Separate
      add-up/add-down methods duplicate rules; a counter-incrementing signature enforces
      nothing.
    ref: "concepts.md#api--method-signatures"

  - id: design-stack-overflow-049
    difficulty: advanced
    tags: [hld-boundary, search]
    question: |
      The interviewer escalates searchByTag to "full-text search across millions of
      questions with ranking." How do you keep the LLD design sound?
    options:
      - "Implement an inverted index and TF-IDF ranking inside QnAService immediately"
      - "Name it an HLD concern (external search index/service, replicas) and note that searchByTag is the in-process seam where an index client would plug in"
      - "Add a SearchCluster class to the class diagram"
      - "Replace all entities with search documents"
    answer: 1
    explanation: |
      Full-text ranking at scale is a system-design concern (external search index,
      replicas, denormalization). The clean move is to keep searchByTag as the seam an
      external index client would implement, and point to the system-design domain rather
      than building infrastructure into the OO model.
    ref: "concepts.md#extensibility"

  - id: design-stack-overflow-050
    difficulty: expert
    tags: [design-review, tradeoffs, synthesis]
    question: |
      A reviewer critiques a design that has Question and Answer as unrelated classes, each
      with its own duplicated castVote/addComment/getScore and an int-counter for votes.
      What is the sharpest single diagnosis?
    options:
      - "It is fine; duplication improves performance"
      - "The only issue is naming conventions"
      - "It should add more subclasses to fix the duplication"
      - "It misses the shared Post abstraction (DRY/LSP) and uses a counter that cannot enforce vote invariants — refactor to Post + reified Vote"
    answer: 3
    explanation: |
      The two flaws are linked: no shared Post base means voting/commenting/scoring are
      duplicated (a DRY/LSP failure), and an int counter cannot enforce one-vote-per-user,
      no-self-vote, or retraction. The fix is a Post abstraction plus a reified Vote keyed
      by voter — precisely the modeling the problem is designed to elicit.
    ref: "concepts.md#responsibilities-and-relationships-crc--associations"
