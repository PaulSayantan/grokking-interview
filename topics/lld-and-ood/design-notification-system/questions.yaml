topic: "Design a Notification / Pub-Sub System"
domain: lld-and-ood
topic_slug: design-notification-system
version: 1

questions:
  - id: design-notification-system-001
    difficulty: beginner
    tags: [observer, design-reasoning]
    question: |
      Subscribers register interest and must be notified when a publisher raises an
      event. Which pattern is the core of this design?
    options:
      - "Observer — the subject notifies registered subscribers on an event"
      - "Singleton — one global notifier holds all state"
      - "Adapter — subscribers adapt the publisher's interface"
      - "Facade — a single entry point simplifies subscription"
    answer: 0
    explanation: |
      The defining shape — subscribers register and are notified when the subject's
      state changes / an event occurs — is the Observer pattern. The subject depends
      only on the Subscriber interface, decoupling it from concrete recipients.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-notification-system-002
    difficulty: beginner
    tags: [strategy, channels]
    question: |
      Email, SMS, push, and Slack are interchangeable ways to deliver the same
      notification. What is the cleanest way to model them?
    options:
      - "One Channel class with a channelType field and a switch in send()"
      - "Four unrelated entity classes with no shared type"
      - "A NotificationChannel interface with one concrete class per medium (Strategy)"
      - "An enum whose values contain the delivery logic"
    answer: 2
    explanation: |
      Interchangeable delivery mechanisms behind one contract is the Strategy pattern:
      a NotificationChannel interface with EmailChannel, SmsChannel, etc. Adding a
      channel becomes a new class, not an edit to a switch — Open/Closed.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-notification-system-003
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      In the first five minutes, which scoping statement about scale shows the best
      LLD judgment?
    options:
      - "\"I'll build a Kafka-backed distributed broker since in-memory is trivial\""
      - "\"I'll design an in-process broker behind a Broker interface so a durable queue can slot in later; distribution itself is HLD\""
      - "\"Scale doesn't affect class design, so I'll ignore it\""
      - "\"I'll implement both in-memory and distributed brokers now\""
    answer: 1
    explanation: |
      The LLD round wants clean single-machine OO. Acknowledging the distributed
      follow-up and leaving a seam (the Broker interface) shows senior judgment while
      keeping the design in scope. Jumping to Kafka turns it into HLD.
    ref: "concepts.md#requirements-clarification"

  - id: design-notification-system-004
    difficulty: beginner
    tags: [noun-verb, method]
    question: |
      Applying noun/verb extraction to the requirements, which candidate noun should
      NOT become a top-level peer entity?
    options:
      - "Notification"
      - "Subscriber"
      - "Topic"
      - "Email (as a sibling of Topic and Subscriber)"
    answer: 3
    explanation: |
      Email, SMS, and Push are concrete strategies of one NotificationChannel
      abstraction, not top-level peer entities alongside Notification/Topic/Subscriber.
      Filtering them into channel implementations is the key modelling decision.
    ref: "concepts.md#noun-and-verb-object-identification"

  - id: design-notification-system-005
    difficulty: intermediate
    tags: [observer-vs-pubsub, coupling]
    question: |
      What most distinguishes pub-sub (broker) from the plain Observer pattern?
    options:
      - "Pub-sub is always faster than Observer"
      - "In pub-sub a broker/topic mediates so publisher and subscriber never reference each other; in Observer the subject holds direct references"
      - "Observer supports multiple subscribers but pub-sub supports only one"
      - "Observer requires a message queue while pub-sub does not"
    answer: 1
    explanation: |
      Observer wires the subject directly to its observers (in-process, usually sync).
      Pub-sub inserts a broker/topic so publishers and subscribers know only the
      broker — looser coupling, often async and topic-routed.
    ref: "concepts.md#observer-vs-pub-sub-broker"

  - id: design-notification-system-006
    difficulty: intermediate
    tags: [solid, open-closed]
    question: |
      A candidate writes one NotificationChannel class with a ChannelType field and a
      switch in send(). Adding Slack means editing that switch. Which principle does
      this violate?
    options:
      - "Single Responsibility Principle"
      - "Liskov Substitution Principle"
      - "Open/Closed Principle"
      - "Interface Segregation Principle"
    answer: 2
    explanation: |
      Every new channel reopens the existing class to edit the switch — the class is
      not closed to modification. Strategy (one class per channel behind an interface)
      makes the system open for extension, closed for modification.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-notification-system-007
    difficulty: intermediate
    tags: [decorator, rate-limiting]
    question: |
      You must add per-user rate limiting to delivery without modifying any existing
      channel class. Which pattern fits?
    options:
      - "Decorator — wrap any NotificationChannel to check the limit then delegate"
      - "Observer — let the limiter observe the channel"
      - "Template Method — add a rate-limit step to the base class"
      - "Singleton — make the limiter global"
    answer: 0
    explanation: |
      A RateLimitedChannel that implements NotificationChannel, wraps a delegate,
      checks the limiter, and forwards adds behavior transparently — the Decorator
      pattern. No channel class is touched. The rate-limit math cross-refs
      design-rate-limiter-oo.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-notification-system-008
    difficulty: intermediate
    tags: [factory, creational]
    question: |
      Each channel needs a wired provider client (SMS gateway, push credentials).
      Which pattern keeps NotificationService from newing concrete channels?
    options:
      - "Prototype — clone a template channel"
      - "Factory — a ChannelFactory maps ChannelType to a fully-wired channel"
      - "Flyweight — share channel instances"
      - "Mediator — a mediator constructs channels on demand"
    answer: 1
    explanation: |
      A ChannelFactory centralizes construction (provider clients, credentials) and
      returns the NotificationChannel interface, so the service and callers never
      depend on concrete channel classes or their constructors.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-notification-system-009
    difficulty: intermediate
    tags: [concurrency, fan-out]
    question: |
      During publish(), one thread iterates the subscriber list while another calls
      subscribe(). With a plain ArrayList, what happens and what fixes it?
    options:
      - "Nothing; ArrayList is thread-safe"
      - "A deadlock; fix with a Semaphore"
      - "A ConcurrentModificationException; fix with CopyOnWriteArrayList or a snapshot under lock"
      - "A NullPointerException; fix by null-checking each subscriber"
    answer: 2
    explanation: |
      Structurally modifying an ArrayList while iterating throws
      ConcurrentModificationException. Subscriptions are read-heavy and write-rare, so
      CopyOnWriteArrayList (or snapshotting under a lock) is the right fix.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-notification-system-010
    difficulty: intermediate
    tags: [strategy, retry]
    question: |
      The system must support fixed-delay retries today and exponential backoff with
      jitter later, chosen at configuration time. How should retry be modeled?
    options:
      - "Hard-code exponential backoff in NotificationService"
      - "A boolean useBackoff flag on Notification"
      - "A subclass of NotificationService per retry style"
      - "A RetryPolicy interface with interchangeable implementations (Strategy)"
    answer: 3
    explanation: |
      Retry behavior is an interchangeable algorithm — a Strategy. A RetryPolicy
      interface (shouldRetry, nextDelay) lets you inject fixed-delay or
      exponential-backoff-with-jitter without editing the service.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-notification-system-011
    difficulty: advanced
    tags: [idempotency, retry]
    question: |
      With at-least-once retry, a send succeeds but its acknowledgement is lost, so it
      retries. What design element prevents the user seeing a duplicate?
    options:
      - "Switching to a synchronized block"
      - "An idempotency key / notification id used for downstream dedup"
      - "Increasing the retry delay"
      - "Making DeliveryResult mutable"
    answer: 1
    explanation: |
      At-least-once delivery inevitably risks duplicates. Attaching an idempotency
      key / notification id lets the provider or a dedup cache suppress the second
      delivery. Longer delays don't prevent duplicates.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-notification-system-012
    difficulty: intermediate
    tags: [preferences, srp]
    question: |
      Where should the logic "this user has email muted for the 'promotions' topic"
      live?
    options:
      - "In UserPreferences as data, consulted by NotificationService before dispatch"
      - "As an if-branch inside every channel's send()"
      - "Inside the Notification value object"
      - "In the broker's publish() loop, hard-coded per topic"
    answer: 0
    explanation: |
      Preferences are data on UserPreferences (enabled channels, muted topics). The
      service filters against them before dispatch. Scattering channel/topic branches
      into channels or the broker violates SRP and duplicates rules.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-notification-system-013
    difficulty: intermediate
    tags: [template-method, workflow]
    question: |
      Every channel validates, renders a template, sends over the wire, and records a
      result — only the send step differs. Which pattern captures this shared skeleton?
    options:
      - "Visitor — visit each channel"
      - "Chain of Responsibility — chain the steps"
      - "Memento — snapshot each step"
      - "Template Method — a final skeleton with an abstract doSend() hook"
    answer: 3
    explanation: |
      A fixed sequence of steps with one varying step is Template Method: an
      AbstractChannel fixes send() as final (validate→render→send→record) and defers
      only doSend() to subclasses. Use it only when steps genuinely share a skeleton.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-notification-system-014
    difficulty: intermediate
    tags: [builder, creational]
    question: |
      A Notification has id, title, body, and many optional fields (priority, metadata,
      TTL, deep-link). Which creational pattern avoids telescoping constructors?
    options:
      - "Abstract Factory"
      - "Builder"
      - "Object pool"
      - "Prototype"
    answer: 1
    explanation: |
      When an object has many optional fields, the Builder pattern produces readable,
      safe construction without a combinatorial explosion of constructors.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-notification-system-015
    difficulty: advanced
    tags: [decorator, composition]
    question: |
      You wrap a channel as new RateLimitedChannel(new RetryingChannel(new
      EmailChannel())). What property of the Decorator pattern makes this valid?
    options:
      - "Each decorator extends EmailChannel"
      - "Decorators must be applied in alphabetical order"
      - "Each decorator is itself a NotificationChannel and delegates to the wrapped one"
      - "The channels share static state"
    answer: 2
    explanation: |
      Every decorator implements the same NotificationChannel interface and holds a
      delegate of that type, so decorators nest arbitrarily and the client still sees a
      NotificationChannel. That is composition-over-inheritance in action.
    ref: "concepts.md#code-skeleton"

  - id: design-notification-system-016
    difficulty: beginner
    tags: [use-cases, actors]
    question: |
      Which actor should have NO knowledge of who receives a notification?
    options:
      - "The Publisher / event source"
      - "The Subscriber"
      - "UserPreferences"
      - "The channel provider"
    answer: 0
    explanation: |
      The whole point of Observer/pub-sub is that the publisher raises an event
      without knowing its recipients. The broker/subject handles fan-out. Coupling the
      publisher to subscribers defeats the pattern.
    ref: "concepts.md#use-cases-and-actors"

  - id: design-notification-system-017
    difficulty: intermediate
    tags: [relationships, composition-aggregation]
    question: |
      The NotificationBroker holds subscribers that exist independently and may be
      shared across topics. What relationship is this?
    options:
      - "Composition (the broker owns the subscribers' lifecycle)"
      - "Aggregation (subscribers exist independently of the broker)"
      - "Inheritance"
      - "Realization"
    answer: 1
    explanation: |
      Subscribers outlive and are independent of the broker (they can subscribe to
      several topics), so the broker aggregates them (hollow diamond, --o). Composition
      would imply the broker creates and destroys them.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-notification-system-018
    difficulty: intermediate
    tags: [relationships, composition]
    question: |
      NotificationService creates and owns its RetryPolicy and rate limiter; they don't
      outlive it. Which UML relationship and arrow apply?
    options:
      - "Aggregation, --o"
      - "Dependency, ..>"
      - "Composition, --*"
      - "Realization, ..|>"
    answer: 2
    explanation: |
      Owned parts whose lifecycle is bound to the whole are composition (filled
      diamond, --* in Mermaid). Aggregation (--o) would imply independent lifecycles.
    ref: "concepts.md#class-diagram"

  - id: design-notification-system-019
    difficulty: advanced
    tags: [concurrency, async]
    question: |
      sendAsync() enqueues work to an ExecutorService and returns. What is the key risk
      of using an unbounded queue here?
    options:
      - "Messages are delivered in random languages"
      - "The executor becomes single-threaded automatically"
      - "Notifications are guaranteed to be delivered twice"
      - "Under a burst, the queue grows without limit and can exhaust memory (OOM)"
    answer: 3
    explanation: |
      An unbounded queue absorbs bursts by growing indefinitely, risking OOM. Use a
      bounded queue with an explicit rejection/backpressure policy (block, drop, or
      shed) so the system degrades predictably.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-notification-system-020
    difficulty: advanced
    tags: [failure-isolation, resilience]
    question: |
      A hung SMS provider must not block email delivery to the same user. Which
      combination best isolates the failure?
    options:
      - "Deliver all channels sequentially on the caller thread"
      - "Per-channel async tasks with timeouts and a circuit breaker"
      - "A single global lock around all deliveries"
      - "Retry the SMS forever until it succeeds"
    answer: 1
    explanation: |
      Delivering each channel on its own task with a timeout, plus a circuit breaker to
      stop hammering a dead provider, isolates one channel's failure from the others.
      Sequential delivery or infinite retry lets one bad provider stall everything.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-notification-system-021
    difficulty: intermediate
    tags: [extensibility, open-closed]
    question: |
      "Add a WhatsApp channel." In a well-designed system, what is the change footprint?
    options:
      - "A new WhatsAppChannel implementing NotificationChannel plus one ChannelFactory case"
      - "Edit NotificationService, the broker, and every subscriber"
      - "Add a whatsapp boolean to Notification and branch on it"
      - "Subclass every existing channel"
    answer: 0
    explanation: |
      With Strategy + Factory, a new channel is one new class implementing the
      interface plus one factory case. Service, broker, and subscribers are untouched —
      the Open/Closed payoff made visible.
    ref: "concepts.md#extensibility"

  - id: design-notification-system-022
    difficulty: advanced
    tags: [batching, digest]
    question: |
      "Send one daily digest instead of 50 separate emails." Which approach keeps the
      design clean?
    options:
      - "Add if(digest) branches throughout NotificationService and every channel"
      - "Delete the immediate-send path entirely"
      - "Store notifications in the Notification object itself"
      - "A buffering DigestSubscriber or BatchingChannel decorator flushed on a schedule, driven by a digest preference flag"
    answer: 3
    explanation: |
      Immediate-vs-digest is a preference. A DigestSubscriber (or BatchingChannel
      decorator) buffers and flushes on schedule, keeping batching localized rather
      than sprinkling digest branches across the codebase.
    ref: "concepts.md#extensibility"

  - id: design-notification-system-023
    difficulty: intermediate
    tags: [api-design, value-object]
    question: |
      Why does send() return a DeliveryResult value object rather than void or a bare
      boolean?
    options:
      - "Objects return faster than primitives"
      - "void cannot be used in interfaces"
      - "It carries status, attempts, and error immutably — safe to log, aggregate, and pass across threads"
      - "It lets the channel mutate the result after returning"
    answer: 2
    explanation: |
      A DeliveryResult bundles status, attempt count, and error into one immutable
      value, so callers can log, aggregate metrics, and route retries/dead-letters
      without extra queries. Immutability makes it thread-safe. Results should not be
      mutated after return.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-notification-system-024
    difficulty: intermediate
    tags: [srp, channels]
    question: |
      What is the single responsibility of a concrete NotificationChannel like
      EmailChannel?
    options:
      - "Decide which users should receive the notification"
      - "Render (via its template) and deliver a notification over its specific medium, returning a result"
      - "Manage subscriptions and topic routing"
      - "Store user preferences"
    answer: 1
    explanation: |
      A channel's one job is delivery over its medium (render + send + report result).
      Recipient selection and topic routing belong to the service/broker; preferences
      belong to UserPreferences — keeping each class single-purpose.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-notification-system-025
    difficulty: intermediate
    tags: [observer, contract]
    question: |
      The Subscriber interface exposes onNotification(Notification). Why keep this
      contract minimal?
    options:
      - "To force every subscriber to be a channel"
      - "Because Java interfaces cannot have more than one method"
      - "To make notifications synchronous by force"
      - "So the subject/broker depends only on a tiny abstraction and any object can subscribe (loose coupling, ISP)"
    answer: 3
    explanation: |
      A minimal Subscriber contract means the broker depends only on an abstraction and
      any object can be a subscriber, maximizing decoupling and honoring Interface
      Segregation. It says nothing about sync vs async.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-notification-system-026
    difficulty: advanced
    tags: [ordering, concurrency]
    question: |
      Per-user notification ordering must be preserved, but a shared worker pool
      reorders tasks. What is a clean fix?
    options:
      - "Hash userId to one of N single-threaded executors so each user's work stays ordered"
      - "Use a single global thread for all users"
      - "Sort the queue alphabetically before each dispatch"
      - "Make Notification comparable and rely on the pool"
    answer: 0
    explanation: |
      Routing each user's work to a dedicated single-threaded executor (userId hashed
      to one of N queues) preserves per-user order while retaining cross-user
      parallelism. A single global thread kills throughput.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-notification-system-027
    difficulty: advanced
    tags: [dead-letter, reliability]
    question: |
      After retries are exhausted for a delivery, what should the system do?
    options:
      - "Silently drop the notification"
      - "Retry indefinitely on the same thread"
      - "Record it to a dead-letter queue / failure log for later inspection"
      - "Throw an unchecked exception up to the publisher"
    answer: 2
    explanation: |
      Exhausted retries should dead-letter — record to a DLQ/failure log so failures
      are observable and recoverable. Silent drops lose data; infinite retry stalls
      workers; propagating to the publisher recouples it to delivery.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-notification-system-028
    difficulty: intermediate
    tags: [observer-vs-pubsub, routing]
    question: |
      To add topic-based routing so subscribers only get events for topics they care
      about, what do you introduce?
    options:
      - "A NotificationBroker with a Map<Topic, List<Subscriber>> keyed by topic"
      - "A larger switch inside the publisher"
      - "A separate NotificationService subclass per topic"
      - "A global list of all subscribers checked on every event"
    answer: 0
    explanation: |
      Topic-based routing is naturally a broker holding a Map<Topic, List<Subscriber>>;
      publish(topic, n) fans out only to that topic's subscribers. This is the pub-sub
      evolution of a single-subject Observer.
    ref: "concepts.md#observer-vs-pub-sub-broker"

  - id: design-notification-system-029
    difficulty: advanced
    tags: [distributed, boundary]
    question: |
      The interviewer says "now scale it to millions of events across many services."
      What is the right LLD-round response?
    options:
      - "Rewrite every class to use Kafka APIs directly"
      - "Refuse — it's out of scope"
      - "Add more threads to the ExecutorService and call it distributed"
      - "Swap the in-memory broker for a durable queue behind the same Broker interface, and note durability/partitioning/exactly-once are HLD"
    answer: 3
    explanation: |
      The Broker interface is the seam: a durable-queue implementation replaces the
      in-memory one without touching publishers/subscribers. Durability, partitioning,
      and exactly-once are HLD — acknowledge and point to system-design pub-sub.
    ref: "concepts.md#extensibility"

  - id: design-notification-system-030
    difficulty: intermediate
    tags: [priority, extensibility]
    question: |
      "CRITICAL alerts must bypass digest batching and quiet hours." How is this best
      expressed?
    options:
      - "A separate CriticalNotificationService copy"
      - "A Priority field on Notification that the preference filter consults (and optionally a PriorityChannel decorator)"
      - "Hard-coded topic-name checks in every channel"
      - "A global boolean isCritical static flag"
    answer: 1
    explanation: |
      Priority is an attribute of the notification; the service's preference filter can
      let CRITICAL bypass digest/quiet-hours. A PriorityChannel decorator can expedite
      delivery. No duplicated service or per-channel topic checks needed.
    ref: "concepts.md#extensibility"

  - id: design-notification-system-031
    difficulty: intermediate
    tags: [dependency-inversion, di]
    question: |
      Why inject the NotificationBroker rather than access it via a global static
      Singleton?
    options:
      - "Static fields are illegal in Java"
      - "Singletons cannot implement interfaces"
      - "Injection allows substituting a fake/mock broker in tests and avoids hidden global coupling (DIP)"
      - "It makes publish() run faster"
    answer: 2
    explanation: |
      Depending on an injected Broker abstraction (Dependency Inversion) makes the
      collaborators testable with fakes and avoids hidden global state. A hard static
      Singleton couples every caller to one concrete instance.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-notification-system-032
    difficulty: advanced
    tags: [observer, reentrancy]
    question: |
      A subscriber publishes a new event inside its own onNotification() handler. What
      is the danger and the mitigation?
    options:
      - "None; re-entrant publishing is always safe"
      - "The JVM automatically detects and blocks it"
      - "It only affects SMS channels"
      - "Possible infinite recursion or deadlock; document notification as fire-and-forget and forbid blocking/re-publishing in handlers"
    answer: 3
    explanation: |
      Re-entrant publishing during fan-out can recurse or deadlock (especially if the
      subject holds a lock). Define notification as fire-and-forget and require handlers
      not to block or synchronously re-publish; offloading to a queue breaks the cycle.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-notification-system-033
    difficulty: beginner
    tags: [scoping, requirements]
    question: |
      Which of these is appropriate to explicitly SCOPE OUT of the LLD design?
    options:
      - "The NotificationChannel abstraction"
      - "User preferences filtering"
      - "Cross-region replication and exactly-once semantics of a durable log"
      - "Retry on failure"
    answer: 2
    explanation: |
      Cross-region replication and exactly-once semantics of a distributed durable log
      are HLD/infra concerns — name and park them. Channels, preferences, and retry are
      core to the single-machine OO design.
    ref: "concepts.md#requirements-clarification"

  - id: design-notification-system-034
    difficulty: intermediate
    tags: [template, rendering]
    question: |
      Why introduce a Template / TemplateEngine rather than embedding message strings
      in the send() calls?
    options:
      - "To make the code longer"
      - "So message content and per-channel/locale formatting are separated from delivery logic and reusable (SRP)"
      - "Because channels cannot accept strings"
      - "To force all channels to send identical text"
    answer: 1
    explanation: |
      A Template separates content/formatting (HTML email vs 160-char SMS vs locale)
      from delivery, so channels stay focused on transport and templates are reusable
      and editable independently — Single Responsibility.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-notification-system-035
    difficulty: advanced
    tags: [chain, decorator, trade-off]
    question: |
      Rate-limit, metrics, and logging must each wrap a channel and can be combined in
      any order. Compared to editing the channel, what does stacking decorators buy you?
    options:
      - "It guarantees lower latency"
      - "It removes the need for interfaces"
      - "It makes the channels stateful"
      - "Each concern is a separate, independently testable class, composable in any order without modifying channels (SRP + OCP)"
    answer: 3
    explanation: |
      Decorators isolate each cross-cutting concern into its own class that can be
      composed in any order and tested alone, all without touching the underlying
      channel — Single Responsibility plus Open/Closed.
    ref: "concepts.md#code-skeleton"

  - id: design-notification-system-036
    difficulty: intermediate
    tags: [multiplicity, class-diagram]
    question: |
      In the class diagram, what is the multiplicity between Topic and Subscriber?
    options:
      - "One topic to many subscribers, and a subscriber may follow many topics"
      - "One topic to exactly one subscriber"
      - "One subscriber to exactly one topic"
      - "They have no relationship"
    answer: 0
    explanation: |
      A topic fans out to many subscribers, and a subscriber can register interest in
      many topics — a many-to-many relationship mediated by the broker's routing map.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-notification-system-037
    difficulty: intermediate
    tags: [realization, uml]
    question: |
      In Mermaid, EmailChannel implements the NotificationChannel interface. Which arrow
      is correct?
    options:
      - "NotificationChannel <|.. EmailChannel (realization)"
      - "NotificationChannel <|-- EmailChannel (inheritance)"
      - "NotificationChannel --* EmailChannel (composition)"
      - "NotificationChannel ..> EmailChannel (dependency)"
    answer: 0
    explanation: |
      Implementing an interface is realization, drawn with a dashed line and hollow
      triangle: `NotificationChannel <|.. EmailChannel`. Solid triangle (<|--) is class
      inheritance; --* is composition; ..> is a dependency.
    ref: "concepts.md#class-diagram"

  - id: design-notification-system-038
    difficulty: advanced
    tags: [template-method, trade-off]
    question: |
      When would forcing all channels under a Template Method AbstractChannel be the
      WRONG choice?
    options:
      - "When the channels share a validate→render→send→record skeleton"
      - "Whenever there is more than one channel"
      - "Template Method is always correct for channels"
      - "When the channels share almost no common steps, so the base class becomes an awkward catch-all — plain Strategy is cleaner"
    answer: 3
    explanation: |
      Template Method pays off only when steps genuinely share a skeleton. If channels
      diverge widely, a forced base class accumulates empty hooks and conditionals;
      plain Strategy (independent implementations) is cleaner. Match pattern to reality.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-notification-system-039
    difficulty: beginner
    tags: [noun-verb, method]
    question: |
      In noun/verb extraction, verbs like subscribe, publish, deliver, render, and
      retry should become primarily what?
    options:
      - "New standalone classes, one per verb"
      - "Methods on the classes identified from the nouns"
      - "Enum values"
      - "Fields on the Notification object"
    answer: 1
    explanation: |
      Verbs map to behavior — methods on the entities pulled from the nouns
      (subscribe/publish on the broker, deliver/render on channels, retry on the
      service). Turning every verb into its own class over-fragments the design.
    ref: "concepts.md#noun-and-verb-object-identification"

  - id: design-notification-system-040
    difficulty: intermediate
    tags: [preferences, extensibility]
    question: |
      Adding "quiet hours" (no notifications 10pm-7am) should ideally require:
    options:
      - "A new subclass of every channel"
      - "Editing the broker's publish loop"
      - "A field and check on UserPreferences consulted by the service filter — no channel changes"
      - "A new NotificationService per timezone"
    answer: 2
    explanation: |
      Quiet hours are user preference data. Store the window on UserPreferences and let
      the service's filter honor it (CRITICAL priority may override). Channels and the
      broker need no changes.
    ref: "concepts.md#extensibility"

  - id: design-notification-system-041
    difficulty: advanced
    tags: [concurrency, race]
    question: |
      Two threads publish the same notification id concurrently and both pass a naive
      "if not already sent, send" check before either records the send. What is this?
    options:
      - "A check-then-act race that can double-send; fix with an atomic putIfAbsent/compareAndSet on the sent-set or per-id locking"
      - "A safe optimization"
      - "A ConcurrentModificationException"
      - "A memory leak"
    answer: 0
    explanation: |
      Separate check and act steps race: both threads see "not sent" and both send.
      Make the dedup atomic (e.g., ConcurrentHashMap.putIfAbsent or a CAS on the
      sent-set) or lock per notification id so exactly one wins.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-notification-system-042
    difficulty: intermediate
    tags: [factory, open-closed]
    question: |
      After adding Strategy + Factory for channels, adding a new channel type touches
      which existing code?
    options:
      - "The NotificationService.send() method and the broker"
      - "Every existing channel class"
      - "The Subscriber interface"
      - "Only the ChannelFactory (one case) plus the new channel class"
    answer: 3
    explanation: |
      The service depends only on the NotificationChannel interface, so it is unchanged.
      Only the factory (which maps type→channel) gains one case, alongside the new
      class — the minimal, Open/Closed-friendly footprint.
    ref: "concepts.md#extensibility"

  - id: design-notification-system-043
    difficulty: beginner
    tags: [observer, definition]
    question: |
      In the Observer pattern applied here, what is the "subject"?
    options:
      - "The channel provider"
      - "The object that maintains the list of subscribers and notifies them on an event (the broker or a per-topic subject)"
      - "The Notification value object"
      - "The template engine"
    answer: 1
    explanation: |
      The subject is the observable that holds registered observers and calls their
      update/onNotification method when its state changes or an event fires — here the
      NotificationBroker (or a per-topic subject).
    ref: "concepts.md#observer-vs-pub-sub-broker"

  - id: design-notification-system-044
    difficulty: advanced
    tags: [push-pull, observer]
    question: |
      In Observer, "push" delivers full data in onNotification(Notification) while
      "pull" passes a reference and lets the subscriber fetch what it needs. What is a
      trade-off of push?
    options:
      - "Push makes subscribers unable to be notified"
      - "Push requires a message broker"
      - "Push sends all data even to subscribers that need only part of it, coupling the payload shape to every subscriber"
      - "Push is only possible with SMS"
    answer: 2
    explanation: |
      Push hands every subscriber the full notification payload even when a subscriber
      needs only a slice, coupling all subscribers to that payload shape. Pull lets each
      subscriber query only what it needs but adds a round-trip and back-reference.
    ref: "concepts.md#observer-vs-pub-sub-broker"

  - id: design-notification-system-045
    difficulty: intermediate
    tags: [immutability, notification]
    question: |
      Why model Notification as an immutable value object?
    options:
      - "So it can be safely shared across the worker pool and multiple channels without synchronization or accidental mutation"
      - "To allow channels to edit it during delivery"
      - "Because immutable objects are always smaller"
      - "To prevent it from being logged"
    answer: 0
    explanation: |
      A single Notification is fanned out to many channels/threads. Making it immutable
      means no thread can mutate shared state, so it is safe to share without locking
      and cannot be corrupted mid-delivery.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-notification-system-046
    difficulty: advanced
    tags: [decorator-order, semantics]
    question: |
      Wrapping as RateLimitedChannel(RetryingChannel(EmailChannel)) vs.
      RetryingChannel(RateLimitedChannel(EmailChannel)) can behave differently. Why?
    options:
      - "Decorator order never matters"
      - "Only the innermost decorator runs"
      - "Java forbids nesting decorators more than twice"
      - "Order determines whether retries are counted against the rate limit or the limit is checked once around all retries"
    answer: 3
    explanation: |
      Decorators form a pipeline, so order changes semantics: limiter-outside-retry
      checks the limit once and retries freely inside; retry-outside-limiter re-checks
      the limit on each attempt. Choosing order is a real design decision to state.
    ref: "concepts.md#code-skeleton"

  - id: design-notification-system-047
    difficulty: intermediate
    tags: [service, orchestration]
    question: |
      What is the primary responsibility of NotificationService (as opposed to a
      channel or the broker)?
    options:
      - "To open TCP sockets to providers"
      - "To orchestrate delivery for a user: filter by preferences, pick channels, render, send, and apply retry"
      - "To store the subscriber-to-topic map"
      - "To define the Notification data shape"
    answer: 1
    explanation: |
      The service is the orchestrator: it resolves preferences, selects enabled
      channels, triggers rendering, dispatches, and applies the retry policy. Routing
      lives in the broker; transport lives in channels; data shape in Notification.
    ref: "concepts.md#responsibilities-and-relationships"

  - id: design-notification-system-048
    difficulty: advanced
    tags: [fail-open, edge-case]
    question: |
      If the preference store is temporarily unreachable when sending a routine
      marketing notification, a reasonable default is to:
    options:
      - "Send on all channels regardless of preferences"
      - "Crash the service"
      - "Skip/defer the send (fail closed) rather than risk violating a user's opt-out, and log it"
      - "Delete the user's preferences"
    answer: 2
    explanation: |
      For non-critical messages, failing closed (skip/defer + log) avoids spamming a
      user who may have opted out — respecting consent when preference data is
      unavailable. State the fail-open vs fail-closed choice explicitly per message class.
    ref: "concepts.md#concurrency-and-edge-cases"
