topic: "Design a Text Editor (Undo/Redo)"
domain: lld-and-ood
topic_slug: design-text-editor
version: 1
questions:
  - id: design-text-editor-001
    difficulty: beginner
    tags: [patterns, command]
    question: |
      Which design pattern is the centerpiece of a text-editor undo/redo design, where each
      edit becomes an object that knows how to apply and reverse itself?
    options: ["Observer", "Singleton", "Adapter", "Command"]
    answer: 3
    explanation: |
      Command encapsulates each edit (insert/delete/replace) as an object with execute() and
      undo(). Undo becomes a uniform "pop the stack and call undo()," decoupling the editor
      from how each edit is applied or reversed. See dp-command.
    ref: "concepts.md#key-design-decisions-and-patterns"
  - id: design-text-editor-002
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      The interviewer says "design a text editor" and mentions nothing about multiple users.
      What is the correct scoping move for the LLD round?
    options: ["Design operational transformation and CRDT sync from the start, since editors are collaborative", "Scope to a single-user, single-document, in-memory editor and note that collaborative editing is an HLD concern", "Skip clarifying questions and start coding the buffer immediately, since a text editor's scope is self-evident", "Design for cloud persistence and a REST sync layer up front so the editor ports cleanly to the web later"]
    answer: 1
    explanation: |
      The machine-coding round grades single-machine OO design. State the boundary
      (single-user, in-process) and note that collaborative editing (OT/CRDTs, sync) is a
      system-design problem. Jumping to distributed concerns burns the clock on the wrong round.
    ref: "concepts.md#requirements-clarification"
  - id: design-text-editor-003
    difficulty: beginner
    tags: [undo-redo, stacks]
    question: |
      A user performs edit A, edit B, then undo (reverting B), then types a brand-new edit C.
      What happens to edit B in a correct undo/redo design?
    options: ["B stays available to redo, remaining on the redo stack alongside C", "B is pushed back onto the undo stack automatically", "B is dropped from redo: the new edit C clears the redo stack", "B and C are automatically merged into a single command"]
    answer: 2
    explanation: |
      Any brand-new edit clears the redo stack — you cannot redo into a history branch you
      diverged from. Forgetting this rule lets a stale redo re-apply against a document that
      has since changed, corrupting content.
    ref: "concepts.md#key-design-decisions-and-patterns"
  - id: design-text-editor-004
    difficulty: intermediate
    tags: [noun-verb, method]
    question: |
      Applying noun/verb extraction to "the user types text into a document at a cursor,"
      which candidate should be FILTERED OUT rather than made a class?
    options: ["Document — it owns the mutable text buffer and its length", "Cursor — it holds position and selection state", "Edit — each edit becomes a reversible Command object", "User — it is an actor outside the system boundary, not a class"]
    answer: 3
    explanation: |
      Noun extraction produces candidates; filtering is the graded skill. "User" is an actor
      that lives outside the system boundary, so it is not modeled as a class. Document,
      Cursor, and Edit all become real classes.
    ref: "concepts.md#nounverb-object-identification"
  - id: design-text-editor-005
    difficulty: intermediate
    tags: [noun-verb, method]
    question: |
      In the noun/verb pass, the word "text" (individual characters) appears throughout the
      requirements. How should it be modeled?
    options: ["As a first-class Character object, each glyph carrying its own behavior", "As a primitive (String / char[]) stored inside the buffer, not its own class", "As a Command subtype so each character can execute and undo itself", "As an external actor sitting outside the system boundary"]
    answer: 1
    explanation: |
      Not every noun becomes a class. "Text" is a primitive — a field (String/char[]/StringBuilder)
      inside the Document, not a first-class object. Promoting every character to an object is
      gold-plating that fails a time-boxed round.
    ref: "concepts.md#nounverb-object-identification"
  - id: design-text-editor-006
    difficulty: intermediate
    tags: [noun-verb, command]
    question: |
      During noun/verb extraction, why is "edit" promoted to arguably the MOST important
      abstraction even though it reads like a mere verb?
    options: ["Because undo/redo hang off it: modeling each edit as a Command object is what makes undo/redo clean", "Because edits are the only nouns that appear anywhere in the requirements text", "Because every edit must be persisted to disk before the next one can run", "Because the interviewer always opens the discussion by asking about edits first"]
    answer: 0
    explanation: |
      The whole design turns on treating each edit as a Command with execute/undo. Overlooking
      "edit" as just a verb and failing to objectify it is the classic miss that forces a
      switch-based undo later.
    ref: "concepts.md#nounverb-object-identification"
  - id: design-text-editor-007
    difficulty: intermediate
    tags: [command, undo]
    question: |
      A DeleteCommand removes 5 characters at position 10. What must it capture so that undo()
      can restore the document exactly?
    options: ["Only the start position and the length of the removed range", "The actual deleted text (captured at execute time) so undo can re-insert it", "A full snapshot of the entire document taken before the delete", "Nothing — undo can recompute the text from the cursor"]
    answer: 1
    explanation: |
      A delete is only reversible if the command remembers WHAT it deleted. Capturing the
      removed text at execute time lets undo() re-insert it. Position+length alone cannot
      reconstruct the characters; a full snapshot is wasteful for a small delete.
    ref: "concepts.md#code-skeleton"
  - id: design-text-editor-008
    difficulty: advanced
    tags: [command, memento, trade-off]
    question: |
      For a text editor where a user types thousands of single characters, why are Command
      deltas usually preferred over Memento snapshots for undo?
    options: ["Deltas store only the change (O(edit size)) while snapshotting the whole buffer each keystroke is O(document size) memory", "Snapshots are impossible to implement in Java because objects cannot be deep-copied at runtime", "Deltas are always faster to restore than any snapshot in every possible case, regardless of undo depth", "Mementos cannot support redo because a snapshot only records a single point in time"]
    answer: 0
    explanation: |
      Typing produces many tiny edits. A delta stores just pos + inserted/deleted text; a
      Memento stores the whole document state per snapshot, which is wasteful per keystroke.
      Memento shines when an inverse is hard to express or as periodic checkpoints.
    ref: "concepts.md#key-design-decisions-and-patterns"
  - id: design-text-editor-009
    difficulty: advanced
    tags: [memento, trade-off]
    question: |
      When is Memento (snapshot) undo the BETTER choice over Command (delta) undo?
    options: ["When edits are tiny and extremely frequent, such as single-character keystrokes", "When memory is the single tightest constraint in the whole system", "When an operation's inverse is hard to express as a delta, or as a periodic checkpoint", "Never — command deltas strictly dominate mementos in all scenarios"]
    answer: 2
    explanation: |
      Memento trades memory for simplicity: it captures whole state, so it needs no inverse
      logic. That pays off when computing a delta's inverse is hard, or when you want periodic
      checkpoints to bound replay cost. Many editors combine deltas + occasional snapshots.
    ref: "concepts.md#key-design-decisions-and-patterns"
  - id: design-text-editor-010
    difficulty: intermediate
    tags: [memento, encapsulation]
    question: |
      In the Memento pattern applied here, what is the relationship between Document and
      CommandHistory (the caretaker)?
    options: ["The Document produces a Memento; the caretaker stores and returns it but cannot read or mutate its internals", "The caretaker reads and edits the memento's internal state directly whenever it needs to", "The Memento holds a live reference and mutates the Document's text whenever it wants", "The caretaker constructs the Memento from scratch by reading the document's fields"]
    answer: 0
    explanation: |
      Memento preserves encapsulation: the originator (Document) creates the snapshot and is
      the only one who can interpret it; the caretaker just holds and hands it back. This is
      exactly why Memento exists rather than exposing document internals. See dp-memento.
    ref: "concepts.md#key-design-decisions-and-patterns"
  - id: design-text-editor-011
    difficulty: advanced
    tags: [composite, macro]
    question: |
      A "record macro" feature must let a sequence of edits be undone as a single step. Which
      pattern fits, and how does undo work?
    options: ["Composite (MacroCommand): it is-a Command holding child commands; execute runs forward, undo runs children in reverse order", "Observer: the macro publishes change events, and undo works by notifying every registered listener in turn", "Singleton: a single global macro instance records edits and undoes them across the whole editor", "Adapter: it adapts each raw command into the interface the command history stack expects to store"]
    answer: 0
    explanation: |
      MacroCommand implements Command and holds a list of sub-commands. execute() runs them in
      order; undo() runs them in REVERSE order. Because it is a Command, the history treats a
      macro exactly like a single edit. See dp-composite.
    ref: "concepts.md#key-design-decisions-and-patterns"
  - id: design-text-editor-012
    difficulty: intermediate
    tags: [composite, ordering]
    question: |
      A MacroCommand executed commands [A, B, C] in that order. In what order must undo()
      reverse them?
    options: ["A, B, C", "C, B, A", "B, A, C", "Order does not matter"]
    answer: 1
    explanation: |
      Undo must reverse the effects in the opposite order they were applied: C, B, A. Later
      edits may depend on positions created by earlier ones, so undoing forward would corrupt
      the document. Reverse-order undo is the defining behavior of a composite command.
    ref: "concepts.md#code-skeleton"
  - id: design-text-editor-013
    difficulty: intermediate
    tags: [command, roles]
    question: |
      In the Command-pattern roles for this editor, what role does TextEditor play?
    options: ["The receiver that carries out the raw low-level text mutation on the buffer", "The concrete command that stores its own edit data and inverse", "The memento that snapshots the entire document state for restore", "The invoker that creates commands, executes them, and submits them to history"]
    answer: 3
    explanation: |
      TextEditor is the invoker: it builds a Command, triggers execute(), and hands it to the
      CommandHistory. The Document is the receiver (raw mutation); the Command subtypes are the
      concrete commands. Clean role separation is the SRP payoff.
    ref: "concepts.md#code-skeleton"
  - id: design-text-editor-014
    difficulty: intermediate
    tags: [command, roles, receiver]
    question: |
      Which class acts as the "receiver" that actually performs the low-level text mutation
      when a command executes?
    options: ["CommandHistory", "Document / TextBuffer", "Caret", "Clipboard"]
    answer: 1
    explanation: |
      The Document (TextBuffer) is the receiver: commands call doc.insert()/doc.delete() to
      mutate the actual text. Commands know WHAT to do and how to reverse it; the Document
      knows HOW to change the bytes. This split keeps each class single-purpose.
    ref: "concepts.md#responsibilities-and-relationships-crc"
  - id: design-text-editor-015
    difficulty: intermediate
    tags: [srp, caret]
    question: |
      Why is Caret modeled as its own class instead of just adding a position field to Document?
    options: ["Because the Java language forbids storing an integer position field directly on the Document class", "Because the caret must be implemented as a process-wide Singleton shared across every open document window", "Single Responsibility: the document owns text, the caret owns position/selection with its own invariants (clamp to [0,length])", "To make the document fully immutable so that its stored text can never change after construction"]
    answer: 2
    explanation: |
      Position + selection is real state with its own invariants (stay within bounds, anchor +
      caret for selection). Keeping it separate respects SRP: Document changes for text reasons,
      Caret changes for position/selection reasons.
    ref: "concepts.md#responsibilities-and-relationships-crc"
  - id: design-text-editor-016
    difficulty: advanced
    tags: [open-closed, extensibility]
    question: |
      The interviewer asks you to add a new "ToUpperCase on selection" edit. In a Command-based
      design, what changes?
    options: ["A new class implementing Command is added; the editor and history are untouched (Open-Closed)", "A switch statement inside TextEditor.undo() gains a new case for the upper-case op", "CommandHistory must be rewritten so its stacks can handle the new upper-case op", "Document must expose a new public undo method dedicated to the upper-case edit"]
    answer: 0
    explanation: |
      New edit type = new Command implementation. The invoker and history already speak the
      Command interface, so tested code never reopens. This is Open-Closed in action — the
      whole reason to objectify edits instead of switching on an operation enum.
    ref: "concepts.md#extensibility"
  - id: design-text-editor-017
    difficulty: advanced
    tags: [anti-pattern, undo]
    question: |
      What is the main problem with implementing undo as a single method that switches on an
      enum recording "the last operation type" and manually reverses it?
    options: ["It re-couples the editor to every edit type and reopens tested code for each new operation, violating Open-Closed", "It consumes too little memory to reliably record the full operation history for deep undo", "It cannot support redo at all, because a single enum only records the last operation", "It runs faster at execution time but becomes considerably harder to read and maintain over time"]
    answer: 0
    explanation: |
      A switch-on-operation-type undo means every new edit forces edits to the editor's tested
      undo logic. Command avoids this by making each edit responsible for its own reversal, so
      adding an edit type adds a class instead of a case.
    ref: "concepts.md#responsibilities-and-relationships-crc"
  - id: design-text-editor-018
    difficulty: intermediate
    tags: [undo-redo, mechanics]
    question: |
      In the two-stack design, what exactly happens when the user hits Undo?
    options: ["Pop the redo stack, call execute() on that command, then push it to the undo stack", "Pop the undo stack, call undo() on that command, push it to the redo stack", "Clear both the undo and redo stacks entirely, resetting all history", "Pop the undo stack and discard the command permanently"]
    answer: 1
    explanation: |
      Undo pops the most recent command off the undo stack, calls its undo(), and pushes it
      onto the redo stack so it can be re-applied. Redo is the mirror: pop redo, execute(),
      push back to undo. Commands move between stacks, they are not discarded.
    ref: "concepts.md#code-skeleton"
  - id: design-text-editor-019
    difficulty: intermediate
    tags: [strategy, search]
    question: |
      To support plain-substring, regex, and case-insensitive find without touching the editor,
      which pattern applies?
    options: ["Command (encapsulate an edit)", "Memento (whole-state snapshot)", "Strategy (SearchStrategy)", "Composite (macro command tree)"]
    answer: 2
    explanation: |
      Search algorithm is an axis of variation. A SearchStrategy interface lets each algorithm
      be swapped independently of the editor. Replace-all then becomes a MacroCommand of
      ReplaceCommands. See dp-strategy.
    ref: "concepts.md#key-design-decisions-and-patterns"
  - id: design-text-editor-020
    difficulty: advanced
    tags: [iterator, buffer]
    question: |
      You want rendering and search code to walk the buffer without knowing whether it is an
      array of lines, a gap buffer, or a rope underneath. Which pattern fits?
    options: ["Singleton — a single global buffer-accessor object shared everywhere", "Factory — construct a fresh buffer instance for every traversal request", "Observer — publish a change event to listeners on every character read", "Iterator — expose a char/line iterator that hides the underlying structure"]
    answer: 3
    explanation: |
      Iterator decouples traversal from the concrete container, so clients loop over characters
      or lines regardless of the internal representation. This lets you swap the buffer
      implementation later without touching consumers. See dp-iterator.
    ref: "concepts.md#key-design-decisions-and-patterns"
  - id: design-text-editor-021
    difficulty: advanced
    tags: [buffer, dsa, cross-ref]
    question: |
      Using a plain StringBuilder / array-of-lines, why does inserting in the middle of a large
      document become expensive, and what do you name as the production fix?
    options: ["It is already O(1) per insert, so no specialized data structure or fix is needed", "Mid-document insert is O(n) due to shifting; gap buffer / piece table / rope give better edit complexity (cross-ref dsa-coding)", "It is O(log n) already, since StringBuilder is internally a balanced tree of chunks", "The fix is to store every character in a HashMap keyed by its integer index"]
    answer: 1
    explanation: |
      Inserting into a contiguous buffer shifts everything after the point (O(n)). Editor-grade
      structures — gap buffer, piece table, rope — make edits amortized-O(1) or O(log n). Name
      them and cross-ref dsa-coding; don't implement a rope in a 45-minute round.
    ref: "concepts.md#concurrency-and-edge-cases"
  - id: design-text-editor-022
    difficulty: intermediate
    tags: [relationships, composition]
    question: |
      What kind of relationship best describes TextEditor and its Document (the document lives
      and dies with the editor)?
    options: ["Aggregation — a shared document that outlives the editor", "Inheritance — TextEditor is a subclass extending Document", "Dependency only — no stored reference to the document is held", "Composition — the document's lifetime is bound to the editor"]
    answer: 3
    explanation: |
      A 1:1, lifetime-bound ownership is composition (filled-diamond, *--): the document is
      created with and destroyed with the editor. Aggregation (o--) would imply a shared object
      that outlives the owner; inheritance would wrongly make the editor a kind of document.
    ref: "concepts.md#responsibilities-and-relationships-crc"
  - id: design-text-editor-023
    difficulty: intermediate
    tags: [relationships, aggregation]
    question: |
      CommandHistory holds Command objects on its undo/redo stacks. Which relationship and
      multiplicity is most accurate?
    options: ["Aggregation, one-to-many (it references many commands but does not own them for life)", "Composition, one-to-one (each command is owned by the history for its whole life)", "Inheritance (CommandHistory extends the base Command type it stores)", "No relationship — the history and its commands are entirely independent"]
    answer: 0
    explanation: |
      The history references many commands (one-to-many) but the commands are not owned
      exclusively for the history's whole life — they move between stacks and can be dropped.
      That is aggregation (o--), the looser has-a.
    ref: "concepts.md#responsibilities-and-relationships-crc"
  - id: design-text-editor-024
    difficulty: intermediate
    tags: [uml, class-diagram]
    question: |
      In the class diagram, which UML arrow correctly represents "InsertCommand realizes the
      Command interface"?
    options: ["--|>", "--*", "..>", "..|>"]
    answer: 3
    explanation: |
      Realization (a class implementing an interface) uses a dashed line with a hollow triangle:
      ..|>. Solid hollow-triangle (--|>) is class inheritance; --* is composition; ..> is a
      dependency.
    ref: "concepts.md#class-diagram"
  - id: design-text-editor-025
    difficulty: intermediate
    tags: [uml, class-diagram]
    question: |
      Which UML arrow represents MacroCommand composing its child Command objects?
    options: ["..|> realization", "..> dependency", "--* composition", "--|> inheritance"]
    answer: 2
    explanation: |
      A MacroCommand owns its child commands as parts of a whole, so composition (--*) is the
      right notation. Realization would be for implementing an interface; the child-holding
      relationship is composition.
    ref: "concepts.md#class-diagram"
  - id: design-text-editor-026
    difficulty: beginner
    tags: [clipboard, cut-copy-paste]
    question: |
      What is the Clipboard's single responsibility in this design?
    options: ["To store the editor's undo/redo history stacks for the whole session", "To hold the last cut/copied text so paste can retrieve it (a shared sink/source)", "To manage the caret position and the current text-selection range", "To perform substring and regex search across the whole document"]
    answer: 1
    explanation: |
      The Clipboard just holds copied/cut content (setContent/getContent). Cut = copy to
      clipboard + delete; paste = insert clipboard content. Keeping it a tiny separate object
      respects SRP and keeps the editor's paste implementation trivial.
    ref: "concepts.md#responsibilities-and-relationships-crc"
  - id: design-text-editor-027
    difficulty: advanced
    tags: [cut-paste, macro, atomicity]
    question: |
      Typing over a non-empty selection (or a "replace range") should undo atomically. What is
      the cleanest way to model it?
    options: ["One ReplaceCommand (or a MacroCommand of delete+insert) so a single undo restores the prior state", "Two independent commands pushed separately, so undo reverses them one at a time", "A fresh Memento snapshot of the whole document taken on every keystroke", "A switch in TextEditor.undo() that special-cases the replace-range operation"]
    answer: 0
    explanation: |
      Replacing a selection is conceptually one edit. Modeling it as a single ReplaceCommand
      (or a MacroCommand wrapping delete+insert) makes it undo/redo as one atomic step, avoiding
      a half-reverted document from a mid-operation undo.
    ref: "concepts.md#api-and-method-signatures"
  - id: design-text-editor-028
    difficulty: advanced
    tags: [coalescing, extensibility]
    question: |
      A follow-up asks: typing a whole word should undo in one step, not per keystroke. Which
      approach keeps the design open-closed?
    options: ["Add a large switch statement inside CommandHistory that special-cases word typing", "Store a full-document Memento snapshot after every single character is typed", "Disable the undo feature entirely while the user is actively typing a word", "Give InsertCommand a canMergeWith/mergeWith so adjacent inserts within a time window merge before being pushed"]
    answer: 3
    explanation: |
      Coalescing lives on the command (or an editor-side buffer): consecutive inserts at
      adjacent positions within a time window merge into one command before pushing. The merge
      logic sits on the command, not in a switch, keeping the history untouched.
    ref: "concepts.md#extensibility"
  - id: design-text-editor-029
    difficulty: intermediate
    tags: [edge-cases, empty-stack]
    question: |
      What should undo() do when the undo stack is empty?
    options: ["Throw an EmptyStackException", "Clear the redo stack", "Undo the oldest edit instead", "Be a safe no-op (do nothing)"]
    answer: 3
    explanation: |
      Undo on an empty stack (and redo on an empty redo stack) must be safe no-ops. Users press
      undo repeatedly; throwing would be hostile. This is a standard edge case to state
      explicitly.
    ref: "concepts.md#concurrency-and-edge-cases"
  - id: design-text-editor-030
    difficulty: advanced
    tags: [edge-cases, redo-invalidation]
    question: |
      Why is failing to clear the redo stack on a new edit a correctness bug, not just a UX quirk?
    options: ["It only leaks a small amount of memory by retaining dead redo commands", "It merely makes each undo operation run a little more slowly than before", "A stale redo can re-apply a command against a document that has since diverged, corrupting content", "It has no real effect on correctness and is a purely cosmetic concern"]
    answer: 2
    explanation: |
      After a new edit, the document has diverged from the state the redo commands assumed.
      Re-executing a stale redo command (e.g., inserting at a now-invalid position) can throw or
      silently corrupt the buffer. Clearing redo on any new edit prevents this.
    ref: "concepts.md#concurrency-and-edge-cases"
  - id: design-text-editor-031
    difficulty: advanced
    tags: [concurrency, autosave]
    question: |
      A background autosave thread reads the document while the UI thread edits it. What is the
      correct concern to raise?
    options: ["Guard the document (and the command stacks) with a lock or read a consistent snapshot, since concurrent read+mutate can corrupt state", "Nothing needs guarding, since concurrent reads of the buffer are always perfectly safe", "Make Document fully immutable so no locking is ever required, but drop undo support entirely", "Run autosave on the same UI thread and simply block the user from editing during each save"]
    answer: 0
    explanation: |
      Concurrent read during mutation risks torn reads/corruption; and the command stacks must
      be mutated under the same lock or an undo can race an in-flight edit. Locking or a
      copy-on-read snapshot addresses it. Start single-threaded, then upgrade when asked.
    ref: "concepts.md#concurrency-and-edge-cases"
  - id: design-text-editor-032
    difficulty: advanced
    tags: [solid, dip]
    question: |
      CommandHistory pushes and pops objects it only knows as the Command interface, never as
      InsertCommand or DeleteCommand. Which SOLID principle does this best illustrate?
    options: ["Single Responsibility — each class has exactly one reason to change", "Dependency Inversion — depend on the Command abstraction, not concrete edit types", "Interface Segregation — clients depend only on the methods they actually use", "Liskov Substitution — subtypes must honor their base type's contract"]
    answer: 1
    explanation: |
      Depending on the Command abstraction rather than concrete edit classes is Dependency
      Inversion. It is also why a MacroCommand or a brand-new edit type drops into the history
      with no changes.
    ref: "concepts.md#solid-in-this-design"
  - id: design-text-editor-033
    difficulty: advanced
    tags: [solid, lsp]
    question: |
      MacroCommand can be used anywhere the history expects a single Command, and undo() after
      execute() restores the exact prior state. Which principle does this uphold?
    options: ["Interface Segregation — clients depend only on the small interface methods they use", "Open-Closed — open for extension but closed for modification without edits", "Single Responsibility — each class should have exactly one reason to change", "Liskov Substitution — a MacroCommand is substitutable for a single Command and honors the execute/undo contract"]
    answer: 3
    explanation: |
      Liskov Substitution requires subtypes to honor the base contract. A MacroCommand must be
      usable wherever a Command is, and its undo must fully reverse its execute — otherwise the
      history's assumptions break.
    ref: "concepts.md#solid-in-this-design"
  - id: design-text-editor-034
    difficulty: advanced
    tags: [solid, isp]
    question: |
      Command exposes only execute() and undo(); the caret's selection API and the document's
      mutation API are separate interfaces. Which principle is at work?
    options: ["Dependency Inversion — depend on abstractions rather than concretes", "Interface Segregation — clients depend only on the methods they use", "Open-Closed — extend behavior without modifying already-tested code", "Single Responsibility — each class has exactly one reason to change"]
    answer: 1
    explanation: |
      Interface Segregation keeps interfaces small and role-specific: a read-only text consumer
      isn't forced to depend on mutation methods, and the history only sees execute/undo. Fat
      interfaces would couple clients to methods they never call.
    ref: "concepts.md#solid-in-this-design"
  - id: design-text-editor-035
    difficulty: intermediate
    tags: [solid, srp]
    question: |
      Which split correctly reflects Single Responsibility across the core classes?
    options: ["Document handles text storage AND the undo/redo history AND the clipboard buffer all at once", "TextEditor performs every operation itself while the other classes are passive data holders", "Document = text storage, Command subtypes = reversible edit logic, CommandHistory = sequencing, Caret = position, Clipboard = paste buffer", "CommandHistory stores the document text while the Document itself sequences undo/redo"]
    answer: 2
    explanation: |
      Each class has one reason to change: storage, reversible edit logic, history sequencing,
      position, and paste buffer are five distinct responsibilities in five classes. Collapsing
      them into a god-editor is the anti-pattern SRP guards against.
    ref: "concepts.md#solid-in-this-design"
  - id: design-text-editor-036
    difficulty: intermediate
    tags: [extensibility, history-bound]
    question: |
      To bound memory, the interviewer asks to cap undo history at the last 100 edits. What is
      the design consequence to call out?
    options: ["Redo becomes completely impossible once any history cap is imposed", "The whole Command pattern must be abandoned in favor of a flat operation log", "Use a bounded deque/ring buffer that drops the oldest command; dropped edits become non-undoable", "Every edit must now be stored as a full-document Memento snapshot"]
    answer: 2
    explanation: |
      Cap the undo stack (bounded deque or ring buffer), evicting the oldest when full. The
      honest trade-off to state: edits older than the cap can no longer be undone. This is a
      simple, realistic bound.
    ref: "concepts.md#extensibility"
  - id: design-text-editor-037
    difficulty: advanced
    tags: [extensibility, find-replace]
    question: |
      "Replace all" replaces 40 occurrences and must undo as one action. How do you model it?
    options: ["40 separate ReplaceCommands pushed onto the undo stack individually, one per occurrence", "A MacroCommand wrapping 40 ReplaceCommands so the whole replace-all undoes in one step", "A single Memento snapshot of the whole document taken just before the replace-all runs", "A dedicated switch case added inside TextEditor.undo() that special-cases the replace-all op"]
    answer: 1
    explanation: |
      Composite again: wrap the 40 ReplaceCommands in one MacroCommand. execute() applies all,
      undo() reverses all (in reverse order), and the history sees a single undoable unit. This
      is the payoff of the Composite + Command combination.
    ref: "concepts.md#extensibility"
  - id: design-text-editor-038
    difficulty: expert
    tags: [collaborative, hld-boundary]
    question: |
      Asked to "make the editor collaborative with multiple simultaneous users," what is the
      right LLD-round response?
    options: ["Implement full operational transformation and CRDT conflict resolution live on the whiteboard right away", "Refuse the request outright, insisting that collaborative multi-user editing simply cannot be designed", "Abandon the Command model and switch the whole editor to Memento-only snapshot undo to enable sharing", "Recognize the HLD boundary: OT/CRDTs, sync, and conflict resolution are system-design; keep the local model as Commands and point to system-design topics"]
    answer: 3
    explanation: |
      Real-time multi-user editing (operational transformation, CRDTs, network sync, conflict
      resolution) is distributed-systems territory. Acknowledge it as an HLD concern, cross-ref
      system-design, and keep the LLD answer at "each local edit is still a Command."
    ref: "concepts.md#extensibility"
  - id: design-text-editor-039
    difficulty: advanced
    tags: [observer, syntax-highlighting]
    question: |
      Syntax highlighting must recompute token styling whenever the document changes, without
      the buffer knowing about the renderer. Which pattern fits?
    options: ["Observer — the highlighter subscribes to document-change events", "Singleton — one global renderer instance repaints the styling for everyone", "Command — wrap each highlight recompute as an executable, undoable edit", "Memento — snapshot the styled tokens after every single change event"]
    answer: 0
    explanation: |
      Observer decouples the buffer from consumers of change events: the highlighter (and other
      listeners) react to document mutations without the document depending on them. Rendering
      stays a separate concern from storage. See dp-observer.
    ref: "concepts.md#extensibility"
  - id: design-text-editor-040
    difficulty: intermediate
    tags: [testing, design-payoff]
    question: |
      Why does splitting edits into Command objects make the editor easier to unit-test?
    options: ["It removes the need for tests entirely, since self-reversing commands are provably correct by construction", "Commands cannot be unit-tested in isolation; only the rendered UI can be exercised end-to-end", "Each command tests in isolation (apply, assert content, undo, assert restored); history tests use scripted fake commands", "It forces you into slow full-editor integration tests only, ruling out any focused unit test"]
    answer: 2
    explanation: |
      Isolated, self-describing commands are directly testable: execute then assert the buffer,
      undo then assert the original is restored. The history can be tested with fake commands.
      Testability is a concrete dividend of the split design.
    ref: "concepts.md#common-interview-follow-ups"
  - id: design-text-editor-041
    difficulty: beginner
    tags: [use-cases, actors]
    question: |
      In the Grokking UML-first approach, which is the PRIMARY actor for a single-user text
      editor?
    options: ["The User (editor operator) who types, edits, and triggers undo/redo", "The backing database that persists every keystroke to durable storage as the primary driver", "The Command interface, which initiates each edit session and drives the editor's use cases", "The JVM garbage collector, since it reclaims discarded commands and thus drives the workflow"]
    answer: 0
    explanation: |
      The primary actor is the human operator who types, deletes, selects, cuts/copies/pastes,
      and triggers undo/redo. Naming the actor and use-cases first (before classes) is the
      UML-first method. Plugins/macros and autosave timers are secondary actors.
    ref: "concepts.md#use-cases-and-actors"
  - id: design-text-editor-042
    difficulty: intermediate
    tags: [command, insert-undo]
    question: |
      An InsertCommand inserted the string "cat" (3 chars) at position 7. What is the correct
      body of its undo()?
    options: ["doc.insert(7, \"cat\") again, re-applying the very same insert at position 7", "doc.restore(previousSnapshot) from a full-document Memento captured before the insert", "doc.delete(7, 3) — delete the 3 characters it inserted", "doc.clear() the whole document and let the remaining commands rebuild it"]
    answer: 2
    explanation: |
      The inverse of inserting "cat" at position 7 is deleting 3 characters starting at 7. The
      command already knows its position and text, so it can invert itself with a simple delete
      — no snapshot needed.
    ref: "concepts.md#code-skeleton"
  - id: design-text-editor-043
    difficulty: intermediate
    tags: [api, contract]
    question: |
      What does TextEditor.paste() do in terms of the command model?
    options: ["Directly mutates the document buffer without any command object, so the paste can never be undone", "Creates a full-document Memento and replaces the entire document state with the clipboard contents", "Clears the undo stack first and then appends the clipboard text at the end of the document", "Reads clipboard content and inserts it at the caret (reusing an InsertCommand), making paste undoable like any edit"]
    answer: 3
    explanation: |
      Paste retrieves the clipboard text and inserts it at the caret — implemented by reusing
      the same InsertCommand path as typing. That makes paste a normal, undoable edit and avoids
      duplicating mutation logic.
    ref: "concepts.md#code-skeleton"
  - id: design-text-editor-044
    difficulty: advanced
    tags: [edge-cases, bounds]
    question: |
      A command captured position 50 / length 5, but by the time it is (re-)executed the buffer
      shrank to 30 characters. What must the design guard against?
    options: ["Out-of-bounds mutation: validate positions/lengths against current document length before applying", "Nothing — captured positions are always valid because the buffer only ever grows, never shrinks", "It should silently pad the document with trailing spaces up to the stale position before applying", "It should automatically switch that command from delta undo to Memento snapshot undo on the fly"]
    answer: 0
    explanation: |
      A stale command replayed against a changed buffer can index out of bounds. Insert/delete
      positions and lengths must be validated against the current length, and the caret clamped
      to [0, length]. This is why clearing redo on divergence matters too.
    ref: "concepts.md#concurrency-and-edge-cases"
  - id: design-text-editor-045
    difficulty: intermediate
    tags: [patterns, classification]
    question: |
      Classifying by GoF intent, Command, Memento, Strategy, and Iterator all belong to which
      category, while Composite belongs to another?
    options: ["Command/Memento/Strategy/Iterator are Creational; Composite is the lone Behavioral pattern here", "Command/Memento/Strategy/Iterator are Behavioral; Composite is Structural", "All five patterns are Structural, since they all describe how objects are assembled together", "All five patterns are Creational, since they all govern how the editor's objects get instantiated"]
    answer: 1
    explanation: |
      Command, Memento, Strategy, and Iterator are Behavioral (they concern algorithms and the
      assignment of responsibilities). Composite is Structural (it concerns how objects are
      assembled into tree structures). The dp-* topics own the full taxonomy.
    ref: "concepts.md#key-design-decisions-and-patterns"
  - id: design-text-editor-046
    difficulty: advanced
    tags: [memento, hybrid]
    question: |
      A production editor keeps per-keystroke deltas but also stores a full snapshot every 500
      edits. What is the rationale for this hybrid?
    options: ["Deltas keep per-edit memory tiny; periodic snapshots bound how far undo must replay/restore, capping worst-case cost", "Storing a full snapshot every 500 edits makes ordinary typing noticeably faster than deltas alone", "The periodic snapshots remove the need for a redo stack, since redo can rebuild from the checkpoint", "Insert commands physically cannot execute their inverse unless a backing Memento exists for them"]
    answer: 0
    explanation: |
      Pure deltas are memory-cheap but a deep undo may replay many; pure snapshots are simple
      but memory-heavy. Combining deltas with occasional checkpoints gives small per-edit cost
      while bounding the replay/restore distance — the best of both.
    ref: "concepts.md#key-design-decisions-and-patterns"
  - id: design-text-editor-047
    difficulty: intermediate
    tags: [relationships, dependency]
    question: |
      A concrete command (e.g., DeleteCommand) holds a reference to the Document so it can apply
      itself. Does the command OWN the document?
    options: ["Yes — it composes the document, so the buffer is created and destroyed with the command", "Yes — each command instantiates and owns its own private copy of the document to edit", "No — it holds a reference/association to a document it does not own; the editor owns the document", "There is no relationship at all; the command receives the text as a plain string argument each time"]
    answer: 2
    explanation: |
      The command depends on / associates with the Document (the receiver) to mutate it, but the
      TextEditor owns the single shared document. If each command owned its own document, edits
      would apply to different buffers — nonsense.
    ref: "concepts.md#responsibilities-and-relationships-crc"
  - id: design-text-editor-048
    difficulty: advanced
    tags: [concurrency, atomicity]
    question: |
      Under a coarse lock, why must a "replace = delete + insert" be a single MacroCommand
      rather than two separately-locked commands?
    options: ["To reduce memory, since one MacroCommand object is cheaper to store than two separate commands", "So a concurrent undo (or reader) cannot observe or act on a half-changed document between the delete and the insert", "Because a single MacroCommand executes measurably faster under the coarse lock than two commands", "It is not necessary; two independently-locked commands are always perfectly fine under any interleaving"]
    answer: 1
    explanation: |
      Multi-part edits must be atomic: if delete and insert are separate operations, an undo or
      a reader interleaving between them sees an inconsistent, half-edited document. Wrapping
      them in one MacroCommand (applied under one lock) preserves the invariant.
    ref: "concepts.md#concurrency-and-edge-cases"
  - id: design-text-editor-049
    difficulty: intermediate
    tags: [method, filtering]
    question: |
      What is the single most important skill the noun/verb technique is testing in an LLD
      interview?
    options: ["Listing as many nouns as possible from the prompt so that no candidate class is ever missed", "Memorizing the full GoF catalog so you can name the right pattern for every noun instantly", "Writing the fastest possible code once the nouns have been mechanically turned into classes", "FILTERING candidates: deciding which nouns become classes, which are primitives/fields, and which are actors outside the boundary"]
    answer: 3
    explanation: |
      Extraction is mechanical; the graded skill is judgment — filtering candidates into classes
      (Document), primitives/fields (text), and actors (User). Over-classing every noun produces
      bloated designs; under-classing (missing "edit") produces switch-based undo.
    ref: "concepts.md#nounverb-object-identification"
  - id: design-text-editor-050
    difficulty: advanced
    tags: [extensibility, meta]
    question: |
      For nearly every "now add feature X" follow-up in this problem, what is the meta-strategy
      that keeps the design open-closed?
    options: ["Add another case to the editor's central switch statement for each new feature that arrives", "Rewrite CommandHistory each time so its stacks can accommodate the newly requested feature", "Identify which existing seam it lands on — Command, Composite, Strategy, Memento, or Observer — and add a class instead of editing one", "Convert the entire undo/redo mechanism to full-document Memento snapshots for every new feature"]
    answer: 2
    explanation: |
      The design's value is that extensions map onto existing seams: a new edit → Command; a
      grouped edit → Composite; a new search → Strategy; a non-invertible op → Memento; a
      change reaction → Observer. You add a class rather than editing tested code — Open-Closed.
    ref: "concepts.md#extensibility"
