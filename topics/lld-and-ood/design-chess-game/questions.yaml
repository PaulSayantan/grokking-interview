topic: "Design a Chess Game"
domain: lld-and-ood
topic_slug: design-chess-game
version: 1
questions:
  - id: design-chess-game-001
    difficulty: beginner
    tags: [polymorphism, inheritance, ocp]
    question: |
      An interviewer asks you to design chess. Your colleague proposes a single
      Piece class with a `type` enum and a large switch statement inside
      `canMove`. What is the main design objection?
    options:
      - "Enums are slower than virtual method dispatch in Java"
      - "It violates the Open/Closed Principle: every new piece type requires editing the switch, and the switch tends to duplicate across other methods"
      - "Switch statements cannot access the Board object"
      - "Enums cannot store the piece's color"
    answer: 1
    explanation: |
      The switch centralizes every piece's rules in one method, so adding a piece
      type (or a fairy-chess variant) means modifying existing, tested code — an
      OCP violation. Worse, the same switch reappears in getValidMoves, rendering,
      and scoring. Polymorphic subclasses put each piece's behavior in one place;
      performance and enum mechanics are not the real issue.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-chess-game-002
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      In the first five minutes of a 45-minute chess design interview, which
      scoping move is MOST valuable?
    options:
      - "Confirm which special rules (castling, en passant, promotion, draw rules) are in scope, and state you'll design so they're additive"
      - "Ask whether the interviewer prefers Java or Python"
      - "Start drawing the full class diagram immediately to save time"
      - "Ask how many concurrent games the system must support"
    answer: 0
    explanation: |
      Chess's risk is rule surface area. Confirming which special rules matter —
      and committing to a design where they slot in later — shows time management
      and design foresight. Concurrent-game scale is an HLD question; language
      choice and diagram-first rushes don't reduce scope risk.
    ref: "concepts.md#requirements-clarification"

  - id: design-chess-game-003
    difficulty: beginner
    tags: [entities, responsibilities]
    question: |
      Which class should be the ONLY public entry point through which players
      submit moves?
    options:
      - "Board, since it owns the pieces"
      - "Cell, since it knows what piece sits on it"
      - "Game, which orchestrates turn order, validation, and status"
      - "Piece, since it knows its own movement rules"
    answer: 2
    explanation: |
      Game is the facade: it enforces whose turn it is, runs the validation
      pipeline, updates history and status. Exposing Board directly would let
      callers bypass turn order and check rules; Piece and Cell are lower-level
      collaborators.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-chess-game-004
    difficulty: intermediate
    tags: [composition, relationships, uml]
    question: |
      What is the correct relationship between Board and Cell in the chess design?
    options:
      - "Inheritance — Cell extends Board"
      - "Aggregation — Cells can be shared between multiple Boards"
      - "Dependency — Board only uses Cell as a method parameter"
      - "Composition — Board owns exactly 64 Cells whose lifetime is tied to the Board"
    answer: 3
    explanation: |
      Cells have no meaning or lifetime outside their board; the Board creates and
      owns them. That whole-part, tied-lifetime relationship is composition. If a
      Cell could outlive or be shared across boards it would be aggregation, but
      that is not the model here.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-chess-game-005
    difficulty: beginner
    tags: [inheritance, lsp]
    question: |
      King, Queen, Rook, Bishop, Knight, and Pawn all extend an abstract Piece.
      Why is this a legitimate use of inheritance rather than a code smell?
    options:
      - "It saves memory by sharing the color field"
      - "Java requires at least one abstract class per package"
      - "Each subtype IS-A piece and is substitutable anywhere a Piece is expected — all honor the same canMove contract with different geometry"
      - "Inheritance is always preferred over composition in interviews"
    answer: 2
    explanation: |
      This is textbook LSP-respecting inheritance: one axis of variation
      (movement geometry), a stable contract (canMove), and full substitutability.
      Board code calls piece.canMove(...) without knowing the concrete type.
      Memory sharing is incidental, and "inheritance always wins" is false —
      composition is the right call in many other problems.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-chess-game-006
    difficulty: intermediate
    tags: [null-object, anti-pattern, modeling]
    question: |
      To represent empty squares, a candidate creates an EmptyPiece subclass of
      Piece (Null Object pattern). Why does the guide recommend against this?
    options:
      - "Null Object is deprecated in modern Java"
      - "EmptyPiece would need a color, and neither WHITE nor BLACK is honest"
      - "It doubles the memory used by the board"
      - "Every movement and capture rule now needs 'is the target an EmptyPiece?' special cases — an empty Cell (null/Optional) is the honest model"
    answer: 3
    explanation: |
      Null Object works when the null case has sensible do-nothing behavior. Here
      emptiness is a property of the square, not a kind of piece: capture rules,
      path clearance, and attack detection would all need EmptyPiece branches.
      Modeling Cell with an optional Piece keeps the rules clean. (The color
      awkwardness is real but secondary.)
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-chess-game-007
    difficulty: intermediate
    tags: [layering, srp, validation]
    question: |
      In the layered validation model, which check belongs at the GAME layer
      rather than the Piece or Board layer?
    options:
      - "Whether a bishop's move stays on a diagonal"
      - "Whether the move would leave the mover's own king in check"
      - "Whether the squares between a rook and its destination are empty"
      - "Whether the destination square is on the 8x8 board"
    answer: 1
    explanation: |
      King safety requires whole-game context: simulate the move, then ask the
      board if the king's square is attacked. Diagonal geometry is Piece-layer,
      path clearance is Board-assisted, and bounds checking is basic input
      hygiene. Mixing king safety into Piece would couple pieces to game flow and
      violate SRP.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-chess-game-008
    difficulty: beginner
    tags: [api, signatures]
    question: |
      Why does the abstract method signature `canMove(Board board, Position from,
      Position to)` include the Board parameter?
    options:
      - "So pieces can modify the board when they move"
      - "So the piece can check whose turn it is"
      - "Because movement legality is context-dependent — path blocking and capture-target occupancy can't be derived from coordinates alone"
      - "To let pieces call Game.makeMove recursively"
    answer: 2
    explanation: |
      Except for the knight, every piece's legality depends on board state: sliding
      pieces need clear paths, and the pawn must distinguish a forward push (target
      empty) from a diagonal capture (target occupied). canMove should only READ
      the board; mutation and turn order live elsewhere.
    ref: "concepts.md#move-validation-pipeline"

  - id: design-chess-game-009
    difficulty: intermediate
    tags: [pawn, edge-cases, polymorphism]
    question: |
      Which piece most often exposes a weak canMove abstraction, and why?
    options:
      - "The pawn — its capture rule (diagonal, target occupied) differs from its movement rule (straight, target empty), so pure geometry is insufficient"
      - "The queen — it combines rook and bishop movement"
      - "The king — it can only move one square"
      - "The knight — its L-shape is hard to express mathematically"
    answer: 0
    explanation: |
      The pawn is the only piece whose capture squares differ from its movement
      squares, plus direction depends on color and the double-push depends on
      hasMoved. A signature without board access can't express it. The queen is
      just rook-OR-bishop geometry, and the knight is a one-liner (dr*dc == 2).
    ref: "concepts.md#move-validation-pipeline"

  - id: design-chess-game-010
    difficulty: intermediate
    tags: [knight, path-clearance]
    question: |
      During the validation pipeline, which piece correctly SKIPS the
      path-clearance check?
    options:
      - "The pawn, because it only moves one or two squares"
      - "The king, because it moves one square at a time"
      - "The rook, because its path is always a straight line"
      - "The knight, because it jumps over intervening pieces"
    answer: 3
    explanation: |
      The knight is the only piece that jumps: intervening pieces are irrelevant.
      The pawn's two-square advance DOES require the skipped square to be empty,
      and rooks/bishops/queens are exactly the sliding pieces that need
      isPathClear. The king moves one square so the question doesn't arise, but
      it isn't "skipping" a check that could apply.
    ref: "concepts.md#move-validation-pipeline"

  - id: design-chess-game-011
    difficulty: intermediate
    tags: [dry, sliding-pieces, design]
    question: |
      Rook, Bishop, and Queen all need "walk the line and check each intermediate
      square is empty" logic. What does the guide recommend to avoid writing this
      loop three times?
    options:
      - "Put the shared logic in Board.isPathClear (or a SlidingPiece intermediate class) and have the sliding pieces call it"
      - "Have Queen call both Rook.canMove and Bishop.canMove via static methods"
      - "Copy the loop into each class since each piece must be self-contained"
      - "Put the loop in Game.makeMove so pieces stay pure"
    answer: 0
    explanation: |
      The walk-the-line loop is a spatial query on the board, so Board.isPathClear
      is its natural home (an intermediate SlidingPiece class is also defensible).
      Static cross-calls between sibling classes create weird coupling, triplication
      violates DRY, and Game-level placement mixes geometry into orchestration.
    ref: "concepts.md#move-validation-pipeline"

  - id: design-chess-game-012
    difficulty: intermediate
    tags: [check-detection, simulation]
    question: |
      What is the cleanest general mechanism for enforcing "a move may not leave
      your own king in check"?
    options:
      - "Maintain a list of pinned pieces and forbid them from moving"
      - "Only run the check when the king itself moves"
      - "Simulate the move on the board, ask if the king's square is attacked, then revert"
      - "Ask each piece to declare whether it is currently defending the king"
    answer: 2
    explanation: |
      Simulate-and-test uniformly covers pinned pieces, the king stepping into
      attack, and failing to resolve an existing check — no special-case code.
      Pinned-piece bookkeeping is fragile (pins change every move), and checking
      only king moves misses pins entirely.
    ref: "concepts.md#check-checkmate-and-stalemate-detection"

  - id: design-chess-game-013
    difficulty: advanced
    tags: [checkmate, algorithm]
    question: |
      How does the recommended checkmate detection algorithm handle the three
      escape routes (move the king, capture the checker, block the check)?
    options:
      - "It only handles king moves; captures and blocks need separate handlers"
      - "It generates every pseudo-legal move for the side in check, simulates each, and declares mate only if none leaves the king safe — all three escapes fall out of the same loop"
      - "It codes each escape route as its own method and ORs the results"
      - "It asks the checking piece whether it can be captured"
    answer: 1
    explanation: |
      Generate-and-test is the robust approach: any legal escape — king move,
      capture, or interposition — shows up as a simulated move that leaves the
      king un-attacked. It even handles double check correctly for free (only
      king moves survive the test). Hand-coding the three cases separately is
      error-prone and still misses double-check subtleties.
    ref: "concepts.md#check-checkmate-and-stalemate-detection"

  - id: design-chess-game-014
    difficulty: intermediate
    tags: [stalemate, correctness]
    question: |
      Checkmate and stalemate detection share the "no legal move exists" loop.
      What distinguishes them, and why is the distinction a classic bug source?
    options:
      - "Stalemate only occurs when both players have bare kings"
      - "Stalemate requires the king to be attacked by two pieces at once"
      - "Checkmate requires the king to have moved earlier in the game"
      - "Stalemate is 'no legal moves AND NOT in check' and is a DRAW — teams often mislabel it a win for the attacker"
    answer: 3
    explanation: |
      Both statuses mean the side to move has zero legal moves; the in-check flag
      decides which. Stalemate is a draw by rule, and a naive "no moves = you
      lose" implementation silently awards wins. Bare kings relate to
      insufficient-material draws, a different rule.
    ref: "concepts.md#check-checkmate-and-stalemate-detection"

  - id: design-chess-game-015
    difficulty: intermediate
    tags: [command-pattern, move, undo]
    question: |
      The design records every move as a rich immutable Move object (from, to,
      moved piece, captured piece, special flags). Which pattern's core idea does
      this apply, and what capability does it buy?
    options:
      - "Command — encapsulating the action as an object makes moves reversible, enabling undo and check-simulation with one mechanism"
      - "Memento — it snapshots the entire board state for rollback"
      - "Prototype — it clones pieces cheaply on each move"
      - "Flyweight — it shares Move objects between games"
    answer: 0
    explanation: |
      A self-describing Move is the Command idea (encapsulate an action so it can
      be stored, replayed, inverted) without the interface-per-command ceremony.
      Memento would snapshot whole boards — a heavier alternative worth naming.
      The payoff is that undo and simulate-and-test reuse the same unmove logic.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-chess-game-016
    difficulty: intermediate
    tags: [observer, decoupling]
    question: |
      The Game should announce CHECK and CHECKMATE to the UI, a logger, and later
      a chess clock. Which pattern keeps the engine free of these concerns?
    options:
      - "Singleton — one global event bus everything reads"
      - "Observer — Game notifies registered GameListeners; the engine never renders or logs directly"
      - "Decorator — wrap Game in a LoggingGame and a RenderingGame"
      - "Template Method — subclass Game for each output channel"
    answer: 1
    explanation: |
      Observer decouples the rule engine from presentation: Game publishes events;
      any number of listeners react. Decorator wrappers would need stacking and
      re-wrapping per consumer; subclassing Game per output channel explodes; a
      Singleton bus adds global state without solving the coupling question.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-chess-game-017
    difficulty: advanced
    tags: [strategy, composition-vs-inheritance, trade-offs]
    question: |
      When would composing Piece with a MovementStrategy beat the subclass
      hierarchy for chess-like games?
    options:
      - "When the board is larger than 8x8"
      - "Never — inheritance is strictly superior for pieces"
      - "When piece behavior must change at runtime (e.g., promotion swaps the strategy) or pieces vary along multiple independent axes"
      - "When you need more than six piece types"
    answer: 2
    explanation: |
      Strategy-composition shines when behavior changes at runtime or when
      multiple variation axes would cause subclass explosion. Standard chess
      pieces vary on exactly one axis and never change type except promotion, so
      subclassing is simpler and idiomatic — but a candidate should name the
      alternative and its trade-off. Board size and piece count don't drive the
      choice.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-chess-game-018
    difficulty: advanced
    tags: [castling, special-moves, validation]
    question: |
      Which castling precondition do candidates MOST often get wrong regarding
      attacked squares?
    options:
      - "Only the king's path (start, transit, landing squares) must be free of attack — the rook MAY pass through an attacked square"
      - "The rook must not have moved before castling"
      - "There must be no pieces between the king and rook"
      - "The king must not currently be in check"
    answer: 0
    explanation: |
      The rule is asymmetric: the king cannot castle out of, through, or into
      check, but the rook's path has no attack restriction (relevant in queenside
      castling where the rook crosses b1/b8). The other three options are real
      preconditions but are widely known; the rook asymmetry is the trap.
    ref: "concepts.md#special-moves-castling-en-passant-and-promotion"

  - id: design-chess-game-019
    difficulty: intermediate
    tags: [castling, state, hasMoved]
    question: |
      Why does the Piece class carry a `hasMoved` boolean?
    options:
      - "Castling (and the pawn's double push) require knowing whether the piece has ever moved — you can't cheaply derive that from the current board position"
      - "To detect threefold repetition"
      - "To prevent the same piece moving twice in one turn"
      - "To optimize rendering of moved pieces"
    answer: 0
    explanation: |
      A rook sitting on its home square may still have moved away and back,
      permanently losing castling rights — the position alone can't tell you.
      A once-set flag (or derivation from move history) captures it. Repetition
      detection needs position hashing, a separate mechanism, and turn order is
      enforced by Game, not per-piece flags.
    ref: "concepts.md#special-moves-castling-en-passant-and-promotion"

  - id: design-chess-game-020
    difficulty: advanced
    tags: [en-passant, move-history, design]
    question: |
      En passant is architecturally unusual among chess rules. What dependency
      does validating it introduce?
    options:
      - "It requires simulating two moves ahead"
      - "It depends on the IMMEDIATELY PREVIOUS move (an enemy pawn's double push), so the validator needs the last history entry or a cached en-passant target square"
      - "It requires knowing the total number of pawns captured so far"
      - "It requires the opponent's consent, so the API needs a confirmation callback"
    answer: 1
    explanation: |
      En passant is the only rule whose legality hinges on what the previous move
      was, not just the current position. The clean designs either consult the
      move history's last entry or cache an "en passant target square" after every
      double pawn push (FEN does exactly this). No lookahead or consent involved.
    ref: "concepts.md#special-moves-castling-en-passant-and-promotion"

  - id: design-chess-game-021
    difficulty: advanced
    tags: [en-passant, undo, edge-cases]
    question: |
      A team's undo feature works for every move except en passant, which corrupts
      the board. What is the most likely modeling flaw?
    options:
      - "The Move object stores positions as mutable fields"
      - "The pawn's hasMoved flag was never set"
      - "Undo assumed the captured piece sat on the move's destination square, but the en-passant victim stands on a DIFFERENT square — Move must store the captured piece's actual square"
      - "En passant was executed as two separate Move objects"
    answer: 2
    explanation: |
      In en passant the capturing pawn lands on the square BEHIND the victim, so
      restore-captured-piece-at-destination logic resurrects the pawn on the wrong
      square (or not at all). Recording the captured piece together with its true
      square in Move fixes it. This is the canonical en passant undo bug.
    ref: "concepts.md#special-moves-castling-en-passant-and-promotion"

  - id: design-chess-game-022
    difficulty: intermediate
    tags: [promotion, factory, api]
    question: |
      How should the design handle the player's promotion choice (queen, rook,
      bishop, or knight)?
    options:
      - "Always promote to a queen since it's almost always best"
      - "Pause makeMove and block on a UI prompt until the player answers"
      - "Let the pawn object mutate its internal type field to the chosen piece"
      - "Accept the choice as an input on the move (e.g., a promotionChoice field or makeMove overload) and replace the pawn with a factory-created piece"
    answer: 3
    explanation: |
      The choice is data that travels WITH the move, so the engine never blocks
      mid-call, and under-promotion (sometimes best, e.g., knight promotions that
      deliver check) stays legal. Replacing the object keeps the subclass model
      honest — a mutable type field breaks polymorphic dispatch. Hard-coding
      queen is a real rules violation.
    ref: "concepts.md#special-moves-castling-en-passant-and-promotion"

  - id: design-chess-game-023
    difficulty: intermediate
    tags: [api, error-handling]
    question: |
      Why does makeMove return a MoveResult (success flag + status + reason)
      instead of throwing an exception on an illegal move?
    options:
      - "Exceptions cannot carry a reason string"
      - "Illegal moves are an EXPECTED outcome (players mis-click), not a programming error — exceptions are reserved for genuine bugs like null players"
      - "Exceptions would break the Observer notifications"
      - "Returning objects is faster than throwing in all JVM versions"
    answer: 1
    explanation: |
      Exception-driven control flow for routine outcomes makes callers wrap every
      move in try/catch and blurs the line between "you can't move there" and
      "the engine is broken". A result object models the domain honestly.
      Performance is a side note, not the design reason.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-chess-game-024
    difficulty: beginner
    tags: [api, encapsulation]
    question: |
      makeMove takes the Player as a parameter. What responsibility does this
      enable Game to keep for itself?
    options:
      - "Enforcing turn order — the game, not the caller, rejects out-of-turn moves"
      - "Computing the player's rating change"
      - "Choosing which piece the player intended to move"
      - "Rendering the player's name on the board"
    answer: 0
    explanation: |
      If callers merely sent coordinates, the engine would have to trust the UI
      about whose move it is. Passing the player lets Game compare against
      currentTurn and reject violations — essential when clients may be buggy or
      malicious. Ratings and rendering are out of scope for the engine.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-chess-game-025
    difficulty: intermediate
    tags: [value-objects, immutability]
    question: |
      Position is modeled as an immutable record rather than a mutable class with
      setRow/setCol. What is the design payoff?
    options:
      - "Records use less disk space when serialized"
      - "Mutable positions would be visible to the opponent"
      - "It eliminates aliasing bugs (a shared Position silently mutated elsewhere) and gives correct equals/hashCode for use in sets of attacked squares"
      - "Records can be compared with == instead of equals"
    answer: 2
    explanation: |
      Value semantics matter here: positions are stored in Move history, map keys,
      and attack sets. A mutable position mutated after being stored corrupts all
      of them. Immutability plus structural equality removes the whole bug class.
      == still compares references for records; that distractor is factually wrong.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-chess-game-026
    difficulty: intermediate
    tags: [concurrency, locking]
    question: |
      Why is a single lock (synchronized makeMove) plus a turn-check sufficient
      concurrency control for one chess game?
    options:
      - "Because the JVM guarantees only one thread per object"
      - "Because chess moves are too fast for races to occur"
      - "It isn't — each Cell needs its own lock to prevent piece corruption"
      - "Chess is strictly turn-based: at most one player has a legal action at a time, so the lock serializes submissions and the turn guard rejects the loser"
    answer: 3
    explanation: |
      The domain itself removes contention: there's no scenario where two
      concurrent moves are both legal. One coarse lock has no ordering issues and
      trivially handles double-clicks and out-of-turn submissions. Per-cell
      locking is overkill that invites deadlock — the classic
      over-engineering trap in turn-based games.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-chess-game-027
    difficulty: advanced
    tags: [concurrency, timer, races]
    question: |
      A chess clock thread flags White's timeout at the same instant White's move
      arrives. How does the design resolve the race?
    options:
      - "The move thread always wins because moves have higher priority"
      - "Both the timeout handler and makeMove acquire the SAME game lock — whichever acquires it first decides the outcome"
      - "Use an AtomicBoolean checked without locking"
      - "Timeouts are checked only at the start of the next turn"
    answer: 1
    explanation: |
      Routing both state transitions through one lock makes the race benign: if
      the timeout wins, the game is over and the move is rejected; if the move
      wins, the clock stops in time. A lock-free flag alone doesn't serialize the
      compound check-then-update sequences, and deferring timeouts changes game
      semantics.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-chess-game-028
    difficulty: intermediate
    tags: [pinned-piece, testing, edge-cases]
    question: |
      A rook is "pinned" — moving it would expose its own king to a bishop. Where
      should the code that rejects this move live?
    options:
      - "Nowhere special — the generic simulate-and-test king-safety step rejects it automatically; write a TEST for the scenario instead of special-case code"
      - "In Rook.canMove, which should scan diagonals for enemy bishops behind it"
      - "In a PinDetector service that recomputes pins after every move"
      - "In Board.isPathClear, which should refuse paths that cross the king"
    answer: 0
    explanation: |
      Pins are not a separate rule — they're an instance of "your move may not
      leave your king attacked". The simulation step catches them with zero extra
      code. Piece-level pin scanning couples pieces to king logic, and a
      PinDetector duplicates what simulation gives free. Verify with a unit test.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-chess-game-029
    difficulty: beginner
    tags: [game-status, enums]
    question: |
      Which set best matches the GameStatus values the core design needs?
    options:
      - "WIN, LOSE, TIE"
      - "ACTIVE, CHECK, CHECKMATE, STALEMATE, RESIGNED, DRAW"
      - "STARTED, PAUSED, STOPPED"
      - "WHITE_TURN, BLACK_TURN, GAME_OVER"
    answer: 1
    explanation: |
      The status enum captures the rule-relevant lifecycle: normal play, a king
      under threat, the two no-legal-move terminals (checkmate vs stalemate —
      crucially different outcomes), resignation, and draws. Turn ownership is a
      separate Color field, not a status; WIN/LOSE collapses distinct terminal
      causes the design must distinguish.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-chess-game-030
    difficulty: intermediate
    tags: [undo, redo, command]
    question: |
      Undo is implemented as a stack of Move objects. How is redo added, and what
      subtle rule keeps history consistent?
    options:
      - "Re-run the entire game from move one on each redo"
      - "Store board snapshots every 10 moves and interpolate"
      - "A second stack receives undone moves; it must be CLEARED whenever a fresh move is made, since the old future is no longer reachable"
      - "Redo is impossible without persisting to a database"
    answer: 2
    explanation: |
      Undo pops history onto a redo stack; redo pops back. The invariant everyone
      forgets: making a NEW move after undoing invalidates the redo stack (you've
      branched the timeline), so it must be cleared. Full replay works but is
      needlessly O(n) per redo; snapshots are the heavier Memento alternative.
    ref: "concepts.md#extensibility"

  - id: design-chess-game-031
    difficulty: intermediate
    tags: [timer, observer, extensibility]
    question: |
      The interviewer asks you to add a chess clock. Which integration requires
      ZERO changes to move validation?
    options:
      - "Add a timeRemaining check inside every Piece.canMove"
      - "Register the clock as a GameListener: makeMove events switch whose clock runs, and a timeout event drives a status change"
      - "Have Board track timestamps for each cell"
      - "Subclass Game as TimedGame and override isLegal"
    answer: 1
    explanation: |
      The clock is a game-flow concern orthogonal to legality. As an observer it
      reacts to move-made events (stop mover's clock, start opponent's) and
      publishes timeout as an event. Putting time into canMove or isLegal
      entangles rules with timing; per-cell timestamps make no semantic sense.
    ref: "concepts.md#extensibility"

  - id: design-chess-game-032
    difficulty: intermediate
    tags: [ai-player, interfaces, dip]
    question: |
      To support a future AI opponent, what change does the guide recommend to
      the Player model?
    options:
      - "Make Player an interface (or abstract) so HumanPlayer and AIPlayer both supply moves — Game validates whatever it's given and doesn't change"
      - "Give Game a boolean isVsComputer flag and branch in makeMove"
      - "Have AIPlayer extend Game so it can see the board directly"
      - "Add a computeBestMove method to the Board class"
    answer: 0
    explanation: |
      Game depends on the Player abstraction, not on how moves are produced —
      dependency inversion. A boolean flag with branching couples the engine to
      player kinds (and fails when both players are AI). AIPlayer extending Game
      confuses IS-A with USES-A; move computation is not a Board responsibility.
    ref: "concepts.md#extensibility"

  - id: design-chess-game-033
    difficulty: advanced
    tags: [chess960, factory, setup]
    question: |
      For Chess960 (randomized starting positions), which refactoring does the
      guide suggest, and what honest caveat comes with it?
    options:
      - "Randomize inside the Board constructor; no caveat needed"
      - "Create 960 Board subclasses, one per starting position"
      - "Store the start position in a config file; castling works unchanged"
      - "Extract board setup into a BoardInitializer strategy (StandardSetup, Chess960Setup) — but castling logic genuinely needs rework since king/rook start squares become parameters"
    answer: 3
    explanation: |
      Setup is one method today, so a Strategy/Factory-Method seam is cheap. The
      honest part: Chess960 castling rules reference the king's and rooks'
      ORIGINAL squares, so hard-coded e1/h1 logic must be parameterized —
      admitting which parts don't extend for free is exactly what interviewers
      want to hear. 960 subclasses is absurd; constructor randomization removes
      testability.
    ref: "concepts.md#extensibility"

  - id: design-chess-game-034
    difficulty: intermediate
    tags: [testing, board-setup]
    question: |
      Why should Board support constructing arbitrary positions rather than
      welding resetToStartingPosition into its constructor?
    options:
      - "Arbitrary positions load faster than the standard setup"
      - "Checkmate/stalemate scenarios (back-rank mate, smothered mate) can be unit-tested by injecting the position directly instead of scripting dozens of moves"
      - "The constructor cannot call other methods in Java"
      - "It allows two games to share one board instance"
    answer: 1
    explanation: |
      Testability drives this: the interesting logic (mate detection, pins,
      stalemate) lives in rare positions that take many moves to reach naturally.
      Position injection makes those tests direct and readable. Sharing boards
      between games is something to AVOID, and the constructor claim is false.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-chess-game-035
    difficulty: advanced
    tags: [board-representation, trade-offs]
    question: |
      An interviewer asks: "Does Cell need to exist, versus Board holding a
      Map<Position, Piece>?" What's the strongest answer?
    options:
      - "Cell is mandatory — chess cannot be modeled without a Square class"
      - "The map is mandatory — 2D arrays are an anti-pattern"
      - "Both are legitimate: the map models empty squares as absent keys and is slimmer; Cell earns its place if squares carry their own state — showing you CONSIDERED the representation is the point"
      - "Neither — pieces should store their own coordinates and the board disappears"
    answer: 2
    explanation: |
      This probe tests judgment, not trivia. A position-to-piece map is a clean
      sparse model; a Cell grid is natural when squares have identity or
      per-square state. Dogmatic answers in either direction miss it. Pieces
      storing coordinates without any board makes spatial queries (path clearance,
      attack detection) awkward.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-chess-game-036
    difficulty: beginner
    tags: [scope, hld-boundary]
    question: |
      The interviewer ends with "how would this work for millions of concurrent
      online games?" What is the LLD-appropriate response?
    options:
      - "Redesign the Piece hierarchy to be stateless and shared via Flyweight"
      - "Add synchronized to every method in every class"
      - "Propose one global GameManager singleton holding all games in a static map"
      - "Note that per-game state is small and independent (shard games across servers, persist move logs) and flag the rest as a system-design/HLD conversation"
    answer: 3
    explanation: |
      Recognizing the boundary is the skill being tested: game instances share no
      state, so horizontal scaling is natural, and the deep answer (matchmaking,
      persistence, real-time transport) belongs to HLD. A static singleton map is
      exactly the shared-mutable-state coupling the design avoided; blanket
      synchronization and Flyweight don't address distribution.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-chess-game-037
    difficulty: intermediate
    tags: [check-detection, board-queries]
    question: |
      Board.isSquareAttacked(pos, byColor) is implemented by iterating enemy
      pieces and asking each if it can pseudo-legally reach pos. If asked to
      optimize, what alternative does the guide suggest mentioning?
    options:
      - "Cache the result of every isSquareAttacked call for the whole game"
      - "Cast rays outward from the target square (plus knight-jump squares) so cost doesn't scale with piece count — mention it, but don't build it first"
      - "Run the scan on a background thread pool"
      - "Sort enemy pieces by distance before scanning"
    answer: 1
    explanation: |
      Reverse ray-casting inspects at most 8 directions plus 8 knight squares
      regardless of piece count — the standard chess-programming optimization.
      Whole-game caching is wrong (the board changes every move), threading adds
      complexity without reducing work, and sort order doesn't change the scan's
      cost. Interview priority: correct first, optimize if asked.
    ref: "concepts.md#check-checkmate-and-stalemate-detection"

  - id: design-chess-game-038
    difficulty: advanced
    tags: [simulation, trade-offs]
    question: |
      For check simulation you can either apply-then-revert on the real board, or
      copy the board and test on the copy. What's the honest trade-off?
    options:
      - "Copying is always wrong because boards are too large to copy"
      - "Apply-revert is always wrong because it mutates shared state"
      - "They produce different results for en passant positions"
      - "Apply-revert reuses the undo machinery and allocates nothing, but a buggy revert corrupts the live board; copying is safer but costs memory/CPU per candidate move — pick one out loud"
    answer: 3
    explanation: |
      Both are correct when implemented well. An 8x8 board is tiny (copying is
      NOT prohibitive — that distractor overstates it), but checkmate detection
      simulates many candidates, so apply-revert with the existing Move-based
      undo is elegant. The interview skill is naming the trade-off and choosing
      deliberately.
    ref: "concepts.md#check-checkmate-and-stalemate-detection"

  - id: design-chess-game-039
    difficulty: intermediate
    tags: [double-check, edge-cases]
    question: |
      In a double check (two pieces attack the king simultaneously), only a king
      move can resolve the check. How much special-case code does the recommended
      design need for this?
    options:
      - "None — generate-and-test simulation naturally rejects every non-king move, since at least one checker still attacks after any block or capture"
      - "A DoubleCheckHandler strategy selected when two attackers are found"
      - "A flag on GameStatus distinguishing CHECK from DOUBLE_CHECK"
      - "An override of canMove on every piece that checks the attacker count"
    answer: 0
    explanation: |
      Blocking or capturing one checker leaves the other attacking, so every
      simulated non-king move fails the king-safety test automatically. This is
      the payoff of choosing simulation over hand-enumerated escape logic: rare
      cases cost zero extra code. Special handlers and status flags solve a
      problem the architecture already dissolved.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-chess-game-040
    difficulty: intermediate
    tags: [move-pipeline, ordering]
    question: |
      In the move validation pipeline, why does the "pseudo-legal" vs "legal"
      distinction matter?
    options:
      - "Pseudo-legal moves are legal moves made by the AI player"
      - "The distinction only matters for castling"
      - "A move passing geometry, path, and capture checks is only pseudo-legal — it becomes legal only after the king-safety simulation passes; conflating the two lets players expose their own king"
      - "Legal moves are validated by Board, pseudo-legal ones by Game"
    answer: 2
    explanation: |
      The pipeline is layered exactly on this line: piece geometry + board
      occupancy produce pseudo-legal candidates; the game-level simulation filter
      produces legal ones. isSquareAttacked deliberately uses pseudo-legal
      reachability (an attacker "attacks" a square even if pinned — pinned pieces
      still give check coverage in the naive model, a nuance worth knowing).
    ref: "concepts.md#move-validation-pipeline"

  - id: design-chess-game-041
    difficulty: beginner
    tags: [pawn, rules]
    question: |
      Which statement about pawn movement is correct and must be reflected in
      Pawn.canMove?
    options:
      - "A pawn may capture straight ahead if the target is an enemy piece"
      - "A pawn moves diagonally forward onto empty squares when not capturing"
      - "A pawn may move two squares forward at any point in the game"
      - "A pawn captures only diagonally forward, and may never capture straight ahead"
    answer: 3
    explanation: |
      The pawn's capture squares and movement squares are disjoint: forward moves
      require an empty target; captures happen one square diagonally forward onto
      an occupied enemy square (en passant being the special diagonal-to-empty
      case handled with history context). The two-square advance is only from the
      starting rank with both squares clear.
    ref: "concepts.md#move-validation-pipeline"

  - id: design-chess-game-042
    difficulty: intermediate
    tags: [draw-rules, extensibility]
    question: |
      To implement threefold-repetition draws later, what technique does the
      guide name as the standard approach?
    options:
      - "Hash each position (e.g., Zobrist hashing) and count occurrences in a map"
      - "Store a full deep copy of the board after every move and compare pairwise"
      - "Compare the last three Move objects for equality"
      - "Track only king positions since repetition requires kings to repeat"
    answer: 0
    explanation: |
      Position hashing (Zobrist is the chess-standard incremental hash) reduces
      each position to a key you count in a map. Deep-copy-and-compare is O(n^2)
      in game length and memory-heavy. Comparing recent Moves misses repetitions
      reached by different move orders, and repetition concerns the WHOLE
      position (including side to move and castling rights), not just kings.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-chess-game-043
    difficulty: intermediate
    tags: [pgn, replay, testing]
    question: |
      What does the guide identify as the "best integration test" that falls out
      of the move-history design for free?
    options:
      - "Fuzzing makeMove with random coordinates"
      - "Replaying a recorded game's move list against a fresh board and asserting the final position and status"
      - "Mocking the Board and verifying Game calls it in order"
      - "Timing makeMove to ensure sub-millisecond validation"
    answer: 1
    explanation: |
      Because Move history captures everything needed to reproduce a game, replay
      doubles as both a feature (PGN import/replay) and an end-to-end test:
      feed a known game in, assert checkmate where the real game ended. Mock
      verification tests interactions rather than rules; fuzzing and timing don't
      validate correctness of known games.
    ref: "concepts.md#extensibility"

  - id: design-chess-game-044
    difficulty: intermediate
    tags: [undo, hasMoved, edge-cases]
    question: |
      Undoing a rook's first move must also restore its castling rights. What
      does this imply for the design?
    options:
      - "Castling rights should be recomputed from scratch every turn"
      - "hasMoved should be stored on the Board rather than the Piece"
      - "Undo of first moves should be disallowed to keep the flag simple"
      - "The Move must record whether it was the piece's first move (or the prior hasMoved value) so undo can restore it — a plain 'set hasMoved=false on undo' is wrong for pieces that had moved before"
    answer: 3
    explanation: |
      The naive undo bug: blindly clearing hasMoved would re-grant castling rights
      to a rook that had moved earlier in the game. Recording the prior flag (or
      a wasFirstMove bit) in Move makes undo exact. Recomputation from full
      history works but is needless per-turn cost; forbidding undo dodges the
      requirement.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-chess-game-045
    difficulty: beginner
    tags: [move, value-object, modeling]
    question: |
      Why is Move designed as an IMMUTABLE value object?
    options:
      - "Immutable objects are required by the Command pattern's definition"
      - "So Move can be subclassed for each piece type"
      - "It sits in the game's permanent history — mutation after recording would silently rewrite the past that undo, replay, and repetition-counting all depend on"
      - "Immutability makes Move serialize to smaller JSON"
    answer: 2
    explanation: |
      History integrity is the reason: undo inverts recorded moves, replay
      re-applies them, and future draw rules count them. Any of those breaks if a
      recorded Move can change. Command doesn't mandate immutability, per-piece
      Move subclasses add nothing, and serialization size is unaffected.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-chess-game-046
    difficulty: advanced
    tags: [castling, layering, special-moves]
    question: |
      Why does the guide place castling validation at the Game/validator layer
      instead of entirely inside King.canMove?
    options:
      - "King.canMove is final and cannot be extended"
      - "Castling needs context beyond one piece's geometry: the rook's state, attack status of transit squares, and current-check status — pushing all that into King couples the piece to game-level concerns"
      - "Castling is the rook's move, so it belongs in Rook.canMove"
      - "Performance: King.canMove is called too frequently to afford the checks"
    answer: 1
    explanation: |
      Castling touches another piece's hasMoved flag, isSquareAttacked queries,
      and the in-check status — squarely board/game-level information. The
      layered model keeps Piece geometry pure. Formally the king moves first in
      castling (it's classified as a king move), but ownership by geometry alone
      doesn't decide layering; context requirements do.
    ref: "concepts.md#special-moves-castling-en-passant-and-promotion"

  - id: design-chess-game-047
    difficulty: intermediate
    tags: [get-valid-moves, responsibilities]
    question: |
      The interviewer asks where getValidMoves(board, from) should live. Per the
      guide, which placement is clearly WRONG?
    options:
      - "On each Piece subclass, generating its own candidate squares"
      - "In a dedicated MoveGenerator service that keeps pieces minimal"
      - "Inside Game, computing knight offsets and bishop diagonals itself with type checks"
      - "On Piece with Game filtering out moves that leave the king in check"
    answer: 2
    explanation: |
      Piece-owned generation and a MoveGenerator service are both defensible
      (candidates should be able to argue either). What fails is Game reaching
      into piece-specific geometry with instanceof/type checks — it recreates the
      switch-statement anti-pattern at the orchestration layer and guts the
      polymorphic design.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-chess-game-048
    difficulty: beginner
    tags: [observer, engine-purity]
    question: |
      The guide says the engine "doesn't println, it notifies". What design
      property does this preserve?
    options:
      - "The rule engine stays presentation-agnostic — the same Game drives a console UI, a GUI, or a test harness without modification"
      - "It reduces the number of classes in the design"
      - "It guarantees thread-safety of the output stream"
      - "It makes the engine run faster by avoiding I/O"
    answer: 0
    explanation: |
      Separating computation from presentation via Observer means the engine has
      no idea who consumes its events — tests can assert on events, and different
      frontends attach without engine changes. Speed and stream safety are side
      effects at best; the class count actually goes UP slightly (listener
      interface), which is fine.
    ref: "concepts.md#key-design-decisions-and-patterns"

  - id: design-chess-game-049
    difficulty: intermediate
    tags: [singleton, anti-pattern, isolation]
    question: |
      Why does the guide warn against making Board a Singleton or storing games
      in static state?
    options:
      - "Singletons are forbidden by the Java language specification"
      - "Static fields cannot hold 2D arrays"
      - "Singleton Boards would use too much memory"
      - "Multiple games must run independently — shared/static board state couples every game to every other, breaks tests that need fresh boards, and blocks the trivial 'one Game instance per match' scaling story"
    answer: 3
    explanation: |
      The design's concurrency story rests on games sharing no mutable state.
      A Singleton board makes a second simultaneous game impossible and makes
      unit tests order-dependent. This is the classic Singleton misuse: "there's
      one board per game" does not mean "there's one board per process".
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-chess-game-050
    difficulty: beginner
    tags: [knight, geometry]
    question: |
      The skeleton implements the knight's move test as `dr * dc == 2` where dr
      and dc are absolute row/column deltas. Why is this correct?
    options:
      - "Because knights move exactly 2 squares in total"
      - "The only positive integer pairs with product 2 are (1,2) and (2,1) — exactly the knight's L-shapes; and no path-clearance call is needed since knights jump"
      - "It's a performance hack that trades correctness for speed"
      - "Because dr and dc are always equal for knights"
    answer: 1
    explanation: |
      |dr| and |dc| for a legal knight move are always {1,2} in some order, and
      1*2 = 2 uniquely among non-negative delta pairs (0*anything = 0, 1*1 = 1,
      2*2 = 4). The absence of an isPathClear call is equally important — it
      encodes the jump rule. The trick is fully correct, not an approximation.
    ref: "concepts.md#code-skeleton"

  - id: design-chess-game-051
    difficulty: advanced
    tags: [insufficient-material, draw-rules]
    question: |
      Which endgame material combination should the (extension-tier) insufficient
      material rule flag as a dead draw?
    options:
      - "King and rook versus king"
      - "King and pawn versus king"
      - "King and two knights versus king and rook"
      - "King and bishop versus bare king"
    answer: 3
    explanation: |
      K+B vs K (like K+N vs K and K vs K) cannot produce checkmate by any legal
      sequence, so the game is drawn immediately. K+R vs K is a textbook win;
      K+P vs K can promote and win; and material-rich positions like two knights
      vs rook are not automatic draws. The design point: this is a Game-status
      rule computed from board census, not per-piece logic.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-chess-game-052
    difficulty: intermediate
    tags: [fifty-move-rule, state]
    question: |
      To support the fifty-move rule later, what single piece of state does Game
      need, and when does it reset?
    options:
      - "A half-move counter that increments each move and RESETS on any pawn move or capture"
      - "A timestamp of the last capture"
      - "A count of moves made by each individual piece"
      - "A flag set when fewer than ten pieces remain"
    answer: 0
    explanation: |
      The rule: 50 consecutive full moves by each side with no pawn move and no
      capture allow a draw claim. One half-move clock (as in FEN) suffices —
      increment per half-move, reset to zero on pawn advances and captures. Both
      reset triggers already pass through makeMove, so the hook is one line.
      Timestamps and per-piece counters don't express the rule.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-chess-game-053
    difficulty: intermediate
    tags: [player, color, modeling]
    question: |
      Color is modeled as a two-value enum with an opposite() helper rather than
      a boolean isWhite. What's the design argument?
    options:
      - "Booleans cannot be stored in Java records"
      - "Enums serialize more compactly than booleans"
      - "An enum is self-documenting at call sites, type-safe as a map key or method parameter, and opposite() centralizes turn-flipping instead of scattering !isWhite negations"
      - "The enum allows a third color for three-player chess"
    answer: 2
    explanation: |
      makeMove(..., true) tells a reader nothing; Color.WHITE does. The enum also
      prevents passing an unrelated boolean by accident and gives turn switching
      one named home (currentTurn = currentTurn.opposite()). Serialization size
      is irrelevant, and three-player chess would change far more than an enum.
    ref: "concepts.md#code-skeleton"

  - id: design-chess-game-054
    difficulty: advanced
    tags: [resignation, api, status]
    question: |
      resign(Player p) is part of Game's public API. Which design detail matters
      most when implementing it?
    options:
      - "Resignation must be validated by the opponent before taking effect"
      - "It should clear the move history to free memory"
      - "Only the piece objects of the resigning player should be removed from the board"
      - "It must acquire the same game lock as makeMove and set a terminal status (RESIGNED) that makeMove checks first — so no move can land after resignation"
    answer: 3
    explanation: |
      Resignation is a state transition racing with in-flight moves, so it goes
      through the same lock, and the pipeline's very first gate ("is the game
      still active?") makes post-resignation moves impossible. Either player may
      resign at any time without consent; history must be PRESERVED for replay;
      the board stays intact for display and analysis.
    ref: "concepts.md#api-and-method-signatures"
