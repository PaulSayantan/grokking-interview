topic: "Design a Tic-Tac-Toe Game"
domain: lld-and-ood
topic_slug: design-tic-tac-toe
version: 1
questions:
  - id: design-tic-tac-toe-001
    difficulty: beginner
    tags: [requirements, scoping]
    question: |
      During requirements clarification for Tic-Tac-Toe, which decision most changes the
      STRUCTURE of your win-detection code (not just a configuration value)?
    options:
      - "Whether the board is 3x3 or 5x5, since each size needs a new set of win lines"
      - "Whether the win condition is N-in-a-row on an NxN board, or K-in-a-row with K < N"
      - "Whether players are named or anonymous, so cells must be keyed by player name"
      - "Whether the game renders to a console or returns its board state as a JSON payload"
    answer: 1
    explanation: |
      Board size is a constructor parameter — the counter-based win check is size-agnostic.
      But K < N (Connect-K) breaks the full-line counter trick entirely: counters can only
      detect a full row/column/diagonal, not K consecutive marks mid-line. You would need a
      different WinChecker implementation (a directional scan), which is a structural change.
      Names and rendering are cosmetic. Surfacing rule ambiguities that alter code structure
      is the point of the first five minutes.
    ref: "concepts.md#requirements-clarification"

  - id: design-tic-tac-toe-002
    difficulty: beginner
    tags: [entities, responsibilities, srp]
    question: |
      In a clean Tic-Tac-Toe design, which class should own win detection?
    options:
      - "Game — it decides when the game ends, so it should compute wins"
      - "Player — the player who moved knows whether their own move completed a line"
      - "GameStatus — it represents the outcome, so it should also detect it"
      - "Board — it owns the grid and the counters, and exposes checkWin(lastMove, symbol)"
    answer: 3
    explanation: |
      The board is the "physics" of the grid: it validates moves, applies them, and knows
      whether a line is complete. Game is the referee — it asks the board and transitions
      GameStatus, but never inspects cells itself. Putting win logic in Game bloats the
      orchestrator and makes Board non-reusable for variants or AI simulation; Player
      computing wins would require players to know grid internals; GameStatus is just an
      enum value, not a behavior owner.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-tic-tac-toe-003
    difficulty: beginner
    tags: [dependencies, coupling]
    question: |
      Why should Board NOT hold references to Player objects?
    options:
      - "Board should deal only in Symbol and coordinates — that keeps the dependency direction one-way and the board reusable for AI evaluation"
      - "Player objects are too large to store in a grid, so the array would blow the heap"
      - "Java forbids circular references between two classes that hold fields of each other"
      - "Because Player is abstract and abstract reference types can never be stored in object fields"
    answer: 0
    explanation: |
      The board only needs to know which mark occupies each cell — a Symbol. If Board
      referenced Player, you would create a Board→Player dependency alongside the existing
      Game→Board and Game→Player edges, coupling grid mechanics to player identity. Keeping
      Board symbol-only means a MoveStrategy can simulate positions on a board without any
      players existing. The other options are technically false: object references are cheap,
      circular references are legal, and abstract-typed fields are routine.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-tic-tac-toe-004
    difficulty: intermediate
    tags: [strategy-pattern, composition]
    question: |
      Why should ComputerPlayer HOLD a MoveStrategy rather than the design having subclasses
      like RandomComputerPlayer and MinimaxComputerPlayer?
    options:
      - "Subclassing ComputerPlayer would violate the Liskov Substitution Principle in every case"
      - "Interfaces compile faster than deep class hierarchies and shrink the final bytecode"
      - "Difficulty is a behavior axis independent of player identity — composition lets you swap it at runtime and avoids a subclass explosion when a second axis appears"
      - "Java limits inheritance depth to two levels, so a third subclass would not compile"
    answer: 2
    explanation: |
      This is composition over inheritance. AI difficulty varies independently of what a
      ComputerPlayer *is*; baking each difficulty into a subclass means you cannot change
      difficulty mid-session and every new behavioral axis (e.g., time-limited thinking)
      multiplies the subclass count. A held MoveStrategy is one field and one setter away
      from runtime swapping. Subclassing per difficulty would not inherently violate LSP,
      and the compilation/inheritance-depth claims are simply false.
    ref: "concepts.md#key-design-decisions"

  - id: design-tic-tac-toe-005
    difficulty: beginner
    tags: [solid, open-closed, anti-pattern]
    question: |
      An interviewer sees `if (player.isComputer()) { ... } else { ... }` inside the game
      loop. Which principle does this most directly violate, and why?
    options:
      - "Open/Closed — adding a RemotePlayer would require editing Game rather than just adding a class"
      - "Single Responsibility — the loop is doing move dispatch and player-type detection at once"
      - "Interface Segregation — the Player interface is too fat and forces unused methods on callers"
      - "DRY — the branch duplicates the same move-dispatch code across both conditional arms"
    answer: 0
    explanation: |
      The type-check branch means Game is closed to extension: every new player kind
      (RemotePlayer, ReplayPlayer) forces a modification to tested game-loop code. The
      polymorphic fix — Game calls player.makeMove(board) and never knows the concrete
      type — makes new player kinds purely additive. SRP and ISP are not the primary issue
      here, and the branch is not duplication per se; it is a missing abstraction.
    ref: "concepts.md#key-design-decisions"

  - id: design-tic-tac-toe-006
    difficulty: intermediate
    tags: [win-check, algorithm]
    question: |
      With the O(1) counter-based win check on an NxN board, a player moves at (r, c).
      Which counters are updated?
    options:
      - "All N row counters and all N column counters for that player, refreshed every move"
      - "Only the row counter for r — the N columns are then checked by a full vertical scan"
      - "Every counter for every player, incremented together to keep all lines synchronized"
      - "rowCounts[r] and colCounts[c] always; diagCount only if r == c; antiDiagCount only if r + c == N - 1"
    answer: 3
    explanation: |
      Each move touches exactly one row, one column, at most the main diagonal (cells where
      r == c), and at most the anti-diagonal (cells where r + c == N - 1). So at most four
      counter increments happen per move, each O(1). If any incremented counter reaches N,
      that player has completed a line. Updating all counters or other players' counters
      would be wasted work — a move only affects the mover's four candidate lines.
    ref: "concepts.md#key-design-decisions"

  - id: design-tic-tac-toe-007
    difficulty: intermediate
    tags: [win-check, reasoning]
    question: |
      Why is it sufficient for checkWin to examine only the lines passing through the LAST
      move, rather than the whole board?
    options:
      - "A player can only newly win on a line that passes through the move they just made — every other line was already checked after its own last change"
      - "The board is rotationally symmetric, so checking any one line is representative of all of them"
      - "Because the game strictly alternates turns, at most half the board can ever contain each symbol"
      - "It is not sufficient — the two diagonals still require a separate full-board scan every move"
    answer: 0
    explanation: |
      A win requires N marks on one line. Before this move, no line was complete (the game
      would already have ended). The only lines whose contents changed are the ones through
      (r, c) — the row, column, and possibly one or both diagonals. So checking those (via
      counters, in O(1)) is exhaustive. This invariant-based argument is worth narrating in
      the interview: it justifies both the counter trick and the checkWin(lastMove) signature.
    ref: "concepts.md#key-design-decisions"

  - id: design-tic-tac-toe-008
    difficulty: beginner
    tags: [complexity, win-check]
    question: |
      What are the time and space costs of the counter-based win check on an NxN board?
    options:
      - "O(N) time per move, O(1) extra space since nothing is cached between moves"
      - "O(1) time per move, O(N^2) extra space for a shadow grid mirroring every cell"
      - "O(1) time per move, O(N) extra space per player (N row counters, N column counters, 2 diagonal counters)"
      - "O(N^2) time per move, no extra space beyond the grid array itself"
    answer: 2
    explanation: |
      Each move does at most four increments and four comparisons — constant time. The
      counters cost N (rows) + N (columns) + 2 (diagonals) integers per player, i.e., O(N)
      space per player. The naive alternative — scanning the lines through the last move —
      is O(N) time with no extra space; rescanning the whole board is O(N^2). Narrating the
      progression from the naive scan to counters is exactly what interviewers reward.
    ref: "concepts.md#key-design-decisions"

  - id: design-tic-tac-toe-009
    difficulty: beginner
    tags: [class-relationships, composition]
    question: |
      What is the most defensible UML relationship between Game and Board?
    options:
      - "Inheritance — Game IS-A specialized Board that adds turn handling on top of the grid"
      - "Composition — Game owns the Board and their lifecycles are tied; the board has no meaning outside its game"
      - "Dependency only — Game receives a fresh Board as a parameter on each method call"
      - "Association with the Board owning the Game and driving its turn lifecycle"
    answer: 1
    explanation: |
      The board is created by (or for) the game, lives exactly as long as the game, and is
      not shared with other games — the definition of composition (filled diamond in UML).
      Game IS-A Board fails the substitutability sniff test entirely. Contrast this with
      Game and its Players, which is usually drawn as aggregation because player identities
      can conceptually outlive a single match.
    ref: "concepts.md#class-diagram"

  - id: design-tic-tac-toe-010
    difficulty: intermediate
    tags: [class-relationships, aggregation]
    question: |
      Why is Game-to-Player usually drawn as AGGREGATION (hollow diamond) while
      Game-to-Board is COMPOSITION (filled diamond)?
    options:
      - "Players can conceptually exist independently of any single game (they may play many matches), while the board's lifecycle is bound to its game"
      - "Aggregation is mandatory whenever the multiplicity on the relationship is 2 or more"
      - "Composition is only allowed for classes whose fields are all primitive value types"
      - "Because Player is abstract, and UML forbids composing an abstract class into another"
    answer: 0
    explanation: |
      The distinction is lifecycle and sharing: a Board belongs to exactly one Game and dies
      with it (composition), whereas Player objects represent identities that can be reused
      across games or exist before a game starts (aggregation). Multiplicity has nothing to
      do with the diamond type, and options C and D invent rules that do not exist. In an
      interview, either choice for Player is defensible — what is graded is the justification.
    ref: "concepts.md#class-diagram"

  - id: design-tic-tac-toe-011
    difficulty: beginner
    tags: [responsibilities, srp]
    question: |
      Which class should own TURN ORDER (whose move it is, and advancing to the next player)?
    options:
      - "Board — it applies the moves, so it should also sequence whose move comes next"
      - "Cell — turn state can live next to cell state in each grid position's fields"
      - "Player — each player object tracks a boolean for whether it is currently their turn"
      - "Game — it is the referee; the board is the physics of the grid and should be usable for turn-free analysis"
    answer: 3
    explanation: |
      Turn order is game-flow policy, not grid mechanics. If Board tracked turns, an AI
      strategy could not use a Board to evaluate hypothetical positions out of turn, and the
      board would no longer be reusable. Players tracking their own turn scatters one piece
      of state across many objects and invites inconsistency. Game holding
      currentPlayerIndex centralizes the referee role — the SRP split interviewers look for.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-tic-tac-toe-012
    difficulty: intermediate
    tags: [api-design, win-check]
    question: |
      Why should the win-check method be declared as checkWin(Move lastMove, Symbol s)
      rather than a no-argument checkWin()?
    options:
      - "Methods that take parameters are inherently easier to mock and stub in unit tests"
      - "A no-argument method cannot return a boolean value in several statically typed languages"
      - "Passing the last move is what enables the O(1) check — only the lines through that move can have newly completed; a no-arg signature implies a full-board scan"
      - "Because Symbol is an enum, and enum values must always be passed as explicit arguments"
    answer: 2
    explanation: |
      The signature encodes the algorithm's key insight. Given the last move, checkWin reads
      exactly four counters. Without it, the method has no idea which lines changed and must
      scan everything — O(N^2) or O(N) at best. This is a nice example of API design and
      algorithmic insight being the same decision; saying it out loud earns credit for both.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-tic-tac-toe-013
    difficulty: intermediate
    tags: [edge-cases, game-loop]
    question: |
      In playTurn, why must the WIN check run BEFORE the draw (board full) check?
    options:
      - "The win check is cheaper than the draw check, so ordering it first is a performance optimization"
      - "The move that fills the last cell can itself be a winning move — checking isFull first would misreport a WIN as a DRAW"
      - "Draw checks can throw an exception if they run while the board is not yet full"
      - "The order does not matter at all as long as both checks run before the next turn"
    answer: 1
    explanation: |
      Consider the ninth move on a 3x3 board completing a row: the board is now full AND
      the mover has won. If you test isFull() first, you declare a draw and the winner is
      robbed. The correct order — win, then draw — costs nothing and handles the overlap.
      This is one of the classic Tic-Tac-Toe bugs interviewers deliberately probe for, so
      the ordering absolutely matters.
    ref: "concepts.md#code-skeleton"

  - id: design-tic-tac-toe-014
    difficulty: intermediate
    tags: [strategy-pattern, extensibility, open-closed]
    question: |
      The interviewer says: "Now add an unbeatable computer opponent." In the Strategy-based
      design, what changes?
    options:
      - "Add a MinimaxStrategy class implementing MoveStrategy — ComputerPlayer, Player, and Game are untouched"
      - "Add an isUnbeatable boolean flag to ComputerPlayer and branch on it inside makeMove"
      - "Subclass Game as UnbeatableGame and override playTurn to compute the optimal move"
      - "Modify Board so it silently refuses any move that would let the opponent later win"
    answer: 0
    explanation: |
      This is the Open/Closed payoff of the Strategy pattern: new AI behavior is a new class
      behind the existing MoveStrategy interface, injected at construction. No tested code
      is edited. A flag-and-branch reintroduces the conditional Strategy was meant to remove;
      subclassing Game confuses orchestration with player behavior; and putting AI smarts in
      Board destroys its single responsibility as neutral grid physics.
    ref: "concepts.md#extensibility"

  - id: design-tic-tac-toe-015
    difficulty: advanced
    tags: [win-check, connect-k, limitations]
    question: |
      The interviewer changes the rules: win = K in a row on an NxN board, with K < N.
      Why does the simple counter-based win check stop working?
    options:
      - "The counters overflow their integer range for any board larger than 3x3"
      - "Diagonals no longer exist as valid winning lines once K drops below N"
      - "Full-line counters only detect N marks anywhere on a line — they cannot tell whether K of those marks are CONSECUTIVE"
      - "It still works — you just compare the counters to K instead of N"
    answer: 2
    explanation: |
      A row counter of K means the player has K marks somewhere in that row, possibly with
      gaps — that is not a Connect-K win. Comparing counters to K (option D) produces false
      positives for exactly this reason, which is the trap answer. Consecutiveness requires
      locality the counters do not record, so you fall back to an O(K) directional scan
      through the last move. Being honest about a technique's breaking point is a strong
      interview signal.
    ref: "concepts.md#extensibility"

  - id: design-tic-tac-toe-016
    difficulty: advanced
    tags: [extensibility, strategy-pattern, open-closed]
    question: |
      What is the cleanest way to support BOTH classic N-in-a-row and Connect-K (K < N)
      win rules without repeatedly editing Board?
    options:
      - "Put an if (k == n) branch inside Board.checkWin to pick the rule at runtime"
      - "Subclass Board as ConnectKBoard and override every grid and win-check method"
      - "Let Game scan the grid directly for the Connect-K case and delegate the rest"
      - "Extract a WinChecker interface with CounterWinChecker (K == N) and DirectionalScanWinChecker (K < N) implementations, injected into Board"
    answer: 3
    explanation: |
      Win detection is a policy that varies independently of grid storage — the definition
      of a Strategy seam. Injecting a WinChecker keeps Board closed for modification and
      lets tests exercise each checker in isolation. The in-method branch grows with every
      new rule; a Board subclass duplicates grid mechanics to change one policy; and Game
      scanning the grid violates the Board/Game responsibility split established earlier.
    ref: "concepts.md#extensibility"

  - id: design-tic-tac-toe-017
    difficulty: beginner
    tags: [factory-pattern, creation]
    question: |
      What problem does a PlayerFactory solve in this design?
    options:
      - "It keeps concrete construction — new HumanPlayer(...), new ComputerPlayer(new MinimaxStrategy()) — out of Game setup, so Game depends only on the Player abstraction"
      - "It guarantees that only two players can ever be constructed for any game"
      - "It makes every Player object immutable once the factory returns it"
      - "It caches Player instances so the identical player is never constructed twice"
    answer: 0
    explanation: |
      The factory centralizes the "which concrete type, wired how?" decision. Game (or the
      composition root) asks for a player by type and gets back the abstraction, so adding a
      RemotePlayer touches only the factory. Factories do not inherently limit counts,
      enforce immutability, or cache — those would be separate, deliberate choices (and
      caching players would actually be a Flyweight/registry concern, not warranted here).
    ref: "concepts.md#key-design-decisions"

  - id: design-tic-tac-toe-018
    difficulty: intermediate
    tags: [factory-pattern, scoping, over-engineering]
    question: |
      For creating human vs. computer players in a 45-minute interview, which factory
      flavor is the right call?
    options:
      - "A full Abstract Factory hierarchy with a factory interface and one factory class per player type"
      - "A simple static factory method like PlayerFactory.createPlayer(type, name, symbol)"
      - "A Builder with fluent setters for every Player field and a final build() call"
      - "Reflection-based instantiation from a class-name string read at construction time"
    answer: 1
    explanation: |
      Two concrete types need one static method with a switch — that is proportionate
      design. An Abstract Factory earns its weight only when whole FAMILIES of related
      objects must vary together; a Builder suits many optional parameters, which Player
      does not have; reflection trades compile-time safety for flexibility nobody asked
      for. Over-engineering a toy problem is a real failure mode interviewers screen for.
    ref: "concepts.md#key-design-decisions"

  - id: design-tic-tac-toe-019
    difficulty: intermediate
    tags: [command-pattern, undo, extensibility]
    question: |
      The interviewer asks for UNDO support. Which pattern fits, and what does it look like
      here?
    options:
      - "Observer — notify all subscribed listeners that a move was retracted so the board automatically rolls itself back when the event fires"
      - "Singleton — one global UndoManager shared by every game holds the single move stack and reverses the most recent move on request"
      - "Template Method — a base UndoableGame class defines the fixed sequence of undo steps and each subclass fills in how its moves are reversed"
      - "Command — reify each move as an object with execute() and undo(), where undo restores the cell, decrements the win counters, and rewinds the turn pointer"
    answer: 3
    explanation: |
      Undo needs each action to carry enough information to reverse itself — exactly what
      Command provides. The Deque of moves the Game already keeps becomes a stack of command
      objects. Observer distributes news of changes but cannot reverse them; a Singleton
      says nothing about how to undo; Template Method varies steps of one algorithm, not
      reversible actions. Cross-reference the Command write-up in the design-patterns domain
      for the general form.
    ref: "concepts.md#extensibility"

  - id: design-tic-tac-toe-020
    difficulty: advanced
    tags: [undo, edge-cases, encapsulation]
    question: |
      After adding undo, what is the MOST common bug — and the design rule that contains it?
    options:
      - "Stack overflow from deep recursion — fix by rewriting the recursive undo as an explicit loop that pops one move off the history stack per iteration"
      - "Undo runs in O(N^2) because it rebuilds the grid — fix by caching a full board snapshot before every move and restoring the latest one"
      - "The turn pointer advances twice per undo — fix by making Game a static singleton so only one global turn index can ever exist"
      - "Win counters are decremented incorrectly (or not at all) on undo — contain it by keeping ALL counter mutation inside Board.applyMove/undoMove, never in Game"
    answer: 3
    explanation: |
      The O(1) win check works only if the counters exactly mirror the grid. Undo introduces
      the first code path that must DECREMENT them, and if counter updates are scattered
      (some in Game, some in Board), one path will inevitably be missed — producing phantom
      wins later. Encapsulating every increment and decrement behind the Board's two
      mutation methods makes the invariant auditable in one place. The other options invent
      problems this design does not have.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-tic-tac-toe-021
    difficulty: intermediate
    tags: [extensibility, polymorphism, boundaries]
    question: |
      "Now make it two players over a network." What is the correct LLD-level answer?
    options:
      - "Add a RemotePlayer extends Player whose makeMove blocks on a socket/API response — Game is untouched; matchmaking and scaling are HLD concerns to acknowledge and defer"
      - "Rewrite Game itself as a REST controller with one endpoint per move, so the engine parses HTTP requests and serializes the board back to each client"
      - "Give Board its own network listener so remote moves arrive directly at the grid, bypassing Game and letting the socket thread mutate cells in place"
      - "Refuse the question outright — networking is a system-design concern and cannot legitimately be discussed at all inside a low-level design round"
    answer: 0
    explanation: |
      This follow-up tests whether your Player abstraction was real. If Game only ever calls
      player.makeMove(board), a player whose input arrives over a socket is just another
      subtype — the design absorbs the change with zero edits to the engine. Turning Game
      into a controller or wiring the network into Board couples transport to domain logic.
      Server architecture, sessions, and scale genuinely belong to system design, and saying
      where the boundary is (rather than refusing) is the senior move.
    ref: "concepts.md#extensibility"

  - id: design-tic-tac-toe-022
    difficulty: beginner
    tags: [observer-pattern, extensibility]
    question: |
      The interviewer asks for spectators and a move log without Game knowing about either.
      Which pattern applies?
    options:
      - "Strategy — inject a SpectatorStrategy into Game whose algorithm decides which viewers get told about each applied move"
      - "Observer — Game publishes MoveApplied/GameEnded events; UI, loggers, and spectators subscribe"
      - "Decorator — wrap Board in a LoggingBoard that intercepts applyMove and forwards a copy of every change to the spectators"
      - "Factory — create a SpectatorPlayer object for each viewer so the game loop treats watchers as extra non-moving participants"
    answer: 1
    explanation: |
      The requirement is one-to-many notification with the publisher ignorant of its
      subscribers — the textbook Observer scenario (see the design-patterns domain for the
      general form). Strategy varies an algorithm the context calls, which is not the shape
      here. A LoggingBoard decorator could log applies but does not generalize to arbitrary
      subscribers or game-end events, and spectators are not players — they never move.
    ref: "concepts.md#extensibility"

  - id: design-tic-tac-toe-023
    difficulty: intermediate
    tags: [srp, extensibility]
    question: |
      Where should cross-game win/loss statistics live, and why NOT on Player?
    options:
      - "In a separate Scoreboard/GameSeries class that consumes game results — a player identity is not a stats ledger (SRP)"
      - "On Player — it already carries a name and symbol, so accumulating each player's running win/loss totals belongs with that identity"
      - "On Board — it observes every winning move as it lands, so it can tally each symbol's victories across successive games it hosts"
      - "In GameStatus — extend the outcome enum with per-player counters so every terminal value also records the cumulative score"
    answer: 0
    explanation: |
      Bolting mutable, cross-game state onto Player gives it a second reason to change and a
      second lifecycle (stats persist; a game's players may not). A Scoreboard that consumes
      the GameStatus returned by play() keeps the engine pure and the stats concern swappable
      (in-memory, file, DB). Board's scope ends at one grid, and enums are value types — they
      cannot accumulate per-player history.
    ref: "concepts.md#extensibility"

  - id: design-tic-tac-toe-024
    difficulty: advanced
    tags: [concurrency, remote-play]
    question: |
      In the networked variant, two HTTP requests can arrive concurrently — including a
      player moving out of turn. What is the standard pessimistic defense?
    options:
      - "Trust clients to alternate — the UI greys out and disables the move button whenever it is not that player's turn, so bad requests never leave the browser"
      - "Mark the board and turn fields volatile so both request threads always read the freshest game state before deciding whether to apply their move"
      - "Give every Cell its own lock so two concurrent moves targeting different cells can proceed in parallel without ever blocking each other"
      - "Validate move.playerId == currentPlayer inside a synchronized playTurn (or serialize all of a game's moves through one queue)"
    answer: 3
    explanation: |
      Turn enforcement must be checked and applied atomically server-side: hold the game's
      lock, verify the mover is the current player, apply, advance. Client-side button
      state is advisory, not security. Volatile gives visibility but not atomicity — two
      valid-looking moves can still interleave. Per-cell locks miss the point entirely: the
      race is over WHOSE TURN it is, which is game-level state, not cell-level state.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-tic-tac-toe-025
    difficulty: beginner
    tags: [concurrency, scoping]
    question: |
      Should you add synchronized/locks to the single-machine console version of the game?
    options:
      - "Yes — the board and turn pointer are shared mutable state, and any shared mutable state must always be guarded by a lock regardless of how many threads exist"
      - "No — a turn-based console game runs one sequential loop on one thread; volunteering locks signals pattern-matching rather than reasoning. Raise concurrency when the design goes multi-client"
      - "Yes, but only on the Board class, since it is the sole object whose grid and counters are mutated during a move and therefore the only real contention point"
      - "No — because the JVM automatically synchronizes single-threaded game loops for you, inserting the necessary memory barriers behind the scenes at each turn"
    answer: 1
    explanation: |
      Alternation in a single-threaded loop is structural: playTurn cannot race with itself.
      Sprinkling synchronized where no second thread exists adds noise and tells the
      interviewer you apply rules without checking preconditions. The strong move is to say
      "sequential today, and HERE is exactly what changes when players become remote" —
      demonstrating you know when concurrency starts mattering. Option D invents a JVM
      feature that does not exist.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-tic-tac-toe-026
    difficulty: intermediate
    tags: [edge-cases, state]
    question: |
      A stray move arrives after the game has ended. What guard prevents it from corrupting
      a finished board?
    options:
      - "playTurn (and any external move entry point) first checks status == IN_PROGRESS and rejects otherwise"
      - "Board.isFull() will return true once the game ends, so applyMove finds no empty cells and silently no-ops on any later request"
      - "The winning player's object is dereferenced and garbage-collected at game end, so there is no live player left that could submit a move"
      - "Cell states are flipped to immutable automatically the moment checkWin returns true, so the grid physically rejects further writes"
    answer: 0
    explanation: |
      Game status is the authoritative "is play allowed?" gate, and every mutation path must
      consult it. isFull() is insufficient: a game won on move 6 of 9 leaves three empty
      cells that a stray move could happily fill. Nothing deletes player objects, and no
      language freezes your grid for you — immutability-after-end would itself be
      implemented by exactly this status check.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-tic-tac-toe-027
    difficulty: intermediate
    tags: [api-design, testability]
    question: |
      Why should Game.play() RETURN a GameStatus instead of printing the result inside
      the loop?
    options:
      - "Printing to stdout inside the loop is slow synchronous I/O and would measurably degrade the game's per-move performance"
      - "GameStatus is an enum, and enum constants cannot be printed directly without first writing a custom toString override"
      - "Returning the outcome keeps the engine UI-agnostic and testable — a unit test asserts on the returned status, and any front end (console, API, GUI) renders it its own way"
      - "Because void methods cannot be overridden by subclasses in Java, which would block any later GUI front end from customizing play()"
    answer: 2
    explanation: |
      Mixing I/O into the engine welds it to one presentation and forces tests to capture
      stdout. Returning the status (and exposing board state via symbolAt) makes the engine
      a pure, deterministic component: feed it scripted players, assert the outcome. This is
      the same separation that later lets you drop the identical engine behind a REST
      endpoint. The other options are performance folklore or false language claims.
    ref: "concepts.md#api-and-method-signatures"

  - id: design-tic-tac-toe-028
    difficulty: advanced
    tags: [api-design, encapsulation, interface-segregation]
    question: |
      makeMove(Board board) hands the whole mutable Board to every Player, including AI
      strategies. What is the stricter alternative, and what does it buy?
    options:
      - "Pass a fresh deep clone of the entire Board to every player on every turn so their mutations only ever touch a throwaway copy of the grid"
      - "Make all of Board's mutator methods private and have strategies reach the state they need through reflection, bypassing the normal API surface"
      - "Pass the raw underlying Symbol[][] grid array directly to strategies so they can read cells faster without going through any accessor method"
      - "Pass a read-only BoardView interface (symbolAt, size, isValidMove) — strategies can evaluate positions but cannot mutate live game state"
    answer: 3
    explanation: |
      A read-only interface enforces at compile time that thinking cannot alter the game —
      a buggy or malicious strategy simply has no mutator to call. It is also Interface
      Segregation: strategies depend only on the query methods they need. Cloning per turn
      works but costs O(N^2) each move and is a runtime convention rather than a type-level
      guarantee; exposing the raw array is the opposite of encapsulation; reflection is
      absurd. (A strategy that simulates ahead can copy into its OWN scratch board.)
    ref: "concepts.md#api-and-method-signatures"

  - id: design-tic-tac-toe-029
    difficulty: beginner
    tags: [value-objects, api-design]
    question: |
      Why define a small immutable Move(row, col) value object instead of passing two ints
      through every method?
    options:
      - "Two bare ints invite row/col transposition bugs; a named immutable type is self-documenting and works as an element in the move history"
      - "Java cannot pass two primitive int parameters to a single method, so they must be wrapped in one object to be handed over together"
      - "Object references are dereferenced faster than raw primitives on modern JVMs, so a Move wrapper actually speeds up every board access"
      - "Board requires objects as its map keys and primitive ints cannot be stored as keys at all, forcing coordinates into a wrapper type"
    answer: 0
    explanation: |
      applyMove(2, 1) — was that row 2 col 1 or the reverse? A Move record makes the call
      site unambiguous, is trivially immutable, equality-comparable, and slots straight into
      the Deque used for history/undo. The cost is negligible. The other options are false:
      multiple primitive parameters are fine, objects are not faster than primitives, and
      boxing exists — the argument for Move is clarity and safety, not capability.
    ref: "concepts.md#key-design-decisions"

  - id: design-tic-tac-toe-030
    difficulty: intermediate
    tags: [solid, liskov]
    question: |
      The game loop runs identically whether the current player is a HumanPlayer,
      ComputerPlayer, or (later) RemotePlayer — no type checks, no special cases. Which
      SOLID principle is this demonstrating?
    options:
      - "Single Responsibility Principle — the game loop keeps exactly one job, driving turns, and delegates move production entirely to the players"
      - "Liskov Substitution Principle — any Player subtype honors the makeMove contract and can stand in wherever Player is expected"
      - "Interface Segregation Principle — the Player interface exposes only the one makeMove method each subtype actually needs, forcing no unused operations"
      - "Dependency Inversion Principle only — the loop depends on the Player abstraction, and LSP is unrelated to how subtypes behave"
    answer: 1
    explanation: |
      LSP is precisely the property that subtypes are usable through the base abstraction
      without the caller knowing or caring. Each Player subtype takes a board and returns a
      move — differing wildly in HOW (stdin, minimax, socket) while preserving the contract.
      DIP is the sibling principle at work here too (Game depends on the abstraction), but
      the "any subtype works in the loop" phrasing is the textbook statement of LSP, and
      option D's claim that LSP is unrelated to subtyping is backwards.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-tic-tac-toe-031
    difficulty: intermediate
    tags: [solid, dependency-inversion]
    question: |
      ComputerPlayer holds a MoveStrategy interface reference and never names
      RandomStrategy or MinimaxStrategy. Which principle is this, stated precisely?
    options:
      - "Encapsulation — the strategy field is kept private so no outside class can read or replace which algorithm the computer player uses"
      - "Law of Demeter — ComputerPlayer talks only to its immediate collaborator and never reaches through the strategy to touch objects further away"
      - "Open/Closed only — the class is closed to modification and open to new strategies, and no other SOLID principle is involved here at all"
      - "Dependency Inversion — a high-level policy class depends on an abstraction, and concrete strategies also depend on that abstraction, not the other way around"
    answer: 3
    explanation: |
      DIP says high-level modules and low-level details should BOTH depend on abstractions.
      ComputerPlayer (policy: "I move by delegating") knows only MoveStrategy; concrete
      algorithms implement that interface. The dependency arrows all point AT the
      abstraction. This is also what enables OCP (new strategies are additive), but the
      structural statement about the direction of dependencies is DIP. Private fields are
      encapsulation, a different (weaker) claim.
    ref: "concepts.md#key-design-decisions"

  - id: design-tic-tac-toe-032
    difficulty: intermediate
    tags: [requirements, seniority-signal]
    question: |
      Why do strong candidates design for an NxN board and a List of players from minute
      one, even though the interviewer only asked for 3x3 with two players?
    options:
      - "Bigger, more general designs always score higher in LLD rounds regardless of what the interviewer actually asked for"
      - "The literal 3 is a magic number, and magic numbers are strictly forbidden by every mainstream style guide, so it must be parameterized"
      - "It costs essentially the same code (a size parameter, a list, a modulo for turns) and pre-empts the most common follow-up — versus a visible 10-minute live refactor when asked"
      - "Because the counter-based win check only works correctly for boards with N greater than 3, so a 3x3 special case would otherwise be needed"
    answer: 2
    explanation: |
      This generalization is nearly free: Board(size), players.get(current), (current + 1)
      % players.size(). Hard-coding 3 and "playerX/playerO" fields means the inevitable
      "now make it NxN" follow-up triggers a refactor under time pressure — reactive rather
      than anticipatory. Note the limit: generalizing what is CHEAP is senior; speculatively
      building undo, networking, and plugins nobody asked for is over-engineering. Bigger
      is not better; proportionate is better.
    ref: "concepts.md#requirements-clarification"

  - id: design-tic-tac-toe-033
    difficulty: beginner
    tags: [entities, scoping]
    question: |
      How heavyweight does the Cell abstraction need to be in this problem?
    options:
      - "Very thin — a Symbol enum value in a 2-D array is acceptable; a full Cell class adds little for a game whose cell state is a single mark"
      - "Cell must be a full class carrying row, col, current state, and its own observer list so it can notify listeners whenever its mark changes"
      - "Cell should be an interface with separate EmptyCell, XCell, and OCell implementations, one concrete subtype per possible mark a square can hold"
      - "There should be no cell concept at all — store only the ordered list of moves and recompute any square's occupant from that history on demand"
    answer: 0
    explanation: |
      A cell's entire state is one mark, so Symbol[][] captures it exactly; say out loud
      that you would introduce a Cell class only if cells gained behavior (e.g., power-ups,
      per-cell metadata). Subclassing per mark (option C) is enum-as-class-hierarchy
      over-engineering. Storing only a move list (option D) makes every occupancy query
      O(moves) — you would rebuild the grid anyway. Scoping abstraction weight to actual
      behavior is a graded skill here.
    ref: "concepts.md#core-objects-and-entities"

  - id: design-tic-tac-toe-034
    difficulty: intermediate
    tags: [strategy-pattern, trade-offs]
    question: |
      Why is a MoveStrategy interface preferable to a difficulty enum with a switch inside
      ComputerPlayer.makeMove?
    options:
      - "Enum constants cannot be used as the labels of a switch statement, so a difficulty enum could never actually drive the branching in makeMove"
      - "A switch approach fails to compile once it has more than five cases, so it cannot scale past a handful of difficulty levels without breaking"
      - "Interface-based strategy objects use noticeably less heap memory per instance than enum constants, making the design cheaper at runtime"
      - "Every new AI forces edits to the tested makeMove switch (shotgun OCP violations), while Strategy makes each new AI a self-contained, independently testable class"
    answer: 3
    explanation: |
      A two-case switch is honestly fine — say so — but it sets a trajectory: each new
      difficulty re-opens makeMove, mixes all algorithms in one class, and makes unit
      testing one AI mean constructing a ComputerPlayer in the right enum state. Strategy
      inverts this: RandomStrategy and MinimaxStrategy are isolated classes you test
      directly and add without touching existing code. Options A, C, and D are fabricated
      language claims — the real argument is change-impact, not mechanics.
    ref: "concepts.md#key-design-decisions"

  - id: design-tic-tac-toe-035
    difficulty: advanced
    tags: [testing, dependency-injection]
    question: |
      How do you unit-test the Game loop deterministically, given that real players read
      stdin or run randomized AI?
    options:
      - "Use Thread.sleep to wait for human input during tests"
      - "Only test Board — Game is inherently untestable"
      - "Inject scripted fakes through the existing seams: a ComputerPlayer with a fixed-sequence MoveStrategy (or a HumanPlayer fed a scripted InputSource), then assert the returned GameStatus and board state"
      - "Mock the Symbol enum so it always reports a win"
    answer: 2
    explanation: |
      The polymorphic Player and injectable MoveStrategy were built for exactly this: a
      strategy that replays a predetermined move list turns any game — win in a row, win on
      a diagonal, draw on the last cell — into a deterministic script. The engine's
      UI-freedom (play() RETURNS status) makes assertions trivial. If you find the design
      hard to test, that is feedback that a seam is missing — and "how would you test this?"
      is a standard follow-up in this round.
    ref: "concepts.md#common-interview-follow-ups"

  - id: design-tic-tac-toe-036
    difficulty: beginner
    tags: [state, game-loop]
    question: |
      The last empty cell is filled and checkWin returns false. What should Game set its
      status to?
    options:
      - "WIN — the player who placed the mark filling the final cell is awarded the win by default for completing the board"
      - "IN_PROGRESS — leave the status unchanged and keep looping until the two players explicitly agree to stop the game"
      - "Throw an exception — a completely full board that has no winning line is an illegal state that should never be reached"
      - "DRAW — board full with no completed line is the definition of a draw"
    answer: 3
    explanation: |
      Draw is a first-class outcome, not an error: with optimal play, EVERY 3x3 game is a
      draw, so this is the most common terminal state, and the status enum models it
      explicitly (IN_PROGRESS, WIN, DRAW). The check must come after the win check —
      question 13's ordering — because the board-filling move might have completed a line.
      Leaving status IN_PROGRESS would loop forever asking players for moves on a full board.
    ref: "concepts.md#code-skeleton"

  - id: design-tic-tac-toe-037
    difficulty: intermediate
    tags: [validation, responsibilities]
    question: |
      Where does "is this cell in bounds and empty?" validation belong?
    options:
      - "In HumanPlayer only — validation is purely an input-parsing concern, so the class reading stdin should reject bad coordinates before any move object is built"
      - "In Board.isValidMove — the board owns grid state; Game and players call it (Game pre-validating AND applyMove throwing is acceptable belt-and-braces)"
      - "In MoveStrategy — since the AI computes every move it makes, it can never emit an out-of-bounds or occupied square, so the bounds-and-empty check belongs there"
      - "In the Move record's constructor — it holds a Board reference and rejects any out-of-bounds or already-occupied coordinate the instant a move is constructed"
    answer: 1
    explanation: |
      Only the board knows occupancy, so the check must live where the state lives. Putting
      it solely in HumanPlayer leaves AI or remote inputs unchecked; trusting strategies to
      self-validate is hope, not design. Move's constructor can reject negative coordinates
      but cannot know board size or occupancy — a value object should not hold a Board
      reference. Deciding whether invalid input re-prompts (user-error path) or throws
      (programmer contract) — and saying which — is part of the answer.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-tic-tac-toe-038
    difficulty: advanced
    tags: [data-structures, extensibility]
    question: |
      The skeleton keys the win counters by symbol — Map<Symbol, int[]> rowCounts — instead
      of hard-coded fields like xRowCounts and oRowCounts. What does this buy?
    options:
      - "Three or more players (each with their own symbol) work without adding fields or touching checkWin — the counter logic is already per-symbol generic"
      - "Map lookups resolve through a hashed index that is measurably faster than direct array-field access on the JVM's hot path"
      - "Keying by symbol makes the map enforce uniqueness, so two players can never accidentally register and play with the same mark"
      - "It reduces memory because a HashMap omits entries for symbols with zero counts and compresses the unused counter slots"
    answer: 0
    explanation: |
      The "M players on an NxN board" follow-up becomes trivial: add enum values (or
      generalize Symbol to a mark type), and every counter path already works because
      nothing in Board enumerates X and O by name. Hard-coded per-player fields would need
      surgery. Field access is actually FASTER than map lookup — the trade is a negligible
      cost for structural generality. Symbol uniqueness is a separate check at game setup,
      not something a map key provides.
    ref: "concepts.md#code-skeleton"

  - id: design-tic-tac-toe-039
    difficulty: intermediate
    tags: [data-structures, efficiency]
    question: |
      Why does Board track movesCount and implement isFull() as movesCount == size * size,
      rather than scanning the grid for empty cells?
    options:
      - "Scanning the grid to look for empty cells would itself overwrite the sentinel values in those cells, mutating the very state it is trying to read"
      - "The counter-based win check already reads movesCount on every move, so isFull can piggyback on that value and cost nothing extra"
      - "One integer incremented per applyMove makes the draw check O(1) instead of an O(N^2) scan after every move"
      - "A Java 2-D array cannot be safely iterated while the game loop still holds a reference to it, so a full-grid scan is unavailable mid-game"
    answer: 2
    explanation: |
      The draw check runs after every move, so its cost recurs; maintaining a counter costs
      one increment inside the single mutation path (applyMove) and turns the check into an
      integer comparison. It is the same design instinct as the win counters — pay O(1) at
      write time to avoid O(N^2) at read time — applied to a smaller problem. The win check
      itself never consults movesCount, and options A and D are nonsense.
    ref: "concepts.md#code-skeleton"

  - id: design-tic-tac-toe-040
    difficulty: advanced
    tags: [strategy-pattern, scoping, boundaries]
    question: |
      The interviewer asks for an unbeatable AI on a 5x5 board, and you know plain minimax
      will be far too slow. What is the best LLD-round response?
    options:
      - "Implement full unpruned minimax over the entire 5x5 game tree anyway — a correct optimal opponent matters more than how long each move takes to compute"
      - "Refuse the request outright — search algorithms are a coding-round concern and have no legitimate place in an object-oriented design interview"
      - "Replace the whole engine with a lookup table that pre-computes the single best move for every reachable 5x5 board position in advance"
      - "Note that plain minimax explodes beyond 3x3, and add an AlphaBetaStrategy (pruning plus depth-limit with a heuristic) as just another MoveStrategy — the OO seam is the answer, the search details are algorithms territory"
    answer: 3
    explanation: |
      The LLD round grades the SEAM: can new AI sophistication arrive as an additive
      MoveStrategy implementation? Naming alpha-beta pruning and depth-limited evaluation
      shows algorithmic awareness without burning 20 minutes implementing game-tree search
      (that depth belongs to the DSA/coding domain). Grinding out full minimax
      mis-allocates interview time; refusing misses an easy win; a pre-computed table is
      infeasible for 5x5 state spaces and abandons the design question entirely.
    ref: "concepts.md#extensibility"

  - id: design-tic-tac-toe-041
    difficulty: beginner
    tags: [scoping, requirements]
    question: |
      Which of these should you explicitly declare OUT of scope at the start (rather than
      silently skip)?
    options:
      - "GUI frameworks, matchmaking, and networked multiplayer — scoping decisions are graded, so say them out loud"
      - "Move validation — bounds and occupancy can be assumed correct because well-behaved players never submit an illegal square"
      - "The draw condition — the vast majority of Tic-Tac-Toe games end in a win, so a full-board tie is a rare edge case safe to defer"
      - "Turn order — players can be allowed to move whenever they like and the board simply records marks in arrival order"
    answer: 0
    explanation: |
      Verbalizing exclusions shows you see the whole problem space and are choosing, not
      forgetting. GUI, matchmaking, and network transport are real concerns that belong to
      other layers (or to the HLD round) — perfect scope-out candidates. Validation, draws,
      and turn order are the CORE of this problem; skipping any of them is a correctness
      hole, not a scoping choice (and with optimal play every Tic-Tac-Toe game is a draw,
      so option C is doubly wrong).
    ref: "concepts.md#requirements-clarification"

  - id: design-tic-tac-toe-042
    difficulty: intermediate
    tags: [game-loop, edge-cases]
    question: |
      In the skeleton's playTurn, the turn pointer advances ONLY in the final else branch
      (when the game is still in progress). Why not advance unconditionally?
    options:
      - "Advancing the turn pointer is an expensive operation that should be executed as few times as possible to keep each turn fast"
      - "The modulo operation used to wrap the index throws an arithmetic error once the game has reached a terminal WIN or DRAW state"
      - "On a game-ending move there is no next turn — advancing would also make getCurrentPlayer() point past the winner, misreporting who won"
      - "Because the winning player is required to always sit at index 0, the pointer must be reset there rather than advanced on a win"
    answer: 2
    explanation: |
      After WIN or DRAW the loop exits, so the pointer's only remaining job is reporting.
      Keeping it on the player who made the final move means getCurrentPlayer() identifies
      the winner for free. Advancing unconditionally is a classic off-by-one: the "winner"
      your code announces is the player who never got to move. Small conditional, real
      correctness consequence — exactly the kind of detail live-coding rounds expose.
    ref: "concepts.md#code-skeleton"

  - id: design-tic-tac-toe-043
    difficulty: intermediate
    tags: [extensibility, command-pattern, foresight]
    question: |
      The skeleton keeps a Deque of moves even though undo is not yet a requirement. Why is
      this a defensible (not speculative) inclusion?
    options:
      - "The Deque of past moves is what the O(1) counter-based win check reads to decide whether the latest mark completed a line"
      - "Without the move history the game has no way to count how many cells are filled, so it cannot ever detect a draw"
      - "A move history is one field and one push per turn, and it is the seed for undo (Command pattern), replay, and audit — near-zero cost now, named as the hook for known follow-ups"
      - "Keeping a Deque of prior moves lets the board reject any attempt by a player to replay a coordinate they have already used"
    answer: 2
    explanation: |
      The line between foresight and speculation is COST: a history list costs one line and
      creates the data foundation that undo/replay/audit all need, and undo is one of the
      most common follow-ups for this exact problem. Building the full Command machinery
      before it is asked for would cross into speculation. The win check reads counters, not
      history; draw detection reads movesCount; and repeat-move prevention is the occupied-
      cell check, not the history.
    ref: "concepts.md#extensibility"

  - id: design-tic-tac-toe-044
    difficulty: expert
    tags: [concurrency, idempotency, remote-play]
    question: |
      In the networked variant, a client times out and RETRIES its move request, so the
      server receives the same move twice. The first copy was applied. What happens to the
      second, and what does a robust design add?
    options:
      - "The second copy is applied to a second free cell as well, silently giving that player two marks in one turn, and nothing in the design can prevent it"
      - "TCP's sequence-number acknowledgements guarantee exactly-once delivery of the request, so a retried move can never reach the server twice"
      - "The board raises an unrecoverable exception on the duplicate that propagates up and crashes the shared game session for both connected players"
      - "The occupied-cell check rejects the duplicate (the cell is no longer empty), but the client cannot tell 'rejected duplicate' from 'real conflict' — so add an idempotency key or turn number so the retry returns the original success response"
    answer: 3
    explanation: |
      The domain validation happens to catch the replay — the cell is taken — but it
      returns a generic failure for what was actually a success the client never saw. An
      idempotency key (or move sequence number) lets the server recognize the retry and
      replay the original response, which is the standard at-least-once-delivery answer.
      TCP retransmits packets, not application requests across new connections. Note this
      complexity belongs ONLY to the networked variant — do not volunteer it for console play.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-tic-tac-toe-045
    difficulty: intermediate
    tags: [srp, responsibilities, reuse]
    question: |
      What concretely goes wrong if win-detection logic lives in Game instead of Board?
    options:
      - "The win check is forced up to O(N^2) per move because only Board is permitted to declare the counter arrays that make the O(1) check possible"
      - "Java's access rules prevent a Game object from reading the private grid arrays that belong to a separate Board instance"
      - "Board stops being reusable for variants (Connect-K) and for AI position evaluation, and Game accretes grid internals alongside its refereeing job — two reasons to change in one class"
      - "Nothing measurable — which class a piece of logic lives in is a stylistic choice that never affects a design's real qualities"
    answer: 2
    explanation: |
      Game would need to reach into grid state (breaking encapsulation or forcing Board to
      expose internals), and any consumer wanting win detection without a full game — an AI
      strategy evaluating positions, a puzzle validator — would have to drag Game along.
      Meanwhile Game gains a second responsibility and a second reason to change: SRP. The
      complexity is unchanged by placement (Game COULD hold counters — badly), which is why
      the argument is about cohesion and reuse, not big-O.
    ref: "concepts.md#key-design-decisions"

  - id: design-tic-tac-toe-046
    difficulty: expert
    tags: [connect-k, algorithm, win-check]
    question: |
      For the Connect-K variant, the DirectionalScanWinChecker examines the last move at
      (r, c). What is its per-move cost, and how does it work?
    options:
      - "O(N^2) — with no line counters available it must rescan every cell of the whole NxN board after each move to look for a K-run"
      - "O(K) — for each of the 4 line directions (horizontal, vertical, two diagonals), walk up to K-1 cells outward BOTH ways from (r, c), counting consecutive same-symbol cells; win if any direction totals K or more"
      - "O(1) — keep a live counter for every possible fixed K-length window on the board and read only the windows covering (r, c)"
      - "O(N log N) — sort each affected line and binary-search the ordered cells for a contiguous run of K identical symbols"
    answer: 1
    explanation: |
      Consecutiveness is local: a K-run created by this move must pass through (r, c), so
      you count contiguous same-symbol cells in each direction pair (e.g., left+right for
      horizontal, plus the placed cell itself) and stop early at K. Four directions times
      up to 2(K-1) steps is O(K). A whole-board rescan ignores the last-move insight.
      O(1) window counters exist in theory but mean updating O(K) windows per move anyway —
      with far more bookkeeping than the scan they would replace.
    ref: "concepts.md#extensibility"

  - id: design-tic-tac-toe-047
    difficulty: expert
    tags: [concurrency, actor-model, remote-play]
    question: |
      As an alternative to a synchronized playTurn, the server can make each game actor-like.
      What does that mean concretely?
    options:
      - "Each Player object is given its own dedicated thread and the moves from those threads execute in order of the threads' assigned scheduling priority"
      - "The Board is replicated into a separate per-player copy, each mutated independently, and the divergent copies are reconciled and merged only at game end"
      - "All moves for a given game are enqueued and processed by a single worker (one queue per game) — moves within a game are serialized by construction, no locks in the game logic, while different games proceed in parallel"
      - "Every method on the Game class is marked synchronized so only one thread runs game code at a time — that whole-object locking is precisely what the term 'actor' denotes"
    answer: 2
    explanation: |
      The actor model replaces shared-state locking with message serialization: since only
      one thread ever touches a given game's state, the engine code stays lock-free and
      identical to the single-player version — an architecture note worth one sentence in
      the interview. Per-player threads create the very interleaving you must prevent;
      replicated boards belong to distributed-systems territory (and merging two divergent
      Tic-Tac-Toe boards is meaningless); synchronized-everywhere is lock-based, the
      approach actors specifically avoid.
    ref: "concepts.md#concurrency-and-edge-cases"

  - id: design-tic-tac-toe-048
    difficulty: expert
    tags: [concurrency, optimistic, remote-play]
    question: |
      The OPTIMISTIC alternative for out-of-turn protection in the networked variant is:
    options:
      - "Let every submitted move through without checking turn order and reconcile any illegal or interleaved moves by repairing the board once the game ends"
      - "Each move carries the turn number the client believes it is playing (its version of game state) — the server applies the move only if it matches the current turn number, else rejects with the fresh state"
      - "Acquire a distributed lock from a ZooKeeper ensemble before applying each move so no two servers can ever mutate the game state at once"
      - "Have the server round-trip a ping to both connected clients before each turn so all three parties explicitly agree on whose move it is"
    answer: 1
    explanation: |
      This is optimistic concurrency control in miniature: no lock is held while the client
      thinks; a stale or out-of-turn submission fails the version check and the client
      retries with updated state. It mirrors compare-and-swap and HTTP ETag/If-Match
      semantics. Repair-at-end cannot untangle an invalid game; a distributed lock is
      wildly disproportionate for state living on one server (and is pessimistic anyway);
      pre-turn pings add latency and still do not make the apply atomic.
    ref: "concepts.md#concurrency-and-edge-cases"
