topic: "Test Automation in CI/CD & Flaky Tests"
domain: testing
topic_slug: test-automation-in-cicd-and-flaky-tests
version: 1
questions:
  - id: test-automation-in-cicd-and-flaky-tests-001
    difficulty: beginner
    tags: [pipeline, stages, fail-fast]
    question: |
      In a well-designed CI/CD pipeline, why are fast unit tests run before
      slow end-to-end tests?
    options:
      - "Unit tests are the only tests that can fail a build"
      - "So the pipeline fails fast and gives feedback in seconds instead of after the slow suite"
      - "End-to-end tests cannot run on CI machines"
      - "Unit tests must always run in production first"
    answer: 1
    explanation: |
      Ordering stages by speed and cost means the cheapest, most-localised tests
      run first. If they fail, the pipeline stops immediately (fail-fast) and the
      engineer gets a red build in seconds rather than after a long E2E run.
    ref: "concepts.md#test-stages-in-a-cicd-pipeline"

  - id: test-automation-in-cicd-and-flaky-tests-002
    difficulty: beginner
    tags: [flaky, definition]
    question: |
      What is a flaky test?
    options:
      - "A test that always fails"
      - "A test with no assertions"
      - "A test that passes or fails nondeterministically on the same code and inputs"
      - "A test that only runs in production"
    answer: 2
    explanation: |
      A flaky test is nondeterministic: it produces different results on the same
      code and inputs without any change. Its danger is that it destroys trust in
      the suite, so people start ignoring red builds.
    ref: "concepts.md#the-flaky-test-problem"

  - id: test-automation-in-cicd-and-flaky-tests-003
    difficulty: intermediate
    tags: [maven, surefire, failsafe, stages]
    question: |
      In a Maven build, what is the conventional split between the Surefire and
      Failsafe plugins?
    options:
      - "Surefire runs unit tests in the test phase; Failsafe runs integration tests in verify"
      - "Surefire runs integration tests; Failsafe runs unit tests"
      - "They both run the same tests for redundancy"
      - "Surefire compiles code; Failsafe deploys it"
    answer: 0
    explanation: |
      Surefire runs unit tests (e.g. *Test) in the test phase; Failsafe runs
      integration tests (e.g. *IT) in integration-test/verify. Separating them
      lets the pipeline gate on fast unit tests before paying for integration setup.
    ref: "concepts.md#test-stages-in-a-cicd-pipeline"

  - id: test-automation-in-cicd-and-flaky-tests-004
    difficulty: beginner
    tags: [parallelization, sharding]
    question: |
      What is the difference between test parallelization and test sharding?
    options:
      - "They are two names for the same thing"
      - "Parallelization needs more machines; sharding needs more threads"
      - "Sharding is only for unit tests; parallelization only for E2E"
      - "Parallelization runs tests concurrently within one process; sharding splits tests across multiple machines"
    answer: 3
    explanation: |
      Parallelization runs tests concurrently within a single process/machine
      using threads. Sharding (test splitting) partitions the test set across
      multiple machines/agents that each run a disjoint subset, then aggregates.
    ref: "concepts.md#test-parallelization-and-sharding"

  - id: test-automation-in-cicd-and-flaky-tests-005
    difficulty: intermediate
    tags: [parallelization, flaky, isolation]
    question: |
      A suite passes when run serially but fails intermittently when JUnit 5
      parallel execution is enabled. What does this most likely indicate?
    options:
      - "A bug in the JUnit 5 platform"
      - "That parallel execution is never safe"
      - "Latent shared-state or order-dependence coupling between tests"
      - "That the tests need longer Thread.sleep calls"
    answer: 2
    explanation: |
      Parallelization surfaces latent shared mutable state and ordering
      assumptions. A suite that only passes serially was never truly isolated;
      parallelism both speeds up and acts as a flakiness detector.
    ref: "concepts.md#test-parallelization-and-sharding"

  - id: test-automation-in-cicd-and-flaky-tests-006
    difficulty: intermediate
    tags: [junit5, resource-lock, parallelization]
    question: |
      When running JUnit 5 tests in parallel, what is `@ResourceLock` used for?
    options:
      - "To serialise access to a shared resource so parallel tests don't clobber each other"
      - "To speed up tests by allocating more CPU"
      - "To retry failed tests automatically"
      - "To skip tests that use external services"
    answer: 0
    explanation: |
      @ResourceLock serialises access to a shared resource (a static field, a
      system property, a file). It is a workaround; if you must lock everything,
      the real fix is removing the shared state.
    ref: "concepts.md#test-parallelization-and-sharding"

  - id: test-automation-in-cicd-and-flaky-tests-007
    difficulty: beginner
    tags: [quality-gate, build-gate]
    question: |
      What is a build/quality gate in a CI/CD pipeline?
    options:
      - "A firewall rule for the build server"
      - "A pass/fail condition that must be satisfied before code advances (e.g. all tests pass, coverage threshold)"
      - "A tool that formats source code"
      - "A manual step where a manager approves the release"
    answer: 1
    explanation: |
      A gate is an enforced pass/fail condition. The basic gate is "all tests
      pass"; quality gates extend this to metrics like coverage, static-analysis
      violations, mutation score, and security findings.
    ref: "concepts.md#build-gates-and-quality-gates"

  - id: test-automation-in-cicd-and-flaky-tests-008
    difficulty: intermediate
    tags: [coverage, quality-gate, clean-as-you-code]
    question: |
      Why do mature teams often gate coverage on new/changed code rather than on
      the whole repository?
    options:
      - "Because overall coverage cannot be measured"
      - "Because new code never needs testing"
      - "Because a whole-repo threshold is gameable and unfairly punishes legacy code, while gating the diff is actionable"
      - "Because legacy code has no bugs"
    answer: 2
    explanation: |
      A blanket "80% overall" gate is easy to game and blocks work on old code.
      Gating the diff ("clean as you code") makes the requirement fair and
      actionable: you only have to cover what you changed.
    ref: "concepts.md#build-gates-and-quality-gates"

  - id: test-automation-in-cicd-and-flaky-tests-009
    difficulty: intermediate
    tags: [coverage, mutation-testing, pit]
    question: |
      Why is line coverage described as necessary-but-not-sufficient, and what
      complements it?
    options:
      - "Code can be executed (covered) without any assertion checking it; mutation testing (PIT) checks assertions catch injected bugs"
      - "It measures assertion quality directly; nothing complements it"
      - "It only works for unit tests; E2E tests complement it"
      - "It is always 100% so it is meaningless"
    answer: 0
    explanation: |
      Coverage measures which lines executed, not whether anything asserted on
      the result. 100% coverage can still assert nothing. Mutation testing injects
      faults and checks tests fail, verifying the assertions have teeth.
    ref: "concepts.md#build-gates-and-quality-gates"

  - id: test-automation-in-cicd-and-flaky-tests-010
    difficulty: beginner
    tags: [flaky, causes, async]
    question: |
      Which of these is a classic cause of a flaky test?
    options:
      - "Using AssertJ instead of JUnit assertions"
      - "Naming the test method clearly"
      - "Having exactly one assertion per test"
      - "Asserting on the result of an asynchronous operation before it has completed"
    answer: 3
    explanation: |
      Async/timing races are a top cause of flakiness: if the test asserts before
      the async work finishes (or relies on a fixed sleep), it will intermittently
      fail depending on machine speed and scheduling.
    ref: "concepts.md#the-flaky-test-problem"

  - id: test-automation-in-cicd-and-flaky-tests-011
    difficulty: intermediate
    tags: [flaky, thread-sleep, awaitility]
    question: |
      A test calls `service.publish(order); Thread.sleep(100); assertThat(listener.received()).isTrue();`
      and fails intermittently on CI. What is the best fix?
    options:
      - "Increase the sleep to 5000ms"
      - "Wrap the whole test in a retry"
      - "Replace the sleep with a condition-based wait (e.g. Awaitility polling until received() is true, with a bounded timeout)"
      - "Delete the assertion"
    answer: 2
    explanation: |
      A fixed sleep either wastes time or races depending on machine load. A
      condition-based wait (Awaitility) polls for the actual condition up to a
      bounded timeout, making the test both fast and deterministic.
    ref: "concepts.md#the-flaky-test-problem"

  - id: test-automation-in-cicd-and-flaky-tests-012
    difficulty: intermediate
    tags: [flaky, order-dependence]
    question: |
      Test B passes only when Test A runs before it. What category of flakiness
      is this, and how do you expose it?
    options:
      - "Order dependence from leaked state; expose it by randomising test order"
      - "Async timing; expose it with longer sleeps"
      - "A framework bug; expose it by upgrading JUnit"
      - "Coverage gap; expose it with mutation testing"
    answer: 0
    explanation: |
      This is order dependence: A leaves state that B relies on. Randomising test
      execution order (or running in parallel) reliably exposes it; the fix is
      isolating state so each test sets up what it needs.
    ref: "concepts.md#the-flaky-test-problem"

  - id: test-automation-in-cicd-and-flaky-tests-013
    difficulty: intermediate
    tags: [flaky, nondeterminism, iteration-order]
    question: |
      A test asserts a `HashSet`'s contents equal a specific ordered list and
      fails on some JVM runs. What is the root cause and fix?
    options:
      - "The set is too large; use a smaller set"
      - "HashSet is broken; switch to ArrayList in production"
      - "The test needs a retry annotation"
      - "HashSet iteration order is unspecified; assert order-insensitively (e.g. containsExactlyInAnyOrder) or sort first"
    answer: 3
    explanation: |
      HashMap/HashSet iteration order is unspecified and can vary. Asserting on a
      specific order is nondeterministic. Use order-insensitive assertions or sort
      the collection before comparing.
    ref: "concepts.md#the-flaky-test-problem"

  - id: test-automation-in-cicd-and-flaky-tests-014
    difficulty: advanced
    tags: [flaky, external-deps, wiremock]
    question: |
      A unit test occasionally fails because it calls a real third-party HTTP API
      that is rate-limited. Which fix best removes the flakiness while keeping the
      test meaningful?
    options:
      - "Add a 10-second sleep before the call"
      - "Retry the test 5 times until it passes"
      - "Replace the real API with a stub server (e.g. WireMock) so the test controls the response deterministically"
      - "Delete the test because external APIs cannot be tested"
    answer: 2
    explanation: |
      A unit test should not depend on a live external service. Stubbing it with
      WireMock gives deterministic, fast responses and lets you test success and
      error paths without network flakiness or rate limits.
    ref: "concepts.md#the-flaky-test-problem"

  - id: test-automation-in-cicd-and-flaky-tests-015
    difficulty: beginner
    tags: [quarantine, flaky]
    question: |
      What does it mean to quarantine a flaky test?
    options:
      - "Move it out of the blocking gate so it stops failing the mainline, while it still runs/reports and a ticket tracks fixing it"
      - "Delete it permanently"
      - "Run it twice as often"
      - "Convert it to an E2E test"
    answer: 0
    explanation: |
      Quarantine moves a known-flaky test into a non-blocking bucket that still
      runs and reports, so it stops blocking merges while an owned ticket tracks
      fixing or removing it.
    ref: "concepts.md#detecting-and-quarantining-flaky-tests"

  - id: test-automation-in-cicd-and-flaky-tests-016
    difficulty: intermediate
    tags: [flaky, detection, rerun]
    question: |
      Operationally, how does a CI system typically classify a failure as "flaky"?
    options:
      - "The test has more than 50 lines"
      - "The test uses Mockito"
      - "The test name contains the word 'flaky'"
      - "The same commit fails, then passes on rerun with no code change"
    answer: 3
    explanation: |
      Rerun-on-failure analysis is the operational definition: if a test fails and
      then passes on retry against the identical commit, it flipped without a code
      change, so it is flaky.
    ref: "concepts.md#detecting-and-quarantining-flaky-tests"

  - id: test-automation-in-cicd-and-flaky-tests-017
    difficulty: advanced
    tags: [quarantine, process, coverage]
    question: |
      Why is a flaky test left "running but ignored" in the blocking suite worse
      than quarantining it?
    options:
      - "It runs faster when ignored"
      - "It wastes CI time and trains engineers to ignore red, eroding trust in all failures, while the coverage it provides is effectively lost anyway"
      - "Ignored tests automatically delete themselves"
      - "There is no difference"
    answer: 1
    explanation: |
      An ignored-but-running flaky test consumes CI time, blocks or noise-floods
      builds, and teaches people that red means nothing so real regressions get
      missed. Quarantine at least contains the damage under an owned SLA.
    ref: "concepts.md#detecting-and-quarantining-flaky-tests"

  - id: test-automation-in-cicd-and-flaky-tests-018
    difficulty: intermediate
    tags: [retries, unit-tests, smell]
    question: |
      Why is automatically retrying a failing *unit* test usually the wrong fix?
    options:
      - "A flaky unit test signals a determinism bug (shared state, ordering, clock/random) that retrying only hides, making the green build lie"
      - "Unit tests cannot be retried technically"
      - "Retries make unit tests slower than E2E tests"
      - "Retrying deletes the test"
    answer: 0
    explanation: |
      A unit test has no legitimate uncontrolled I/O or concurrency, so flakiness
      is a real determinism bug. Retrying until green hides it and produces a build
      that falsely reports success.
    ref: "concepts.md#retries-a-smell-vs-a-necessity"

  - id: test-automation-in-cicd-and-flaky-tests-019
    difficulty: advanced
    tags: [retries, e2e, pragmatism]
    question: |
      At which layer can a bounded automatic retry be a defensible mitigation
      rather than a pure smell?
    options:
      - "Pure unit tests with no I/O"
      - "Any test, always"
      - "Only tests that assert on time"
      - "E2E/system tests depending on real networks and third parties with irreducible transient failures — paired with flakiness tracking"
    answer: 3
    explanation: |
      At the E2E/network boundary some transient failures are genuinely outside
      your control. A bounded retry there can be pragmatic, but only alongside
      flip-rate tracking so retries stay visible and fixable.
    ref: "concepts.md#retries-a-smell-vs-a-necessity"

  - id: test-automation-in-cicd-and-flaky-tests-020
    difficulty: intermediate
    tags: [retries, visibility, surefire]
    question: |
      A team enables Surefire `rerunFailingTestsCount=3` across the whole suite
      and CI goes green. What is the main hidden risk?
    options:
      - "Tests will run too fast"
      - "Surefire will delete failing tests"
      - "Real intermittent bugs and flakiness are masked, and without recording that retries happened the flip-rate is invisible"
      - "Coverage will drop to zero"
    answer: 2
    explanation: |
      Blanket retries green up the build by hiding both flaky tests and genuine
      intermittent regressions. If retries aren't recorded and tracked, the suite
      silently rots because nobody sees the flip-rate.
    ref: "concepts.md#retries-a-smell-vs-a-necessity"

  - id: test-automation-in-cicd-and-flaky-tests-021
    difficulty: beginner
    tags: [isolation, idempotency, definition]
    question: |
      What does it mean for a test to be isolated?
    options:
      - "Its outcome does not depend on any other test and it leaves no state that affects others"
      - "It runs in a Docker container"
      - "It has no assertions"
      - "It only tests one line of code"
    answer: 0
    explanation: |
      An isolated test's result is independent of other tests and it cleans up
      after itself. Isolation (plus idempotency) is what makes parallelization,
      sharding, retries, and random ordering safe.
    ref: "concepts.md#test-isolation-and-idempotency"

  - id: test-automation-in-cicd-and-flaky-tests-022
    difficulty: intermediate
    tags: [isolation, litmus-test]
    question: |
      What is a practical litmus test for whether your tests are truly isolated?
    options:
      - "Run them once and check they pass"
      - "Check that every test has a comment"
      - "Count the number of assertions"
      - "Run the suite in random order and in parallel — if it still passes, they're isolated"
    answer: 3
    explanation: |
      Random ordering plus parallel execution will flip any test that has hidden
      ordering or shared-state coupling. Surviving both is strong evidence of real
      isolation.
    ref: "concepts.md#test-isolation-and-idempotency"

  - id: test-automation-in-cicd-and-flaky-tests-023
    difficulty: intermediate
    tags: [isolation, tempdir, junit5]
    question: |
      Which JUnit 5 feature gives each test a fresh temporary directory to avoid
      filesystem state leaking between tests?
    options:
      - "@Disabled"
      - "@Tag"
      - "@TempDir"
      - "@Timeout"
    answer: 2
    explanation: |
      @TempDir injects a fresh temporary directory per test (or per class), and
      JUnit cleans it up afterward, so filesystem artifacts don't leak and cause
      order-dependent failures.
    ref: "concepts.md#test-isolation-and-idempotency"

  - id: test-automation-in-cicd-and-flaky-tests-024
    difficulty: advanced
    tags: [isolation, ports, ephemeral]
    question: |
      Two integration tests intermittently fail with "address already in use" on
      a busy CI machine. What is the cleanest fix?
    options:
      - "Bind to port 0 (an ephemeral port) instead of a fixed port"
      - "Add a retry to both tests"
      - "Run the tests only at night"
      - "Increase the JVM heap"
    answer: 0
    explanation: |
      A fixed port collides when another process (or a previous test) holds it.
      Binding to port 0 lets the OS assign a free ephemeral port per test,
      removing the collision and the resulting flakiness.
    ref: "concepts.md#test-isolation-and-idempotency"

  - id: test-automation-in-cicd-and-flaky-tests-025
    difficulty: intermediate
    tags: [determinism, clock, time]
    question: |
      Code under test calls `Instant.now()` directly to compute expiry, making a
      test time-dependent. What is the idiomatic Java fix?
    options:
      - "Sleep in the test until the right time"
      - "Change the system clock on the CI machine"
      - "Assert only on the year"
      - "Inject a java.time.Clock and use Clock.fixed(...) in the test"
    answer: 3
    explanation: |
      Injecting a Clock (Clock.systemUTC() in prod, Clock.fixed(...) in tests)
      makes "now" controllable and expiry logic deterministic, without sleeping or
      depending on wall-clock time.
    ref: "concepts.md#deterministic-tests-controlling-time-randomness-concurrency"

  - id: test-automation-in-cicd-and-flaky-tests-026
    difficulty: intermediate
    tags: [determinism, randomness]
    question: |
      How do you make code that uses randomness testable and deterministic?
    options:
      - "Remove all randomness from the product"
      - "Run the test 100 times and take the majority result"
      - "Inject a seeded Random / RandomGenerator (or an ID supplier) so output is reproducible in tests"
      - "Assert that the output is not null"
    answer: 2
    explanation: |
      Injecting a seeded Random (or a supplier for UUIDs/IDs) makes "random"
      output reproducible under test while remaining random in production, so
      assertions become deterministic.
    ref: "concepts.md#deterministic-tests-controlling-time-randomness-concurrency"

  - id: test-automation-in-cicd-and-flaky-tests-027
    difficulty: beginner
    tags: [determinism, thread-sleep]
    question: |
      Why is `Thread.sleep` in a test considered a flakiness bug?
    options:
      - "It either wastes time or races depending on machine load, so the 'right' duration eventually flips CI"
      - "It is a compile error"
      - "It cannot be used inside JUnit tests"
      - "It makes tests run in parallel automatically"
    answer: 0
    explanation: |
      A fixed sleep is a guess: too long wastes time, too short races. Because the
      needed duration depends on machine load, CI will eventually flip. Use a
      condition-based wait or a controlled clock instead.
    ref: "concepts.md#deterministic-tests-controlling-time-randomness-concurrency"

  - id: test-automation-in-cicd-and-flaky-tests-028
    difficulty: advanced
    tags: [determinism, concurrency, latch]
    question: |
      You need to test that a background task completed. Which approach is
      deterministic rather than timing-based?
    options:
      - "Sleep for 2 seconds then assert"
      - "Assert immediately after starting the task"
      - "Loop forever until the task finishes"
      - "Synchronise on the actual event using a CountDownLatch/CompletableFuture or Awaitility, not wall-clock timing"
    answer: 3
    explanation: |
      Synchronising on the real completion signal (a latch counted down by the
      task, a future, or a polled condition) is deterministic. Asserting on
      elapsed wall-clock time is inherently racy.
    ref: "concepts.md#deterministic-tests-controlling-time-randomness-concurrency"

  - id: test-automation-in-cicd-and-flaky-tests-029
    difficulty: intermediate
    tags: [determinism, locale, timezone]
    question: |
      Tests pass on developer laptops but fail on CI with date/number formatting
      differences. What is a likely cause?
    options:
      - "The CI machine is faster"
      - "The tests inherit the machine's default locale/timezone instead of pinning them"
      - "CI cannot format dates"
      - "The tests use too many assertions"
    answer: 1
    explanation: |
      Locale, timezone, and encoding defaults differ between machines. Inheriting
      them makes tests environment-dependent; pin them explicitly in the test or
      build to get deterministic behaviour everywhere.
    ref: "concepts.md#deterministic-tests-controlling-time-randomness-concurrency"

  - id: test-automation-in-cicd-and-flaky-tests-030
    difficulty: intermediate
    tags: [test-data, hygiene, shared-state]
    question: |
      Why is a single large seeded dataset that many tests both read *and mutate*
      an anti-pattern?
    options:
      - "It creates order dependence and flakiness because one test's mutation affects another"
      - "It uses too much disk"
      - "It cannot be loaded by JUnit"
      - "Shared data is always faster"
    answer: 0
    explanation: |
      Shared mutable data is order-dependence waiting to happen: a test that
      mutates the seed changes what later tests see, producing flaky, order-
      sensitive failures. Prefer each test owning the data it needs.
    ref: "concepts.md#test-data-hygiene"

  - id: test-automation-in-cicd-and-flaky-tests-031
    difficulty: intermediate
    tags: [test-data, parallelism, unique-keys]
    question: |
      Under parallel test execution, why prefer unique/UUID keys over fixed IDs
      like `id = 1` in test data?
    options:
      - "UUIDs are shorter"
      - "The database rejects integer IDs"
      - "UUIDs make tests slower on purpose"
      - "Fixed IDs collide across parallel tests on primary-key/unique constraints; unique keys avoid the collision"
    answer: 3
    explanation: |
      When tests run in parallel against a shared schema, hard-coded IDs collide
      on primary-key or unique constraints. Generating unique keys per test lets
      parallel tests coexist without stepping on each other.
    ref: "concepts.md#test-data-hygiene"

  - id: test-automation-in-cicd-and-flaky-tests-032
    difficulty: intermediate
    tags: [test-data, cleanup, testcontainers]
    question: |
      Which is a clean way to ensure a test doesn't leave database residue for
      the next test?
    options:
      - "Never insert any rows"
      - "Assert nothing"
      - "Roll back the transaction, truncate tables, or discard the Testcontainers container per class"
      - "Rely on the next test to clean up"
    answer: 2
    explanation: |
      Clean boundaries mean each test rolls back, truncates, or throws away its
      container so no residue affects the next test. Relying on the next test to
      clean up is exactly how order dependence creeps in.
    ref: "concepts.md#test-data-hygiene"

  - id: test-automation-in-cicd-and-flaky-tests-033
    difficulty: beginner
    tags: [reporting, junit-xml]
    question: |
      What format is the de facto standard that most CI systems, IDEs, and
      reporting tools consume to display test results?
    options:
      - "JUnit XML"
      - "PDF"
      - "CSV"
      - "Markdown"
    answer: 0
    explanation: |
      JUnit XML (originally from Ant) is the lingua franca for test results. Nearly
      every CI system and tool ingests it to show test counts, durations,
      failures, and stack traces.
    ref: "concepts.md#test-result-reporting-and-trends"

  - id: test-automation-in-cicd-and-flaky-tests-034
    difficulty: intermediate
    tags: [reporting, trends, flip-rate]
    question: |
      Why do mature teams track test *trends* (pass rate, duration, per-test
      flip-rate) rather than just each run's red/green?
    options:
      - "Trends look nicer in dashboards"
      - "Trends replace the need for assertions"
      - "CI cannot show a single run"
      - "Snapshots miss slow degradation and flaky tests that trends over time reveal, enabling data-driven decisions"
    answer: 3
    explanation: |
      A single run hides gradual slowdown and intermittent flakiness. Tracking
      pass rate, suite duration, and per-test flip-rate over time exposes these and
      makes quarantine/speedup decisions data-driven.
    ref: "concepts.md#test-result-reporting-and-trends"

  - id: test-automation-in-cicd-and-flaky-tests-035
    difficulty: intermediate
    tags: [reporting, slow-tests, tail]
    question: |
      Why is a "slowest tests" report especially valuable for optimising suite
      time?
    options:
      - "Slow tests have the most bugs"
      - "A small fat tail of very slow tests usually dominates wall-clock time, so that's where speedups pay off most"
      - "Fast tests can be deleted"
      - "It identifies which tests to retry"
    answer: 1
    explanation: |
      Suite time is typically dominated by a handful of very slow tests. Profiling
      the slowest tests tells you exactly where to invest optimisation effort for
      the biggest wall-clock gain.
    ref: "concepts.md#test-result-reporting-and-trends"

  - id: test-automation-in-cicd-and-flaky-tests-036
    difficulty: beginner
    tags: [pr-build, gate, branch-protection]
    question: |
      What is the purpose of running tests on a pull request (pre-merge build)?
    options:
      - "To catch regressions before code reaches the mainline, enforced via required checks/branch protection"
      - "To deploy the PR to production"
      - "To rename the branch"
      - "To generate documentation"
    answer: 0
    explanation: |
      The PR build is the primary quality gate: it runs enough of the suite to
      catch regressions before merge, and required status checks / branch
      protection make passing it mandatory.
    ref: "concepts.md#running-tests-on-pull-requests"

  - id: test-automation-in-cicd-and-flaky-tests-037
    difficulty: intermediate
    tags: [pr-build, right-sizing, e2e]
    question: |
      Why do many teams run unit and integration tests on every PR but push the
      slowest E2E/soak suites to post-merge or nightly runs?
    options:
      - "E2E tests are unimportant"
      - "E2E tests cannot run on PRs"
      - "Nightly runs are more accurate"
      - "Blocking every PR on a long E2E run would kill developer throughput, so slow suites move off the PR-blocking path"
    answer: 3
    explanation: |
      The PR build trades coverage against speed. Fast, reliable tests belong in
      the blocking gate; blocking every PR on a 45-minute E2E run stalls everyone,
      so those run post-merge or nightly.
    ref: "concepts.md#running-tests-on-pull-requests"

  - id: test-automation-in-cicd-and-flaky-tests-038
    difficulty: advanced
    tags: [pr-build, merge-queue]
    question: |
      What class of failure does a merge queue catch that a plain per-PR build
      can miss?
    options:
      - "Compilation errors in a single PR"
      - "Semantic/logical conflicts where each PR is green alone but they break when combined into the actual merged result"
      - "Formatting issues"
      - "Missing test annotations"
    answer: 1
    explanation: |
      A merge queue re-runs tests against the actual merged result of queued PRs,
      catching semantic merge conflicts and logical races where each PR passes in
      isolation but the combination breaks.
    ref: "concepts.md#running-tests-on-pull-requests"

  - id: test-automation-in-cicd-and-flaky-tests-039
    difficulty: intermediate
    tags: [pr-build, flaky, blocking]
    question: |
      Why must PR-blocking (required) checks be the *most* trustworthy tests in
      the suite?
    options:
      - "Because a flaky required check blocks unrelated PRs, stalling the whole team"
      - "Because they run last"
      - "Because they run in production"
      - "Because they don't need assertions"
    answer: 0
    explanation: |
      A flaky test in a required check fails PRs that have nothing to do with it,
      blocking everyone. That's why flaky tests hit hardest here and why blocking
      suites must be the most reliable (hence quarantine).
    ref: "concepts.md#running-tests-on-pull-requests"

  - id: test-automation-in-cicd-and-flaky-tests-040
    difficulty: intermediate
    tags: [slow-suite, feedback-loop, cost]
    question: |
      How does a slow test suite directly degrade software quality, beyond being
      annoying?
    options:
      - "It makes tests more accurate"
      - "It improves coverage"
      - "It has no effect on quality"
      - "It breaks the feedback loop and drives gate avoidance — engineers batch changes, stop running tests locally, and override slow gates under pressure"
    answer: 3
    explanation: |
      Slow feedback means bugs are found later in bigger batches, and slow gates
      get bypassed exactly when the team is under pressure. Both push defects
      downstream, plus the recurring CI compute bill.
    ref: "concepts.md#the-cost-of-slow-test-suites"

  - id: test-automation-in-cicd-and-flaky-tests-041
    difficulty: intermediate
    tags: [slow-suite, pyramid, levers]
    question: |
      A team's suite is slow because it is dominated by end-to-end tests. What is
      the highest-leverage structural fix?
    options:
      - "Add more E2E tests"
      - "Rebalance the pyramid by pushing logic down into fast unit tests"
      - "Delete all tests"
      - "Run E2E tests twice"
    answer: 1
    explanation: |
      An E2E-heavy suite is an inverted pyramid. Moving logic coverage down into
      fast, isolated unit tests (and keeping a thin E2E layer) is the highest-
      leverage way to speed things up and reduce flakiness.
    ref: "concepts.md#the-cost-of-slow-test-suites"

  - id: test-automation-in-cicd-and-flaky-tests-042
    difficulty: advanced
    tags: [slow-suite, testcontainers, fixtures]
    question: |
      An integration suite starts a fresh Postgres Testcontainer for every test
      method, making it slow. What optimisation preserves correctness while
      cutting time?
    options:
      - "Share one container across the test class (static @Container) and/or use container reuse, resetting data per test"
      - "Mock the database instead"
      - "Run each test on its own machine"
      - "Remove the database tests"
    answer: 0
    explanation: |
      Container startup is the expensive part. Reusing a static per-class container
      (or Testcontainers reuse) while resetting data per test keeps isolation at
      the data level while amortising the startup cost.
    ref: "concepts.md#the-cost-of-slow-test-suites"

  - id: test-automation-in-cicd-and-flaky-tests-043
    difficulty: beginner
    tags: [tia, selective-runs, definition]
    question: |
      What is test impact analysis (predictive test selection)?
    options:
      - "Running the full suite twice"
      - "Analysing which tests are flaky"
      - "Measuring code coverage"
      - "Running only the tests affected by a change, using a map from production code to the tests that exercise it"
    answer: 3
    explanation: |
      TIA runs only tests affected by the changed code, using a code-to-test
      mapping (from coverage data and/or ML models over history). On large repos it
      can cut PR test time dramatically.
    ref: "concepts.md#test-impact-analysis-and-selective-test-runs"

  - id: test-automation-in-cicd-and-flaky-tests-044
    difficulty: advanced
    tags: [tia, soundness, safety-net]
    question: |
      What is the key soundness risk of test impact analysis, and how do teams
      mitigate it?
    options:
      - "It runs too many tests; mitigate by disabling it"
      - "An incomplete code-to-test mapping (reflection, config, dynamic wiring) can skip a test that would catch the bug; mitigate by running the full suite post-merge/nightly"
      - "It only works on unit tests; mitigate with more E2E tests"
      - "It requires 100% coverage; mitigate by lowering the threshold"
    answer: 1
    explanation: |
      If the mapping misses an affected test (indirect coupling, reflection,
      dynamic config), TIA can skip a test that would have caught a regression.
      Running the full suite on a schedule acts as a safety net.
    ref: "concepts.md#test-impact-analysis-and-selective-test-runs"

  - id: test-automation-in-cicd-and-flaky-tests-045
    difficulty: intermediate
    tags: [tia, when-to-use]
    question: |
      For which situation is test impact analysis generally NOT worth the
      complexity?
    options:
      - "A small, fast suite where you can just run everything"
      - "A large monorepo with a huge, slow suite"
      - "A repo with thousands of integration tests"
      - "A pipeline where PR time is the bottleneck"
    answer: 0
    explanation: |
      For a small fast suite, the mapping overhead and soundness risk aren't worth
      it — just run everything. TIA earns its keep on large suites where full runs
      are prohibitively slow.
    ref: "concepts.md#test-impact-analysis-and-selective-test-runs"

  - id: test-automation-in-cicd-and-flaky-tests-046
    difficulty: advanced
    tags: [tia, safety, completeness]
    question: |
      Why should test impact analysis never be the *only* mechanism that ever
      runs your full test suite?
    options:
      - "Because full runs are illegal"
      - "Because a stale or incomplete selection mapping could otherwise let regressions through indefinitely without ever being caught"
      - "Because TIA is always 100% accurate"
      - "Because the full suite is redundant"
    answer: 1
    explanation: |
      Selective runs trade completeness for speed. If TIA is the only thing that
      ever runs, a stale/incomplete mapping can silently let regressions slip
      through forever. Scheduling a full run guarantees eventual full coverage.
    ref: "concepts.md#test-impact-analysis-and-selective-test-runs"

  - id: test-automation-in-cicd-and-flaky-tests-047
    difficulty: advanced
    tags: [flaky, diagnosis, scenario]
    question: |
      A CI failure appears once, then the identical commit passes on a manual
      re-run. Before quarantining, what is the correct first conclusion?
    options:
      - "It is definitely a real regression; block the release"
      - "The compiler is broken"
      - "It flipped without a code change, so it is flaky — investigate the determinism root cause and track its flip-rate"
      - "The test should be deleted immediately"
    answer: 2
    explanation: |
      A flip on the identical commit with no change is the operational signature of
      flakiness (not a real regression). The next steps are tracking flip-rate and
      hunting the determinism root cause, with quarantine to unblock others.
    ref: "concepts.md#detecting-and-quarantining-flaky-tests"

  - id: test-automation-in-cicd-and-flaky-tests-048
    difficulty: intermediate
    tags: [determinism, root-cause, summary]
    question: |
      Across most flaky tests, what single principle best summarises the cure?
    options:
      - "Add more retries"
      - "Make tests deterministic by controlling time, randomness, ordering, shared state, concurrency, and external I/O"
      - "Increase all timeouts"
      - "Run tests only serially forever"
    answer: 1
    explanation: |
      Flakiness is fundamentally nondeterminism. The durable fix is to control the
      sources of nondeterminism — time, randomness, ordering, shared state,
      concurrency, and external dependencies — rather than papering over them with
      retries or sleeps.
    ref: "concepts.md#deterministic-tests-controlling-time-randomness-concurrency"
