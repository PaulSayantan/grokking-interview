topic: "Mockito & Stubbing Frameworks"
domain: testing
topic_slug: mockito-and-stubbing-frameworks
version: 1
questions:
  - id: mockito-and-stubbing-frameworks-001
    difficulty: beginner
    tags: [mock, basics]
    question: |
      What does an unstubbed method on a plain Mockito `mock(Foo.class)` return by
      default when called?
    options:
      - "It throws UnsupportedOperationException because unstubbed methods are left unimplemented"
      - "The type's default value — null for objects, 0/false for primitives, empty for collections/Optional"
      - "It calls the real implementation on the underlying class, exactly as a spy would by default"
      - "It returns a randomly generated value seeded from the method's declared return type"
    answer: 1
    explanation: |
      Mockito's default answer (RETURNS_DEFAULTS) returns type defaults: null for
      object references, 0/false for primitives, and empty collections/Optional
      rather than null for those types. No real code runs on a mock.
    ref: "concepts.md#mock-spy-and-the-role-of-a-mocking-framework"

  - id: mockito-and-stubbing-frameworks-002
    difficulty: beginner
    tags: [spy, mock, difference]
    question: |
      What is the key difference between `mock(List.class)` and `spy(new ArrayList<>())`?
    options:
      - "A spy runs the real method unless stubbed; a mock never runs real code"
      - "A mock runs real code unless stubbed; a spy never runs real code"
      - "There is no difference; spy is simply an alias method for mock"
      - "A spy can only be used for final classes, while mock handles the rest"
    answer: 0
    explanation: |
      A spy wraps a real instance and delegates to real methods unless you stub them.
      A pure mock has no real behavior at all — every method returns a default until
      stubbed.
    ref: "concepts.md#mock-spy-and-the-role-of-a-mocking-framework"

  - id: mockito-and-stubbing-frameworks-003
    difficulty: beginner
    tags: [junit5, extension, setup]
    question: |
      In JUnit 5, what is the idiomatic way to have `@Mock`, `@Spy`, and `@InjectMocks`
      annotations processed?
    options:
      - "@RunWith(MockitoJUnitRunner.class)"
      - "Nothing — JUnit 5 processes them automatically"
      - "@ExtendWith(MockitoExtension.class)"
      - "@MockitoTest on each field"
    answer: 2
    explanation: |
      MockitoExtension is the JUnit 5 integration that initializes annotated mocks
      before each test and applies strict-stubs by default. MockitoJUnitRunner is
      JUnit 4 only.
    ref: "concepts.md#creating-mocks-mock-spy-injectmocks-and-mockitoextension"

  - id: mockito-and-stubbing-frameworks-004
    difficulty: beginner
    tags: [stubbing, when-thenreturn]
    question: |
      Which statement stubs `repo.findById(1L)` to return an Optional containing a user?
    options:
      - "when(repo.findById(1L)).thenReturn(Optional.of(user))"
      - "verify(repo).findById(1L).thenReturn(Optional.of(user))"
      - "stub(repo.findById(1L), Optional.of(user))"
      - "repo.findById(1L).returns(Optional.of(user))"
    answer: 0
    explanation: |
      The canonical stubbing form is `when(mock.method(args)).thenReturn(value)`.
      `verify` is for interaction checking, not stubbing.
    ref: "concepts.md#stubbing-with-whenthenreturn-thenthrow-and-thenanswer"

  - id: mockito-and-stubbing-frameworks-005
    difficulty: intermediate
    tags: [matchers, mixing-rule]
    question: |
      Why does `when(repo.update(1L, any())).thenReturn(true)` throw
      InvalidUseOfMatchersException?
    options:
      - "any() is not a valid matcher for boxed object types like Long, only primitives"
      - "thenReturn cannot be combined with argument matchers; only doReturn supports them"
      - "You mixed a raw value (1L) with a matcher (any()); all arguments must be matchers or all raw"
      - "update() returns a primitive, so it must be stubbed with doReturn rather than when"
    answer: 2
    explanation: |
      If any argument uses a matcher, all arguments must use matchers. Wrap the literal
      in eq(): `when(repo.update(eq(1L), any()))`. Matchers work via a thread-local
      stack, so mixing raw values corrupts the count.
    ref: "concepts.md#argument-matchers-and-the-cant-mix-raw-and-matchers-rule"

  - id: mockito-and-stubbing-frameworks-006
    difficulty: intermediate
    tags: [spy, doreturn, gotcha]
    question: |
      On a `spy(new ArrayList<>())`, `when(spy.get(0)).thenReturn("x")` throws
      IndexOutOfBoundsException during setup. What is the correct fix?
    options:
      - "Guard the get(0) call with a try/catch"
      - "Use verify rather than when here"
      - "Reset the spy first with reset()"
      - "Use doReturn(\"x\").when(spy).get(0)"
    answer: 3
    explanation: |
      `when(spy.get(0))` evaluates spy.get(0) for real (empty list -> exception) before
      the stub is installed. The `doReturn(...).when(spy).get(0)` form never calls the
      real method, so it is safe on spies and for void methods.
    ref: "concepts.md#spies-partial-mocking-and-the-doreturn-vs-when-gotcha"

  - id: mockito-and-stubbing-frameworks-007
    difficulty: intermediate
    tags: [strictness, unnecessary-stubbing]
    question: |
      Under the default STRICT_STUBS strictness of MockitoExtension, what happens if you
      declare a stub that no code path ever calls?
    options:
      - "Nothing happens; unused stubs are silently ignored under every strictness level"
      - "The whole test is skipped and reported as ignored in the results"
      - "A warning is logged to stderr but the test itself still passes"
      - "The test fails with UnnecessaryStubbingException"
    answer: 3
    explanation: |
      STRICT_STUBS fails the test with UnnecessaryStubbingException for stubs that are
      never exercised, catching dead/copy-pasted stubs. The fix is usually to delete
      the stub, not to make it lenient.
    ref: "concepts.md#strictness-strict_stubs-and-unnecessarystubbingexception"

  - id: mockito-and-stubbing-frameworks-008
    difficulty: intermediate
    tags: [captor, verification]
    question: |
      You want to assert on an Order object that the service constructs internally and
      passes to `repo.save(...)`. Which Mockito feature captures it for later assertions?
    options:
      - "ArgumentCaptor with verify(repo).save(captor.capture())"
      - "verifyNoMoreInteractions(repo) to snapshot the last saved argument"
      - "when(repo.save(any())).thenReturn(order) to echo the constructed value"
      - "spy(repo) so the real save records the argument for you"
    answer: 0
    explanation: |
      An ArgumentCaptor grabs the actual argument passed to a mock so you can assert on
      its fields after the call. Use captor.capture() inside verify, then
      captor.getValue().
    ref: "concepts.md#capturing-arguments-with-argumentcaptor"

  - id: mockito-and-stubbing-frameworks-009
    difficulty: beginner
    tags: [bddmockito, syntax]
    question: |
      In BDDMockito, which method is the equivalent of Mockito's `when(...).thenReturn(...)`?
    options:
      - "expect(...).andReturn(...)"
      - "stub(...).returns(...)"
      - "given(...).willReturn(...)"
      - "verify(...).returns(...)"
    answer: 2
    explanation: |
      BDDMockito renames the API to given/willReturn (and then().should() for verify)
      to match BDD's given/when/then vocabulary. It is purely a syntactic alias — no
      behavioral difference.
    ref: "concepts.md#bddmockito-givenwillreturn"

  - id: mockito-and-stubbing-frameworks-010
    difficulty: intermediate
    tags: [what-not-to-mock, value-object]
    question: |
      Which of the following is generally the WORST candidate to replace with a Mockito
      mock?
    options:
      - "A slow database repository"
      - "An external payment gateway client"
      - "A value object such as a Money or LocalDate"
      - "A clock that returns the current time"
    answer: 2
    explanation: |
      Value objects have no meaningful behavior to fake and are cheap to construct; use
      the real object. Slow/nondeterministic/side-effecting collaborators (DB, gateway,
      clock) are the good mocking candidates.
    ref: "concepts.md#what-not-to-mock"

  - id: mockito-and-stubbing-frameworks-011
    difficulty: intermediate
    tags: [mocking-statics, mockito5]
    question: |
      In Mockito 5.x, what do you need to add to mock a static method with mockStatic()?
    options:
      - "Nothing extra — the inline mock-maker is the default in Mockito 5"
      - "The separate mockito-inline artifact, still required as it was on Mockito 2-4"
      - "The powermock-module-junit5 bridge artifact to enable static interception"
      - "A -Dmockito.static=true JVM flag passed at test launch to arm the agent"
    answer: 0
    explanation: |
      Mockito 5 made the inline (ByteBuddy bytecode) mock-maker the default, so
      mockito-core alone can mock statics, finals, and constructors. On Mockito 2-4 you
      added the separate mockito-inline artifact.
    ref: "concepts.md#mocking-statics-finals-and-constructors"

  - id: mockito-and-stubbing-frameworks-012
    difficulty: beginner
    tags: [verify, times]
    question: |
      What does `verify(repo).save(order)` assert by default?
    options:
      - "That save was called at least once, regardless of the argument passed"
      - "That save returns order to the caller when it is invoked"
      - "That save was never called at any point during the test"
      - "That save was called exactly once with an argument equal to order"
    answer: 3
    explanation: |
      A bare verify defaults to times(1) — exactly one call with matching arguments
      (compared by equals). Use times(n), never(), atLeast(), etc. to change the count.
    ref: "concepts.md#verifying-interactions-times-never-atleast-inorder"

  - id: mockito-and-stubbing-frameworks-013
    difficulty: intermediate
    tags: [stubbing, thenanswer, thenreturn]
    question: |
      You need a mock `repo.save(user)` to return the same user it was given, but with an
      id set. Which stubbing approach is appropriate?
    options:
      - "thenReturn(user.withId(42L)) evaluated once at stub time"
      - "thenAnswer(inv -> inv.getArgument(0).withId(42L))"
      - "thenThrow(new IllegalStateException())"
      - "doNothing().when(repo).save(user)"
    answer: 1
    explanation: |
      thenAnswer runs a lambda on each call and can read the actual arguments via
      inv.getArgument(0), making it ideal for echo/identity behavior. thenReturn fixes a
      value at stub time and can't reflect the call's inputs.
    ref: "concepts.md#stubbing-with-whenthenreturn-thenthrow-and-thenanswer"

  - id: mockito-and-stubbing-frameworks-014
    difficulty: intermediate
    tags: [void, stubbing, do-family]
    question: |
      How do you stub a `void` method `mock.notify(id)` to throw an exception?
    options:
      - "doThrow(ex).when(mock).notify(id)"
      - "when(mock.notify(id)).thenThrow(ex)"
      - "verify(mock).notify(id).thenThrow(ex)"
      - "mock.notify(id).throws(ex)"
    answer: 0
    explanation: |
      void methods can't be used inside when(...) because there is no return value to
      pass. Use the do-family: doThrow(ex).when(mock).notify(id) (or doNothing,
      doAnswer).
    ref: "concepts.md#stubbing-with-whenthenreturn-thenthrow-and-thenanswer"

  - id: mockito-and-stubbing-frameworks-015
    difficulty: intermediate
    tags: [injectmocks, gotcha]
    question: |
      An `@InjectMocks` field ends up null and the test fails with an NPE at runtime.
      What is the most likely cause?
    options:
      - "Mockito always requires setter injection and ignores constructor arguments"
      - "Mockito couldn't match a dependency by type/name, and injection fails silently"
      - "@InjectMocks only works with @Spy fields, never with plain @Mock ones"
      - "The target class must be abstract for injection to be attempted at all"
    answer: 1
    explanation: |
      @InjectMocks does not fail loudly when it can't wire a field — it leaves it null,
      producing an NPE later. Same-type fields fall back to name matching. Prefer
      constructor injection and plain new in tests to avoid the magic.
    ref: "concepts.md#creating-mocks-mock-spy-injectmocks-and-mockitoextension"

  - id: mockito-and-stubbing-frameworks-016
    difficulty: intermediate
    tags: [matchers, null, anystring]
    question: |
      In Mockito 2+, does `anyString()` match a `null` argument?
    options:
      - "Yes, anyString() matches null as well as any actual String value"
      - "Only for the first argument position in the stubbed call"
      - "Only when the mock's strictness level is set to LENIENT"
      - "No — anyString() does not match null; use nullable(String.class) or isNull()"
    answer: 3
    explanation: |
      Since Mockito 2, type-specific matchers like anyString()/anyList() do NOT match
      null. Use nullable(String.class) or isNull() for nullable arguments. Bare any()
      (no class) does match null.
    ref: "concepts.md#argument-matchers-and-the-cant-mix-raw-and-matchers-rule"

  - id: mockito-and-stubbing-frameworks-017
    difficulty: intermediate
    tags: [verify, inorder]
    question: |
      You must assert that `gateway.charge()` is called before `repo.save()`. Which tool
      enforces call ordering across mocks?
    options:
      - "verify(gateway).charge(); verify(repo).save(); the source-code order is enforced by Mockito"
      - "verifyNoMoreInteractions(gateway, repo) checks that the two calls happened in declaration order"
      - "InOrder inOrder = inOrder(gateway, repo); inOrder.verify(gateway).charge(); inOrder.verify(repo).save();"
      - "verify(gateway, atLeastOnce()).charge() implicitly requires it to precede the repo.save() call"
    answer: 2
    explanation: |
      Plain verify calls do not check order. An InOrder object verifies interactions in
      the specified sequence and fails if save happened before charge.
    ref: "concepts.md#verifying-interactions-times-never-atleast-inorder"

  - id: mockito-and-stubbing-frameworks-018
    difficulty: advanced
    tags: [matchers, mechanism]
    question: |
      Why can't you extract a matcher into a local variable and reuse it, e.g.
      `var m = anyString(); when(mock.f(m, m))...`?
    options:
      - "Matcher objects are declared final by Mockito and cannot be assigned to a variable"
      - "Matchers register side effects on a thread-local stack in call order; reusing one desynchronizes the stack from the argument list"
      - "any() returns null at call time, so both arguments would silently collapse to null"
      - "It actually works fine and reusing a stored matcher is the recommended idiomatic style"
    answer: 1
    explanation: |
      Each matcher call pushes onto a thread-local stack that Mockito pops in argument
      order when the stubbed method is invoked. Reusing a stored matcher or mixing raw
      values breaks the one-push-per-argument invariant.
    ref: "concepts.md#argument-matchers-and-the-cant-mix-raw-and-matchers-rule"

  - id: mockito-and-stubbing-frameworks-019
    difficulty: intermediate
    tags: [strictness, lenient]
    question: |
      A shared setup stub is used by only some parameterized cases, tripping
      UnnecessaryStubbingException. What is the least-bad way to keep it while staying
      strict elsewhere?
    options:
      - "Switch the whole project to Strictness.LENIENT so no stub is ever flagged as unused"
      - "Delete the stub entirely, since any stub not exercised by every case is dead code"
      - "Mark just that stub lenient: lenient().when(...).thenReturn(...)"
      - "Wrap the stub in a try/catch so the UnnecessaryStubbingException gets swallowed"
    answer: 2
    explanation: |
      lenient() relaxes strictness for a single stub while the rest of the test stays
      STRICT_STUBS. Downgrading the whole project loses the protection. Deleting is right
      only if the stub is truly dead.
    ref: "concepts.md#strictness-strict_stubs-and-unnecessarystubbingexception"

  - id: mockito-and-stubbing-frameworks-020
    difficulty: advanced
    tags: [spy, self-invocation]
    question: |
      A real method `a()` internally calls `this.b()`. You spy the object and stub
      `spy.b()`. Does the stub affect the internal call made by `a()`?
    options:
      - "Yes — Mockito intercepts all calls including internal ones"
      - "Only under the inline mock-maker, which rewrites this-references to point at the spy"
      - "Only if b() is declared public, since Mockito cannot intercept package-private self-calls"
      - "No — self-invocation calls the real this.b(), bypassing the spy's stub"
    answer: 3
    explanation: |
      A spy can only intercept calls made through the spy reference. When the real a()
      calls this.b(), it invokes the real method on the real object, not the spy, so the
      stub has no effect. This is a classic spy limitation.
    ref: "concepts.md#spies-partial-mocking-and-the-doreturn-vs-when-gotcha"

  - id: mockito-and-stubbing-frameworks-021
    difficulty: beginner
    tags: [verify, never]
    question: |
      Which verification asserts that `repo.delete(any())` was never called?
    options:
      - "verify(repo, atLeastOnce()).delete(any())"
      - "verifyNoMoreInteractions(repo)"
      - "verify(repo, never()).delete(any())"
      - "verify(repo).delete(any())"
    answer: 2
    explanation: |
      never() is equivalent to times(0) and asserts the method was never invoked with
      matching arguments.
    ref: "concepts.md#verifying-interactions-times-never-atleast-inorder"

  - id: mockito-and-stubbing-frameworks-022
    difficulty: intermediate
    tags: [what-not-to-mock, dont-own]
    question: |
      Following "don't mock what you don't own," how should you unit-test code that calls
      a third-party HTTP client library?
    options:
      - "Mock the third-party client class directly in every unit test so the network is never touched"
      - "Wrap it behind an adapter interface you own, mock the adapter in unit tests, and cover the adapter with an integration/contract test"
      - "Leave that code untested and rely on the library vendor's own published test suite instead"
      - "Only test it end-to-end against the real service, spinning up the dependency for every run"
    answer: 1
    explanation: |
      Mocking a third-party type bakes your assumptions about its behavior into tests
      that stay green even when the library behaves differently. Wrap it in an
      owned adapter, mock that, and verify the adapter against reality with an
      integration/contract test.
    ref: "concepts.md#what-not-to-mock"

  - id: mockito-and-stubbing-frameworks-023
    difficulty: advanced
    tags: [mocking-statics, scope, flaky]
    question: |
      What is the critical requirement when using `mockStatic(UUID.class)` to avoid
      cross-test contamination and flaky failures?
    options:
      - "Register it in a static field shared across the class so every test reuses one stub"
      - "Use it inside a try-with-resources so the static stub is deregistered when the block ends"
      - "Call Mockito.reset() from an Object.finalize() override to unregister the stub at GC time"
      - "Mark the test @Isolated so JUnit runs it in its own forked JVM away from the others"
    answer: 1
    explanation: |
      MockedStatic is scoped and thread-local. Using try-with-resources (or explicit
      close) tears the stub down at block end so it doesn't leak into other tests. A
      leaked static mock is a classic source of flaky, order-dependent failures.
    ref: "concepts.md#mocking-statics-finals-and-constructors"

  - id: mockito-and-stubbing-frameworks-024
    difficulty: intermediate
    tags: [stubbing, consecutive]
    question: |
      What does `when(gw.charge(any())).thenThrow(new TimeoutException()).thenReturn(ok)`
      do?
    options:
      - "Throws on the first call, then returns ok on the second and all subsequent calls"
      - "Throws TimeoutException on every call, because the last thenReturn is silently ignored"
      - "Returns ok on the first call, then throws TimeoutException on every call after that"
      - "Throws only when strictness is set to LENIENT, and returns ok under STRICT_STUBS"
    answer: 0
    explanation: |
      Consecutive stubbing returns/throws each value in order, then repeats the last one.
      Here the first call throws TimeoutException; the second onward returns ok — useful
      for modeling a retry that succeeds.
    ref: "concepts.md#stubbing-with-whenthenreturn-thenthrow-and-thenanswer"

  - id: mockito-and-stubbing-frameworks-025
    difficulty: intermediate
    tags: [captor, argthat, comparison]
    question: |
      When verifying a complex argument object with several fields, why is an
      ArgumentCaptor usually preferable to `argThat`?
    options:
      - "argThat cannot be used inside verify, only inside when() for stubbing conditions"
      - "argThat has been deprecated since Mockito 4 in favor of the newer captor-based API"
      - "ArgumentCaptor is significantly faster at runtime because it skips predicate evaluation"
      - "The captor lets you run rich assertions afterward with clear failure messages, whereas argThat collapses to one boolean with a terse message"
    answer: 3
    explanation: |
      A captor stores the actual value so you assert each field with normal
      AssertJ/JUnit assertions and get descriptive failures. argThat returns a single
      boolean, so a mismatch just says "argument did not match." Prefer argThat/eq for
      stubbing conditions, captor for post-hoc verification.
    ref: "concepts.md#capturing-arguments-with-argumentcaptor"

  - id: mockito-and-stubbing-frameworks-026
    difficulty: beginner
    tags: [bddmockito, verify]
    question: |
      In BDDMockito, what is the equivalent of `verify(repo).findById(1L)`?
    options:
      - "then(repo).should().findById(1L)"
      - "given(repo).findById(1L)"
      - "verify(repo).willReturn(findById(1L))"
      - "check(repo).findById(1L)"
    answer: 0
    explanation: |
      BDDMockito verification reads then(mock).should().method(). It is functionally
      identical to verify(mock).method().
    ref: "concepts.md#bddmockito-givenwillreturn"

  - id: mockito-and-stubbing-frameworks-027
    difficulty: intermediate
    tags: [mock, defaults, optional]
    question: |
      An unstubbed mock method returning `Optional<User>` is called. What does it return
      by default?
    options:
      - "null"
      - "Optional.empty()"
      - "It throws NullPointerException"
      - "Optional.of(null)"
    answer: 1
    explanation: |
      Mockito's RETURNS_DEFAULTS returns empty values for known container types:
      Optional.empty(), empty List/Set/Map/Stream, etc., rather than null. This avoids
      NPEs when the code under test dereferences the result.
    ref: "concepts.md#mock-spy-and-the-role-of-a-mocking-framework"

  - id: mockito-and-stubbing-frameworks-028
    difficulty: advanced
    tags: [strictness, potential-stubbing]
    question: |
      Under STRICT_STUBS you stub `findById(1L)` but the code calls `findById(2L)`. What
      does Mockito report?
    options:
      - "Nothing; it returns the value stubbed for findById(1L) regardless of the argument"
      - "It returns null silently, since the argument mismatch falls through to the default answer"
      - "UnnecessaryStubbingException immediately, because the 1L stub was never matched exactly"
      - "PotentialStubbingProblem — a stubbed method was called with different arguments"
    answer: 3
    explanation: |
      STRICT_STUBS flags an argument mismatch as PotentialStubbingProblem, surfacing
      what is usually a real bug or a wrong matcher, instead of silently returning a
      default for the un-stubbed argument.
    ref: "concepts.md#strictness-strict_stubs-and-unnecessarystubbingexception"

  - id: mockito-and-stubbing-frameworks-029
    difficulty: beginner
    tags: [matchers, eq]
    question: |
      Which matcher must you use to combine a literal value with other matchers in the
      same stubbed call?
    options:
      - "same(value)"
      - "eq(value)"
      - "equalTo(value)"
      - "is(value)"
    answer: 1
    explanation: |
      eq(value) wraps a literal so it participates in the matcher stack, satisfying the
      all-matchers-or-all-raw rule, e.g. update(eq(1L), any()).
    ref: "concepts.md#argument-matchers-and-the-cant-mix-raw-and-matchers-rule"

  - id: mockito-and-stubbing-frameworks-030
    difficulty: intermediate
    tags: [verify, verifynomoreinteractions, brittle]
    question: |
      Why is heavy use of `verifyNoMoreInteractions(mock)` considered a test smell?
    options:
      - "It is deprecated and scheduled for removal in the next major Mockito release"
      - "It only works on spies and silently no-ops when called on a plain mock()"
      - "It makes tests fragile: any harmless additional call added later breaks unrelated tests"
      - "It cannot be combined with times() in the same test, throwing a configuration error"
    answer: 2
    explanation: |
      verifyNoMoreInteractions asserts nothing else touched the mock, so a later,
      harmless call breaks the test. Prefer verifying only the specific interactions you
      care about.
    ref: "concepts.md#verifying-interactions-times-never-atleast-inorder"

  - id: mockito-and-stubbing-frameworks-031
    difficulty: intermediate
    tags: [spy, doreturn, when-difference]
    question: |
      On a pure mock (not a spy), why is `when(mock.foo()).thenReturn(x)` normally safe
      even though it "calls" foo()?
    options:
      - "Mockito rewrites the bytecode of foo() so the call is skipped entirely at stub time"
      - "when() captures its argument lazily and never actually evaluates the foo() expression"
      - "The mock's foo() is a no-op returning a default, so evaluating it has no real side effects"
      - "It is not safe; you must always use doReturn().when() even on a pure mock to avoid the call"
    answer: 2
    explanation: |
      when() does evaluate its argument, but on a pure mock that call is a harmless no-op
      returning a default. On a spy the call runs the real method, which is why
      doReturn().when() is required there.
    ref: "concepts.md#spies-partial-mocking-and-the-doreturn-vs-when-gotcha"

  - id: mockito-and-stubbing-frameworks-032
    difficulty: intermediate
    tags: [mocking-constructors, mockedconstruction]
    question: |
      What does `mockConstruction(HttpClient.class, (mock, ctx) -> ...)` do inside its
      try-with-resources block?
    options:
      - "Pins every HttpClient instance in memory, preventing it from being garbage collected"
      - "Makes every `new HttpClient()` executed within the block return a Mockito mock"
      - "Mocks only the first HttpClient constructor call and lets later ones build real instances"
      - "Replaces the HttpClient class permanently for the whole JVM until it is unloaded"
    answer: 1
    explanation: |
      MockedConstruction intercepts constructor calls so any object created with new
      within the scoped block is a mock you can configure via the initializer. It is
      thread-local and torn down when the block closes.
    ref: "concepts.md#mocking-statics-finals-and-constructors"

  - id: mockito-and-stubbing-frameworks-033
    difficulty: beginner
    tags: [what-not-to-mock, class-under-test]
    question: |
      Why should you not mock the class under test itself?
    options:
      - "Mockito forbids it at compile time and refuses to generate the proxy class"
      - "It requires the inline mock-maker, which is disabled by default in Mockito 5"
      - "It is far too slow because self-referential mocks trigger repeated bytecode regeneration"
      - "You'd be testing the mock's programmed behavior, not your real code"
    answer: 3
    explanation: |
      Mocking the subject replaces the very logic you intend to verify, so the test
      exercises stubs rather than production behavior. Test the real instance; mock only
      its collaborators.
    ref: "concepts.md#what-not-to-mock"

  - id: mockito-and-stubbing-frameworks-034
    difficulty: advanced
    tags: [stubbing, thenreturn, eager]
    question: |
      When is the value in `when(mock.next()).thenReturn(list.get(0))` computed?
    options:
      - "Once, eagerly, at stub-definition time"
      - "On every call to mock.next(), Mockito re-evaluates list.get(0) and returns the current head"
      - "Lazily, but only on the very first call to mock.next(); the result is then cached forever"
      - "Never — the expression is stored unevaluated as a placeholder and resolved by the verifier"
    answer: 0
    explanation: |
      thenReturn evaluates its argument eagerly at stub time and stores the value, so
      list.get(0) is read once, immediately. For per-call computation use thenAnswer with
      a lambda.
    ref: "concepts.md#stubbing-with-whenthenreturn-thenthrow-and-thenanswer"

  - id: mockito-and-stubbing-frameworks-035
    difficulty: intermediate
    tags: [captor, getallvalues]
    question: |
      A mock's `save()` is called three times. How do you retrieve all three captured
      arguments from an ArgumentCaptor?
    options:
      - "Call captor.getValue() three times; each call pops the next captured argument off a queue"
      - "captor.getAllValues() returns a List in call order"
      - "captor.captureAll() inside a single verify collects every invocation's argument at once"
      - "You cannot capture more than one value; a captor only ever retains the first argument"
    answer: 1
    explanation: |
      getValue() returns only the last captured argument; getAllValues() returns every
      captured value as a List in invocation order.
    ref: "concepts.md#capturing-arguments-with-argumentcaptor"

  - id: mockito-and-stubbing-frameworks-036
    difficulty: intermediate
    tags: [injectmocks, same-type]
    question: |
      Two `@Mock` fields have the same type and both are candidates for one `@InjectMocks`
      field. How does Mockito decide which to inject?
    options:
      - "It injects a merged proxy that delegates to both mocks depending on the method called"
      - "It always injects the first mock declared in source order and ignores the second one"
      - "It throws an ambiguity error at startup, refusing to initialize the test class"
      - "It falls back to matching by field name"
    answer: 3
    explanation: |
      When multiple mocks share a type, Mockito disambiguates by matching the mock field
      name to the target's field name. A naming mismatch can silently inject the wrong
      one — another reason to prefer explicit constructor wiring.
    ref: "concepts.md#creating-mocks-mock-spy-injectmocks-and-mockitoextension"

  - id: mockito-and-stubbing-frameworks-037
    difficulty: advanced
    tags: [verify, query-command]
    question: |
      A senior interviewer asks when to use `verify` versus asserting on returned state.
      Which answer is best?
    options:
      - "Always verify every mock interaction for completeness, since any unverified call counts as an untested code path"
      - "Verify outgoing commands with no observable return (e.g. emailSender.send); assert on state/returned values for queries"
      - "Never use verify at all; assert only on returned state, since interaction checks are always too brittle to be worthwhile"
      - "Verify read-only queries for their call counts and assert on state for side-effecting commands like send()"
    answer: 1
    explanation: |
      Behavior verification fits side-effecting commands whose effect isn't otherwise
      observable. For queries that return a value, stub them and assert the result;
      verifying a query is redundant and couples the test to call counts.
    ref: "concepts.md#verifying-interactions-times-never-atleast-inorder"

  - id: mockito-and-stubbing-frameworks-038
    difficulty: beginner
    tags: [spy, annotation]
    question: |
      Which annotation creates a spy that delegates to a real instance for unstubbed
      methods?
    options:
      - "@Mock"
      - "@Captor"
      - "@InjectMocks"
      - "@Spy"
    answer: 3
    explanation: |
      @Spy wraps a real object (a provided instance or a default-constructed one) so
      unstubbed methods run real code. @Mock creates a pure mock with no real behavior.
    ref: "concepts.md#creating-mocks-mock-spy-injectmocks-and-mockitoextension"

  - id: mockito-and-stubbing-frameworks-039
    difficulty: intermediate
    tags: [matchers, argthat]
    question: |
      Which construct lets you stub based on an arbitrary condition, e.g. "any Order whose
      total exceeds 100"?
    options:
      - "eq(order)"
      - "any(Order.class)"
      - "argThat(o -> o.total().compareTo(HUNDRED) > 0)"
      - "same(order)"
    answer: 2
    explanation: |
      argThat takes a predicate (ArgumentMatcher) evaluated against the actual argument,
      allowing arbitrary conditions. eq matches equality and any matches everything of a
      type.
    ref: "concepts.md#argument-matchers-and-the-cant-mix-raw-and-matchers-rule"

  - id: mockito-and-stubbing-frameworks-040
    difficulty: intermediate
    tags: [mocking-statics, seam, design]
    question: |
      Rather than `mockStatic(Instant.class)` to control `Instant.now()`, what design
      change is usually cleaner?
    options:
      - "Inject a java.time.Clock and derive the time from it"
      - "Sprinkle Thread.sleep calls through the test to line the wall-clock readings up with your assertions"
      - "Recompile the JDK with Instant marked non-final so a subclass can override now()"
      - "Wrap every timing-sensitive test in @Isolated so JUnit freezes the system clock for its duration"
    answer: 0
    explanation: |
      Needing to mock static time methods signals a hidden dependency. Injecting a Clock
      (or a Supplier) makes time an explicit, easily-faked collaborator and avoids the
      inline static-mocking machinery entirely.
    ref: "concepts.md#mocking-statics-finals-and-constructors"

  - id: mockito-and-stubbing-frameworks-041
    difficulty: advanced
    tags: [what-not-to-mock, over-mocking, green-but-broken]
    question: |
      Your unit suite is all green, yet a bug shipped to production. Which explanation
      most directly implicates mocking practice?
    options:
      - "Line coverage sat below the 80% threshold, so the faulty branch was never executed by any unit test"
      - "The suite finished too quickly for the JIT to warm up, leaving the buggy path running interpreted and untested"
      - "Over-mocking: the mocks encoded assumed collaborator behavior that diverged from reality, so tests stayed green while production broke"
      - "STRICT_STUBS was left enabled, which suppresses failures for stubs whose arguments do not match at runtime"
    answer: 2
    explanation: |
      Mocks bake in assumptions about how collaborators behave. If those assumptions are
      wrong (or drift on upgrade), the mocked tests pass while the real system fails. The
      remedy is fewer, better-placed mocks plus integration/contract tests at unowned
      seams.
    ref: "concepts.md#what-not-to-mock"

  - id: mockito-and-stubbing-frameworks-042
    difficulty: intermediate
    tags: [openmocks, setup]
    question: |
      Without the MockitoExtension, how can you initialize `@Mock` fields inside a JUnit 5
      test class?
    options:
      - "Call MockitoAnnotations.openMocks(this) in an @BeforeEach"
      - "Annotate the class with @RunWith(MockitoJUnitRunner.class), which Jupiter honours for annotation processing"
      - "Nothing is needed — JUnit 5's engine scans for @Mock fields and initializes them automatically before each test"
      - "Call Mockito.reset(this) in the constructor to force annotation scanning of the test instance"
    answer: 0
    explanation: |
      MockitoAnnotations.openMocks(this) (the replacement for the deprecated initMocks)
      processes the annotations. MockitoJUnitRunner is a JUnit 4 runner and does not apply
      to Jupiter.
    ref: "concepts.md#creating-mocks-mock-spy-injectmocks-and-mockitoextension"

  - id: mockito-and-stubbing-frameworks-043
    difficulty: advanced
    tags: [mocking-statics, thread]
    question: |
      Inside a `mockStatic(Foo.class)` block, a background thread calls the static
      `Foo.bar()`. Is that call mocked?
    options:
      - "Yes — MockedStatic installs a JVM-wide bytecode redefinition, so every thread sees the stubbed static"
      - "Only if bar() is synchronized, since the monitor lock is what lets Mockito route the call to the stub"
      - "Only when the background thread is a virtual thread, whose carrier shares the registration of the mocking thread"
      - "No — MockedStatic registration is thread-local, so calls on other threads are not mocked"
    answer: 3
    explanation: |
      Static mocking is registered per thread. A static call executed on a different
      thread within the block runs the real method, which can surprise tests of
      concurrent code.
    ref: "concepts.md#mocking-statics-finals-and-constructors"

  - id: mockito-and-stubbing-frameworks-044
    difficulty: intermediate
    tags: [verify, timeout, async]
    question: |
      A method triggers `mock.flush()` asynchronously. Which verification waits up to
      100ms for the call to occur before failing?
    options:
      - "verify(mock, timeout(100)).flush()"
      - "verify(mock, after(100)).flush()"
      - "Thread.sleep(100); verify(mock).flush()"
      - "verify(mock, atMost(100)).flush()"
    answer: 0
    explanation: |
      timeout(100) polls and succeeds as soon as the interaction happens within 100ms,
      failing if it doesn't. after(100) instead always waits the full duration; atMost is
      a count, not a time.
    ref: "concepts.md#verifying-interactions-times-never-atleast-inorder"

  - id: mockito-and-stubbing-frameworks-045
    difficulty: beginner
    tags: [bddmockito, purpose]
    question: |
      What does BDDMockito add over classic Mockito functionally?
    options:
      - "It unlocks mocking of final classes and methods that classic Mockito cannot proxy on its own"
      - "It provides parallel, multi-threaded execution of the stub-setup phase to speed up large test classes"
      - "It disables strict stubbing globally so unused stubs never raise UnnecessaryStubbingException"
      - "Nothing functional — it is a syntactic alias using given/willReturn/then vocabulary"
    answer: 3
    explanation: |
      BDDMockito is purely stylistic, aligning stub setup with the Given step of BDD. It
      has the same behavior and strictness as classic Mockito.
    ref: "concepts.md#bddmockito-givenwillreturn"

  - id: mockito-and-stubbing-frameworks-046
    difficulty: advanced
    tags: [strictness, evolution, history]
    question: |
      Compared with older MockitoJUnitRunner behavior, what did STRICT_STUBS (default in
      MockitoExtension) change?
    options:
      - "It removed the argument-matcher API, requiring every stubbed call to use concrete literal values"
      - "It turned silent/warning-level unused-stub and argument-mismatch handling into hard test failures"
      - "It made every mock a spy by default, so unstubbed methods now run the real implementation"
      - "It disabled ArgumentCaptor, pushing users toward argThat predicates for post-hoc verification"
    answer: 1
    explanation: |
      Legacy behavior was lenient/warn-level. STRICT_STUBS fails fast on unused stubs
      (UnnecessaryStubbingException) and argument mismatches (PotentialStubbingProblem),
      catching test rot early and locally.
    ref: "concepts.md#strictness-strict_stubs-and-unnecessarystubbingexception"

  - id: mockito-and-stubbing-frameworks-047
    difficulty: intermediate
    tags: [test-double, scenario, selection]
    question: |
      You need a collaborator that stores data and can be read back during the test (a
      lightweight in-memory implementation), not one you program call-by-call. Which test
      double is that, and should Mockito create it?
    options:
      - "A fake — typically a real lightweight class (e.g. in-memory repo), not a Mockito mock"
      - "A mock — create it with mock() and program each read to return the value you previously stored"
      - "A spy wrapping a mock, so unstubbed reads fall through to the mock's recorded state automatically"
      - "A dummy created via mock(), since a dummy transparently retains whatever data is written to it"
    answer: 0
    explanation: |
      A fake is a working but lightweight implementation (e.g. an in-memory repository).
      Mockito mocks/spies are for stubbing/verification, not stateful storage; for a fake
      you usually write or reuse a small real class. See test-doubles-and-mocking-taxonomy.
    ref: "concepts.md#what-not-to-mock"

  - id: mockito-and-stubbing-frameworks-048
    difficulty: intermediate
    tags: [captor, annotation]
    question: |
      Which annotation, processed by MockitoExtension, declares an ArgumentCaptor field
      without calling `ArgumentCaptor.forClass(...)`?
    options:
      - "@Capture, which binds the field to the most recent verify() call automatically"
      - "@Mock(captor = true), a mock flag that repurposes the field as an argument recorder"
      - "@Captor"
      - "@ArgCaptor, the type-aware captor annotation introduced to replace forClass() in Mockito 5"
    answer: 2
    explanation: |
      @Captor declares and initializes an ArgumentCaptor field. Since Mockito 5 captors
      are fully type-aware, avoiding raw-type warnings that plagued earlier versions.
    ref: "concepts.md#capturing-arguments-with-argumentcaptor"
