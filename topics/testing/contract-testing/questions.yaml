topic: "Contract Testing"
domain: testing
topic_slug: contract-testing
version: 1
questions:
  - id: contract-testing-001
    difficulty: beginner
    tags: [definition, cdc]
    question: |
      What does contract testing primarily verify?
    options:
      - "That a single class computes the correct result in isolation"
      - "That the UI renders correctly across browsers"
      - "That the database schema migrations apply cleanly"
      - "That a consumer and a provider agree on the messages they exchange, tested independently"
    answer: 3
    explanation: |
      Contract testing verifies that two services communicating over a boundary
      (consumer and provider) agree on the shape and semantics of the messages
      they exchange — and it does so by testing each side independently against a
      shared contract, without running them together.
    ref: "concepts.md#contract-testing"

  - id: contract-testing-002
    difficulty: beginner
    tags: [terminology]
    question: |
      In contract-testing terminology, which party is the "consumer"?
    options:
      - "The service that returns the response"
      - "The team that owns the database"
      - "The client that initiates the request / reads the message"
      - "The CI server that runs the tests"
    answer: 2
    explanation: |
      The consumer is the party that makes the request (or reads a message). The
      provider (a.k.a. producer) is the party that answers the request or writes
      the message.
    ref: "concepts.md#contract-testing"

  - id: contract-testing-003
    difficulty: beginner
    tags: [problem, microservices]
    question: |
      What core scaling problem in microservices does contract testing address?
    options:
      - "Broad integration/end-to-end tests need every service running together and scale combinatorially"
      - "Databases become too large to back up"
      - "Unit tests take too long to compile"
      - "Logs grow faster than disk space"
    answer: 0
    explanation: |
      As the number of independently deployable services grows, integration/e2e
      tests that require everything running together become slow, flaky, and
      combinatorially unscalable. Contract testing replaces the cross-service
      portion with independent, deterministic suites tied by a contract.
    ref: "concepts.md#the-problem-contract-testing-solves"

  - id: contract-testing-004
    difficulty: beginner
    tags: [problem, monolith]
    question: |
      Why can a provider break its consumers without any of its own unit tests failing?
    options:
      - "Because unit tests are always disabled in CI"
      - "Because consumers never write tests"
      - "Because HTTP is inherently untestable"
      - "Because the compiler cannot see across a network boundary the way it can across an in-process method call"
    answer: 3
    explanation: |
      In a monolith the compiler enforces the contract between callers and
      callees. Across a network boundary the compiler is blind, so a provider can
      rename a field or change a status code, pass its own tests, and only break
      the consumer at runtime. Contract tests restore that cross-boundary check.
    ref: "concepts.md#the-problem-contract-testing-solves"

  - id: contract-testing-005
    difficulty: intermediate
    tags: [problem, shared-environment]
    question: |
      Which is a genuine drawback of relying on a single shared "test environment"
      to catch cross-service breakages?
    options:
      - "It becomes a contended bottleneck where one team's bad deploy blocks everyone and results are non-deterministic"
      - "It makes unit tests run faster"
      - "It removes the need for version control"
      - "It guarantees deterministic results for every team"
    answer: 0
    explanation: |
      A shared environment becomes a bottleneck: teams fight over it, one bad
      deploy blocks everyone, and results are non-deterministic. Contract testing
      removes the need for a shared environment for the cross-service check.
    ref: "concepts.md#the-problem-contract-testing-solves"

  - id: contract-testing-006
    difficulty: beginner
    tags: [contract, interactions]
    question: |
      A contract is composed of a set of what?
    options:
      - "Database tables"
      - "Deployment scripts"
      - "Load-test scenarios"
      - "Interactions, each recording an expected request and a minimal expected response"
    answer: 3
    explanation: |
      A contract is a set of interactions. Each interaction records an expected
      request (method, path, headers, body/matchers) and the minimal expected
      response (status, headers, body).
    ref: "concepts.md#what-a-contract-is"

  - id: contract-testing-007
    difficulty: intermediate
    tags: [contract, minimal-response, tolerant-reader]
    question: |
      Pact-style verification passes when the provider's real response...
    options:
      - "contains at least the data the consumer described (extra fields are allowed)"
      - "matches the expected response byte-for-byte"
      - "returns exactly the same set of fields and no more"
      - "returns any 2xx status regardless of body"
    answer: 0
    explanation: |
      Verification passes if the response contains at least the data described in
      the minimal expected response. Extra fields the consumer does not use do
      not fail the test — this tolerance is what makes contracts survive additive
      change.
    ref: "concepts.md#provider-verification"

  - id: contract-testing-008
    difficulty: intermediate
    tags: [contract, scope]
    question: |
      How does a (consumer) contract differ in scope from a full API schema?
    options:
      - "A contract captures only the interactions a specific consumer actually uses; a schema describes the entire API surface"
      - "A contract describes the whole API surface; a schema describes one endpoint"
      - "They are identical in scope"
      - "A contract only covers error responses"
    answer: 0
    explanation: |
      A contract is consumer-scoped and behavioural: it captures only the
      interactions a particular consumer relies on. A schema (e.g. OpenAPI)
      describes the entire declared API surface. Two consumers produce two
      different contracts for the same provider.
    ref: "concepts.md#what-a-contract-is"

  - id: contract-testing-009
    difficulty: intermediate
    tags: [contract, matchers, brittleness]
    question: |
      To keep a contract from breaking every time the provider returns a
      different-but-valid value (e.g. a new timestamp or generated id), you should...
    options:
      - "assert exact literal values so the test is precise"
      - "remove the response body from the contract entirely"
      - "only test error paths"
      - "use matchers (type/regex/'like') that assert structure and type rather than exact values"
    answer: 3
    explanation: |
      Asserting exact values is the number-one cause of brittle contracts. Use
      matchers (type, regex, "like") to assert structure and type, so the contract
      does not break when the provider returns a valid but different value.
    ref: "concepts.md#what-a-contract-is"

  - id: contract-testing-010
    difficulty: beginner
    tags: [cdc, definition]
    question: |
      In consumer-driven contracts (CDC), who defines what the contract must contain?
    options:
      - "The provider, from its API design docs"
      - "A central architecture board"
      - "The load-testing tool"
      - "The consumer, based on what it actually needs from the provider"
    answer: 3
    explanation: |
      In CDC the consumer defines what it needs; the contract is generated from
      the consumer's tests and only describes interactions the consumer genuinely
      exercises. The provider's job is to keep those expectations satisfied.
    ref: "concepts.md#consumer-driven-contracts-cdc"

  - id: contract-testing-011
    difficulty: intermediate
    tags: [cdc, benefits]
    question: |
      A key benefit of CDC for the PROVIDER is that it...
    options:
      - "lets the provider ignore consumer needs entirely"
      - "forces the provider to keep every field forever"
      - "reveals exactly which fields/endpoints are actually used, so unused parts can be changed or removed safely"
      - "eliminates the need for any provider tests"
    answer: 2
    explanation: |
      CDC tells the provider precisely which fields and endpoints real consumers
      depend on, so it can confidently change or remove anything no consumer uses,
      and a breaking change surfaces as a failed verification before deploy.
    ref: "concepts.md#consumer-driven-contracts-cdc"

  - id: contract-testing-012
    difficulty: intermediate
    tags: [cdc, misconception]
    question: |
      Which statement about "consumer-driven" is correct?
    options:
      - "The contract reflects real consumer usage, but the provider still owns its API design"
      - "The consumer dictates the provider's API design"
      - "The provider must implement any field any consumer requests"
      - "It means the consumer deploys the provider"
    answer: 0
    explanation: |
      Consumer-driven does not mean the consumer dictates API design. It means
      the contract reflects actual consumer usage; the provider still owns the
      API. CDC just gives the provider a precise, test-enforced picture of what a
      change would break.
    ref: "concepts.md#consumer-driven-contracts-cdc"

  - id: contract-testing-013
    difficulty: beginner
    tags: [pact, consumer-side]
    question: |
      In a Pact consumer test, the client code under test talks to...
    options:
      - "a Pact-created mock provider that returns stubbed responses only if the real request matches expectations"
      - "the real provider service over the network"
      - "a production database"
      - "another consumer service"
    answer: 0
    explanation: |
      On the consumer side, Pact stands up a local mock provider. The consumer's
      real client code fires requests at it; the mock returns the stubbed response
      only if the request matches the registered expectation, and on success a
      pact file is written.
    ref: "concepts.md#pact-consumer-side-generating-the-pact"

  - id: contract-testing-014
    difficulty: intermediate
    tags: [pact, consumer-side, value]
    question: |
      Besides producing the pact file, what does a Pact consumer test actually verify?
    options:
      - "That the provider's database is correctly indexed"
      - "That the consumer's own client code sends the request it claims and can parse the response"
      - "That the network latency is under a threshold"
      - "That the provider has enough memory"
    answer: 1
    explanation: |
      The consumer test verifies the consumer's client code: that it really sends
      the request it claims and can parse the stubbed response. If the client is
      wrong, the test fails — independently of the provider.
    ref: "concepts.md#pact-consumer-side-generating-the-pact"

  - id: contract-testing-015
    difficulty: intermediate
    tags: [pact, interactions, isolation]
    question: |
      Why does Pact test each interaction independently rather than chaining
      calls like "create user, then log in"?
    options:
      - "To keep interactions isolated and deterministic; preconditions are supplied via provider states instead of call chaining"
      - "Because chaining is impossible over HTTP"
      - "Because Pact only supports one interaction per contract"
      - "To make tests run slower and more thorough"
    answer: 0
    explanation: |
      Interactions are isolated for determinism. Rather than chaining calls to set
      up data, each interaction declares the precondition it needs via a provider
      state, which the provider seeds before replaying that interaction.
    ref: "concepts.md#pact-consumer-side-generating-the-pact"

  - id: contract-testing-016
    difficulty: beginner
    tags: [provider-states, definition]
    question: |
      What is a "provider state" in Pact?
    options:
      - "The HTTP status code returned by the provider"
      - "The provider's deployment version"
      - "The consumer's authentication token"
      - "A named precondition the provider sets up before an interaction is replayed"
    answer: 3
    explanation: |
      A provider state is a named precondition (e.g. "order 42 exists"). The
      consumer names it in the interaction; the provider registers a matching
      handler that seeds the required data before the request is replayed.
    ref: "concepts.md#provider-states"

  - id: contract-testing-017
    difficulty: intermediate
    tags: [provider-states, gotcha]
    question: |
      A provider verification fails because the state handler never seeded the
      data. The consumer used `.given("order 42 exists")`. What is the most likely cause?
    options:
      - "The provider is down"
      - "The provider's `@State` string does not exactly match the consumer's `given(...)` string"
      - "The consumer used HTTPS instead of HTTP"
      - "The pact file was not JSON"
    answer: 1
    explanation: |
      Provider-state strings must match exactly between the consumer's given(...)
      and the provider's @State(...). A mismatch means the handler never runs, so
      the data is not seeded and verification fails for a reason unrelated to the
      actual contract.
    ref: "concepts.md#provider-states"

  - id: contract-testing-018
    difficulty: advanced
    tags: [provider-states, best-practice]
    question: |
      What is the recommended way for a provider-state handler to set up its precondition?
    options:
      - "By driving a sequence of other public API calls to create the data"
      - "By waiting for a scheduled batch job to populate data"
      - "Via the fastest reliable path such as a repository/DB seed or a stubbed downstream, not by calling other APIs"
      - "By hard-coding responses in the controller"
    answer: 2
    explanation: |
      State handlers should seed data via the fastest reliable path (direct
      repository/DB writes or stubbing downstreams). Driving other API calls is
      slow, brittle, and couples the state setup to unrelated endpoints.
    ref: "concepts.md#provider-states"

  - id: contract-testing-019
    difficulty: beginner
    tags: [provider-verification]
    question: |
      During Pact provider verification, what does the framework do?
    options:
      - "Replays each recorded request against the running provider and compares the actual response to the minimal expected one"
      - "Generates a new contract from the provider"
      - "Deploys the provider to production"
      - "Runs the consumer's UI tests"
    answer: 0
    explanation: |
      Provider verification is framework-driven: it takes the pact file, replays
      each request against the running provider, and checks the actual response
      contains at least the expected data.
    ref: "concepts.md#provider-verification"

  - id: contract-testing-020
    difficulty: intermediate
    tags: [provider-verification, trust]
    question: |
      Why is provider verification trustworthy evidence of compatibility?
    options:
      - "It runs against a mock of the provider"
      - "It only checks the OpenAPI document"
      - "It runs against the real provider implementation — its controllers, serialization, and validation"
      - "It reuses the consumer's mock server"
    answer: 2
    explanation: |
      Verification exercises the real provider implementation (real controllers,
      serialization, validation), not a mock. That is what makes a passing
      verification meaningful evidence that the provider actually satisfies the
      contract.
    ref: "concepts.md#provider-verification"

  - id: contract-testing-021
    difficulty: intermediate
    tags: [provider-verification, dependencies]
    question: |
      During provider verification, the provider's own downstream dependencies are
      typically...
    options:
      - "called for real in production"
      - "stubbed, so verification stays fast and deterministic and focuses on the contract surface"
      - "ignored, so the provider always returns 500"
      - "replaced with the consumer's code"
    answer: 1
    explanation: |
      Downstream dependencies are usually stubbed during verification so the test
      is fast and deterministic. You are verifying the provider's contract surface,
      not its entire dependency graph.
    ref: "concepts.md#provider-verification"

  - id: contract-testing-022
    difficulty: advanced
    tags: [provider-verification, multi-consumer]
    question: |
      A single provider is consumed by three services. What must its verification do?
    options:
      - "Satisfy only the newest consumer's pact"
      - "Satisfy all three consumers' pacts simultaneously"
      - "Choose one consumer's pact at random"
      - "Ignore consumer pacts and verify its own schema only"
    answer: 1
    explanation: |
      A provider can be verified against pacts from multiple consumers at once and
      must satisfy all of them. That is precisely how CDC protects every consumer
      from a breaking change.
    ref: "concepts.md#provider-verification"

  - id: contract-testing-023
    difficulty: beginner
    tags: [broker, definition]
    question: |
      What is the primary role of the Pact Broker?
    options:
      - "To compile the consumer and provider code"
      - "To store/version contracts and verification results and expose the network of dependencies"
      - "To load-test the provider"
      - "To generate OpenAPI documentation"
    answer: 1
    explanation: |
      The Pact Broker is the central exchange: consumers publish pacts, providers
      fetch them and publish verification results back. It stores, versions, and
      visualises the dependency matrix.
    ref: "concepts.md#pact-broker-and-can-i-deploy-the-deployment-gate"

  - id: contract-testing-024
    difficulty: intermediate
    tags: [can-i-deploy, deployment-gate]
    question: |
      What question does `can-i-deploy` answer in CI?
    options:
      - "How fast is the provider under load?"
      - "Is the code coverage above 80%?"
      - "Are there any compiler warnings?"
      - "For the exact versions about to be deployed, is every counterpart on the target environment verified compatible?"
    answer: 3
    explanation: |
      can-i-deploy consults the broker's matrix and answers whether the specific
      pacticipant version being deployed is verified compatible with every
      counterpart currently on the target environment — a hard pass/fail gate.
    ref: "concepts.md#pact-broker-and-can-i-deploy-the-deployment-gate"

  - id: contract-testing-025
    difficulty: intermediate
    tags: [can-i-deploy, independent-deploy]
    question: |
      How does `can-i-deploy` enable independent deployment without a shared staging environment?
    options:
      - "By deploying all services simultaneously"
      - "By disabling all other services during deploy"
      - "By letting a service deploy only when the broker confirms the specific versions it will meet in the target environment are already verified compatible"
      - "By skipping verification for speed"
    answer: 2
    explanation: |
      The gate lets a service deploy independently and safely: it ships only when
      the broker confirms the exact versions it will encounter in the target
      environment are already verified compatible — no shared staging needed.
    ref: "concepts.md#pact-broker-and-can-i-deploy-the-deployment-gate"

  - id: contract-testing-026
    difficulty: advanced
    tags: [broker, environments, record-deployment]
    question: |
      Why does the broker track which version is deployed/released to each
      environment (e.g. via record-deployment)?
    options:
      - "So can-i-deploy reasons about the actual target-environment state instead of a moving 'latest' pointer"
      - "To bill teams for deployments"
      - "To generate release notes"
      - "To throttle deployments"
    answer: 0
    explanation: |
      Recording deployments/environments lets can-i-deploy reason about what is
      actually running in the target environment, rather than "latest," which is a
      moving target that would break the gate's guarantees.
    ref: "concepts.md#pact-broker-and-can-i-deploy-the-deployment-gate"

  - id: contract-testing-027
    difficulty: beginner
    tags: [versioning]
    question: |
      What is the recommended value to use as a pacticipant version?
    options:
      - "The literal string 'latest'"
      - "The current date only"
      - "The git commit SHA (or a semver + build)"
      - "A random UUID per test run"
    answer: 2
    explanation: |
      Use the git commit SHA (or semver + build). It is unique, ties the contract
      to exact code, and lets can-i-deploy reason about precisely the artifact you
      are shipping. "latest" is a moving target, not a version.
    ref: "concepts.md#versioning-contracts"

  - id: contract-testing-028
    difficulty: intermediate
    tags: [versioning, pending-pacts]
    question: |
      What problem do "pending pacts" solve?
    options:
      - "They compress the pact file to save space"
      - "They delete old contracts automatically"
      - "They encrypt the contract in transit"
      - "They let a brand-new consumer expectation be verified without breaking the provider's build until the provider satisfies it"
    answer: 3
    explanation: |
      When a new consumer contract arrives, the provider can verify it as
      "pending" so a not-yet-satisfied expectation does not break the provider's
      build. It lets the consumer share intent early without blocking the provider.
    ref: "concepts.md#versioning-contracts"

  - id: contract-testing-029
    difficulty: advanced
    tags: [versioning, deploy-order]
    question: |
      When a provider adds a new capability that a consumer will use, what is the
      safe deployment order?
    options:
      - "Deploy the consumer first, then the provider"
      - "Deploy both at exactly the same instant"
      - "Deploy the provider first, keeping old interactions verifiable until all consumers migrate"
      - "Deploy neither until the shared environment is free"
    answer: 2
    explanation: |
      For additive change, deploy the provider first so the new capability exists
      before any consumer relies on it, and never break an interaction a currently
      deployed consumer depends on until it has migrated.
    ref: "concepts.md#versioning-contracts"

  - id: contract-testing-030
    difficulty: intermediate
    tags: [versioning, branches-tags]
    question: |
      Why associate pacticipant versions with tags/branches (e.g. tag a pact with `prod`)?
    options:
      - "To make the pact file smaller"
      - "So the provider knows which consumer versions to verify against and can-i-deploy can answer version-specific questions"
      - "To disable verification on those branches"
      - "To rename the service"
    answer: 1
    explanation: |
      Tags/branches/environments let the broker associate versions with contexts,
      so the provider verifies against the right consumer versions and
      can-i-deploy can reason about specific environments.
    ref: "concepts.md#versioning-contracts"

  - id: contract-testing-031
    difficulty: beginner
    tags: [spring-cloud-contract]
    question: |
      In its typical mode, Spring Cloud Contract is...
    options:
      - "consumer-driven only"
      - "unable to generate stubs"
      - "a load-testing tool"
      - "usually producer-driven: the provider authors contracts in a Groovy DSL or YAML"
    answer: 3
    explanation: |
      Spring Cloud Contract is most often used producer-driven: the provider
      authors contracts (Groovy DSL or YAML) under src/test/resources/contracts.
      Consumer-driven use is also possible, but producer-driven is the common mode.
    ref: "concepts.md#spring-cloud-contract"

  - id: contract-testing-032
    difficulty: intermediate
    tags: [spring-cloud-contract, generation]
    question: |
      From the contracts, what does the Spring Cloud Contract build generate on the PROVIDER side?
    options:
      - "A production Dockerfile"
      - "Verification tests (default MockMvc; also WebTestClient/JAXRS) that fail until the implementation satisfies the contract"
      - "A load-test script"
      - "An OpenAPI document only"
    answer: 1
    explanation: |
      SCC auto-generates provider verification tests (default mode MockMvc, also
      WebTestClient for WebFlux, or JAXRS) that run against the real controllers
      and fail until the implementation matches the contracts.
    ref: "concepts.md#spring-cloud-contract"

  - id: contract-testing-033
    difficulty: intermediate
    tags: [spring-cloud-contract, stubs]
    question: |
      How do consumers test against a Spring Cloud Contract provider without the
      real service running?
    options:
      - "They call production directly"
      - "Stub Runner (@AutoConfigureStubRunner) downloads the provider's stub JAR and runs a WireMock server matching the contracts"
      - "They mock every method with Mockito manually"
      - "They read the OpenAPI spec and hand-write a mock"
    answer: 1
    explanation: |
      SCC publishes a *-stubs.jar of WireMock mappings derived from the contracts.
      Consumers use Stub Runner (@AutoConfigureStubRunner) to fetch that JAR and
      spin up WireMock behaving exactly as the verified contract says.
    ref: "concepts.md#spring-cloud-contract"

  - id: contract-testing-034
    difficulty: advanced
    tags: [spring-cloud-contract, stubs-mode]
    question: |
      In `@AutoConfigureStubRunner`, what is the difference between `LOCAL` and `REMOTE` stubs modes?
    options:
      - "LOCAL runs stubs in the cloud; REMOTE runs them on disk"
      - "LOCAL disables WireMock; REMOTE enables it"
      - "LOCAL uses the local Maven repo; REMOTE downloads the stub JAR from an online artifact repository"
      - "They are aliases for the same behaviour"
    answer: 2
    explanation: |
      LOCAL resolves stub JARs from the local Maven repository (offline work);
      REMOTE downloads them from an online artifact repository such as Nexus or
      Artifactory.
    ref: "concepts.md#spring-cloud-contract"

  - id: contract-testing-035
    difficulty: intermediate
    tags: [pact-vs-scc, comparison]
    question: |
      Which pairing is correct?
    options:
      - "Pact = producer-driven, JVM-only; SCC = consumer-driven, polyglot"
      - "Both are identical tools with different names"
      - "Pact generates WireMock stubs; SCC uses a Pact Broker"
      - "Pact = consumer-driven and polyglot with a broker/can-i-deploy; SCC = usually producer-driven, JVM-centric, Groovy/YAML DSL"
    answer: 3
    explanation: |
      Pact is consumer-driven, polyglot, and centred on the broker plus
      can-i-deploy. Spring Cloud Contract is usually producer-driven, JVM/Spring
      centric, with hand-written Groovy/YAML contracts that generate provider
      tests and WireMock stubs.
    ref: "concepts.md#spring-cloud-contract"

  - id: contract-testing-036
    difficulty: intermediate
    tags: [tool-choice, scenario]
    question: |
      You have services written in Java, Go, and Node, and you want a
      broker-driven deployment gate. Which tool fits best?
    options:
      - "Pact, because it is polyglot and provides a broker with can-i-deploy"
      - "Spring Cloud Contract, because it is JVM-centric"
      - "Neither; use only end-to-end tests"
      - "A schema registry alone"
    answer: 0
    explanation: |
      Pact is polyglot (JVM, JS, .NET, Go, etc.) and its broker plus can-i-deploy
      give the deployment gate. SCC is JVM-centric, so it fits an all-Spring shop
      better than a polyglot one.
    ref: "concepts.md#spring-cloud-contract"

  - id: contract-testing-037
    difficulty: intermediate
    tags: [bidirectional, definition]
    question: |
      In bi-directional contract testing (BDCT), how is compatibility determined?
    options:
      - "The broker statically compares the consumer contract against the provider's own contract (typically its OpenAPI spec)"
      - "The provider replays every consumer pact against its real implementation"
      - "The consumer deploys the provider and runs e2e tests"
      - "A human manually reviews both APIs"
    answer: 0
    explanation: |
      In BDCT the provider publishes a provider contract (usually OpenAPI, verified
      by its own tests) and the consumer publishes its consumer contract; the
      broker performs a static cross-contract comparison to check the consumer's
      expectations fit inside what the provider's spec allows.
    ref: "concepts.md#bi-directional-contract-testing"

  - id: contract-testing-038
    difficulty: advanced
    tags: [bidirectional, tradeoff]
    question: |
      What is the main confidence limitation of bi-directional contract testing
      compared with classic Pact CDC verification?
    options:
      - "It requires all services running together"
      - "The comparison is static against the provider's stated spec, so it cannot catch the implementation diverging from that spec"
      - "It cannot handle more than one consumer"
      - "It only works for messaging, not HTTP"
    answer: 1
    explanation: |
      BDCT compares against the provider's stated contract (OpenAPI). It is static,
      so it verifies stated behaviour, not actual runtime behaviour — if the spec
      lies about the implementation, BDCT won't catch it, whereas classic
      verification runs the real provider.
    ref: "concepts.md#bi-directional-contract-testing"

  - id: contract-testing-039
    difficulty: intermediate
    tags: [bidirectional, benefit]
    question: |
      Why might a team choose BDCT for a hard-to-instrument or third-party provider?
    options:
      - "Because it forces the provider to run consumer pacts"
      - "Because it removes the need for any consumer tests"
      - "Because it is the only way to test messaging"
      - "Because the provider only needs to maintain its OpenAPI spec plus its own tests, without replaying consumer pacts"
    answer: 3
    explanation: |
      BDCT lowers coupling and effort: the provider just maintains its OpenAPI plus
      normal tests and does not have to run consumer pacts — useful when the
      provider is third-party or hard to instrument.
    ref: "concepts.md#bi-directional-contract-testing"

  - id: contract-testing-040
    difficulty: intermediate
    tags: [schema-vs-contract]
    question: |
      What question does contract testing answer that plain OpenAPI schema
      validation does not?
    options:
      - "Is this JSON syntactically valid?"
      - "Is the field a string or a number?"
      - "Do this specific consumer and this provider actually agree on what is exchanged (and for classic CDC, does the real provider comply)?"
      - "Does the payload exceed a size limit?"
    answer: 2
    explanation: |
      Schema validation checks structural conformance to the declared surface.
      Contract testing answers whether a specific consumer and provider actually
      agree on the interactions used, and (for classic CDC) whether the real
      provider complies — a behavioural, usage-scoped question.
    ref: "concepts.md#contract-vs-schema-openapi-testing"

  - id: contract-testing-041
    difficulty: intermediate
    tags: [schema-vs-contract, removed-field]
    question: |
      A provider removes a response field. Which is more likely to catch that this
      breaks a real consumer?
    options:
      - "OpenAPI schema validation, always"
      - "Neither can detect it"
      - "A contract test, because a consumer that depends on the field will fail verification"
      - "Only a load test"
    answer: 2
    explanation: |
      Schema validation only flags it if the field is still spec-required. A
      contract test catches it directly: a consumer whose contract includes that
      field will fail provider verification, revealing the real break.
    ref: "concepts.md#contract-vs-schema-openapi-testing"

  - id: contract-testing-042
    difficulty: intermediate
    tags: [schema-vs-contract, complementary]
    question: |
      Which best describes the relationship between schema testing and contract testing?
    options:
      - "They are mutually exclusive; pick one"
      - "They are complementary: schema gives broad structural validation, contract adds consumer-specific behavioural guarantees and the deploy gate"
      - "Schema testing fully replaces contract testing"
      - "Contract testing is only for UIs"
    answer: 1
    explanation: |
      They complement each other. Schema/compatibility rules give broad structural
      validation (great for event pipelines/registries); contract tests add the
      consumer-specific, behavioural guarantee and the deployment gate. BDCT even
      uses OpenAPI as the provider contract.
    ref: "concepts.md#contract-vs-schema-openapi-testing"

  - id: contract-testing-043
    difficulty: beginner
    tags: [pyramid, placement]
    question: |
      Where do contract tests sit in the test pyramid?
    options:
      - "Below unit tests, as the fastest layer"
      - "At the very top, replacing all e2e tests"
      - "In the service/integration band — above unit tests, below end-to-end tests"
      - "Outside the pyramid entirely"
    answer: 2
    explanation: |
      Contract tests occupy the service/integration band: above unit tests and
      below end-to-end. They are fast and deterministic like unit tests, yet guard
      the cross-service boundary unit tests cannot see.
    ref: "concepts.md#where-it-fits-in-the-pyramid-and-the-e2e-trade-off"

  - id: contract-testing-044
    difficulty: intermediate
    tags: [e2e-tradeoff]
    question: |
      Which type of bug do end-to-end tests catch that contract tests fundamentally cannot?
    options:
      - "A serialization mismatch on a single endpoint"
      - "A renamed field in one provider response"
      - "Emergent whole-system/workflow behaviour that only appears when all services run together"
      - "A wrong HTTP status code"
    answer: 2
    explanation: |
      Contract tests never run the real end-to-end path, so they cannot catch
      emergent whole-system behaviour (multi-service workflows, auth flows, infra
      /config). That is exactly what a thin layer of e2e tests is kept for.
    ref: "concepts.md#where-it-fits-in-the-pyramid-and-the-e2e-trade-off"

  - id: contract-testing-045
    difficulty: intermediate
    tags: [e2e-tradeoff, strategy]
    question: |
      What is the recommended relationship between contract tests and end-to-end tests?
    options:
      - "Replace all e2e tests with contract tests"
      - "Push everything the contract can express down to contract tests, and keep a thin layer of e2e for critical whole-system journeys"
      - "Keep a large e2e suite and skip contract tests"
      - "Use e2e tests for field-level structure checks"
    answer: 1
    explanation: |
      Contract testing replaces the bulk of cross-service e2e, not all of it. Push
      everything expressible as a contract down to contract tests, and reserve a
      small e2e layer for critical, emergent whole-system journeys.
    ref: "concepts.md#where-it-fits-in-the-pyramid-and-the-e2e-trade-off"

  - id: contract-testing-046
    difficulty: advanced
    tags: [scenario, diagnosis]
    question: |
      A team's contract suite goes red almost every day because the provider's
      responses include a freshly generated `createdAt` timestamp that the
      consumer asserted as an exact literal. What is the correct fix?
    options:
      - "Delete the timestamp field from the provider's response"
      - "Change the consumer contract to match the timestamp with a type/format matcher instead of an exact value"
      - "Disable contract testing for that endpoint"
      - "Pin the provider's clock to a fixed time in production"
    answer: 1
    explanation: |
      The contract is over-specified. Replacing the exact-value assertion with a
      type/regex/format matcher makes it assert structure, not a value that
      legitimately changes each call — eliminating the false failures without
      weakening the real guarantee.
    ref: "concepts.md#what-a-contract-is"

  - id: contract-testing-047
    difficulty: advanced
    tags: [scenario, cdc-handshake]
    question: |
      Put the consumer-driven handshake in the correct order.
    options:
      - "Consumer generates pact → publish to broker → provider fetches, sets states, verifies against real impl and publishes results → can-i-deploy gates deploy"
      - "Provider verifies → consumer generates pact → can-i-deploy → publish to broker"
      - "can-i-deploy → provider verifies → consumer generates pact → deploy"
      - "Provider writes OpenAPI → consumer reads it → deploy"
    answer: 0
    explanation: |
      The handshake: the consumer test generates a pact and publishes it to the
      broker; the provider fetches it, sets up provider states, replays requests
      against the real implementation, and publishes results; can-i-deploy then
      gates the deploy on the matrix.
    ref: "concepts.md#consumer-driven-contracts-cdc"

  - id: contract-testing-048
    difficulty: advanced
    tags: [scenario, tool-choice]
    question: |
      An all-Spring shop wants provider engineers to author version-controlled
      contract files that are reused as both provider tests and consumer stubs.
      Which tool best matches this?
    options:
      - "Pact with a Pact Broker"
      - "A load-testing tool like Gatling"
      - "A schema registry only"
      - "Spring Cloud Contract"
    answer: 3
    explanation: |
      Spring Cloud Contract fits: the provider hand-writes Groovy/YAML contracts in
      source control, and the build reuses them to generate provider verification
      tests and a WireMock stub JAR for consumers.
    ref: "concepts.md#spring-cloud-contract"

  - id: contract-testing-049
    difficulty: intermediate
    tags: [scenario, integration-vs-contract]
    question: |
      Your cross-service integration suite is slow and flaky because it boots five
      services together. Which change most directly targets the root cause?
    options:
      - "Replace the cross-service checks with contract tests so each side is verified independently"
      - "Add more retries to the flaky tests"
      - "Run the suite less often"
      - "Increase the CI machine's memory"
    answer: 0
    explanation: |
      Booting many services together is the root cause of the slowness and
      flakiness. Contract tests verify each side independently against a shared
      contract, removing the need to run everything together while still guarding
      the boundary.
    ref: "concepts.md#the-problem-contract-testing-solves"

  - id: contract-testing-050
    difficulty: advanced
    tags: [scenario, pending-pacts]
    question: |
      A consumer on a feature branch publishes a new expectation the provider does
      not yet satisfy. You do not want this to break the provider's main build,
      but you do want the provider team to see it. What mechanism fits?
    options:
      - "Delete the consumer's pact from the broker"
      - "Verify it as a pending (or WIP) pact so the failure is reported but non-blocking"
      - "Force-merge the consumer change"
      - "Turn off provider verification entirely"
    answer: 1
    explanation: |
      Pending pacts (and WIP pacts) let a new, not-yet-satisfied expectation be
      verified and reported without breaking the provider build, so the consumer
      can share intent early while the provider decides when to satisfy it.
    ref: "concepts.md#versioning-contracts"
