topic: "End-to-End & UI Testing"
domain: testing
topic_slug: end-to-end-and-ui-testing
version: 1
questions:
  - id: end-to-end-and-ui-testing-001
    difficulty: beginner
    tags: [e2e, scope, definition]
    question: |
      What best distinguishes an end-to-end (E2E) test from a unit or
      integration test?
    options:
      - "It drives the whole system through its real outer interface (UI or API) with nothing under test stubbed"
      - "It runs faster because it skips the database"
      - "It always uses a mocking framework to isolate the class under test"
      - "It only checks a single boundary such as code-to-database"
    answer: 0
    explanation: |
      An E2E test exercises a complete user journey through the real outermost
      interface (browser UI or public API), with the full stack wired together
      and no internal mocking of the components under test. Unit tests isolate
      one class; integration tests verify a single boundary.
    ref: "concepts.md#e2e-scope-testing-through-the-ui-or-api"

  - id: end-to-end-and-ui-testing-002
    difficulty: beginner
    tags: [e2e, api, scope]
    question: |
      Which of these is an example of an API-level E2E test (as opposed to a
      UI E2E test)?
    options:
      - "Calling a private method directly with a mocked repository"
      - "Using REST-assured to call a deployed public API and assert on the response and its side effects"
      - "Rendering a component in isolation and snapshotting its DOM"
      - "Verifying a single SQL query against an in-memory H2 database"
    answer: 1
    explanation: |
      API E2E drives the deployed server stack through its public API and
      asserts on responses/side effects, skipping the browser. It still
      exercises the whole back-end stack without stubbing the components under
      test.
    ref: "concepts.md#e2e-scope-testing-through-the-ui-or-api"

  - id: end-to-end-and-ui-testing-003
    difficulty: beginner
    tags: [pyramid, why-few]
    question: |
      Why are E2E tests placed at the TOP (narrow tip) of the test pyramid?
    options:
      - "They are the cheapest and fastest tests to run"
      - "They provide the least confidence, so they are least important"
      - "They are the slowest, most flaky, and most expensive, so you keep few of them"
      - "They cannot be automated and must always be run manually"
    answer: 2
    explanation: |
      E2E tests boot real components and do real network/rendering work, making
      them slow, flaky, and costly to maintain, and they localize failures
      poorly. The pyramid therefore prescribes only a thin cap of them.
    ref: "concepts.md#why-few-e2e-tests-slow-flaky-expensive"

  - id: end-to-end-and-ui-testing-004
    difficulty: beginner
    tags: [why-few, localization]
    question: |
      A single E2E test just went red. Compared to a failing unit test, what is
      a well-known weakness of the E2E failure?
    options:
      - "It always indicates a false positive"
      - "It can only fail because of a network error"
      - "It cannot produce a stack trace"
      - "It localizes the failure poorly — it tells you something broke, rarely exactly what"
    answer: 3
    explanation: |
      Because an E2E test spans the whole stack, a red result rarely pinpoints
      the offending component; debugging means bisecting the entire system. A
      unit test points at one function.
    ref: "concepts.md#why-few-e2e-tests-slow-flaky-expensive"

  - id: end-to-end-and-ui-testing-005
    difficulty: intermediate
    tags: [pyramid, economics]
    question: |
      Fowler's and Google's guidance for deciding where a check belongs is best
      summarized as:
    options:
      - "Push each check to the lowest layer of the pyramid that can catch the bug"
      - "Test everything at the E2E level for maximum realism"
      - "Only write tests for code with less than 80% coverage"
      - "Prefer manual testing for business logic"
    answer: 0
    explanation: |
      The economic argument is to catch each bug at the cheapest layer that can:
      logic in unit tests, boundaries in integration tests, and reserve E2E for
      verifying critical journeys hold together.
    ref: "concepts.md#why-few-e2e-tests-slow-flaky-expensive"

  - id: end-to-end-and-ui-testing-006
    difficulty: beginner
    tags: [ice-cream-cone, anti-pattern]
    question: |
      What is the "ice-cream-cone" testing anti-pattern?
    options:
      - "Writing tests only after a release"
      - "An inverted pyramid: many manual/E2E/UI tests on top and very few unit tests at the base"
      - "Running all tests in a single thread"
      - "Using real databases in unit tests"
    answer: 1
    explanation: |
      The ice-cream cone inverts the pyramid — a heavy blob of manual and E2E/UI
      tests with a pinched middle and almost no unit tests — producing slow,
      flaky suites that still let regressions through.
    ref: "concepts.md#the-test-pyramid-and-the-ice-cream-cone-anti-pattern"

  - id: end-to-end-and-ui-testing-007
    difficulty: intermediate
    tags: [ice-cream-cone, fix]
    question: |
      A team's suite takes an hour, is chronically flaky, and regressions still
      slip through — classic ice-cream-cone symptoms. What is the recommended
      remedy?
    options:
      - "Delete all E2E tests"
      - "Add more E2E tests to cover the gaps"
      - "Re-balance: move logic checks down to unit/integration and keep only critical-journey E2E tests"
      - "Run the E2E tests more frequently"
    answer: 2
    explanation: |
      The fix is not to delete E2E tests but to rebalance the pyramid — push
      logic checks down to cheap unit/integration tests and retain only the
      critical-journey E2E tests at the top.
    ref: "concepts.md#the-test-pyramid-and-the-ice-cream-cone-anti-pattern"

  - id: end-to-end-and-ui-testing-008
    difficulty: intermediate
    tags: [critical-journeys, when-worth-it]
    question: |
      Which criterion best decides whether a flow deserves an E2E test?
    options:
      - "Whether it improves line coverage numbers"
      - "Whether the QA team has spare time this sprint"
      - "Whether it is the newest feature in the codebase"
      - "Whether a whole-system failure of that flow would be a business/revenue emergency"
    answer: 3
    explanation: |
      E2E budget is spent on critical user journeys chosen by revenue/risk
      impact (login, checkout/payment, sign-up, compliance-sensitive flows) —
      not by coverage metrics. Ask "would we page someone if this broke?"
    ref: "concepts.md#when-e2e-is-worth-it-critical-user-journeys"

  - id: end-to-end-and-ui-testing-009
    difficulty: intermediate
    tags: [critical-journeys, variations]
    question: |
      You have an E2E test for the checkout journey. Where should you cover
      variations like "invalid credit card" and "item out of stock"?
    options:
      - "Cover them with cheaper integration/unit tests rather than more E2E permutations"
      - "Add a separate E2E test for each variation"
      - "Do not test them at all"
      - "Only test them manually before each release"
    answer: 0
    explanation: |
      Keep one E2E test per critical journey and cover the many variations with
      cheaper integration/unit tests. Multiplying E2E permutations bloats the
      slow, flaky top of the pyramid.
    ref: "concepts.md#when-e2e-is-worth-it-critical-user-journeys"

  - id: end-to-end-and-ui-testing-010
    difficulty: beginner
    tags: [selenium, playwright, auto-wait]
    question: |
      What is the single biggest architectural difference that makes Playwright
      and Cypress less prone to timing flakiness than Selenium?
    options:
      - "They are written in Rust"
      - "They auto-wait: every action first checks the element is actionable and retries until a timeout"
      - "They never touch a real browser"
      - "They run tests only in headed mode"
    answer: 1
    explanation: |
      Selenium has no built-in auto-waiting, so developers must add explicit
      waits (a top flakiness source). Playwright and Cypress auto-wait on each
      action, eliminating the most common class of flaky UI test by design.
    ref: "concepts.md#selenium-webdriver-vs-playwright-vs-cypress"

  - id: end-to-end-and-ui-testing-011
    difficulty: intermediate
    tags: [cypress, architecture]
    question: |
      Which statement about Cypress's architecture is correct?
    options:
      - "It drives the browser out-of-process over the W3C WebDriver protocol"
      - "It only supports Java as a test language"
      - "It runs inside the browser's event loop alongside the application under test"
      - "It requires Selenium Grid to run in parallel"
    answer: 2
    explanation: |
      Cypress runs in-browser, in the same event loop as the app, which gives it
      strong retry-ability and control but historically constrains multi-tab and
      multi-origin scenarios. It is JS/TS only.
    ref: "concepts.md#selenium-webdriver-vs-playwright-vs-cypress"

  - id: end-to-end-and-ui-testing-012
    difficulty: intermediate
    tags: [selenium, strengths]
    question: |
      A team must automate tests in Java, C#, Python, and Ruby across the widest
      set of real browsers using a shared grid. Which tool's ecosystem fits best?
    options:
      - "Cypress"
      - "A visual-diffing service"
      - "A fixed Thread.sleep loop"
      - "Selenium/WebDriver"
    answer: 3
    explanation: |
      Selenium/WebDriver has the broadest language support, real-browser
      coverage, the W3C-standard protocol, and Selenium Grid for distributed
      execution. That ecosystem breadth is its main advantage over
      Playwright/Cypress.
    ref: "concepts.md#selenium-webdriver-vs-playwright-vs-cypress"

  - id: end-to-end-and-ui-testing-013
    difficulty: beginner
    tags: [waits, sleep, flakiness]
    question: |
      Why is `Thread.sleep(3000)` before clicking an element considered an
      anti-pattern in UI tests?
    options:
      - "It is both flaky (too short) and slow (too long) and never encodes the real condition you care about"
      - "It is not supported by any browser"
      - "It only works in headless mode"
      - "It waits for the wrong element automatically"
    answer: 0
    explanation: |
      A fixed sleep is simultaneously flaky and slow: too short and the element
      isn't ready; too long and every run wastes time. It never waits for the
      actual condition (visible/clickable), which an explicit wait does.
    ref: "concepts.md#explicit-vs-implicit-waits-and-the-flakiness-they-fight"

  - id: end-to-end-and-ui-testing-014
    difficulty: intermediate
    tags: [implicit-wait, selenium]
    question: |
      In Selenium, what is an implicit wait and what is its default value?
    options:
      - "A per-condition poll; default 30 seconds"
      - "A session-wide setting that makes every element lookup poll for up to N seconds; default 0"
      - "A fixed sleep applied only to clicks; default 5 seconds"
      - "A retry of the whole test; default 3 attempts"
    answer: 1
    explanation: |
      An implicit wait is a coarse, session-wide setting causing every element
      lookup to poll for presence up to N seconds. Its default is 0, meaning the
      driver returns an error immediately if the element is absent.
    ref: "concepts.md#explicit-vs-implicit-waits-and-the-flakiness-they-fight"

  - id: end-to-end-and-ui-testing-015
    difficulty: intermediate
    tags: [explicit-wait, waits]
    question: |
      What is the advantage of an explicit wait over an implicit wait?
    options:
      - "It applies globally to every lookup with no code"
      - "It always waits the full timeout before continuing"
      - "It polls for a specific condition (visible, clickable, text present) and proceeds as soon as it is true"
      - "It disables all actionability checks"
    answer: 2
    explanation: |
      An explicit wait targets a specific condition and returns as soon as that
      condition holds, waiting exactly as long as needed — unlike the coarse
      "element present" semantics of an implicit wait.
    ref: "concepts.md#explicit-vs-implicit-waits-and-the-flakiness-they-fight"

  - id: end-to-end-and-ui-testing-016
    difficulty: advanced
    tags: [waits, mixing, gotcha]
    question: |
      Why do the Selenium docs warn against mixing implicit and explicit waits?
    options:
      - "It is not allowed by the compiler"
      - "The browser crashes on the first mixed call"
      - "Explicit waits stop working entirely"
      - "It can produce unpredictable wait times — e.g. a 10s implicit plus a 15s explicit can time out well beyond either value"
    answer: 3
    explanation: |
      Combining the two makes wait durations compound unpredictably; the docs
      cite a 10s implicit + 15s explicit potentially timing out around 20s+. Best
      practice is explicit waits with the implicit wait set to 0.
    ref: "concepts.md#explicit-vs-implicit-waits-and-the-flakiness-they-fight"

  - id: end-to-end-and-ui-testing-017
    difficulty: advanced
    tags: [actionability, playwright]
    question: |
      Before Playwright performs a `click()`, which set of actionability checks
      must pass (with auto-retry until timeout)?
    options:
      - "Visible, stable, enabled, and receives events (is the hit target)"
      - "Only that the element exists in the DOM"
      - "Editable and readonly"
      - "That the page has finished all network requests"
    answer: 0
    explanation: |
      For a click, Playwright waits for the element to be visible, stable (same
      bounding box across two animation frames), enabled, and the hit target at
      the click point. `fill` instead needs visible + enabled + editable.
    ref: "concepts.md#actionability-and-web-first-auto-retrying-assertions"

  - id: end-to-end-and-ui-testing-018
    difficulty: advanced
    tags: [actionability, visibility, gotcha]
    question: |
      In Playwright's visibility check, which element is still considered
      "visible"?
    options:
      - "An element with `display:none`"
      - "An element with `opacity:0` (it has a non-empty bounding box)"
      - "An element with `visibility:hidden`"
      - "A zero-size element"
    answer: 1
    explanation: |
      Playwright treats an element as visible if it has a non-empty bounding box
      and is not `visibility:hidden`/`display:none`. An `opacity:0` element still
      occupies space, so it counts as visible even though a human can't see it.
    ref: "concepts.md#actionability-and-web-first-auto-retrying-assertions"

  - id: end-to-end-and-ui-testing-019
    difficulty: intermediate
    tags: [web-first-assertions, auto-retry]
    question: |
      What makes `expect(locator).toBeVisible()` a "web-first" assertion?
    options:
      - "It evaluates the DOM exactly once and fails immediately if false"
      - "It only works against a static HTML snapshot"
      - "It auto-retries, polling until the condition becomes true or the timeout fires"
      - "It requires a manual Thread.sleep beforehand"
    answer: 2
    explanation: |
      Web-first assertions auto-retry rather than evaluating a single time. That
      is what makes them robust against async rendering — the assertion itself
      waits for the app to reach the expected state.
    ref: "concepts.md#actionability-and-web-first-auto-retrying-assertions"

  - id: end-to-end-and-ui-testing-020
    difficulty: beginner
    tags: [page-object-model, pattern]
    question: |
      What does the Page Object Model (POM) encapsulate?
    options:
      - "The assertions and expected values for every test"
      - "The database seed data for a test"
      - "The CI pipeline configuration"
      - "A page's locators and interactions behind intent-revealing methods"
    answer: 3
    explanation: |
      A page object wraps the locators and interactions for a page/component,
      exposing methods that read in business terms. Tests speak intent while the
      fragile selectors live in one place.
    ref: "concepts.md#page-object-model-pom"

  - id: end-to-end-and-ui-testing-021
    difficulty: intermediate
    tags: [page-object-model, maintainability]
    question: |
      What is the primary maintainability benefit of the Page Object Model?
    options:
      - "A UI change (e.g. a renamed selector) is fixed in one class instead of across every test"
      - "It makes tests run in parallel automatically"
      - "It removes the need for any waits"
      - "It guarantees 100% code coverage"
    answer: 0
    explanation: |
      POM provides a single source of truth for a page's locators/interactions,
      so a UI change touches one class rather than every test that used the
      element — reducing brittleness and duplication.
    ref: "concepts.md#page-object-model-pom"

  - id: end-to-end-and-ui-testing-022
    difficulty: advanced
    tags: [page-object-model, assertions, best-practice]
    question: |
      A colleague puts assertions like `assertEquals("$10", total)` inside the
      `CheckoutPage` page object. Why is this discouraged?
    options:
      - "Assertions are not allowed in Java classes"
      - "The page object should model interactions/state exposure; assertions belong in the test, keeping the object reusable and the test's intent clear"
      - "It makes the page object run faster"
      - "Page objects cannot return values"
    answer: 1
    explanation: |
      Mixing assertions into a page object couples it to one test's
      expectations, reducing reuse and hiding what a test verifies. The page
      object should expose state; the test owns the assertions.
    ref: "concepts.md#page-object-model-pom"

  - id: end-to-end-and-ui-testing-023
    difficulty: intermediate
    tags: [selectors, locator-strategy]
    question: |
      Which locator strategy is generally the MOST robust to UI change?
    options:
      - "XPath by DOM position, e.g. //div[3]/span"
      - "CSS selectors tied to styling classes"
      - "User-facing/accessibility locators (role + accessible name, label text)"
      - "Absolute element index in the DOM"
    answer: 2
    explanation: |
      Role/label/user-facing locators are resilient to markup churn and double as
      an accessibility check. Dedicated test IDs are next best. CSS-by-class and
      positional XPath are brittle because they couple to styling/structure.
    ref: "concepts.md#selectors-and-locator-strategy"

  - id: end-to-end-and-ui-testing-024
    difficulty: intermediate
    tags: [selectors, data-testid]
    question: |
      Why do teams add `data-testid` (or `data-test`) attributes for E2E tests?
    options:
      - "They improve production page-load performance"
      - "They automatically generate page objects"
      - "They are required by the W3C WebDriver spec"
      - "They give tests a stable hook decoupled from styling and copy, so restyling doesn't break tests"
    answer: 3
    explanation: |
      Dedicated test IDs are added deliberately for tests and are independent of
      CSS classes and text copy, so a design refactor or wording change won't
      break selectors that a user would never notice.
    ref: "concepts.md#selectors-and-locator-strategy"

  - id: end-to-end-and-ui-testing-025
    difficulty: intermediate
    tags: [selectors, brittleness, scenario]
    question: |
      A test locates a button with the CSS selector `.btn.btn-primary.mt-3`.
      After a designer refactors the CSS, the test breaks though the button still
      works for users. What is the root problem?
    options:
      - "The selector couples the test to styling/layout rather than behaviour"
      - "The test needed a longer implicit wait"
      - "The button must be tested in headed mode"
      - "The test should assert on pixel colors instead"
    answer: 0
    explanation: |
      Selecting by styling classes ties the test to presentation, not behaviour,
      so a purely cosmetic change breaks it. A role/label or `data-testid`
      locator would survive the restyle.
    ref: "concepts.md#selectors-and-locator-strategy"

  - id: end-to-end-and-ui-testing-026
    difficulty: intermediate
    tags: [test-data, independence]
    question: |
      What is the core principle for E2E test data that keeps a suite
      deterministic?
    options:
      - "All tests share one long-lived data set to save setup time"
      - "Each test owns its data — it creates what it needs (ideally via a fast API/DB seed) and doesn't rely on other tests"
      - "Never clean up data between tests"
      - "Always create data only through the UI"
    answer: 1
    explanation: |
      Test-data independence — each test creating its own data with unique keys —
      prevents interference and the "passes alone, fails in the suite" problem.
      Shared mutable data is a top flakiness source.
    ref: "concepts.md#test-data-and-environment-setup"

  - id: end-to-end-and-ui-testing-027
    difficulty: advanced
    tags: [test-data, parallel, unique-keys]
    question: |
      Why randomize values like `user+{uuid}@example.com` in E2E setup?
    options:
      - "To make tests harder to read"
      - "To bypass authentication"
      - "To avoid key collisions when tests run in parallel or repeatedly against the same environment"
      - "To reduce the number of assertions needed"
    answer: 2
    explanation: |
      Unique per-test/per-run keys prevent collisions (e.g. duplicate-email
      errors) when tests execute concurrently or the environment is reused,
      keeping tests independent and parallel-safe.
    ref: "concepts.md#test-data-and-environment-setup"

  - id: end-to-end-and-ui-testing-028
    difficulty: advanced
    tags: [test-data, determinism, external-services]
    question: |
      Even in an E2E test, why might you still stub a third-party payment gateway
      or freeze the clock?
    options:
      - "Because E2E tests must mock everything under test"
      - "To increase the number of network round-trips"
      - "Because payment gateways don't have sandboxes"
      - "To control non-determinism at the edges — external outages, timing, and RNG — so the journey stays deterministic"
    answer: 3
    explanation: |
      Genuinely external, uncontrollable dependencies and time/RNG are edges you
      control (stub the gateway or use its sandbox, freeze the clock, seed RNG) so
      the E2E test remains deterministic without abandoning full-stack coverage.
    ref: "concepts.md#test-data-and-environment-setup"

  - id: end-to-end-and-ui-testing-029
    difficulty: intermediate
    tags: [test-data, environment, ephemeral]
    question: |
      What is the main trade-off of using an ephemeral per-run environment
      (Testcontainers/Docker Compose/preview env) for E2E tests?
    options:
      - "It gives clean, isolated, parallel-safe state at the cost of infra complexity and slower startup"
      - "It makes tests order-dependent"
      - "It forces all tests to share one database"
      - "It eliminates the need for any assertions"
    answer: 0
    explanation: |
      Ephemeral environments provide clean isolation ideal for parallel runs but
      add infrastructure cost/complexity and slower startup compared with a
      shared long-lived environment.
    ref: "concepts.md#test-data-and-environment-setup"

  - id: end-to-end-and-ui-testing-030
    difficulty: beginner
    tags: [headless, headed]
    question: |
      What is the difference between running browser tests headless vs headed?
    options:
      - "Headless renders to a visible window; headed does not"
      - "Headless runs without a visible browser UI (faster, needed on CI with no display); headed shows the window for local debugging"
      - "Headed tests cannot use assertions"
      - "Headless only works with Selenium"
    answer: 1
    explanation: |
      Headless runs the browser with no visible window — faster, lower resource
      use, and required on display-less CI servers. Headed shows the window and is
      used for local debugging.
    ref: "concepts.md#headless-vs-headed-execution"

  - id: end-to-end-and-ui-testing-031
    difficulty: advanced
    tags: [headless, debugging, scenario]
    question: |
      A test passes headed locally but fails headless in CI. What is the most
      likely first suspect?
    options:
      - "The assertions are wrong"
      - "The programming language is incompatible with headless"
      - "Viewport/window-size differences (responsive layout hiding an element) or a timing difference"
      - "The test needs to be rewritten in XPath"
    answer: 2
    explanation: |
      Headed/headless differences usually come from default window/viewport size
      (responsive layout changes what's visible) or timing. Enable trace/video
      artifacts to diagnose rather than debugging blind.
    ref: "concepts.md#headless-vs-headed-execution"

  - id: end-to-end-and-ui-testing-032
    difficulty: intermediate
    tags: [headless, artifacts, best-practice]
    question: |
      What practice makes headless CI failures diagnosable without re-running the
      test headed?
    options:
      - "Disabling all waits"
      - "Deleting the test that fails"
      - "Running tests only in a single thread"
      - "Capturing screenshots, video, and traces on failure"
    answer: 3
    explanation: |
      Since you can't watch a headless run, capturing screenshots/video/traces on
      failure lets you reconstruct what happened, which is why modern tools emit
      these artifacts by default.
    ref: "concepts.md#headless-vs-headed-execution"

  - id: end-to-end-and-ui-testing-033
    difficulty: beginner
    tags: [visual-regression, definition]
    question: |
      What does visual regression testing catch that functional assertions miss?
    options:
      - "Appearance bugs — broken layout, wrong color, overlapping text — that pass every functional check"
      - "Wrong database query results"
      - "Slow API response times"
      - "Missing unit-test coverage"
    answer: 0
    explanation: |
      Visual regression testing captures a screenshot and compares it to an
      approved baseline, catching purely visual defects (layout/color/overlap)
      that functional assertions on behaviour would never detect.
    ref: "concepts.md#visual-regression-testing"

  - id: end-to-end-and-ui-testing-034
    difficulty: advanced
    tags: [visual-regression, flakiness, environment]
    question: |
      Naive pixel-diff visual tests are notoriously flaky across machines
      primarily because:
    options:
      - "Screenshots cannot be stored in version control"
      - "Font rendering and anti-aliasing differ across OSes/browser versions, so identical pages diff"
      - "Baselines expire after 24 hours"
      - "Pixels are randomly generated each run"
    answer: 1
    explanation: |
      Different OS/browser combinations render fonts and anti-aliasing
      differently, so the same page produces slightly different pixels. Pinning
      the rendering environment (a fixed container image) makes baselines
      reproducible.
    ref: "concepts.md#visual-regression-testing"

  - id: end-to-end-and-ui-testing-035
    difficulty: intermediate
    tags: [visual-regression, mitigation]
    question: |
      Which technique reduces false positives in visual regression tests caused
      by dynamic content (dates, ads, animations)?
    options:
      - "Increasing the implicit wait"
      - "Running the test headed only"
      - "Masking dynamic regions, using tolerance thresholds, and freezing time/animations"
      - "Removing the baseline entirely"
    answer: 2
    explanation: |
      Masking dynamic areas, applying a diff tolerance, and freezing
      time/animations stop legitimately-changing content from failing the test,
      while still catching genuine layout regressions.
    ref: "concepts.md#visual-regression-testing"

  - id: end-to-end-and-ui-testing-036
    difficulty: beginner
    tags: [ci, parallelization]
    question: |
      What must be true about E2E tests before you can safely run them in
      parallel across many workers?
    options:
      - "They must all share one mutable database record"
      - "They must be written in the same file"
      - "They must run in headed mode"
      - "They must be independent, with isolated test data, so parallel runs don't corrupt shared state"
    answer: 3
    explanation: |
      Parallelism requires test independence and isolated data; otherwise
      concurrent tests trample shared state and produce flaky, order-dependent
      failures.
    ref: "concepts.md#e2e-in-ci-parallelization-sharding-retries"

  - id: end-to-end-and-ui-testing-037
    difficulty: intermediate
    tags: [ci, sharding]
    question: |
      When sharding an E2E suite across N machines, how should you balance the
      shards to minimize wall-clock time?
    options:
      - "By historical test duration, so no single shard becomes a straggler"
      - "By equal number of tests per shard"
      - "Alphabetically by test name"
      - "By putting all slow tests in one shard"
    answer: 0
    explanation: |
      Balancing by count can leave one shard with all the slow tests. Balancing
      by historical duration evens out wall-clock time and avoids a straggler
      shard that gates the whole run.
    ref: "concepts.md#e2e-in-ci-parallelization-sharding-retries"

  - id: end-to-end-and-ui-testing-038
    difficulty: advanced
    tags: [ci, retries, flakiness]
    question: |
      What is the correct view of automatic test retries in CI?
    options:
      - "They are a permanent cure for flakiness"
      - "They are a pragmatic buffer but a smell, not a cure — track tests that only pass on retry and fix them"
      - "They should be applied to every test unconditionally to hide failures"
      - "They make tests run faster"
    answer: 1
    explanation: |
      Limited retries absorb residual nondeterminism, but retrying everything
      hides real regressions and inflates run time. Retries are a signal: track
      which tests need them and fix the underlying flakiness.
    ref: "concepts.md#e2e-in-ci-parallelization-sharding-retries"

  - id: end-to-end-and-ui-testing-039
    difficulty: intermediate
    tags: [ci, pipeline-order]
    question: |
      Where should E2E tests typically run in a CI pipeline relative to unit and
      integration tests?
    options:
      - "First, before anything else"
      - "Only in production after release"
      - "After unit and integration tests, often against a deployed staging/ephemeral environment"
      - "In parallel with compilation"
    answer: 2
    explanation: |
      Fail the cheap, fast tests first; run the slow E2E stage afterward against a
      deployed environment. E2E may gate promotion to production but shouldn't
      block on failures the earlier stages could have caught.
    ref: "concepts.md#e2e-in-ci-parallelization-sharding-retries"

  - id: end-to-end-and-ui-testing-040
    difficulty: advanced
    tags: [flakiness, scenario, waits]
    question: |
      A Selenium test intermittently fails clicking a "Submit" button that
      appears after an AJAX call. The code is `driver.findElement(By.id("submit")).click();`.
      What is the best fix?
    options:
      - "Add `Thread.sleep(5000)` before the click"
      - "Switch the test to headed mode"
      - "Increase the number of retries to 10"
      - "Wrap the click in an explicit wait: WebDriverWait ... until(elementToBeClickable(By.id(\"submit\")))"
    answer: 3
    explanation: |
      The failure is a timing race — the button isn't clickable yet. An explicit
      wait on `elementToBeClickable` waits for the exact condition and proceeds as
      soon as it's met, unlike a fixed sleep (flaky/slow) or blanket retries
      (hides the bug).
    ref: "concepts.md#explicit-vs-implicit-waits-and-the-flakiness-they-fight"

  - id: end-to-end-and-ui-testing-041
    difficulty: advanced
    tags: [flakiness, scenario, test-data]
    question: |
      An E2E test passes when run alone but fails when the full suite runs in
      parallel, with a "duplicate email" error. What is the most likely cause?
    options:
      - "Test-data coupling — the test reuses a hard-coded email that another parallel test also creates"
      - "The browser is too slow in headless mode"
      - "The assertion library has a bug"
      - "Visual regression baselines are stale"
    answer: 0
    explanation: |
      Shared/hard-coded data collides under parallel execution. Generating a
      unique email per test (e.g. with a UUID) restores independence and removes
      the collision-driven flakiness.
    ref: "concepts.md#test-data-and-environment-setup"

  - id: end-to-end-and-ui-testing-042
    difficulty: intermediate
    tags: [scope, black-box]
    question: |
      Which statement is TRUE about what an E2E test stubs?
    options:
      - "It stubs the database to run faster"
      - "It stubs nothing under test — it treats the system as a black box and exercises the real components"
      - "It stubs the front end but keeps the back end real"
      - "It stubs all HTTP calls including internal ones"
    answer: 1
    explanation: |
      The defining trait of E2E is that nothing under test is stubbed; the value
      is confidence that the deployed components actually work together. (Only
      genuinely external third parties or time/RNG may be controlled for
      determinism.)
    ref: "concepts.md#e2e-scope-testing-through-the-ui-or-api"

  - id: end-to-end-and-ui-testing-043
    difficulty: intermediate
    tags: [pyramid, count, healthy-suite]
    question: |
      Roughly how many E2E tests should a healthy suite have, and what does
      unbounded growth signal?
    options:
      - "Thousands; growth signals good coverage"
      - "Exactly one per class"
      - "In the tens; unbounded growth signals logic leaking up the pyramid"
      - "As many as the QA team can write manually"
    answer: 2
    explanation: |
      A healthy E2E suite is counted in the tens, one per critical journey.
      Unbounded growth means checks that belong in cheaper unit/integration tests
      are leaking up into the slow, flaky top layer.
    ref: "concepts.md#when-e2e-is-worth-it-critical-user-journeys"

  - id: end-to-end-and-ui-testing-044
    difficulty: advanced
    tags: [selenium, playwright, migration, interview]
    question: |
      Besides auto-waiting, which of these is a commonly cited reason teams
      migrate from Selenium to Playwright?
    options:
      - "Playwright cannot run in CI"
      - "Playwright removes the need to write any assertions"
      - "Playwright supports only manual testing"
      - "Better debugging via trace viewer/time-travel, network interception, and built-in parallelism"
    answer: 3
    explanation: |
      Beyond auto-waiting, Playwright offers faster execution, trace-viewer/
      time-travel debugging, network interception, and out-of-the-box
      parallelism. The trade-off is Selenium's broader language/browser/Grid
      ecosystem and W3C-standard protocol.
    ref: "concepts.md#selenium-webdriver-vs-playwright-vs-cypress"

  - id: end-to-end-and-ui-testing-045
    difficulty: intermediate
    tags: [flakiness, quarantine, culture]
    question: |
      Why is a chronically flaky test that "people just re-run" described as a
      liability rather than an asset?
    options:
      - "It trains the team to ignore red builds, so a real regression it eventually catches gets dismissed"
      - "It uses too much disk space"
      - "It always runs slower than other tests"
      - "It cannot be written in Java"
    answer: 0
    explanation: |
      Habitual re-running erodes trust: people stop believing red builds, so when
      the flaky test finally catches a genuine regression, it's ignored. Flaky
      tests should be quarantined or fixed aggressively.
    ref: "concepts.md#why-few-e2e-tests-slow-flaky-expensive"

  - id: end-to-end-and-ui-testing-046
    difficulty: intermediate
    tags: [page-object-model, component-object, modern]
    question: |
      What is a modern refinement of the classic full-page Page Object Model?
    options:
      - "Putting all locators in the test file"
      - "Component objects — one per reusable widget rather than per full page"
      - "Removing methods and using raw selectors everywhere"
      - "Storing selectors in the database"
    answer: 1
    explanation: |
      Component objects model reusable widgets (a date picker, a nav bar) rather
      than whole pages, improving reuse and matching component-based UIs.
      Playwright fixtures and Cypress custom commands play a similar role.
    ref: "concepts.md#page-object-model-pom"

  - id: end-to-end-and-ui-testing-047
    difficulty: advanced
    tags: [visual-regression, baseline, best-practice]
    question: |
      When the UI changes intentionally, how should visual-regression baselines
      be handled?
    options:
      - "Always run 'update all baselines' automatically on every failure"
      - "Delete the visual tests"
      - "Review the diffs and update baselines deliberately for the intended change"
      - "Ignore the failures until the next release"
    answer: 2
    explanation: |
      Baselines must be reviewed and updated intentionally when the UI legitimately
      changes. Blindly auto-updating every baseline defeats the purpose, because a
      real regression would silently become the new "approved" image.
    ref: "concepts.md#visual-regression-testing"

  - id: end-to-end-and-ui-testing-048
    difficulty: advanced
    tags: [ci, time-budget, interview, scenario]
    question: |
      An E2E suite's wall-clock time is blowing the CI budget. Which combination
      of measures is the recommended way to bring it under control?
    options:
      - "Add more E2E tests and run them headed"
      - "Move all unit tests into the E2E suite"
      - "Disable all waits and hope for the best"
      - "Shard by duration across machines, run headless, ensure independence for safe parallelism, use limited retries with flaky tracking, and keep the count small by pushing logic down the pyramid"
    answer: 3
    explanation: |
      The combined strategy — duration-balanced sharding, headless execution,
      independence-enabled parallelism, limited/ tracked retries, and shrinking the
      suite by relocating logic checks to cheaper layers — is how you keep a large
      E2E suite within a time budget.
    ref: "concepts.md#e2e-in-ci-parallelization-sharding-retries"
