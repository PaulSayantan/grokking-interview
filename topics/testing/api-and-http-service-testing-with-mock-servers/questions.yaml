topic: "API & HTTP Service Testing with Mock Servers"
domain: testing
topic_slug: api-and-http-service-testing-with-mock-servers
version: 1
questions:
  - id: api-and-http-service-testing-with-mock-servers-001
    difficulty: beginner
    tags: [mock-server, fundamentals]
    question: |
      What distinguishes a "mock server" (like WireMock) from mocking the HTTP client
      class with Mockito?
    options:
      - "A mock server runs a real HTTP server on a port, so your real client makes real HTTP calls to it"
      - "A mock server can only return static files, while Mockito can return dynamic values"
      - "There is no difference; WireMock is just a wrapper around Mockito"
      - "A mock server requires the real downstream service to be running"
    answer: 0
    explanation: |
      A mock server listens on a real port; your code's real HTTP client (with its
      serialization, timeouts, and interceptors) makes real requests to it. Mocking the
      client object with Mockito bypasses the entire wire/serialization/config layer.
    ref: "concepts.md#testing-http-boundaries-what-a-mock-server-is-and-why-it-matters"

  - id: api-and-http-service-testing-with-mock-servers-002
    difficulty: intermediate
    tags: [mock-server, mockito, coverage]
    question: |
      Your service calls a downstream over HTTPS. A bug where the base URL is misconfigured
      and a required header is dropped reaches production. Which testing approach would most
      likely have caught this?
    options:
      - "Mocking the HTTP client with Mockito to return a canned response"
      - "A pure unit test of the response-parsing method"
      - "Increasing line-coverage thresholds"
      - "A mock server (WireMock) that the real client calls, with request-header matching"
    answer: 3
    explanation: |
      A Mockito mock of the client never exercises URL construction or header wiring. A
      mock server receives the real request, so header/URL matchers fail loudly when the
      client is misconfigured.
    ref: "concepts.md#testing-http-boundaries-what-a-mock-server-is-and-why-it-matters"

  - id: api-and-http-service-testing-with-mock-servers-003
    difficulty: beginner
    tags: [client-server, boundaries]
    question: |
      When your service calls a downstream payment API, which role is your service playing
      in that interaction?
    options:
      - "HTTP server"
      - "HTTP proxy"
      - "HTTP client"
      - "Load balancer"
    answer: 2
    explanation: |
      Your service initiates the request, so it is the HTTP client for that call. It is the
      HTTP server only when answering requests from its own callers.
    ref: "concepts.md#testing-http-boundaries-what-a-mock-server-is-and-why-it-matters"

  - id: api-and-http-service-testing-with-mock-servers-004
    difficulty: intermediate
    tags: [strategy, trade-offs]
    question: |
      What is the primary risk of relying on mock servers with hand-written stubs to test
      integration with a downstream you don't own?
    options:
      - "Stub drift: the stub can diverge from the real service and tests stay green while prod breaks"
      - "Mock servers are too slow for CI"
      - "Mock servers cannot return error status codes"
      - "They require the real service to be available"
    answer: 0
    explanation: |
      A hand-written stub encodes your assumption of the downstream's behaviour. If the real
      service changes and the stub doesn't, tests pass but production fails. This "stub
      drift" is exactly what contract testing addresses.
    ref: "concepts.md#choosing-between-a-mock-server-the-real-service-and-a-contract"

  - id: api-and-http-service-testing-with-mock-servers-005
    difficulty: intermediate
    tags: [strategy, contract, pyramid]
    question: |
      Which question is a contract test (e.g., Pact) uniquely suited to answer, compared to
      a mock-server integration test?
    options:
      - "Does my code correctly parse a malformed response?"
      - "Does my code retry on a 503?"
      - "Do my code and the REAL downstream still agree on the message shape?"
      - "How fast does my endpoint respond under load?"
    answer: 2
    explanation: |
      A contract is verified against the real provider, so it catches when the two sides
      drift apart. Mock servers can inject arbitrary responses/errors but never verify the
      real provider still honours the contract.
    ref: "concepts.md#choosing-between-a-mock-server-the-real-service-and-a-contract"

  - id: api-and-http-service-testing-with-mock-servers-006
    difficulty: intermediate
    tags: [strategy, e2e, pyramid]
    question: |
      Following the test pyramid, how should end-to-end tests against the real downstream
      services be used relative to mock-server tests?
    options:
      - "Use E2E tests for every error path since they are most realistic"
      - "Replace all mock-server tests with E2E tests once staging exists"
      - "Keep only a small number of real E2E tests (happy path); cover error injection at the mock-server layer"
      - "Avoid mock servers entirely and rely on contract tests plus E2E"
    answer: 2
    explanation: |
      Real E2E tests are slow and flaky and hard to drive into error states, so keep them
      few and focused on the happy path. Error/latency injection belongs in the fast,
      deterministic mock-server layer.
    ref: "concepts.md#choosing-between-a-mock-server-the-real-service-and-a-contract"

  - id: api-and-http-service-testing-with-mock-servers-007
    difficulty: beginner
    tags: [wiremock, stubbing]
    question: |
      In WireMock, what does `stubFor(get(urlPathEqualTo("/x")).willReturn(okJson("{}")))`
      do?
    options:
      - "Asserts that a GET to /x was already made"
      - "Registers a stub: when a GET matches /x, respond 200 with the given JSON body"
      - "Forwards the request to the real /x endpoint"
      - "Records traffic to /x for later playback"
    answer: 1
    explanation: |
      `stubFor` registers a mapping from a request matcher to a canned response. It controls
      responses; asserting a request happened is done with `verify(...)`.
    ref: "concepts.md#wiremock-stubbing-responses-and-matching-requests"

  - id: api-and-http-service-testing-with-mock-servers-008
    difficulty: intermediate
    tags: [wiremock, url-matching, gotcha]
    question: |
      A client sometimes sends `?b=2&a=1` and sometimes `?a=1&b=2`. A stub uses
      `urlEqualTo("/x?a=1&b=2")` and intermittently gets no match. What is the fix?
    options:
      - "Use urlEqualTo with a regex of both orderings"
      - "Switch to MockWebServer, which ignores query strings"
      - "Add atPriority(1) to the stub"
      - "Use urlPathEqualTo(\"/x\") plus explicit withQueryParam matchers, which are order-invariant"
    answer: 3
    explanation: |
      `urlEqualTo` matches the full path+query string exactly, so query-param order matters.
      `urlPathEqualTo` matches the path only, and `withQueryParam` matchers compare each
      parameter independently of order.
    ref: "concepts.md#wiremock-stubbing-responses-and-matching-requests"

  - id: api-and-http-service-testing-with-mock-servers-009
    difficulty: intermediate
    tags: [wiremock, json, body-matching]
    question: |
      Why is `equalToJson(...)` preferred over a plain string equality match for a JSON
      request body in WireMock?
    options:
      - "It compares JSON semantically, so key order and whitespace differences don't cause false mismatches"
      - "It is faster to evaluate"
      - "It automatically ignores the Content-Type header"
      - "String matching is not supported by WireMock"
    answer: 0
    explanation: |
      `equalToJson` performs a semantic comparison of the JSON structure, so reordered keys
      or differing whitespace still match. Raw string equality would fail on cosmetic
      differences that don't change meaning.
    ref: "concepts.md#wiremock-stubbing-responses-and-matching-requests"

  - id: api-and-http-service-testing-with-mock-servers-010
    difficulty: advanced
    tags: [wiremock, json, matchers]
    question: |
      Which `equalToJson` flags let a stub match even when the actual body has fields in a
      different array order and includes extra fields the stub doesn't list?
    options:
      - "ignoreArrayOrder and ignoreExtraElements"
      - "strictMode and lenientMode"
      - "matchAnyOrder and allowUnknown"
      - "There are no such flags; equalToJson is always strict"
    answer: 0
    explanation: |
      `equalToJson(json, ignoreArrayOrder, ignoreExtraElements)` accepts two booleans:
      `ignoreArrayOrder` allows array elements in any order, and `ignoreExtraElements`
      allows additional fields in the actual body.
    ref: "concepts.md#wiremock-stubbing-responses-and-matching-requests"

  - id: api-and-http-service-testing-with-mock-servers-011
    difficulty: intermediate
    tags: [wiremock, priority]
    question: |
      Two WireMock stubs could match the same request. One has `atPriority(1)`, the other
      `atPriority(5)`. Which wins?
    options:
      - "The one with atPriority(5), because higher numbers mean higher priority"
      - "The one with atPriority(1), because 1 is the highest priority"
      - "The most recently registered one, ignoring priority"
      - "Neither; WireMock returns a 500 on ambiguous stubs"
    answer: 1
    explanation: |
      In WireMock, lower `atPriority` values mean higher priority (1 wins over 5). Priority
      lets you register a broad catch-all default and override it for specific cases.
    ref: "concepts.md#wiremock-stubbing-responses-and-matching-requests"

  - id: api-and-http-service-testing-with-mock-servers-012
    difficulty: intermediate
    tags: [wiremock, good-test, request-matching]
    question: |
      A stub matches only on the URL path and returns a valid body. Why might this be a
      "bad stub"?
    options:
      - "It will be too slow because it doesn't cache"
      - "WireMock requires body matching or it throws"
      - "It passes even if the client sends the wrong method, forgets the auth header, or malforms the body"
      - "URL-only matching is not allowed in WireMock"
    answer: 2
    explanation: |
      A stub that only checks the URL provides no assertion of the request's method,
      headers, or body, so a broken client still gets a happy response. Good stubs also
      constrain the request shape so wrong requests fail.
    ref: "concepts.md#wiremock-stubbing-responses-and-matching-requests"

  - id: api-and-http-service-testing-with-mock-servers-013
    difficulty: beginner
    tags: [wiremock, verify]
    question: |
      In WireMock, which mechanism asserts that your code sent a particular request?
    options:
      - "stubFor(...)"
      - "willReturn(...)"
      - "verify(...) with a requestedFor matcher"
      - "inScenario(...)"
    answer: 2
    explanation: |
      `verify(postRequestedFor(...))` queries WireMock's journal of received requests. It
      asserts the request side; `stubFor`/`willReturn` control the response side.
    ref: "concepts.md#verifying-requests-your-code-sent"

  - id: api-and-http-service-testing-with-mock-servers-014
    difficulty: intermediate
    tags: [wiremock, verify, count]
    question: |
      You want to assert your code called `/charges` exactly once with an idempotency-key
      header. Which is correct?
    options:
      - "verify(exactly(1), postRequestedFor(urlPathEqualTo(\"/charges\")).withHeader(\"Idempotency-Key\", matching(\"[0-9a-f-]{36}\")))"
      - "stubFor(post(\"/charges\").withHeader(\"Idempotency-Key\", present()))"
      - "assertThat(server.requests()).hasSize(1)"
      - "verify(post(\"/charges\")).times(1)"
    answer: 0
    explanation: |
      `verify(exactly(1), postRequestedFor(...))` asserts both the count and the request
      shape using the same matcher DSL used for stubbing. The other options either only stub
      or aren't valid WireMock verification calls.
    ref: "concepts.md#verifying-requests-your-code-sent"

  - id: api-and-http-service-testing-with-mock-servers-015
    difficulty: advanced
    tags: [verify, brittleness, best-practice]
    question: |
      What is the risk of verifying every single field of a request body in a WireMock
      `verify(...)` call?
    options:
      - "It slows down the test significantly"
      - "WireMock cannot verify more than three fields at once"
      - "It causes false negatives because verify ignores the body"
      - "It makes the test brittle — coupled to details that don't matter, breaking on harmless changes"
    answer: 3
    explanation: |
      Over-specifying verification couples the test to incidental details, so unrelated,
      harmless changes break it. Verify what matters (e.g., the idempotency key, currency),
      not every field — the same brittleness concern as over-using mock verification.
    ref: "concepts.md#verifying-requests-your-code-sent"

  - id: api-and-http-service-testing-with-mock-servers-016
    difficulty: intermediate
    tags: [stub-vs-mock, verify]
    question: |
      Mapping to the general test-double vocabulary, WireMock's `stubFor` and `verify`
      correspond to which two concepts?
    options:
      - "Dummy and fake"
      - "Stub (canned answers / state) and mock (interaction / behaviour verification)"
      - "Spy and dummy"
      - "Fake and stub"
    answer: 1
    explanation: |
      `stubFor` provides canned answers (stub — you check your code's resulting state);
      `verify` asserts that specific interactions occurred (mock — behaviour verification).
      WireMock plays both roles.
    ref: "concepts.md#verifying-requests-your-code-sent"

  - id: api-and-http-service-testing-with-mock-servers-017
    difficulty: intermediate
    tags: [mockwebserver, fifo]
    question: |
      What is the default response-selection model of OkHttp's MockWebServer?
    options:
      - "A FIFO queue: enqueued responses are returned in the order enqueued"
      - "Request matching by URL and headers"
      - "Random selection from a pool"
      - "It always returns the last-enqueued response"
    answer: 0
    explanation: |
      MockWebServer returns enqueued responses in FIFO order regardless of which request
      arrives. For request-dependent responses you override a custom Dispatcher.
    ref: "concepts.md#okhttp-mockwebserver-and-wiremock-compared"

  - id: api-and-http-service-testing-with-mock-servers-018
    difficulty: intermediate
    tags: [mockwebserver, recorded-request]
    question: |
      In MockWebServer, how do you inspect the request your client actually sent?
    options:
      - "server.verify(...)"
      - "server.getLastResponse()"
      - "server.takeRequest() returns a RecordedRequest you can assert on"
      - "server.dispatcher().history()"
    answer: 2
    explanation: |
      `takeRequest()` returns a `RecordedRequest` exposing method, path, headers, and body,
      which you assert with your normal assertion library.
    ref: "concepts.md#okhttp-mockwebserver-and-wiremock-compared"

  - id: api-and-http-service-testing-with-mock-servers-019
    difficulty: intermediate
    tags: [mockwebserver, wiremock, tool-choice]
    question: |
      For a focused unit test of a single HTTP client where you just need one canned
      response and want a tiny dependency, which is the better fit?
    options:
      - "WireMock standalone server with full request matching"
      - "Pact consumer test"
      - "A real Testcontainers instance of the downstream"
      - "OkHttp MockWebServer with a single enqueued response"
    answer: 3
    explanation: |
      MockWebServer is a lightweight, FIFO-queue server ideal for a couple of focused client
      tests. WireMock's richer matching/verification/fault features are overkill for one
      canned response.
    ref: "concepts.md#okhttp-mockwebserver-and-wiremock-compared"

  - id: api-and-http-service-testing-with-mock-servers-020
    difficulty: advanced
    tags: [mockwebserver, dispatcher]
    question: |
      Your MockWebServer test must return different bodies depending on the request path,
      not in a fixed order. What do you use?
    options:
      - "Enqueue all responses; MockWebServer matches by path automatically"
      - "Override the Dispatcher's dispatch(RecordedRequest) to route by path"
      - "Call setBodyForPath(...)"
      - "This requires switching to WireMock; MockWebServer cannot do it"
    answer: 1
    explanation: |
      The default queue is order-based. To make responses depend on the incoming request,
      set a custom `Dispatcher` and implement `dispatch(RecordedRequest)` to choose a
      response by path (or other attributes).
    ref: "concepts.md#okhttp-mockwebserver-and-wiremock-compared"

  - id: api-and-http-service-testing-with-mock-servers-021
    difficulty: beginner
    tags: [fault-injection, latency]
    question: |
      Which WireMock feature simulates a slow downstream so you can test your client's read
      timeout?
    options:
      - "withStatus(408)"
      - "withFault(Fault.EMPTY_RESPONSE)"
      - "atPriority(1)"
      - "withFixedDelay(milliseconds)"
    answer: 3
    explanation: |
      `withFixedDelay` makes the stub wait before responding. Setting the client's read
      timeout lower than the delay lets you deterministically test timeout handling.
    ref: "concepts.md#simulating-faults-errors-timeouts-latency-and-rate-limits"

  - id: api-and-http-service-testing-with-mock-servers-022
    difficulty: intermediate
    tags: [fault-injection, timeout, gotcha]
    question: |
      You set a WireMock stub `withFixedDelay(3000)` but your test asserting a timeout
      never fails as expected. The client's read timeout is 10 seconds. What's wrong?
    options:
      - "The read timeout (10s) is longer than the delay (3s), so the response arrives before timing out — set the timeout below the delay"
      - "The delay must be negative to trigger a timeout"
      - "withFixedDelay only works with POST requests"
      - "WireMock caps delays at 1000ms"
    answer: 0
    explanation: |
      To fire a read timeout, the client's timeout must be shorter than the stub delay
      (e.g., 500ms timeout vs 3000ms delay). With a 10s timeout the 3s response arrives
      normally, so no timeout occurs.
    ref: "concepts.md#simulating-faults-errors-timeouts-latency-and-rate-limits"

  - id: api-and-http-service-testing-with-mock-servers-023
    difficulty: advanced
    tags: [fault-injection, connection-faults]
    question: |
      Which WireMock `Fault` value causes the server to send an OK status header, then
      garbage, then close the connection?
    options:
      - "EMPTY_RESPONSE"
      - "CONNECTION_RESET_BY_PEER"
      - "MALFORMED_RESPONSE_CHUNK"
      - "RANDOM_DATA_THEN_CLOSE"
    answer: 2
    explanation: |
      `MALFORMED_RESPONSE_CHUNK` sends a 200 status followed by garbage then closes.
      `RANDOM_DATA_THEN_CLOSE` sends only garbage; `EMPTY_RESPONSE` returns nothing;
      `CONNECTION_RESET_BY_PEER` resets the socket.
    ref: "concepts.md#simulating-faults-errors-timeouts-latency-and-rate-limits"

  - id: api-and-http-service-testing-with-mock-servers-024
    difficulty: intermediate
    tags: [fault-injection, rate-limit]
    question: |
      How would you use a mock server to test that your client honours a rate limit?
    options:
      - "Return 200 with a huge body to slow the client down"
      - "Use withFault(Fault.CONNECTION_RESET_BY_PEER)"
      - "Enqueue an empty response"
      - "Return 429 with a Retry-After header and assert the client backs off before retrying"
    answer: 3
    explanation: |
      A 429 (Too Many Requests) plus a `Retry-After` header is the standard rate-limit
      signal. You stub that response and verify your client waits/backs off appropriately.
    ref: "concepts.md#simulating-faults-errors-timeouts-latency-and-rate-limits"

  - id: api-and-http-service-testing-with-mock-servers-025
    difficulty: advanced
    tags: [fault-injection, chunked]
    question: |
      What does WireMock's `withChunkedDribbleDelay(numberOfChunks, totalDuration)`
      simulate?
    options:
      - "A completely dropped connection"
      - "An immediate 503 error"
      - "The response body dripped slowly across chunks over the total duration (a slow/stalled stream)"
      - "Random duplicate responses"
    answer: 2
    explanation: |
      Chunked dribble delay splits the body into N chunks spread across the total duration,
      simulating a slow or stalled network stream — useful for testing read timeouts on
      streaming responses.
    ref: "concepts.md#simulating-faults-errors-timeouts-latency-and-rate-limits"

  - id: api-and-http-service-testing-with-mock-servers-026
    difficulty: intermediate
    tags: [retries, scenarios, wiremock]
    question: |
      Which WireMock capability lets successive identical requests receive different
      responses (e.g., "fail twice, then succeed") to test retry logic?
    options:
      - "Stateful stubs via scenarios (inScenario / whenScenarioStateIs / willSetStateTo)"
      - "atPriority"
      - "equalToJson with ignoreArrayOrder"
      - "withUniformRandomDelay"
    answer: 0
    explanation: |
      Scenarios model a state machine: each matching request can transition state and return
      a different response, so you can script "503, 503, then 200" to exercise retries.
    ref: "concepts.md#testing-retries-backoff-and-circuit-breakers"

  - id: api-and-http-service-testing-with-mock-servers-027
    difficulty: intermediate
    tags: [retries, verify]
    question: |
      After scripting a stub to fail twice then succeed, how do you prove your code actually
      retried the right number of times?
    options:
      - "Check the test passed — that's enough"
      - "Inspect the client's internal retry counter via reflection"
      - "Count the number of stubs registered"
      - "verify(exactly(3), getRequestedFor(...)) to assert three attempts hit the server"
    answer: 3
    explanation: |
      Verifying the request count against the mock server proves how many attempts actually
      went over the wire — the authoritative signal that retry logic behaved as intended.
    ref: "concepts.md#testing-retries-backoff-and-circuit-breakers"

  - id: api-and-http-service-testing-with-mock-servers-028
    difficulty: advanced
    tags: [circuit-breaker, testing]
    question: |
      How do you verify a circuit breaker trips to OPEN and then fails fast without calling
      the downstream?
    options:
      - "Stub persistent failures, drive enough calls to trip the breaker, then verify request count stops rising"
      - "Stub a single 200 and assert the breaker opens"
      - "Set withFixedDelay to a very large value"
      - "Rely on the breaker's logs only"
    answer: 0
    explanation: |
      Drive enough failures to open the breaker, then assert (via WireMock verify) that
      subsequent calls no longer reach the server — proving fail-fast. Advancing an injected
      clock tests the HALF_OPEN transition.
    ref: "concepts.md#testing-retries-backoff-and-circuit-breakers"

  - id: api-and-http-service-testing-with-mock-servers-029
    difficulty: advanced
    tags: [retries, flakiness, clock]
    question: |
      What is the best way to keep retry/backoff tests fast and non-flaky when the backoff
      uses real time?
    options:
      - "Add Thread.sleep in the test to wait out the backoff"
      - "Inject a virtual scheduler/clock so backoff time is simulated rather than real"
      - "Reduce the number of assertions"
      - "Run the test in a separate JVM"
    answer: 1
    explanation: |
      Real `Thread.sleep`-based backoff makes tests slow and timing-dependent. Injecting a
      controllable clock/scheduler lets you advance time deterministically, keeping the test
      fast and stable.
    ref: "concepts.md#testing-retries-backoff-and-circuit-breakers"

  - id: api-and-http-service-testing-with-mock-servers-030
    difficulty: advanced
    tags: [retries, double-retry, gotcha]
    question: |
      Both your HTTP client and a Resilience4j `@Retry` are configured to retry. What bug
      can this cause, and how would you detect it?
    options:
      - "Nothing; layered retries are always safe"
      - "The circuit breaker never opens; detect it via logs"
      - "Retries multiply (e.g., 3 x 3 = 9 wire calls); detect it with verify(exactly(n)) on the mock server"
      - "Requests are deduplicated automatically"
    answer: 2
    explanation: |
      Nested retry layers multiply attempts, hammering the downstream. A
      `verify(exactly(n), ...)` on the mock server reveals the true wire-call count and
      exposes the double-retry.
    ref: "concepts.md#testing-retries-backoff-and-circuit-breakers"

  - id: api-and-http-service-testing-with-mock-servers-031
    difficulty: beginner
    tags: [rest-assured, structure]
    question: |
      REST Assured tests are structured around which fluent pattern?
    options:
      - "arrange / act / assert only via JUnit"
      - "given() / when() / then()"
      - "setup() / exercise() / verify()"
      - "stub() / call() / verify()"
    answer: 1
    explanation: |
      REST Assured reads as given (request setup) / when (fire the HTTP call) / then
      (assert status, headers, body) — a BDD-style expression of arrange/act/assert.
    ref: "concepts.md#rest-assured-testing-the-api-your-service-exposes"

  - id: api-and-http-service-testing-with-mock-servers-032
    difficulty: intermediate
    tags: [rest-assured, use-case]
    question: |
      What does REST Assured primarily test, in contrast to WireMock?
    options:
      - "The REST API your own service exposes, by making real HTTP calls to it"
      - "The downstream services your code calls"
      - "Database queries"
      - "The serialization library in isolation"
    answer: 0
    explanation: |
      REST Assured exercises YOUR endpoints (or any live API) over real HTTP. WireMock, by
      contrast, fakes the downstreams your code calls.
    ref: "concepts.md#rest-assured-testing-the-api-your-service-exposes"

  - id: api-and-http-service-testing-with-mock-servers-033
    difficulty: intermediate
    tags: [rest-assured, json-path]
    question: |
      In REST Assured, `.body("name", equalTo("Ada"))` uses what to navigate the response
      body?
    options:
      - "A regular expression on the raw bytes"
      - "An XPath expression only"
      - "A SQL query"
      - "A GPath/JsonPath expression with a Hamcrest matcher"
    answer: 3
    explanation: |
      REST Assured uses GPath/JsonPath expressions (e.g., `roles[0].name`, `items.size()`)
      combined with Hamcrest matchers like `equalTo`, `greaterThan`, and `notNullValue`.
    ref: "concepts.md#rest-assured-testing-the-api-your-service-exposes"

  - id: api-and-http-service-testing-with-mock-servers-034
    difficulty: intermediate
    tags: [rest-assured, spring-boot]
    question: |
      To make REST Assured tests exercise the real application over a real port, they are
      commonly paired with what?
    options:
      - "@WebMvcTest (no server)"
      - "@SpringBootTest(webEnvironment = RANDOM_PORT) or a container running the app"
      - "Mockito's @Mock"
      - "A standalone WireMock server"
    answer: 1
    explanation: |
      REST Assured needs a running server. `@SpringBootTest(webEnvironment = RANDOM_PORT)`
      boots the full app on a real port; `@WebMvcTest` does not start a server (it's for
      MockMvc slices).
    ref: "concepts.md#rest-assured-testing-the-api-your-service-exposes"

  - id: api-and-http-service-testing-with-mock-servers-035
    difficulty: advanced
    tags: [rest-assured, json-schema]
    question: |
      Which REST Assured assertion validates a response against a JSON schema?
    options:
      - "body(matchesJsonSchemaInClasspath(\"user-schema.json\"))"
      - "statusCode(schemaValid())"
      - "assertThat().conformsTo(\"schema\")"
      - "expect().schema(\"user-schema.json\")"
    answer: 0
    explanation: |
      `matchesJsonSchemaInClasspath(...)` validates the response body against a JSON Schema
      file, a concise way to assert the whole payload shape rather than field by field.
    ref: "concepts.md#rest-assured-testing-the-api-your-service-exposes"

  - id: api-and-http-service-testing-with-mock-servers-036
    difficulty: intermediate
    tags: [mockmvc, spring, pointer]
    question: |
      How does Spring's `MockMvc` differ from a REST Assured test against a running server?
    options:
      - "MockMvc opens a real socket; REST Assured does not"
      - "They are identical"
      - "MockMvc drives the Spring MVC dispatcher in-process without a real socket; REST Assured makes real HTTP calls over a port"
      - "MockMvc can only test downstream calls"
    answer: 2
    explanation: |
      `MockMvc` invokes the dispatcher directly in-process (fast, no network, no real client
      stack). REST Assured/@SpringBootTest(RANDOM_PORT) go over a real port, exercising the
      full HTTP layer.
    ref: "concepts.md#mockmvc-and-webtestclient-pointer-to-the-spring-domain"

  - id: api-and-http-service-testing-with-mock-servers-037
    difficulty: intermediate
    tags: [webtestclient, spring, pointer]
    question: |
      `WebTestClient` is most associated with which Spring stack?
    options:
      - "Spring Batch"
      - "The reactive/WebFlux stack (though it can also bind to a running server)"
      - "Spring Data JDBC only"
      - "Spring Security only"
    answer: 1
    explanation: |
      `WebTestClient` is the reactive testing client; it can bind to a controller,
      application context, or a real running server. Its details live in the Spring testing
      topics this domain points to.
    ref: "concepts.md#mockmvc-and-webtestclient-pointer-to-the-spring-domain"

  - id: api-and-http-service-testing-with-mock-servers-038
    difficulty: intermediate
    tags: [mockmvc, trade-off]
    question: |
      A bug you fear lives in the HTTP wire layer (content negotiation, real serialization,
      client timeouts). Which tool is LEAST able to catch it?
    options:
      - "REST Assured against a running server"
      - "@SpringBootTest(RANDOM_PORT) end-to-end test"
      - "MockMvc, which bypasses the real socket and client stack"
      - "WireMock exercising the real client"
    answer: 2
    explanation: |
      `MockMvc` invokes the dispatcher in-process without a real socket, so it cannot catch
      wire-level issues. Real-port tools (REST Assured, full @SpringBootTest) and WireMock
      (for the client side) do exercise the wire.
    ref: "concepts.md#mockmvc-and-webtestclient-pointer-to-the-spring-domain"

  - id: api-and-http-service-testing-with-mock-servers-039
    difficulty: beginner
    tags: [contract, pact, cdc]
    question: |
      In consumer-driven contract testing with Pact, who defines the contract?
    options:
      - "The provider, upfront"
      - "A third-party schema registry"
      - "The API gateway"
      - "The consumer declares what it needs; the provider proves it still satisfies that"
    answer: 3
    explanation: |
      In CDC, the consumer expresses the exact interactions it depends on, generating the
      contract; the provider then verifies it still meets those expectations. This is the
      inversion that gives CDC its name.
    ref: "concepts.md#consumer-driven-contract-testing-pact-spring-cloud-contract"

  - id: api-and-http-service-testing-with-mock-servers-040
    difficulty: intermediate
    tags: [contract, pact, workflow]
    question: |
      What happens on the PROVIDER side during Pact verification?
    options:
      - "Each recorded request is replayed against the real provider and its response must contain at least the fields the consumer expects"
      - "The provider generates the pact file"
      - "The provider mocks the consumer"
      - "Nothing; the consumer test alone proves compatibility"
    answer: 0
    explanation: |
      Provider verification replays each interaction's request against the real provider and
      checks the actual response includes at least the expected fields (providers may add
      fields but must not remove ones the consumer uses).
    ref: "concepts.md#consumer-driven-contract-testing-pact-spring-cloud-contract"

  - id: api-and-http-service-testing-with-mock-servers-041
    difficulty: intermediate
    tags: [contract, pact, provider-states]
    question: |
      Pact interactions are independent. How do you express a precondition like "user 123
      already exists" for an interaction?
    options:
      - "Chain interactions in a required order"
      - "Use a provider state (e.g., given(\"user 123 exists\")) that sets up data before the interaction is verified"
      - "Insert the row from the consumer test"
      - "Disable independence with a flag"
    answer: 1
    explanation: |
      Provider states let the provider set up required data for an interaction. Because
      interactions are independent, preconditions are handled via states rather than
      ordering.
    ref: "concepts.md#consumer-driven-contract-testing-pact-spring-cloud-contract"

  - id: api-and-http-service-testing-with-mock-servers-042
    difficulty: advanced
    tags: [contract, pact, broker, deploy]
    question: |
      What role does the Pact Broker's `can-i-deploy` serve?
    options:
      - "It deploys the service automatically"
      - "It records load-test results"
      - "It runs the consumer tests"
      - "It gates deployment on whether a given consumer/provider version pair has been verified compatible"
    answer: 3
    explanation: |
      `can-i-deploy` queries the broker for verification results and answers whether a
      specific version can be safely deployed given the contracts and their verification
      status, preventing incompatible releases.
    ref: "concepts.md#consumer-driven-contract-testing-pact-spring-cloud-contract"

  - id: api-and-http-service-testing-with-mock-servers-043
    difficulty: advanced
    tags: [contract, scope, gotcha]
    question: |
      Which statement about contract tests is correct?
    options:
      - "Contract tests replace functional tests entirely"
      - "Contract tests must spin up both services together"
      - "Contract tests should focus on message shape (requests/responses), not full behaviour, or they become brittle"
      - "Contract tests are only for databases"
    answer: 2
    explanation: |
      Pact's guidance is that contracts focus on the messages (shape), not general
      behaviour. Using them as functional tests leads to brittle, painful suites; behaviour
      belongs in the provider's own tests.
    ref: "concepts.md#consumer-driven-contract-testing-pact-spring-cloud-contract"

  - id: api-and-http-service-testing-with-mock-servers-044
    difficulty: advanced
    tags: [contract, spring-cloud-contract]
    question: |
      How does Spring Cloud Contract differ from Pact in who drives the contract?
    options:
      - "It is identical to Pact"
      - "Spring Cloud Contract is typically producer-driven: the provider writes contracts that generate verification tests AND a stub JAR (WireMock-based) for consumers"
      - "It only works for gRPC"
      - "The consumer always writes the contract in Groovy"
    answer: 1
    explanation: |
      Spring Cloud Contract is commonly producer-driven: the provider authors contracts
      (Groovy/YAML) that generate provider verification tests and publish WireMock-based stub
      JARs that consumers use. Pact is consumer-driven.
    ref: "concepts.md#consumer-driven-contract-testing-pact-spring-cloud-contract"

  - id: api-and-http-service-testing-with-mock-servers-045
    difficulty: intermediate
    tags: [record-playback, wiremock]
    question: |
      In WireMock record-and-playback, what does "record mode" do?
    options:
      - "It proxies requests to the real downstream and saves the request/response pairs as stub mappings for later offline playback"
      - "It rejects all requests until stubs are added"
      - "It generates a Pact contract"
      - "It replays a fixed queue of responses"
    answer: 0
    explanation: |
      Record mode makes WireMock a proxy to the real service, capturing real traffic into
      stub mappings. You then replay those stubs offline without the real downstream.
    ref: "concepts.md#record-and-playback-proxy-recording"

  - id: api-and-http-service-testing-with-mock-servers-046
    difficulty: advanced
    tags: [record-playback, drift, gotcha]
    question: |
      Why do recorded stubs give a FALSE sense of safety against downstream API changes?
    options:
      - "They are encrypted and cannot be read"
      - "They always fail after 24 hours"
      - "They cannot capture headers"
      - "They are a frozen snapshot from record time and keep passing even after the real API changes (drift)"
    answer: 3
    explanation: |
      Recordings freeze one moment of the downstream. When the real API later changes, the
      recorded stubs still pass — the same drift problem as any hand-written stub. Contract
      tests, not recordings, guard against drift.
    ref: "concepts.md#record-and-playback-proxy-recording"

  - id: api-and-http-service-testing-with-mock-servers-047
    difficulty: intermediate
    tags: [record-playback, security]
    question: |
      What operational hazard must you handle when committing recorded HTTP fixtures?
    options:
      - "They compress poorly"
      - "They require a database to replay"
      - "They may capture secrets/PII (auth tokens, personal data) that must be scrubbed"
      - "They only work on Linux"
    answer: 2
    explanation: |
      Recordings capture real traffic, including auth headers, tokens, and personal data.
      These must be scrubbed before committing to avoid leaking secrets or PII into the repo.
    ref: "concepts.md#record-and-playback-proxy-recording"

  - id: api-and-http-service-testing-with-mock-servers-048
    difficulty: beginner
    tags: [snapshot, golden-file]
    question: |
      How does snapshot (golden-file) testing of a payload work?
    options:
      - "The first run writes a reference file (reviewed and committed); later runs compare output to it and fail on any difference"
      - "It re-runs the test 100 times and averages results"
      - "It validates against a JSON schema only"
      - "It records HTTP traffic for playback"
    answer: 0
    explanation: |
      Snapshot/approval testing stores a golden reference (after human review) and compares
      subsequent output against it, failing on differences. It's efficient for large,
      structured payloads.
    ref: "concepts.md#snapshot--golden-file-testing-of-payloads"

  - id: api-and-http-service-testing-with-mock-servers-049
    difficulty: intermediate
    tags: [snapshot, json, comparison]
    question: |
      When snapshot-testing a JSON payload, why compare it semantically (e.g., JSONAssert)
      rather than as a raw string?
    options:
      - "Semantic comparison is required by JUnit 5"
      - "So cosmetic differences like key order and whitespace don't cause spurious failures"
      - "Raw strings cannot be stored in files"
      - "Semantic comparison ignores field values entirely"
    answer: 1
    explanation: |
      JSON with reordered keys or different whitespace is semantically identical. JSONAssert
      (STRICT/LENIENT) compares structure and values, avoiding false failures that raw string
      equality would produce.
    ref: "concepts.md#snapshot--golden-file-testing-of-payloads"

  - id: api-and-http-service-testing-with-mock-servers-050
    difficulty: advanced
    tags: [snapshot, anti-pattern, determinism]
    question: |
      What are the two biggest pitfalls of snapshot tests?
    options:
      - "They are slow and require a database"
      - "They cannot compare JSON, only XML"
      - "They only work with REST Assured"
      - "Blindly re-approving a wrong golden file bakes in bugs, and non-deterministic fields (timestamps, UUIDs) cause flakiness unless masked"
    answer: 3
    explanation: |
      The rubber-stamp anti-pattern (approving a regression) and non-determinism (unmasked
      timestamps/UUIDs/ordering) are the classic snapshot failures. Mitigate by freezing the
      clock, stubbing ID generation, and reviewing golden diffs like code.
    ref: "concepts.md#snapshot--golden-file-testing-of-payloads"
