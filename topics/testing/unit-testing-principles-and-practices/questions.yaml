topic: "Unit Testing Principles & Practices"
domain: testing
topic_slug: unit-testing-principles-and-practices
version: 1
questions:
  - id: unit-testing-principles-and-practices-001
    difficulty: beginner
    tags: [unit, definition, scope]
    question: |
      In the modern testing discipline, what is the most accurate definition of a "unit"?
    options:
      - "A unit of behavior, which may span one or a few collaborating classes"
      - "Exactly one class, always tested in complete isolation"
      - "A single public method with no dependencies"
      - "One source file regardless of how many classes it contains"
    answer: 0
    explanation: |
      A unit is a unit of *behavior*, not a unit of code. A single behavior can legitimately span
      a small cluster of collaborating classes. Equating "unit" with "one class" leads to
      over-mocking and brittle, implementation-coupled tests.
    ref: "concepts.md#what-is-a-unit-solitary-vs-sociable"
  - id: unit-testing-principles-and-practices-002
    difficulty: intermediate
    tags: [solitary, sociable, collaborators]
    question: |
      What distinguishes a "solitary" unit test from a "sociable" one (Fowler's terminology)?
    options:
      - "Solitary tests run single-threaded; sociable tests run in parallel"
      - "Solitary tests replace all collaborators with doubles; sociable tests use real collaborators and double only awkward boundaries"
      - "Solitary tests assert state; sociable tests assert exceptions"
      - "Solitary tests are written first in TDD; sociable tests are written last"
    answer: 1
    explanation: |
      A solitary test isolates the unit from *all* its neighbors using test doubles. A sociable
      test lets the unit use its real collaborators and only doubles awkward dependencies (DB,
      network, clock). The axis is how collaborators are treated, not threading or timing.
    ref: "concepts.md#what-is-a-unit-solitary-vs-sociable"
  - id: unit-testing-principles-and-practices-003
    difficulty: intermediate
    tags: [classical, mockist, london, detroit]
    question: |
      A "mockist" (London-school) tester differs from a "classicist" (Detroit-school) tester
      primarily because the mockist:
    options:
      - "Never writes tests before code"
      - "Refuses to use any test doubles at all"
      - "Verifies interactions between the unit and its (mocked) collaborators, rather than resulting state"
      - "Only tests private methods"
    answer: 2
    explanation: |
      Mockist/London-school testing mocks collaborators and verifies *interactions* (which
      methods were called), enabling outside-in TDD. Classicist/Detroit-school prefers real
      objects and verifies resulting *state*. The mockist approach couples tests to
      implementation and tends to be more brittle.
    ref: "concepts.md#what-is-a-unit-solitary-vs-sociable"
  - id: unit-testing-principles-and-practices-004
    difficulty: intermediate
    tags: [over-mocking, best-practice, state-vs-interaction]
    question: |
      What is the mainstream modern recommendation about when to use mocks in unit tests?
    options:
      - "Mock every collaborator to guarantee perfect isolation"
      - "Never use mocks under any circumstances"
      - "Use mocks only for value objects like Money or Date"
      - "Default to state-based/sociable testing and use mocks primarily at architectural boundaries (I/O, third parties, non-determinism)"
    answer: 3
    explanation: |
      Over-mocking is a leading cause of tests that pass while the system is broken because they
      lock in implementation details. The mainstream advice is to prefer real objects and verify
      state, reserving mocks for true external boundaries such as I/O, time, randomness, and
      third-party services.
    ref: "concepts.md#what-is-a-unit-solitary-vs-sociable"
  - id: unit-testing-principles-and-practices-005
    difficulty: beginner
    tags: [aaa, structure]
    question: |
      In the Arrange-Act-Assert (AAA) pattern, what happens in the "Act" phase?
    options:
      - "The single call to the unit under test is made"
      - "Test inputs and doubles are created"
      - "The outcome is compared against expectations"
      - "Resources are released"
    answer: 0
    explanation: |
      Arrange sets up inputs/doubles, Act performs the single invocation of the unit under test,
      and Assert verifies the outcome. Ideally the Act phase is exactly one action; multiple acts
      usually signal a test doing too much.
    ref: "concepts.md#arrange-act-assert-and-given-when-then"
  - id: unit-testing-principles-and-practices-006
    difficulty: beginner
    tags: [gwt, bdd, aaa]
    question: |
      How does Given-When-Then relate to Arrange-Act-Assert?
    options:
      - "They are opposites: GWT is for integration tests, AAA for unit tests"
      - "They describe the same three-part structure, GWT phrased in behavior/business language"
      - "GWT has four phases while AAA has three"
      - "GWT requires a mocking framework while AAA does not"
    answer: 1
    explanation: |
      Given/When/Then and Arrange/Act/Assert are structurally identical. GWT (from BDD) phrases
      the same setup/action/expectation in business/behavior language and is common in tools like
      Cucumber and Spock.
    ref: "concepts.md#arrange-act-assert-and-given-when-then"
  - id: unit-testing-principles-and-practices-007
    difficulty: intermediate
    tags: [aaa, act, smell]
    question: |
      A reviewer sees a test with several act/assert pairs interleaved in one @Test method. What
      is the most likely problem?
    options:
      - "The test is missing a teardown phase"
      - "It needs @TestInstance(PER_CLASS)"
      - "It is really several tests wearing one @Test and should be split"
      - "The assertions should be replaced with print statements"
    answer: 2
    explanation: |
      A well-formed test has a single Act. Multiple interleaved act/assert pairs indicate the
      method is verifying several behaviors at once, which hides failures and defeats precise
      failure localization. Split it into separate tests.
    ref: "concepts.md#arrange-act-assert-and-given-when-then"
  - id: unit-testing-principles-and-practices-008
    difficulty: intermediate
    tags: [four-phase, meszaros, teardown]
    question: |
      In Meszaros's four-phase test (Setup, Exercise, Verify, Teardown), why is Teardown often
      implicit in pure unit tests but explicit when tests touch real resources?
    options:
      - "Because JUnit forbids @AfterEach in unit tests"
      - "Because teardown only runs when a test fails"
      - "Because Verify and Teardown are the same phase"
      - "Because in-memory objects are garbage-collected, whereas files, temp dirs, threads, or containers must be released"
    answer: 3
    explanation: |
      Pure object fixtures are reclaimed by garbage collection, so no explicit teardown is needed.
      Real resources (files, temp directories, threads, containers, DB connections) must be
      explicitly released or they leak between tests, so Teardown becomes an explicit phase.
    ref: "concepts.md#the-four-phase-test"
  - id: unit-testing-principles-and-practices-009
    difficulty: advanced
    tags: [four-phase, teardown, flaky]
    question: |
      Which statement about teardown correctness is TRUE?
    options:
      - "Shared mutable state that is not torn down is a common cause of order-dependent, flaky tests"
      - "@AfterEach only runs when the test passes"
      - "Teardown always runs even if @BeforeEach setup throws"
      - "Teardown is only needed for @BeforeAll fixtures"
    answer: 0
    explanation: |
      @AfterEach runs regardless of pass/fail, but if setup itself throws, later phases may not
      run. The key hazard is shared mutable state left uncleaned, which makes tests
      order-dependent and intermittently failing. Fresh, isolated fixtures avoid this.
    ref: "concepts.md#the-four-phase-test"
  - id: unit-testing-principles-and-practices-010
    difficulty: beginner
    tags: [first, mnemonic]
    question: |
      In the FIRST mnemonic for good unit tests, what does the "R" stand for?
    options:
      - "Refactorable"
      - "Repeatable"
      - "Readable"
      - "Reusable"
    answer: 1
    explanation: |
      FIRST = Fast, Isolated/Independent, Repeatable, Self-validating, Timely/Thorough.
      Repeatable means the test yields the same verdict every run in any environment, with no
      dependence on clock, network, or machine specifics.
    ref: "concepts.md#first-properties"
  - id: unit-testing-principles-and-practices-011
    difficulty: beginner
    tags: [first, self-validating]
    question: |
      A "test" that runs code and prints its output to the console for a human to eyeball
      violates which FIRST property?
    options:
      - "Fast"
      - "Isolated"
      - "Self-validating"
      - "Timely"
    answer: 2
    explanation: |
      Self-validating means the test decides pass/fail automatically via assertions, with no human
      interpretation of logs. Printing output for manual inspection is not a real automated test.
    ref: "concepts.md#first-properties"
  - id: unit-testing-principles-and-practices-012
    difficulty: intermediate
    tags: [first, isolation, parallelism]
    question: |
      Why is the "Isolated/Independent" property of FIRST a prerequisite for running a JUnit 5
      suite in parallel?
    options:
      - "Parallel execution requires @TestInstance(PER_CLASS)"
      - "Parallel tests must all assert the same value"
      - "Isolation makes tests run faster on a single thread"
      - "Only tests without shared mutable state (statics, singletons, shared DB rows) are safe to run concurrently"
    answer: 3
    explanation: |
      Hidden shared state (static fields, singletons, shared DB rows, system properties) produces
      intermittent failures only under concurrency. FIRST's Isolated and Repeatable properties are
      exactly what make safe parallelization possible.
    ref: "concepts.md#first-properties"
  - id: unit-testing-principles-and-practices-013
    difficulty: intermediate
    tags: [first, fast, feedback]
    question: |
      Why does the "Fast" property matter so much in practice?
    options:
      - "Slow suites get skipped, breaking the tight feedback loop developers rely on"
      - "Fast tests find more bugs than slow ones"
      - "Fast tests can skip the Assert phase"
      - "JUnit fails any test that takes over one second"
    answer: 0
    explanation: |
      Speed is about the feedback loop: if the suite is slow, developers stop running it on every
      change, and the safety net erodes. Fast unit tests (milliseconds each) can be run
      constantly. JUnit does not impose a one-second limit.
    ref: "concepts.md#first-properties"
  - id: unit-testing-principles-and-practices-014
    difficulty: beginner
    tags: [naming, readability]
    question: |
      Why are test names like "test1" or "testWithdraw" considered poor?
    options:
      - "They are too long for CI logs"
      - "They don't describe the behavior/expected outcome, so a failure tells you nothing"
      - "JUnit 5 rejects method names starting with 'test'"
      - "They force the use of @DisplayName"
    answer: 1
    explanation: |
      A good test name reads like a requirement so that a red test in a CI log immediately
      communicates what broke. Names lacking the scenario, input/state, and expected outcome are
      uninformative. JUnit 5 does not reject 'test'-prefixed names.
    ref: "concepts.md#test-naming-conventions"
  - id: unit-testing-principles-and-practices-015
    difficulty: beginner
    tags: [naming, displayname, junit5]
    question: |
      What does JUnit 5's @DisplayName annotation let you do?
    options:
      - "Skip a test conditionally"
      - "Mark a test as flaky so it is retried"
      - "Provide a human-readable label decoupled from the Java method name, shown in reports/IDEs"
      - "Group assertions so all are evaluated"
    answer: 2
    explanation: |
      @DisplayName decouples the readable description from the method name, so you can keep a
      concise method name and a full-sentence label that appears in test reports and IDEs.
      Retries, conditional skipping, and grouped assertions are different features.
    ref: "concepts.md#test-naming-conventions"
  - id: unit-testing-principles-and-practices-016
    difficulty: intermediate
    tags: [naming, behavior, mockist-smell]
    question: |
      A test named `callsRepositorySaveOnce` (rather than `persistsOrder`) is a warning sign
      because it:
    options:
      - "Is too short to be descriptive"
      - "Cannot be used with @DisplayName"
      - "Implies the test is missing an Act phase"
      - "Describes implementation/interactions rather than behavior, so it breaks on refactors even when behavior is unchanged"
    answer: 3
    explanation: |
      Naming a test after an internal interaction ("calls save") rather than an observable behavior
      ("persists the order") is a mockist smell: the test couples to implementation and turns red
      during refactors that preserve behavior.
    ref: "concepts.md#test-naming-conventions"
  - id: unit-testing-principles-and-practices-017
    difficulty: intermediate
    tags: [naming, spec, single-behavior]
    question: |
      You find you cannot name a test without the word "and" (e.g. "savesOrderAndSendsEmail").
      What does this most likely indicate?
    options:
      - "The test probably verifies two behaviors and should be split"
      - "The name is fine; conjunctions are encouraged"
      - "You must switch to Given-When-Then naming"
      - "The Arrange phase is too small"
    answer: 0
    explanation: |
      A test name should describe one behavior. Needing "and" typically means the test asserts two
      distinct behaviors, so a single failure can't name what broke. Split it into two tests.
    ref: "concepts.md#test-naming-conventions"
  - id: unit-testing-principles-and-practices-018
    difficulty: intermediate
    tags: [one-assert, misconception]
    question: |
      What does the "one assertion per test" guideline actually mean when interpreted correctly?
    options:
      - "Exactly one physical assert statement is allowed"
      - "One logical behavior/concept per test, so a failure names exactly one reason"
      - "Every test must use assertAll"
      - "Assertions must be replaced by mock verifications"
    answer: 1
    explanation: |
      The rule is about one *behavior* per test, not one literal assert. Multiple physical
      assertions verifying a single outcome are fine; the goal is that a failure points to one
      clear reason and the test name can describe it.
    ref: "concepts.md#one-assertion-per-test"
  - id: unit-testing-principles-and-practices-019
    difficulty: intermediate
    tags: [one-assert, assertall, junit5]
    question: |
      By default JUnit stops at the first failing assertion. Which JUnit 5 construct evaluates a
      group of assertions and reports all failures together?
    options:
      - "assertThrows"
      - "assertTimeout"
      - "assertAll"
      - "assumeTrue"
    answer: 2
    explanation: |
      assertAll executes all supplied assertions even if some fail, aggregating every failure into
      one report. It is ideal for verifying multiple properties of a single outcome without hiding
      later failures behind the first.
    ref: "concepts.md#one-assertion-per-test"
  - id: unit-testing-principles-and-practices-020
    difficulty: intermediate
    tags: [one-assert, multiple-assertions]
    question: |
      Which use of multiple assertions in one test is legitimate under the "one behavior per test"
      principle?
    options:
      - "Asserting that placing an order succeeds AND that a failed login is rejected"
      - "Asserting a value now and re-asserting a different unrelated feature later"
      - "Looping over ten scenarios and asserting each inside one test"
      - "Asserting the created order's status, total, and line count — all facets of one outcome"
    answer: 3
    explanation: |
      Several assertions that together describe one logical outcome (the created order) are fine.
      Mixing unrelated behaviors, or looping over scenarios, violates the single-behavior rule —
      use separate tests or a parameterized test instead.
    ref: "concepts.md#one-assertion-per-test"
  - id: unit-testing-principles-and-practices-021
    difficulty: beginner
    tags: [exceptions, junit5, assertthrows]
    question: |
      What is the idiomatic JUnit 5 way to assert that a method throws a specific exception?
    options:
      - "assertThrows(X.class, () -> code())"
      - "@Test(expected = X.class)"
      - "try/catch with a fail() at the end"
      - "@Rule ExpectedException"
    answer: 0
    explanation: |
      JUnit 5 uses assertThrows(ExpectedType.class, executable), which fails if nothing is thrown
      and returns the caught exception for further assertions on message/cause. The JUnit 4
      @Test(expected=...) and ExpectedException @Rule are legacy and were intentionally dropped.
    ref: "concepts.md#testing-exceptions"
  - id: unit-testing-principles-and-practices-022
    difficulty: intermediate
    tags: [exceptions, scope, executable]
    question: |
      Why should the lambda passed to assertThrows contain only the call expected to throw?
    options:
      - "assertThrows can only accept single-line lambdas"
      - "Otherwise an exception thrown by Arrange/setup code could be mistaken for the expected one"
      - "Multi-statement lambdas fail to compile"
      - "It makes the test run in a separate thread"
    answer: 1
    explanation: |
      If setup code is inside the lambda, an exception from that setup would satisfy assertThrows
      and mask the fact that the real target never threw. Scope the executable tightly to the one
      statement under test.
    ref: "concepts.md#testing-exceptions"
  - id: unit-testing-principles-and-practices-023
    difficulty: advanced
    tags: [exceptions, assertthrowsexactly, hierarchy]
    question: |
      How does assertThrowsExactly differ from assertThrows in JUnit 5?
    options:
      - "assertThrowsExactly runs preemptively in another thread"
      - "assertThrows requires the exact class; assertThrowsExactly accepts subclasses"
      - "assertThrows accepts any subtype of the declared type; assertThrowsExactly requires the exact class"
      - "There is no difference; they are aliases"
    answer: 2
    explanation: |
      assertThrows passes if the thrown exception is the declared type *or a subtype*, while
      assertThrowsExactly requires the thrown exception to be exactly the declared class. The exact
      variant matters when distinguishing types within an exception hierarchy.
    ref: "concepts.md#testing-exceptions"
  - id: unit-testing-principles-and-practices-024
    difficulty: advanced
    tags: [exceptions, assertj, cause-chain]
    question: |
      A service wraps a low-level SQLException in a domain-specific DataAccessException. To fully
      verify error handling, what should the test do?
    options:
      - "Assert only that some exception is thrown"
      - "Assert on the exact wording of the SQLException message"
      - "Catch Throwable and ignore it"
      - "Assert the outer type AND the cause chain (e.g. hasCauseInstanceOf(SQLException.class))"
    answer: 3
    explanation: |
      Asserting only the outer type can hide a mis-wired cause. Verifying both the wrapper type and
      the cause chain (AssertJ's assertThatThrownBy(...).hasCauseInstanceOf(...)) confirms the
      original failure is preserved. Avoid brittle exact-message assertions.
    ref: "concepts.md#testing-exceptions"
  - id: unit-testing-principles-and-practices-025
    difficulty: beginner
    tags: [edge-cases, boundaries]
    question: |
      Bugs tend to cluster at boundaries. Which set of inputs best reflects boundary-focused
      testing for a numeric range?
    options:
      - "Only null and empty"
      - "Only the happy-path middle value"
      - "Ten random values from anywhere in the range"
      - "Values at the edges and just outside them (e.g. 17/18 and 65/66 for a valid 18–65 range)"
    answer: 3
    explanation: |
      Boundary value analysis tests the values *at* each edge and *just outside* it, because that
      is where off-by-one and `<` vs `<=` mistakes live. For an 18–65 range you would test
      17, 18, 65, and 66.
    ref: "concepts.md#testing-edge-cases-and-boundaries"
  - id: unit-testing-principles-and-practices-026
    difficulty: intermediate
    tags: [edge-cases, equivalence-partitioning]
    question: |
      What is the purpose of equivalence partitioning?
    options:
      - "To test every possible input value exhaustively"
      - "To group inputs that should behave the same and test one representative per group"
      - "To randomize inputs across the whole domain"
      - "To ensure tests run in a fixed order"
    answer: 1
    explanation: |
      Equivalence partitioning divides the input space into classes that should be handled
      identically, so you test one representative from each class rather than every value.
      It is typically combined with boundary value analysis at the edges of each partition.
    ref: "concepts.md#testing-edge-cases-and-boundaries"
  - id: unit-testing-principles-and-practices-027
    difficulty: intermediate
    tags: [edge-cases, parameterized, junit5]
    question: |
      Which JUnit 5 feature is the natural fit for exercising many boundary values without
      duplicating the test body?
    options:
      - "@RepeatedTest"
      - "@Nested"
      - "@ParameterizedTest with @CsvSource / @ValueSource"
      - "@Timeout"
    answer: 2
    explanation: |
      @ParameterizedTest drives the same test body with many inputs supplied by sources like
      @ValueSource and @CsvSource, ideal for boundary and equivalence-class cases.
      @RepeatedTest just reruns the same case; @Nested groups tests; @Timeout bounds duration.
    ref: "concepts.md#testing-edge-cases-and-boundaries"
  - id: unit-testing-principles-and-practices-028
    difficulty: advanced
    tags: [edge-cases, property-based, jqwik]
    question: |
      How does property-based testing (e.g. jqwik) generalize boundary testing?
    options:
      - "It disables assertions to run faster"
      - "It only tests the null case"
      - "It replaces the need for a Clock in time-dependent code"
      - "It generates many inputs, checks invariants, and shrinks any failing case to a minimal counterexample"
    answer: 3
    explanation: |
      Property-based testing generates a large space of inputs and asserts invariants that must
      hold for all of them, often finding edge cases you didn't anticipate. On failure it shrinks
      the input to a minimal reproducing counterexample.
    ref: "concepts.md#testing-edge-cases-and-boundaries"
  - id: unit-testing-principles-and-practices-029
    difficulty: beginner
    tags: [determinism, time, random, io]
    question: |
      Which trio are the classic sources of non-determinism that make unit tests flaky?
    options:
      - "Time, randomness, and I/O/ordering"
      - "Generics, reflection, and annotations"
      - "Getters, setters, and constructors"
      - "Assertions, mocks, and fixtures"
    answer: 0
    explanation: |
      Direct use of the current time, random values/UUIDs, and I/O or unspecified ordering
      (network, filesystem, HashMap iteration order, thread scheduling) are the classic causes of
      non-deterministic, flaky tests.
    ref: "concepts.md#deterministic-tests-no-time-random-or-io-dependence"
  - id: unit-testing-principles-and-practices-030
    difficulty: intermediate
    tags: [determinism, clock, injection]
    question: |
      What is the recommended way to make time-dependent domain logic deterministically testable
      in Java?
    options:
      - "Call LocalDateTime.now() and round to the nearest second"
      - "Depend on an injected java.time.Clock, passing Clock.fixed(...) in tests"
      - "Use Thread.sleep to align timing"
      - "Mock the java.time package with reflection"
    answer: 1
    explanation: |
      Inject a java.time.Clock: production supplies Clock.systemUTC() while tests supply
      Clock.fixed(instant, zone). Domain code then calls LocalDate.now(clock) instead of a static
      now(), making results reproducible.
    ref: "concepts.md#deterministic-tests-no-time-random-or-io-dependence"
  - id: unit-testing-principles-and-practices-031
    difficulty: intermediate
    tags: [determinism, ordering, hashmap]
    question: |
      A test asserts that a method returns a List of results in a specific order, but the method
      builds results by iterating a HashMap. Why is this test flaky, and what is the fix?
    options:
      - "HashMap is thread-safe, so the fix is to synchronize the test"
      - "The test needs @RepeatedTest to stabilize"
      - "HashMap iteration order isn't guaranteed; assert on a Set (or sort) instead of exact list order"
      - "Replace assertEquals with assertSame"
    answer: 2
    explanation: |
      HashMap does not guarantee iteration order, so a list built from it can vary. When order is
      not part of the contract, assert on a Set (or sort both sides), or use an order-independent
      assertion like AssertJ's containsExactlyInAnyOrder.
    ref: "concepts.md#deterministic-tests-no-time-random-or-io-dependence"
  - id: unit-testing-principles-and-practices-032
    difficulty: advanced
    tags: [determinism, timeout, preemptive, threadlocal]
    question: |
      Why can assertTimeoutPreemptively be risky compared to assertTimeout?
    options:
      - "It never actually enforces the timeout"
      - "It requires @TestInstance(PER_CLASS)"
      - "It silently swallows assertion failures"
      - "It runs the code in a separate thread and aborts it, which can break ThreadLocal-based context and leak the interrupted thread"
    answer: 3
    explanation: |
      assertTimeoutPreemptively executes the supplied code in a different thread and aborts on
      timeout. Code relying on ThreadLocal state (transaction/security context) can misbehave, and
      the interrupted thread may leak. Plain assertTimeout runs in the same thread and only reports
      after completion, so it is safer unless preemption is specifically required.
    ref: "concepts.md#deterministic-tests-no-time-random-or-io-dependence"
  - id: unit-testing-principles-and-practices-033
    difficulty: intermediate
    tags: [determinism, async, sleep]
    question: |
      What is the preferred way to test that an asynchronous operation eventually completes,
      instead of Thread.sleep(2000)?
    options:
      - "Poll for the condition with a timeout (e.g. an Awaitility-style await)"
      - "Increase the sleep to 10 seconds to be safe"
      - "Run the test twice and take the second result"
      - "Disable the test in CI"
    answer: 0
    explanation: |
      Fixed sleeps are both slow and flaky (too short fails intermittently, too long wastes time).
      Polling until a condition holds, bounded by a timeout (Awaitility-style), is deterministic
      and fast when the work finishes early.
    ref: "concepts.md#deterministic-tests-no-time-random-or-io-dependence"
  - id: unit-testing-principles-and-practices-034
    difficulty: beginner
    tags: [logic-in-tests, readability]
    question: |
      Why should tests avoid conditionals, loops, and arithmetic in the test body?
    options:
      - "The JUnit compiler rejects loops in tests"
      - "Logic adds places for the test itself to be wrong, and a buggy test gives false confidence"
      - "Loops always make tests slower than the code under test"
      - "Conditionals prevent @DisplayName from working"
    answer: 1
    explanation: |
      Tests should be dumb and obvious. Logic in a test introduces its own defect surface; a bug in
      the test is worse than no test because it produces false confidence. Prefer straight-line
      tests with literal expected values.
    ref: "concepts.md#avoiding-logic-in-tests"
  - id: unit-testing-principles-and-practices-035
    difficulty: intermediate
    tags: [logic-in-tests, golden-values]
    question: |
      A test computes its expected value using the same discount formula as the production code,
      then asserts equality. What is the danger?
    options:
      - "The test will be too slow"
      - "assertEquals cannot compare computed values"
      - "If the formula has a bug, the test re-implements it and agrees with the buggy code, so it passes silently"
      - "The test will fail to compile"
    answer: 2
    explanation: |
      Re-deriving the expected value with the same logic under test means a shared bug is
      duplicated on both sides and the assertion passes even though the behavior is wrong. Use
      hard-coded, human-verified "golden" expected values instead.
    ref: "concepts.md#avoiding-logic-in-tests"
  - id: unit-testing-principles-and-practices-036
    difficulty: intermediate
    tags: [logic-in-tests, parameterized, refactor]
    question: |
      A test contains a for-loop iterating over several input cases with an assertion inside. What
      is the cleaner refactoring?
    options:
      - "Wrap the loop in try/catch"
      - "Move the loop into @BeforeEach"
      - "Add a counter variable and assert it at the end"
      - "Convert it to a @ParameterizedTest so each case is a distinct, independently reported test"
    answer: 3
    explanation: |
      A loop over cases is logic that hides which case failed. A @ParameterizedTest runs each input
      as its own reported invocation, removing the loop and giving precise per-case failure
      reporting.
    ref: "concepts.md#avoiding-logic-in-tests"
  - id: unit-testing-principles-and-practices-037
    difficulty: beginner
    tags: [damp, dry, readability]
    question: |
      Which principle do we generally prefer for TEST code (as opposed to production code)?
    options:
      - "DAMP — Descriptive And Meaningful Phrases, tolerating some duplication for clarity"
      - "DRY — aggressively eliminate all duplication"
      - "SOLID — five object-oriented design principles"
      - "YAGNI — you aren't gonna need it"
    answer: 0
    explanation: |
      Production code favors DRY; test code favors DAMP. A controlled amount of duplication that
      keeps each test self-explanatory beats clever abstraction that forces the reader to hunt
      across helpers to understand a failing test.
    ref: "concepts.md#test-readability-damp-vs-dry"
  - id: unit-testing-principles-and-practices-038
    difficulty: intermediate
    tags: [dry, damp, over-abstraction]
    question: |
      What is the downside of over-DRYing tests with a giant shared @BeforeEach and deep helper
      hierarchies?
    options:
      - "Tests run out of memory"
      - "The inputs and cause-and-effect become invisible, so a reader can't see why a failing test broke"
      - "JUnit disallows shared setup"
      - "It forces the use of mocks"
    answer: 1
    explanation: |
      Excessive DRYing hides the relevant inputs three layers away, so when a test fails the reader
      cannot see the cause and effect. DAMP keeps the essential inputs and expectations local to
      each test even at the cost of a little duplication.
    ref: "concepts.md#test-readability-damp-vs-dry"
  - id: unit-testing-principles-and-practices-039
    difficulty: advanced
    tags: [damp, dry, builders, reconciliation]
    question: |
      How do Test Data Builders (e.g. anOrder().withStatus(PAID).build()) reconcile DRY and DAMP?
    options:
      - "They make tests fully DRY by removing all duplication"
      - "They eliminate the need for assertions"
      - "They remove incidental construction duplication (DRY) while letting each test spell out only the essential fields it cares about (DAMP)"
      - "They force every test to use the same fixture"
    answer: 2
    explanation: |
      Builders extract the *incidental* boilerplate of object construction (DRY) while allowing
      each test to explicitly set just the *essential* fields relevant to its scenario (DAMP),
      giving both concise construction and local readability.
    ref: "concepts.md#test-readability-damp-vs-dry"
  - id: unit-testing-principles-and-practices-040
    difficulty: advanced
    tags: [mystery-guest, test-smell, damp]
    question: |
      A test's outcome depends on data defined in an external file the reader can't see in the test.
      This test smell is known as:
    options:
      - "The eager test"
      - "The lonely mock"
      - "The assertion roulette (assertAll)"
      - "The mystery guest"
    answer: 3
    explanation: |
      The "mystery guest" (Meszaros) is a test whose behavior depends on external/hidden data the
      reader cannot see, hurting readability and making failures hard to diagnose. Keeping the
      relevant data visible in the test (DAMP) avoids it.
    ref: "concepts.md#test-readability-damp-vs-dry"
  - id: unit-testing-principles-and-practices-041
    difficulty: beginner
    tags: [fixtures, lifecycle, junit5]
    question: |
      In JUnit 5, which annotation runs before EVERY test method to build a fresh per-test fixture?
    options:
      - "@BeforeEach"
      - "@BeforeAll"
      - "@AfterEach"
      - "@TestInstance"
    answer: 0
    explanation: |
      @BeforeEach runs before each test method, ideal for building a fresh fixture that keeps tests
      isolated. @BeforeAll runs once per class, @AfterEach runs after each test, and @TestInstance
      configures the instance lifecycle.
    ref: "concepts.md#test-fixtures-and-setupteardown"
  - id: unit-testing-principles-and-practices-042
    difficulty: intermediate
    tags: [fixtures, lifecycle, per-method, static]
    question: |
      Under JUnit 5's default (PER_METHOD) test instance lifecycle, why must @BeforeAll methods be
      static?
    options:
      - "Because static methods run faster"
      - "Because a new test-class instance is created per test method, so no instance exists for a once-per-class hook"
      - "Because @BeforeAll cannot access fields"
      - "Because JUnit runs @BeforeAll on a separate thread"
    answer: 1
    explanation: |
      With PER_METHOD lifecycle JUnit creates a fresh instance for each @Test, so at the time a
      once-per-class @BeforeAll/@AfterAll runs there is no single instance to bind to; hence they
      must be static. Switching to @TestInstance(PER_CLASS) reuses one instance and allows
      non-static @BeforeAll.
    ref: "concepts.md#test-fixtures-and-setupteardown"
  - id: unit-testing-principles-and-practices-043
    difficulty: intermediate
    tags: [fixtures, per-class, isolation]
    question: |
      What is the main trade-off of annotating a test class with @TestInstance(Lifecycle.PER_CLASS)?
    options:
      - "Tests can no longer use assertions"
      - "It doubles the number of test instances created"
      - "One instance is reused for all tests, enabling non-static @BeforeAll but risking state bleeding between tests"
      - "It forces every test into a separate JVM"
    answer: 2
    explanation: |
      PER_CLASS reuses a single instance across all test methods, which lets @BeforeAll/@AfterAll be
      non-static and can hold shared state, but instance fields are no longer reset per test — so
      you risk state bleeding and order dependence unless you clean up carefully.
    ref: "concepts.md#test-fixtures-and-setupteardown"
  - id: unit-testing-principles-and-practices-044
    difficulty: intermediate
    tags: [fixtures, tempdir, teardown]
    question: |
      Which JUnit 5 feature provides a filesystem fixture that is automatically cleaned up after
      the test?
    options:
      - "@AfterAll"
      - "@Disabled"
      - "@Tag"
      - "@TempDir"
    answer: 3
    explanation: |
      @TempDir injects a temporary directory that JUnit removes automatically after the test/class,
      giving reliable teardown without manual @AfterEach cleanup that could be skipped on failure.
    ref: "concepts.md#test-fixtures-and-setupteardown"
  - id: unit-testing-principles-and-practices-045
    difficulty: advanced
    tags: [fixtures, shared, flaky, static]
    question: |
      Which fixture practice is the classic source of order-dependent, flaky tests?
    options:
      - "Mutable static state shared across tests without cleanup"
      - "Building a fresh fixture in @BeforeEach"
      - "Using @TempDir for files"
      - "Using Test Data Builders"
    answer: 0
    explanation: |
      Mutable static fixtures shared across tests mean one test can leave state that another test
      depends on (or is broken by), producing failures that appear only in certain run orders or
      under parallelism. Fresh per-test fixtures avoid this.
    ref: "concepts.md#test-fixtures-and-setupteardown"
  - id: unit-testing-principles-and-practices-046
    difficulty: advanced
    tags: [shared-fixture, isolation, integration]
    question: |
      When an expensive resource (e.g. a Testcontainer) is set up once via @BeforeAll for speed,
      how do you regain per-test isolation?
    options:
      - "Restart the JVM between tests"
      - "Use per-test cleanup such as transaction rollback or table truncation to reset state"
      - "Disable the tests that share it"
      - "Move the container into @BeforeEach"
    answer: 1
    explanation: |
      A shared fixture is faster but reintroduces coupling. The standard remedy is to reset state
      per test — roll back the transaction, truncate/re-seed tables — so each test still starts
      from a known clean state despite sharing the expensive resource.
    ref: "concepts.md#test-fixtures-and-setupteardown"
  - id: unit-testing-principles-and-practices-047
    difficulty: intermediate
    tags: [scenario, solitary, sociable, refactor]
    question: |
      Two teams test the same OrderService. Team A mocks every collaborator; Team B uses real
      value objects and only mocks the payment gateway. After an internal refactor that preserves
      behavior, Team A's tests break en masse while Team B's stay green. What best explains this?
    options:
      - "Team B forgot to assert anything"
      - "Team B's tests are not real unit tests"
      - "Team A's heavily solitary/mockist tests coupled to implementation details, so behavior-preserving refactors break them"
      - "Team A's tests are faster and therefore more correct"
    answer: 2
    explanation: |
      Over-mocking (solitary/mockist style) ties tests to how the code collaborates internally, so
      even refactors that preserve behavior break many tests. Team B's more sociable, state-based
      tests verify observable behavior and survive the refactor.
    ref: "concepts.md#what-is-a-unit-solitary-vs-sociable"
  - id: unit-testing-principles-and-practices-048
    difficulty: intermediate
    tags: [scenario, determinism, flaky, diagnosis]
    question: |
      A test passes locally but fails intermittently in CI. It asserts a formatted date string and
      builds it from new Date(). Which fix most directly addresses the root cause?
    options:
      - "Add a @RepeatedTest(5) so it eventually passes"
      - "Wrap the assertion in try/catch and ignore failures"
      - "Increase the CI timeout"
      - "Inject a fixed Clock and format from LocalDate.now(clock) so the date is deterministic"
    answer: 3
    explanation: |
      The flakiness comes from depending on the real current date. Injecting a fixed Clock removes
      the non-determinism so the formatted output is stable across environments. Retries, swallowed
      exceptions, and bigger timeouts hide the problem rather than fixing it.
    ref: "concepts.md#deterministic-tests-no-time-random-or-io-dependence"
  - id: unit-testing-principles-and-practices-049
    difficulty: beginner
    tags: [first, timely, thorough]
    question: |
      The "T" in FIRST is read two ways. Which pair correctly captures both readings?
    options:
      - "Timely (written promptly/test-first) and Thorough (cover meaningful cases)"
      - "Typed and Templated"
      - "Threaded and Transactional"
      - "Tagged and Tracked"
    answer: 0
    explanation: |
      The T is commonly read as Timely — write tests close to the code, ideally test-first — and
      sometimes as Thorough — cover the meaningful edge, error, and boundary cases.
    ref: "concepts.md#first-properties"
  - id: unit-testing-principles-and-practices-050
    difficulty: advanced
    tags: [aaa, arrange, design-smell]
    question: |
      During review you notice a unit test whose Arrange block is 40 lines wiring up eight
      dependencies, dwarfing the Act and Assert. Beyond test cleanliness, what does this most
      likely reveal?
    options:
      - "The test framework is misconfigured"
      - "The unit under test likely has too many dependencies — a design smell the test surfaced"
      - "The Assert phase is missing"
      - "The test should be marked @Disabled"
    answer: 1
    explanation: |
      "Arrange creep" often reflects a design problem: a class with too many collaborators is hard
      to set up. The painful test is feedback that the production design may need decomposition.
      Object Mothers/builders help readability, but the underlying coupling is the real signal.
    ref: "concepts.md#arrange-act-assert-and-given-when-then"
