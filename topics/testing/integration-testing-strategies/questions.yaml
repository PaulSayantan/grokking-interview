topic: Integration Testing Strategies
domain: testing
topic_slug: integration-testing-strategies
version: 1
questions:
- id: integration-testing-strategies-001
  difficulty: beginner
  tags:
  - definition
  - boundaries
  question: |
    What most precisely distinguishes an integration test from a unit test?
  options:
  - An integration test exercises a real collaborator across a boundary (DB, network, broker), rather
    than isolating logic with doubles
  - An integration test is written in a different language from the unit tests, typically a scripting
    language rather than the production language
  - An integration test always runs directly against live production systems, never in a local or CI
    environment
  - An integration test relies on assertions to check results, whereas a unit test merely runs the code
    without verifying any outcome
  answer: 0
  explanation: |
    The defining trait of an integration test is that two components actually
    work together across a boundary for real (code↔DB, code↔HTTP service,
    module↔module). A unit test isolates one piece of logic, typically
    replacing collaborators with test doubles.
  ref: concepts.md#what-integration-testing-covers
- id: integration-testing-strategies-002
  difficulty: beginner
  tags:
  - boundaries
  - database
  question: |
    A repository test runs real SQL against a real database engine and asserts
    the rows returned. What kind of bug can this catch that a unit test with a
    mocked repository cannot?
  options:
  - An incorrect log message format string that misaligns placeholder tokens in the logging output
  - A typo in an unrelated front-end UI component that never touches the persistence layer at all
  - A wrong JPQL/SQL mapping or a dialect-specific query error
  - A missing null check in pure business logic that runs entirely in memory before any query executes
  answer: 2
  explanation: |
    Testing across the code↔database boundary catches wrong SQL/mappings,
    constraint violations, and dialect differences — exactly the things a
    mocked repository hides because no real query is ever executed.
  ref: concepts.md#what-integration-testing-covers
- id: integration-testing-strategies-003
  difficulty: intermediate
  tags:
  - boundaries
  - mocking
  question: |
    You "integration test" your order service but you mock the database with
    Mockito so no real queries run. Why is this misleading?
  options:
  - It is fine and remains a true integration test because the service and its repository layer still
    call each other through the mocked boundary
  - Mocking the DB actually makes the test slower than a real DB because Mockito adds proxy overhead on
    every stubbed query invocation
  - Mockito is technically incapable of being used inside integration tests and will throw an initialization
    error if the Spring context is loaded
  - With the DB mocked, you are testing your code's logic in isolation — a unit test — not the integration
    across the DB boundary
  answer: 3
  explanation: |
    If the boundary you claim to integrate with is mocked, no real interaction
    occurs, so the SQL/mapping/transaction behaviour is never exercised. That
    is a unit test of your logic, not an integration test.
  ref: concepts.md#what-integration-testing-covers
- id: integration-testing-strategies-004
  difficulty: beginner
  tags:
  - big-bang
  - incremental
  question: |
    What is the main disadvantage of big-bang integration?
  options:
  - When a test fails, the fault could be anywhere in the fully assembled system, so fault localization
    is poor and feedback is late
  - It forces modules to be integrated far too early in the schedule, before any of them are individually
    code-complete
  - It fundamentally cannot be automated and must be driven entirely by hand through a manual test harness
    on each run
  - It requires purpose-built stubs and drivers for every single module before any assembly test can run
  answer: 0
  explanation: |
    Big-bang integrates all modules at once and tests the whole assembly.
    Failures are hard to localize, and you can only start once every module is
    code-complete, giving late feedback.
  ref: concepts.md#big-bang-vs-incremental-integration
- id: integration-testing-strategies-005
  difficulty: intermediate
  tags:
  - top-down
  - stubs
  question: |
    In top-down incremental integration, what stand-ins are required and why?
  options:
  - Fakes for the database layer only, since top-down integration always starts at the persistence tier
  - Drivers, to invoke and drive the high-level modules from above them
  - Stubs, to stand in for lower-level modules that are not built yet
  - Mocks, to verify the interactions the code makes against the top-level UI layer
  answer: 2
  explanation: |
    Top-down integrates high-level modules first and drills down, so the
    lower-level modules they call may not exist yet — you supply stubs (called
    by the code under test) in their place.
  ref: concepts.md#big-bang-vs-incremental-integration
- id: integration-testing-strategies-006
  difficulty: intermediate
  tags:
  - bottom-up
  - drivers
  question: |
    Bottom-up integration builds and tests low-level modules first. What
    stand-in does it require?
  options:
  - Mock servers standing in for the external HTTP APIs the low-level modules call
  - No stand-ins of any kind are ever needed at any stage of bottom-up integration
  - Stubs, to replace the higher-level calling modules that sit above them
  - Drivers, to invoke the lower-level modules from above
  answer: 3
  explanation: |
    Bottom-up starts from foundational modules; the higher-level callers do
    not exist yet, so you write drivers that call into the modules under test.
    Stubs go with top-down; drivers go with bottom-up.
  ref: concepts.md#big-bang-vs-incremental-integration
- id: integration-testing-strategies-007
  difficulty: intermediate
  tags:
  - sandwich
  - hybrid
  question: |
    The sandwich (hybrid) integration approach:
  options:
  - Uses neither stubs nor drivers because both layers are always fully built before it begins
  - Combines top-down and bottom-up, meeting in a target middle layer, and may need both stubs and drivers
  - Is functionally identical to big-bang integration, assembling every module at once
  - Only ever integrates the persistence layer, leaving all other layers entirely untested
  answer: 1
  explanation: |
    Sandwich/hybrid works middle-out in both directions at once, so it can
    require both stubs (for modules below) and drivers (for callers above); it
    balances the two pure strategies but is more complex to coordinate.
  ref: concepts.md#big-bang-vs-incremental-integration
- id: integration-testing-strategies-008
  difficulty: advanced
  tags:
  - ci
  - incremental
  question: |
    Why is pure big-bang integration rare in modern CI-driven teams?
  options:
  - Because continuous integration merges and tests changes incrementally by construction, so interactions
    are exercised as soon as they exist
  - Because big-bang integration is now explicitly prohibited under the terms of most open-source software
    licenses
  - Because modern programming languages and their compilers structurally forbid any deferred, all-at-once
    integration
  - Because CI servers are fundamentally incapable of executing integration tests and can only run unit
    tests
  answer: 0
  explanation: |
    Continuously integrating each merge means new interactions are tested the
    moment they appear — that is incremental integration in practice, which is
    why textbook big-bang is uncommon today.
  ref: concepts.md#big-bang-vs-incremental-integration
- id: integration-testing-strategies-009
  difficulty: intermediate
  tags:
  - fowler
  - narrow
  - broad
  question: |
    According to Fowler, a narrow integration test:
  options:
  - Cannot reuse the same test framework as your unit tests and needs a separate specialized runner
  - Requires live, running versions of every downstream service the code eventually depends on
  - Exercises only the boundary code in your service that talks to a separate service, using a test double
    for the remote
  - Is always markedly slower to run than an equivalent broad, full-environment integration test
  answer: 2
  explanation: |
    A narrow integration test focuses only on your service's code that
    communicates with an external service, using a test double (in-process or a
    local mock server) instead of the live remote. They are numerous, small,
    and fast, often run with the unit-test framework.
  ref: concepts.md#narrow-vs-broad-integration-tests-fowler
- id: integration-testing-strategies-010
  difficulty: intermediate
  tags:
  - fowler
  - broad
  question: |
    Fowler prefers to call broad integration tests by another name. Which, and
    why?
  options:
  - '"Unit tests", because they are small, fast, and never cross any real process or network boundary'
  - '"Contract tests", because they verify a shared request/response contract between two isolated parties'
  - '"Smoke tests", because they run fastest and only touch a shallow subset of the wired-up system'
  - '"System" or "end-to-end" tests, because they require live versions of all services and full environment/network
    access'
  answer: 3
  explanation: |
    Broad integration tests need live versions of all services and substantial
    environment/network access, exercising full cross-service paths. Fowler
    prefers "system test" or "end-to-end test" for these to avoid ambiguity.
  ref: concepts.md#narrow-vs-broad-integration-tests-fowler
- id: integration-testing-strategies-011
  difficulty: advanced
  tags:
  - fowler
  - ambiguity
  question: |
    Why is Fowler "wary" of the unqualified term "integration test"?
  options:
  - Because different people assume it means only the broad form, only the narrow form, or even sociable
    unit tests, causing confusion
  - Because integration testing is never actually useful in practice and contributes nothing to a well-designed
    suite
  - Because the term only ever applies to legacy waterfall projects and carries no meaning at all for modern
    agile teams
  - Because it is nothing more than a deprecated JUnit annotation that was removed back in the JUnit 5 release
  answer: 0
  explanation: |
    The term carries conflicting meanings — its 1980s waterfall origin, the
    narrow vs broad split, and later usage equating it with sociable unit
    tests. Fowler recommends disambiguating explicitly (e.g. "narrow
    integration test").
  ref: concepts.md#narrow-vs-broad-integration-tests-fowler
- id: integration-testing-strategies-012
  difficulty: intermediate
  tags:
  - narrow
  - broad
  - pipeline
  question: |
    Compared with broad integration tests, narrow integration tests typically:
  options:
  - Cannot be automated at all and must always be triggered by hand by a developer
  - Run later in the pipeline than broad tests and localize the source of faults far more poorly
  - Run earlier in the pipeline, are faster and more reliable, and localize faults precisely
  - Require a full shared, pre-provisioned test environment to be stood up before they can run
  answer: 2
  explanation: |
    Because narrow tests replace the remote with a double, they are fast,
    reliable, and precise about where a failure lies, so they fit the early
    (commit) stage of a pipeline. Broad tests are slow, flaky, and run in a
    dedicated environment later.
  ref: concepts.md#narrow-vs-broad-integration-tests-fowler
- id: integration-testing-strategies-013
  difficulty: beginner
  tags:
  - slices
  - spring
  question: |
    What is a "test slice"?
  options:
  - A specially marked test that is always scheduled to run last in the entire suite
  - A technique for splitting a single large assertion across several smaller separate tests
  - A configurable percentage of the full test set that is selected at random to run on each build
  - Booting only the layer under test with a minimal set of collaborators, rather than the whole application
  answer: 3
  explanation: |
    A test slice loads only the part of the application relevant to the layer
    under test (e.g. Spring's @DataJpaTest or @WebMvcTest), which is faster and
    more focused than booting the full application context.
  ref: concepts.md#test-slices-vs-full-context-integration
- id: integration-testing-strategies-014
  difficulty: intermediate
  tags:
  - slices
  - full-context
  question: |
    When is booting the FULL application context (rather than a slice) the
    right choice?
  options:
  - For testing a single repository's SQL queries against one isolated table in the database
  - For cross-cutting concerns like security filters, servlet filters, and end-to-end config wiring that
    a slice omits
  - Never — narrowly scoped slices are always strictly better in every conceivable situation
  - Only in the rare case when the application has no database or persistence layer at all
  answer: 1
  explanation: |
    A slice deliberately omits beans outside the layer, so it can miss
    inter-layer wiring, security, and filter behaviour. Full-context tests give
    system-level fidelity at the cost of speed and fragility — use them for
    cross-cutting concerns.
  ref: concepts.md#test-slices-vs-full-context-integration
- id: integration-testing-strategies-015
  difficulty: advanced
  tags:
  - slices
  - performance
  - spring
  question: |
    To keep a large slice/context-based integration suite fast, an effective
    technique is to:
  options:
  - Reuse a cached application context across tests that share the same configuration
  - Disable all assertions so that every test finishes quickly without verifying anything
  - Run every single test in its own freshly forked, fully isolated JVM process
  - Give every test a unique, one-off application configuration
  answer: 0
  explanation: |
    Booting a context is expensive. Frameworks cache the context per unique
    configuration, so keeping configurations uniform lets many tests reuse one
    already-started context, dramatically reducing suite time.
  ref: concepts.md#test-slices-vs-full-context-integration
- id: integration-testing-strategies-016
  difficulty: beginner
  tags:
  - h2
  - in-memory
  question: |
    What is the primary risk of using an in-memory database like H2 for
    database integration tests when you ship on PostgreSQL?
  options:
  - H2 requires a running Docker daemon to start, adding heavy container setup overhead to every database
    test
  - H2 is far too slow to start up, adding many seconds of boot latency to every database integration test
  - H2 is a different database, so dialect and behaviour gaps can give false confidence — tests pass that
    would fail on Postgres and vice versa
  - H2 is incapable of actually persisting any data to disk, so none of the queries under test return real
    rows
  answer: 2
  explanation: |
    H2 is not Postgres. Native queries, JSONB, arrays, upserts, window
    functions, and vendor functions diverge; even its "PostgreSQL mode" is
    approximate. You may test different behaviour than you ship — false
    confidence.
  ref: concepts.md#in-memory-vs-real-dependencies-h2-vs-testcontainers
- id: integration-testing-strategies-017
  difficulty: intermediate
  tags:
  - testcontainers
  - real-db
  question: |
    What does Testcontainers provide for database integration tests?
  options:
  - A purely static SQL linter that checks query syntax without ever executing it against a real engine
  - A convenient way to mock out the JDBC driver so that no real database connection is ever opened
  - An in-memory, from-scratch reimplementation of the entire Postgres engine written in pure Java
  - A real instance of the actual database engine running in a throwaway Docker container for the test
  answer: 3
  explanation: |
    Testcontainers spins up the real engine (Postgres, MySQL, Kafka, etc.) in
    a disposable container, giving production fidelity and catching
    dialect/migration bugs that in-memory substitutes hide.
  ref: concepts.md#in-memory-vs-real-dependencies-h2-vs-testcontainers
- id: integration-testing-strategies-018
  difficulty: intermediate
  tags:
  - h2
  - dialect
  - upsert
  question: |
    Your code uses a Postgres-specific `INSERT ... ON CONFLICT DO UPDATE`
    upsert. Your team runs DB tests on H2. What is the likely outcome?
  options:
  - The upsert can't be tested faithfully on H2, so you either can't test it or special-case the SQL and
    end up testing different code than ships
  - The upsert simply runs faster on H2 than on Postgres, with no other observable difference in behaviour
  - H2 automatically and transparently converts it into a MERGE statement with identical semantics guaranteed
  - H2 runs the ON CONFLICT clause identically to Postgres, so the tests remain completely faithful to production
  answer: 0
  explanation: |
    `ON CONFLICT` is Postgres-specific. H2 may not parse it or behaves
    differently, forcing test-only SQL branches. Either way you no longer test
    the code you deploy — the canonical H2 pitfall. Test against the real
    engine.
  ref: concepts.md#in-memory-vs-real-dependencies-h2-vs-testcontainers
- id: integration-testing-strategies-019
  difficulty: intermediate
  tags:
  - testcontainers
  - tradeoff
  question: |
    What is the main cost of using Testcontainers instead of H2?
  options:
  - It permanently alters real production data because its containers reuse live database credentials by default
  - It cannot catch dialect-specific bugs since it rewrites every query into vendor-neutral ANSI SQL first
  - It requires Docker to be available and has slower startup than an in-memory DB (mitigated by container
    reuse)
  - It only works with MySQL and cannot start containers for Postgres, Kafka, or any other supported engine
  answer: 2
  explanation: |
    Testcontainers needs a Docker environment and containers take longer to
    start than an in-process H2. The fidelity is usually worth it, and reuse /
    shared lifecycle strategies reduce the startup cost.
  ref: concepts.md#in-memory-vs-real-dependencies-h2-vs-testcontainers
- id: integration-testing-strategies-020
  difficulty: beginner
  tags:
  - test-data
  - isolation
  question: |
    What is the number-one cause of integration-test flakiness related to test
    data?
  options:
  - Writing the tests in a language the CI runner silently skips instead of executing each build
  - Having too few tests overall, so data-corruption defects slip through the thin coverage
  - Using too many assertions per test, which makes each one abort before it can reset its data
  - Shared mutable state — one test leaves data behind that another test (or a re-run) then sees
  answer: 3
  explanation: |
    When tests share and mutate the same data without isolation, one test's
    residue changes another's outcome, producing order-dependent, re-run-
    dependent failures. Each test must start from a known state.
  ref: concepts.md#test-data-management--isolation
- id: integration-testing-strategies-021
  difficulty: intermediate
  tags:
  - rollback
  - transactional
  question: |
    What is the key limitation of wrapping each test in a transaction and
    rolling it back for isolation?
  options:
  - It is the slowest possible isolation strategy because rolling back forces the engine to replay its entire write-ahead log each test
  - It never commits, so it hides flush-time constraint violations, triggers, AFTER COMMIT hooks, and
    DB-generated behaviour, and breaks when the code manages its own transactions
  - It permanently drops the schema at rollback, so later tests in the run find their tables missing and fail during setup
  - It only works with in-memory databases and silently corrupts the connection pool when pointed at a real networked engine
  answer: 1
  explanation: |
    Rollback is fast and needs no cleanup, but because nothing is committed it
    cannot observe commit-time behaviour and misrepresents production. It also
    breaks when the code under test opens its own transactions or spans
    threads.
  ref: concepts.md#test-data-management--isolation
- id: integration-testing-strategies-022
  difficulty: intermediate
  tags:
  - truncate
  - isolation
  question: |
    Compared with transaction rollback, truncating/deleting affected tables
    between tests:
  options:
  - Uses real commits (more faithful) but is slower and requires knowing the tables and respecting FK
    ordering
  - Cannot be used with a real database because TRUNCATE is a DDL statement that most JDBC drivers refuse to issue from a test
  - Prevents tests from running in isolation, since truncation locks the whole schema and forces every test to execute serially
  - Is faster than rollback and needs no knowledge of the tables, because the engine auto-detects and clears only the rows a test touched
  answer: 0
  explanation: |
    Truncate/delete lets the code commit for real, catching commit-time
    behaviour that rollback hides. The trade-off is more cleanup work
    (enumerating tables, FK order) and slower execution.
  ref: concepts.md#test-data-management--isolation
- id: integration-testing-strategies-023
  difficulty: intermediate
  tags:
  - test-data
  - builders
  question: |
    Why prefer building test data inside each test (test-data builders / object
    mothers) over one large shared seed fixture?
  options:
  - Shared fixtures cannot contain valid data because a single seed file is unable to satisfy foreign-key constraints across tables
  - Shared fixtures run faster in all cases, since the seed loads once and per-test builders re-insert the same rows on every run
  - Each test declares exactly the data it needs, stays readable in isolation, and avoids hidden coupling
    to a global fixture
  - Builders are required by JUnit 5 and a shared seed fixture throws an initialization error under the Jupiter engine
  answer: 2
  explanation: |
    Per-test data makes each test self-contained and understandable on its own,
    and removes the fragile coupling where a change to the shared seed
    unexpectedly breaks unrelated tests.
  ref: concepts.md#test-data-management--isolation
- id: integration-testing-strategies-024
  difficulty: advanced
  tags:
  - isolation
  - parallel
  - unique-keys
  question: |
    To let integration tests run in parallel without colliding, a robust
    practice is to:
  options:
  - Run every test in strict alphabetical order so that concurrent workers deterministically touch tables in the same sequence
  - Disable database constraints during the run so parallel inserts never block each other on uniqueness or foreign-key checks
  - Make all tests share the same fixed primary keys, relying on the engine's row-level locks to serialize the colliding writes
  - Use unique keys per test (random UUIDs, unique emails) so tests don't collide even if cleanup is imperfect
  answer: 3
  explanation: |
    Unique per-test keys mean two concurrently running tests can't clash on the
    same rows, and residue from one test won't be mistaken for another's data —
    making the suite parallel-safe and resilient to imperfect cleanup.
  ref: concepts.md#test-data-management--isolation
- id: integration-testing-strategies-025
  difficulty: beginner
  tags:
  - pyramid
  question: |
    In the classic test pyramid, where do integration tests sit?
  options:
  - In the middle — fewer than unit tests, more than end-to-end tests
  - At the base, as the fastest and most numerous layer that every other tier is built directly on top of
  - They are excluded from the pyramid entirely, which models only pure unit tests and full end-to-end tests
  - At the very top, as the single most numerous layer because they give the broadest whole-system coverage
  answer: 0
  explanation: |
    The pyramid has many fast unit tests at the base, some integration/service
    tests in the middle, and very few slow end-to-end tests at the top.
  ref: concepts.md#the-integration-test-in-the-pyramid
- id: integration-testing-strategies-026
  difficulty: intermediate
  tags:
  - pyramid
  - ice-cream-cone
  question: |
    The "ice-cream cone" anti-pattern describes a test suite that:
  options:
  - Runs its tests in a deliberately randomized order on every build to surface hidden inter-test dependencies
  - Has too many fast unit tests and no integration tests at all, leaving every real boundary completely unverified
  - Inverts the pyramid — mostly manual/end-to-end tests with few unit tests — making it slow, flaky,
    and costly
  - Uses only consumer-driven contract tests and skips both the unit and end-to-end layers of the suite
  answer: 2
  explanation: |
    The ice-cream cone is an inverted pyramid: a heavy top of manual/E2E tests
    and a thin base of unit tests. The result is a slow, brittle, expensive-to-
    maintain suite.
  ref: concepts.md#the-integration-test-in-the-pyramid
- id: integration-testing-strategies-027
  difficulty: advanced
  tags:
  - pyramid
  - trophy
  question: |
    How does the "testing trophy" framing differ from the strict pyramid?
  options:
  - It puts slow end-to-end tests at the base as the most numerous layer and pushes unit tests up to the tip
  - It forbids integration tests outright, arguing that static type checking plus linting covers every boundary
  - It eliminates unit tests entirely, folding all of their coverage into the static-analysis band at the bottom
  - It argues integration tests deserve the largest share for many apps because they give the best confidence-per-cost
  answer: 3
  explanation: |
    The testing trophy (Kent C. Dodds) emphasizes integration tests as the
    biggest layer for many applications, on the reasoning that they offer the
    best confidence relative to cost — a good senior-level contrast to the
    strict pyramid.
  ref: concepts.md#the-integration-test-in-the-pyramid
- id: integration-testing-strategies-028
  difficulty: intermediate
  tags:
  - pyramid
  - principle
  question: |
    Regardless of pyramid vs trophy, what invariant should guide where an
    assertion lives?
  options:
  - Always assert at the end-to-end layer for realism, since only a fully wired system can reveal a genuine defect
  - Push each assertion down to the cheapest layer that can still catch the bug
  - Assert only in whichever layer currently holds the most tests, to keep the suite's shape balanced over time
  - Never assert business logic in unit tests; reserve every behavioural check for the integration layer instead
  answer: 1
  explanation: |
    The enduring principle is to verify a given behaviour at the cheapest,
    fastest layer capable of catching it — don't test pure business logic
    through a slow broad integration test when a unit test would do.
  ref: concepts.md#the-integration-test-in-the-pyramid
- id: integration-testing-strategies-029
  difficulty: intermediate
  tags:
  - test-doubles
  - boundaries
  question: |
    In integration testing, how should you decide which dependency to keep real
    and which to double?
  options:
  - Keep real the dependency the test exists to verify; double the dependencies beyond that boundary (third-party
    APIs you don't own)
  - Keep every collaborator real, always, and stand up the full downstream topology for each individual test
  - Randomly pick which collaborators to mock on each run so no single dependency becomes a hidden bottleneck
  - Double every collaborator, including the one under test, to keep the whole suite as fast as pure unit tests
  answer: 0
  explanation: |
    The dependency under test (e.g. the DB in a repository test) stays real;
    collaborators beyond that boundary — external APIs, email senders,
    downstream services you don't control — are replaced with doubles such as a
    mock server.
  ref: concepts.md#test-doubles-at-integration-boundaries
- id: integration-testing-strategies-030
  difficulty: intermediate
  tags:
  - wiremock
  - mock-server
  question: |
    Why prefer a mock server (e.g. WireMock) over mocking the HTTP-client object
    at an integration boundary?
  options:
  - A mock server removes the need for any assertions because it validates the response body against your schema itself
  - Mock servers are the only legal way to test HTTP, since stubbing a client object violates the HTTP/1.1 specification
  - A mock server exercises real URL building, headers, timeouts, and JSON (de)serialization over a real
    socket, whereas mocking the client skips all of that
  - Mocking the client is impossible in Java because the standard HttpClient class is final and cannot be proxied
  answer: 2
  explanation: |
    Mocking the client object bypasses the very things an HTTP integration
    should verify. A local mock server returns canned responses over a real
    connection, so the client's serialization, headers, and error handling are
    genuinely exercised.
  ref: concepts.md#test-doubles-at-integration-boundaries
- id: integration-testing-strategies-031
  difficulty: advanced
  tags:
  - test-doubles
  - fake
  question: |
    LocalStack (emulating AWS) and an embedded/in-memory broker are examples of
    which kind of test double at an integration boundary?
  options:
  - Mocks that verify interactions by recording each call and asserting the exact sequence was invoked
  - Spies that wrap the real AWS SDK client and passively record every request while forwarding it onward
  - Dummies that are passed only to satisfy a constructor parameter and are never actually invoked at runtime
  - Fakes — working lightweight implementations of the dependency
  answer: 3
  explanation: |
    A fake is a real, working, lightweight implementation (in-memory queue,
    local S3/LocalStack, embedded broker) — enough to run against, unlike a stub
    (canned answers) or a mock (interaction verification).
  ref: concepts.md#test-doubles-at-integration-boundaries
- id: integration-testing-strategies-032
  difficulty: intermediate
  tags:
  - test-doubles
  - mock
  - verify
  question: |
    You want to assert that your service actually PUBLISHED an event to a broker
    (not what the broker did afterward). Which double role fits?
  options:
  - A mock that verifies the publish interaction occurred
  - A fake database that stores the events in an in-memory table you query afterward to count what was written
  - A stub returning a canned HTTP response that lets the publish call succeed without inspecting whether it ran
  - A dummy object passed only to fill the publisher parameter slot and never actually exercised during the test
  answer: 0
  explanation: |
    When the assertion is about whether a particular interaction happened, a
    mock (verifying the call) is the right double. Stubs supply canned data;
    fakes are working implementations; dummies fill parameter slots.
  ref: concepts.md#test-doubles-at-integration-boundaries
- id: integration-testing-strategies-033
  difficulty: beginner
  tags:
  - flakiness
  - definition
  question: |
    What is a flaky test?
  options:
  - A test that runs only in the production environment and is skipped entirely on developer machines and in CI
  - A test that always fails deterministically because its expected value was hard-coded incorrectly at authoring time
  - A test that passes or fails nondeterministically on the same code
  - A test that has no assertions and therefore reports green regardless of what the code under test actually does
  answer: 2
  explanation: |
    A flaky test yields different results (pass/fail) on the same unchanged code
    and environment. Flakiness erodes trust in the suite and encourages the
    harmful "just re-run it" habit.
  ref: concepts.md#sources-of-flakiness
- id: integration-testing-strategies-034
  difficulty: intermediate
  tags:
  - flakiness
  - async
  - awaitility
  question: |
    An event-driven test does `publish(event); Thread.sleep(500); assert
    count==1;` and fails intermittently. What is the best fix?
  options:
  - Remove the assertion so the intermittent failure can no longer be reported by the runner on a slow run
  - Run the test twice on every build and take the second result, assuming the handler has caught up by then
  - Increase the sleep to a fixed 5000 ms permanently so the consumer is virtually always finished in time
  - Poll for the condition with a timeout (e.g. Awaitility.await().atMost(...).untilAsserted(...)) instead
    of a fixed sleep
  answer: 3
  explanation: |
    A fixed sleep guesses the timing and is inherently racy — too short fails,
    too long slows the suite. Polling for the expected condition up to a bound
    waits exactly as long as needed and no longer.
  ref: concepts.md#sources-of-flakiness
- id: integration-testing-strategies-035
  difficulty: intermediate
  tags:
  - flakiness
  - order-dependence
  question: |
    A test passes when run alone but fails when the whole suite runs. What is
    the most likely cause?
  options:
  - The test has a syntax error that the compiler flags only once the surrounding suite classes are loaded together
  - Test-order dependence — it relies on state left by (or expected by) other tests
  - The database responds too fast when warm, so the query returns before the write under test has been durably flushed
  - The assertion library is an outdated version whose matchers behave differently once a newer copy is on the suite classpath
  answer: 1
  explanation: |
    Different behaviour alone vs in-suite points to hidden coupling on shared
    state or ordering. The fix is per-test isolation; randomizing test order in
    CI helps expose such dependencies.
  ref: concepts.md#sources-of-flakiness
- id: integration-testing-strategies-036
  difficulty: intermediate
  tags:
  - flakiness
  - time
  - clock
  question: |
    A test fails only when run near midnight or month-end, or in another
    timezone. What is the root cause and fix?
  options:
  - The code reads the real wall-clock/timezone; inject a fixed Clock and pin timezone/locale in the test
  - The test needs more assertions covering the boundary dates so the flake is caught reliably on every run
  - The database is provisioned in the wrong region, so its session timezone drifts from the application's each night
  - The CI server's own clock has broken and must be restarted to resynchronize it before the suite can pass again
  answer: 0
  explanation: |
    Time- and timezone-dependent logic tested against the real clock is
    inherently flaky. Injecting a fixed Clock (and pinning TZ/locale) makes the
    behaviour deterministic and reproducible.
  ref: concepts.md#sources-of-flakiness
- id: integration-testing-strategies-037
  difficulty: intermediate
  tags:
  - flakiness
  - ordering
  - sql
  question: |
    A query test intermittently fails asserting rows in a specific order,
    though all expected rows are present. What is the fix?
  options:
  - Switch to an in-memory database such as H2, whose embedded storage engine always returns rows in
    stable insertion order
  - Add a Thread.sleep before the assertion to give the storage engine time to settle the rows into
    their final on-disk order
  - Add an explicit ORDER BY to the query (or use an order-agnostic assertion), since result order is
    not guaranteed without it
  - Delete the failing rows from the fixture so the assertion only ever checks the subset that reliably
    comes back already sorted
  answer: 2
  explanation: |
    Without ORDER BY, databases may return rows in any order, so a
    position-sensitive assertion is flaky. Either sort explicitly or assert in
    an order-independent way (e.g. containsExactlyInAnyOrder).
  ref: concepts.md#sources-of-flakiness
- id: integration-testing-strategies-038
  difficulty: advanced
  tags:
  - flakiness
  - retries
  - policy
  question: |
    Why is auto-retrying failing tests until they pass a poor default policy?
  options:
  - JUnit 5 forbids retries entirely and will fail the build if a @RepeatedTest is used to re-run a
    previously failing case
  - Retries always mutate the test's assertions on each attempt, loosening the expected values until
    one of the runs happens to pass
  - Retries make the overall suite run measurably faster because reruns are scheduled onto idle worker
    threads in parallel
  - It hides real bugs — a genuine race condition or intermittent production fault gets masked instead
    of fixed
  answer: 3
  explanation: |
    Blanket retry-until-green normalizes flakiness and can conceal real
    concurrency bugs that would also bite in production. Better: quarantine
    flaky tests, track them, and fix the root cause.
  ref: concepts.md#sources-of-flakiness
- id: integration-testing-strategies-039
  difficulty: advanced
  tags:
  - flakiness
  - ports
  - parallel
  question: |
    An integration test intermittently fails with "Address already in use"
    under parallel execution. The best fix is to:
  options:
  - Use random/dynamic ports (or container-managed ports) so concurrent tests never contend for the same
    fixed port
  - Run tests only on weekends, when CI load is low enough that no two suites ever request the same
    listener port simultaneously
  - Disable the network stack for the duration of the run so the OS never enforces its per-port bind
    exclusivity check
  - Hard-code the same fixed port in every test and rely on the OS SO_REUSEADDR flag to let the
    parallel workers share that single listener
  answer: 0
  explanation: |
    A fixed port shared across parallel tests causes bind collisions. Binding
    to an ephemeral/dynamic port (or letting the container assign one) removes
    the contention.
  ref: concepts.md#sources-of-flakiness
- id: integration-testing-strategies-040
  difficulty: intermediate
  tags:
  - contract-testing
  - cdc
  question: |
    What problem does consumer-driven contract testing (e.g. Pact) solve
    relative to broad integration testing?
  options:
  - It removes the need for any test doubles because the recorded contract is replayed directly against
    the live provider on every consumer build
  - It makes unit tests unnecessary by folding all business-logic assertions into the shared contract
    that both services validate
  - It verifies consumer/provider API compatibility without standing up both services together, so each
    side runs fast and independently
  - It replaces the database with the contract broker, which stores and serves all persisted test rows
    for both services centrally
  answer: 2
  explanation: |
    Contract testing splits the interaction into a consumer-side check against
    a stub and a provider-side verification of the shared contract. Neither side
    needs the other running, avoiding the cost and flakiness of broad
    integration.
  ref: concepts.md#contract-testing-as-an-alternative-to-broad-integration
- id: integration-testing-strategies-041
  difficulty: advanced
  tags:
  - contract-testing
  - provider
  question: |
    In consumer-driven contract testing, what happens on the PROVIDER side?
  options:
  - The provider spins up a mock of the consumer application and asserts against its rendered UI screens
    to confirm they still display correctly
  - The provider checks out and runs the consumer's full unit-test suite inside its own pipeline as the
    compatibility gate
  - The provider generates the authoritative contract from its own code first and then publishes it for
    every consumer to conform to
  - The provider replays/verifies the shared contract against the real provider to prove it still satisfies
    every consumer's expectations
  answer: 3
  explanation: |
    The consumer generates the contract from its expectations; the provider
    then verifies that contract against its real implementation, catching any
    change that would break a consumer — before deployment.
  ref: concepts.md#contract-testing-as-an-alternative-to-broad-integration
- id: integration-testing-strategies-042
  difficulty: advanced
  tags:
  - contract-testing
  - tradeoff
  question: |
    What is a key limitation of contract tests compared with broad end-to-end
    tests?
  options:
  - They cannot detect breaking API changes, because the contract is regenerated from current code on
    each run and therefore always passes
  - They verify the shape/semantics of the interaction, not full end-to-end business behaviour across
    many hops
  - They require a full shared environment with every provider and consumer deployed together before a
    single contract can be checked
  - They can only test relational databases and offer no way to describe an HTTP or message-broker
    interaction between two services
  answer: 1
  explanation: |
    Contract tests confirm two parties agree on the request/response contract;
    they do not exercise a whole multi-hop business journey. That is why a thin
    set of broad end-to-end tests is still kept for critical journeys.
  ref: concepts.md#contract-testing-as-an-alternative-to-broad-integration
- id: integration-testing-strategies-043
  difficulty: intermediate
  tags:
  - strategy
  - fowler
  - contract
  question: |
    Fowler's recommended overall balance for service integration risk is:
  options:
  - Many narrow integration tests plus contract tests, with a small number of broad end-to-end tests for
    critical journeys
  - Only manual exploratory testing in a shared staging environment, driven by hand before each release
    with no automated boundary coverage
  - No integration tests at all, relying entirely on a large base of fast unit tests to catch every
    cross-service compatibility problem
  - Only broad end-to-end tests, run frequently against a fully wired live environment as the single
    source of integration confidence
  answer: 0
  explanation: |
    The guidance is to lean on numerous fast narrow integration tests and
    contract tests to cover most integration risk, keeping broad/system tests
    few and reserved for the most important whole-system flows.
  ref: concepts.md#contract-testing-as-an-alternative-to-broad-integration
- id: integration-testing-strategies-044
  difficulty: beginner
  tags:
  - boundaries
  - messaging
  question: |
    Which of these is a boundary that integration testing is specifically meant
    to exercise?
  options:
  - A documentation comment in the source file describing the intended behaviour of the method below it
  - A private helper method's pure arithmetic that runs entirely in memory and touches no external
    collaborator
  - Code interacting with a message broker (serialization, ack/redelivery, ordering)
  - A compile-time constant declared in a class and inlined by the compiler wherever it is referenced
  answer: 2
  explanation: |
    Integration tests target real boundaries such as code↔broker, where
    serialization, topic config, redelivery, and ordering can break — things
    unit tests over pure logic never touch.
  ref: concepts.md#what-integration-testing-covers
- id: integration-testing-strategies-045
  difficulty: intermediate
  tags:
  - scenario
  - strategy
  question: |
    A team's DB integration suite is slow and flaky: it uses a single shared H2
    instance seeded once, tests run in a fixed order, and several assert on rows
    from earlier tests. Which change best addresses the ROOT cause?
  options:
  - Increase the connection and query timeouts everywhere so the shared seed has more time to load
    before the order-dependent assertions run
  - Move all of the row assertions up to the end-to-end layer, where the fully wired system reseeds the
    database cleanly before every scenario
  - Add a global retry of 3 attempts per test so an assertion that reads another test's leftover rows
    eventually catches a clean pass
  - Give each test isolated, self-built data (unique keys) against a real DB, and remove cross-test ordering
    assumptions
  answer: 3
  explanation: |
    The failures stem from shared mutable state and order dependence. Isolating
    each test's data (unique keys, per-test setup) against a production-faithful
    DB and removing inter-test coupling fixes the cause; retries/timeouts only
    mask it.
  ref: concepts.md#test-data-management--isolation
- id: integration-testing-strategies-046
  difficulty: advanced
  tags:
  - scenario
  - rollback
  - commit
  question: |
    A repository method relies on a database trigger that fires AFTER COMMIT to
    populate an audit row. Tests use @Transactional rollback and never see the
    audit row. What is happening?
  options:
  - Rollback never commits, so commit-time triggers/hooks don't fire — use a commit-and-truncate strategy
    against a real DB instead
  - JUnit 5's transactional test extension automatically disables database triggers for the duration of
    each annotated test method
  - The audit row is being written correctly but is immediately deleted by a concurrent test running in
    a parallel worker before the assertion reads it
  - The trigger itself is broken and must be rewritten to fire on BEFORE INSERT instead so it populates
    the audit row within the same transaction
  answer: 0
  explanation: |
    Because the test transaction is rolled back, nothing is ever committed, so
    AFTER COMMIT triggers don't run. This is a fundamental limitation of
    rollback isolation; test such behaviour with real commits (truncate between
    tests).
  ref: concepts.md#test-data-management--isolation
- id: integration-testing-strategies-047
  difficulty: intermediate
  tags:
  - scenario
  - narrow
  - wiremock
  question: |
    You need to verify your service correctly handles a downstream payment API
    returning HTTP 503 with retries, but you don't own that API. Which approach
    is most appropriate?
  options:
  - No test at all — a downstream 503 response is a runtime condition that cannot be reproduced or
    asserted on in an automated suite
  - A broad integration test that drives the live production payment API and waits for it to return a
    real 503 during a genuine outage window
  - A narrow integration test using a mock server (WireMock) stubbed to return 503, exercising your real
    client and retry logic
  - A unit test that mocks your own retry method to return success, confirming the caller proceeds once
    the retries have completed
  answer: 2
  explanation: |
    A local mock server lets you deterministically simulate the 503 and drive
    your real HTTP client and retry logic, without depending on (or hammering) a
    live third-party API. That is the narrow integration approach.
  ref: concepts.md#test-doubles-at-integration-boundaries
- id: integration-testing-strategies-048
  difficulty: intermediate
  tags:
  - scenario
  - contract-vs-broad
  question: |
    Two teams own a consumer and a provider service that deploy on independent
    schedules, and their shared broad integration environment is constantly
    flaky and blocks releases. What is the most effective strategy change?
  options:
  - Run the broad integration tests more often against the shared environment so the flaky failures
    surface earlier and can be re-run until they pass
  - Stop testing the integration entirely and rely on production monitoring to catch any request/response
    incompatibility after deploy
  - Merge the two services back into a single deployable so the network boundary disappears and no
    cross-service test is needed
  - Introduce consumer-driven contract tests so each side verifies the contract independently in its own
    pipeline
  answer: 3
  explanation: |
    Contract testing decouples the two pipelines: the consumer tests against a
    contract-derived stub and the provider verifies the contract, so neither
    needs the shared flaky environment and independent deploys stay safe.
  ref: concepts.md#contract-testing-as-an-alternative-to-broad-integration
