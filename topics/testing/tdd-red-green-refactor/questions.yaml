topic: "Test-Driven Development (Red-Green-Refactor)"
domain: testing
topic_slug: tdd-red-green-refactor
version: 1
questions:
  - id: tdd-red-green-refactor-001
    difficulty: beginner
    tags: [cycle, basics]
    question: |
      What are the three phases of the TDD cycle, in order?
    options:
      - "Refactor → Red → Green"
      - "Red → Green → Refactor"
      - "Green → Red → Refactor"
      - "Red → Refactor → Green"
    answer: 1
    explanation: |
      The TDD mantra is Red (write a failing test), Green (write the simplest code to make
      it pass), Refactor (improve the design while all tests stay green), then repeat.
    ref: "concepts.md#the-red-green-refactor-cycle"

  - id: tdd-red-green-refactor-002
    difficulty: beginner
    tags: [cycle, red]
    question: |
      In the "Red" phase, what should happen when you run the newly written test?
    options:
      - "It should be skipped until the code is written"
      - "It should pass immediately, proving the code already works"
      - "It should fail, and fail for the expected reason"
      - "It should throw a compile error that you ignore"
    answer: 2
    explanation: |
      Red means the test fails — and it must fail for the *expected* reason (e.g. an
      assertion mismatch). Seeing it fail proves the test is capable of failing and isn't a
      false positive.
    ref: "concepts.md#the-red-green-refactor-cycle"

  - id: tdd-red-green-refactor-003
    difficulty: beginner
    tags: [cycle, green]
    question: |
      What is the goal of the "Green" phase?
    options:
      - "Write the cleanest, most general implementation possible"
      - "Add as many new features as you can while you're in the code"
      - "Write the simplest code that makes the failing test pass"
      - "Delete the failing test if it's inconvenient"
    answer: 2
    explanation: |
      Green means getting to a passing bar as fast as possible with the simplest code — even
      an ugly or hard-coded one. Cleanup and generalisation happen in the Refactor phase.
    ref: "concepts.md#the-red-green-refactor-cycle"

  - id: tdd-red-green-refactor-004
    difficulty: beginner
    tags: [cycle, refactor]
    question: |
      During the "Refactor" phase, what must remain true?
    options:
      - "You add new behaviour and new tests for it"
      - "Behaviour is unchanged and all tests stay green"
      - "You are allowed to let a few tests go red temporarily"
      - "You rewrite the tests to match the new code"
    answer: 1
    explanation: |
      Refactoring improves internal structure (remove duplication, rename, extract) WITHOUT
      changing behaviour; the green suite is the safety net proving you didn't break anything.
      No new functionality — and therefore no new tests — is added in this phase.
    ref: "concepts.md#the-red-green-refactor-cycle"

  - id: tdd-red-green-refactor-005
    difficulty: intermediate
    tags: [cycle, pitfalls]
    question: |
      According to Fowler, what is the most common way teams get TDD wrong?
    options:
      - "Writing far too many tests up front before any design has emerged"
      - "Using a mocking framework for nearly every collaborator in the suite"
      - "Running the full test suite too frequently after every tiny edit"
      - "Skipping the Refactor step, ending with a messy pile of code"
    answer: 3
    explanation: |
      The most common failure is skipping refactoring. Without it you "just end up with a
      messy aggregation of code fragments" — you lose the design benefit that makes TDD
      worthwhile.
    ref: "concepts.md#the-red-green-refactor-cycle"

  - id: tdd-red-green-refactor-006
    difficulty: intermediate
    tags: [cycle, red]
    question: |
      You write a new test in a TDD cycle and it passes on the very first run, before you've
      written any production code. What is the correct interpretation?
    options:
      - "The test is wrong or asserts nothing meaningful; investigate before continuing"
      - "Great news — you can move straight on to implementing the next feature"
      - "TDD is now complete for this class and no further tests are needed"
      - "You should delete all other tests since this one covers everything"
    answer: 0
    explanation: |
      A test that passes without any new code is a red flag: it may assert nothing, test the
      wrong thing, or the behaviour already exists. You must see a genuine red first,
      otherwise a green tells you nothing.
    ref: "concepts.md#the-red-green-refactor-cycle"

  - id: tdd-red-green-refactor-007
    difficulty: intermediate
    tags: [canon-tdd, planning]
    question: |
      In Beck's "Canon TDD", what preliminary step precedes the red-green-refactor loop?
    options:
      - "Design the full class hierarchy in a UML tool before writing any code"
      - "Set up a green CI pipeline that runs the suite on every push first"
      - "Write all the production classes as empty stubs to be filled in later"
      - "Write a list of the test cases you'll need, then order them"
    answer: 3
    explanation: |
      Beck recommends first writing a list of test scenarios, then sequencing them to drive
      you quickly to the salient points of the design — a lightweight plan, not big design
      up front.
    ref: "concepts.md#the-red-green-refactor-cycle"

  - id: tdd-red-green-refactor-008
    difficulty: beginner
    tags: [test-first, definition]
    question: |
      What primarily distinguishes test-first (TDD) from test-after development?
    options:
      - "Test-first writes the failing test before the production code it validates"
      - "Test-first mandates a different, stricter assertion library than test-after"
      - "Test-first requires reaching 100% branch and line coverage before merging"
      - "Test-first runs its tests only in the CI pipeline, never on the local machine"
    answer: 0
    explanation: |
      The defining trait of test-first/TDD is writing the test before the implementation, so
      the test drives the design and you observe it fail before making it pass.
    ref: "concepts.md#test-first-vs-test-after"

  - id: tdd-red-green-refactor-009
    difficulty: intermediate
    tags: [test-first, false-positive]
    question: |
      What is a key risk of test-after (test-last) tests that test-first avoids?
    options:
      - "They run more slowly because the code already exists to exercise"
      - "They are technically forbidden from using mocks or stubbed collaborators"
      - "They may be subtly broken and pass forever, giving false confidence (never seen to fail)"
      - "They always over-test the implementation on purpose to inflate coverage"
    answer: 2
    explanation: |
      A test written after the code passes may contain a bug (wrong assertion/setup) yet
      still pass, because it was never observed failing. Test-first guarantees you saw the
      test fail, so a later pass is meaningful.
    ref: "concepts.md#test-first-vs-test-after"

  - id: tdd-red-green-refactor-010
    difficulty: intermediate
    tags: [test-first, design-pressure]
    question: |
      Why is being "the first client of your own API" cited as a benefit of test-first?
    options:
      - "It makes the resulting test suite run in parallel across cores automatically"
      - "It guarantees strictly higher line coverage than writing the code first"
      - "It removes the need for any integration tests later in the pyramid"
      - "Awkward-to-test APIs surface immediately, pushing you toward decoupled, testable design"
    answer: 3
    explanation: |
      Writing the test first means you experience your API as a caller before the design
      solidifies. Painful setup (many mocks, big constructors, hidden state) is felt at once,
      creating design pressure toward small, decoupled units.
    ref: "concepts.md#test-first-vs-test-after"

  - id: tdd-red-green-refactor-011
    difficulty: beginner
    tags: [three-rules, uncle-bob]
    question: |
      Who formulated the widely cited "Three Rules of TDD"?
    options:
      - "Martin Fowler"
      - "Kent Beck"
      - "Robert C. Martin (Uncle Bob)"
      - "Michael Feathers"
    answer: 2
    explanation: |
      Robert C. Martin ("Uncle Bob") distilled the micro-rhythm of TDD into three rules. Kent
      Beck originated TDD itself; the three-rules phrasing is Martin's.
    ref: "concepts.md#the-three-rules-of-tdd"

  - id: tdd-red-green-refactor-012
    difficulty: intermediate
    tags: [three-rules]
    question: |
      Per Uncle Bob's three rules, how much of a unit test are you allowed to write at a time?
    options:
      - "Only enough to fail — and a compilation failure counts as a failure"
      - "The entire test class written out fully before any production code exists"
      - "As many tests as needed in one pass to reach 100% branch coverage"
      - "None at all until the production code it targets has been written"
    answer: 0
    explanation: |
      Rule 2: write no more of a test than is sufficient to fail, and failing to compile
      counts as a failure. This is why you can reference a not-yet-existing method — the
      non-compiling test is the red state.
    ref: "concepts.md#the-three-rules-of-tdd"

  - id: tdd-red-green-refactor-013
    difficulty: intermediate
    tags: [three-rules]
    question: |
      Which statement matches the three rules' constraint on production code?
    options:
      - "Write production code only to make a currently failing test pass, and no more than needed"
      - "Write all the production code up front first, then backfill the tests afterward"
      - "Write production code freely as long as overall coverage stays above the 80% line"
      - "Never touch or modify production code again once a test has turned green"
    answer: 0
    explanation: |
      Rules 1 and 3 together: you may only write production code to pass a failing test, and
      no more than is sufficient to pass that one test. This keeps cycles to tens of seconds.
    ref: "concepts.md#the-three-rules-of-tdd"

  - id: tdd-red-green-refactor-014
    difficulty: advanced
    tags: [three-rules, practice]
    question: |
      A senior engineer says they don't literally follow the three rules on every line. What
      is the most defensible view?
    options:
      - "They're violating TDD, so their entire test suite is worthless and untrustworthy"
      - "The three rules only apply to junior developers still learning the discipline"
      - "The rules strictly forbid any refactoring once a test has gone green"
      - "The three rules are an ideal training rhythm; experienced devs scale step size to confidence"
    answer: 3
    explanation: |
      The three rules describe an ideal micro-rhythm useful for learning discipline.
      Experienced practitioners take larger steps when confident and shrink to baby steps
      when a problem gets hard or a test surprises them.
    ref: "concepts.md#the-three-rules-of-tdd"

  - id: tdd-red-green-refactor-015
    difficulty: beginner
    tags: [fake-it]
    question: |
      What does "fake it till you make it" mean in TDD?
    options:
      - "Pretend the tests pass by marking them green without actually running them"
      - "Return a hard-coded value to pass the first test, then generalise as more tests force it"
      - "Copy a working implementation from another project and adapt it slightly"
      - "Skip writing any tests until the feature is fully done and shipped"
    answer: 1
    explanation: |
      Fake it means returning a constant (e.g. `return 4;`) to get green fast, then letting
      subsequent tests drive you to the general implementation. It keeps the bar green while
      you incrementally discover the real solution.
    ref: "concepts.md#baby-steps-triangulation--fake-it-till-you-make-it"

  - id: tdd-red-green-refactor-016
    difficulty: intermediate
    tags: [triangulation]
    question: |
      Your `add` method currently does `return 4;` and passes the test `add(2,2)==4`. Which
      technique forces you to write the real `return a + b;`?
    options:
      - "Adding a second, differing assertion like add(3,5)==8 (triangulation)"
      - "Deleting the first test so the hard-coded return no longer has to satisfy it"
      - "Increasing the code coverage thresholds enforced by the CI build gate"
      - "Mocking the addition operator so the method delegates to a stub"
    answer: 0
    explanation: |
      Triangulation adds a second concrete example the fake cannot satisfy. Once both
      add(2,2)==4 and add(3,5)==8 must pass, `return 4;` fails and you're driven to the
      general `return a + b;`.
    ref: "concepts.md#baby-steps-triangulation--fake-it-till-you-make-it"

  - id: tdd-red-green-refactor-017
    difficulty: intermediate
    tags: [obvious-implementation]
    question: |
      When is Beck's "obvious implementation" strategy appropriate instead of faking/triangulating?
    options:
      - "Never — you must always fake a constant first before generalising"
      - "Only when working inside untested legacy code under characterization"
      - "Only when there are no other tests exercising the same unit yet"
      - "When the real implementation is trivial and you're confident you can write it directly"
    answer: 3
    explanation: |
      When the code is simple and you're confident, just write the real thing. Fall back to
      faking and triangulation when you get an unexpected red or the problem is harder than expected.
    ref: "concepts.md#baby-steps-triangulation--fake-it-till-you-make-it"

  - id: tdd-red-green-refactor-018
    difficulty: intermediate
    tags: [baby-steps]
    question: |
      In TDD, when should you deliberately shrink to smaller "baby steps"?
    options:
      - "When the shared build server is running slowly under heavy load"
      - "Only on Fridays or right before a release freeze window"
      - "When you're uncertain or getting unexpected red bars"
      - "When line and branch coverage have already reached 100%"
    answer: 2
    explanation: |
      Baby steps means taking the smallest increment that still moves forward. If you're
      guessing or hitting surprising failures, make steps smaller to regain control; take
      bigger steps when confident.
    ref: "concepts.md#baby-steps-triangulation--fake-it-till-you-make-it"

  - id: tdd-red-green-refactor-019
    difficulty: beginner
    tags: [benefits]
    question: |
      Which of these is the benefit that Beck and Fowler emphasise MOST about TDD?
    options:
      - "Design feedback — hard-to-test code signals poor decoupling early"
      - "It guarantees a completely bug-free product with zero defects"
      - "It eliminates the need for any code review before merging"
      - "It makes the compiled code run noticeably faster at runtime"
    answer: 0
    explanation: |
      The primary payoff is design pressure: because you're the first client of your API,
      testability pain reveals coupling/design problems immediately. Regression safety and
      documentation are additional benefits.
    ref: "concepts.md#tdd-benefits-design-pressure-regression-safety-documentation"

  - id: tdd-red-green-refactor-020
    difficulty: beginner
    tags: [benefits, documentation]
    question: |
      In what sense do TDD tests act as "living documentation"?
    options:
      - "They automatically generate a formatted PDF reference manual for end users"
      - "They legally replace every code comment and inline docstring in the project"
      - "They document only the database schema and none of the business behaviour"
      - "Well-named tests describe intended behaviour and can't silently drift stale — a wrong one fails"
    answer: 3
    explanation: |
      Descriptive test names (e.g. transferFailsWhenBalanceInsufficient) read as executable
      specifications. Unlike comments, they can't quietly become outdated — if behaviour
      changes, the test fails.
    ref: "concepts.md#tdd-benefits-design-pressure-regression-safety-documentation"

  - id: tdd-red-green-refactor-021
    difficulty: intermediate
    tags: [benefits, regression]
    question: |
      Why is a TDD suite considered especially trustworthy as a regression net?
    options:
      - "Because it always achieves the highest possible line coverage purely by definition"
      - "Because each test was demonstrably seen to fail once, so a later red genuinely signals a regression"
      - "Because it runs exclusively against the live production environment for realism"
      - "Because it deliberately avoids assertions in favour of manual output inspection"
    answer: 1
    explanation: |
      Each TDD test has failed at least once (the red phase), so it's proven capable of
      failing. That's why a subsequent red is a trustworthy signal of a real regression,
      enabling fearless refactoring.
    ref: "concepts.md#tdd-benefits-design-pressure-regression-safety-documentation"

  - id: tdd-red-green-refactor-022
    difficulty: advanced
    tags: [benefits, evidence]
    question: |
      What does the empirical research on TDD most accurately show?
    options:
      - "TDD dramatically increases both quality and productivity across every controlled study"
      - "TDD consistently slows teams down while delivering no measurable quality benefit at all"
      - "Mixed results: a small positive effect on external quality, little/no clear effect on productivity"
      - "No empirical studies on TDD have ever been conducted or published in the literature"
    answer: 2
    explanation: |
      Controlled studies show mixed results — a small positive effect on external quality and
      roughly neutral productivity. The honest interview pitch is design feedback plus a
      regression net, not a guaranteed speed/quality multiplier.
    ref: "concepts.md#tdd-benefits-design-pressure-regression-safety-documentation"

  - id: tdd-red-green-refactor-023
    difficulty: intermediate
    tags: [myths]
    question: |
      Which statement about TDD is a MYTH?
    options:
      - "TDD produces a suite of mostly unit tests"
      - "TDD guarantees 100% coverage and a bug-free product"
      - "Tests can share the same misunderstanding as the code"
      - "TDD complements, rather than replaces, integration and exploratory testing"
    answer: 1
    explanation: |
      TDD does not guarantee 100% coverage or zero bugs. Tests can encode the same
      misunderstanding as the production code, producing false confidence. TDD reduces
      defects but is no silver bullet.
    ref: "concepts.md#tdd-limits-myths--when-its-less-useful"

  - id: tdd-red-green-refactor-024
    difficulty: intermediate
    tags: [limits, when-not]
    question: |
      For which situation is classic fast-unit TDD LEAST directly applicable?
    options:
      - "Exploratory spike work where you don't yet understand the API you want"
      - "A pure pricing-calculation function with clear, fully specified inputs and outputs"
      - "A well-specified string parser with an unambiguous, documented input grammar"
      - "A stateless business rule engine whose branches are all enumerable up front"
    answer: 0
    explanation: |
      TDD assumes you can state the next expected behaviour. For exploratory/spike work,
      prototype first, then delete the spike and TDD the real implementation. TDD shines on
      well-understood logic.
    ref: "concepts.md#tdd-limits-myths--when-its-less-useful"

  - id: tdd-red-green-refactor-025
    difficulty: intermediate
    tags: [limits]
    question: |
      A team says "we TDD everything, so we don't need integration or exploratory testing."
      What's the flaw?
    options:
      - "Nothing is wrong — TDD by itself fully covers every category of testing need"
      - "TDD explicitly forbids writing any other kind of test alongside its unit tests"
      - "Integration tests are technically incompatible and cannot coexist with a TDD suite"
      - "TDD mostly yields unit tests; it complements but doesn't replace integration/E2E/exploratory testing"
    answer: 3
    explanation: |
      TDD "is not a substitute for other forms of software testing." It mainly produces unit
      tests and doesn't adequately exercise integration, UI, distributed timing, or security
      concerns, which need other test types.
    ref: "concepts.md#tdd-limits-myths--when-its-less-useful"

  - id: tdd-red-green-refactor-026
    difficulty: advanced
    tags: [limits, false-confidence]
    question: |
      How can a fully green TDD suite still let a real requirement bug ship?
    options:
      - "Tests always catch requirement bugs, so a green suite guarantees correct behaviour"
      - "Only if line coverage drops below 100%, which allows the bug to slip through untested"
      - "If the developer misunderstood the requirement, the same wrong assumption is encoded in both test and code"
      - "Only if the tests happen to be written in a different language from the production code"
    answer: 2
    explanation: |
      Tests can share the same misunderstanding as the production code. If you misread a
      requirement, you'll write a test asserting the wrong thing and code that satisfies it —
      green but wrong. This is the "false sense of security" limitation.
    ref: "concepts.md#tdd-limits-myths--when-its-less-useful"

  - id: tdd-red-green-refactor-027
    difficulty: beginner
    tags: [classicist-mockist]
    question: |
      In the classicist (Detroit/Chicago) school of TDD, how do you typically verify behaviour?
    options:
      - "By asserting on resulting state / return values, using real collaborators where practical"
      - "By verifying every single method call recorded on fully mocked collaborators"
      - "By parsing the emitted log output only, never inspecting return values or state"
      - "By measuring the method's wall-clock execution time against a fixed threshold"
    answer: 0
    explanation: |
      Classicist TDD uses real collaborators where practical, substituting doubles only for
      awkward dependencies, and verifies via state (return values / resulting object state).
    ref: "concepts.md#classicist-vs-mockist-tdd"

  - id: tdd-red-green-refactor-028
    difficulty: intermediate
    tags: [classicist-mockist, london]
    question: |
      The mockist (London) school primarily verifies correctness by...
    options:
      - "Asserting only on the final resulting state of the object under test"
      - "Running the code directly in the production environment and observing it"
      - "Comparing rendered UI screenshots pixel-by-pixel against a saved baseline"
      - "Verifying interactions — that the unit called its collaborators with the right arguments"
    answer: 3
    explanation: |
      Mockist/London-school TDD isolates the unit by mocking collaborators and verifies
      behaviour by checking interactions (which methods were called with which arguments),
      driving outside-in, role-based design.
    ref: "concepts.md#classicist-vs-mockist-tdd"

  - id: tdd-red-green-refactor-029
    difficulty: advanced
    tags: [classicist-mockist, over-mocking]
    question: |
      What is the main downside of heavily mockist tests that verify every interaction?
    options:
      - "They run far too slowly because each mock adds heavy per-call overhead"
      - "They become 'change-detector' tests that break on internal refactors without catching real bugs"
      - "They cannot be expressed in JUnit and require a separate proprietary framework"
      - "They significantly increase the runtime heap memory usage of the system"
    answer: 1
    explanation: |
      Over-specified interaction tests couple to the implementation's call sequence, so they
      break whenever you refactor internals even though behaviour is unchanged — high
      maintenance, low bug-catching value.
    ref: "concepts.md#classicist-vs-mockist-tdd"

  - id: tdd-red-green-refactor-030
    difficulty: intermediate
    tags: [classicist-mockist, scenario]
    question: |
      You need to test that `TransferService.withdraw` publishes a `WithdrawnEvent` to an
      `EventBus`. Which approach best fits, and in which style?
    options:
      - "Assert on the account balance only (classicist) — it fully covers the published event"
      - "Run the test against the live production Kafka cluster to be certain it publishes"
      - "Mock the EventBus and verify(bus).publish(...) — a mockist/interaction test"
      - "Skip the test entirely, since asynchronous events cannot be tested reliably"
    answer: 2
    explanation: |
      Publishing to a collaborator is an interaction with no observable return state, so an
      interaction (mockist) test fits: mock the EventBus and verify the publish call. Mocking
      at this owned architectural seam is appropriate.
    ref: "concepts.md#classicist-vs-mockist-tdd"

  - id: tdd-red-green-refactor-031
    difficulty: advanced
    tags: [classicist-mockist, judgment]
    question: |
      What is the mature guidance on choosing classicist vs mockist style?
    options:
      - "Always mock every collaborator unconditionally to keep the whole suite maximally fast"
      - "Never mock anything at all, wiring up real instances of every dependency in every test"
      - "Just use whichever style your IDE's test-generation wizard happens to default to"
      - "Mock at architectural seams you own (ports, external services); prefer real objects for value objects and cheap in-process collaborators"
    answer: 3
    explanation: |
      It's not either/or. Mock at owned seams and external systems; use real objects for
      value types and cheap collaborators. Over-mocking yields brittle change-detector tests;
      never-mocking makes some units impossible to isolate.
    ref: "concepts.md#classicist-vs-mockist-tdd"

  - id: tdd-red-green-refactor-032
    difficulty: intermediate
    tags: [emergent-design]
    question: |
      What does "emergent design" mean in the context of TDD?
    options:
      - "Growing the design one test at a time, consolidating abstractions during refactor"
      - "Designing the entire system's classes and interfaces fully up front before any code"
      - "Letting the web framework generate the whole object model automatically from config"
      - "Outsourcing all design decisions to a lead architect who never writes or runs tests"
    answer: 0
    explanation: |
      Emergent design grows structure incrementally: each refactor step removes duplication
      and reveals abstractions after you have concrete examples, guided by YAGNI and DRY,
      rather than fixing all design up front.
    ref: "concepts.md#tdd-and-emergent-design"

  - id: tdd-red-green-refactor-033
    difficulty: intermediate
    tags: [emergent-design, duplication]
    question: |
      In Beck's approach, what is the primary signal that tells you where an abstraction should emerge?
    options:
      - "The total number of classes currently declared in the enclosing package"
      - "The alphabetical ordering of the method names within the class under test"
      - "Duplication — abstractions emerge where duplication clusters, removed during refactor"
      - "The overall line count and file size of the accompanying test file"
    answer: 2
    explanation: |
      Beck's heuristic: remove duplication in the refactor step. Abstractions (methods,
      classes, strategies) emerge naturally where duplication clusters — you don't invent
      them speculatively.
    ref: "concepts.md#tdd-and-emergent-design"

  - id: tdd-red-green-refactor-034
    difficulty: intermediate
    tags: [emergent-design, rule-of-three]
    question: |
      What does the "Rule of Three" advise about introducing abstractions?
    options:
      - "Abstract immediately on the very first occurrence, before any duplication appears"
      - "Never introduce an abstraction at all; always leave the duplicated code in place"
      - "Abstract only once the suite has reached full 100% line and branch coverage"
      - "Wait until the third concrete case justifies the generalisation, avoiding premature abstraction"
    answer: 3
    explanation: |
      The Rule of Three: don't abstract on the first or second occurrence; let the third
      concrete case justify generalising. This avoids premature or wrong abstractions that
      don't fit real requirements.
    ref: "concepts.md#tdd-and-emergent-design"

  - id: tdd-red-green-refactor-035
    difficulty: advanced
    tags: [emergent-design, architecture]
    question: |
      Does TDD's emergent design replace deliberate high-level architecture?
    options:
      - "Yes — you never consciously decide architecture; every boundary emerges from tests alone"
      - "No — high-level structure (service boundaries, framework choice) is still chosen deliberately; emergence operates mostly at class/method level"
      - "Yes — the chosen web framework automatically decides all service and module boundaries"
      - "No — TDD strictly forbids ever refactoring anything at the architectural level"
    answer: 1
    explanation: |
      Emergent design works mainly inside boundaries at the class/method level. Big decisions
      (bounded contexts, service boundaries, framework selection) are still made
      consciously — TDD doesn't ban thinking or up-front architecture.
    ref: "concepts.md#tdd-and-emergent-design"

  - id: tdd-red-green-refactor-036
    difficulty: intermediate
    tags: [emergent-design, mantra]
    question: |
      What does the ordering in "make it work, make it right, make it fast" imply?
    options:
      - "Get green first, then refactor for clean design, and only optimise with a proven need"
      - "Optimise aggressively for raw performance before you even get a single test passing"
      - "Never refactor the code again once it works and the tests have first turned green"
      - "Runtime speed always takes priority over correctness whenever the two conflict"
    answer: 0
    explanation: |
      First make it work (green), then make it right (refactor for structure), then make it
      fast — and only optimise when a test/benchmark proves a real need. Don't jump to
      premature optimisation.
    ref: "concepts.md#tdd-and-emergent-design"

  - id: tdd-red-green-refactor-037
    difficulty: intermediate
    tags: [legacy, characterization]
    question: |
      In Michael Feathers' terminology, what is "legacy code"?
    options:
      - "Any code older than five years"
      - "Code written in an old programming language"
      - "Code without tests"
      - "Code that has been deprecated"
    answer: 2
    explanation: |
      Feathers defines legacy code as code without tests. Its lack of a safety net — not its
      age or language — is what makes it risky to change and hard to bring under TDD.
    ref: "concepts.md#tdd-on-legacy-code--characterization-tests"

  - id: tdd-red-green-refactor-038
    difficulty: intermediate
    tags: [legacy, characterization]
    question: |
      What is the purpose of a characterization (golden master) test?
    options:
      - "To assert the ideal, correct behaviour the code should have"
      - "To measure the method's throughput and latency under sustained concurrent load"
      - "To auto-generate formatted end-user API documentation from the method's signatures"
      - "To pin the code's CURRENT behaviour (bugs included) so refactoring is safe"
    answer: 3
    explanation: |
      A characterization test freezes what the code actually does today — including bugs — so
      that when you refactor, any behaviour change is caught. It's opposite to greenfield TDD:
      you pin existing behaviour rather than specify desired behaviour.
    ref: "concepts.md#tdd-on-legacy-code--characterization-tests"

  - id: tdd-red-green-refactor-039
    difficulty: advanced
    tags: [legacy, seams, workflow]
    question: |
      What is the correct sequence for bringing untested legacy code under TDD?
    options:
      - "Refactor the legacy code aggressively to clean it up first, then add the unit tests afterward once it looks right"
      - "Find a seam → write characterization tests pinning current behaviour → refactor to testability → then TDD new changes"
      - "Rewrite the entire module from scratch immediately, discarding the untested legacy implementation as you go"
      - "Add only load and performance benchmark tests to the legacy code, then deploy it straight to production"
    answer: 1
    explanation: |
      Feathers' approach: find a seam (a place to alter behaviour without editing in place),
      write characterization tests to form a regression net, then refactor toward testability,
      and finally TDD new changes normally.
    ref: "concepts.md#tdd-on-legacy-code--characterization-tests"

  - id: tdd-red-green-refactor-040
    difficulty: advanced
    tags: [legacy, characterization, technique]
    question: |
      When writing a characterization test for an unfamiliar legacy method, how do you often
      obtain the expected value?
    options:
      - "Guess the ideal expected value by reading the original requirements document and specification"
      - "Ask the product manager to formally define what the correct expected output should have been"
      - "Run the test with a placeholder assertion, read the actual output, and paste it in as the baseline"
      - "Leave the assertion permanently empty so the characterization test can never fail on any output"
    answer: 2
    explanation: |
      You typically learn the value empirically: run the test with a placeholder, observe what
      the code actually returns, and lock that in as the expected baseline. Approval-testing
      tools automate this "record the actual" step for large outputs.
    ref: "concepts.md#tdd-on-legacy-code--characterization-tests"

  - id: tdd-red-green-refactor-041
    difficulty: intermediate
    tags: [tdd-is-dead, dhh]
    question: |
      Who coined the phrase "test-induced design damage" and started the "TDD is dead" debate?
    options:
      - "Kent Beck"
      - "Martin Fowler"
      - "Nat Pryce"
      - "David Heinemeier Hansson (DHH)"
    answer: 3
    explanation: |
      DHH's 2014 "TDD is dead. Long live testing." post argued that dogmatic, mock-heavy TDD
      causes test-induced design damage, sparking the "Is TDD Dead?" conversations with Beck
      and Fowler.
    ref: "concepts.md#test-induced-design-damage-debate"

  - id: tdd-red-green-refactor-042
    difficulty: advanced
    tags: [tdd-is-dead, design-damage]
    question: |
      What specifically did DHH mean by "test-induced design damage"?
    options:
      - "Indirection and interfaces added SOLELY to make code testable in isolation, harming the design"
      - "Slow-running tests that damage the CI pipeline by inflating build times and blocking merges"
      - "Tests that quietly contain assertion bugs and therefore pass even when the behaviour is broken"
      - "Accidentally deleting sections of working production code while editing the surrounding tests"
    answer: 0
    explanation: |
      Test-induced design damage is the extra layers, indirection, and interfaces introduced
      only to enable isolated, fast unit testing (e.g. mocking the DB) — abstractions that
      make the production design worse rather than better.
    ref: "concepts.md#test-induced-design-damage-debate"

  - id: tdd-red-green-refactor-043
    difficulty: advanced
    tags: [tdd-is-dead, resolution]
    question: |
      What was the balanced conclusion Beck and Fowler offered in response to DHH?
    options:
      - "TDD should be abandoned entirely in favour of writing all tests manually after the feature ships"
      - "The damage stems from over-isolation/dogma; use a balanced test pyramid and test some slices as integration tests against real collaborators"
      - "You should mock every single collaborator in every test to keep the whole unit suite maximally fast"
      - "Never write unit tests again and rely solely on broad end-to-end tests through the live UI"
    answer: 1
    explanation: |
      Beck and Fowler argued the damage is a symptom of over-isolation, not TDD itself. If a
      test forces harmful abstraction (e.g. mocking a database), that's feedback to test that
      slice as an integration test (e.g. Testcontainers) — a balanced pyramid, not damaged design.
    ref: "concepts.md#test-induced-design-damage-debate"

  - id: tdd-red-green-refactor-044
    difficulty: advanced
    tags: [tdd-is-dead, judgment]
    question: |
      Your unit test for a repository requires adding three interfaces just to mock the
      database. Applying the design-damage lesson, what is the better move?
    options:
      - "Add all three interfaces anyway, since more layers of abstraction always make a design cleaner and safer"
      - "Delete the repository class entirely and inline its persistence logic into every calling service instead"
      - "Test that slice as an integration test against a real datastore (e.g. Testcontainers) instead of warping the design"
      - "Mock the raw JDBC driver and connection objects directly so no new repository interfaces are needed at all"
    answer: 2
    explanation: |
      When a test forces abstractions that worsen the production design, the fix is to change
      the test strategy — test the repository against a real database (Testcontainers) rather
      than adding seams purely to enable isolated mocking.
    ref: "concepts.md#test-induced-design-damage-debate"

  - id: tdd-red-green-refactor-045
    difficulty: intermediate
    tags: [double-loop, atdd]
    question: |
      In double-loop (outside-in) TDD, what does the OUTER loop consist of?
    options:
      - "A fast, low-level unit test cycle exercising one method in isolation at a time"
      - "A performance benchmark asserting the feature meets its latency and throughput budget"
      - "A code-coverage report that must reach a fixed line and branch percentage before merging"
      - "A failing acceptance test expressing the feature from the user's/business perspective"
    answer: 3
    explanation: |
      The slow outer loop is a failing acceptance test (often Given/When/Then) that defines
      "done" for the whole feature and stays red until it works. The fast inner loop is the
      classic red-green-refactor unit cycle.
    ref: "concepts.md#double-loop-tdd-with-acceptance-tests"

  - id: tdd-red-green-refactor-046
    difficulty: intermediate
    tags: [double-loop, workflow]
    question: |
      In double-loop TDD, how do the two loops relate during development?
    options:
      - "You spin the inner unit loop many times, growing units until the outer acceptance test finally goes green"
      - "You run the acceptance test exactly once at the start and never execute it again afterward"
      - "The outer acceptance loop must be fully green before you are allowed to write any unit tests"
      - "The outer and inner loops must live in completely separate projects and repositories entirely"
    answer: 0
    explanation: |
      You keep the acceptance test red as a north star and cycle the inner unit loop many
      times, building the needed units, until the pieces integrate and the acceptance test
      goes green — guarding against 'all units green but the feature doesn't work.'
    ref: "concepts.md#double-loop-tdd-with-acceptance-tests"

  - id: tdd-red-green-refactor-047
    difficulty: advanced
    tags: [double-loop, pyramid]
    question: |
      Applying the test pyramid to double-loop TDD, how should the test counts be distributed?
    options:
      - "Many broad, slow acceptance tests at the top with only a thin scattering of fast unit tests"
      - "Few high-value acceptance (outer) tests, with the bulk of tests carried by the fast inner unit loop"
      - "Strictly equal numbers of acceptance and unit tests in every feature, kept in a fixed one-to-one ratio"
      - "Only broad acceptance tests through the outer loop; skip writing unit tests in the inner loop entirely"
    answer: 1
    explanation: |
      Acceptance tests are slower and broader, so keep them few and high-value; the inner unit
      loop carries the bulk of the tests. This is simply the test pyramid applied to the TDD workflow.
    ref: "concepts.md#double-loop-tdd-with-acceptance-tests"

  - id: tdd-red-green-refactor-048
    difficulty: beginner
    tags: [origin, kent-beck]
    question: |
      Who is credited with codifying modern TDD as part of Extreme Programming?
    options:
      - "Robert C. Martin"
      - "David Heinemeier Hansson"
      - "Michael Feathers"
      - "Kent Beck"
    answer: 3
    explanation: |
      Kent Beck codified TDD in the late 1990s as part of Extreme Programming, building on the
      xUnit frameworks he wrote, and later published 'Test-Driven Development: By Example' (2002).
    ref: "concepts.md#the-red-green-refactor-cycle"
