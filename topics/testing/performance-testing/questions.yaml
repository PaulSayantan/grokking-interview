topic: "Performance Testing: Load, Stress, Soak & Spike"
domain: testing
topic_slug: performance-testing
version: 1
questions:
- id: performance-testing-001
  difficulty: beginner
  tags: [definition, non-functional]
  question: |
    Performance testing is best classified as which kind of testing?
  options:
  - "A non-functional test that measures quality attributes like latency, throughput, and stability under load"
  - "A functional test that checks whether the system returns correct results"
  - "A form of unit testing focused on a single method"
  - "A security test that probes for vulnerabilities"
  answer: 0
  explanation: |
    Performance testing is non-functional: it validates quality attributes
    (latency, throughput, resource use, stability under load) rather than
    whether the computed answer is correct. Both functional and performance
    testing are necessary; they catch different classes of failure.
  ref: "concepts.md#what-performance-testing-is-and-why-it-matters"

- id: performance-testing-002
  difficulty: beginner
  tags: [why, emergent]
  question: |
    Why are performance problems typically invisible to unit and integration
    tests?
  options:
  - "Because unit tests are written in a different language"
  - "Because integration tests run in production"
  - "Because performance bugs are always caused by typos"
  - "Because performance bugs only appear under concurrency, contention, and volume, which those tests do not exercise"
  answer: 3
  explanation: |
    Performance problems are emergent — they surface only under concurrency,
    contention, and data/traffic volume. Unit and integration tests exercise
    logic and wiring, not sustained concurrent load, so they cannot reveal a
    scalability ceiling, a leak, or a bad tail latency.
  ref: "concepts.md#what-performance-testing-is-and-why-it-matters"

- id: performance-testing-003
  difficulty: beginner
  tags: [types, load]
  question: |
    What is the goal of a LOAD test specifically?
  options:
  - "Drive traffic past capacity to find the breaking point"
  - "Verify the system meets its SLOs at expected/peak-normal traffic"
  - "Run for many hours to expose memory leaks"
  - "Apply a sudden surge to test autoscaling"
  answer: 1
  explanation: |
    A load test applies steady traffic at the expected (or peak-normal) level
    to confirm the system meets its SLOs there. Exceeding capacity is stress;
    long duration is soak; a sudden surge is a spike.
  ref: "concepts.md#types-of-performance-tests"

- id: performance-testing-004
  difficulty: beginner
  tags: [types, stress]
  question: |
    A stress test differs from a load test primarily because it:
  options:
  - "Uses fewer virtual users"
  - "Only runs in CI"
  - "Deliberately drives load past capacity to find the breaking point and failure mode"
  - "Never uses percentiles"
  answer: 2
  explanation: |
    Stress testing intentionally exceeds capacity to discover the ceiling and
    how the system fails (graceful load-shedding vs catastrophic collapse). A
    load test that merely passes at target tells you nothing about your safety
    margin — that is what stress testing is for.
  ref: "concepts.md#types-of-performance-tests"

- id: performance-testing-005
  difficulty: beginner
  tags: [types, soak, memory-leak]
  question: |
    You suspect a service leaks a small amount of memory per request. Which
    test type is designed to reveal it?
  options:
  - "Soak / endurance test"
  - "A 5-minute load test"
  - "Spike test"
  - "Volume test"
  answer: 0
  explanation: |
    Soak (endurance) testing applies moderate load over a long duration
    (hours to days). A slow leak (e.g., 2 MB/min) is invisible in a short
    load test but accumulates fatally over a long soak, alongside connection
    or file-handle exhaustion and log/disk growth.
  ref: "concepts.md#types-of-performance-tests"

- id: performance-testing-006
  difficulty: intermediate
  tags: [types, spike, stress]
  question: |
    What distinguishes a SPIKE test from a STRESS test?
  options:
  - "A spike test always runs longer than a stress test"
  - "They are identical terms"
  - "A spike test jumps load instantly to test elasticity/recovery; a stress test ramps gradually past capacity to find the ceiling"
  - "A stress test uses an open model while a spike test uses a closed model"
  answer: 2
  explanation: |
    A spike test applies a sudden, sharp surge (then drop) to test elasticity
    — does autoscaling react in time, do queues absorb the burst, does the
    system recover afterward? A stress test ramps gradually past capacity to
    locate the breaking point and observe the failure mode.
  ref: "concepts.md#types-of-performance-tests"

- id: performance-testing-007
  difficulty: intermediate
  tags: [types, volume]
  question: |
    A query is instant in testing but times out in production against 50M
    rows. Which performance test type is aimed at this class of problem?
  options:
  - "Spike test"
  - "Load test with extra virtual users"
  - "Stress test"
  - "Volume (flood) test with a large, realistic data set"
  answer: 3
  explanation: |
    Volume testing runs normal request load against a large, realistic data
    set to expose slow queries, missing indexes, full-table scans, and
    pagination/memory issues that only appear at production data scale.
  ref: "concepts.md#types-of-performance-tests"

- id: performance-testing-008
  difficulty: intermediate
  tags: [types, scalability]
  question: |
    A scalability test is characterized by:
  options:
  - "Holding load fixed and watching memory over 24 hours"
  - "Increasing load AND resources together to measure how capacity grows (linearity, scaling limits)"
  - "Sending one giant request"
  - "Disabling autoscaling entirely"
  answer: 1
  explanation: |
    Scalability testing increases load while also adding resources to measure
    how capacity grows — is scaling linear, where are the horizontal/vertical
    limits? It answers "if I double the fleet, do I double throughput?"
  ref: "concepts.md#types-of-performance-tests"

- id: performance-testing-009
  difficulty: intermediate
  tags: [open-closed, definition]
  question: |
    In a CLOSED workload model, what governs when a new request is sent?
  options:
  - "A fixed arrival rate independent of responses"
  - "A random timer unrelated to the system"
  - "The previous request must complete first; a fixed pool of virtual users loops request-then-next"
  - "The server decides when clients may send"
  answer: 2
  explanation: |
    In a closed model there is a fixed number of virtual users, each looping
    request → wait for response → (think) → next request. A new request is
    only issued after the prior one returns, so in-flight concurrency is
    capped by the VU count.
  ref: "concepts.md#open-vs-closed-workload-models"

- id: performance-testing-010
  difficulty: intermediate
  tags: [open-closed, arrival-rate]
  question: |
    In an OPEN workload model, requests:
  options:
  - "Arrive at a specified rate regardless of whether prior requests have completed"
  - "Are only sent after the previous response returns"
  - "Are limited to one per virtual user"
  - "Stop arriving as soon as latency rises"
  answer: 0
  explanation: |
    An open model schedules arrivals at a target rate (e.g., 500 req/s)
    independent of completions. When the system slows, new arrivals keep
    coming and concurrency grows — which is how real internet traffic behaves.
  ref: "concepts.md#open-vs-closed-workload-models"

- id: performance-testing-011
  difficulty: advanced
  tags: [open-closed, back-pressure]
  question: |
    Why does a closed-model load test tend to UNDERSTATE latency and MASK
    overload?
  options:
  - "Because it uses too many virtual users"
  - "Because closed models always run too briefly"
  - "Because closed models cannot measure percentiles"
  - "Because when the system slows, blocked VUs send fewer requests — the generator self-throttles exactly when the system is struggling, which is unrealistic for open traffic"
  answer: 3
  explanation: |
    In a closed model, VUs block waiting for slow responses, so they issue
    fewer requests precisely when the system is overloaded. This self-applied
    back-pressure is unrealistic for open internet traffic and hides the
    overload that a fixed arrival rate would reveal.
  ref: "concepts.md#open-vs-closed-workload-models"

- id: performance-testing-012
  difficulty: advanced
  tags: [open-closed, k6, tools]
  question: |
    In k6, which pair of executors implements the OPEN (arrival-rate) model?
  options:
  - "constant-vus and ramping-vus"
  - "constant-arrival-rate and ramping-arrival-rate"
  - "shared-iterations and per-vu-iterations"
  - "constant-vus and per-vu-iterations"
  answer: 1
  explanation: |
    k6's constant-arrival-rate and ramping-arrival-rate executors schedule a
    target iteration rate (open model), adjusting VUs to hit it. constant-vus
    and ramping-vus are closed (VU-based); iteration executors are also
    closed.
  ref: "concepts.md#open-vs-closed-workload-models"

- id: performance-testing-013
  difficulty: intermediate
  tags: [open-closed, choice]
  question: |
    For a public internet-facing HTTP API, which workload model is generally
    the correct default, and why?
  options:
  - "Open, because real users arrive independently of response times, so the test keeps offering load as the system degrades and exposes the true tail"
  - "Closed, because it protects the server from too much load"
  - "Either — the model has no effect on measured latency"
  - "Closed, because arrival-rate models cannot be scripted"
  answer: 0
  explanation: |
    Internet traffic is open: users click when they click, regardless of how
    slow the server is. An open model keeps offering the target rate as the
    system degrades, revealing queue growth and true tail latency, whereas a
    closed model self-throttles and hides overload.
  ref: "concepts.md#open-vs-closed-workload-models"

- id: performance-testing-014
  difficulty: advanced
  tags: [coordinated-omission, definition]
  question: |
    Coordinated omission causes measured tail latency to look artificially
    GOOD because:
  options:
  - "The load generator rounds latency down"
  - "The network drops the slow packets"
  - "Percentiles are computed incorrectly by the tool"
  - "While the system stalls, a blocked generator fails to send the requests it was scheduled to send, discarding exactly the worst-latency samples that real users would have hit"
  answer: 3
  explanation: |
    During a stall, a closed-model generator is blocked waiting for the slow
    response and omits the many requests it should have sent in that window.
    Those omitted requests would each have suffered most of the stall, so
    dropping them removes the bad tail and makes p99/p999 look far better than
    reality.
  ref: "concepts.md#the-coordinated-omission-problem"

- id: performance-testing-015
  difficulty: advanced
  tags: [coordinated-omission, why-name]
  question: |
    Why is the phenomenon called "coordinated" omission?
  options:
  - "Because multiple teams coordinate the test"
  - "Because the pauses in measurement coordinate with the pauses in the system under test — you stop sampling exactly when things are worst"
  - "Because it only happens in distributed load generators"
  - "Because it requires coordinating clocks across hosts"
  answer: 1
  explanation: |
    Gil Tene named it "coordinated" because the omissions are correlated with
    the system's stalls: the generator stops recording samples exactly during
    the periods of worst latency, systematically censoring the tail.
  ref: "concepts.md#the-coordinated-omission-problem"

- id: performance-testing-016
  difficulty: advanced
  tags: [coordinated-omission, fix, hdrhistogram]
  question: |
    Which techniques correct for or avoid coordinated omission? (Choose the
    best answer.)
  options:
  - "Only increase the number of virtual users"
  - "Report the average instead of percentiles"
  - "Use an open arrival-rate model and/or HdrHistogram's coordinated-omission correction (recordValueWithExpectedInterval), measuring from intended send time"
  - "Run the test for a shorter duration"
  answer: 2
  explanation: |
    Fixes: use an open (arrival-rate) model so arrivals keep coming during
    stalls; back-fill synthetic samples with HdrHistogram's expected-interval
    correction (or use wrk2 / arrival-rate modes built to avoid it); and
    measure latency from the intended send time, not the actual send time.
  ref: "concepts.md#the-coordinated-omission-problem"

- id: performance-testing-017
  difficulty: intermediate
  tags: [coordinated-omission, diagnosis]
  question: |
    A load test reports a clean p99 of 40 ms, but during the run the target's
    CPU is pegged at 100% and its request queue is growing. What is the most
    likely explanation?
  options:
  - "The client latency is suffering from coordinated omission — trust the server-side saturation signals over the suspiciously clean tail"
  - "The system is genuinely healthy and the metrics are wrong"
  - "The test should be run with fewer threads"
  - "The p99 is fine because averages matter more"
  answer: 0
  explanation: |
    A pristine client-side p99 while the server is saturated and queuing is a
    classic coordinated-omission signature: the generator is not offering (or
    not recording) the load that the saturation implies. Trust the server-side
    USE signals and switch to an open model / CO correction.
  ref: "concepts.md#the-coordinated-omission-problem"

- id: performance-testing-018
  difficulty: beginner
  tags: [percentiles, average]
  question: |
    Why is the AVERAGE (mean) response time considered a poor primary metric
    for latency?
  options:
  - "It is too hard to compute"
  - "It cannot be measured by load tools"
  - "Latency distributions are right-skewed, so the mean is pulled by fast samples and hides the slow tail that users actually feel"
  - "It is always larger than the p99"
  answer: 2
  explanation: |
    Latency is right-skewed and often multi-modal. The mean is dominated by
    the many fast requests and obscures the tail — a service can average 80 ms
    yet have a 3 s p99. Report percentiles (p95/p99/p999) instead.
  ref: "concepts.md#latency-percentiles-why-the-average-lies"

- id: performance-testing-019
  difficulty: intermediate
  tags: [percentiles, aggregation]
  question: |
    Your dashboard shows the p99 per minute. Can you average those per-minute
    p99 values to get the p99 over the hour?
  options:
  - "Yes, the average of the p99s equals the hourly p99"
  - "Only if the distribution is normal"
  - "Yes, as long as each minute had the same request count"
  - "No — you cannot average percentiles; you must aggregate the underlying distribution (e.g., merge histograms) to get the true hourly percentile"
  answer: 3
  explanation: |
    Percentiles are not additive: the mean of per-interval p99 values is not
    the p99 over the whole interval. Correct aggregation requires the
    underlying distribution (e.g., merging HdrHistograms), not pre-computed
    percentiles.
  ref: "concepts.md#latency-percentiles-why-the-average-lies"

- id: performance-testing-020
  difficulty: advanced
  tags: [percentiles, tail-amplification, fan-out]
  question: |
    A request fans out to 10 independent backends, each with a 1% chance of a
    slow response. Roughly what fraction of overall requests will be slow
    (assuming any one slow backend makes the whole request slow)?
  options:
  - "About 0.1%"
  - "About 9.6% (1 − 0.99^10)"
  - "About 1%"
  - "About 50%"
  answer: 1
  explanation: |
    Tail amplification: P(overall slow) = 1 − P(none slow) = 1 − 0.99^10 ≈
    9.6%. A backend's p99 becomes a much more frequent problem for a fan-out
    caller — the core insight of "The Tail at Scale."
  ref: "concepts.md#latency-percentiles-why-the-average-lies"

- id: performance-testing-021
  difficulty: intermediate
  tags: [percentiles, slo]
  question: |
    Which set of latency reporting is most useful for an SLO?
  options:
  - "Only the mean"
  - "Only the minimum and maximum"
  - "p50, p95, p99, p99.9 and max"
  - "Only the standard deviation"
  answer: 2
  explanation: |
    Percentiles across the spectrum — p50 (typical), p95, p99, p99.9 (p999)
    and max — describe both the common case and the tail where user pain and
    SLA violations concentrate. The mean alone is optimistic and
    non-actionable.
  ref: "concepts.md#latency-percentiles-why-the-average-lies"

- id: performance-testing-022
  difficulty: intermediate
  tags: [littles-law, formula]
  question: |
    Little's Law states that, for a stable system, the average number of
    requests in the system equals:
  options:
  - "arrival rate (throughput) multiplied by average time in the system (latency): L = λ × W"
  - "throughput divided by latency"
  - "latency minus throughput"
  - "the number of CPUs times the request rate"
  answer: 0
  explanation: |
    Little's Law: L = λ × W, where L is average concurrency (requests in the
    system), λ is arrival/throughput rate, and W is average time in the system
    (latency). It holds for any stable queueing system regardless of the
    distribution.
  ref: "concepts.md#throughput-latency-concurrency--littles-law"

- id: performance-testing-023
  difficulty: intermediate
  tags: [littles-law, calculation]
  question: |
    To sustain 2,000 req/s at an average latency of 100 ms, roughly how many
    requests are in flight concurrently (by Little's Law)?
  options:
  - "20"
  - "20,000"
  - "2,000"
  - "200"
  answer: 3
  explanation: |
    L = λ × W = 2000 req/s × 0.1 s = 200 concurrent requests in flight. This
    is how you derive the concurrency (and VU count, with think time added) a
    test needs, rather than guessing.
  ref: "concepts.md#throughput-latency-concurrency--littles-law"

- id: performance-testing-024
  difficulty: advanced
  tags: [littles-law, saturation, knee]
  question: |
    As you push load past the "knee," throughput plateaus while latency and
    in-flight concurrency keep climbing. By Little's Law, what does this
    indicate?
  options:
  - "The system is scaling perfectly"
  - "You are past saturation — extra load is just queueing (L rises because W rises while λ is capped)"
  - "The load generator is idle"
  - "Latency and throughput are unrelated"
  answer: 1
  explanation: |
    Once a bottleneck caps throughput (λ), added load cannot raise completion
    rate; it piles up in queues, so W (latency) and L (concurrency) climb
    together. That is the signature of running past saturation.
  ref: "concepts.md#throughput-latency-concurrency--littles-law"

- id: performance-testing-025
  difficulty: advanced
  tags: [littles-law, open-closed, vus]
  question: |
    Why are a fixed closed-model VU count and a fixed open-model arrival rate
    NOT interchangeable when latency degrades?
  options:
  - "Because VUs ≈ arrival_rate × (latency + think_time); if latency rises, a fixed VU count produces a lower effective offered rate, silently reducing the load"
  - "They are interchangeable; the tool converts automatically"
  - "Because arrival rate ignores think time entirely"
  - "Because closed models cannot use think time"
  answer: 0
  explanation: |
    By Little's Law, VUs = arrival_rate × (latency + think_time). Fixing VUs
    means that when latency rises, the effective offered rate falls — the
    opposite of what a fixed arrival rate does. This is why open models are
    safer for internet-facing SLO tests.
  ref: "concepts.md#throughput-latency-concurrency--littles-law"

- id: performance-testing-026
  difficulty: beginner
  tags: [think-time, realism]
  question: |
    What is "think time" in a load test?
  options:
  - "The time the load tool spends compiling the script"
  - "The latency added by the network"
  - "The time to warm up the JIT compiler"
  - "A modeled pause between user actions (reading, typing) so each virtual user behaves like a human rather than hammering continuously"
  answer: 3
  explanation: |
    Think time models the pauses real users take between actions, usually a
    randomized delay. Without it, each VU fires far harder than a person, so a
    "100-user" test can generate the load of thousands and misrepresent
    capacity.
  ref: "concepts.md#think-time-pacing--ramp-up"

- id: performance-testing-027
  difficulty: intermediate
  tags: [think-time, capacity-error]
  question: |
    An engineer runs 100 VUs with NO think time and concludes the system
    supports "only 100 users." What is the flaw?
  options:
  - "100 VUs is too few to matter"
  - "Without think time, each VU sends requests continuously, generating far more load than 100 real users would — so capacity is badly understated"
  - "Think time only matters for databases"
  - "There is no flaw; VUs equal users"
  answer: 1
  explanation: |
    Omitting think time turns each VU into a tight request loop that far
    exceeds a real user's request rate. The 100 VUs may equate to thousands of
    real users, so equating VUs with supported users understates capacity.
  ref: "concepts.md#think-time-pacing--ramp-up"

- id: performance-testing-028
  difficulty: intermediate
  tags: [pacing, throughput]
  question: |
    What does "pacing" control in a load test?
  options:
  - "The color of the report graphs"
  - "The number of assertions per request"
  - "The rate of iterations per virtual user (e.g., one checkout per VU per 30s) so throughput matches a target regardless of how fast responses return"
  - "The size of the request payload"
  answer: 2
  explanation: |
    Pacing fixes the iteration rate per VU so throughput stays at a target
    even as response times vary. It moves a closed model closer to a
    fixed-rate profile by decoupling iteration cadence from response speed.
  ref: "concepts.md#think-time-pacing--ramp-up"

- id: performance-testing-029
  difficulty: intermediate
  tags: [ramp-up, warmup]
  question: |
    Why start a steady-state load test with a gradual RAMP-UP rather than full
    load instantly?
  options:
  - "To let pools/JIT/caches/autoscalers warm up (avoiding a false cold-start failure) and to observe the knee where latency begins climbing"
  - "To make the report look nicer"
  - "Because tools cannot start at full load"
  - "To reduce the number of virtual users needed"
  answer: 0
  explanation: |
    Ramp-up warms connection pools, JIT, caches, and autoscalers so the first
    minute is not a false failure, and it lets you see the load level (knee)
    where latency starts degrading instead of overshooting it. Ramp-down helps
    observe recovery.
  ref: "concepts.md#think-time-pacing--ramp-up"

- id: performance-testing-030
  difficulty: advanced
  tags: [ramp-up, spike]
  question: |
    Which performance test type INTENTIONALLY skips ramp-up?
  options:
  - "Load test"
  - "Soak test"
  - "Spike test"
  - "Scalability test"
  answer: 2
  explanation: |
    A spike test deliberately jumps to high load instantly — the sudden surge
    is exactly what is under test (elasticity and recovery). Steady-state load
    tests, by contrast, use ramp-up to avoid cold-start false failures.
  ref: "concepts.md#think-time-pacing--ramp-up"

- id: performance-testing-031
  difficulty: beginner
  tags: [tools, jmeter]
  question: |
    When running an actual load test with Apache JMeter, you should:
  options:
  - "Always use the GUI so you can watch live graphs"
  - "Use a single thread"
  - "Disable all timers"
  - "Run in non-GUI (CLI) mode, because the GUI is for authoring and cannot generate high load without skewing results"
  answer: 3
  explanation: |
    JMeter's GUI is for building and debugging test plans; it cannot generate
    high load and its overhead skews results. Real load runs use non-GUI/CLI
    mode. This is a frequent JMeter gotcha.
  ref: "concepts.md#tools-jmeter-gatling-k6-locust"

- id: performance-testing-032
  difficulty: intermediate
  tags: [tools, gatling, k6, ci]
  question: |
    Why are code-as-test tools like Gatling and k6 often preferred over
    JMeter's XML test plans for CI?
  options:
  - "They generate more load per core in every case"
  - "Their scripts are code — diff-able, reviewable, and version-controlled — which fits CI and code review better than binary/XML plans"
  - "They cannot be run from the command line"
  - "They do not support HTTP"
  answer: 1
  explanation: |
    Gatling (Scala/Java/Kotlin DSL) and k6 (JavaScript) express tests as code
    that lives in version control and is reviewable in a PR. JMeter's .jmx XML
    is harder to diff and review. Both approaches work; the code-as-test
    ergonomics suit CI.
  ref: "concepts.md#tools-jmeter-gatling-k6-locust"

- id: performance-testing-033
  difficulty: intermediate
  tags: [tools, generator-bottleneck]
  question: |
    During a load test, no server-side resource is saturated yet throughput
    plateaus. What should you suspect FIRST?
  options:
  - "The database is definitely the bottleneck"
  - "The SLOs are wrong"
  - "The load generator itself is the bottleneck (CPU/network/connection reuse/ephemeral ports) — you may be measuring the generator, not the system"
  - "The test needs fewer assertions"
  answer: 2
  explanation: |
    If the target shows no saturation but throughput won't rise, the load
    generator is likely the limit (CPU, network, connection reuse, DNS,
    ephemeral port exhaustion). Always monitor the generator and scale it out
    so it has headroom.
  ref: "concepts.md#tools-jmeter-gatling-k6-locust"

- id: performance-testing-034
  difficulty: beginner
  tags: [tools, locust]
  question: |
    Locust is best described as:
  options:
  - "A Python-based load tool where you define user behavior in code, scaled via distributed workers"
  - "A Java GUI tool that uses XML test plans"
  - "A JVM profiler"
  - "A mocking framework"
  answer: 0
  explanation: |
    Locust lets you define user behavior in Python code and scales load using
    distributed workers. It is one of the mainstream load tools alongside
    JMeter, Gatling, and k6.
  ref: "concepts.md#tools-jmeter-gatling-k6-locust"

- id: performance-testing-035
  difficulty: beginner
  tags: [slo, definitions]
  question: |
    Which statement correctly relates SLI, SLO, and SLA?
  options:
  - "SLI is the contract, SLO is the measurement, SLA is the target"
  - "SLA is always stricter than the SLO"
  - "They are three names for the same thing"
  - "SLI is the measured signal (e.g., latency), SLO is the internal target for it, SLA is the contractual promise (usually looser than the SLO)"
  answer: 3
  explanation: |
    The SLI is the indicator you measure (latency, error rate); the SLO is the
    objective/target for that indicator; the SLA is the external contractual
    commitment, typically looser than the internal SLO so you have margin.
  ref: "concepts.md#defining-slos-and-passfail-criteria"

- id: performance-testing-036
  difficulty: intermediate
  tags: [slo, pass-fail]
  question: |
    Which is a well-formed pass/fail criterion for a load test?
  options:
  - "Average latency is low"
  - "p99 latency < 500 ms AND error rate < 0.1% at 1,000 req/s"
  - "The graph looks smooth"
  - "No exceptions in the client console"
  answer: 1
  explanation: |
    A good criterion is percentile- and error-based AND states the load level:
    "p99 < 500 ms and errors < 0.1% at 1,000 req/s." Latency is meaningless
    without the load it is measured at, and you must include error rate.
  ref: "concepts.md#defining-slos-and-passfail-criteria"

- id: performance-testing-037
  difficulty: intermediate
  tags: [slo, error-rate]
  question: |
    Why must a performance pass/fail gate include an error-rate threshold, not
    just a latency threshold?
  options:
  - "A system can hit its latency SLO by shedding load — returning fast 5xx responses — so a latency-only gate would pass a failing system"
  - "Errors never affect latency"
  - "Error rate is easier to measure than latency"
  - "Latency thresholds are optional"
  answer: 0
  explanation: |
    Fast failures are fast. A saturated system can meet a latency SLO by
    quickly returning errors (shedding load). Without an error-rate gate the
    test would pass while the service is actually unavailable, so you must gate
    on both.
  ref: "concepts.md#defining-slos-and-passfail-criteria"

- id: performance-testing-038
  difficulty: advanced
  tags: [slo, k6, thresholds]
  question: |
    In k6, what happens to the process exit status when a configured
    `threshold` (e.g., `http_req_duration: ['p(99)<500']`) is breached?
  options:
  - "Nothing; thresholds are informational only"
  - "k6 lowers the target rate to pass"
  - "k6 retries the whole test"
  - "The k6 process exits non-zero, so CI fails the build automatically"
  answer: 3
  explanation: |
    A breached k6 threshold makes the process exit non-zero, so a pipeline
    step fails automatically — no human needs to read a graph. Encoding
    pass/fail as thresholds (or Gatling assertions) is how perf gates work in
    CI.
  ref: "concepts.md#defining-slos-and-passfail-criteria"

- id: performance-testing-039
  difficulty: intermediate
  tags: [bottleneck, method]
  question: |
    When latency degrades during a load test, the systematic first step in
    bottleneck analysis is to:
  options:
  - "Immediately add more servers"
  - "Correlate the client-side degradation with server-side resource metrics (CPU, GC, thread/connection pools, DB, I/O) at the same timestamp to find what saturates first"
  - "Rewrite the application in another language"
  - "Increase the number of virtual users"
  answer: 1
  explanation: |
    Bottleneck analysis correlates client-side symptoms with server-side
    resource metrics at the same moment; the resource that saturates first
    (hits 100% or its configured limit) is the bottleneck. Guessing or blindly
    adding capacity wastes time.
  ref: "concepts.md#bottleneck-analysis"

- id: performance-testing-040
  difficulty: advanced
  tags: [bottleneck, use-method]
  question: |
    The USE method for resource analysis stands for:
  options:
  - "Uptime, Speed, Errors"
  - "Usage, Scaling, Efficiency"
  - "Utilization, Saturation, Errors"
  - "User, System, Environment"
  answer: 2
  explanation: |
    Brendan Gregg's USE method checks Utilization, Saturation, and Errors for
    each resource. Saturation (queue depth) frequently flags a bottleneck
    before utilization even reaches 100%.
  ref: "concepts.md#bottleneck-analysis"

- id: performance-testing-041
  difficulty: intermediate
  tags: [bottleneck, iterate]
  question: |
    Why should you fix one bottleneck at a time and re-run the test after each
    change?
  options:
  - "Because removing one bottleneck reveals the next; changing several things at once makes it impossible to attribute the improvement"
  - "To make the test take longer"
  - "Because tools only allow one change per run"
  - "Because bottlenecks never move"
  answer: 0
  explanation: |
    Bottlenecks are layered — eliminating the first exposes the next. Fixing
    one variable per iteration and re-running preserves attribution so you know
    which change helped.
  ref: "concepts.md#bottleneck-analysis"

- id: performance-testing-042
  difficulty: intermediate
  tags: [bottleneck, backend]
  question: |
    Which of the following is a common BACKEND bottleneck surfaced by load
    testing?
  options:
  - "A misspelled CSS class"
  - "A missing favicon"
  - "Database connection-pool exhaustion, N+1 queries, thread-pool starvation, or GC pauses"
  - "An incorrect log level"
  answer: 2
  explanation: |
    Typical backend bottlenecks include DB issues (missing index, N+1, lock
    contention, connection-pool exhaustion), thread-pool starvation,
    synchronous blocking calls, and GC pauses. These emerge under concurrent
    load, not in unit tests.
  ref: "concepts.md#bottleneck-analysis"

- id: performance-testing-043
  difficulty: intermediate
  tags: [environment, fidelity]
  question: |
    A load test passes against an empty database but the service is slow in
    production. What environment-fidelity issue is the most likely cause?
  options:
  - "The test used too many virtual users"
  - "The test ran in CI instead of locally"
  - "The SLOs were too strict"
  - "Data volume: queries that are instant on an empty DB do full scans / use different plans at production data scale — you must seed a realistic data set"
  answer: 3
  explanation: |
    Data volume changes query plans and cache behavior. An empty or tiny
    database produces latency numbers that are fiction at production scale.
    Seeding a realistic data set (volume testing) is essential to fidelity.
  ref: "concepts.md#test-environment-fidelity"

- id: performance-testing-044
  difficulty: advanced
  tags: [environment, scaling-down]
  question: |
    If you must run the perf test on a smaller-than-prod environment, what is
    the correct expectation?
  options:
  - "Just multiply the results by the size ratio to get prod numbers"
  - "Keep resource ratios consistent and treat results as directional, not absolute — non-linearities (GC, cache hit rates, DB plans) prevent simple extrapolation"
  - "Results transfer exactly regardless of size"
  - "Smaller environments always give worse numbers, so add a fixed 20%"
  answer: 1
  explanation: |
    You cannot linearly extrapolate from a scaled-down environment because GC,
    cache hit rates, and DB query plans behave non-linearly with size. Keep
    ratios consistent and treat the results as directional, stating that
    limitation explicitly.
  ref: "concepts.md#test-environment-fidelity"

- id: performance-testing-045
  difficulty: intermediate
  tags: [environment, variance]
  question: |
    Why is running a performance test on a shared/noisy CI runner problematic?
  options:
  - "It is impossible to run tests there"
  - "Shared runners cannot execute HTTP requests"
  - "Co-located jobs, other tenants, and throttling add variance, so runs are not comparable and the gate becomes flaky"
  - "It always makes the system look faster"
  answer: 2
  explanation: |
    Noisy neighbors and throttling on shared infrastructure inject variance
    that makes results non-reproducible and perf gates flaky. Isolate the perf
    environment and pin/record versions so runs are comparable.
  ref: "concepts.md#test-environment-fidelity"

- id: performance-testing-046
  difficulty: intermediate
  tags: [ci, tiers]
  question: |
    What is a sound strategy for including performance tests in CI?
  options:
  - "Split into a short 'perf smoke' with tight thresholds on every merge (regression gate) plus a full load/stress/soak suite nightly or pre-release against a prod-like environment"
  - "Run a full 24-hour soak on every pull request"
  - "Never run performance tests automatically"
  - "Only run performance tests manually in production"
  answer: 0
  explanation: |
    Two tiers: a fast, small perf smoke gates every merge with tight
    thresholds; the heavy load/stress/soak suite runs on a schedule or
    pre-release against a prod-like environment. You cannot afford a full-scale
    run per PR, and you never gate a merge on a flaky full run.
  ref: "concepts.md#performance-testing-in-ci"

- id: performance-testing-047
  difficulty: advanced
  tags: [ci, baseline, regression]
  question: |
    Why add a baseline comparison to CI perf tests when you already have
    absolute SLO thresholds?
  options:
  - "Baselines replace thresholds entirely"
  - "Baselines are only for functional tests"
  - "Baselines make the test run faster"
  - "Absolute thresholds catch cliffs, but baseline comparison catches slow creep (e.g., 'p99 grew 20% vs last release') before it crosses the SLO"
  answer: 3
  explanation: |
    Absolute thresholds fire only when you breach the SLO — too late for
    gradual regressions. Comparing each run to a stored baseline flags a slow
    creep (a 20% p99 increase) while you still have headroom, complementing the
    hard threshold gate.
  ref: "concepts.md#performance-testing-in-ci"

- id: performance-testing-048
  difficulty: intermediate
  tags: [ci, microbenchmark, jmh]
  question: |
    How do JMH-style microbenchmarks differ from load tests in a CI strategy?
  options:
  - "They are the same thing"
  - "Microbenchmarks answer 'is this function faster?' (with warmup/forks to defeat JIT effects); load tests answer 'does the service meet its SLO under traffic?' — keep them separate"
  - "Microbenchmarks always run longer than load tests"
  - "Load tests measure single-method throughput"
  answer: 1
  explanation: |
    JMH microbenchmarks measure the performance of a small unit of code, using
    warmup, forks, and dead-code-elimination guards to avoid JIT-driven
    illusions. Load tests measure service-level SLO compliance under
    concurrent traffic. They answer different questions and should not be
    conflated.
  ref: "concepts.md#performance-testing-in-ci"
