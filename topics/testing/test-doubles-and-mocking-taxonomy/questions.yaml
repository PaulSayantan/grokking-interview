topic: "Test Doubles & the Mocking Taxonomy"
domain: testing
topic_slug: test-doubles-and-mocking-taxonomy
version: 1
questions:
  - id: test-doubles-and-mocking-taxonomy-001
    difficulty: beginner
    tags: [taxonomy, definition]
    question: |
      What is a "test double"?
    options:
      - "A test that runs twice to catch flakiness"
      - "A duplicated test kept for redundancy"
      - "A test that asserts two things at once"
      - "Any object substituted for a real collaborator in a test"
    answer: 3
    explanation: |
      Gerard Meszaros coined "test double" (a nod to a stunt double) as the umbrella term
      for any object you put in place of a real collaborator during a test — dummies, stubs,
      fakes, spies, and mocks are all test doubles.
    ref: "concepts.md#the-test-double-taxonomy-dummy-stub-spy-mock-fake"

  - id: test-doubles-and-mocking-taxonomy-002
    difficulty: beginner
    tags: [taxonomy, meszaros, fowler]
    question: |
      Which five categories make up the Meszaros/Fowler test-double taxonomy?
    options:
      - "Unit, integration, system, smoke, regression"
      - "Given, when, then, setup, teardown"
      - "Mock, partial mock, deep mock, spy, shim"
      - "Dummy, stub, spy, mock, fake"
    answer: 3
    explanation: |
      The canonical taxonomy from Meszaros's xUnit Test Patterns, popularized by Fowler, is
      dummy, stub, fake, spy, and mock. The other lists describe test levels or BDD phases,
      not doubles.
    ref: "concepts.md#the-test-double-taxonomy-dummy-stub-spy-mock-fake"

  - id: test-doubles-and-mocking-taxonomy-003
    difficulty: beginner
    tags: [dummy]
    question: |
      What is the defining characteristic of a dummy object?
    options:
      - "It is passed to satisfy a signature but is never actually used"
      - "It records every call for later assertion"
      - "It has a full working implementation"
      - "It has pre-set expectations that are verified after the test"
    answer: 0
    explanation: |
      A dummy exists only to fill a parameter list or constructor so the code compiles and
      runs; its methods are never meaningfully invoked. If you start stubbing it, it has
      become a stub.
    ref: "concepts.md#dummy-objects"

  - id: test-doubles-and-mocking-taxonomy-004
    difficulty: beginner
    tags: [stub, definition]
    question: |
      A stub's primary job is to:
    options:
      - "Assert that the SUT called it in a specific order"
      - "Persist data across multiple test methods"
      - "Provide canned answers to calls the SUT makes during the test"
      - "Measure how long a method takes to run"
    answer: 2
    explanation: |
      A stub supplies hard-coded (canned) responses so the system under test can run,
      feeding it indirect inputs. You then assert on the SUT's output/state, not on the stub.
    ref: "concepts.md#stubs-canned-answers-for-indirect-inputs"

  - id: test-doubles-and-mocking-taxonomy-005
    difficulty: intermediate
    tags: [mock-vs-stub, verification]
    question: |
      What most fundamentally distinguishes a mock from a stub?
    options:
      - "A mock carries expectations and is verified on interactions; a stub just returns canned data checked via state"
      - "A mock is faster because it uses bytecode generation"
      - "A stub can only be created by a framework, a mock by hand"
      - "A stub can throw exceptions but a mock cannot"
    answer: 0
    explanation: |
      Per Fowler's Mocks Aren't Stubs: stubs use state verification (you assert on the
      result), while mocks use behavior verification (you assert on how the SUT called them).
      Only the mock encodes expectations about the interaction.
    ref: "concepts.md#mocks-arent-stubs-fowlers-distinction"

  - id: test-doubles-and-mocking-taxonomy-006
    difficulty: beginner
    tags: [fake, definition]
    question: |
      Which description best fits a fake?
    options:
      - "An object that throws on every method to force error paths"
      - "An object that only records interactions"
      - "A parameter placeholder never actually used"
      - "A working implementation that takes a shortcut making it unfit for production"
    answer: 3
    explanation: |
      A fake has real, working behavior but with a production-unfit shortcut — the classic
      example being an in-memory database or repository. Unlike a stub, a fake contains
      actual logic (save then retrieve works).
    ref: "concepts.md#fakes-lightweight-working-implementations"

  - id: test-doubles-and-mocking-taxonomy-007
    difficulty: beginner
    tags: [spy, definition]
    question: |
      In Meszaros's taxonomy, a spy is essentially:
    options:
      - "A dummy that never runs"
      - "A mock with no expectations"
      - "A stub that also records information about how it was called"
      - "A fake backed by a real database"
    answer: 2
    explanation: |
      A spy is a stub that additionally records how it was called (e.g. how many emails it
      was asked to send), so the test can assert on those recorded interactions afterward.
    ref: "concepts.md#spies-stubs-that-record-how-they-were-called"

  - id: test-doubles-and-mocking-taxonomy-008
    difficulty: intermediate
    tags: [mock, expectations, behavior-verification]
    question: |
      What makes an object a "mock" specifically?
    options:
      - "It stores data in memory between calls"
      - "It returns null for every method"
      - "It is only used in integration tests"
      - "It is pre-programmed with expectations forming a spec of the calls it should receive, verified afterward"
    answer: 3
    explanation: |
      A mock is set up with expectations about which calls it should receive; the test then
      verifies those interactions happened. This is behavior/interaction verification, the
      defining trait of a mock.
    ref: "concepts.md#mocks-pre-set-expectations-verified-after-the-fact"

  - id: test-doubles-and-mocking-taxonomy-009
    difficulty: intermediate
    tags: [state-verification, behavior-verification]
    question: |
      State verification means the test:
    options:
      - "Checks which methods the SUT called on its collaborators"
      - "Counts the number of interactions with a mock"
      - "Exercises the SUT and then asserts on the resulting return value or observable state"
      - "Verifies the order of collaborator calls"
    answer: 2
    explanation: |
      State verification asserts on the outcome — the SUT's return value or observable state
      (possibly via a fake). It does not care how collaborators were called; that would be
      behavior verification.
    ref: "concepts.md#state-verification-vs-behavior-verification"

  - id: test-doubles-and-mocking-taxonomy-010
    difficulty: intermediate
    tags: [behavior-verification, interaction-testing]
    question: |
      Behavior (interaction) verification is most appropriate when:
    options:
      - "The operation returns a value you can assert on directly"
      - "You are testing a pure function"
      - "The SUT performs a side-effecting command with no observable return, e.g. sending an event"
      - "You want the test to survive any internal refactor"
    answer: 2
    explanation: |
      When a collaborator call is a fire-and-forget command (publish an event, send email)
      with no state to observe, verifying the interaction on a mock is the natural approach.
      For queries returning values, prefer state verification.
    ref: "concepts.md#state-verification-vs-behavior-verification"

  - id: test-doubles-and-mocking-taxonomy-011
    difficulty: intermediate
    tags: [scenario, mock-vs-stub]
    question: |
      A test stubs `when(rateService.usdToEur()).thenReturn(0.9)`, calls
      `converter.convert(usd(100))`, then asserts the result equals `eur(90)`. What role does
      `rateService` play?
    options:
      - "A mock, because it is verified"
      - "A dummy, because it is never used"
      - "A fake, because it has a working implementation"
      - "A stub, because it supplies a canned answer and the test asserts on the result"
    answer: 3
    explanation: |
      The double supplies a canned rate and the test asserts on the SUT's output — classic
      state verification with a stub. There is no verify(...) on the double, so it is not
      acting as a mock.
    ref: "concepts.md#stubs-canned-answers-for-indirect-inputs"

  - id: test-doubles-and-mocking-taxonomy-012
    difficulty: intermediate
    tags: [scenario, mock]
    question: |
      A test does `service.deactivate(user)` then `verify(notifier).sendGoodbye(user.email())`
      with no assertion on any return value. What role does `notifier` play?
    options:
      - "A mock (behavior verification of an interaction)"
      - "A stub"
      - "A dummy"
      - "A fake"
    answer: 0
    explanation: |
      The test asserts on the interaction (that sendGoodbye was called with the right
      argument), not on returned state. That is behavior verification, so notifier is being
      used as a mock.
    ref: "concepts.md#mocks-pre-set-expectations-verified-after-the-fact"

  - id: test-doubles-and-mocking-taxonomy-013
    difficulty: intermediate
    tags: [scenario, which-double]
    question: |
      You need many tests that save orders and later read them back with realistic
      round-trip behavior, without stubbing every call. Which double fits best?
    options:
      - "A dummy"
      - "A mock with verify() on every method"
      - "A pure stub returning a fixed order"
      - "A fake (e.g. an in-memory repository)"
    answer: 3
    explanation: |
      When tests need working round-trip behavior across many calls, a fake (in-memory
      repository) is ideal — stubbing each interaction would be tedious and brittle, and a
      dummy/pure stub cannot provide real save/retrieve semantics.
    ref: "concepts.md#fakes-lightweight-working-implementations"

  - id: test-doubles-and-mocking-taxonomy-014
    difficulty: intermediate
    tags: [dummy, mockito, null]
    question: |
      Why is passing a `mock(AuditLog.class)` (never stubbed or verified) often a safer dummy
      than passing `null`?
    options:
      - "Mocks run faster than null checks"
      - "null cannot be passed to a constructor in Java"
      - "If the code unexpectedly calls it, the mock returns benign defaults instead of throwing an NPE"
      - "The mock will automatically fail the test if used"
    answer: 2
    explanation: |
      An unstubbed Mockito mock returns benign defaults (null, 0, false, empty collections)
      for any call, so an unexpected invocation won't blow up with an NPE the way a null
      reference would — making it a more forgiving dummy.
    ref: "concepts.md#dummy-objects"

  - id: test-doubles-and-mocking-taxonomy-015
    difficulty: intermediate
    tags: [stub, error-injection]
    question: |
      How can a stub help you test the SUT's error-handling path?
    options:
      - "By recording how many times an exception was caught"
      - "By slowing down the real dependency until it fails"
      - "By being configured to throw an exception (e.g. thenThrow) when called"
      - "Stubs cannot simulate failures"
    answer: 2
    explanation: |
      A stub can be configured to throw (when(repo.find(any())).thenThrow(...)), letting you
      exercise the SUT's failure handling without needing the real dependency to actually
      fail.
    ref: "concepts.md#stubs-canned-answers-for-indirect-inputs"

  - id: test-doubles-and-mocking-taxonomy-016
    difficulty: advanced
    tags: [mockito-spy, gotcha, doReturn]
    question: |
      With a Mockito spy over an empty ArrayList, why does
      `when(spy.get(0)).thenReturn("x")` throw `IndexOutOfBoundsException`?
    options:
      - "Because spies cannot be stubbed at all"
      - "Because get(0) is a final method"
      - "Because when(...) evaluates spy.get(0), which invokes the REAL get on an empty list"
      - "Because the spy has strict stubbing enabled"
    answer: 2
    explanation: |
      The when(x.foo()) form actually calls x.foo() during setup. On a spy that runs the real
      method, so get(0) on an empty list throws. Use doReturn("x").when(spy).get(0), which
      does not invoke the real method.
    ref: "concepts.md#spies-stubs-that-record-how-they-were-called"

  - id: test-doubles-and-mocking-taxonomy-017
    difficulty: intermediate
    tags: [mockito-spy, partial-mock]
    question: |
      A Mockito `spy(realObject)` is best described as a:
    options:
      - "Full mock where all methods return defaults"
      - "Dummy that is never used"
      - "Fake backed by an in-memory store"
      - "Partial mock that runs real methods by default but lets you stub and verify selected ones"
    answer: 3
    explanation: |
      A Mockito spy wraps a real object: real methods run unless you stub them, and calls can
      be verified. That partial-mock behavior is different from a plain mock, whose methods
      all return defaults until stubbed.
    ref: "concepts.md#spies-stubs-that-record-how-they-were-called"

  - id: test-doubles-and-mocking-taxonomy-018
    difficulty: intermediate
    tags: [cqs, verification-choice]
    question: |
      Using Command-Query Separation as a lens, which verification style suits a *query*
      method that returns a value?
    options:
      - "Behavior verification with a strict mock"
      - "verifyNoMoreInteractions on all collaborators"
      - "State verification on the returned value"
      - "No verification is needed for queries"
    answer: 2
    explanation: |
      Queries return values, so assert on the returned state (state verification). Reserve
      behavior verification for side-effecting commands with no observable return; asserting
      interactions on a query over-specifies the test.
    ref: "concepts.md#state-verification-vs-behavior-verification"

  - id: test-doubles-and-mocking-taxonomy-019
    difficulty: intermediate
    tags: [fowler, mocks-arent-stubs]
    question: |
      In "Mocks Aren't Stubs," Fowler ties the two double families to verification styles as:
    options:
      - "Stubs → behavior verification; mocks → state verification"
      - "Both use state verification"
      - "Both use behavior verification"
      - "Stubs → state verification; mocks → behavior verification"
    answer: 3
    explanation: |
      Fowler's core distinction: stubs use state verification (assert the result), mocks use
      behavior verification (assert the interaction). The choice determines what the test is
      actually checking.
    ref: "concepts.md#mocks-arent-stubs-fowlers-distinction"

  - id: test-doubles-and-mocking-taxonomy-020
    difficulty: intermediate
    tags: [classical-tdd, mockist-tdd]
    question: |
      Which statement correctly contrasts classical (Detroit) and mockist (London) TDD?
    options:
      - "Classical mocks every collaborator; mockist uses real objects everywhere"
      - "Both schools forbid the use of stubs"
      - "Classical favors real objects and state verification; mockist mocks collaborators and favors behavior verification"
      - "Mockist TDD does not use dependency injection"
    answer: 2
    explanation: |
      Classicists use real objects where practical and verify state, faking only awkward
      collaborators. Mockists (London school, GOOS) mock a class's collaborators and verify
      interactions, driving out the roles/protocols between objects.
    ref: "concepts.md#classical-detroit-vs-mockist-london-tdd"

  - id: test-doubles-and-mocking-taxonomy-021
    difficulty: advanced
    tags: [mockist-tdd, refactoring]
    question: |
      A frequently cited downside of the mockist/London style is that its tests:
    options:
      - "Run more slowly than classical tests"
      - "Cannot pinpoint which class failed"
      - "Are more coupled to implementation, so behavior-preserving refactors can still break them"
      - "Require a real database"
    answer: 2
    explanation: |
      Because mockist tests encode the SUT's call structure to its collaborators, an internal
      refactor that preserves behavior can still break them. The upside is precise failure
      localization; classical tests survive refactoring better but a bug can cascade.
    ref: "concepts.md#classical-detroit-vs-mockist-london-tdd"

  - id: test-doubles-and-mocking-taxonomy-022
    difficulty: intermediate
    tags: [goos, mockist]
    question: |
      Which book is most associated with the London/mockist school of using mocks to discover
      object roles?
    options:
      - "Working Effectively with Legacy Code"
      - "Refactoring"
      - "The Pragmatic Programmer"
      - "Growing Object-Oriented Software, Guided by Tests (GOOS)"
    answer: 3
    explanation: |
      Freeman & Pryce's GOOS uses mocks in an outside-in style to drive out the interfaces
      (roles/protocols) between collaborating objects — the hallmark of mockist TDD.
    ref: "concepts.md#classical-detroit-vs-mockist-london-tdd"

  - id: test-doubles-and-mocking-taxonomy-023
    difficulty: intermediate
    tags: [over-mocking, anti-pattern]
    question: |
      Which is a symptom of the over-mocking anti-pattern?
    options:
      - "Tests that pass even when the feature is broken because every collaborator was faked"
      - "Tests that are slower than integration tests"
      - "Tests that never use assertions"
      - "Tests that share a single fixture"
    answer: 0
    explanation: |
      Over-mocking replaces so much that the test verifies internal choreography rather than
      real behavior — so it can pass even when the feature is broken. Other symptoms: breaking
      on every refactor and setup longer than the assertions.
    ref: "concepts.md#over-mocking-and-mocking-types-you-dont-own"

  - id: test-doubles-and-mocking-taxonomy-024
    difficulty: intermediate
    tags: [dont-mock-what-you-dont-own]
    question: |
      Why does the guideline "don't mock types you don't own" exist?
    options:
      - "Third-party classes are always final and cannot be mocked"
      - "It is illegal to mock closed-source code"
      - "Mocking a library encodes your assumptions about its contract, so upgrades or wrong assumptions give false passes"
      - "Mocks of external types are slower"
    answer: 2
    explanation: |
      Mocking a third-party/JDK type bakes your assumptions about its behavior into the test.
      If the library really behaves differently — or changes on upgrade — your mock still
      passes, giving false confidence. Wrap it behind an owned adapter instead.
    ref: "concepts.md#over-mocking-and-mocking-types-you-dont-own"

  - id: test-doubles-and-mocking-taxonomy-025
    difficulty: advanced
    tags: [adapter, boundary, scenario]
    question: |
      Your service calls an AWS SDK client directly and the unit tests mock that SDK client.
      What is the recommended refactor?
    options:
      - "Mock the SDK's internal HTTP layer instead"
      - "Delete the unit tests and rely only on production monitoring"
      - "Use a deep mock (RETURNS_DEEP_STUBS) on the SDK client"
      - "Wrap the SDK behind a thin adapter interface you own, mock the adapter in unit tests, and integration-test the adapter against the real service"
    answer: 3
    explanation: |
      Since you don't own the SDK, introduce an adapter you do own, mock that in unit tests,
      and cover the adapter itself with an integration test (Testcontainers/WireMock) against
      the real behavior. Deep mocks and mocking internals just entrench the coupling.
    ref: "concepts.md#over-mocking-and-mocking-types-you-dont-own"

  - id: test-doubles-and-mocking-taxonomy-026
    difficulty: intermediate
    tags: [value-objects, guideline]
    question: |
      Should you mock a value object such as `Money` or `LocalDate`?
    options:
      - "Yes, always mock value objects for isolation"
      - "Only if they are immutable"
      - "No — just construct real instances; value objects have no behavior worth faking"
      - "Only when they implement an interface"
    answer: 2
    explanation: |
      Value objects are simple data holders; mocking them adds noise and can even hide bugs.
      Construct real instances instead. "Don't mock value objects" is a standard Mockito
      guideline alongside "don't mock types you don't own."
    ref: "concepts.md#over-mocking-and-mocking-types-you-dont-own"

  - id: test-doubles-and-mocking-taxonomy-027
    difficulty: advanced
    tags: [test-induced-design-damage]
    question: |
      "Test-induced design damage" (DHH) refers to:
    options:
      - "Tests that damage production data when run against prod"
      - "Flaky tests that fail intermittently"
      - "Distorting production design (needless interfaces, indirection) purely to make code mockable"
      - "Tests deleted to speed up the build"
    answer: 2
    explanation: |
      DHH's term describes harmful design changes made only to satisfy isolated, mock-friendly
      testing — single-implementation interfaces, excessive indirection, DI ceremony — where
      the abstraction has no value beyond testability.
    ref: "concepts.md#test-induced-design-damage"

  - id: test-doubles-and-mocking-taxonomy-028
    difficulty: advanced
    tags: [test-induced-design-damage, nuance]
    question: |
      What is the balanced ("senior") view of testing pressure on design?
    options:
      - "All design change driven by testing is damage and should be avoided"
      - "You should always add an interface for every class to enable mocking"
      - "Some pressure is healthy (surfaces coupling); damage is adding abstraction with no value beyond testability"
      - "Design should never be influenced by tests"
    answer: 2
    explanation: |
      Testing pressure can improve design by exposing hidden dependencies ("listen to your
      tests"). The damage is only when you add indirection whose sole purpose is mockability.
      Testing at a slightly coarser grain reduces the need for a seam at every edge.
    ref: "concepts.md#test-induced-design-damage"

  - id: test-doubles-and-mocking-taxonomy-029
    difficulty: intermediate
    tags: [seams, feathers]
    question: |
      In Michael Feathers's terminology, a "seam" is:
    options:
      - "A boundary between two microservices"
      - "A shared test fixture"
      - "A place where you can alter a program's behavior without editing in that place"
      - "A gap in code coverage"
    answer: 2
    explanation: |
      Feathers (Working Effectively with Legacy Code) defines a seam as a place where you can
      change behavior without editing there — exactly what lets you insert a test double
      (e.g. via injecting a collaborator).
    ref: "concepts.md#seams-and-dependency-injection-for-testability"

  - id: test-doubles-and-mocking-taxonomy-030
    difficulty: intermediate
    tags: [dependency-injection, seams]
    question: |
      Which is the cleanest seam for substituting a collaborator with a test double?
    options:
      - "Calling static factory methods inside the SUT"
      - "Using a global singleton registry"
      - "Instantiating the collaborator with new inside a method"
      - "Constructor dependency injection of the collaborator"
    answer: 3
    explanation: |
      Constructor injection lets a test pass doubles instead of real collaborators — the
      cleanest seam. new-ing dependencies, statics, and singletons provide no seam and make
      the code hard to test.
    ref: "concepts.md#seams-and-dependency-injection-for-testability"

  - id: test-doubles-and-mocking-taxonomy-031
    difficulty: advanced
    tags: [clock, time, seams, scenario]
    question: |
      A method calls `Instant.now()` inline and its behavior depends on the current time,
      making it hard to test deterministically. The best fix is to:
    options:
      - "Use Thread.sleep in the test to align the clock"
      - "Add a random seed to the system clock"
      - "Retry the test until it passes"
      - "Inject a java.time.Clock and use Clock.fixed(...) in tests"
    answer: 3
    explanation: |
      Injecting a Clock creates a seam for time: production uses Clock.systemUTC(), tests pass
      Clock.fixed(instant, zone) for deterministic results. Calling Instant.now() inline
      leaves no seam and makes time-dependent behavior untestable.
    ref: "concepts.md#seams-and-dependency-injection-for-testability"

  - id: test-doubles-and-mocking-taxonomy-032
    difficulty: intermediate
    tags: [mockito, strict-stubs, unnecessary-stubbing]
    question: |
      Under Mockito's default `STRICT_STUBS` mode (via `MockitoExtension`), what happens if a
      test sets up `when(repo.find("a")).thenReturn(x)` but the SUT never calls `find`?
    options:
      - "The stub is silently ignored"
      - "The test fails, reporting unnecessary (unused) stubbing"
      - "Mockito automatically calls find for you"
      - "A warning is logged but the test passes"
    answer: 1
    explanation: |
      STRICT_STUBS fails the test on unnecessary stubbing, because an unused when(...) usually
      signals a copy-paste error or a misunderstanding of what the SUT actually calls. This is
      the default with MockitoExtension in JUnit 5.
    ref: "concepts.md#mockito-strictness-and-common-pitfalls"

  - id: test-doubles-and-mocking-taxonomy-033
    difficulty: advanced
    tags: [mockito, when-vs-doReturn]
    question: |
      When should you prefer `doReturn(v).when(mock).method()` over
      `when(mock.method()).thenReturn(v)`?
    options:
      - "When stubbing spies/partial mocks or void methods, to avoid invoking the real method"
      - "Never — the two forms are always interchangeable"
      - "Only when the return type is a primitive"
      - "Only when strict stubbing is disabled"
    answer: 0
    explanation: |
      The when(x.foo()) form evaluates x.foo() during setup, which runs the real method on a
      spy/partial mock. The doReturn(...).when(x).foo() form does not invoke the real method,
      making it the right choice for spies and for stubbing void methods.
    ref: "concepts.md#mockito-strictness-and-common-pitfalls"

  - id: test-doubles-and-mocking-taxonomy-034
    difficulty: intermediate
    tags: [mockito, injectmocks]
    question: |
      What does Mockito's `@InjectMocks` do?
    options:
      - "Instantiates the annotated object and injects matching @Mock/@Spy fields into it"
      - "Creates a mock of the annotated field"
      - "Verifies all mocks after the test"
      - "Resets all mocks between tests"
    answer: 0
    explanation: |
      @InjectMocks creates the SUT and injects the declared @Mock/@Spy fields (by constructor,
      setter, or field). It is best-effort: if it can't match a dependency it silently leaves
      it null, which can surface later as an NPE.
    ref: "concepts.md#mockito-strictness-and-common-pitfalls"

  - id: test-doubles-and-mocking-taxonomy-035
    difficulty: advanced
    tags: [mockito, argument-matchers, gotcha]
    question: |
      In Mockito, `when(service.charge(anyLong(), "USD")).thenReturn(ok)` throws an
      `InvalidUseOfMatchersException`. Why?
    options:
      - "USD is not a valid currency code"
      - "If any argument uses a matcher, ALL arguments must use matchers (use eq(\"USD\"))"
      - "charge cannot be stubbed because it is final"
      - "anyLong() is deprecated in Mockito 5"
    answer: 1
    explanation: |
      Mockito requires argument matchers to be all-or-nothing per call. Mixing a matcher
      (anyLong()) with a raw value ("USD") is illegal; wrap the raw value as eq("USD") so both
      arguments are matchers.
    ref: "concepts.md#mockito-strictness-and-common-pitfalls"

  - id: test-doubles-and-mocking-taxonomy-036
    difficulty: intermediate
    tags: [mockito, verify, times]
    question: |
      Which Mockito call asserts that `mailer.send(msg)` was invoked exactly twice?
    options:
      - "verify(mailer, times(2)).send(msg)"
      - "verify(mailer).send(msg)"
      - "verify(mailer, atLeastOnce()).send(msg)"
      - "verifyNoInteractions(mailer)"
    answer: 0
    explanation: |
      verify(mailer, times(2)).send(msg) asserts exactly two invocations. Plain verify()
      defaults to times(1); atLeastOnce() allows one or more; verifyNoInteractions asserts
      zero.
    ref: "concepts.md#mockito-strictness-and-common-pitfalls"

  - id: test-doubles-and-mocking-taxonomy-037
    difficulty: advanced
    tags: [scenario, over-mocking, brittle-tests]
    question: |
      A team complains their unit tests break on nearly every refactor even when behavior is
      unchanged. The most likely cause and fix is:
    options:
      - "Too few assertions; add more verify() calls"
      - "Over-mocking / behavior verification of internals — move toward state verification and mock only at true boundaries"
      - "The tests need a real database; add Testcontainers everywhere"
      - "Strict stubbing is enabled; disable it"
    answer: 1
    explanation: |
      Brittle-on-refactor tests usually over-specify internal interactions. Shifting to state
      verification and mocking only at genuine boundaries (I/O, external services) makes tests
      track behavior (the "what") rather than implementation (the "how").
    ref: "concepts.md#over-mocking-and-mocking-types-you-dont-own"

  - id: test-doubles-and-mocking-taxonomy-038
    difficulty: intermediate
    tags: [scenario, which-double, dummy]
    question: |
      A constructor requires a `MetricsClient`, but the code path under test never records
      metrics. What is the most appropriate double, and how should it be treated?
    options:
      - "A mock, verified with verifyNoInteractions afterward"
      - "A dummy — passed to satisfy the constructor and neither stubbed nor verified"
      - "A fake with an in-memory metrics buffer"
      - "A spy recording all metric calls"
    answer: 1
    explanation: |
      Since the collaborator plays no role on this path, a dummy documents its irrelevance —
      passed in but not stubbed or verified. Adding stubbing or verification would imply it
      matters, which it doesn't here.
    ref: "concepts.md#dummy-objects"

  - id: test-doubles-and-mocking-taxonomy-039
    difficulty: advanced
    tags: [fake, fidelity, testcontainers]
    question: |
      What is the main risk of relying on a hand-written in-memory fake for a repository?
    options:
      - "It is always slower than the real database"
      - "It can silently drift from real semantics (constraints, isolation, SQL quirks), giving misleading confidence"
      - "It cannot be used in JUnit 5"
      - "Fakes are forbidden by the test pyramid"
    answer: 1
    explanation: |
      A fake is code you maintain, and an in-memory map won't reproduce unique constraints,
      transaction isolation, or SQL behavior — so tests can pass while the real DB would fail.
      When fidelity matters, Testcontainers with a real engine is preferable.
    ref: "concepts.md#fakes-lightweight-working-implementations"

  - id: test-doubles-and-mocking-taxonomy-040
    difficulty: beginner
    tags: [terminology, mock]
    question: |
      A colleague says "just mock the repository" but means "return a canned list from it and
      assert on the service output." Strictly speaking, they are describing a:
    options:
      - "Mock"
      - "Stub"
      - "Dummy"
      - "Spy"
    answer: 1
    explanation: |
      Returning canned data and asserting on the SUT's result is state verification with a
      stub. Colloquially people say "mock" for any double, but precisely this is a stub — only
      interaction verification would make it a mock.
    ref: "concepts.md#the-test-double-taxonomy-dummy-stub-spy-mock-fake"

  - id: test-doubles-and-mocking-taxonomy-041
    difficulty: intermediate
    tags: [mockito, verifyNoMoreInteractions, brittle]
    question: |
      Why can heavy use of `verifyNoMoreInteractions(mock)` make tests brittle?
    options:
      - "It disables strict stubbing"
      - "It asserts that no other calls happened, so any harmless added interaction breaks the test"
      - "It only works on spies"
      - "It slows the test suite significantly"
    answer: 1
    explanation: |
      verifyNoMoreInteractions locks down the exact set of calls; adding an innocuous new
      interaction later fails the test even if behavior is fine. Use it sparingly — it
      couples the test tightly to the SUT's call structure.
    ref: "concepts.md#mockito-strictness-and-common-pitfalls"

  - id: test-doubles-and-mocking-taxonomy-042
    difficulty: intermediate
    tags: [indirect-inputs, stub]
    question: |
      "Indirect inputs" to the SUT are:
    options:
      - "Values the SUT obtains from a collaborator, which a stub can control"
      - "Arguments passed directly to the SUT's method"
      - "Environment variables read at startup"
      - "The SUT's return value"
    answer: 0
    explanation: |
      Indirect inputs are data the SUT pulls from its collaborators (rather than receiving as
      direct arguments). Stubs feed these indirect inputs so the SUT can execute a given path.
    ref: "concepts.md#stubs-canned-answers-for-indirect-inputs"

  - id: test-doubles-and-mocking-taxonomy-043
    difficulty: advanced
    tags: [mockito, final, inline-mock-maker]
    question: |
      Regarding mocking final classes/methods with modern Mockito (5.x):
    options:
      - "It is impossible; final types can never be mocked"
      - "The inline mock maker (default in Mockito 5) can mock finals, though mocking types you don't own is still discouraged"
      - "You must use PowerMock for any final method"
      - "Final methods are mocked automatically with no configuration in every Mockito version"
    answer: 1
    explanation: |
      Mockito's inline mock maker (default since Mockito 5) can mock final classes and
      methods. That capability doesn't override design guidance: mocking statics/finals of
      types you don't own is still a smell.
    ref: "concepts.md#mockito-strictness-and-common-pitfalls"

  - id: test-doubles-and-mocking-taxonomy-044
    difficulty: intermediate
    tags: [spy, two-meanings]
    question: |
      Which statement about the word "spy" is accurate?
    options:
      - "Meszaros's spy and Mockito's spy() are exactly the same concept"
      - "Meszaros's spy is a recording double; Mockito's spy() is a partial mock wrapping a real object"
      - "A spy can never be verified"
      - "A spy always uses an in-memory database"
    answer: 1
    explanation: |
      The term is overloaded. Meszaros's test-double spy records calls for later assertion,
      while Mockito's spy() creates a partial mock that runs real methods by default but can
      be stubbed and verified.
    ref: "concepts.md#spies-stubs-that-record-how-they-were-called"

  - id: test-doubles-and-mocking-taxonomy-045
    difficulty: beginner
    tags: [state-vs-behavior, summary]
    question: |
      Which pairing is correct?
    options:
      - "Stub/Fake → behavior verification; Mock/Spy → state verification"
      - "Stub/Fake → state verification; Mock/Spy → behavior verification"
      - "All doubles → state verification"
      - "All doubles → behavior verification"
    answer: 1
    explanation: |
      Stubs and fakes support state verification (you check the SUT's result/state). Mocks
      and spies support behavior/interaction verification (you check how collaborators were
      called).
    ref: "concepts.md#state-verification-vs-behavior-verification"

  - id: test-doubles-and-mocking-taxonomy-046
    difficulty: advanced
    tags: [scenario, spring-boundary]
    question: |
      For a pure unit test of a service class in a Spring app, the recommended approach to
      supplying collaborators is to:
    options:
      - "Always start the full Spring context with @SpringBootTest"
      - "Inject test doubles directly (e.g. via constructor), bypassing the container; use Spring slice tests only when the framework is what you're testing"
      - "Use @MockBean for every collaborator in every test"
      - "Autowire the real beans and hit the real database"
    answer: 1
    explanation: |
      Pure unit tests should bypass the container and inject doubles directly, keeping them
      fast and focused. Spring slice tests (@WebMvcTest, @DataJpaTest, @MockBean) are for when
      the framework wiring itself is under test — covered in the Spring testing topics.
    ref: "concepts.md#seams-and-dependency-injection-for-testability"

  - id: test-doubles-and-mocking-taxonomy-047
    difficulty: intermediate
    tags: [scenario, fake-vs-stub]
    question: |
      A test uses an object where `save(order)` followed by `find(order.id())` returns the
      saved order, implemented with an internal HashMap. This object is a:
    options:
      - "Stub"
      - "Dummy"
      - "Fake"
      - "Mock"
    answer: 2
    explanation: |
      It has a real working implementation (a HashMap-backed store) with round-trip logic but
      is unfit for production — the definition of a fake. A stub would return a fixed canned
      value regardless of what was saved.
    ref: "concepts.md#fakes-lightweight-working-implementations"

  - id: test-doubles-and-mocking-taxonomy-048
    difficulty: advanced
    tags: [scenario, guideline, jdbc]
    question: |
      A reviewer flags a unit test that mocks a JDBC `ResultSet` with dozens of when(...)
      calls to simulate rows. The best critique is:
    options:
      - "The test should mock the Connection instead of the ResultSet"
      - "It mocks a type you don't own, encoding fragile assumptions about JDBC; test the DAO with a real DB (Testcontainers) or a repository fake instead"
      - "It should add verifyNoMoreInteractions on the ResultSet"
      - "ResultSet mocks are fine as long as strict stubbing is on"
    answer: 1
    explanation: |
      Hand-mocking a ResultSet bakes brittle assumptions about JDBC semantics into the test
      and gives false confidence. Prefer an integration test against a real database
      (Testcontainers) or test business logic through a repository abstraction/fake you own.
    ref: "concepts.md#over-mocking-and-mocking-types-you-dont-own"

  - id: test-doubles-and-mocking-taxonomy-049
    difficulty: beginner
    tags: [taxonomy, role-not-library]
    question: |
      True or false: whether a Mockito-created object is a "stub" or a "mock" depends on how
      the test uses and verifies it, not on the library call that created it.
    options:
      - "True — the classification is about the role in the test"
      - "False — mock(...) always produces a mock and never a stub"
      - "False — only hand-written objects can be stubs"
      - "True, but only for spies"
    answer: 0
    explanation: |
      The taxonomy classifies the role the double plays. The same mock(...) object acts as a
      stub when you only supply canned answers and assert on state, and as a mock when you
      verify interactions on it.
    ref: "concepts.md#the-test-double-taxonomy-dummy-stub-spy-mock-fake"

  - id: test-doubles-and-mocking-taxonomy-050
    difficulty: intermediate
    tags: [failure-localization, classical-tdd]
    question: |
      A single bug in a low-level class causes dozens of higher-level classical-TDD tests to
      fail at once. This cascade is a known trade-off of:
    options:
      - "Mockist TDD, which over-isolates classes"
      - "Classical TDD, which uses real collaborators so failures propagate to dependents"
      - "Using fakes instead of stubs"
      - "Strict stubbing in Mockito"
    answer: 1
    explanation: |
      Because classical tests use real collaborators, a bug in one class can break every test
      whose SUT depends on it — poorer failure localization. Mockist tests isolate the class
      and pinpoint the failure, at the cost of coupling to interactions.
    ref: "concepts.md#classical-detroit-vs-mockist-london-tdd"
