topic: "JUnit 5: Lifecycle, Assertions & Extensions"
domain: testing
topic_slug: junit5-lifecycle-assertions-extensions
version: 1
questions:
  - id: junit5-lifecycle-assertions-extensions-001
    difficulty: beginner
    tags: [architecture, platform-jupiter-vintage]
    question: |
      JUnit 5 is made up of three sub-projects. Which triplet is correct?
    options:
      - "JUnit Runner + JUnit Rules + JUnit Assert"
      - "JUnit Platform + JUnit Jupiter + JUnit Vintage"
      - "JUnit Core + JUnit Extensions + JUnit Legacy"
      - "JUnit Engine + JUnit API + JUnit Runner"
    answer: 1
    explanation: |
      JUnit 5 = JUnit Platform (launcher + TestEngine SPI) + JUnit Jupiter (new programming
      and extension model + its engine) + JUnit Vintage (an engine that runs legacy JUnit
      3/4 tests). This modular split is a favorite interview opener.
    ref: "concepts.md#junit-5-architecture-platform-jupiter-and-vintage"

  - id: junit5-lifecycle-assertions-extensions-002
    difficulty: beginner
    tags: [architecture, vintage]
    question: |
      What is the purpose of the JUnit Vintage engine?
    options:
      - "It provides fluent, AssertJ-style assertions for old tests"
      - "It runs existing JUnit 3 and JUnit 4 tests on the JUnit Platform"
      - "It is the new programming model for writing JUnit 5 tests"
      - "It launches tests from IDEs and build tools"
    answer: 1
    explanation: |
      JUnit Vintage is a TestEngine that runs JUnit 3/4 tests on the Platform, letting teams
      migrate incrementally instead of rewriting everything at once. The new programming
      model is Jupiter; launching is the Platform's job.
    ref: "concepts.md#junit-5-architecture-platform-jupiter-and-vintage"

  - id: junit5-lifecycle-assertions-extensions-003
    difficulty: intermediate
    tags: [architecture, test-engine]
    question: |
      Why does the JUnit Platform define a TestEngine SPI rather than baking Jupiter in
      directly?
    options:
      - "So that any framework (Jupiter, Vintage, Spock, Cucumber) can plug in and be run by the same launcher, IDEs, and build tools"
      - "To make Jupiter tests run faster by skipping reflection"
      - "Because Jupiter cannot run without Vintage present"
      - "To force every test class to declare a single @RunWith runner"
    answer: 0
    explanation: |
      The TestEngine SPI is a contract: multiple engines (Jupiter, Vintage, Spock, Kotest,
      Cucumber) can be discovered and executed by one Platform launcher. This ended JUnit
      4's single-@RunWith limitation where you could only have one runner per class.
    ref: "concepts.md#junit-5-architecture-platform-jupiter-and-vintage"

  - id: junit5-lifecycle-assertions-extensions-004
    difficulty: intermediate
    tags: [architecture, dependencies]
    question: |
      In a Maven/Gradle build, how are the Jupiter API and Jupiter engine typically scoped?
    options:
      - "Both are compile-scope dependencies"
      - "The API is a compile dependency; the engine is a runtime dependency discovered by the Platform"
      - "Both are runtime-scope dependencies"
      - "Neither is needed because the Platform bundles Jupiter"
    answer: 1
    explanation: |
      Test code compiles against junit-jupiter-api (compile), while junit-jupiter-engine is
      needed only at run time so the Platform can discover and execute the tests. The
      junit-jupiter aggregator wires both plus junit-jupiter-params.
    ref: "concepts.md#junit-5-architecture-platform-jupiter-and-vintage"

  - id: junit5-lifecycle-assertions-extensions-005
    difficulty: beginner
    tags: [lifecycle, annotations]
    question: |
      Which JUnit 5 annotation runs a method once before all @Test methods in the class?
    options:
      - "@BeforeAll"
      - "@BeforeEach"
      - "@Before"
      - "@BeforeClass"
    answer: 0
    explanation: |
      @BeforeAll runs once before all tests (JUnit 4's @BeforeClass). @BeforeEach runs before
      every test. @Before and @BeforeClass are the old JUnit 4 names and do not exist in
      Jupiter.
    ref: "concepts.md#test-lifecycle-beforeall-beforeeach-aftereach-afterall"

  - id: junit5-lifecycle-assertions-extensions-006
    difficulty: beginner
    tags: [lifecycle, migration]
    question: |
      In JUnit 5, what replaces JUnit 4's @Before and @After?
    options:
      - "@Setup and @Teardown"
      - "@BeforeEach and @AfterEach"
      - "@PreTest and @PostTest"
      - "@BeforeAll and @AfterAll"
    answer: 1
    explanation: |
      JUnit 4's @Before/@After (run per test method) map to Jupiter's @BeforeEach/@AfterEach.
      @BeforeClass/@AfterClass map to @BeforeAll/@AfterAll.
    ref: "concepts.md#test-lifecycle-beforeall-beforeeach-aftereach-afterall"

  - id: junit5-lifecycle-assertions-extensions-007
    difficulty: intermediate
    tags: [lifecycle, static, gotcha]
    question: |
      Under the default test instance lifecycle, why must @BeforeAll methods be static?
    options:
      - "Because JUnit runs them on a background thread"
      - "Because static methods run faster"
      - "Because a new test instance is created per test method, so there is no single instance to bind a class-level callback to"
      - "Because non-static methods cannot access fields"
    answer: 2
    explanation: |
      With PER_METHOD (default), Jupiter creates a fresh instance per @Test, so a
      once-per-class method has no single instance to attach to and must be static (belong to
      the class). Switching to @TestInstance(PER_CLASS) lets @BeforeAll be non-static.
    ref: "concepts.md#test-lifecycle-beforeall-beforeeach-aftereach-afterall"

  - id: junit5-lifecycle-assertions-extensions-008
    difficulty: advanced
    tags: [lifecycle, inheritance, ordering]
    question: |
      A test subclass and its superclass both define @BeforeEach and @AfterEach methods. In
      what order do they run?
    options:
      - "Only the subclass methods run; superclass methods are overridden"
      - "Order is undefined and may vary per run"
      - "Superclass @BeforeEach first, then subclass; subclass @AfterEach first, then superclass"
      - "Subclass @BeforeEach first, then superclass; superclass @AfterEach first, then subclass"
    answer: 2
    explanation: |
      Superclass @BeforeEach runs before the subclass's (outer-to-inner setup); @AfterEach
      runs in reverse (subclass then superclass, like try/finally). Inherited non-private
      callbacks are all executed and are not overridden.
    ref: "concepts.md#test-lifecycle-beforeall-beforeeach-aftereach-afterall"

  - id: junit5-lifecycle-assertions-extensions-009
    difficulty: advanced
    tags: [lifecycle, gotcha]
    question: |
      A test's @BeforeEach method throws an exception. What happens?
    options:
      - "The @Test runs anyway; the exception is logged"
      - "The @Test is skipped, but the matching @AfterEach (and AfterEachCallbacks) still run"
      - "The @Test is skipped and no cleanup runs"
      - "The entire class is aborted immediately"
    answer: 1
    explanation: |
      A failing @BeforeEach skips the test body, but Jupiter still runs the corresponding
      @AfterEach and AfterEachCallback extensions so cleanup happens. Don't assume a failed
      "before" halts everything else.
    ref: "concepts.md#test-lifecycle-beforeall-beforeeach-aftereach-afterall"

  - id: junit5-lifecycle-assertions-extensions-010
    difficulty: intermediate
    tags: [lifecycle, gotcha, visibility]
    question: |
      A developer writes `private void setUp()` annotated with @BeforeEach and it never
      seems to run. What is the most likely cause?
    options:
      - "private lifecycle methods are not discovered by Jupiter; make it package-private or protected"
      - "@BeforeEach only works on methods named exactly setUp"
      - "@BeforeEach must return boolean"
      - "You must also add @Test to the method"
    answer: 0
    explanation: |
      Jupiter does not discover private lifecycle/test methods. Lifecycle methods must be
      non-private (and void). The fix is to drop the private modifier.
    ref: "concepts.md#test-lifecycle-beforeall-beforeeach-aftereach-afterall"

  - id: junit5-lifecycle-assertions-extensions-011
    difficulty: beginner
    tags: [instance-lifecycle, default]
    question: |
      By default, how many instances of a test class does Jupiter create for a class with
      three @Test methods?
    options:
      - "Three instances — one per test method"
      - "One instance shared by all three tests"
      - "Six instances — one before and one after each test"
      - "It depends on the number of @BeforeEach methods"
    answer: 0
    explanation: |
      The default lifecycle is PER_METHOD: a new test-class instance is created for each
      @Test, guaranteeing field isolation between tests. PER_CLASS would create just one
      instance for the whole class.
    ref: "concepts.md#test-instance-lifecycle-per-method-vs-per-class-testinstance"

  - id: junit5-lifecycle-assertions-extensions-012
    difficulty: intermediate
    tags: [instance-lifecycle, per-class]
    question: |
      What does annotating a test class with @TestInstance(Lifecycle.PER_CLASS) allow?
    options:
      - "It disables @BeforeEach entirely"
      - "It creates one instance for the class, so @BeforeAll/@AfterAll may be non-static and instance fields are shared across tests"
      - "It runs each test in parallel"
      - "It resets all static fields between tests"
    answer: 1
    explanation: |
      PER_CLASS uses a single instance for the whole class, which permits non-static
      @BeforeAll/@AfterAll and shares instance state across tests. The trade-off is loss of
      per-test isolation, so shared mutable state can couple tests.
    ref: "concepts.md#test-instance-lifecycle-per-method-vs-per-class-testinstance"

  - id: junit5-lifecycle-assertions-extensions-013
    difficulty: advanced
    tags: [instance-lifecycle, flakiness, scenario]
    question: |
      A team switches a class to @TestInstance(PER_CLASS) and reuses an instance List field
      across tests without clearing it. Tests now pass or fail depending on run order. What
      is the root cause?
    options:
      - "PER_CLASS shares one instance, so mutable field state leaks between tests, reintroducing order-dependent coupling"
      - "PER_CLASS runs tests on multiple threads by default"
      - "PER_CLASS disables @AfterEach so cleanup never happens"
      - "PER_CLASS randomizes method order, which is always wrong"
    answer: 0
    explanation: |
      With one shared instance, mutable fields carry over between tests. Because Jupiter does
      not guarantee method order unless you add @TestMethodOrder, results become
      order-dependent. Either reset state in @BeforeEach or return to PER_METHOD isolation.
    ref: "concepts.md#test-instance-lifecycle-per-method-vs-per-class-testinstance"

  - id: junit5-lifecycle-assertions-extensions-014
    difficulty: beginner
    tags: [structure, displayname]
    question: |
      What does @DisplayName do?
    options:
      - "It marks a test to run first"
      - "It disables the test"
      - "It tags the test for filtering in CI"
      - "It gives a test or class a human-readable name (with spaces/punctuation) in reports and IDEs"
    answer: 3
    explanation: |
      @DisplayName supplies a readable label free of Java identifier rules, shown in test
      reports and IDEs. Filtering is done with @Tag; disabling with @Disabled.
    ref: "concepts.md#structuring-tests-displayname-nested-tag"

  - id: junit5-lifecycle-assertions-extensions-015
    difficulty: intermediate
    tags: [structure, nested]
    question: |
      What is a key structural requirement of a @Nested test class?
    options:
      - "It must be a static nested class"
      - "It must extend the enclosing class"
      - "It must be a non-static (inner) class"
      - "It must be declared in a separate file"
    answer: 2
    explanation: |
      @Nested classes must be non-static inner classes so they hold a reference to the
      enclosing instance; this lets outer @BeforeEach setup run before inner tests. A static
      nested class is treated as a separate top-level test class.
    ref: "concepts.md#structuring-tests-displayname-nested-tag"

  - id: junit5-lifecycle-assertions-extensions-016
    difficulty: intermediate
    tags: [structure, tag, ci]
    question: |
      Your CI needs to run only fast tests on every push and slow ones nightly. Which JUnit
      5 feature best supports this?
    options:
      - "@DisplayName on each test"
      - "@Tag with tag-based include/exclude filters in Surefire/Gradle"
      - "@Disabled on slow tests"
      - "@Nested grouping"
    answer: 1
    explanation: |
      @Tag labels tests (e.g. @Tag("slow")) and build tools filter with include/exclude tag
      expressions. This is the JUnit 5 replacement for JUnit 4 @Category and the standard way
      to split fast vs slow suites.
    ref: "concepts.md#structuring-tests-displayname-nested-tag"

  - id: junit5-lifecycle-assertions-extensions-017
    difficulty: intermediate
    tags: [structure, nested, ordering]
    question: |
      In a class with @Nested inner classes, how do outer and inner @BeforeEach methods
      relate for a test inside the inner class?
    options:
      - "Only the inner @BeforeEach runs"
      - "The inner @BeforeEach runs before the outer @BeforeEach"
      - "They run in random order"
      - "The outer @BeforeEach runs before the inner @BeforeEach"
    answer: 3
    explanation: |
      Outer (enclosing) @BeforeEach methods run before inner ones, so nesting naturally
      expresses shared-then-specific setup ("given a user" then "when logged in").
    ref: "concepts.md#structuring-tests-displayname-nested-tag"

  - id: junit5-lifecycle-assertions-extensions-018
    difficulty: beginner
    tags: [assertions, assertthrows]
    question: |
      What does assertThrows return?
    options:
      - "A boolean indicating whether the exception was thrown"
      - "The thrown exception instance, so you can assert on its message or cause"
      - "void"
      - "The stack trace as a String"
    answer: 1
    explanation: |
      assertThrows asserts that the executable throws the expected type AND returns the
      caught exception, letting you make further assertions (e.g. on getMessage()). Use
      assertThrowsExactly if you need the exact class, not a subclass.
    ref: "concepts.md#assertions-assertequals-assertthrows-assertall-asserttimeout"

  - id: junit5-lifecycle-assertions-extensions-019
    difficulty: intermediate
    tags: [assertions, assertall]
    question: |
      Why use assertAll(...) instead of several separate assertEquals calls?
    options:
      - "It runs the assertions on separate threads"
      - "It automatically retries failed assertions"
      - "It evaluates all grouped assertions and reports every failure together, instead of stopping at the first"
      - "It disables the test if any assertion fails"
    answer: 2
    explanation: |
      assertAll executes every grouped executable and aggregates failures into a
      MultipleFailuresError, so you see all problems in one run rather than fixing them one at
      a time. Use it for multiple properties of a single object.
    ref: "concepts.md#assertions-assertequals-assertthrows-assertall-asserttimeout"

  - id: junit5-lifecycle-assertions-extensions-020
    difficulty: advanced
    tags: [assertions, timeout, threading, gotcha]
    question: |
      A test uses assertTimeoutPreemptively with a Spring @Transactional method and the
      rollback stops working. Why?
    options:
      - "Preemptive timeouts disable transactions globally"
      - "The timeout value is too short"
      - "Spring transactions are incompatible with all JUnit 5 assertions"
      - "assertTimeoutPreemptively runs the code in a separate thread, so thread-bound state (transaction, ThreadLocal, security context) does not propagate"
    answer: 3
    explanation: |
      assertTimeoutPreemptively executes the supplied code in a different thread and aborts
      on timeout. Thread-bound state like Spring's transactional context, ThreadLocals, and
      SecurityContext won't propagate. Prefer plain assertTimeout unless you must interrupt a
      hang.
    ref: "concepts.md#assertions-assertequals-assertthrows-assertall-asserttimeout"

  - id: junit5-lifecycle-assertions-extensions-021
    difficulty: intermediate
    tags: [assertions, timeout]
    question: |
      How does assertTimeout (non-preemptive) behave when the executable exceeds the limit?
    options:
      - "It interrupts the executable immediately at the limit"
      - "It retries the executable until it is fast enough"
      - "It skips the test"
      - "It runs the executable in the calling thread, waits for it to finish, then fails if it took too long"
    answer: 3
    explanation: |
      assertTimeout runs in the calling thread and does NOT abort; it lets the code finish and
      then fails if the elapsed time exceeded the limit. Only assertTimeoutPreemptively aborts
      early (in a separate thread).
    ref: "concepts.md#assertions-assertequals-assertthrows-assertall-asserttimeout"

  - id: junit5-lifecycle-assertions-extensions-022
    difficulty: intermediate
    tags: [assertions, migration, message]
    question: |
      In JUnit 5's assertEquals, where does the optional failure message go?
    options:
      - "It is the last argument (and may be a Supplier<String> for lazy evaluation)"
      - "It is the first argument, as in JUnit 4"
      - "Messages are not supported"
      - "It must be passed via a separate assertMessage call"
    answer: 0
    explanation: |
      Jupiter moved the message to the LAST parameter (JUnit 4 put it first). It can be a
      Supplier<String> so the message is only built on failure. The reordering is a classic
      silent migration bug.
    ref: "concepts.md#assertions-assertequals-assertthrows-assertall-asserttimeout"

  - id: junit5-lifecycle-assertions-extensions-023
    difficulty: intermediate
    tags: [assertions, floating-point]
    question: |
      When asserting equality of two double values in JUnit 5, what should you provide?
    options:
      - "Nothing extra; == comparison is exact and reliable for doubles"
      - "A Comparator instance"
      - "A delta/tolerance, e.g. assertEquals(0.3, a + b, 1e-9)"
      - "A @Timeout annotation"
    answer: 2
    explanation: |
      Floating-point arithmetic is imprecise, so assertEquals for doubles takes a delta
      (tolerance). Comparing doubles without a delta produces flaky failures like
      0.1 + 0.2 != 0.3.
    ref: "concepts.md#assertions-assertequals-assertthrows-assertall-asserttimeout"

  - id: junit5-lifecycle-assertions-extensions-024
    difficulty: advanced
    tags: [assertions, assertthrows, exact]
    question: |
      What is the difference between assertThrows and assertThrowsExactly?
    options:
      - "assertThrows only works for RuntimeExceptions"
      - "assertThrowsExactly does not return the exception"
      - "There is no difference; they are aliases"
      - "assertThrows accepts the expected type OR any subclass; assertThrowsExactly requires the exact class"
    answer: 3
    explanation: |
      assertThrows passes if the thrown exception is the expected type or a subtype, while
      assertThrowsExactly requires the precise class (a subclass would fail). Both return the
      caught exception.
    ref: "concepts.md#assertions-assertequals-assertthrows-assertall-asserttimeout"

  - id: junit5-lifecycle-assertions-extensions-025
    difficulty: beginner
    tags: [assertj, fluent]
    question: |
      Which library provides fluent, chainable assertions like
      assertThat(list).hasSize(3).contains("A") on the JVM?
    options:
      - "AssertJ"
      - "JUnit Jupiter's built-in assertThat"
      - "JUnit Vintage"
      - "JUnit Platform Launcher"
    answer: 0
    explanation: |
      AssertJ provides the fluent assertThat(...) API. Jupiter's core Assertions class
      deliberately has no rich assertThat, delegating to AssertJ or Hamcrest for advanced
      matching.
    ref: "concepts.md#assertj-and-hamcrest-fluent-assertions"

  - id: junit5-lifecycle-assertions-extensions-026
    difficulty: intermediate
    tags: [assertj, exceptions]
    question: |
      Which AssertJ idiom asserts that a call throws an exception and checks its message?
    options:
      - "assertThat(() -> service.parse(\"bad\")).throwsException()"
      - "assertThrows(() -> service.parse(\"bad\"), \"unparseable\")"
      - "expectException(IllegalArgumentException.class)"
      - "assertThatThrownBy(() -> service.parse(\"bad\")).isInstanceOf(IllegalArgumentException.class).hasMessageContaining(\"unparseable\")"
    answer: 3
    explanation: |
      AssertJ's assertThatThrownBy(...) captures the thrown exception and chains assertions
      like isInstanceOf(...) and hasMessageContaining(...). It is the fluent counterpart to
      Jupiter's assertThrows.
    ref: "concepts.md#assertj-and-hamcrest-fluent-assertions"

  - id: junit5-lifecycle-assertions-extensions-027
    difficulty: intermediate
    tags: [assertj, good-vs-bad]
    question: |
      Why is assertThat(list).contains(x) generally preferred over assertTrue(list.contains(x))?
    options:
      - "It runs faster"
      - "assertTrue is deprecated in JUnit 5"
      - "assertTrue cannot take a boolean"
      - "It produces a descriptive failure message naming the element and printing the actual list, whereas assertTrue only reports 'expected true but was false'"
    answer: 3
    explanation: |
      A good assertion fails with a message that tells you what was wrong. AssertJ's
      contains prints the missing element and the actual collection; assertTrue on a boolean
      loses all that context, giving only "expected true but was false".
    ref: "concepts.md#assertj-and-hamcrest-fluent-assertions"

  - id: junit5-lifecycle-assertions-extensions-028
    difficulty: intermediate
    tags: [assertj, hamcrest]
    question: |
      Which statement about Hamcrest vs AssertJ is accurate?
    options:
      - "Hamcrest is part of JUnit 5's core Assertions class"
      - "AssertJ and Hamcrest cannot be used in the same project"
      - "AssertJ requires JUnit Vintage"
      - "Hamcrest uses Matcher objects (e.g. assertThat(actual, is(equalTo(x)))) and is used by Spring MockMvc's jsonPath matchers; AssertJ uses a more discoverable fluent chain"
    answer: 3
    explanation: |
      Hamcrest composes Matcher objects and is still used (e.g. MockMvc jsonPath value
      matchers), while AssertJ's chained API is more discoverable via IDE autocomplete.
      Neither is in Jupiter's core, and both can coexist.
    ref: "concepts.md#assertj-and-hamcrest-fluent-assertions"

  - id: junit5-lifecycle-assertions-extensions-029
    difficulty: beginner
    tags: [assumptions, abort]
    question: |
      When an assumption such as assumeTrue(condition) fails, how is the test reported?
    options:
      - "As failed (red)"
      - "As passed"
      - "As aborted/skipped, not failed"
      - "As an error with a stack trace"
    answer: 2
    explanation: |
      A failed assumption ABORTS the test, reporting it as skipped rather than failed. This
      distinguishes "not applicable in this environment" from "the code is wrong" (a failed
      assertion).
    ref: "concepts.md#assumptions-skipping-tests-when-preconditions-arent-met"

  - id: junit5-lifecycle-assertions-extensions-030
    difficulty: intermediate
    tags: [assumptions, assertions, distinction]
    question: |
      What is the conceptual difference between a failed assumption and a failed assertion?
    options:
      - "They are identical; both fail the test"
      - "A failed assertion skips the test; a failed assumption fails it"
      - "Assumptions only work in @BeforeEach"
      - "A failed assumption means the test is not applicable (skipped); a failed assertion means the code under test is wrong (failed)"
    answer: 3
    explanation: |
      Assumptions gate applicability: if false, the test is aborted/skipped. Assertions
      verify correctness: if false, the test fails. Confusing the two hides bugs or hides
      missing coverage.
    ref: "concepts.md#assumptions-skipping-tests-when-preconditions-arent-met"

  - id: junit5-lifecycle-assertions-extensions-031
    difficulty: advanced
    tags: [assumptions, coverage, gotcha, scenario]
    question: |
      A test starts with assumeTrue(databaseAvailable()). In CI the database is never
      started, so the test shows green every build. What is the danger?
    options:
      - "The assumption makes the test run twice"
      - "The assumption converts failures into passes for other tests"
      - "assumeTrue is not allowed in CI"
      - "The test is silently skipped, so it appears green while testing nothing — masking regressions"
    answer: 3
    explanation: |
      A perpetually-skipped test provides no signal yet looks green, hiding regressions.
      Better to make the precondition actually hold (e.g. Testcontainers) or use @Disabled
      with a reason / @EnabledIf... so the skip is visible.
    ref: "concepts.md#assumptions-skipping-tests-when-preconditions-arent-met"

  - id: junit5-lifecycle-assertions-extensions-032
    difficulty: intermediate
    tags: [assumptions, assumingthat]
    question: |
      How does assumingThat(condition, executable) differ from assumeTrue(condition)?
    options:
      - "assumingThat aborts the whole test if the condition is false"
      - "assumingThat is an assertion, not an assumption"
      - "There is no difference"
      - "assumingThat runs the executable only when the condition is true, but the rest of the test runs regardless of the condition"
    answer: 3
    explanation: |
      assumingThat conditionally executes only the supplied block; the remainder of the test
      method always runs. assumeTrue/assumeFalse, by contrast, abort the entire test when the
      condition is not met.
    ref: "concepts.md#assumptions-skipping-tests-when-preconditions-arent-met"

  - id: junit5-lifecycle-assertions-extensions-033
    difficulty: beginner
    tags: [disabled, conditional]
    question: |
      Which annotation unconditionally skips a test in JUnit 5 (the successor to JUnit 4's
      @Ignore)?
    options:
      - "@Skip"
      - "@Ignore"
      - "@Disabled"
      - "@Suppress"
    answer: 2
    explanation: |
      @Disabled unconditionally skips a test or class and replaces JUnit 4's @Ignore. Best
      practice is to supply a reason, e.g. @Disabled("flaky until JIRA-1234").
    ref: "concepts.md#disabling-and-conditional-test-execution"

  - id: junit5-lifecycle-assertions-extensions-034
    difficulty: intermediate
    tags: [conditional, environment]
    question: |
      Which annotation runs a test only when an environment variable matches a regex?
    options:
      - "@EnabledIfEnvironmentVariable(named=\"ENV\", matches=\"CI\")"
      - "@EnabledOnOs(LINUX)"
      - "@EnabledOnJre(JAVA_17)"
      - "@Tag(\"ci\")"
    answer: 0
    explanation: |
      @EnabledIfEnvironmentVariable gates on an environment variable's value via regex.
      @EnabledOnOs and @EnabledOnJre gate on OS/JRE, and @Tag is for filtering, not
      conditional enablement.
    ref: "concepts.md#disabling-and-conditional-test-execution"

  - id: junit5-lifecycle-assertions-extensions-035
    difficulty: advanced
    tags: [conditional, assumptions, comparison]
    question: |
      Why might a conditional annotation like @EnabledOnOs(MAC) be preferable to
      assumeTrue(isMac()) at the top of a test?
    options:
      - "Conditions run faster at runtime"
      - "assumeTrue is deprecated"
      - "Conditions can be applied only to @Nested classes"
      - "The condition is declarative, self-documents in reports as disabled-with-reason, and is evaluated before the test instance is even created"
    answer: 3
    explanation: |
      Conditional annotations are declarative and evaluated before instantiation, showing up
      cleanly in reports; assumptions are imperative and evaluated inside the body. Use
      assumptions only when the precondition depends on runtime values computed mid-test.
    ref: "concepts.md#disabling-and-conditional-test-execution"

  - id: junit5-lifecycle-assertions-extensions-036
    difficulty: beginner
    tags: [extensions, migration, runwith]
    question: |
      In JUnit 5, what replaces JUnit 4's @RunWith(SpringRunner.class)?
    options:
      - "@RunWith(SpringExtension.class)"
      - "@Rule SpringExtension"
      - "@ExtendWith(SpringExtension.class)"
      - "@Import(SpringRunner.class)"
    answer: 2
    explanation: |
      JUnit 5 replaces @RunWith with the extension model: @ExtendWith(SpringExtension.class).
      Likewise @RunWith(MockitoJUnitRunner.class) becomes
      @ExtendWith(MockitoExtension.class).
    ref: "concepts.md#the-extension-model-replacing-runwith-rule-and-classrule"

  - id: junit5-lifecycle-assertions-extensions-037
    difficulty: intermediate
    tags: [extensions, composability]
    question: |
      What key limitation of JUnit 4's @RunWith does the JUnit 5 extension model remove?
    options:
      - "You could not write assertions in JUnit 4"
      - "JUnit 4 could not run in IDEs"
      - "JUnit 4 had no lifecycle callbacks"
      - "A class could have only one @RunWith runner, so you could not combine (say) Spring and Mockito runners; extensions are composable and stackable"
    answer: 3
    explanation: |
      JUnit 4 allowed a single @RunWith per class, so combining runners was impossible. JUnit
      5 lets you register many extensions (SpringExtension + MockitoExtension + custom),
      which compose like layered try/finally wrappers.
    ref: "concepts.md#the-extension-model-replacing-runwith-rule-and-classrule"

  - id: junit5-lifecycle-assertions-extensions-038
    difficulty: intermediate
    tags: [extensions, parameterresolver]
    question: |
      Which extension interface enables injecting arguments (like TestInfo or a Mockito
      @Mock) into a test method's parameters?
    options:
      - "ExecutionCondition"
      - "TestWatcher"
      - "ParameterResolver"
      - "AfterAllCallback"
    answer: 2
    explanation: |
      ParameterResolver resolves and injects parameters into constructors and test/lifecycle
      methods. It's how TestInfo/TestReporter injection works and how Mockito injects @Mock
      parameters.
    ref: "concepts.md#the-extension-model-replacing-runwith-rule-and-classrule"

  - id: junit5-lifecycle-assertions-extensions-039
    difficulty: advanced
    tags: [extensions, ordering, callbacks]
    question: |
      For a single test method, which sequence correctly orders these steps?
    options:
      - "@Test -> BeforeEachCallback -> @BeforeEach -> @AfterEach -> AfterEachCallback"
      - "BeforeEachCallback -> @BeforeEach -> BeforeTestExecutionCallback -> @Test -> AfterTestExecutionCallback -> @AfterEach -> AfterEachCallback"
      - "@BeforeEach -> BeforeEachCallback -> @Test -> AfterEachCallback -> @AfterEach"
      - "BeforeTestExecutionCallback -> BeforeEachCallback -> @Test -> @AfterEach -> AfterTestExecutionCallback"
    answer: 1
    explanation: |
      The onion order is: BeforeEachCallback, then user @BeforeEach, then
      BeforeTestExecutionCallback (tightest wrap), then the test, then
      AfterTestExecutionCallback, then @AfterEach, then AfterEachCallback. "Before" callbacks
      run in registration order; "after" in reverse.
    ref: "concepts.md#the-extension-model-replacing-runwith-rule-and-classrule"

  - id: junit5-lifecycle-assertions-extensions-040
    difficulty: advanced
    tags: [extensions, store, state]
    question: |
      An extension needs to pass a start timestamp from beforeTestExecution to
      afterTestExecution. What is the recommended mechanism?
    options:
      - "A static field on the extension class"
      - "An instance field on the extension"
      - "The ExtensionContext.Store, keyed by a Namespace"
      - "A ThreadLocal in the test class"
    answer: 2
    explanation: |
      Because a single extension instance may be shared across many tests (and callbacks),
      state should go in the ExtensionContext.Store keyed by a Namespace, not in instance or
      static fields, which would leak or collide between tests.
    ref: "concepts.md#the-extension-model-replacing-runwith-rule-and-classrule"

  - id: junit5-lifecycle-assertions-extensions-041
    difficulty: intermediate
    tags: [extensions, registration]
    question: |
      What is the main advantage of @RegisterExtension over @ExtendWith?
    options:
      - "It runs the extension faster"
      - "It is the only way to register Spring's extension"
      - "It works only on static methods"
      - "It lets you register a pre-built, configured extension INSTANCE (e.g. via a builder), which @ExtendWith cannot because it only takes a class"
    answer: 3
    explanation: |
      @ExtendWith takes an extension class and JUnit instantiates it, so you cannot configure
      it. @RegisterExtension annotates a field holding an instance you build yourself,
      enabling configuration (ports, options, builders) — ideal for WireMock/Testcontainers.
    ref: "concepts.md#extension-registration-extendwith-vs-registerextension"

  - id: junit5-lifecycle-assertions-extensions-042
    difficulty: advanced
    tags: [extensions, registration, static, scenario]
    question: |
      A @RegisterExtension field is declared non-static. Which callbacks will it participate
      in?
    options:
      - "Class-level callbacks only (BeforeAllCallback/AfterAllCallback)"
      - "Both class-level and instance-level callbacks"
      - "Instance-level callbacks only (BeforeEachCallback/AfterEachCallback), not class-level ones"
      - "None; @RegisterExtension fields must be static"
    answer: 2
    explanation: |
      A non-static @RegisterExtension field participates only in instance-level (per-test)
      callbacks. To get class-level callbacks like BeforeAllCallback, the field must be
      static — a common gotcha when an extension's before-all setup silently doesn't run.
    ref: "concepts.md#extension-registration-extendwith-vs-registerextension"

  - id: junit5-lifecycle-assertions-extensions-043
    difficulty: intermediate
    tags: [extensions, registration, choice]
    question: |
      You need to register a WireMock server extension configured to use a dynamic port.
      Which registration approach fits and why?
    options:
      - "@ExtendWith(WireMockExtension.class), because it auto-configures the port"
      - "Automatic ServiceLoader registration, because ports must be global"
      - "@RegisterExtension on a field built with a builder, because you must configure the port/options on the instance"
      - "@Rule, because WireMock only supports JUnit 4"
    answer: 2
    explanation: |
      Configuring the extension (dynamic port, options) requires creating the instance
      yourself, which is exactly what @RegisterExtension on a field supports.
      @ExtendWith only takes a class and cannot be configured.
    ref: "concepts.md#extension-registration-extendwith-vs-registerextension"

  - id: junit5-lifecycle-assertions-extensions-044
    difficulty: intermediate
    tags: [migration, vintage, strategy]
    question: |
      What is the recommended first step to migrate a large JUnit 4 suite to JUnit 5
      incrementally?
    options:
      - "Delete all JUnit 4 tests and rewrite them at once"
      - "Switch the whole project to TestNG first"
      - "Disable all JUnit 4 tests until migration completes"
      - "Add the junit-vintage-engine so existing JUnit 3/4 tests keep running on the Platform while you migrate test-by-test"
    answer: 3
    explanation: |
      Adding junit-vintage-engine alongside junit-jupiter-engine lets legacy tests run
      unchanged on the Platform, so the suite stays green while you migrate incrementally
      rather than in one risky big-bang rewrite.
    ref: "concepts.md#migrating-from-junit-4-to-junit-5"

  - id: junit5-lifecycle-assertions-extensions-045
    difficulty: advanced
    tags: [migration, assertions, gotcha]
    question: |
      During a JUnit 4 to 5 migration, why is the assertEquals message-argument change a
      dangerous silent bug?
    options:
      - "Because assertEquals was removed in JUnit 5"
      - "Because JUnit 5 requires a delta on every assertEquals"
      - "Because messages are no longer supported"
      - "Because the message moved from the FIRST argument (JUnit 4) to the LAST (JUnit 5); if the old message is assignment-compatible the code still compiles but compares the wrong values"
    answer: 3
    explanation: |
      JUnit 4 was assertEquals(message, expected, actual); JUnit 5 is assertEquals(expected,
      actual, message). If the leftover message happens to type-check as expected/actual, the
      test silently asserts the wrong thing. Grep 3-arg assertions during migration.
    ref: "concepts.md#migrating-from-junit-4-to-junit-5"

  - id: junit5-lifecycle-assertions-extensions-046
    difficulty: intermediate
    tags: [migration, expected-exception]
    question: |
      JUnit 4 code uses @Test(expected = IllegalStateException.class). What is the idiomatic
      JUnit 5 replacement?
    options:
      - "Keep @Test(expected = ...); it still works in Jupiter"
      - "@ExpectedException(IllegalStateException.class)"
      - "assumeThrows(IllegalStateException.class)"
      - "assertThrows(IllegalStateException.class, () -> ...)"
    answer: 3
    explanation: |
      Jupiter's @Test has no expected attribute; you assert exceptions with
      assertThrows(...), which also returns the exception for further assertions.
      Similarly @Test(timeout=...) becomes assertTimeout(...) or @Timeout.
    ref: "concepts.md#migrating-from-junit-4-to-junit-5"
