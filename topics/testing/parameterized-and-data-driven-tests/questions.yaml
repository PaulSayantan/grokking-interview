topic: "Parameterized, Dynamic & Property-Based Tests"
domain: testing
topic_slug: parameterized-and-data-driven-tests
version: 1
questions:
  - id: parameterized-and-data-driven-tests-001
    difficulty: beginner
    tags: [parameterized, motivation]
    question: |
      What is the main advantage of a JUnit 5 @ParameterizedTest over writing a
      `for` loop that iterates a list of inputs inside a single @Test method?
    options:
      - "Each input becomes an independent invocation with its own pass/fail and name, so one failing input does not stop the others"
      - "The loop runs faster because there is only one method invocation"
      - "A loop cannot use assertions, but a parameterized test can"
      - "Parameterized tests are the only way to use AssertJ"
    answer: 0
    explanation: |
      In a loop, the first failed assertion throws and aborts the remaining
      iterations, and the report shows a single pass/fail. A parameterized test
      runs each row as a separate invocation with its own name and result, so you
      see exactly which inputs passed and which failed.
    ref: "concepts.md#why-parameterized-and-data-driven-tests"

  - id: parameterized-and-data-driven-tests-002
    difficulty: beginner
    tags: [data-driven, design]
    question: |
      "Data-driven testing" primarily refers to what design idea?
    options:
      - "Storing test results in a database for analytics"
      - "Running the same test many times to detect flakiness"
      - "Separating the test logic from a table of test data so one logic runs over many input rows"
      - "Generating random inputs and shrinking failures"
    answer: 2
    explanation: |
      Data-driven testing separates the *logic* of a test from its *data*: the data
      is a table of rows and each row is an independent invocation of the same
      logic. Random-input generation is property-based testing; repeated runs is
      @RepeatedTest.
    ref: "concepts.md#why-parameterized-and-data-driven-tests"

  - id: parameterized-and-data-driven-tests-003
    difficulty: beginner
    tags: [parameterized, annotations]
    question: |
      In JUnit 5, how do you correctly declare a parameterized test method?
    options:
      - "Annotate it with @ParameterizedTest (instead of @Test) plus at least one argument source"
      - "Annotate it with both @Test and @ParameterizedTest"
      - "Annotate it with @RepeatedTest and pass an array"
      - "Annotate it with @TestFactory and return a Stream"
    answer: 0
    explanation: |
      @ParameterizedTest replaces @Test — you use one or the other, never both —
      and it must be paired with at least one argument source (e.g. @ValueSource,
      @CsvSource, @MethodSource). @TestFactory is for dynamic tests.
    ref: "concepts.md#parameterizedtest-and-the-argument-sources"

  - id: parameterized-and-data-driven-tests-004
    difficulty: beginner
    tags: [value-source]
    question: |
      Which argument source is designed to feed a single column of literals into a
      single-parameter test method?
    options:
      - "@CsvSource"
      - "@MethodSource"
      - "@ValueSource"
      - "@EnumSource"
    answer: 2
    explanation: |
      @ValueSource declares exactly one array attribute (ints, strings, doubles,
      etc.) and feeds a single-parameter method. Multi-column tables use @CsvSource
      or @MethodSource.
    ref: "concepts.md#valuesource-nullsource-and-emptysource"

  - id: parameterized-and-data-driven-tests-005
    difficulty: intermediate
    tags: [value-source, null, edge-cases]
    question: |
      You want a parameterized test to also run with a `null` String input, but
      @ValueSource(strings = ...) cannot express null. What should you add?
    options:
      - "@EmptySource"
      - "@ValueSource(strings = {\"null\"})"
      - "@EnumSource"
      - "@NullSource"
    answer: 3
    explanation: |
      @NullSource injects a single null (the parameter must be a reference type).
      @EmptySource injects an empty value like \"\". The literal string \"null\" is
      just the four-character text, not a null reference.
    ref: "concepts.md#valuesource-nullsource-and-emptysource"

  - id: parameterized-and-data-driven-tests-006
    difficulty: intermediate
    tags: [null-source, primitives, gotcha]
    question: |
      Why does @NullSource fail when the test parameter is declared as `int`?
    options:
      - "null cannot be unboxed into a primitive; the parameter must be a reference type such as Integer"
      - "@NullSource only works with @CsvSource"
      - "Primitives are not supported by any parameterized source"
      - "int parameters require @EmptySource instead"
    answer: 0
    explanation: |
      @NullSource supplies a null reference. A primitive int cannot hold null (no
      unboxing target), so JUnit fails. Use Integer if you need a null case for an
      integer parameter.
    ref: "concepts.md#valuesource-nullsource-and-emptysource"

  - id: parameterized-and-data-driven-tests-007
    difficulty: beginner
    tags: [null-and-empty-source]
    question: |
      What does @NullAndEmptySource provide to a String parameter?
    options:
      - "Only an empty string \"\""
      - "Only null"
      - "Both null and an empty value (\"\", empty collection, etc.)"
      - "A null, an empty string, and a blank string \"  \""
    answer: 2
    explanation: |
      @NullAndEmptySource is a composed meta-annotation combining @NullSource and
      @EmptySource, so it supplies both null and an empty value. It does not add
      blank/whitespace strings — you'd add @ValueSource for those.
    ref: "concepts.md#valuesource-nullsource-and-emptysource"

  - id: parameterized-and-data-driven-tests-008
    difficulty: beginner
    tags: [csv-source, multi-column]
    question: |
      Why would you choose @CsvSource over @ValueSource for a test?
    options:
      - "@CsvSource can inject multiple columns (multiple parameters) per row"
      - "@CsvSource is the only source that supports null"
      - "@ValueSource cannot be used with strings"
      - "@CsvSource runs the test in parallel automatically"
    answer: 0
    explanation: |
      @ValueSource feeds a single parameter. @CsvSource splits each row into
      multiple columns mapped to multiple method parameters, which is why it's the
      go-to for small multi-argument tables written inline.
    ref: "concepts.md#csvsource-and-csvfilesource"

  - id: parameterized-and-data-driven-tests-009
    difficulty: intermediate
    tags: [csv-source, null, quoting, gotcha]
    question: |
      In a default @CsvSource, how is an *unquoted empty* cell (e.g. the middle
      value in `"foo, , bar"`) interpreted?
    options:
      - "As an empty string \"\""
      - "As the literal text \" \""
      - "As null"
      - "It throws a parsing error"
    answer: 2
    explanation: |
      By default an unquoted empty cell is injected as null, while an empty *quoted*
      string ('') is injected as \"\". You can also map arbitrary tokens to null via
      the nullValues attribute.
    ref: "concepts.md#csvsource-and-csvfilesource"

  - id: parameterized-and-data-driven-tests-010
    difficulty: intermediate
    tags: [csv-source, quoting]
    question: |
      A @CsvSource row must contain a value that itself includes a comma, e.g. the
      phrase `hello, world`. What is the idiomatic fix?
    options:
      - "Escape the comma with a backslash"
      - "Use two commas to escape it"
      - "Wrap the value in single quotes: 'hello, world'"
      - "It is impossible; switch to @ValueSource"
    answer: 2
    explanation: |
      Wrapping a value in the quote character (single quote by default) preserves
      embedded commas and whitespace, so 'hello, world' is one column. Alternatively
      change the delimiter attribute to a character not present in the data.
    ref: "concepts.md#csvsource-and-csvfilesource"

  - id: parameterized-and-data-driven-tests-011
    difficulty: intermediate
    tags: [csv-file-source]
    question: |
      You have a large CSV dataset with a header row maintained by the QA team. Which
      source and attribute combination fits best?
    options:
      - "@CsvFileSource(resources = \"/data.csv\", numLinesToSkip = 1)"
      - "@CsvSource with useHeadersInDisplayName"
      - "@MethodSource(\"data.csv\")"
      - "@ValueSource(strings = \"/data.csv\")"
    answer: 0
    explanation: |
      @CsvFileSource reads rows from a classpath (or filesystem) resource and
      numLinesToSkip skips the header row. It's the right choice for large or
      externally-owned datasets; inline @CsvSource is for a handful of readable rows.
    ref: "concepts.md#csvsource-and-csvfilesource"

  - id: parameterized-and-data-driven-tests-012
    difficulty: intermediate
    tags: [method-source, static, gotcha]
    question: |
      Your @MethodSource("scenarios") test fails at startup because the factory
      method can't be resolved, even though the name matches. The factory is a
      non-static instance method. What is the most likely fix?
    options:
      - "Rename the method to match the test method name"
      - "Return a List instead of a Stream"
      - "Move the factory into a @Nested class"
      - "Make the factory static, or annotate the class @TestInstance(Lifecycle.PER_CLASS)"
    answer: 3
    explanation: |
      A @MethodSource factory must be static unless the test class uses
      @TestInstance(Lifecycle.PER_CLASS), which shares one instance and permits a
      non-static factory. Return type (Stream/Iterable/array) isn't the issue here.
    ref: "concepts.md#methodsource-and-fieldsource"

  - id: parameterized-and-data-driven-tests-013
    difficulty: intermediate
    tags: [method-source, arguments]
    question: |
      A @MethodSource factory for a *multi-parameter* test should return a stream of
      what?
    options:
      - "Stream<Arguments>, each built with Arguments.of(...)"
      - "Stream<String> where each string is comma-separated"
      - "Stream<Object[][]>"
      - "Stream<Map<String,Object>>"
    answer: 0
    explanation: |
      For multiple parameters, wrap each row in Arguments.of(...) (aka arguments(...)),
      yielding a Stream<Arguments>. A single-parameter test may return a plain
      Stream<T> without the Arguments wrapper.
    ref: "concepts.md#methodsource-and-fieldsource"

  - id: parameterized-and-data-driven-tests-014
    difficulty: advanced
    tags: [method-source, external-class]
    question: |
      You want to reuse a factory method defined in a different class,
      com.acme.TestData. How do you reference it from @MethodSource?
    options:
      - "@MethodSource(\"com.acme.TestData.orderScenarios\")"
      - "You must copy the method into the test class"
      - "@MethodSource(\"com.acme.TestData#orderScenarios\")"
      - "@MethodSource(clazz = TestData.class, method = \"orderScenarios\")"
    answer: 2
    explanation: |
      A factory in another class is referenced with the fully-qualified name using a
      '#' between the class and method: "com.acme.TestData#orderScenarios".
    ref: "concepts.md#methodsource-and-fieldsource"

  - id: parameterized-and-data-driven-tests-015
    difficulty: intermediate
    tags: [method-source, single-arg]
    question: |
      A single-parameter @ParameterizedTest uses @MethodSource. Which factory return
      type is valid without wrapping values in Arguments?
    options:
      - "A Stream<Integer> of the raw values"
      - "Only Stream<Arguments> is ever accepted"
      - "A Map keyed by index"
      - "An int[] is required"
    answer: 0
    explanation: |
      For a single-parameter test, the factory may return a Stream (or Iterable/array)
      of the raw values directly — e.g. Stream<Integer> — without the Arguments
      wrapper. Wrapping is only mandatory for multiple parameters.
    ref: "concepts.md#methodsource-and-fieldsource"

  - id: parameterized-and-data-driven-tests-016
    difficulty: advanced
    tags: [field-source]
    question: |
      What does @FieldSource("SCENARIOS") reference?
    options:
      - "A CSV file named SCENARIOS"
      - "An enum constant named SCENARIOS"
      - "A method named SCENARIOS that returns void"
      - "A static field (or instance field under PER_CLASS) holding a Collection/array/Supplier of Arguments"
    answer: 3
    explanation: |
      @FieldSource (Jupiter 5.11+) is the field analogue of @MethodSource: it reads a
      static field (or instance field under @TestInstance(PER_CLASS)) holding a
      Collection/array/Supplier of Arguments, so a dataset field can be shared.
    ref: "concepts.md#methodsource-and-fieldsource"

  - id: parameterized-and-data-driven-tests-017
    difficulty: beginner
    tags: [enum-source]
    question: |
      What is the benefit of @EnumSource(Status.class) on a parameterized test?
    options:
      - "It runs the test once per enum constant, so adding a new constant is automatically exercised"
      - "It converts the enum to a CSV file"
      - "It runs the test only for the first enum constant"
      - "It shuffles the enum order to detect ordering bugs"
    answer: 0
    explanation: |
      @EnumSource runs the test once per constant, guaranteeing every case is
      exercised — and it flags gaps when someone adds a constant but forgets to
      handle it, acting as a regression guard.
    ref: "concepts.md#enumsource"

  - id: parameterized-and-data-driven-tests-018
    difficulty: intermediate
    tags: [enum-source, mode]
    question: |
      You want @EnumSource to run for every constant *except* UNKNOWN and DEPRECATED.
      Which configuration is correct?
    options:
      - "@EnumSource(mode = EXCLUDE, names = {\"UNKNOWN\", \"DEPRECATED\"})"
      - "@EnumSource(mode = INCLUDE, names = {\"UNKNOWN\", \"DEPRECATED\"})"
      - "@EnumSource(mode = MATCH_ALL, names = {\"UNKNOWN\", \"DEPRECATED\"})"
      - "@EnumSource(names = {\"!UNKNOWN\", \"!DEPRECATED\"})"
    answer: 0
    explanation: |
      mode = EXCLUDE runs all constants except the listed names. INCLUDE (the default)
      would run *only* those two. MATCH_ALL/MATCH_ANY treat names as regexes.
    ref: "concepts.md#enumsource"

  - id: parameterized-and-data-driven-tests-019
    difficulty: advanced
    tags: [enum-source, regex]
    question: |
      Given @EnumSource(mode = MATCH_ANY, names = {"^ERROR_.*", ".*_FATAL$"}), which
      constants run?
    options:
      - "Only constants whose names exactly equal those two strings"
      - "Constants whose names match both regular expressions"
      - "Constants whose names match at least one of the two regular expressions"
      - "No constants, because regexes are not allowed in names"
    answer: 2
    explanation: |
      In MATCH_ANY mode, names are treated as regular expressions and a constant runs
      if it matches *any* of them. MATCH_ALL would require matching *all* the patterns.
    ref: "concepts.md#enumsource"

  - id: parameterized-and-data-driven-tests-020
    difficulty: advanced
    tags: [arguments-source, provider]
    question: |
      You need a reusable programmatic argument source that queries available time
      zones at runtime and reuse it across several tests. Which mechanism fits?
    options:
      - "A @CsvFileSource pointing at a generated file"
      - "Implement ArgumentsProvider and wire it with @ArgumentsSource"
      - "A @ValueSource with a Supplier attribute"
      - "A @RepeatedTest with a custom name"
    answer: 1
    explanation: |
      @ArgumentsSource with a custom ArgumentsProvider lets you generate arguments
      programmatically (returning a Stream<Arguments>) and reuse it across tests. All
      built-in sources are themselves thin annotations backed by providers.
    ref: "concepts.md#argumentssource-and-custom-argumentsprovider"

  - id: parameterized-and-data-driven-tests-021
    difficulty: advanced
    tags: [arguments-provider, api]
    question: |
      A custom ArgumentsProvider supplies its rows by implementing which core method?
    options:
      - "supply() returning an Object[]"
      - "generate() returning an Arbitrary"
      - "arguments() returning a List<String>"
      - "provideArguments(...) returning a Stream<? extends Arguments>"
    answer: 3
    explanation: |
      ArgumentsProvider defines provideArguments (given an ExtensionContext), which
      returns a Stream<? extends Arguments> — one element per invocation. (The exact
      signature has evolved across 5.x minor versions but the concept is stable.)
    ref: "concepts.md#argumentssource-and-custom-argumentsprovider"

  - id: parameterized-and-data-driven-tests-022
    difficulty: intermediate
    tags: [converters, implicit]
    question: |
      @ValueSource(strings = {"2026-01-31"}) feeds a method parameter of type
      LocalDate and it just works. Why?
    options:
      - "@ValueSource has a special dates attribute"
      - "LocalDate is treated as a String at runtime"
      - "JUnit applies implicit/fallback conversion, parsing the ISO-8601 string into LocalDate"
      - "The test silently skips because the types don't match"
    answer: 2
    explanation: |
      JUnit's implicit (fallback) conversion turns strings into many target types,
      including java.time types via ISO-8601, enums by name, UUID, File/Path, and any
      type with a single-String constructor or valueOf/of/parse factory.
    ref: "concepts.md#argument-converters"

  - id: parameterized-and-data-driven-tests-023
    difficulty: intermediate
    tags: [converters, convert-with]
    question: |
      You need to convert a CSV cell of a user *slug* into a fully-loaded User object
      before it reaches the test. Which mechanism do you use?
    options:
      - "@ConvertWith with a custom ArgumentConverter"
      - "@AggregateWith"
      - "@EnumSource"
      - "An ArgumentsAccessor parameter"
    answer: 0
    explanation: |
      Explicit conversion of a single column uses @ConvertWith plus an
      ArgumentConverter (or the type-safe TypedArgumentConverter). @AggregateWith is
      for collapsing *multiple* columns into one object.
    ref: "concepts.md#argument-converters"

  - id: parameterized-and-data-driven-tests-024
    difficulty: advanced
    tags: [converters, enum, gotcha]
    question: |
      A @CsvSource cell contains `admin` and the parameter is a Role enum whose
      constant is ADMIN. The test errors with a conversion failure. Why?
    options:
      - "Enums cannot be used as parameters"
      - "Implicit enum conversion is by constant name and is case-sensitive, so 'admin' does not match ADMIN"
      - "@CsvSource does not support enums; only @EnumSource does"
      - "The Role enum needs a no-arg constructor"
    answer: 1
    explanation: |
      Implicit conversion of a string to an enum matches the constant *name*
      case-sensitively (Enum.valueOf semantics). 'admin' != 'ADMIN', so it fails.
      Fix the data casing or supply a custom converter.
    ref: "concepts.md#argument-converters"

  - id: parameterized-and-data-driven-tests-025
    difficulty: advanced
    tags: [aggregators, accessor]
    question: |
      In a parameterized test you declare a single parameter of type ArgumentsAccessor.
      What does it give you?
    options:
      - "Typed access to all of the current row's arguments via getInteger(0), getString(1), etc."
      - "The number of remaining invocations"
      - "A mock of the class under test"
      - "The random seed used to generate the row"
    answer: 0
    explanation: |
      ArgumentsAccessor hands you the whole row with typed getters
      (getInteger(index), getString(index), get(index, Type.class)), useful for
      ad-hoc access when you don't want a separate parameter per column.
    ref: "concepts.md#argument-aggregators"

  - id: parameterized-and-data-driven-tests-026
    difficulty: advanced
    tags: [aggregators, aggregate-with]
    question: |
      Several CSV columns represent one Person object and you want the *test* signature
      to receive a single Person. Which approach keeps the signature clean and reusable?
    options:
      - "Declare each column as a separate parameter and build Person inside the test"
      - "@ConvertWith on the first column only"
      - "A custom ArgumentsAggregator wired with @AggregateWith on a Person parameter"
      - "@EnumSource(Person.class)"
    answer: 2
    explanation: |
      An ArgumentsAggregator (via @AggregateWith) collapses a group of columns into a
      single domain object, so the test declares one Person parameter and the mapping
      logic is reusable. @ConvertWith handles a single column, not a group.
    ref: "concepts.md#argument-aggregators"

  - id: parameterized-and-data-driven-tests-027
    difficulty: intermediate
    tags: [display-name, reporting]
    question: |
      Which @ParameterizedTest name template renders the 1-based invocation index and
      the first argument?
    options:
      - "name = \"{count} - {first}\""
      - "name = \"{iteration}:{arg1}\""
      - "name = \"{n} -> {a}\""
      - "name = \"[{index}] value={0}\""
    answer: 3
    explanation: |
      {index} is the 1-based invocation index and {0}, {1}, ... are the individual
      arguments. {arguments} would render the whole list. Good display names tell CI
      which input failed without opening the source.
    ref: "concepts.md#display-name-templates"

  - id: parameterized-and-data-driven-tests-028
    difficulty: beginner
    tags: [dynamic-tests, test-factory]
    question: |
      What does a @TestFactory method return?
    options:
      - "void, like a normal @Test"
      - "A DynamicNode, or a Stream/Collection/Iterable/array of DynamicNode (DynamicTest/DynamicContainer)"
      - "An Arbitrary<T>"
      - "A boolean indicating overall success"
    answer: 1
    explanation: |
      A @TestFactory method produces DynamicNode instances at runtime —
      either DynamicTest leaves or DynamicContainer groups — typically as a Stream or
      Collection. It does not itself contain assertions like a @Test.
    ref: "concepts.md#dynamic-tests-and-testfactory"

  - id: parameterized-and-data-driven-tests-029
    difficulty: intermediate
    tags: [dynamic-tests, vs-parameterized]
    question: |
      When is a @TestFactory / dynamic test the better choice over @ParameterizedTest?
    options:
      - "Always — dynamic tests have better IDE tooling"
      - "When you need per-invocation @BeforeEach callbacks"
      - "When the set of cases isn't known until runtime (e.g. computed from files or a service response) or you need a nested container structure"
      - "When inputs are a fixed compile-time table"
    answer: 2
    explanation: |
      Dynamic tests are generated at runtime, so they fit inputs unknown until the
      test runs, or when you want a tree of containers. For fixed, statically-known
      inputs, @ParameterizedTest has better tooling and per-invocation lifecycle.
    ref: "concepts.md#dynamic-tests-and-testfactory"

  - id: parameterized-and-data-driven-tests-030
    difficulty: advanced
    tags: [dynamic-tests, lifecycle, gotcha]
    question: |
      Each of your dynamic tests needs a fresh DB connection set up before it runs,
      so you added @BeforeEach. It never runs per dynamic test. Why?
    options:
      - "Dynamic tests ignore all annotations"
      - "@BeforeEach must be static for dynamic tests"
      - "You must use @BeforeAll instead"
      - "@BeforeEach/@AfterEach wrap the @TestFactory method once, not each generated DynamicTest; put per-case setup inside the Executable"
    answer: 3
    explanation: |
      Lifecycle callbacks do not wrap individual dynamic tests — they run once around
      the factory method. Because DynamicTests are generated on the fly, per-case
      setup/teardown must happen inside each DynamicTest's Executable.
    ref: "concepts.md#dynamic-tests-and-testfactory"

  - id: parameterized-and-data-driven-tests-031
    difficulty: intermediate
    tags: [dynamic-tests, structure]
    question: |
      Which pair correctly describes the two DynamicNode subtypes?
    options:
      - "DynamicTest (a named group) and DynamicContainer (a leaf assertion)"
      - "DynamicTest (a leaf with a display name + Executable) and DynamicContainer (a named group of child nodes)"
      - "DynamicLeaf and DynamicBranch"
      - "DynamicTest and DynamicStream"
    answer: 1
    explanation: |
      DynamicTest is a leaf: a display name plus an Executable holding the assertions.
      DynamicContainer is a named group holding child nodes, letting a factory build a
      tree of tests.
    ref: "concepts.md#dynamic-tests-and-testfactory"

  - id: parameterized-and-data-driven-tests-032
    difficulty: beginner
    tags: [property-based, definition]
    question: |
      What fundamentally distinguishes property-based testing from example-based
      testing?
    options:
      - "It runs tests in parallel"
      - "It only tests private methods"
      - "It replaces assertions with logging"
      - "You assert a property/invariant that must hold for all inputs, and the framework generates many random inputs to try to falsify it"
    answer: 3
    explanation: |
      In PBT you state an invariant that must hold for all valid inputs; the framework
      generates hundreds of random inputs (mixing in edge cases) trying to break it,
      rather than you enumerating specific input/output pairs.
    ref: "concepts.md#property-based-testing-the-model"

  - id: parameterized-and-data-driven-tests-033
    difficulty: intermediate
    tags: [property-based, shrinking]
    question: |
      A property-based test fails on a randomly generated 400-character string. The
      framework then reports a minimal failing input of a single character. This
      process is called what?
    options:
      - "Fuzzing"
      - "Sampling"
      - "Shrinking"
      - "Mutation"
    answer: 2
    explanation: |
      Shrinking reduces a failing input toward a minimal counterexample, so instead of
      debugging a huge random value you get the smallest input that still reproduces
      the failure.
    ref: "concepts.md#property-based-testing-the-model"

  - id: parameterized-and-data-driven-tests-034
    difficulty: intermediate
    tags: [property-based, jqwik, api]
    question: |
      In jqwik, how do you declare a property and its generated parameters?
    options:
      - "@Test with @Random parameters"
      - "@TestFactory returning Arbitrary values"
      - "@ParameterizedTest with @ValueSource(random = true)"
      - "@Property on the method with each parameter annotated @ForAll"
    answer: 3
    explanation: |
      jqwik uses @Property in place of @Test, with every generated parameter annotated
      @ForAll. By default it runs 1000 tries with values from an Arbitrary for each
      parameter.
    ref: "concepts.md#property-based-testing-the-model"

  - id: parameterized-and-data-driven-tests-035
    difficulty: advanced
    tags: [property-based, jqwik, generators]
    question: |
      In jqwik, a custom generator method that returns an Arbitrary<T> and is
      referenced by @ForAll("name") must be annotated with what?
    options:
      - "@MethodSource"
      - "@Provide"
      - "@Generator"
      - "@ArgumentsSource"
    answer: 1
    explanation: |
      @Provide marks a method returning an Arbitrary<T>; @ForAll("methodName")
      references it by name. Arbitraries are built via Arbitraries.* and composed with
      map/filter/flatMap/combine.
    ref: "concepts.md#property-based-testing-the-model"

  - id: parameterized-and-data-driven-tests-036
    difficulty: advanced
    tags: [property-based, reproducibility]
    question: |
      A property-based test failed once in CI with random inputs but you can't
      reproduce it locally. What is the standard way to reproduce it deterministically?
    options:
      - "Increase the number of tries to 100000"
      - "Disable shrinking"
      - "Convert it to a @RepeatedTest"
      - "Re-run using the seed the framework reported for the failing run"
    answer: 3
    explanation: |
      Each run prints a seed; rerunning with that fixed seed regenerates the exact
      same inputs, reproducing the failure. Afterwards you typically pin the shrunk
      counterexample as a concrete example test.
    ref: "concepts.md#property-based-testing-the-model"

  - id: parameterized-and-data-driven-tests-037
    difficulty: advanced
    tags: [property-based, assumptions]
    question: |
      In jqwik, what is the purpose of Assume.that(condition) inside a property?
    options:
      - "To assert the final result"
      - "To discard generated inputs that don't satisfy a precondition (guarded by maxDiscardRatio)"
      - "To fix the random seed"
      - "To enable shrinking"
    answer: 1
    explanation: |
      Assume.that filters out invalid inputs so the property is only checked against
      relevant ones. A maxDiscardRatio guard fails the property if too many inputs are
      discarded, preventing a vacuously passing test that generates nothing useful.
    ref: "concepts.md#property-based-testing-the-model"

  - id: parameterized-and-data-driven-tests-038
    difficulty: intermediate
    tags: [property-based, patterns, round-trip]
    question: |
      Which property best expresses a "round-trip" test for a serializer?
    options:
      - "encode(x) is never empty"
      - "encode(x) equals encode(y) whenever x equals y"
      - "decode(encode(x)) equals x for all x"
      - "encode is faster than decode"
    answer: 2
    explanation: |
      The round-trip (a.k.a. there-and-back) property states that decoding an encoded
      value returns the original for all inputs — a classic PBT pattern for
      serialization, compression, and parsing.
    ref: "concepts.md#when-property-based-beats-example-based"

  - id: parameterized-and-data-driven-tests-039
    difficulty: intermediate
    tags: [property-based, patterns, idempotence]
    question: |
      A normalization function should satisfy f(f(x)) == f(x). What property pattern
      is this?
    options:
      - "Commutativity"
      - "Idempotence"
      - "Round-trip"
      - "Oracle"
    answer: 1
    explanation: |
      Idempotence means applying the function twice yields the same result as once —
      common for normalization, distinct, and abs. Commutativity is order-independence;
      round-trip is inverse composition; oracle compares to a reference implementation.
    ref: "concepts.md#when-property-based-beats-example-based"

  - id: parameterized-and-data-driven-tests-040
    difficulty: advanced
    tags: [property-based, weak-property, gotcha]
    question: |
      A property for a sort function asserts only that the output has the same size as
      the input. Why is this dangerous?
    options:
      - "Size checks are not allowed in PBT"
      - "It will always fail due to shrinking"
      - "It makes the test non-reproducible"
      - "It passes vacuously for a broken sort that returns the unsorted input; you must also assert ordering and the same multiset of elements"
    answer: 3
    explanation: |
      A property that's too weak can pass for the wrong reason. Same-size alone accepts
      a no-op that never sorts; a correct sort property must also assert the result is
      ordered and is a permutation (same multiset) of the input.
    ref: "concepts.md#when-property-based-beats-example-based"

  - id: parameterized-and-data-driven-tests-041
    difficulty: intermediate
    tags: [property-based, oracle, patterns]
    question: |
      You have a heavily optimized implementation and a slow but obviously-correct
      brute-force version. Which property pattern compares them?
    options:
      - "Metamorphic"
      - "Oracle / model-based"
      - "Idempotence"
      - "Commutativity"
    answer: 1
    explanation: |
      The oracle (model-based) pattern asserts the fast implementation matches a
      simpler reference implementation for all inputs — an excellent way to test
      optimized algorithms without hand-writing expected outputs.
    ref: "concepts.md#when-property-based-beats-example-based"

  - id: parameterized-and-data-driven-tests-042
    difficulty: intermediate
    tags: [property-based, complementary]
    question: |
      Which statement best reflects the relationship between example-based and
      property-based tests?
    options:
      - "PBT fully replaces example-based tests"
      - "They are complementary: keep example tests for known business cases and pinned regressions, use PBT for invariants over all inputs"
      - "Example-based tests are obsolete once you write properties"
      - "PBT should only be used for UI tests"
    answer: 1
    explanation: |
      They complement each other. Example tests document specific business cases and
      regressions (a fixed bug becomes a specific example); PBT explores the input
      space for invariant violations. A PBT failure is often pinned as an example.
    ref: "concepts.md#when-property-based-beats-example-based"

  - id: parameterized-and-data-driven-tests-043
    difficulty: advanced
    tags: [combinatorial, pairwise]
    question: |
      Why does pairwise (all-pairs) testing dramatically reduce the number of test
      cases while retaining most defect-detection power?
    options:
      - "Because parameters never interact"
      - "Because empirical studies show most defects are triggered by the interaction of at most two parameters, so covering every value-pair catches them"
      - "Because it randomly samples 10% of combinations"
      - "Because it only tests the default values"
    answer: 1
    explanation: |
      NIST studies found the majority of defects are triggered by one- or two-parameter
      interactions. Pairwise generates a minimal set of rows where every pair of values
      (across any two parameters) appears together, catching those with far fewer cases.
    ref: "concepts.md#combinatorial-and-pairwise-testing"

  - id: parameterized-and-data-driven-tests-044
    difficulty: advanced
    tags: [combinatorial, explosion]
    question: |
      A feature has 4 parameters, each with 5 possible values. How many cases does
      *full combinatorial* (all-combinations) testing require, and what's the concern?
    options:
      - "20 cases; there is no concern"
      - "625 cases; the full Cartesian product explodes, motivating pairwise/t-wise reduction"
      - "9 cases; that's already the pairwise count"
      - "5 cases; one per parameter"
    answer: 1
    explanation: |
      5^4 = 625 combinations. The full Cartesian product grows explosively, which is
      exactly why pairwise (t=2) or t-wise reduction is used to keep the suite tractable
      while covering the interactions that matter most.
    ref: "concepts.md#combinatorial-and-pairwise-testing"

  - id: parameterized-and-data-driven-tests-045
    difficulty: advanced
    tags: [combinatorial, t-wise]
    question: |
      What does increasing t from 2 to 3 in t-wise (combinatorial) testing achieve?
    options:
      - "It covers all three-way value interactions, raising assurance at higher cost"
      - "It reduces the number of tests below pairwise"
      - "It disables shrinking"
      - "It switches to random sampling"
    answer: 0
    explanation: |
      t-wise generalizes pairwise: t=2 covers all value pairs, t=3 covers all
      three-way combinations. Higher t catches interaction bugs needing 3+ specific
      values but requires more test cases — a cost/assurance trade-off.
    ref: "concepts.md#combinatorial-and-pairwise-testing"

  - id: parameterized-and-data-driven-tests-046
    difficulty: beginner
    tags: [table-driven]
    question: |
      What is the core idea of a "table-driven" test?
    options:
      - "Store tests in a spreadsheet and import them"
      - "Define a table of {inputs -> expected} rows and run identical logic over each row"
      - "Only test database tables"
      - "Generate tests randomly at runtime"
    answer: 1
    explanation: |
      Table-driven testing defines a table of input/expected rows and runs the same
      logic per row. On the JVM it's expressed via @CsvSource/@MethodSource; in Go via
      a slice of structs plus t.Run. Adding a case is just adding a row.
    ref: "concepts.md#table-driven-tests"

  - id: parameterized-and-data-driven-tests-047
    difficulty: intermediate
    tags: [table-driven, anti-pattern]
    question: |
      Which is an anti-pattern in table-driven tests?
    options:
      - "Putting the literal expected value in each row"
      - "Naming the columns / display name"
      - "Computing each row's expected value by re-implementing the logic under test inside the test"
      - "Keeping rows independent and self-describing"
    answer: 2
    explanation: |
      If the test computes the expected value by re-running the same algorithm it's
      supposed to verify, it tests nothing (the "test mirrors the code" smell). Expected
      values should be literal/known-good and each row independent and self-describing.
    ref: "concepts.md#table-driven-tests"

  - id: parameterized-and-data-driven-tests-048
    difficulty: intermediate
    tags: [parameterized, repeated-test, comparison]
    question: |
      What is the difference between @ParameterizedTest and @RepeatedTest?
    options:
      - "They are aliases for the same thing"
      - "@ParameterizedTest runs with different inputs per invocation; @RepeatedTest runs the same test N times with no varying input"
      - "@RepeatedTest supports argument sources; @ParameterizedTest does not"
      - "@RepeatedTest generates random inputs"
    answer: 1
    explanation: |
      @ParameterizedTest varies inputs across invocations (data-driven).
      @RepeatedTest(n) repeats the identical test n times with no varying input —
      useful for probing timing/flakiness, not for data variation.
    ref: "concepts.md#why-parameterized-and-data-driven-tests"

  - id: parameterized-and-data-driven-tests-049
    difficulty: advanced
    tags: [parameterized, zero-invocations, gotcha]
    question: |
      A @ParameterizedTest whose @MethodSource returns an empty stream fails the build
      by default. Which statements are the correct explanation and remedy?
    options:
      - "It's a JVM bug; upgrade Java"
      - "By default a parameterized test with zero invocations is a configuration error; ensure the source is non-empty or (newer Jupiter) set allowZeroInvocations = true"
      - "Empty sources are silently skipped; nothing to fix"
      - "You must switch to @TestFactory"
    answer: 1
    explanation: |
      A parameterized test that produces zero invocations is treated as a configuration
      error by default. Either guarantee the source is non-empty, or in newer Jupiter
      set allowZeroInvocations = true when an empty set is legitimate.
    ref: "concepts.md#parameterizedtest-and-the-argument-sources"

  - id: parameterized-and-data-driven-tests-050
    difficulty: beginner
    tags: [design, equivalence-partitioning]
    question: |
      When choosing which inputs to put in a parameterized test's table, which two
      classic techniques guide the selection?
    options:
      - "Randomization and load testing"
      - "Equivalence partitioning and boundary-value analysis"
      - "Mutation testing and coverage gating"
      - "Contract testing and consumer-driven contracts"
    answer: 1
    explanation: |
      Equivalence partitioning picks one representative per class of behavior; boundary
      -value analysis targets edges (0, 1, max, max+1, empty, null). Together they make
      the chosen input rows deliberate rather than arbitrary.
    ref: "concepts.md#why-parameterized-and-data-driven-tests"
