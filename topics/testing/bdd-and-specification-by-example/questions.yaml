topic: "BDD & Specification by Example"
domain: testing
topic_slug: bdd-and-specification-by-example
version: 1
questions:
- id: bdd-and-specification-by-example-001
  difficulty: beginner
  tags: [bdd, fundamentals, collaboration]
  question: |
    What is the primary purpose of Behaviour-Driven Development (BDD)?
  options:
  - "To build shared understanding of desired behaviour among business, developers, and testers before coding"
  - "To replace all unit tests with UI automation"
  - "To measure code coverage of acceptance tests"
  - "To generate production code automatically from Gherkin"
  answer: 0
  explanation: |
    BDD's core aim is collaboration and shared understanding — aligning
    product, developers, and testers on what behaviour to build using concrete
    examples, before code is written. The automation is a by-product.
  ref: "concepts.md#bdd-as-an-evolution-of-tdd"

- id: bdd-and-specification-by-example-002
  difficulty: beginner
  tags: [bdd, tdd, history]
  question: |
    BDD was created by Dan North largely as a response to which problem teams
    had with TDD?
  options:
  - "TDD tests ran too slowly on CI servers"
  - "TDD required 100% branch coverage which was impractical"
  - "The word 'test' confused people about what, where, and how much to test, and disengaged stakeholders"
  - "TDD could only be applied to object-oriented languages"
  answer: 2
  explanation: |
    North found the word "test" unhelpful: developers struggled with what to
    test and where to start, and business stakeholders tuned out. Reframing
    around "behaviour" and "should" addressed this.
  ref: "concepts.md#bdd-as-an-evolution-of-tdd"

- id: bdd-and-specification-by-example-003
  difficulty: beginner
  tags: [given-when-then, structure]
  question: |
    In the Given-When-Then structure, what does the "Given" clause describe?
  options:
  - "The action or event being triggered"
  - "The expected observable outcome"
  - "The teardown steps after the scenario"
  - "The context or preconditions — putting the system in a known state"
  answer: 3
  explanation: |
    "Given" establishes context/preconditions (a known starting state). "When"
    is the event/action, and "Then" is the expected observable outcome.
  ref: "concepts.md#given-when-then-and-gherkin"

- id: bdd-and-specification-by-example-004
  difficulty: beginner
  tags: [given-when-then, structure]
  question: |
    Given-When-Then is essentially a business-readable rendering of which
    classic unit-test structure?
  options:
  - "Setup-Exercise-Verify-Teardown only"
  - "Arrange-Act-Assert"
  - "Red-Green-Refactor"
  - "Given-Then-Otherwise"
  answer: 1
  explanation: |
    Given maps to Arrange (context), When to Act (the event), and Then to
    Assert (the outcome). GWT is AAA phrased in ubiquitous language.
  ref: "concepts.md#given-when-then-and-gherkin"

- id: bdd-and-specification-by-example-005
  difficulty: intermediate
  tags: [bdd, tdd, comparison]
  question: |
    Which statement best captures how BDD differs from classic TDD?
  options:
  - "BDD keeps TDD's inner loop but adds a collaborative requirements layer and frames tests as behaviour in shared language"
  - "BDD abandons the red-green-refactor loop entirely"
  - "BDD only works for front-end code while TDD is for back-end"
  - "BDD forbids the use of mocks whereas TDD requires them"
  answer: 0
  explanation: |
    Mechanically the red-green-refactor loop is shared. BDD adds the
    collaborative discovery of requirements (three amigos, example mapping) and
    reframes from "testing code" to "specifying behaviour" in ubiquitous language.
  ref: "concepts.md#bdd-as-an-evolution-of-tdd"

- id: bdd-and-specification-by-example-006
  difficulty: beginner
  tags: [ubiquitous-language, ddd]
  question: |
    What is "ubiquitous language" in the context of BDD?
  options:
  - "A programming language that runs everywhere"
  - "The set of Gherkin keywords like Given/When/Then"
  - "A single shared vocabulary for domain concepts used consistently in conversation, specs, and code"
  - "An internationalization framework for feature files"
  answer: 2
  explanation: |
    Ubiquitous language (from Domain-Driven Design) is one vocabulary shared by
    business and engineering, used everywhere — conversations, feature files, and
    code — to eliminate translation bugs.
  ref: "concepts.md#ubiquitous-language-and-living-documentation"

- id: bdd-and-specification-by-example-007
  difficulty: intermediate
  tags: [living-documentation]
  question: |
    Why is a passing suite of Gherkin scenarios considered "living
    documentation" while a Confluence requirements doc is not?
  options:
  - "Gherkin files are stored in version control and Confluence is not"
  - "Gherkin is written in a more formal grammar"
  - "Confluence docs cannot contain tables"
  - "The scenarios run against the real system on every build, so they cannot silently drift out of date"
  answer: 3
  explanation: |
    Because executable specs are run against the system continuously, a spec
    that no longer matches behaviour fails and gets fixed. Static docs rot
    because nothing forces them to stay true.
  ref: "concepts.md#ubiquitous-language-and-living-documentation"

- id: bdd-and-specification-by-example-008
  difficulty: intermediate
  tags: [living-documentation, gotcha]
  question: |
    For living documentation to stay trustworthy and readable, scenarios should
    be written at which level?
  options:
  - "The UI-mechanics level (click button #save, type into #field)"
  - "The domain/behaviour level, free of implementation and UI detail"
  - "The SQL/query level so QA can verify the database"
  - "The HTTP/JSON payload level for maximum precision"
  answer: 1
  explanation: |
    Domain-level (declarative) scenarios survive cosmetic UI/implementation
    changes and read as documentation. UI-mechanics scenarios are brittle and
    read like scripts, defeating the documentation goal.
  ref: "concepts.md#ubiquitous-language-and-living-documentation"

- id: bdd-and-specification-by-example-009
  difficulty: beginner
  tags: [gherkin, keywords]
  question: |
    In a Gherkin feature file, what does the `Background` keyword do?
  options:
  - "Defines Given steps that run before every scenario in the feature/rule"
  - "Defines steps that run once before the entire feature file"
  - "Groups scenarios that illustrate one business rule"
  - "Marks a scenario to run in a separate thread"
  answer: 0
  explanation: |
    Background holds Given steps common to every scenario in the feature (or
    Rule); they run before each scenario (but after Before hooks). It is not a
    once-per-file setup.
  ref: "concepts.md#given-when-then-and-gherkin"

- id: bdd-and-specification-by-example-010
  difficulty: intermediate
  tags: [gherkin, keywords, synonyms]
  question: |
    In Gherkin, which pair are synonyms (interchangeable keywords)?
  options:
  - "Background and Rule"
  - "Given and Then"
  - "Scenario Outline and Scenario Template"
  - "Feature and Examples"
  answer: 2
  explanation: |
    Gherkin defines synonyms: Scenario = Example, Scenario Outline = Scenario
    Template, and Examples = Scenarios. Background/Rule and Given/Then are
    distinct keywords.
  ref: "concepts.md#given-when-then-and-gherkin"

- id: bdd-and-specification-by-example-011
  difficulty: beginner
  tags: [gherkin, keywords]
  question: |
    What is the recommended use of the `And` / `But` keywords in Gherkin?
  options:
  - "To create conditional branches within a scenario"
  - "To combine two separate scenarios into one"
  - "To mark optional steps that may be skipped"
  - "To continue the previous Given/When/Then keyword for readability"
  answer: 3
  explanation: |
    And/But simply continue whatever step keyword preceded them (e.g. multiple
    Givens or multiple Thens), improving readability. They carry no special
    matching semantics.
  ref: "concepts.md#given-when-then-and-gherkin"

- id: bdd-and-specification-by-example-012
  difficulty: intermediate
  tags: [gherkin, best-practice, smell]
  question: |
    Which scenario style is generally preferred in BDD?
  options:
  - "Imperative, UI-driven steps that specify exact fields and buttons"
  - "Declarative, domain-level steps describing business behaviour"
  - "Scenarios with multiple When/Then pairs to cover more per test"
  - "Steps that embed SQL so QA can verify state directly"
  answer: 1
  explanation: |
    Declarative domain-level steps ("When she transfers 200 USD") survive UI
    refactors, read as documentation, and are reusable. Imperative UI scripts are
    brittle and unreadable.
  ref: "concepts.md#given-when-then-and-gherkin"

- id: bdd-and-specification-by-example-013
  difficulty: intermediate
  tags: [gherkin, best-practice]
  question: |
    A reviewer flags a scenario that has two `When` steps each followed by a
    `Then`. Why is this usually a smell?
  options:
  - "It typically means two behaviours are crammed into one scenario and should be split"
  - "Cucumber cannot parse more than one When per scenario"
  - "The second When always overwrites the first in step matching"
  - "Then steps are not allowed after the first When"
  answer: 0
  explanation: |
    A scenario should exercise one behaviour (ideally one When). Multiple
    When/Then pairs usually indicate two scenarios merged together, which hurts
    clarity and failure diagnosis.
  ref: "concepts.md#given-when-then-and-gherkin"

- id: bdd-and-specification-by-example-014
  difficulty: beginner
  tags: [cucumber, feature-files, step-definitions]
  question: |
    In Cucumber, what is the relationship between a feature file and a step
    definition?
  options:
  - "The feature file contains code and the step definition contains Gherkin"
  - "They are the same file with different extensions"
  - "The feature file holds business-readable Gherkin (the 'what'); step definitions are code that binds each step to the system (the 'how')"
  - "Step definitions generate feature files automatically"
  answer: 2
  explanation: |
    Feature files are the Gherkin scenarios (the what). Step definitions are
    annotated methods — the glue — that match a step's text and execute it
    against the system under test (the how).
  ref: "concepts.md#feature-files-and-step-definitions-cucumber"

- id: bdd-and-specification-by-example-015
  difficulty: intermediate
  tags: [cucumber, step-matching, gotcha]
  question: |
    In Cucumber-JVM, does the keyword (Given/When/Then) affect how a step is
    matched to a step definition?
  options:
  - "Yes — a @Given method can only match steps beginning with Given"
  - "Yes — the keyword must exactly match or Cucumber throws an AmbiguousStepException"
  - "Only when using regex; Cucumber Expressions ignore the keyword"
  - "No — Cucumber matches on the step text only; the keyword is for humans, so a @Given method can match a 'When' step"
  answer: 3
  explanation: |
    Cucumber strips the leading keyword and matches on the remaining text. The
    keyword has no significance for lookup, so a step definition annotated with
    @Given can match a step written with When.
  ref: "concepts.md#feature-files-and-step-definitions-cucumber"

- id: bdd-and-specification-by-example-016
  difficulty: intermediate
  tags: [cucumber, cucumber-expressions]
  question: |
    In modern Cucumber-JVM, what is a Cucumber Expression such as
    `she transfers {double} USD` preferred over?
  options:
  - "Plain string equality matching"
  - "Raw regular expressions, which are less readable"
  - "XPath selectors"
  - "JSONPath expressions"
  answer: 1
  explanation: |
    Cucumber Expressions ({int}, {string}, {double}, custom parameter types)
    are the readable alternative to raw regex. Regex is still supported for cases
    needing its power.
  ref: "concepts.md#feature-files-and-step-definitions-cucumber"

- id: bdd-and-specification-by-example-017
  difficulty: advanced
  tags: [cucumber, state-sharing, gotcha, flaky]
  question: |
    A team shares state between step-definition classes using `static` fields.
    Scenarios pass alone but fail intermittently when the suite runs. What is the
    correct fix?
  options:
  - "Share state via dependency injection (PicoContainer/cucumber-spring) instead of static fields"
  - "Add Thread.sleep between scenarios to let state settle"
  - "Run every scenario in its own JVM"
  - "Convert all step definitions into a single giant class"
  answer: 0
  explanation: |
    Static fields leak state across scenarios, causing order-dependent flakiness.
    Cucumber creates fresh step-def instances per scenario; to share across
    classes use DI (PicoContainer or cucumber-spring), which scopes state to the
    scenario.
  ref: "concepts.md#feature-files-and-step-definitions-cucumber"

- id: bdd-and-specification-by-example-018
  difficulty: intermediate
  tags: [cucumber, hooks, background]
  question: |
    Cucumber `@Before`/`@After` hooks and Gherkin `Background` can both set up
    state. Which statement about choosing between them is correct?
  options:
  - "Hooks are always preferred because they are visible in the feature file"
  - "They are identical and interchangeable"
  - "Background is preferred for setup that readers should see, since hooks are invisible to people reading only the feature files"
  - "Background runs after the first step whereas hooks run before the feature"
  answer: 2
  explanation: |
    Hook logic is invisible to anyone reading only the feature files. When setup
    is part of the story readers should understand, Background makes it explicit;
    hooks suit technical setup/teardown that shouldn't clutter the spec.
  ref: "concepts.md#feature-files-and-step-definitions-cucumber"

- id: bdd-and-specification-by-example-019
  difficulty: advanced
  tags: [cucumber, junit5, tooling, versions]
  question: |
    To run Cucumber scenarios under JUnit 5, which component is used?
  options:
  - "@RunWith(Cucumber.class) with @CucumberOptions"
  - "The TestNG Cucumber adapter"
  - "A Maven Surefire plugin flag, with no engine required"
  - "The cucumber-junit-platform-engine, discovered by the JUnit Platform"
  answer: 3
  explanation: |
    JUnit 5 uses cucumber-junit-platform-engine (configured via a @Suite class
    and junit-platform.properties). The @RunWith(Cucumber.class) + @CucumberOptions
    approach is the older JUnit 4 runner.
  ref: "concepts.md#feature-files-and-step-definitions-cucumber"

- id: bdd-and-specification-by-example-020
  difficulty: intermediate
  tags: [cucumber, glue]
  question: |
    In Cucumber, what does the term "glue" refer to?
  options:
  - "The adhesive layer merging multiple feature files"
  - "The package(s) containing step definitions and support/hook code"
  - "The reporting plugin that produces HTML output"
  - "The mechanism that joins data table rows"
  answer: 1
  explanation: |
    Glue is the location (package) of step definitions and hooks, configured via
    cucumber.glue / --glue. It tells Cucumber where to find the code that
    implements the steps.
  ref: "concepts.md#feature-files-and-step-definitions-cucumber"

- id: bdd-and-specification-by-example-021
  difficulty: beginner
  tags: [specification-by-example, adzic]
  question: |
    Specification by Example (Gojko Adzic) advocates specifying requirements
    primarily how?
  options:
  - "With realistic concrete examples, including edge and negative cases"
  - "As abstract 'the system shall…' prose statements"
  - "As UML sequence diagrams reviewed by architects"
  - "Only as automated tests written after coding"
  answer: 0
  explanation: |
    SbE illustrates requirements using concrete, realistic examples with real
    data (including edge/negative cases) — the examples themselves are the
    specification, refined collaboratively and then automated.
  ref: "concepts.md#specification-by-example-and-example-mapping"

- id: bdd-and-specification-by-example-022
  difficulty: intermediate
  tags: [example-mapping, technique]
  question: |
    In Example Mapping, what do the four card colours represent?
  options:
  - "Yellow=examples, Blue=story, Green=rules, Red=bugs"
  - "Yellow=tests, Blue=code, Green=passing, Red=failing"
  - "Yellow=story, Blue=rules, Green=examples, Red=questions/unknowns"
  - "Yellow=epic, Blue=sprint, Green=done, Red=blocked"
  answer: 2
  explanation: |
    Example Mapping (Matt Wynne) uses yellow for the story, blue for business
    rules, green for concrete examples illustrating rules, and red for open
    questions/unknowns.
  ref: "concepts.md#specification-by-example-and-example-mapping"

- id: bdd-and-specification-by-example-023
  difficulty: intermediate
  tags: [example-mapping, readiness]
  question: |
    During an Example Mapping session a story accumulates many red cards. What
    does this most likely indicate?
  options:
  - "The story is ready to build immediately"
  - "The story has too many examples and should be automated"
  - "The team should split the story into smaller stories"
  - "There are many open questions/unknowns, so the story is not yet ready and needs more analysis"
  answer: 3
  explanation: |
    Red cards are unanswered questions. Lots of reds means the story isn't
    understood well enough to build — it needs more discovery. (Many blue rules,
    by contrast, suggests the story is too big and should be split.)
  ref: "concepts.md#specification-by-example-and-example-mapping"

- id: bdd-and-specification-by-example-024
  difficulty: beginner
  tags: [three-amigos, collaboration]
  question: |
    The "three amigos" in BDD refers to three what?
  options:
  - "Three test frameworks used together"
  - "Three perspectives — business/product, development, and testing/QA"
  - "Three environments: dev, staging, prod"
  - "Three senior engineers who approve every story"
  answer: 1
  explanation: |
    The three amigos are three viewpoints — business/product, development, and
    testing/QA — that examine a story together. "Three" counts perspectives, not
    people.
  ref: "concepts.md#the-three-amigos"

- id: bdd-and-specification-by-example-025
  difficulty: intermediate
  tags: [three-amigos, value]
  question: |
    What is the main value of holding a three-amigos conversation before coding?
  options:
  - "It catches misunderstanding early, where it is cheapest to fix, and produces shared concrete examples"
  - "It reduces the number of Git branches needed"
  - "It guarantees 100% test coverage"
  - "It removes the need for any automated tests"
  answer: 0
  explanation: |
    Surfacing a disagreement in a five-minute conversation is far cheaper than
    building the wrong behaviour and discovering it in UAT/production. The output
    is shared examples plus a list of open questions.
  ref: "concepts.md#the-three-amigos"

- id: bdd-and-specification-by-example-026
  difficulty: advanced
  tags: [three-amigos, qa-perspective]
  question: |
    In a three-amigos session, which perspective most naturally generates the
    negative and boundary examples?
  options:
  - "Business/product"
  - "Development"
  - "Testing/QA, with its adversarial 'what could go wrong?' viewpoint"
  - "The Scrum Master"
  answer: 2
  explanation: |
    The testing/QA perspective specialises in "what-if" and failure cases,
    surfacing negative and boundary examples the business often overlooks and
    developers may not consider.
  ref: "concepts.md#the-three-amigos"

- id: bdd-and-specification-by-example-027
  difficulty: intermediate
  tags: [executable-specifications, layers]
  question: |
    What defines an "executable specification"?
  options:
  - "A specification stored in an executable file format"
  - "A script that generates specifications from code"
  - "A performance test that measures spec execution time"
  - "A specification (concrete examples) that is also an automated test — the same artifact read by humans and executed by machines"
  answer: 3
  explanation: |
    An executable specification is simultaneously a human-readable requirement
    and a machine-run test. This dual nature is what makes living documentation
    possible.
  ref: "concepts.md#executable-specifications"

- id: bdd-and-specification-by-example-028
  difficulty: advanced
  tags: [executable-specifications, automation-layer, design]
  question: |
    Fowler and Adzic stress separating the layers of an executable specification.
    What is the main benefit of keeping a thin automation/driver layer (DSL, page
    objects) beneath the step definitions?
  options:
  - "It makes the Gherkin run faster at the JVM level"
  - "UI or wiring changes touch one place rather than hundreds of scenarios"
  - "It allows scenarios to be written in multiple human languages"
  - "It eliminates the need for step definitions entirely"
  answer: 1
  explanation: |
    Concentrating technical detail in a reusable automation layer means a UI or
    integration change is fixed in one spot, keeping the (many) feature files and
    steps stable and readable.
  ref: "concepts.md#executable-specifications"

- id: bdd-and-specification-by-example-029
  difficulty: advanced
  tags: [executable-specifications, cost, trade-off]
  question: |
    What is a genuine cost/trade-off of expressing behaviour as executable Gherkin
    specs rather than plain JUnit assertions?
  options:
  - "There are now three artifacts (feature, step defs, code) to keep in sync, and Gherkin adds a layer of indirection"
  - "Gherkin cannot express negative test cases"
  - "Gherkin scenarios cannot be run on CI"
  - "Executable specs prevent refactoring of production code"
  answer: 0
  explanation: |
    The Gherkin layer adds indirection and a third artifact to maintain. It is
    only worth paying for business-facing behaviour that stakeholders read; for
    pure technical logic a plain unit test is clearer.
  ref: "concepts.md#executable-specifications"

- id: bdd-and-specification-by-example-030
  difficulty: beginner
  tags: [atdd, acronyms]
  question: |
    What does ATDD stand for?
  options:
  - "Automated Test-Driven Design"
  - "Agile Team Development Discipline"
  - "Acceptance-Test-Driven Development"
  - "Assertion-Targeted Debugging Directive"
  answer: 2
  explanation: |
    ATDD is Acceptance-Test-Driven Development — driving development from
    acceptance criteria agreed with the customer, writing the acceptance test
    first and building until it passes.
  ref: "concepts.md#bdd-vs-tdd-vs-atdd"

- id: bdd-and-specification-by-example-031
  difficulty: intermediate
  tags: [bdd, atdd, tdd, comparison]
  question: |
    Which best distinguishes the emphasis of TDD, ATDD, and BDD?
  options:
  - "TDD = UI tests, ATDD = API tests, BDD = database tests"
  - "They are three names for exactly the same practice with no differences"
  - "TDD and ATDD are manual; only BDD is automated"
  - "TDD = building the code right (unit); ATDD = meeting agreed acceptance criteria; BDD = shared understanding via ubiquitous language and conversation"
  answer: 3
  explanation: |
    TDD is a developer design discipline at the unit level; ATDD drives from
    agreed acceptance criteria; BDD emphasises shared language and collaboration.
    ATDD and BDD overlap heavily and both wrap TDD's inner loop.
  ref: "concepts.md#bdd-vs-tdd-vs-atdd"

- id: bdd-and-specification-by-example-032
  difficulty: intermediate
  tags: [bdd, atdd, comparison]
  question: |
    A candidate says "BDD and ATDD are basically the same." What is the most
    accurate refinement of that claim?
  options:
  - "They are unrelated; ATDD is manual and BDD is automated"
  - "They overlap heavily and are often used interchangeably; BDD stresses communication/ubiquitous language, ATDD stresses driving from acceptance criteria"
  - "ATDD is a strict subset of TDD, while BDD replaces TDD"
  - "BDD works only with Cucumber; ATDD works only with FitNesse"
  answer: 1
  explanation: |
    Both are outside-in and example-driven and are frequently treated as
    synonyms. The nuance: BDD emphasises shared language and conversation; ATDD
    emphasises acceptance criteria as the driver. Both contain TDD's inner loop.
  ref: "concepts.md#bdd-vs-tdd-vs-atdd"

- id: bdd-and-specification-by-example-033
  difficulty: beginner
  tags: [outside-in, development]
  question: |
    Outside-in development, as practised in BDD, means starting from what?
  options:
  - "The user-visible behaviour (an acceptance test) and working inward to the units needed to satisfy it"
  - "The database schema and building upward"
  - "The leaf utility classes and composing them into features"
  - "The CI pipeline configuration"
  answer: 0
  explanation: |
    Outside-in starts from the outer, user-facing behaviour (a failing acceptance
    scenario) and drives inward, building only the collaborating units required to
    make it pass.
  ref: "concepts.md#outside-in-development-double-loop-tdd"

- id: bdd-and-specification-by-example-034
  difficulty: advanced
  tags: [outside-in, double-loop, mocks]
  question: |
    In double-loop TDD, what are the outer and inner loops?
  options:
  - "Outer = compile, inner = link"
  - "Outer = manual testing; inner = automated testing"
  - "Outer = slow failing acceptance/BDD test; inner = fast red-green-refactor unit tests that drive out collaborators"
  - "Outer = integration test; inner = mutation test"
  answer: 2
  explanation: |
    The outer loop is a failing acceptance scenario (stays red until the feature
    works end-to-end). The inner loop is ordinary unit-level red-green-refactor
    that builds the units needed, often discovering interfaces via mocks.
  ref: "concepts.md#outside-in-development-double-loop-tdd"

- id: bdd-and-specification-by-example-035
  difficulty: advanced
  tags: [outside-in, mockist, classicist]
  question: |
    Which mocking style pairs most naturally with outside-in development?
  options:
  - "The classicist/Detroit style that avoids mocks and tests through real collaborators"
  - "Neither — outside-in forbids test doubles"
  - "Only spies, never stubs or mocks"
  - "The mockist/London style, using mocks to discover and specify collaborator interfaces"
  answer: 3
  explanation: |
    Outside-in pairs with the mockist/London school: as you drive inward you mock
    not-yet-built collaborators, letting their interfaces emerge from the needs of
    the code under test. (See test-doubles-and-mocking-taxonomy.)
  ref: "concepts.md#outside-in-development-double-loop-tdd"

- id: bdd-and-specification-by-example-036
  difficulty: intermediate
  tags: [scenario-outline, gherkin]
  question: |
    When should you use a `Scenario Outline` with an `Examples` table?
  options:
  - "To pass a collection of data into a single step"
  - "To run the same behaviour across many input/output combinations, one run per data row"
  - "To define setup shared across the whole feature"
  - "To group scenarios under a business rule"
  answer: 1
  explanation: |
    A Scenario Outline is a template run once per Examples row (header excluded),
    ideal for checking the same behaviour across many combinations, especially
    boundary values.
  ref: "concepts.md#scenario-outlines-and-data-tables"

- id: bdd-and-specification-by-example-037
  difficulty: advanced
  tags: [scenario-outline, data-table, gotcha]
  question: |
    What is the key difference between a Scenario Outline's `Examples` table and a
    Data Table attached to a step?
  options:
  - "Examples parameterise the entire scenario (each row is a full test run); a Data Table passes a collection to a single step within one run"
  - "There is no difference; both parameterise the whole scenario"
  - "Data Tables can only hold numbers; Examples can hold strings"
  - "Examples run in parallel; Data Tables run sequentially"
  answer: 0
  explanation: |
    Examples rows each trigger a full run of the scenario template. A Data Table
    is an argument to one step (one run), typically a list/map of rows. Confusing
    the two is a common mistake.
  ref: "concepts.md#scenario-outlines-and-data-tables"

- id: bdd-and-specification-by-example-038
  difficulty: intermediate
  tags: [scenario-outline, gherkin, semantics]
  question: |
    A Scenario Outline has an Examples table with a header row and 4 data rows.
    How many times does the scenario execute?
  options:
  - "5 times (including the header)"
  - "1 time, using the first data row"
  - "4 times (once per data row; the header is not counted)"
  - "8 times (each row twice)"
  answer: 2
  explanation: |
    The outline runs once per data row, and the header row is not counted — so 4
    data rows produce 4 executions.
  ref: "concepts.md#scenario-outlines-and-data-tables"

- id: bdd-and-specification-by-example-039
  difficulty: advanced
  tags: [cucumber, data-table, step-definitions]
  question: |
    A Gherkin step is followed by a data table of accounts with columns
    owner/type/balance. In Cucumber-JVM, which parameter shape most naturally
    receives one map per row?
  options:
  - "String"
  - "int[][]"
  - "Optional<DataTable>"
  - "List<Map<String, String>> (via DataTable.asMaps())"
  answer: 3
  explanation: |
    DataTable.asMaps() yields List<Map<String,String>> — one map per data row
    keyed by the header — the idiomatic way to consume a table with a header row.
  ref: "concepts.md#scenario-outlines-and-data-tables"

- id: bdd-and-specification-by-example-040
  difficulty: intermediate
  tags: [when-bdd-helps, trade-off]
  question: |
    In which situation does BDD/Gherkin most clearly justify its overhead?
  options:
  - "A low-level string-hashing utility with no business stakeholders"
  - "Rich business rules (pricing/eligibility/regulatory) that non-technical stakeholders must read and validate"
  - "A one-off data-migration script"
  - "Micro-optimising a sorting algorithm"
  answer: 1
  explanation: |
    BDD shines where requirements are ambiguous/high-risk and non-technical
    stakeholders need to read and validate behaviour, especially rich rule-heavy
    domains. Purely technical, developer-facing logic doesn't benefit.
  ref: "concepts.md#when-bdd-helps-vs-when-it-adds-overhead"

- id: bdd-and-specification-by-example-041
  difficulty: intermediate
  tags: [when-bdd-helps, anti-pattern]
  question: |
    A team adopts Cucumber purely as a test runner: developers write feature files
    after coding, and the business never reads them. What is the most accurate
    assessment?
  options:
  - "This is 'Cucumber without collaboration' — all the cost of BDD with none of its value; a plain unit/integration test would be cheaper and clearer"
  - "This is ideal BDD and should be encouraged"
  - "This guarantees better coverage than TDD"
  - "This is fine as long as scenarios pass on CI"
  answer: 0
  explanation: |
    Skipping the three-amigos conversation and writing features after the fact,
    unread by the business, is the classic anti-pattern: you pay the indirection
    cost of Gherkin while gaining none of the shared-understanding value.
  ref: "concepts.md#when-bdd-helps-vs-when-it-adds-overhead"

- id: bdd-and-specification-by-example-042
  difficulty: advanced
  tags: [test-pyramid, cross-topic, anti-pattern]
  question: |
    How should BDD acceptance scenarios relate to the test pyramid?
  options:
  - "They should replace the base of fast unit tests"
  - "They belong at the very bottom because they are cheap"
  - "They sit near the top (fewer, slower, high-value) and should not replace the broad base of fast unit tests"
  - "They make the pyramid irrelevant"
  answer: 2
  explanation: |
    Acceptance/BDD scenarios are high-value but slow, so they belong near the top
    in modest numbers. Over-relying on end-to-end Gherkin inverts the pyramid into
    an "ice-cream cone" — slow, brittle, expensive.
  ref: "concepts.md#common-follow-up-questions"

- id: bdd-and-specification-by-example-043
  difficulty: intermediate
  tags: [collaboration-vs-automation, value]
  question: |
    According to BDD's originators, what is the primary source of BDD's value?
  options:
  - "The automated Gherkin tests it produces"
  - "The HTML reports generated for managers"
  - "The reduction in lines of production code"
  - "The conversations and shared understanding it forces; automation is a by-product that keeps that understanding honest"
  answer: 3
  explanation: |
    North, Keogh, Adzic, and Hellesøy all stress that the conversations and
    shared understanding are the real value. Automation is a by-product that keeps
    the understanding from drifting.
  ref: "concepts.md#collaboration-vs-automation-the-real-value"

- id: bdd-and-specification-by-example-044
  difficulty: advanced
  tags: [collaboration-vs-automation, roi]
  question: |
    Which statement best reflects the asymmetry between conversation and tooling
    in BDD?
  options:
  - "You need Cucumber to get any value from BDD"
  - "A team can gain most of BDD's value from conversations/example mapping without Cucumber, but can get negative value from Cucumber if it skips the conversation"
  - "Tooling matters more than the conversation for defect prevention"
  - "Conversations only matter for front-end teams"
  answer: 1
  explanation: |
    Most ROI comes from catching misunderstanding early in the conversation. The
    tool without the conversation adds indirection and maintenance for no
    shared-understanding gain — potentially net-negative.
  ref: "concepts.md#collaboration-vs-automation-the-real-value"

- id: bdd-and-specification-by-example-045
  difficulty: beginner
  tags: [bdd, naming, should]
  question: |
    Dan North suggested naming behaviours with "should" (e.g.
    shouldRejectWithdrawalWhenOverdrawn). What advantage does this framing give?
  options:
  - "It reads as a specification of behaviour, tells you what to build next, and doubles as documentation when it fails"
  - "It runs the test faster"
  - "It enables parallel execution"
  - "It removes the need for assertions"
  answer: 0
  explanation: |
    A "should" sentence specifies behaviour rather than testing code: it clarifies
    the next behaviour to implement and produces a self-documenting failure
    message.
  ref: "concepts.md#bdd-as-an-evolution-of-tdd"

- id: bdd-and-specification-by-example-046
  difficulty: intermediate
  tags: [gherkin, rule, keyword]
  question: |
    What does the Gherkin `Rule` keyword (introduced in Gherkin 6) express?
  options:
  - "A validation constraint on data table cells"
  - "A regex rule for matching steps"
  - "One business rule, grouping the scenarios that illustrate it"
  - "A CI rule for when to run the feature"
  answer: 2
  explanation: |
    Rule represents a single business rule and groups the scenarios/examples that
    demonstrate it, giving structure that mirrors the blue rule cards from example
    mapping.
  ref: "concepts.md#given-when-then-and-gherkin"

- id: bdd-and-specification-by-example-047
  difficulty: advanced
  tags: [cucumber, doc-strings, data-table]
  question: |
    In Cucumber-JVM, how are a step's Doc String or Data Table passed to the step
    definition method?
  options:
  - "As the first parameter, before any Cucumber Expression captures"
  - "Via a static ThreadLocal the method must read"
  - "They cannot be passed to Java step definitions"
  - "As the last parameter of the step definition method"
  answer: 3
  explanation: |
    Both Doc Strings (as String) and Data Tables (as DataTable or a mapped
    collection) are automatically passed as the last argument to the step
    definition method.
  ref: "concepts.md#feature-files-and-step-definitions-cucumber"

- id: bdd-and-specification-by-example-048
  difficulty: intermediate
  tags: [when-bdd-helps, scenario, smell]
  question: |
    A Cucumber suite has become slow and flaky: every scenario drives the full UI,
    steps are imperative, and most logic could be covered lower down. Which set of
    fixes best addresses this?
  options:
  - "Add more end-to-end scenarios to cover the gaps"
  - "Write declarative domain-level steps, keep a clean automation layer, push most coverage to fast unit tests, and share state via DI"
  - "Increase CI timeouts and retry flaky scenarios automatically"
  - "Convert all step definitions to static methods for speed"
  answer: 1
  explanation: |
    The remedy is declarative steps, a maintained automation layer (page
    objects/DSL), honoring the test pyramid by moving coverage to fast unit tests,
    and DI-scoped state — not more slow E2E scenarios or blind retries.
  ref: "concepts.md#when-bdd-helps-vs-when-it-adds-overhead"

- id: bdd-and-specification-by-example-049
  difficulty: intermediate
  tags: [three-amigos, headcount]
  question: |
    Does a three-amigos session require exactly three people?
  options:
  - "No — 'three' counts the perspectives (business, dev, test) that must meet, not the number of attendees"
  - "Yes — exactly three, no more, no less"
  - "Yes — one developer, one manager, one customer"
  - "No — it always requires at least five people"
  answer: 0
  explanation: |
    "Three" refers to the three viewpoints that need to be represented, not a
    headcount. What matters is that the business, development, and testing
    perspectives all participate.
  ref: "concepts.md#the-three-amigos"

- id: bdd-and-specification-by-example-050
  difficulty: advanced
  tags: [cucumber-spring, cross-topic, di]
  question: |
    A Spring Boot service uses Cucumber for acceptance tests and needs its step
    definitions to obtain Spring-managed beans and share scenario state. Which
    approach is idiomatic?
  options:
  - "Instantiate beans manually with new in each step"
  - "Store beans in static fields on a helper class"
  - "Use the cucumber-spring integration so step defs are wired by the Spring context and state is scenario-scoped"
  - "Use @SpringBootTest on the feature file directly"
  answer: 2
  explanation: |
    cucumber-spring integrates Cucumber with the Spring context, injecting beans
    into step definitions and scoping shared state per scenario — avoiding manual
    instantiation and leaky statics. (Spring-specific slices live in the
    spring-boot domain.)
  ref: "concepts.md#feature-files-and-step-definitions-cucumber"

- id: bdd-and-specification-by-example-051
  difficulty: beginner
  tags: [specification-by-example, terminology]
  question: |
    How do "BDD" and "Specification by Example" relate?
  options:
  - "They are opposing methodologies that cannot be combined"
  - "Specification by Example is a subset of unit testing"
  - "BDD is manual and Specification by Example is automated"
  - "They are largely two names/lineages for the same set of collaborative, example-driven practices"
  answer: 3
  explanation: |
    BDD (Dan North) and Specification by Example (Gojko Adzic) are essentially two
    names for the same discipline — illustrate requirements with concrete examples,
    collaborate, and automate them as living documentation.
  ref: "concepts.md#specification-by-example-and-example-mapping"

- id: bdd-and-specification-by-example-052
  difficulty: advanced
  tags: [gherkin, when, best-practice]
  question: |
    Which "Then" step is best aligned with BDD guidance?
  options:
  - "Then the row in the ACCOUNTS table should have balance_cents = 30000"
  - "Then her checking balance should be 300.00 USD"
  - "Then the internal AccountAggregate.dirtyFlag should be false"
  - "Then the REST controller should return HTTP 200 with a specific JSON envelope shape"
  answer: 1
  explanation: |
    Then should assert an observable, domain-level outcome the actor cares about.
    Asserting DB columns, internal flags, or transport envelope details couples the
    spec to implementation and hurts readability/durability.
  ref: "concepts.md#given-when-then-and-gherkin"
