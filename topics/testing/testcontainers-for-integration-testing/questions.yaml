topic: "Testcontainers for Integration Testing"
domain: testing
topic_slug: testcontainers-for-integration-testing
version: 1
questions:
  - id: testcontainers-for-integration-testing-001
    difficulty: beginner
    tags: [definition, docker]
    question: |
      What does Testcontainers fundamentally provide to a test suite?
    options:
      - "Real dependencies (databases, brokers, etc.) run as throwaway Docker containers, wired into the test at runtime"
      - "A mocking framework that replaces every external collaborator with in-process stubs"
      - "A static code analysis engine that instruments bytecode to report test coverage"
      - "An in-memory database engine that emulates the Postgres wire protocol and dialect"
    answer: 0
    explanation: |
      Testcontainers starts the actual engine (Postgres, Kafka, Redis, ...) as a
      disposable Docker container for the duration of the test, so the test runs
      against the real driver, dialect and protocol rather than a fake.
    ref: "concepts.md#why-testcontainers-over-in-memory-fakes"

  - id: testcontainers-for-integration-testing-002
    difficulty: beginner
    tags: [fidelity, h2, fakes]
    question: |
      What is the main advantage of using a real Postgres container over an
      in-memory H2 database in tests?
    options:
      - "It boots in a few milliseconds because the engine is cached in a warm pool between methods"
      - "It runs entirely within the JVM and therefore needs no Docker daemon or container runtime"
      - "It exercises the exact production SQL dialect and features, avoiding false confidence from an emulator"
      - "It shares the host page cache and so consumes far less memory than an embedded database"
    answer: 2
    explanation: |
      H2 only emulates Postgres imperfectly; vendor features (jsonb, ON CONFLICT,
      CTEs, extensions, migrations) can behave differently. A real container runs
      the production engine, catching dialect bugs a fake hides.
    ref: "concepts.md#why-testcontainers-over-in-memory-fakes"

  - id: testcontainers-for-integration-testing-003
    difficulty: beginner
    tags: [trade-off, cost]
    question: |
      What is the primary cost of using Testcontainers compared to an in-memory fake?
    options:
      - "The JDBC driver strips result sets, so it cannot assert on the rows a query returns"
      - "It ships only a Java client library and cannot be used from any other language ecosystem"
      - "It blocks Flyway and Liquibase, so schema migrations cannot be applied before a test"
      - "Startup time (seconds) plus a dependency on a Docker daemon"
    answer: 3
    explanation: |
      Booting a real engine takes seconds versus milliseconds for an in-memory
      fake, and it requires Docker to be available. The trade-off is fidelity
      for speed.
    ref: "concepts.md#why-testcontainers-over-in-memory-fakes"

  - id: testcontainers-for-integration-testing-004
    difficulty: intermediate
    tags: [fidelity, sql, scenario]
    question: |
      A repository test uses an `ON CONFLICT (sku) DO UPDATE` upsert. It passes
      on H2 in CI but the feature misbehaves in production. What is the best fix?
    options:
      - "Rewrite the query as a SELECT-then-INSERT so it avoids upserts entirely"
      - "Add more assertions on the returned row counts to the existing H2 test"
      - "Run the test against a real Postgres container so the vendor-specific SQL is actually exercised"
      - "Raise the H2 PostgreSQL compatibility-mode timeout so the merge has time to complete"
    answer: 2
    explanation: |
      `ON CONFLICT` is Postgres-specific; H2 emulates it imperfectly, so the H2
      test gives false confidence. Running against a real Postgres container
      exercises the actual dialect and catches the divergence.
    ref: "concepts.md#why-testcontainers-over-in-memory-fakes"

  - id: testcontainers-for-integration-testing-005
    difficulty: intermediate
    tags: [scope, when-not]
    question: |
      For which of these is Testcontainers the WRONG tool?
    options:
      - "Testing your repository against real PostgreSQL"
      - "Testing producer/consumer behaviour against a real Kafka broker"
      - "Testing cache eviction against a real Redis"
      - "Testing your code's integration with a third-party payment SaaS API you cannot run in Docker"
    answer: 3
    explanation: |
      You cannot run a vendor's hosted SaaS in Docker. For external HTTP APIs use
      a mock server (WireMock) or consumer-driven contracts (Pact). Testcontainers
      is for infrastructure you own an image of.
    ref: "concepts.md#why-testcontainers-over-in-memory-fakes"

  - id: testcontainers-for-integration-testing-006
    difficulty: beginner
    tags: [generic-container]
    question: |
      What is `GenericContainer` used for?
    options:
      - "Wrapping an arbitrary Docker image where you configure image, ports, env, command and wait strategy"
      - "A hard-coded wrapper that can only launch the official PostgreSQL image and nothing else"
      - "A fixture factory that generates random rows of test data to seed a container's tables"
      - "A built-in HTTP mock server for stubbing outbound calls to external REST endpoints"
    answer: 0
    explanation: |
      `GenericContainer` is the base wrapper for any Docker image. Specialized
      modules like `PostgreSQLContainer` are thin subclasses that add convenience
      on top of it.
    ref: "concepts.md#genericcontainer-and-specialized-modules"

  - id: testcontainers-for-integration-testing-007
    difficulty: beginner
    tags: [specialized-modules]
    question: |
      What do specialized modules such as `PostgreSQLContainer` add over a raw
      `GenericContainer`?
    options:
      - "They encode a sensible wait strategy, defaults and convenience accessors like getJdbcUrl()"
      - "They bundle a static native binary of the engine so no Docker daemon is required"
      - "They swap the container for an in-memory build of the database to make startup instant"
      - "They generate the DDL and query SQL for you from the repository interface signatures"
    answer: 0
    explanation: |
      Specialized modules bake in the knowledge of a technology: the correct
      readiness wait, sane defaults, and accessors (getJdbcUrl, getUsername,
      getBootstrapServers), so you rarely configure them by hand.
    ref: "concepts.md#genericcontainer-and-specialized-modules"

  - id: testcontainers-for-integration-testing-008
    difficulty: intermediate
    tags: [ports, gotcha, scenario]
    question: |
      Your test connects to a Postgres container on `localhost:5432` and
      intermittently fails with connection refused. What is the likely mistake?
    options:
      - "The container's auto-generated name is too long and the daemon truncates its DNS entry"
      - "5432 is the container's internal port; the host port is a random mapped port read via getMappedPort(5432)"
      - "Postgres refuses connections on 5432 unless you set listen_addresses to the container IP"
      - "You must always publish the service on port 0 so the driver can negotiate a free socket"
    answer: 1
    explanation: |
      Testcontainers maps each exposed port to a random free host port to avoid
      collisions. Hard-coding 5432 from the host is wrong; read getMappedPort(5432)
      (or getJdbcUrl()) and getHost().
    ref: "concepts.md#genericcontainer-and-specialized-modules"

  - id: testcontainers-for-integration-testing-009
    difficulty: intermediate
    tags: [reproducibility, image-tag]
    question: |
      Why should you pin a specific image tag such as `postgres:16-alpine`
      rather than `postgres:latest` in tests?
    options:
      - "The reserved word 'latest' is rejected by the Docker registry as an invalid image tag"
      - "Testcontainers' image resolver explicitly refuses to pull any tag named 'latest'"
      - "Pinning a concrete tag lets Docker skip the manifest lookup, so the container starts faster"
      - "Reproducibility — pinning matches the production major version and prevents surprise upgrades breaking tests"
    answer: 3
    explanation: |
      `latest` floats, so a test that passed yesterday can break when the tag
      moves to a new major version. Pinning gives reproducible runs that mirror
      the production version.
    ref: "concepts.md#genericcontainer-and-specialized-modules"

  - id: testcontainers-for-integration-testing-010
    difficulty: beginner
    tags: [junit5, annotations]
    question: |
      What is the role of the `@Testcontainers` annotation?
    options:
      - "It activates the JUnit 5 extension that manages annotated containers on the test class"
      - "It marks a single field as a container that the runtime should expose to the test"
      - "It switches off the Ryuk resource reaper for the annotated test class"
      - "It opts the test class into JUnit's concurrent parallel execution engine"
    answer: 0
    explanation: |
      `@Testcontainers` on the test class turns on the Jupiter extension, which
      then finds `@Container` fields and drives their start/stop lifecycle.
    ref: "concepts.md#junit-5-lifecycle-testcontainers-and-container"

  - id: testcontainers-for-integration-testing-011
    difficulty: beginner
    tags: [junit5, container-annotation]
    question: |
      What does the `@Container` annotation do?
    options:
      - "Creates a dedicated Docker network and attaches the container to it"
      - "Registers the container as a Spring bean and injects it into the context"
      - "Marks a field whose container lifecycle (start/stop) the extension manages"
      - "Turns on cross-run container reuse for the annotated field"
    answer: 2
    explanation: |
      `@Container` tells the `@Testcontainers` extension to manage that field's
      lifecycle: start it before tests and stop it after, with timing depending
      on whether the field is static or instance.
    ref: "concepts.md#junit-5-lifecycle-testcontainers-and-container"

  - id: testcontainers-for-integration-testing-012
    difficulty: intermediate
    tags: [lifecycle, static, per-class]
    question: |
      A `@Container` field is declared `static`. When is the container started
      and stopped?
    options:
      - "Started and stopped afresh around every individual test method in the class"
      - "Started before the first test but deliberately never stopped by the extension"
      - "Started lazily only when the first test method throws and needs a retry"
      - "Started once before the first test method and stopped after the last (per class)"
    answer: 3
    explanation: |
      A static `@Container` is shared across all methods in the class: started
      once before the first test and stopped after the last. This is the fast,
      common choice.
    ref: "concepts.md#junit-5-lifecycle-testcontainers-and-container"

  - id: testcontainers-for-integration-testing-013
    difficulty: intermediate
    tags: [lifecycle, instance, per-method]
    question: |
      A `@Container` field is declared as an instance (non-static) field. What is
      the lifecycle behaviour?
    options:
      - "Started and stopped for every test method"
      - "Started before the first test and stopped after the last, once per test class"
      - "Started a single time and shared across the entire JVM for all classes"
      - "Left dormant until the developer calls start() by hand in the test body"
    answer: 0
    explanation: |
      An instance `@Container` field is started before and stopped after every
      `@Test` method, giving per-method isolation at the cost of full startup on
      each test.
    ref: "concepts.md#junit-5-lifecycle-testcontainers-and-container"

  - id: testcontainers-for-integration-testing-014
    difficulty: intermediate
    tags: [lifecycle, performance, scenario]
    question: |
      A suite is slow because a Postgres container restarts before every test
      method. The tests only read/write isolated rows. What is the cheapest fix?
    options:
      - "Delete half the tests so fewer container restarts happen across the suite"
      - "Make the @Container field static and isolate data by truncating between tests"
      - "Switch the repository tests to an in-memory H2 database to skip Docker entirely"
      - "Fork each test method into its own JVM so restarts run concurrently"
    answer: 1
    explanation: |
      Making the field static boots the container once per class instead of per
      method. Per-test isolation is then achieved by cleaning data (truncate /
      transactional rollback), not by restarting the container.
    ref: "concepts.md#junit-5-lifecycle-testcontainers-and-container"

  - id: testcontainers-for-integration-testing-015
    difficulty: advanced
    tags: [parallel, gotcha]
    question: |
      What is a known limitation of the JUnit 5 `@Testcontainers` extension?
    options:
      - "It only supports MySQL and rejects @Container fields typed as any other engine"
      - "It throws at startup if a @Container field is declared static rather than instance"
      - "It is only tested for sequential execution; combining it with parallel test execution can cause side effects"
      - "It refuses to start unless the Ryuk resource reaper has first been disabled"
    answer: 2
    explanation: |
      The Jupiter integration is tested for sequential runs only. Using it with
      JUnit parallel execution may produce unintended side effects; for
      parallelism, manage container lifecycle manually or use a singleton.
    ref: "concepts.md#junit-5-lifecycle-testcontainers-and-container"

  - id: testcontainers-for-integration-testing-016
    difficulty: advanced
    tags: [nested, lifecycle]
    question: |
      Why can a shared (static) container NOT be declared inside a non-static
      `@Nested` test class?
    options:
      - "The Ryuk reaper refuses to track containers created from a nested class"
      - "Docker networking cannot route to containers launched inside a nested test class"
      - "The @Container annotation is rejected outright anywhere inside a nested class"
      - "Java does not allow static fields in non-static nested classes"
    answer: 3
    explanation: |
      `@Nested` classes must be non-static, and Java forbids static fields in
      them, so a shared static container must live on the outer class. Instance
      containers work inside @Nested but are visible only there.
    ref: "concepts.md#junit-5-lifecycle-testcontainers-and-container"

  - id: testcontainers-for-integration-testing-017
    difficulty: intermediate
    tags: [singleton, pattern]
    question: |
      What does the singleton container pattern optimize?
    options:
      - "It starts the container once for the whole JVM/test run and shares it across all test classes"
      - "It provisions a fresh, dedicated container for each individual test method"
      - "It disables all container cleanup so state persists between separate runs"
      - "It launches the class's containers concurrently to shorten total startup time"
    answer: 0
    explanation: |
      With many test classes each declaring a static container, you pay startup
      per class. The singleton pattern boots the container once JVM-wide and
      shares it across every class.
    ref: "concepts.md#singleton-container-pattern"

  - id: testcontainers-for-integration-testing-018
    difficulty: advanced
    tags: [singleton, annotations, gotcha]
    question: |
      In the singleton container pattern, why do you deliberately NOT annotate the
      shared container field with `@Container`?
    options:
      - "Because the @Container annotation was deprecated and removed in JUnit 5.9"
      - "Because @Container would make JUnit start/stop it per class, defeating the shared-once purpose"
      - "Because @Container is only wired up for KafkaContainer and ignores other module types"
      - "Because annotating it would silently switch on cross-run reuse of the container"
    answer: 1
    explanation: |
      If the field were `@Container`, the extension would manage its lifecycle
      per class. The singleton starts it once in a static initializer and lets
      JVM shutdown / Ryuk reap it, so it is intentionally left unannotated.
    ref: "concepts.md#singleton-container-pattern"

  - id: testcontainers-for-integration-testing-019
    difficulty: advanced
    tags: [singleton, cleanup]
    question: |
      In the singleton pattern the container is started manually and never
      `stop()`ped. What cleans it up?
    options:
      - "Nothing cleans it up; the container simply leaks and runs forever"
      - "A nightly host OS reboot clears it along with all other containers"
      - "Ryuk / JVM shutdown reaps it when the process exits"
      - "JUnit's @AfterAll callback always fires and explicitly stops it"
    answer: 2
    explanation: |
      You do not call stop() in the singleton pattern; Ryuk (or JVM shutdown)
      removes the container when the creating JVM exits.
    ref: "concepts.md#singleton-container-pattern"

  - id: testcontainers-for-integration-testing-020
    difficulty: advanced
    tags: [singleton, isolation]
    question: |
      With a shared singleton database container, how do you keep individual
      tests isolated from each other?
    options:
      - "Restart the whole container between every test so each starts from a pristine image"
      - "By managing data — truncating tables or using transactions that roll back — since process state is shared"
      - "By declaring the field as an instance @Container so JUnit recreates it per method"
      - "Isolation is simply impossible once a single container is shared across every test class"
    answer: 1
    explanation: |
      Because the container's process state is shared, isolation becomes a data
      concern: clean/truncate tables or roll back transactions between tests
      rather than recreating the container.
    ref: "concepts.md#singleton-container-pattern"

  - id: testcontainers-for-integration-testing-021
    difficulty: beginner
    tags: [wait-strategy]
    question: |
      Why is a wait strategy needed even after `start()` returns?
    options:
      - "Because Docker images are large and must finish decompressing to disk before use"
      - "Because the exposed ports stay closed until Docker finishes its port-mapping handshake"
      - "Because the container may be running while the process inside is not yet ready to serve requests"
      - "Because JUnit mandates an explicit readiness wait before it will run any test method"
    answer: 2
    explanation: |
      Docker reporting the container as running does not mean the service inside
      is ready (DB recovering, broker electing). A wait strategy blocks start()
      until a readiness signal, preventing first-request flakiness.
    ref: "concepts.md#waiting-strategies"

  - id: testcontainers-for-integration-testing-022
    difficulty: intermediate
    tags: [wait-strategy, http]
    question: |
      Which wait strategy blocks until an HTTP endpoint returns an expected
      status code?
    options:
      - "Wait.forListeningPort()"
      - "Wait.forLogMessage(\".*ready to accept.*\", 1)"
      - "Wait.forHttp(\"/health\").forStatusCode(200)"
      - "Wait.forHealthcheck()"
    answer: 2
    explanation: |
      `Wait.forHttp(path).forStatusCode(...)` polls an HTTP endpoint until it
      returns the expected status, a strong readiness signal for web apps.
    ref: "concepts.md#waiting-strategies"

  - id: testcontainers-for-integration-testing-023
    difficulty: intermediate
    tags: [wait-strategy, log]
    question: |
      `Wait.forLogMessage(regex, times)` considers the container ready when...
    options:
      - "A log line matches the regex the specified number of times"
      - "The exposed TCP port begins accepting inbound client connections"
      - "Docker's built-in HEALTHCHECK directive reports the container as healthy"
      - "An HTTP probe against the container's mapped port returns a success code"
    answer: 0
    explanation: |
      The log-message strategy waits for a matching log line to appear N times —
      useful when a service prints a clear 'ready to accept connections' banner.
    ref: "concepts.md#waiting-strategies"

  - id: testcontainers-for-integration-testing-024
    difficulty: advanced
    tags: [wait-strategy, gotcha, scenario]
    question: |
      A `GenericContainer` app with a slow warm-up intermittently fails on the
      first request even though it uses `Wait.forListeningPort()`. Why?
    options:
      - "The forListeningPort strategy has a known bug that signals readiness far too early"
      - "forListeningPort only proves the socket is open, not that the app logic is initialized; use an HTTP or log-message wait"
      - "The container is starved of CPU, so its warm-up never finishes within the timeout"
      - "Ryuk reaped and killed the container mid-startup, before the first request arrived"
    answer: 1
    explanation: |
      A listening port can open before the application finishes initializing.
      For slow-starting apps prefer an HTTP health probe or log-message wait that
      reflects actual readiness.
    ref: "concepts.md#waiting-strategies"

  - id: testcontainers-for-integration-testing-025
    difficulty: intermediate
    tags: [wait-strategy, modules]
    question: |
      Why do you rarely need to set a wait strategy on a `PostgreSQLContainer`?
    options:
      - "Postgres boots instantly, so the connection is ready the moment start() returns"
      - "Wait strategies are silently ignored whenever the target container is a database"
      - "Because Ryuk blocks the test thread until the database is fully ready to serve"
      - "The specialized module ships a sensible default wait (e.g. waits for the DB to accept connections)"
    answer: 3
    explanation: |
      Specialized modules encode an appropriate default readiness check, so you
      only override it for special cases. Raw GenericContainers almost always
      need an explicit one.
    ref: "concepts.md#waiting-strategies"

  - id: testcontainers-for-integration-testing-026
    difficulty: intermediate
    tags: [spring, dynamic-property-source]
    question: |
      Why can't you hard-code the container's connection URL in
      `application.properties`?
    options:
      - "Spring Boot forbids datasource URLs in application.properties and fails fast at startup"
      - "The host and mapped port are only known at runtime after the container starts, so they must be injected dynamically"
      - "Properties files are not permitted to contain URL values, only keys and numbers"
      - "The container's connection URL is fixed and identical on every machine and run"
    answer: 1
    explanation: |
      Testcontainers assigns a random mapped port at start, so the JDBC URL is
      not known until runtime. `@DynamicPropertySource` (or jdbc:tc: URLs) supply
      it after the container is up.
    ref: "concepts.md#wiring-the-container-into-the-app-under-test"

  - id: testcontainers-for-integration-testing-027
    difficulty: advanced
    tags: [spring, dynamic-property-source, gotcha]
    question: |
      In a `@DynamicPropertySource` method, why are values registered as method
      references like `pg::getJdbcUrl` rather than resolved strings?
    options:
      - "Purely for code-style reasons; the framework treats suppliers and strings identically"
      - "Because Spring's DynamicPropertyRegistry API only accepts lambda expressions, never Strings"
      - "Because they are lazy suppliers, invoked after the container starts rather than eagerly at registration time"
      - "Because calling getJdbcUrl() eagerly always throws a NullPointerException at load time"
    answer: 2
    explanation: |
      `DynamicPropertyRegistry.add` takes suppliers so the value is fetched
      lazily, after the container has started and the URL/port exist, before the
      Spring context is built.
    ref: "concepts.md#wiring-the-container-into-the-app-under-test"

  - id: testcontainers-for-integration-testing-028
    difficulty: intermediate
    tags: [jdbc-url, framework-agnostic]
    question: |
      What does a JDBC URL like `jdbc:tc:postgresql:16-alpine:///shop` do?
    options:
      - "Connects directly to a remote production Postgres instance over the standard 5432 port"
      - "Enables TLS/SSL encryption on the connection but otherwise behaves like a normal JDBC URL"
      - "Points the driver at an embedded H2 in-memory database in Postgres compatibility mode"
      - "Triggers the Testcontainers JDBC driver to start/stop a Postgres container implicitly, no lifecycle code needed"
    answer: 3
    explanation: |
      The `tc:` prefix activates the Testcontainers JDBC support, which starts
      and stops the container automatically around the connection — a
      framework-agnostic alternative to @DynamicPropertySource.
    ref: "concepts.md#wiring-the-container-into-the-app-under-test"

  - id: testcontainers-for-integration-testing-029
    difficulty: beginner
    tags: [ryuk, cleanup]
    question: |
      What is Ryuk in Testcontainers?
    options:
      - "A companion 'resource reaper' container that deletes created containers/networks/volumes when the creating session dies"
      - "A load-testing tool that hammers the container to verify it survives production traffic"
      - "A wait strategy that blocks start() until the container process reports it is ready"
      - "A Spring Boot integration that auto-wires each running container as an injectable bean"
    answer: 0
    explanation: |
      Ryuk is a sidecar that tracks the resources a session creates and removes
      them when that JVM/session exits — even on crash or kill — preventing
      leaked containers.
    ref: "concepts.md#container-reuse-and-ryuk-cleanup"

  - id: testcontainers-for-integration-testing-030
    difficulty: intermediate
    tags: [ryuk, cleanup, crash]
    question: |
      If a test process is killed abruptly before calling `stop()`, what happens
      to its containers?
    options:
      - "They run forever until manually removed"
      - "Docker refuses to start new containers"
      - "Ryuk reaps them when the creating JVM dies"
      - "They restart on their own under Docker's default restart policy"
    answer: 2
    explanation: |
      Ryuk's whole purpose is cleanup on abnormal exit: it deletes the tracked
      resources when the session that created them ends, even on crash or kill.
    ref: "concepts.md#container-reuse-and-ryuk-cleanup"

  - id: testcontainers-for-integration-testing-031
    difficulty: intermediate
    tags: [reuse, opt-in]
    question: |
      What are the TWO opt-ins required to reuse a container across test runs?
    options:
      - "Disabling Ryuk entirely and marking the container field static so it survives"
      - "A machine-level flag (testcontainers.reuse.enable=true) AND per-container .withReuse(true)"
      - "Attaching a shared network alias to the container plus configuring a wait strategy"
      - "A classpath testcontainers.properties file combined with a @Container annotation"
    answer: 1
    explanation: |
      Reuse needs both the machine-level enable (~/.testcontainers.properties or
      TESTCONTAINERS_REUSE_ENABLE=true) and .withReuse(true) on the container.
      Notably it cannot be enabled from a classpath file.
    ref: "concepts.md#container-reuse-and-ryuk-cleanup"

  - id: testcontainers-for-integration-testing-032
    difficulty: advanced
    tags: [reuse, ryuk, tension]
    question: |
      Why is a reused container NOT cleaned up automatically by Ryuk?
    options:
      - "Ryuk is automatically and permanently disabled the instant reuse mode is turned on"
      - "Container reuse is a feature that is only supported by the KafkaContainer module today"
      - "A reused container must survive between runs so the next run can reuse it, so it is intentionally not reaped"
      - "Ryuk has no visibility into reused containers because they run on a separate network"
    answer: 2
    explanation: |
      Reuse and Ryuk are in tension: the point of reuse is that the container
      outlives the session, so it is not reaped and you must clean it up
      yourself.
    ref: "concepts.md#container-reuse-and-ryuk-cleanup"

  - id: testcontainers-for-integration-testing-033
    difficulty: intermediate
    tags: [reuse, ci]
    question: |
      Why is container reuse discouraged in CI?
    options:
      - "CI environments have no Docker daemon available, so reuse can never take effect there"
      - "Reuse assumes a persistent local machine; CI wants a clean, isolated environment each run"
      - "The reuse optimization only yields a measurable speed-up on Windows-based CI runners"
      - "CI runners are unable to read the ~/.testcontainers.properties file that enables reuse"
    answer: 1
    explanation: |
      Reuse is an experimental, local-only optimization that keeps state between
      runs. CI runners are ephemeral and want isolation, so reuse is explicitly
      not recommended there.
    ref: "concepts.md#container-reuse-and-ryuk-cleanup"

  - id: testcontainers-for-integration-testing-034
    difficulty: advanced
    tags: [reuse, config-hash]
    question: |
      A developer enabled reuse but a fresh container starts every run. A likely
      cause is:
    options:
      - "Ryuk is left enabled and eagerly reaps the container the instant the previous run exits"
      - "The image tag is pinned to one fixed version, and pinning silently disables cross-run reuse"
      - "The container configuration differs between runs, so Testcontainers' config hash does not match and it cannot reuse"
      - "The test class declares its container field as static instead of using a singleton holder"
    answer: 2
    explanation: |
      Reuse only occurs when the container configuration is identical between
      runs (Testcontainers hashes the config). Any change to env, ports, or
      settings produces a different hash and a new container.
    ref: "concepts.md#container-reuse-and-ryuk-cleanup"

  - id: testcontainers-for-integration-testing-035
    difficulty: intermediate
    tags: [networking, alias]
    question: |
      When container A must call container B, how should A address B?
    options:
      - "Via a shared Network, B's network alias and B's internal port (e.g. db:5432)"
      - "Via B's randomly assigned mapped host port reached over localhost from inside A"
      - "Via getHost() together with getMappedPort(), called from inside container A itself"
      - "Via 127.0.0.1 combined with B's exposed internal port from within container A"
    answer: 0
    explanation: |
      Container-to-container traffic goes over a shared Testcontainers Network,
      addressing the peer by its network alias and internal port. The mapped host
      port is only for the test JVM reaching the container.
    ref: "concepts.md#networks-and-docker-compose-support"

  - id: testcontainers-for-integration-testing-036
    difficulty: advanced
    tags: [networking, gotcha, scenario]
    question: |
      An app container is configured with `DB_URL=jdbc:postgresql://localhost:<mappedPort>/db`
      and cannot reach the database container. What is wrong?
    options:
      - "The mapped port value is wrong; from inside the container it should just be 5432 on localhost"
      - "From inside the app container, the DB is not on localhost; use the shared network alias and internal port (db:5432)"
      - "Postgres does not accept plain JDBC connections and requires a native libpq socket"
      - "The app container needs the Ryuk reaper disabled before it can route to the database"
    answer: 1
    explanation: |
      Inside the app container, localhost is the app itself, not the host. The
      mapped port only works from the test JVM. Peers must use the network alias
      and internal port on a shared Network.
    ref: "concepts.md#networks-and-docker-compose-support"

  - id: testcontainers-for-integration-testing-037
    difficulty: intermediate
    tags: [compose]
    question: |
      What does the Docker Compose module (`ComposeContainer`) let you do?
    options:
      - "Convert a docker-compose.yml file into equivalent Kubernetes Deployment manifests for the test run"
      - "Launch only a single container at a time, ignoring extra services declared in the compose file"
      - "Start a whole docker-compose.yml stack for tests, exposing chosen service ports with wait strategies"
      - "Remove the dependency on a Docker daemon by running the compose stack directly inside the host JVM"
    answer: 2
    explanation: |
      The Compose module runs an existing docker-compose.yml, coordinating
      several services, and gives host/port accessors per service — handy when
      the stack is already described in Compose.
    ref: "concepts.md#networks-and-docker-compose-support"

  - id: testcontainers-for-integration-testing-038
    difficulty: intermediate
    tags: [pyramid, trade-off]
    question: |
      Where do Testcontainers-backed tests best fit in the test pyramid?
    options:
      - "As the vast base — nearly every test should spin up a container for maximum realism"
      - "In the middle/upper band — relatively few, above a large base of fast unit tests"
      - "They replace the classic pyramid entirely, since containers cover unit and E2E needs alike"
      - "Only at the very tip, as a slower and more brittle substitute for Selenium UI tests"
    answer: 1
    explanation: |
      Container tests are slower and fewer; they sit above a large fast unit base.
      Testcontainers is a fidelity tool, not a volume tool.
    ref: "concepts.md#fidelity-vs-cost-trade-off-and-the-pyramid"

  - id: testcontainers-for-integration-testing-039
    difficulty: intermediate
    tags: [performance, levers]
    question: |
      Which lever does NOT help reduce Testcontainers suite time?
    options:
      - "Using static or singleton containers so the engine boots once per class rather than per method"
      - "Enabling withReuse(true) locally so the same container survives across successive runs"
      - "Restarting the container before every test method for isolation"
      - "Pinning light -alpine image tags and pre-pulling them in a CI warm-up step"
    answer: 2
    explanation: |
      Restarting per method is the opposite of an optimization — it maximizes
      startup cost. Isolation should come from data cleanup, while static/singleton
      containers, reuse and light images cut time.
    ref: "concepts.md#fidelity-vs-cost-trade-off-and-the-pyramid"

  - id: testcontainers-for-integration-testing-040
    difficulty: advanced
    tags: [performance, philosophy]
    question: |
      Which statement best captures the intended role of Testcontainers?
    options:
      - "A volume tool: maximize total test count by running virtually everything inside containers"
      - "A fidelity tool: a handful of high-value container-backed tests plus a large fast unit base"
      - "A drop-in replacement for unit tests, letting you delete the fast in-process test layer"
      - "A code generator that writes your SQL for you so you never hand-author queries"
    answer: 1
    explanation: |
      Testcontainers buys fidelity where the real engine's behaviour matters.
      Correctness of pure logic should stay in fast unit tests; use containers
      sparingly for dialect/protocol-sensitive paths.
    ref: "concepts.md#fidelity-vs-cost-trade-off-and-the-pyramid"

  - id: testcontainers-for-integration-testing-041
    difficulty: beginner
    tags: [ci, docker]
    question: |
      What is the fundamental CI requirement for Testcontainers to work?
    options:
      - "A dedicated GPU on the runner to accelerate container image decompression"
      - "A runner configured for Windows containers only, since Linux images are unsupported"
      - "A Docker daemon reachable from the test process"
      - "A fully air-gapped, internet-free environment that blocks all registry access"
    answer: 2
    explanation: |
      Testcontainers talks to a Docker daemon via the Docker API. CI must expose
      a reachable daemon (host socket, DinD sidecar, or remote/Cloud Docker).
    ref: "concepts.md#ci-considerations-and-docker-in-docker"

  - id: testcontainers-for-integration-testing-042
    difficulty: advanced
    tags: [ci, dind, scenario]
    question: |
      Your CI job itself runs inside a container (e.g. Jenkins on Kubernetes) and
      Testcontainers cannot find Docker. What is the typical resolution?
    options:
      - "Rewrite the repository tests to run against an embedded H2 database so no daemon is needed"
      - "Provide a Docker-in-Docker sidecar or mount the host Docker socket, and point DOCKER_HOST at it"
      - "Disable all container-backed tests in CI and run them only on developer laptops"
      - "Install the GUI Docker Desktop application onto the headless Kubernetes runner node"
    answer: 1
    explanation: |
      When the job runs inside a container it has no daemon by default. You add a
      DinD sidecar or mount /var/run/docker.sock and set DOCKER_HOST so
      Testcontainers can reach a daemon.
    ref: "concepts.md#ci-considerations-and-docker-in-docker"

  - id: testcontainers-for-integration-testing-043
    difficulty: advanced
    tags: [ci, ryuk, env]
    question: |
      On a locked-down CI runner that blocks the privileged Ryuk container, which
      environment variable disables it (accepting that you must ensure cleanup
      another way)?
    options:
      - "TESTCONTAINERS_REUSE_ENABLE=true"
      - "DOCKER_HOST=none"
      - "TC_DAEMON=false"
      - "TESTCONTAINERS_RYUK_DISABLED=true"
    answer: 3
    explanation: |
      `TESTCONTAINERS_RYUK_DISABLED=true` turns off the reaper. Cleanup then
      relies on the ephemeral runner tearing everything down at job end.
    ref: "concepts.md#ci-considerations-and-docker-in-docker"

  - id: testcontainers-for-integration-testing-044
    difficulty: intermediate
    tags: [ci, images, rate-limit]
    question: |
      Which practice best mitigates slow, rate-limited image pulls in CI?
    options:
      - "Use the postgres:latest tag, since floating tags are cached automatically by the registry"
      - "Use a pull-through cache/mirror, pin tags, and pre-pull common images in a warm-up step"
      - "Disable the Ryuk reaper container so the runner skips the extra sidecar image pull"
      - "Run every test class in parallel so image pulls overlap and hide the download latency"
    answer: 1
    explanation: |
      Registry pulls cost time and can hit rate limits. A mirror/cache plus pinned
      tags and a pre-pull warm-up avoids per-run pulls and throttling.
    ref: "concepts.md#ci-considerations-and-docker-in-docker"

  - id: testcontainers-for-integration-testing-045
    difficulty: advanced
    tags: [ci, remote-docker, gotcha]
    question: |
      Why should tests read `getHost()` rather than assume `localhost`, especially
      with remote Docker or Testcontainers Cloud?
    options:
      - "Resolving via getHost() routes over a faster loopback path than the localhost literal does"
      - "Calling getHost() also disables the Ryuk reaper, avoiding its network overhead per request"
      - "With a remote daemon the container may not be on localhost; getHost() returns the correct address"
      - "The name localhost is not a valid hostname in Java and throws UnknownHostException at connect time"
    answer: 2
    explanation: |
      When Docker runs remotely (or on Testcontainers Cloud) the reachable host is
      not localhost. Always use getHost()/getMappedPort() so tests work regardless
      of where the daemon lives.
    ref: "concepts.md#ci-considerations-and-docker-in-docker"

  - id: testcontainers-for-integration-testing-046
    difficulty: intermediate
    tags: [modules, localstack, kafka]
    question: |
      Which specialized module would you use to test code against emulated AWS
      services (S3, SQS) locally?
    options:
      - "KafkaContainer"
      - "ElasticsearchContainer"
      - "LocalStackContainer"
      - "MongoDBContainer"
    answer: 2
    explanation: |
      `LocalStackContainer` runs LocalStack, emulating AWS services and exposing
      endpoints/credentials for testing S3, SQS, DynamoDB, etc.
    ref: "concepts.md#genericcontainer-and-specialized-modules"

  - id: testcontainers-for-integration-testing-047
    difficulty: beginner
    tags: [modules, kafka]
    question: |
      What convenience does `KafkaContainer` typically provide?
    options:
      - "getBootstrapServers() for wiring producers/consumers"
      - "getJdbcUrl() returning a ready SQL connection string for the broker's metadata store"
      - "getReplicaSetUrl() exposing the broker's internal replica-set connection string"
      - "A built-in HTTP admin server that proxies produce and consume calls over REST"
    answer: 0
    explanation: |
      `KafkaContainer` handles broker wiring and exposes getBootstrapServers(),
      the address producers and consumers connect to.
    ref: "concepts.md#genericcontainer-and-specialized-modules"

  - id: testcontainers-for-integration-testing-048
    difficulty: intermediate
    tags: [comparison, contract-tests, scenario]
    question: |
      You need to verify your service handles a partner REST API's error
      responses. The partner API is a hosted SaaS. What is the appropriate tool?
    options:
      - "A GenericContainer that pulls and runs the partner's proprietary hosted API image locally"
      - "A PostgreSQLContainer, storing the partner's expected error responses in a seeded table"
      - "A mock server such as WireMock (or a consumer-driven contract with Pact), not Testcontainers"
      - "A LocalStackContainer, since it emulates arbitrary third-party REST SaaS endpoints too"
    answer: 2
    explanation: |
      You cannot run a partner's hosted SaaS in Docker. Simulate its HTTP
      responses with WireMock, or verify the contract with Pact. Testcontainers
      is for infra you own an image of.
    ref: "concepts.md#why-testcontainers-over-in-memory-fakes"
