topic: "Testing Fundamentals & the Test Pyramid"
domain: testing
topic_slug: testing-fundamentals-and-test-pyramid
version: 1
questions:
  - id: testing-fundamentals-and-test-pyramid-001
    difficulty: beginner
    tags: [why-test, philosophy, dijkstra]
    question: |
      Dijkstra observed that "testing can show the presence of bugs, but never their
      absence." What is the correct practical takeaway for a working engineer?
    options:
      - "Tests build confidence and catch regressions; they sample behavior rather than prove it exhaustively"
      - "Automated testing is a pointless waste of effort because it can never mathematically prove correctness"
      - "Only formal mathematical proofs should be used to check software, never empirical tests"
      - "A passing test suite guarantees the software is completely free of defects and needs no further checks"
    answer: 0
    explanation: |
      Testing is risk management, not proof. It cannot exhaustively cover an
      effectively infinite input space, so it samples intelligently to build confidence
      and, most valuably, to catch regressions. A green suite is necessary but not
      sufficient for correctness.
    ref: "concepts.md#why-we-test"

  - id: testing-fundamentals-and-test-pyramid-002
    difficulty: beginner
    tags: [why-test, regression, roi]
    question: |
      Which benefit is most often cited as the single biggest return on investment of an
      automated test suite?
    options:
      - "It completely replaces the need for human code review on every change"
      - "It regression-protects the code so it can be changed without fear of silent breakage"
      - "It mathematically proves the total absence of all bugs in the codebase"
      - "It removes the need for any written specification or requirements document"
    answer: 1
    explanation: |
      Regression protection is the primary business value: a trustworthy suite lets a
      team refactor and add features quickly without fear of silently breaking working
      behavior. It does not replace review or specs and cannot prove absence of bugs.
    ref: "concepts.md#why-we-test"

  - id: testing-fundamentals-and-test-pyramid-003
    difficulty: intermediate
    tags: [why-test, absence-of-errors-fallacy]
    question: |
      A team ships a feature that passes 100% of its tests, but users find it useless and
      never adopt it. Which testing concept does this illustrate?
    options:
      - "The Heisenbug effect"
      - "Coordinated omission"
      - "The absence-of-errors fallacy"
      - "The ice-cream-cone anti-pattern"
    answer: 2
    explanation: |
      The absence-of-errors fallacy is building software that passes all tests yet fails
      to solve the user's real problem. Passing tests (verification) is necessary but not
      sufficient — it doesn't guarantee the right product was built (validation).
    ref: "concepts.md#why-we-test"

  - id: testing-fundamentals-and-test-pyramid-004
    difficulty: beginner
    tags: [verification-validation, definitions]
    question: |
      "Are we building the product right?" versus "Are we building the right product?"
      map respectively to which pair?
    options:
      - "Unit testing and integration testing"
      - "Smoke testing and sanity testing"
      - "Validation and verification"
      - "Verification and validation"
    answer: 3
    explanation: |
      Verification asks whether the product is built right (conforms to spec);
      validation asks whether the right product is being built (meets user needs).
      Mnemonic: Verification = vs. the spec, Validation = value to the user.
    ref: "concepts.md#verification-and-validation"

  - id: testing-fundamentals-and-test-pyramid-005
    difficulty: intermediate
    tags: [verification-validation, scenario]
    question: |
      A flawlessly coded feature perfectly matches its written specification, but the
      specification itself described something users didn't want. What is true?
    options:
      - "The feature is validated but not verified"
      - "The feature is both verified and validated"
      - "The feature is verified but not validated"
      - "Verification and validation are the same thing here"
    answer: 2
    explanation: |
      The code matches the spec (verification passes) but the spec was wrong for users,
      so validation fails. Verification catches implementation defects; validation
      catches requirements defects. A system can be fully verified yet invalid.
    ref: "concepts.md#verification-and-validation"

  - id: testing-fundamentals-and-test-pyramid-006
    difficulty: intermediate
    tags: [verification-validation, activities]
    question: |
      Which activity is primarily a validation activity rather than a verification
      activity?
    options:
      - "Running unit tests against the specification"
      - "User acceptance testing (UAT) with real users"
      - "Static analysis of the source code"
      - "Peer code review against the design"
    answer: 1
    explanation: |
      UAT checks fitness for the user's actual purpose — validation. Unit tests, static
      analysis, and code review all check conformance to spec/design — verification.
    ref: "concepts.md#verification-and-validation"

  - id: testing-fundamentals-and-test-pyramid-007
    difficulty: intermediate
    tags: [levels-vs-types, orthogonal]
    question: |
      Which statement about test *levels* and test *types* is correct?
    options:
      - "They are simply two interchangeable names for the same underlying concept, differing only in the vocabulary teams happen to prefer"
      - "Type describes the scope exercised (unit/integration/E2E) while level describes the quality attribute (functional/performance) being checked"
      - "Level describes scope (unit/integration/E2E); type describes the quality attribute checked (functional/performance/security); they are orthogonal"
      - "Non-functional testing such as performance or security can only ever be performed at the broad end-to-end level, never at the unit level"
    answer: 2
    explanation: |
      Level = how much of the system is exercised (scope). Type = what quality attribute
      is checked. They're independent axes: you can have a functional unit test and a
      non-functional (performance) unit test, or a functional and non-functional E2E test.
    ref: "concepts.md#test-levels-and-test-types"

  - id: testing-fundamentals-and-test-pyramid-008
    difficulty: beginner
    tags: [levels, non-functional]
    question: |
      Which of the following is a NON-functional test type?
    options:
      - "Checking that a percentage discount is calculated correctly on the order total"
      - "Verifying an order correctly transitions from the PENDING state to the SHIPPED state"
      - "Confirming a descriptive validation error is returned when a required field is missing"
      - "Load testing to verify the service holds latency under 5,000 requests/second"
    answer: 3
    explanation: |
      Load testing checks a quality attribute (performance/scalability) — non-functional.
      The others check *what* the system does against requirements — functional testing.
    ref: "concepts.md#test-levels-and-test-types"

  - id: testing-fundamentals-and-test-pyramid-009
    difficulty: intermediate
    tags: [levels, terminology, clarify]
    question: |
      An interviewer asks about your "integration tests." Why is it wise to clarify what
      you mean before answering?
    options:
      - "Because 'integration testing' is heavily overloaded — it can mean two of your own classes together (narrow) or your service plus a real database and broker (broad)"
      - "Because integration tests are by definition always slower to run than any broad end-to-end test, so the term is unambiguous"
      - "Because integration tests, by strict industry rule, never use test doubles, stubs, or mocks and always exercise fully real systems"
      - "Because integration testing is strictly a test type describing a quality attribute, not a test level describing the scope exercised"
    answer: 0
    explanation: |
      "Integration testing" is one of the most overloaded terms in the field. The
      pyramid arguments depend on whether you mean narrow (a couple of collaborating
      classes) or broad (real external systems) integration, so clarify scope first.
    ref: "concepts.md#test-levels-and-test-types"

  - id: testing-fundamentals-and-test-pyramid-010
    difficulty: beginner
    tags: [black-box, definitions]
    question: |
      Black-box testing designs test cases based on what?
    options:
      - "The internal source code paths, branches, and control-flow structure of the implementation"
      - "The specification and observable interface, ignoring the implementation"
      - "Structural code coverage metrics such as line, branch, and path coverage"
      - "The private fields and internal state of the class under test"
    answer: 1
    explanation: |
      Black-box testing derives cases from the specification/interface — inputs in,
      outputs asserted — without knowledge of internals. This makes tests survive
      refactoring. White-box testing, by contrast, is derived from the code and coverage.
    ref: "concepts.md#black-box-white-box-and-gray-box-testing"

  - id: testing-fundamentals-and-test-pyramid-011
    difficulty: intermediate
    tags: [white-box, coverage]
    question: |
      Which technique or metric is inherently a WHITE-box (structural) concern?
    options:
      - "Branch (decision) coverage"
      - "Equivalence partitioning"
      - "Boundary-value analysis"
      - "Decision-table testing"
    answer: 0
    explanation: |
      Branch coverage measures which code paths execute — a structural, white-box metric
      derived from the code. Equivalence partitioning, boundary-value analysis, and
      decision tables are black-box techniques derived from the specification.
    ref: "concepts.md#black-box-white-box-and-gray-box-testing"

  - id: testing-fundamentals-and-test-pyramid-012
    difficulty: intermediate
    tags: [gray-box, integration]
    question: |
      You write a test that knows the service uses a cache and a Postgres database, so you
      seed the DB and exercise a cache-miss path, but you only assert on the HTTP response
      the service returns. This is best described as:
    options:
      - "Pure black-box testing"
      - "Pure white-box testing"
      - "Mutation testing"
      - "Gray-box testing"
    answer: 3
    explanation: |
      Gray-box testing blends the two: you use partial knowledge of internals (cache, DB)
      to design smarter cases, but assert on observable behavior rather than private
      details. Most integration testing is effectively gray-box.
    ref: "concepts.md#black-box-white-box-and-gray-box-testing"

  - id: testing-fundamentals-and-test-pyramid-013
    difficulty: intermediate
    tags: [black-box, best-practice]
    question: |
      Why is it generally recommended to assert on observable behavior rather than on a
      class's private/internal structure, even when you know the internals?
    options:
      - "Tests coupled to private implementation break on refactoring, making the suite brittle and refactor-hostile"
      - "Behavior assertions execute measurably faster at runtime than assertions on internal structure"
      - "Private internal structure is technically impossible to access from any test framework"
      - "Asserting on observable behavior is the only way to achieve 100% branch coverage of the code"
    answer: 0
    explanation: |
      Coupling tests to internal implementation detail is the #1 cause of brittle suites:
      a behavior-preserving refactor breaks the tests. Use white-box knowledge to choose
      *which* cases to write, but assert on observable behavior so you can refactor freely.
    ref: "concepts.md#black-box-white-box-and-gray-box-testing"

  - id: testing-fundamentals-and-test-pyramid-014
    difficulty: beginner
    tags: [pyramid, shape]
    question: |
      In the classic test pyramid, how should test counts be distributed across layers?
    options:
      - "Many slow broad E2E tests concentrated at the top, with only a few isolated unit tests at the bottom"
      - "Many fast isolated unit tests at the bottom, progressively fewer broader tests toward the top"
      - "Roughly equal numbers of unit, integration, and E2E tests balanced evenly at every layer"
      - "Only broad integration tests throughout, with no isolated unit tests and no end-to-end tests"
    answer: 1
    explanation: |
      The pyramid prescribes many cheap, fast, isolated tests at the base and
      progressively fewer, slower, broader tests as you go up — because higher tests cost
      more, run slower, and are more prone to flakiness per unit of confidence added.
    ref: "concepts.md#the-test-pyramid"

  - id: testing-fundamentals-and-test-pyramid-015
    difficulty: intermediate
    tags: [pyramid, rationale]
    question: |
      What is the core reason to push each test to the lowest level that can still catch
      its target bug?
    options:
      - "Higher-level tests are slower, more expensive, flakier, and localize failures poorly, so cheaper lower-level tests give more feedback per cost"
      - "Code coverage instrumentation tools are only technically capable of measuring isolated unit tests, never broader ones"
      - "Lower-level tests are the only kind of test that can meaningfully assert on a system's observable outputs"
      - "Higher-level end-to-end tests are inherently impossible to automate and must always be executed by hand"
    answer: 0
    explanation: |
      As you move up the pyramid, tests get slower, costlier to write/maintain, more
      non-deterministic, and less precise about where the defect is. Pushing coverage
      down maximizes fast, precise feedback per unit of cost.
    ref: "concepts.md#the-test-pyramid"

  - id: testing-fundamentals-and-test-pyramid-016
    difficulty: intermediate
    tags: [pyramid, ratios, nuance]
    question: |
      An interviewer asks, "What exact ratio of unit to integration to E2E tests should we
      have?" What is the strongest answer?
    options:
      - "Exactly 70% unit, 20% integration, and 10% E2E tests — this precise breakdown is a strict, universally mandated rule"
      - "A rigid 50/50 split between unit and E2E tests, deliberately omitting the integration layer from the suite entirely"
      - "As many broad end-to-end tests as you can possibly write, since more of them always yields the maximum realistic confidence"
      - "It's a shape, not a formula: as many fast low-level tests as possible and few slow high-level ones; the ratio falls out of your architecture"
    answer: 3
    explanation: |
      Fowler is explicit that exact percentages are illustrative, not prescriptive. The
      durable guidance is the shape (many cheap low tests, few slow high ones) and the
      reasoning about cost vs feedback — not a fixed 70/20/10 ratio.
    ref: "concepts.md#the-test-pyramid"

  - id: testing-fundamentals-and-test-pyramid-017
    difficulty: advanced
    tags: [pyramid, e2e, second-line-of-defense]
    question: |
      A broad E2E test fails and reveals a real bug. Beyond fixing the bug, what does the
      pyramid philosophy recommend?
    options:
      - "Backfill a fast lower-level test that reproduces the bug, since a high-level failure often signals a missing unit/integration test"
      - "Delete the E2E test now that it has already served its purpose and successfully caught this particular bug once"
      - "Add several more broad, slow E2E tests to exhaustively cover every similar case across the same user journey"
      - "Disable the failing test and mark it as permanently skipped so the CI pipeline reliably stays green for now"
    answer: 0
    explanation: |
      High-level tests are a "second line of defense." A failure there often means a
      lower-level test was missing. You reproduce the bug with a fast, precise
      unit/integration test that guards it going forward, keeping the E2E layer thin.
    ref: "concepts.md#the-test-pyramid"

  - id: testing-fundamentals-and-test-pyramid-018
    difficulty: intermediate
    tags: [ice-cream-cone, anti-pattern]
    question: |
      Which situation best describes the "ice-cream-cone" anti-pattern?
    options:
      - "A large base of fast isolated unit tests with only a few broad end-to-end tests carefully layered on top"
      - "An inverted pyramid: many slow E2E/UI tests, few integration tests, almost no unit tests, often topped by heavy manual testing"
      - "Routinely running static analysis and linting checks first, before any of the automated tests are executed"
      - "Writing each test just before writing the production code it covers, exactly as prescribed by test-driven development"
    answer: 1
    explanation: |
      The ice-cream cone is the inverted pyramid: lots of brittle, slow UI/E2E tests,
      few integration tests, almost no unit tests, and a big scoop of manual testing on
      top. It yields slow, flaky CI and failures that don't localize.
    ref: "concepts.md#the-testing-trophy-and-the-ice-cream-cone-anti-pattern"

  - id: testing-fundamentals-and-test-pyramid-019
    difficulty: advanced
    tags: [ice-cream-cone, symptoms, scenario]
    question: |
      A team's CI takes 90 minutes, fails intermittently for no code reason, and when it
      fails nobody can tell which component broke. Their suite is almost entirely
      browser-driven UI tests. What's the diagnosis and best first move?
    options:
      - "The suite is fundamentally healthy; a 90-minute runtime is expected for thorough coverage, so simply add more browser UI tests"
      - "The root problem is an excess of low-value unit tests bloating the run, so delete most of them and lean on the broad UI suite"
      - "Ice-cream-cone anti-pattern; push coverage down to fast unit/integration tests and reserve E2E for a few critical journeys"
      - "Raise the CI timeout well beyond 90 minutes and auto-rerun the flaky jobs, continuing with the current UI-heavy suite as-is"
    answer: 2
    explanation: |
      Slow, flaky CI with poor failure localization and a UI-heavy suite is the classic
      ice-cream cone. The fix is to invert it back toward a pyramid: move coverage down to
      fast deterministic unit/integration tests and keep only a few critical E2E journeys.
    ref: "concepts.md#the-testing-trophy-and-the-ice-cream-cone-anti-pattern"

  - id: testing-fundamentals-and-test-pyramid-020
    difficulty: intermediate
    tags: [testing-trophy, kent-c-dodds]
    question: |
      The "testing trophy" model, associated with Kent C. Dodds, is best summarized by
      which slogan and emphasis?
    options:
      - "'Test everything through the UI' — overwhelmingly broad end-to-end tests"
      - "'Only isolated unit tests matter' — no integration or E2E tests at all"
      - "'Never write tests first' — test only manually after the release ships"
      - "'Write tests. Not too many. Mostly integration.' — with a base of static analysis"
    answer: 3
    explanation: |
      The trophy weights integration tests most heavily ("mostly integration"), on a base
      of static analysis (types/linting), with modest unit and few E2E tests. Its slogan
      is "Write tests. Not too many. Mostly integration."
    ref: "concepts.md#the-testing-trophy-and-the-ice-cream-cone-anti-pattern"

  - id: testing-fundamentals-and-test-pyramid-021
    difficulty: advanced
    tags: [pyramid-vs-trophy, reconciliation]
    question: |
      Much of the "pyramid vs testing trophy" debate is considered largely definitional.
      Why?
    options:
      - "Because how broadly you define a 'unit' (solitary vs sociable) determines whether tests look like the pyramid's 'unit' or the trophy's 'integration' tests"
      - "Because both the trophy and the pyramid explicitly recommend deleting every end-to-end test as soon as a feature has shipped"
      - "Because both models strictly forbid static analysis, treating type checks and linting as entirely outside the scope of testing"
      - "Because both models mandate an identical fixed quota of exactly 50% integration tests, making the whole debate purely arithmetic"
    answer: 0
    explanation: |
      Fowler notes the disagreement is largely about definitions: a broad, sociable
      "unit" test that uses real collaborators resembles the trophy's "integration" test.
      Both models agree cheap fast tests should dominate and slow E2E tests should be few.
    ref: "concepts.md#the-testing-trophy-and-the-ice-cream-cone-anti-pattern"

  - id: testing-fundamentals-and-test-pyramid-022
    difficulty: intermediate
    tags: [isolation, between-tests]
    question: |
      A test passes when run after test A but fails when run alone or first. What is the
      most likely root cause?
    options:
      - "The test runs too quickly, so its assertions execute before the system under test has finished initializing its internal state"
      - "The tests are not isolated — one leaks shared mutable state (static field, DB row, or ordering assumption) that the other depends on"
      - "The test uses AssertJ fluent assertions, which evaluate lazily and behave differently depending on which test ran immediately before"
      - "The class under test declares too few injected dependencies, so the test framework silently reuses the previous test's constructed instance"
    answer: 1
    explanation: |
      Order-dependent tests indicate a violation of inter-test isolation: leaked static
      state, a shared database row, or an ordering assumption. Tests must set up their own
      fixtures and not depend on each other's state or run order.
    ref: "concepts.md#test-scope-and-isolation"

  - id: testing-fundamentals-and-test-pyramid-023
    difficulty: advanced
    tags: [isolation, junit5-lifecycle]
    question: |
      By default, JUnit 5 (Jupiter) creates test-class instances with which lifecycle, and
      why does it matter for isolation?
    options:
      - "PER_CLASS — one shared instance is reused for every method, which improves isolation by keeping fixtures warm between tests"
      - "PER_METHOD — a new instance is created, yet instance fields are deliberately shared across methods to preserve setup state"
      - "PER_METHOD — a fresh instance per test method, preventing instance-field state from leaking between tests"
      - "There is no default lifecycle at all; every test class must explicitly annotate @TestInstance or Jupiter refuses to run it"
    answer: 2
    explanation: |
      JUnit 5's default is PER_METHOD: a fresh test-class instance is created for each
      test method, so instance fields don't leak between tests. PER_CLASS (opt-in) reuses
      one instance and requires more care to avoid shared-state leakage.
    ref: "concepts.md#test-scope-and-isolation"

  - id: testing-fundamentals-and-test-pyramid-024
    difficulty: intermediate
    tags: [solitary-vs-sociable, fowler]
    question: |
      In Fowler's terms, a "solitary" unit test differs from a "sociable" unit test in
      that it:
    options:
      - "Replaces the unit's collaborators with test doubles so only one class is exercised"
      - "Uses only real, unmocked collaborators and no doubles at all, exercising the full graph of objects the unit depends on"
      - "Can only be written for entirely stateless classes, because any mutable field would make a solitary test impossible to isolate"
      - "Runs in a completely separate JVM process from the other tests, giving it operating-system-level isolation from shared memory"
    answer: 0
    explanation: |
      A solitary test mocks/stubs every collaborator so exactly one class is under test
      (failures localize perfectly). A sociable test lets the unit use its real
      collaborators (more realistic, but a failure may implicate several classes).
    ref: "concepts.md#test-scope-and-isolation"

  - id: testing-fundamentals-and-test-pyramid-025
    difficulty: advanced
    tags: [over-mocking, smell, scenario]
    question: |
      A codebase mocks value objects and its own domain entities in nearly every unit
      test. What is the most likely consequence?
    options:
      - "Tests can pass while the integrated system is broken and shatter on every refactor — a classic over-mocking smell"
      - "Tests become substantially more realistic and start catching many more genuine cross-component integration bugs than before"
      - "Test execution becomes dramatically slower because each mocked value object adds reflection overhead on every single assertion"
      - "The suite automatically climbs to 100% branch coverage, since mocking the domain model forces every conditional path to run"
    answer: 0
    explanation: |
      Reflexive, pervasive mocking (especially of value objects and your own domain model)
      is a well-known smell: it couples tests to internal collaboration, so they break on
      refactors and can stay green while the real, integrated system is broken.
    ref: "concepts.md#test-scope-and-isolation"

  - id: testing-fundamentals-and-test-pyramid-026
    difficulty: intermediate
    tags: [isolation, boundaries, best-practice]
    question: |
      What is a pragmatic default rule for deciding what to replace with a test double?
    options:
      - "Mock every collaborator without exception, always, so that each test exercises exactly one class in complete isolation from the rest"
      - "Mock across process/architectural boundaries (DB, network, broker, clock, randomness); use real objects within a boundary"
      - "Never use test doubles under any circumstances; always wire up the real database, network, and broker even in fast unit tests"
      - "Only mock classes that you personally did not write, and always use the real implementation for any code your own team owns"
    answer: 1
    explanation: |
      The pragmatic default is to double slow/awkward/non-deterministic boundaries — the
      database, network, message broker, the clock, random sources — while using real
      objects for fast in-process collaborators within a boundary. This balances realism
      and localization.
    ref: "concepts.md#test-scope-and-isolation"

  - id: testing-fundamentals-and-test-pyramid-027
    difficulty: beginner
    tags: [fast-feedback, principle]
    question: |
      According to the fast-feedback principle, the value of a test is largely determined
      by what?
    options:
      - "How many lines of code the test method itself contains, with longer, more detailed tests providing proportionally more value"
      - "Whether it wires up real collaborators or substitutes them with mocks and stubs for the unit under test"
      - "How many distinct assertions it packs in, since more assertions per test verify proportionally more behavior at once"
      - "How quickly you learn that it failed after introducing the defect"
    answer: 3
    explanation: |
      A bug found one second after you type it costs almost nothing; the same bug found in
      a nightly run or in production costs far more. The shorter the time between
      introducing and discovering a defect, the cheaper it is to fix — and the more
      valuable the test.
    ref: "concepts.md#the-fast-feedback-principle"

  - id: testing-fundamentals-and-test-pyramid-028
    difficulty: intermediate
    tags: [fast-feedback, unit-runtime]
    question: |
      Why does letting a database call sneak into your "unit" test suite undermine
      fast feedback, even if coverage stays high?
    options:
      - "Database calls quietly reduce the numeric accuracy of assertions by rounding values as they cross the connection boundary"
      - "It invariably causes duplicate test IDs, because each database round-trip reassigns identifiers that the framework then collides"
      - "It forces the entire suite to switch to white-box testing, since any query means tests must assert on internal SQL structure"
      - "It slows the suite so developers stop running it before every commit, collapsing its early-feedback value"
    answer: 3
    explanation: |
      Unit suites must run in seconds/milliseconds so they're run constantly. If I/O
      slows the suite to many minutes, developers commit without running it, so it no
      longer catches bugs early — its feedback value collapses regardless of coverage.
    ref: "concepts.md#the-fast-feedback-principle"

  - id: testing-fundamentals-and-test-pyramid-029
    difficulty: intermediate
    tags: [fast-feedback, ci-stages]
    question: |
      What is the rationale for ordering CI stages as compile/static-analysis → unit →
      integration → E2E?
    options:
      - "The cheapest, fastest checks run first and fail fast, so developers get feedback quickly and expensive stages only run on already-plausible builds"
      - "It looks tidy in the pipeline UI"
      - "E2E tests must always run before unit tests to warm caches"
      - "Static analysis can only run after deployment"
    answer: 0
    explanation: |
      Layering stages by speed makes the pipeline fail fast: cheap fast checks gate first,
      so feedback is quick and slow, expensive stages (integration, E2E) only run when the
      cheaper ones already pass. This mirrors the pyramid on the time axis.
    ref: "concepts.md#the-fast-feedback-principle"

  - id: testing-fundamentals-and-test-pyramid-030
    difficulty: beginner
    tags: [first, acronym]
    question: |
      In the FIRST properties of a good unit test, what does the "R" stand for?
    options:
      - "Reusable — the same test body can be shared across many classes"
      - "Repeatable"
      - "Refactored — the test is rewritten after each production code change"
      - "Realistic — the test must exercise real production dependencies"
    answer: 1
    explanation: |
      FIRST = Fast, Isolated/Independent, Repeatable, Self-validating, Timely. "R" is
      Repeatable: the test yields the same result on every run in any environment, with no
      dependence on wall-clock, timezone, network, or random seeds.
    ref: "concepts.md#what-makes-a-good-test-first"

  - id: testing-fundamentals-and-test-pyramid-031
    difficulty: intermediate
    tags: [first, self-validating]
    question: |
      A test prints values to the console and expects a developer to eyeball the log to
      decide pass/fail. Which FIRST property does it violate?
    options:
      - "Fast — the console printing blocks I/O and slows the test's execution"
      - "Isolated — reading the shared console couples this test to the others"
      - "Self-validating"
      - "Timely — logging output means the test was written too late in the cycle"
    answer: 2
    explanation: |
      Self-validating means the test asserts a clear automated pass/fail with no human
      interpreting output. Relying on a human to read logs violates it — the test isn't a
      reliable, unattended signal.
    ref: "concepts.md#what-makes-a-good-test-first"

  - id: testing-fundamentals-and-test-pyramid-032
    difficulty: intermediate
    tags: [first, repeatable, flaky, scenario]
    question: |
      This test is intermittently failing:
        assertEquals(LocalDate.now().getDayOfWeek(), service.today());
      Which FIRST property is violated, and what's the fix?
    options:
      - "Fast; insert a short Thread.sleep before the assertion so the clock read stabilizes before comparison"
      - "Isolated; move this test into its own class so no other test can interfere with the day-of-week value"
      - "Self-validating; add a print statement so a developer can eyeball the expected day against the actual"
      - "Repeatable; inject a fixed Clock instead of reading the real system clock"
    answer: 3
    explanation: |
      Depending on the real wall clock makes the test non-Repeatable — its result changes
      with the day it runs. The fix is to inject a fixed Clock (Clock.fixed(...)) so time
      is deterministic. Reading Instant.now()/LocalDate.now() directly is the most common
      repeatability violation.
    ref: "concepts.md#what-makes-a-good-test-first"

  - id: testing-fundamentals-and-test-pyramid-033
    difficulty: advanced
    tags: [first, timely, tdd]
    question: |
      The "Timely" property in FIRST specifically argues that tests should be written:
    options:
      - "Just before or alongside the production code, so they actually influence its design"
      - "Only after the code has fully shipped to production and been observed running under real user traffic for a while"
      - "By a separate, independent QA team weeks later, once developers have moved on to their next feature entirely"
      - "Only for the specific code paths that have already caused a customer-facing incident in production at least once"
    answer: 0
    explanation: |
      Timely means writing the test at the right moment — ideally just before or with the
      code (as in TDD) — so testability pressure shapes the design. Tests written long
      after the fact tend to lock in poor, hard-to-test structure.
    ref: "concepts.md#what-makes-a-good-test-first"

  - id: testing-fundamentals-and-test-pyramid-034
    difficulty: intermediate
    tags: [good-test, aaa, structure]
    question: |
      Which pair of properties do senior engineers commonly add beyond the literal FIRST
      acronym when describing a good unit test?
    options:
      - "Longer and more heavily commented, since verbose tests with detailed prose explanations are easier for reviewers to trust"
      - "Readable and behavior-focused (asserting observable outcomes, not implementation)"
      - "Uses the maximum possible number of mocks and asserts directly on private fields to pin down every internal detail"
      - "Runs against a copy of live production data and the real system clock so the scenario stays as authentic as possible"
    answer: 1
    explanation: |
      Beyond FIRST, good tests are readable (the name + failure message explain what
      broke) and behavior-focused (assert observable outcomes, not internal
      implementation), typically following Arrange-Act-Assert with one logical reason to
      fail.
    ref: "concepts.md#what-makes-a-good-test-first"

  - id: testing-fundamentals-and-test-pyramid-035
    difficulty: beginner
    tags: [regression, definition]
    question: |
      What does regression testing verify?
    options:
      - "That a brand-new feature meets its acceptance criteria for the first time"
      - "That the system sustains its latency and throughput targets under sustained peak production load"
      - "That a change has not broken previously working functionality"
      - "That the user requirements were captured correctly and completely before any implementation work began"
    answer: 2
    explanation: |
      Regression testing re-runs existing tests after a change to confirm nothing that
      used to work is now broken. It is the primary business value of a suite — enabling
      safe refactoring and feature addition.
    ref: "concepts.md#regression-testing"

  - id: testing-fundamentals-and-test-pyramid-036
    difficulty: intermediate
    tags: [regression, confirmation, distinction]
    question: |
      How does confirmation testing (re-testing) differ from regression testing?
    options:
      - "They are two interchangeable names for exactly the same activity, differing only in which team happens to use the word"
      - "Confirmation testing is by definition always performed manually, whereas regression testing is by definition always fully automated"
      - "Confirmation testing runs before the code even exists, while regression testing runs only after the change is released to production"
      - "Confirmation testing re-runs the specific failed case to verify a fix; regression testing checks that the fix broke nothing else"
    answer: 3
    explanation: |
      Confirmation (re-testing) re-runs the one previously failing test to verify the
      specific fix works. Regression testing has broader scope — it checks that the fix
      didn't break surrounding or related functionality.
    ref: "concepts.md#regression-testing"

  - id: testing-fundamentals-and-test-pyramid-037
    difficulty: advanced
    tags: [regression, selection, prioritization]
    question: |
      As a suite grows too large to run entirely on every change, which techniques help
      manage regression cost?
    options:
      - "Regression test selection (run only affected tests), test prioritization (run likely-to-fail first), and suite minimization (prune redundant tests)"
      - "Automatically deleting every test in the suite that was first written more than one calendar month ago, regardless of coverage"
      - "Converting each fast isolated unit test into a broad browser-driven end-to-end test that exercises the whole system"
      - "Running the complete regression suite exclusively against the live production environment after every release"
    answer: 0
    explanation: |
      Test selection (impact/coverage-based), prioritization (fault-likelihood ordering),
      and minimization (removing redundant tests) are the standard techniques. The pitfall
      of aggressive minimization is deleting a test that was the only guard on a subtle
      edge case.
    ref: "concepts.md#regression-testing"

  - id: testing-fundamentals-and-test-pyramid-038
    difficulty: intermediate
    tags: [regression, bug-to-test, best-practice]
    question: |
      What is the recommended practice when a bug is found in production?
    options:
      - "Hot-patch the defect directly in the production environment and move on without adding any test to reproduce it"
      - "Reproduce it with a failing test first, then fix it, so the test becomes a permanent regression guard"
      - "Cover the defect with a broad end-to-end test only, and as a strict rule never add any lower-level unit test for it"
      - "Raise the global code-coverage threshold across every module so the build gate mechanically catches this class of bug"
    answer: 1
    explanation: |
      Turn every bug into a test: write a failing test that reproduces the defect, then
      fix it. The test both proves the fix and permanently guards against the bug
      returning — a permanent regression test.
    ref: "concepts.md#regression-testing"

  - id: testing-fundamentals-and-test-pyramid-039
    difficulty: beginner
    tags: [smoke, definition]
    question: |
      A smoke test (build-verification test) run right after a deploy is best described as:
    options:
      - "A narrow but deep exploration of one recently changed feature, exercising all of its edge cases and error branches"
      - "An exhaustive end-to-end run of the entire regression suite covering every feature the application has ever shipped"
      - "A broad, shallow check that the build's critical paths work at all before deeper testing"
      - "A sustained performance test driving the deployed build under peak production load to measure latency and throughput"
    answer: 2
    explanation: |
      Smoke testing is wide and shallow: it checks that critical paths work at all (app
      starts, login works, health endpoint responds) so you can decide whether the build
      is stable enough to justify deeper testing. "Does it turn on without smoke?"
    ref: "concepts.md#smoke-testing-and-sanity-testing"

  - id: testing-fundamentals-and-test-pyramid-040
    difficulty: intermediate
    tags: [smoke-vs-sanity, distinction]
    question: |
      Which best captures the difference between smoke testing and sanity testing?
    options:
      - "Smoke testing is the narrow, deep check of a single feature, while sanity testing is the wide, shallow build-level check"
      - "They are exact synonyms defined identically by ISTQB, so the two terms are fully interchangeable in every context"
      - "Smoke tests are by strict definition always executed by hand, whereas sanity tests are by definition always fully automated"
      - "Smoke is wide and shallow (is the build stable enough to test?); sanity is narrow and deep (does this specific change behave sensibly?)"
    answer: 3
    explanation: |
      Smoke is broad and shallow — a build-level "is it stable enough to test?" check.
      Sanity is narrow and deep — a focused "does this specific change/fix behave
      rationally?" check, usually done before committing to full regression. The terms are
      used loosely in industry, so it's worth defining them.
    ref: "concepts.md#smoke-testing-and-sanity-testing"

  - id: testing-fundamentals-and-test-pyramid-041
    difficulty: intermediate
    tags: [sanity, scenario]
    question: |
      After a one-line fix to the discount rule, an engineer quickly checks just the
      discount-related behavior before running the full suite. This focused check is best
      called:
    options:
      - "Load testing"
      - "Smoke testing"
      - "Sanity testing"
      - "Acceptance testing"
    answer: 2
    explanation: |
      Sanity testing is a narrow, deep check that a specific change/fix behaves rationally
      before investing in full regression. It's focused on the area just touched, unlike
      smoke testing, which broadly verifies the whole build's critical paths.
    ref: "concepts.md#smoke-testing-and-sanity-testing"

  - id: testing-fundamentals-and-test-pyramid-042
    difficulty: beginner
    tags: [shift-left, definition]
    question: |
      "Shift-left testing" means:
    options:
      - "Moving all testing to a dedicated QA team after development"
      - "Moving testing and quality activities earlier in the development lifecycle"
      - "Running tests only in the production (rightmost) environment"
      - "Writing tests exclusively in left-to-right reading order"
    answer: 1
    explanation: |
      Shift-left moves testing and quality activities earlier (leftward) on the
      requirements → design → code → test → release timeline. Instead of a late QA phase,
      quality is built in from the start via developer tests, CI gates, and clarified
      requirements.
    ref: "concepts.md#shift-left-testing"

  - id: testing-fundamentals-and-test-pyramid-043
    difficulty: intermediate
    tags: [shift-left, shift-right, complement]
    question: |
      How does shift-right testing complement shift-left?
    options:
      - "Shift-right has fully superseded shift-left in modern practice, so teams no longer write any tests before release"
      - "Shift-right means deleting every pre-release test and instead relying purely on customer bug reports to find defects"
      - "Shift-left prevents defects earlier; shift-right (canaries, feature flags, observability, chaos) detects in production what prevention missed"
      - "Shift-right simply means writing a larger number of isolated unit tests at the base of the pyramid before shipping"
    answer: 2
    explanation: |
      Shift-left aims to prevent defects early; shift-right tests in production via
      canaries, feature flags, observability, and chaos engineering to detect what slipped
      through. Modern practice does both — prevent on the left, detect on the right.
    ref: "concepts.md#shift-left-testing"

  - id: testing-fundamentals-and-test-pyramid-044
    difficulty: intermediate
    tags: [shift-left, practices]
    question: |
      Which is a concrete shift-left practice?
    options:
      - "Reserving a single full manual regression pass for the week before release and doing no earlier automated testing"
      - "Deferring all test writing until after the feature ships, then having QA backfill tests from the released behavior"
      - "Testing exclusively through production canaries and observability, with no checks run before the deploy at all"
      - "Running static analysis, linting, and security (SAST) scans in CI on every commit"
    answer: 3
    explanation: |
      Running static analysis, linting, type checks, and SAST on every commit catches
      defects at coding time — a hallmark shift-left practice (including shift-left
      security / DevSecOps). Deferring tests or relying only on production testing is the
      opposite.
    ref: "concepts.md#shift-left-testing"

  - id: testing-fundamentals-and-test-pyramid-045
    difficulty: beginner
    tags: [cost-of-bug, curve]
    question: |
      What is the general relationship between when a defect is discovered and the cost to
      fix it?
    options:
      - "Cost stays constant regardless of when a defect is found"
      - "Cost decreases the later a defect is found"
      - "Cost tends to rise the later a defect is discovered in the lifecycle"
      - "Cost is only about the size of the code change"
    answer: 2
    explanation: |
      The later a defect survives undetected, the more expensive it is to fix — a bug
      caught while typing costs seconds; one caught in production can trigger an incident.
      This rising-cost curve is the economic justification for the pyramid, FIRST, fast
      feedback, and shift-left.
    ref: "concepts.md#the-cost-of-a-bug-over-time"

  - id: testing-fundamentals-and-test-pyramid-046
    difficulty: intermediate
    tags: [cost-of-bug, mechanism]
    question: |
      Why does a defect found late (e.g., in production) cost so much more than the same
      defect found at coding time?
    options:
      - "Build and compiler tooling apply a licensing surcharge to patches submitted after the code has already been released"
      - "Lost context, other work built on top of the bug, slow full-system diagnosis, plus incident response, rollback, and reputational cost"
      - "A defect found late always forces a complete rewrite of the entire application from scratch rather than a small targeted patch"
      - "Production defects are always impossible to reproduce locally because code-coverage instrumentation is disabled in release builds"
    answer: 1
    explanation: |
      The fix itself isn't necessarily harder — it's everything around it: you've lost
      context and must relearn the code, other work sits on top of the bug, diagnosis
      across a full system is slow, and a production defect adds incident response,
      possible rollback, and reputational damage.
    ref: "concepts.md#the-cost-of-a-bug-over-time"

  - id: testing-fundamentals-and-test-pyramid-047
    difficulty: advanced
    tags: [cost-of-bug, nuance, sources]
    question: |
      An interviewer challenges the exact "1-10-100" defect-cost multipliers. What is the
      most credible response?
    options:
      - "Insist the exact 1-10-100 multipliers are rigorously proven laws that hold precisely in every project and methodology"
      - "Concede the entire concept is a debunked myth and that when a defect is discovered has no bearing on its fix cost at all"
      - "Cite the direction and mechanism confidently (later = costlier, due to lost context and downstream impact) while acknowledging the precise multipliers come from older, debated studies"
      - "Claim the cost-escalation effect applies only to waterfall projects and is completely irrelevant to any modern delivery process"
    answer: 2
    explanation: |
      The robust, defensible part is the trend and mechanism: defects cost more the later
      they're found. The specific 1-10-100 / IBM / NIST multipliers come from older studies
      whose exact figures are debated and don't map cleanly onto modern CD. Assert the
      direction; hedge the numbers.
    ref: "concepts.md#the-cost-of-a-bug-over-time"

  - id: testing-fundamentals-and-test-pyramid-048
    difficulty: advanced
    tags: [synthesis, economics]
    question: |
      What single economic goal ties together the test pyramid, the FIRST principles,
      fast feedback, and shift-left?
    options:
      - "Maximizing the total number of lines of test code written, on the premise that more test code always means more safety"
      - "Completely eliminating the need for any human or manual testing anywhere in the delivery process once automation exists"
      - "Driving every module in the codebase to exactly 100% line and branch coverage as the single overriding success metric"
      - "Finding each defect at the cheapest possible moment by shrinking the time between introducing and discovering it"
    answer: 3
    explanation: |
      All four are tactics for one strategy: minimize the time (and thus cost) between
      introducing a bug and discovering it. The pyramid, FIRST, fast feedback, and
      shift-left each push defect discovery earlier and cheaper.
    ref: "concepts.md#the-cost-of-a-bug-over-time"
