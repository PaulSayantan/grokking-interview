topic: "Code Coverage & Mutation Testing"
domain: testing
topic_slug: code-coverage-and-mutation-testing
version: 1
questions:
  - id: code-coverage-and-mutation-testing-001
    difficulty: beginner
    tags: [coverage, definition, execution]
    question: |
      What does code coverage actually measure?
    options:
      - "The percentage of production code that was executed while the tests ran"
      - "The proportion of the test cases that passed rather than failing"
      - "Whether the assertions in your tests are strong enough to catch bugs"
      - "The count of latent defects still remaining in the production code"
    answer: 0
    explanation: |
      Coverage records which parts of the production code were *executed* by the test suite. It says
      nothing about whether the tests assert anything meaningful, nor about pass/fail rates or
      residual bug counts.
    ref: "concepts.md#why-coverage-is-necessary-but-not-sufficient"

  - id: code-coverage-and-mutation-testing-002
    difficulty: beginner
    tags: [coverage, limitation, assertions]
    question: |
      Why is a high code-coverage number not proof that code is well tested?
    options:
      - "Because coverage tools are usually inaccurate and overcount executed lines"
      - "Because coverage measurement only works on statically compiled languages"
      - "Because coverage measures execution, not whether the result was asserted/verified"
      - "Because coverage counts lines of the test code rather than production code"
    answer: 2
    explanation: |
      Coverage records that a line ran, not that any assertion checked its result. A test that calls
      a method but asserts nothing still counts as covering it, so a bug there would pass silently.
    ref: "concepts.md#why-coverage-is-necessary-but-not-sufficient"

  - id: code-coverage-and-mutation-testing-003
    difficulty: intermediate
    tags: [coverage, signal, floor]
    question: |
      Which statement best captures the correct interpretation of coverage numbers?
    options:
      - "High coverage strongly proves the code is correct and largely free of behavioral defects"
      - "Low coverage is only a weak signal, while high coverage is a strong signal of overall quality"
      - "Coverage and test quality are fundamentally the same thing measured differently"
      - "Low coverage reliably shows untested code; high coverage only proves code ran, not that it was checked"
    answer: 3
    explanation: |
      Low coverage is a reliable *negative* signal (that code is untested). High coverage is only a
      weak *positive* signal — it proves execution, not verification. Treat coverage as a floor for
      finding untested code, not as proof of quality.
    ref: "concepts.md#why-coverage-is-necessary-but-not-sufficient"

  - id: code-coverage-and-mutation-testing-004
    difficulty: intermediate
    tags: [coverage, assertion-free, scenario]
    question: |
      A test calls `service.process(input)` twice with different arguments to hit both branches, but
      contains no assertions. JaCoCo reports 100% branch coverage of `process`. What is true?
    options:
      - "The method is now fully tested and protected against output regressions"
      - "The method is covered but a bug in its output would go undetected because nothing is asserted"
      - "The reported coverage number is incorrect and should simply be ignored"
      - "The test will fail whenever process returns without throwing an exception"
    answer: 1
    explanation: |
      Executing both branches yields full branch coverage, but with no assertions nothing verifies
      the output. A regression that returns the wrong value would still pass. This is the canonical
      example of coverage being necessary but not sufficient.
    ref: "concepts.md#why-coverage-is-necessary-but-not-sufficient"

  - id: code-coverage-and-mutation-testing-005
    difficulty: beginner
    tags: [metrics, line, statement, c0]
    question: |
      Statement (line) coverage is sometimes called which of these?
    options:
      - "C1"
      - "MC/DC"
      - "C0"
      - "Path coverage"
    answer: 2
    explanation: |
      Statement/line coverage is the weakest structural criterion and is commonly labeled C0. Branch
      (decision) coverage is C1, which subsumes C0.
    ref: "concepts.md#coverage-metrics-line-statement-branch-condition-mcdc-path"

  - id: code-coverage-and-mutation-testing-006
    difficulty: intermediate
    tags: [metrics, line-vs-branch, scenario]
    question: |
      Consider `return n > 0 ? "pos" : "nonpos";` on a single line. One test runs it with `n = 5`.
      What coverage results?
    options:
      - "100% line coverage but only 50% branch coverage"
      - "50% line coverage and 50% branch coverage on that line"
      - "100% line coverage and a full 100% branch coverage too"
      - "0% line coverage because ternary expressions aren't counted"
    answer: 0
    explanation: |
      The single line executes, so line coverage is 100%. But only the `n > 0` (true) branch was
      taken; the false branch never ran, so branch coverage is 50%. This is why branch coverage is a
      more honest target than line coverage.
    ref: "concepts.md#coverage-metrics-line-statement-branch-condition-mcdc-path"

  - id: code-coverage-and-mutation-testing-007
    difficulty: intermediate
    tags: [metrics, branch, condition]
    question: |
      For `if (a && b)`, what additional requirement does *condition* coverage impose beyond
      *branch* (decision) coverage?
    options:
      - "Nothing at all — the two criteria are exactly identical for compound conditions"
      - "Every statement inside the if-block body must also be executed at least once"
      - "The whole enclosing method must be executed at least twice per test run"
      - "Each individual sub-condition (a and b) must be evaluated both true and false"
    answer: 3
    explanation: |
      Branch coverage only needs the overall decision to be both true and false. Condition coverage
      additionally requires each sub-condition (a and b) to take both truth values, which decision
      coverage alone does not guarantee.
    ref: "concepts.md#coverage-metrics-line-statement-branch-condition-mcdc-path"

  - id: code-coverage-and-mutation-testing-008
    difficulty: advanced
    tags: [metrics, mcdc, safety-critical]
    question: |
      What does MC/DC (Modified Condition/Decision Coverage) require, and where is it typically
      mandated?
    options:
      - "Every possible execution path exercised at least once; mandated for all public web applications"
      - "Each condition independently shown to affect the decision's outcome; mandated for safety-critical software like avionics (DO-178C)"
      - "Every source line executed at least once; mandated by the ISO 9001 quality standard"
      - "Only that each overall branch is taken; mandated specifically for relational database code"
    answer: 1
    explanation: |
      MC/DC requires demonstrating, for each condition, that flipping only that condition flips the
      decision outcome — proving each condition independently matters. It is the aviation-grade
      criterion (DO-178C) used for safety-critical software.
    ref: "concepts.md#coverage-metrics-line-statement-branch-condition-mcdc-path"

  - id: code-coverage-and-mutation-testing-009
    difficulty: advanced
    tags: [metrics, mcdc, test-count]
    question: |
      For a decision with n boolean conditions, MC/DC can typically be satisfied with how many
      well-chosen test cases (versus multiple-condition coverage)?
    options:
      - "The full 2^n tests, matching multiple-condition coverage exactly"
      - "Exactly n tests, one dedicated to flipping each individual condition"
      - "n + 1 tests, versus 2^n for full multiple-condition coverage"
      - "Always exactly 3 tests, regardless of how many conditions n there are"
    answer: 2
    explanation: |
      MC/DC is achievable with n+1 carefully chosen tests, compared to the 2^n combinations required
      for full multiple-condition coverage. That efficiency is why it's the pragmatic strong
      criterion for safety-critical code.
    ref: "concepts.md#coverage-metrics-line-statement-branch-condition-mcdc-path"

  - id: code-coverage-and-mutation-testing-010
    difficulty: advanced
    tags: [metrics, path-coverage]
    question: |
      Why is full path coverage usually infeasible in practice?
    options:
      - "Because coverage tools are fundamentally unable to instrument loop bodies at all"
      - "Because it is a strictly weaker criterion than plain statement coverage"
      - "Because it requires original source code, which is frequently unavailable"
      - "Because loops can make the number of distinct paths explode (potentially infinite)"
    answer: 3
    explanation: |
      Path coverage requires exercising every route through the control-flow graph. Loops can create
      an enormous or unbounded number of paths, making full path coverage largely theoretical and
      infeasible for real programs. It is the strongest structural criterion.
    ref: "concepts.md#coverage-metrics-line-statement-branch-condition-mcdc-path"

  - id: code-coverage-and-mutation-testing-011
    difficulty: intermediate
    tags: [metrics, subsumption]
    question: |
      Which ordering correctly ranks these criteria from weakest to strongest?
    options:
      - "Statement -> Branch -> MC/DC -> Path"
      - "Path -> Branch -> Statement"
      - "Branch -> Statement -> Path -> MC/DC"
      - "MC/DC -> Path -> Statement -> Branch"
    answer: 0
    explanation: |
      From weakest to strongest: statement/line, then branch/decision, then condition, then MC/DC,
      then path. Stronger criteria generally subsume weaker ones.
    ref: "concepts.md#coverage-metrics-line-statement-branch-condition-mcdc-path"

  - id: code-coverage-and-mutation-testing-012
    difficulty: beginner
    tags: [jacoco, jvm, tool]
    question: |
      What is JaCoCo?
    options:
      - "A bytecode-level mutation-testing tool that injects faults on the JVM"
      - "The de-facto JVM code-coverage library that reports counters like instructions, branches, and lines"
      - "A JUnit 5 assertion library offering fluent matchers and soft assertions"
      - "A load-testing tool that generates concurrent traffic against endpoints"
    answer: 1
    explanation: |
      JaCoCo (Java Code Coverage) is the standard JVM coverage tool, reporting counters for
      instructions, branches, lines, methods, classes, and complexity. Mutation testing on the JVM
      is done by PIT, not JaCoCo.
    ref: "concepts.md#jacoco-how-jvm-coverage-is-measured"

  - id: code-coverage-and-mutation-testing-013
    difficulty: intermediate
    tags: [jacoco, bytecode, instrumentation]
    question: |
      At what level does JaCoCo instrument code to collect coverage?
    options:
      - "It parses the original Java source files directly on disk"
      - "The running JIT-compiled native machine code in the CPU"
      - "The abstract syntax tree produced by the compiler frontend"
      - "Java bytecode (its fundamental counter is instructions, C0)"
    answer: 3
    explanation: |
      JaCoCo works on Java bytecode; its most fundamental counter is instructions (C0), which is
      independent of source formatting and available even without source. Line coverage additionally
      needs debug information.
    ref: "concepts.md#jacoco-how-jvm-coverage-is-measured"

  - id: code-coverage-and-mutation-testing-014
    difficulty: advanced
    tags: [jacoco, line-coverage, debug-info]
    question: |
      What must be true for JaCoCo to compute line-level coverage?
    options:
      - "The tests must all run within a single non-forked thread"
      - "The original source files must be present on the runtime classpath"
      - "The classes must be compiled with debug information"
      - "The JVM must be started with the -ea assertions flag enabled"
    answer: 2
    explanation: |
      Line coverage relies on line-number debug information embedded in the class files (compiled
      with `-g`). Instruction and branch coverage are available even without debug info, but line
      mapping is not.
    ref: "concepts.md#jacoco-how-jvm-coverage-is-measured"

  - id: code-coverage-and-mutation-testing-015
    difficulty: advanced
    tags: [jacoco, branches, exceptions]
    question: |
      How does JaCoCo treat try/catch exception handling with respect to branch coverage and
      cyclomatic complexity?
    options:
      - "Exception handling is NOT counted as branches, so try/catch does not raise reported complexity"
      - "Each catch block is counted as an extra branch and thereby raises cyclomatic complexity"
      - "try/catch blocks are entirely excluded from every JaCoCo counter and report"
      - "Only checked exceptions count as branches, while unchecked ones are ignored"
    answer: 0
    explanation: |
      JaCoCo does not consider exception handling as branches in its branch-counter definition.
      Because complexity is derived from branches, try/catch blocks do not increase the reported
      cyclomatic complexity.
    ref: "concepts.md#jacoco-how-jvm-coverage-is-measured"

  - id: code-coverage-and-mutation-testing-016
    difficulty: intermediate
    tags: [jacoco, partial-coverage, yellow]
    question: |
      In a JaCoCo report, a source line is highlighted yellow (partially covered). What does that
      most likely indicate?
    options:
      - "The line was never executed by any test at all"
      - "The line executed but at least one branch on it was never taken"
      - "The line contains a compilation error flagged by the build"
      - "The line has been explicitly excluded from coverage reporting"
    answer: 1
    explanation: |
      Yellow (partial) means the line ran but not all of its branches were exercised — a strong hint
      of a missed decision path (e.g. an untaken false branch). Red means no coverage; green means
      fully covered.
    ref: "concepts.md#jacoco-how-jvm-coverage-is-measured"

  - id: code-coverage-and-mutation-testing-017
    difficulty: intermediate
    tags: [jacoco, gate, ci, scenario]
    question: |
      A team's CI gate fails builds below 80% LINE coverage. Reviewers keep noticing untested `else`
      branches slipping through. What is the best improvement?
    options:
      - "Raise the existing line-coverage threshold from 80% up to 95%"
      - "Switch away from JaCoCo to a different coverage measurement tool"
      - "Gate on BRANCH (or instruction) coverage rather than only LINE coverage"
      - "Remove the coverage gate entirely and rely on manual code review"
    answer: 2
    explanation: |
      Line-coverage gates are easy to satisfy without exercising both sides of a decision. Gating on
      branch (or instruction) coverage forces the untaken else/false paths to be tested, closing the
      exact gap the reviewers found.
    ref: "concepts.md#jacoco-how-jvm-coverage-is-measured"

  - id: code-coverage-and-mutation-testing-018
    difficulty: intermediate
    tags: [quality, assertion-free, anti-pattern]
    question: |
      Which of these inflates coverage while adding little or no bug-detection value?
    options:
      - "A test that asserts an exact expected value and an expected exception"
      - "A parameterized test covering several representative inputs with assertions"
      - "A test that verifies a boundary condition with a precise assertion"
      - "A test that calls a method and asserts nothing about its result"
    answer: 3
    explanation: |
      Calling a method without asserting on its result raises coverage but detects no regression in
      the returned value. The other options combine execution with meaningful verification.
    ref: "concepts.md#why-high-coverage--good-tests"

  - id: code-coverage-and-mutation-testing-019
    difficulty: intermediate
    tags: [quality, over-mocking, scenario]
    question: |
      A unit test mocks the very collaborator that holds the logic being verified, then asserts the
      mock returned the stubbed value. Coverage looks high. What's the flaw?
    options:
      - "Mocks always reduce the reported coverage because stubbed methods never count as executed"
      - "The test verifies the mock's stubbed behavior, not the real production logic"
      - "The test cannot compile at all because a mock cannot stand in for a concrete collaborator"
      - "Coverage tools silently ignore any class that has been replaced by a Mockito mock"
    answer: 1
    explanation: |
      Over-mocking replaces the real logic with a stub, so the assertion only confirms what the stub
      was told to return. Coverage of the surrounding code may look fine, but the actual behavior is
      never exercised — a classic false-confidence pattern.
    ref: "concepts.md#why-high-coverage--good-tests"

  - id: code-coverage-and-mutation-testing-020
    difficulty: intermediate
    tags: [quality, assertion-strength, scenario]
    question: |
      Two tests achieve identical coverage of `parseAmount`. Test A asserts `assertNotNull(result)`;
      Test B asserts `result.isEqualByComparingTo("12.34")`. Why is B stronger?
    options:
      - "B would fail if the method returned a wrong-but-non-null value; A would not"
      - "B executes strictly more production lines than A, so it earns higher branch coverage"
      - "A runs measurably faster and is therefore scheduled to execute far more often in CI"
      - "There is no meaningful difference because equal coverage guarantees equal fault detection"
    answer: 0
    explanation: |
      Both hit the same code, so coverage is equal. But `assertNotNull` passes for any non-null
      value, including a wrong one, whereas the exact-value assertion catches an incorrect result.
      Assertion strength — not coverage — is what detects the bug.
    ref: "concepts.md#why-high-coverage--good-tests"

  - id: code-coverage-and-mutation-testing-021
    difficulty: advanced
    tags: [quality, swallowed-exception]
    question: |
      Why can a test wrapped in `try { ... } catch (Exception e) { }` be dangerous even at high
      coverage?
    options:
      - "The broad try/catch wrapper adds enough overhead to slow the whole suite by roughly 30%"
      - "Wrapping test code in try/catch prevents the JaCoCo coverage agent from attaching to the JVM"
      - "It executes the code (raising coverage) but swallows failures, so bugs and assertion errors are hidden"
      - "A catch clause on Exception always triggers a checked-exception compilation error at build time"
    answer: 2
    explanation: |
      Catching and ignoring exceptions lets the lines run (coverage goes up) but suppresses any
      thrown failure — including assertion errors — so the test can never fail. The code is
      'covered' yet effectively unverified.
    ref: "concepts.md#why-high-coverage--good-tests"

  - id: code-coverage-and-mutation-testing-022
    difficulty: beginner
    tags: [goodhart, targets]
    question: |
      Goodhart's law, applied to coverage targets, warns that:
    options:
      - "Coverage instrumentation grows measurably slower as the mandated target percentage rises"
      - "Branch coverage is always a strictly better and more reliable target than line coverage"
      - "Coverage should always be mandated at exactly 100% to eliminate any untested code paths"
      - "When a measure becomes a target, it ceases to be a good measure"
    answer: 3
    explanation: |
      Goodhart's law: "When a measure becomes a target, it ceases to be a good measure." Mandating a
      coverage percentage pushes developers to optimize the number (e.g. assertion-free or trivial
      tests) rather than actual testing quality.
    ref: "concepts.md#goodharts-law-and-coverage-targets"

  - id: code-coverage-and-mutation-testing-023
    difficulty: intermediate
    tags: [goodhart, gaming, scenario]
    question: |
      Which behavior is a symptom of a coverage target being *gamed* rather than genuinely improving
      testing?
    options:
      - "Writing assertion-free tests and testing trivial getters just to raise the percentage"
      - "Adding precise value-and-exception assertions to previously weak, execution-only tests"
      - "Gating coverage on the changed lines in a PR so authors test exactly what they touched"
      - "Combining the coverage percentage with a mutation score to judge real assertion strength"
    answer: 0
    explanation: |
      Assertion-free tests and padding with trivial getters bump the number without improving
      fault detection — the textbook symptom of gaming a target. The other options are healthy
      practices.
    ref: "concepts.md#goodharts-law-and-coverage-targets"

  - id: code-coverage-and-mutation-testing-024
    difficulty: intermediate
    tags: [goodhart, diff-coverage, ci]
    question: |
      Why is gating on *diff/patch coverage* (changed code) often better than a whole-repo coverage
      percentage?
    options:
      - "It is far cheaper to compute because it inspects only the diff, not the whole repository"
      - "It is more actionable and less gameable — it focuses tests on the code actually being changed"
      - "It always produces a higher percentage than whole-repo coverage because the denominator is smaller"
      - "It removes the need to actually run the tests, since the diff alone reveals the covered lines"
    answer: 1
    explanation: |
      Diff coverage targets the code under change, making it directly actionable ("test what you
      touched") and harder to dilute with unrelated trivial code. Whole-repo percentages are easier
      to game and slower to move.
    ref: "concepts.md#goodharts-law-and-coverage-targets"

  - id: code-coverage-and-mutation-testing-025
    difficulty: advanced
    tags: [goodhart, diminishing-returns]
    question: |
      What is the mature stance on chasing coverage from 95% to 100%?
    options:
      - "Always required, because reaching a full 100% coverage mathematically guarantees the code is correct"
      - "It is the single best predictor of quality, outweighing assertion strength and mutation score combined"
      - "Impossible to reach with JaCoCo, whose instruction counter caps the achievable figure at about 95%"
      - "It often has diminishing returns — you end up testing trivia or writing brittle tests; coverage is a floor, not a sacred goal"
    answer: 3
    explanation: |
      The big gains are early (e.g. 40%->80% finds real holes). The last few percent often means
      testing trivial or generated code or writing brittle tests. Coverage is best used as a floor;
      combine it with mutation score for real signal.
    ref: "concepts.md#goodharts-law-and-coverage-targets"

  - id: code-coverage-and-mutation-testing-026
    difficulty: beginner
    tags: [mutation, definition, mutant]
    question: |
      In mutation testing, what is a "mutant"?
    options:
      - "A test that fails intermittently due to timing or ordering, otherwise known as a flaky test"
      - "A test method that has been auto-generated by a tool from the production code's signatures"
      - "A small modified copy of the production code with one deliberate fault injected"
      - "A production class that no test in the suite reaches, leaving it at zero percent coverage"
    answer: 2
    explanation: |
      A mutant is a version of the production code with a tiny deliberate change (e.g. `>` -> `>=`).
      The test suite is run against it to see whether any test detects the injected fault.
    ref: "concepts.md#mutation-testing-mutants-killed-vs-survived"

  - id: code-coverage-and-mutation-testing-027
    difficulty: beginner
    tags: [mutation, killed, survived]
    question: |
      A mutant is "killed" when:
    options:
      - "At least one test fails when run against the mutant"
      - "All of the tests still pass unchanged after the fault was injected"
      - "The mutant fails to compile and PIT discards it before running"
      - "The overall line-coverage percentage drops once the mutant runs"
    answer: 0
    explanation: |
      Killed means a test failed against the mutant — the injected fault was detected (good). If all
      tests still pass, the mutant survived, indicating a gap in test strength.
    ref: "concepts.md#mutation-testing-mutants-killed-vs-survived"

  - id: code-coverage-and-mutation-testing-028
    difficulty: intermediate
    tags: [mutation, survived, gap]
    question: |
      Why is a *survived* mutant on code that is fully covered by tests especially informative?
    options:
      - "It proves the coverage tool miscounted and is reporting that line as covered incorrectly"
      - "It pinpoints code that executed but whose behavior no assertion actually verified"
      - "It means the code has no tests at all and should be flagged as an outright coverage gap"
      - "It indicates a flaky test whose intermittent failure let the injected fault slip through"
    answer: 1
    explanation: |
      Coverage says the line ran; a surviving mutant there means the mutated behavior still passed
      all tests — so nothing asserted the correct result. It is the precise weak-assertion gap that
      coverage cannot reveal.
    ref: "concepts.md#mutation-testing-mutants-killed-vs-survived"

  - id: code-coverage-and-mutation-testing-029
    difficulty: intermediate
    tags: [mutation, no-coverage, status]
    question: |
      In a PIT report, what does a mutant with status NO_COVERAGE indicate?
    options:
      - "A test failed on the mutant, meaning the injected fault was successfully detected and killed"
      - "The mutation caused an infinite loop and PIT aborted the run after hitting its timeout limit"
      - "The mutant was behaviorally equivalent, so no test could ever distinguish it from the original"
      - "No test executed the mutated code at all — a coverage gap, not an assertion gap"
    answer: 3
    explanation: |
      NO_COVERAGE means no test even reached the mutated line, so it's a reach/coverage gap rather
      than a weak-assertion gap. TIMED_OUT indicates an infinite loop (counted as killed); SURVIVED
      means tests ran but none detected the change.
    ref: "concepts.md#mutation-testing-mutants-killed-vs-survived"

  - id: code-coverage-and-mutation-testing-030
    difficulty: advanced
    tags: [mutation, timeout, status]
    question: |
      A mutation turns a loop condition into one that never terminates. How does PIT typically
      classify the resulting mutant?
    options:
      - "SURVIVED, because the tests all completed and no assertion ever failed against the mutant"
      - "NO_COVERAGE, since a non-terminating loop means no test can ever reach the mutated condition"
      - "TIMED_OUT, which PIT counts as killed (a test detected it via timeout)"
      - "NON_VIABLE, because a loop that never terminates is rejected by the JVM bytecode verifier"
    answer: 2
    explanation: |
      An infinite loop trips PIT's timeout, classified as TIMED_OUT and counted as killed — the
      change was effectively detected. NON_VIABLE is for mutants that fail to load/verify.
    ref: "concepts.md#mutation-testing-mutants-killed-vs-survived"

  - id: code-coverage-and-mutation-testing-031
    difficulty: advanced
    tags: [mutation, hypotheses, theory]
    question: |
      The "Competent Programmer Hypothesis" and the "Coupling Effect" are used to justify mutation
      testing. What do they claim, respectively?
    options:
      - "Competent programmers write no bugs at all; and simple single-assertion tests add no value"
      - "Real bugs are small deviations from correct code; and tests catching simple faults tend to catch complex ones"
      - "All programmers are equally skilled by definition; and coverage percentage directly equals test quality"
      - "Injected mutants are almost always equivalent; and genuinely complex faults are vanishingly rare in practice"
    answer: 1
    explanation: |
      The Competent Programmer Hypothesis says real faults are small deviations, so small syntactic
      mutants resemble real bugs. The Coupling Effect says test data that detects simple faults also
      tends to detect more complex ones. Together they justify using tiny mutations as proxies.
    ref: "concepts.md#mutation-testing-mutants-killed-vs-survived"

  - id: code-coverage-and-mutation-testing-032
    difficulty: beginner
    tags: [pit, tool, jvm]
    question: |
      What does PIT (PITest) do?
    options:
      - "Performs mutation testing on the JVM by mutating bytecode and running your test suite against each mutant"
      - "Measures line and branch coverage on the JVM by instrumenting bytecode and emitting an HTML report"
      - "Generates concurrent load against HTTP endpoints and reports latency percentiles under stress"
      - "Records live HTTP interactions and replays them later as deterministic contract-style tests"
    answer: 0
    explanation: |
      PIT is the standard JVM mutation-testing tool. It mutates bytecode (fast, no recompilation) and
      runs JUnit/TestNG tests against each mutant, reporting killed/survived and a mutation score.
    ref: "concepts.md#mutation-operators-and-pit-pitest"

  - id: code-coverage-and-mutation-testing-033
    difficulty: intermediate
    tags: [pit, mutators, conditionals-boundary]
    question: |
      PIT's CONDITIONALS_BOUNDARY mutator does what?
    options:
      - "Removes the entire conditional so the guarded block always executes unconditionally"
      - "Replaces the method's return value with null to expose missing null-handling in callers"
      - "Negates the whole condition, e.g. `==` becomes `!=`, flipping which branch is taken"
      - "Swaps a relational operator for its boundary counterpart, e.g. `<` becomes `<=`"
    answer: 3
    explanation: |
      CONDITIONALS_BOUNDARY replaces relational operators with their boundary versions (`<`->`<=`,
      `>=`->`>`, etc.), targeting off-by-one/boundary mistakes. Flipping `==` to `!=` is
      NEGATE_CONDITIONALS.
    ref: "concepts.md#mutation-operators-and-pit-pitest"

  - id: code-coverage-and-mutation-testing-034
    difficulty: intermediate
    tags: [pit, mutators, math]
    question: |
      The PIT MATH mutator would most likely transform which expression?
    options:
      - "`return x;` into `return null;`"
      - "`a == b` into `a != b`"
      - "`a + b` into `a - b`"
      - "`list.clear();` into a removed call"
    answer: 2
    explanation: |
      MATH replaces a binary arithmetic operation with another (e.g. `+`->`-`, `*`->`/`). Flipping
      `==`->`!=` is NEGATE_CONDITIONALS; null returns is NULL_RETURNS; removing a void call is
      VOID_METHOD_CALLS.
    ref: "concepts.md#mutation-operators-and-pit-pitest"

  - id: code-coverage-and-mutation-testing-035
    difficulty: intermediate
    tags: [pit, mutators, void-method-calls, scenario]
    question: |
      A method calls `auditLog.record(event);` (a void call) and returns. PIT's VOID_METHOD_CALLS
      mutator removes that call, and no test fails. What does the surviving mutant tell you?
    options:
      - "The audit logging is over-tested, since a surviving mutant signals redundant assertions on it"
      - "No test verifies that the audit call actually happened — consider verifying the interaction"
      - "VOID_METHOD_CALLS is not a real mutator, so the surviving result is a PIT configuration artifact"
      - "The method must be refactored to return a value before PIT is able to mutate the call at all"
    answer: 1
    explanation: |
      If removing the void call doesn't fail any test, nothing asserts that the side effect occurred.
      For a genuinely important side effect you'd add a verification (e.g. Mockito `verify`) to kill
      that mutant; if the call is truly incidental, the surviving mutant may be acceptable.
    ref: "concepts.md#mutation-operators-and-pit-pitest"

  - id: code-coverage-and-mutation-testing-036
    difficulty: advanced
    tags: [pit, returns, mutators]
    question: |
      PIT's newer "returns" mutator set (EMPTY_RETURNS, FALSE_RETURNS, TRUE_RETURNS, NULL_RETURNS,
      PRIMITIVE_RETURNS) primarily replaced which older mutator?
    options:
      - "RETURN_VALS (now in the OLD_DEFAULTS group)"
      - "NEGATE_CONDITIONALS, the operator that flips each conditional's sense (e.g. `==` to `!=`)"
      - "CONDITIONALS_BOUNDARY, the operator that shifts relational bounds (e.g. `<` to `<=`)"
      - "INCREMENTS, the operator that swaps `++` for `--` on local-variable increments"
    answer: 0
    explanation: |
      The returns mutator set superseded the older RETURN_VALS mutator, which now lives in the
      OLD_DEFAULTS group. The returns set produces more targeted, meaningful mutations of return
      values by type.
    ref: "concepts.md#mutation-operators-and-pit-pitest"

  - id: code-coverage-and-mutation-testing-037
    difficulty: advanced
    tags: [pit, test-selection, performance]
    question: |
      To keep runs fast, how does PIT decide which tests to run against a given mutant?
    options:
      - "It runs the entire test suite against every single mutant, regardless of which lines that mutant touches"
      - "It runs tests in alphabetical class-name order until the overall build timeout is finally reached"
      - "It uses coverage data to run only the tests that reach the mutated line, and stops at the first killing test"
      - "It runs only the tests explicitly annotated with @Mutation, ignoring the rest of the suite"
    answer: 2
    explanation: |
      PIT uses per-line coverage to select only tests that actually exercise the mutated code, and
      it fails fast — stopping as soon as one test kills the mutant. Together with bytecode mutation
      this makes runs tractable.
    ref: "concepts.md#mutation-operators-and-pit-pitest"

  - id: code-coverage-and-mutation-testing-038
    difficulty: advanced
    tags: [pit, junit5, plugin, scenario]
    question: |
      A team adds PIT to a JUnit 5 (Jupiter) project but every mutant reports NO_COVERAGE even though
      tests clearly run in Maven. What is the most likely cause?
    options:
      - "The tests contain no assertions, so PIT records every mutant as uncovered by default"
      - "PIT has no support for Maven builds and only integrates with Gradle-based test projects"
      - "JaCoCo must be disabled first because its bytecode agent conflicts with PIT's own instrumentation"
      - "The pitest-junit5-plugin dependency is missing, so PIT cannot discover Jupiter tests"
    answer: 3
    explanation: |
      PIT needs the `pitest-junit5-plugin` to discover and run Jupiter tests. Without it PIT finds no
      tests, so no test reaches any mutant and everything is reported as NO_COVERAGE.
    ref: "concepts.md#mutation-operators-and-pit-pitest"

  - id: code-coverage-and-mutation-testing-039
    difficulty: beginner
    tags: [mutation-score, definition]
    question: |
      How is the mutation score typically defined?
    options:
      - "Total generated mutants divided by the module's total lines of production code"
      - "Killed mutants divided by total non-equivalent mutants"
      - "Surviving mutants divided by the total number of test methods in the suite"
      - "Covered source lines divided by the total number of executable lines"
    answer: 1
    explanation: |
      Mutation score = killed / total non-equivalent mutants, usually as a percentage. It is a proxy
      for test-suite strength (fault-detection power), unlike coverage which only measures reach.
    ref: "concepts.md#mutation-score-and-test-strength"

  - id: code-coverage-and-mutation-testing-040
    difficulty: intermediate
    tags: [mutation-score, test-strength, pit]
    question: |
      PIT reports a separate "test strength" number alongside mutation coverage. How does test
      strength differ?
    options:
      - "It is killed divided by mutants that were covered, excluding NO_COVERAGE mutants"
      - "It counts only the equivalent mutants that no possible test could ever kill"
      - "It is identical to line coverage, just relabeled in the PIT HTML report output"
      - "It measures how long the whole suite takes to run against the generated mutants"
    answer: 0
    explanation: |
      Test strength = killed / covered mutants (it excludes NO_COVERAGE cases). This isolates pure
      assertion quality on the code the tests actually reach, separating it from mere coverage gaps.
    ref: "concepts.md#mutation-score-and-test-strength"

  - id: code-coverage-and-mutation-testing-041
    difficulty: intermediate
    tags: [mutation-score, coverage, scenario]
    question: |
      A module has 100% line coverage but only a 55% mutation score. What does this most strongly
      indicate?
    options:
      - "The coverage report is wrong and has silently overcounted the executed lines"
      - "The module has no tests at all despite what the coverage number claims"
      - "Tests execute the code but many assertions are too weak to detect injected faults"
      - "The mutation tool is misconfigured and its low score should simply be ignored"
    answer: 2
    explanation: |
      Full coverage with a low mutation score is the classic 'runs it but doesn't check it' pattern:
      lines execute (100% coverage) but many mutants survive because assertions are weak. The fix is
      to strengthen assertions to kill the surviving mutants.
    ref: "concepts.md#mutation-score-and-test-strength"

  - id: code-coverage-and-mutation-testing-042
    difficulty: advanced
    tags: [mutation-score, ratchet, trend]
    question: |
      Why do teams often gate on a mutation-score *threshold* or *trend on changed code* rather than
      demanding an absolute 100%?
    options:
      - "Because PIT is fundamentally unable to compute an exact mutation score for any module"
      - "Because a threshold gate makes each mutation-testing build run measurably faster"
      - "Because the mutation score is entirely unrelated to the strength of a test suite"
      - "Because 100% is generally unattainable due to equivalent mutants; tracking a threshold/trend on changed code is more practical"
    answer: 3
    explanation: |
      Equivalent mutants make 100% effectively impossible, so absolute targets are counterproductive.
      Like coverage, teams ratchet a threshold and watch the trend on changed code — a dropping score
      on new code flags eroding quality even when coverage holds steady.
    ref: "concepts.md#mutation-score-and-test-strength"

  - id: code-coverage-and-mutation-testing-043
    difficulty: beginner
    tags: [equivalent-mutants, definition]
    question: |
      What is an "equivalent mutant"?
    options:
      - "A mutant whose injected fault is byte-for-byte identical to another mutant in the same run"
      - "A mutation that changes the code but not its observable behavior, so no test can ever kill it"
      - "A mutant that is always killed by the very first test PIT happens to execute against it"
      - "A mutant that fails to compile and is therefore discarded before any test runs"
    answer: 1
    explanation: |
      An equivalent mutant alters the syntax but produces behavior indistinguishable from the
      original, so no test could detect it. Such mutants can never be killed and unfairly drag down a
      naive mutation score.
    ref: "concepts.md#equivalent-mutants-and-the-cost-of-mutation-testing"

  - id: code-coverage-and-mutation-testing-044
    difficulty: advanced
    tags: [equivalent-mutants, undecidable]
    question: |
      Why can't equivalent mutants be fully detected automatically?
    options:
      - "Because detecting them reduces to deciding program equivalence, which is undecidable in general"
      - "Because equivalent mutants compile far too slowly for PIT to finish analyzing them in time"
      - "Because coverage tools deliberately hide equivalent mutants from the final PIT report"
      - "Because equivalent mutants only ever arise inside multithreaded or concurrent code sections"
    answer: 0
    explanation: |
      Determining whether a mutant is behaviorally equivalent to the original is equivalent to the
      general program-equivalence problem, which is undecidable. Hence equivalent mutants can't be
      fully automated away, and a 100% mutation score is usually unattainable.
    ref: "concepts.md#equivalent-mutants-and-the-cost-of-mutation-testing"

  - id: code-coverage-and-mutation-testing-045
    difficulty: advanced
    tags: [equivalent-mutants, example, scenario]
    question: |
      In `for (int i = 0; i < list.size(); i++)`, PIT mutates `<` to `!=`, giving
      `i != list.size()`. No test kills it. Why is this expected?
    options:
      - "The test suite is simply missing a dedicated boundary test for the final loop iteration"
      - "The loop body was never covered by any test, so the mutated condition could not be reached"
      - "PIT has a bug in its CONDITIONALS_BOUNDARY mutator and reported this survivor wrongly"
      - "It is an equivalent mutant — since i only increases by 1, `!=` behaves identically to `<` here"
    answer: 3
    explanation: |
      Because i increments by 1 and starts below size, the loop exits at exactly the same point
      whether the condition is `<` or `!=`. The behavior is identical, so it's an equivalent mutant
      that no test can legitimately kill — not a test gap.
    ref: "concepts.md#equivalent-mutants-and-the-cost-of-mutation-testing"

  - id: code-coverage-and-mutation-testing-046
    difficulty: intermediate
    tags: [cost, performance, pit]
    question: |
      Why is mutation testing inherently more expensive than a normal test run, and how does PIT
      mitigate it?
    options:
      - "It recompiles the whole project once per mutant; PIT mitigates this by caching compiled bytecode between runs"
      - "It requires spawning a separate JVM for every test; PIT mitigates this by disabling runtime assertions"
      - "It runs (a subset of) the suite once per mutant; PIT mitigates via coverage-directed test selection, fail-fast, bytecode mutation, and incremental analysis"
      - "It can only run on a single CPU core; PIT mitigates this by offloading the mutation run to the cloud"
    answer: 2
    explanation: |
      Mutation testing runs tests once per mutant, and thousands of mutants can mean an N-fold slowdown.
      PIT reduces this with coverage-directed test selection, fail-fast on first kill, bytecode-level
      mutation (no recompilation), and incremental/history-based analysis.
    ref: "concepts.md#equivalent-mutants-and-the-cost-of-mutation-testing"

  - id: code-coverage-and-mutation-testing-047
    difficulty: advanced
    tags: [cost, ci, diff-scoped, scenario]
    question: |
      A large service can't afford full-repo mutation testing on every commit. What is a sound
      adoption strategy?
    options:
      - "Abandon mutation testing entirely and rely solely on the existing line-coverage gate"
      - "Run mutation testing diff-scoped (changed classes) in PRs with incremental analysis, and full runs nightly"
      - "Run it only on the auto-generated code, since that is where most latent faults hide"
      - "Replace all of the unit tests in the suite with equivalent mutation tests instead"
    answer: 1
    explanation: |
      Because of cost, teams commonly scope mutation testing to changed classes in PRs (using
      incremental/SCM analysis) and run full sweeps nightly. Scoping targetClasses to core logic and
      skipping DTOs/config keeps it affordable and high-signal.
    ref: "concepts.md#equivalent-mutants-and-the-cost-of-mutation-testing"

  - id: code-coverage-and-mutation-testing-048
    difficulty: intermediate
    tags: [exclusions, generated-code]
    question: |
      Which code is a reasonable candidate to *exclude* from coverage/mutation pressure?
    options:
      - "Generated code (e.g. Lombok, MapStruct) and trivial DTOs with only getters/setters"
      - "A branchy pricing service full of tiered discount and rounding rules"
      - "The core order-processing logic that fulfils and settles customer orders"
      - "The input-validation utilities that guard against malformed request payloads"
    answer: 0
    explanation: |
      Generated code and trivial value objects have no meaningful logic to test, so excluding them is
      reasonable (JaCoCo honors @Generated). Excluding branchy business logic just because it's hard
      would hide real risk.
    ref: "concepts.md#what-to-exclude-and-combining-coverage--mutation-for-real-signal"

  - id: code-coverage-and-mutation-testing-049
    difficulty: advanced
    tags: [exclusions, honesty, anti-pattern]
    question: |
      What is the main danger of using coverage exclusions liberally?
    options:
      - "Excluded code executes noticeably slower once it is dropped from the coverage report"
      - "JaCoCo has no mechanism to exclude any code from its coverage counters at all"
      - "Exclusions can be abused to game the number by hiding hard-to-test logic until the ratio looks good"
      - "Adding any coverage exclusion rule reliably breaks the build's compilation step"
    answer: 2
    explanation: |
      Exclusions are legitimate for code with no meaningful logic, but excluding branchy or risky
      code just to inflate the percentage hides real risk. Exclude honestly and document why.
    ref: "concepts.md#what-to-exclude-and-combining-coverage--mutation-for-real-signal"

  - id: code-coverage-and-mutation-testing-050
    difficulty: intermediate
    tags: [combining, coverage, mutation, signal]
    question: |
      Why do coverage and mutation testing give the best signal when used *together*?
    options:
      - "They both measure the exact same property, so running both adds redundancy that improves accuracy"
      - "Coverage is only useful as a way to measure how fast the overall test suite executes"
      - "Mutation testing fully replaces the need for any coverage measurement whatsoever"
      - "Coverage finds code that isn't reached; mutation finds reached code that isn't verified — each catches what the other misses"
    answer: 3
    explanation: |
      Coverage is a cheap, fast floor that finds unreached code; mutation testing is the expensive,
      high-signal strength check that finds reached-but-unverified code (weak assertions). Neither
      alone is sufficient; combined and diff-scoped they give real signal.
    ref: "concepts.md#what-to-exclude-and-combining-coverage--mutation-for-real-signal"

  - id: code-coverage-and-mutation-testing-051
    difficulty: advanced
    tags: [combining, ci, gate, scenario]
    question: |
      A PR meets the branch-coverage floor but PIT reports several survived mutants on the changed
      classes. What is the right action?
    options:
      - "Merge immediately — the branch-coverage floor passed, so the change's quality is fine"
      - "Strengthen the tests to kill the surviving mutants (or confirm they are equivalent) before merging"
      - "Lower the branch-coverage floor so the changed classes comfortably clear the gate"
      - "Delete the surviving mutants from the PIT report so the build reports a clean run"
    answer: 1
    explanation: |
      Passing coverage only means the code is reached. Surviving mutants show behaviors that aren't
      verified, so the tests' assertions should be strengthened to kill them — unless a mutant is
      genuinely equivalent, in which case it can be suppressed with justification.
    ref: "concepts.md#what-to-exclude-and-combining-coverage--mutation-for-real-signal"

  - id: code-coverage-and-mutation-testing-052
    difficulty: beginner
    tags: [coverage, floor, framing]
    question: |
      Which phrase best captures the recommended role of code coverage?
    options:
      - "A floor for finding untested code, not a proof of test quality"
      - "A single headline number to be maximized at all costs, ideally to a full 100%"
      - "A convenient substitute that removes the need to write explicit assertions"
      - "A direct measure of how many latent bugs still remain in the production code"
    answer: 0
    explanation: |
      The mature framing is 'coverage is a floor, not a goal': use it to locate untested code, then
      rely on assertion quality and mutation testing to judge whether covered code is actually
      verified.
    ref: "concepts.md#why-coverage-is-necessary-but-not-sufficient"
