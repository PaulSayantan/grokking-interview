topic: "Graphs: Representations, BFS, DFS & Topological Sort"
domain: dsa-coding
topic_slug: graphs-bfs-dfs-topological
version: 1

questions:
  - id: graphs-bfs-dfs-topological-001
    difficulty: beginner
    tags: [representation, adjacency-list, space-complexity]
    question: |
      What is the space complexity of storing a graph as an adjacency list?
    options:
      - "O(V + E)"
      - "O(V^2) regardless of edge count"
      - "O(E log V)"
      - "O(V * E)"
    answer: 0
    explanation: |
      An adjacency list stores V list headers plus one entry per directed edge
      (undirected edges appear twice), totaling O(V + E). This is proportional to
      the actual edges, which is why it is the default for sparse graphs. The
      O(V^2) figure describes an adjacency matrix.
    ref: "concepts.md#adjacency-list--the-default-representation"

  - id: graphs-bfs-dfs-topological-002
    difficulty: beginner
    tags: [representation, adjacency-matrix, edge-lookup]
    question: |
      What is the single biggest advantage of an adjacency matrix over an
      adjacency list?
    options:
      - "O(1) checking whether a specific edge u->v exists"
      - "It uses less memory for sparse graphs"
      - "Faster iteration over a vertex's neighbors"
      - "It automatically detects cycles while its cells are being filled in"
    answer: 0
    explanation: |
      An adjacency matrix answers "is there an edge u->v?" with a single index
      lookup, M[u][v], in O(1). Its cost is O(V^2) space and O(V) to iterate a
      vertex's neighbors (you scan a full row, including empty cells), so it loses
      to the list on sparse graphs.
    ref: "concepts.md#adjacency-matrix--dense-graphs-and-o1-edge-lookup"

  - id: graphs-bfs-dfs-topological-003
    difficulty: intermediate
    tags: [representation, dense-sparse, choice]
    question: |
      A social graph has 1 billion users, each with roughly 200 friends. Which
      representation should you choose and why?
    options:
      - "Adjacency matrix, because edge lookups are O(1)"
      - "Adjacency matrix, because it is simpler to index"
      - "Adjacency list, because the graph is sparse so O(V+E) beats O(V^2)"
      - "Edge list, because it is the smallest for any graph"
    answer: 2
    explanation: |
      With E ~ 200V, the graph is sparse: an adjacency list needs ~2x10^11
      entries, while a matrix needs V^2 ~ 10^18 cells - astronomically wasteful.
      Sparse graphs almost always use adjacency lists.
    ref: "concepts.md#adjacency-list-vs-matrix-vs-edge-list"

  - id: graphs-bfs-dfs-topological-004
    difficulty: intermediate
    tags: [bfs, complexity, traversal]
    question: |
      Using an adjacency list, what is the time complexity of BFS or DFS over a
      graph with V vertices and E edges?
    options:
      - "O(V^2)"
      - "O(V + E)"
      - "O(E log V)"
      - "O(V * E)"
    answer: 1
    explanation: |
      Each vertex is enqueued/visited exactly once (O(V)) and each edge is
      examined once while scanning neighbor lists (O(E)), giving O(V + E). On an
      adjacency matrix it degrades to O(V^2) because you scan a whole row per
      vertex.
    ref: "concepts.md#bfs--breadth-first-search-queue-shortest-path-in-unweighted-graphs"

  - id: graphs-bfs-dfs-topological-005
    difficulty: intermediate
    tags: [bfs, shortest-path, unweighted]
    question: |
      For which problem does plain BFS directly give a correct shortest path?
    options:
      - "Shortest path in a graph with arbitrary positive edge weights"
      - "Shortest path (fewest edges) in an unweighted graph"
      - "Shortest path in a graph with some negative edge weights"
      - "Minimum spanning tree of a weighted graph"
    answer: 1
    explanation: |
      BFS expands vertices in rings of increasing distance, so the first time it
      reaches a vertex it has used the fewest edges - a shortest path when all
      edges have equal (unit) weight. Weighted graphs need Dijkstra; negative
      edges need Bellman-Ford; MST needs Kruskal/Prim.
    ref: "concepts.md#bfs--breadth-first-search-queue-shortest-path-in-unweighted-graphs"

  - id: graphs-bfs-dfs-topological-006
    difficulty: advanced
    tags: [bfs, correctness, visited-set]
    question: |
      In BFS, why should you mark a vertex as visited when you ENQUEUE it rather
      than when you dequeue it?
    options:
      - "It makes no difference to correctness or complexity as long as every vertex is eventually marked"
      - "So the queue holds strictly less memory during the first level and stays bounded by O(sqrt V)"
      - "To prevent the same vertex being enqueued multiple times, preserving O(V+E) and correct distances"
      - "Because the dequeue operation runs before the visited set is allocated and cannot touch it"
    answer: 2
    explanation: |
      If you mark visited only at dequeue time, a vertex can be enqueued many
      times by different neighbors before it is processed. That blows past the
      O(V+E) bound and can corrupt level/distance bookkeeping. Marking on enqueue
      guarantees each vertex enters the queue exactly once.
    ref: "concepts.md#bfs--breadth-first-search-queue-shortest-path-in-unweighted-graphs"

  - id: graphs-bfs-dfs-topological-007
    difficulty: intermediate
    tags: [bfs, data-structure, queue]
    question: |
      Which data structure does standard BFS use to decide the next vertex to
      expand?
    options:
      - "A FIFO queue"
      - "A LIFO stack"
      - "A min-heap keyed by distance"
      - "A hash set only"
    answer: 0
    explanation: |
      BFS uses a FIFO queue so vertices are processed in the order discovered,
      producing level-by-level expansion. A LIFO stack yields DFS; a min-heap
      keyed by distance turns BFS into Dijkstra for weighted graphs.
    ref: "concepts.md#bfs--breadth-first-search-queue-shortest-path-in-unweighted-graphs"

  - id: graphs-bfs-dfs-topological-008
    difficulty: intermediate
    tags: [dfs, components, pattern]
    question: |
      You need to count the number of connected components in an undirected
      graph. Which approach fits best?
    options:
      - "Loop over all vertices; each time you find an unvisited one, flood it with DFS/BFS and increment a counter"
      - "Run a single BFS from vertex 0 and count the distinct levels it produces"
      - "Sort all the edges by weight and count how many distinct weight values appear"
      - "Build an adjacency matrix and count the number of non-zero cells above the diagonal"
    answer: 0
    explanation: |
      Each launch of a DFS/BFS from an unvisited vertex floods exactly one whole
      component. Counting the number of launches counts the components. A single
      BFS from one vertex only reaches its own component.
    ref: "concepts.md#dfs--depth-first-search-recursionstack-components-cycles-paths"

  - id: graphs-bfs-dfs-topological-009
    difficulty: advanced
    tags: [dfs, cycle-detection, directed]
    question: |
      In a DIRECTED graph, how does the 3-color DFS detect a cycle?
    options:
      - "An edge leads to a black (fully finished) node"
      - "Any edge to an already-visited node, regardless of its current color"
      - "The visited set grows to exceed V entries during a single traversal run"
      - "An edge leads to a gray (currently on the recursion stack) node"
    answer: 3
    explanation: |
      Gray means the node is on the current recursion stack. An edge to a gray
      node is a back edge, closing a cycle. An edge to a black node is fine (a
      cross/forward edge to a finished subtree). Treating ANY visited node as a
      cycle would wrongly flag DAGs with shared descendants.
    ref: "concepts.md#dfs--depth-first-search-recursionstack-components-cycles-paths"

  - id: graphs-bfs-dfs-topological-010
    difficulty: advanced
    tags: [dfs, cycle-detection, undirected]
    question: |
      In an UNDIRECTED graph traversed by DFS, what indicates a cycle?
    options:
      - "Reaching a visited neighbor that is NOT the immediate parent"
      - "Reaching any visited neighbor, including the parent you came from"
      - "The recursion depth exceeding log V during the traversal"
      - "Finding a vertex whose in-degree drops to exactly 0"
    answer: 0
    explanation: |
      In an undirected graph every edge can be traversed back to the parent, so
      seeing the parent again is not a cycle. A visited neighbor that is NOT the
      parent means there is another path to it - a cycle. (Union-find is the
      alternative detector.)
    ref: "concepts.md#dfs--depth-first-search-recursionstack-components-cycles-paths"

  - id: graphs-bfs-dfs-topological-011
    difficulty: intermediate
    tags: [dfs, space-complexity, recursion]
    question: |
      What is the worst-case extra space of recursive DFS on a graph with V
      vertices, and why?
    options:
      - "O(1), since DFS uses no auxiliary storage"
      - "O(log V), the height of a balanced structure"
      - "O(V), because the recursion stack can reach depth V on a path-shaped graph"
      - "O(E), one frame per edge"
    answer: 2
    explanation: |
      In the worst case (a long path), DFS recurses one level per vertex, so the
      call stack reaches depth V - hence O(V) space, plus the O(V) visited set.
      This is why very deep graphs can overflow the stack, favoring an explicit
      iterative stack.
    ref: "concepts.md#dfs--depth-first-search-recursionstack-components-cycles-paths"

  - id: graphs-bfs-dfs-topological-012
    difficulty: intermediate
    tags: [bfs, dfs, choice]
    question: |
      You must find the minimum number of moves to reach a target state in an
      unweighted state graph. BFS or DFS?
    options:
      - "DFS, because exploring deeper first reaches the target in fewer total moves"
      - "BFS, because level-order expansion reaches the target in the fewest edges first"
      - "Either works and both are guaranteed to return the same shortest result"
      - "DFS with backtracking that tries every path and keeps the shortest one found"
    answer: 1
    explanation: |
      "Minimum number of moves" in an unweighted graph is a shortest-path-in-edges
      question - BFS's signature. BFS reaches the target at its true minimum depth.
      DFS may find the target via a long, non-minimal path.
    ref: "concepts.md#bfs--breadth-first-search-queue-shortest-path-in-unweighted-graphs"

  - id: graphs-bfs-dfs-topological-013
    difficulty: intermediate
    tags: [grid, multi-source-bfs, rotting-oranges]
    question: |
      In "Rotting Oranges" you want the minimum minutes for rot to spread from all
      initially rotten oranges. What is the cleanest technique?
    options:
      - "Run a separate BFS from each rotten orange and take the max over all runs"
      - "DFS from the top-left cell, spreading rot along each recursive branch"
      - "Dijkstra with each orange's remaining freshness used as the edge weight"
      - "Multi-source BFS: seed the queue with ALL rotten oranges at time 0 and expand together"
    answer: 3
    explanation: |
      Multi-source BFS seeds the queue with every source at distance 0 and expands
      them simultaneously, computing the min time from the nearest source to every
      cell in one pass - far cheaper than one BFS per source.
    ref: "concepts.md#grid-as-a-graph-islands-flood-fill"

  - id: graphs-bfs-dfs-topological-014
    difficulty: beginner
    tags: [grid, complexity, islands]
    question: |
      For an R x C grid treated as a graph (4-directional), what is the time
      complexity of a full BFS/DFS traversal such as counting islands?
    options:
      - "O((R*C)^2)"
      - "O(R + C)"
      - "O(R * C * log(R*C))"
      - "O(R * C)"
    answer: 3
    explanation: |
      A grid has V = R*C cells and E ~ 2*R*C edges, so traversal is O(V + E) =
      O(R*C). Each cell and each edge is visited a constant number of times.
    ref: "concepts.md#grid-as-a-graph-islands-flood-fill"

  - id: graphs-bfs-dfs-topological-015
    difficulty: intermediate
    tags: [topological-sort, dag, recognition]
    question: |
      A problem gives you course prerequisites and asks for a valid order to take
      all courses. Which algorithm family does this signal?
    options:
      - "Dijkstra's shortest path over the prerequisite graph"
      - "Topological sort of a DAG (Kahn's or DFS post-order)"
      - "Binary search on the number of courses in the answer"
      - "Union-find to group courses into connected components only"
    answer: 1
    explanation: |
      Prerequisites/dependencies/ordering on a directed graph is the textbook
      signal for topological sort. It produces a linear order respecting all edges
      and detects cycles (impossible schedules) as a by-product.
    ref: "concepts.md#topological-sort--ordering-a-dag-kahns-bfs--dfs-post-order"

  - id: graphs-bfs-dfs-topological-016
    difficulty: advanced
    tags: [topological-sort, kahn, cycle-detection]
    question: |
      In Kahn's algorithm, how do you know the directed graph contains a cycle?
    options:
      - "Some vertex has an in-degree strictly greater than 1"
      - "Kahn's algorithm throws an explicit error the moment it cannot find any in-degree-zero vertex to dequeue"
      - "The produced order contains fewer than V vertices"
      - "Two different vertices end up with the same in-degree value"
    answer: 2
    explanation: |
      Kahn's repeatedly removes in-degree-0 vertices. Vertices trapped in a cycle
      never reach in-degree 0, so they never enter the order. If fewer than V
      vertices are emitted, a cycle exists (Course Schedule returns false).
    ref: "concepts.md#topological-sort--ordering-a-dag-kahns-bfs--dfs-post-order"

  - id: graphs-bfs-dfs-topological-017
    difficulty: advanced
    tags: [topological-sort, dfs, post-order]
    question: |
      In the DFS-based topological sort, how do you obtain the final ordering?
    options:
      - "Output vertices in the order they are first discovered (pre-order)"
      - "Sort all vertices by their in-degree in ascending order and output that"
      - "Output the vertices in BFS level order starting from any in-degree-0 root"
      - "Push each vertex when it FINISHES and reverse the resulting list"
    answer: 3
    explanation: |
      DFS pushes a vertex onto a stack when it finishes (all descendants done).
      The reverse of the finishing order is a valid topological order, because a
      vertex finishes only after everything it points to has finished.
    ref: "concepts.md#topological-sort--ordering-a-dag-kahns-bfs--dfs-post-order"

  - id: graphs-bfs-dfs-topological-018
    difficulty: intermediate
    tags: [topological-sort, dag, ordering]
    question: |
      How many valid topological orderings can a DAG have?
    options:
      - "Exactly one, always, since every DAG has a unique ordering"
      - "At most two, one forward and one reversed variant"
      - "Potentially many - any linear extension of the partial order"
      - "Exactly V of them, one ordering starting at each vertex"
    answer: 2
    explanation: |
      Any linearization that respects every edge is valid, and DAGs typically
      admit many. If you need a specific one (e.g. lexicographically smallest),
      use a min-heap in place of the plain queue in Kahn's algorithm.
    ref: "concepts.md#topological-sort--ordering-a-dag-kahns-bfs--dfs-post-order"

  - id: graphs-bfs-dfs-topological-019
    difficulty: advanced
    tags: [shortest-path, dijkstra, weighted]
    question: |
      You need single-source shortest paths in a graph with non-negative but
      VARYING edge weights. Which algorithm and core data structure?
    options:
      - "Plain BFS with a FIFO queue over the raw edge weights"
      - "Dijkstra using a min-heap (priority queue)"
      - "DFS with backtracking to total each path's weight"
      - "Topological sort first, then a linear-scan BFS pass"
    answer: 1
    explanation: |
      Dijkstra is BFS where the queue is a min-heap keyed by tentative distance,
      so you always expand the closest unfinished vertex. With a binary heap it is
      O((V+E) log V). Plain BFS is only correct for unit weights.
    ref: "concepts.md#shortest-path-preview-weighted-graphs"

  - id: graphs-bfs-dfs-topological-020
    difficulty: intermediate
    tags: [representation, edge-list, kruskal]
    question: |
      Which representation is the natural input format and is consumed directly
      (after sorting by weight) by Kruskal's MST / union-find problems?
    options:
      - "Adjacency matrix indexed by vertex pairs"
      - "Adjacency list keyed by each source vertex"
      - "Edge list of (u, v, weight) tuples"
      - "In-degree array counting incoming edges"
    answer: 2
    explanation: |
      An edge list is a plain list of (u, v, weight) tuples - the format most
      LeetCode inputs use and exactly what Kruskal's algorithm sorts by weight and
      feeds into union-find. You typically convert it to an adjacency list before
      traversal.
    ref: "concepts.md#adjacency-list-vs-matrix-vs-edge-list"

  - id: graphs-bfs-dfs-topological-021
    difficulty: advanced
    tags: [graph-valid-tree, properties, edges]
    question: |
      An undirected graph with V vertices is a valid tree if and only if it is
      connected and has exactly how many edges (with no cycle)?
    options:
      - "V edges"
      - "V + 1 edges"
      - "2V edges"
      - "V - 1 edges"
    answer: 3
    explanation: |
      A tree on V vertices is connected, acyclic, and has exactly V-1 edges. Given
      connectivity, "exactly V-1 edges" is equivalent to "no cycle." Fewer than
      V-1 means disconnected; more than V-1 forces a cycle. This is the "Graph
      Valid Tree" check.
    ref: "concepts.md#graph-vocabulary-and-classification"

  - id: graphs-bfs-dfs-topological-022
    difficulty: intermediate
    tags: [representation, adjacency-matrix, neighbors]
    question: |
      Using an adjacency matrix, what is the cost of iterating over all neighbors
      of a single vertex u?
    options:
      - "O(V) - you must scan the entire row including empty cells"
      - "O(deg(u)) - the row stores only u's actual neighbors"
      - "O(1) - one direct index into u's neighbor bucket"
      - "O(E) - you sweep across every edge in the whole graph"
    answer: 0
    explanation: |
      A matrix row has V cells, and you must inspect every one to find which are
      nonzero, so neighbor iteration is O(V) even if u has few neighbors. An
      adjacency list does this in O(deg(u)), which is why traversal on a list is
      O(V+E) but on a matrix is O(V^2).
    ref: "concepts.md#adjacency-matrix--dense-graphs-and-o1-edge-lookup"

  - id: graphs-bfs-dfs-topological-023
    difficulty: advanced
    tags: [shortest-path, 0-1-bfs, deque]
    question: |
      Every edge weight is either 0 or 1. What is the most efficient shortest-path
      technique, and why beat Dijkstra here?
    options:
      - "Plain BFS with a FIFO queue, ignoring the 0-weight edges"
      - "0-1 BFS with a deque: push-front for weight-0 edges, push-back for weight-1"
      - "Bellman-Ford, relaxing every edge V-1 times for the small weights"
      - "Floyd-Warshall over the full matrix since weights are only 0 or 1"
    answer: 1
    explanation: |
      0-1 BFS uses a double-ended queue: relax a 0-weight edge by pushing to the
      front (same distance) and a 1-weight edge to the back (distance+1). This runs
      in O(V+E), beating Dijkstra's O((V+E) log V) by dropping the heap.
    ref: "concepts.md#shortest-path-preview-weighted-graphs"

  - id: graphs-bfs-dfs-topological-024
    difficulty: beginner
    tags: [representation, undirected, storage]
    question: |
      When storing an UNDIRECTED edge {u, v} in an adjacency list, what must you
      do?
    options:
      - "Store it once, appended only to u's list"
      - "Store it in an adjacency matrix instead"
      - "Store only the smaller of u and v"
      - "Store v in u's list AND u in v's list"
    answer: 3
    explanation: |
      An undirected edge is traversable both ways, so it is recorded twice - v
      appended to u's neighbor list and u appended to v's. This is why undirected
      edges contribute 2 entries and total list storage is O(V + 2E) = O(V + E).
    ref: "concepts.md#adjacency-list--the-default-representation"
