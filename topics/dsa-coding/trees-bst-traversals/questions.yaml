topic: "Trees, BST & Traversals"
domain: dsa-coding
topic_slug: trees-bst-traversals
version: 1
questions:
  - id: trees-bst-traversals-001
    difficulty: beginner
    tags: [structure, node, pointers]
    question: |
      At its core, what does a single node of a binary tree hold?
    options:
      - "A value plus up to two child pointers (left and right)"
      - "A value plus an array of all its ancestors"
      - "A value plus a pointer to the next node in sorted order"
      - "A value plus a parent pointer and a sibling pointer only"
    answer: 0
    explanation: |
      A binary tree node is `{ val, left, right }` — a value and up to two child
      references, either of which may be null. There is no required parent or sibling
      pointer, and no ordering rule (that extra rule is what defines a BST).
    ref: "concepts.md#binary-tree-structure-and-terminology"

  - id: trees-bst-traversals-002
    difficulty: beginner
    tags: [terminology, height, depth]
    question: |
      How do the depth and height of a node differ?
    options:
      - "They are always equal for every node since both count nodes on the path to root"
      - "Depth is measured in whole nodes, but height is measured in bytes of stored memory"
      - "Depth counts edges up to the root, height counts edges down to the deepest leaf"
      - "Height counts edges up to the root, while depth just counts a node's direct children"
    answer: 2
    explanation: |
      Depth is measured downward from the root (root has depth 0); height is measured
      upward from leaves (a leaf has height 0). They point in opposite directions and
      are only equal in trivial cases. Stating your node-vs-edge convention avoids
      off-by-one confusion.
    ref: "concepts.md#binary-tree-structure-and-terminology"

  - id: trees-bst-traversals-003
    difficulty: intermediate
    tags: [complete, full, terminology]
    question: |
      A "complete" binary tree is defined as one where:
    options:
      - "Every node without exception has exactly two children, all the way down to the leaves"
      - "All leaves are at the same depth and every internal node has two children"
      - "The left and right subtrees of the root have equal node counts"
      - "All levels are full except possibly the last, which is filled left to right"
    answer: 3
    explanation: |
      A complete tree fills every level except possibly the last, and that last level
      fills left to right — the shape a binary heap uses so it can live in an array.
      "Every node has 0 or 2 children" is a full tree; "all leaves same level + all
      internal nodes have 2 children" is a perfect tree.
    ref: "concepts.md#binary-tree-structure-and-terminology"

  - id: trees-bst-traversals-004
    difficulty: intermediate
    tags: [complexity, height, skewed]
    question: |
      For a binary search tree with n nodes, most operations cost O(h) where h is the
      height. What is the worst-case value of h, and when does it occur?
    options:
      - "O(log n), always, regardless of insertion order, since a BST rebalances on each insert"
      - "O(sqrt n), when the tree is complete and every level except the last is fully filled"
      - "O(1), because the root is always reachable directly through a cached top-level pointer"
      - "O(n), when the tree is skewed into a chain (e.g. sorted insertions)"
    answer: 3
    explanation: |
      Inserting sorted or nearly-sorted data into a plain BST builds a right- (or left-)
      leaning chain of height n−1, degrading every operation to O(n). A balanced tree
      keeps h at ⌊log₂ n⌋. This O(log n)-vs-O(n) gap is the entire reason self-balancing
      trees exist.
    ref: "concepts.md#binary-search-tree-the-ordering-invariant"

  - id: trees-bst-traversals-005
    difficulty: beginner
    tags: [traversal, inorder, bst]
    question: |
      Which DFS traversal visits the nodes of a BST in sorted (ascending) order?
    options:
      - "Inorder (left, node, right)"
      - "Preorder (node, left, right)"
      - "Postorder (left, right, node)"
      - "Level-order (BFS)"
    answer: 0
    explanation: |
      Inorder visits left subtree, then the node, then the right subtree. Because a BST
      keeps smaller values left and larger values right, this produces a strictly
      increasing sequence. This one fact solves Kth Smallest, Validate BST, and Two Sum
      in a BST.
    ref: "concepts.md#dfs-traversals-preorder-inorder-postorder"

  - id: trees-bst-traversals-006
    difficulty: intermediate
    tags: [traversal, order, postorder]
    question: |
      You need to compute a value at each node from the values of its children (e.g.
      subtree height or size). Which traversal order naturally supports this?
    options:
      - "Postorder — children are fully processed before the node"
      - "Preorder — the node is processed before its children"
      - "Level-order — nodes are processed strictly top down, level by level"
      - "Any order works identically for bottom-up computation"
    answer: 0
    explanation: |
      Postorder (left, right, node) guarantees both subtrees are done before the node is
      processed, which is exactly what a bottom-up computation needs. Preorder processes
      the node first (good for top-down copy/serialize), and level-order goes top down.
    ref: "concepts.md#dfs-traversals-preorder-inorder-postorder"

  - id: trees-bst-traversals-007
    difficulty: intermediate
    tags: [complexity, traversal, space]
    question: |
      What is the space complexity of a recursive DFS traversal of a binary tree, and
      why?
    options:
      - "O(1), because recursion reuses a single stack frame and allocates no extra memory"
      - "O(h), the recursion call-stack depth — O(log n) if balanced, O(n) if skewed"
      - "O(n) always, because the traversal must store every visited node in a result list"
      - "O(w), the maximum width of the tree, since one frame is kept per node on a level"
    answer: 1
    explanation: |
      Recursion consumes stack frames proportional to the current path length, i.e. the
      tree height h. That is O(log n) for a balanced tree but O(n) for a skewed one.
      Candidates often incorrectly answer O(1), forgetting the implicit call stack.
    ref: "concepts.md#dfs-traversals-preorder-inorder-postorder"

  - id: trees-bst-traversals-008
    difficulty: intermediate
    tags: [iterative, stack, traversal]
    question: |
      When converting a recursive tree traversal to an iterative one, which auxiliary
      data structure replaces the implicit recursion stack for DFS?
    options:
      - "A min-heap"
      - "A FIFO queue"
      - "An explicit LIFO stack"
      - "A hash set of visited nodes"
    answer: 2
    explanation: |
      DFS is inherently LIFO — recursion IS a stack — so an iterative DFS uses an
      explicit stack. A FIFO queue would give you BFS/level-order instead. The main
      reasons to iterate are avoiding stack overflow on deep trees and showing you grasp
      the underlying mechanism.
    ref: "concepts.md#dfs-traversals-preorder-inorder-postorder"

  - id: trees-bst-traversals-009
    difficulty: beginner
    tags: [bfs, level-order, queue]
    question: |
      Which data structure drives a level-order (BFS) traversal of a binary tree?
    options:
      - "A stack (LIFO)"
      - "A priority queue ordered by node value"
      - "A doubly linked list of leaves"
      - "A queue (FIFO)"
    answer: 3
    explanation: |
      BFS visits nodes level by level using a FIFO queue: dequeue a node, enqueue its
      children at the back. A LIFO stack would produce depth-first behaviour instead.
      BFS is the go-to for "levels," "minimum depth," or "right side view" problems.
    ref: "concepts.md#bfs-level-order-traversal"

  - id: trees-bst-traversals-010
    difficulty: advanced
    tags: [bfs, dfs, space, complexity]
    question: |
      On a large, balanced binary tree, how does BFS memory usage compare to DFS, and
      why?
    options:
      - "BFS uses less — it processes one node at a time and never holds more than a single node in memory"
      - "BFS can use more — its queue holds the widest level (~n/2 nodes), while DFS holds only the current path (~height)"
      - "They are identical — both are always O(log n) regardless of the tree's shape or balance"
      - "DFS uses more — it must permanently store every visited node in a set to avoid revisiting"
    answer: 1
    explanation: |
      In a balanced tree the bottom level holds about n/2 nodes, so the BFS queue peaks
      at O(n), whereas recursive DFS only keeps the current root-to-node path, O(h) =
      O(log n). When memory is tight and you do not need level grouping, prefer DFS.
    ref: "concepts.md#bfs-level-order-traversal"

  - id: trees-bst-traversals-011
    difficulty: intermediate
    tags: [bfs, level-order, technique]
    question: |
      In an iterative level-order traversal, why do you record `len(queue)` into a
      variable before the inner loop that pops nodes?
    options:
      - "To detect cycles in the tree by comparing the length against a set of seen nodes"
      - "Because the queue length never changes during traversal, so caching it saves repeated calls"
      - "To capture exactly the count of nodes on the current level, so children enqueued during the loop are not mixed in"
      - "To convert the FIFO queue into a LIFO stack and thereby switch the traversal to DFS"
    answer: 2
    explanation: |
      Snapshotting the queue size fixes how many nodes belong to the current level.
      Inside the loop you enqueue the next level's children, but they are excluded from
      this level's count. This "process one level at a time" trick powers Level Order,
      Right Side View, and zigzag traversals.
    ref: "concepts.md#bfs-level-order-traversal"

  - id: trees-bst-traversals-012
    difficulty: beginner
    tags: [bst, invariant, ordering]
    question: |
      What is the defining invariant of a Binary Search Tree?
    options:
      - "Every level is completely filled, so the tree always keeps a perfectly balanced shape"
      - "Each node has at most two children, with no ordering constraint imposed on their values"
      - "For every node, all left-subtree values are less than it and all right-subtree values are greater"
      - "The tree height is always exactly log n, since insertions self-balance on every step"
    answer: 2
    explanation: |
      A BST requires that for every node, its entire left subtree holds smaller values
      and its entire right subtree holds larger values. "At most two children" is just
      the binary-tree property; being completely filled or log-n tall are not required
      (an unbalanced BST can be a chain).
    ref: "concepts.md#binary-search-tree-the-ordering-invariant"

  - id: trees-bst-traversals-013
    difficulty: advanced
    tags: [bst, validate, gotcha]
    question: |
      Why is checking only `node.left.val < node.val < node.right.val` at each node
      insufficient to validate a BST?
    options:
      - "A node deep in a subtree can violate an ancestor's bound even though it satisfies its immediate parent"
      - "It is actually sufficient and always correct as long as every node stores non-duplicate integer keys"
      - "It fails only on empty trees, where the missing child comparison raises a null-pointer error"
      - "It only works when the tree is perfectly balanced with every level completely full"
    answer: 0
    explanation: |
      The BST property is global, not just parent-to-child. A value in the left subtree
      must be less than ALL ancestors on the path, not merely its parent. The correct
      approaches pass down a tightening (low, high) range, or verify a full inorder
      traversal is strictly increasing.
    ref: "concepts.md#binary-search-tree-the-ordering-invariant"

  - id: trees-bst-traversals-014
    difficulty: advanced
    tags: [bst, delete, successor]
    question: |
      When deleting a BST node that has two children, the standard technique is to:
    options:
      - "Delete both subtrees entirely and rebuild the whole structure from the remaining values"
      - "Replace its value with its inorder successor (or predecessor), then delete that successor node"
      - "Rotate the node down until it becomes a leaf, ignoring the ordering invariant along the way"
      - "Simply set the node's value to null and leave the empty placeholder in place within the tree"
    answer: 1
    explanation: |
      With two children you cannot just splice. You copy the inorder successor (smallest
      value in the right subtree) or predecessor into the node, then delete that helper
      node — which has at most one child, reducing to an easy case. This preserves the
      ordering invariant.
    ref: "concepts.md#binary-search-tree-the-ordering-invariant"

  - id: trees-bst-traversals-015
    difficulty: advanced
    tags: [balancing, rotation, avl, red-black]
    question: |
      A tree rotation in a self-balancing BST (AVL / red-black) is best described as:
    options:
      - "A full re-sort of all node values into a new balanced layout, costing O(n log n) per rotation"
      - "A traversal that visits every node in reverse-inorder to recompute each subtree's stored height"
      - "A rehash of every key into new buckets so lookups stay evenly distributed after each insert"
      - "A local O(1) pointer rearrangement that changes height while preserving inorder order"
    answer: 3
    explanation: |
      A rotation reshuffles a few parent/child pointers in O(1), reducing height while
      keeping the inorder (sorted) sequence unchanged. Repeated rotations during
      insert/delete keep the height O(log n), which is why AVL and red-black trees
      guarantee O(log n) operations.
    ref: "concepts.md#why-balance-matters-avl--red-black-rotations"

  - id: trees-bst-traversals-016
    difficulty: intermediate
    tags: [balancing, red-black, built-ins]
    question: |
      Java's TreeMap and TreeSet (and C++ std::map/std::set) are backed by which
      structure to guarantee O(log n) ordered operations?
    options:
      - "A hash table with separate chaining and periodic resizing of the bucket array"
      - "A probabilistic skip list layering multiple express lanes over a sorted linked list"
      - "A plain unbalanced binary search tree that relies on random insertion order"
      - "A red-black (self-balancing) binary search tree"
    answer: 3
    explanation: |
      These ordered maps/sets use a red-black tree, a self-balancing BST that keeps
      height O(log n) via rotations and recoloring. That yields guaranteed O(log n)
      search/insert/delete plus ordered navigation (floor, ceiling, range). A plain
      unbalanced BST would risk O(n).
    ref: "concepts.md#why-balance-matters-avl--red-black-rotations"

  - id: trees-bst-traversals-017
    difficulty: advanced
    tags: [tree-dp, diameter, pattern]
    question: |
      In the bottom-up tree-DP pattern used for Diameter of Binary Tree, why does the
      recursive helper return the node's height but separately update a global "best"
      variable?
    options:
      - "Because height and diameter are always equal, so returning one value conveniently supplies both"
      - "The parent needs the height to continue upward, but the longest path THROUGH a node may not extend to the parent, so it is recorded globally"
      - "Global variables are inherently faster than return values, so the height is passed back on the stack"
      - "To avoid recursion entirely by letting the shared global replace the call stack during traversal"
    answer: 1
    explanation: |
      The value the parent can use is the downward height. But the diameter candidate at
      a node — left_height + right_height — is a path that bends through the node and
      cannot be extended upward, so it is captured in a global best rather than returned.
      Recognising this return-vs-record split is the crux of Diameter and Max Path Sum.
    ref: "concepts.md#tree-dp-the-bottom-up-return-pattern"

  - id: trees-bst-traversals-018
    difficulty: intermediate
    tags: [lca, bst, pattern]
    question: |
      What is the O(h) approach to finding the Lowest Common Ancestor of two nodes in a
      BST?
    options:
      - "Do a full inorder traversal into an array and pick the element at its middle index"
      - "BFS the whole tree level by level and return the deepest node found on the last level"
      - "Walk from the root: go left if both targets are smaller, right if both larger, and stop where they split"
      - "Rotate the tree repeatedly until both target nodes become direct siblings under one parent"
    answer: 2
    explanation: |
      Exploit the BST ordering: while both target values lie on the same side, descend
      that way; the first node where one target is ≤ node ≤ the other (they split, or one
      equals the node) is the LCA. This is O(h) with no extra space, unlike the recursive
      general-tree approach.
    ref: "concepts.md#lowest-common-ancestor-lca"

  - id: trees-bst-traversals-019
    difficulty: advanced
    tags: [lca, binary-tree, recursion]
    question: |
      In the general (non-BST) binary-tree LCA recursion, a node is identified as the
      LCA when:
    options:
      - "Its value falls numerically between the two target values on the path"
      - "It is the first leaf node reached along the deepest recursive branch"
      - "It is the node that appears first when the tree is listed in preorder"
      - "The recursive calls on BOTH its left and right subtrees return non-null"
    answer: 3
    explanation: |
      Without ordering you recurse both ways, returning a node if it equals p or q. If a
      node's left recursion and right recursion both find a target, the two targets sit on
      opposite sides, so that node is their lowest common ancestor. Otherwise you bubble up
      whichever side found something.
    ref: "concepts.md#lowest-common-ancestor-lca"

  - id: trees-bst-traversals-020
    difficulty: advanced
    tags: [construct, serialize, traversals]
    question: |
      Which pair of traversals is sufficient to uniquely reconstruct an arbitrary binary
      tree?
    options:
      - "Preorder + Postorder"
      - "Preorder + Inorder"
      - "Two independent Inorder traversals"
      - "Level-order alone (without null markers)"
    answer: 1
    explanation: |
      Preorder + Inorder works: preorder gives the root, and inorder tells you which
      elements fall into the left vs right subtree, letting you recurse. Preorder +
      postorder is ambiguous for general trees, and level-order without null markers loses
      structure. (A single traversal WITH null sentinels — as in serialize — is the other
      way to make it unique.)
    ref: "concepts.md#serialize-and-deserialize"

  - id: trees-bst-traversals-021
    difficulty: intermediate
    tags: [serialize, null-markers, encoding]
    question: |
      Why can a single preorder traversal that includes explicit null markers (e.g.
      `1,2,#,#,3`) fully serialize and later reconstruct a binary tree, when preorder
      alone cannot?
    options:
      - "Because the null markers sort every stored node value into ascending sorted order"
      - "Because a plain preorder sequence alone already uniquely fixes any binary tree's shape"
      - "The null sentinels encode the missing children, so the traversal captures the exact structure"
      - "Because inserting the markers converts the structure into a balanced BST first"
    answer: 2
    explanation: |
      Plain preorder loses the shape (where children are absent). Adding a sentinel for
      every null child records exactly where subtrees end, so a single recursive pass can
      rebuild the identical tree. This is the standard Serialize/Deserialize approach,
      O(n) time and space.
    ref: "concepts.md#serialize-and-deserialize"

  - id: trees-bst-traversals-022
    difficulty: intermediate
    tags: [kth-smallest, bst, inorder]
    question: |
      What is the most efficient standard technique to find the kth smallest element in
      a BST?
    options:
      - "Copy all values to an array, sort it, and index k−1 — O(n log n)"
      - "BFS level by level, counting visited nodes until the running total reaches k"
      - "Repeatedly delete the minimum node k separate times and return the last one"
      - "Do an inorder traversal and stop after visiting k nodes — O(h + k)"
    answer: 3
    explanation: |
      Since inorder of a BST is ascending, you can stop as soon as you have visited k
      nodes, costing O(h + k) rather than materializing and sorting everything. This is a
      direct application of the "inorder of a BST is sorted" property.
    ref: "concepts.md#dfs-traversals-preorder-inorder-postorder"
