topic: "Recursion & Backtracking"
domain: dsa-coding
topic_slug: recursion-backtracking
version: 1
questions:
  - id: recursion-backtracking-001
    difficulty: beginner
    tags: [base-case, correctness]
    question: |
      What is the primary role of the base case in a recursive function?
    options:
      - "It makes the function run faster by caching results"
      - "It provides a directly-answerable smallest input that stops the recursion"
      - "It converts the recursion into a loop automatically"
      - "It allocates the stack frames in advance"
    answer: 1
    explanation: |
      The base case is the smallest input the function can answer without recursing. It is what
      terminates the chain of calls. A missing or incorrect base case (or a recursive case that
      never reaches it) causes infinite recursion and a stack overflow.
    ref: "concepts.md#recursion-base-case-recursive-case-and-the-call-stack"

  - id: recursion-backtracking-002
    difficulty: beginner
    tags: [call-stack, memory]
    question: |
      When a recursive function calls itself, what happens on the call stack?
    options:
      - "The existing frame is overwritten with the new call's data"
      - "Nothing — recursion reuses a single frame"
      - "A new stack frame is pushed holding the new call's parameters, locals, and return address"
      - "A frame is allocated on the heap and garbage-collected later"
    answer: 2
    explanation: |
      Each call pushes a fresh stack frame containing its own parameters, local variables, and
      the return address. The frame is popped when the call returns. The maximum number of frames
      alive at once is the recursion depth, which determines the stack-space usage.
    ref: "concepts.md#recursion-base-case-recursive-case-and-the-call-stack"

  - id: recursion-backtracking-003
    difficulty: intermediate
    tags: [space-complexity, depth]
    question: |
      A recursive DFS on a completely skewed (linked-list-shaped) tree of n nodes uses how much
      space purely due to the call stack?
    options:
      - "O(1)"
      - "O(log n)"
      - "O(n log n)"
      - "O(n)"
    answer: 3
    explanation: |
      A skewed tree forces the recursion to go n levels deep before any call returns, so up to n
      frames are live simultaneously — O(n) stack space. On a balanced tree the depth is O(log n).
      This is a classic case where time can be O(n) but space is also O(n) solely from depth.
    ref: "concepts.md#recursion-depth-stack-space-and-stackoverflowerror"

  - id: recursion-backtracking-004
    difficulty: intermediate
    tags: [stack-overflow, limits]
    question: |
      Your recursive graph DFS works on small inputs but throws a RecursionError / StackOverflowError
      on a graph with 200,000 nodes in a long chain. What is the root cause and best fix?
    options:
      - "The base case is wrong; add a second base case"
      - "The algorithm is O(n^2); memoize the results"
      - "The graph has cycles; add a visited set"
      - "Recursion depth exceeds the stack limit; convert to iteration with an explicit stack"
    answer: 3
    explanation: |
      A 200k-deep chain means ~200k nested frames, which exceeds Python's default recursion limit
      (1000) and can blow Java's stack. The scalable fix is an iterative DFS using an explicit
      heap-allocated stack, which is bounded by heap memory rather than the small stack region.
    ref: "concepts.md#recursion-depth-stack-space-and-stackoverflowerror"

  - id: recursion-backtracking-005
    difficulty: intermediate
    tags: [tail-recursion, tco]
    question: |
      Which statement about tail-call optimization (TCO) is correct for standard Java and CPython?
    options:
      - "Both automatically optimize tail-recursive calls into loops"
      - "Neither performs TCO, so tail-form recursion still risks stack overflow"
      - "Java does TCO but Python does not"
      - "TCO is applied only when recursion depth exceeds 1000"
    answer: 1
    explanation: |
      Standard Java (HotSpot) and CPython do NOT perform tail-call optimization. Rewriting a
      function into tail-recursive form does not save you from deep-recursion stack overflow in
      these languages — you must convert to an actual loop. (Scala, many functional languages, and
      C/C++ compilers under optimization do eliminate tail calls.)
    ref: "concepts.md#tail-recursion-and-recursion-to-iteration"

  - id: recursion-backtracking-006
    difficulty: beginner
    tags: [tail-recursion, definition]
    question: |
      What makes a recursive call a "tail call"?
    options:
      - "It is the first statement inside the function"
      - "It calls a different function, not itself"
      - "Its result is returned directly with no pending computation after the call"
      - "It has more than one recursive branch"
    answer: 2
    explanation: |
      A tail call is one where the recursive call is the last action and its return value is passed
      straight back, with no work left to do afterward (e.g. an accumulator form like f(n-1, acc*n)
      rather than n * f(n-1)). This is what allows a TCO-capable compiler to reuse the current frame.
    ref: "concepts.md#tail-recursion-and-recursion-to-iteration"

  - id: recursion-backtracking-007
    difficulty: intermediate
    tags: [iterative-dfs, explicit-stack]
    question: |
      In an iterative pre-order DFS using an explicit stack, why do you push the right child before
      the left child?
    options:
      - "So the left child is popped and processed first (LIFO order)"
      - "So the right subtree is skipped"
      - "Because the stack is a FIFO queue"
      - "To reduce the total number of pushes"
    answer: 0
    explanation: |
      A stack is LIFO, so the last item pushed is popped first. Pushing right then left means left
      comes off the stack first, preserving the pre-order (visit, left, right) traversal that the
      recursive version produces.
    ref: "concepts.md#tail-recursion-and-recursion-to-iteration"

  - id: recursion-backtracking-008
    difficulty: intermediate
    tags: [when-to-use, iteration]
    question: |
      Which scenario most favors an ITERATIVE solution over a recursive one?
    options:
      - "Traversing a binary tree by structure"
      - "Divide-and-conquer such as merge sort"
      - "A simple linear sweep where recursion depth would equal the input size n (large n)"
      - "Generating all subsets of a set"
    answer: 2
    explanation: |
      For a plain linear pass, recursion to depth n buys nothing but risk of stack overflow and
      per-call overhead — iteration is O(1) control space and safe. Tree traversal, divide-and-conquer,
      and exhaustive generation are naturally recursive and read far more clearly that way.
    ref: "concepts.md#when-recursion-beats-iteration-and-when-it-doesnt"

  - id: recursion-backtracking-009
    difficulty: beginner
    tags: [backtracking, template]
    question: |
      In the standard backtracking template, what does the "unchoose" (e.g. path.removeLast()) step do?
    options:
      - "Records the current candidate as a solution"
      - "Terminates the entire search"
      - "Undoes the last decision to restore state before trying the next branch"
      - "Sorts the remaining candidates"
    answer: 2
    explanation: |
      After exploring a branch, you undo the last choice so the shared mutable state (the partial
      path and any occupancy sets) is restored for the sibling branches. Without the undo, later
      branches inherit a corrupted partial candidate.
    ref: "concepts.md#backtracking-the-choose--explore--unchoose-template"

  - id: recursion-backtracking-010
    difficulty: intermediate
    tags: [pattern-choice, recognition]
    question: |
      A problem asks you to "return ALL valid arrangements of queens on an n×n board so none attack
      each other." Which technique is the natural fit?
    options:
      - "Dynamic programming"
      - "Binary search on the answer"
      - "Backtracking with constraint pruning"
      - "Greedy selection"
    answer: 2
    explanation: |
      "Return all valid configurations subject to constraints" is the textbook backtracking signal.
      You place queens incrementally and prune placements that violate the column/diagonal
      constraints, abandoning doomed partial boards early.
    ref: "concepts.md#backtracking-the-choose--explore--unchoose-template"

  - id: recursion-backtracking-011
    difficulty: intermediate
    tags: [pattern-choice, dp-vs-backtracking]
    question: |
      When should you prefer memoized DP over plain backtracking for a recursive search?
    options:
      - "When you must enumerate every distinct configuration"
      - "When the recursion has no base case"
      - "When the input is already sorted"
      - "When you need a count or an optimum and the recursion revisits overlapping subproblems"
    answer: 3
    explanation: |
      If the goal is a count or an optimal value AND the recursion tree contains repeated
      (overlapping) states, caching those states with memoization turns exponential work into
      polynomial. Pure "generate all configurations" problems can't be collapsed this way — the
      output itself is exponential — so they stay backtracking.
    ref: "concepts.md#the-decision-tree-view--why-its-exponential"

  - id: recursion-backtracking-012
    difficulty: intermediate
    tags: [complexity, subsets]
    question: |
      What is the time complexity of generating ALL subsets of an array of n distinct elements
      (including the cost of building each subset)?
    options:
      - "O(n^2)"
      - "O(2^n)"
      - "O(n · 2^n)"
      - "O(n!)"
    answer: 2
    explanation: |
      There are 2^n subsets, and copying each one into the result costs up to O(n), giving
      O(n · 2^n). The bare count of subsets is 2^n; the extra factor of n comes from materializing
      each subset. You cannot beat the output size, which is itself exponential.
    ref: "concepts.md#the-decision-tree-view--why-its-exponential"

  - id: recursion-backtracking-013
    difficulty: intermediate
    tags: [complexity, permutations]
    question: |
      Generating all permutations of n distinct elements has what approximate time complexity?
    options:
      - "O(n · n!)"
      - "O(2^n)"
      - "O(n^2)"
      - "O(n log n)"
    answer: 0
    explanation: |
      There are n! permutations and each takes O(n) to build/copy, so O(n · n!). This grows even
      faster than the 2^n of subsets, which is why permutation problems are only tractable for
      small n.
    ref: "concepts.md#the-decision-tree-view--why-its-exponential"

  - id: recursion-backtracking-014
    difficulty: advanced
    tags: [templates, subsets-vs-permutations]
    question: |
      Why does the subsets/combinations template pass a "start" index into the recursion while the
      permutations template loops over all indices with a "used" array instead?
    options:
      - "To save memory in the subsets case"
      - "Because subsets/combinations are unordered (start index prevents reordering/reuse) while permutations are ordered and use each element once"
      - "Because permutations cannot contain duplicates but subsets can"
      - "There is no real difference; both approaches are interchangeable"
    answer: 1
    explanation: |
      In subsets/combinations order does not matter, so a start index ensures each element is only
      considered after the previous pick, preventing {1,2} and {2,1} from both appearing. In
      permutations order DOES matter and every element is used exactly once, so you must consider all
      not-yet-used indices at each level — tracked by a used[] array (or swapping).
    ref: "concepts.md#subsets-permutations-and-combinations--three-templates"

  - id: recursion-backtracking-015
    difficulty: advanced
    tags: [duplicates, dedup]
    question: |
      For "Subsets II" or "Permutations II" with duplicate values in the input, what is the standard
      way to avoid emitting duplicate results?
    options:
      - "Use a global HashSet to store every result and skip repeats at the end"
      - "Randomly shuffle the input before recursing"
      - "Sort the input, then within a level skip a candidate equal to its previous sibling"
      - "Only recurse on even indices"
    answer: 2
    explanation: |
      Sorting groups equal values together; then the rule `if i > start and nums[i] == nums[i-1]:
      continue` skips choosing the same value more than once at the same tree level. This dedups
      without the memory/time cost of hashing every full result.
    ref: "concepts.md#subsets-permutations-and-combinations--three-templates"

  - id: recursion-backtracking-016
    difficulty: intermediate
    tags: [combination-sum, reuse]
    question: |
      In Combination Sum (where the same number may be used unlimited times), how does the recursion
      differ from ordinary combinations?
    options:
      - "It recurses with the SAME index i (not i+1) to allow reusing the current element"
      - "It loops backward over the candidates"
      - "It uses a used[] array like permutations"
      - "It never needs a base case"
    answer: 0
    explanation: |
      To allow reuse, the recursive call passes i (the current index) rather than i+1, so the same
      candidate can be chosen again. Passing i+1 would forbid reuse (that is the ordinary
      combinations/subsets behavior).
    ref: "concepts.md#subsets-permutations-and-combinations--three-templates"

  - id: recursion-backtracking-017
    difficulty: advanced
    tags: [pruning, efficiency]
    question: |
      In backtracking, where does pruning deliver the greatest speedup?
    options:
      - "Only at the leaves, after a full candidate is built"
      - "As early as possible — rejecting an invalid partial candidate at a shallow node kills an entire subtree"
      - "After the whole search completes, by filtering results"
      - "By increasing the recursion depth limit"
    answer: 1
    explanation: |
      Rejecting a doomed partial candidate high in the decision tree eliminates every descendant
      branch below it — an exponential number of nodes. Checking validity only at the leaf wastes
      all the work spent reaching it. "Prune early" is the core efficiency lever in backtracking.
    ref: "concepts.md#pruning-cutting-the-search-space"

  - id: recursion-backtracking-018
    difficulty: advanced
    tags: [n-queens, o1-checks]
    question: |
      In an efficient N-Queens solver placing one queen per row, why track sets of (row - col) and
      (row + col) values?
    options:
      - "They identify the two diagonals through a square, enabling O(1) attack checks"
      - "To count the number of empty squares"
      - "To sort the columns before placing queens"
      - "To detect duplicate solutions"
    answer: 0
    explanation: |
      Along a ↘ diagonal (row - col) is constant, and along a ↙ diagonal (row + col) is constant.
      Storing occupied values of each in a set lets you test whether a square is attacked in O(1)
      instead of rescanning the board, which is the key pruning optimization.
    ref: "concepts.md#pruning-cutting-the-search-space"

  - id: recursion-backtracking-019
    difficulty: intermediate
    tags: [generate-parentheses, pruning]
    question: |
      In "Generate Parentheses" (all valid combinations of n pairs), what prune keeps only valid
      strings during backtracking?
    options:
      - "Add a ')' only if it does not exceed the number of '(' already placed, and add '(' only while fewer than n are used"
      - "Generate all 2^(2n) strings and filter valid ones at the end"
      - "Always alternate '(' and ')'"
      - "Add ')' first, then '(' "
    answer: 0
    explanation: |
      Track counts of open and close parens. You may add '(' while open < n, and add ')' only while
      close < open (so the string never becomes unbalanced). This prunes every invalid prefix,
      generating only well-formed strings rather than enumerating and filtering all 2^(2n) strings.
    ref: "concepts.md#pruning-cutting-the-search-space"

  - id: recursion-backtracking-020
    difficulty: advanced
    tags: [word-search, grid-dfs]
    question: |
      In "Word Search" (find a word by adjacent cells in a grid), how do you prevent reusing the same
      cell within one path while still allowing other paths to use it?
    options:
      - "Delete the cell from the grid permanently"
      - "Copy the whole grid at every step"
      - "Use a global visited set that is never cleared"
      - "Mark the cell visited before recursing and UNMARK it when the recursive call returns (backtrack)"
    answer: 3
    explanation: |
      Temporarily mark the cell (e.g. overwrite with a sentinel or set a visited flag), recurse into
      the neighbors, then restore it on return. This is backtracking on the grid: the cell is blocked
      only for the current path and becomes available again for sibling explorations.
    ref: "concepts.md#backtracking-the-choose--explore--unchoose-template"

  - id: recursion-backtracking-021
    difficulty: beginner
    tags: [divide-and-conquer, recurrence]
    question: |
      Merge sort splits the array in half and recurses, doing O(n) work to merge at each level. What
      does its recurrence T(n) = 2T(n/2) + O(n) solve to?
    options:
      - "O(n)"
      - "O(n log n)"
      - "O(n^2)"
      - "O(log n)"
    answer: 1
    explanation: |
      By the Master Theorem (case 2), T(n) = 2T(n/2) + O(n) is O(n log n): log n levels of recursion,
      each doing O(n) merge work. This recurrence is the canonical example of divide-and-conquer
      recursion analysis.
    ref: "concepts.md#recursion-base-case-recursive-case-and-the-call-stack"

  - id: recursion-backtracking-022
    difficulty: advanced
    tags: [word-search-ii, trie, pruning]
    question: |
      "Word Search II" asks you to find MANY words in a grid. Why combine backtracking DFS with a Trie?
    options:
      - "The Trie sorts the words alphabetically for output"
      - "The Trie lets one DFS traversal prune all words sharing a prefix at once, instead of searching each word separately"
      - "The Trie removes the need for a visited marker"
      - "The Trie converts the problem into binary search"
    answer: 1
    explanation: |
      Running Word Search once per word is wasteful. A Trie of all target words lets a single grid DFS
      follow the current prefix; if no Trie child matches the current letter you prune immediately,
      simultaneously abandoning every word that shares that dead-end prefix. This shared-prefix pruning
      is the whole point of the Trie + backtracking combo.
    ref: "concepts.md#pruning-cutting-the-search-space"

  - id: recursion-backtracking-023
    difficulty: intermediate
    tags: [phone-letters, branching]
    question: |
      In "Letter Combinations of a Phone Number", each digit maps to 3-4 letters. What is the structure
      of the backtracking search?
    options:
      - "A binary include/exclude tree like subsets"
      - "One level per digit, branching over that digit's letters, recording a string at depth = number of digits"
      - "A single loop with no recursion"
      - "Two pointers moving toward each other"
    answer: 1
    explanation: |
      The decision tree has one level per input digit; at each level you branch over the 3-4 letters
      that digit maps to. A complete combination is recorded when the path length equals the number of
      digits. It is a clean cartesian-product enumeration via backtracking.
    ref: "concepts.md#subsets-permutations-and-combinations--three-templates"
