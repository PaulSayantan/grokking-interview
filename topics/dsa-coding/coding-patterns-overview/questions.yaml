topic: "Coding Interview Patterns Overview"
domain: dsa-coding
topic_slug: coding-patterns-overview
version: 1
questions:
  - id: coding-patterns-overview-001
    difficulty: beginner
    tags: [sliding-window, recognition, subarray]
    question: |
      A problem asks for the length of the longest CONTIGUOUS subarray whose
      elements satisfy a running constraint (e.g. at most K distinct values).
      Which pattern should you reach for first?
    options: ["Backtracking", "Sliding window", "Union-Find", "Topological sort"]
    answer: 1
    explanation: |
      "Contiguous subarray/substring with a constraint" is the canonical signal
      for a sliding window. The window expands with the right pointer and
      contracts from the left when the constraint breaks, giving amortized O(n).
    ref: "concepts.md#sliding-window"

  - id: coding-patterns-overview-002
    difficulty: beginner
    tags: [two-pointers, sorted, complexity]
    question: |
      Why can the two-pointer technique find a pair summing to a target in a
      SORTED array in O(n) instead of O(n^2)?
    options:
      - "Because moving a pointer changes the running sum monotonically, so no backtracking is needed"
      - "Because sorting makes hashing unnecessary"
      - "Because it uses recursion to skip elements"
      - "Because binary search is applied at each step"
    answer: 0
    explanation: |
      On a sorted array the sum increases as you move the left pointer up and
      decreases as you move the right pointer down. That monotonic behavior lets
      you discard one candidate per step without ever reconsidering it → O(n).
    ref: "concepts.md#two-pointers"

  - id: coding-patterns-overview-003
    difficulty: intermediate
    tags: [bfs, shortest-path, graph]
    question: |
      You must find the FEWEST steps from a start cell to a target cell in an
      unweighted grid. Which traversal guarantees the first time you reach the
      target, it is via a shortest path?
    options: ["BFS", "DFS", "Backtracking", "Greedy descent"]
    answer: 0
    explanation: |
      BFS explores nodes in order of increasing distance from the source using a
      queue, so the first time the target is dequeued it is at minimum distance.
      DFS explores depth-first and does not give shortest paths in general.
    ref: "concepts.md#bfs-vs-dfs"

  - id: coding-patterns-overview-004
    difficulty: intermediate
    tags: [heap, top-k, complexity]
    question: |
      To find the K largest elements of an array of n numbers (k << n) using a
      heap, what heap and complexity are appropriate?
    options:
      - "A max-heap of all n elements, O(n log n)"
      - "A max-heap of size k, O(n log k)"
      - "A min-heap of size n, O(n)"
      - "A min-heap of size k, O(n log k)"
    answer: 3
    explanation: |
      Keep a MIN-heap of size k: the smallest of the current top-k sits at the
      root, so you compare each new element against it and pop when larger. Each
      of n elements costs O(log k) → O(n log k), beating a full O(n log n) sort.
    ref: "concepts.md#top-k--heap-k-way-merge"

  - id: coding-patterns-overview-005
    difficulty: intermediate
    tags: [backtracking, combinations, recognition]
    question: |
      A problem says "return ALL permutations" / "generate every subset". Which
      pattern is the natural fit?
    options: ["Backtracking", "Sliding window", "Prefix sum", "Monotonic stack"]
    answer: 0
    explanation: |
      Generating all permutations/combinations/subsets is the signature of
      backtracking: choose, recurse, un-choose. It explores the tree of partial
      solutions, pruning branches that cannot succeed.
    ref: "concepts.md#backtracking"

  - id: coding-patterns-overview-006
    difficulty: advanced
    tags: [binary-search-on-answer, monotonic, optimization]
    question: |
      "Find the MINIMUM ship capacity so all packages ship within D days." The
      feasibility test (can we ship within D days at capacity c?) is monotonic in
      c. Which technique fits best?
    options:
      - "Greedy without search"
      - "Dynamic programming over days"
      - "Backtracking over package assignments"
      - "Binary search on the answer"
    answer: 3
    explanation: |
      When "does capacity c work?" is monotonic (if c works, every larger c
      works), you binary-search the value range and run an O(n) feasibility check
      per candidate → O(n log(range)). This is binary search on the answer.
    ref: "concepts.md#binary-search-and-on-the-answer"

  - id: coding-patterns-overview-007
    difficulty: intermediate
    tags: [monotonic-stack, next-greater, recognition]
    question: |
      "For each day, how many days until a WARMER temperature?" (next greater
      element). Which pattern solves this in O(n)?
    options: ["Two pointers", "Binary search", "Monotonic stack", "Union-Find"]
    answer: 2
    explanation: |
      "Next/previous greater or smaller element" is the monotonic-stack signal.
      A decreasing stack of indices is maintained; when a warmer day arrives you
      pop and resolve those indices. Each element is pushed/popped once → O(n).
    ref: "concepts.md#monotonic-stack"

  - id: coding-patterns-overview-008
    difficulty: intermediate
    tags: [prefix-sum, subarray-sum, hashmap]
    question: |
      To count the number of subarrays whose sum equals k in O(n), which
      combination is standard?
    options:
      - "Sliding window alone"
      - "Sorting then two pointers"
      - "A monotonic stack of sums"
      - "Prefix sums plus a hashmap of previously seen prefix sums"
    answer: 3
    explanation: |
      A subarray (l,r] sums to k iff prefix[r] - prefix[l] = k. Storing counts of
      seen prefix sums in a hashmap lets you look up prefix[r]-k in O(1) as you
      scan → O(n). Sliding window fails when negatives are allowed.
    ref: "concepts.md#prefix-sum"

  - id: coding-patterns-overview-009
    difficulty: intermediate
    tags: [fast-slow-pointers, linked-list, space]
    question: |
      Detecting whether a linked list has a cycle using O(1) extra space is best
      done with which technique?
    options:
      - "A hash set of visited nodes"
      - "Reversing the list in place"
      - "Fast and slow pointers (Floyd's algorithm)"
      - "A monotonic stack"
    answer: 2
    explanation: |
      Floyd's tortoise-and-hare advances one pointer by 1 and another by 2; in a
      cycle the fast pointer laps the slow and they meet. It uses O(1) space,
      unlike a hash set which needs O(n).
    ref: "concepts.md#fast--slow-pointers"

  - id: coding-patterns-overview-010
    difficulty: advanced
    tags: [topological-sort, dag, dependencies]
    question: |
      "Given course prerequisites, return a valid order to take all courses (or
      detect it's impossible)." Which pattern applies?
    options:
      - "Topological sort on a DAG"
      - "Sliding window"
      - "Union-Find by rank"
      - "Backtracking over orderings"
    answer: 0
    explanation: |
      Dependencies/prerequisites form a directed graph; a valid ordering is a
      topological sort (Kahn's BFS on in-degrees or DFS post-order). If a cycle
      exists, no ordering is possible — which the algorithm also detects.
    ref: "concepts.md#union-find-topological-sort--trie"

  - id: coding-patterns-overview-011
    difficulty: advanced
    tags: [union-find, connectivity, undirected]
    question: |
      Which problem shape most directly calls for Union-Find (Disjoint Set Union)?
    options:
      - "Shortest path in a weighted graph"
      - "Finding the longest increasing subsequence"
      - "Next greater element for each index"
      - "Dynamic connectivity / grouping and detecting a cycle in an UNDIRECTED graph"
    answer: 3
    explanation: |
      Union-Find excels at incrementally merging sets and answering "are these two
      connected?" in near-constant amortized time, and at detecting a cycle in an
      undirected graph (an edge joining two already-connected nodes).
    ref: "concepts.md#union-find-topological-sort--trie"

  - id: coding-patterns-overview-012
    difficulty: advanced
    tags: [dynamic-programming, greedy, correctness]
    question: |
      What must you establish before trusting a GREEDY solution over dynamic
      programming?
    options:
      - "That the input is sorted"
      - "That the greedy-choice property holds — a locally optimal choice leads to a global optimum"
      - "That there are no duplicate elements"
      - "That the recursion depth is bounded"
    answer: 1
    explanation: |
      Greedy is only correct when a locally optimal choice provably yields the
      global optimum (greedy-choice property + optimal substructure), often shown
      via an exchange argument. Without that proof, DP is the safe default.
    ref: "concepts.md#dynamic-programming-vs-greedy"

  - id: coding-patterns-overview-013
    difficulty: advanced
    tags: [dynamic-programming, recognition, subproblems]
    question: |
      Which cue most strongly signals that dynamic programming is the right tool?
    options:
      - "The array is already sorted"
      - "You need to output every valid configuration"
      - "The problem has overlapping subproblems and optimal substructure (e.g. count-ways or min/max cost)"
      - "You need the shortest path in an unweighted graph"
    answer: 2
    explanation: |
      DP applies when a naive recursion recomputes the same subproblems
      (overlapping subproblems) and an optimal solution is built from optimal
      subsolutions. "Count the number of ways" and "min/max cost" are classic
      DP phrasings.
    ref: "concepts.md#dynamic-programming-vs-greedy"

  - id: coding-patterns-overview-014
    difficulty: intermediate
    tags: [memoization, tabulation, dp]
    question: |
      Which statement best distinguishes memoization from tabulation?
    options:
      - "Memoization is iterative bottom-up; tabulation is recursive top-down"
      - "Memoization is recursive top-down and computes only needed states; tabulation is iterative bottom-up"
      - "They always have different time complexity"
      - "Tabulation cannot be space-optimized"
    answer: 1
    explanation: |
      Memoization = top-down recursion with a cache, computing only the states it
      reaches. Tabulation = bottom-up iteration filling a table in dependency
      order, avoiding recursion overhead and often easier to space-optimize.
    ref: "concepts.md#memoization-vs-tabulation"

  - id: coding-patterns-overview-015
    difficulty: intermediate
    tags: [cyclic-sort, range, space]
    question: |
      An array holds n numbers that are a permutation of 1..n with one missing and
      one duplicated. Which O(n)-time, O(1)-space pattern places each value at its
      index to expose the anomaly?
    options: ["Cyclic sort", "Merge intervals", "Prefix sum", "K-way merge"]
    answer: 0
    explanation: |
      When values map to the index range 1..n, cyclic sort swaps each value to its
      correct slot in O(n) with O(1) extra space; a final scan reveals missing and
      duplicate values without hashing or sorting.
    ref: "concepts.md#cyclic-sort--in-place-reversal"

  - id: coding-patterns-overview-016
    difficulty: intermediate
    tags: [k-way-merge, heap, complexity]
    question: |
      Merging K sorted linked lists with a min-heap of their current heads runs in
      what time, where n is the total number of elements?
    options: ["O(n)", "O(k log n)", "O(n log k)", "O(n * k)"]
    answer: 2
    explanation: |
      The heap holds at most k elements (one per list). Each of the n elements is
      pushed and popped once at O(log k) → O(n log k). A naive pairwise scan of k
      lists per output element would be O(n*k).
    ref: "concepts.md#top-k--heap-k-way-merge"

  - id: coding-patterns-overview-017
    difficulty: beginner
    tags: [process, clarify, interview]
    question: |
      In the recommended problem-solving process, what should you do BEFORE writing
      any code?
    options:
      - "Clarify constraints and I/O, work an example, and state the brute force"
      - "Immediately optimize to the best asymptotic complexity"
      - "Write unit tests first"
      - "Pick a random data structure and start coding"
    answer: 0
    explanation: |
      The process is clarify → examples → brute force → optimize → code → test.
      Clarifying constraints, tracing an example, and naming the brute-force
      baseline prevents solving the wrong problem and guides the target complexity.
    ref: "concepts.md#the-problem-solving-process"

  - id: coding-patterns-overview-018
    difficulty: advanced
    tags: [constraints, complexity, recognition]
    question: |
      An interviewer states n <= 20 and asks for the count of valid configurations.
      What does the small n most strongly hint at?
    options:
      - "An O(1) closed-form formula is required"
      - "An exponential approach like backtracking / bitmask enumeration is acceptable"
      - "You must use a balanced BST"
      - "Only a greedy solution can pass"
    answer: 1
    explanation: |
      Constraints are hints about target complexity. n <= 20 means 2^n or n! is
      tractable, so exponential techniques (backtracking, bitmask DP) are fine.
      Large n (e.g. 10^5) would instead demand O(n log n) or better.
    ref: "concepts.md#the-problem-solving-process"

  - id: coding-patterns-overview-019
    difficulty: beginner
    tags: [merge-intervals, recognition]
    question: |
      A problem gives a list of possibly overlapping intervals and asks you to
      merge them. What is the usual first step of the merge-intervals pattern?
    options:
      - "Build a heap of interval lengths"
      - "Sort the intervals by start time, then sweep merging overlaps"
      - "Reverse the interval list in place"
      - "Binary search for each interval"
    answer: 1
    explanation: |
      Sorting by start (O(n log n)) lets a single left-to-right sweep merge any
      interval that overlaps the current one, since all later intervals start no
      earlier. This is the core of merge/insert-interval problems.
    ref: "concepts.md#the-pattern-catalogue--reach-for-this-when"

  - id: coding-patterns-overview-020
    difficulty: intermediate
    tags: [trie, prefix, recognition]
    question: |
      For an autocomplete feature doing many PREFIX lookups over a large
      dictionary, which structure gives lookup/insert in O(L) independent of
      dictionary size (L = key length)?
    options: ["A hashmap of full words", "A balanced BST", "A monotonic stack", "A trie (prefix tree)"]
    answer: 3
    explanation: |
      A trie keys nodes by character with an end-of-word flag, so prefix queries
      and inserts cost O(L) regardless of how many words are stored — ideal for
      autocomplete and dictionary/wildcard search.
    ref: "concepts.md#union-find-topological-sort--trie"

  - id: coding-patterns-overview-021
    difficulty: intermediate
    tags: [time-space-tradeoff, hashmap, complexity]
    question: |
      Using a hashmap to eliminate a nested loop (e.g. Two Sum) is an example of
      which trade-off?
    options:
      - "Trading correctness for speed"
      - "Trading space to gain nothing asymptotically"
      - "Trading O(n) extra space for O(1) average lookup, cutting O(n^2) to O(n)"
      - "Trading recursion depth for iteration"
    answer: 2
    explanation: |
      A hashmap spends O(n) memory to get O(1) average lookups, converting the
      inner search of an O(n^2) nested loop into O(1) and the whole algorithm to
      O(n). This time-for-space trade is one of the most common optimizations.
    ref: "concepts.md#complexity-trade-offs"

  - id: coding-patterns-overview-022
    difficulty: intermediate
    tags: [bfs-vs-dfs, space, tradeoff]
    question: |
      For a very WIDE but shallow tree, which traversal tends to use MORE memory,
      and why?
    options:
      - "DFS, because recursion is always heavier"
      - "They always use identical memory"
      - "BFS, because its queue can hold the entire (large) width of a level"
      - "BFS, because it revisits nodes"
    answer: 2
    explanation: |
      BFS space is O(max width): a wide level fills the queue. DFS space is
      O(max depth), which is small for a shallow tree. On deep-narrow trees the
      trade-off reverses (DFS risks stack overflow).
    ref: "concepts.md#bfs-vs-dfs"

  - id: coding-patterns-overview-023
    difficulty: intermediate
    tags: [bit-manipulation, xor, recognition]
    question: |
      Every element in an array appears twice except one. Which O(n)-time,
      O(1)-space trick finds the unique element?
    options:
      - "Sort and scan for the singleton"
      - "XOR all elements together; pairs cancel, leaving the unique value"
      - "Use a hashmap of counts"
      - "Binary search after sorting"
    answer: 1
    explanation: |
      XOR is associative and self-canceling (x ^ x = 0), so XOR-ing all elements
      cancels every pair and leaves the single unique value — O(n) time and O(1)
      space, beating the O(n)-space hashmap approach.
    ref: "concepts.md#bit-manipulation"

  - id: coding-patterns-overview-024
    difficulty: beginner
    tags: [decision-guide, recognition]
    question: |
      Per the decision guide, "sorted input, find a pair/partition" points to which
      pair of patterns first?
    options:
      - "BFS or DFS"
      - "Backtracking or DP"
      - "Monotonic stack or heap"
      - "Binary search or two pointers"
    answer: 3
    explanation: |
      A sorted array unlocks O(log n) binary search and O(n) two-pointer sweeps;
      both exploit the ordering to avoid an O(n^2) scan. That is the first branch
      of the shape-to-pattern decision guide.
    ref: "concepts.md#decision-guide--problem-shape--pattern"
