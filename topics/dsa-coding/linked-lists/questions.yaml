topic: "Linked Lists & Fast/Slow Pointers"
domain: dsa-coding
topic_slug: linked-lists
version: 1
questions:
  - id: linked-lists-001
    difficulty: beginner
    tags: [complexity, access, arrays-vs-lists]
    question: |
      What is the worst-case time complexity of accessing the k-th element
      (0-indexed) of a singly linked list, given only the head pointer?
    options: ["O(1)", "O(log n)", "O(n)", "O(k log k)"]
    answer: 2
    explanation: |
      A linked list has no address arithmetic like an array (base + i * size).
      To reach index k you must follow `next` pointers from the head k times, so
      access is O(n) in the worst case. Losing O(1) random access is the core
      cost of choosing pointers over contiguous storage.
    ref: "concepts.md#how-a-linked-list-works-under-the-hood"

  - id: linked-lists-002
    difficulty: beginner
    tags: [complexity, insert, delete]
    question: |
      Inserting a node into a singly linked list is O(1) under which condition?
    options:
      - "Always, since pointer splicing is constant work no matter the position"
      - "Only if the list is kept sorted so the correct insertion slot is known"
      - "Never — every insertion must first shift all subsequent nodes over by one"
      - "Only if you already hold a pointer to the predecessor node"
    answer: 3
    explanation: |
      Splicing a node in is just a couple of pointer assignments — O(1) — but only
      once you have a pointer to the node *before* the insertion point. Finding that
      spot from the head is O(n). This conditional is exactly what interviewers probe.
    ref: "concepts.md#how-a-linked-list-works-under-the-hood"

  - id: linked-lists-003
    difficulty: intermediate
    tags: [cache-locality, arrays-vs-lists, performance]
    question: |
      Both array traversal and linked-list traversal are O(n), yet arrays are often
      5–10x faster in practice. What is the primary reason?
    options:
      - "Arrays use a specialized SIMD comparison operator that linked lists cannot invoke during traversal"
      - "Contiguous array memory gives spatial locality and prefetching, while scattered list nodes cause a cache miss per pointer dereference"
      - "Linked lists must recompute and cache their total length before every single step of a traversal"
      - "Arrays are loaded entirely into CPU registers, while linked lists are forced to stay in slow main memory"
    answer: 1
    explanation: |
      Array elements are contiguous, so one cache-line fetch pulls in many neighbors
      and the hardware prefetcher stays ahead. Linked-list nodes are scattered on the
      heap, so each `next` dereference is a likely cache miss where the CPU stalls on
      main memory. Big-O hides this constant factor dominated by memory latency.
    ref: "concepts.md#linked-list-vs-array-cache-locality"

  - id: linked-lists-004
    difficulty: intermediate
    tags: [doubly-linked, delete, complexity]
    question: |
      Given only a pointer to a node (not the head) that you want to delete, which
      list type supports O(1) deletion?
    options:
      - "Singly linked list"
      - "Neither — both require O(n)"
      - "Both are O(1)"
      - "Doubly linked list"
    answer: 3
    explanation: |
      In a doubly linked list each node stores `prev`, so you can relink
      `node.prev.next = node.next` and `node.next.prev = node.prev` in O(1). A singly
      linked node has no `prev`, so you must walk from the head to find the predecessor
      — O(n) (or use the copy-next-value trick, which fails on the tail).
    ref: "concepts.md#singly-vs-doubly-linked-lists"

  - id: linked-lists-005
    difficulty: beginner
    tags: [sentinel, dummy-head, technique]
    question: |
      What is the main purpose of a dummy (sentinel) head node?
    options:
      - "To cache the current length of the list so size queries become O(1)"
      - "To speed up random access to O(1) by indexing nodes from the sentinel"
      - "To make the list circular by wiring the tail back to the sentinel node"
      - "To eliminate the special-case branch for operations that may modify the head"
    answer: 3
    explanation: |
      A dummy node placed before the real head gives every real node a predecessor,
      so insert/delete code is uniform and you never need an `if node == head` branch.
      You return `dummy.next` as the (possibly new) real head. It removes the #1 source
      of head-mutation bugs.
    ref: "concepts.md#the-dummy--sentinel-head-trick"

  - id: linked-lists-006
    difficulty: intermediate
    tags: [reversal, pointers, common-bugs]
    question: |
      In the iterative 3-pointer reversal, why must you save `nxt = curr.next`
      BEFORE executing `curr.next = prev`?
    options:
      - "To maintain a running count of the nodes reversed so far for the return value"
      - "To handle the empty-list case before the main reversal loop begins executing"
      - "Because prev might be null on the first iteration and dereferencing it would fault"
      - "Because assigning curr.next = prev overwrites the only link to the rest of the list"
    answer: 3
    explanation: |
      Once you set `curr.next = prev` you have destroyed `curr`'s forward link. Without
      first saving `curr.next` into a temp, you lose the entire remainder of the list.
      Forgetting this save is the classic linked-list reversal bug.
    ref: "concepts.md#in-place-reversal-iterative-3-pointer--recursive"

  - id: linked-lists-007
    difficulty: intermediate
    tags: [reversal, complexity, recursion]
    question: |
      What are the time and space complexities of iterative in-place reversal of a
      singly linked list of length n?
    options:
      - "O(n) time, O(1) space"
      - "O(n) time, O(n) space"
      - "O(n log n) time, O(1) space"
      - "O(n^2) time, O(1) space"
    answer: 0
    explanation: |
      Iterative reversal makes a single pass flipping each `next` pointer, using only
      three fixed pointers — O(n) time, O(1) space. The recursive version is also O(n)
      time but uses O(n) call-stack space (one frame per node), which can overflow on
      long lists.
    ref: "concepts.md#in-place-reversal-iterative-3-pointer--recursive"

  - id: linked-lists-008
    difficulty: intermediate
    tags: [fast-slow, cycle-detection, pattern-choice]
    question: |
      You must detect whether a singly linked list contains a cycle using O(1) extra
      space. Which technique fits?
    options:
      - "Store every visited node in a hash set and stop when one repeats"
      - "Sort the list first, then scan for two adjacent nodes sharing an address"
      - "Floyd's fast/slow pointers (tortoise and hare)"
      - "Binary search on node addresses to locate the repeated back-edge"
    answer: 2
    explanation: |
      A hash set of visited nodes works but costs O(n) space. Floyd's algorithm advances
      slow by 1 and fast by 2; if a cycle exists the fast pointer laps the slow one and
      they meet inside the loop — O(n) time, O(1) space.
    ref: "concepts.md#fastslow-pointers-floyds-tortoise--hare"

  - id: linked-lists-009
    difficulty: advanced
    tags: [fast-slow, cycle-start, floyd]
    question: |
      After Floyd's algorithm detects a cycle (slow meets fast), how do you find the
      node where the cycle begins?
    options:
      - "Return the meeting point directly, since it always coincides with the cycle entry"
      - "Reset one pointer to the head, then advance both one step at a time until they meet"
      - "Advance the fast pointer two more steps so it wraps around onto the entry node"
      - "Reverse the list from the meeting point and take the resulting middle node"
    answer: 1
    explanation: |
      Reset one pointer to head and move both one step per iteration; they converge at
      the cycle entry. This follows from the congruence a ≡ (L − b) mod L, where a is the
      non-cyclic prefix length, L the loop length, and b the meeting offset into the loop.
    ref: "concepts.md#fastslow-pointers-floyds-tortoise--hare"

  - id: linked-lists-010
    difficulty: intermediate
    tags: [fast-slow, middle, pattern-choice]
    question: |
      To find the middle node of a linked list in a single pass, you advance `slow` by
      1 and `fast` by 2. Where is `slow` when `fast` reaches the end?
    options: ["At the head", "At the tail", "At the middle", "One before the end"]
    answer: 2
    explanation: |
      Since fast moves twice as fast as slow, when fast has traversed the whole list
      slow has traversed half of it — landing on the middle node. This one-pass,
      O(1)-space midpoint finder is a building block for reorder-list and palindrome checks.
    ref: "concepts.md#fastslow-pointers-floyds-tortoise--hare"

  - id: linked-lists-011
    difficulty: intermediate
    tags: [merge, complexity, two-pointer]
    question: |
      What is the time complexity of merging two sorted linked lists of lengths n and m
      by splicing existing nodes with a dummy head?
    options: ["O(n + m)", "O(n * m)", "O((n + m) log(n + m))", "O(max(n, m)^2)"]
    answer: 0
    explanation: |
      Each step compares the two current heads and splices the smaller node onto the
      result tail, advancing one pointer. Every node is visited once, giving O(n + m)
      time and O(1) space (no new nodes are allocated — existing nodes are relinked).
    ref: "concepts.md#merge-two-sorted-lists"

  - id: linked-lists-012
    difficulty: advanced
    tags: [merge-k, heap, complexity]
    question: |
      What is the optimal time complexity to merge k sorted linked lists containing N
      total nodes, using a min-heap of the current heads?
    options: ["O(N log k)", "O(N * k)", "O(N log N)", "O(k^2)"]
    answer: 0
    explanation: |
      A min-heap holds the k current heads; each of the N nodes is pushed and popped once,
      and heap operations cost O(log k). Total O(N log k), better than repeatedly scanning
      all k heads (O(N*k)). Divide-and-conquer pairwise merging achieves the same bound.
    ref: "concepts.md#merge-two-sorted-lists"

  - id: linked-lists-013
    difficulty: intermediate
    tags: [remove-nth, two-pointer, pattern-choice]
    question: |
      To remove the n-th node from the END of a list in one pass, what is the standard
      two-pointer setup?
    options:
      - "Advance a lead pointer n (or n+1 with a dummy) steps ahead, then move both until the lead reaches the end"
      - "Use slow=1x and fast=2x speed pointers so slow lands exactly on the target node"
      - "Reverse the list, remove the node now at index n, then reverse the list back again"
      - "Binary search for the node by repeatedly halving the remaining tail length"
    answer: 0
    explanation: |
      Move a lead pointer n steps ahead of a trailing pointer; then advance both together.
      When the lead hits the end, the trailing pointer sits just before the target
      (using a dummy head plus an n+1 gap cleanly handles removing the head).
    ref: "concepts.md#fastslow-pointers-floyds-tortoise--hare"

  - id: linked-lists-014
    difficulty: intermediate
    tags: [lru-cache, doubly-linked, design]
    question: |
      Why does an LRU cache implementation typically pair a hash map with a DOUBLY linked
      list rather than a singly linked list or an array?
    options:
      - "To keep the cached elements permanently sorted by their stored value"
      - "Because arrays are structurally incapable of storing key-value pair entries"
      - "To reduce total memory usage versus the equivalent array-backed cache"
      - "Because a doubly linked list allows O(1) removal of an arbitrary node and O(1) move-to-front, given a map pointer to the node"
    answer: 3
    explanation: |
      The hash map gives O(1) lookup of the node; the doubly linked list lets you unlink
      that node (using its `prev`) and move it to the front in O(1). A singly linked list
      would need O(n) to find a predecessor; an array would need O(n) shifting.
    ref: "concepts.md#singly-vs-doubly-linked-lists"

  - id: linked-lists-015
    difficulty: beginner
    tags: [null-handling, common-bugs, fast-slow]
    question: |
      In cycle detection, why is the loop guarded with `while fast and fast.next` rather
      than just `while fast`?
    options:
      - "To count the number of iterations performed before the pointers meet"
      - "To make the loop run faster by skipping the redundant null comparison"
      - "Because slow could itself become null partway through the traversal"
      - "Because fast.next.next would dereference null on the last or second-to-last node otherwise"
    answer: 3
    explanation: |
      Fast advances two steps via `fast.next.next`. If `fast` is the last node then
      `fast.next` is null and `fast.next.next` throws a null-pointer error. Checking both
      `fast` and `fast.next` before the double-step is the correct null guard.
    ref: "concepts.md#common-bugs--gotchas"

  - id: linked-lists-016
    difficulty: advanced
    tags: [find-duplicate, floyd, pattern-choice]
    question: |
      "Find the Duplicate Number" (array of n+1 ints in range 1..n) can be solved in
      O(1) space by treating the array as an implicit linked list. Which algorithm applies?
    options:
      - "Binary search on the candidate values while counting elements at or below the midpoint"
      - "Quickselect partitioning to isolate the repeated element in expected linear time"
      - "Union-Find that merges each index with the value it points at until a set collides"
      - "Floyd's cycle detection (fast/slow pointers) on the index-following function"
    answer: 3
    explanation: |
      Treat value `nums[i]` as a `next` pointer from index i. A duplicate value creates a
      cycle whose entry is the duplicate. Floyd's algorithm finds the cycle start in O(n)
      time and O(1) space without modifying the array — a classic "implicit list" trick.
    ref: "concepts.md#fastslow-pointers-floyds-tortoise--hare"

  - id: linked-lists-017
    difficulty: intermediate
    tags: [memory, node-overhead, arrays-vs-lists]
    question: |
      Compared to an int array of length n, a singly linked list of the same n integers
      uses more memory primarily because of what?
    options:
      - "It stores each integer twice, once as a key and once as the payload value"
      - "Each node adds a next-pointer plus per-object allocator/header overhead"
      - "Linked lists cache every previously visited value inside each node for fast rewind"
      - "It rounds every stored integer up to a full 8-byte word regardless of its size"
    answer: 1
    explanation: |
      Every node is a separate heap allocation carrying at least one pointer (8 bytes on
      64-bit) plus object-header/allocator overhead, on top of the payload. An array packs
      raw values contiguously with no per-element pointer, so it is far more compact.
    ref: "concepts.md#how-a-linked-list-works-under-the-hood"

  - id: linked-lists-018
    difficulty: advanced
    tags: [reorder, reversal, fast-slow, composition]
    question: |
      The "Reorder List" problem (L0→Ln→L1→Ln-1→...) is solved by composing which three
      linked-list techniques?
    options:
      - "Sort the nodes, binary search for the midpoint, then merge the two ends"
      - "Find the middle (fast/slow), reverse the second half, then merge the two halves alternately"
      - "Hash every node by position into a map, then rebuild the list from the map"
      - "Recursively reverse the whole list twice to swap the front and back ordering"
    answer: 1
    explanation: |
      Split at the midpoint with fast/slow, reverse the second half in place, then weave
      the two halves together alternating nodes. It runs in O(n) time, O(1) space and is a
      great example of composing the middle-finding and reversal primitives.
    ref: "concepts.md#fastslow-pointers-floyds-tortoise--hare"

  - id: linked-lists-019
    difficulty: advanced
    tags: [copy-random-pointer, technique, complexity]
    question: |
      "Copy List with Random Pointer" can be done in O(1) EXTRA space (beyond the output)
      using which technique?
    options:
      - "Build a hash map from each original node to its freshly allocated clone in a first pass"
      - "Reverse the entire list first, then copy each node backward starting from the tail"
      - "Sort the nodes by the address of their random-pointer target, then clone in that order"
      - "Interleave each copy node right after its original, wire the random pointers, then split the two lists"
    answer: 3
    explanation: |
      The interleaving trick weaves copy[i] right after orig[i]; then
      copy.random = orig.random.next sets each random link in place, and finally the two
      lists are unzipped. This avoids the O(n) hash map (which also works but uses extra space).
    ref: "concepts.md#singly-vs-doubly-linked-lists"

  - id: linked-lists-020
    difficulty: beginner
    tags: [sort-list, merge-sort, complexity]
    question: |
      Which sorting algorithm is most naturally suited to sorting a linked list in
      O(n log n) time with O(1) auxiliary space (ignoring recursion stack)?
    options: ["Quicksort", "Heapsort", "Merge sort", "Counting sort"]
    answer: 2
    explanation: |
      Merge sort fits linked lists perfectly: splitting is O(1) pointer work (no random
      access needed) and merging sorted halves is an O(1)-space splice. Quicksort and
      heapsort rely on random access / index swaps that linked lists don't support cheaply.
    ref: "concepts.md#merge-two-sorted-lists"

  - id: linked-lists-021
    difficulty: intermediate
    tags: [common-bugs, cycle, rewiring]
    question: |
      When rewiring pointers (e.g., in Reorder List), which mistake commonly produces an
      infinite loop?
    options:
      - "Adding a dummy head node before starting the pointer-rewiring passes"
      - "Forgetting to set the final node's next to null, leaving an accidental cycle"
      - "Comparing node values instead of positional indices while weaving the halves"
      - "Allocating a few extra scratch nodes that are never spliced into the result"
    answer: 1
    explanation: |
      If after rewiring the last node still points into the list instead of null, traversal
      never terminates — an accidental cycle. Always terminate the reconstructed list with
      an explicit `next = null` on the final node.
    ref: "concepts.md#common-bugs--gotchas"
