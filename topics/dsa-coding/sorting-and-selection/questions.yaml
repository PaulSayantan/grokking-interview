topic: "Sorting Algorithms & Selection"
domain: dsa-coding
topic_slug: sorting-and-selection
version: 1
questions:
  - id: sorting-and-selection-001
    difficulty: beginner
    tags: [stability, definitions]
    question: |
      A sorting algorithm is "stable" if it:
    options:
      - "Never exceeds O(n log n) in the worst case"
      - "Preserves the relative order of elements that compare equal"
      - "Uses only O(1) auxiliary space"
      - "Works without recursion"
    answer: 1
    explanation: |
      Stability means equal keys keep their original relative order. It matters for
      multi-key sorting (sort by secondary key, then stably by primary). It is unrelated to
      complexity or space usage.
    ref: "concepts.md#two-dimensions-that-define-every-sort-stability-and-in-place"

  - id: sorting-and-selection-002
    difficulty: intermediate
    tags: [quicksort, worst-case, complexity]
    question: |
      What is the worst-case time complexity of quicksort, and what input pattern triggers
      it with a naive "always pick the last element" pivot?
    options:
      - "O(n log n) — random input"
      - "O(n²) — an array of all distinct random values"
      - "O(n²) — an already-sorted (or reverse-sorted) array"
      - "O(n log n) — an array with many duplicates"
    answer: 2
    explanation: |
      With a last-element pivot, an already-sorted array produces maximally unbalanced
      partitions of size 0 and n−1 every level, giving T(n)=T(n−1)+O(n)=O(n²). Randomized or
      median-of-three pivots defeat this.
    ref: "concepts.md#quicksort-in-place-on-log-n-avg--on²-worst-pivot--partition"

  - id: sorting-and-selection-003
    difficulty: intermediate
    tags: [merge-sort, space, stability]
    question: |
      Which statement about standard array merge sort is correct?
    options:
      - "It is in-place, using O(1) auxiliary space"
      - "It is O(n log n) on average but O(n²) in the worst case"
      - "It is stable and O(n log n) in all cases but needs O(n) auxiliary space"
      - "It is not stable because the merge reorders equal elements"
    answer: 2
    explanation: |
      Merge sort's balanced split gives Θ(n log n) in best/average/worst. Taking from the
      left half on ties keeps it stable. Its downside is the O(n) merge buffer, so it is not
      in-place.
    ref: "concepts.md#merge-sort-stable-on-log-n-divide-and-conquer"

  - id: sorting-and-selection-004
    difficulty: intermediate
    tags: [quickselect, selection, complexity]
    question: |
      You need only the k-th largest element of an in-memory array (not a full sort). What is
      the best average-case approach and its complexity?
    options:
      - "Quickselect (partition, recurse into one side) — O(n) average"
      - "Sort the whole array — O(n log n)"
      - "Build a max-heap of all n elements — O(n log n)"
      - "Binary search the array — O(log n)"
    answer: 0
    explanation: |
      Quickselect partitions like quicksort but recurses into only the side containing index k.
      The expected work n + n/2 + n/4 + … is O(n). A size-k heap gives O(n log k) and is
      preferable for streaming or small k.
    ref: "concepts.md#quickselect-on-average-selection-the-k-th-element-pattern"

  - id: sorting-and-selection-005
    difficulty: advanced
    tags: [lower-bound, comparison-sort, theory]
    question: |
      Why can no comparison-based sort do better than Θ(n log n) comparisons in the worst case?
    options:
      - "Because every comparison sort is recursive and recursion adds a log factor"
      - "Because cache misses force at least n log n memory accesses"
      - "Because a decision tree distinguishing n! permutations needs height ≥ log₂(n!) = Θ(n log n)"
      - "Because swapping n elements takes n log n time"
    answer: 2
    explanation: |
      Any comparison sort is a binary decision tree with ≥ n! leaves (one per permutation). A
      binary tree with L leaves has height ≥ log₂(L), and log₂(n!) = Θ(n log n) by Stirling —
      that height is the worst-case comparison count.
    ref: "concepts.md#why-comparison-sorts-are-ωn-log-n-the-decision-tree-lower-bound"

  - id: sorting-and-selection-006
    difficulty: intermediate
    tags: [libraries, timsort, java]
    question: |
      What does Java's Arrays.sort use for an array of OBJECTS (e.g. String[]), and why?
    options:
      - "Dual-pivot quicksort, because it is the fastest in practice"
      - "Heap sort, to guarantee O(n log n)"
      - "Counting sort, because objects hash to integers"
      - "Timsort, because it is stable and adaptive on real-world runs"
    answer: 3
    explanation: |
      Object sorts use Timsort — a stable, adaptive merge/insertion hybrid that exploits
      existing runs (O(n) on nearly-sorted data). Stability is part of the contract for objects.
      Primitives use dual-pivot quicksort, where stability is meaningless.
    ref: "concepts.md#what-real-libraries-actually-use-timsort--dual-pivot-quicksort"

  - id: sorting-and-selection-007
    difficulty: intermediate
    tags: [heap-sort, in-place, stability]
    question: |
      Which combination correctly describes heap sort?
    options:
      - "O(n log n) worst case, in-place, not stable"
      - "O(n²) worst case, in-place, stable"
      - "O(n log n) worst case, needs O(n) extra space, stable"
      - "O(n) average with bounded keys, not stable"
    answer: 0
    explanation: |
      Heap sort builds a heap in the array (O(n)) then extracts the max n times with O(log n)
      sift-downs → O(n log n) worst case, in-place O(1) aux. It is not stable and has poor cache
      locality, so it is often slower than quicksort in practice.
    ref: "concepts.md#heap-sort-in-place-on-log-n-worst-not-stable"

  - id: sorting-and-selection-008
    difficulty: intermediate
    tags: [insertion-sort, adaptive, nearly-sorted]
    question: |
      For a nearly-sorted array (each element at most a few positions from its final spot),
      which sort runs closest to O(n)?
    options:
      - "Insertion sort"
      - "Selection sort"
      - "Heap sort"
      - "Quicksort with last-element pivot"
    answer: 0
    explanation: |
      Insertion sort is adaptive: on nearly-sorted input each element shifts only a few slots, so
      it approaches O(n). This is exactly why Timsort uses insertion sort for short runs. Selection
      sort is always O(n²) with no adaptivity.
    ref: "concepts.md#bubble-insertion-selection-sort-the-on²-trio"

  - id: sorting-and-selection-009
    difficulty: advanced
    tags: [counting-sort, non-comparison, constraints]
    question: |
      Counting sort achieves O(n + k). What does k represent, and when is counting sort a poor
      choice?
    options:
      - "k = number of recursive calls; poor when input is random"
      - "k = number of duplicate keys; poor when there are no duplicates"
      - "k = number of comparisons; poor when keys are strings"
      - "k = size of the integer key range; poor when the range is huge relative to n"
    answer: 3
    explanation: |
      k is the size of the key range [0, k). Counting sort allocates a k-sized count array, so it
      shines when k = O(n) but is wasteful when k is enormous (e.g. sorting 32-bit ints directly
      would need a 4-billion-entry array).
    ref: "concepts.md#non-comparison-sorts-counting-radix-bucket-linear-with-constraints"

  - id: sorting-and-selection-010
    difficulty: intermediate
    tags: [sort-colors, dutch-flag, partition]
    question: |
      "Sort Colors" (an array of 0s, 1s, and 2s) is optimally solved in one pass by:
    options:
      - "The Dutch National Flag three-way partition with low/mid/high pointers"
      - "Counting each color then overwriting the array"
      - "Merge sort for stability"
      - "Building a min-heap and extracting"
    answer: 0
    explanation: |
      The Dutch National Flag algorithm uses three pointers to partition into <, =, > regions in a
      single O(n) pass with O(1) space. (Counting works too but is two passes; the DNF one-pass swap
      solution is the intended answer.)
    ref: "concepts.md#quicksort-in-place-on-log-n-avg--on²-worst-pivot--partition"

  - id: sorting-and-selection-011
    difficulty: intermediate
    tags: [merge-intervals, preprocessing, sorting]
    question: |
      For "Merge Intervals," what preprocessing step makes overlapping intervals adjacent so a
      single linear sweep can merge them?
    options:
      - "Sort the intervals by their end time descending"
      - "Build a segment tree over the intervals"
      - "Hash each interval by its length"
      - "Sort the intervals by their start time"
    answer: 3
    explanation: |
      Sorting by start time guarantees that any interval overlapping the current one comes right
      after it, so a single O(n) sweep can merge or append. Total cost is dominated by the
      O(n log n) sort.
    ref: "concepts.md#sorting-as-a-preprocessing-step-the-meta-pattern"

  - id: sorting-and-selection-012
    difficulty: advanced
    tags: [quicksort, duplicates, three-way]
    question: |
      An array has very many duplicate keys. Which quicksort variant avoids O(n²) blowup on the
      duplicates?
    options:
      - "Two-way Lomuto partition with a first-element pivot"
      - "Switching to bubble sort for the duplicates"
      - "Three-way (Dutch flag) partition that groups < = > in one pass"
      - "Sorting the array twice"
    answer: 2
    explanation: |
      A three-way partition places all elements equal to the pivot in the middle and never recurses
      on them, giving O(n) behavior on inputs dominated by equal keys. A naive two-way partition
      re-processes equal elements repeatedly.
    ref: "concepts.md#quicksort-in-place-on-log-n-avg--on²-worst-pivot--partition"

  - id: sorting-and-selection-013
    difficulty: intermediate
    tags: [sort-list, linked-list, merge-sort]
    question: |
      Why is merge sort the preferred algorithm for sorting a singly linked list ("Sort List")?
    options:
      - "It needs random access, which linked lists provide in O(1)"
      - "It is the only stable sort"
      - "Merging relinks pointers with O(1) extra space and needs no random access"
      - "Linked lists cannot be sorted by quicksort at all"
    answer: 2
    explanation: |
      Merge sort splits by walking pointers and merges by relinking nodes, needing no random
      indexing and only O(1) auxiliary space (beyond recursion). Quicksort relies on random access
      and partitioning that linked lists handle poorly.
    ref: "concepts.md#merge-sort-stable-on-log-n-divide-and-conquer"

  - id: sorting-and-selection-014
    difficulty: advanced
    tags: [quickselect, worst-case, median-of-medians]
    question: |
      Quickselect is O(n) on average but O(n²) in the worst case. Which technique guarantees
      worst-case O(n) selection (at the cost of large constants)?
    options:
      - "Median-of-medians pivot selection"
      - "Always picking the first element as pivot"
      - "Sorting the array with heap sort first"
      - "Binary searching for the pivot"
    answer: 0
    explanation: |
      The median-of-medians algorithm chooses a provably good pivot so each partition discards a
      constant fraction, giving worst-case O(n). Its constants are large, so in practice a randomized
      pivot is used to make the O(n²) case negligible.
    ref: "concepts.md#quickselect-on-average-selection-the-k-th-element-pattern"

  - id: sorting-and-selection-015
    difficulty: intermediate
    tags: [top-k, heap, frequency]
    question: |
      "Top K Frequent Elements" can be solved in better than O(n log n) by counting frequencies
      then using:
    options:
      - "A full comparison sort of all elements by frequency"
      - "Binary search on the answer"
      - "Bucket sort indexed by frequency (bucket[f] holds elements seen f times)"
      - "A trie of the elements"
    answer: 2
    explanation: |
      Frequencies range from 1..n, so you can bucket elements by frequency into an array of n+1
      buckets and read the top of it — O(n). A size-k heap is the other common answer at O(n log k).
    ref: "concepts.md#non-comparison-sorts-counting-radix-bucket-linear-with-constraints"

  - id: sorting-and-selection-016
    difficulty: beginner
    tags: [selection-sort, swaps]
    question: |
      Selection sort is O(n²) comparisons but is sometimes chosen because it makes:
    options:
      - "Zero comparisons on sorted input"
      - "The sort stable"
      - "The fewest swaps/writes — O(n) total"
      - "The sort run in O(n log n)"
    answer: 2
    explanation: |
      Selection sort performs only O(n) swaps (one per position after finding the minimum), which
      matters when writes are far costlier than comparisons (e.g. flash memory). It is still O(n²)
      comparisons and is not stable.
    ref: "concepts.md#bubble-insertion-selection-sort-the-on²-trio"

  - id: sorting-and-selection-017
    difficulty: advanced
    tags: [radix-sort, stability, correctness]
    question: |
      LSD radix sort processes numbers one digit at a time using an inner counting sort. Why must
      that inner sort be stable?
    options:
      - "To reduce the number of passes to one"
      - "So that ordering established by lower-significance digits is preserved when sorting by
        higher digits"
      - "Because counting sort is faster when stable"
      - "To avoid using extra space"
    answer: 1
    explanation: |
      Radix sort's correctness depends on each digit pass preserving the relative order from
      previous (less significant) passes. A stable inner sort guarantees that, so the final result
      is fully ordered.
    ref: "concepts.md#non-comparison-sorts-counting-radix-bucket-linear-with-constraints"

  - id: sorting-and-selection-018
    difficulty: intermediate
    tags: [largest-number, comparator, sorting]
    question: |
      In "Largest Number" you arrange integers to form the biggest concatenation. The correct sort
      comparator for two number strings a and b compares:
    options:
      - "the concatenations a+b vs b+a"
      - "the numeric values of a and b"
      - "a vs b lexicographically"
      - "the lengths of a and b"
    answer: 0
    explanation: |
      To decide which of two numbers should come first, compare the two possible concatenations:
      put a before b if a+b > b+a. This custom comparator (plus a leading-zero edge case) yields the
      largest number after concatenation.
    ref: "concepts.md#sorting-as-a-preprocessing-step-the-meta-pattern"

  - id: sorting-and-selection-019
    difficulty: intermediate
    tags: [libraries, primitives, dual-pivot]
    question: |
      Why does Java sort primitive arrays (int[]) with dual-pivot quicksort rather than Timsort,
      even though quicksort is not stable?
    options:
      - "Timsort cannot sort integers"
      - "Stability is meaningless for primitives (equal ints are indistinguishable), so the faster
        in-place quicksort is used"
      - "Quicksort guarantees O(n log n) worst case for primitives"
      - "Primitives cannot be compared"
    answer: 1
    explanation: |
      Two equal ints are indistinguishable, so preserving their relative order has no observable
      effect — stability doesn't matter. That frees Java to use the faster, cache-friendly, in-place
      dual-pivot quicksort for primitives.
    ref: "concepts.md#what-real-libraries-actually-use-timsort--dual-pivot-quicksort"

  - id: sorting-and-selection-020
    difficulty: advanced
    tags: [build-heap, complexity, heap]
    question: |
      Building a binary heap from an unsorted array via sift-down from the last internal node up is:
    options:
      - "O(n log n), because each of n elements sifts O(log n)"
      - "O(n²) in the worst case"
      - "O(n), because most nodes are near the leaves and sift down only a little"
      - "O(log n), because only the root moves"
    answer: 2
    explanation: |
      Although a loose bound suggests O(n log n), a tighter analysis sums the heights: most nodes are
      near the bottom with tiny sift-down cost, and the series converges to O(n). (The subsequent
      heap-sort extraction phase is O(n log n).)
    ref: "concepts.md#heap-sort-in-place-on-log-n-worst-not-stable"

  - id: sorting-and-selection-021
    difficulty: intermediate
    tags: [meeting-rooms, intervals, sorting]
    question: |
      "Meeting Rooms II" asks for the minimum number of rooms for overlapping meetings. A standard
      approach sorts start times and end times separately and then:
    options:
      - "Counts inversions between the two arrays"
      - "Runs quickselect for the median meeting"
      - "Builds a trie of meeting IDs"
      - "Sweeps both pointers, incrementing rooms on a start before the next end, tracking the max"
    answer: 3
    explanation: |
      With sorted starts and ends, sweep two pointers: each start that occurs before the current
      earliest end needs a new room; otherwise a room frees up. The maximum concurrent count is the
      answer. A min-heap of end times is the equivalent alternative.
    ref: "concepts.md#sorting-as-a-preprocessing-step-the-meta-pattern"

  - id: sorting-and-selection-022
    difficulty: advanced
    tags: [count-inversions, merge-sort, divide-conquer]
    question: |
      "Count of Smaller Numbers After Self" (counting inversions) is efficiently solved by
      piggy-backing counting onto which algorithm's core step?
    options:
      - "The merge step of merge sort, counting cross-pair inversions during the merge"
      - "The partition step of quicksort"
      - "The sift-down step of heap sort"
      - "The digit passes of radix sort"
    answer: 0
    explanation: |
      During merge sort's merge, when an element from the right half is placed before remaining
      left-half elements, those constitute inversions and can be counted in O(1) each, giving an
      overall O(n log n) inversion count.
    ref: "concepts.md#merge-sort-stable-on-log-n-divide-and-conquer"

  - id: sorting-and-selection-023
    difficulty: beginner
    tags: [in-place, definitions, space]
    question: |
      Which set of algorithms is in-place (O(1) or O(log n) auxiliary space, mutating the input)?
    options:
      - "Merge sort and counting sort"
      - "Quicksort, heap sort, and insertion sort"
      - "Radix sort and bucket sort"
      - "Timsort and merge sort"
    answer: 1
    explanation: |
      Quicksort (O(log n) stack), heap sort (O(1)), and insertion sort (O(1)) mutate the input in
      place. Merge sort, counting, radix, and bucket sort all need O(n)+ auxiliary storage.
    ref: "concepts.md#two-dimensions-that-define-every-sort-stability-and-in-place"

  - id: sorting-and-selection-024
    difficulty: advanced
    tags: [introsort, cpp, fallback]
    question: |
      C++ std::sort (introsort) starts with quicksort but switches to heap sort when recursion depth
      exceeds about 2·log n. What is the purpose of that switch?
    options:
      - "To make the sort stable"
      - "To guarantee O(n log n) worst case by escaping quicksort's O(n²) degeneration"
      - "To reduce memory usage to O(1)"
      - "To enable sorting of floating-point numbers"
    answer: 1
    explanation: |
      Deep recursion signals quicksort is degenerating toward O(n²). Falling back to heap sort
      (guaranteed O(n log n), in-place) caps the worst case while keeping quicksort's speed on
      typical input. Tiny subarrays use insertion sort.
    ref: "concepts.md#what-real-libraries-actually-use-timsort--dual-pivot-quicksort"
