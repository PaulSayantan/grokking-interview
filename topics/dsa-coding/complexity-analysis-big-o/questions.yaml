topic: "Complexity Analysis & Big-O"
domain: dsa-coding
topic_slug: complexity-analysis-big-o
version: 1
questions:
  - id: complexity-analysis-big-o-001
    difficulty: beginner
    tags: [asymptotic-notation, big-o]
    question: |
      What does the Big-O notation O(f(n)) formally describe about an algorithm's cost?
    options:
      - "An exact operation count for every input"
      - "An asymptotic upper bound on growth as n increases"
      - "A tight bound that is both an upper and lower bound"
      - "The best-case running time on the smallest input"
    answer: 1
    explanation: |
      Big-O gives an asymptotic UPPER bound: T(n) = O(f(n)) means past some n0, T(n) stays
      below a constant multiple of f(n). It is not an exact count (constants/lower terms are
      dropped), not necessarily tight (that's Theta), and not tied to the best case.
    ref: "concepts.md#asymptotic-notation"

  - id: complexity-analysis-big-o-002
    difficulty: beginner
    tags: [asymptotic-notation, theta, omega]
    question: |
      Which notation gives a TIGHT bound — meaning the function grows at exactly the stated
      rate (both an upper and lower bound)?
    options:
      - "Big-O"
      - "Big-Omega"
      - "Big-Theta"
      - "Little-o"
    answer: 2
    explanation: |
      Big-Theta (Θ) is the tight bound: T(n) = Θ(f(n)) iff T(n) is both O(f(n)) and Ω(f(n)).
      Big-O is only an upper bound, Big-Omega only a lower bound. Merge sort is Θ(n log n)
      because its best and worst cases coincide.
    ref: "concepts.md#asymptotic-notation"

  - id: complexity-analysis-big-o-003
    difficulty: beginner
    tags: [simplification, constants]
    question: |
      What is the Big-O of T(n) = 3n^2 + 100n + 5000?
    options:
      - "O(3n^2)"
      - "O(n^2 + n)"
      - "O(5000)"
      - "O(n^2)"
    answer: 3
    explanation: |
      Drop constant factors (3) and lower-order terms (100n, 5000). As n grows, the n^2 term
      dominates everything else, so this is simply O(n^2).
    ref: "concepts.md#why-we-drop-constants-and-lower-order-terms"

  - id: complexity-analysis-big-o-004
    difficulty: beginner
    tags: [complexity-classes, binary-search]
    question: |
      An algorithm halves its remaining search space on every step (like binary search). What
      is its time complexity?
    options:
      - "O(1)"
      - "O(n)"
      - "O(log n)"
      - "O(n log n)"
    answer: 2
    explanation: |
      Repeatedly halving means the number of steps to reach a single element is log2(n), so the
      cost is O(log n). Each step does constant work but there are log n of them.
    ref: "concepts.md#common-complexity-classes"

  - id: complexity-analysis-big-o-005
    difficulty: intermediate
    tags: [complexity-classes, subsets]
    question: |
      Generating every subset of a set of n elements (the power set) has what time complexity,
      driven by the number of subsets produced?
    options:
      - "O(n^2)"
      - "O(n!)"
      - "O(2^n)"
      - "O(n log n)"
    answer: 2
    explanation: |
      A set of n elements has 2^n subsets, so any algorithm that enumerates them all is at
      least O(2^n) — that is inherent output size. Permutations (orderings) would be O(n!),
      which is different and larger.
    ref: "concepts.md#common-complexity-classes"

  - id: complexity-analysis-big-o-006
    difficulty: intermediate
    tags: [loops, nested-loops]
    question: |
      What is the time complexity of this loop?

        for (int i = 0; i < n; i++)
          for (int j = i + 1; j < n; j++)
            check(a[i], a[j]);
    options:
      - "O(n log n)"
      - "O(n)"
      - "O(n^2)"
      - "O(n^3)"
    answer: 2
    explanation: |
      Even though the inner loop shrinks, the total iterations are n + (n-1) + ... + 1 =
      n(n+1)/2, which is O(n^2). A triangular double loop is still quadratic.
    ref: "concepts.md#analyzing-loops-and-nested-loops"

  - id: complexity-analysis-big-o-007
    difficulty: intermediate
    tags: [loops, logarithmic]
    question: |
      What is the complexity of a loop that multiplies its index each iteration:
      for (int i = 1; i < n; i *= 2) { work(); } ?
    options:
      - "O(log n)"
      - "O(n)"
      - "O(sqrt n)"
      - "O(n log n)"
    answer: 0
    explanation: |
      The index takes values 1, 2, 4, 8, ... up to n, so the loop runs about log2(n) times.
      A loop whose counter is multiplied or divided (rather than incremented) is logarithmic.
    ref: "concepts.md#analyzing-loops-and-nested-loops"

  - id: complexity-analysis-big-o-008
    difficulty: intermediate
    tags: [hidden-costs, common-mistakes]
    question: |
      In Python/Java, what is the real complexity of building a string by repeated concatenation
      inside a loop over n characters (s = s + c each iteration on an immutable string)?
    options:
      - "O(n) because each concatenation is constant"
      - "O(log n) because the buffer length only doubles a logarithmic number of times"
      - "O(n^2) because each concatenation copies the whole string built so far"
      - "O(n log n) because each append triggers an internal rebalance of the buffer"
    answer: 2
    explanation: |
      Strings are immutable, so s = s + c allocates a new string and copies all characters built
      so far each time. Summed over n iterations that is 1+2+...+n = O(n^2). Use a StringBuilder
      / list-join to get O(n). This is a classic hidden-cost trap.
    ref: "concepts.md#analyzing-loops-and-nested-loops"

  - id: complexity-analysis-big-o-009
    difficulty: advanced
    tags: [master-theorem, recursion, merge-sort]
    question: |
      Merge sort's running time satisfies T(n) = 2T(n/2) + O(n). By the Master Theorem, what is
      T(n)?
    options:
      - "Θ(n)"
      - "Θ(n^2)"
      - "Θ(n log n)"
      - "Θ(log n)"
    answer: 2
    explanation: |
      With a=2, b=2, n^(log_b a) = n^1 = n. Since f(n) = n matches n^(log_b a), this is Master
      Theorem Case 2, giving Θ(n^(log_b a) · log n) = Θ(n log n).
    ref: "concepts.md#analyzing-recursion--the-master-theorem"

  - id: complexity-analysis-big-o-010
    difficulty: advanced
    tags: [master-theorem, binary-search, recursion]
    question: |
      Binary search's recurrence is T(n) = T(n/2) + O(1). What does the Master Theorem give?
    options:
      - "Θ(log n)"
      - "Θ(n)"
      - "Θ(1)"
      - "Θ(n log n)"
    answer: 0
    explanation: |
      Here a=1, b=2, so n^(log_2 1) = n^0 = 1. The work f(n)=O(1) matches, Case 2, giving
      Θ(1 · log n) = Θ(log n).
    ref: "concepts.md#analyzing-recursion--the-master-theorem"

  - id: complexity-analysis-big-o-011
    difficulty: intermediate
    tags: [recursion, exponential, fibonacci]
    question: |
      Why is the naive recursive Fibonacci — fib(n) = fib(n-1) + fib(n-2) — exponential, roughly
      O(2^n)?
    options:
      - "Because adding two large multi-digit integers dominates the per-call running time"
      - "Because the recursion tree recomputes the same overlapping subproblems many times"
      - "Because the O(n) recursion stack depth is what forces the exponential blowup"
      - "Because each call internally sorts its two arguments before returning their sum"
    answer: 1
    explanation: |
      The recursion tree branches into two calls at each level and the same subproblems (fib(3),
      fib(2), ...) are recomputed repeatedly, producing an exponential number of nodes. Memoizing
      the overlapping subproblems collapses it to O(n).
    ref: "concepts.md#analyzing-recursion--the-master-theorem"

  - id: complexity-analysis-big-o-012
    difficulty: advanced
    tags: [amortized, dynamic-array]
    question: |
      Appending to a dynamic array (ArrayList / Python list) that DOUBLES capacity when full is
      described as what per-append cost?
    options:
      - "O(n) worst case, so O(n) per append"
      - "O(log n) amortized"
      - "Average-case O(1) assuming random inputs"
      - "Amortized O(1)"
    answer: 3
    explanation: |
      Individual appends that trigger a resize cost O(n) to copy, but doublings are rare: total
      copy work to reach size n is 1+2+4+...+n ≈ 2n = O(n) over n appends, i.e. amortized O(1)
      each. It is amortized (a guarantee over the sequence), not probabilistic average-case.
    ref: "concepts.md#amortized-analysis"

  - id: complexity-analysis-big-o-013
    difficulty: advanced
    tags: [amortized, growth-factor]
    question: |
      If a dynamic array grew by a CONSTANT amount (e.g. +1 slot) on each resize instead of
      doubling, what would the amortized cost per append become?
    options:
      - "Still amortized O(1)"
      - "Amortized O(log n)"
      - "Amortized O(n)"
      - "Amortized O(n^2)"
    answer: 2
    explanation: |
      Constant growth forces a resize almost every append, and each resize copies O(n) elements,
      giving total work 1+2+...+n = O(n^2) over n appends, i.e. amortized O(n) per append.
      Geometric (doubling) growth is what makes append amortized O(1).
    ref: "concepts.md#amortized-analysis"

  - id: complexity-analysis-big-o-014
    difficulty: advanced
    tags: [amortized, vs-average]
    question: |
      What distinguishes an "amortized O(1)" guarantee from an "average-case O(1)" guarantee?
    options:
      - "They are identical terms that both average an operation's cost over a random input distribution"
      - "Amortized holds for any sequence of operations with no probability assumption; average-case assumes a distribution of inputs"
      - "Average-case is a stronger worst-case guarantee than amortized because it also bounds the single most expensive operation"
      - "Amortized applies only to space consumption, whereas average-case applies only to running time"
    answer: 1
    explanation: |
      Amortized cost averages over a sequence of operations and holds for ANY such sequence (no
      randomness) — e.g. dynamic-array append. Average-case assumes inputs are drawn from some
      distribution (e.g. random keys for a hashmap) and an adversary can defeat it.
    ref: "concepts.md#amortized-analysis"

  - id: complexity-analysis-big-o-015
    difficulty: intermediate
    tags: [space, recursion-stack]
    question: |
      A recursive DFS on a tree allocates no heap data but recurses to depth equal to the tree
      height h. What is its auxiliary SPACE complexity?
    options:
      - "O(1) because it stores nothing on the heap and reuses a single stack frame"
      - "O(n) always, since every node visited is retained on the stack simultaneously"
      - "O(log n) always, because a DFS descends a logarithmic number of levels"
      - "O(h) for the recursion call stack"
    answer: 3
    explanation: |
      Each recursive call frame occupies the call stack, so recursion d levels deep uses O(d)
      stack space. For a tree of height h that is O(h): O(n) for a skewed tree, O(log n) for a
      balanced one. Stack space counts even when nothing is heap-allocated.
    ref: "concepts.md#time-vs-space-complexity"

  - id: complexity-analysis-big-o-016
    difficulty: intermediate
    tags: [space, in-place]
    question: |
      What does it mean for an algorithm to be "in-place"?
    options:
      - "It runs in O(1) constant time regardless of the input size"
      - "It uses O(1) auxiliary space, modifying the input directly"
      - "It never uses the call stack because it must be written purely iteratively"
      - "It produces no separate output and returns only a status code"
    answer: 1
    explanation: |
      In-place means constant auxiliary (extra) space — the input is modified directly rather
      than copied. Note a recursive in-place algorithm can still use O(log n) or O(n) stack
      space; "in-place" refers to heap/data allocation, not necessarily the call stack.
    ref: "concepts.md#time-vs-space-complexity"

  - id: complexity-analysis-big-o-017
    difficulty: intermediate
    tags: [worst-case, quicksort, hashmap]
    question: |
      Quicksort is commonly called an O(n log n) sort, yet interviewers say it is O(n^2). Which
      statement is correct?
    options:
      - "It is O(n log n) worst case and O(n^2) best case"
      - "It is O(n log n) on average but O(n^2) in the worst case"
      - "It is always exactly O(n log n)"
      - "It is O(n^2) on average and O(n log n) worst case"
    answer: 1
    explanation: |
      Quicksort is Θ(n log n) on average, but a bad pivot sequence (e.g. already-sorted input
      with a naive pivot) degrades partitioning to O(n^2) worst case. The 'case' (which input)
      and the notation are independent axes.
    ref: "concepts.md#best-average-and-worst-case"

  - id: complexity-analysis-big-o-018
    difficulty: intermediate
    tags: [hashmap, worst-case]
    question: |
      What is the WORST-CASE time of a HashMap lookup?
    options:
      - "O(n) when many keys collide into one bucket"
      - "O(1) because the hash guarantees no two keys ever collide"
      - "O(log n) because buckets are always kept as balanced trees"
      - "O(n log n) from rehashing the whole table on each lookup"
    answer: 0
    explanation: |
      Average-case lookup is O(1) with a good hash distribution, but if all keys collide into the
      same bucket the lookup degrades to scanning a chain of n entries — O(n). (Java 8+ tree-ifies
      long buckets to O(log n), but the classic worst case is O(n).)
    ref: "concepts.md#best-average-and-worst-case"

  - id: complexity-analysis-big-o-019
    difficulty: intermediate
    tags: [log-bases, simplification]
    question: |
      Why do we write O(log n) without specifying whether the log is base 2, base 10, or natural?
    options:
      - "Because logarithms in algorithms are always taken in base 2, so the base is already fixed"
      - "Because changing the base only multiplies by a constant factor, which Big-O drops"
      - "Because the logarithm's base has no effect on the actual runtime measured on real hardware"
      - "Because log n and n grow at asymptotically the same rate, so the base is irrelevant"
    answer: 1
    explanation: |
      log_b n = log_c n / log_c b, so different bases differ only by the constant factor
      1/log_c b. Big-O drops constant factors, so all logarithms collapse to O(log n). (The base
      does matter inside the log_b a exponent of the Master Theorem, however.)
    ref: "concepts.md#log-bases-and-other-simplifications"

  - id: complexity-analysis-big-o-020
    difficulty: advanced
    tags: [graphs, variables, common-mistakes]
    question: |
      Why is BFS/DFS on a graph stated as O(V + E) rather than collapsed to O(n)?
    options:
      - "Because V and E always grow at exactly the same rate, so one term is redundant and can be dropped"
      - "Because the number of edges E is always negligible compared to the number of vertices V"
      - "Because vertices and edges scale independently; collapsing hides that a dense graph has E = O(V^2)"
      - "Because O(V + E) is merely a stylistic convention with no real meaning beyond O(n) notation"
    answer: 2
    explanation: |
      Vertices (V) and edges (E) are independent size parameters. A sparse graph has E ≈ V while
      a dense one has E ≈ V^2, so O(V + E) captures behavior that O(n) would obscure. Never
      collapse genuinely independent variables in a complexity statement.
    ref: "concepts.md#log-bases-and-other-simplifications"

  - id: complexity-analysis-big-o-021
    difficulty: beginner
    tags: [common-mistakes, sequential]
    question: |
      An algorithm does an O(n) scan followed by (separately, not nested) an O(n^2) pass. What is
      the overall complexity?
    options:
      - "O(n^3)"
      - "O(n^2 + n) which must be written out"
      - "O(n)"
      - "O(n^2)"
    answer: 3
    explanation: |
      Sequential (non-nested) blocks ADD, and you keep the dominant term: O(n) + O(n^2) = O(n^2).
      You only MULTIPLY complexities when one loop is nested inside another.
    ref: "concepts.md#common-mistakes"

  - id: complexity-analysis-big-o-022
    difficulty: advanced
    tags: [comparison-sort, lower-bound, omega]
    question: |
      Why is any comparison-based sorting algorithm bounded below by Ω(n log n)?
    options:
      - "Because each individual element comparison inherently takes Θ(log n) time to resolve on n-bit keys"
      - "Because a binary decision tree distinguishing all n! orderings must have height at least log2(n!) = Ω(n log n)"
      - "Because any correct sorting algorithm must always allocate at least O(n) additional scratch space"
      - "Because merge sort has been mathematically proven to be the single fastest sorting algorithm possible"
    answer: 1
    explanation: |
      There are n! possible orderings of the input. A comparison sort is a binary decision tree;
      a tree of height h has at most 2^h leaves, so 2^h ≥ n! forces h ≥ log2(n!) = Ω(n log n) by
      Stirling. That is why comparison sorts cannot beat n log n in the worst case.
    ref: "concepts.md#log-bases-and-other-simplifications"

  - id: complexity-analysis-big-o-023
    difficulty: intermediate
    tags: [pattern-choice, sort-in-loop, common-mistakes]
    question: |
      You must answer q queries, and your code calls sort(data) of size n inside the per-query
      loop. What is the total complexity, and what is the fix?
    options:
      - "O(q + n log n); the query loop and the sort simply add, so no fix is needed"
      - "O(q · n log n); sort once outside the loop when the data does not change"
      - "O(n log n); the per-query loop contributes nothing since sorting dominates it"
      - "O(q · n); sorting a list is a linear-time operation done once per query"
    answer: 1
    explanation: |
      Sorting inside the loop costs n log n per query for q queries = O(q · n log n). If the data
      is not modified between queries, sort once before the loop (O(n log n)) and reuse it. This
      'sort inside a loop' mistake is a very common hidden cost.
    ref: "concepts.md#common-mistakes"

  - id: complexity-analysis-big-o-024
    difficulty: intermediate
    tags: [constraints, pattern-choice]
    question: |
      A problem states n ≤ 20. What complexity is the constraint most likely hinting the intended
      solution can afford?
    options:
      - "Only O(n) linear time will pass here; anything slower will certainly time out"
      - "An exponential / bitmask approach like O(2^n) is acceptable"
      - "O(log n) logarithmic time is strictly required for this constraint"
      - "O(n!) factorial time for n=20 is easily fast enough to pass"
    answer: 1
    explanation: |
      Tiny constraints like n ≤ 20 signal that exponential solutions (2^20 ≈ 10^6) are feasible,
      hinting at subset/bitmask DP or brute-force search. n! at 20 (~2.4·10^18) is far too large,
      so factorial is not viable — the 2^n reading is the intended one.
    ref: "concepts.md#common-complexity-classes"
