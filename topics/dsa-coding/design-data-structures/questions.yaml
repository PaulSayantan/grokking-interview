topic: "Design Data Structures (LRU, LFU, etc.)"
domain: dsa-coding
topic_slug: design-data-structures
version: 1
questions:
  - id: design-data-structures-001
    difficulty: beginner
    tags: [lru, composition, complexity]
    question: |
      An LRU cache must support `get` and `put` in O(1). Which pair of structures is the
      canonical backing choice?
    options:
      - "A single hash map"
      - "A single doubly linked list"
      - "A hash map plus a doubly linked list"
      - "A balanced BST plus a hash map"
    answer: 2
    explanation: |
      A hash map alone gives O(1) lookup but no recency order (can't find the victim); a list
      alone gives O(1) reorder but O(n) lookup. Combining a hash map (key→node) with a doubly
      linked list (recency order) lets each cover the other's weakness → O(1) get and put.
    ref: "concepts.md#lru-cache-hash-map--doubly-linked-list-the-canonical-design"

  - id: design-data-structures-002
    difficulty: beginner
    tags: [method, design-approach]
    question: |
      What is the recommended first step when tackling a "design/implement a data structure"
      interview problem?
    options:
      - "List each required operation and its target complexity, then pick structures to meet each"
      - "Immediately start coding a hash map"
      - "Pick the most advanced data structure you know"
      - "Sort the input to simplify the problem"
    answer: 0
    explanation: |
      The method: write down the API and each op's target complexity (O(1)? O(log n)?), then
      choose a backing structure that delivers each op's complexity, combining structures when
      no single one hits every target. Complexity targets drive the structure choice.
    ref: "concepts.md#the-method-list-ops-set-target-complexity-pick-backing-structures"

  - id: design-data-structures-003
    difficulty: intermediate
    tags: [lru, linked-list, internals]
    question: |
      Why does an LRU cache use a *doubly* linked list rather than a singly linked list?
    options:
      - "Doubly linked lists use less memory"
      - "Singly linked lists cannot store values"
      - "To remove a known node in O(1) you need its predecessor pointer (`prev`)"
      - "Doubly linked lists allow O(1) random access by index"
    answer: 2
    explanation: |
      Removing an arbitrary node in O(1) requires splicing it out, which needs both neighbors.
      A singly linked list only has `next`, so you'd have to scan from the head (O(n)) to find
      the predecessor. The `prev` pointer of a doubly linked list makes unlink O(1).
    ref: "concepts.md#lru-cache-hash-map--doubly-linked-list-the-canonical-design"

  - id: design-data-structures-004
    difficulty: intermediate
    tags: [lru, map, internals]
    question: |
      In the LRU cache, what should the hash map store as its value?
    options:
      - "The cached value only"
      - "The index of the value in an array"
      - "A copy of the whole list"
      - "The reference to the linked-list node"
    answer: 3
    explanation: |
      The map must store the *node reference*, so that on access you can splice that node out
      of the list and move it to the front in O(1) without searching. Storing only the value
      would force an O(n) scan of the list to locate the node to reorder.
    ref: "concepts.md#lru-cache-hash-map--doubly-linked-list-the-canonical-design"

  - id: design-data-structures-005
    difficulty: intermediate
    tags: [lru, eviction, gotcha]
    question: |
      When an LRU cache evicts the least-recently-used entry, what must happen?
    options:
      - "Remove it from the linked list only"
      - "Remove it from the hash map only"
      - "Remove it from BOTH the linked list and the hash map"
      - "Move it to the front of the list"
    answer: 2
    explanation: |
      Eviction must touch every structure. Removing the tail node from the list but leaving its
      key in the map leaks memory and can return a stale/invalid node later. The classic bug is
      forgetting `map.remove(lru.key)`.
    ref: "concepts.md#lru-cache-hash-map--doubly-linked-list-the-canonical-design"

  - id: design-data-structures-006
    difficulty: intermediate
    tags: [lru, recency, position]
    question: |
      In the usual LRU design where the list front is most-recently-used, where does the
      least-recently-used (eviction candidate) entry live?
    options:
      - "At the front, right after the head sentinel"
      - "At the back, right before the tail sentinel"
      - "In the middle of the list"
      - "Anywhere; it must be searched for"
    answer: 1
    explanation: |
      Front = most recently used, back = least recently used. On access a node moves to the
      front, so the node just before the tail sentinel is the LRU victim, reachable in O(1) via
      `tail.prev`.
    ref: "concepts.md#lru-cache-hash-map--doubly-linked-list-the-canonical-design"

  - id: design-data-structures-007
    difficulty: advanced
    tags: [lfu, buckets, tie-break]
    question: |
      An LFU cache evicts the least-frequently-used entry, breaking ties by least-recently-used.
      What structure inside each frequency bucket enables the recency tie-break?
    options:
      - "An unordered hash set"
      - "An ordered (LRU-style) doubly linked list of nodes at that frequency"
      - "A max-heap keyed by frequency"
      - "A sorted array re-sorted on every access"
    answer: 1
    explanation: |
      Each frequency bucket is itself an ordered doubly linked list (front = most recent), so
      among all nodes sharing the minimum frequency you can evict the least-recently-used one in
      O(1). A plain set gives no recency order.
    ref: "concepts.md#lfu-cache-hash-map--frequency-buckets"

  - id: design-data-structures-008
    difficulty: advanced
    tags: [lfu, minfreq, complexity]
    question: |
      How does an O(1) LFU cache find the minimum frequency to evict from, without scanning?
    options:
      - "It recomputes the minimum by iterating all buckets each time — O(n)"
      - "It uses a min-heap of all keys"
      - "It sorts the buckets on each eviction"
      - "It maintains a `minFreq` variable incrementally as nodes move between buckets"
    answer: 3
    explanation: |
      A `minFreq` variable is updated incrementally: a new key sets `minFreq = 1`; when the
      `minFreq` bucket becomes empty after an access-driven promotion, `minFreq++`. Scanning all
      buckets would break the O(1) guarantee.
    ref: "concepts.md#lfu-cache-hash-map--frequency-buckets"

  - id: design-data-structures-009
    difficulty: intermediate
    tags: [getrandom, array, delete]
    question: |
      RandomizedSet needs `insert`, `remove`, and `getRandom` all in average O(1). How is O(1)
      deletion from the backing array achieved?
    options:
      - "Shift all elements after the removed one left by one"
      - "Mark it deleted with a tombstone and skip it later"
      - "Swap the element to delete with the last element, then pop the last"
      - "Rebuild the array without the element"
    answer: 2
    explanation: |
      Shifting is O(n). Instead, overwrite the hole with the last element, update that moved
      element's index in the val→index map, then `pop_back`. Ordering is destroyed but that is
      irrelevant for a set. This makes remove O(1).
    ref: "concepts.md#insert--delete--getrandom-in-o1-array--hash-map-of-index"

  - id: design-data-structures-010
    difficulty: intermediate
    tags: [getrandom, array, why-array]
    question: |
      Why must `getRandom` (uniform random element) be backed by an array rather than a hash
      set?
    options:
      - "Hash sets cannot store integers"
      - "Arrays automatically deduplicate"
      - "Hash sets are always slower for insertion"
      - "An array supports O(1) uniform random access by index; a hash set has no indexable positions"
    answer: 3
    explanation: |
      `getRandom` picks a uniform index in [0, size). An array gives O(1) indexed access, so
      `arr[rand(0, size-1)]` is uniform and constant time. A hash set has no ordered, contiguous
      positions to index into.
    ref: "concepts.md#insert--delete--getrandom-in-o1-array--hash-map-of-index"

  - id: design-data-structures-011
    difficulty: beginner
    tags: [min-stack, auxiliary, complexity]
    question: |
      A MinStack must return the minimum in O(1). What technique achieves this?
    options:
      - "Keep an auxiliary stack that records the running minimum in lockstep"
      - "Scan the stack for the minimum on each `getMin` call"
      - "Sort the stack after every push"
      - "Store elements in a min-heap instead of a stack"
    answer: 0
    explanation: |
      Push `min(x, currentMin)` onto a second stack alongside each element and pop both together.
      `getMin` reads the aux stack's top in O(1). Scanning would be O(n); a heap would break the
      LIFO stack semantics.
    ref: "concepts.md#min-stack-an-auxiliary-stack-for-the-running-minimum"

  - id: design-data-structures-012
    difficulty: advanced
    tags: [median, two-heaps, pattern]
    question: |
      To find the running median of a data stream with O(log n) insert and O(1) query, which
      structure combination fits?
    options:
      - "A single max-heap"
      - "A sorted array with binary-search insertion"
      - "A max-heap for the smaller half and a min-heap for the larger half, kept balanced"
      - "A hash map of value counts"
    answer: 2
    explanation: |
      Two heaps split the data at the median: a max-heap holds the smaller half (its top is near
      the median) and a min-heap holds the larger half. Kept within one element of each other, the
      median is a heap top (or the average of both tops). Add is O(log n), query O(1).
    ref: "concepts.md#median-from-a-data-stream-two-heaps"

  - id: design-data-structures-013
    difficulty: intermediate
    tags: [time-based-store, binary-search, pattern]
    question: |
      A Time-Based Key-Value store's `get(key, timestamp)` returns the value with the largest
      timestamp ≤ the query. If values are stored per key in increasing timestamp order, what is
      the efficient lookup?
    options:
      - "Linear scan from the newest entry — O(n)"
      - "Hash the timestamp for O(1) lookup"
      - "A DFS over a trie of timestamps"
      - "Binary search on the timestamp list — O(log n)"
    answer: 3
    explanation: |
      Because entries per key are appended in increasing timestamp order, the list is sorted, so
      a binary search finds the rightmost timestamp ≤ the query in O(log n). Hashing an exact
      timestamp fails when the query time isn't a stored one.
    ref: "concepts.md#design-twitter-time-based-store-hit-counter-snapshot-circular-buffer"

  - id: design-data-structures-014
    difficulty: advanced
    tags: [two-stacks, queue, amortized]
    question: |
      Implementing a queue with two stacks (an `in` stack and an `out` stack) gives what
      complexity for dequeue?
    options:
      - "Worst-case O(1) for every dequeue"
      - "Always O(n)"
      - "Amortized O(1), though a single dequeue can be O(n) when pouring `in` into `out`"
      - "O(log n)"
    answer: 2
    explanation: |
      Most dequeues pop `out` in O(1); occasionally `out` is empty and you pour the whole `in`
      stack over (O(n)), but each element is moved at most twice total, giving amortized O(1).
      Claiming worst-case O(1) is wrong.
    ref: "concepts.md#design-twitter-time-based-store-hit-counter-snapshot-circular-buffer"

  - id: design-data-structures-015
    difficulty: advanced
    tags: [design-twitter, heap, k-way-merge]
    question: |
      In Design Twitter, `getNewsFeed` returns the 10 most recent tweets across everyone a user
      follows. Which technique efficiently merges the followees' tweet streams?
    options:
      - "Concatenate all tweets and fully sort them"
      - "A trie keyed by user id"
      - "A heap-based k-way merge of each followee's latest tweets by timestamp"
      - "Union-find over the follow graph"
    answer: 2
    explanation: |
      Each user's tweets are stored newest-last with a global timestamp. A max-heap seeded with
      each followee's most recent tweet lets you pop the 10 newest via k-way merge, without
      sorting every tweet from every followee.
    ref: "concepts.md#design-twitter-time-based-store-hit-counter-snapshot-circular-buffer"

  - id: design-data-structures-016
    difficulty: intermediate
    tags: [hit-counter, circular-buffer, ring]
    question: |
      A Design Hit Counter tracks hits in the trailing 300 seconds with bounded memory. Which
      backing structure achieves O(1) fixed-memory buckets?
    options:
      - "An ever-growing list of all hit timestamps"
      - "A balanced BST of timestamps"
      - "A trie of timestamp digits"
      - "A circular buffer of 300 buckets indexed by `timestamp % 300` storing (second, count)"
    answer: 3
    explanation: |
      A ring buffer of 300 slots, each holding the second it represents and a count, uses fixed
      memory. On a hit, if the slot's stored second is stale you reset it; queries sum current
      slots. This bounds memory regardless of hit volume.
    ref: "concepts.md#design-twitter-time-based-store-hit-counter-snapshot-circular-buffer"

  - id: design-data-structures-017
    difficulty: intermediate
    tags: [trie, internals, complexity]
    question: |
      A trie stores words along paths of character-keyed nodes with an end-of-word flag. What is
      the time complexity of inserting or searching a word of length L, regardless of how many
      words the trie holds?
    options:
      - "O(1)"
      - "O(number of words stored)"
      - "O(L)"
      - "O(L log L)"
    answer: 2
    explanation: |
      You walk one node per character, so insert/search/startsWith are O(L) in the word length,
      independent of the total number of stored words — a key advantage over hashing full strings
      when you need prefix queries.
    ref: "concepts.md#trie-prefix-tree-tree-of-char-keyed-nodes--end-of-word-flag"

  - id: design-data-structures-018
    difficulty: advanced
    tags: [snapshot-array, versioning, binary-search]
    question: |
      SnapshotArray supports `snap()` and `get(index, snapId)`. How is it made efficient without
      copying the whole array on every snapshot?
    options:
      - "Deep-copy the array on each `snap()`"
      - "Keep one global hash map keyed by snapId"
      - "Use a doubly linked list of array versions"
      - "Store per index a list of (snapId, value) changes and binary-search by snapId on get"
    answer: 3
    explanation: |
      Copying the whole array each snap is O(n) per snap. Instead, record per index only the
      points where its value changed as (snapId, value), and binary-search for the largest snapId
      ≤ the query — O(log k) per get with space proportional to actual writes.
    ref: "concepts.md#design-twitter-time-based-store-hit-counter-snapshot-circular-buffer"

  - id: design-data-structures-019
    difficulty: beginner
    tags: [sentinel, linked-list, technique]
    question: |
      Why do LRU/LFU implementations commonly use dummy (sentinel) head and tail nodes in the
      doubly linked list?
    options:
      - "To store extra cache entries"
      - "To make the list singly linked"
      - "To sort the list automatically"
      - "To avoid null-pointer edge cases when inserting/removing at the boundaries"
    answer: 3
    explanation: |
      Sentinel head/tail nodes mean every real node always has non-null `prev` and `next`, so
      insert-at-front and remove-at-back need no special-casing for an empty list or the ends —
      simpler, less bug-prone splicing code.
    ref: "concepts.md#lru-cache-hash-map--doubly-linked-list-the-canonical-design"

  - id: design-data-structures-020
    difficulty: advanced
    tags: [lru, real-world, follow-up]
    question: |
      Production caches like Caffeine often use *approximate* LRU/LFU (e.g., sampling or a
      count-min sketch in TinyLFU) instead of exact per-access bookkeeping. Why?
    options:
      - "Approximate eviction is always more accurate"
      - "Hash maps cannot be made thread-safe"
      - "Approximation reduces the hit rate on purpose"
      - "Exact LRU's per-access list bookkeeping causes lock contention and overhead at scale"
    answer: 3
    explanation: |
      Exact LRU moves a node on every read, creating a hot, contended write path (and locking) in
      concurrent settings. Sampling / frequency-sketch approaches approximate the eviction decision
      with far less per-access mutation, trading a little accuracy for scalability.
    ref: "concepts.md#common-gotchas"

  - id: design-data-structures-021
    difficulty: intermediate
    tags: [lru-vs-lfu, policy, trade-off]
    question: |
      Which statement best contrasts LRU and LFU eviction?
    options:
      - "LRU always outperforms LFU"
      - "LRU adapts quickly to changing working sets but is fooled by one-off scans; LFU keeps genuinely hot items but can retain stale once-popular keys"
      - "LFU never needs tie-breaking"
      - "LRU and LFU evict identical entries in all cases"
    answer: 1
    explanation: |
      LRU tracks recency, so a large sequential scan can evict hot data; LFU tracks frequency, so
      it protects truly hot keys but can cling to items that were popular long ago unless it ages
      counts. Neither dominates — the right choice depends on the access pattern.
    ref: "concepts.md#common-gotchas"

  - id: design-data-structures-022
    difficulty: beginner
    tags: [design-hashset, composition]
    question: |
      How is a HashSet typically implemented in terms of a HashMap?
    options:
      - "A HashMap where each key maps to a dummy/placeholder value"
      - "A sorted array of keys"
      - "A linked list of buckets with no hashing"
      - "A heap keyed by hash code"
    answer: 0
    explanation: |
      A HashSet is a thin wrapper over a HashMap: the set elements are the map's keys and every
      key maps to the same dummy value (e.g., a shared PRESENT object). All the bucket/hash/
      collision machinery is reused from the map.
    ref: "concepts.md#the-method-list-ops-set-target-complexity-pick-backing-structures"
