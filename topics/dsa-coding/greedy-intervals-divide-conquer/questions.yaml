topic: "Greedy, Intervals & Divide-and-Conquer"
domain: dsa-coding
topic_slug: greedy-intervals-divide-conquer
version: 1

questions:
  - id: greedy-intervals-divide-conquer-001
    difficulty: beginner
    tags: [greedy, definition, properties]
    question: |
      A greedy algorithm is guaranteed correct only when the problem has optimal
      substructure AND which additional property?
    options:
      - "The greedy-choice property"
      - "Overlapping subproblems"
      - "A polynomial-size state space"
      - "A monotone cost function"
    answer: 0
    explanation: |
      DP needs optimal substructure + overlapping subproblems. Greedy needs optimal
      substructure + the greedy-choice property: a globally optimal solution is
      reachable by committing to a locally optimal choice that never has to be undone.
    ref: "concepts.md#greedy-the-greedy-choice-property-and-optimal-substructure"

  - id: greedy-intervals-divide-conquer-002
    difficulty: intermediate
    tags: [greedy, proof, exchange-argument]
    question: |
      Which proof technique is the standard way to show a greedy choice yields an
      optimal solution?
    options:
      - "Proof by contradiction on the recurrence depth"
      - "Induction on the number of distinct elements"
      - "The pigeonhole principle"
      - "The exchange argument (transform any optimal solution into the greedy one without making it worse)"
    answer: 3
    explanation: |
      The exchange argument ("greedy stays ahead") takes an arbitrary optimal solution
      and swaps its choices for greedy choices one at a time, showing each swap never
      degrades the objective — so the greedy solution is at least as good, hence optimal.
    ref: "concepts.md#proving-greedy-correct-the-exchange-argument"

  - id: greedy-intervals-divide-conquer-003
    difficulty: intermediate
    tags: [intervals, activity-selection, sort-key]
    question: |
      To select the maximum number of mutually non-overlapping intervals (activity
      selection), you should sort the intervals by which key?
    options:
      - "Start time, ascending"
      - "Interval length, ascending"
      - "End (finish) time, ascending"
      - "Start time, descending"
    answer: 2
    explanation: |
      Sort by earliest finish time. The interval that finishes first leaves the most
      room for the rest, and the exchange argument proves it is always part of an
      optimal selection. Sorting by start or by length can be provably suboptimal.
    ref: "concepts.md#interval-pattern-sort-then-sweep"

  - id: greedy-intervals-divide-conquer-004
    difficulty: intermediate
    tags: [intervals, merge, sort-key]
    question: |
      For the Merge Intervals problem (combine all overlapping intervals), what is the
      standard first step?
    options:
      - "Sort intervals by start time"
      - "Sort intervals by end time"
      - "Build a min-heap of all endpoints"
      - "Sort by interval length"
    answer: 0
    explanation: |
      Sort by start time so overlapping intervals become adjacent. Then sweep, extending
      the current merged interval's end whenever the next start is <= current end. Overall
      O(n log n) dominated by the sort.
    ref: "concepts.md#interval-pattern-sort-then-sweep"

  - id: greedy-intervals-divide-conquer-005
    difficulty: intermediate
    tags: [intervals, meeting-rooms, heap]
    question: |
      Meeting Rooms II asks for the minimum number of rooms to hold all meetings. Which
      approach solves it in O(n log n)?
    options:
      - "Sort by start, then binary search each meeting"
      - "Sort by length and count distinct lengths"
      - "A min-heap of end times: reuse the earliest-freeing room when possible, else allocate a new one"
      - "Union-Find over overlapping meetings"
    answer: 2
    explanation: |
      The answer equals the peak number of concurrently overlapping meetings. Sort by
      start; keep a min-heap of end times. If the earliest-ending room frees before the
      current start, reuse it; otherwise add a room. Heap size peak = rooms needed. A
      sweep-line (+1 start, -1 end) is an equivalent O(n log n) alternative.
    ref: "concepts.md#interval-pattern-sort-then-sweep"

  - id: greedy-intervals-divide-conquer-006
    difficulty: advanced
    tags: [greedy, dp, coin-change]
    question: |
      With coin denominations {1, 3, 4} and target 6, greedy (always take the largest
      coin <= remaining) returns 3 coins (4+1+1) but the optimum is 2 coins (3+3). What
      does this demonstrate?
    options:
      - "Greedy is wrong because the coins are not sorted"
      - "The problem has no optimal substructure"
      - "Greedy needs a tie-breaking rule to be correct"
      - "The greedy-choice property fails, so this coin system needs DP"
    answer: 3
    explanation: |
      General coin change lacks the greedy-choice property: taking the largest coin is
      not always part of an optimal solution. It still has optimal substructure, so DP
      (min coins over subtargets) is correct. Canonical systems like US coins happen to
      be greedy-safe, but arbitrary systems are not.
    ref: "concepts.md#greedy-vs-dynamic-programming-when-greedy-fails"

  - id: greedy-intervals-divide-conquer-007
    difficulty: advanced
    tags: [greedy, knapsack, dp]
    question: |
      Which statement about the knapsack family is correct?
    options:
      - "Both 0/1 and fractional knapsack are optimally solved by greedy on value/weight ratio"
      - "0/1 knapsack is greedy-solvable but fractional knapsack needs DP"
      - "Neither can be solved by greedy or DP in polynomial time"
      - "Fractional knapsack is greedy-solvable (highest value/weight ratio first); 0/1 knapsack is not and needs DP"
    answer: 3
    explanation: |
      Fractional knapsack has the greedy-choice property: take items by descending
      value/weight ratio, splitting the last one. 0/1 knapsack does not (you cannot split
      items), so a greedy ratio approach can be suboptimal — it requires DP over capacity.
    ref: "concepts.md#greedy-vs-dynamic-programming-when-greedy-fails"

  - id: greedy-intervals-divide-conquer-008
    difficulty: beginner
    tags: [divide-and-conquer, definition]
    question: |
      Which three phases characterize a divide-and-conquer algorithm?
    options:
      - "Hash, probe, resize"
      - "Scan, sort, dedupe"
      - "Divide, conquer (recurse), combine"
      - "Push, pop, peek"
    answer: 2
    explanation: |
      D&C divides the input into independent subproblems, conquers each recursively, and
      combines the sub-results into the full answer. Merge sort, binary search, and
      quickselect all follow this template.
    ref: "concepts.md#divide-and-conquer-split-solve-combine"

  - id: greedy-intervals-divide-conquer-009
    difficulty: intermediate
    tags: [divide-and-conquer, merge-sort, recurrence]
    question: |
      Merge sort's running time is described by T(n) = 2T(n/2) + O(n). What is its
      asymptotic complexity?
    options:
      - "Θ(n)"
      - "Θ(n log n)"
      - "Θ(n²)"
      - "Θ(log n)"
    answer: 1
    explanation: |
      Here a=2, b=2 so n^(log_b a) = n^1 = n, which matches f(n)=O(n) — Master Theorem
      Case 2, giving Θ(n log n). Intuitively: log n levels of recursion, O(n) merge work
      per level.
    ref: "concepts.md#divide-and-conquer-split-solve-combine"

  - id: greedy-intervals-divide-conquer-010
    difficulty: advanced
    tags: [divide-and-conquer, quickselect, complexity]
    question: |
      Why does quickselect run in O(n) on average while quicksort runs in O(n log n)?
    options:
      - "Quickselect uses a better pivot heuristic than quicksort"
      - "Quickselect avoids partitioning entirely"
      - "Quickselect recurses into only the one partition containing rank k, giving T(n)=T(n/2)+O(n)=O(n)"
      - "Quickselect uses a heap instead of recursion"
    answer: 2
    explanation: |
      Both partition in O(n). Quicksort recurses into both halves (2T(n/2)+O(n)=O(n log n)).
      Quickselect only needs the side holding rank k, so T(n)=T(n/2)+O(n), a geometric
      series summing to O(n) average. Worst case is O(n²) with bad pivots.
    ref: "concepts.md#divide-and-conquer-split-solve-combine"

  - id: greedy-intervals-divide-conquer-011
    difficulty: intermediate
    tags: [max-subarray, kadane, divide-and-conquer]
    question: |
      Maximum Subarray can be solved by divide-and-conquer in O(n log n). What is the
      preferred interview solution and its complexity?
    options:
      - "The D&C crossing-sum method at O(n log n)"
      - "Sort the array then take a prefix, O(n log n)"
      - "A min-heap of prefix sums at O(n log n)"
      - "Kadane's algorithm (running max) at O(n) time, O(1) space"
    answer: 3
    explanation: |
      D&C splits into left, right, and crossing-midpoint subarrays for O(n log n). But
      Kadane's DP/greedy scan — curr = max(x, curr+x), tracking the best — is O(n) time,
      O(1) space and is the expected answer. Mention D&C to show breadth, then code Kadane.
    ref: "concepts.md#divide-and-conquer-split-solve-combine"

  - id: greedy-intervals-divide-conquer-012
    difficulty: advanced
    tags: [majority-element, boyer-moore]
    question: |
      The Majority Element problem (an element appearing more than n/2 times) has an
      O(n) time, O(1) space solution. Which algorithm is it?
    options:
      - "Boyer–Moore voting (candidate + count, swap when count hits 0)"
      - "Divide-and-conquer counting per half"
      - "Sorting and taking the middle element"
      - "A hash map of frequencies"
    answer: 0
    explanation: |
      Boyer–Moore voting keeps a candidate and a counter: increment on a match, decrement
      otherwise, replace the candidate when count reaches 0. Because the majority exceeds
      n/2, it survives. O(n)/O(1). Sorting-and-middle is O(n log n); hashing is O(n) space;
      D&C is O(n log n).
    ref: "concepts.md#divide-and-conquer-split-solve-combine"

  - id: greedy-intervals-divide-conquer-013
    difficulty: intermediate
    tags: [greedy, jump-game, pattern-choice]
    question: |
      Jump Game I asks whether you can reach the last index (nums[i] = max jump length
      from i). What is the O(n) greedy approach?
    options:
      - "DP over every (index, remaining jump) state"
      - "BFS over all index pairs"
      - "Sort the indices by jump length and take the largest"
      - "Track the farthest reachable index; if the current index ever exceeds it, return false"
    answer: 3
    explanation: |
      Sweep left to right maintaining farthest = max(farthest, i + nums[i]). If i ever
      surpasses farthest you are stuck. Otherwise you reach the end. O(n) time, O(1) space
      — no DP table needed.
    ref: "concepts.md#worked-example-jump-game-i-and-ii-greedy"

  - id: greedy-intervals-divide-conquer-014
    difficulty: advanced
    tags: [greedy, jump-game-ii, bfs]
    question: |
      Jump Game II (minimum jumps to reach the end) uses a greedy BFS-by-levels. When do
      you increment the jump counter?
    options:
      - "Every time nums[i] is greater than 1"
      - "When the current index reaches the end of the current jump's reach (curEnd), then set curEnd = farthest"
      - "Once per element unconditionally"
      - "Only when farthest stops increasing"
    answer: 1
    explanation: |
      Track curEnd (end of the current jump's range) and farthest (best reachable so far).
      When i == curEnd you have exhausted the current level, so jumps++ and curEnd =
      farthest. This is a level-order BFS on the implicit reachability graph, O(n).
    ref: "concepts.md#worked-example-jump-game-i-and-ii-greedy"

  - id: greedy-intervals-divide-conquer-015
    difficulty: intermediate
    tags: [greedy, partition-labels, pattern-choice]
    question: |
      Partition Labels asks you to split a string into the fewest parts so each letter
      appears in only one part. What greedy quantity drives the solution?
    options:
      - "The frequency of each character"
      - "The alphabetical order of characters"
      - "The last-occurrence index of each character; extend the current part's end to cover it"
      - "A running hash of the seen substring"
    answer: 2
    explanation: |
      Precompute each character's last index. Sweep, extending the current partition end
      to max(end, last[c]). When i reaches end, cut a partition. Greedy on last-occurrence
      guarantees minimal, valid parts in O(n).
    ref: "concepts.md#interval-pattern-sort-then-sweep"

  - id: greedy-intervals-divide-conquer-016
    difficulty: advanced
    tags: [greedy, gas-station, single-pass]
    question: |
      In Gas Station, if the total gas is at least the total cost, a valid start exists.
      The O(n) greedy trick is to reset the candidate start index when what happens?
    options:
      - "When gas[i] < cost[i] for any single station"
      - "When you have visited half the stations"
      - "When the running tank total goes negative — set start to i+1 and reset the tank"
      - "When the tank exceeds the total cost"
    answer: 2
    explanation: |
      Keep a running tank sum. If it dips below 0 at station i, no start in [start..i] can
      work, so set start = i+1 and reset the running tank. A separate total check confirms
      feasibility. Single pass, O(n).
    ref: "concepts.md#greedy-vs-dynamic-programming-when-greedy-fails"

  - id: greedy-intervals-divide-conquer-017
    difficulty: intermediate
    tags: [intervals, non-overlapping, sort-key]
    question: |
      Non-overlapping Intervals asks for the minimum number of intervals to remove so the
      rest don't overlap. The optimal greedy sorts by end time and does what?
    options:
      - "Removes the longest interval repeatedly"
      - "Merges all overlapping intervals first"
      - "Uses a max-heap of start times"
      - "Keeps an interval whenever its start >= the last kept interval's end; otherwise counts a removal"
    answer: 3
    explanation: |
      This is activity selection: sort by end, greedily keep intervals that start at or
      after the last kept end. Every skipped interval is a removal. Earliest-finish
      maximizes kept intervals, minimizing removals. O(n log n).
    ref: "concepts.md#interval-pattern-sort-then-sweep"

  - id: greedy-intervals-divide-conquer-018
    difficulty: beginner
    tags: [intervals, overlap-test]
    question: |
      Given two intervals sorted so that a1 <= b1, which condition means they overlap
      (treating a shared endpoint as non-overlapping)?
    options:
      - "b1 < a2"
      - "b1 > a2"
      - "a1 == b1"
      - "a2 == b2"
    answer: 0
    explanation: |
      With a1 <= b1, the second interval starts at b1; they overlap iff b1 falls before
      a1's end, i.e. b1 < a2. If touching endpoints count as overlap, use b1 <= a2.
    ref: "concepts.md#interval-pattern-sort-then-sweep"

  - id: greedy-intervals-divide-conquer-019
    difficulty: expert
    tags: [greedy, candy, two-pass]
    question: |
      In the Candy problem (each child gets >= 1 candy, and a child with a higher rating
      than a neighbor gets more candy than that neighbor), the standard O(n) greedy uses
      what structure?
    options:
      - "A single left-to-right pass"
      - "Two passes — left-to-right then right-to-left — taking the max of the two assignments"
      - "A min-heap keyed by rating"
      - "Binary search on the total candy count"
    answer: 1
    explanation: |
      A single pass can't satisfy both neighbors. Pass 1 (left to right) enforces the
      left-neighbor constraint; pass 2 (right to left) enforces the right-neighbor
      constraint by taking max(current, right+1). Summing gives the minimum total. O(n).
    ref: "concepts.md#greedy-vs-dynamic-programming-when-greedy-fails"

  - id: greedy-intervals-divide-conquer-020
    difficulty: advanced
    tags: [divide-and-conquer, master-theorem, recurrence]
    question: |
      Binary search on a sorted array satisfies T(n) = T(n/2) + O(1). What does the Master
      Theorem give?
    options:
      - "Θ(n)"
      - "Θ(log n)"
      - "Θ(n log n)"
      - "Θ(1)"
    answer: 1
    explanation: |
      a=1, b=2 so n^(log_b a) = n^0 = 1, matching f(n)=O(1) — Case 2 — yielding
      Θ(1 · log n) = Θ(log n). Each step halves the search space with constant work.
    ref: "concepts.md#divide-and-conquer-split-solve-combine"

  - id: greedy-intervals-divide-conquer-021
    difficulty: intermediate
    tags: [intervals, meeting-rooms, sweep-line]
    question: |
      A sweep-line alternative to the heap for "minimum meeting rooms" processes events
      chronologically. What are the events and how is the answer computed?
    options:
      - "+1 at each meeting midpoint; take the average count"
      - "+1 at each start, -1 at each end; sort events and track the running maximum count"
      - "-1 at each start, +1 at each end; take the final count"
      - "One event per room; count distinct rooms"
    answer: 1
    explanation: |
      Emit +1 at each start and -1 at each end, sort all events by time (ending before
      starting on ties if touching is allowed), sweep accumulating a running count; the
      peak equals the maximum concurrent meetings = rooms needed. O(n log n).
    ref: "concepts.md#interval-pattern-sort-then-sweep"

  - id: greedy-intervals-divide-conquer-022
    difficulty: expert
    tags: [divide-and-conquer, master-theorem, karatsuba]
    question: |
      Karatsuba multiplication has recurrence T(n) = 3T(n/2) + O(n). What is its
      complexity?
    options:
      - "Θ(n²)"
      - "Θ(n log n)"
      - "Θ(n^log2(3)) ≈ Θ(n^1.585)"
      - "Θ(n)"
    answer: 2
    explanation: |
      a=3, b=2 so n^(log_2 3) ≈ n^1.585 dominates the linear combine work (Master Theorem
      Case 1), giving Θ(n^1.585) — asymptotically better than the schoolbook Θ(n²).
    ref: "concepts.md#divide-and-conquer-split-solve-combine"

  - id: greedy-intervals-divide-conquer-023
    difficulty: intermediate
    tags: [greedy, dp, decision]
    question: |
      You are unsure whether a problem is greedy-solvable. What is the safest interview
      stance?
    options:
      - "Assume greedy works because it is faster"
      - "If you cannot argue the greedy-choice property, treat it as a DP problem"
      - "Always use divide-and-conquer as a fallback"
      - "Randomize the choices and take the best of several runs"
    answer: 1
    explanation: |
      Greedy is only correct with a provable greedy-choice property. If you can't justify
      it (via exchange argument or a clear invariant), fall back to DP, which is correct
      whenever optimal substructure holds. Many traps look greedy but require DP.
    ref: "concepts.md#greedy-vs-dynamic-programming-when-greedy-fails"
