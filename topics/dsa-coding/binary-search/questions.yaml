topic: "Binary Search & Its Variants"
domain: dsa-coding
topic_slug: binary-search
version: 1
questions:
  - id: binary-search-001
    difficulty: beginner
    tags: [complexity, big-o, fundamentals]
    question: |
      What is the worst-case time complexity of binary search on a sorted
      array of n elements?
    options: ["O(log n)", "O(1)", "O(n)", "O(n log n)"]
    answer: 0
    explanation: |
      Each comparison discards half of the remaining candidates, so at most
      ⌊log2 n⌋ + 1 comparisons are needed before the search space is one
      element — O(log n). O(1) is only the best case (target is the first mid).
    ref: "concepts.md#the-core-idea-and-prerequisites"

  - id: binary-search-002
    difficulty: intermediate
    tags: [overflow, template, bugs]
    question: |
      Why is the midpoint computed as `mid = lo + (hi - lo) / 2` instead of
      the more obvious `mid = (lo + hi) / 2`?
    options:
      - "It lets the loop terminate in fewer iterations on average"
      - "It biases mid toward the left half for stability"
      - "It is required for the recursion to be tail-recursive"
      - "It avoids signed-integer overflow when lo + hi exceeds the max int"
    answer: 3
    explanation: |
      When lo and hi are large, lo + hi can overflow a fixed-width signed int
      (a real bug fixed in the JDK in 2006). `lo + (hi - lo) / 2` computes the
      same value without ever forming the oversized sum.
    ref: "concepts.md#the-correct-template-and-avoiding-bugs"

  - id: binary-search-003
    difficulty: intermediate
    tags: [infinite-loop, invariant, template]
    question: |
      A candidate writes a loop `while (lo < hi)` that updates `lo = mid` when
      the answer is in the right half, using a floor midpoint
      `mid = lo + (hi - lo) / 2`. What is the most likely bug?
    options:
      - "Integer overflow on mid"
      - "It returns the wrong index by one"
      - "An infinite loop when hi = lo + 1"
      - "It runs in O(n) instead of O(log n)"
    answer: 2
    explanation: |
      With hi = lo + 1, the floor midpoint gives mid = lo, and `lo = mid` leaves
      lo and hi unchanged, so the interval never shrinks — an infinite loop. A
      `lo = mid` update needs a ceil midpoint (or use `lo = mid + 1`).
    ref: "concepts.md#the-correct-template-and-avoiding-bugs"

  - id: binary-search-004
    difficulty: intermediate
    tags: [lower-bound, bisect, boundary]
    question: |
      For a sorted array, which query does `lower_bound(target)` (Python's
      `bisect_left`) answer?
    options:
      - "The last index whose value is less than or equal to target"
      - "The first index whose value is >= target (leftmost insertion point)"
      - "The first index whose value is strictly greater than target"
      - "Any arbitrary index whose stored value equals target exactly"
    answer: 1
    explanation: |
      lower_bound returns the leftmost position where target could be inserted
      to keep the array sorted — the first index with value >= target. The
      "first index > target" is upper_bound / bisect_right.
    ref: "concepts.md#leftmost-and-rightmost-bounds-lower_bound-upper_bound"

  - id: binary-search-005
    difficulty: intermediate
    tags: [first-last-position, count, duplicates]
    question: |
      Given lower_bound (first index >= t) and upper_bound (first index > t),
      how do you compute the number of elements equal to t?
    options:
      - "upper_bound - lower_bound"
      - "upper_bound + lower_bound"
      - "lower_bound - upper_bound + 1"
      - "upper_bound - lower_bound - 1"
    answer: 0
    explanation: |
      All elements equal to t occupy the half-open index range
      [lower_bound, upper_bound), so the count is upper_bound - lower_bound.
      The last occurrence is upper_bound - 1.
    ref: "concepts.md#leftmost-and-rightmost-bounds-lower_bound-upper_bound"

  - id: binary-search-006
    difficulty: advanced
    tags: [rotated-array, invariant]
    question: |
      In "Search in Rotated Sorted Array" (no duplicates), what property lets
      binary search still run in O(log n)?
    options:
      - "The array is still globally sorted after rotation"
      - "At least one half of any [lo, hi] window is always sorted"
      - "The pivot always sits at the exact middle of the window"
      - "The target is guaranteed to be in the larger half"
    answer: 1
    explanation: |
      After a single rotation, for any window at least one of [lo..mid] or
      [mid..hi] is fully sorted. You detect the sorted half (compare A[lo] with
      A[mid]), decide whether target lies within it, and discard the other half.
    ref: "concepts.md#search-in-rotated-sorted-array-and-find-minimum"

  - id: binary-search-007
    difficulty: advanced
    tags: [rotated-array, duplicates, complexity]
    question: |
      How do duplicate values affect the worst-case time of searching a rotated
      sorted array?
    options:
      - "No effect at all; it remains O(log n) throughout"
      - "It improves to O(1) because duplicates can be skipped instantly"
      - "It degrades to O(n) when A[lo] == A[mid] == A[hi]"
      - "It degrades to O(n log n) in the worst case"
    answer: 2
    explanation: |
      When A[lo] == A[mid] == A[hi] you cannot tell which half is sorted, so you
      shrink the window by one step (lo += 1 or hi -= 1). In the worst case
      (all equal) this is O(n).
    ref: "concepts.md#search-in-rotated-sorted-array-and-find-minimum"

  - id: binary-search-008
    difficulty: advanced
    tags: [find-minimum, rotated-array, template]
    question: |
      In "Find Minimum in Rotated Sorted Array," why compare A[mid] with A[hi]
      rather than with A[lo]?
    options:
      - "A[lo] is always the array minimum, so comparing anything against it is pointless"
      - "A[hi] is always strictly larger than A[mid], which simplifies the branch logic"
      - "It avoids signed-integer overflow that could occur during the comparison"
      - "Comparing with A[hi] cleanly decides whether the min is left or right of mid without ambiguity"
    answer: 3
    explanation: |
      If A[mid] > A[hi], the rotation point (minimum) must be to the right, so
      lo = mid + 1; otherwise the min is at mid or to the left, so hi = mid.
      Comparing with A[lo] is ambiguous because A[lo] can be less than A[mid]
      in both the rotated and non-rotated cases.
    ref: "concepts.md#search-in-rotated-sorted-array-and-find-minimum"

  - id: binary-search-009
    difficulty: advanced
    tags: [binary-search-on-answer, pattern-recognition, koko]
    question: |
      Which problem phrasing is the strongest signal to reach for "binary search
      on the answer"?
    options:
      - "Return every pair of indices whose values sum to a given target"
      - "Minimize the maximum, or 'can we do it with at most K?', with a monotonic feasibility test"
      - "Find the shortest path between two nodes in an unweighted graph"
      - "Detect whether a singly linked list contains a cycle"
    answer: 1
    explanation: |
      "Minimize the maximum" / "maximize the minimum" / "can we do it within K?"
      combined with a monotonic feasible(x) means you can binary-search the
      value range of the answer instead of scanning it linearly.
    ref: "concepts.md#binary-search-on-the-answer-search-a-monotonic-predicate"

  - id: binary-search-010
    difficulty: advanced
    tags: [binary-search-on-answer, koko, complexity]
    question: |
      Koko Eating Bananas searches for the smallest eating speed k so all piles
      are finished within H hours. With n piles and m = max(piles), what is the
      time complexity?
    options:
      - "O(n * m)"
      - "O(n log n)"
      - "O(n log m)"
      - "O(log(n * m))"
    answer: 2
    explanation: |
      The answer range is [1, m], searched in O(log m) steps. Each step runs an
      O(n) feasibility check (sum of ceil(pile / k) hours). Total: O(n log m).
    ref: "concepts.md#binary-search-on-the-answer-search-a-monotonic-predicate"

  - id: binary-search-011
    difficulty: advanced
    tags: [binary-search-on-answer, split-array, bounds]
    question: |
      For "Split Array Largest Sum" (split into m subarrays minimizing the
      largest subarray sum), what are the correct binary-search bounds on the
      answer?
    options:
      - "[max(nums), sum(nums)]"
      - "[0, sum(nums)]"
      - "[min(nums), max(nums)]"
      - "[1, m]"
    answer: 0
    explanation: |
      The largest subarray sum is at least max(nums) (a single largest element
      is unavoidable) and at most sum(nums) (one subarray holds everything).
      Searching [max(nums), sum(nums)] guarantees the true answer is in range.
    ref: "concepts.md#binary-search-on-the-answer-search-a-monotonic-predicate"

  - id: binary-search-012
    difficulty: intermediate
    tags: [2d-matrix, index-mapping]
    question: |
      To binary-search a "Search a 2D Matrix" (each row sorted, first of each
      row greater than the last of the previous row), you treat it as a length
      m*n sorted array. How do you map 1D index `idx` to a cell?
    options:
      - "row = idx % n, col = idx / n"
      - "row = idx / m, col = idx % m"
      - "row = idx % m, col = idx / n"
      - "row = idx / n, col = idx % n"
    answer: 3
    explanation: |
      With n columns, index idx sits at row = idx / n and col = idx % n. This
      lets you binary-search 0..m*n-1 in O(log(m*n)) as if the grid were one
      sorted array.
    ref: "concepts.md#search-a-2d-matrix-and-find-peak-element"

  - id: binary-search-013
    difficulty: advanced
    tags: [2d-matrix, search-space, pattern-choice]
    question: |
      "Search a 2D Matrix II" has rows AND columns individually sorted, but a
      row's first element is NOT guaranteed larger than the previous row's last.
      Why can't you use the flatten-to-1D binary search here?
    options:
      - "The matrix is not guaranteed to be square in shape"
      - "The flattened array is not globally sorted, so the monotonic precondition fails"
      - "Integer overflow corrupts the 1D-to-2D index mapping"
      - "Binary search cannot handle two-dimensional data at all"
    answer: 1
    explanation: |
      Flattening only yields a sorted sequence when each row chains after the
      previous one. Here it does not, so the flattened array isn't monotonic.
      Use the O(m + n) staircase search from the top-right corner instead.
    ref: "concepts.md#search-a-2d-matrix-and-find-peak-element"

  - id: binary-search-014
    difficulty: advanced
    tags: [find-peak, unsorted, slope]
    question: |
      "Find Peak Element" runs binary search on an UNSORTED array in O(log n).
      What justifies discarding half the array at each step?
    options:
      - "The array is secretly sorted after an implicit preprocessing pass"
      - "Peaks are always located at the exact middle of the array"
      - "If A[mid] < A[mid+1] the ascending slope guarantees a peak exists to the right"
      - "You must scan the array linearly first to find a candidate index"
    answer: 2
    explanation: |
      Treating out-of-bounds neighbors as -infinity, an ascending step
      (A[mid] < A[mid+1]) means moving right must eventually stop rising, so a
      peak lies to the right; otherwise a peak is at mid or to the left. That
      monotone slope argument keeps it O(log n).
    ref: "concepts.md#search-a-2d-matrix-and-find-peak-element"

  - id: binary-search-015
    difficulty: expert
    tags: [median-two-sorted, partition, complexity]
    question: |
      The O(log(min(m, n))) solution to "Median of Two Sorted Arrays" binary
      searches over what?
    options:
      - "A partition position in the smaller array"
      - "The values in the larger array"
      - "The merged array's indices"
      - "The difference of the two array lengths"
    answer: 0
    explanation: |
      You binary-search the number of elements taken from the SHORTER array for
      the left half; the count from the other array is then fixed. A valid
      partition satisfies A[i-1] <= B[j] and B[j-1] <= A[i]. Searching the
      shorter array gives O(log(min(m, n))).
    ref: "concepts.md#median-of-two-sorted-arrays"

  - id: binary-search-016
    difficulty: intermediate
    tags: [linked-list, random-access, complexity]
    question: |
      Why does binary search lose its O(log n) advantage on a singly linked
      list?
    options:
      - "Linked lists fundamentally cannot be kept in sorted order"
      - "Each element comparison on a linked list costs O(log n) time"
      - "The recursion depth unavoidably grows to O(n) levels"
      - "Accessing the middle node is O(n), so total time degrades to O(n)"
    answer: 3
    explanation: |
      Binary search needs O(1) random access to jump to the midpoint. In a
      linked list, reaching the middle requires walking O(n) nodes each step, so
      you lose the benefit — a linear scan is just as good.
    ref: "concepts.md#the-core-idea-and-prerequisites"

  - id: binary-search-017
    difficulty: intermediate
    tags: [time-based-store, upper-bound, application]
    question: |
      "Time Based Key-Value Store" returns the value with the largest timestamp
      <= the query time. Given timestamps stored in sorted order, which
      operation retrieves it?
    options:
      - "lower_bound(query), then take that index"
      - "upper_bound(query), then take index - 1"
      - "lower_bound(query), then take index + 1"
      - "A linear scan is required; binary search does not apply"
    answer: 1
    explanation: |
      upper_bound(query) is the first timestamp strictly greater than the query,
      so the element just before it (index - 1) is the largest timestamp <=
      query. This is O(log n) per get.
    ref: "concepts.md#leftmost-and-rightmost-bounds-lower_bound-upper_bound"

  - id: binary-search-018
    difficulty: beginner
    tags: [prerequisite, monotonic, fundamentals]
    question: |
      What is the essential precondition for binary search to be correct?
    options:
      - "The search space must be monotonic with respect to the decision predicate"
      - "The array must contain no duplicate values"
      - "The array length must be a power of two"
      - "The elements must all be integer-valued, not floats"
    answer: 0
    explanation: |
      Binary search only needs the search space to be ordered/monotonic for the
      predicate you test — classically a sorted array, but equally a monotonic
      feasible(x) over a value range. Duplicates, non-integers, and arbitrary
      lengths are all fine.
    ref: "concepts.md#the-core-idea-and-prerequisites"

  - id: binary-search-019
    difficulty: intermediate
    tags: [template, boundary, early-exit]
    question: |
      Why does the half-open lower_bound template (`while lo < hi`, `hi = mid`)
      deliberately NOT return early when it finds a matching element?
    options:
      - "Returning early would trigger an integer overflow in the midpoint computation once lo and hi grow large"
      - "An early return is structurally impossible in a half-open interval since the lo < hi condition forbids it"
      - "It must keep shrinking to converge on the LEFTMOST matching index, not just any match"
      - "It needs to tally the total number of comparisons performed so it can report that count back to the caller"
    answer: 2
    explanation: |
      A boundary search wants the first index satisfying the predicate. If it
      stopped at the first match it found, that match might not be the leftmost.
      Continuing (hi = mid keeps the candidate) drives lo/hi to the exact
      boundary in the full log n steps.
    ref: "concepts.md#leftmost-and-rightmost-bounds-lower_bound-upper_bound"

  - id: binary-search-020
    difficulty: intermediate
    tags: [java-arrays, insertion-point, api]
    question: |
      Java's `Arrays.binarySearch` returns a negative value when the key is
      absent. What does that negative value encode?
    options:
      - "Always exactly -1, regardless of where in the array the missing key would have belonged"
      - "The array's length negated, signalling that a full scan was needed before giving up"
      - "-(insertion point) - 1, where insertion point is where the key would go"
      - "The index of the nearest strictly smaller element, negated to flag the miss"
    answer: 2
    explanation: |
      When the key is not found, the method returns -(insertion_point) - 1. The
      insertion point is the index where the key would be inserted to keep the
      array sorted (the first element greater than the key, or array length).
      The -1 offset disambiguates a not-found-at-0 from a found-at-0 result.
    ref: "concepts.md#leftmost-and-rightmost-bounds-lower_bound-upper_bound"

  - id: binary-search-021
    difficulty: advanced
    tags: [binary-search-on-answer, feasibility, monotonic]
    question: |
      In binary search on the answer, the feasibility function feasible(x) must
      have which property for correctness?
    options:
      - "It must be computable in strict O(1) time so the overall search stays logarithmic"
      - "It must directly return the exact optimal x rather than a mere yes-or-no verdict"
      - "It must be symmetric around the current midpoint so both halves are tested equally"
      - "It must be monotonic: once True (or False), it stays that way as x moves in one direction"
    answer: 3
    explanation: |
      The whole method rests on monotonicity: the predicate over the value range
      must look like False...False,True...True (or the reverse). That is what
      justifies discarding half the range. The check need not be O(1) — it is
      often O(n) and still gives O(n log range) overall.
    ref: "concepts.md#binary-search-on-the-answer-search-a-monotonic-predicate"

  - id: binary-search-022
    difficulty: beginner
    tags: [space-complexity, recursion, iterative]
    question: |
      What is the space complexity of a recursive binary search versus an
      iterative one?
    options:
      - "Both variants use O(1) auxiliary space since neither retains prior search state"
      - "Recursive is O(log n) call stack; iterative is O(1)"
      - "Recursive is O(n) from stacking every element; iterative is O(log n)"
      - "Both consume O(log n) space, one on the call stack and one in local bookkeeping"
    answer: 1
    explanation: |
      An iterative binary search uses a constant number of variables — O(1). A
      recursive one adds a stack frame per level of the log n recursion depth,
      so it uses O(log n) space.
    ref: "concepts.md#the-core-idea-and-prerequisites"
