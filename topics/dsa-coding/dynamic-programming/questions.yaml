topic: "Dynamic Programming"
domain: dsa-coding
topic_slug: dynamic-programming
version: 1
questions:
  - id: dynamic-programming-001
    difficulty: beginner
    tags: [signals, overlapping-subproblems, recognition]
    question: |
      Which pair of properties must a problem exhibit for dynamic programming
      to apply (and to be an improvement over plain divide-and-conquer)?
    options:
      - "Sorted input and a monotonic predicate"
      - "A greedy choice property and matroid structure"
      - "Optimal substructure and overlapping subproblems"
      - "Constant-time transitions and a balanced recursion tree"
    answer: 2
    explanation: |
      DP needs optimal substructure (the optimum is built from optima of
      subproblems) AND overlapping subproblems (the naive recursion revisits
      the same subproblem). Without overlap it is just divide-and-conquer and
      memoization buys nothing.
    ref: "concepts.md#the-two-signals-optimal-substructure-and-overlapping-subproblems"

  - id: dynamic-programming-002
    difficulty: beginner
    tags: [fibonacci, overlapping-subproblems]
    question: |
      Why does naive recursive Fibonacci run in exponential time even though
      there are only n distinct subproblems?
    options:
      - "The same subproblems are recomputed many times across branches"
      - "Each recursive call allocates a fresh array of size n"
      - "Integer addition of large Fibonacci numbers dominates"
      - "The recursion is not tail-recursive, so no loop reuse occurs"
    answer: 0
    explanation: |
      fib(n-2) is recomputed in both the fib(n-1) and fib(n-2) branches, so the
      recursion tree has O(phi^n) nodes. Caching each distinct subproblem once
      collapses it to O(n) — the essence of overlapping subproblems.
    ref: "concepts.md#the-two-signals-optimal-substructure-and-overlapping-subproblems"

  - id: dynamic-programming-003
    difficulty: intermediate
    tags: [method, state, complexity]
    question: |
      In the standard DP recipe, the general formula for the time complexity is:
    options:
      - "number of states + transition cost"
      - "number of states x transition cost"
      - "2 raised to the number of state variables"
      - "recursion depth x branching factor"
    answer: 1
    explanation: |
      Total time = (number of distinct states) x (work per transition). E.g.
      0/1 knapsack has nW states and O(1) transitions -> O(nW); interval DP has
      n^2 states and an O(n) split -> O(n^3).
    ref: "concepts.md#complexity-states--transition-cost"

  - id: dynamic-programming-004
    difficulty: intermediate
    tags: [memoization, tabulation, tradeoffs]
    question: |
      Which statement best distinguishes top-down memoization from bottom-up
      tabulation?
    options:
      - "Memoization has better asymptotic time complexity than tabulation"
      - "Tabulation can compute answers memoization cannot"
      - "Tabulation always uses less total memory regardless of the recurrence"
      - "Memoization only solves reachable states and risks stack overflow; tabulation fills states in a fixed order with no recursion"
    answer: 3
    explanation: |
      Both are O(#states x transition). Memoization is lazy (only reachable
      states) but uses the call stack (deep recursion can overflow). Tabulation
      iterates in dependency order with no recursion and enables rolling-array
      space optimization.
    ref: "concepts.md#top-down-memoization-vs-bottom-up-tabulation"

  - id: dynamic-programming-005
    difficulty: intermediate
    tags: [knapsack, rolling-array, gotcha]
    question: |
      When collapsing the 0/1 knapsack table to a 1-D array dp[c], why must you
      iterate the capacity c in DESCENDING order?
    options:
      - "To avoid signed integer overflow when the accumulated value sums grow large"
      - "Descending traversal improves CPU cache locality and prefetching of dp[]"
      - "Ascending order would let a single item be used more than once (turning it into unbounded knapsack)"
      - "It guarantees the final optimum always lands in the dp[0] slot"
    answer: 2
    explanation: |
      dp[c] must read dp[c - w[i]] from the PREVIOUS item's row. Iterating c
      ascending overwrites dp[c - w[i]] with the current item first, so the item
      can be reused — that is exactly unbounded knapsack. Descending preserves
      the prior-row values.
    ref: "concepts.md#space-optimization-the-rolling-array"

  - id: dynamic-programming-006
    difficulty: advanced
    tags: [knapsack, complexity, pseudo-polynomial]
    question: |
      The 0/1 knapsack DP runs in O(nW). Why is this called "pseudo-polynomial"
      rather than truly polynomial?
    options:
      - "Because W is a numeric value needing only log W bits to encode, so O(nW) is exponential in the input size"
      - "Because the table is filled with recursion internally rather than plain loops"
      - "Because the hidden constant factor in the O(nW) bound is unusually large"
      - "Because it only works correctly when the capacity W is an exact power of two"
    answer: 0
    explanation: |
      Polynomial means polynomial in the input SIZE. W is encoded in log W bits,
      so O(nW) is exponential in the number of bits. This is why subset-sum /
      knapsack are NP-complete yet have an efficient table DP for small numeric W.
    ref: "concepts.md#complexity-states--transition-cost"

  - id: dynamic-programming-007
    difficulty: intermediate
    tags: [subset-sum, partition, reduction]
    question: |
      Partition Equal Subset Sum asks whether an array can be split into two
      subsets of equal sum. What subproblem does it reduce to?
    options:
      - "Finding the longest increasing subsequence of the array once it is sorted"
      - "Counting the inversions in the array with a merge-sort pass"
      - "Sorting the array and greedily pairing the largest element with the smallest"
      - "Subset-sum: can any subset reach exactly totalSum / 2 (impossible if total is odd)"
    answer: 3
    explanation: |
      Two equal halves each sum to total/2. So it is subset-sum with target
      total/2, a boolean DP dp[c] |= dp[c - num]. If the total sum is odd, no
      equal partition can exist, so return false immediately.
    ref: "concepts.md#01-knapsack-and-subset-sum"

  - id: dynamic-programming-008
    difficulty: intermediate
    tags: [coin-change, unbounded-knapsack, loop-order]
    question: |
      In Coin Change II (count the number of COMBINATIONS that make an amount),
      why must coins be the OUTER loop and amount the inner loop?
    options:
      - "It reduces the overall time complexity from O(n^2) down to O(n log n)"
      - "Amount-outer/coins-inner would count ordered sequences (permutations) and overcount"
      - "It avoids signed integer overflow in the accumulated combination counts"
      - "The inner loop must always iterate over the smaller of the two ranges"
    answer: 1
    explanation: |
      Iterating coins on the outside fixes an order in which coins are considered,
      so each unordered combination is counted once. Swapping to amount-outer lets
      the same multiset be formed in different orders, counting permutations and
      overcounting.
    ref: "concepts.md#unbounded-knapsack-and-coin-change"

  - id: dynamic-programming-009
    difficulty: advanced
    tags: [lis, complexity, binary-search]
    question: |
      The dp[i] = 1 + max(dp[j]) recurrence for Longest Increasing Subsequence is
      O(n^2). What technique achieves O(n log n)?
    options:
      - "Memoizing each dp[i] value in a hash map keyed by index"
      - "Sorting the array first and then scanning it a single time"
      - "Maintaining a tails[] array where tails[k] is the smallest tail of an increasing subsequence of length k+1, updated via binary search"
      - "Using a monotonic stack of indices to pop dominated elements"
    answer: 2
    explanation: |
      Patience-sorting: for each element binary-search the first tail >= x and
      replace it (or append). The length of tails is the LIS length. tails is not
      itself a valid subsequence — only its length is meaningful. That gives
      O(n log n).
    ref: "concepts.md#lis--longest-increasing-subsequence"

  - id: dynamic-programming-010
    difficulty: intermediate
    tags: [lcs, recurrence, 2d-dp]
    question: |
      In the Longest Common Subsequence DP, when A[i-1] == B[j-1], the transition
      dp[i][j] equals:
    options:
      - "dp[i-1][j-1] + 1"
      - "max(dp[i-1][j], dp[i][j-1])"
      - "dp[i-1][j] + dp[i][j-1]"
      - "1 + min(dp[i-1][j], dp[i][j-1])"
    answer: 0
    explanation: |
      Matching characters extend the diagonal subproblem by one:
      dp[i][j] = dp[i-1][j-1] + 1. When they differ, you drop one character from
      either string: max(dp[i-1][j], dp[i][j-1]).
    ref: "concepts.md#lcs-and-edit-distance"

  - id: dynamic-programming-011
    difficulty: advanced
    tags: [edit-distance, recurrence, base-case]
    question: |
      In edit distance (Levenshtein), when the current characters DIFFER, the
      transition is 1 + min of three terms. Which three?
    options:
      - "dp[i-1][j-1], dp[i-2][j], dp[i][j-2]"
      - "dp[i-1][j], dp[i][j-1], dp[i+1][j+1] (delete, insert, look-ahead)"
      - "dp[i-1][j-1] only, since a mismatch is always a single substitution"
      - "dp[i-1][j-1], dp[i-1][j], dp[i][j-1] (replace, delete, insert)"
    answer: 3
    explanation: |
      Replace uses dp[i-1][j-1], delete uses dp[i-1][j], insert uses dp[i][j-1];
      take 1 + the min. Base cases dp[i][0]=i and dp[0][j]=j account for turning a
      prefix into the empty string.
    ref: "concepts.md#lcs-and-edit-distance"

  - id: dynamic-programming-012
    difficulty: beginner
    tags: [grid-dp, unique-paths, space]
    question: |
      For Unique Paths (robot moving only right/down on an m x n grid), the
      recurrence is dp[i][j] = dp[i-1][j] + dp[i][j-1]. What is the minimal space?
    options:
      - "O(m * n) always, because every grid cell must be stored explicitly"
      - "O(min(m, n)) using a single rolling row"
      - "O(m + n), storing just one full row plus one full column"
      - "O(1), since each dp value can be recomputed on demand from its neighbours"
    answer: 1
    explanation: |
      Each cell depends only on the cell above and to the left, so a single row
      (length min(m,n)) suffices: dp[j] += dp[j-1] in place. That reduces O(mn)
      space to O(min(m,n)).
    ref: "concepts.md#grid--matrix-path-dp"

  - id: dynamic-programming-013
    difficulty: intermediate
    tags: [house-robber, circular, decision-dp]
    question: |
      House Robber II arranges houses in a CIRCLE (first and last are adjacent).
      How do you adapt the linear O(n) DP?
    options:
      - "Run the linear DP twice — once excluding the first house, once excluding the last — and take the max"
      - "Double the array to length 2n and run the linear DP once over the concatenation"
      - "Rob every other house starting from index 0 to keep them non-adjacent"
      - "Use a min-heap of house values and repeatedly extract the smallest ones"
    answer: 0
    explanation: |
      Because the first and last houses are adjacent, they cannot both be robbed.
      Solve two linear subproblems (houses 0..n-2 and 1..n-1) and take the larger.
      Each is the ordinary House Robber I recurrence.
    ref: "concepts.md#decision-dp--house-robber-and-stocks"

  - id: dynamic-programming-014
    difficulty: advanced
    tags: [stocks, cooldown, state-machine]
    question: |
      Best Time to Buy/Sell Stock with Cooldown is naturally modeled as a state
      machine. What does the cooldown constraint enforce about the transitions?
    options:
      - "You may hold at most one share but sell any number of times per day"
      - "You may never sell at a loss, so any transaction below the buy price is forbidden"
      - "After selling you must rest one day, so you can only buy from the 'rest' state, not immediately after 'sold'"
      - "Buying and selling must alternate strictly every other day regardless of holdings"
    answer: 2
    explanation: |
      Track held/sold/rest. sold = held + price; held = max(held, rest - price);
      rest = max(rest, prev sold). The cooldown means a buy can only follow a rest
      day, never the day right after a sale.
    ref: "concepts.md#decision-dp--house-robber-and-stocks"

  - id: dynamic-programming-015
    difficulty: advanced
    tags: [interval-dp, order, complexity]
    question: |
      For interval DP where dp[i][j] answers the subarray i..j, what evaluation
      order guarantees dependencies are ready, and what is the typical complexity
      with an O(n) split loop?
    options:
      - "Iterate left to right by i only; O(n^2)"
      - "Iterate by increasing interval length; O(n^3)"
      - "Iterate in random order with memoization; O(n log n)"
      - "Iterate by decreasing j only; O(n)"
    answer: 1
    explanation: |
      dp[i][j] depends on shorter ranges (e.g. dp[i][k] and dp[k+1][j]), so fill
      by increasing interval length. With n^2 states and an O(n) split point loop,
      the total is O(n^3) — as in matrix-chain multiplication and Burst Balloons.
    ref: "concepts.md#interval-dp"

  - id: dynamic-programming-016
    difficulty: advanced
    tags: [bitmask-dp, tsp, complexity]
    question: |
      Bitmask DP for the Travelling Salesman Problem uses dp[mask][i] = min cost
      to visit the set 'mask' ending at city i. What is its complexity, and why is
      n limited to roughly 20?
    options:
      - "O(n^2); limited by recursion depth"
      - "O(n!); it enumerates every permutation"
      - "O(n log n); limited by sort stability"
      - "O(2^n * n^2); the 2^n masks make memory and time explode past ~20 cities"
    answer: 3
    explanation: |
      There are 2^n masks x n end-cities = 2^n * n states, and each transition
      tries n predecessors, giving O(2^n * n^2). Far better than O(n!), but 2^n
      still explodes beyond about 20 elements.
    ref: "concepts.md#dp-on-trees-and-bitmask-dp"

  - id: dynamic-programming-017
    difficulty: intermediate
    tags: [greedy-vs-dp, coin-change, recognition]
    question: |
      For coins {1, 3, 4} and amount 6, greedy (take the largest coin first) gives
      4+1+1 = 3 coins, but the optimum is 3+3 = 2 coins. What does this illustrate?
    options:
      - "Coin change with arbitrary denominations needs DP because greedy lacks the greedy-choice property"
      - "Greedy is always optimal for coin change as long as the coins are sorted first"
      - "The target amount must be an exact multiple of the smallest coin to be solvable"
      - "DP and greedy always return the same coin count on this particular instance"
    answer: 0
    explanation: |
      Greedy only works for canonical coin systems. With arbitrary denominations
      a local largest-coin choice can be globally suboptimal, so you need DP
      (dp[a] = 1 + min over coins of dp[a - c]).
    ref: "concepts.md#dp-vs-greedy-vs-backtracking"

  - id: dynamic-programming-018
    difficulty: intermediate
    tags: [paradigm-choice, backtracking, recognition]
    question: |
      You must return the COUNT of ways (or an optimal value) over choices whose
      subproblems overlap. Which paradigm fits best?
    options:
      - "Backtracking that enumerates every configuration without reusing subresults"
      - "A single greedy sweep that commits to the locally best choice each step"
      - "Dynamic programming (memoize/tabulate the overlapping states)"
      - "Binary search on the answer paired with a feasibility check"
    answer: 2
    explanation: |
      Needing a count or optimum over overlapping subproblems is the DP signal.
      Backtracking is for enumerating ALL configurations (no reuse); greedy is for
      when a local choice is provably global.
    ref: "concepts.md#dp-vs-greedy-vs-backtracking"

  - id: dynamic-programming-019
    difficulty: intermediate
    tags: [kadane, maximum-subarray, recurrence]
    question: |
      Kadane's algorithm for maximum subarray uses endHere = max(nums[i],
      endHere + nums[i]). What DP insight does this capture?
    options:
      - "The maximum-sum subarray always begins at index 0, so only its right endpoint ever needs to move during the scan"
      - "The optimal subarray ending at i is either just nums[i] or the optimal subarray ending at i-1 extended by nums[i]"
      - "It sorts all the prefix sums and returns the largest gap between any two of them as the maximum subarray sum"
      - "It maintains a monotonic deque of window minimums and slides a fixed-size window across the array to find the best run"
    answer: 1
    explanation: |
      The state is 'best sum of a subarray ending at i'. Either start fresh at i
      (nums[i]) or extend the best run ending at i-1. Track the global max. This is
      O(n) time and O(1) space — DP in disguise.
    ref: "concepts.md#kadane--maximum-subarray"

  - id: dynamic-programming-020
    difficulty: intermediate
    tags: [word-break, reachability, method]
    question: |
      Word Break asks if a string can be segmented into dictionary words. The most
      natural DP defines dp[i] as:
    options:
      - "the minimum number of dictionary words needed to cover the prefix s[:i]"
      - "the length of the longest single dictionary word that ends exactly at position i"
      - "the lexicographically smallest valid segmentation string of the prefix s[:i]"
      - "true if s[:i] can be segmented into dictionary words"
    answer: 3
    explanation: |
      dp[i] = can prefix s[:i] be segmented? dp[0]=true; dp[i] is true if some j<i
      has dp[j] true AND s[j:i] is in the dictionary. This is a boolean
      reachability DP over prefixes, O(n^2) with substring/dictionary checks.
    ref: "concepts.md#the-method-state-recurrence-base-case-order-answer"

  - id: dynamic-programming-021
    difficulty: beginner
    tags: [climbing-stairs, space, rolling-array]
    question: |
      Climbing Stairs (1 or 2 steps at a time) has dp[i] = dp[i-1] + dp[i-2]. What
      is the minimal space needed?
    options:
      - "O(n) — you must keep the whole table"
      - "O(1) — keep only the last two values"
      - "O(log n) — via fast matrix exponentiation"
      - "O(sqrt n) — halving the index range each step"
    answer: 1
    explanation: |
      dp[i] depends only on dp[i-1] and dp[i-2], so two rolling scalars suffice —
      O(1) space. This is the same shape as Fibonacci.
    ref: "concepts.md#space-optimization-the-rolling-array"

  - id: dynamic-programming-022
    difficulty: advanced
    tags: [tree-dp, house-robber-iii, post-order]
    question: |
      House Robber III robs nodes of a binary tree with no two directly-connected
      nodes robbed. What is the standard DP-on-trees formulation?
    options:
      - "Post-order DFS returning (robThis, skipThis) per node, where robThis = val + skipLeft + skipRight and skipThis = max(left) + max(right)"
      - "BFS the tree level by level and rob every alternate level, treating even depths as robbable and odd depths as skipped"
      - "Sort all node values in descending order and greedily rob the largest ones as long as none is a parent or child of an already-robbed node"
      - "Run Kadane's maximum-subarray scan along each root-to-leaf path and return the best path sum found"
    answer: 0
    explanation: |
      Each node returns two values computed from its children in post-order:
      robbing it forbids robbing its children (val + skipLeft + skipRight), and
      skipping it lets each child take its own best (max of that child's two
      values). O(n) over the tree.
    ref: "concepts.md#dp-on-trees-and-bitmask-dp"

  - id: dynamic-programming-023
    difficulty: intermediate
    tags: [optimal-substructure, counter-example, theory]
    question: |
      Shortest path has optimal substructure, but longest SIMPLE path is NP-hard
      and lacks it. Why does optimal substructure fail for longest simple path?
    options:
      - "Negative edge weights make every candidate sub-path score arbitrarily low, so no maximum can be defined"
      - "The graph might be disconnected, leaving some vertex pairs with no path between them at all"
      - "Gluing two optimal sub-paths can revisit a vertex, violating simplicity, so sub-optima do not compose"
      - "Longest simple paths are never unique, so there is no single value for a DP table to store"
    answer: 2
    explanation: |
      Optimal substructure requires that combining optimal subproblem solutions
      yields a valid optimal whole. For longest simple paths, concatenating two
      optimal segments can reuse a vertex, breaking the simple-path constraint, so
      the pieces do not compose — hence no clean DP and the problem is NP-hard.
    ref: "concepts.md#the-two-signals-optimal-substructure-and-overlapping-subproblems"
