topic: "Arrays, Strings & Hashing"
domain: dsa-coding
topic_slug: arrays-strings-hashing
version: 1
questions:
  - id: arrays-strings-hashing-001
    difficulty: beginner
    tags: [arrays, memory, complexity]
    question: |
      Why does accessing an array element by index, a[i], run in O(1) time?
    options:
      - "The address is computed directly as base + i * element_size"
      - "The array keeps a hash map from index to element"
      - "The runtime caches every element it has previously accessed"
      - "Arrays are always small enough to fit in a CPU register"
    answer: 0
    explanation: |
      Arrays occupy a contiguous block of same-width elements, so the address of any
      element is a constant-time arithmetic computation from the base address. No search
      or traversal is needed — this is the defining advantage of arrays over linked lists.
    ref: "concepts.md#arrays-and-contiguous-memory"

  - id: arrays-strings-hashing-002
    difficulty: intermediate
    tags: [dynamic-array, amortized, resize]
    question: |
      A dynamic array (ArrayList / Python list) that doubles its capacity when full
      supports append in which time complexity?
    options:
      - "O(1) worst case for every append"
      - "O(n) for every append because of copying"
      - "O(log n) amortized"
      - "O(1) amortized"
    answer: 3
    explanation: |
      Most appends are O(1); the occasional resize copies all elements (O(n)). With
      geometric (doubling) growth the total copy work across n appends sums to < 2n, so
      the cost amortizes to O(1) per append. It is amortized, not true worst-case O(1).
    ref: "concepts.md#dynamic-arrays-and-amortized-resizing"

  - id: arrays-strings-hashing-003
    difficulty: advanced
    tags: [dynamic-array, amortized, resize]
    question: |
      Why must a dynamic array grow by a multiplicative factor (e.g. 2x) rather than by
      a fixed additive amount (e.g. +10) to keep append amortized O(1)?
    options:
      - "Additive growth wastes more memory than multiplicative growth"
      - "Additive growth breaks the contiguous memory layout arrays depend on"
      - "Multiplicative growth avoids ever needing to copy elements"
      - "With additive growth the total copy work over n appends sums to O(n^2)"
    answer: 3
    explanation: |
      With +k growth, resizes happen every k inserts and each copies the whole array, so
      total work is roughly k + 2k + 3k + ... = O(n^2), i.e. O(n) per append. Geometric
      growth makes the copy sizes a convergent geometric series (< 2n total), giving
      amortized O(1).
    ref: "concepts.md#dynamic-arrays-and-amortized-resizing"

  - id: arrays-strings-hashing-004
    difficulty: beginner
    tags: [arrays, insertion, complexity]
    question: |
      What is the worst-case time to insert an element at the FRONT of an array of n
      elements (capacity permitting)?
    options:
      - "O(n), because all existing elements must shift right"
      - "O(1), because arrays support fast insertion anywhere"
      - "O(log n), by binary-searching for the insertion point"
      - "O(1) amortized, since only the end-of-array pointer moves"
    answer: 0
    explanation: |
      Inserting at the front forces every existing element to shift one slot to the right
      to make room, which is O(n). Only insertion/deletion at the END of an array is
      cheap (amortized O(1)); front and middle operations are O(n) due to shifting.
    ref: "concepts.md#insertion-and-deletion-complexity"

  - id: arrays-strings-hashing-005
    difficulty: intermediate
    tags: [strings, immutability, java]
    question: |
      Building a string by repeatedly doing `s += piece` inside a loop over n pieces is
      slow in Java/Python. What is its time complexity and the fix?
    options:
      - "O(n); the concatenation loop is already optimal"
      - "O(n log n); fix by sorting the pieces before joining"
      - "O(n^2); use StringBuilder (Java) or ''.join (Python)"
      - "O(n^2); fix by buffering the pieces in a HashMap"
    answer: 2
    explanation: |
      Strings are immutable, so each += allocates a new string and copies all characters
      accumulated so far, giving 1 + 2 + ... + n = O(n^2). A mutable buffer (StringBuilder)
      or a single ''.join over the pieces copies each character once, for O(n).
    ref: "concepts.md#strings-and-immutability"

  - id: arrays-strings-hashing-006
    difficulty: intermediate
    tags: [strings, immutability]
    question: |
      Which is a genuine reason string immutability is useful in Java/Python?
    options:
      - "It lets a string safely cache its hash code and be shared across threads"
      - "It makes repeated concatenation inside a loop run faster"
      - "It shrinks the memory footprint each string instance occupies"
      - "It allows in-place character edits without reallocation"
    answer: 0
    explanation: |
      Because the characters never change, a string's hash can be computed once and cached
      (great for hash-map keys), and instances can be shared/interned across threads
      without locking. Immutability actively HURTS loop concatenation and does not enable
      in-place edits.
    ref: "concepts.md#strings-and-immutability"

  - id: arrays-strings-hashing-007
    difficulty: beginner
    tags: [hashing, two-sum, pattern]
    question: |
      Which technique turns the O(n^2) brute-force "find two numbers that sum to target"
      into an O(n) solution?
    options:
      - "Sorting the array first, then binary search for each element"
      - "A hash map storing each value's index for O(1) complement lookup"
      - "A monotonic stack that pops when a complement appears"
      - "Dynamic programming over contiguous subarrays of the input"
    answer: 1
    explanation: |
      Walk once; for each x check whether target - x (the complement) is already in a hash
      map of seen value->index. Each lookup/insert is O(1) average, so the whole scan is
      O(n) time and O(n) space — the canonical Two Sum solution.
    ref: "concepts.md#the-hashing-technique-for-o1-lookups"

  - id: arrays-strings-hashing-008
    difficulty: intermediate
    tags: [hashing, complexity]
    question: |
      Hash-map insert/lookup is often quoted as O(1). What is the honest qualification an
      interviewer wants to hear?
    options:
      - "It is O(1) worst case for every operation regardless of input"
      - "It is O(1) average/amortized but O(n) worst case under heavy collisions"
      - "It is O(log n) average because of internal tree structure"
      - "It is O(1) only when the keys are primitive integers"
    answer: 1
    explanation: |
      Average-case O(1) assumes a good hash spreading keys across buckets. Adversarial or
      pathological keys can collide into one bucket, degrading to O(n) per operation
      (Java 8+ treeifies long buckets to O(log n) to soften this). Say "O(1) average" not
      "O(1) always".
    ref: "concepts.md#the-hashing-technique-for-o1-lookups"

  - id: arrays-strings-hashing-009
    difficulty: intermediate
    tags: [hashing, pattern, group-anagrams]
    question: |
      For Group Anagrams, what is a correct canonical key so all anagrams of a word map to
      the same hash-map bucket?
    options:
      - "The word's length together with its first character"
      - "The first and last characters concatenated in order"
      - "The sorted characters of the word (or its 26-letter count tuple)"
      - "The sum of the ASCII codes of the characters"
    answer: 2
    explanation: |
      Anagrams share the exact same multiset of characters, so sorting the letters (or a
      fixed-size count-of-each-letter tuple) produces an identical key for all of them.
      Length, ASCII sum, or first/last chars collide for non-anagrams (e.g. "abc" and
      "acb" vs "bca" — but also "ad" and "bc" share ASCII sum), so they are wrong keys.
    ref: "concepts.md#the-hashing-technique-for-o1-lookups"

  - id: arrays-strings-hashing-010
    difficulty: intermediate
    tags: [hashing, pattern-choice]
    question: |
      You must decide, in a single pass, whether any value has appeared before in a stream.
      Which hashing pattern fits best?
    options:
      - "Complement lookup (value -> index map)"
      - "Group-by-key map that buckets values under a shared key"
      - "A seen-set: add each value, report a duplicate if already present"
      - "Prefix-sum map keyed on the running total so far"
    answer: 2
    explanation: |
      "Has this appeared already?" is a pure membership question, solved by a hash SET:
      before inserting each element, check if it is already in the set. Complement lookup
      is for pair-sum problems; group-by-key is for bucketing; prefix-sum maps are for
      subarray-sum problems.
    ref: "concepts.md#the-hashing-technique-for-o1-lookups"

  - id: arrays-strings-hashing-011
    difficulty: advanced
    tags: [hashing, ordering, tradeoffs]
    question: |
      When should you prefer a balanced-BST-based map (TreeMap) over a hash map even though
      the hash map has faster average lookups?
    options:
      - "When you need sorted iteration order or range queries"
      - "When the keys are strings rather than fixed-width integers"
      - "When the dataset is very small and fits in a few buckets"
      - "When you want to minimize the map's memory footprint"
    answer: 0
    explanation: |
      Hash maps are unordered and support only point lookups. If you need keys in sorted
      order, floor/ceiling, or range queries (e.g. "all keys between a and b"), a balanced
      BST / TreeMap gives O(log n) ordered operations. The other options are not the
      deciding factor.
    ref: "concepts.md#the-hashing-technique-for-o1-lookups"

  - id: arrays-strings-hashing-012
    difficulty: advanced
    tags: [in-place, product-except-self, prefix-suffix]
    question: |
      Product of Array Except Self, without division and using only the output array for
      extra space, is solved by:
    options:
      - "Computing the total product and dividing out each element"
      - "A hash map of each value to its running cumulative product"
      - "Sorting the array first, then multiplying adjacent pairs"
      - "A prefix pass (product of all elements to the left) then a suffix pass (multiply in the product to the right)"
    answer: 3
    explanation: |
      One left-to-right pass fills res[i] with the product of everything before i; a second
      right-to-left pass multiplies in the running product of everything after i. Each
      element's result excludes itself, no division is used, and only the output array plus
      O(1) scalars are needed. Division fails when a zero is present.
    ref: "concepts.md#in-place-array-techniques"

  - id: arrays-strings-hashing-013
    difficulty: intermediate
    tags: [in-place, two-pointers]
    question: |
      To remove duplicates from a SORTED array in place, keeping the result compacted at
      the front, which in-place idiom applies?
    options:
      - "A single write pointer trailing a read pointer, copying only new values forward"
      - "A monotonic stack that pops smaller trailing values"
      - "Binary search to locate each element's first occurrence"
      - "A second array to collect uniques, then copy back"
    answer: 0
    explanation: |
      Because the array is sorted, duplicates are adjacent. A read pointer scans while a
      write pointer marks the next free slot; each time the read value differs from the
      last written value, write it. This compacts uniques to the front in O(n) time and
      O(1) extra space. A second array violates the in-place requirement.
    ref: "concepts.md#in-place-array-techniques"

  - id: arrays-strings-hashing-014
    difficulty: advanced
    tags: [in-place, space, encoding]
    question: |
      "First Missing Positive" must run in O(n) time and O(1) extra space. Which technique
      lets the input array itself act as the bookkeeping structure?
    options:
      - "A separate HashSet of seen numbers"
      - "Sorting the array first, then scanning for the first gap"
      - "Cyclic placement / using indices (and sign bits) as a hash set inside the array"
      - "A frequency array of size n indexed by each value"
    answer: 2
    explanation: |
      By placing each value v at index v-1 (cyclic sort) or by negating a[|v|-1] to mark
      "v is present", the array encodes membership without extra space. A separate HashSet
      or frequency array uses O(n) extra space, and sorting is O(n log n) — both miss the
      constraints.
    ref: "concepts.md#in-place-array-techniques"

  - id: arrays-strings-hashing-015
    difficulty: intermediate
    tags: [matrix, memory, cache]
    question: |
      In a row-major 2D array, why is iterating row-by-row faster in practice than
      column-by-column, despite both being O(rows*cols)?
    options:
      - "Row iteration lets the runtime skip per-element bounds checks"
      - "Row-adjacent elements are contiguous in memory, giving better cache locality"
      - "Column iteration recomputes the base address each step"
      - "Compilers refuse to apply loop optimizations to column scans"
    answer: 1
    explanation: |
      Row-major layout stores each row's elements contiguously (address = base + (r*cols +
      c)*size). Scanning along a row hits consecutive addresses on the same cache lines;
      scanning down a column jumps by a full row each step, causing cache misses. Same
      Big-O, very different constant factor.
    ref: "concepts.md#2d-arrays-and-matrices"

  - id: arrays-strings-hashing-016
    difficulty: beginner
    tags: [gotchas, overflow, binary-search]
    question: |
      Why is `mid = (lo + hi) / 2` considered buggy in fixed-width integer languages, and
      what is the safe form?
    options:
      - "It rounds toward zero incorrectly; use Math.round on the average"
      - "Integer division truncates the midpoint; use ceiling division instead"
      - "lo + hi can overflow the integer range; use lo + (hi - lo) / 2"
      - "It is off by one; use (lo + hi + 1) / 2"
    answer: 2
    explanation: |
      For large indices, lo + hi may exceed Integer.MAX_VALUE and overflow to a negative
      value in Java/C++, producing a wrong or out-of-bounds mid. lo + (hi - lo) / 2 keeps
      the intermediate within range. (Python's arbitrary-precision ints make this a
      Java/C++ concern specifically.)
    ref: "concepts.md#common-gotchas"

  - id: arrays-strings-hashing-017
    difficulty: intermediate
    tags: [gotchas, python, aliasing]
    question: |
      In Python, `grid = [[0] * n] * m` produces a subtle bug. What is it?
    options:
      - "It raises an IndexError whenever m exceeds n"
      - "It silently creates an m x m grid instead of an m x n one"
      - "It fills every cell with None instead of the integer 0"
      - "All m rows are the SAME inner list object, so mutating one row mutates all"
    answer: 3
    explanation: |
      The outer * m replicates the SAME inner-list reference m times, so grid[0] is
      grid[1] is grid[2]. Setting grid[0][0] = 5 changes every row. Use a comprehension —
      [[0] * n for _ in range(m)] — to allocate m distinct rows.
    ref: "concepts.md#common-gotchas"

  - id: arrays-strings-hashing-018
    difficulty: intermediate
    tags: [strings, char, java, gotchas]
    question: |
      In Java, what does the expression `'a' + 'b'` evaluate to?
    options:
      - "The string \"ab\", via implicit char-to-String concatenation"
      - "The char 'c', the next character after 'a' and 'b'"
      - "A compile error, since char operands cannot be added"
      - "The int 195 (char values promoted and added as integers)"
    answer: 3
    explanation: |
      A Java char is a 16-bit numeric primitive. In arithmetic, chars are promoted to int,
      so 'a' (97) + 'b' (98) = 195 (an int). To concatenate you need a String operand, e.g.
      "" + 'a' + 'b'. This char-vs-string confusion is a classic interview trap.
    ref: "concepts.md#strings-and-immutability"

  - id: arrays-strings-hashing-019
    difficulty: advanced
    tags: [hashing, prefix-sum, pattern-choice]
    question: |
      To count the number of contiguous subarrays whose sum equals k in O(n), which data
      structure/technique combination is correct?
    options:
      - "Sliding window that expands and shrinks two pointers around a running sum of k"
      - "A hash map of prefix-sum value -> count of occurrences"
      - "A monotonic stack that pops prefix sums larger than the target k"
      - "Sorting the prefix sums then binary searching"
    answer: 1
    explanation: |
      A subarray (i, j] sums to k iff prefix[j] - prefix[i] = k, i.e. prefix[i] =
      prefix[j] - k. Maintain a running prefix sum and a hash map counting how many times
      each prefix value has occurred; for each j add the count of (prefix - k). Sliding
      window fails here because negative numbers break its monotonicity assumption.
    ref: "concepts.md#the-hashing-technique-for-o1-lookups"

  - id: arrays-strings-hashing-020
    difficulty: advanced
    tags: [hashing, longest-consecutive, complexity]
    question: |
      Longest Consecutive Sequence can be solved in O(n) using a hash set. What makes it
      O(n) rather than O(n^2) despite the inner while-loop that walks a run?
    options:
      - "The hash set keeps its elements sorted internally, so each run walk is a bounded binary scan"
      - "A run is only started from a number x where x-1 is NOT in the set, so each element is visited by an inner walk at most once"
      - "The inner while-loop is capped at log n iterations because runs cannot exceed the set's height"
      - "Duplicate elements are removed up front, which halves the array and collapses the walk to O(n)"
    answer: 1
    explanation: |
      Put all numbers in a set. Only begin counting a streak at a value x whose predecessor
      x-1 is absent (a true sequence start). Each element is then consumed by exactly one
      forward walk across all runs, so the inner loops do O(n) total work — linear overall,
      not quadratic.
    ref: "concepts.md#the-hashing-technique-for-o1-lookups"
