topic: "Two Pointers, Sliding Window & Prefix Sum"
domain: dsa-coding
topic_slug: two-pointers-sliding-window
version: 1

questions:
  - id: two-pointers-sliding-window-001
    difficulty: beginner
    tags: [two-pointers, recognition, sorted-array]
    question: |
      You must find whether a **sorted** integer array contains two elements
      summing to a target, using O(1) extra space. Which technique fits best?
    options:
      - "Opposite-ends two pointers converging from both sides"
      - "Nested loops comparing every possible pair until a match"
      - "A hash set storing each element's required complement"
      - "Sort the array again, then binary search each element"
    answer: 0
    explanation: |
      Because the array is already sorted, place one pointer at each end. If the
      sum is too small move the left pointer right; if too big move the right
      pointer left. This is O(n) time and O(1) space. A hash set also works but
      uses O(n) space, and the array is already sorted so we exploit that.
    ref: "concepts.md#two-pointers-opposite-ends-converging"

  - id: two-pointers-sliding-window-002
    difficulty: intermediate
    tags: [two-pointers, correctness, invariant]
    question: |
      In the opposite-ends two-pointer scan for a target sum, when
      `a[lo] + a[hi] < target`, why is it safe to do `lo++` (discard `a[lo]`)?
    options:
      - "Because a[lo] paired with any element at or below a[hi] is also too small, and everything above a[hi] is already gone"
      - "Because a[lo] is the smallest remaining element and once seen can never contribute to any valid pair"
      - "Because a[hi] is the largest value and is guaranteed to belong to the final answer pair"
      - "Because the algorithm re-sorts the unscanned suffix on each iteration to restore order"
    answer: 0
    explanation: |
      a[hi] is the largest available partner for a[lo]. If even that pairing is
      below target, no remaining element can lift a[lo] to the target, so a[lo]
      can be permanently discarded. This monotone-elimination argument is what
      makes the scan O(n) and correct.
    ref: "concepts.md#two-pointers-opposite-ends-converging"

  - id: two-pointers-sliding-window-003
    difficulty: beginner
    tags: [two-pointers, in-place, same-direction]
    question: |
      "Remove duplicates from a sorted array in place" and "move all zeroes to
      the end" are classic examples of which variant?
    options:
      - "Fixed-size sliding window sliding a length-k range across the array"
      - "Prefix sum paired with a hashmap of previously seen running totals"
      - "Opposite-ends converging two pointers that meet in the middle"
      - "Same-direction two pointers (slow write / fast read)"
    answer: 3
    explanation: |
      A fast read pointer scans every element while a slow write pointer marks
      where the next kept element goes. This in-place compaction is O(n) time,
      O(1) space — distinct from a window, where both pointers delimit a range.
    ref: "concepts.md#two-pointers-same-direction-fast-and-slow"

  - id: two-pointers-sliding-window-004
    difficulty: intermediate
    tags: [3sum, complexity]
    question: |
      What is the time complexity of the standard sort + two-pointer solution to
      3Sum (all triplets summing to zero)?
    options:
      - "O(n) "
      - "O(n log n)"
      - "O(n^2)"
      - "O(n^3)"
    answer: 2
    explanation: |
      Sorting is a one-time O(n log n). Then for each anchor index i (O(n)) we
      run a linear two-pointer scan (O(n)), giving O(n^2) overall — which
      dominates the sort. This beats the O(n^3) triple-nested brute force.
    ref: "concepts.md#three-pointer-and-k-sum-3sum"

  - id: two-pointers-sliding-window-005
    difficulty: intermediate
    tags: [3sum, deduplication, gotcha]
    question: |
      In 3Sum, the trickiest correctness detail is avoiding duplicate triplets in
      the output. Without using an auxiliary hash set, how is this handled?
    options:
      - "By removing duplicates from the array before sorting"
      - "By only considering strictly increasing triplets"
      - "By skipping equal values at the anchor and after recording a matching pair"
      - "By skipping duplicate anchor values only, and trusting the inner two-pointer scan to never emit a repeated pair"
    answer: 2
    explanation: |
      After sorting, you skip an anchor if it equals the previous anchor, and
      after recording a hit you advance lo/hi past any equal neighbors. This
      guarantees each distinct triplet is emitted exactly once with O(1) extra
      space.
    ref: "concepts.md#three-pointer-and-k-sum-3sum"

  - id: two-pointers-sliding-window-006
    difficulty: beginner
    tags: [sliding-window, recognition]
    question: |
      Which problem phrasing most strongly signals a sliding-window approach?
    options:
      - "Find any pair of elements with a given difference in a sorted array"
      - "Find the longest CONTIGUOUS substring satisfying a property"
      - "Count the number of distinct elements in the whole array"
      - "Find the k-th largest element overall using a selection algorithm"
    answer: 1
    explanation: |
      "Longest/shortest/max/min contiguous subarray or substring with a property"
      is the sliding-window signal. Contiguity is the key trigger — if elements
      may be reordered, a window does not apply.
    ref: "concepts.md#sliding-window-variable-size"

  - id: two-pointers-sliding-window-007
    difficulty: intermediate
    tags: [sliding-window, complexity, amortized]
    question: |
      A variable-size sliding window has a `while` loop (shrink) nested inside a
      `for` loop (expand). Why is its overall time still O(n), not O(n^2)?
    options:
      - "Because the inner loop runs a constant number of times per outer step"
      - "Because the window size is bounded by a constant"
      - "Because left and right each advance at most n times total across the whole run (amortized)"
      - "Because the array is assumed to be sorted, capping the inner loop iterations"
    answer: 2
    explanation: |
      This is amortized analysis: `right` moves forward n times and `left` moves
      forward at most n times over the entire execution, regardless of how the
      steps interleave. Total pointer movement is O(n), so the scan is linear.
    ref: "concepts.md#sliding-window-variable-size"

  - id: two-pointers-sliding-window-008
    difficulty: intermediate
    tags: [sliding-window, minimum-window, template]
    question: |
      For "minimum window substring" (shortest window containing all required
      characters), what is the correct shrink strategy?
    options:
      - "Grow right while the window is invalid, then stop at the first valid window and return it"
      - "Only ever advance the right pointer and never contract the left side at all"
      - "Shrink left whenever the window becomes valid, then never grow again"
      - "Grow right until the window is valid, then shrink left as far as still-valid, recording the minimum"
    answer: 3
    explanation: |
      Minimum/shortest problems use "shrink while valid": expand right until the
      constraint is satisfied, then greedily contract left while the window stays
      valid, tracking the smallest valid window seen. (Longest problems instead
      shrink only while invalid.)
    ref: "concepts.md#sliding-window-variable-size"

  - id: two-pointers-sliding-window-009
    difficulty: intermediate
    tags: [sliding-window, char-replacement, invariant]
    question: |
      In "Longest Repeating Character Replacement" (replace at most k chars to
      make all window chars equal), when is a window of length L valid?
    options:
      - "When the window length L is itself no greater than the replacement budget k"
      - "When the number of distinct characters in the window is at most k"
      - "When L - (highest single-character frequency in the window) <= k"
      - "When every character in the window appears at least k times individually"
    answer: 2
    explanation: |
      The characters you'd need to replace equal the window length minus the most
      frequent character's count. If that is <= k, the window is achievable. So
      the validity test is `windowLen - maxFreq <= k`.
    ref: "concepts.md#sliding-window-fixed-size"

  - id: two-pointers-sliding-window-010
    difficulty: beginner
    tags: [sliding-window, fixed-size, complexity]
    question: |
      To compute the maximum sum of any k consecutive elements, the fixed-size
      window adds the entering element and subtracts the leaving element each
      slide. What does this achieve versus re-summing every window?
    options:
      - "Reduces O(n) to O(log n)"
      - "Reduces O(n*k) to O(n)"
      - "Reduces O(n^2) to O(n log n)"
      - "It has the same complexity but uses less memory"
    answer: 1
    explanation: |
      Re-summing each of the ~n windows costs O(k) each = O(n*k). Maintaining a
      running sum by adding the new element and dropping the old one makes each
      slide O(1), so the whole pass is O(n).
    ref: "concepts.md#sliding-window-fixed-size"

  - id: two-pointers-sliding-window-011
    difficulty: intermediate
    tags: [prefix-sum, range-query, complexity]
    question: |
      After building a prefix-sum array P (where P[i] = a[0]+...+a[i-1]) over a
      static array, what is the cost of answering a range-sum query for a[i..j]?
    options:
      - "O(1) via P[j+1] - P[i]"
      - "O(log n) via binary search"
      - "O(j - i) by re-adding the range"
      - "O(n) because P must be rebuilt each query"
    answer: 0
    explanation: |
      With prefix sums, sum(a[i..j]) = P[j+1] - P[i], a single subtraction — O(1)
      per query after the one-time O(n) build. This is only valid while the array
      is immutable; updates require a Fenwick/segment tree.
    ref: "concepts.md#prefix-sum-o1-range-queries"

  - id: two-pointers-sliding-window-012
    difficulty: advanced
    tags: [prefix-sum, hashmap, subarray-sum-k]
    question: |
      "Subarray Sum Equals K" must count subarrays summing to k in an array that
      may contain negative numbers. What is the standard O(n) approach?
    options:
      - "A variable-size sliding window that shrinks from the left whenever the running sum exceeds k"
      - "Sorting the array first and then sweeping it with opposite-ends two pointers"
      - "A prefix sum combined with a hashmap of how many times each running prefix has occurred"
      - "Binary search over the sorted prefix-sum array to locate each target"
    answer: 2
    explanation: |
      sum(i..j)=k means prefix[j+1]-prefix[i]=k, i.e. prefix[i]=prefix[j+1]-k. A
      hashmap counting each running prefix lets you add count[running-k] at each
      step. A sliding window fails here because negatives break sum monotonicity.
    ref: "concepts.md#prefix-sum-with-hashmap-subarray-sum-equals-k"

  - id: two-pointers-sliding-window-013
    difficulty: advanced
    tags: [prefix-sum, hashmap, seed, gotcha]
    question: |
      In the prefix-sum + hashmap solution to "subarray sum equals k", why must
      the map be seeded with `{0: 1}` before the scan?
    options:
      - "To count subarrays that start at index 0 (whose entire prefix equals k)"
      - "To avoid a division-by-zero error when normalizing the running prefix"
      - "To pre-reserve hashmap capacity so no costly rehashing happens mid-scan"
      - "To specially handle the edge case where the target value k happens to be zero"
    answer: 0
    explanation: |
      An empty prefix has sum 0 and occurs once. Seeding {0:1} lets a running
      prefix that equals k be counted as a valid subarray beginning at index 0.
      Omitting it undercounts every subarray anchored at the start.
    ref: "concepts.md#prefix-sum-with-hashmap-subarray-sum-equals-k"

  - id: two-pointers-sliding-window-014
    difficulty: advanced
    tags: [sliding-window, negatives, gotcha, pattern-choice]
    question: |
      Why does a sliding window NOT work for finding an exact-sum subarray when
      the array can contain negative numbers?
    options:
      - "Because negative values make the array impossible to sort consistently"
      - "Because expanding the window can decrease the sum, so 'shrink when the sum is too big' no longer restores validity"
      - "Because hashmaps are unable to store negative integers as valid keys"
      - "Because tracking negatives forces the window to consume O(n^2) space"
    answer: 1
    explanation: |
      Sliding window for sums relies on monotonicity: growing the window only
      increases the sum (all-positive values). With negatives, a longer window
      can have a smaller sum, so there is no consistent shrink/grow rule. Use
      prefix sum + hashmap instead.
    ref: "concepts.md#prefix-sum-with-hashmap-subarray-sum-equals-k"

  - id: two-pointers-sliding-window-015
    difficulty: advanced
    tags: [container-with-most-water, two-pointers, greedy-proof]
    question: |
      In "Container With Most Water", when the two walls have unequal height, why
      do you move the pointer at the SHORTER wall inward?
    options:
      - "Because moving the taller wall inward is what actually increases the enclosed area"
      - "Because the shorter wall is always the one located on the left-hand side"
      - "Because moving it keeps the two pointers equidistant from the array's midpoint"
      - "Because area is capped by the shorter wall, so moving the taller wall only shrinks width without raising the cap; only moving the shorter wall can improve the area"
    answer: 3
    explanation: |
      Area = min(height) * width. Moving the taller wall inward keeps the height
      capped by the shorter wall while reducing width, so it can never help.
      Moving the shorter wall is the only move that might raise the limiting
      height. This exchange argument justifies the O(n) two-pointer sweep.
    ref: "concepts.md#worked-example-trapping-rain-water-two-pointers"

  - id: two-pointers-sliding-window-016
    difficulty: advanced
    tags: [trapping-rain-water, two-pointers, space]
    question: |
      The two-pointer solution to Trapping Rain Water improves on the precomputed
      max-arrays approach in which way?
    options:
      - "It reduces the running time from a quadratic O(n^2) down to a linear O(n)"
      - "It reduces space from O(n) to O(1) while staying O(n) time"
      - "It removes the need to examine every bar, skipping over flat regions"
      - "It works correctly only when the bar heights are given in sorted order"
    answer: 1
    explanation: |
      Both approaches are O(n) time. Precomputing leftMax/rightMax arrays uses
      O(n) space; the two-pointer version tracks running leftMax/rightMax in
      scalars and advances whichever side has the smaller max, achieving O(1)
      extra space.
    ref: "concepts.md#worked-example-trapping-rain-water-two-pointers"

  - id: two-pointers-sliding-window-017
    difficulty: intermediate
    tags: [longest-unique-substring, sliding-window, hashmap]
    question: |
      In "Longest Substring Without Repeating Characters", when the current char
      was last seen at index p and p >= left, how should left be updated?
    options:
      - "left = left + 1"
      - "left = p"
      - "left = p + 1"
      - "left = 0"
    answer: 2
    explanation: |
      To exclude the earlier occurrence, jump left to just past it: left = p + 1.
      The guard p >= left avoids moving left backwards when the duplicate is
      already outside the current window. Window length is right - left + 1.
    ref: "concepts.md#sliding-window-variable-size"

  - id: two-pointers-sliding-window-018
    difficulty: intermediate
    tags: [prefix-sum, 2d, range-query]
    question: |
      With a 2D prefix-sum table P (where P[r][c] is the sum of the submatrix from
      the top-left corner to (r-1,c-1)), how many table lookups does one rectangle
      sum query require?
    options:
      - "1"
      - "2"
      - "4"
      - "It is proportional to the rectangle's area"
    answer: 2
    explanation: |
      By inclusion-exclusion, a rectangle sum is
      P[r2+1][c2+1] - P[r1][c2+1] - P[r2+1][c1] + P[r1][c1] — four lookups, O(1)
      per query after an O(m*n) build.
    ref: "concepts.md#prefix-sum-in-2d"

  - id: two-pointers-sliding-window-019
    difficulty: beginner
    tags: [valid-palindrome, two-pointers]
    question: |
      Checking whether a string is a palindrome with O(1) extra space is a natural
      fit for which pattern?
    options:
      - "Prefix sums of character codes compared between the string's two halves"
      - "A fixed-size sliding window of length n/2 slid across the string"
      - "Opposite-ends two pointers comparing s[lo] and s[hi] while converging"
      - "Fast/slow pointers locating a cycle at the string's midpoint"
    answer: 2
    explanation: |
      Compare characters from both ends moving inward; mismatch means not a
      palindrome. O(n) time, O(1) space. This is the symmetric-verification form
      of converging two pointers.
    ref: "concepts.md#two-pointers-opposite-ends-converging"

  - id: two-pointers-sliding-window-020
    difficulty: advanced
    tags: [k-sum, complexity, generalization]
    question: |
      Generalizing the sort + two-pointer idea, what is the time complexity of the
      standard k-Sum algorithm (find k elements summing to a target)?
    options:
      - "O(n log n)"
      - "O(n^(k-1))"
      - "O(n^k)"
      - "O(k * n)"
    answer: 1
    explanation: |
      k-Sum recurses by fixing one element and solving (k-1)-Sum on the rest, down
      to a 2-Sum two-pointer base case. Each of the k-2 outer loops adds a factor
      of n over the O(n^2) base, giving O(n^(k-1)).
    ref: "concepts.md#three-pointer-and-k-sum-3sum"

  - id: two-pointers-sliding-window-021
    difficulty: intermediate
    tags: [pattern-choice, hashmap, two-pointers]
    question: |
      You need to find a pair summing to a target in an UNSORTED array and O(n)
      time is required. Which is the best choice?
    options:
      - "Sort the array first, then run opposite-ends two pointers, accepting O(n log n)"
      - "Opposite-ends two pointers walked directly over the unsorted array as-is"
      - "A fixed-size sliding window summing k consecutive elements at each step"
      - "A single pass storing seen values in a hashmap and looking up each complement"
    answer: 3
    explanation: |
      Opposite-ends two pointers require sorted input, and sorting is O(n log n).
      For strictly O(n) on unsorted data, a hashmap of seen values with complement
      lookup is the right tool (the Two Sum I pattern).
    ref: "concepts.md#choosing-the-right-pattern"

  - id: two-pointers-sliding-window-022
    difficulty: intermediate
    tags: [prefix-sum, updates, pattern-choice]
    question: |
      A plain prefix-sum array gives O(1) range queries. What breaks this guarantee
      and what should you switch to?
    options:
      - "Very large arrays overflow the prefix cache; switch to a hashmap of chunked block sums"
      - "Element UPDATES between queries; switch to a Fenwick tree (BIT) or segment tree for O(log n) update and query"
      - "Negative numbers break the subtraction; switch to a shrink-when-too-big sliding window"
      - "Duplicate values corrupt the totals; switch to a set that stores each value once"
    answer: 1
    explanation: |
      A prefix-sum array assumes an immutable array — a single update forces an
      O(n) rebuild. When updates and queries interleave, a Fenwick/segment tree
      supports both in O(log n).
    ref: "concepts.md#prefix-sum-o1-range-queries"

  - id: two-pointers-sliding-window-023
    difficulty: advanced
    tags: [sliding-window-maximum, monotonic-deque, complexity]
    question: |
      "Sliding Window Maximum" (max of every fixed window of size k) is solved in
      O(n) using which auxiliary structure inside the window?
    options:
      - "A max-heap keyed by value, popping stale entries lazily on each slide"
      - "A monotonic decreasing deque of indices"
      - "A prefix-sum array queried for the maximum over each length-k range"
      - "A balanced BST torn down and rebuilt from scratch for every window"
    answer: 1
    explanation: |
      A monotonic deque holds candidate indices in decreasing value order; the
      front is always the current window max. Each index is pushed and popped at
      most once, giving amortized O(n). A heap would be O(n log k).
    ref: "concepts.md#sliding-window-fixed-size"
