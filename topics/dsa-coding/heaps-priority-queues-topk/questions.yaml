topic: "Heaps, Priority Queues & Top-K"
domain: dsa-coding
topic_slug: heaps-priority-queues-topk
version: 1
questions:
  - id: heaps-priority-queues-topk-001
    difficulty: beginner
    tags: [internals, array-layout]
    question: |
      A binary heap is stored in a 0-based array. For the element at index `i`, where are
      its two children?
    options:
      - "Indices `i-1` and `i+1`"
      - "Indices `2*i` and `2*i + 1`"
      - "Indices `2*i + 1` and `2*i + 2`"
      - "Indices `i/2` and `i/2 + 1`"
    answer: 2
    explanation: |
      With 0-based indexing, the left child of index `i` is `2*i + 1` and the right child is
      `2*i + 2`; the parent is `(i-1)/2`. (The `2*i` / `2*i + 1` form is the 1-based textbook
      convention.) No pointers are needed — the array position encodes the tree structure.
    ref: "concepts.md#the-internals-a-complete-binary-tree-stored-in-an-array"

  - id: heaps-priority-queues-topk-002
    difficulty: beginner
    tags: [internals, complexity, peek]
    question: |
      What is the time complexity of reading the minimum element of a min-heap (peek)?
    options:
      - "O(1)"
      - "O(log n)"
      - "O(n)"
      - "O(n log n)"
    answer: 0
    explanation: |
      The minimum of a min-heap is always at the root (index 0), so peek is O(1). Extracting
      it (removing and restoring the invariant) is O(log n), but merely reading it is constant.
    ref: "concepts.md#the-internals-a-complete-binary-tree-stored-in-an-array"

  - id: heaps-priority-queues-topk-003
    difficulty: beginner
    tags: [shape-property, complete-tree]
    question: |
      Why must a binary heap be a *complete* binary tree (every level full except possibly
      the last, filled left-to-right)?
    options:
      - "So that the elements automatically end up in fully sorted order from root to last leaf"
      - "So that searching for an arbitrary value can be done in O(log n) by following the order"
      - "So that duplicate values are automatically detected and rejected upon insertion"
      - "So it can be stored compactly in a gap-free array with index arithmetic for parent/child"
    answer: 3
    explanation: |
      Completeness guarantees the tree maps onto a contiguous array with no holes, letting
      parent/child links be computed by arithmetic instead of stored as pointers, and keeping
      the height at ⌊log₂ n⌋. It does not make the heap sorted, nor speed up arbitrary search.
    ref: "concepts.md#the-internals-a-complete-binary-tree-stored-in-an-array"

  - id: heaps-priority-queues-topk-004
    difficulty: intermediate
    tags: [sift-up, insert, complexity]
    question: |
      When you insert an element into a binary heap, what happens and what does it cost?
    options:
      - "It is appended at the end, then sifted up while smaller than its parent; O(log n)"
      - "It is placed at the root and every other element shifts down one level; O(n)"
      - "It is inserted in sorted position via binary search; O(log n) search + O(n) shift"
      - "It is appended at the end as a new leaf and needs no further reordering; O(1)"
    answer: 0
    explanation: |
      Insert appends the element at the next open leaf (preserving completeness) and then
      sifts it up, swapping with its parent while the heap order is violated. The number of
      swaps is bounded by the height, so it is O(log n).
    ref: "concepts.md#sift-up-bubble-up-on-insert--olog-n"

  - id: heaps-priority-queues-topk-005
    difficulty: intermediate
    tags: [sift-down, extract, complexity]
    question: |
      To extract-min from a min-heap you swap the root with the last element, remove it, and
      sift the new root down. During sift-down, which child do you swap with?
    options:
      - "The left child always"
      - "Whichever child is larger"
      - "Whichever child is smaller"
      - "Either child, it does not matter"
    answer: 2
    explanation: |
      In a min-heap you must swap the node down with the *smaller* of its two children;
      otherwise you could place a small value above a larger sibling and break the invariant.
      (In a max-heap you swap with the larger child.) It stops when both children are ≥ it.
    ref: "concepts.md#sift-down-bubble-down-on-extract--olog-n"

  - id: heaps-priority-queues-topk-006
    difficulty: advanced
    tags: [build-heap, complexity, floyd]
    question: |
      What is the time complexity of building a heap from an unordered array of n elements
      using bottom-up sift-down (Floyd's build-heap)?
    options:
      - "O(n)"
      - "O(n log n)"
      - "O(log n)"
      - "O(n²)"
    answer: 0
    explanation: |
      Bottom-up build-heap is O(n). Sift-down cost is proportional to a node's *height*, and
      most nodes are near the bottom (short). Summing heights, Σ n·h/2^(h+1), converges to a
      constant times n. Note: inserting n elements one at a time (sift-*up*) is O(n log n).
    ref: "concepts.md#build-heap-is-on-not-on-log-n"

  - id: heaps-priority-queues-topk-007
    difficulty: advanced
    tags: [build-heap, sift-up, contrast]
    question: |
      Building a heap by calling insert (sift-up) n times is O(n log n), but bottom-up
      sift-down build-heap is O(n). What explains the difference?
    options:
      - "Sift-up is inherently a slower per-swap operation than sift-down because it must re-read the parent each step"
      - "Sift-up cost scales with a node's depth (most nodes are deep); sift-down cost scales with height (most nodes are shallow)"
      - "Sift-up recomputes the array parent/child indices every time while sift-down caches them in a lookup table"
      - "The two methods produce structurally different heaps, one taller than the other, changing the operation count"
    answer: 1
    explanation: |
      Both operations are O(height/depth) per node. Sift-up work is bounded by a node's depth,
      and the majority of nodes live in the deep bottom levels — so summing gives O(n log n).
      Sift-down work is bounded by a node's height, and most nodes are short, so the sum
      converges to O(n).
    ref: "concepts.md#build-heap-is-on-not-on-log-n"

  - id: heaps-priority-queues-topk-008
    difficulty: intermediate
    tags: [heap-order, sorted, gotcha]
    question: |
      True statement about the ordering of elements within a valid heap?
    options:
      - "The backing array is fully sorted in ascending order from index 0 to the last element"
      - "Each level is internally sorted left to right, so a level-order scan is monotonically increasing"
      - "The left subtree of any node is always entirely smaller than that node's right subtree"
      - "Only the parent-≤-children (or parent-≥-children) relation holds; siblings are unordered"
    answer: 3
    explanation: |
      The heap-order property is *weak*: it constrains only each parent versus its own
      children. Siblings, cousins, and left-vs-right subtrees have no defined order. That is
      why the extreme element is O(1) but arbitrary search is O(n) and iteration is not sorted.
    ref: "concepts.md#the-internals-a-complete-binary-tree-stored-in-an-array"

  - id: heaps-priority-queues-topk-009
    difficulty: intermediate
    tags: [top-k, heap-direction, pattern]
    question: |
      To find the k *largest* elements of a stream of n numbers (k ≪ n) with a size-k heap,
      which heap do you keep?
    options:
      - "A max-heap of size k"
      - "A min-heap of size k"
      - "A min-heap of size n"
      - "A max-heap of size n"
    answer: 1
    explanation: |
      Keep a *min*-heap of size k. Its root is the smallest of the k elements you currently
      hold, so when a larger element arrives you pop the root (evict the smallest) in O(log k).
      At the end the heap holds the k largest and its root is the k-th largest.
    ref: "concepts.md#the-top-k-pattern-a-size-k-heap--on-log-k"

  - id: heaps-priority-queues-topk-010
    difficulty: intermediate
    tags: [top-k, complexity]
    question: |
      What is the time and space complexity of the size-k heap approach to "k-th largest of
      n elements"?
    options:
      - "O(n log n) time, O(n) space"
      - "O(n) time, O(k) space"
      - "O(n log k) time, O(k) space"
      - "O(k log n) time, O(n) space"
    answer: 2
    explanation: |
      The heap never exceeds size k, so each of the n push/pop operations is O(log k), giving
      O(n log k) time and O(k) space. This beats sorting (O(n log n)) when k ≪ n and works for
      streaming input where you cannot hold or re-scan all n elements.
    ref: "concepts.md#the-top-k-pattern-a-size-k-heap--on-log-k"

  - id: heaps-priority-queues-topk-011
    difficulty: advanced
    tags: [top-k, quickselect, contrast]
    question: |
      You must return the k-th largest element of an in-memory array once, and order does not
      matter. Which approach has the best *average* time?
    options:
      - "Sort the array, index k-th: O(n log n)"
      - "Quickselect (partition-based selection): O(n) average"
      - "Size-k min-heap: O(n log k)"
      - "Build a balanced BST: O(n log n)"
    answer: 1
    explanation: |
      Quickselect averages O(n) (worst case O(n²), mitigated by randomized/median-of-medians
      pivots) and is the fastest one-shot in-memory choice when you don't need ordering. The
      size-k heap is preferred instead for *streaming* data or maintaining a live top-k.
    ref: "concepts.md#the-top-k-pattern-a-size-k-heap--on-log-k"

  - id: heaps-priority-queues-topk-012
    difficulty: advanced
    tags: [two-heaps, median-stream, pattern]
    question: |
      For "find the median from a data stream," the two-heaps pattern keeps which structures?
    options:
      - "A max-heap for the lower half and a min-heap for the upper half"
      - "Two min-heaps, one for evens and one for odds"
      - "A min-heap for the lower half and a max-heap for the upper half"
      - "A single balanced heap sorted after each insert"
    answer: 0
    explanation: |
      A max-heap holds the smaller half (its top is the largest of the low half) and a
      min-heap holds the larger half (its top is the smallest of the high half). Kept balanced
      in size, the median is the top of the larger heap, or the average of both tops.
      addNum is O(log n), findMedian is O(1).
    ref: "concepts.md#two-heaps-pattern-running-median-of-a-stream"

  - id: heaps-priority-queues-topk-013
    difficulty: advanced
    tags: [k-way-merge, complexity, pattern]
    question: |
      Merging k sorted lists containing N elements total using a min-heap of list heads costs:
    options:
      - "O(N·k) time"
      - "O(N log N) time"
      - "O(N log k) time"
      - "O(k log N) time"
    answer: 2
    explanation: |
      The heap holds at most k elements (one head per list). Each of the N elements is pushed
      and popped once at O(log k), giving O(N log k) time and O(k) space. This beats pairwise
      merging (O(N·k)) and concatenate-then-sort (O(N log N)) for large N with moderate k.
    ref: "concepts.md#k-way-merge-with-a-heap"

  - id: heaps-priority-queues-topk-014
    difficulty: intermediate
    tags: [library, java, python, defaults]
    question: |
      Which statement about default priority-queue directions in standard libraries is correct?
    options:
      - "Java `PriorityQueue` defaults to a max-heap while C++ `std::priority_queue` defaults to a min-heap"
      - "All three (`PriorityQueue`, `std::priority_queue`, `heapq`) default to max-heaps out of the box"
      - "Python `heapq` provides a max-heap by default, using natural descending order on push"
      - "Java `PriorityQueue` is a min-heap; C++ `priority_queue` is a max-heap; Python `heapq` is min-only"
    answer: 3
    explanation: |
      Java's `PriorityQueue` defaults to a *min*-heap (natural ordering); C++ `std::priority_queue`
      defaults to a *max*-heap; Python's `heapq` is min-only (negate keys for a max-heap).
      Mixing up these defaults is a very common bug.
    ref: "concepts.md#priority-queue-the-adt-and-the-library-apis"

  - id: heaps-priority-queues-topk-015
    difficulty: intermediate
    tags: [python, heapq, max-heap]
    question: |
      Python's `heapq` only implements a min-heap. What is the standard trick to get max-heap
      behavior?
    options:
      - "Call `heapq.heapify(list, reverse=True)`"
      - "Push the negated values (`-x`) and negate again on pop"
      - "Use `heapq.heappop` twice to skip to the largest"
      - "Sort the list descending before every push"
    answer: 1
    explanation: |
      `heapq` has no reverse flag. The idiom is to store negated keys so the smallest negated
      value corresponds to the largest real value; negate again when you pop. Alternatively push
      `(-priority, item)` tuples.
    ref: "concepts.md#priority-queue-the-adt-and-the-library-apis"

  - id: heaps-priority-queues-topk-016
    difficulty: advanced
    tags: [search, gotcha, complexity]
    question: |
      What is the worst-case time to find (locate) an arbitrary value — not the root — inside
      a binary heap of n elements?
    options:
      - "O(1)"
      - "O(log n)"
      - "O(n)"
      - "O(n log n)"
    answer: 2
    explanation: |
      Because a heap is only weakly ordered (parent vs children), an arbitrary value can be
      anywhere; there is no ordering to guide a search, so locating it is O(n). This is why a
      plain binary heap cannot do O(log n) `decrease-key`/delete without an auxiliary index map.
    ref: "concepts.md#gotchas--interview-traps"

  - id: heaps-priority-queues-topk-017
    difficulty: intermediate
    tags: [heapsort, complexity, contrast]
    question: |
      Heapsort builds a heap and then repeatedly extracts the extreme element. Its overall
      time complexity is:
    options:
      - "O(n) overall, because the bottom-up build-heap step dominates the runtime"
      - "O(n log n) — O(n) build plus n extractions each O(log n)"
      - "O(n²) in the worst case, degrading like quicksort on an adversarial input"
      - "O(n log k) where k is the number of distinct values"
    answer: 1
    explanation: |
      Build-heap is O(n), but heapsort then performs n extract operations, each O(log n) for
      the sift-down, giving O(n log n) overall (worst case too — unlike quicksort's O(n²)). Do
      not confuse the O(n) build step with the full sort.
    ref: "concepts.md#build-heap-is-on-not-on-log-n"

  - id: heaps-priority-queues-topk-018
    difficulty: intermediate
    tags: [pattern-recognition, top-k]
    question: |
      A problem says: "Given an infinite stream of integers, at any time return the current
      k-th largest seen so far." Which technique fits best?
    options:
      - "Maintain a size-k min-heap, updating it as each number arrives"
      - "Re-sort the entire stream seen so far every time a query is made"
      - "Run quickselect over all elements accumulated so far on each individual query"
      - "Keep a hash set of all values and scan it whenever a query arrives"
    answer: 0
    explanation: |
      Streaming + "k-th largest at any time" is the classic size-k min-heap signal: keep only
      the k largest so far; the root is the answer, and each new element is O(log k). Sorting or
      quickselect would require re-processing all elements on every query.
    ref: "concepts.md#the-top-k-pattern-a-size-k-heap--on-log-k"

  - id: heaps-priority-queues-topk-019
    difficulty: advanced
    tags: [top-k-frequent, bucket-sort, optimization]
    question: |
      For "Top K Frequent Elements," after building the frequency map, what is the optimal
      (linear) way to extract the answer, better than the O(m log k) heap?
    options:
      - "Sort the m distinct elements by descending frequency and take the first k: O(m log m)"
      - "Bucket sort by frequency (index = count, values 1..n), then read from the top: O(n)"
      - "Binary search on a frequency threshold, re-counting qualifying elements each step: O(m log n)"
      - "Insert distinct elements into a balanced BST keyed by frequency and walk it: O(m log m)"
    answer: 1
    explanation: |
      Frequencies are bounded by n, so you can place each element in a bucket indexed by its
      count and scan buckets from highest to lowest, collecting k elements — O(n) time. The
      size-k heap (O(m log k)) is the common answer, but bucket sort is the optimal follow-up.
    ref: "concepts.md#the-top-k-pattern-a-size-k-heap--on-log-k"

  - id: heaps-priority-queues-topk-020
    difficulty: advanced
    tags: [python, tuple-comparison, gotcha]
    question: |
      In Python you push `(priority, item)` tuples into a `heapq`. Two items get the same
      priority and `item` is a custom object with no ordering. What happens, and what is the fix?
    options:
      - "Nothing special; heapq only ever inspects the first tuple field and ignores the rest entirely"
      - "It silently discards the item with the duplicate priority; the fix is to deduplicate through a set first"
      - "It falls back to comparing the objects by their `id()` memory address automatically, so no fix is required"
      - "It raises a TypeError comparing the items; fix by adding a unique increasing counter as a tiebreaker: `(priority, counter, item)`"
    answer: 3
    explanation: |
      On a priority tie, Python compares the next tuple field — the `item` — and raises
      TypeError if the object is not orderable. Insert a monotonically increasing counter
      between priority and item so ties are broken by insertion order and the items are never
      compared.
    ref: "concepts.md#priority-queue-the-adt-and-the-library-apis"

  - id: heaps-priority-queues-topk-021
    difficulty: beginner
    tags: [internals, parent-index]
    question: |
      In a 0-based heap array, what is the parent index of the node at index `i` (for i > 0)?
    options:
      - "`i / 2` (the 0-based left-child inverse)"
      - "`(i - 1) / 2` (integer division)"
      - "`2 * i - 1` (mirror of the child formula)"
      - "`i - 1` (the immediately preceding slot)"
    answer: 1
    explanation: |
      With 0-based indexing the parent of `i` is `(i - 1) / 2` using integer division —
      the inverse of the child formulas `2i+1` and `2i+2`. (`i/2` is the 1-based convention.)
    ref: "concepts.md#the-internals-a-complete-binary-tree-stored-in-an-array"

  - id: heaps-priority-queues-topk-022
    difficulty: intermediate
    tags: [pattern-recognition, greedy, scheduling]
    question: |
      Problems like Task Scheduler and Reorganize String repeatedly need "the item with the
      highest remaining count next." Which structure most naturally supports this?
    options:
      - "A max-heap keyed by remaining frequency"
      - "A stack, popping the most recently pushed item as the next to schedule"
      - "A hash set of remaining items, scanned linearly to locate the max each step"
      - "A min-heap keyed by each item's original insertion timestamp"
    answer: 0
    explanation: |
      These greedy scheduling problems repeatedly pick the most frequent remaining element,
      decrement it, and reinsert — exactly what a max-heap keyed by remaining count provides
      in O(log n) per step. (Task Scheduler also has a closed-form math solution.)
    ref: "concepts.md#priority-queue-the-adt-and-the-library-apis"
