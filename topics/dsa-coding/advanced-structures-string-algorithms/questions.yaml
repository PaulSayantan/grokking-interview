topic: "Advanced Structures & String Algorithms"
domain: dsa-coding
topic_slug: advanced-structures-string-algorithms
version: 1
questions:
  - id: advanced-structures-string-algorithms-001
    difficulty: intermediate
    tags: [fenwick, bit, internals]
    question: |
      In a 1-based Fenwick tree (Binary Indexed Tree), what range of the
      original array does `tree[i]` store the sum of?
    options:
      - "The single element a[i]"
      - "The elements a[i - (i & -i) + 1 .. i]"
      - "The elements a[1 .. i]"
      - "The elements a[i .. i + (i & -i)]"
    answer: 1
    explanation: |
      Each index `i` is responsible for a block whose length equals its lowest set bit
      `i & (-i)`. So `tree[i]` covers `a[i - lowbit(i) + 1 .. i]`. This is why a prefix sum
      walks down via `i -= i & (-i)` and an update walks up via `i += i & (-i)`.
    ref: "concepts.md#fenwick-tree-binary-indexed-tree-internals"

  - id: advanced-structures-string-algorithms-002
    difficulty: intermediate
    tags: [fenwick, complexity]
    question: |
      What is the time complexity of a point update and a prefix-sum query on a
      Fenwick tree of n elements?
    options:
      - "O(log n) for both"
      - "O(1) update, O(n) query"
      - "O(n) for both"
      - "O(sqrt n) for both"
    answer: 0
    explanation: |
      Both operations strip or add one bit per step (`i -= i & -i` for query, `i += i & -i`
      for update), so each touches at most log n indices. Space is O(n).
    ref: "concepts.md#fenwick-tree-binary-indexed-tree-internals"

  - id: advanced-structures-string-algorithms-003
    difficulty: advanced
    tags: [fenwick, segment-tree, invertibility]
    question: |
      Why can a plain Fenwick tree answer range-sum queries but NOT range-minimum
      queries with point updates?
    options:
      - "Because min is more expensive than addition to compute"
      - "Because a Fenwick tree only stores O(log n) values"
      - "Because prefix decomposition needs an inverse (sum(r) - sum(l-1)), and min has no inverse"
      - "Because min queries require the array to be sorted first"
    answer: 2
    explanation: |
      A Fenwick range query is computed as sum(r) - sum(l-1), which relies on subtraction —
      the inverse of addition. Min/max have no inverse, so you cannot 'subtract' one prefix
      min from another. Range min/max with updates needs a segment tree.
    ref: "concepts.md#fenwick-tree-binary-indexed-tree-internals"

  - id: advanced-structures-string-algorithms-004
    difficulty: beginner
    tags: [segment-tree, layout]
    question: |
      A common array-based segment tree over n elements is allocated with size roughly:
    options:
      - "n"
      - "2n exactly"
      - "4n"
      - "n log n"
    answer: 2
    explanation: |
      With the root at index 1 and children of x at 2x and 2x+1, the tree can be one level
      deeper than a perfect tree, so a size of 4n safely holds every node for any n.
    ref: "concepts.md#segment-tree-internals-and-lazy-propagation"

  - id: advanced-structures-string-algorithms-005
    difficulty: advanced
    tags: [segment-tree, lazy-propagation]
    question: |
      What problem does lazy propagation solve in a segment tree?
    options:
      - "It makes point queries O(1) instead of O(log n)"
      - "It removes the need for the 4n array"
      - "It converts the tree into a Fenwick tree automatically"
      - "It lets range updates run in O(log n) by deferring updates to children until needed"
    answer: 3
    explanation: |
      Without lazy propagation, updating a whole range means touching every leaf: O(n).
      Lazy propagation stores a pending marker on a fully-covered node and only pushes it
      down to children when a later query/update enters that subtree, keeping range updates
      at O(log n).
    ref: "concepts.md#segment-tree-internals-and-lazy-propagation"

  - id: advanced-structures-string-algorithms-006
    difficulty: intermediate
    tags: [segment-tree, fenwick, choice]
    question: |
      You need many range-SUM queries with only POINT updates and want the smallest,
      fastest code. Which structure is the best fit?
    options:
      - "Fenwick tree (Binary Indexed Tree)"
      - "Segment tree with lazy propagation"
      - "Balanced BST"
      - "Suffix array"
    answer: 0
    explanation: |
      For prefix/range sums with point updates, a Fenwick tree is the minimal-code,
      smallest-constant choice. Reach for a segment tree only when you need range min/max,
      custom merges, or range updates (lazy propagation).
    ref: "concepts.md#when-these-beat-a-hash-map-or-a-sort"

  - id: advanced-structures-string-algorithms-007
    difficulty: beginner
    tags: [bst, balance, complexity]
    question: |
      What is the worst-case time of search in an UNbalanced binary search tree built
      by inserting already-sorted data?
    options:
      - "O(log n)"
      - "O(n)"
      - "O(1)"
      - "O(n log n)"
    answer: 1
    explanation: |
      Inserting sorted data into a plain BST produces a degenerate linked-list shape with
      height n, so search is O(n). Self-balancing trees rotate to keep height O(log n).
    ref: "concepts.md#balanced-bsts-and-rotations"

  - id: advanced-structures-string-algorithms-008
    difficulty: intermediate
    tags: [bst, rotation]
    question: |
      What does a tree rotation preserve while it rebalances a BST?
    options:
      - "The exact heights of all subtrees"
      - "The colors of all nodes"
      - "The in-order (sorted) sequence of the nodes"
      - "The physical memory addresses of the nodes"
    answer: 2
    explanation: |
      A rotation is a local O(1) pointer rewiring that changes subtree heights but keeps the
      in-order traversal (the sorted order) identical, so the BST invariant still holds.
    ref: "concepts.md#balanced-bsts-and-rotations"

  - id: advanced-structures-string-algorithms-009
    difficulty: advanced
    tags: [avl, red-black, tradeoff]
    question: |
      Why do standard libraries (Java TreeMap, C++ std::map) use red-black trees rather
      than AVL trees?
    options:
      - "Red-black trees are always shorter than AVL trees"
      - "AVL trees cannot support ordered iteration"
      - "Red-black trees give O(1) lookups"
      - "Red-black trees do fewer rotations per insert/delete, favoring write-heavy workloads"
    answer: 3
    explanation: |
      AVL trees are more strictly balanced (faster lookups) but rebalance more aggressively.
      Red-black trees are looser, doing fewer rotations per mutation, which suits general
      write-heavy library use. Both give O(log n) operations.
    ref: "concepts.md#balanced-bsts-and-rotations"

  - id: advanced-structures-string-algorithms-010
    difficulty: intermediate
    tags: [bst, hashmap, choice]
    question: |
      You need floor/ceiling lookups and sorted range iteration over a changing set of
      keys. Which structure fits best?
    options:
      - "HashMap / HashSet"
      - "Fenwick tree"
      - "Balanced BST (e.g. TreeMap)"
      - "Trie"
    answer: 2
    explanation: |
      A hash map is O(1) average but unordered — it cannot do floor/ceiling or sorted
      iteration. A balanced BST (TreeMap) supports those ordered operations in O(log n).
    ref: "concepts.md#balanced-bsts-and-rotations"

  - id: advanced-structures-string-algorithms-011
    difficulty: intermediate
    tags: [kmp, lps, failure-function]
    question: |
      In KMP, what does lps[i] (the failure function) store for the pattern prefix
      ending at index i?
    options:
      - "The number of times the pattern occurs so far"
      - "The index of the next mismatch in the text"
      - "The hash of the substring pattern[0..i]"
      - "The length of the longest proper prefix that is also a suffix of pattern[0..i]"
    answer: 3
    explanation: |
      lps[i] is the length of the longest proper prefix of pattern[0..i] that is also a
      suffix (the longest border). On a mismatch it tells the pattern how far it can slide
      without re-checking already-matched text.
    ref: "concepts.md#kmp-and-the-failure-function"

  - id: advanced-structures-string-algorithms-012
    difficulty: intermediate
    tags: [kmp, complexity]
    question: |
      What is the overall time complexity of KMP substring search for text length n and
      pattern length m?
    options:
      - "O(n * m)"
      - "O(n + m)"
      - "O(n log m)"
      - "O(m^2)"
    answer: 1
    explanation: |
      Building the LPS array is O(m) and the scan is O(n); the text pointer never moves
      backward. Total O(n + m) time, O(m) space — versus naive O(n*m).
    ref: "concepts.md#kmp-and-the-failure-function"

  - id: advanced-structures-string-algorithms-013
    difficulty: advanced
    tags: [kmp, shortest-palindrome]
    question: |
      The Shortest Palindrome problem (prepend fewest chars to make s a palindrome) is
      classically solved by building the KMP failure array of which string?
    options:
      - "s alone"
      - "reverse(s) alone"
      - "s + '#' + reverse(s)"
      - "s + s"
    answer: 2
    explanation: |
      Building the LPS of s + '#' + reverse(s) finds the longest prefix of s that is also a
      palindrome. The separator '#' prevents overlap past the boundary. The remaining suffix
      (reversed) is what must be prepended.
    ref: "concepts.md#kmp-and-the-failure-function"

  - id: advanced-structures-string-algorithms-014
    difficulty: advanced
    tags: [rabin-karp, rolling-hash, complexity]
    question: |
      What is the WORST-case time complexity of Rabin-Karp substring search, and why?
    options:
      - "O(n + m) always, because the rolling hash is O(1) per shift"
      - "O(n log n), because of sorting the hashes"
      - "O(m^2), because of recomputing the pattern hash"
      - "O(n * m), because hash collisions can force a full comparison at every window"
    answer: 3
    explanation: |
      Rabin-Karp is O(n + m) on average, but if hashes collide (or an adversary picks a bad
      modulus) it must verify with a full character comparison at every position, degrading
      to O(n*m). A large prime modulus / double hashing makes this negligible in practice.
    ref: "concepts.md#rabin-karp-and-rolling-hash"

  - id: advanced-structures-string-algorithms-015
    difficulty: intermediate
    tags: [rabin-karp, rolling-hash]
    question: |
      What makes Rabin-Karp especially attractive compared to KMP?
    options:
      - "It naturally handles searching for many patterns at once and substring fingerprints"
      - "It has a better worst-case bound than KMP"
      - "It requires no preprocessing at all"
      - "It never needs a verification step"
    answer: 0
    explanation: |
      A rolling hash lets you compare many patterns' hashes cheaply, so Rabin-Karp shines
      for multi-pattern search and fingerprint problems (e.g. longest duplicate substring via
      binary search on length). KMP's worst case is strictly better (deterministic O(n+m)).
    ref: "concepts.md#rabin-karp-and-rolling-hash"

  - id: advanced-structures-string-algorithms-016
    difficulty: advanced
    tags: [z-algorithm, string]
    question: |
      What does z[i] represent in the Z-array of a string s?
    options:
      - "The length of the longest substring starting at i that matches a prefix of s"
      - "The number of distinct characters in s[0..i]"
      - "The position of the next occurrence of s[i]"
      - "The hash of the suffix starting at i"
    answer: 0
    explanation: |
      z[i] is the length of the longest substring beginning at position i that matches a
      prefix of s. Computed in O(n) via the 'Z-box' window. Running it on pattern+'#'+text
      finds matches where z[i] equals the pattern length.
    ref: "concepts.md#z-algorithm"

  - id: advanced-structures-string-algorithms-017
    difficulty: intermediate
    tags: [manacher, palindrome, complexity]
    question: |
      What is the time complexity of the naive 'expand around center' approach to longest
      palindromic substring, and of Manacher's algorithm?
    options:
      - "O(n) and O(n)"
      - "O(n^2) and O(n log n)"
      - "O(n^2) and O(n)"
      - "O(n^3) and O(n^2)"
    answer: 2
    explanation: |
      Expand-around-center tries 2n-1 centers, each expanding up to O(n), giving O(n^2).
      Manacher reuses mirror symmetry within the rightmost palindrome to achieve O(n).
    ref: "concepts.md#manacher-longest-palindromic-substring-in-on"

  - id: advanced-structures-string-algorithms-018
    difficulty: intermediate
    tags: [manacher, transform]
    question: |
      Why does Manacher's algorithm insert separator characters (like '#') between every
      character of the input?
    options:
      - "To make the string longer so hashing is easier"
      - "To remove duplicate characters"
      - "To handle even- and odd-length palindromes uniformly with a single center loop"
      - "To convert the problem into KMP"
    answer: 2
    explanation: |
      Interleaving separators turns every palindrome (even or odd length) into an
      odd-length one in the transformed string, so a single centered radius computation
      handles both cases without special-casing.
    ref: "concepts.md#manacher-longest-palindromic-substring-in-on"

  - id: advanced-structures-string-algorithms-019
    difficulty: advanced
    tags: [count-smaller, fenwick, pattern]
    question: |
      For 'Count of Smaller Numbers After Self', the Fenwick-tree approach iterates the
      array right-to-left. What does it do at each element?
    options:
      - "Adds the element's value to a running sum and reads the total"
      - "Sorts the remaining suffix and binary-searches it"
      - "Queries the prefix count of already-seen ranks smaller than the current rank, then marks the current rank seen"
      - "Pushes the element onto a monotonic stack"
    answer: 2
    explanation: |
      Using a frequency BIT over coordinate-compressed ranks: going right-to-left, the
      answer for nums[i] is sum(rank-1) — the count of already-seen (i.e. to the right)
      values that are strictly smaller — then you add 1 at rank(nums[i]). Total O(n log n).
    ref: "concepts.md#worked-example-count-of-smaller-numbers-after-self-with-a-bit"

  - id: advanced-structures-string-algorithms-020
    difficulty: intermediate
    tags: [sliding-window-maximum, monotonic-deque, choice]
    question: |
      For Sliding Window Maximum, which technique gives the optimal O(n) solution and
      typically beats a heap or a segment tree here?
    options:
      - "A monotonic (decreasing) deque"
      - "A min-heap of all elements"
      - "A Fenwick tree of prefix maxima"
      - "Sorting each window"
    answer: 0
    explanation: |
      A monotonic decreasing deque keeps candidate maxima, evicting smaller/expired indices,
      giving amortized O(n). A heap gives O(n log k) and a segment tree O(n log n) — both are
      overkill for a sliding window maximum.
    ref: "concepts.md#when-these-beat-a-hash-map-or-a-sort"

  - id: advanced-structures-string-algorithms-021
    difficulty: beginner
    tags: [choice, range-query, immutable]
    question: |
      The values in an array NEVER change and you only need range sums. What is the
      simplest sufficient tool?
    options:
      - "A precomputed prefix-sum array"
      - "A segment tree with lazy propagation"
      - "A Fenwick tree"
      - "A balanced BST"
    answer: 0
    explanation: |
      With no updates, a plain prefix-sum array answers any range sum in O(1) after O(n)
      build. Fenwick/segment trees only earn their O(log n) cost when updates interleave
      with queries. Always pick the cheapest tool that fits.
    ref: "concepts.md#when-these-beat-a-hash-map-or-a-sort"

  - id: advanced-structures-string-algorithms-022
    difficulty: advanced
    tags: [suffix-array, suffix-automaton]
    question: |
      For answering MANY substring queries against one large fixed text, which family of
      structures is designed for that job?
    options:
      - "Fenwick trees"
      - "Union-Find"
      - "Monotonic stacks"
      - "Suffix arrays / suffix automata (and suffix trees)"
    answer: 3
    explanation: |
      Suffix arrays (with LCP), suffix trees, and suffix automata index all substrings of a
      fixed text, enabling substring search, distinct-substring counts, and longest-common-
      substring queries. They are the specialized tool when a hash map or single scan is not
      enough.
    ref: "concepts.md#suffix-arrays-and-suffix-automata"

  - id: advanced-structures-string-algorithms-023
    difficulty: intermediate
    tags: [fenwick, lowbit, bit-trick]
    question: |
      In a Fenwick tree, how do you isolate the lowest set bit of index i (the 'lowbit')?
    options:
      - "i & (i - 1)"
      - "i & (-i)"
      - "i | (i + 1)"
      - "i ^ (i >> 1)"
    answer: 1
    explanation: |
      `i & (-i)` isolates the lowest set bit (two's-complement negation flips bits above the
      lowest set bit and leaves it set). That value is the length of the block tree[i] owns,
      and drives both the update (i += i&-i) and query (i -= i&-i) walks.
    ref: "concepts.md#fenwick-tree-binary-indexed-tree-internals"

  - id: advanced-structures-string-algorithms-024
    difficulty: advanced
    tags: [segment-tree, lazy-propagation, gotcha]
    question: |
      On a segment tree with lazy propagation, what bug appears if you forget to
      'push down' a node's pending lazy value before recursing into its children?
    options:
      - "The tree silently rebalances itself"
      - "The query becomes O(n)"
      - "The 4n array overflows"
      - "Children return stale aggregates because the pending update was never applied to them"
    answer: 3
    explanation: |
      A pending lazy value on a parent means its children have not yet received that update.
      If you recurse without pushing down first, the children report stale (pre-update)
      aggregates, producing wrong answers. Always push_down before descending.
    ref: "concepts.md#segment-tree-internals-and-lazy-propagation"

  - id: advanced-structures-string-algorithms-025
    difficulty: intermediate
    tags: [strstr, kmp, pattern]
    question: |
      Implement strStr() (find first occurrence of a pattern) is the canonical drill for
      which algorithm when linear time is required?
    options:
      - "Dijkstra's algorithm"
      - "Union-Find"
      - "Topological sort"
      - "KMP (or equivalently Z-algorithm / Rabin-Karp)"
    answer: 3
    explanation: |
      strStr is exact substring matching. KMP gives deterministic O(n+m); the Z-algorithm
      and Rabin-Karp are alternative linear/near-linear approaches. Naive scanning is O(n*m).
    ref: "concepts.md#kmp-and-the-failure-function"
