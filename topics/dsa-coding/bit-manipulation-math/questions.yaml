topic: "Bit Manipulation & Math"
domain: dsa-coding
topic_slug: bit-manipulation-math
version: 1
questions:
  - id: bit-manipulation-math-001
    difficulty: beginner
    tags: [xor, single-number, properties]
    question: |
      An array contains every integer twice except one, which appears once.
      Which single technique finds the unique element in O(n) time and O(1)
      extra space?
    options:
      - "XOR all elements together"
      - "Sort the array and scan for the unpaired element"
      - "Insert into a hash set, removing on the second sighting"
      - "Sum with a Gauss formula and subtract"
    answer: 0
    explanation: |
      XOR is self-inverse: a ^ a = 0 and a ^ 0 = a. XOR-ing every element
      cancels the duplicated pairs and leaves the unique value. Sorting is
      O(n log n) and a hash set is O(n) space; XOR is O(n) time, O(1) space.
    ref: "concepts.md#xor-properties-and-their-tricks"

  - id: bit-manipulation-math-002
    difficulty: beginner
    tags: [masks, set-bit, single-bit]
    question: |
      Which expression sets (turns on) the i-th bit of an integer x, leaving
      all other bits unchanged?
    options:
      - "x & (1 << i)"
      - "x ^ (1 << i)"
      - "x | (1 << i)"
      - "x & ~(1 << i)"
    answer: 2
    explanation: |
      OR-ing with a one-hot mask 1<<i forces bit i to 1 and leaves the rest
      alone. x ^ (1<<i) TOGGLES bit i, x & ~(1<<i) CLEARS it, and x & (1<<i)
      only tests it.
    ref: "concepts.md#single-bit-operations-check-set-clear-toggle"

  - id: bit-manipulation-math-003
    difficulty: intermediate
    tags: [n-and-n-1, power-of-two, tricks]
    question: |
      What does the expression `n & (n - 1)` compute for a positive integer n?
    options:
      - "It isolates the lowest set bit of n"
      - "It clears (removes) the lowest set bit of n"
      - "It counts the number of set bits in n"
      - "It negates n in two's complement"
    answer: 1
    explanation: |
      Subtracting 1 flips the lowest set bit to 0 and all trailing zeros to 1;
      ANDing with n wipes that entire low run, clearing the lowest set bit.
      Isolating (not clearing) the lowest set bit is `n & -n`.
    ref: "concepts.md#the-two-workhorse-identities-nn-1-and-n-n"

  - id: bit-manipulation-math-004
    difficulty: intermediate
    tags: [power-of-two, masks]
    question: |
      Which test correctly identifies whether an integer n is a power of two?
    options:
      - "(n & (n - 1)) == 0"
      - "(n & -n) == n && n != 0"
      - "n > 0 && (n & (n - 1)) == 0"
      - "n % 2 == 0"
    answer: 2
    explanation: |
      A power of two has exactly one set bit, so n & (n-1) == 0. But you must
      guard n > 0: for n == 0 the expression is also 0 (0 is not a power of
      two), and negatives can slip through in two's complement. n % 2 == 0 only
      tests evenness. (n & -n) == n is true for any single-bit value but still
      needs the n > 0 guard.
    ref: "concepts.md#the-two-workhorse-identities-nn-1-and-n-n"

  - id: bit-manipulation-math-005
    difficulty: intermediate
    tags: [lowest-set-bit, n-and-minus-n]
    question: |
      What does `n & -n` return for n = 12 (binary 1100)?
    options:
      - "8"
      - "0"
      - "4"
      - "12"
    answer: 2
    explanation: |
      `n & -n` isolates the VALUE of the lowest set bit. For 1100 the lowest
      set bit is at position 2, value 4. This identity is the core of Fenwick
      trees. Clearing that bit (n & (n-1)) would instead give 8 (1000).
    ref: "concepts.md#the-two-workhorse-identities-nn-1-and-n-n"

  - id: bit-manipulation-math-006
    difficulty: intermediate
    tags: [popcount, kernighan, complexity]
    question: |
      Brian Kernighan's algorithm counts set bits by repeatedly doing
      `n &= n - 1`. What is its time complexity for a w-bit integer with k set
      bits?
    options:
      - "O(k), the number of set bits"
      - "O(w) always"
      - "O(log w)"
      - "O(k log k)"
    answer: 0
    explanation: |
      Each iteration removes exactly one set bit, so the loop runs k times.
      This beats the naive O(w) shift-and-test loop when bits are sparse
      (k << w). Hardware POPCNT / Integer.bitCount is effectively O(1).
    ref: "concepts.md#the-two-workhorse-identities-nn-1-and-n-n"

  - id: bit-manipulation-math-007
    difficulty: advanced
    tags: [single-number-ii, xor, limits]
    question: |
      Why can't the plain "XOR everything" trick solve Single Number II, where
      every element appears three times except one?
    options:
      - "XOR is too slow for large arrays"
      - "XOR is not associative, so grouping changes the result"
      - "Three identical values do not cancel under XOR (a^a^a = a, not 0)"
      - "XOR overflows for values larger than 2^31"
    answer: 2
    explanation: |
      XOR cancels PAIRS (a^a = 0), but a triple leaves a^a^a = a. You need to
      count each bit position modulo 3 (or a ones/twos state machine) so that
      bits appearing three times reset to zero. XOR is associative and does not
      overflow.
    ref: "concepts.md#xor-properties-and-their-tricks"

  - id: bit-manipulation-math-008
    difficulty: advanced
    tags: [single-number-iii, partition, lowest-set-bit]
    question: |
      In Single Number III, two elements are unique and the rest are paired.
      After XOR-ing everything to get x = p ^ q, what is the purpose of
      computing d = x & -x?
    options:
      - "It picks a bit position where p and q differ, to partition the array into two groups"
      - "It gives the sum p + q directly"
      - "It counts how many elements are unique"
      - "It converts x from signed to unsigned"
    answer: 0
    explanation: |
      x = p ^ q has 1s exactly where p and q differ. d = x & -x isolates one
      such differing bit. Partitioning the array by that bit sends p and q into
      separate groups, and XOR-ing each group (pairs cancel) recovers p and q.
    ref: "concepts.md#xor-properties-and-their-tricks"

  - id: bit-manipulation-math-009
    difficulty: intermediate
    tags: [counting-bits, dp, recurrence]
    question: |
      Counting Bits asks for the popcount of every i in 0..n. Which O(n)
      recurrence is correct?
    options:
      - "bits[i] = bits[i >> 1] + (i & 1)"
      - "bits[i] = bits[i - 1] + 1"
      - "bits[i] = bits[i / 2] * 2"
      - "bits[i] = bits[i] + bits[i - 1]"
    answer: 0
    explanation: |
      i has the same set bits as i >> 1 (i divided by two drops the last bit),
      plus its own least-significant bit (i & 1). This fills the whole array in
      O(n), beating the O(n log n) of counting each number independently.
    ref: "concepts.md#counting-bits-and-the-dp-recurrence"

  - id: bit-manipulation-math-010
    difficulty: intermediate
    tags: [subsets, bitmask, enumeration]
    question: |
      To enumerate all subsets of a set of n elements using a bitmask, how many
      masks do you iterate over, and how do you test if element i is present?
    options:
      - "n masks; test i % 2"
      - "n^2 masks; test mask / i"
      - "n! masks; test mask ^ i"
      - "2^n masks; test mask & (1 << i)"
    answer: 3
    explanation: |
      Each of the n elements is independently in or out, giving 2^n subsets,
      one per integer in [0, 2^n). Element i is present iff bit i is set:
      mask & (1 << i) != 0. This is the basis of bitmask DP for small n.
    ref: "concepts.md#iterating-subsets-with-bitmasks"

  - id: bit-manipulation-math-011
    difficulty: advanced
    tags: [submask-enumeration, complexity, bitmask-dp]
    question: |
      Iterating every submask of every mask via `sub = (sub - 1) & m` over all
      masks of n bits has what total time complexity?
    options:
      - "O(3^n)"
      - "O(2^n)"
      - "O(n * 2^n)"
      - "O(4^n)"
    answer: 0
    explanation: |
      Each of the n bits is independently absent, present-in-m-only, or present
      in both m and its submask — three states — giving 3^n total submask
      pairs. This is the classic bound behind subset-sum-over-subsets DP.
    ref: "concepts.md#iterating-subsets-with-bitmasks"

  - id: bit-manipulation-math-012
    difficulty: intermediate
    tags: [sum-of-two-integers, adder, xor-carry]
    question: |
      When adding two integers using only bitwise operations, what do `a ^ b`
      and `(a & b) << 1` represent?
    options:
      - "The product and the remainder"
      - "The quotient and the divisor"
      - "The sum-without-carry and the carry"
      - "The high word and the low word"
    answer: 2
    explanation: |
      XOR adds bits without propagating carry (0+1=1, 1+1=0). AND detects the
      positions that generate a carry, shifted left by one to move into the next
      column. You loop, feeding the carry back, until the carry is zero.
    ref: "concepts.md#sum-of-two-integers-without-addition-full-adder"

  - id: bit-manipulation-math-013
    difficulty: beginner
    tags: [gcd, euclid, complexity]
    question: |
      Euclid's algorithm computes gcd(a, b) via gcd(b, a mod b). What is its
      time complexity?
    options:
      - "O(min(a, b))"
      - "O(log(min(a, b)))"
      - "O(sqrt(a))"
      - "O(a mod b)"
    answer: 1
    explanation: |
      Each two iterations at least halve the larger argument (a consequence of
      the Fibonacci worst case), so the number of divisions is
      O(log(min(a, b))). It is far faster than the O(min(a,b)) of subtractive
      GCD.
    ref: "concepts.md#gcd-euclid-and-lcm"

  - id: bit-manipulation-math-014
    difficulty: intermediate
    tags: [lcm, overflow, order-of-operations]
    question: |
      Why is lcm(a, b) usually written as `a / gcd(a, b) * b` rather than
      `a * b / gcd(a, b)`?
    options:
      - "It produces a different, more accurate result"
      - "gcd is undefined when multiplied first"
      - "It changes the complexity from O(n) to O(log n)"
      - "Dividing first keeps the intermediate value smaller, reducing overflow risk"
    answer: 3
    explanation: |
      a is divisible by gcd(a, b), so a / gcd is exact and smaller than a * b.
      Computing a * b first can overflow a fixed-width int/long even when the
      true LCM fits. Dividing before multiplying keeps intermediates small.
    ref: "concepts.md#gcd-euclid-and-lcm"

  - id: bit-manipulation-math-015
    difficulty: advanced
    tags: [modular-arithmetic, overflow, casting]
    question: |
      In Java, to compute `(a * b) % m` correctly for 32-bit ints a and b near
      Integer.MAX_VALUE, what must you do?
    options:
      - "Cast to long BEFORE the multiply: ((long) a * b) % m"
      - "Nothing; int arithmetic handles it"
      - "Cast the RESULT to long after multiplying: (long)(a * b) % m"
      - "Use Math.floorMod on the two ints"
    answer: 0
    explanation: |
      a * b overflows a 32-bit int well before the modulo runs, and casting the
      already-wrapped result to long preserves the wrong value. Cast an operand
      to long first so the multiply happens in 64-bit: ((long) a * b) % m.
    ref: "concepts.md#modular-arithmetic-and-overflow"

  - id: bit-manipulation-math-016
    difficulty: advanced
    tags: [modular-inverse, division, fermat]
    question: |
      How do you compute a "division" like (a / b) mod m when m is prime?
    options:
      - "Just use integer division then take mod"
      - "Take (a mod m) / (b mod m)"
      - "Division under a modulus is impossible"
      - "Multiply a by the modular inverse of b, which is b^(m-2) mod m"
    answer: 3
    explanation: |
      Real division does not commute with mod. By Fermat's little theorem, for
      prime m the modular inverse of b is b^(m-2) mod m (computed with fast
      modular exponentiation), so a / b becomes a * b^(m-2) mod m.
    ref: "concepts.md#modular-arithmetic-and-overflow"

  - id: bit-manipulation-math-017
    difficulty: intermediate
    tags: [fast-exponentiation, pow, complexity]
    question: |
      Binary (fast) exponentiation computes x^n using how many multiplications?
    options:
      - "O(log n)"
      - "O(n)"
      - "O(sqrt(n))"
      - "O(n log n)"
    answer: 0
    explanation: |
      By squaring the base and multiplying into the result only on set bits of
      n, you process one bit of n per step — about log2(n) squarings — giving
      O(log n) multiplications. Naive repeated multiplication is O(n).
    ref: "concepts.md#fast-binary-exponentiation"

  - id: bit-manipulation-math-018
    difficulty: advanced
    tags: [pow, overflow, edge-case]
    question: |
      In Pow(x, n), why is n = Integer.MIN_VALUE a special trap when n is
      negative?
    options:
      - "x^n is always zero there"
      - "The loop never terminates for negative n"
      - "Fast exponentiation only works for even n"
      - "Negating Integer.MIN_VALUE overflows (there is no positive counterpart), so widen to long before negating"
    answer: 3
    explanation: |
      For negative n you typically compute 1 / x^(-n), but -Integer.MIN_VALUE
      overflows back to Integer.MIN_VALUE because two's complement has one extra
      negative value. Widen n to long before negating to handle it safely.
    ref: "concepts.md#fast-binary-exponentiation"

  - id: bit-manipulation-math-019
    difficulty: intermediate
    tags: [sieve, primes, complexity]
    question: |
      The Sieve of Eratosthenes finds all primes up to n. What is its time
      complexity and why does the inner marking loop start at p*p?
    options:
      - "O(n^2); it starts at p*p to save memory"
      - "O(n log n); starting at p*p is arbitrary"
      - "O(sqrt(n)); it only checks up to the square root"
      - "O(n log log n); smaller multiples of p already have a smaller prime factor and were marked"
    answer: 3
    explanation: |
      The harmonic-over-primes sum gives O(n log log n). Any multiple of p below
      p*p (like 2p, 3p, ... (p-1)p) has a smaller prime factor and was already
      crossed off by that smaller prime, so marking can start at p*p.
    ref: "concepts.md#sieve-of-eratosthenes"

  - id: bit-manipulation-math-020
    difficulty: intermediate
    tags: [sqrt, newton, binary-search]
    question: |
      To compute floor(sqrt(n)) without a math library, which two approaches
      both work in O(log n) without floating point?
    options:
      - "Linear scan and Newton's method"
      - "Only the built-in Math.sqrt"
      - "Newton's iteration x = (x + n/x)/2, and binary search for the largest x with x*x <= n"
      - "Bubble sort and prefix sums"
    answer: 2
    explanation: |
      Newton's (Babylonian) iteration converges quadratically to sqrt(n), and
      binary-searching the monotonic predicate x*x <= n on [0, n] is O(log n).
      Both avoid floating point if you use integer/long arithmetic; a linear
      scan is O(sqrt n), not O(log n).
    ref: "concepts.md#newtons-method-for-integer-sqrt"

  - id: bit-manipulation-math-021
    difficulty: advanced
    tags: [bitwise-and-range, common-prefix]
    question: |
      "Bitwise AND of Numbers in a Range [L, R]" equals which of the following?
    options:
      - "L & R"
      - "Always 0"
      - "L | R"
      - "The common binary prefix of L and R (shift both right until equal, then shift back)"
    answer: 3
    explanation: |
      Any bit that changes somewhere in [L, R] becomes 0 in the AND. Low-order
      bits flip as you count up, so only the high bits shared by L and R survive
      — their common binary prefix. Shift both right until L == R, then shift
      the value back left by the count.
    ref: "concepts.md#worked-example-bitwise-and-of-numbers-in-a-range"

  - id: bit-manipulation-math-022
    difficulty: advanced
    tags: [twos-complement, shifts, java]
    question: |
      In Java, what is the difference between the `>>` and `>>>` right-shift
      operators?
    options:
      - "`>>` sign-extends (arithmetic); `>>>` fills with zeros (logical/unsigned)"
      - "There is no difference"
      - "`>>` is faster but less accurate"
      - "`>>>` works only on longs"
    answer: 0
    explanation: |
      `>>` replicates the sign bit, so -8 >> 1 == -4. `>>>` shifts in zeros,
      treating the value as unsigned, so -1 >>> 28 == 15. Python has no `>>>`
      because its ints are arbitrary-precision, not fixed-width two's complement.
    ref: "concepts.md#integer-representation-and-twos-complement"

  - id: bit-manipulation-math-023
    difficulty: advanced
    tags: [twos-complement, edge-case, overflow]
    question: |
      Why does `Math.abs(Integer.MIN_VALUE)` return a negative number in Java?
    options:
      - "It is a JVM bug"
      - "abs always returns the input unchanged for min values"
      - "Integer.MIN_VALUE has no positive counterpart in 32-bit two's complement, so negating it overflows back to itself"
      - "Integer.MIN_VALUE is actually positive"
    answer: 2
    explanation: |
      Two's complement has one extra negative value: the range is
      [-2^31, 2^31 - 1]. There is no +2^31, so negating Integer.MIN_VALUE wraps
      around to Integer.MIN_VALUE itself, and abs returns that negative value.
    ref: "concepts.md#integer-representation-and-twos-complement"

  - id: bit-manipulation-math-024
    difficulty: intermediate
    tags: [shifts, mask-building, gotcha]
    question: |
      To build a bit mask with the k-th bit set where k can be up to 40, why
      must you write `1L << k` rather than `1 << k` in Java?
    options:
      - "1L is faster than 1"
      - "`1 << k` is computed as a 32-bit int and overflows for k >= 31; 1L forces 64-bit long arithmetic"
      - "Shifts do not work on int at all"
      - "1L << k rounds k down to 31 automatically"
    answer: 1
    explanation: |
      The literal 1 is an int, so 1 << k is done in 32 bits and the shift count
      is taken mod 32 — meaningless for k >= 31/32. 1L is a long literal, so the
      shift happens in 64 bits with the count mod 64, giving the intended mask.
    ref: "concepts.md#integer-representation-and-twos-complement"

  - id: bit-manipulation-math-025
    difficulty: beginner
    tags: [recognition, when-to-use, patterns]
    question: |
      A problem says n <= 20 and asks you to try "every subset of the items."
      Which technique does this strongly signal?
    options:
      - "Two-pointer sliding window"
      - "Union-Find"
      - "Binary search on the answer"
      - "Bitmask enumeration / bitmask DP (represent the chosen set as an n-bit integer)"
    answer: 3
    explanation: |
      Small n (about <= 20) combined with "subsets" or "which items are chosen"
      is the classic signal for a bitmask: each subset is one integer in
      [0, 2^n), and dp[mask] tracks state over the chosen set. Larger n makes
      2^n infeasible.
    ref: "concepts.md#when-bit-tricks-actually-matter"

  - id: bit-manipulation-math-026
    difficulty: intermediate
    tags: [not-operator, twos-complement, identity]
    question: |
      In two's complement, the bitwise NOT `~x` is equal to which expression?
    options:
      - "-x"
      - "-x - 1"
      - "x - 1"
      - "-x + 1"
    answer: 1
    explanation: |
      Since -x == ~x + 1 (negation is invert-and-add-one), rearranging gives
      ~x == -x - 1. For example ~0 == -1 and ~5 == -6. This identity is handy
      when reasoning about masks built from negation.
    ref: "concepts.md#integer-representation-and-twos-complement"
