topic: "Union-Find (Disjoint Set Union)"
domain: dsa-coding
topic_slug: union-find-dsu
version: 1
questions:
  - id: union-find-dsu-001
    difficulty: beginner
    tags: [internals, parent-array, memory-layout]
    question: |
      At the lowest level, how does a Union-Find (DSU) structure typically store the
      sets it maintains?
    options:
      - "A single parent array where parent[i] points toward the root of i's set"
      - "A hash map from each element to a set object holding all members"
      - "One doubly linked list per set, spliced together on union"
      - "A balanced BST keyed by each set's representative, rebalanced on union"
    answer: 0
    explanation: |
      DSU represents each set as a rooted tree and the whole collection as a forest,
      encoded in one flat int[] where parent[i] is i's parent (and parent[i] == i marks a
      root). This is contiguous, cache-friendly, and O(n) space — no node objects or
      per-set collections needed.
    ref: "concepts.md#the-structure-parent-array-as-a-forest"

  - id: union-find-dsu-002
    difficulty: beginner
    tags: [internals, root, representative]
    question: |
      How do you determine whether two elements a and b belong to the same set in DSU?
    options:
      - "Check whether find(a) == find(b) (their roots are equal)"
      - "Check whether parent[a] == parent[b] (their immediate parents match)"
      - "Check whether a and b are adjacent in the parent array"
      - "Compare the stored ranks of a and b and treat equal ranks as same set"
    answer: 0
    explanation: |
      Two elements are in the same set iff they share the same root, so you compare
      find(a) with find(b). Comparing immediate parents is wrong — a and b can share a
      root through longer chains without sharing a direct parent.
    ref: "concepts.md#find-locating-the-representative"

  - id: union-find-dsu-003
    difficulty: beginner
    tags: [initialization, complexity]
    question: |
      When a DSU over n elements is initialized so every element is its own singleton
      set, what is parent[i] set to, and what is the initialization cost?
    options:
      - "parent[i] = -1 for all i; O(1)"
      - "parent[i] = 0 for all i; O(n)"
      - "parent[i] = i for all i; O(n)"
      - "parent[i] = i+1 for all i; O(log n)"
    answer: 2
    explanation: |
      Each element starts as its own root, so parent[i] = i. Filling the array is O(n)
      time and O(n) space. Pointing everything at 0 would incorrectly place all elements
      in one set.
    ref: "concepts.md#initialization"

  - id: union-find-dsu-004
    difficulty: intermediate
    tags: [path-compression, find, optimization]
    question: |
      What does path compression do during a find(x) call?
    options:
      - "It re-points nodes along the path from x to the root directly at the root"
      - "It deletes x from its set to speed up later queries"
      - "It rebalances the entire forest into a single flat tree"
      - "It swaps x with the root so x becomes the new representative"
    answer: 0
    explanation: |
      Path compression flattens the tree: as find walks to the root, it makes the nodes on
      that path point straight at the root, so subsequent find calls on them are O(1). It
      does not delete elements or change which node is the root.
    ref: "concepts.md#optimization-1-path-compression"

  - id: union-find-dsu-005
    difficulty: intermediate
    tags: [union-by-rank, union-by-size, optimization]
    question: |
      In "union by rank," when merging two trees with roots ra and rb, how do you decide
      the attachment?
    options:
      - "Always attach ra under rb regardless of rank, then reset both ranks to zero"
      - "Attach the higher-rank root under the lower-rank root to balance heights"
      - "Attach the lower-rank root under the higher-rank root; on a tie, pick one root and increment its rank"
      - "Attach whichever root has the smaller index under the other"
    answer: 2
    explanation: |
      Union by rank attaches the shorter tree under the taller one (lower rank under
      higher rank), which avoids growing height. Only when ranks are equal does the
      resulting tree get one level taller, so you bump the surviving root's rank by 1.
    ref: "concepts.md#optimization-2-union-by-rank--union-by-size"

  - id: union-find-dsu-006
    difficulty: advanced
    tags: [complexity, inverse-ackermann, amortized]
    question: |
      With BOTH path compression and union by rank/size, what is the amortized time per
      operation for a sequence of m operations on n elements?
    options:
      - "O(log n) amortized, since compression alone caps tree height at log n"
      - "O(1) strict worst case per operation, guaranteed by the balanced forest"
      - "O(α(n)) amortized, where α is the inverse Ackermann function (~constant)"
      - "O(log* n) amortized, the iterated-logarithm bound from path halving alone"
    answer: 2
    explanation: |
      Tarjan's analysis gives O(m·α(n)) total, i.e. O(α(n)) amortized per operation, where
      α(n) ≤ ~4 for any realistic n. It is effectively constant but NOT a strict worst-case
      O(1) — a single early find can still be O(log n) before compression settles.
    ref: "concepts.md#why-its-nearly-o1-the-inverse-ackermann-bound"

  - id: union-find-dsu-007
    difficulty: intermediate
    tags: [complexity, degenerate, naive]
    question: |
      Without any optimizations (naive union that always attaches one root under the
      other), what is the worst-case time of a single find?
    options:
      - "O(1)"
      - "O(log n)"
      - "O(n)"
      - "O(n log n)"
    answer: 2
    explanation: |
      Naive union can build a degenerate tree that is essentially a linked list of height
      n, so find must walk O(n) pointers in the worst case. Union by rank/size or path
      compression is what bounds this to O(log n) (or O(α(n)) with both).
    ref: "concepts.md#find-locating-the-representative"

  - id: union-find-dsu-008
    difficulty: intermediate
    tags: [complexity, single-optimization]
    question: |
      If you use path compression but keep a naive union (no rank/size), what amortized
      time per operation do you get?
    options:
      - "O(1)"
      - "O(log n)"
      - "O(α(n))"
      - "O(n)"
    answer: 1
    explanation: |
      Either optimization used alone yields O(log n) amortized. You need BOTH path
      compression and union by rank/size together to reach the near-constant O(α(n))
      bound.
    ref: "concepts.md#why-its-nearly-o1-the-inverse-ackermann-bound"

  - id: union-find-dsu-009
    difficulty: intermediate
    tags: [pattern-choice, cycle-detection, undirected]
    question: |
      You are adding undirected edges one at a time and want to detect the first edge that
      creates a cycle. How does DSU signal a cycle when processing edge (u, v)?
    options:
      - "When find(u) and find(v) return different roots"
      - "When the rank of u exceeds the rank of v"
      - "When union increments the component counter"
      - "When find(u) == find(v) already, before the union"
    answer: 3
    explanation: |
      If u and v are already in the same set (find(u) == find(v)) before you union them,
      the new edge connects two already-connected nodes and therefore closes a cycle. This
      is the core of Redundant Connection and Graph Valid Tree.
    ref: "concepts.md#worked-example-cycle-detection--component-count"

  - id: union-find-dsu-010
    difficulty: intermediate
    tags: [pattern-choice, dsu-vs-bfs, dynamic-connectivity]
    question: |
      Which scenario most strongly favors DSU over a single BFS/DFS pass?
    options:
      - "Answering many 'are u and v connected?' queries interleaved with edges being added over time"
      - "Finding the shortest path between two nodes in an unweighted graph"
      - "Labeling connected components once in a fully known static graph"
      - "Detecting a cycle in a directed graph with back-edges into the recursion stack"
    answer: 0
    explanation: |
      DSU excels at dynamic/incremental connectivity: each union is ~O(1) and connectivity
      queries between updates are ~O(1) with no re-traversal. BFS/DFS is better for
      shortest paths, static one-shot labeling, and directed-cycle detection (DSU handles
      undirected cycles).
    ref: "concepts.md#dsu-vs-bfsdfs-for-connectivity"

  - id: union-find-dsu-011
    difficulty: advanced
    tags: [limitations, deletion, splitting]
    question: |
      Which operation is fundamentally NOT supported by a plain DSU?
    options:
      - "Merging two sets by attaching one root under the other"
      - "Testing whether two elements are in the same set via their roots"
      - "Counting the number of disjoint sets with a maintained counter"
      - "Deleting an edge / splitting a set back apart"
    answer: 3
    explanation: |
      DSU only merges; it has no efficient un-union or set-split. Problems that remove
      connections are usually solved offline in reverse (turn deletions into unions from
      the final state backwards) or with a fully dynamic structure like link-cut trees.
    ref: "concepts.md#dsu-vs-bfsdfs-for-connectivity"

  - id: union-find-dsu-012
    difficulty: intermediate
    tags: [component-count, counter]
    question: |
      What is the cheapest correct way to keep the current number of connected components
      as you process unions?
    options:
      - "Initialize count = n and decrement it only when a union actually merges two different sets"
      - "Re-run find on every element after each union and count distinct roots — O(n) each time"
      - "Increment count on every union call regardless of whether roots differed"
      - "Count is always equal to the number of edges processed so far in the input"
    answer: 0
    explanation: |
      Start with n singleton sets and decrement the counter each time a union unites two
      different roots (a real merge). Unions where the roots are already equal must NOT
      decrement. This gives O(1) component-count queries. Recomputing roots each time would
      be O(n) per query.
    ref: "concepts.md#operation-complexity-summary"

  - id: union-find-dsu-013
    difficulty: advanced
    tags: [path-compression, rank, invariant]
    question: |
      After path compression flattens paths, why is it still valid to NOT recompute the
      stored rank values?
    options:
      - "Because rank is only ever used as a tie-breaker and is otherwise ignored"
      - "Because path compression is only applied when ranks are equal"
      - "Because ranks are recomputed lazily on the next union anyway"
      - "Because rank is an upper bound on height; compression only lowers real height, so ranks stay valid bounds"
    answer: 3
    explanation: |
      Rank is maintained as an upper bound on a tree's height, not its exact height. Path
      compression can only make trees shorter, so the stored rank remains a valid (if now
      loose) upper bound — no recomputation is needed, and the combined O(α(n)) analysis
      still holds.
    ref: "concepts.md#optimization-1-path-compression"

  - id: union-find-dsu-014
    difficulty: beginner
    tags: [pattern-choice, grid, mapping]
    question: |
      To run DSU over an m×n grid of cells (e.g. Number of Islands), how are 2D cells
      commonly mapped to the flat parent array?
    options:
      - "Use a separate hash map per row that maps column index to element id"
      - "Store the (r, c) pair directly as the array index"
      - "Sort cells by value and use each cell's sorted rank as its parent-array id"
      - "Encode each cell (r, c) as the integer id r * numCols + c"
    answer: 3
    explanation: |
      DSU's backing array is indexed by dense integers, so 2D coordinates are flattened
      with id = r * numCols + c (row-major). This keeps parent[] a simple int[] while
      still letting you union adjacent land cells.
    ref: "concepts.md#initialization"

  - id: union-find-dsu-015
    difficulty: advanced
    tags: [pattern-choice, equivalence, equations]
    question: |
      For "Satisfiability of Equality Equations" (process a==b and a!=b constraints), what
      is the correct DSU strategy?
    options:
      - "Union every pair regardless of == or != and check for cycles"
      - "First process '!=' pairs by unioning them, then check the '==' pairs"
      - "Use DSU to build a directed graph and run topological sort"
      - "First union all '==' pairs, then verify no '!=' pair has its two variables in the same set"
    answer: 3
    explanation: |
      Equality is an equivalence relation, so union all '==' constraints into equivalence
      classes first. Then each '!=' constraint must connect two DIFFERENT classes; if any
      '!=' pair shares a root, the equations are contradictory. Order matters — union all
      equalities before checking inequalities.
    ref: "concepts.md#when-to-reach-for-dsu--recognition-signals"

  - id: union-find-dsu-016
    difficulty: advanced
    tags: [most-stones-removed, union-by-size, counting]
    question: |
      In "Most Stones Removed with Same Row or Column," you union stones that share a row
      or column. How is the answer computed from the resulting DSU?
    options:
      - "Number of stones minus the number of connected components"
      - "Number of connected components minus one"
      - "The size of the largest connected component"
      - "The total number of successful union calls minus the number of components"
    answer: 0
    explanation: |
      Within any connected component of k stones, you can remove k-1 of them (leaving one).
      Summed over all components, total removable = (total stones) − (number of components).
      So the answer is n − components.
    ref: "concepts.md#when-to-reach-for-dsu--recognition-signals"

  - id: union-find-dsu-017
    difficulty: intermediate
    tags: [graph-valid-tree, edges, cycle]
    question: |
      Using DSU to decide if an undirected graph on n nodes is a valid tree, which pair of
      conditions is sufficient?
    options:
      - "Exactly n edges and no cycle detected during any of the unions"
      - "No cycle detected during unions AND the final component count is 1"
      - "At least n-1 edges AND every node has degree >= 1"
      - "The largest component has size n and a root rank of exactly 0"
    answer: 1
    explanation: |
      A tree is connected and acyclic. With DSU: reject if any edge unites two
      already-connected nodes (that's a cycle), and after processing require exactly one
      component (connected). Equivalently, n-1 edges plus no cycle. Both the acyclic and
      connected checks are needed.
    ref: "concepts.md#worked-example-cycle-detection--component-count"

  - id: union-find-dsu-018
    difficulty: advanced
    tags: [find, iterative, path-halving]
    question: |
      Why might you prefer an iterative find with path halving (parent[x] =
      parent[parent[x]]) over the recursive full-compression find in production?
    options:
      - "Path halving gives strictly better asymptotic complexity than full compression"
      - "It removes the need for a rank array by encoding heights implicitly in the halving step"
      - "It makes union run in guaranteed O(1) worst case even before compression settles"
      - "It avoids deep recursion / stack-overflow on large degenerate inputs while keeping near-constant amortized cost"
    answer: 3
    explanation: |
      Path halving is a tight iterative loop that grabs most of compression's benefit and,
      combined with union by rank/size, still yields the O(α(n)) amortized bound — while
      avoiding the recursion depth that can overflow the stack on huge near-linear trees
      built before compression settles. It does not change asymptotics or eliminate rank.
    ref: "concepts.md#optimization-1-path-compression"

  - id: union-find-dsu-019
    difficulty: intermediate
    tags: [kruskal, mst, application]
    question: |
      How does Kruskal's minimum spanning tree algorithm use DSU?
    options:
      - "It unions every pair of vertices up front, then repeatedly removes the heaviest edges until only n-1 remain"
      - "It sorts edges by weight and unions an edge's endpoints only if they are in different sets, skipping cycle-forming edges"
      - "It uses find to compute the shortest paths between all pairs of vertices, then discards the longest ones"
      - "It maintains a min-heap of vertices and unions the two closest vertices together at each step"
    answer: 1
    explanation: |
      Kruskal sorts edges ascending by weight and greedily adds each edge whose endpoints
      are in different components (union succeeds), skipping any edge that would form a
      cycle (endpoints already connected). It stops after n-1 edges. DSU provides the fast
      connectivity test.
    ref: "concepts.md#when-to-reach-for-dsu--recognition-signals"

  - id: union-find-dsu-020
    difficulty: advanced
    tags: [union-by-rank, union-by-size, tradeoff]
    question: |
      Union by rank and union by size both keep trees shallow. Why might union by SIZE be
      preferred in many interview problems?
    options:
      - "Union by size gives asymptotically better complexity than union by rank"
      - "Union by size lets you directly answer queries about the number of nodes in a component"
      - "Union by size avoids calling find and merges elements directly by their raw index"
      - "Union by size is the only variant compatible with path compression"
    answer: 1
    explanation: |
      Both variants give the same O(log n) height bound (and O(α(n)) with compression). The
      practical edge of tracking size is that problems frequently ask for component sizes
      (e.g. largest component, k-1 removable stones), which size gives for free. Rank is a
      smaller counter but carries no direct member-count meaning.
    ref: "concepts.md#optimization-2-union-by-rank--union-by-size"

  - id: union-find-dsu-021
    difficulty: beginner
    tags: [gotcha, union, roots]
    question: |
      A candidate writes union(a, b) as `parent[b] = a`. What is the bug?
    options:
      - "It should be written as parent[a] = b so the node attaches in the correct direction"
      - "It links the raw elements instead of their roots; it must link roots via parent[find(b)] = find(a)"
      - "It forgets to increment the rank array, which only degrades complexity and not correctness"
      - "There is no bug; assigning parent[b] = a is the standard textbook union operation"
    answer: 1
    explanation: |
      Union must operate on ROOTS, not arbitrary elements. Setting parent[b] = a ignores
      that a and b may sit deep in other trees and corrupts the forest. The correct form
      finds both roots first: ra = find(a), rb = find(b), then parent[rb] = ra (with
      rank/size deciding direction).
    ref: "concepts.md#optimization-2-union-by-rank--union-by-size"

  - id: union-find-dsu-022
    difficulty: advanced
    tags: [directed, cycle-detection, limitation]
    question: |
      Why is plain DSU not directly suitable for detecting a cycle in a DIRECTED graph?
    options:
      - "DSU can only ever store a fixed n elements and overflows once directed edges add extra back-links"
      - "DSU tracks undirected connectivity and ignores edge direction, so it can't distinguish a directed cycle from a shared ancestor"
      - "DSU's find operation runs too slowly on directed graphs because edge orientation forces a full rescan"
      - "DSU requires every edge in the graph to carry an explicit numeric weight, which directed lists omit"
    answer: 1
    explanation: |
      DSU only knows 'are these in the same set,' which is inherently undirected. A
      directed cycle depends on edge orientation (a back-edge into the recursion stack),
      which DSU discards. Directed cycle detection uses DFS coloring or Kahn's topological
      sort instead. (Redundant Connection II combines DSU with in-degree analysis for the
      directed case.)
    ref: "concepts.md#dsu-vs-bfsdfs-for-connectivity"

  - id: union-find-dsu-023
    difficulty: intermediate
    tags: [accounts-merge, grouping, application]
    question: |
      In "Accounts Merge," you union accounts that share at least one email. What is the
      role of DSU in the solution?
    options:
      - "It sorts the emails alphabetically within each account before any accounts are merged together"
      - "It detects cycles among the email-sharing links and rejects any account list that forms one"
      - "It groups accounts into connected components so all emails belonging to the same person end up under one representative"
      - "It computes the shortest chain of shared emails connecting two accounts owned by one person"
    answer: 2
    explanation: |
      Two accounts sharing any email belong to the same person; sharing is transitive, so
      it's an equivalence relation. DSU unions accounts (via shared emails) into components,
      after which you collect and sort each component's emails. Sorting and cycle detection
      are not the point of the DSU here.
    ref: "concepts.md#when-to-reach-for-dsu--recognition-signals"

  - id: union-find-dsu-024
    difficulty: beginner
    tags: [space, complexity, memory]
    question: |
      What is the space complexity of a DSU over n elements using a parent array plus a
      rank (or size) array?
    options:
      - "O(1)"
      - "O(log n)"
      - "O(n)"
      - "O(n^2)"
    answer: 2
    explanation: |
      DSU stores two int arrays of length n (parent and rank/size), so total space is O(n).
      There are no per-set objects or adjacency structures.
    ref: "concepts.md#operation-complexity-summary"
