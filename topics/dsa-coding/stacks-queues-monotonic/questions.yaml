topic: "Stacks, Queues & Monotonic Stack"
domain: dsa-coding
topic_slug: stacks-queues-monotonic
version: 1
questions:
  - id: stacks-queues-monotonic-001
    difficulty: beginner
    tags: [stack, lifo, complexity]
    question: |
      What is the time complexity of push and pop on a stack backed by a
      dynamic (growable) array, and why?
    options:
      - "O(1) amortized, because occasional resize doubling averages out"
      - "O(n) each, because the whole array is shifted on every push"
      - "O(log n) each, because of binary search into the array"
      - "O(1) worst case always, since resizes never copy data"
    answer: 0
    explanation: |
      Append/remove-last touch only the end. Resizing (doubling capacity) is an
      occasional O(n) event, but geometric growth makes the total cost of n pushes
      O(n), i.e. O(1) amortized. It is not O(1) *worst case* on an array because a
      single push that triggers a resize is O(n).
    ref: "concepts.md#stack-internals-lifo"

  - id: stacks-queues-monotonic-002
    difficulty: beginner
    tags: [queue, fifo, anti-pattern, complexity]
    question: |
      Why is implementing a queue with a Python list using list.pop(0) to
      dequeue considered a bug in interviews?
    options:
      - "pop(0) raises an IndexError when the list exceeds capacity"
      - "pop(0) shifts every remaining element left, making dequeue O(n)"
      - "pop(0) removes from the tail, silently breaking FIFO order"
      - "pop(0) is O(log n) because the list rebalances an internal tree"
    answer: 1
    explanation: |
      Removing the first element of an array-backed list forces every later element
      to shift down one slot — O(n) per dequeue, so a processing loop becomes O(n²).
      Use collections.deque and popleft() (O(1)).
    ref: "concepts.md#queue-internals-fifo"

  - id: stacks-queues-monotonic-003
    difficulty: intermediate
    tags: [queue, circular-buffer, internals]
    question: |
      How does a circular-buffer (ring-buffer) queue achieve O(1) dequeue
      without ever shifting elements?
    options:
      - "It advances a head index modulo capacity so no element moves"
      - "It sorts the buffer on each read so the front stays at index 0"
      - "It copies the backing array into a new buffer on each dequeue"
      - "It uses a hash map keyed by position to look up each value"
    answer: 0
    explanation: |
      A ring buffer keeps head and tail indices that wrap around with modulo
      arithmetic (head = (head + 1) % cap). Dequeue just reads at head and advances
      it; no data is moved, so it is O(1). This is how ArrayDeque works internally.
    ref: "concepts.md#queue-internals-fifo"

  - id: stacks-queues-monotonic-004
    difficulty: intermediate
    tags: [java, stack, arraydeque, best-practice]
    question: |
      In modern Java, which is the recommended type for a stack, and why not
      java.util.Stack?
    options:
      - "ArrayDeque, because Stack is a synchronized Vector subclass that leaks the List API"
      - "java.util.Stack, because it is the purpose-built and JVM-optimized stack class"
      - "LinkedList, because its node-per-element design gives O(1) push with no resizing"
      - "PriorityQueue, because it maintains insertion ordering automatically for you"
    answer: 0
    explanation: |
      java.util.Stack extends Vector: it is synchronized (slower) and exposes the
      full List API (indexed access into the middle), violating the abstraction.
      ArrayDeque is an unsynchronized growable circular array — the recommended
      stack/queue implementation and faster than LinkedList (no per-node allocation).
    ref: "concepts.md#stack-internals-lifo"

  - id: stacks-queues-monotonic-005
    difficulty: beginner
    tags: [stack, patterns, use-cases]
    question: |
      Which problem shape is the classic signal to reach for a stack?
    options:
      - "Finding the k-th largest element in a stream"
      - "Finding the shortest path in an unweighted graph"
      - "Maintaining a running median of a numeric stream"
      - "Matching/validating nested parentheses or brackets"
    answer: 3
    explanation: |
      Balanced-symbol matching is the canonical stack use: push each opener, and on a
      closer check it matches the top. The most-recent-opener-first (LIFO) semantics
      map exactly onto nesting. Shortest path in an unweighted graph is BFS (a queue).
    ref: "concepts.md#stack-internals-lifo"

  - id: stacks-queues-monotonic-006
    difficulty: intermediate
    tags: [min-stack, auxiliary-stack, design]
    question: |
      How does a Min-Stack support getMin in O(1) alongside push/pop/top?
    options:
      - "It keeps a parallel stack of running minimums, pushed/popped in lockstep"
      - "It re-sorts the entire stack after each push to expose the min"
      - "It linearly scans the entire stack on each getMin to find the min"
      - "It stores all values in a balanced BST that yields the min in O(1)"
    answer: 0
    explanation: |
      The auxiliary-stack pattern: alongside the value stack, maintain a second stack
      where each push stores min(x, currentMin). getMin reads its top in O(1); pop
      pops both. All operations are O(1) time, O(n) extra space. A BST would give
      O(log n) min, not O(1).
    ref: "concepts.md#min-stack-auxiliary-stack-pattern"

  - id: stacks-queues-monotonic-007
    difficulty: advanced
    tags: [two-stacks-queue, amortized-analysis, design]
    question: |
      For a queue implemented with two stacks (an 'in' stack and an 'out' stack),
      what is the complexity of dequeue and why?
    options:
      - "O(n) worst case and O(n) amortized — it is fundamentally slow"
      - "O(1) worst case, since popping from either stack is always O(1)"
      - "O(log n) amortized, owing to the in-to-out transfer step"
      - "Amortized O(1): each element is moved from in to out at most once"
    answer: 3
    explanation: |
      A single dequeue can be O(n) when it pours the whole 'in' stack into 'out', but
      each element is pushed to 'in' once and transferred to 'out' at most once. Over
      n dequeues the total work is O(n), so it is amortized O(1) — a classic aggregate
      analysis.
    ref: "concepts.md#two-stacks-as-a-queue-and-vice-versa"

  - id: stacks-queues-monotonic-008
    difficulty: intermediate
    tags: [monotonic-stack, next-greater, pattern-recognition]
    question: |
      A problem asks: for each element, find the next element to its right that is
      strictly greater. Which technique gives O(n)?
    options:
      - "A max-heap built over all the elements"
      - "A monotonic (decreasing) stack of indices"
      - "Binary search applied after sorting"
      - "A fixed-size sliding window scan"
    answer: 1
    explanation: |
      Next-greater-element is the flagship monotonic-stack problem. Keep a stack of
      indices with decreasing values; when the current element exceeds the value at the
      top, pop and record the current as that index's next-greater. Each element is
      pushed and popped once → O(n).
    ref: "concepts.md#monotonic-stack-pattern"

  - id: stacks-queues-monotonic-009
    difficulty: advanced
    tags: [monotonic-stack, complexity, amortized]
    question: |
      Why is a monotonic-stack solution O(n) even though it contains an inner
      while-loop that can pop many elements at once?
    options:
      - "Because the inner loop runs at most log n times per element"
      - "Because the stack provably never exceeds a size of two elements"
      - "Because the outer loop itself runs in only O(log n) time"
      - "Because each element is pushed once and popped at most once over the whole run"
    answer: 3
    explanation: |
      The inner while may pop several elements in one iteration, but across the entire
      algorithm every element is pushed exactly once and popped at most once. Total
      push/pop operations are bounded by 2n, so the whole thing is O(n) — an amortized
      argument, not a per-iteration one.
    ref: "concepts.md#monotonic-stack-pattern"

  - id: stacks-queues-monotonic-010
    difficulty: advanced
    tags: [monotonic-stack, histogram, largest-rectangle]
    question: |
      In 'Largest Rectangle in Histogram', what does the monotonic stack hold and
      what triggers area computation?
    options:
      - "Bar heights kept sorted in descending order; area is computed only when the array finally ends"
      - "Bar indices in arbitrary order; area is recomputed eagerly on every push operation"
      - "Bar indices with increasing heights; area computed when a shorter bar arrives and taller bars are popped"
      - "Prefix sums of the heights; area is then computed with a binary search over them"
    answer: 2
    explanation: |
      Keep an increasing stack of bar indices. When a shorter bar arrives, pop each
      taller bar and treat it as the shortest bar of a rectangle: area = height[popped]
      × width, where width spans from the current index back to the new stack top.
      A sentinel 0-height flushes the stack. O(n).
    ref: "concepts.md#monotonic-stack-pattern"

  - id: stacks-queues-monotonic-011
    difficulty: advanced
    tags: [monotonic-deque, sliding-window-maximum, complexity]
    question: |
      Sliding Window Maximum can be solved in O(n) with a monotonic deque. What does
      the deque store and what invariant does it maintain?
    options:
      - "The raw values kept in fully sorted order, rebuilt for each window"
      - "Indices whose values are increasing; back is the window max"
      - "A binary max-heap holding the last k values in the window"
      - "Indices whose values are decreasing front-to-back; front is the window max"
    answer: 3
    explanation: |
      Maintain a deque of indices with decreasing values. Before adding i, pop from the
      back while nums[back] <= nums[i] (they can never be the max while i is present);
      pop the front if it slid out of the window. The front index is always the current
      window's maximum. Each index enters/leaves once → O(n), beating a heap's
      O(n log k).
    ref: "concepts.md#monotonic-deque-sliding-window-maximum"

  - id: stacks-queues-monotonic-012
    difficulty: intermediate
    tags: [monotonic-deque, heap, tradeoff]
    question: |
      What is the advantage of a monotonic deque over a max-heap for
      sliding-window maximum?
    options:
      - "The deque uses O(n) extra space whereas the heap needs only O(1) auxiliary space"
      - "The heap simply cannot produce the correct window maximum under any configuration"
      - "The deque handles duplicate values while the heap silently rejects them"
      - "The deque is O(n) total and never holds stale out-of-window values, vs the heap's O(n log k)"
    answer: 3
    explanation: |
      The monotonic deque runs in O(n) (each index enters/leaves once) and eagerly
      evicts indices that leave the window. A heap is O(n log k) and needs lazy
      deletion to skip stale (out-of-window) maxima. Both are correct; the deque is
      asymptotically faster.
    ref: "concepts.md#monotonic-deque-sliding-window-maximum"

  - id: stacks-queues-monotonic-013
    difficulty: beginner
    tags: [deque, arraydeque, api]
    question: |
      What is a deque (double-ended queue)?
    options:
      - "A structure supporting O(1) insert and remove at both the front and the back"
      - "A stack that additionally supports random indexed access in O(1) time"
      - "A queue that automatically keeps its elements in sorted order"
      - "A queue backed only by a singly linked list without a tail pointer"
    answer: 0
    explanation: |
      A deque supports O(1) addFirst/addLast and removeFirst/removeLast, generalizing
      both stack and queue. Java's ArrayDeque (growable circular array) and Python's
      collections.deque implement it; it is the backing structure for the monotonic-deque
      pattern.
    ref: "concepts.md#deque-double-ended-queue"

  - id: stacks-queues-monotonic-014
    difficulty: intermediate
    tags: [stack, linked-list, array, tradeoff]
    question: |
      Compared to an array-backed stack, what is the main trade-off of a
      linked-list-backed stack?
    options:
      - "It degrades to O(log n) per push instead of the array-backed stack's O(1) amortized cost"
      - "It structurally cannot support a peek operation on the top element"
      - "It guarantees O(1) worst-case push (no resize) but costs a pointer and allocation per node, with poor cache locality"
      - "It uses strictly less memory per element than a contiguous array does"
    answer: 2
    explanation: |
      A linked stack has true O(1) worst-case push/pop (no resize pause), but pays an
      allocation and a next pointer for every element and scatters nodes in memory
      (poor cache locality). The array version is amortized O(1) and cache-friendly,
      which usually wins in practice.
    ref: "concepts.md#stack-internals-lifo"

  - id: stacks-queues-monotonic-015
    difficulty: intermediate
    tags: [monotonic-stack, direction, template]
    question: |
      To find, for each element, the PREVIOUS smaller element (nearest smaller to
      its left), how do you configure the monotonic-stack scan?
    options:
      - "Iterate strictly left-to-right while maintaining a decreasing monotonic stack"
      - "Sort the entire array ascending first, then scan it once to read off neighbors"
      - "Iterate right-to-left, or left-to-right maintaining an increasing stack whose top is the previous-smaller"
      - "Use a max-heap keyed by element value to extract each previous-smaller"
    answer: 2
    explanation: |
      For 'previous smaller', an increasing stack works: as you scan left-to-right, pop
      while the top is >= current; the remaining top is the previous-smaller element,
      then push current. Direction and the increasing/decreasing choice select which
      neighbor (left/right, greater/smaller) you compute.
    ref: "concepts.md#monotonic-stack-pattern"

  - id: stacks-queues-monotonic-016
    difficulty: beginner
    tags: [queue, bfs, use-cases]
    question: |
      Which traversal naturally uses a queue?
    options:
      - "Depth-first search (DFS) traversal"
      - "In-order traversal of a BST via recursion"
      - "Breadth-first search (BFS) / level-order traversal"
      - "Binary search over a sorted array"
    answer: 2
    explanation: |
      BFS processes nodes in FIFO order — enqueue neighbors, dequeue the oldest — which
      yields level-by-level traversal. DFS uses a stack (explicit or the call stack).
    ref: "concepts.md#queue-internals-fifo"

  - id: stacks-queues-monotonic-017
    difficulty: intermediate
    tags: [monotonic-stack, indices, why]
    question: |
      Why do monotonic-stack solutions typically store indices rather than values?
    options:
      - "Because indices take up less memory than the values themselves"
      - "To recover distances and widths, and handle duplicates/circular arrays cleanly"
      - "Because raw values simply cannot be pushed onto a stack directly"
      - "To keep the stack automatically sorted in ascending order as you go"
    answer: 1
    explanation: |
      Storing indices lets you compute distances (Daily Temperatures: i - poppedIndex)
      and widths (histogram rectangle spans), and disambiguate equal values or wrap in
      circular-array variants. You can always look up the value via nums[index].
    ref: "concepts.md#monotonic-stack-pattern"

  - id: stacks-queues-monotonic-018
    difficulty: intermediate
    tags: [expression-evaluation, rpn, stack]
    question: |
      How does a stack evaluate a Reverse Polish (postfix) expression like
      "3 4 + 5 *"?
    options:
      - "Push operators onto the stack; when a number arrives, apply the top operator"
      - "Convert the postfix to infix first, then evaluate it left to right"
      - "Push operands; on an operator, pop the top two operands, apply it, push the result"
      - "Use a FIFO queue and process the operators in arrival order"
    answer: 2
    explanation: |
      In RPN evaluation you push operands; each operator pops the top two operands,
      applies the operation, and pushes the result. For "3 4 + 5 *": push 3, 4; '+'
      pops 4,3 → push 7; push 5; '*' pops 5,7 → push 35. This is a canonical stack use.
    ref: "concepts.md#stack-internals-lifo"

  - id: stacks-queues-monotonic-019
    difficulty: advanced
    tags: [car-fleet, monotonic-stack, sorting]
    question: |
      In 'Car Fleet', after sorting cars by starting position (closest to target
      first), how does a stack determine the number of fleets?
    options:
      - "Push every car onto the stack in sorted order; the fleet count is simply the total number of cars"
      - "Build a min-heap keyed by each car's speed and pop them in increasing order to count the fleets"
      - "Binary search over the sorted arrival times, where each divergence boundary marks one more fleet"
      - "Track arrival times on a stack; a car that arrives no later than the fleet ahead merges (is dropped), else it forms a new fleet"
    answer: 3
    explanation: |
      Compute each car's time-to-target. Iterating from closest-to-target, keep a stack
      of fleet arrival times: if the current car's time is <= the top (it catches up),
      it merges into that fleet; otherwise it forms a new fleet (push its time). The
      number of items left is the fleet count.
    ref: "concepts.md#monotonic-stack-pattern"

  - id: stacks-queues-monotonic-020
    difficulty: intermediate
    tags: [call-stack, recursion, gotcha]
    question: |
      What causes a StackOverflowError, and what is the standard fix when recursion
      is too deep?
    options:
      - "A full heap running out of object space; fix it by allocating more RAM or raising -Xmx"
      - "Recursion deeper than the call-stack limit; convert to an explicit stack (iterative) or use iteration"
      - "Too many live objects on the heap; fix it by manually invoking the garbage collector to reclaim space"
      - "Popping from an already-empty stack structure; fix it by guarding each pop with an isEmpty check first"
    answer: 1
    explanation: |
      Each function call pushes a frame (locals, return address) onto the call stack;
      recursion deeper than the stack's capacity overflows it. The fix is to convert the
      recursion to an explicit-stack iterative traversal, or otherwise bound the depth.
    ref: "concepts.md#stack-internals-lifo"

  - id: stacks-queues-monotonic-021
    difficulty: advanced
    tags: [next-greater-element, circular-array, technique]
    question: |
      To find the next greater element in a CIRCULAR array (wrap-around allowed),
      what is the standard adaptation of the monotonic-stack template?
    options:
      - "Sort the array in descending order first, then run the standard single-pass monotonic stack over it"
      - "Reverse the entire array, run the monotonic stack once, then map the answers back to original positions"
      - "Iterate over indices from 0 to 2n-1 using i % n, running the same monotonic stack"
      - "Replace the stack with a max-heap of values and pop the largest whenever a new element arrives"
    answer: 2
    explanation: |
      Simulate two passes over the array by iterating i from 0 to 2n-1 and using i % n
      to index, keeping the same decreasing monotonic stack of indices. This lets
      elements near the end 'see' elements at the start. Still O(n) time and space.
    ref: "concepts.md#monotonic-stack-pattern"

  - id: stacks-queues-monotonic-022
    difficulty: beginner
    tags: [queue, deque, python, api]
    question: |
      In Python, which structure and method give O(1) dequeue from the front?
    options:
      - "list with pop(0)"
      - "collections.OrderedDict with popitem()"
      - "list with pop()"
      - "collections.deque with popleft()"
    answer: 3
    explanation: |
      collections.deque is a doubly-linked/blocked structure with O(1) append and
      popleft — the correct FIFO queue in Python. list.pop(0) is O(n) (shifts elements);
      list.pop() removes from the back, which is O(1) but not FIFO-front.
    ref: "concepts.md#queue-internals-fifo"
