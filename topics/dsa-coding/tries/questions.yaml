topic: "Tries (Prefix Trees)"
domain: dsa-coding
topic_slug: tries
version: 1
questions:
  - id: tries-001
    difficulty: beginner
    tags: [internals, node, structure]
    question: |
      In a standard trie over lowercase letters, how is the character
      that a node represents actually encoded?
    options:
      - "It is stored as an explicit char field written inside every node"
      - "It is implied by which child slot of the parent points to the node"
      - "It is computed from a hash of the node's own memory address"
      - "It is stored only on the root node and then shared by reference"
    answer: 1
    explanation: |
      Nodes do not store their own character. The character is implied by the position of
      the pointer in the parent (e.g. index `c - 'a'` in a 26-slot child array). The path
      of edges from the root down to a node spells the prefix that node represents.
    ref: "concepts.md#how-a-trie-works-under-the-hood"

  - id: tries-002
    difficulty: beginner
    tags: [internals, is-end, prefix]
    question: |
      A trie contains the word "card". After walking the characters c-a, what does the
      `isEnd` flag on the node for prefix "ca" tell you?
    options:
      - "That 'ca' has been confirmed as a complete stored word in the trie"
      - "That the trie has become unbalanced and now needs rebalancing"
      - "That the prefix 'ca' is stale and must be deleted from the trie"
      - "That 'ca' is a prefix of at least one stored word but only a word if isEnd is true"
    answer: 3
    explanation: |
      The "ca" node existing only means "ca" is a prefix on the path to some word. Whether
      "ca" is itself a stored word is decided solely by its `isEnd` flag — here it would be
      false, since only "card" (and any others) are terminated. Node existence ≠ word.
    ref: "concepts.md#how-a-trie-works-under-the-hood"

  - id: tries-003
    difficulty: beginner
    tags: [complexity, insert, search]
    question: |
      What is the time complexity of inserting or searching for a key of length L in a
      trie holding N words?
    options:
      - "O(L), independent of N"
      - "O(N) overall"
      - "O(log N) per key"
      - "O(N · L) worst case"
    answer: 0
    explanation: |
      A trie operation walks one node per character of the key, so it costs O(L) and does
      not depend on how many words the trie holds. This independence from N is the trie's
      signature property versus structures whose cost grows with the collection size.
    ref: "concepts.md#complexity-and-why-prefix-queries-beat-a-hash-set"

  - id: tries-004
    difficulty: intermediate
    tags: [operations, search, starts-with]
    question: |
      After walking all characters of a query and landing on a non-null node, how do
      `search(word)` and `startsWith(prefix)` differ?
    options:
      - "search returns node.isEnd; startsWith returns node != null"
      - "search returns node != null; startsWith returns node.isEnd"
      - "They are effectively identical and return the same result"
      - "search checks children count; startsWith checks depth"
    answer: 0
    explanation: |
      Both perform the same character-by-character walk. The only difference is the final
      check: `search` must confirm a word terminates here (`node.isEnd`), whereas
      `startsWith` only needs the path to exist (`node != null`). Reversing these two lines
      is the classic Implement-Trie bug.
    ref: "concepts.md#insert-search-and-startswith-the-core-operations"

  - id: tries-005
    difficulty: intermediate
    tags: [comparison, hash-set, prefix]
    question: |
      A `HashSet<String>` and a trie both give O(L) exact membership. What can the trie do
      that the hash set fundamentally cannot do efficiently?
    options:
      - "Detect and reject duplicate insertions automatically on add"
      - "Store keys of arbitrary length that a hash set cannot hold"
      - "Answer prefix queries like 'how many words start with car' without scanning all keys"
      - "Guarantee O(1) worst-case lookup with no collision chains"
    answer: 2
    explanation: |
      A hash set has no notion of prefixes — answering "which/how many words start with X"
      forces a full O(N·L) scan. A trie walks to the X node in O(L) and reads its subtree.
      Prefix structure is exactly what a trie preserves and a hash of the whole key discards.
    ref: "concepts.md#complexity-and-why-prefix-queries-beat-a-hash-set"

  - id: tries-006
    difficulty: intermediate
    tags: [space, memory, array-node]
    question: |
      Using a fixed 26-slot child array per node, what is the worst-case space of a trie
      holding N words of length up to L over an alphabet of size Σ?
    options:
      - "O(N) total"
      - "O(N + L)"
      - "O(N · L · Σ)"
      - "O(L · log N)"
    answer: 2
    explanation: |
      Worst case (no shared prefixes) there are O(N·L) nodes, and each array node reserves
      Σ pointer slots regardless of how many are used, giving O(N·L·Σ). Shared prefixes
      reduce this in practice, but memory is the trie's main weakness versus a packed hash set.
    ref: "concepts.md#space-cost-and-the-array-vs-map-trade-off"

  - id: tries-007
    difficulty: intermediate
    tags: [representation, children, trade-off]
    question: |
      Why might you choose a `Map<Character, TrieNode>` instead of a fixed array for a
      node's children?
    options:
      - "It makes child lookup O(log Σ) which is always faster"
      - "It removes the need for an isEnd flag by marking ends implicitly"
      - "It guarantees the trie stays balanced as more keys are inserted"
      - "It uses memory proportional to actual children, suiting large or sparse alphabets like Unicode"
    answer: 3
    explanation: |
      A fixed array wastes Σ slots per node — fine for dense a–z but ruinous for a large or
      sparse alphabet (Unicode). A hash map allocates only for children that actually exist,
      at the cost of hashing overhead per hop. Neither changes the isEnd requirement.
    ref: "concepts.md#space-cost-and-the-array-vs-map-trade-off"

  - id: tries-008
    difficulty: advanced
    tags: [radix, compressed, optimization]
    question: |
      What does a compressed trie (radix tree / PATRICIA) do to reduce node count?
    options:
      - "It sorts sibling nodes by access frequency to speed up lookups"
      - "It rehashes the child arrays when the load factor exceeds 0.75"
      - "It collapses chains of single-child nodes into one edge labeled with the whole substring"
      - "It removes the isEnd flags to save one bit of state per node"
    answer: 2
    explanation: |
      A radix tree merges any non-branching chain of single-child nodes into a single edge
      carrying the entire substring, drastically cutting node/allocation count. This is the
      structure used for IP longest-prefix-match routing and many ordered key-value stores.
    ref: "concepts.md#compressed-radix-tries-and-ternary-search-tries"

  - id: tries-009
    difficulty: advanced
    tags: [ternary-search-trie, tst, structure]
    question: |
      How does a ternary search trie (TST) node differ from a standard array trie node?
    options:
      - "It stores one character and three pointers: lo (smaller), eq (next char), hi (larger)"
      - "It stores an array of 26 booleans instead of any child pointers"
      - "It stores the complete word string at every single node"
      - "It uses open addressing to resolve hash collisions between characters"
    answer: 0
    explanation: |
      A TST is a BST/trie hybrid: each node holds a single character plus lo, eq, and hi
      pointers. It uses memory close to a BST (only real children) and supports ordered and
      prefix queries, trading O(L) for roughly O(L·log Σ) lookups.
    ref: "concepts.md#compressed-radix-tries-and-ternary-search-tries"

  - id: tries-010
    difficulty: advanced
    tags: [bit-trie, xor, pattern]
    question: |
      To maximize `x XOR y` for a query x using a binary trie of the array's numbers,
      what greedy choice do you make while descending from the most significant bit?
    options:
      - "Always follow the child matching the same bit as x"
      - "Follow whichever child has more descendants"
      - "Follow the 0 child first and then backtrack if it fails"
      - "Follow the opposite bit of x whenever that child exists"
    answer: 3
    explanation: |
      An XOR bit is 1 only when the two bits differ. Because higher bits carry more value,
      you greedily take the child with the opposite bit at each level when it exists,
      maximizing the highest possible bits first. This finds the best partner in O(word-width)
      per query.
    ref: "concepts.md#the-bit-trie-pattern-for-maximum-xor"

  - id: tries-011
    difficulty: advanced
    tags: [bit-trie, complexity, xor]
    question: |
      Using a bit-trie, what is the complexity of finding the maximum XOR pair among N
      32-bit integers, versus the brute-force pairwise approach?
    options:
      - "O(N log N) vs O(N²)"
      - "O(N · 32) vs O(N²)"
      - "O(N²) vs O(N³)"
      - "O(32) vs O(N)"
    answer: 1
    explanation: |
      Insert each number's 32 bits (O(N·32)) then query each number greedily in O(32),
      giving O(N·32) ≈ O(N) overall for a fixed word width, versus the O(N²) of comparing
      every pair. This is the core win of the bit-trie pattern for Maximum XOR.
    ref: "concepts.md#the-bit-trie-pattern-for-maximum-xor"

  - id: tries-012
    difficulty: intermediate
    tags: [pattern, recognition, when-to-use]
    question: |
      An interviewer asks for an autocomplete feature that, given a typed prefix, returns
      all stored words starting with it. Which structure is the natural fit?
    options:
      - "A max-heap keyed by word frequency"
      - "A balanced BST keyed by string hash"
      - "A trie (prefix tree)"
      - "A bloom filter"
    answer: 2
    explanation: |
      "Autocomplete on a typed prefix" is the textbook trie signal: walk to the prefix node
      in O(len(prefix)), then enumerate its subtree. A heap or hash gives no prefix locality,
      and a bloom filter only answers approximate membership, not prefix enumeration.
    ref: "concepts.md#complexity-and-why-prefix-queries-beat-a-hash-set"

  - id: tries-013
    difficulty: advanced
    tags: [word-search-ii, dfs, pruning]
    question: |
      In Word Search II, why is building one trie of all words better than running a DFS
      per word on the grid?
    options:
      - "The trie sorts all the words alphabetically before the grid search"
      - "A single grid DFS advances a trie pointer and prunes the moment the current path is not a prefix of any word"
      - "It converts the entire grid into a hash set of reachable cells"
      - "It removes the need to track visited cells during the recursion"
    answer: 1
    explanation: |
      With one shared trie you DFS the grid once, moving a trie pointer alongside the path.
      As soon as the trie has no matching child, no word can extend this path, so you prune
      the whole branch — sharing prefix work across all words instead of restarting per word.
    ref: "concepts.md#building-on-a-trie-word-search-ii-with-dfs-and-trie"

  - id: tries-014
    difficulty: advanced
    tags: [delete, operations, gotcha]
    question: |
      You delete "car" from a trie that also contains "card". What must happen to the
      c-a-r path?
    options:
      - "The entire c-a-r path is removed from the trie immediately"
      - "The r node is merged into and replaced by card's node"
      - "Only car's isEnd flag is cleared; the path stays because card still needs it"
      - "Nothing changes; delete is a no-op on shared prefixes"
    answer: 2
    explanation: |
      Deletion clears the word's isEnd, then prunes upward only nodes that have no children
      and are not another word's end. Since "card" still lives below "car", the c-a-r nodes
      must remain — you only flip "car" to isEnd = false. Pruning shared nodes would corrupt
      other words.
    ref: "concepts.md#deleting-from-a-trie"

  - id: tries-015
    difficulty: intermediate
    tags: [design-add-search, wildcard, dfs]
    question: |
      "Design Add and Search Words" allows a `.` wildcard matching any single character.
      How do you handle a `.` during search in a trie?
    options:
      - "Recurse (DFS) into all existing children and succeed if any branch matches the rest"
      - "Skip the wildcard character and continue from the same node"
      - "Convert the dot to the letter 'a' and follow that single child"
      - "Return true immediately without checking any children"
    answer: 0
    explanation: |
      A `.` can match any letter, so at that position you branch: recursively try the
      remainder of the pattern against every non-null child, returning true if any succeeds.
      Concrete characters follow the single matching child as usual. This DFS-over-children is
      the defining trick of the problem.
    ref: "concepts.md#insert-search-and-startswith-the-core-operations"

  - id: tries-016
    difficulty: intermediate
    tags: [replace-words, shortest-prefix, pattern]
    question: |
      In "Replace Words" you replace each word by the shortest dictionary *root* that is a
      prefix of it. Walking a trie of roots, when do you stop and emit the root?
    options:
      - "At the deepest node the walk manages to reach"
      - "At the first node on the walk whose isEnd is true"
      - "Only when you reach a leaf node with no children"
      - "When a node with two or more children appears"
    answer: 1
    explanation: |
      Walk the word's characters down the trie of roots; the first node you hit with
      isEnd = true marks the shortest matching root, so you emit it and stop. If the walk
      falls off the trie before any isEnd, no root applies and the word is kept unchanged.
    ref: "concepts.md#insert-search-and-startswith-the-core-operations"

  - id: tries-017
    difficulty: beginner
    tags: [complexity, starts-with, enumerate]
    question: |
      What is the cost of enumerating every stored word that begins with a given prefix p?
    options:
      - "O(N) regardless of how many results are returned"
      - "O(N · L) scanning every stored word"
      - "O(len(p) + total characters across all matching words)"
      - "O(log N) like a balanced tree lookup"
    answer: 2
    explanation: |
      You spend O(len(p)) walking to the prefix node, then a subtree traversal whose cost is
      proportional to the total characters of the words you actually output. You pay only for
      the walk plus what you emit — never for unrelated words.
    ref: "concepts.md#complexity-and-why-prefix-queries-beat-a-hash-set"

  - id: tries-018
    difficulty: intermediate
    tags: [comparison, when-not-to-use, hash-set]
    question: |
      For which workload is a plain hash set the better choice over a trie?
    options:
      - "Pure exact membership tests with no prefix queries, where memory matters"
      - "Autocomplete suggestions as the user types"
      - "Longest-prefix IP routing lookups in a large router table"
      - "Enumerating all words sharing a common start"
    answer: 0
    explanation: |
      If you only ever ask "is this exact key present?" and never query prefixes, a hash set
      is simpler and far lighter in memory. The other three scenarios all exploit prefix
      structure, which is precisely where the trie earns its extra memory cost.
    ref: "concepts.md#complexity-and-why-prefix-queries-beat-a-hash-set"

  - id: tries-019
    difficulty: advanced
    tags: [radix, ip-routing, application]
    question: |
      Longest-prefix-match IP routing tables are commonly implemented with which structure?
    options:
      - "An open-addressing hash table keyed on the full destination address"
      - "A min-heap of routes ordered by their advertised prefix length"
      - "A skip list of subnets sorted by their numeric base address"
      - "A compressed/radix trie (PATRICIA) over address bits"
    answer: 3
    explanation: |
      Longest-prefix match over the bits of an address is exactly a walk down a binary trie,
      and routers use the compressed (PATRICIA/radix) form to keep the node count and memory
      manageable. This is a canonical real-world trie application.
    ref: "concepts.md#compressed-radix-tries-and-ternary-search-tries"

  - id: tries-020
    difficulty: intermediate
    tags: [word-search-ii, gotcha, dedupe]
    question: |
      A common Word Search II bug is adding the same found word to the results multiple
      times. What is the standard fix?
    options:
      - "Sort the results afterward and hope that duplicate entries cluster together"
      - "Restart the grid DFS from scratch for every candidate starting cell"
      - "Increase the recursion depth limit so that longer paths are explored fully"
      - "Set the trie node's stored word to null after collecting it (or use a set)"
    answer: 3
    explanation: |
      The grid may reach the same word via different paths. Once you collect a word at its
      end node, null out the word stored there (or dedupe via a set) so it can't be added
      again. Forgetting this — along with restoring visited cells on backtrack — are the two
      classic bugs.
    ref: "concepts.md#building-on-a-trie-word-search-ii-with-dfs-and-trie"
