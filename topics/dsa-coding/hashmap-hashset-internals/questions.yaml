topic: "Hash Tables: HashMap & HashSet Internals"
domain: dsa-coding
topic_slug: hashmap-hashset-internals
version: 1
questions:
  - id: hashmap-hashset-internals-001
    difficulty: beginner
    tags: [internals, buckets, hash-function]
    question: |
      At the lowest level, what backing storage does a hash table use to
      achieve O(1) average lookup?
    options:
      - "A contiguous array of buckets indexed by a hash of the key"
      - "A balanced binary search tree of keys"
      - "A sorted linked list traversed by binary search"
      - "A skip list with probabilistic levels"
    answer: 0
    explanation: |
      A hash table is fundamentally an array of buckets. A hash function maps a key to
      a 32-bit integer, which is reduced to a valid array index (e.g. hash & (capacity-1)).
      Direct array indexing is what makes lookup O(1) on average. Trees and skip lists give
      O(log n), not O(1).
    ref: "concepts.md#how-a-hash-table-works-under-the-hood"

  - id: hashmap-hashset-internals-002
    difficulty: intermediate
    tags: [internals, index-reduction, capacity]
    question: |
      Java's HashMap computes a bucket index as `hash & (capacity - 1)` instead of
      `hash % capacity`. Why is this valid and preferred?
    options:
      - "It is only correct when capacity is a prime number"
      - "It avoids collisions entirely"
      - "It lets the table use negative indices safely"
      - "Bitwise AND is faster and equals modulo only because capacity is a power of two"
    answer: 3
    explanation: |
      When capacity is a power of two, `hash & (capacity - 1)` keeps exactly the low bits
      of the hash, which is identical to `hash % capacity` but far cheaper than a modulo.
      That equivalence is precisely why Java rounds requested capacities up to the next
      power of two.
    ref: "concepts.md#the-hash-function-and-index-reduction"

  - id: hashmap-hashset-internals-003
    difficulty: intermediate
    tags: [internals, collision, chaining]
    question: |
      In separate chaining, how are multiple keys that hash to the same bucket stored?
    options:
      - "The later key overwrites the earlier one"
      - "Each collides into the next free array slot via probing"
      - "In a secondary container (linked list, or a tree) attached to that bucket"
      - "In a completely separate overflow hash table"
    answer: 2
    explanation: |
      With separate chaining, each bucket holds a secondary container of all entries that
      hashed there — a singly linked list in Java, which get/put walk comparing with equals.
      Probing into the next slot describes open addressing, a different strategy.
    ref: "concepts.md#collision-resolution-separate-chaining"

  - id: hashmap-hashset-internals-004
    difficulty: advanced
    tags: [internals, java8, treeify, worst-case]
    question: |
      In Java 8+, what happens when a single HashMap bucket's chain grows to 8 entries
      (with table capacity ≥ 64)?
    options:
      - "The bucket converts to a red-black tree, making that bucket O(log n)"
      - "The map throws a HashCollisionException"
      - "The map immediately doubles its capacity"
      - "The oldest entry in the bucket is evicted"
    answer: 0
    explanation: |
      At TREEIFY_THRESHOLD (8) with capacity ≥ 64, the bucket converts from a linked list to
      a red-black tree, dropping worst-case lookup within that degenerate bucket from O(n) to
      O(log n). It untreeifies back to a list at ≤ 6 entries. This defends against hash-flooding.
    ref: "concepts.md#collision-resolution-separate-chaining"

  - id: hashmap-hashset-internals-005
    difficulty: advanced
    tags: [internals, open-addressing, tombstones, delete]
    question: |
      In an open-addressing hash table, why can't you simply mark a deleted slot as empty?
    options:
      - "Empty slots waste too much memory"
      - "The load factor would become negative"
      - "A truly empty slot would prematurely stop a probe sequence, hiding later entries"
      - "The hash function would no longer be deterministic"
    answer: 2
    explanation: |
      In open addressing, lookups stop at the first empty slot. If a deleted slot were made
      truly empty, any entry that had probed past it during insertion would become
      unreachable. So deletions leave a tombstone (deleted-but-occupied) marker so probing
      continues past it; too many tombstones triggers a cleanup rehash.
    ref: "concepts.md#collision-resolution-open-addressing"

  - id: hashmap-hashset-internals-006
    difficulty: intermediate
    tags: [internals, open-addressing, clustering]
    question: |
      Which problem is characteristic of linear probing specifically?
    options:
      - "Tombstone starvation"
      - "Load factors above 1.0"
      - "Non-deterministic hashing"
      - "Primary clustering — long runs of occupied slots that grow and merge"
    answer: 3
    explanation: |
      Linear probing tries index, index+1, index+2, ... so consecutive occupied slots form
      clusters that tend to grow and merge (primary clustering), lengthening probe sequences.
      Quadratic probing and double hashing reduce this. Open addressing cannot exceed load
      factor 1.0 — but that's a general property, not the clustering issue asked about.
    ref: "concepts.md#collision-resolution-open-addressing"

  - id: hashmap-hashset-internals-007
    difficulty: beginner
    tags: [load-factor, resize]
    question: |
      What is the default load factor of Java's HashMap, and what does exceeding it trigger?
    options:
      - "1.0 — triggers treeification of all buckets"
      - "0.5 — triggers a switch to open addressing"
      - "0.75 — triggers doubling the capacity and rehashing all entries"
      - "0.9 — triggers eviction of the least-recently-used entry"
    answer: 2
    explanation: |
      Java's default load factor is 0.75. When size exceeds capacity × 0.75, the table
      doubles capacity (16→32→64...) and rehashes every entry into the larger array. 0.75
      balances short collision chains against wasted memory.
    ref: "concepts.md#load-factor-resize-and-rehash"

  - id: hashmap-hashset-internals-008
    difficulty: advanced
    tags: [load-factor, resize, amortized-complexity]
    question: |
      A single resize/rehash pass is O(n). Why is insertion still considered amortized O(1)?
    options:
      - "Because rehashing happens on a background thread"
      - "Because Java caches the old array and reuses it"
      - "Because only the resized bucket is rehashed, not the whole table"
      - "Because capacity doubles, so resizes occur geometrically less often, spreading the cost"
    answer: 3
    explanation: |
      Because capacity doubles each resize, the number of resizes grows only logarithmically
      and the total rehash work across n inserts is O(n), so the per-insert amortized cost is
      O(1) — the same doubling argument used for a dynamic array/ArrayList.
    ref: "concepts.md#load-factor-resize-and-rehash"

  - id: hashmap-hashset-internals-009
    difficulty: intermediate
    tags: [complexity, worst-case]
    question: |
      Ignoring Java 8 treeification, what is the worst-case time complexity of a HashMap
      `get`, and when does it occur?
    options:
      - "O(log n), when the table is exactly half full"
      - "O(1), always guaranteed"
      - "O(n), when all keys hash into a single bucket"
      - "O(n log n), during a resize"
    answer: 2
    explanation: |
      If every key collides into one bucket (bad hash or adversarial keys), lookup degrades
      to a linear scan of that chain: O(n). The O(1) average assumes simple uniform hashing.
      Java 8's tree bins cap this specific degenerate case at O(log n).
    ref: "concepts.md#why-o1-average-but-on-worst"

  - id: hashmap-hashset-internals-010
    difficulty: intermediate
    tags: [complexity, iteration]
    question: |
      Why is iterating all entries of a HashMap O(n + capacity) rather than strictly O(n)?
    options:
      - "Because iteration re-hashes every key"
      - "Because the iterator must scan every bucket slot, including empty ones"
      - "Because entries are stored in sorted order"
      - "Because each entry is visited twice"
    answer: 1
    explanation: |
      Entries are scattered across the backing array, so the iterator must walk every slot to
      find occupied ones, including empty slots. Hence O(n + capacity). If the map is sparse
      (low load factor), the capacity term is non-trivial.
    ref: "concepts.md#why-o1-average-but-on-worst"

  - id: hashmap-hashset-internals-011
    difficulty: intermediate
    tags: [hashcode, equals, contract]
    question: |
      The hashCode/equals contract requires which of the following?
    options:
      - "If two objects are equal, they must have the same hashCode"
      - "If two objects have the same hashCode, they must be equal"
      - "Every object must have a unique hashCode"
      - "hashCode must equal the object's memory address"
    answer: 0
    explanation: |
      The contract is one-directional: equal objects MUST return equal hash codes (so lookup
      finds the right bucket then confirms by equals). The converse is not required — unequal
      objects may share a hash code; that is just a collision, which the table handles.
    ref: "concepts.md#the-hashcode-and-equals-contract-and-immutability"

  - id: hashmap-hashset-internals-012
    difficulty: advanced
    tags: [hashcode, immutability, gotcha]
    question: |
      What happens if you mutate a key's hashCode-relevant fields after inserting it into a
      HashMap?
    options:
      - "The entry may become unreachable — get() computes the new bucket and misses the old one"
      - "The map automatically re-buckets the key on next access"
      - "The JVM throws a ConcurrentModificationException"
      - "Nothing; keys are defensively copied on insert"
    answer: 0
    explanation: |
      The entry was placed in the bucket for its OLD hash. After mutation, get(key) computes
      the NEW bucket index and looks there, missing the entry — it becomes unreachable and
      un-removable, a silent leak. This is why immutable keys (String, boxed primitives,
      records with final fields) are strongly preferred.
    ref: "concepts.md#the-hashcode-and-equals-contract-and-immutability"

  - id: hashmap-hashset-internals-013
    difficulty: beginner
    tags: [hashset, internals]
    question: |
      How is Java's HashSet implemented internally?
    options:
      - "As a sorted array with binary search"
      - "As a bit vector indexed by hash"
      - "As a HashMap where every key maps to a single shared dummy value (PRESENT)"
      - "As a red-black tree of elements"
    answer: 2
    explanation: |
      HashSet wraps a HashMap: add(e) calls map.put(e, PRESENT) where PRESENT is one shared
      sentinel Object. So a set inherits the exact HashMap complexity and load-factor/resize
      behavior. Similarly LinkedHashSet/TreeSet wrap LinkedHashMap/TreeMap.
    ref: "concepts.md#hashset-is-a-hashmap-with-a-dummy-value"

  - id: hashmap-hashset-internals-014
    difficulty: intermediate
    tags: [variants, ordering, iteration-order]
    question: |
      Which statement about HashMap iteration order is correct?
    options:
      - "It always iterates in insertion order"
      - "It always iterates in sorted key order"
      - "The order is unspecified and can change across resizes or JVM versions"
      - "It iterates in reverse insertion order"
    answer: 2
    explanation: |
      Plain HashMap iteration order is unspecified and unstable — it depends on hash values
      and capacity and can change on resize. Use LinkedHashMap for insertion/access order or
      TreeMap for sorted order when order matters.
    ref: "concepts.md#ordered-and-sorted-variants-linkedhashmap-and-treemap"

  - id: hashmap-hashset-internals-015
    difficulty: advanced
    tags: [variants, treemap, complexity]
    question: |
      You need a map supporting `floorKey`, `ceilingKey`, and sorted range iteration. Which
      structure fits, and at what per-operation cost?
    options:
      - "HashMap — O(1) per operation"
      - "TreeMap (red-black tree) — O(log n) per operation"
      - "LinkedHashMap — O(1) per operation"
      - "HashSet — O(1) per operation"
    answer: 1
    explanation: |
      Nearest-key and range queries need ordering, which a hash table does not provide.
      TreeMap is a red-black tree (NavigableMap) giving sorted iteration and floor/ceiling/
      subMap at O(log n) per operation — you trade hash-table speed for ordering.
    ref: "concepts.md#ordered-and-sorted-variants-linkedhashmap-and-treemap"

  - id: hashmap-hashset-internals-016
    difficulty: advanced
    tags: [variants, lru, design]
    question: |
      Which Java built-in most directly supports building an LRU cache with O(1) operations?
    options:
      - "TreeMap sorted by access time"
      - "PriorityQueue keyed by timestamp"
      - "LinkedHashMap in access-order mode with removeEldestEntry overridden"
      - "HashSet with periodic clearing"
    answer: 2
    explanation: |
      LinkedHashMap threads all entries in a doubly linked list; with accessOrder=true it moves
      touched entries to the tail, and overriding removeEldestEntry evicts the head — an LRU in
      a few lines. Equivalently you build map + doubly linked list by hand for O(1) get/put.
    ref: "concepts.md#ordered-and-sorted-variants-linkedhashmap-and-treemap"

  - id: hashmap-hashset-internals-017
    difficulty: advanced
    tags: [security, hash-flooding, complexity-attack]
    question: |
      What is a hash-flooding (algorithmic complexity) attack against a hash map?
    options:
      - "Filling the map until it runs out of memory"
      - "Crafting many keys that all hash to the same bucket, forcing O(n) chains and O(n²) work"
      - "Overflowing a 32-bit hash to a negative value"
      - "Guessing the map's capacity to predict iteration order"
    answer: 1
    explanation: |
      If an attacker knows the hash function, they can submit many keys colliding into one
      bucket, turning n inserts into O(n²) and enabling a DoS. Defenses include Java 8
      treeification (O(log n) bins) and Python's per-process randomized string hashing (SipHash,
      PYTHONHASHSEED).
    ref: "concepts.md#hash-flooding-algorithmic-complexity-attacks"

  - id: hashmap-hashset-internals-018
    difficulty: intermediate
    tags: [pattern-choice, two-sum, complement]
    question: |
      For Two Sum (find two indices summing to a target in an unsorted array), what makes the
      hash-map approach O(n) instead of O(n²)?
    options:
      - "Storing seen value→index and checking for the complement (target − x) in O(1)"
      - "Sorting the array first"
      - "Using two nested loops with early termination"
      - "Binary searching for each complement"
    answer: 0
    explanation: |
      As you scan, you store each value's index in a map and check whether the complement
      (target − current) is already present — an O(1) lookup per element, O(n) overall. This
      'have I seen the complement?' pattern is the canonical hash-map signal.
    ref: "concepts.md#interview-problems"

  - id: hashmap-hashset-internals-019
    difficulty: advanced
    tags: [pattern-choice, prefix-sum, subarray]
    question: |
      Subarray Sum Equals K counts subarrays summing to K. Which hash-map technique solves it
      in O(n)?
    options:
      - "A sliding window expanding and shrinking on the running sum"
      - "A map of prefix-sum → count, checking for (prefixSum − K) at each index"
      - "Sorting prefix sums and two-pointer scanning"
      - "A monotonic stack of prefix sums"
    answer: 1
    explanation: |
      Store counts of each prefix sum seen so far; at index i with running sum S, the number
      of subarrays ending at i with sum K equals the count of prefix sum (S − K) already
      recorded. Sliding window fails here because array values can be negative, so the running
      sum is not monotonic.
    ref: "concepts.md#interview-problems"

  - id: hashmap-hashset-internals-020
    difficulty: intermediate
    tags: [pattern-choice, grouping, anagrams]
    question: |
      In Group Anagrams, what should you use as the hash-map key so anagrams collide into the
      same group?
    options:
      - "The string's length"
      - "The first character of each string"
      - "The string's built-in hashCode"
      - "A canonical signature: the sorted characters, or a 26-length character count"
    answer: 3
    explanation: |
      Anagrams share the same multiset of characters, so a canonical key — the sorted string
      or a fixed 26-length count vector — maps all anagrams of a word to the same bucket. Length
      or first char are far too coarse (non-anagrams would collide into the same group).
    ref: "concepts.md#interview-problems"

  - id: hashmap-hashset-internals-021
    difficulty: advanced
    tags: [pattern-choice, hashset, longest-consecutive]
    question: |
      Longest Consecutive Sequence must run in O(n) on an unsorted array. What is the key
      insight enabling that with a HashSet?
    options:
      - "Sort the array and scan runs — that is already O(n)"
      - "Put all numbers in a set, then start counting a run only from numbers with no predecessor (n−1 absent)"
      - "Use a min-heap to pop numbers in order"
      - "Binary search for each number's successor"
    answer: 1
    explanation: |
      Load all numbers into a HashSet for O(1) membership. Only begin counting a streak from a
      number x when x−1 is absent (so x is a sequence start); each number is visited at most
      twice, giving O(n). Sorting would be O(n log n), not O(n).
    ref: "concepts.md#interview-problems"

  - id: hashmap-hashset-internals-022
    difficulty: beginner
    tags: [complexity, space]
    question: |
      What is the space complexity of a hash table storing n entries?
    options:
      - "O(n), plus unused capacity slack proportional to n/load-factor"
      - "O(log n)"
      - "O(n²)"
      - "O(1)"
    answer: 0
    explanation: |
      A hash table stores O(n) entries but also keeps extra empty capacity so the load factor
      stays bounded (roughly n/α total slots). So space is O(n) with a constant-factor overhead
      from the slack, not sub-linear or quadratic.
    ref: "concepts.md#why-o1-average-but-on-worst"
