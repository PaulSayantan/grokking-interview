topic: "Cascading Failures & Resilience Anti-Patterns"
domain: reliability-ops
topic_slug: cascading-failures-and-antipatterns
version: 1
questions:
  - id: cascading-failures-and-antipatterns-001
    difficulty: beginner
    tags: [cascading-failure, definition]
    question: |
      What most precisely distinguishes a cascading failure from an ordinary,
      localized component outage?
    options:
      - "It involves a hardware fault rather than a software bug"
      - "A self-reinforcing feedback loop spreads the failure across components"
      - "It always originates in the database tier"
      - "It can only happen in microservice architectures"
    answer: 1
    explanation: |
      A cascading failure is a self-reinforcing loss of serving capacity that spreads
      across components over time. The defining ingredient beyond a plain outage is a
      positive feedback loop (retries, health-check removal, queue growth) that
      amplifies the problem each round instead of letting it stay bounded.
    ref: "concepts.md#what-a-cascading-failure-is"

  - id: cascading-failures-and-antipatterns-002
    difficulty: intermediate
    tags: [thread-pool, littles-law, mechanism]
    question: |
      A synchronous service normally sees 500 req/s at 20 ms latency and runs a
      200-thread pool. A dependency slows so request latency becomes 2 s while the
      request rate stays at 500 req/s. Roughly how many threads are now needed to keep
      up, and what happens?
    options:
      - "About 10 threads; no impact"
      - "About 200 threads; the pool is exactly saturated but stable"
      - "About 1000 threads; the pool is exhausted ~5x over and the service stalls"
      - "About 500 threads; latency doubles but the pool copes"
    answer: 2
    explanation: |
      By Little's Law, concurrency = arrival_rate x latency = 500 x 2 = 1000 busy
      threads. The 200-thread pool is exhausted about 5x over, so new requests queue or
      are rejected and every endpoint stalls — even ones that don't touch the slow
      dependency — because they can't get a thread.
    ref: "concepts.md#the-thread-pool--resource-exhaustion-mechanism"

  - id: cascading-failures-and-antipatterns-003
    difficulty: intermediate
    tags: [slow-vs-dead, timeouts, mechanism]
    question: |
      Why is a dependency that is *slow* often more dangerous to a synchronous caller
      than a dependency that is completely *dead*?
    options:
      - "A slow dependency holds worker threads for its full duration, while a dead one fails fast and frees the thread"
      - "A dead dependency corrupts data while a slow one does not"
      - "A slow dependency triggers more alerts, overwhelming on-call"
      - "There is no difference; both take equal capacity"
    answer: 0
    explanation: |
      A dependency that fails fast (e.g. connection refused in ~1 ms) releases the
      thread immediately, containing the damage. A merely slow dependency holds every
      thread hostage for seconds, exhausting the pool. This is why aggressive timeouts —
      which convert 'slow' into 'fast failure' — are the first line of defence.
    ref: "concepts.md#the-thread-pool--resource-exhaustion-mechanism"

  - id: cascading-failures-and-antipatterns-004
    difficulty: intermediate
    tags: [feedback-loop, root-cause]
    question: |
      In control-systems terms, what is the fundamental root cause of a cascade, as
      opposed to a bounded outage?
    options:
      - "Negative feedback that over-corrects"
      - "Insufficient logging"
      - "A single point of failure with no replicas"
      - "A positive (reinforcing) feedback loop that amplifies load or errors"
    answer: 3
    explanation: |
      A cascade is a control-systems failure in which a loop that should be stabilizing
      (or neutral) becomes reinforcing: getting worse feeds back as input that makes it
      worse still. Healthy systems rely on negative feedback (backpressure, shedding,
      breakers) that pushes load down as the system sickens.
    ref: "concepts.md#positive-feedback-loops-as-the-root-cause"

  - id: cascading-failures-and-antipatterns-005
    difficulty: advanced
    tags: [metastable, definition]
    question: |
      What is the defining characteristic of a *metastable* failure?
    options:
      - "It only occurs during deployments"
      - "It resolves itself within seconds without intervention"
      - "It persists even after the original trigger is removed, because a sustaining feedback loop holds the system in the bad state"
      - "It is caused exclusively by hardware degradation"
    answer: 2
    explanation: |
      A metastable failure keeps the system broken after the trigger is gone because a
      sustaining loop (typically retries of failing work) now generates enough load to
      keep the system pinned in the bad state. It requires a manual push — shed load,
      disable retries, drain — to fall back into the healthy basin.
    ref: "concepts.md#metastable-failures"

  - id: cascading-failures-and-antipatterns-006
    difficulty: advanced
    tags: [metastable, retries, goodput]
    question: |
      A service was pushed into a broken state by a brief traffic spike. The spike ended
      five minutes ago, but the system is still at 100% CPU with near-zero goodput.
      Retries are enabled. What is the most likely explanation?
    options:
      - "It is a metastable failure: retries of still-failing work keep offered load above capacity, sustaining the outage"
      - "The metrics pipeline is lagging; the system has actually recovered"
      - "The spike permanently damaged the hardware"
      - "The load balancer is stuck and needs a DNS change"
    answer: 0
    explanation: |
      This is textbook metastability. The trigger (spike) is gone, but work
      amplification from retries turned each failed request into several, so offered
      load stays above capacity and the system feeds itself. Goodput stays near zero
      while the system is maximally busy doing failing/retried work. The fix is a manual
      load reduction, not patience.
    ref: "concepts.md#metastable-failures"

  - id: cascading-failures-and-antipatterns-007
    difficulty: advanced
    tags: [metastable, recovery, load-shedding]
    question: |
      To pull a system out of a metastable failure state, what must you do?
    options:
      - "Wait, since the trigger is gone the system will recover on its own"
      - "Increase the retry count so requests eventually succeed"
      - "Enlarge all queues to buffer the backlog"
      - "Externally reduce offered load below capacity long enough for the backlog to drain"
    answer: 3
    explanation: |
      Because the sustaining loop keeps load above capacity, the only escape is to force
      load below the capacity threshold long enough for the backlog to drain — shed
      load, disable/pause retries, drain queues, or temporarily add capacity so
      offered-load-including-retries fits. A brief dip below threshold lets the system
      fall back into the healthy basin.
    ref: "concepts.md#metastable-failures"

  - id: cascading-failures-and-antipatterns-008
    difficulty: advanced
    tags: [metastable, design, headroom]
    question: |
      Which design practice most directly reduces the risk of metastable failures?
    options:
      - "Running each service at 95%+ utilization to save cost"
      - "Keeping utilization headroom and gating retries behind a retry budget"
      - "Removing all timeouts so requests always complete"
      - "Using unbounded queues to absorb any backlog"
    answer: 1
    explanation: |
      Metastability needs thin headroom plus an amplifying loop. Keeping capacity
      headroom (not running at 95%), capping retries and gating them behind a retry
      budget / token bucket, using circuit breakers, and making work idempotent so
      retries don't multiply distinct work all reduce the chance a trigger tips the
      system into a self-sustaining bad state.
    ref: "concepts.md#metastable-failures"

  - id: cascading-failures-and-antipatterns-009
    difficulty: intermediate
    tags: [retry-storm, amplification, layers]
    question: |
      Every tier in a chain (client, gateway, service, DB) independently retries a failed
      call up to 3 times. In the worst case, how many requests can a single user request
      generate at the database, and what is the lesson?
    options:
      - "3 requests; retry at every layer for safety"
      - "9 requests; retries are always harmless"
      - "27 requests; retry at only one layer to avoid multiplicative amplification"
      - "12 requests; the DB should just scale up"
    answer: 2
    explanation: |
      Layered retries multiply: 3 x 3 x 3 = 27 requests can hit the DB from one user
      request. The lesson is to retry at only one layer (usually the one closest to and
      best-informed about the failure) and never re-retry an error a lower layer already
      exhausted its retries on.
    ref: "concepts.md#anti-pattern-retry-storms-retry-amplification"

  - id: cascading-failures-and-antipatterns-010
    difficulty: advanced
    tags: [retry-budget, sre, overload]
    question: |
      The Google SRE book recommends bounding client retries with a 'retry budget.' What
      does this mean in practice?
    options:
      - "Limit retries to a small fraction of the request rate (on the order of ~10%) so a broken dependency can't be hammered"
      - "Allow unlimited retries but log each one"
      - "Retry only during business hours"
      - "Double the retry count each time a dependency fails"
    answer: 0
    explanation: |
      A retry budget caps aggregate retries at a small percentage of the request rate
      (Google SRE suggests on the order of 10%). Once the budget is exhausted, further
      retries are dropped. This prevents retries from multiplying load on an already-sick
      dependency and driving a retry storm.
    ref: "concepts.md#anti-pattern-retry-storms-retry-amplification"

  - id: cascading-failures-and-antipatterns-011
    difficulty: intermediate
    tags: [retry-storm, incident, recovery]
    question: |
      A service is in an active retry storm caused by a struggling downstream. What is
      usually the fastest, highest-leverage action?
    options:
      - "Add more replicas of the struggling downstream first"
      - "Increase all timeouts so requests have more time to succeed"
      - "Restart every instance immediately"
      - "Turn retries off (via feature flag/config) and/or shed load to cut offered load"
    answer: 3
    explanation: |
      Retries help with independent, transient faults, but during a correlated overload
      they are pure fuel. Disabling retries directly cuts the offered load the loop is
      feeding on. Adding capacity first tends to be absorbed by the storm; restarting
      into the storm drops warm caches and often deepens the outage.
    ref: "concepts.md#anti-pattern-retry-storms-retry-amplification"

  - id: cascading-failures-and-antipatterns-012
    difficulty: intermediate
    tags: [retries, idempotency]
    question: |
      Which errors are generally safe to retry without special handling?
    options:
      - "Any error, since retries always eventually succeed"
      - "Only transient/retryable errors (timeouts, 5xx) on idempotent operations"
      - "4xx client errors like 400 and 404"
      - "Errors that a lower layer already retried and exhausted"
    answer: 1
    explanation: |
      Retry only transient, retryable errors (timeouts, connection resets, 5xx) and only
      for idempotent operations, so a duplicate doesn't cause a double side effect.
      Retrying deterministic 4xx errors just wastes capacity, and re-retrying an error a
      lower layer already exhausted amplifies load.
    ref: "concepts.md#anti-pattern-retry-storms-retry-amplification"

  - id: cascading-failures-and-antipatterns-013
    difficulty: intermediate
    tags: [thundering-herd, jitter, backoff]
    question: |
      Many clients fail at the same instant and all use exponential backoff but with NO
      jitter. What happens on the next attempt and why?
    options:
      - "The load is perfectly smoothed because backoff spreads them out"
      - "Only one client retries; the rest give up"
      - "They all wait the same fixed interval and retry at the same moment, recreating the spike (thundering herd)"
      - "Retries are automatically randomized by TCP"
    answer: 2
    explanation: |
      Backoff fixes the *rate* of retries but not their *synchronization*. Clients that
      failed together back off by the same amount and fire together, recreating the very
      spike that caused the failure. Jitter — randomizing the wait — is what desynchronizes
      them.
    ref: "concepts.md#anti-pattern-thundering-herd--synchronized-clients-jitter"

  - id: cascading-failures-and-antipatterns-014
    difficulty: advanced
    tags: [jitter, backoff, formula, aws]
    question: |
      Per the AWS 'Exponential Backoff And Jitter' analysis, which formula describes
      'full jitter,' the scheme that minimizes contention?
    options:
      - "sleep = random_between(0, min(max_backoff, base * 2 ** attempt))"
      - "sleep = base * 2 ** attempt (no randomization)"
      - "sleep = max_backoff always"
      - "sleep = base * attempt (linear, no randomization)"
    answer: 0
    explanation: |
      Full jitter picks the delay uniformly at random in [0, cap], where
      cap = min(max_backoff, base * 2 ** attempt). Marc Brooker's analysis showed full
      jitter minimizes contention and total completion time versus fixed backoff or
      'equal jitter' schemes because it maximally spreads clients out.
    ref: "concepts.md#anti-pattern-thundering-herd--synchronized-clients-jitter"

  - id: cascading-failures-and-antipatterns-015
    difficulty: intermediate
    tags: [thundering-herd, cron, ttl]
    question: |
      Besides un-jittered retries, which of these is a classic source of a thundering
      herd?
    options:
      - "Cron jobs, TTLs, or client reconnects that all fire at the same instant"
      - "Requests arriving at a smooth, uniform rate"
      - "A load balancer distributing traffic evenly"
      - "A database with an index on the primary key"
    answer: 0
    explanation: |
      Synchronization is the enemy of smooth load. Cron jobs all firing at :00, TTLs that
      expire together, a cache flush, a config push, or every client reconnecting to a
      recovering service at once all create instantaneous spikes far above the average
      rate. Jitter should be added to anything many clients do on a schedule.
    ref: "concepts.md#anti-pattern-thundering-herd--synchronized-clients-jitter"

  - id: cascading-failures-and-antipatterns-016
    difficulty: intermediate
    tags: [cache-stampede, dogpile, definition]
    question: |
      What is a cache stampede (dogpile)?
    options:
      - "A cache that grows without bound until it OOMs"
      - "A cache that returns stale data indefinitely"
      - "A cache eviction policy that removes the wrong keys"
      - "A hot key expires and many concurrent requests all miss and recompute it at once, hammering the backend"
    answer: 3
    explanation: |
      A cache stampede occurs when a hot cached item expires and, in the gap before it is
      repopulated, many concurrent requests all miss and all recompute the same expensive
      value at once. This can overwhelm the backend and prevent the cache from refilling —
      a self-sustaining, metastable-flavoured loop.
    ref: "concepts.md#anti-pattern-cache-stampede--dogpile"

  - id: cascading-failures-and-antipatterns-017
    difficulty: advanced
    tags: [cache-stampede, request-coalescing, single-flight]
    question: |
      Which technique attacks a cache stampede by having concurrent misses for the same
      key wait for and share a single recomputation?
    options:
      - "Request coalescing / single-flight"
      - "Increasing the cache TTL to infinity"
      - "Sharding the cache across more nodes"
      - "Disabling the cache entirely"
    answer: 0
    explanation: |
      Request coalescing (single-flight) lets the first miss recompute while concurrent
      misses for the same key wait for and share that one result, via a per-key in-flight
      lock or promise. It's local, needs no extra infrastructure, and directly attacks the
      'many identical concurrent recomputes' root cause (Go's singleflight,
      @Cacheable(sync=true)).
    ref: "concepts.md#anti-pattern-cache-stampede--dogpile"

  - id: cascading-failures-and-antipatterns-018
    difficulty: expert
    tags: [cache-stampede, xfetch, probabilistic-early-expiration]
    question: |
      Probabilistic early expiration (XFetch) prevents cache stampedes by doing what?
    options:
      - "Never expiring hot keys"
      - "Locking the entire cache during any recompute"
      - "Letting each reader volunteer to refresh the key slightly before it expires, with probability rising as expiry nears"
      - "Serving only stale data and never recomputing"
    answer: 2
    explanation: |
      XFetch has each reader probabilistically refresh the key a little before it actually
      expires, recomputing if now - delta*beta*ln(rand()) >= expiry. Because the refresh
      time is randomized and rises toward expiry, refreshes almost never coincide — no
      thundering herd and no lock — at the cost of storing the compute time (delta) and
      tuning beta.
    ref: "concepts.md#anti-pattern-cache-stampede--dogpile"

  - id: cascading-failures-and-antipatterns-019
    difficulty: intermediate
    tags: [cache-stampede, stale-while-revalidate]
    question: |
      What does 'stale-while-revalidate' do to help with cache misses on hot keys?
    options:
      - "Blocks all readers until the fresh value is computed"
      - "Deletes the key so the next read recomputes"
      - "Doubles the TTL on every read"
      - "Serves the stale value immediately while an async job refreshes it, so users never wait on the miss"
    answer: 3
    explanation: |
      Stale-while-revalidate returns the slightly-stale cached value right away and kicks
      off an asynchronous refresh in the background. Users never block on a recompute, and
      only one background job refreshes, avoiding the herd of synchronous misses.
    ref: "concepts.md#anti-pattern-cache-stampede--dogpile"

  - id: cascading-failures-and-antipatterns-020
    difficulty: intermediate
    tags: [unbounded-queue, littles-law, latency]
    question: |
      Why is an unbounded work queue dangerous under sustained overload?
    options:
      - "It uses too little memory"
      - "It hides overload, blows up latency (Little's Law), causes work to complete after clients have already timed out, and can OOM the process"
      - "It rejects requests too aggressively"
      - "It forces retries to stop"
    answer: 1
    explanation: |
      An unbounded queue hides overload until it's catastrophic: wait time = queue length
      / throughput, so latency grows without limit; once queue latency exceeds the client
      timeout, completed work is thrown away (the client gave up), wasting capacity; and it
      can OOM the process. The fix is a bounded queue with a rejection policy (fail fast /
      shed load).
    ref: "concepts.md#anti-pattern-unbounded-queues--queue-growth"

  - id: cascading-failures-and-antipatterns-021
    difficulty: advanced
    tags: [queue, backpressure, lifo]
    question: |
      During overload, why can a LIFO (newest-first) or deadline-aware dequeue policy be
      better than plain FIFO?
    options:
      - "LIFO is always faster than FIFO"
      - "FIFO uses more memory"
      - "It works on requests that haven't already exceeded the client timeout and drops the stale head, avoiding wasted work on doomed requests"
      - "LIFO guarantees fairness across all clients"
    answer: 2
    explanation: |
      Under a growing backlog, the oldest (head) items are the most likely to have already
      exceeded the client's timeout, so FIFO spends capacity producing responses nobody
      reads. LIFO / deadline-aware dequeuing prioritizes requests that can still be served
      within their deadline and drops the stale head, reducing wasted work.
    ref: "concepts.md#anti-pattern-unbounded-queues--queue-growth"

  - id: cascading-failures-and-antipatterns-022
    difficulty: intermediate
    tags: [queue, capacity, misconception]
    question: |
      Under a persistent gap where arrival rate exceeds service rate, why is 'just make the
      queue bigger' the wrong instinct?
    options:
      - "A bigger queue only delays and deepens the collapse, adding latency and storing doomed work; queues size for bursts, not a permanent arrival>service gap"
      - "Bigger queues always reduce latency"
      - "Bigger queues automatically add processing capacity"
      - "Queues cannot be resized once created"
    answer: 0
    explanation: |
      Queues absorb *bursts*, not a sustained mismatch. If arrival > service forever, no
      queue size saves you — a bigger queue just adds latency and stores more doomed work
      before the inevitable collapse. You must shed load or add real processing capacity.
    ref: "concepts.md#anti-pattern-unbounded-queues--queue-growth"

  - id: cascading-failures-and-antipatterns-023
    difficulty: beginner
    tags: [timeouts, missing-timeout, mechanism]
    question: |
      Why is a missing (infinite) timeout on a remote call a cascade enabler?
    options:
      - "It makes requests faster on the happy path"
      - "It reduces network bandwidth usage"
      - "It prevents retries from ever firing"
      - "A single hung dependency holds a worker forever, and a trickle of hung calls drains the pool"
    answer: 3
    explanation: |
      With no timeout (the JDK default for many socket/HTTP clients is effectively
      infinite), one hung dependency holds a worker thread forever. A steady trickle of
      hung calls steadily drains the pool until the service is unresponsive — the enabling
      condition for thread-pool-exhaustion cascades. Every remote call needs both a
      connection and a read timeout.
    ref: "concepts.md#anti-pattern-missing--unbounded-timeouts"

  - id: cascading-failures-and-antipatterns-024
    difficulty: advanced
    tags: [timeouts, slo, latency-budget]
    question: |
      How should you generally choose the timeout value for a remote dependency call?
    options:
      - "Equal to the dependency's average happy-path latency"
      - "As long as possible so requests rarely fail"
      - "From your own SLO / latency budget, often near the dependency's p99.9, but well within your own deadline"
      - "Exactly 30 seconds for every call"
    answer: 2
    explanation: |
      Set timeouts from your latency budget/SLO, not the dependency's happy-path latency. A
      good starting point is around the p99.9 of normal latency (so you rarely cut off
      healthy slow requests) while staying well within your own deadline. Too tight cuts
      off healthy requests; too loose fails to protect your thread pool.
    ref: "concepts.md#anti-pattern-missing--unbounded-timeouts"

  - id: cascading-failures-and-antipatterns-025
    difficulty: advanced
    tags: [deadline-propagation, timeout-budget]
    question: |
      What is 'deadline propagation' (timeout budgets), and why does it matter?
    options:
      - "Setting the same timeout on every service in the company"
      - "Passing the remaining deadline down the call chain so inner calls can't take longer than the outer caller will wait"
      - "Removing timeouts on inner calls to give them more time"
      - "Logging the timeout value in every request"
    answer: 1
    explanation: |
      Deadline propagation passes a *remaining* deadline down the chain (as in gRPC
      deadlines / context propagation), so an inner call is cancelled if its parent has
      already run out of time. An inner timeout longer than the outer one is useless work —
      the caller has already given up — so propagating the deadline avoids wasted effort.
    ref: "concepts.md#anti-pattern-missing--unbounded-timeouts"

  - id: cascading-failures-and-antipatterns-026
    difficulty: intermediate
    tags: [shared-fate, bulkhead, isolation]
    question: |
      A single thread pool serves all of a service's endpoints. One endpoint calls a slow
      dependency and exhausts the pool, taking down unrelated endpoints too. Which pattern
      most directly prevents this?
    options:
      - "Increasing the global timeout"
      - "Adding more retries"
      - "Merging all endpoints into one handler"
      - "Bulkheads: separate thread/connection pools per dependency or criticality"
    answer: 3
    explanation: |
      This is shared fate. Bulkheads partition resources — separate thread/connection pools
      per dependency, per tenant, or per criticality tier — so one slow dependency can only
      exhaust its own partition, not starve unrelated work. Named for a ship's watertight
      compartments.
    ref: "concepts.md#anti-pattern-shared-fate--tight-coupling"

  - id: cascading-failures-and-antipatterns-027
    difficulty: advanced
    tags: [shared-fate, cell-based, shuffle-sharding, multi-tenant]
    question: |
      In a multi-tenant system, which approach best bounds the blast radius of a single
      'poison' tenant that consumes disproportionate capacity?
    options:
      - "Cell-based architecture / shuffle sharding to isolate tenants into partitions"
      - "One large shared pool for all tenants for efficiency"
      - "Removing all rate limits to keep latency low"
      - "Giving the poison tenant its own retries"
    answer: 0
    explanation: |
      Cell-based architecture and shuffle sharding assign tenants to isolated partitions so
      one abusive tenant can only degrade its own cell (and the small overlap with others),
      not the whole fleet. This is the bulkhead idea applied at the tenant level to bound
      blast radius.
    ref: "concepts.md#anti-pattern-shared-fate--tight-coupling"

  - id: cascading-failures-and-antipatterns-028
    difficulty: intermediate
    tags: [tight-coupling, async, decoupling]
    question: |
      Which tactic breaks *synchronous* tight coupling so a slow consumer doesn't block the
      producer?
    options:
      - "Making both components share one database"
      - "Increasing the producer's thread pool size only"
      - "Introducing an asynchronous queue between them"
      - "Calling the consumer twice per request"
    answer: 2
    explanation: |
      Asynchrony via a queue decouples producer and consumer: the producer hands work off
      and continues, so a slow or down consumer causes backlog rather than blocking the
      producer's threads. Sharing a database instead increases shared fate, and merely
      enlarging the pool doesn't remove the coupling.
    ref: "concepts.md#anti-pattern-shared-fate--tight-coupling"

  - id: cascading-failures-and-antipatterns-029
    difficulty: advanced
    tags: [health-check, death-spiral, mechanism]
    question: |
      Describe the 'health-check death spiral.'
    options:
      - "Health checks run too infrequently to detect failures"
      - "Overloaded instances fail health checks and are removed, concentrating load on survivors that then also fail, shrinking the healthy pool toward zero"
      - "Health checks return false positives, keeping dead instances in service"
      - "Health checks consume all the CPU on healthy nodes"
    answer: 1
    explanation: |
      Under load, an instance slow enough to time out its health check is removed by the
      load balancer/orchestrator. Its traffic redistributes onto the remaining instances,
      overloading them so they too fail health checks and are removed — a shrinking healthy
      pool concentrates load and kills survivors one by one, potentially reaching zero
      healthy instances that collectively could have served the load.
    ref: "concepts.md#anti-pattern-the-health-check-death-spiral"

  - id: cascading-failures-and-antipatterns-030
    difficulty: advanced
    tags: [liveness, readiness, kubernetes, health-check]
    question: |
      In Kubernetes, what is the key difference between a failing liveness probe and a
      failing readiness probe, and why does it matter for cascades?
    options:
      - "Both restart the container; there is no difference"
      - "A readiness failure restarts the pod; liveness only logs a warning"
      - "Liveness controls CPU limits; readiness controls memory limits"
      - "A liveness failure restarts the container, while a readiness failure only removes it from the load-balancer pool (no restart)"
    answer: 3
    explanation: |
      A failing liveness probe *restarts* the container; a failing readiness probe only
      *depools* it (no restart). During overload, gating liveness on downstream health
      would restart your whole fleet at once. Liveness should be a cheap local check; deep
      dependency checks belong at most in readiness.
    ref: "concepts.md#anti-pattern-the-health-check-death-spiral"

  - id: cascading-failures-and-antipatterns-031
    difficulty: advanced
    tags: [static-stability, minimum-healthy, fail-static]
    question: |
      A load balancer decides that 100% of instances are 'unhealthy' during a global
      overload. What behaviour helps avoid making the outage worse?
    options:
      - "Enforce a minimum-healthy threshold / fail static: keep serving with what you have rather than routing to nothing"
      - "Route to none of them and return errors immediately"
      - "Restart every instance simultaneously"
      - "Immediately scale the fleet to zero and rebuild"
    answer: 0
    explanation: |
      If *everything* looks unhealthy, it's more likely a check problem or global overload
      than a genuine total failure. A minimum-healthy floor ('fail static' / static
      stability) refuses to remove instances below a threshold, so the LB keeps sending
      traffic to instances that can still do useful work rather than routing to nothing.
    ref: "concepts.md#anti-pattern-the-health-check-death-spiral"

  - id: cascading-failures-and-antipatterns-032
    difficulty: intermediate
    tags: [health-check, deep-check, correlated-failure]
    question: |
      Why is it risky to make a service's liveness health check depend on a shared
      downstream (e.g., ping the database)?
    options:
      - "It makes the check slightly slower"
      - "It improves accuracy too much"
      - "A single downstream blip would fail every instance's check at once, causing correlated fleet-wide removal/restart"
      - "Databases cannot respond to health checks"
    answer: 2
    explanation: |
      A deep liveness check tied to a shared dependency creates correlated failure: when
      that dependency has a brief blip, every instance fails its check simultaneously and
      the whole fleet is removed or restarted at once — turning a minor downstream hiccup
      into a total outage. Keep liveness local.
    ref: "concepts.md#anti-pattern-the-health-check-death-spiral"

  - id: cascading-failures-and-antipatterns-033
    difficulty: intermediate
    tags: [client-bug, self-inflicted, overload]
    question: |
      Studies and postmortems show a large share of outages are 'self-inflicted.' What does
      this term describe here?
    options:
      - "Failures caused by external DDoS attackers"
      - "A client or deploy generating far more load than intended (retry bug, tight polling, accidental fan-out), overwhelming the server"
      - "Hardware failures in the data center"
      - "Cosmic-ray bit flips in memory"
    answer: 1
    explanation: |
      Self-inflicted overload comes from your own side: a client retry bug, a polling
      interval that drops from 60 s to 1 s, an accidental N+1 fan-out, or a bad batch
      parallelism. The server must protect itself against a misbehaving insider, because
      the client will misbehave sooner or later.
    ref: "concepts.md#anti-pattern-overload-from-a-client-bug-self-inflicted-load"

  - id: cascading-failures-and-antipatterns-034
    difficulty: advanced
    tags: [query-of-death, poison-request]
    question: |
      What is a 'query of death' (poison request)?
    options:
      - "A query that returns no rows"
      - "A query that always succeeds but slowly"
      - "A deliberately malformed TLS handshake"
      - "A specific input that is disproportionately expensive or crashes the handler, so a client repeating it does outsized damage"
    answer: 3
    explanation: |
      A query of death is an input that is pathologically expensive or crashes/hangs the
      handler. A client that repeats it (often via retries after the crash) can take down
      instance after instance. Defences include input validation/limits, isolation, and not
      blindly retrying requests that just killed a handler.
    ref: "concepts.md#anti-pattern-overload-from-a-client-bug-self-inflicted-load"

  - id: cascading-failures-and-antipatterns-035
    difficulty: advanced
    tags: [admission-control, rate-limiting, self-protection]
    question: |
      Which layer must every service have to protect itself even when callers are buggy or
      retry-happy?
    options:
      - "An admission-control layer (rate limits + load shedding) that protects the service regardless of client behaviour"
      - "A larger connection pool"
      - "More verbose logging"
      - "A longer default timeout"
    answer: 0
    explanation: |
      Reliability engineering assumes clients will eventually misbehave. Server-side
      admission control — per-client rate limits/quotas plus priority-aware load shedding —
      protects the service even against buggy or malicious callers. It's the same mechanism
      as abuse-prevention rate limiting (see security / design-rate-limiter) but the motive
      here is self-protection.
    ref: "concepts.md#anti-pattern-overload-from-a-client-bug-self-inflicted-load"

  - id: cascading-failures-and-antipatterns-036
    difficulty: advanced
    tags: [recovery, ordering, incident]
    question: |
      During an active cascade driven by retries, why is 'add more capacity' often the
      wrong *first* move?
    options:
      - "Capacity is free, so it's always the right move"
      - "Adding capacity always corrupts data"
      - "New capacity is consumed by the feedback loop as fast as you add it, so you must break the loop (shed load / disable retries) first"
      - "Capacity changes require a full redeploy that takes days"
    answer: 2
    explanation: |
      While the amplifying loop is active, added capacity is eaten by retries/overload as
      fast as it appears, and for a stateful bottleneck (single DB, quota) more stateless
      replicas can even increase pressure. Break the loop first — disable retries, shed
      load, reduce fan-out — then restore/add capacity, then ramp back slowly.
    ref: "concepts.md#recovery-breaking-an-active-cascade"

  - id: cascading-failures-and-antipatterns-037
    difficulty: advanced
    tags: [recovery, rolling-restart, warm-cache]
    question: |
      A rolling restart is a useful recovery tool. What does it fix, and what is the trap?
    options:
      - "It fixes ongoing overload; there is no trap"
      - "It clears stuck state (hung threads, leaks, bad config) — but restarting into an active overload drops warm caches/pools and often deepens the outage"
      - "It permanently increases capacity"
      - "It resets the retry budget so retries can resume"
    answer: 1
    explanation: |
      A rolling restart clears stuck in-memory state: hung threads on dead connections,
      corrupted state, memory leaks, GC death spirals, bad in-flight config. But it does not
      fix an ongoing overload — restarting into the same load re-collapses and loses warm
      caches, making things worse. Restart only after demand is under control.
    ref: "concepts.md#recovery-breaking-an-active-cascade"

  - id: cascading-failures-and-antipatterns-038
    difficulty: advanced
    tags: [recovery, cold-cache, ramp, thundering-herd]
    question: |
      After a full outage, why should you re-introduce traffic gradually rather than all at
      once?
    options:
      - "Because gradual ramp uses less electricity"
      - "Because clients need time to update their DNS caches"
      - "Because logs need to catch up first"
      - "Everything is cold (empty caches, all clients reconnecting), so a sudden full load is a thundering herd that can immediately re-collapse the system"
    answer: 3
    explanation: |
      Post-outage, caches are empty and every client wants to reconnect at once. Dumping
      full load onto a cold system is a thundering herd that overwhelms it before caches warm
      and pools stabilize, causing immediate re-collapse. Ramp traffic slowly while watching
      for the 'is load going up?' signal.
    ref: "concepts.md#recovery-breaking-an-active-cascade"

  - id: cascading-failures-and-antipatterns-039
    difficulty: intermediate
    tags: [recovery, fan-out, degradation]
    question: |
      Reducing fan-out and disabling optional/expensive features during a cascade helps
      because it does what?
    options:
      - "Cuts the per-request cost (and total load), giving the system a chance to catch up"
      - "Increases the number of downstream calls per request"
      - "Forces all requests to retry"
      - "Improves cache hit rate by clearing the cache"
    answer: 0
    explanation: |
      Cutting fan-out (fewer downstream calls per request) and turning off expensive or
      optional features (graceful degradation) lowers the cost of each request and the total
      offered load, which — together with shedding and disabling retries — helps demand drop
      below capacity so the system can recover. See graceful-degradation-and-fallbacks.
    ref: "concepts.md#recovery-breaking-an-active-cascade"

  - id: cascading-failures-and-antipatterns-040
    difficulty: intermediate
    tags: [circuit-breaker, retries, cross-ref]
    question: |
      How does an open circuit breaker interact with retries during a downstream outage?
    options:
      - "It forces retries to happen faster"
      - "It ignores retries entirely"
      - "It stops calls (and thus retries) to the known-sick dependency, failing fast and preventing a retry storm"
      - "It converts retries into synchronous blocking calls"
    answer: 2
    explanation: |
      When a breaker is open, calls to the failing dependency short-circuit and fail fast,
      so retries don't get sent to a dependency that's already down. This breaks the retry
      loop, frees threads immediately, and gives the dependency room to recover. See
      circuit-breakers-and-bulkheads.
    ref: "concepts.md#anti-pattern-retry-storms-retry-amplification"

  - id: cascading-failures-and-antipatterns-041
    difficulty: expert
    tags: [gc-death-spiral, feedback-loop, jvm]
    question: |
      A JVM service under rising load starts spending more and more time in garbage
      collection, latency climbs, work backs up, and it gets worse still. What kind of
      failure pattern is this?
    options:
      - "A cache stampede"
      - "A GC/memory death spiral — a positive feedback loop where GC time steals serving time, backing up more work and more allocation"
      - "A query of death"
      - "A health-check false positive"
    answer: 1
    explanation: |
      This is a positive feedback loop: higher load means more allocation, which means
      longer/more frequent GC pauses, which raise latency and back up work, which increases
      allocation further. Time spent in GC is stolen from serving, reinforcing the spiral.
      Relief usually requires shedding load and/or restarting to clear heap pressure.
    ref: "concepts.md#positive-feedback-loops-as-the-root-cause"

  - id: cascading-failures-and-antipatterns-042
    difficulty: intermediate
    tags: [diagnostic, feedback-loop, incident]
    question: |
      What single diagnostic question best reveals whether you're facing a positive feedback
      loop (versus a bounded outage)?
    options:
      - "Is the CPU above 50%?"
      - "Is the deploy older than one week?"
      - "Are there more than three services involved?"
      - "Is offered load going UP as the system gets sicker?"
    answer: 3
    explanation: |
      If load rises as the system degrades, you almost certainly have a positive feedback
      loop (retries, health-check churn, queue growth), and adding capacity may not help —
      you must break the loop first. It's a blunt but powerful triage question in incidents
      and interviews alike.
    ref: "concepts.md#positive-feedback-loops-as-the-root-cause"

  - id: cascading-failures-and-antipatterns-043
    difficulty: advanced
    tags: [remediation, feedback-loop, judgment]
    question: |
      You rolling-restarted an overloaded fleet to 'clear things up,' and the outage got
      noticeably worse. What most likely happened?
    options:
      - "The restart momentarily reduced capacity and dropped warm caches, shifting more load onto the remaining warm instances and reinforcing the overload loop"
      - "The restart fixed the issue and metrics are just lagging"
      - "Restarts always fix cascades, so this is impossible"
      - "The database schema changed during the restart"
    answer: 0
    explanation: |
      Restarting under active overload removes capacity temporarily, drops warm caches/pools
      (so post-restart instances are slower and hit cold backends), and concentrates load on
      the shrinking warm set — strengthening the positive feedback loop. Always ask 'what did
      my action feed back into?' before repeating it.
    ref: "concepts.md#recovery-breaking-an-active-cascade"

  - id: cascading-failures-and-antipatterns-044
    difficulty: intermediate
    tags: [design, prevention, checklist]
    question: |
      Which combination best describes designing so a cascade *cannot* form in the first
      place?
    options:
      - "Infinite timeouts, unbounded queues, uncapped retries, 95% utilization"
      - "Timeouts everywhere + deadline propagation, bounded queues + load shedding, capped/jittered retries + budget, circuit breakers, bulkheads/cells, headroom"
      - "One shared thread pool, one shared DB, deep liveness checks"
      - "More retries at every layer plus bigger queues"
    answer: 1
    explanation: |
      Cascade-resistant design layers negative-feedback and isolation mechanisms: timeouts
      + deadline propagation to bound holding, bounded queues + shedding for admission
      control, capped + jittered retries + a budget, circuit breakers to stop calling the
      sick, bulkheads/cells for isolation, graceful degradation, and utilization headroom —
      proven with chaos testing.
    ref: "concepts.md#recovery-breaking-an-active-cascade"

  - id: cascading-failures-and-antipatterns-045
    difficulty: intermediate
    tags: [ttl, jitter, cache]
    question: |
      A batch job writes 10,000 cache entries at the same time, all with a fixed 5-minute
      TTL. What's the risk and the fix?
    options:
      - "No risk; fixed TTLs are always best"
      - "The keys will corrupt each other; use separate caches"
      - "All 10,000 keys expire simultaneously, causing a synchronized miss storm; add jitter to the TTLs (e.g. 5 min +/- X%)"
      - "The cache will never evict them; use a shorter TTL of 1 second"
    answer: 2
    explanation: |
      Keys written together with an identical TTL expire together, producing a synchronized
      thundering herd of misses that all hit the backend at once. Jittering TTLs (e.g.
      randomizing by +/- some percentage) spreads expirations over time so they don't
      coincide.
    ref: "concepts.md#anti-pattern-thundering-herd--synchronized-clients-jitter"

  - id: cascading-failures-and-antipatterns-046
    difficulty: advanced
    tags: [cache-stampede, distributed-lock, trade-off]
    question: |
      Using a distributed lock (e.g. Redis SET NX PX) so only one caller recomputes a hot
      key on a miss carries which important caveat?
    options:
      - "The lock never needs a timeout"
      - "It eliminates the need for any cache"
      - "It only works for read-only workloads"
      - "The lock must have a TTL/lease so a crashed lock-holder doesn't leave the key stuck forever"
    answer: 3
    explanation: |
      A recompute lock ensures a single caller regenerates the value while others serve
      stale or wait briefly, but it introduces a distributed-lock dependency. The lock must
      carry a TTL/lease (the PX in SET NX PX) so that if the holder crashes mid-recompute,
      the lock expires and another caller can proceed — otherwise the key is stuck.
    ref: "concepts.md#anti-pattern-cache-stampede--dogpile"

  - id: cascading-failures-and-antipatterns-047
    difficulty: expert
    tags: [scenario, stateful-bottleneck, capacity, judgment]
    question: |
      Your stateless API tier is at 100% CPU and errors are climbing, but the single primary
      database it depends on is also saturated. You autoscale the API tier from 20 to 60
      instances. What is the likely outcome?
    options:
      - "The outage resolves because more API capacity always helps"
      - "It gets worse or stays broken: more stateless replicas increase pressure on the shared saturated database bottleneck"
      - "The database automatically shards itself"
      - "Latency drops to normal instantly"
    answer: 1
    explanation: |
      When the true bottleneck is a stateful, shared resource (one primary DB, a quota),
      adding stateless replicas doesn't add real capacity — it drives *more* concurrent load
      at the saturated backend, deepening the problem. The fix is to relieve the actual
      bottleneck: shed load, reduce fan-out/query cost, add read replicas/caching, or throttle
      at the edge.
    ref: "concepts.md#recovery-breaking-an-active-cascade"

  - id: cascading-failures-and-antipatterns-048
    difficulty: intermediate
    tags: [load-shedding, priority, criticality]
    question: |
      When shedding load to protect a service, what is the preferred order in which to drop
      traffic?
    options:
      - "Randomly drop any request regardless of importance"
      - "Drop low-priority/best-effort traffic before critical traffic, using request priority/criticality"
      - "Drop the newest requests only"
      - "Drop critical traffic first since it's most expensive"
    answer: 1
    explanation: |
      Effective load shedding is priority-aware: shed best-effort/low-criticality traffic
      (batch, prefetch, non-essential features) before user-facing critical requests, so
      scarce capacity goes to what matters most. This requires tagging requests with a
      criticality class. See load-shedding-and-backpressure.
    ref: "concepts.md#anti-pattern-overload-from-a-client-bug-self-inflicted-load"

  - id: cascading-failures-and-antipatterns-049
    difficulty: expert
    tags: [goodput, throughput, metrics, judgment]
    question: |
      During an incident, a dashboard shows throughput pegged at its all-time high and CPU
      at 100%, yet customers report near-total failure. Why can both be true at once, and
      which metric would have told the real story?
    options:
      - "The dashboard is wrong; high throughput at 100% CPU means the system is healthy"
      - "Throughput counts all processed requests including ones completed after the client's deadline; goodput (success-within-deadline) is what collapsed"
      - "CPU is a lagging metric; only memory reflects real capacity"
      - "Customers are wrong; retries mean the requests eventually succeed"
    answer: 1
    explanation: |
      Throughput counts requests processed per second regardless of whether anyone still
      wants the result. In a cascade the system stays maximally busy producing responses
      that arrive after every client has timed out and retried, so throughput looks great
      while goodput — useful work completed before the deadline — falls toward zero. Alert
      on goodput / success-within-deadline, not raw throughput.
    ref: "concepts.md#goodput-vs-throughput-and-dropping-doomed-work"

  - id: cascading-failures-and-antipatterns-050
    difficulty: advanced
    tags: [goodput, deadline, doomed-work, sre]
    question: |
      The SRE rule "don't get credit for late assignments" recommends what concrete server
      behaviour?
    options:
      - "Extend every request's deadline so more work completes"
      - "Always process the oldest request first to be fair"
      - "Retry any request that misses its deadline"
      - "Before each stage of work, check whether the request's deadline has already passed and drop it if so"
    answer: 3
    explanation: |
      A request whose deadline has already expired is doomed — completing it is pure waste
      that steals capacity from requests that could still be served in time. The server
      should check the remaining deadline before starting each stage of work and abandon
      expired requests. This complements LIFO/deadline-aware dequeuing by actively dropping
      stale work rather than merely reordering it.
    ref: "concepts.md#goodput-vs-throughput-and-dropping-doomed-work"

  - id: cascading-failures-and-antipatterns-051
    difficulty: expert
    tags: [bimodal-latency, threads, deadline, sre-example]
    question: |
      A fleet of 10 servers x 100 threads (1000 threads) normally serves 1000 QPS at 0.1 s
      latency (~100 threads busy). Now 5% of requests hang and hit a 100 s deadline. Roughly
      what happens to the fleet-wide error rate?
    options:
      - "Nothing significant; only 5% of requests are affected"
      - "About a 5% error rate, matching the fraction of slow requests"
      - "The slow 5% demands ~5000 threads (1000 x 0.05 x 100) against only 1000 available, saturating the fleet so roughly 80% of requests error"
      - "Latency doubles but throughput is unaffected"
    answer: 2
    explanation: |
      The slow tail consumes 1000 QPS x 5% x 100 s = 5000 thread-seconds of demand against
      only 1000 threads, so the hung 5% hoards the entire pool and the fast 95% can't get
      threads either — the fleet serves only a small fraction and roughly 80% of requests
      error out. A tiny defect plus a generous deadline destroys the fleet; cap in-flight
      requests per client class (e.g. no class holds more than ~25% of threads).
    ref: "concepts.md#bimodal-latency-and-the-fleet-wide-error-explosion"

  - id: cascading-failures-and-antipatterns-052
    difficulty: advanced
    tags: [bimodal-latency, deadline, mitigation]
    question: |
      In the bimodal-latency scenario where a slow 5% of requests consumes the whole thread
      pool, which factor most amplifies the damage, and what is the targeted mitigation?
    options:
      - "The generous 100 s deadline lets slow requests hoard threads; cap concurrent in-flight requests per client/class (e.g. <=25% of threads)"
      - "Insufficient logging; add more log statements"
      - "The request rate is too high; the only fix is to rate-limit all traffic equally"
      - "The threads are too fast; slow them down to balance load"
    answer: 0
    explanation: |
      The long deadline is the weapon: it lets the hung 5% hold threads for up to 100 s,
      hoarding the pool. The targeted fix is a concurrency cap per client or criticality
      class so no single class can consume the whole pool (a bulkhead applied to concurrency
      budget), plus tighter deadlines. Rate-limiting all traffic equally would also throttle
      the healthy majority.
    ref: "concepts.md#bimodal-latency-and-the-fleet-wide-error-explosion"

  - id: cascading-failures-and-antipatterns-053
    difficulty: expert
    tags: [resource-exhaustion, taxonomy, memory, cache]
    question: |
      Beyond threads, memory exhaustion is called out as an especially insidious cascade
      driver. What second-order amplifier does memory pressure specifically create?
    options:
      - "It increases network bandwidth linearly"
      - "It forces the CPU into a lower clock speed"
      - "It evicts cache objects, lowering the cache hit rate, which increases downstream RPCs and thus load"
      - "It causes file descriptors to leak"
    answer: 2
    explanation: |
      Under memory pressure the process evicts cached objects, so the cache hit rate drops,
      so more requests fall through to backends as RPCs, so load rises — a hidden amplifier
      on top of the direct OOM-kill risk. This is why memory is dangerous: the visible
      symptom (more backend load) is downstream of the real shortage.
    ref: "concepts.md#the-full-resource-exhaustion-taxonomy"

  - id: cascading-failures-and-antipatterns-054
    difficulty: advanced
    tags: [resource-exhaustion, file-descriptors, dependencies-among-resources]
    question: |
      An SRE notes that the "dependencies among resources" category is the trickiest in the
      resource-exhaustion taxonomy. Why?
    options:
      - "Because file descriptors are unlimited on modern systems"
      - "Because CPU and memory never interact"
      - "Because it only occurs in single-threaded systems"
      - "Because running low on one resource manifests as another running low, so the reported bottleneck may be a symptom, not the cause"
    answer: 3
    explanation: |
      Resources depend on each other, so a shortage in one shows up as a shortage in another
      — e.g. memory pressure surfacing as high CPU from garbage collection. Fixing the
      visible bottleneck (add CPU) does nothing if the primary shortage is memory. Always
      identify which resource is primary rather than treating the loudest symptom.
    ref: "concepts.md#the-full-resource-exhaustion-taxonomy"

  - id: cascading-failures-and-antipatterns-055
    difficulty: expert
    tags: [hysteresis, metastable, recovery-threshold, sre-number]
    question: |
      A server is healthy at 10,000 QPS but crash-loops at 11,000 QPS. During the crash loop
      only ~10% of servers are healthy at any moment. You drop offered load to 9,000 QPS.
      Does it recover, and what does this illustrate?
    options:
      - "Yes, 9,000 is below the 10,000 healthy level so it recovers immediately"
      - "Yes, but only if you also double the retry count"
      - "No, the servers are permanently damaged and must be replaced"
      - "No — because of hysteresis the recovery threshold is far below the trigger; you may need to drop to ~1,000 QPS before the fleet climbs out"
    answer: 3
    explanation: |
      The load that triggers collapse and the load required to recover are very different
      (hysteresis). With only ~10% of servers healthy during the crash loop, the surviving
      capacity is tiny, so you may have to drop to ~1,000 QPS to let the fleet recover, then
      ramp back up. Recovery load is far below trigger load — dropping just under the
      trigger is not enough.
    ref: "concepts.md#hysteresis-why-recovery-load-is-far-below-the-trigger-load"

  - id: cascading-failures-and-antipatterns-056
    difficulty: expert
    tags: [metastable, root-cause, trigger, sustaining-loop]
    question: |
      The metastable-failures research argues you should focus less on "what triggered the
      incident" and more on the sustaining loop. What is the core reasoning?
    options:
      - "Triggers are impossible to identify after the fact"
      - "The sustaining loop is always a hardware fault"
      - "Many different triggers lead to the same collapsed state via the same sustaining loop, so weakening the loop prevents a whole class of incidents"
      - "Triggers only matter for security incidents, not reliability"
    answer: 2
    explanation: |
      A deploy, a spike, or a slow dependency can each tip the system into the same
      metastable state through the same amplifying loop (retries, cache-miss amplification,
      GC). Chasing the specific trigger fixes one incident; identifying and weakening the
      sustaining loop prevents every incident that would have reached the same state. The
      loop, not the trigger, is the true root cause.
    ref: "concepts.md#hysteresis-why-recovery-load-is-far-below-the-trigger-load"

  - id: cascading-failures-and-antipatterns-057
    difficulty: expert
    tags: [metastable, common-case-optimization, headroom, retries]
    question: |
      Why can adding client retries to lower your steady-state error metric paradoxically
      make the system less reliable?
    options:
      - "Retries always increase latency, which counts as errors"
      - "Retries consume disk space that would otherwise buffer requests"
      - "It has no effect; retries are purely beneficial"
      - "It improves the common-case number while adding the exact amplifier that sustains a metastable collapse, so the system runs closer to the vulnerable edge"
    answer: 3
    explanation: |
      Optimizing only for the common case lets you run at a higher multiple of the vulnerable
      threshold for the same cost, silently eroding headroom. Retries specifically improve
      the steady-state error rate while introducing work amplification — the mechanism that
      keeps a metastable failure alive. So the metric looks better while vulnerability to
      self-sustaining collapse goes up.
    ref: "concepts.md#hysteresis-why-recovery-load-is-far-below-the-trigger-load"

  - id: cascading-failures-and-antipatterns-058
    difficulty: expert
    tags: [characteristic-metrics, metastable, observability, detection]
    question: |
      Brooker argues the most useful mitigation for metastable failures is to measure the
      "state of the feedback loop itself." Which metric best embodies this?
    options:
      - "Total requests served since process start"
      - "Retry rate as a fraction of requests (and queue-time distribution / cache-miss rate)"
      - "Average CPU temperature across the fleet"
      - "Number of deploys per week"
    answer: 1
    explanation: |
      Characteristic metrics track the sustaining loop directly — e.g. retries as a fraction
      of requests, queue sojourn-time distribution, cache-miss rate — so you can watch the
      loop wind up before it tips the system over and apply control (shed, cap retries).
      Alerting on the sustaining variable beats alerting on the downstream symptom.
    ref: "concepts.md#hysteresis-why-recovery-load-is-far-below-the-trigger-load"

  - id: cascading-failures-and-antipatterns-059
    difficulty: advanced
    tags: [congestion-collapse, retry-storm, definition]
    question: |
      What is "congestion collapse," and what is the canonical negative-feedback solution it
      is contrasted with?
    options:
      - "A database deadlock; solved by lock ordering"
      - "The state where offered load keeps rising while goodput falls toward zero as capacity is consumed by retransmissions/retries; TCP congestion control is the canonical negative-feedback fix"
      - "A memory leak; solved by garbage collection"
      - "A DNS misconfiguration; solved by shorter TTLs"
    answer: 1
    explanation: |
      Congestion collapse (first seen on 1980s NSFNET) is precisely the retry-storm end
      state: load climbs while goodput crashes because capacity goes to retransmitting work
      that never completes. TCP congestion control (slow start, AIMD, backoff on loss) is
      the textbook negative-feedback governor — senders reduce their rate on a congestion
      signal. The app-layer analogue is capped/jittered retries, retry budgets, and adaptive
      concurrency limits.
    ref: "concepts.md#congestion-collapse-and-tcps-negative-feedback-lesson"

  - id: cascading-failures-and-antipatterns-060
    difficulty: expert
    tags: [gray-failure, differential-observability, detection]
    question: |
      Monitoring shows every host green, but customers report widespread errors. What class
      of failure is this, and what is its defining property?
    options:
      - "A total outage; the property is that everything is down"
      - "A thundering herd; the property is synchronized retries"
      - "A configuration drift; the property is version mismatch"
      - "Gray failure; the defining property is differential observability — the component looks healthy to the monitoring system but unhealthy to the clients using it"
    answer: 3
    explanation: |
      Gray failure is defined by differential observability: the system's self-reported
      health and the client's experience disagree. A shallow self-check (process responds,
      local heartbeat "works for me") passes while real client RPCs fail — e.g. partial
      packet loss, a slow disk, or a process that can't reach dependencies. "All green but
      customers erroring" is gray failure until proven otherwise.
    ref: "concepts.md#gray-failure--differential-observability"

  - id: cascading-failures-and-antipatterns-061
    difficulty: expert
    tags: [gray-failure, health-check, fail-stop, cascade]
    question: |
      Why does gray failure drive cascades even when health checking is in place?
    options:
      - "Health checks are too slow to run frequently"
      - "Health checks always remove too many nodes"
      - "Gray failure only affects databases, which have no health checks"
      - "Health checks assume fail-stop, so a degraded-but-responsive node stays in rotation, keeps taking traffic it can't serve well, and drags peers down"
    answer: 3
    explanation: |
      Most health checks assume fail-stop (a node is either up or down). A gray-failing node
      answers the shallow check while serving clients badly, so it keeps receiving traffic it
      mishandles; requests pile up, time out, and retry, dragging peers into the same state.
      Detection needs client-observed SLIs and multi-vantage-point checking, not shallow
      self-reports.
    ref: "concepts.md#gray-failure--differential-observability"

  - id: cascading-failures-and-antipatterns-062
    difficulty: advanced
    tags: [gray-failure, progression, latent-fault]
    question: |
      The gray-failure paper describes a progression model. What is the correct order?
    options:
      - "fail-stop -> gray failure -> latent fault"
      - "gray failure -> latent fault -> fail-stop"
      - "latent fault -> gray failure -> fail-stop"
      - "fail-stop -> latent fault -> gray failure"
    answer: 2
    explanation: |
      A fault first exists but is masked (latent fault), then becomes felt by clients while
      monitoring still misses it (gray failure), and may eventually degrade into an obvious
      crash (fail-stop). The danger is the middle stage: by the time it becomes fail-stop it
      has often already seeded a cascade because the degraded node kept taking traffic.
    ref: "concepts.md#gray-failure--differential-observability"

  - id: cascading-failures-and-antipatterns-063
    difficulty: expert
    tags: [correlated-failure, redundancy, deploy]
    question: |
      You run 5 "independent" replicas and reason that with per-replica failure probability
      p, the chance all fail is p^5. Which real-world event most directly invalidates that
      math?
    options:
      - "A single replica running slightly hot"
      - "One replica being in a different rack"
      - "A gradual memory leak on one replica"
      - "A bad deploy or config push applied identically to all 5 replicas, so they fail together for the same reason (correlated failure)"
    answer: 3
    explanation: |
      The p^5 math assumes independent failures. A bad deploy or config push carries the same
      defect to every replica, so they fail simultaneously — the redundancy collapses to N=1.
      Correlated failure (shared deploy/config, a shared dependency blip, time correlation,
      or a query of death) is why redundancy alone doesn't buy availability; you must break
      the correlation with canaries, jitter, and cell isolation.
    ref: "concepts.md#correlated-failures-when-redundancy-fails-as-one"

  - id: cascading-failures-and-antipatterns-064
    difficulty: advanced
    tags: [correlated-failure, defenses, canary, jitter]
    question: |
      Which set of practices most directly reduces *correlated* failure (as opposed to
      simply adding more replicas)?
    options:
      - "Staged/canary rollouts, jitter on scheduled work, cell isolation, and not sharing the one dependency everyone reads on the hot path"
      - "Increasing the replica count and sharing one config service for consistency"
      - "Running all replicas on identical hardware in one rack for uniformity"
      - "Deploying to 100% of the fleet at once to minimize version skew"
    answer: 0
    explanation: |
      Redundancy only helps when failures are truly independent. Canary/staged rollouts stop
      a bad deploy from hitting everyone at once, jitter de-synchronizes scheduled work, cell
      isolation lets config be rolled per-cell, and avoiding a single shared hot-path
      dependency removes a common cause. Adding replicas or sharing a config service does the
      opposite — it preserves or increases correlation.
    ref: "concepts.md#correlated-failures-when-redundancy-fails-as-one"

  - id: cascading-failures-and-antipatterns-065
    difficulty: expert
    tags: [latency-knee, load-shedding, admission-control, http-503]
    question: |
      Why does effective load shedding reject requests *before* the system reaches its
      capacity "knee," and what is the standard HTTP shed signal?
    options:
      - "Because past the knee latency rises non-linearly toward infinity, so admitted work becomes zero-goodput; reject early (cheaply) and signal with HTTP 503"
      - "Because CPU is cheapest to measure at low load; signal with HTTP 200"
      - "Because the knee is where memory frees up; signal with HTTP 404"
      - "There is no benefit to rejecting early; signal with HTTP 500"
    answer: 0
    explanation: |
      Latency rises non-linearly past the knee, so requests admitted beyond it complete too
      late to be useful (zero goodput) while consuming capacity. Rejecting before the knee is
      cheap and keeps served requests fast. The web shed signal is HTTP 503 (Service
      Unavailable), ideally with a Retry-After header.
    ref: "concepts.md#load-shedding-brownout-and-the-latency-knee"

  - id: cascading-failures-and-antipatterns-066
    difficulty: expert
    tags: [codel, adaptive-lifo, queue-management]
    question: |
      Which pair correctly describes CoDel and adaptive LIFO as overload queue-management
      techniques?
    options:
      - "CoDel caps total queue length at a fixed number; adaptive LIFO always serves oldest-first"
      - "CoDel encrypts queued requests; adaptive LIFO compresses them"
      - "Both simply enlarge the queue to absorb more bursts"
      - "CoDel drops requests that have sat in the queue too long (bounding queue time); adaptive LIFO serves FIFO normally but switches to LIFO under overload to favor the freshest requests"
    answer: 3
    explanation: |
      CoDel (Controlled Delay) tracks the minimum queue sojourn time and drops requests that
      have waited too long, bounding queue *time* rather than length — attacking
      doomed-work-in-queue. Adaptive LIFO serves FIFO when healthy (fair) but flips to LIFO
      under overload so the freshest, least-likely-timed-out requests go first and the stale
      head is dropped. They are often paired (Facebook).
    ref: "concepts.md#load-shedding-brownout-and-the-latency-knee"

  - id: cascading-failures-and-antipatterns-067
    difficulty: advanced
    tags: [queue-sizing, thread-pool, sre-number]
    question: |
      What is the Google SRE guideline for sizing a thread-pool work queue relative to the
      pool for steady traffic?
    options:
      - "Make the queue at least 10x the pool size to absorb any burst"
      - "Match the queue exactly to the request rate in QPS"
      - "The queue should be unbounded so no request is ever rejected"
      - "Keep the queue small — target roughly <=50% of the thread-pool size (some systems go queueless and rely on failover)"
    answer: 3
    explanation: |
      SRE recommends keeping the queue small relative to the pool — around 50% of thread-pool
      size or less for steady traffic — because a large queue under sustained overload just
      stores doomed work and adds latency. Some systems (e.g. Gmail) run queueless and rely
      on failover instead. Unbounded queues hide overload until collapse.
    ref: "concepts.md#load-shedding-brownout-and-the-latency-knee"

  - id: cascading-failures-and-antipatterns-068
    difficulty: advanced
    tags: [degradation, shed-path, testing, exercise]
    question: |
      A team has a well-designed brownout/degradation path but it fails when finally needed
      in an incident. What is the most likely reason and the fix?
    options:
      - "The path was too fast; slow it down"
      - "Degradation paths cannot be tested at all"
      - "The path needed more replicas"
      - "Degradation and shed code paths are rarely exercised so they rot; regularly run some servers near overload and keep a fast, tested feature-flag off-switch"
    answer: 3
    explanation: |
      Shed and degradation paths run only during rare overload, so they bit-rot and break
      exactly when needed. Keep them alive by regularly running some servers near overload so
      the path executes in production, and by exposing a fast, well-tested off-switch/feature
      flag so you can degrade in seconds during an incident.
    ref: "concepts.md#load-shedding-brownout-and-the-latency-knee"

  - id: cascading-failures-and-antipatterns-069
    difficulty: expert
    tags: [release-it, slow-responses, fail-fast, anti-pattern]
    question: |
      Nygard argues one stability anti-pattern is "worse than outright failure." Which one,
      and why?
    options:
      - "Slow Responses, because a slow response holds the caller's thread (Little's Law) whereas a fast rejection frees it — so design to fail fast rather than respond slowly"
      - "Unbounded Result Sets, because they use disk"
      - "Integration Points, because they require network cables"
      - "Users, because they file support tickets"
    answer: 0
    explanation: |
      A slow response is worse than a fast failure: it holds the caller's worker thread for
      its full duration (the same Little's Law mechanism that exhausts pools), whereas a quick
      rejection frees the thread immediately and can be handled with a fallback or capped
      retry. Hence the Fail Fast pattern — reject early when you know you'll fail rather than
      responding slowly.
    ref: "concepts.md#the-full-release-it-anti-pattern-catalog"

  - id: cascading-failures-and-antipatterns-070
    difficulty: advanced
    tags: [release-it, unbalanced-capacities, scaling-effects, design]
    question: |
      A front-end tier is autoscaled for peak traffic while the back-end it calls is sized
      for average traffic. Which Release It! anti-pattern is this, and why is it a
      design-time cascade seed?
    options:
      - "Unbalanced Capacities — the front-end can generate more load than the back-end can serve, so a front-end surge overruns the back-end"
      - "Steady State — the back-end accumulates data forever"
      - "Let It Crash — the back-end restarts too often"
      - "Test Harness — the systems were never tested"
    answer: 0
    explanation: |
      Unbalanced Capacities: when the calling tier can produce more load than the receiving
      tier can absorb, a front-end scale-up (or spike) simply overruns the back-end,
      triggering a cascade. It's seeded at design time by scaling tiers for different load
      profiles. The fix is to verify the capacity ratio and add back-pressure/shedding at the
      boundary.
    ref: "concepts.md#the-full-release-it-anti-pattern-catalog"

  - id: cascading-failures-and-antipatterns-071
    difficulty: advanced
    tags: [release-it, unbounded-result-set, untrusted-input]
    question: |
      Why does Nygard treat a database result-set size as "untrusted input," and what is the
      Unbounded Result Sets anti-pattern?
    options:
      - "Result sets can contain SQL injection; validate every row"
      - "A query assumed to return a few rows can return millions (e.g. after data growth), OOMing the client; always LIMIT and treat result size as untrusted"
      - "Result sets are always encrypted and must be decrypted"
      - "The database chooses the row order randomly"
    answer: 1
    explanation: |
      Code often assumes a query returns a handful of rows, but data grows or a filter breaks
      and it returns millions, exhausting client memory and causing a crash. Treat result-set
      size as untrusted input: always paginate/LIMIT and cap what you will load, just as you
      bound any external input.
    ref: "concepts.md#the-full-release-it-anti-pattern-catalog"

  - id: cascading-failures-and-antipatterns-072
    difficulty: expert
    tags: [governor, force-multiplier, automation, judgment]
    question: |
      Post-incident reviews of large auto-scaling-triggered outages recommend the "Governor"
      pattern. What does it do and where is it applied?
    options:
      - "It rate-limits automated actuators (scaling policies, remediation bots, control-plane automation) so an automation bug can't act at machine speed and amplify a mistake"
      - "It doubles automation speed to resolve incidents faster"
      - "It disables all automation permanently"
      - "It adds retries to every automated action"
    answer: 0
    explanation: |
      A Governor rate-limits the *actuators* — the things that take action (scaling policies,
      auto-remediation, control-plane loops) — so that if the automation is wrong it can only
      do bounded damage per unit time, giving humans a chance to intervene. It directly
      counters the Force Multiplier anti-pattern, where automation amplifies a mistake at
      machine speed (a recurring theme in modern auto-scaling-triggered outages).
    ref: "concepts.md#the-full-release-it-anti-pattern-catalog"

  - id: cascading-failures-and-antipatterns-073
    difficulty: expert
    tags: [architecture, intra-layer, distributed-deadlock, call-graph]
    question: |
      SRE Ch. 22 recommends "always call downward in the stack" and avoiding intra-layer
      (peer-to-peer within a tier) communication. Which risks does peer-to-peer intra-tier
      calling specifically invite?
    options:
      - "Distributed deadlock, load-triggered O(n^2) spikes among peers, and bootstrapping problems where the tier can't start because it needs itself"
      - "Higher code readability and easier deploys"
      - "Reduced network latency and lower cost"
      - "Stronger consistency guarantees"
    answer: 0
    explanation: |
      When servers in the same tier call each other, you risk distributed deadlock (A waits
      on B waits on A), load-triggered spikes where a small event makes every peer talk to
      every peer (O(n^2)), and bootstrapping problems (the tier can't come up because it
      depends on itself). Downward-only call graphs can't form intra-tier loops; if a request
      hit the wrong backend, prefer telling the frontend to retry the right one.
    ref: "concepts.md#architecture-rules-call-downward-cancel-doomed-work"

  - id: cascading-failures-and-antipatterns-074
    difficulty: expert
    tags: [hedging, cancellation-propagation, tail-latency]
    question: |
      A team adds hedged requests (send a duplicate of a slow request to cut tail latency)
      but omits cancellation. What is the danger, and what makes hedging safe?
    options:
      - "No danger; hedging is always free"
      - "Without cancelling the loser, hedging can nearly double downstream load and, under stress, act as a retry-storm-shaped amplifier; make it safe by capping hedges and actively cancelling the outstanding calls once one wins"
      - "Hedging corrupts data unless it uses two-phase commit"
      - "Hedging only works with UDP"
    answer: 1
    explanation: |
      Hedging without cancellation leaves the losing duplicate running, so under load it can
      nearly double downstream work and behave like an amplifier feeding a cascade. Safe
      hedging caps how many duplicates you send and, when one wins (or the client
      disconnects/deadline passes), actively cancels the outstanding downstream calls so they
      stop consuming resources on doomed work — cancellation propagation.
    ref: "concepts.md#architecture-rules-call-downward-cancel-doomed-work"

  - id: cascading-failures-and-antipatterns-075
    difficulty: advanced
    tags: [fail-open, fail-closed, auth, judgment]
    question: |
      An authentication service outage forces a decision: should the calling service fail
      open or fail closed? What is the correct framing?
    options:
      - "Always fail open, since availability matters most"
      - "Always fail closed, since security matters most"
      - "It's a deliberate per-dependency trade-off: auth is the hard case (fail open risks serving unauthorized requests; fail closed turns an auth blip into a total outage) — decide explicitly and keep the fallback bounded/static"
      - "It doesn't matter; the outcome is identical either way"
    answer: 2
    explanation: |
      Fail-open vs fail-closed is a deliberate choice per dependency based on what it
      protects. Recommendations should fail open (degrade), payments usually fail closed.
      Auth is genuinely hard: failing open can serve unauthorized requests (a security
      incident) while failing closed converts an auth outage into a total outage. There is no
      universal answer — decide explicitly, document it, and make the fail-open path a
      bounded/static fallback, not an unbounded retry against the dead dependency.
    ref: "concepts.md#fail-open-vs-fail-closed"

  - id: cascading-failures-and-antipatterns-076
    difficulty: advanced
    tags: [recovery, sre-playbook, one-percent, ramp]
    question: |
      In Google SRE's ordered recovery steps for an active cascade, what is the "drop
      traffic" step and why is it framed with a specific number?
    options:
      - "Drop exactly 50% of traffic and hold it there permanently"
      - "Allow only ~1% of traffic through, let servers fully recover, then ramp back gradually — forcing load below the recovery threshold despite hysteresis"
      - "Block all traffic for exactly one hour"
      - "Drop traffic only from the largest client"
    answer: 1
    explanation: |
      Because of hysteresis, the recovery threshold is far below the trigger, so a small cut
      isn't enough. The step is to admit only ~1% of traffic, let servers climb fully back to
      health, then ramp gradually while watching for re-collapse. It is the concrete
      expression of "force load below the recovery threshold long enough to drain the
      backlog."
    ref: "concepts.md#the-sre-recovery-playbook-in-order"

  - id: cascading-failures-and-antipatterns-077
    difficulty: expert
    tags: [incident, aws-2021, trigger-vs-loop, congestion-collapse]
    question: |
      In the AWS US-EAST-1 December 2021 event, an automated scaling activity surged internal
      network connections and a latent bug prevented clients from backing off. Which framing
      best captures why it was so hard to resolve?
    options:
      - "The scaling activity kept running the whole time, so stopping it fixed everything instantly"
      - "The scaling trigger was over quickly, but the no-backoff bug made the congestion self-sustaining (congestion collapse); monitoring rode the same congested network and was blinded, and downstream backlogs drained for hours after the network healed"
      - "It was purely a hardware failure in a single rack"
      - "Customers caused it with a DDoS attack"
    answer: 1
    explanation: |
      The scaling event was the trigger, but the sustaining loop — retries with a broken
      back-off — turned it into self-sustaining congestion collapse that outlived the
      trigger. Monitoring shared fate with the congested network (blinded, gray-failure-
      shaped) and deployment tooling degraded, slowing recovery. Even after the network
      healed, downstream backlogs (STS, API Gateway server recycling, EventBridge events)
      took hours to drain — "root cause fixed" did not mean "recovered."
    ref: "concepts.md#canonical-incident-stories"

  - id: cascading-failures-and-antipatterns-078
    difficulty: advanced
    tags: [incident, google-shakespeare, restart-into-storm]
    question: |
      In the Google "Shakespeare" cascade, a traffic spike coincided with a cluster update.
      What detail makes it a canonical "restart-into-storm" story?
    options:
      - "Adding retries alone fully resolved it"
      - "Borg-driven task restarts reduced the number of working tasks at the worst moment, so recovery came from adding tasks and letting load settle rather than restarting"
      - "The database was deleted and restored from backup"
      - "The spike was caused by an internal deploy, not external traffic"
    answer: 1
    explanation: |
      During the overload, task restarts (via Borg) removed working capacity exactly when it
      was scarcest — the classic restart-into-storm trap. Graceful degradation and selective
      retries helped, but the real recovery was adding tasks and letting load settle, not
      restarting. Lesson: restarts during active overload subtract capacity; sometimes you
      must add capacity, not churn it.
    ref: "concepts.md#canonical-incident-stories"

  - id: cascading-failures-and-antipatterns-079
    difficulty: expert
    tags: [capacity-cache, cold-start, re-collapse, scenario]
    question: |
      After a full outage you bring the fleet back up and it immediately collapses again
      under normal traffic, even though that traffic level was fine before the outage. What
      is the most likely explanation?
    options:
      - "The traffic is secretly higher than before"
      - "The system depends on a capacity cache: with caches cold the empty-cache state cannot serve nominal load, so full traffic on a cold fleet instantly re-collapses it"
      - "The hardware degraded during the outage"
      - "DNS is returning stale records"
    answer: 1
    explanation: |
      A capacity cache is one the system requires to handle its load at all (as opposed to a
      latency cache that merely speeds things up). After a full outage the cache is empty, so
      every request is a miss and backend RPC volume is a large multiple of steady state — the
      cold system is below capacity and re-collapses under normal load. Fixes: warm caches
      before taking traffic, ramp load slowly (the ~1% step), and ideally avoid depending on a
      capacity cache at all.
    ref: "concepts.md#slow-startup-cold-caches-and-the-capacity-cache"

  - id: cascading-failures-and-antipatterns-080
    difficulty: intermediate
    tags: [capacity-cache, latency-cache, distinction]
    question: |
      What is the difference between a "latency cache" and a "capacity cache"?
    options:
      - "A latency cache stores latency numbers; a capacity cache stores capacity numbers"
      - "A latency cache only lowers latency (the system can still serve nominal load with it empty); a capacity cache is required to handle the load at all, so an empty one cannot serve nominal traffic"
      - "They are two names for the same thing"
      - "A capacity cache is always smaller than a latency cache"
    answer: 1
    explanation: |
      A latency cache is an optimization — with it empty the system just runs slower but can
      still serve nominal load. A capacity cache is load-bearing: the empty-cache state cannot
      serve nominal traffic, so losing it (or cold-starting) means instant overload. Depending
      on a capacity cache turns the cache into a hidden single point of failure; size the
      backend to survive a cold cache.
    ref: "concepts.md#slow-startup-cold-caches-and-the-capacity-cache"

  - id: cascading-failures-and-antipatterns-081
    difficulty: expert
    tags: [scenario, backpressure, load-shedding, queue, judgment]
    question: |
      A service is overloaded (sustained arrival rate above service rate). An engineer
      proposes adding a large queue in front of it "to smooth things out." Per "Queues Don't
      Fix Overload," what is the correct critique?
    options:
      - "A queue converts sustained overload into stored doomed work and added latency; it only helps for short bursts. You need backpressure (bounded queue signalling upstream) or load-shedding, not a bigger buffer"
      - "The queue will automatically add processing capacity"
      - "Queues are always wrong and should never be used"
      - "The queue will reduce the arrival rate"
    answer: 0
    explanation: |
      A queue absorbs transient bursts, but under a sustained arrival>service gap it just
      accumulates work that will time out before it's served — deeper latency, more wasted
      capacity, eventual collapse. The real fixes are backpressure (a bounded queue that
      signals fullness upstream so producers slow down) or load-shedding (reject early). The
      bottleneck's service rate, not buffer size, is what matters.
    ref: "concepts.md#load-shedding-brownout-and-the-latency-knee"

  - id: cascading-failures-and-antipatterns-082
    difficulty: intermediate
    tags: [release-it, self-denial, thundering-herd]
    question: |
      Marketing sends a push notification to 10 million users at once, all of whom open the
      app simultaneously and crash the backend. Which Release It! anti-pattern is this?
    options:
      - "Steady State"
      - "Self-Denial Attack — you cause your own synchronized traffic spike"
      - "Let It Crash"
      - "Circuit Breaker"
    answer: 1
    explanation: |
      A Self-Denial Attack is a self-inflicted, synchronized demand spike — a marketing blast,
      a homepage promo, or a deploy that makes all clients act at once. It's the
      thundering-herd/Dogpile pattern that you cause yourself. Defences: stagger/jitter the
      trigger, pre-scale, load-shed, and treat known upcoming events as planned capacity work.
    ref: "concepts.md#the-full-release-it-anti-pattern-catalog"
