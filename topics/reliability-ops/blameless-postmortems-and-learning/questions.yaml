topic: "Blameless Postmortems & Learning"
domain: reliability-ops
topic_slug: blameless-postmortems-and-learning
version: 1
questions:
  - id: blameless-postmortems-and-learning-001
    difficulty: beginner
    tags: [definition, blameless]
    question: |
      What does "blameless" primarily mean in a blameless postmortem?
    options:
      - "No one is ever held accountable for anything that happens in production"
      - "The analysis focuses on systems and contributing factors rather than punishing individuals"
      - "The postmortem is kept strictly confidential so that no one outside the team can identify who to blame"
      - "Only managers, not the engineers who were on call, are permitted to formally assign fault afterward"
    answer: 1
    explanation: |
      Blameless means we assume people acted reasonably given the information and
      incentives they had, and we direct the analysis at the system and conditions that
      let a reasonable action cause harm — not at punishing the individual involved.
    ref: "concepts.md#what-blameless-means"

  - id: blameless-postmortems-and-learning-002
    difficulty: beginner
    tags: [purpose, action-items]
    question: |
      What is the single most important output of a postmortem?
    options:
      - "A detailed, well-formatted timeline document of the outage"
      - "Identifying which engineer caused the incident"
      - "A public, formal apology posted to all affected customers"
      - "Owned, tracked, due-dated action items that harden the system"
    answer: 3
    explanation: |
      The document itself is just a record. The payoff is the tracked, owned action items
      that actually change the system so the same failure class cannot recur. Everything
      else is documentation in service of that.
    ref: "concepts.md#action-items-the-whole-point-and-the-common-failure"

  - id: blameless-postmortems-and-learning-003
    difficulty: intermediate
    tags: [blameless, mechanism, fear]
    question: |
      Why does a blame-oriented culture tend to make systems LESS reliable over time?
    options:
      - "Fear of punishment causes people to hide crucial details, so you lose the information needed to fix the real problem"
      - "It makes postmortems take substantially longer to write and review, delaying the final report"
      - "It increases cloud costs because teams over-provision extra monitoring and logging to cover themselves"
      - "It forces teams to write far too many low-value action items that overwhelm the backlog"
    answer: 0
    explanation: |
      Blame drives fear, and fear drives hiding. If naming a mistake gets you punished,
      people stop volunteering the context (deadline pressure, flaky tooling) that reveals
      the true systemic cause — so you lose exactly the information you need to improve.
    ref: "concepts.md#what-blameless-means"

  - id: blameless-postmortems-and-learning-004
    difficulty: intermediate
    tags: [accountability, misconception]
    question: |
      A colleague argues "blameless postmortems mean nobody is ever accountable." What is
      the best rebuttal?
    options:
      - "They are correct; genuine accountability is fundamentally incompatible with any blameless process"
      - "Accountability only applies to managers and team leads, never to the individual engineers involved"
      - "Blameless separates understanding from punishment; accountability still exists, and reckless behavior is handled separately"
      - "Blameless principles apply only to security breaches and never to reliability or availability incidents"
    answer: 2
    explanation: |
      Blameless is not accountability-free. It separates understanding from judgment:
      honest mistakes drive systemic fixes, individuals are accountable for owning fixes,
      the org is accountable for completing action items, and reckless/willful behavior is
      handled separately (Just Culture).
    ref: "concepts.md#blameless-is-not-accountability-free"

  - id: blameless-postmortems-and-learning-005
    difficulty: intermediate
    tags: [just-culture, dekker, categories]
    question: |
      In Sidney Dekker's Just Culture model, which category of behavior is NOT protected
      by blamelessness and may warrant disciplinary action?
    options:
      - "Human error — an inadvertent slip or lapse"
      - "Reckless behavior — conscious disregard of a substantial, known risk"
      - "At-risk behavior — drifting into an unsafe shortcut without perceiving the risk"
      - "Following the documented runbook exactly as written, step by step, under normal conditions"
    answer: 1
    explanation: |
      Just Culture protects honest error (console + fix system) and at-risk behavior
      (coach + remove the incentive to cut corners). Reckless behavior — knowingly
      disregarding a substantial risk — is the line where disciplinary action is
      appropriate and blamelessness does not apply.
    ref: "concepts.md#just-culture-and-the-reckless-line"

  - id: blameless-postmortems-and-learning-006
    difficulty: advanced
    tags: [just-culture, at-risk, response]
    question: |
      Under Just Culture, what is the prescribed response to "at-risk behavior" (e.g., an
      engineer routinely skips the canary step because the pipeline is painfully slow)?
    options:
      - "Immediate termination of the engineer for repeatedly bypassing a required safety step"
      - "Coach the individual and remove the incentive to cut the corner (make the safe path the easy path)"
      - "No response of any kind — at-risk behavior is fully protected and needs no follow-up"
      - "A formal disciplinary write-up placed permanently in the engineer's personnel file"
    answer: 1
    explanation: |
      At-risk behavior is a drift into unsafe shortcuts, usually because the safe path is
      slow or painful. The Just response is to coach the person AND fix the system so the
      safe path is the easy path — not to punish, and not to ignore.
    ref: "concepts.md#just-culture-and-the-reckless-line"

  - id: blameless-postmortems-and-learning-007
    difficulty: advanced
    tags: [just-culture, substitution-test]
    question: |
      The "substitution test" from Just Culture asks which question to decide whether an
      incident reflects a system problem or an individual problem?
    options:
      - "Was the individual senior and experienced enough that they clearly should have known better?"
      - "Did the individual read the entire runbook end to end before taking any action?"
      - "Would another competent professional, with the same training and under the same conditions, plausibly have done the same thing?"
      - "How severe was the resulting customer impact, measured in downtime and lost revenue?"
    answer: 2
    explanation: |
      The substitution test asks whether a peer, equally trained and under the same
      conditions, would plausibly have acted the same way. If yes, it points to a system
      problem, not an individual failing — and judges conduct, not the severity of outcome.
    ref: "concepts.md#just-culture-and-the-reckless-line"

  - id: blameless-postmortems-and-learning-008
    difficulty: intermediate
    tags: [human-error, second-story]
    question: |
      Why is "human error" considered an unacceptable stopping point for a postmortem's
      root-cause analysis?
    options:
      - "Because humans never actually make mistakes when they are properly trained and rested"
      - "Because employment law in most jurisdictions forbids attributing an incident to a named human"
      - "Because naming human error makes the incident timeline unnecessarily long and hard to read"
      - "Because it is a symptom of deeper systemic trouble, not a cause, and stopping there leaves the systemic trap intact"
    answer: 3
    explanation: |
      "Human error" is where the investigation starts, not where it ends. It is a symptom
      of trouble deeper in the system. Stopping there leaves the dangerous tool, missing
      guardrail, or misleading UI fully intact for the next person.
    ref: "concepts.md#human-error-as-a-symptom-the-second-story"

  - id: blameless-postmortems-and-learning-009
    difficulty: advanced
    tags: [second-story, local-rationality]
    question: |
      What is the "Second Story" in Dekker's framing of incident analysis?
    options:
      - "The explanation of why the responder's action made sense to them at the time, given their information and constraints"
      - "The follow-up incident that occurs when the first attempted fix fails and reopens the outage"
      - "The condensed executive summary written for leadership after the technical review concludes"
      - "The sanitized version of events communicated externally to customers and the public"
    answer: 0
    explanation: |
      The First Story is the tidy hindsight narrative where the bad outcome makes the
      human's choice look obviously wrong. The Second Story asks why that action was
      locally rational at the time — which is where the real, actionable finding lives.
    ref: "concepts.md#human-error-as-a-symptom-the-second-story"

  - id: blameless-postmortems-and-learning-010
    difficulty: advanced
    tags: [hindsight-bias, counterfactual]
    question: |
      A postmortem states: "If the on-call had just checked the dashboard, the outage
      would have been avoided." What is wrong with this statement?
    options:
      - "Nothing is wrong — it correctly identifies the concrete fix that should be implemented"
      - "It should name the specific on-call engineer who missed the dashboard so they can be held accountable"
      - "It is far too technical in its wording to belong in a customer-facing postmortem"
      - "It is a counterfactual describing a fictional world; it prescribes no systemic fix and reflects hindsight bias"
    answer: 3
    explanation: |
      Counterfactuals ("should have," "could have," "if only") describe a world that did
      not happen and prescribe nothing actionable. They also reflect hindsight bias — the
      right path looks obvious only after you know the outcome. Describe what did happen
      and what made it hard to do otherwise.
    ref: "concepts.md#human-error-as-a-symptom-the-second-story"

  - id: blameless-postmortems-and-learning-011
    difficulty: intermediate
    tags: [action-items, anti-pattern]
    question: |
      Which of these is a NON-actionable postmortem action item that should be rewritten?
    options:
      - "Add a --region confirmation prompt to the deploy script (owner: @alice, due 2026-08-15)"
      - "Add an automated pre-deploy check that blocks deploys during a change freeze (owner: @bob)"
      - "Set the deploy tool's default to dry-run mode (owner: @carol, JIRA-4521)"
      - "Engineers should be more careful when running scripts in production"
    answer: 3
    explanation: |
      "Be more careful" is the classic non-actionable anti-pattern — it puts the fix back
      on fallible humans and changes nothing systemic. The others remove the trap via
      guardrails, automation, and safe defaults, each with a named owner.
    ref: "concepts.md#action-items-the-whole-point-and-the-common-failure"

  - id: blameless-postmortems-and-learning-012
    difficulty: intermediate
    tags: [action-items, ownership]
    question: |
      Why should each postmortem action item be assigned to a named individual rather than
      "the team"?
    options:
      - "Because diffuse ownership means no ownership, and unowned items tend never to get completed"
      - "So that specific individual can be blamed and disciplined if the item is not completed on time"
      - "Because teams as a whole are not technically permitted to own tickets in most tracking systems"
      - "To deliberately reduce the total number of action items a postmortem is allowed to produce"
    answer: 0
    explanation: |
      An item owned by "the team" is owned by no one. Naming an individual owner (who is
      responsible for driving it, not necessarily doing all the work) is what makes it
      actually get completed. This is about follow-through, not blame.
    ref: "concepts.md#action-items-the-whole-point-and-the-common-failure"

  - id: blameless-postmortems-and-learning-013
    difficulty: advanced
    tags: [action-items, follow-through, common-failure]
    question: |
      What is described as the single most common failure mode of postmortem programs?
    options:
      - "Writing postmortems that are far too short to capture the incident's full timeline"
      - "Assigning blame to the individuals who happened to be on call during the incident"
      - "Holding the postmortem review meeting too soon, before the facts have settled"
      - "Writing good analyses whose action items are never completed"
    answer: 3
    explanation: |
      The overwhelming, industry-wide failure is not bad analysis — it is good analysis
      whose action items rot uncompleted. Without owners, tracking, prioritization, and a
      review cadence, reliability work loses to feature work indefinitely.
    ref: "concepts.md#action-items-the-whole-point-and-the-common-failure"

  - id: blameless-postmortems-and-learning-014
    difficulty: advanced
    tags: [action-items, tracking, follow-through]
    question: |
      Which practice best ensures postmortem action items actually get completed?
    options:
      - "Store them only inside the postmortem document itself, where the full context lives"
      - "Email the complete list to the whole company one time right after the review meeting"
      - "Track them in the normal work backlog, prioritized against features, and review open items in a recurring ops review"
      - "Wait until the next incident of the same type recurs, then revisit them all at once"
    answer: 2
    explanation: |
      Action items must live in the same tracking system as normal work so they are
      visible on a backlog, prioritized against feature work, and reviewed regularly.
      Buried in a doc, they silently evaporate. Completion rate is a program health metric.
    ref: "concepts.md#action-items-the-whole-point-and-the-common-failure"

  - id: blameless-postmortems-and-learning-015
    difficulty: beginner
    tags: [document, sections]
    question: |
      Which of the following is a standard section of a well-structured postmortem?
    options:
      - "A ranking of the engineers involved by their total number of mistakes made"
      - "A list of the employees who should be formally reprimanded for the outage"
      - "The performance-review scores of the individual who was on call at the time"
      - "A timeline of timestamped events from detection to resolution"
    answer: 3
    explanation: |
      Canonical postmortem sections include summary, impact, timeline, root cause(s)/
      contributing factors, detection, resolution, what went well/badly/where we got lucky,
      and action items. Blame lists and performance scores are the opposite of blameless.
    ref: "concepts.md#anatomy-of-a-postmortem-document"

  - id: blameless-postmortems-and-learning-016
    difficulty: intermediate
    tags: [document, impact, quantify]
    question: |
      Which is the best way to describe impact in a postmortem?
    options:
      - "The outage had a big and clearly noticeable impact on a large number of our customers"
      - "~4.2M requests failed (14% of traffic) over 37 minutes; ~26% of the monthly error budget consumed; no data loss"
      - "Several users across multiple regions were affected for a while during the incident window"
      - "The impact was significant and widespread but ultimately quite hard to measure precisely"
    answer: 1
    explanation: |
      Impact must be quantified objectively — affected users/requests, duration, error-
      budget burned, revenue, data-loss status. Vague phrases like "big impact" are not
      metrics and prevent comparison across incidents.
    ref: "concepts.md#anatomy-of-a-postmortem-document"

  - id: blameless-postmortems-and-learning-017
    difficulty: advanced
    tags: [document, got-lucky, near-miss]
    question: |
      What is the special value of the "Where we got lucky" section of a postmortem?
    options:
      - "It surfaces near-misses hidden inside the incident — risks that caused no harm this time but will next time"
      - "It assigns public credit to the engineer who diagnosed and fixed the issue the fastest"
      - "It is the designated place where formal apologies to affected customers get recorded"
      - "It lists every tool and dashboard that the responders used during the live incident"
    answer: 0
    explanation: |
      "Where we got lucky" exposes silent risks — e.g., a failover that only worked
      because traffic was low. These produced no visible harm this time but represent
      latent failures that will bite under different conditions.
    ref: "concepts.md#anatomy-of-a-postmortem-document"

  - id: blameless-postmortems-and-learning-018
    difficulty: intermediate
    tags: [triggers, when-to-write]
    question: |
      Which is a common, predefined trigger for writing a postmortem?
    options:
      - "Any routine deploy that completes successfully without triggering any incident at all"
      - "Data loss of any kind, or an incident detected by a customer rather than an alert"
      - "A fixed weekly schedule that runs regardless of whether any incident actually happened"
      - "Only the incidents that grow large enough to make the technology or business news"
    answer: 1
    explanation: |
      Common triggers include data loss, user-visible SLO breach, on-call intervention,
      resolution time above threshold, monitoring/detection failure (found by a customer),
      a SEV threshold, repeat incidents, or anyone requesting one. Defining them in
      advance keeps writing one from being an accusation.
    ref: "concepts.md#when-to-write-a-postmortem-triggers"

  - id: blameless-postmortems-and-learning-019
    difficulty: intermediate
    tags: [triggers, culture]
    question: |
      Why should postmortem triggers be defined objectively and in advance?
    options:
      - "To drive the number of postmortems down toward zero so the team can spend all its time shipping features instead"
      - "To ensure that only managers and team leads are permitted to trigger one, keeping the decision away from individual engineers"
      - "So that writing one is never a negotiation or an implicit accusation, and asking for one is never seen as blaming"
      - "Because compliance regulations in most industries mandate a fixed set of exactly five predefined incident triggers"
    answer: 2
    explanation: |
      Predefined objective triggers remove the social friction: no one has to argue that
      an incident "deserves" a postmortem, and requesting one carries no implication of
      fault. That keeps the process blameless and consistent.
    ref: "concepts.md#when-to-write-a-postmortem-triggers"

  - id: blameless-postmortems-and-learning-020
    difficulty: advanced
    tags: [detection, monitoring, triggers]
    question: |
      An incident was first reported by a customer, not by any internal alert. Beyond the
      incident itself, what does this fact represent for the postmortem?
    options:
      - "Nothing noteworthy — customers report issues all the time, and it says nothing about the state of internal tooling"
      - "Grounds to formally discipline the on-call engineer for failing to notice the problem before customers did"
      - "A reason to skip the postmortem entirely, since the customer already surfaced and described the issue for the team"
      - "A monitoring/detection gap that is itself a finding warranting an action item"
    answer: 3
    explanation: |
      Being found by a customer rather than an alert is both a trigger and a first-class
      finding: your detection failed. The postmortem should produce an action item to add
      or fix the missing alert (a "detect" type item). See observability for alert mechanics.
    ref: "concepts.md#when-to-write-a-postmortem-triggers"

  - id: blameless-postmortems-and-learning-021
    difficulty: beginner
    tags: [near-miss, definition]
    question: |
      What is a "near-miss" in reliability terms?
    options:
      - "An incident that was resolved well within its agreed SLA window, consuming no error budget and causing no customer-visible impact"
      - "A postmortem document that was scheduled after an incident but ultimately never written because the team ran out of time"
      - "An event that could have caused a serious incident but did not, due to luck or a safeguard that happened to hold"
      - "A monitoring alert that fired correctly and was promptly acknowledged by on-call during an otherwise routine deploy"
    answer: 2
    explanation: |
      A near-miss (close call) is an event that came close to a serious incident but
      avoided harm — e.g., a bad deploy caught by canary before full rollout. The latent
      flaws were fully exercised; only the final customer harm was avoided.
    ref: "concepts.md#near-miss-analysis"

  - id: blameless-postmortems-and-learning-022
    difficulty: advanced
    tags: [near-miss, heinrich, value]
    question: |
      Why are near-misses considered especially valuable to analyze?
    options:
      - "They carry almost all the learning of a real incident at almost none of the customer cost"
      - "They are considerably easier to explain to executives than a full severity-one incident report would be"
      - "They automatically generate owned, tracked action items without any manual analysis being required afterward"
      - "They can be analyzed just as effectively inside a blame-oriented culture, since no real customer harm occurred"
    answer: 0
    explanation: |
      A near-miss exercised the same latent flaws as a real incident but avoided the harm,
      so it offers nearly all the learning for nearly none of the cost. Heinrich's safety
      pyramid holds that serious incidents share causes with a large base of near-misses.
    ref: "concepts.md#near-miss-analysis"

  - id: blameless-postmortems-and-learning-023
    difficulty: advanced
    tags: [near-miss, reporting, culture]
    question: |
      What is the main challenge with learning from near-misses, and its prerequisite?
    options:
      - "They produce no alarm or customer pain so no one is forced to look at them; they must be deliberately solicited, which requires a blameless culture"
      - "They are far too expensive to investigate thoroughly, so learning from them requires a substantially larger reliability budget"
      - "They are legally prohibited from being documented, so no written record of the close call may be retained afterward"
      - "They can only ever be discovered by automated anomaly-detection tooling, never by the engineers who witnessed them firsthand"
    answer: 0
    explanation: |
      Because near-misses cause no visible harm, nothing forces attention to them — they
      must be deliberately solicited and rewarded. People only report their own near-misses
      when doing so is psychologically safe, so a blameless culture is a prerequisite.
    ref: "concepts.md#near-miss-analysis"

  - id: blameless-postmortems-and-learning-024
    difficulty: intermediate
    tags: [complex-systems, contributing-factors]
    question: |
      Why does the single-"root cause" framing often mislead in complex-systems incidents?
    options:
      - "Because every incident, without exception, can be traced back to exactly one identifiable root cause if you dig deep enough"
      - "Because non-trivial failures usually result from multiple contributing factors lining up, not one cause"
      - "Because the root cause of a complex-systems incident always turns out to be human error at the sharp end"
      - "Because complex systems are engineered with enough redundancy that they effectively never fail in production"
    answer: 1
    explanation: |
      Per Richard Cook, complex systems run in a degraded mode as a normal condition;
      incidents happen when several latent flaws align. Tunnel vision on one "root cause"
      hides the other contributing factors that also need fixing.
    ref: "concepts.md#postmortem-anti-patterns"

  - id: blameless-postmortems-and-learning-025
    difficulty: advanced
    tags: [just-culture, outcome-bias]
    question: |
      Two engineers make the exact same at-risk shortcut; one causes a major outage, the
      other causes nothing. Under Just Culture, how should they be treated?
    options:
      - "Both should be judged on the behavior and choices, not on the severity of the outcome"
      - "The one who happened to cause the outage should be formally disciplined, while the other engineer is simply ignored"
      - "Both should be punished equally and severely, since the shortcut itself was clearly unsafe regardless of what resulted"
      - "Neither engineer's conduct should be examined at all, because in one of the two cases nothing bad actually happened"
    answer: 0
    explanation: |
      Just Culture judges conduct, not outcome. Punishing bad outcomes regardless of
      conduct teaches people to hide outcomes. Both engaged in the same at-risk behavior,
      so both warrant the same coaching-plus-system-fix response.
    ref: "concepts.md#just-culture-and-the-reckless-line"

  - id: blameless-postmortems-and-learning-026
    difficulty: intermediate
    tags: [action-items, item-types]
    question: |
      An action item "add a synthetic probe that alerts within 60s of checkout failing"
      belongs to which category of postmortem action item?
    options:
      - "Prevent — a change that stops this class of incident from ever recurring in the first place"
      - "Mitigate — a change that reduces the blast radius or customer impact once the failure recurs"
      - "Detect — finds the problem faster next time"
      - "Process — a change to the runbooks or on-call procedures governing how the team responds"
    answer: 2
    explanation: |
      Action items are usefully typed as mitigate / prevent / detect / process. A probe
      that alerts faster is a detect item — it shortens time-to-detection rather than
      preventing the failure or reducing its blast radius.
    ref: "concepts.md#action-items-the-whole-point-and-the-common-failure"

  - id: blameless-postmortems-and-learning-027
    difficulty: advanced
    tags: [error-budget, triggers, cross-ref]
    question: |
      How do error budgets commonly relate to postmortems?
    options:
      - "A healthy error budget fully replaces the need to write postmortems, since the budget already accounts for expected failures"
      - "Completing a postmortem and shipping its action items resets the consumed error budget back to full for the period"
      - "Error budgets are only relevant to security and compliance incidents, not to availability or latency-based reliability incidents"
      - "Error-budget burn is a common postmortem trigger and a way to quantify impact objectively"
    answer: 3
    explanation: |
      A user-visible SLO breach / significant error-budget burn is a common trigger for a
      postmortem, and budget consumed is an objective impact metric. The budget concept
      itself lives in reliability-ops SLOs; alert mechanics live in observability.
    ref: "concepts.md#when-to-write-a-postmortem-triggers"

  - id: blameless-postmortems-and-learning-028
    difficulty: intermediate
    tags: [culture, badge-of-honor]
    question: |
      To keep a postmortem culture healthy, how should the ACT of writing a postmortem be
      treated by the organization?
    options:
      - "As a badge of honor and evidence of engineering maturity"
      - "As a punishment reserved for the specific engineers whose changes are judged to have caused the incident"
      - "As optional paperwork that can safely be skipped whenever the team is busy shipping higher-priority feature work"
      - "As a confidential HR matter to be handled privately between the individual and their manager, away from the team"
    answer: 0
    explanation: |
      If writing a postmortem signals "you failed," blame re-enters through the back door
      and people avoid or dilute them. Treating a well-written postmortem as a mark of
      maturity (Google's approach) keeps people forthcoming.
    ref: "concepts.md#when-to-write-a-postmortem-triggers"

  - id: blameless-postmortems-and-learning-029
    difficulty: advanced
    tags: [culture, leadership, hidden-blame]
    question: |
      Leadership publicly declares postmortems "blameless," but in every review privately
      asks "so whose change caused this?" What is the likely result?
    options:
      - "Engineers read the real incentives and self-censor, undermining the learning the process depends on"
      - "Nothing meaningfully changes — the public statement is what shapes behavior, so the private questioning is harmless"
      - "Action items end up getting completed noticeably faster because the private accountability pressure motivates owners"
      - "Postmortems become more detailed and honest as engineers work harder to prove their own change was not at fault"
    answer: 0
    explanation: |
      Culture is what you actually reward and punish, not what you print. If the lived
      experience is "find who to blame," people will self-censor and hide the details,
      defeating the purpose. Blameless is a property of the process, not a slogan.
    ref: "concepts.md#what-blameless-means"

  - id: blameless-postmortems-and-learning-030
    difficulty: intermediate
    tags: [document, root-cause, cross-ref]
    question: |
      Where do the detailed causal-analysis techniques (5 Whys, fishbone/Ishikawa) belong
      relative to the postmortem topic?
    options:
      - "They are the same thing as the postmortem document itself, so the two topics are fully interchangeable in practice"
      - "They belong to the observability alerting topic, since 5 Whys and fishbone diagrams are primarily monitoring techniques"
      - "They are obsolete techniques that leading teams have abandoned entirely in favor of automated causal-inference tooling"
      - "They belong to root-cause-analysis-and-troubleshooting; the postmortem consumes their output in its 'contributing factors' section"
    answer: 3
    explanation: |
      The analysis methods (5 Whys, fishbone, causal chains) are covered in
      reliability-ops/root-cause-analysis-and-troubleshooting. The postmortem document is
      where their output is recorded and turned into action items.
    ref: "concepts.md#human-error-as-a-symptom-the-second-story"

  - id: blameless-postmortems-and-learning-031
    difficulty: beginner
    tags: [anti-pattern, blame]
    question: |
      A postmortem lists its root cause as "operator error — the engineer ran the wrong
      command." Why is this a postmortem anti-pattern?
    options:
      - "It halts the analysis at a symptom and leaves the systemic trap (dangerous command, no confirmation) intact"
      - "It is far too detailed and technical to belong in the root-cause section of a customer-facing postmortem document"
      - "It should have named the specific engineer who ran the command so accountability can be assigned to them directly"
      - "It relies on too much specialized operational jargon that non-engineering stakeholders will struggle to follow"
    answer: 0
    explanation: |
      "Operator error" is a symptom that stops the investigation prematurely, leaving the
      missing confirmation prompt, misleading UI, or dangerous default fully in place for
      the next engineer. Ask the Second Story instead.
    ref: "concepts.md#postmortem-anti-patterns"

  - id: blameless-postmortems-and-learning-032
    difficulty: advanced
    tags: [reckless, just-culture, scope]
    question: |
      During an incident, an engineer disabled alerting to stop the pages while hiding an
      ongoing problem from the team. How does a blameless approach handle this?
    options:
      - "It is fully protected by blamelessness, exactly like any honest slip or inadvertent human error would be"
      - "It should actually be praised as a reasonable step for reducing alert noise and page fatigue during the incident"
      - "This is willful concealment / reckless behavior — outside what blamelessness protects and a disciplinary matter"
      - "It should simply be captured as a 'be more careful with alerting' action item and otherwise treated as routine"
    answer: 2
    explanation: |
      Blamelessness covers honest error and at-risk drift. Deliberately disabling alerting
      to conceal a problem is willful rule-breaking / reckless conduct — it falls outside
      blameless protection and is handled separately as a disciplinary matter.
    ref: "concepts.md#blameless-is-not-accountability-free"

  - id: blameless-postmortems-and-learning-033
    difficulty: intermediate
    tags: [document, timeline, timezone]
    question: |
      Which is a best practice for the timeline section of a postmortem?
    options:
      - "Record each event in the local timezone of whichever participant reported it, so the timeline feels more personal"
      - "Use timestamped events in a consistent timezone (e.g., UTC), from detection through mitigation to resolution"
      - "Omit timestamps altogether and use relative phrases like 'shortly after' to keep the narrative readable and concise"
      - "Include only the single final resolution timestamp, since the intermediate response steps add unnecessary clutter"
    answer: 1
    explanation: |
      A precise, timestamped timeline in a single consistent timezone (commonly UTC) makes
      detection latency and response gaps visible and comparable. Mixing local times or
      omitting timestamps hides exactly the intervals you want to improve.
    ref: "concepts.md#anatomy-of-a-postmortem-document"

  - id: blameless-postmortems-and-learning-034
    difficulty: advanced
    tags: [action-items, prioritization]
    question: |
      Why is it recommended to prioritize postmortem action items using the SAME process
      that prioritizes feature work?
    options:
      - "To make the postmortem document longer and more thorough by adding an explicit prioritization section to it"
      - "Because feature work is inherently always more important than reliability work and should preempt it by default"
      - "Because if reliability work sits in a separate, lower-visibility list, it perpetually loses to the roadmap and never ships"
      - "So that managers retain a clear mechanism to veto reliability action items they consider too costly to schedule"
    answer: 2
    explanation: |
      When reliability debt lives in its own invisible pile, feature work always wins.
      Putting action items into the same backlog and prioritization process forces an
      explicit, honest tradeoff and gives critical fixes a real chance to ship.
    ref: "concepts.md#action-items-the-whole-point-and-the-common-failure"

  - id: blameless-postmortems-and-learning-035
    difficulty: intermediate
    tags: [complex-systems, cook, degraded-mode]
    question: |
      According to Richard Cook's "How Complex Systems Fail," what is the normal operating
      state of a complex system?
    options:
      - "Perfectly healthy and flaw-free, since well-engineered systems eliminate latent defects before reaching production"
      - "Running in a degraded mode, containing multiple latent flaws that are individually insufficient to cause failure"
      - "Failing constantly and visibly, with operators continuously firefighting a steady stream of user-facing outages"
      - "Fully automated end to end, with no human involvement remaining in either its operation or its recovery paths"
    answer: 1
    explanation: |
      Cook observes that complex systems always run in a degraded mode carrying many
      latent flaws; catastrophe requires several to align. This is why blaming a single
      trigger misses the accident-in-waiting the system already contained.
    ref: "concepts.md#human-error-as-a-symptom-the-second-story"

  - id: blameless-postmortems-and-learning-036
    difficulty: advanced
    tags: [action-items, verifiable]
    question: |
      Which action item is the most concrete and verifiable?
    options:
      - "Make a broad, ongoing effort to improve our overall deployment reliability across the team going forward"
      - "Raise general awareness about production safety and encourage everyone to keep it top of mind during changes"
      - "Add a pre-merge CI check that fails the build if a migration lacks a rollback script (owner: @dana, due 2026-08-30, JIRA-9001)"
      - "Encourage engineers to test their changes more thoroughly and take greater care before shipping to production"
    answer: 2
    explanation: |
      A good action item is concrete, verifiable, owned, and due-dated. "Add a pre-merge CI
      check…" can be objectively confirmed done. The others are vague aspirations with no
      way to tell whether they were completed.
    ref: "concepts.md#action-items-the-whole-point-and-the-common-failure"

  - id: blameless-postmortems-and-learning-037
    difficulty: intermediate
    tags: [triggers, near-miss, scope]
    question: |
      Why is writing postmortems ONLY for SEV1 incidents considered an anti-pattern?
    options:
      - "Because SEV1 incidents are too rare and too well understood to justify writing a formal postmortem for each one"
      - "Because postmortems written for SEV1 incidents are almost always inaccurate, since the pressure distorts the recorded timeline"
      - "Because restricting postmortems to SEV1s produces too few documents to satisfy typical compliance and audit reporting requirements"
      - "It misses cheap, high-value learning from near-misses and smaller/repeat incidents that share the same causes"
    answer: 3
    explanation: |
      Restricting postmortems to SEV1s discards the large base of near-misses and minor
      incidents that share root causes with the big ones (Heinrich pyramid). Broadening
      triggers to data loss, no-alert detection, and near-misses captures that learning.
    ref: "concepts.md#postmortem-anti-patterns"

  - id: blameless-postmortems-and-learning-038
    difficulty: advanced
    tags: [close-criteria, follow-through]
    question: |
      When should a postmortem be considered "closed"?
    options:
      - "As soon as the incident is mitigated and service is restored"
      - "When its critical action items have actually shipped, not merely when the incident ended"
      - "Once the document is fully formatted, reviewed, and shared with every stakeholder on the distribution list"
      - "At the end of the calendar quarter, when all open incident records are batch-closed during the reliability review"
    answer: 1
    explanation: |
      Closing a postmortem when the incident resolves is how action items rot. Because the
      action items are the entire point, the recommended practice is to keep it open until
      the critical items ship — resolution of the incident is not resolution of the learning.
    ref: "concepts.md#action-items-the-whole-point-and-the-common-failure"

  - id: blameless-postmortems-and-learning-039
    difficulty: intermediate
    tags: [accountability, forward-looking]
    question: |
      In a blameless culture, what form does individual "accountability" typically take?
    options:
      - "Backward-looking punishment applied to whoever happened to be at the controls when the failure surfaced"
      - "Forward-looking responsibility — the person who best understands the failure often owns the fix"
      - "Public naming in the postmortem summary so the wider organization knows exactly who was involved in the incident"
      - "Mandatory removal from the on-call rotation for a fixed cool-off period following any customer-visible incident"
    answer: 1
    explanation: |
      Blameless accountability is forward-looking: you are accountable for helping the
      system learn, and the person closest to the failure is often best placed to own the
      remediation. It is not retribution for having been at the controls.
    ref: "concepts.md#blameless-is-not-accountability-free"

  - id: blameless-postmortems-and-learning-040
    difficulty: intermediate
    tags: [document, well-badly-lucky]
    question: |
      What is the purpose of the "what went well / what went badly / where we got lucky"
      three-column reflection?
    options:
      - "To rank the responding team members by how well each one performed during the live incident"
      - "To formally decide which individual or team should be held responsible for the outage"
      - "To candidly capture strengths to keep, weaknesses to fix, and silent risks to address"
      - "To satisfy a mandatory compliance checkbox, after which the reflection is filed away with no further follow-up"
    answer: 2
    explanation: |
      This reflection reinforces what worked (so it is preserved), surfaces what failed
      (so it becomes action items), and — via "got lucky" — exposes risks that produced no
      harm this time but must still be addressed.
    ref: "concepts.md#anatomy-of-a-postmortem-document"

  - id: blameless-postmortems-and-learning-041
    difficulty: advanced
    tags: [author-independence, culture]
    question: |
      Why can it undermine blamelessness if the postmortem is authored solely by the same
      engineer whose change triggered the incident, with no independent review?
    options:
      - "That engineer knows the affected system too well, so their analysis becomes too detailed for others to follow"
      - "Postmortems must always be authored by a manager or team lead rather than by any individual engineer"
      - "It can create implicit self-blame or defensive framing; independent review helps keep the analysis systemic and honest"
      - "It makes the document too accurate, which discourages other teams from contributing their own perspectives"
    answer: 2
    explanation: |
      While the person closest to the incident has vital context, sole authorship with no
      independent review can slide into self-blame or defensiveness. Review by others helps
      keep the focus on systemic factors and preserves the blameless framing.
    ref: "concepts.md#what-blameless-means"

  - id: blameless-postmortems-and-learning-042
    difficulty: beginner
    tags: [terminology, aliases]
    question: |
      Which of these is commonly used as an alternative name for a "postmortem" to avoid
      negative connotations?
    options:
      - "Incident review / learning review"
      - "Blame report — a document whose explicit purpose is to name the individual at fault"
      - "Firing memo — a formal record used to justify dismissing whoever caused the outage"
      - "Downtime invoice — an internal bill charging the responsible team for the cost of the outage"
    answer: 0
    explanation: |
      Many orgs call it an incident review, learning review, or retrospective — partly to
      shed the morbid "postmortem" connotation and emphasize learning. The substance
      (blameless analysis + tracked action items) is what matters, not the label.
    ref: "concepts.md#what-blameless-means"

  - id: blameless-postmortems-and-learning-043
    difficulty: advanced
    tags: [normalization-of-deviance, at-risk]
    question: |
      A team has quietly skipped the staging soak test for months with no incident, until
      one day it causes an outage. What phenomenon does the "no incident until now" period
      best illustrate?
    options:
      - "Correct risk management — the months of success prove the soak test was genuinely unnecessary"
      - "A reckless act deserving termination, since the team knowingly disregarded a substantial, documented risk"
      - "Normalization of deviance — an unsafe shortcut becomes accepted because it repeatedly seemed to work"
      - "A monitoring false positive that mistakenly attributed the outage to the skipped staging soak test"
    answer: 2
    explanation: |
      Repeatedly cutting a corner without immediate consequence normalizes the deviation
      until the eroded safety margin finally fails. It is at-risk behavior; the Just
      response is to coach and remove the incentive to skip the soak, not to punish.
    ref: "concepts.md#just-culture-and-the-reckless-line"

  - id: blameless-postmortems-and-learning-044
    difficulty: intermediate
    tags: [metrics, program-health]
    question: |
      Which metric best indicates the HEALTH of a postmortem program itself (as opposed to
      an individual incident)?
    options:
      - "The number of engineers formally disciplined per quarter as a result of incident reviews"
      - "The average word count of postmortem documents produced across the reporting period"
      - "The raw count of SEV1 incidents per year, considered in isolation from every other metric"
      - "The completion rate and age of postmortem action items"
    answer: 3
    explanation: |
      Because completed action items are the point, tracking their completion rate and how
      long open items age is the best signal that the program is actually improving the
      system rather than producing shelf-ware.
    ref: "concepts.md#action-items-the-whole-point-and-the-common-failure"

  - id: blameless-postmortems-and-learning-045
    difficulty: advanced
    tags: [second-story, rewrite, mechanism]
    question: |
      While drafting, you write "the engineer should have known the config change was
      risky." Applying blameless principles, what is the better next move?
    options:
      - "Add their manager as a reviewer of the postmortem to formally confirm that the mistake was made"
      - "Ask why the system made the risky change easy and gave no signal that it was risky, and fix that"
      - "Delete the sentence entirely and leave the config change out of the postmortem altogether"
      - "Escalate the matter to HR so the engineer's judgment can be reviewed through the formal process"
    answer: 1
    explanation: |
      Whenever you catch yourself writing "should have known," pivot to the Second Story:
      what about the tooling, defaults, review, or feedback made the risky action easy and
      unremarkable? That "why" is the actual, actionable finding.
    ref: "concepts.md#human-error-as-a-symptom-the-second-story"

  - id: blameless-postmortems-and-learning-046
    difficulty: intermediate
    tags: [cross-ref, incident-response]
    question: |
      Root-cause analysis and assigning long-term fixes are best done at what point
      relative to the incident?
    options:
      - "During the live incident, before mitigating customer impact, so the fix and the mitigation ship together"
      - "After the incident, in the postmortem — the live response prioritizes mitigation, not diagnosis"
      - "Never — only mitigation matters, and long-term fixes are simply absorbed into ordinary feature work"
      - "Only if a customer complains after the incident window, since silent incidents need no long-term fixes"
    answer: 1
    explanation: |
      During the incident, the rule is mitigate before diagnose (see incident-response-and
      -command). Deep root-cause analysis and durable action items belong to the
      postmortem afterward, when there is time to think without customer pressure.
    ref: "concepts.md#anatomy-of-a-postmortem-document"

  - id: blameless-postmortems-and-learning-047
    difficulty: advanced
    tags: [heinrich, safety-pyramid]
    question: |
      Heinrich's safety pyramid, applied to reliability, suggests what about serious
      incidents and near-misses?
    options:
      - "Serious incidents are statistically random events, entirely unrelated to the base of near-misses beneath them"
      - "Near-misses are inherently more dangerous than serious incidents because they leave no diagnostic trace behind"
      - "Reducing the rate of near-misses actively increases the rate of serious incidents over the same period"
      - "Serious incidents sit atop a much larger base of minor incidents and near-misses that often share the same causes"
    answer: 3
    explanation: |
      The pyramid models many near-misses and minor incidents underlying each serious one,
      often with shared causes. Mining and fixing the base of near-misses can prevent the
      serious incident before it occurs.
    ref: "concepts.md#near-miss-analysis"

  - id: blameless-postmortems-and-learning-048
    difficulty: intermediate
    tags: [anti-pattern, theater]
    question: |
      A team produces beautifully formatted postmortems for every incident, but nothing
      about the system ever changes. What is this anti-pattern called and its remedy?
    options:
      - "Postmortem theater; remedy is to track action items to completion and close on shipped fixes, not on the incident ending"
      - "Over-documentation; the remedy is to write substantially shorter postmortems that take less time to produce"
      - "Blameless failure; the remedy is to reintroduce individual blame so people feel accountable for shipping fixes"
      - "Detection gap; the remedy is to build more dashboards so the same class of incident is caught faster next time"
    answer: 0
    explanation: |
      Postmortems that look great but change nothing are theater. The remedy is
      follow-through discipline: owned/tracked action items, a review cadence, completion
      metrics, and closing the postmortem only when its critical fixes actually ship.
    ref: "concepts.md#postmortem-anti-patterns"

  - id: blameless-postmortems-and-learning-049
    difficulty: advanced
    tags: [safety-ii, hollnagel, learning]
    question: |
      What is the core distinction between Safety-I and Safety-II (Hollnagel)?
    options:
      - "Safety-I applies exclusively to physical hardware systems, whereas Safety-II applies exclusively to software systems"
      - "Safety-I describes manually operated processes, whereas Safety-II describes processes that have been fully automated end to end"
      - "Safety-I treats safety as the absence of failures (study what goes wrong); Safety-II treats it as the presence of success (study why everyday work goes right)"
      - "Safety-I is proactive prevention done before incidents; Safety-II is reactive investigation performed after incidents"
    answer: 2
    explanation: |
      Safety-I defines safety as the absence of failures and works reactively by dissecting
      accidents. Safety-II defines safety as the presence of success and studies everyday
      work — why the system succeeds the vast majority of the time. Note the last option
      inverts the two (Safety-I is the reactive one).
    ref: "concepts.md#safety-i-vs-safety-ii-and-resilience-engineering"

  - id: blameless-postmortems-and-learning-050
    difficulty: expert
    tags: [safety-ii, work-as-done, wai-wad]
    question: |
      A postmortem concludes "the operator failed to follow the runbook." A Safety-II /
      Work-as-Done lens would reframe this how?
    options:
      - "The gap between how work was imagined (the runbook) and how it was actually done reveals why the runbook didn't fit reality — that gap is the finding"
      - "The operator should be repeatedly retrained on the existing runbook until they follow every step in it without deviation"
      - "The runbook must be enforced automatically by tooling that blocks any action diverging from the documented procedure"
      - "The runbook itself is irrelevant to the analysis; only the final outcome of the incident matters for the postmortem"
    answer: 0
    explanation: |
      Work-as-Imagined (the runbook) rarely matches Work-as-Done (operator adaptations to
      real constraints). Measuring people against WAI produces blame; studying why the
      runbook diverged from reality — missing info, time pressure, tool gaps — produces the
      real, systemic learning.
    ref: "concepts.md#safety-i-vs-safety-ii-and-resilience-engineering"

  - id: blameless-postmortems-and-learning-051
    difficulty: expert
    tags: [resilience, four-cornerstones, hollnagel]
    question: |
      In Hollnagel's four cornerstones of resilience (Respond, Monitor, Anticipate, Learn),
      which cornerstone does the postmortem primarily serve, and what is the implication?
    options:
      - "Learn — the postmortem is only one of the four legs; a resilient org must also build Respond, Monitor, and Anticipate"
      - "Respond — the postmortem is the mechanism by which the team reacts to and contains the incident in the moment"
      - "Anticipate — the postmortem is primarily a forecasting tool that predicts which incidents will occur next"
      - "Monitor — the postmortem functions as a form of real-time telemetry feeding the team's live dashboards"
    answer: 0
    explanation: |
      The postmortem is the "Learn" cornerstone (knowing what has happened). Respond (what to
      do), Monitor (what to look for), and Anticipate (what to expect) are separate
      capabilities a learning organization must also build — postmortems alone don't make a
      system resilient.
    ref: "concepts.md#safety-i-vs-safety-ii-and-resilience-engineering"

  - id: blameless-postmortems-and-learning-052
    difficulty: advanced
    tags: [adaptive-capacity, heroics]
    question: |
      An incident was resolved only because an on-call engineer improvised a clever manual
      workaround far beyond the runbook. From a resilience-engineering view, what is the
      right takeaway?
    options:
      - "Reward the hero and move on; the successful save is proof that the system is already working as intended"
      - "Discipline the engineer for going off-script, since improvising beyond the runbook created unnecessary risk"
      - "Add 'always follow the documented runbook exactly' as the single action item and consider the matter closed"
      - "The improvisation demonstrates adaptive capacity, but needing a hero signals missing tooling/automation to build into the system"
    answer: 3
    explanation: |
      Operator improvisation beyond the runbook is adaptive capacity in action. But relying
      on a heroic save is a signal that the system lacks the tooling or automation to handle
      the condition — the postmortem should ask how to build that capacity in, not just
      celebrate (or punish) the hero.
    ref: "concepts.md#safety-i-vs-safety-ii-and-resilience-engineering"

  - id: blameless-postmortems-and-learning-053
    difficulty: expert
    tags: [etto, at-risk, normalization-of-deviance]
    question: |
      An engineer skipped a slow verification step that "worked fine 500 times" before it
      finally caused an incident. Which principle best explains WHY this shortcut happened,
      mechanistically?
    options:
      - "The engineer was simply lazy and negligent, and skipped the step out of indifference to the possible consequences"
      - "The ETTO principle — a rational efficiency-thoroughness trade-off under production pressure, the same trade-off that usually produces success"
      - "Random chance with no underlying pattern connecting the 500 successes to the one eventual failure"
      - "A deliberate reckless disregard of a known, substantial risk that the engineer consciously chose to accept"
    answer: 1
    explanation: |
      Hollnagel's Efficiency-Thoroughness Trade-Off explains at-risk behavior and
      normalization of deviance mechanistically: people constantly trade thoroughness for
      speed, and the same trade-off that normally succeeds occasionally fails. It was a
      rational response to the reward structure (speed), not laziness or (absent knowledge
      of a substantial risk) recklessness.
    ref: "concepts.md#safety-i-vs-safety-ii-and-resilience-engineering"

  - id: blameless-postmortems-and-learning-054
    difficulty: intermediate
    tags: [psychological-safety, edmondson]
    question: |
      What does Amy Edmondson's "psychological safety" refer to?
    options:
      - "A shared belief that the team is safe for interpersonal risk-taking — admitting errors or raising concerns without fear of humiliation or punishment"
      - "The physical safety controls and hazard protections engineered into the data center where the systems run"
      - "Deliberately lowered performance standards so that no team member ever feels pressure or scrutiny at work"
      - "The encryption of postmortem documents at rest so that sensitive incident details cannot be read by outsiders"
    answer: 0
    explanation: |
      Psychological safety is the shared belief that one can take interpersonal risks — admit
      a mistake, ask a question, raise a concern — without fear of embarrassment or reprisal.
      It is the precondition for people surfacing the details a blameless postmortem needs;
      it is not comfort, niceness, or lowered standards.
    ref: "concepts.md#psychological-safety-and-the-failure-spectrum"

  - id: blameless-postmortems-and-learning-055
    difficulty: expert
    tags: [edmondson, failure-spectrum, blameworthy]
    question: |
      Edmondson found that while only a small fraction of organizational failures are truly
      blameworthy, managers treat most as if they were. Which approximate figures capture
      this gap?
    options:
      - "~50% are blameworthy, and ~50% are treated as such — no gap"
      - "~2-5% are genuinely blameworthy, yet ~70-90% are treated as blameworthy"
      - "~70-90% are genuinely blameworthy, and ~70-90% are treated as such"
      - "Essentially 0% are blameworthy and 0% are treated as such"
    answer: 1
    explanation: |
      Edmondson's data: managers estimate only ~2-5% of failures are truly blameworthy, yet
      report treating ~70-90% as if they were. The reflex to blame vastly exceeds the actual
      incidence of blameworthy conduct — the empirical case for defaulting to good-faith,
      systemic analysis.
    ref: "concepts.md#psychological-safety-and-the-failure-spectrum"

  - id: blameless-postmortems-and-learning-056
    difficulty: advanced
    tags: [edmondson, failure-spectrum]
    question: |
      On Edmondson's spectrum of failure causes, which sits at the PRAISEWORTHY end?
    options:
      - "Exploratory testing / experimentation that expands knowledge, even when it fails"
      - "Deviance — knowingly choosing to violate an established process rule"
      - "Inattention — inadvertently deviating from a documented spec's steps"
      - "Lack of ability — lacking the skills the assigned task actually required"
    answer: 0
    explanation: |
      The spectrum runs blameworthy (deviance, inattention) through process/complexity/
      uncertainty to praiseworthy (hypothesis testing and exploratory experimentation).
      Failures from principled experimentation that expands knowledge are praiseworthy — you
      want more of that kind of failure, not less.
    ref: "concepts.md#psychological-safety-and-the-failure-spectrum"

  - id: blameless-postmortems-and-learning-057
    difficulty: advanced
    tags: [second-victim, culture]
    question: |
      The engineer who was "at the controls" of a major outage is sometimes called a "second
      victim." Why does supporting rather than punishing them matter beyond simple decency?
    options:
      - "How the org treats the person at the center of the last outage is watched by everyone who might be at the center of the next — it is a reporting-rate lever"
      - "It reduces the company's overall legal liability by formally documenting that a specific named individual, not the organization, was at fault"
      - "It has no practical effect on system reliability and is purely a morale gesture that makes the team feel better afterward"
      - "It speeds up the technical mitigation of the current incident by keeping the responder at the controls calm and focused"
    answer: 0
    explanation: |
      The person at the center suffers real distress (the second-victim concept). Beyond
      humaneness, everyone else observes how they are treated and calibrates how safe it is
      to report their own mistakes — so supporting them directly protects the reporting rate
      the whole learning system depends on.
    ref: "concepts.md#psychological-safety-and-the-failure-spectrum"

  - id: blameless-postmortems-and-learning-058
    difficulty: expert
    tags: [outcome-bias, hindsight-bias, distinction]
    question: |
      What distinguishes OUTCOME bias from HINDSIGHT bias?
    options:
      - "They are simply two interchangeable names for one and the same underlying cognitive bias, so drawing a distinction between them adds no analytical value"
      - "Outcome bias judges a decision's quality by its result rather than the information available at the time; hindsight bias is that knowing the outcome distorts your sense of what was knowable beforehand"
      - "Hindsight bias applies only to executives reviewing the report afterward, whereas outcome bias applies only to the engineers who were on call"
      - "Outcome bias distorts only the incident timeline section of the document, while hindsight bias distorts only the action-item list drawn up later"
    answer: 1
    explanation: |
      Hindsight bias: once you know the outcome, the 'right' path looks obvious and you
      misjudge what was knowable in advance. Outcome bias: you judge the quality of the
      decision itself by how it turned out. They are distinct named biases, and Just Culture
      defends against both by judging conduct, not results.
    ref: "concepts.md#outcome-bias-vs-hindsight-bias"

  - id: blameless-postmortems-and-learning-059
    difficulty: expert
    tags: [outcome-bias, just-culture, scenario]
    question: |
      An engineer runs the same delete script three times: case A does nothing, case B
      truncates a test table, case C drops the production database. The conduct and
      information were identical each time. What does Just Culture prescribe?
    options:
      - "Identical response in all three cases — the conduct was the same; punishing only C is outcome bias"
      - "Escalating the punishment in proportion to the actual damage caused in each case"
      - "Discipline only in case C, since that is where the real production harm occurred"
      - "No examination at all in cases A and B, because in those two cases nothing bad ended up happening"
    answer: 0
    explanation: |
      Just Culture judges the behavior and the information available at the time, not the
      luck of the outcome. Identical reasonable conduct warrants an identical response.
      Punishing only case C is textbook outcome bias and teaches people that safety is luck,
      so they hide the bad-luck cases.
    ref: "concepts.md#outcome-bias-vs-hindsight-bias"

  - id: blameless-postmortems-and-learning-060
    difficulty: expert
    tags: [five-whys, critique, complex-systems]
    question: |
      Which is the STRONGEST reason the Five Whys is a poor fit for a distributed-systems
      outage postmortem?
    options:
      - "It forces a single linear causal chain and manufactures a false single root cause, contradicting the reality of multiple interacting contributing factors"
      - "It takes far too long to perform inside a time-boxed review meeting with the whole responding team present"
      - "It requires a specialized licensed causal-analysis software package that most engineering teams do not have access to"
      - "It can only ever be applied to physical hardware failures and is undefined for software or configuration incidents"
    answer: 0
    explanation: |
      The Five Whys forces one linear chain, is investigator-dependent, and stops at the
      questioner's knowledge boundary — structurally producing a false single 'root cause'
      that contradicts the multi-factor, interaction-driven nature of complex-system
      failures. That structural mismatch, not its speed or tooling, is the core critique.
    ref: "concepts.md#the-five-whys-critique-and-accident-models"

  - id: blameless-postmortems-and-learning-061
    difficulty: expert
    tags: [accident-models, stamp, leveson]
    question: |
      In Nancy Leveson's systemic (STAMP/CAST) accident model, how do accidents in complex
      systems arise?
    options:
      - "From a single broken component that can always be pinpointed with enough investigation"
      - "From unsafe interactions among components that each worked as designed — safety is a control problem, so there is often no single 'root cause' by construction"
      - "Always from human error at the sharp end, committed by whoever was operating the system"
      - "From insufficiently detailed written documentation of the operational procedures involved"
    answer: 1
    explanation: |
      STAMP treats safety as a control problem: accidents emerge from inadequate control
      over the interactions between components, each of which may have worked exactly as
      designed. There is frequently no single failed part or single root cause — which is
      why leading orgs drop 'root cause' for 'contributing factors.'
    ref: "concepts.md#the-five-whys-critique-and-accident-models"

  - id: blameless-postmortems-and-learning-062
    difficulty: advanced
    tags: [accident-models, swiss-cheese, reason]
    question: |
      James Reason's Swiss Cheese model belongs to which family of accident models, and what
      is its central idea?
    options:
      - "Systemic — accidents emerge from unsafe interactions among components working as designed"
      - "Linear/sequential — failure propagates as one single chain of falling dominoes"
      - "Statistical — failures occur at random, following a normal (Gaussian) distribution"
      - "Epidemiological — latent conditions align with active failures through holes in layered defenses"
    answer: 3
    explanation: |
      The Swiss Cheese model is the epidemiological family: layered defenses each have holes
      (latent conditions / 'resident pathogens'), and an accident occurs when the holes
      momentarily line up so an active failure passes through all layers. It sits between the
      linear (domino) and systemic (STAMP) families.
    ref: "concepts.md#the-five-whys-critique-and-accident-models"

  - id: blameless-postmortems-and-learning-063
    difficulty: expert
    tags: [mttr, void, statistics]
    question: |
      The VOID reports argue MTTR is a misleading program metric primarily because incident
      durations follow what kind of distribution?
    options:
      - "A normal (Gaussian) distribution, in which the arithmetic mean is a fully representative central value"
      - "A uniform distribution, in which every possible incident duration is exactly equally likely to occur"
      - "A lognormal / heavy-tailed distribution where a few outliers dominate the mean, making it statistically unreliable"
      - "A clean bimodal distribution with two roughly equal peaks at short and long durations"
    answer: 2
    explanation: |
      Incident durations are lognormal / heavy-tailed with high variance: a handful of
      monster incidents dominate the sum, so the arithmetic mean is swamped by outliers and
      is not a stable, representative number at typical sample sizes. That is why averaging
      into a headline MTTR KPI is statistically unsound.
    ref: "concepts.md#mttr-is-misleading-shallow-data-vs-deep-data"

  - id: blameless-postmortems-and-learning-064
    difficulty: expert
    tags: [mttr, okr, goodhart, pushback]
    question: |
      Leadership proposes making "reduce MTTR" a team OKR to drive down incidents. What is
      the best-grounded push-back?
    options:
      - "MTTR is fundamentally impossible to measure at all, because incident start and end timestamps can never be pinned down with any accuracy"
      - "MTTR should simply be swapped out for mean-time-between-failures as the OKR, since MTBF is an inherently more reliable and less gameable target"
      - "Durations are heavy-tailed so the mean is unreliable, VOID shows no correlation between MTTR and reliability, and the target incentivizes gaming (under-declaring severity, closing early); track action-item closure and deep analysis instead"
      - "Agree without reservation — a lower MTTR always and directly proves that the team's underlying reliability is genuinely improving"
    answer: 2
    explanation: |
      The strong push-back combines three facts: durations are heavy-tailed so the mean is
      outlier-dominated; VOID found no correlation between shorter MTTR and better
      reliability; and MTTR-as-target invites gaming via severity under-declaration and
      premature closure (Goodhart). Prefer action-item closure rate and deep
      contributing-factor analysis.
    ref: "concepts.md#mttr-is-misleading-shallow-data-vs-deep-data"

  - id: blameless-postmortems-and-learning-065
    difficulty: advanced
    tags: [shallow-data, deep-data]
    question: |
      In the shallow-data vs deep-data framing, which is an example of DEEP data?
    options:
      - "The raw count of incidents recorded per quarter, charted as a simple trend line"
      - "The arithmetic mean time to resolve, averaged across every incident in the period"
      - "A contributing-factor narrative describing where Work-as-Imagined diverged from Work-as-Done"
      - "The tally of incidents broken down by their assigned severity level (SEV1, SEV2, SEV3)"
    answer: 2
    explanation: |
      Shallow data (MTTR, incident counts, severity tallies) is easy to chart but hides the
      mechanism. Deep data — contributing-factor narratives, near-miss reports, how recovery
      actually happened, where WAI diverged from WAD — is what actually explains failures and
      changes the system.
    ref: "concepts.md#mttr-is-misleading-shallow-data-vs-deep-data"

  - id: blameless-postmortems-and-learning-066
    difficulty: expert
    tags: [trigger, cause, distinction]
    question: |
      A latent null-pointer bug lay dormant for months until a traffic spike activated it and
      caused an outage. In Google's template, how are "trigger" and "root/contributing cause"
      distinguished here?
    options:
      - "The traffic spike is the underlying root cause, and the dormant null-pointer bug is merely the trigger"
      - "They are effectively the same thing and should be recorded just once as a single combined entry"
      - "The trigger is whichever engineer deployed the code, and the cause is the total measured outage duration"
      - "The traffic spike is the trigger (proximate event); the latent bug plus missing safeguards are the contributing cause(s)"
    answer: 3
    explanation: |
      The trigger is the proximate event that set it off (the traffic spike — the match); the
      contributing cause is the deeper condition that made it harmful (the latent bug and
      absent guardrails — the fuel). Conflating them leads to 'fixing the trigger' (throttle
      that traffic) while leaving the real cause intact.
    ref: "concepts.md#trigger-vs-cause-vs-contributing-factor"

  - id: blameless-postmortems-and-learning-067
    difficulty: advanced
    tags: [timeline, mttd, mtta, mttm, decomposition]
    question: |
      Why is it useful to capture detection, engage/acknowledge, mitigate, and resolve as
      DISTINCT timeline points rather than one "duration"?
    options:
      - "It makes the postmortem document noticeably longer and more thorough for the record"
      - "It is explicitly required by incident-reporting law in most jurisdictions and industries"
      - "It decomposes response into MTTD/MTTA/MTTM/MTTR so you can see WHICH interval to improve (e.g., slow detection vs slow mitigation)"
      - "It lets you assign blame to whichever responder was slowest to act during the timeline"
    answer: 2
    explanation: |
      Separating detection, acknowledgement, mitigation, and full resolution decomposes the
      response into MTTD/MTTA/MTTM/MTTR, revealing which specific interval is the bottleneck.
      A single lumped 'duration' hides whether the problem was slow detection, slow paging, or
      slow fixing.
    ref: "concepts.md#trigger-vs-cause-vs-contributing-factor"

  - id: blameless-postmortems-and-learning-068
    difficulty: advanced
    tags: [timeline, contemporaneous, memory]
    question: |
      Why should the postmortem timeline be reconstructed from chat and ticket logs
      contemporaneously rather than from participants' memories days later?
    options:
      - "Logs are consistently shorter and more concise than participants' recollections"
      - "Memory is reshaped by hindsight, so a log-based timeline avoids the distortion that makes past decisions look obviously wrong"
      - "It is simply faster to copy timestamps from logs than to sit down and interview people"
      - "Chat and ticket logs are legally privileged records and memories are not admissible"
    answer: 1
    explanation: |
      Human memory is reconstructed and heavily distorted by hindsight after the outcome is
      known. Building the timeline from contemporaneous chat/ticket logs preserves what people
      actually knew and did in the moment, protecting the blameless, second-story analysis
      from hindsight bias.
    ref: "concepts.md#trigger-vs-cause-vs-contributing-factor"

  - id: blameless-postmortems-and-learning-069
    difficulty: advanced
    tags: [wheel-of-misfortune, rituals, culture]
    question: |
      What is the "Wheel of Misfortune" ritual (SRE Workbook), and what does it accomplish?
    options:
      - "A disaster role-play where engineers re-enact a past incident (ideally with the original IC present) to practice response under simulated pressure"
      - "A randomized on-call scheduling tool that rotates and assigns pages fairly across the whole team"
      - "A public leaderboard that ranks the engineers by the total number of incidents each one has caused"
      - "A lottery-style mechanism that randomly decides which engineer has to write up each postmortem"
    answer: 0
    explanation: |
      The Wheel of Misfortune is a structured disaster role-play: engineers reenact a past
      postmortem's scenario, often with the original Incident Commander as game master. It
      trains new on-call, rehearses the response muscle, and surfaces gaps cheaply — without a
      real outage.
    ref: "concepts.md#postmortem-quality-bar-and-program-health"

  - id: blameless-postmortems-and-learning-070
    difficulty: intermediate
    tags: [treynor-sloss, action-items, quote]
    question: |
      Ben Treynor Sloss's line "a postmortem without subsequent action is indistinguishable
      from no postmortem" is best used to anchor which argument?
    options:
      - "That postmortems should be kept strictly confidential within the responding team"
      - "That only SEV1-severity incidents actually deserve a full written postmortem"
      - "That MTTR should be adopted as the primary headline metric for the program"
      - "That writing the document is worthless without shipped follow-through action items"
    answer: 3
    explanation: |
      The quote drives home the central thesis: the document is not the deliverable — the
      tracked, completed action items are. A beautiful postmortem with no follow-through
      changes nothing and is functionally equivalent to never having written one.
    ref: "concepts.md#postmortem-quality-bar-and-program-health"

  - id: blameless-postmortems-and-learning-071
    difficulty: expert
    tags: [quality-bar, grading, rubric]
    question: |
      Applying the SRE Workbook's quality rubric, which postmortem attribute is a legitimate
      grading criterion?
    options:
      - "It correctly identifies which specific individual should be held responsible for the outage"
      - "It runs to at least twenty pages, demonstrating that the analysis was suitably exhaustive"
      - "It deliberately uses the fewest possible technical terms so any reader can follow it"
      - "It has quantified impact, concrete owned/measurable/preventative action items, blameless language, depth to contributing factors, and was circulated promptly (~1 week)"
    answer: 3
    explanation: |
      The Workbook grades on clarity + glossary, quantified impact, concrete
      owned/prioritized/measurable/preventative action items, blameless (what-not-who)
      language, depth (multi-team, data-driven, reaching contributing factors), promptness
      (good ones circulate within ~a week), and conciseness. Naming a culprit or padding
      length are the opposite of good.
    ref: "concepts.md#postmortem-quality-bar-and-program-health"

  - id: blameless-postmortems-and-learning-072
    difficulty: expert
    tags: [program-health, warning-signs, repeat-incidents]
    question: |
      Your team keeps having incidents of the SAME class quarter after quarter. Per the SRE
      Workbook, what does this most directly indicate?
    options:
      - "The monitoring is far too sensitive and is repeatedly firing on the same benign condition"
      - "The team is simply experiencing an unlucky statistical run of unrelated coincidental failures"
      - "A warning sign of an eroding postmortem culture — analysis is stopping at the proximate cause and/or action items aren't shipping"
      - "The recurring incidents should be merged into one consolidated postmortem to save the team time"
    answer: 2
    explanation: |
      Repeat incidents of the same class are one of the Workbook's four warning signs of
      eroding culture (alongside people avoiding association, blameful leadership language,
      and no time to write postmortems). It signals shallow analysis or action items that
      never get completed.
    ref: "concepts.md#postmortem-quality-bar-and-program-health"

  - id: blameless-postmortems-and-learning-073
    difficulty: advanced
    tags: [program-health, warning-signs]
    question: |
      Which of the following is one of the SRE Workbook's warning signs that a postmortem
      culture is eroding?
    options:
      - "Postmortems are consistently written and circulated within a week of each incident while the details are still fresh"
      - "Action items each carry a named individual owner, a due date, and a tracking ticket in the shared backlog"
      - "People start avoiding association with incidents ('glad I wasn't involved') and leadership slips into blameful language"
      - "Postmortem reading clubs are well attended and teams voluntarily walk through each other's recent incidents"
    answer: 2
    explanation: |
      The four warning signs are: people avoiding association with incidents, leadership
      slipping into blameful language, no time being given to write postmortems, and repeat
      incidents of the same class. The other options describe a HEALTHY program, not an
      eroding one.
    ref: "concepts.md#postmortem-quality-bar-and-program-health"

  - id: blameless-postmortems-and-learning-074
    difficulty: expert
    tags: [blame-aware, restorative, dekker]
    question: |
      A sharp interviewer asks "is truly blameless even achievable?" What is the most mature
      answer?
    options:
      - "Yes, absolutely — humans can be fully trained out of the instinct to attribute blame, so literal blamelessness is a solved matter"
      - "No, it is unachievable, so blame should be embraced openly as the primary tool for driving accountability and reliability"
      - "Blameless is a process property and aspiration; the refined framing is 'blame-aware' / restorative Just Culture — accountability that is forward-looking and restorative (who was harmed, what's needed) rather than backward-looking and retributive"
      - "It is an irrelevant philosophical distraction, since only the measurable outcome of the incident ever matters to the analysis"
    answer: 2
    explanation: |
      Dekker and others note literal blamelessness is aspirational — humans do attribute. The
      mature framing is blame-aware / restorative Just Culture: not zero accountability, but
      accountability oriented forward and toward repair (who was hurt, what they need, whose
      obligation) rather than backward toward punishment.
    ref: "concepts.md#blameless-vs-blame-aware--restorative"

  - id: blameless-postmortems-and-learning-075
    difficulty: advanced
    tags: [restorative, retributive, accountability]
    question: |
      What best contrasts RESTORATIVE with RETRIBUTIVE accountability after an incident?
    options:
      - "Restorative asks who was harmed and what they need to be made whole; retributive asks which rule was broken, whose fault it was, and what the punishment should be"
      - "Restorative accountability applies only to hardware and infrastructure failures, whereas retributive accountability applies only to software and application defects"
      - "Restorative processes are inherently slower and more expensive to run, whereas retributive processes resolve an incident faster and more cheaply"
      - "They are simply two interchangeable synonyms for the same accountability model, with no meaningful practical difference between them"
    answer: 0
    explanation: |
      Retributive justice centers rule-breaking, fault, and proportional punishment.
      Restorative justice centers harm and repair: who was hurt (including the second victim),
      what they need, and whose obligation it is to meet that need — a forward-looking
      orientation compatible with blameless learning.
    ref: "concepts.md#blameless-vs-blame-aware--restorative"

  - id: blameless-postmortems-and-learning-076
    difficulty: expert
    tags: [case-study, gitlab, backups]
    question: |
      In the GitLab.com Jan 2017 data-loss incident, an engineer deleted the wrong database
      directory — but the deeper, more alarming finding was what?
    options:
      - "Five of five backup/restore methods were broken or untested — so the real systemic lesson is to verify that backups actually restore, not just that they run"
      - "The engineer who ran the deletion had received no formal onboarding or database-operations training whatsoever"
      - "The primary database had been badly under-provisioned for months and was the true underlying root cause of the outage"
      - "The entire incident was ultimately traced to a malicious insider deliberately sabotaging the production data"
    answer: 0
    explanation: |
      The blameful stopping point is 'tired engineer deleted the wrong directory.' The
      systemic finding was that all five backup/recovery mechanisms were broken or untested —
      the real lesson is that backups must be verified to actually restore. GitLab
      live-streamed the recovery, a landmark act of blameless transparency.
    ref: "concepts.md#canonical-incident-case-studies"

  - id: blameless-postmortems-and-learning-077
    difficulty: expert
    tags: [case-study, aws-s3, blast-radius]
    question: |
      The AWS S3 US-EAST-1 outage (Feb 2017) began when a typo in a debugging command removed
      more capacity servers than intended. What is the SYSTEMIC fix, versus the blameful
      non-fix?
    options:
      - "Blameful non-fix: retrain the operator. Systemic fix: guard destructive tooling with input validation and blast-radius limits so a command cannot remove too much"
      - "Blameful non-fix: add input validation and blast-radius limits to the tool. Systemic fix: identify and fire the operator who ran the command"
      - "Both the blameful non-fix and the systemic fix reduce to telling engineers to be more careful when running commands in production"
      - "Systemic fix: permanently ban all debugging and capacity-management commands from ever being run in the production environment"
    answer: 0
    explanation: |
      The blameful non-fix is 'the operator made a typo — retrain / be careful,' which leaves
      the dangerous tool intact. The systemic fix AWS implemented was to add input validation
      and blast-radius limits to the capacity-removal tooling so no single command can remove
      too much at once.
    ref: "concepts.md#canonical-incident-case-studies"

  - id: blameless-postmortems-and-learning-078
    difficulty: expert
    tags: [case-study, crowdstrike, config-rigor]
    question: |
      The CrowdStrike July 2024 outage (BSOD on ~8.5M machines) came from a content/config
      channel update that bypassed validation. What is the central reliability lesson?
    options:
      - "Endpoint and antivirus software should never be permitted to run in kernel mode, since that is the sole reason the update was able to crash the host"
      - "Treat content/config updates with the same staging, canary, and validation rigor as code — 'it's just config' is the trap"
      - "Windows machines should be configured to reject vendor security-content updates entirely to avoid this whole class of failure"
      - "The central fix is to add more manual QA engineers so every content release is hand-tested before it is shipped to customers"
    answer: 1
    explanation: |
      The failure propagated globally because a content/config update skipped the validation
      and staged-rollout rigor applied to code. The lesson is that config and content changes
      can be as catastrophic as code and must go through the same validation, canary, and
      staged-rollout guardrails — the same lesson as Cloudflare's 2019 WAF regex incident.
    ref: "concepts.md#canonical-incident-case-studies"

  - id: blameless-postmortems-and-learning-079
    difficulty: advanced
    tags: [case-study, knight-capital, feature-flags]
    question: |
      The Knight Capital 2012 loss (~$440M in ~45 minutes) resulted from repurposing a dormant
      feature flag combined with an inconsistent deploy across servers. Which two systemic
      lessons follow?
    options:
      - "Execute trades faster to recover the losses, and hire additional traders to watch the automated systems more closely"
      - "Disable and remove every feature flag from the codebase permanently, and freeze all further production deployments indefinitely"
      - "Blame and discipline the engineer who ran the deploy, and add a manual pre-deploy checklist for humans to follow each time"
      - "Never reuse/repurpose old feature flags, and enforce deploy consistency with automated verification across all hosts"
    answer: 3
    explanation: |
      Reusing a dormant flag caused new code to reactivate dead legacy code, and the
      inconsistent deploy (new code on only some of the servers) meant some hosts ran the old
      behavior. The systemic lessons: never repurpose old flags, and enforce/verify deploy
      consistency across every host automatically.
    ref: "concepts.md#canonical-incident-case-studies"

  - id: blameless-postmortems-and-learning-080
    difficulty: expert
    tags: [action-items, etto, fatigue, scenario]
    question: |
      A 3am fatigue-related misfire needs action items. Which pairing correctly labels a BAD
      vs GOOD item and explains why?
    options:
      - "Good: 'add mandatory refresher training on the runbook.' Bad: 'add a dry-run default to the tool' — because training scales across the whole team better than tooling"
      - "Both proposed items are equally good, so the team can simply pick whichever one is faster to implement this sprint"
      - "Bad: 'engineers should be more careful when tired' (reinstalls the human trap, ignores the ETTO pressure that caused the shortcut). Good: 'add a confirmation prompt and dry-run default, owned/ticketed/dated' (removes the trap)"
      - "Bad: 'add a confirmation prompt to the tool.' Good: 'remind the on-call engineer to get more sleep before their next night shift'"
    answer: 2
    explanation: |
      'Be more careful when tired' reinstalls the trap on a fallible human and ignores the
      ETTO pressure that produced the shortcut. The good item removes the trap systemically —
      a confirmation prompt plus a safe dry-run default, with a named owner, ticket, and due
      date — so fatigue can no longer turn into disaster.
    ref: "concepts.md#safety-i-vs-safety-ii-and-resilience-engineering"

  - id: blameless-postmortems-and-learning-081
    difficulty: advanced
    tags: [contributing-factors, template, root-cause]
    question: |
      Many leading orgs and the Learning-From-Incidents community have deliberately renamed the
      postmortem's "Root Cause" section to "Contributing Factors." What is the rationale?
    options:
      - "The phrase 'Contributing Factors' simply sounds more formal and professional to external readers of the report"
      - "In complex systems there is often no single root cause by construction; the plural naming resists single-cause tunnel vision and reflects the multiple interacting conditions that actually produced the incident"
      - "Renaming the section meaningfully shortens the overall postmortem document and reduces the time needed to write it"
      - "Industry regulators formally mandate the exact wording 'Contributing Factors' in every published incident report"
    answer: 1
    explanation: |
      The singular 'root cause' structurally invites tunnel vision and a false single
      explanation, contradicting how complex systems fail (multiple latent conditions and
      unsafe interactions aligning). Renaming to 'contributing factors' bakes the multi-factor
      reality into the template itself.
    ref: "concepts.md#the-five-whys-critique-and-accident-models"

  - id: blameless-postmortems-and-learning-082
    difficulty: intermediate
    tags: [reading-clubs, fixit, rituals]
    question: |
      "FixIt weeks" and "postmortem reading clubs" are examples of what?
    options:
      - "Administrative techniques for deliberately reducing the total number of postmortems a team is required to write"
      - "Concrete rituals for operationalizing a learning culture — FixIt weeks focus on closing open action items; reading clubs spread incident learning across teams"
      - "Standardized metrics used to measure and report mean-time-to-resolve trends across the organization"
      - "Formal disciplinary procedures for handling engineers who repeatedly cause the same class of incident"
    answer: 1
    explanation: |
      Both are concrete practices from the SRE Workbook for making a learning culture real:
      FixIt weeks are periodic focused pushes (often with leaderboards) to close reliability
      debt and open action items; reading clubs are open sessions where teams walk through
      recent postmortems to spread the learning.
    ref: "concepts.md#postmortem-quality-bar-and-program-health"

