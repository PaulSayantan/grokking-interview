topic: Graceful Degradation & Fallbacks
domain: reliability-ops
topic_slug: graceful-degradation-and-fallbacks
version: 1
questions:
- id: graceful-degradation-and-fallbacks-001
  difficulty: beginner
  tags: [graceful-degradation, definition]
  question: |
    What best describes graceful degradation?
  options: [Automatically restarting a crashed process with a supervisor until it stays up and passes
      its health checks, Rolling back a deployment to the previous known-good version whenever error rates
      climb past a set threshold, 'Continuing to provide reduced-but-useful functionality when parts of
      the system fail, instead of a full outage', Encrypting data at rest with rotating keys so that any
      breach of the storage layer exposes nothing useful]
  answer: 2
  explanation: |
    Graceful degradation converts a hard binary failure ("the page is down") into a
    soft partial one ("the page loads but the recommendations widget is hidden"). It
    keeps the core function working when non-critical parts fail.
  ref: concepts.md#graceful-degradation
- id: graceful-degradation-and-fallbacks-002
  difficulty: beginner
  tags: [fallbacks, definition]
  question: |
    In resilience engineering, a "fallback" is best defined as:
  options: [A predetermined alternative result returned when the primary path fails, A second copy of
      a service running in another availability zone for redundancy, A durable queue that buffers writes
      during an outage until the backend recovers, The act of retrying a failed request with exponential
      backoff and jitter]
  answer: 0
  explanation: |
    A fallback answers "what do we return instead?" when a call throws, times out, or a
    circuit breaker is open — e.g. a cached value, a static default, or a secondary
    provider. Retries and replicas are different mechanisms.
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-003
  difficulty: intermediate
  tags: [graceful-degradation, unit-of-degradation]
  question: |
    A product page depends on a critical pricing path and an optional recommendations
    service. The recommendations service goes down. What is the graceful-degradation
    response?
  options: [Return a 503 error page for the whole product page until recommendations recover, Retry the
      recommendations call indefinitely until it succeeds while holding the response, Fail the request
      with a 500 so a load balancer can route it to another instance, 'Hide the recommendations widget
      and render the rest of the page, keeping purchase working']
  answer: 3
  explanation: |
    Degradation happens per feature, keyed to that feature's dependency health. The
    optional widget is hidden while the core (price + buy button) keeps working. You
    degrade the feature, not the whole request.
  ref: concepts.md#graceful-degradation
- id: graceful-degradation-and-fallbacks-004
  difficulty: intermediate
  tags: [failure-isolation, cascading-failure]
  question: |
    Which architectural property is a prerequisite for graceful degradation to actually
    work when an optional dependency becomes slow?
  options: [A globally distributed CDN that caches the optional response at edge locations near every
      user, 'Failure isolation: the optional call is wrapped in a timeout/circuit breaker so its slowness
      can''t block the parent request', Strong consistency across all replicas so that every read observes
      the most recently committed write, A single shared thread pool serving all downstream calls so resources
      are pooled and used efficiently]
  answer: 1
  explanation: |
    Without isolation (timeout + circuit breaker, ideally a bulkhead), a slow optional
    dependency ties up threads on the parent request and you get a cascading failure
    instead of graceful degradation. A single shared pool is the opposite of isolation.
  ref: concepts.md#graceful-degradation
- id: graceful-degradation-and-fallbacks-005
  difficulty: intermediate
  tags: [degradation, failover]
  question: |
    What distinguishes failover from graceful degradation?
  options: [Failover replaces the failed component with a healthy equivalent so the user sees no change;
      degradation accepts a reduced experience, Failover accepts a reduced experience; degradation replaces
      the failed component with a healthy equivalent, 'They are two names for the same mechanism, differing
      only in the vocabulary each engineering team happens to use', Failover only applies to relational
      databases; degradation only applies to in-memory caches and CDNs]
  answer: 0
  explanation: |
    Failover swaps in an equivalent healthy component (a replica, another AZ) so the
    user sees no difference. Degradation accepts a reduced experience. Prefer failover
    when redundancy exists; degrade when the failed thing is genuinely optional.
  ref: concepts.md#graceful-degradation
- id: graceful-degradation-and-fallbacks-006
  difficulty: intermediate
  tags: [fallback-chain, terminal-fallback]
  question: |
    Why should the terminal (last-resort) fallback in a chain avoid performing network
    I/O?
  options: [Network I/O is always slower than local disk I/O and so misses the parent request's latency
      budget, Because caches and secondary stores can never be reached reliably over a saturated network
      link, So the fallback is guaranteed to succeed and provides a reliable floor that can't itself hang
      or fail, To reduce the number of open TCP connections the service holds and keep egress costs down]
  answer: 2
  explanation: |
    If the last resort can itself hang or fail (a network call), you have no floor. A
    static in-memory default or a value baked into the deployment artifact is the safe
    terminal fallback that always returns.
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-007
  difficulty: advanced
  tags: [fallback-chain, latency-budget]
  question: |
    A fallback chain tries primary, then secondary, then tertiary, each with a 2-second
    timeout. What is the main risk this design introduces?
  options: [The chain will return stale cached data even when the primary path is fully healthy, 'The
      chain can consume up to ~6 seconds, blowing the parent request''s latency budget', The chain silently
      guarantees exactly-once delivery semantics across all three tiers, The chain collapses the three
      tiers into a single deduplicated network call]
  answer: 1
  explanation: |
    Chaining timeouts is additive: three 2-second timeouts can produce a 6-second
    request and tie up the thread the whole time. You must bound the total latency of
    the chain, and fallbacks should be fast.
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-008
  difficulty: advanced
  tags: [correlated-failure, independence]
  question: |
    Why is a "secondary provider" fallback that shares the same database, network path,
    and auth service as the primary considered weak protection?
  options: [It costs roughly twice as much to operate because you run two full provider stacks, It violates
      strong consistency between the two providers and can return divergent answers, Secondary providers
      are always measurably slower than serving from a local in-memory cache, 'It will experience correlated
      failure — the shared dependency takes out both at once, so the fallback provides no real protection']
  answer: 3
  explanation: |
    A fallback must be independent of the primary. If they share infrastructure (DB,
    network, auth, AZ), a correlated failure disables both simultaneously and the
    fallback offers no protection when you most need it.
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-009
  difficulty: advanced
  tags: [fallbacks, writes, correctness]
  question: |
    When a write operation's primary path fails, why is blindly returning a fabricated
    success fallback dangerous, and what is preferred?
  options: ['It''s fine; fallbacks work identically for reads and writes with no correctness difference',
    It merely doubles write latency; prefer returning an error immediately to the caller with no buffering
      at all, It breaks the read-through cache; prefer disabling the cache layer for the duration of the
      write, It can corrupt state or lose data; prefer queue-and-retry (durably buffer the write and apply
      it later)]
  answer: 3
  explanation: |
    Fallbacks belong on reads. Silently substituting a value on a write can corrupt
    state or drop data. For writes, accept the request, persist to a durable buffer, and
    apply it later (queue-and-retry) rather than fabricate success.
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-010
  difficulty: intermediate
  tags: [fallback-risk, silent-quality-loss]
  question: |
    Search relevance has quietly gotten worse, but the error rate is a flat 0%. The most
    likely explanation is:
  options: [A slow memory leak in the search index process is gradually corrupting stored postings, A
      silent fallback (e.g. to popularity ranking) is masking an outage of the ranking service — success
      stays 100% while answer quality collapses, The load balancer is silently dropping roughly 40% of
      incoming search requests, DNS resolution for the ranking service is intermittently timing out under
      load]
  answer: 1
  explanation: |
    This is the classic silent-quality-loss risk: a fallback keeps the success rate at
    100% while the answer quality silently degrades. It looks healthy on an error-rate
    dashboard but is quietly wrong.
  ref: concepts.md#the-risks-of-fallbacks
- id: graceful-degradation-and-fallbacks-011
  difficulty: intermediate
  tags: [fallback-risk, monitoring, observability]
  question: |
    What single metric most directly protects you against a fallback silently masking an
    ongoing dependency outage?
  options: [End-user HTTP error rate measured at the edge load balancer, CPU utilization averaged across
      the whole app tier fleet, The fallback activation rate (how often the fallback fires), Total requests
      per second arriving at the service front door]
  answer: 2
  explanation: |
    Because fallbacks keep user-facing errors near zero, you must treat fallback
    activation as a first-class metric. A fallback rate jumping from 0.1% to 40% is an
    incident even when the error rate is still zero.
  ref: concepts.md#the-risks-of-fallbacks
- id: graceful-degradation-and-fallbacks-012
  difficulty: advanced
  tags: [fallback-risk, load-amplification, thundering-herd]
  question: |
    A cache-miss fallback is defined as "on miss, call the origin service." During an
    origin slowdown, why can this make the incident worse?
  options: ['It amplifies load — the fallback itself calls the already-struggling origin, and a fleet-wide
      fallback becomes a thundering herd', It returns stale data that users dislike and quietly erodes
      the freshness guarantee, It violates fail-closed semantics and lets unauthorized reads slip through,
    It unexpectedly increases the cache hit ratio and skews the capacity model]
  answer: 0
  explanation: |
    A fallback that itself makes a call can increase load on the struggling system,
    turning a partial failure into a full one (a retry-storm variant). A fleet falling
    back to a shared origin at once is a thundering herd it wasn't sized for.
  ref: concepts.md#the-risks-of-fallbacks
- id: graceful-degradation-and-fallbacks-013
  difficulty: advanced
  tags: [fallback-risk, testing, chaos]
  question: |
    Why are fallbacks described as "effectively broken until proven otherwise," and what
    practice addresses this?
  options: [They are usually written in a different language than the primary path; rewrite them to match,
    'They are cold, rarely-exercised code paths prone to latent bugs, stale credentials, and stale data;
      exercise them with chaos/fault injection', They consume far too much heap memory when triggered;
      profile and tune them, They are always measurably slower than the primary; benchmark and optimize
      them]
  answer: 1
  explanation: |
    Fallbacks are cold code paths that rarely run in normal operation, so they
    accumulate latent bugs, expired credentials, and unmaintained data. Chaos
    engineering / fault injection deliberately exercises them so they work when needed.
  ref: concepts.md#the-risks-of-fallbacks
- id: graceful-degradation-and-fallbacks-014
  difficulty: intermediate
  tags: [static-stability, aws, definition]
  question: |
    What does static stability (AWS Well-Architected) mean?
  options: [Keeping all shared data structures immutable so concurrent threads never hit a race condition,
    Serving only pre-rendered static HTML pages from a CDN so nothing is computed at request time, Pinning
      every software version so deployments never change runtime behavior across the fleet, A system keeps
      operating on its last-known-good state without needing the failed dependency (or the control plane)
      to be available]
  answer: 3
  explanation: |
    Static stability means the system's steady-state behavior does not depend on making
    new calls to the thing that just failed. It keeps serving on last-known-good state —
    e.g. serving reads from cache even if the database is down.
  ref: concepts.md#static-stability-aws
- id: graceful-degradation-and-fallbacks-015
  difficulty: advanced
  tags: [static-stability, control-plane, data-plane]
  question: |
    AWS recommends NOT relying on auto-scaling to add capacity during an availability-zone
    failure. What is the static-stability reasoning?
  options: [Scaling is a control-plane action that may itself be impaired during the event; pre-provision
      enough capacity so recovery doesn't depend on the control plane, 'Auto-scaling is far too slow to
      be useful under any circumstances, so it should never be relied on', Auto-scaling always launches
      the replacement instances back into the very AZ that just failed, Newly launched on-demand instances
      cost noticeably more per hour than reserved instances]
  answer: 0
  explanation: |
    Control planes (which change configuration — launch instances) are more
    failure-prone than data planes. A statically stable design pre-provisions failover
    capacity so it can keep serving without a control-plane action that may be exactly
    what's degraded during the event.
  ref: concepts.md#static-stability-aws
- id: graceful-degradation-and-fallbacks-016
  difficulty: advanced
  tags: [static-stability, control-plane, data-plane]
  question: |
    In the data-plane vs control-plane distinction that underpins static stability, which
    statement is correct?
  options: [Control planes serve traffic using existing config while data planes are the ones that change
      configuration on demand, 'Both planes are engineered to be equally reliable, so the distinction between
      them is purely cosmetic', Data planes use existing config to serve traffic and are simpler/more available;
      control planes change config and are more failure-prone, The data plane is essentially always the
      bottleneck that saturates first during any large-scale outage]
  answer: 2
  explanation: |
    Data planes use existing state to serve traffic (simpler, more available); control
    planes change configuration (complex, more failure-prone). Static stability keeps the
    data plane working using existing state even when the control plane is unavailable.
  ref: concepts.md#static-stability-aws
- id: graceful-degradation-and-fallbacks-017
  difficulty: advanced
  tags: [static-stability, cost, tradeoff]
  question: |
    What is the primary trade-off of a statically stable multi-AZ failover design that
    keeps ~2x capacity warm?
  options: ['Lower request latency, at the cost of weaker consistency guarantees between the two zones',
    It eliminates the need for any health monitoring because the warm capacity is inherently self-healing,
    'Higher cost, in exchange for removing the control plane from the critical recovery path', It forces
      you to adopt eventual consistency across regions to keep the warm capacity in sync]
  answer: 2
  explanation: |
    Pre-provisioning surviving-AZ capacity is more expensive, but it means failover never
    needs to call the (possibly-impaired) control plane to scale up mid-incident. You pay
    for warm capacity to buy independence from recovery-time actions.
  ref: concepts.md#static-stability-aws
- id: graceful-degradation-and-fallbacks-018
  difficulty: beginner
  tags: [fail-open, fail-closed, definition]
  question: |
    "Fail-closed" behavior on a dependency failure means:
  options: [Deny / block the operation, Allow the operation to proceed as if the check passed, Retry the
      operation until it succeeds, Cache the last successful result and return it]
  answer: 0
  explanation: |
    Fail-closed denies/blocks on failure (maximizes safety and correctness). Fail-open
    allows the operation to continue (maximizes availability). The names describe the
    default behavior when the check can't be completed.
  ref: concepts.md#fail-open-vs-fail-closed
- id: graceful-degradation-and-fallbacks-019
  difficulty: intermediate
  tags: [fail-closed, auth, security]
  question: |
    The authorization service becomes unreachable. Which fail direction is correct and
    why?
  options: ['Fail-open, since availability is the priority and a blocked login hurts more than a wrong allow', 'Fail-open, since auth checks are non-critical enrichment you can skip when the service is down', 'It does not matter which way you fail as long as you log it and retry the auth call later', 'Fail-closed, because allowing access on failure is a security breach while a blocked user is recoverable']
  answer: 3
  explanation: |
    Security/authz should fail closed: a wrong "allow" is an irreversible breach, whereas
    a blocked legitimate user is a recoverable inconvenience. Never degrade a security
    guarantee for availability.
  ref: concepts.md#fail-open-vs-fail-closed
- id: graceful-degradation-and-fallbacks-020
  difficulty: advanced
  tags: [fail-open, rate-limiter, tradeoff]
  question: |
    The backing store for a rate limiter goes down. Why is this fail-direction decision
    genuinely contested, and what is a common middle-ground?
  options: ['It is not genuinely contested — the answer is always to fail-closed, because exposing the backend to unlimited unmetered traffic is strictly worse than blocking every caller', 'Fail-open risks flooding a fragile backend, fail-closed risks a total outage from the limiter being down; a middle ground is local fail-open with a conservative static local limit', 'It is not genuinely contested — the answer is always to fail-open with no limit at all, because added request latency for real users outweighs any risk of overloading the backend', 'Rate limiters are designed to be fully stateless and never depend on a backing store, so this particular failure mode simply cannot arise in any correctly implemented design']
  answer: 1
  explanation: |
    Fail-open on a limiter risks a flood hitting an already-fragile backend; fail-closed
    risks blocking all traffic because the limiter (not the app) is down. A common
    compromise is a conservative local static limit so you neither block everyone nor go
    fully unlimited. (See security and design-rate-limiter.)
  ref: concepts.md#fail-open-vs-fail-closed
- id: graceful-degradation-and-fallbacks-021
  difficulty: intermediate
  tags: [fail-open, enrichment, degradation]
  question: |
    A geo-IP enrichment call (used only to pre-fill a country dropdown) times out. Which
    fail direction fits, and why?
  options: ['Fail-open: it''s a non-critical enrichment, so degrade gracefully rather than error the request', 'Fail-closed: block the whole request until the enrichment call finally succeeds or the user retries', 'Fail-closed: any dependency timeout signals a potential security risk and must halt the request', 'Retry the enrichment call synchronously in a tight loop until it eventually returns a country value']
  answer: 0
  explanation: |
    Non-critical, presentation, and enrichment paths should fail open — degrade the
    feature (skip the pre-fill) rather than error a request over an optional nicety. The
    principle: degrade functionality freely, never a security/correctness guarantee.
  ref: concepts.md#fail-open-vs-fail-closed
- id: graceful-degradation-and-fallbacks-022
  difficulty: intermediate
  tags: [fail-open, fail-closed, terminology]
  question: |
    Why do experienced engineers describe the behavior ("allow on failure" vs "deny on
    failure") instead of only using the labels "fail-safe" / "fail-secure"?
  options: ['Because the terms "fail-safe" and "fail-secure" are trademarked and cannot be used in engineering docs', 'Because "fail-safe" and "fail-secure" are defined only for physical hardware and have no software meaning', 'Because those terms are overloaded and mean opposite things across domains (e.g. physical door locks vs software auth)', 'Because fail-open is universally the safe default, so the labels add nothing beyond stating the behavior']
  answer: 2
  explanation: |
    "Fail-safe" and "fail-secure" are overloaded and can mean opposite things in
    different fields, so stating the behavior — allow vs deny on failure — removes
    ambiguity.
  ref: concepts.md#fail-open-vs-fail-closed
- id: graceful-degradation-and-fallbacks-023
  difficulty: advanced
  tags: [fail-open, life-safety]
  question: |
    A building's electronically controlled egress door loses power. For life-safety, what
    is the correct fail direction, and how does it contrast with a firewall?
  options: ['Fail-closed (locked) so intruders cannot enter, exactly the same direction a firewall fails', 'Fail-open (unlocked) so people can exit — the opposite of a firewall, which fails closed to avoid exposing everything', 'Fail-open (unlocked), and a firewall should also fail open so traffic keeps flowing during a fault', 'It should freeze and hold its last commanded lock state indefinitely until power is manually restored']
  answer: 1
  explanation: |
    Life-safety egress fails open (unlocks) so people can exit during a power failure —
    safety wins over security. A firewall fails closed, because a firewall that fails
    open exposes everything. The right direction depends on the cost of each wrong default.
  ref: concepts.md#fail-open-vs-fail-closed
- id: graceful-degradation-and-fallbacks-024
  difficulty: intermediate
  tags: [fail-open, fail-closed, principle]
  question: |
    What is the underlying principle that decides fail-open vs fail-closed?
  options: ['Always minimize request latency, choosing whichever direction returns to the caller fastest', 'Always maximize availability regardless of consequences to safety, money, or correctness', 'Choose whichever direction is easier to implement and less code to maintain in the client', 'Weigh the cost of a false allow against the cost of a false deny']
  answer: 3
  explanation: |
    The choice is a risk trade-off between the cost of a false allow and the cost of a
    false deny. Security/money/state-safety fail closed (a wrong "yes" is catastrophic);
    non-critical/presentation paths fail open (a wrong "block" needlessly hurts uptime).
  ref: concepts.md#fail-open-vs-fail-closed
- id: graceful-degradation-and-fallbacks-025
  difficulty: intermediate
  tags: [brownout, definition, load]
  question: |
    A "brownout" in a service (borrowing the electrical-grid term) refers to:
  options: ['A complete, unplanned loss of electrical power to the entire data center and all of its racks', 'A rolling restart of every instance in the fleet, one at a time, to pick up a config change', 'A DNS misconfiguration that accidentally takes one whole region offline for a period of time', 'Intentional, graduated degradation triggered by load — shedding optional work to protect the core as demand rises']
  answer: 3
  explanation: |
    A brownout is graduated degradation keyed to load (not to a dependency being down) —
    a dimmer switch, not an on/off switch. As load/latency rises, the system progressively
    disables optional features in criticality order.
  ref: concepts.md#load-based-degradation-and-brownout
- id: graceful-degradation-and-fallbacks-026
  difficulty: advanced
  tags: [brownout, load-shedding, comparison]
  question: |
    How do brownout and load shedding differ?
  options: ['They are identical techniques with two names, differing only in which team happens to use them', 'Load shedding rejects whole requests to cap total work; brownout makes each accepted request cheaper by dropping optional parts', 'Brownout rejects whole requests to cap work; load shedding makes each accepted request cheaper instead', 'Load shedding applies only to write traffic while brownout applies only to read traffic in a service']
  answer: 1
  explanation: |
    Shedding rejects whole requests (429/503) to cap total work; brownout serves accepted
    requests in a reduced mode (drop personalization, serve cached). They're complementary
    — a good design sheds the lowest-value requests AND serves survivors in degraded mode.
  ref: concepts.md#load-based-degradation-and-brownout
- id: graceful-degradation-and-fallbacks-027
  difficulty: advanced
  tags: [brownout, hysteresis, flapping]
  question: |
    Why should a brownout controller use separate enter/exit thresholds (or a cooldown)
    between "full" and "degraded" modes?
  options: ['To reduce the memory footprint of the controller by storing only one threshold value in RAM', 'To guarantee exactly-once request handling as the service transitions between full and degraded modes', 'To provide hysteresis so the system doesn''t oscillate (flap) between modes as load hovers near the boundary', 'To make the thresholds easier for operators to configure by giving them two numbers instead of one']
  answer: 2
  explanation: |
    Hysteresis (distinct enter/exit thresholds or a cooldown) prevents flapping — rapid
    oscillation between full and degraded modes when load sits right at the threshold,
    which would itself be destabilizing.
  ref: concepts.md#load-based-degradation-and-brownout
- id: graceful-degradation-and-fallbacks-028
  difficulty: advanced
  tags: [brownout, read-only-mode, database]
  question: |
    Which brownout lever most directly protects a strained primary database while keeping
    the site usable?
  options: ['Switch to read-only mode: reject writes, keep serving reads', 'Increase served image resolution so pages need fewer round trips to the strained primary', 'Disable the caching layer entirely to guarantee every read returns the freshest data', 'Enable ML-based personalization on every request to spread load evenly across the database']
  answer: 0
  explanation: |
    Read-only mode rejects writes (the load that most stresses a primary) while continuing
    to serve reads, keeping the site usable during a database strain. Disabling the cache
    or enabling personalization would increase load, not reduce it.
  ref: concepts.md#load-based-degradation-and-brownout
- id: graceful-degradation-and-fallbacks-029
  difficulty: expert
  tags: [brownout, load-shedding, overload-response]
  question: |
    Your service is overloaded and p99 latency is spiking. What is the strongest combined
    response?
  options: ['Add more servers and simply wait for the new capacity to absorb the spike — nothing else is needed', 'Shed the lowest-priority incoming requests AND brownout survivors (drop optional features, go read-only)', 'Increase every timeout across the service so the slow in-flight calls are given time to finish', 'Retry every failed request aggressively with no backoff so the queued work is pushed through faster']
  answer: 1
  explanation: |
    Combine both mechanisms: shed the lowest-value requests to cap work and brownout the
    accepted ones to make each cheaper. Adding servers may be a slow/unavailable
    control-plane action mid-incident; raising timeouts and aggressive retries make
    overload worse.
  ref: concepts.md#load-based-degradation-and-brownout
- id: graceful-degradation-and-fallbacks-030
  difficulty: intermediate
  tags: [criticality-tiers, design]
  question: |
    Why is classifying features into criticality tiers (critical / important / optional) a
    prerequisite for graceful degradation?
  options: ['It reduces the number of microservices you need to deploy by merging optional features into one', 'It automatically generates the circuit breakers and timeouts for each classified dependency', 'It is a hard requirement for horizontal scaling, since tiers determine how replicas are sharded', 'Degradation only works if you''ve decided in advance what is core and what is optional, so you know what to keep versus shed']
  answer: 3
  explanation: |
    You can only degrade gracefully if you know which features are core (keep at all
    costs) and which are optional (shed first). The tiering drives the fallback/hide
    policy attached to each dependency.
  ref: concepts.md#designing-for-degradation-criticality-tiers
- id: graceful-degradation-and-fallbacks-031
  difficulty: advanced
  tags: [criticality-tiers, timeouts]
  question: |
    What timeout policy fits an optional (T3) widget like "recommendations" on a page?
  options: ['A tight timeout (e.g. 100-200 ms) so it gives up fast rather than dragging the whole page''s latency', 'A generous timeout equal to the page''s total budget so it has the best chance to load', 'No timeout at all, relying entirely on the circuit breaker to eventually cut off the slow call', 'The same timeout as the critical checkout call, so all page dependencies are treated uniformly']
  answer: 0
  explanation: |
    Less-critical calls should have tighter timeouts so an optional widget gives up fast
    instead of adding latency to the whole page. A generous or absent timeout lets an
    optional feature drag down the core experience.
  ref: concepts.md#designing-for-degradation-criticality-tiers
- id: graceful-degradation-and-fallbacks-032
  difficulty: advanced
  tags: [criticality-tiers, bulkhead, isolation]
  question: |
    Why give an optional (T3) dependency its own thread pool / bulkhead separate from the
    critical path?
  options: ['To increase the overall throughput of the T3 call by giving it a larger dedicated pool of threads', 'Because optional T3 calls require a different network protocol than the critical path uses', 'So a slow T3 call can''t exhaust the resources needed for critical (T1) work', 'To make optional T3 calls complete faster than the critical T1 calls that share the request']
  answer: 2
  explanation: |
    A bulkhead isolates the optional dependency's resources so its slowness can consume
    only its own pool, never the threads/connections that critical work needs. This is
    what lets the core survive when an optional dependency hangs.
  ref: concepts.md#designing-for-degradation-criticality-tiers
- id: graceful-degradation-and-fallbacks-033
  difficulty: intermediate
  tags: [criticality-tiers, slo]
  question: |
    How should SLOs relate to criticality tiers for degradation?
  options: ['Every feature, critical or optional, must be held to the same strict uniform SLO across the service', 'Optional features should carry the strictest SLOs of all so their degradation is caught the earliest', 'Define SLOs on the core experience; optional features can have looser or no SLOs, keeping the error budget focused on what matters', 'SLOs are entirely unrelated to degradation design and should be set independently of tiers']
  answer: 2
  explanation: |
    Anchor SLOs to the core experience so the error budget reflects what users truly
    need; optional features get looser/no SLOs. (SLO alerting mechanics live in
    observability; the concept ties back to slos-error-budgets-and-velocity-tradeoff.)
  ref: concepts.md#designing-for-degradation-criticality-tiers
- id: graceful-degradation-and-fallbacks-034
  difficulty: expert
  tags: [criticality-tiers, critical-dependency]
  question: |
    A checkout request cannot succeed without the authorization service (a T1/critical
    dependency). When authorization is unavailable, the correct behavior is to:
  options: ['Fail the request with a typed error and page on-call — you cannot degrade a request that is meaningless without this dependency', 'Return a fabricated success to the user now and reconcile the real authorization decision later', 'Silently hide the checkout button so the user never notices the authorization service is down', 'Serve a cached authorization decision captured about an hour ago and treat it as still valid']
  answer: 0
  explanation: |
    A critical dependency has no meaningful degraded mode: return a controlled typed
    error and alert. You degrade optional features; you do not fabricate success or reuse
    stale security decisions for a correctness/security-critical path.
  ref: concepts.md#designing-for-degradation-criticality-tiers
- id: graceful-degradation-and-fallbacks-035
  difficulty: intermediate
  tags: [circuit-breaker, fallback, integration]
  question: |
    How do circuit breakers and fallbacks divide responsibility?
  options: ['They are the same pattern under two different names, so choosing between them is only a style preference', 'The fallback opens and closes the circuit while the breaker supplies the alternative value to return', 'Circuit breakers apply only to write paths while fallbacks apply only to read paths in a service', 'The circuit breaker decides whether to call the failing dependency; the fallback decides what to return when the call is skipped or fails']
  answer: 3
  explanation: |
    The circuit breaker governs whether the call happens (open = skip the failing
    dependency); the fallback provides the alternative result when the call is skipped or
    fails. In Resilience4j, an open breaker throws CallNotPermittedException, which the
    fallback recovers.
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-036
  difficulty: intermediate
  tags: [static-stability, cache, read-path]
  question: |
    Serving reads from a cache holding last-known-good data while the database is down is
    an example of:
  options: ['A retry with exponential backoff and jitter that keeps re-attempting the failed database call', 'Static stability — steady-state serving that doesn''t depend on the failed component', 'A blue-green deployment that shifts read traffic to a freshly promoted standby database', 'A leader-election protocol that promotes a replica to primary when the database goes down']
  answer: 1
  explanation: |
    This is the canonical static-stability example: the cache holds last-known-good state
    so the system keeps answering read traffic through a DB outage rather than erroring.
    It's a deliberate posture, not just an incidental fallback.
  ref: concepts.md#static-stability-aws
- id: graceful-degradation-and-fallbacks-037
  difficulty: advanced
  tags: [fallback-risk, staleness, monitoring]
  question: |
    Besides fallback rate, which additional metric best reveals that a "serve stale
    cache" fallback is hiding a long-running outage?
  options: [The staleness age of served data (how old the last-known-good value is), The average object
      size stored in the cache measured in kilobytes per entry, The number of cache keys evicted per second
      under sustained memory pressure, The TCP retransmission rate on connections to the origin server]
  answer: 0
  explanation: |
    A staleness-age metric shows the served data getting progressively older during an
    outage. Combined with the fallback rate, it exposes an outage the error rate would
    otherwise mask.
  ref: concepts.md#the-risks-of-fallbacks
- id: graceful-degradation-and-fallbacks-038
  difficulty: beginner
  tags: [degradation, examples]
  question: |
    Which of the following is a graceful-degradation behavior rather than a full outage?
  options: [Returning an HTTP 500 error for every incoming request whenever a single downstream dependency
      is running slow, Crashing the whole process on the first error so a supervisor restarts it and clears
      the bad state, Showing a generic non-personalized homepage when the personalization service
      is unavailable, Blocking all incoming traffic at the front door until every downstream dependency
      reports fully healthy]
  answer: 2
  explanation: |
    Substituting a cheaper computation (generic homepage instead of personalized) is a
    degradation lever that keeps the core working. The other options are full failures or
    hard blocks.
  ref: concepts.md#graceful-degradation
- id: graceful-degradation-and-fallbacks-039
  difficulty: advanced
  tags: [fallback-chain, ordering]
  question: |
    In a well-ordered fallback chain for a read, the sequence from first attempt to last
    resort should generally be:
  options: ['Static default first (so it is instant), then the cache, then the live primary as a last resort',
    'Live primary, then cache (stale), then static
      default (no I/O)', 'Cache first, then the static default, then finally the live primary once the others miss',
    'Static default only, on every read, to guarantee the fastest possible constant response time']
  answer: 1
  explanation: |
    Try the highest-quality source first (live primary), then a lower-quality but
    available source (cache/stale), then the guaranteed terminal default that needs no
    I/O. The chain degrades quality gracefully while ensuring something always returns.
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-040
  difficulty: intermediate
  tags: [brownout, observability, control]
  question: |
    What operational property should a brownout mechanism have?
  options: [It should be invisible to operators so that nobody can accidentally tamper with the active
      degradation level during an incident, It should only be changeable via a full redeploy so every level
      change is captured in the deployment audit trail, It should trigger at random intervals so the degraded
      path is continuously exercised for resilience, 'It should be observable (operators
      see which level is active) and reversible (they can force or clear it), typically via feature flags']
  answer: 3
  explanation: |
    Operators need visibility into the active brownout level and the ability to force or
    clear degraded modes — feature flags are the usual control surface (flag/deploy
    tooling lives in devops-cicd).
  ref: concepts.md#load-based-degradation-and-brownout
- id: graceful-degradation-and-fallbacks-041
  difficulty: advanced
  tags: [fail-closed, feature-flags]
  question: |
    The feature-flag service is unreachable at startup. What is the safest degradation
    behavior for flag evaluation?
  options: [Enable every flag by default so that no in-flight feature is accidentally left disabled while
      the flag service recovers, Block application startup entirely until the flag service comes back and
      returns a complete ruleset, Randomize each flag value on boot to sample which configuration performs
      best under the current load, Fail to last-known / safe defaults — serve cached
      flags and default new or risky features off]
  answer: 3
  explanation: |
    Serve cached (last-known) flag values and default new/risky features to off — a safe
    default. Enabling everything could switch on untested or risky features exactly when
    you can't control them; blocking startup turns a soft failure into a hard one.
  ref: concepts.md#fail-open-vs-fail-closed
- id: graceful-degradation-and-fallbacks-042
  difficulty: advanced
  tags: [fallback-risk, incident-masking]
  question: |
    Which scenario is the clearest example of a fallback making an incident worse or
    longer, rather than better?
  options: [A fallback returns a static default in about 1 ms and emits a metric that immediately fires
      a paging alert to on-call, A fallback
      masks a dependency outage for hours by serving ever-staler data while dashboards look normal, A
      fallback switches to a fully independent secondary provider that is monitored and alarmed on activation,
    A fallback hides an optional widget and increments a counter that operators watch on a dashboard]
  answer: 1
  explanation: |
    The dangerous case is a fallback that masks an outage: user-facing metrics look
    normal, so no one investigates while the dependency stays down and served data grows
    staler. The other options include the mitigations (alerting, independence, counters).
  ref: concepts.md#the-risks-of-fallbacks
- id: graceful-degradation-and-fallbacks-043
  difficulty: intermediate
  tags: [degradation, correctness, boundaries]
  question: |
    For which kind of path is graceful degradation generally SAFE, versus dangerous?
  options: ['Safe for state-changing payment paths but dangerous for presentation, since money flows tolerate
      a skipped step better than a hidden widget does', 'Safe for both presentation and correctness-critical
      paths equally, because degradation never alters the semantics of a request', Safe for presentation
      (e.g. hide a widget); dangerous for correctness-critical paths (e.g. skipping
      a fraud check), 'Dangerous for both presentation and correctness paths equally, so graceful degradation
      should never be used in a production system']
  answer: 2
  explanation: |
    Degrading is safe for presentation (hide a widget, drop a field) but dangerous for
    correctness/security-critical paths — you must never "degrade" a payment by skipping
    the fraud check. Match the degradation to the criticality tier.
  ref: concepts.md#graceful-degradation
- id: graceful-degradation-and-fallbacks-044
  difficulty: expert
  tags: [static-stability, dynamic-stability, tradeoff]
  question: |
    A "dynamically stable" design (scale on demand during failures) is cheaper than a
    statically stable one. What is the core bet it makes that often fails?
  options: [That the control plane and spare capacity are available exactly when the system is already
      unhealthy, That the network will somehow be faster and less congested during an active incident than
      in steady state, That end users will happily tolerate substantially higher latency for the duration
      of the failure, That the cache will always remain fully warm and pre-populated straight through the outage]
  answer: 0
  explanation: |
    Dynamic stability bets that scaling (a control-plane action) and capacity are
    available precisely during an event — often a bad bet, since the control plane may be
    exactly what's impaired. Static stability removes that dependency by pre-provisioning.
  ref: concepts.md#static-stability-aws
- id: graceful-degradation-and-fallbacks-045
  difficulty: advanced
  tags: [fallback, secondary-provider, correlated-failure]
  question: |
    You add a secondary payment gateway as a fallback for the primary. Which design choice
    most improves the fallback's real-world value?
  options: [Route the secondary through the same VPC endpoint and auth service as the primary for consistency,
    'Ensure the secondary is genuinely independent (separate provider, network path, and credentials)
      so it survives a primary-side correlated failure', Make the secondary share the primary's connection
      pool and thread pool so the two gateways use resources efficiently, Only enable the secondary during
      scheduled maintenance windows so it never competes with the primary for live traffic]
  answer: 1
  explanation: |
    A fallback provides protection only if it's independent of the primary. Sharing
    network paths, auth, or pools reintroduces correlated failure. Independence is what
    lets the secondary survive when the primary's stack is impaired.
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-046
  difficulty: intermediate
  tags: [degradation, fallback, distinction]
  question: |
    How should you distinguish "graceful degradation" from "a fallback" in an interview?
  options: [They are fully interchangeable terms that senior engineers use to mean exactly the same thing,
    A fallback is the overarching system-level strategy while degradation is just a single line of error-handling
      code, Degradation applies only to physical hardware failures while fallbacks apply only to software
      call failures, Degradation is the system-level
      strategy (reduced functionality vs outage); a fallback is a specific mechanism (an alternative value)
      used to implement it]
  answer: 3
  explanation: |
    Degradation is the overall strategy of reduced-but-useful function; a fallback is one
    mechanism (alternative value on failure) used — alongside feature hiding and brownout
    — to achieve it.
  ref: concepts.md#graceful-degradation
- id: graceful-degradation-and-fallbacks-047
  difficulty: expert
  tags: [brownout, prioritization, criticality]
  question: |
    When applying a brownout, in what order should work be shed?
  options: ['Least valuable work first, protecting revenue/safety-critical paths last', 'In a randomized
      order, so that the impact of shedding is distributed fairly across all features', 'Most valuable work
      first, since the revenue-critical paths are the most expensive to keep running',
    'Alphabetically by feature name, so the shedding order is deterministic and easy to reason about']
  answer: 0
  explanation: |
    Brownout prioritizes by criticality: shed the least valuable work first and protect
    the revenue/safety-critical paths until last. Random or reverse-priority shedding
    would sacrifice exactly what you're trying to protect.
  ref: concepts.md#load-based-degradation-and-brownout
- id: graceful-degradation-and-fallbacks-048
  difficulty: advanced
  tags: [degradation, testing, chaos, drills]
  question: |
    What practice best ensures a degraded mode actually works before a real incident forces
    it?
  options: [Reading through the degraded-mode code carefully line by line during the design review meeting,
    Increasing unit-test coverage of the happy path until every primary-path branch is exercised, Feature
      flags to force each degraded mode plus chaos experiments that kill T2/T3 dependencies
      in production to prove the core survives, Adding more retries with backoff around the primary path
      so it is far less likely to ever fail]
  answer: 2
  explanation: |
    Degraded modes are cold paths; you prove them by forcing each mode (flags) and by
    chaos experiments that kill important/optional dependencies in production, verifying
    the core survives. Reading code or happy-path tests won't exercise the failure paths.
  ref: concepts.md#designing-for-degradation-criticality-tiers
- id: graceful-degradation-and-fallbacks-049
  difficulty: intermediate
  tags: [fallback, static-default, quality]
  question: |
    Ordering common fallback sources from highest to lowest typical quality, which ordering
    is correct?
  options: ['Static default, cache, secondary provider', 'Local cache, secondary provider, controlled
      error', 'Secondary provider, local cache, static default', 'Controlled error, static default, cache']
  answer: 2
  explanation: |
    Roughly best-to-worst: an independent secondary provider (full quality), then a local
    cache (stale), then a static default (generic). A controlled error (no data) is the
    floor when a wrong answer is worse than none.
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-050
  difficulty: advanced
  tags: [fallback, fail-vs-fallback, correctness]
  question: |
    When is returning a controlled error ("fail") the RIGHT choice over returning a
    substituted fallback value?
  options: ['When a wrong or stale answer is worse than no answer (e.g. showing an incorrect account balance),
      so failing cleanly is safer', Never — a substituted fallback value is always strictly preferable to
      surfacing an error to the caller under any circumstance, 'Only when the primary is slow but still
      healthy, so that failing fast frees up the blocked request thread', 'Only for optional presentation
      widgets, where a missing value has no real user-facing consequence']
  answer: 0
  explanation: |
    A controlled error is correct when a fabricated or stale value would be actively
    harmful — e.g. a wrong bank balance or a stale security decision. Sometimes the safest
    degradation is a clean, typed failure the caller can handle, not a guessed value.
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-051
  difficulty: expert
  tags: [constant-work, bimodal, anti-pattern]
  question: |
    A service is fast and cheap at 1x load but slow and resource-hungry at 2x, and it
    tends to collapse during incidents. Which structural property best names what is
    missing, and what fixes it?
  options: ['It exhibits bimodal behavior (a second, costlier mode that only appears under stress); constant
      work or static stability eliminate the second mode', It has a slow memory leak that only manifests
      under load; provision the fleet with more RAM per host, It lacks
      horizontal scaling; add autoscaling triggered automatically once load crosses the 1.5x mark, It performs
      too few retries under stress; retry failed downstream calls more aggressively to push the work through]
  answer: 0
  explanation: |
    A system with a distinct, more-expensive failure mode is bimodal — and that mode
    appears precisely during incidents when it is least trusted. Constant work and static
    stability remove the second mode rather than trying to make it faster. Autoscaling and
    aggressive retries can make the stressed mode worse.
  ref: concepts.md#constant-work-and-bimodal-behavior
- id: graceful-degradation-and-fallbacks-052
  difficulty: expert
  tags: [constant-work, route53, control-plane]
  question: |
    Amazon Route 53 health checking pushes its entire fixed-size health table to the data
    plane on a fixed cadence regardless of how many checks changed. What failure mode does
    this "constant work" design specifically prevent?
  options: [It prevents DNS records from ever becoming stale by refreshing every entry on a fixed cadence,
    It prevents a control-plane load spike during
      a mass-failure event, because the work done is identical whether 0 or 10000 checks flip, It eliminates
      the need for periodic health checks entirely by keeping the full table permanently in memory, It guarantees
      strong read-after-write consistency across every recursive resolver worldwide]
  answer: 1
  explanation: |
    A delta-based push is cheap normally but generates a work avalanche exactly when many
    checks flip at once — bimodal. Pushing the full fixed-size table every cycle means a
    mass-failure event creates no extra work, so there is no control-plane thundering herd
    at the worst possible moment.
  ref: concepts.md#constant-work-and-bimodal-behavior
- id: graceful-degradation-and-fallbacks-053
  difficulty: advanced
  tags: [constant-work, tradeoff]
  question: |
    What is the fundamental trade-off the constant-work pattern accepts?
  options: [It deliberately sacrifices correctness in order to buy higher availability during large-scale
      failures, It forces the whole system to relax to eventual consistency because every entry is reprocessed
      each cycle, It pays a higher
      steady-state cost (always doing worst-case work) in exchange for eliminating a failure mode and its
      cold code path, It only works for purely read-only systems and cannot be applied to any write path]
  answer: 2
  explanation: |
    Constant work means the worst case is the normal case: you continuously pay the
    worst-case cost, so there is no mode-switch to get wrong, no cold path, and no
    recompute-everything stampede. The price is higher steady-state resource cost.
  ref: concepts.md#constant-work-and-bimodal-behavior
- id: graceful-degradation-and-fallbacks-054
  difficulty: expert
  tags: [avoid-fallback, contrarian, reconciliation]
  question: |
    An interviewer says: "AWS's Builders' Library tells you to avoid fallback, but you just
    designed a fallback chain — reconcile that." What is the strongest reconciliation?
  options: ['Fallbacks are always wrong in distributed systems, so remove the entire chain and simply return
      a typed error whenever the primary fails', 'AWS is mistaken on this point; a fallback of any kind is
      strictly better than failing, so the article can safely be ignored', 'The Builders'' Library guidance
      applies only to databases and not to CDN or in-memory caches, so a cache chain is exempt', 'Prefer
      designs that don''t need fallback (improve the primary, fail fast, move risk off the critical path);
      if a fallback is unavoidable, make it hot, tested, and independent so it isn''t a cold untested path']
  answer: 3
  explanation: |
    Gabrielson's point is that fallbacks are cold, rarely-exercised paths that often fail
    when finally needed. The reconciliation is not "never fallback" but "prefer not needing
    one; if you must, keep it hot (exercised in steady state), tested (chaos), and
    independent" — which is exactly what the cache floor in the chain satisfies.
  ref: concepts.md#avoiding-fallback-the-contrarian-thesis
- id: graceful-degradation-and-fallbacks-055
  difficulty: advanced
  tags: [avoid-fallback, cold-path]
  question: |
    Per "Avoiding fallback in distributed systems," why do fallbacks so often fail exactly
    when they are finally invoked?
  options:
    - 'They are cold, rarely-exercised code paths that accumulate stale credentials, drifted schemas, untested capacity, and latent bugs — and only run under the worst conditions'
    - 'They are always written in a slower interpreted language than the primary path, so the added runtime overhead alone makes them miss the latency budget'
    - 'They consume far more heap memory than the primary path because the fallback library eagerly buffers the entire result set before returning'
    - 'They are legally required to be disabled during declared incidents under most cloud compliance frameworks, so they simply never execute'
  answer: 0
  explanation: |
    A fallback runs only after the primary has already failed — under chaotic conditions,
    and almost never in testing. So it drifts out of working order (credentials, schema,
    capacity) and is the least-trusted code precisely when you depend on it most.
  ref: concepts.md#avoiding-fallback-the-contrarian-thesis
- id: graceful-degradation-and-fallbacks-056
  difficulty: advanced
  tags: [avoid-fallback, alternatives, fail-fast]
  question: |
    Which of the following is NOT one of the recommended alternatives to building a
    fallback?
  options: [Improve the primary so it does not fail in the first place, Fail fast and let the caller (which
      has more context) decide, Push the risky work off the critical path via pre-compute or async, Add
      a second synchronous retry loop around the fallback so it tries harder]
  answer: 3
  explanation: |
    The recommended alternatives are: improve the primary, fail fast, move risk off the
    critical path, and exercise any unavoidable fallback in steady state so it is never
    cold. Wrapping a cold fallback in more retries just amplifies load and does not fix its
    untested nature.
  ref: concepts.md#avoiding-fallback-the-contrarian-thesis
- id: graceful-degradation-and-fallbacks-057
  difficulty: expert
  tags: [stale-if-error, http, cache-fallback]
  question: |
    A CDN should keep serving its last-known-good copy of a page when the origin returns
    5xx or is unreachable. Which HTTP Cache-Control directive expresses exactly this?
  options: ['stale-if-error', 'must-revalidate', 'no-store', 'private']
  answer: 0
  explanation: |
    stale-if-error (RFC 5861) licenses serving a stale cached response for a bounded window
    when the origin errors or is unreachable — cache-as-fallback as an HTTP directive.
    must-revalidate is the opposite; no-store and private are unrelated.
  ref: concepts.md#cache-as-fallback-http-staleness-semantics
- id: graceful-degradation-and-fallbacks-058
  difficulty: expert
  tags: [stale-while-revalidate, stale-if-error, distinction]
  question: |
    How do stale-while-revalidate and stale-if-error differ?
  options: ['stale-while-revalidate serves stale immediately and refreshes in the background (a latency
      optimization for expired-but-usable content); stale-if-error serves stale only when the origin errors
      (a failure fallback)', They are exact aliases for one behavior that every modern CDN collapses into
      a single directive at config-parse time, 'stale-while-revalidate applies only
      to POST responses while stale-if-error is restricted to GET responses by the caching spec', 'stale-if-error strictly forbids serving any stale content, whereas stale-while-revalidate mandates that stale content always be served first']
  answer: 0
  explanation: |
    stale-while-revalidate is about latency: serve the expired copy now, refresh async for
    next time. stale-if-error is about failure: serve stale only because the origin is
    erroring/unreachable. They compose in one Cache-Control header.
  ref: concepts.md#cache-as-fallback-http-staleness-semantics
- id: graceful-degradation-and-fallbacks-059
  difficulty: advanced
  tags: [must-revalidate, correctness, http]
  question: |
    For a correctness-critical resource where a stale answer is worse than an error, which
    Cache-Control directive is appropriate, and what is its consequence when the origin is
    unreachable?
  options: ['must-revalidate — it forbids serving stale and returns a 504 when the origin can''t be reached,
      removing serve-stale by design', 'stale-if-error — it keeps serving the last-known-good value and treats an unreachable origin as a signal to extend freshness',
    'max-age=0 — it disables caching entirely so there is nothing stale to serve', 'immutable — it pins
      the resource in every cache forever so the origin is never contacted again after the first fetch']
  answer: 0
  explanation: |
    must-revalidate forbids reuse of stale content once fresh lifetime expires; if the
    origin is unreachable it returns 504 rather than a stale body. That is exactly what you
    want when a wrong/old answer is more harmful than an error — but be aware it removes
    your serve-stale fallback.
  ref: concepts.md#cache-as-fallback-http-staleness-semantics
- id: graceful-degradation-and-fallbacks-060
  difficulty: expert
  tags: [negative-caching, miss-storm, ttl]
  question: |
    You add negative caching (caching 404/NXDOMAIN/empty results) to protect a struggling
    origin from a miss storm. What is the critical tuning consideration?
  options:
    - 'Make the negative TTL as long as the positive TTL so the origin stays shielded for hours during any incident'
    - 'Never cache negative results at all — buffering a 404 or NXDOMAIN always leaks stale data to the next requester'
    - 'Keep negative TTLs short, because a long negative TTL pins a transient failure and keeps serving it after the origin recovers'
    - 'Cache negative results only for authenticated users, since anonymous traffic is what drives the miss storm'
  answer: 2
  explanation: |
    Negative caching stops repeated misses/errors from hammering the origin, but a long
    negative TTL keeps serving "not found / error" long after recovery — pinning a
    transient failure. Short TTLs give the protection without prolonging the outage.
  ref: concepts.md#cache-as-fallback-http-staleness-semantics
- id: graceful-degradation-and-fallbacks-061
  difficulty: advanced
  tags: [feature-flags, kill-switch, distinction]
  question: |
    What best distinguishes a kill switch from a feature flag as degradation controls?
  options:
    - 'A kill switch requires a full redeploy to take effect while a feature flag is evaluated live, making it strictly slower to activate mid-incident'
    - 'They are identical controls that differ only in the name each engineering team gives the same underlying config toggle'
    - 'A feature flag can only ever turn a feature on and never off, so you always need a separate kill switch to disable anything'
    - 'A kill switch is a coarse instant off-switch for a whole feature/dependency flipped without a deploy; a feature flag is finer-grained and often gradual (percentage/segment)'
  answer: 3
  explanation: |
    A kill switch is the blunt, instant "turn this whole thing off now" control (no
    deploy); feature flags are finer-grained and can roll gradually by percentage or
    segment. Both are operator-facing degradation surfaces.
  ref: concepts.md#feature-flags-and-kill-switches-the-degradation-control-surface
- id: graceful-degradation-and-fallbacks-062
  difficulty: expert
  tags: [feature-flags, hot-path, dependency]
  question: |
    Why is it a resilience anti-pattern for flag evaluation to make a network call to the
    flag service on every request?
  options: ['It adds a new network dependency (and failure mode) to the critical path of every request
      — the opposite of resilience; flags should evaluate against a locally cached ruleset', It increases
      cloud egress costs so much that the per-request billing for the flag lookups dwarfs the compute cost
      of serving the actual request, It makes flag changes impossible to audit because per-request lookups
      are never written to the change-history log, Flag services are architecturally unable to serve GET
      lookups at production request scale and only support batched writes]
  answer: 0
  explanation: |
    Putting a per-request network call to the flag service on the hot path means the flag
    system's latency/outage now degrades every request. Evaluate locally against a cached
    ruleset so the flag system being down cannot take down your requests.
  ref: concepts.md#feature-flags-and-kill-switches-the-degradation-control-surface
- id: graceful-degradation-and-fallbacks-063
  difficulty: advanced
  tags: [feature-flags, safe-default, fail-safe]
  question: |
    When the feature-flag system is unreachable, which set of behaviors is safest?
  options:
    - 'Default all flags on so nothing is accidentally disabled, and re-fetch the ruleset each request'
    - 'Block all request processing entirely until a complete fresh ruleset can be fetched again'
    - 'Serve cached last-known-good flag values, default new/risky features off, and evaluate locally'
    - 'Randomize each flag value on evaluation to sample which configuration performs best under load'
  answer: 2
  explanation: |
    Flags must fail to a safe last-known-good default: use cached values, default
    new/risky features off (so a read failure can't switch on untested behavior), and keep
    evaluation local. Defaulting everything on or blocking startup turns a soft failure
    into a hard one.
  ref: concepts.md#feature-flags-and-kill-switches-the-degradation-control-surface
- id: graceful-degradation-and-fallbacks-064
  difficulty: expert
  tags: [criticality, google, taxonomy]
  question: |
    Google's SRE "Handling Overload" defines four criticality values. Which ordering, from
    most-protected to most-sheddable, is correct?
  options: ['CRITICAL_PLUS, CRITICAL, SHEDDABLE_PLUS, SHEDDABLE', 'SHEDDABLE, SHEDDABLE_PLUS, CRITICAL,
      CRITICAL_PLUS', 'CRITICAL, CRITICAL_PLUS, SHEDDABLE, SHEDDABLE_PLUS', 'PLUS_CRITICAL, CRITICAL, PLUS_SHEDDABLE,
      SHEDDABLE']
  answer: 0
  explanation: |
    From most-protected to most-sheddable: CRITICAL_PLUS, CRITICAL (default for prod
    request traffic), SHEDDABLE_PLUS (default for batch), SHEDDABLE. These map onto the
    T1/T2/T3 tiers used in this topic.
  ref: concepts.md#criticality-googles-model-and-propagation
- id: graceful-degradation-and-fallbacks-065
  difficulty: expert
  tags: [criticality, propagation, rpc-chain]
  question: |
    A CRITICAL_PLUS user request makes a 4-hop chain of RPCs. By default, what happens to
    criticality along the chain?
  options: [Each hop resets to the default CRITICAL value and must be explicitly re-tagged by hand at every
      RPC boundary or the priority is silently lost, Criticality applies only to the very first hop and is
      stripped from the request metadata before any downstream call is made, Criticality is randomly reassigned
      at each hop so that no single tier can monopolize the shared downstream capacity,
    'Criticality propagates automatically — downstream calls inherit the caller''s criticality, so load-shedding
      at hop 4 respects the priority set at hop 1']
  answer: 3
  explanation: |
    Criticality is carried with the request and inherited by downstream calls by default,
    so a CRITICAL_PLUS request keeps its protection all the way down. This is what makes
    criticality-based shedding coherent across a distributed call graph.
  ref: concepts.md#criticality-googles-model-and-propagation
- id: graceful-degradation-and-fallbacks-066
  difficulty: expert
  tags: [criticality, latency, orthogonality]
  question: |
    Search-as-you-type suggestions are highly sheddable (dropping a keystroke's suggestions
    is harmless) yet a 300 ms suggestion is useless. What principle does this illustrate?
  options:
    - 'Criticality and latency-sensitivity are orthogonal axes — a feature can be highly sheddable and highly latency-critical at the same time'
    - 'A feature safe to shed can by definition never have a tight latency requirement, so all sheddable work is latency-insensitive'
    - 'Any feature with a strict latency requirement must always be tagged CRITICAL_PLUS so the scheduler protects it first'
    - 'Search-as-you-type must never be classified as sheddable, because dropping any single keystroke breaks the whole query'
  answer: 0
  explanation: |
    "Can I drop it?" (criticality) and "must it be fast?" (latency-sensitivity) are
    independent. Search-as-you-type is very sheddable but very latency-critical; a nightly
    batch is correctness-critical but latency-insensitive. Don't conflate the two axes.
  ref: concepts.md#criticality-googles-model-and-propagation
- id: graceful-degradation-and-fallbacks-067
  difficulty: expert
  tags: [default-value-trap, empty-list, semantics]
  question: |
    An entitlements service times out and its client falls back to returning an empty list.
    Users are suddenly logged out en masse. What went wrong and how is it prevented?
  options:
    - 'The entitlement cache TTL was far too long; shortening it to a few seconds would have refreshed the list before the logout'
    - 'The client-side timeout was too aggressive; raising it to a full 30 seconds would let the slow call complete and skip the fallback'
    - 'The empty-list default was read downstream as "revoke all entitlements"; use a conservative/inert default and tag the response as degraded so downstream distinguishes "known-empty" from "we don''t know"'
    - 'The entitlements service was simply under-provisioned; adding more replicas behind the load balancer would have stopped the timeouts'
  answer: 2
  explanation: |
    A fallback default is a semantic decision: an empty list can be interpreted as "the
    user has no entitlements" — i.e. revoke everything. Prevent it with inert defaults and
    an explicit degraded/stale marker so downstream code refuses destructive action on a
    guessed value.
  ref: concepts.md#default-value-traps
- id: graceful-degradation-and-fallbacks-068
  difficulty: advanced
  tags: [default-value-trap, price, inventory]
  question: |
    Why is a default value of 0 a dangerous fallback for a price or a stock-quantity field?
  options:
    - 'Zero occupies more storage bytes than other small integers, inflating the row size of every price and inventory record'
    - 'The value zero always fails JSON serialization and is silently dropped from the response body before it reaches the client'
    - 'A default price of 0 can trigger free checkout and a default quantity of 0 can flip items to "out of stock" — zero is rarely an inert value for money or inventory'
    - 'Zero is a perfectly inert default here; any numeric fallback value is safe as long as the field type is an integer'
  answer: 2
  explanation: |
    Substituted defaults are interpreted downstream. Price 0 can enable a free checkout;
    quantity 0 can make everything appear out of stock. Money and inventory need
    conservative sentinels that block the risky action, not a literal 0.
  ref: concepts.md#default-value-traps
- id: graceful-degradation-and-fallbacks-069
  difficulty: advanced
  tags: [default-value-trap, degraded-flag, semantics]
  question: |
    What is the key benefit of tagging a fallback response as "degraded/stale" rather than
    returning a bare substituted value?
  options: [It makes the response measurably smaller on the wire because the degraded marker lets the serializer
      omit the empty data fields entirely, 'It lets downstream code distinguish "known-empty"
      (confirmed no data) from "we don''t know" (fallback), so it can refuse destructive actions on guessed
      values', It causes the client library to automatically retry the primary path in the background until
      a fresh non-degraded value is obtained, It transparently encrypts the fallback payload so that stale
      or guessed values cannot be read by downstream services]
  answer: 1
  explanation: |
    The whole game is distinguishing absence of data from data confirming absence. An
    explicit degraded marker lets downstream refuse to, say, revoke entitlements or zero
    out a cart when the value is merely a guess rather than a confirmed truth.
  ref: concepts.md#default-value-traps
- id: graceful-degradation-and-fallbacks-070
  difficulty: expert
  tags: [static-stability, numbers, availability-zones]
  question: |
    For static stability across 3 Availability Zones with 50% overprovisioning, at roughly
    what fraction of load-tested capacity does each AZ normally run, and why that number?
  options: ['~90% of tested capacity, to minimize idle cost, relying on fast autoscaling to cover the gap if an AZ is lost', '~66% (2/3), so that if one AZ is lost its share pushes the
      two survivors to ~100% with no control-plane scaling', '~50% of tested capacity, so that exactly half the fleet sits idle and can absorb any single-AZ loss', '~33% of tested capacity, sized so the fleet keeps serving even if two of the three AZs fail at once']
  answer: 1
  explanation: |
    Three AZs with 50% overprovision means each runs at ~2/3 of its tested capacity.
    Losing one AZ redistributes its load to the two survivors, taking each to ~100% — the
    fleet absorbs a full AZ failure without any autoscaling / control-plane action.
  ref: concepts.md#static-stability-aws
- id: graceful-degradation-and-fallbacks-071
  difficulty: expert
  tags: [static-stability, zonal, probability]
  question: |
    A request makes N regional (cross-AZ) calls, each with an independent chance of hitting
    an impaired AZ. Compared with a zone-local design, what is the reliability implication?
  options: ['Regional calls give a (2/3)^N chance of dodging the bad AZ (already 4/9 at N=2), degrading
      as N grows; a zone-local design stays at 2/3 regardless of N — the argument for AZ-affinity', 'Regional
      and zonal designs are mathematically identical because each individual call has the same 2/3 chance of avoiding the impaired AZ either way', 'Zonal calls degrade as (2/3)^N with each added hop while regional calls hold steady at
      2/3 regardless of N', 'Adding more regional hops always improves overall availability because the extra calls spread load evenly across all three AZs']
  answer: 0
  explanation: |
    Each regional hop independently risks the impaired AZ, so surviving all N hops is
    (2/3)^N — 4/9 at N=2 and worse beyond. A zone-local request pinned to a healthy AZ
    never crosses into the bad one, holding at 2/3 regardless of N. Hence AZ-affinity /
    cell-based, zone-local dependency graphs.
  ref: concepts.md#static-stability-aws
- id: graceful-degradation-and-fallbacks-072
  difficulty: advanced
  tags: [static-stability, active-standby, failover]
  question: |
    What makes an active-standby failover "statically stable"?
  options:
    - 'It launches a fresh replacement instance just in time the moment the primary fails, so no capacity sits idle waiting'
    - 'It relies on the autoscaling control plane to provision and boot the standby during the incident to keep steady-state cost low'
    - 'You fail over to a pre-existing warm standby (or elect a leader from members that already exist) — the failover is a data-plane flip, not a control-plane build-out'
    - 'It requires strong synchronous consistency between primary and standby so that no write is ever lost during the failover flip'
  answer: 2
  explanation: |
    Static stability means recovery is already provisioned. You fail over to a standby that
    already exists (or promote an existing member), so the failover is a data-plane flip.
    "Launch a replacement just in time" reintroduces the control-plane dependency you were
    trying to remove.
  ref: concepts.md#static-stability-aws
- id: graceful-degradation-and-fallbacks-073
  difficulty: expert
  tags: [circuit-breaker, half-open, recovery]
  question: |
    Why must a circuit breaker's half-open state limit the number of trial requests it lets
    through?
  options: ['To reduce the volume of log lines the breaker emits, since each trial request writes a debug
      entry that would otherwise flood the logging pipeline', 'To comply with the HTTP/2 maximum-concurrent-streams
      limit of 100 per connection, which would otherwise reject the extra trial requests outright', 'So a just-recovering dependency
      is not flooded the instant it comes back, which would trip the breaker straight open again (recovery
      oscillation)', 'Because the half-open state is implemented as a single-threaded state machine that can
      track only one in-flight probe request at a time']
  answer: 2
  explanation: |
    Half-open probes recovery with only a few trial calls. Without that cap, the full load
    slams a dependency the moment it recovers, re-tripping the breaker and causing
    oscillation. Limiting trials lets the dependency ramp back up gracefully.
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-074
  difficulty: expert
  tags: [circuit-breaker, writes, journaling]
  question: |
    A circuit breaker protecting a write path is open. What is the correct write-side
    analogue of a fallback?
  options: ['Return a fabricated success response immediately so the caller proceeds as if the write had committed,
      then quietly discard it once the breaker closes', 'Silently drop the write to shed load, trusting the
      client''s own retry logic to eventually resubmit it after the breaker closes', 'Convert the write into
      a read of the last committed value and return that to the caller so the request still completes', 'Record the write to a durable journal/outbox while the
      breaker is open and replay it on recovery, preserving the state change']
  answer: 3
  explanation: |
    Fabricating success can corrupt or lose state. The correct pattern is to journal the
    write durably while the breaker is open and replay it once the dependency recovers, so
    the state change is preserved rather than pretended.
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-075
  difficulty: expert
  tags: [circuit-breaker, accelerated, retry-after]
  question: |
    A downstream dependency returns HTTP 503 with a Retry-After header. What does
    "accelerated circuit breaking" do with this?
  options: ['Ignore the Retry-After header entirely and keep sending requests at full rate until the normal
      rolling error-count threshold is finally reached', 'Retry the failed request immediately with no delay
      at all, assuming the server has already recovered by the time the response arrives', 'Trip the breaker immediately rather than waiting for the normal error-count
      threshold, and honour Retry-After as the open duration', 'Treat the 503 as a successful response since
      the server actually replied, and reset the rolling error counter back to zero']
  answer: 2
  explanation: |
    An explicit overload signal (429/503 with Retry-After) is a definitive "back off now."
    Accelerated breaking trips immediately instead of accumulating errors, and uses
    Retry-After to size the open window — respecting the server's own guidance.
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-076
  difficulty: expert
  tags: [monitoring, fallback-rate, sli]
  question: |
    Treating fallback activation as an SLI, why do you alert on it crossing a LOW threshold
    (e.g. baseline 0.1% to a few percent) rather than a high one?
  options: ['Because high thresholds are far harder to configure correctly, and picking the wrong high value
      would suppress the alert during the exact incident it exists to catch', 'Because low thresholds reduce
      overall alert volume by firing less often than high ones, keeping on-call pager noise down during routine
      dependency blips', 'Because the fallback rate can never exceed a few percent by design, so a high threshold
      would be mathematically impossible for the alarm to ever cross', 'Because fallbacks keep end-user errors near
      zero, so a small rise in fallback rate is often the only early signal that a dependency is degraded
      — the sensitivity is the point']
  answer: 3
  explanation: |
    The whole purpose is to surface what the error rate hides. Since fallbacks mask
    user-facing errors, even a jump from ~0.1% to a few percent means a dependency is
    degraded. A deliberately sensitive threshold catches it early.
  ref: concepts.md#the-risks-of-fallbacks
- id: graceful-degradation-and-fallbacks-077
  difficulty: advanced
  tags: [monitoring, staleness-age, distinct-alarm]
  question: |
    Why is "cache-staleness age" a distinct alarm from "fallback activation rate" when a
    serve-stale fallback is active?
  options: ['They always move together in lockstep, so a single combined alarm on either signal is enough
      and a second one only adds redundant pages', 'The fallback rate can be flat while the
      age of the served data climbs unbounded during a prolonged outage — staleness age catches a long
      outage that a steady fallback rate hides', 'Staleness age only matters for write paths, where an old
      value can overwrite fresher data; on a read-only serve-stale fallback the age is irrelevant', 'Fallback
      rate is simply a derived subset of staleness age, computed by bucketing the age metric, so alarming
      on age alone already covers it']
  answer: 1
  explanation: |
    A steady serve-stale fallback keeps the fallback rate flat, but the data it serves gets
    older and older as the outage drags on. A separate staleness-age alarm catches the
    "we've been serving hours-old data" condition that the fallback rate alone would miss.
  ref: concepts.md#the-risks-of-fallbacks
- id: graceful-degradation-and-fallbacks-078
  difficulty: expert
  tags: [warm-path, cold-path, chaos]
  question: |
    "The code path you never use is the code path that doesn't work." Which practice most
    directly keeps the load-shedding / degraded code path warm in normal operation?
  options: ['Adding more unit tests for the happy path so every branch of the primary code is covered long
      before the load-shedding logic is ever reached', 'Deliberately running a small subset of servers
      near their overload/shedding threshold continuously, so the degraded path executes in steady state',
    'Increasing the primary path''s timeout so requests wait longer before shedding, giving the healthy code
      path more time to finish under load', 'Disabling the degraded path entirely in normal operation and
      enabling it via a flag only once an incident forces load-shedding to kick in']
  answer: 1
  explanation: |
    Keeping a few hosts near the shedding threshold in normal times exercises the degraded
    code path continuously, so it is proven rather than cold when a real incident arrives.
    This complements chaos-killing T2/T3 deps and kill-switch game days.
  ref: concepts.md#keeping-the-degraded-path-warm
- id: graceful-degradation-and-fallbacks-079
  difficulty: advanced
  tags: [circuit-breaker, open-state, default-value]
  question: |
    In the open state, what is the most resilient behavior for a circuit breaker fronting a
    read that has a cached value available?
  options: ['Always throw an exception immediately so that every individual caller is forced to handle the
      failure and supply its own fallback logic', 'Queue the read request and block the calling thread until
      the breaker transitions back to closed and the dependency is confirmed healthy', 'Directly return the cached/default value without attempting the dependency
      at all, protecting both caller and callee', 'Send one probe request per caller through to the dependency
      to check whether it has recovered before returning a cached value']
  answer: 2
  explanation: |
    An open breaker need not throw — it can return a cached or default value immediately
    with zero calls to the failing dependency. That is the fast, cheap path that shields
    both the caller (latency) and the struggling callee (load).
  ref: concepts.md#fallbacks-and-fallback-chains
- id: graceful-degradation-and-fallbacks-080
  difficulty: intermediate
  tags: [avoid-fallback, hot-path, exercise]
  question: |
    Which of these best describes making a fallback "hot" so the avoid-fallback objection no
    longer applies?
  options: ['Keeping the fallback code written in a faster, lower-level programming language than the primary
      so it can never miss the latency budget when it is finally invoked', 'Exercising the fallback continuously
      in production (e.g. always serving from an always-populated cache) so it is not a cold, rarely-run
      path', 'Running the fallback only during scheduled weekly maintenance windows so it gets exercised on
      a fixed cadence away from live production traffic', 'Documenting the fallback path thoroughly in an on-call
      runbook so responders know exactly how to trigger it by hand during an incident']
  answer: 1
  explanation: |
    A "hot" fallback runs as part of steady-state operation rather than only after the
    primary fails, so it never accumulates the staleness and latent bugs of a cold path.
    An always-populated cache floor is the classic example — the same idea as constant work.
  ref: concepts.md#avoiding-fallback-the-contrarian-thesis
