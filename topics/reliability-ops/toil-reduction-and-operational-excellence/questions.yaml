topic: "Toil Reduction & Operational Excellence"
domain: reliability-ops
topic_slug: toil-reduction-and-operational-excellence
version: 1
questions:
  - id: toil-reduction-and-operational-excellence-001
    difficulty: beginner
    tags: [toil, definition]
    question: |
      In the SRE definition, which set of characteristics best describes toil?
    options:
      - "Complex, novel, judgment-heavy work that demands deep engineering expertise each time"
      - "Manual, repetitive, automatable, tactical, devoid of enduring value, and scaling linearly with growth"
      - "Any work an engineer personally finds boring, tedious, or beneath their skill level"
      - "Administrative overhead such as recurring meetings, email triage, and expense-report filing"
    answer: 1
    explanation: |
      Google's SRE book defines toil by six characteristics: manual, repetitive, automatable,
      tactical, devoid of enduring value, and O(n) with service growth. It is a precise concept,
      not a synonym for "unpleasant" (novel/judgment work is engineering; meetings are overhead).
    ref: "concepts.md#what-toil-is--the-sre-definition"

  - id: toil-reduction-and-operational-excellence-002
    difficulty: beginner
    tags: [overhead, definitions]
    question: |
      An SRE spends two hours a week in team standups and sprint planning. How should this time
      be classified?
    options:
      - "Toil, because it is repetitive, recurring, and scales linearly with the team's request volume"
      - "Overhead — administrative work not directly tied to running the service, tracked separately from toil"
      - "Engineering work, because sprint planning meaningfully improves the system's long-term design"
      - "Project work that counts toward the protected >=50% engineering floor under the toil cap"
    answer: 1
    explanation: |
      Meetings are overhead: administrative cost not tied to running the service. It's repetitive
      but not automatable in the SRE sense and doesn't scale with request volume. Overhead is
      tracked separately and does NOT count against the 50% toil cap.
    ref: "concepts.md#toil-vs-overhead-vs-engineering-vs-project-work"

  - id: toil-reduction-and-operational-excellence-003
    difficulty: intermediate
    tags: [toil, scaling, why-bad]
    question: |
      Which property of toil is the strongest structural argument that it must be reduced rather
      than just endured?
    options:
      - "It is unpleasant, hurts morale, and makes on-call rotations harder to staff over time"
      - "It cannot be tracked in a ticketing system, so managers have no visibility into how much exists"
      - "It is always the direct result of bad code that should have been caught in code review"
      - "It scales linearly (O(n)) with service growth, so reliability would require ever-growing headcount"
    answer: 3
    explanation: |
      The killer property is linear scaling with growth. If handling toil costs X per unit of
      load, doubling traffic doubles the toil — reliability that needs linear headcount growth
      doesn't scale. Morale matters too, but the O(n) scaling is the structural argument.
    ref: "concepts.md#why-toil-is-harmful"

  - id: toil-reduction-and-operational-excellence-004
    difficulty: beginner
    tags: [50-percent-cap]
    question: |
      What does the SRE "50% rule" state?
    options:
      - "Toil should be kept below 50% of an SRE's time, reserving the rest for engineering that reduces toil"
      - "At least 50% of all production incidents must be handled by automated self-remediation"
      - "SREs should spend at least 50% of their working time actively on the on-call rotation"
      - "50% of the team should be dedicated ops staff and the other 50% dedicated feature developers"
    answer: 0
    explanation: |
      Google caps aggregate toil at under 50% of SRE time; the remaining >=50% is protected for
      engineering project work that reduces future toil. It's a forcing function so toil doesn't
      expand to fill all available hours.
    ref: "concepts.md#the-50-toil-cap"

  - id: toil-reduction-and-operational-excellence-005
    difficulty: intermediate
    tags: [automation-hierarchy]
    question: |
      Ordering the automation maturity ladder from least to most automated, which sequence is
      correct?
    options:
      - "Scripted -> runbook -> self-service -> fully automated -> self-healing"
      - "Self-healing -> fully automated -> scripted -> runbook -> no automation"
      - "No automation -> documented runbook -> scripted -> self-service tooling -> fully automated -> self-healing"
      - "Documented runbook -> no automation -> self-service -> scripted -> self-healing"
    answer: 2
    explanation: |
      The ladder climbs: no automation, documented runbook, scripted/semi-automated, self-service
      tooling, fully automated, then autonomous/self-healing. Each rung removes more human
      involvement and lowers toil.
    ref: "concepts.md#the-automation-hierarchy--toils-antidote"

  - id: toil-reduction-and-operational-excellence-006
    difficulty: intermediate
    tags: [when-not-to-automate, roi]
    question: |
      A destructive database restore is needed roughly once a year and requires 20 minutes of
      careful manual work. What is the most defensible operational choice?
    options:
      - "Write a clear, tested runbook and keep a human in the loop, since the task is rare and high-risk"
      - "Fully automate it immediately, since eliminating any manual step always maximizes the automation ROI"
      - "Ignore documenting it — rare one-off work is never worth the effort of writing down carefully"
      - "Auto-trigger the destructive restore whenever a health check reports the database as unhealthy"
    answer: 0
    explanation: |
      Automation ROI is weak for a rare task (once a year), and the action is destructive/high
      blast-radius, so a human gate is prudent. The right move is a documented, tested runbook
      (level 1) with a human executing — not fully automating a rare, dangerous action.
    ref: "concepts.md#when-not-to-automate"

  - id: toil-reduction-and-operational-excellence-007
    difficulty: intermediate
    tags: [virtuous-cycle]
    question: |
      What is the core discipline behind the "virtuous cycle" of operational excellence?
    options:
      - "Never handle any task manually; always build full automation before touching it even once"
      - "Rotate on-call every single week so the operational pain is spread evenly across all engineers"
      - "After handling a toil instance manually, capture it as a runbook, then script it, then trigger it automatically so each recurrence is cheaper"
      - "Freeze all feature work indefinitely until measured toil across the team reaches exactly zero"
    answer: 2
    explanation: |
      The cycle compounds: handle it, document the runbook, script the runbook, then automate the
      trigger. Each turn moves the task up the ladder so the next occurrence costs less — making
      operations scale sub-linearly. Postmortem action items feed this loop.
    ref: "concepts.md#the-virtuous-cycle--automate-the-runbook-after-you-write-it"

  - id: toil-reduction-and-operational-excellence-008
    difficulty: advanced
    tags: [self-healing, guardrails, anti-pattern]
    question: |
      An auto-remediation script restarts any instance that fails its health check. During a bad
      deploy, every instance starts failing health checks. Without guardrails, what is the classic
      failure mode?
    options:
      - "The script detects the correlated failures, logs a warning, and safely stops itself on its own"
      - "The health checks automatically relax their thresholds until the failing instances pass again"
      - "The automation replaces/restarts instances faster than they can recover, shrinking the fleet toward zero and causing a self-inflicted outage"
      - "Nothing harmful happens, because restarting a failing instance is inherently a safe operation"
    answer: 2
    explanation: |
      Unbounded auto-remediation can turn a small problem into a large outage: it "heals" faster
      than instances can start, driving the fleet to zero. This is why rate limits, blast-radius
      caps, and escalate-on-repeated-failure guardrails are mandatory.
    ref: "concepts.md#self-healing-systems--auto-remediation-with-guardrails"

  - id: toil-reduction-and-operational-excellence-009
    difficulty: beginner
    tags: [enduring-value, definition]
    question: |
      Which characteristic distinguishes toil most clearly from a lasting engineering improvement?
    options:
      - "Toil consistently takes far longer to complete than a comparable engineering improvement"
      - "Toil leaves the service in the same state as before — it produces no enduring value"
      - "Toil is always assigned to and performed by the most junior engineers on the team"
      - "Toil is always scheduled ahead of time rather than arriving as an unplanned interrupt"
    answer: 1
    explanation: |
      "Devoid of enduring value" is a defining trait: after finishing toil, the system is unchanged
      and you'll do it again. Engineering work leaves a permanent improvement. (Toil is also
      typically tactical/interrupt-driven, not scheduled.)
    ref: "concepts.md#what-toil-is--the-sre-definition"

  - id: toil-reduction-and-operational-excellence-010
    difficulty: intermediate
    tags: [engineering-vs-toil]
    question: |
      An engineer spends a full day debugging a never-before-seen production failure that requires
      deep judgment. Is this toil?
    options:
      - "No — it's not repetitive and requires judgment, so it isn't automatable; it's engineering/incident work"
      - "Yes — any reactive, interrupt-driven work counts as toil by definition regardless of novelty"
      - "Yes — it is manual and directly production-related, which is enough to classify it as toil"
      - "It only becomes toil once the debugging effort stretches beyond four continuous hours of work"
    answer: 0
    explanation: |
      Toil requires repetitiveness and automatability. A novel, judgment-heavy debug is manual and
      unpleasant but not repetitive and not cleanly automatable, and it produces learning — that's
      engineering/incident work, not toil.
    ref: "concepts.md#toil-vs-overhead-vs-engineering-vs-project-work"

  - id: toil-reduction-and-operational-excellence-011
    difficulty: advanced
    tags: [50-percent-cap, offload]
    question: |
      A team measures that toil has risen to about 70% of SRE time. According to SRE practice, what
      is an appropriate response?
    options:
      - "Accept it as unavoidable, since toil is simply an inevitable cost of operating at large scale"
      - "Have SREs quietly work longer hours to cover both the toil load and their engineering projects"
      - "Redirect the overflow toil back to the dev team, hire/reallocate, or explicitly slow feature work until automation catches up"
      - "Remove the 50% cap entirely, since a hard ceiling on toil is clearly unrealistic in practice"
    answer: 2
    explanation: |
      Exceeding the cap is a signal to act: overflow toil is pushed back to the service-owning dev
      team, staffing is adjusted, or feature work is de-prioritized. Toil is a shared
      responsibility; the fix is not to have SREs work more hours (that hides the problem and burns
      people out).
    ref: "concepts.md#the-50-toil-cap"

  - id: toil-reduction-and-operational-excellence-012
    difficulty: intermediate
    tags: [anti-pattern, automation]
    question: |
      Why is "automating a broken process" (paving the cowpath) considered an anti-pattern?
    options:
      - "It makes the wrong process execute faster and at scale, cementing the flaw instead of fixing it"
      - "Automation is always slower than a human whenever the underlying process is broken or flawed"
      - "It directly violates the SRE 50% toil cap by consuming protected engineering project time"
      - "A broken process cannot be automated at all until every one of its bugs is fixed beforehand"
    answer: 0
    explanation: |
      If the manual process is wrong, automating it just makes it wrong faster and everywhere.
      Simplify or fix the process first, then automate. Otherwise you've engineered a reliable way
      to do the wrong thing at scale.
    ref: "concepts.md#when-not-to-automate"

  - id: toil-reduction-and-operational-excellence-013
    difficulty: intermediate
    tags: [error-budget, prioritization]
    question: |
      How does the error budget help decide when to invest in toil reduction and reliability work?
    options:
      - "It allocates a fixed, unchanging number of engineering hours per week to automation work"
      - "It requires freezing all production deployments permanently once the budget has been defined"
      - "It removes the need to measure toil at all, since the budget already captures reliability"
      - "When the budget is being burned (frequent incidents/interrupts), effort is redirected from features to hardening and automation; when healthy, ship features"
    answer: 3
    explanation: |
      The error-budget policy gives a data-driven, non-political trigger: spending budget shifts
      priority toward reliability and toil reduction; a healthy budget permits faster feature work.
      (The budget's mechanics live in the SLO topic; here it's a prioritization lever.)
    ref: "concepts.md#operational-excellence--error-budget-driven-prioritization"

  - id: toil-reduction-and-operational-excellence-014
    difficulty: advanced
    tags: [self-healing, guardrails]
    question: |
      Which guardrail most directly prevents an auto-remediation loop from masking a real
      underlying bug indefinitely?
    options:
      - "Logging every remediation action to a central dashboard for later review by the on-call team"
      - "Making the remediation fully idempotent so repeating it produces no additional side effects"
      - "Rate-limiting the remediation and escalating to a human after repeated failures (e.g. restart <=3 times, then page)"
      - "Running the remediation on a faster, more frequent schedule so problems are cleared sooner"
    answer: 2
    explanation: |
      Rate limits plus escalate-on-repeat ensure that if remediation keeps firing, a human is
      pulled in rather than the automation endlessly papering over the root cause. Logging helps
      visibility and idempotency helps safety, but the rate-limit-and-escalate guardrail is what
      surfaces the underlying bug.
    ref: "concepts.md#self-healing-systems--auto-remediation-with-guardrails"

  - id: toil-reduction-and-operational-excellence-015
    difficulty: beginner
    tags: [measuring-toil]
    question: |
      What is a sensible unit and data source for measuring toil?
    options:
      - "The number of Slack messages the on-call engineer sends per day while handling requests"
      - "Human-hours (or % of engineering time), sourced from ticketing/pager logs and time surveys"
      - "The number of lines of application code each engineer writes over the course of a sprint"
      - "The number of monitoring dashboards the team has created and currently keeps up to date"
    answer: 1
    explanation: |
      Toil is measured in human-hours or as a fraction of total engineering time, drawn from
      ticket systems, on-call/pager logs, and time surveys. That lets you compare it against the
      50% cap and watch the trend.
    ref: "concepts.md#measuring--tracking-toil"

  - id: toil-reduction-and-operational-excellence-016
    difficulty: intermediate
    tags: [why-bad, burnout]
    question: |
      Why is unchecked toil described as creating a "death spiral" for a team?
    options:
      - "It steadily makes the service's code base larger and harder to maintain over time"
      - "It eventually forces the team to migrate its architecture toward microservices to cope"
      - "Burnout drives people to leave, which raises toil-per-person on those remaining, driving more attrition"
      - "It causes the reliability error budget to reset far more often than it otherwise would"
    answer: 2
    explanation: |
      Toil causes burnout and attrition; when people leave, the same toil is spread over fewer
      engineers, raising toil-per-person, causing more burnout and departures — a self-reinforcing
      spiral.
    ref: "concepts.md#why-toil-is-harmful"

  - id: toil-reduction-and-operational-excellence-017
    difficulty: intermediate
    tags: [automation-hierarchy, first-step]
    question: |
      For a recurring manual task currently done from tribal knowledge (level 0), what is usually
      the highest-value, lowest-risk first step up the ladder?
    options:
      - "Jump straight to fully autonomous self-healing that triggers and remediates without any human"
      - "Delete the task entirely and hope that no one actually needed it to be done in the first place"
      - "Write a documented runbook (level 1), which makes the task consistent and specifies exactly what to automate next"
      - "Add a second on-call engineer to the rotation so the manual task can be shared between two people"
    answer: 2
    explanation: |
      You rarely leap from level 0 to level 5. Documenting the runbook makes the task consistent,
      transferable, and — crucially — defines the exact steps a future script will automate. It's
      the cheap, safe first rung.
    ref: "concepts.md#the-automation-hierarchy--toils-antidote"

  - id: toil-reduction-and-operational-excellence-018
    difficulty: advanced
    tags: [anti-pattern, masking]
    question: |
      A service leaks memory and crashes every night; an engineer adds a cron job to restart it at
      3 AM. Why might this "automation" be problematic despite reducing manual toil?
    options:
      - "Cron jobs are a deprecated scheduling mechanism that modern SRE practice no longer permits"
      - "It violates the automation hierarchy by skipping the documented-runbook step and jumping to scripting"
      - "Restarting a running production service is always an inherently unsafe operation to automate"
      - "It masks the underlying bug — removing the operational pain that would have driven a real fix — instead of addressing the memory leak"
    answer: 3
    explanation: |
      Auto-restarting hides the smell: the memory leak still exists, but the pain that would have
      prompted a proper fix is gone. Automation that masks a root cause can be worse than the toil
      it removed. Fix the leak; the restart is at best a stopgap with an alert.
    ref: "concepts.md#when-not-to-automate"

  - id: toil-reduction-and-operational-excellence-019
    difficulty: beginner
    tags: [project-work, definitions]
    question: |
      A one-time data-center migration takes three weeks of manual, tedious work. Does it count as
      toil under the SRE definition?
    options:
      - "Yes — it's manual and tedious, so any unpleasant work is toil"
      - "Only if it fails partway and the migration has to be redone"
      - "Yes — anything over one week is automatically toil"
      - "No — it isn't repetitive, so it's project/one-off work, not toil"
    answer: 3
    explanation: |
      Toil must be repetitive. A one-off migration, however tedious, is project work, not toil.
      "Manual and unpleasant" is not sufficient; the repetitive + automatable + no-enduring-value
      + scales-with-growth profile is what makes work toil.
    ref: "concepts.md#toil-vs-overhead-vs-engineering-vs-project-work"

  - id: toil-reduction-and-operational-excellence-020
    difficulty: intermediate
    tags: [automation-benefits]
    question: |
      Beyond saving human time, which is a key benefit of automating an operational task?
    options:
      - "It guarantees the underlying service will never fail or page anyone again once deployed"
      - "It removes the need for any monitoring, since automated tasks are inherently self-verifying"
      - "Consistency and speed — no fat-fingering, and faster-than-human execution that lowers MTTR — plus auditability"
      - "It eliminates the need for a runbook entirely, since the automation documents the process"
    answer: 2
    explanation: |
      Automation's value goes beyond time saved: it executes consistently (no human error),
      quickly (lowering MTTR), and auditably, and becomes a platform other automation builds on.
      It doesn't remove the need for monitoring — automation itself must be observable.
    ref: "concepts.md#the-automation-hierarchy--toils-antidote"

  - id: toil-reduction-and-operational-excellence-021
    difficulty: advanced
    tags: [when-not-to-automate, stability]
    question: |
      A workflow's steps change substantially almost every month. Why is heavily automating it
      risky?
    options:
      - "Monthly tasks are always low frequency, so the ROI on automating them can never be positive"
      - "The automation must be constantly rewritten to track the changes, so maintaining the automation itself becomes toil"
      - "Automation cannot technically handle a workflow whose steps change between executions"
      - "Changing workflows are inherently low-risk to run manually, so leaving them alone is safe"
    answer: 1
    explanation: |
      Automating an unstable, frequently changing workflow means perpetually rewriting the
      automation — the automation becomes its own toil. Stability of the task is a key factor in
      the automate/don't-automate decision.
    ref: "concepts.md#when-not-to-automate"

  - id: toil-reduction-and-operational-excellence-022
    difficulty: intermediate
    tags: [50-percent-cap, aggregate]
    question: |
      Is the 50% toil cap meant to be enforced per person, per week?
    options:
      - "Yes — every individual SRE must log exactly 50% toil and 50% engineering every single week"
      - "No — the cap applies only to managers and team leads, not to individual on-call engineers"
      - "No — it's an aggregate target across the team over a reasonable window (e.g. a quarter); individual weeks vary"
      - "Yes — and any week where a person exceeds 50% automatically triggers a formal incident review"
    answer: 2
    explanation: |
      The cap is an aggregate over the team and a reasonable time window. One SRE can carry a heavy
      on-call week while another does a project sprint; what matters is the team staying under 50%
      toil overall.
    ref: "concepts.md#the-50-toil-cap"

  - id: toil-reduction-and-operational-excellence-023
    difficulty: intermediate
    tags: [measuring-toil, leading-indicator]
    question: |
      Why is the toil trend line treated as a leading indicator worth reviewing regularly?
    options:
      - "It reliably predicts the team's revenue contribution for the next fiscal quarter"
      - "A rising toil percentage foreshadows burnout and missed project deadlines before they actually occur"
      - "It replaces the need for SLOs, since toil percentage already captures user-facing reliability"
      - "It measures the code quality of the service directly, flagging modules that need refactoring"
    answer: 1
    explanation: |
      Rising toil is an early warning: it signals impending burnout and that engineering deadlines
      will slip, before those outcomes materialize. Reviewing the trend lets the team act early
      (offload/automate) rather than react after the damage.
    ref: "concepts.md#measuring--tracking-toil"

  - id: toil-reduction-and-operational-excellence-024
    difficulty: advanced
    tags: [self-healing, blast-radius]
    question: |
      Which design choice best limits the blast radius of an auto-remediation action?
    options:
      - "Let the automation change the entire fleet at once so recovery finishes as fast as possible"
      - "Disable action logging so the remediation completes faster with less I/O overhead"
      - "Cap how much can change per action (e.g. replace 1 instance, not the whole fleet) and require a human for large-scale actions"
      - "Run the remediation with the highest available privileges so it never gets blocked mid-action"
    answer: 2
    explanation: |
      Blast-radius limits mean the automation can only affect a small slice at a time (one
      instance, not the fleet), with a human gate for large-scale actions. This prevents a single
      buggy remediation from taking down everything at once.
    ref: "concepts.md#self-healing-systems--auto-remediation-with-guardrails"

  - id: toil-reduction-and-operational-excellence-025
    difficulty: beginner
    tags: [automation, antidote]
    question: |
      What is described as the primary antidote to toil?
    options:
      - "Hiring more on-call engineers so the same toil is spread across additional people"
      - "Working longer hours to absorb the toil load without falling behind on projects"
      - "Automation — climbing the automation hierarchy to remove human involvement"
      - "Ignoring low-priority tickets until they eventually resolve themselves or expire"
    answer: 2
    explanation: |
      Automation is the primary weapon against toil. It's a spectrum, not a binary — you climb the
      hierarchy from runbook to scripted to self-service to fully automated/self-healing, removing
      more human involvement at each rung.
    ref: "concepts.md#the-automation-hierarchy--toils-antidote"

  - id: toil-reduction-and-operational-excellence-026
    difficulty: advanced
    tags: [scenario, judgment, error-budget]
    question: |
      On-call is drowning in a repetitive manual task, but the product manager insists all
      engineering time go to features. What is the strongest, most SRE-aligned way to make the case
      for toil-reduction time?
    options:
      - "Quietly stop doing the task and let things break so the outages force the PM's hand"
      - "Tell the team to absorb it with overtime until the feature roadmap has some slack to spare"
      - "Demand that leadership overrule the PM immediately, without bringing any supporting data"
      - "Quantify it — toil-hours x loaded cost, projected O(n) growth, MTTR/burnout risk — and invoke the error-budget/toil policy to protect the engineering floor"
    answer: 3
    explanation: |
      Frame it as ROI with data: current toil cost, its linear growth trajectory, burnout/attrition
      and MTTR impact, and the agreed error-budget/toil policy that protects the >=50% engineering
      floor. That converts a turf fight into a data-driven prioritization decision.
    ref: "concepts.md#operational-excellence--error-budget-driven-prioritization"

  - id: toil-reduction-and-operational-excellence-027
    difficulty: intermediate
    tags: [self-service, platform, scaling]
    question: |
      How does building self-service tooling / an internal developer platform help scale toil
      reduction beyond a single team?
    options:
      - "It converts O(n) one-by-one request handling into O(1) platform maintenance by letting developers safely do things themselves"
      - "It removes the need for any SREs, since developers now own every operational task themselves"
      - "It eliminates all deployment risk by routing every change through the same automated pipeline"
      - "It automatically writes the application code for teams that adopt the golden-path templates"
    answer: 0
    explanation: |
      Self-service (level-3 automation for a whole org) turns per-request toil that grows with the
      number of teams/requests into maintaining one paved-road platform. Golden paths let developers
      self-serve safely. (The platform/IDP tooling itself is owned by devops-cicd.)
    ref: "concepts.md#platform-engineering--the-internal-developer-platform-cross-ref"

  - id: toil-reduction-and-operational-excellence-028
    difficulty: intermediate
    tags: [prioritization]
    question: |
      When prioritizing which toil to eliminate first, which heuristic is most effective?
    options:
      - "Automate the rarest, most obscure task first, since it is the one no one understands well"
      - "Attack the highest-volume, highest-cost toil first (e.g. the page that fires nightly), by pain x frequency"
      - "Automate whatever is technically easiest to script regardless of how much time it actually saves"
      - "Only automate tasks that no one currently complains about, to avoid disrupting existing workflows"
    answer: 1
    explanation: |
      Rank toil by pain x frequency and attack the biggest source first. A recurring nightly page
      yields far more return than eliminating a once-a-year annoyance. High-volume, high-cost toil
      is where automation ROI is greatest.
    ref: "concepts.md#operational-excellence--error-budget-driven-prioritization"

  - id: toil-reduction-and-operational-excellence-029
    difficulty: beginner
    tags: [manual, characteristic]
    question: |
      An engineer runs a deploy script by hand on each of 50 servers, one at a time. Which toil
      characteristics does this most clearly exhibit?
    options:
      - "Novel and judgment-heavy, since each server presents a genuinely different problem"
      - "Manual, repetitive, and scaling linearly with fleet size"
      - "Strategic and high enduring value, because the deploy improves the system permanently"
      - "Overhead unrelated to the service, like administrative or meeting time"
    answer: 1
    explanation: |
      Hand-running the same script across 50 servers is manual (human triggers each), repetitive,
      and O(n) with fleet size (100 servers = twice the work). It's textbook toil ripe for
      scripting/orchestration.
    ref: "concepts.md#what-toil-is--the-sre-definition"

  - id: toil-reduction-and-operational-excellence-030
    difficulty: advanced
    tags: [self-healing, fail-safe]
    question: |
      For an auto-remediation action facing ambiguous input, which failure behavior is safest?
    options:
      - "Fail open — take the remediation action anyway, since acting is safer than doing nothing"
      - "Pick a random one of the candidate actions to avoid deadlocking on the ambiguous input"
      - "Retry the same action on a tight loop indefinitely until the input finally becomes unambiguous"
      - "Fail closed — do nothing and escalate, rather than take a potentially dangerous action on uncertain signals"
    answer: 3
    explanation: |
      On ambiguous input, remediation should fail closed (do nothing) rather than fail open (take a
      possibly destructive action). Combined with idempotency and escalation, this keeps automation
      from causing harm when it isn't sure.
    ref: "concepts.md#self-healing-systems--auto-remediation-with-guardrails"

  - id: toil-reduction-and-operational-excellence-031
    difficulty: intermediate
    tags: [why-bad, illusion]
    question: |
      Why can high ticket-closing volume be a misleading measure of a healthy operation?
    options:
      - "Ticket systems are inherently unreliable and consistently under-count the work actually done"
      - "Volume metrics always overstate engineering work by counting trivial and substantial tickets equally"
      - "Tickets should never be closed by SREs at all — closure is strictly the requesting team's job"
      - "Closing tickets that will simply reopen tomorrow is running to stand still — high volume can mask that no durable improvement was made"
    answer: 3
    explanation: |
      Toil feels productive because you clear many tickets, but if the same tickets recur, you've
      produced no enduring value. The trend line and root-cause elimination matter more than daily
      close counts.
    ref: "concepts.md#why-toil-is-harmful"

  - id: toil-reduction-and-operational-excellence-032
    difficulty: intermediate
    tags: [roi, xkcd]
    question: |
      What is the guiding ROI rule of thumb for deciding whether to automate a task?
    options:
      - "Automate everything, always — any manual step remaining is a defect to be eliminated"
      - "Never automate a task performed fewer than 100 times over its lifetime, regardless of its cost"
      - "Automate only tasks that individually take more than one hour of hands-on effort each time"
      - "Automate when the time saved over the automation's lifetime exceeds the time to build and maintain it"
    answer: 3
    explanation: |
      The classic rule (illustrated by xkcd's "Is It Worth the Time?") is: build automation when
      lifetime time saved > time to build and maintain it. Rare, cheap tasks may be better left as
      documented runbooks.
    ref: "concepts.md#when-not-to-automate"

  - id: toil-reduction-and-operational-excellence-033
    difficulty: advanced
    tags: [scenario, judgment, when-not-to-automate]
    question: |
      A regional failover requires interpreting ambiguous, conflicting signals to decide whether
      failing over will help or make things worse. Why is fully automating the decision poorly
      advised?
    options:
      - "Regional failovers are never actually useful and should be removed from the runbook entirely"
      - "It would violate the automation hierarchy's ordering by skipping the documented-runbook rung"
      - "Automation cannot technically trigger a regional failover without direct human authorization"
      - "Success depends on judgment a machine can't reliably assess, so it isn't cleanly automatable — automate the mechanics but keep a human on the decision"
    answer: 3
    explanation: |
      When outcome hinges on judgment about ambiguous context, the decision isn't cleanly
      automatable — that's engineering, not toil. A good pattern is to automate the mechanical
      steps (the how) but keep a human making the go/no-go decision (the whether).
    ref: "concepts.md#when-not-to-automate"

  - id: toil-reduction-and-operational-excellence-034
    difficulty: beginner
    tags: [engineering-floor]
    question: |
      What is the >=50% of SRE time that the toil cap protects meant to be spent on?
    options:
      - "Engineering project work — building automation and system improvements that reduce future toil"
      - "Additional on-call shifts to provide deeper coverage of the production rotation"
      - "Attending more planning and coordination meetings across the wider organization"
      - "Manual ticket triage, working down the backlog of incoming operational requests"
    answer: 0
    explanation: |
      The protected engineering floor funds the work that reduces toil: automation, tooling, and
      durable system improvements. Without a protected floor, always-urgent toil crowds out this
      always-deferrable engineering.
    ref: "concepts.md#the-50-toil-cap"

  - id: toil-reduction-and-operational-excellence-035
    difficulty: advanced
    tags: [self-healing, kill-switch, observability]
    question: |
      Which requirement is essential for any auto-remediation system so that a misbehaving
      automation can be stopped and understood?
    options:
      - "It must be written in a compiled language so it runs fast enough to beat the failure"
      - "It must run with no rate limits at all, otherwise it can't remediate quickly enough to be effective"
      - "Every automated action must be logged/alerted and have a fast kill switch to disable it"
      - "It should hide its actions from dashboards to avoid alarming operators with routine remediations"
    answer: 2
    explanation: |
      Automation you can't see or stop is a liability. Every automated action needs observability
      (logs/alerts) and a kill switch so operators can disable a misbehaving loop quickly. (How you
      build that monitoring is observability's domain.)
    ref: "concepts.md#self-healing-systems--auto-remediation-with-guardrails"

  - id: toil-reduction-and-operational-excellence-036
    difficulty: intermediate
    tags: [postmortem, virtuous-cycle, cross-ref]
    question: |
      How do blameless postmortems feed the virtuous cycle of toil reduction?
    options:
      - "They produce action items like 'add auto-remediation for X' that move recurring work up the automation ladder"
      - "They assign blame to the responsible engineer so that person is accountable for the fix"
      - "They replace the need for runbooks entirely by documenting every failure as it occurs"
      - "They are unrelated to toil reduction and serve only as a compliance record of incidents"
    answer: 0
    explanation: |
      Postmortem action items are a primary feeder of the automate-the-runbook cycle: "document
      this," "script this," "add auto-remediation for X" convert incident-driven toil into durable
      automation. (Postmortem craft itself lives in the postmortems topic.)
    ref: "concepts.md#the-virtuous-cycle--automate-the-runbook-after-you-write-it"

  - id: toil-reduction-and-operational-excellence-037
    difficulty: intermediate
    tags: [sources-of-toil]
    question: |
      Which are typically the largest sources of toil for an SRE team?
    options:
      - "Writing architecture design documents and reading research papers to guide future engineering"
      - "Refactoring legacy code modules to improve their long-term maintainability and test coverage"
      - "Attending industry conferences and internal training courses to build new professional skills"
      - "On-call interrupts (pages), non-page tickets/requests, and manual releases/config pushes"
    answer: 3
    explanation: |
      The biggest toil sources are usually on-call interrupts, non-page tickets/requests, and
      manual releases/config changes. Identifying these lets you target the highest-volume toil for
      automation. (Pager load specifically is covered in the on-call topic.)
    ref: "concepts.md#measuring--tracking-toil"

  - id: toil-reduction-and-operational-excellence-038
    difficulty: advanced
    tags: [scenario, threshold]
    question: |
      Toil is measured and climbing toward the 50% cap for the second quarter running. What is the
      right interpretation of the 50% figure as a threshold?
    options:
      - "It's a decision trigger — approaching it should invoke the offload/automate response, not just be noted"
      - "It's a purely aspirational long-run average that can be safely ignored for a quarter or two at a time"
      - "It means exactly half the current team should be reassigned or let go to rebalance the workload"
      - "It only becomes a binding constraint once measured toil actually reaches 100% of engineering time"
    answer: 0
    explanation: |
      The cap functions as an enforced ceiling and a decision trigger: as measured toil approaches
      50%, the team should invoke the response (offload to dev team, automate, or slow features).
      Treating it as a soft, ignorable average defeats the forcing function.
    ref: "concepts.md#the-50-toil-cap"

  - id: toil-reduction-and-operational-excellence-039
    difficulty: beginner
    tags: [operational-load]
    question: |
      What is the goal of "operational excellence" in the toil-reduction sense?
    options:
      - "To continuously reduce operational load so the team runs more service with the same or less human effort"
      - "To eliminate all deployments and freeze the production environment so nothing can ever change or break"
      - "To maximize the raw number of operational tickets closed per day as the team's headline success metric"
      - "To keep all operational knowledge as undocumented tribal know-how held only by the senior on-call engineers"
    answer: 0
    explanation: |
      Operational excellence means continuously driving down operational load — turning
      firefighting into engineering so the team can scale the service without scaling headcount
      linearly.
    ref: "concepts.md#operational-excellence--error-budget-driven-prioritization"

  - id: toil-reduction-and-operational-excellence-040
    difficulty: advanced
    tags: [automation, bad-automation]
    question: |
      Why can poorly built automation be worse than the manual toil it replaced?
    options:
      - "It always costs strictly more money than the manual toil once you account for build and maintenance"
      - "It can fail silently, do the wrong thing quickly, or mask the underlying problem — errors now happen fast and at scale"
      - "It requires being written in a compiled language, which most operations teams lack the expertise to maintain"
      - "It never needs a runbook, so the operational knowledge is lost the moment the automation is decommissioned"
    answer: 1
    explanation: |
      Bad automation fails silently, executes mistakes at machine speed and scale, or hides the
      real issue. That's why automation must be reliable, observable, and guard-railed — otherwise
      you've traded slow human error for fast, confident automated error.
    ref: "concepts.md#when-not-to-automate"

  - id: toil-reduction-and-operational-excellence-041
    difficulty: intermediate
    tags: [sub-linear, scaling]
    question: |
      What does it mean, and why does it matter, that good operations should scale "sub-linearly"
      with the service?
    options:
      - "Operational costs should deliberately grow faster than the service itself to pre-fund future reliability work"
      - "Human effort per unit of growth should shrink over time (via automation) so the service can grow without proportional headcount growth"
      - "The service's traffic should be hard-capped so it never grows beyond what the current team can hand-operate"
      - "Toil should grow exactly in step with traffic, keeping the ratio of engineers to load fixed forever"
    answer: 1
    explanation: |
      Sub-linear scaling means each turn of the automate-the-runbook cycle lowers effort per
      incident, so the team can support a growing fleet without headcount rising in lockstep. Toil
      that stays O(n) is exactly what you're trying to escape.
    ref: "concepts.md#the-virtuous-cycle--automate-the-runbook-after-you-write-it"

  - id: toil-reduction-and-operational-excellence-042
    difficulty: intermediate
    tags: [automatable, characteristic]
    question: |
      A task genuinely requires human judgment that a machine cannot reliably reproduce. Under the
      six characteristics, why is this NOT toil?
    options:
      - "Because it is not manual — judgment work is always performed by tooling rather than by a human operator"
      - "Because it fails the 'automatable' characteristic — toil is work a machine could do"
      - "Because judgment-heavy work always produces enduring value by definition, disqualifying it from toil"
      - "Because judgment work is by nature never repetitive, occurring at most once over a service's lifetime"
    answer: 1
    explanation: |
      One of the six characteristics is "automatable" — a machine could do it. If the work truly
      needs human judgment, it fails that test and is engineering/judgment work, not toil, even if
      it's manual and recurring.
    ref: "concepts.md#what-toil-is--the-sre-definition"

  - id: toil-reduction-and-operational-excellence-043
    difficulty: advanced
    tags: [scenario, roi, judgment]
    question: |
      A five-minute manual task is performed roughly 30 times a day by on-call and is error-prone.
      Automation would take about a week to build and is low-risk. What's the best call?
    options:
      - "Automate it — high frequency (30x/day) and error-proneness mean lifetime time saved and reliability gains far exceed a week of build cost"
      - "Leave it manual — at only five minutes each time the per-run cost is too small to ever justify an automation project"
      - "Delete the task entirely, since anything that takes only five minutes is too small to be operationally important"
      - "Add it to the documented runbook and stop there permanently, since a good runbook removes the need to automate"
    answer: 0
    explanation: |
      30x/day x 5 min ~= 2.5 hours/day of toil, plus error risk. Over weeks that dwarfs a
      one-week, low-risk build. High frequency + low risk + error-prone is the textbook case where
      automation ROI is clearly positive.
    ref: "concepts.md#when-not-to-automate"

  - id: toil-reduction-and-operational-excellence-044
    difficulty: beginner
    tags: [tactical, characteristic]
    question: |
      The toil characteristic "tactical" refers to work that is primarily:
    options:
      - "Reactive and interrupt-driven (e.g. handling this page) rather than strategic"
      - "Strategic and forward-planning, focused on long-horizon roadmap and architecture decisions"
      - "Related to marketing tactics and go-to-market campaigns rather than to running the production service"
      - "Performed only during standard business hours, never as part of an after-hours on-call rotation"
    answer: 0
    explanation: |
      "Tactical" means reactive/interrupt-driven — responding to whatever fires right now — as
      opposed to strategic, planned engineering. Toil pulls you into constant reaction, which is
      part of why it crowds out longer-term work.
    ref: "concepts.md#what-toil-is--the-sre-definition"

  - id: toil-reduction-and-operational-excellence-045
    difficulty: advanced
    tags: [scenario, self-healing, guardrails]
    question: |
      You are adding auto-scaling and auto-replacement of unhealthy instances. Which combination of
      guardrails is most complete?
    options:
      - "No guardrails at all — trust the automation fully once it has passed its initial staging tests"
      - "Only logging and alerting, on the theory that full visibility into every action is by itself sufficient"
      - "Only a kill switch, since the ability to stop the automation later covers every possible failure mode"
      - "Rate limits on remediation, blast-radius caps, escalate-on-repeated-failure, logging/alerting, and a kill switch"
    answer: 3
    explanation: |
      Robust self-healing needs the full set: rate limits (stop thrashing), blast-radius caps
      (limit damage), escalate-on-repeat (surface real bugs), observability (see it), and a kill
      switch (stop it). Any single guardrail alone leaves a serious failure mode open.
    ref: "concepts.md#self-healing-systems--auto-remediation-with-guardrails"

  - id: toil-reduction-and-operational-excellence-046
    difficulty: expert
    tags: [four-way-taxonomy, classification]
    question: |
      Using the SRE book's four-way work taxonomy, how should "tuning JVM garbage-collection flags
      on a production service" be classified?
    options:
      - "Toil, because it is manual, touches production, and must be repeated after every deployment of the service"
      - "Overhead, because it isn't feature work and so falls into the same administrative bucket as meetings and email"
      - "Systems engineering — configuring/tuning a production system for lasting value (on the protected side of the 50% cap)"
      - "Software engineering, because JVM flags are technically part of the codebase and are checked into version control"
    answer: 2
    explanation: |
      The four buckets are software engineering (writing code), systems engineering (configuring/
      tuning systems for lasting value), toil, and overhead. Tuning prod GC flags produces enduring
      value by configuring a system, so it is systems engineering — not toil. Writing an
      auto-remediation tool would be software engineering; both are on the protected side.
    ref: "concepts.md#the-four-way-sre-work-taxonomy"

  - id: toil-reduction-and-operational-excellence-047
    difficulty: advanced
    tags: [numbers, healthy-toil]
    question: |
      Google's quarterly SRE surveys report roughly what average level of toil across teams, and how
      should that shape your answer to "what toil % should we expect?"
    options:
      - "About 5% on average — the surveys show teams should treat anything above near-zero as a red flag"
      - "About 33% on average (range 0–80%), with 50% as the hard cap — so a healthy expectation is around a third, not near-zero"
      - "Exactly 50% for every team, since the surveys show teams naturally converge on the cap as their steady state"
      - "About 70% on average, which is precisely why the 50% figure is treated as aspirational rather than enforced"
    answer: 1
    explanation: |
      Observed average toil is ~33%, with a documented range from 0% (pure-dev teams) to 80%
      (teams in trouble). The 50% figure is a ceiling, not a target; a realistic healthy answer is
      "around a third," not zero.
    ref: "concepts.md#how-much-toil-is-healthy--the-numbers"

  - id: toil-reduction-and-operational-excellence-048
    difficulty: expert
    tags: [numbers, rotation-math, on-call]
    question: |
      A team of 6 SREs runs a rotation with two engineers on-call at any moment (primary +
      secondary). What is the approximate theoretical floor on ops commitment, and what does it
      imply for the 50% cap?
    options:
      - "0% — sitting on the on-call rotation is classified as overhead and never counts against the toil floor"
      - "50% exactly — the cap and the floor are always numerically identical regardless of rotation size"
      - "About 33% (2/6) committed to ops at any moment, before any tickets/releases — so small teams have little margin under the 50% cap"
      - "About 12% (2/6 then halved for shared shifts), which leaves the team ample slack beneath the 50% cap"
    answer: 2
    explanation: |
      Two of six engineers on-call is 2/6 ≈ 33% of the team committed to ops at any instant, before
      any ticket or release toil. That is why sub-8-person teams struggle to stay under 50% and why
      literally 0% toil is impossible without over-staffing (an 8-person rotation lowers the floor to
      2/8 = 25%).
    ref: "concepts.md#how-much-toil-is-healthy--the-numbers"

  - id: toil-reduction-and-operational-excellence-049
    difficulty: advanced
    tags: [nuance, healthy-toil]
    question: |
      An interviewer asks, "Should you drive toil to 0%?" What is the most senior-aligned answer?
    options:
      - "No — small amounts of toil can be calming/quick-wins and are only toxic in bulk, and the on-call rotation math makes 0% structurally impossible without over-staffing"
      - "Yes — any toil at all is pure waste and must be driven to exactly zero before any project work proceeds"
      - "Yes — a hard 0% target is the only reliable way to fully protect the >=50% engineering floor from erosion"
      - "It doesn't matter either way, because the percentage of time spent on toil is fundamentally unmeasurable"
    answer: 0
    explanation: |
      The SRE book is explicit that a little toil can be calming and provide quick wins/sense of
      accomplishment; toil is toxic only in large quantities. Combined with the rotation math (two
      engineers on-call sets an irreducible ops floor), the goal is bounded toil (~33% observed, 50%
      cap), not zero.
    ref: "concepts.md#is-all-toil-bad-the-nuance"

  - id: toil-reduction-and-operational-excellence-050
    difficulty: intermediate
    tags: [sources-of-toil, taxonomy]
    question: |
      According to the SRE Workbook's taxonomy of toil sources, which is cited as the most common
      source of toil?
    options:
      - "Writing blameless postmortems and their follow-up action items after each production incident"
      - "Business processes (approval workflows, provisioning requests)"
      - "Attending the on-call handoff meetings held at the start and end of every rotation shift"
      - "Designing new greenfield services and their reliability architecture during the planning phase"
    answer: 1
    explanation: |
      The Workbook lists business processes as the most common source of toil, alongside production
      interrupts, release shepherding, migrations, cost engineering/capacity planning, and
      troubleshooting opaque distributed architectures.
    ref: "concepts.md#the-toil-taxonomy-of-sources--measurement-process"

  - id: toil-reduction-and-operational-excellence-051
    difficulty: advanced
    tags: [measurement, pitfall]
    question: |
      A team decides to measure toil by requiring every engineer to log the exact minutes of each
      manual task in a spreadsheet by hand. What is the main flaw in this measurement approach?
    options:
      - "Minutes are the wrong unit entirely; only discrete counts like tickets or patches are considered valid toil measures"
      - "Toil can never legitimately be measured in time units, so any minute-based figure is meaningless by definition"
      - "Measurement should be performed only by managers reviewing dashboards, never by the engineers actually doing the work"
      - "The manual logging itself becomes toil — measurement must not create the very thing it measures; instrument it cheaply (ticket tags, automatic pager stats)"
    answer: 3
    explanation: |
      The Workbook's process is identify (with the people doing it) → select a unit (time OR
      discrete units like patches/tickets/manual changes) → track continuously. But it warns that
      measuring toil must not itself become toil. Manual timesheet entry people dread defeats the
      purpose; instrument cheaply and sample if needed.
    ref: "concepts.md#the-toil-taxonomy-of-sources--measurement-process"

  - id: toil-reduction-and-operational-excellence-052
    difficulty: expert
    tags: [strategy-menu, reject-toil, scenario]
    question: |
      On-call is drowning in a repetitive manual task. Per the SRE Workbook's ordered strategy menu,
      what should you consider FIRST — before writing automation?
    options:
      - "Whether the task can be rejected/eliminated, batched, or parallelized, or whether it even burns error budget — eliminating work beats automating it"
      - "Immediately build a full self-service automation portal so developers can trigger the task themselves"
      - "Hire another on-call engineer to absorb the extra load until the current rotation stops feeling overwhelmed"
      - "Add more detailed logging and metrics to the task so its cost is measured before anything else is decided"
    answer: 0
    explanation: |
      The Workbook says "rejecting a toil-intensive task should be the first option you consider."
      Before automating, ask whether the task is needed at all, can be batched/parallelized, or
      whether it burns error budget (if not, you may be able to ignore it). Automation is not the
      first move.
    ref: "concepts.md#the-toil-management-strategy-menu"

  - id: toil-reduction-and-operational-excellence-053
    difficulty: advanced
    tags: [strategy-menu, human-backed-interface]
    question: |
      You want to eventually offer self-service provisioning but don't yet understand the real
      requirements. What is the "engineer behind the curtain" pattern's recommendation?
    options:
      - "Build the full self-service portal upfront and reverse-engineer the real requirements from production usage later"
      - "Refuse all incoming provisioning requests until the finished self-service portal is fully built and released"
      - "Ship a ticket queue / manual process as the 'API' first, have humans execute it to learn the requirements, then swap in automation and degrade back to humans for edge cases"
      - "Automate only the happy path and permanently reject every request that falls outside those narrow cases"
    answer: 2
    explanation: |
      Start with a human-backed interface: the ticket queue is a crude API. Humans execute while you
      learn the true requirements, then you replace the humans with automation — and gracefully
      degrade back to tickets for cases the automation can't handle. It's the pragmatic middle rung
      before full self-service.
    ref: "concepts.md#the-toil-management-strategy-menu"

  - id: toil-reduction-and-operational-excellence-054
    difficulty: intermediate
    tags: [strategy-menu, uniformity]
    question: |
      Why does "increase uniformity" (melt snowflakes, pets vs. cattle) reduce toil, per the maxim
      "automation craves conformity"?
    options:
      - "Uniform systems are cheaper to buy"
      - "A fleet of identical units is far cheaper to automate than a zoo of special cases, so standardizing multiplies automation's reach"
      - "Uniformity eliminates the need for monitoring"
      - "Snowflake systems are always insecure"
    answer: 1
    explanation: |
      Automation applies cleanly only when things are uniform; every snowflake is a special case that
      breaks the automation or needs bespoke handling. Increasing uniformity (turning pets into
      cattle) lets one piece of automation cover the whole fleet.
    ref: "concepts.md#the-toil-management-strategy-menu"

  - id: toil-reduction-and-operational-excellence-055
    difficulty: expert
    tags: [toil-budget, error-budget, buy-in]
    question: |
      Leadership resists shipping anti-toil auto-remediation because "it might occasionally take the
      wrong action." What framing from the Workbook's Datacenter case study best unblocks this?
    options:
      - "Promise leadership the automation will be verified to never take a single wrong action before it ships, treating any misfire as an unacceptable launch blocker"
      - "Remove the rate limits and blast-radius guardrails so the automation is simpler, arguing that fewer moving parts make it inherently less likely to fail"
      - "Ship it silently without telling leadership, so any occasional wrong actions go unnoticed and the rollout is never questioned"
      - "Agree on an explicit failure/error budget for the automation itself — budget for it to be wrong occasionally, monitor that rate, and size guardrails to it — plus manager support"
    answer: 3
    explanation: |
      Just as an SLO budgets for the service to be down sometimes, the Workbook recommends a failure
      budget for anti-toil automation: agree up front on an acceptable error rate, monitor it, and
      keep rate limits/blast-radius caps/kill switch sized to that budget. Demanding zero mistakes
      blocks shipping anything; a failure budget plus manager support makes risky-but-valuable
      automation politically possible.
    ref: "concepts.md#toil-budget--an-error-budget-for-automation"

  - id: toil-reduction-and-operational-excellence-056
    difficulty: advanced
    tags: [prr, onboarding]
    question: |
      A Production Readiness Review checks a service across six production aspects before SRE accepts
      on-call ownership. Which set best captures those aspects?
    options:
      - "Architecture & dependencies, instrumentation/monitoring, emergency response, capacity planning, change management, and performance (availability/latency/efficiency)"
      - "Code coverage, unit-test pass rate, integration-test suites, linting and style conformance, API documentation, and changelog completeness"
      - "Budget approval, team headcount, product roadmap, quarterly OKRs, marketing launch plan, and legal/compliance sign-off"
      - "CPU utilization, memory footprint, disk throughput, network bandwidth, monthly cost, and total region count"
    answer: 0
    explanation: |
      The SRE book frames the PRR around architecture & dependencies, instrumentation/metrics/
      monitoring, emergency response, capacity planning, change management, and performance
      (availability, latency, efficiency). It is the gate before SRE takes on-call ownership.
    ref: "concepts.md#production-readiness-reviews-prr"

  - id: toil-reduction-and-operational-excellence-057
    difficulty: expert
    tags: [prr, engagement, scenario]
    question: |
      A dev team asks SRE to take over on-call for their service. After a PRR you find it is
      actually low-maintenance and rarely pages. What is the most SRE-aligned response?
    options:
      - "Take it over anyway, because SRE policy mandates that every production service in the org be under SRE on-call ownership regardless of how much toil it generates"
      - "Refuse to run a PRR at all, since a service that rarely pages is obviously fine and reviewing it would just be wasted process overhead"
      - "It's legitimate for SRE to decline ownership (or later hand it back): a service reliable enough not to need SRE should stay with the dev team, freeing SRE for services that need it"
      - "Take it over and immediately bolt on auto-remediation and dashboards, manufacturing operational work so the engagement looks justified to leadership"
    answer: 2
    explanation: |
      SRE ownership is a scarce resource pointed at services that genuinely need it. If a PRR shows a
      service is low-toil and low-risk, declining ownership (or disengaging) is a positive outcome —
      the dev team keeps it, and SRE effort goes where it matters most.
    ref: "concepts.md#production-readiness-reviews-prr"

  - id: toil-reduction-and-operational-excellence-058
    difficulty: advanced
    tags: [engagement-model, early-engagement]
    question: |
      The SRE engagement model's "Early Engagement" flavor has SRE join in the design phase. What is
      the guiding rationale, per the SRE book?
    options:
      - "SRE should own the design of all services outright so that developers are freed to focus purely on shipping product features"
      - "'The best incidents are those that never happen' — reliability is far cheaper to build in during design than to bolt on after launch"
      - "Design-phase involvement is classified as overhead rather than toil, so it conveniently sits outside the 50% cap accounting"
      - "It gives SRE an early veto to reject and hand back services they would rather not take on-call ownership of later"
    answer: 1
    explanation: |
      Early Engagement embodies "the best incidents are those that never happen." Building
      reliability into the architecture during design is dramatically cheaper than retrofitting it
      after an unreliable service is already live and generating toil.
    ref: "concepts.md#the-sre-engagement-model"

  - id: toil-reduction-and-operational-excellence-059
    difficulty: expert
    tags: [engagement-model, frameworks, numbers]
    question: |
      Adopting codified per-language frameworks / an SRE platform changes onboarding economics
      roughly how, per the SRE book?
    options:
      - "It has no measurable effect, since reliability plumbing must still be hand-built per service"
      - "It roughly doubles onboarding cost up front but meaningfully improves reliability quality"
      - "It only helps services written in Go, because the SRE frameworks are Go-exclusive"
      - "It drops onboarding from roughly 2–3 SREs × 2–3 quarters down to about 1 SRE × 1 quarter"
    answer: 3
    explanation: |
      Frameworks codify best practices so most reliability plumbing is standardized and near-
      automatic. The SRE book cites the reduction from about 2–3 SREs over 2–3 quarters to roughly
      1 SRE over 1 quarter — a large, repeatable cut in onboarding toil.
    ref: "concepts.md#the-sre-engagement-model"

  - id: toil-reduction-and-operational-excellence-060
    difficulty: advanced
    tags: [engagement-model, disengagement]
    question: |
      Under the SRE engagement model, when is disengaging from a service considered a positive
      outcome?
    options:
      - "When the service becomes so reliable and low-toil that it no longer needs SRE, so it's handed back to the dev team — freeing SRE for services that need it more"
      - "When the service is failing so badly and paging so often that SRE formally gives up and walks away from the operational mess"
      - "Never — disengaging from a service always signals a failure of the SRE team to make that service reliable enough to keep"
      - "When the dev team complains loudly enough about SRE processes that handing the service back becomes the path of least resistance"
    answer: 0
    explanation: |
      Disengagement is a success when a service is reliable enough not to warrant scarce SRE effort;
      handing it back to the dev team redirects SRE toward services with real operational need. It's
      the mirror image of the "automate yourself out of a job" goal at the org level.
    ref: "concepts.md#the-sre-engagement-model"

  - id: toil-reduction-and-operational-excellence-061
    difficulty: expert
    tags: [launch-checklist, lce]
    question: |
      In Launch Coordination Engineering, what is the discipline that keeps the launch checklist from
      becoming meaningless bureaucracy?
    options:
      - "The checklist is frozen and updated only once per year by senior leadership, so its contents stay stable and authoritative between annual revisions"
      - "Every checklist question must be justified by a prior launch disaster — it is hard-won institutional memory, modeled on aviation/surgical checklists"
      - "The checklist must contain exactly 20 items, a fixed count chosen so launches remain fast to review without omitting anything important"
      - "Only the launching team itself may edit the checklist, keeping ownership local so no outside group can add process burden to their launch"
    answer: 1
    explanation: |
      Modeled on aviation and surgical checklists, every LCE checklist question must trace to a real
      prior launch failure. That rule keeps it as institutional memory of things that actually went
      wrong, rather than process for its own sake.
    ref: "concepts.md#reliable-launches--the-launch-checklist"

  - id: toil-reduction-and-operational-excellence-062
    difficulty: advanced
    tags: [launch-checklist, toil-detector]
    question: |
      Which launch-checklist question functions as a built-in toil detector for a new service?
    options:
      - "What is the projected quarterly revenue the service is expected to generate?"
      - "Are there manual processes required to keep the service running?"
      - "How many engineers are currently staffed on the owning team's roster?"
      - "Which programming language and web framework is the service implemented in?"
    answer: 1
    explanation: |
      Under "Processes & Automation," asking "Are there manual processes required to keep the service
      running?" surfaces toil before launch — the answer tells you how much ongoing manual operational
      load the service will generate and where automation is needed up front.
    ref: "concepts.md#reliable-launches--the-launch-checklist"

  - id: toil-reduction-and-operational-excellence-063
    difficulty: intermediate
    tags: [graduated-rollout, safe-change]
    question: |
      Which describes a correct graduated (staged) rollout ladder for a risky change?
    options:
      - "Deploy globally to the whole fleet first, then roll back region by region as soon as problems begin to appear anywhere"
      - "Deploy to a randomly selected half of the fleet, watch briefly, then deploy to the remaining half"
      - "Deploy everywhere simultaneously in one shot to minimize version skew and avoid running two code versions at once"
      - "A few machines → one datacenter/zone → region → global, watching SLIs at each stage with automatic rollback on regression"
    answer: 3
    explanation: |
      Graduated rollout expands blast radius gradually (few machines → zone → region → global),
      often with canary traffic and feature flags ramped 1–10% first, and auto-rollback on SLI
      regression. Deploying globally first defeats the entire point of staging.
    ref: "concepts.md#graduated-rollouts--safe-change"

  - id: toil-reduction-and-operational-excellence-064
    difficulty: expert
    tags: [numbers, dependency-availability]
    question: |
      A service is itself 99.99% available and has 10 critical serial upstream dependencies, each
      also 99.99% available. What is the approximate ceiling on its effective availability?
    options:
      - "Still 99.99%, because a service's availability is independent of its dependencies"
      - "About 99.999% (five nines) — using ten dependencies improves effective availability"
      - "About 99.9% (three nines) — 0.9999^10 ≈ 0.9990, so the chain costs roughly a full nine"
      - "About 90%, since each dependency's 0.01% unavailability sums to a 10% loss"
    answer: 2
    explanation: |
      Critical serial dependencies multiply: 0.9999^10 ≈ 0.9990 = 99.9%. Even a four-nines service
      loses a nine behind ten four-nines critical dependencies. This is why reducing/decoupling
      critical dependencies (async, caching, graceful degradation) improves both availability and
      toil.
    ref: "concepts.md#availability-of-dependencies--the-math"

  - id: toil-reduction-and-operational-excellence-065
    difficulty: advanced
    tags: [dependency-availability, toil-reduction]
    question: |
      Why does reducing the number of critical upstream dependencies tend to reduce toil as well as
      improve availability?
    options:
      - "Each critical dependency multiplies down your availability ceiling and adds more places to page on and incidents to handle, so fewer critical deps means fewer O(n) operational surfaces"
      - "Fewer dependencies means there is less upstream client code to compile and link, which is what actually drives the operational load down"
      - "Dependencies only ever affect request latency and the availability ceiling, and have no bearing whatsoever on how much toil a team carries"
      - "It doesn't — the number of critical dependencies is entirely unrelated to toil and only matters for capacity planning purposes"
    answer: 0
    explanation: |
      Each critical dependency both lowers the availability ceiling (multiplicative) and adds an
      operational surface: another integration to monitor, page on, and troubleshoot. Decoupling
      non-critical deps (graceful degradation) removes them from the product and shrinks the toil
      footprint.
    ref: "concepts.md#availability-of-dependencies--the-math"

  - id: toil-reduction-and-operational-excellence-066
    difficulty: expert
    tags: [legacy, maturity-model, scenario]
    question: |
      You inherit a snowflake service that generates constant toil but cannot be rewritten soon. Per
      the Workbook's legacy maturity model, what is the correct progression?
    options:
      - "Rewrite it from scratch immediately in a single big-bang cutover, replacing the entire snowflake service in one coordinated release"
      - "Avoidance (stop making it worse) → encapsulation/augmentation → incremental replacement/refactoring via canary/blue-green → retirement/custodial ownership"
      - "Freeze it forever and never touch it again, on the theory that a stable legacy system left untouched cannot generate any new toil"
      - "Add auto-restart cron jobs to paper over its recurring failures and consider the toil problem fully solved without further work"
    answer: 1
    explanation: |
      The four-stage model is avoidance → encapsulation/augmentation → replacement/refactoring
      (incremental, via canary/blue-green) → retirement/custodial ownership, paired with increasing
      uniformity to melt the snowflake. Big-bang rewrites and freeze-forever are both anti-patterns.
    ref: "concepts.md#reducing-toil-on-legacy-systems"

  - id: toil-reduction-and-operational-excellence-067
    difficulty: advanced
    tags: [legacy, encapsulation]
    question: |
      The Workbook describes encapsulating a legacy system behind a clean interface as
      "refinancing high-interest technical debt into low-interest debt." What does that buy you?
    options:
      - "It permanently removes the technical debt, so the legacy system no longer owes any interest and can be considered fully paid off"
      - "It automatically rewrites the legacy code behind the interface, modernizing the implementation as a side effect of wrapping it"
      - "It deliberately reduces the system's availability so that it fails safely and closed rather than continuing to serve degraded results"
      - "It cheaply buys time and contains the mess — you still owe the debt, but it stops accruing painful interest (constant toil) while you plan replacement"
    answer: 3
    explanation: |
      Encapsulation doesn't erase the debt; it lowers the ongoing "interest" (toil, blast radius) by
      wrapping the legacy system behind a stable interface, containing its spread and buying time for
      incremental replacement. It's stage 2 of the legacy maturity model.
    ref: "concepts.md#reducing-toil-on-legacy-systems"

  - id: toil-reduction-and-operational-excellence-068
    difficulty: intermediate
    tags: [ktlo, vocabulary]
    question: |
      In the KTLO vs. project-work vocabulary, what does "KTLO" primarily map to?
    options:
      - "The novel, discretionary engineering that changes the operational baseline — the protected project work the toil cap defends, not the run load"
      - "The 'keep the lights on' run-the-service load (interrupts, tickets, releases) — the toil-heavy side that the 50% cap defends project time against"
      - "Organizational overhead like recurring meetings, hiring loops, and performance reviews that sits outside the run-vs-project split entirely"
      - "The one-time capital cost of standing up a service (hardware, initial build) that is amortized rather than counted as ongoing run load"
    answer: 1
    explanation: |
      KTLO ("keep the lights on") is the operational baseline load — interrupts, tickets, releases —
      i.e. the toil-heavy side. Project/discretionary work is the protected engineering that changes
      the baseline. Framing an ask as "protect project budget from KTLO creep" mirrors the toil-cap
      forcing function in language senior interviewers expect.
    ref: "concepts.md#ktlo-project-work-and-automate-yourself-out-of-a-job"

  - id: toil-reduction-and-operational-excellence-069
    difficulty: intermediate
    tags: [philosophy, automate-out-of-a-job]
    question: |
      What does the SRE aspiration to "automate yourself out of a job" actually mean in practice?
    options:
      - "Engineer the operational load down until the toil that justified the role is gone, then move on to the next hard problem — not literal unemployment"
      - "Replace the entire SRE team with a single monolithic script that runs the service end to end without any human involvement"
      - "Refuse to perform any manual operational work ever again, pushing every task back onto the dev team on principle"
      - "Outsource the whole on-call rotation to an external managed-operations vendor so no in-house engineer carries the pager"
    answer: 0
    explanation: |
      The phrase is aspirational: drive down operational load through automation until the specific
      toil is eliminated, freeing the engineer for higher-value problems (and new services). It's the
      individual-level mirror of "disengagement as success," not a call to eliminate the role.
    ref: "concepts.md#ktlo-project-work-and-automate-yourself-out-of-a-job"

  - id: toil-reduction-and-operational-excellence-070
    difficulty: expert
    tags: [automation-principles, case-study]
    question: |
      Which principle from the Workbook's Datacenter automation case study best counters an
      automation that "works fine as long as the on-call expert is awake to babysit it"?
    options:
      - "Sometimes imperfect automation is good enough, so accept that a guru must babysit it"
      - "Don't rely on human expertise — encode the knowledge; automation that needs a guru present isn't done"
      - "Design reusable components, so the babysat automation can be reused across many services"
      - "Build in risk assessment and defense in depth, letting an expert safely supervise it while it runs"
    answer: 1
    explanation: |
      "Don't rely on human expertise" is the direct answer: if the automation only works because an
      expert is watching and intervening, the operational knowledge hasn't actually been captured.
      The goal is to encode that expertise so it runs unattended within its guardrails.
    ref: "concepts.md#building-anti-toil-automation--lessons--real-incidents"

  - id: toil-reduction-and-operational-excellence-071
    difficulty: expert
    tags: [guardrails, config-defaults, crashloop]
    question: |
      A service intermittently OOMs. You want auto-remediation (restart) without masking the leak or
      thrashing. Which combination of concrete defaults is most defensible?
    options:
      - "Restart the instance instantly and an unlimited number of times in a tight loop until it finally stays up, trusting that the OOM will eventually clear itself on its own"
      - "Restart the entire fleet simultaneously for maximum recovery speed, with no exponential backoff, no per-instance concurrency cap, and no blast-radius limit of any kind"
      - "Restart only when a human explicitly approves each individual restart through a ticket, paging the on-call engineer to click approve for every single OOM even at 3 AM"
      - "Exponential capped crashloop backoff, replace one instance at a time (concurrency cap), circuit-break to a page after N failures, cool-down windows, fail-closed on ambiguity, and a kill switch"
    answer: 3
    explanation: |
      The defensible default set: capped exponential backoff, per-instance concurrency cap (not the
      whole fleet), circuit-break-and-page after N failures (so the leak surfaces), cool-down
      windows, fail-closed on ambiguous input, and a kill switch. Unlimited instant fleet-wide
      restarts thrash and mask the bug; requiring human approval for every restart just recreates the
      toil.
    ref: "concepts.md#building-anti-toil-automation--lessons--real-incidents"

  - id: toil-reduction-and-operational-excellence-072
    difficulty: advanced
    tags: [postmortem, automation-worse, s3-2017]
    question: |
      The AWS S3 us-east-1 disruption (Feb 2017) is a canonical "automation made it worse" story.
      What was the core mechanism and its lesson?
    options:
      - "A large-scale volumetric DDoS attack overwhelmed the S3 front-end request fleet and exhausted its connections; the lesson is to add aggressive per-client request rate limiting at the network edge"
      - "A bad code deploy shipped a fatal null-pointer bug straight to the storage tier with no staging; the lesson is to gate every single deploy behind automated canary analysis and health checks first"
      - "A capacity-removing command (operator + automation) took out more capacity than intended, forcing full restarts of index/placement subsystems — lesson: blast-radius limits and safety checks on capacity-removing tooling"
      - "An expired TLS certificate silently broke authentication between services across the entire region; the lesson is to automate certificate rotation and add expiry alerting well ahead of the deadline"
    answer: 2
    explanation: |
      A debugging command removed far more capacity than intended; subsystems then required full
      restarts, cascading a long region-wide outage. The lesson for anti-toil automation is
      blast-radius caps and safety checks on any tooling that can remove capacity — exactly the
      guardrails self-healing systems need.
    ref: "concepts.md#building-anti-toil-automation--lessons--real-incidents"

  - id: toil-reduction-and-operational-excellence-073
    difficulty: expert
    tags: [postmortem, meta-2021, recovery]
    question: |
      In the Meta/Facebook global outage (Oct 2021), how did automation not only cause but also
      compound the incident, and what is the reliability lesson?
    options:
      - "An automated audit withdrew BGP routes globally, and automation then blocked recovery (DNS failure plus physical-access controls locked responders out) — lesson: automation needs a manual override/kill path that survives the outage"
      - "A single storage server lost power in one availability zone and cascaded to its neighbors, and the lesson is to add more cross-zone replicas so no individual host is ever a single point of failure"
      - "An engineer accidentally dropped the production metadata database with no valid snapshot, and the lesson is to rehearse backup restores regularly so recovery time is always known and guaranteed"
      - "A sudden viral traffic spike exceeded provisioned capacity and overwhelmed the request fleet, and the lesson is to configure aggressive predictive autoscaling so capacity always stays ahead of demand"
    answer: 0
    explanation: |
      An automated config/BGP audit withdrew Facebook's route advertisements globally, taking the
      platform offline. Recovery was compounded because DNS/internal tooling depended on the same
      infrastructure and physical-access systems locked responders out. The lesson: automation must
      have an out-of-band manual override/kill path that doesn't depend on the failed system.
    ref: "concepts.md#building-anti-toil-automation--lessons--real-incidents"

  - id: toil-reduction-and-operational-excellence-074
    difficulty: advanced
    tags: [four-way-taxonomy, software-vs-systems]
    question: |
      What is the distinction between the "software engineering" and "systems engineering" buckets in
      the SRE four-way taxonomy?
    options:
      - "The split is purely organizational: software engineering is whatever product developers do, while systems engineering is whatever the SRE team does, so the same task changes bucket depending on which team happens to own it"
      - "Software engineering = writing/modifying code (tools, automation, patches); systems engineering = configuring/tuning production systems (LBs, config, prod tuning, architecture consulting). Both create lasting value and are on the protected side"
      - "Software engineering time counts fully against the 50% toil cap while systems engineering is exempt, because only code changes are considered genuine operational load worth capping"
      - "They are two names for the identical activity, distinguished only by seniority: junior engineers do software engineering and staff-level engineers do systems engineering on the very same work"
    answer: 1
    explanation: |
      Software engineering is writing code that produces lasting value; systems engineering is
      configuring/tuning systems for lasting value (load balancers, prod config, architecture
      consulting). Both are engineering — on the protected >=50% side — and neither counts as toil.
      Only toil is capped; overhead is separate.
    ref: "concepts.md#the-four-way-sre-work-taxonomy"

  - id: toil-reduction-and-operational-excellence-075
    difficulty: expert
    tags: [subtle-distinction, migration, toil]
    question: |
      Is a one-time three-month migration "toil" under the classic SRE definition, given the Workbook
      also lists migrations as a source of toil?
    options:
      - "Yes, unambiguously — because it is manual and produces no enduring value to the service, those two characteristics alone are sufficient to classify any such effort as textbook toil"
      - "No, unambiguously — every migration is by definition strategic project work that carries none of the six toil properties, so the question of tension simply never arises in practice"
      - "By the classic six-characteristic definition it is NOT toil because it isn't repetitive, yet the Workbook lists migrations as a source of toil-like work — a strong answer argues both sides"
      - "It only becomes toil in the specific case where the migration fails partway through and the entire three-month effort has to be repeated from the beginning a second time"
    answer: 2
    explanation: |
      A single migration hits several toil criteria (manual, arguably no enduring value to the
      service) but fails the repetitiveness test, so the classic definition says it is project/one-off
      work, not toil. Yet the Workbook explicitly lists migrations as a source of toil-like work. The
      senior answer recognizes the tension and argues both sides rather than picking one dogmatically.
    ref: "concepts.md#the-toil-taxonomy-of-sources--measurement-process"
