topic: "Incident Response & Command"
domain: reliability-ops
topic_slug: incident-response-and-command
version: 1
questions:
  - id: incident-response-and-command-001
    difficulty: beginner
    tags: [lifecycle, phases]
    question: |
      What is the correct high-level ordering of the incident lifecycle?
    options:
      - "Detect → resolve → mitigate → learn → triage"
      - "Triage → detect → learn → mitigate → resolve"
      - "Detect → triage → mitigate → resolve → learn"
      - "Mitigate → detect → triage → resolve → learn"
    answer: 2
    explanation: |
      The lifecycle runs detect → triage/assess severity → respond/mitigate → resolve →
      learn (postmortem). Mitigation comes before full resolution, and the learning phase
      feeds hardening work back to the front of the loop.
    ref: "concepts.md#the-incident-lifecycle"

  - id: incident-response-and-command-002
    difficulty: intermediate
    tags: [incident-commander, roles]
    question: |
      During an incident, what is the Incident Commander (IC) primarily responsible for?
    options:
      - "Personally applying the fix and running the mitigation commands"
      - "Coordinating the response and making decisions, while delegating hands-on work"
      - "Writing the root-cause analysis while the incident is ongoing"
      - "Answering all customer support tickets directly"
    answer: 1
    explanation: |
      The IC coordinates and decides; they explicitly do NOT do the hands-on fixing — that
      is the Ops lead's job. Keeping the IC out of the keyboard preserves situational
      awareness and decision authority.
    ref: "concepts.md#incident-command-roles"

  - id: incident-response-and-command-003
    difficulty: intermediate
    tags: [mitigate, root-cause, judgment]
    question: |
      You are paged: p99 latency is spiking and error rates are climbing. A deploy went
      out 10 minutes ago. What should you do first?
    options:
      - "Open the code and find exactly which line in the deploy caused the regression"
      - "Wait 20 minutes to see whether the metrics recover on their own"
      - "Write the postmortem timeline before taking any action"
      - "Roll back the recent deploy to stop the impact, then diagnose afterward"
    answer: 3
    explanation: |
      Mitigate before root-cause: stop the bleeding first. A rollback is the fastest,
      most reversible action, and you don't need to prove the deploy is the cause to
      revert to a known-good state. Root-cause analysis happens later in the postmortem.
    ref: "concepts.md#mitigate-before-root-cause"

  - id: incident-response-and-command-004
    difficulty: beginner
    tags: [severity, sev-levels]
    question: |
      On a typical SEV scale, which level represents the MOST severe incident?
    options:
      - "SEV1"
      - "SEV5"
      - "SEV3"
      - "The scale doesn't rank by number"
    answer: 0
    explanation: |
      On a SEV scale, lower numbers are worse: SEV1 is critical (e.g. full outage or data
      loss). Note this runs opposite to some intuitions and confirm local convention,
      since P-level numbering (P0/P1 worst) can map differently.
    ref: "concepts.md#severity-levels-sev--p-levels"

  - id: incident-response-and-command-005
    difficulty: intermediate
    tags: [declaring, judgment]
    question: |
      What is the guiding principle for whether to declare an incident?
    options:
      - "Wait until you're certain it's serious to avoid false alarms"
      - "Err on the side of declaring — it's cheap to declare and downgrade, costly to retrofit command onto chaos"
      - "Only declare after a manager approves it"
      - "Never declare for customer-visible issues, only internal ones"
    answer: 1
    explanation: |
      Declaring is cheap; discovering hours in that nobody coordinated is expensive. Bias
      toward declaring and downgrade/close if it turns out minor. Declaring creates a
      single source of truth and clear ownership.
    ref: "concepts.md#declaring-an-incident"

  - id: incident-response-and-command-006
    difficulty: intermediate
    tags: [roles, ops-lead]
    question: |
      Which role is the ONLY one that should be making hands-on changes to the system
      during an incident?
    options:
      - "The Communications lead"
      - "The Scribe"
      - "The Operations / Ops lead"
      - "The Incident Commander"
    answer: 2
    explanation: |
      The Ops (tech) lead does the hands-on investigation and applies mitigations. The IC
      coordinates, Comms handles updates, and the Scribe records — none of them should be
      changing the system.
    ref: "concepts.md#incident-command-roles"

  - id: incident-response-and-command-007
    difficulty: intermediate
    tags: [scribe, roles, postmortem]
    question: |
      What is the primary job of the Scribe role during an incident?
    options:
      - "Deciding which mitigation to apply"
      - "Talking to customers on the status page"
      - "Running diagnostic commands on the hosts"
      - "Maintaining a real-time, timestamped timeline of decisions and actions"
    answer: 3
    explanation: |
      The Scribe records the timeline — decisions, actions, timestamps — in real time.
      This becomes the raw material for the postmortem and enables clean handoffs, while
      context is still fresh.
    ref: "concepts.md#incident-command-roles"

  - id: incident-response-and-command-008
    difficulty: advanced
    tags: [separation, command, mechanism]
    question: |
      Why is it important that the Incident Commander is NOT the same person doing the
      hands-on debugging?
    options:
      - "Deep debugging is tunnel-vision work while coordination needs broad attention; one person can't do both well under stress"
      - "Union rules require role separation"
      - "It doubles the number of people who can be blamed"
      - "The IC is legally prohibited from touching production"
    answer: 0
    explanation: |
      Debugging demands narrow focus; coordination demands broad situational awareness. If
      the coordinator dives into the terminal, the big-picture view (who's doing what, is
      this working, should we escalate) goes unmonitored.
    ref: "concepts.md#separating-command-from-hands-on-work"

  - id: incident-response-and-command-009
    difficulty: intermediate
    tags: [mttr, metrics]
    question: |
      What does MTTR most commonly stand for in incident metrics?
    options:
      - "Maximum Tolerable Threshold Rate"
      - "Mean Time To Reproduce"
      - "Mean Time To Recover (or Repair/Resolve)"
      - "Minimum Time To Respond"
    answer: 2
    explanation: |
      MTTR = Mean Time To Recover/Repair/Resolve — the time to restore service. The 'R' is
      ambiguous across orgs, so a strong answer disambiguates which meaning (and where the
      clock starts) you intend.
    ref: "concepts.md#mttr-and-the-time-to-x-breakdown"

  - id: incident-response-and-command-010
    difficulty: intermediate
    tags: [ics, history]
    question: |
      Where did the Incident Command System (ICS) that modern tech incident response
      borrows from originally come from?
    options:
      - "US wildfire/emergency response, later codified by FEMA's NIMS"
      - "Google's SRE team invented it in 2016"
      - "The ISO 27001 security standard"
      - "The Agile Manifesto"
    answer: 0
    explanation: |
      ICS originated in 1970s US wildfire response and was generalized by FEMA/NIMS.
      Google (SRE Ch. 14) and PagerDuty adapted it for software incidents — fighting fires
      and fighting outages share the same coordination problem.
    ref: "concepts.md#the-incident-command-system-ics"

  - id: incident-response-and-command-011
    difficulty: intermediate
    tags: [severity, axes, judgment]
    question: |
      Which two axes best capture how incident severity is typically assessed?
    options:
      - "Team size and time of day"
      - "Programming language and cloud provider"
      - "Number of alerts fired and number of dashboards affected"
      - "Customer impact / blast radius and urgency (is it getting worse / revenue at stake)"
    answer: 3
    explanation: |
      Severity is driven by impact/blast radius (how many users, how core, workaround
      available, data loss) and urgency (actively worsening, SLA/revenue/safety at risk).
      Security breaches and data loss usually get top severity by policy regardless of user
      count.
    ref: "concepts.md#severity-levels-sev--p-levels"

  - id: incident-response-and-command-012
    difficulty: intermediate
    tags: [communication, cadence]
    question: |
      Your incident is dragging on and there's no new information. What should the Comms
      lead do about stakeholder updates?
    options:
      - "Go silent until there's a concrete fix to announce"
      - "Post updates on the committed cadence anyway — e.g. 'still investigating, next update in 30 min'"
      - "Delete the status page entry to avoid confusion"
      - "Only update leadership, never customers"
    answer: 1
    explanation: |
      Cadence over content: honor the committed interval even with no news. Silence during
      an outage reads as 'they don't know what's happening,' breeding rumors and duplicate
      escalations — worse for trust than an honest 'still working it.'
    ref: "concepts.md#communication-during-an-incident"

  - id: incident-response-and-command-013
    difficulty: advanced
    tags: [availability, mttr, mtbf, formula]
    question: |
      Using the steady-state formula Availability = MTBF / (MTBF + MTTR), which lever is
      often the cheaper way to raise availability?
    options:
      - "Increasing MTBF by eliminating all possible failures"
      - "Neither affects availability"
      - "Reducing MTTR, because failures are inevitable so recovering faster is usually more attainable"
      - "Increasing MTTR to allow more careful fixes"
    answer: 2
    explanation: |
      Availability rises by increasing MTBF (fail less) or decreasing MTTR (recover
      faster). Since failures are inevitable, cutting MTTR is frequently the cheaper,
      higher-leverage investment.
    ref: "concepts.md#mttr-and-the-time-to-x-breakdown"

  - id: incident-response-and-command-014
    difficulty: beginner
    tags: [you-build-it-you-run-it, ownership]
    question: |
      The phrase 'you build it, you run it' — associated with Amazon's Werner Vogels —
      primarily means what?
    options:
      - "The team that writes a service also operates it in production and carries its pager"
      - "Developers should never be on-call"
      - "A separate operations team runs everything developers write"
      - "You must rewrite the service before running it in production"
    answer: 0
    explanation: |
      It's an ownership model: authors operate their own service in production. This aligns
      incentives (feel the operational pain you create) and speeds response (deepest system
      knowledge is on the pager).
    ref: "concepts.md#you-build-it-you-run-it"

  - id: incident-response-and-command-015
    difficulty: advanced
    tags: [anti-pattern, swarm, war-room]
    question: |
      What is the 'swarm with no commander' anti-pattern during a major incident?
    options:
      - "A single engineer handling everything alone"
      - "A large bridge where everyone talks, nobody decides, and the same questions get answered repeatedly"
      - "Rolling back too aggressively"
      - "Paging too few people"
    answer: 1
    explanation: |
      A crowded, leaderless bridge is noise: no decision authority, duplicated effort. The
      fix is ICS — name an IC, shrink the active group, pull SMEs in on demand, and route
      spectators to the status feed (span-of-control).
    ref: "concepts.md#the-war-room--bridge"

  - id: incident-response-and-command-016
    difficulty: intermediate
    tags: [mitigation, levers, judgment]
    question: |
      A single region has become unhealthy but other regions are fine. What is the most
      appropriate immediate mitigation?
    options:
      - "Restart every service globally"
      - "Wait for the region to self-heal while investigating the root cause"
      - "Scale down capacity in the healthy regions"
      - "Fail over traffic away from the unhealthy region"
    answer: 3
    explanation: |
      Failover to a healthy location stops impact fast without needing to know the region's
      root cause. Failover is a standard mitigation lever alongside rollback, kill-switch,
      load-shedding, and graceful degradation.
    ref: "concepts.md#mitigate-before-root-cause"

  - id: incident-response-and-command-017
    difficulty: intermediate
    tags: [communication, roles]
    question: |
      What is a key reason to have a dedicated Communications lead separate from the Ops
      lead during a significant incident?
    options:
      - "To increase the number of people who can approve rollbacks"
      - "Because the Ops lead is not allowed to speak during incidents"
      - "To shield the responders from 'any update?' interruptions so they can focus on fixing"
      - "To make the incident look bigger to management"
    answer: 2
    explanation: |
      The Comms lead absorbs stakeholder/customer traffic and status-page updates, so the
      Ops lead isn't constantly interrupted with ETA questions. Interruption shielding keeps
      the person best able to fix the problem focused.
    ref: "concepts.md#communication-during-an-incident"

  - id: incident-response-and-command-018
    difficulty: advanced
    tags: [mttr, decomposition, judgment]
    question: |
      Your MTTR is dominated by the time between the fault starting and anyone noticing it.
      Where should you invest to improve MTTR most?
    options:
      - "Faster rollback tooling"
      - "A larger on-call rotation"
      - "More detailed postmortems"
      - "Detection — better monitoring/alerting (an observability investment) to reduce MTTD"
    answer: 3
    explanation: |
      MTTR is a chain (detect → ack → mitigate → resolve). If MTTD (detection) dominates,
      invest in observability/alerting. Attack whichever link is biggest — faster rollback
      only helps if mitigation time is the bottleneck.
    ref: "concepts.md#mttr-and-the-time-to-x-breakdown"

  - id: incident-response-and-command-019
    difficulty: beginner
    tags: [roles, comms]
    question: |
      Which role owns the status page and stakeholder/customer updates during an incident?
    options:
      - "The Scribe"
      - "The Communications lead"
      - "The Operations lead"
      - "The Incident Commander alone"
    answer: 1
    explanation: |
      The Communications lead owns external and stakeholder comms: status page, exec
      updates, support/customer liaison. This frees the Ops lead to fix and the IC to
      coordinate.
    ref: "concepts.md#incident-command-roles"

  - id: incident-response-and-command-020
    difficulty: advanced
    tags: [anti-pattern, diagnosis]
    question: |
      Which of the following is an incident-response anti-pattern?
    options:
      - "Insisting on finding the exact root cause before applying any mitigation while the site is down"
      - "Rolling back a suspicious deploy before confirming it is the cause"
      - "Updating stakeholders on a fixed cadence"
      - "Declaring an incident that later turns out to be minor"
    answer: 0
    explanation: |
      'Diagnose before mitigate' is the anti-pattern — impact accrues every second you
      investigate. Rolling back a suspect change, cadenced comms, and erring toward
      declaring are all correct behaviors.
    ref: "concepts.md#common-incident-response-anti-patterns"

  - id: incident-response-and-command-021
    difficulty: intermediate
    tags: [handoff, long-running]
    question: |
      When transferring Incident Commander responsibility during a long-running incident,
      what should happen?
    options:
      - "The outgoing IC quietly leaves and assumes someone will pick it up"
      - "Command should simply lapse until the next shift starts"
      - "Two ICs should run simultaneously with equal authority"
      - "The outgoing IC summarizes state/theories/plan and the incoming IC explicitly acknowledges taking command"
    answer: 3
    explanation: |
      Handoffs must be explicit: outgoing IC states situation, what's been tried, and the
      plan; incoming IC says 'I have command.' Never let command silently lapse — ambiguous
      handoffs are a top cause of incidents dragging on.
    ref: "concepts.md#handoffs--long-running-incidents"

  - id: incident-response-and-command-022
    difficulty: advanced
    tags: [span-of-control, ics]
    question: |
      In ICS, the principle of 'manageable span of control' implies that an Incident
      Commander should do what as the incident grows?
    options:
      - "Personally track every responder's individual actions"
      - "Delegate to sub-leads rather than directly coordinating an unbounded number of people/workstreams"
      - "Add as many people to the bridge as possible"
      - "Stop communicating to reduce noise"
    answer: 1
    explanation: |
      Span of control means one person shouldn't directly coordinate more than a handful
      (~5-7) of people/workstreams. The IC delegates to sub-leads (Ops, Comms, Planning)
      instead of trying to hold everything personally.
    ref: "concepts.md#the-incident-command-system-ics"

  - id: incident-response-and-command-023
    difficulty: intermediate
    tags: [mitigation, feature-flag]
    question: |
      A newly launched feature is implicated in an incident, but a full rollback would
      revert many unrelated changes. What is the cleanest mitigation?
    options:
      - "Toggle off the feature via its feature-flag / kill-switch"
      - "Do nothing until the next scheduled release"
      - "Scale up the database only"
      - "Reboot all application servers"
    answer: 0
    explanation: |
      A feature flag / kill-switch disables just the implicated feature without reverting
      unrelated work — a targeted, reversible mitigation. This is a core reason to build
      features behind flags. See devops-cicd/deployment-strategies.
    ref: "concepts.md#mitigate-before-root-cause"

  - id: incident-response-and-command-024
    difficulty: intermediate
    tags: [war-room, bridge, tradeoff]
    question: |
      What is a trade-off between using a voice bridge versus a text channel for incident
      coordination?
    options:
      - "Text is always superior and voice should never be used"
      - "Voice automatically produces a written postmortem"
      - "Voice is faster for fast-moving coordination, but text creates a searchable timeline and supports async joiners"
      - "Text is faster than voice for real-time SEV1 coordination"
    answer: 2
    explanation: |
      Voice enables rapid back-and-forth for fast-moving SEV1s; text creates a searchable,
      self-documenting record and lets latecomers catch up asynchronously. Many teams run
      both — voice for the working group, channel for the record.
    ref: "concepts.md#the-war-room--bridge"

  - id: incident-response-and-command-025
    difficulty: advanced
    tags: [you-build-it-you-run-it, tradeoff]
    question: |
      What is the key trade-off/risk of the 'you build it, you run it' model that must be
      managed?
    options:
      - "The on-call/toil burden falls on the dev team, so it needs toil reduction, sane on-call load, and error budgets to stay sustainable"
      - "It removes all operational knowledge from the dev team"
      - "It makes incident response slower because devs lack system knowledge"
      - "It requires a separate NOC to function"
    answer: 0
    explanation: |
      Ownership aligns incentives but puts on-call and toil on the builders. Without
      automation/toil reduction, on-call-load limits, and error budgets, teams burn out.
      Google's SRE model is a middle path that can hand the pager back if toil exceeds a
      threshold.
    ref: "concepts.md#you-build-it-you-run-it"

  - id: incident-response-and-command-026
    difficulty: intermediate
    tags: [triage, severity, dynamic]
    question: |
      You initially triaged an incident as SEV3, but new evidence shows customer checkout
      is failing globally. What should you do?
    options:
      - "Leave it at SEV3 since severity is set once at the start"
      - "Wait for the postmortem to reclassify it"
      - "Upgrade the severity immediately as scope becomes clear"
      - "Close the incident and open a new one from scratch"
    answer: 2
    explanation: |
      Severity is dynamic. You set an initial level in triage and re-assess as scope
      clarifies — upgrade the moment evidence says it's worse. Global checkout failure is a
      SEV1-class impact.
    ref: "concepts.md#severity-levels-sev--p-levels"

  - id: incident-response-and-command-027
    difficulty: beginner
    tags: [mttd, metrics]
    question: |
      What does MTTD measure?
    options:
      - "Mean Time To Deploy"
      - "Mean Time To Detect — how long from fault onset until you know something is wrong"
      - "Mean Time To Debug"
      - "Maximum Time To Downtime"
    answer: 1
    explanation: |
      MTTD is Mean Time To Detect: the interval between a fault beginning and an alert
      firing / the issue being noticed. It's the front of the MTTR chain and largely an
      observability investment to shorten.
    ref: "concepts.md#mttr-and-the-time-to-x-breakdown"

  - id: incident-response-and-command-028
    difficulty: advanced
    tags: [evidence, mitigation, tradeoff]
    question: |
      Before restarting a hung service to restore it, what is the recommended practice
      regarding diagnostic evidence?
    options:
      - "Always spend as long as needed collecting evidence before restarting, even if impact continues"
      - "Never capture anything — evidence doesn't matter"
      - "Only capture evidence after the postmortem is written"
      - "Capture cheap state (logs, heap, thread dump) where quick, but never let evidence collection delay stopping customer impact"
    answer: 3
    explanation: |
      Grab cheap, fast evidence so the postmortem isn't blind — but mitigation (stopping
      customer impact) takes priority. Destroying all evidence in a panic is an
      anti-pattern; so is letting evidence-gathering prolong an outage.
    ref: "concepts.md#mitigate-before-root-cause"

  - id: incident-response-and-command-029
    difficulty: intermediate
    tags: [declaring, triggers]
    question: |
      Which of the following is a classic trigger that should prompt you to declare an
      incident?
    options:
      - "A single unit test failed in CI"
      - "A teammate went on vacation"
      - "The problem is customer-visible, needs a second team, or is unresolved after roughly an hour of focused effort"
      - "A dashboard panel needs a color change"
    answer: 2
    explanation: |
      Google's suggested declaration triggers: do you need a second team? is it
      customer-visible? is it unresolved after ~an hour? Any 'yes' means declare. When in
      doubt, err on the side of declaring.
    ref: "concepts.md#declaring-an-incident"

  - id: incident-response-and-command-030
    difficulty: advanced
    tags: [mitigation, load-shedding, judgment]
    question: |
      Your service is overloaded by a legitimate traffic surge and starting to fail
      requests broadly. As a reliability mitigation, what should you consider?
    options:
      - "Accept the total collapse and wait it out"
      - "Load-shed / rate-limit / throttle to protect the core and serve a subset well"
      - "Disable all monitoring to reduce load"
      - "Roll back a deploy that is unrelated to the traffic surge"
    answer: 1
    explanation: |
      Under overload, shedding load protects the system so it degrades gracefully instead
      of collapsing entirely — a reliability use of rate-limiting (distinct from the
      security/abuse-prevention framing). See reliability-ops/load-shedding-and-backpressure.
    ref: "concepts.md#mitigate-before-root-cause"

  - id: incident-response-and-command-031
    difficulty: intermediate
    tags: [roles, small-incident]
    question: |
      In a very small incident with just one responder, how are the incident-command roles
      typically handled?
    options:
      - "One engineer can wear all the hats, but the moment a second person joins, someone should be explicitly IC and someone else does the work"
      - "You must always page at least four separate people"
      - "Roles don't apply until an executive joins"
      - "The Scribe must always be a dedicated separate person"
    answer: 0
    explanation: |
      Roles are role-based, not headcount-based. One person can hold all roles in a tiny
      incident; as it grows, split them out — start minimal and add roles (IC, Ops, Comms,
      Scribe) as needed.
    ref: "concepts.md#incident-command-roles"

  - id: incident-response-and-command-032
    difficulty: advanced
    tags: [root-cause, postmortem, boundary]
    question: |
      Where does the full root-cause analysis of an incident properly belong?
    options:
      - "In the middle of the incident, before any mitigation"
      - "It should never be done"
      - "Only in the status-page update"
      - "In the blameless postmortem, after customer impact has stopped"
    answer: 3
    explanation: |
      During the incident you diagnose only enough to choose a mitigation. Full RCA is a
      postmortem activity done after impact stops, in a calm environment. See
      reliability-ops/blameless-postmortems-and-learning.
    ref: "concepts.md#mitigate-before-root-cause"

  - id: incident-response-and-command-033
    difficulty: intermediate
    tags: [mtbf, metrics]
    question: |
      What does MTBF (Mean Time Between Failures) describe?
    options:
      - "How long a single incident lasts"
      - "How long it takes to acknowledge a page"
      - "The average time between the end of one failure and the start of the next — a measure of how often failures occur"
      - "The maximum tolerable data loss"
    answer: 2
    explanation: |
      MTBF measures failure frequency — the average gap between failures. Together with
      MTTR it yields steady-state availability = MTBF / (MTBF + MTTR).
    ref: "concepts.md#mttr-and-the-time-to-x-breakdown"

  - id: incident-response-and-command-034
    difficulty: intermediate
    tags: [rollback, judgment, tradeoff]
    question: |
      Why is rollback often the recommended default mitigation when a recent change
      correlates with an incident?
    options:
      - "Because it permanently fixes the underlying bug"
      - "Because it avoids the need for a postmortem"
      - "Because it is the only mitigation that exists"
      - "Because reverting to a known-good state is usually the fastest, safest, most reversible action under pressure"
    answer: 3
    explanation: |
      Returning to a known-good state is lower-risk than forward-fixing under pressure and
      typically the fastest way to stop impact. It doesn't fix the root bug — that comes
      later — but it stops the bleeding.
    ref: "concepts.md#mitigate-before-root-cause"

  - id: incident-response-and-command-035
    difficulty: advanced
    tags: [anti-pattern, hero-culture]
    question: |
      Why is 'hero culture' — relying on one indispensable person to save every incident —
      an anti-pattern?
    options:
      - "It creates bus-factor-1 risk, spreads no shared knowledge, and leads to burnout"
      - "It resolves incidents too quickly"
      - "It makes postmortems too detailed"
      - "It reduces the number of alerts"
    answer: 0
    explanation: |
      Depending on a single hero means the response collapses when they're unavailable,
      knowledge isn't shared, and that person burns out. The fix is runbooks, role
      rotation, and blameless review so response scales beyond one person.
    ref: "concepts.md#common-incident-response-anti-patterns"

  - id: incident-response-and-command-036
    difficulty: beginner
    tags: [mtta, metrics]
    question: |
      MTTA (Mean Time To Acknowledge) primarily measures what?
    options:
      - "How long the fix takes to write"
      - "How quickly on-call responds to (acknowledges) a page after it fires"
      - "How long the incident lasts end to end"
      - "How many alerts fired"
    answer: 1
    explanation: |
      MTTA is the gap between an alert firing and on-call acknowledging it — a measure of
      on-call responsiveness. If MTTA dominates MTTR, fix paging/escalation. See
      reliability-ops/on-call-escalation-and-runbooks.
    ref: "concepts.md#mttr-and-the-time-to-x-breakdown"

  - id: incident-response-and-command-037
    difficulty: advanced
    tags: [severity, data-loss, policy]
    question: |
      A data-corruption bug affects only a handful of users so far. How is severity usually
      assigned?
    options:
      - "Low severity, since few users are affected"
      - "It's not an incident at all"
      - "Often top severity by policy — data loss/corruption and security breaches are irreversible and escalated regardless of user count"
      - "Severity is decided only after the corruption spreads"
    answer: 2
    explanation: |
      Impact isn't just user count. Irreversible harms — data loss/corruption, security
      breaches — are typically assigned top severity by policy even with a small blast
      radius, because they can't be undone.
    ref: "concepts.md#severity-levels-sev--p-levels"

  - id: incident-response-and-command-038
    difficulty: intermediate
    tags: [communication, content]
    question: |
      What kind of information should external/customer-facing incident updates emphasize?
    options:
      - "Detailed stack traces and internal service names"
      - "User-facing impact and current action, in non-technical terms (e.g. 'some users can't check out, fix deploying')"
      - "The names of the engineers who caused it"
      - "Raw log lines from the affected hosts"
    answer: 1
    explanation: |
      External updates should say impact, not internals — terse, non-technical, focused on
      what users experience and what's being done. Blame and raw internals don't belong on
      a status page.
    ref: "concepts.md#communication-during-an-incident"

  - id: incident-response-and-command-039
    difficulty: advanced
    tags: [follow-the-sun, fatigue, long-running]
    question: |
      For a multi-hour incident spanning shifts, why is a 'follow-the-sun' handoff plus
      the Scribe's timeline valuable?
    options:
      - "It lets a single responder stay awake for 18 hours to keep continuity"
      - "It eliminates the need for an Incident Commander"
      - "It removes the need to communicate with stakeholders"
      - "Tired responders cause secondary incidents; handing off across regions (enabled by the recorded timeline) fights fatigue while preserving context"
    answer: 3
    explanation: |
      Fatigued responders make mistakes and trigger secondary incidents. Follow-the-sun
      hands long incidents to rested responders in other regions; the Scribe's timestamped
      timeline is the connective tissue that makes the handoff fast.
    ref: "concepts.md#handoffs--long-running-incidents"

  - id: incident-response-and-command-040
    difficulty: intermediate
    tags: [single-channel, war-room]
    question: |
      What is the benefit of the 'one incident, one channel/bridge' convention?
    options:
      - "Everyone converges in a single place, creating a self-documenting record and avoiding scattered, duplicated coordination"
      - "It hides the incident from stakeholders"
      - "It prevents anyone from joining the incident"
      - "It forces every engineer in the company to participate"
    answer: 0
    explanation: |
      A single dedicated channel (often auto-created and named by incident ID) is the one
      source of truth: responders converge, the log self-documents, and latecomers get
      context from one place instead of fragmented threads.
    ref: "concepts.md#the-war-room--bridge"

  - id: incident-response-and-command-041
    difficulty: expert
    tags: [ics, decision-authority, mechanism]
    question: |
      Two experienced engineers disagree on whether to fail over during a SEV1. Under a
      properly run incident command structure, how is this resolved?
    options:
      - "By taking a vote among everyone on the bridge"
      - "Whoever has more seniority automatically wins"
      - "The Incident Commander, holding decision authority, makes the call so mitigation doesn't stall on consensus"
      - "The disagreement blocks all action until both agree"
    answer: 2
    explanation: |
      A single clear chain of command means the IC decides — that's the point of naming
      one. Without decision authority, mitigation stalls on debate while impact continues.
      The IC weighs the Ops lead's options and calls it.
    ref: "concepts.md#separating-command-from-hands-on-work"

  - id: incident-response-and-command-042
    difficulty: intermediate
    tags: [boundary, observability]
    question: |
      Designing multi-burn-rate alert rules and reducing alert noise are primarily whose
      concern relative to incident response?
    options:
      - "They belong to observability (detection/alerting mechanics); incident response consumes the resulting signal"
      - "They are core incident-command activities handled by the IC"
      - "They belong to the security team"
      - "They are never anyone's responsibility"
    answer: 0
    explanation: |
      Alert-rule mechanics, burn-rate alerting, and alert-fatigue tuning are observability
      concerns (see observability/slo-based-alerting-and-error-budgets and
      on-call-alert-fatigue-and-actionable-signals). Incident response acts on the signal
      once it fires.
    ref: "concepts.md#the-incident-lifecycle"

  - id: incident-response-and-command-043
    difficulty: expert
    tags: [mttr, chain, mitigate-vs-resolve]
    question: |
      In the MTTR chain, what distinguishes 'mitigated' from 'resolved'?
    options:
      - "They are identical points in time"
      - "Resolved comes before mitigated"
      - "Mitigated means the postmortem is published"
      - "Mitigated = customer impact has stopped; resolved = the incident is fully cleaned up and closed"
    answer: 3
    explanation: |
      Mitigation stops customer pain (e.g. rollback restores service); resolution is the
      later point when everything is fully restored and the incident is closed. Customers
      stop hurting at mitigation, before formal resolution.
    ref: "concepts.md#mttr-and-the-time-to-x-breakdown"

  - id: incident-response-and-command-044
    difficulty: intermediate
    tags: [graceful-degradation, mitigation]
    question: |
      A non-critical recommendations dependency is down, breaking the whole product page.
      Which mitigation approach fits best?
    options:
      - "Take the entire product page offline until recommendations recover"
      - "Gracefully degrade — serve the page without recommendations (or with stale/cached data)"
      - "Roll back the last unrelated deploy"
      - "Page the entire engineering org for a non-critical feature"
    answer: 1
    explanation: |
      Graceful degradation drops or serves stale data for the non-critical dependency so
      the core experience survives. A non-essential feature shouldn't take down the whole
      page. See reliability-ops/graceful-degradation-and-fallbacks.
    ref: "concepts.md#mitigate-before-root-cause"

  - id: incident-response-and-command-045
    difficulty: advanced
    tags: [blame, culture, during-incident]
    question: |
      Why is assigning blame DURING an active incident considered an anti-pattern?
    options:
      - "It kills psychological safety, discourages honest reporting, and distracts from restoring service"
      - "It speeds up resolution"
      - "It's required by most SLAs"
      - "It has no effect on the response"
    answer: 0
    explanation: |
      Blame during an incident makes people defensive and less forthcoming, slowing honest
      information flow, and diverts energy from the actual goal — restoring service. Keep it
      blameless throughout; learning happens in the blameless postmortem.
    ref: "concepts.md#common-incident-response-anti-patterns"

  - id: incident-response-and-command-046
    difficulty: intermediate
    tags: [p-levels, sev, convention]
    question: |
      Why must you confirm the local numbering convention when someone says 'this is a P1'?
    options:
      - "Because P-levels are illegal in most companies"
      - "Because P-levels only apply to security incidents"
      - "Because SEV and P scales can run in opposite directions and orgs differ on whether SEV1 maps to P0 or P1"
      - "Because P1 always means the least severe issue everywhere"
    answer: 2
    explanation: |
      SEV scales put SEV1 as worst; P scales usually put P0/P1 as worst, descending — but
      the SEV↔P mapping varies by org (some map SEV1↔P1, others SEV1↔P0). Common
      terminology only helps if everyone agrees on the meaning, so confirm locally.
    ref: "concepts.md#severity-levels-sev--p-levels"

  - id: incident-response-and-command-047
    difficulty: intermediate
    tags: [ics, role-based, mechanism]
    question: |
      A benefit of ICS being 'role-based rather than person-based' is that:
    options:
      - "Only one specific named individual can ever be Incident Commander"
      - "Anyone trained in a role can step into it, and handoffs between people are explicit and clean"
      - "Roles are assigned permanently and can never change during an incident"
      - "It removes the need for any training"
    answer: 1
    explanation: |
      Because responsibilities attach to roles (IC, Ops, Comms, Scribe), any trained person
      can fill a role and handoffs are explicit. This makes the response resilient to who
      happens to be available.
    ref: "concepts.md#the-incident-command-system-ics"

  - id: incident-response-and-command-048
    difficulty: advanced
    tags: [under-declaring, judgment, anti-pattern]
    question: |
      What is the risk of the 'under-declaring' anti-pattern?
    options:
      - "Too many people get involved too early"
      - "The status page updates too frequently"
      - "Postmortems become too detailed"
      - "A growing outage is treated as a minor blip until it balloons, leaving the org in unstructured panic with no command"
    answer: 3
    explanation: |
      Under-declaring means dismissing a real incident as 'just a blip' until it's large
      and chaotic, with no IC or structure in place. A 30-second declaration up front
      routinely saves an hour of chaos — normalize declaring and make it blameless.
    ref: "concepts.md#declaring-an-incident"

  - id: incident-response-and-command-049
    difficulty: intermediate
    tags: [status-page, states, comms]
    question: |
      Which sequence of status-page states is conventional for communicating incident
      progress to customers?
    options:
      - "Investigating → Identified → Monitoring → Resolved"
      - "Resolved → Investigating → Identified → Monitoring"
      - "Monitoring → Resolved → Investigating → Identified"
      - "Identified → Resolved → Investigating → Monitoring"
    answer: 0
    explanation: |
      The conventional lifecycle on a status page is Investigating → Identified →
      Monitoring → Resolved. Update promptly and don't forget to mark Resolved when the
      incident closes.
    ref: "concepts.md#communication-during-an-incident"

  - id: incident-response-and-command-050
    difficulty: expert
    tags: [sre-model, error-budget, tradeoff]
    question: |
      In Google's SRE model, what mechanism keeps developer incentives honest when a
      specialized SRE team co-owns operations?
    options:
      - "SREs are contractually forbidden from ever paging developers"
      - "If a service exceeds an error-budget / toil threshold, SREs can hand the pager back to the development team"
      - "Developers are never allowed to deploy"
      - "The SRE team absorbs unlimited toil regardless of service quality"
    answer: 1
    explanation: |
      Google's SRE arrangement is a middle path between 'throw it over the wall' and pure
      'you build it, you run it': SREs co-own operations but can hand the pager back if the
      service is too unreliable or toil-heavy, keeping developers motivated to build
      operable software.
    ref: "concepts.md#you-build-it-you-run-it"

  - id: incident-response-and-command-051
    difficulty: advanced
    tags: [3-cs, imag, framing]
    question: |
      Google's IMAG framing organizes incident management around the "3 C's." What are
      they?
    options:
      - "Collect, Categorize, Close"
      - "Coordinate, Communicate, Control"
      - "Contain, Correct, Confirm"
      - "Cause, Consequence, Correction"
    answer: 1
    explanation: |
      The SRE Workbook names Coordinate, Communicate, and Control as the pillars of incident
      management (IMAG) and notes that when response goes wrong, the culprit is usually in
      one of these three areas. Control maps to the IC, Communicate to the Comms lead, and
      Coordinate to Ops/Planning.
    ref: "concepts.md#the-3-cs-and-imag"

  - id: incident-response-and-command-052
    difficulty: expert
    tags: [3-cs, diagnosis, judgment]
    question: |
      A response is falling apart: customers are getting no updates while two teams
      unknowingly work the same subsystem, but the IC is clearly in charge and deciding.
      Using the 3 C's, which pillars have failed?
    options:
      - "Control and Coordinate"
      - "Communicate and Coordinate"
      - "Control and Communicate"
      - "All three equally"
    answer: 1
    explanation: |
      Communicate has failed (customers have no updates) and Coordinate has failed (two
      teams duplicating work, no deconfliction). Control is intact — the IC has authority
      and is deciding. Triaging a broken response by asking 'which C failed' is the intended
      diagnostic.
    ref: "concepts.md#the-3-cs-and-imag"

  - id: incident-response-and-command-053
    difficulty: advanced
    tags: [deputy, roles, roster]
    question: |
      In PagerDuty's six-role roster, what is the primary purpose of the Deputy role?
    options:
      - "To write the postmortem while the incident is ongoing"
      - "To act as the sole hands-on engineer applying fixes"
      - "To handle all customer-facing status-page updates"
      - "To serve as a hot-standby IC who catches what the IC misses and can take command"
    answer: 3
    explanation: |
      The Deputy is a trained, hot-standby Incident Commander: they watch for missed items
      (timers, un-circled-back roll-call items), manage the call itself, and can assume
      command instantly. Because they may take over, Deputies must be trained as ICs.
    ref: "concepts.md#the-full-role-roster-deputy-liaisons-sme-and-the-can-report"

  - id: incident-response-and-command-054
    difficulty: expert
    tags: [can-report, sme, communication]
    question: |
      The IC asks an SME "where are we?" during a SEV-1. What does a CAN report structure
      the answer into?
    options:
      - "Condition, Actions, Needs"
      - "Cause, Analysis, Notification"
      - "Context, Alert, Next-steps"
      - "Confirm, Assign, Notify"
    answer: 0
    explanation: |
      CAN = Condition (current state of the service, healthy or not), Actions (what's being
      done or needs doing), Needs (what support the resolver needs). It turns a rambling
      status into three structured lines and is a strong senior name-drop.
    ref: "concepts.md#the-full-role-roster-deputy-liaisons-sme-and-the-can-report"

  - id: incident-response-and-command-055
    difficulty: advanced
    tags: [liaisons, comms, roles]
    question: |
      PagerDuty splits incident communication into a Customer Liaison and an Internal
      Liaison. Which correctly describes the split?
    options:
      - "Customer Liaison pages SMEs; Internal Liaison posts the public status page"
      - "Both roles only exist for SEV-5 incidents"
      - "Customer Liaison drafts public/status-page updates and tracks affected-customer counts; Internal Liaison pages SMEs and notifies internal stakeholders like Finance/Legal"
      - "They are the same role with two names"
    answer: 2
    explanation: |
      The Customer Liaison is external-facing (public updates, affected-customer counts, the
      support channel); the Internal Liaison is internal-facing (paging SMEs, notifying
      Finance/Legal/Marketing/execs). Google collapses both into one 'Communications' role;
      PagerDuty separates them.
    ref: "concepts.md#the-full-role-roster-deputy-liaisons-sme-and-the-can-report"

  - id: incident-response-and-command-056
    difficulty: expert
    tags: [state-doc, scribe, artifacts]
    question: |
      How does the Live Incident State Document differ from the Scribe's timeline?
    options:
      - "The state doc is a mutable snapshot of the present (status, theories, eliminated causes, action items); the timeline is an append-only history of what happened when"
      - "They are the same document with different names"
      - "The timeline is mutable and the state doc is append-only"
      - "The state doc is only written after the incident closes"
    answer: 0
    explanation: |
      The state doc answers 'where are we right now, and what have we ruled out?' and is
      concurrently editable; the timeline answers 'what happened and when?' and is
      append-only. Google's SRE book calls maintaining the living state doc 'the incident
      commander's most important responsibility.'
    ref: "concepts.md#the-live-incident-state-document"

  - id: incident-response-and-command-057
    difficulty: advanced
    tags: [state-doc, tooling, mechanism]
    question: |
      Why does Google maintain the Live Incident State Document in a tool like Google Docs
      rather than a single-editor page?
    options:
      - "Because Google Docs is free"
      - "Because it automatically resolves the incident"
      - "So it can be concurrently edited by multiple responders in real time"
      - "To prevent anyone from reading it during the incident"
    answer: 2
    explanation: |
      The doc must be concurrently editable so several responders update the shared snapshot
      live; an edit-locked wiki page defeats the purpose. It's templated with critical info
      at the top and retained for the postmortem.
    ref: "concepts.md#the-live-incident-state-document"

  - id: incident-response-and-command-058
    difficulty: expert
    tags: [generic-mitigation, mitigate, judgment]
    question: |
      You do NOT yet know the root cause. Which of these is a valid GENERIC mitigation that
      works without understanding the specific bug?
    options:
      - "Hand-editing a config value you think is wrong"
      - "Pushing a forward code patch to correct the suspected logic"
      - "Draining traffic away from the affected cell/region"
      - "Adding a new feature flag and shipping it"
    answer: 2
    explanation: |
      Generic mitigations (rollback, drain/redirect, failover, load-shed) operate on the
      LOCATION of the problem, not its cause — 'you only need to know the location of the
      root cause.' Forward fixes and config tweaks require understanding the cause and are
      riskier under pressure.
    ref: "concepts.md#generic-mitigations"

  - id: incident-response-and-command-059
    difficulty: expert
    tags: [generic-mitigation, gke, case-study]
    question: |
      In the SRE Workbook's GKE "Cache Me If You Can" outage (a corrupt image, ~6h40m), what
      was identified as the real failure that prolonged recovery?
    options:
      - "The engineers weren't skilled enough to debug the image"
      - "There was no Incident Commander assigned"
      - "The team lacked a generic rollback mitigation, forcing them to diagnose before they could recover"
      - "The status page was down"
    answer: 2
    explanation: |
      The lesson wasn't about the bad image itself — it was that the team had no generic
      rollback path, so they were forced to fully diagnose before recovering. The
      mitigation gap, not the bug, drove the long outage. Location-based mitigation would
      have stopped impact sooner.
    ref: "concepts.md#generic-mitigations"

  - id: incident-response-and-command-060
    difficulty: expert
    tags: [severity, major-incident, distinction]
    question: |
      Which statement about the relationship between SEV-2 and "major incident" is correct?
    options:
      - "All major incidents are SEV-2s"
      - "SEV-2 and major incident are exactly the same thing"
      - "A SEV-1 is never a major incident"
      - "All SEV-2s are major incidents, but not all major incidents are SEV-2s"
    answer: 3
    explanation: |
      Severity sizes technical impact; 'major' is a separate organizational-activation
      threshold. All SEV-2s are major, but a SEV-1 (or a security SEV) is also major without
      being a SEV-2. 'Anything above SEV-3 is a major incident.'
    ref: "concepts.md#severity-definitions-and-the-major-incident-rule"

  - id: incident-response-and-command-061
    difficulty: advanced
    tags: [severity, uncertainty, judgment]
    question: |
      You genuinely cannot decide whether an incident is SEV-2 or SEV-3. What does standard
      practice say?
    options:
      - "Default to the lower severity to avoid over-reacting"
      - "Wait until the postmortem to classify it"
      - "Treat it as the higher severity when unsure"
      - "Average the two and call it SEV-2.5"
    answer: 2
    explanation: |
      'If unsure between two levels, treat it as the higher one' — the same round-up-under-
      uncertainty bias as 'declare early and often.' It's cheap to downgrade later; costly to
      have under-resourced a worse-than-expected incident.
    ref: "concepts.md#severity-definitions-and-the-major-incident-rule"

  - id: incident-response-and-command-062
    difficulty: advanced
    tags: [severity, sev1, definition]
    question: |
      Per PagerDuty's definitions, which characteristic most distinctly marks an incident as
      SEV-1?
    options:
      - "Elevated latency on a single non-critical endpoint"
      - "A cosmetic bug affecting no customers"
      - "It warrants public notification and liaison with executive teams (e.g. SLA breach or security/data exposure)"
      - "A failed unit test in CI"
    answer: 2
    explanation: |
      PagerDuty defines SEV-1 as warranting public notification and executive liaison,
      typically triggered by an SLA breach or security/data exposure. SEV-2 is 'critically
      impacting many customers' ability to use the product'; SEV-3 is minor but needs
      immediate attention.
    ref: "concepts.md#severity-definitions-and-the-major-incident-rule"

  - id: incident-response-and-command-063
    difficulty: expert
    tags: [itil, incident-vs-problem, distinction]
    question: |
      In ITIL terms, a rollback that restores service and the later work to identify and fix
      the defect belong to which processes, respectively?
    options:
      - "Both belong to incident management"
      - "Both belong to problem management"
      - "Incident management (rollback) and problem management (identify/fix the defect)"
      - "Change management (rollback) and incident management (fix)"
    answer: 2
    explanation: |
      Incident management restores service now (the rollback/workaround); problem management
      eliminates recurrence (identify root cause, fix the defect, record the known-error and
      workaround). SRE incident response ≈ incident+major-incident mgmt; the postmortem and
      its action items ≈ problem management.
    ref: "concepts.md#incident-vs-problem-vs-change-management-itil"

  - id: incident-response-and-command-064
    difficulty: advanced
    tags: [itil, known-error, definition]
    question: |
      In ITIL, what is a "known error"?
    options:
      - "Any error that has occurred more than once"
      - "An incident that has been closed"
      - "A change that failed during deployment"
      - "A problem with a documented root cause and a workaround"
    answer: 3
    explanation: |
      A known error is a problem whose root cause is documented and for which a workaround
      is recorded for reuse — the SRE analogue is a known-issue runbook entry. It lets
      future incidents be mitigated quickly even before a permanent fix ships.
    ref: "concepts.md#incident-vs-problem-vs-change-management-itil"

  - id: incident-response-and-command-065
    difficulty: expert
    tags: [single-writer, coordination, judgment]
    question: |
      Two engineers are simultaneously applying different fixes to production during an
      incident. What is the core problem, and what principle prevents it?
    options:
      - "Nothing is wrong — parallel fixes resolve incidents faster"
      - "The only problem is that they didn't file a change ticket"
      - "The system state becomes unknowable and changes can mask or amplify each other; the single-writer principle (only the designated Ops lead mutates, IC arbitrates conflicts) prevents it"
      - "The problem is that they should each work in a separate region"
    answer: 2
    explanation: |
      Uncoordinated parallel change makes state unknowable and lets one fix mask or worsen
      another ('freelancing'). The SRE book's rule: 'the operations team should be the only
      group modifying the system.' The IC arbitrates conflicting proposals; the designated
      writer executes and narrates each change.
    ref: "concepts.md#the-single-writer-principle"

  - id: incident-response-and-command-066
    difficulty: advanced
    tags: [single-writer, narration, mechanism]
    question: |
      Under the single-writer principle, why must every change to the system be announced in
      the incident channel as it happens?
    options:
      - "To assign blame later"
      - "Because status pages require it"
      - "To slow responders down deliberately"
      - "So the timeline and state doc stay accurate and no two responders act blind"
    answer: 3
    explanation: |
      Narrating each mutation ('rolling back web tier to build 1234 now') keeps the timeline
      and state doc accurate and ensures responders aren't acting on stale assumptions about
      the system's state. It's how Coordinate and Control are maintained.
    ref: "concepts.md#the-single-writer-principle"

  - id: incident-response-and-command-067
    difficulty: advanced
    tags: [automation, tooling, declaration]
    question: |
      An interviewer asks "what should fire automatically the moment you declare an
      incident?" Which set best reflects mature incident tooling?
    options:
      - "Auto-create the incident channel, spin up the bridge, open the state doc, page on-call + IC, post a status-page entry, start recording"
      - "Send a company-wide email to every employee"
      - "Automatically roll back the last ten deploys"
      - "Delete all logs to save space"
    answer: 0
    explanation: |
      Mature platforms (PagerDuty, incident.io, FireHydrant, Rootly, Opsgenie, Slack bots)
      collapse setup into one action: create channel, spin up bridge, open state doc from a
      template, page on-call + IC, post an initial status update, and record the call — so
      responders spend attention on the incident, not logistics.
    ref: "concepts.md#incident-automation-and-tooling"

  - id: incident-response-and-command-068
    difficulty: expert
    tags: [tooling, out-of-band, meta-2021, judgment]
    question: |
      Reflecting on the 2021 Meta/Facebook BGP outage, what is the key design lesson for
      incident response tooling?
    options:
      - "Always keep more spare capacity servers online"
      - "Incident tooling and comms must not depend on the same infrastructure that can fail — provide out-of-band comms and break-glass access"
      - "Never use BGP in a production network"
      - "Postmortems should be skipped for network incidents"
    answer: 1
    explanation: |
      Meta's internal tools, badge access, and comms rode the same network that the bad BGP
      change took down, so responders were partially locked out. The lesson: don't couple
      the response infrastructure to the failing system; provide out-of-band channels and
      pre-provisioned break-glass access, and rehearse them.
    ref: "concepts.md#out-of-band-comms-and-break-glass-access"

  - id: incident-response-and-command-069
    difficulty: expert
    tags: [out-of-band, break-glass, mechanism]
    question: |
      What distinguishes "break-glass access" as a resilience measure for incident response?
    options:
      - "It is the standard daily login path for all engineers"
      - "It is a monitoring dashboard for break-fix metrics"
      - "It is pre-provisioned emergency access that does not depend on the failing control plane, exercised in advance so it works under stress"
      - "It automatically pages the entire company"
    answer: 2
    explanation: |
      Break-glass access is an emergency credential/path independent of the normal (possibly
      failing) control plane. The critical detail is that it must be tested in advance —
      unexercised break-glass paths routinely fail exactly when needed.
    ref: "concepts.md#out-of-band-comms-and-break-glass-access"

  - id: incident-response-and-command-070
    difficulty: advanced
    tags: [drills, wheel-of-misfortune, training]
    question: |
      What is Google's "Wheel of Misfortune"?
    options:
      - "A tool that randomly terminates production instances"
      - "A role-play exercise where the team re-enacts a past outage to practice IC/Ops/Comms roles"
      - "A dashboard ranking teams by incident count"
      - "A postmortem template"
    answer: 1
    explanation: |
      Wheel of Misfortune is a role-play RPG: one person plays 'the incident' from a past
      outage while others practice the response roles live. It trains the process and human
      muscle memory — 'practice when the world is not on fire' — distinct from chaos
      engineering which tests the system.
    ref: "concepts.md#practicing-incident-response-drills-and-game-days"

  - id: incident-response-and-command-071
    difficulty: expert
    tags: [drills, chaos-engineering, boundary]
    question: |
      How does incident-response drilling (game days, Wheel of Misfortune) differ in purpose
      from chaos engineering?
    options:
      - "They are identical practices"
      - "Chaos engineering only runs in staging; drills only run in production"
      - "Drills train the humans and the response process; chaos engineering injects faults to test the system's resilience"
      - "Drills require an outage; chaos engineering does not"
    answer: 2
    explanation: |
      Both build confidence, but the target differs: game days/Wheel of Misfortune/tabletops
      train IC muscle memory, role clarity, and comms cadence (the process); chaos
      engineering injects faults to test whether the system itself withstands failure. See
      reliability-ops/chaos-engineering-and-resilience-testing for the mechanics.
    ref: "concepts.md#practicing-incident-response-drills-and-game-days"

  - id: incident-response-and-command-072
    difficulty: expert
    tags: [on-call-load, numbers, sustainability]
    question: |
      Per Google SRE guidance, roughly how many incidents per 12-hour on-call shift is
      considered sustainable, and why?
    options:
      - "About 10 per shift, since incidents are usually quick"
      - "About 2 per shift, because each incident plus its follow-up averages ~6 hours of engineer time"
      - "Unlimited, as long as they get acknowledged"
      - "Exactly 1 per week"
    answer: 1
    explanation: |
      Google budgets ~6 hours of engineer time per incident (handling plus follow-up), so a
      guideline of ~2 incidents per 12-hour shift keeps responders able to do each one
      justice. Beyond that, quality degrades and follow-up gets skipped.
    ref: "concepts.md#on-call-load-role-rotation-and-the-mttr-of-familiarity"

  - id: incident-response-and-command-073
    difficulty: advanced
    tags: [role-rotation, fatigue, long-running]
    question: |
      On a 10+ hour incident, roughly how often should the IC and other roles be rotated,
      and why?
    options:
      - "Never — continuity requires the same people throughout"
      - "Roughly every 4 hours, because fatigued responders make mistakes and cause secondary incidents"
      - "Every few minutes to keep everyone fresh"
      - "Only when someone physically collapses"
    answer: 1
    explanation: |
      Long incidents (e.g. the Workbook's PagerDuty NTP case) rotate roles about every 4
      hours to fight fatigue. Tired responders trigger secondary incidents; the Scribe's
      timeline and the state doc make the handoff fast without losing context.
    ref: "concepts.md#on-call-load-role-rotation-and-the-mttr-of-familiarity"

  - id: incident-response-and-command-074
    difficulty: expert
    tags: [runbooks, mttr, numbers]
    question: |
      Google SRE cites roughly what MTTR benefit from responders having a well-documented
      playbook versus improvising?
    options:
      - "No measurable difference"
      - "About a 3× improvement in MTTR"
      - "About a 100× improvement"
      - "It increases MTTR because reading the runbook takes time"
    answer: 1
    explanation: |
      Google SRE reports roughly a 3× improvement in MTTR when on-call has a well-thought-out
      playbook rather than improvising — the strongest argument for keeping runbooks current.
      The runbook mechanics themselves live in reliability-ops/on-call-escalation-and-runbooks.
    ref: "concepts.md#on-call-load-role-rotation-and-the-mttr-of-familiarity"

  - id: incident-response-and-command-075
    difficulty: expert
    tags: [handoff, command, script]
    question: |
      Per the Google SRE book, what must the OUTGOING incident commander do before leaving a
      handoff call?
    options:
      - "Nothing — the incoming IC figures it out from the timeline"
      - "Immediately close the incident"
      - "State the handoff explicitly and not leave until receiving firm acknowledgment, then broadcast the change of command to everyone"
      - "Silently drop off once a replacement joins the call"
    answer: 2
    explanation: |
      The SRE book prescribes an explicit ritual ('You're now the incident commander,
      okay?') and says the outgoing commander must not leave until receiving firm
      acknowledgment, and the change of leadership must be announced to everyone so it's
      always clear who is in charge.
    ref: "concepts.md#handoffs--long-running-incidents"

  - id: incident-response-and-command-076
    difficulty: advanced
    tags: [ics, span-of-control, nims, numbers]
    question: |
      NIMS/ICS doctrine specifies a recommended span of control for one supervisor. What is
      it?
    options:
      - "1:1 — one supervisor per responder"
      - "1:20 to maximize efficiency"
      - "1:5 as the recommended ratio, with 1:3 to 1:7 acceptable"
      - "There is no recommended limit"
    answer: 2
    explanation: |
      NIMS recommends a span of control of about 1:5, with 1:3 to 1:7 acceptable. Beyond
      that, one person can't maintain situational awareness, so the IC delegates to
      sub-leads — the doctrinal grounding for the informal '~5-7 people' guideline.
    ref: "concepts.md#the-incident-command-system-ics"

  - id: incident-response-and-command-077
    difficulty: advanced
    tags: [imag, declare-early, best-practices]
    question: |
      Among the SRE Workbook's foundational incident-management best practices, which is the
      one teams most often forget?
    options:
      - "Maintain a clear line of command"
      - "Designate clearly defined roles"
      - "Keep a working record of debugging and mitigation"
      - "Declare incidents early and often (and pre-agree on incident criteria)"
    answer: 3
    explanation: |
      The four practices are: clear line of command, defined roles, a working record, and —
      the easily-forgotten one — declare early and often. Pre-establishing the criteria for
      'what counts as an incident,' derived from past outages, is itself a named practice.
    ref: "concepts.md#the-3-cs-and-imag"

  - id: incident-response-and-command-078
    difficulty: advanced
    tags: [case-study, belgium, preparation]
    question: |
      The SRE Workbook's Belgium data-center lightning strike (four strikes in ~2 minutes)
      is cited as an example of what?
    options:
      - "A poorly-run incident with massive data loss"
      - "A well-run incident where early declaration and disciplined command limited permanent loss to a tiny fraction (~0.000001%)"
      - "Why data centers should never be built in Belgium"
      - "A case where no incident was declared at all"
    answer: 1
    explanation: |
      Despite catastrophic power events, disciplined incident command and early declaration
      meant only about 0.000001% of persistent disk was permanently lost. It's a canonical
      example that preparation and process turn a potential catastrophe into a footnote.
    ref: "concepts.md#canonical-incident-stories"
