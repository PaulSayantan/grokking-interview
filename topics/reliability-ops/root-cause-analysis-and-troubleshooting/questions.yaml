topic: "Root-Cause Analysis & Troubleshooting"
domain: reliability-ops
topic_slug: root-cause-analysis-and-troubleshooting
version: 1
questions:
  - id: root-cause-analysis-and-troubleshooting-001
    difficulty: beginner
    tags: [change-first, heuristic, first-question]
    question: |
      During most production incidents, what is the single highest-yield first
      question to ask, because it targets where the base rate of causes is highest?
    options: ["Which engineer wrote the failing code, and had it been peer-reviewed?", "How many users are affected, and in which regions and tiers exactly?", "What changed recently (deploy, config, flag, dependency, traffic)?", "Is the database CPU high, and are its slow-query logs growing fast?"]
    answer: 2
    explanation: |
      The change-first heuristic: the strong majority of incidents are triggered by a
      recent change — a deploy, config push, flag flip, dependency update, or traffic
      shift. Systems that are just running tend to be stable, so "what changed?" has the
      highest probability of pointing at the cause and often at the fastest mitigation.
    ref: "concepts.md#the-change-first-heuristic"

  - id: root-cause-analysis-and-troubleshooting-002
    difficulty: intermediate
    tags: [percentiles, latency, differential]
    question: |
      Your dashboard shows p50 latency flat but p99 climbing sharply. What does this
      most strongly suggest?
    options: ["Every request is uniformly slower because a shared downstream dependency degraded across the board", "Traffic has dropped to zero, so only a few stragglers remain and skew the tail upward", "The service is returning errors quickly, which inflates the tail while median stays flat", "A subset of requests is slow — a hot shard, one bad host, GC pauses, or tail contention"]
    answer: 3
    explanation: |
      A flat p50 with a rising p99 means the typical request is fine but the tail is
      suffering — pointing at something affecting only some requests: a hot shard/key,
      one unhealthy host, GC pauses, or tail contention. A systemic slowdown would lift
      p50 and p99 together.
    ref: "concepts.md#signals-to-read-golden-signals-red-use"

  - id: root-cause-analysis-and-troubleshooting-003
    difficulty: beginner
    tags: [golden-signals, definitions]
    question: |
      What are Google SRE's four golden signals?
    options: ["Latency, traffic, errors, saturation", "CPU, memory, disk, network", "Rate, errors, duration, cost", "Availability, durability, latency, throughput"]
    answer: 0
    explanation: |
      The four golden signals are latency, traffic, errors, and saturation. RED (rate,
      errors, duration) is a request-centric subset and USE (utilization, saturation,
      errors) is the resource-centric counterpart. Telemetry/alerting mechanics for these
      belong to observability.
    ref: "concepts.md#signals-to-read-golden-signals-red-use"

  - id: root-cause-analysis-and-troubleshooting-004
    difficulty: advanced
    tags: [single-root-cause, swiss-cheese, complex-systems]
    question: |
      A senior interviewer asks, "Is there always a single root cause?" What is the
      strongest staff-level answer?
    options: ["Yes — every incident traces back to one true root cause if you ask 'why' enough times", "Yes — the root cause is always the single most recent deploy, since running systems never fail on their own", "No — complex failures need multiple defense holes to align (Swiss cheese); 'the root cause' is a stopping choice, so you deliver multiple contributing factors", "No — but you should still pick the one lowest-cost cause to fix and deliberately ignore the rest to save investigation time"]
    answer: 2
    explanation: |
      Per Cook's "How Complex Systems Fail" and Reason's Swiss-cheese model, complex
      systems run degraded as normal and an accident requires holes in several defense
      layers to line up at once. Naming one root cause is a convenience/blame-driven
      stopping rule; a good RCA surfaces multiple contributing factors and layered fixes.
    ref: "concepts.md#the-myth-of-the-single-root-cause"

  - id: root-cause-analysis-and-troubleshooting-005
    difficulty: intermediate
    tags: [5-whys, limits]
    question: |
      Which is a fundamental limitation of the 5 Whys technique?
    options: ["It requires specialized fault-tree software and a trained facilitator to run at all", "It only works for hardware faults and cannot be applied to software or process failures", "It always takes exactly five iterations, and stopping earlier or later invalidates the result", "It walks a single linear chain, so it can miss parallel contributing factors"]
    answer: 3
    explanation: |
      5 Whys follows one linear cause chain, so it can miss the multiple, interacting
      contributing factors that real complex failures have. It can also stop too early
      (often at 'human error'), go arbitrarily deep, and is biased by whoever asks the
      questions. For multi-causal problems, use fishbone or fault-tree analysis.
    ref: "concepts.md#5-whys-and-its-limits"

  - id: root-cause-analysis-and-troubleshooting-006
    difficulty: intermediate
    tags: [triage, mitigate-first, incident]
    question: |
      Users are completely down and you have a strong suspect (a deploy 10 minutes ago).
      What should you generally do first?
    options: ["Mitigate first — roll back the suspect deploy — then diagnose fully later", "Perform a full root-cause analysis and confirm the mechanism before touching anything", "Open a line-by-line code review of the suspect deploy to fully understand it first", "Wait a while to see if the system self-heals before intervening at all"]
    answer: 0
    explanation: |
      Triage means mitigate before you diagnose when users are down. Rolling back the
      suspect deploy both restores service fastest and tests the hypothesis (if the
      symptom clears, the change was involved). Full understanding is the postmortem's
      job; don't debug a burning building.
    ref: "concepts.md#the-scientific-method-for-troubleshooting"

  - id: root-cause-analysis-and-troubleshooting-007
    difficulty: intermediate
    tags: [bisection, tracing, localization]
    question: |
      A request traverses 12 microservices and is slow, but you don't know which hop.
      What is the fastest way to localize the slow hop?
    options: ["Read the source of all 12 services top to bottom looking for an obvious slow loop", "Use distributed tracing to see per-hop span latency and find the dominant span", "Restart each of the 12 services one at a time until the request happens to get faster", "Increase the client and server timeout on every one of the 12 services uniformly"]
    answer: 1
    explanation: |
      Distributed tracing shows the per-hop latency of a single request, so the slow span
      lights up immediately. Without tracing, you fall back to bisecting the call path
      (test the middle to halve the suspect space each probe). Tracing mechanics belong to
      observability.
    ref: "concepts.md#bisection-localizing-the-fault"

  - id: root-cause-analysis-and-troubleshooting-008
    difficulty: advanced
    tags: [correlation-causation, mechanism]
    question: |
      What best promotes an observed correlation to an established causal claim during an
      incident investigation?
    options: ["The two graphs move at the same time with an identical spike shape and slope", "The correlation appears in more than one region and across several availability zones", "Both metrics are red on the dashboard and crossed their alert thresholds together", "A plausible mechanism plus a confirming intervention (e.g. remove the change and watch the symptom resolve)"]
    answer: 3
    explanation: |
      Correlation only narrows the search. To establish causation you want a plausible
      mechanism linking cause to effect ("no index → DB CPU saturates → requests queue")
      and, ideally, an intervention that confirms it (roll back / remove load and observe
      the symptom clear). Coincidence, confounders, and reverse causation all produce
      correlations without causation.
    ref: "concepts.md#correlation-vs-causation"

  - id: root-cause-analysis-and-troubleshooting-009
    difficulty: intermediate
    tags: [fishbone, ishikawa, categories]
    question: |
      A fishbone (Ishikawa) diagram for a software incident commonly organizes candidate
      causes into which categories?
    options: ["Blame, cost, schedule, scope", "CPU, memory, disk, network", "People, process, technology, environment", "Detect, diagnose, mitigate, resolve"]
    answer: 2
    explanation: |
      A fishbone diagram forces breadth by brainstorming causes across categories — for
      software/SRE typically People, Process, Technology, and Environment (adapted from the
      manufacturing 6 Ms). Its strength is surfacing the multiple factors that combined; its
      weakness is that it lists candidates without ranking them.
    ref: "concepts.md#fishbone-ishikawa-diagrams"

  - id: root-cause-analysis-and-troubleshooting-010
    difficulty: advanced
    tags: [fault-tree, gates, spof]
    question: |
      In a fault tree, what does an OR gate leading down to a single basic event
      represent?
    options: ["A single point of failure — that one event alone causes the parent failure", "Defense in depth — several independent failures must occur together to reach the parent", "A redundant, highly available path where a backup transparently takes over on failure", "An event that can never occur and is included only to document a mitigated risk"]
    answer: 0
    explanation: |
      An OR gate means any one child event alone causes the parent, so an OR path down to a
      single basic event is a single point of failure — the highest-priority fix. AND gates
      (all children required) represent defense in depth; adding redundancy converts ORs into
      ANDs so no single fault suffices.
    ref: "concepts.md#fault-tree-analysis-fta"

  - id: root-cause-analysis-and-troubleshooting-011
    difficulty: beginner
    tags: [vocabulary, symptom, proximate-cause]
    question: |
      "The pod was OOM-killed" is best classified as which of the following?
    options: ["The root cause — the deepest systemic reason, so bumping the memory limit fully resolves it", "A proximate (immediate) cause — the deeper question is why memory grew unbounded and why nothing caught it", "A contributing factor — it merely raised the severity but was not on the direct failure path", "The trigger — the external change or event that set the whole failure sequence in motion"]
    answer: 1
    explanation: |
      "OOM-killed" is the proximate cause — the thing that directly produced the symptom.
      Treating it as the root cause leads to a shallow fix (bump the limit). The root
      questions are why memory grew unbounded, why the limit was set where it was, and why
      defenses didn't catch it before prod.
    ref: "concepts.md#symptom-vs-cause-vs-trigger"

  - id: root-cause-analysis-and-troubleshooting-012
    difficulty: intermediate
    tags: [anti-method, flailing, one-variable]
    question: |
      Why is changing several things at once the cardinal sin of incident troubleshooting?
    options: ["It is too slow to execute under the time pressure of a live incident", "It always violates the organization's change-freeze and deployment-window policy", "It requires manager approval before any concurrent changes can be applied", "If the symptom changes you can't tell which change did it, and you may introduce a new fault"]
    answer: 3
    explanation: |
      The scientific method requires changing one variable at a time. If you change many at
      once and the symptom shifts, you can't attribute the effect (or rule out an unrelated
      factor), and you may have added a new problem. Random flailing is fast per step but may
      never converge and teaches nothing.
    ref: "concepts.md#the-scientific-method-for-troubleshooting"

  - id: root-cause-analysis-and-troubleshooting-013
    difficulty: intermediate
    tags: [use-method, resources, saturation]
    question: |
      Brendan Gregg's USE method characterizes every resource by which three attributes?
    options: ["Uptime, speed, errors", "Usage, size, efficiency", "Utilization, saturation, errors", "Utilization, security, encryption"]
    answer: 2
    explanation: |
      USE stands for Utilization, Saturation, and Errors, applied to every resource (CPU,
      disk, NIC, connection pool). It is excellent for the "which resource is the bottleneck?"
      question. RED (rate, errors, duration) is the request-centric counterpart for services.
    ref: "concepts.md#signals-to-read-golden-signals-red-use"

  - id: root-cause-analysis-and-troubleshooting-014
    difficulty: advanced
    tags: [latency, errors, fast-fail, circuit-breaker]
    question: |
      Error rate is up but latency has actually gone DOWN. What is a likely explanation?
    options: ["Requests are failing fast — a circuit breaker is open or load is being shed/rejected quickly", "The database is slow, so queries are queuing behind a saturated connection pool", "The network is saturated, adding round-trip delay to every downstream call", "A memory leak is building up, forcing longer and more frequent GC pauses"]
    answer: 0
    explanation: |
      When errors rise while latency falls, requests are failing quickly rather than slowly —
      classic signs are an open circuit breaker, fast rejection/load-shedding, or an early
      validation error. A slow dependency, network saturation, or a leak would push latency up,
      not down.
    ref: "concepts.md#signals-to-read-golden-signals-red-use"

  - id: root-cause-analysis-and-troubleshooting-015
    difficulty: intermediate
    tags: [differential-diagnosis, isolated-vs-uniform]
    question: |
      A symptom is isolated to a single host while all peer hosts are healthy. What does
      this most strongly imply about the cause?
    options: ["The cause is a shared dependency or global config change affecting every host equally", "There is no real cause; the isolated symptom is just measurement noise on one host", "The cause must be the most recent deploy, since it was rolled out to every host at once", "The cause is specific to that host (bad node, hot key, poison-pill payload)"]
    answer: 3
    explanation: |
      Isolated symptoms point at specific causes (a bad node, a hot key, a poison-pill
      request on one shard). Uniform symptoms across all slices point at shared causes (a
      common dependency, a global config, a version rolled everywhere). That isolated-vs-uniform
      distinction routes the whole investigation.
    ref: "concepts.md#differential-diagnosis-and-what-changed-axes"

  - id: root-cause-analysis-and-troubleshooting-016
    difficulty: beginner
    tags: [git-bisect, binary-search]
    question: |
      A bug appeared somewhere across 1000 commits between a known-good and known-bad
      revision. Using `git bisect`, roughly how many test builds are needed to find the
      offending commit?
    options: ["About 1000", "About 10 (log2 of 1000)", "About 500", "Exactly 5"]
    answer: 1
    explanation: |
      Bisection is binary search over the commit range: each test halves the suspect space, so
      it takes about ceil(log2 N) tests — roughly 10 for 1000 commits. The same divide-and-conquer
      logic applies to bisecting a request path or a population dimension.
    ref: "concepts.md#bisection-localizing-the-fault"

  - id: root-cause-analysis-and-troubleshooting-017
    difficulty: advanced
    tags: [human-error, blame, root-cause]
    question: |
      A postmortem concludes with "root cause: the engineer ran the wrong command." Why is
      this an anti-pattern?
    options: ["Human error is never a root cause — if one mistake could cause an outage, the system's missing defenses are the real story", "Because the engineer should be formally disciplined and retrained rather than merely named", "Because commands can never cause outages, so the conclusion misidentifies the mechanism", "Because the real root cause is always a hardware fault sitting underneath the command"]
    answer: 0
    explanation: |
      Stopping at "human error" is both a too-early stop and the classic blame trap. If a single
      human mistake can take down production, the interesting question is why the defenses (review,
      guardrails, canary, alerting — the other Swiss-cheese slices) let it through. The fix targets
      those systemic gaps, not the person.
    ref: "concepts.md#the-myth-of-the-single-root-cause"

  - id: root-cause-analysis-and-troubleshooting-018
    difficulty: intermediate
    tags: [change-first, changes-you-dont-own]
    question: |
      Your team didn't deploy anything, yet an incident began. Why is "we didn't deploy" NOT
      the same as "nothing changed"?
    options: ["Because deploys never actually cause incidents, so the absence of one is irrelevant", "Because incidents can only ever be caused by code in your own repository", "A dependency may have shipped, a config store flipped, a cert expired, a cron ran, data crossed a threshold, or traffic changed shape", "Because the on-call engineer must have quietly made a manual change and forgotten"]
    answer: 2
    explanation: |
      The change-first heuristic uses a wide definition of "change." Even if your repo didn't
      deploy, an upstream dependency may have shipped, a config/flag store flipped, a certificate
      expired, a scheduled job ran, data crossed a threshold, or traffic changed shape. Widen the
      change search beyond your own deploys.
    ref: "concepts.md#the-change-first-heuristic"

  - id: root-cause-analysis-and-troubleshooting-019
    difficulty: intermediate
    tags: [scientific-method, hypothesis, testable]
    question: |
      Which of these is a good, testable troubleshooting hypothesis?
    options: ["The database just seems generally unhappy and sluggish for some reason", "Something somewhere in the network layer is probably wrong right now", "It's probably just some kind of bug somewhere in the codebase", "The new query lacks an index, so DB CPU saturates and requests queue"]
    answer: 3
    explanation: |
      A useful hypothesis is specific and testable and names a mechanism — "the new query lacks
      an index, so DB CPU saturates and requests queue" can be checked (look at the query plan and
      DB CPU) and disconfirmed. Vague statements like "the DB is unhappy" can't be tested and don't
      converge.
    ref: "concepts.md#the-scientific-method-for-troubleshooting"

  - id: root-cause-analysis-and-troubleshooting-020
    difficulty: advanced
    tags: [confounder, common-cause, correlation]
    question: |
      CPU and latency both spiked at the same instant. Before concluding "high CPU caused the
      latency," what confounding possibility must you rule out?
    options: ["That the request latency physically caused the CPU hardware to be installed", "That a third factor (e.g. a traffic surge) drove BOTH CPU and latency", "That the monitoring dashboard's clock is wrong and no real spike occurred at all", "That CPU and latency are secretly the very same underlying metric measured twice"]
    answer: 1
    explanation: |
      This is a common-cause/confounder trap: a traffic surge can drive both CPU and latency up,
      so "high CPU" isn't the root — the surge is. Two correlated signals may share a hidden driver;
      you need a mechanism and ideally an intervention to establish which, if any, causes which.
    ref: "concepts.md#correlation-vs-causation"

  - id: root-cause-analysis-and-troubleshooting-021
    difficulty: beginner
    tags: [red-method, services]
    question: |
      Tom Wilkie's RED method for monitoring a request-serving service tracks which three
      things?
    options: ["Rate, errors, duration", "Reliability, efficiency, durability", "Requests, endpoints, dependencies", "Retries, evictions, deadlocks"]
    answer: 0
    explanation: |
      RED = Rate (requests per second), Errors (failed requests), Duration (latency
      distribution). It's a request-centric subset of the golden signals, ideal for a stateless
      request handler. USE is its resource-centric counterpart.
    ref: "concepts.md#signals-to-read-golden-signals-red-use"

  - id: root-cause-analysis-and-troubleshooting-022
    difficulty: advanced
    tags: [fault-tree, and-gate, defense-in-depth]
    question: |
      In fault-tree analysis, converting an OR gate into an AND gate (by adding redundancy)
      has what reliability effect?
    options: ["It creates a single point of failure where one basic event alone can trigger the whole top event", "It removes the need for monitoring, since redundant paths are assumed to never fail together", "It makes the top event more likely, since now more components must be kept healthy at once", "It requires all children to fail together, implementing defense in depth so no single fault is sufficient"]
    answer: 3
    explanation: |
      An AND gate requires all its child faults to occur simultaneously for the parent to occur.
      Redundancy turns an OR (any one fault suffices) into an AND (all must fail) — defense in
      depth — so a single fault no longer brings down the top event. Minimal cut sets of size 1
      are the SPOFs you most want to eliminate.
    ref: "concepts.md#fault-tree-analysis-fta"

  - id: root-cause-analysis-and-troubleshooting-023
    difficulty: intermediate
    tags: [tools, metrics-traces-logs]
    question: |
      In the "metrics/traces/logs" mental model, which signal is best for answering WHERE in
      a multi-service request the problem is?
    options: ["Metrics", "Logs", "Distributed traces", "The change/audit log"]
    answer: 2
    explanation: |
      Metrics tell you THAT something is wrong and WHEN it started; distributed traces tell you
      WHERE (which hop/span in a call graph); logs give the WHAT/WHY detail for specific events;
      the change log tells you what you did to yourself. Traces are the localization tool for the
      slow hop.
    ref: "concepts.md#tools-of-the-trade-cross-references"

  - id: root-cause-analysis-and-troubleshooting-024
    difficulty: advanced
    tags: [rollback, mitigation, when-not-to]
    question: |
      When might rolling back the suspect deploy NOT be the right first mitigation?
    options: ["When the change was small enough that a tiny diff like that could never plausibly cause a real outage", "When the change carried an irreversible data migration, when a forward fix is faster, or when the change is provably unrelated to the onset", "Rollback is always the wrong first move, since re-deploying the old build inevitably makes any incident worse", "When the deploy happened more than an hour ago, because a change that old is guaranteed to be unrelated"]
    answer: 1
    explanation: |
      Rollback is usually the safest fast mitigation, but not always: if the change included an
      irreversible/forward-only data migration, if a forward fix is faster, or if you can prove the
      change is unrelated to the symptom's onset, rolling back may be harmful or pointless. Judgment
      is required; the default lean is still toward fast rollback.
    ref: "concepts.md#the-change-first-heuristic"

  - id: root-cause-analysis-and-troubleshooting-025
    difficulty: intermediate
    tags: [percentiles, averages, tail]
    question: |
      Why do experienced responders reason in percentiles (p50/p99/p99.9) rather than
      averages when diagnosing latency?
    options: ["The average blends the healthy majority with the suffering tail, hiding the tail pain where user impact and saturation first show up", "Averages are much harder to compute than percentiles, so teams avoid them under time pressure", "Percentiles use far less storage than averages, which is the only reason responders prefer them", "Averages are only mathematically valid for error rates and can never be applied to latency data"]
    answer: 0
    explanation: |
      "Averages lie": a mean mixes the many fast requests with the few very slow ones, so it can
      look fine while the tail suffers. Tail latency (p99/p99.9) is where user pain and impending
      saturation appear first, so percentiles are the right lens. Histogram/percentile mechanics
      belong to observability.
    ref: "concepts.md#signals-to-read-golden-signals-red-use"

  - id: root-cause-analysis-and-troubleshooting-026
    difficulty: advanced
    tags: [retry-storm, reverse-causation, cascading]
    question: |
      You observe retries spiking alongside errors and are tempted to treat retries as a
      harmless symptom. What subtle causal trap should you consider?
    options: ["The retry metric is probably just miscounted and does not reflect any real client behavior", "Retries never add any load, so they cannot possibly influence the error rate you observe", "Errors always cause retries and nothing else matters, so the direction of causation is settled", "Reverse causation — the retries may be amplifying the errors (a retry storm), not merely reflecting them"]
    answer: 3
    explanation: |
      This is reverse/feedback causation: retries can amplify load on a sick service and drive
      more errors (a retry storm), so they are not a passive symptom — they may be part of the
      loop sustaining the incident. See cascading-failures; the mitigation may be to disable retries
      and shed load rather than add capacity.
    ref: "concepts.md#correlation-vs-causation"

  - id: root-cause-analysis-and-troubleshooting-027
    difficulty: beginner
    tags: [5-whys, technique]
    question: |
      What is the core idea of the 5 Whys technique?
    options: ["Ask five different engineers for their opinion and go with whichever answer the majority gives", "Wait a full five minutes before taking any action, letting the system settle on its own first", "Repeatedly ask 'why?' to walk from a symptom down a chain of causes to something actionable", "Try five different candidate fixes in a row and simply keep whichever one appears to work"]
    answer: 2
    explanation: |
      5 Whys (Toyota Production System) repeatedly asks "why?" — roughly five times — to move from
      a symptom down a chain of causes to an actionable one. It's cheap and good for simple,
      mostly-linear problems, but its linearity is its main weakness.
    ref: "concepts.md#5-whys-and-its-limits"

  - id: root-cause-analysis-and-troubleshooting-028
    difficulty: advanced
    tags: [swiss-cheese, layered-defenses]
    question: |
      In James Reason's Swiss-cheese model, an incident occurs when what happens?
    options: ["The holes in multiple successive defense layers momentarily line up so a hazard passes through all of them", "A single defense layer is permanently removed, and that one gap alone is enough to cause the incident", "The system simply exceeds its configured CPU limit, which is what the model is really about", "An engineer makes exactly one mistake, and that single human error is the whole of the model"]
    answer: 0
    explanation: |
      Each defense layer (review, tests, canary, monitoring, rate limits, on-call) is a slice of
      cheese with holes. An accident requires the holes across successive layers to align at the
      same moment so the hazard passes through every layer — which is exactly why closing any one
      hole would have prevented it and why there is no single "the" cause.
    ref: "concepts.md#the-myth-of-the-single-root-cause"

  - id: root-cause-analysis-and-troubleshooting-029
    difficulty: intermediate
    tags: [differential-diagnosis, axes, what-changed]
    question: |
      Which set of axes best captures the "differential diagnosis" slicing you use to
      separate healthy from unhealthy requests?
    options: ["Cost (dollars), latency (ms), throughput (rps), durability (data safety)", "Detect (alert), diagnose (find cause), mitigate (stop pain), resolve (fix root)", "CPU (compute), memory (heap), disk (I/O), network (packet loss)", "Where (region/host/shard), who (customer/client), what (endpoint/flag), when (onset time)"]
    answer: 3
    explanation: |
      Differential diagnosis slices the symptom by where (region/AZ/host/shard), who
      (customer/tenant/client/API version), what (endpoint/operation/feature flag), and when
      (onset time correlated with deploys/crons/expiries). The axis that cleanly separates good
      from bad points at the cause.
    ref: "concepts.md#differential-diagnosis-and-what-changed-axes"

  - id: root-cause-analysis-and-troubleshooting-030
    difficulty: intermediate
    tags: [saturation, leading-indicator]
    question: |
      Among the four golden signals, which is described as the leading indicator of impending
      overload?
    options: ["Traffic", "Saturation", "Errors", "Latency"]
    answer: 1
    explanation: |
      Saturation measures how full the most constrained resource is (CPU, memory, threads,
      connections, IOPS). It tends to climb before errors and severe latency appear, making it the
      leading indicator of impending overload — you can act before requests start failing.
    ref: "concepts.md#signals-to-read-golden-signals-red-use"

  - id: root-cause-analysis-and-troubleshooting-031
    difficulty: advanced
    tags: [fta, minimal-cut-set, spof]
    question: |
      In fault-tree analysis, a "minimal cut set" of size 1 corresponds to what?
    options: ["A fully redundant subsystem in which a standby transparently takes over on any failure", "An event that requires three independent simultaneous failures to occur together", "A single point of failure — one basic event that alone can cause the top event", "A monitoring gap only, meaning the fault exists but simply went undetected by alerting"]
    answer: 2
    explanation: |
      A minimal cut set is the smallest combination of basic events that together cause the top
      event. A cut set of size 1 means one fault alone is sufficient — a single point of failure and
      the highest-priority fix. FTA lets you enumerate cut sets and, with probabilities, quantify the
      top event's likelihood.
    ref: "concepts.md#fault-tree-analysis-fta"

  - id: root-cause-analysis-and-troubleshooting-032
    difficulty: beginner
    tags: [scientific-method, observe-first]
    question: |
      What is the "anti-method" that disciplined troubleshooting is meant to replace?
    options: ["Random flailing — changing several things at once and restarting components hopefully", "Forming a firm hypothesis before making any observations, then ignoring contrary data", "Using distributed tracing to inspect per-hop span latency across the request path", "Writing a thorough blameless postmortem document after the incident is resolved"]
    answer: 0
    explanation: |
      The anti-method is random flailing: changing multiple variables at once, restarting things
      hopefully, or reading all the code top-down. It's fast per step but may never converge, can
      make things worse, and teaches nothing. The scientific method (observe, hypothesize, test one
      variable, repeat) is slower per step but converges.
    ref: "concepts.md#the-scientific-method-for-troubleshooting"

  - id: root-cause-analysis-and-troubleshooting-033
    difficulty: intermediate
    tags: [post-hoc, change-first, hypothesis]
    question: |
      "The errors started right after the deploy, so the deploy caused them." How should a
      rigorous responder treat this reasoning?
    options: ["As proven fact — post-hoc timing right after the deploy is by itself conclusive proof of causation", "As solid proof that the deploy is entirely unrelated, since correlation never implies anything", "As completely irrelevant, since the timing of an onset relative to a change never matters at all", "As a strong prior worth investigating first (change-first), but still a hypothesis to confirm via mechanism or rollback"]
    answer: 3
    explanation: |
      Post-hoc timing ("after, therefore because of") is a strong prior — it's exactly why the
      change-first heuristic works — but it is still a hypothesis. Confirm it by finding the
      mechanism or by rolling back and watching the symptom resolve, rather than declaring causation
      from timing alone.
    ref: "concepts.md#correlation-vs-causation"

  - id: root-cause-analysis-and-troubleshooting-034
    difficulty: intermediate
    tags: [fishbone-vs-5whys, technique-choice]
    question: |
      Why might you prefer a fishbone diagram over 5 Whys for a particular incident?
    options: ["Fishbone is always strictly faster to complete than 5 Whys under live incident pressure", "Fishbone forces breadth across cause categories, countering 5 Whys' tendency to tunnel down a single chain", "Fishbone can compute exact numerical failure probabilities the way a fault tree with data can", "Fishbone requires no brainstorming at all, since its categories are filled in automatically"]
    answer: 1
    explanation: |
      A fishbone diagram brainstorms candidate causes across categories (people/process/tech/
      environment) simultaneously, giving breadth and countering 5 Whys' linear tunnel-vision. It
      matches multi-causal reality, though it doesn't rank causes or quantify probabilities the way
      FTA can.
    ref: "concepts.md#fishbone-ishikawa-diagrams"

  - id: root-cause-analysis-and-troubleshooting-035
    difficulty: advanced
    tags: [confirmation-bias, usual-suspect]
    question: |
      An engineer immediately blames "the network" every incident and finds a graph that
      "confirms" it. What cognitive trap is this?
    options: ["Little's Law — relating concurrency to arrival rate multiplied by average latency", "The change-first heuristic — checking what recently deployed or changed before anything else", "Confirmation bias — finding evidence that agrees with a prior because something is always slightly elevated", "Differential diagnosis — slicing the symptom by region, host, customer, and endpoint"]
    answer: 2
    explanation: |
      Blaming the usual suspect (network/DB/GC) and hunting for a confirming graph is confirmation
      bias — on a busy system something is always a little elevated, so you can always "confirm" a
      prior. The remedy is to state a testable hypothesis and genuinely try to disconfirm it, not to
      collect agreeing graphs.
    ref: "concepts.md#correlation-vs-causation"

  - id: root-cause-analysis-and-troubleshooting-036
    difficulty: intermediate
    tags: [tools, logs, correlation-id]
    question: |
      For following exactly what happened to a single failing request across services, which
      capability is most useful?
    options: ["Structured logs with a correlation/trace ID that ties log lines to one request", "Averaged latency metrics aggregated across all requests over each time window", "A CPU utilization gauge showing overall host load as a percentage over time", "A monthly capacity-planning report summarizing aggregate resource usage trends"]
    answer: 0
    explanation: |
      Structured logs plus a correlation/trace ID let you reconstruct the exact sequence of events
      for one request across services — the last-mile "what/why" detail. Metrics tell you that/when
      and traces tell you where, but logs carry the specific event detail. Telemetry mechanics belong
      to observability.
    ref: "concepts.md#tools-of-the-trade-cross-references"

  - id: root-cause-analysis-and-troubleshooting-037
    difficulty: advanced
    tags: [multiple-causes, action-items, rca-output]
    question: |
      Given the multi-cause view of complex failures, what is the expected OUTPUT of a good RCA?
    options: ["A single named individual held accountable, so the postmortem's primary deliverable is assigning blame to one owner", "One definitive root cause paired with one corresponding fix that fully closes out the incident on its own", "A decision to provision more capacity, assuming that every incident ultimately reduces to insufficient headroom", "Multiple contributing factors and multiple, layered action items so the defense holes won't line up the same way again"]
    answer: 3
    explanation: |
      Because complex incidents require several defense holes to align, a good RCA surfaces multiple
      contributing factors and generates layered action items (fix the timeout AND the review gap AND
      the canary duration AND the alert threshold). Insisting on one root cause and one fix leads to
      shallow remediation and repeat incidents.
    ref: "concepts.md#the-myth-of-the-single-root-cause"

  - id: root-cause-analysis-and-troubleshooting-038
    difficulty: beginner
    tags: [trigger, definition]
    question: |
      In the symptom/cause/trigger vocabulary, what is a "trigger"?
    options: ["The observable bad thing users experience, such as elevated error pages or timeouts on the client side", "The change or event that set the failure in motion (deploy, config push, traffic spike, dependency slowdown)", "The deep systemic condition that made the harm possible long before any change was actually shipped", "The remediation applied to resolve the incident once responders have confirmed the underlying mechanism"]
    answer: 1
    explanation: |
      A trigger is what kicked the failure off — a deploy, config push, traffic spike, or dependency
      slowdown. It's distinct from the symptom (the observable bad thing), the proximate cause (what
      directly produced the symptom), and the contributing factors (the deeper conditions the fix
      targets).
    ref: "concepts.md#symptom-vs-cause-vs-trigger"

  - id: root-cause-analysis-and-troubleshooting-039
    difficulty: intermediate
    tags: [bisection, path, middle-probe]
    question: |
      When bisecting a request path of many hops to localize a fault, which hop should you
      probe first for maximum efficiency?
    options: ["The very first hop, since faults always originate at the entry edge and propagate strictly downstream from there", "The very last hop, because the slowest span is guaranteed to be whichever service returns the response last", "A hop near the middle, to halve the suspect space with one probe", "A hop chosen at random each time, trusting that repeated sampling will converge on the culprit just as fast"]
    answer: 2
    explanation: |
      Divide-and-conquer means probing the middle: checking whether the midpoint hop's dependency is
      healthy tells you whether the fault is upstream or downstream of it, halving the suspect space
      each time (O(log n)). Probing the first/last hop or randomly doesn't guarantee the halving.
    ref: "concepts.md#bisection-localizing-the-fault"

  - id: root-cause-analysis-and-troubleshooting-040
    difficulty: advanced
    tags: [rollback-confirms-hypothesis, dual-purpose]
    question: |
      Why is rolling back a suspect change during an incident often described as doing "two jobs
      at once"?
    options: ["It restores service AND tests the hypothesis (symptom clears means the change was involved)", "It purges the diagnostic logs AND frees up disk space so the host stops alerting on capacity", "It restarts the affected service processes AND clears the local caches that had grown stale", "It notifies the affected users AND automatically updates the public status page to reflect recovery"]
    answer: 0
    explanation: |
      Rollback both mitigates (restores service fastest) and serves as an experiment: if the symptom
      clears after reverting, the change was involved, confirming the hypothesis. That dual value is
      why easy, fast rollback is a reliability superpower (deploy/rollback mechanics live in
      devops-cicd).
    ref: "concepts.md#the-change-first-heuristic"

  - id: root-cause-analysis-and-troubleshooting-041
    difficulty: intermediate
    tags: [latency-split, success-vs-failure]
    question: |
      Why should you split latency into successful-request latency vs failed-request latency
      when diagnosing?
    options: ["Failed requests always take strictly longer than successful ones, so the split just re-sorts the same slow tail", "It cuts metric storage costs by letting you drop the success series and retain only the failure histogram", "Successful requests never vary in latency, so any observed spread must come entirely from the failures", "A flood of fast errors can drag the overall latency down and hide a real slowdown in successful requests"]
    answer: 3
    explanation: |
      Errors often return very fast (rejections, validation failures, open circuit breaker), so
      blended latency can look good even while successful requests are slow, or a spike of fast errors
      can mask the problem. Splitting success vs failure latency keeps the golden-signal reading honest.
    ref: "concepts.md#signals-to-read-golden-signals-red-use"

  - id: root-cause-analysis-and-troubleshooting-042
    difficulty: advanced
    tags: [fta-vs-5whys, proactive-vs-reactive]
    question: |
      Compared with 5 Whys, when is fault-tree analysis (FTA) the better tool?
    options: ["For a quick 2 a.m. incident where speed matters most and you need an actionable cause within minutes", "For proactive design review, hunting single points of failure, and quantifying risk in safety-critical systems", "When the goal is to assign individual blame and identify which engineer's change should be reverted", "When there is only one possible cause and a single linear walk down the chain is provably sufficient"]
    answer: 1
    explanation: |
      FTA is heavier-weight and top-down, using AND/OR logic to enumerate cut sets and (with
      probabilities) quantify the top event. That makes it ideal for proactive design review, SPOF
      hunting, and safety-critical analysis — whereas 5 Whys is the lightweight, quick starter for
      simple linear problems during or right after an incident.
    ref: "concepts.md#fault-tree-analysis-fta"

  - id: root-cause-analysis-and-troubleshooting-043
    difficulty: intermediate
    tags: [traffic-down-errors-up, upstream]
    question: |
      Traffic to your service is dropping while your error rate climbs. What is a useful
      interpretation?
    options: ["You may be causing the traffic drop — clients are giving up due to your errors — so look upstream at the caller experience", "Everything is fine, because lower traffic means the service is under less load and therefore healthier", "The database now has more free capacity, so the rising errors must be coming from somewhere unrelated", "The load balancer is working correctly and is deliberately shedding the excess traffic it saw earlier"]
    answer: 0
    explanation: |
      Falling traffic combined with rising errors can mean you are the problem: clients hit errors,
      retry, then give up, so observed traffic drops. Rather than celebrating lower load, look upstream
      at the caller/user experience — the drop is a symptom of your failures, not relief.
    ref: "concepts.md#signals-to-read-golden-signals-red-use"

  - id: root-cause-analysis-and-troubleshooting-044
    difficulty: beginner
    tags: [contributing-factors, fix-target]
    question: |
      Mitigation targets the ____, while the durable fix targets the ____.
    options: ["root cause; the visible symptom", "the initiating trigger; symptom", "symptom; contributing factors", "the quick fix; the postmortem"]
    answer: 2
    explanation: |
      During an incident you mitigate the symptom (restore service). The durable fix targets the
      contributing factors / deeper conditions surfaced by RCA. Fixing only the proximate cause (e.g.
      bumping a limit) usually just moves the next failure a few weeks out.
    ref: "concepts.md#symptom-vs-cause-vs-trigger"

  - id: root-cause-analysis-and-troubleshooting-045
    difficulty: advanced
    tags: [verify-cure, false-resolution]
    question: |
      After applying a fix, the symptom disappears. Why must you still verify the fix actually
      caused the resolution?
    options: ["Because fixes are never actually effective and every apparent resolution is coincidental by definition", "Because best practice requires redeploying the same change twice to be sure it took effect on all hosts", "Because incident-response policy legally mandates a formal verification sign-off before any ticket is closed", "Because the symptom might have cleared for an unrelated reason (e.g. a traffic spike passed), fooling you into a wrong conclusion"]
    answer: 3
    explanation: |
      In the cure step you must confirm the fix, not just the timing, resolved the symptom. If the
      symptom cleared coincidentally (the traffic spike passed, a dependency recovered on its own),
      you'll wrongly credit your fix and miss the real cause — the same post-hoc trap as attributing
      cause to timing.
    ref: "concepts.md#the-scientific-method-for-troubleshooting"

  - id: root-cause-analysis-and-troubleshooting-046
    difficulty: intermediate
    tags: [observability-boundary, cross-ref]
    question: |
      In this library's domain split, which of the following is owned by observability rather
      than by root-cause analysis & troubleshooting?
    options: ["The mechanics of collecting metrics/logs/traces and configuring SLO-based alert rules", "The change-first heuristic that tells you to ask what recently deployed or shifted before anything else", "The scientific method for diagnosis — observe, hypothesize, then test one variable at a time to converge", "The multi-cause / Swiss-cheese view that treats an incident as several defense holes aligning at once"]
    answer: 0
    explanation: |
      Observability owns the telemetry mechanics — collecting metrics/logs/traces, dashboards, and
      the mechanics of SLO-based alerting. This topic owns the diagnostic reasoning (scientific method,
      change-first heuristic, bisection, differential diagnosis, the multi-cause view) and references
      observability for how the signals are measured.
    ref: "concepts.md#tools-of-the-trade-cross-references"

  - id: root-cause-analysis-and-troubleshooting-047
    difficulty: advanced
    tags: [5-whys, stop-rule]
    question: |
      A 5 Whys chain concludes at "...because the universe tends toward entropy." What failure
      mode of the technique does this illustrate?
    options: ["Stopping too early, halting at the first surface cause like 'human error' before reaching anything actionable", "Running arbitrarily deep past the point of actionable, controllable causes", "Handling multiple parallel causes well, cleanly branching the chain whenever an effect has more than one input", "Quantifying failure probabilities precisely, attaching numeric likelihoods to each link the way a fault tree does"]
    answer: 1
    explanation: |
      "Five" is a rule of thumb, not a law. Without a sensible stopping rule (stop at the first cause
      you can control and act on), 5 Whys can either stop too early (at 'human error') or run
      arbitrarily deep into uncontrollable generalities. Good facilitation stops at an actionable
      systemic factor.
    ref: "concepts.md#5-whys-and-its-limits"

  - id: root-cause-analysis-and-troubleshooting-048
    difficulty: expert
    tags: [littles-law, saturation, mechanism]
    question: |
      A dependency slows so your service's request latency rises from 20 ms to 1 s while
      arrival rate holds at 400 req/s. By Little's Law, roughly how much concurrency is now
      required, and what is the diagnostic implication?
    options: ["About 8 in-flight requests; concurrency scales inversely with latency, so a slower dependency needs fewer threads", "About 20 in-flight requests; concurrency tracks the latency ratio alone, so the pool sizing is unaffected", "About 40 in-flight requests; the tenfold latency rise simply halves effective throughput and nothing saturates", "About 400 in-flight requests; if your thread/connection pool is far smaller, it saturates and requests queue or are rejected"]
    answer: 3
    explanation: |
      Little's Law: concurrency = arrival_rate x latency = 400/s x 1 s = 400 in-flight requests.
      If the pool is much smaller than 400, it saturates and new requests queue or get rejected —
      the mechanism behind pool exhaustion from a slow dependency. Recognizing this links the golden
      signal "saturation" to a concrete cause (see cascading-failures).
    ref: "concepts.md#signals-to-read-golden-signals-red-use"

  - id: root-cause-analysis-and-troubleshooting-049
    difficulty: intermediate
    tags: [population-bisection, canary]
    question: |
      Only requests hitting the newest API version are failing; the previous version is fine.
      Which technique does this reflect, and what does it point to?
    options: ["Fault-tree analysis; the version split reveals an AND-gate SPOF rooted in a failing hardware component", "Little's Law; the new version's failures indicate a concurrency-driven saturation of the shared thread pool", "Population/dimension bisection (differential diagnosis); the cause is specific to the new version — likely a recent change to it", "The USE method; the isolation to one version points at a saturated disk resource behind that code path"]
    answer: 2
    explanation: |
      Slicing by API version cleanly separates healthy (old) from unhealthy (new) — population
      bisection / differential diagnosis. A symptom isolated to the new version points at a
      version-specific cause, tying directly back to the change-first heuristic (what shipped in that
      version?).
    ref: "concepts.md#differential-diagnosis-and-what-changed-axes"

  - id: root-cause-analysis-and-troubleshooting-050
    difficulty: expert
    tags: [three-nines, availability, numbers]
    question: |
      An SLO breach investigation notes the service is targeting three nines (99.9%)
      availability. Roughly how much downtime per year does that budget allow, a figure you'd
      weigh against the incident's duration?
    options: ["About 8.76 hours/year", "About 5 minutes/year", "About 3.65 days/year", "About 52 minutes/year"]
    answer: 0
    explanation: |
      99.9% (three nines) allows ~0.1% downtime = ~8.76 hours/year (about 43.8 min/month). Four nines
      (99.99%) is ~52.6 min/year and five nines ~5.26 min/year. Knowing these lets you judge whether a
      given incident's duration blew a meaningful fraction of the budget. (SLO/error-budget concepts
      live in slos-error-budgets-and-velocity-tradeoff; alerting mechanics in observability.)
    ref: "concepts.md#signals-to-read-golden-signals-red-use"

  - id: root-cause-analysis-and-troubleshooting-051
    difficulty: expert
    tags: [kepner-tregoe, is-is-not, differential]
    question: |
      Using Kepner-Tregoe, you specify that the problem IS "500s on /pay in eu-west-1
      starting 14:32" and IS-NOT "us-east-1, or /pay/status, or before 14:32." A colleague
      proposes: "a bug in the shared payment library shipped this morning." Why does KT let
      you reject this hypothesis quickly?
    options: ["It would also break us-east-1 and /pay/status, contradicting the IS-NOT — a valid cause must explain both the IS and the IS-NOT", "Shared libraries can never cause region-specific failures because library code is identical in every deployment", "The hypothesis names a recent change, and KT rules that any change-first hypothesis is disproven by definition", "KT explicitly forbids proposing library-level hypotheses and restricts candidate causes to infrastructure only"]
    answer: 0
    explanation: |
      KT's power is the IS/IS-NOT boundary: a candidate cause must explain what the problem IS
      AND what it is NOT. A shared-library bug would hit us-east-1 and /pay/status too, so it
      can't explain why those are healthy. The real cause lives in the distinctions (what's
      special about eu-west-1 and /pay at 14:32) — e.g. an eu-west-only config or a cert.
    ref: "concepts.md#kepner-tregoe-is-and-is-not"

  - id: root-cause-analysis-and-troubleshooting-052
    difficulty: advanced
    tags: [kepner-tregoe, distinctions, changes]
    question: |
      In Kepner-Tregoe Problem Analysis, once you have the IS/IS-NOT specification, where do
      you look for probable cause?
    options: ["In whichever candidate cause carries the lowest implementation cost, so remediation stays cheap and fast", "In whichever cause the most senior engineer in the room proposes, since experience outweighs the specification", "In the distinctions (what is different about the IS vs IS-NOT) and the changes in or around those distinctions", "In the total count of affected users alone, escalating to the hypothesis that matches the largest blast radius"]
    answer: 2
    explanation: |
      KT finds cause by examining distinctions — what is peculiar to the IS that is not true of
      the IS-NOT — and then the changes in/around those distinctions. This is the disciplined,
      evidence-first form of "what changed?" scoped to exactly the boundary of the problem.
    ref: "concepts.md#kepner-tregoe-is-and-is-not"

  - id: root-cause-analysis-and-troubleshooting-053
    difficulty: expert
    tags: [apollo-rca, action-condition-cause, multi-causal]
    question: |
      Dean Gano's Apollo RCA insists that "every effect has at least two causes." What
      distinction is it making, and why does it matter for RCA?
    options: ["A primary technical cause and a responsible blame owner, so accountability for the effect is always assigned to a person", "A hardware cause and a software cause for every effect, so both the infrastructure and application teams get notified", "A detected cause and an undetected cause behind each effect, so the analysis primarily drives monitoring improvements", "An action cause and a condition cause (e.g. a spark AND the presence of fuel), so causes branch into a graph rather than a single linear chain"]
    answer: 3
    explanation: |
      Apollo RCA pairs an action cause with a condition cause for every effect (a fire needs a
      spark AND fuel/oxygen). Because each effect has multiple causes that each have their own
      causes, the analysis forms a branching cause-and-effect chart (Realitychart) — the explicit
      antidote to 5 Whys' single linear chain.
    ref: "concepts.md#apollo-rca-and-causal-factor-trees"

  - id: root-cause-analysis-and-troubleshooting-054
    difficulty: expert
    tags: [causal-factor, root-cause, contributing-factor]
    question: |
      An alert threshold was set too high, so detection took 40 minutes instead of 5. In the
      causal-factor / root-cause / contributing-factor taxonomy, how is that best classified?
    options: ["A contributing factor — it didn't cause the outage but increased its severity/duration", "The trigger — it set the whole failure sequence in motion as the initiating change or event", "A causal factor — it directly produced the outage and sits squarely on the failure path", "The root cause — the deepest correctable condition whose fix prevents this entire class of failure"]
    answer: 0
    explanation: |
      The high threshold didn't cause the failure (the outage would have happened anyway) but it
      lengthened the impact by delaying detection — a contributing factor (raises likelihood or
      severity, not sufficient alone). A causal factor directly produces the outcome; the root
      cause is the deepest systemic correctable cause of the class.
    ref: "concepts.md#apollo-rca-and-causal-factor-trees"

  - id: root-cause-analysis-and-troubleshooting-055
    difficulty: advanced
    tags: [new-view, human-error, local-rationality]
    question: |
      Under the "new view" of human error (Dekker, Woods, Allspaw), how should an
      investigation treat a finding of "operator error"?
    options: ["As the conclusion — the operator is retrained, formally disciplined, and the incident ticket is closed out once accountability is assigned", "As proof that the automation should be extended to replace the fallible human operator entirely, removing them from the loop", "As a starting point — a symptom of deeper systemic trouble; ask why the action made sense to a competent person given what they knew", "As irrelevant noise — competent humans are never genuinely involved in the real root cause of a complex-systems failure"]
    answer: 2
    explanation: |
      The new view treats human error as a symptom, not a cause: a starting point for
      investigation. Using local rationality, you reconstruct why the action seemed reasonable
      given what the person knew, saw, and was pressured to do at the time — which surfaces the
      systemic conditions (bad defaults, missing guardrails, misleading tooling) that are the
      real leverage.
    ref: "concepts.md#the-new-view-of-human-error"

  - id: root-cause-analysis-and-troubleshooting-056
    difficulty: expert
    tags: [counterfactual, hindsight-bias, new-view]
    question: |
      A postmortem draft states: "the on-call should have noticed the memory graph climbing and
      restarted the pod before it OOMed." Why is this framing a red flag?
    options: ["It is a counterfactual built on hindsight — describing a world that didn't exist rather than explaining why the real actions made sense at the time", "It correctly identifies the on-call's inattention as the root cause and therefore needs no further revision or analysis", "It is far too technical for a typical postmortem audience and should be rewritten in much plainer operational language", "It shifts blame onto the monitoring system's design, and pointing at tooling that way is never an appropriate postmortem conclusion"]
    answer: 0
    explanation: |
      "Should have noticed/should have restarted" is a counterfactual: it narrates an alternate
      history instead of explaining the actual one. Knowing the outcome makes the signal look
      obvious (hindsight bias, Cook #8). The useful question is why the climb wasn't salient at
      the time — alert design, competing signals, workload — not what the person "should" have done.
    ref: "concepts.md#the-new-view-of-human-error"

  - id: root-cause-analysis-and-troubleshooting-057
    difficulty: expert
    tags: [above-below-line, mental-model, stella]
    question: |
      The "line of representation" (Woods/Allspaw, STELLA) frames incidents as arising when the
      mental model diverges from reality. What does "above the line" refer to?
    options: ["The engineers' mental models, dashboards, and tooling — the representations they act through, since they never touch the real system directly", "The management and approval chain that signs off on changes before they are ever allowed to reach production systems", "The SLO threshold line above which paging alerts fire and the service's error budget begins to be actively consumed", "The upstream services in the call graph that sit before your service and send it the bulk of its incoming traffic"]
    answer: 0
    explanation: |
      Above the line = the representations (mental models, dashboards, tools) through which people
      understand and operate the system; below the line = the actual running system. Since
      operators only ever act on the above-the-line picture, incidents erupt when that picture
      diverges from the below-the-line reality — which is why dark debt and unknown-unknowns bite.
    ref: "concepts.md#the-new-view-of-human-error"

  - id: root-cause-analysis-and-troubleshooting-058
    difficulty: expert
    tags: [latent-vs-active, reason, swiss-cheese]
    question: |
      A deploy (the sharp-end act) triggered an outage because a connection pool had no upper
      bound configured. In Reason's terms, how are these two elements classified?
    options: ["Both are active failures committed together at the sharp end, close in time to the visible accident itself", "Both are latent conditions that lay dormant for months, with no active sharp-end component involved at all", "The deploy is the latent condition planted earlier, while the missing pool bound is the active sharp-end failure", "The deploy is the active failure; the missing pool bound is a latent condition (a resident pathogen planted earlier)"]
    answer: 3
    explanation: |
      The deploy is the active failure — the visible sharp-end act close in time to the accident.
      The absent pool bound is a latent condition: a dormant systemic weakness ("resident
      pathogen") planted long before that lay in wait until an active failure lined the holes up.
      Cook #4: complex systems always harbor such latent conditions.
    ref: "concepts.md#latent-vs-active-failures-and-dark-debt"

  - id: root-cause-analysis-and-troubleshooting-059
    difficulty: expert
    tags: [dark-debt, unknown-unknowns, emergent]
    question: |
      What most sharply distinguishes "dark debt" from ordinary technical debt?
    options: ["Dark debt is only ever found in old legacy systems, whereas ordinary technical debt appears exclusively in freshly written new code", "Dark debt is always explicitly documented as a tracked item in the team's backlog, unlike ordinary undocumented technical debt", "Dark debt arises from unforeseen interactions between components and is invisible to inspection — you can't find it by reading code or a checklist", "Dark debt only ever degrades performance and latency, and by definition can never affect functional correctness or data integrity"]
    answer: 2
    explanation: |
      Technical debt is visible and known — you can point at the shortcut. Dark debt is an emergent
      hazard living in the interaction between components, so no single component looks wrong and
      inspection/review can't reveal it; it surfaces only when it produces an anomaly (e.g. Roblox
      2021's Consul/BoltDB interaction). This is why Cook #4 holds even for carefully reviewed systems.
    ref: "concepts.md#latent-vs-active-failures-and-dark-debt"

  - id: root-cause-analysis-and-troubleshooting-060
    difficulty: advanced
    tags: [cook, complex-systems, degraded-mode]
    question: |
      Cook's point #5 states that complex systems "run in degraded mode." What is the practical
      RCA implication when you discover the system had several pre-existing latent flaws before
      the incident?
    options: ["The team was clearly negligent for knowingly shipping those flaws and should be formally cited for it in the postmortem writeup", "The incident must be reclassified as not a real outage, since the system was already partly broken well beforehand anyway", "You should halt the investigation early, since a system that was already running broken cannot teach you anything more", "That is normal — complex systems always operate as a collection of flaws; the flaws' presence isn't damning, and no single one is 'the' cause"]
    answer: 3
    explanation: |
      Cook #5: complex systems run continuously in degraded mode, containing latent faults, and
      work despite them via redundancy and human adaptation. So "it was already partly broken" is
      the normal state, not evidence of negligence — and it reinforces #3/#7 (catastrophe needs
      multiple failures; there's no single root cause).
    ref: "concepts.md#how-complex-systems-fail-the-load-bearing-points"

  - id: root-cause-analysis-and-troubleshooting-061
    difficulty: expert
    tags: [cook, change, remediation-complexity]
    question: |
      After an incident, a team adds three mandatory approval gates and a new automated
      safety-check layer. Which Cook thesis warns about this reflex?
    options: ["#3 — catastrophe requires multiple contributing failures to align, so no single fault is ever sufficient on its own", "#8 — hindsight bias distorts post-incident assessment, making past signals look far more obvious than they really were", "#17 — people at the sharp end continuously create safety through ongoing adaptation and real-time adjustment", "#15 — 'human error'-based fixes often add complexity and new coupling, which can create the next accident"]
    answer: 3
    explanation: |
      Cook #15 warns that post-accident remedies aimed at "human error" frequently increase
      system complexity and coupling — more steps, more automation, more places to fail — planting
      the seeds of the next incident (#14: change introduces new failure modes). It doesn't mean
      never add controls; it means weigh the coupling they add.
    ref: "concepts.md#how-complex-systems-fail-the-load-bearing-points"

  - id: root-cause-analysis-and-troubleshooting-062
    difficulty: advanced
    tags: [anchoring, cognitive-bias, disconfirm]
    question: |
      You've spent 30 minutes certain the database is the culprit and keep finding graphs that
      "sort of" support it. What is the most effective countermeasure to anchoring?
    options: ["Keep collecting still more dashboards and graphs that agree with the database theory until you feel fully certain of it", "Escalate the whole incident up to engineering management and wait for a leadership decision on which direction to take", "State the specific observation that would DISCONFIRM the DB hypothesis, go look for it, and bring in fresh eyes if still stuck", "Restart the database process outright to see what happens, then reassess whether the symptom shifted at all afterward"]
    answer: 2
    explanation: |
      Anchoring and confirmation bias are countered by actively trying to disconfirm: name the
      observation that would prove you wrong and go check it, rather than accumulating agreeing
      graphs (something is always slightly elevated). Handing off to a rested engineer with no
      prior often cracks it fast — a reason incident command separates roles.
    ref: "concepts.md#cognitive-biases-and-the-heisenbug"

  - id: root-cause-analysis-and-troubleshooting-063
    difficulty: expert
    tags: [heisenbug, reproduction, observer-effect]
    question: |
      A crash happens ~once a day in production but never under a debugger or with verbose
      logging enabled. What is the best-founded interpretation and next step?
    options: ["Likely a heisenbug/race — observation perturbs timing/memory so it vanishes; capture more telemetry and use record-and-replay rather than live single-stepping", "The bug has effectively already fixed itself, since it no longer reproduces under the debugger or with verbose logging enabled", "It must be an intermittent hardware fault in the servers, so the right move is simply to replace the physical machines outright", "Add many more breakpoints throughout the production code path to reliably catch the race in the act the next time it fires"]
    answer: 0
    explanation: |
      A bug that disappears under observation is a heisenbug: attaching a debugger serializes
      threads (races can't manifest), and debug builds shift memory layout/timing. Live-poking
      moves it; the right move is to capture richer telemetry, snapshot state, and use
      record-and-replay, while looking for environmental differences (load, data, timing).
    ref: "concepts.md#cognitive-biases-and-the-heisenbug"

  - id: root-cause-analysis-and-troubleshooting-064
    difficulty: advanced
    tags: [bug-taxonomy, bohrbug, mandelbug]
    question: |
      In the classic bug taxonomy, which term denotes a deterministic, reliably reproducible bug
      — the "easy case" contrasted with a heisenbug?
    options: ["Mandelbug", "Schrödinbug", "Bohrbug", "Hindenbug"]
    answer: 2
    explanation: |
      A Bohrbug is solid and deterministic — it reproduces reliably given the same inputs (named
      after the classical Bohr atom). A heisenbug changes/vanishes under observation, a Mandelbug's
      causes are so complex the behavior looks chaotic, a Schrödinbug starts failing once someone
      notices it shouldn't work, and a Hindenbug has catastrophic blast radius.
    ref: "concepts.md#cognitive-biases-and-the-heisenbug"

  - id: root-cause-analysis-and-troubleshooting-065
    difficulty: advanced
    tags: [hickam, occam, multi-causal]
    question: |
      Occam's razor points you at one tidy cause, but the evidence shows three unrelated
      anomalies that the single story can't explain. Which principle applies?
    options: ["The change-first heuristic — blame the single most recent deploy for all three of the anomalies and revert it at once", "Hickam's dictum — a system can have several independent problems at once; don't force-fit one story", "Little's Law — the three separate anomalies are really all one saturation effect driven by rising concurrency", "The USE method — simply pick the single resource showing the highest utilization and treat it as the one cause"]
    answer: 1
    explanation: |
      Hickam's dictum ("a patient can have as many diseases as they please") is the counterweight
      to Occam's razor: sometimes there really are multiple small independent problems, matching the
      multi-causal Swiss-cheese reality. When one hypothesis can't explain all the observations,
      stop forcing it and allow several concurrent causes.
    ref: "concepts.md#named-diagnostic-heuristics"

  - id: root-cause-analysis-and-troubleshooting-066
    difficulty: expert
    tags: [negative-results, sre, search-space]
    question: |
      Google SRE's "Effective Troubleshooting" says "negative results are magic." What is the
      point?
    options: ["Negative test results should be quietly deleted so that they don't clutter the incident channel and distract other responders", "A failed experiment is conclusive — it removes a region of the search space with certainty and should be recorded, not discarded", "You should only ever run experiments that you already fully expect to succeed, so that no investigation effort is wasted", "Negative results are a reliable sign that the system has quietly self-healed and that the incident is effectively over"]
    answer: 1
    explanation: |
      A failed (negative) experiment is definitive information: it eliminates part of the hypothesis
      space for certain, narrowing the search as effectively as a positive result. Recording negative
      results prevents re-testing dead ends and lets others build on your work — hence "magic," not waste.
    ref: "concepts.md#named-diagnostic-heuristics"

  - id: root-cause-analysis-and-troubleshooting-067
    difficulty: intermediate
    tags: [hoofbeats, base-rate, heuristic]
    question: |
      "When you hear hoofbeats, think horses, not zebras" expresses which troubleshooting idea?
    options: ["Favor the probable, high-base-rate explanation (like a recent change) before the exotic one", "Always suspect the most exotic, statistically rare cause first, before ever considering any ordinary explanation", "Never form any working hypothesis at all until you have read through the entire codebase from top to bottom", "Latency always rises strictly before errors do, so you should chase the latency signal first every single time"]
    answer: 0
    explanation: |
      The hoofbeats maxim is the medical version of the change-first heuristic: reach for the
      common, high-base-rate cause (a recent deploy or config change) before an exotic one (a
      cosmic-ray bit-flip). It's about prior probability, not certainty — you still confirm.
    ref: "concepts.md#named-diagnostic-heuristics"

  - id: root-cause-analysis-and-troubleshooting-068
    difficulty: advanced
    tags: [sre, what-touched-it-last, change-annotation]
    question: |
      Google SRE recommends annotating dashboards with deploy and config start/end times. Which
      troubleshooting technique does this operationalize?
    options: ["'Simplify and reduce' — black-box testing individual components in isolation with known, carefully controlled inputs", "Little's Law estimation — deriving the required concurrency from arrival rate multiplied by the average latency", "Fault-tree minimal cut sets — enumerating the smallest combinations of basic events that together cause the top event", "'What touched it last?' — putting the change timeline directly on the graph so onset lines up with changes"]
    answer: 3
    explanation: |
      Overlaying change events on the metric graphs is the "what touched it last?" technique — it
      makes the change-first correlation instantaneous by putting deploy/config markers right where
      you'd spot the onset inflection. "Simplify and reduce" is a different technique (black-box a
      component with known inputs).
    ref: "concepts.md#named-diagnostic-heuristics"

  - id: root-cause-analysis-and-troubleshooting-069
    difficulty: advanced
    tags: [red-vs-use, signal-choice, judgment]
    question: |
      You need to answer "is this particular connection pool the bottleneck?" during an incident.
      Which signal framework is the natural fit?
    options: ["RED (Rate, Errors, Duration) — the request-centric lens for judging whether a given endpoint is healthy", "USE (Utilization, Saturation, Errors) — it's the resource-centric lens for 'what's full/the bottleneck'", "The four golden signals only — latency, traffic, errors, and saturation viewed together as one SLO set", "MTBF/MTTR reliability metrics — mean time between failures and mean time to recover from each one"]
    answer: 1
    explanation: |
      USE is the resource lens: for a given resource (CPU, disk, NIC, connection pool) you check
      Utilization, Saturation, and Errors — perfect for "is this pool the bottleneck?" RED is the
      request/service lens ("is this endpoint healthy?"), and golden signals are the SLO superset.
    ref: "concepts.md#red-vs-use-vs-golden-signals-which-to-reach-for"

  - id: root-cause-analysis-and-troubleshooting-070
    difficulty: advanced
    tags: [golden-signals, red, use, superset]
    question: |
      How do the four golden signals relate to RED and USE?
    options: ["They are entirely unrelated frameworks that each measure completely different systems with no real overlap between them", "The golden signals are a strict subset of RED, capturing only rate and errors while dropping duration entirely", "The golden signals are roughly RED (Duration≈Latency, Rate≈Traffic, Errors) plus Saturation from USE — a superset for a service SLO", "USE is a strict superset of the four golden signals, fully containing both latency and traffic within its resource view"]
    answer: 2
    explanation: |
      The four golden signals (Latency, Traffic, Errors, Saturation) are effectively RED's
      request view (Duration≈Latency, Rate≈Traffic, Errors) augmented with Saturation from the
      resource view (USE). That makes golden signals the practical superset for a service SLO,
      with Saturation as the shared leading indicator.
    ref: "concepts.md#red-vs-use-vs-golden-signals-which-to-reach-for"

  - id: root-cause-analysis-and-troubleshooting-071
    difficulty: advanced
    tags: [change-analysis, baseline, technique]
    question: |
      "Change analysis" as a formal RCA technique is best described as what?
    options: ["Counting how many discrete changes a team ships per week and tracking that deployment throughput over time", "Blaming the single most recent change outright, without any investigation into whether it actually caused the failure", "Systematically comparing the failure scenario against a known-good baseline and listing every difference as a candidate cause", "Analyzing how quickly a given change can be safely rolled back once it is first suspected of causing an incident"]
    answer: 2
    explanation: |
      Change analysis is the formal, disciplined version of the change-first heuristic: take a
      known-good baseline and the failure scenario and enumerate every difference (config, version,
      data, load, environment, timing), then test each as a candidate cause — turning "what changed?"
      into an exhaustive comparison rather than a memory jog.
    ref: "concepts.md#change-analysis-and-barrier-analysis"

  - id: root-cause-analysis-and-troubleshooting-072
    difficulty: advanced
    tags: [barrier-analysis, swiss-cheese, controls]
    question: |
      Barrier analysis is essentially the formal version of which other model in this topic?
    options: ["5 Whys' single linear chain — repeatedly asking why down one path from the symptom to an actionable cause", "Little's Law — relating in-flight concurrency to the arrival rate multiplied by average time in the system", "The USE method — checking utilization, saturation, and errors for each resource to find the bottleneck", "The Swiss-cheese model — identifying which defensive barriers/controls should have stopped the hazard and which failed or were missing"]
    answer: 3
    explanation: |
      Barrier analysis enumerates the barriers/controls (review, tests, canary, rate limit,
      timeout, alert) that should have stopped the hazard and determines which failed or were
      absent — the formalized Swiss-cheese view. Its output maps directly onto layered action
      items: restore or add the barriers that were holed or missing.
    ref: "concepts.md#change-analysis-and-barrier-analysis"

  - id: root-cause-analysis-and-troubleshooting-073
    difficulty: expert
    tags: [mttr, ambiguity, definitions]
    question: |
      A leadership review celebrates that "MTTR dropped 30%." Why should a staff engineer push
      back on this statement as written?
    options: ["MTTR is not a standardized metric defined by any SRE or ITIL framework, so no team can legitimately report a single value for it at all", "MTTR cannot be measured accurately because incident start times are fundamentally unknowable, making any reported figure essentially guesswork", "MTTR only defines a hardware mean-time-to-repair and has no meaning for software services, so applying it to this incident is a category error", "The 'R' is ambiguous (repair/recover/restore/respond) and mitigate-time differs from repair-time; without defining which, the number is meaningless"]
    answer: 3
    explanation: |
      The "R" in MTTR variously means repair, recover, restore, or respond, and time-to-mitigate
      (stop user pain) is distinct from time-to-repair (fix the underlying fault). "MTTR improved"
      is uninterpretable until you define which interval you mean — a common source of misleading
      metrics.
    ref: "concepts.md#detection-mitigation-and-the-mtt-family"

  - id: root-cause-analysis-and-troubleshooting-074
    difficulty: expert
    tags: [mttd, mttr, cut-recovery-time]
    question: |
      Asked "how would you cut time-to-recover for this class of incident?", which answer shows
      the strongest grasp of the MTT* lens?
    options: ["Attack detection, diagnosis, and mitigation as separate bottlenecks — SLI alerting to cut MTTD, tracing/change-annotations/runbooks to cut diagnosis, and fast rollback/flags/failover to cut mitigation", "Focus entirely on prevention — eliminate every latent fault through exhaustive pre-prod testing so this class of incident can never occur and recovery time becomes irrelevant", "Add more engineers to the on-call rotation and split the pager across more shifts, since more responders directly shortens every phase of recovery proportionally", "Buy larger instances with far more CPU and memory headroom, since an over-provisioned fleet never saturates and therefore never enters a state that requires recovery"]
    answer: 0
    explanation: |
      Recovery time decomposes into detect, diagnose, and mitigate — each with different fixes.
      SLI-based alerting cuts MTTD, tracing/change annotations/runbooks cut diagnosis time, and
      fast rollback/feature flags/one-click failover cut mitigation time. Treating them separately
      (rather than "prevent everything") is the senior move; break-rate and recovery-time are
      independent levers on availability.
    ref: "concepts.md#detection-mitigation-and-the-mtt-family"

  - id: root-cause-analysis-and-troubleshooting-075
    difficulty: expert
    tags: [availability, mtbf, mttr, formula]
    question: |
      Given steady-state availability ≈ MTBF / (MTBF + MTTR), why is investing in faster recovery
      often as valuable as preventing failures?
    options: ["Because MTBF is impossible to measure in practice, so recovery investment is the only availability lever a team can actually quantify and report", "Because the availability formula ignores MTTR entirely and depends solely on MTBF, so recovery speed is the only remaining thing worth tuning", "Because MTBF and MTTR are algebraically the same quantity, so improving either one produces the exact same numerical effect on availability", "Because cutting MTTR raises availability even when the failure rate (MTBF) can't be improved further"]
    answer: 3
    explanation: |
      Availability rises both by increasing MTBF (fewer failures) and by decreasing MTTR (faster
      recovery). When failures are hard to eliminate (complex systems always harbor latent faults),
      shrinking MTTR — fast rollback, good detection, rehearsed runbooks — is an independent and
      often cheaper lever on the same availability number.
    ref: "concepts.md#detection-mitigation-and-the-mtt-family"

  - id: root-cause-analysis-and-troubleshooting-076
    difficulty: expert
    tags: [knight-capital, deploy-hygiene, canonical-incident]
    question: |
      The Knight Capital 2012 loss (~$460M in ~45 minutes) is most often cited to illustrate
      which lesson?
    options: ["Untested backups are not backups — the five restore paths had all silently failed, so recovery was impossible when the primary data was lost", "A single catastrophic-backtracking regex can peg CPU across an entire fleet, taking down every server that shares the same rule set at once", "Dark debt from an emergent interaction between two components under load that no code review or inspection could have surfaced beforehand", "A partial/incomplete deploy plus a repurposed feature flag reactivating dormant code — deploy hygiene and flag reuse dangers"]
    answer: 3
    explanation: |
      Knight left old code on one of eight servers (an incomplete deploy) and reused a feature
      flag that reactivated long-dormant code, producing runaway erroneous orders. It's the
      canonical change-first / deploy-hygiene cautionary tale: verify all hosts and never reuse
      flags. (Regex-CPU is Cloudflare 2019; untested backups is GitLab 2017; dark debt is Roblox 2021.)
    ref: "concepts.md#canonical-incident-stories"

  - id: root-cause-analysis-and-troubleshooting-077
    difficulty: expert
    tags: [meta-bgp, recovery-path, canonical-incident]
    question: |
      The Meta/Facebook 2021 BGP outage is frequently used to teach which specific reliability
      lesson beyond "a config change caused an outage"?
    options: ["Percentiles beat averages — the outage was only visible in the p99 tail while the mean latency stayed flat and hid the impact from responders", "Don't build recovery tooling that depends on the very system it must recover — the change also disabled the tools and access needed to fix it", "Always run at 100% utilization — the outage proved that spare headroom is wasted capacity that a well-tuned network never actually needs", "Retry storms amplify errors — clients hammering the withdrawn routes multiplied the load and were the true driver of the prolonged outage"]
    answer: 1
    explanation: |
      The BGP withdrawal took Facebook off the internet AND disabled the remote tooling and badge
      access needed to recover, dramatically lengthening the outage. The lesson (echoing Cook #15)
      is to keep recovery paths out-of-band and independent of the system they must restore — don't
      break your own recovery tools.
    ref: "concepts.md#canonical-incident-stories"

  - id: root-cause-analysis-and-troubleshooting-078
    difficulty: advanced
    tags: [gitlab, untested-backup, human-factors]
    question: |
      In the GitLab.com 2017 data-loss incident, a tired engineer deleted data from the primary
      and then discovered all five backup/restore methods had silently failed. Through a barrier-
      analysis lens, what is the key takeaway?
    options: ["The engineer should have been fired for deleting production data, and the postmortem's main deliverable is assigning that accountability to the individual", "Backups that are never verified are not real barriers — untested restore paths were all holed, and fatigue/human-factors point to systemic conditions, not blame", "Databases should never be replicated, because replication is what let the erroneous deletion propagate and destroy the data in the first place", "The incident had a single clean root cause — human error at the keyboard — and once identified the analysis is complete and can be closed"]
    answer: 1
    explanation: |
      Barrier analysis asks which defenses should have stopped the harm and why they didn't: here
      every backup barrier was holed because none had been tested/verified — an untested backup is
      not a backup. The fatigue angle is a systemic condition (new view), not grounds for blame; the
      fixes target verified backups and safer tooling.
    ref: "concepts.md#canonical-incident-stories"

  - id: root-cause-analysis-and-troubleshooting-079
    difficulty: expert
    tags: [aws-kinesis, saturation, os-limit]
    question: |
      The AWS Kinesis us-east-1 2020 event — where adding capacity pushed servers past the OS
      thread limit — is a textbook example of which diagnostic category?
    options: ["A reverse-causation retry storm, where client retries against the struggling fleet multiplied the load and were themselves the true driver of the failure", "A confirmation-bias failure, where responders fixated on their favorite suspect resource and collected agreeing graphs while the real cause went unexamined", "A saturation / hard-limit story where the exhausted resource was OS threads, not CPU or memory", "A DNS resolution and TLS certificate expiry that silently lapsed at the moment new capacity came online and blocked all inter-server communication"]
    answer: 2
    explanation: |
      Scaling the front-end fleet drove each server's thread count past the operating system's
      per-server limit, corrupting internal state. It's a saturation story with a non-obvious
      resource — threads — reminding responders that "what's full?" (USE) includes OS-level limits,
      not just CPU/RAM/disk.
    ref: "concepts.md#canonical-incident-stories"

  - id: root-cause-analysis-and-troubleshooting-080
    difficulty: expert
    tags: [aws-s3-2017, blast-radius, new-view]
    question: |
      In the AWS S3 us-east-1 2017 outage, an engineer following an approved playbook mistyped a
      command and removed too many servers. Applying the new view, which questions matter most?
    options: ["Which engineer typed the command, whether they were adequately trained, and what disciplinary or retraining steps the postmortem should assign to that individual", "Why one command had that blast radius, why there was no guardrail/confirmation on the input, and why the subsystem's restart was so slow — not who typed it", "Whether the playbook should be deleted entirely and manual server-removal operations banned outright, so that no approved procedure can ever cause harm again", "Whether S3 should be decommissioned in us-east-1 and its traffic permanently shifted to other regions to avoid any repeat of this outage"]
    answer: 1
    explanation: |
      "The wrong command" is a starting point, not a root cause. The systemic questions are why a
      single command could remove that many servers (no blast-radius guardrail or confirmation),
      and why the index/placement subsystems required a slow, rarely-exercised full restart. Those
      are the leverage points (Cook #15), and they drove the guardrails AWS added afterward.
    ref: "concepts.md#canonical-incident-stories"

  - id: root-cause-analysis-and-troubleshooting-081
    difficulty: advanced
    tags: [cloudflare-2019, regex, unbounded-resource]
    question: |
      Cloudflare's July 2019 global outage (~27 minutes of 502s) was caused by a WAF regular
      expression with catastrophic backtracking. Which pair of concepts does it best illustrate?
    options: ["A change as trigger (rule push) plus an unbounded resource (CPU) with no safety limit as the latent condition", "A retry storm plus reverse causation, where client retries against the failing edge multiplied load and were the real driver of the 502s rather than any single change", "A dark-debt emergent interaction with no trigger — an invisible coupling between two components that surfaced spontaneously without any deploy or config push preceding it", "A DNS resolution failure plus a confounding traffic surge that coincidentally spiked at the same instant and made the true cause impossible to isolate"]
    answer: 0
    explanation: |
      A rule deployment (the trigger/active failure) shipped a regex whose backtracking pegged CPU
      fleet-wide (the latent condition: CPU had no per-request bound/guardrail). It maps cleanly to
      change-first plus a latent unbounded-resource condition — closing either hole (a CPU limit, or
      a regex engine like RE2 without catastrophic backtracking) would have prevented the global impact.
    ref: "concepts.md#canonical-incident-stories"

  - id: root-cause-analysis-and-troubleshooting-082
    difficulty: expert
    tags: [roblox-2021, dark-debt, emergent-interaction]
    question: |
      The Roblox 2021 outage (~73 hours) stemmed from an interaction between Consul's new
      streaming feature and BoltDB write contention under load — something no code review would
      have caught. Which concept is this the canonical example of?
    options: ["A single point of failure that a fault-tree analysis would have flagged in advance as a size-one minimal cut set needing redundancy", "Dark debt / unknown-unknowns — an emergent hazard invisible to inspection", "A fat-finger active failure at the sharp end, where an operator mistyped a command and directly triggered the multi-day outage on their own", "Confirmation bias during diagnosis, where responders anchored on a favorite suspect and kept the outage going by chasing agreeing evidence"]
    answer: 1
    explanation: |
      No single component was "wrong" — the hazard lived in the emergent interaction between Consul
      streaming and BoltDB under load, invisible to inspection and only revealed by the anomaly.
      That is textbook dark debt / unknown-unknowns, and it explains why single-cause thinking and
      "we reviewed it" fail for complex-system safety (Cook #4).
    ref: "concepts.md#latent-vs-active-failures-and-dark-debt"

  - id: root-cause-analysis-and-troubleshooting-083
    difficulty: intermediate
    tags: [premature-closure, cognitive-bias]
    question: |
      During an incident you find a plausible cause quickly, apply a fix, and close the
      investigation — but two weeks later the same symptom recurs. Which cognitive trap most
      likely occurred?
    options: ["A Little's Law estimation error, where you mis-derived the required concurrency from arrival rate and latency and sized the fix to the wrong bottleneck", "Premature closure — stopping the search at the first plausible cause without confirming it fully or checking for co-causes", "Reverse causation, where the fix you applied was actually being caused by the symptom rather than the other way around, inverting the real chain", "The USE method — checking utilization, saturation, and errors per resource, which is what led you to the recurring symptom"]
    answer: 1
    explanation: |
      Premature closure is declaring the cause found and halting too early. In multi-causal
      complex failures, the first plausible cause is often one of several holes, so a shallow fix
      leaves the others in place and the incident recurs. The remedy is confirming the mechanism
      and surfacing the other contributing factors before closing.
    ref: "concepts.md#cognitive-biases-and-the-heisenbug"

  - id: root-cause-analysis-and-troubleshooting-084
    difficulty: expert
    tags: [kt-rational-processes, situation-appraisal]
    question: |
      Kepner-Tregoe defines four rational processes. During a chaotic multi-alarm incident where
      you must decide WHICH problem to work on first, which KT process applies?
    options: ["Problem Analysis — find the single cause of one specific deviation by building its IS/IS-NOT boundary before any prioritization happens", "Decision Analysis — weigh and choose among competing remediation options against defined must-have and want criteria", "Situation Appraisal — clarify, prioritize, and plan which concerns to address first", "Potential Problem Analysis — anticipate future risks in a chosen plan and pre-stage preventive and contingent actions for them"]
    answer: 2
    explanation: |
      Situation Appraisal is the KT process for sorting out a messy situation: list the concerns,
      set priority, and decide what to tackle first and how. Problem Analysis then finds the cause
      of a chosen deviation, Decision Analysis picks among fixes, and Potential Problem Analysis
      pre-empts risks in the chosen plan.
    ref: "concepts.md#kepner-tregoe-is-and-is-not"
