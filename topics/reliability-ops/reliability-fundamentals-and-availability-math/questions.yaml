topic: "Reliability Fundamentals & Availability Math"
domain: reliability-ops
topic_slug: reliability-fundamentals-and-availability-math
version: 1
questions:
- id: reliability-fundamentals-and-availability-math-001
  difficulty: beginner
  tags: [availability, definition, formula]
  question: |
    How is availability defined in its most basic form?
  options:
  - "uptime / (uptime + downtime)"
  - "downtime / (uptime + downtime)"
  - "uptime / downtime"
  - "MTTR / MTBF"
  answer: 0
  explanation: |
    Availability is the fraction of total time the system is operational:
    uptime / (uptime + downtime) = uptime / total_time. The ratio
    downtime / (uptime + downtime) is *unavailability*, and MTTR / MTBF is not it.
  ref: "concepts.md#availability-defined-uptime-over-total-time"

- id: reliability-fundamentals-and-availability-math-002
  difficulty: beginner
  tags: [nines, downtime, numbers]
  question: |
    Approximately how much downtime per year does a 99.9% (three-nines)
    availability target allow?
  options:
  - "52.6 minutes"
  - "5.26 minutes"
  - "8.76 hours"
  - "3.65 days"
  answer: 2
  explanation: |
    Three-nines ≈ 8.76 hours/year. Landmark figures: three-nines ≈ 8.76 h/yr,
    four-nines ≈ 52.6 min/yr, five-nines ≈ 5.26 min/yr. Two-nines (99%) is
    3.65 days.
  ref: "concepts.md#the-nines-table-availability-targets-and-downtime"

- id: reliability-fundamentals-and-availability-math-003
  difficulty: beginner
  tags: [nines, downtime, numbers]
  question: |
    A service must not be down more than about 52.6 minutes per year. Which
    availability target is it committing to?
  options:
  - "99.9% (three nines)"
  - "99.99% (four nines)"
  - "99.999% (five nines)"
  - "99% (two nines)"
  answer: 1
  explanation: |
    Four-nines (99.99%) allows ≈ 52.6 minutes of downtime per year. Each
    additional nine divides the allowed downtime by 10.
  ref: "concepts.md#the-nines-table-availability-targets-and-downtime"

- id: reliability-fundamentals-and-availability-math-004
  difficulty: intermediate
  tags: [durability, availability, s3, distinction]
  question: |
    Amazon S3 advertises "eleven nines" (99.999999999%). What property does that
    number describe?
  options:
  - "Availability — the service is essentially never unreachable"
  - "Latency — 99.999999999% of requests are served in under 10 milliseconds"
  - "Reliability — mean time between failures of the service"
  - "Durability — the probability that stored objects are not lost"
  answer: 3
  explanation: |
    Eleven nines is a *durability* figure (objects won't be lost). S3's
    *availability* target is far lower (~99.9%–99.99% depending on tier). Durability
    and availability are distinct properties.
  ref: "concepts.md#reliability-vs-availability-vs-durability"

- id: reliability-fundamentals-and-availability-math-005
  difficulty: intermediate
  tags: [reliability, availability, mtbf, mttr, distinction]
  question: |
    A system fails only rarely, but when it does it stays down for several hours.
    How would you best characterize it?
  options:
  - "Highly available but not reliable"
  - "Both highly reliable and highly available"
  - "Highly reliable but not highly available"
  - "Neither reliable nor available"
  answer: 2
  explanation: |
    Rare failures = high MTBF = high reliability. But long recovery (large MTTR)
    means low availability, since availability = MTBF/(MTBF+MTTR) and a big MTTR
    drags it down. Reliability is about how often you fail, availability about how
    much time you're up.
  ref: "concepts.md#reliability-vs-availability-vs-durability"

- id: reliability-fundamentals-and-availability-math-006
  difficulty: intermediate
  tags: [mtbf, mttr, availability, formula]
  question: |
    A repairable service has MTBF ≈ 1000 hours and MTTR = 1 hour. What is its
    steady-state availability?
  options:
  - "≈ 99.9%"
  - "≈ 99%"
  - "≈ 99.99%"
  - "≈ 90%"
  answer: 0
  explanation: |
    A = MTBF/(MTBF+MTTR) = 1000/1001 ≈ 0.999 = 99.9% (three nines).
  ref: "concepts.md#deriving-availability-from-mtbf-and-mttr"

- id: reliability-fundamentals-and-availability-math-007
  difficulty: advanced
  tags: [mttr, mtbf, availability, judgment]
  question: |
    A service is at 99.9% with MTBF = 1000 h and MTTR = 1 h. Automated failover cuts
    MTTR to 6 minutes (0.1 h) without changing the failure rate. What availability
    results, and what's the lesson?
  options:
  - "Still 99.9% — availability depends only on failure rate, so MTTR changes are irrelevant"
  - "≈ 99.5% — faster recovery raises restart churn, so it slightly hurts availability"
  - "≈ 99.999% — a 10x MTTR cut always adds two full nines regardless of the MTBF"
  - "≈ 99.99% — reducing MTTR 10x bought a whole extra nine without failing less"
  answer: 3
  explanation: |
    A = 1000/(1000+0.1) ≈ 0.9999 = 99.99%. A 10x reduction in recovery time added a
    full nine with the same failure frequency. Reducing MTTR is often the cheapest
    way to buy a nine.
  ref: "concepts.md#deriving-availability-from-mtbf-and-mttr"

- id: reliability-fundamentals-and-availability-math-008
  difficulty: intermediate
  tags: [serial, dependencies, multiplication, numbers]
  question: |
    Five independent components, each 99.9% available, sit in series on the critical
    path (all must be up). What is the approximate end-to-end availability?
  options:
  - "99.9%"
  - "≈ 99.5%"
  - "99.99%"
  - "≈ 99.95%"
  answer: 1
  explanation: |
    Serial availabilities multiply: 0.999^5 ≈ 0.995 = 99.5% (≈ 43.8 h/yr down). The
    chain is worse than any single component — a system is only as good as its
    weakest hard dependency, minus the tax of every serial hop.
  ref: "concepts.md#serial-dependencies-multiply"

- id: reliability-fundamentals-and-availability-math-009
  difficulty: intermediate
  tags: [parallel, redundancy, formula, numbers]
  question: |
    Two redundant instances, each 99% available, are placed in parallel so the
    request succeeds if at least one is up. What is the combined availability?
  options:
  - "99.99%"
  - "99%"
  - "99.9%"
  - "98%"
  answer: 0
  explanation: |
    Parallel: A = 1-(1-a)^n = 1-(1-0.99)^2 = 1-0.0001 = 0.9999 = 99.99%. Two
    mediocre components in parallel can beat one great component in series.
  ref: "concepts.md#parallel-redundancy-improves-availability"

- id: reliability-fundamentals-and-availability-math-010
  difficulty: intermediate
  tags: [hard-dependency, soft-dependency, definition]
  question: |
    What distinguishes a "hard" dependency from a "soft" dependency?
  options:
  - "A hard dependency is written in a compiled language, while a soft one is written in an interpreted scripting language"
  - "A hard dependency is an internally-owned service, whereas a soft dependency is any externally-operated third-party service"
  - "If a hard dependency is down the request cannot succeed, if a soft one is down the request can still succeed (degraded)"
  - "A hard dependency uses synchronous calls, a soft one uses asynchronous calls only"
  answer: 2
  explanation: |
    A hard dependency's outage means your request fails (its availability multiplies
    into yours). A soft dependency can be down and you still serve (degraded via
    fallback/cache/defaults), so it doesn't cap your availability.
  ref: "concepts.md#hard-vs-soft-dependencies"

- id: reliability-fundamentals-and-availability-math-011
  difficulty: advanced
  tags: [hard-dependency, slo, judgment]
  question: |
    Your service targets 99.99% availability, but its database dependency only
    offers 99.9%. Under what condition can your target still be achievable?
  options:
  - "It's never achievable — you're capped at the database's 99.9%"
  - "Only if you retry the database enough times to eventually get a successful response"
  - "Only if the database is deployed in a different region from your service's compute"
  - "Only if the database is a soft dependency for the SLO'd operation (you can serve from cache/degraded when it's down)"
  answer: 3
  explanation: |
    If the database is a *hard* dependency, your ceiling is 99.9% (its availability
    multiplies in). You can exceed it only by making the database soft — serving from
    cache, defaults, or a redundant store when it's unavailable. Retries against a
    down database don't help.
  ref: "concepts.md#hard-vs-soft-dependencies"

- id: reliability-fundamentals-and-availability-math-012
  difficulty: intermediate
  tags: [fault, error, failure, taxonomy]
  question: |
    In dependability terminology (fault → error → failure), which is the externally
    observable deviation from correct service that users and SLIs see?
  options:
  - "Fault"
  - "Failure"
  - "Error"
  - "Defect"
  answer: 1
  explanation: |
    A *fault* is the root-cause defect, an *error* is the resulting incorrect
    internal state, and a *failure* is the observable break from spec that
    users/SLIs actually see. Not every fault becomes an error, and not every error
    becomes a failure.
  ref: "concepts.md#fault-vs-error-vs-failure"

- id: reliability-fundamentals-and-availability-math-013
  difficulty: beginner
  tags: [nines, downtime, five-nines, numbers]
  question: |
    Five-nines (99.999%) availability corresponds to roughly how much downtime per
    year?
  options:
  - "5.26 minutes"
  - "52.6 minutes"
  - "8.76 hours"
  - "26.3 seconds"
  answer: 0
  explanation: |
    Five-nines ≈ 5.26 minutes/year. This is essentially incompatible with a
    synchronous human recovery step — a single human-handled incident can blow the
    whole annual budget.
  ref: "concepts.md#the-nines-table-availability-targets-and-downtime"

- id: reliability-fundamentals-and-availability-math-014
  difficulty: advanced
  tags: [five-nines, judgment, mttr]
  question: |
    Why is a five-nines (99.999%) target considered largely incompatible with humans
    in the recovery loop?
  options:
  - "Humans can't read dashboards fast enough to see the metrics change before an alert auto-clears itself"
  - "Five-nines mathematically requires more than five redundant replicas, and humans can't manage that many by hand"
  - "The annual budget is ~5.26 minutes, so even a single incident with human paging and diagnosis time exhausts it — it demands automated failover"
  - "It's a formal compliance requirement that only an automated certification system, never a human operator, may sign off on"
  answer: 2
  explanation: |
    5.26 min/year is so tight that the time just to page an engineer plus any manual
    diagnosis blows the budget. Five-nines requires automated detection and failover
    with no synchronous human step. Most business systems target three or four nines.
  ref: "concepts.md#the-nines-table-availability-targets-and-downtime"

- id: reliability-fundamentals-and-availability-math-015
  difficulty: intermediate
  tags: [mttf, mtbf, definition]
  question: |
    What is the key distinction between MTTF and MTBF?
  options:
  - "MTTF is always measured in operating hours, whereas MTBF is conventionally measured in calendar days"
  - "MTTF applies to non-repairable units, MTBF applies to repairable systems (MTBF = MTTF + MTTR)"
  - "MTTF rolls the repair interval into its value, whereas MTBF deliberately excludes all repair time"
  - "They are two interchangeable names for exactly the same underlying reliability quantity"
  answer: 1
  explanation: |
    MTTF (Mean Time To Failure) applies to non-repairable units you replace on
    failure; MTBF (Mean Time Between Failures) applies to repairable systems, and
    MTBF = MTTF + MTTR (time to fail plus time to repair).
  ref: "concepts.md#the-time-based-metrics-mtbf-mttf-mttr-mttd-mtta"

- id: reliability-fundamentals-and-availability-math-016
  difficulty: intermediate
  tags: [mttd, mtta, mttr, incident-lifecycle]
  question: |
    In the incident lifecycle, what does MTTA (Mean Time To Acknowledge) measure?
  options:
  - "Time from the underlying failure occurring to the monitoring alarm finally firing"
  - "Time from a responder acknowledging the alert to the full root-cause fix being deployed"
  - "Time elapsed between two consecutive independent failures of the same service"
  - "Time from the alert firing to a human acknowledging it"
  answer: 3
  explanation: |
    MTTA is the average time from an alert firing to a human acknowledging it — an
    on-call responsiveness metric. MTTD is detection (failure→alarm), and both are
    sub-phases of the broader MTTR (detect → acknowledge → diagnose → fix → verify).
  ref: "concepts.md#the-time-based-metrics-mtbf-mttf-mttr-mttd-mtta"

- id: reliability-fundamentals-and-availability-math-017
  difficulty: advanced
  tags: [availability-budget, serial, request-path, numbers]
  question: |
    You want 99.9% end-to-end availability across 3 equally-weighted hard
    dependencies in series. Approximately what availability must each dependency hit?
  options:
  - "99.9% each"
  - "99.3% each"
  - "99.97% each"
  - "99.99% each"
  answer: 2
  explanation: |
    Each must satisfy a^3 ≥ 0.999, so a ≈ 0.999^(1/3) ≈ 0.99967 ≈ 99.97%. This is
    why platform/infra services are held to stricter SLOs than the products built on
    them — their budget is split across many serial hops and consumers.
  ref: "concepts.md#the-availability-budget-across-a-request-path"

- id: reliability-fundamentals-and-availability-math-018
  difficulty: advanced
  tags: [redundancy, correlated-failure, independence, anti-pattern]
  question: |
    An engineer computes availability for three replicas as 1-(1-0.99)^3 ≈ 99.9999%,
    but the replicas are in the same AZ, behind the same LB, running the same deploy.
    Why is the real availability likely much lower?
  options:
  - "The formula assumes independent failures, but shared AZ/LB/deploy create correlated failures that violate independence"
  - "The formula should multiply the three availabilities directly instead of using the complement of the product"
  - "Three replicas exceeds the formula's limit; the parallel expression is only valid for exactly two components"
  - "A per-node availability as low as 99% is below the threshold at which the parallel formula stays accurate"
  answer: 0
  explanation: |
    1-(1-a)^n assumes failures are independent. A shared AZ, load balancer, or bad
    deploy is a single correlated event that can take all three down at once, so the
    formula badly overstates reality. Real redundancy spreads across fault domains
    and staggers deploys.
  ref: "concepts.md#parallel-redundancy-improves-availability"

- id: reliability-fundamentals-and-availability-math-019
  difficulty: intermediate
  tags: [request-based, time-based, measurement, sre]
  question: |
    Why does Google SRE generally recommend request-based (aggregate) availability
    over pure time-based availability?
  options:
  - "It's easier to compute, since you can derive it directly from server uptime logs without instrumenting each request"
  - "It always produces a higher number than time-based availability, which makes the service look better to leadership"
  - "Time-based availability is not a real metric that monitoring systems report, so request-based is the only choice"
  - "It weights outages by the traffic (and thus user pain) they cause, so a minute of downtime at peak costs more than a minute at 3 a.m."
  answer: 3
  explanation: |
    Request-based availability = good_requests/total_requests weights an outage by
    how many real requests it broke. Time-based availability treats a quiet-hour
    minute the same as a peak minute, and a service returning errors while "up" looks
    healthy.
  ref: "concepts.md#availability-defined-uptime-over-total-time"

- id: reliability-fundamentals-and-availability-math-020
  difficulty: advanced
  tags: [mttr, mtbf, judgment, cost]
  question: |
    For a team trying to add one more nine of availability, which lever is usually
    the cheaper and more effective one to pull first?
  options:
  - "Increase MTBF 10x by tightening code review so the team simply never ships a bug that reaches production"
  - "Reduce MTTR ~10x via automation, fast rollback, and better detection"
  - "Buy more expensive enterprise-grade hardware with longer warranties to eliminate essentially all faults at the source"
  - "Lengthen the measurement window from 28 days to a year so occasional incidents average out to a better number"
  answer: 1
  explanation: |
    Since A = MTBF/(MTBF+MTTR), you can add a nine either by 10x-ing MTBF (hard,
    expensive — you can't stop failing) or dividing MTTR by 10 (automated failover,
    fast rollback, faster detection). Reducing MTTR is usually cheaper and where most
    teams under-invest.
  ref: "concepts.md#deriving-availability-from-mtbf-and-mttr"

- id: reliability-fundamentals-and-availability-math-021
  difficulty: beginner
  tags: [nines, per-day, numbers]
  question: |
    Roughly how much downtime per day does a 99.99% (four-nines) target permit?
  options:
  - "8.64 seconds"
  - "1.44 minutes"
  - "14.4 minutes"
  - "864 milliseconds"
  answer: 0
  explanation: |
    Four-nines ≈ 8.64 seconds/day. (Three-nines ≈ 1.44 min/day; two-nines ≈ 14.4
    min/day; five-nines ≈ 864 ms/day.)
  ref: "concepts.md#the-nines-table-availability-targets-and-downtime"

- id: reliability-fundamentals-and-availability-math-022
  difficulty: advanced
  tags: [critical-path, hard-dependency, judgment, design]
  question: |
    Which change most directly raises the *achievable* availability ceiling of a
    request path?
  options:
  - "Adding more log statements on the critical path so failures are captured in detail and can be diagnosed and recovered from faster"
  - "Increasing the retry count against every dependency so transient errors are absorbed before they ever surface to the caller"
  - "Reducing the number of hard dependencies on the critical path (e.g., demoting some to soft via caching/fallbacks or moving work off the synchronous path)"
  - "Switching the metrics reporting window from a rolling 28 days to 90 days so brief outages are diluted across a longer average"
  answer: 2
  explanation: |
    Every hard dependency in series multiplies into (lowers) your availability. The
    biggest lever is cutting hard dependencies on the critical path — demote them to
    soft (cache/fallback/defaults) or move them async. A longer window just masks
    badness; retries don't help when a dependency is genuinely down.
  ref: "concepts.md#the-availability-budget-across-a-request-path"

- id: reliability-fundamentals-and-availability-math-023
  difficulty: intermediate
  tags: [fault, error, failure, cascading]
  question: |
    In a chain of dependent services, how does a failure in one service typically
    relate to the one that depends on it?
  options:
  - "It has no effect on the dependent service as long as that service has structured logging and health checks enabled"
  - "It converts the downstream error into a benign fault that the runtime automatically resolves through built-in retry logic"
  - "It always upgrades the downstream service's availability, because shedding the failed call frees capacity for other work"
  - "A failure in the upstream service becomes a fault for the downstream system that depends on it"
  answer: 3
  explanation: |
    A failure in a dependency is, from the perspective of the consumer, a fault — a
    root cause it must tolerate. Unhandled, that fault can activate into an error and
    then a failure downstream, which is exactly how cascading failures propagate.
  ref: "concepts.md#fault-vs-error-vs-failure"

- id: reliability-fundamentals-and-availability-math-024
  difficulty: intermediate
  tags: [mttr, ambiguity, sla, judgment]
  question: |
    An SLA promises a "4-hour MTTR." A candidate points out this is ambiguous. What's
    the strongest reason?
  options:
  - "MTTR can't be expressed in hours because it is defined as a unitless ratio of failures to repairs, not a duration"
  - "'R' can mean Repair, Restore, Recover, or Resolve — restoring service differs from fixing the root cause, so the promise is unclear without specifying which"
  - "MTTR should always be measured in days rather than hours for SLAs, since sub-day recovery targets are not contractually enforceable"
  - "MTTR only applies to physical hardware components and has no meaningful definition for software services or their SLAs"
  answer: 1
  explanation: |
    MTTR is overloaded across Repair/Restore/Recovery/Resolve. SLAs usually mean
    *restore service*, which can be far faster than *root-cause resolved*. Always
    clarify which "R" a metric or SLA refers to.
  ref: "concepts.md#the-time-based-metrics-mtbf-mttf-mttr-mttd-mtta"

- id: reliability-fundamentals-and-availability-math-025
  difficulty: beginner
  tags: [durability, definition]
  question: |
    Durability, as a system property, is primarily concerned with which question?
  options:
  - "Will stored data survive (not be lost) over time?"
  - "Is the system reachable right now?"
  - "How many requests per second can it handle?"
  - "How often does the service crash?"
  answer: 0
  explanation: |
    Durability is the probability that stored data is not lost over a period (e.g.,
    S3's 11 nines of durability). It is distinct from availability (reachable now)
    and reliability (failure-free operation over an interval).
  ref: "concepts.md#reliability-vs-availability-vs-durability"

- id: reliability-fundamentals-and-availability-math-026
  difficulty: advanced
  tags: [serial, weakest-link, judgment]
  question: |
    A request path has hard dependencies at 99.99%, 99.99%, and 99.9%. Which is the
    most accurate statement about the path's availability?
  options:
  - "It equals the arithmetic average of the three availabilities, which works out to roughly 99.96% across the path"
  - "It equals the highest of the three, 99.99%, because the strongest dependency effectively carries the whole path"
  - "It is at best 99.9% (capped by the least-available hard dependency) and actually a bit lower once all three multiply"
  - "It is 99.99% because two of the three dependencies already meet that level and a majority determines the result"
  answer: 2
  explanation: |
    Serial availabilities multiply: 0.9999 × 0.9999 × 0.999 ≈ 0.9988 ≈ 99.88%. The
    path can be no better than its weakest hard link (99.9%) and is actually worse
    once every hop is multiplied in.
  ref: "concepts.md#serial-dependencies-multiply"

- id: reliability-fundamentals-and-availability-math-027
  difficulty: intermediate
  tags: [parallel, redundancy, judgment]
  question: |
    Comparing one component at 99.9% (in series) versus two components at 99% each
    (in parallel, succeed-if-any), which has higher availability?
  options:
  - "The single 99.9% component, since one better part always beats two weaker ones"
  - "The two parallel 99% components, at ≈ 99.99%"
  - "They are exactly equal, because 99% + 99% averages back out to about 99.9%"
  - "Cannot be compared without knowing each component's MTTR and repair rate first"
  answer: 1
  explanation: |
    Two 99% components in parallel give 1-(1-0.99)^2 = 99.99%, which beats a single
    99.9% component. Redundancy attacks the unavailability term and can outperform a
    single higher-quality component — assuming independent failures.
  ref: "concepts.md#parallel-redundancy-improves-availability"

- id: reliability-fundamentals-and-availability-math-028
  difficulty: intermediate
  tags: [nines, cost, judgment]
  question: |
    How does the cost of achieving availability typically scale as you add nines
    (e.g., three → four → five)?
  options:
  - "Linearly — each additional nine costs the same fixed increment as the one before it, so budgeting is straightforward"
  - "It decreases — additional nines get progressively cheaper as economies of scale and reused tooling kick in"
  - "It's essentially free once you have monitoring and dashboards in place, since visibility alone drives the nines up"
  - "Super-linearly — each additional nine tends to cost several times more (redundancy, multi-region, automation, staffing)"
  answer: 3
  explanation: |
    Each nine cuts allowed downtime by 10x and demands progressively more redundancy,
    cross-region infra, automation, and on-call investment. Cost climbs
    super-linearly, so the target should be a business decision, not a badge.
  ref: "concepts.md#the-nines-table-availability-targets-and-downtime"

- id: reliability-fundamentals-and-availability-math-029
  difficulty: advanced
  tags: [dependency-target, sre, hard-dependency, judgment]
  question: |
    Google SRE guidance says a service's availability target should generally be
    _____ that of its hard dependencies.
  options:
  - "lower than"
  - "exactly equal to"
  - "higher than"
  - "unrelated to"
  answer: 2
  explanation: |
    A service can't reliably exceed the availability of a hard dependency, so its own
    target should be set *higher* than the dependency's — otherwise it can never meet
    its SLO. To be more available than a dependency, that dependency must be made
    soft.
  ref: "concepts.md#hard-vs-soft-dependencies"

- id: reliability-fundamentals-and-availability-math-030
  difficulty: beginner
  tags: [fault, definition, taxonomy]
  question: |
    In fault/error/failure terminology, what is a "fault"?
  options:
  - "The underlying defect or root cause (e.g., a bug, bad config, or failing disk), which may be latent"
  - "The externally observable break in service that end users and SLIs actually perceive during an incident"
  - "The incorrect internal state produced once an activated defect has already propagated to the service boundary"
  - "The alert that the monitoring system fires whenever something goes wrong on the critical request path"
  answer: 0
  explanation: |
    A fault is the root-cause defect — a bug, misconfiguration, or hardware flaw. It
    can be latent/dormant. When activated it produces an *error* (wrong internal
    state), which if it propagates becomes a *failure* (observable break).
  ref: "concepts.md#fault-vs-error-vs-failure"

- id: reliability-fundamentals-and-availability-math-031
  difficulty: advanced
  tags: [measurement-window, judgment, slo]
  question: |
    Why does reporting availability over a rolling 28-day window generally represent
    a stricter commitment than reporting it averaged over a full calendar year?
  options:
  - "Shorter reporting windows always produce lower availability numbers by mathematical definition, regardless of incidents"
  - "A 28-day window contains fewer total minutes, so each minute of downtime is weighted less against the denominator"
  - "Calendar-year reporting of availability is not permitted by any standard SLA, so 28 days is the only compliant option"
  - "A long window lets you 'bank' quiet, healthy periods that dilute and mask a bad day or week, whereas a short window can't hide it"
  answer: 3
  explanation: |
    Over a year you can amortize a bad week against many good months, hiding it in
    the average. A 28-day rolling window can't dilute a bad day as much, so the same
    availability number represents a tighter guarantee. Always ask "measured over
    what window?"
  ref: "concepts.md#availability-defined-uptime-over-total-time"

- id: reliability-fundamentals-and-availability-math-032
  difficulty: intermediate
  tags: [reliability, formula, mtbf]
  question: |
    Reliability R(t) is best described as which of the following?
  options:
  - "The fraction of time a system is reachable"
  - "The probability of failure-free operation over a time interval t"
  - "The probability that stored data is not lost"
  - "The number of replicas in the system"
  answer: 1
  explanation: |
    Reliability is the probability that a system operates without failure over an
    interval t (often modeled as R(t) = e^(-t/MTBF)). Availability is about fraction
    of time up; durability is about data not being lost.
  ref: "concepts.md#reliability-vs-availability-vs-durability"

- id: reliability-fundamentals-and-availability-math-033
  difficulty: advanced
  tags: [soft-dependency, degradation, design, judgment]
  question: |
    Which technique effectively removes a dependency from your availability
    multiplication by turning it from hard into soft?
  options:
  - "Serving from a cache/stale data or a sensible default when the dependency is unavailable (graceful degradation)"
  - "Adding more aggressive retries with exponential backoff but no fallback path when the dependency stays down"
  - "Increasing the request timeout on calls to it so slow responses have more time to eventually arrive successfully"
  - "Logging every call to it for audit so outages are fully traceable and can be replayed once it recovers"
  answer: 0
  explanation: |
    A soft dependency doesn't cap your availability because you can still serve when
    it's down — via cache, stale data, defaults, or a degraded feature. Retries and
    longer timeouts against a genuinely-down hard dependency don't make it soft; they
    often make things worse.
  ref: "concepts.md#hard-vs-soft-dependencies"

- id: reliability-fundamentals-and-availability-math-034
  difficulty: beginner
  tags: [nines, two-nines, numbers]
  question: |
    Two-nines (99%) availability corresponds to roughly how much downtime per year?
  options:
  - "8.76 hours"
  - "52.6 minutes"
  - "3.65 days"
  - "36.5 days"
  answer: 2
  explanation: |
    99% allows ≈ 3.65 days/year of downtime. 90% (one nine) would be ≈ 36.5 days;
    99.9% ≈ 8.76 hours.
  ref: "concepts.md#the-nines-table-availability-targets-and-downtime"

- id: reliability-fundamentals-and-availability-math-035
  difficulty: intermediate
  tags: [error, definition, taxonomy]
  question: |
    An "error" in dependability terms is best defined as what?
  options:
  - "The latent defect sitting dormant in the system before it has been activated or done any damage"
  - "The externally observable service outage that users and downstream consumers directly experience"
  - "A user complaint ticket filed with support once someone notices the service behaving incorrectly"
  - "The incorrect internal state produced when a fault is activated (which may still be invisible externally)"
  answer: 3
  explanation: |
    An error is the activated fault manifesting as incorrect internal state (a
    corrupted value, an exhausted thread pool). It may not yet be externally visible;
    it becomes a failure only if it propagates to observable behavior. A tolerant
    system can catch the error before it becomes a failure.
  ref: "concepts.md#fault-vs-error-vs-failure"

- id: reliability-fundamentals-and-availability-math-036
  difficulty: advanced
  tags: [mttd, detection, mttr, observability]
  question: |
    Within MTTR, why is MTTD (time to detect) considered especially high-leverage?
  options:
  - "Detection is the only phase of the incident lifecycle that can be fully outsourced to a third-party monitoring vendor"
  - "You cannot begin recovering from a failure you haven't noticed, so detection delay is pure additive downtime — shrinking it directly shrinks MTTR"
  - "MTTD is always the single largest component of MTTR and dominates the recovery timeline by definition in every incident"
  - "Faster detection increases MTBF, since catching failures sooner lengthens the average interval between successive failures"
  answer: 1
  explanation: |
    MTTR spans detect → acknowledge → diagnose → fix → verify. Every second before
    detection is downtime during which nothing is being fixed, so reducing MTTD is a
    direct, often cheap win. This is why observability/alerting investment pays off
    (see observability domain for detection mechanics).
  ref: "concepts.md#the-time-based-metrics-mtbf-mttf-mttr-mttd-mtta"

- id: reliability-fundamentals-and-availability-math-037
  difficulty: advanced
  tags: [parallel, diminishing-returns, redundancy, numbers]
  question: |
    Each redundant instance you add in parallel (succeed-if-any) has what effect on
    the system's unavailability, assuming independent failures?
  options:
  - "It multiplies the remaining unavailability by (1-a) again, giving diminishing absolute returns"
  - "It adds a fixed two nines per instance regardless of each node's individual availability or quality"
  - "It has no measurable effect once you are past the second instance, since the failover path saturates"
  - "It increases overall unavailability because inter-replica coordination overhead outweighs the redundancy gained"
  answer: 0
  explanation: |
    With A = 1-(1-a)^n, each added instance raises the (1-a) unavailability to a
    higher power — multiplying the leftover downtime by (1-a) each time. The absolute
    gain shrinks with each instance (diminishing returns), and the failover mechanism
    itself becomes a dependency.
  ref: "concepts.md#parallel-redundancy-improves-availability"

- id: reliability-fundamentals-and-availability-math-038
  difficulty: intermediate
  tags: [fault-tolerance, definition]
  question: |
    What is the essence of "fault tolerance" in the fault/error/failure model?
  options:
  - "Guaranteeing that no faults ever exist in the system by exhaustively proving the code correct before release"
  - "Automatically restarting the service after every failure so that each fault is cleared by a fresh process instance"
  - "Preventing faults and errors from propagating all the way to an observable failure (via redundancy, error handling, isolation)"
  - "Logging all faults to a central store so operators can review and manually correct them after the incident ends"
  answer: 2
  explanation: |
    Fault tolerance is about stopping the fault → error → failure propagation: catch
    the error before it becomes a user-visible failure using redundancy, defensive
    error handling, and isolation (circuit breakers, bulkheads). You can't eliminate
    all faults; you contain their blast radius.
  ref: "concepts.md#fault-vs-error-vs-failure"

- id: reliability-fundamentals-and-availability-math-039
  difficulty: expert
  tags: [availability-budget, infra, judgment, design]
  question: |
    Why are shared platform/infrastructure services (databases, auth, service mesh)
    typically held to stricter SLOs than the products that consume them?
  options:
  - "They are more fun to operate, so infra teams voluntarily hold themselves to tighter numbers than product teams do"
  - "Their availability budget is split across many serial hops and many consuming products, and as hard dependencies they cap everything downstream"
  - "Regulations universally mandate that any shared infrastructure service must be certified at five-nines before it can serve production traffic"
  - "Products built on top of infra do not need SLOs at all, so the entire availability budget is assigned to the infra tier"
  answer: 1
  explanation: |
    An infra service is a hard dependency for many products and often sits several
    serial hops deep. Because serial availabilities multiply, each such service must
    exceed the product target (target^(1/n)) so the composed path can still meet its
    SLO. A weak shared dependency caps everyone above it.
  ref: "concepts.md#the-availability-budget-across-a-request-path"

- id: reliability-fundamentals-and-availability-math-040
  difficulty: beginner
  tags: [availability, unavailability, numbers]
  question: |
    A service was up for 8,758 hours out of 8,760 hours in a year. Approximately what
    availability is that?
  options:
  - "≈ 99.9%"
  - "≈ 99%"
  - "≈ 99.9999%"
  - "≈ 99.98%"
  answer: 3
  explanation: |
    Downtime = 2 hours. A = 8758/8760 ≈ 0.99977 ≈ 99.98%. (Two hours/year is between
    three-nines' 8.76 h and four-nines' 52.6 min.)
  ref: "concepts.md#availability-defined-uptime-over-total-time"

- id: reliability-fundamentals-and-availability-math-041
  difficulty: advanced
  tags: [correlated-failure, independence, judgment]
  question: |
    Both the serial (multiply) and parallel (1-(1-a)^n) availability formulas share
    one critical assumption. What is it, and why does violating it matter?
  options:
  - "They assume every component has identical availability, and mixing components with different values makes the arithmetic invalid"
  - "They assume MTTR is exactly zero, so any non-instant recovery requires adding a separate correction term to the result"
  - "They assume failures are statistically independent, and correlated failures (shared AZ, deploy, or config) make real availability worse than the formulas predict"
  - "They assume the whole system runs on a single host, so the formulas break down the moment work is spread across machines"
  answer: 2
  explanation: |
    Both formulas assume independent failures. In practice, shared fault domains
    (same AZ, same load balancer, same bad deploy or config push) create correlated
    failures that the math ignores, so treat computed availability as an optimistic
    upper bound and engineer real fault-domain isolation.
  ref: "concepts.md#serial-dependencies-multiply"

- id: reliability-fundamentals-and-availability-math-042
  difficulty: intermediate
  tags: [postmortem, fault, failure, rca]
  question: |
    A postmortem concludes "we fixed it by restarting the service." Why is this
    usually an incomplete resolution?
  options:
  - "It addresses the failure (symptom) but not the underlying fault (root cause), so the problem is likely to recur"
  - "Restarting is never a valid mitigation and should be forbidden from every incident-response runbook"
  - "Restarts always cause data loss, so any resolution that mentions one is automatically incomplete and unsafe"
  - "The postmortem should have assigned individual blame to the on-call engineer who was paged for the incident"
  answer: 0
  explanation: |
    Restarting clears the observable failure but not the fault that caused it. Good
    RCA/postmortems target the fault (root cause), not just restoring service — see
    reliability-ops/root-cause-analysis-and-troubleshooting and
    reliability-ops/blameless-postmortems-and-learning.
  ref: "concepts.md#fault-vs-error-vs-failure"

- id: reliability-fundamentals-and-availability-math-043
  difficulty: advanced
  tags: [serial-hops, microservices, design, judgment]
  question: |
    What is the reliability argument against long synchronous microservice call
    chains on the critical path?
  options:
  - "They consume too much memory per hop, so long chains inevitably exhaust the heap on the calling service"
  - "Synchronous calls cannot be logged or traced, leaving long chains effectively invisible to observability tooling"
  - "Individual microservices are structurally incapable of having their own SLOs, so chains of them cannot be measured"
  - "Each additional synchronous hard-dependency hop multiplies into (and lowers) end-to-end availability, so more serial hops means a lower ceiling"
  answer: 3
  explanation: |
    Serial availabilities multiply, so every added synchronous hard dependency drops
    the composed availability below the weakest link. This motivates reducing hops,
    making calls async/soft, and colocating critical work — the availability-budget
    argument.
  ref: "concepts.md#serial-dependencies-multiply"

- id: reliability-fundamentals-and-availability-math-044
  difficulty: intermediate
  tags: [availability, reliability, durability, matching]
  question: |
    Which mapping of property to the question it answers is correct?
  options:
  - "Availability → 'will my data survive?'; Durability → 'is it up now?'"
  - "Availability → 'is it up now / what fraction of the time?'; Reliability → 'will it keep working without failing over an interval?'; Durability → 'will stored data not be lost?'"
  - "Reliability → 'is it reachable right now?'; Availability → 'how often does it fail?'"
  - "All three answer the same question phrased differently"
  answer: 1
  explanation: |
    Availability = fraction of time up (is it up now?); reliability = failure-free
    operation over an interval (MTBF); durability = data not lost. They are three
    distinct properties, commonly conflated.
  ref: "concepts.md#reliability-vs-availability-vs-durability"

- id: reliability-fundamentals-and-availability-math-045
  difficulty: expert
  tags: [mtbf, mttr, availability, tradeoff, scenario]
  question: |
    Service A: MTBF = 200 h, MTTR = 0.05 h (3 min). Service B: MTBF = 5000 h,
    MTTR = 5 h. Which has higher availability, and what does it illustrate?
  options:
  - "A, because A ≈ 99.975% vs B ≈ 99.9%, showing that fast recovery can beat rare-but-long failures"
  - "B, because its 25x-longer MTBF means it fails far less often, and failure frequency is what dominates availability"
  - "They are equal, because the product MTBF×MTTR comes out similar for both and that product sets availability"
  - "Cannot tell without knowing the number of redundant replicas each service runs behind its load balancer"
  answer: 0
  explanation: |
    A: 200/(200+0.05) ≈ 0.99975 ≈ 99.975%. B: 5000/(5000+5) ≈ 0.9990 ≈ 99.9%. A
    fails ~25x more often but recovers so fast it's more available — availability is
    dominated by how long you stay down (MTTR), not just how often you fail.
  ref: "concepts.md#deriving-availability-from-mtbf-and-mttr"

- id: reliability-fundamentals-and-availability-math-046
  difficulty: intermediate
  tags: [nines, per-month, numbers]
  question: |
    Three-nines (99.9%) availability allows approximately how much downtime per
    30-day month?
  options:
  - "4.38 minutes"
  - "7.2 hours"
  - "43.8 minutes"
  - "26.3 seconds"
  answer: 2
  explanation: |
    99.9% over a 30-day month ≈ 43.8 minutes. (99.99% ≈ 4.38 min/month; 99% ≈ 7.2
    h/month; 99.999% ≈ 26.3 s/month.)
  ref: "concepts.md#the-nines-table-availability-targets-and-downtime"

- id: reliability-fundamentals-and-availability-math-047
  difficulty: expert
  tags: [availability-budget, soft-dependency, scenario, judgment]
  question: |
    Your product SLO is 99.95%. The critical path has one hard dependency at 99.9%
    that you cannot make more reliable soon. What is the most viable path to still
    meet the SLO?
  options:
  - "Add more retries against the 99.9% dependency so transient errors are absorbed before the caller ever sees them"
  - "Silently lower the published product SLO to 99.9% so the reported number matches the weakest hard dependency"
  - "Add a second parallel copy of your own service, since more redundancy on your side lifts the composed ceiling"
  - "Make that dependency soft on the critical path — serve from cache/stale/defaults when it's down — so its outages don't count as full request failures"
  answer: 3
  explanation: |
    A hard dependency at 99.9% caps you at 99.9% < 99.95%. Retries don't help when
    it's truly down, and adding copies of your own service doesn't fix the
    dependency. The reliability move is to make it soft (cache/stale/degraded), so
    its outages no longer fail your requests — removing it from the multiplication.
  ref: "concepts.md#hard-vs-soft-dependencies"

- id: reliability-fundamentals-and-availability-math-048
  difficulty: intermediate
  tags: [durability, availability, s3, scenario]
  question: |
    A candidate claims "S3's eleven nines means it's essentially never down." What's
    the precise correction?
  options:
  - "Eleven nines actually describes S3's request latency percentile, not its uptime or downtime at all"
  - "Eleven nines describes durability (objects won't be lost); S3's availability target is much lower (~99.9%–99.99%), so it can briefly be unreachable even though data isn't lost"
  - "Eleven nines is the per-bucket request throughput limit that S3 guarantees under its standard tier"
  - "S3 publishes no availability SLA at all, so the eleven-nines figure is the only guarantee it offers customers"
  answer: 1
  explanation: |
    The candidate conflated durability with availability. Eleven nines = data won't
    be lost; being reachable is a separate, lower guarantee (S3 Standard's
    availability SLA is ~99.9%). Nailing this distinction signals seniority.
  ref: "concepts.md#reliability-vs-availability-vs-durability"

- id: reliability-fundamentals-and-availability-math-049
  difficulty: expert
  tags: [quorum, k-of-n, binomial, redundancy, numbers]
  question: |
    You run 5 nodes, each 99% available, and the system needs at least 3 healthy for
    quorum. A colleague computes availability as 1-(1-0.99)^5 ≈ 99.99999999%. Why is
    that wrong, and what is the right approach?
  options:
  - "1-(1-a)^n is the 'succeed if ANY one is up' case; a k-of-n quorum needs the binomial tail P(>=3 of 5) = sum of P(3)+P(4)+P(5), which is lower (~99.999%)"
  - "It's correct as written; the any-one-up formula and a 3-of-5 quorum always evaluate to the same result"
  - "You should just multiply the per-node availabilities directly: 0.99^5 ≈ 95%, which is the true quorum value"
  - "Quorum availability simply equals a single node's availability, 99%, because one node can always answer for the group"
  answer: 0
  explanation: |
    1-(1-a)^n credits states where only 1 or 2 nodes survive, but a 3-of-5 quorum
    treats those as DOWN. The correct value is the binomial upper tail
    A = sum_{i=3}^{5} C(5,i)·0.99^i·0.01^(5-i) ≈ 0.99999 (five nines). Note k=1 reduces
    to 1-(1-a)^n and k=n reduces to a^n (series).
  ref: "concepts.md#quorum-and-k-of-n-redundancy-math"

- id: reliability-fundamentals-and-availability-math-050
  difficulty: advanced
  tags: [quorum, k-of-n, edge-cases, formula]
  question: |
    For a k-of-n system with per-node availability a, what do the special cases k=1 and
    k=n reduce to?
  options:
  - "k=1 reduces to a^n (all must be up = series); k=n reduces to 1-(1-a)^n (succeed if any one survives)"
  - "k=1 reduces to 1-(1-a)^n (succeed-if-any); k=n reduces to a^n (all must be up = series)"
  - "Both special cases reduce to n*a, the node count multiplied by the per-node availability"
  - "k=1 gives a flat 100% availability, while k=n gives 0% because requiring every node is impossible"
  answer: 1
  explanation: |
    The binomial P(>=k of n) generalizes both formulas: k=1 (need any one) is the
    parallel redundancy formula 1-(1-a)^n, and k=n (need all) is the serial-multiply
    formula a^n. Real quorum systems sit in between.
  ref: "concepts.md#quorum-and-k-of-n-redundancy-math"

- id: reliability-fundamentals-and-availability-math-051
  difficulty: expert
  tags: [exponential, reliability, mtbf, memoryless, numbers]
  question: |
    In the constant-failure-rate model R(t) = e^(-lambda*t) with lambda = 1/MTBF, what
    is the probability a component survives failure-free for exactly one full MTBF?
  options:
  - "e^(-1) ≈ 0.368 — only about 37%, since MTBF is a mean, not a guaranteed lifetime"
  - "1.0 — by definition a component always survives at least one full MTBF before it can fail"
  - "0.5 — MTBF is the median survival time, so exactly half of units make it past one MTBF"
  - "0.99 — surviving a single MTBF is nearly certain and only long-tail units fail before it"
  answer: 0
  explanation: |
    R(MTBF) = e^(-lambda·(1/lambda)) = e^(-1) ≈ 0.368. Only ~37% of units survive a full
    MTBF failure-free; MTBF is the mean of an exponential, not a floor. This surprises
    people who read MTBF as "it lasts this long."
  ref: "concepts.md#failure-rate-the-exponential-model-and-the-bathtub-curve"

- id: reliability-fundamentals-and-availability-math-052
  difficulty: expert
  tags: [bathtub-curve, mtbf, constant-hazard, judgment]
  question: |
    A staff engineer notes that A = MTBF/(MTBF+MTTR) and R(t) = e^(-lambda*t) are only
    strictly valid in one region of the bathtub curve. Which region, and why?
  options:
  - "Infant mortality, because the failure rate is highest there and that is where the exponential model is most accurate"
  - "Wear-out, because that is when most failures actually occur and the constant-rate assumption matches the aging fleet"
  - "The useful-life region, because only there is the hazard rate roughly constant (random failures) — the assumption both formulas rely on"
  - "All three regions equally, because the shape of the bathtub curve has no bearing on the underlying availability math"
  answer: 2
  explanation: |
    The exponential/constant-hazard model assumes a flat lambda. That holds only in the
    useful-life (middle) region. Infant mortality has decreasing hazard (burn-in/canary
    weeds it out) and wear-out has increasing hazard (aging fleets need proactive
    replacement), so a single constant lambda misrepresents both.
  ref: "concepts.md#failure-rate-the-exponential-model-and-the-bathtub-curve"

- id: reliability-fundamentals-and-availability-math-053
  difficulty: advanced
  tags: [memoryless, exponential, hazard, judgment]
  question: |
    Why does the memoryless property of the exponential distribution imply that a
    component in its constant-hazard region cannot have its life extended by
    scheduled preventive replacement?
  options:
  - "Because scheduled preventive replacement is always cheaper than reactive repair, so its reliability effect is irrelevant"
  - "Because P(survive t more | already survived s) = P(survive t) — a used unit's instantaneous failure probability equals a new one's, so swapping it changes nothing"
  - "Because the exponential distribution has infinite variance, which makes any per-unit replacement schedule statistically meaningless"
  - "Because electronic components never enter a wear-out region, so their hazard rate stays flat for their entire service life"
  answer: 1
  explanation: |
    Memorylessness means an aged component in the flat-hazard region is statistically
    as good (and as bad) as a new one, so proactive replacement buys no reliability
    there. Preventive replacement pays off only in the wear-out region where hazard
    rises with age.
  ref: "concepts.md#failure-rate-the-exponential-model-and-the-bathtub-curve"

- id: reliability-fundamentals-and-availability-math-054
  difficulty: expert
  tags: [afr, mtbf, fleet, capacity, numbers]
  question: |
    A disk is rated MTBF = 1.2 million hours. In a fleet of 10,000 such drives, roughly
    how many failures should you plan for per year?
  options:
  - "About 1 — an MTBF of 1.2M hours is ~137 years per drive, so barely one unit in the fleet fails each year"
  - "About 73 — AFR ≈ 8760/1,200,000 ≈ 0.73%, times 10,000 drives"
  - "About 730 — roughly 7.3% of the fleet fails per year once the rated MTBF is annualized"
  - "Zero within the warranty period, because the rated MTBF exceeds the drives' covered service window"
  answer: 1
  explanation: |
    AFR = 1 - e^(-8760/MTBF) ≈ 8760/MTBF ≈ 0.73%/drive/year. Across 10,000 drives that's
    ~73 failures/year (about one every five days). MTBF-the-spec is a fleet rate, not a
    per-unit lifetime; convert it to AFR to size spares and rebuild capacity.
  ref: "concepts.md#annualized-failure-rate-and-how-durability-is-composed"

- id: reliability-fundamentals-and-availability-math-055
  difficulty: expert
  tags: [durability, erasure-coding, replication, s3, judgment]
  question: |
    "S3 advertises eleven nines of durability — build me that number." Which
    combination of mechanisms actually composes such a durability figure?
  options:
  - "A single enterprise-grade disk with a very long rated MTBF, since one device that good on its own removes any need to spread copies across separate machines"
  - "Redundancy across independent fault domains (replication or erasure coding), fault-domain independence to avoid correlated loss, and fast repair (low rebuild MTTR) before overlapping failures accumulate"
  - "Keeping three full copies on the same server so reads stay fast, relying on that one host's RAID controller to ride out any single drive failure locally"
  - "A 99.999999999% availability SLA enforced at the load balancer, which reroutes around any unhealthy replica fast enough that stored objects are never at risk"
  answer: 1
  explanation: |
    Eleven nines is a composed number: erasure coding (reconstruct from any k of n
    shards) or replication spread across independent devices/racks/AZs, plus fast
    rebuild so lost redundancy is restored before enough additional independent losses
    overlap. Correlation is the real threat; a single disk or same-server copies don't
    get you there. Durability is not availability.
  ref: "concepts.md#annualized-failure-rate-and-how-durability-is-composed"

- id: reliability-fundamentals-and-availability-math-056
  difficulty: advanced
  tags: [erasure-coding, replication, durability, efficiency]
  question: |
    Compared with 3x replication, why is erasure coding often preferred for durable
    object storage?
  options:
  - "It requires no redundancy at all, because the parity math alone regenerates any lost bytes on demand without the system ever having to store extra shards"
  - "It tolerates more simultaneous losses at a lower storage overhead — an object split into data+parity shards reconstructs from any k of n, tolerating n-k losses at a fraction of 3x cost"
  - "It makes objects available faster because it keeps more full copies online than replication does, so every read can be served from the nearest complete replica"
  - "It eliminates the need for fault-domain independence, since parity shards can all sit in one rack and still reconstruct the object after any failure"
  answer: 1
  explanation: |
    Erasure coding splits an object into k data + (n-k) parity shards; any k of the n
    reconstruct it, tolerating n-k losses while storing far less than 3x. It still
    depends on spreading shards across independent fault domains and fast rebuild for
    durability; it doesn't remove those requirements.
  ref: "concepts.md#annualized-failure-rate-and-how-durability-is-composed"

- id: reliability-fundamentals-and-availability-math-057
  difficulty: expert
  tags: [correlated-failure, common-cause, beta-factor, redundancy, judgment]
  question: |
    Your redundancy math predicted six nines for a 3-replica group, but you had a full
    outage. Using the beta-factor model, what is the most likely explanation and the
    right fix?
  options:
  - "The replicas were simply starved of CPU under load; add capacity to each node and the six-nines number the redundancy math predicted will hold as designed"
  - "The formula should have used a^n (the series form) instead of 1-(1-a)^n, so the six-nines figure was an arithmetic mistake and the group was really only as good as one node"
  - "Six nines is simply unachievable for any real 3-replica group, so an occasional full outage like this one is the expected and unavoidable cost of that target"
  - "A common-cause fraction (beta) of failures hit all replicas at once (bad deploy/config, shared AZ or control plane); since the common-cause term ~beta*(1-a) doesn't shrink with n, adding replicas won't help — you need fault-domain isolation and staggered/canaried rollout"
  answer: 3
  explanation: |
    Independent failures shrink as (1-a)^n, but common-cause failures shrink only
    linearly (~beta*(1-a)) and quickly dominate. A single event (fleet-wide config,
    shared AZ, same deploy) violated independence. More replicas don't touch the beta
    term — the fix is independent fault domains, staggered/canaried deploys, and
    removing shared fate.
  ref: "concepts.md#correlated-and-common-cause-failures"

- id: reliability-fundamentals-and-availability-math-058
  difficulty: advanced
  tags: [redundancy, diminishing-returns, coordinator, correlated-failure, judgment]
  question: |
    A team asks "why not just add a 4th and 5th replica to push availability higher?"
    What is the strongest reliability objection?
  options:
  - "More replicas always reduce availability, because the extra inter-node replication traffic saturates the network and drags every node down together"
  - "Added copies drive only the independent term (1-a)^n toward zero (diminishing returns) while cost grows linearly; correlation (common-cause) sets a floor and the coordinator/failover mechanism adds a shared dependency that caps the gain — an independent fault domain is usually the better spend"
  - "Replicas must be provisioned in a power-of-two count, so jumping from 3 to 4 or 5 breaks the quorum arithmetic and yields an invalid availability figure"
  - "Health checks cannot distinguish more than three peers at once, so adding a fourth or fifth replica leaves the extra nodes permanently marked unhealthy and unused"
  answer: 1
  explanation: |
    Each independent copy multiplies the leftover unavailability by (1-a) again — smaller
    and smaller absolute gains — while cost is N x linear. Meanwhile the correlation
    floor and the failover coordinator's own availability cap the benefit. Spending on a
    new AZ/region/cell and reducing shared fate beats piling replicas into one domain.
  ref: "concepts.md#correlated-and-common-cause-failures"

- id: reliability-fundamentals-and-availability-math-059
  difficulty: expert
  tags: [series-parallel, redundancy, composition, numbers]
  question: |
    Two tiers are chained in series; each tier has 3 redundant nodes at 99.9%
    (succeed-if-any within a tier), failures independent. Approximately what is the
    end-to-end availability?
  options:
  - "≈ 99.7%, because all 6 nodes sit in series and their 99.9% availabilities multiply straight through (0.999^6)"
  - "≈ 99.9%, no better than a single node, because chaining tiers can never beat the availability of one component"
  - "≈ 99.9999998% — each tier is 1-(1-0.999)^3 ≈ nine-nines, then the two tiers multiply"
  - "≈ 99.99%, taking the simple arithmetic average of the two tiers' individual availabilities as the end-to-end figure"
  answer: 2
  explanation: |
    Reduce bottom-up: per tier 1-(1-0.999)^3 = 1-(10^-3)^3 = 1-10^-9 ≈ 0.999999999.
    Series product of two: ≈ 0.999999998. Redundancy inside a tier buys huge headroom;
    chaining two near-1 tiers erodes it only slightly. (Correlation, not this
    arithmetic, sets the real ceiling.)
  ref: "concepts.md#series-parallel-systems-and-deriving-the-nines-table"

- id: reliability-fundamentals-and-availability-math-060
  difficulty: intermediate
  tags: [nines, derivation, numbers]
  question: |
    Using minutes-in-a-year = 525,600, how do you derive the allowed yearly downtime for
    99.99% availability?
  options:
  - "0.0001 x 525,600 = 52.56 minutes"
  - "0.01 x 525,600 = 5,256 minutes, treating the unavailability of 99.99% as (1-0.99) = 0.01"
  - "0.001 x 525,600 = 525.6 minutes, treating the unavailability of 99.99% as (1-0.999) = 0.001"
  - "0.00001 x 525,600 = 5.26 minutes, treating the unavailability of 99.99% as (1-0.99999) = 0.00001"
  answer: 0
  explanation: |
    Allowed downtime = (1-A) x minutes/year. For 99.99%, (1-0.9999) = 0.0001, times
    525,600 = 52.56 min/year. The same method gives 99.9% -> 525.6 min (8.76 h) and
    99.999% -> 5.26 min. Being able to derive the table beats memorizing it.
  ref: "concepts.md#series-parallel-systems-and-deriving-the-nines-table"

- id: reliability-fundamentals-and-availability-math-061
  difficulty: expert
  tags: [littles-law, concurrency, capacity, pool-sizing, numbers]
  question: |
    A service handles 5,000 requests/sec with an average latency of 200 ms. By Little's
    Law, roughly how many requests are in flight concurrently, and what should that size?
  options:
  - "25 concurrent (dividing 5,000 req/s by the 200 ms latency); size the retry budget to match those 25 slots"
  - "5,000 concurrent — one in-flight slot per request/sec of arrival rate, independent of how long each request takes"
  - "1,000 concurrent (L = lambda x W = 5000 x 0.2); size thread/connection pools to ~1,000 plus headroom"
  - "200 concurrent — one in-flight slot per millisecond of average latency, independent of the arrival rate"
  answer: 2
  explanation: |
    Little's Law: L = lambda x W = 5000 req/s x 0.2 s = 1000 concurrent in-flight
    requests. That's the number of threads/connections/slots to provision (plus
    headroom). If latency doubles at the same arrival rate, concurrency doubles to 2000
    and a pool sized for 1000 exhausts.
  ref: "concepts.md#littles-law-concurrency-latency-and-pool-sizing"

- id: reliability-fundamentals-and-availability-math-062
  difficulty: expert
  tags: [littles-law, latency, pool-exhaustion, cascading, scenario]
  question: |
    At a fixed arrival rate, a downstream dependency slows down and your service's
    average latency doubles. Via Little's Law, what happens and why is a bounded pool
    the safer design?
  options:
  - "Nothing changes because the arrival rate is constant, and in-flight concurrency tracks only the arrival rate, never the per-request latency"
  - "Throughput doubles along with the latency, improving reliability by pushing twice as many requests through the same pool"
  - "Latency and concurrency are independent quantities, so the size of the connection or thread pool has no bearing on how a slowdown plays out"
  - "Concurrency (L = lambda x W) doubles even though traffic didn't; an unbounded pool keeps growing until resource exhaustion, whereas a bounded pool converts the overload into fast rejection (fail fast / shed) instead of total collapse"
  answer: 3
  explanation: |
    L = lambda x W, so doubling W doubles in-flight concurrency at the same lambda —
    silently, with no traffic change. An unbounded pool/queue grows until memory or
    threads are exhausted (a cascade). A bounded pool caps in-flight work and turns
    latency blow-ups into fast rejection you can shed, keeping the system alive.
  ref: "concepts.md#littles-law-concurrency-latency-and-pool-sizing"

- id: reliability-fundamentals-and-availability-math-063
  difficulty: expert
  tags: [metastable, feedback-loop, recovery, scenario, judgment]
  question: |
    You rolled back the bad deploy and the traffic spike has passed, but the site is
    still down with near-zero goodput. What is happening and how do you recover?
  options:
  - "The rollback silently failed to apply to the fleet; redeploy the same change and confirm every host is running the reverted build to restore goodput"
  - "The servers are simply short on CPU headroom; add capacity to the fleet and traffic will drain the backlog and recover on its own within minutes"
  - "A metastable failure — a sustaining feedback loop (retry storms / cache-miss amplification) keeps the system saturated even after the trigger is gone; recover by shedding load below the sustaining threshold, disabling/throttling retries, draining queues, and warming caches"
  - "It's an underlying hardware failure entirely unrelated to load, so replacing the affected instances is the only path back to healthy goodput"
  answer: 2
  explanation: |
    Metastable failures persist after the trigger because work amplification (retries,
    cache-miss storms, connection churn) sustains the overload. Removing the trigger or
    adding capacity often isn't enough due to hysteresis — you must break the loop: shed
    below the sustaining threshold, cut retries, drain backlogs, warm caches.
  ref: "concepts.md#metastable-failures"

- id: reliability-fundamentals-and-availability-math-064
  difficulty: expert
  tags: [metastable, hysteresis, goodput, judgment]
  question: |
    Why does simply restoring the pre-incident capacity or traffic level often fail to
    pull a system out of a metastable collapsed state?
  options:
  - "Because capacity can never in practice be restored to the exact prior level, and even a tiny shortfall against the original setting leaves the system permanently collapsed"
  - "Because of hysteresis: work amplification raises the effective load, so the sustaining threshold is lower than the triggering threshold — you must drop below the sustaining threshold, not just back to the level that used to be fine"
  - "Because collapsed goodput always recovers on its own after roughly 24 hours once queued work naturally expires, regardless of any operator intervention"
  - "Because metastable collapse is actually rooted in latent hardware faults rather than load, so restoring the load level was never going to address the real cause"
  answer: 1
  explanation: |
    A metastable system has two stable states. In the collapsed state, amplification
    (e.g., retries) inflates the effective load, so the capacity/traffic level that was
    fine before is no longer enough to escape. You must shed below the (lower)
    sustaining threshold — a hysteresis effect — to return to the healthy state.
  ref: "concepts.md#metastable-failures"

- id: reliability-fundamentals-and-availability-math-065
  difficulty: expert
  tags: [tail-latency, fan-out, amplification, numbers]
  question: |
    A request fans out to 100 leaf servers and must wait for all of them. If each leaf
    independently exceeds 1 second 1% of the time, roughly what fraction of fan-out
    requests will see at least one response over 1 second?
  options:
  - "About 1%, the same as a single leaf, because waiting on all 100 in parallel doesn't change any one leaf's own slow-response rate"
  - "About 10%, taking the square root of the fan-out (sqrt(100) = 10) times the 1% per-leaf slow rate as the aggregate probability"
  - "About 63% (1 - 0.99^100)"
  - "Exactly 100%, since across 100 independent leaves at a 1% slow rate at least one is guaranteed to breach the 1-second bound every time"
  answer: 2
  explanation: |
    P(at least one slow) = 1 - P(none slow) = 1 - 0.99^100 ≈ 0.634. This tail-latency
    amplification (Dean and Barroso) is why a fan-out is as slow as its slowest leaf,
    why p99 matters more than the mean, and why leaf availability != aggregator
    availability.
  ref: "concepts.md#tail-tolerant-vs-fail-fast"

- id: reliability-fundamentals-and-availability-math-066
  difficulty: advanced
  tags: [tail-tolerant, hedged-requests, deadline-propagation, judgment]
  question: |
    Which pairing correctly separates tail-tolerant techniques from fail-fast
    techniques for controlling latency in a fan-out system?
  options:
  - "Tail-tolerant: unbounded retries and ever-longer timeouts to keep waiting out slow leaves; fail-fast: provisioning bigger thread pools so no request is ever queued"
  - "Tail-tolerant: disabling all timeouts so slow replicas always eventually answer; fail-fast: caching every response so most requests never touch a leaf at all"
  - "They are two names for the very same set of techniques, distinguished only by which team happens to be describing them"
  - "Tail-tolerant: hedged/tied requests that mask a slow replica; fail-fast: aggressive timeouts and deadline propagation that bound how long any hop waits"
  answer: 3
  explanation: |
    Tail-tolerance masks the tail (hedged requests to a second replica, tied requests
    that cancel their twin). Fail-fast bounds the tail (aggressive timeouts, deadline
    propagation so downstreams don't work on already-abandoned requests). They combine;
    doing neither lets one slow dependency stall a fleet.
  ref: "concepts.md#tail-tolerant-vs-fail-fast"

- id: reliability-fundamentals-and-availability-math-067
  difficulty: advanced
  tags: [deadline-propagation, fail-fast, fan-out, judgment]
  question: |
    What problem does deadline (timeout budget) propagation specifically solve in a
    multi-hop request chain?
  options:
  - "It guarantees that every hop in the chain completes within the same fixed, identical time slice so latencies stay perfectly uniform end to end"
  - "It raises the total allotted timeout at each successive hop so that a request effectively never times out anywhere along the chain"
  - "It replaces the need for retries entirely, because a propagated deadline is enough to make every downstream call succeed on its first attempt"
  - "It passes the remaining time budget down the call chain so a downstream doesn't keep working on a request the caller has already timed out and abandoned — preventing wasted work that fuels overload"
  answer: 3
  explanation: |
    Without deadline propagation, an upstream may abandon a request while downstreams
    keep spending CPU/connections on it — wasted work that amplifies load during
    trouble. Propagating the remaining budget lets each hop stop early when there's no
    time left, a core fail-fast discipline (Release It!, The Tail at Scale).
  ref: "concepts.md#tail-tolerant-vs-fail-fast"

- id: reliability-fundamentals-and-availability-math-068
  difficulty: expert
  tags: [measurement, server-side, client-side, nine-fallacy, scenario]
  question: |
    Your server-side dashboard shows 99.99% availability, yet customers are reporting
    errors. What is the most likely reconciliation?
  options:
  - "The customers are simply mistaken; the server-side success rate measured at your edge is the authoritative ground truth for what users actually experienced"
  - "The dashboard must be averaging over too short a rolling window, and widening it to a full calendar year would surface the errors the customers are hitting"
  - "S3's eleven-nines object durability is masking the outage on the dashboard, so the stored-data guarantee is hiding a real availability dip from view"
  - "Server-side measurement (success/valid requests at your edge) misses DNS, TLS, CDN, and client-network failures plus requests that never arrived, and empty minutes count as 100% while the mean hides the p99 tail — client-side/synthetic/RUM would show the real, lower number"
  answer: 3
  explanation: |
    Where you measure changes the number. Server-side counts only requests that reached
    you and succeeded; it can't see DNS/TLS/CDN/client-network breakage or requests that
    never landed, and a no-traffic minute reads as 100%. Add client-side/synthetic/RUM
    measurement to capture user-perceived availability.
  ref: "concepts.md#measuring-availability-server-side-vs-client-side-and-the-nine-fallacy"

- id: reliability-fundamentals-and-availability-math-069
  difficulty: advanced
  tags: [nine-fallacy, measurement, maintenance, judgment]
  question: |
    Which of these is an example of the "nine fallacy" — reporting availability in a way
    that overstates real user experience?
  options:
  - "Measuring request-success rate weighted by traffic, so that outages during peak hours count more heavily than quiet ones"
  - "Reporting p99 latency alongside the mean so the slow-tail experience is visible rather than hidden behind the average"
  - "Excluding scheduled-maintenance windows from Total Time and counting no-traffic minutes as 100% — both inflate the number even though users experience the impact"
  - "Using a short rolling window instead of a full calendar year, since the shorter window refuses to let good months dilute a bad day"
  answer: 2
  explanation: |
    Excluding maintenance windows (AWS advises against this — users don't experience
    them as "up") and counting empty minutes as 100% both inflate availability. So does
    averaging over long windows and reporting only the mean. A short rolling window and
    traffic-weighted success rate are the honest choices, not fallacies.
  ref: "concepts.md#measuring-availability-server-side-vs-client-side-and-the-nine-fallacy"

- id: reliability-fundamentals-and-availability-math-070
  difficulty: expert
  tags: [marginal-utility, background-error-rate, cost, judgment]
  question: |
    A team wants to move a service from 99.99% to 99.999%. Applying Google SRE
    reasoning, what is the strongest argument that this is usually not worth it?
  options:
  - "Five-nines is prohibited for commercial services by SLA regulations, so no business is permitted to advertise or target that level of availability"
  - "It would require rewriting the entire service in a faster compiled language, and that porting effort alone makes the jump not worth attempting"
  - "Users on devices/networks with a ~0.01%-1% background error rate can't perceive the difference, the marginal availability gain is tiny (+~0.009%), and each nine can cost ~100x the previous — so the extra reliability is sub-noise, wasted spend for most businesses"
  - "Pushing availability above 99.99% inherently causes data loss, because the tighter uptime target forces the storage layer to skip durability safeguards"
  answer: 2
  explanation: |
    100% is the wrong target because the Internet/ISP background error rate (0.01-1%)
    means users can't distinguish four from five nines; the marginal availability is
    below the noise floor, while each nine costs roughly 100x more. Reliability is a
    cost/utility optimization, not a maximization.
  ref: "concepts.md#100-is-the-wrong-target-the-marginal-utility-of-a-nine"

- id: reliability-fundamentals-and-availability-math-071
  difficulty: advanced
  tags: [slo, over-achievement, error-budget, judgment]
  question: |
    Why does Google SRE treat an SLO as a maximum as well as a minimum, sometimes
    deliberately taking planned outages (e.g., Chubby)?
  options:
  - "To burn down the leftover compute budget before the end of the quarter so the reserved capacity doesn't quietly expire unused"
  - "Because service contracts legally mandate a periodic outage to prove the failover path still works on a fixed schedule"
  - "Because lower availability is always strictly cheaper to operate, and minimizing operating cost is the single overriding goal of the SLO"
  - "Because consistently over-achieving trains dependents to rely on reliability you never promised, hiding your true SLO and creating hidden hard dependencies; deliberately spending error budget keeps consumers honest about the contract"
  answer: 3
  explanation: |
    If a service always beats its SLO, consumers start depending on the actual
    (higher) reliability, so a later dip to the promised level breaks them. Deliberately
    spending error budget (planned outages) enforces the contract and prevents brittle
    hidden dependencies. An SLO is a target band, not just a floor.
  ref: "concepts.md#100-is-the-wrong-target-the-marginal-utility-of-a-nine"

- id: reliability-fundamentals-and-availability-math-072
  difficulty: expert
  tags: [critical-dependency, rule-of-thumb, slo, numbers]
  question: |
    Your service promises 99.99% and has several critical (hard) dependencies in
    series. What target should each critical dependency aim for, per the SRE Workbook
    rule of thumb?
  options:
  - "Exactly the same 99.99% as the service, on the assumption that a dependency matching your own target automatically leaves room for your faults too"
  - "One nine worse (99.9%), on the reasoning that hard dependencies are allowed to be less reliable than the service that consumes them"
  - "Roughly one nine better (~99.999%) each, because their errors consume your budget and there are several of them — or demote them to soft"
  - "It doesn't matter what the dependency targets, as long as you wrap every call to it in enough retries to paper over its errors"
  answer: 2
  explanation: |
    Critical dependencies should target about one nine better than your SLO. If they
    were merely equal, their combined errors (target^(1/n) budgeting) would leave
    nothing for your own faults. The alternatives: make them soft (cache/fallback) so
    they drop out of the multiplication. Retries don't help a genuinely-down dependency.
  ref: "concepts.md#100-is-the-wrong-target-the-marginal-utility-of-a-nine"

- id: reliability-fundamentals-and-availability-math-073
  difficulty: expert
  tags: [static-stability, control-plane, degradation, scenario, judgment]
  question: |
    "How does your service stay up when its configuration/discovery control plane is
    unavailable?" Which design embodies static stability?
  options:
  - "Block and reject every incoming request until the control plane returns and re-confirms the current config, so the service never acts on any stale data"
  - "Fail over to a single shared secondary control plane that the entire fleet also depends on, so config and discovery keep resolving during the outage"
  - "Retry the control plane aggressively with tight backoff until it responds, requiring a fresh live config fetch before the service will serve traffic"
  - "Continue serving from last-known-good/cached config and already-provisioned capacity, adding no new hard dependency on the control plane in the failure path"
  answer: 3
  explanation: |
    Static stability means operating on pre-existing (cached/provisioned) state during a
    dependency/control-plane failure, so the steady-state and recovery paths don't
    require the very thing that's down. Blocking on it, sharing one control plane, or
    hammering it with retries all keep it as a hard dependency in the failure path.
  ref: "concepts.md#static-stability"

- id: reliability-fundamentals-and-availability-math-074
  difficulty: advanced
  tags: [static-stability, circular-dependency, anti-pattern, judgment]
  question: |
    What is the anti-pattern that static stability is specifically designed to avoid?
  options:
  - "Spreading a service across more than one availability zone, because the extra cross-AZ coordination is what makes a control-plane outage escalate into a total failure"
  - "A recovery/scaling path that itself depends on the control plane being healthy exactly when it is failing — a circular/meta dependency that turns a partial failure into a total outage"
  - "Caching configuration data locally on each host, since serving from a stale local copy is the specific behavior that static stability is meant to eliminate"
  - "Provisioning spare capacity ahead of demand, on the view that pre-warmed idle headroom is wasteful and is the anti-pattern static stability guards against"
  answer: 1
  explanation: |
    The danger is a "recovery" that needs the failing dependency to work — e.g., needing
    the control plane to launch replacement capacity precisely during a control-plane
    outage. Static stability breaks that circular dependency by relying on pre-provisioned
    capacity and last-known-good state.
  ref: "concepts.md#static-stability"

- id: reliability-fundamentals-and-availability-math-075
  difficulty: intermediate
  tags: [aws, design-goal, tiers, judgment]
  question: |
    Per AWS's availability design-goal tiers, which application category is typically
    matched to a 99.999% (five-nines) target?
  options:
  - "Batch/ETL and background data-processing jobs that tolerate hours of delay"
  - "Internal collaboration tools such as wikis and team chat used by staff"
  - "ATM/banking transaction processing and telecom/emergency systems"
  - "Online commerce and point-of-sale checkout flows handling live purchases"
  answer: 2
  explanation: |
    AWS maps 99% to batch/ETL, 99.9% to internal tools, 99.95% to online commerce/POS,
    99.99% to video/broadcast and high-traffic apps, and 99.999% to ATM/banking and
    telecom/emergency systems. Match the tier to business impact, not aspiration.
  ref: "concepts.md#aws-availability-design-goal-tiers"

- id: reliability-fundamentals-and-availability-math-076
  difficulty: expert
  tags: [afr, mtbf, exponential, subtle-distinction]
  question: |
    Why is the approximation AFR ≈ 8760/MTBF acceptable for a disk with MTBF = 1.2M
    hours but a poor approximation for a component with MTBF = 4000 hours?
  options:
  - "AFR is only defined for spinning storage devices, so it simply does not apply to a 4000-hour component and the formula returns no meaningful value there"
  - "The exact form is AFR = 1 - e^(-8760/MTBF); when 8760/MTBF is tiny the linear term dominates, but at MTBF=4000 the exponent (~2.19) is large, so 8760/MTBF ≈ 219% is nonsense while the exact form gives ~89%"
  - "Any component with an MTBF below 10,000 hours has an annualized failure rate that rounds to exactly zero, so the linear approximation cannot be applied to it"
  - "The linear approximation only over-counts failures for components rated above one million hours, and stays exact for every MTBF below that threshold"
  answer: 1
  explanation: |
    AFR = 1 - e^(-8760/MTBF). For huge MTBF, 8760/MTBF << 1 and e^-x ≈ 1-x makes the
    linear approximation excellent. For MTBF=4000, 8760/MTBF ≈ 2.19, so the linear form
    gives an impossible 219% while the exact form yields 1 - e^-2.19 ≈ 0.89 (89%). Use
    the exact exponential when the ratio isn't small.
  ref: "concepts.md#annualized-failure-rate-and-how-durability-is-composed"
