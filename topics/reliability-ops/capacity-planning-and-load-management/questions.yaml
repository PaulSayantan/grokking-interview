topic: "Capacity Planning & Load Management"
domain: reliability-ops
topic_slug: capacity-planning-and-load-management
version: 1
questions:
  - id: capacity-planning-and-load-management-001
    difficulty: beginner
    tags: [capacity-planning, fundamentals]
    question: |
      What is the central goal of capacity planning?
    options: ["Ensure the system has enough resources to meet forecast demand at its target reliability, without wasteful overprovisioning", "Minimize the raw server count on the invoice at all times, treating any idle capacity as pure waste to be aggressively eliminated", "Drive every host to a sustained 100% CPU utilization so that no purchased compute cycle is ever left idle or wasted", "Provision one fixed fleet size so precisely that autoscaling, headroom, and load testing all become unnecessary"]
    answer: 0
    explanation: |
      Capacity planning ensures there are enough resources to meet demand at the target
      reliability — no less (outages) and no more than necessary (wasted cost). It is a
      risk/cost balance, not a pure minimization or maximization of any single number.
    ref: "concepts.md#provisioned-vs-usable-capacity"

  - id: capacity-planning-and-load-management-002
    difficulty: beginner
    tags: [utilization, latency]
    question: |
      Why is running a latency-sensitive service at 100% utilization dangerous even if no
      hardware fails?
    options: ["Electricity draw and power-supply costs spike sharply once the CPU is pinned at full load, making it uneconomical to sustain", "The CPU physically cannot exceed 100%, so any request arriving at that instant is immediately dropped by the OS scheduler", "As utilization approaches 100%, queueing delay and latency rise toward infinity, and there is no slack to absorb variance", "The kernel hard-caps the number of open TCP connections at 100% utilization, refusing every new socket beyond that point"]
    answer: 2
    explanation: |
      By queueing theory (M/M/1: W = S/(1-rho)), as utilization rho approaches 1.0 the
      response time diverges. At 100% there is no headroom for variance, deploys, or spikes, so
      latency and queue depth blow up. That's why you deliberately run below saturation.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-003
    difficulty: beginner
    tags: [provisioned-capacity, usable-capacity]
    question: |
      A team says "we have 20 servers that each benchmark at 1,000 rps, so we can serve
      20,000 rps." Why is this reasoning usually wrong?
    options: ["Synthetic benchmarks always overstate raw CPU clock speed by roughly 30-40%, so the real per-server rps is proportionally lower than advertised", "Twenty servers can physically never exceed 10,000 rps in aggregate because throughput is hard-capped at 500 rps per host regardless of the benchmark", "Requests per second is not a valid capacity unit at all; capacity can only ever be expressed in provisioned CPU cores or gigabytes of memory", "The benchmark peak is measured at unrealistic utilization/latency, and it ignores headroom reserved for failures, spikes, and deploys — usable capacity is much lower"]
    answer: 3
    explanation: |
      Provisioned capacity is not usable capacity. The benchmark number is peak throughput,
      often at 100% util with poor latency; usable rps at SLO is lower, and you must still
      reserve capacity to survive losing a node/AZ and to handle spikes and rolling deploys.
    ref: "concepts.md#provisioned-vs-usable-capacity"

  - id: capacity-planning-and-load-management-004
    difficulty: intermediate
    tags: [littles-law, concurrency]
    question: |
      A service receives 2,000 requests/sec and each request spends 50 ms in the system.
      By Little's Law, roughly how many requests are in flight concurrently?
    options: ["40", "100", "1,000", "10"]
    answer: 1
    explanation: |
      Little's Law: L = lambda * W = 2000 * 0.05 s = 100 requests in the system on average.
      So you need on the order of 100 concurrent workers/threads (plus headroom) to keep up.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-005
    difficulty: intermediate
    tags: [littles-law, thread-pool]
    question: |
      A thread pool has 200 threads and each request holds a thread for 100 ms. What is the
      approximate maximum throughput before requests start queueing?
    options: ["200 rps", "20,000 rps", "2,000 rps", "500 rps"]
    answer: 2
    explanation: |
      Rearranging Little's Law, lambda_max = L / W = 200 / 0.1 s = 2,000 rps. Beyond that,
      arrivals exceed what 200 concurrent threads can serve, so requests queue and latency (W)
      rises to rebalance the equation.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-006
    difficulty: advanced
    tags: [utilization-wall, mm1, latency]
    question: |
      Using the M/M/1 approximation W = S/(1-rho), how much does average response time inflate
      (relative to raw service time S) at 90% utilization versus 50% utilization?
    options: ["2x at 50%, 10x at 90%", "Same at both (1x)", "1.5x at 50%, 3x at 90%", "10x at 50%, 100x at 90%"]
    answer: 0
    explanation: |
      1/(1-0.5) = 2x at 50% utilization, and 1/(1-0.9) = 10x at 90%. The 1/(1-rho) term is the
      hockey stick: latency is roughly flat until ~70-80% then goes vertical. Being "only at
      90%" already means 10x the service time in queueing delay.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-007
    difficulty: intermediate
    tags: [headroom, redundancy]
    question: |
      In N+1 redundancy terminology (N = capacity needed to serve peak at SLO), what does the
      "+1" provide?
    options: ["One entire additional availability zone provisioned on top of the peak-serving footprint", "One extra day of forecasted demand growth baked into the standing provisioning plan", "A full doubling of the total provisioned capacity beyond the peak requirement", "Enough spare capacity to survive the loss of any single unit while still serving peak"]
    answer: 3
    explanation: |
      N is exactly enough to serve peak; N+1 adds one spare unit so the loss of any single unit
      still leaves enough to serve peak demand within SLO. N+2 tolerates two simultaneous losses
      (or one failure during maintenance).
    ref: "concepts.md#headroom-n1--n2-and-why-not-to-run-at-100"

  - id: capacity-planning-and-load-management-008
    difficulty: advanced
    tags: [headroom, multi-az]
    question: |
      A service runs across 3 AZs and must survive losing any one AZ at peak. What is the
      maximum steady-state utilization each AZ should run at?
    options: ["~50%", "~67% (2/3)", "~90%", "~33% (1/3)"]
    answer: 1
    explanation: |
      If one of three AZs fails, the remaining two must carry 100% of peak. Two AZs at 100%
      equals three AZs at ~2/3 each, so each AZ should stay at about 67% max in normal operation.
      With only 2 AZs you'd need each at <=50%.
    ref: "concepts.md#headroom-n1--n2-and-why-not-to-run-at-100"

  - id: capacity-planning-and-load-management-009
    difficulty: intermediate
    tags: [forecasting, growth]
    question: |
      A service's demand grows organically at 5% per month (compounding). Roughly how much
      larger is peak demand after 12 months?
    options: ["~60% larger (about 1.8x)", "~1.6% larger", "~5% larger", "Exactly 2x"]
    answer: 0
    explanation: |
      Compounding: 1.05^12 is about 1.80, so demand is roughly 1.8x — about 80% larger — after a
      year. Small monthly rates compound into large annual multipliers, which is why organic
      growth alone forces regular capacity reviews.
    ref: "concepts.md#forecasting-demand-organic-growth-events--seasonality"

  - id: capacity-planning-and-load-management-010
    difficulty: intermediate
    tags: [forecasting, inorganic]
    question: |
      Marketing says a product launch will bring 5 million signups on day one — with no
      historical traffic to extrapolate from. Which forecasting approach fits?
    options: ["Organic / bottom-up extrapolation of the existing historical traffic trend line", "Ignore the estimate entirely and trust reactive autoscaling to absorb the launch surge", "Inorganic / top-down, business-driven forecasting", "Soak (endurance) testing the current fleet against a long, steady synthetic load"]
    answer: 2
    explanation: |
      Launches and one-off events have no historical signal to extrapolate, so you use inorganic
      (top-down, business-driven) forecasting: take the business estimate and provision/load-test
      to it. Organic extrapolation only works for steady growth and recurring seasonality.
    ref: "concepts.md#forecasting-demand-organic-growth-events--seasonality"

  - id: capacity-planning-and-load-management-011
    difficulty: intermediate
    tags: [forecasting, peak]
    question: |
      When provisioning capacity for a consumer retail service, which demand figure should you
      size against?
    options: ["The peak-of-peaks — e.g. the busiest minute of the busiest day (Black Friday)", "The monthly average request rate rolled up across every day of the billing period", "The median request rate across all days, discarding the top and bottom outliers", "The 50th-percentile of daily traffic, since half of all days fall below that mark"]
    answer: 0
    explanation: |
      You must survive the worst moment, so you size against the peak-of-peaks (the busiest
      minute of the busiest day), not an average. Sizing to averages guarantees you fall over
      during predictable seasonal peaks.
    ref: "concepts.md#forecasting-demand-organic-growth-events--seasonality"

  - id: capacity-planning-and-load-management-012
    difficulty: beginner
    tags: [load-testing, types]
    question: |
      What distinguishes a stress test from a load test?
    options: ["A stress test replays purely synthetic fabricated data while a load test must replay only captured real production traffic", "They are two interchangeable names for exactly the same benchmarking procedure with no meaningful difference", "A load test drives expected/target load to check SLO; a stress test pushes past the peak until the system breaks to find the breaking point and failure mode", "A stress test runs only for a few seconds whereas a load test is always required to run for many continuous hours"]
    answer: 2
    explanation: |
      A load test verifies you meet SLO at your expected peak. A stress test deliberately pushes
      beyond that until the system breaks, revealing both where the breaking point is and how the
      system fails (graceful vs collapse).
    ref: "concepts.md#load-testing-load-vs-stress-vs-soak-vs-spike"

  - id: capacity-planning-and-load-management-013
    difficulty: intermediate
    tags: [load-testing, soak]
    question: |
      Which failure mode is a soak (endurance) test specifically designed to catch that a short
      load test will miss?
    options: ["Insufficient peak throughput that shows up the instant the offered request rate reaches the target load", "A missing database index that makes one specific query slow on the very first request that runs it", "Incorrect load-balancer configuration that misroutes traffic away from healthy backends immediately", "Slow resource leaks — memory/fd leaks, disk fill, cache bloat, log growth — that only manifest after hours"]
    answer: 3
    explanation: |
      Soak/endurance tests sustain moderate load for hours/days to expose gradual degradation:
      memory leaks, file-descriptor leaks, disk filling, cache/heap bloat, log growth. A memory
      leak that OOMs after 6 hours is invisible in a 10-minute test.
    ref: "concepts.md#load-testing-load-vs-stress-vs-soak-vs-spike"

  - id: capacity-planning-and-load-management-014
    difficulty: intermediate
    tags: [load-testing, spike]
    question: |
      Which test type best evaluates whether your autoscaling can react to a sudden flash crowd?
    options: ["Soak test", "Spike test", "Volume test", "Load test at steady expected peak"]
    answer: 1
    explanation: |
      A spike test applies a sudden, sharp jump in load then drops it, directly testing whether
      the system survives a flash crowd and whether autoscaling (which has provisioning lag) can
      react in time.
    ref: "concepts.md#load-testing-load-vs-stress-vs-soak-vs-spike"

  - id: capacity-planning-and-load-management-015
    difficulty: advanced
    tags: [load-testing, realism]
    question: |
      A load test reports 3x the throughput the service actually sustains in production. The
      test replayed requests that were nearly all cache hits. What is the most likely cause of
      the discrepancy?
    options: ["The load generator itself was too slow and CPU-starved to issue requests fast enough to reach the true peak rate", "Production runs on measurably slower CPUs, so the same code path takes roughly three times as long per request there", "Unrealistic traffic mix — the all-cache-hit workload avoided the real bottleneck (DB/backend), overstating capacity", "The test simply ran for too long a duration, and sustained runs always report inflated throughput numbers"]
    answer: 2
    explanation: |
      Cache hit rate, payload sizes, and key distribution dominate real behavior. Testing
      all-cache-hit traffic bypasses the database/backend that is the true bottleneck under a
      realistic mix, so the test wildly overstates usable capacity.
    ref: "concepts.md#load-testing-load-vs-stress-vs-soak-vs-spike"

  - id: capacity-planning-and-load-management-016
    difficulty: advanced
    tags: [coordinated-omission, load-testing]
    question: |
      What is coordinated omission in load testing?
    options: ["A closed-loop generator stops sending during a server stall, so the requests that would have suffered the long queue wait are never issued — hiding the true tail latency", "The test harness intentionally discards the initial warmup requests from the recorded latency histogram before reporting", "The load balancer deliberately omits periodic health-check probes while the generator is actively driving traffic", "Two independent load generators accidentally send byte-for-byte duplicate requests, double-counting the offered rate"]
    answer: 0
    explanation: |
      Closed-loop generators send, wait for the response, then send the next. During a stall they
      pause sending, omitting exactly the samples that would have experienced the worst queueing.
      The result understates p99/p999 dramatically — the coordinated omission trap (Gil Tene).
    ref: "concepts.md#coordinated-omission-the-load-test-measurement-trap"

  - id: capacity-planning-and-load-management-017
    difficulty: advanced
    tags: [coordinated-omission, tail-latency]
    question: |
      A system that should serve 10,000 rps freezes for 1 full second. A naive closed-loop load
      tool records this as roughly one 1-second sample and many fast samples afterward. What is
      the real production impact it fails to capture?
    options: ["Nothing is missed — recording a single one-second sample accurately captures the freeze's full impact on latency", "The server would have instantly rejected every request that arrived during the freeze, so none of them actually waited", "Throughput would have roughly doubled immediately after the freeze as the server burned through the backlog", "About 10,000 requests arrive during the freeze and each waits up to ~1 s, so the true tail (p99) is near 1 s, not a few ms"]
    answer: 3
    explanation: |
      In production the arrival process is independent of responses, so ~10,000 requests queue up
      during the 1 s freeze, each waiting up to ~1 s. The closed-loop tool only records one slow
      sample, so it reports a tiny p99 while the real p99 is ~1 s. That's coordinated omission.
    ref: "concepts.md#coordinated-omission-the-load-test-measurement-trap"

  - id: capacity-planning-and-load-management-018
    difficulty: advanced
    tags: [coordinated-omission, tooling]
    question: |
      Which approach correctly avoids coordinated omission?
    options: ["Use the same closed-loop tool but simply run it for a much longer total duration to average out the stalls", "Model an open workload / constant arrival rate that sends on schedule regardless of prior responses (e.g. wrk2), or back-correct using HdrHistogram", "Report only the p50 median latency, since middle percentiles are unaffected by the coordinated-omission distortion", "Disable HTTP keep-alive so every request opens a fresh connection and cannot be silently held back"]
    answer: 1
    explanation: |
      The fix is to decouple sending from responses: use an open-workload tool that sends at a
      fixed schedule (wrk2, k6/Gatling correction modes) or synthesize the omitted samples via
      HdrHistogram correction, measuring latency as now minus intended-send-time to capture queue
      wait.
    ref: "concepts.md#coordinated-omission-the-load-test-measurement-trap"

  - id: capacity-planning-and-load-management-019
    difficulty: intermediate
    tags: [knee, saturation]
    question: |
      In a step/ramp capacity test, what characterizes the "knee" (saturation point)?
    options: ["Throughput plateaus (a bottleneck is reached) and additional offered load no longer increases goodput while latency begins climbing", "Latency drops sharply to near zero as the scheduler prioritizes the newest arrivals and drains the queue instantly", "The server process crashes and restarts immediately the moment offered load crosses the saturation threshold", "CPU utilization suddenly falls below 10% as the kernel deprioritizes the saturated worker threads to protect the host"]
    answer: 0
    explanation: |
      Below the knee, throughput rises with offered load and latency is flat. At the knee a
      bottleneck (CPU, lock, pool, DB) caps throughput; more load only adds queueing/latency, not
      goodput. That is the maximum sustainable throughput.
    ref: "concepts.md#finding-the-knee-saturation-point--capacity-limits"

  - id: capacity-planning-and-load-management-020
    difficulty: advanced
    tags: [knee, collapse, capacity]
    question: |
      Why should you plan capacity at the knee rather than at the collapse point?
    options: ["The collapse point is far easier to measure precisely because throughput readings there are stable and highly repeatable across test runs", "The knee and the collapse point always coincide at the exact same offered load, so choosing between them makes no practical difference", "Provisioning to the collapse point means production runs in the unstable region where a small nudge triggers cascading failure; the knee is the max stable/usable throughput", "Industry regulators and compliance frameworks explicitly mandate provisioning to the collapse point for production systems"]
    answer: 2
    explanation: |
      Past the knee, latency goes vertical and eventually goodput falls (thrashing, retries,
      congestive collapse). Sizing to the collapse point leaves the system operating in the
      unstable region, one small spike from a cascading failure. Plan at the knee minus headroom.
    ref: "concepts.md#finding-the-knee-saturation-point--capacity-limits"

  - id: capacity-planning-and-load-management-021
    difficulty: advanced
    tags: [bottleneck, autoscaling-metric]
    question: |
      At the knee, you determine the binding constraint is a fixed 50-connection database pool,
      not CPU (which sits at 40%). What does this imply for autoscaling?
    options: ["Scaling app instances on CPU won't help — the real limit is the DB connection pool, so more app instances just contend for the same pool", "Continue to scale app instances on CPU utilization as usual, since CPU remains the most reliable proxy for the pool's real bottleneck", "Disable autoscaling entirely and run a fixed fleet, because a connection-pool limit means added instances can never improve throughput", "Raise the CPU target to 90% so each instance drives the shared connection pool harder before the autoscaler adds more capacity"]
    answer: 0
    explanation: |
      The autoscaling metric must reflect the actual bottleneck. If the DB connection pool is the
      constraint, adding app instances scaled on CPU won't add goodput — they'll just queue on
      the pool. You must address the real limit (pool size, DB capacity) or scale on a signal
      that tracks it.
    ref: "concepts.md#finding-the-knee-saturation-point--capacity-limits"

  - id: capacity-planning-and-load-management-022
    difficulty: beginner
    tags: [autoscaling, reactive]
    question: |
      What is the fundamental limitation of purely reactive (threshold-based) autoscaling?
    options: ["It fundamentally requires a trained machine-learning forecaster to function, which most teams lack the data to build correctly", "It can only ever remove capacity by scaling in, and has no mechanism at all to add instances when load rises", "It always lags — it scales after load has already arrived and crossed a threshold, so it can't get ahead of a sudden spike", "It ignores CPU and memory metrics entirely, reacting only to raw request counts regardless of how loaded each host is"]
    answer: 2
    explanation: |
      Reactive autoscaling responds to current metrics crossing a threshold, so it inherently
      reacts after the load arrives. Combined with provisioning lag, it cannot pre-empt sudden
      spikes — hence scheduled/predictive scaling and standing headroom for known/sharp peaks.
    ref: "concepts.md#autoscaling-reactive-vs-predictive-vs-scheduled"

  - id: capacity-planning-and-load-management-023
    difficulty: intermediate
    tags: [autoscaling, scheduled]
    question: |
      You have a strongly diurnal traffic pattern with a predictable 08:00 ramp every weekday.
      Which autoscaling strategy warms capacity BEFORE the demand arrives?
    options: ["Reactive threshold scaling", "No autoscaling", "Vertical scaling only", "Scheduled scaling"]
    answer: 3
    explanation: |
      Scheduled scaling adds capacity on a calendar (e.g. scale out at 07:45 before the 08:00
      ramp), so capacity is ready ahead of predictable demand. Reactive scaling would only react
      once load is already climbing, lagging behind the ramp.
    ref: "concepts.md#autoscaling-reactive-vs-predictive-vs-scheduled"

  - id: capacity-planning-and-load-management-024
    difficulty: intermediate
    tags: [autoscaling, predictive]
    question: |
      What is the main weakness of predictive (ML-forecast) autoscaling?
    options: ["It cannot scale horizontally and is restricted to vertically resizing a single instance on a fixed schedule", "It is only as good as its forecast — it mispredicts novel or unprecedented events it has no pattern for", "It requires a human operator to manually approve every individual scale-out and scale-in action before it executes", "It works only for offline batch jobs and cannot be applied to latency-sensitive online request traffic at all"]
    answer: 1
    explanation: |
      Predictive scaling anticipates recurring patterns by forecasting near-future demand, but a
      forecast can't foresee a truly novel event. That's why you combine predictive/scheduled for
      known patterns with reactive scaling as a safety net for the unexpected.
    ref: "concepts.md#autoscaling-reactive-vs-predictive-vs-scheduled"

  - id: capacity-planning-and-load-management-025
    difficulty: intermediate
    tags: [autoscaling, flapping]
    question: |
      What does a cooldown / stabilization window in autoscaling prevent, and what is the risk
      of setting it too long?
    options: ["Prevents overspending on idle capacity; setting it too long causes the scaler to undercount the servers actually needed", "Prevents in-flight data loss during scaling; setting it too long instead risks on-disk data corruption on the hosts", "Prevents flapping (rapid scale in/out oscillation); too long makes scaling sluggish to respond", "Prevents load-balancer health-check failures; setting it too long silently disables the load balancer itself"]
    answer: 2
    explanation: |
      A cooldown/stabilization window suppresses rapid oscillation (flapping) between scale-out
      and scale-in. Set it too short and the fleet thrashes; too long and it responds sluggishly
      to real demand changes. It's a responsiveness-vs-stability trade-off.
    ref: "concepts.md#autoscaling-reactive-vs-predictive-vs-scheduled"

  - id: capacity-planning-and-load-management-026
    difficulty: intermediate
    tags: [autoscaling, scale-in]
    question: |
      Why is the common guidance "scale out fast, scale in slow"?
    options: ["Removing capacity too aggressively can leave you short right before the next spike, causing an outage — while being slow to add capacity is riskier than being slow to remove it", "Scaling in is billed at a higher hourly rate than scaling out, so removing instances slowly is cheaper than removing them quickly", "Scaling in requires a full reboot of every remaining instance in the fleet, which briefly interrupts service each time it runs", "Cloud providers charge an extra premium fee for aggressive fast scale-in operations, making gradual removal the economical choice"]
    answer: 0
    explanation: |
      Under-provisioning causes outages, over-provisioning only costs money, so you add capacity
      eagerly and remove it cautiously. Aggressive scale-in risks tearing down capacity just
      before demand returns, so most policies decay slowly on the way down.
    ref: "concepts.md#autoscaling-reactive-vs-predictive-vs-scheduled"

  - id: capacity-planning-and-load-management-027
    difficulty: intermediate
    tags: [autoscaling, lag]
    question: |
      Why can't autoscaling alone protect against a spike that arrives in seconds?
    options: ["Cloud provider scaling APIs are aggressively rate-limited, so only a handful of new instances can ever be launched per second", "Autoscaling evaluation runs on a fixed once-per-hour schedule, so it simply cannot notice a spike that arrives within seconds", "Newly launched instances always boot in a broken state and must be manually repaired before they can accept any traffic", "There is a multi-minute provisioning lag (detect, decide, boot, bootstrap/warm, register) before new capacity serves traffic"]
    answer: 3
    explanation: |
      Scaling isn't instant: the pipeline of detect -> decide (cooldown) -> launch (boot) ->
      bootstrap (image pull, cache/JIT warmup) -> register (health checks + LB) typically takes
      minutes. A seconds-scale spike overwhelms you first, so you need standing headroom, warm
      pools, and load shedding to bridge the gap.
    ref: "concepts.md#autoscaling-isnt-instant-scale-up-lag--the-right-metric"

  - id: capacity-planning-and-load-management-028
    difficulty: intermediate
    tags: [autoscaling, warm-pools]
    question: |
      Which technique most directly reduces autoscaling scale-up lag?
    options: ["Increasing the cooldown window between successive scaling actions", "Warm pools / pre-provisioned already-booted instances kept ready to serve", "Scaling on a lagging downstream metric such as average request latency", "Raising the per-host target utilization setpoint to roughly 95%"]
    answer: 1
    explanation: |
      Warm pools keep instances pre-booted and bootstrapped so registration is fast, cutting the
      minutes of boot + warmup out of the critical path. This shrinks the window during which you
      rely on standing headroom and load shedding.
    ref: "concepts.md#autoscaling-isnt-instant-scale-up-lag--the-right-metric"

  - id: capacity-planning-and-load-management-029
    difficulty: advanced
    tags: [autoscaling, queue, metric]
    question: |
      A fleet of workers consumes a message queue. Traffic spikes, the backlog grows, but
      consumer CPU stays moderate so CPU-based autoscaling never triggers. What metric should
      drive scaling instead?
    options: ["Queue backlog depth / age of the oldest message", "Average consumer host CPU utilization", "The current count of running consumer instances", "Outbound network bytes per second"]
    answer: 0
    explanation: |
      For queue consumers, the leading causal signal is the backlog itself — queue depth or age
      of the oldest message. Scaling on consumer CPU misses backlog growth when work is I/O-bound
      or the bottleneck is downstream. Scale on the backlog.
    ref: "concepts.md#autoscaling-isnt-instant-scale-up-lag--the-right-metric"

  - id: capacity-planning-and-load-management-030
    difficulty: advanced
    tags: [autoscaling, amplification, anti-pattern]
    question: |
      In what way can autoscaling AMPLIFY a failure instead of mitigating it?
    options: ["It can only ever help a system recover, because adding or removing instances is a purely corrective action that never worsens an ongoing failure", "It silently compresses application logs incorrectly during scale events, corrupting the very telemetry you need to diagnose the failure", "If instances are crash-looping (e.g. OOM/bad deploy), rising per-instance load can trigger launching more instances that also crash; or a dependency outage drops traffic and it scales DOWN healthy capacity", "It always exactly doubles the infrastructure bill during any incident, because every scaling policy provisions twice the instances it removes"]
    answer: 2
    explanation: |
      Autoscaling reacts to signals it may misread. Crash-looping instances can look like "need
      more capacity," spawning more doomed instances; conversely, a dependency outage that lowers
      traffic can trigger scale-in that removes capacity you'll need on recovery. Guard with
      health checks, min/max bounds, and alarms on scaling activity.
    ref: "concepts.md#autoscaling-isnt-instant-scale-up-lag--the-right-metric"

  - id: capacity-planning-and-load-management-031
    difficulty: intermediate
    tags: [autoscaling, target-utilization]
    question: |
      Lowering the target utilization setpoint for a target-tracking autoscaler (say from 70% to
      50%) has what primary trade-off?
    options: ["More headroom and faster spike absorption, at higher cost (more idle capacity)", "It adds latency, measurably slowing down every individual request the fleet serves", "It permanently disables the scale-in half of the autoscaling policy", "It changes responsiveness but has no effect at all on the total cost"]
    answer: 0
    explanation: |
      A lower target utilization keeps more spare capacity per instance, so the fleet can absorb
      spikes before the scaler catches up — but you run more instances than strictly needed,
      raising cost. It's the classic headroom cost-vs-risk lever.
    ref: "concepts.md#autoscaling-reactive-vs-predictive-vs-scheduled"

  - id: capacity-planning-and-load-management-032
    difficulty: intermediate
    tags: [overprovisioning, cost-risk]
    question: |
      How should you frame the decision of how much to overprovision?
    options: ["Always overprovision as much as the budget will possibly allow, since spare capacity is never wasteful and outages must be ruled out", "Never overprovision under any circumstances, because idle capacity is pure waste that a well-tuned autoscaler can always eliminate", "Compare the cost of idle capacity against the expected loss = P(overload) x cost-of-an-outage; more headroom is rational when outages are very expensive", "Base the decision solely on the raw CPU core count of the fleet, ignoring outage cost and demand variability entirely"]
    answer: 2
    explanation: |
      Overprovisioning is insurance. Frame it as expected cost: idle-capacity cost vs
      P(overload) x cost-of-outage. When an outage is very expensive (revenue, trust, SLA
      penalties) lots of headroom is rational; for low-stakes systems, running lean is fine.
    ref: "concepts.md#overprovisioning-cost-vs-risk"

  - id: capacity-planning-and-load-management-033
    difficulty: advanced
    tags: [overprovisioning, cost-optimization]
    question: |
      Which tactic reduces the COST of headroom without meaningfully reducing safety?
    options: ["Removing all redundancy from the fleet so that no capacity ever sits idle waiting for a failure", "Turning off health checks so that unhealthy hosts keep counting toward available capacity", "Disabling load shedding entirely so that every arriving request is always admitted and served", "Running the buffer capacity on cheaper spot/preemptible instances or a warm pool while baseline runs on-demand"]
    answer: 3
    explanation: |
      You can hold reserve capacity on cheaper spot/preemptible instances (or a warm pool) while
      baseline load runs on stable on-demand capacity. Combined with load shedding, multi-tenant
      bin-packing, and autoscaling, this keeps the safety margin while lowering its cost.
    ref: "concepts.md#overprovisioning-cost-vs-risk"

  - id: capacity-planning-and-load-management-034
    difficulty: advanced
    tags: [multi-tenancy, aggregation]
    question: |
      Why does bin-packing multiple services with uncorrelated demand onto shared capacity reduce
      total provisioning needs?
    options: ["It completely eliminates the need for any headroom, because a shared pool can never be overloaded by its tenants", "The aggregate peak of uncorrelated workloads is less than the sum of their individual peaks, so combined headroom is smaller", "It makes each individual service respond measurably faster by giving every request access to the whole shared pool", "Highly correlated demand smooths the aggregate curve far better than uncorrelated demand does, lowering total need"]
    answer: 1
    explanation: |
      When peaks don't line up in time, the sum of individual peaks overstates the combined peak.
      Aggregating uncorrelated demand smooths the curve, so the shared pool needs less total
      capacity and headroom than provisioning each service separately.
    ref: "concepts.md#overprovisioning-cost-vs-risk"

  - id: capacity-planning-and-load-management-035
    difficulty: intermediate
    tags: [demand-shaping, shed]
    question: |
      Demand suddenly exceeds capacity faster than you can add servers. Which demand-shaping
      lever best protects goodput for interactive traffic?
    options: ["Add an unbounded in-memory queue to buffer every excess request until a server frees up", "Increase request timeouts toward infinity so that no request is ever dropped under the surge", "Load shedding — reject excess requests fast (503/429) so accepted requests stay within SLO", "Retry every failed request immediately and repeatedly until the system finally accepts it"]
    answer: 2
    explanation: |
      When you can't add capacity in time, shed excess load at the entry point so accepted
      requests stay healthy. A fast failure beats a slow one for interactive traffic, and
      shedding preserves goodput. See load-shedding-and-backpressure for the mechanics.
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-036
    difficulty: advanced
    tags: [queue, overload, anti-pattern]
    question: |
      A team adds a large in-memory queue in front of an overloaded service, expecting it to
      "handle the extra load." Under SUSTAINED overload (arrival rate > service rate), what
      actually happens?
    options: ["The queue grows without bound, latency climbs toward infinity, and the process eventually OOMs — a queue only smooths bursts, not sustained overload", "The queue permanently increases the service's real processing capacity, letting it sustain the higher arrival rate indefinitely", "The queue automatically sheds its oldest entries once full, so latency stabilizes and the service keeps up with arrivals", "Throughput roughly doubles as the queue keeps every worker continuously fed with pending work"]
    answer: 0
    explanation: |
      A queue converts overload into latency and memory growth, not into extra capacity. If
      arrivals stay above service rate, by Little's Law W -> infinity and the queue grows until
      OOM/timeout. Queues absorb bursts that fit within average capacity; sustained overload
      needs shedding or backpressure. Use bounded queues and treat full as a shed signal.
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-037
    difficulty: intermediate
    tags: [demand-shaping, prioritization]
    question: |
      When shedding load under overload, which traffic should you drop first?
    options: ["Whatever request happens to arrive first, dropping strictly in FIFO order so the oldest queued work is always sacrificed ahead of newer arrivals", "The highest-value requests such as checkout and auth, deferring them to a retry queue so cheap background work can finish first", "All request classes uniformly at random, shedding the same fixed percentage of every category so none is ever favored over another", "Low-priority / best-effort work (background refreshes, prefetch, non-critical analytics), protecting high-value requests like checkout and auth"]
    answer: 3
    explanation: |
      Criticality-aware shedding preserves the most business value per unit of capacity: drop
      best-effort/background work first and protect critical paths (checkout, auth). Shedding
      blindly or dropping high-value traffic wastes the capacity you do have.
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-038
    difficulty: intermediate
    tags: [demand-shaping, rate-limit]
    question: |
      As a reliability (not abuse-prevention) mechanism, what is the main purpose of per-tenant
      rate limiting?
    options: ["To raise the total throughput ceiling of the fleet by letting each tenant push more requests through the shared limiter than before", "To ensure fairness and stop one noisy tenant from consuming shared capacity and starving others", "To encrypt each request payload in transit so per-tenant traffic cannot be inspected or tampered with on the shared path", "To replace the load balancer entirely by spreading each tenant's requests evenly across all backend instances in the pool"]
    answer: 1
    explanation: |
      From a reliability standpoint, per-tenant/per-client rate limiting enforces fairness and
      protects shared capacity so a single noisy tenant can't starve everyone else. (Abuse
      prevention is security's angle; limiter algorithms live in system-design/design-rate-limiter.)
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-039
    difficulty: beginner
    tags: [demand-shaping, levers]
    question: |
      Which set correctly lists the three main demand-shaping levers used in load management?
    options: ["Shed, queue, rate-limit", "Cache, compress, replicate", "Retry, timeout, fallback", "Encrypt, authenticate, authorize"]
    answer: 0
    explanation: |
      Demand shaping manages the demand side when it exceeds current capacity: shed (reject
      excess), queue/buffer (defer bursts), and rate-limit/throttle (cap per-client rate). Each
      trades something (errors, latency, or client back-off) to keep the system standing.
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-040
    difficulty: advanced
    tags: [littles-law, connection-pool]
    question: |
      A downstream dependency's latency (W) doubles from 20 ms to 40 ms while request arrival
      rate stays constant at 500 rps. By Little's Law, what happens to the number of concurrent
      in-flight requests (and thus connection/thread demand)?
    options: ["It halves (from ~10 to ~5 in flight)", "It stays the same (~10 in flight)", "It doubles (from ~10 to ~20)", "It drops to zero (0 in flight)"]
    answer: 2
    explanation: |
      L = lambda * W. With lambda fixed, doubling W doubles L: from 500 * 0.02 = 10 to
      500 * 0.04 = 20 in-flight requests. This is why a slow dependency silently exhausts thread
      and connection pools — the same rate now needs twice the concurrency.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-041
    difficulty: intermediate
    tags: [utilization, batch-vs-interactive]
    question: |
      Why can a batch/throughput-oriented pipeline safely run at 80-90% utilization while a
      latency-sensitive online service should target ~50-70%?
    options: ["Batch work tolerates queueing delay, so operating deep on the utilization curve is acceptable; latency-sensitive services can't tolerate the tail-latency explosion near saturation", "Batch systems typically run on higher-clocked CPUs with larger caches, so each host clears queued work fast enough that utilization never affects latency", "Batch systems simply aren't governed by Little's Law the way online services are, so the utilization-versus-latency relationship doesn't apply to them", "Online services are engineered never to queue requests internally, so their latency stays flat no matter how high utilization climbs toward saturation"]
    answer: 0
    explanation: |
      The utilization wall punishes latency, not total work done. Batch jobs care about
      throughput and tolerate queue delay, so running hot is efficient. Interactive services must
      stay left of the knee to keep tail latency bounded, so they run cooler with more headroom.
    ref: "concepts.md#headroom-n1--n2-and-why-not-to-run-at-100"

  - id: capacity-planning-and-load-management-042
    difficulty: advanced
    tags: [headroom, deploys]
    question: |
      Beyond surviving failures and spikes, why does a service doing rolling deploys need extra
      headroom even in steady state?
    options: ["A rolling deploy spins up a full duplicate of every instance before cutover, so you must always hold twice the fleet in reserve during a release", "Deploys are scheduled only during off-peak overnight windows, so there is never any live traffic competing for capacity while instances cycle", "A rolling deploy temporarily removes serving capacity (instances cycling out), so running at 100% leaves no room to lose those instances during the rollout", "Headroom is reserved purely for hardware failures and traffic spikes and has no relationship to deployments, which consume no serving capacity"]
    answer: 2
    explanation: |
      Rolling deploys take a fraction of instances out of service while they update, transiently
      reducing capacity. If you're already at 100%, that reduction pushes the survivors over the
      cliff. Headroom absorbs the deploy-time capacity dip as well as failures and spikes.
    ref: "concepts.md#headroom-n1--n2-and-why-not-to-run-at-100"

  - id: capacity-planning-and-load-management-043
    difficulty: intermediate
    tags: [redundancy, notation]
    question: |
      What does "2N" redundancy mean compared to "N+1"?
    options: ["2N tolerates the loss of exactly one unit while N+1 tolerates two simultaneous failures, making N+1 the more resilient scheme of the two", "They are two equivalent notations for the same redundancy level, differing only in which vendor's documentation happens to use them", "2N provisions only half the capacity of N, since the '2' divides each unit's share of the total serving load in half", "2N is a full duplicate of the capacity (survives losing an entire set/site); N+1 is one spare unit beyond peak need"]
    answer: 3
    explanation: |
      N+1 adds a single spare unit (tolerates losing one unit). 2N provisions a full duplicate of
      N, so it can survive losing an entire set or site — far more expensive, used for high-tier
      DR/data-center designs (sometimes 2(N+1)).
    ref: "concepts.md#headroom-n1--n2-and-why-not-to-run-at-100"

  - id: capacity-planning-and-load-management-044
    difficulty: advanced
    tags: [forecasting, accuracy]
    question: |
      Why should a capacity team track forecast ACCURACY as an ongoing metric?
    options: ["To assign accountability after outages by identifying which team's forecast submission was responsible for the capacity shortfall", "Chronic under-forecasting means you'll be caught short (outages); chronic over-forecasting wastes money — feeding misses back improves the next cycle's model", "Once a forecast is approved it is locked for the fiscal year and never revisited, since re-forecasting would invalidate the committed budget", "Tracking forecast accuracy makes load testing redundant, because an accurate demand forecast already proves the fleet can serve that demand"]
    answer: 1
    explanation: |
      Systematic bias in either direction is costly: under-forecasting causes overload,
      over-forecasting wastes spend. Treating forecast error as a tracked metric and feeding it
      back into the model keeps provisioning aligned with real demand over time.
    ref: "concepts.md#forecasting-demand-organic-growth-events--seasonality"

  - id: capacity-planning-and-load-management-045
    difficulty: advanced
    tags: [littles-law, capacity-derivation]
    question: |
      You must serve 5,000 rps at a mean latency of 40 ms, and each server can hold 50 concurrent
      requests before queueing. Ignoring extra headroom, how many servers do you need (by Little's
      Law)?
    options: ["2", "10", "4", "100"]
    answer: 2
    explanation: |
      Total in-flight L = lambda * W = 5000 * 0.04 = 200 concurrent requests. Each server handles
      50 concurrently, so 200 / 50 = 4 servers minimum. You'd then add headroom for failures,
      spikes, and the utilization wall on top of this baseline.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-046
    difficulty: intermediate
    tags: [load-testing, environment]
    question: |
      Why do Google SRE and others prefer load testing in production (or a truly prod-like
      environment) rather than a scaled-down staging setup?
    options: ["A scaled-down environment has different bottlenecks (cache sizes, connection limits, data volumes), so its results don't predict production behavior", "Staging environments cost more per hour to operate than production because they duplicate the full stack while serving no revenue traffic", "Load testing directly in production carries essentially zero risk of customer-facing incidents, so it is always the safer option to choose", "Staging environments are technically unable to run standard load-generation tools like wrk2 or k6, which require production networking to function"]
    answer: 0
    explanation: |
      Scaled-down environments hit different bottlenecks — smaller caches, fewer connections, less
      data — so their capacity numbers don't transfer. Testing in prod (carefully, with shedding
      and abort criteria) or a faithfully prod-like environment gives results you can trust.
    ref: "concepts.md#load-testing-load-vs-stress-vs-soak-vs-spike"

  - id: capacity-planning-and-load-management-047
    difficulty: advanced
    tags: [launch, scenario, preparation]
    question: |
      A launch is expected to 3x traffic at a known time. Which preparation plan is most complete?
    options: ["Turn on reactive threshold autoscaling with an aggressive scale-out policy and trust it to add capacity the moment launch traffic crosses the target", "Only add more caching layers in front of the service, assuming a high enough hit rate makes the origin fleet's capacity effectively irrelevant", "Increase all client and server timeouts generously and add automatic retries everywhere so slow requests eventually succeed during the surge", "Take the top-down forecast, load/stress test to 3x, pre-scale via scheduled scaling + warm pools, verify downstream dependencies also scale, and keep load shedding + a runbook ready"]
    answer: 3
    explanation: |
      A launch is a predictable inorganic event, so you forecast top-down, load/stress test to the
      target, pre-provision (scheduled scaling + warm pools) so capacity is ready before the
      spike, confirm dependencies scale too, and keep shedding + a runbook as backstops. Reactive
      autoscaling alone can't beat scale-up lag for a sharp, timed spike.
    ref: "concepts.md#autoscaling-isnt-instant-scale-up-lag--the-right-metric"

  - id: capacity-planning-and-load-management-048
    difficulty: expert
    tags: [scenario, tail-latency, coordinated-omission]
    question: |
      Your load test (closed-loop, single-machine generator, 1 thread per virtual user) reports
      p99 of 8 ms at target load, but production p99 is 400 ms at the same rate. The service is
      known to GC-pause ~200 ms occasionally. What is the most likely diagnosis?
    options: ["Production runs on instances roughly 50x slower than the load generator's machine, so identical code takes far longer per request there", "Coordinated omission — the generator paused sending during GC stalls, omitting the queued requests that would have shown the ~200 ms+ tail", "The p99 SLO threshold is simply misconfigured in the test harness, so it reports an artificially low latency figure production does not honor", "Production network round-trip latency between client and service is around 400 ms, which the single-machine load generator never had to traverse"]
    answer: 1
    explanation: |
      A closed-loop generator waiting on responses stops issuing requests during a 200 ms GC
      pause, so it never records the pile-up of requests that would have queued behind it in
      production. That hides the tail — classic coordinated omission. Re-test with wrk2/open-model
      or HdrHistogram correction to see the true ~200 ms+ p99.
    ref: "concepts.md#coordinated-omission-the-load-test-measurement-trap"

  - id: capacity-planning-and-load-management-049
    difficulty: expert
    tags: [scenario, headroom, dependency]
    question: |
      A downstream dependency you call synchronously starts responding 5x slower during an
      incident, but its error rate is 0%. Your own service's thread pool saturates and it begins
      timing out. Through the capacity lens, what happened?
    options: ["By Little's Law, 5x higher W at the same arrival rate needs 5x more concurrent threads; the fixed pool couldn't absorb it, so requests queued and timed out — the slowdown consumed your concurrency headroom", "Your service's CPU saturated at 100% because the slower dependency responses forced each core to spin far longer per request, exhausting compute", "The dependency began returning corrupt or malformed payloads under stress, and the extra validation and error handling per response saturated your fleet", "DNS resolution for the dependency's endpoint started failing intermittently, so each call blocked on repeated slow lookups until the pool drained"]
    answer: 0
    explanation: |
      L = lambda * W: when W jumps 5x at constant arrival rate, in-flight requests jump 5x,
      exhausting a fixed thread/connection pool. This is how a slow (not failing) dependency
      causes a cascading failure. Mitigations: timeouts, bulkheads, circuit breakers, and shedding
      (see circuit-breakers-and-bulkheads and cascading-failures-and-antipatterns).
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-050
    difficulty: intermediate
    tags: [effective-capacity, definitions]
    question: |
      What does "effective / redundant capacity" refer to?
    options: ["The total raw provisioned capacity itemized on the cloud invoice, summed across every instance you are currently paying for each month", "The theoretical peak throughput a single CPU can achieve at 100% utilization, as measured by a synthetic microbenchmark under ideal conditions", "Usable capacity remaining AFTER subtracting what must survive the loss of a failure domain (a node or AZ)", "The maximum request throughput the front-end load balancer alone can sustain, independent of how many backend instances sit behind it"]
    answer: 2
    explanation: |
      Effective/redundant capacity is usable capacity minus the reserve needed to tolerate losing
      a failure domain. It's the number that matters when you commit to a redundancy target
      (N+1/N+2/2N), because you must still serve peak after a failure.
    ref: "concepts.md#provisioned-vs-usable-capacity"

  - id: capacity-planning-and-load-management-051
    difficulty: advanced
    tags: [utilization-wall, parallelism]
    question: |
      Does adding more parallel servers (M/M/c instead of M/M/1) eliminate the latency-vs-
      utilization cliff?
    options: ["No — parallelism softens/pushes out the knee but the response-time curve still rises steeply as aggregate utilization approaches 100%", "Yes — with a large enough M/M/c pool the queueing term vanishes entirely, so response time stays flat right up to 100% aggregate utilization", "Yes, provided every server is identical and perfectly load-balanced, the per-server utilization cliff cancels out and aggregate latency stays flat", "No — adding parallel servers actually raises latency at every utilization level because cross-server coordination overhead dominates response time"]
    answer: 0
    explanation: |
      More servers (M/M/c) smooth the knee and let you run somewhat hotter for the same latency,
      but they don't remove the fundamental 1/(1-rho)-style divergence — as aggregate utilization
      nears 100%, queueing delay still explodes. Headroom is still required.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-052
    difficulty: intermediate
    tags: [load-testing, volume]
    question: |
      What does a volume test stress, as opposed to a load or spike test?
    options: ["The sustained request rate applied over an extended period, ramping arrivals up gradually to find where throughput plateaus", "Network jitter and packet-level timing variability on the connection between the client and the service under a steady request rate", "Large data volumes — big tables, large payloads, high row counts — rather than high request rate", "The number of concurrent rolling deployments running while traffic is served, measuring how many releases the fleet tolerates at once"]
    answer: 2
    explanation: |
      A volume test exercises the system against large amounts of data (big tables, large
      payloads) rather than a high request rate. It surfaces problems like slow queries on big
      tables, pagination limits, and memory blowups on large payloads.
    ref: "concepts.md#load-testing-load-vs-stress-vs-soak-vs-spike"

  - id: capacity-planning-and-load-management-053
    difficulty: expert
    tags: [scenario, autoscaling, shedding]
    question: |
      During a genuine flash crowd (traffic 4x in ~10 seconds), which combination keeps the
      service standing given multi-minute scale-up lag?
    options: ["Rely solely on reactive threshold autoscaling to launch new instances the instant the 4x surge crosses the scale-out CPU target", "Add a large unbounded in-memory queue in front of the service and let requests wait there until instances free up to drain the backlog", "Increase client and server timeouts substantially so requests wait longer instead of failing while the fleet works through the surge", "Load shed the excess immediately to protect goodput while standing headroom and warm-pool capacity absorb load and autoscaling catches up"]
    answer: 3
    explanation: |
      Autoscaling can't provision in 10 seconds. You shed the excess right away (protecting the
      requests you accept), lean on standing headroom + warm pools to absorb the immediate surge,
      and let autoscaling add durable capacity over the next minutes. Queues/longer timeouts just
      defer collapse.
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-054
    difficulty: advanced
    tags: [scale-in, dependency-outage, anti-pattern]
    question: |
      A dependency outage causes your service's incoming traffic to drop sharply (clients give
      up). Your CPU-based autoscaler responds by scaling in. Why is this dangerous?
    options: ["Scaling in during the outage saves only a trivial amount of money, making the effort of removing and re-adding instances not worthwhile", "When the dependency recovers, retried/backed-up traffic surges back, but you've torn down the capacity needed to serve it — causing a second outage on recovery", "Scaling in mid-outage terminates instances holding in-memory session state, corrupting or losing the data those hosts had not yet persisted", "It carries no real downside, since the autoscaler will simply add the instances back the moment the dependency recovers and traffic returns"]
    answer: 1
    explanation: |
      Low traffic during an upstream outage isn't low demand — it's suppressed demand. Scaling in
      on it removes capacity, and when the dependency recovers the pent-up + retry surge hits a
      shrunken fleet, triggering a recovery-time outage. Guard scale-in with min bounds and
      awareness of dependency health.
    ref: "concepts.md#autoscaling-isnt-instant-scale-up-lag--the-right-metric"

  - id: capacity-planning-and-load-management-055
    difficulty: intermediate
    tags: [littles-law, definitions]
    question: |
      In Little's Law L = lambda x W, what does each term represent?
    options: ["L = per-request latency, lambda = the number of load balancers in front of the fleet, W = the width of the thread pool", "L = the log-emission rate, lambda = the count of deployed lambda functions, W = the number of worker processes running", "L = average number of requests in the system, lambda = average arrival rate, W = average time a request spends in the system", "L = the remaining latency budget, lambda = the SLO target percentage, W = the length of the measurement window in seconds"]
    answer: 2
    explanation: |
      L is the average number in the system (in service + waiting), lambda is the arrival rate,
      and W is the average time spent in the system (including queue wait). It holds for any
      stable system regardless of arrival distribution — the workhorse of capacity math.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-056
    difficulty: advanced
    tags: [growth, compounding]
    question: |
      Demand grows 10% per month, compounding. Approximately what multiple is peak demand after
      a year?
    options: ["About 3.1x", "About 1.1x", "About 1.2x", "About 12x"]
    answer: 0
    explanation: |
      1.10^12 is approximately 3.14, so demand roughly triples in a year at 10%/month. This is why
      seemingly modest monthly growth rates force frequent capacity reviews and can outrun manual
      provisioning cycles.
    ref: "concepts.md#forecasting-demand-organic-growth-events--seasonality"

  - id: capacity-planning-and-load-management-057
    difficulty: intermediate
    tags: [bounded-queue, backpressure]
    question: |
      What is the correct way to use a queue in front of a capacity-constrained service?
    options: ["Make it unbounded so that no request is ever rejected, letting the buffer grow freely to absorb any amount of sustained overload", "Set its depth to exactly one item so at most a single request can ever wait, forcing every other arrival to be served immediately", "Disable the queue entirely during peak periods so requests flow straight through to the backend without any buffering at all", "Bound it, and treat a full queue as a shed signal (reject/apply backpressure) so it smooths bursts without becoming an OOM countdown"]
    answer: 3
    explanation: |
      Bounded queues absorb short bursts that fit within average capacity; when the queue fills,
      that's the signal to shed or apply backpressure. Unbounded queues just convert sustained
      overload into unbounded latency and eventual OOM. See load-shedding-and-backpressure.
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-058
    difficulty: expert
    tags: [scenario, utilization-target, judgment]
    question: |
      An interviewer asks "what utilization target should we run at?" What is the best answer?
    options: ["Always 80%, because that is the industry-standard sweet spot every service should target regardless of its latency profile or how fast it can scale", "It depends — weigh cost of an outage vs cost of idle capacity, demand spikiness, autoscaling speed, and shedding ability; latency-sensitive revenue services with slow scaling want more headroom, batch pipelines can run hotter", "Always 50%, since keeping every service at exactly half of capacity guarantees enough headroom for any conceivable spike or failure", "Whatever the cloud vendor sets as the default target-tracking value, since those defaults are tuned to be optimal for every workload"]
    answer: 1
    explanation: |
      There's no universal number. The signal an interviewer wants is the reasoning: balance
      outage cost vs idle cost, factor in spikiness, autoscaling latency, and whether you can shed
      load. A slow-to-scale, latency-sensitive revenue service wants generous headroom; a batch
      pipeline tolerates high utilization.
    ref: "concepts.md#overprovisioning-cost-vs-risk"

  - id: capacity-planning-and-load-management-059
    difficulty: expert
    tags: [usl, horizontal-scaling, coherency]
    question: |
      You double a stateful cluster from 20 to 40 nodes and aggregate throughput actually
      DROPS. Using the Universal Scalability Law, what is the most likely cause?
    options: ["The coherency term (beta) dominates — per-node coordination/crosstalk grows as N(N-1), so past N_max adding nodes costs more in coordination than it adds in work (retrograde scaling)", "CPU on each node is simply too slow, so doubling the node count also halves each node's effective clock speed and total throughput falls as a result", "The contention term (alpha) is exactly zero, which under the USL forces aggregate throughput to decline whenever the fleet size is doubled", "Little's Law was applied incorrectly to the arrival rate, so the measured throughput drop is only a calculation artifact rather than a real effect"]
    answer: 0
    explanation: |
      A throughput DECLINE (not just a plateau) is the USL coherency term beta at work: keeping N
      nodes consistent costs O(N^2) crosstalk, so beyond N_max = sqrt((1-alpha)/beta) each new
      node subtracts net capacity. A mere plateau would be the contention term alpha (Amdahl). The
      fix is to bound coordination (partition/cellularize), not to add hardware.
    ref: "concepts.md#universal-scalability-law-why-adding-nodes-can-backfire"

  - id: capacity-planning-and-load-management-060
    difficulty: expert
    tags: [usl, contention, coherency]
    question: |
      In the Universal Scalability Law, what distinguishes the contention term (alpha) from the
      coherency term (beta)?
    options: ["Alpha applies only to CPU-bound contention while beta applies only to memory-bound contention, so the two terms simply partition the hardware resources", "They are two interchangeable names for the very same serialization effect, and the USL lists both only for historical notational reasons", "Alpha is serialization/queueing for a shared resource (the Amdahl term, causing a throughput plateau); beta is the cost of keeping nodes consistent (crosstalk, growing as N(N-1), causing retrograde decline)", "Alpha grows as N-squared with fleet size while beta grows only linearly, so contention is what drives the retrograde region of the curve"]
    answer: 2
    explanation: |
      Alpha (contention) is serialization on a shared resource — a lock, a single writer — and is
      exactly Amdahl's Law; it makes throughput plateau. Beta (coherency) is the crosstalk of
      keeping N nodes mutually consistent, grows as N(N-1) = O(N^2), and can drive throughput
      backward. Amdahl's Law is the special case beta = 0.
    ref: "concepts.md#universal-scalability-law-why-adding-nodes-can-backfire"

  - id: capacity-planning-and-load-management-061
    difficulty: advanced
    tags: [usl, formula, scaling-ceiling]
    question: |
      The Universal Scalability Law peaks at N_max = sqrt((1 - alpha) / beta). What does this
      value tell a capacity planner?
    options: ["The minimum number of nodes required to start the service before it can accept any production traffic at all", "The node count at which throughput is maximized — beyond it, adding nodes REDUCES throughput, so it is a ceiling you must not exceed", "The utilization level at which average request latency doubles relative to the unloaded service time", "The number of availability zones you must provision in order to achieve N+1 redundancy at peak"]
    answer: 1
    explanation: |
      N_max is the fleet size at which the USL curve peaks. Past it the O(N^2) coherency cost
      outweighs added work and throughput goes retrograde, so it is a hard horizontal-scaling
      ceiling. If your workload has a non-trivial beta, scaling out past N_max makes things worse,
      not better — you must reduce coordination instead.
    ref: "concepts.md#universal-scalability-law-why-adding-nodes-can-backfire"

  - id: capacity-planning-and-load-management-062
    difficulty: advanced
    tags: [amdahl, usl, contention]
    question: |
      How does Amdahl's Law relate to the Universal Scalability Law?
    options: ["Amdahl's Law is entirely unrelated to scalability and describes only single-threaded instruction pipelining within one CPU core", "Amdahl's Law is the special case of the USL where the coherency term beta = 0 (only contention/serialization limits scaling, so throughput plateaus but never goes retrograde)", "Amdahl's Law predicts perfectly linear speedup that continues forever as nodes are added, with no serial fraction to cap it", "The USL is instead the special case of Amdahl's Law obtained by setting the contention term alpha to exactly zero"]
    answer: 1
    explanation: |
      Amdahl's Law captures only the serial-fraction (contention) limit: with beta = 0 the USL
      reduces to Amdahl, giving a throughput plateau at 1/alpha. The USL generalizes it by adding
      the coherency term beta, which explains the retrograde region Amdahl cannot — throughput
      actually falling as nodes are added.
    ref: "concepts.md#universal-scalability-law-why-adding-nodes-can-backfire"

  - id: capacity-planning-and-load-management-063
    difficulty: expert
    tags: [kinesis, scenario, resource-limit]
    question: |
      In the 2020 AWS Kinesis outage, operators ADDED front-end servers and the fleet got WORSE.
      Each front-end server spawned OS threads for every other server in the fleet. What is the
      capacity lesson?
    options: ["Adding capacity can REDUCE capacity when per-node cost grows with fleet size — the binding limit was an OS thread-count ceiling (an O(N^2)-ish coordination cost), not CPU/RAM", "CPU was the binding constraint all along, so the added front-end servers could not clock fast enough to rebuild the shard map in time", "The servers ran out of local disk space because each new front-end persisted a full copy of the shard map to its own attached volume", "The load balancer was misconfigured and kept routing all traffic to a single front-end server, leaving the newly added ones idle"]
    answer: 0
    explanation: |
      Because thread count per server scaled with fleet size, adding servers pushed every server
      past its OS thread limit, so none could build a correct shard-map. The lesson: adding
      capacity can reduce capacity when coordination cost grows with N (a USL-beta effect made
      physical), and the true ceiling is often an invisible config limit — threads, FDs, ports —
      not the resource on your dashboard.
    ref: "concepts.md#when-adding-capacity-reduces-capacity-the-kinesis-lesson"

  - id: capacity-planning-and-load-management-064
    difficulty: advanced
    tags: [cell-based, blast-radius, isolation]
    question: |
      A service partitions its fleet into 10 independent, capped cells, each a full copy of the
      stack, with requests routed to exactly one cell. What is the primary capacity/reliability
      benefit?
    options: ["It removes the need for any headroom at all, because splitting the fleet into cells lets each one absorb its own spikes with no spare capacity", "It guarantees perfectly linear scaling to an unlimited number of cells, since the coordination cost between cells stays exactly constant as you grow", "It lets every individual cell run safely at a full 100% utilization, because routing to a single cell eliminates the queueing-delay cliff entirely", "Bounded blast radius and bounded coordination cost — a single cell's overload or poison-pill affects only ~1/10 of traffic, and nodes coordinate only within a small cell (keeping USL beta in check)"]
    answer: 3
    explanation: |
      Cells cap both failure impact and coordination cost: a poison-pill or overload is contained
      to one cell (~1/C of traffic), and because nodes coordinate only inside a small cell, the
      O(N^2) coherency term never runs away. The trade-off is slightly lower efficiency — each
      cell needs its own headroom, so you can't pool as tightly.
    ref: "concepts.md#cell-based-architecture--blast-radius-isolation"

  - id: capacity-planning-and-load-management-065
    difficulty: advanced
    tags: [shuffle-sharding, isolation, blast-radius]
    question: |
      How does shuffle sharding reduce the blast radius of a noisy or poison-pill tenant beyond
      plain cell partitioning?
    options: ["It gives every single tenant its own fully dedicated cell with no sharing at all, so one tenant's overload can never touch another", "It continuously routes all tenants to whichever single cell is currently least loaded, rebalancing the whole population toward the emptiest shard", "It automatically disables any cell that receives too much traffic, shifting that cell's tenants onto the remaining healthy cells until load subsides", "It assigns each tenant a random COMBINATION of cells, so two tenants rarely share the exact same set — a single overloaded/failing shard affects only the small fraction of tenants mapped to that combination"]
    answer: 3
    explanation: |
      Shuffle sharding assigns each customer a random subset (combination) of nodes/cells. Because
      the number of distinct combinations is large, two customers rarely share the same full set,
      so a poison-pill or overload confined to one shard impacts only the tiny fraction of tenants
      whose combination overlaps it — far better isolation than simple partitioning.
    ref: "concepts.md#cell-based-architecture--blast-radius-isolation"

  - id: capacity-planning-and-load-management-066
    difficulty: advanced
    tags: [use-method, saturation]
    question: |
      In Brendan Gregg's USE method, which of Utilization, Saturation, and Errors is the LEADING
      capacity signal, and why?
    options: ["Utilization, because it is the easiest of the three to graph on a dashboard and always rises earliest, well before any queue forms", "Errors, because a resource always starts returning errors first and only afterward begins to accumulate a backlog of queued work", "Saturation — the degree of queued work beyond what the resource can service (run-queue length, pool wait-queue) — because it climbs before utilization pins at 100% and is what actually breaks SLO", "All three are effectively identical measurements of the same underlying resource pressure, so any one serves equally well"]
    answer: 2
    explanation: |
      Utilization (percent busy) can read comfortably while a resource is already backlogged for
      bursty work. Saturation measures the queued excess directly, so it rises before utilization
      saturates and correlates with SLO breach. USE says check all three per resource, but
      saturation is the capacity-relevant leading indicator you provision against.
    ref: "concepts.md#finding-the-binding-constraint-use-method--golden-signals"

  - id: capacity-planning-and-load-management-067
    difficulty: expert
    tags: [saturation, utilization, distinction]
    question: |
      A resource dashboard shows a worker pool at 70% utilization, yet requests are timing out
      waiting for a worker. How is this possible?
    options: ["Utilization must be misreported by the monitoring agent, because a worker pool sitting at only 70% can never physically cause a request to time out", "Bursty arrivals create a deep wait-queue (high SATURATION) even when average utilization is only 70% — utilization is a time-average that hides the queue that actually breaks SLO", "The worker pool is steadily leaking memory, so each request runs slower and eventually blocks long enough to trip the client-side timeout", "The underlying CPU is being throttled by the hypervisor's noisy-neighbor limiter, so real compute is far below the 70% figure shown"]
    answer: 1
    explanation: |
      Utilization is an average of percent-busy over time; it says nothing about the instantaneous
      queue. Bursty arrivals can build a long wait-queue (saturation) while the time-averaged
      utilization stays moderate. This is exactly why the USE method separates saturation from
      utilization — the queue, not the average, is what times out requests.
    ref: "concepts.md#finding-the-binding-constraint-use-method--golden-signals"

  - id: capacity-planning-and-load-management-068
    difficulty: expert
    tags: [open-model, closed-model, load-testing]
    question: |
      What fundamentally distinguishes an OPEN workload model from a CLOSED workload model in
      load generation?
    options: ["In an open model arrivals are independent of responses (new requests keep coming on schedule regardless of system speed, so a stall builds a backlog); in a closed model a fixed pool of virtual users loops send-wait-think, so the arrival rate self-throttles when the system slows", "In an open model every request is sent over HTTP while in a closed model requests are sent over gRPC, so the two differ purely by the wire protocol used", "Open models are always strictly single-threaded on the generator side, whereas closed models spread their virtual users across many threads to reach higher rates", "Closed models are structurally unable to measure latency at all and can only report aggregate throughput, which is precisely why open models were created"]
    answer: 0
    explanation: |
      Open workloads model real internet traffic — arrivals don't wait for you, so a stall causes
      a growing backlog and exposes overload. Closed workloads have N looping users whose next
      request waits for the previous response, so the offered rate drops when the system slows.
      That self-throttling is why closed models cannot overload past N and cause coordinated
      omission.
    ref: "concepts.md#open-vs-closed-load-models"

  - id: capacity-planning-and-load-management-069
    difficulty: expert
    tags: [closed-model, load-testing, trap]
    question: |
      A colleague load-tests with 500 virtual users in a tight loop (send, wait for response, send
      again) and reports excellent p99 at "the target rate." Why is this test untrustworthy for
      capacity planning?
    options: ["500 virtual users is simply far too few to matter for capacity work, since realistic tests always need at least several tens of thousands of users", "Virtual users in a tight loop always systematically overstate the error rate, so the reported p99 is actually pessimistic rather than optimistic here", "It is a closed model: it self-throttles, so it can never drive the system past 500 in-flight requests, it hides the queue an open arrival process would build (coordinated omission), and it cannot find the true overload point", "The setup measures raw throughput correctly but is inherently unable to record per-request latency, so its reported p99 figure is meaningless noise"]
    answer: 2
    explanation: |
      A closed loop caps in-flight work at the user count and slows its own send rate whenever the
      system slows, so it structurally cannot overload the service and omits the backlog an open
      arrival process would create. The great-looking p99 is coordinated omission. Use an
      open-model / constant-arrival-rate generator (wrk2, k6 arrival-rate executor, Vegeta,
      Gatling open profile).
    ref: "concepts.md#open-vs-closed-load-models"

  - id: capacity-planning-and-load-management-070
    difficulty: advanced
    tags: [erlang, offered-load, littles-law]
    question: |
      A service sees 500 requests/sec with a mean service (holding) time of 40 ms. What is the
      offered load in erlangs, and what does it represent?
    options: ["20 erlangs — the average number of servers busy simultaneously (equal to Little's Law L)", "500 erlangs — the raw request arrival rate, read straight off as the offered load", "40 erlangs — the mean service (holding) time of 40 ms simply restated as erlangs", "12,500 erlangs — the arrival rate divided by the service time in seconds"]
    answer: 0
    explanation: |
      Offered load E = lambda * h = 500 * 0.04 s = 20 erlangs. One erlang is one server-hour of
      work per hour, so 20 erlangs means 20 servers are busy on average — exactly Little's Law's L.
      It's the baseline you must staff before adding any safety margin.
    ref: "concepts.md#sizing-to-a-wait-target-erlang-c--square-root-staffing"

  - id: capacity-planning-and-load-management-071
    difficulty: expert
    tags: [square-root-staffing, headroom, economies-of-scale]
    question: |
      By the square-root staffing rule (servers ~ E + c*sqrt(E)), why do large services need
      proportionally LESS headroom than small ones for the same service level?
    options: ["Large services simply run on faster, higher-clocked CPUs, so each server clears its queue quickly enough that far less spare headroom is needed", "The safety term grows as sqrt(E), so as offered load E grows, the safety margin shrinks as a FRACTION of load — e.g. ~45% extra at 20 erlangs but only ~4.5% extra at 2000 erlangs", "Large services never experience demand spikes because their huge and diverse traffic mix averages every burst away, removing the need for a margin", "Required headroom is a fixed percentage of offered load regardless of service size, but large services can simply afford to buy more of it outright"]
    answer: 1
    explanation: |
      The safety term c*sqrt(E) grows only with the square root of load, while E grows linearly.
      So the ratio sqrt(E)/E = 1/sqrt(E) falls as E rises: a 20-erlang service needs ~29 servers
      (~45% headroom) but a 2000-erlang service needs ~2089 (~4.5%). This is the economies-of-scale
      argument for pooling and why small services must run structurally cooler.
    ref: "concepts.md#sizing-to-a-wait-target-erlang-c--square-root-staffing"

  - id: capacity-planning-and-load-management-072
    difficulty: expert
    tags: [tail-latency, fan-out, provisioning]
    question: |
      A request fans out to 100 leaf servers and must wait for the SLOWEST to return. Each leaf
      independently exceeds its own p99 (is "slow") with probability 1%. Roughly what fraction of
      parent requests experience at least one slow leaf?
    options: ["About 1%", "About 10%", "About 63%", "About 100%"]
    answer: 2
    explanation: |
      P(at least one slow) = 1 - 0.99^100 ~= 0.63. So a leaf-level p99 becomes roughly the
      request-level MEDIAN — the tail-at-scale effect (Dean & Barroso). A fan-out service must be
      provisioned and tuned against the TAIL latency of its leaves, not their mean, or stragglers
      dominate the aggregate latency.
    ref: "concepts.md#tail-driven-capacity-provision-for-the-tail-not-the-mean"

  - id: capacity-planning-and-load-management-073
    difficulty: advanced
    tags: [tail-latency, percentiles, provisioning]
    question: |
      Why should you provision capacity against the p99 (peak-of-peaks) of demand rather than the
      mean?
    options: ["The arithmetic mean of a demand series is computationally expensive to derive at scale, so the p99 is chosen mainly because it is the far cheaper statistic to calculate", "The p99 of a demand distribution is always exactly twice its mean by definition, so sizing to p99 just builds in a fixed 2x safety factor over the average", "Financial and telecom regulators explicitly mandate provisioning to the 99th percentile of demand, so mean-based sizing would fail a compliance audit outright", "Averages smooth away the bursts that actually saturate the system; sizing to the mean puts you over the utilization cliff during the peaks that matter"]
    answer: 3
    explanation: |
      Capacity is broken by peaks, not averages. A mean hides the bursty moments where offered
      load spikes above the knee; provisioning to it guarantees you fall over during those peaks.
      Sizing so even the p99 of demand stays left of the knee is what keeps tail latency bounded
      when it counts.
    ref: "concepts.md#tail-driven-capacity-provision-for-the-tail-not-the-mean"

  - id: capacity-planning-and-load-management-074
    difficulty: advanced
    tags: [analytical-model, gray-box, nalsd]
    question: |
      Instead of only black-box load testing, an engineer builds a capacity model: measure the
      cost of one request in the currency of the bottleneck, then multiply by forecast rate. What
      is the correct "currency" to measure?
    options: ["The per-request cost of the BINDING resource — CPU-ms, disk IOPS, bytes, DB rows read/written, or lock-hold time — whichever resource saturates first", "Always CPU utilization percentage, since compute is universally the first resource to saturate and every other resource scales in fixed proportion to it", "The end-to-end wall-clock latency of a single request multiplied by the forecast rate, since latency is the truest measure of per-request resource cost", "The number of lines of application code executed per request, since instruction count is the most portable and hardware-independent proxy for true cost"]
    answer: 0
    explanation: |
      A gray-box / NALSD model sizes capacity as forecast_rate * per-request cost of the binding
      resource. You must express cost in the units of whatever saturates first (CPU-ms, IOPS,
      bytes, DB rows, lock time), then validate against a load test. Modeling in the wrong currency
      (e.g. CPU when the DB is the limit) sizes the wrong thing.
    ref: "concepts.md#analytical-capacity-models-gray-box--nalsd"

  - id: capacity-planning-and-load-management-075
    difficulty: expert
    tags: [forecasting, per-resource, scenario]
    question: |
      A new feature is forecast to 2x request volume. The team doubles the app fleet, but the
      launch still falls over. Post-mortem shows the feature issues 5 DB writes per request
      instead of 1. What planning mistake was made?
    options: ["They doubled the app fleet when the 2x request forecast plainly called for tripling it, since a safe launch always provisions one extra multiple of headroom above the raw forecast", "They forecast on a single aggregate metric (requests) instead of PER RESOURCE — the feature 2x'd requests but 10x'd DB writes, so the database (not the app tier) was the binding constraint", "The database hardware was simply too slow for the workload, and the only correct fix would have been to upgrade to faster storage before the launch", "The autoscaling cooldown window was set too long, so the fleet could not add app instances quickly enough to keep pace with the doubling of request volume"]
    answer: 1
    explanation: |
      Capacity must be modeled per resource. A 2x request forecast can mean 10x on a specific
      resource (2 requests/1 * 5 writes/1 = 10x writes). Sizing only the app tier on "requests"
      missed that the database write path was the actual bottleneck. Forecast each binding resource
      separately, because a launch rarely scales all of them by the same factor.
    ref: "concepts.md#analytical-capacity-models-gray-box--nalsd"

  - id: capacity-planning-and-load-management-076
    difficulty: advanced
    tags: [retry-amplification, retry-storm]
    question: |
      A service slows down and its clients retry once on timeout. What is the capacity-side danger
      of this behavior?
    options: ["Retry amplification: retries roughly 2-3x the offered load exactly when the service has the least spare capacity, deepening the overload into a self-sustaining retry storm", "Retries actually reduce total offered load, because the client layer deduplicates identical in-flight requests and collapses them into a single call to the server", "Retries stay entirely on the client side and never reach the server again, so a struggling service sees no additional load however aggressively clients retry", "Retries improve tail latency during a slowdown, because the second attempt is routed to a fresh less-loaded connection that almost always returns faster than the first"]
    answer: 0
    explanation: |
      Client retries multiply offered load precisely during a slowdown, when you can least afford
      it — a naive single retry can 2-3x load, and retries-of-retries compound into a storm. You
      must provision for, or shed, this surge. Mitigations: exponential backoff with full jitter,
      retry budgets/token buckets (cap retries to ~10%), and circuit breakers.
    ref: "concepts.md#retry-amplification-thundering-herd--correlated-demand"

  - id: capacity-planning-and-load-management-077
    difficulty: expert
    tags: [backoff, jitter, thundering-herd]
    question: |
      A team adds exponential backoff to client retries but omits jitter. Why can the retry storm
      still recur?
    options: ["Exponential backoff without jitter simply moves the whole herd to a later instant — clients that failed together retry together at the same backed-off time, re-synchronizing the spike", "Exponential backoff always makes a retry storm strictly worse, because each doubled wait interval stacks more pending retries into memory until the client exhausts its own heap", "Jitter is purely a logging and tracing concern that randomizes timestamp fields, and has no effect at all on when clients actually schedule and fire their retry attempts", "Backoff without jitter silently disables the retry path on most HTTP clients, so the storm you observe must instead be coming from the load balancer's own health probes"]
    answer: 0
    explanation: |
      Backoff spaces retries in time, but if all clients failed at the same moment they compute the
      same backoff and retry in unison — the herd just hits later, still synchronized. Full jitter
      randomizes each client's wait, spreading retries across the interval so they de-correlate.
      That's why AWS guidance is backoff WITH full jitter, not backoff alone.
    ref: "concepts.md#retry-amplification-thundering-herd--correlated-demand"

  - id: capacity-planning-and-load-management-078
    difficulty: intermediate
    tags: [retry-budget, token-bucket]
    question: |
      What does a retry budget (or retry token bucket) accomplish?
    options: ["It guarantees that every request eventually succeeds, because the budget keeps re-issuing each failed call on a schedule until the dependency finally returns a healthy response", "It deliberately increases the retry rate during an outage so a larger share of requests can push through the degraded dependency before it fully recovers its capacity", "It fully replaces the need for per-call timeouts, since a token bucket already bounds how long any single request is allowed to wait before the client gives up on it", "It caps retries to a small fraction of requests (e.g. <=10%); when the budget is exhausted the client fails fast instead of retrying, preventing a retry storm from amplifying an overload"]
    answer: 3
    explanation: |
      A retry budget limits aggregate retries to a fraction of total requests. Under widespread
      failure the budget drains and further retries are suppressed, so the client fails fast rather
      than multiplying load on an already-overloaded dependency. It's the guardrail that stops
      retries from turning a slowdown into a storm.
    ref: "concepts.md#retry-amplification-thundering-herd--correlated-demand"

  - id: capacity-planning-and-load-management-079
    difficulty: advanced
    tags: [thundering-herd, cache-stampede]
    question: |
      A popular cache entry expires and thousands of requests simultaneously miss and hit the
      origin database, overwhelming it. Which mitigation directly addresses this?
    options: ["Increase the origin database's connection and query timeout so the flood of simultaneous cache-miss requests is given enough time to complete instead of failing", "Disable caching entirely for the hot key so requests always read straight from the origin database, removing the expiry event that triggers the synchronized miss", "Add several more automatic retries on the origin database call, so the requests that lose the initial race eventually get their value once the first refill completes", "Request coalescing / single-flight (only one request recomputes the value while others wait) plus jittered TTLs so entries don't all expire at once"]
    answer: 3
    explanation: |
      A cache stampede is a thundering herd on expiry. Single-flight/request coalescing lets one
      request refill the entry while the rest wait for its result, and jittering TTLs prevents many
      keys from expiring simultaneously. Bigger timeouts or more retries would make the origin
      overload worse, not better.
    ref: "concepts.md#retry-amplification-thundering-herd--correlated-demand"

  - id: capacity-planning-and-load-management-080
    difficulty: expert
    tags: [statistical-multiplexing, correlated-demand]
    question: |
      Bin-packing many services onto shared capacity relies on "aggregate peak < sum of individual
      peaks." When does this statistical-multiplexing assumption break?
    options: ["When the co-located services are written in different programming languages, since heterogeneous runtimes fragment the shared scheduler and stop their peaks from ever averaging out cleanly", "When demand becomes CORRELATED — synchronized retries, cache stampedes, cron jobs firing at :00, reconnect storms, or a shared same-timezone diurnal peak line the peaks up in time, so the aggregate peak approaches the sum of peaks", "When each co-located service is backed by its own dedicated database, because the separate storage tiers can no longer smooth one another's load and the peaks stop cancelling", "When the shared pool's aggregate utilization drops below roughly 50%, since statistical multiplexing only holds once the pool is packed tightly enough for peaks to overlap"]
    answer: 1
    explanation: |
      Statistical multiplexing works only if peaks are uncorrelated so they don't coincide. Once
      demand synchronizes — retry storms, cache expiry, cron at :00, reconnect storms, same-timezone
      diurnal peaks — the peaks stack and your pooled headroom evaporates. De-correlate with jitter
      and coalescing, or provision for the correlated worst case.
    ref: "concepts.md#retry-amplification-thundering-herd--correlated-demand"

  - id: capacity-planning-and-load-management-081
    difficulty: advanced
    tags: [quotas, service-limits]
    question: |
      A service tier has ample CPU and memory headroom but starts failing under load. What
      NON-hardware capacity ceiling should you suspect first?
    options: ["The refresh interval configured on the observability dashboard, since a slow-updating panel is the usual reason a service appears to fail while CPU and memory still look abundant", "A soft/hard account or service quota — API rate limits, Lambda concurrency, ENIs/EIPs, connection limits, or ephemeral-port/conntrack ceilings — which you hit long before CPU", "The specific minor version of the host operating system, since an out-of-date kernel build is the most common non-hardware reason a well-resourced service starts failing under load", "The number of active git branches and build artifacts accumulating in the deployment pipeline, which is the usual non-hardware ceiling a service hits before it runs out of CPU"]
    answer: 1
    explanation: |
      Real ceilings are frequently account/service quotas rather than hardware: API rate limits,
      Lambda concurrency, ENIs/EIPs, connection limits, ephemeral ports, conntrack table size. The
      Kinesis OS-thread limit is the archetype. Track quota headroom as a first-class metric — CPU
      being fine does not mean you have capacity.
    ref: "concepts.md#provisioning-against-quotas-and-limits"

  - id: capacity-planning-and-load-management-082
    difficulty: intermediate
    tags: [quotas, launch-planning]
    question: |
      Why must service-quota increases be requested well AHEAD of a forecast peak or launch?
    options: ["Quota increases are only processed free of charge on weekends, so filing the request mid-week during a launch would incur a rush surcharge you can avoid by planning ahead", "Service quotas automatically scale upward in lockstep with your provisioned CPU, so as long as you add compute the downstream API and concurrency limits rise to match it", "Many quota increases take days to approve and cannot be granted during an incident — provisioning compute but forgetting the downstream API/concurrency quota means you fail at the quota, not the CPU", "Requesting a quota increase early lowers its per-unit cost, because providers discount limit raises that are booked well in advance of the forecast peak they cover"]
    answer: 2
    explanation: |
      Quota increases often require provider review that takes days, so you cannot raise them
      reactively mid-incident. A launch plan that scales compute but leaves a downstream API rate
      limit or Lambda concurrency limit unchanged will hit the quota wall first. File increases
      ahead of the forecast as part of capacity prep.
    ref: "concepts.md#provisioning-against-quotas-and-limits"

  - id: capacity-planning-and-load-management-083
    difficulty: intermediate
    tags: [demand-shifting, batch]
    question: |
      How can deferrable batch work (ML training, backfills, report generation) act as a capacity
      shock absorber for latency-sensitive traffic?
    options: ["By deliberately running the batch work alongside peak user traffic so both workloads share the same resources and the fleet's overall utilization is kept flat across the day", "By scheduling it into demand troughs and preempting/pausing it during peaks (ideally on spot/preemptible instances), freeing its capacity for the serving path when demand surges", "By permanently carving out a block of dedicated capacity for batch work that the serving path never touches, guaranteeing the two workloads can never contend under load", "By converting the deferrable batch jobs into synchronous request-time handlers so their work is absorbed inline and never has to be scheduled against the serving path"]
    answer: 1
    explanation: |
      Deferrable work can be shifted in TIME: run it overnight in troughs and preempt it during
      peaks, handing its capacity to latency-sensitive traffic. Running it on spot/preemptible
      instances makes it both cheap and naturally interruptible. This complements shed/queue/
      rate-limit — you pause background work instead of degrading user requests.
    ref: "concepts.md#demand-shifting-batch-as-a-shock-absorber"

  - id: capacity-planning-and-load-management-084
    difficulty: expert
    tags: [load-balancer, imbalance, hot-node, scenario]
    question: |
      Fleet-average CPU sits at 60% and dashboards look healthy, yet users report elevated p99 and
      some requests time out. Sticky sessions route heavy users unevenly. What is the likely cause?
    options: ["Load-balancer imbalance — one or a few hot instances are near their own wall while the average stays at 60%, and fleet p99 is driven by the hottest node, not the mean", "The fleet-average CPU figure is simply being miscomputed by the monitoring pipeline, and once the metric is corrected it will reveal the whole fleet is actually saturated", "The p99 latency SLO is set far too tight for this workload, so healthy requests are being counted as violations even though every instance has ample headroom to spare", "Every instance's CPU is being throttled uniformly by the hypervisor's noisy-neighbor limiter, so real compute sits well below the 60% shown and the whole fleet is equally starved"]
    answer: 0
    explanation: |
      M/M/c math assumes perfect load balancing. With sticky sessions, hot shards, or uneven
      hashing, one instance can be over its knee while the fleet average looks fine — and tail
      latency is set by the hottest node. Always watch PER-INSTANCE saturation, not just the fleet
      average, or you will "have headroom" on a dashboard while a hot node is already over the cliff.
    ref: "concepts.md#autoscaling-config-in-practice-numbers--defaults"

  - id: capacity-planning-and-load-management-085
    difficulty: expert
    tags: [target-tracking, oscillation, control-theory]
    question: |
      A target-tracking autoscaler set to a noisy metric keeps rapidly scaling out then in
      (oscillating). What is the control-theory explanation and the right fix?
    options: ["The cloud provider is rate-limiting your scaling API calls, forcing the fleet to add and drop instances in bursts, and there is no configuration change available that can smooth it out", "Target-tracking autoscalers are mathematically incapable of oscillating, so the tracked metric must be fine and what looks like flapping is really just normal steady-state scaling", "The feedback loop overshoots/undershoots because the tracked metric is noisy and interacts with provisioning lag; fix it with a stabilization window/cooldown and by tracking a smoother, more causal metric", "Raise the target utilization setpoint to 100% so the autoscaler has no headroom left to react to, which stops it from ever issuing another scale-out or scale-in action"]
    answer: 2
    explanation: |
      A control loop reacting to a noisy signal, combined with the delay of provisioning lag,
      overshoots and then over-corrects — classic oscillation. Damp it with a stabilization window/
      cooldown, smooth the metric, and track a more causal, less jittery signal (e.g. RPS/target or
      backlog) rather than raw noisy CPU.
    ref: "concepts.md#autoscaling-config-in-practice-numbers--defaults"

  - id: capacity-planning-and-load-management-086
    difficulty: advanced
    tags: [keda, queue-depth, event-driven]
    question: |
      For a Kubernetes event-consumer whose true bottleneck is message backlog (not CPU), which
      scaling approach fits best?
    options: ["A standard Horizontal Pod Autoscaler driven purely by consumer CPU utilization, since backlog growth reliably shows up as proportionally higher CPU on every consumer pod", "A fixed-size static fleet permanently sized for the highest historical backlog peak, so the consumers never need to scale in response to the queue depth at all", "Vertical scaling that grows the CPU and memory of one large consumer pod, since a single fatter consumer drains a deep message backlog faster than many smaller ones", "KEDA scaling on the queue's ApproximateNumberOfMessages / ApproximateAgeOfOldestMessage (or Kafka consumer lag), which can also scale to zero when idle"]
    answer: 3
    explanation: |
      When backlog is the causal signal, scale on backlog. KEDA drives scaling from event sources
      like SQS ApproximateNumberOfMessages / ApproximateAgeOfOldestMessage or Kafka consumer lag,
      and supports scale-to-zero when idle. CPU-only HPA misses backlog growth when the work is
      I/O-bound or the bottleneck is downstream.
    ref: "concepts.md#autoscaling-config-in-practice-numbers--defaults"

  - id: capacity-planning-and-load-management-087
    difficulty: advanced
    tags: [triangle, utilization, throughput, latency]
    question: |
      Why can't a system simultaneously maximize throughput, minimize latency, AND maximize
      utilization?
    options: ["Because the 1/(1-rho) wall means pushing utilization toward 1.0 to maximize throughput destroys tail latency — so utilization is the dial that TRADES throughput against latency; you pick at most two corners", "Because a CPU physically cannot run above 100% utilization, so throughput hits a hard wall there while latency and utilization stay completely free to be optimized together", "Because latency and throughput are entirely independent quantities with no queueing relationship between them, so utilization can be pushed to 1.0 without affecting either one", "Because utilization is a metric that only matters for batch pipelines, whereas latency-sensitive online services obey a separate set of rules where the three never conflict"]
    answer: 0
    explanation: |
      The three are locked by queueing theory. Driving utilization high to squeeze out throughput
      forces response time up the 1/(1-rho) curve, wrecking latency. So you choose a latency SLO OR
      a throughput target and let utilization trade between them: latency-sensitive services run
      cool (~50-70%), batch systems run hot (80-90%) to maximize throughput per dollar.
    ref: "concepts.md#the-utilization-throughput-and-latency-triangle"

  - id: capacity-planning-and-load-management-088
    difficulty: expert
    tags: [service-time, response-time, distinction]
    question: |
      In latency measurement, what is the difference between service time and response time, and
      why does it matter for capacity?
    options: ["They are two names for the exact same measurement, so a benchmark that reports one has fully captured the other and there is no separate queue-wait component to worry about when planning capacity", "Response time is the figure that excludes network transit while service time is the one that includes it, so the two differ only by round-trip latency and neither is affected by queue depth", "Service time is by definition always larger than response time, because it accounts for full processing plus every downstream call, so watching service time alone is the safe conservative choice", "Service time is the time actually spent serving a request; response time is service time PLUS queue wait. Coordinated omission and moderate-utilization overload inflate the queue-wait component, so measuring only service time hides the capacity problem"]
    answer: 3
    explanation: |
      Response time = queue wait + service time. Near the knee (and under coordinated omission),
      it's the queue-wait component that explodes while raw service time barely changes. A benchmark
      that reports only service time looks fine even as customers experience huge response times, so
      you must measure end-to-end response time (now minus intended send time) to see the real tail.
    ref: "concepts.md#open-vs-closed-load-models"
