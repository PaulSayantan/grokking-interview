topic: "Capacity Planning & Load Management"
domain: reliability-ops
topic_slug: capacity-planning-and-load-management
version: 1
questions:
  - id: capacity-planning-and-load-management-001
    difficulty: beginner
    tags: [capacity-planning, fundamentals]
    question: |
      What is the central goal of capacity planning?
    options: ["Ensure the system has enough resources to meet forecast demand at its target reliability, without wasteful overprovisioning", "Minimize the number of servers regardless of demand", "Guarantee 100% CPU utilization on every host", "Eliminate the need for autoscaling"]
    answer: 0
    explanation: |
      Capacity planning ensures there are enough resources to meet demand at the target
      reliability — no less (outages) and no more than necessary (wasted cost). It is a
      risk/cost balance, not a pure minimization or maximization of any single number.
    ref: "concepts.md#provisioned-vs-usable-capacity"

  - id: capacity-planning-and-load-management-002
    difficulty: beginner
    tags: [utilization, latency]
    question: |
      Why is running a latency-sensitive service at 100% utilization dangerous even if no
      hardware fails?
    options: ["Electricity costs spike at full load", "The CPU physically cannot exceed 100%", "As utilization approaches 100%, queueing delay and latency rise toward infinity, and there is no slack to absorb variance", "TCP connections are capped at 100%"]
    answer: 2
    explanation: |
      By queueing theory (M/M/1: W = S/(1-rho)), as utilization rho approaches 1.0 the
      response time diverges. At 100% there is no headroom for variance, deploys, or spikes, so
      latency and queue depth blow up. That's why you deliberately run below saturation.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-003
    difficulty: beginner
    tags: [provisioned-capacity, usable-capacity]
    question: |
      A team says "we have 20 servers that each benchmark at 1,000 rps, so we can serve
      20,000 rps." Why is this reasoning usually wrong?
    options: ["Benchmarks always overstate CPU speed", "20 servers can never serve more than 10,000 rps", "rps is not a valid capacity unit", "The benchmark peak is measured at unrealistic utilization/latency, and it ignores headroom reserved for failures, spikes, and deploys — usable capacity is much lower"]
    answer: 3
    explanation: |
      Provisioned capacity is not usable capacity. The benchmark number is peak throughput,
      often at 100% util with poor latency; usable rps at SLO is lower, and you must still
      reserve capacity to survive losing a node/AZ and to handle spikes and rolling deploys.
    ref: "concepts.md#provisioned-vs-usable-capacity"

  - id: capacity-planning-and-load-management-004
    difficulty: intermediate
    tags: [littles-law, concurrency]
    question: |
      A service receives 2,000 requests/sec and each request spends 50 ms in the system.
      By Little's Law, roughly how many requests are in flight concurrently?
    options: ["40", "100", "1,000", "10"]
    answer: 1
    explanation: |
      Little's Law: L = lambda * W = 2000 * 0.05 s = 100 requests in the system on average.
      So you need on the order of 100 concurrent workers/threads (plus headroom) to keep up.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-005
    difficulty: intermediate
    tags: [littles-law, thread-pool]
    question: |
      A thread pool has 200 threads and each request holds a thread for 100 ms. What is the
      approximate maximum throughput before requests start queueing?
    options: ["200 rps", "20,000 rps", "2,000 rps", "500 rps"]
    answer: 2
    explanation: |
      Rearranging Little's Law, lambda_max = L / W = 200 / 0.1 s = 2,000 rps. Beyond that,
      arrivals exceed what 200 concurrent threads can serve, so requests queue and latency (W)
      rises to rebalance the equation.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-006
    difficulty: advanced
    tags: [utilization-wall, mm1, latency]
    question: |
      Using the M/M/1 approximation W = S/(1-rho), how much does average response time inflate
      (relative to raw service time S) at 90% utilization versus 50% utilization?
    options: ["2x at 50%, 10x at 90%", "Same at both (1x)", "1.5x at 50%, 3x at 90%", "10x at 50%, 100x at 90%"]
    answer: 0
    explanation: |
      1/(1-0.5) = 2x at 50% utilization, and 1/(1-0.9) = 10x at 90%. The 1/(1-rho) term is the
      hockey stick: latency is roughly flat until ~70-80% then goes vertical. Being "only at
      90%" already means 10x the service time in queueing delay.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-007
    difficulty: intermediate
    tags: [headroom, redundancy]
    question: |
      In N+1 redundancy terminology (N = capacity needed to serve peak at SLO), what does the
      "+1" provide?
    options: ["One extra AZ", "One extra day of forecast", "A doubling of total capacity", "Enough spare capacity to survive the loss of any single unit while still serving peak"]
    answer: 3
    explanation: |
      N is exactly enough to serve peak; N+1 adds one spare unit so the loss of any single unit
      still leaves enough to serve peak demand within SLO. N+2 tolerates two simultaneous losses
      (or one failure during maintenance).
    ref: "concepts.md#headroom-n1--n2-and-why-not-to-run-at-100"

  - id: capacity-planning-and-load-management-008
    difficulty: advanced
    tags: [headroom, multi-az]
    question: |
      A service runs across 3 AZs and must survive losing any one AZ at peak. What is the
      maximum steady-state utilization each AZ should run at?
    options: ["~50%", "~67% (2/3)", "~90%", "~33% (1/3)"]
    answer: 1
    explanation: |
      If one of three AZs fails, the remaining two must carry 100% of peak. Two AZs at 100%
      equals three AZs at ~2/3 each, so each AZ should stay at about 67% max in normal operation.
      With only 2 AZs you'd need each at <=50%.
    ref: "concepts.md#headroom-n1--n2-and-why-not-to-run-at-100"

  - id: capacity-planning-and-load-management-009
    difficulty: intermediate
    tags: [forecasting, growth]
    question: |
      A service's demand grows organically at 5% per month (compounding). Roughly how much
      larger is peak demand after 12 months?
    options: ["~60% larger (about 1.8x)", "~1.6% larger", "~5% larger", "Exactly 2x"]
    answer: 0
    explanation: |
      Compounding: 1.05^12 is about 1.80, so demand is roughly 1.8x — about 80% larger — after a
      year. Small monthly rates compound into large annual multipliers, which is why organic
      growth alone forces regular capacity reviews.
    ref: "concepts.md#forecasting-demand-organic-growth-events--seasonality"

  - id: capacity-planning-and-load-management-010
    difficulty: intermediate
    tags: [forecasting, inorganic]
    question: |
      Marketing says a product launch will bring 5 million signups on day one — with no
      historical traffic to extrapolate from. Which forecasting approach fits?
    options: ["Organic / bottom-up trend extrapolation", "Ignore it; autoscaling will handle it", "Inorganic / top-down, business-driven forecasting", "Soak testing"]
    answer: 2
    explanation: |
      Launches and one-off events have no historical signal to extrapolate, so you use inorganic
      (top-down, business-driven) forecasting: take the business estimate and provision/load-test
      to it. Organic extrapolation only works for steady growth and recurring seasonality.
    ref: "concepts.md#forecasting-demand-organic-growth-events--seasonality"

  - id: capacity-planning-and-load-management-011
    difficulty: intermediate
    tags: [forecasting, peak]
    question: |
      When provisioning capacity for a consumer retail service, which demand figure should you
      size against?
    options: ["The peak-of-peaks — e.g. the busiest minute of the busiest day (Black Friday)", "Monthly average requests", "The median across all days", "The 50th percentile of daily traffic"]
    answer: 0
    explanation: |
      You must survive the worst moment, so you size against the peak-of-peaks (the busiest
      minute of the busiest day), not an average. Sizing to averages guarantees you fall over
      during predictable seasonal peaks.
    ref: "concepts.md#forecasting-demand-organic-growth-events--seasonality"

  - id: capacity-planning-and-load-management-012
    difficulty: beginner
    tags: [load-testing, types]
    question: |
      What distinguishes a stress test from a load test?
    options: ["A stress test uses fake data; a load test uses real data", "They are the same thing", "A load test drives expected/target load to check SLO; a stress test pushes past the peak until the system breaks to find the breaking point and failure mode", "A stress test only runs for a few seconds"]
    answer: 2
    explanation: |
      A load test verifies you meet SLO at your expected peak. A stress test deliberately pushes
      beyond that until the system breaks, revealing both where the breaking point is and how the
      system fails (graceful vs collapse).
    ref: "concepts.md#load-testing-load-vs-stress-vs-soak-vs-spike"

  - id: capacity-planning-and-load-management-013
    difficulty: intermediate
    tags: [load-testing, soak]
    question: |
      Which failure mode is a soak (endurance) test specifically designed to catch that a short
      load test will miss?
    options: ["Insufficient peak throughput", "A missing index on a query", "Incorrect load-balancer configuration", "Slow resource leaks — memory/fd leaks, disk fill, cache bloat, log growth — that only manifest after hours"]
    answer: 3
    explanation: |
      Soak/endurance tests sustain moderate load for hours/days to expose gradual degradation:
      memory leaks, file-descriptor leaks, disk filling, cache/heap bloat, log growth. A memory
      leak that OOMs after 6 hours is invisible in a 10-minute test.
    ref: "concepts.md#load-testing-load-vs-stress-vs-soak-vs-spike"

  - id: capacity-planning-and-load-management-014
    difficulty: intermediate
    tags: [load-testing, spike]
    question: |
      Which test type best evaluates whether your autoscaling can react to a sudden flash crowd?
    options: ["Soak test", "Spike test", "Volume test", "Load test at steady expected peak"]
    answer: 1
    explanation: |
      A spike test applies a sudden, sharp jump in load then drops it, directly testing whether
      the system survives a flash crowd and whether autoscaling (which has provisioning lag) can
      react in time.
    ref: "concepts.md#load-testing-load-vs-stress-vs-soak-vs-spike"

  - id: capacity-planning-and-load-management-015
    difficulty: advanced
    tags: [load-testing, realism]
    question: |
      A load test reports 3x the throughput the service actually sustains in production. The
      test replayed requests that were nearly all cache hits. What is the most likely cause of
      the discrepancy?
    options: ["The load generator was too slow", "Production has slower CPUs", "Unrealistic traffic mix — the all-cache-hit workload avoided the real bottleneck (DB/backend), overstating capacity", "The test ran too long"]
    answer: 2
    explanation: |
      Cache hit rate, payload sizes, and key distribution dominate real behavior. Testing
      all-cache-hit traffic bypasses the database/backend that is the true bottleneck under a
      realistic mix, so the test wildly overstates usable capacity.
    ref: "concepts.md#load-testing-load-vs-stress-vs-soak-vs-spike"

  - id: capacity-planning-and-load-management-016
    difficulty: advanced
    tags: [coordinated-omission, load-testing]
    question: |
      What is coordinated omission in load testing?
    options: ["A closed-loop generator stops sending during a server stall, so the requests that would have suffered the long queue wait are never issued — hiding the true tail latency", "The test intentionally skips warmup requests", "The load balancer omits health checks", "Two load generators send duplicate requests"]
    answer: 0
    explanation: |
      Closed-loop generators send, wait for the response, then send the next. During a stall they
      pause sending, omitting exactly the samples that would have experienced the worst queueing.
      The result understates p99/p999 dramatically — the coordinated omission trap (Gil Tene).
    ref: "concepts.md#coordinated-omission-the-load-test-measurement-trap"

  - id: capacity-planning-and-load-management-017
    difficulty: advanced
    tags: [coordinated-omission, tail-latency]
    question: |
      A system that should serve 10,000 rps freezes for 1 full second. A naive closed-loop load
      tool records this as roughly one 1-second sample and many fast samples afterward. What is
      the real production impact it fails to capture?
    options: ["Nothing — one slow request is accurate", "The server would have rejected all requests instantly", "Throughput would have doubled", "About 10,000 requests arrive during the freeze and each waits up to ~1 s, so the true tail (p99) is near 1 s, not a few ms"]
    answer: 3
    explanation: |
      In production the arrival process is independent of responses, so ~10,000 requests queue up
      during the 1 s freeze, each waiting up to ~1 s. The closed-loop tool only records one slow
      sample, so it reports a tiny p99 while the real p99 is ~1 s. That's coordinated omission.
    ref: "concepts.md#coordinated-omission-the-load-test-measurement-trap"

  - id: capacity-planning-and-load-management-018
    difficulty: advanced
    tags: [coordinated-omission, tooling]
    question: |
      Which approach correctly avoids coordinated omission?
    options: ["Use a closed-loop tool but run it longer", "Model an open workload / constant arrival rate that sends on schedule regardless of prior responses (e.g. wrk2), or back-correct using HdrHistogram", "Only measure p50 latency", "Disable keep-alive connections"]
    answer: 1
    explanation: |
      The fix is to decouple sending from responses: use an open-workload tool that sends at a
      fixed schedule (wrk2, k6/Gatling correction modes) or synthesize the omitted samples via
      HdrHistogram correction, measuring latency as now minus intended-send-time to capture queue
      wait.
    ref: "concepts.md#coordinated-omission-the-load-test-measurement-trap"

  - id: capacity-planning-and-load-management-019
    difficulty: intermediate
    tags: [knee, saturation]
    question: |
      In a step/ramp capacity test, what characterizes the "knee" (saturation point)?
    options: ["Throughput plateaus (a bottleneck is reached) and additional offered load no longer increases goodput while latency begins climbing", "Latency drops to zero", "The server crashes immediately", "CPU drops below 10%"]
    answer: 0
    explanation: |
      Below the knee, throughput rises with offered load and latency is flat. At the knee a
      bottleneck (CPU, lock, pool, DB) caps throughput; more load only adds queueing/latency, not
      goodput. That is the maximum sustainable throughput.
    ref: "concepts.md#finding-the-knee-saturation-point--capacity-limits"

  - id: capacity-planning-and-load-management-020
    difficulty: advanced
    tags: [knee, collapse, capacity]
    question: |
      Why should you plan capacity at the knee rather than at the collapse point?
    options: ["The collapse point is easier to measure", "The knee and collapse point are always identical", "Provisioning to the collapse point means production runs in the unstable region where a small nudge triggers cascading failure; the knee is the max stable/usable throughput", "Regulators require it"]
    answer: 2
    explanation: |
      Past the knee, latency goes vertical and eventually goodput falls (thrashing, retries,
      congestive collapse). Sizing to the collapse point leaves the system operating in the
      unstable region, one small spike from a cascading failure. Plan at the knee minus headroom.
    ref: "concepts.md#finding-the-knee-saturation-point--capacity-limits"

  - id: capacity-planning-and-load-management-021
    difficulty: advanced
    tags: [bottleneck, autoscaling-metric]
    question: |
      At the knee, you determine the binding constraint is a fixed 50-connection database pool,
      not CPU (which sits at 40%). What does this imply for autoscaling?
    options: ["Scaling app instances on CPU won't help — the real limit is the DB connection pool, so more app instances just contend for the same pool", "Scale on CPU as usual", "Disable autoscaling entirely", "Increase the CPU target to 90%"]
    answer: 0
    explanation: |
      The autoscaling metric must reflect the actual bottleneck. If the DB connection pool is the
      constraint, adding app instances scaled on CPU won't add goodput — they'll just queue on
      the pool. You must address the real limit (pool size, DB capacity) or scale on a signal
      that tracks it.
    ref: "concepts.md#finding-the-knee-saturation-point--capacity-limits"

  - id: capacity-planning-and-load-management-022
    difficulty: beginner
    tags: [autoscaling, reactive]
    question: |
      What is the fundamental limitation of purely reactive (threshold-based) autoscaling?
    options: ["It requires machine learning", "It can only scale down", "It always lags — it scales after load has already arrived and crossed a threshold, so it can't get ahead of a sudden spike", "It ignores CPU metrics"]
    answer: 2
    explanation: |
      Reactive autoscaling responds to current metrics crossing a threshold, so it inherently
      reacts after the load arrives. Combined with provisioning lag, it cannot pre-empt sudden
      spikes — hence scheduled/predictive scaling and standing headroom for known/sharp peaks.
    ref: "concepts.md#autoscaling-reactive-vs-predictive-vs-scheduled"

  - id: capacity-planning-and-load-management-023
    difficulty: intermediate
    tags: [autoscaling, scheduled]
    question: |
      You have a strongly diurnal traffic pattern with a predictable 08:00 ramp every weekday.
      Which autoscaling strategy warms capacity BEFORE the demand arrives?
    options: ["Reactive threshold scaling", "No autoscaling", "Vertical scaling only", "Scheduled scaling"]
    answer: 3
    explanation: |
      Scheduled scaling adds capacity on a calendar (e.g. scale out at 07:45 before the 08:00
      ramp), so capacity is ready ahead of predictable demand. Reactive scaling would only react
      once load is already climbing, lagging behind the ramp.
    ref: "concepts.md#autoscaling-reactive-vs-predictive-vs-scheduled"

  - id: capacity-planning-and-load-management-024
    difficulty: intermediate
    tags: [autoscaling, predictive]
    question: |
      What is the main weakness of predictive (ML-forecast) autoscaling?
    options: ["It cannot scale horizontally", "It is only as good as its forecast — it mispredicts novel or unprecedented events it has no pattern for", "It requires manual approval for every scale action", "It works only for batch jobs"]
    answer: 1
    explanation: |
      Predictive scaling anticipates recurring patterns by forecasting near-future demand, but a
      forecast can't foresee a truly novel event. That's why you combine predictive/scheduled for
      known patterns with reactive scaling as a safety net for the unexpected.
    ref: "concepts.md#autoscaling-reactive-vs-predictive-vs-scheduled"

  - id: capacity-planning-and-load-management-025
    difficulty: intermediate
    tags: [autoscaling, flapping]
    question: |
      What does a cooldown / stabilization window in autoscaling prevent, and what is the risk
      of setting it too long?
    options: ["Prevents overspending; risk is undercounting", "Prevents data loss; too long causes corruption", "Prevents flapping (rapid scale in/out oscillation); too long makes scaling sluggish to respond", "Prevents health-check failures; too long disables the LB"]
    answer: 2
    explanation: |
      A cooldown/stabilization window suppresses rapid oscillation (flapping) between scale-out
      and scale-in. Set it too short and the fleet thrashes; too long and it responds sluggishly
      to real demand changes. It's a responsiveness-vs-stability trade-off.
    ref: "concepts.md#autoscaling-reactive-vs-predictive-vs-scheduled"

  - id: capacity-planning-and-load-management-026
    difficulty: intermediate
    tags: [autoscaling, scale-in]
    question: |
      Why is the common guidance "scale out fast, scale in slow"?
    options: ["Removing capacity too aggressively can leave you short right before the next spike, causing an outage — while being slow to add capacity is riskier than being slow to remove it", "Scaling in is more expensive than scaling out", "Scaling in requires a full reboot", "Cloud providers charge extra for fast scale-in"]
    answer: 0
    explanation: |
      Under-provisioning causes outages, over-provisioning only costs money, so you add capacity
      eagerly and remove it cautiously. Aggressive scale-in risks tearing down capacity just
      before demand returns, so most policies decay slowly on the way down.
    ref: "concepts.md#autoscaling-reactive-vs-predictive-vs-scheduled"

  - id: capacity-planning-and-load-management-027
    difficulty: intermediate
    tags: [autoscaling, lag]
    question: |
      Why can't autoscaling alone protect against a spike that arrives in seconds?
    options: ["Cloud APIs are rate-limited", "Autoscaling only runs once per hour", "New instances are always broken", "There is a multi-minute provisioning lag (detect, decide, boot, bootstrap/warm, register) before new capacity serves traffic"]
    answer: 3
    explanation: |
      Scaling isn't instant: the pipeline of detect -> decide (cooldown) -> launch (boot) ->
      bootstrap (image pull, cache/JIT warmup) -> register (health checks + LB) typically takes
      minutes. A seconds-scale spike overwhelms you first, so you need standing headroom, warm
      pools, and load shedding to bridge the gap.
    ref: "concepts.md#autoscaling-isnt-instant-scale-up-lag--the-right-metric"

  - id: capacity-planning-and-load-management-028
    difficulty: intermediate
    tags: [autoscaling, warm-pools]
    question: |
      Which technique most directly reduces autoscaling scale-up lag?
    options: ["Increasing the cooldown window", "Warm pools / pre-provisioned already-booted instances kept ready to serve", "Scaling on a lagging metric", "Raising the target utilization to 95%"]
    answer: 1
    explanation: |
      Warm pools keep instances pre-booted and bootstrapped so registration is fast, cutting the
      minutes of boot + warmup out of the critical path. This shrinks the window during which you
      rely on standing headroom and load shedding.
    ref: "concepts.md#autoscaling-isnt-instant-scale-up-lag--the-right-metric"

  - id: capacity-planning-and-load-management-029
    difficulty: advanced
    tags: [autoscaling, queue, metric]
    question: |
      A fleet of workers consumes a message queue. Traffic spikes, the backlog grows, but
      consumer CPU stays moderate so CPU-based autoscaling never triggers. What metric should
      drive scaling instead?
    options: ["Queue backlog depth / age of the oldest message", "Consumer CPU utilization", "Number of running instances", "Network bytes out"]
    answer: 0
    explanation: |
      For queue consumers, the leading causal signal is the backlog itself — queue depth or age
      of the oldest message. Scaling on consumer CPU misses backlog growth when work is I/O-bound
      or the bottleneck is downstream. Scale on the backlog.
    ref: "concepts.md#autoscaling-isnt-instant-scale-up-lag--the-right-metric"

  - id: capacity-planning-and-load-management-030
    difficulty: advanced
    tags: [autoscaling, amplification, anti-pattern]
    question: |
      In what way can autoscaling AMPLIFY a failure instead of mitigating it?
    options: ["It can only ever help", "It compresses logs incorrectly", "If instances are crash-looping (e.g. OOM/bad deploy), rising per-instance load can trigger launching more instances that also crash; or a dependency outage drops traffic and it scales DOWN healthy capacity", "It always doubles cost"]
    answer: 2
    explanation: |
      Autoscaling reacts to signals it may misread. Crash-looping instances can look like "need
      more capacity," spawning more doomed instances; conversely, a dependency outage that lowers
      traffic can trigger scale-in that removes capacity you'll need on recovery. Guard with
      health checks, min/max bounds, and alarms on scaling activity.
    ref: "concepts.md#autoscaling-isnt-instant-scale-up-lag--the-right-metric"

  - id: capacity-planning-and-load-management-031
    difficulty: intermediate
    tags: [autoscaling, target-utilization]
    question: |
      Lowering the target utilization setpoint for a target-tracking autoscaler (say from 70% to
      50%) has what primary trade-off?
    options: ["More headroom and faster spike absorption, at higher cost (more idle capacity)", "It slows down every request", "It disables scale-in", "It has no effect on cost"]
    answer: 0
    explanation: |
      A lower target utilization keeps more spare capacity per instance, so the fleet can absorb
      spikes before the scaler catches up — but you run more instances than strictly needed,
      raising cost. It's the classic headroom cost-vs-risk lever.
    ref: "concepts.md#autoscaling-reactive-vs-predictive-vs-scheduled"

  - id: capacity-planning-and-load-management-032
    difficulty: intermediate
    tags: [overprovisioning, cost-risk]
    question: |
      How should you frame the decision of how much to overprovision?
    options: ["Always overprovision as much as possible", "Never overprovision", "Compare the cost of idle capacity against the expected loss = P(overload) x cost-of-an-outage; more headroom is rational when outages are very expensive", "Base it solely on CPU count"]
    answer: 2
    explanation: |
      Overprovisioning is insurance. Frame it as expected cost: idle-capacity cost vs
      P(overload) x cost-of-outage. When an outage is very expensive (revenue, trust, SLA
      penalties) lots of headroom is rational; for low-stakes systems, running lean is fine.
    ref: "concepts.md#overprovisioning-cost-vs-risk"

  - id: capacity-planning-and-load-management-033
    difficulty: advanced
    tags: [overprovisioning, cost-optimization]
    question: |
      Which tactic reduces the COST of headroom without meaningfully reducing safety?
    options: ["Removing all redundancy", "Turning off health checks", "Disabling load shedding", "Running the buffer capacity on cheaper spot/preemptible instances or a warm pool while baseline runs on-demand"]
    answer: 3
    explanation: |
      You can hold reserve capacity on cheaper spot/preemptible instances (or a warm pool) while
      baseline load runs on stable on-demand capacity. Combined with load shedding, multi-tenant
      bin-packing, and autoscaling, this keeps the safety margin while lowering its cost.
    ref: "concepts.md#overprovisioning-cost-vs-risk"

  - id: capacity-planning-and-load-management-034
    difficulty: advanced
    tags: [multi-tenancy, aggregation]
    question: |
      Why does bin-packing multiple services with uncorrelated demand onto shared capacity reduce
      total provisioning needs?
    options: ["It eliminates the need for headroom", "The aggregate peak of uncorrelated workloads is less than the sum of their individual peaks, so combined headroom is smaller", "It makes each service faster", "Correlated demand smooths better than uncorrelated"]
    answer: 1
    explanation: |
      When peaks don't line up in time, the sum of individual peaks overstates the combined peak.
      Aggregating uncorrelated demand smooths the curve, so the shared pool needs less total
      capacity and headroom than provisioning each service separately.
    ref: "concepts.md#overprovisioning-cost-vs-risk"

  - id: capacity-planning-and-load-management-035
    difficulty: intermediate
    tags: [demand-shaping, shed]
    question: |
      Demand suddenly exceeds capacity faster than you can add servers. Which demand-shaping
      lever best protects goodput for interactive traffic?
    options: ["Add an unbounded queue", "Increase timeouts to infinity", "Load shedding — reject excess requests fast (503/429) so accepted requests stay within SLO", "Retry every failed request immediately"]
    answer: 2
    explanation: |
      When you can't add capacity in time, shed excess load at the entry point so accepted
      requests stay healthy. A fast failure beats a slow one for interactive traffic, and
      shedding preserves goodput. See load-shedding-and-backpressure for the mechanics.
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-036
    difficulty: advanced
    tags: [queue, overload, anti-pattern]
    question: |
      A team adds a large in-memory queue in front of an overloaded service, expecting it to
      "handle the extra load." Under SUSTAINED overload (arrival rate > service rate), what
      actually happens?
    options: ["The queue grows without bound, latency climbs toward infinity, and the process eventually OOMs — a queue only smooths bursts, not sustained overload", "The queue permanently increases service capacity", "The queue automatically sheds the oldest requests", "Throughput doubles"]
    answer: 0
    explanation: |
      A queue converts overload into latency and memory growth, not into extra capacity. If
      arrivals stay above service rate, by Little's Law W -> infinity and the queue grows until
      OOM/timeout. Queues absorb bursts that fit within average capacity; sustained overload
      needs shedding or backpressure. Use bounded queues and treat full as a shed signal.
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-037
    difficulty: intermediate
    tags: [demand-shaping, prioritization]
    question: |
      When shedding load under overload, which traffic should you drop first?
    options: ["Whatever arrives first, regardless of type", "The highest-value requests, to save them for later", "All traffic equally", "Low-priority / best-effort work (background refreshes, prefetch, non-critical analytics), protecting high-value requests like checkout and auth"]
    answer: 3
    explanation: |
      Criticality-aware shedding preserves the most business value per unit of capacity: drop
      best-effort/background work first and protect critical paths (checkout, auth). Shedding
      blindly or dropping high-value traffic wastes the capacity you do have.
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-038
    difficulty: intermediate
    tags: [demand-shaping, rate-limit]
    question: |
      As a reliability (not abuse-prevention) mechanism, what is the main purpose of per-tenant
      rate limiting?
    options: ["To increase total system capacity", "To ensure fairness and stop one noisy tenant from consuming shared capacity and starving others", "To encrypt requests", "To replace load balancing"]
    answer: 1
    explanation: |
      From a reliability standpoint, per-tenant/per-client rate limiting enforces fairness and
      protects shared capacity so a single noisy tenant can't starve everyone else. (Abuse
      prevention is security's angle; limiter algorithms live in system-design/design-rate-limiter.)
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-039
    difficulty: beginner
    tags: [demand-shaping, levers]
    question: |
      Which set correctly lists the three main demand-shaping levers used in load management?
    options: ["Shed, queue, rate-limit", "Cache, compress, replicate", "Retry, timeout, fallback", "Encrypt, authenticate, authorize"]
    answer: 0
    explanation: |
      Demand shaping manages the demand side when it exceeds current capacity: shed (reject
      excess), queue/buffer (defer bursts), and rate-limit/throttle (cap per-client rate). Each
      trades something (errors, latency, or client back-off) to keep the system standing.
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-040
    difficulty: advanced
    tags: [littles-law, connection-pool]
    question: |
      A downstream dependency's latency (W) doubles from 20 ms to 40 ms while request arrival
      rate stays constant at 500 rps. By Little's Law, what happens to the number of concurrent
      in-flight requests (and thus connection/thread demand)?
    options: ["It halves", "It stays the same", "It doubles (from ~10 to ~20)", "It drops to zero"]
    answer: 2
    explanation: |
      L = lambda * W. With lambda fixed, doubling W doubles L: from 500 * 0.02 = 10 to
      500 * 0.04 = 20 in-flight requests. This is why a slow dependency silently exhausts thread
      and connection pools — the same rate now needs twice the concurrency.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-041
    difficulty: intermediate
    tags: [utilization, batch-vs-interactive]
    question: |
      Why can a batch/throughput-oriented pipeline safely run at 80-90% utilization while a
      latency-sensitive online service should target ~50-70%?
    options: ["Batch work tolerates queueing delay, so operating deep on the utilization curve is acceptable; latency-sensitive services can't tolerate the tail-latency explosion near saturation", "Batch systems have faster CPUs", "Batch systems don't use Little's Law", "Online services never queue"]
    answer: 0
    explanation: |
      The utilization wall punishes latency, not total work done. Batch jobs care about
      throughput and tolerate queue delay, so running hot is efficient. Interactive services must
      stay left of the knee to keep tail latency bounded, so they run cooler with more headroom.
    ref: "concepts.md#headroom-n1--n2-and-why-not-to-run-at-100"

  - id: capacity-planning-and-load-management-042
    difficulty: advanced
    tags: [headroom, deploys]
    question: |
      Beyond surviving failures and spikes, why does a service doing rolling deploys need extra
      headroom even in steady state?
    options: ["Deploys require doubling every instance", "Deploys run only at night", "A rolling deploy temporarily removes serving capacity (instances cycling out), so running at 100% leaves no room to lose those instances during the rollout", "Headroom has no relation to deploys"]
    answer: 2
    explanation: |
      Rolling deploys take a fraction of instances out of service while they update, transiently
      reducing capacity. If you're already at 100%, that reduction pushes the survivors over the
      cliff. Headroom absorbs the deploy-time capacity dip as well as failures and spikes.
    ref: "concepts.md#headroom-n1--n2-and-why-not-to-run-at-100"

  - id: capacity-planning-and-load-management-043
    difficulty: intermediate
    tags: [redundancy, notation]
    question: |
      What does "2N" redundancy mean compared to "N+1"?
    options: ["2N tolerates one failure; N+1 tolerates two", "They are identical", "2N means half the capacity of N", "2N is a full duplicate of the capacity (survives losing an entire set/site); N+1 is one spare unit beyond peak need"]
    answer: 3
    explanation: |
      N+1 adds a single spare unit (tolerates losing one unit). 2N provisions a full duplicate of
      N, so it can survive losing an entire set or site — far more expensive, used for high-tier
      DR/data-center designs (sometimes 2(N+1)).
    ref: "concepts.md#headroom-n1--n2-and-why-not-to-run-at-100"

  - id: capacity-planning-and-load-management-044
    difficulty: advanced
    tags: [forecasting, accuracy]
    question: |
      Why should a capacity team track forecast ACCURACY as an ongoing metric?
    options: ["To assign blame after outages", "Chronic under-forecasting means you'll be caught short (outages); chronic over-forecasting wastes money — feeding misses back improves the next cycle's model", "Forecasts never need review once set", "It replaces load testing"]
    answer: 1
    explanation: |
      Systematic bias in either direction is costly: under-forecasting causes overload,
      over-forecasting wastes spend. Treating forecast error as a tracked metric and feeding it
      back into the model keeps provisioning aligned with real demand over time.
    ref: "concepts.md#forecasting-demand-organic-growth-events--seasonality"

  - id: capacity-planning-and-load-management-045
    difficulty: advanced
    tags: [littles-law, capacity-derivation]
    question: |
      You must serve 5,000 rps at a mean latency of 40 ms, and each server can hold 50 concurrent
      requests before queueing. Ignoring extra headroom, how many servers do you need (by Little's
      Law)?
    options: ["2", "10", "4", "100"]
    answer: 2
    explanation: |
      Total in-flight L = lambda * W = 5000 * 0.04 = 200 concurrent requests. Each server handles
      50 concurrently, so 200 / 50 = 4 servers minimum. You'd then add headroom for failures,
      spikes, and the utilization wall on top of this baseline.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-046
    difficulty: intermediate
    tags: [load-testing, environment]
    question: |
      Why do Google SRE and others prefer load testing in production (or a truly prod-like
      environment) rather than a scaled-down staging setup?
    options: ["A scaled-down environment has different bottlenecks (cache sizes, connection limits, data volumes), so its results don't predict production behavior", "Staging is more expensive", "Production testing never causes incidents", "Staging can't run load tools"]
    answer: 0
    explanation: |
      Scaled-down environments hit different bottlenecks — smaller caches, fewer connections, less
      data — so their capacity numbers don't transfer. Testing in prod (carefully, with shedding
      and abort criteria) or a faithfully prod-like environment gives results you can trust.
    ref: "concepts.md#load-testing-load-vs-stress-vs-soak-vs-spike"

  - id: capacity-planning-and-load-management-047
    difficulty: advanced
    tags: [launch, scenario, preparation]
    question: |
      A launch is expected to 3x traffic at a known time. Which preparation plan is most complete?
    options: ["Turn on reactive autoscaling and hope it keeps up", "Only add more caching", "Increase all timeouts and add retries", "Take the top-down forecast, load/stress test to 3x, pre-scale via scheduled scaling + warm pools, verify downstream dependencies also scale, and keep load shedding + a runbook ready"]
    answer: 3
    explanation: |
      A launch is a predictable inorganic event, so you forecast top-down, load/stress test to the
      target, pre-provision (scheduled scaling + warm pools) so capacity is ready before the
      spike, confirm dependencies scale too, and keep shedding + a runbook as backstops. Reactive
      autoscaling alone can't beat scale-up lag for a sharp, timed spike.
    ref: "concepts.md#autoscaling-isnt-instant-scale-up-lag--the-right-metric"

  - id: capacity-planning-and-load-management-048
    difficulty: expert
    tags: [scenario, tail-latency, coordinated-omission]
    question: |
      Your load test (closed-loop, single-machine generator, 1 thread per virtual user) reports
      p99 of 8 ms at target load, but production p99 is 400 ms at the same rate. The service is
      known to GC-pause ~200 ms occasionally. What is the most likely diagnosis?
    options: ["Production hardware is 50x slower", "Coordinated omission — the generator paused sending during GC stalls, omitting the queued requests that would have shown the ~200 ms+ tail", "The SLO is misconfigured", "Network latency in production is 400 ms"]
    answer: 1
    explanation: |
      A closed-loop generator waiting on responses stops issuing requests during a 200 ms GC
      pause, so it never records the pile-up of requests that would have queued behind it in
      production. That hides the tail — classic coordinated omission. Re-test with wrk2/open-model
      or HdrHistogram correction to see the true ~200 ms+ p99.
    ref: "concepts.md#coordinated-omission-the-load-test-measurement-trap"

  - id: capacity-planning-and-load-management-049
    difficulty: expert
    tags: [scenario, headroom, dependency]
    question: |
      A downstream dependency you call synchronously starts responding 5x slower during an
      incident, but its error rate is 0%. Your own service's thread pool saturates and it begins
      timing out. Through the capacity lens, what happened?
    options: ["By Little's Law, 5x higher W at the same arrival rate needs 5x more concurrent threads; the fixed pool couldn't absorb it, so requests queued and timed out — the slowdown consumed your concurrency headroom", "Your CPU ran out", "The dependency returned corrupt data", "DNS failed"]
    answer: 0
    explanation: |
      L = lambda * W: when W jumps 5x at constant arrival rate, in-flight requests jump 5x,
      exhausting a fixed thread/connection pool. This is how a slow (not failing) dependency
      causes a cascading failure. Mitigations: timeouts, bulkheads, circuit breakers, and shedding
      (see circuit-breakers-and-bulkheads and cascading-failures-and-antipatterns).
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-050
    difficulty: intermediate
    tags: [effective-capacity, definitions]
    question: |
      What does "effective / redundant capacity" refer to?
    options: ["The raw capacity on the invoice", "The theoretical maximum a CPU can do", "Usable capacity remaining AFTER subtracting what must survive the loss of a failure domain (a node or AZ)", "The capacity of the load balancer alone"]
    answer: 2
    explanation: |
      Effective/redundant capacity is usable capacity minus the reserve needed to tolerate losing
      a failure domain. It's the number that matters when you commit to a redundancy target
      (N+1/N+2/2N), because you must still serve peak after a failure.
    ref: "concepts.md#provisioned-vs-usable-capacity"

  - id: capacity-planning-and-load-management-051
    difficulty: advanced
    tags: [utilization-wall, parallelism]
    question: |
      Does adding more parallel servers (M/M/c instead of M/M/1) eliminate the latency-vs-
      utilization cliff?
    options: ["No — parallelism softens/pushes out the knee but the response-time curve still rises steeply as aggregate utilization approaches 100%", "Yes, with enough servers latency stays flat at 100%", "Yes, if all servers are identical", "No, parallelism makes latency worse at all utilizations"]
    answer: 0
    explanation: |
      More servers (M/M/c) smooth the knee and let you run somewhat hotter for the same latency,
      but they don't remove the fundamental 1/(1-rho)-style divergence — as aggregate utilization
      nears 100%, queueing delay still explodes. Headroom is still required.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-052
    difficulty: intermediate
    tags: [load-testing, volume]
    question: |
      What does a volume test stress, as opposed to a load or spike test?
    options: ["Request rate over time", "Network jitter", "Large data volumes — big tables, large payloads, high row counts — rather than high request rate", "Number of concurrent deployments"]
    answer: 2
    explanation: |
      A volume test exercises the system against large amounts of data (big tables, large
      payloads) rather than a high request rate. It surfaces problems like slow queries on big
      tables, pagination limits, and memory blowups on large payloads.
    ref: "concepts.md#load-testing-load-vs-stress-vs-soak-vs-spike"

  - id: capacity-planning-and-load-management-053
    difficulty: expert
    tags: [scenario, autoscaling, shedding]
    question: |
      During a genuine flash crowd (traffic 4x in ~10 seconds), which combination keeps the
      service standing given multi-minute scale-up lag?
    options: ["Rely solely on reactive autoscaling", "Add an unbounded queue and wait", "Increase timeouts so requests don't fail", "Load shed the excess immediately to protect goodput while standing headroom and warm-pool capacity absorb load and autoscaling catches up"]
    answer: 3
    explanation: |
      Autoscaling can't provision in 10 seconds. You shed the excess right away (protecting the
      requests you accept), lean on standing headroom + warm pools to absorb the immediate surge,
      and let autoscaling add durable capacity over the next minutes. Queues/longer timeouts just
      defer collapse.
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-054
    difficulty: advanced
    tags: [scale-in, dependency-outage, anti-pattern]
    question: |
      A dependency outage causes your service's incoming traffic to drop sharply (clients give
      up). Your CPU-based autoscaler responds by scaling in. Why is this dangerous?
    options: ["Scaling in saves too little money", "When the dependency recovers, retried/backed-up traffic surges back, but you've torn down the capacity needed to serve it — causing a second outage on recovery", "Scaling in corrupts data", "It has no downside"]
    answer: 1
    explanation: |
      Low traffic during an upstream outage isn't low demand — it's suppressed demand. Scaling in
      on it removes capacity, and when the dependency recovers the pent-up + retry surge hits a
      shrunken fleet, triggering a recovery-time outage. Guard scale-in with min bounds and
      awareness of dependency health.
    ref: "concepts.md#autoscaling-isnt-instant-scale-up-lag--the-right-metric"

  - id: capacity-planning-and-load-management-055
    difficulty: intermediate
    tags: [littles-law, definitions]
    question: |
      In Little's Law L = lambda x W, what does each term represent?
    options: ["L = latency, lambda = load balancer count, W = width", "L = log rate, lambda = lambda functions, W = workers", "L = average number of requests in the system, lambda = average arrival rate, W = average time a request spends in the system", "L = latency budget, lambda = SLO, W = window"]
    answer: 2
    explanation: |
      L is the average number in the system (in service + waiting), lambda is the arrival rate,
      and W is the average time spent in the system (including queue wait). It holds for any
      stable system regardless of arrival distribution — the workhorse of capacity math.
    ref: "concepts.md#littles-law-and-the-utilization-wall"

  - id: capacity-planning-and-load-management-056
    difficulty: advanced
    tags: [growth, compounding]
    question: |
      Demand grows 10% per month, compounding. Approximately what multiple is peak demand after
      a year?
    options: ["About 3.1x", "1.1x", "1.2x", "12x"]
    answer: 0
    explanation: |
      1.10^12 is approximately 3.14, so demand roughly triples in a year at 10%/month. This is why
      seemingly modest monthly growth rates force frequent capacity reviews and can outrun manual
      provisioning cycles.
    ref: "concepts.md#forecasting-demand-organic-growth-events--seasonality"

  - id: capacity-planning-and-load-management-057
    difficulty: intermediate
    tags: [bounded-queue, backpressure]
    question: |
      What is the correct way to use a queue in front of a capacity-constrained service?
    options: ["Make it unbounded so nothing is ever rejected", "Set it to exactly one item", "Disable it during peaks", "Bound it, and treat a full queue as a shed signal (reject/apply backpressure) so it smooths bursts without becoming an OOM countdown"]
    answer: 3
    explanation: |
      Bounded queues absorb short bursts that fit within average capacity; when the queue fills,
      that's the signal to shed or apply backpressure. Unbounded queues just convert sustained
      overload into unbounded latency and eventual OOM. See load-shedding-and-backpressure.
    ref: "concepts.md#demand-shaping-shed-queue-rate-limit"

  - id: capacity-planning-and-load-management-058
    difficulty: expert
    tags: [scenario, utilization-target, judgment]
    question: |
      An interviewer asks "what utilization target should we run at?" What is the best answer?
    options: ["Always 80%", "It depends — weigh cost of an outage vs cost of idle capacity, demand spikiness, autoscaling speed, and shedding ability; latency-sensitive revenue services with slow scaling want more headroom, batch pipelines can run hotter", "Always 50%", "Whatever the vendor default is"]
    answer: 1
    explanation: |
      There's no universal number. The signal an interviewer wants is the reasoning: balance
      outage cost vs idle cost, factor in spikiness, autoscaling latency, and whether you can shed
      load. A slow-to-scale, latency-sensitive revenue service wants generous headroom; a batch
      pipeline tolerates high utilization.
    ref: "concepts.md#overprovisioning-cost-vs-risk"
