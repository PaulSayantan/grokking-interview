topic: "SLOs, Error Budgets & the Reliability–Velocity Tradeoff"
domain: reliability-ops
topic_slug: slos-error-budgets-and-velocity-tradeoff
version: 1
questions:
- id: slos-error-budgets-and-velocity-tradeoff-001
  difficulty: beginner
  tags: [sli, definitions]
  question: |
    What does an SLI (Service Level Indicator) represent?
  options:
  - "A contractual promise to customers with financial penalties"
  - "A quantitative measurement of some aspect of the service level being provided"
  - "The internal target you commit to for reliability"
  - "The amount of unreliability you are allowed to have"
  answer: 1
  explanation: |
    An SLI is the *measurement* — a number (usually a ratio of good to valid events) that
    reflects an aspect of service, like request success rate or latency. The target for that
    number is the SLO, the contract is the SLA, and the leftover is the error budget.
  ref: "concepts.md#sli--the-service-level-indicator"

- id: slos-error-budgets-and-velocity-tradeoff-002
  difficulty: beginner
  tags: [slo, definitions]
  question: |
    Which three components fully specify an SLO?
  options:
  - "A dashboard, an alert, and an on-call rotation"
  - "A contract, a penalty, and a customer"
  - "A metric, a log, and a trace"
  - "An SLI, a target value, and a time window"
  answer: 3
  explanation: |
    A complete SLO is "an SLI (what is measured) hits a target (the threshold) over a window
    (the evaluation period)" — e.g. "99.9% of requests succeed in < 300 ms over 28 days."
    Missing any of the three leaves the objective ambiguous.
  ref: "concepts.md#slo--the-service-level-objective"

- id: slos-error-budgets-and-velocity-tradeoff-003
  difficulty: beginner
  tags: [sla, definitions]
  question: |
    What primarily distinguishes an SLA from an SLO?
  options:
  - "An SLA is measured server-side while an SLO is measured client-side"
  - "An SLA is always stricter than the SLO"
  - "An SLA is a contract with consequences (e.g. credits/refunds) for meeting or missing targets"
  - "An SLA has no time window while an SLO does"
  answer: 2
  explanation: |
    An SLA is an explicit/implicit contract with users that includes consequences — usually
    financial (service credits) or reputational. The SLO is the internal engineering target.
    The SLA is deliberately looser than the SLO, not stricter.
  ref: "concepts.md#sla--the-service-level-agreement-contract"

- id: slos-error-budgets-and-velocity-tradeoff-004
  difficulty: beginner
  tags: [sla, slo, strictness]
  question: |
    For a well-designed service, how should the SLA target relate to the internal SLO target?
  options:
  - "The SLA should be looser (lower) than the SLO"
  - "The SLA should be stricter (higher) than the SLO"
  - "They should always be identical"
  - "The SLA should be set to 100%"
  answer: 0
  explanation: |
    The SLA is always looser than the SLO. If the SLA promises 99.9%, you run an internal SLO
    of, say, 99.95% so you get an early-warning buffer — you're paging and fixing before you
    breach the contract and owe customers money.
  ref: "concepts.md#sla--the-service-level-agreement-contract"

- id: slos-error-budgets-and-velocity-tradeoff-005
  difficulty: beginner
  tags: [error-budget, math]
  question: |
    A service has an SLO of 99.9%. What is its error budget?
  options:
  - "9.9%"
  - "1%"
  - "0.01%"
  - "0.1%"
  answer: 3
  explanation: |
    Error budget = 100% − SLO = 100% − 99.9% = 0.1%. That's the fraction of requests (or time)
    that is allowed to fail before the objective is missed.
  ref: "concepts.md#error-budget--the-leftover-and-the-math"

- id: slos-error-budgets-and-velocity-tradeoff-006
  difficulty: intermediate
  tags: [error-budget, math, nines]
  question: |
    Approximately how much downtime per year does a 99.9% ("three nines") availability target allow?
  options:
  - "About 8.8 hours"
  - "About 5 minutes"
  - "About 52 minutes"
  - "About 3.65 days"
  answer: 0
  explanation: |
    Three nines = 0.1% of a year unavailable ≈ 8.76 hours/year (≈ 43 min/month). Five nines ≈
    5 min/yr, four nines ≈ 52 min/yr, two nines ≈ 3.65 days/yr. A useful anchor: each extra nine
    divides downtime by 10.
  ref: "concepts.md#error-budget--the-leftover-and-the-math"

- id: slos-error-budgets-and-velocity-tradeoff-007
  difficulty: intermediate
  tags: [error-budget, math, nines]
  question: |
    Roughly how much downtime per year does 99.99% ("four nines") allow?
  options:
  - "About 52 minutes"
  - "About 8.8 hours"
  - "About 5 minutes"
  - "About 26 seconds"
  answer: 0
  explanation: |
    Four nines = 0.01% of a year ≈ 52.6 minutes/year (≈ 4.4 min/month). Going from three nines
    (8.8 h) to four nines (52 min) is a 10× reduction in allowed downtime — and roughly a 10×
    increase in cost.
  ref: "concepts.md#error-budget--the-leftover-and-the-math"

- id: slos-error-budgets-and-velocity-tradeoff-008
  difficulty: intermediate
  tags: [error-budget, math]
  question: |
    A service serves 10,000,000 valid requests over the SLO window and targets 99.95%. How many
    failed requests can it tolerate before missing the SLO?
  options:
  - "500"
  - "5,000"
  - "50,000"
  - "100,000"
  answer: 1
  explanation: |
    Allowed errors = (1 − SLO) × total = 0.0005 × 10,000,000 = 5,000. Request-based budgets
    convert the SLO fraction directly into a count of tolerable bad events.
  ref: "concepts.md#error-budget--the-leftover-and-the-math"

- id: slos-error-budgets-and-velocity-tradeoff-009
  difficulty: advanced
  tags: [velocity-tradeoff, error-budget, judgment]
  question: |
    Under the error-budget model, what does having budget remaining primarily *entitle* a team to do?
  options:
  - "Reduce monitoring because things are healthy"
  - "Spend it on velocity — ship features faster, run experiments, take calculated risk"
  - "Immediately raise the SLO target"
  - "Turn off canary deployments to move faster"
  answer: 1
  explanation: |
    The core insight: the error budget is a currency you *spend* on velocity and risk. Budget
    remaining means you have room to ship fast, roll out aggressively, and experiment. It does
    not mean cut monitoring or skip safe-deploy practices.
  ref: "concepts.md#error-budget-as-currency--the-reliabilityvelocity-tradeoff"

- id: slos-error-budgets-and-velocity-tradeoff-010
  difficulty: advanced
  tags: [velocity-tradeoff, policy, scenario]
  question: |
    It's mid-quarter, 90% of the error budget is burned, and product wants a risky feature launch
    Friday. What is the SRE-aligned response?
  options:
  - "Refuse all future launches permanently to protect reliability"
  - "Let it launch — SLOs are advisory and shouldn't block product"
  - "Immediately lower the SLO so the budget is no longer burned"
  - "Follow the pre-agreed error-budget policy: hold risky launches / require flagged or slow-canary rollout until budget recovers"
  answer: 3
  explanation: |
    The value of the model is that the decision is pre-negotiated. The error-budget policy —
    agreed in advance — dictates the action (e.g. no risky launches, dark-launch behind a flag,
    slow canary with instant rollback) so it isn't a political fight during the crunch.
  ref: "concepts.md#error-budget-as-currency--the-reliabilityvelocity-tradeoff"

- id: slos-error-budgets-and-velocity-tradeoff-011
  difficulty: intermediate
  tags: [hundred-percent, judgment]
  question: |
    Why is 100% generally the wrong reliability target?
  options:
  - "It is illegal to promise 100% in an SLA"
  - "Cost rises ~10x per nine, users can't perceive it, and it zeroes the budget so you can never change the system"
  - "Monitoring tools cannot measure values above 99.99%"
  - "Because 100% would violate the CAP theorem"
  answer: 1
  explanation: |
    100% is the wrong goal because each nine costs ~10x more, users can't tell (their own ISP/
    device is less reliable), and a zero budget means zero tolerance for change — no deploys,
    no experiments. A non-zero budget is precisely what buys the freedom to change the system.
  ref: "concepts.md#why-100-is-the-wrong-target"

- id: slos-error-budgets-and-velocity-tradeoff-012
  difficulty: intermediate
  tags: [burn-rate, concept]
  question: |
    What does a burn rate of 1 mean?
  options:
  - "You are consuming the budget at exactly the pace that spends all of it by the end of the SLO window"
  - "The budget is already exhausted"
  - "There are no errors at all"
  - "The error rate equals 1% of requests"
  answer: 0
  explanation: |
    Burn rate is a multiplier: observed error rate divided by the rate that would exactly
    exhaust the budget over the window. Burn rate 1 = on pace to spend the whole budget at the
    window's end. Burn rate 2 spends it in half the window; 10 in a tenth.
  ref: "concepts.md#burn-rate--the-concept"

- id: slos-error-budgets-and-velocity-tradeoff-013
  difficulty: advanced
  tags: [burn-rate, math]
  question: |
    An SLO of 99.9% over 30 days is in place (0.1% budget). The service is currently erroring at
    1%. What is the burn rate, and roughly how long until the budget is gone?
  options:
  - "Burn rate 1; budget lasts the full 30 days"
  - "Burn rate 0.1; budget lasts ~300 days"
  - "Burn rate 10; budget gone in ~3 days"
  - "Burn rate 100; budget gone in a few hours"
  answer: 2
  explanation: |
    Burn rate = observed error rate / allowed error rate = 1% / 0.1% = 10x. At 10x pace, a
    30-day budget is consumed in 30/10 = 3 days. That's an emergency-level burn worthy of a page.
  ref: "concepts.md#burn-rate--the-concept"

- id: slos-error-budgets-and-velocity-tradeoff-014
  difficulty: intermediate
  tags: [sli, latency, anti-pattern]
  question: |
    Why is the *average* (mean) latency a poor choice for a latency SLI?
  options:
  - "Averages are too expensive to compute at scale"
  - "Averages cannot be stored in time-series databases"
  - "The mean always overstates how slow the service is"
  - "The mean hides the tail — a small fraction of very slow requests that users actually suffer"
  answer: 3
  explanation: |
    A mean is dominated by the bulk of fast requests and hides the slow tail. Latency SLIs
    should use a high percentile (p99) or a threshold count ("% of requests under 300 ms") so
    they reflect the users who are actually experiencing slowness.
  ref: "concepts.md#sli--the-service-level-indicator"

- id: slos-error-budgets-and-velocity-tradeoff-015
  difficulty: intermediate
  tags: [sli, good-events, valid-events]
  question: |
    A client sends a malformed request and gets a 400 response. How should this typically be
    treated in an availability SLI?
  options:
  - "Counted as a failed (bad) event, hurting the SLI"
  - "Counted as a good event, improving the SLI"
  - "Excluded from valid events, so it doesn't count against the SLI"
  - "It triggers an immediate feature freeze"
  answer: 2
  explanation: |
    A 4xx caused by a client's malformed request isn't the service's fault, so it's usually
    excluded from the 'valid events' denominator. Counting client errors against your
    availability SLI would punish you for your callers' bugs.
  ref: "concepts.md#sli--the-service-level-indicator"

- id: slos-error-budgets-and-velocity-tradeoff-016
  difficulty: advanced
  tags: [sli, choosing, happiness-test]
  question: |
    What is the "happiness test" for choosing an SLO target?
  options:
  - "Set the target to whatever makes the on-call engineer sleep best"
  - "Set the target to the highest number the infrastructure can achieve"
  - "Set the target to match the biggest competitor's SLA"
  - "Set the target at the point where users are just happy — below it they notice and are annoyed, above it they can't tell the difference"
  answer: 3
  explanation: |
    The ideal target is the point where users are *just* happy: dip below and they notice;
    exceed it and the improvement is imperceptible. This frames the SLO around real user
    experience, not internal round numbers or maximal achievable reliability.
  ref: "concepts.md#choosing-good-slis--the-happiness-test-and-requestresponse-ratio"

- id: slos-error-budgets-and-velocity-tradeoff-017
  difficulty: intermediate
  tags: [sli, choosing, anti-pattern]
  question: |
    Why is CPU utilization a poor choice for an SLI?
  options:
  - "CPU can't be measured accurately in containers"
  - "It's a cause/saturation signal, not something the user experiences — users care whether requests succeed and are fast"
  - "CPU utilization is always 100% in production"
  - "It changes too slowly to be useful"
  answer: 1
  explanation: |
    SLIs should map to user-visible symptoms (success, latency, correctness). CPU is a
    saturation/cause signal — useful for diagnosis, but a user doesn't care about your CPU. Good
    SLIs measure what the user actually experiences.
  ref: "concepts.md#choosing-good-slis--the-happiness-test-and-requestresponse-ratio"

- id: slos-error-budgets-and-velocity-tradeoff-018
  difficulty: advanced
  tags: [user-journey, dependency-math]
  question: |
    A checkout journey calls 5 microservices in series, each independently at 99.9% availability.
    What is the approximate end-to-end availability of the journey?
  options:
  - "99.9%"
  - "About 99.99%"
  - "About 99.5%"
  - "About 95%"
  answer: 2
  explanation: |
    For a serial chain, end-to-end availability ≈ a^N = 0.999^5 ≈ 0.995 = 99.5% — worse than
    any single link. This is why deep dependency chains erode reliability and why you budget at
    the user-journey level, not per endpoint.
  ref: "concepts.md#user-journey-slos"

- id: slos-error-budgets-and-velocity-tradeoff-019
  difficulty: intermediate
  tags: [user-journey, prioritization, judgment]
  question: |
    Your health-check endpoint is at 99.99% but the checkout flow is at 99%. Where should SLO
    attention go?
  options:
  - "The health-check endpoint, since it's easiest to keep high"
  - "The critical user journey (checkout), because that's where the user's money and patience are"
  - "Neither — average them and report 99.5%"
  - "Raise the health-check SLO to 99.999%"
  answer: 1
  explanation: |
    Prioritize SLOs on the critical user journeys. A near-perfect health check is worthless if
    the flow that generates revenue is at 99%. Budget where the user-visible outcome and business
    value actually live.
  ref: "concepts.md#user-journey-slos"

- id: slos-error-budgets-and-velocity-tradeoff-020
  difficulty: advanced
  tags: [policy, enforcement]
  question: |
    What is the defining characteristic of an effective error-budget policy?
  options:
  - "It is agreed and signed off in advance by engineering, product, and leadership, and triggers actions automatically based on budget state"
  - "It is written by SRE alone and kept private"
  - "It only applies to product teams, never to SRE"
  - "It lets any VP override the freeze during a launch"
  answer: 0
  explanation: |
    A good policy is pre-agreed and executive-backed, automatic (the budget state triggers the
    action, not opinion), applies to everyone including SRE, and names emergency exceptions. Its
    whole value is that the freeze isn't debated during a crisis.
  ref: "concepts.md#error-budget-policy--what-happens-when-it-burns"

- id: slos-error-budgets-and-velocity-tradeoff-021
  difficulty: intermediate
  tags: [policy, exhausted, scenario]
  question: |
    The error budget is fully exhausted (SLO missed). Under a typical error-budget policy, what
    happens?
  options:
  - "The team continues shipping features at normal pace"
  - "A feature freeze: only reliability fixes and rollbacks ship until the budget recovers"
  - "The SLA is automatically loosened"
  - "The service is shut down"
  answer: 1
  explanation: |
    Exhausted budget typically triggers a feature freeze — only reliability work, fixes, and
    rollbacks proceed until the budget recovers, plus a postmortem on the burn. Emergency/security
    changes remain a named exception.
  ref: "concepts.md#error-budget-policy--what-happens-when-it-burns"

- id: slos-error-budgets-and-velocity-tradeoff-022
  difficulty: advanced
  tags: [policy, over-budget, judgment]
  question: |
    A service consistently *beats* its SLO by a wide margin every month. What does the model
    suggest this means?
  options:
  - "The team is doing everything right and should keep the status quo"
  - "The SLO should immediately be raised toward 100%"
  - "The monitoring is broken"
  - "Reliability is over-invested / velocity is too low — ship faster or lower the SLO to reclaim the budget"
  answer: 3
  explanation: |
    An unspent budget is wasted velocity. Persistently beating the SLO by a wide margin signals
    over-investment in reliability — the team should either ship faster (spend the budget) or
    lower the SLO. The point of a budget is to be spent, not hoarded.
  ref: "concepts.md#error-budget-policy--what-happens-when-it-burns"

- id: slos-error-budgets-and-velocity-tradeoff-023
  difficulty: intermediate
  tags: [error-budget, math]
  question: |
    For an SLO of 99.95% measured over a 30-day month, approximately how much downtime is allowed?
  options:
  - "About 4.3 minutes"
  - "About 43.2 minutes"
  - "About 21.6 minutes"
  - "About 2.2 hours"
  answer: 2
  explanation: |
    Budget = 0.05%. Allowed downtime ≈ 0.0005 × 30 days = 0.015 days ≈ 21.6 minutes/month. (For
    reference: 99.9% → ~43.2 min/month, 99.99% → ~4.3 min/month.)
  ref: "concepts.md#error-budget--the-leftover-and-the-math"

- id: slos-error-budgets-and-velocity-tradeoff-024
  difficulty: intermediate
  tags: [slo, window, rolling]
  question: |
    Why do SRE teams often prefer a rolling 28-day SLO window over a calendar month?
  options:
  - "Rolling windows are cheaper to compute"
  - "Calendar months are not supported by monitoring tools"
  - "It keeps the day-of-week traffic mix constant and avoids the month-end 'budget resets' cliff that tempts risky gambles"
  - "28 days is legally required for SLAs"
  answer: 2
  explanation: |
    A rolling 28-day (four-week) window keeps the weekday/weekend distribution constant and
    avoids the calendar-reset cliff where a team gambles the remaining budget at month-end
    knowing it resets on the 1st. Longer windows are steadier but slower to react.
  ref: "concepts.md#slo--the-service-level-objective"

- id: slos-error-budgets-and-velocity-tradeoff-025
  difficulty: beginner
  tags: [sli, ratio]
  question: |
    What is the canonical form Google recommends for expressing an SLI?
  options:
  - "Total error count over the window"
  - "The mean response time in milliseconds"
  - "CPU seconds consumed per request"
  - "The ratio of good events to valid events, as a percentage"
  answer: 3
  explanation: |
    The recommended SLI form is good events / valid events × 100%. It is naturally bounded 0–100%,
    aggregates cleanly, and 100% always means perfect. Absolute counts and means lack these
    properties.
  ref: "concepts.md#sli--the-service-level-indicator"

- id: slos-error-budgets-and-velocity-tradeoff-026
  difficulty: advanced
  tags: [sla, business, judgment]
  question: |
    Which statement about SLAs is correct?
  options:
  - "Every service must have an SLA"
  - "An SLA is set stricter than the SLO to be safe"
  - "SLAs are measured but never have consequences"
  - "Internal services often have SLOs but no SLA, because there's no external customer to compensate"
  answer: 3
  explanation: |
    Not every service needs an SLA. Internal services commonly have SLOs but no SLA — there's no
    external party to owe credits. Public services usually do publish SLAs (with consequences),
    set looser than internal SLOs.
  ref: "concepts.md#sla--the-service-level-agreement-contract"

- id: slos-error-budgets-and-velocity-tradeoff-027
  difficulty: advanced
  tags: [burn-rate, alerting, cross-ref]
  question: |
    Why do reliability teams alert on error budget using *multiple* burn-rate thresholds over
    *multiple* windows (e.g. a fast burn and a slow burn)?
  options:
  - "To be both sensitive (catch fast, severe burns quickly) and precise (avoid paging on minor slow burns), reducing alert fatigue"
  - "To increase the total number of alerts fired"
  - "Because single-window alerts are not mathematically possible"
  - "Only to satisfy compliance auditors"
  answer: 0
  explanation: |
    A fast burn over a short window should page immediately; a mild burn over a long window is a
    ticket, not a 3am page. Multi-window multi-burn-rate alerting achieves sensitivity and
    precision together. The concrete rule mechanics live in observability
    (slo-based-alerting-and-error-budgets).
  ref: "concepts.md#burn-rate--the-concept"

- id: slos-error-budgets-and-velocity-tradeoff-028
  difficulty: expert
  tags: [burn-rate, math]
  question: |
    With a 30-day window and a 99.9% SLO, an alert is configured to fire when a 1-hour burn rate
    reaches 14.4x. What fraction of the entire 30-day budget does 1 hour of burning at 14.4x consume?
  options:
  - "About 0.5%"
  - "About 20%"
  - "About 50%"
  - "About 2%"
  answer: 3
  explanation: |
    One hour is 1/720 of a 30-day month. Burning at 14.4x consumes 14.4/720 = 0.02 = 2% of the
    total budget in that hour. (14.4x/1h and 6x/6h are the classic Google fast/slow burn pair.)
    The alert-rule derivation itself belongs to observability.
  ref: "concepts.md#burn-rate--the-concept"

- id: slos-error-budgets-and-velocity-tradeoff-029
  difficulty: intermediate
  tags: [velocity-tradeoff, culture]
  question: |
    In the error-budget model, how should a missed SLO be interpreted?
  options:
  - "As a moral failure requiring someone to be blamed"
  - "As a data-driven signal to slow down and prioritize reliability, not a blame event"
  - "As a reason to immediately lower the SLA"
  - "As proof the monitoring is misconfigured"
  answer: 1
  explanation: |
    A missed SLO is a signal to slow down and invest in reliability — objective and blameless.
    The budget makes the reliability-vs-velocity decision data-driven, replacing political
    arguments with a shared number.
  ref: "concepts.md#error-budget-as-currency--the-reliabilityvelocity-tradeoff"

- id: slos-error-budgets-and-velocity-tradeoff-030
  difficulty: advanced
  tags: [sli, measurement, judgment]
  question: |
    Why does measuring an SLI as close to the user as possible (e.g. at the load balancer or via
    client-side probes) matter?
  options:
  - "It reduces the number of metrics you must store"
  - "It is required to compute the error budget"
  - "Server-side 200 counts miss load-balancer errors, DNS failures, and client timeouts that the user still experiences as failures"
  - "Client-side measurement is always cheaper"
  answer: 2
  explanation: |
    A server-only success count misses failures that happen before the request reaches the app —
    LB errors, DNS issues, connection resets, client-side timeouts. Measuring nearer the user
    captures more of the real experience, at the cost of harder attribution.
  ref: "concepts.md#sli--the-service-level-indicator"

- id: slos-error-budgets-and-velocity-tradeoff-031
  difficulty: intermediate
  tags: [availability-latency, slo-design]
  question: |
    Why is it common to define a latency SLO with *two* targets, e.g. "90% < 100 ms AND 99% < 300 ms"?
  options:
  - "To pin both the typical experience and the tail without relying on a single overly-strict threshold"
  - "To make the SLO harder to pass on purpose"
  - "Because monitoring tools require two thresholds"
  - "To average the two percentiles together"
  answer: 0
  explanation: |
    A single threshold either ignores the tail or is too strict for the median. Two targets — one
    on the typical case (p90) and one on the tail (p99) — describe both parts of the latency
    distribution and give a coherent picture of user experience.
  ref: "concepts.md#availability-vs-latency-slos"

- id: slos-error-budgets-and-velocity-tradeoff-032
  difficulty: advanced
  tags: [availability-latency, timeout, cross-ref]
  question: |
    Why is a request that is "too slow" often effectively an availability failure?
  options:
  - "Because slow requests always return 500 errors"
  - "Because slow requests consume more error budget by definition"
  - "If latency exceeds the client's timeout, the user experiences it as an error even though the server eventually responded"
  - "Because latency and availability are the same metric"
  answer: 2
  explanation: |
    Beyond the client timeout, a slow response is indistinguishable from an outage to the user —
    they got an error. Good SLO design keeps the latency threshold consistent with client/timeout
    behavior so the two SLIs tell a coherent story. Timeout budgets live in retries-timeouts-and-backoff.
  ref: "concepts.md#availability-vs-latency-slos"

- id: slos-error-budgets-and-velocity-tradeoff-033
  difficulty: intermediate
  tags: [policy, anti-pattern]
  question: |
    What is the most common failure mode of SLO adoption in an organization?
  options:
  - "Setting too few SLOs"
  - "Measuring the SLI too accurately"
  - "Using a rolling window instead of a calendar month"
  - "An SLO with no teeth — the dashboard shows a burned budget but no agreed policy changes anyone's behavior"
  answer: 3
  explanation: |
    Without an agreed, enforced error-budget policy, a burned budget produces no action and the
    SLO becomes vanity metrics. If a team never enforces the freeze, the SLO is either wrong (too
    strict) or the org isn't serious about reliability.
  ref: "concepts.md#error-budget-policy--what-happens-when-it-burns"

- id: slos-error-budgets-and-velocity-tradeoff-034
  difficulty: beginner
  tags: [nines, math]
  question: |
    Roughly how much downtime per year does "two nines" (99%) allow?
  options:
  - "About 8.8 hours"
  - "About 3.65 days"
  - "About 52 minutes"
  - "About 36 days"
  answer: 1
  explanation: |
    99% = 1% of a year unavailable ≈ 3.65 days/year (≈ 7.2 hours/month). One nine (90%) allows
    ~36.5 days/year; three nines ~8.8 hours/year.
  ref: "concepts.md#error-budget--the-leftover-and-the-math"

- id: slos-error-budgets-and-velocity-tradeoff-035
  difficulty: expert
  tags: [nines, cost, judgment]
  question: |
    Which statement best captures why chasing 99.999% ("five nines") is rarely justified for a
    typical user-facing web service?
  options:
  - "Five nines is impossible to measure"
  - "Five nines requires a formal SLA by law"
  - "Five nines is the same as 100% availability"
  - "Five nines allows ~5 min/year of downtime — less than human pager-response time — so it demands fully automated failover, at exponential cost, for reliability users often can't perceive over their own less-reliable networks/devices"
  answer: 3
  explanation: |
    Five nines ≈ 5.26 min/year — a human can't even react to a page in that time, so it requires
    fully automated failover and heavy redundancy (~10x cost per nine). Meanwhile a user's own
    ISP/device is often less reliable than 99.9%, making the extra nines invisible.
  ref: "concepts.md#why-100-is-the-wrong-target"

- id: slos-error-budgets-and-velocity-tradeoff-036
  difficulty: advanced
  tags: [sli, choosing, judgment]
  question: |
    An interviewer asks how many SLOs a service should have. What is the best guidance?
  options:
  - "As many as possible — one per endpoint and per metric"
  - "Exactly one, always availability"
  - "A small handful that matter; too many dilutes attention and creates conflicting signals"
  - "One per team member on call"
  answer: 2
  explanation: |
    Have few SLOs. Each one is an alerting and decision surface; dozens nobody watches dilute
    attention and can conflict. A handful focused on critical user journeys beats sprawling
    per-endpoint coverage.
  ref: "concepts.md#choosing-good-slis--the-happiness-test-and-requestresponse-ratio"

- id: slos-error-budgets-and-velocity-tradeoff-037
  difficulty: intermediate
  tags: [request-vs-time, math]
  question: |
    Why is a request-based error budget usually preferred over a time-based ("down minutes") budget?
  options:
  - "It is required by the CAP theorem"
  - "Time-based budgets can't be computed from metrics"
  - "It weights busy periods correctly and avoids having to define what a 'down minute' means"
  - "Request-based budgets always produce a larger budget"
  answer: 2
  explanation: |
    Request-based budgets count actual bad requests, so an outage during peak traffic costs more
    budget than the same wall-clock time at 3am — which matches user impact. They also avoid the
    ambiguity of defining a 'down minute' (partial failures, degraded modes).
  ref: "concepts.md#error-budget--the-leftover-and-the-math"

- id: slos-error-budgets-and-velocity-tradeoff-038
  difficulty: advanced
  tags: [policy, emergency, judgment]
  question: |
    During an active feature freeze (budget exhausted), a critical security patch needs to ship.
    What does a well-designed error-budget policy say?
  options:
  - "Security/regulatory fixes are a named exception and ship regardless of budget state"
  - "The patch must wait until the budget recovers like any other change"
  - "The SLO must be raised before the patch can ship"
  - "The freeze is automatically lifted for all changes"
  answer: 0
  explanation: |
    A good policy names emergency exceptions — security patches and legal/regulatory changes ship
    regardless of budget. The freeze targets *feature/risk* work, not urgent must-do fixes.
  ref: "concepts.md#error-budget-policy--what-happens-when-it-burns"

- id: slos-error-budgets-and-velocity-tradeoff-039
  difficulty: beginner
  tags: [definitions, mapping]
  question: |
    Match the concept: "the amount of unreliability you are allowed to have" refers to which term?
  options:
  - "Error budget"
  - "SLI"
  - "SLA"
  - "Burn rate"
  answer: 0
  explanation: |
    The error budget (= 100% − SLO) is precisely the allowed unreliability. The SLI is the
    measurement, the SLA is the contract, and burn rate is how fast the budget is being spent.
  ref: "concepts.md#error-budget--the-leftover-and-the-math"

- id: slos-error-budgets-and-velocity-tradeoff-040
  difficulty: advanced
  tags: [velocity-tradeoff, culture, scenario]
  question: |
    Before error budgets, dev and SRE teams clashed: dev wanted to ship, SRE wanted stability.
    How does a shared error budget resolve this without a turf war?
  options:
  - "It gives SRE final veto power over all releases"
  - "Both teams share one objective number: while budget remains, dev ships freely; when it's spent, the pre-agreed policy shifts focus to reliability — the number decides, not the loudest voice"
  - "It removes SRE from the release process entirely"
  - "It lets product override reliability whenever revenue is at stake"
  answer: 1
  explanation: |
    The shared budget converts a values clash into an objective resource decision. Spending the
    budget on velocity is the *point*; when it's exhausted the agreed policy redirects effort.
    Nobody wins by arguing — the measured budget state decides.
  ref: "concepts.md#error-budget-as-currency--the-reliabilityvelocity-tradeoff"

- id: slos-error-budgets-and-velocity-tradeoff-041
  difficulty: intermediate
  tags: [sla, cloud, numbers]
  question: |
    Public cloud services commonly publish an SLA with tiered service credits. Which pairing is
    typical?
  options:
  - "A 90% SLA with a full refund on any single failed request"
  - "A 100% SLA with no consequences"
  - "A 99.9% or 99.99% monthly SLA with percentage service credits when missed"
  - "A 50% SLA measured yearly"
  answer: 2
  explanation: |
    Public cloud SLAs typically promise 99.9% or 99.99% monthly availability and pay out
    percentage service credits (e.g. 10%, 25%, 100% of the bill) as the miss deepens. The SLA is
    set conservatively because breaching it costs real money.
  ref: "concepts.md#sla--the-service-level-agreement-contract"

- id: slos-error-budgets-and-velocity-tradeoff-042
  difficulty: expert
  tags: [error-budget, math, scenario]
  question: |
    A service targets 99.9% over 28 days and serves ~100M requests in that window. Ten days in, it
    has already accumulated 90,000 errors. Is it on track, and roughly what burn rate is implied?
  options:
  - "On track; burn rate ~0.9"
  - "Fine; the budget is 900,000 errors"
  - "Cannot be determined without the SLA"
  - "Over budget already; the 28-day allowance is only ~100,000 errors and it has spent 90% of it in 10/28 of the window (burn rate ~2.5)"
  answer: 3
  explanation: |
    Budget = 0.1% × 100M = 100,000 errors for the full 28 days. Spending 90,000 (90%) in 10 days
    (≈36% of the window) implies a burn rate of roughly 0.9/0.36 ≈ 2.5x — well over pace and
    heading for exhaustion before the window ends.
  ref: "concepts.md#burn-rate--the-concept"

- id: slos-error-budgets-and-velocity-tradeoff-043
  difficulty: intermediate
  tags: [sli-types, categories]
  question: |
    Which of the following is a standard *type* of SLI for a request-driven service?
  options:
  - "Number of open Jira tickets"
  - "Lines of code deployed per week"
  - "Availability (success rate), latency, and quality/correctness"
  - "Number of on-call engineers"
  answer: 2
  explanation: |
    The common SLI types cluster into availability, latency, and quality/correctness for
    request services, plus freshness/throughput/durability for data systems. They all map to a
    user-visible aspect of service.
  ref: "concepts.md#sli--the-service-level-indicator"

- id: slos-error-budgets-and-velocity-tradeoff-044
  difficulty: advanced
  tags: [availability-latency, load-shedding, cross-ref]
  question: |
    Under heavy load, protecting a strict *latency* SLO may require shedding load or degrading
    features. What is the reliability trade-off being made?
  options:
  - "There is no trade-off; shedding load improves everything"
  - "You may sacrifice some availability (rejected/degraded requests) to keep the tail latency fast for served requests"
  - "You must always lower the SLA first"
  - "Latency and availability never interact"
  answer: 1
  explanation: |
    Shedding load or degrading gracefully keeps served requests fast (protecting the latency SLO)
    at the cost of rejecting/degrading some requests (an availability cost). The budget framework
    lets you decide which to protect. See load-shedding-and-backpressure and
    graceful-degradation-and-fallbacks.
  ref: "concepts.md#availability-vs-latency-slos"

- id: slos-error-budgets-and-velocity-tradeoff-045
  difficulty: beginner
  tags: [ordering, strictness]
  question: |
    Order these from strictest to loosest target: internal alerting threshold, SLA, SLO.
  options:
  - "Alerting threshold > SLO > SLA"
  - "SLA > SLO > alerting threshold"
  - "SLO > SLA > alerting threshold"
  - "They are all equal by design"
  answer: 0
  explanation: |
    Strictness order is: internal alerting thresholds (tightest) > SLO > SLA (loosest). You want
    to be alerted and fixing well before the SLO burns, and the SLO gives margin before the SLA
    contract is breached.
  ref: "concepts.md#sla--the-service-level-agreement-contract"

- id: slos-error-budgets-and-velocity-tradeoff-046
  difficulty: advanced
  tags: [target-setting, judgment]
  question: |
    A team is setting an SLO for a service currently measured at 99.92% availability. What is a
    reasonable approach to picking the target?
  options:
  - "Set it to 99.999% to be ambitious"
  - "Set it to 100% to eliminate all risk"
  - "Set it near current measured performance where users are happy (e.g. 99.9%), not aspirationally high with no plan to hit it"
  - "Copy a competitor's SLA verbatim"
  answer: 2
  explanation: |
    Setting the target from current measured performance where users are satisfied (e.g. 99.9%
    when you run ~99.92%) is a sound start. An aspirational target with no plan just guarantees a
    permanently-burned budget and constant freezes.
  ref: "concepts.md#slo--the-service-level-objective"

- id: slos-error-budgets-and-velocity-tradeoff-047
  difficulty: intermediate
  tags: [burn-rate, window]
  question: |
    A burn rate of 6 is observed against a 30-day SLO window. If it were sustained, when would the
    budget be exhausted?
  options:
  - "In about 5 days"
  - "In 30 days (on pace)"
  - "In about 180 days"
  - "In about 12 hours"
  answer: 0
  explanation: |
    Burn rate 6 means you're spending 6x too fast, so a 30-day budget lasts 30/6 = 5 days. Burn
    rate divides the window length to give time-to-exhaustion.
  ref: "concepts.md#burn-rate--the-concept"

- id: slos-error-budgets-and-velocity-tradeoff-048
  difficulty: advanced
  tags: [scope, boundaries, cross-ref]
  question: |
    Which of these belongs to the *observability* domain rather than this SLO-concepts topic?
  options:
  - "The specific multi-burn-rate alert rules (e.g. 14.4x/1h, 6x/6h) and the PromQL recording rules to compute them"
  - "Deciding that a burned budget should trigger a feature freeze"
  - "Explaining why 100% is the wrong target"
  - "Choosing which SLI reflects the user's experience"
  answer: 0
  explanation: |
    The measurement and alerting mechanics — recording rules, multi-window multi-burn-rate alert
    thresholds, PromQL — live in observability (slo-based-alerting-and-error-budgets). This topic
    owns the concepts and the velocity decision, not the alert-rule implementation.
  ref: "concepts.md#burn-rate--the-concept"

- id: slos-error-budgets-and-velocity-tradeoff-049
  difficulty: expert
  tags: [error-budget, composition, judgment]
  question: |
    Your service depends on a third-party API with its own 99.9% SLA. You promise your users a
    99.95% SLO on a journey that must call that API every request. What is the fundamental problem?
  options:
  - "Nothing — your SLO is independent of the dependency"
  - "You should raise your SLO to 99.99% to compensate"
  - "The third party's SLA automatically becomes your SLA"
  - "Your journey can't reliably beat the dependency's availability without adding resilience (caching, fallback, retries) — a hard dependency caps you at ~99.9%, below your 99.95% target"
  answer: 3
  explanation: |
    A hard, per-request dependency at 99.9% caps your journey's availability at ~99.9% (or lower
    after compounding), which is below your 99.95% promise. You must either add resilience
    (caching, fallbacks, graceful degradation) to decouple from it, or set an SLO your dependency
    chain can actually support.
  ref: "concepts.md#user-journey-slos"

- id: slos-error-budgets-and-velocity-tradeoff-050
  difficulty: intermediate
  tags: [definitions, slo-vs-sla]
  question: |
    A candidate says "our SLA is 99.99% so we alert when we drop below 99.99%." What's the flaw?
  options:
  - "Nothing — alerting at the SLA is correct"
  - "You should alert well before the SLA (at a stricter internal SLO/threshold) so you can react before you breach the contract and owe credits"
  - "The SLA should be measured client-side"
  - "99.99% is impossible to alert on"
  answer: 1
  explanation: |
    Alerting only at the SLA leaves no reaction buffer — by the time you notice, you've already
    breached and owe penalties. Run a stricter internal SLO and alert on its burn rate so you fix
    problems before the contractual SLA is at risk.
  ref: "concepts.md#sla--the-service-level-agreement-contract"

- id: slos-error-budgets-and-velocity-tradeoff-051
  difficulty: advanced
  tags: [error-budget, replenish, scenario]
  question: |
    With a *rolling* 28-day window, how does an exhausted error budget eventually recover?
  options:
  - "As the bad events age out of the trailing 28-day window, the budget gradually replenishes if current error rates are low"
  - "It resets instantly to full at midnight"
  - "It never recovers until the SLO is lowered"
  - "It recovers only after a postmortem is filed"
  answer: 0
  explanation: |
    A rolling window continuously drops the oldest data. As the burst of errors falls off the
    back of the 28-day window and recent performance is healthy, the consumed budget gradually
    returns — no calendar reset needed.
  ref: "concepts.md#slo--the-service-level-objective"

- id: slos-error-budgets-and-velocity-tradeoff-052
  difficulty: intermediate
  tags: [culture, over-reliability, judgment]
  question: |
    Why can making a service *more* reliable than its SLO requires actually be harmful?
  options:
  - "It violates the SLA"
  - "It wastes engineering effort and forgone velocity on reliability the user can't perceive, and users may come to depend on the higher level"
  - "It makes the error budget negative"
  - "Monitoring can't handle the extra nines"
  answer: 1
  explanation: |
    Over-delivering reliability burns effort on something users can't tell apart from the SLO —
    effort that could have been velocity. Worse, users (and dependent services) start relying on
    the higher-than-promised level, so it becomes a de-facto tighter SLO you're stuck with.
  ref: "concepts.md#why-100-is-the-wrong-target"
