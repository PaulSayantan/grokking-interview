topic: Chaos Engineering & Fault Injection
domain: reliability-ops
topic_slug: chaos-engineering-and-fault-injection
version: 1
questions:
- id: chaos-engineering-and-fault-injection-001
  difficulty: beginner
  tags:
  - definition
  - fundamentals
  question: |
    Which statement best captures the definition of chaos engineering?
  options:
  - Randomly killing production servers to keep engineers alert
  - A load-testing technique that measures maximum throughput before failure
  - Experimenting on a system to build confidence in its ability to withstand turbulent conditions in
    production
  - A monitoring practice that alerts when error rates spike
  answer: 2
  explanation: |
    The canonical definition (principlesofchaos.org) is a discipline of experimenting on a
    system in order to build confidence in the system's capability to withstand turbulent
    conditions in production. The emphasis is on a controlled experiment that builds
    confidence — not random breakage, not load testing, not monitoring.
  ref: concepts.md#what-chaos-engineering-is-and-is-not
- id: chaos-engineering-and-fault-injection-002
  difficulty: beginner
  tags:
  - experiment
  - method
  question: |
    What fundamentally distinguishes chaos engineering from "just breaking things
    randomly in production"?
  options:
  - Chaos engineering only runs in staging, never production
  - Chaos engineering never actually injects real faults
  - Chaos engineering requires no monitoring
  - Chaos engineering is a controlled, hypothesis-driven experiment with a bounded blast radius
  answer: 3
  explanation: |
    Chaos engineering is a scientific experiment: you define a steady state, form a
    hypothesis, inject a real fault, try to disprove the hypothesis, and keep the blast
    radius small with an abort capability. Randomization may be a method for target
    selection, but the discipline is the controlled experiment, not chaos for its own sake.
  ref: concepts.md#what-chaos-engineering-is-and-is-not
- id: chaos-engineering-and-fault-injection-003
  difficulty: intermediate
  tags:
  - testing
  - comparison
  question: |
    How does chaos engineering complement traditional testing (unit/integration tests)?
  options:
  - It replaces testing entirely, so you can delete your test suite
  - It verifies the same known conditions as tests but faster
  - Tests verify known conditions you enumerate; chaos surfaces unknown, emergent, systemic behavior in
    the running whole
  - It only checks code style and best practices
  answer: 2
  explanation: |
    Tests verify known-knowns you can enumerate. Chaos engineering explores unknown-unknowns
    — emergent behavior (retry storms, cascading failures, a fallback that depends on the
    failed service) that only appears when real faults hit the real, running system. It
    complements, not replaces, testing.
  ref: concepts.md#what-chaos-engineering-is-and-is-not
- id: chaos-engineering-and-fault-injection-004
  difficulty: beginner
  tags:
  - principles
  - steady-state
  question: |
    What is the first step in the canonical chaos-engineering experimental loop?
  options:
  - Define a measurable 'steady state' that indicates normal system behavior
  - Inject a fault as large as possible
  - Terminate a random production instance
  - Write a postmortem
  answer: 0
  explanation: |
    The five-step loop begins with defining steady state — a measurable output (ideally a
    business metric like orders/sec) that indicates normal behavior. Everything else
    (hypothesis, fault injection, comparison) is measured against this baseline.
  ref: concepts.md#the-principles-of-chaos-engineering
- id: chaos-engineering-and-fault-injection-005
  difficulty: intermediate
  tags:
  - principles
  - order
  question: |
    Which sequence correctly orders the core chaos-engineering steps?
  options:
  - Inject fault → define steady state → hypothesize → minimize blast radius
  - Define steady state → hypothesize it holds → inject a real-world fault → try to disprove the hypothesis
    (minimizing blast radius throughout)
  - Hypothesize → write postmortem → inject fault → define steady state
  - Minimize blast radius → inject fault → define steady state → hypothesize
  answer: 1
  explanation: |
    The loop is: (1) define steady state, (2) hypothesize it continues in both control and
    experiment groups, (3) inject a real-world fault, (4) try to disprove the hypothesis by
    comparing groups — with (5) minimizing blast radius as a constraint throughout.
  ref: concepts.md#the-principles-of-chaos-engineering
- id: chaos-engineering-and-fault-injection-006
  difficulty: advanced
  tags:
  - principles
  - scientific-method
  question: |
    In a chaos experiment, what is the correct scientific stance toward the hypothesis
    that "steady state holds during the fault"?
  options:
  - Seek evidence that confirms the hypothesis is true
  - Assume it is true and skip measurement
  - Prove it mathematically before running anything
  - Seek to disprove (falsify) it by looking for a difference between control and experiment groups
  answer: 3
  explanation: |
    The rigorous stance is falsification: you try to DISPROVE the hypothesis by looking for a
    meaningful divergence between the control group (no fault) and the experiment group
    (fault injected). A divergence reveals a weakness; no divergence builds confidence.
  ref: concepts.md#the-principles-of-chaos-engineering
- id: chaos-engineering-and-fault-injection-007
  difficulty: intermediate
  tags:
  - steady-state
  - metrics
  question: |
    Why is a business/throughput metric (e.g. Netflix's stream-starts-per-second, or
    orders/min) a better steady-state definition than a single host's CPU utilization?
  options:
  - CPU is impossible to measure in production
  - Business metrics are always cheaper to collect
  - A business metric directly reflects customer-facing behavior and is stable/predictable, whereas CPU
    is noisy and doesn't indicate whether customers are affected
  - CPU cannot be graphed on a dashboard
  answer: 2
  explanation: |
    A system can be healthy at 90% CPU or broken at 10% CPU, so CPU is a poor proxy for
    health. A business metric (SPS, orders/min) is customer-facing, stable, and predictable,
    so a deviation during an experiment is an unambiguous, high-signal indicator of impact.
  ref: concepts.md#steady-state-and-the-hypothesis
- id: chaos-engineering-and-fault-injection-008
  difficulty: intermediate
  tags:
  - steady-state
  - netflix
  question: |
    Netflix's classic steady-state metric for chaos experiments was SPS. What is SPS?
  options:
  - Stream starts per second — video playbacks initiated per second
  - Servers per second provisioned by autoscaling
  - Successful pings per second to the load balancer
  - System processes per second
  answer: 0
  explanation: |
    SPS = stream starts per second, the rate at which customers begin playing video. It is
    smooth, follows a predictable daily curve, and is directly tied to customer experience,
    so a dip during an experiment is an unambiguous signal of customer impact.
  ref: concepts.md#steady-state-and-the-hypothesis
- id: chaos-engineering-and-fault-injection-009
  difficulty: advanced
  tags:
  - experiment
  - control-group
  question: |
    A mature chaos platform routes a small slice of traffic to an "experiment" group with
    the fault injected and an equal "control" group without it. Why use both groups instead
    of just comparing the experiment group to yesterday's numbers?
  options:
  - It halves the cost of the experiment
  - A concurrent control group isolates the fault's effect from confounders (traffic shifts, deploys,
    time-of-day), like an A/B test
  - Control groups are required by law
  - It lets you skip defining a steady state
  answer: 1
  explanation: |
    A concurrent control group experiences the same real-time conditions (traffic mix,
    deploys, time-of-day) as the experiment group, so any divergence is attributable to the
    injected fault rather than confounders. This A/B-style design is more rigorous than
    comparing against a historical baseline.
  ref: concepts.md#steady-state-and-the-hypothesis
- id: chaos-engineering-and-fault-injection-010
  difficulty: beginner
  tags:
  - blast-radius
  - definition
  question: |
    What does "blast radius" mean in chaos engineering?
  options:
  - The physical distance between data centers
  - The number of engineers on the on-call rotation
  - The maximum latency a service can tolerate
  - The scope of potential impact if the experiment's hypothesis turns out to be wrong
  answer: 3
  explanation: |
    Blast radius is how many customers, requests, hosts, or dollars could be affected if the
    hypothesis is wrong. Minimizing and controlling it is what keeps an experiment from
    becoming an incident.
  ref: concepts.md#blast-radius-and-guardrails
- id: chaos-engineering-and-fault-injection-011
  difficulty: intermediate
  tags:
  - blast-radius
  - guardrails
  question: |
    Which pair of guardrails is considered non-negotiable for any chaos experiment?
  options:
  - A dedicated war room and a printed runbook
  - A minimum of ten engineers watching and a manager's sign-off
  - The ability to abort instantly (undo the fault) AND automated halt conditions tied to the steady-state
    metric
  - Root access to every host and a full database backup
  answer: 2
  explanation: |
    The two hard requirements are an instant abort / "big red button" that undoes the fault
    and restores service, plus automated halt conditions (kill switch) that auto-abort if the
    steady-state metric or a health alarm crosses a threshold. Without both, you are gambling.
  ref: concepts.md#blast-radius-and-guardrails
- id: chaos-engineering-and-fault-injection-012
  difficulty: intermediate
  tags:
  - blast-radius
  - ramp
  question: |
    You are running your first production chaos experiment on a critical service. What is
    the recommended approach to blast radius?
  options:
  - Start small (one host or ~1% of traffic) and widen gradually only after smaller experiments pass
  - Start with the entire fleet to get the most realistic signal immediately
  - Run it at 3am with no one watching to avoid customer complaints
  - Inject faults into all regions simultaneously
  answer: 0
  explanation: |
    The mature approach is a graduated ramp: begin with the smallest scope that yields signal
    (one host, 1% of traffic), verify the guardrails, then widen incrementally as confidence
    grows. Starting fleet-wide risks turning a wrong hypothesis into a full outage.
  ref: concepts.md#blast-radius-and-guardrails
- id: chaos-engineering-and-fault-injection-013
  difficulty: advanced
  tags:
  - blast-radius
  - tradeoff
  question: |
    What is the core trade-off between a large and a small blast radius?
  options:
  - Larger blast radius is always safer and cheaper
  - A larger blast radius yields more realistic signal but risks a real outage; a smaller one is safer
    but may miss emergent, scale-dependent failures
  - Smaller blast radius always produces more realistic results
  - Blast radius has no effect on the quality of results
  answer: 1
  explanation: |
    Bigger scope reveals correlated, scale-dependent behavior (more realistic) but risks real
    customer impact if the hypothesis is wrong. Smaller scope is safer but can miss emergent
    failures. The resolution is a graduated ramp with automated guardrails at every level.
  ref: concepts.md#blast-radius-and-guardrails
- id: chaos-engineering-and-fault-injection-014
  difficulty: beginner
  tags:
  - chaos-monkey
  - simian-army
  question: |
    What does Netflix's Chaos Monkey do?
  options:
  - Injects latency into all RPC calls
  - Simulates the loss of an entire AWS region
  - Deletes unused cloud resources to save cost
  - Randomly terminates production instances/VMs to ensure services tolerate instance loss routinely
  answer: 3
  explanation: |
    Chaos Monkey randomly kills production instances (during working hours) so that a server
    dying becomes a mundane, constantly-tested event rather than a rare, scary one. It forces
    engineers to build services that tolerate instance loss.
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-015
  difficulty: intermediate
  tags:
  - chaos-monkey
  - timing
  question: |
    Why did Netflix originally run Chaos Monkey on weekdays during business hours rather
    than overnight?
  options:
  - Cloud compute is cheaper during the day
  - Because customer traffic is lowest during business hours
  - So that instance failures happen while engineers are present and watching, able to respond and learn
  - To comply with AWS terms of service
  answer: 2
  explanation: |
    Running during staffed business hours means failures occur while engineers are available
    to observe, respond, and fix any weakness the experiment exposes — a general guardrail
    principle (run during staffed windows, not unattended overnight).
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-016
  difficulty: intermediate
  tags:
  - simian-army
  - escalation
  question: |
    The Chaos Monkey → Chaos Gorilla → Chaos Kong escalation maps to which failure-domain
    hierarchy?
  options:
  - Thread → process → container
  - Instance → Availability Zone → Region
  - Request → session → user
  - Rack → building → city
  answer: 1
  explanation: |
    Chaos Monkey kills an instance, Chaos Gorilla simulates loss of an entire Availability
    Zone, and Chaos Kong simulates loss of an entire Region (forcing a region evacuation).
    The escalation is instance → AZ → region.
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-017
  difficulty: intermediate
  tags:
  - chaos-kong
  - dr
  question: |
    What does Chaos Kong exercise, and what resilience capability does it validate?
  options:
  - It simulates the loss of an entire AWS Region, validating full region failover/evacuation (DR)
  - It kills one container; it validates pod restarts
  - It injects clock skew; it validates NTP configuration
  - It fills the disk; it validates log rotation
  answer: 0
  explanation: |
    Chaos Kong takes out a whole region, forcing traffic to fail over to another region. It
    validates the organization's disaster-recovery / multi-region failover capability — see
    reliability-ops/disaster-recovery-rpo-rto-strategies.
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-018
  difficulty: advanced
  tags:
  - latency-monkey
  - simian-army
  question: |
    What did Latency Monkey inject, and why was it valuable?
  options:
  - It terminated instances; it tested autoscaling
  - It deleted unused resources to reduce clutter
  - It found instances that violated best practices and shut them down
  - It introduced artificial delays and errors into RPC calls, simulating a degraded downstream without
    killing it — testing timeouts and circuit breakers
  answer: 3
  explanation: |
    Latency Monkey injected artificial delays (and error responses) into service calls,
    simulating a slow/degraded dependency. A slow dependency is a leading cause of cascading
    failure, so this tested whether timeouts, retries, and circuit breakers fire correctly.
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-019
  difficulty: intermediate
  tags:
  - simian-army
  - janitor
  question: |
    Which Simian Army member was responsible for cleaning up unused resources to reduce
    clutter and cost (later reimplemented as "Swabbie")?
  options:
  - Conformity Monkey
  - Janitor Monkey
  - Doctor Monkey
  - Security Monkey
  answer: 1
  explanation: |
    Janitor Monkey identified and removed unused cloud resources to control clutter and cost.
    Conformity Monkey enforced best practices, Doctor Monkey removed unhealthy instances, and
    Security Monkey found security misconfigurations.
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-020
  difficulty: advanced
  tags:
  - chap
  - continuous
  question: |
    Netflix's ChAP (Chaos Automation Platform) advanced the practice by doing what?
  options:
  - Running a single massive experiment once per year
  - Replacing all monitoring with chaos experiments
  - Continuously running experiments with automatic control/experiment groups and auto-termination if
    customer metrics deviate — realizing 'automated + continuous + minimal blast radius'
  - Only running experiments in staging
  answer: 2
  explanation: |
    ChAP runs experiments continuously, routing small control and experiment populations
    through the service mesh and automatically aborting if customer metrics diverge. It is the
    fully realized form of the automate/continuous/minimal-blast-radius principles.
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-021
  difficulty: beginner
  tags:
  - fault-injection
  - definition
  question: |
    "Fault injection" in chaos engineering refers to what?
  options:
  - Deliberately introducing a failure condition (kill a process, add latency, fail a dependency) to observe
    the system's response
  - Automatically fixing bugs in production code
  - Injecting extra capacity when load rises
  - Rolling back a bad deployment
  answer: 0
  explanation: |
    Fault injection is the mechanism of chaos engineering: intentionally introducing a
    realistic failure — instance death, latency, packet loss, dependency failure, resource
    exhaustion, clock skew — so you can watch how resilience mechanisms behave.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-022
  difficulty: advanced
  tags:
  - latency
  - cascading
  question: |
    Why is latency injection often considered the single most valuable fault to inject?
  options:
  - It is the easiest fault to implement
  - Latency never affects the caller, so it is completely safe
  - It automatically improves response times
  - A slow dependency (not a dead one) is the classic trigger of cascading failure and directly tests
    whether timeouts, circuit breakers, and bulkheads fire
  answer: 3
  explanation: |
    A dependency that is slow rather than down is often worse: callers block waiting, exhaust
    their thread/connection pools, and fail — even services that never called the slow one.
    Injecting latency validates timeouts, circuit breakers, and bulkheads (see
    reliability-ops/circuit-breakers-and-bulkheads).
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-023
  difficulty: intermediate
  tags:
  - fault-injection
  - mapping
  question: |
    You want to validate that your application gracefully serves cached/default content when
    the recommendation service is unavailable. Which fault should you inject?
  options:
  - Clock skew on the database
  - A dependency failure — make the recommendation service return errors / be unreachable
  - CPU exhaustion on the load balancer
  - Terminate the DNS server
  answer: 1
  explanation: |
    To test fallback/graceful-degradation behavior for a specific dependency, you inject a
    dependency failure for that service and confirm the app degrades gracefully (cached or
    default content). See reliability-ops/graceful-degradation-and-fallbacks.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-024
  difficulty: intermediate
  tags:
  - fault-injection
  - mapping
  question: |
    Injecting instance/pod terminations primarily validates which resilience mechanisms?
  options:
  - Circuit breakers and bulkheads only
  - Clock synchronization
  - Redundancy, health checks, and autoscaling (self-healing)
  - Log rotation and disk cleanup
  answer: 2
  explanation: |
    Killing instances tests whether redundant peers absorb the load, health checks detect and
    route around the dead node, and autoscaling replaces it — see
    reliability-ops/redundancy-failover-and-health-checks.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-025
  difficulty: advanced
  tags:
  - fault-injection
  - clock-skew
  question: |
    Which class of real-world bugs is clock-skew injection specifically designed to surface?
  options:
  - 'Time-dependent bugs: certificate/TTL/token expiry, NTP drift, leap-second handling'
  - Memory leaks in the JVM heap
  - SQL injection vulnerabilities
  - Load-balancer misconfiguration
  answer: 0
  explanation: |
    Injecting clock skew (jumping time forward/back or drifting it) exposes time-sensitive
    logic: cert expiry, token/TTL calculations, leap-second handling, and cache-expiry bugs
    that only manifest when the clock is wrong.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-026
  difficulty: advanced
  tags:
  - fault-injection
  - resilience-mechanism
  question: |
    An interviewer notes that "many real outages are the safety mechanism itself not working."
    What subtle chaos experiment addresses this directly?
  options:
  - Only ever inject instance kills
  - Never inject any fault into resilience mechanisms
  - Run experiments only in staging
  - Deliberately fail the fallback path or the resilience mechanism itself, e.g. verify a fallback doesn't
    secretly depend on the failed service
  answer: 3
  explanation: |
    A fallback that secretly depends on the service that failed, or a circuit breaker with the
    wrong threshold, is only exposed by injecting the fault and watching the mechanism behave.
    Testing the safety mechanism itself catches these hidden failure modes.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-027
  difficulty: intermediate
  tags:
  - fault-injection
  - resource-exhaustion
  question: |
    Injecting resource exhaustion (burning CPU, leaking memory, filling disk) most directly
    validates which reliability mechanism?
  options:
  - DNS failover
  - Load shedding and backpressure (protecting the system under resource pressure)
  - Blameless postmortems
  - Certificate rotation
  answer: 1
  explanation: |
    Resource exhaustion simulates noisy neighbors and capacity limits. It validates load
    shedding and backpressure — whether the system sheds low-priority work to protect itself
    — see reliability-ops/load-shedding-and-backpressure.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-028
  difficulty: beginner
  tags:
  - gameday
  - definition
  question: |
    What is a "GameDay"?
  options:
  - A day when all deployments are frozen
  - A recurring sprint-planning meeting
  - A planned, scheduled failure exercise where a team deliberately injects a failure and observes how
    the system AND the people/process respond
  - A day dedicated to writing unit tests
  answer: 2
  explanation: |
    A GameDay (coined at Amazon by Jesse Robbins) is a planned failure exercise: the team
    injects a fault and watches how the system responds AND how alerting, on-call, runbooks,
    and communication perform — testing the humans and process, not just the machines.
  ref: concepts.md#gamedays-planned-failure-exercises
- id: chaos-engineering-and-fault-injection-029
  difficulty: intermediate
  tags:
  - gameday
  - chaos-monkey
  - comparison
  question: |
    What is the key difference between a GameDay and an automated tool like Chaos Monkey?
  options:
  - A GameDay is a planned, often manual, broad-scope exercise testing system + humans + process; Chaos
    Monkey is an automated, continuous, narrow-scope tool testing one failure mode
  - A GameDay is fully automated while Chaos Monkey is manual
  - They are identical in every way
  - Chaos Monkey tests humans while GameDays only test machines
  answer: 0
  explanation: |
    GameDays are periodic, broad, often human-in-the-loop exercises that test the whole
    socio-technical system (alerts, on-call, runbooks). Chaos Monkey is automated, continuous,
    and narrow (instance death). Mature orgs run both.
  ref: concepts.md#gamedays-planned-failure-exercises
- id: chaos-engineering-and-fault-injection-030
  difficulty: advanced
  tags:
  - gameday
  - human-response
  question: |
    A team runs a GameDay and the system tolerates the fault perfectly, but no alert fired
    and on-call was never paged. What is the correct interpretation?
  options:
  - The GameDay was a waste of time since nothing broke
  - Alerts are unnecessary since the system self-healed
  - The experiment should be discarded because there was no customer impact
  - 'The GameDay found a real weakness: detection/alerting is broken — a silent failure that would delay
    response to a real incident'
  answer: 3
  explanation: |
    GameDays test the human/process response, not just the system. A fault the system survives
    but that no alert catches is a serious finding: in a real, larger incident you'd have no
    detection. This should become a prioritized fix (see incident-response and observability).
  ref: concepts.md#gamedays-planned-failure-exercises
- id: chaos-engineering-and-fault-injection-031
  difficulty: intermediate
  tags:
  - gameday
  - follow-through
  question: |
    A GameDay uncovers three bugs and a stale runbook, but the team files no tickets and
    makes no changes. Why is this a problem?
  options:
  - It isn't a problem; observing the failure is the entire goal
  - A chaos exercise that finds problems but doesn't drive fixes is theater — the value is realized only
    when weaknesses are fixed and re-verified
  - GameDays are not supposed to find bugs
  - The team should stop running GameDays entirely
  answer: 1
  explanation: |
    Follow-through is essential: findings must be filed, prioritized, fixed, and then the
    experiment re-run to verify. Debriefing via a blameless postmortem and driving action
    items is what turns a GameDay from theater into resilience improvement.
  ref: concepts.md#gamedays-planned-failure-exercises
- id: chaos-engineering-and-fault-injection-032
  difficulty: advanced
  tags:
  - gameday
  - unannounced
  question: |
    What is the trade-off of running an *unannounced* GameDay (on-call is not told in advance)?
  options:
  - It is strictly better with no downside
  - It removes the need for any abort mechanism
  - It tests detection and human response more realistically, but raises the stakes and risk if the response
    goes badly
  - It guarantees zero customer impact
  answer: 2
  explanation: |
    Not warning on-call makes the exercise a realistic test of whether alerts fire and people
    respond correctly. The cost is higher stakes: if the response falters, real impact is more
    likely — so guardrails and abort criteria remain essential.
  ref: concepts.md#gamedays-planned-failure-exercises
- id: chaos-engineering-and-fault-injection-033
  difficulty: intermediate
  tags:
  - prerequisites
  - observability
  question: |
    Why is observability considered a prerequisite for chaos engineering?
  options:
  - You must be able to measure the steady state and see the fault's effect in near-real-time; without
    it you inject faults blind and can't detect divergence or know when to abort
  - Observability tools inject the faults automatically
  - Observability makes experiments run faster
  - It is not a prerequisite; you can run chaos with no monitoring
  answer: 0
  explanation: |
    Chaos engineering consumes telemetry: you need dashboards/metrics/alerting to measure the
    steady state, detect a divergence, and trigger the abort. Without observability you're
    injecting faults blind. How you collect/alert on metrics is observability's domain.
  ref: concepts.md#prerequisites-and-maturity
- id: chaos-engineering-and-fault-injection-034
  difficulty: intermediate
  tags:
  - prerequisites
  - anti-pattern
  question: |
    Your service has NO redundancy and you already know killing its single instance causes an
    outage. Should you run Chaos Monkey on it to "prove" this?
  options:
  - Yes, running the experiment is the only way to be sure
  - Yes, but only in production
  - No, because Chaos Monkey cannot kill instances
  - No — chaos exists to surface UNKNOWN weaknesses; fix the known single-instance weakness first, then
    use chaos to find what you don't know
  answer: 3
  explanation: |
    Don't run chaos to confirm a weakness you already know about; you'd just cause a
    predictable outage. Fix the known problem (add redundancy) first. Baseline resilience is a
    prerequisite; chaos is for discovering the unknown-unknowns.
  ref: concepts.md#prerequisites-and-maturity
- id: chaos-engineering-and-fault-injection-035
  difficulty: beginner
  tags:
  - prerequisites
  - timing
  question: |
    When should you NEVER run a chaos experiment?
  options:
  - During business hours
  - During an active incident or a known-degraded state
  - When observability is fully in place
  - When you have an abort mechanism ready
  answer: 1
  explanation: |
    Running chaos during an active incident amplifies a real outage and makes it impossible to
    distinguish injected from real failure. Never inject faults during an incident, deploy
    freeze, or known-degraded state.
  ref: concepts.md#prerequisites-and-maturity
- id: chaos-engineering-and-fault-injection-036
  difficulty: advanced
  tags:
  - maturity
  - axes
  question: |
    The chaos-engineering maturity model tracks progress along which two axes?
  options:
  - Cost and headcount
  - Latency and throughput
  - Sophistication (ad-hoc/manual/staging → automated/continuous/production with guardrails) and adoption
    (one engineer → org-wide across critical services)
  - Number of tools and number of dashboards
  answer: 2
  explanation: |
    Maturity advances on sophistication (manual staging experiments → automated, continuous
    production experiments with control groups and auto-guardrails) and adoption (a side
    project → an org-wide practice covering all critical services).
  ref: concepts.md#prerequisites-and-maturity
- id: chaos-engineering-and-fault-injection-037
  difficulty: intermediate
  tags:
  - staging-vs-prod
  - tradeoff
  question: |
    Why does the Principles of Chaos manifesto advocate running experiments in production,
    not just staging?
  options:
  - Staging never faithfully reproduces production's scale, traffic mix, data volume, configuration, and
    dependency topology — the highest-value emergent failures only appear in prod
  - Production is cheaper to experiment on
  - Staging has no monitoring
  - Experiments are illegal in staging
  answer: 0
  explanation: |
    Staging is an approximation; real scale, traffic patterns, config, and dependency
    topology exist only in production, where the most surprising emergent failures appear.
    You de-risk prod experiments with small blast radius and guardrails, not by avoiding prod.
  ref: concepts.md#staging-vs-production-and-continuous-chaos
- id: chaos-engineering-and-fault-injection-038
  difficulty: intermediate
  tags:
  - continuous
  - regression
  question: |
    Why do mature programs automate chaos experiments to run continuously rather than as
    one-off events?
  options:
  - To reduce the cloud bill
  - Because one-off experiments are illegal
  - Because automation removes the need for a steady-state metric
  - Because systems change constantly (deploys, new dependencies, config drift), so resilience regresses
    silently; continuous chaos catches regressions like a CI test
  answer: 3
  explanation: |
    A one-off experiment only proves resilience on that day, in that config. Ongoing changes
    cause resilience to regress silently. Continuous, automated experiments catch those
    regressions the way CI catches code regressions.
  ref: concepts.md#staging-vs-production-and-continuous-chaos
- id: chaos-engineering-and-fault-injection-039
  difficulty: beginner
  tags:
  - staging-vs-prod
  - progression
  question: |
    What is the recommended progression for where to run chaos experiments?
  options:
  - Only ever in production, from day one, at full scale
  - Only ever in staging; never touch production
  - Start in staging to learn the tooling and validate abort, then graduate to production with small blast
    radius and guardrails
  - Start in production at full scale, then move to staging
  answer: 2
  explanation: |
    Begin in staging/pre-prod to learn the tools and validate the abort mechanism cheaply and
    safely, then graduate to production (where the real signal is) with small blast radius and
    automated guardrails.
  ref: concepts.md#staging-vs-production-and-continuous-chaos
- id: chaos-engineering-and-fault-injection-040
  difficulty: advanced
  tags:
  - scenario
  - latency
  - judgment
  question: |
    A hypothesis states "adding 300ms of latency to the payments API will keep checkout
    success rate within its normal band because our 250ms timeout + circuit breaker trip and
    we fall back to a queued-payment flow." During the experiment, checkout success rate drops
    50%. What have you most likely learned?
  options:
  - The experiment was invalid and should be ignored
  - A resilience mechanism failed as designed — e.g. the timeout is longer than 250ms, the breaker didn't
    trip, or the fallback isn't wired — a real weakness to fix
  - That latency injection is impossible on a payments API
  - That the checkout service needs more CPU
  answer: 1
  explanation: |
    The steady-state metric diverged sharply, falsifying the hypothesis. That is the point:
    you found a weakness. Likely the timeout is misconfigured, the circuit breaker didn't trip,
    or the fallback path is broken. Investigate, fix, and re-run to verify.
  ref: concepts.md#steady-state-and-the-hypothesis
- id: chaos-engineering-and-fault-injection-041
  difficulty: intermediate
  tags:
  - scenario
  - mapping
  - dr
  question: |
    Leadership wants confidence that the company can survive losing an entire AWS region.
    Which chaos activity best validates this?
  options:
  - Run a region-loss experiment / Chaos Kong (or a large DR GameDay) that forces a full region failover
  - Run Chaos Monkey to kill one instance
  - Inject clock skew across the fleet
  - Fill the disk on a single database node
  answer: 0
  explanation: |
    Validating region survival requires exercising a region evacuation — Chaos Kong or a
    large-scale DR GameDay that forces failover to another region. This tests the DR strategy
    end-to-end (see reliability-ops/disaster-recovery-rpo-rto-strategies).
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-042
  difficulty: advanced
  tags:
  - scenario
  - anti-pattern
  - retry-storm
  question: |
    During a latency-injection experiment against a downstream service, overall system load
    *increases* dramatically and other services start failing. Which emergent anti-pattern
    has the experiment most likely revealed?
  options:
  - A memory leak in the load balancer
  - A DNS misconfiguration
  - A retry storm / cascading failure — clients retrying the slow dependency amplify load and exhaust
    shared resources
  - A clock-skew bug
  answer: 2
  explanation: |
    When injected latency causes load to balloon and unrelated services to fail, the classic
    culprit is a retry storm feeding a cascading failure: callers retry the slow dependency
    without proper backoff/jitter or circuit breaking, amplifying load. See
    reliability-ops/cascading-failures-and-antipatterns and retries-timeouts-and-backoff.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-043
  difficulty: intermediate
  tags:
  - hypothesis
  - framing
  question: |
    Which is the best-formed chaos hypothesis?
  options:
  - If we break the database, something bad will probably happen
  - We should test the system by turning things off
  - The system is resilient, so no experiment is needed
  - If we terminate 20% of checkout-service instances, orders/min will stay within its normal band because
    autoscaling and remaining capacity absorb the loss within ~60s
  answer: 3
  explanation: |
    A good hypothesis names a specific fault, a measurable steady-state metric with a
    tolerance band, and the mechanism expected to preserve it, plus a rough recovery time. It
    is falsifiable — you can compare the actual metric against the predicted band.
  ref: concepts.md#steady-state-and-the-hypothesis
- id: chaos-engineering-and-fault-injection-044
  difficulty: advanced
  tags:
  - scenario
  - guardrails
  - judgment
  question: |
    Mid-experiment, the steady-state metric crosses the abort threshold you configured. What
    should happen?
  options:
  - Let the experiment continue to gather more data
  - The automated halt condition should immediately abort the experiment, undo the fault, and restore
    normal operation; then investigate
  - Widen the blast radius to confirm the result
  - Page the CEO before doing anything
  answer: 1
  explanation: |
    Crossing the abort threshold means the hypothesis is failing and customer impact is
    mounting. The kill switch / automated halt condition should immediately stop the fault and
    restore service. You then investigate the weakness offline and fix before re-running.
  ref: concepts.md#blast-radius-and-guardrails
- id: chaos-engineering-and-fault-injection-045
  difficulty: beginner
  tags:
  - tools
  - ecosystem
  question: |
    Which of the following is a chaos-engineering / fault-injection tool?
  options:
  - Prometheus
  - Terraform
  - AWS Fault Injection Service (FIS) / Gremlin / LitmusChaos
  - Jenkins
  answer: 2
  explanation: |
    AWS FIS, Gremlin, LitmusChaos, Chaos Mesh, Azure Chaos Studio, and Netflix Chaos Monkey
    are fault-injection tools. Prometheus is observability, Terraform is IaC, and Jenkins is
    CI/CD — supporting, but not chaos-injection, tools.
  ref: concepts.md#staging-vs-production-and-continuous-chaos
- id: chaos-engineering-and-fault-injection-046
  difficulty: advanced
  tags:
  - scenario
  - judgment
  - prerequisites
  question: |
    A new team with no dashboards, no alerting, and no ability to quickly roll back wants to
    start chaos engineering in production tomorrow. What is the best advice?
  options:
  - 'Hold off: first establish observability and an abort/recovery capability and basic resilience; without
    them, production chaos is reckless, not experimental'
  - Go ahead — chaos engineering will build the observability for you
  - Start with Chaos Kong to maximize learning
  - Skip observability but run only at 3am to reduce risk
  answer: 0
  explanation: |
    Prerequisites come first: observability to measure/see impact, an instant abort and
    recovery capability, and baseline resilience. Injecting faults in prod without these is
    blind and reckless. Establish the foundation, start in staging, then graduate to prod.
  ref: concepts.md#prerequisites-and-maturity
- id: chaos-engineering-and-fault-injection-047
  difficulty: intermediate
  tags:
  - well-architected
  - aws
  question: |
    The AWS Well-Architected Reliability pillar recommends using fault injection to do what?
  options:
  - Replace all backups
  - Reduce the cost of compute
  - Encrypt data at rest
  - Test how the workload responds to failures and validate that recovery procedures work, rather than
    assuming resilience
  answer: 3
  explanation: |
    Well-Architected's "Test Reliability" guidance says to use fault injection (e.g. AWS FIS)
    to inject real failures and verify the workload recovers as designed — you validate
    resilience empirically instead of assuming it.
  ref: concepts.md#what-chaos-engineering-is-and-is-not
- id: chaos-engineering-and-fault-injection-048
  difficulty: advanced
  tags:
  - scenario
  - network-partition
  question: |
    You inject a network partition between your service and its primary database and observe
    that the service returns errors AND a "read replica" fallback also fails. What is the most
    valuable lesson?
  options:
  - Network partitions never happen in practice
  - The fallback shares a failure domain with the primary path (e.g. same partitioned network segment)
    — a hidden correlated dependency the experiment exposed
  - The database needs a faster CPU
  - The experiment proves the system is fully resilient
  answer: 1
  explanation: |
    A fallback that fails alongside the primary during a partition reveals a correlated
    dependency / shared failure domain — the "redundant" path wasn't independent. This is
    exactly the kind of hidden weakness chaos surfaces (see redundancy-failover and
    system-design's correlated-failure discussion).
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-049
  difficulty: intermediate
  tags:
  - definition
  - misconception
  question: |
    "Chaos engineering is only for Netflix-scale companies." Why is this a misconception?
  options:
  - It is correct; small companies cannot benefit
  - Only companies with more than 10,000 servers can run experiments
  - Any distributed system with hard dependencies benefits, and you can start small in staging with a
    single fault — the practice scales down
  - Small companies have no failures to test
  answer: 2
  explanation: |
    The practice scales to any distributed system with real dependencies. You don't need a
    Simian Army; you can start with one fault in staging and a simple hypothesis. The
    discipline (controlled experiment + follow-through) matters more than the scale.
  ref: concepts.md#what-chaos-engineering-is-and-is-not
- id: chaos-engineering-and-fault-injection-050
  difficulty: advanced
  tags:
  - scenario
  - judgment
  - when-not
  question: |
    An experiment "succeeds" — the injected fault causes no measurable divergence in the
    steady-state metric. What is the correct next action for a mature program?
  options:
  - Record the confidence gained, then widen the blast radius one increment and/or automate the experiment
    so the resilience is continuously re-verified as the system changes
  - Declare the system perfect and stop all chaos work
  - Immediately run Chaos Kong on production
  - Delete the observability dashboards since they weren't needed
  answer: 0
  explanation: |
    No divergence builds confidence for that scope. The mature response is to gradually widen
    the blast radius and/or automate the experiment to run continuously, so silent resilience
    regressions from future changes are caught — not to declare victory and stop.
  ref: concepts.md#blast-radius-and-guardrails
