topic: Chaos Engineering & Fault Injection
domain: reliability-ops
topic_slug: chaos-engineering-and-fault-injection
version: 1
questions:
- id: chaos-engineering-and-fault-injection-001
  difficulty: beginner
  tags:
  - definition
  - fundamentals
  question: |
    Which statement best captures the definition of chaos engineering?
  options:
  - Randomly killing production servers throughout the day to keep on-call engineers alert and rehearsed
    for outages
  - A load-testing technique that measures the maximum sustained throughput a service reaches before it
    saturates and fails
  - Experimenting on a system to build confidence in its ability to withstand turbulent conditions in
    production
  - A monitoring practice that watches dashboards and pages on-call whenever error rates or latency spike
    above their baseline
  answer: 2
  explanation: |
    The canonical definition (principlesofchaos.org) is a discipline of experimenting on a
    system in order to build confidence in the system's capability to withstand turbulent
    conditions in production. The emphasis is on a controlled experiment that builds
    confidence — not random breakage, not load testing, not monitoring.
  ref: concepts.md#what-chaos-engineering-is-and-is-not
- id: chaos-engineering-and-fault-injection-002
  difficulty: beginner
  tags:
  - experiment
  - method
  question: |
    What fundamentally distinguishes chaos engineering from "just breaking things
    randomly in production"?
  options:
  - Chaos engineering only ever runs in a staging or pre-production clone and is prohibited from touching
    live production systems
  - Chaos engineering only simulates faults in a model and never actually injects a real failure into a
    running system
  - Chaos engineering deliberately runs with monitoring disabled so the team observes raw, unfiltered
    system behavior
  - Chaos engineering is a controlled, hypothesis-driven experiment with a bounded blast radius
  answer: 3
  explanation: |
    Chaos engineering is a scientific experiment: you define a steady state, form a
    hypothesis, inject a real fault, try to disprove the hypothesis, and keep the blast
    radius small with an abort capability. Randomization may be a method for target
    selection, but the discipline is the controlled experiment, not chaos for its own sake.
  ref: concepts.md#what-chaos-engineering-is-and-is-not
- id: chaos-engineering-and-fault-injection-003
  difficulty: intermediate
  tags:
  - testing
  - comparison
  question: |
    How does chaos engineering complement traditional testing (unit/integration tests)?
  options:
  - It fully replaces unit and integration testing, so once chaos is adopted you can delete your existing
    automated test suite
  - It verifies the exact same known conditions your unit and integration tests already cover, just executing
    them faster and in parallel
  - Tests verify known conditions you enumerate; chaos surfaces unknown, emergent, systemic behavior in
    the running whole
  - It only inspects code style, formatting, and adherence to best-practice linting rules across the codebase
  answer: 2
  explanation: |
    Tests verify known-knowns you can enumerate. Chaos engineering explores unknown-unknowns
    — emergent behavior (retry storms, cascading failures, a fallback that depends on the
    failed service) that only appears when real faults hit the real, running system. It
    complements, not replaces, testing.
  ref: concepts.md#what-chaos-engineering-is-and-is-not
- id: chaos-engineering-and-fault-injection-004
  difficulty: beginner
  tags:
  - principles
  - steady-state
  question: |
    What is the first step in the canonical chaos-engineering experimental loop?
  options:
  - Define a measurable 'steady state' that indicates normal system behavior
  - Inject the largest possible fault immediately to maximize the amount of failure signal you gather
  - Terminate a randomly selected production instance and then observe what breaks downstream
  - Write a blameless postmortem documenting the weaknesses before any fault has been injected
  answer: 0
  explanation: |
    The five-step loop begins with defining steady state — a measurable output (ideally a
    business metric like orders/sec) that indicates normal behavior. Everything else
    (hypothesis, fault injection, comparison) is measured against this baseline.
  ref: concepts.md#the-principles-of-chaos-engineering
- id: chaos-engineering-and-fault-injection-005
  difficulty: intermediate
  tags:
  - principles
  - order
  question: |
    Which sequence correctly orders the core chaos-engineering steps?
  options:
  - Inject fault → define steady state → hypothesize it holds → minimize blast radius after the fault has
    already been running
  - Define steady state → hypothesize it holds → inject a real-world fault → try to disprove the hypothesis
    (minimizing blast radius throughout)
  - Hypothesize → write the postmortem → inject the fault → define steady state once the results are already
    in hand
  - Minimize blast radius → inject fault → define steady state afterward → hypothesize what the metric should
    have been
  answer: 1
  explanation: |
    The loop is: (1) define steady state, (2) hypothesize it continues in both control and
    experiment groups, (3) inject a real-world fault, (4) try to disprove the hypothesis by
    comparing groups — with (5) minimizing blast radius as a constraint throughout.
  ref: concepts.md#the-principles-of-chaos-engineering
- id: chaos-engineering-and-fault-injection-006
  difficulty: advanced
  tags:
  - principles
  - scientific-method
  question: |
    In a chaos experiment, what is the correct scientific stance toward the hypothesis
    that "steady state holds during the fault"?
  options:
  - Seek out and collect only the evidence that confirms the hypothesis is true, ignoring contradictory
    signals
  - Assume it is true from the start and skip measuring the steady-state metric during the fault entirely
  - Prove it holds mathematically with a formal model before running any actual experiment on the system
  - Seek to disprove (falsify) it by looking for a difference between control and experiment groups
  answer: 3
  explanation: |
    The rigorous stance is falsification: you try to DISPROVE the hypothesis by looking for a
    meaningful divergence between the control group (no fault) and the experiment group
    (fault injected). A divergence reveals a weakness; no divergence builds confidence.
  ref: concepts.md#the-principles-of-chaos-engineering
- id: chaos-engineering-and-fault-injection-007
  difficulty: intermediate
  tags:
  - steady-state
  - metrics
  question: |
    Why is a business/throughput metric (e.g. Netflix's stream-starts-per-second, or
    orders/min) a better steady-state definition than a single host's CPU utilization?
  options:
  - Host CPU utilization is technically impossible to sample and export from production instances at
    experiment time
  - Business and throughput metrics are always cheaper to instrument and collect than a host-level CPU
    gauge
  - A business metric directly reflects customer-facing behavior and is stable/predictable, whereas CPU
    is noisy and doesn't indicate whether customers are affected
  - CPU utilization cannot be plotted on a time-series dashboard, whereas business metrics render natively
    as graphs
  answer: 2
  explanation: |
    A system can be healthy at 90% CPU or broken at 10% CPU, so CPU is a poor proxy for
    health. A business metric (SPS, orders/min) is customer-facing, stable, and predictable,
    so a deviation during an experiment is an unambiguous, high-signal indicator of impact.
  ref: concepts.md#steady-state-and-the-hypothesis
- id: chaos-engineering-and-fault-injection-008
  difficulty: intermediate
  tags:
  - steady-state
  - netflix
  question: |
    Netflix's classic steady-state metric for chaos experiments was SPS. What is SPS?
  options:
  - Stream starts per second — video playbacks initiated per second
  - Servers per second — the rate at which new instances are provisioned by the autoscaling group during
    traffic ramps
  - Successful pings per second — the number of load-balancer health-check probes returning OK each second
  - System processes per second — the count of OS-level processes spawned across the fleet each second
  answer: 0
  explanation: |
    SPS = stream starts per second, the rate at which customers begin playing video. It is
    smooth, follows a predictable daily curve, and is directly tied to customer experience,
    so a dip during an experiment is an unambiguous signal of customer impact.
  ref: concepts.md#steady-state-and-the-hypothesis
- id: chaos-engineering-and-fault-injection-009
  difficulty: advanced
  tags:
  - experiment
  - control-group
  question: |
    A mature chaos platform routes a small slice of traffic to an "experiment" group with
    the fault injected and an equal "control" group without it. Why use both groups instead
    of just comparing the experiment group to yesterday's numbers?
  options:
  - It halves the compute cost of the experiment by splitting the traffic slice across two smaller
    clusters
  - A concurrent control group isolates the fault's effect from confounders (traffic shifts, deploys,
    time-of-day), like an A/B test
  - Concurrent control groups are mandated by regulatory compliance frameworks for any production change
  - It lets you skip the step of defining a steady-state metric because the two groups define it implicitly
  answer: 1
  explanation: |
    A concurrent control group experiences the same real-time conditions (traffic mix,
    deploys, time-of-day) as the experiment group, so any divergence is attributable to the
    injected fault rather than confounders. This A/B-style design is more rigorous than
    comparing against a historical baseline.
  ref: concepts.md#steady-state-and-the-hypothesis
- id: chaos-engineering-and-fault-injection-010
  difficulty: beginner
  tags:
  - blast-radius
  - definition
  question: |
    What does "blast radius" mean in chaos engineering?
  options:
  - The physical distance in kilometers between the availability zones or data centers hosting the fleet
  - The number of engineers staffed on the on-call rotation who are watching the experiment
  - The maximum request latency, in milliseconds, that a service can tolerate before it is declared
    unhealthy
  - The scope of potential impact if the experiment's hypothesis turns out to be wrong
  answer: 3
  explanation: |
    Blast radius is how many customers, requests, hosts, or dollars could be affected if the
    hypothesis is wrong. Minimizing and controlling it is what keeps an experiment from
    becoming an incident.
  ref: concepts.md#blast-radius-and-guardrails
- id: chaos-engineering-and-fault-injection-011
  difficulty: intermediate
  tags:
  - blast-radius
  - guardrails
  question: |
    Which pair of guardrails is considered non-negotiable for any chaos experiment?
  options:
  - A dedicated physical war room booked for the duration and a freshly printed copy of the incident
    runbook on hand
  - A minimum of ten engineers actively watching the dashboards plus a written sign-off from an engineering
    manager
  - The ability to abort instantly (undo the fault) AND automated halt conditions tied to the steady-state
    metric
  - Root shell access to every host in the fleet and a full, verified backup of the primary database taken
    beforehand
  answer: 2
  explanation: |
    The two hard requirements are an instant abort / "big red button" that undoes the fault
    and restores service, plus automated halt conditions (kill switch) that auto-abort if the
    steady-state metric or a health alarm crosses a threshold. Without both, you are gambling.
  ref: concepts.md#blast-radius-and-guardrails
- id: chaos-engineering-and-fault-injection-012
  difficulty: intermediate
  tags:
  - blast-radius
  - ramp
  question: |
    You are running your first production chaos experiment on a critical service. What is
    the recommended approach to blast radius?
  options:
  - Start small (one host or ~1% of traffic) and widen gradually only after smaller experiments pass
  - Start with the entire fleet at once so you capture the most realistic, scale-dependent signal on the
    very first run
  - Run it at 3am with no one watching so that any customer complaints are minimized during off-peak hours
  - Inject the fault into all regions simultaneously to confirm global failover behaves identically
    everywhere
  answer: 0
  explanation: |
    The mature approach is a graduated ramp: begin with the smallest scope that yields signal
    (one host, 1% of traffic), verify the guardrails, then widen incrementally as confidence
    grows. Starting fleet-wide risks turning a wrong hypothesis into a full outage.
  ref: concepts.md#blast-radius-and-guardrails
- id: chaos-engineering-and-fault-injection-013
  difficulty: advanced
  tags:
  - blast-radius
  - tradeoff
  question: |
    What is the core trade-off between a large and a small blast radius?
  options:
  - A larger blast radius is always both safer to run and cheaper to operate than a small, tightly scoped
    one
  - A larger blast radius yields more realistic signal but risks a real outage; a smaller one is safer
    but may miss emergent, scale-dependent failures
  - A smaller blast radius always produces more realistic results because it introduces less confounding
    noise
  - Blast radius is purely an operational setting and has no effect at all on the quality of the results
    you obtain
  answer: 1
  explanation: |
    Bigger scope reveals correlated, scale-dependent behavior (more realistic) but risks real
    customer impact if the hypothesis is wrong. Smaller scope is safer but can miss emergent
    failures. The resolution is a graduated ramp with automated guardrails at every level.
  ref: concepts.md#blast-radius-and-guardrails
- id: chaos-engineering-and-fault-injection-014
  difficulty: beginner
  tags:
  - chaos-monkey
  - simian-army
  question: |
    What does Netflix's Chaos Monkey do?
  options:
  - Injects artificial latency and error responses into every RPC call a service makes to its dependencies
  - Simulates the loss of an entire AWS region by forcing a full evacuation to another region
  - Identifies and deletes unused cloud resources to reduce clutter and save on infrastructure cost
  - Randomly terminates production instances/VMs to ensure services tolerate instance loss routinely
  answer: 3
  explanation: |
    Chaos Monkey randomly kills production instances (during working hours) so that a server
    dying becomes a mundane, constantly-tested event rather than a rare, scary one. It forces
    engineers to build services that tolerate instance loss.
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-015
  difficulty: intermediate
  tags:
  - chaos-monkey
  - timing
  question: |
    Why did Netflix originally run Chaos Monkey on weekdays during business hours rather
    than overnight?
  options:
  - Because on-demand cloud compute is billed at a lower per-hour rate during daytime business hours
  - Because customer traffic reliably reaches its lowest point during weekday business hours, minimizing
    impact
  - So that instance failures happen while engineers are present and watching, able to respond and learn
  - To comply with an AWS terms-of-service clause that restricts instance termination to daytime windows
  answer: 2
  explanation: |
    Running during staffed business hours means failures occur while engineers are available
    to observe, respond, and fix any weakness the experiment exposes — a general guardrail
    principle (run during staffed windows, not unattended overnight).
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-016
  difficulty: intermediate
  tags:
  - simian-army
  - escalation
  question: |
    The Chaos Monkey → Chaos Gorilla → Chaos Kong escalation maps to which failure-domain
    hierarchy?
  options:
  - Thread → process → container
  - Instance → Availability Zone → Region
  - Request → session → user
  - Rack → building → city
  answer: 1
  explanation: |
    Chaos Monkey kills an instance, Chaos Gorilla simulates loss of an entire Availability
    Zone, and Chaos Kong simulates loss of an entire Region (forcing a region evacuation).
    The escalation is instance → AZ → region.
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-017
  difficulty: intermediate
  tags:
  - chaos-kong
  - dr
  question: |
    What does Chaos Kong exercise, and what resilience capability does it validate?
  options:
  - It simulates the loss of an entire AWS Region, validating full region failover/evacuation (DR)
  - It kills a single container in one pod; it validates that the orchestrator restarts the pod quickly
  - It injects clock skew across the fleet; it validates that NTP synchronization corrects the drift
  - It fills the disk on a host; it validates that log rotation reclaims space before the disk is full
  answer: 0
  explanation: |
    Chaos Kong takes out a whole region, forcing traffic to fail over to another region. It
    validates the organization's disaster-recovery / multi-region failover capability — see
    reliability-ops/disaster-recovery-rpo-rto-strategies.
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-018
  difficulty: advanced
  tags:
  - latency-monkey
  - simian-army
  question: |
    What did Latency Monkey inject, and why was it valuable?
  options:
  - It randomly terminated production instances outright; it tested whether autoscaling replaced the lost
    capacity in time
  - It identified and deleted unused cloud resources to reduce clutter and control ongoing infrastructure
    cost
  - It scanned for instances that violated configuration best practices and shut them down until they were
    brought into compliance
  - It introduced artificial delays and errors into RPC calls, simulating a degraded downstream without
    killing it — testing timeouts and circuit breakers
  answer: 3
  explanation: |
    Latency Monkey injected artificial delays (and error responses) into service calls,
    simulating a slow/degraded dependency. A slow dependency is a leading cause of cascading
    failure, so this tested whether timeouts, retries, and circuit breakers fire correctly.
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-019
  difficulty: intermediate
  tags:
  - simian-army
  - janitor
  question: |
    Which Simian Army member was responsible for cleaning up unused resources to reduce
    clutter and cost (later reimplemented as "Swabbie")?
  options:
  - Conformity Monkey
  - Janitor Monkey
  - Doctor Monkey
  - Security Monkey
  answer: 1
  explanation: |
    Janitor Monkey identified and removed unused cloud resources to control clutter and cost.
    Conformity Monkey enforced best practices, Doctor Monkey removed unhealthy instances, and
    Security Monkey found security misconfigurations.
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-020
  difficulty: advanced
  tags:
  - chap
  - continuous
  question: |
    Netflix's ChAP (Chaos Automation Platform) advanced the practice by doing what?
  options:
  - Scheduling one massive, fleet-wide experiment exactly once per year during a planned maintenance
    window, then relying on that annual snapshot for the following twelve months
  - Retiring the existing metrics and alerting stack entirely and treating the stream of chaos
    experiments as the sole source of production health signal
  - Continuously running experiments with automatic control/experiment groups and auto-termination if
    customer metrics deviate — realizing 'automated + continuous + minimal blast radius'
  - Confining every experiment to an isolated staging clone and forbidding any injection against live
    production traffic, on the principle that prod chaos is always too risky
  answer: 2
  explanation: |
    ChAP runs experiments continuously, routing small control and experiment populations
    through the service mesh and automatically aborting if customer metrics diverge. It is the
    fully realized form of the automate/continuous/minimal-blast-radius principles.
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-021
  difficulty: beginner
  tags:
  - fault-injection
  - definition
  question: |
    "Fault injection" in chaos engineering refers to what?
  options:
  - Deliberately introducing a failure condition (kill a process, add latency, fail a dependency) to observe
    the system's response
  - Automatically detecting and patching latent bugs in running production code without redeploying
    the service or interrupting in-flight requests
  - Injecting extra compute capacity into an autoscaling group the moment load rises so that the fleet
    never approaches a saturation point
  - Rolling back a bad deployment to the last known-good revision as soon as an error-rate alarm fires
    on the newly released version
  answer: 0
  explanation: |
    Fault injection is the mechanism of chaos engineering: intentionally introducing a
    realistic failure — instance death, latency, packet loss, dependency failure, resource
    exhaustion, clock skew — so you can watch how resilience mechanisms behave.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-022
  difficulty: advanced
  tags:
  - latency
  - cascading
  question: |
    Why is latency injection often considered the single most valuable fault to inject?
  options:
  - It is by far the easiest fault to implement, since a fixed sleep can be added at the network layer
    without touching any application code
  - Injected latency is absorbed entirely by the slow dependency and never propagates back to the
    caller, making it a completely safe fault to run in production
  - It automatically improves end-to-end response times by warming caches and connection pools along
    the exercised call path
  - A slow dependency (not a dead one) is the classic trigger of cascading failure and directly tests
    whether timeouts, circuit breakers, and bulkheads fire
  answer: 3
  explanation: |
    A dependency that is slow rather than down is often worse: callers block waiting, exhaust
    their thread/connection pools, and fail — even services that never called the slow one.
    Injecting latency validates timeouts, circuit breakers, and bulkheads (see
    reliability-ops/circuit-breakers-and-bulkheads).
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-023
  difficulty: intermediate
  tags:
  - fault-injection
  - mapping
  question: |
    You want to validate that your application gracefully serves cached/default content when
    the recommendation service is unavailable. Which fault should you inject?
  options:
  - Clock skew on the database host, jumping its system time forward several hours to expire cached
    recommendation entries early
  - A dependency failure — make the recommendation service return errors / be unreachable
  - CPU exhaustion on the load balancer so that recommendation responses are throttled before they can
    reach the application tier
  - Terminate the cluster's DNS resolver so that the recommendation service's hostname can no longer
    be resolved anywhere in the fleet
  answer: 1
  explanation: |
    To test fallback/graceful-degradation behavior for a specific dependency, you inject a
    dependency failure for that service and confirm the app degrades gracefully (cached or
    default content). See reliability-ops/graceful-degradation-and-fallbacks.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-024
  difficulty: intermediate
  tags:
  - fault-injection
  - mapping
  question: |
    Injecting instance/pod terminations primarily validates which resilience mechanisms?
  options:
  - Circuit breakers and bulkheads only, since an abruptly killed instance trips the caller's breaker
    exactly as a slow dependency would
  - Clock synchronization across the fleet, confirming that surviving nodes keep their NTP-disciplined
    clocks aligned after a peer disappears
  - Redundancy, health checks, and autoscaling (self-healing)
  - Log rotation and disk-cleanup jobs that reclaim space left behind by the terminated instance's
    orphaned log files
  answer: 2
  explanation: |
    Killing instances tests whether redundant peers absorb the load, health checks detect and
    route around the dead node, and autoscaling replaces it — see
    reliability-ops/redundancy-failover-and-health-checks.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-025
  difficulty: advanced
  tags:
  - fault-injection
  - clock-skew
  question: |
    Which class of real-world bugs is clock-skew injection specifically designed to surface?
  options:
  - 'Time-dependent bugs: certificate/TTL/token expiry, NTP drift, leap-second handling'
  - Memory leaks in the JVM heap that only manifest after the old generation fills and full GC pauses
    begin to lengthen under sustained load
  - SQL injection vulnerabilities where unsanitized user input is concatenated directly into a query
    and reaches the database driver
  - Load-balancer misconfiguration such as an unhealthy target left in rotation because its health-check
    path returns a 200 for the wrong reason
  answer: 0
  explanation: |
    Injecting clock skew (jumping time forward/back or drifting it) exposes time-sensitive
    logic: cert expiry, token/TTL calculations, leap-second handling, and cache-expiry bugs
    that only manifest when the clock is wrong.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-026
  difficulty: advanced
  tags:
  - fault-injection
  - resilience-mechanism
  question: |
    An interviewer notes that "many real outages are the safety mechanism itself not working."
    What subtle chaos experiment addresses this directly?
  options:
  - Restrict every experiment to instance kills alone, on the theory that a terminated host is the only
    fault that meaningfully stresses a resilience mechanism
  - Deliberately exempt all resilience mechanisms from fault injection so that a safety control is never
    itself put under test during an experiment
  - Confine every experiment to a staging environment so the resilience mechanisms are only ever
    exercised away from live production traffic
  - Deliberately fail the fallback path or the resilience mechanism itself, e.g. verify a fallback doesn't
    secretly depend on the failed service
  answer: 3
  explanation: |
    A fallback that secretly depends on the service that failed, or a circuit breaker with the
    wrong threshold, is only exposed by injecting the fault and watching the mechanism behave.
    Testing the safety mechanism itself catches these hidden failure modes.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-027
  difficulty: intermediate
  tags:
  - fault-injection
  - resource-exhaustion
  question: |
    Injecting resource exhaustion (burning CPU, leaking memory, filling disk) most directly
    validates which reliability mechanism?
  options:
  - DNS failover, verifying that resolvers cut over to a secondary zone once the primary stops answering
    queries under the resource pressure
  - Load shedding and backpressure (protecting the system under resource pressure)
  - Blameless postmortems, ensuring the write-up process captures the resource-exhaustion timeline
    without assigning individual blame
  - Certificate rotation, confirming that expiring TLS certificates are reissued and redeployed before
    the resource pressure causes handshake failures
  answer: 1
  explanation: |
    Resource exhaustion simulates noisy neighbors and capacity limits. It validates load
    shedding and backpressure — whether the system sheds low-priority work to protect itself
    — see reliability-ops/load-shedding-and-backpressure.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-028
  difficulty: beginner
  tags:
  - gameday
  - definition
  question: |
    What is a "GameDay"?
  options:
  - A calendar day on which all deployments are frozen fleet-wide so that no configuration changes can
    perturb the environment while traffic is at its seasonal peak
  - A recurring sprint-planning meeting where the team estimates upcoming reliability work and grooms
    the backlog of resilience-related tickets
  - A planned, scheduled failure exercise where a team deliberately injects a failure and observes how
    the system AND the people/process respond
  - A day dedicated to writing unit tests to close coverage gaps across the service before the next
    release candidate is cut
  answer: 2
  explanation: |
    A GameDay (coined at Amazon by Jesse Robbins) is a planned failure exercise: the team
    injects a fault and watches how the system responds AND how alerting, on-call, runbooks,
    and communication perform — testing the humans and process, not just the machines.
  ref: concepts.md#gamedays-planned-failure-exercises
- id: chaos-engineering-and-fault-injection-029
  difficulty: intermediate
  tags:
  - gameday
  - chaos-monkey
  - comparison
  question: |
    What is the key difference between a GameDay and an automated tool like Chaos Monkey?
  options:
  - A GameDay is a planned, often manual, broad-scope exercise testing system + humans + process; Chaos
    Monkey is an automated, continuous, narrow-scope tool testing one failure mode
  - A GameDay is fully automated and runs continuously in the background, whereas Chaos Monkey must be
    triggered by hand for each individual instance termination
  - They are identical in every way, differing only in the name each organization happens to give the
    same underlying continuous injection tool
  - Chaos Monkey is the exercise that tests humans, alerting, and runbooks, while a GameDay is a tool
    limited to testing machine-level failure modes
  answer: 0
  explanation: |
    GameDays are periodic, broad, often human-in-the-loop exercises that test the whole
    socio-technical system (alerts, on-call, runbooks). Chaos Monkey is automated, continuous,
    and narrow (instance death). Mature orgs run both.
  ref: concepts.md#gamedays-planned-failure-exercises
- id: chaos-engineering-and-fault-injection-030
  difficulty: advanced
  tags:
  - gameday
  - human-response
  question: |
    A team runs a GameDay and the system tolerates the fault perfectly, but no alert fired
    and on-call was never paged. What is the correct interpretation?
  options:
  - The GameDay was a waste of time, since the system survived the fault untouched and therefore
    produced nothing worth acting on afterward
  - Alerts are unnecessary for this failure mode because the system self-healed on its own without any
    human intervention being required
  - The experiment result should be discarded from the record because there was no measurable customer
    impact to attribute to the injected fault
  - 'The GameDay found a real weakness: detection/alerting is broken — a silent failure that would delay
    response to a real incident'
  answer: 3
  explanation: |
    GameDays test the human/process response, not just the system. A fault the system survives
    but that no alert catches is a serious finding: in a real, larger incident you'd have no
    detection. This should become a prioritized fix (see incident-response and observability).
  ref: concepts.md#gamedays-planned-failure-exercises
- id: chaos-engineering-and-fault-injection-031
  difficulty: intermediate
  tags:
  - gameday
  - follow-through
  question: |
    A GameDay uncovers three bugs and a stale runbook, but the team files no tickets and
    makes no changes. Why is this a problem?
  options:
  - It isn't a problem at all; observing the failure firsthand during the exercise is the entire goal,
    and remediation is a separate concern handled elsewhere
  - A chaos exercise that finds problems but doesn't drive fixes is theater — the value is realized only
    when weaknesses are fixed and re-verified
  - GameDays are not intended to surface bugs in the first place, so uncovering three of them means the
    exercise was scoped incorrectly from the start
  - The team should stop running GameDays entirely, since an exercise that keeps exposing defects is
    doing more harm to morale than good for reliability
  answer: 1
  explanation: |
    Follow-through is essential: findings must be filed, prioritized, fixed, and then the
    experiment re-run to verify. Debriefing via a blameless postmortem and driving action
    items is what turns a GameDay from theater into resilience improvement.
  ref: concepts.md#gamedays-planned-failure-exercises
- id: chaos-engineering-and-fault-injection-032
  difficulty: advanced
  tags:
  - gameday
  - unannounced
  question: |
    What is the trade-off of running an *unannounced* GameDay (on-call is not told in advance)?
  options:
  - It is strictly better than an announced one with no downside whatsoever, so mature teams should
    always run their GameDays unannounced by default
  - It removes the need for any abort mechanism, because the surprise element inherently keeps the
    experiment's blast radius small on its own
  - It tests detection and human response more realistically, but raises the stakes and risk if the response
    goes badly
  - It guarantees zero customer impact, since on-call being unaware means the fault is automatically
    contained before any request is affected
  answer: 2
  explanation: |
    Not warning on-call makes the exercise a realistic test of whether alerts fire and people
    respond correctly. The cost is higher stakes: if the response falters, real impact is more
    likely — so guardrails and abort criteria remain essential.
  ref: concepts.md#gamedays-planned-failure-exercises
- id: chaos-engineering-and-fault-injection-033
  difficulty: intermediate
  tags:
  - prerequisites
  - observability
  question: |
    Why is observability considered a prerequisite for chaos engineering?
  options:
  - You must be able to measure the steady state and see the fault's effect in near-real-time; without
    it you inject faults blind and can't detect divergence or know when to abort
  - Observability tools are what actually inject the faults, so a metrics-and-tracing stack is required
    simply to deliver the latency or instance-kill into the system
  - Observability makes experiments complete faster by parallelizing fault injection across more hosts
    once dashboards confirm the fleet is healthy
  - It is not a prerequisite at all; you can safely run chaos with no monitoring and reconstruct the
    fault's impact afterward from application logs alone
  answer: 0
  explanation: |
    Chaos engineering consumes telemetry: you need dashboards/metrics/alerting to measure the
    steady state, detect a divergence, and trigger the abort. Without observability you're
    injecting faults blind. How you collect/alert on metrics is observability's domain.
  ref: concepts.md#prerequisites-and-maturity
- id: chaos-engineering-and-fault-injection-034
  difficulty: intermediate
  tags:
  - prerequisites
  - anti-pattern
  question: |
    Your service has NO redundancy and you already know killing its single instance causes an
    outage. Should you run Chaos Monkey on it to "prove" this?
  options:
  - Yes, running the experiment against the single instance is the only rigorous way to be sure the
    outage really happens exactly as you predict
  - Yes, but you must run it directly in production, because a staging clone would never reproduce the
    single-instance failure faithfully enough
  - No, because Chaos Monkey is architecturally incapable of terminating instances and only injects
    latency into a service's outbound RPC calls
  - No — chaos exists to surface UNKNOWN weaknesses; fix the known single-instance weakness first, then
    use chaos to find what you don't know
  answer: 3
  explanation: |
    Don't run chaos to confirm a weakness you already know about; you'd just cause a
    predictable outage. Fix the known problem (add redundancy) first. Baseline resilience is a
    prerequisite; chaos is for discovering the unknown-unknowns.
  ref: concepts.md#prerequisites-and-maturity
- id: chaos-engineering-and-fault-injection-035
  difficulty: beginner
  tags:
  - prerequisites
  - timing
  question: |
    When should you NEVER run a chaos experiment?
  options:
  - During staffed weekday business hours when engineers are watching
  - During an active incident or a known-degraded state
  - When observability is fully in place
  - When you have an abort mechanism ready
  answer: 1
  explanation: |
    Running chaos during an active incident amplifies a real outage and makes it impossible to
    distinguish injected from real failure. Never inject faults during an incident, deploy
    freeze, or known-degraded state.
  ref: concepts.md#prerequisites-and-maturity
- id: chaos-engineering-and-fault-injection-036
  difficulty: advanced
  tags:
  - maturity
  - axes
  question: |
    The chaos-engineering maturity model tracks progress along which two axes?
  options:
  - Cost and headcount
  - Latency and throughput
  - Sophistication (ad-hoc/manual/staging → automated/continuous/production with guardrails) and adoption
    (one engineer → org-wide across critical services)
  - Number of tools and number of dashboards
  answer: 2
  explanation: |
    Maturity advances on sophistication (manual staging experiments → automated, continuous
    production experiments with control groups and auto-guardrails) and adoption (a side
    project → an org-wide practice covering all critical services).
  ref: concepts.md#prerequisites-and-maturity
- id: chaos-engineering-and-fault-injection-037
  difficulty: intermediate
  tags:
  - staging-vs-prod
  - tradeoff
  question: |
    Why does the Principles of Chaos manifesto advocate running experiments in production,
    not just staging?
  options:
  - Staging never faithfully reproduces production's scale, traffic mix, data volume, configuration, and
    dependency topology — the highest-value emergent failures only appear in prod
  - Production is simply cheaper to experiment on, because a full staging clone must be provisioned
    separately and roughly doubles the monthly infrastructure bill
  - Staging environments are architecturally unable to run monitoring or metrics agents, so an experiment's
    effect can never be observed there at all
  - Fault-injection experiments are formally prohibited in staging by the Principles of Chaos manifesto
    and permitted only against live production traffic
  answer: 0
  explanation: |
    Staging is an approximation; real scale, traffic patterns, config, and dependency
    topology exist only in production, where the most surprising emergent failures appear.
    You de-risk prod experiments with small blast radius and guardrails, not by avoiding prod.
  ref: concepts.md#staging-vs-production-and-continuous-chaos
- id: chaos-engineering-and-fault-injection-038
  difficulty: intermediate
  tags:
  - continuous
  - regression
  question: |
    Why do mature programs automate chaos experiments to run continuously rather than as
    one-off events?
  options:
  - To reduce the cloud bill, since a scheduler packing many small experiments into off-peak windows is
    billed at a lower spot-instance rate than manual runs
  - Because running an experiment only once is explicitly forbidden by SRE governance policy, which mandates
    a minimum recurring cadence for every fault type
  - Because automated tooling computes the steady-state baseline for you, removing any need to define or
    instrument a steady-state metric before the run
  - Because systems change constantly (deploys, new dependencies, config drift), so resilience regresses
    silently; continuous chaos catches regressions like a CI test
  answer: 3
  explanation: |
    A one-off experiment only proves resilience on that day, in that config. Ongoing changes
    cause resilience to regress silently. Continuous, automated experiments catch those
    regressions the way CI catches code regressions.
  ref: concepts.md#staging-vs-production-and-continuous-chaos
- id: chaos-engineering-and-fault-injection-039
  difficulty: beginner
  tags:
  - staging-vs-prod
  - progression
  question: |
    What is the recommended progression for where to run chaos experiments?
  options:
  - Only ever in production, from day one, at full fleet scale, on the principle that any smaller-scope
    rehearsal produces misleading signal not worth acting on
  - Only ever in staging or a pre-production clone; live production must never be touched by a fault-injection
    experiment under any circumstances
  - Start in staging to learn the tooling and validate abort, then graduate to production with small blast
    radius and guardrails
  - Start in production at full scale to capture the real signal first, then retreat to staging to reproduce
    and characterize whatever broke
  answer: 2
  explanation: |
    Begin in staging/pre-prod to learn the tools and validate the abort mechanism cheaply and
    safely, then graduate to production (where the real signal is) with small blast radius and
    automated guardrails.
  ref: concepts.md#staging-vs-production-and-continuous-chaos
- id: chaos-engineering-and-fault-injection-040
  difficulty: advanced
  tags:
  - scenario
  - latency
  - judgment
  question: |
    A hypothesis states "adding 300ms of latency to the payments API will keep checkout
    success rate within its normal band because our 250ms timeout + circuit breaker trip and
    we fall back to a queued-payment flow." During the experiment, checkout success rate drops
    50%. What have you most likely learned?
  options:
  - The experiment was invalid and should be discarded, because a 50% drop is too large to have been caused
    by only 300 ms of injected latency and must be a measurement artifact
  - A resilience mechanism failed as designed — e.g. the timeout is longer than 250ms, the breaker didn't
    trip, or the fallback isn't wired — a real weakness to fix
  - That latency injection is technically impossible against a payments API, since PCI-compliant gateways
    strip any injected delay before the request reaches the service
  - That the checkout service simply needs more CPU headroom, and provisioning larger instances would keep
    success rate in band without touching the timeout or breaker
  answer: 1
  explanation: |
    The steady-state metric diverged sharply, falsifying the hypothesis. That is the point:
    you found a weakness. Likely the timeout is misconfigured, the circuit breaker didn't trip,
    or the fallback path is broken. Investigate, fix, and re-run to verify.
  ref: concepts.md#steady-state-and-the-hypothesis
- id: chaos-engineering-and-fault-injection-041
  difficulty: intermediate
  tags:
  - scenario
  - mapping
  - dr
  question: |
    Leadership wants confidence that the company can survive losing an entire AWS region.
    Which chaos activity best validates this?
  options:
  - Run a region-loss experiment / Chaos Kong (or a large DR GameDay) that forces a full region failover
  - Run Chaos Monkey to kill one instance and infer region survival by extrapolating from how quickly that
    single host is replaced by autoscaling
  - Inject clock skew across the fleet, on the theory that region failover is gated by time synchronization
    between the primary and standby regions
  - Fill the disk on a single database node and confirm the node recovers, treating that as a proxy for the
    whole region evacuating cleanly
  answer: 0
  explanation: |
    Validating region survival requires exercising a region evacuation — Chaos Kong or a
    large-scale DR GameDay that forces failover to another region. This tests the DR strategy
    end-to-end (see reliability-ops/disaster-recovery-rpo-rto-strategies).
  ref: concepts.md#the-simian-army-chaos-monkey-to-chaos-kong
- id: chaos-engineering-and-fault-injection-042
  difficulty: advanced
  tags:
  - scenario
  - anti-pattern
  - retry-storm
  question: |
    During a latency-injection experiment against a downstream service, overall system load
    *increases* dramatically and other services start failing. Which emergent anti-pattern
    has the experiment most likely revealed?
  options:
  - A slow memory leak in the load balancer that only surfaces once injected latency lengthens each
    connection's lifetime enough to accumulate leaked buffers
  - A DNS misconfiguration in which the injected delay causes resolver caches to expire and forces
    repeated, slow re-resolution of the downstream hostname
  - A retry storm / cascading failure — clients retrying the slow dependency amplify load and exhaust
    shared resources
  - A clock-skew bug where the added latency pushes request timestamps far enough apart to trip
    time-window validation and manifest as a spike in load
  answer: 2
  explanation: |
    When injected latency causes load to balloon and unrelated services to fail, the classic
    culprit is a retry storm feeding a cascading failure: callers retry the slow dependency
    without proper backoff/jitter or circuit breaking, amplifying load. See
    reliability-ops/cascading-failures-and-antipatterns and retries-timeouts-and-backoff.
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-043
  difficulty: intermediate
  tags:
  - hypothesis
  - framing
  question: |
    Which is the best-formed chaos hypothesis?
  options:
  - If we break the database in some way, something bad will probably happen to the checkout flow and we
    will observe it on the dashboards at the time
  - We should test the system by turning various components off during the next maintenance window and
    seeing broadly how the fleet reacts to each one
  - The system has already been engineered to be resilient, so running a formal experiment against it is
    unnecessary and would only add operational risk
  - If we terminate 20% of checkout-service instances, orders/min will stay within its normal band because
    autoscaling and remaining capacity absorb the loss within ~60s
  answer: 3
  explanation: |
    A good hypothesis names a specific fault, a measurable steady-state metric with a
    tolerance band, and the mechanism expected to preserve it, plus a rough recovery time. It
    is falsifiable — you can compare the actual metric against the predicted band.
  ref: concepts.md#steady-state-and-the-hypothesis
- id: chaos-engineering-and-fault-injection-044
  difficulty: advanced
  tags:
  - scenario
  - guardrails
  - judgment
  question: |
    Mid-experiment, the steady-state metric crosses the abort threshold you configured. What
    should happen?
  options:
  - Let the experiment continue running to gather more data points, since a single threshold breach may
    be transient noise that self-corrects within a minute or two
  - The automated halt condition should immediately abort the experiment, undo the fault, and restore
    normal operation; then investigate
  - Widen the blast radius to a larger slice of traffic to confirm the result is real before deciding
    whether the abort was genuinely warranted
  - Page the CEO and senior leadership for a go/no-go decision before touching the running experiment or
    its injected fault in any way
  answer: 1
  explanation: |
    Crossing the abort threshold means the hypothesis is failing and customer impact is
    mounting. The kill switch / automated halt condition should immediately stop the fault and
    restore service. You then investigate the weakness offline and fix before re-running.
  ref: concepts.md#blast-radius-and-guardrails
- id: chaos-engineering-and-fault-injection-045
  difficulty: beginner
  tags:
  - tools
  - ecosystem
  question: |
    Which of the following is a chaos-engineering / fault-injection tool?
  options:
  - Prometheus, the time-series database and alerting stack that injects synthetic faults through its
    recording-rule engine to probe service resilience
  - Terraform, whose apply/destroy cycle is used to tear down and recreate resources as the primary way
    to inject controlled infrastructure faults
  - AWS Fault Injection Service (FIS) / Gremlin / LitmusChaos
  - Jenkins, which orchestrates fault-injection by intentionally failing pipeline stages to simulate
    outages of the services those stages deploy
  answer: 2
  explanation: |
    AWS FIS, Gremlin, LitmusChaos, Chaos Mesh, Azure Chaos Studio, and Netflix Chaos Monkey
    are fault-injection tools. Prometheus is observability, Terraform is IaC, and Jenkins is
    CI/CD — supporting, but not chaos-injection, tools.
  ref: concepts.md#staging-vs-production-and-continuous-chaos
- id: chaos-engineering-and-fault-injection-046
  difficulty: advanced
  tags:
  - scenario
  - judgment
  - prerequisites
  question: |
    A new team with no dashboards, no alerting, and no ability to quickly roll back wants to
    start chaos engineering in production tomorrow. What is the best advice?
  options:
  - 'Hold off: first establish observability and an abort/recovery capability and basic resilience; without
    them, production chaos is reckless, not experimental'
  - Go ahead tomorrow — the act of running chaos experiments will itself build out the missing dashboards
    and alerting as a natural side effect
  - Start with Chaos Kong on production to maximize learning, on the reasoning that the largest fault
    reveals the most weaknesses in the shortest time
  - Skip the observability work for now but schedule every experiment for 3am so the lack of monitoring
    and rollback carries acceptably low risk
  answer: 0
  explanation: |
    Prerequisites come first: observability to measure/see impact, an instant abort and
    recovery capability, and baseline resilience. Injecting faults in prod without these is
    blind and reckless. Establish the foundation, start in staging, then graduate to prod.
  ref: concepts.md#prerequisites-and-maturity
- id: chaos-engineering-and-fault-injection-047
  difficulty: intermediate
  tags:
  - well-architected
  - aws
  question: |
    The AWS Well-Architected Reliability pillar recommends using fault injection to do what?
  options:
  - Replace all backups, on the basis that a workload proven to survive injected faults no longer needs
    point-in-time restore capability
  - Reduce the cost of compute by identifying and terminating over-provisioned instances that faults reveal
    to be unnecessary for steady-state load
  - Encrypt data at rest, using fault-injection experiments to confirm that keys rotate correctly whenever
    a storage volume is disrupted
  - Test how the workload responds to failures and validate that recovery procedures work, rather than
    assuming resilience
  answer: 3
  explanation: |
    Well-Architected's "Test Reliability" guidance says to use fault injection (e.g. AWS FIS)
    to inject real failures and verify the workload recovers as designed — you validate
    resilience empirically instead of assuming it.
  ref: concepts.md#what-chaos-engineering-is-and-is-not
- id: chaos-engineering-and-fault-injection-048
  difficulty: advanced
  tags:
  - scenario
  - network-partition
  question: |
    You inject a network partition between your service and its primary database and observe
    that the service returns errors AND a "read replica" fallback also fails. What is the most
    valuable lesson?
  options:
  - Network partitions essentially never happen in practice on modern cloud networks, so the doubled
    failure is an artifact of the injection tool rather than a real risk
  - The fallback shares a failure domain with the primary path (e.g. same partitioned network segment)
    — a hidden correlated dependency the experiment exposed
  - The primary database simply needs a faster CPU, since the replica fallback would have answered in time
    had the query completed more quickly before the partition
  - The experiment proves the system is fully resilient to partitions, because exercising the fallback at
    all confirms the redundant path was correctly wired
  answer: 1
  explanation: |
    A fallback that fails alongside the primary during a partition reveals a correlated
    dependency / shared failure domain — the "redundant" path wasn't independent. This is
    exactly the kind of hidden weakness chaos surfaces (see redundancy-failover and
    system-design's correlated-failure discussion).
  ref: concepts.md#fault-injection-types
- id: chaos-engineering-and-fault-injection-049
  difficulty: intermediate
  tags:
  - definition
  - misconception
  question: |
    "Chaos engineering is only for Netflix-scale companies." Why is this a misconception?
  options:
  - It is actually correct; small companies genuinely cannot benefit, because chaos value only emerges
    once a fleet is large enough for statistically significant control and experiment groups
  - Only companies operating more than 10,000 servers can run experiments, since below that scale the
    Simian Army tooling has no meaningful population of instances to target
  - Any distributed system with hard dependencies benefits, and you can start small in staging with a
    single fault — the practice scales down
  - Small companies simply have no real failures worth testing, as their limited traffic never stresses
    dependencies enough to expose emergent behavior
  answer: 2
  explanation: |
    The practice scales to any distributed system with real dependencies. You don't need a
    Simian Army; you can start with one fault in staging and a simple hypothesis. The
    discipline (controlled experiment + follow-through) matters more than the scale.
  ref: concepts.md#what-chaos-engineering-is-and-is-not
- id: chaos-engineering-and-fault-injection-050
  difficulty: advanced
  tags:
  - scenario
  - judgment
  - when-not
  question: |
    An experiment "succeeds" — the injected fault causes no measurable divergence in the
    steady-state metric. What is the correct next action for a mature program?
  options:
  - Record the confidence gained, then widen the blast radius one increment and/or automate the experiment
    so the resilience is continuously re-verified as the system changes
  - Declare the system provenly perfect and stop all further chaos work, since a clean result means no
    remaining weaknesses exist anywhere in the architecture
  - Immediately escalate to running Chaos Kong on production, treating one successful small-scope result
    as sufficient justification for a full region-loss test
  - Delete the observability dashboards used for the run, since a passing experiment demonstrates they
    added no value and only consume storage
  answer: 0
  explanation: |
    No divergence builds confidence for that scope. The mature response is to gradually widen
    the blast radius and/or automate the experiment to run continuously, so silent resilience
    regressions from future changes are caught — not to declare victory and stop.
  ref: concepts.md#blast-radius-and-guardrails
- id: chaos-engineering-and-fault-injection-051
  difficulty: advanced
  tags:
  - blast-radius
  - magnitude
  - distinction
  question: |
    In chaos engineering, how do "blast radius" and "magnitude" differ as dimensions of an
    experiment?
  options:
  - Blast radius is the scope (how many hosts/requests/users are affected); magnitude is the intensity
    of the fault (e.g. 50 ms vs 5 s of latency, 10% vs 100% packet loss)
  - They are exact synonyms for the same concept and are used interchangeably in the literature, differing
    only by which vendor's documentation happens to use each word
  - Blast radius is the fault's intensity per unit, whereas magnitude counts the number of on-call
    engineers actively watching the experiment's dashboards
  - Magnitude is a dial that applies only to network faults such as latency or packet loss, while blast
    radius is a dial that applies only to instance-kill experiments
  answer: 0
  explanation: |
    Blast radius = breadth (how many things can be affected); magnitude = depth/intensity (how
    severe the fault is per affected unit). They are independent dials you minimize and ramp
    separately, so that when a divergence appears you know which dimension caused it.
  ref: concepts.md#blast-radius-vs-magnitude-two-independent-dials
- id: chaos-engineering-and-fault-injection-052
  difficulty: advanced
  tags:
  - magnitude
  - ramp
  - method
  question: |
    Why is it recommended to ramp blast radius and magnitude one dimension at a time rather
    than increasing both together?
  options:
  - It makes the overall experiment finish faster, because a single combined ramp reaches the target
    scope-and-intensity in fewer discrete steps than two separate ramps
  - Ramping both dimensions together at once is actually required to obtain any usable signal, since a
    fault is only detectable when breadth and intensity rise in lockstep
  - So that when a divergence appears you can attribute it to a specific dial; changing both simultaneously
    loses diagnostic clarity and risks overshooting into an incident
  - Because magnitude is fixed at experiment-definition time and physically cannot be changed once the run
    has started, leaving blast radius as the only adjustable dial
  answer: 2
  explanation: |
    Holding one dimension fixed while ramping the other preserves cause-and-effect clarity: a
    divergence is attributable to the dial you changed. Ramping both at once conflates them and
    can overshoot into real customer impact.
  ref: concepts.md#blast-radius-vs-magnitude-two-independent-dials
- id: chaos-engineering-and-fault-injection-053
  difficulty: expert
  tags:
  - littles-law
  - cascading
  - numbers
  question: |
    A service calls a dependency at 200 req/s. Normally the dependency responds in 50 ms, so
    ~10 requests are in flight concurrently. The dependency degrades to a 5 s response time (it
    is slow, not down) while arrival rate stays 200 req/s. Using Little's Law, roughly how many
    requests are now concurrently in flight, and what is the consequence for a 200-thread pool?
  options:
  - "~10 in flight; concurrency is set by arrival rate alone, so a slower response time does not change how
    many requests are outstanding and the 200-thread pool is entirely fine"
  - "~40 in flight; the extra delay adds only a small constant of a few requests, so the pool absorbs it
    comfortably with well over 150 threads still free at any moment"
  - "~1000 in flight; concurrency exceeds the 200-thread pool, threads block and the pool exhausts, cascading
    backpressure upstream"
  - "~200 in flight; concurrency rises to exactly the pool size and sits precisely at capacity, fully utilized
    but with no thread blocking and therefore no cascade risk"
  answer: 2
  explanation: |
    Little's Law L = λ × W = 200 × 5 = 1000 concurrent requests, versus 200 × 0.05 = 10
    normally — a 100× increase. That far exceeds a 200-thread pool, so threads block waiting,
    the pool saturates, and backpressure cascades to callers that never touched the slow dep.
  ref: concepts.md#latency-and-cascading-failure-the-littles-law-mechanism
- id: chaos-engineering-and-fault-injection-054
  difficulty: expert
  tags:
  - littles-law
  - slow-vs-down
  - mechanism
  question: |
    Why does a *slow* dependency typically cause more damage than a *completely down* one, in
    terms of resource consumption?
  options:
  - A slow dependency holds the caller's thread/connection for the full timeout, exhausting the pool; a
    down one fails fast and frees the resource immediately
  - A down dependency consumes far more CPU on the caller, because the connection-refused error triggers
    an expensive retry-and-backoff loop that a slow response never invokes
  - A slow dependency uses substantially more network bandwidth than a down one, since the still-open TCP
    connection keeps retransmitting keepalive traffic for the whole request duration
  - There is no meaningful difference; a slow dependency and a down one both tie up the same caller-side
    resources for the same duration and are functionally equivalent failures
  answer: 0
  explanation: |
    A dead dependency returns an error (or connection-refused) in milliseconds, freeing the
    thread and bounding concurrency. A slow one holds each thread/connection for the whole
    timeout window, silently exhausting the pool — which is exactly why latency injection is the
    highest-value fault and why tight timeouts + circuit breakers matter.
  ref: concepts.md#latency-and-cascading-failure-the-littles-law-mechanism
- id: chaos-engineering-and-fault-injection-055
  difficulty: advanced
  tags:
  - littles-law
  - timeout
  - fix
  question: |
    Given the slow-dependency cascade mechanism (Little's Law), which pair of mechanisms most
    directly bounds in-flight concurrency and stops it?
  options:
  - Growing the thread pool without limit and retrying every failed call as many times as it takes
  - Increasing the request arrival rate deliberately so the backlog of queued work is flushed through faster
  - Disabling health checks entirely so slow or failing nodes are never removed from the load-balancer rotation
  - A tight timeout (bounds W, the time each request is held) plus a circuit breaker (stops sending to
    the slow dependency)
  answer: 3
  explanation: |
    Since L = λ × W, capping W with a tight timeout directly bounds concurrency, and a circuit
    breaker stops feeding the failing dependency once it trips. Growing the pool or retrying
    unboundedly makes cascades worse; those are the wrong-in-practice distractors.
  ref: concepts.md#latency-and-cascading-failure-the-littles-law-mechanism
- id: chaos-engineering-and-fault-injection-056
  difficulty: advanced
  tags:
  - fit
  - netflix
  - blast-radius
  question: |
    How does Netflix FIT (Failure Injection Testing) scope blast radius differently from Chaos
    Monkey?
  options:
  - FIT scopes by host, selecting an instance to terminate exactly as Chaos Monkey does, differing only in
    its friendlier control dashboard
  - FIT is restricted to pre-production and can only inject faults in a staging clone, never against live
    production requests
  - FIT scopes by request/user/device — you choose which requests experience the failure — whereas Chaos
    Monkey scopes by host
  - FIT scopes only at the AWS region level, evacuating an entire region for each experiment run
  answer: 2
  explanation: |
    Chaos Monkey picks a host to kill (affecting whoever it served). FIT works on an orthogonal
    axis: it decorates specific requests with a failure context, so you can target, say, 1% of
    requests from one device type — precision by request rather than by host.
  ref: concepts.md#netflix-fit-request-level-fault-injection
- id: chaos-engineering-and-fault-injection-057
  difficulty: expert
  tags:
  - fit
  - mechanism
  - zuul
  question: |
    In Netflix FIT, how does a chosen failure actually get applied across a request's call
    graph?
  options:
  - The FIT service directly terminates the target microservice instances hosting the request path, one
    process at a time until the fault is observed
  - FIT rewrites every downstream service's load-balancer routing table before the test so matching traffic
    is diverted to a failure stub
  - FIT pushes failure metadata to Zuul, which decorates matching requests with a failure context that
    propagates downstream; injection points (Hystrix, Ribbon, EVCache, Astyanax) inspect it and simulate
    the fault
  - Faults are applied exclusively at the database persistence layer, by rejecting a fraction of the queries
    the request would issue
  answer: 2
  explanation: |
    FIT pushes scenario metadata to Zuul (the edge). Zuul tags matching requests with a failure
    context that propagates to every downstream service; each injection point (Hystrix, Ribbon,
    EVCache, Astyanax) checks the context and, if it matches, sleeps, returns a 500, or throws.
  ref: concepts.md#netflix-fit-request-level-fault-injection
- id: chaos-engineering-and-fault-injection-058
  difficulty: advanced
  tags:
  - fit
  - latency-monkey
  - contrast
  question: |
    Contrast FIT request-level injection with server-side Latency Monkey. What is the key
    difference in who is affected?
  options:
  - Latency Monkey lets each individual caller opt specific requests into the failure, whereas FIT degrades
    the service for every caller at once
  - FIT lets a caller opt specific requests into the failure; server-side Latency Monkey impacts all callers
    of that service whether they want it or not
  - Both affect exactly the same set of requests, since the failure context and the server-side sleep are
    applied at the identical injection point
  - Neither mechanism offers any way to control which requests are affected; both hit a uniformly random
    fraction of all traffic
  answer: 1
  explanation: |
    Server-side latency injection (Latency Monkey) degrades the service for all callers
    indiscriminately. FIT's request-scoped context lets you opt specific requests in, giving a
    much finer, safer blast radius — the reason it bridges isolated tests and large-scale chaos.
  ref: concepts.md#netflix-fit-request-level-fault-injection
- id: chaos-engineering-and-fault-injection-059
  difficulty: expert
  tags:
  - aws-fis
  - template
  - anatomy
  question: |
    An AWS FIS experiment template is composed of which three core elements?
  options:
  - Regions to run in, subnets to place the experiment in, and the security groups controlling its network
    access
  - CloudWatch alarms, monitoring dashboards, and the log groups where the experiment's output events are
    written
  - Actions (the faults), targets (which resources, by ID/tag/state), and stop conditions (CloudWatch alarms
    that auto-halt and roll back)
  - The IAM users, execution roles, and permission policies that authorize the experiment to run
  answer: 2
  explanation: |
    A FIS experiment template = actions + targets + stop conditions. Actions run sequentially
    or in parallel for a duration; targets are selected by resource ID, tags, or state; stop
    conditions are CloudWatch alarms that automatically halt and roll back the experiment.
  ref: concepts.md#aws-fis-experiment-template-anatomy
- id: chaos-engineering-and-fault-injection-060
  difficulty: expert
  tags:
  - aws-fis
  - stop-condition
  - guardrail
  question: |
    In AWS FIS, what concretely implements the "automated halt condition" guardrail?
  options:
  - A manual approval gate in the deployment pipeline that an operator must click through before the fault
    is allowed to continue
  - A CloudWatch alarm configured as the experiment's stop condition — if it enters ALARM, FIS auto-halts
    and rolls back
  - An IAM policy that denies the fault action once the steady-state metric breaches its configured
    threshold
  - A Lambda function that an on-call engineer must invoke by hand to roll the injected fault back once
    they notice the divergence
  answer: 1
  explanation: |
    FIS stop conditions ARE CloudWatch alarms. Wire an alarm on your steady-state metric (e.g.
    checkout success rate below threshold); if it fires during the experiment, FIS immediately
    stops the actions and rolls back — the cloud-native form of a kill switch on steady state.
  ref: concepts.md#aws-fis-experiment-template-anatomy
- id: chaos-engineering-and-fault-injection-061
  difficulty: expert
  tags:
  - aws-fis
  - scenario
  - design
  question: |
    You must design a *first* production chaos experiment on AWS FIS for a checkout service.
    Which template is the safest, most defensible choice?
  options:
  - Terminate 100% of checkout instances across every region simultaneously with no stop condition, run
    at 3am so the maximal fault reveals the most weaknesses in the shortest window
  - Target 1% of instances by tag in one AZ, inject ~200 ms latency for 5 minutes, stop condition = CloudWatch
    alarm on checkout success rate, run in staffed hours, after validating in staging
  - Fill the disk on the primary database to 100% with no verified backup taken beforehand, during peak
    checkout traffic, to see how quickly it recovers
  - Corrupt a fraction of writes to the orders table with no rollback plan and observe whether downstream
    reconciliation or on-call notices the bad data
  answer: 1
  explanation: |
    Small on both dials (1% by tag, 200 ms magnitude, 5-min duration), an automated stop
    condition on the business metric, staffed hours, and prior staging validation — this is the
    textbook safe first experiment. The distractors are wide-radius, guardrail-less, or use
    irreversible faults in prod.
  ref: concepts.md#aws-fis-experiment-template-anatomy
- id: chaos-engineering-and-fault-injection-062
  difficulty: advanced
  tags:
  - dirt
  - governance
  - google
  question: |
    Google's DiRT (Disaster Recovery Testing) program includes which governance requirement for
    a high-production-risk test?
  options:
  - No approvals are required for any DiRT test; any engineer may schedule and run any disaster scenario
    at their own discretion
  - Tests may run only on weekends, and observers are explicitly barred so the on-call response is captured
    without any outside coaching
  - Every DiRT test must intentionally omit a rollback plan, on the principle that an irreversible exercise
    forces the team to learn recovery under real pressure
  - Every test must have a revert/rollback plan, be reviewed by a cross-functional team separate from the
    coordinators, and high-prod-risk tests require VP-level sign-off
  answer: 3
  explanation: |
    DiRT emphasizes governance: a mandatory revert plan, declared prod impact, cross-functional
    review separate from the coordinators, and VP sign-off for high-prod-risk tests. Real
    emergencies always preempt DiRT. This is the approval layer staff interviews probe.
  ref: concepts.md#google-dirt-and-the-wheel-of-misfortune
- id: chaos-engineering-and-fault-injection-063
  difficulty: expert
  tags:
  - dirt
  - scoping
  - precision
  question: |
    A DiRT test aims to validate resilience to DNS loss. Why is "bring down DNS" a poorly
    scoped test, and what is the better-scoped version?
  options:
  - It is already perfectly scoped as written, because taking down all DNS is the only way to be certain
    no resolver anywhere quietly keeps answering
  - Bringing down all DNS is too blunt; the scoped version (shut down all primary DNS servers in North
    America but not the forwarding servers) is better because forwarders would otherwise mask the outage
    and invalidate the test
  - The better version is to disable DNS globally across every region and forwarder at once, since a
    thorough test must leave no resolver standing anywhere
  - DNS is far too critical and should never be included in any disaster-recovery test under any
    circumstances, scoped or otherwise
  answer: 1
  explanation: |
    Scoping precision matters: if you leave forwarding/caching resolvers running, they mask the
    outage and the test proves nothing. The realistic scoped test disables the primaries but
    accounts for the forwarders — mirroring how the real failure would (and wouldn't) propagate.
  ref: concepts.md#google-dirt-and-the-wheel-of-misfortune
- id: chaos-engineering-and-fault-injection-064
  difficulty: advanced
  tags:
  - dirt
  - human-spof
  question: |
    DiRT deliberately "disables" a person with undocumented knowledge or removes a doc/comms
    channel during an exercise. What is this testing?
  options:
  - Whether the individual whose knowledge was removed deserves a promotion based on how badly the team
    struggled without them
  - Human and process resilience — exposing human single points of failure and gaps in documentation/process
  - The system's tolerance to a network partition between the primary and secondary data centers while
    the key person is unavailable
  - The integrity of the database backups by confirming they can be restored without input from the
    person who normally owns that runbook
  answer: 1
  explanation: |
    Chaos extends beyond machines. Removing a key person or a doc/process/comms channel surfaces
    human SPOFs and process gaps — knowledge concentrated in one head, or a runbook that only
    works if a specific person is reachable. A distinguishing senior insight.
  ref: concepts.md#google-dirt-and-the-wheel-of-misfortune
- id: chaos-engineering-and-fault-injection-065
  difficulty: advanced
  tags:
  - wheel-of-misfortune
  - gameday
  - distinction
  question: |
    How does a Google "Wheel of Misfortune" exercise differ from a live GameDay?
  options:
  - The Wheel of Misfortune injects larger, more destructive real faults into live production than a
    GameDay does, which is why it needs VP sign-off
  - They are identical exercises, differing only in the name Google happens to use versus the rest of
    the industry
  - The Wheel of Misfortune is a tabletop role-play of a past incident with zero blast radius; a GameDay
    injects a real fault into a live system
  - A GameDay is the zero-blast-radius tabletop exercise, while the Wheel of Misfortune is the one that
    injects a real fault and takes down live production
  answer: 2
  explanation: |
    The Wheel of Misfortune is a low-risk, zero-blast-radius tabletop: on-callers role-play
    responding to a past incident, exercising runbooks and instincts without touching prod. A
    GameDay injects a real fault into a live (usually team-scoped) system.
  ref: concepts.md#google-dirt-and-the-wheel-of-misfortune
- id: chaos-engineering-and-fault-injection-066
  difficulty: expert
  tags:
  - knowns-unknowns
  - ordering
  - method
  question: |
    Using the knowns/unknowns matrix to order chaos experiments, where should a team start, and
    why?
  options:
  - At unknown-unknowns, because they are the most valuable failures to find and the whole discipline
    exists to surface them, so a team should target them from the very first experiment
  - At known-knowns — verify what you think you already understand (e.g. "a killed instance is replaced
    in ~90 s"), because those assumptions are surprisingly often wrong
  - At known-unknowns exclusively — the gaps you already know you don't understand — skipping every other
    quadrant of the matrix entirely
  - Ordering across the matrix makes no measurable difference to the value gained, so a team should simply
    pick experiments at random
  answer: 1
  explanation: |
    Start at known-knowns: run experiments that confirm assumptions you believe are true (the
    replacement really happens in 90 s?). These frequently turn out wrong and give high early
    value. You then move outward; the discipline's ultimate prize is converting unknown-unknowns
    into knowns, but you don't start there.
  ref: concepts.md#choosing-what-to-test-first-the-knownsunknowns-matrix
- id: chaos-engineering-and-fault-injection-067
  difficulty: intermediate
  tags:
  - knowns-unknowns
  - definition
  question: |
    In the knowns/unknowns framing, which category best describes the emergent, surprising
    failures that chaos engineering ultimately exists to surface?
  options:
  - Known-knowns — behavior we both fully understand and are consciously aware of ahead of time
  - Known-unknowns — behavior we are aware exists but do not yet fully understand or measure
  - Unknown-unknowns — behavior we neither understand nor anticipate
  - Unknown-knowns — behavior we understand in practice but have never consciously written down
  answer: 2
  explanation: |
    Unknown-unknowns are emergent behaviors we neither understand nor are aware of — the
    cascading failures and hidden correlated dependencies that only real faults on the real
    system reveal. Converting them to knowns before a real outage does is chaos's core purpose.
  ref: concepts.md#choosing-what-to-test-first-the-knownsunknowns-matrix
- id: chaos-engineering-and-fault-injection-068
  difficulty: expert
  tags:
  - error-budget
  - numbers
  - when
  question: |
    Your team has already consumed this month's error budget (you are at/over your allowed
    downtime for a 99.9% SLO). A wide, risky production chaos experiment is scheduled. What is
    the SRE-aligned decision?
  options:
  - Pause the risky/wide experiment (you can't afford the downside), while still allowing tiny, automated,
    well-guarded regression checks whose worst case is negligible
  - Run the wide experiment anyway, because chaos experiments are formally exempt from error-budget policy
    and never count against the SLO
  - Cancel all reliability engineering work for the remainder of the month until the error budget has fully
    replenished at the next reset
  - Double the blast radius of the experiment to learn as much as possible before the month ends and the
    budget resets to zero
  answer: 0
  explanation: |
    A chaos experiment spends from the error budget like a real incident. With the budget
    exhausted, freeze risky/wide experiments (and risky launches) until it recovers, but keep
    negligible-risk automated checks. The budget gates chaos aggressiveness exactly as it gates
    launches.
  ref: concepts.md#chaos-and-the-error-budget-when-to-run
- id: chaos-engineering-and-fault-injection-069
  difficulty: advanced
  tags:
  - error-budget
  - availability
  - numbers
  question: |
    Roughly how much monthly downtime does a 99.9% availability SLO permit, and how does that
    relate to running chaos?
  options:
  - About 43.8 minutes per month; that error budget is what a risky chaos experiment spends from, so a
    depleted budget argues for pausing risky experiments
  - About 4.38 seconds per month, and a chaos experiment's impact never draws from that tiny budget at
    all
  - Exactly zero permitted downtime, which is why any chaos experiment is forbidden under a 99.9% SLO in
    every circumstance
  - About 8 hours per month, a budget so generous that unlimited wide-blast-radius chaos is always fine
    to run
  answer: 0
  explanation: |
    99.9% ≈ 43.8 min/month of allowed downtime (99.99% ≈ 4.38 min; 99.999% ≈ 26 s). A chaos
    experiment that causes impact draws from that same budget, so whether you can afford a risky
    experiment depends on how much budget remains.
  ref: concepts.md#chaos-and-the-error-budget-when-to-run
- id: chaos-engineering-and-fault-injection-070
  difficulty: advanced
  tags:
  - continuous-verification
  - ci
  - vocabulary
  question: |
    What does the term "Continuous Verification (CV)" denote in modern chaos engineering?
  options:
  - Manually verifying each deploy by hand, with an engineer signing off on resilience after every release
    before traffic is shifted
  - Automated chaos experiments gated into the deploy pipeline, so a resilience regression fails a build
    like a broken unit test — "chaos as CI"
  - Continuously polling a service's health-check endpoint and alerting whenever it stops returning a
    200 response
  - Continuously re-verifying user identities and session tokens for security throughout the lifetime of
    each request
  answer: 1
  explanation: |
    Continuous Verification is the named 2024/2025 evolution of "chaos as CI": automated
    experiments integrated into the pipeline so resilience is continuously re-verified and a
    regression blocks the build — the logical endpoint of "automate experiments to run
    continuously."
  ref: concepts.md#continuous-verification-and-security-chaos-engineering
- id: chaos-engineering-and-fault-injection-071
  difficulty: expert
  tags:
  - security-chaos
  - sce
  - scenario
  question: |
    Which experiment best exemplifies Security Chaos Engineering (SCE)?
  options:
  - Terminate a production instance and verify that autoscaling detects the loss and replaces the capacity
    within the target recovery time
  - Add 500 ms of injected latency to a dependency and verify that the caller's circuit breaker trips and
    sheds load as designed
  - Deliberately open a security-group port (or drop an IAM permission) and verify the SIEM alerts and auto-remediation
    reverts it within the target SLA
  - Fill a host's disk to capacity and verify that log rotation reclaims space before writes begin to
    fail
  answer: 2
  explanation: |
    SCE applies hypothesis-driven fault injection to security controls: inject a
    misconfiguration and verify the detection/response pipeline (alerting + auto-remediation)
    actually fires within SLA. The other options test availability mechanisms, not detective
    controls.
  ref: concepts.md#continuous-verification-and-security-chaos-engineering
- id: chaos-engineering-and-fault-injection-072
  difficulty: advanced
  tags:
  - security-chaos
  - detection
  - insight
  question: |
    What is the core senior insight behind Security Chaos Engineering?
  options:
  - Security controls, once correctly configured at deploy time, never need any further testing because
    their behavior cannot drift or silently break afterward
  - SCE fully replaces penetration testing and red-team exercises, so an organization adopting it can
    retire those programs entirely
  - Security faults should only ever be discovered by real attackers in the wild, since deliberately
    injecting them proactively creates more exposure than it uncovers
  - Run chaos against detective and responsive controls, not just availability mechanisms — an alert that
    never fires is a security control that effectively does not exist
  answer: 3
  explanation: |
    SCE's insight is that detection/response controls are otherwise only "tested" by real
    attackers. Proactively injecting security faults verifies that alerts and auto-remediation
    fire — because an alert that silently never fires provides no protection.
  ref: concepts.md#continuous-verification-and-security-chaos-engineering
- id: chaos-engineering-and-fault-injection-073
  difficulty: expert
  tags:
  - reversibility
  - abort
  - edge-case
  question: |
    The prerequisite "you must be able to abort instantly" is oversimplified. Which fault is
    NOT cleanly reversible by hitting the abort button?
  options:
  - Injected network latency added at the tc/netem layer, which the abort simply removes to restore normal
    round-trip times
  - A blackhole/packet-drop rule installed in iptables that is cleanly withdrawn the instant the experiment
    is aborted
  - A paused process (SIGSTOP) that resumes exactly where it left off as soon as the abort sends SIGCONT
  - Terminating an instance that held in-flight state (or a corrupted write) — aborting the injection does
    not undo the lost/corrupted state
  answer: 3
  explanation: |
    Latency, blackhole, and process-pause are reversible — remove the fault and the system
    recovers. Terminating a stateful instance or corrupting a write leaves a consequence that
    aborting the injection cannot undo. Irreversible faults demand staging/shadow, verified
    backups, and targeting replicas — not just a red button.
  ref: concepts.md#reversibility-not-every-fault-can-be-aborted
- id: chaos-engineering-and-fault-injection-074
  difficulty: expert
  tags:
  - reversibility
  - stateful
  - judgment
  question: |
    How should you handle a chaos experiment involving an irreversible fault such as data
    corruption or disk-fill on a stateful primary?
  options:
  - Run it directly in production against the stateful primary during peak hours, on the reasoning that
    maximum realism requires the busiest possible workload and the fullest data set
  - Treat it with far more caution by preferring staging or a shadow environment, ensuring verified backups,
    and targeting replicas rather than primaries
  - Skip the backup step entirely, since hitting the abort button will cleanly roll back the corrupted rows
    and restore the filled disk to its pre-experiment state
  - Run it only after disabling monitoring and alerting, so that the injected corruption cannot trigger a
    page and distract on-call during the exercise
  answer: 1
  explanation: |
    Irreversible faults sit at the dangerous end of the reversibility spectrum. Mature practice
    uses staging/shadow, verifies backups beforehand, and targets replicas — never casually
    corrupting a production primary, because the abort button cannot undo the consequence.
  ref: concepts.md#reversibility-not-every-fault-can-be-aborted
- id: chaos-engineering-and-fault-injection-075
  difficulty: expert
  tags:
  - steady-state
  - laggy-kpi
  - proxy
  question: |
    Your ideal business KPI is revenue-per-minute, but it only moves minutes after checkout and
    payment settle — too slow to abort on. What is the correct steady-state design?
  options:
  - Abort directly on revenue-per-minute anyway and accept the multi-minute delay, on the view that the
    truest business signal is worth halting slowly for
  - Abandon automated guardrails altogether, since no metric moves fast enough to trip on, and rely on an
    engineer watching the dashboard to pull the plug manually
  - Trip the automated halt on a fast proxy (successful-request rate or p99 latency) that moves in seconds,
    and grade the experiment afterward on the revenue KPI
  - Use host CPU utilization as the halt trigger, since it reacts within seconds and therefore serves as a
    dependable stand-in for customer-facing revenue impact
  answer: 2
  explanation: |
    A halt signal must react faster than the damage. Use a fast, well-correlated proxy (success
    rate, p99 latency) as the trip wire and reserve the laggy business KPI for post-hoc grading.
    This is exactly why Netflix uses SPS — it moves in seconds. CPU is a poor customer-impact
    proxy.
  ref: concepts.md#steady-state-metric-selection-fast-proxy-vs-laggy-kpi
- id: chaos-engineering-and-fault-injection-076
  difficulty: expert
  tags:
  - chap
  - statistics
  - rigor
  question: |
    In ChAP, how do you know an observed KPI divergence between the experiment and control
    clusters is real and not noise?
  options:
  - An engineer eyeballs the two dashboard lines during the run and makes a judgment call on whether the
    gap between them looks meaningful enough to act on
  - It treats any downward dip in the experiment cluster's KPI as automatically significant and aborts the
    run on the first such deflection, without any noise filtering
  - ChAP routes tiny, statistically comparable control and experiment populations and runs an automated
    statistical significance test (Kayenta / Automated Canary Analysis) on the KPI difference
  - It waits until a full week of data has accumulated and then compares the run against the same KPI from
    the corresponding week of the previous month
  answer: 2
  explanation: |
    At small blast radius the sample is noisy, so naive "the line dipped" reads cause false
    positives and negatives. ChAP allocates comparable control/experiment clusters and applies
    automated statistical significance testing (Kayenta/ACA) — the same rigor as canary analysis
    — to trust the result.
  ref: concepts.md#statistical-rigor-control-vs-experiment-group-internals
- id: chaos-engineering-and-fault-injection-077
  difficulty: advanced
  tags:
  - tools
  - kubernetes
  - selection
  question: |
    A team runs everything on Kubernetes and wants native, CRD-based fault injection (PodChaos,
    NetworkChaos, StressChaos, etc.). Which tools are the natural fit?
  options:
  - Prometheus or Grafana, using their alerting rules and dashboards to inject the PodChaos and NetworkChaos
    faults directly into the cluster
  - Terraform or CloudFormation, whose declarative apply/destroy cycle recreates pods and network policies
    as the native way to express Kubernetes faults
  - Jenkins or GitHub Actions, whose pipeline steps intentionally fail to simulate pod, network, and stress
    faults inside the cluster
  - Chaos Mesh or LitmusChaos (CNCF, Kubernetes-native via CRDs)
  answer: 3
  explanation: |
    Chaos Mesh and LitmusChaos are CNCF, Kubernetes-native tools that express faults as CRDs
    (PodChaos, NetworkChaos, StressChaos, IOChaos, TimeChaos, DNSChaos). AWS FIS suits AWS,
    Chaos Toolkit is vendor-neutral experiment-as-code, and Gremlin is a SaaS option.
  ref: concepts.md#tool-landscape-and-kubernetes-native-faults
- id: chaos-engineering-and-fault-injection-078
  difficulty: advanced
  tags:
  - kubernetes
  - dns-chaos
  - fault-type
  question: |
    Which Kubernetes-native chaos fault directly exercises resilience to a CoreDNS failure — a
    common real-world outage cause — by returning errors or wrong answers for in-cluster name
    resolution?
  options:
  - PodChaos (pod-kill)
  - StressChaos (CPU/memory pressure)
  - DNSChaos
  - TimeChaos (clock skew)
  answer: 2
  explanation: |
    DNSChaos injects DNS errors or incorrect responses for in-cluster resolution (CoreDNS),
    testing how services behave when name resolution fails — a frequent cause of real outages.
    Pod-kill, stress, and clock-skew test different failure modes.
  ref: concepts.md#tool-landscape-and-kubernetes-native-faults
- id: chaos-engineering-and-fault-injection-079
  difficulty: advanced
  tags:
  - tools
  - vendor-neutral
  - selection
  question: |
    You want portable, vendor-neutral "experiment-as-code" definitions (JSON/YAML) that are not
    tied to one cloud or platform. Which tool is designed for that?
  options:
  - Chaos Toolkit
  - AWS Fault Injection Service
  - Azure Chaos Studio
  - Netflix Chaos Monkey
  answer: 0
  explanation: |
    Chaos Toolkit is the open-source, vendor-neutral standard for declaring experiments as
    JSON/YAML that run against many providers. FIS and Azure Chaos Studio are cloud-specific;
    Chaos Monkey narrowly kills instances.
  ref: concepts.md#tool-landscape-and-kubernetes-native-faults
- id: chaos-engineering-and-fault-injection-080
  difficulty: expert
  tags:
  - scenario
  - circuit-breaker
  - which-mitigation
  question: |
    During a latency-injection experiment, your circuit breaker correctly tripped, yet customers
    still saw errors instead of the intended degraded experience. What is the most likely
    root cause?
  options:
  - The circuit breaker should never trip during a chaos experiment, so its firing at all is itself the
    defect that produced the customer-facing errors
  - Latency injection is incapable of driving a circuit breaker to open, because breakers key only on error
    responses and connection failures, never on slow-but-successful calls
  - The fallback path itself was unhealthy or depended on the failed service (or the breaker's timeout/threshold
    was mistuned), so tripping produced errors rather than a graceful fallback
  - The experiment proves the system is fully resilient, since a breaker that tripped confirms every
    protective mechanism engaged exactly as designed
  answer: 2
  explanation: |
    A tripped breaker only helps if the fallback it routes to is healthy and independent. If the
    fallback secretly depends on the failed service, or the breaker's thresholds/timeouts are
    mistuned, customers still get errors. This is the classic "the safety mechanism didn't
    actually protect us" finding.
  ref: concepts.md#latency-and-cascading-failure-the-littles-law-mechanism
- id: chaos-engineering-and-fault-injection-081
  difficulty: intermediate
  tags:
  - fit
  - failure-scenario
  - concept
  question: |
    In Netflix FIT, what is a "failure scenario" such as the critical-services scenario?
  options:
  - A curated, reusable set of injection points that codifies what must (or must not) survive — e.g. the
    minimum set of services required to stream
  - A structured postmortem template that engineers fill out after a past outage to capture its timeline,
    root cause, and follow-up action items
  - A real-time dashboard that plots the current error rate and latency of each microservice so operators
    can watch the fault propagate live
  - A recurring cron schedule that dictates the exact hours and days on which Chaos Monkey is permitted to
    terminate production instances
  answer: 0
  explanation: |
    A failure scenario is a curated set of injection points that encodes "what must keep
    working," such as the minimum services required to stream video. Mature programs turn
    "what must survive" into reusable, versioned experiments rather than ad-hoc one-offs.
  ref: concepts.md#netflix-fit-request-level-fault-injection
- id: chaos-engineering-and-fault-injection-082
  difficulty: expert
  tags:
  - chaos-monkey
  - fit
  - chap
  - distinction
  question: |
    When would you reach for Chaos Monkey vs FIT vs ChAP?
  options:
  - They are functionally interchangeable, so you simply pick whichever tool happens to already be installed
    and integrated in your environment
  - Chaos Monkey for coarse always-on host-random kills; FIT for request-level precision (choose who/what
    fails, ramp the %); ChAP for FIT-style precision PLUS automatic control/experiment groups and a statistical
    significance test
  - Chaos Monkey is the right tool for region failover drills, FIT for disk-fill experiments, and ChAP
    exclusively for injecting clock skew across the fleet
  - ChAP may only be run in staging, FIT is restricted to production, and Chaos Monkey is used solely for
    injecting faults into database tiers
  answer: 1
  explanation: |
    The progression is coarse → precise → precise-and-automatically-graded. Chaos Monkey kills
    random hosts continuously; FIT injects faults at the request level so you choose who is
    affected and ramp the percentage; ChAP adds automatic control/experiment groups plus
    automated canary/significance analysis of the KPI.
  ref: concepts.md#netflix-fit-request-level-fault-injection
- id: chaos-engineering-and-fault-injection-083
  difficulty: advanced
  tags:
  - definitions
  - fault-injection
  - load-test
  - distinction
  question: |
    How do fault injection, chaos engineering, and a load/stress test relate?
  options:
  - They are three interchangeable names for the same underlying activity, distinguished only by which team
    or vendor happens to prefer each label in a given organization
  - Fault injection is the mechanism (introducing a failure); chaos engineering is the hypothesis-driven
    discipline that uses it; a load test measures capacity under volume (a chaos experiment may use load
    as one of its faults)
  - Chaos engineering is simply a specialized subtype of load testing, one that ramps synthetic request
    volume until the system saturates and then records the breaking point
  - Load testing is the underlying mechanism that introduces failures, while chaos engineering is the
    monitoring tool that watches dashboards and alerts when those failures occur
  answer: 1
  explanation: |
    Fault injection is the technique of introducing a failure condition. Chaos engineering is
    the scientific discipline (hypothesis, steady state, blast radius) that employs it. A load
    test specifically measures behavior under volume; a chaos experiment may incorporate load as
    one fault but is defined by the hypothesis-driven method, not by volume.
  ref: concepts.md#latency-and-cascading-failure-the-littles-law-mechanism
- id: chaos-engineering-and-fault-injection-084
  difficulty: expert
  tags:
  - scenario
  - judgment
  - governance
  question: |
    A skeptical VP argues that running chaos in production is reckless and everything should be
    tested in staging. What is the strongest justification for controlled production chaos?
  options:
  - Breaking production is cheaper than breaking staging, because a dedicated staging clone must be
    provisioned and maintained separately and roughly doubles the monthly infrastructure spend
  - Staging cannot reproduce prod's real scale, traffic mix, config, and dependency topology, so the highest-value
    emergent failures only appear in prod; the risk is bounded by blast radius + magnitude + guardrails
    (as Google's DiRT bounds it with revert plans and VP-approved scope), not by avoiding prod
  - Staging environments are architecturally unable to run metrics and tracing agents, so any experiment
    conducted there produces no observable signal and is therefore pointless
  - Chaos experiments in production require no guardrails at all, because running against live traffic is
    inherently bounded and self-limiting by definition
  answer: 1
  explanation: |
    Staging is an approximation; emergent, scale-dependent failures surface only under real prod
    conditions. You de-risk with small blast radius and magnitude, automated halt conditions, and
    governance (DiRT-style revert plans and approvals) — not by refusing to test where the real
    risk lives.
  ref: concepts.md#google-dirt-and-the-wheel-of-misfortune
