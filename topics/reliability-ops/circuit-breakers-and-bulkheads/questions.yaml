topic: "Circuit Breakers & Bulkheads"
domain: reliability-ops
topic_slug: circuit-breakers-and-bulkheads
version: 1
questions:
  - id: circuit-breakers-and-bulkheads-001
    difficulty: beginner
    tags: [circuit-breaker, states, mechanism]
    question: |
      In the circuit-breaker state machine, what does the breaker do while in
      the OPEN state?
    options:
      - "Passes all calls through to the dependency as normal"
      - "Fails fast immediately without calling the dependency"
      - "Sends every call but doubles the timeout"
      - "Queues all calls until the dependency responds"
    answer: 1
    explanation: |
      OPEN means the dependency is presumed unhealthy, so the breaker
      short-circuits: calls fail fast (throw/fallback in microseconds) without
      touching the dependency. This frees the caller's threads and gives the
      dependency time to recover.
    ref: "concepts.md#the-circuit-breaker-state-machine"

  - id: circuit-breakers-and-bulkheads-002
    difficulty: beginner
    tags: [circuit-breaker, half-open, recovery]
    question: |
      What happens in the HALF-OPEN state?
    options:
      - "The breaker rejects every call until an operator resets it"
      - "All traffic is instantly restored to its full pre-outage volume"
      - "The dependency is called normally but every response is discarded"
      - "A limited number of trial calls are allowed through to test recovery"
    answer: 3
    explanation: |
      HALF-OPEN is a probing state: after the sleep window, a limited number of
      trial calls are permitted. If they succeed the breaker closes (recovered);
      if any fails it re-opens and restarts the sleep window. This re-probes with
      a trickle rather than slamming full load onto a fragile dependency.
    ref: "concepts.md#the-circuit-breaker-state-machine"

  - id: circuit-breakers-and-bulkheads-003
    difficulty: intermediate
    tags: [cascading-failure, threads, slow-dependency]
    question: |
      Why is a slow dependency often MORE dangerous to a synchronous caller than
      a dependency that is completely down?
    options:
      - "A slow dependency returns corrupted data that crashes the caller"
      - "A down dependency triggers many more automatic retries than a merely slow one does"
      - "A slow dependency silently bypasses the circuit breaker and skips its failure accounting"
      - "A slow dependency holds request threads for the full timeout, exhausting the pool"
    answer: 3
    explanation: |
      A dependency that fails instantly (connection refused) frees the thread
      immediately. A slow one holds each thread for the full timeout; under load
      every thread ends up parked waiting, so the caller has zero free threads and
      cannot serve anything — the classic cascading-failure trigger. "Slow is worse
      than down."
    ref: "concepts.md#why-fail-fast-the-cascading-failure-problem"

  - id: circuit-breakers-and-bulkheads-004
    difficulty: beginner
    tags: [bulkhead, metaphor, isolation]
    question: |
      The bulkhead pattern is named after ship hull compartments. What reliability
      property does that metaphor capture?
    options:
      - "Encrypting data at each layer so a single breach exposes nothing useful"
      - "Replicating data across multiple regions so a zone loss preserves durability"
      - "Compressing in-flight traffic so the system saves bandwidth under heavy load"
      - "Isolating resources so one failure can't sink the whole system"
    answer: 3
    explanation: |
      A ship's watertight bulkheads confine a breach to one compartment so the ship
      stays afloat. Software bulkheads partition finite resources (thread/connection
      pools) per dependency so a single saturated dependency can only consume its own
      pool — it can't drain the resources every other part of the app needs.
    ref: "concepts.md#bulkheads-resource-isolation"

  - id: circuit-breakers-and-bulkheads-005
    difficulty: intermediate
    tags: [circuit-breaker, bulkhead, comparison]
    question: |
      What is the core difference between a circuit breaker and a bulkhead?
    options:
      - "They are simply two interchangeable names for the exact same isolation pattern"
      - "A bulkhead automatically retries failed calls, whereas a breaker deliberately never retries"
      - "A breaker stops calling a bad dependency; a bulkhead caps the resources one dependency can consume"
      - "A breaker is only for database calls, while a bulkhead applies exclusively to HTTP traffic"
    answer: 2
    explanation: |
      They are complementary. A circuit breaker is temporal — it decides whether to
      make the call at all and fails fast on a known-bad dependency. A bulkhead is
      spatial — it isolates resource pools so one dependency's saturation can't starve
      the others, capping the blast radius. You typically use both.
    ref: "concepts.md#bulkheads-resource-isolation"

  - id: circuit-breakers-and-bulkheads-006
    difficulty: intermediate
    tags: [circuit-breaker, threshold, tuning]
    question: |
      Why do circuit breakers use a rate-based failure threshold combined with a
      minimum-volume gate rather than a raw failure count alone?
    options:
      - "To make the breaker trip faster and more decisively under every possible load condition"
      - "Because a raw running failure count is mathematically impossible to compute efficiently in code"
      - "So the threshold scales with traffic and doesn't trip on a tiny, unrepresentative sample"
      - "To guarantee the breaker never trips during peak load no matter how many calls fail"
    answer: 2
    explanation: |
      A rate (e.g. 50% failures) scales with traffic. The minimum-volume gate
      (Resilience4j minimumNumberOfCalls=100, Hystrix requestVolumeThreshold=20)
      ensures the rate is evaluated only on a statistically meaningful sample —
      otherwise 1 failure out of 2 calls "= 50%" would flap the breaker.
    ref: "concepts.md#closed-state-and-tripping-thresholds"

  - id: circuit-breakers-and-bulkheads-007
    difficulty: intermediate
    tags: [circuit-breaker, errors, 4xx]
    question: |
      A service's circuit breaker keeps tripping even though the downstream
      dependency is healthy. Investigation shows the breaker counts HTTP 404 and
      400 responses as failures. What is the fix?
    options:
      - "Lower the failure-rate threshold so the breaker tolerates the 4xx responses"
      - "Stop counting 4xx client errors toward the breaker's failure rate"
      - "Increase the sleep window so the breaker waits longer before probing"
      - "Switch to a semaphore bulkhead so 4xx responses stop counting as failures"
    answer: 1
    explanation: |
      4xx responses are the caller's fault (bad request / not found), not the
      dependency being unhealthy. Counting them pollutes the health signal and trips
      the breaker against a perfectly healthy dependency. Record only real failures
      (timeouts, connection errors, 5xx) — Resilience4j's ignoreExceptions handles this.
    ref: "concepts.md#closed-state-and-tripping-thresholds"

  - id: circuit-breakers-and-bulkheads-008
    difficulty: intermediate
    tags: [circuit-breaker, sleep-window, tuning]
    question: |
      If the circuit breaker's sleep window (wait duration in OPEN) is set far TOO
      SHORT relative to how long the dependency needs to recover, what happens?
    options:
      - "The breaker probes too aggressively and re-opens, adding load during recovery"
      - "The breaker gets stuck and never leaves the OPEN state once it has tripped"
      - "The breaker permanently disables the dependency and requires a manual operator reset"
      - "Nothing at all — a shorter sleep window is always strictly safer than a longer one"
    answer: 0
    explanation: |
      Too short a sleep window means HALF-OPEN probes fire before the dependency has
      recovered; the trial calls fail, the breaker re-opens, and the repeated probing
      piles load onto a dependency that is still trying to come back. The breaker flaps.
    ref: "concepts.md#open-state-the-sleep-window-and-recovery"

  - id: circuit-breakers-and-bulkheads-009
    difficulty: intermediate
    tags: [circuit-breaker, sleep-window, tuning]
    question: |
      What is the risk of setting the sleep window TOO LONG?
    options:
      - "The breaker trips far too easily on small, statistically insignificant samples"
      - "The dependency receives excessive HALF-OPEN probing traffic while it is recovering"
      - "You keep failing fast long after the dependency recovered, extending a self-inflicted outage"
      - "The breaker can never enter the HALF-OPEN state and reach a recovery decision"
    answer: 2
    explanation: |
      An over-long sleep window means the dependency recovered but the breaker stays
      OPEN and keeps failing fast — turning a transient blip into an extended,
      self-inflicted outage. The sleep window is a genuine trade-off between re-probing
      too soon and recovering too late.
    ref: "concepts.md#open-state-the-sleep-window-and-recovery"

  - id: circuit-breakers-and-bulkheads-010
    difficulty: advanced
    tags: [bulkhead, thread-pool, semaphore]
    question: |
      Which statement best distinguishes a thread-pool bulkhead from a semaphore
      bulkhead?
    options:
      - "Semaphore bulkheads spin up strictly more worker threads than thread-pool bulkheads do"
      - "Thread-pool bulkheads run the call on a separate bounded pool and free the caller thread; semaphore bulkheads run on the caller's thread and just cap concurrency"
      - "Thread-pool bulkheads only work for fast in-process calls and never for remote network calls"
      - "Semaphore bulkheads can enforce per-call timeouts by abandoning workers, but thread-pool ones cannot"
    answer: 1
    explanation: |
      A thread-pool bulkhead executes the call on a dedicated bounded pool, freeing the
      caller thread and allowing timeout enforcement — good for unpredictable network
      latency. A semaphore bulkhead is just an atomic concurrency counter; the call runs
      on the caller's own thread, so it's cheap but can't free a blocked thread.
    ref: "concepts.md#thread-pool-vs-semaphore-bulkheads"

  - id: circuit-breakers-and-bulkheads-011
    difficulty: advanced
    tags: [bulkhead, semaphore, timeout, anti-pattern]
    question: |
      An engineer uses a semaphore bulkhead for a remote HTTP call but sets no
      client-side timeout. The dependency hangs. What still goes wrong?
    options:
      - "The semaphore caps concurrency but the blocked calls are still the caller's own threads, so the thread pool can still exhaust"
      - "Nothing goes wrong — the semaphore bulkhead fully protects the caller on its own"
      - "The semaphore automatically injects a sensible client-side timeout to abort the hung call"
      - "The circuit breaker opens on the first hang and prevents any thread from blocking at all"
    answer: 0
    explanation: |
      A semaphore bulkhead runs the call on the caller's own thread and only limits how
      many can run at once. Without a client timeout, each hung call ties up a request
      thread for the duration; concurrency is bounded but you can still exhaust the pool.
      Semaphore isolation must be paired with a strict client-side timeout.
    ref: "concepts.md#thread-pool-vs-semaphore-bulkheads"

  - id: circuit-breakers-and-bulkheads-012
    difficulty: intermediate
    tags: [hystrix, resilience4j, tooling]
    question: |
      For a new JVM service in 2026, which resilience library should you choose over
      Netflix Hystrix, and why?
    options:
      - "Hystrix, because Netflix still actively develops it as the current industry standard"
      - "Neither one — dedicated resilience libraries are obsolete now that JDK 21 handles this"
      - "Resilience4j, because Hystrix is in maintenance mode / deprecated since ~2018"
      - "Hystrix, because Resilience4j ships only a bulkhead and lacks any circuit breaker at all"
    answer: 2
    explanation: |
      Netflix put Hystrix into maintenance mode around 2018 and stopped active
      development. Resilience4j is the modern, lightweight, modular successor for the
      JVM (Java 8+), with separate CircuitBreaker/Bulkhead/Retry/TimeLimiter decorators
      and features Hystrix lacked, like slow-call detection.
    ref: "concepts.md#resilience4j-and-hystrix"

  - id: circuit-breakers-and-bulkheads-013
    difficulty: advanced
    tags: [retry, circuit-breaker, retry-storm, anti-pattern]
    question: |
      Why is adding retries to a failing dependency WITHOUT a circuit breaker
      considered dangerous?
    options:
      - "Retries multiply the request rate onto a struggling dependency exactly when it can least handle it (a retry storm)"
      - "Retries always return stale cached data instead of the current authoritative response"
      - "Retries automatically disable the caller's configured per-call timeouts behind the scenes"
      - "Retries only ever work for idempotent GET requests and silently drop every other method"
    answer: 0
    explanation: |
      When a dependency is struggling, blind retries amplify the load at the worst
      possible moment, deepening the outage — a retry storm. A circuit breaker caps this
      by tripping OPEN so retries stop hammering the dependency. Retries and breakers
      must be designed together.
    ref: "concepts.md#why-fail-fast-the-cascading-failure-problem"

  - id: circuit-breakers-and-bulkheads-014
    difficulty: intermediate
    tags: [circuit-breaker, fail-fast, benefits]
    question: |
      Which of these is NOT a primary benefit of a circuit breaker tripping OPEN?
    options:
      - "The dependency's data is automatically repaired"
      - "The caller fails fast instead of piling up on timeouts"
      - "The struggling dependency gets a rest and a chance to recover"
      - "The caller's threads are freed to serve other work"
    answer: 0
    explanation: |
      A breaker doesn't repair a dependency's data — it just stops calling it. Its real
      benefits are failing fast (no thread pile-up), freeing caller resources, and
      shedding load off the dependency so it can recover.
    ref: "concepts.md#why-fail-fast-the-cascading-failure-problem"

  - id: circuit-breakers-and-bulkheads-015
    difficulty: advanced
    tags: [bulkhead, thread-pool, use-case]
    question: |
      Hystrix defaulted to thread-pool isolation for remote calls. What is the main
      reason thread-pool isolation is preferred for network dependencies?
    options:
      - "Thread pools consume substantially less memory per call than semaphore counters do"
      - "Semaphores physically cannot be used to guard calls that cross a process boundary"
      - "Thread pools guarantee that downstream responses are returned in strict request order"
      - "Network calls have unpredictable latency, so you want the caller thread freed and a timeout enforceable"
    answer: 3
    explanation: |
      Network calls have unpredictable, potentially unbounded latency. Running them on a
      dedicated pool frees the caller thread and lets the framework enforce a timeout by
      abandoning the worker. Semaphore isolation, running on the caller's thread, can't
      do that — so it's reserved for fast, trusted, high-volume in-process calls.
    ref: "concepts.md#thread-pool-vs-semaphore-bulkheads"

  - id: circuit-breakers-and-bulkheads-016
    difficulty: intermediate
    tags: [layering, breaker, bulkhead, timeout]
    question: |
      When combining resilience patterns around a remote call, why is a timeout
      still necessary even with a circuit breaker and bulkhead in place?
    options:
      - "A timeout bounds how long any single call may block; the breaker only decides whether to call, the bulkhead only caps concurrency"
      - "The circuit breaker is completely unable to detect any failures unless a timeout also fires first"
      - "A well-tuned timeout fully replaces the need for a circuit breaker on the same remote call"
      - "Bulkheads require a per-call timeout value in order to allocate threads to their bounded pool"
    answer: 0
    explanation: |
      They defend different layers. A timeout bounds the duration of one call (protects
      against slow). The breaker decides whether to make the call at all (protects against
      known-bad). The bulkhead caps how much resource one dependency can consume. None
      substitutes for the others — layer all three.
    ref: "concepts.md#combining-breaker-bulkhead-and-timeout"

  - id: circuit-breakers-and-bulkheads-017
    difficulty: advanced
    tags: [circuit-breaker, slow-call, resilience4j]
    question: |
      Resilience4j can trip a breaker on slow calls, not just errors. Why is this
      valuable?
    options:
      - "Because slow calls always eventually throw an exception once they exceed the socket timeout"
      - "It meaningfully reduces the breaker's in-memory footprint by tracking fewer distinct outcomes"
      - "It catches the 'slow is worse than down' case where calls succeed but degrade the caller by holding resources"
      - "Slow-call detection fully replaces the need for any per-call timeout on the remote dependency"
    answer: 2
    explanation: |
      A dependency can be technically 'up' (returning 200s) but so slow that it exhausts
      the caller's threads — the most dangerous failure mode. Tripping on a slowCallRate
      lets the breaker react to degradation that a pure error-rate threshold would miss.
    ref: "concepts.md#closed-state-and-tripping-thresholds"

  - id: circuit-breakers-and-bulkheads-018
    difficulty: intermediate
    tags: [circuit-breaker, half-open, transitions]
    question: |
      From the HALF-OPEN state, what causes the breaker to transition back to OPEN?
    options:
      - "The sleep window expiring again"
      - "A trial (probe) call failing"
      - "All trial calls succeeding"
      - "An operator manually closing it"
    answer: 1
    explanation: |
      In HALF-OPEN the breaker admits a few trial calls. If a trial call fails (against
      the failure threshold), the dependency still looks unhealthy, so the breaker returns
      to OPEN and restarts the sleep window. Only successful trials move it to CLOSED.
    ref: "concepts.md#the-circuit-breaker-state-machine"

  - id: circuit-breakers-and-bulkheads-019
    difficulty: beginner
    tags: [circuit-breaker, states, closed]
    question: |
      What does the CLOSED state of a circuit breaker mean?
    options:
      - "Normal operation — calls pass through while the breaker counts outcomes"
      - "The dependency is blocked and no calls are allowed"
      - "The breaker is permanently disabled and rejects every call from now on"
      - "Only a small number of trial probe calls are permitted through"
    answer: 0
    explanation: |
      CLOSED is the normal, healthy state: calls flow through to the dependency and the
      breaker tracks the success/failure rate. If that rate crosses the threshold (over
      the minimum volume) the breaker trips to OPEN. The 'closed' name mirrors an
      electrical circuit where a closed circuit conducts current.
    ref: "concepts.md#closed-state-and-tripping-thresholds"

  - id: circuit-breakers-and-bulkheads-020
    difficulty: advanced
    tags: [bulkhead, isolation, blast-radius]
    question: |
      A monolith uses a single shared thread pool for all outbound calls to five
      downstream services. One downstream, an analytics API, becomes very slow.
      What is the likely blast radius, and what pattern prevents it?
    options:
      - "The slow analytics dep can consume the whole shared pool and starve calls to the other four services; per-dependency bulkheads prevent it"
      - "Only the analytics calls slow down; the shared pool naturally quarantines the slow dependency, so no additional pattern is needed"
      - "The database transparently absorbs the extra load by spilling the queued outbound calls onto spare replica connections until analytics recovers"
      - "The circuit breaker alone fully prevents thread exhaustion here because it trips the instant analytics latency rises and frees the shared pool"
    answer: 0
    explanation: |
      With one shared pool, the slow analytics dependency parks every thread, starving
      calls to healthy services too. Per-dependency bulkheads cap analytics to its own
      pool, so the other four keep serving. A breaker helps by failing fast once analytics
      is flagged unhealthy, but the isolation guarantee comes from the bulkhead.
    ref: "concepts.md#bulkheads-resource-isolation"

  - id: circuit-breakers-and-bulkheads-021
    difficulty: intermediate
    tags: [circuit-breaker, minimum-volume, anti-pattern]
    question: |
      A breaker is configured with a 50% failure-rate threshold but no minimum-volume
      requirement. What is the most likely symptom?
    options:
      - "The breaker flaps open on tiny, unrepresentative samples (e.g. 1 of 2 calls failing)"
      - "The breaker never trips because a bare failure rate with no volume gate is treated as zero"
      - "The breaker latches permanently open the first time the rate crosses fifty percent"
      - "The sleep window is silently ignored whenever no minimum-volume value is configured"
    answer: 0
    explanation: |
      Without a minimum-volume gate, the rate is computed on whatever few calls exist.
      One failure out of two calls reads as 50% and trips the breaker even though the
      dependency may be fine. This flapping is why minimumNumberOfCalls / requestVolumeThreshold
      exists.
    ref: "concepts.md#closed-state-and-tripping-thresholds"

  - id: circuit-breakers-and-bulkheads-022
    difficulty: advanced
    tags: [layering, retry, latency, ordering]
    question: |
      An idempotent call is wrapped as Retry(TimeLimiter(call)) with 3 retries and a
      10 s per-call timeout, no overall budget. What is the danger?
    options:
      - "The retries will never execute because the TimeLimiter consumes the attempt budget first"
      - "Worst-case latency can reach ~30 s (3 x 10 s), blowing the caller's latency budget"
      - "The 10 s timeout silently disables the retry decorator wrapped around it"
      - "Retries bypass the per-call timeout entirely and run with an unbounded duration"
    answer: 1
    explanation: |
      Retries multiplied by a per-call timeout stack up: 3 attempts x 10 s = up to 30 s of
      blocking before giving up. Without an overall retry/time budget the caller's latency
      SLO is blown and its own threads are held far too long. Cap the total retry budget so
      worst-case latency stays bounded.
    ref: "concepts.md#combining-breaker-bulkhead-and-timeout"

  - id: circuit-breakers-and-bulkheads-023
    difficulty: intermediate
    tags: [fallback, graceful-degradation, breaker]
    question: |
      A circuit breaker that trips OPEN with no fallback simply converts a hang into
      an error. When would you add a fallback instead?
    options:
      - "Never — surfacing a raw error to the caller is always preferable to any fallback"
      - "Only for write operations, since reads can safely fail fast without any fallback"
      - "When a degraded but useful response (e.g. cached or default data) is better for users than an error"
      - "Only when the failing dependency happens to be a relational database"
    answer: 2
    explanation: |
      Failing fast is good, but for non-critical dependencies a degraded answer (cached
      value, default, or reduced feature) often serves users better than an outright error.
      That's graceful degradation — see reliability-ops/graceful-degradation-and-fallbacks.
    ref: "concepts.md#combining-breaker-bulkhead-and-timeout"

  - id: circuit-breakers-and-bulkheads-024
    difficulty: advanced
    tags: [envoy, istio, mesh, outlier-detection]
    question: |
      In a service mesh like Envoy/Istio, "outlier detection" acts as a circuit
      breaker at the proxy layer. What does it eject when a host misbehaves?
    options:
      - "The entire upstream service, removing every one of its hosts from the mesh at once"
      - "The downstream client's connection, tearing down the calling sidecar's socket pool"
      - "The mesh control plane, which is quarantined until its health checks pass again"
      - "An individual unhealthy upstream host from the load-balancing pool"
    answer: 3
    explanation: |
      Envoy's outlier detection ejects individual unhealthy hosts from the upstream
      load-balancing pool for a period (then probes them back) — a per-host breaker at
      L7. This differs from an application breaker, which trips per logical dependency
      rather than per host.
    ref: "concepts.md#resilience4j-and-hystrix"

  - id: circuit-breakers-and-bulkheads-025
    difficulty: beginner
    tags: [nygard, release-it, stability-patterns]
    question: |
      Circuit Breaker and Bulkhead are stability patterns popularized by which book?
    options:
      - "Michael Nygard's Release It!"
      - "The Phoenix Project"
      - "Designing Data-Intensive Applications"
      - "The Google SRE Workbook"
    answer: 0
    explanation: |
      Michael Nygard's Release It! introduced the Circuit Breaker, Bulkhead, Timeout, and
      other stability patterns, along with the integration-point and cascading-failure
      failure modes they defend against.
    ref: "concepts.md#references"

  - id: circuit-breakers-and-bulkheads-026
    difficulty: advanced
    tags: [distributed, breaker-state, tradeoff]
    question: |
      Circuit-breaker state is usually kept per-instance (in-memory) rather than
      shared across all instances. What is the main trade-off of a shared/distributed
      breaker?
    options:
      - "It is strictly better in every dimension and is therefore the standard choice in practice"
      - "It is fundamentally unable to represent the OPEN state across coordinating instances"
      - "It adds an external dependency and latency to every call, and can itself become a failure point"
      - "It fully removes the need for per-dependency bulkheads once state is shared"
    answer: 2
    explanation: |
      A distributed breaker would coordinate state across instances but requires a shared
      store, adding latency and a new failure mode to the very path meant to be resilient.
      Most systems accept per-instance breakers, often complemented by mesh-level outlier
      detection for host ejection.
    ref: "concepts.md#common-interview-follow-ups"

  - id: circuit-breakers-and-bulkheads-027
    difficulty: intermediate
    tags: [tooling, polly, gobreaker, opossum]
    question: |
      Which library is a circuit-breaker / resilience implementation for the .NET
      ecosystem?
    options:
      - "opossum"
      - "gobreaker"
      - "Resilience4j"
      - "Polly"
    answer: 3
    explanation: |
      Polly is the resilience/transient-fault-handling library for .NET. opossum is for
      Node.js, gobreaker for Go, and Resilience4j for the JVM. Knowing the per-ecosystem
      equivalents is a common interview signal.
    ref: "concepts.md#resilience4j-and-hystrix"

  - id: circuit-breakers-and-bulkheads-028
    difficulty: advanced
    tags: [scenario, fan-out, resilience-design]
    question: |
      You're designing resilience for a service that fans out to five downstream
      dependencies. Which combination best limits blast radius while allowing healthy
      deps to keep serving?
    options:
      - "Per-dependency bulkheads + a breaker per dependency + per-dep timeouts + backoff retries on idempotent calls"
      - "One shared thread pool + one global breaker covering all five dependencies together as a single unit"
      - "Unbounded retries with no breaker, relying on the downstreams to eventually absorb the repeated load"
      - "A single very large timeout across all five deps and no other resilience pattern in the call path"
    answer: 0
    explanation: |
      Per-dependency bulkheads stop one slow dep from starving the others; a breaker per
      dependency fails fast on a bad one; timeouts tuned to each dep's p99 bound blocking;
      backoff+jitter retries on idempotent calls handle transient blips. A shared pool or
      global breaker couples the deps together and defeats isolation.
    ref: "concepts.md#combining-breaker-bulkhead-and-timeout"

  - id: circuit-breakers-and-bulkheads-029
    difficulty: intermediate
    tags: [circuit-breaker, half-open, why]
    question: |
      Why do breakers use a HALF-OPEN probe stage instead of jumping straight from
      OPEN back to CLOSED when the sleep window expires?
    options:
      - "To re-probe with a trickle of traffic and avoid slamming full load onto a possibly-still-fragile dependency"
      - "To deliberately slow down recovery so an operator can audit the transition first"
      - "Because moving to CLOSED always requires an explicit manual approval step"
      - "To reset the sliding-window metrics counters back to zero before resuming"
    answer: 0
    explanation: |
      Jumping OPEN to CLOSED on a timer would immediately restore full load, which could
      re-trigger the outage if the dependency is only partly recovered. HALF-OPEN admits a
      limited number of trial calls first, so recovery is validated gently before full
      traffic resumes.
    ref: "concepts.md#the-circuit-breaker-state-machine"

  - id: circuit-breakers-and-bulkheads-030
    difficulty: advanced
    tags: [sleep-window, adaptive, backoff]
    question: |
      For a dependency whose outages sometimes last minutes, what refinement to the
      OPEN-state sleep window helps avoid wasteful probing?
    options:
      - "Use an exponential/adaptive sleep window that backs off on repeated HALF-OPEN failures"
      - "Set the sleep window to zero so the breaker re-probes continuously throughout the outage"
      - "Disable the HALF-OPEN state so the breaker jumps straight from OPEN back to CLOSED"
      - "Count 4xx client errors toward the failure rate so the breaker opens sooner and stays open"
    answer: 0
    explanation: |
      A fixed short sleep window probes every few seconds throughout a long outage. An
      exponential/adaptive window (5 s, 10 s, 20 s, ...) backs off after repeated failed
      probes, so a dependency in an extended outage isn't hammered while recovering, yet a
      quick blip still recovers fast.
    ref: "concepts.md#open-state-the-sleep-window-and-recovery"

  - id: circuit-breakers-and-bulkheads-031
    difficulty: intermediate
    tags: [layering, ordering, retry, breaker]
    question: |
      Placing the retry OUTSIDE the circuit breaker (Retry(CircuitBreaker(call)))
      has what desirable effect?
    options:
      - "Retries bypass the breaker entirely, never touching its failure accounting on any attempt"
      - "The breaker can never open because retries wrapped outside it suppress every trip signal"
      - "Per-call timeouts are silently disabled for the duration of any retry sequence"
      - "Each retry is a fresh breaker-evaluated call, so a retry storm feeds and can trip the breaker"
    answer: 3
    explanation: |
      With retry outside the breaker, every retry passes through the breaker and counts
      toward its accounting. So if retries pile up against a failing dependency, the breaker
      sees the failures and trips OPEN, cutting off the storm — retries feed the breaker
      rather than evading it.
    ref: "concepts.md#combining-breaker-bulkhead-and-timeout"

  - id: circuit-breakers-and-bulkheads-032
    difficulty: beginner
    tags: [electrical, metaphor, trip]
    question: |
      The circuit-breaker software pattern borrows its name from an electrical
      breaker. What does "tripping" (opening) the breaker correspond to?
    options:
      - "Increasing the current flowing to the dependency to push it back to full health"
      - "Passively recording success and failure metrics about the dependency's behavior"
      - "Automatically retrying the failed operation until it eventually succeeds"
      - "Cutting the circuit to protect the system when conditions become dangerous"
    answer: 3
    explanation: |
      An electrical breaker trips (opens the circuit) to stop dangerous current and protect
      wiring. The software breaker trips OPEN when the error rate is dangerous, cutting calls
      to protect the caller from resource exhaustion — the same protective-cutoff idea.
    ref: "concepts.md#the-circuit-breaker-state-machine"

  - id: circuit-breakers-and-bulkheads-033
    difficulty: advanced
    tags: [scenario, slow-dependency, decision]
    question: |
      A downstream is intermittently slow (p99 spikes to 10 s) but not returning
      errors. Your callers' thread pools are filling up. What's the most effective
      immediate protection?
    options:
      - "Increase the caller's timeout to 30 s so the slow calls are given time to finish"
      - "Add more retries against the slow dependency to try to obtain a faster response"
      - "Enforce a tight timeout plus slow-call-based breaker tripping and a bulkhead to cap concurrency"
      - "Remove the circuit breaker so calls aren't blocked and every request reaches the dependency"
    answer: 2
    explanation: |
      The failure mode is thread exhaustion from slow (not errored) calls. A tight timeout
      frees threads, a slow-call-rate breaker trips on degradation even without errors, and
      a bulkhead caps how many threads this dep can hold. Raising the timeout or adding
      retries makes the exhaustion worse.
    ref: "concepts.md#combining-breaker-bulkhead-and-timeout"

  - id: circuit-breakers-and-bulkheads-034
    difficulty: intermediate
    tags: [bulkhead, resources, generalization]
    question: |
      Beyond thread pools, which of these is also a valid application of the
      bulkhead principle?
    options:
      - "Encrypting stored connection strings so a leak exposes no usable credentials"
      - "Compressing outbound HTTP responses to conserve bandwidth under heavy load"
      - "Partitioning connection pools, request slots, or host groups/cells per dependency or tenant"
      - "Caching DNS lookups locally so repeated name resolutions avoid extra round-trips"
    answer: 2
    explanation: |
      Bulkheading applies to any finite resource: separate connection pools, in-flight
      request slots, memory, or even separate host groups/cells (cell-based architecture).
      The unifying idea is capping the blast radius of any single failure or noisy tenant.
    ref: "concepts.md#bulkheads-resource-isolation"

  - id: circuit-breakers-and-bulkheads-035
    difficulty: advanced
    tags: [anti-pattern, timeout, ordering]
    question: |
      Why is setting a downstream call's timeout LONGER than the caller's own timeout
      an anti-pattern?
    options:
      - "It makes the circuit breaker trip far too early on otherwise healthy responses"
      - "It violates the HTTP specification's rules on client and server timeout ordering"
      - "It silently disables the bulkhead protecting that downstream dependency's pool"
      - "The call keeps running after the caller already gave up — wasted work with no benefit"
    answer: 3
    explanation: |
      If your call to the downstream runs longer than the client that called YOU is willing
      to wait, the client has already timed out and abandoned the request. Your call
      continues consuming resources for a result nobody will use. Timeouts should shrink as
      you go deeper in the call graph.
    ref: "concepts.md#common-anti-patterns"

  - id: circuit-breakers-and-bulkheads-036
    difficulty: intermediate
    tags: [resilience4j, config, defaults]
    question: |
      In Resilience4j, what does the permittedNumberOfCallsInHalfOpenState setting
      control?
    options:
      - "The number of automatic retry attempts performed per failing call"
      - "How many trial calls are allowed through while the breaker is HALF-OPEN"
      - "The size of the CLOSED-state sliding window used to compute the failure rate"
      - "The maximum concurrent calls the paired semaphore bulkhead will admit at once"
    answer: 1
    explanation: |
      permittedNumberOfCallsInHalfOpenState (default 10) bounds the trial traffic used to
      test recovery. Their aggregate success/failure rate against the threshold decides
      whether the breaker closes or re-opens.
    ref: "concepts.md#open-state-the-sleep-window-and-recovery"

  - id: circuit-breakers-and-bulkheads-037
    difficulty: advanced
    tags: [scenario, bulkhead, tenant-isolation]
    question: |
      One noisy tenant's traffic to a shared multi-tenant service is degrading all
      tenants. Which reliability pattern most directly addresses this?
    options:
      - "A single global circuit breaker that trips for the whole service the moment aggregate errors rise"
      - "Per-tenant bulkheads (isolated resource quotas) so one tenant can't consume everyone's capacity"
      - "Uniformly longer client timeouts for every tenant so their slow calls are given more time to finish"
      - "Disabling automatic retries globally so the noisy tenant's requests stop being amplified across pools"
    answer: 1
    explanation: |
      This is a noisy-neighbor problem. Per-tenant bulkheads (isolated pools/quotas) cap
      how much of the shared resource any single tenant can consume, so one tenant's spike
      can't starve the others. A global breaker would just cut everyone off together.
    ref: "concepts.md#bulkheads-resource-isolation"

  - id: circuit-breakers-and-bulkheads-038
    difficulty: intermediate
    tags: [circuit-breaker, observability, cross-ref]
    question: |
      A circuit breaker flipping to OPEN is a high-value operational signal. Which
      domain owns HOW you emit and alert on that signal?
    options:
      - "This topic (circuit breakers) owns the alerting mechanics"
      - "observability owns metric emission and alerting; the breaker just produces the signal"
      - "security owns breaker alerting, since a tripped breaker is treated as an intrusion signal"
      - "No domain — breaker state should never be alerted on"
    answer: 1
    explanation: |
      The breaker produces state and trip events; how you turn those into metrics,
      dashboards, and alerts is observability's domain. This topic cross-references it
      rather than duplicating alerting mechanics.
    ref: "concepts.md#open-state-the-sleep-window-and-recovery"

  - id: circuit-breakers-and-bulkheads-039
    difficulty: beginner
    tags: [bulkhead, definition]
    question: |
      What does a bulkhead do when its resource pool for a dependency is already
      full?
    options:
      - "It borrows spare threads from other dependencies' pools until the shared capacity is fully drained"
      - "It rejects (or queues) the new call rather than letting it consume shared resources"
      - "It automatically opens the paired circuit breaker and fails every subsequent call to the dependency"
      - "It retries the call immediately on a background thread until a pool slot becomes available"
    answer: 1
    explanation: |
      A bulkhead caps concurrency for its dependency. When the pool/permits are exhausted,
      new calls are rejected fast (or briefly queued) — crucially, they can't spill over and
      consume the resources reserved for other dependencies, preserving isolation.
    ref: "concepts.md#bulkheads-resource-isolation"

  - id: circuit-breakers-and-bulkheads-040
    difficulty: advanced
    tags: [scenario, breaker-vs-shed, judgment]
    question: |
      Your service is the CALLER and one downstream is failing — you want to protect
      YOUR service from that bad dependency. Which pattern family is primarily for
      this direction, versus protecting a service from INBOUND overload?
    options:
      - "Circuit breakers/bulkheads protect the caller from a bad downstream; load shedding protects a service from inbound overload"
      - "Both directions are handled solely by load shedding; breakers and bulkheads are just aliases for it"
      - "Circuit breakers protect against inbound overload; bulkheads protect downstreams"
      - "There is no directional distinction; every pattern faces the caller and the callee equally at once"
    answer: 0
    explanation: |
      Circuit breakers and bulkheads defend a CALLER against a misbehaving DOWNSTREAM.
      Protecting a service from too much INBOUND traffic is load shedding / backpressure —
      see reliability-ops/load-shedding-and-backpressure. Knowing which direction each
      pattern faces is a common interview discriminator.
    ref: "concepts.md#awss-contrarian-view-token-buckets-over-stateful-breakers"

  - id: circuit-breakers-and-bulkheads-041
    difficulty: intermediate
    tags: [anti-pattern, list]
    question: |
      Which of the following is a recognized circuit-breaker/bulkhead anti-pattern?
    options:
      - "Recording only timeouts and 5xx as failures"
      - "Using one shared thread pool for all downstream dependencies"
      - "Using a minimum-volume gate before evaluating the failure rate"
      - "Adding a fallback for a non-critical dependency"
    answer: 1
    explanation: |
      A single shared thread pool for all downstreams defeats the purpose of bulkheads —
      one slow dependency starves every call. The other three options are good practices:
      recording real failures only, gating on volume, and providing fallbacks.
    ref: "concepts.md#common-anti-patterns"

  - id: circuit-breakers-and-bulkheads-042
    difficulty: advanced
    tags: [scenario, breaker-tuning, flapping]
    question: |
      A breaker on a high-traffic dependency (thousands of calls/min) is
      occasionally tripping during brief 2-second blips that users don't even
      notice. You want it to tolerate short blips but still trip on sustained
      failure. Which adjustment is most appropriate?
    options:
      - "Lower the failure-rate threshold to 10% so the breaker reacts to even the briefest 2-second blip"
      - "Remove the minimum-volume requirement so every window is evaluated regardless of sample size"
      - "Set the sleep window to 1 ms so the breaker re-probes almost continuously after any trip"
      - "Use a larger/time-based sliding window and appropriate volume so momentary blips don't dominate the rate"
    answer: 3
    explanation: |
      A tiny window lets a 2 s blip dominate the computed failure rate. Widening the window
      (or using a time-based window) with a sensible minimum volume smooths transient blips
      while still catching sustained failure. Lowering the threshold or removing the volume
      gate would make flapping worse.
    ref: "concepts.md#closed-state-and-tripping-thresholds"

  - id: circuit-breakers-and-bulkheads-043
    difficulty: intermediate
    tags: [retry, idempotency, breaker]
    question: |
      When layering retries with a breaker and timeout, which calls are safe to
      retry automatically?
    options:
      - "All calls, since the breaker and timeout together make every retry completely side-effect-free"
      - "Only idempotent operations (retrying non-idempotent writes risks duplicates)"
      - "Only calls that returned a 4xx client error, because those indicate a transient malformed request"
      - "Only calls that ran slower than the configured timeout, since a fast failure is never worth retrying"
    answer: 1
    explanation: |
      Retrying a non-idempotent operation (e.g. a payment or a non-idempotent POST) can
      cause duplicate side effects. Only idempotent calls — or ones made idempotent via
      idempotency keys — are safe to auto-retry. See reliability-ops/retries-timeouts-and-backoff.
    ref: "concepts.md#combining-breaker-bulkhead-and-timeout"

  - id: circuit-breakers-and-bulkheads-044
    difficulty: advanced
    tags: [scenario, cascading, propagation]
    question: |
      In a cascading failure, how does the failure typically PROPAGATE through a
      synchronous call graph starting from one slow leaf service?
    options:
      - "Upward: callers' thread pools exhaust waiting on the slow service, then their callers exhaust, and so on"
      - "Downward: the slow leaf infects its own downstream dependencies first and drags them under too"
      - "It stays contained to the leaf service automatically because timeouts always quarantine the failure"
      - "Sideways only, spreading between sibling services at the same tier but never reaching the top"
    answer: 0
    explanation: |
      The slow leaf holds its callers' threads for the full timeout; those callers exhaust
      their pools and become slow/unresponsive, which then exhausts THEIR callers — the
      failure climbs UP the call graph. Breakers, bulkheads, and timeouts break this chain.
    ref: "concepts.md#why-fail-fast-the-cascading-failure-problem"

  - id: circuit-breakers-and-bulkheads-045
    difficulty: intermediate
    tags: [resilience4j, sliding-window, config]
    question: |
      Resilience4j supports COUNT_BASED and TIME_BASED sliding windows. Why might
      TIME_BASED be more predictable under highly variable traffic?
    options:
      - "It ignores individual failures entirely and trips only on a total collapse of the dependency"
      - "It always uses strictly less memory than a count-based window regardless of the traffic rate"
      - "It evaluates over a fixed time span rather than a fixed number of calls, so behavior doesn't shift with request rate"
      - "It automatically disables the minimum-volume gate so the rate is computed on any number of calls"
    answer: 2
    explanation: |
      A count-based window of N calls covers a very different time span at 10 rps vs 10,000
      rps. A time-based window (last N seconds) always reflects a fixed recent period, giving
      more predictable tripping behavior when traffic fluctuates.
    ref: "concepts.md#closed-state-and-tripping-thresholds"

  - id: circuit-breakers-and-bulkheads-046
    difficulty: beginner
    tags: [circuit-breaker, fail-fast, latency]
    question: |
      Roughly how long does a call take when a circuit breaker is OPEN, compared to
      waiting on a hung dependency with a 30 s timeout?
    options:
      - "About the same, ~30 s, because the breaker still waits out the full timeout before rejecting"
      - "Microseconds/milliseconds — it returns immediately without calling the dependency"
      - "Exactly half the configured timeout, ~15 s, since an OPEN breaker uses a halved probe timeout"
      - "It never returns at all — an OPEN breaker parks the caller thread until the dependency recovers"
    answer: 1
    explanation: |
      An OPEN breaker short-circuits: it throws or returns a fallback essentially instantly
      (microseconds) instead of blocking for the full 30 s timeout. That speed is exactly what
      frees threads and prevents pile-up — the core value of failing fast.
    ref: "concepts.md#why-fail-fast-the-cascading-failure-problem"

  - id: circuit-breakers-and-bulkheads-047
    difficulty: advanced
    tags: [scenario, semaphore, thread-pool, choice]
    question: |
      You need to protect a very high-volume (100k rps) call to a trusted in-process
      cache with sub-millisecond latency. Which bulkhead type is the better fit and why?
    options:
      - "Thread-pool bulkhead, because handing each cache lookup to a dedicated pool frees the caller thread"
      - "No bulkhead is ever appropriate for a cache since in-process calls cannot exhaust any resource"
      - "Thread-pool bulkhead, because a semaphore counter is fundamentally unable to limit concurrency"
      - "Semaphore bulkhead, because thread-pool overhead/context-switching would dominate such a fast, high-volume call"
    answer: 3
    explanation: |
      For a fast, trusted, extremely high-volume in-process call, the per-call cost of
      handing work to a separate thread pool (context switches, queueing) would dominate.
      A semaphore bulkhead — a cheap atomic concurrency counter on the caller's thread — is
      the right fit here.
    ref: "concepts.md#thread-pool-vs-semaphore-bulkheads"

  - id: circuit-breakers-and-bulkheads-048
    difficulty: intermediate
    tags: [circuit-breaker, failures-defined]
    question: |
      Which set of outcomes should typically COUNT as failures toward a circuit
      breaker's failure rate?
    options:
      - "HTTP 200 responses whose payload exceeds a size limit, since large bodies overload the caller"
      - "HTTP 404 and 400 client errors, because a not-found or bad-request signals the dependency is unhealthy"
      - "Timeouts, connection errors, and 5xx responses"
      - "Cache hits served locally, since a hit means the dependency was skipped and is presumed down"
    answer: 2
    explanation: |
      The breaker's job is to detect an unhealthy DEPENDENCY, so count signals of the
      dependency failing: timeouts, connection errors, and 5xx. 4xx are caller/business
      errors and shouldn't trip the breaker; successful responses obviously don't count.
    ref: "concepts.md#closed-state-and-tripping-thresholds"

  - id: circuit-breakers-and-bulkheads-049
    difficulty: advanced
    tags: [load-shedding, rate-limit, cross-ref, reliability]
    question: |
      Load shedding and rate limiting can be used as a RELIABILITY mechanism.
      In that framing, what is their purpose (and which domain owns the
      abuse-prevention framing)?
    options:
      - "To speed up each individual request by trimming its payload; observability owns the whole framing"
      - "To shed excess load to protect the system from collapse; security owns the abuse-prevention framing"
      - "To encrypt requests in flight so overload traffic is unreadable; security owns the entire framing"
      - "To replace circuit breakers entirely as a superior pattern; system-design owns the whole framing"
    answer: 1
    explanation: |
      As a reliability mechanism, shedding/rate-limiting drops or throttles excess load so
      the system stays up rather than collapsing under overload. Rate-limiting as
      abuse-prevention is security's domain (and see design-rate-limiter); this domain covers
      the protect-the-system angle — see reliability-ops/load-shedding-and-backpressure.
    ref: "concepts.md#brownout-and-graceful-degradation"

  - id: circuit-breakers-and-bulkheads-050
    difficulty: intermediate
    tags: [state-machine, transitions, summary]
    question: |
      Which sequence of state transitions correctly describes a breaker detecting a
      failure and then recovering?
    options:
      - "OPEN -> CLOSED -> HALF-OPEN -> OPEN"
      - "CLOSED -> OPEN -> HALF-OPEN -> CLOSED"
      - "HALF-OPEN -> OPEN -> CLOSED -> HALF-OPEN"
      - "CLOSED -> HALF-OPEN -> OPEN -> CLOSED"
    answer: 1
    explanation: |
      Normal is CLOSED. When failures cross the threshold it trips to OPEN (fail fast).
      After the sleep window it moves to HALF-OPEN (trial calls). If those succeed it returns
      to CLOSED. That's the canonical CLOSED -> OPEN -> HALF-OPEN -> CLOSED recovery path.
    ref: "concepts.md#the-circuit-breaker-state-machine"

  - id: circuit-breakers-and-bulkheads-051
    difficulty: advanced
    tags: [scenario, breaker-vs-bulkhead, judgment]
    question: |
      A dependency is returning errors quickly (fast failures, not slow). You mainly
      want to stop wasting calls on it and give it room to recover. Which single
      pattern most directly addresses this, and is a bulkhead sufficient alone?
    options:
      - "A bulkhead alone is sufficient here because capping concurrency stops the fast-failing calls from recurring"
      - "Only a longer client timeout is needed so the fast errors have more time to resolve themselves"
      - "Only automatic retries are needed, since retrying a fast failure eventually reaches a healthy path"
      - "A circuit breaker is the direct fix (stop calling, let it recover); a bulkhead alone wouldn't stop the wasted calls"
    answer: 3
    explanation: |
      Fast failures don't exhaust threads (they return quickly), so a bulkhead's concurrency
      cap doesn't help much here. The direct fix is a circuit breaker: trip OPEN to stop the
      pointless calls and give the dependency time to recover. This shows the two patterns
      target different failure modes.
    ref: "concepts.md#why-fail-fast-the-cascading-failure-problem"

  - id: circuit-breakers-and-bulkheads-052
    difficulty: intermediate
    tags: [hystrix, defaults, thread-pool]
    question: |
      Hystrix's default isolation strategy for commands was THREAD (thread-pool
      isolation). What did SEMAPHORE isolation get reserved for?
    options:
      - "Any call to a relational database, because JDBC drivers are incompatible with thread-pool isolation"
      - "Calls that must never be timed out, since a semaphore guarantees the call runs to completion"
      - "Very high-volume calls to trusted, low-latency dependencies where thread overhead wasn't worth it"
      - "Calls to external third-party APIs, whose unpredictable latency makes thread isolation too expensive"
    answer: 2
    explanation: |
      Hystrix defaulted to THREAD isolation because network calls have unpredictable latency
      and you want the caller thread freed. SEMAPHORE was reserved for very high-volume calls
      to trusted, fast dependencies, where spinning up separate threads would add more
      overhead than benefit.
    ref: "concepts.md#thread-pool-vs-semaphore-bulkheads"

  - id: circuit-breakers-and-bulkheads-053
    difficulty: advanced
    tags: [scenario, no-fallback, degradation]
    question: |
      A product page calls a "recommendations" service (non-critical) via a breaker.
      When the breaker is OPEN it currently returns a 500 and the whole page errors.
      What is the better design?
    options:
      - "Keep returning a 500 so users are clearly informed that recommendations are currently unavailable"
      - "Remove the breaker entirely so recommendation calls always go through even when the service is failing"
      - "Have the breaker's OPEN path return an empty/cached recommendations fallback so the page still renders"
      - "Retry the recommendations call 10 times with no backoff before finally failing the whole page"
    answer: 2
    explanation: |
      Recommendations are non-critical, so the page shouldn't fail when they're unavailable.
      A fallback (empty list or cached recs) on the breaker's OPEN path lets the page render
      degraded but functional — graceful degradation. Erroring the whole page or removing the
      breaker are both worse.
    ref: "concepts.md#common-anti-patterns"

  - id: circuit-breakers-and-bulkheads-054
    difficulty: beginner
    tags: [combining, patterns, summary]
    question: |
      Which statement best captures why circuit breakers, bulkheads, and timeouts
      are usually used TOGETHER?
    options:
      - "They are functionally interchangeable, so stacking all three simply adds defensive redundancy"
      - "Only deploying all three together satisfies formal reliability compliance and audit requirements"
      - "Timeouts and breakers do exactly the same job, so the bulkhead is added just to round out the set"
      - "Each defends a different layer: timeout bounds one call's duration, breaker decides whether to call, bulkhead caps resource consumption"
    answer: 3
    explanation: |
      They are not interchangeable. A timeout limits how long one call blocks; a circuit
      breaker decides whether to make the call at all; a bulkhead limits how much of your
      resource budget any single dependency can consume. Together they cover slow, bad, and
      resource-hogging failure modes.
    ref: "concepts.md#combining-breaker-bulkhead-and-timeout"

  - id: circuit-breakers-and-bulkheads-055
    difficulty: expert
    tags: [resilience4j, defaults, slow-call, gotcha]
    question: |
      A team adds a Resilience4j breaker with all defaults, expecting it to protect
      against a dependency whose latency has crept to p99 = 30 s (still returning 200s).
      The breaker never trips on slowness. Why?
    options:
      - "The default slowCallRateThreshold is 100% and slowCallDurationThreshold is 60 s, so slow-call tripping is effectively off until tuned"
      - "Resilience4j has no slow-call detection mechanism whatsoever, so a breaker can only ever trip on thrown exceptions and connection errors"
      - "The default failureRateThreshold of 50% implicitly treats any call over 1 s as a failure, so slow calls are already counted toward tripping"
      - "Slow-call detection stays dormant until a ThreadPoolBulkhead is registered on the same instance and explicitly wired into the breaker"
    answer: 0
    explanation: |
      Out of the box, slowCallRateThreshold defaults to 100% (essentially disabled) and
      slowCallDurationThreshold defaults to 60 s. Calls at p99=30 s are under the 60 s bar and
      never counted "slow," and even if they were, you'd need ~100% of them slow to trip. You
      must lower both (e.g. 80% / 2 s) to enforce slow-call tripping.
    ref: "concepts.md#resilience4j-configuration-defaults-reference"

  - id: circuit-breakers-and-bulkheads-056
    difficulty: expert
    tags: [resilience4j, auto-transition, incident, half-open]
    question: |
      A breaker tripped OPEN during an incident. The dependency fully recovered an hour
      ago, but the breaker is still OPEN and failing every call, even though traffic is
      very low. Using Resilience4j defaults, what is the most likely cause?
    options:
      - "waitDurationInOpenState defaults to 0 ms, which Resilience4j treats as a permanent lock that can never be lifted once the breaker opens"
      - "automaticTransitionFromOpenToHalfOpenEnabled defaults to false, so with almost no traffic nothing fires the lazy OPEN to HALF-OPEN check"
      - "The count-based sliding window filled with stale 5xx outcomes that Resilience4j never evicts, so the computed failure rate stays pinned at 100%"
      - "permittedNumberOfCallsInHalfOpenState defaults to 0, so the breaker reaches HALF-OPEN but has zero trial slots and can never validate recovery"
    answer: 1
    explanation: |
      By default Resilience4j has NO background thread moving OPEN to HALF-OPEN; the
      transition is evaluated lazily on the next incoming call. With near-zero traffic there
      is no next call to trigger it, so the breaker sits OPEN indefinitely. Fix: enable
      automaticTransitionFromOpenToHalfOpenEnabled (spawns a scheduler) or send probe traffic.
    ref: "concepts.md#resilience4j-configuration-defaults-reference"

  - id: circuit-breakers-and-bulkheads-057
    difficulty: advanced
    tags: [resilience4j, semaphore-bulkhead, defaults]
    question: |
      What is the default maxConcurrentCalls for a Resilience4j SemaphoreBulkhead, and
      what does its default maxWaitDuration of 0 mean?
    options:
      - "Default 100; maxWaitDuration 0 means a call with no free permit blocks forever until another call releases one"
      - "Default 10; maxWaitDuration 0 is a sentinel that fully disables the bulkhead so every call passes through unmetered"
      - "Default 25; maxWaitDuration 0 means a call is rejected immediately when no permit is free rather than waiting"
      - "Default 50; maxWaitDuration 0 means new calls queue indefinitely in an unbounded backlog until a permit frees"
    answer: 2
    explanation: |
      The SemaphoreBulkhead defaults to maxConcurrentCalls = 25. maxWaitDuration = 0 means a
      call that finds no free permit fails fast (BulkheadFullException) instead of blocking,
      which is usually what you want — you don't turn a concurrency cap into a new source of
      thread parking.
    ref: "concepts.md#resilience4j-configuration-defaults-reference"

  - id: circuit-breakers-and-bulkheads-058
    difficulty: expert
    tags: [littles-law, sizing, bulkhead, numbers]
    question: |
      A downstream serves 800 req/s at an average latency of 250 ms. Using Little's Law,
      what is the minimum bulkhead/thread-pool concurrency you must provision to avoid
      rejecting healthy traffic?
    options:
      - "About 200"
      - "About 20"
      - "About 3200"
      - "About 800"
    answer: 0
    explanation: |
      Little's Law: L = lambda x W = 800 /s x 0.25 s = 200 concurrent in-flight calls. If the
      pool is smaller than ~200 you'll queue and eventually reject even when the dependency is
      perfectly healthy. Sizing bulkheads is arithmetic, not a guess.
    ref: "concepts.md#littles-law-and-sizing-bulkheads"

  - id: circuit-breakers-and-bulkheads-059
    difficulty: expert
    tags: [littles-law, cascading-failure, numbers, threads]
    question: |
      Service A has 300 request threads and a 30 s timeout on calls to B. B hangs
      completely. Approximately what steady request rate to B is enough to park ALL of
      A's threads?
    options:
      - "About 10 req/s"
      - "About 300 req/s"
      - "About 90 req/s"
      - "About 1 req/s"
    answer: 0
    explanation: |
      By Little's Law the saturating rate is lambda = L / W = 300 / 30 = 10 req/s. Just ~10
      requests per second to a hung B parks all 300 threads, after which A can serve nothing —
      including endpoints that never touch B. An OPEN breaker collapses W to microseconds,
      freeing threads almost instantly.
    ref: "concepts.md#littles-law-and-sizing-bulkheads"

  - id: circuit-breakers-and-bulkheads-060
    difficulty: expert
    tags: [adaptive-concurrency, netflix, tcp, dynamic-bulkhead]
    question: |
      Netflix's concurrency-limits library replaces static thread-pool bulkheads with an
      adaptive limit. What is the core analogy and why is it preferred in autoscaling
      systems?
    options:
      - "It mimics a leaky-bucket rate limiter draining at a fixed rate; preferred because it caps requests per second rather than concurrency, which autoscalers track directly"
      - "It pins the limit to a fixed multiple of the CPU count on each host; preferred because that constant is trivially simple and never needs runtime adjustment"
      - "It disables concurrency limits entirely and leans solely on per-call timeouts to abandon work; preferred because there is then no limit to keep in sync with autoscaling"
      - "It behaves like TCP congestion control (limit ~ congestion window), probing up when latency is healthy and backing off when latency rises; a static pool quickly goes out of date"
    answer: 3
    explanation: |
      The adaptive limit is analogous to the TCP congestion window: it increases while latency
      stays healthy and decreases when latency rises (a queue is forming), converging on
      Little's Law (limit ~ RPS x latency). A static bulkhead is a fixed guess that goes stale
      as load, instance size, and dependency latency change — the reason Netflix moved off it.
    ref: "concepts.md#adaptive-concurrency-limits-the-dynamic-bulkhead"

  - id: circuit-breakers-and-bulkheads-061
    difficulty: expert
    tags: [adaptive-concurrency, vegas, gradient2, aimd]
    question: |
      In Netflix's concurrency-limits, which algorithm is delay-based (estimating queue
      from RTT inflation) and recommended for SERVER-side limiting?
    options:
      - "AIMD, because it reacts to packet loss and dropped connections, which is exactly the signal a server observes first"
      - "Gradient2, because it drives the limit from a single instantaneous latency sample and so responds fastest on the server side"
      - "Vegas, using queue = limit x (1 - minRTT/sampleRTT) to increment/decrement the limit"
      - "A fixed static limit, because a server cannot measure round-trip time on its own inbound requests and so cannot adapt"
    answer: 2
    explanation: |
      Vegas is delay-based: it estimates the queue as limit x (1 - minRTT/sampleRTT),
      incrementing the limit when the queue is below a small alpha (~2-3) and decrementing when
      above beta (~4-6). Because it reacts to latency before driving errors, it's recommended
      server-side; AIMD (loss-based) is recommended client-side.
    ref: "concepts.md#adaptive-concurrency-limits-the-dynamic-bulkhead"

  - id: circuit-breakers-and-bulkheads-062
    difficulty: expert
    tags: [adaptive-concurrency, robustness, gc-pause, smoothing]
    question: |
      An adaptive concurrency limiter collapses its limit during a brief GC pause on the
      dependency — the latency spike was noise, not real congestion. Which mitigations
      best keep the limiter robust?
    options:
      - "Remove the adaptive limiter and fall back to a fixed static pool sized for peak, so a GC pause can never move the limit at all"
      - "Set the minimum limit floor to 0 so the limiter can fully close during any spike and reopen once latency recovers"
      - "Use dual-EWMA smoothing (Gradient2), a minimum-limit floor, and periodic minRTT recalibration"
      - "Trip a circuit breaker on the very first slow call so the GC-affected host is ejected before it can distort the limit"
    answer: 2
    explanation: |
      A transient spike shouldn't be treated as sustained congestion. EWMA smoothing (as in
      Gradient2's short-vs-long latency ratio) damps the noise, a minimum-limit floor prevents
      the limit from collapsing to a level that can't make progress, and periodic minRTT
      recalibration keeps the healthy baseline from drifting.
    ref: "concepts.md#adaptive-concurrency-limits-the-dynamic-bulkhead"

  - id: circuit-breakers-and-bulkheads-063
    difficulty: expert
    tags: [aws, token-bucket, breaker, bimodal, tradeoff]
    question: |
      The AWS Builders' Library is skeptical of client-side circuit breakers. What is its
      main objection, and what does it prefer instead?
    options:
      - "Breakers add too much per-call latency from their state bookkeeping; it prefers simply setting longer client-side timeouts on each dependency"
      - "Breakers only work when deployed through a service mesh sidecar; it prefers keeping Hystrix in the application process instead"
      - "A breaker adds a mode that only activates under failure (bimodal, hard to test); it prefers stateless self-limiting like a retry token bucket plus server-side load shedding"
      - "Breakers are structurally unable to detect slow-but-successful calls; it prefers unbounded retries that eventually reach a fast replica"
    answer: 2
    explanation: |
      AWS's concern is bimodal behavior: the breaker introduces a failure-only mode that is
      exercised precisely when you can least test it. It prefers stateless mechanisms — a retry
      token bucket that self-limits retries as a fraction of traffic, backoff+jitter, and
      server-side load shedding — over stateful client breakers and rarely-exercised fallbacks.
    ref: "concepts.md#awss-contrarian-view-token-buckets-over-stateful-breakers"

  - id: circuit-breakers-and-bulkheads-064
    difficulty: expert
    tags: [aws, token-bucket, retry-storm, stateless]
    question: |
      How does a retry token bucket limit retry amplification WITHOUT a stateful circuit
      breaker?
    options:
      - "It hard-blocks every retry the instant any single error is observed, refusing all further attempts until an operator manually clears it"
      - "It flips a shared global mode that rejects all traffic, not just retries, until the dependency's success rate climbs back above a threshold"
      - "It doubles the per-call timeout on each successive retry, so amplification is bounded by attempts eventually exceeding the caller's deadline"
      - "Each retry costs a token and successes slowly refill the bucket, so broad failure drains the bucket and retries self-limit as a fraction of traffic"
    answer: 3
    explanation: |
      The client holds a bucket of retry tokens; each retry spends one and successes refill
      slowly. When a dependency is broadly failing, the bucket drains and retries stop
      amplifying load — bounding retries to a fraction of traffic. It's stateless and unimodal
      (no global failure mode flip), which is why AWS favors it over a stateful breaker.
    ref: "concepts.md#awss-contrarian-view-token-buckets-over-stateful-breakers"

  - id: circuit-breakers-and-bulkheads-065
    difficulty: advanced
    tags: [metastable-failure, retry-storm, incident]
    question: |
      An outage's original trigger cleared 20 minutes ago, yet the system stays down —
      client retries keep the dependency saturated. What is this failure class called,
      and what actually ends it?
    options:
      - "A metastable failure; ending it requires REDUCING load (shed/break/drain retries), because adding capacity just feeds the sustaining loop"
      - "A split-brain failure; ending it requires forcing a fresh leader election so the partitioned replicas agree on a single primary again"
      - "A cold-start failure; ending it requires a full cache warm-up so requests stop missing and falling through to the cold dependency"
      - "A capacity failure; ending it requires adding more instances until aggregate throughput finally exceeds the offered request rate"
    answer: 0
    explanation: |
      This is a metastable failure (Bronson et al., HotOS 2021): a sustaining feedback loop
      (retries) keeps the system down after the trigger clears. Adding capacity often feeds the
      loop; the fix is reducing load — shed inbound, trip breakers, or drain the retry storm
      (token bucket). The DynamoDB us-east-1 2015 event is a canonical example.
    ref: "concepts.md#awss-contrarian-view-token-buckets-over-stateful-breakers"

  - id: circuit-breakers-and-bulkheads-066
    difficulty: advanced
    tags: [resilience4j, states, forced-open, incident]
    question: |
      During an incident you know a specific dependency is broken and want to stop ALL
      calls to it immediately, regardless of its measured failure rate. Which Resilience4j
      state is the right manual lever?
    options:
      - "DISABLED"
      - "METRICS_ONLY"
      - "FORCED_OPEN"
      - "HALF_OPEN"
    answer: 2
    explanation: |
      FORCED_OPEN is the manual kill-switch: it always rejects and records nothing, so you
      cut traffic to a known-bad dependency without waiting for the rate threshold. DISABLED is
      the opposite (always allow / bypass), and METRICS_ONLY observes without tripping.
    ref: "concepts.md#the-full-resilience4j-state-set"

  - id: circuit-breakers-and-bulkheads-067
    difficulty: expert
    tags: [resilience4j, metrics-only, rollout, shadow-mode]
    question: |
      You want to introduce a circuit breaker on a critical path but are unsure your
      thresholds are correct and don't want to risk tripping in production yet. What is
      the safest rollout using Resilience4j's states?
    options:
      - "Start in FORCED_OPEN so no calls flow at all, then abruptly flip to CLOSED once you believe the thresholds look about right"
      - "Start in DISABLED forever so the breaker records nothing and can never trip, keeping the critical path completely untouched"
      - "Start in METRICS_ONLY to observe what WOULD trip, tune thresholds, then flip to the enforcing CLOSED state"
      - "Start with permittedNumberOfCallsInHalfOpenState = 0 so probe traffic is suppressed and the breaker cannot act on the critical path"
    answer: 2
    explanation: |
      METRICS_ONLY records outcomes and computes the failure/slow rates but never trips —
      shadow mode. You watch what the breaker WOULD have done against real traffic, tune
      thresholds accordingly, then switch to the enforcing CLOSED state. This avoids a
      mis-tuned breaker causing a self-inflicted outage on day one.
    ref: "concepts.md#the-full-resilience4j-state-set"

  - id: circuit-breakers-and-bulkheads-068
    difficulty: expert
    tags: [ordering, resilience4j, decorators, spring-boot]
    question: |
      What is the canonical Resilience4j Spring Boot aspect order (outermost to innermost),
      and why is Bulkhead innermost?
    options:
      - "Bulkhead, TimeLimiter, RateLimiter, CircuitBreaker, Retry — Bulkhead innermost so retries are cheapest"
      - "Retry, CircuitBreaker, RateLimiter, TimeLimiter, Bulkhead — Bulkhead innermost so it sits closest to the resource it protects"
      - "CircuitBreaker, Retry, Bulkhead, TimeLimiter, RateLimiter — Bulkhead innermost to share permits with the breaker"
      - "TimeLimiter, Bulkhead, Retry, CircuitBreaker, RateLimiter — order is arbitrary"
    answer: 1
    explanation: |
      The default order is Retry > CircuitBreaker > RateLimiter > TimeLimiter > Bulkhead > call.
      Retry outermost so each retry re-evaluates the breaker; the breaker short-circuits before
      spending a rate-limiter permit or bulkhead slot; the TimeLimiter bounds the call; and the
      Bulkhead sits innermost, closest to the actual resource whose concurrency it caps.
    ref: "concepts.md#combining-breaker-bulkhead-and-timeout"

  - id: circuit-breakers-and-bulkheads-069
    difficulty: expert
    tags: [granularity, partial-degradation, outlier-detection, flapping]
    question: |
      A dependency has 8 shards; 4 are unhealthy. A single logical breaker for the whole
      dependency flaps OPEN and HALF-OPEN as it sees ~50% failures. What granularity change
      most directly fixes this?
    options:
      - "One coarser global breaker spanning every dependency, so a single trip cuts all downstream calls together while the shards recover"
      - "A per-tenant breaker keyed by the calling customer, so each tenant's requests to the shard set are isolated behind their own trip decision"
      - "Per-host/per-upstream outlier detection (as in Envoy) that ejects only the bad shards, leaving the healthy ones serving"
      - "Lower minimumNumberOfCalls to 1 so the single logical breaker trips on the very first failed request and stops oscillating"
    answer: 2
    explanation: |
      A single logical breaker can only see the aggregate ~50% rate, so it oscillates and cuts
      off the healthy shards too. Per-host outlier detection (Envoy) ejects just the 4 bad
      hosts from the load-balancing pool while the 4 healthy ones keep serving — the right
      granularity for partial degradation. A per-key breaker would explode cardinality.
    ref: "concepts.md#breaker-granularity-and-cluster-coordination"

  - id: circuit-breakers-and-bulkheads-070
    difficulty: expert
    tags: [granularity, cardinality, minimum-volume]
    question: |
      An engineer proposes a separate circuit breaker per (customer-id) key to maximize
      isolation. What is the main failure mode of this extreme granularity?
    options:
      - "Breakers keyed per customer-id are impossible to implement because Resilience4j hard-caps the number of distinct breaker instances per JVM"
      - "Each per-key breaker sees so few calls it rarely reaches minimumNumberOfCalls, so it can't compute a meaningful rate or trip"
      - "Per-key breakers silently share one backing state object, so tripping any single key immediately opens the breaker for every other key too"
      - "Per-key breakers trip far too aggressively because each one is still evaluated against the whole dependency's aggregate failure rate"
    answer: 1
    explanation: |
      Too-fine granularity explodes cardinality: each key's breaker sees a trickle of calls and
      never accumulates the minimum volume needed to evaluate the rate, so it effectively never
      trips. Granularity is a trade-off — too coarse hides bad shards, too fine starves each
      breaker of the sample it needs.
    ref: "concepts.md#breaker-granularity-and-cluster-coordination"

  - id: circuit-breakers-and-bulkheads-071
    difficulty: expert
    tags: [cluster, shared-state, recovery, thundering-herd]
    question: |
      500 instances each run an in-memory breaker for the same dependency. The dependency
      recovers. What problem arises, and what is the pragmatic mitigation?
    options:
      - "Nothing goes wrong — the 500 per-instance breakers gossip their state and coordinate their HALF-OPEN transitions automatically"
      - "The breakers deadlock waiting on one another for a shared lease before any of them is permitted to move back to HALF-OPEN"
      - "The recovering dependency must expose a distributed lock that all 500 instances acquire in turn before probing, or none may proceed"
      - "All 500 probe the recovering dependency at nearly the same moment (N x probe traffic / recovery-time retry storm); mitigate with jittered sleep windows and/or mesh-level host ejection"
    answer: 3
    explanation: |
      Independent per-instance breakers each transition to HALF-OPEN around the same time and
      collectively slam the recovering dependency with N times the probe traffic. Jittered
      sleep windows spread the re-probes in time; mesh-level host ejection coordinates at the
      proxy. A shared/distributed breaker would coordinate but adds a dependency and latency.
    ref: "concepts.md#breaker-granularity-and-cluster-coordination"

  - id: circuit-breakers-and-bulkheads-072
    difficulty: advanced
    tags: [half-open, thundering-herd, high-load]
    question: |
      A very high-QPS breaker transitions to HALF-OPEN. What is the risk to the still-
      fragile dependency, and how do you mitigate it?
    options:
      - "No risk — HALF-OPEN blocks all traffic"
      - "The breaker will skip HALF-OPEN under high load automatically"
      - "The risk is only memory; increase heap"
      - "Many threads race to fill the trial slots and a burst can hit the fragile dependency; keep permittedNumberOfCallsInHalfOpenState small (~10) and re-probe with a trickle, jittered across instances"
    answer: 3
    explanation: |
      Under high load, many threads compete for the limited HALF-OPEN trial slots, and an
      unguarded auto-transition can send a burst at a dependency that hasn't fully recovered.
      Keeping the permitted count small and re-probing with a trickle (plus jitter across
      instances) validates recovery gently instead of re-triggering the outage.
    ref: "concepts.md#breaker-granularity-and-cluster-coordination"

  - id: circuit-breakers-and-bulkheads-073
    difficulty: advanced
    tags: [sliding-window, staleness, low-traffic]
    question: |
      A count-based sliding window of the last 100 calls is used on a LOW-traffic
      dependency (a few calls per minute). What subtle problem does this create?
    options:
      - "The window's memory grows quadratically because every one of the 100 slots retains a full copy of all earlier outcomes for later auditing"
      - "The 100 outcomes can span many minutes, so the failure rate reflects stale data and the breaker reacts slowly to current conditions"
      - "The count-based window structurally ignores slow calls, folding only hard connection errors into its rate, so any latency creep stays invisible to it"
      - "At low traffic the breaker trips instantly on the very first failed call because a partial window is treated as if it were already full"
    answer: 1
    explanation: |
      At low QPS, 100 calls might cover several minutes, so the computed rate mixes in old
      outcomes and lags reality — the breaker is stale. A time-based window (last N seconds)
      bounds staleness to N seconds regardless of rate, which is why it's often preferred for
      variable traffic (its own weakness is over-weighting a recent burst).
    ref: "concepts.md#sliding-window-internals"

  - id: circuit-breakers-and-bulkheads-074
    difficulty: advanced
    tags: [sliding-window, internals, memory]
    question: |
      How does a count-based sliding window typically achieve an O(1) health snapshot?
    options:
      - "It rescans and re-sums all N entries on every single call, accepting the O(n)-per-call cost because the buffer is capped at a fixed small N"
      - "It stores only the single most recent outcome and linearly extrapolates the fleet-wide failure rate from that one data point"
      - "It keeps a running total updated by add-on-record and subtract-on-evict over a circular buffer of N outcomes"
      - "It records only a random 10% sample of calls and multiplies the observed failures by ten to estimate the true rate cheaply"
    answer: 2
    explanation: |
      A circular array holds the last N outcomes and a running aggregate (failures, slow,
      total) is incremented when an outcome is recorded and decremented when the oldest is
      evicted. The snapshot is then O(1) at O(N) memory — no full rescan per call.
    ref: "concepts.md#sliding-window-internals"

  - id: circuit-breakers-and-bulkheads-075
    difficulty: advanced
    tags: [brownout, graceful-degradation, static-stability]
    question: |
      Instead of a binary breaker that hard-trips OPEN, a service under stress drops
      personalization and serves cheaper approximate results while keeping checkout
      working. What is this approach called?
    options:
      - "A retry storm, where clients hammering a struggling service amplify its load and keep it saturated long after the original trigger cleared"
      - "A brownout / graceful degradation — shedding optional work first so the service degrades continuously rather than flipping to fail-fast"
      - "A bulkhead, which partitions thread and connection pools per dependency so one saturated feature can only consume its own reserved capacity"
      - "A distributed transaction, coordinating a two-phase commit across the personalization and checkout services so their state stays mutually consistent"
    answer: 1
    explanation: |
      A brownout sheds optional work (non-critical features, fidelity, personalization) first,
      so the service degrades continuously and preserves the critical path — as opposed to a
      breaker's discontinuous flip to fail-fast. It aligns with static stability: keep serving
      the core function even when a dependency is degraded.
    ref: "concepts.md#brownout-and-graceful-degradation"

  - id: circuit-breakers-and-bulkheads-076
    difficulty: intermediate
    tags: [fail-fast, fail-silent, fallback, distinction]
    question: |
      A bare circuit breaker with no fallback is best described as doing which of the
      following to a request when the dependency hangs?
    options:
      - "Converting a hang into a fast error (fail-fast), without by itself producing a usable degraded response"
      - "Automatically returning the last cached response for that call, so the caller transparently sees stale-but-valid data while the breaker is OPEN"
      - "Silently swallowing the failure and returning an empty default value (fail-silent) so the caller never observes that anything went wrong"
      - "Blocking the caller thread and holding the request until the dependency finishes recovering and can serve a fresh response"
    answer: 0
    explanation: |
      A breaker on its own only converts a hang into a fast error — fail-fast. Producing a
      usable degraded answer requires pairing it with a fallback: fail-silent (empty/default) or
      fail-fast-with-fallback (cache/alternate source). The breaker protects your threads; the
      fallback protects the user experience.
    ref: "concepts.md#fail-fast-fail-silent-and-fallback-modes"

  - id: circuit-breakers-and-bulkheads-077
    difficulty: advanced
    tags: [hystrix, defaults, migration]
    question: |
      Which set correctly gives Hystrix's default circuit-breaker configuration?
    options:
      - "requestVolumeThreshold=100, errorThresholdPercentage=80, sleepWindow=60000 ms"
      - "requestVolumeThreshold=20, errorThresholdPercentage=50, sleepWindow=5000 ms, rolling window 10000 ms / 10 buckets"
      - "requestVolumeThreshold=1, errorThresholdPercentage=10, sleepWindow=1000 ms"
      - "requestVolumeThreshold=50, errorThresholdPercentage=50, sleepWindow=30000 ms"
    answer: 1
    explanation: |
      Hystrix defaulted to requestVolumeThreshold=20, errorThresholdPercentage=50,
      sleepWindowInMilliseconds=5000, over a rolling stats window of 10000 ms split into 10
      buckets. Its fixed 5 s sleep window with no adaptive backoff caused synchronized fleet
      re-probing (flapping), one motivation for Resilience4j-style jittered/adaptive windows.
    ref: "concepts.md#resilience4j-and-hystrix"

  - id: circuit-breakers-and-bulkheads-078
    difficulty: expert
    tags: [scenario, add-capacity, cascade, counter-intuition]
    question: |
      During a cascade caused by a sick dependency, an operator doubles the caller's
      thread pool to "absorb the load." Recovery gets WORSE. Why?
    options:
      - "The extra threads thrash CPU cache locality so badly that per-request compute time doubles, which is what actually stalls the recovery rather than the dependency's own health"
      - "The doubled pool immediately deadlocks on the downstream connection pool because there are now more worker threads than available pooled connections, freezing the caller entirely"
      - "More threads means more concurrent requests hitting the sick dependency, increasing its load and slowing its recovery — the fix is LESS load (shed/break), not more capacity"
      - "Doubling the thread pool always halves aggregate throughput because the JVM scheduler must context-switch twice as often between the runnable worker threads"
    answer: 2
    explanation: |
      A struggling dependency recovers by getting a REST. Adding caller threads just pushes more
      concurrent work onto it, deepening its overload — a classic staff-level counter-intuition.
      The correct move is to reduce offered load: trip breakers, shed inbound, or drain retries,
      so the dependency can catch up.
    ref: "concepts.md#littles-law-and-sizing-bulkheads"

  - id: circuit-breakers-and-bulkheads-079
    difficulty: advanced
    tags: [distinction, breaker, bulkhead, rate-limiter, load-shedder]
    question: |
      Circuit breaker, bulkhead, rate limiter, and load shedder are often confused. Which
      mapping is correct?
    options:
      - "All four are inbound-facing: each one drops incoming requests to protect the server itself, differing only in the exact threshold at which they start rejecting traffic"
      - "Breaker caps the request rate; bulkhead drops inbound work; rate limiter stops calls to a bad downstream; load shedder isolates resource pools per dependency (each label attached to the wrong mechanism)"
      - "They are four interchangeable names for load shedding, all describing the single act of dropping inbound requests once the server is past its capacity limit"
      - "Breaker = stop calling a bad downstream (temporal); bulkhead = cap my resources per dependency (spatial); rate limiter = cap the rate (contractual/fairness); load shedder = drop inbound to protect myself"
    answer: 3
    explanation: |
      Each faces a different direction/axis: a breaker stops calling a bad DOWNSTREAM (temporal),
      a bulkhead caps how much of MY resources one dependency can hold (spatial), a rate limiter
      enforces a rate contract/fairness, and a load shedder drops INBOUND work to protect the
      server itself. Who decides and where the drop happens is the discriminator.
    ref: "concepts.md#fail-fast-fail-silent-and-fallback-modes"

  - id: circuit-breakers-and-bulkheads-080
    difficulty: expert
    tags: [half-open, minimum-volume, evaluation, gotcha]
    question: |
      In HALF-OPEN with permittedNumberOfCallsInHalfOpenState=10, a subtle question:
      against what is the trial outcome evaluated, and what can wedge the decision under
      Resilience4j defaults?
    options:
      - "It's evaluated the instant the very first trial call succeeds, immediately closing the breaker; because that single success is decisive, nothing about probe latency or completion can ever wedge the HALF-OPEN decision"
      - "The rate is computed over the permitted trial calls once enough complete; with maxWaitDurationInHalfOpenState=0 a hung probe (and no TimeLimiter) can leave HALF-OPEN waiting indefinitely for trials to complete"
      - "It's evaluated against the full CLOSED-state sliding window of 100 calls, so the trial outcomes are simply appended to that existing buffer and the pre-outage successes still dominate the computed rate"
      - "The breaker always closes automatically once the sleep window elapses, entirely regardless of whether the permitted trial calls succeeded or failed during the HALF-OPEN probe"
    answer: 1
    explanation: |
      The recovery decision uses the failure/slow rate over the permitted trial calls, and it
      needs those calls to actually complete. maxWaitDurationInHalfOpenState defaults to 0 =
      "wait infinitely until all permitted trial calls complete," so a hung probe with no
      TimeLimiter can stall the HALF-OPEN evaluation. Pair it with a time limiter.
    ref: "concepts.md#resilience4j-configuration-defaults-reference"

  - id: circuit-breakers-and-bulkheads-081
    difficulty: advanced
    tags: [threadpool-bulkhead, resilience4j, defaults]
    question: |
      What are the Resilience4j ThreadPoolBulkhead defaults for maxThreadPoolSize,
      coreThreadPoolSize, and queueCapacity?
    options:
      - "maxThreadPoolSize=25, coreThreadPoolSize=25, queueCapacity=0"
      - "maxThreadPoolSize=availableProcessors(), coreThreadPoolSize=availableProcessors()-1, queueCapacity=100"
      - "maxThreadPoolSize=200, coreThreadPoolSize=100, queueCapacity=unbounded"
      - "maxThreadPoolSize=10, coreThreadPoolSize=10, queueCapacity=1000"
    answer: 1
    explanation: |
      The ThreadPoolBulkhead defaults tie the pool to CPU count: maxThreadPoolSize =
      Runtime.availableProcessors(), coreThreadPoolSize = availableProcessors() - 1, with a
      queueCapacity of 100 and a keepAliveDuration of 20 ms. Knowing these defaults matters
      because they may be far too small (or wrong-shaped) for an I/O-bound remote call.
    ref: "concepts.md#resilience4j-configuration-defaults-reference"

  - id: circuit-breakers-and-bulkheads-082
    difficulty: advanced
    tags: [nygard, release-it, integration-point, story]
    question: |
      Nygard's Release It! opens with an airline outage: a single hung SQL socket (no
      timeout) exhausted a connection pool and cascaded into a system-wide failure. What
      principle does this canonical story anchor?
    options:
      - "Encrypting the connection pool's credentials and SQL traffic at rest is what prevents the outage, since the hung socket was really a security exposure rather than a resource-exhaustion problem"
      - "Slow is worse than down — an unbounded/hung integration point holds a scarce resource and cascades; timeouts and resource limits are essential"
      - "Adding more read replicas behind the database always prevents cascades, because the extra replicas absorb the hung socket's load and keep the shared connection pool from ever filling"
      - "Retries against an integration point should be unbounded for maximum reliability, so the caller keeps re-attempting the hung SQL socket until the database eventually accepts the connection"
    answer: 1
    explanation: |
      The hung socket had no timeout, so it held a connection-pool resource indefinitely,
      exhausting the pool and cascading outward — the origin story for the whole stability-
      patterns catalog. It concretely illustrates "slow is worse than down" and why every
      integration point needs timeouts, bulkheads, and breakers.
    ref: "concepts.md#why-fail-fast-the-cascading-failure-problem"

  - id: circuit-breakers-and-bulkheads-083
    difficulty: expert
    tags: [scenario, error-only-breaker, latency-creep, judgment]
    question: |
      A dependency returns HTTP 200 for every call, but p99 latency has crept from 50 ms
      to 8 s and callers' pools are filling. An error-rate-only breaker never trips. What
      is the correct mitigation?
    options:
      - "Raise the failure-rate threshold higher so the breaker becomes more sensitive to the latency creep and finally trips on the slow-but-successful 200 responses"
      - "Add several more retries on each call so the caller keeps re-issuing the request until one of the attempts happens to return before the p99 latency spike"
      - "Replace the breaker with an unbounded in-memory queue that buffers the slow calls, letting them drain in the background so the caller's request pool is never held up"
      - "Enable a slow-call-rate threshold with a sensible slowCallDurationThreshold, plus a tight timeout so slow-but-successful calls are caught"
    answer: 3
    explanation: |
      Error-only breakers are blind to latency creep — the dependency is "up" but degrading the
      caller. Configure a slow-call-rate threshold (calls over slowCallDurationThreshold count as
      slow) so the breaker reacts to slowness, and enforce a tight timeout to free threads. This
      is the "slow is worse than down" enforcement mechanism.
    ref: "concepts.md#closed-state-and-tripping-thresholds"
