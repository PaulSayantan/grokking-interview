topic: "Disaster Recovery: RPO, RTO & Strategies"
domain: reliability-ops
topic_slug: disaster-recovery-rpo-rto-strategies
version: 1
questions:
  - id: disaster-recovery-rpo-rto-strategies-001
    difficulty: beginner
    tags: [rpo, definitions]
    question: |
      What does the Recovery Point Objective (RPO) measure?
    options:
      - "The maximum acceptable amount of data loss, expressed as a window of time"
      - "The maximum acceptable downtime before the system must be serving again"
      - "The average time between failures of a component"
      - "The percentage of requests that must succeed each month"
    answer: 0
    explanation: |
      RPO is the maximum acceptable data loss, measured in time. RPO = 1 hour means
      you can lose up to the last hour of writes, so it drives how frequently you
      back up or replicate data. Downtime is RTO, not RPO.
    ref: "concepts.md#rpo--recovery-point-objective-acceptable-data-loss"

  - id: disaster-recovery-rpo-rto-strategies-002
    difficulty: beginner
    tags: [rto, definitions]
    question: |
      What does the Recovery Time Objective (RTO) measure?
    options:
      - "How much data you can afford to lose"
      - "How often backups are taken"
      - "How long the system may be down before service must be restored"
      - "How many replicas a database keeps"
    answer: 2
    explanation: |
      RTO is the maximum acceptable downtime — the clock from disaster to
      service-restored. It drives the failover architecture (how much standby
      infrastructure you keep ready). Data loss is RPO.
    ref: "concepts.md#rto--recovery-time-objective-acceptable-downtime"

  - id: disaster-recovery-rpo-rto-strategies-003
    difficulty: intermediate
    tags: [rpo, drivers]
    question: |
      RPO primarily drives which design decision?
    options:
      - "The number of application server instances kept warm"
      - "The backup/replication frequency for your data"
      - "The DNS TTL used during cutover"
      - "The choice of programming language for the service"
    answer: 1
    explanation: |
      Because RPO caps how much data you can lose, it dictates how often you must
      capture data: nightly backups → ~24h RPO, hourly → ~1h, continuous
      replication/PITR → seconds. RTO, by contrast, drives failover architecture.
    ref: "concepts.md#rpo--recovery-point-objective-acceptable-data-loss"

  - id: disaster-recovery-rpo-rto-strategies-004
    difficulty: intermediate
    tags: [rto, drivers]
    question: |
      RTO primarily drives which design decision?
    options:
      - "How frequently transaction logs are shipped"
      - "The retention period of your backups"
      - "Whether replication is synchronous or asynchronous"
      - "How much recovery infrastructure you keep ready (failover architecture)"
    answer: 3
    explanation: |
      RTO is about downtime, so it drives how much you pre-provision: keeping compute
      warm/live removes provisioning and boot time. Replication frequency and sync-vs-async
      relate to RPO (data loss), not RTO.
    ref: "concepts.md#rto--recovery-time-objective-acceptable-downtime"

  - id: disaster-recovery-rpo-rto-strategies-005
    difficulty: intermediate
    tags: [rpo, rto, independence]
    question: |
      A team says "RPO and RTO are basically the same knob — tightening one tightens the
      other." Why is this wrong?
    options:
      - "They are the same number, just measured in different units"
      - "RTO is always larger than RPO by definition"
      - "They are independent: one bounds data loss and the other bounds downtime, and they cost money in different places"
      - "RPO only applies to databases and RTO only applies to compute"
    answer: 2
    explanation: |
      RPO (data loss) and RTO (downtime) are orthogonal. You might need RPO≈0 but tolerate
      hours of RTO (a ledger), or tolerate an hour of stale data but need near-zero RTO
      (an ad-funded site). One is bought with replication spend, the other with standby
      compute spend.
    ref: "concepts.md#rpo-and-rto-are-independent-and-drive-cost-separately"

  - id: disaster-recovery-rpo-rto-strategies-006
    difficulty: advanced
    tags: [rpo-zero, synchronous-replication]
    question: |
      Achieving a true RPO of 0 (zero data loss) fundamentally requires what?
    options:
      - "Synchronous replication — a write is acknowledged only after a remote replica has it"
      - "Hourly snapshots stored off-site"
      - "Asynchronous replication with a small buffer"
      - "A faster nightly backup job"
    answer: 0
    explanation: |
      RPO = 0 means no committed write may be lost, which requires the commit to wait until
      a remote replica durably has the data (synchronous replication). Async replication
      always has some lag, so it can lose the un-replicated tail on failure.
    ref: "concepts.md#rpo--recovery-point-objective-acceptable-data-loss"

  - id: disaster-recovery-rpo-rto-strategies-007
    difficulty: advanced
    tags: [rpo-zero, cross-region, cap]
    question: |
      Why is true zero-RPO synchronous replication rarely used across regions?
    options:
      - "Cross-region networks cannot carry replication traffic at all"
      - "Object storage does not exist in a second region"
      - "It automatically violates all compliance regulations"
      - "It couples write latency to the inter-region round-trip and blocks writes if the remote is unreachable"
    answer: 3
    explanation: |
      Synchronous replication makes every commit wait for a remote ack. Across regions
      (e.g. 60–90ms RTT) that latency is often unacceptable for write-heavy workloads, and
      if the remote is unreachable, writes must block — a CAP availability trade. So true
      zero-RPO cross-region is rare; most "near-zero" designs accept seconds of async lag.
    ref: "concepts.md#multi-site-activeactive"

  - id: disaster-recovery-rpo-rto-strategies-008
    difficulty: beginner
    tags: [ha-vs-dr, concepts]
    question: |
      What best distinguishes disaster recovery (DR) from high availability (HA)?
    options:
      - "HA handles rare region-wide catastrophes while DR handles single node failures"
      - "HA absorbs routine failures within the normal footprint (node/disk/AZ); DR handles rare correlated catastrophes (region/dataset loss)"
      - "They are two names for the same practice"
      - "DR is automatic and invisible while HA requires manual declaration"
    answer: 1
    explanation: |
      HA keeps a service up through expected failures inside its normal footprint (usually
      automatic, seconds, no data loss). DR is the plan for the rare, correlated catastrophe
      that exceeds the HA envelope — a region loss, dataset corruption, ransomware.
    ref: "concepts.md#disaster-recovery-vs-high-availability"

  - id: disaster-recovery-rpo-rto-strategies-009
    difficulty: intermediate
    tags: [ha-vs-dr, multi-az]
    question: |
      An engineer claims "we're deployed across three Availability Zones, so we have a
      disaster recovery plan." What's the flaw?
    options:
      - "Three AZs is too few for HA"
      - "AZs cannot host databases"
      - "There is no flaw; multi-AZ is a complete DR strategy"
      - "Multi-AZ is HA within one region; a region-wide event or a bad delete replicated to every AZ defeats it — DR needs a separate failure domain plus a restore path"
    answer: 3
    explanation: |
      Multi-AZ gives HA within a single region. A region-wide control-plane event, a bad
      global config push, or a DROP TABLE replicated to all AZs still takes you down. DR
      needs a separate failure domain (another region) and a restore path independent of
      the live data.
    ref: "concepts.md#disaster-recovery-vs-high-availability"

  - id: disaster-recovery-rpo-rto-strategies-010
    difficulty: beginner
    tags: [dr-spectrum, ordering]
    question: |
      Order the four AWS DR strategies from lowest cost / highest RTO to highest cost /
      lowest RTO.
    options:
      - "Backup & Restore → Pilot Light → Warm Standby → Multi-Site Active/Active"
      - "Multi-Site Active/Active → Warm Standby → Pilot Light → Backup & Restore"
      - "Pilot Light → Backup & Restore → Multi-Site Active/Active → Warm Standby"
      - "Warm Standby → Backup & Restore → Pilot Light → Multi-Site Active/Active"
    answer: 0
    explanation: |
      The spectrum runs Backup & Restore (cheapest, hours RTO) → Pilot Light → Warm Standby
      → Multi-Site Active/Active (most expensive, near-zero RTO). Each step pre-pays more
      recovery work to buy back recovery time.
    ref: "concepts.md#the-dr-strategy-spectrum-cost-vs-rtorpo"

  - id: disaster-recovery-rpo-rto-strategies-011
    difficulty: intermediate
    tags: [backup-restore, rto]
    question: |
      In a Backup & Restore DR strategy, what typically dominates the RTO?
    options:
      - "The time to update DNS records only"
      - "The time for a synchronous replica to catch up"
      - "Provisioning infrastructure plus downloading and restoring the (possibly multi-TB) backup"
      - "The time to remove a failed region from DNS rotation"
    answer: 2
    explanation: |
      With Backup & Restore, nothing runs in the DR site until disaster. You must provision
      everything and then restore data from backups — restoring multiple TB over the network
      can take hours, which is why this strategy's RTO is measured in hours.
    ref: "concepts.md#backup--restore"

  - id: disaster-recovery-rpo-rto-strategies-012
    difficulty: intermediate
    tags: [pilot-light, mechanism]
    question: |
      What characterizes a Pilot Light DR strategy?
    options:
      - "A full-size production stack runs live in the DR region"
      - "Core data is continuously replicated to the DR region, but the application/compute tier is provisioned but switched off until disaster"
      - "Only nightly backups exist, with nothing replicated"
      - "Traffic is served simultaneously from both regions at all times"
    answer: 1
    explanation: |
      Pilot Light keeps the data layer replicated and running while the app/compute tier is
      off (the pilot light is lit but the furnace is off). On disaster you turn on and scale
      up the compute tier — skipping data restore gives an RTO of tens of minutes.
    ref: "concepts.md#pilot-light"

  - id: disaster-recovery-rpo-rto-strategies-013
    difficulty: intermediate
    tags: [warm-standby, pilot-light, comparison]
    question: |
      What is the key difference between Warm Standby and Pilot Light?
    options:
      - "In Warm Standby the full stack is always running but scaled down; in Pilot Light the app/compute tier is off"
      - "Warm Standby uses backups while Pilot Light uses replication"
      - "Pilot Light is more expensive than Warm Standby"
      - "Warm Standby keeps no data in the DR region"
    answer: 0
    explanation: |
      Both replicate data. The difference is the compute tier: Pilot Light keeps it OFF
      (scale up on DR), Warm Standby keeps it ON but small (scale up on DR). Because Warm
      Standby is always running, it can serve traffic immediately and be continuously
      validated — at higher steady-state cost.
    ref: "concepts.md#warm-standby"

  - id: disaster-recovery-rpo-rto-strategies-014
    difficulty: advanced
    tags: [active-active, rpo, misconception]
    question: |
      Which statement about Multi-Site Active/Active is most accurate?
    options:
      - "It guarantees RPO = 0 automatically because both sites are live"
      - "It is the cheapest strategy because you reuse the same infrastructure"
      - "It cannot survive the loss of a single region"
      - "It gives near-zero RTO and near-zero RPO, but true RPO=0 still requires synchronous cross-region writes, which is usually latency-prohibitive"
    answer: 3
    explanation: |
      Active/Active serves live traffic from multiple regions, so failover is just removing
      the failed site (near-zero RTO). RPO is near-zero via async replication, but true zero
      needs synchronous cross-region writes — impractical due to RTT — so candidates should
      say near-zero, not zero.
    ref: "concepts.md#multi-site-activeactive"

  - id: disaster-recovery-rpo-rto-strategies-015
    difficulty: advanced
    tags: [active-active, complexity, tradeoffs]
    question: |
      Beyond cost, what is the primary added difficulty of Multi-Site Active/Active
      compared with Warm Standby?
    options:
      - "It cannot use DNS for routing"
      - "Handling multi-master write conflicts, cross-region consistency, and split-brain because multiple sites accept writes"
      - "It requires taking the primary offline during normal operation"
      - "It eliminates the need for any backups"
    answer: 1
    explanation: |
      Active/Active has multiple sites accepting live writes, so you must solve write-conflict
      resolution, cross-region consistency, and split-brain. That's engineering complexity, not
      just money — and it still needs backups underneath for logical corruption.
    ref: "concepts.md#multi-site-activeactive"

  - id: disaster-recovery-rpo-rto-strategies-016
    difficulty: intermediate
    tags: [scenario, strategy-selection]
    question: |
      A financial ledger must never lose a committed transaction (RPO≈0), but being down for
      a few hours during recovery is acceptable (RTO = hours). Where should the money go?
    options:
      - "Buy a large always-on standby fleet for fast failover"
      - "Switch to nightly-only backups to save cost"
      - "Invest in continuous/synchronous replication for the data, not in expensive standby compute"
      - "Adopt Multi-Site Active/Active regardless of the RTO tolerance"
    answer: 2
    explanation: |
      Tight RPO with loose RTO means spend on replication (protecting data), not on standby
      capacity (which buys fast recovery you don't need). RPO and RTO cost money in different
      places, so match the spend to the tight constraint.
    ref: "concepts.md#rpo-and-rto-are-independent-and-drive-cost-separately"

  - id: disaster-recovery-rpo-rto-strategies-017
    difficulty: intermediate
    tags: [scenario, strategy-selection]
    question: |
      A stateless, read-mostly marketing site is fronted by a CDN; an hour of stale content
      is fine (RPO = 1h) but any downtime loses ad revenue (RTO ≈ 0). What's the right
      emphasis?
    options:
      - "Warm/active standby compute so traffic keeps serving, without paying for synchronous replication"
      - "Synchronous cross-region replication of every write"
      - "Backup & Restore only, to minimize cost"
      - "Increase DNS TTL so clients cache longer"
    answer: 0
    explanation: |
      Loose RPO with tight RTO means spend on warm/active standby compute (fast, no-downtime
      cutover), not on synchronous replication. Because stale data is tolerable, cheap async
      or periodic sync of content is sufficient.
    ref: "concepts.md#rpo-and-rto-are-independent-and-drive-cost-separately"

  - id: disaster-recovery-rpo-rto-strategies-018
    difficulty: beginner
    tags: [3-2-1, backups]
    question: |
      The 3-2-1 backup rule states you should keep:
    options:
      - "3 backups per day, 2 per week, 1 per month"
      - "3 regions, 2 accounts, 1 provider"
      - "3 copies, on 2 media types, with 1 copy off-site"
      - "3 replicas, 2 read-only, 1 writable"
    answer: 2
    explanation: |
      3-2-1 = three copies of data, on two different media/storage types, with one copy
      off-site (a different location/region/provider). The point is decorrelating failure
      domains so a single site loss can't destroy all copies.
    ref: "concepts.md#backups-the-3-2-1-rule"

  - id: disaster-recovery-rpo-rto-strategies-019
    difficulty: intermediate
    tags: [3-2-1, off-site, failure-domain]
    question: |
      Why is the "1 copy off-site" part of 3-2-1 the piece that actually makes it a DR
      capability?
    options:
      - "Off-site copies restore faster than local ones"
      - "A backup in the same region/account shares the primary's failure domain, so an off-site copy is what survives a site loss or account compromise"
      - "Off-site storage is always cheaper"
      - "It is required by every compliance regime"
    answer: 1
    explanation: |
      Three copies on one array (or in one region/account) all die together when that domain
      dies. The off-site copy in a separate failure domain is what survives a region outage,
      account compromise, or mass delete — turning backups into real DR.
    ref: "concepts.md#backups-the-3-2-1-rule"

  - id: disaster-recovery-rpo-rto-strategies-020
    difficulty: intermediate
    tags: [3-2-1-1-0, ransomware]
    question: |
      In the extended "3-2-1-1-0" rule, what do the extra "1" and the "0" add?
    options:
      - "1 more region and 0 downtime"
      - "1 extra replica and 0 replication lag"
      - "1 cloud provider and 0 backups on tape"
      - "1 offline/immutable/air-gapped copy, and 0 errors verified by regularly testing restores"
    answer: 3
    explanation: |
      3-2-1-1-0 adds one offline/immutable/air-gapped copy (ransomware defense) and requires
      zero errors — verified by regularly performing and validating test restores.
    ref: "concepts.md#immutable--offsite-backups-ransomware-defense"

  - id: disaster-recovery-rpo-rto-strategies-021
    difficulty: beginner
    tags: [test-restores, maxim]
    question: |
      What is meant by "an untested backup is not a backup"?
    options:
      - "Backups expire and become invalid after 30 days"
      - "You must encrypt every backup or it's useless"
      - "Backups can fail silently (corrupt archives, missing keys, un-runnable scripts) in ways only a real restore reveals, so recoverability is unproven until you restore"
      - "Only full backups count; incremental backups don't"
    answer: 2
    explanation: |
      Backups fail silently — incomplete snapshots, corrupt archives, missing encryption keys,
      broken restore scripts, schema mismatches. Until you actually restore and verify, you
      only have a hope, not a backup. SRE puts it as "no one wants backups, they want restores."
    ref: "concepts.md#test-your-restores-untested-backup--no-backup"

  - id: disaster-recovery-rpo-rto-strategies-022
    difficulty: intermediate
    tags: [test-restores, rto, measurement]
    question: |
      Why does regularly performing a test restore matter specifically for validating your
      Backup & Restore RTO?
    options:
      - "The measured restore time IS your real RTO, and for large datasets it is often far longer than the SLA number"
      - "It reduces the size of the backup"
      - "It automatically shortens future restores"
      - "It converts asynchronous replication to synchronous"
    answer: 0
    explanation: |
      For Backup & Restore, restoring the data is the dominant recovery step. The only way to
      know your true RTO is to run the restore and time it — for multi-TB datasets it is often
      shockingly longer than the aspirational number on a slide.
    ref: "concepts.md#test-your-restores-untested-backup--no-backup"

  - id: disaster-recovery-rpo-rto-strategies-023
    difficulty: intermediate
    tags: [dr-drills, game-days]
    question: |
      What is the main purpose of a periodic DR drill (game day) that actually invokes the
      failover runbook?
    options:
      - "To reduce cloud costs by shutting down the primary"
      - "To increase replication lag on purpose"
      - "To satisfy auditors without changing anything"
      - "To validate the runbook, the real RTO/RPO numbers, and the human process — surfacing AMI drift, IAM gaps, and quota limits before a real disaster"
    answer: 3
    explanation: |
      Drills exercise the whole recovery path so you discover the broken bits — stale AMIs,
      missing IAM permissions, insufficient quotas, wrong RTO estimates, unclear decision
      authority — under controlled conditions rather than during an actual disaster.
    ref: "concepts.md#test-your-restores-untested-backup--no-backup"

  - id: disaster-recovery-rpo-rto-strategies-024
    difficulty: advanced
    tags: [immutability, ransomware, object-lock]
    question: |
      How does an immutable (WORM) backup, such as S3 Object Lock in Compliance mode, defend
      against ransomware?
    options:
      - "It encrypts the backup so ransomware cannot read it"
      - "It prevents the backup from being modified or deleted until its retention period expires — even by an attacker with root/account credentials"
      - "It replicates the backup faster than ransomware can spread"
      - "It automatically detects and quarantines ransomware processes"
    answer: 1
    explanation: |
      Ransomware/insider threats target backups too. Immutability makes backups write-once
      and undeletable during the lock window — even the account owner cannot override
      Compliance-mode locks — so a clean recovery copy survives an attacker with production
      access.
    ref: "concepts.md#immutable--offsite-backups-ransomware-defense"

  - id: disaster-recovery-rpo-rto-strategies-025
    difficulty: advanced
    tags: [backup-isolation, blast-radius]
    question: |
      Why store backups in a separate cloud account with distinct, tightly-scoped credentials?
    options:
      - "To get a cheaper storage tier"
      - "Because backups cannot exist in the same account as production"
      - "To avoid paying for cross-region data transfer"
      - "So a compromise or mass-delete using production credentials cannot reach or destroy the backups (blast-radius isolation)"
    answer: 3
    explanation: |
      If backups live in the same account as production, a credential compromise or a
      catastrophic mistake can delete them along with everything else. A separate account with
      its own credentials isolates the blast radius so the last line of recovery survives.
    ref: "concepts.md#immutable--offsite-backups-ransomware-defense"

  - id: disaster-recovery-rpo-rto-strategies-026
    difficulty: intermediate
    tags: [pitr, mechanism]
    question: |
      How does point-in-time recovery (PITR) let you restore to any moment within a window?
    options:
      - "It combines a base snapshot with a continuous stream of transaction logs (WAL/binlog/redo) and replays the log forward to the chosen instant"
      - "It keeps a full snapshot every second"
      - "It keeps every version of every row forever in memory"
      - "It reverses the primary's writes on demand using undo triggers"
    answer: 0
    explanation: |
      PITR = base snapshot + continuous transaction-log capture. To restore to time T, you
      load the base snapshot and replay logs up to T. This gives second-level RPO for the data
      layer and lets you land just before a destructive event.
    ref: "concepts.md#point-in-time-recovery-pitr"

  - id: disaster-recovery-rpo-rto-strategies-027
    difficulty: advanced
    tags: [pitr, logical-failure, scenario]
    question: |
      A bad deploy runs a destructive query at 14:33 that deletes production rows, and the
      delete has already replicated to every replica. What recovers the data with minimal loss?
    options:
      - "Promote a replica to primary"
      - "Add more replicas to dilute the bad delete"
      - "Use PITR to restore the database to 14:32:59, just before the destructive query"
      - "Increase the DNS TTL and wait for caches to expire"
    answer: 2
    explanation: |
      Replicas all faithfully applied the delete, so promoting one doesn't help. PITR lets you
      restore to one second before the destructive query, recovering the data with almost no
      loss of good writes — the classic antidote to a logical failure.
    ref: "concepts.md#point-in-time-recovery-pitr"

  - id: disaster-recovery-rpo-rto-strategies-028
    difficulty: advanced
    tags: [pitr, tradeoff, rto]
    question: |
      What is a trade-off of PITR based on log replay?
    options:
      - "It cannot achieve an RPO better than 24 hours"
      - "Replaying a long transaction-log stream can make the restore TIME (RTO) longer than a plain snapshot restore, and retention costs storage"
      - "It only works for stateless services"
      - "It requires synchronous replication to function"
    answer: 1
    explanation: |
      PITR gives tight RPO (seconds) but restoring means replaying logs forward from the base
      snapshot, which for a long window can take longer than restoring a single recent
      snapshot. Retention of logs and snapshots also costs storage.
    ref: "concepts.md#point-in-time-recovery-pitr"

  - id: disaster-recovery-rpo-rto-strategies-029
    difficulty: advanced
    tags: [replication-not-backup, corruption]
    question: |
      "We keep three synchronous replicas, so our data is safe." From what threat does this
      NOT protect you?
    options:
      - "An accidental DROP TABLE or a data-corruption bug — the bad write is replicated to all replicas"
      - "Loss of a single instance or disk"
      - "An Availability Zone power failure"
      - "A single-node network partition"
    answer: 0
    explanation: |
      Replicas protect against hardware/infrastructure loss but faithfully copy every write —
      including a bad DELETE, a corruption bug, or ransomware encryption — to all replicas in
      milliseconds. Only historical/immutable backups (snapshots, PITR) can go back in time.
    ref: "concepts.md#replication-is-not-a-backup-data-corruption--logical-failures"

  - id: disaster-recovery-rpo-rto-strategies-030
    difficulty: intermediate
    tags: [replication-not-backup, concept]
    question: |
      What is the core reason "replication is not a backup"?
    options:
      - "Replicas are stored on slower disks than backups"
      - "Replication is always asynchronous and lossy"
      - "Backups are encrypted but replicas are not"
      - "A replica's job is to hold a current copy, so it immediately propagates every write including corrupt or deleted data; only historical copies let you recover from logical errors"
    answer: 3
    explanation: |
      Replication keeps data current, which means bad writes propagate instantly. Recovery from
      logical failures (bad deploys, deletes, corruption, ransomware) requires going back in
      time, which only historical/immutable backups and PITR provide.
    ref: "concepts.md#replication-is-not-a-backup-data-corruption--logical-failures"

  - id: disaster-recovery-rpo-rto-strategies-031
    difficulty: expert
    tags: [replication-not-backup, active-active]
    question: |
      Why do even Multi-Site Active/Active architectures still maintain point-in-time backups?
    options:
      - "To reduce the cost of cross-region replication"
      - "Because live replication between sites propagates logical corruption/deletes everywhere, so only historical backups can recover from those"
      - "Because active/active cannot survive a region loss without backups"
      - "Because backups are required to establish the initial replica"
    answer: 1
    explanation: |
      Active/Active protects against infrastructure and region loss, but its replication also
      spreads logical corruption to every live site. Point-in-time backups are the only defense
      against bad deploys, mass deletes, and ransomware — so they sit under every strategy.
    ref: "concepts.md#replication-is-not-a-backup-data-corruption--logical-failures"

  - id: disaster-recovery-rpo-rto-strategies-032
    difficulty: intermediate
    tags: [rto, dns-ttl, cutover]
    question: |
      During DR cutover, why can a high DNS TTL blow your RTO even after the DR site is fully
      up and serving?
    options:
      - "High TTL increases replication lag"
      - "DNS records cannot be changed during a disaster"
      - "Clients keep using the cached old record until the TTL expires, so traffic isn't actually redirected until then"
      - "TTL controls how long backups are retained"
    answer: 2
    explanation: |
      RTO is only met when traffic actually serves from the recovered site. If clients cache the
      DNS record for, say, 300s, cutover isn't complete until that TTL expires — so keep
      failover-record TTLs low (e.g. 60s) or use health-checked DNS failover/anycast.
    ref: "concepts.md#rto--recovery-time-objective-acceptable-downtime"

  - id: disaster-recovery-rpo-rto-strategies-033
    difficulty: advanced
    tags: [rto, hidden-steps]
    question: |
      Which recovery step is most often UNDERESTIMATED when teams estimate their RTO?
    options:
      - "Detection plus the human decision/declaration to invoke DR"
      - "The time for a CPU to boot"
      - "The time to write a single log line"
      - "The time to open a support ticket"
    answer: 0
    explanation: |
      RTO covers the whole path: detection, human decision to declare a disaster, provisioning,
      data recovery, and cutover. Detection and the declaration decision are often the biggest
      hidden delays because they involve people and judgment, not just machines.
    ref: "concepts.md#rto--recovery-time-objective-acceptable-downtime"

  - id: disaster-recovery-rpo-rto-strategies-034
    difficulty: intermediate
    tags: [failover, failback, definitions]
    question: |
      What is "failback" in a DR context?
    options:
      - "Promoting the DR site to primary when disaster strikes"
      - "Rolling back a failed software deployment"
      - "Returning operations to the original site after it recovers, including re-replicating accumulated writes back and reconciling conflicts"
      - "Reducing the number of replicas after a spike"
    answer: 2
    explanation: |
      Failover promotes the DR site; failback is the return trip once the original site
      recovers — reversing replication to sync back the writes that accumulated in the DR site,
      reconciling conflicts, and cutting back over. It's often harder than failover and
      frequently undrilled.
    ref: "concepts.md#failover-and-failback"

  - id: disaster-recovery-rpo-rto-strategies-035
    difficulty: advanced
    tags: [failback, tradeoffs]
    question: |
      Why is failback frequently more difficult and risky than the initial failover?
    options:
      - "The original site never comes back online"
      - "You must reverse replication to sync writes accumulated in the DR site back to the primary, reconcile any conflicts, and cut back over safely"
      - "Failback requires deleting all backups first"
      - "Failback always causes permanent data loss"
    answer: 1
    explanation: |
      During DR the DR site accumulated writes. Failback must replicate those back to the
      recovered primary (reversing replication direction), reconcile conflicts, and cut over
      again — ideally in a quiet window. Many outages are extended by a botched failback; some
      teams instead make the DR site the new permanent primary.
    ref: "concepts.md#failover-and-failback"

  - id: disaster-recovery-rpo-rto-strategies-036
    difficulty: advanced
    tags: [failover, automatic-vs-manual, cross-region]
    question: |
      Why is cross-region DR failover more often deliberate/human-declared rather than fully
      automatic?
    options:
      - "Automatic failover is technically impossible across regions"
      - "Humans can restore data faster than automation"
      - "AWS forbids automated cross-region failover"
      - "The blast radius of a mistaken failover is huge, and false positives could split-brain or move all traffic on a transient blip"
    answer: 3
    explanation: |
      Automatic failover minimizes RTO but risks acting on false positives; for a whole-region
      switch the cost of being wrong (or of split-brain) is enormous. Many teams gate
      cross-region failover behind a human declaration for safety, accepting higher RTO.
    ref: "concepts.md#failover-and-failback"

  - id: disaster-recovery-rpo-rto-strategies-037
    difficulty: intermediate
    tags: [backup-restore, best-fit]
    question: |
      For which workload is Backup & Restore the most appropriate DR strategy?
    options:
      - "A real-time payments API where any downtime is catastrophic"
      - "A global e-commerce checkout during peak sales"
      - "A non-critical or dev/test workload where hours of RTO and hours of RPO are acceptable and cost matters most"
      - "A stock-trading matching engine"
    answer: 2
    explanation: |
      Backup & Restore is cheapest but has hours of RTO (provision + restore) and RPO tied to
      backup interval. It fits cost-sensitive, non-critical, or dev/test systems. Latency- and
      revenue-critical systems need warmer strategies. Note: even they keep backups as the floor.
    ref: "concepts.md#backup--restore"

  - id: disaster-recovery-rpo-rto-strategies-038
    difficulty: intermediate
    tags: [backup-restore, corruption-defense]
    question: |
      Which is uniquely TRUE of Backup & Restore compared with Pilot Light, Warm Standby, and
      Active/Active?
    options:
      - "It is the strategy that inherently protects against logical corruption and deletion, because it keeps historical copies rather than only fresh replicated data"
      - "It has the lowest RTO"
      - "It requires the most steady-state infrastructure"
      - "It provides near-zero RPO"
    answer: 0
    explanation: |
      The other three keep data "fresh" via replication, which propagates a bad delete. Backup
      & Restore keeps historical copies, so it's the one that protects against corruption/deletion
      — which is why every DR plan keeps point-in-time backups regardless of primary strategy.
    ref: "concepts.md#backup--restore"

  - id: disaster-recovery-rpo-rto-strategies-039
    difficulty: intermediate
    tags: [pilot-light, drill-risk]
    question: |
      Why do DR drills matter especially for a Pilot Light strategy?
    options:
      - "Because the data replication is unreliable in Pilot Light"
      - "Because Pilot Light has no backups"
      - "Because Pilot Light serves live traffic and drills would disrupt users"
      - "Because the cold app tier is unexercised, so capacity limits, AMI drift, or scaling problems surface exactly when you invoke DR"
    answer: 3
    explanation: |
      In Pilot Light the compute tier is off, so it's never validated under load. Drills reveal
      whether it can actually be turned on and scaled up (quota, AMI drift, scaling config)
      before a real disaster depends on it.
    ref: "concepts.md#pilot-light"

  - id: disaster-recovery-rpo-rto-strategies-040
    difficulty: expert
    tags: [scenario, strategy-selection, tradeoffs]
    question: |
      A global product needs near-zero RTO and near-zero RPO and the team can invest heavily
      and solve write-conflict handling. Which strategy fits, and what's the main catch?
    options:
      - "Backup & Restore; the catch is high storage cost"
      - "Multi-Site Active/Active; the catch is multi-master conflict resolution, consistency, and split-brain complexity plus 2x+ infrastructure cost"
      - "Pilot Light; the catch is the cold compute tier"
      - "Warm Standby; the catch is that it can't survive a region loss"
    answer: 1
    explanation: |
      Near-zero RTO and RPO globally points to Multi-Site Active/Active. The catch is that
      multiple live write sites force you to solve conflict resolution, cross-region consistency,
      and split-brain — engineering complexity on top of running full infrastructure everywhere.
    ref: "concepts.md#multi-site-activeactive"

  - id: disaster-recovery-rpo-rto-strategies-041
    difficulty: beginner
    tags: [rpo, calculation]
    question: |
      If your only data protection is a backup job that runs once every 24 hours, what is your
      effective RPO in the worst case?
    options:
      - "Zero"
      - "Exactly the RTO"
      - "One hour"
      - "Up to about 24 hours of data"
    answer: 3
    explanation: |
      A disaster can strike just before the next backup, so you could lose everything written
      since the last backup — up to ~24 hours. Your real RPO is bounded by the backup interval
      (or replication lag), regardless of the SLA number.
    ref: "concepts.md#rpo--recovery-point-objective-acceptable-data-loss"

  - id: disaster-recovery-rpo-rto-strategies-042
    difficulty: intermediate
    tags: [scenario, cross-region-backup]
    question: |
      A team stores nightly database backups in the SAME region and SAME account as the primary
      database. What DR risk does this create?
    options:
      - "The backups share the primary's failure domain, so a region outage or account compromise can destroy the primary AND its backups together"
      - "None; co-locating backups is best practice for speed"
      - "The backups will restore too quickly"
      - "It violates RTO but not RPO"
    answer: 0
    explanation: |
      A backup in the same region/account shares the failure domain of what it protects. A
      region-wide event or a compromised/misused account can wipe both. DR requires an off-site
      copy in a separate failure domain (the "1" in 3-2-1).
    ref: "concepts.md#backups-the-3-2-1-rule"

  - id: disaster-recovery-rpo-rto-strategies-043
    difficulty: advanced
    tags: [scenario, replication-vs-backup, judgment]
    question: |
      An interviewer asks: "We have cross-region async replicas with 2s lag. Are we covered for
      disaster recovery?" What is the best answer?
    options:
      - "Yes, replicas cover every disaster scenario"
      - "No, replication provides no DR value at all"
      - "Partially — replicas cover region/infrastructure loss with ~2s RPO, but not logical corruption or malicious deletes, which replicate too; you also need point-in-time backups"
      - "Yes, as long as replication is asynchronous"
    answer: 2
    explanation: |
      Cross-region replicas handle infrastructure/region loss with a small RPO (the lag). But
      they faithfully copy bad deletes and corruption, so they don't cover logical failures or
      ransomware. A complete DR posture pairs replicas with immutable point-in-time backups.
    ref: "concepts.md#replication-is-not-a-backup-data-corruption--logical-failures"

  - id: disaster-recovery-rpo-rto-strategies-044
    difficulty: intermediate
    tags: [dr-spectrum, cost-model]
    question: |
      What is the unifying mental model for moving down the DR strategy spectrum
      (Backup & Restore → Active/Active)?
    options:
      - "You reduce data durability to save money"
      - "You pre-pay more of the recovery work (keeping data, then compute, then live traffic ready) to buy back recovery time, at higher steady-state cost"
      - "You increase RPO and RTO together as you spend more"
      - "You move all responsibility from engineering to the cloud provider"
    answer: 1
    explanation: |
      Each step down keeps more of the system ready — replicated data, then warm compute, then
      live-serving compute — so less work remains at disaster time. You trade higher ongoing cost
      and complexity for lower RTO/RPO. There's no universally "best" tier; it's per-workload.
    ref: "concepts.md#the-dr-strategy-spectrum-cost-vs-rtorpo"

  - id: disaster-recovery-rpo-rto-strategies-045
    difficulty: advanced
    tags: [failover, split-brain, safety]
    question: |
      Automatic failover that promotes a DR site while the original primary is still alive risks
      what, and what mitigates it?
    options:
      - "Split-brain (two primaries corrupting data), mitigated by quorum and fencing/STONITH"
      - "A cache miss storm, mitigated by warming the cache"
      - "A DNS TTL overflow, mitigated by raising the TTL"
      - "Excess replication lag, mitigated by adding replicas"
    answer: 0
    explanation: |
      If failover promotes a second primary while the first still accepts writes, you get
      split-brain and divergent/corrupt data. Quorum (majority agreement) and fencing/STONITH
      (isolating the old primary) prevent two active writers — see redundancy-failover-and-health-checks.
    ref: "concepts.md#failover-and-failback"

  - id: disaster-recovery-rpo-rto-strategies-046
    difficulty: intermediate
    tags: [warm-standby, validation]
    question: |
      A benefit of Warm Standby over Pilot Light, beyond faster RTO, is that:
    options:
      - "It requires no data replication"
      - "It eliminates the need for DNS changes at cutover"
      - "It automatically achieves RPO = 0"
      - "Because the scaled-down stack is always running, you can route a trickle of real traffic or synthetic canaries to it, so it is continuously validated"
    answer: 3
    explanation: |
      Warm Standby runs the full stack (scaled down) continuously, so it can serve traffic now.
      That means you can send synthetic canaries or a slice of real traffic to keep it verified —
      unlike Pilot Light's cold, unexercised compute tier.
    ref: "concepts.md#warm-standby"

  - id: disaster-recovery-rpo-rto-strategies-047
    difficulty: beginner
    tags: [pitr, benefit]
    question: |
      A key DR benefit of continuous PITR log capture (beyond restoring to a chosen time) is:
    options:
      - "It removes the need for any snapshots"
      - "It provides a very tight RPO (seconds) for the data layer because writes are captured continuously"
      - "It guarantees zero RTO"
      - "It eliminates the need for cross-region storage"
    answer: 1
    explanation: |
      Because PITR streams transaction logs continuously, the most recent recoverable point is
      only seconds behind the present — giving a very tight RPO for the data layer, in addition
      to the ability to land on any instant within the retention window.
    ref: "concepts.md#point-in-time-recovery-pitr"

  - id: disaster-recovery-rpo-rto-strategies-048
    difficulty: expert
    tags: [scenario, judgment, tradeoffs]
    question: |
      A write-heavy service demands RPO = 0 and a primary and DR region 80ms RTT apart. The
      product team also insists writes must never block. What should you tell them?
    options:
      - "Use asynchronous replication; it delivers RPO = 0 with no latency cost"
      - "Take more frequent backups until RPO reaches 0"
      - "RPO = 0 requires synchronous replication, which forces every write to wait ~80ms+ and to block when the remote is unreachable — so RPO = 0 and never-blocking writes are mutually exclusive here; they must relax one requirement"
      - "Increase the DNS TTL to compensate for the latency"
    answer: 2
    explanation: |
      RPO = 0 needs synchronous replication, which couples commit latency to the 80ms RTT and
      must block writes if the remote is down (a CAP availability trade). You cannot have zero
      data loss AND never-blocking low-latency writes across regions — the team must relax RPO
      (accept seconds of async lag) or accept the latency/availability cost.
    ref: "concepts.md#multi-site-activeactive"

  - id: disaster-recovery-rpo-rto-strategies-049
    difficulty: intermediate
    tags: [ha-vs-dr, cost-framing]
    question: |
      Which framing best captures how DR cost should be justified to the business?
    options:
      - "DR is insurance priced per workload against the cost of downtime and data loss for that specific system"
      - "DR is a fixed engineering tax applied equally to every service"
      - "DR cost should always be minimized to the cheapest tier"
      - "DR cost is identical to the baseline HA architecture cost"
    answer: 0
    explanation: |
      DR is essentially insurance: you weigh the ongoing cost of a strategy against the business
      impact (revenue, compliance, reputation) of downtime/data loss for that workload. That's
      why different services justifiably land on different tiers of the spectrum.
    ref: "concepts.md#disaster-recovery-vs-high-availability"

  - id: disaster-recovery-rpo-rto-strategies-050
    difficulty: advanced
    tags: [scenario, testing, silent-failure]
    question: |
      A team's backup dashboard shows green for a year. During a real incident, the restore
      fails because the archives were missing the encryption key. What DR practice would have
      caught this?
    options:
      - "Adding more replicas"
      - "Increasing backup frequency"
      - "Regular test restores into an isolated environment, verifying integrity end-to-end (including decryption and usability)"
      - "Switching to synchronous replication"
    answer: 2
    explanation: |
      "Backup succeeded" only proves data was written, not that it can be restored and used.
      Only a full test restore — including decrypting and validating — exercises the whole path
      and catches silent failures like missing keys, corrupt archives, or broken restore scripts.
    ref: "concepts.md#test-your-restores-untested-backup--no-backup"

  - id: disaster-recovery-rpo-rto-strategies-051
    difficulty: beginner
    tags: [dr-spectrum, active-active, rto]
    question: |
      In Multi-Site Active/Active, what is the "failover action" when one region is lost?
    options:
      - "Provision a new region from scratch and restore backups"
      - "Simply remove the failed site from rotation; surviving sites already serving traffic absorb the load"
      - "Turn on the cold compute tier and scale it up"
      - "Reverse replication direction and reconcile conflicts before serving"
    answer: 1
    explanation: |
      Because all sites already serve live traffic, there's no promotion or provisioning to do —
      you just deregister the failed site (e.g. remove it from DNS/health checks) and the
      survivors carry the load, giving near-zero RTO.
    ref: "concepts.md#multi-site-activeactive"
