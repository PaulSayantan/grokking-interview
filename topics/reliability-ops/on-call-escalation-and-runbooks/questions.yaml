topic: "On-Call, Escalation & Runbooks"
domain: reliability-ops
topic_slug: on-call-escalation-and-runbooks
version: 1
questions:
  - id: on-call-escalation-and-runbooks-001
    difficulty: beginner
    tags: [philosophy, goal]
    question: |
      In a mature SRE on-call program, what is the stated goal for on-call?
    options:
      - "To make on-call boring — rare, actionable pages with documented responses"
      - "To maximize the raw number of configured alerts so that no signal is ever missed"
      - "To ensure the single most senior engineer personally handles every incident that fires"
      - "To eliminate all human involvement in production operations as immediately as possible"
    answer: 0
    explanation: |
      The aspiration is for on-call to be boring: long quiet stretches, and when a page
      fires it is real, urgent, and has a runbook. "Boring" is a measurable target tracked
      via pages/shift and % actionable — not an accident.
    ref: "concepts.md#why-on-call-exists-and-the-goal-of-boring"

  - id: on-call-escalation-and-runbooks-002
    difficulty: beginner
    tags: [purpose]
    question: |
      Why does on-call exist at all if automation handles most failures?
    options:
      - "Because compliance regulations legally require a named human to be on standby"
      - "To manually restart every production service on a fixed nightly maintenance schedule"
      - "To provide a human decision for novel/correlated failures automation can't self-heal"
      - "To serve as a cheaper substitute for engineered redundancy and automated failover"
    answer: 2
    explanation: |
      No system self-heals perfectly. On-call guarantees a fast, competent human response
      to the problems automation cannot handle — not to babysit an alert stream or replace
      engineered resilience.
    ref: "concepts.md#why-on-call-exists-and-the-goal-of-boring"

  - id: on-call-escalation-and-runbooks-003
    difficulty: intermediate
    tags: [alert-fatigue, reliability]
    question: |
      Why is tolerating non-actionable pages considered a reliability problem, not just a
      comfort problem?
    options:
      - "Non-actionable pages incur an added per-notification billing charge from the paging vendor"
      - "They breach SOC 2 compliance rules that cap the alert volume a team may configure"
      - "Alert fatigue trains responders to ignore pages, so real pages get missed and MTTR rises"
      - "They cause the paging tool to auto-disable the whole rotation past a nightly threshold"
    answer: 2
    explanation: |
      Noise creates a feedback loop: non-actionable pages → responders learn to ignore
      pages → the genuine page is ignored too → higher MTTR and missed outages. Pruning
      noise directly protects reliability.
    ref: "concepts.md#why-on-call-exists-and-the-goal-of-boring"

  - id: on-call-escalation-and-runbooks-004
    difficulty: beginner
    tags: [follow-the-sun, models]
    question: |
      What is the primary benefit of a follow-the-sun on-call model?
    options:
      - "It requires the fewest total engineers of any on-call staffing model"
      - "Everyone is on-call during their normal working hours — no night shifts"
      - "It removes the need for any escalation policy because each site self-heals"
      - "It guarantees zero handoffs by keeping one global rotation continuously live"
    answer: 1
    explanation: |
      Follow-the-sun uses teams in different timezones (e.g. ~12 h apart) so each covers
      its own daytime, eliminating night pages. The cost is disciplined twice-daily
      handoffs — not fewer engineers or fewer handoffs.
    ref: "concepts.md#on-call-models-follow-the-sun-primarysecondary-rotations"

  - id: on-call-escalation-and-runbooks-005
    difficulty: intermediate
    tags: [follow-the-sun, staffing]
    question: |
      A single-site team of 4 engineers wants to adopt follow-the-sun on-call to avoid
      night pages, but has no second site. What is the sound assessment?
    options:
      - "Follow-the-sun is impossible without a second staffed timezone; with 4 engineers even a single rotation is thin"
      - "They can simulate follow-the-sun by rostering one person to stay awake through every night shift"
      - "Four engineers at a single site is comfortably more than enough to staff a follow-the-sun rotation"
      - "They should switch to daily rotations, which resolves both the staffing gap and the night pages"
    answer: 0
    explanation: |
      Follow-the-sun fundamentally needs ≥ 2 staffed timezones (Google's guidance is ~6
      engineers per site). With 4 engineers and one site, follow-the-sun isn't available;
      the real levers are growing the team or reducing paging load.
    ref: "concepts.md#on-call-models-follow-the-sun-primarysecondary-rotations"

  - id: on-call-escalation-and-runbooks-006
    difficulty: intermediate
    tags: [primary-secondary, models]
    question: |
      In a primary/secondary on-call model, what is the secondary's core role?
    options:
      - "To take all pages first so the primary can rest through the shift"
      - "To draft and finalize the postmortem document while the incident is still active"
      - "To act as backup and escalation target if the primary misses or needs help"
      - "To review and approve every production deploy that happens during the shift"
    answer: 2
    explanation: |
      The secondary is the backup: they catch escalations when the primary doesn't ack, and
      provide a second pair of hands. The primary still takes pages first. The trade-off is
      that two people are encumbered by the rotation.
    ref: "concepts.md#on-call-models-follow-the-sun-primarysecondary-rotations"

  - id: on-call-escalation-and-runbooks-007
    difficulty: intermediate
    tags: [rotation-length, trade-offs]
    question: |
      What is the trade-off of very short (e.g. daily) on-call rotations?
    options:
      - "They increase per-person burnout relative to longer weekly rotations"
      - "They require a strictly larger rotation headcount than weekly rotations do"
      - "They make escalation policies unnecessary because stints are so brief"
      - "They reduce fatigue per stint but fragment context and multiply handoffs"
    answer: 3
    explanation: |
      Shorter rotations lower the fatigue of any single stint but mean each responder sees
      less of the service's rhythm and there are far more handoffs (each a chance to drop
      context). Weekly is the common balance.
    ref: "concepts.md#on-call-models-follow-the-sun-primarysecondary-rotations"

  - id: on-call-escalation-and-runbooks-008
    difficulty: intermediate
    tags: [staffing, rotation-size]
    question: |
      Google's rule of thumb for a sustainable single-site on-call rotation is roughly how
      many engineers?
    options:
      - "At least 8"
      - "Exactly 3"
      - "At least 20"
      - "Exactly 2 (primary and secondary only)"
    answer: 0
    explanation: |
      A single-site rotation wants ≥ 8 engineers so each person's share stays small; a
      two-site follow-the-sun wants ~6 per site. Too few engineers means rotations come
      around too often, driving burnout.
    ref: "concepts.md#on-call-models-follow-the-sun-primarysecondary-rotations"

  - id: on-call-escalation-and-runbooks-009
    difficulty: intermediate
    tags: [anti-pattern, hero]
    question: |
      Why is the "hero" model — one senior engineer who quietly handles everything — an
      anti-pattern?
    options:
      - "It makes the paging tool route and deliver alerts measurably slower"
      - "It mechanically violates the 2-incident-per-shift cap for every rotation"
      - "It is only ever a problem within multi-site follow-the-sun setups"
      - "It creates a single point of failure, hides toil, and collapses when that person leaves"
    answer: 3
    explanation: |
      Relying on one hero concentrates knowledge and load in a single person — an
      operational SPOF that hides how much toil exists and breaks down on vacation or
      departure. On-call should spread knowledge and load.
    ref: "concepts.md#on-call-models-follow-the-sun-primarysecondary-rotations"

  - id: on-call-escalation-and-runbooks-010
    difficulty: intermediate
    tags: [handoff, continuity]
    question: |
      Which item is the classic "landmine" that a poor on-call handoff drops, causing a
      live problem to be forgotten?
    options:
      - "The roster listing which engineers currently belong to the team"
      - "The vendor name and login URL of the team's paging tool"
      - "A silenced/snoozed alert whose underlying problem is still live"
      - "Last quarter's finalized SLO attainment report and error-budget summary"
    answer: 2
    explanation: |
      Someone snoozes a noisy page and forgets to flag it; the next shift never learns the
      problem is still active. Every silence should have an expiry and appear on the
      handoff along with open incidents and in-flight risky changes.
    ref: "concepts.md#on-call-handoff-and-shift-continuity"

  - id: on-call-escalation-and-runbooks-011
    difficulty: beginner
    tags: [handoff]
    question: |
      What should the incoming on-call engineer explicitly do at handoff?
    options:
      - "Acknowledge ownership of the pager to remove ambiguity about who is responsible"
      - "Immediately restart every production service to guarantee a clean baseline for the shift"
      - "Close out every open incident regardless of its current state to start with a blank slate"
      - "Disable all escalation routing until they have finished reading through the service docs"
    answer: 0
    explanation: |
      Ambiguity about "who has the pager right now" is dangerous. The handoff ritual has the
      incoming responder explicitly take ownership, and transfers context on open incidents,
      silenced alerts, and in-flight risky changes.
    ref: "concepts.md#on-call-handoff-and-shift-continuity"

  - id: on-call-escalation-and-runbooks-012
    difficulty: intermediate
    tags: [load-cap, numbers]
    question: |
      Google's rule of thumb caps a responder at roughly how many incidents per 12-hour
      on-call shift?
    options:
      - "About 10"
      - "About 5"
      - "About 2"
      - "There is no cap; handle as many as arrive"
    answer: 2
    explanation: |
      The guidance is ~2 incidents per 12-hour shift, because properly handling one
      incident (triage, mitigate, root-cause, write-up, follow-up) takes ~6 hours. Two fill
      a shift; more means incidents get short-changed.
    ref: "concepts.md#healthy-on-call-load-caps-the-50--rule-and-compensation"

  - id: on-call-escalation-and-runbooks-013
    difficulty: intermediate
    tags: [load-cap, reasoning]
    question: |
      The ~2-incidents-per-shift cap is derived from which underlying estimate?
    options:
      - "Labor regulations legally mandate a 6-hour cooldown period after each incident"
      - "Handling one incident well takes roughly 6 hours, so two fill a 12-hour shift"
      - "Paging tools hard rate-limit delivery to a maximum of 2 alerts per on-call shift"
      - "Two acknowledgements is the most a typical phone battery can support over a shift"
    answer: 1
    explanation: |
      The number is arithmetic: doing an incident properly end-to-end takes about 6 hours,
      so two consume a full 12-hour shift. Beyond that, quality (postmortems, real fixes)
      suffers and the responder is overloaded.
    ref: "concepts.md#healthy-on-call-load-caps-the-50--rule-and-compensation"

  - id: on-call-escalation-and-runbooks-014
    difficulty: intermediate
    tags: [50-percent-rule]
    question: |
      What does the SRE "50 % rule" state?
    options:
      - "SREs should spend at least 50 % of their time on operational work and tickets"
      - "At least 50 % of all configured alerts should be able to auto-resolve on their own"
      - "SREs should cap operational work at 50 % of time and spend the rest on engineering"
      - "The on-call rotation should provide paged coverage for 50 % of the calendar year"
    answer: 2
    explanation: |
      SREs should spend ≤ 50 % of time on ops (on-call, tickets, toil) and ≥ 50 % on
      engineering that reduces future ops load. This is what keeps an SRE team from
      degenerating into a pure ops/NOC function.
    ref: "concepts.md#healthy-on-call-load-caps-the-50--rule-and-compensation"

  - id: on-call-escalation-and-runbooks-015
    difficulty: advanced
    tags: [50-percent-rule, overflow]
    question: |
      When operational load consistently pushes an SRE team's ops time above 50 %, what is
      the standard SRE remedy?
    options:
      - "Hire external contractors to absorb the extra pages indefinitely and preserve the cap"
      - "Silence the noisiest alerts and move on so the ops-time percentage drops back below 50 %"
      - "Overflow excess operational load back to the dev team so SRE can build automation"
      - "Extend on-call shifts to a full 24 hours so a single responder soaks up the added load"
    answer: 2
    explanation: |
      The overflow is a signal. Google's practice is to give excess ops load back to the
      development team, making the pain visible to the people who can fund fixing it, while
      SRE invests engineering time in automation.
    ref: "concepts.md#healthy-on-call-load-caps-the-50--rule-and-compensation"

  - id: on-call-escalation-and-runbooks-016
    difficulty: advanced
    tags: [compensation, numbers]
    question: |
      Google deliberately caps on-call compensation (comp time or cash) at roughly a fixed
      5–6 % of salary. What is the main reason for capping it rather than paying more?
    options:
      - "To reduce the payroll-tax burden that on-call compensation would otherwise create"
      - "Because paging tools bill the employer per notification, so comp must be capped too"
      - "To make participation in the on-call rotation fully optional for every engineer"
      - "So beyond the cap the org is forced to fix on-call load rather than pay for suffering"
    answer: 3
    explanation: |
      Bounding comp avoids a perverse incentive to volunteer for painful rotations and,
      crucially, forces the organization to reduce excessive on-call load instead of simply
      paying more for the pain.
    ref: "concepts.md#healthy-on-call-load-caps-the-50--rule-and-compensation"

  - id: on-call-escalation-and-runbooks-017
    difficulty: beginner
    tags: [compensation]
    question: |
      Which practices are appropriate ways to compensate engineers for on-call?
    options:
      - "Time-off-in-lieu (comp time) or cash, within a bounded cap"
      - "Nothing — on-call is part of the job and needs no compensation"
      - "Unlimited extra pay proportional to how many pages you take"
      - "A one-time bonus only after an outage occurs"
    answer: 0
    explanation: |
      On-call is real work outside normal hours and should be paid back with comp time or
      cash, kept within a bounded cap (~5–6 % of salary at Google) so it doesn't incentivize
      chasing painful rotations.
    ref: "concepts.md#healthy-on-call-load-caps-the-50--rule-and-compensation"

  - id: on-call-escalation-and-runbooks-018
    difficulty: beginner
    tags: [escalation, definition]
    question: |
      What does an escalation policy define?
    options:
      - "The color scheme and widget layout of the on-call status dashboard"
      - "How frequently the team is permitted to deploy changes to production"
      - "The retention period for logs and how long paging records are archived"
      - "Who gets paged, in what order, and when the page moves on if unhandled"
    answer: 3
    explanation: |
      An escalation policy defines the paging order and timing so an unacknowledged page
      never falls on the floor: primary → secondary → manager → broader owners, enforced by
      the paging tool.
    ref: "concepts.md#escalation-policies"

  - id: on-call-escalation-and-runbooks-019
    difficulty: intermediate
    tags: [escalation, auto-escalate]
    question: |
      What triggers automatic escalation from primary to secondary in a typical escalation
      policy?
    options:
      - "The primary resolving the incident faster than its configured minimum handling time"
      - "The secondary explicitly requesting to take over the page part-way through the shift"
      - "A new production deploy landing on the service during the primary's active shift"
      - "The primary failing to acknowledge the page within a timeout (e.g. 5–15 min)"
    answer: 3
    explanation: |
      If the primary doesn't acknowledge within the ack timeout (commonly 5–15 min, tighter
      for higher severity), the paging tool auto-escalates to the secondary, then manager,
      then broader owners.
    ref: "concepts.md#escalation-policies"

  - id: on-call-escalation-and-runbooks-020
    difficulty: intermediate
    tags: [escalation, ack-vs-resolve]
    question: |
      In escalation terms, what does acknowledging (ack-ing) a page mean?
    options:
      - "The underlying incident is fully resolved and its ticket has been formally closed out"
      - "The root cause has been positively identified and a permanent fix has been merged"
      - "A human has taken the page — it stops the escalation clock but is not a resolution"
      - "The triggering alert was a confirmed false alarm and can be permanently deleted from the policy"
    answer: 2
    explanation: |
      Ack ≠ resolve. Acking means "a human has it," which stops the escalation clock; a
      separate timer can re-page if the incident isn't resolved. Resolution is a distinct,
      later state.
    ref: "concepts.md#escalation-policies"

  - id: on-call-escalation-and-runbooks-021
    difficulty: advanced
    tags: [escalation, tuning, trade-offs]
    question: |
      What is the trade-off in setting the acknowledgement timeout too short (e.g. 60
      seconds) across all severities?
    options:
      - "Real outages will sit unhandled far too long before escalating"
      - "The paging tool cannot technically support timeouts this short"
      - "Needless escalations wake the secondary/manager for transient blips"
      - "It removes any real need to staff a secondary responder at all"
    answer: 2
    explanation: |
      Too-short windows escalate on transient blips, waking the secondary and manager
      unnecessarily and eroding trust. Too-long windows leave real outages unhandled. Tune
      per severity rather than one global value.
    ref: "concepts.md#escalation-policies"

  - id: on-call-escalation-and-runbooks-022
    difficulty: advanced
    tags: [escalation, service-owner]
    question: |
      A page fires for your service, but investigation shows the failing component is a
      downstream dependency owned by another team. What does a well-designed escalation
      policy enable here?
    options:
      - "Silently closing the page since the failing code isn't yours"
      - "Escalating only vertically to your own manager for a decision"
      - "Disabling the alert until the dependency team notices it themselves"
      - "Horizontal escalation to page the team that owns the failing dependency"
    answer: 3
    explanation: |
      Escalation has a horizontal/service-owner dimension: page the team that owns the
      failing dependency. A page landing on the wrong team wastes the most precious minutes
      of an incident.
    ref: "concepts.md#escalation-policies"

  - id: on-call-escalation-and-runbooks-023
    difficulty: advanced
    tags: [escalation, backstop, anti-pattern]
    question: |
      What is the most common escalation-policy failure mode?
    options:
      - "Too many responders acknowledge the same page, causing duplicated and conflicting mitigation work"
      - "Escalation fires faster than the paging tool can process, so hops are dropped mid-chain"
      - "Runbooks are linked to every single alert, overwhelming responders with too much documentation"
      - "A dead-end chain — no secondary, or a 'manager' who left the company — so a page is silently dropped"
    answer: 3
    explanation: |
      Dead-end chains drop pages: the primary is unreachable and there's no valid next hop.
      Policies need a final backstop (team channel/broad rotation) and should be tested with
      synthetic pages that walk the whole chain.
    ref: "concepts.md#escalation-policies"

  - id: on-call-escalation-and-runbooks-024
    difficulty: beginner
    tags: [paging-hygiene, actionable]
    question: |
      According to paging hygiene, what three properties must EVERY page satisfy?
    options:
      - "Cheap to deliver, frequent, and fully automated"
      - "Actionable, urgent, and about real user impact"
      - "Logged, shown on a dashboard, and archived for audit"
      - "Signed off by a manager, the SRE lead, and the on-call"
    answer: 1
    explanation: |
      A page must be actionable (there's something to do now), urgent (can't wait for
      business hours), and reflect real user impact (or imminent risk of it). Failing any
      one means it should be a ticket, dashboard, or deleted.
    ref: "concepts.md#paging-hygiene-actionable-urgent-user-impacting"

  - id: on-call-escalation-and-runbooks-025
    difficulty: intermediate
    tags: [paging-hygiene, actionable]
    question: |
      An alert pages the on-call every night, but the only possible response is "acknowledge
      and keep watching." What should you do?
    options:
      - "Keep it as a page so that nothing is ever missed, even at the cost of nightly noise"
      - "Escalate it straight to a manager every time so someone with authority decides what to do"
      - "Increase its severity to force faster acknowledgements and shorter escalation windows"
      - "Downgrade it — it fails the 'actionable' test, so make it a dashboard/ticket or delete it"
    answer: 3
    explanation: |
      "Ack and watch" is not actionable, so it should not page. Leaving it as a page breeds
      alert fatigue and gets real pages ignored. Downgrade to a dashboard/ticket or remove
      it entirely.
    ref: "concepts.md#paging-hygiene-actionable-urgent-user-impacting"

  - id: on-call-escalation-and-runbooks-026
    difficulty: intermediate
    tags: [paging-hygiene, symptom-vs-cause]
    question: |
      Which alert best fits the "alert on symptoms, page on user impact" principle?
    options:
      - "A single host's CPU is at 90 % while the SLO is healthy and capacity headroom is fine"
      - "A customer-facing SLO is burning fast and the error budget is draining"
      - "A disk is projected to fill in 3 days, far outside any paging window"
      - "A batch job failed but auto-retries with roughly 6 hours of slack"
    answer: 1
    explanation: |
      A fast-burning customer-facing SLO is actionable, urgent, and user-impacting — a
      proper page. High CPU with a healthy SLO is a cause-based non-page; the disk and batch
      cases are urgent-ish but not now, so they belong in tickets.
    ref: "concepts.md#paging-hygiene-actionable-urgent-user-impacting"

  - id: on-call-escalation-and-runbooks-027
    difficulty: intermediate
    tags: [paging-hygiene, tickets]
    question: |
      A disk is projected to fill in 3 days. How should this be handled under good paging
      hygiene?
    options:
      - "Page the on-call immediately at any hour so the disk is expanded before it can fill"
      - "Ignore it entirely; disks usually reclaim space on their own through routine log rotation"
      - "Escalate directly to the CTO so a capacity purchase can be approved without delay"
      - "Create a ticket (ideally auto-created) — it needs action but is not urgent right now"
    answer: 3
    explanation: |
      It needs action but not in the next minutes, so it fails the 'urgent' bar for a page.
      Route it to a ticket (auto-created) for handling in business hours. Paging on it would
      just add noise.
    ref: "concepts.md#paging-hygiene-actionable-urgent-user-impacting"

  - id: on-call-escalation-and-runbooks-028
    difficulty: advanced
    tags: [paging-hygiene, metrics]
    question: |
      Which metric most directly tells you whether your paging hygiene is training people to
      ignore the pager?
    options:
      - "The total number of monitoring dashboards created"
      - "Average CPU utilization measured across the fleet"
      - "The number of production deploys shipped per week"
      - "The percentage of pages that were actionable"
    answer: 3
    explanation: |
      % of pages that were actionable is the key hygiene signal. Well below ~90 % means a
      large fraction of pages weren't worth waking someone for, which conditions responders
      to ignore the pager and miss real ones.
    ref: "concepts.md#paging-hygiene-actionable-urgent-user-impacting"

  - id: on-call-escalation-and-runbooks-029
    difficulty: beginner
    tags: [paging-hygiene, cross-ref]
    question: |
      The detailed mechanics of building actionable alerts (multi-burn-rate rules, the four
      golden signals, alert-fatigue tuning) primarily belong to which domain?
    options:
      - "observability"
      - "security"
      - "This on-call topic owns all of it"
      - "devops-cicd pipeline configuration"
    answer: 0
    explanation: |
      Alerting mechanics — burn-rate rules, golden signals, dashboards, and data-driven
      alert-fatigue tuning — live in observability. This topic owns the human/process
      discipline of paging and cross-references observability for the mechanics.
    ref: "concepts.md#paging-hygiene-actionable-urgent-user-impacting"

  - id: on-call-escalation-and-runbooks-030
    difficulty: beginner
    tags: [runbooks, definition]
    question: |
      What is a runbook?
    options:
      - "A live dashboard showing the service's real-time metrics and current alert states"
      - "A chronological log of every production deploy the team shipped in the last quarter"
      - "The escalation policy's configuration file, listing the paging order and ack timeouts"
      - "A documented, step-by-step procedure for responding to a known failure mode"
    answer: 3
    explanation: |
      A runbook (playbook) is a documented, step-by-step procedure for a known failure mode.
      The ideal is a runbook per alert, linked from the page so a responder executes a
      validated procedure instead of improvising.
    ref: "concepts.md#runbooks-and-playbooks"

  - id: on-call-escalation-and-runbooks-031
    difficulty: intermediate
    tags: [runbooks, mttr]
    question: |
      Per the SRE book, a good runbook combined with reasonably targeted alerting produces
      roughly what improvement in MTTR versus responders working from scratch?
    options:
      - "About a 3x improvement"
      - "No measurable improvement"
      - "About a 100x improvement"
      - "It always makes MTTR worse"
    answer: 0
    explanation: |
      The SRE book cites roughly a 3x MTTR improvement from a good runbook plus targeted
      alerting, because it converts improvised diagnosis into executing a validated
      procedure under stress.
    ref: "concepts.md#runbooks-and-playbooks"

  - id: on-call-escalation-and-runbooks-032
    difficulty: intermediate
    tags: [runbooks, quality]
    question: |
      Which characteristic best describes a GOOD runbook?
    options:
      - "It says 'investigate the system and use your judgment' to stay flexible across incidents"
      - "It is written once at launch and deliberately never revisited so the steps stay stable"
      - "It is kept secret in a restricted space so only a few designated experts can execute it"
      - "It gives exact commands, dashboard deep-links, and states mitigation-first"
    answer: 3
    explanation: |
      Good runbooks are specific and prescriptive: exact commands, deep links to
      dashboards/logs, mitigation-first (stop the bleeding before diagnosis), escalation
      guidance, and they are tested and maintained.
    ref: "concepts.md#runbooks-and-playbooks"

  - id: on-call-escalation-and-runbooks-033
    difficulty: advanced
    tags: [runbooks, stale, anti-pattern]
    question: |
      Why can a stale, untested runbook be worse than having no runbook at all?
    options:
      - "It takes up storage space in the wiki and slows down searches for current documentation"
      - "It automatically disables the alerts it references once any of its steps go out of date"
      - "It gives false confidence and may send a stressed responder down a wrong or dangerous path"
      - "It forces the responder to escalate immediately instead of attempting the documented fix"
    answer: 2
    explanation: |
      A runbook referencing a decommissioned host, old rollback command, or moved dashboard
      can misdirect a responder under pressure. False confidence in stale steps is dangerous
      — treat runbooks as living, versioned, tested artifacts.
    ref: "concepts.md#runbooks-and-playbooks"

  - id: on-call-escalation-and-runbooks-034
    difficulty: intermediate
    tags: [runbooks, mitigation-first]
    question: |
      A good runbook, matching the incident-response prime directive, tells the responder to
      do what first?
    options:
      - "Begin drafting the postmortem so the timeline is captured early"
      - "Identify the exact root cause before touching anything at all"
      - "Stop the bleeding (roll back / fail over / shed load) before diagnosis"
      - "Notify the marketing team so they can prepare customer messaging"
    answer: 2
    explanation: |
      Mitigation comes first: roll back, fail over, or shed load to stop customer impact,
      then diagnose. Root-cause analysis is a postmortem activity — see
      reliability-ops/incident-response-and-command.
    ref: "concepts.md#runbooks-and-playbooks"

  - id: on-call-escalation-and-runbooks-035
    difficulty: intermediate
    tags: [runbook-vs-playbook, terminology]
    question: |
      When teams distinguish "runbook" from "playbook," how do they typically differ?
    options:
      - "A runbook is written strictly for developers, whereas a playbook is meant for managers only"
      - "A runbook is a low-level operational procedure; a playbook is a higher-level incident decision guide"
      - "A playbook is always fully automated, whereas a runbook can never be scripted or automated"
      - "There is a strict industry standard that formally forbids using either of the two terms"
    answer: 1
    explanation: |
      Where distinguished, a runbook is the low-level, often automatable procedure ("restart
      service X, drain a node"), while a playbook is the higher-level decision guide for an
      incident type. In practice the terms are often used interchangeably.
    ref: "concepts.md#runbooks-and-playbooks"

  - id: on-call-escalation-and-runbooks-036
    difficulty: beginner
    tags: [progression, ladder]
    question: |
      What is the correct maturity progression for handling a recurring page?
    options:
      - "Automate the response → alert → write a runbook → eliminate"
      - "Eliminate the failure class → automate → alert → write a runbook"
      - "Alert → runbook → automate the runbook → eliminate the failure class"
      - "Write a runbook → alert → eliminate → then automate the steps"
    answer: 2
    explanation: |
      The ladder climbs from alert (human figures it out) → runbook (document response) →
      automate the runbook (script it) → auto-remediate (page disappears) → eliminate
      (engineer the failure class away). Each rung reduces human toil.
    ref: "concepts.md#the-alert--runbook--automate--eliminate-progression"

  - id: on-call-escalation-and-runbooks-037
    difficulty: intermediate
    tags: [progression, auto-remediate]
    question: |
      On the progression ladder, at which rung does the page effectively disappear for the
      on-call engineer?
    options:
      - "When the alert is first created, since a documented signal is enough to retire the page"
      - "When the runbook is written, because the documented procedure removes the need to be paged"
      - "When the system auto-remediates and merely notifies (rather than pages) the human"
      - "Never — pages are permanent once configured and can only ever be silenced, not removed"
    answer: 2
    explanation: |
      At the auto-remediate rung the system detects the condition and runs the fix itself,
      notifying the human instead of paging (or paging only if auto-remediation fails). Full
      elimination removes even the alert.
    ref: "concepts.md#the-alert--runbook--automate--eliminate-progression"

  - id: on-call-escalation-and-runbooks-038
    difficulty: advanced
    tags: [progression, automation-risk, trade-offs]
    question: |
      What is a key risk of auto-remediation that argues for keeping a human in the loop on
      high-blast-radius actions?
    options:
      - "Automation is always slower than a human because it must poll metrics before acting"
      - "An automated action firing on a misdiagnosed condition can amplify an outage"
      - "Automation cannot be version-controlled, so its remediation logic can never be audited"
      - "Auto-remediation is explicitly prohibited by core SRE principles for any production tier"
    answer: 1
    explanation: |
      Auto-remediating on a wrong diagnosis can make things worse (e.g. auto-restart masking
      a crash-loop, or runaway auto-scaling). Automate only tested, low-risk runbooks; keep
      notify-and-confirm for high-blast-radius actions.
    ref: "concepts.md#the-alert--runbook--automate--eliminate-progression"

  - id: on-call-escalation-and-runbooks-039
    difficulty: advanced
    tags: [progression, prioritization]
    question: |
      You have limited engineering time and many candidate runbooks to automate. What is the
      most rational way to prioritize which to automate first?
    options:
      - "Automate whichever is technically easiest, regardless of how much toil it actually removes"
      - "Automate the rarest pages first so those seldom-exercised responses are never forgotten"
      - "Prioritize by page frequency × toil per page (highest total burden first)"
      - "Automate alphabetically by service name to guarantee even coverage across the fleet"
    answer: 2
    explanation: |
      Return on effort is roughly frequency × toil per page. Automating a page that fires
      twice a year rarely pays off; automating a weekly, painful page does. Prioritize by
      total burden removed.
    ref: "concepts.md#the-alert--runbook--automate--eliminate-progression"

  - id: on-call-escalation-and-runbooks-040
    difficulty: advanced
    tags: [progression, scenario]
    question: |
      An alert pages your team every week and there is always a clear manual fix. What is the
      staff-level response?
    options:
      - "Silence the alert permanently so the recurring noise simply stops reaching the rotation"
      - "Increase the ack timeout so the weekly page escalates less often to the secondary"
      - "Confirm it's actionable, refine the runbook, then automate the runbook, then aim to remove the failure class"
      - "Assign it permanently to the newest team member as a standing onboarding exercise"
    answer: 2
    explanation: |
      Walk the ladder: ensure it's actionable (else delete), write/refine the runbook,
      automate the runbook, then engineer the failure class away — investing as far up the
      ladder as frequency × cost justifies.
    ref: "concepts.md#the-alert--runbook--automate--eliminate-progression"

  - id: on-call-escalation-and-runbooks-041
    difficulty: beginner
    tags: [toil, definition]
    question: |
      Per the Google SRE definition, which best describes toil?
    options:
      - "Manual, repetitive, automatable, tactical work that scales with growth and has no lasting value"
      - "Any work that is difficult or unpleasant, regardless of whether it is repetitive or automatable"
      - "Any engineering project that takes more than a week of sustained focused effort to complete"
      - "All operational work of any kind, including novel judgment-heavy incident diagnosis"
    answer: 0
    explanation: |
      Toil is manual, repetitive, automatable, tactical, no-enduring-value work that scales
      linearly with service growth. Not all operational work is toil — judgment-heavy or
      novel work isn't.
    ref: "concepts.md#toil-from-on-call"

  - id: on-call-escalation-and-runbooks-042
    difficulty: intermediate
    tags: [toil, death-spiral]
    question: |
      Why must on-call toil be bounded rather than allowed to grow with the service?
    options:
      - "Toil becomes legally impermissible once it exceeds a regulator-defined hours-per-week volume"
      - "Toil directly improves reliability, so bounding it is purely a cost-control concern, not a risk one"
      - "Paging tools bill the employer an extra per-hour surcharge for time logged against toil"
      - "If toil grows linearly with the service while engineering time is fixed, it eventually consumes the whole team"
    answer: 3
    explanation: |
      Unbounded toil grows with the service and, with fixed engineering time, eventually
      leaves no time to reduce it — a death spiral. The 50 % ops cap is the guardrail;
      overflow signals the need to invest in removing toil.
    ref: "concepts.md#toil-from-on-call"

  - id: on-call-escalation-and-runbooks-043
    difficulty: intermediate
    tags: [toil, judgment]
    question: |
      Which of these is NOT toil, even though it is operational?
    options:
      - "Manually restarting a service the exact same way every single day of the rotation"
      - "Copy-pasting the identical mitigation command from the wiki on each and every rotation"
      - "Repeatedly closing recurring tickets with one identical, scripted manual action each time"
      - "Novel work requiring human judgment to diagnose an unprecedented failure"
    answer: 3
    explanation: |
      Toil is repetitive, automatable, no-lasting-value work. Novel, judgment-heavy
      diagnosis of an unprecedented failure is real engineering/operational value, not toil
      — so the 50 % cap doesn't target it.
    ref: "concepts.md#toil-from-on-call"

  - id: on-call-escalation-and-runbooks-044
    difficulty: intermediate
    tags: [toil, measurement]
    question: |
      What is the recommended first step toward reducing on-call toil?
    options:
      - "Measure it explicitly (hours/rotation, pages needing manual intervention)"
      - "Immediately rewrite the entire service from scratch to remove every manual step at once"
      - "Stop doing postmortems to reclaim the hours they consume and spend that time on automation"
      - "Disable all non-critical alerts so the pager fires less often during each rotation"
    answer: 0
    explanation: |
      What you don't measure, you won't prioritize down. Tracking toil explicitly — hours
      per rotation, pages requiring manual intervention, repeated manual ticket actions —
      makes it visible so it can be automated or eliminated.
    ref: "concepts.md#toil-from-on-call"

  - id: on-call-escalation-and-runbooks-045
    difficulty: advanced
    tags: [health, metrics, scenario]
    question: |
      An interviewer asks "how do you know your on-call is healthy?" Which answer is
      strongest?
    options:
      - "The team says it broadly feels manageable when we ask them in retrospectives"
      - "We haven't received any formal complaints about the pager this past quarter"
      - "We track pages/shift (target ≤ 2 real ones), % actionable, ops-time %, time-of-day distribution, and MTTR/attrition trends"
      - "We keep the single most senior engineer always available as a permanent backstop"
    answer: 2
    explanation: |
      Health is measured, not felt. Strong signals include pages per shift (≤ 2 requiring
      real work), % actionable, ops-time % (≤ 50), page time-of-day distribution, MTTR
      trend, and responder sentiment/attrition.
    ref: "concepts.md#healthy-on-call-load-caps-the-50--rule-and-compensation"

  - id: on-call-escalation-and-runbooks-046
    difficulty: expert
    tags: [scenario, load-cap, remediation]
    question: |
      Your rotation consistently sees 4–5 incidents per 12-hour shift and postmortems are
      being skipped. Which response is correct SRE practice?
    options:
      - "Demand responders simply work harder and skip breaks until the incident rate falls"
      - "Redistribute load — split the service, add capacity, or fund engineering to cut paging"
      - "Extend shifts to a full 24 hours so a single responder absorbs the entire incident load"
      - "Delete the incident-tracking records so the per-shift number looks healthier on the dashboard"
    answer: 1
    explanation: |
      Exceeding the ~2/shift cap is a signal to fix the system, not to demand heroics. The
      right levers are redistributing load (split the service, add capacity) and investing
      engineering time to reduce the underlying paging.
    ref: "concepts.md#healthy-on-call-load-caps-the-50--rule-and-compensation"

  - id: on-call-escalation-and-runbooks-047
    difficulty: expert
    tags: [scenario, escalation, testing]
    question: |
      To ensure your escalation policy actually works when it matters, what should you do
      proactively?
    options:
      - "Wait for a real Sev1 to arrive and use it to find out whether the chain actually works"
      - "Remove the secondary responder to simplify the policy and cut down on escalation hops"
      - "Set all per-level ack timeouts to zero so every page escalates through the chain instantly"
      - "Periodically fire a synthetic/test page and confirm it walks the full chain to a valid backstop"
    answer: 3
    explanation: |
      Escalation chains rot silently (people leave, gaps appear). Proactively test with
      synthetic pages that walk primary → secondary → manager → backstop, verifying no
      dead-ends, rather than discovering the gap during a real outage.
    ref: "concepts.md#escalation-policies"

  - id: on-call-escalation-and-runbooks-048
    difficulty: expert
    tags: [scenario, cross-domain, load-shedding]
    question: |
      During a shift, a dependency is degraded and your service is being overwhelmed. Your
      runbook lists load-shedding as a mitigation. In this library, where do the mechanics of
      load-shedding as a reliability lever live?
    options:
      - "security owns load-shedding entirely, since it is fundamentally an abuse-prevention control"
      - "This on-call topic itself defines the full load-shedding algorithm and its threshold tuning"
      - "observability, since load-shedding is triggered from metrics and dashboards it already owns"
      - "reliability-ops/load-shedding-and-backpressure — shedding load to protect the system"
    answer: 3
    explanation: |
      Load-shedding as a reliability mechanism (shed load to protect the system) is covered
      in reliability-ops/load-shedding-and-backpressure; security owns rate-limiting for
      abuse-prevention. The runbook here just invokes the lever and links out.
    ref: "concepts.md#runbooks-and-playbooks"

  - id: on-call-escalation-and-runbooks-049
    difficulty: expert
    tags: [load-cap, sub-cap, numbers]
    question: |
      Inside the ≤ 50 % operational-work budget, Google SRE places a finer cap specifically
      on on-call. What is it, and why does it matter?
    options:
      - "≤ 25 % of time on on-call — it is the arithmetic that drives minimum rotation size"
      - "≤ 40 % of time on on-call — chosen to match a four-day work week"
      - "≤ 10 % of time on on-call — the rest of ops is toil tickets"
      - "There is no sub-cap; the 50 % ops figure covers on-call directly"
    answer: 0
    explanation: |
      The 50 % ops cap splits into ≤ 25 % on on-call and up to ~25 % on other operational
      non-project work. The 25 % on-call sub-cap, combined with week-long shifts, is what
      yields the ~8-engineer single-site minimum.
    ref: "concepts.md#team-size-math-and-the-25-on-call-sub-cap"

  - id: on-call-escalation-and-runbooks-050
    difficulty: advanced
    tags: [team-size, staffing, numbers]
    question: |
      Using the 25 % on-call sub-cap and week-long primary+secondary shifts, what single-site
      rotation size does the SRE Workbook recommend once a buffer is included?
    options:
      - "About 3 engineers, enough to cover primary, secondary, and a single spare"
      - "About 9 engineers (8 for bare coverage, +1 buffer)"
      - "About 15 engineers, to keep each person's on-call share well under the sub-cap"
      - "About 20 engineers, matching the headcount of a full two-site follow-the-sun team"
    answer: 1
    explanation: |
      At most 25 % of time on-call plus a week-long shift means each engineer is on-call
      ~one week per month; staffing both a primary and secondary week needs ~8, and a +1
      buffer for leave/attrition brings the recommended figure to 9.
    ref: "concepts.md#team-size-math-and-the-25-on-call-sub-cap"

  - id: on-call-escalation-and-runbooks-051
    difficulty: expert
    tags: [team-size, follow-the-sun, numbers]
    question: |
      For a two-site follow-the-sun rotation, why is the per-site minimum (~5, or 6 with
      buffer) lower than the ~8–9 required at a single site?
    options:
      - "Follow-the-sun services have fewer incidents by definition"
      - "Multi-site teams are exempt from the 25 % on-call cap"
      - "Neither site covers nights, so each site's coverage window and per-engineer load are smaller"
      - "Secondary on-call is unnecessary in multi-site setups"
    answer: 2
    explanation: |
      Because each site only covers its own daytime, no one absorbs night shifts, so the
      per-engineer on-call share stays under 25 % with fewer people — ~5 per site for bare
      coverage, 6 with a buffer.
    ref: "concepts.md#team-size-math-and-the-25-on-call-sub-cap"

  - id: on-call-escalation-and-runbooks-052
    difficulty: expert
    tags: [response-slo, scenario, availability]
    question: |
      A payments API with a 99.99 % availability target is deciding between a 5-minute and a
      30-minute paging response SLO. Which choice and rationale is soundest?
    options:
      - "30-minute — responders deserve flexibility regardless of the service tier"
      - "5-minute — 99.99 % leaves only ~13 min of budget per quarter, so a tethered, minute-scale response is required"
      - "Either works; response time does not affect the error budget"
      - "5-minute — but only because payments teams are legally required to respond fast"
    answer: 1
    explanation: |
      A 99.99 % target allows only ~13 minutes of downtime per quarter, so even a 30-minute
      response could blow the budget in a single incident. A user-facing, budget-tight
      service warrants the 5-minute tier, which effectively tethers the responder to a laptop.
    ref: "concepts.md#paging-response-time-slos-and-alert-to-incident-ratio"

  - id: on-call-escalation-and-runbooks-053
    difficulty: advanced
    tags: [availability, budget, numbers]
    question: |
      Roughly how much total unavailability does a 99.999 % ("five nines") target permit per
      quarter, and what does that imply for on-call?
    options:
      - "About 13 minutes — leaving ample room for a comfortable human 5-minute paging response"
      - "About 26 minutes — enough slack that a relaxed 30-minute human response still works fine"
      - "About 80 seconds — essentially too little for human response, forcing automated mitigation"
      - "About 8 hours — so pages can safely wait for business hours the next working morning"
    answer: 2
    explanation: |
      Five nines allows only ~80 seconds of downtime per quarter — far less than any human
      can detect, page on, and mitigate. Achieving it requires automated detection and
      remediation, not human on-call response.
    ref: "concepts.md#paging-response-time-slos-and-alert-to-incident-ratio"

  - id: on-call-escalation-and-runbooks-054
    difficulty: expert
    tags: [alert-to-incident, load-cap, scenario]
    question: |
      A single outage trips 40 correlated alerts in ten minutes. Against your
      ~2-incidents-per-shift cap, how should this be counted, and what is the target ratio?
    options:
      - "40 incidents — each alert is counted as a separate response unit against the cap"
      - "20 incidents — pair the alerts up two-to-one before counting them against the cap"
      - "1 incident — one problem is one incident; the target is a 1:1 alert-to-incident ratio via dedup/grouping"
      - "0 incidents — correlated alerts don't count toward the cap until the root cause is known"
    answer: 2
    explanation: |
      One underlying problem is one incident regardless of how many raw alerts fire. Google's
      explicit goal is a 1:1 alert-to-incident ratio, achieved by deduplicating and grouping
      related alerts so incident load — not raw alert volume — is what's measured.
    ref: "concepts.md#paging-response-time-slos-and-alert-to-incident-ratio"

  - id: on-call-escalation-and-runbooks-055
    difficulty: advanced
    tags: [onboarding, shadowing]
    question: |
      What is the typical timeline and mechanism for bringing a new hire onto on-call?
    options:
      - "Day one — new hires learn fastest by owning real production pages immediately"
      - "Exactly 2 years of tenure, with no shadowing or interim participation before then"
      - "Never for junior engineers; only staff+ engineers should be on-call"
      - "3–9 months, ramped via shadowing (they receive alerts but don't own the response)"
    answer: 3
    explanation: |
      New engineers usually aren't ready to own the pager for 3–9 months. Shadowing is the
      ramp: they receive all alerts a real on-caller would but don't own the response, while
      an experienced engineer holds primary.
    ref: "concepts.md#onboarding-shadowing-and-operational-underload"

  - id: on-call-escalation-and-runbooks-056
    difficulty: expert
    tags: [underload, trap, scenario]
    question: |
      On-call has been almost completely quiet for six months. An interviewer asks whether
      that is purely a good thing. What is the senior answer?
    options:
      - "Yes — a perfectly quiet pager is the unqualified goal, and a six-month silence proves nothing more is needed"
      - "No — operational underload rots skills and hides gaps; counter it with game days, Wheel of Misfortune, and a minimum on-call frequency"
      - "No — a six-month silence can only mean the monitoring is silently broken and the whole alerting stack must be rebuilt"
      - "Yes — and the rotation should be shrunk to reclaim headcount, since such a quiet pager proves on-call is now trivial"
    answer: 1
    explanation: |
      Underload is a real failure mode ('treacherous enemy'): skills atrophy and confidence
      outruns competence. Remedies keep responders sharp — Wheel of Misfortune, DiRT/game
      days, and ensuring each engineer is on-call at least once or twice per quarter.
    ref: "concepts.md#onboarding-shadowing-and-operational-underload"

  - id: on-call-escalation-and-runbooks-057
    difficulty: advanced
    tags: [underload, game-days, wheel-of-misfortune]
    question: |
      What is the "Wheel of Misfortune" as an on-call practice?
    options:
      - "A randomized scheduling scheme that assigns the least desirable overnight shifts to engineers by monthly lottery"
      - "A role-played disaster scenario where an engineer works a simulated outage against a game master using real tools/runbooks"
      - "A monitoring dashboard that automatically surfaces the single noisiest, most frequently firing alert each week"
      - "A formal tracking system that records and penalizes engineers who repeatedly miss or fail to acknowledge pages"
    answer: 1
    explanation: |
      Wheel of Misfortune is a disaster role-play: an engineer works through a simulated
      outage led by a game master, exercising real tools and runbooks. Along with DiRT-style
      game days, it counteracts operational underload and keeps responders practiced.
    ref: "concepts.md#onboarding-shadowing-and-operational-underload"

  - id: on-call-escalation-and-runbooks-058
    difficulty: expert
    tags: [human-factors, cognitive-load]
    question: |
      Why do runbooks and blameless culture deliver reliability value beyond mere
      documentation, in terms of how humans think under stress?
    options:
      - "Stress hormones such as cortisol actually sharpen deliberate analytical reasoning under pressure, so runbooks and blameless culture merely add cosmetic polish to an already-optimal responder"
      - "Under stress, cortisol pushes responders into fast, biased System 1 thinking; runbooks substitute a validated System 2 procedure and blamelessness removes fear that further degrades judgment"
      - "Runbooks exist purely to satisfy audit and compliance obligations and have no measurable effect whatsoever on how a stressed responder actually reasons or decides during an incident"
      - "Blameless culture works mainly by slowing responders down and forcing deliberate pauses, and that induced slowness is the primary reliability benefit the practice actually provides"
    answer: 1
    explanation: |
      Acute stress and cortisol/CRH degrade deliberate (System 2) reasoning and amplify
      confirmation bias, defaulting people to fast System 1 heuristics. A good runbook
      supplies a pre-validated procedure so no improvisation is needed, and blamelessness
      removes fear — the deeper reason for the ~3x MTTR gain.
    ref: "concepts.md#human-factors-cognitive-load-under-pressure"

  - id: on-call-escalation-and-runbooks-059
    difficulty: advanced
    tags: [human-factors, resources]
    question: |
      Google SRE names three key resources that support an on-call engineer under pressure.
      Which set is correct?
    options:
      - "A larger second monitor, a faster laptop, and free coffee on shift"
      - "Clear procedures (runbooks), escalation paths, and a blameless culture"
      - "Unlimited overtime pay, a private office, and admin rights"
      - "More configured alerts, extra dashboards, and status meetings"
    answer: 1
    explanation: |
      The three resources are runbooks (so no improvisation is required), escalation paths
      (so no one is stuck alone), and a blameless culture (so fear doesn't further impair
      judgment) — each a direct countermeasure to stress-degraded reasoning.
    ref: "concepts.md#human-factors-cognitive-load-under-pressure"

  - id: on-call-escalation-and-runbooks-060
    difficulty: expert
    tags: [ownership, you-build-it, vogels]
    question: |
      The phrase "you build it, you run it" — and its rationale that developer contact with
      operations and customers improves quality — is attributable to whom?
    options:
      - "Werner Vogels (Amazon), ACM Queue interview, 2006"
      - "The Google SRE book authors, 2016"
      - "Michael Nygard in Release It!"
      - "The AWS Well-Architected Framework"
    answer: 0
    explanation: |
      Werner Vogels articulated 'you build it, you run it' in a 2006 ACM Queue interview,
      arguing that putting developers in day-to-day contact with operations and customers
      produces a significant improvement in quality.
    ref: "concepts.md#who-runs-it-you-build-it-you-run-it-vs-the-sre-model"

  - id: on-call-escalation-and-runbooks-061
    difficulty: advanced
    tags: [sre-model, give-back-the-pager]
    question: |
      In the Google SRE model, what is "give back the pager," and what does it enforce?
    options:
      - "A ceremonial retirement ritual performed when a long-tenured engineer permanently leaves the on-call rotation for the last time"
      - "SRE handing on-call responsibility back to developers when ops load or error-budget policy is breached — the balance-of-powers that protects SRE and forces reliability investment"
      - "A paging-tool feature that automatically mutes and suppresses all incoming pages for the duration of an active production deploy"
      - "The compensation practice of paying developers an extra per-page bonus so they willingly take pages off the SRE rotation"
    answer: 1
    explanation: |
      'Give back the pager' is SRE's enforcement lever: if operational load exceeds the cap
      or the error-budget policy is violated, SRE can return on-call duty to the dev team
      until the service is made operable — a deliberate balance-of-powers, not an unlimited
      ops sink.
    ref: "concepts.md#who-runs-it-you-build-it-you-run-it-vs-the-sre-model"

  - id: on-call-escalation-and-runbooks-062
    difficulty: intermediate
    tags: [chatops, tooling]
    question: |
      What is a primary reliability benefit of conducting incident response via ChatOps?
    options:
      - "It fully replaces written runbooks, since the chat log itself documents every response step"
      - "It gives shared real-time context and an automatic audit trail/timeline that feeds the postmortem"
      - "It mathematically guarantees incidents resolve faster than any other response method"
      - "It removes the need for a formal escalation policy since everyone watches the shared channel"
    answer: 1
    explanation: |
      ChatOps (origin: GitHub's Hubot) provides a shared channel where everyone sees the same
      context, an automatic timestamped timeline for the postmortem, in-channel runbook
      command execution, and a lower onboarding barrier for juniors.
    ref: "concepts.md#chatops-and-incident-tooling"

  - id: on-call-escalation-and-runbooks-063
    difficulty: expert
    tags: [pager-load, diagnosis, framework]
    question: |
      Pages are too frequent. The SRE Workbook frames pager load as coming from three
      sources. Which triad is correct?
    options:
      - "Weather, hardware age, and phase of the moon"
      - "Production bugs, alerting configuration, and human processes"
      - "Vendor outages, DNS, and TLS certificates only"
      - "Marketing launches, holidays, and code freezes"
    answer: 1
    explanation: |
      Pager load originates from (1) production bugs/defects, (2) alerting configuration
      (tight thresholds, non-actionable alerts, missing dedup), and (3) human processes
      (manual work that could be automated). Fixes map to point, systemic, or
      monitoring/prevention changes.
    ref: "concepts.md#diagnosing-and-reducing-pager-load"

  - id: on-call-escalation-and-runbooks-064
    difficulty: expert
    tags: [pager-load, break-even, numbers]
    question: |
      A recurring page costs ~4 hours of human time end-to-end, and a durable fix would take
      ~120 engineering hours. Around how many pages is the break-even point for doing the fix?
    options:
      - "About 4 pages"
      - "About 30 pages"
      - "About 120 pages"
      - "About 480 pages"
    answer: 1
    explanation: |
      Break-even = fix cost / cost per page = 120 / 4 = 30 pages. If the alert would fire more
      than ~30 times before you'd otherwise fix it, the automation pays for itself — the
      numeric version of prioritizing by frequency x toil.
    ref: "concepts.md#diagnosing-and-reducing-pager-load"

  - id: on-call-escalation-and-runbooks-065
    difficulty: advanced
    tags: [pager-load, metrics, instruments]
    question: |
      Which instrument does the SRE Workbook recommend for tracking pager load at ops-review
      meetings, and why that form?
    options:
      - "A single raw count from last night — it is the freshest signal"
      - "A 21-day trailing average — it smooths spikes and surfaces the trend"
      - "The all-time cumulative total — it never loses information"
      - "Only the peak-hour count — spikes are all that matter"
    answer: 1
    explanation: |
      A 21-day trailing average of pager load smooths out day-to-day spikes and reveals the
      trend, which is what ops reviews need. Filing a placeholder bug per paging alert also
      produces structured, queryable data.
    ref: "concepts.md#diagnosing-and-reducing-pager-load"

  - id: on-call-escalation-and-runbooks-066
    difficulty: expert
    tags: [orr, readiness, aws]
    question: |
      What is an AWS Operational Readiness Review (ORR), and how does it relate to on-call?
    options:
      - "A mandatory post-incident meeting, held after every outage, whose purpose is to assign individual blame for the failure"
      - "A checklist-based go/no-go gate before production that codifies past-incident lessons, making on-call readiness a launch prerequisite"
      - "A recurring monthly report that flags unexpected billing anomalies and cost spikes across the service's AWS accounts"
      - "An automated tooling system that detects failed production deploys and rolls them back without any human involvement"
    answer: 1
    explanation: |
      The ORR is a checklist-based go/no-go gate run before (and periodically after) a
      service reaches production. Each item encodes a lesson from past incidents, so a
      service can't take the pager until it passes — on-call readiness becomes a launch gate.
    ref: "concepts.md#operational-readiness-reviews-and-the-runbookplaybook-split"

  - id: on-call-escalation-and-runbooks-067
    difficulty: expert
    tags: [runbook-vs-playbook, aws, distinction]
    question: |
      Using the sharp AWS Well-Architected (REL 12) distinction, how do a runbook and a
      playbook differ?
    options:
      - "A runbook is written exclusively for automated machine execution, whereas a playbook is written exclusively for humans to read"
      - "A runbook is a procedure for a KNOWN outcome (failover, scale-up, deploy); a playbook is a procedure to INVESTIGATE an unknown/unexpected issue"
      - "A playbook is simply a shorter document than a runbook, and the number of steps or pages is the only real difference between them"
      - "They are exactly identical artifacts, and AWS Well-Architected uses the two words completely interchangeably with no distinction"
    answer: 1
    explanation: |
      AWS draws a precise line: a runbook documents a procedure for a known outcome (do this
      to fail over/scale/deploy), whereas a playbook is a diagnostic guide to investigate an
      unknown or unexpected situation. The interview trap is answering 'same thing.'
    ref: "concepts.md#operational-readiness-reviews-and-the-runbookplaybook-split"

  - id: on-call-escalation-and-runbooks-068
    difficulty: advanced
    tags: [runbook-structure, limoncelli]
    question: |
      In Limoncelli's 7-section runbook template, which section most directly serves the
      on-call responder?
    options:
      - "The SLA section, recording the service's contractual availability targets"
      - "The Build/Deploy Info section, covering how the service is built and shipped"
      - "The Pager Playbook — one entry per alert mapping the page to its response"
      - "The Service Overview section, describing the service's purpose and dependencies"
    answer: 2
    explanation: |
      The Pager Playbook section maps every alert to its response, so a paged responder can
      go straight from the alert to the documented action. The other sections (Overview,
      Build, Deployment, Common Tasks, DR Plans, SLA) support operations more broadly.
    ref: "concepts.md#operational-readiness-reviews-and-the-runbookplaybook-split"

  - id: on-call-escalation-and-runbooks-069
    difficulty: intermediate
    tags: [escalation, ack-timeout, dnd]
    question: |
      Two concrete escalation-tool defaults matter for on-call to work at 3 a.m. Which pair is
      correct?
    options:
      - "A ~5-minute per-level ack timeout, and the paging app must bypass phone Do Not Disturb"
      - "A 60-minute ack timeout, and the paging app should respect the phone's Do Not Disturb"
      - "No ack timeout at all, and pages should be delivered only over email, never by phone"
      - "A 5-second ack timeout, and paging must use push notifications and never phone calls"
    answer: 0
    explanation: |
      The common standard is a ~5-minute acknowledgement timeout per escalation level, and
      the paging app must override the phone's Do Not Disturb/silent mode — otherwise a
      correctly configured escalation still fails because the phone was silenced overnight.
    ref: "concepts.md#escalation-mechanics-ack-timeouts-layering-and-dnd-bypass"

  - id: on-call-escalation-and-runbooks-070
    difficulty: advanced
    tags: [escalation, layered-vs-round-robin]
    question: |
      PagerDuty recommends layered escalation over pure round-robin. What is the key
      difference that motivates this?
    options:
      - "Round-robin scheduling carries a substantially higher per-seat licensing cost in most commercial paging tools"
      - "Layered escalation climbs to more people/authority (primary → backup → whole team) when a page is unhandled, providing fallback depth; round-robin only rotates who is first"
      - "Round-robin rotations cannot be automated by paging tools and must be advanced manually by the on-call lead"
      - "Layered escalation entirely removes the need to staff a secondary on-call responder, since the whole team is always paged first"
    answer: 1
    explanation: |
      Layered escalation provides depth: an unhandled page climbs primary → backup → whole
      team (team-level should hopefully never trigger). Round-robin merely rotates who's
      first and lacks that fallback, so a missed page can go unanswered.
    ref: "concepts.md#escalation-mechanics-ack-timeouts-layering-and-dnd-bypass"

  - id: on-call-escalation-and-runbooks-071
    difficulty: expert
    tags: [escalation, scenario, sev1]
    question: |
      Design the escalation for a Sev1 payment-processing outage. Which policy best fits
      staff-level practice?
    options:
      - "Page only the primary with a relaxed 15-minute ack window, with no secondary, no incident commander, and no layered fallback whatsoever if that single page happens to go unanswered overnight"
      - "Simultaneously page primary + secondary + incident commander with a ~2-minute ack window, layered fallback to the team and the payments-provider/dependency team plus EM, a backstop rotation, DND bypass, and periodic synthetic-page testing"
      - "Post a single message in the team chat channel and simply wait for whoever happens to be online at the time to notice it, pick it up, and volunteer to drive the response without any paging at all"
      - "Escalate straight to the company CEO on the very first page, bypassing every engineer and on-call responder entirely, on the theory that top-down attention alone will guarantee the outage is resolved fastest"
    answer: 1
    explanation: |
      A Sev1 with direct revenue impact warrants aggressive, tested escalation: simultaneous
      primary/secondary/IC paging, a tight (~2-minute) ack window, horizontal escalation to
      the dependency team, a backstop so nothing drops, DND bypass, and synthetic-page tests
      to prove the chain works before it's needed.
    ref: "concepts.md#escalation-mechanics-ack-timeouts-layering-and-dnd-bypass"

  - id: on-call-escalation-and-runbooks-072
    difficulty: advanced
    tags: [scheduling, fairness, trust]
    question: |
      A good on-call auto-scheduler rebalances load for fairness. What must it never do?
    options:
      - "Rebalance upcoming, still-unpublished rotations before the schedule is shared with the team"
      - "Mutate an already-generated/published schedule that people have planned their lives around"
      - "Allow peer-reviewed short-term shift swaps between two consenting engineers on the rotation"
      - "Support part-time or reduced-load participation for engineers with capacity constraints"
    answer: 1
    explanation: |
      The golden rule is 'optimize the future, never rewrite the past': rebalance upcoming
      rotations, but treat a published schedule as a commitment. Silently reshuffling it
      betrays trust. Swaps should be peer-reviewed so they can't leave a silent gap.
    ref: "concepts.md#scheduling-and-on-call-flexibility"

  - id: on-call-escalation-and-runbooks-073
    difficulty: intermediate
    tags: [escalation, managers, culture]
    question: |
      What is the recommended role of managers with respect to the on-call rotation?
    options:
      - "Managers should be entirely excluded from the on-call rotation to keep their schedules free for planning work"
      - "Managers can and should take normal-rotation shifts for visibility, beyond acting as an authority backstop"
      - "Managers should personally take every Sev1 incident so that engineers are never the ones paged for outages"
      - "Managers should serve only as the final escalation of last resort and never act as a normal first-line responder"
    answer: 1
    explanation: |
      Beyond being an authority backstop, managers can and should take normal-rotation shifts:
      feeling the pager keeps them honest about on-call health and load, and models that
      on-call is shared, not delegated downward.
    ref: "concepts.md#escalation-mechanics-ack-timeouts-layering-and-dnd-bypass"

  - id: on-call-escalation-and-runbooks-074
    difficulty: expert
    tags: [paging-hygiene, severity, routing]
    question: |
      Using an Evernote-style P1/P2/P3 mapping, which routing matches good paging hygiene?
    options:
      - "P1, P2, and P3 should all page the on-call immediately so that no signal of any severity is ever missed"
      - "P1 pages the on-call; P2 goes to next-business-day email/ticket; P3 is informational (dashboard)"
      - "P1 routes only to a dashboard, P2 pages the on-call, and P3 emails a manager for weekly triage review"
      - "All three severities route to a shared dashboard and are reviewed together in a weekly ops meeting"
    answer: 1
    explanation: |
      Only urgent, actionable, user-impacting issues (P1) should page. P2 is important but
      can wait for business hours (email/ticket), and P3 is informational (dashboard). Paging
      on P2/P3 breeds alert fatigue and gets real P1 pages ignored.
    ref: "concepts.md#paging-hygiene-actionable-urgent-user-impacting"
