topic: "Observability Fundamentals & the Three Pillars"
domain: observability
topic_slug: observability-fundamentals-and-three-pillars
version: 1
questions:
  - id: observability-fundamentals-and-three-pillars-001
    difficulty: beginner
    tags: [monitoring-vs-observability, definitions]
    question: |
      Which statement best captures the difference between monitoring and
      observability?
    options:
      - "Monitoring watches predefined signals for known conditions; observability is the capacity to ask arbitrary, unanticipated questions from existing telemetry"
      - "Monitoring is defined by which tools you use — it relies exclusively on metrics, whereas observability relies exclusively on distributed traces"
      - "Observability is only achievable in cloud-native environments with managed backends, while monitoring is a strictly on-premises discipline tied to physical hardware"
      - "They are exact synonyms coined by competing vendors, so the two terms are fully interchangeable in every engineering context"
    answer: 0
    explanation: |
      Monitoring is acting on conditions you predicted in advance (known-unknowns).
      Observability is the broader capability to investigate arbitrary,
      previously-unanticipated behavior (unknown-unknowns) from telemetry you
      already emit. Tools alone (metrics vs traces) do not define the distinction.
    ref: "concepts.md#monitoring-vs-observability"

  - id: observability-fundamentals-and-three-pillars-002
    difficulty: beginner
    tags: [monitoring-vs-observability, known-unknowns]
    question: |
      Monitoring is best suited to which class of problem?
    options:
      - "Known-unknowns — failure modes you can anticipate and set thresholds for"
      - "Unknown-unknowns — entirely novel failure modes you never anticipated and could not have written a threshold for in advance"
      - "Only security vulnerabilities such as intrusion attempts and credential leaks, which is the sole class of problem monitoring can address"
      - "Only compile-time errors caught by the build pipeline before code is ever deployed to a production environment"
    answer: 0
    explanation: |
      Monitoring targets known-unknowns: conditions you can predict, such as a disk
      filling or error rate exceeding a threshold, and build dashboards/alerts for.
      Observability targets unknown-unknowns.
    ref: "concepts.md#monitoring-vs-observability"

  - id: observability-fundamentals-and-three-pillars-003
    difficulty: intermediate
    tags: [monitoring-vs-observability, misconception]
    question: |
      A team says "we have Prometheus, ELK, and Jaeger, so we are fully
      observable." What is the strongest critique of this claim?
    options:
      - "They should have consolidated onto a single vendor's suite for all three, because mixing open-source tools makes a system inherently unobservable"
      - "Three tools is too few — established observability practice mandates a minimum of five distinct signal types before a system qualifies as observable"
      - "Owning the three signal types does not guarantee observability if the signals cannot be correlated or sliced along the dimension that matters"
      - "Jaeger only visualizes spans and cannot actually persist trace data, so the claim of being observable is technically impossible"
    answer: 2
    explanation: |
      Observability is not defined by owning metrics + logs + traces. If the signals
      are disconnected silos (no shared trace_id, no exemplars) or metrics lack the
      dimension needed to answer the question, the system is still effectively
      unobservable for novel problems.
    ref: "concepts.md#monitoring-vs-observability"

  - id: observability-fundamentals-and-three-pillars-004
    difficulty: intermediate
    tags: [control-theory, origin]
    question: |
      The term "observability" originates from control theory. In that original
      sense, a system is observable when you can:
    options:
      - "Determine its complete internal state purely from its external outputs"
      - "Restart it from a clean state without losing any in-flight data or committed transactions"
      - "Attach an interactive debugger to a live production process and step through its execution"
      - "Scale it horizontally across additional nodes without incurring any downtime or dropped requests"
    answer: 0
    explanation: |
      Kálmán's control-theory definition: a system is observable if its internal
      state can be inferred from its external outputs over a finite window. Applied
      to software, internal state must be inferable from emitted telemetry because you
      cannot inspect production memory directly.
    ref: "concepts.md#observability-as-inference-of-internal-state-control-theory-origin"

  - id: observability-fundamentals-and-three-pillars-005
    difficulty: intermediate
    tags: [control-theory, instrumentation]
    question: |
      Following the control-theory framing, what is the consequence of a code path
      that emits no telemetry at all?
    options:
      - "That part of the system's state is effectively unobservable — you cannot infer what happened there regardless of how many dashboards you have"
      - "It runs measurably faster because it carries zero instrumentation overhead, which is always the desirable outcome to optimize for"
      - "Prometheus will automatically synthesize approximate metrics for it by inferring behavior from neighboring instrumented code paths"
      - "It is guaranteed to be bug-free, since code that emits no telemetry has by definition passed all validation checks"
    answer: 0
    explanation: |
      If a code path emits no signal, its internal state is unrecoverable from
      outputs — it is unobservable. Instrumentation is what makes state inferable;
      it is not merely optional overhead.
    ref: "concepts.md#observability-as-inference-of-internal-state-control-theory-origin"

  - id: observability-fundamentals-and-three-pillars-006
    difficulty: beginner
    tags: [three-pillars, definitions]
    question: |
      Which are the classic "three pillars" of observability?
    options:
      - "Metrics, logs, and traces"
      - "Alerts, dashboards, and runbooks — the three operational artifacts an on-call engineer touches during an incident"
      - "CPU, memory, and disk — the three host-level resources every monitoring agent scrapes by default"
      - "Uptime, latency, and cost — the three business-facing KPIs reported to stakeholders each quarter"
    answer: 0
    explanation: |
      The three pillars are metrics (aggregated numbers over time), logs (discrete
      timestamped events), and traces (the causal path of a single request across
      services).
    ref: "concepts.md#the-three-pillars-metrics-logs-and-traces"

  - id: observability-fundamentals-and-three-pillars-007
    difficulty: beginner
    tags: [three-pillars, metrics]
    question: |
      What question are metrics best at answering?
    options:
      - "That something is wrong and how much — good for trends, dashboards, and alerting"
      - "Exactly what happened inside one specific request, replaying its full parameter and payload detail step by step"
      - "Where in a distributed call graph a single request spent its time, span by span across every downstream service"
      - "Which developer authored the failing code, by attributing each error back to its most recent commit and owner"
    answer: 0
    explanation: |
      Metrics are aggregated numeric time series: cheap to store/query and ideal for
      detection, trends, and alerting. They tell you *that* something is wrong and
      *how much*, but not *why*. Detail comes from logs; localization from traces.
    ref: "concepts.md#the-three-pillars-metrics-logs-and-traces"

  - id: observability-fundamentals-and-three-pillars-008
    difficulty: beginner
    tags: [three-pillars, traces]
    question: |
      A distributed trace is composed of a tree of what?
    options:
      - "Log lines — individual timestamped text entries emitted at each step of the request"
      - "Counters — monotonically increasing numeric values incremented once per operation"
      - "Spans — named, timed operations that nest parent/child"
      - "Dashboards — pre-built visualization panels assembled from the request's metrics"
    answer: 2
    explanation: |
      A trace is the causal, timed path of a single request represented as a tree of
      spans. Each span is a named, timed operation with attributes; child spans nest
      under their parent, showing where time was spent across the call graph.
    ref: "concepts.md#the-three-pillars-metrics-logs-and-traces"

  - id: observability-fundamentals-and-three-pillars-009
    difficulty: intermediate
    tags: [three-pillars, traces, localization]
    question: |
      Users report intermittent slowness on a request that fans out across six
      microservices. Which pillar most directly localizes *where* the time is being
      spent?
    options:
      - "Traces — the span tree shows latency contribution per service/operation"
      - "A single counter metric of total requests, which reports aggregate volume but no per-service timing breakdown"
      - "Unstructured application logs from just one of the six services, read line by line during the incident"
      - "The host's CPU utilization gauge, sampled at the node level across the underlying fleet"
    answer: 0
    explanation: |
      Traces show the per-span latency across the whole call graph for a single
      request, so you can see which service/operation dominated. Metrics detect the
      slowness in aggregate; logs give detail at a point; the trace localizes it.
    ref: "concepts.md#the-three-pillars-metrics-logs-and-traces"

  - id: observability-fundamentals-and-three-pillars-010
    difficulty: intermediate
    tags: [three-pillars, cost]
    question: |
      Which statement about the cost/shape trade-offs of the three pillars is
      correct?
    options:
      - "Metrics are the most expensive signal per event because each sample stores the full request context and payload alongside the numeric value"
      - "Logs aggregate far more cheaply than metrics across a whole fleet, since a log backend rolls millions of lines into a single compact time series"
      - "Metrics are cheap and aggregate well but pre-aggregate away detail; logs are detailed but expensive at volume; traces are per-request and usually sampled"
      - "Traces store fixed-cardinality numeric series like metrics do, which makes them the cheapest of the three to retain at full volume without sampling"
    answer: 2
    explanation: |
      Metrics are cheap, fixed-cardinality series great for aggregation but lossy on
      detail. Logs carry the most detail per event but are expensive at volume and
      hard to aggregate. Traces capture per-request causality and are typically
      sampled to control volume.
    ref: "concepts.md#the-three-pillars-metrics-logs-and-traces"

  - id: observability-fundamentals-and-three-pillars-011
    difficulty: intermediate
    tags: [three-pillars, necessary-not-sufficient, correlation]
    question: |
      Why is the "three pillars" model often described as necessary but not
      sufficient for observability?
    options:
      - "Because the pillars, if stored in disconnected silos without shared identifiers, cannot be correlated to answer cross-cutting questions"
      - "Because the number three is arbitrary and superstitious, and no model built on an odd count of components can ever be complete"
      - "Because logs are inherently unreliable and provide no useful diagnostic value once a service is running in production"
      - "Because modern tracing systems have fully replaced metrics, making two of the three pillars redundant and obsolete"
    answer: 0
    explanation: |
      The critique is that three disconnected signal types you cannot join on a
      common dimension (trace_id, service) are three silos, not observability. You
      also lose high-cardinality detail once metrics pre-aggregate. Correlation is
      what makes the pillars sufficient.
    ref: "concepts.md#why-the-three-pillars-are-necessary-but-not-sufficient"

  - id: observability-fundamentals-and-three-pillars-012
    difficulty: advanced
    tags: [three-pillars, metrics, pre-aggregation]
    question: |
      Why can metrics fundamentally not answer a high-cardinality question like
      "which individual user IDs are affected"?
    options:
      - "Because a metric is aggregated at write time, and adding a high-cardinality dimension like user_id as a label would explode the series count"
      - "Because metrics are internally stored as opaque text strings and the storage engine cannot hold or arithmetically combine numeric values"
      - "Because Prometheus proactively strips and deletes any user-identifying data at scrape time to comply with privacy regulations"
      - "Because metric scrapers only collect a single sample once per day, leaving no per-request granularity to break down by user"
    answer: 0
    explanation: |
      Metrics aggregate at write time; once requests collapse into a counter you
      cannot decompose along a dimension you did not add as a label. Adding a
      high-cardinality label creates a separate series per value, causing a
      cardinality explosion, so metrics can't answer per-user questions.
    ref: "concepts.md#why-the-three-pillars-are-necessary-but-not-sufficient"

  - id: observability-fundamentals-and-three-pillars-013
    difficulty: intermediate
    tags: [observability-2.0, wide-events]
    question: |
      What is the core primitive that "observability 2.0" advocates as the single
      source of truth?
    options:
      - "Arbitrarily-wide structured events (one rich event per unit of work) from which metrics, traces, and logs can be derived"
      - "A separate pre-aggregated counter per endpoint, incremented in-process and exported as the definitive record of what happened"
      - "Unstructured plain-text log lines, treated as the canonical narrative that all other signals are reconstructed from"
      - "A nightly CSV export of the application's database rows, batched and archived as the authoritative telemetry store"
    answer: 0
    explanation: |
      Observability 2.0 reframes the ideal primitive as wide structured events: one
      event per unit of work carrying many high-cardinality dimensions. From these
      you can derive metrics (aggregate), traces (shared trace_id), and logs (the
      events themselves).
    ref: "concepts.md#observability-20-wide-structured-events--high-cardinality"

  - id: observability-fundamentals-and-three-pillars-014
    difficulty: beginner
    tags: [observability-2.0, cardinality, definitions]
    question: |
      In observability terms, what does "cardinality" of a field mean?
    options:
      - "The number of bytes the field occupies on disk once its value is serialized and stored"
      - "The number of dashboards and alerting rules that reference the field across the whole observability platform"
      - "The number of distinct values the field can take"
      - "How frequently the field is written or updated per second during peak production traffic"
    answer: 2
    explanation: |
      Cardinality is the count of distinct values a field/label can take. user_id has
      very high cardinality (millions); http_method has low cardinality (a handful).
      Dimensionality is how many different fields you attach.
    ref: "concepts.md#observability-20-wide-structured-events--high-cardinality"

  - id: observability-fundamentals-and-three-pillars-015
    difficulty: intermediate
    tags: [observability-2.0, high-cardinality, unknown-unknowns]
    question: |
      Why are high-cardinality dimensions so valuable for debugging
      unknown-unknowns?
    options:
      - "They reduce backend storage cost effectively to zero because distinct values compress away into a single shared entry"
      - "They make dashboard panels render noticeably faster by shrinking the number of series the query engine must scan"
      - "They let you isolate narrow slices like 'only build_sha=abc123 in region=eu-west-1 is failing' that you never pre-aggregated for"
      - "They are mandated by the W3C Trace Context specification, which requires every span to carry high-cardinality attributes"
    answer: 2
    explanation: |
      High-cardinality fields let you slice telemetry along dimensions you never
      anticipated, isolating novel failure modes (a specific build, region, user
      tier, or shard). That ability to answer arbitrary narrow questions is the
      currency of debugging unknown-unknowns.
    ref: "concepts.md#observability-20-wide-structured-events--high-cardinality"

  - id: observability-fundamentals-and-three-pillars-016
    difficulty: beginner
    tags: [golden-signals, definitions]
    question: |
      What are Google SRE's four golden signals?
    options:
      - "CPU utilization, memory pressure, disk I/O, and network throughput on the serving hosts"
      - "Rate of requests, error percentage, request duration, and dollar cost per transaction"
      - "Latency, traffic, errors, saturation"
      - "Availability, durability, consistency, and partition-tolerance of the underlying datastore"
    answer: 2
    explanation: |
      The four golden signals for a user-facing request-driven service are latency,
      traffic, errors, and saturation. If you can measure only four things about a
      serving system, measure these.
    ref: "concepts.md#the-four-golden-signals"

  - id: observability-fundamentals-and-three-pillars-017
    difficulty: intermediate
    tags: [golden-signals, latency, gotcha]
    question: |
      Why does the golden-signals guidance insist you separate the latency of
      *successful* requests from *failed* ones?
    options:
      - "Because failed requests never have a measurable latency, since they abort before any timer is started on the server"
      - "Because Prometheus histograms are structurally incapable of recording the latency of any request that returns an error status"
      - "Because a flood of fast errors can drag the average latency down and hide problems, while a slow error is a distinct issue from a slow success"
      - "Because successful requests are inherently slower than failed ones, so mixing them always inflates the reported latency figure"
    answer: 2
    explanation: |
      Fast failures (instant 500s) pull the average latency down and can mask a real
      slowdown, while a slow timeout error is a different problem than a slow success.
      Mixing them yields a misleading latency number, so you split by outcome.
    ref: "concepts.md#the-four-golden-signals"

  - id: observability-fundamentals-and-three-pillars-018
    difficulty: intermediate
    tags: [golden-signals, saturation]
    question: |
      Which golden signal is most often the *leading* indicator of imminent trouble?
    options:
      - "Traffic — the raw volume of incoming requests, which always spikes first whenever an incident begins to develop"
      - "Errors — the rate of failed responses, which reliably rises well before any resource on the host approaches its limit"
      - "Saturation — how close the service is to a resource limit"
      - "Latency of failed requests — the time taken by responses that ultimately errored out, the earliest warning sign of trouble"
    answer: 2
    explanation: |
      Saturation measures how "full" the service is relative to a resource limit
      (CPU, memory, connection pool). It often rises before users see errors or
      latency, making it a leading indicator of impending problems.
    ref: "concepts.md#the-four-golden-signals"

  - id: observability-fundamentals-and-three-pillars-019
    difficulty: intermediate
    tags: [golden-signals, percentiles]
    question: |
      A dashboard shows average request latency at 80 ms and everyone assumes the
      service is healthy, yet users complain. What is the most likely oversight?
    options:
      - "The average hides the tail; they should look at percentiles like p99 where latency may be seconds"
      - "An 80 ms mean is impossibly fast, so the latency metric is fabricated and can be ignored"
      - "Averages always exceed every percentile, so p99 sits below 80 ms and the users are mistaken"
      - "A green latency panel proves the error rate is zero, so the user complaints are invalid"
    answer: 0
    explanation: |
      The mean hides the tail of a skewed latency distribution. A service can average
      80 ms while its p99 is several seconds, so a meaningful fraction of users suffer.
      Always inspect the distribution/percentiles, not just the mean.
    ref: "concepts.md#the-four-golden-signals"

  - id: observability-fundamentals-and-three-pillars-020
    difficulty: beginner
    tags: [red-method, definitions]
    question: |
      What do the letters in the RED method stand for?
    options:
      - "Reliability, Efficiency, Durability"
      - "Requests, Endpoints, Dependencies"
      - "Rate, Errors, Duration"
      - "Resources, Events, Dashboards"
    answer: 2
    explanation: |
      RED (Tom Wilkie) stands for Rate (requests/sec), Errors (rate of failed
      requests), and Duration (distribution of latencies) — a uniform,
      request-oriented distillation applied to every service.
    ref: "concepts.md#the-red-method"

  - id: observability-fundamentals-and-three-pillars-021
    difficulty: intermediate
    tags: [red-method, golden-signals, comparison]
    question: |
      How does the RED method relate to the four golden signals?
    options:
      - "RED adds two entirely new signals the four golden signals lack, namely capacity headroom and queue depth per service"
      - "RED is a purely resource-centric method, while the four golden signals are strictly request-centric and never overlap"
      - "RED is essentially the golden signals minus saturation, standardized so every microservice gets the same three dashboards"
      - "They are entirely unrelated methods that measure different systems and were never intended to be compared"
    answer: 2
    explanation: |
      RED maps to the golden signals dropping saturation: Rate=traffic, Errors=errors,
      Duration=latency. Its value is uniformity — every request-driven microservice
      gets the same three signals and identical dashboards.
    ref: "concepts.md#the-red-method"

  - id: observability-fundamentals-and-three-pillars-022
    difficulty: beginner
    tags: [use-method, definitions]
    question: |
      Brendan Gregg's USE method checks which three things for every resource?
    options:
      - "Uptime, Speed, Errors"
      - "Users, Sessions, Events"
      - "Usage, Scalability, Efficiency"
      - "Utilization, Saturation, Errors"
    answer: 3
    explanation: |
      USE stands for Utilization (fraction of time/capacity busy), Saturation (extra
      queued work the resource can't yet service), and Errors (error events), checked
      for each resource such as CPU, memory, disk, or a connection pool.
    ref: "concepts.md#the-use-method"

  - id: observability-fundamentals-and-three-pillars-023
    difficulty: intermediate
    tags: [use-method, red-method, when-to-use]
    question: |
      During an incident, RED metrics show a service is slow. What is the USE method
      best used for next?
    options:
      - "Immediately rewriting the slow service in a faster compiled language, since USE prescribes language migration as its first diagnostic step"
      - "Loosening the SLO target upward so the current slowness fits within budget, which USE recommends as the fastest resolution path"
      - "Paging additional on-call engineers onto the incident bridge, because USE is fundamentally a staffing-escalation procedure"
      - "Walking each resource (CPU, memory, disk, pool) checking utilization/saturation/errors to find the constrained resource causing the slowness"
    answer: 3
    explanation: |
      RED/golden signals report the symptom (users are suffering) from the request
      side; USE is resource-centric and is the fastest way to find the bottleneck by
      checking each resource's utilization, saturation, and errors. Use them together.
    ref: "concepts.md#the-use-method"

  - id: observability-fundamentals-and-three-pillars-024
    difficulty: intermediate
    tags: [use-method, red-method, orientation]
    question: |
      Which pairing correctly describes the *orientation* of these methods?
    options:
      - "RED and golden signals are resource-centric; USE is request-centric"
      - "All three of these methods are uniformly request-centric in orientation"
      - "All three of these methods are uniformly resource-centric in orientation"
      - "RED and golden signals are request/service-centric; USE is resource-centric"
    answer: 3
    explanation: |
      RED and the golden signals are measured from the consumer/request side
      (request/service-centric). USE is measured from the machine side
      (resource-centric). Saturation appears in both, bridging them.
    ref: "concepts.md#the-use-method"

  - id: observability-fundamentals-and-three-pillars-025
    difficulty: beginner
    tags: [white-box-black-box, definitions]
    question: |
      What distinguishes black-box monitoring from white-box monitoring?
    options:
      - "Black-box monitoring is defined by using only metrics, whereas white-box monitoring relies exclusively on log data"
      - "There is no real difference between them; the two labels are interchangeable marketing jargon invented by vendors"
      - "Black-box monitoring applies solely to databases, while white-box monitoring applies solely to stateless web servers"
      - "Black-box tests the system from the outside as a user would, with no knowledge of internals; white-box uses signals exposed from inside the system"
    answer: 3
    explanation: |
      Black-box monitoring probes the system externally like a user (synthetic checks,
      health pings) with no view of internals. White-box uses internal signals
      (metrics, logs, traces the app exposes) for cause-level and predictive
      visibility.
    ref: "concepts.md#white-box-vs-black-box-monitoring"

  - id: observability-fundamentals-and-three-pillars-026
    difficulty: intermediate
    tags: [white-box-black-box, alerting]
    question: |
      Per Google SRE guidance, what should you primarily *alert* on, and what should
      white-box signals mostly be used for?
    options:
      - "Alert on every internal cause the moment it changes, and relegate black-box probes purely to weekly status reporting"
      - "Never configure automated alerts at all; instead rely entirely on end users to phone in and report any outages"
      - "Alert exclusively on host CPU utilization crossing 80%, and disregard every user-facing symptom or SLI-based signal"
      - "Alert primarily on symptoms (black-box / user-facing SLIs); use white-box signals mainly for diagnosis and a few impending-cause alerts"
    answer: 3
    explanation: |
      SRE guidance: page primarily on symptoms (user-facing/black-box SLIs) and use
      white-box internal signals for diagnosis, keeping only a small number of
      impending-cause alerts (e.g. disk full in 4 hours). Paging on every cause
      creates noise.
    ref: "concepts.md#white-box-vs-black-box-monitoring"

  - id: observability-fundamentals-and-three-pillars-027
    difficulty: intermediate
    tags: [white-box-black-box, scenario]
    question: |
      A load balancer is misrouting traffic so users get errors, yet every internal
      application metric looks healthy. Which type of monitoring is most likely to
      catch this?
    options:
      - "White-box metrics emitted from deep inside the application code path"
      - "A CPU saturation gauge sampled continuously across the application hosts"
      - "Manually reading through the application's source code line by line"
      - "Black-box synthetic probes hitting the public endpoint as a real user would"
    answer: 3
    explanation: |
      Black-box probes exercise the real user path end to end, so they catch outages
      invisible to internal metrics — DNS failures, load balancer misroutes, or TLS
      issues that the healthy-looking app never sees.
    ref: "concepts.md#white-box-vs-black-box-monitoring"

  - id: observability-fundamentals-and-three-pillars-028
    difficulty: beginner
    tags: [cardinality, metrics]
    question: |
      In a dimensional metrics system like Prometheus, each unique combination of
      label values produces what?
    options:
      - "A separate log file"
      - "A separate dashboard"
      - "A separate trace"
      - "A separate time series"
    answer: 3
    explanation: |
      In Prometheus/Micrometer, every distinct combination of label values is its own
      time series. Total series count is roughly the product of each label's
      cardinality, which is why high-cardinality labels are dangerous.
    ref: "concepts.md#cardinality--dimensionality"

  - id: observability-fundamentals-and-three-pillars-029
    difficulty: intermediate
    tags: [cardinality, explosion, anti-pattern]
    question: |
      An engineer adds a `user_id` label (1,000,000 possible values) to a metric that
      already has 15,000 series. What is the danger?
    options:
      - "Nothing at all; Prometheus labels are effectively free and add no meaningful storage or memory cost to the index"
      - "Prometheus will transparently shard the user_id label across regional TSDB replicas, keeping total series count flat"
      - "The metric will silently pin itself to only the first user_id it ever observes and ignore all subsequent values"
      - "Series count becomes roughly 15,000 × 1,000,000 = 15 billion, a cardinality explosion that can OOM the metrics server"
    answer: 3
    explanation: |
      Series count is the product of label cardinalities. Multiplying 15,000 by a
      million-value label yields billions of series, exhausting the TSDB's memory and
      index — the classic cardinality explosion. High-cardinality identity belongs in
      traces/logs/events, not metric labels.
    ref: "concepts.md#cardinality--dimensionality"

  - id: observability-fundamentals-and-three-pillars-030
    difficulty: intermediate
    tags: [cardinality, best-practice]
    question: |
      Which field is safe to use as a Prometheus metric label?
    options:
      - "The full raw request URL including its embedded path parameters, such as /orders/849213?ref=promo"
      - "The individual end user's full email address captured from the session token"
      - "A bounded, low-cardinality value such as HTTP method or a normalized route template like /orders/{id}"
      - "A freshly generated per-request UUID attached to every single incoming call"
    answer: 2
    explanation: |
      Metric labels must be low-cardinality and bounded. HTTP method and a normalized
      route template are fine; raw URLs with IDs, emails, and per-request UUIDs are
      unbounded and cause cardinality explosions — put those in traces/logs.
    ref: "concepts.md#cardinality--dimensionality"

  - id: observability-fundamentals-and-three-pillars-031
    difficulty: advanced
    tags: [cardinality, dimensionality, distinction]
    question: |
      What is the distinction between cardinality and dimensionality?
    options:
      - "They are precisely the same thing, and the two words are used completely interchangeably across observability tooling"
      - "Dimensionality is by definition always numerically lower than cardinality for any field in any given telemetry event"
      - "Cardinality is a concept that applies only to log data, whereas dimensionality is a concept that applies only to metrics"
      - "Cardinality is the number of distinct values a single field can take; dimensionality is the number of different fields attached to an event"
    answer: 3
    explanation: |
      Cardinality = distinct values of one field (e.g. user_id has millions).
      Dimensionality = how many fields you attach to each event. More dimensions means
      more questions answerable, but each high-cardinality dimension added to metrics
      multiplies cost.
    ref: "concepts.md#cardinality--dimensionality"

  - id: observability-fundamentals-and-three-pillars-032
    difficulty: beginner
    tags: [sli-slo-sla, definitions]
    question: |
      What is an SLI (Service Level Indicator)?
    options:
      - "An externally signed customer contract that carries financial penalties whenever it is breached"
      - "The maximum number of servers or instances an operator is permitted to deploy for the service"
      - "A predefined color scheme applied to the service's monitoring dashboards and alert panels"
      - "A measured quantitative signal of service behavior, usually a ratio of good events to total events"
    answer: 3
    explanation: |
      An SLI is a measured indicator of service behavior, typically expressed as the
      proportion of good events to total (e.g. fraction of requests served under
      300 ms). The SLO is the target for that SLI; the SLA is the external contract.
    ref: "concepts.md#sli-slo-sla-and-error-budgets"

  - id: observability-fundamentals-and-three-pillars-033
    difficulty: intermediate
    tags: [sli-slo-sla, distinction]
    question: |
      Which statement correctly orders SLI, SLO, and SLA?
    options:
      - "SLA is the measured metric, SLO is the binding external contract, and SLI is the internal target you aim for"
      - "SLO is the raw measured metric, SLI is the financial penalty clause, and SLA is the visualization dashboard"
      - "All three of them are simply external customer contracts that differ only in their names"
      - "SLI is the measured indicator, SLO is the internal target, SLA is the external contract with consequences"
    answer: 3
    explanation: |
      SLI = the measured indicator; SLO = your internal target over a window; SLA =
      the external customer contract that adds penalties (credits/refunds) if missed.
      SLAs are typically looser than SLOs so you breach the SLO first.
    ref: "concepts.md#sli-slo-sla-and-error-budgets"

  - id: observability-fundamentals-and-three-pillars-034
    difficulty: intermediate
    tags: [sli-slo-sla, sla-vs-slo]
    question: |
      Why are external SLAs usually set *looser* than internal SLOs?
    options:
      - "To make the SLA a rounder, simpler figure that non-technical customers can more easily read at a glance"
      - "Because internal SLOs are the legally binding obligations while external SLAs carry no contractual force at all"
      - "Because external SLAs are fundamentally impossible to measure with any accuracy, unlike the quantifiable SLO"
      - "So the team breaches (and gets alerted on) its stricter internal SLO before ever violating the contractual SLA with the customer"
    answer: 3
    explanation: |
      Setting the internal SLO tighter than the external SLA gives a safety margin:
      the team is alerted and can react when the SLO is at risk, long before the
      customer-facing SLA (with its penalties) is actually breached.
    ref: "concepts.md#sli-slo-sla-and-error-budgets"

  - id: observability-fundamentals-and-three-pillars-035
    difficulty: intermediate
    tags: [error-budget, calculation]
    question: |
      A service has an SLO of 99.9% success over 28 days and serves 100,000,000
      requests in that window. What is the error budget in absolute failed requests?
    options:
      - "1,000 requests"
      - "10,000 requests"
      - "100,000 requests"
      - "1,000,000 requests"
    answer: 2
    explanation: |
      Error budget = (1 − SLO) × total = (1 − 0.999) × 100,000,000 = 0.001 ×
      100,000,000 = 100,000 allowed failed requests over the window.
    ref: "concepts.md#sli-slo-sla-and-error-budgets"

  - id: observability-fundamentals-and-three-pillars-036
    difficulty: beginner
    tags: [error-budget, concept]
    question: |
      What is an "error budget"?
    options:
      - "The fixed dollar amount a team allocates each quarter toward fixing production bugs"
      - "The allowed amount of unreliability, equal to 1 minus the SLO, that the team may 'spend'"
      - "The total number of engineers currently staffed on the service's on-call rotation"
      - "The maximum volume of log data the service is permitted to emit per day"
    answer: 1
    explanation: |
      The error budget is the permitted unreliability, 1 − SLO. While budget remains,
      teams can ship features quickly; when it is exhausted, they slow risky changes
      and invest in reliability. It turns reliability into a shared, quantified
      currency.
    ref: "concepts.md#sli-slo-sla-and-error-budgets"

  - id: observability-fundamentals-and-three-pillars-037
    difficulty: intermediate
    tags: [error-budget, reliability-target]
    question: |
      Why does SRE argue that 100% is the wrong reliability target?
    options:
      - "Because national telecom regulations legally forbid ever advertising a service as being 100% available to customers"
      - "Because chasing 100% is effectively infinitely expensive and eliminates the error budget needed to ship features at reasonable velocity"
      - "Because monitoring backends cap their availability gauges at 99.99% and are architecturally unable to represent a full 100%"
      - "Because surveys consistently show customers actively prefer services that fail occasionally over ones that never go down"
    answer: 1
    explanation: |
      Every additional nine costs disproportionately more, and a 100% target leaves no
      error budget, blocking any risky change and killing feature velocity. The budget
      exists precisely to let teams trade reliability for speed deliberately.
    ref: "concepts.md#sli-slo-sla-and-error-budgets"

  - id: observability-fundamentals-and-three-pillars-038
    difficulty: advanced
    tags: [error-budget, availability-math]
    question: |
      Roughly how much fully-down time does a 99.9% availability SLO permit over a
      30-day month?
    options:
      - "About 4.3 minutes"
      - "About 43 minutes"
      - "About 7 hours"
      - "About 3 days"
    answer: 1
    explanation: |
      0.1% of 30 days ≈ 43.2 minutes. (99.99% would allow ~4.3 minutes; 99.9% over 28
      days is ~40 minutes.) This down-time-equivalent framing is a common interview
      calculation.
    ref: "concepts.md#sli-slo-sla-and-error-budgets"

  - id: observability-fundamentals-and-three-pillars-039
    difficulty: intermediate
    tags: [correlation, exemplars]
    question: |
      What is an "exemplar" in the Prometheus/OpenMetrics sense?
    options:
      - "A canonical, perfectly-formatted PromQL query string that the backend stores as the reference example for a given metric name"
      - "A specific trace/request example attached to a metric (e.g. a histogram bucket), carrying a trace_id so you can jump from the metric to a representative trace"
      - "A rolling statistical summary of every trace collected in the last hour, precomputed and attached to the metric for quick review"
      - "A recording rule that precomputes a percentile and materializes it as a new series so dashboards render the quantile faster"
    answer: 1
    explanation: |
      An exemplar annotates a metric sample (such as a histogram bucket) with a
      concrete example — typically a trace_id and value/timestamp — so tools like
      Grafana let you click a latency spike and jump to a representative slow trace.
      It is the concrete metric→trace bridge.
    ref: "concepts.md#telemetry-signal-correlation--exemplars"

  - id: observability-fundamentals-and-three-pillars-040
    difficulty: intermediate
    tags: [correlation, trace-id, logs]
    question: |
      What is the simplest, most common mechanism to correlate a log line with the
      full distributed trace it belongs to?
    options:
      - "Match on the wall-clock timestamp alone, joining any log and span whose emitted times fall within the same millisecond bucket"
      - "Emit the same trace_id (and span_id) into the structured log so you can pivot directly to the trace"
      - "Store every log line and its trace spans together in one shared append-only file per request on local disk"
      - "Render logs and their related traces using the same color code in the dashboard so operators can visually pair them"
    answer: 1
    explanation: |
      Emitting the shared trace_id (and span_id) into structured logs is the standard
      way to correlate: from any log line you can jump straight to the full trace, and
      from a trace you can find its logs. Timestamp-only matching is unreliable.
    ref: "concepts.md#telemetry-signal-correlation--exemplars"

  - id: observability-fundamentals-and-three-pillars-041
    difficulty: advanced
    tags: [correlation, trace-context, w3c]
    question: |
      Consider this header:
      `traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01`
      Which interpretation of its fields is correct?
    options:
      - "version=00, trace-id=4bf9...4736, parent/span-id=00f0...02b7, trace-flags=01 (sampled)"
      - "version=4bf9, trace-id=00, span-id=01, and trace-flags=00f0...02b7 read from the final and longest segment"
      - "It is a Prometheus exposition-format line declaring a counter, where the hex groups encode the metric name and its current value"
      - "trace-flags=01 is the sampling bit meaning this particular request was explicitly dropped and will not be recorded"
    answer: 0
    explanation: |
      The W3C traceparent format is version-traceid-spanid-flags separated by dashes:
      version 00, a 32-hex-digit trace-id, a 16-hex-digit parent/span-id, and 2-hex
      trace-flags where 01 means sampled (00 = not sampled).
    ref: "concepts.md#telemetry-signal-correlation--exemplars"

  - id: observability-fundamentals-and-three-pillars-042
    difficulty: advanced
    tags: [correlation, exemplars, scenario]
    question: |
      A p99 latency histogram spikes on a Grafana panel and its buckets carry
      exemplars. What is the most direct next investigative step?
    options:
      - "Restart the Prometheus server so the scrape buffer flushes and the anomalous p99 bucket is cleared from the panel"
      - "Click the exemplar on the spiking bucket to open a representative slow trace, then follow its trace_id into logs for the root-cause line"
      - "Delete the latency histogram metric and recreate it, forcing the backend to recompute the buckets from clean data"
      - "Raise the latency SLO target upward so the observed p99 spike now falls comfortably within the allotted error budget"
    answer: 1
    explanation: |
      Exemplars link the aggregate metric to a concrete trace. Clicking the exemplar
      opens a representative slow trace (localizing the slow span), and the trace_id
      in structured logs surfaces the exact error line — the metric→trace→log pivot.
    ref: "concepts.md#telemetry-signal-correlation--exemplars"

  - id: observability-fundamentals-and-three-pillars-043
    difficulty: intermediate
    tags: [alert-quality, symptom-vs-cause]
    question: |
      Which alert best follows the "alert on symptoms, not causes" principle?
    options:
      - "Page when a single host's CPU exceeds 90% for one minute"
      - "Page when checkout error rate breaches its SLO (user-visible pain)"
      - "Page whenever any log line contains the word 'warning'"
      - "Page every time a JVM performs a routine minor garbage collection pause"
    answer: 1
    explanation: |
      Symptom-based alerts fire on user-visible pain (SLO breach, high p99) and capture
      causes you never enumerated. CPU spikes, warning logs, and normal GC are causes
      or noise that may not indicate any user impact, so they make poor pages.
    ref: "concepts.md#alert-quality-symptom-vs-cause-and-actionable-signals"

  - id: observability-fundamentals-and-three-pillars-044
    difficulty: intermediate
    tags: [alert-quality, actionable, alert-fatigue]
    question: |
      What is the defining property that should distinguish something worth *paging*
      a human about from something that should be a dashboard or ticket?
    options:
      - "Whether the underlying metric crossed any configured threshold at all, regardless of whether the crossing implies user impact"
      - "Whether a human can and should take meaningful action in response — i.e. it is actionable"
      - "Whether the condition happened during overnight hours, since events at night are automatically escalated to a page"
      - "Whether the breaching value happens to be a round number, which the alerting engine treats as a higher-severity signal"
    answer: 1
    explanation: |
      An alert should page only if a human needs to act and can. Non-actionable pages
      are the root of alert fatigue: responders learn to ignore alerts, including the
      one that matters. Non-actionable signals belong on dashboards or as tickets.
    ref: "concepts.md#alert-quality-symptom-vs-cause-and-actionable-signals"

  - id: observability-fundamentals-and-three-pillars-045
    difficulty: intermediate
    tags: [alert-quality, alert-fatigue, scenario]
    question: |
      An on-call engineer starts ignoring pages because most fire on transient CPU
      blips and self-resolve. What is this phenomenon, and what is a sound fix?
    options:
      - "It is normal and expected on-call behavior; keep the transient CPU alerts firing exactly as-is and take no corrective action"
      - "Alert fatigue; move non-actionable cause-based alerts to dashboards and page on sustained, symptom/SLO-based conditions instead"
      - "A recurring hardware fault on the serving hosts; the fix is to replace the physical CPUs on the affected fleet nodes"
      - "A defect in the Prometheus alerting engine; the fix is to migrate the whole pipeline onto a different time-series database"
    answer: 1
    explanation: |
      Noisy, non-actionable pages cause alert fatigue, where responders ignore alerts
      and miss real incidents. The fix is signal quality: demote cause/transient alerts
      to dashboards and page on sustained symptom/SLO conditions (e.g. burn-rate).
    ref: "concepts.md#alert-quality-symptom-vs-cause-and-actionable-signals"

  - id: observability-fundamentals-and-three-pillars-046
    difficulty: beginner
    tags: [three-pillars, logs, structured]
    question: |
      Compared with unstructured free-text logs, what is the key advantage of
      structured (JSON/key-value) logs?
    options:
      - "They occupy strictly less disk space in every case, because JSON field names compress more tightly than plain prose text"
      - "They are queryable and can be filtered/aggregated on their fields, and can carry a trace_id for correlation"
      - "They are automatically converted into distributed traces by the log backend without any additional instrumentation"
      - "They are exempt from sampling entirely, so a structured-logging pipeline can always retain every line at full production volume"
    answer: 1
    explanation: |
      Structured logs expose named fields, so they can be filtered and aggregated and
      can carry identifiers like trace_id for correlation. Free-text logs are hard to
      query or join. Structure, not size, is the main advantage.
    ref: "concepts.md#the-three-pillars-metrics-logs-and-traces"

  - id: observability-fundamentals-and-three-pillars-047
    difficulty: advanced
    tags: [observability-2.0, derive-signals]
    question: |
      In the wide-event model, how are traditional metrics obtained?
    options:
      - "They are collected by a completely separate in-process agent that never reads the wide events and scrapes counters independently"
      - "They are derived by aggregating the wide events after the fact, rather than pre-aggregated and emitted separately"
      - "They cannot be produced from wide events at all, so a parallel metrics pipeline must always be emitted alongside the events"
      - "They are computed exclusively inside the storage engine at query time and can never be exported to an external dashboard"
    answer: 1
    explanation: |
      In observability 2.0, wide events are the single source of truth; metrics are
      derived by aggregating those events, traces come from the shared trace_id, and
      logs are the events themselves. This avoids emitting three lossy, disconnected
      signals.
    ref: "concepts.md#observability-20-wide-structured-events--high-cardinality"

  - id: observability-fundamentals-and-three-pillars-048
    difficulty: advanced
    tags: [monitoring-vs-observability, unknown-unknowns, scenario]
    question: |
      A novel bug only affects requests from Android clients on API v3 hitting shard 7
      during cache warmup — a combination nobody anticipated. Which capability is
      required to diagnose it from existing telemetry?
    options:
      - "A single pre-aggregated error counter that sums all failures into one series with no per-client, version, or shard breakdown"
      - "Observability: rich, high-cardinality telemetry you can slice along dimensions (client, api_version, shard, phase) you never pre-planned to isolate the failing combination"
      - "A louder, more distinctive alert sound on the pager so the on-call engineer notices the incident faster and reacts sooner"
      - "A faster CPU on the monitoring server so aggregate queries over the existing low-cardinality metrics return more quickly"
    answer: 1
    explanation: |
      This is a textbook unknown-unknown. Only high-cardinality, high-dimensionality
      telemetry that you can slice arbitrarily lets you isolate the specific
      client/version/shard/phase combination after the fact — the essence of
      observability versus predefined monitoring.
    ref: "concepts.md#monitoring-vs-observability"
