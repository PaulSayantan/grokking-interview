topic: "Dashboards & Visualization with Grafana"
domain: observability
topic_slug: dashboards-and-visualization-with-grafana
version: 1
questions:
  - id: dashboards-and-visualization-with-grafana-001
    difficulty: beginner
    tags: [grafana, architecture, data-sources]
    question: |
      Where does Grafana store the time-series metric data it displays on dashboards?
    options:
      - "It does not store metrics; it queries external data sources and renders the results"
      - "In Grafana's own embedded time-series database"
      - "In the dashboard JSON file alongside the panel definitions"
      - "In the browser's local storage on each render"
    answer: 0
    explanation: |
      Grafana is a stateless visualization/alerting layer. It does not store telemetry; each
      panel queries a configured data source (Prometheus, Loki, Tempo, SQL, cloud APIs) and
      renders the returned results. Grafana's own database only holds dashboards, users,
      data-source configs, and alert rules.
    ref: "concepts.md#grafana-as-a-multi-source-visualization-layer"

  - id: dashboards-and-visualization-with-grafana-002
    difficulty: beginner
    tags: [grafana, dashboard, json]
    question: |
      In Grafana, a dashboard is fundamentally represented as what?
    options:
      - "A compiled binary plugin"
      - "A PromQL recording rule"
      - "A JSON document describing panels and their queries"
      - "A row in the Prometheus TSDB"
    answer: 2
    explanation: |
      A Grafana dashboard is a JSON model describing its panels, each panel's queries, the
      visualization type, and display options. Because it's just JSON, dashboards can be
      exported, version-controlled, and provisioned as code.
    ref: "concepts.md#grafana-as-a-multi-source-visualization-layer"

  - id: dashboards-and-visualization-with-grafana-003
    difficulty: intermediate
    tags: [grafana, query, performance]
    question: |
      A team complains that a Grafana panel backed by Prometheus is slow to load. Which
      statement best reflects how Grafana executes queries?
    options:
      - "Grafana ingests all raw samples and computes the aggregation itself, so the data source speed is irrelevant"
      - "Grafana pushes the query down to the data source, so a slow PromQL query or heavy scan is slow in Grafana too"
      - "Grafana caches every possible query result forever, so the first load speed does not matter"
      - "Grafana re-scrapes the targets directly, bypassing Prometheus"
    answer: 1
    explanation: |
      Grafana federates over backends and pushes computation down to the data source. It can
      cache results, but it cannot make a slow backend query fast — the heavy lifting is the
      data source's. The fix is usually a better/recorded PromQL query, not Grafana config.
    ref: "concepts.md#grafana-as-a-multi-source-visualization-layer"

  - id: dashboards-and-visualization-with-grafana-004
    difficulty: beginner
    tags: [data-sources, query-languages]
    question: |
      Match the data source to its query language: which pairing is correct?
    options:
      - "Loki uses PromQL"
      - "Prometheus uses TraceQL"
      - "Elasticsearch uses LogQL"
      - "Tempo uses TraceQL"
    answer: 3
    explanation: |
      Tempo (traces) uses TraceQL. Prometheus uses PromQL, Loki uses LogQL, and
      Elasticsearch uses Lucene / the query DSL. Knowing which language goes with which
      backend is basic Grafana data-source literacy.
    ref: "concepts.md#data-sources-prometheus-loki-tempo-and-mixed-sources"

  - id: dashboards-and-visualization-with-grafana-005
    difficulty: intermediate
    tags: [mixed-data-source, panels]
    question: |
      You want a single time-series panel to overlay Prometheus request rate with a business
      KPI stored in PostgreSQL. What lets you do this?
    options:
      - "Configure Prometheus to remote-write into PostgreSQL first"
      - "It is impossible; a panel can only ever use one data source"
      - "Set the panel's data source to `-- Mixed --` so each query can target a different data source"
      - "Use a gauge visualization, which auto-detects multiple sources"
    answer: 2
    explanation: |
      The special `-- Mixed --` data source lets each query within one panel target a
      different backend. Each query runs against its own source; Grafana aligns the returned
      frames on the shared time axis at render time.
    ref: "concepts.md#data-sources-prometheus-loki-tempo-and-mixed-sources"

  - id: dashboards-and-visualization-with-grafana-006
    difficulty: intermediate
    tags: [loki, elasticsearch, indexing]
    question: |
      What is the key design trade-off that makes Loki cheaper than Elasticsearch for logs?
    options:
      - "Loki indexes only labels (metadata), not the full log content, and greps chunks at query time"
      - "Loki compresses logs with a proprietary lossy codec"
      - "Loki stores logs in RAM only, discarding them after an hour"
      - "Loki refuses to store logs larger than 1 KB"
    answer: 0
    explanation: |
      Loki indexes only labels (like Prometheus), keeping the index small and cheap, then
      LogQL greps the compressed chunks at query time. Elasticsearch indexes the full
      content, giving fast arbitrary search at higher storage/compute cost — the opposite
      trade-off.
    ref: "concepts.md#data-sources-prometheus-loki-tempo-and-mixed-sources"

  - id: dashboards-and-visualization-with-grafana-007
    difficulty: intermediate
    tags: [correlation, logs, traces, derived-fields]
    question: |
      How does Grafana typically let you jump from a Loki log line to the corresponding trace?
    options:
      - "By re-running the log query against Tempo automatically"
      - "It cannot; logs and traces are never linkable"
      - "By storing the full trace inside every log line"
      - "Via derived fields that regex-extract a trace ID from the log line and turn it into a link to the trace data source"
    answer: 3
    explanation: |
      Loki's derived fields use a regex to extract a trace ID from a log line and render it
      as a link to a trace data source (e.g. Tempo). This is the logs-to-traces bridge, just
      as exemplars are the metrics-to-traces bridge.
    ref: "concepts.md#data-sources-prometheus-loki-tempo-and-mixed-sources"

  - id: dashboards-and-visualization-with-grafana-008
    difficulty: intermediate
    tags: [data-source-variable, portability]
    question: |
      To make one dashboard JSON portable across dev/staging/prod, each with its own
      Prometheus, the recommended approach is to:
    options:
      - "Hard-code the production data source UID and edit it per environment"
      - "Reference a data-source template variable in panels instead of hard-coding a UID"
      - "Duplicate the dashboard once per environment"
      - "Disable data sources and paste static screenshots"
    answer: 1
    explanation: |
      Referencing a data-source template variable (a dropdown of environments) instead of a
      hard-coded UID lets the same JSON run against dev/staging/prod. This is a key enabler
      for dashboards-as-code and provisioning.
    ref: "concepts.md#template-variables-and-dynamic-dashboards"

  - id: dashboards-and-visualization-with-grafana-009
    difficulty: beginner
    tags: [panels, visualization-types]
    question: |
      A panel that shows one big current value (e.g. current error rate) with a small
      sparkline behind it is best built with which visualization type?
    options:
      - "Stat"
      - "Node graph"
      - "Heatmap"
      - "State timeline"
    answer: 0
    explanation: |
      The Stat visualization shows a single current value (optionally with a sparkline and
      threshold coloring). Heatmaps show distributions, node graphs show service maps, and
      state timelines show discrete states over time.
    ref: "concepts.md#panels-and-visualization-types"

  - id: dashboards-and-visualization-with-grafana-010
    difficulty: intermediate
    tags: [heatmap, latency, distributions]
    question: |
      Why might a senior engineer choose a heatmap of histogram buckets over a p99 line for
      request latency?
    options:
      - "Heatmaps use less storage in Prometheus"
      - "p99 cannot be computed from a histogram"
      - "A heatmap reveals bimodal distributions (e.g. a fast cache path and a slow DB path) that a single percentile line smears away"
      - "Heatmaps automatically page on-call when latency is high"
    answer: 2
    explanation: |
      A heatmap renders the full distribution over time, exposing bimodality (multiple modes,
      like a fast cache path vs a slow DB path) that a single p99 line or an average hides.
      It's a signature answer for understanding latency shape, not just a summary statistic.
    ref: "concepts.md#panels-and-visualization-types"

  - id: dashboards-and-visualization-with-grafana-011
    difficulty: intermediate
    tags: [transformations, panels]
    question: |
      Grafana transformations (join, group-by, reduce, calculate field) run where?
    options:
      - "Inside the data source, replacing the query"
      - "In Grafana, on the frames already fetched from the query — so pushing aggregation into PromQL is usually cheaper"
      - "In the browser only, and never on the Grafana server"
      - "In the Prometheus TSDB compaction step"
    answer: 1
    explanation: |
      Transformations operate on the result frames after the query has run, inside Grafana.
      They're useful for mixed sources and reshaping into tables, but because they don't push
      down, doing aggregation in PromQL is generally cheaper than transforming in Grafana.
    ref: "concepts.md#panels-and-visualization-types"

  - id: dashboards-and-visualization-with-grafana-012
    difficulty: beginner
    tags: [panels, averages, latency]
    question: |
      Why is a single-stat/gauge panel showing average latency considered misleading?
    options:
      - "Averages are computationally expensive to calculate"
      - "Averages require a heatmap to render"
      - "Grafana cannot display averages correctly"
      - "Averages hide tail latency and bimodality, so a healthy-looking average can mask a bad p99"
    answer: 3
    explanation: |
      An average smears out the distribution: a low mean can hide a terrible tail (p99) and
      bimodal behavior. Prefer percentiles (histogram_quantile) or a heatmap of the full
      distribution for latency.
    ref: "concepts.md#panels-and-visualization-types"

  - id: dashboards-and-visualization-with-grafana-013
    difficulty: beginner
    tags: [template-variables, dashboards]
    question: |
      What is the primary purpose of template variables in a Grafana dashboard?
    options:
      - "To encrypt the dashboard JSON"
      - "To compress query results"
      - "To parameterize a dashboard (e.g. a `$service` dropdown) so one dashboard serves many services/environments"
      - "To schedule automatic dashboard emails"
    answer: 2
    explanation: |
      Template variables render as dropdowns whose values are interpolated into queries,
      titles, and links. They turn a static dashboard into a reusable, dynamic one — one
      dashboard for 200 services instead of 200 copies.
    ref: "concepts.md#template-variables-and-dynamic-dashboards"

  - id: dashboards-and-visualization-with-grafana-014
    difficulty: intermediate
    tags: [template-variables, prometheus, label-values]
    question: |
      Which query would you use for a Grafana "Query" variable to populate a `$service`
      dropdown with every service currently emitting `http_requests_total`?
    options:
      - "label_values(http_requests_total, service)"
      - "rate(http_requests_total[5m])"
      - "histogram_quantile(0.99, http_requests_total)"
      - "up == 0"
    answer: 0
    explanation: |
      `label_values(http_requests_total, service)` returns the distinct values of the
      `service` label present on that metric, so the dropdown updates automatically as your
      fleet changes. That dynamic behavior is what makes the dashboard reusable.
    ref: "concepts.md#template-variables-and-dynamic-dashboards"

  - id: dashboards-and-visualization-with-grafana-015
    difficulty: intermediate
    tags: [template-variables, multi-value, promql]
    question: |
      When a multi-value template variable `$service` is used in PromQL, how is it typically
      interpolated into a selector?
    options:
      - "As an exact match: `service=\"$service\"`"
      - "It cannot be used in PromQL at all"
      - "As a numeric range: `service>$service`"
      - "As a regex match: `service=~\"$service\"` (multiple values become an alternation)"
    answer: 3
    explanation: |
      Multi-value variables interpolate into a regex, so you use the `=~` operator:
      `service=~"$service"`. Grafana formats the selected values as an alternation
      (`a|b|c`) that the regex matches.
    ref: "concepts.md#template-variables-and-dynamic-dashboards"

  - id: dashboards-and-visualization-with-grafana-016
    difficulty: advanced
    tags: [rate-interval, promql, zoom]
    question: |
      Why is `$__rate_interval` preferred over a hard-coded `[5m]` in a Grafana `rate()`
      query?
    options:
      - "It is shorter to type"
      - "It auto-sizes the rate window to at least 4x the scrape interval, avoiding gaps/NaN as you zoom"
      - "It disables downsampling in Prometheus"
      - "It forces Prometheus to use irate() instead of rate()"
    answer: 1
    explanation: |
      `$__rate_interval` is a Grafana-computed window guaranteed to be at least ~4x the
      scrape interval, so `rate()`/`irate()` always has enough samples and won't return gaps
      or NaN when you zoom in. It's the recommended choice for rate queries in Grafana.
    ref: "concepts.md#template-variables-and-dynamic-dashboards"

  - id: dashboards-and-visualization-with-grafana-017
    difficulty: advanced
    tags: [template-variables, chaining]
    question: |
      A variable query is `label_values(up{cluster="$cluster"}, instance)`. What behavior does
      this create?
    options:
      - "A chained (dependent) variable: selecting a cluster narrows the instance dropdown to that cluster"
      - "A constant variable that never changes"
      - "An ad-hoc filter applied to every panel automatically"
      - "A syntax error, because variables cannot reference other variables"
    answer: 0
    explanation: |
      A variable query can reference another variable, creating a chained/dependent
      relationship: picking `$cluster` filters the `up` series so the `instance` dropdown
      only lists instances in that cluster. This is a common dynamic-dashboard pattern.
    ref: "concepts.md#template-variables-and-dynamic-dashboards"

  - id: dashboards-and-visualization-with-grafana-018
    difficulty: beginner
    tags: [red-method, patterns]
    question: |
      The RED method prescribes which three metrics for a request-driven service?
    options:
      - "Reliability, Efficiency, Durability"
      - "Requests, Endpoints, Dependencies"
      - "Rate, Errors, Duration"
      - "Retries, Errors, Deadlocks"
    answer: 2
    explanation: |
      RED (Tom Wilkie) = Rate (requests/sec), Errors (failed requests/sec or ratio), and
      Duration (latency distribution). It's the default "is this service healthy?" pattern
      and is the request-facing subset of the four golden signals.
    ref: "concepts.md#the-red-and-use-dashboard-patterns"

  - id: dashboards-and-visualization-with-grafana-019
    difficulty: beginner
    tags: [use-method, patterns]
    question: |
      Brendan Gregg's USE method, aimed at resources, stands for:
    options:
      - "Uptime, Speed, Errors"
      - "Utilization, Saturation, Errors"
      - "Usage, Scaling, Efficiency"
      - "Users, Sessions, Events"
    answer: 1
    explanation: |
      USE = Utilization (% busy), Saturation (queued/extra work it couldn't service), and
      Errors (error events like drops or failed allocations). It's aimed at finding resource
      bottlenecks, complementing RED's user-facing symptom view.
    ref: "concepts.md#the-red-and-use-dashboard-patterns"

  - id: dashboards-and-visualization-with-grafana-020
    difficulty: intermediate
    tags: [red, use, golden-signals]
    question: |
      How do RED and USE relate on a mature dashboard?
    options:
      - "They are mutually exclusive; you pick only one"
      - "Both only apply to databases"
      - "USE replaces RED once you adopt SLOs"
      - "RED (request/symptom view) at the top, USE (resource/cause view) below, so you drill from symptoms to bottlenecks"
    answer: 3
    explanation: |
      RED shows user-facing symptoms (services); USE finds the bottleneck (resources). A
      mature setup puts RED/SLIs at the top and USE below so responders drill from "users see
      slow requests" to "the connection pool is saturated." Both overlap the four golden
      signals.
    ref: "concepts.md#the-red-and-use-dashboard-patterns"

  - id: dashboards-and-visualization-with-grafana-021
    difficulty: intermediate
    tags: [red, promql, error-rate]
    question: |
      Given this PromQL for the "E" in a RED dashboard, what does it compute?
      `sum(rate(http_requests_total{code=~"5.."}[$__rate_interval])) / sum(rate(http_requests_total[$__rate_interval]))`
    options:
      - "The absolute count of 5xx responses ever recorded"
      - "The p99 latency of failed requests"
      - "The ratio of 5xx request rate to total request rate — i.e. the error ratio"
      - "The number of distinct error codes"
    answer: 2
    explanation: |
      It divides the rate of 5xx responses by the total request rate, yielding the error
      *ratio* (fraction of requests failing). Ratios, not raw counts, are the actionable
      error signal for RED and for SLO-based alerting.
    ref: "concepts.md#the-red-and-use-dashboard-patterns"

  - id: dashboards-and-visualization-with-grafana-022
    difficulty: intermediate
    tags: [red, promql, histogram-quantile]
    question: |
      To render the p99 duration for a RED dashboard from a Prometheus histogram, which
      expression is correct?
    options:
      - "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[$__rate_interval])))"
      - "avg(http_request_duration_seconds_sum) / avg(http_request_duration_seconds_count)"
      - "rate(http_request_duration_seconds_count[$__rate_interval])"
      - "topk(99, http_request_duration_seconds_bucket)"
    answer: 0
    explanation: |
      `histogram_quantile(0.99, ...)` over the per-`le` bucket rates estimates the 99th
      percentile. You must preserve the `le` label (aggregate `sum by (le)`) and feed
      per-second bucket rates. The first option computes an average, not a percentile.
    ref: "concepts.md#the-red-and-use-dashboard-patterns"

  - id: dashboards-and-visualization-with-grafana-023
    difficulty: beginner
    tags: [dashboard-design, layout]
    question: |
      A core dashboard-design principle for on-call readability is:
    options:
      - "Put the least important metrics at the top so they're seen first"
      - "Show every metric the service emits, sorted alphabetically"
      - "Randomize panel order to encourage exploration"
      - "Place the most important signals (SLIs/symptoms) at the top so health is visible without scrolling"
    answer: 3
    explanation: |
      Most-important-at-top: lead with SLIs/symptoms (RED) so an on-call engineer sees
      "healthy or not?" in the first screen. Causal/deep-dive detail (USE, per-endpoint) goes
      below or on linked drill-downs.
    ref: "concepts.md#dashboard-design-principles"

  - id: dashboards-and-visualization-with-grafana-024
    difficulty: intermediate
    tags: [dashboard-design, time-range]
    question: |
      Why does keeping a consistent time range across all panels matter on a dashboard?
    options:
      - "It reduces the Grafana JSON file size"
      - "So a spike at a given moment lines up across every panel, preserving correlation during investigation"
      - "It is required for template variables to work"
      - "It doubles the query cache hit rate"
    answer: 1
    explanation: |
      All panels sharing the dashboard time picker means an event at 14:32 appears at the
      same x-position everywhere, so you can visually correlate cause and effect. Panels with
      hard-coded ranges break that alignment.
    ref: "concepts.md#dashboard-design-principles"

  - id: dashboards-and-visualization-with-grafana-025
    difficulty: intermediate
    tags: [dashboard-design, drill-down, data-links]
    question: |
      What turns a dashboard from a static picture into an investigation tool?
    options:
      - "Data links / dashboard links that let you click a spike and jump to a filtered detail dashboard, logs, or a trace"
      - "Increasing the refresh rate to 1 second"
      - "Using only gauge panels"
      - "Disabling template variables"
    answer: 0
    explanation: |
      Data links and dashboard links create drill-down paths: click a spike to jump to a
      filtered detail dashboard, to Loki logs, or to a trace (via exemplars). This lets an
      operator go symptom to cause in a couple of clicks.
    ref: "concepts.md#dashboard-design-principles"

  - id: dashboards-and-visualization-with-grafana-026
    difficulty: beginner
    tags: [dashboard-design, clutter]
    question: |
      During a real incident, why is a dashboard with 60 ungrouped panels often worse than
      one with 6 well-chosen panels?
    options:
      - "60 panels always crash the browser"
      - "Grafana limits dashboards to 10 panels"
      - "Under stress nobody scrolls through 60 graphs; responders need a clear symptom-to-cause path, so more graphs is not more observable"
      - "60 panels cost more to store in Prometheus"
    answer: 2
    explanation: |
      Glanceability matters most under stress. A wall of panels with no hierarchy buries the
      signal. Fewer, well-chosen panels plus grouped/collapsible rows and drill-downs beat
      raw panel count. "More graphs" is not "more observable."
    ref: "concepts.md#dashboard-design-principles"

  - id: dashboards-and-visualization-with-grafana-027
    difficulty: beginner
    tags: [annotations, events]
    question: |
      What are Grafana annotations?
    options:
      - "Comments embedded in the PromQL query text"
      - "Time-stamped event markers overlaid on graphs (e.g. a vertical line marking a deploy)"
      - "A type of alert notification channel"
      - "Encrypted metadata about the dashboard owner"
    answer: 1
    explanation: |
      Annotations are time-stamped markers (lines or regions) drawn on panels to show *when*
      something happened — a deploy, an incident, a config change. They turn "the p99 jumped
      at 14:32" into "it jumped right after the 14:31 deploy."
    ref: "concepts.md#annotations"

  - id: dashboards-and-visualization-with-grafana-028
    difficulty: intermediate
    tags: [annotations, ci-cd, deploy]
    question: |
      A common high-leverage use of annotation queries is to:
    options:
      - "Store the dashboard's backup copy"
      - "Automatically silence all alerts during business hours"
      - "Replace the need for template variables"
      - "Have CI/CD post a 'deploy happened here' marker (via the Grafana API) so regressions can be correlated to the deploy that caused them"
    answer: 3
    explanation: |
      Posting deploy annotations from CI/CD (or querying a Loki/SQL deploy-events source)
      overlays each deploy on your latency/error graphs. Correlating a regression to the
      exact deploy is the most common real-world annotation use and speeds up root-cause.
    ref: "concepts.md#annotations"

  - id: dashboards-and-visualization-with-grafana-029
    difficulty: intermediate
    tags: [annotations, region]
    question: |
      What is a region annotation?
    options:
      - "An annotation that only appears in a specific AWS region"
      - "An annotation restricted to a single panel"
      - "A start+end pair that marks a time *window* (e.g. a maintenance window or incident duration)"
      - "A geographic map overlay"
    answer: 2
    explanation: |
      A region annotation has a start and end timestamp, marking a duration (maintenance
      window, incident span) as a shaded region rather than a single vertical line. Regular
      annotations mark a single instant.
    ref: "concepts.md#annotations"

  - id: dashboards-and-visualization-with-grafana-030
    difficulty: beginner
    tags: [exemplars, metrics, traces]
    question: |
      What problem do exemplars primarily solve?
    options:
      - "Metrics tell you *that* something is slow but not *which* request — an exemplar attaches a trace ID so you can open the exact representative trace"
      - "Reducing Prometheus storage costs"
      - "Encrypting trace data in transit"
      - "Generating dashboards automatically from metrics"
    answer: 0
    explanation: |
      Exemplars bridge metrics to traces. A metric sample (typically a histogram observation)
      carries a trace ID for a representative request. In Grafana you click the exemplar
      marker to jump straight to that trace — no guessing which request was slow.
    ref: "concepts.md#exemplars-jumping-from-a-metric-to-a-trace"

  - id: dashboards-and-visualization-with-grafana-031
    difficulty: intermediate
    tags: [exemplars, openmetrics, exposition]
    question: |
      In the OpenMetrics exposition format, how is an exemplar attached to a sample line?
    options:
      - "As a separate metric with a `_exemplar` suffix"
      - "Inside a JSON blob in the metric HELP text"
      - "As an HTTP header on the /metrics response"
      - "As a trailing `# {trace_id=\"...\"} value timestamp` after the sample value"
    answer: 3
    explanation: |
      OpenMetrics appends the exemplar after the sample using a `#` followed by labels (like
      `trace_id`), a value, and an optional timestamp, e.g.
      `..._bucket{le="0.5"} 3 # {trace_id="a1b2"} 0.42 1690000000`. This is how the trace ID
      rides along with the metric.
    ref: "concepts.md#exemplars-jumping-from-a-metric-to-a-trace"

  - id: dashboards-and-visualization-with-grafana-032
    difficulty: advanced
    tags: [exemplars, prometheus, storage]
    question: |
      Which statement about how Prometheus stores exemplars is correct?
    options:
      - "Exemplars are stored for every sample indefinitely alongside the TSDB blocks"
      - "Exemplars live in a separate, fixed-size in-memory circular buffer that must be enabled; they are a capped sampling of examples, not full history"
      - "Exemplars are stored only in Grafana, never in Prometheus"
      - "Prometheus rejects exemplars unless remote-write is disabled"
    answer: 1
    explanation: |
      Prometheus keeps exemplars in a dedicated, size-limited in-memory circular storage that
      you must enable. It's intentionally small — a rolling sample of representative examples,
      not long-term history — so exemplars are pointers to *examples*, not a full
      metrics-to-traces join.
    ref: "concepts.md#exemplars-jumping-from-a-metric-to-a-trace"

  - id: dashboards-and-visualization-with-grafana-033
    difficulty: intermediate
    tags: [exemplars, data-source]
    question: |
      In Grafana, exemplar support (overlaid diamonds/stars linking to a trace) is available
      for which data source?
    options:
      - "The Prometheus data source"
      - "The Elasticsearch data source"
      - "The SQL data source"
      - "The CloudWatch data source"
    answer: 0
    explanation: |
      Grafana surfaces exemplars via the Prometheus data source (using the query_exemplars
      API), rendering them as markers you click to open the linked trace in a trace data
      source such as Tempo.
    ref: "concepts.md#exemplars-jumping-from-a-metric-to-a-trace"

  - id: dashboards-and-visualization-with-grafana-034
    difficulty: intermediate
    tags: [unified-alerting, contact-points]
    question: |
      In Grafana Unified Alerting, a "contact point" defines:
    options:
      - "The query and condition that decides if an alert fires"
      - "Which dashboard the alert is pinned to"
      - "Where a notification is sent (email, Slack, PagerDuty, webhook, etc.)"
      - "The retention period for alert history"
    answer: 2
    explanation: |
      A contact point is the notification destination (Slack, email, PagerDuty, webhook…),
      replacing legacy "notification channels." The rule decides *whether* to alert; the
      notification policy routes to the right contact point.
    ref: "concepts.md#grafana-unified-alerting-vs-alertmanager"

  - id: dashboards-and-visualization-with-grafana-035
    difficulty: intermediate
    tags: [unified-alerting, notification-policies, alertmanager]
    question: |
      Grafana's notification policies (a routing tree that matches alert labels to contact
      points, with grouping and timing) are handled by what?
    options:
      - "A cron job in the Grafana database"
      - "An embedded Alertmanager ('Grafana Alertmanager') that mirrors Alertmanager's route/grouping/silence model"
      - "The Prometheus scrape loop"
      - "The browser at render time"
    answer: 1
    explanation: |
      Grafana embeds an Alertmanager to handle notification for Grafana-managed alerts. The
      notification-policy tree is essentially Alertmanager's `route` + grouping + inhibition +
      silence model exposed through Grafana's UI.
    ref: "concepts.md#grafana-unified-alerting-vs-alertmanager"

  - id: dashboards-and-visualization-with-grafana-036
    difficulty: advanced
    tags: [grafana-managed, data-source-managed, alerting]
    question: |
      What is the key advantage of a Grafana-managed alert rule over a data-source-managed
      (Prometheus/Mimir ruler) rule?
    options:
      - "It evaluates faster because it runs inside Prometheus"
      - "It automatically has zero false positives"
      - "It does not require a contact point"
      - "It is evaluated by Grafana and can query and even mix ANY data source (metrics, Loki logs, SQL) — not just Prometheus-model metrics"
    answer: 3
    explanation: |
      Grafana-managed rules are evaluated by Grafana itself, so they can alert on any data
      source and mix them via expressions (e.g. alert on Loki log volume or a SQL result).
      Data-source-managed rules are limited to what the ruler (Prometheus-model) supports.
    ref: "concepts.md#grafana-unified-alerting-vs-alertmanager"

  - id: dashboards-and-visualization-with-grafana-037
    difficulty: intermediate
    tags: [legacy-alerting, deprecated]
    question: |
      A candidate proposes attaching an alert directly to a single dashboard panel (legacy
      "dashboard alerts"). What is the issue?
    options:
      - "Nothing; that is the current recommended approach"
      - "Panels cannot contain queries"
      - "Legacy per-panel dashboard alerts are deprecated; Unified Alerting decouples rules from panels and supports multi-series rules and a routing tree"
      - "It requires an external Alertmanager to work at all"
    answer: 2
    explanation: |
      Legacy dashboard alerts (one alert tied to one panel) are deprecated. Unified Alerting
      (default since Grafana 9) decouples rules from panels, evaluates multi-dimensional rules
      (one alert per series), and adds notification-policy routing.
    ref: "concepts.md#grafana-unified-alerting-vs-alertmanager"

  - id: dashboards-and-visualization-with-grafana-038
    difficulty: advanced
    tags: [alerting, multi-dimensional, for]
    question: |
      A Grafana alert rule's query returns 5 series (one per instance), each breaching the
      threshold, and the rule has `for: 5m`. What happens?
    options:
      - "The rule produces up to 5 alert instances (one per series), each entering 'pending' and firing only after breaching continuously for 5 minutes"
      - "One alert fires immediately covering all 5 instances"
      - "No alerts fire because multi-series rules are unsupported"
      - "The rule fires 5 minutes early to be safe"
    answer: 0
    explanation: |
      Unified Alerting rules are multi-dimensional: one alert instance per returned series.
      The `for` duration is a pending period — each instance must breach continuously for 5m
      before transitioning from pending to firing, which suppresses flapping.
    ref: "concepts.md#grafana-unified-alerting-vs-alertmanager"

  - id: dashboards-and-visualization-with-grafana-039
    difficulty: advanced
    tags: [external-alertmanager, routing]
    question: |
      A team already runs a central Prometheus Alertmanager and wants Grafana-managed alert
      notifications routed through it instead of Grafana's built-in one. Is this possible?
    options:
      - "No; Grafana can only ever use its embedded Alertmanager"
      - "Only by rewriting every rule as a Prometheus recording rule"
      - "Only if Grafana alerting is disabled entirely"
      - "Yes; Grafana can be pointed at an external Alertmanager to handle its rules' notifications"
    answer: 3
    explanation: |
      Grafana can send its alerts to an external Alertmanager instead of (or alongside) the
      embedded one, so teams with a central Alertmanager keep unified routing, grouping, and
      silencing there.
    ref: "concepts.md#grafana-unified-alerting-vs-alertmanager"

  - id: dashboards-and-visualization-with-grafana-040
    difficulty: beginner
    tags: [vanity-metrics, actionable]
    question: |
      Which of these is a classic "vanity metric" for an on-call dashboard?
    options:
      - "Current error ratio vs the SLO threshold"
      - "Total lifetime requests served since launch (a big, ever-increasing number)"
      - "p99 latency vs the latency SLO"
      - "Connection-pool saturation vs capacity"
    answer: 1
    explanation: |
      A lifetime request total is monotonic, impressive-looking, and non-actionable — nobody
      pages on it and it maps to no user outcome. The others tie to user experience/SLOs and
      would drive a decision.
    ref: "concepts.md#vanity-metrics-and-the-good-on-call-dashboard"

  - id: dashboards-and-visualization-with-grafana-041
    difficulty: intermediate
    tags: [vanity-metrics, actionable]
    question: |
      Which is the best test for whether a panel belongs on an on-call dashboard?
    options:
      - "Would the value it shows change a decision or action during an incident? If not, it's clutter"
      - "Does it use the most colorful visualization?"
      - "Does the number only ever increase?"
      - "Is it computed from the largest number of series?"
    answer: 0
    explanation: |
      Actionability is the test: every on-call panel should map to a decision. If a panel
      wouldn't change what you do during an incident, it's clutter and belongs on a
      deep-dive/drill-down dashboard, not the primary on-call view.
    ref: "concepts.md#vanity-metrics-and-the-good-on-call-dashboard"

  - id: dashboards-and-visualization-with-grafana-042
    difficulty: intermediate
    tags: [on-call, symptom, slo]
    question: |
      Why should an on-call dashboard show latency/errors against an SLO threshold rather
      than in a vacuum?
    options:
      - "SLOs make Grafana render faster"
      - "SLO lines are required for template variables"
      - "A raw number like 'p99 = 300 ms' is meaningless without context — it's fine or terrible depending on the SLO, so showing it against the threshold makes it actionable"
      - "It reduces cardinality in Prometheus"
    answer: 2
    explanation: |
      Whether 300 ms p99 is good or bad depends entirely on the SLO. Plotting the SLI against
      its threshold turns a bare number into an actionable "are we in breach?" signal and
      aligns the dashboard with the alerts.
    ref: "concepts.md#vanity-metrics-and-the-good-on-call-dashboard"

  - id: dashboards-and-visualization-with-grafana-043
    difficulty: intermediate
    tags: [on-call, symptom-vs-cause, sre]
    question: |
      Following Google SRE guidance, the top of an on-call dashboard should be oriented
      around:
    options:
      - "Causes (CPU, GC pauses, disk I/O) so you fix the root immediately"
      - "Symptoms / SLIs (are users hurting?), with causal detail below, mirroring 'alert on symptoms, not causes'"
      - "Vanity totals to reassure stakeholders"
      - "Whichever metrics have the prettiest graphs"
    answer: 1
    explanation: |
      SRE practice leads with symptoms (user-facing SLIs / RED) because that's what actually
      matters to users and what you alert on. Causal/resource detail (USE) sits below to
      support diagnosis. The dashboard should reflect the same signal the alert fired on.
    ref: "concepts.md#vanity-metrics-and-the-good-on-call-dashboard"

  - id: dashboards-and-visualization-with-grafana-044
    difficulty: advanced
    tags: [dashboards-as-code, provisioning]
    question: |
      What is the main benefit of managing Grafana dashboards as code (exported JSON
      provisioned via files or Terraform)?
    options:
      - "Dashboards render without a data source"
      - "It disables template variables for safety"
      - "It stores metrics locally so Prometheus is unnecessary"
      - "Version control, review, and no click-ops configuration drift across environments"
    answer: 3
    explanation: |
      Dashboards-as-code means the JSON model lives in git: changes are reviewed, versioned,
      and provisioned reproducibly across environments, eliminating the drift and lost history
      of hand-edited (click-ops) dashboards.
    ref: "concepts.md#grafana-as-a-multi-source-visualization-layer"

  - id: dashboards-and-visualization-with-grafana-045
    difficulty: intermediate
    tags: [single-pane-of-glass, correlation]
    question: |
      What does Grafana's "single pane of glass" strength concretely enable during an
      incident?
    options:
      - "Storing metrics, logs, and traces in one database"
      - "Automatically writing the postmortem"
      - "Correlating a latency spike (Prometheus), the error logs during it (Loki), and the slow trace (Tempo) on one dashboard without switching tools"
      - "Eliminating the need for any data source"
    answer: 2
    explanation: |
      Because Grafana federates over backends, one dashboard can show metrics, logs, and
      traces together, letting responders correlate signals without context-switching across
      tools. It does not store any of that data itself.
    ref: "concepts.md#grafana-as-a-multi-source-visualization-layer"

  - id: dashboards-and-visualization-with-grafana-046
    difficulty: intermediate
    tags: [panels, visualization-types, table]
    question: |
      You want to show a top-N list of endpoints by error count with per-endpoint columns.
      Which visualization fits best?
    options:
      - "Table"
      - "Gauge"
      - "Heatmap"
      - "State timeline"
    answer: 0
    explanation: |
      A Table visualization is right for discrete per-label rows and top-N breakdowns with
      multiple columns. Heatmaps show distributions over time, gauges show a value vs
      thresholds, and state timelines show discrete states.
    ref: "concepts.md#panels-and-visualization-types"

  - id: dashboards-and-visualization-with-grafana-047
    difficulty: advanced
    tags: [ad-hoc-filters, template-variables]
    question: |
      An "Ad hoc filters" template variable differs from a normal query variable in that it:
    options:
      - "Can only hold a single constant value"
      - "Only works with SQL data sources"
      - "Disables all other variables when used"
      - "Injects arbitrary label filters that apply automatically to every query on the dashboard"
    answer: 3
    explanation: |
      An ad-hoc filter variable lets a user add arbitrary key=value label filters that Grafana
      appends to every query on the dashboard automatically — a powerful way to slice a whole
      dashboard by, say, `namespace` without editing each panel.
    ref: "concepts.md#template-variables-and-dynamic-dashboards"

  - id: dashboards-and-visualization-with-grafana-048
    difficulty: intermediate
    tags: [thresholds, panels, design]
    question: |
      What is the purpose of setting thresholds (green/amber/red bands) on a panel?
    options:
      - "To reduce the query load on Prometheus"
      - "To encode 'is this good or bad?' visually so the eye finds problems without reading exact numbers"
      - "To automatically create alert rules"
      - "To compress the dashboard JSON"
    answer: 1
    explanation: |
      Thresholds color panels/gauges by value bands, giving glanceable good/bad signaling. On
      a stressed on-call read, color-coded status is far faster to parse than raw numbers.
      (Thresholds are display-only; they don't create alerts.)
    ref: "concepts.md#panels-and-visualization-types"
