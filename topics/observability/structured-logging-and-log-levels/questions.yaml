topic: "Structured Logging & Log Levels"
domain: observability
topic_slug: structured-logging-and-log-levels
version: 1
questions:
  - id: structured-logging-and-log-levels-001
    difficulty: beginner
    tags: [structured-logging, json, definition]
    question: |
      What primarily distinguishes structured logging from unstructured
      (free-text) logging?
    options:
      - "Structured logs are always shorter than unstructured logs"
      - "Structured logs emit events as key/value data (e.g. JSON) that is machine-parseable without regex"
      - "Structured logs can only be written to files, not the network"
      - "Structured logging disables log levels"
    answer: 1
    explanation: |
      Structured logging encodes each event as key/value data (typically JSON
      or logfmt) so downstream tools can filter and aggregate on named fields
      directly, instead of applying fragile regex/Grok patterns to prose.
    ref: "concepts.md#unstructured-vs-structured-logging"

  - id: structured-logging-and-log-levels-002
    difficulty: beginner
    tags: [structured-logging, querying]
    question: |
      Why can you reliably run a query like `level="ERROR" AND reason="payment_declined"`
      against structured logs but not easily against unstructured text logs?
    options:
      - "Structured logs expose named fields, whereas text logs require brittle regex parsing to extract values"
      - "Unstructured logs are encrypted"
      - "Unstructured logs cannot contain the word ERROR"
      - "Structured logs are stored only in memory"
    answer: 0
    explanation: |
      Named fields in structured logs are directly queryable and aggregatable.
      Free text forces the backend to guess at fields with regex/Grok, which
      breaks whenever the message string is edited.
    ref: "concepts.md#unstructured-vs-structured-logging"

  - id: structured-logging-and-log-levels-003
    difficulty: intermediate
    tags: [structured-logging, logfmt, json]
    question: |
      A team says "structured logging" but doesn't want the byte overhead of
      JSON. Which statement is accurate?
    options:
      - "Structured logging legally requires JSON"
      - "Only XML qualifies as structured"
      - "logfmt (key=value pairs) is a lighter machine-parseable structured format used by Loki and many Go services"
      - "Without JSON you must fall back to unparseable free text"
    answer: 2
    explanation: |
      Structured doesn't mandate JSON. logfmt (`level=error order_id=8842`) is a
      lighter key/value format that is still machine-parseable; JSON is more
      universal and nests well but costs more bytes.
    ref: "concepts.md#unstructured-vs-structured-logging"

  - id: structured-logging-and-log-levels-004
    difficulty: advanced
    tags: [structured-logging, schema, elasticsearch]
    question: |
      In an Elasticsearch-backed log store, one service emits `user_id` as an
      integer and another emits it as a string. What is the likely problem?
    options:
      - "Nothing — Elasticsearch normalizes all types automatically"
      - "The logs will be alphabetized incorrectly but otherwise fine"
      - "It doubles network bandwidth"
      - "Dynamic mapping type conflicts can cause documents to be rejected or misindexed; keep field types stable"
    answer: 3
    explanation: |
      Inconsistent field types collide with Elasticsearch's dynamic mapping,
      causing rejected or misindexed documents. Treat log fields like a
      lightweight schema — keep names and types stable.
    ref: "concepts.md#unstructured-vs-structured-logging"

  - id: structured-logging-and-log-levels-005
    difficulty: beginner
    tags: [log-levels, severity]
    question: |
      Order these log levels from lowest to highest severity.
    options:
      - "TRACE, DEBUG, INFO, WARN, ERROR"
      - "ERROR, WARN, INFO, DEBUG, TRACE"
      - "INFO, DEBUG, TRACE, WARN, ERROR"
      - "DEBUG, TRACE, INFO, ERROR, WARN"
    answer: 0
    explanation: |
      The conventional severity ordering, lowest to highest, is
      TRACE < DEBUG < INFO < WARN < ERROR (with FATAL above ERROR where it exists).
    ref: "concepts.md#log-levels-trace--debug--info--warn--error"

  - id: structured-logging-and-log-levels-006
    difficulty: beginner
    tags: [log-levels, prod-config]
    question: |
      What is the most common default log level for a service running in
      production?
    options:
      - "INFO"
      - "TRACE"
      - "DEBUG"
      - "OFF"
    answer: 0
    explanation: |
      INFO is the typical prod default: it captures noteworthy business events
      while keeping volume/cost manageable. DEBUG/TRACE are usually enabled only
      temporarily during investigation.
    ref: "concepts.md#log-levels-trace--debug--info--warn--error"

  - id: structured-logging-and-log-levels-007
    difficulty: intermediate
    tags: [log-levels, warn-vs-error]
    question: |
      A payment call failed on the first attempt but a retry succeeded and the
      user's request completed normally. What level best fits a line about the
      first-attempt failure?
    options:
      - "ERROR — any failure is an error"
      - "WARN — it was unexpected but handled/recovered, and the request still succeeded"
      - "FATAL — the process is unstable"
      - "TRACE — retries are never worth logging"
    answer: 1
    explanation: |
      WARN denotes something unexpected but handled/recoverable where the request
      still succeeded. Logging a recovered retry at ERROR would dilute ERROR's
      meaning and make error-based alerting noisy.
    ref: "concepts.md#log-levels-trace--debug--info--warn--error"

  - id: structured-logging-and-log-levels-008
    difficulty: intermediate
    tags: [log-levels, log-and-throw]
    question: |
      Why is the "log-and-throw" pattern (log an exception at ERROR, then rethrow
      it) considered an anti-pattern?
    options:
      - "It makes exceptions run slower"
      - "Rethrowing is illegal in Java"
      - "It converts the exception into a WARN automatically"
      - "It produces duplicate ERROR lines for a single failure as handlers up the stack log it again"
    answer: 3
    explanation: |
      Logging at ERROR and rethrowing lets the same failure be logged again by a
      higher handler, producing duplicate ERROR lines. Log an exception once, at
      the boundary that actually handles it.
    ref: "concepts.md#log-levels-trace--debug--info--warn--error"

  - id: structured-logging-and-log-levels-009
    difficulty: intermediate
    tags: [log-levels, slf4j, portability]
    question: |
      Which statement about FATAL across common Java logging APIs is correct?
    options:
      - "FATAL is a standard level in the SLF4J API and behaves identically everywhere"
      - "FATAL always terminates the JVM immediately"
      - "FATAL is lower severity than WARN"
      - "The SLF4J API has no standard FATAL; Logback tops out at ERROR, while Log4j2 has FATAL which maps to ERROR through SLF4J"
    answer: 3
    explanation: |
      SLF4J's API does not define FATAL; Logback's highest level is ERROR. Log4j2
      (and Log4j 1.x) define FATAL, which SLF4J maps to ERROR. Don't assume FATAL
      is portable. (OpenTelemetry's log data model does define a FATAL range.)
    ref: "concepts.md#log-levels-trace--debug--info--warn--error"

  - id: structured-logging-and-log-levels-010
    difficulty: beginner
    tags: [log-levels, per-logger]
    question: |
      You want verbose DEBUG logs for `com.acme.payments` but keep a chatty
      third-party library at WARN. What capability makes this possible?
    options:
      - "Only a single global log level is ever supported"
      - "Recompiling the library with logging removed"
      - "Switching the whole app to TRACE"
      - "Per-logger (per-package) level configuration"
    answer: 3
    explanation: |
      Logging frameworks support per-logger/per-package levels, so you can raise
      verbosity for the code you're debugging while suppressing a noisy dependency.
    ref: "concepts.md#log-levels-trace--debug--info--warn--error"

  - id: structured-logging-and-log-levels-011
    difficulty: intermediate
    tags: [choosing-level, 4xx]
    question: |
      A client sends a malformed request and your service returns HTTP 400. For
      your service, what level is usually most appropriate?
    options:
      - "ERROR — reserve ERROR only for this"
      - "INFO or WARN — it's the client's bad input, not your service's internal failure"
      - "FATAL — the API contract was violated"
      - "TRACE — 4xx responses should be hidden"
    answer: 1
    explanation: |
      Expected 4xx (bad client input) is not your service's failure, so it's
      typically INFO/WARN. Reserve ERROR for 5xx / internal faults you must fix,
      or ERROR loses its signal for alerting.
    ref: "concepts.md#choosing-log-level-guidelines--anti-patterns"

  - id: structured-logging-and-log-levels-012
    difficulty: intermediate
    tags: [choosing-level, anti-pattern]
    question: |
      Why is "log everything at INFO" a problematic practice?
    options:
      - "INFO logs cannot be written to disk"
      - "INFO is the slowest level to serialize"
      - "Levels then carry no signal, so you can't filter or alert by severity"
      - "INFO logs are automatically deleted after one hour"
    answer: 2
    explanation: |
      If every line is INFO (or every line is ERROR), the level conveys no
      information and you lose the ability to filter, route, and alert by
      severity — the whole point of levels.
    ref: "concepts.md#choosing-log-level-guidelines--anti-patterns"

  - id: structured-logging-and-log-levels-013
    difficulty: advanced
    tags: [choosing-level, alerting, symptom-vs-cause]
    question: |
      Why is alerting solely on raw "ERROR log count" often discouraged in favor
      of SLO/symptom-based alerts?
    options:
      - "ERROR logs are never accurate"
      - "It's noisy and cause-based; symptom-based SLO alerts are more actionable, with logs used for diagnosis"
      - "Counting logs is computationally impossible"
      - "ERROR logs cannot be counted in Prometheus"
    answer: 1
    explanation: |
      Raw ERROR-count alerts tend to be noisy and cause-oriented. Symptom-based
      SLO alerting on user-facing impact is more actionable; logs then serve as
      the diagnostic tool. (See slo-based-alerting-and-error-budgets.)
    ref: "concepts.md#choosing-log-level-guidelines--anti-patterns"

  - id: structured-logging-and-log-levels-014
    difficulty: beginner
    tags: [correlation, trace-id]
    question: |
      What is the primary value of putting a trace/correlation ID on every log
      line?
    options:
      - "It lets you gather every log line for one request across services and threads, and link logs to traces"
      - "It replaces the need for a timestamp"
      - "It compresses the log file"
      - "It encrypts sensitive fields automatically"
    answer: 0
    explanation: |
      A shared trace/correlation ID stitches together all logs for a single
      request across services and threads, and enables click-through between
      logs and the distributed trace.
    ref: "concepts.md#correlation--trace-ids-in-logs-mdc"

  - id: structured-logging-and-log-levels-015
    difficulty: intermediate
    tags: [correlation, mdc, slf4j]
    question: |
      In SLF4J/Logback, what is MDC (Mapped Diagnostic Context)?
    options:
      - "A thread-local key/value map automatically attached to every log line emitted on that thread"
      - "A compression codec for log output"
      - "A global config file for appenders"
      - "A remote log-shipping protocol"
    answer: 0
    explanation: |
      MDC is a ThreadLocal map of key/value pairs. Set it once at the request
      boundary (e.g. trace_id, user_id) and every subsequent log on that thread
      inherits those fields.
    ref: "concepts.md#correlation--trace-ids-in-logs-mdc"

  - id: structured-logging-and-log-levels-016
    difficulty: advanced
    tags: [correlation, mdc, thread-pool]
    question: |
      A filter does `MDC.put("trace_id", id)` at request start but never clears
      MDC. On a thread-pool-backed server, what bug can appear?
    options:
      - "MDC values are immutable, so nothing happens"
      - "The JVM heap overflows on the first request"
      - "Stale context leaks: a later request reusing the pooled thread inherits the previous request's trace_id"
      - "All log levels reset to TRACE"
    answer: 2
    explanation: |
      MDC is thread-local and threads are pooled/reused. Without clearing MDC
      (e.g. in a finally block), a subsequent request on the same thread sees the
      prior request's context — mislabeled logs.
    ref: "concepts.md#correlation--trace-ids-in-logs-mdc"

  - id: structured-logging-and-log-levels-017
    difficulty: advanced
    tags: [correlation, w3c, traceparent]
    question: |
      Given the header `traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01`,
      what does the final `01` field indicate?
    options:
      - "The protocol version"
      - "The trace flags — here the sampled bit is set"
      - "The number of hops so far"
      - "The span's error status"
    answer: 1
    explanation: |
      The W3C traceparent is version-traceid-spanid-flags. The last byte is the
      trace-flags; `01` means the SAMPLED flag is set. The `00` at the front is
      the version.
    ref: "concepts.md#correlation--trace-ids-in-logs-mdc"

  - id: structured-logging-and-log-levels-018
    difficulty: advanced
    tags: [correlation, async, reactive]
    question: |
      Why does MDC-based correlation often break in reactive/async code
      (CompletableFuture, WebFlux, coroutines)?
    options:
      - "Work hops between threads, so the ThreadLocal MDC set on the original thread isn't present on the executing thread unless context is explicitly propagated"
      - "Async code cannot produce log lines"
      - "Reactive code disables logging entirely"
      - "MDC only works with UDP transport"
    answer: 0
    explanation: |
      MDC is thread-local; async/reactive execution moves work across threads, so
      the context doesn't follow unless you use context-propagating executors or
      the OpenTelemetry/Reactor context bridge.
    ref: "concepts.md#correlation--trace-ids-in-logs-mdc"

  - id: structured-logging-and-log-levels-019
    difficulty: intermediate
    tags: [correlation, opentelemetry, log-data-model]
    question: |
      Which fields in the OpenTelemetry log data model exist specifically to link
      a LogRecord back to its distributed trace?
    options:
      - "Body and Attributes"
      - "Resource and InstrumentationScope"
      - "Timestamp and ObservedTimestamp"
      - "TraceId, SpanId, and TraceFlags"
    answer: 3
    explanation: |
      The OTel log data model carries TraceId, SpanId, and TraceFlags as
      first-class fields so a log record can be correlated with the exact span it
      belongs to; OTel logging appenders inject these automatically.
    ref: "concepts.md#correlation--trace-ids-in-logs-mdc"

  - id: structured-logging-and-log-levels-020
    difficulty: beginner
    tags: [pii, secrets, redaction]
    question: |
      Which of the following should NOT be written to application logs?
    options:
      - "HTTP status code"
      - "A user's plaintext password or API token"
      - "Request/trace ID"
      - "Request latency in milliseconds"
    answer: 1
    explanation: |
      Passwords, API keys, tokens, session IDs, and full card/SSN data must never
      be logged — logs are a common leak surface. Status codes, IDs, and latency
      are safe and useful.
    ref: "concepts.md#what-to-log-vs-what-not-to-log-pii-secrets-redaction"

  - id: structured-logging-and-log-levels-021
    difficulty: intermediate
    tags: [pii, minimization]
    question: |
      When you need to trace a user's activity in logs, which is the better field
      to record?
    options:
      - "The user's email address in every line"
      - "A stable user ID (not the email/PII), which is enough to correlate"
      - "The user's full name and phone number"
      - "The user's plaintext session cookie"
    answer: 1
    explanation: |
      Log identifiers, not PII: a user ID lets you correlate activity without
      storing emails, names, or phone numbers. Data minimization reduces GDPR/CCPA
      exposure and leak risk.
    ref: "concepts.md#what-to-log-vs-what-not-to-log-pii-secrets-redaction"

  - id: structured-logging-and-log-levels-022
    difficulty: advanced
    tags: [redaction, defense-in-depth]
    question: |
      Your pipeline regex-masks tokens at the log-aggregation layer. Why is this
      alone considered insufficient?
    options:
      - "Regex masking is too fast to be reliable"
      - "Aggregation-layer masking is illegal under GDPR"
      - "It permanently deletes all logs"
      - "Pipeline masking is a lossy safety net that can miss novel formats; the reliable control is not emitting the secret at the source"
    answer: 3
    explanation: |
      Regex masking downstream is lossy and misses new token formats. It is
      defense-in-depth, not the primary control — the reliable fix is to never
      emit the secret (log a reference/ID instead).
    ref: "concepts.md#what-to-log-vs-what-not-to-log-pii-secrets-redaction"

  - id: structured-logging-and-log-levels-023
    difficulty: intermediate
    tags: [secrets, incident-response]
    question: |
      A secret was accidentally logged and shipped to your log store, backups, and
      SIEM. What is the correct response?
    options:
      - "Nothing, as long as you delete the original log line"
      - "Encrypt the log file and keep using the secret"
      - "Treat the secret as compromised and rotate it, because logs are widely replicated"
      - "Lower the log level to DEBUG"
    answer: 2
    explanation: |
      Logs are replicated to backups, SIEM, and cold storage, so a leaked secret
      is effectively exposed everywhere. It must be treated as compromised and
      rotated; deleting one line is not enough.
    ref: "concepts.md#what-to-log-vs-what-not-to-log-pii-secrets-redaction"

  - id: structured-logging-and-log-levels-024
    difficulty: beginner
    tags: [contextual-fields]
    question: |
      Which set best describes useful "contextual fields" to attach to structured
      logs?
    options:
      - "service, env, version, trace_id, user_id, status, duration_ms"
      - "font, color, indentation, line-width"
      - "cpu-clock-speed, ram-brand, disk-vendor"
      - "compression-level, encryption-key, checksum-salt"
    answer: 0
    explanation: |
      Contextual fields make a log answerable: service/env/version identify the
      source, trace_id/user_id enable correlation, and status/duration describe
      the outcome. Set environment-wide context once via config/MDC.
    ref: "concepts.md#contextual-fields--the-canonical-log-line"

  - id: structured-logging-and-log-levels-025
    difficulty: intermediate
    tags: [canonical-log-line, wide-events]
    question: |
      What is the "canonical log line" pattern?
    options:
      - "Writing logs in ALL CAPS for readability"
      - "Emitting one wide, structured event per request that summarizes everything about it"
      - "Rotating log files exactly once per day"
      - "Logging only errors and nothing else"
    answer: 1
    explanation: |
      The canonical log line (popularized by Stripe) is a single wide structured
      event per request — method, path, status, latency, principal, downstream
      counts, trace_id — instead of many scattered lines.
    ref: "concepts.md#contextual-fields--the-canonical-log-line"

  - id: structured-logging-and-log-levels-026
    difficulty: advanced
    tags: [canonical-log-line, cardinality, slicing]
    question: |
      What is a key analytical advantage of emitting one wide canonical event per
      request?
    options:
      - "It guarantees the smallest possible log volume overall"
      - "It removes the need for a trace_id"
      - "You can slice by any dimension after the fact (e.g. p99 duration where path=/orders) without pre-aggregating"
      - "It automatically encrypts PII"
    answer: 2
    explanation: |
      A wide, high-cardinality event lets you query by any dimension afterward
      (the Honeycomb / OTel wide-event philosophy), and volume scales with request
      count rather than with the number of code paths.
    ref: "concepts.md#contextual-fields--the-canonical-log-line"

  - id: structured-logging-and-log-levels-027
    difficulty: intermediate
    tags: [canonical-log-line, debug]
    question: |
      How do canonical log lines and fine-grained DEBUG logs best coexist?
    options:
      - "You must pick exactly one; they are mutually exclusive"
      - "Emit both at ERROR so nothing is missed"
      - "Canonical lines replace DEBUG entirely in all cases"
      - "Keep the canonical per-request summary always-on at INFO and gate chatty step-by-step lines behind DEBUG"
    answer: 3
    explanation: |
      They complement each other: the canonical summary is always-on at INFO for
      every request, while verbose step-by-step detail stays behind DEBUG to be
      enabled only when investigating.
    ref: "concepts.md#contextual-fields--the-canonical-log-line"

  - id: structured-logging-and-log-levels-028
    difficulty: intermediate
    tags: [performance, parameterized-logging, slf4j]
    question: |
      Why is `log.debug("state={}", obj)` preferred over
      `log.debug("state=" + expensiveToString())` in SLF4J?
    options:
      - "The first is shorter to type only"
      - "String concatenation builds the message even when DEBUG is disabled, while parameterized logging defers toString() until the level is known to be enabled"
      - "SLF4J cannot print objects with `+`"
      - "Parameterized logging changes the level to INFO"
    answer: 1
    explanation: |
      With `+` concatenation the expensive string is built regardless of level.
      Parameterized logging passes the object and only calls toString() if DEBUG is
      actually enabled, avoiding wasted work in prod.
    ref: "concepts.md#logging-performance-async-appenders--hot-loops"

  - id: structured-logging-and-log-levels-029
    difficulty: intermediate
    tags: [performance, async-appender, disruptor]
    question: |
      What do Logback's AsyncAppender and Log4j2's async loggers accomplish?
    options:
      - "They encrypt logs in transit"
      - "They guarantee zero log loss during a crash"
      - "They hand log events to a background thread so the request thread isn't blocked on log I/O"
      - "They convert JSON logs to plain text"
    answer: 2
    explanation: |
      Async logging offloads the actual I/O to a background thread (Log4j2 uses
      the LMAX Disruptor ring buffer), so request threads aren't stalled writing
      to disk/network — improving latency and throughput.
    ref: "concepts.md#logging-performance-async-appenders--hot-loops"

  - id: structured-logging-and-log-levels-030
    difficulty: intermediate
    tags: [performance, hot-loop]
    question: |
      Why should you avoid a log statement inside a tight loop over a million
      items?
    options:
      - "Loops cannot contain log calls"
      - "It makes the loop run in parallel unexpectedly"
      - "It disables the loop's exit condition"
      - "Per-iteration logging can dominate CPU and flood storage; log a summary after the loop or sample instead"
    answer: 3
    explanation: |
      A log call per element multiplies I/O and serialization cost and floods
      storage. Log a post-loop summary or sample a fraction of iterations rather
      than logging every element.
    ref: "concepts.md#logging-performance-async-appenders--hot-loops"

  - id: structured-logging-and-log-levels-031
    difficulty: advanced
    tags: [performance, async-queue, backpressure]
    question: |
      By default, when Logback's AsyncAppender queue reaches ~80% full, what
      happens?
    options:
      - "It blocks all logging permanently"
      - "It drops ERROR events first"
      - "It doubles the queue size automatically"
      - "It discards TRACE/DEBUG/INFO events (per the discardingThreshold) to avoid blocking the application"
    answer: 3
    explanation: |
      To avoid blocking request threads, Logback's AsyncAppender discards lower-
      severity events (TRACE/DEBUG/INFO) once the queue hits the discardingThreshold
      (~80% by default), preserving WARN/ERROR. This is configurable.
    ref: "concepts.md#logging-performance-async-appenders--hot-loops"

  - id: structured-logging-and-log-levels-032
    difficulty: advanced
    tags: [performance, async, durability]
    question: |
      What durability trade-off does async logging introduce?
    options:
      - "It makes logs immutable"
      - "It prevents any log from ever reaching disk"
      - "Events buffered in memory can be lost in a hard crash — often the very lines you'd want for the crash"
      - "It forces synchronous writes for ERROR only"
    answer: 2
    explanation: |
      Async logging keeps events in an in-memory buffer, so a hard crash can lose
      the last unflushed lines. For audit/compliance logs, prefer synchronous or
      flush-on-error writes.
    ref: "concepts.md#logging-performance-async-appenders--hot-loops"

  - id: structured-logging-and-log-levels-033
    difficulty: beginner
    tags: [sampling, cost]
    question: |
      What is the main purpose of log sampling?
    options:
      - "To encrypt logs at rest"
      - "To keep only a subset of high-volume logs, reducing cost and noise"
      - "To guarantee every event is stored forever"
      - "To convert metrics into logs"
    answer: 1
    explanation: |
      At high volume, storing every log is impractical. Sampling keeps a
      representative subset (e.g. 1 in N of a repetitive event), cutting cost and
      noise while retaining signal.
    ref: "concepts.md#sampling-logs"

  - id: structured-logging-and-log-levels-034
    difficulty: intermediate
    tags: [sampling, errors]
    question: |
      What is the standard rule about which logs to sample versus always keep?
    options:
      - "Sample errors aggressively; keep all DEBUG"
      - "Never sample errors; sample the high-volume happy-path (INFO/DEBUG)"
      - "Sample everything equally at 50%"
      - "Keep only the first log of each day"
    answer: 1
    explanation: |
      Errors are rare and high-value, so keep 100% of them. Sample the voluminous
      happy-path/DEBUG/INFO events, since dropping the one line that explains an
      incident is the real risk.
    ref: "concepts.md#sampling-logs"

  - id: structured-logging-and-log-levels-035
    difficulty: advanced
    tags: [sampling, trace-consistent]
    question: |
      What is "trace-consistent" log sampling?
    options:
      - "Sampling logs at a fixed 1-in-10 rate regardless of context"
      - "Sampling only logs that lack a trace_id"
      - "Keeping a request's logs when its trace was sampled (using the sampled flag), so logs and traces agree"
      - "Deleting logs whose traces were sampled"
    answer: 2
    explanation: |
      Trace-consistent sampling uses the trace's sampled bit to decide whether to
      keep its logs, so you don't end up with logs for un-sampled traces (or
      missing logs for sampled ones) — logs and traces stay aligned.
    ref: "concepts.md#sampling-logs"

  - id: structured-logging-and-log-levels-036
    difficulty: beginner
    tags: [signals, metrics-vs-logs]
    question: |
      For firing an alert on a rising error rate across the fleet, which signal is
      generally the best fit?
    options:
      - "Logs, by counting ERROR lines at query time"
      - "Traces, by inspecting each span"
      - "Metrics — cheaper and lower-latency than scanning logs, purpose-built for rates/trends"
      - "None; alerting is impossible"
    answer: 2
    explanation: |
      Metrics are aggregated numbers ideal for rates/trends and alerting, and are
      cheaper and lower-latency than scanning logs. Use logs/traces for diagnosing
      the specific failing requests afterward.
    ref: "concepts.md#logs-vs-metrics-vs-traces-choosing-the-signal"

  - id: structured-logging-and-log-levels-037
    difficulty: intermediate
    tags: [signals, cardinality, labels]
    question: |
      Why should you avoid putting `user_id` or `request_id` into Prometheus
      metric labels but it's fine in logs?
    options:
      - "Prometheus forbids all string labels"
      - "Logs cannot store IDs"
      - "Unbounded IDs cause metric cardinality explosion (one time series per value); logs/traces are the right home for high-cardinality data"
      - "user_id is always PII and logs are exempt from privacy rules"
    answer: 2
    explanation: |
      Each distinct label value creates a new time series, so high-cardinality IDs
      explode metric storage/query cost. High-cardinality data belongs in
      logs/traces (or exemplars), not metric labels.
    ref: "concepts.md#logs-vs-metrics-vs-traces-choosing-the-signal"

  - id: structured-logging-and-log-levels-038
    difficulty: intermediate
    tags: [signals, debugging]
    question: |
      You need to understand exactly what happened to one specific failing
      request, including the values it processed. Which signal is most directly
      suited?
    options:
      - "A counter metric"
      - "A histogram of latencies"
      - "Logs (with trace_id) and the distributed trace"
      - "A gauge of memory usage"
    answer: 2
    explanation: |
      Per-request detail is the strength of logs and traces. The trace shows where
      latency/failure occurred across hops; logs (correlated by trace_id) give the
      detailed event record. Metrics aggregate and can't isolate one request.
    ref: "concepts.md#logs-vs-metrics-vs-traces-choosing-the-signal"

  - id: structured-logging-and-log-levels-039
    difficulty: advanced
    tags: [signals, exemplars, convergence]
    question: |
      Which mechanism links a Prometheus histogram bucket to a specific example
      trace, bridging metrics and traces?
    options:
      - "MDC"
      - "logfmt"
      - "Exemplars"
      - "The discardingThreshold"
    answer: 2
    explanation: |
      Exemplars attach a trace_id (and value) to a metric sample/bucket, letting
      you jump from an aggregated metric to a representative trace — one way the
      three signals converge. trace_id similarly links logs to traces.
    ref: "concepts.md#logs-vs-metrics-vs-traces-choosing-the-signal"

  - id: structured-logging-and-log-levels-040
    difficulty: intermediate
    tags: [cost, volume]
    question: |
      In most log-vendor pricing models, what is the dominant cost driver?
    options:
      - "The number of distinct log levels used"
      - "Volume of data ingested (bytes), multiplied by retention and index/replication factor"
      - "The programming language of the service"
      - "The number of developers on the team"
    answer: 1
    explanation: |
      Cost roughly equals volume ingested times retention times indexing/
      replication factor. Bytes ingested dominates in Datadog/Splunk/CloudWatch/
      Elastic pricing.
    ref: "concepts.md#the-logs-are-expensive-reality"

  - id: structured-logging-and-log-levels-041
    difficulty: advanced
    tags: [cost, loki, elasticsearch]
    question: |
      How does Grafana Loki's indexing model differ from Elasticsearch's, and what
      is the trade-off?
    options:
      - "Loki indexes every field like Elasticsearch but faster"
      - "Loki does not store logs at all"
      - "Loki indexes only labels (not log content), which is far cheaper to store but makes full-text-style queries slower"
      - "Elasticsearch indexes only labels while Loki indexes everything"
    answer: 2
    explanation: |
      Elasticsearch indexes every field (powerful but storage/RAM heavy). Loki
      indexes only labels and greps the rest of the content, dramatically lowering
      storage cost at the price of slower content queries.
    ref: "concepts.md#the-logs-are-expensive-reality"

  - id: structured-logging-and-log-levels-042
    difficulty: advanced
    tags: [cost, scenario, remediation]
    question: |
      Your log bill tripled overnight. Which combination is the strongest
      first-line response?
    options:
      - "Turn off all logging and hope the incident doesn't recur"
      - "Increase retention to keep more data for analysis"
      - "Find top talkers, cut DEBUG in prod, drop/sample the noisiest happy-path (keeping all errors), move alert-driving signals to metrics, and apply tiered retention"
      - "Switch every log line to ERROR so they're all kept"
    answer: 2
    explanation: |
      The signal-per-dollar approach: identify top talkers by service/level/field,
      cut DEBUG in prod, drop/sample noisy happy-path lines at the collector (keep
      all errors), move alerting to metrics, and tier/archive retention.
    ref: "concepts.md#the-logs-are-expensive-reality"

  - id: structured-logging-and-log-levels-043
    difficulty: intermediate
    tags: [cost, retention, tiering]
    question: |
      What is "tiered retention" for logs?
    options:
      - "Keeping every log in fast searchable storage forever"
      - "Keeping recent logs (e.g. 7-14 days) hot and searchable, then archiving older logs to cheap object storage"
      - "Deleting all logs older than one hour"
      - "Storing logs only in the application's RAM"
    answer: 1
    explanation: |
      Tiered retention keeps recent logs hot/searchable while moving older logs to
      inexpensive object storage (or dropping them), balancing investigability
      against cost.
    ref: "concepts.md#the-logs-are-expensive-reality"

  - id: structured-logging-and-log-levels-044
    difficulty: intermediate
    tags: [cost, cardinality, labels]
    question: |
      Where should high-cardinality data (like a unique request ID) live to avoid
      blowing up a log backend's index?
    options:
      - "In indexed labels, for fast lookup"
      - "In the log body/content, not in indexed labels"
      - "In a Prometheus gauge"
      - "It should never be recorded anywhere"
    answer: 1
    explanation: |
      High-cardinality values in indexed labels multiply storage and query cost
      (the same disease as metric cardinality). Keep them in the log body/content;
      reserve labels for low-cardinality dimensions.
    ref: "concepts.md#the-logs-are-expensive-reality"

  - id: structured-logging-and-log-levels-045
    difficulty: beginner
    tags: [structured-logging, ndjson]
    question: |
      Structured JSON logs are commonly emitted as one JSON object per line. What
      is this format called?
    options:
      - "JSON Lines / NDJSON"
      - "A single pretty-printed JSON array per file"
      - "CSV"
      - "YAML documents"
    answer: 0
    explanation: |
      Emitting one JSON object per line is JSON Lines (JSONL) / NDJSON — each line
      is independently parseable, which suits streaming log pipelines better than
      one giant pretty-printed array.
    ref: "concepts.md#unstructured-vs-structured-logging"

  - id: structured-logging-and-log-levels-046
    difficulty: advanced
    tags: [performance, guard, log4j2]
    question: |
      For a very expensive-to-build DEBUG message in Log4j2, which approach avoids
      the cost when DEBUG is disabled?
    options:
      - "Always concatenate the string first, then check the level"
      - "Raise the message to ERROR"
      - "Use a lambda supplier — log.debug(() -> expensive()) — so the work runs only if DEBUG is enabled"
      - "Wrap it in a synchronized block"
    answer: 2
    explanation: |
      Log4j2 supports lambda/Supplier message construction: `log.debug(() -> ...)`
      defers the expensive computation until the framework confirms DEBUG is
      enabled, avoiding wasted work in production.
    ref: "concepts.md#logging-performance-async-appenders--hot-loops"

  - id: structured-logging-and-log-levels-047
    difficulty: intermediate
    tags: [log-levels, fatal, opentelemetry]
    question: |
      In the OpenTelemetry log data model, SeverityNumber values are grouped into
      ranges. Which range corresponds to ERROR?
    options:
      - "1-4"
      - "9-12"
      - "13-16"
      - "17-20"
    answer: 3
    explanation: |
      OTel maps SeverityNumber ranges: 1-4 TRACE, 5-8 DEBUG, 9-12 INFO, 13-16 WARN,
      17-20 ERROR, 21-24 FATAL. So ERROR occupies 17-20.
    ref: "concepts.md#log-levels-trace--debug--info--warn--error"

  - id: structured-logging-and-log-levels-048
    difficulty: beginner
    tags: [correlation, grafana, logs-to-traces]
    question: |
      In Grafana, having a `trace_id` field on a log line most directly enables
      what feature?
    options:
      - "Automatic PII redaction"
      - "Click-through from the log to the corresponding trace in Tempo/Jaeger"
      - "Compression of the log store"
      - "Converting the log into a metric"
    answer: 1
    explanation: |
      A log's trace_id becomes a click-through link to the matching trace in a
      backend like Tempo or Jaeger ("logs to traces"), letting you pivot from a log
      line to the full distributed trace.
    ref: "concepts.md#correlation--trace-ids-in-logs-mdc"
