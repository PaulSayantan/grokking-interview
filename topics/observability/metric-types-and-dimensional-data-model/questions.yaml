topic: "Metric Types & the Dimensional Data Model"
domain: observability
topic_slug: metric-types-and-dimensional-data-model
version: 1
questions:
- id: metric-types-and-dimensional-data-model-001
  difficulty: beginner
  tags: [dimensional-model, time-series, labels]
  question: |
    In the dimensional data model used by Prometheus, what uniquely
    identifies a single time series?
  options:
  - "The metric name plus the complete set of label key/value pairs"
  - "The metric name alone, regardless of its attached labels"
  - "The scrape target's IP address and TCP port combination"
  - "The metric type (counter, gauge, or histogram) it declares"
  answer: 0
  explanation: |
    A time series is identified by the metric name (itself the special
    `__name__` label) together with the exact set of label name/value pairs.
    Changing, adding, or removing any label value produces a different series.
  ref: "concepts.md#the-dimensional-data-model"

- id: metric-types-and-dimensional-data-model-002
  difficulty: beginner
  tags: [dimensional-model, series]
  question: |
    Given these two exposed lines, how many distinct time series are there?

    ```
    http_requests_total{method="GET", status="200"} 10
    http_requests_total{method="POST", status="200"} 4
    ```
  options:
  - "One, because the metric name is the same"
  - "One, because the status label matches"
  - "Two, because at least one label value differs"
  - "Four, because each label name spawns its own series"
  answer: 2
  explanation: |
    They share the metric name but differ in the `method` label, so they are
    two independent time series. Any difference in the label set creates a
    separate series.
  ref: "concepts.md#the-dimensional-data-model"

- id: metric-types-and-dimensional-data-model-003
  difficulty: intermediate
  tags: [dimensional-model, hierarchical]
  question: |
    What is the main advantage of a dimensional model (name + labels) over an
    old-style hierarchical dotted name like `prod.web01.orders.GET.200.count`?
  options:
  - "Dotted names use less storage because the string is compressed on disk"
  - "Dotted names support higher cardinality safely without series explosion"
  - "Dimensional models avoid needing a metric name at all, using only labels"
  - "Dimensions can be recombined and aggregated arbitrarily at query time"
  answer: 3
  explanation: |
    With labels you can slice and aggregate along any dimension after the fact
    (e.g. 5xx by pod for one handler) without pre-planning the chart. In a
    dotted string the dimensions are baked into an opaque name and cannot be
    recombined.
  ref: "concepts.md#the-dimensional-data-model"

- id: metric-types-and-dimensional-data-model-004
  difficulty: beginner
  tags: [counter, metric-types]
  question: |
    Which statement correctly describes a counter?
  options:
  - "A value that can arbitrarily increase and decrease as the process runs"
  - "A cumulative value that only increases, or resets to zero on restart"
  - "A client-side computed quantile over a time window"
  - "A bucketed distribution of observations grouped into fixed ranges"
  answer: 1
  explanation: |
    A counter is monotonically increasing and only ever resets to zero on a
    process restart. It is used for counts of events like requests or errors.
  ref: "concepts.md#counters"

- id: metric-types-and-dimensional-data-model-005
  difficulty: beginner
  tags: [counter, naming]
  question: |
    By Prometheus/OpenMetrics convention, what suffix should a counter's name
    typically end with?
  options:
  - "_count"
  - "_sum"
  - "_total"
  - "_gauge"
  answer: 2
  explanation: |
    Accumulating counters conventionally end in `_total` (e.g.
    `http_requests_total`), which is how OpenMetrics identifies the type on
    the wire. `_count` and `_sum` are the auxiliary series of histograms and
    summaries.
  ref: "concepts.md#counters"

- id: metric-types-and-dimensional-data-model-006
  difficulty: intermediate
  tags: [counter, gauge, modeling]
  question: |
    A developer models "current number of in-flight requests" as a counter.
    Why is this wrong?
  options:
  - "In-flight requests can decrease, which a counter cannot represent; it is a gauge"
  - "Counters cannot have labels attached, unlike gauges which can"
  - "Counters are more expensive to store than gauges in the TSDB"
  - "Counters cannot be scraped by Prometheus over the pull protocol"
  answer: 0
  explanation: |
    In-flight requests go up and down during normal operation, so it must be a
    gauge. Modeling it as a counter would make decreases look like counter
    resets and corrupt any `rate()` computed on it.
  ref: "concepts.md#gauges"

- id: metric-types-and-dimensional-data-model-007
  difficulty: beginner
  tags: [gauge, metric-types]
  question: |
    Which of these is the best use of a gauge?
  options:
  - "Total HTTP requests served since process startup"
  - "Total bytes transmitted over the network interface"
  - "Number of errors encountered since the last boot"
  - "Current memory usage in bytes"
  answer: 3
  explanation: |
    A gauge represents an instantaneous value that can go up and down, such as
    current memory usage. The other options are monotonically accumulating
    counts and should be counters.
  ref: "concepts.md#gauges"

- id: metric-types-and-dimensional-data-model-008
  difficulty: intermediate
  tags: [gauge, promql, functions]
  question: |
    Why is `rate()` inappropriate for a gauge such as `queue_depth`?
  options:
  - "rate() only works on histogram bucket series, never on plain scalar metrics"
  - "rate() assumes a monotonically increasing counter and handles resets, which is
    meaningless for a value that legitimately decreases"
  - "rate() requires the metric name to carry the _total suffix to run at all"
  - "rate() cannot be applied to any metric that carries one or more labels"
  answer: 1
  explanation: |
    `rate()` is defined for counters: it detects resets and computes per-second
    increase. On a gauge that legitimately decreases, every dip looks like a
    reset, producing nonsense. Use `delta()` or `deriv()` for a gauge's rate of
    change.
  ref: "concepts.md#gauges"

- id: metric-types-and-dimensional-data-model-009
  difficulty: intermediate
  tags: [histogram, buckets, exposition]
  question: |
    A classic Prometheus histogram named `latency_seconds` exposes which set
    of series?
  options:
  - "latency_seconds_bucket{le=...}, latency_seconds_sum, and latency_seconds_count"
  - "Only latency_seconds itself, carrying a per-percentile quantile label"
  - "Only latency_seconds_sum and latency_seconds_count, with no bucket series"
  - "latency_seconds_min and latency_seconds_max tracking the observed extremes"
  answer: 0
  explanation: |
    A classic histogram expands into cumulative `_bucket` series (one per `le`
    boundary), a `_sum` of observed values, and a `_count` of observations
    (equal to the `+Inf` bucket).
  ref: "concepts.md#histograms"

- id: metric-types-and-dimensional-data-model-010
  difficulty: intermediate
  tags: [histogram, buckets, le]
  question: |
    In a classic histogram, what does the `le` label on a `_bucket` series
    mean?
  options:
  - "The exact single value that was observed for that bucket"
  - "The lower exclusive bound of the bucket's counting range"
  - "The inclusive upper bound: count of observations less than or equal to that value"
  - "The estimated quantile that this bucket boundary represents"
  answer: 2
  explanation: |
    `le` stands for "less than or equal." Each bucket is a cumulative counter
    of observations whose value is ≤ that upper bound, so higher buckets
    include everything in lower ones.
  ref: "concepts.md#histograms"

- id: metric-types-and-dimensional-data-model-011
  difficulty: intermediate
  tags: [histogram, promql, quantile]
  question: |
    Which PromQL expression correctly computes the 95th percentile latency
    over the last 5 minutes from a classic histogram?
  options:
  - "histogram_quantile(0.95, latency_seconds_bucket)"
  - "histogram_quantile(0.95, rate(latency_seconds_bucket[5m]))"
  - "quantile(0.95, rate(latency_seconds[5m]))"
  - "rate(histogram_quantile(0.95, latency_seconds_bucket)[5m])"
  answer: 1
  explanation: |
    You first take the per-second `rate()` of the bucket counters over the
    window, then pass that to `histogram_quantile(0.95, ...)`. The buckets are
    counters, so they must be rated before computing the quantile.
  ref: "concepts.md#histograms"

- id: metric-types-and-dimensional-data-model-012
  difficulty: advanced
  tags: [histogram, quantile, accuracy]
  question: |
    A p99 latency computed from a classic histogram lands in a bucket spanning
    le="1.0" to le="10". Why might the reported p99 be inaccurate?
  options:
  - "histogram_quantile silently ignores the +Inf bucket during interpolation"
  - "Quantiles above p95 are always dropped by histogram_quantile as unreliable"
  - "The _sum series is missing, so the estimate falls back to the bucket midpoint"
  - "The quantile is linearly interpolated within that wide bucket, so a coarse boundary
    gives a rough estimate"
  answer: 3
  explanation: |
    `histogram_quantile` interpolates linearly within the bucket the quantile
    falls into. If that bucket is very wide, the interpolation is coarse. You
    must choose bucket boundaries that bracket your SLO thresholds for accuracy.
  ref: "concepts.md#histograms"

- id: metric-types-and-dimensional-data-model-013
  difficulty: intermediate
  tags: [histogram, average, promql]
  question: |
    How do you compute the average observation value (e.g. mean latency) from
    a histogram over the last 5 minutes?
  options:
  - "histogram_quantile(0.5, rate(latency_seconds_bucket[5m]))"
  - "avg(latency_seconds_bucket[5m]) averaged across the bucket series"
  - "rate(latency_seconds_sum[5m]) / rate(latency_seconds_count[5m])"
  - "sum(latency_seconds_sum) / count(latency_seconds_count) over the range"
  answer: 2
  explanation: |
    Dividing the rate of `_sum` by the rate of `_count` yields the mean over
    the window. The median (p50) from `histogram_quantile(0.5, ...)` is a
    different statistic, not the mean.
  ref: "concepts.md#histograms"

- id: metric-types-and-dimensional-data-model-014
  difficulty: beginner
  tags: [summary, quantile]
  question: |
    Where are the quantiles of a Prometheus summary computed?
  options:
  - "In the instrumented client process, over a sliding time window"
  - "On the Prometheus server at query time from stored buckets"
  - "In Grafana when rendering the panel from the raw series"
  - "In the OpenTelemetry Collector before forwarding the metric"
  answer: 0
  explanation: |
    A summary calculates its configured φ-quantiles client-side, inside the
    application, using a streaming estimator over a sliding window, and exposes
    them directly with a `quantile` label.
  ref: "concepts.md#summaries"

- id: metric-types-and-dimensional-data-model-015
  difficulty: advanced
  tags: [summary, aggregation, quantile]
  question: |
    You run 10 replicas each exposing a summary with a quantile="0.99" series.
    Why is avg(rpc_duration_seconds{quantile="0.99"}) not a valid fleet p99?
  options:
  - "The quantile label is dropped during scraping, so avg() sees nothing"
  - "Summaries do not expose a _count series needed to weight the average"
  - "Prometheus rejects averaging across instances with a many-to-many error"
  - "The average of per-instance percentiles is not the percentile of the combined
    distribution"
  answer: 3
  explanation: |
    A percentile is a property of a distribution. Averaging ten instances' p99
    values does not yield the p99 of combined traffic — an idle box and a
    hammered box weigh equally. Pre-computed summary quantiles cannot be
    aggregated across series.
  ref: "concepts.md#summaries"

- id: metric-types-and-dimensional-data-model-016
  difficulty: intermediate
  tags: [summary, aggregation]
  question: |
    Which parts of a summary CAN be validly aggregated across instances?
  options:
  - "The quantile series, by taking a simple sum across all instances"
  - "The _sum and _count series (they are counters)"
  - "Nothing about a summary can be aggregated across separate instances"
  - "Only the quantile=\"0.5\" series, since the median is always additive"
  answer: 1
  explanation: |
    A summary's `_sum` and `_count` are ordinary counters and can be aggregated
    (e.g. to get a fleet mean via rate(_sum)/rate(_count)). Only the
    pre-computed quantile series are trapped per-instance.
  ref: "concepts.md#summaries"

- id: metric-types-and-dimensional-data-model-017
  difficulty: intermediate
  tags: [histogram, summary, comparison]
  question: |
    For measuring service latency SLOs that must be aggregated across many
    pods, which metric type is generally preferred and why?
  options:
  - "Summary, because client-side quantiles are always more accurate"
  - "Gauge, because it uses the least storage and samples latency directly"
  - "Histogram, because bucket counts can be aggregated across instances and any quantile
    computed at query time"
  - "Counter, because cumulative latency is monotonic and merges across pods"
  answer: 2
  explanation: |
    Histograms expose bucket counters that can be summed `by (le)` across
    instances; you then compute the quantile once on the combined distribution
    and can pick any quantile at query time. Summary quantiles cannot be
    aggregated.
  ref: "concepts.md#histograms-vs-summaries"

- id: metric-types-and-dimensional-data-model-018
  difficulty: intermediate
  tags: [histogram, summary, comparison]
  question: |
    Which statement about histograms vs summaries is TRUE?
  options:
  - "Both compute quantiles server-side at query time from stored buckets"
  - "Summaries let you change the target quantile at query time for free"
  - "Histograms cannot expose a _sum or _count, only the raw bucket series"
  - "Histogram quantiles are computed server-side and are aggregatable; summary quantiles
    are computed client-side and are not"
  answer: 3
  explanation: |
    Histograms store buckets and compute quantiles server-side (aggregatable,
    any quantile at query time). Summaries compute quantiles client-side over a
    window and cannot be aggregated; changing the quantile requires a code
    change.
  ref: "concepts.md#histograms-vs-summaries"

- id: metric-types-and-dimensional-data-model-019
  difficulty: advanced
  tags: [histogram, summary, tradeoffs]
  question: |
    Which is a genuine advantage of a summary over a classic histogram?
  options:
  - "It gives a precise quantile for a single instance without needing to pre-choose
    bucket boundaries"
  - "Its pre-computed quantiles can be summed across instances to give an exact fleet-wide percentile"
  - "It costs less client CPU because it only increments bucket counters instead of running an estimator"
  - "Its target quantile can be freely changed at query time without any code change to the client"
  answer: 0
  explanation: |
    A summary knows the exact distribution the process saw, so it produces a
    precise per-instance quantile with no bucket-boundary guessing or
    interpolation error. Its downsides are non-aggregatability and higher
    client cost.
  ref: "concepts.md#histograms-vs-summaries"

- id: metric-types-and-dimensional-data-model-020
  difficulty: advanced
  tags: [native-histogram, exponential-histogram]
  question: |
    What is the key benefit of a Prometheus native histogram over a classic
    one?
  options:
  - "It stores the whole distribution as many bucket series per label combination"
  - "It stores the distribution in a single series with dynamically scaled exponential
    buckets, cutting cardinality while keeping high resolution"
  - "It computes quantiles client-side over a sliding window like a summary, exposing them with a quantile label"
  - "It removes the need for the _sum and _count values by encoding both totals inside the bucket boundaries"
  answer: 1
  explanation: |
    A native histogram is a single time series carrying count, sum, and a
    dynamic set of exponentially-spaced buckets — no pre-configured `le`
    boundaries, far lower cardinality, and high uniform resolution. You still
    query it with `histogram_quantile`.
  ref: "concepts.md#native-and-exponential-histograms"

- id: metric-types-and-dimensional-data-model-021
  difficulty: advanced
  tags: [exponential-histogram, opentelemetry, mergeability]
  question: |
    Why are exponential/native histograms "perfectly mergeable" while classic
    histograms with different bucket boundaries often are not?
  options:
  - "Exponential histograms retain every raw observation, so any two can be concatenated losslessly"
  - "Classic histograms cannot be summed at all, even when every instance shares identical le boundaries"
  - "Native histograms disable linear interpolation entirely, so merged results are always exact"
  - "Higher-resolution exponential buckets map exactly onto lower-resolution ones,
    so two histograms can be downscaled to a common scale without error"
  answer: 3
  explanation: |
    Exponential bucket boundaries follow a scale factor such that finer buckets
    subset exactly into coarser ones ("perfect subsetting"), so histograms at
    different scales merge losslessly. Classic histograms with mismatched `le`
    boundaries generally cannot be merged.
  ref: "concepts.md#native-and-exponential-histograms"

- id: metric-types-and-dimensional-data-model-022
  difficulty: beginner
  tags: [counter, rate, promql]
  question: |
    What does `rate(http_requests_total[5m])` return?
  options:
  - "The total cumulative number of requests observed during the last 5-minute window"
  - "The current absolute counter value at the instant the query is evaluated"
  - "The per-second average rate of increase of the counter over the last 5 minutes"
  - "The 95th percentile request latency computed across the last 5 minutes"
  answer: 2
  explanation: |
    `rate()` gives the per-second average rate of increase over the range
    window. For a total count over the window (not per-second) you would use
    `increase()`.
  ref: "concepts.md#rating-a-counter-and-counter-resets"

- id: metric-types-and-dimensional-data-model-023
  difficulty: intermediate
  tags: [counter, reset, rate]
  question: |
    How does `rate()` handle a counter reset caused by a process restart
    (value drops from 5000 to 30)?
  options:
  - "It detects the drop as a reset and adds the pre-reset value so the computed rate
    stays correct"
  - "It reports a large negative rate for the interval that spans the drop from 5000 to 30"
  - "It returns NaN for the series until the counter climbs back past its previous peak of 5000"
  - "It ignores every sample recorded after the reset until the next scrape config reload"
  answer: 0
  explanation: |
    When `rate()` sees a sample lower than the previous one it assumes a
    counter reset and compensates by adding the value at the reset point, so
    the rate never goes negative and remains accurate.
  ref: "concepts.md#rating-a-counter-and-counter-resets"

- id: metric-types-and-dimensional-data-model-024
  difficulty: intermediate
  tags: [rate, irate, promql]
  question: |
    What is the difference between `rate()` and `irate()`?
  options:
  - "rate() is defined only for gauges, while irate() is the counter-specific variant"
  - "rate() averages over the whole window with extrapolation; irate() uses only the
    last two samples"
  - "irate() is intended for alerting rules only, while rate() may be used solely for graphing panels"
  - "There is no functional difference; irate() is merely a deprecated alias kept for compatibility"
  answer: 1
  explanation: |
    `rate()` computes an average over the entire range and extrapolates to the
    window edges; `irate()` uses only the last two samples for an instantaneous
    rate. Use `rate()` for alerts/slow counters and `irate()` for graphing
    fast, volatile counters.
  ref: "concepts.md#rating-a-counter-and-counter-resets"

- id: metric-types-and-dimensional-data-model-025
  difficulty: intermediate
  tags: [increase, rate, promql]
  question: |
    `increase(errors_total[1h])` is equivalent to which of the following?
  options:
  - "irate(errors_total[1h]), the instantaneous rate taken from the last two samples in the hour"
  - "The raw current value of errors_total sampled at the moment the query runs"
  - "rate(errors_total[1h]) multiplied by 3600 seconds"
  - "histogram_quantile(0.99, ...) applied to the counter over the trailing 1h window"
  answer: 2
  explanation: |
    `increase()` is syntactic sugar for `rate()` multiplied by the window in
    seconds, giving the total increase over the range (here ~3600 s). It is
    more human-readable; `rate()` is preferred inside recording rules.
  ref: "concepts.md#rating-a-counter-and-counter-resets"

- id: metric-types-and-dimensional-data-model-026
  difficulty: advanced
  tags: [rate, aggregation, ordering, promql]
  question: |
    Which is the CORRECT way to get the total request rate grouped by status,
    and why?
  options:
  - "sum by (status)(rate(http_requests_total[5m])) — rate per series first, then
    aggregate"
  - "rate(sum by (status)(http_requests_total)[5m:]) — aggregate first, then rate"
  - "avg by (status)(http_requests_total) — no rate needed"
  - "increase(http_requests_total) then sum — order does not matter"
  answer: 0
  explanation: |
    Reset detection is per-series, so you must take `rate()` on each individual
    series first and only then `sum by (status)`. Summing raw counters before
    rating hides per-series restarts and yields a bogus rate.
  ref: "concepts.md#rating-a-counter-and-counter-resets"

- id: metric-types-and-dimensional-data-model-027
  difficulty: intermediate
  tags: [rate, window, scrape]
  question: |
    Why does `rate(http_requests_total[15s])` often return empty results when
    the scrape interval is 15s?
  options:
  - "rate() rejects any range window shorter than 1 minute as invalid syntax"
  - "15s range windows are only valid when applied to gauge metrics, never counters"
  - "rate() requires the _total suffix to be stripped from the metric name before it runs"
  - "The window must span at least two scrapes; a window near or below the scrape
    interval has too few samples"
  answer: 3
  explanation: |
    `rate()` needs at least two samples in the window to compute a difference.
    A window at or below the scrape interval frequently contains fewer than two
    points, so it returns nothing. A rule of thumb is a window ≥ ~4× the scrape
    interval.
  ref: "concepts.md#rating-a-counter-and-counter-resets"

- id: metric-types-and-dimensional-data-model-028
  difficulty: intermediate
  tags: [temporality, cumulative, delta]
  question: |
    In cumulative aggregation temporality, what does each reported sample
    represent?
  options:
  - "Only the incremental change accumulated since the immediately previous report"
  - "The running total since the process's fixed start time"
  - "A randomly sampled subset of the events seen during the reporting interval"
  - "The current instantaneous gauge value captured at report time, with no history"
  answer: 1
  explanation: |
    Cumulative temporality keeps a fixed start timestamp; each sample reports
    the full total since that start, so windows overlap. Prometheus uses this
    model, and readers derive rates by subtracting consecutive samples.
  ref: "concepts.md#cumulative-vs-delta-temporality"

- id: metric-types-and-dimensional-data-model-029
  difficulty: advanced
  tags: [temporality, delta, missed-data]
  question: |
    A key downside of delta temporality compared to cumulative is:
  options:
  - "A lost/dropped data point is permanently gone rather than self-healing"
  - "Clients must retain every series' running total in memory for the process lifetime"
  - "It cannot be pushed to a collector and can only be gathered by a pull-based scrape"
  - "It roughly doubles storage in the backend because each window keeps its own start timestamp"
  answer: 0
  explanation: |
    With delta temporality each sample is only the increment for its window, so
    a dropped sample means that data is lost forever. Cumulative self-heals: the
    next sample still carries the full total. Delta's upside is memory-less
    clients.
  ref: "concepts.md#cumulative-vs-delta-temporality"

- id: metric-types-and-dimensional-data-model-030
  difficulty: advanced
  tags: [temporality, opentelemetry, prometheus, single-writer]
  question: |
    An OpenTelemetry pipeline emits delta-temporality sums and you want to
    store them in Prometheus. What must happen?
  options:
  - "Nothing; Prometheus stores delta counters natively alongside cumulative ones"
  - "They must first be downsampled into gauges before the remote-write endpoint accepts them"
  - "Prometheus converts them automatically at query time with no accumulator state required"
  - "They must be converted delta→cumulative, which is stateful and requires all points
    for a series to reach one destination (single-writer)"
  answer: 3
  explanation: |
    Prometheus's model has no delta counters, so delta metrics must be
    accumulated into cumulative form. That conversion is stateful and depends
    on the single-writer principle — all samples of a series must reach one
    accumulator or totals get lost or double-counted.
  ref: "concepts.md#cumulative-vs-delta-temporality"

- id: metric-types-and-dimensional-data-model-031
  difficulty: intermediate
  tags: [temporality, statsd, prometheus]
  question: |
    Which pairing correctly matches a system to its typical temporality?
  options:
  - "Prometheus = delta; StatsD = cumulative"
  - "Both Prometheus and StatsD = cumulative"
  - "Prometheus = cumulative; StatsD = delta"
  - "Both Prometheus and StatsD = delta"
  answer: 2
  explanation: |
    Prometheus exemplifies cumulative temporality (pull scrapes of running
    totals), while StatsD exemplifies delta temporality (push increments from
    memory-less clients).
  ref: "concepts.md#cumulative-vs-delta-temporality"

- id: metric-types-and-dimensional-data-model-032
  difficulty: intermediate
  tags: [aggregation, promql, by-without]
  question: |
    What is the difference between `sum by (status)(...)` and
    `sum without (instance)(...)`?
  options:
  - "They are identical; the two keywords are interchangeable aliases for one another"
  - "`by` keeps only the listed labels; `without` keeps all labels except the listed
    ones"
  - "`by` drops the listed labels; `without` keeps only the listed ones"
  - "`without` can only be used inside a rate() call, whereas `by` works with any aggregator"
  answer: 1
  explanation: |
    `by` retains the labels you list and aggregates the rest away; `without`
    drops the labels you list and keeps everything else. `without` is often
    safer because newly added labels are preserved automatically.
  ref: "concepts.md#aggregating-across-dimensions"

- id: metric-types-and-dimensional-data-model-033
  difficulty: advanced
  tags: [aggregation, histogram, quantile, promql]
  question: |
    Which expression correctly computes a fleet-wide p95 latency across all
    instances from a classic histogram?
  options:
  - "avg(histogram_quantile(0.95, rate(latency_seconds_bucket[5m])))"
  - "histogram_quantile(0.95, sum(rate(latency_seconds_bucket[5m])))"
  - "sum by (le)(histogram_quantile(0.95, latency_seconds_bucket))"
  - "histogram_quantile(0.95, sum by (le)(rate(latency_seconds_bucket[5m])))"
  answer: 3
  explanation: |
    Aggregate the bucket rates across instances while KEEPING the `le` label
    (`sum by (le)`), then apply `histogram_quantile`. Averaging per-instance
    quantiles is wrong, and summing without `by (le)` destroys the buckets.
  ref: "concepts.md#aggregating-across-dimensions"

- id: metric-types-and-dimensional-data-model-034
  difficulty: intermediate
  tags: [aggregation, guideline]
  question: |
    Prometheus's naming guidance says a metric should be defined so that, over
    all its label dimensions, which operation is meaningful?
  options:
  - "Either sum() or avg() over the dimensions is meaningful"
  - "Only count() over the label dimensions is ever meaningful, never sum or avg"
  - "No aggregation over the dimensions should be meaningful for a well-designed metric"
  - "Only histogram_quantile() over the dimensions is meaningful, since raw sums are always wrong"
  answer: 0
  explanation: |
    A metric should represent the same logical thing across all its label
    values, such that either summing or averaging over the dimensions produces
    a sensible number. This is a good sanity check when designing labels.
  ref: "concepts.md#aggregating-across-dimensions"

- id: metric-types-and-dimensional-data-model-035
  difficulty: beginner
  tags: [cardinality, series]
  question: |
    What is the cardinality of a metric with labels having 5, 8, and 40
    distinct values respectively (from a single instance)?
  options:
  - "53"
  - "13"
  - "1,600"
  - "320"
  answer: 2
  explanation: |
    Series count is the product of the label value counts: 5 × 8 × 40 = 1,600
    distinct time series. Cardinality multiplies, which is why adding a label
    is so dangerous.
  ref: "concepts.md#cardinality-and-the-series-explosion"

- id: metric-types-and-dimensional-data-model-036
  difficulty: intermediate
  tags: [cardinality, labels, antipattern]
  question: |
    Which label would most likely cause a cardinality explosion?
  options:
  - "http_method with values GET/POST/PUT/DELETE"
  - "user_id containing millions of unique user identifiers"
  - "status_class with values 2xx/3xx/4xx/5xx"
  - "region with a handful of datacenter names"
  answer: 1
  explanation: |
    `user_id` is unbounded/high-cardinality; each value creates a new series,
    quickly reaching millions of series. High-cardinality identifiers belong in
    traces or logs, not metric labels. The others have small bounded value sets.
  ref: "concepts.md#cardinality-and-the-series-explosion"

- id: metric-types-and-dimensional-data-model-037
  difficulty: intermediate
  tags: [cardinality, url, normalization]
  question: |
    To keep an HTTP request metric's cardinality bounded, what should you do
    with the request path label?
  options:
  - "Normalize to a route template, e.g. /orders/{id}"
  - "Use the full raw URL including IDs, e.g. /orders/12345"
  - "Include the full query string for extra uniqueness"
  - "Add a distinct per-request UUID label to each path"
  answer: 0
  explanation: |
    Normalizing paths to route templates (`/orders/{id}`) keeps the label
    bounded. Using raw URLs with embedded IDs, query strings, or UUIDs produces
    effectively unbounded cardinality.
  ref: "concepts.md#cardinality-and-the-series-explosion"

- id: metric-types-and-dimensional-data-model-038
  difficulty: advanced
  tags: [cardinality, histogram, buckets]
  question: |
    How does adding a classic histogram (with 12 buckets) affect cardinality
    compared to a single counter, for the same label combinations?
  options:
  - "It produces exactly the same number of series as the single counter did"
  - "It halves the number of series because buckets are stored delta-encoded"
  - "It multiplies series by roughly the number of buckets plus _sum and _count (~14×
    here)"
  - "It has no effect because all buckets are folded into one shared series"
  answer: 2
  explanation: |
    Each bucket is its own series, plus `_sum` and `_count`, so a 12-bucket
    histogram is ~14 series per label combination. This is exactly why
    native/exponential histograms (a single series) reduce cardinality.
  ref: "concepts.md#cardinality-and-the-series-explosion"

- id: metric-types-and-dimensional-data-model-039
  difficulty: intermediate
  tags: [cardinality, churn]
  question: |
    What is "label churn" and why is it a cardinality concern?
  options:
  - "Labels being renamed in the exposition format faster than the scrape interval can track"
  - "Labels that silently change their declared data type between one scrape and the next"
  - "Aggregating labels away too aggressively so that distinct series collapse into one"
  - "Labels whose values are ephemeral (e.g. pod names in autoscaling), creating many
    short-lived series that linger in the index"
  answer: 3
  explanation: |
    Label churn happens when a label's values are short-lived (e.g. autoscaled
    pod names, container IDs). Each new value is a new series, and old series
    linger in the TSDB head block and index, inflating memory and query cost.
  ref: "concepts.md#cardinality-and-the-series-explosion"

- id: metric-types-and-dimensional-data-model-040
  difficulty: beginner
  tags: [naming, base-units]
  question: |
    By Prometheus convention, in what base unit should a request-duration
    metric be recorded?
  options:
  - "Milliseconds"
  - "Seconds"
  - "Nanoseconds"
  - "Whatever the client prefers"
  answer: 1
  explanation: |
    Prometheus naming guidance says to use base units: seconds for time (not
    milliseconds), bytes for size (not KB/MB). So durations are stored in
    seconds, e.g. `http_request_duration_seconds`.
  ref: "concepts.md#naming-conventions-and-base-units"

- id: metric-types-and-dimensional-data-model-041
  difficulty: intermediate
  tags: [naming, labels, antipattern]
  question: |
    Which of these follows Prometheus naming best practices?
  options:
  - "Separate metrics http_responses_200_total and http_responses_500_total"
  - "A metric named http_responses_ms with values in milliseconds"
  - "One metric http_responses_total{status=\"200\"} / {status=\"500\"}"
  - "A metric encoding the pod name in its metric name"
  answer: 2
  explanation: |
    Dimensions belong in labels, not the metric name. Use a single
    `http_responses_total` with a `status` label instead of baking the code
    into the name. Encoding labels in names is redundant and breaks
    aggregation.
  ref: "concepts.md#naming-conventions-and-base-units"

- id: metric-types-and-dimensional-data-model-042
  difficulty: intermediate
  tags: [naming, opentelemetry, prometheus]
  question: |
    How does OpenTelemetry's metric naming differ from Prometheus's, and what
    happens at export?
  options:
  - "OTel bakes units directly into the name exactly like Prometheus, so the exporter changes nothing"
  - "OTel forbids attaching labels entirely, so the exporter has to synthesize them at scrape time"
  - "OTel uses cumulative-only counters that the Prometheus exporter rejects and drops on the floor"
  - "OTel carries the unit as separate metadata and uses dot-delimited names; the
    Prometheus exporter translates dots to underscores and appends suffixes like _total"
  answer: 3
  explanation: |
    OpenTelemetry uses dot-delimited names (e.g. `http.server.request.duration`)
    and keeps unit as separate metadata. The OTel→Prometheus exporter converts
    dots to underscores and appends conventional suffixes (e.g. `_total`).
  ref: "concepts.md#naming-conventions-and-base-units"

- id: metric-types-and-dimensional-data-model-043
  difficulty: intermediate
  tags: [exposition, format, parsing]
  question: |
    Given this exposition snippet, what is the value and its meaning?

    ```
    # TYPE http_requests_total counter
    http_requests_total{method="GET",status="200"} 1027
    ```
  options:
  - "The cumulative total is 1027 GET requests with status 200 since process start"
  - "Exactly 1027 GET requests occurred during only the most recent scrape interval"
  - "1027 is the current per-second request rate already computed by the client"
  - "1027 is the 95th percentile request latency for that label combination"
  answer: 0
  explanation: |
    The exposition format shows the raw cumulative counter value (1027) for
    that specific label combination since the process started. Rates and deltas
    are derived later by the server via `rate()`/`increase()`.
  ref: "concepts.md#the-exposition-format"

- id: metric-types-and-dimensional-data-model-044
  difficulty: intermediate
  tags: [exposition, type, native-histogram]
  question: |
    In the classic text exposition format, what role does the `# TYPE` line
    play in the Prometheus server?
  options:
  - "It changes how the value is stored as a fundamentally different data structure
    for all types"
  - "It is metadata/documentation; the server flattens everything except native histograms
    into untyped float series"
  - "It is strictly required, and the server rejects any metric that omits the TYPE line"
  - "It sets the scrape interval the server uses for that particular metric family"
  answer: 1
  explanation: |
    Except for native histograms, the Prometheus server flattens all types into
    untyped float time series, so `# TYPE` acts as metadata that documents
    intent and informs tooling/OpenMetrics — it does not create a distinct
    storage structure.
  ref: "concepts.md#the-exposition-format"

- id: metric-types-and-dimensional-data-model-045
  difficulty: beginner
  tags: [exposition, scrape, pull]
  question: |
    The Prometheus text exposition format on a `/metrics` endpoint is designed
    for which collection model?
  options:
  - "Push-based, where the app actively sends its metrics to a central collector"
  - "Streaming, where samples flow continuously over a persistent WebSocket connection"
  - "Batch upload, where the endpoint accumulates and ships all metrics once per day"
  - "Pull-based, where Prometheus scrapes the endpoint on an interval"
  answer: 3
  explanation: |
    Prometheus is pull-based: the application exposes current state at
    `/metrics` and Prometheus scrapes it on a configured interval. Push systems
    (StatsD, OTLP push, Pushgateway) invert this.
  ref: "concepts.md#the-exposition-format"

- id: metric-types-and-dimensional-data-model-046
  difficulty: beginner
  tags: [choosing-type, decision]
  question: |
    You need to track "total bytes sent over the network" for graphing
    throughput. Which metric type fits best?
  options:
  - "Counter"
  - "Gauge"
  - "Summary"
  - "Histogram"
  answer: 0
  explanation: |
    Total bytes sent only accumulates (resetting on restart), so it is a
    counter. You then apply `rate()` to graph throughput in bytes/second.
  ref: "concepts.md#choosing-the-right-metric-type"

- id: metric-types-and-dimensional-data-model-047
  difficulty: intermediate
  tags: [choosing-type, distribution]
  question: |
    You need per-request latency distributions that you can aggregate across a
    fleet and slice into any percentile later, without guessing bucket
    boundaries. Which is the best modern choice?
  options:
  - "A summary with fixed quantiles"
  - "A gauge sampled every request"
  - "A native/exponential histogram"
  - "A counter of slow requests only"
  answer: 2
  explanation: |
    Native/exponential histograms give high-resolution, auto-scaling buckets in
    a single series — aggregatable across the fleet and queryable for any
    quantile at query time, without pre-choosing bucket boundaries.
  ref: "concepts.md#choosing-the-right-metric-type"

- id: metric-types-and-dimensional-data-model-048
  difficulty: beginner
  tags: [choosing-type, gauge]
  question: |
    "Current depth of a work queue" should be modeled as which type?
  options:
  - "Counter"
  - "Gauge"
  - "Histogram"
  - "Summary"
  answer: 1
  explanation: |
    Queue depth rises and falls during normal operation, so it is a gauge — an
    instantaneous snapshot you graph as-is or aggregate with sum/avg/max.
  ref: "concepts.md#choosing-the-right-metric-type"

- id: metric-types-and-dimensional-data-model-049
  difficulty: advanced
  tags: [histogram_quantile, edge-cases]
  question: |
    A classic histogram is missing the `le="+Inf"` bucket. What does
    `histogram_quantile` do?
  options:
  - "Silently synthesizes an +Inf bucket set equal to the _count series and continues"
  - "Falls back to returning the p50 estimate regardless of the requested quantile"
  - "Throws a fatal query-evaluation error that halts the entire Prometheus server"
  - "Returns NaN, because a valid classic histogram needs at least two buckets and
    the highest must be +Inf"
  answer: 3
  explanation: |
    For classic histograms, `histogram_quantile` requires at least two buckets
    and the highest bucket must have an `+Inf` upper bound; otherwise it returns
    NaN. The `+Inf` bucket is what makes `_count` and the top boundary consistent.
  ref: "concepts.md#histograms"

- id: metric-types-and-dimensional-data-model-050
  difficulty: advanced
  tags: [dimensional-model, adding-label]
  question: |
    An existing metric `orders_total{region}` has 3 regions. A developer adds a
    `customer_tier` label with 4 possible values. What is the effect on series
    count (per instance)?
  options:
  - "It becomes 12 series (3 × 4)"
  - "It stays at 3 series"
  - "It becomes 7 series (3 + 4)"
  - "It becomes 1 series because labels are free"
  answer: 0
  explanation: |
    Adding a label multiplies cardinality: 3 regions × 4 tiers = 12 series per
    instance. This is why adding labels to existing metrics must be done
    carefully — the product, not the sum, drives series growth.
  ref: "concepts.md#cardinality-and-the-series-explosion"

- id: metric-types-and-dimensional-data-model-051
  difficulty: intermediate
  tags: [gauge, promql, functions]
  question: |
    To alert "disk will be full within 4 hours" based on a gauge of free bytes,
    which function is most appropriate?
  options:
  - "rate()"
  - "histogram_quantile()"
  - "predict_linear()"
  - "increase()"
  answer: 2
  explanation: |
    `predict_linear()` fits a linear model over a gauge's recent range to
    predict its value at a future time, ideal for capacity alerts. `rate()` and
    `increase()` are for counters; `histogram_quantile()` is for histograms.
  ref: "concepts.md#gauges"

- id: metric-types-and-dimensional-data-model-052
  difficulty: advanced
  tags: [summary, histogram, cost]
  question: |
    Which statement about client-side cost is accurate?
  options:
  - "Summaries are cheaper on client CPU because they only increment plain bucket counters"
  - "Histograms are typically cheaper on the client because they just increment bucket
    counters, while summaries run a streaming quantile estimator"
  - "Both have identical client cost since each merely records a single observation"
  - "Gauges are by far the most expensive metric type to maintain in the client"
  answer: 1
  explanation: |
    A histogram observation only increments a bucket counter (cheap). A summary
    must maintain a streaming quantile estimator over a sliding window, which
    costs more client CPU and memory. This is a real trade-off when choosing.
  ref: "concepts.md#histograms-vs-summaries"

- id: metric-types-and-dimensional-data-model-053
  difficulty: intermediate
  tags: [naming, base-units, ratio]
  question: |
    Per Prometheus conventions, how should a "percentage utilized" value be
    represented?
  options:
  - "As a ratio 0–1 (base unit), letting the dashboard format it as a percentage"
  - "As a value 0–100 carrying an explicit _percent suffix on the metric name"
  - "As a counter that is incremented by one for every percentage point of use"
  - "As a summary exposing pre-computed quantiles of the utilization value"
  answer: 0
  explanation: |
    Prometheus recommends representing proportions as a ratio in the range 0–1
    (the base unit), not 0–100. Grafana can format it as a percentage for
    display. This keeps units consistent across metrics.
  ref: "concepts.md#naming-conventions-and-base-units"

- id: metric-types-and-dimensional-data-model-054
  difficulty: advanced
  tags: [tags, terminology, cross-tool]
  question: |
    The dimensional attributes attached to a measurement are called "labels" in
    Prometheus. What are the equivalent terms in OpenTelemetry and StatsD/Datadog?
  options:
  - "\"fields\" (OpenTelemetry) and \"columns\" (StatsD/Datadog)"
  - "\"dimensions\" (OpenTelemetry) and \"keys\" (StatsD/Datadog)"
  - "\"annotations\" (OpenTelemetry) and \"markers\" (StatsD/Datadog)"
  - "\"attributes\" (OpenTelemetry) and \"tags\" (StatsD/Datadog)"
  answer: 3
  explanation: |
    The same dimensional concept is called labels in Prometheus, attributes in
    OpenTelemetry, and tags in StatsD/Datadog. Knowing the vocabulary maps
    cleanly across tools is a common interview check.
  ref: "concepts.md#the-dimensional-data-model"
