topic: "PromQL Querying & Recording Rules"
domain: observability
topic_slug: promql-querying-and-recording-rules
version: 1
questions:
- id: promql-querying-and-recording-rules-001
  difficulty: beginner
  tags: [instant-vector, range-vector, value-types]
  question: |
    What does a bare selector like `http_requests_total` (no range in brackets)
    evaluate to in PromQL?
  options:
  - "A single scalar equal to the arithmetic sum of every matching series' value"
  - "A range vector containing all samples in the last scrape interval"
  - "A string value holding the metric's raw Prometheus exposition-format text"
  - "An instant vector: one sample per matching series at the evaluation instant"
  answer: 3
  explanation: |
    A bare selector returns an instant vector — for each matching series, the most recent
    sample at or before the evaluation time (within the staleness lookback). Range vectors
    are produced only with a range selector like `http_requests_total[5m]`.
  ref: "concepts.md#instant-vectors-vs-range-vectors"

- id: promql-querying-and-recording-rules-002
  difficulty: beginner
  tags: [range-vector, syntax]
  question: |
    Which expression produces a RANGE vector?
  options:
  - "http_requests_total > 100"
  - "sum(http_requests_total)"
  - "http_requests_total"
  - "http_requests_total[5m]"
  answer: 3
  explanation: |
    Only a range selector — a metric selector followed by a duration in brackets like
    `[5m]` — yields a range vector (a window of raw samples per series). Everything else
    here returns an instant vector or scalar.
  ref: "concepts.md#instant-vectors-vs-range-vectors"

- id: promql-querying-and-recording-rules-003
  difficulty: intermediate
  tags: [range-vector, graphing, type-error]
  question: |
    A user puts `http_requests_total[5m]` directly into a Grafana time-series panel and
    gets an error. Why?
  options:
  - "The 5m range exceeds the panel's configured time range, so Grafana rejects it"
  - "Grafana time-series panels only support instant queries, never range queries"
  - "A range vector is not graphable; it must be fed to a range-vector function like rate()"
  - "The metric name is misspelled, so the selector matches no series to render"
  answer: 2
  explanation: |
    A range vector is a matrix of raw samples with no single value per timestamp, so it
    cannot be plotted. It is only an input to a range-vector function (rate, increase,
    avg_over_time, ...) which returns a graphable instant vector.
  ref: "concepts.md#instant-vectors-vs-range-vectors"

- id: promql-querying-and-recording-rules-004
  difficulty: intermediate
  tags: [range-query, instant-query, api]
  question: |
    What is the difference between the `/query` (instant query) and `/query_range`
    (range query) API endpoints?
  options:
  - "/query_range can only be used to read back series produced by recording rules"
  - "/query parses standard PromQL while /query_range parses the MetricsQL dialect"
  - "/query is restricted to counter metrics and /query_range only to gauge metrics"
  - "/query evaluates the expression once at a single time; /query_range evaluates the same expression at every step across a time range"
  answer: 3
  explanation: |
    An instant query evaluates the expression once at a single instant. A range query
    re-evaluates the SAME expression at every `step` between start and end — that is what
    draws a line in a time-series panel. Value type (instant vs range vector) is a
    separate concept from query type.
  ref: "concepts.md#instant-vectors-vs-range-vectors"

- id: promql-querying-and-recording-rules-005
  difficulty: beginner
  tags: [selectors, matchers]
  question: |
    In `http_requests_total{status=~"5.."}`, what does the `=~` operator mean?
  options:
  - "The numeric value of the status label is strictly greater than 5"
  - "status label equals exactly the literal three-character string \"5..\""
  - "status label is absent from the series entirely"
  - "status label matches the regular expression 5.."
  answer: 3
  explanation: |
    `=~` is the regex-match matcher. `status=~"5.."` selects series whose status label
    matches the RE2 regex `5..` (fully anchored) — i.e. 5xx codes.
  ref: "concepts.md#selectors-and-label-matchers"

- id: promql-querying-and-recording-rules-006
  difficulty: intermediate
  tags: [selectors, regex, anchoring]
  question: |
    A user writes `{path=~"users"}` expecting to match paths that CONTAIN "users" (like
    "/api/users/42") but gets nothing. Why, and what's the fix?
  options:
  - "PromQL regexes are fully anchored, so \"users\" means ^users$; use \".*users.*\""
  - "Regex matching in PromQL is only permitted on the reserved __name__ label"
  - "The path label must be explicitly declared and indexed before regex will match it"
  - "Regex matchers aren't supported on labels at all; switch to =, and no substring fix exists"
  answer: 0
  explanation: |
    PromQL regex matchers are fully anchored (implicitly ^...$), so `users` only matches
    the exact string "users", not a substring. Use `.*users.*` for a contains match.
  ref: "concepts.md#selectors-and-label-matchers"

- id: promql-querying-and-recording-rules-007
  difficulty: advanced
  tags: [selectors, metric-name, label]
  question: |
    Which statement about the metric name in PromQL is correct?
  options:
  - "The metric name is the reserved label __name__, so {__name__=~\"http_.*\"} matches by name"
  - "The metric name must always be written before the { } braces"
  - "The metric name is stored separately and cannot be matched with a regex"
  - "Two series can share a name only if all labels are identical"
  answer: 0
  explanation: |
    The metric name is just the special label `__name__`. So `http_requests_total` is
    sugar for `{__name__="http_requests_total"}`, and you can match names by regex via
    `{__name__=~"http_.*"}`.
  ref: "concepts.md#selectors-and-label-matchers"

- id: promql-querying-and-recording-rules-008
  difficulty: advanced
  tags: [selectors, empty-matcher]
  question: |
    What does the matcher `{env=~""}` (empty regex) select?
  options:
  - "Nothing — an empty regex is rejected by the parser as a syntax error"
  - "Series that do NOT have the env label at all"
  - "Every series in the entire database, since an empty pattern matches all"
  - "Series where env equals the literal two-character empty-quote sequence"
  answer: 1
  explanation: |
    An empty-regex matcher `label=~""` matches series that lack that label entirely
    (a missing label is treated as the empty string). It's the idiomatic way to select
    "series missing label X."
  ref: "concepts.md#selectors-and-label-matchers"

- id: promql-querying-and-recording-rules-009
  difficulty: beginner
  tags: [rate, counter]
  question: |
    What does `rate(http_requests_total[5m])` compute?
  options:
  - "The average per-second rate of increase of the counter over the last 5 minutes"
  - "The total number of requests in exactly the last 5 minutes as an integer"
  - "The current absolute value of the counter at the evaluation instant"
  - "The 95th-percentile request latency observed over the last 5 minutes"
  answer: 0
  explanation: |
    rate() returns the per-second average rate of increase of a counter over the range
    window, automatically handling counter resets and extrapolating to the window edges.
  ref: "concepts.md#rate-vs-irate-vs-increase"

- id: promql-querying-and-recording-rules-010
  difficulty: intermediate
  tags: [irate, rate, difference]
  question: |
    How does `irate()` differ from `rate()`?
  options:
  - "irate returns a cumulative total count while rate returns a per-second value"
  - "irate silently ignores counter resets whereas rate corrects for them"
  - "irate is defined only for gauge metrics while rate is defined only for counters"
  - "irate uses only the last two samples in the window (spiky, responsive); rate averages over the whole window (smooth)"
  answer: 3
  explanation: |
    irate() computes an instant rate from only the final two samples in the range, making
    it highly responsive but spiky — good for high-resolution graphs. rate() averages
    across the whole window and is preferred for alerting and slow dashboards. Both handle
    resets and require counters.
  ref: "concepts.md#rate-vs-irate-vs-increase"

- id: promql-querying-and-recording-rules-011
  difficulty: intermediate
  tags: [increase, rate, relationship]
  question: |
    Which query gives the total number of requests over the last hour?
  options:
  - "increase(http_requests_total[1h])"
  - "irate(http_requests_total[1h])"
  - "http_requests_total offset 1h"
  - "rate(http_requests_total[1h])"
  answer: 0
  explanation: |
    increase() returns the total increase of a counter over the window (equal to
    rate() * window-seconds). rate/irate return per-second values, and `offset 1h` just
    shifts the evaluation time.
  ref: "concepts.md#rate-vs-irate-vs-increase"

- id: promql-querying-and-recording-rules-012
  difficulty: intermediate
  tags: [rate, gauge, mistake]
  question: |
    Why should you never apply `rate()` to a gauge (e.g. `rate(node_memory_MemFree_bytes[5m])`)?
  options:
  - "rate assumes the series is monotonically increasing, so every legitimate decrease is misread as a counter reset, inflating the result"
  - "rate accepts only integer-valued samples, and gauges are stored as floating-point values"
  - "rate always returns exactly zero when applied to any gauge metric"
  - "Gauge metrics can't be scraped by Prometheus at all, so rate has no input"
  answer: 0
  explanation: |
    rate/irate/increase assume monotonic counters and treat any decrease as a reset. On a
    gauge, normal downward movement is misinterpreted, badly inflating the output. Use
    deriv() or delta() for a gauge's rate of change.
  ref: "concepts.md#rate-vs-irate-vs-increase"

- id: promql-querying-and-recording-rules-013
  difficulty: advanced
  tags: [increase, extrapolation, gotcha]
  question: |
    `increase(errors_total[1h])` on an integer counter returns 3.4. Is this a bug?
  options:
  - "No — but only because the counter was declared as a float rather than an integer type"
  - "Yes — increase() is documented to always round its output to a whole integer"
  - "No — rate/increase extrapolate to the exact window boundaries, so fractional results are expected"
  - "Yes — a fractional result specifically signals that the counter reset during the window"
  answer: 2
  explanation: |
    rate() and increase() extrapolate to the precise window edges rather than counting raw
    deltas, so non-integer results are normal and correct — the value estimates the true
    increase at the boundaries.
  ref: "concepts.md#rate-vs-irate-vs-increase"

- id: promql-querying-and-recording-rules-014
  difficulty: intermediate
  tags: [rate, window, scrape-interval]
  question: |
    With a 60-second scrape interval, why is `rate(http_requests_total[1m])` a poor choice?
  options:
  - "rate requires its range window to be an exact multiple of 5 minutes"
  - "It will double-count every request, doubling the reported rate"
  - "A 1m window on a 60s scrape often contains fewer than two samples, so rate returns nothing or is very noisy"
  - "Range windows shorter than 5 minutes are simply not allowed in PromQL"
  answer: 2
  explanation: |
    rate needs at least two samples per window. A window equal to the scrape interval
    frequently has only one sample. The rule of thumb is a window of at least 2x (ideally
    >=4x) the scrape interval so evaluation is reliable and smooth.
  ref: "concepts.md#rate-vs-irate-vs-increase"

- id: promql-querying-and-recording-rules-015
  difficulty: beginner
  tags: [aggregation, by, grouping]
  question: |
    What does `sum(rate(http_requests_total[5m])) by (job)` produce?
  options:
  - "A single series holding the grand total request rate summed across everything"
  - "One separate output series for each individual instance"
  - "The request rate for only the single busiest job in the fleet"
  - "One series per job: the total request rate for each job"
  answer: 3
  explanation: |
    `by (job)` keeps only the job label and aggregates away all others, so you get one
    summed rate series per job. Without a by/without clause, sum collapses to a single
    series.
  ref: "concepts.md#aggregation-operators-and-grouping-by--without"

- id: promql-querying-and-recording-rules-016
  difficulty: intermediate
  tags: [aggregation, by, without]
  question: |
    What is the difference between `by (labels)` and `without (labels)` in an aggregation?
  options:
  - "by keeps only the listed labels; without drops the listed labels and keeps the rest"
  - "The without clause is only valid when paired with the count aggregation operator"
  - "by can only be applied to counter metrics, while without applies only to gauges"
  - "They are just two aliases that produce exactly the same grouping behavior"
  answer: 0
  explanation: |
    `by (labels)` retains only the listed labels in the output; `without (labels)` removes
    the listed labels and preserves everything else. They are two complementary ways to
    choose the grouping dimension.
  ref: "concepts.md#aggregation-operators-and-grouping-by--without"

- id: promql-querying-and-recording-rules-017
  difficulty: advanced
  tags: [aggregation, avg-of-averages, ratio]
  question: |
    To compute a fleet-wide error ratio, which approach is correct?
  options:
  - "avg by (instance) of each instance's ratio, then avg again"
  - "max(rate(errors_total[5m])) / max(rate(requests_total[5m]))"
  - "avg(rate(errors_total[5m]) / rate(requests_total[5m]))"
  - "sum(rate(errors_total[5m])) / sum(rate(requests_total[5m]))"
  answer: 3
  explanation: |
    Averaging per-instance ratios is avg-of-averages and ignores that instances handle
    different volumes. Aggregate numerator and denominator separately with sum, then
    divide, for a correctly weighted fleet ratio.
  ref: "concepts.md#aggregation-operators-and-grouping-by--without"

- id: promql-querying-and-recording-rules-018
  difficulty: intermediate
  tags: [topk, aggregation]
  question: |
    What does `topk(5, sum(rate(http_requests_total[5m])) by (path))` return?
  options:
  - "The five series (with labels) having the highest summed rate, selected per evaluation timestamp"
  - "The five paths that have the LOWEST summed request rate instead"
  - "A single scalar value equal to the 5th-highest per-path rate"
  - "The arithmetic average of the top five paths' request rates"
  answer: 0
  explanation: |
    topk returns the actual top-k series (preserving labels), not a scalar. It selects per
    evaluation timestamp, so on a range query the membership of the top 5 can change
    between steps.
  ref: "concepts.md#aggregation-operators-and-grouping-by--without"

- id: promql-querying-and-recording-rules-019
  difficulty: beginner
  tags: [histogram, buckets, le]
  question: |
    A classic Prometheus histogram named `http_request_duration_seconds` exposes which
    series?
  options:
  - "A single series holding a JSON histogram"
  - "_bucket{le=...}, _sum, and _count series"
  - "_min, _max, _avg, and _stddev series"
  - "Only http_request_duration_seconds with a quantile label"
  answer: 1
  explanation: |
    A classic histogram exposes cumulative `_bucket{le="..."}` counters, a `_sum` of all
    observations, and a `_count` of observations. Quantiles are computed at query time via
    histogram_quantile over the buckets.
  ref: "concepts.md#histogram_quantile-over-_bucket-and-the-le-label"

- id: promql-querying-and-recording-rules-020
  difficulty: intermediate
  tags: [histogram_quantile, le, correctness]
  question: |
    Which query correctly estimates the 95th-percentile request latency over 5 minutes?
  options:
  - "histogram_quantile(0.95, rate(http_request_duration_seconds_sum[5m]))"
  - "avg(rate(http_request_duration_seconds_bucket[5m])) > 0.95"
  - "quantile(0.95, rate(http_request_duration_seconds[5m]))"
  - "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))"
  answer: 3
  explanation: |
    The idiomatic form takes a rate of the _bucket series, sums by le (preserving the le
    label needed by the function), and passes it to histogram_quantile. Using _sum or the
    generic quantile() operator is wrong.
  ref: "concepts.md#histogram_quantile-over-_bucket-and-the-le-label"

- id: promql-querying-and-recording-rules-021
  difficulty: advanced
  tags: [histogram_quantile, le, pitfall]
  question: |
    Why does `histogram_quantile(0.95, sum(rate(..._bucket[5m])) by (job))` return
    nothing useful?
  options:
  - "The `le` label was dropped by aggregating with `by (job)`, and histogram_quantile needs buckets grouped by le"
  - "rate() rejects _bucket series because their le label makes them non-monotonic"
  - "job is a reserved label that histogram_quantile refuses to group buckets by"
  - "0.95 exceeds the 0.90 maximum quantile that histogram_quantile will accept"
  answer: 0
  explanation: |
    histogram_quantile needs the per-bucket boundaries, i.e. the `le` label, to interpolate.
    Aggregating with `by (job)` alone drops le. You must include le (and any slice
    dimension) in the by clause: `by (job, le)`.
  ref: "concepts.md#histogram_quantile-over-_bucket-and-the-le-label"

- id: promql-querying-and-recording-rules-022
  difficulty: advanced
  tags: [histogram, plus-inf, buckets]
  question: |
    Why does a classic histogram require a `+Inf` bucket?
  options:
  - "To store observations that fell below the smallest le bucket boundary"
  - "It is only needed for client-side summaries, since histograms already expose _count"
  - "It marks the series as a native exponential histogram rather than a classic one"
  - "It represents all observations (equal to _count) and anchors the top of the distribution for quantile estimation"
  answer: 3
  explanation: |
    The +Inf bucket counts every observation (equal to _count). Without it,
    histogram_quantile cannot anchor the top of the cumulative distribution, so quantiles
    near the tail cannot be computed.
  ref: "concepts.md#histogram_quantile-over-_bucket-and-the-le-label"

- id: promql-querying-and-recording-rules-023
  difficulty: advanced
  tags: [histogram, summary, aggregation]
  question: |
    Why are histograms preferred over client-side summaries when you need to aggregate
    latency across many instances?
  options:
  - "Summaries cannot expose a _count series, so per-instance sample totals are lost"
  - "Histograms are the only metric type that Prometheus permits to carry custom labels"
  - "Histogram bucket counters can be summed across instances and then have a quantile computed; summary quantiles are computed client-side and cannot be validly combined"
  - "Summaries use several times more memory per series than an equivalent histogram does"
  answer: 2
  explanation: |
    Histogram buckets are additive: sum them across instances, then apply
    histogram_quantile. Summary quantiles are precomputed per instance and are not linearly
    combinable, so you cannot aggregate them into a fleet-wide percentile.
  ref: "concepts.md#histogram_quantile-over-_bucket-and-the-le-label"

- id: promql-querying-and-recording-rules-024
  difficulty: advanced
  tags: [histogram, accuracy, bucket-layout]
  question: |
    What primarily bounds the accuracy of a `histogram_quantile()` estimate on a classic
    histogram?
  options:
  - "The number of instances whose bucket series are summed together before interpolation"
  - "The choice of bucket boundaries — the result is linearly interpolated within the bucket the quantile falls into"
  - "The scrape interval, since each additional sample sharpens the interpolated estimate"
  - "The PromQL evaluation timeout configured for the query engine on the Prometheus server"
  answer: 1
  explanation: |
    histogram_quantile interpolates linearly inside the matching bucket, so a coarse bucket
    spanning, say, 1s-10s yields a rough estimate. You must lay out buckets around the SLO
    thresholds you care about.
  ref: "concepts.md#histogram_quantile-over-_bucket-and-the-le-label"

- id: promql-querying-and-recording-rules-025
  difficulty: intermediate
  tags: [native-histogram, exponential]
  question: |
    What advantage do native (exponential) histograms have over classic histograms?
  options:
  - "They eliminate the need for the _count and _sum series that classic histograms carry"
  - "A single series with dynamically-sized exponential buckets gives higher resolution and much lower cardinality than one series per bucket"
  - "They store the distribution as a base64-encoded string payload rather than numeric samples"
  - "They can only be queried with irate(), since rate() cannot decode their bucket schema"
  answer: 1
  explanation: |
    Native histograms pack the distribution into a single series with exponential buckets,
    giving high resolution without the cardinality explosion of one _bucket series per le.
    histogram_quantile and dedicated functions work on them.
  ref: "concepts.md#histogram_quantile-over-_bucket-and-the-le-label"

- id: promql-querying-and-recording-rules-026
  difficulty: beginner
  tags: [offset, comparison]
  question: |
    What does `http_requests_total offset 1h` return?
  options:
  - "The value of the series as of one hour before the evaluation time"
  - "A one-hour range vector containing every raw sample scraped in the last hour"
  - "The value the series is forecast to reach one hour into the future"
  - "The per-second average rate of the series computed over the last hour"
  answer: 0
  explanation: |
    `offset 1h` shifts the selector one hour into the past relative to the evaluation time,
    which is how you build hour-over-hour or week-over-week comparisons.
  ref: "concepts.md#offset-and-the--modifier"

- id: promql-querying-and-recording-rules-027
  difficulty: intermediate
  tags: [offset, comparison, scenario]
  question: |
    Which expression shows how much the 5m request rate has grown compared to one hour ago?
  options:
  - "rate(http_requests_total[1h]) - rate(http_requests_total[5m])"
  - "rate(http_requests_total[5m]) - rate(http_requests_total[5m] offset 1h)"
  - "increase(http_requests_total[1h])"
  - "rate(http_requests_total[5m]) offset 1h"
  answer: 1
  explanation: |
    Subtract the offset expression (rate as of one hour ago) from the current rate. Note
    that `offset` attaches to the selector/range vector inside rate, not the whole
    expression.
  ref: "concepts.md#offset-and-the--modifier"

- id: promql-querying-and-recording-rules-028
  difficulty: advanced
  tags: [at-modifier, timestamp]
  question: |
    How does the `@` modifier differ from `offset`?
  options:
  - "@ only works inside recording rules, whereas offset is valid in any ad-hoc query"
  - "@ pins a selector to a fixed absolute Unix timestamp (or start()/end()); offset shifts relative to the evaluation time"
  - "@ shifts the selector relative to eval time, while offset pins it to an absolute timestamp"
  - "They are identical aliases and produce exactly the same time-shifted result"
  answer: 1
  explanation: |
    `offset` is relative to the query's evaluation time and moves as the window slides. The
    `@` modifier (Prometheus 2.25+) pins the selector to a fixed absolute Unix timestamp, or
    to `start()`/`end()`, so it stays constant across all steps of a range query.
  ref: "concepts.md#offset-and-the--modifier"

- id: promql-querying-and-recording-rules-029
  difficulty: expert
  tags: [at-modifier, offset, combination]
  question: |
    Which statement about combining `@` and `offset` is correct?
  options:
  - "@ always overrides offset, so any offset on the same selector is silently ignored"
  - "They cannot be combined in one selector; the parser rejects using both together"
  - "They can be combined, and offset may be negative (looking into the future relative to the @ anchor)"
  - "offset must always be positive and numerically larger than the @ timestamp value"
  answer: 2
  explanation: |
    `@` and `offset` can be combined; the offset can be negative, letting you look forward
    relative to the pinned `@` anchor (e.g. `@ end() offset -10m`). The modifiers attach to
    the selector/subquery.
  ref: "concepts.md#offset-and-the--modifier"

- id: promql-querying-and-recording-rules-030
  difficulty: intermediate
  tags: [subquery, syntax]
  question: |
    What does the subquery `rate(http_requests_total[5m])[1h:1m]` do?
  options:
  - "Computes a single rate over one 1-hour window while sampling raw points every 5m"
  - "Evaluates the inner rate(...[5m]) expression every 1m over the last 1h, yielding a range vector"
  - "Multiplies the computed 5m rate by a factor of 60 to convert it to per-minute units"
  - "Is a syntax error, because rate already returns an instant vector that cannot be sliced"
  answer: 1
  explanation: |
    A subquery `expr[range:resolution]` turns an instant-vector expression into a range
    vector by evaluating the inner expression at the given resolution across the range.
    Here rate(...[5m]) is sampled every 1m over the last hour.
  ref: "concepts.md#subqueries"

- id: promql-querying-and-recording-rules-031
  difficulty: advanced
  tags: [subquery, cost, performance]
  question: |
    What is the main performance concern with subqueries?
  options:
  - "They evaluate the inner expression at every resolution step, which can be expensive; a recording rule is often better for the inner series"
  - "They cannot be used in Grafana panels, only in the raw Prometheus expression browser"
  - "They permanently disable the query result cache for every subsequent request on that server"
  - "They only work on gauge metrics and silently return nothing when applied to counters"
  answer: 0
  explanation: |
    Subqueries re-run the inner expression at each resolution step, so they are costly,
    especially nested. When the inner series is reused, precompute it with a recording rule
    instead of leaving a subquery in a hot alert.
  ref: "concepts.md#subqueries"

- id: promql-querying-and-recording-rules-032
  difficulty: expert
  tags: [subquery, scenario, over-time]
  question: |
    You want the maximum 5-minute request rate observed at any point in the last hour.
    Which is correct?
  options:
  - "max(rate(http_requests_total[5m]))"
  - "max_over_time(rate(http_requests_total[5m])[1h:])"
  - "rate(max_over_time(http_requests_total[1h])[5m:])"
  - "max(http_requests_total[1h])"
  answer: 1
  explanation: |
    max_over_time consumes a range vector. To get a range of the rate expression you need a
    subquery: `rate(...[5m])[1h:]`, then max_over_time picks the peak. `max()` only
    aggregates across series at one instant, not over time.
  ref: "concepts.md#subqueries"

- id: promql-querying-and-recording-rules-033
  difficulty: beginner
  tags: [vector-matching, one-to-one]
  question: |
    By default, how do binary operators between two instant vectors match series?
  options:
  - "One-to-one: each left series matches the one right series with an identical label set; unmatched series are dropped"
  - "By metric name only, ignoring every other label present on the two series"
  - "By the position or index each series occupies in the two result sets"
  - "They always produce a full cartesian product of both sides' series"
  answer: 0
  explanation: |
    Default matching is one-to-one on the full label set. Only series with an exact
    label-set match on both sides combine; series without a partner are dropped from the
    result.
  ref: "concepts.md#vector-matching-one-to-one-onignoring-group_leftgroup_right"

- id: promql-querying-and-recording-rules-034
  difficulty: intermediate
  tags: [vector-matching, on, ignoring]
  question: |
    What do the `on` and `ignoring` clauses control in vector matching?
  options:
  - "Which labels are used to match series: `on` matches using only the listed labels; `ignoring` matches on all labels except those listed"
  - "The staleness lookback window applied to each side of the operation"
  - "The order in which the left and right expressions are evaluated"
  - "Whether the resulting series is typed as a counter or as a gauge"
  answer: 0
  explanation: |
    `on (labels)` restricts matching to only the listed labels; `ignoring (labels)` matches
    on everything except the listed labels. Both let you combine metrics that share only a
    subset of labels.
  ref: "concepts.md#vector-matching-one-to-one-onignoring-group_leftgroup_right"

- id: promql-querying-and-recording-rules-035
  difficulty: advanced
  tags: [vector-matching, group_left, many-to-one]
  question: |
    A query joining a per-instance rate against a small `node_build_info` metric fails with
    "multiple matches for labels: many-to-one matching must be explicit." What fixes it?
  options:
  - "Remove the on() clause so matching falls back to the full label set"
  - "Add group_left (or group_right) to declare the many-to-one match explicitly"
  - "Wrap both sides in sum() to collapse the duplicate matches into one series"
  - "Change the binary operator from * to + so the extra matches are added"
  answer: 1
  explanation: |
    Prometheus refuses implicit many-to-one matches. You declare intent with `group_left`
    (right side is the "one") or `group_right` (left side is the "one"), optionally naming
    extra labels to copy from the "many" side.
  ref: "concepts.md#vector-matching-one-to-one-onignoring-group_leftgroup_right"

- id: promql-querying-and-recording-rules-036
  difficulty: expert
  tags: [vector-matching, group_left, labels]
  question: |
    In `A * on (instance) group_left(version) B`, what does the `(version)` list specify?
  options:
  - "The grouping dimension used by a surrounding sum/avg aggregation operator"
  - "Labels to strip from the result series once the multiplication completes"
  - "The extra labels copied from the 'one' side (B) onto the result"
  - "The set of labels the two sides are joined on, overriding the on() clause"
  answer: 2
  explanation: |
    The label list in group_left(...)/group_right(...) names the additional labels pulled
    from the "one" side onto the result series. Matching itself is governed by the on/
    ignoring clause (here, instance).
  ref: "concepts.md#vector-matching-one-to-one-onignoring-group_leftgroup_right"

- id: promql-querying-and-recording-rules-037
  difficulty: advanced
  tags: [vector-matching, set-operators]
  question: |
    What does the `unless` set operator do in `A unless B`?
  options:
  - "Subtracts each value in B from the matching value in A"
  - "Keeps series from A that have NO matching series in B"
  - "Keeps series from A that DO have a match in B"
  - "Returns the set union of both A's and B's series"
  answer: 1
  explanation: |
    `unless` is a set operator: it keeps left-hand series that have no match on the right.
    `and` keeps left series that DO have a match, and `or` unions the two sides. These
    filter series rather than doing arithmetic.
  ref: "concepts.md#vector-matching-one-to-one-onignoring-group_leftgroup_right"

- id: promql-querying-and-recording-rules-038
  difficulty: beginner
  tags: [recording-rules, purpose]
  question: |
    What is a recording rule in Prometheus?
  options:
  - "A rule that evaluates a condition and pushes a firing alert to Alertmanager when it becomes true"
  - "A configuration that captures every raw scrape response verbatim and writes it straight to disk"
  - "A rule that precomputes a PromQL expression on the evaluation interval and stores the result as a new time series"
  - "A periodic schedule that snapshots the TSDB blocks to durable backup storage for recovery"
  answer: 2
  explanation: |
    A recording rule evaluates an expression periodically and saves the output as a new
    series, so expensive queries are computed once and read cheaply. Alerting rules, by
    contrast, evaluate conditions and fire notifications.
  ref: "concepts.md#recording-rules-and-the-levelmetricoperation-naming-convention"

- id: promql-querying-and-recording-rules-039
  difficulty: intermediate
  tags: [recording-rules, benefits]
  question: |
    Besides performance, what is a key benefit of pointing both a dashboard and an alert at
    the same recorded series?
  options:
  - "It turns off staleness handling so the recorded series never expires from results"
  - "It shrinks the server's on-disk usage to zero by storing only the rule definition"
  - "It lets the server skip the scrape step and derive the series without any targets"
  - "It guarantees the alert and the dashboard evaluate the exact same number, avoiding drift"
  answer: 3
  explanation: |
    Referencing one recorded series ensures the alert fires on the same value the dashboard
    displays — correctness/consistency — in addition to the performance win of computing the
    expensive expression once.
  ref: "concepts.md#recording-rules-and-the-levelmetricoperation-naming-convention"

- id: promql-querying-and-recording-rules-040
  difficulty: intermediate
  tags: [recording-rules, naming-convention]
  question: |
    The Prometheus recording-rule naming convention is `level:metric:operations`. What does
    `job:http_requests:rate5m` mean?
  options:
  - "Per-job aggregation of the http_requests metric, as a 5-minute rate"
  - "An alert that fires whenever a job's request rate climbs above 5"
  - "A server-side limit capping each job at 5 requests per second"
  - "A raw scraped metric that happens to carry three labels"
  answer: 0
  explanation: |
    level = the grouping dimension (job), metric = the source metric (http_requests),
    operations = what was applied (rate5m). So it reads "per-job 5-minute rate of
    http_requests." Colons signal a derived series.
  ref: "concepts.md#recording-rules-and-the-levelmetricoperation-naming-convention"

- id: promql-querying-and-recording-rules-041
  difficulty: advanced
  tags: [recording-rules, colon-convention]
  question: |
    Why is a colon in a metric name a reliable signal that the series comes from a recording
    rule?
  options:
  - "Alertmanager rewrites every incoming metric name to insert colons before storing it"
  - "The Prometheus text exposition format mandates a colon separator in every metric name"
  - "Prometheus's own scraped metrics never contain colons by convention, so colons are reserved for derived (recorded) series"
  - "A colon is the reserved delimiter that encodes the metric's type such as counter or gauge"
  answer: 2
  explanation: |
    By convention, directly-instrumented metric names do not use colons; colons are reserved
    for recording rules. So a name like `level:metric:op` self-documents that the series is
    derived.
  ref: "concepts.md#recording-rules-and-the-levelmetricoperation-naming-convention"

- id: promql-querying-and-recording-rules-042
  difficulty: advanced
  tags: [recording-rules, evaluation-order, groups]
  question: |
    Within a single rule group, how are rules evaluated, and why does it matter?
  options:
  - "All rules in the group run concurrently on separate workers, so their written order is irrelevant"
  - "Sequentially in file order, so a later rule can build on a series recorded by an earlier rule in the same group"
  - "In a shuffled order chosen per interval, so every rule must be fully independent of the others"
  - "Only the first rule in each group is evaluated; the remaining rules serve as fallbacks"
  answer: 1
  explanation: |
    Rules in one group run sequentially in the order written, so chained aggregations work
    (a later rule can consume an earlier rule's output). Different groups run independently/
    in parallel.
  ref: "concepts.md#recording-rules-and-the-levelmetricoperation-naming-convention"

- id: promql-querying-and-recording-rules-043
  difficulty: beginner
  tags: [staleness]
  question: |
    By default, how long after a series stops being reported will an instant query still
    return its last sample (the staleness lookback)?
  options:
  - "1 hour"
  - "15 seconds"
  - "5 minutes"
  - "Forever, until the value changes"
  answer: 2
  explanation: |
    The default staleness lookback (query.lookback-delta) is 5 minutes: an instant query
    returns the most recent sample within that window, after which the series is considered
    stale and disappears.
  ref: "concepts.md#staleness-counter-resets-and-common-pitfalls"

- id: promql-querying-and-recording-rules-044
  difficulty: advanced
  tags: [staleness, stale-markers]
  question: |
    Since Prometheus 2.0, what happens when a target disappears or a series stops being
    scraped?
  options:
  - "An explicit stale marker (a special NaN) is inserted so the series goes stale on the next evaluation instead of lingering for the full lookback window"
  - "The series' last observed value is carried forward and repeated on every evaluation indefinitely"
  - "The entire TSDB block containing that series is dropped from disk on the next compaction"
  - "The series is immediately backfilled with zero samples for the whole lookback window"
  answer: 0
  explanation: |
    Prometheus inserts explicit stale markers (a special NaN) when a target/series
    disappears, so the series becomes stale on the next evaluation rather than persisting up
    to the 5m lookback. This is why graphs drop the series promptly when a pod dies.
  ref: "concepts.md#staleness-counter-resets-and-common-pitfalls"

- id: promql-querying-and-recording-rules-045
  difficulty: intermediate
  tags: [counter-reset, restart, mistake]
  question: |
    Why is computing `http_requests_total - http_requests_total offset 5m` a bad way to get
    request growth?
  options:
  - "The offset modifier is not permitted on either operand of a subtraction expression"
  - "It ignores counter resets: on a process restart the counter drops to 0, making the difference negative"
  - "The subtraction operator is undefined between two counter-typed series in PromQL"
  - "It always collapses to a constant equal to the configured scrape interval in seconds"
  answer: 1
  explanation: |
    Manual counter deltas don't account for resets. When the process restarts, the counter
    resets to 0 and the raw difference goes negative. rate()/increase() handle resets
    correctly and should be used instead.
  ref: "concepts.md#staleness-counter-resets-and-common-pitfalls"

- id: promql-querying-and-recording-rules-046
  difficulty: advanced
  tags: [resets, counter, function]
  question: |
    What does `resets(http_requests_total[1h])` return?
  options:
  - "The counter's per-second average rate of increase computed across the one-hour window"
  - "The value the counter held exactly one hour before the evaluation instant"
  - "The counter's total increase over the one-hour window, corrected for resets"
  - "The number of times the counter reset (decreased) within the window — useful for spotting crash-looping"
  answer: 3
  explanation: |
    resets() counts how many counter resets occurred in the range window. A high count can
    indicate a process that is repeatedly restarting/crash-looping.
  ref: "concepts.md#staleness-counter-resets-and-common-pitfalls"

- id: promql-querying-and-recording-rules-047
  difficulty: intermediate
  tags: [gauge, deriv, delta]
  question: |
    To estimate the per-second rate of change of a GAUGE (e.g. queue depth), which function
    is appropriate?
  options:
  - "histogram_quantile(), reading the gauge's implicit bucket boundaries"
  - "increase(), which totals the gauge's rise over the window"
  - "deriv() (least-squares slope) or delta()"
  - "rate(), the standard per-second rate-of-change function"
  answer: 2
  explanation: |
    For gauges use deriv() (per-second least-squares slope) or delta() (difference over the
    window). rate/increase are for counters and mishandle a gauge's legitimate decreases.
  ref: "concepts.md#staleness-counter-resets-and-common-pitfalls"

- id: promql-querying-and-recording-rules-048
  difficulty: intermediate
  tags: [percentiles, aggregation, mistake]
  question: |
    Why can't you compute a fleet p99 by averaging each instance's p99 latency?
  options:
  - "The average of per-instance p99s always overestimates the true fleet p99 by exactly 1%"
  - "The p99 quantile is mathematically defined only per individual instance, never for a fleet"
  - "Averaging the per-instance p99 values is far too slow to evaluate at query time"
  - "Percentiles are not linearly combinable; you must sum the histogram buckets across instances and then apply histogram_quantile"
  answer: 3
  explanation: |
    Quantiles/percentiles cannot be validly averaged. Because histogram buckets are
    additive, you sum the buckets across instances first and then compute
    histogram_quantile to get a correct fleet-wide percentile.
  ref: "concepts.md#staleness-counter-resets-and-common-pitfalls"

- id: promql-querying-and-recording-rules-049
  difficulty: beginner
  tags: [rate, irate, alerting]
  question: |
    For an alerting rule that should not be noisy, which is generally preferred?
  options:
  - "The raw counter value, since it monotonically increases and never dips"
  - "rate(), because it averages over the window and is smoother"
  - "irate(), because it reacts instantly to every spike"
  - "delta(), because it ignores the window and reports the absolute change"
  answer: 1
  explanation: |
    rate() averages across the whole window and is smoother, making it the standard choice
    for alerting. irate() uses only the last two samples and is spiky, so it tends to cause
    flapping alerts.
  ref: "concepts.md#rate-vs-irate-vs-increase"

- id: promql-querying-and-recording-rules-050
  difficulty: intermediate
  tags: [recording-rules, alerting-rules, difference]
  question: |
    Which best distinguishes a recording rule from an alerting rule?
  options:
  - "A recording rule stores a new time series; an alerting rule evaluates a condition and fires to Alertmanager when true for its `for` duration"
  - "Recording rules require PromQL; alerting rules use YAML expressions only"
  - "Alerting rules are forbidden from referencing any series produced by a recording rule"
  - "Recording rules run only once at startup; alerting rules run continuously"
  answer: 0
  explanation: |
    A recording rule persists a computed series; an alerting rule evaluates a boolean
    condition and, once it holds for the configured `for` duration, sends an alert to
    Alertmanager. Both live in rule files and alerting rules commonly reference recorded
    series.
  ref: "concepts.md#recording-rules-and-the-levelmetricoperation-naming-convention"

- id: promql-querying-and-recording-rules-051
  difficulty: advanced
  tags: [aggregation, count, count_values]
  question: |
    What does `count(up == 1) by (job)` return?
  options:
  - "The average scrape duration in seconds aggregated per job"
  - "A single boolean per job: 1 when the job is up, otherwise 0"
  - "The number of currently-up instances (series) per job"
  - "The arithmetic sum of the up metric's values per job"
  answer: 2
  explanation: |
    `up == 1` filters to series where the scrape succeeded; count(...) by (job) then counts
    how many such series exist per job — i.e. the number of healthy instances per job.
  ref: "concepts.md#aggregation-operators-and-grouping-by--without"

- id: promql-querying-and-recording-rules-052
  difficulty: expert
  tags: [scenario, histogram_quantile, rate]
  question: |
    An engineer writes `histogram_quantile(0.99, http_request_duration_seconds_bucket)`
    (no rate, no sum-by-le) and gets a nearly-constant, wrong-looking p99. What are the two
    problems?
  options:
  - "0.99 should be written as 99, and the metric name is wrong"
  - "It uses cumulative-since-start bucket totals instead of a rate over a window, and it hasn't aggregated buckets by le (relying on incidental le presence), so the estimate is dominated by all-time data"
  - "http_request_duration_seconds_bucket is a gauge and needs deriv()"
  - "The quantile 0.99 is invalid, and buckets must be summed"
  answer: 1
  explanation: |
    Passing raw _bucket counters gives quantiles over all-time cumulative counts, which
    barely move; you almost always want a quantile of a rate over a recent window
    (`rate(..._bucket[5m])`) aggregated `by (le)`. That yields a meaningful, current p99.
  ref: "concepts.md#histogram_quantile-over-_bucket-and-the-le-label"

- id: promql-querying-and-recording-rules-053
  difficulty: intermediate
  tags: [scenario, recording-rule, expression]
  question: |
    You have a slow dashboard panel running
    `sum(rate(http_requests_total{status=~"5.."}[5m])) by (job) / sum(rate(http_requests_total[5m])) by (job)`
    that also backs an alert. What is the best fix?
  options:
  - "Record the ratio as e.g. job:http_request_errors:ratio_rate5m and point both the panel and alert at that series"
  - "Wrap the whole ratio expression in a subquery so it is cached between evaluations"
  - "Increase the scrape interval to 5m so fewer samples must be processed per query"
  - "Switch both rate() calls to irate() so only the last two samples are read"
  answer: 0
  explanation: |
    Precompute the expensive ratio with a recording rule using the level:metric:op naming,
    then have both the dashboard and the alert read the recorded series — cheaper and
    guaranteed consistent. A subquery would make it slower.
  ref: "concepts.md#recording-rules-and-the-levelmetricoperation-naming-convention"

- id: promql-querying-and-recording-rules-054
  difficulty: advanced
  tags: [scenario, vector-matching, ratio]
  question: |
    `sum(rate(errors_total[5m])) by (job) / sum(rate(requests_total[5m])) by (job, path)`
    returns fewer series than expected. What is the likely cause?
  options:
  - "The output of rate() is a range vector that cannot appear as a division operand"
  - "path is a reserved label name that Prometheus refuses to match series on"
  - "Division requires irate() on both operands; plain rate() yields no matches"
  - "The two sides have different label sets (job vs job+path), so one-to-one matching drops all non-matching series"
  answer: 3
  explanation: |
    Division uses one-to-one matching on the full label set. The left side has only job, the
    right has job and path, so almost nothing matches. Align the grouping (e.g. both by
    (job, path)) or use on(job) with group_left/right as appropriate.
  ref: "concepts.md#vector-matching-one-to-one-onignoring-group_leftgroup_right"

- id: promql-querying-and-recording-rules-055
  difficulty: beginner
  tags: [avg-over-time, range-vector, functions]
  question: |
    Which function correctly computes the average value of a gauge over the last 10 minutes?
  options:
  - "increase(memory_usage_bytes[10m])"
  - "rate(memory_usage_bytes[10m])"
  - "avg_over_time(memory_usage_bytes[10m])"
  - "avg(memory_usage_bytes) offset 10m"
  answer: 2
  explanation: |
    avg_over_time is a range-vector function that averages a series' samples over the window
    — the right tool for a gauge's time-average. rate/increase are for counters, and avg()
    aggregates across series at one instant, not over time.
  ref: "concepts.md#instant-vectors-vs-range-vectors"

- id: promql-querying-and-recording-rules-056
  difficulty: intermediate
  tags: [selectors, matchers, combining]
  question: |
    What does `node_cpu_seconds_total{mode!="idle"}` select?
  options:
  - "Only the series whose mode label is exactly equal to idle"
  - "All CPU-time series except those with mode=idle"
  - "The single CPU mode with the highest accumulated seconds"
  - "Every series that has no mode label present at all"
  answer: 1
  explanation: |
    `!=` is the not-equal matcher, so this selects every node_cpu_seconds_total series whose
    mode label is anything other than "idle" — a common way to measure non-idle CPU usage.
  ref: "concepts.md#selectors-and-label-matchers"
