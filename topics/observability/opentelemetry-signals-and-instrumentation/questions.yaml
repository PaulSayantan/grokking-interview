topic: "OpenTelemetry Signals & Instrumentation"
domain: observability
topic_slug: opentelemetry-signals-and-instrumentation
version: 1
questions:
  - id: opentelemetry-signals-and-instrumentation-001
    difficulty: beginner
    tags: [otel, overview, vendor-neutral]
    question: |
      What is the primary problem OpenTelemetry (OTel) is designed to solve?
    options:
      - "Vendor-neutral, standardized instrumentation so you can switch backends without re-instrumenting code"
      - "Storing and indexing metrics and traces at scale as a purpose-built time-series database engine"
      - "Replacing Prometheus as the primary long-term time-series database for all collected metrics"
      - "Providing prebuilt dashboards and visualization out of the box so teams can skip setting up Grafana"
    answer: 0
    explanation: |
      OTel standardizes how telemetry is generated, collected, and exported so
      instrumentation is decoupled from any specific backend. It is explicitly NOT a
      storage backend or a visualization tool — you still need Prometheus/Tempo/Jaeger
      or a vendor to store, query, and visualize.
    ref: "concepts.md#why-opentelemetry-exists-opentracing--opencensus-merge"

  - id: opentelemetry-signals-and-instrumentation-002
    difficulty: beginner
    tags: [history, opentracing, opencensus]
    question: |
      OpenTelemetry was formed by merging which two earlier projects?
    options:
      - "OpenTracing and OpenCensus"
      - "Zipkin and Jaeger"
      - "Prometheus and Grafana"
      - "StatsD and collectd"
    answer: 0
    explanation: |
      OTel is the 2019 merger of OpenTracing (a vendor-neutral tracing API with no
      implementation) and OpenCensus (Google-originated libraries shipping both API and
      implementation for traces and metrics). It kept OpenTracing's API/impl split and
      OpenCensus's batteries-included implementation.
    ref: "concepts.md#why-opentelemetry-exists-opentracing--opencensus-merge"

  - id: opentelemetry-signals-and-instrumentation-003
    difficulty: beginner
    tags: [scope, backend]
    question: |
      Which statement about OpenTelemetry's scope is correct?
    options:
      - "OTel stores telemetry long-term and provides a PromQL-style query language for it"
      - "OTel generates and exports telemetry but is not itself a storage/visualization backend"
      - "OTel is a drop-in replacement for Grafana dashboards and alerting panels"
      - "OTel only supports metrics collection, not distributed traces or structured logs"
    answer: 1
    explanation: |
      OTel is the instrumentation and transport layer ("taps and plumbing"). It does not
      store, index, or visualize data — that's the job of backends like Prometheus,
      Tempo, Loki, Jaeger, or a commercial APM.
    ref: "concepts.md#why-opentelemetry-exists-opentracing--opencensus-merge"

  - id: opentelemetry-signals-and-instrumentation-004
    difficulty: beginner
    tags: [signals, pillars]
    question: |
      Which of the following is one of OpenTelemetry's signals?
    options:
      - "Dashboards"
      - "Alerts"
      - "Traces"
      - "Runbooks"
    answer: 2
    explanation: |
      OTel's signals are traces, metrics, logs, baggage, and the emerging profiles
      signal. Dashboards, alerts, and runbooks are downstream/operational concerns, not
      OTel signals.
    ref: "concepts.md#the-signals-traces-metrics-logs-and-profiles"

  - id: opentelemetry-signals-and-instrumentation-005
    difficulty: intermediate
    tags: [signals, profiles, maturity]
    question: |
      As of the mid-2020s OTel spec, which signal is still considered in
      development/experimental rather than stable?
    options:
      - "Traces"
      - "Metrics"
      - "Logs"
      - "Profiles"
    answer: 3
    explanation: |
      Traces, metrics, and logs APIs/SDKs are stable in the major languages; profiling
      is the newest signal and is still under development, with an OTLP profiles format
      being standardized.
    ref: "concepts.md#the-signals-traces-metrics-logs-and-profiles"

  - id: opentelemetry-signals-and-instrumentation-006
    difficulty: intermediate
    tags: [signals, events, logs]
    question: |
      How does OpenTelemetry model "events"?
    options:
      - "As a fifth top-level signal alongside traces, metrics, logs, and profiles"
      - "As a specialized kind of log record (a log with a well-known event.name)"
      - "As a required attribute that must be set on every emitted span"
      - "As a separate wire protocol negotiated apart from the OTLP format"
    answer: 1
    explanation: |
      Events are modeled as a specialized kind of log record, not a separate signal.
      Calling events a distinct pillar is a common mistake.
    ref: "concepts.md#the-signals-traces-metrics-logs-and-profiles"

  - id: opentelemetry-signals-and-instrumentation-007
    difficulty: intermediate
    tags: [signals, correlation]
    question: |
      What is OTel's key advantage from having all signals share the same context?
    options:
      - "It eliminates the need for any separate storage backend because all signals are buffered together in-process"
      - "It guarantees exactly-once, ordered delivery of every telemetry item across all signal pipelines"
      - "It removes the requirement to set service.name because shared context supplies the identity automatically"
      - "It lets backends correlate signals — e.g. pivot from a spiking metric to an exemplar trace to the logs emitted inside its spans"
    answer: 3
    explanation: |
      Because trace context flows through the process, logs and metrics recorded during
      a span can carry the same trace_id, enabling correlation across signals. Metrics
      say something is wrong, traces say where, logs say what.
    ref: "concepts.md#the-signals-traces-metrics-logs-and-profiles"

  - id: opentelemetry-signals-and-instrumentation-008
    difficulty: beginner
    tags: [traces, trace-id, span-id]
    question: |
      In the OTel data model, how many bytes are a trace ID and a span ID respectively?
    options:
      - "8 bytes and 4 bytes"
      - "16 bytes and 8 bytes"
      - "32 bytes and 16 bytes"
      - "4 bytes and 2 bytes"
    answer: 1
    explanation: |
      A trace ID is 16 bytes (32 hex chars) and a span ID is 8 bytes (16 hex chars).
      Every span in a trace shares the trace ID; each span has a unique span ID.
    ref: "concepts.md#traces-and-spans-the-data-model"

  - id: opentelemetry-signals-and-instrumentation-009
    difficulty: intermediate
    tags: [traces, span-kind]
    question: |
      A service makes an outbound HTTP call to a downstream service. On the caller, the
      span for that outbound call should have which SpanKind?
    options:
      - "SERVER"
      - "CLIENT"
      - "CONSUMER"
      - "INTERNAL"
    answer: 1
    explanation: |
      The caller side of a synchronous remote call is a CLIENT span; the callee records
      the matching SERVER span. Backends pair CLIENT/SERVER spans to compute
      service-to-service latency and build service maps.
    ref: "concepts.md#traces-and-spans-the-data-model"

  - id: opentelemetry-signals-and-instrumentation-010
    difficulty: intermediate
    tags: [traces, span-links, messaging]
    question: |
      A batch job consumes 100 Kafka messages, each produced by a different trace. What
      span feature best represents the causal relationship to all 100 producing traces?
    options:
      - "Span events"
      - "Span attributes"
      - "A shared parent span ID"
      - "Span links"
    answer: 3
    explanation: |
      Span links reference other spans/traces that aren't the direct parent — ideal for
      fan-in scenarios like a batch consumer relating to many producing traces. A single
      parent span ID can't express multiple distinct causal origins.
    ref: "concepts.md#traces-and-spans-the-data-model"

  - id: opentelemetry-signals-and-instrumentation-011
    difficulty: intermediate
    tags: [traces, cardinality, span-name]
    question: |
      Why is it a bad practice to include a raw user ID or full URL with query string in
      a span's name?
    options:
      - "Span names must be numeric identifiers and cannot contain arbitrary string characters at all"
      - "Span names are hashed and encrypted on export, so free-form text can never be stored in them"
      - "The W3C Trace Context spec forbids any span name string longer than eight characters"
      - "It explodes the number of distinct operation names, breaking aggregation and hurting backend performance"
    answer: 3
    explanation: |
      Span names should be low-cardinality operation identifiers (e.g. GET /orders/:id).
      High-cardinality values belong in attributes, not the name, or you get an
      unmanageable number of distinct operations.
    ref: "concepts.md#traces-and-spans-the-data-model"

  - id: opentelemetry-signals-and-instrumentation-012
    difficulty: beginner
    tags: [traces, span-status]
    question: |
      What is the default status of an OTel span that completes without the
      instrumentation explicitly setting it?
    options:
      - "Ok"
      - "Unset"
      - "Error"
      - "Pending"
    answer: 1
    explanation: |
      A span's status defaults to Unset. Instrumentation sets Error on failure; Ok is
      only meant to be set explicitly when an application deliberately marks success.
    ref: "concepts.md#traces-and-spans-the-data-model"

  - id: opentelemetry-signals-and-instrumentation-013
    difficulty: beginner
    tags: [metrics, instruments, counter]
    question: |
      Which OTel metric instrument is monotonic (only ever increases)?
    options:
      - "Counter"
      - "UpDownCounter"
      - "ObservableGauge"
      - "Histogram"
    answer: 0
    explanation: |
      A Counter is monotonic — it only increases (e.g. total requests served). An
      UpDownCounter can go up or down (queue depth), and a gauge reports a current value.
    ref: "concepts.md#metrics-instruments-and-the-otel-metrics-model"

  - id: opentelemetry-signals-and-instrumentation-014
    difficulty: intermediate
    tags: [metrics, instruments, gauge]
    question: |
      You want to report the current CPU utilization percentage, read on demand at
      collection time. Which instrument fits best?
    options:
      - "Counter"
      - "ObservableGauge"
      - "Histogram"
      - "UpDownCounter"
    answer: 1
    explanation: |
      An ObservableGauge uses a callback invoked at collection time to report a current,
      non-additive value like CPU %. Counters are monotonic and histograms record
      distributions, neither of which fits a point-in-time gauge reading.
    ref: "concepts.md#metrics-instruments-and-the-otel-metrics-model"

  - id: opentelemetry-signals-and-instrumentation-015
    difficulty: intermediate
    tags: [metrics, temporality]
    question: |
      Prometheus scrapes cumulative counters. Which OTel metrics concept lets the SDK
      produce cumulative values (vs delta since last export) to match that model?
    options:
      - "Temporality (cumulative vs delta)"
      - "Sampling (head vs tail decisions)"
      - "Baggage (cross-service context)"
      - "SpanKind (client vs server role)"
    answer: 0
    explanation: |
      OTel supports selectable temporality. Cumulative temporality (value since start)
      matches Prometheus scraping; delta temporality (value since last export) suits many
      push/statsd-style backends. The SDK can convert between them.
    ref: "concepts.md#metrics-instruments-and-the-otel-metrics-model"

  - id: opentelemetry-signals-and-instrumentation-016
    difficulty: advanced
    tags: [metrics, histograms, native-histograms]
    question: |
      What is the advantage of an OTel exponential (base-2) histogram over a classic
      explicit-bucket histogram?
    options:
      - "It stores every raw individual sample so exact percentiles can be computed without any bucketing"
      - "It uses far less memory by dropping all bucket information and keeping only a running mean"
      - "It is the only histogram type that can be aggregated across service instances after collection"
      - "It maps onto Prometheus native histograms and gives high-resolution quantiles without pre-choosing bucket boundaries"
    answer: 3
    explanation: |
      Exponential histograms auto-size buckets on a base-2 scale, mapping onto Prometheus
      native histograms and giving good quantile resolution without manually choosing
      boundaries. Both histogram types are aggregatable; the exponential one just avoids
      pre-committing to fixed buckets.
    ref: "concepts.md#metrics-instruments-and-the-otel-metrics-model"

  - id: opentelemetry-signals-and-instrumentation-017
    difficulty: intermediate
    tags: [metrics, quantiles, histograms]
    question: |
      To compute p99 latency that is aggregatable across many service instances, what
      should you record?
    options:
      - "A pre-computed p99 gauge emitted per instance"
      - "A Histogram, and compute the quantile in the backend"
      - "A monotonic Counter totaling all served requests"
      - "Baggage entries holding the measured latency"
    answer: 1
    explanation: |
      Record a Histogram and let the backend compute quantiles (e.g. Prometheus
      histogram_quantile). Pre-computed per-instance percentiles cannot be correctly
      averaged/aggregated across instances, whereas histograms can be summed first.
    ref: "concepts.md#metrics-instruments-and-the-otel-metrics-model"

  - id: opentelemetry-signals-and-instrumentation-018
    difficulty: intermediate
    tags: [logs, bridge, design]
    question: |
      How is OTel's logging support primarily designed?
    options:
      - "As a bridge/appender that routes existing logging frameworks into the OTel LogRecord model"
      - "As a brand-new logging framework designed to fully replace Logback and Log4j"
      - "As a Prometheus exporter that converts log line counts into scrapeable metrics"
      - "As a mandatory replacement that redirects all stdout logging through the SDK"
    answer: 0
    explanation: |
      Rather than reinvent logging, OTel's Logs API/SDK is a bridge: existing frameworks
      (Logback, Log4j, slog, Python logging) emit through an OTel appender that maps
      records into the OTel LogRecord data model and exports via OTLP.
    ref: "concepts.md#logs-and-log-correlation"

  - id: opentelemetry-signals-and-instrumentation-019
    difficulty: intermediate
    tags: [logs, correlation, trace-id]
    question: |
      What makes automatic trace-log correlation possible in OTel?
    options:
      - "A LogRecord emitted inside a span is stamped with trace_id and span_id from the active context"
      - "The Collector writes logs into the same database table as traces and row-joins them"
      - "The Collector re-runs every log line back through the full tracing pipeline"
      - "Every emitted log line is silently converted into its own zero-duration span"
    answer: 0
    explanation: |
      The OTel LogRecord carries trace_id and span_id pulled from the active context, so
      logs emitted during a span are automatically correlated — a backend can jump from a
      span in a trace to the logs produced inside it.
    ref: "concepts.md#logs-and-log-correlation"

  - id: opentelemetry-signals-and-instrumentation-020
    difficulty: beginner
    tags: [api-sdk, separation]
    question: |
      In OpenTelemetry, what is the difference between the API and the SDK?
    options:
      - "The API persists telemetry to disk while the SDK renders it into dashboards and charts"
      - "The API handles metrics exclusively, while the SDK is the package that handles traces and spans"
      - "They are two interchangeable names published for the exact same package and jar"
      - "The API is the interface your code calls; the SDK is the implementation the app owner installs and configures (samplers, processors, exporters)"
    answer: 3
    explanation: |
      The API defines the interfaces used for instrumentation (and is no-op by default);
      the SDK is the concrete implementation the application owner installs and configures
      with samplers, span processors, and exporters.
    ref: "concepts.md#api-vs-sdk-separation"

  - id: opentelemetry-signals-and-instrumentation-021
    difficulty: intermediate
    tags: [api-sdk, libraries]
    question: |
      Per the OTel spec, what must instrumentation libraries depend on?
    options:
      - "The SDK, so they can configure sampling"
      - "Only the API, never the SDK"
      - "Both the API and a specific exporter"
      - "The Collector's receiver package"
    answer: 1
    explanation: |
      Instrumentation libraries MUST depend only on the API, never the SDK. This keeps
      them no-op when no SDK is installed and leaves sampling/exporter/endpoint decisions
      entirely to the application owner.
    ref: "concepts.md#api-vs-sdk-separation"

  - id: opentelemetry-signals-and-instrumentation-022
    difficulty: intermediate
    tags: [api-sdk, no-op]
    question: |
      What happens when code instrumented with the OTel API runs in an application that
      has NOT installed/configured an SDK?
    options:
      - "The application throws a MissingSdkException and crashes during startup initialization"
      - "Telemetry is silently buffered and written to a local on-disk file until an SDK appears"
      - "The API calls become no-ops with near-zero overhead"
      - "The API automatically downloads and installs a default SDK with console exporters"
    answer: 2
    explanation: |
      The API is designed to be a no-op by default. If no SDK is wired up, instrumentation
      calls do essentially nothing, so libraries can instrument safely without forcing
      overhead on users who don't opt in.
    ref: "concepts.md#api-vs-sdk-separation"

  - id: opentelemetry-signals-and-instrumentation-023
    difficulty: advanced
    tags: [api-sdk, cross-cutting, rationale]
    question: |
      Why does OTel deliberately separate the API from the SDK, given that
      instrumentation is a cross-cutting concern embedded in shared libraries?
    options:
      - "To force every application in a fleet to share one globally fixed sampler and export endpoint"
      - "To lock the SDK implementation in place so it can never be swapped for a vendor build"
      - "Because the API and the SDK are, by design, written and compiled in two different languages"
      - "So shared libraries can instrument via a thin, stable, no-op-capable API while the app owner alone controls the implementation and export path — avoiding version conflicts and forced overhead"
    answer: 3
    explanation: |
      If libraries pulled in a full implementation, users would face version conflicts and
      unavoidable overhead. A thin, stable API that no-ops without an SDK lets libraries
      instrument safely while the app owner decides sampling and exporters.
    ref: "concepts.md#api-vs-sdk-separation"

  - id: opentelemetry-signals-and-instrumentation-024
    difficulty: beginner
    tags: [instrumentation, auto-vs-manual]
    question: |
      What is automatic instrumentation in OpenTelemetry?
    options:
      - "Instrumentation libraries/agents that wrap common frameworks to emit spans and metrics without changing application code"
      - "Hand-writing explicit span-start and span-end API calls wrapped around every function you author"
      - "A backend-side feature that reconstructs and infers spans by pattern-matching on existing log lines"
      - "A global runtime switch whose sole purpose is to disable all telemetry collection at once"
    answer: 0
    explanation: |
      Automatic instrumentation uses instrumentation libraries (and, in some languages,
      agents) to wrap common frameworks — HTTP, gRPC, JDBC, Kafka — so you get telemetry
      without touching code. Manual instrumentation is explicitly writing API calls.
    ref: "concepts.md#auto-vs-manual-instrumentation"

  - id: opentelemetry-signals-and-instrumentation-025
    difficulty: intermediate
    tags: [instrumentation, java, bytecode]
    question: |
      How does the OpenTelemetry Java auto-instrumentation agent typically add spans
      without code changes?
    options:
      - "By tailing and parsing the application's log files and reconstructing spans from the entries"
      - "By recompiling the application from source with an instrumented javac annotation processor at build time"
      - "By bytecode instrumentation, weaving spans into libraries at class load via a -javaagent"
      - "By running a network sidecar container that proxies all inbound and outbound traffic to observe it"
    answer: 2
    explanation: |
      The Java agent (-javaagent:opentelemetry-javaagent.jar) uses bytecode
      instrumentation (ByteBuddy) to weave spans into supported libraries at class load —
      no source changes required.
    ref: "concepts.md#auto-vs-manual-instrumentation"

  - id: opentelemetry-signals-and-instrumentation-026
    difficulty: intermediate
    tags: [instrumentation, strategy]
    question: |
      What is a recommended real-world instrumentation strategy?
    options:
      - "Use only manual instrumentation everywhere, deliberately avoiding all agents and instrumentation libraries"
      - "Use only auto-instrumentation and never add manual spans, since custom spans corrupt the generated trace tree"
      - "Auto-instrument for breadth, then add manual spans/attributes for depth on business-critical logic"
      - "Instrument nothing in the app and rely entirely on the backend to infer spans from raw traffic and metrics"
    answer: 2
    explanation: |
      Auto-instrumentation gives framework-level coverage for free; manual spans and
      domain attributes (order.id, tenant.id) add the business-meaningful depth generic
      library instrumentation can't know about. Both go through the same API and context.
    ref: "concepts.md#auto-vs-manual-instrumentation"

  - id: opentelemetry-signals-and-instrumentation-027
    difficulty: beginner
    tags: [semantic-conventions]
    question: |
      What are OpenTelemetry semantic conventions?
    options:
      - "A configurable set of rules governing how frequently backends should scrape metric endpoints"
      - "A gzip-based compression and framing format applied to OTLP payloads before they are sent"
      - "A head-vs-tail sampling algorithm that decides which traces are kept and which are dropped"
      - "Standardized names for attributes, metrics, and resources (e.g. http.request.method)"
    answer: 3
    explanation: |
      Semantic conventions define standardized names for attributes/metrics/resources so
      telemetry is portable and correlatable across languages, libraries, and backends.
    ref: "concepts.md#semantic-conventions-why-standardized-attribute-names-matter"

  - id: opentelemetry-signals-and-instrumentation-028
    difficulty: intermediate
    tags: [semantic-conventions, portability]
    question: |
      Why do standardized attribute names matter in practice?
    options:
      - "A dashboard or alert built on a standard attribute works regardless of which language/library produced the data"
      - "They shrink telemetry payloads on the wire by replacing long attribute names with short numeric codes"
      - "They automatically encrypt every attribute value at the SDK before it is exported over OTLP"
      - "They remove the requirement to attach a Resource to the telemetry a service emits"
    answer: 0
    explanation: |
      With standardized names like http.server.request.duration, a single dashboard or
      alert works across Java, Go, and Node services. Without conventions, each service
      might emit http_method vs httpMethod vs method, making cross-service views impossible.
    ref: "concepts.md#semantic-conventions-why-standardized-attribute-names-matter"

  - id: opentelemetry-signals-and-instrumentation-029
    difficulty: advanced
    tags: [semantic-conventions, migration, gotcha]
    question: |
      After upgrading an instrumentation library, your Grafana dashboards using
      http.method suddenly show no data. What is the most likely cause?
    options:
      - "The Collector process silently stopped running and is no longer forwarding any telemetry"
      - "Prometheus quietly changed its default scrape interval, so the http.method series went stale"
      - "The service.name resource attribute was removed, so the panel can no longer resolve the series"
      - "A semantic-convention version bump renamed attributes (e.g. http.method to http.request.method)"
    answer: 3
    explanation: |
      Semantic conventions evolve and have had breaking renames (http.method to
      http.request.method, http.status_code to http.response.status_code). A library
      upgrade can switch to new names; an OTEL_SEMCONV_STABILITY_OPT_IN flag existed to
      emit old, new, or both during migration.
    ref: "concepts.md#semantic-conventions-why-standardized-attribute-names-matter"

  - id: opentelemetry-signals-and-instrumentation-030
    difficulty: beginner
    tags: [resource, service-name]
    question: |
      What does an OTel Resource describe?
    options:
      - "The entity producing telemetry (service, host, container, pod), attached to all signals from that SDK"
      - "The start timestamp and measured duration of one individual span within a trace"
      - "The configured head-sampling rate that determines what fraction of traces are recorded"
      - "The retry, backoff, and timeout policy applied to OTLP export batches on failure"
    answer: 0
    explanation: |
      A Resource is an immutable set of attributes describing the entity emitting telemetry
      — service, host, container, cloud region, k8s pod. It attaches to all signals from
      that SDK.
    ref: "concepts.md#resource-describing-the-entity-producing-telemetry"

  - id: opentelemetry-signals-and-instrumentation-031
    difficulty: intermediate
    tags: [resource, service-name, gotcha]
    question: |
      You deploy a service but forget to set service.name. What happens in your backend?
    options:
      - "The SDK refuses to start and halts the application until service.name is explicitly configured"
      - "Telemetry appears under a fallback like unknown_service, making it nearly useless"
      - "The Collector auto-detects the correct service name from the sending host's DNS hostname"
      - "All spans and metrics from the service are silently dropped before they reach any exporter"
    answer: 1
    explanation: |
      service.name is effectively required. If unset, the SDK falls back to
      unknown_service, so your data can't be attributed to the right service — one of the
      most common OTel misconfigurations.
    ref: "concepts.md#resource-describing-the-entity-producing-telemetry"

  - id: opentelemetry-signals-and-instrumentation-032
    difficulty: intermediate
    tags: [resource, attributes, distinction]
    question: |
      What distinguishes a Resource attribute from a span attribute?
    options:
      - "Resource attributes are encrypted at export time, whereas span attributes travel in plaintext"
      - "There is no real difference; the two terms are fully interchangeable and map to the same field"
      - "Resource attributes describe the producing entity and attach to all signals; span attributes describe a single span"
      - "Span attributes may hold only numeric values, while Resource attributes may hold only strings"
    answer: 2
    explanation: |
      Resource attributes (service.name, k8s.pod.name) describe the entity and are attached
      to every signal the SDK emits. Span attributes describe one individual span.
    ref: "concepts.md#resource-describing-the-entity-producing-telemetry"

  - id: opentelemetry-signals-and-instrumentation-033
    difficulty: beginner
    tags: [otlp, ports]
    question: |
      What are the default ports for OTLP/gRPC and OTLP/HTTP respectively?
    options:
      - "8080 and 8443"
      - "4317 and 4318"
      - "9090 and 9091"
      - "6831 and 6832"
    answer: 1
    explanation: |
      OTLP/gRPC defaults to port 4317; OTLP/HTTP defaults to port 4318. Both carry the
      same Protocol Buffers schema.
    ref: "concepts.md#otlp-the-opentelemetry-protocol-and-wire-format"

  - id: opentelemetry-signals-and-instrumentation-034
    difficulty: intermediate
    tags: [otlp, encoding, json]
    question: |
      In OTLP/HTTP with JSON encoding, how are trace IDs and span IDs represented?
    options:
      - "Base64-encoded byte strings"
      - "Decimal integers"
      - "UUID v4 format"
      - "Hex-encoded strings"
    answer: 3
    explanation: |
      OTLP's JSON encoding deviates from standard proto3 JSON: traceId/spanId are
      hex-encoded strings (not base64), 64-bit integers are decimal strings, and keys are
      lowerCamelCase.
    ref: "concepts.md#otlp-the-opentelemetry-protocol-and-wire-format"

  - id: opentelemetry-signals-and-instrumentation-035
    difficulty: advanced
    tags: [otlp, retry, partial-success]
    question: |
      An OTLP export returns a response with partial_success populated (some items
      rejected). What must the client do with the rejected items?
    options:
      - "Not retry them"
      - "Retry them immediately"
      - "Retry them with exponential backoff"
      - "Re-send them to a different endpoint"
    answer: 0
    explanation: |
      Partial success means the server accepted some items and permanently rejected others
      (e.g. malformed). The client MUST NOT retry the rejected items — retrying only
      applies to retryable transport errors like 429/503 or UNAVAILABLE.
    ref: "concepts.md#otlp-the-opentelemetry-protocol-and-wire-format"

  - id: opentelemetry-signals-and-instrumentation-036
    difficulty: advanced
    tags: [otlp, retry, http-status]
    question: |
      Over OTLP/HTTP, which set of status codes is retryable?
    options:
      - "400, 401, 403"
      - "200, 201, 204"
      - "429, 502, 503, 504"
      - "301, 302, 307"
    answer: 2
    explanation: |
      OTLP/HTTP treats 429, 502, 503, and 504 as retryable; all other 4xx/5xx (e.g. 400
      for bad data) MUST NOT be retried. Clients use Retry-After or exponential backoff.
    ref: "concepts.md#otlp-the-opentelemetry-protocol-and-wire-format"

  - id: opentelemetry-signals-and-instrumentation-037
    difficulty: intermediate
    tags: [otlp, transport-choice]
    question: |
      Which statement about choosing OTLP/gRPC vs OTLP/HTTP is most accurate?
    options:
      - "Both carry the same protobuf schema; gRPC (4317) is common inside a cluster, HTTP (4318) traverses proxies/browsers more easily"
      - "gRPC and HTTP use entirely different, incompatible wire schemas, so a Collector must fully re-serialize every payload when bridging the two"
      - "HTTP is always faster than gRPC for telemetry because it avoids the HTTP/2 framing and stream-multiplexing overhead that gRPC requires"
      - "gRPC cannot be used inside Kubernetes because kube-proxy's layer-4 load balancing silently drops all of its long-lived HTTP/2 streams"
    answer: 0
    explanation: |
      Both transports share the same protobuf schema. gRPC is efficient and common inside
      clusters; HTTP/protobuf is friendlier to proxies, load balancers, and browser
      environments where gRPC is awkward.
    ref: "concepts.md#otlp-the-opentelemetry-protocol-and-wire-format"

  - id: opentelemetry-signals-and-instrumentation-038
    difficulty: intermediate
    tags: [propagation, w3c, traceparent]
    question: |
      Consider this HTTP header:
      `traceparent: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01`
      What does the trailing `01` indicate?
    options:
      - "The traceparent version field is set to value 1"
      - "It records that exactly 1 parent span precedes this one"
      - "The trace has exactly 1 remaining propagation hop left"
      - "The sampled flag is set (this trace is sampled)"
    answer: 3
    explanation: |
      The last field is trace-flags, an 8-bit field. The least-significant bit is the
      sampled flag; 01 means sampled, 00 means not sampled. The first 00 is the version.
    ref: "concepts.md#exporters-propagators-context-and-baggage"

  - id: opentelemetry-signals-and-instrumentation-039
    difficulty: intermediate
    tags: [propagation, w3c, default]
    question: |
      What is the default and recommended context propagation format in OpenTelemetry?
    options:
      - "B3 (Zipkin's multi-header X-B3 format)"
      - "Jaeger's uber-trace-id single-header format"
      - "W3C Trace Context (traceparent/tracestate)"
      - "AWS X-Amzn-Trace-Id (X-Ray) header format"
    answer: 2
    explanation: |
      OTel defaults to W3C Trace Context (traceparent/tracestate headers). B3, Jaeger, and
      others are supported for interop but W3C is the recommended standard.
    ref: "concepts.md#exporters-propagators-context-and-baggage"

  - id: opentelemetry-signals-and-instrumentation-040
    difficulty: advanced
    tags: [propagation, broken-traces, gotcha]
    question: |
      Service A (OTel with W3C propagator) calls Service B, but B was configured with only
      the B3 propagator. What is the likely symptom?
    options:
      - "Both services fail to start because the SDK rejects the incompatible propagator configuration at boot"
      - "Traces break at the boundary — B starts a new root trace instead of continuing A's trace"
      - "Metrics stop being recorded on both services because the meter provider shares the broken propagation pipeline"
      - "OTLP export silently switches from protobuf to JSON encoding to work around the header mismatch"
    answer: 1
    explanation: |
      A propagator mismatch means B can't extract A's context from the incoming headers, so
      B starts a disconnected root trace. Propagator mismatch is the #1 cause of broken
      traces; all services must share a compatible propagator.
    ref: "concepts.md#exporters-propagators-context-and-baggage"

  - id: opentelemetry-signals-and-instrumentation-041
    difficulty: intermediate
    tags: [baggage, security]
    question: |
      Which statement about OTel baggage is correct?
    options:
      - "Baggage is automatically copied onto every span in the trace as indexed attributes by default"
      - "Baggage is encrypted end-to-end by the SDK using per-service keys negotiated during context propagation"
      - "Baggage propagates user-defined key-values across services but is not auto-added to spans, and travels in plaintext headers (so no secrets/PII)"
      - "Baggage fully replaces the need for span attributes since any key it carries is queryable in the backend"
    answer: 2
    explanation: |
      Baggage carries business context (tenant.id, session.id) across services but is NOT
      automatically attached to spans, and it travels in plaintext headers — so avoid
      secrets/PII and watch header bloat.
    ref: "concepts.md#exporters-propagators-context-and-baggage"

  - id: opentelemetry-signals-and-instrumentation-042
    difficulty: intermediate
    tags: [exporters, span-processor]
    question: |
      In a production OTel SDK setup, which span processor is normally used to feed the
      exporter, and why?
    options:
      - "SimpleSpanProcessor, because exporting each span synchronously on the request thread gives the lowest end-to-end latency"
      - "No processor at all is needed in production since the exporter reads finished spans directly from the tracer"
      - "BatchSpanProcessor, because it batches spans and flushes asynchronously for efficiency"
      - "A sampling processor whose job is to drop all spans before they can reach the configured exporter"
    answer: 2
    explanation: |
      BatchSpanProcessor batches spans and exports asynchronously — the production default.
      SimpleSpanProcessor exports synchronously per span and is only appropriate for
      debugging or tests.
    ref: "concepts.md#exporters-propagators-context-and-baggage"

  - id: opentelemetry-signals-and-instrumentation-043
    difficulty: beginner
    tags: [exporters, definition]
    question: |
      What is the role of an exporter in the OTel SDK?
    options:
      - "To decide the head-sampling rate applied to each new trace as it starts"
      - "To generate the random 16-byte trace IDs and 8-byte span IDs for new spans"
      - "To send batched telemetry out of the process (e.g. via OTLP to a Collector or backend)"
      - "To render the dashboards and quantile charts that operators view in the backend"
    answer: 2
    explanation: |
      Exporters are SDK plugins that ship telemetry out of the process. The OTLP exporter
      is canonical; others target Prometheus, Jaeger, Zipkin, or the console for debugging.
    ref: "concepts.md#exporters-propagators-context-and-baggage"

  - id: opentelemetry-signals-and-instrumentation-044
    difficulty: intermediate
    tags: [context, propagation, mechanism]
    question: |
      What is "context" in OTel responsible for within a single process?
    options:
      - "Serializing finished telemetry into the OTLP protobuf wire format before export"
      - "Storing recorded metrics long-term in an in-process time-series buffer"
      - "Carrying the currently active span (and baggage) implicitly so new spans are parented correctly"
      - "Choosing which of the configured exporters each batch of telemetry is routed to"
    answer: 2
    explanation: |
      Context carries the active span and baggage implicitly (thread-locals in Java,
      context.Context in Go, contextvars in Python) so a child span is parented to whatever
      span is currently active. Propagators extend this across process boundaries.
    ref: "concepts.md#exporters-propagators-context-and-baggage"

  - id: opentelemetry-signals-and-instrumentation-045
    difficulty: intermediate
    tags: [migration, shims]
    question: |
      A team wants to migrate existing OpenTracing-instrumented code to OTel
      incrementally. What does OTel provide to help?
    options:
      - "A codemod tool that scans the source tree and deletes all old OpenTracing instrumentation automatically"
      - "Nothing at all; you must rewrite every instrumented call site to the OTel API in one big-bang cutover"
      - "An OpenTracing shim (and OpenCensus bridge) so existing instrumentation keeps working during migration"
      - "A Prometheus exporter that converts the existing OpenTracing spans into scrapeable RED metrics instead"
    answer: 2
    explanation: |
      OTel ships an OpenTracing shim and an OpenCensus bridge so legacy instrumentation
      continues to function while you migrate incrementally, avoiding a big-bang rewrite.
    ref: "concepts.md#migrating-from-vendor-sdks"

  - id: opentelemetry-signals-and-instrumentation-046
    difficulty: advanced
    tags: [migration, propagation-interop]
    question: |
      During a mixed-fleet migration where some services still use Zipkin/B3 and others
      use OTel, what is critical to keep traces connected across the boundary?
    options:
      - "Disabling sampling everywhere so that no trace is dropped at the Zipkin-to-OTel boundary"
      - "Configuring OTel to also read/write the B3 propagation format"
      - "Switching all services to OTLP/JSON so the two fleets share one common encoding"
      - "Renaming service.name on every service to a shared value so the traces are grouped together"
    answer: 1
    explanation: |
      Propagation interop is key: configure OTel to read/write B3 so context flows between
      old (Zipkin) and new (OTel) services. Otherwise traces break at the boundary between
      services using different propagation formats.
    ref: "concepts.md#migrating-from-vendor-sdks"

  - id: opentelemetry-signals-and-instrumentation-047
    difficulty: intermediate
    tags: [migration, collector, adapter]
    question: |
      How can the OpenTelemetry Collector help swap observability backends without
      re-instrumenting every service at once?
    options:
      - "By running legacy receivers (Zipkin, Jaeger, statsd, Prometheus) to accept native formats and normalizing them to OTLP for a new backend"
      - "By statically rewriting each service's application source code to emit the new backend's native format automatically"
      - "By persisting and indexing all incoming telemetry itself, acting as the durable storage backend in place of Tempo or Jaeger"
      - "By forcing every service in the fleet to upgrade to the latest SDK version simultaneously before any export works"
    answer: 0
    explanation: |
      Running the Collector with legacy receivers lets old agents keep sending in their
      native formats while the Collector translates to OTLP and exports to the chosen
      backend — a translation layer that lets you change backends without touching every
      service.
    ref: "concepts.md#migrating-from-vendor-sdks"

  - id: opentelemetry-signals-and-instrumentation-048
    difficulty: intermediate
    tags: [stability, per-signal]
    question: |
      Which statement about OTel stability is most accurate?
    options:
      - "OTel ships under a single global version number, and every signal and component in that release is uniformly stable"
      - "Only the metrics signal is stable today; the traces and logs APIs are both still marked experimental"
      - "OTel versions stability per signal and per component; you should qualify claims by signal and language"
      - "Stability level is negotiated and decided separately per customer account and telemetry backend vendor"
    answer: 2
    explanation: |
      OTel tracks stability per signal and per component, not as one global version. Traces,
      metrics, logs, and baggage are stable in major languages; profiling is still
      developing; semantic conventions stabilize per-area on their own timelines.
    ref: "concepts.md#signal-stability-and-maturity"

  - id: opentelemetry-signals-and-instrumentation-049
    difficulty: beginner
    tags: [signals, baggage]
    question: |
      Which OTel signal is used to pass contextual key-value information between other
      signals/services rather than being exported to a backend as its own telemetry stream?
    options:
      - "Metrics"
      - "Traces"
      - "Logs"
      - "Baggage"
    answer: 3
    explanation: |
      Baggage carries contextual key-values propagated alongside context between services;
      it isn't itself exported to backends as a telemetry signal by default the way traces,
      metrics, and logs are.
    ref: "concepts.md#the-signals-traces-metrics-logs-and-profiles"

  - id: opentelemetry-signals-and-instrumentation-050
    difficulty: advanced
    tags: [otlp, delivery, duplicates]
    question: |
      Because OTLP clients may re-send unacknowledged batches after retryable errors, what
      side effect does the spec explicitly accept?
    options:
      - "Guaranteed exactly-once delivery of every batch, enforced by per-item sequence numbers in the OTLP header"
      - "Permanent, unrecoverable data loss whenever any transient network blip interrupts an in-flight export"
      - "Possible duplicate telemetry at the server, considered an acceptable tradeoff"
      - "Automatic deduplication at the SDK before export, using a content hash cached across retry attempts"
    answer: 2
    explanation: |
      Retrying unacknowledged data can produce duplicates server-side. OTLP explicitly
      considers this the right tradeoff for telemetry, and end-to-end multi-hop delivery
      guarantees are out of scope for the protocol.
    ref: "concepts.md#otlp-the-opentelemetry-protocol-and-wire-format"
