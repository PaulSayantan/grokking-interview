topic: "Distributed Tracing Concepts & Context Propagation"
domain: observability
topic_slug: distributed-tracing-concepts-and-context-propagation
schema: 1
pass: clarity-v1

# Pays off the loop topic 4 (log-aggregation-and-analysis) leaves open: it tells the
# reader to click a log line's trace_id through to the trace, but never says how ten
# services came to log the same trace_id. See continuity_notes + standard_gaps #4:
# the honest resolution site is section 6 of 14, not this file's first 150 words.
resolves:
  anchor: "concepts.md#cross-process-propagation-via-headers"

prompts:
  - id: distributed-tracing-concepts-and-context-propagation-p001
    ref: "concepts.md#in-process-context-propagation"
    kind: think          # prompt_spec kind: predict-the-failure
    prompt: |
      You move the `/checkout` fan-out off the wrapped pool and onto a hand-rolled
      scheduler that reuses one long-lived thread. Whose child do the new spans
      become?
    hint: "The slot is per-thread, and nobody cleared it after the last request."
    answer_in: "observability/structured-logging-and-log-levels#correlation--trace-ids-in-logs-mdc"

  - id: distributed-tracing-concepts-and-context-propagation-p002
    ref: "concepts.md#cross-process-propagation-via-headers"
    kind: think          # prompt_spec kind: draw-the-boundary
    prompt: |
      An un-instrumented proxy sits between A and B, and the traces split there.
      What must you see on B's inbound request to acquit the proxy?
    hint: "There are two ways a header can be present and still useless."
    answer_in: "concepts.md#w3c-trace-context-traceparent-and-tracestate"

  - id: distributed-tracing-concepts-and-context-propagation-p003
    ref: "concepts.md#w3c-trace-context-traceparent-and-tracestate"
    kind: research       # prompt_spec tier C — success criterion folded into `prompt`
    prompt: |
      `tracestate` caps at 32 list-members rather than at a byte length. Find what
      a receiver is allowed to do when a 33rd arrives. You have it when you can say
      which end of the list gets dropped, and why that end.
    answer_in: external
    search_hint: "W3C Trace Context, the `tracestate` header field: combined header size and the truncation guidance under 'Mutating the tracestate field'."

cliffhanger:
  # Schema hard-gate: the hook MUST NOT name a sibling topic; the destination title
  # and link are resolved at render time from getAdjacentSubtopics.
  hook: |
    You can now put a valid `traceparent` on every hop and prove it with a packet
    capture. A service that does all of that correctly can still emit nothing. With
    the OTel API on the classpath and no SDK installed, `startSpan()` hands back a
    trace-id of 32 zeros. No `traceparent` goes out, and every downstream service
    starts its own trace. You already know why that header would be ignored even if
    it were sent. Nothing in this topic explains why the tracer handed back zeros.
  teaser_questions:
    - "Which component decides whether a span is ever recorded, the library or the application?"
    - "Why would a tracing API ship a no-op as its default implementation?"
  payoff:
    anchor: "concepts.md#api-vs-sdk-separation"
    claim: "The next topic must show that the OTel API is a no-op unless the application owner installs an SDK, and that instrumentation libraries depend on the API only."
