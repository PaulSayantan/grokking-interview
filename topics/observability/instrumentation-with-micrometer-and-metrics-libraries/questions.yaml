topic: "Instrumentation with Micrometer & Metrics Libraries"
domain: observability
topic_slug: instrumentation-with-micrometer-and-metrics-libraries
version: 1
questions:
- id: instrumentation-with-micrometer-and-metrics-libraries-001
  difficulty: beginner
  tags: [facade, vendor-neutral, slf4j]
  question: |
    Micrometer is frequently described as "SLF4J for metrics." What does that
    analogy primarily convey?
  options:
  - "It writes metrics into rolling application log files on disk rather than emitting them to a time-series database"
  - "It is a vendor-neutral facade: you instrument once and choose the monitoring backend as a separate dependency"
  - "It replaces SLF4J and becomes the single facade your application uses for both logging and metrics"
  - "It reuses SLF4J's exact logback.xml configuration file format to declare which metrics backend to enable"
  answer: 1
  explanation: |
    Like SLF4J for logging, Micrometer is an instrumentation facade: application
    code depends on a neutral API, and the concrete monitoring-system client
    (Prometheus, OTLP, Datadog, …) is a pluggable runtime dependency. This avoids
    vendor lock-in at the instrumentation layer.
  ref: "concepts.md#micrometer-as-a-metrics-facade"

- id: instrumentation-with-micrometer-and-metrics-libraries-002
  difficulty: beginner
  tags: [facade, portability]
  question: |
    A team wants to publish the same instrumented metrics to Prometheus in one
    environment and to CloudWatch in another, without changing application code.
    What makes this possible with Micrometer?
  options:
  - "Micrometer natively supports only Prometheus, so publishing the same meters to CloudWatch is fundamentally impossible"
  - "You must run two separately compiled copies of the service, one built against each monitoring backend"
  - "You must hand-rewrite every meter definition against a backend-specific SDK for each target system"
  - "The backend is selected via a dependency/configuration change while the instrumentation API stays the same"
  answer: 3
  explanation: |
    Because Micrometer is a facade, the monitoring-system registry is a swappable
    dependency. The code calls the neutral API; changing the backend is a
    dependency + config change, not a code change.
  ref: "concepts.md#micrometer-as-a-metrics-facade"

- id: instrumentation-with-micrometer-and-metrics-libraries-003
  difficulty: intermediate
  tags: [registry, composite]
  question: |
    What does a CompositeMeterRegistry do?
  options:
  - "It gzip-compresses each meter's samples in memory before persisting them to a local on-disk buffer"
  - "It fans a single meter out to multiple backend registries simultaneously"
  - "It deduplicates meters that share a name but differ in tags by collapsing them into a single series"
  - "It retains only the single most recent sample per meter and performs no export to any backend"
  answer: 1
  explanation: |
    A CompositeMeterRegistry forwards each meter to several underlying registries
    at once, so the same Counter can publish to, say, Prometheus and an OTLP
    endpoint simultaneously. Spring Boot's global registry is a composite.
  ref: "concepts.md#meterregistry-and-registry-backends"

- id: instrumentation-with-micrometer-and-metrics-libraries-004
  difficulty: beginner
  tags: [registry, prometheus, otlp]
  question: |
    Which statement about registry backends is correct?
  options:
  - "Both the Prometheus and OTLP registries always use a push model, streaming samples on a fixed step interval"
  - "SimpleMeterRegistry ships metrics straight to a Grafana data source by default with no extra configuration"
  - "The Prometheus registry actively pushes its accumulated metrics to the Prometheus server over HTTP on each step"
  - "The Prometheus registry exposes a scrape endpoint (pull), while the OTLP registry pushes to a collector"
  answer: 3
  explanation: |
    Prometheus follows a pull/scrape model — the Prometheus registry exposes an
    endpoint (e.g. /actuator/prometheus) that Prometheus scrapes. The OTLP registry
    pushes metrics to an OTLP endpoint/collector.
  ref: "concepts.md#meterregistry-and-registry-backends"

- id: instrumentation-with-micrometer-and-metrics-libraries-005
  difficulty: beginner
  tags: [registry, testing]
  question: |
    Which registry is the in-memory default used when no backend is configured
    and is handy in tests?
  options:
  - "OtlpMeterRegistry"
  - "SimpleMeterRegistry"
  - "PrometheusMeterRegistry"
  - "CompositeMeterRegistry"
  answer: 1
  explanation: |
    SimpleMeterRegistry holds the latest values in memory with no export. It is the
    default when no monitoring backend is present and is useful for unit tests.
  ref: "concepts.md#meterregistry-and-registry-backends"

- id: instrumentation-with-micrometer-and-metrics-libraries-006
  difficulty: beginner
  tags: [counter, gauge, meter-types]
  question: |
    You need to track the number of orders that have been placed since the app
    started. Which meter type is appropriate?
  options:
  - "DistributionSummary"
  - "Gauge"
  - "Counter"
  - "LongTaskTimer"
  answer: 2
  explanation: |
    A Counter reports a monotonically increasing value — the natural fit for
    counting events like orders placed. You then derive throughput with rate().
  ref: "concepts.md#meter-types-overview"

- id: instrumentation-with-micrometer-and-metrics-libraries-007
  difficulty: intermediate
  tags: [meter-types, selection]
  question: |
    Which meter/measurement pairing is INCORRECT?
  options:
  - "Counter — current depth of an in-memory work queue"
  - "Timer — latency of an outbound HTTP call"
  - "Counter — total HTTP 5xx responses served"
  - "Gauge — current number of active database connections"
  answer: 0
  explanation: |
    Current queue depth goes up and down, so it should be a Gauge, not a Counter.
    Counters are for monotonically increasing event counts.
  ref: "concepts.md#meter-types-overview"

- id: instrumentation-with-micrometer-and-metrics-libraries-008
  difficulty: beginner
  tags: [counter, monotonic]
  question: |
    Why does Micrometer's Counter have no decrement() method?
  options:
  - "Decrementing is only permitted on Gauge instances, so the method was deliberately moved off the Counter API"
  - "Counters are immutable once created, so their value can never be adjusted upward or downward after registration"
  - "It is a long-standing oversight in the API that a future Micrometer major release is scheduled to correct"
  - "Counters are meant to be monotonically increasing; a decrease breaks rate()/increase() reset detection"
  answer: 3
  explanation: |
    Counters model monotonically increasing values. Prometheus detects resets by
    looking for a decrease; a manual decrement would falsely look like a counter
    reset and corrupt rate()/increase() calculations.
  ref: "concepts.md#counter"

- id: instrumentation-with-micrometer-and-metrics-libraries-009
  difficulty: intermediate
  tags: [counter, promql, rate]
  question: |
    On a dashboard you want the per-second rate of failed orders from a Counter
    named orders.failed. Which PromQL is correct (Prometheus naming applied)?
  options:
  - "avg(orders_failed_total)"
  - "histogram_quantile(0.95, orders_failed_total)"
  - "orders_failed_total"
  - "rate(orders_failed_total[5m])"
  answer: 3
  explanation: |
    Prometheus appends _total to counter names. rate(orders_failed_total[5m])
    gives per-second throughput over a 5m window and correctly handles counter
    resets. Plotting the raw counter value is meaningless across restarts.
  ref: "concepts.md#counter"

- id: instrumentation-with-micrometer-and-metrics-libraries-010
  difficulty: intermediate
  tags: [gauge, weak-reference, gotcha]
  question: |
    A Micrometer Gauge suddenly starts reporting NaN in production. What is a
    common cause?
  options:
  - "The gauge's sampled value overflowed past Long.MAX_VALUE and Micrometer clamps the wrapped result to NaN"
  - "The /actuator/prometheus scrape endpoint was disabled, so the registry substitutes NaN for every gauge"
  - "The registry was configured with too many common tags, exhausting the per-meter tag budget and voiding the value"
  - "The object the gauge weakly references was garbage-collected"
  answer: 3
  explanation: |
    A gauge holds a weak reference to the object it samples so it doesn't cause a
    memory leak. If that object is garbage-collected, the gauge reports NaN. Keep a
    strong reference to the sampled object alive.
  ref: "concepts.md#gauge"

- id: instrumentation-with-micrometer-and-metrics-libraries-011
  difficulty: intermediate
  tags: [gauge, semantics]
  question: |
    Which statement about Micrometer Gauges is TRUE?
  options:
  - "Gauges cannot carry tags, so every gauge you register must have a globally unique meter name to be valid"
  - "A gauge accumulates every event that occurs between publish intervals and reports their running sum"
  - "A gauge is observed by sampling a function at publish time, so events between samples are invisible"
  - "You should use a gauge to count total requests served, since it increments once per request internally"
  answer: 2
  explanation: |
    Gauges are sampled: Micrometer calls the value function at publish time and
    reports the instantaneous value. Events between samples are not captured, so a
    gauge is unsuitable for counting — use a Counter for that.
  ref: "concepts.md#gauge"

- id: instrumentation-with-micrometer-and-metrics-libraries-012
  difficulty: beginner
  tags: [timer, latency]
  question: |
    What does a Micrometer Timer report at minimum?
  options:
  - "A count of events and the total time — so you get both frequency and cumulative latency"
  - "Only a fixed set of precomputed percentiles, with no event count or cumulative total exposed"
  - "Only the duration of the single request currently in flight, discarded as soon as it completes"
  - "Only the maximum latency observed so far, reset back to zero on every publish interval"
  answer: 0
  explanation: |
    Every Timer reports at least a count and a total time. From those you get
    throughput and mean latency (total/count); distributions/percentiles are
    optional add-ons.
  ref: "concepts.md#timer"

- id: instrumentation-with-micrometer-and-metrics-libraries-013
  difficulty: intermediate
  tags: [timer, prometheus, base-units]
  question: |
    A Timer named http.server.requests appears in Prometheus. Which series names
    would you expect?
  options:
  - "A single http_server_requests_total counter series, because Prometheus renders every timer as one monotonic total"
  - "http_server_requests_seconds_count, http_server_requests_seconds_sum, and (if configured) http_server_requests_seconds_bucket"
  - "http.server.requests.count and http.server.requests.sum, with the original dotted name preserved verbatim by Prometheus"
  - "http_server_requests_millis_count and _millis_sum, since Prometheus stores timer values in millisecond base units"
  answer: 1
  explanation: |
    Micrometer's base time unit is seconds. The Prometheus naming convention emits
    _seconds_count and _seconds_sum, plus _seconds_bucket series when a histogram is
    enabled.
  ref: "concepts.md#timer"

- id: instrumentation-with-micrometer-and-metrics-libraries-014
  difficulty: intermediate
  tags: [distribution-summary, timer, units]
  question: |
    You want to track the distribution of request payload sizes in bytes. Which
    meter type is the right choice?
  options:
  - "Counter"
  - "DistributionSummary"
  - "LongTaskTimer"
  - "Timer"
  answer: 1
  explanation: |
    DistributionSummary tracks the distribution of non-time values (e.g. bytes,
    batch sizes). Timer is specifically for durations; the rule of thumb is
    Timer = seconds, DistributionSummary = any other unit.
  ref: "concepts.md#distributionsummary"

- id: instrumentation-with-micrometer-and-metrics-libraries-015
  difficulty: beginner
  tags: [distribution-summary, base-unit]
  question: |
    When creating a DistributionSummary for byte sizes, what should you set so
    dashboards label it correctly?
  options:
  - ".percentilePrecision(3)"
  - ".decrement()"
  - ".strongReference(true)"
  - ".baseUnit(\"bytes\")"
  answer: 3
  explanation: |
    DistributionSummary.builder(...).baseUnit("bytes") records the unit so backends
    and dashboards label the metric appropriately.
  ref: "concepts.md#distributionsummary"

- id: instrumentation-with-micrometer-and-metrics-libraries-016
  difficulty: intermediate
  tags: [longtasktimer, in-flight]
  question: |
    A nightly batch job occasionally hangs for hours. With a regular Timer, your
    dashboard shows nothing until the job finishes. Which meter solves this?
  options:
  - "FunctionCounter"
  - "Counter"
  - "Gauge"
  - "LongTaskTimer"
  answer: 3
  explanation: |
    A LongTaskTimer reports the number of active tasks and the duration of each
    still-running task, so you can alert on a stuck job while it is in-flight. A
    normal Timer records only after completion.
  ref: "concepts.md#longtasktimer"

- id: instrumentation-with-micrometer-and-metrics-libraries-017
  difficulty: intermediate
  tags: [longtasktimer, timer, difference]
  question: |
    What is the key difference between a LongTaskTimer and a regular Timer?
  options:
  - "A Timer records a task's duration only after it completes; a LongTaskTimer measures tasks while they are still running"
  - "LongTaskTimer always records durations in milliseconds while a regular Timer records them in its base unit of seconds"
  - "LongTaskTimer meters are structurally forbidden from carrying tags, whereas a regular Timer accepts arbitrary dimensions"
  - "LongTaskTimer publishes only to the Prometheus registry and is silently ignored by every other monitoring backend"
  answer: 0
  explanation: |
    A regular Timer contributes nothing until a task finishes. A LongTaskTimer
    tracks in-flight tasks — active count and elapsed duration so far — which is
    essential for observing long-running operations that might hang.
  ref: "concepts.md#longtasktimer"

- id: instrumentation-with-micrometer-and-metrics-libraries-018
  difficulty: advanced
  tags: [percentiles, histograms, aggregation]
  question: |
    You configured publishPercentiles(0.99) on a Timer across 10 pods. Your SLI
    dashboard uses avg(http_server_requests_seconds{quantile="0.99"}). Why is this
    wrong?
  options:
  - "Quantiles are not additive, so averaging per-instance p99 values does not give the fleet-wide p99"
  - "You must always use max() rather than avg() for any latency metric, since avg() is invalid on time series"
  - "publishPercentiles is not supported by the Prometheus registry and is silently dropped before scraping"
  - "The quantile label is spelled incorrectly and should read percentile for Prometheus to match the series"
  answer: 0
  explanation: |
    Client-side (pre-computed) percentiles cannot be aggregated across instances —
    quantiles are not additive. The average of per-pod p99 values is statistically
    invalid. Use server-side histogram buckets and histogram_quantile over summed
    buckets instead.
  ref: "concepts.md#client-side-percentiles-vs-server-side-histograms"

- id: instrumentation-with-micrometer-and-metrics-libraries-019
  difficulty: advanced
  tags: [histograms, promql, histogram-quantile]
  question: |
    Which PromQL correctly computes a fleet-wide p95 latency from Micrometer
    histogram buckets?
  options:
  - "quantile(0.95, rate(http_server_requests_seconds_bucket[5m]))"
  - "avg(rate(http_server_requests_seconds{quantile=\"0.95\"}[5m]))"
  - "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))"
  - "rate(http_server_requests_seconds_sum[5m]) / rate(http_server_requests_seconds_count[5m])"
  answer: 2
  explanation: |
    Histogram buckets are additive counts. You sum the rate of buckets by the le
    label across instances first, then apply histogram_quantile to derive the p95.
    This is aggregatable, unlike pre-computed quantiles.
  ref: "concepts.md#client-side-percentiles-vs-server-side-histograms"

- id: instrumentation-with-micrometer-and-metrics-libraries-020
  difficulty: intermediate
  tags: [percentiles, histograms, tradeoffs]
  question: |
    Which is an advantage of server-side histograms over client-side percentiles?
  options:
  - "They are computed inside the application process before export"
  - "They always produce fewer time series than client-side percentiles do"
  - "You can compute any percentile after the fact and aggregate across instances"
  - "They require no bucket configuration or boundary tuning of any kind"
  answer: 2
  explanation: |
    Because histograms expose bucket counts, the backend can compute any quantile at
    query time and buckets can be summed across instances. The trade-off is more
    time series (one per bucket). Client-side percentiles fix the quantile at publish
    time and cannot be aggregated.
  ref: "concepts.md#client-side-percentiles-vs-server-side-histograms"

- id: instrumentation-with-micrometer-and-metrics-libraries-021
  difficulty: intermediate
  tags: [percentiles, prometheus, summary]
  question: |
    Client-side percentiles published by Micrometer to Prometheus most closely
    correspond to which Prometheus metric type?
  options:
  - "Summary (with a quantile label)"
  - "Native histogram (dynamic buckets)"
  - "Counter (with a _total suffix)"
  - "Gauge (sampled at scrape time)"
  answer: 0
  explanation: |
    Pre-computed client-side percentiles appear as a series with a quantile label,
    which is how a Prometheus Summary represents quantiles. Like summaries, these
    values are not aggregatable across instances.
  ref: "concepts.md#client-side-percentiles-vs-server-side-histograms"

- id: instrumentation-with-micrometer-and-metrics-libraries-022
  difficulty: intermediate
  tags: [slo, histogram, buckets]
  question: |
    What does serviceLevelObjectives(Duration.ofMillis(300)) add to a Timer?
  options:
  - "It adds a cumulative histogram bucket at the 300ms boundary you care about"
  - "It sets the Prometheus scrape interval for this timer to 300ms"
  - "It computes the p300 percentile from the recorded distribution"
  - "It rejects and drops any request that takes longer than 300ms"
  answer: 0
  explanation: |
    SLO boundaries add specific cumulative histogram buckets at the thresholds you
    alert on. Each becomes a _bucket{le="0.3"} series, letting you compute the
    fraction of requests under the SLO directly and feed histogram_quantile.
  ref: "concepts.md#publishpercentilehistogram-slo-boundaries-and-native-histograms"

- id: instrumentation-with-micrometer-and-metrics-libraries-023
  difficulty: advanced
  tags: [slo, promql, error-budget]
  question: |
    Given a Timer with an SLO bucket at le="0.3", which PromQL gives the fraction
    of requests that met a 300ms SLO over 5 minutes?
  options:
  - "sum(rate(http_server_requests_seconds_bucket{le=\"0.3\"}[5m])) / sum(rate(http_server_requests_seconds_count[5m]))"
  - "histogram_quantile(0.3, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))"
  - "rate(http_server_requests_seconds_sum[5m]) / rate(http_server_requests_seconds_count[5m])"
  - "sum(rate(http_server_requests_seconds_bucket{le=\"0.3\"}[5m])) / sum(rate(http_server_requests_seconds_sum[5m]))"
  answer: 0
  explanation: |
    The le="0.3" bucket counts requests completing within 300ms. Dividing its rate
    by the total request count rate yields the fraction meeting the SLO — the good
    ratio you use for SLO/error-budget calculations.
  ref: "concepts.md#publishpercentilehistogram-slo-boundaries-and-native-histograms"

- id: instrumentation-with-micrometer-and-metrics-libraries-024
  difficulty: intermediate
  tags: [expected-value, memory, histogram]
  question: |
    What is the purpose of minimumExpectedValue and maximumExpectedValue on a
    Timer's distribution config?
  options:
  - "They control the scrape interval used by the Prometheus registry"
  - "They drop and discard any recorded value that falls outside the range"
  - "They bound the histogram range so you don't allocate buckets outside the plausible latency range"
  - "They set the alerting thresholds that trigger the timer's SLO alarms"
  answer: 2
  explanation: |
    These clamps bound the histogram's range (default ~1ms–30s for Timers) to control
    memory/cardinality — you don't pay for buckets outside the expected range. They
    are not a hard filter that discards recorded values.
  ref: "concepts.md#publishpercentilehistogram-slo-boundaries-and-native-histograms"

- id: instrumentation-with-micrometer-and-metrics-libraries-025
  difficulty: advanced
  tags: [native-histogram, prometheus]
  question: |
    What is a key advantage of Prometheus native (exponential) histograms over
    classic per-bucket histograms?
  options:
  - "They eliminate the need for the le label by exposing a quantile label per instance instead"
  - "They cannot be used with histogram_quantile and require a dedicated PromQL function"
  - "They store the whole distribution in one compact series with dynamic exponential buckets, no manual boundary picking, and aggregate automatically"
  - "They are computed only on the client at publish time and therefore cannot be aggregated across pods"
  answer: 2
  explanation: |
    Native histograms store count, sum, and a dynamic set of exponential buckets in a
    single sample. You set a resolution instead of hand-picking boundaries, they
    aggregate automatically, and they use less storage than classic histograms while
    keeping bounded error.
  ref: "concepts.md#publishpercentilehistogram-slo-boundaries-and-native-histograms"

- id: instrumentation-with-micrometer-and-metrics-libraries-026
  difficulty: beginner
  tags: [naming, convention]
  question: |
    What is Micrometer's recommended metric naming style that maximizes portability
    across backends?
  options:
  - "Kebab-case with hyphens (e.g. http-server-requests)"
  - "UPPER_SNAKE_CASE with underscores (e.g. HTTP_SERVER_REQUESTS)"
  - "Lowercase words separated by dots (e.g. http.server.requests)"
  - "camelCase with no separators (e.g. httpServerRequests)"
  answer: 2
  explanation: |
    Micrometer uses lowercase words separated by dots. Each backend's NamingConvention
    then translates the neutral name into that system's idiom (snake_case, camelCase,
    etc.), giving maximum portability.
  ref: "concepts.md#meter-naming-convention"

- id: instrumentation-with-micrometer-and-metrics-libraries-027
  difficulty: intermediate
  tags: [naming, prometheus, atlas]
  question: |
    The meter name http.server.requests is registered. How is it rendered in
    Prometheus vs Atlas?
  options:
  - "Both backends render it verbatim as http.server.requests with no changes"
  - "Prometheus: HTTPServerRequests (PascalCase); Atlas: http-server-requests (kebab-case)"
  - "Prometheus: http.server.requests (dotted); Atlas: http_server_requests (snake_case)"
  - "Prometheus: http_server_requests_seconds (snake_case + unit suffix); Atlas: httpServerRequests (camelCase)"
  answer: 3
  explanation: |
    The Prometheus NamingConvention produces snake_case and appends base-unit suffixes
    (http_server_requests_seconds). Atlas uses camelCase (httpServerRequests). Same
    neutral name, different per-backend rendering.
  ref: "concepts.md#meter-naming-convention"

- id: instrumentation-with-micrometer-and-metrics-libraries-028
  difficulty: intermediate
  tags: [naming, tags, design]
  question: |
    Which naming approach follows Micrometer's "name the what, tag the which"
    guidance?
  options:
  - "counter(\"database.calls\", \"db\", \"users\")"
  - "counter(\"database_users_calls_total\") with the target baked into the name"
  - "counter(\"calls.database.users\") encoding each dimension as a name segment"
  - "counter(\"calls\", \"class\", \"database\", \"db\", \"users\")"
  answer: 0
  explanation: |
    The meter name should describe the measurement (database.calls) and specifics go
    into tags (db=users). This lets you select database.calls for totals and drill
    down by tag. Overloading a generic name like "calls" is the anti-pattern.
  ref: "concepts.md#meter-naming-convention"

- id: instrumentation-with-micrometer-and-metrics-libraries-029
  difficulty: beginner
  tags: [naming, suffixes, prometheus]
  question: |
    Should you manually add a _total or _seconds suffix to your Micrometer meter
    names for Prometheus?
  options:
  - "No — Prometheus never adds suffixes, so you must supply them yourself"
  - "Yes, always append _total to every meter name regardless of meter type"
  - "No — the Prometheus NamingConvention appends unit/type suffixes automatically"
  - "Yes, but only add the suffix for gauges, not for counters or timers"
  answer: 2
  explanation: |
    The Prometheus NamingConvention automatically appends type/unit suffixes (_total
    for counters, _seconds* for timers). Baking these into your Micrometer name would
    duplicate them.
  ref: "concepts.md#meter-naming-convention"

- id: instrumentation-with-micrometer-and-metrics-libraries-030
  difficulty: beginner
  tags: [tags, dimensions]
  question: |
    What are tags (a.k.a. dimensions/labels) in Micrometer?
  options:
  - "Key/value pairs that let you slice a single metric along multiple dimensions"
  - "The scrape interval configuration applied per meter by the registry"
  - "The canonical base unit (seconds or bytes) assigned to the meter"
  - "Free-text comments attached to a meter for documentation purposes only"
  answer: 0
  explanation: |
    Tags are key/value pairs attached to a meter. They add dimensions so one metric
    (e.g. http.server.requests) can be sliced by method, uri, status, etc.
  ref: "concepts.md#tags-dimensions-and-base-units"

- id: instrumentation-with-micrometer-and-metrics-libraries-031
  difficulty: intermediate
  tags: [tags, identity, gotcha]
  question: |
    Which statement about meter identity and tags is TRUE?
  options:
  - "Two meters that share a name must also carry identical tag values to coexist"
  - "A meter is identified by its name only; its tags are ignored when computing identity"
  - "A meter is uniquely identified by its name plus its full set of tag key/values"
  - "Tag values may be left null and Micrometer substitutes an empty string"
  answer: 2
  explanation: |
    A meter's identity is its name plus the complete set of tag key/values — different
    tag values produce different time series. Tag values must be non-null, and every
    series of a given name should carry the same tag keys.
  ref: "concepts.md#tags-dimensions-and-base-units"

- id: instrumentation-with-micrometer-and-metrics-libraries-032
  difficulty: intermediate
  tags: [base-units, seconds]
  question: |
    Why does a Timer you recorded with Duration.ofMillis(...) show up as
    *_seconds in Prometheus?
  options:
  - "Because Micrometer's base time unit is seconds, so values are stored in seconds and the naming convention adds the _seconds suffix"
  - "Because Micrometer requires that all Timers be recorded using Duration.ofSeconds(...)"
  - "It is a known Micrometer bug that requires a manual millis-to-seconds conversion step"
  - "Because Prometheus only supports second-resolution timestamps and rounds finer values"
  answer: 0
  explanation: |
    Micrometer normalizes to canonical base units — time in seconds, data in bytes.
    Regardless of how you recorded the duration, the value is stored in seconds and the
    Prometheus NamingConvention appends the _seconds base-unit suffix.
  ref: "concepts.md#tags-dimensions-and-base-units"

- id: instrumentation-with-micrometer-and-metrics-libraries-033
  difficulty: beginner
  tags: [base-units, bytes]
  question: |
    What are Micrometer's canonical base units for time and data size?
  options:
  - "Nanoseconds and megabytes"
  - "Minutes and bits"
  - "Milliseconds and kilobytes"
  - "Seconds and bytes"
  answer: 3
  explanation: |
    Micrometer records time in seconds and data in bytes as its base units, so metrics
    are consistent across backends.
  ref: "concepts.md#tags-dimensions-and-base-units"

- id: instrumentation-with-micrometer-and-metrics-libraries-034
  difficulty: beginner
  tags: [common-tags]
  question: |
    What are common tags in Micrometer?
  options:
  - "Tags that are automatically applied to every meter in a registry"
  - "Tags that apply only to Timer meters and are ignored by other meter types"
  - "The tag values that appear most frequently across the codebase's instrumentation"
  - "Tags that are shared between exactly two specific meters you designate"
  answer: 0
  explanation: |
    Common tags are configured on the registry and applied to every meter — typically
    infrastructure context like application, region, env, or stack.
  ref: "concepts.md#common-tags"

- id: instrumentation-with-micrometer-and-metrics-libraries-035
  difficulty: advanced
  tags: [common-tags, ordering, gotcha]
  question: |
    A team notices their JVM/auto-configured meters are missing the region common
    tag, but their custom meters have it. What is the most likely cause?
  options:
  - "Common tags are structurally forbidden on JVM meters and are silently stripped"
  - "Common tags were added after some auto-configured MeterBinders had already registered their meters"
  - "The region tag value resolved to null and was dropped during export"
  - "JVM MeterBinder meters never accept any tags beyond their built-in ones"
  answer: 1
  explanation: |
    Common tags must be added to the registry before any meters — including
    auto-configured MeterBinders — are registered, or the early meters miss them. In
    Spring Boot a MeterRegistryCustomizer bean ensures the correct timing.
  ref: "concepts.md#common-tags"

- id: instrumentation-with-micrometer-and-metrics-libraries-036
  difficulty: intermediate
  tags: [common-tags, spring-boot]
  question: |
    In Spring Boot, what is the idiomatic bean for adding common tags with the
    correct timing?
  options:
  - "A @Bean of type HdrHistogram wired into the registry's config"
  - "A @Bean of type MeterRegistryCustomizer<MeterRegistry>"
  - "A @Bean of type TimedAspect that intercepts registered meters"
  - "A @Bean of type SimpleMeterRegistry seeded with the shared tags"
  answer: 1
  explanation: |
    Registering a MeterRegistryCustomizer<MeterRegistry> bean lets you call
    config().commonTags(...) before meters are registered, ensuring even
    auto-configured binders get the common tags.
  ref: "concepts.md#common-tags"

- id: instrumentation-with-micrometer-and-metrics-libraries-037
  difficulty: beginner
  tags: [cardinality, definition]
  question: |
    What does cardinality of a metric refer to?
  options:
  - "The number of monitoring backends the registry simultaneously publishes that meter to"
  - "The number of distinct time series it produces (roughly the product of distinct tag values)"
  - "The number of significant digits retained in the meter's recorded floating-point value"
  - "How frequently the Prometheus server scrapes the meter, measured in samples per minute"
  answer: 1
  explanation: |
    Cardinality is the number of distinct time series a metric produces — roughly the
    product of the distinct values of each of its tags. Every unique tag combination is
    a separate series to store, index, and query.
  ref: "concepts.md#avoiding-high-cardinality-tags"

- id: instrumentation-with-micrometer-and-metrics-libraries-038
  difficulty: intermediate
  tags: [cardinality, tags, danger]
  question: |
    Which tag value is MOST likely to cause a high-cardinality explosion?
  options:
  - "status class (2xx/4xx/5xx), a fixed handful of response outcome buckets"
  - "raw request URL including path parameters like /orders/12345"
  - "region (us-east-1/eu-west-1), one of only a few deployment regions"
  - "http.method (GET/POST/PUT/DELETE), a small closed set of verbs"
  answer: 1
  explanation: |
    A raw URL with path parameters creates a new series per unique id, effectively
    unbounded. Use the templated route /orders/{id} instead. The other tags have small,
    bounded value sets.
  ref: "concepts.md#avoiding-high-cardinality-tags"

- id: instrumentation-with-micrometer-and-metrics-libraries-039
  difficulty: intermediate
  tags: [cardinality, trace-id, logs]
  question: |
    A developer wants to attach the trace ID to every metric so they can correlate
    metrics with traces. Why is this a bad idea?
  options:
  - "It would push the meter name past Prometheus's hard 128-character limit, so the exporter would silently truncate and drop it"
  - "Trace IDs are only 8 hexadecimal characters, too short to uniquely correlate a metric back to its originating trace"
  - "Trace IDs are effectively unbounded, so as a tag they explode cardinality; correlation IDs belong in traces and logs, not metric tags"
  - "Micrometer meters only accept numeric tag values, so a hexadecimal trace-ID string cannot be attached at all"
  answer: 2
  explanation: |
    Trace/request/session IDs are high-variety, effectively unbounded values. As metric
    tags they create one series per request and blow up the TSDB. Such identifiers
    belong in traces and logs, never in metric tags.
  ref: "concepts.md#avoiding-high-cardinality-tags"

- id: instrumentation-with-micrometer-and-metrics-libraries-040
  difficulty: advanced
  tags: [cardinality, meter-filter]
  question: |
    Which Micrometer mechanism lets you cap or drop offending tags/meters at the
    registry to control cardinality?
  options:
  - "NamingConvention, which rewrites tag keys per backend but never removes or caps offending tag values"
  - "TimedAspect, which intercepts @Timed methods yet has no authority over tag cardinality at the registry"
  - "MeterBinder, which only registers bundles of new meters and cannot drop existing high-cardinality tags"
  - "MeterFilter (e.g. maximumAllowableTags, denyNameStartsWith, deny)"
  answer: 3
  explanation: |
    A MeterFilter applied to the registry can cap tag cardinality
    (maximumAllowableTags), deny meters by name prefix, or transform/drop tags —
    the primary lever for controlling cardinality centrally.
  ref: "concepts.md#avoiding-high-cardinality-tags"

- id: instrumentation-with-micrometer-and-metrics-libraries-041
  difficulty: advanced
  tags: [cardinality, multiplication]
  question: |
    A metric http.server.requests has tags method (5 values), uri (200 templated
    routes), status (6 classes), deployed on 50 instances. Roughly how many series
    does it generate?
  options:
  - "About 6,000, taking only method times uri and ignoring the instance replication"
  - "About 300,000"
  - "About 50, one series per deployed instance with the tags collapsed together"
  - "About 261, from adding the four tag counts rather than multiplying them"
  answer: 1
  explanation: |
    Cardinality multiplies: 5 × 200 × 6 × 50 = 300,000 series from a single metric
    name. This is why bounding each tag's value set matters.
  ref: "concepts.md#avoiding-high-cardinality-tags"

- id: instrumentation-with-micrometer-and-metrics-libraries-042
  difficulty: beginner
  tags: [meter-binder, auto-instrumentation]
  question: |
    What is a MeterBinder in Micrometer?
  options:
  - "An annotation you place on methods so the aspect times each invocation automatically"
  - "A component that binds a set of related metrics to a registry, e.g. JVM or system metrics"
  - "A registry filter whose sole job is stripping high-cardinality tags before export"
  - "The block of Prometheus scrape configuration that declares which endpoints to poll"
  answer: 1
  explanation: |
    A MeterBinder registers a bundle of related meters to a registry via bindTo(). It
    is the mechanism behind out-of-the-box JVM, GC, thread, class-loader, and system
    metrics, and library-provided instrumentation.
  ref: "concepts.md#meterbinder-and-auto-instrumentation"

- id: instrumentation-with-micrometer-and-metrics-libraries-043
  difficulty: intermediate
  tags: [meter-binder, jvm-metrics]
  question: |
    Which of these JVM/system metric sets is provided by a built-in Micrometer
    MeterBinder?
  options:
  - "The full text content of every log message emitted by the application at runtime"
  - "Business KPIs such as revenue per customer, computed from your domain aggregates"
  - "jvm.memory.used, jvm.gc.pause, jvm.threads.live, system.cpu.usage"
  - "Distributed trace spans with parent-child links, exported to a tracing backend"
  answer: 2
  explanation: |
    Binders like JvmMemoryMetrics, JvmGcMetrics, JvmThreadMetrics, and ProcessorMetrics
    provide jvm.memory.*, jvm.gc.*, jvm.threads.*, and system/process CPU metrics out of
    the box.
  ref: "concepts.md#meterbinder-and-auto-instrumentation"

- id: instrumentation-with-micrometer-and-metrics-libraries-044
  difficulty: intermediate
  tags: [meter-binder, libraries, best-practice]
  question: |
    Before writing custom code to instrument your HikariCP connection pool, what
    should you check first?
  options:
  - "Whether the HikariCP pool can push its stats straight to an OTLP collector on its own"
  - "Whether Prometheus has a built-in connection-pool data type you must enable first"
  - "Whether an existing MeterBinder already exposes those metrics (it does for HikariCP)"
  - "Whether you must first disable common tags so the pool metrics register cleanly"
  answer: 2
  explanation: |
    Most common infrastructure (JVM, connection pools like HikariCP, caches, HTTP
    clients/servers) already has a MeterBinder. Check for one before writing custom
    instrumentation — in Spring Boot these are auto-configured.
  ref: "concepts.md#meterbinder-and-auto-instrumentation"

- id: instrumentation-with-micrometer-and-metrics-libraries-045
  difficulty: intermediate
  tags: [timed, annotation, aspect]
  question: |
    A developer added @Timed to a service method but no timer metric appears. What
    is the most likely missing piece?
  options:
  - "There is no TimedAspect bean registered to intercept @Timed"
  - "@Timed is honoured only on Spring MVC controller handler methods, never on service beans"
  - "The /actuator/prometheus scrape endpoint has not been added to the exposure include list"
  - "The annotated method returns void, and @Timed silently skips methods with no return value"
  answer: 0
  explanation: |
    @Timed does nothing on its own. You must register a TimedAspect bean (with
    AspectJ/proxying available) so the annotation is intercepted and the timer is
    recorded.
  ref: "concepts.md#the-timed-annotation"

- id: instrumentation-with-micrometer-and-metrics-libraries-046
  difficulty: advanced
  tags: [timed, self-invocation, aop]
  question: |
    @Timed is present and a TimedAspect bean exists, yet an internal call still
    isn't timed. Which gotcha explains this?
  options:
  - "The method must also carry @Async so the aspect can schedule its timing on a separate thread"
  - "@Timed only records when the annotated method is declared static rather than an instance method"
  - "The method was called via this.method() internally, bypassing the proxy"
  - "TimedAspect can only produce LongTaskTimer meters, so a plain @Timed on a fast method emits nothing"
  answer: 2
  explanation: |
    Like any proxy-based aspect, @Timed only applies when the method is invoked through
    the proxy. A self-invocation (this.method()) calls the raw instance and bypasses the
    aspect, so no timing is recorded.
  ref: "concepts.md#the-timed-annotation"

- id: instrumentation-with-micrometer-and-metrics-libraries-047
  difficulty: intermediate
  tags: [timed, http-server-requests, spring-boot]
  question: |
    In a Spring Boot web app, is it necessary to annotate every controller method
    with @Timed to get basic request-latency metrics?
  options:
  - "Yes, but @Timed is required only on GET endpoints since Spring Boot auto-times the write verbs"
  - "No — Spring Boot's web layer emits only request counters and never records latency timers"
  - "Yes, every controller endpoint must be individually annotated with @Timed to appear"
  - "No — Spring Boot already auto-instruments http.server.requests timers for web endpoints"
  answer: 3
  explanation: |
    Spring Boot's web layer auto-provides http.server.requests timers (tagged with the
    templated uri, method, status, outcome). You don't need @Timed on controllers for
    basic request timing.
  ref: "concepts.md#the-timed-annotation"

- id: instrumentation-with-micrometer-and-metrics-libraries-048
  difficulty: beginner
  tags: [actuator, spring-boot, endpoint]
  question: |
    In Spring Boot with the Prometheus registry, which endpoint exposes metrics in
    the Prometheus scrape format?
  options:
  - "/metrics.json, a static JSON dump of the latest values with no scrape formatting"
  - "/actuator/prometheus"
  - "/actuator/health, which returns liveness status rather than any time-series metrics"
  - "/prometheus/scrape, a fixed path the registry mounts outside the actuator namespace"
  answer: 1
  explanation: |
    With spring-boot-starter-actuator and micrometer-registry-prometheus (and the
    endpoint exposed), /actuator/prometheus serves metrics in Prometheus exposition
    format. /actuator/metrics offers a JSON browse view.
  ref: "concepts.md#spring-boot-actuator-integration"

- id: instrumentation-with-micrometer-and-metrics-libraries-049
  difficulty: intermediate
  tags: [actuator, properties, histogram]
  question: |
    Which Spring Boot property enables server-side histogram buckets for the
    http.server.requests timer without writing code?
  options:
  - "management.endpoints.web.exposure.include=histogram, exposing a dedicated histogram actuator endpoint"
  - "spring.metrics.histogram=all, a global switch enabling buckets on every registered meter"
  - "management.metrics.enable.http=true, which toggles collection of the HTTP timer group"
  - "management.metrics.distribution.percentiles-histogram.http.server.requests=true"
  answer: 3
  explanation: |
    Spring Boot exposes distribution config as properties. Setting
    management.metrics.distribution.percentiles-histogram.http.server.requests=true
    turns on the percentile histogram (server-side buckets) for that timer.
  ref: "concepts.md#spring-boot-actuator-integration"

- id: instrumentation-with-micrometer-and-metrics-libraries-050
  difficulty: intermediate
  tags: [actuator, http-server-requests, cardinality]
  question: |
    Spring Boot's auto-configured http.server.requests timer tags uri with the
    templated route (e.g. /orders/{id}) rather than the raw path. Why?
  options:
  - "Purely to make dashboard tables look cleaner, with no effect on the stored series count"
  - "To keep cardinality bounded — raw paths with ids would create unbounded series"
  - "Because the Prometheus exposition format forbids the slash character inside any label value"
  - "Because the raw request path is unavailable to the filter by the time the timer is recorded"
  answer: 1
  explanation: |
    Templating the uri to the route keeps the tag's value set bounded to the number of
    endpoints, preventing a series-per-id cardinality explosion that raw paths would
    cause.
  ref: "concepts.md#spring-boot-actuator-integration"

- id: instrumentation-with-micrometer-and-metrics-libraries-051
  difficulty: beginner
  tags: [actuator, dependencies]
  question: |
    What two dependencies does a Spring Boot app typically need to expose metrics to
    Prometheus?
  options:
  - "micrometer-core and slf4j-api only, relying on the logging facade to emit the scrape output"
  - "prometheus-server and grafana bundled as application dependencies inside the service jar"
  - "spring-boot-starter-web and spring-boot-starter-test to serve and assert the metrics endpoint"
  - "spring-boot-starter-actuator and micrometer-registry-prometheus"
  answer: 3
  explanation: |
    spring-boot-starter-actuator auto-configures Micrometer and the endpoints, and
    micrometer-registry-prometheus provides the Prometheus registry and scrape format.
  ref: "concepts.md#spring-boot-actuator-integration"

- id: instrumentation-with-micrometer-and-metrics-libraries-052
  difficulty: advanced
  tags: [timer, mean, promql]
  question: |
    Which PromQL gives the mean latency of a Timer over the last 5 minutes?
  options:
  - "rate(http_server_requests_seconds_sum[5m]) / rate(http_server_requests_seconds_count[5m])"
  - "histogram_quantile(0.5, http_server_requests_seconds_bucket), reading the median bucket boundary"
  - "avg(http_server_requests_seconds_bucket[5m]), averaging the cumulative bucket counters directly"
  - "http_server_requests_seconds_sum / http_server_requests_seconds_count (raw totals)"
  answer: 0
  explanation: |
    Dividing the rate of _sum by the rate of _count over the same window gives the mean
    latency for that window. Using raw totals gives the all-time mean, not a recent
    rate; histogram_quantile(0.5,...) gives the median, not the mean.
  ref: "concepts.md#timer"
