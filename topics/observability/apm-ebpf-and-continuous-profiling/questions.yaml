topic: "APM, eBPF & Continuous Profiling"
domain: observability
topic_slug: apm-ebpf-and-continuous-profiling
version: 1
questions:
  - id: apm-ebpf-and-continuous-profiling-001
    difficulty: beginner
    tags: [apm, definition, fundamentals]
    question: |
      What best describes Application Performance Monitoring (APM) as a class of tools?
    options:
      - "A platform that auto-instruments an app to produce correlated traces, metrics, and errors tied to the code"
      - "A load balancer that reroutes traffic away from slow endpoints"
      - "A log-only system that indexes plain-text application logs"
      - "A CI system that runs performance tests before each deploy"
    answer: 0
    explanation: |
      APM platforms (Datadog, New Relic, Dynatrace, Elastic APM) ship a language agent
      that auto-instruments the app to emit traces, service-level metrics, and error
      tracking, all correlated so you can see which endpoint/dependency is slow or
      failing and where in the code.
    ref: "concepts.md#what-apm-is-and-why-it-exists"

  - id: apm-ebpf-and-continuous-profiling-002
    difficulty: beginner
    tags: [apm, signals]
    question: |
      Which set of signals does a typical modern APM product bundle and auto-correlate?
    options:
      - "Only infrastructure metrics (CPU, memory, disk)"
      - "Only plain-text logs from stdout"
      - "Distributed traces, service-level (RED) metrics, and error/exception tracking"
      - "Only synthetic uptime checks from external probes"
    answer: 2
    explanation: |
      APM bundles distributed traces (auto spans for HTTP/DB/cache/queue), service-level
      RED metrics per endpoint/dependency, and error tracking, plus a service map built
      from trace edges — all correlated by trace/span IDs.
    ref: "concepts.md#what-apm-is-and-why-it-exists"

  - id: apm-ebpf-and-continuous-profiling-003
    difficulty: beginner
    tags: [apm, service-map]
    question: |
      An APM tool automatically draws a "service map" (dependency graph). Where does this
      topology primarily come from?
    options:
      - "A manually maintained YAML file listing all services"
      - "Scraping Kubernetes labels only"
      - "Parsing application log messages for service names"
      - "The edges between spans in the distributed traces the agent collects"
    answer: 3
    explanation: |
      The service map is derived from trace data: each cross-service span edge (caller →
      callee) becomes an edge in the topology graph, so the map is auto-generated from
      the traces the agent produces.
    ref: "concepts.md#what-apm-is-and-why-it-exists"

  - id: apm-ebpf-and-continuous-profiling-004
    difficulty: intermediate
    tags: [apm, agent, jvm, bytecode]
    question: |
      A Java service is started with a `-javaagent:apm.jar` flag and immediately produces
      spans for Servlet, JDBC, and Kafka calls with no code changes. What mechanism makes
      this possible?
    options:
      - "Bytecode instrumentation that rewrites known library classes at class-load time"
      - "The JVM automatically emits OTLP for all libraries by default"
      - "The agent recompiles the application from source at startup"
      - "Kernel eBPF probes attached to the JVM process"
    answer: 0
    explanation: |
      A JVM APM agent uses bytecode instrumentation (via ASM/Byte Buddy) to rewrite
      classes of known libraries as they are loaded, wrapping them to create spans and
      metrics without source changes.
    ref: "concepts.md#the-vendor-agent-auto-instrumentation-model"

  - id: apm-ebpf-and-continuous-profiling-005
    difficulty: intermediate
    tags: [apm, nodejs, auto-instrumentation]
    question: |
      How do Node.js APM agents most commonly auto-instrument libraries like `http` and
      `express`?
    options:
      - "By statically recompiling V8"
      - "By monkey-patching module loading to wrap known modules at require time"
      - "By attaching kernel kprobes to libuv"
      - "By requiring developers to add a decorator to every route"
    answer: 1
    explanation: |
      Node agents hook into module loading (require) and monkey-patch known modules
      (http, express, pg) to wrap their functions, creating spans transparently.
    ref: "concepts.md#the-vendor-agent-auto-instrumentation-model"

  - id: apm-ebpf-and-continuous-profiling-006
    difficulty: intermediate
    tags: [apm, go, limitations]
    question: |
      Why is auto-instrumentation via a traditional language agent hardest for Go
      services?
    options:
      - "Go has no HTTP libraries to instrument"
      - "Go programs cannot make outbound network calls"
      - "Go is compiled with no runtime bytecode/IL rewriting, so there is nothing to patch at load time"
      - "Go forbids importing any third-party packages"
    answer: 2
    explanation: |
      Unlike JVM/.NET/Node, Go is compiled to a native binary with no runtime bytecode or
      IL to rewrite and no module-load hook, so agents can't monkey-patch. Go coverage
      often relies on manual instrumentation, compile-time instrumentation, or eBPF.
    ref: "concepts.md#the-vendor-agent-auto-instrumentation-model"

  - id: apm-ebpf-and-continuous-profiling-007
    difficulty: intermediate
    tags: [apm, lock-in, vendor]
    question: |
      Which is a genuine drawback of the proprietary vendor-agent model that OpenTelemetry
      aims to address?
    options:
      - "Agents cannot produce any metrics"
      - "Agents are unable to instrument databases"
      - "Agents only work on Windows"
      - "Instrumentation is coupled to one vendor's SDK/protocol, so switching vendors historically meant re-instrumenting"
    answer: 3
    explanation: |
      Because each vendor ships its own agent and wire protocol, your instrumentation is
      locked to that vendor — switching backends historically meant re-instrumenting.
      That lock-in is the core problem OpenTelemetry addresses.
    ref: "concepts.md#the-vendor-agent-auto-instrumentation-model"

  - id: apm-ebpf-and-continuous-profiling-008
    difficulty: intermediate
    tags: [apm, coverage, manual-instrumentation]
    question: |
      A team drops in an APM agent and gets rich spans for their web framework and
      database, but their custom in-house RPC protocol shows up as an opaque gap. Why?
    options:
      - "The agent only works for exactly 5 minutes after startup"
      - "Auto-instrumentation only covers libraries the agent explicitly knows; unknown/custom code needs manual spans"
      - "APM agents never instrument any network calls"
      - "The custom protocol must be rewritten in Java first"
    answer: 1
    explanation: |
      Agents instrument frameworks/clients they recognize. Custom protocols, in-house
      frameworks, and business logic are invisible until you add manual spans. APM gives
      the skeleton; you add the meat.
    ref: "concepts.md#the-vendor-agent-auto-instrumentation-model"

  - id: apm-ebpf-and-continuous-profiling-009
    difficulty: beginner
    tags: [opentelemetry, standards, otlp]
    question: |
      What does OpenTelemetry primarily standardize?
    options:
      - "The storage engine and query language of the backend"
      - "The pricing model for observability vendors"
      - "How telemetry is generated and transmitted (instrumentation + OTLP wire format + semantic conventions)"
      - "The color scheme of dashboards"
    answer: 2
    explanation: |
      OTel is an open standard for how telemetry is generated (SDK/auto-instrumentation),
      transmitted (OTLP), and named (semantic conventions). It is deliberately decoupled
      from any backend and is not itself a storage engine or UI.
    ref: "concepts.md#apm-vs-opentelemetry-open-standards--lock-in"

  - id: apm-ebpf-and-continuous-profiling-010
    difficulty: intermediate
    tags: [opentelemetry, backend, misconception]
    question: |
      Which statement about OpenTelemetry is correct?
    options:
      - "OTel provides instrumentation and the OTLP transport, but you still need a backend to store and visualize data"
      - "OTel stores your telemetry and renders service maps out of the box"
      - "OTel replaces the need for any backend"
      - "OTel is a proprietary format owned by a single APM vendor"
    answer: 0
    explanation: |
      OTel handles instrumentation, transport (OTLP), and semantic conventions — not
      storage or UI. You still route OTLP to a backend (Jaeger/Tempo/Prometheus or a
      commercial APM) to store and visualize.
    ref: "concepts.md#apm-vs-opentelemetry-open-standards--lock-in"

  - id: apm-ebpf-and-continuous-profiling-011
    difficulty: intermediate
    tags: [opentelemetry, architecture, portability]
    question: |
      A team wants a polished APM UI but also wants to avoid re-instrumenting if they ever
      switch vendors. Which architecture achieves both?
    options:
      - "Instrument with the vendor's proprietary agent and hope they never switch"
      - "Write all telemetry to log files and grep them"
      - "Disable tracing and rely only on host metrics"
      - "Instrument with OpenTelemetry, export OTLP, and send it to a commercial APM backend that ingests OTLP"
    answer: 3
    explanation: |
      Instrumenting with OTel (open, portable) and exporting OTLP to an OTLP-ingesting
      commercial APM gives you a good UI now while keeping instrumentation vendor-neutral,
      so switching backends later doesn't require re-instrumenting.
    ref: "concepts.md#apm-vs-opentelemetry-open-standards--lock-in"

  - id: apm-ebpf-and-continuous-profiling-012
    difficulty: beginner
    tags: [ebpf, definition, kernel]
    question: |
      What does eBPF fundamentally let you do?
    options:
      - "Compile applications to WebAssembly for the browser"
      - "Run sandboxed programs inside the Linux kernel in response to events, without changing kernel source or the app"
      - "Replace the Linux scheduler with a custom userspace one"
      - "Encrypt all network traffic automatically"
    answer: 1
    explanation: |
      eBPF runs small, verified, sandboxed programs in the kernel triggered by events
      (syscalls, function entry/exit, network, timers) with no kernel module, no kernel
      source change, and no application modification.
    ref: "concepts.md#what-ebpf-is-and-how-it-works"

  - id: apm-ebpf-and-continuous-profiling-013
    difficulty: intermediate
    tags: [ebpf, verifier, safety]
    question: |
      Why is it safe to run eBPF programs inside the kernel?
    options:
      - "A verifier statically proves termination and memory safety before the program is loaded, then it is JIT-compiled"
      - "They are written in a memory-safe language that never crashes"
      - "The kernel runs them in a separate virtual machine on another host"
      - "They can only run for exactly one millisecond each"
    answer: 0
    explanation: |
      Before load, the eBPF verifier statically proves the program terminates (only
      bounded loops), touches no uninitialized/out-of-bounds memory, and stays within
      complexity/size limits. Verified bytecode is then JIT-compiled to native code.
    ref: "concepts.md#what-ebpf-is-and-how-it-works"

  - id: apm-ebpf-and-continuous-profiling-014
    difficulty: intermediate
    tags: [ebpf, maps, userspace]
    question: |
      How does data collected by an in-kernel eBPF program reach a user-space collector?
    options:
      - "The kernel emails it to the agent"
      - "By writing directly to the application's heap"
      - "Through eBPF maps (e.g. hash maps, ring/perf buffers) that user space reads via syscalls"
      - "It cannot — eBPF data stays in the kernel forever"
    answer: 2
    explanation: |
      eBPF programs write to maps (hash maps, arrays, ring/perf buffers, stack-trace
      maps). A user-space agent reads those maps via syscalls, which is how in-kernel
      telemetry gets out.
    ref: "concepts.md#what-ebpf-is-and-how-it-works"

  - id: apm-ebpf-and-continuous-profiling-015
    difficulty: intermediate
    tags: [ebpf, uprobes, kprobes]
    question: |
      What is the difference between a kprobe and a uprobe?
    options:
      - "kprobes are for networking; uprobes are for disk I/O"
      - "kprobes require root but uprobes never do"
      - "There is no difference; the names are interchangeable"
      - "kprobes attach to kernel functions; uprobes attach to user-space functions"
    answer: 3
    explanation: |
      A kprobe dynamically instruments (almost any) kernel function entry/return; a uprobe
      does the same for user-space functions (e.g. a function in your binary or in
      libc/OpenSSL). Both are dynamic attach points.
    ref: "concepts.md#what-ebpf-is-and-how-it-works"

  - id: apm-ebpf-and-continuous-profiling-016
    difficulty: advanced
    tags: [ebpf, tracepoints, stability]
    question: |
      Why might you prefer a kernel tracepoint over a kprobe for the same event when a
      tracepoint is available?
    options:
      - "Tracepoints run in user space and are therefore faster"
      - "Tracepoints are stable, predefined instrumentation points that don't break across kernel versions like kprobes on internal functions can"
      - "Tracepoints require no verifier check"
      - "Kprobes cannot read any function arguments"
    answer: 1
    explanation: |
      Tracepoints are stable, maintained kernel instrumentation points, so programs
      attached to them survive kernel upgrades. Kprobes on internal functions can break
      when those functions are renamed/inlined across kernel versions.
    ref: "concepts.md#what-ebpf-is-and-how-it-works"

  - id: apm-ebpf-and-continuous-profiling-017
    difficulty: advanced
    tags: [ebpf, verifier, loops]
    question: |
      Which of these would the eBPF verifier reject at load time?
    options:
      - "A program that reads a value from a hash map"
      - "A program attached to a tracepoint"
      - "A program with an unbounded loop that the verifier cannot prove terminates"
      - "A program that writes to a ring buffer"
    answer: 2
    explanation: |
      The verifier requires provable termination — only bounded loops with a provable
      exit are allowed. An unbounded loop it cannot prove terminates is rejected, along
      with uninitialized/out-of-bounds memory access and programs exceeding complexity
      limits.
    ref: "concepts.md#what-ebpf-is-and-how-it-works"

  - id: apm-ebpf-and-continuous-profiling-018
    difficulty: advanced
    tags: [ebpf, co-re, portability]
    question: |
      What problem do CO-RE (Compile Once, Run Everywhere) and BTF solve for eBPF?
    options:
      - "They let a single compiled eBPF program run across kernel versions with different struct layouts"
      - "They encrypt eBPF maps at rest"
      - "They replace the verifier with a runtime check"
      - "They allow eBPF programs to call any kernel function directly"
    answer: 0
    explanation: |
      CO-RE plus BTF (BPF Type Format) lets one compiled program adapt to differing kernel
      struct layouts, so you don't have to recompile per kernel version — key for shipping
      portable eBPF observability agents.
    ref: "concepts.md#what-ebpf-is-and-how-it-works"

  - id: apm-ebpf-and-continuous-profiling-019
    difficulty: beginner
    tags: [ebpf, zero-code, kubernetes]
    question: |
      What is the main appeal of eBPF-based zero-code auto-instrumentation in a Kubernetes
      cluster?
    options:
      - "It requires rewriting every service in Rust"
      - "It only works if all services already use the same APM SDK"
      - "It disables the network to reduce noise"
      - "One node-level agent observes every pod/process in any language with no code changes or redeploys"
    answer: 3
    explanation: |
      Because eBPF observes at the kernel boundary, a single per-node DaemonSet can emit
      RED metrics/traces for every pod in any language — including Go — with no code
      changes and no redeploys, which is ideal for platform teams.
    ref: "concepts.md#ebpf-for-zero-code-auto-instrumentation--network-observability"

  - id: apm-ebpf-and-continuous-profiling-020
    difficulty: intermediate
    tags: [ebpf, tools, beyla]
    question: |
      Which tools are examples of eBPF-based zero-code auto-instrumentation for producing
      RED metrics/traces without an SDK?
    options:
      - "Maven and Gradle"
      - "Grafana Beyla and Odigos"
      - "systemd and cron"
      - "nginx and HAProxy"
    answer: 1
    explanation: |
      Grafana Beyla and Odigos attach eBPF probes to detect HTTP/gRPC/SQL at the
      syscall/library level and emit RED metrics and traces for uninstrumented services,
      including Go.
    ref: "concepts.md#ebpf-for-zero-code-auto-instrumentation--network-observability"

  - id: apm-ebpf-and-continuous-profiling-021
    difficulty: intermediate
    tags: [ebpf, network, cilium]
    question: |
      Cilium and Hubble use eBPF primarily to provide what kind of observability?
    options:
      - "JVM garbage-collection statistics"
      - "Front-end real-user monitoring in the browser"
      - "L3/L4/L7 network flow visibility, service maps, DNS, and policy enforcement from the kernel data path"
      - "SQL query plan analysis inside the database"
    answer: 2
    explanation: |
      Cilium (a CNI) and Hubble use eBPF at the kernel networking data path to give L3/L4/L7
      flow visibility, service maps, DNS visibility, and network-policy enforcement.
    ref: "concepts.md#ebpf-for-zero-code-auto-instrumentation--network-observability"

  - id: apm-ebpf-and-continuous-profiling-022
    difficulty: beginner
    tags: [ebpf, use-cases]
    question: |
      Which of the following is NOT a typical eBPF observability use case?
    options:
      - "Rendering business dashboards and BI reports"
      - "Zero-code auto-instrumentation for RED metrics"
      - "Network flow observability and service maps"
      - "Whole-system CPU profiling"
    answer: 0
    explanation: |
      eBPF is used for zero-code auto-instrumentation, network observability, profiling,
      and security observability. Rendering business/BI dashboards is a backend/UI concern,
      not something eBPF does.
    ref: "concepts.md#ebpf-for-zero-code-auto-instrumentation--network-observability"

  - id: apm-ebpf-and-continuous-profiling-023
    difficulty: intermediate
    tags: [ebpf, limits, tls]
    question: |
      Why can't an eBPF program simply read all your application's HTTP request bodies off
      the network wire?
    options:
      - "eBPF cannot attach to network events at all"
      - "HTTP bodies are always empty in production"
      - "The kernel deletes packet payloads before eBPF runs"
      - "On the wire the traffic is TLS-encrypted ciphertext; eBPF must uprobe the crypto library before encryption, which is fragile and incomplete"
    answer: 3
    explanation: |
      TLS means wire traffic is ciphertext. To see plaintext HTTP, eBPF must attach
      uprobes to the TLS library (e.g. SSL_read/SSL_write) before encryption — fragile,
      library-specific, and it can miss statically-linked or non-OpenSSL crypto.
    ref: "concepts.md#when-ebpf-beats-sdk-instrumentation--and-its-limits"

  - id: apm-ebpf-and-continuous-profiling-024
    difficulty: intermediate
    tags: [ebpf, limits, semantics]
    question: |
      What kind of information does an in-process SDK have that a kernel-level eBPF probe
      fundamentally lacks?
    options:
      - "The number of CPU cores on the host"
      - "Application/business semantics — e.g. that a request is 'the checkout flow for customer X' with logical attributes"
      - "The current system time"
      - "Whether the process is running"
    answer: 1
    explanation: |
      eBPF sees bytes and syscalls, not business meaning. An in-process SDK naturally has
      framework-level structure and can attach logical trace attributes (customer, flow,
      feature) that eBPF has no visibility into.
    ref: "concepts.md#when-ebpf-beats-sdk-instrumentation--and-its-limits"

  - id: apm-ebpf-and-continuous-profiling-025
    difficulty: advanced
    tags: [ebpf, distributed-tracing, propagation]
    question: |
      Why is producing fully-stitched cross-service distributed traces harder with eBPF
      than with an SDK?
    options:
      - "Distributed traces need trace-context propagation (e.g. W3C traceparent headers) that typically requires the app/SDK to inject headers"
      - "eBPF cannot measure latency"
      - "eBPF can only observe one process per cluster"
      - "Traces are illegal to construct in the kernel"
    answer: 0
    explanation: |
      Stitching spans across process hops needs propagated trace context (W3C
      traceparent). eBPF sees a request but can't easily create/inject that context, so
      eBPF tools often produce per-service RED + local spans rather than fully-stitched
      distributed traces.
    ref: "concepts.md#when-ebpf-beats-sdk-instrumentation--and-its-limits"

  - id: apm-ebpf-and-continuous-profiling-026
    difficulty: intermediate
    tags: [ebpf, requirements, platform]
    question: |
      Which is a real operational constraint of eBPF-based observability?
    options:
      - "It runs identically on Windows, macOS, and Linux with no changes"
      - "It needs the application recompiled with a special flag"
      - "It requires a modern Linux kernel and elevated privileges (CAP_BPF/root), and managed environments may restrict it"
      - "It only works when the app is idle"
    answer: 2
    explanation: |
      eBPF is largely Linux-only, needs a sufficiently recent kernel, and requires elevated
      capabilities (CAP_BPF/root). Some managed/hosted platforms restrict loading eBPF
      programs.
    ref: "concepts.md#when-ebpf-beats-sdk-instrumentation--and-its-limits"

  - id: apm-ebpf-and-continuous-profiling-027
    difficulty: advanced
    tags: [ebpf, sdk, decision]
    question: |
      A platform team must get baseline coverage for hundreds of services they don't own
      the source of, across many languages, plus TCP/DNS network signals — without asking
      each team to change code. Which is the most appropriate primary tool?
    options:
      - "Ask every team to add manual spans by next sprint"
      - "Only host-level CPU/memory metrics"
      - "Disable observability until every service is rewritten"
      - "An eBPF node-level agent for zero-touch, language-agnostic baseline + network signals"
    answer: 3
    explanation: |
      eBPF shines exactly here: zero code changes, language-agnostic, fleet-wide from one
      DaemonSet, plus kernel/network signals an in-process SDK can't see. You can layer SDK
      instrumentation later for deep app context.
    ref: "concepts.md#when-ebpf-beats-sdk-instrumentation--and-its-limits"

  - id: apm-ebpf-and-continuous-profiling-028
    difficulty: advanced
    tags: [ebpf, http2, limits]
    question: |
      Reconstructing HTTP/2 or gRPC semantics purely from raw socket buffers in eBPF is
      difficult mainly because:
    options:
      - "HTTP/2 is not used in production"
      - "Multiplexed/stateful framing is complex to parse within the verifier's size and complexity limits"
      - "eBPF cannot read any bytes from sockets"
      - "gRPC runs only over UDP"
    answer: 1
    explanation: |
      HTTP/2 multiplexing and stateful protocol framing are hard to reconstruct from raw
      socket buffers, and the parsing logic can bump into the verifier's program
      size/complexity ceilings.
    ref: "concepts.md#when-ebpf-beats-sdk-instrumentation--and-its-limits"

  - id: apm-ebpf-and-continuous-profiling-029
    difficulty: advanced
    tags: [ebpf, sdk, layering]
    question: |
      What is the pragmatic senior takeaway on eBPF vs SDK instrumentation?
    options:
      - "eBPF fully replaces all SDK instrumentation"
      - "SDKs fully replace all eBPF use"
      - "They layer: eBPF for broad zero-touch/network/profiling coverage, SDK/OTel for deep app context and reliable distributed tracing"
      - "You should pick exactly one and never use the other"
    answer: 2
    explanation: |
      Neither is strictly better. eBPF gives broad, zero-touch, language-agnostic
      coverage plus network/profiling signals; SDK/OTel gives deep app context and reliable
      cross-service trace-context propagation. Mature setups combine them.
    ref: "concepts.md#when-ebpf-beats-sdk-instrumentation--and-its-limits"

  - id: apm-ebpf-and-continuous-profiling-030
    difficulty: beginner
    tags: [profiling, fourth-pillar, definition]
    question: |
      What question does continuous profiling answer that metrics, logs, and traces
      struggle with?
    options:
      - "Which functions/lines of code are consuming CPU or memory right now, and how much?"
      - "How many requests per second is the service handling?"
      - "What is the aggregate 5xx error rate?"
      - "Which host has the most disk space free?"
    answer: 0
    explanation: |
      Profiling attributes resource use to specific functions/lines. A trace says span B
      took 200 ms; a profile says that time was spent 60% in JSON serialization — the
      code-granularity "why is resource use high" answer.
    ref: "concepts.md#continuous-profiling-and-the-fourth-pillar"

  - id: apm-ebpf-and-continuous-profiling-031
    difficulty: beginner
    tags: [profiling, fourth-pillar]
    question: |
      Continuous profiling is often called the "fourth pillar" of observability alongside:
    options:
      - "Alerts, dashboards, and runbooks"
      - "CPU, memory, and disk"
      - "Ingest, storage, and query"
      - "Metrics, logs, and traces"
    answer: 3
    explanation: |
      Metrics, logs, and traces are the three classic pillars; continuous profiling is
      increasingly called the fourth because it's a distinct always-on signal about
      resource consumption at code granularity.
    ref: "concepts.md#continuous-profiling-and-the-fourth-pillar"

  - id: apm-ebpf-and-continuous-profiling-032
    difficulty: intermediate
    tags: [profiling, trace-vs-profile]
    question: |
      A trace shows service B's span took 200 ms. What does a profile add on top of that?
    options:
      - "The number of times the endpoint was called that day"
      - "A breakdown of where that on-CPU time went by function (e.g. 60% serialization, 30% regex)"
      - "The customer's IP address"
      - "The Kubernetes node name"
    answer: 1
    explanation: |
      Traces localize latency to a span/service; profiles localize resource use to
      functions/lines within it, showing which code paths consumed the CPU during that
      work.
    ref: "concepts.md#continuous-profiling-and-the-fourth-pillar"

  - id: apm-ebpf-and-continuous-profiling-033
    difficulty: intermediate
    tags: [profiling, continuous, always-on]
    question: |
      What distinguishes "continuous" profiling from traditional on-demand profiling?
    options:
      - "It only runs in a debugger on a developer laptop"
      - "It requires stopping the application first"
      - "It runs always-on in production at low overhead, storing profiles over time so you can query the past and diff releases"
      - "It samples once at startup and never again"
    answer: 2
    explanation: |
      Continuous profiling keeps a low-overhead sampling profiler running in production and
      stores profiles over time, so you can ask "what was hot last Tuesday" and diff
      releases — unlike manual profiling you'd only run during an active incident.
    ref: "concepts.md#continuous-profiling-and-the-fourth-pillar"

  - id: apm-ebpf-and-continuous-profiling-034
    difficulty: intermediate
    tags: [profiling, finops, cost]
    question: |
      Continuous profiling is frequently justified as a FinOps/cost tool because:
    options:
      - "It finds the hottest code across the whole fleet so you can optimize CPU/memory and cut cloud spend"
      - "It automatically buys cheaper cloud instances"
      - "It deletes unused log data"
      - "It negotiates vendor contracts"
    answer: 0
    explanation: |
      By attributing CPU/memory to specific functions fleet-wide and continuously,
      profiling directly targets efficiency — you optimize the hottest code to reduce
      compute cost.
    ref: "concepts.md#continuous-profiling-and-the-fourth-pillar"

  - id: apm-ebpf-and-continuous-profiling-035
    difficulty: intermediate
    tags: [profiling, sampling, overhead]
    question: |
      Why are continuous profilers almost always statistical sampling profilers rather than
      fully instrumenting profilers?
    options:
      - "Sampling is the only way to get any stack traces"
      - "Instrumenting profilers are illegal"
      - "Sampling produces exact per-call timing for every function"
      - "Sampling keeps overhead low enough (a few percent or less) to leave running in production"
    answer: 3
    explanation: |
      Sampling (grabbing stacks on a timer, commonly ~100 Hz) approximates on-CPU time at
      only a few percent overhead, which is what makes always-on production profiling
      feasible. Full instrumentation would be far too costly.
    ref: "concepts.md#how-continuous-profiling-works-sampling-pprof-flame-graphs"

  - id: apm-ebpf-and-continuous-profiling-036
    difficulty: intermediate
    tags: [profiling, sampling, frequency]
    question: |
      A CPU sampling profiler runs at ~100 Hz. What does that mean and what is a
      consequence?
    options:
      - "It records every single function call with exact timing"
      - "It captures 100 stacks per second; a function running only 1 ms may never be sampled, so profiles are accurate for aggregate hot paths, not rare short calls"
      - "It samples once every 100 seconds"
      - "It guarantees catching any function no matter how briefly it runs"
    answer: 1
    explanation: |
      100 Hz means ~100 stack captures per second. It's statistical: a rare, sub-millisecond
      call may never land in a sample. Profiles are accurate for aggregate hot paths over
      time, which is the trade-off that keeps overhead tiny.
    ref: "concepts.md#how-continuous-profiling-works-sampling-pprof-flame-graphs"

  - id: apm-ebpf-and-continuous-profiling-037
    difficulty: intermediate
    tags: [profiling, pprof, format]
    question: |
      What is `pprof` (profile.proto) in the profiling ecosystem?
    options:
      - "Google's de-facto interchange format for profiles — stack samples with values plus symbol/location tables"
      - "A Prometheus exposition format for metrics"
      - "A log shipping protocol"
      - "A tracing wire format like OTLP"
    answer: 0
    explanation: |
      pprof's profile.proto is the de-facto profile interchange format. A profile is a set
      of stack samples each with a value (CPU ns, bytes) plus location/symbol tables. Go
      pprof, Parca, and Pyroscope all speak it.
    ref: "concepts.md#how-continuous-profiling-works-sampling-pprof-flame-graphs"

  - id: apm-ebpf-and-continuous-profiling-038
    difficulty: beginner
    tags: [profiling, flame-graph]
    question: |
      In a flame graph, what does the width of a frame (box) represent?
    options:
      - "The alphabetical order of the function name"
      - "The file size of the source code"
      - "The amount of time/resource spent in that frame and its children"
      - "The number of developers who wrote the function"
    answer: 2
    explanation: |
      Each box is a stack frame and its width is proportional to the time/resource spent in
      that frame (including its children), stacked by call depth — so wider means hotter.
    ref: "concepts.md#how-continuous-profiling-works-sampling-pprof-flame-graphs"

  - id: apm-ebpf-and-continuous-profiling-039
    difficulty: intermediate
    tags: [profiling, diff, regressions]
    question: |
      After a deploy, CPU usage rises 15%. Which continuous-profiling feature most directly
      attributes that regression to specific code?
    options:
      - "A single point-in-time flame graph from before the deploy"
      - "The service's request-rate metric"
      - "The container restart count"
      - "A differential (diff) flame graph comparing before vs after profiles"
    answer: 3
    explanation: |
      A differential flame graph colors frames by whether they grew or shrank between two
      profiles, pinpointing exactly which functions got hotter after the release — the
      standard regression workflow.
    ref: "concepts.md#how-continuous-profiling-works-sampling-pprof-flame-graphs"

  - id: apm-ebpf-and-continuous-profiling-040
    difficulty: advanced
    tags: [profiling, unwinding, frame-pointers]
    question: |
      Why do some eBPF profilers ship a DWARF-based stack unwinder instead of relying only
      on frame pointers?
    options:
      - "DWARF unwinding is always faster than frame pointers"
      - "Many binaries are compiled with frame pointers omitted, so frame-pointer walking fails; DWARF/debug-info unwinding works without them (at higher cost)"
      - "Frame pointers only exist on Windows"
      - "DWARF disables the verifier"
    answer: 1
    explanation: |
      Frame-pointer stack walking is fast but many binaries omit frame pointers for a small
      perf gain, breaking the walk. DWARF/debug-info unwinding reconstructs stacks without
      frame pointers, though it's heavier — so profilers bundle an unwinder to cope.
    ref: "concepts.md#how-continuous-profiling-works-sampling-pprof-flame-graphs"

  - id: apm-ebpf-and-continuous-profiling-041
    difficulty: intermediate
    tags: [profiling, types]
    question: |
      Which of these is a profile type continuous profilers commonly capture?
    options:
      - "traceparent headers"
      - "Log severity levels"
      - "Heap/allocation (memory) profiles"
      - "DNS TXT records"
    answer: 2
    explanation: |
      Beyond CPU (on-CPU time), profilers capture heap/allocation (memory) profiles,
      off-CPU (blocked/waiting) time, and lock/mutex or goroutine profiles depending on the
      runtime.
    ref: "concepts.md#how-continuous-profiling-works-sampling-pprof-flame-graphs"

  - id: apm-ebpf-and-continuous-profiling-042
    difficulty: intermediate
    tags: [profiling, tools, parca]
    question: |
      Parca (CNCF) is best described as:
    options:
      - "An eBPF whole-system continuous profiler: a node-level agent plus a server that stores pprof over time with Prometheus-style labels and diff flame graphs"
      - "A log aggregation system like Loki"
      - "A Prometheus alerting component"
      - "A service mesh control plane"
    answer: 0
    explanation: |
      Parca uses an eBPF DaemonSet agent to profile every process on a node zero-code and
      language-agnostic, storing pprof over time with Prometheus-style label selectors and
      producing diff flame graphs.
    ref: "concepts.md#continuous-profiling-tools--ebpf-based-whole-system-profiling"

  - id: apm-ebpf-and-continuous-profiling-043
    difficulty: intermediate
    tags: [profiling, ebpf, whole-system]
    question: |
      How does eBPF-based whole-system profiling capture stacks at ~100 Hz across every
      process on a node?
    options:
      - "It asks each application to call a logging function"
      - "It reads the application's source files from disk"
      - "It parses container logs for stack traces"
      - "An eBPF program attached to a perf event walks the current stack in the kernel and records it in a stack-trace map"
    answer: 3
    explanation: |
      A DaemonSet attaches an eBPF program to a perf event (the ~100 Hz timer). On each
      sample the program walks the stack in the kernel (frame pointers or bundled DWARF
      unwinder) and stores it in a stack-trace map — covering every process, any language,
      no code changes.
    ref: "concepts.md#continuous-profiling-tools--ebpf-based-whole-system-profiling"

  - id: apm-ebpf-and-continuous-profiling-044
    difficulty: advanced
    tags: [profiling, symbolization, jit]
    question: |
      Why do eBPF profilers need extra symbol maps to produce meaningful frames for
      interpreted/JIT languages like the JVM, Python, or Node?
    options:
      - "Those languages don't use CPUs"
      - "Their code runs as dynamically generated/interpreted frames, so raw addresses must be mapped to language-level function names using extra symbol info"
      - "eBPF cannot sample those processes at all"
      - "Those languages forbid profiling entirely"
    answer: 1
    explanation: |
      Symbolization turns addresses into function names using debug info. For
      JIT/interpreted runtimes, frames are generated dynamically, so profilers need extra
      symbol maps (e.g. from the runtime) to resolve meaningful function names.
    ref: "concepts.md#continuous-profiling-tools--ebpf-based-whole-system-profiling"

  - id: apm-ebpf-and-continuous-profiling-045
    difficulty: advanced
    tags: [profiling, ebpf-vs-runtime, tradeoff]
    question: |
      Compared to language runtime profilers (Go pprof, JFR, async-profiler), what is the
      main trade-off of eBPF whole-system profilers?
    options:
      - "eBPF profilers can't produce flame graphs"
      - "Runtime profilers work with no code changes at all"
      - "eBPF gives zero-touch, whole-fleet, cross-language coverage including native code; runtime profilers give richer language-specific detail but must be built into each app"
      - "There is no difference between them"
    answer: 2
    explanation: |
      eBPF profilers are zero-instrumentation, fleet-wide, and cover native/runtime frames
      across languages; language runtime profilers give more accurate language-specific
      detail (JIT frames, allocation sites) but require being built into each app.
    ref: "concepts.md#continuous-profiling-tools--ebpf-based-whole-system-profiling"

  - id: apm-ebpf-and-continuous-profiling-046
    difficulty: intermediate
    tags: [profiling, go, pprof]
    question: |
      Go's built-in `net/http/pprof` is an example of which profiling approach?
    options:
      - "An in-process, per-language runtime profiler exposing pprof-format CPU/heap/goroutine profiles"
      - "An eBPF whole-system profiler"
      - "A network packet capture tool"
      - "A log parser"
    answer: 0
    explanation: |
      net/http/pprof is built into the Go runtime and exposes CPU, heap, and goroutine
      profiles in pprof format via an HTTP endpoint — an in-process, language-specific
      profiler (as opposed to an eBPF node agent).
    ref: "concepts.md#continuous-profiling-tools--ebpf-based-whole-system-profiling"

  - id: apm-ebpf-and-continuous-profiling-047
    difficulty: intermediate
    tags: [profiling, pyroscope, correlation]
    question: |
      A notable capability of Grafana Pyroscope beyond basic profiling is:
    options:
      - "Replacing Prometheus for metrics storage"
      - "Running the eBPF verifier in user space"
      - "Auto-generating SLOs from logs"
      - "Correlating traces with profiles (e.g. span profiles) and offering both SDK (push) and eBPF ingestion"
    answer: 3
    explanation: |
      Pyroscope (now part of the Grafana stack) supports both SDK push and eBPF ingestion
      and can correlate traces with profiles ("span profiles"), tying a slow span to the
      code that was hot during it.
    ref: "concepts.md#continuous-profiling-tools--ebpf-based-whole-system-profiling"

  - id: apm-ebpf-and-continuous-profiling-048
    difficulty: beginner
    tags: [profiling, perf, history]
    question: |
      Which classic Linux tool is the built-in sampling profiler and ancestor of flame
      graphs, but is not "continuous" on its own?
    options:
      - "grep"
      - "perf"
      - "iptables"
      - "cron"
    answer: 1
    explanation: |
      Linux `perf` is the classic built-in sampling profiler and the basis of Brendan
      Gregg's flame graphs. It's typically run on-demand rather than always-on, so it isn't
      "continuous" by itself.
    ref: "concepts.md#continuous-profiling-tools--ebpf-based-whole-system-profiling"
