topic: "On-Call, Alert Fatigue & Actionable Signals"
domain: observability
topic_slug: on-call-alert-fatigue-and-actionable-signals
version: 1
questions:
  - id: on-call-alert-fatigue-and-actionable-signals-001
    difficulty: beginner
    tags: [actionable, page-criteria]
    question: |
      According to the SRE guidance, which three properties should ALL be true before a
      condition is allowed to page a human?
    options:
      - "Cheap to detect, easy to graph, and low-cardinality"
      - "Urgent, actionable, and requiring a human"
      - "Rare, expensive, and customer-reported"
      - "Automatable, repeatable, and well-documented"
    answer: 1
    explanation: |
      A page is software waking a human, so it must be worth the interruption: the situation
      needs a response now (urgent), the responder can actually change the outcome
      (actionable), and the fix cannot simply be automated (requires a human). Fail any one
      and it should be a ticket, dashboard, or deleted.
    ref: "concepts.md#what-makes-an-alert-actionable"

  - id: on-call-alert-fatigue-and-actionable-signals-002
    difficulty: beginner
    tags: [actionable, ticket-vs-page]
    question: |
      An alert condition needs a human to eventually do something, but it can safely wait
      until business hours. What is the appropriate response channel?
    options:
      - "A page to the on-call immediately"
      - "Escalate straight to a manager"
      - "Nothing — ignore it and let it self-resolve"
      - "A ticket queued for business hours"
    answer: 3
    explanation: |
      If it is actionable but not urgent, it is a ticket, not a page. Paging on
      non-urgent conditions is a primary cause of alert fatigue. Tickets preserve the action
      without stealing sleep.
    ref: "concepts.md#what-makes-an-alert-actionable"

  - id: on-call-alert-fatigue-and-actionable-signals-003
    difficulty: intermediate
    tags: [actionable, automation, human-required]
    question: |
      The runbook for a frequent page says only: "restart the pod; it always fixes it." What
      does the actionability framework say you should do?
    options:
      - "Keep paging — a documented fix means it is a good alert"
      - "Raise its severity so it gets a faster response and shorter escalation timeout"
      - "Add more on-call engineers to the rotation so the load per person drops"
      - "Automate the restart (self-healing) and stop paging a human for it"
    answer: 3
    explanation: |
      If the response is always the same mechanical action, it fails the human-required test.
      The system should perform the restart automatically (liveness probe, controller), and a
      human should only be paged if the automation itself fails.
    ref: "concepts.md#what-makes-an-alert-actionable"

  - id: on-call-alert-fatigue-and-actionable-signals-004
    difficulty: intermediate
    tags: [actionable, litmus-test]
    question: |
      A good litmus test for whether an alert should exist is: "When this fires, what is the
      first thing the on-call will do?" Which honest answer indicates the alert is NOISE?
    options:
      - "Acknowledge, then follow three runbook mitigation steps"
      - "Roll back the latest deploy that correlates with the alert's onset"
      - "Look at it, confirm nothing is wrong, and close it"
      - "Fail traffic over to the secondary region to shed the load"
    answer: 2
    explanation: |
      If the honest first action is "look, confirm it's fine, close it," the alert drives no
      action and is noise — it should be deleted or downgraded. The other answers describe
      real mitigations, i.e. an actionable page.
    ref: "concepts.md#what-makes-an-alert-actionable"

  - id: on-call-alert-fatigue-and-actionable-signals-005
    difficulty: beginner
    tags: [symptom-vs-cause, golden-signals]
    question: |
      The SRE rule of thumb for what to PAGE on is best summarized as:
    options:
      - "Alert on symptoms, diagnose with causes"
      - "Alert on causes, diagnose with symptoms"
      - "Alert on everything and filter later"
      - "Alert only on host-level resource metrics"
    answer: 0
    explanation: |
      Page on symptoms — what the user actually experiences (errors, latency) — because they
      are few, catch unknown failure modes, and reflect real impact. Use causes (CPU, disk,
      restarts) as diagnostic signals you consult after being paged.
    ref: "concepts.md#symptom-based-versus-cause-based-alerting"

  - id: on-call-alert-fatigue-and-actionable-signals-006
    difficulty: beginner
    tags: [symptom-vs-cause]
    question: |
      Which of the following is a SYMPTOM-based alert (as opposed to cause-based)?
    options:
      - "CPU utilization above 90% on the worker nodes"
      - "Checkout endpoint 5xx error rate above 5%"
      - "Disk usage above 80% on the data volume"
      - "JVM garbage-collection pause count increased sharply"
    answer: 1
    explanation: |
      Error rate on a user-facing endpoint is what the customer experiences — a symptom.
      CPU, disk usage, and GC pauses are internal conditions (causes) that may or may not
      translate into user impact.
    ref: "concepts.md#symptom-based-versus-cause-based-alerting"

  - id: on-call-alert-fatigue-and-actionable-signals-007
    difficulty: intermediate
    tags: [symptom-vs-cause, robustness]
    question: |
      Why is a single well-chosen symptom-based alert (e.g., on error rate) often more robust
      than many cause-based alerts?
    options:
      - "Symptom alerts are cheaper to evaluate in the query engine because they scan fewer time series"
      - "There are few user-visible symptoms but infinite ways to break, so one symptom alert catches many unknown failure modes at once"
      - "Symptom alerts never produce false positives once the threshold is tuned correctly"
      - "Cause alerts cannot be graphed on dashboards or exported to long-term storage"
    answer: 1
    explanation: |
      A service can break in countless internal ways but presents only a few user-facing
      symptoms. One error-rate alert catches a bad deploy, a dependency outage, a memory leak,
      and a config typo — including novel failures you never predicted — where you'd need
      dozens of cause alerts and still miss the unforeseen ones.
    ref: "concepts.md#symptom-based-versus-cause-based-alerting"

  - id: on-call-alert-fatigue-and-actionable-signals-008
    difficulty: intermediate
    tags: [symptom-vs-cause, exceptions]
    question: |
      "Alert on symptoms" has a well-known legitimate exception for paging on a cause. Which
      case is the canonical example?
    options:
      - "CPU above 90% for one minute on a single instance"
      - "A single pod restarted once and rejoined the fleet"
      - "Memory usage crossed the 50% mark on one node"
      - "'Disk will be full in 4 hours' (predictive, with actionable lead time)"
    answer: 3
    explanation: |
      You may page on a cause when it is a reliable leading indicator of imminent user impact
      with enough lead time to act. Predictive "disk full in 4 hours" qualifies: by the time
      the disk is actually full, the symptom is already customer-facing and may be too late.
    ref: "concepts.md#symptom-based-versus-cause-based-alerting"

  - id: on-call-alert-fatigue-and-actionable-signals-009
    difficulty: intermediate
    tags: [symptom-vs-cause, methods]
    question: |
      Which statement about the RED and USE methods, in the symptom/cause framing, is correct?
    options:
      - "RED (Rate, Errors, Duration) is mostly symptom-oriented; USE (Utilization, Saturation, Errors) leans toward resource/cause diagnosis"
      - "Both RED and USE are purely cause-based resource-diagnosis frameworks"
      - "USE is entirely symptom-based while RED is entirely cause-based"
      - "Neither RED nor USE has any relationship to the symptom/cause distinction"
    answer: 0
    explanation: |
      RED focuses on request-level Rate, Errors, and Duration — user-facing symptoms. USE
      focuses on resource Utilization, Saturation, and Errors — internal state used for
      diagnosis. So RED signals make good pages; USE signals are mostly diagnostic.
    ref: "concepts.md#symptom-based-versus-cause-based-alerting"

  - id: on-call-alert-fatigue-and-actionable-signals-010
    difficulty: beginner
    tags: [alert-fatigue, definition]
    question: |
      What is "alert fatigue"?
    options:
      - "The latency added to every request by heavyweight instrumentation and tracing overhead"
      - "The CPU and memory cost of evaluating many alerting rules on the metrics backend"
      - "The desensitization of responders exposed to frequent low-value alerts, risking that real alerts are missed"
      - "The end-to-end time it takes an alert to travel from Prometheus through Alertmanager to the pager"
    answer: 2
    explanation: |
      Alert fatigue is responder desensitization from too many low-value alerts. Its worst
      outcome is a genuine, actionable alert being ignored or slow-acknowledged because it
      arrived amid noise — a direct reliability risk, not just a morale issue.
    ref: "concepts.md#alert-fatigue-causes-and-cost"

  - id: on-call-alert-fatigue-and-actionable-signals-011
    difficulty: beginner
    tags: [alert-fatigue, cost]
    question: |
      Which is the MOST serious direct consequence of alert fatigue from a reliability
      standpoint?
    options:
      - "Slightly higher storage costs for retaining a longer alert history"
      - "A real, actionable incident being missed or slowly acknowledged because it is buried in noise"
      - "Dashboards loading more slowly under the extra query load"
      - "More disk consumed by the alerting database's notification records"
    answer: 1
    explanation: |
      The terminal failure mode of alert fatigue is the one alert that mattered being ignored
      amid the flood — increasing MTTR and impact. Burnout and attrition are also serious, but
      the missed real incident is the direct reliability hit.
    ref: "concepts.md#alert-fatigue-causes-and-cost"

  - id: on-call-alert-fatigue-and-actionable-signals-012
    difficulty: intermediate
    tags: [alert-fatigue, health-metric]
    question: |
      Most pages on your rotation resolve as "acknowledged, no action needed." What does this
      indicate and what is the fix?
    options:
      - "A reliability problem — add more on-call engineers to absorb the page volume"
      - "An alerting-quality problem — tune/delete the non-actionable alerts, don't add more"
      - "A staffing problem — hire more SREs to keep the rotation from burning out"
      - "A dashboard problem — invest in bigger monitors and richer visualizations"
    answer: 1
    explanation: |
      A low "fraction of pages that led to real action" is the signature of an alerting
      problem, not a reliability or staffing one. The fix is to tune, aggregate, route, or
      delete the non-actionable alerts so the remaining set is trustworthy.
    ref: "concepts.md#alert-fatigue-causes-and-cost"

  - id: on-call-alert-fatigue-and-actionable-signals-013
    difficulty: intermediate
    tags: [alert-fatigue, causes]
    question: |
      Which of these is NOT a typical cause of alert fatigue?
    options:
      - "Static thresholds that don't fit real traffic patterns"
      - "Flapping/transient conditions that self-heal but still page"
      - "No deduplication, so one bad deploy fires hundreds of per-instance alerts"
      - "SLO burn-rate paging tied to user-facing error budgets"
    answer: 3
    explanation: |
      SLO burn-rate paging is the structural fix for fatigue, not a cause — it alerts on
      user-facing budget consumption and self-scales to load. Static thresholds, flapping, and
      missing deduplication are all classic fatigue generators.
    ref: "concepts.md#alert-fatigue-causes-and-cost"

  - id: on-call-alert-fatigue-and-actionable-signals-014
    difficulty: beginner
    tags: [routing, page-ticket-log]
    question: |
      A condition is useful only for later diagnosis and never needs to proactively notify
      anyone. Where should it go?
    options:
      - "The pager, so someone sees it right away"
      - "A ticket queue for follow-up during business hours"
      - "A log/dashboard (recorded, no notification)"
      - "An email blast to all engineers on the team"
    answer: 2
    explanation: |
      Diagnostic signals that no one acts on proactively belong on a dashboard or in logs —
      invaluable after you're paged, worthless as a page. Sending them to the pager or ticket
      queue manufactures noise.
    ref: "concepts.md#page-ticket-or-log-only-choosing-the-response"

  - id: on-call-alert-fatigue-and-actionable-signals-015
    difficulty: intermediate
    tags: [routing, severity, anti-pattern]
    question: |
      A frequent anti-pattern is wiring "warning"-severity conditions directly to the pager.
      Why is this a problem?
    options:
      - "Warning-severity rules cost more to evaluate in the query engine than critical ones"
      - "Alertmanager cannot route warning-severity alerts through its routing tree at all"
      - "Warnings are always false positives and never reflect a genuine condition"
      - "It reliably manufactures fatigue by paging on conditions that usually need no immediate action"
    answer: 3
    explanation: |
      Warning-severity conditions are typically "act during business hours" or "watch"
      conditions. Routing them to the pager "just in case" is a top source of alert fatigue;
      warnings should ticket or notify low-priority, not wake people.
    ref: "concepts.md#page-ticket-or-log-only-choosing-the-response"

  - id: on-call-alert-fatigue-and-actionable-signals-016
    difficulty: intermediate
    tags: [routing, decision]
    question: |
      A "warning" alert has been firing continuously for three weeks and no one has ever taken
      action on it. What does this prove and what should you do?
    options:
      - "It proves the alert is critical — promote it to a page"
      - "It proves the threshold is too high — lower it so it fires earlier"
      - "It proves the condition needs no immediate action — convert it to a ticket or delete it"
      - "It proves nothing — leave it firing as is and move on"
    answer: 2
    explanation: |
      An alert that fires for weeks with no action is proof it is not urgent; the test is not
      "could this ever matter?" but "does someone act now when it fires?" It should be a ticket
      or deleted, not left to erode trust in the pager.
    ref: "concepts.md#page-ticket-or-log-only-choosing-the-response"

  - id: on-call-alert-fatigue-and-actionable-signals-017
    difficulty: beginner
    tags: [runbook, page-requirement]
    question: |
      What is the standing rule connecting pages and runbooks?
    options:
      - "Runbooks are optional if the alert has a good name"
      - "Runbooks are only needed for warning-level alerts"
      - "One runbook per team is sufficient regardless of alerts"
      - "No page without a runbook"
    answer: 3
    explanation: |
      Every page must have a runbook. If you can't write down what the on-call should do, you
      either don't understand the failure well enough to page on it, or it isn't actionable.
      Linked runbooks measurably cut MTTR, especially for rarely-seen pages.
    ref: "concepts.md#every-page-must-have-a-runbook"

  - id: on-call-alert-fatigue-and-actionable-signals-018
    difficulty: intermediate
    tags: [runbook, prometheus, annotations]
    question: |
      In a Prometheus alerting rule, what is the conventional way to attach the link to an
      alert's runbook?
    options:
      - "A `runbook_url` entry under `annotations`"
      - "A `severity` label attached to the alerting rule"
      - "The `for:` duration field on the alerting rule"
      - "A `group_by` clause in the rule's grouping config"
    answer: 0
    explanation: |
      Runbook links are carried as an annotation (commonly `runbook_url`) alongside `summary`
      and `description`, so the pager notification can deep-link the responder straight to the
      procedure. `severity` is a label for routing; `for:` is the debounce duration.
    ref: "concepts.md#every-page-must-have-a-runbook"

  - id: on-call-alert-fatigue-and-actionable-signals-019
    difficulty: intermediate
    tags: [runbook, mitigation]
    question: |
      A well-written runbook prioritizes which of the following FIRST?
    options:
      - "The fastest mitigation to stop the bleeding (roll back, fail over, scale up)"
      - "A detailed root-cause analysis pinpointing the underlying bug before acting"
      - "A blameless postmortem template ready to fill in once the incident closes"
      - "A full roster listing everyone who has ever been on-call for the service"
    answer: 0
    explanation: |
      During an active incident, stopping user impact comes first — the runbook should lead
      with the fastest mitigation (rollback, failover, scale up, drain). Root-causing is
      important but happens after the bleeding stops; postmortems come later still.
    ref: "concepts.md#every-page-must-have-a-runbook"

  - id: on-call-alert-fatigue-and-actionable-signals-020
    difficulty: advanced
    tags: [runbook, automation, toil]
    question: |
      A runbook consists entirely of fixed, mechanical steps with no judgment calls. What does
      this most strongly suggest?
    options:
      - "The runbook is excellent and should be adopted as the template for all alerts"
      - "The alert needs a higher severity and a shorter escalation timeout to match"
      - "The response should be automated so the alert stops paging a human at all"
      - "The runbook should be deleted while the page itself is kept firing as-is"
    answer: 2
    explanation: |
      A purely mechanical runbook is toil in disguise and fails the human-required test. The
      correct long-term fix is to encode those steps as automation (auto-remediation) so the
      human is only involved when automation can't handle the situation.
    ref: "concepts.md#every-page-must-have-a-runbook"

  - id: on-call-alert-fatigue-and-actionable-signals-021
    difficulty: beginner
    tags: [signal-to-noise, definition]
    question: |
      What does "signal-to-noise ratio" refer to in alerting?
    options:
      - "The ratio of raw metric samples ingested to log lines written over the same window"
      - "The proportion of alerts that represent a real, actionable problem versus false or non-actionable noise"
      - "The share of network bandwidth the alerting pipeline consumes relative to metric scraping"
      - "The number of dashboards divided by the number of configured alerting rules per service"
    answer: 1
    explanation: |
      SNR is the working measure of alert quality: how many alerts are genuinely actionable
      versus noise. Each noisy alert lowers the credibility of every other alert, which is why
      keeping SNR high is central to a trustworthy on-call.
    ref: "concepts.md#signal-to-noise-and-alert-tuning"

  - id: on-call-alert-fatigue-and-actionable-signals-022
    difficulty: intermediate
    tags: [signal-to-noise, tuning, priority]
    question: |
      When tuning a noisy alert that has never once driven a real action, which action gives
      the highest value?
    options:
      - "Delete it"
      - "Add more labels to it"
      - "Raise its severity"
      - "Copy it to a second team"
    answer: 0
    explanation: |
      Deleting a bad alert is strictly better than tuning it — it removes noise entirely with
      no ongoing maintenance. The tuning playbook is delete, then aggregate/dedupe, then
      route/downgrade, then debounce, then fix thresholds.
    ref: "concepts.md#signal-to-noise-and-alert-tuning"

  - id: on-call-alert-fatigue-and-actionable-signals-023
    difficulty: intermediate
    tags: [signal-to-noise, flapping, debounce]
    question: |
      An alert fires and self-resolves within seconds many times a day for transient blips
      that never affect users. Which tuning lever most directly addresses this?
    options:
      - "Add a `for:` duration so the condition must hold for a window before firing"
      - "Increase the pager escalation timeout so the secondary is notified later"
      - "Add more recipients to the alert so more engineers can share the load"
      - "Switch the underlying metric from a counter to a gauge to smooth the values"
    answer: 0
    explanation: |
      Transient flaps are killed by requiring the condition to persist for a duration (`for:`)
      before the alert fires, so momentary blips that self-heal never page. Escalation timeouts
      and extra recipients do nothing about the flapping itself.
    ref: "concepts.md#signal-to-noise-and-alert-tuning"

  - id: on-call-alert-fatigue-and-actionable-signals-024
    difficulty: intermediate
    tags: [signal-to-noise, aggregation, deploy]
    question: |
      A single bad deploy causes the same alert to fire once per instance across 200 pods,
      paging the on-call 200 times. Which tuning lever fixes this?
    options:
      - "Delete the alert entirely so the duplicate notifications stop arriving"
      - "Lower the alert threshold so the fleet-wide condition is caught even sooner"
      - "Aggregate/group and deduplicate so the fleet-wide event pages once, not 200 times"
      - "Increase the scrape interval to cut the per-instance sample count that drives the pages"
    answer: 2
    explanation: |
      This is a grouping/deduplication problem: many related alerts should collapse into one
      notification (e.g., Alertmanager `group_by`). Deleting the alert loses a real signal, and
      changing thresholds or scrape intervals doesn't address the duplication.
    ref: "concepts.md#signal-to-noise-and-alert-tuning"

  - id: on-call-alert-fatigue-and-actionable-signals-025
    difficulty: advanced
    tags: [signal-to-noise, inhibition]
    question: |
      When an entire cluster is down, you want to suppress the flood of individual per-service
      alerts and page only on the parent condition. Which Alertmanager mechanism does this?
    options:
      - "Silences that auto-mute children whenever a parent alert is active"
      - "Recording rules that roll the per-service alerts up into one series"
      - "Inhibition rules (`inhibit_rules`)"
      - "Remote write configured to drop downstream alerts during outages"
    answer: 2
    explanation: |
      Inhibition suppresses downstream alerts when a known parent/root alert is already firing
      — exactly the cluster-down case. Silences are manual, time-bounded mutes; recording rules
      precompute expressions; remote write ships samples to long-term storage.
    ref: "concepts.md#signal-to-noise-and-alert-tuning"

  - id: on-call-alert-fatigue-and-actionable-signals-026
    difficulty: intermediate
    tags: [signal-to-noise, incident-budget]
    question: |
      A common SRE rule of thumb caps how many significant incidents an on-call should handle
      per shift, so each can be properly root-caused. What is that guideline number?
    options:
      - "About 2 per shift"
      - "About 10 per shift"
      - "About 25 per shift"
      - "There is no upper bound"
    answer: 0
    explanation: |
      Google's SRE practice suggests roughly two significant incidents per on-call shift as a
      workable maximum — enough time to investigate each properly. Routinely exceeding it means
      the alert set is over budget and needs pruning, not the on-call working harder.
    ref: "concepts.md#signal-to-noise-and-alert-tuning"

  - id: on-call-alert-fatigue-and-actionable-signals-027
    difficulty: beginner
    tags: [3am-test, human-required]
    question: |
      The "3am test" for a candidate page asks you to:
    options:
      - "Verify the alerting rule can be fully evaluated by the query engine within 3 seconds"
      - "Confirm the alert is scheduled to fire only during the 3am-to-4am maintenance window"
      - "Imagine it wakes you from deep sleep at 3am and ask whether that interruption is justified"
      - "Check that at least three separate responders are configured to receive the notification"
    answer: 2
    explanation: |
      The 3am test is a blunt gut-check: if a half-awake responder would think "why did this
      wake me? there's nothing to do," the alert fails and must not be a page. It forces the
      urgent, actionable, and human-required questions.
    ref: "concepts.md#the-3am-test-and-human-required-alerts"

  - id: on-call-alert-fatigue-and-actionable-signals-028
    difficulty: intermediate
    tags: [3am-test, human-required, automation]
    question: |
      The "human-required" criterion is best captured by which of the following statements?
    options:
      - "A human must be physically present in the office to acknowledge and respond to it"
      - "Every alert must be reviewed and approved by a human before it is allowed to fire"
      - "Humans should be able to respond faster than any automated script possibly could"
      - "If the response is deterministic and mechanical, encode it as automation and only page when the automation fails"
    answer: 3
    explanation: |
      The human-required test asks whether the situation genuinely needs human judgment.
      Deterministic responses ("if X then restart Y") should become automation; humans are the
      last resort for novel situations requiring intelligence, not the first responder to toil.
    ref: "concepts.md#the-3am-test-and-human-required-alerts"

  - id: on-call-alert-fatigue-and-actionable-signals-029
    difficulty: intermediate
    tags: [3am-test, self-healing]
    question: |
      Following the human-required principle, which of these is the RIGHT place for a
      deterministic "restart on failure" response, so it never pages a human?
    options:
      - "A high-severity pager policy that wakes the on-call on every failure"
      - "A weekly email digest summarizing how often the restart was needed"
      - "A dashboard annotation marking each restart for later human review"
      - "Self-healing automation (liveness probe / controller / autoscaler)"
    answer: 3
    explanation: |
      Deterministic remediation belongs in self-healing automation — liveness probes,
      controllers, autoscalers, automated failover — so the human is only paged if the
      automation itself fails or hits a case it can't handle.
    ref: "concepts.md#the-3am-test-and-human-required-alerts"

  - id: on-call-alert-fatigue-and-actionable-signals-030
    difficulty: beginner
    tags: [slo, error-budget]
    question: |
      SLO-based alerting reduces noise primarily because it alerts on:
    options:
      - "Instantaneous CPU utilization spikes measured on each individual host in the fleet"
      - "The raw number of application log lines emitted per second across all services"
      - "The rate at which the error budget is being consumed (burn rate), which is symptom-based and self-scales to load"
      - "The count of currently active TCP connections held open on each load balancer"
    answer: 2
    explanation: |
      SLO alerting fires on error-budget burn rate. Because the SLI is a user-facing symptom
      and burn rate self-scales to traffic, blips within budget don't page and one budget policy
      replaces many ad-hoc thresholds — cutting noise structurally.
    ref: "concepts.md#slo-based-alerting-reduces-noise"

  - id: on-call-alert-fatigue-and-actionable-signals-031
    difficulty: intermediate
    tags: [slo, error-budget, calculation]
    question: |
      For a 99.9% availability SLO over 30 days (~43,200 minutes), approximately how much
      "all requests failing" time is the error budget?
    options:
      - "About 4.3 minutes"
      - "About 7.2 hours"
      - "About 30 minutes"
      - "About 43 minutes"
    answer: 3
    explanation: |
      99.9% availability allows 0.1% badness. 0.1% of 43,200 minutes is ~43.2 minutes of
      total unavailability over 30 days. (Three nines ≈ 43 min/month; four nines ≈ 4.3 min/month.)
    ref: "concepts.md#slo-based-alerting-reduces-noise"

  - id: on-call-alert-fatigue-and-actionable-signals-032
    difficulty: intermediate
    tags: [slo, burn-rate, load-scaling]
    question: |
      Why does SLO burn-rate alerting handle a "5% error rate" event better than a static
      "errors > 5%" threshold?
    options:
      - "Burn rate ignores the measured error rate entirely and looks only at raw request volume"
      - "Burn rate accounts for traffic: 5% errors at low traffic burns little budget (no page), while 5% at peak burns fast (page)"
      - "Burn rate always fires faster than any static threshold regardless of the traffic level"
      - "Static error-rate thresholds simply cannot be expressed as a PromQL query at all"
    answer: 1
    explanation: |
      A static 5% threshold pages the same regardless of whether it's a trickle at 3am or peak
      traffic. Burn rate is proportional to how fast budget is consumed, so it stays quiet for
      low-impact blips and pages for high-impact ones — automatic load awareness.
    ref: "concepts.md#slo-based-alerting-reduces-noise"

  - id: on-call-alert-fatigue-and-actionable-signals-033
    difficulty: advanced
    tags: [slo, burn-rate, meaning]
    question: |
      An SLO error budget is defined over 30 days. A sustained burn rate of 1x means:
    options:
      - "You are consuming budget exactly as fast as the SLO permits, exhausting it in ~30 days"
      - "You have already exhausted the entire 30-day budget and are now fully out of budget"
      - "You will burn through the remaining error budget in roughly the next 50 hours"
      - "The service is currently serving every request with zero errors at all"
    answer: 0
    explanation: |
      Burn rate = actual error ratio / SLO error ratio. A rate of 1 means you're spending
      budget exactly on pace to use it all over the full 30-day window. Higher rates exhaust it
      faster (e.g., 14.4x burns the whole budget in ~50 hours).
    ref: "concepts.md#slo-based-alerting-reduces-noise"

  - id: on-call-alert-fatigue-and-actionable-signals-034
    difficulty: intermediate
    tags: [multi-window, burn-rate]
    question: |
      What problem does multi-window, multi-burn-rate alerting solve compared to a single
      burn-rate threshold?
    options:
      - "It removes the need to define an SLO or error budget for the service entirely"
      - "It reduces the long-term storage cost of the metrics backing the burn-rate query"
      - "It balances a twitchy fast alert against a too-slow stable one, giving high precision (no spikes) with fast detection"
      - "It lets you alert on burn rate without ever configuring any error budget at all"
    answer: 2
    explanation: |
      A single threshold forces a trade-off: fast+low is noisy, slow+high is late. Multi-window
      multi-burn-rate uses several burn tiers, each gated by a short confirming window, achieving
      high recall on real outages, high precision against blips, and fast auto-resolution.
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: on-call-alert-fatigue-and-actionable-signals-035
    difficulty: advanced
    tags: [multi-window, short-window, precision]
    question: |
      In a multi-window burn-rate rule, the SHORT window (ANDed with the long window) mainly
      serves to:
    options:
      - "Increase the total error budget available over the SLO window"
      - "Slow detection down deliberately so the alert becomes more stable"
      - "Confirm the burn is still happening now, killing spikes and enabling fast auto-resolution"
      - "Remove the requirement to attach a runbook to the resulting page"
    answer: 2
    explanation: |
      The long window sets sensitivity (how much budget must burn); the short window confirms
      the burn is ongoing right now. A one-minute spike won't satisfy the short window, so it
      never pages, and when the incident ends the short window resets quickly (fast resolution).
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: on-call-alert-fatigue-and-actionable-signals-036
    difficulty: advanced
    tags: [multi-window, severity, routing]
    question: |
      In the canonical SRE Workbook burn-rate tiers, how are fast-burn versus slow-burn
      conditions typically routed?
    options:
      - "Fast burn → page (high severity); slow burn → ticket (lower severity)"
      - "Fast burn → ticket for business hours; slow burn → immediate high-severity page"
      - "Both fast and slow burn conditions always page the on-call immediately"
      - "Both fast and slow burn conditions are always logged only, never paged"
    answer: 0
    explanation: |
      A fast burn (e.g., 14.4x over 1h) signals a sharp outage and should page; a slow burn
      (e.g., 1x over 3 days) is a leak that would still exhaust the budget and is fine as a
      ticket. Faster burn → higher severity/urgency.
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: on-call-alert-fatigue-and-actionable-signals-037
    difficulty: beginner
    tags: [escalation, ack]
    question: |
      What is the purpose of an escalation policy in on-call tooling?
    options:
      - "To compress and batch alert payloads into a smaller wire format before the pager delivers them"
      - "To convert raw metric time series into structured log lines for cheaper archival"
      - "To randomly assign each incoming alert to whichever engineer happens to be idle at that moment"
      - "If the primary on-call doesn't acknowledge within N minutes, the alert escalates to a secondary, then wider — so it never silently disappears"
    answer: 3
    explanation: |
      Escalation policies are the safety net: an unacknowledged page moves to a secondary and
      then a manager/wider group after set timeouts, ensuring a missed primary doesn't mean a
      dropped incident.
    ref: "concepts.md#escalation-routing-and-grouping-basics"

  - id: on-call-alert-fatigue-and-actionable-signals-038
    difficulty: intermediate
    tags: [routing, alertmanager, labels]
    question: |
      In Alertmanager, alerts are directed to the correct team/receiver primarily based on:
    options:
      - "The alphabetical order of the alert name, which selects the receiver from a sorted list"
      - "The byte size of the alert payload, with larger alerts routed to higher-capacity receivers"
      - "Matching labels against a routing tree (`route`/`routes`)"
      - "The time of day the alert fires, mapped to whichever receiver owns that hourly slot"
    answer: 2
    explanation: |
      Alertmanager uses a routing tree that matches on labels (service, severity, environment)
      to decide which receiver handles an alert. Misrouting — paging teams for things they
      can't fix — is itself a source of fatigue.
    ref: "concepts.md#escalation-routing-and-grouping-basics"

  - id: on-call-alert-fatigue-and-actionable-signals-039
    difficulty: intermediate
    tags: [routing, grouping, maintenance]
    question: |
      During a planned maintenance window, you want to deliberately suppress alerts you know
      will fire, rather than letting responders ignore them ad hoc. Which mechanism is intended
      for this?
    options:
      - "Alertmanager silences (time-bounded, deliberate suppression)"
      - "Deleting the affected alerting rules for the duration and re-adding them once the work completes"
      - "Lowering every threshold to zero so the conditions can never evaluate as breaching during the window"
      - "Turning off Prometheus scraping for the targets so no fresh samples arrive to trigger the rules"
    answer: 0
    explanation: |
      Silences are time-bounded, deliberate mutes for known work — the correct tool for
      maintenance windows. Deleting rules or disabling scraping is heavy-handed and risks
      forgetting to restore them; lowering thresholds does the opposite of suppression.
    ref: "concepts.md#escalation-routing-and-grouping-basics"

  - id: on-call-alert-fatigue-and-actionable-signals-040
    difficulty: beginner
    tags: [toil, definition]
    question: |
      In SRE terms, "toil" is work that is:
    options:
      - "Creative, strategic, novel engineering that produces lasting value and improves the service permanently"
      - "Any work done outside normal business hours, regardless of whether it is automatable or repetitive"
      - "Manual, repetitive, automatable, tactical, and scales linearly with service growth"
      - "Only the work of writing postmortems and incident retrospectives after an outage has been resolved"
    answer: 2
    explanation: |
      Toil is manual, repetitive, automatable, tactical, devoid of enduring value, and grows
      with the service. Responding to non-actionable pages and running rote runbook scripts are
      classic toil that alerting can generate.
    ref: "concepts.md#toil-from-alerts"

  - id: on-call-alert-fatigue-and-actionable-signals-041
    difficulty: intermediate
    tags: [toil, target]
    question: |
      Google's SRE guidance caps the fraction of an SRE's time that should be spent on toil at
      roughly:
    options:
      - "Under 50%"
      - "Around 90%"
      - "Exactly 100%"
      - "There is no target"
    answer: 0
    explanation: |
      Google targets keeping toil under 50% of an SRE's time, freeing the rest for engineering
      that reduces future toil. Applied to alerting, that means auditing rote-response pages and
      automating or eliminating them.
    ref: "concepts.md#toil-from-alerts"

  - id: on-call-alert-fatigue-and-actionable-signals-042
    difficulty: intermediate
    tags: [toil, alerting-connection]
    question: |
      Why are toil reduction and alert-fatigue reduction described as "the same project viewed
      from two angles"?
    options:
      - "Both are solved primarily by purchasing more monitoring software and adding extra pager integrations"
      - "They are the same project because both deliberately increase the number of alerts a team receives"
      - "A page whose runbook is a fixed mechanical script is toil made schedulable at 3am; automating it removes both the toil and the page"
      - "Neither toil nor alert fatigue has any meaningful relationship to automation or self-healing systems"
    answer: 2
    explanation: |
      A mechanical, no-judgment runbook is toil that also wakes people. Converting it to
      automation eliminates the repetitive work AND the page, so cutting toil and cutting alert
      fatigue are the same effort from two viewpoints.
    ref: "concepts.md#toil-from-alerts"

  - id: on-call-alert-fatigue-and-actionable-signals-043
    difficulty: beginner
    tags: [alert-review, retro]
    question: |
      Why do mature teams run recurring alert reviews rather than treating alerts as
      "set and forget"?
    options:
      - "Because alerting rules are configured to expire automatically every week and must be recreated"
      - "Because services, traffic, and dependencies change, so alert sets decay — thresholds drift, new failure modes appear, old ones vanish"
      - "Because the monitoring vendor's support contract mandates a periodic manual review of all rules"
      - "Because recurring reviews measurably reduce the long-term storage cost of retained metric data"
    answer: 1
    explanation: |
      Alert sets decay as the system evolves: thresholds become irrelevant, new failure modes
      emerge, and old alerts become impossible. Recurring review (often in the on-call handoff)
      keeps the set trustworthy by deleting, tuning, aggregating, or rerouting alerts.
    ref: "concepts.md#alert-review-and-retrospectives"

  - id: on-call-alert-fatigue-and-actionable-signals-044
    difficulty: intermediate
    tags: [alert-review, actionability-metric]
    question: |
      Which metric is MOST directly useful for finding alerts that should be tuned or deleted
      during an alert review?
    options:
      - "The alert's raw fire frequency alone, ranked from most-fired to least-fired over the period"
      - "The alert's actionability rate — the fraction of firings that led to real action"
      - "The number of characters in the alert name, as a proxy for how well-specified the rule is"
      - "The color assigned to the alert on the dashboard, with red rules reviewed before amber ones"
    answer: 1
    explanation: |
      Fire frequency alone is misleading (a frequent, always-actionable alert may be fine).
      Actionability rate — how often a page led to a real fix — pinpoints chronically noisy
      alerts that should be tuned or deleted.
    ref: "concepts.md#alert-review-and-retrospectives"

  - id: on-call-alert-fatigue-and-actionable-signals-045
    difficulty: intermediate
    tags: [alert-review, handoff-ritual]
    question: |
      A simple, effective on-call ritual to apply steady downward pressure on alert noise is:
    options:
      - "Add a new alert after every shift regardless of need, to steadily broaden failure coverage"
      - "Silence every alert that fired more than once during the shift until the next handoff review"
      - "Any page that fired but resulted in no action gets a ticket to fix or delete it"
      - "Increase all thresholds by a flat 10% each week so fewer conditions cross into firing"
    answer: 2
    explanation: |
      Requiring that every non-actionable page generate a ticket to fix or delete it creates
      continuous pressure to prune noise, instead of letting it accumulate. Blindly adding,
      silencing, or bumping thresholds doesn't improve signal quality.
    ref: "concepts.md#alert-review-and-retrospectives"

  - id: on-call-alert-fatigue-and-actionable-signals-046
    difficulty: intermediate
    tags: [anti-patterns, static-threshold]
    question: |
      Which of the following is a well-known alerting ANTI-PATTERN?
    options:
      - "Linking every page to a runbook so responders always have documented mitigation steps"
      - "Alerting primarily on user-facing symptoms rather than on internal resource-level causes"
      - "Using a static 'errors > N' threshold that pages at low traffic and misses real problems at peak"
      - "Grouping duplicate alerts into one notification so a fleet-wide event pages the on-call once"
    answer: 2
    explanation: |
      Static thresholds that ignore load are a classic anti-pattern — they page on harmless
      low-traffic blips and can miss serious problems at peak. Runbook links, symptom-based
      paging, and grouping are all good practices.
    ref: "concepts.md#anti-patterns-and-gotchas"

  - id: on-call-alert-fatigue-and-actionable-signals-047
    difficulty: intermediate
    tags: [anti-patterns, silencing]
    question: |
      Permanently silencing a chronically noisy alert (instead of tuning or deleting it) is an
      anti-pattern because:
    options:
      - "A long-lived silence consumes too much CPU and memory in Alertmanager's evaluation loop"
      - "Alertmanager does not support silences that last longer than a single 24-hour period"
      - "It hides the alert rather than removing the noise, and the silence outlives the memory of why it was created"
      - "Silences automatically escalate the muted alert to a manager after they expire"
    answer: 2
    explanation: |
      A permanent silence masks the problem instead of fixing it; over time nobody remembers why
      it exists, and a genuinely important firing could be hidden. The right response is to
      delete or tune the underlying rule.
    ref: "concepts.md#anti-patterns-and-gotchas"

  - id: on-call-alert-fatigue-and-actionable-signals-048
    difficulty: beginner
    tags: [anti-patterns, dashboards]
    question: |
      You realize you need an alert "so we know when this happens," but there's nothing for a
      responder to do about it. What does the anti-pattern guidance recommend?
    options:
      - "Create a page anyway, to be safe, and let the on-call decide each time whether it matters"
      - "Escalate it directly to a manager so leadership stays aware of the condition as it happens"
      - "Build a dashboard for awareness — you need visibility, not a page"
      - "Send it to every team's pager so whichever group owns the root cause can pick it up"
    answer: 2
    explanation: |
      If you need visibility but there is no action to take, the answer is a dashboard (or log),
      not a page. Over-alerting to compensate for weak dashboards manufactures fatigue with no
      benefit.
    ref: "concepts.md#anti-patterns-and-gotchas"
