topic: "SLO-Based Alerting & Error Budgets"
domain: observability
topic_slug: slo-based-alerting-and-error-budgets
version: 1
questions:
  - id: slo-based-alerting-and-error-budgets-001
    difficulty: beginner
    tags: [sli, definitions]
    question: |
      What does an SLI (Service Level Indicator) fundamentally measure?
    options:
      - "A legally binding contract with a customer that includes financial penalties like service credits when breached"
      - "The maximum number of servers or CPU cores a service is permitted to run before autoscaling stops"
      - "A quantitative measurement of a service's behavior, ideally a ratio of good events to valid events"
      - "The internal target percentage that the team formally promises to management each quarter"
    answer: 2
    explanation: |
      An SLI is a measurement, best expressed as good events / valid events (a ratio in
      0-100%). The target for that measurement is the SLO; the penalty-bearing contract is
      the SLA.
    ref: "concepts.md#sli-vs-slo-vs-sla"

  - id: slo-based-alerting-and-error-budgets-002
    difficulty: beginner
    tags: [slo, sla, definitions]
    question: |
      Which statement correctly distinguishes an SLO from an SLA?
    options:
      - "An SLO is the legally binding contract with financial penalties; an SLA is the looser internal target the team tracks"
      - "An SLO is the internal target for an SLI; an SLA is an external contract that carries consequences (e.g. refunds) if missed"
      - "They are two interchangeable names for the exact same customer-facing reliability commitment"
      - "An SLA is always numerically stricter than the raw SLI measurement collected from production traffic"
    answer: 1
    explanation: |
      An SLO is the objective/target you engineer toward internally. An SLA is a contract
      with a customer that adds penalties (credits/refunds) when an objective is missed.
    ref: "concepts.md#sli-vs-slo-vs-sla"

  - id: slo-based-alerting-and-error-budgets-003
    difficulty: intermediate
    tags: [slo, sla, buffer]
    question: |
      Why do teams typically set their internal SLO stricter than the SLA they promise
      customers?
    options:
      - "To make the reliability dashboards look consistently greener to executives during quarterly business reviews"
      - "Because the SLA is measured in wall-clock minutes while the SLO must be expressed as a request-ratio percentage"
      - "Because Prometheus cannot evaluate the same recording rule against two different alert thresholds at once"
      - "To leave a safety buffer so they can detect and react to problems before they actually breach the customer contract"
    answer: 3
    explanation: |
      The gap between the tighter SLO and the looser SLA is a reaction buffer: internal
      alerts fire against the SLO, giving the team time to fix issues before the
      penalty-bearing SLA is violated.
    ref: "concepts.md#sli-vs-slo-vs-sla"

  - id: slo-based-alerting-and-error-budgets-004
    difficulty: beginner
    tags: [sli, ratio]
    question: |
      Why is a "good events / valid events" ratio a desirable form for an SLI?
    options:
      - "It lands naturally in the 0-100% range, aggregates cleanly, and lets you exclude events that shouldn't count via the 'valid' denominator"
      - "It always evaluates to exactly 100% because valid events are defined as the set of good events"
      - "It removes the need to collect any raw metrics since the ratio can be inferred from uptime logs"
      - "It mathematically guarantees the service will never emit a 5xx error under production load"
    answer: 0
    explanation: |
      The ratio form is bounded in [0,1], aggregates well across instances, and the
      "valid" denominator lets you exclude events that shouldn't be counted (e.g. load-test
      traffic or client-side 4xx).
    ref: "concepts.md#sli-vs-slo-vs-sla"

  - id: slo-based-alerting-and-error-budgets-005
    difficulty: intermediate
    tags: [sli, latency, averages]
    question: |
      Why is "average request latency < 200 ms" considered a poor latency SLI?
    options:
      - "Averages are impossible to compute in PromQL without a recording rule to pre-aggregate the sum and count"
      - "Latency should never appear in an SLI because only availability ratios belong in a service objective"
      - "200 ms is physically too fast a threshold for any real network round trip to ever achieve at scale"
      - "Averages hide the tail — a few very slow requests are invisible in the mean, so users can suffer while the SLI looks healthy"
    answer: 3
    explanation: |
      A mean is dominated by the bulk of fast requests and masks slow-tail outliers. A
      better latency SLI counts the fraction of requests faster than a threshold (e.g. 99%
      < 200 ms) or uses percentiles.
    ref: "concepts.md#choosing-good-slis-the-sli-equation"

  - id: slo-based-alerting-and-error-budgets-006
    difficulty: intermediate
    tags: [sli, latency, promql, histogram]
    question: |
      To build a latency SLI "fraction of requests served under 300 ms" from a Prometheus
      histogram, why can you divide the le="0.3" bucket rate by the total _count rate
      directly?
    options:
      - "Because each histogram bucket stores the individual per-request timestamps needed to recount them"
      - "Because you must first wrap the expression in histogram_quantile to normalize the bucket boundaries"
      - "Because the buckets are exponentially decaying and self-normalize to a fraction over the total"
      - "Because Prometheus histogram buckets are cumulative, so the le=\"0.3\" bucket already contains all requests <= 300 ms"
    answer: 3
    explanation: |
      Prometheus classic histogram buckets are cumulative: le="0.3" counts every
      observation <= 0.3s. Dividing that by the total count gives the fraction under the
      threshold with no histogram_quantile needed.
    ref: "concepts.md#choosing-good-slis-the-sli-equation"

  - id: slo-based-alerting-and-error-budgets-007
    difficulty: intermediate
    tags: [sli, valid-events]
    question: |
      A team's availability SLI counts 5xx responses as failures but excludes most 4xx from
      the denominator entirely. What is the rationale?
    options:
      - "4xx responses are impossible to log because the load balancer discards them before reaching the app"
      - "Client errors (4xx) usually reflect bad client requests, not service failure, so they often shouldn't count as 'valid' events attributable to the service"
      - "4xx responses are always served faster than 5xx, so including them would skew the latency SLI downward"
      - "Prometheus cannot distinguish 4xx from 5xx status codes without an expensive per-request relabeling rule"
    answer: 1
    explanation: |
      Defining "valid" carefully is central to a good SLI. A 400/404 is typically the
      client's fault and shouldn't penalize service availability, though edge cases (e.g. a
      429 you emit under load) may warrant inclusion — decide explicitly.
    ref: "concepts.md#choosing-good-slis-the-sli-equation"

  - id: slo-based-alerting-and-error-budgets-008
    difficulty: beginner
    tags: [error-budget, definition]
    question: |
      How is an error budget defined in terms of the SLO?
    options:
      - "error budget = 100% − SLO"
      - "error budget = SLO + 1"
      - "error budget = SLO × 2"
      - "error budget = number of servers − 1"
    answer: 0
    explanation: |
      The error budget is the allowed unreliability: 100% minus the SLO. A 99.9% SLO
      leaves a 0.1% error budget.
    ref: "concepts.md#error-budgets-and-the-1-minus-slo-math"

  - id: slo-based-alerting-and-error-budgets-009
    difficulty: beginner
    tags: [error-budget, availability-math]
    question: |
      Roughly how much downtime does a 99.9% availability SLO permit over a 30-day month?
    options:
      - "About 4.3 minutes"
      - "About 43 minutes"
      - "About 7.2 hours"
      - "About 43 seconds"
    answer: 1
    explanation: |
      30 days x 24 x 60 min x 0.001 = 43.2 minutes. (99.99% would be ~4.3 minutes; 99%
      would be ~7.2 hours.)
    ref: "concepts.md#error-budgets-and-the-1-minus-slo-math"

  - id: slo-based-alerting-and-error-budgets-010
    difficulty: intermediate
    tags: [error-budget, availability-math]
    question: |
      Approximately how much monthly downtime does a 99.99% ("four nines") SLO allow?
    options:
      - "~43 minutes"
      - "~26 seconds"
      - "~7.2 hours"
      - "~4.3 minutes"
    answer: 3
    explanation: |
      43200 min x 0.0001 = 4.32 minutes per 30-day month. Each additional nine cuts the
      allowable downtime by roughly 10x.
    ref: "concepts.md#error-budgets-and-the-1-minus-slo-math"

  - id: slo-based-alerting-and-error-budgets-011
    difficulty: intermediate
    tags: [error-budget, philosophy]
    question: |
      Why is targeting 100% reliability generally considered the wrong goal?
    options:
      - "Because promising 100% reliability is explicitly prohibited under most standard commercial SLA contracts"
      - "Because it is infinitely expensive and imperceptible to users, whose own networks/devices are less reliable, and it leaves no budget for shipping features"
      - "Because Prometheus rounds a 100% availability ratio down to 99% due to floating-point precision limits"
      - "Because pushing reliability higher always forces the service to run slower to add redundant checks"
    answer: 1
    explanation: |
      Users can't tell 99.99% from 100% (their own ISP/device is the bottleneck), and each
      extra nine costs disproportionately more. Chasing 100% wastes money and leaves zero
      budget for feature velocity.
    ref: "concepts.md#error-budgets-and-the-1-minus-slo-math"

  - id: slo-based-alerting-and-error-budgets-012
    difficulty: intermediate
    tags: [error-budget, culture]
    question: |
      What organizational purpose does the error budget primarily serve?
    options:
      - "It provides a shared, objective currency that aligns feature-shipping (dev) and stability (SRE) incentives"
      - "It entirely replaces the need for monitoring, since the budget number captures all service health"
      - "It is used by finance to calculate individual engineer bonuses and end-of-year performance ratings"
      - "It sets the CPU and memory resource limit that each pod is scheduled with in the cluster"
    answer: 0
    explanation: |
      The budget turns the subjective ship-vs-stabilize argument into an objective rule:
      while budget remains, ship; when it's exhausted, stop and stabilize. This aligns dev
      and ops around one number.
    ref: "concepts.md#error-budgets-and-the-1-minus-slo-math"

  - id: slo-based-alerting-and-error-budgets-013
    difficulty: advanced
    tags: [error-budget, nines, cost]
    question: |
      Moving an SLO from 99.9% to 99.99% has what effect on the monthly error budget?
    options:
      - "It shrinks allowable downtime roughly 10x (from ~43 min to ~4.3 min), usually a large jump in engineering cost"
      - "It doubles the allowable monthly downtime, since adding a nine loosens the objective proportionally"
      - "It leaves the allowable monthly downtime unchanged because both targets round to the same budget"
      - "It only tightens the latency portion of the objective and never touches the availability budget"
    answer: 0
    explanation: |
      Nines are non-linear: each added nine reduces allowable downtime by ~10x. Going 99.9%
      -> 99.99% cuts ~43 min/month to ~4.3 min, typically a steep cost increase.
    ref: "concepts.md#error-budgets-and-the-1-minus-slo-math"

  - id: slo-based-alerting-and-error-budgets-014
    difficulty: beginner
    tags: [burn-rate, definition]
    question: |
      What does a burn rate of 1 mean?
    options:
      - "The service is currently returning zero errors and consuming none of its budget"
      - "You have already exhausted the entire error budget for the current SLO window"
      - "You are consuming the error budget at exactly the rate that would exhaust it precisely at the end of the SLO window"
      - "The burn rate cannot be measured yet because not enough window data has accumulated"
    answer: 2
    explanation: |
      Burn rate = error rate / (1 - SLO). A burn rate of 1 means you finish the SLO window
      with exactly 0 budget remaining. Higher rates exhaust it proportionally faster.
    ref: "concepts.md#burn-rate-how-fast-you-spend-the-budget"

  - id: slo-based-alerting-and-error-budgets-015
    difficulty: intermediate
    tags: [burn-rate, formula]
    question: |
      For a 99.9% SLO, a sustained error rate of 1% corresponds to what burn rate?
    options:
      - "1"
      - "100"
      - "0.1"
      - "10"
    answer: 3
    explanation: |
      burn rate = error rate / (1 - SLO) = 0.01 / 0.001 = 10. So a 1% error rate burns the
      budget 10x faster than sustainable.
    ref: "concepts.md#burn-rate-how-fast-you-spend-the-budget"

  - id: slo-based-alerting-and-error-budgets-016
    difficulty: intermediate
    tags: [burn-rate, exhaustion]
    question: |
      At a sustained burn rate of 10 against a 30-day SLO, how long until the budget is
      exhausted?
    options:
      - "30 days"
      - "10 days"
      - "3 days"
      - "10 hours"
    answer: 2
    explanation: |
      time to exhaust = SLO window / burn rate = 30 days / 10 = 3 days. That fast a burn
      warrants an immediate page.
    ref: "concepts.md#burn-rate-how-fast-you-spend-the-budget"

  - id: slo-based-alerting-and-error-budgets-017
    difficulty: advanced
    tags: [burn-rate, promql]
    question: |
      Given this PromQL for a 99.9% SLO, what does the result represent?

      (sum(rate(http_requests_total{code=~"5.."}[1h])) / sum(rate(http_requests_total[1h]))) / 0.001
    options:
      - "The 1-hour burn rate: the error ratio over the last hour divided by the 0.1% budget"
      - "The absolute count of failed 5xx requests observed across all instances in the last hour"
      - "The p99 tail latency of the service measured over the trailing one-hour rate window"
      - "The number of scrape targets currently reporting up divided by the total configured budget"
    answer: 0
    explanation: |
      The inner fraction is the 1h error ratio; dividing by 0.001 (the 1 - SLO budget)
      normalizes it into a burn rate. A value of 14.4 here means a 14.4x burn.
    ref: "concepts.md#burn-rate-how-fast-you-spend-the-budget"

  - id: slo-based-alerting-and-error-budgets-018
    difficulty: beginner
    tags: [alerting, single-threshold]
    question: |
      Why does alerting on "error rate over the last 5 minutes > 0.1%" tend to be too
      noisy?
    options:
      - "A 5-minute window is longer than any real incident, so it can never catch a genuine outage"
      - "Prometheus cannot evaluate a 5-minute rate window without a dedicated long-range recording rule"
      - "A short window with a low threshold trips on brief self-healing blips, generating false pages and alert fatigue"
      - "A 0.1% error rate is mathematically impossible for a running service to ever actually reach"
    answer: 2
    explanation: |
      Short window + low threshold reacts to tiny transient spikes that resolve on their
      own, paging on-call for non-problems. That erodes trust and causes alert fatigue.
    ref: "concepts.md#why-single-threshold-alerts-are-bad"

  - id: slo-based-alerting-and-error-budgets-019
    difficulty: intermediate
    tags: [alerting, single-threshold, reset-time]
    question: |
      A team alerts only on a 1-hour error-rate window. Besides slow detection, what is the
      other main drawback?
    options:
      - "Poor reset time — after the incident ends, the alert keeps firing for up to an hour because bad data lingers in the window"
      - "It stores too few samples to compute a rate, so Prometheus silently returns an empty result across the whole 1-hour window"
      - "It cannot attach any labels to the resulting alert, so Alertmanager is left unable to route or group the notification at all"
      - "It fires roughly an hour before the incident actually starts, because a 1-hour window looks ahead over future samples"
    answer: 0
    explanation: |
      A long window is slow to detect and slow to clear: once errors stop, the 1h window
      still contains them, so the alert stays lit for up to an hour. Reset time is a real
      cost of long-only windows.
    ref: "concepts.md#why-single-threshold-alerts-are-bad"

  - id: slo-based-alerting-and-error-budgets-020
    difficulty: advanced
    tags: [alerting, four-properties]
    question: |
      Google evaluates an alerting strategy on four properties. Which set is correct?
    options:
      - "Latency, throughput, errors, saturation"
      - "Precision, recall, detection time, reset time"
      - "CPU, memory, disk, network"
      - "Uptime, downtime, MTTR, MTBF"
    answer: 1
    explanation: |
      The four are precision (few false alerts), recall (few misses), detection time (how
      fast a real problem alerts), and reset time (how long it keeps firing after resolve).
      A single threshold can't optimize all four.
    ref: "concepts.md#why-single-threshold-alerts-are-bad"

  - id: slo-based-alerting-and-error-budgets-021
    difficulty: intermediate
    tags: [alerting, fundamental-tradeoff]
    question: |
      What is the fundamental reason a single fixed threshold cannot give good alerting?
    options:
      - "Any single threshold fixes a trade-off among precision, recall, detection time, and reset time — you cannot get all four right at once"
      - "Fixed thresholds were formally deprecated in Prometheus 2.30 and the alerting-rule syntax now rejects any bare numeric comparison"
      - "Evaluating one fixed threshold forces Prometheus to rescan the entire TSDB every cycle, so it always saturates CPU at real scale"
      - "A single fixed threshold structurally misses every real incident because it can only match on exact equality rather than a range"
    answer: 0
    explanation: |
      One threshold picks a single point on the precision/recall/detection/reset trade-off
      surface. Raising the bar improves precision but hurts recall; lengthening the window
      helps precision but worsens reset/detection. You need multiple rules.
    ref: "concepts.md#why-single-threshold-alerts-are-bad"

  - id: slo-based-alerting-and-error-budgets-022
    difficulty: beginner
    tags: [multi-burn-rate, page-vs-ticket]
    question: |
      In multi-window multi-burn-rate alerting, how are fast burns and slow burns typically
      routed?
    options:
      - "Both fast and slow burns always page a human immediately, regardless of the severity involved"
      - "Fast burn pages (immediate human); slow burn opens a ticket (business hours)"
      - "Fast burn is deliberately ignored, while only the slower burn is allowed to page the on-call engineer"
      - "Both fast and slow burns are sent only to a dashboard and never notify a human being at all"
    answer: 1
    explanation: |
      A fast burn will exhaust the budget quickly and needs an immediate page. A slow burn
      (e.g. 1x) still eats the budget but isn't an emergency, so it becomes a ticket handled
      in business hours.
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: slo-based-alerting-and-error-budgets-023
    difficulty: intermediate
    tags: [multi-burn-rate, table-5-8]
    question: |
      In Google's recommended parameters for a 99.9% SLO, which burn rate and windows are
      used for the fastest-burn page?
    options:
      - "Burn rate 1 over 3 days / 6 hours"
      - "Burn rate 6 over 6 hours / 30 minutes"
      - "Burn rate 14.4 over 1 hour / 5 minutes"
      - "Burn rate 100 over 1 minute / 10 seconds"
    answer: 2
    explanation: |
      Workbook Table 5-8: the fast-burn page uses a 14.4x burn rate confirmed over both a
      1-hour long window and a 5-minute short window (consuming ~2% of a 30-day budget).
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: slo-based-alerting-and-error-budgets-024
    difficulty: intermediate
    tags: [multi-burn-rate, short-window]
    question: |
      What is the purpose of the short window (e.g. 5 min alongside the 1h window) in
      multi-window burn-rate alerting?
    options:
      - "To deliberately increase the total number of alerts so the on-call rotation stays busy and practiced during quiet periods"
      - "So the alert stops firing shortly after errors stop (fast reset) and doesn't fire on stale data once the burn has ended"
      - "To completely replace the need for the long window, since a short window alone gives both precision and fast detection"
      - "To reduce the storage Prometheus consumes, because a shorter rate window retains fewer samples on disk over time"
    answer: 1
    explanation: |
      The short window is required to hold too. It ensures the alert clears quickly once
      the burn ends (good reset time) and guards against firing on lingering long-window
      data after the incident is over.
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: slo-based-alerting-and-error-budgets-025
    difficulty: advanced
    tags: [multi-burn-rate, short-window-ratio]
    question: |
      Google's guideline sets the short window to what fraction of the long window?
    options:
      - "1/2"
      - "Equal to the long window"
      - "1/100"
      - "1/12"
    answer: 3
    explanation: |
      The short window is set to 1/12 of the long window (5 min for 1h, 30 min for 6h),
      balancing fast reset against enough signal to avoid flapping.
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: slo-based-alerting-and-error-budgets-026
    difficulty: advanced
    tags: [multi-burn-rate, and-logic]
    question: |
      In a multi-window burn-rate rule, how are the long-window and short-window conditions
      combined?
    options:
      - "With OR — either the long or the short window exceeding the threshold on its own is enough to fire the alert"
      - "They are averaged together into a single blended burn rate that is then compared against the threshold once"
      - "Only the short window is actually evaluated, and the long window is kept purely for display on the dashboard"
      - "With AND — both the long and short windows must exceed the burn-rate threshold"
    answer: 3
    explanation: |
      Each severity uses long AND short: the long window gives precision, the short window
      gives fast reset. Both must exceed the threshold for the rule to fire. (Different
      severities are then combined with OR.)
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: slo-based-alerting-and-error-budgets-027
    difficulty: advanced
    tags: [multi-burn-rate, derivation]
    question: |
      The 14.4 burn rate for the 1-hour page window comes from which calculation for a
      30-day SLO?
    options:
      - "Dividing the SLO percentage 99.9 by the 6.9 hours of monthly downtime a 99% target would permit"
      - "Multiplying the whole-number burn rate 14 by a fixed 1.4 hysteresis factor applied to every page window"
      - "Consuming 2% of a 30-day budget in 1 hour: 0.02 x 720h / 1h ≈ 14.4"
      - "Taking the number of scrape targets in the job and multiplying it by the default replication factor of 2"
    answer: 2
    explanation: |
      14.4 is the burn rate that consumes 2% of the monthly (720h) budget in a single hour:
      0.02 x 720 / 1 = 14.4. That pace would exhaust the whole month's budget in ~2 days.
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: slo-based-alerting-and-error-budgets-028
    difficulty: advanced
    tags: [multi-burn-rate, mistake]
    question: |
      A team alerts on "6h burn rate > 6" only, dropping the 30-minute short window. What
      problem does this introduce?
    options:
      - "It fires several hours too early, before any errors have actually occurred, because a 6-hour window looks ahead"
      - "It cannot be expressed in PromQL at all, since rate() rejects window durations longer than one hour by design"
      - "It ignores the configured SLO entirely and instead compares against a hard-coded default availability target of 99%"
      - "It has poor reset time — it can keep firing for up to 6 hours after the incident resolves — and is slower to detect"
    answer: 3
    explanation: |
      Dropping the short window removes the fast-reset guard. The 6h window keeps the past
      errors in scope, so the alert lingers for up to 6 hours after resolution. The short
      window's AND clause is what makes it usable.
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: slo-based-alerting-and-error-budgets-029
    difficulty: intermediate
    tags: [multi-burn-rate, recording-rules]
    question: |
      Why do teams precompute per-window error ratios with recording rules before writing
      burn-rate alerts?
    options:
      - "So alert expressions stay cheap and readable and avoid recomputing expensive long-range rate() on every evaluation"
      - "Because recording rules are mandated by the Prometheus conformance specification for any rule that uses a ratio"
      - "Because alerting rules are structurally forbidden from referencing raw time series and can only read recorded metrics"
      - "To intentionally increase label cardinality so each burn-rate window gets its own uniquely identifiable series"
    answer: 0
    explanation: |
      Long-range rate() over multiple windows on every alert eval is expensive. Recording
      rules (ratio_rate5m, ratio_rate1h, ...) precompute them, keeping alert expressions
      simple and evaluation cheap.
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: slo-based-alerting-and-error-budgets-030
    difficulty: intermediate
    tags: [multi-burn-rate, scenario]
    question: |
      An API on a 99.9% SLO shows a 1h burn of 20x and a 5m burn of 18x (both above 14.4).
      What should happen?
    options:
      - "Nothing happens, because any burn rate above 14.4 is treated as a sensor glitch and automatically suppressed"
      - "Only a slow-burn ticket is created, since scenarios above the 14.4 threshold are always routed to business-hours queues"
      - "A fast-burn page fires, because both the long and short windows exceed the 14.4 threshold"
      - "The SLO should be lowered to 99% so that the current error rate falls comfortably back inside the objective"
    answer: 2
    explanation: |
      Both windows exceed the 14.4 fast-burn threshold, so the page rule's long-AND-short
      condition is satisfied and it pages. At ~20x burn the month's budget would be gone in
      well under 2 days.
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: slo-based-alerting-and-error-budgets-031
    difficulty: advanced
    tags: [multi-burn-rate, scenario]
    question: |
      A 99.9% service has a 1h burn of 16x but its 5m burn is 0.2x (errors stopped 10
      minutes ago). With the recommended long-AND-short page rule, what happens?
    options:
      - "It pages, because the 1h window is above 14.4 and the long window alone is enough to satisfy the page rule"
      - "It does not page, because the short 5m window is below threshold — the burn has already ended"
      - "It creates a ticket and fires a page simultaneously, because the two windows now disagree with each other"
      - "Prometheus deletes the underlying series once the short-window burn drops below the configured page threshold"
    answer: 1
    explanation: |
      The page requires BOTH windows above 14.4. The short window has dropped (burn ended),
      so the AND is false and no page fires. This is exactly the false-positive/reset
      benefit the short window provides.
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: slo-based-alerting-and-error-budgets-032
    difficulty: beginner
    tags: [error-budget-policy, feature-freeze]
    question: |
      Under a typical error budget policy, what happens when the budget is exhausted?
    options:
      - "The team celebrates the milestone and accelerates the feature roadmap to spend the remaining reliability slack"
      - "The SLO is automatically deleted and recreated at a looser target so the service is back in compliance"
      - "All alerts for the service are silenced permanently so the on-call rotation is no longer paged for it"
      - "A feature freeze: engineering effort redirects to reliability work until the service is back within SLO"
    answer: 3
    explanation: |
      The canonical policy response to an exhausted budget is a feature freeze — only
      reliability fixes and critical security patches ship until the service recovers to
      within SLO.
    ref: "concepts.md#error-budget-policy-what-you-do-when-its-spent"

  - id: slo-based-alerting-and-error-budgets-033
    difficulty: intermediate
    tags: [error-budget-policy, pre-agreement]
    question: |
      Why is an error budget policy written and agreed in advance rather than decided
      during an incident?
    options:
      - "It converts a subjective in-the-moment argument into a pre-agreed objective rule, so nobody negotiates policy during an incident"
      - "Because drafting the policy after an incident violates the SRE compliance standard and can void the customer SLA"
      - "Because Prometheus refuses to load burn-rate alerting rules unless a matching budget-policy config file is present"
      - "To make the policy deliberately harder to change later, locking the freeze thresholds so no team can ever revise them"
    answer: 0
    explanation: |
      Pre-agreement (dev + product + SRE) turns ship-vs-freeze from a heated debate into an
      objective, already-decided rule. It also gives SRE a legitimate lever without
      per-incident escalation.
    ref: "concepts.md#error-budget-policy-what-you-do-when-its-spent"

  - id: slo-based-alerting-and-error-budgets-034
    difficulty: intermediate
    tags: [error-budget-policy, exceptions]
    question: |
      A well-designed error budget policy should also specify what?
    options:
      - "The exact CPU and memory limits each container is scheduled with when the freeze takes effect"
      - "The programming language and framework the team is required to standardize on for reliability fixes"
      - "The color scheme and layout of the reliability dashboard shown during the quarterly business review"
      - "Escalation and an exception process (e.g. who can approve an override for a legally required change)"
    answer: 3
    explanation: |
      Without a defined exception/escalation path, a freeze becomes a blunt instrument. The
      policy should name who can approve overrides (e.g. security or legally mandated
      changes) and how.
    ref: "concepts.md#error-budget-policy-what-you-do-when-its-spent"

  - id: slo-based-alerting-and-error-budgets-035
    difficulty: intermediate
    tags: [request-vs-windows, comparison]
    question: |
      What is the key difference between a request-based and a windows-based SLO?
    options:
      - "Request-based SLOs can only be derived from access logs, whereas windows-based SLOs can only be derived from distributed traces"
      - "Request-based computes good/total requests (weighting by traffic); windows-based computes good/total time windows (treating each window equally)"
      - "They always produce numerically identical results, so the choice between them is purely a matter of naming convention"
      - "Windows-based SLOs cannot be measured in Prometheus at all, because it has no way to mark a time slice good or bad"
    answer: 1
    explanation: |
      Request-based is an event ratio that weights by traffic volume. Windows-based marks
      each time slice good/bad and takes the ratio of good windows, treating each window
      equally regardless of traffic.
    ref: "concepts.md#request-based-vs-timewindow-based-slos"

  - id: slo-based-alerting-and-error-budgets-036
    difficulty: advanced
    tags: [request-vs-windows, traffic-weighting]
    question: |
      For a request-based SLO, why does an outage during peak traffic burn more budget than
      the same-duration outage at 3 a.m.?
    options:
      - "Because Prometheus increases its scrape frequency automatically during peak traffic, sampling far more error events"
      - "Because the ratio is weighted by request volume, so more failed requests occur (and count) during high traffic"
      - "Because failures that occur during overnight low-traffic hours are excluded from the budget calculation by default"
      - "Because request latency is intrinsically lower at night, so the same errors weigh less against the objective then"
    answer: 1
    explanation: |
      Request-based SLOs count events. A peak-hour outage fails many more requests than a
      low-traffic-hour outage of equal duration, so it consumes more of the event-based
      budget — which usually matches real user impact.
    ref: "concepts.md#request-based-vs-timewindow-based-slos"

  - id: slo-based-alerting-and-error-budgets-037
    difficulty: advanced
    tags: [request-vs-windows, low-traffic]
    question: |
      Why are low-traffic services particularly hard to measure with a request-based SLO?
    options:
      - "With few requests, a single failure can swing the ratio dramatically, making the SLI noisy"
      - "They emit so many extra metric series that the TSDB overflows and the ratio corrupts"
      - "Prometheus refuses to scrape endpoints whose request rate falls below a fixed minimum"
      - "Low request volume pins the measured availability at exactly 100% regardless of errors"
    answer: 0
    explanation: |
      When only a handful of requests occur, one failure is a large fraction of the total,
      producing wild SLI swings. Mitigations include longer aggregation windows, synthetic
      probe traffic, or grouping services.
    ref: "concepts.md#request-based-vs-timewindow-based-slos"

  - id: slo-based-alerting-and-error-budgets-038
    difficulty: intermediate
    tags: [request-vs-windows, choosing]
    question: |
      Which SLO style maps most naturally to a "minutes of downtime per month" style SLA?
    options:
      - "Request-based"
      - "Neither can represent downtime"
      - "Only a latency SLO"
      - "Windows-based (time-based)"
    answer: 3
    explanation: |
      Windows-based SLOs mark each minute good/bad, so "good minutes / total minutes" maps
      directly to duration-style downtime contracts. Request-based weights by traffic and
      maps less directly to minutes.
    ref: "concepts.md#request-based-vs-timewindow-based-slos"

  - id: slo-based-alerting-and-error-budgets-039
    difficulty: intermediate
    tags: [alert-quality, symptom-vs-cause]
    question: |
      What does "alert on symptoms, not causes" mean in the context of SLO alerting?
    options:
      - "Page on every internal cause metric such as CPU, memory pressure, GC pauses, and queue depth so nothing is ever missed"
      - "Never create paging alerts at all and rely purely on engineers watching dashboards during their working hours"
      - "Page on user-visible pain (e.g. checkout success burning budget), and reserve cause metrics like high CPU for dashboards and diagnosis"
      - "Alert only on internal root causes and deliberately ignore what the user actually experiences at the edge"
    answer: 2
    explanation: |
      Symptom alerts catch user-affecting problems you never predicted; cause alerts
      (CPU, queue length) are noisy and belong on dashboards for diagnosis. SLO burn-rate
      alerts are symptom alerts by construction.
    ref: "concepts.md#alert-quality-making-pages-actionable-symptom-vs-cause"

  - id: slo-based-alerting-and-error-budgets-040
    difficulty: beginner
    tags: [alert-quality, actionable]
    question: |
      What is the core test for whether something should page a human?
    options:
      - "Whether a user is (or is about to be) harmed AND the responder can act on it right now"
      - "Whether the underlying metric carries at least one label so Alertmanager is able to route it"
      - "Whether the condition happened during business hours when the on-call engineer is already awake"
      - "Whether host CPU utilization has climbed above the fixed 50% saturation line for the box"
    answer: 0
    explanation: |
      Every page must be actionable and tied to real user impact. If the user isn't harmed
      or the responder can't do anything, it should be a ticket or dashboard item, not a
      page. Non-actionable pages drive alert fatigue.
    ref: "concepts.md#alert-quality-making-pages-actionable-symptom-vs-cause"

  - id: slo-based-alerting-and-error-budgets-041
    difficulty: intermediate
    tags: [alert-quality, routing, alertmanager]
    question: |
      What role does Alertmanager-style grouping/routing/inhibition play in alert quality?
    options:
      - "It computes and generates the raw SLIs by aggregating good and valid events itself"
      - "It ensures a single root cause doesn't emit dozens of separate pages, and routes by severity (page vs ticket vs dashboard)"
      - "It scrapes the /metrics endpoints on each target and stores the resulting time series"
      - "It computes histogram quantiles so latency SLIs can be derived from bucket counts"
    answer: 1
    explanation: |
      Grouping collapses related alerts, inhibition suppresses downstream alerts when a
      root cause fires, and routing sends fast-burn to a pager and slow-burn to tickets —
      all improving signal quality and reducing fatigue.
    ref: "concepts.md#alert-quality-making-pages-actionable-symptom-vs-cause"

  - id: slo-based-alerting-and-error-budgets-042
    difficulty: intermediate
    tags: [sli, latency, multiple-thresholds]
    question: |
      Why might a team define two latency SLOs, e.g. "90% of requests < 100 ms AND 99% <
      1 s", instead of one?
    options:
      - "Because a single percentile target is not a syntactically valid SLO definition on its own"
      - "Because Prometheus enforces a hard rule that every latency objective declare exactly two thresholds"
      - "To shape the whole latency distribution — bounding both the typical experience and the tail"
      - "Because computing an average latency SLI mathematically requires at least two paired data points"
    answer: 2
    explanation: |
      Multiple threshold SLOs constrain different parts of the distribution: the 90%/100ms
      target protects the common case while the 99%/1s target bounds the tail, giving a more
      complete picture than one threshold.
    ref: "concepts.md#choosing-good-slis-the-sli-equation"

  - id: slo-based-alerting-and-error-budgets-043
    difficulty: intermediate
    tags: [sli, measurement-point]
    question: |
      Measuring an availability SLI at the load balancer / edge rather than deep inside the
      app has what main advantage?
    options:
      - "It captures more of the failures a user actually experiences (including some the app never sees)"
      - "It stores far fewer time series on disk because edge counters are cheaper to retain"
      - "It is the only component in the request path that Prometheus is actually able to scrape"
      - "It removes the need to define a formal SLO because the edge already guarantees availability"
    answer: 0
    explanation: |
      Edge/LB measurement is closer to the user and catches failures app-internal counters
      miss (e.g. requests that never reach the app). App metrics attribute causes better,
      so many teams use both.
    ref: "concepts.md#choosing-good-slis-the-sli-equation"

  - id: slo-based-alerting-and-error-budgets-044
    difficulty: beginner
    tags: [sla, penalty]
    question: |
      A cloud provider promises "99.5% monthly uptime or a 10% service credit." What is this
      an example of?
    options:
      - "An SLI"
      - "An SLO"
      - "An SLA"
      - "A burn rate"
    answer: 2
    explanation: |
      A customer-facing commitment with a financial consequence (service credit) for
      missing the target is an SLA. The 99.5% figure is the objective inside it; the
      measured uptime is the SLI.
    ref: "concepts.md#sli-vs-slo-vs-sla"

  - id: slo-based-alerting-and-error-budgets-045
    difficulty: advanced
    tags: [multi-burn-rate, ticket]
    question: |
      In Table 5-8, the slow-burn ticket for a 99.9% SLO uses a burn rate of 1 over which
      windows?
    options:
      - "1 hour long / 5 minutes short"
      - "5 minutes long / 1 minute short"
      - "3 days long / 6 hours short"
      - "30 days long / 1 day short"
    answer: 2
    explanation: |
      The slow-burn ticket uses a 1x burn rate confirmed over a 3-day long window and a
      6-hour short window (consuming ~10% of budget if sustained across the long window).
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: slo-based-alerting-and-error-budgets-046
    difficulty: advanced
    tags: [burn-rate, budget-consumed]
    question: |
      The formula "error budget consumed by an alert = burn rate x alert window / SLO
      period" tells you what?
    options:
      - "What fraction of the total budget is spent if the burn continues for the whole alert window"
      - "The p99 tail latency the service exhibits while the burn-rate alert is actively firing"
      - "The total number of distinct alert rules that will fire during the current SLO period"
      - "The scrape interval Prometheus should use when evaluating this particular burn-rate rule"
    answer: 0
    explanation: |
      It quantifies how much of the budget a given burn over a given window costs. E.g.
      14.4 x 1h / 720h ≈ 2%, which is why the 1h/14.4x page corresponds to ~2% budget spend.
    ref: "concepts.md#burn-rate-how-fast-you-spend-the-budget"

  - id: slo-based-alerting-and-error-budgets-047
    difficulty: intermediate
    tags: [error-budget, spend-sources]
    question: |
      Which of the following consumes error budget?
    options:
      - "Only fully unplanned outages count, since scheduled or intentional downtime is exempt by definition"
      - "Nothing is deducted from the budget until the penalty-bearing customer SLA is actually breached"
      - "Bad deploys, planned maintenance, experiments, and dependency failures all consume budget — anything that produces unreliability"
      - "Only latency violations draw down the budget, while availability failures are tracked separately"
    answer: 2
    explanation: |
      The budget is spent by all sources of unreliability, intentional or not. That's the
      point: it forces objective prioritization of reliability work regardless of the
      cause.
    ref: "concepts.md#error-budgets-and-the-1-minus-slo-math"

  - id: slo-based-alerting-and-error-budgets-048
    difficulty: intermediate
    tags: [sli, user-centric]
    question: |
      Why is "CPU utilization at 95%" generally a poor choice for a user-facing SLI?
    options:
      - "CPU utilization is fundamentally impossible to measure reliably in a containerized environment"
      - "It's an internal cause metric, not a measure of user experience — high CPU is not a violation if users are still served well"
      - "A sustained 95% CPU level is always perfectly fine and can never correlate with user harm"
      - "CPU utilization samples are far too expensive to store at the cardinality an SLO requires"
    answer: 1
    explanation: |
      SLIs should reflect what users experience (success, latency), not internal proxies.
      A service can run hot on CPU while serving users perfectly; CPU belongs on a
      diagnostic dashboard, not as an SLO.
    ref: "concepts.md#choosing-good-slis-the-sli-equation"

  - id: slo-based-alerting-and-error-budgets-049
    difficulty: beginner
    tags: [alerting, burn-rate, principle]
    question: |
      The core principle of SLO-based alerting is to alert on what?
    options:
      - "Raw host CPU thresholds crossed on any single instance in the fleet"
      - "The absolute number of running pods dropping below the desired replica count"
      - "Every emitted log line that happens to contain the substring 'error' anywhere"
      - "How fast the error budget is being consumed (burn rate), not on raw error-count thresholds"
    answer: 3
    explanation: |
      SLO alerting pages on budget burn rate because that answers the operational question
      that matters — how long until the budget is gone — and is comparable across services
      with different SLOs.
    ref: "concepts.md#burn-rate-how-fast-you-spend-the-budget"

  - id: slo-based-alerting-and-error-budgets-050
    difficulty: advanced
    tags: [multi-burn-rate, scenario, config]
    question: |
      Given this alert expression for a 99.9% SLO, what is 0.001 doing?

      job:slo_errors:ratio_rate1h > (14.4 * 0.001) and job:slo_errors:ratio_rate5m > (14.4 * 0.001)
    options:
      - "It is the scrape interval in seconds applied to the underlying recording rule series"
      - "It is a smoothing constant that damps short-lived spikes before the ratio is compared"
      - "It is the error budget (1 − 0.999), so 14.4 * 0.001 converts the 14.4x burn rate back into an error-ratio threshold to compare against the measured ratio"
      - "It is the count of scrape targets in the job, used to average the ratio across them"
    answer: 2
    explanation: |
      The recording rules emit an error ratio, not a burn rate. Multiplying the burn-rate
      threshold (14.4) by the budget (0.001) yields the error-ratio value that corresponds
      to that burn rate, so it can be compared directly against ratio_rate1h/5m.
    ref: "concepts.md#multi-window-multi-burn-rate-alerting"

  - id: slo-based-alerting-and-error-budgets-051
    difficulty: beginner
    tags: [sli, fewer-is-better]
    question: |
      Google's guidance on how many SLIs a service should have is best summarized as:
    options:
      - "As many as possible — ideally one SLI attached to every internal metric the service emits"
      - "Few — a handful capturing the critical user journeys beats dozens nobody watches"
      - "Exactly one SLI per service, always, no matter how many user journeys it serves"
      - "One SLI per engineer on the team so ownership of each indicator is unambiguous"
    answer: 1
    explanation: |
      Fewer, high-quality SLIs that capture the important user journeys are better than a
      sprawling set. Too many SLIs dilute focus and nobody watches them.
    ref: "concepts.md#choosing-good-slis-the-sli-equation"

  - id: slo-based-alerting-and-error-budgets-052
    difficulty: advanced
    tags: [burn-rate, formula, high-error]
    question: |
      For a 99.9% SLO, if the service is returning 100% errors, what is the burn rate?
    options:
      - "1"
      - "10"
      - "100"
      - "1000"
    answer: 3
    explanation: |
      burn rate = error rate / (1 - SLO) = 1.0 / 0.001 = 1000. A total outage burns the
      budget 1000x faster than sustainable — the budget disappears in minutes.
    ref: "concepts.md#burn-rate-how-fast-you-spend-the-budget"

