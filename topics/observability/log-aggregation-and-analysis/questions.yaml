topic: "Log Aggregation & Analysis (ELK / Loki)"
domain: observability
topic_slug: log-aggregation-and-analysis
version: 1
questions:
  - id: log-aggregation-and-analysis-001
    difficulty: beginner
    tags: [pipeline, fundamentals]
    question: |
      What is the primary purpose of log aggregation in a distributed system?
    options:
      - "To reduce the number of log lines each service produces by sampling and dropping low-value entries at the source"
      - "To ship every service's logs to a central system where they can be indexed, correlated, and queried as one dataset"
      - "To replace the separate metrics and traces pillars with logs as the single telemetry signal on-call engineers watch"
      - "To encrypt every log line with TLS on the host so raw text never travels the network unprotected"
    answer: 1
    explanation: |
      On a single host you can grep a file, but across many ephemeral services you
      cannot. Log aggregation centralizes logs so they can be parsed, indexed, stored,
      correlated, and queried together — the foundation of the logs pillar.
    ref: "concepts.md#the-centralized-logging-pipeline"

  - id: log-aggregation-and-analysis-002
    difficulty: beginner
    tags: [pipeline, stages]
    question: |
      Which sequence best describes the classic five-stage centralized logging pipeline?
    options:
      - "Index -> ship -> parse -> query -> store"
      - "Parse -> store -> ship -> query -> index"
      - "Query -> buffer -> ship -> index -> parse"
      - "Ship -> parse/enrich -> buffer -> index/store -> query"
    answer: 3
    explanation: |
      Almost every log system follows: ship (agent), parse/enrich (extract fields, add
      metadata), buffer (decouple from the store), index/store (write to the backend),
      and query (UI/API). Naming the stages lets you reason about cost and failure per hop.
    ref: "concepts.md#the-centralized-logging-pipeline"

  - id: log-aggregation-and-analysis-003
    difficulty: intermediate
    tags: [pipeline, buffering, reliability]
    question: |
      Why is a buffer/broker stage (agent disk buffer or Kafka) placed between the
      collectors and the storage backend?
    options:
      - "To decouple producers from the store so a slow or down backend does not block the app or drop logs"
      - "To build a preliminary full-text inverted index on the logs before they ever reach Elasticsearch"
      - "To convert JSON logs back into grok-pattern text so Logstash filters can re-parse them downstream"
      - "To automatically reduce label cardinality by collapsing high-churn fields before they reach the index"
    answer: 0
    explanation: |
      The buffer stage absorbs backpressure: if the backend is slow or unavailable,
      the buffer holds events (disk buffer and/or a broker like Kafka) so the
      application is not blocked and logs are not lost.
    ref: "concepts.md#the-centralized-logging-pipeline"

  - id: log-aggregation-and-analysis-004
    difficulty: intermediate
    tags: [pipeline, cost]
    question: |
      In the logging pipeline cost model, which stage's cost is dominated primarily by
      how much data a query must scan?
    options:
      - "Ship"
      - "Parse/enrich"
      - "Query"
      - "Buffer"
    answer: 2
    explanation: |
      Ingest cost is dominated by parsing + indexing (CPU), storage cost by what/where
      you retain, and query cost by how much data a query must scan. ELK and Loki make
      opposite bets on whether to spend at ingest or defer to query time.
    ref: "concepts.md#the-centralized-logging-pipeline"

  - id: log-aggregation-and-analysis-005
    difficulty: beginner
    tags: [collectors, fluent-bit]
    question: |
      In a Kubernetes cluster, which collector is most commonly deployed as a
      lightweight per-node DaemonSet because of its tiny (megabytes-of-RAM) footprint?
    options:
      - "Logstash"
      - "Fluent Bit"
      - "Elasticsearch"
      - "Kibana"
    answer: 1
    explanation: |
      Fluent Bit is written in C with a very small footprint, making it the common
      per-node agent. Logstash is a heavy JVM aggregator; Elasticsearch and Kibana are
      the store and UI, not collectors.
    ref: "concepts.md#collectors-agents-and-forwarders"

  - id: log-aggregation-and-analysis-006
    difficulty: intermediate
    tags: [collectors, logstash, beats]
    question: |
      In a typical Elastic Stack deployment, what is the division of labor between
      Filebeat and Logstash?
    options:
      - "Filebeat stores the inverted index on each host while Logstash renders the Kibana dashboards for querying it"
      - "Filebeat is a lightweight shipper that tails files; Logstash is a heavier aggregator that does rich parsing/transforms (grok, mutate)"
      - "Filebeat evaluates PromQL scrape rules while Logstash executes LogQL queries against the stored log streams"
      - "They are interchangeable names for the same Go binary, differing only in the configuration flags you pass"
    answer: 1
    explanation: |
      Filebeat is a lightweight shipper meant to run on every host with minimal
      transforms. Logstash is the JVM-based aggregator with rich filter plugins (grok,
      mutate, geoip) but higher resource use — often centralized rather than per-node.
    ref: "concepts.md#collectors-agents-and-forwarders"

  - id: log-aggregation-and-analysis-007
    difficulty: intermediate
    tags: [collectors, delivery-semantics]
    question: |
      Most log collection agents provide which delivery guarantee, and what is the
      practical consequence?
    options:
      - "Exactly-once; duplicates are impossible"
      - "At-most-once; logs may be silently dropped but never duplicated"
      - "At-least-once; retries can produce duplicate events"
      - "No guarantee; ordering and delivery are both random"
    answer: 2
    explanation: |
      Most agents give at-least-once delivery: on failure they retry, which can
      duplicate events. True exactly-once is rare and expensive, so downstream systems
      often dedupe on a key when duplicates matter.
    ref: "concepts.md#collectors-agents-and-forwarders"

  - id: log-aggregation-and-analysis-008
    difficulty: intermediate
    tags: [collectors, push-pull]
    question: |
      Why are logs almost always pushed to the backend rather than pulled/scraped the
      way Prometheus collects metrics?
    options:
      - "Because individual log events are far smaller than metric samples and travel faster when pushed"
      - "Because the HTTP protocol cannot stream arbitrary text bodies the way a scrape endpoint returns them"
      - "Because Elasticsearch's ingest API only accepts pushed bulk writes and offers no pull/scrape endpoint at all"
      - "Because events are produced continuously and cannot be re-derived by a later scrape"
    answer: 3
    explanation: |
      Log events are discrete and continuous; a missed moment cannot be reconstructed
      by scraping later, unlike a gauge/counter that still holds its current value. So
      agents push events as they occur.
    ref: "concepts.md#collectors-agents-and-forwarders"

  - id: log-aggregation-and-analysis-009
    difficulty: advanced
    tags: [collectors, vector, performance]
    question: |
      A team runs heavy grok parsing inside a per-node agent at very high log volume and
      sees node CPU saturation. Which change most directly addresses the root cause?
    options:
      - "Emit structured (JSON) logs at the source so no regex parsing is needed, or move heavy parsing to a central aggregator"
      - "Add more replica shards in Elasticsearch so the parsing load spreads across additional index copies"
      - "Increase the query-frontend parallelism in Loki so read fan-out relieves the agent's parsing CPU"
      - "Switch the agent from push to pull mode so the backend paces how fast lines are parsed"
    answer: 0
    explanation: |
      Regex/grok parsing is CPU-hungry and, run on every node, competes with the
      workload. Emitting JSON at the source removes the parse step entirely; if you
      cannot control the format, push heavy parsing to a central aggregator.
    ref: "concepts.md#collectors-agents-and-forwarders"

  - id: log-aggregation-and-analysis-010
    difficulty: beginner
    tags: [parsing, grok]
    question: |
      What is grok used for in log processing?
    options:
      - "Compressing batched log chunks with gzip before they are flushed to object storage"
      - "Balancing primary and replica shards evenly across the nodes of an Elasticsearch cluster"
      - "Propagating W3C trace-context headers between services so spans can be stitched together"
      - "Matching unstructured text lines with named regular-expression patterns to extract fields"
    answer: 3
    explanation: |
      Grok matches unstructured text using named regex patterns (e.g. %{IPORHOST:client}),
      turning a raw line into typed, named fields the backend can index and aggregate.
    ref: "concepts.md#parsing-grok-vs-json-structured-logs"

  - id: log-aggregation-and-analysis-011
    difficulty: intermediate
    tags: [parsing, structured-logging]
    question: |
      Why do structured (JSON) logs make aggregation cheaper and more reliable than
      grok-parsed text?
    options:
      - "JSON logs are always smaller on disk than plain text because the key names compress to near zero"
      - "JSON payloads automatically disable the inverted index, so the backend never spends CPU tokenizing them"
      - "JSON logs are structurally incapable of holding high-cardinality values like request or user ids"
      - "Fields arrive already named and typed, so there is no fragile regex parse step and aggregations/correlation are exact"
    answer: 3
    explanation: |
      With JSON the collector just deserializes — no fragile, CPU-heavy regex. Fields
      are already named and typed, so count-by-status aggregations are exact and joining
      on trace_id is trivial.
    ref: "concepts.md#parsing-grok-vs-json-structured-logs"

  - id: log-aggregation-and-analysis-012
    difficulty: intermediate
    tags: [parsing, grok, gotcha]
    question: |
      What is a well-known downside of relying on grok patterns for parsing?
    options:
      - "Patterns are regex that break when the log format changes and can backtrack catastrophically if poorly anchored"
      - "Grok can only capture string fields and silently discards any numeric values it matches in a line"
      - "Grok patterns are proprietary to Grafana Loki and cannot be run inside Logstash or an OTel pipeline"
      - "Grok forces every extracted field to be indexed as analyzed text, so exact-match queries stop working"
    answer: 0
    explanation: |
      Grok patterns are regular expressions: they are fragile (break when the format
      shifts) and CPU-hungry, and a poorly-anchored pattern can cause catastrophic
      regex backtracking.
    ref: "concepts.md#parsing-grok-vs-json-structured-logs"

  - id: log-aggregation-and-analysis-013
    difficulty: intermediate
    tags: [parsing, best-practice]
    question: |
      What is the interview-correct guidance on "grok vs JSON"?
    options:
      - "Always grok everything at ingest because JSON is too verbose to store and index economically"
      - "Never parse logs at all; store every line raw and rely purely on full-text scans at query time"
      - "Use grok to parse JSON payloads and reserve JSON output strictly for plain-text application logs"
      - "Emit JSON at the source; reserve grok for third-party/legacy logs whose format you do not control"
    answer: 3
    explanation: |
      The best answer is to emit structured JSON at the application so parsing is
      trivial and reliable, and only fall back to grok for logs you cannot change
      (third-party or legacy systems).
    ref: "concepts.md#parsing-grok-vs-json-structured-logs"

  - id: log-aggregation-and-analysis-014
    difficulty: beginner
    tags: [elk, components]
    question: |
      What do the letters in "ELK" stand for?
    options:
      - "Event Log Kernel"
      - "Elastic, Loki, Kafka"
      - "Elasticsearch, Logstash, Kibana"
      - "Elasticsearch, LogQL, Kubernetes"
    answer: 2
    explanation: |
      ELK = Elasticsearch (store + search index) + Logstash (parse/transform) + Kibana
      (UI). With Beats as the shipper, the whole thing is now called the Elastic Stack.
    ref: "concepts.md#the-elastic-stack-elk--beats"

  - id: log-aggregation-and-analysis-015
    difficulty: intermediate
    tags: [elk, kibana]
    question: |
      In the Elastic Stack, which component provides the query and visualization UI?
    options:
      - "Filebeat"
      - "Logstash"
      - "Elasticsearch"
      - "Kibana"
    answer: 3
    explanation: |
      Kibana is the UI (Discover, dashboards, KQL). Elasticsearch is the store/search
      engine, Logstash parses/transforms, and Filebeat ships logs off hosts.
    ref: "concepts.md#the-elastic-stack-elk--beats"

  - id: log-aggregation-and-analysis-016
    difficulty: intermediate
    tags: [elk, tradeoff]
    question: |
      What is Elasticsearch's key strength that justifies its higher cost for log use cases?
    options:
      - "It stores every log line in cheap object storage such as S3 for almost nothing, like Loki does"
      - "Because every field (including the free-text message) is indexed, it supports fast ad-hoc full-text search and rich aggregations without knowing queries in advance"
      - "It runs entirely off-heap with no memory footprint, so a single small node serves any query volume"
      - "It indexes only a bounded set of stream labels, exactly the way Prometheus and Loki do, to stay cheap"
    answer: 1
    explanation: |
      Elasticsearch indexes every field including the message body, enabling fast,
      exploratory full-text search, fuzzy matching, and rich aggregations. The price is
      a large, compute- and memory-heavy index and a stateful cluster.
    ref: "concepts.md#the-elastic-stack-elk--beats"

  - id: log-aggregation-and-analysis-017
    difficulty: beginner
    tags: [elasticsearch, inverted-index]
    question: |
      An inverted index in Elasticsearch/Lucene maps which of the following?
    options:
      - "Each term to the list of documents (postings) that contain it"
      - "Each document id back to the set of stream labels that were attached to it at ingest"
      - "Each shard id to the cluster node currently hosting its primary and replica copies"
      - "Each timestamp bucket to the compressed chunk holding those lines in object storage"
    answer: 0
    explanation: |
      An inverted index is a dictionary from term -> postings list (the doc ids
      containing that term). Answering "logs containing X and Y" is then a fast
      intersection of postings lists, independent of total log count.
    ref: "concepts.md#elasticsearch-internals-the-inverted-index"

  - id: log-aggregation-and-analysis-018
    difficulty: intermediate
    tags: [elasticsearch, analysis, tokenization]
    question: |
      When Elasticsearch indexes a text field, what does the analyzer do first?
    options:
      - "Compresses the field with the snappy codec before appending it to the write-ahead log"
      - "Tokenizes the text into terms and normalizes them (lowercasing, stemming, stop-words)"
      - "Assigns the field to a Loki stream keyed by its unique combination of label values"
      - "Writes the field straight to the frozen tier in object storage to keep the hot nodes small"
    answer: 1
    explanation: |
      The analyzer tokenizes text into terms and normalizes them (lowercase, stem,
      handle stop-words) before Lucene builds the inverted index from those terms. This
      is what enables flexible full-text matching.
    ref: "concepts.md#elasticsearch-internals-the-inverted-index"

  - id: log-aggregation-and-analysis-019
    difficulty: advanced
    tags: [elasticsearch, mapping]
    question: |
      In an Elasticsearch mapping, what is the practical difference between a `text`
      field and a `keyword` field?
    options:
      - "text fields are stored in cheap object storage while keyword fields are pinned to local SSD for faster exact lookups"
      - "text fields support sorting and aggregations directly, while keyword fields cannot be used in any query or filter clause"
      - "text is analyzed/tokenized for full-text search; keyword is stored verbatim for exact match and aggregations"
      - "There is no functional difference; text and keyword are interchangeable aliases resolved to the same Lucene field type"
    answer: 2
    explanation: |
      A `text` field is analyzed (tokenized) so it supports full-text search; a
      `keyword` field is stored verbatim and is used for exact matching, sorting, and
      aggregations. Choosing the wrong type limits the queries you can run.
    ref: "concepts.md#elasticsearch-internals-the-inverted-index"

  - id: log-aggregation-and-analysis-020
    difficulty: intermediate
    tags: [elasticsearch, cost]
    question: |
      Why is the inverted index the main reason ELK is expensive to run?
    options:
      - "It lives only in high-latency object storage such as S3, so every term lookup incurs a slow network round trip"
      - "It eagerly duplicates every raw log line ten times across the cluster by default, independent of any replica-shard setting"
      - "It requires logs to be retained fully uncompressed on disk forever, disabling both segment merging and codec compression"
      - "It can rival or exceed the size of the raw logs and needs lots of RAM to stay fast, plus CPU to index every token"
    answer: 3
    explanation: |
      Indexing every token costs CPU at ingest, and the resulting index can be as large
      as or larger than the raw data and needs substantial RAM (heap + page cache) to
      serve queries fast. That cost buys schema-free ad-hoc search.
    ref: "concepts.md#elasticsearch-internals-the-inverted-index"

  - id: log-aggregation-and-analysis-021
    difficulty: advanced
    tags: [elasticsearch, shards, lucene]
    question: |
      Which statement about Elasticsearch shards is correct?
    options:
      - "All shards of an index must be co-located on a single node so Lucene can guarantee read-after-write consistency"
      - "Replica shards hold only the stream labels while primary shards hold the compressed log chunks they point to"
      - "A shard is a self-contained Lucene index; primary shards hold data and replica shards add redundancy and read throughput"
      - "The number of primary shards can be raised or lowered freely at any time and takes effect without a reindex"
    answer: 2
    explanation: |
      Each shard is a self-contained Lucene index made of immutable segments. Primary
      shards own the data; replica shards are copies that add redundancy and serve read
      requests. Primary shard count is fixed at index creation.
    ref: "concepts.md#elasticsearch-internals-the-inverted-index"

  - id: log-aggregation-and-analysis-022
    difficulty: beginner
    tags: [loki, indexing]
    question: |
      What does Grafana Loki index?
    options:
      - "Only a small set of labels per stream; raw log lines are stored as compressed chunks"
      - "The full text of every log line, building a Lucene-style inverted index over the message body at ingest"
      - "Every unique word after stemming and stop-word removal, so any substring can be matched from the index alone"
      - "Trace spans and their durations, correlating each log line to a span id stored in the same index"
    answer: 0
    explanation: |
      Loki's defining decision is that it does NOT full-text index log contents. It
      indexes only labels per stream and stores the raw lines as compressed chunks in
      object storage — "Prometheus, but for logs."
    ref: "concepts.md#grafana-loki-label-based-indexing"

  - id: log-aggregation-and-analysis-023
    difficulty: intermediate
    tags: [loki, streams]
    question: |
      In Loki, what defines a distinct log "stream"?
    options:
      - "A unique set of label key/value pairs"
      - "A single log file on disk, so each tailed file on a node maps to exactly one stream"
      - "A single trace_id, so every request opens and closes its own dedicated stream"
      - "One Elasticsearch shard, since Loki reuses Lucene shards as its unit of stream storage"
    answer: 0
    explanation: |
      A stream is the set of logs sharing the same unique combination of labels (e.g.
      {app="checkout", namespace="prod", level="error"}). Each stream's lines are
      batched, compressed into chunks, and written to object storage.
    ref: "concepts.md#grafana-loki-label-based-indexing"

  - id: log-aggregation-and-analysis-024
    difficulty: intermediate
    tags: [loki, storage]
    question: |
      Where does Loki store the actual log line data?
    options:
      - "In a large full-text inverted index kept on local SSD, exactly the way Elasticsearch stores its segments"
      - "As compressed chunks in object storage such as S3, GCS, or Azure Blob"
      - "Only in the ingester's in-memory ring buffer, which is never flushed to any durable backing store"
      - "Embedded inside each Grafana dashboard's saved JSON model, alongside the panel definitions"
    answer: 1
    explanation: |
      Loki compresses batched lines into chunks and writes them to object storage,
      which is cheap and near-infinite. A small index only maps labels -> chunks. This
      is the core of Loki's cost advantage.
    ref: "concepts.md#grafana-loki-label-based-indexing"

  - id: log-aggregation-and-analysis-025
    difficulty: advanced
    tags: [loki, query-execution]
    question: |
      In Loki, how is a text filter like `|= "declined"` executed given there is no
      content index?
    options:
      - "It fetches every chunk in the streams matched by the label selector and brute-force scans them"
      - "It looks up the term 'declined' in a hidden per-line inverted index and returns the matching entries instantly"
      - "It transparently forwards the filter to a co-located Elasticsearch cluster that keeps a full-text mirror of the lines"
      - "It rejects the query with an error because Loki is architecturally incapable of filtering log lines by their content"
    answer: 0
    explanation: |
      With no content index, Loki narrows to streams via the label selector (which uses
      the index) and then fetches and scans the matching chunks for the substring. Fast
      if the selector is narrow, slow if it matches huge volumes of data.
    ref: "concepts.md#grafana-loki-label-based-indexing"

  - id: log-aggregation-and-analysis-026
    difficulty: advanced
    tags: [loki, architecture]
    question: |
      Which Loki component builds chunks, holds recent data in memory, and flushes to
      object storage?
    options:
      - "Distributor, which validates incoming writes and then persists each chunk directly to object storage"
      - "Query-frontend, which caches recent chunks in memory and periodically flushes them to the backing store"
      - "Ingester"
      - "Querier, which assembles chunks in memory from label lookups and writes the flushed result to S3"
    answer: 2
    explanation: |
      The distributor receives and validates writes; the ingester builds chunks, holds
      recent data in memory, and flushes to the object store. Queriers fetch chunks and
      apply filters; the query-frontend splits and parallelizes queries.
    ref: "concepts.md#grafana-loki-label-based-indexing"

  - id: log-aggregation-and-analysis-027
    difficulty: beginner
    tags: [logql, basics]
    question: |
      What must every LogQL query begin with?
    options:
      - "A regular expression that is matched against every stored line before any labels are consulted"
      - "An aggregation function like sum() or rate() wrapping the rest of the expression"
      - "A time range in square brackets, such as [5m], declared before the stream is selected"
      - "A log stream selector (label matchers in curly braces)"
    answer: 3
    explanation: |
      Every LogQL query starts with a log stream selector such as {app="checkout"}.
      This mandatory part uses the index to narrow to streams; line filters and parsers
      are applied afterwards.
    ref: "concepts.md#logql-querying-loki"

  - id: log-aggregation-and-analysis-028
    difficulty: intermediate
    tags: [logql, operators]
    question: |
      In LogQL, what does the `|~` line-filter operator do?
    options:
      - "Regular-expression match against the line"
      - "Exact substring 'contains' match, equivalent to what the |= operator performs on the line"
      - "Parses the line as JSON and promotes its top-level keys into queryable labels"
      - "Formats the output line using a Go template, rewriting the text before it is returned"
    answer: 0
    explanation: |
      Line-filter operators: |= (contains), != (not contains), |~ (regex match), !~
      (regex not match). Parser stages like | json and | logfmt turn the line into
      labels you can filter and format on.
    ref: "concepts.md#logql-querying-loki"

  - id: log-aggregation-and-analysis-029
    difficulty: intermediate
    tags: [logql, metrics]
    question: |
      Which LogQL query computes the per-second rate of error lines over the last 5
      minutes, grouped by pod?
    options:
      - "sum by (pod) (rate({app=\"checkout\"} |= \"error\" [5m]))"
      - "count by (pod) ({app=\"checkout\"} |= \"error\") over the last 5 minutes"
      - "histogram_quantile(0.99, sum by (pod) ({app=\"checkout\"} |= \"error\" [5m]))"
      - "select rate(error) from logs where app = 'checkout' group by pod last 5m"
    answer: 0
    explanation: |
      LogQL mirrors PromQL: rate({...} |= "error" [5m]) gives per-second error rate over
      the window, and sum by (pod) aggregates by pod. This turns logs into a time series
      that graphs next to Prometheus metrics.
    ref: "concepts.md#logql-querying-loki"

  - id: log-aggregation-and-analysis-030
    difficulty: advanced
    tags: [logql, unwrap]
    question: |
      What does the `unwrap` expression enable in a LogQL metric query, as in
      `quantile_over_time(0.99, {app="checkout"} | json | unwrap latency_ms [5m])`?
    options:
      - "It eagerly decompresses the matched chunks into memory before the line filters are applied"
      - "It strips high-cardinality labels off each stream at query time to shrink the working set"
      - "It transpiles the LogQL expression into an equivalent Elasticsearch aggregation for execution"
      - "It extracts a numeric field from the parsed line so you can aggregate it as a value (e.g. a p99 latency)"
    answer: 3
    explanation: |
      unwrap takes a parsed numeric field (here latency_ms) and treats it as the sample
      value, so range aggregations like quantile_over_time or sum_over_time can compute
      metrics directly from log content.
    ref: "concepts.md#logql-querying-loki"

  - id: log-aggregation-and-analysis-031
    difficulty: advanced
    tags: [logql, performance, gotcha]
    question: |
      A LogQL query `{level=~".+"} |= "error"` (no app/namespace selector) is extremely
      slow. What is the root cause and fix?
    options:
      - "The selector matches thousands of streams, forcing Loki to fetch and scan huge volumes of chunks; narrow with high-value labels (app, namespace) first"
      - "The regex label matcher is syntactically invalid and silently disables the index; rewrite it as the exact match level=\"error\""
      - "Loki forbids combining a |= line filter with a regex label matcher, so the query falls back to a full brute-force scan"
      - "The query is missing a histogram_quantile wrapper, so Loki recomputes the result set on every evaluation step"
    answer: 0
    explanation: |
      The label selector is the only part that uses the index. A broad selector matches
      thousands of streams, so the text filter must scan an enormous amount of chunk
      data. Always narrow with high-value labels first, then filter.
    ref: "concepts.md#logql-querying-loki"

  - id: log-aggregation-and-analysis-032
    difficulty: intermediate
    tags: [cardinality, loki]
    question: |
      In Loki, what happens if you put a high-cardinality value like `request_id` into a
      label?
    options:
      - "The index actually shrinks, because request_id values are near-random and compress especially well in the label store"
      - "Loki detects the unbounded label and automatically demotes it into the log line body before indexing the stream"
      - "You get a stream explosion: millions of tiny streams, a bloated index, tiny inefficient chunks, and ingesters can run out of memory"
      - "Queries become faster overall, because each per-request stream holds fewer lines and is quicker to scan"
    answer: 2
    explanation: |
      Each unique label-value combination is a separate stream with its own chunks and
      index entry. An unbounded label like request_id creates a stream explosion —
      millions of tiny streams, bloated index, inefficient chunks, OOMing ingesters.
    ref: "concepts.md#index-cardinality-vs-label-cardinality-cost"

  - id: log-aggregation-and-analysis-033
    difficulty: intermediate
    tags: [cardinality, loki, best-practice]
    question: |
      What is the Loki rule of thumb for what belongs in a label vs the log line?
    options:
      - "Every field should be promoted to a label so the index alone can answer queries without scanning any chunks"
      - "Labels should be low-cardinality, bounded, and known ahead (app, env, level); unbounded/per-event values belong in the log line, extracted at query time"
      - "Only numeric fields should become labels, since strings cannot be matched efficiently in Loki's label index"
      - "Labels should carry the full message text so that a stream selector alone can perform substring searches"
    answer: 1
    explanation: |
      Labels must be low-cardinality and bounded (app, env, namespace, level, region).
      Anything unbounded or per-event (request_id, user_id, raw path) belongs in the log
      line and is parsed at query time with | json, not put in a label.
    ref: "concepts.md#index-cardinality-vs-label-cardinality-cost"

  - id: log-aggregation-and-analysis-034
    difficulty: advanced
    tags: [cardinality, elasticsearch]
    question: |
      What is "mapping explosion" in Elasticsearch and what causes it?
    options:
      - "Too many replica shards being auto-created for one index, exhausting the cluster's shard allocation budget"
      - "A single keyword field trying to store a value larger than the 32 KB Lucene term limit, which aborts the write"
      - "Dynamic mapping of ever-changing JSON keys creates too many fields, degrading cluster performance"
      - "Individual chunks in object storage growing past their size limit and blocking further segment merges"
    answer: 2
    explanation: |
      When dynamic mapping indexes every new JSON key it encounters, an unbounded set of
      keys produces an enormous number of fields (mapping explosion), which degrades
      cluster performance. The fix is disciplined mappings and not indexing fields you
      never search.
    ref: "concepts.md#index-cardinality-vs-label-cardinality-cost"

  - id: log-aggregation-and-analysis-035
    difficulty: intermediate
    tags: [cardinality, comparison]
    question: |
      High-cardinality data causes cost problems in both ELK and Loki, but in different
      places. Where does each pay?
    options:
      - "Both systems defer the entire cost to query time, so cardinality never affects ingest or storage in either one"
      - "Loki: high-cardinality labels cause stream explosion; Elasticsearch: high-cardinality keyword fields / dynamic keys inflate the index and aggregation memory"
      - "Loki pays in a full-text inverted index it maintains per line, while Elasticsearch pays in compressed chunk storage"
      - "Neither backend is affected by cardinality, because both cap the number of distinct field or label values internally"
    answer: 1
    explanation: |
      In Loki the pain is label cardinality -> stream explosion. In Elasticsearch it is
      field/mapping cardinality -> larger index and higher aggregation memory, plus
      mapping explosion from unbounded dynamic keys.
    ref: "concepts.md#index-cardinality-vs-label-cardinality-cost"

  - id: log-aggregation-and-analysis-036
    difficulty: intermediate
    tags: [elk-vs-loki, tradeoff]
    question: |
      Which statement best captures the core ELK-vs-Loki trade-off?
    options:
      - "ELK is strictly superior for every workload, and Loki is a hobby project unsuited to production log volumes"
      - "Loki builds a full-text inverted index over every line, whereas ELK deliberately indexes only a small set of labels"
      - "ELK pays at ingest to make any search fast (full-text index); Loki pays little at ingest and defers work to query time by scanning chunks (label index only)"
      - "Both store their data in an identical on-disk format and differ only in the query UI layered on top"
    answer: 2
    explanation: |
      ELK builds a full-text inverted index at ingest so ad-hoc search is fast but
      storage/compute is high. Loki indexes only labels and stores compressed chunks, so
      ingest/storage is cheap but broad text search means scanning chunks at query time.
    ref: "concepts.md#elk-vs-loki-the-core-trade-off"

  - id: log-aggregation-and-analysis-037
    difficulty: intermediate
    tags: [elk-vs-loki, decision]
    question: |
      For which access pattern is Loki typically the better fit over Elasticsearch?
    options:
      - "Arbitrary exploratory full-text search and relevance-ranked analytics over log content"
      - "Fuzzy matching and complex text aggregations without knowing queries in advance"
      - "Any workload that requires a full-text inverted index over log content to answer unanticipated queries"
      - "Label-scoped grep at high volume where cost dominates and logs should sit next to Prometheus metrics/traces"
    answer: 3
    explanation: |
      Loki shines when you know your labels, volume/cost dominates, and your access is
      label-scoped filter/grep correlated with Prometheus and traces. Choose ELK when
      you need powerful ad-hoc full-text search and analytics over content.
    ref: "concepts.md#elk-vs-loki-the-core-trade-off"

  - id: log-aggregation-and-analysis-038
    difficulty: beginner
    tags: [elk-vs-loki, storage]
    question: |
      Which backend typically relies on cheap object storage (S3/GCS) for the bulk of
      its data, keeping only a small index?
    options:
      - "Elasticsearch"
      - "Grafana Loki"
      - "Both keep everything on local SSD"
      - "Neither uses object storage"
    answer: 1
    explanation: |
      Loki stores compressed chunks in object storage and keeps only a small
      labels->chunks index, which is why it is cheaper to operate. Elasticsearch relies
      on SSD-backed shards and a large inverted index.
    ref: "concepts.md#elk-vs-loki-the-core-trade-off"

  - id: log-aggregation-and-analysis-039
    difficulty: beginner
    tags: [retention, tiering]
    question: |
      In a hot/warm/cold tiering strategy, what characterizes the "hot" tier?
    options:
      - "Rarely queried data parked on the cheapest object storage, kept only to satisfy long-tail retention"
      - "The most recent data on fast SSD/NVMe, fully indexed, with a high query rate"
      - "Data already past its retention window that is queued for deletion but not yet physically purged"
      - "Only compliance and audit logs that must be retained for years to meet regulatory obligations"
    answer: 1
    explanation: |
      The hot tier holds the most recent data on fast storage, fully indexed and
      frequently queried (last hours/days). As data ages it moves to warm (cheaper disk)
      and cold/frozen (object storage), then is deleted after retention.
    ref: "concepts.md#retention--storage-tiering-hot--warm--cold"

  - id: log-aggregation-and-analysis-040
    difficulty: intermediate
    tags: [retention, ilm, elasticsearch]
    question: |
      What does Elasticsearch's Index Lifecycle Management (ILM) do?
    options:
      - "Attaches low-cardinality labels to Loki streams and rewrites their chunk boundaries as data ages"
      - "Compiles PromQL expressions into equivalent LogQL so Prometheus rules can run over Loki streams"
      - "Automatically moves indices through hot/warm/cold/frozen tiers as they age and enforces retention/deletion"
      - "Deduplicates at-least-once log deliveries by hashing each event key before it is written to the index"
    answer: 2
    explanation: |
      ILM automates the lifecycle: it ages indices through tiers (hot -> warm ->
      cold/frozen), can shrink/force-merge and reduce replicas, backs the frozen tier
      with searchable snapshots in object storage, and finally deletes per retention.
    ref: "concepts.md#retention--storage-tiering-hot--warm--cold"

  - id: log-aggregation-and-analysis-041
    difficulty: advanced
    tags: [retention, rollover]
    question: |
      Why does rolling indices by day or size (Elastic "rollover") make retention
      cleanup cheap?
    options:
      - "It compresses each document individually with a stronger codec once the index rolls over"
      - "It disables the inverted index on old indices so their segments no longer consume any heap"
      - "Deleting expired data becomes a whole-index drop instead of expensive per-document deletes"
      - "It converts aged-out indices into Loki-style compressed chunks stored directly in object storage"
    answer: 2
    explanation: |
      With time/size-based rolling indices, an entire day's index can be dropped in one
      cheap operation when it ages out, avoiding costly per-document deletions and the
      merge overhead they cause.
    ref: "concepts.md#retention--storage-tiering-hot--warm--cold"

  - id: log-aggregation-and-analysis-042
    difficulty: intermediate
    tags: [retention, strategy]
    question: |
      A team must keep security/audit logs for several years on a tight budget while
      keeping debug logs queryable for only a few days. What is the sound approach?
    options:
      - "Match tier and retention to each log's query pattern and value: debug hot for days, audit logs in cheap cold/object storage for years"
      - "Keep every log type hot on fully-indexed SSD for the entire multi-year retention period"
      - "Delete all logs uniformly after 24 hours regardless of type, then recover audit data from backups if audited"
      - "Store the long-lived audit logs only in the collector's in-memory buffer and flush debug logs to disk"
    answer: 0
    explanation: |
      Retention is where cost is won or lost. Align tier and retention with each log's
      value and query pattern: short hot retention for debug logs, and long-lived
      audit/security logs parked in cheap cold/object storage (often a legal requirement).
    ref: "concepts.md#retention--storage-tiering-hot--warm--cold"

  - id: log-aggregation-and-analysis-043
    difficulty: intermediate
    tags: [log-based-metrics, definition]
    question: |
      What is a "log-based metric"?
    options:
      - "A metric that counts how many distinct log files currently exist on each host's disk"
      - "A label automatically attached to every log stream to record which service emitted it"
      - "A time series derived from log lines (e.g. counting matching lines or extracting a numeric field) when the signal only exists in logs"
      - "A metric that can only be stored inside an Elasticsearch index and never in a Prometheus TSDB"
    answer: 2
    explanation: |
      A log-based metric derives a time series from logs — counting matching lines or
      extracting a numeric field. It is useful for retrofitting metrics onto legacy apps
      or counting things you did not instrument.
    ref: "concepts.md#log-based-metrics"

  - id: log-aggregation-and-analysis-044
    difficulty: advanced
    tags: [log-based-metrics, tradeoff]
    question: |
      Why are log-based metrics considered a fallback rather than a substitute for real
      instrumentation?
    options:
      - "They cannot be graphed in Grafana because only native Prometheus series render on a dashboard"
      - "They require a full-text inverted index that Loki lacks, so they only work on an Elasticsearch backend"
      - "They can only ever produce gauge values and are architecturally unable to back a monotonic counter"
      - "They are more expensive to compute (you scan logs) and break if the log wording changes"
    answer: 3
    explanation: |
      Deriving a metric from logs means scanning log data to compute it (costly) and
      couples the metric to exact log wording (brittle). Prefer emitting a real
      counter/histogram; use log-based metrics for signals you cannot otherwise get.
    ref: "concepts.md#log-based-metrics"

  - id: log-aggregation-and-analysis-045
    difficulty: intermediate
    tags: [log-based-metrics, tools]
    question: |
      Which tools scrape log files and export Prometheus counters (a Prometheus-side
      approach to log-based metrics)?
    options:
      - "Kibana and Logstash"
      - "mtail and grok_exporter"
      - "Alertmanager and Pushgateway"
      - "Beats and Vector only"
    answer: 1
    explanation: |
      mtail and grok_exporter read log files and expose counters/gauges that Prometheus
      scrapes — a way to turn log events into real metrics on the Prometheus side. Loki
      and OTel pipelines can also emit log-derived metrics.
    ref: "concepts.md#log-based-metrics"

  - id: log-aggregation-and-analysis-046
    difficulty: intermediate
    tags: [correlation, trace-id]
    question: |
      What single practice most enables jumping from a log line straight to the full
      distributed trace for that request?
    options:
      - "Storing every log line uncompressed so the raw bytes can be scanned faster during an incident"
      - "Emitting the trace_id (and span_id) from W3C Trace Context into every structured log line"
      - "Provisioning more replica shards so trace-bearing log queries fan out across additional index copies"
      - "Disabling trace sampling entirely so that a matching span always exists for any log line you open"
    answer: 1
    explanation: |
      Including trace_id/span_id in structured logs lets tools (e.g. Grafana via a Loki
      derived field) link a log line to the trace in Tempo/Jaeger, enabling the
      metric -> logs -> trace drill-down workflow.
    ref: "concepts.md#correlating-logs-with-traces-and-metrics"

  - id: log-aggregation-and-analysis-047
    difficulty: intermediate
    tags: [correlation, labels, lgtm]
    question: |
      In the Grafana "LGTM" stack, what does each letter map to?
    options:
      - "Logstash (logs), Grafana (UI), Telegraf (traces), Metricbeat (metrics)"
      - "Lucene (index), Grok (parser), Timescale (store), Metrics (UI)"
      - "Logs (store), Graphs (UI), Traces (spans), Monitors (alerts)"
      - "Loki (logs), Grafana, Tempo (traces), Mimir (metrics)"
    answer: 3
    explanation: |
      LGTM = Loki (logs) + Grafana (UI) + Tempo (traces) + Mimir (metrics). Consistent
      resource labels (service, namespace, pod, region) across all three signals let you
      pivot between them for the same entity.
    ref: "concepts.md#correlating-logs-with-traces-and-metrics"

  - id: log-aggregation-and-analysis-048
    difficulty: advanced
    tags: [correlation, workflow]
    question: |
      Which workflow does good log aggregation (structured logs + stable labels +
      trace_id) primarily exist to enable?
    options:
      - "Metric alerts -> drill to logs for that service/time -> click trace_id -> see the exact slow span"
      - "Storing logs more cheaply than metrics by compressing them into columnar object-storage segments"
      - "Replacing the metrics and traces pillars entirely so logs become the single signal on-call watches"
      - "Eliminating the need for any query language by rendering all logs as pre-built static dashboards"
    answer: 0
    explanation: |
      Structured logs, consistent labels, and an embedded trace_id turn three silos into
      one navigable graph, so an alert on a metric leads to the relevant logs and then to
      the exact trace/span — the payoff of unified observability.
    ref: "concepts.md#correlating-logs-with-traces-and-metrics"
