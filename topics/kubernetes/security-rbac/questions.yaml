topic: "Authentication, Authorization & RBAC"
domain: kubernetes
topic_slug: security-rbac
version: 1
questions:
  - id: security-rbac-001
    difficulty: beginner
    tags: [pipeline, authn, authz, admission]
    question: |
      In what order does the Kubernetes API server process a request that creates an object?
    options:
      - "Admission → Authentication → Authorization"
      - "Authentication → Admission → Authorization"
      - "Authorization → Authentication → Admission"
      - "Authentication → Authorization → Admission"
    answer: 3
    explanation: |
      Every API request passes through three sequential stages: Authentication (who are you),
      then Authorization (are you allowed), then Admission control (should this specific object
      be allowed/mutated). If any stage rejects, the request stops.
    ref: "concepts.md#the-auth-pipeline-authentication-authorization-admission"

  - id: security-rbac-002
    difficulty: beginner
    tags: [status-codes, authn, authz]
    question: |
      A client presents an expired client certificate to the API server. Which HTTP status
      is returned?
    options:
      - "403 Forbidden"
      - "401 Unauthorized"
      - "404 Not Found"
      - "409 Conflict"
    answer: 1
    explanation: |
      An expired/invalid credential means authentication failed — the API server does not know
      who you are — so it returns 401. A 403 would mean you authenticated fine but authorization
      (RBAC) denied the action.
    ref: "concepts.md#the-auth-pipeline-authentication-authorization-admission"

  - id: security-rbac-003
    difficulty: intermediate
    tags: [status-codes, rbac]
    question: |
      A ServiceAccount's Pod authenticates successfully but gets "403 Forbidden" listing
      Secrets. What does this indicate?
    options:
      - "The ServiceAccount token is expired or malformed and must be reissued"
      - "The API server is unreachable and the request timed out before authorizing"
      - "Authentication succeeded but no RBAC rule grants that verb/resource to the subject"
      - "The requested Secret does not exist, so an empty result was returned"
    answer: 2
    explanation: |
      403 means the request was authenticated (identity established) but authorization denied
      it — no Role/ClusterRole bound to that ServiceAccount grants list/get on secrets in that
      namespace. The fix is an RBAC grant, not a credential fix.
    ref: "concepts.md#the-auth-pipeline-authentication-authorization-admission"

  - id: security-rbac-004
    difficulty: intermediate
    tags: [admission, mutating, validating]
    question: |
      Within admission control, which runs first and can modify the object being submitted?
    options:
      - "Mutating admission webhooks"
      - "Validating admission webhooks"
      - "ResourceQuota enforcement"
      - "The authorization stage"
    answer: 0
    explanation: |
      Mutating admission runs before validating admission and may modify the object (inject a
      sidecar, set defaults). Validating admission then only accepts or rejects; it cannot
      change the object.
    ref: "concepts.md#the-auth-pipeline-authentication-authorization-admission"

  - id: security-rbac-005
    difficulty: beginner
    tags: [authn, identity]
    question: |
      What does a successful Kubernetes authentication step actually establish?
    options:
      - "A concrete set of granted permissions the identity may use"
      - "A matching Role together with the RoleBinding that grants it"
      - "A target namespace and the resource quota applied to it"
      - "A username and a list of group names"
    answer: 3
    explanation: |
      Authentication only produces an identity: a username string and a set of group strings.
      It grants no permissions by itself — authorization (RBAC) later decides what that identity
      may do.
    ref: "concepts.md#authentication-how-the-api-server-identifies-you"

  - id: security-rbac-006
    difficulty: intermediate
    tags: [authn, client-cert]
    question: |
      When authenticating with an X.509 client certificate, how does the API server derive the
      username and groups?
    options:
      - "Common Name (CN) becomes the username; Organization (O) fields become groups"
      - "The certificate serial number becomes the username and the OU field becomes the group"
      - "The Subject Alternative Name becomes the username; the issuer DN becomes the group"
      - "It queries etcd for a User object whose spec matches the certificate fingerprint"
    answer: 0
    explanation: |
      For client certs, the CN is taken as the username and each Organization (O) value becomes
      a group. This is why a cert with O=system:masters yields cluster-admin access.
    ref: "concepts.md#authentication-how-the-api-server-identifies-you"

  - id: security-rbac-007
    difficulty: intermediate
    tags: [authn, oidc, humans]
    question: |
      Which authentication method is recommended for authenticating human users at scale
      without creating per-user certificates?
    options:
      - "A static token file mounted on the API server with one row per user"
      - "OIDC (OpenID Connect) tokens from an external identity provider"
      - "Short-lived bootstrap tokens issued to each human at login time"
      - "A dedicated ServiceAccount created and shared for every human operator"
    answer: 1
    explanation: |
      OIDC lets humans authenticate via an external IdP (Okta, Entra ID, Dex, Google). The API
      server validates the JWT and maps claims to username/groups — no user objects and no
      per-user certs to manage or revoke.
    ref: "concepts.md#authentication-how-the-api-server-identifies-you"

  - id: security-rbac-008
    difficulty: advanced
    tags: [authn, client-cert, revocation]
    question: |
      Why are X.509 client certificates a poor choice for long-lived human access in
      Kubernetes?
    options:
      - "They cannot encode group membership, so every user needs a separate binding"
      - "The API server rejects client certs unless an external PKI plugin is installed"
      - "Kubernetes has no built-in certificate revocation, so a leaked cert is valid until it expires or the CA is rotated"
      - "They only work for ServiceAccounts and are ignored for human user identities"
    answer: 2
    explanation: |
      Kubernetes does not check CRLs/OCSP for client certs, so there is effectively no way to
      revoke a single certificate short of rotating the cluster CA. Prefer short-lived certs or
      OIDC for humans.
    ref: "concepts.md#authentication-how-the-api-server-identifies-you"

  - id: security-rbac-009
    difficulty: beginner
    tags: [users, serviceaccounts, objects]
    question: |
      Which statement about users and ServiceAccounts is correct?
    options:
      - "Both User and ServiceAccount are first-class Kubernetes API objects stored in etcd"
      - "Users are Kubernetes objects while ServiceAccounts are managed by an external IdP"
      - "There is no User object in Kubernetes; ServiceAccount is a real namespaced object"
      - "Neither users nor ServiceAccounts have any representation inside the Kubernetes API"
    answer: 2
    explanation: |
      There is no `kind: User`; human users come from external auth (certs/OIDC) and RBAC just
      references their username/group strings. ServiceAccounts, by contrast, are real
      namespaced API objects intended for in-cluster workloads.
    ref: "concepts.md#users-vs-serviceaccounts"

  - id: security-rbac-010
    difficulty: intermediate
    tags: [serviceaccounts, subjects, naming]
    question: |
      A ServiceAccount named `build-bot` lives in namespace `ci`. What username does RBAC use
      to refer to it?
    options:
      - "ci/build-bot, in namespace-slash-name path form"
      - "build-bot@ci, in name-at-namespace email form"
      - "system:serviceaccount:ci:build-bot"
      - "serviceaccount:build-bot, kind-prefixed bare name"
    answer: 2
    explanation: |
      ServiceAccount identities take the form system:serviceaccount:<namespace>:<name>. That is
      the exact string you would use with --as or match against in bindings.
    ref: "concepts.md#users-vs-serviceaccounts"

  - id: security-rbac-011
    difficulty: intermediate
    tags: [serviceaccounts, default, pods]
    question: |
      A Pod spec does not set `serviceAccountName`. Which ServiceAccount does it use?
    options:
      - "None — the Pod is denied all access to the API server"
      - "The `cluster-admin` ServiceAccount in the kube-system namespace"
      - "The `default` ServiceAccount in the Pod's namespace"
      - "A randomly generated ServiceAccount created per-Pod at admission"
    answer: 2
    explanation: |
      Every namespace has a `default` ServiceAccount, and Pods that don't specify one are
      assigned it. Best practice is to give each workload its own least-privilege SA instead of
      reusing `default`.
    ref: "concepts.md#users-vs-serviceaccounts"

  - id: security-rbac-012
    difficulty: advanced
    tags: [serviceaccounts, groups]
    question: |
      Which group does EVERY ServiceAccount in the cluster belong to?
    options:
      - "system:authenticated only, never a serviceaccount group"
      - "system:nodes"
      - "system:masters"
      - "system:serviceaccounts"
    answer: 3
    explanation: |
      All ServiceAccounts are members of system:serviceaccounts, and those in a given namespace
      also belong to system:serviceaccounts:<namespace>. Binding permissions to
      system:serviceaccounts grants them to every Pod cluster-wide, which is dangerous.
    ref: "concepts.md#users-vs-serviceaccounts"

  - id: security-rbac-013
    difficulty: intermediate
    tags: [serviceaccounts, automount, hardening]
    question: |
      A Pod never calls the Kubernetes API. What setting reduces its attack surface regarding
      the API token?
    options:
      - "automountServiceAccountToken: false"
      - "hostNetwork: true on the Pod spec"
      - "securityContext.privileged: true"
      - "restartPolicy: Never on the Pod"
    answer: 0
    explanation: |
      Setting automountServiceAccountToken: false (on the Pod or the ServiceAccount) stops
      Kubernetes from projecting an API token into the container, so a compromised container
      can't reuse it against the API.
    ref: "concepts.md#users-vs-serviceaccounts"

  - id: security-rbac-014
    difficulty: intermediate
    tags: [tokens, bound-tokens, v1.22]
    question: |
      Since the BoundServiceAccountTokenVolume feature (GA in v1.22), tokens projected into
      Pods are:
    options:
      - "Long-lived, never expiring, and stored as a permanent Secret"
      - "Time-bound, audience-bound, and object-bound (tied to the Pod), auto-rotated"
      - "Stored only in etcd and read via the API, never mounted into the Pod"
      - "Shared across every Pod in the namespace using the same ServiceAccount"
    answer: 1
    explanation: |
      Bound tokens are issued via the TokenRequest API and are time-bound (expire, auto-rotated
      by the kubelet), audience-bound, and object-bound to the Pod — deleting the Pod
      invalidates the token. This is far safer than the old non-expiring Secret tokens.
    ref: "concepts.md#serviceaccount-tokens-bound-tokens--projection"

  - id: security-rbac-015
    difficulty: advanced
    tags: [tokens, v1.24, secrets]
    question: |
      You run `kubectl create serviceaccount build-bot` on a v1.24+ cluster and expect an
      associated token Secret. Why is there none?
    options:
      - "Since v1.24 Kubernetes no longer auto-generates token Secrets for ServiceAccounts"
      - "You lack the RBAC permission needed to list or view Secrets in that namespace"
      - "The token Secret is created lazily only after the first Pod mounts the ServiceAccount"
      - "Token Secrets were removed entirely in v1.24 and can no longer be created at all"
    answer: 0
    explanation: |
      The LegacyServiceAccountTokenNoAutoGeneration change (v1.24) stopped auto-creating token
      Secrets on SA creation. Use `kubectl create token` for a short-lived token, or explicitly
      create a `kubernetes.io/service-account-token` Secret for a long-lived one.
    ref: "concepts.md#serviceaccount-tokens-bound-tokens--projection"

  - id: security-rbac-016
    difficulty: intermediate
    tags: [tokens, tokenrequest, kubectl]
    question: |
      Which command returns a short-lived bound token for a ServiceAccount via the TokenRequest
      API?
    options:
      - "kubectl get secret build-bot-token -o jsonpath='{.data.token}'"
      - "kubectl auth reconcile"
      - "kubectl describe sa build-bot"
      - "kubectl create token build-bot -n ci"
    answer: 3
    explanation: |
      `kubectl create token <sa>` calls the TokenRequest API and returns a short-lived,
      audience-scoped token. It can optionally be bound to an object with
      --bound-object-kind/--bound-object-name so it dies with that object.
    ref: "concepts.md#serviceaccount-tokens-bound-tokens--projection"

  - id: security-rbac-017
    difficulty: advanced
    tags: [tokens, long-lived, secret]
    question: |
      A legacy CI tool cannot refresh tokens and needs a non-expiring one. What is the correct
      way to obtain it on a modern cluster?
    options:
      - "It's impossible; every token on a modern cluster is short-lived and expires"
      - "Create a Secret of type kubernetes.io/service-account-token annotated with the SA name, and let the token controller populate it"
      - "Set automountServiceAccountToken: never so the projected token stops rotating"
      - "Bind the SA to cluster-admin, which switches it back to a non-expiring token"
    answer: 1
    explanation: |
      You must explicitly create a `kubernetes.io/service-account-token` Secret with the
      `kubernetes.io/service-account.name` annotation; the token controller fills in a
      long-lived token. This is discouraged (bigger blast radius) but supported for legacy
      consumers.
    ref: "concepts.md#serviceaccount-tokens-bound-tokens--projection"

  - id: security-rbac-018
    difficulty: intermediate
    tags: [tokens, projection, mount-path]
    question: |
      Inside a Pod, at what path is the projected ServiceAccount token conventionally mounted?
    options:
      - "/etc/kubernetes/serviceaccount/token, beside the kubelet config"
      - "/tmp/sa-token, in an emptyDir the kubelet refreshes each hour"
      - "/root/.kube/config, as an inline token entry per container"
      - "/var/run/secrets/kubernetes.io/serviceaccount/token"
    answer: 3
    explanation: |
      The projected volume mounts token, ca.crt, and namespace under
      /var/run/secrets/kubernetes.io/serviceaccount/. In-cluster client libraries read the token
      from there automatically.
    ref: "concepts.md#serviceaccount-tokens-bound-tokens--projection"

  - id: security-rbac-019
    difficulty: advanced
    tags: [irsa, workload-identity, cloud]
    question: |
      With AWS IRSA (IAM Roles for ServiceAccounts), how does a Pod obtain temporary AWS
      credentials without static access keys?
    options:
      - "The kubelet reads static AWS access keys from a mounted Secret and injects them as environment variables into the Pod"
      - "The Pod's projected OIDC ServiceAccount token is exchanged via AssumeRoleWithWebIdentity for temporary credentials"
      - "The node's EC2 instance profile credentials are automatically copied into each Pod's metadata endpoint at scheduling time"
      - "Kubernetes signs each outbound AWS API request directly with the cluster CA private key, which IAM validates as trusted"
    answer: 1
    explanation: |
      The cluster acts as an OIDC provider; the Pod's projected SA token is a signed JWT that
      AWS IAM trusts. The SDK calls AssumeRoleWithWebIdentity to swap it for short-lived
      credentials for the role annotated on the ServiceAccount. No long-lived keys live in the
      cluster.
    ref: "concepts.md#workload-identity-for-cloud-irsa--workload-identity"

  - id: security-rbac-020
    difficulty: intermediate
    tags: [irsa, annotation, serviceaccount]
    question: |
      In IRSA, where do you specify which IAM role a workload should assume?
    options:
      - "An annotation on the ServiceAccount (eks.amazonaws.com/role-arn)"
      - "A label on the Pod template (eks.amazonaws.com/role) that the kubelet reads at admission"
      - "The container image tag, which the AWS SDK parses at startup to select the IAM role to assume"
      - "A roleArn field inside the RoleBinding that references both the ServiceAccount and the IAM role"
    answer: 0
    explanation: |
      You annotate the ServiceAccount with eks.amazonaws.com/role-arn. Pods using that SA get a
      projected token federated to that IAM role. GKE/AKS Workload Identity follow the same
      OIDC-federation pattern.
    ref: "concepts.md#workload-identity-for-cloud-irsa--workload-identity"

  - id: security-rbac-021
    difficulty: beginner
    tags: [rbac, deny-by-default]
    question: |
      Under Kubernetes RBAC, what happens to an action for which no Role/ClusterRole grants
      permission?
    options:
      - "It is denied (deny-by-default)"
      - "It is allowed by default"
      - "It is allowed for authenticated users"
      - "It triggers an admission webhook"
    answer: 0
    explanation: |
      RBAC is deny-by-default: nothing is permitted unless explicitly granted by a
      Role/ClusterRole bound to the subject. Absence of a grant means the request is denied.
    ref: "concepts.md#authorization-modes--why-rbac-is-deny-by-default"

  - id: security-rbac-022
    difficulty: intermediate
    tags: [rbac, additive, no-deny]
    question: |
      A team wants to "deny" a specific user from deleting Pods while keeping their other
      access. What is true about doing this in pure RBAC?
    options:
      - "Add a Role rule listing the verb 'deny' on the pods resource so the API server blocks that user's deletes"
      - "Use a ClusterRole with a denyVerbs list that takes precedence over any matching allow grant"
      - "Set a negative priority value on the RoleBinding so it overrides the user's other allow bindings"
      - "RBAC has no deny rules; you can only grant, so you must remove/narrow the offending grant"
    answer: 3
    explanation: |
      RBAC permissions are purely additive — there are no deny rules. To take away access you
      remove or narrow the grant that provides it (or use a separate authorizer/admission
      webhook for deny semantics).
    ref: "concepts.md#authorization-modes--why-rbac-is-deny-by-default"

  - id: security-rbac-023
    difficulty: advanced
    tags: [authz-modes, node-authorizer]
    question: |
      Which authorization mode restricts each kubelet to only read/modify the objects related
      to its own node's Pods?
    options:
      - "Webhook"
      - "ABAC"
      - "Node"
      - "AlwaysAllow"
    answer: 2
    explanation: |
      The Node authorizer special-cases kubelet identities (group system:nodes) so a node can
      only access the Secrets, ConfigMaps, Pods, etc. bound to workloads scheduled on it —
      limiting the blast radius of a compromised node.
    ref: "concepts.md#authorization-modes--why-rbac-is-deny-by-default"

  - id: security-rbac-024
    difficulty: advanced
    tags: [authz-modes, combining]
    question: |
      With multiple authorizers configured, when is a request ultimately allowed?
    options:
      - "Only if every configured authorizer independently returns an explicit Allow for the request"
      - "If any authorizer explicitly allows it; if all return NoOpinion it is denied"
      - "Whenever the RBAC authorizer returns NoOpinion, the request falls through and is permitted"
      - "Only if the Webhook authorizer allows it, since it is always consulted last and wins"
    answer: 1
    explanation: |
      Authorizers can Allow, Deny, or return NoOpinion. An explicit Allow from any authorizer
      permits the request; if all return NoOpinion, the request is denied by default.
    ref: "concepts.md#authorization-modes--why-rbac-is-deny-by-default"

  - id: security-rbac-025
    difficulty: beginner
    tags: [role, permissions, verbs]
    question: |
      What three things does an RBAC rule fundamentally combine?
    options:
      - "namespaces, labels, and annotations"
      - "subjects, roleRef, and namespace"
      - "apiGroups, resources, and verbs"
      - "users, groups, and tokens"
    answer: 2
    explanation: |
      A rule specifies apiGroups (which API group), resources (which resource types), and verbs
      (which actions like get/list/create/delete). Optional fields include resourceNames and
      nonResourceURLs.
    ref: "concepts.md#role-and-clusterrole--permissions-verbs-on-resources"

  - id: security-rbac-026
    difficulty: intermediate
    tags: [role, core-group, apigroups]
    question: |
      In an RBAC rule, what does `apiGroups: [""]` (empty string) refer to?
    options:
      - "Every registered API group at once, equivalent to writing an explicit wildcard asterisk"
      - "No API group at all — the empty string is a validation error the API server rejects on apply"
      - "The core/legacy API group (pods, services, configmaps, secrets, ...)"
      - "The rbac.authorization.k8s.io group that holds Role and RoleBinding resource definitions"
    answer: 2
    explanation: |
      The empty string denotes the core (legacy) API group, which contains pods, services,
      configmaps, secrets, nodes, etc. Named groups like apps or batch are specified explicitly.
    ref: "concepts.md#role-and-clusterrole--permissions-verbs-on-resources"

  - id: security-rbac-027
    difficulty: advanced
    tags: [role, resourcenames, limitations]
    question: |
      A rule uses `resourceNames: ["app-config"]`. Which verb will it FAIL to restrict to that
      single object?
    options:
      - "get"
      - "update"
      - "list"
      - "patch"
    answer: 2
    explanation: |
      resourceNames restricts rules that operate on named objects (get, update, patch, delete).
      It cannot restrict list, watch, create, or deletecollection, which operate on the
      collection rather than a specific named instance.
    ref: "concepts.md#role-and-clusterrole--permissions-verbs-on-resources"

  - id: security-rbac-028
    difficulty: advanced
    tags: [clusterrole, nonresourceurls]
    question: |
      You want to grant access to the non-resource endpoint `/healthz`. Which object type can
      express this?
    options:
      - "A Role, using a namespaced nonResourceURLs rule scoped to the endpoint's owning namespace"
      - "An annotation on the ServiceAccount listing the allowed non-resource paths for that identity"
      - "A RoleBinding, by placing the /healthz path directly in the binding's roleRef field"
      - "A ClusterRole (non-resource URLs are not namespaced)"
    answer: 3
    explanation: |
      nonResourceURLs (like /healthz, /metrics) are cluster-level endpoints that aren't
      namespaced, so they can only be granted via a ClusterRole. The '*' in a non-resource URL
      is a suffix wildcard.
    ref: "concepts.md#role-and-clusterrole--permissions-verbs-on-resources"

  - id: security-rbac-029
    difficulty: intermediate
    tags: [role, subresource, pods-log]
    question: |
      Which resource entry in a Role grants access to read a Pod's logs?
    options:
      - "resources: [\"logs\"]"
      - "resources: [\"pods/log\"]"
      - "resources: [\"pod-logs\"]"
      - "verbs: [\"log\"]"
    answer: 1
    explanation: |
      Pod logs are a subresource expressed as pods/log. Similarly pods/exec grants exec and
      pods/portforward grants port-forwarding. You still need the appropriate verb (e.g. get).
    ref: "concepts.md#role-and-clusterrole--permissions-verbs-on-resources"

  - id: security-rbac-030
    difficulty: beginner
    tags: [binding, subjects, roleref]
    question: |
      What is the purpose of a RoleBinding (or ClusterRoleBinding)?
    options:
      - "It grants a Role/ClusterRole's permissions to subjects (users, groups, ServiceAccounts)"
      - "It defines a reusable set of verb-on-resource permissions that subjects can later reference"
      - "It creates the ServiceAccount object and issues the projected token the subjects will use"
      - "It enforces network policy by restricting which pods a bound subject may connect to"
    answer: 0
    explanation: |
      A Role/ClusterRole only defines permissions; it grants nothing until a binding attaches it
      (via roleRef) to subjects. The binding is what actually confers access.
    ref: "concepts.md#rolebinding-and-clusterrolebinding--granting-to-subjects"

  - id: security-rbac-031
    difficulty: intermediate
    tags: [binding, serviceaccount-subject, yaml]
    question: |
      When listing a ServiceAccount as a subject in a RoleBinding, which is correct?
    options:
      - "kind: ServiceAccount with an apiGroup: rbac.authorization.k8s.io field alongside name and namespace"
      - "kind: Group whose name is the SA's namespace, since all SAs in a namespace share one group subject"
      - "kind: User with the SA name, letting RBAC treat the ServiceAccount as an ordinary human identity"
      - "kind: ServiceAccount with a name and namespace, and NO apiGroup"
    answer: 3
    explanation: |
      ServiceAccount subjects use kind: ServiceAccount plus name and namespace, and do NOT set
      apiGroup (they're in the core group). Only User and Group subjects use
      apiGroup: rbac.authorization.k8s.io.
    ref: "concepts.md#rolebinding-and-clusterrolebinding--granting-to-subjects"

  - id: security-rbac-032
    difficulty: advanced
    tags: [binding, roleref, immutable]
    question: |
      You need to point an existing RoleBinding at a different Role. What must you do?
    options:
      - "kubectl edit the binding and change the roleRef field in place, then re-apply the manifest"
      - "roleRef is immutable — delete and recreate the binding"
      - "Add a second roleRef entry so the binding references both the old and the new Role at once"
      - "Patch the referenced ClusterRole instead so it points the binding at the new rule set"
    answer: 1
    explanation: |
      A binding's roleRef is immutable after creation. To change which Role/ClusterRole it
      references you must delete the binding and create a new one. Subjects, however, can be
      edited.
    ref: "concepts.md#rolebinding-and-clusterrolebinding--granting-to-subjects"

  - id: security-rbac-033
    difficulty: intermediate
    tags: [scope, rolebinding, clusterrole]
    question: |
      A RoleBinding in namespace `dev` references the ClusterRole `secret-reader`. What is the
      effective scope of the granted permission?
    options:
      - "All namespaces in the cluster"
      - "The kube-system namespace"
      - "Only cluster-scoped resources"
      - "Only namespace `dev`"
    answer: 3
    explanation: |
      A RoleBinding referencing a ClusterRole grants the ClusterRole's permissions ONLY within
      the RoleBinding's own namespace. This lets you define a common role once and reuse it
      per-namespace.
    ref: "concepts.md#namespaced-vs-cluster-wide-scope"

  - id: security-rbac-034
    difficulty: advanced
    tags: [scope, nodes, cluster-scoped]
    question: |
      You created a ClusterRole granting `list` on `nodes` and bound it with a RoleBinding in
      namespace `dev`, but the user still can't list nodes. Why?
    options:
      - "Nodes require a special node bootstrap token that RoleBindings cannot issue to a normal user"
      - "Nodes are cluster-scoped; a namespaced RoleBinding cannot grant access to them — you need a ClusterRoleBinding"
      - "The ClusterRole must be named 'node-reader' for the built-in node authorizer to honor its rules"
      - "list is not a valid verb for the nodes resource; you must instead grant the watch verb here"
    answer: 1
    explanation: |
      Nodes are cluster-scoped resources. A RoleBinding (namespaced) can only grant access to
      namespaced resources within its namespace, even when it references a ClusterRole. Cluster
      resources need a ClusterRoleBinding.
    ref: "concepts.md#namespaced-vs-cluster-wide-scope"

  - id: security-rbac-035
    difficulty: intermediate
    tags: [scope, clusterrolebinding]
    question: |
      What is the effective scope of a ClusterRoleBinding that references `cluster-admin`?
    options:
      - "Only the single namespace named in the binding's metadata, ignoring all other namespaces"
      - "Read-only visibility across the whole cluster, but no create, update, or delete permissions"
      - "Full control over the entire cluster (all namespaces and cluster-scoped resources)"
      - "Only cluster-scoped resources like nodes and PVs, but never any namespaced objects"
    answer: 2
    explanation: |
      A ClusterRoleBinding applies cluster-wide. Bound to cluster-admin it grants unrestricted
      super-user access to every resource in every namespace plus cluster-scoped resources — use
      it only for genuine operators.
    ref: "concepts.md#namespaced-vs-cluster-wide-scope"

  - id: security-rbac-036
    difficulty: advanced
    tags: [aggregation, clusterrole]
    question: |
      How does an aggregated ClusterRole obtain its rules?
    options:
      - "The RBAC controller merges rules from all ClusterRoles matching the aggregationRule's label selectors"
      - "You write them directly in the rules field, and the aggregationRule simply documents their origin"
      - "It automatically inherits the full rule set of cluster-admin and then subtracts denied verbs"
      - "The kubelet populates the rules on each node at join time from its local authorization config"
    answer: 0
    explanation: |
      An aggregated ClusterRole leaves rules empty and defines an aggregationRule with
      clusterRoleSelectors. The controller watches for matching-labeled ClusterRoles and merges
      their rules in. This is how add-ons extend built-in roles like edit/view.
    ref: "concepts.md#aggregated-clusterroles--default-roles"

  - id: security-rbac-037
    difficulty: intermediate
    tags: [default-roles, view, secrets]
    question: |
      Which is true of the default `view` ClusterRole?
    options:
      - "It grants read/write to most objects including Secrets"
      - "It is functionally equivalent to the cluster-admin role"
      - "It can create and manage Roles and RoleBindings"
      - "Read-only access to most objects, but it cannot read Secrets"
    answer: 3
    explanation: |
      view is read-only over most namespaced objects but deliberately excludes Secrets (and
      roles/rolebindings) to avoid leaking credentials to read-only users.
    ref: "concepts.md#aggregated-clusterroles--default-roles"

  - id: security-rbac-038
    difficulty: advanced
    tags: [default-roles, edit, admin]
    question: |
      What is the key difference between the default `edit` and `admin` ClusterRoles?
    options:
      - "edit is strictly read-only while admin is the only one of the two that permits any write operations"
      - "edit can read/write most objects but cannot manage Roles/RoleBindings; admin can manage roles/rolebindings within the namespace"
      - "admin is a cluster-scoped role bound cluster-wide, whereas edit is only ever usable within a single namespace"
      - "There is no functional difference; edit and admin are two aliases for the same underlying rule set"
    answer: 1
    explanation: |
      Both allow read/write to most namespaced objects, but admin additionally allows managing
      Roles and RoleBindings within the namespace, whereas edit cannot touch RBAC objects. admin
      is meant to be bound per-namespace via a RoleBinding.
    ref: "concepts.md#aggregated-clusterroles--default-roles"

  - id: security-rbac-039
    difficulty: intermediate
    tags: [least-privilege, namespace-admin]
    question: |
      You want a team to have full control within their namespace `team-a` but nowhere else.
      What is the best approach?
    options:
      - "A ClusterRoleBinding to cluster-admin, then rely on team members self-policing other namespaces"
      - "Issue each member a client cert with O=system:masters and trust them to stay within team-a"
      - "A ClusterRoleBinding to the `edit` ClusterRole so they can write objects in every namespace"
      - "RoleBinding in team-a referencing the built-in `admin` ClusterRole"
    answer: 3
    explanation: |
      Binding the admin ClusterRole with a RoleBinding scoped to team-a gives full namespace
      control (including managing roles there) without any access to other namespaces or cluster
      resources — a clean least-privilege pattern.
    ref: "concepts.md#least-privilege--avoiding-cluster-admin"

  - id: security-rbac-040
    difficulty: advanced
    tags: [least-privilege, escalation, escalate-verb]
    question: |
      Why can a namespace admin normally NOT create a Role granting permissions they don't
      already hold?
    options:
      - "Roles cannot reference verbs the creator lacks unless they hold the 'escalate' verb — this is RBAC's privilege-escalation prevention"
      - "The API server rejects all Role creation attempts unless the caller is a member of system:masters"
      - "Role objects are immutable after creation, so their rules can never be expanded beyond the initial apply"
      - "Only ServiceAccounts, never human users, are permitted to create Role objects in a namespace"
    answer: 0
    explanation: |
      RBAC prevents privilege escalation: to create/update a Role with rules beyond your own you
      must already hold those permissions or the special 'escalate' verb on roles. This stops a
      namespace admin from bootstrapping themselves to cluster-admin.
    ref: "concepts.md#least-privilege--avoiding-cluster-admin"

  - id: security-rbac-041
    difficulty: advanced
    tags: [least-privilege, bind-verb]
    question: |
      Creating a RoleBinding that references a role granting more than you currently have
      requires which special verb?
    options:
      - "escalate"
      - "impersonate"
      - "bind"
      - "use"
    answer: 2
    explanation: |
      The 'bind' verb permits creating bindings to roles whose permissions exceed your own
      (subject to policy). This, like 'escalate', is a guardrail against privilege escalation and
      should be reserved for trusted operators.
    ref: "concepts.md#least-privilege--avoiding-cluster-admin"

  - id: security-rbac-042
    difficulty: advanced
    tags: [least-privilege, transitive-escalation, exec]
    question: |
      Which permission most directly enables transitive privilege escalation to another
      workload's identity?
    options:
      - "get on configmaps, which lets you read another workload's config and reuse its identity strings"
      - "The ability to create Pods with an arbitrary serviceAccountName, gaining that SA's permissions"
      - "list on namespaces, which exposes every namespace name and lets you enumerate their bound roles"
      - "watch on events, which streams other pods' lifecycle activity and thereby leaks their credentials"
    answer: 1
    explanation: |
      If you can create a Pod (or a controller that does) with any ServiceAccount, you can run
      code as that SA and inherit its permissions. That's why create-pods plus a powerful SA in
      the namespace is effectively an escalation path — as is pods/exec into an existing Pod.
    ref: "concepts.md#least-privilege--avoiding-cluster-admin"

  - id: security-rbac-043
    difficulty: intermediate
    tags: [can-i, auditing]
    question: |
      Which command lists every action YOU are permitted to perform in namespace `dev`?
    options:
      - "kubectl auth can-i --list -n dev"
      - "kubectl get roles -n dev"
      - "kubectl describe clusterrole cluster-admin"
      - "kubectl auth whoami -n dev"
    answer: 0
    explanation: |
      `kubectl auth can-i --list -n dev` enumerates your effective permissions in that namespace
      via the SelfSubjectRulesReview API — the fastest way to audit what an identity can do.
    ref: "concepts.md#checking-access-kubectl-auth-can-i--impersonation"

  - id: security-rbac-044
    difficulty: intermediate
    tags: [can-i, impersonation, debugging]
    question: |
      An admin wants to check whether the ServiceAccount `ci:build-bot` can list Secrets in
      `dev`. Which command does this?
    options:
      - "kubectl auth can-i list secrets -n dev --as=system:serviceaccount:ci:build-bot"
      - "kubectl get secrets -n dev --sa build-bot"
      - "kubectl auth can-i list secrets --serviceaccount build-bot"
      - "kubectl describe sa build-bot -n ci"
    answer: 0
    explanation: |
      Using --as with the SA's username (system:serviceaccount:ci:build-bot) impersonates it and
      returns yes/no. Impersonation itself requires the 'impersonate' verb, which admins
      typically hold for debugging.
    ref: "concepts.md#checking-access-kubectl-auth-can-i--impersonation"

  - id: security-rbac-045
    difficulty: advanced
    tags: [impersonation, impersonate-verb]
    question: |
      Using `kubectl --as=jane@corp.com` to run a command as another user requires the caller to
      hold which verb?
    options:
      - "escalate on roles (and on clusterroles, for cluster-wide user impersonation)"
      - "use on podsecuritypolicies (and on securitycontextconstraints, for the target user)"
      - "bind on rolebindings (and on clusterrolebindings, when the user is cluster-scoped)"
      - "impersonate on users (and groups, for --as-group)"
    answer: 3
    explanation: |
      User impersonation requires the 'impersonate' verb on the users resource (and on groups for
      --as-group, serviceaccounts for SA impersonation). It's powerful — anyone with it can act
      as any user — so grant it sparingly.
    ref: "concepts.md#checking-access-kubectl-auth-can-i--impersonation"

  - id: security-rbac-046
    difficulty: intermediate
    tags: [can-i, cluster-admin-check]
    question: |
      Which command quickly tells you whether your current identity effectively has
      cluster-admin?
    options:
      - "kubectl auth can-i '*' '*'"
      - "kubectl get clusterrolebindings --all-namespaces -o wide"
      - "kubectl cluster-info dump --output-directory=/tmp/ci"
      - "kubectl auth whoami --show-effective-permissions"
    answer: 0
    explanation: |
      `kubectl auth can-i '*' '*'` asks whether you can perform every verb on every resource; a
      'yes' means you have (or are effectively) cluster-admin. It's a handy one-line privilege
      check.
    ref: "concepts.md#checking-access-kubectl-auth-can-i--impersonation"

  - id: security-rbac-047
    difficulty: advanced
    tags: [built-in-groups, system-authenticated, danger]
    question: |
      Why is binding a broad ClusterRole to the group `system:authenticated` dangerous?
    options:
      - "It only affects anonymous users in the system:unauthenticated virtual group, not real accounts"
      - "It grants the permission to every successfully-authenticated identity, including every ServiceAccount"
      - "It disables authentication entirely, letting requests reach the API server without any credentials"
      - "It has no effect at all, because system:authenticated is a virtual group with no members bound to it"
    answer: 1
    explanation: |
      system:authenticated is added to every request that authenticates at all — including all
      ServiceAccounts and every user. Granting it broad permissions effectively hands those
      permissions to the entire cluster.
    ref: "concepts.md#built-in-groups-anonymous-systemauthenticated-systemmasters"

  - id: security-rbac-048
    difficulty: advanced
    tags: [built-in-groups, system-masters]
    question: |
      What is special about a client certificate presented with Organization `O=system:masters`?
    options:
      - "It is rejected by the API server unless a matching User object exists in etcd first"
      - "It only grants read-only access, since the masters group maps to the built-in view role"
      - "It maps to the system:masters group, which is bound to cluster-admin and bypasses RBAC scoping — full unrestricted access"
      - "It requires an additional OIDC bearer token to be presented alongside it before access is granted"
    answer: 2
    explanation: |
      system:masters is hard-bound to cluster-admin via a default ClusterRoleBinding and is not
      subject to privilege-escalation checks. A cert in that org is full super-user, which is why
      membership must be tightly controlled.
    ref: "concepts.md#built-in-groups-anonymous-systemauthenticated-systemmasters"

  - id: security-rbac-049
    difficulty: intermediate
    tags: [built-in-groups, anonymous]
    question: |
      When anonymous authentication is enabled, an unauthenticated request is treated as which
      identity?
    options:
      - "user system:masters bound directly to the cluster-admin ClusterRole"
      - "the namespace's default ServiceAccount, using its projected bound token"
      - "user system:anonymous in group system:unauthenticated"
      - "user system:node in the built-in system:nodes authorizer group"
    answer: 2
    explanation: |
      Anonymous requests are assigned the username system:anonymous and group
      system:unauthenticated. By default they only get a tiny discovery allowlist; you should
      never bind meaningful permissions to that group.
    ref: "concepts.md#built-in-groups-anonymous-systemauthenticated-systemmasters"

  - id: security-rbac-050
    difficulty: intermediate
    tags: [scenario, binding, yaml]
    question: |
      Given this manifest, what can the ServiceAccount `ci:build-bot` do?

      kind: RoleBinding
      metadata: {name: b, namespace: prod}
      subjects:
      - kind: ServiceAccount
        name: build-bot
        namespace: ci
      roleRef:
        kind: ClusterRole
        name: view
        apiGroup: rbac.authorization.k8s.io
    options:
      - "Read-only access to most objects across all namespaces"
      - "Nothing — a RoleBinding cannot reference a cross-namespace ServiceAccount"
      - "Full admin over all objects in namespace ci, since that is where the ServiceAccount lives"
      - "Read-only access to most objects (excluding Secrets) only in namespace prod"
    answer: 3
    explanation: |
      A RoleBinding referencing the view ClusterRole grants view's permissions only within the
      binding's namespace (prod). view is read-only and excludes Secrets. The SA may live in a
      different namespace (ci) and still be a valid subject.
    ref: "concepts.md#namespaced-vs-cluster-wide-scope"

  - id: security-rbac-051
    difficulty: advanced
    tags: [scenario, wildcards, hardening]
    question: |
      A ClusterRole has `apiGroups: ["*"]`, `resources: ["*"]`, `verbs: ["*"]` and is bound
      cluster-wide. What's the main concern beyond it being broad today?
    options:
      - "It only ever applies to the resource types registered when the ClusterRole was first created"
      - "It silently expands to any new resource types (including future CRDs) added later"
      - "Wildcards are silently ignored by RBAC, so the rule actually grants no permissions in practice"
      - "It disables admission control for any request that the wildcard rule happens to authorize"
    answer: 1
    explanation: |
      Wildcard rules grant everything in scope, and because they aren't enumerated they
      automatically cover any resource types added later (new CRDs, new API groups). This makes
      the true blast radius grow over time — enumerate the resources you actually need.
    ref: "concepts.md#least-privilege--avoiding-cluster-admin"

  - id: security-rbac-052
    difficulty: intermediate
    tags: [scenario, subjects, group-vs-sa]
    question: |
      In a RoleBinding subject list you see `kind: Group, name: dev-team,
      apiGroup: rbac.authorization.k8s.io`. Where does the group `dev-team` come from?
    options:
      - "From the authenticator — e.g. a cert Organization (O) value or an OIDC groups claim"
      - "From a Group object created with kubectl and persisted as a first-class resource in etcd"
      - "It is auto-created for every namespace, mirroring the namespace name as a group string"
      - "From the ServiceAccount's annotations, which the RBAC controller reads to build group membership"
    answer: 0
    explanation: |
      Groups are not Kubernetes objects; they are strings supplied by the authentication layer
      (cert O fields, OIDC groups claim, etc.). RBAC simply matches the group name a request
      carries against binding subjects.
    ref: "concepts.md#users-vs-serviceaccounts"

  - id: security-rbac-053
    difficulty: beginner
    tags: [rbac, api-version]
    question: |
      Which apiVersion do stable Role/ClusterRole/RoleBinding/ClusterRoleBinding objects use?
    options:
      - "v1, the core API group that also holds pods and services"
      - "apps/v1, shared with Deployments, StatefulSets, and DaemonSets"
      - "authorization.k8s.io/v1, the group behind SubjectAccessReview"
      - "rbac.authorization.k8s.io/v1"
    answer: 3
    explanation: |
      RBAC objects are in the rbac.authorization.k8s.io API group, stable at v1. The
      authorization.k8s.io group (without 'rbac') holds the SubjectAccessReview APIs used by
      kubectl auth can-i.
    ref: "concepts.md#role-and-clusterrole--permissions-verbs-on-resources"
