topic: "Storage: Volumes, PV, PVC & StorageClasses"
domain: kubernetes
topic_slug: storage-volumes-pv-pvc
version: 1
questions:
  - id: storage-volumes-pv-pvc-001
    difficulty: beginner
    tags: [writable-layer, ephemeral, persistence]
    question: |
      A container writes a file to /tmp/data (a path not backed by any volume).
      The pod is then deleted and rescheduled to another node. What happens to
      the file?
    options:
      - "It is preserved and reappears on the new node automatically"
      - "It is lost — it lived in the container's ephemeral writable layer"
      - "It is committed back into the container image"
      - "It is moved to the node's /var/lib/kubelet directory permanently"
    answer: 1
    explanation: |
      Writes to a path with no volume land in the container's writable layer, which
      is destroyed when the container/pod goes away. Only PV-backed storage survives
      pod deletion and rescheduling.
    ref: "concepts.md#the-ephemeral-container-filesystem-problem"

  - id: storage-volumes-pv-pvc-002
    difficulty: beginner
    tags: [emptydir, lifetime, restart]
    question: |
      Which statement about an emptyDir volume is correct?
    options:
      - "It survives pod deletion but not container restart"
      - "It is durable cluster storage that survives node failure"
      - "It is automatically backed by a PersistentVolume"
      - "It survives container restart but is wiped when the pod is removed from the node"
    answer: 3
    explanation: |
      emptyDir is tied to the pod's lifetime: it survives container crashes/restarts
      (the pod stays) but is deleted permanently when the pod is removed from the node.
      It is not durable across rescheduling.
    ref: "concepts.md#emptydir"

  - id: storage-volumes-pv-pvc-003
    difficulty: beginner
    tags: [pv, pvc, definitions]
    question: |
      In the PV/PVC model, what does a PersistentVolumeClaim (PVC) represent?
    options:
      - "A piece of physical storage that exists in the cluster"
      - "A user's namespaced request/claim for storage of a given size and access mode"
      - "The CSI driver that provisions volumes"
      - "A cluster-scoped snapshot of a volume"
    answer: 1
    explanation: |
      A PVC is a namespaced request ('demand') for storage. A PV is the actual storage
      ('supply'). Binding matches a PVC to a PV 1:1. Pods reference the claim, not the PV.
    ref: "concepts.md#the-pv--pvc-abstraction"

  - id: storage-volumes-pv-pvc-004
    difficulty: beginner
    tags: [pv, scope, definitions]
    question: |
      Which of these is true about PersistentVolume and PersistentVolumeClaim scope?
    options:
      - "Both are namespaced"
      - "PV is namespaced; PVC is cluster-scoped"
      - "Both are cluster-scoped"
      - "PV is cluster-scoped; PVC is namespaced"
    answer: 3
    explanation: |
      A PersistentVolume is a cluster-scoped resource representing storage; a PVC is a
      namespaced request created by workloads within a namespace.
    ref: "concepts.md#the-pv--pvc-abstraction"

  - id: storage-volumes-pv-pvc-005
    difficulty: intermediate
    tags: [emptydir, memory, oomkilled]
    question: |
      You set an emptyDir volume with medium: Memory and write several gigabytes to it.
      The pod is suddenly OOMKilled even though the app's heap looks small. Why?
    options:
      - "emptyDir with medium: Memory triggers eviction only, never OOMKill"
      - "Memory-backed emptyDir is a tmpfs whose bytes count against the container's memory limit"
      - "The kubelet always kills pods that use tmpfs volumes"
      - "Memory-backed emptyDir data is copied into the image, doubling memory use"
    answer: 1
    explanation: |
      medium: Memory backs emptyDir with tmpfs (RAM). Files written there count against the
      container/pod memory limit, so filling it can push the pod over its limit and get it
      OOMKilled.
    ref: "concepts.md#emptydir"

  - id: storage-volumes-pv-pvc-006
    difficulty: intermediate
    tags: [emptydir, sidecar, sharing]
    question: |
      Two containers in the same pod need to share files: a main container writes output
      and a sidecar reads it. What is the simplest volume for this?
    options:
      - "A hostPath volume"
      - "A separate PVC for each container"
      - "An emptyDir volume mounted into both containers"
      - "A configMap volume"
    answer: 2
    explanation: |
      An emptyDir mounted into both containers gives them a shared scratch filesystem for the
      pod's lifetime — the canonical sidecar handoff pattern. No persistence is needed here.
    ref: "concepts.md#emptydir"

  - id: storage-volumes-pv-pvc-007
    difficulty: intermediate
    tags: [hostpath, security, danger]
    question: |
      Why is hostPath considered dangerous for ordinary application workloads?
    options:
      - "It exposes the node filesystem, enabling privilege escalation/escape, and isn't node-portable"
      - "It is slower than any network storage"
      - "It can only be mounted read-only"
      - "It requires a CSI driver to be installed"
    answer: 0
    explanation: |
      hostPath mounts the node's own filesystem into the pod. That is a privilege-escalation
      and container-escape vector, and data written on one node is invisible after rescheduling
      elsewhere — so it isn't durable cluster storage. PSS baseline/restricted forbid it.
    ref: "concepts.md#hostpath-and-its-dangers"

  - id: storage-volumes-pv-pvc-008
    difficulty: intermediate
    tags: [hostpath, local, node-storage]
    question: |
      You need node-local persistent storage but want to avoid raw hostPath's pitfalls.
      What does Kubernetes recommend instead?
    options:
      - "Use an emptyDir with medium: Memory"
      - "Use a configMap volume"
      - "Use gitRepo volumes"
      - "Use the 'local' volume type (a PV pinned to a node with node affinity)"
    answer: 3
    explanation: |
      The 'local' volume type provides node-local persistent storage as a proper PV with node
      affinity, so the scheduler keeps the pod on the node that holds the data — far safer than
      raw hostPath.
    ref: "concepts.md#hostpath-and-its-dangers"

  - id: storage-volumes-pv-pvc-009
    difficulty: intermediate
    tags: [configmap, subpath, updates]
    question: |
      A ConfigMap is mounted into a pod using a subPath mount. You update the ConfigMap.
      What happens to the mounted file?
    options:
      - "It updates within a minute like normal volume mounts"
      - "It updates only after a liveness probe restart"
      - "The pod is automatically recreated to pick up the change"
      - "It never updates — subPath mounts are frozen at mount time"
    answer: 3
    explanation: |
      Regular ConfigMap/Secret volume mounts eventually reflect updates, but subPath mounts
      are frozen at mount time and do NOT receive updates. You must recreate the pod to pick
      up changes.
    ref: "concepts.md#configmap-and-secret-volumes"

  - id: storage-volumes-pv-pvc-010
    difficulty: beginner
    tags: [secret, tmpfs, readonly]
    question: |
      How is a Secret surfaced when mounted as a volume?
    options:
      - "As a read-write directory on node disk"
      - "As environment variables only"
      - "As a hostPath mount under /etc"
      - "As a read-only tmpfs (RAM-backed) mount"
    answer: 3
    explanation: |
      Secret volumes are mounted read-only and backed by tmpfs so the plaintext never persists
      to node disk. ConfigMap/Secret volume mounts are always read-only.
    ref: "concepts.md#configmap-and-secret-volumes"

  - id: storage-volumes-pv-pvc-011
    difficulty: intermediate
    tags: [static-provisioning, pending]
    question: |
      With static provisioning, a PVC requests 20Gi RWO from class "" (empty string) but no
      matching PV exists. What is the PVC's state?
    options:
      - "Bound to the nearest larger PV automatically resized"
      - "Failed with an immediate error"
      - "Pending — no matching PV, and class \"\" disables dynamic provisioning"
      - "Terminating"
    answer: 2
    explanation: |
      storageClassName: "" opts out of dynamic provisioning, so the PVC can only bind an
      existing static PV. With no match, it stays Pending until an admin creates a suitable PV.
    ref: "concepts.md#static-vs-dynamic-provisioning"

  - id: storage-volumes-pv-pvc-012
    difficulty: intermediate
    tags: [dynamic-provisioning, storageclass, csi]
    question: |
      In dynamic provisioning, what actually creates the backing volume and the PV object when
      a PVC references a StorageClass and no matching PV exists?
    options:
      - "The StorageClass's provisioner (a CSI driver)"
      - "The kube-scheduler"
      - "The kubelet on the target node"
      - "The user, manually"
    answer: 0
    explanation: |
      The StorageClass names a provisioner (CSI driver). When no matching PV exists, the driver
      creates a new backing volume and a corresponding PV, then the PVC binds to it — no admin
      pre-creation needed.
    ref: "concepts.md#static-vs-dynamic-provisioning"

  - id: storage-volumes-pv-pvc-013
    difficulty: intermediate
    tags: [default-storageclass, admission]
    question: |
      A PVC omits storageClassName entirely. How does it get a class in a typical cluster?
    options:
      - "It always stays Pending; a class is mandatory"
      - "The DefaultStorageClass admission controller injects the cluster's default class"
      - "The kubelet assigns a random class"
      - "It binds to any PV regardless of class"
    answer: 1
    explanation: |
      When storageClassName is omitted, the DefaultStorageClass admission controller injects the
      class annotated as default (storageclass.kubernetes.io/is-default-class: "true"). Note that
      an empty string "" is different — that opts out of dynamic provisioning.
    ref: "concepts.md#static-vs-dynamic-provisioning"

  - id: storage-volumes-pv-pvc-014
    difficulty: intermediate
    tags: [storageclass, parameters, driver]
    question: |
      What is true of the parameters block in a StorageClass (e.g. type: gp3, iops: "5000")?
    options:
      - "Kubernetes validates every key against a fixed schema"
      - "It is opaque to Kubernetes and passed straight to the CSI driver, so valid keys are driver-specific"
      - "It configures the pod's resource requests"
      - "It sets the PVC's access modes"
    answer: 1
    explanation: |
      The parameters map is opaque to Kubernetes and forwarded to the provisioner/CSI driver.
      Valid keys depend entirely on the specific driver.
    ref: "concepts.md#storageclass"

  - id: storage-volumes-pv-pvc-015
    difficulty: beginner
    tags: [access-modes, rwo]
    question: |
      What does the ReadWriteOnce (RWO) access mode actually guarantee?
    options:
      - "Only one pod in the entire cluster can mount the volume"
      - "The volume is read-only for everyone"
      - "The volume can be mounted read-write by many nodes"
      - "The volume can be mounted read-write by a single node (multiple pods on that node may share it)"
    answer: 3
    explanation: |
      RWO is per-node, not per-pod: multiple pods on the SAME node can mount it read-write; it
      only prevents cross-node read-write mounting. For strict single-pod access use
      ReadWriteOncePod.
    ref: "concepts.md#access-modes-rwo--rox--rwx--rwop"

  - id: storage-volumes-pv-pvc-016
    difficulty: intermediate
    tags: [access-modes, rwx, block-vs-file]
    question: |
      An app requires ReadWriteMany (RWX). Which backing storage can satisfy it?
    options:
      - "A single AWS EBS / Ceph RBD block volume"
      - "A GCE persistent disk"
      - "Any StorageClass, since RWX is universal"
      - "A shared network filesystem such as NFS, CephFS, or a managed file service"
    answer: 3
    explanation: |
      Block storage (EBS, RBD, GCE PD) attaches to one node at a time and is RWO. RWX requires a
      shared/network filesystem (NFS, CephFS, GlusterFS, EFS/Azure Files). Asking a block driver
      for RWX fails.
    ref: "concepts.md#access-modes-rwo--rox--rwx--rwop"

  - id: storage-volumes-pv-pvc-017
    difficulty: advanced
    tags: [access-modes, rwop, versions]
    question: |
      You need to guarantee that exactly one pod cluster-wide can mount a volume read-write.
      Which access mode do you use, and what is its GA status?
    options:
      - "ReadWriteOncePod; GA in v1.29"
      - "ReadWriteOnce; GA since v1.0"
      - "ReadWriteMany; still alpha"
      - "ReadOnlyMany; GA in v1.20"
    answer: 0
    explanation: |
      ReadWriteOncePod (RWOP) restricts a volume to a single pod cluster-wide. It was alpha in
      v1.22, beta in v1.27, and reached GA in v1.29.
    ref: "concepts.md#access-modes-rwo--rox--rwx--rwop"

  - id: storage-volumes-pv-pvc-018
    difficulty: advanced
    tags: [access-modes, multi-attach, scenario]
    question: |
      A Deployment with replicas: 3 uses one PVC backed by an RWO EBS volume. Two of the pods
      are stuck ContainerCreating with a "Multi-Attach" error. What is the cleanest fix?
    options:
      - "Switch to RWX shared storage, or use a StatefulSet with volumeClaimTemplates so each pod gets its own PVC"
      - "Increase the PVC size"
      - "Set reclaimPolicy: Retain"
      - "Add more nodes to the cluster"
    answer: 0
    explanation: |
      An RWO volume can only attach to one node. Pods on other nodes fail with Multi-Attach.
      Use RWX storage for true sharing, or a StatefulSet with volumeClaimTemplates to give each
      replica its own RWO PVC.
    ref: "concepts.md#access-modes-rwo--rox--rwx--rwop"

  - id: storage-volumes-pv-pvc-019
    difficulty: beginner
    tags: [reclaim-policy, delete, default]
    question: |
      What is the default reclaim policy for a dynamically provisioned PersistentVolume?
    options:
      - "Retain"
      - "Recycle"
      - "Delete"
      - "Snapshot"
    answer: 2
    explanation: |
      Dynamically provisioned PVs inherit the StorageClass reclaim policy, which defaults to
      Delete — the PV object and the external storage asset are both removed when the PVC is
      deleted.
    ref: "concepts.md#reclaim-policies-retain--delete--recycle"

  - id: storage-volumes-pv-pvc-020
    difficulty: intermediate
    tags: [reclaim-policy, retain, released]
    question: |
      A PV has reclaimPolicy: Retain. Its PVC is deleted. What is the PV's state and what
      happens to the data?
    options:
      - "The PV and data are deleted immediately"
      - "The PV becomes Available and rebinds to the next PVC automatically"
      - "The PV moves to Released and the data remains; an admin must reclaim it manually"
      - "The PV is Recycled (scrubbed) and reused"
    answer: 2
    explanation: |
      With Retain, deleting the PVC leaves the PV in the Released phase with data intact. It is
      NOT auto-reused; an admin must delete/clean the PV and reprovision before the storage can
      be reused.
    ref: "concepts.md#reclaim-policies-retain--delete--recycle"

  - id: storage-volumes-pv-pvc-021
    difficulty: intermediate
    tags: [reclaim-policy, recycle, deprecated]
    question: |
      What should you say about the 'Recycle' reclaim policy in a modern Kubernetes interview?
    options:
      - "It is deprecated; use dynamic provisioning instead"
      - "It is the recommended default for production databases"
      - "It encrypts the volume before reuse"
      - "It creates a snapshot before deleting"
    answer: 0
    explanation: |
      Recycle did a basic scrub (rm -rf) of the volume and is deprecated in favor of dynamic
      provisioning. The relevant modern policies are Retain and Delete.
    ref: "concepts.md#reclaim-policies-retain--delete--recycle"

  - id: storage-volumes-pv-pvc-022
    difficulty: intermediate
    tags: [reclaim-policy, production, database]
    question: |
      For a production database's PVC you want to ensure deleting the PVC never destroys the
      underlying disk. What do you configure?
    options:
      - "reclaimPolicy: Retain on the PV (or patch it)"
      - "reclaimPolicy: Delete on the PV"
      - "accessMode: ReadOnlyMany"
      - "volumeBindingMode: Immediate"
    answer: 0
    explanation: |
      Retain keeps the PV and backing storage when the PVC is deleted, protecting precious data.
      You can patch an existing dynamic PV to Retain to override the class default of Delete.
    ref: "concepts.md#reclaim-policies-retain--delete--recycle"

  - id: storage-volumes-pv-pvc-023
    difficulty: intermediate
    tags: [pv-phases, lifecycle]
    question: |
      In `kubectl get pv`, what does the 'Released' phase mean?
    options:
      - "The PV's claim was deleted but the volume has not yet been reclaimed"
      - "The PV is free and can bind to any new claim immediately"
      - "The PV is currently bound and in use"
      - "The PV failed provisioning"
    answer: 0
    explanation: |
      Released means the bound PVC was deleted but the PV/backing asset hasn't been reclaimed
      (typical with Retain). It is not automatically available to a new claim.
    ref: "concepts.md#pv-lifecycle-phases--binding"

  - id: storage-volumes-pv-pvc-024
    difficulty: beginner
    tags: [pv-phases, available, bound]
    question: |
      Which sequence of PV phases is correct for a newly created static PV that then gets used?
    options:
      - "Bound -> Available -> Released"
      - "Released -> Bound -> Available"
      - "Available -> Bound -> Released (after PVC deletion)"
      - "Failed -> Available -> Bound"
    answer: 2
    explanation: |
      A static PV starts Available, becomes Bound when a PVC binds, and moves to Released when
      that PVC is deleted (with Retain). Failed indicates automatic reclamation failed.
    ref: "concepts.md#pv-lifecycle-phases--binding"

  - id: storage-volumes-pv-pvc-025
    difficulty: advanced
    tags: [in-use-protection, finalizers, terminating]
    question: |
      You `kubectl delete pvc data` while a pod is still using it, and the PVC shows status
      Terminating with finalizer kubernetes.io/pvc-protection. Why?
    options:
      - "The PVC is corrupted"
      - "The StorageClass forbids deletion"
      - "Storage Object in Use Protection delays deletion until no pod mounts the PVC"
      - "The reclaim policy is set to Recycle"
    answer: 2
    explanation: |
      Storage Object in Use Protection adds a finalizer so a PVC (or PV) still mounted by a
      running pod isn't deleted out from under it. It stays Terminating until the pod releases
      the volume.
    ref: "concepts.md#pv-lifecycle-phases--binding"

  - id: storage-volumes-pv-pvc-026
    difficulty: intermediate
    tags: [binding, one-to-one]
    question: |
      Can two different PVCs bind to the same PersistentVolume simultaneously?
    options:
      - "Yes, as long as both request less than the PV's capacity"
      - "Yes, if they are in the same namespace"
      - "No — binding is 1:1; a bound PV cannot be claimed by another PVC"
      - "Yes, if the access mode is RWX"
    answer: 2
    explanation: |
      PVC-to-PV binding is exclusive 1:1. Once a PV is bound to a claim, no other claim can bind
      to it, even if capacity remains. (Access modes govern pod/node sharing of a single bound
      volume, not multiple claims.)
    ref: "concepts.md#the-pv--pvc-abstraction"

  - id: storage-volumes-pv-pvc-027
    difficulty: advanced
    tags: [volume-binding-mode, wffc, topology]
    question: |
      A StorageClass uses volumeBindingMode: WaitForFirstConsumer. A freshly created PVC sits
      in Pending with no consuming pod yet. Is this a problem?
    options:
      - "Yes, the PVC should bind immediately regardless"
      - "Yes, the StorageClass is misconfigured"
      - "No, but only because the cluster has a single zone"
      - "No — WFFC intentionally delays provisioning until a pod that uses the PVC is scheduled"
    answer: 3
    explanation: |
      WaitForFirstConsumer deliberately delays binding/provisioning until a consuming pod is
      scheduled, so the volume is created in the same zone/node the scheduler picks. A Pending
      PVC with no consumer is expected.
    ref: "concepts.md#volume-binding-mode-immediate-vs-waitforfirstconsumer"

  - id: storage-volumes-pv-pvc-028
    difficulty: advanced
    tags: [volume-binding-mode, immediate, zone-mismatch]
    question: |
      Why can volumeBindingMode: Immediate cause a scheduling deadlock with zonal block storage
      in a multi-zone cluster?
    options:
      - "It provisions the volume before scheduling, so the disk may land in a zone the scheduler can't place the pod in"
      - "It always provisions volumes with RWX"
      - "It disables the default StorageClass"
      - "It forces all pods onto a single node"
    answer: 0
    explanation: |
      Immediate provisions the volume as soon as the PVC is created, independent of pod
      scheduling. A zonal disk may be created in zone A while the scheduler wants zone B; the
      zonal disk can't attach cross-zone, deadlocking. WaitForFirstConsumer avoids this.
    ref: "concepts.md#volume-binding-mode-immediate-vs-waitforfirstconsumer"

  - id: storage-volumes-pv-pvc-029
    difficulty: intermediate
    tags: [csi, purpose]
    question: |
      What problem does the Container Storage Interface (CSI) solve?
    options:
      - "It schedules pods based on storage locality"
      - "It encrypts all volumes at rest by default"
      - "It lets any storage vendor write an out-of-tree driver that plugs into Kubernetes without changing core code"
      - "It replaces StorageClasses"
    answer: 2
    explanation: |
      CSI is a standard, out-of-tree API so storage vendors can supply drivers independently of
      the Kubernetes release cycle. It replaced the old in-tree plugin model.
    ref: "concepts.md#csi--the-container-storage-interface"

  - id: storage-volumes-pv-pvc-030
    difficulty: advanced
    tags: [csi, controller, node-plugin]
    question: |
      A CSI driver typically has two components. Which describes them correctly?
    options:
      - "A controller plugin (provision/attach) and a node plugin DaemonSet (stage/mount on the node)"
      - "A scheduler plugin and a webhook"
      - "A kubelet patch and an etcd extension"
      - "An Ingress controller and a Service"
    answer: 0
    explanation: |
      CSI drivers ship a controller plugin (CreateVolume/DeleteVolume/ControllerPublish via
      sidecars like external-provisioner/attacher) and a node plugin DaemonSet
      (NodeStageVolume/NodePublishVolume that formats and mounts the volume on the node).
    ref: "concepts.md#csi--the-container-storage-interface"

  - id: storage-volumes-pv-pvc-031
    difficulty: intermediate
    tags: [csi, in-tree, migration]
    question: |
      What happened to in-tree cloud volume plugins like gcePersistentDisk and
      awsElasticBlockStore?
    options:
      - "They remain the recommended way to use cloud storage"
      - "They were merged into hostPath"
      - "They are deprecated/removed and their operations are redirected to CSI drivers via CSI migration"
      - "They now require Helm to function"
    answer: 2
    explanation: |
      In-tree cloud plugins are deprecated and being removed; CSI migration transparently
      redirects their operations to the equivalent CSI driver. Modern manifests use PVC +
      StorageClass, not in-tree types.
    ref: "concepts.md#csi--the-container-storage-interface"

  - id: storage-volumes-pv-pvc-032
    difficulty: intermediate
    tags: [statefulset, volumeclaimtemplates]
    question: |
      A StatefulSet named 'pg' with replicas: 3 uses volumeClaimTemplates with metadata.name
      'data'. What PVCs are created?
    options:
      - "PVCs data-pg-0, data-pg-1, data-pg-2 — one per pod"
      - "A single shared PVC named 'data'"
      - "No PVCs; StatefulSets use emptyDir"
      - "PVCs pg-data-1, pg-data-2, pg-data-3"
    answer: 0
    explanation: |
      volumeClaimTemplates create a separate PVC per pod, named <template>-<statefulset>-<ordinal>:
      data-pg-0, data-pg-1, data-pg-2. Each pod gets its own durable disk with stable identity.
    ref: "concepts.md#statefulset-volumeclaimtemplates"

  - id: storage-volumes-pv-pvc-033
    difficulty: advanced
    tags: [statefulset, scale-down, pvc-retention]
    question: |
      By default, what happens to a StatefulSet's per-pod PVCs when you scale it down?
    options:
      - "The PVCs are deleted immediately along with their data"
      - "The PVCs convert to emptyDir"
      - "The PVCs are snapshotted then deleted"
      - "The PVCs are retained (data preserved) and reattach if you scale back up"
    answer: 3
    explanation: |
      Scaling a StatefulSet down does NOT delete its PVCs by default — data is preserved and
      reattaches on scale-up. You clean them up manually, or opt into deletion with
      persistentVolumeClaimRetentionPolicy.
    ref: "concepts.md#statefulset-volumeclaimtemplates"

  - id: storage-volumes-pv-pvc-034
    difficulty: intermediate
    tags: [statefulset, deployment, database, scenario]
    question: |
      Why is a StatefulSet, not a Deployment, the right controller for a 3-node PostgreSQL
      cluster on RWO block storage?
    options:
      - "StatefulSets give each replica a stable identity and its own PVC, avoiding the shared-RWO Multi-Attach problem"
      - "Deployments cannot run stateful images"
      - "Deployments do not support volumes at all"
      - "StatefulSets are always faster"
    answer: 0
    explanation: |
      A Deployment shares one pod template and (for RWO) can't give each replica its own disk —
      pods on other nodes hit Multi-Attach errors. StatefulSets provide stable network/storage
      identity and per-pod PVCs via volumeClaimTemplates.
    ref: "concepts.md#statefulset-volumeclaimtemplates"

  - id: storage-volumes-pv-pvc-035
    difficulty: intermediate
    tags: [volume-expansion, allowvolumeexpansion]
    question: |
      What is required to grow an existing PVC from 20Gi to 100Gi?
    options:
      - "Nothing; all PVCs can always be resized"
      - "allowVolumeExpansion: true on the StorageClass and driver support, then edit the PVC's requested size"
      - "Delete and recreate the PVC"
      - "Change the reclaim policy to Retain first"
    answer: 1
    explanation: |
      The StorageClass must have allowVolumeExpansion: true and the CSI driver must support
      expansion. You then patch the PVC's spec.resources.requests.storage to a larger value; the
      controller and node resize the volume and filesystem.
    ref: "concepts.md#volume-expansion"

  - id: storage-volumes-pv-pvc-036
    difficulty: intermediate
    tags: [volume-expansion, shrink]
    question: |
      Can you shrink a PVC by editing its requested storage to a smaller value?
    options:
      - "Yes, if allowVolumeExpansion is true"
      - "Yes, but only for emptyDir"
      - "No — volume expansion is grow-only; shrinking is not allowed"
      - "Yes, after taking a snapshot"
    answer: 2
    explanation: |
      Volume expansion only supports growing. Kubernetes never shrinks a PVC — you'd have to
      migrate data to a smaller new volume manually.
    ref: "concepts.md#volume-expansion"

  - id: storage-volumes-pv-pvc-037
    difficulty: advanced
    tags: [volume-expansion, pv-edit, gotcha]
    question: |
      An engineer edits the PV's capacity field directly to enlarge storage, but the pod still
      sees the old size. Why?
    options:
      - "The node needs a reboot"
      - "Expansion must be driven through the PVC, not by editing the PV capacity"
      - "PVs cannot be edited at all"
      - "The StorageClass reclaim policy blocks it"
    answer: 1
    explanation: |
      Volume expansion is driven by increasing the PVC's requested storage, which triggers the
      controller/node resize workflow. Editing the PV's capacity directly does not resize the
      app-visible filesystem.
    ref: "concepts.md#volume-expansion"

  - id: storage-volumes-pv-pvc-038
    difficulty: intermediate
    tags: [snapshots, objects]
    question: |
      Which trio of objects implements CSI volume snapshots?
    options:
      - "Snapshot, Backup, Restore"
      - "VolumeSnapshotClass, VolumeSnapshot, VolumeSnapshotContent"
      - "PV, PVC, StorageClass"
      - "SnapshotPolicy, SnapshotJob, SnapshotSet"
    answer: 1
    explanation: |
      CSI snapshots use VolumeSnapshotClass (the template), VolumeSnapshot (the namespaced
      request), and VolumeSnapshotContent (the cluster-scoped actual snapshot, analogous to a
      PV). They're driven by the external-snapshotter sidecar.
    ref: "concepts.md#volume-snapshots"

  - id: storage-volumes-pv-pvc-039
    difficulty: advanced
    tags: [snapshots, restore, datasource]
    question: |
      How do you restore data from a VolumeSnapshot into a new volume?
    options:
      - "Mount the VolumeSnapshot directly as a volume in the pod"
      - "Edit the existing PV to point at the snapshot"
      - "Create a new PVC whose spec.dataSource references the VolumeSnapshot"
      - "Snapshots cannot be restored, only listed"
    answer: 2
    explanation: |
      You restore by creating a new PVC with spec.dataSource referencing the VolumeSnapshot; the
      CSI driver provisions a new volume pre-populated from the snapshot. Using another PVC as
      dataSource instead clones a volume.
    ref: "concepts.md#volume-snapshots"

  - id: storage-volumes-pv-pvc-040
    difficulty: beginner
    tags: [pvc, pod-reference, yaml]
    question: |
      In a pod spec, how does a container get access to a PersistentVolume?
    options:
      - "By listing the PV name directly under volumes"
      - "By setting hostPath to the PV's directory"
      - "By adding the PV to spec.nodeSelector"
      - "Via a volume of type persistentVolumeClaim referencing the PVC by claimName"
    answer: 3
    explanation: |
      Pods reference storage through a PVC: a volume of type persistentVolumeClaim with
      claimName. Pods never name a PV directly — that indirection is the whole point of the
      abstraction.
    ref: "concepts.md#the-pv--pvc-abstraction"

  - id: storage-volumes-pv-pvc-041
    difficulty: intermediate
    tags: [pending, troubleshooting, scenario]
    question: |
      `kubectl get pvc` shows a PVC stuck in Pending. Which is NOT a plausible cause?
    options:
      - "No matching static PV and no usable StorageClass"
      - "The pod using it was OOMKilled once"
      - "WaitForFirstConsumer binding mode with no consuming pod yet"
      - "An impossible request such as RWX from a block-only driver"
    answer: 1
    explanation: |
      A PVC stays Pending due to no matching PV/class, WaitForFirstConsumer waiting for a pod, or
      an unsatisfiable request (wrong access mode, too-large capacity). A pod being OOMKilled is
      unrelated to whether the claim can bind.
    ref: "concepts.md#static-vs-dynamic-provisioning"

  - id: storage-volumes-pv-pvc-042
    difficulty: intermediate
    tags: [volume-types, deprecated, gitrepo]
    question: |
      Which volume-related feature is deprecated/disabled, with the recommended replacement being
      an initContainer that clones into an emptyDir?
    options:
      - "configMap volumes"
      - "gitRepo volumes"
      - "projected volumes"
      - "csi volumes"
    answer: 1
    explanation: |
      gitRepo volumes are deprecated/disabled. The recommended pattern is an initContainer that
      git-clones the repository into an emptyDir shared with the main container.
    ref: "concepts.md#volume-types-overview"

  - id: storage-volumes-pv-pvc-043
    difficulty: beginner
    tags: [projected, volume-types]
    question: |
      What does a 'projected' volume do?
    options:
      - "Mounts a remote object store bucket"
      - "Projects a PV across multiple namespaces"
      - "Combines multiple sources (secret, configMap, downwardAPI, serviceAccountToken) into one directory"
      - "Creates a read-only mirror of a hostPath"
    answer: 2
    explanation: |
      A projected volume maps several existing sources — secret, configMap, downwardAPI,
      serviceAccountToken, clusterTrustBundle — into a single directory.
    ref: "concepts.md#volume-types-overview"

  - id: storage-volumes-pv-pvc-044
    difficulty: intermediate
    tags: [emptydir, sizelimit, eviction]
    question: |
      A disk-backed emptyDir with no sizeLimit grows large and the pod gets evicted. What
      happened?
    options:
      - "The volume exceeded its RWO access mode"
      - "The PVC reclaim policy was Delete"
      - "It consumed node ephemeral storage, triggering node-pressure eviction"
      - "The CSI driver crashed"
    answer: 2
    explanation: |
      Disk-backed emptyDir draws from the node's ephemeral storage. Without a sizeLimit it can
      fill the node and trigger eviction under disk pressure. Set sizeLimit to cap it.
    ref: "concepts.md#emptydir"

  - id: storage-volumes-pv-pvc-045
    difficulty: intermediate
    tags: [access-modes, driver-property]
    question: |
      A PVC requests ReadWriteMany but binds to a PV backed by a block device. The pod fails to
      mount on a second node. What is the conceptual mistake?
    options:
      - "Access modes are a property of the volume type/driver — you can't request RWX from a backend that only supports RWO"
      - "Access modes are enforced by the app, not the volume"
      - "RWX requires reclaimPolicy: Retain"
      - "The PVC should have used Immediate binding"
    answer: 0
    explanation: |
      Access modes reflect what the underlying volume type/driver actually supports. Declaring
      RWX on a block-backed volume doesn't make it multi-node writable; you need a shared
      filesystem to genuinely support RWX.
    ref: "concepts.md#access-modes-rwo--rox--rwx--rwop"

  - id: storage-volumes-pv-pvc-046
    difficulty: intermediate
    tags: [decision, stateful-workloads]
    question: |
      For fast, single-writer database storage on one node, which choice is most appropriate?
    options:
      - "RWX network filesystem shared by all replicas"
      - "emptyDir with medium: Memory"
      - "RWO block storage, one PVC per replica via a StatefulSet"
      - "hostPath on every node"
    answer: 2
    explanation: |
      Block storage is fast and single-node (RWO). Giving each replica its own RWO PVC through a
      StatefulSet's volumeClaimTemplates is the standard high-performance stateful pattern; RWX
      file storage is slower and unnecessary for single-writer per replica.
    ref: "concepts.md#storage-for-stateful-workloads-putting-it-together"

  - id: storage-volumes-pv-pvc-047
    difficulty: beginner
    tags: [decision, emptydir-vs-pvc]
    question: |
      Data must survive a pod being rescheduled to a different node. Which volume choice works?
    options:
      - "emptyDir"
      - "hostPath"
      - "medium: Memory emptyDir"
      - "A PVC backed by a PersistentVolume"
    answer: 3
    explanation: |
      Only PV-backed storage (via a PVC) survives pod deletion and rescheduling across nodes.
      emptyDir dies with the pod and hostPath data is stuck on the original node.
    ref: "concepts.md#storage-for-stateful-workloads-putting-it-together"

  - id: storage-volumes-pv-pvc-048
    difficulty: advanced
    tags: [configmap, updates, subpath, scenario]
    question: |
      A config file is mounted via a normal (non-subPath) ConfigMap volume. You update the
      ConfigMap. What is the accurate expectation?
    options:
      - "The file never updates without a pod restart"
      - "The mounted file eventually updates (kubelet sync), though the app may still need to reload it"
      - "The pod is automatically restarted to apply the change"
      - "The change is rejected because ConfigMap volumes are immutable"
    answer: 1
    explanation: |
      Non-subPath ConfigMap/Secret volume mounts are eventually updated by the kubelet sync loop.
      The file content refreshes, but the application itself must re-read the file (or be
      signaled) to actually apply the new config. subPath mounts, by contrast, never update.
    ref: "concepts.md#configmap-and-secret-volumes"

  - id: storage-volumes-pv-pvc-049
    difficulty: advanced
    tags: [reclaim-policy, delete, incident, scenario]
    question: |
      An engineer deletes a PVC to "clean up," and the production database's disk vanishes along
      with all data. Which setting most directly caused this, and what would have prevented it?
    options:
      - "volumeBindingMode: Immediate; switch to WaitForFirstConsumer"
      - "accessMode RWO; RWX would have prevented deletion"
      - "allowVolumeExpansion: true; disabling it would have prevented deletion"
      - "reclaimPolicy: Delete on the PV; setting Retain would have preserved the storage"
    answer: 3
    explanation: |
      With reclaimPolicy: Delete (the dynamic default), deleting the PVC destroys the backing
      storage. Retain would have kept the PV and data (moving it to Released) so it could be
      recovered manually.
    ref: "concepts.md#reclaim-policies-retain--delete--recycle"

  - id: storage-volumes-pv-pvc-050
    difficulty: beginner
    tags: [storageclass, purpose]
    question: |
      What is the primary role of a StorageClass?
    options:
      - "To define which namespace a PVC lives in"
      - "To act as a template for dynamic provisioning — naming the provisioner, parameters, reclaim policy, and binding mode"
      - "To mount volumes into containers"
      - "To encrypt secrets at rest"
    answer: 1
    explanation: |
      A StorageClass is the 'menu' for dynamic provisioning: it names the provisioner (CSI
      driver), driver parameters, reclaimPolicy, volumeBindingMode, and allowVolumeExpansion.
      PVs provisioned from it inherit these defaults.
    ref: "concepts.md#storageclass"
