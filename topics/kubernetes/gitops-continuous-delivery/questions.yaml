topic: "GitOps & Continuous Delivery (Kubernetes)"
domain: kubernetes
topic_slug: gitops-continuous-delivery
version: 1
questions:
  - id: gitops-continuous-delivery-001
    difficulty: beginner
    tags: [gitops, desired-state, principles]
    question: |
      In a GitOps model for Kubernetes, what serves as the single source of truth for the
      cluster's desired state?
    options:
      - "A Git repository holding declarative manifests"
      - "The etcd datastore of the cluster's live state"
      - "The CI server's last successful build"
      - "The kube-apiserver's in-memory cache"
    answer: 0
    explanation: |
      GitOps stores the entire desired state declaratively in Git. An in-cluster agent then
      reconciles the live cluster to match Git. etcd holds live state, but Git is the declared,
      versioned, auditable source of truth.
    ref: "concepts.md#gitops-applied-to-kubernetes"

  - id: gitops-continuous-delivery-002
    difficulty: beginner
    tags: [gitops, reconciliation, kubernetes]
    question: |
      Why is Kubernetes described as an especially good fit for GitOps?
    options:
      - "Because kubectl can only run from inside a Pod and never from a remote workstation"
      - "Because Kubernetes clones a Git repo into every node and stores manifests there internally"
      - "Because Kubernetes rejects all imperative commands unless you pass a special --gitops flag"
      - "Because Kubernetes is already declarative and controllers reconcile toward desired state"
    answer: 3
    explanation: |
      Kubernetes is inherently declarative: you describe desired state and built-in controllers
      continuously reconcile the cluster toward it. GitOps simply extends that reconciliation loop
      out to a Git repository.
    ref: "concepts.md#gitops-applied-to-kubernetes"

  - id: gitops-continuous-delivery-003
    difficulty: intermediate
    tags: [gitops, repo-layout, ci]
    question: |
      A common GitOps setup separates an application "source" repo from a "config" (GitOps) repo.
      What does CI typically do at the boundary between them?
    options:
      - "Run kubectl apply directly against production using cluster-admin credentials held by the runner"
      - "Store the built container image binary as a committed blob inside the config repo itself"
      - "Build and push the image, then commit the new image tag into the config repo"
      - "Delete the old Deployment via kubectl and then recreate it fresh before pushing the new tag"
    answer: 2
    explanation: |
      CI builds and pushes the image from the source repo, then bumps the image tag in the config
      repo. The GitOps agent watching the config repo takes it from there — CI never touches the
      cluster directly.
    ref: "concepts.md#gitops-applied-to-kubernetes"

  - id: gitops-continuous-delivery-004
    difficulty: beginner
    tags: [pull-vs-push, cd, model]
    question: |
      What most fundamentally distinguishes pull-based GitOps from push-based CD?
    options:
      - "Pull-based GitOps only works with Helm charts and cannot reconcile plain Kustomize overlays"
      - "Push-based CD is fundamentally incapable of deploying workloads to any Kubernetes cluster"
      - "An in-cluster agent pulls and applies desired state itself, rather than an external pipeline pushing it"
      - "Pull-based GitOps abandons Git entirely and reconciles from an internal database instead"
    answer: 2
    explanation: |
      In pull-based GitOps an agent inside the cluster pulls desired state from Git and applies it
      itself. In push-based CD an external pipeline runs kubectl/helm against the cluster from
      outside.
    ref: "concepts.md#pull-based-gitops-vs-push-based-cd"

  - id: gitops-continuous-delivery-005
    difficulty: intermediate
    tags: [pull-vs-push, security, credentials]
    question: |
      What is the headline security benefit of the pull-based GitOps model?
    options:
      - "Container images are automatically scanned for CVEs before the agent will apply them"
      - "Git repositories are transparently encrypted at rest by the agent using a per-cluster KMS key"
      - "The reconciliation agent runs as root on every node so it can enforce host-level policy"
      - "Cluster credentials never leave the cluster; no external CI system holds cluster-admin"
    answer: 3
    explanation: |
      With pull-based GitOps the agent inside the cluster holds the credentials; the external CI
      system only writes to Git. A compromised CI runner can't delete your cluster because it never
      had cluster access.
    ref: "concepts.md#pull-based-gitops-vs-push-based-cd"

  - id: gitops-continuous-delivery-006
    difficulty: intermediate
    tags: [pull-vs-push, networking, private-cluster]
    question: |
      A private cluster has no inbound network access to its API server. Why does pull-based
      GitOps still work here while push-based CD struggles?
    options:
      - "The agent only needs egress to Git, whereas external CI must reach the API server inbound"
      - "Pull-based GitOps disables the API server's inbound listener and talks to the kubelet instead"
      - "Push-based CD reconciles fully offline and needs no network access to the target cluster"
      - "GitOps opens a direct tunnel into etcd, bypassing the API server's authentication entirely"
    answer: 0
    explanation: |
      A pull-based agent runs inside the cluster and only needs outbound access to Git. Push-based
      CD needs the external runner to reach the API server, which a private cluster blocks.
    ref: "concepts.md#pull-based-gitops-vs-push-based-cd"

  - id: gitops-continuous-delivery-007
    difficulty: beginner
    tags: [reconciliation, drift, definition]
    question: |
      In GitOps terms, what is "drift"?
    options:
      - "Live cluster state diverging from Git without a corresponding Git change"
      - "A local Git commit that has been authored but not yet pushed to the remote config repo"
      - "The latency between a registry image push and the kubelet finishing the layer pull"
      - "A Deployment that the HPA gradually scales up as request volume climbs over the day"
    answer: 0
    explanation: |
      Drift is when live state diverges from what Git declares, without a Git change causing it —
      e.g. someone runs kubectl edit/scale directly. The agent detects this as OutOfSync.
    ref: "concepts.md#reconciliation-diffing-and-drift-detection"

  - id: gitops-continuous-delivery-008
    difficulty: intermediate
    tags: [reconciliation, self-heal, drift]
    question: |
      An operator runs `kubectl scale deployment web --replicas=8`. The Argo CD Application for
      web has automated sync with `selfHeal: true` and Git declares `replicas: 3`. What happens?
    options:
      - "The Deployment stays at 8 replicas permanently since manual kubectl edits always win"
      - "Argo CD writes a new commit updating Git to say replicas: 8 to match the live cluster"
      - "The Application resource is deleted because the live spec no longer matches its source"
      - "Argo CD detects drift and re-applies Git state, scaling back to 3"
    answer: 3
    explanation: |
      selfHeal reverts drift by re-applying the Git-declared state. The manual scale-up is detected
      as drift and reverted to 3. GitOps agents never write live changes back to Git on their own.
    ref: "concepts.md#reconciliation-diffing-and-drift-detection"

  - id: gitops-continuous-delivery-009
    difficulty: advanced
    tags: [reconciliation, hpa, ignoredifferences]
    question: |
      A team enables an HPA on a Deployment but also keeps `replicas: 3` hardcoded in Git with
      Argo CD self-heal on. What symptom appears and what's the correct fix?
    options:
      - "Nothing goes wrong; Argo CD automatically yields the replicas field to any HPA it detects"
      - "The HPA is deleted by Argo CD because it competes with the self-heal reconciliation loop"
      - "Replica count flaps between HPA's target and 3; remove replicas from the manifest or add ignoreDifferences for /spec/replicas"
      - "The Deployment is permanently marked Degraded and there is no supported way to recover it"
    answer: 2
    explanation: |
      HPA scales replicas up, self-heal reverts to the hardcoded 3, HPA scales again — flapping.
      Fix by removing replicas from Git or telling Argo CD to ignore /spec/replicas via
      ignoreDifferences, so the HPA owns that field.
    ref: "concepts.md#reconciliation-diffing-and-drift-detection"

  - id: gitops-continuous-delivery-010
    difficulty: advanced
    tags: [reconciliation, diffing, admission]
    question: |
      Why can't a GitOps agent use a naive text comparison between Git manifests and live objects
      to detect drift?
    options:
      - "Git stores YAML while the cluster stores raw JSON, so the two serializations can never match"
      - "Kubernetes mutates objects after submission (defaulting, admission webhooks, status writes), so live objects legitimately differ"
      - "Text comparison is far too slow to run across the object count of a large production cluster"
      - "Live objects are stored encrypted in etcd, so their bytes never match the plaintext in Git"
    answer: 1
    explanation: |
      Kubernetes defaults fields, admission webhooks mutate specs, and controllers write status.
      A naive diff would show constant false drift, so agents use structured diffs plus
      ignoreDifferences and understand field ownership.
    ref: "concepts.md#reconciliation-diffing-and-drift-detection"

  - id: gitops-continuous-delivery-011
    difficulty: beginner
    tags: [argocd, application, crd]
    question: |
      What kind of Kubernetes object does Argo CD use to declare "deploy this Git source to this
      cluster/namespace with this sync policy"?
    options:
      - "A ConfigMap named argocd-apps holding one entry per deployed source"
      - "A native Deployment whose pod template points at the target Git source"
      - "A Helm release secret written into the destination namespace by the agent"
      - "An `Application` custom resource"
    answer: 3
    explanation: |
      Argo CD is built around the Application CRD, which declares a source (repo/path/revision), a
      destination (cluster + namespace), and a sync policy.
    ref: "concepts.md#argo-cd-the-application-crd"

  - id: gitops-continuous-delivery-012
    difficulty: intermediate
    tags: [argocd, application, source]
    question: |
      Which three things does an Argo CD `Application` spec fundamentally declare?
    options:
      - "Source (repo/path/revision), destination (cluster/namespace), and sync policy"
      - "The container image, the registry it lives in, and the specific tag to deploy"
      - "The CPU request, the memory limit, and the desired replica count for the workload"
      - "The node selector, the node taint, and the matching pod toleration to schedule with"
    answer: 0
    explanation: |
      An Application declares a source (Git repo + path + targetRevision, or a Helm chart), a
      destination (target cluster server + namespace), and a syncPolicy (manual or automated).
    ref: "concepts.md#argo-cd-the-application-crd"

  - id: gitops-continuous-delivery-013
    difficulty: intermediate
    tags: [argocd, appproject, multi-tenancy]
    question: |
      What is the purpose of an Argo CD `AppProject`?
    options:
      - "To act as an in-cluster registry storing the container images used by its Applications"
      - "To define the HPA scaling policy that every Application under it must share"
      - "To render Helm templates into plain manifests before the repo-server clones them"
      - "To group Applications and enforce guardrails on allowed repos, destinations, and resource kinds"
    answer: 3
    explanation: |
      AppProject is Argo CD's multi-tenancy boundary: it groups Applications and restricts which
      source repos, destination clusters/namespaces, and resource kinds those Applications may use.
    ref: "concepts.md#argo-cd-the-application-crd"

  - id: gitops-continuous-delivery-014
    difficulty: advanced
    tags: [argocd, components, repo-server]
    question: |
      In Argo CD's architecture, which component is responsible for cloning the Git repo and
      rendering manifests (running helm template / kustomize build)?
    options:
      - "The application-controller, which diffs live state against the rendered manifests"
      - "The API/server component that backs the web UI, RBAC, and CLI endpoints"
      - "The repo-server"
      - "The notifications controller, which fires alerts on sync and health transitions"
    answer: 2
    explanation: |
      The repo-server clones the source and renders manifests. The application-controller does the
      reconciliation/diff, and the API server provides UI/API/RBAC.
    ref: "concepts.md#argo-cd-the-application-crd"

  - id: gitops-continuous-delivery-015
    difficulty: beginner
    tags: [argocd, sync-policy, manual]
    question: |
      An Argo CD Application has a syncPolicy with no `automated` block. A new commit lands in Git.
      What happens?
    options:
      - "The Application immediately auto-syncs the change the moment the commit is detected"
      - "The Application goes OutOfSync and waits for a manual sync"
      - "The Application is deleted because the desired state changed without an approval"
      - "Git is reverted automatically back to the previously synced commit by the controller"
    answer: 1
    explanation: |
      Without an automated block, sync is manual. The Application shows OutOfSync and waits for a
      human to click Sync or run `argocd app sync`. This is common for change-controlled prod.
    ref: "concepts.md#argo-cd-sync-policies-prune-and-self-heal"

  - id: gitops-continuous-delivery-016
    difficulty: intermediate
    tags: [argocd, prune, sync]
    question: |
      What does setting `prune: true` in an Argo CD automated sync policy do?
    options:
      - "Deletes live resources that were removed from Git"
      - "Removes old, scaled-to-zero ReplicaSets left behind by a Deployment's rollout history"
      - "Compresses and garbage-collects the config repo's Git history to save storage"
      - "Reverts manual kubectl edits made to running resources back to the Git-declared spec"
    answer: 0
    explanation: |
      prune deletes live resources that no longer exist in Git. It is off by default for safety;
      without it, resources removed from Git linger as orphans. selfHeal (not prune) handles manual
      drift.
    ref: "concepts.md#argo-cd-sync-policies-prune-and-self-heal"

  - id: gitops-continuous-delivery-017
    difficulty: intermediate
    tags: [argocd, self-heal, prune, defaults]
    question: |
      By default (when you enable automated sync but set nothing else), what is the state of
      `prune` and `selfHeal` in Argo CD?
    options:
      - "Both on by default, so removed resources are pruned and drift is reverted automatically"
      - "prune on by default, while selfHeal stays off until you explicitly enable it"
      - "Both off — you must opt into each"
      - "selfHeal on by default, while prune stays off until you explicitly enable it"
    answer: 2
    explanation: |
      prune and selfHeal are independent switches, both off by default. Automated sync will apply
      Git changes but won't delete removed resources (prune) or revert manual drift (selfHeal)
      unless you enable them.
    ref: "concepts.md#argo-cd-sync-policies-prune-and-self-heal"

  - id: gitops-continuous-delivery-018
    difficulty: advanced
    tags: [argocd, finalizer, cascade-delete]
    question: |
      What does adding the `resources-finalizer.argocd.io` finalizer to an Argo CD Application
      change about deletion behavior?
    options:
      - "It blocks the Application from ever being deleted until the finalizer is manually removed"
      - "It encrypts the Application's referenced Secrets before they are committed to Git"
      - "It disables pruning so removed manifests no longer delete their live resources"
      - "Deleting the Application cascade-deletes its managed resources"
    answer: 3
    explanation: |
      With that finalizer, deleting the Application cascade-deletes the resources it manages.
      Without it, deleting the Application leaves the underlying workloads running in the cluster.
    ref: "concepts.md#argo-cd-sync-policies-prune-and-self-heal"

  - id: gitops-continuous-delivery-019
    difficulty: advanced
    tags: [argocd, prune, safety]
    question: |
      Someone accidentally deletes an app's whole directory in Git, and its Argo CD Application has
      automated sync with prune enabled. What is the danger, and which guardrail helps?
    options:
      - "No danger at all; Argo CD automatically ignores any directory that becomes empty and never prunes the resources it previously created there"
      - "Argo CD prunes the live workloads; guardrails include PR review, Prune=false annotations on critical objects, and dry-run"
      - "There is no danger; Argo CD detects the missing path and recreates the deleted directory and its manifests back into Git automatically"
      - "The cluster silently rolls each affected workload back to its previously synced revision and image, so no live resources are ever removed"
    answer: 1
    explanation: |
      Auto-sync + prune will delete live workloads whose manifests vanished from Git. Guardrails
      include PR review/branch protection, per-resource Prune=false annotations, PruneLast, prune
      confirmation, and `argocd app sync --dry-run`.
    ref: "concepts.md#argo-cd-sync-policies-prune-and-self-heal"

  - id: gitops-continuous-delivery-020
    difficulty: intermediate
    tags: [app-of-apps, bootstrap]
    question: |
      What is the "app-of-apps" pattern in Argo CD?
    options:
      - "A single Application whose Git path contains other Application manifests, which it syncs"
      - "A single Application whose pod template runs several containers, one per microservice image it deploys"
      - "A community Helm chart that installs the Argo CD control plane itself into the argocd namespace"
      - "A special Application that merges two separate Git repos into one combined source tree before syncing"
    answer: 0
    explanation: |
      App-of-apps is a root Application pointing at a Git path full of child Application CRs.
      Syncing the root creates/updates the children, which then sync their own workloads — handy
      for bootstrapping a whole cluster from one root app.
    ref: "concepts.md#app-of-apps-and-applicationset"

  - id: gitops-continuous-delivery-021
    difficulty: intermediate
    tags: [applicationset, generators, templating]
    question: |
      When would you reach for `ApplicationSet` instead of hand-writing individual Applications?
    options:
      - "When you need to template many Applications from a generator (clusters, git dirs, PRs)"
      - "When you only ever deploy one Application and want its single sync policy managed for you"
      - "When you want to temporarily disable GitOps reconciliation across every managed cluster at once"
      - "When you need a place to store and encrypt the Secret objects your workloads consume"
    answer: 0
    explanation: |
      ApplicationSet templates many Applications from generators — list, cluster, git (per
      directory/file), matrix/merge, and pull-request. Use it for programmatic fan-out across
      clusters, environments, or PR preview environments.
    ref: "concepts.md#app-of-apps-and-applicationset"

  - id: gitops-continuous-delivery-022
    difficulty: advanced
    tags: [applicationset, pr-generator, preview]
    question: |
      Which ApplicationSet generator is designed to create ephemeral preview environments, one per
      open pull request?
    options:
      - "The cluster generator"
      - "The list generator"
      - "The pull-request generator"
      - "The matrix generator"
    answer: 2
    explanation: |
      The pull-request generator creates one Application per open PR, spinning up ephemeral preview
      environments that are torn down when the PR closes. The cluster generator fans out per
      registered cluster.
    ref: "concepts.md#app-of-apps-and-applicationset"

  - id: gitops-continuous-delivery-023
    difficulty: beginner
    tags: [sync-waves, ordering, argocd]
    question: |
      What does the annotation `argocd.argoproj.io/sync-wave: "1"` control?
    options:
      - "The desired replica count the Deployment should scale to once this sync completes"
      - "The imagePullPolicy applied to every container created during this particular sync"
      - "The order in which resources are applied within a sync (lower waves first)"
      - "The Git branch or targetRevision the Application should track for this resource"
    answer: 2
    explanation: |
      Sync waves order resources within a sync phase. Argo CD applies lower waves first (default 0,
      negatives allowed) and waits for each wave's resources to become healthy before the next.
    ref: "concepts.md#sync-waves-phases-and-hooks"

  - id: gitops-continuous-delivery-024
    difficulty: intermediate
    tags: [sync-hooks, presync, migration]
    question: |
      You need a database schema migration to complete before the new application version rolls
      out. Which Argo CD mechanism is the canonical fit?
    options:
      - "A PostSync hook Job (argocd.argoproj.io/hook: PostSync), which runs the migration after the new Pods are live"
      - "Setting prune: true so the old schema resources are removed before the migration Job runs"
      - "A SyncFail hook (argocd.argoproj.io/hook: SyncFail), which triggers the migration only if the sync fails"
      - "A PreSync hook Job (argocd.argoproj.io/hook: PreSync)"
    answer: 3
    explanation: |
      A PreSync hook runs before the main sync — the canonical place for a migration Job that must
      finish before the app's Pods start. PostSync is for smoke tests; SyncFail runs on failure.
    ref: "concepts.md#sync-waves-phases-and-hooks"

  - id: gitops-continuous-delivery-025
    difficulty: intermediate
    tags: [sync-phases, hooks, argocd]
    question: |
      Which of the following is a valid Argo CD sync phase for resource hooks?
    options:
      - "PostSync"
      - "PreBuild"
      - "OnDrift"
      - "PreScale"
    answer: 0
    explanation: |
      Argo CD's hook phases are PreSync, Sync, PostSync, and SyncFail. PostSync is commonly used for
      smoke tests after the sync completes.
    ref: "concepts.md#sync-waves-phases-and-hooks"

  - id: gitops-continuous-delivery-026
    difficulty: advanced
    tags: [sync-waves, hooks, distinction]
    question: |
      What's the key distinction between sync waves and resource hooks in Argo CD?
    options:
      - "They are two names for the same feature; Argo CD internally translates every sync-wave annotation into an equivalent PreSync hook"
      - "Hooks order the resources you're already applying by phase, while waves inject the extra migration and smoke-test Jobs around the sync"
      - "Waves order the resources you're already applying; hooks inject extra lifecycle Jobs at phases like PreSync/PostSync"
      - "Waves are only honored for Helm-rendered manifests, whereas hooks are only honored for resources built by Kustomize overlays"
    answer: 2
    explanation: |
      Waves control the ordering of the resources included in your sync. Hooks add extra
      lifecycle steps (typically Jobs) around the sync at PreSync/Sync/PostSync/SyncFail — e.g. a
      migration or a smoke test.
    ref: "concepts.md#sync-waves-phases-and-hooks"

  - id: gitops-continuous-delivery-027
    difficulty: advanced
    tags: [hooks, hook-delete-policy, cleanup]
    question: |
      What does `argocd.argoproj.io/hook-delete-policy: HookSucceeded` do?
    options:
      - "Prevents the hook from running at all until its parent resource reports HookSucceeded status"
      - "Deletes the hook resource (e.g. the migration Job) once it completes successfully"
      - "Automatically re-runs the hook resource on a backoff loop until the hook Job finally succeeds"
      - "Marks the entire Application as Synced and Healthy the moment this hook resource succeeds"
    answer: 1
    explanation: |
      The hook-delete-policy controls when the hook resource is cleaned up. HookSucceeded deletes it
      after a successful run; other values include HookFailed and BeforeHookCreation.
    ref: "concepts.md#sync-waves-phases-and-hooks"

  - id: gitops-continuous-delivery-028
    difficulty: intermediate
    tags: [argocd, health, sync-status]
    question: |
      In Argo CD, how do "sync status" and "health status" differ?
    options:
      - "They are identical readouts; Argo CD shows the same value under two different column names in the UI"
      - "Sync status reports the resource's live CPU utilization while health status reports its current memory consumption"
      - "Sync status is only computed for Helm-sourced Applications, while health status is only computed for Kustomize ones"
      - "Sync status = does live match Git; health = is the resource actually working"
    answer: 3
    explanation: |
      Sync status (Synced/OutOfSync) answers whether live matches Git. Health (Healthy/Progressing/
      Degraded/etc.) answers whether the resource is actually functioning. Waves wait on health,
      not just apply.
    ref: "concepts.md#health-assessment-in-argo-cd"

  - id: gitops-continuous-delivery-029
    difficulty: intermediate
    tags: [argocd, health, deployment]
    question: |
      A Service of type LoadBalancer has been applied but has no external IP yet. What health status
      does Argo CD most likely report for it?
    options:
      - "Healthy"
      - "Degraded"
      - "Progressing"
      - "Missing"
    answer: 2
    explanation: |
      Argo CD's built-in health check marks a LoadBalancer Service Progressing until it obtains an
      external IP/hostname, then Healthy. Degraded is for failures; Missing is for absent resources.
    ref: "concepts.md#health-assessment-in-argo-cd"

  - id: gitops-continuous-delivery-030
    difficulty: advanced
    tags: [argocd, health, lua, crd]
    question: |
      You deploy a custom resource (say an Argo Rollouts `Rollout` or a cert-manager
      `Certificate`) and Argo CD doesn't know when it's "ready." How do you teach it?
    options:
      - "Write a Lua health check for that resource kind"
      - "Set prune: true"
      - "Add a sync-wave annotation"
      - "There is no way; custom resources are always Unknown"
    answer: 0
    explanation: |
      Argo CD supports custom Lua health checks so it can assess CRD health. It ships built-in
      checks for common kinds (and for Rollout), but for arbitrary CRDs you provide a Lua script.
    ref: "concepts.md#health-assessment-in-argo-cd"

  - id: gitops-continuous-delivery-031
    difficulty: beginner
    tags: [flux, toolkit, controllers]
    question: |
      How is Flux (v2) structured compared to Argo CD's single Application CRD?
    options:
      - "It also centers on a single all-in-one CRD, a Flux 'Deployment' object that mirrors Argo CD's Application one-for-one"
      - "It uses no CRDs at all, driving everything from a flat flux-system ConfigMap read by one monolithic controller"
      - "It is a set of composable controllers (the GitOps Toolkit), each with its own CRDs"
      - "It is operated exclusively through a hosted web UI, with no CLI or custom resources exposed to users"
    answer: 2
    explanation: |
      Flux v2 is the GitOps Toolkit: source-controller, kustomize-controller, helm-controller,
      notification-controller, and image controllers, each with dedicated CRDs. It's a toolkit you
      assemble rather than one Application object.
    ref: "concepts.md#flux-the-gitops-toolkit"

  - id: gitops-continuous-delivery-032
    difficulty: intermediate
    tags: [flux, gitrepository, kustomization]
    question: |
      In a minimal Flux setup, which two CRDs together fetch the repo and apply a path of manifests?
    options:
      - "Application and AppProject"
      - "GitRepository (source) and Kustomization (apply)"
      - "HelmRepository and Rollout"
      - "ImagePolicy and Alert"
    answer: 1
    explanation: |
      A GitRepository (from source-controller) fetches and verifies the repo; a Kustomization (from
      kustomize-controller) builds and applies a path, with prune and health-wait options.
    ref: "concepts.md#flux-the-gitops-toolkit"

  - id: gitops-continuous-delivery-033
    difficulty: intermediate
    tags: [flux, helmrelease, helm-controller]
    question: |
      Which Flux CRD is used to reconcile a Helm release?
    options:
      - "Kustomization"
      - "GitRepository"
      - "HelmRelease"
      - "Alert"
    answer: 2
    explanation: |
      The helm-controller reconciles HelmRelease CRs, driving Helm installs/upgrades declaratively.
      Chart sources come from a HelmRepository, OCIRepository, or GitRepository.
    ref: "concepts.md#flux-the-gitops-toolkit"

  - id: gitops-continuous-delivery-034
    difficulty: advanced
    tags: [flux, dependson, ordering]
    question: |
      How does Flux express that one Kustomization must reconcile only after another has succeeded?
    options:
      - "A sync-wave annotation"
      - "A PreSync hook"
      - "The AppProject spec"
      - "The `dependsOn` field on the Kustomization"
    answer: 3
    explanation: |
      Flux Kustomizations (and HelmReleases) use the `dependsOn` field to declare ordering
      dependencies, combined with health `wait`. Sync waves and PreSync hooks are Argo CD concepts.
    ref: "concepts.md#flux-the-gitops-toolkit"

  - id: gitops-continuous-delivery-035
    difficulty: intermediate
    tags: [flux, image-automation, git-writeback]
    question: |
      What is distinctive about Flux's image automation feature?
    options:
      - "It rebuilds images inside the cluster"
      - "It deletes old images from the registry"
      - "It scans a registry for new tags and commits the updated tag back into the Git repo"
      - "It applies image tags directly to the cluster, bypassing Git"
    answer: 2
    explanation: |
      Flux's image-reflector/image-automation controllers scan the registry, pick a tag per an
      ImagePolicy, and commit the new tag into Git via ImageUpdateAutomation — keeping Git the
      source of truth for image bumps.
    ref: "concepts.md#flux-image-automation"

  - id: gitops-continuous-delivery-036
    difficulty: advanced
    tags: [flux, imagepolicy, semver]
    question: |
      A Flux `ImagePolicy` uses `semver: { range: ">=1.0.0 <2.0.0" }`. What does it select?
    options:
      - "The oldest published tag in the registry repository"
      - "The newest tag matching that semver range"
      - "Only tags whose name literally contains the word 'latest'"
      - "Every tag at once, deploying them as parallel canaries"
    answer: 1
    explanation: |
      An ImagePolicy with a semver range selects the newest tag satisfying the range. Other policy
      types include numerical and regex/alphabetical (useful for commit-timestamp tag schemes).
    ref: "concepts.md#flux-image-automation"

  - id: gitops-continuous-delivery-037
    difficulty: advanced
    tags: [argocd, image-updater, comparison]
    question: |
      How does Argo CD achieve automated image updates comparable to Flux's native feature?
    options:
      - "It cannot; Argo CD deliberately has no image-update capability and delegates all tag bumps to CI"
      - "By running an embedded Flux image-reflector controller inside the Argo CD application-controller pod"
      - "Via the separate Argo CD Image Updater add-on, which writes back to Git or annotates the Application"
      - "Through an imageUpdatePolicy field on the AppProject spec that scans registries on a fixed interval"
    answer: 2
    explanation: |
      Argo CD uses the separate Image Updater add-on, which can write new tags back to Git or set
      Application parameter overrides. Flux, by contrast, has image automation as a first-class
      part of its toolkit.
    ref: "concepts.md#flux-image-automation"

  - id: gitops-continuous-delivery-038
    difficulty: intermediate
    tags: [argocd-vs-flux, ui, comparison]
    question: |
      Which statement about Argo CD versus Flux is accurate?
    options:
      - "Argo CD ships a rich built-in web UI; Flux has no official UI and is CLI/CRD-first"
      - "Flux ships the official dashboard while Argo CD offers only a headless CLI with no web UI"
      - "Neither is a CNCF project; both remain vendor-owned tools outside the foundation's governance"
      - "Only Flux supports Helm charts; Argo CD is restricted to plain Kustomize overlays exclusively"
    answer: 0
    explanation: |
      Argo CD provides a rich built-in web UI with SSO/RBAC. Flux is CLI/CRD-first with no official
      UI (third-party dashboards exist). Both are CNCF graduated and both support Helm and Kustomize.
    ref: "concepts.md#argo-cd-vs-flux"

  - id: gitops-continuous-delivery-039
    difficulty: intermediate
    tags: [argocd-vs-flux, multi-cluster]
    question: |
      For centralized multi-cluster management with a portal-style UI and templated fan-out across
      clusters, which tool + feature combination is typically favored?
    options:
      - "Flux with per-cluster agents"
      - "Argo CD with ApplicationSet"
      - "Push-based Jenkins pipelines"
      - "kubectl apply from a laptop"
    answer: 1
    explanation: |
      Argo CD's hub model (one Argo CD → many clusters) plus ApplicationSet generators makes it a
      common choice for platform teams offering a central UI and programmatic multi-cluster fan-out.
      Flux more commonly runs as a per-cluster agent.
    ref: "concepts.md#argo-cd-vs-flux"

  - id: gitops-continuous-delivery-040
    difficulty: beginner
    tags: [argocd-vs-flux, cncf]
    question: |
      What is true of both Argo CD and Flux regarding CNCF maturity and delivery model?
    options:
      - "Both are CNCF graduated projects implementing pull-based GitOps"
      - "Both are push-based CD tools that run kubectl against the cluster from an external pipeline"
      - "Both remain CNCF sandbox-only projects that have never advanced to incubating or graduated"
      - "Both require an Istio or Linkerd service mesh to be installed before they can reconcile anything"
    answer: 0
    explanation: |
      Argo CD and Flux are both CNCF graduated projects, and both implement pull-based GitOps well.
      The choice between them is about ergonomics and team model, not core capability.
    ref: "concepts.md#argo-cd-vs-flux"

  - id: gitops-continuous-delivery-041
    difficulty: intermediate
    tags: [promotion, directory-per-env, kustomize]
    question: |
      Which environment-promotion structure is generally favored in modern GitOps and why?
    options:
      - "Branch-per-environment, because long-lived env branches guarantee conflict-free fast-forward merges every time"
      - "One giant concatenated file holding every environment's manifests, because a single diff shows all changes together"
      - "No structure at all; you simply edit the prod manifests in place since overlays add needless indirection"
      - "Directory-per-environment (Kustomize overlays / Helm values), because all envs are visible in one diff and there's no branch drift"
    answer: 3
    explanation: |
      Directory-per-environment with Kustomize overlays or Helm per-env values keeps envs DRY and
      visible in a single branch/diff, avoiding the branch-drift and messy merges that plague
      branch-per-environment.
    ref: "concepts.md#environment-promotion-patterns"

  - id: gitops-continuous-delivery-042
    difficulty: intermediate
    tags: [promotion, branch-per-env, drift]
    question: |
      What is the main downside of the branch-per-environment promotion pattern for Kubernetes
      config?
    options:
      - "Config can drift between branches and merges get messy; the community has largely moved away from it for envs"
      - "It cannot use Git at all and forces you to track environment config in an external database instead"
      - "It requires a fully configured service mesh before any environment branch can be reconciled to a cluster"
      - "It only works with Argo CD and is completely unsupported by Flux's kustomize-controller reconciler"
    answer: 0
    explanation: |
      Branch-per-environment risks config drift between long-lived branches and painful merges.
      Directory/overlay-per-environment is now preferred for envs (branches remain fine for app
      code development).
    ref: "concepts.md#environment-promotion-patterns"

  - id: gitops-continuous-delivery-043
    difficulty: intermediate
    tags: [promotion, mechanism, pr]
    question: |
      In a directory-per-environment GitOps repo, what is the actual mechanism of "promoting" a
      release from staging to prod?
    options:
      - "SSH into the prod nodes and manually restart every pod so they re-pull the newer image layers"
      - "Deleting the staging namespace so its tested workloads are recreated automatically inside prod"
      - "A PR that bumps the image tag / values in the prod overlay to match staging"
      - "Running helm rollback on prod to advance the release to the next tested chart revision"
    answer: 2
    explanation: |
      Promotion is a Git change — typically a reviewable PR that copies/bumps the tested image tag
      or values into the next environment's overlay. The agent then reconciles that env.
    ref: "concepts.md#environment-promotion-patterns"

  - id: gitops-continuous-delivery-044
    difficulty: beginner
    tags: [argo-rollouts, progressive-delivery, deployment]
    question: |
      Why can't a plain Kubernetes Deployment do a metric-gated canary with automatic rollback?
    options:
      - "Deployments only support the Recreate strategy and cannot roll pods gradually one at a time"
      - "A Deployment only offers RollingUpdate/Recreate — no traffic-weighted canary, metric analysis, or auto-rollback"
      - "Deployments cannot use readiness probes, so they have no signal to gate a canary's progress on"
      - "Deployments require a service mesh to be installed before any of their pods will start at all"
    answer: 1
    explanation: |
      A Deployment's built-in strategies are RollingUpdate and Recreate. Progressive delivery
      (weighted canary, analysis of live metrics, automatic rollback) needs extra tooling like Argo
      Rollouts or Flagger.
    ref: "concepts.md#progressive-delivery-with-argo-rollouts"

  - id: gitops-continuous-delivery-045
    difficulty: intermediate
    tags: [argo-rollouts, rollout-crd, canary]
    question: |
      What is the Argo Rollouts `Rollout` CRD best described as?
    options:
      - "A replacement for the Service object that load-balances traffic across canary and stable pods"
      - "A CRD that stores encrypted secrets and injects them into the canary pods during a rollout"
      - "A tool for building container images from source and pushing them ahead of each canary step"
      - "A drop-in replacement for a Deployment that adds canary/blue-green with analysis and auto-rollback"
    answer: 3
    explanation: |
      The Rollout CRD replaces a Deployment (same pod template) but adds fine-grained canary and
      blue-green strategies, traffic management, and AnalysisTemplate/AnalysisRun-driven automatic
      rollback.
    ref: "concepts.md#progressive-delivery-with-argo-rollouts"

  - id: gitops-continuous-delivery-046
    difficulty: advanced
    tags: [argo-rollouts, analysis, abort]
    question: |
      During an Argo Rollouts canary, an `AnalysisRun` querying Prometheus finds the success rate
      has dropped below threshold. What happens?
    options:
      - "The rollout continues to 100% anyway and simply records the failed metric as a warning event"
      - "The AnalysisRun result is ignored and a human is paged to decide whether to keep promoting"
      - "The rollout is aborted: traffic snaps back to the stable version and the canary Pods scale down"
      - "Git is automatically reverted to the prior commit by the Rollout controller to undo the change"
    answer: 2
    explanation: |
      A failing AnalysisRun aborts the rollout: traffic returns to the stable version and canary
      Pods are scaled down — automatic in-cluster rollback. You still fix Git to change the declared
      desired state.
    ref: "concepts.md#progressive-delivery-with-argo-rollouts"

  - id: gitops-continuous-delivery-047
    difficulty: advanced
    tags: [argo-rollouts, argocd, health, lua]
    question: |
      When Argo CD manages an Argo Rollouts `Rollout`, why does health assessment need special
      handling?
    options:
      - "Rollouts cannot be stored in Git, so Argo CD has to poll the Rollouts controller API directly"
      - "A Rollout isn't a standard Deployment, so Argo CD relies on a Lua health check (bundled by default) to know when it's healthy"
      - "Rollouts always report Unknown health and there is no supported mechanism to teach Argo CD otherwise"
      - "Argo CD self-heal must be disabled cluster-wide before any Rollout resource can be reconciled"
    answer: 1
    explanation: |
      Because a Rollout is a CRD, not a built-in Deployment, Argo CD uses a Lua health check to
      assess it. That check ships bundled with Argo CD, so it typically works out of the box.
    ref: "concepts.md#progressive-delivery-with-argo-rollouts"

  - id: gitops-continuous-delivery-048
    difficulty: intermediate
    tags: [flagger, canary-crd, wraps-deployment]
    question: |
      How does Flagger differ from Argo Rollouts in how it integrates with your workload?
    options:
      - "Flagger wraps an existing Deployment with a `Canary` CR and manages primary/canary copies"
      - "Flagger replaces the Deployment with its own Rollout-style CRD, exactly as Argo Rollouts does"
      - "Flagger only works with StatefulSets and refuses to manage a plain Deployment workload at all"
      - "Flagger requires you to delete the existing Deployment first and recreate it under its control"
    answer: 0
    explanation: |
      Flagger keeps your existing Deployment and wraps it with a Canary CR; it creates primary and
      canary copies and shifts traffic via a mesh/ingress. Argo Rollouts instead replaces the
      Deployment with a Rollout CRD.
    ref: "concepts.md#progressive-delivery-with-flagger"

  - id: gitops-continuous-delivery-049
    difficulty: advanced
    tags: [flagger, traffic-router, mesh]
    question: |
      Both Flagger and Argo Rollouts need what in order to do true percentage-based traffic
      canaries?
    options:
      - "A traffic router — a service mesh (Istio/Linkerd) or a compatible ingress/Gateway API"
      - "A dedicated GPU node pool that the canary analysis controller schedules its metric queries onto"
      - "A second standby Kubernetes cluster that receives the canary traffic split away from production"
      - "A push-based CI pipeline that recalculates and reapplies the traffic weights on every commit"
    answer: 0
    explanation: |
      Percentage-based traffic shifting requires a traffic router: a service mesh (Istio, Linkerd,
      App Mesh) or a compatible ingress / Gateway API. Without one, you fall back to
      replica-count-based approximation.
    ref: "concepts.md#progressive-delivery-with-flagger"

  - id: gitops-continuous-delivery-050
    difficulty: beginner
    tags: [rollback, git-revert, gitops]
    question: |
      In a GitOps workflow, what is the canonical way to roll back a bad release?
    options:
      - "Run kubectl rollout undo on every affected Deployment to step it back to the prior ReplicaSet"
      - "Delete the whole namespace and recreate it so the previous known-good manifests are reapplied"
      - "SSH into each node and restart the containers so they re-pull the last working image tag"
      - "git revert the bad commit and let the agent reconcile the cluster back"
    answer: 3
    explanation: |
      Because Git is the desired state, rollback means changing Git back — typically git revert
      (a new commit undoing the change) — after which the agent reconciles the cluster to the
      previous manifests.
    ref: "concepts.md#rollback-via-git-revert"

  - id: gitops-continuous-delivery-051
    difficulty: advanced
    tags: [rollback, self-heal, drift]
    question: |
      With Argo CD auto-sync and selfHeal enabled, an engineer runs `kubectl rollout undo` to
      revert a bad Deployment. What is the outcome?
    options:
      - "The rollback is permanent because a manual rollout undo pins the ReplicaSet against reconciliation"
      - "Argo CD detects drift and re-applies the bad Git state — the manual undo is not durable"
      - "Argo CD updates Git to the older revision automatically to match the engineer's manual rollback"
      - "The Deployment is deleted outright because its live spec no longer matches the tracked source"
    answer: 1
    explanation: |
      selfHeal reverts anything that diverges from Git. A manual rollout undo diverges from the
      (still-bad) Git state, so the agent pushes it back. The only durable rollback is a Git change.
    ref: "concepts.md#rollback-via-git-revert"

  - id: gitops-continuous-delivery-052
    difficulty: intermediate
    tags: [rollback, git-revert, reset]
    question: |
      Why is `git revert` preferred over `git reset --hard` / force-push for GitOps rollbacks?
    options:
      - "revert is faster to type and needs fewer flags than a hard reset with a force-push afterward"
      - "reset works only on private repos, whereas revert is the only command allowed on shared remotes"
      - "revert preserves history with a new forward commit, keeping the rollback auditable and avoiding rewriting shared history"
      - "revert automatically restores any PersistentVolumes that were deleted by the reverted change"
    answer: 2
    explanation: |
      git revert creates a new commit that undoes the change, keeping linear, auditable, forward-
      only history. Force-pushing a reset rewrites shared history, which is dangerous for a repo
      multiple people and agents track.
    ref: "concepts.md#rollback-via-git-revert"

  - id: gitops-continuous-delivery-053
    difficulty: beginner
    tags: [secrets, base64, security]
    question: |
      Why is committing a raw Kubernetes `Secret` (as generated by kubectl) into a Git repo unsafe?
    options:
      - "Secrets can't be represented as YAML manifests, so they never round-trip cleanly through Git"
      - "A Secret's data is only base64-encoded, not encrypted — anyone with repo access can decode it"
      - "Git cannot store the binary data blocks that Secret objects hold, so the values get corrupted"
      - "Secrets are always larger than Git's per-file size limit and get rejected on push to the remote"
    answer: 1
    explanation: |
      Kubernetes Secrets are base64-encoded, not encrypted. base64 is trivially reversible
      (`base64 -d`), so committing one to Git leaks the credential to anyone with read access.
    ref: "concepts.md#secrets-in-gitops"

  - id: gitops-continuous-delivery-054
    difficulty: intermediate
    tags: [secrets, sealed-secrets, kubeseal]
    question: |
      How do Bitnami Sealed Secrets let you safely store secrets in Git?
    options:
      - "They base64-encode the secret twice"
      - "They store the secret in etcd and put a pointer in Git"
      - "They disable RBAC on the namespace"
      - "You encrypt with a public key (kubeseal) into a SealedSecret; only the cluster's controller (holding the private key) can decrypt it into a real Secret"
    answer: 3
    explanation: |
      kubeseal encrypts the secret with the controller's public key into a SealedSecret CR that's
      safe to commit. Only that cluster's controller, holding the private key, can decrypt it into a
      real Secret, and encryption is scoped to namespace/name.
    ref: "concepts.md#secrets-in-gitops"

  - id: gitops-continuous-delivery-055
    difficulty: intermediate
    tags: [secrets, external-secrets, eso]
    question: |
      With the External Secrets Operator (ESO), what actually lives in Git?
    options:
      - "Only a reference (ExternalSecret) pointing at an external secrets manager; ESO fetches the value at runtime"
      - "The full ciphertext of the secret value, encrypted client-side with the operator's key before commit"
      - "The plaintext secret value in an ordinary Secret manifest, protected only by repository-level RBAC"
      - "Nothing secret-related at all; ESO keeps every value out of Git and injects them via CLI flags instead"
    answer: 0
    explanation: |
      ESO puts only an ExternalSecret reference in Git, pointing at AWS Secrets Manager/Vault/etc.
      ESO fetches the real value at runtime and creates the Secret — no ciphertext in Git at all.
    ref: "concepts.md#secrets-in-gitops"

  - id: gitops-continuous-delivery-056
    difficulty: advanced
    tags: [secrets, sops, flux, argocd]
    question: |
      Regarding SOPS-encrypted manifests, which statement is correct?
    options:
      - "SOPS encrypts entire files including keys, making them unreadable"
      - "SOPS only operates on plaintext base64 blobs and cannot integrate with KMS, age, or PGP backends"
      - "Flux can decrypt SOPS natively, while Argo CD needs a plugin like ksops or helm-secrets"
      - "Argo CD decrypts SOPS natively out of the box, whereas Flux has no support for SOPS at all"
    answer: 2
    explanation: |
      SOPS encrypts the values in a YAML/JSON file while keeping keys readable, using KMS/PGP/age.
      Flux decrypts SOPS-encrypted manifests natively; with Argo CD you add a plugin such as ksops
      or helm-secrets.
    ref: "concepts.md#secrets-in-gitops"

  - id: gitops-continuous-delivery-057
    difficulty: intermediate
    tags: [gitops, general-principle, cross-reference]
    question: |
      Where does this topic point you for the general GitOps principle and push-based CI/CD
      pipeline concepts (as opposed to K8s-specific application)?
    options:
      - "The docker domain (image builds and registry push are where general CI/CD pipelines are covered)"
      - "The observability domain (deployment pipelines are documented alongside metrics and tracing there)"
      - "The storage-volumes-pv-pvc topic (persistent-volume rollout is where push-based CD concepts live)"
      - "The devops-cicd domain (gitops and deployment-strategies)"
    answer: 3
    explanation: |
      This topic covers GitOps as applied to Kubernetes. The general GitOps principle, deployment
      strategies as concepts, and push-based CI/CD pipelines live in the devops-cicd domain.
    ref: "concepts.md#gitops-applied-to-kubernetes"

  - id: gitops-continuous-delivery-058
    difficulty: advanced
    tags: [reconciliation, outofsync, troubleshooting]
    question: |
      An Argo CD Application is perpetually OutOfSync on a field you never set in Git, and toggling
      selfHeal doesn't help. What is the most likely cause and remedy?
    options:
      - "The config repo's Git history is corrupted; delete the local cache and force a fresh re-clone to fix it"
      - "Another controller/webhook owns that field (e.g. HPA, a mutating admission webhook); use ignoreDifferences or remove the contested field from Git"
      - "The cluster's nodes are out of disk, so the diff never completes; add capacity and the field will re-sync"
      - "The installed Application CRD is a stale schema version; downgrade Argo CD until the field stops drifting"
    answer: 1
    explanation: |
      Perpetual OutOfSync on a field you don't manage usually means another actor writes it (HPA on
      replicas, a mutating webhook, a controller-written field). Configure ignoreDifferences for
      that field or drop it from Git so the other owner controls it.
    ref: "concepts.md#reconciliation-diffing-and-drift-detection"
