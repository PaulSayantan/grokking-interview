topic: "Cluster Installation, Upgrades & Lifecycle"
domain: kubernetes
topic_slug: cluster-installation-upgrades
version: 1
questions:
  - id: cluster-installation-upgrades-001
    difficulty: beginner
    tags: [cluster-creation, managed, eks-gke-aks]
    question: |
      With a managed Kubernetes offering (EKS, GKE, AKS), which part does the
      cloud provider run and patch for you?
    options:
      - "Your application workloads, their container images, and runtime configs"
      - "Your RBAC roles, NetworkPolicies, and cluster authorization settings"
      - "The worker-node operating system packages and kernel security patches"
      - "The control plane (apiserver, etcd, scheduler, controller-manager)"
    answer: 3
    explanation: |
      A managed control plane means the provider operates and patches the apiserver, etcd
      (with automated backups), scheduler, and controller-manager. You still own the worker
      nodes, your workloads, and cluster-level config like RBAC and NetworkPolicy.
    ref: "concepts.md#cluster-creation-options-managed-self-managed-and-local"

  - id: cluster-installation-upgrades-002
    difficulty: beginner
    tags: [cluster-creation, local, kind, minikube]
    question: |
      You want a throwaway multi-node Kubernetes cluster inside CI that starts fast and
      needs no VMs. Which tool runs each "node" as a container?
    options:
      - "minikube (VM-backed single node)"
      - "kubeadm (bootstraps real clusters)"
      - "kind (Kubernetes IN Docker)"
      - "k3s (lightweight edge distro)"
    answer: 2
    explanation: |
      kind runs each node as a Docker container, making it ideal for CI and testing
      Kubernetes itself with multi-node topologies. minikube typically uses a VM or single
      container; kubeadm bootstraps real clusters; k3s is a lightweight production distro.
    ref: "concepts.md#cluster-creation-options-managed-self-managed-and-local"

  - id: cluster-installation-upgrades-003
    difficulty: intermediate
    tags: [cluster-creation, k3s, edge]
    question: |
      Which statement about k3s is most accurate?
    options:
      - "It is a lightweight, production-capable Kubernetes distribution suited to edge/IoT"
      - "It is a dev-only local tool like minikube that cannot run any production workloads"
      - "It is Amazon's fully managed Kubernetes control-plane service running in the cloud"
      - "It is a low-level OCI container runtime that replaces containerd on every node"
    answer: 0
    explanation: |
      k3s is a lightweight but production-capable distribution (single small binary, optional
      SQLite or etcd datastore) aimed at edge, IoT, and resource-constrained environments — not
      merely a local dev toy like kind/minikube.
    ref: "concepts.md#cluster-creation-options-managed-self-managed-and-local"

  - id: cluster-installation-upgrades-004
    difficulty: intermediate
    tags: [cluster-creation, self-managed, on-prem]
    question: |
      For an air-gapped, on-premises data center where you need full control of the control
      plane and cannot use a cloud provider, which approach fits best?
    options:
      - "Managed control plane (EKS/GKE/AKS)"
      - "minikube installed on each physical server"
      - "Self-managed via kubeadm or Cluster API"
      - "Use kind containers in production"
    answer: 2
    explanation: |
      Air-gapped/on-prem clusters where you must own the control plane call for a self-managed
      approach such as kubeadm or Cluster API. Managed offerings require a cloud; minikube/kind
      are dev tools not intended for production data centers.
    ref: "concepts.md#cluster-creation-options-managed-self-managed-and-local"

  - id: cluster-installation-upgrades-005
    difficulty: beginner
    tags: [kubeadm, bootstrap, init-join]
    question: |
      In a kubeadm-based cluster, what is the role of `kubeadm join`?
    options:
      - "It installs and configures the CNI pod-network plugin"
      - "It upgrades the control-plane components to a newer minor version"
      - "It adds a new control-plane or worker node to an existing cluster"
      - "It takes a point-in-time etcd snapshot for backup"
    answer: 2
    explanation: |
      `kubeadm init` bootstraps the first control-plane node; `kubeadm join` adds additional
      control-plane or worker nodes using a bootstrap token and the CA cert hash. CNI install,
      upgrades, and etcd backup are separate steps.
    ref: "concepts.md#bootstrapping-a-cluster-with-kubeadm-init-and-join"

  - id: cluster-installation-upgrades-006
    difficulty: intermediate
    tags: [kubeadm, cni, coredns, gotcha]
    question: |
      You just ran `kubeadm init` successfully, but the Nodes show `NotReady` and CoreDNS Pods
      are stuck `Pending`. What is the most likely cause?
    options:
      - "etcd lost quorum and cannot commit any writes"
      - "The kubelet client certificates expired during init"
      - "kube-proxy failed to start on the control-plane node"
      - "No CNI network plugin has been installed yet"
    answer: 3
    explanation: |
      kubeadm deliberately does not install a pod-network (CNI) plugin. Until you apply one
      (Calico, Cilium, Flannel, etc.), Pods cannot get IPs, nodes stay NotReady, and CoreDNS
      remains Pending. Installing a CNI is a required post-init step.
    ref: "concepts.md#bootstrapping-a-cluster-with-kubeadm-init-and-join"

  - id: cluster-installation-upgrades-007
    difficulty: intermediate
    tags: [kubeadm, static-pods, control-plane]
    question: |
      How does a kubeadm control-plane node run the apiserver, scheduler, controller-manager,
      and etcd?
    options:
      - "As individual systemd unit services managed directly by systemctl on the host"
      - "As standard Deployments with replicas scheduled into the kube-system namespace"
      - "As static Pods defined by manifests in /etc/kubernetes/manifests that the kubelet watches"
      - "As bare host processes launched and continuously supervised by the kubeadm daemon"
    answer: 2
    explanation: |
      kubeadm writes static Pod manifests to /etc/kubernetes/manifests/. The kubelet watches
      that directory and runs those components as static Pods — which is how the control plane
      bootstraps before any higher-level controllers exist.
    ref: "concepts.md#bootstrapping-a-cluster-with-kubeadm-init-and-join"

  - id: cluster-installation-upgrades-008
    difficulty: advanced
    tags: [kubeadm, etcd, ha-topology]
    question: |
      What distinguishes a "stacked etcd" topology from an "external etcd" topology in a
      kubeadm HA cluster?
    options:
      - "Stacked etcd runs on the same control-plane nodes; external etcd runs on separate hosts"
      - "Stacked etcd uses an embedded SQLite datastore; external etcd requires a PostgreSQL backend"
      - "Stacked etcd serves only read requests; external etcd handles both reads and writes"
      - "There is no real difference; the two terms are fully interchangeable in kubeadm docs"
    answer: 0
    explanation: |
      In a stacked topology each control-plane node also runs an etcd member (co-located, simpler,
      fewer hosts). External etcd runs on dedicated hosts so etcd and the apiserver fail
      independently — preferred for large or critical clusters.
    ref: "concepts.md#bootstrapping-a-cluster-with-kubeadm-init-and-join"

  - id: cluster-installation-upgrades-009
    difficulty: advanced
    tags: [kubeadm, cgroup-driver, runtime, gotcha]
    question: |
      A freshly provisioned node's kubelet fails to start after `kubeadm join`, logging that
      the container runtime is unreachable or the cgroup driver mismatches. Which is a valid
      root cause?
    options:
      - "The node was provisioned with an odd number of CPU cores kubelet rejects"
      - "The kubelet and container runtime are configured with different cgroup drivers (systemd vs cgroupfs)"
      - "The bootstrap join token string exceeded the 24-character maximum length"
      - "CoreDNS Pods happened to be scheduled onto the node before kube-proxy started"
    answer: 1
    explanation: |
      The kubelet and the CRI runtime must agree on the cgroup driver (both systemd or both
      cgroupfs); a mismatch prevents the kubelet from starting. A reachable CRI runtime is also
      required — since v1.24 there is no dockershim, so containerd/CRI-O must be configured.
    ref: "concepts.md#bootstrapping-a-cluster-with-kubeadm-init-and-join"

  - id: cluster-installation-upgrades-010
    difficulty: beginner
    tags: [etcd, backup, disaster-recovery]
    question: |
      Why is backing up etcd considered the single most critical disaster-recovery task for a
      self-managed cluster?
    options:
      - "etcd stores the pulled container images for every workload on the cluster"
      - "etcd holds all cluster state; without a snapshot, lost etcd data means the cluster is unrecoverable"
      - "etcd caches the DNS records that CoreDNS serves to cluster Pods"
      - "etcd stores the aggregated kubelet and container stdout log files"
    answer: 1
    explanation: |
      etcd is the consistent key-value store holding every Kubernetes object — the entire
      desired state. Lose it with no snapshot and the control plane's memory is gone. Images live
      in registries, not etcd; logs and DNS are elsewhere.
    ref: "concepts.md#the-etcd-datastore-backup-and-restore"

  - id: cluster-installation-upgrades-011
    difficulty: intermediate
    tags: [etcd, etcdctl, snapshot]
    question: |
      Which command takes a point-in-time backup of etcd?
    options:
      - "kubectl get etcd --export -o yaml > /backup/etcd-snapshot.yaml"
      - "kubeadm etcd backup --data-dir /var/lib/etcd /backup/snapshot.db"
      - "etcdctl snapshot save /backup/etcd-snapshot.db (with the API v3 endpoint and certs)"
      - "etcdctl member remove <member-id> --data-dir /var/lib/etcd"
    answer: 2
    explanation: |
      `ETCDCTL_API=3 etcdctl snapshot save <file>` (pointed at the etcd endpoint with its CA,
      cert, and key) creates a point-in-time snapshot. `member remove` alters cluster membership;
      the others are not real commands.
    ref: "concepts.md#the-etcd-datastore-backup-and-restore"

  - id: cluster-installation-upgrades-012
    difficulty: advanced
    tags: [etcd, restore, granularity]
    question: |
      A teammate asks you to "restore just the payments namespace" from last night's etcd
      snapshot. What is the correct thing to tell them?
    options:
      - "Run etcdctl snapshot restore --namespace=payments to scope the restore to that namespace"
      - "kubectl apply the raw snapshot .db file directly to recreate just those objects"
      - "An etcd snapshot restore is all-or-nothing; it rolls the whole cluster back — use Velero for selective restore"
      - "Restore is fundamentally impossible once the namespace objects have been deleted"
    answer: 2
    explanation: |
      An etcd snapshot restores the entire cluster state to that point in time — it cannot
      restore a single namespace. For selective/object-level restore (and PV data) you use a
      tool like Velero. This is a key limitation to know.
    ref: "concepts.md#the-etcd-datastore-backup-and-restore"

  - id: cluster-installation-upgrades-013
    difficulty: advanced
    tags: [etcd, restore, process]
    question: |
      Restoring an etcd snapshot in a kubeadm cluster is best described as:
    options:
      - "A live, online operation that hot-swaps the data directory with zero control-plane downtime"
      - "An automatic recovery that is triggered whenever a workload Pod crashes and restarts"
      - "Done by manually editing the stored objects directly inside the running etcd static Pod"
      - "An offline operation: stop apiserver/etcd, restore into a new data dir, repoint etcd, restart"
    answer: 3
    explanation: |
      Restore is offline: you stop the apiserver and etcd, run `etcdutl snapshot restore` into a
      fresh data directory, update the etcd static Pod manifest to point at it, and restart.
      Everything created after the snapshot is lost, so snapshot frequency matters.
    ref: "concepts.md#the-etcd-datastore-backup-and-restore"

  - id: cluster-installation-upgrades-014
    difficulty: beginner
    tags: [etcd, quorum, raft]
    question: |
      etcd uses the Raft consensus protocol. To accept writes it requires:
    options:
      - "A majority (quorum) of members to be available"
      - "Every single configured member to be online and healthy"
      - "Exactly one leader running with zero follower members"
      - "At least one etcd member present in each cloud region"
    answer: 0
    explanation: |
      Raft needs a majority (quorum = floor(N/2)+1) of members available to commit writes. It
      does not need all members, and it does need followers. If quorum is lost, etcd cannot
      accept writes.
    ref: "concepts.md#etcd-quorum-and-high-availability"

  - id: cluster-installation-upgrades-015
    difficulty: intermediate
    tags: [etcd, quorum, sizing]
    question: |
      Why do etcd clusters use an odd number of members (e.g. 3 or 5) rather than even?
    options:
      - "Even member counts are outright rejected by the etcd binary at startup"
      - "Odd member numbers make CoreDNS resolution measurably faster for clients"
      - "Even-numbered clusters can never successfully elect a Raft leader"
      - "A 4-member cluster tolerates the same single failure as 3 but with a larger quorum to lose — no gain"
    answer: 3
    explanation: |
      Fault tolerance is floor((N-1)/2). A 4-member cluster tolerates only 1 failure — same as 3 —
      while needing a bigger quorum, so it is strictly worse. Odd counts (3, 5, 7) give the best
      availability per node.
    ref: "concepts.md#etcd-quorum-and-high-availability"

  - id: cluster-installation-upgrades-016
    difficulty: intermediate
    tags: [etcd, quorum, fault-tolerance]
    question: |
      A 5-member etcd cluster can tolerate how many simultaneous member failures while still
      accepting writes?
    options:
      - "1"
      - "2"
      - "3"
      - "4"
    answer: 1
    explanation: |
      Quorum for 5 members is 3, so up to 2 members can fail and quorum (3) is still met. A third
      failure drops it to 2, below quorum, and writes stop.
    ref: "concepts.md#etcd-quorum-and-high-availability"

  - id: cluster-installation-upgrades-017
    difficulty: advanced
    tags: [etcd, quorum-loss, impact]
    question: |
      A 3-member stacked etcd cluster loses 2 members. What is the immediate effect on the
      cluster?
    options:
      - "Nothing changes; the surviving member is promoted to leader and keeps serving all writes normally"
      - "All running application Pods across the cluster are immediately terminated and rescheduled elsewhere"
      - "etcd loses quorum, so the apiserver can no longer persist changes and the control plane freezes for mutations"
      - "The scheduler automatically doubles its placement throughput to compensate for the lost etcd members"
    answer: 2
    explanation: |
      With only 1 of 3 members up, quorum (2) is lost: etcd cannot commit writes, so the apiserver
      can't persist changes and the control plane can't mutate state. Already-running Pods keep
      running (kubelets are autonomous), but you can't make changes until quorum is restored.
    ref: "concepts.md#etcd-quorum-and-high-availability"

  - id: cluster-installation-upgrades-018
    difficulty: beginner
    tags: [version-skew, upgrade-order, apiserver]
    question: |
      In the Kubernetes version skew policy, which component is the reference point that no other
      component may be newer than?
    options:
      - "kube-apiserver"
      - "kubelet (the per-node agent)"
      - "etcd (the backing datastore)"
      - "kubectl (the command-line client)"
    answer: 0
    explanation: |
      The kube-apiserver is the reference. No component (kubelet, controllers, scheduler,
      kube-proxy) may be newer than the apiserver it talks to, which is why the apiserver is
      always upgraded first. kubectl is the only client allowed to be one minor newer.
    ref: "concepts.md#version-skew-policy"

  - id: cluster-installation-upgrades-019
    difficulty: intermediate
    tags: [version-skew, kubelet]
    question: |
      With kube-apiserver at 1.36, how many minor versions may the kubelet lag behind (in a
      recent Kubernetes)?
    options:
      - "Up to 1 minor version"
      - "Up to 3 minor versions"
      - "Up to 2 minor versions"
      - "It must match exactly"
    answer: 1
    explanation: |
      Recent policy allows the kubelet to be up to 3 minor versions older than the apiserver
      (e.g. apiserver 1.36 supports kubelets 1.36/1.35/1.34/1.33). The kubelet must never be
      newer than the apiserver.
    ref: "concepts.md#version-skew-policy"

  - id: cluster-installation-upgrades-020
    difficulty: advanced
    tags: [version-skew, controllers, scheduler]
    question: |
      With kube-apiserver at 1.36, what versions are supported for kube-controller-manager and
      kube-scheduler?
    options:
      - "1.36 or 1.35 (at most 1 minor older, never newer)"
      - "Any minor from 1.33 through 1.36 (a three-version spread)"
      - "1.36 or 1.37 (one minor newer than the apiserver is allowed)"
      - "They must exactly match the apiserver version at 1.36"
    answer: 0
    explanation: |
      Controller-manager, scheduler, and cloud-controller-manager may be at most 1 minor version
      older than the apiserver and never newer — so with a 1.36 apiserver they can be 1.36 or
      1.35. They live on the control plane and upgrade with the apiserver, so a wide skew isn't needed.
    ref: "concepts.md#version-skew-policy"

  - id: cluster-installation-upgrades-021
    difficulty: intermediate
    tags: [version-skew, kubectl]
    question: |
      Which component is uniquely allowed to be one minor version NEWER than the kube-apiserver?
    options:
      - "kubelet"
      - "kubectl"
      - "kube-scheduler"
      - "kube-proxy"
    answer: 1
    explanation: |
      kubectl is supported within one minor version older OR newer than the apiserver (e.g. a
      1.36 apiserver works with kubectl 1.35/1.36/1.37). Server-side components must never be
      newer than the apiserver.
    ref: "concepts.md#version-skew-policy"

  - id: cluster-installation-upgrades-022
    difficulty: advanced
    tags: [version-skew, upgrade-blocker, gotcha]
    question: |
      A node's kubelet has been left at 1.33 while the apiserver is at 1.36. What constraint does
      this create for your next control-plane upgrade to 1.37?
    options:
      - "None; the apiserver can move to 1.37 freely because skew limits apply only to the kubectl client"
      - "You must first upgrade that kubelet, or the skew would become 4 minor versions and violate the policy"
      - "You must downgrade the apiserver to 1.33 to match the lagging kubelet before doing anything else"
      - "The kubelet will auto-upgrade itself to 1.37 the moment the apiserver moves, keeping the skew legal"
    answer: 1
    explanation: |
      A kubelet 3 minors behind is at the boundary. Moving the apiserver to 1.37 would make the
      skew 4 minors, which is unsupported. You must upgrade that lagging kubelet before advancing
      the control plane. Kubelets do not auto-upgrade.
    ref: "concepts.md#version-skew-policy"

  - id: cluster-installation-upgrades-023
    difficulty: beginner
    tags: [upgrade, order, one-minor]
    question: |
      Which upgrade path is valid for the kube-apiserver?
    options:
      - "1.34 directly to 1.36 in a single hop, skipping the 1.35 release"
      - "1.36 back down to 1.34 first, then straight up to 1.37"
      - "Any jump is fine as long as it's the latest release"
      - "1.34 to 1.35, then 1.35 to 1.36 (one minor at a time)"
    answer: 3
    explanation: |
      The apiserver must not skip minor versions — you upgrade one minor at a time (1.34 → 1.35 →
      1.36). Skipping minors is unsupported due to API deprecation and change guidelines.
    ref: "concepts.md#upgrading-a-cluster-order-and-process"

  - id: cluster-installation-upgrades-024
    difficulty: beginner
    tags: [upgrade, order, control-plane-first]
    question: |
      What is the correct high-level order when upgrading a Kubernetes cluster?
    options:
      - "Worker nodes first, then the control plane"
      - "Control plane first, then worker nodes"
      - "etcd last, everything else first, in any order"
      - "All components simultaneously"
    answer: 1
    explanation: |
      You upgrade the control plane first (apiserver before the other control-plane components),
      then the worker nodes. This ordering follows directly from the skew policy: nothing may be
      newer than the apiserver.
    ref: "concepts.md#upgrading-a-cluster-order-and-process"

  - id: cluster-installation-upgrades-025
    difficulty: intermediate
    tags: [upgrade, kubeadm, commands]
    question: |
      On the FIRST control-plane node of a kubeadm cluster, which command actually applies the
      control-plane upgrade?
    options:
      - "kubeadm upgrade apply v1.36.x"
      - "kubeadm upgrade node --control-plane"
      - "kubectl upgrade cluster --to v1.36.x"
      - "kubeadm init --phase upgrade v1.36.x"
    answer: 0
    explanation: |
      `kubeadm upgrade apply <version>` runs on the first control-plane node to upgrade the
      control-plane static Pods (and renew certs). Additional control-plane nodes use
      `kubeadm upgrade node` instead.
    ref: "concepts.md#upgrading-a-cluster-order-and-process"

  - id: cluster-installation-upgrades-026
    difficulty: intermediate
    tags: [upgrade, kubeadm, additional-nodes]
    question: |
      After upgrading the first control-plane node with `kubeadm upgrade apply`, what do you run
      on the OTHER control-plane nodes?
    options:
      - "kubeadm upgrade apply again on each"
      - "kubeadm join --upgrade"
      - "Nothing; they upgrade automatically"
      - "kubeadm upgrade node"
    answer: 3
    explanation: |
      Additional control-plane nodes are upgraded with `kubeadm upgrade node` (no `plan` or CNI
      step needed). Control-plane nodes are upgraded one at a time; since v1.28 kubeadm won't
      upgrade addons until all control-plane instances are done.
    ref: "concepts.md#upgrading-a-cluster-order-and-process"

  - id: cluster-installation-upgrades-027
    difficulty: advanced
    tags: [upgrade, kubelet, drain, in-place]
    question: |
      Why must you drain a node before performing a minor-version kubelet upgrade?
    options:
      - "Because in-place minor kubelet upgrades are not supported; workloads must move off first"
      - "Because the drain step is what actually downloads and installs the new kubelet binary onto disk"
      - "Because the apiserver blocks all node traffic cluster-wide for the entire duration of any upgrade"
      - "Because etcd must be stopped on that node before the kubelet package can be safely replaced"
    answer: 0
    explanation: |
      In-place minor kubelet upgrades are unsupported, so you drain the node (evicting Pods to
      other nodes) before upgrading and restarting the kubelet, then uncordon. This node-by-node
      approach is what keeps the upgrade rolling and safe.
    ref: "concepts.md#upgrading-a-cluster-order-and-process"

  - id: cluster-installation-upgrades-028
    difficulty: beginner
    tags: [drain, cordon, node-maintenance]
    question: |
      What is the difference between `kubectl cordon` and `kubectl drain` on a node?
    options:
      - "cordon deletes the node object from the API; drain reboots the underlying host machine"
      - "cordon marks it unschedulable (no eviction); drain also evicts existing Pods"
      - "They are identical aliases that both cordon the node and evict its running Pods"
      - "cordon evicts the existing Pods first; drain merely stops new Pods from scheduling there"
    answer: 1
    explanation: |
      cordon marks the node unschedulable so no new Pods land, but leaves existing Pods running.
      drain does cordon PLUS evicting the existing Pods (respecting PodDisruptionBudgets) so they
      reschedule elsewhere.
    ref: "concepts.md#draining-nodes-and-poddisruptionbudgets"

  - id: cluster-installation-upgrades-029
    difficulty: intermediate
    tags: [drain, daemonset, flags]
    question: |
      `kubectl drain node-1` fails with an error about DaemonSet-managed Pods. Which flag lets
      the drain proceed?
    options:
      - "--force"
      - "--grace-period=0"
      - "--ignore-daemonsets"
      - "--delete-emptydir-data"
    answer: 2
    explanation: |
      DaemonSet Pods are tied to a node and aren't rescheduled, so drain refuses unless you pass
      `--ignore-daemonsets`. `--delete-emptydir-data` handles emptyDir data loss; `--force`
      handles bare unmanaged Pods.
    ref: "concepts.md#draining-nodes-and-poddisruptionbudgets"

  - id: cluster-installation-upgrades-030
    difficulty: intermediate
    tags: [pdb, availability, eviction]
    question: |
      What does a PodDisruptionBudget (PDB) protect an application against?
    options:
      - "Sudden node hardware crashes and kernel panics that take replicas offline without warning"
      - "Too many Pods being taken down at once by voluntary disruptions like drains and scale-downs"
      - "Image pull failures that leave Pods stuck in ImagePullBackOff and never becoming ready"
      - "Expired TLS certificates on the control plane that break Pod-to-apiserver authentication"
    answer: 1
    explanation: |
      A PDB caps how many Pods may be voluntarily disrupted at once (drain, eviction, autoscaler
      scale-down), keeping enough replicas available. It does NOT protect against involuntary
      disruptions like node crashes.
    ref: "concepts.md#draining-nodes-and-poddisruptionbudgets"

  - id: cluster-installation-upgrades-031
    difficulty: advanced
    tags: [pdb, drain-hang, gotcha]
    question: |
      A Deployment has 3 replicas and a PDB with `minAvailable: 3`. You run `kubectl drain` on a
      node hosting one of its Pods. What happens?
    options:
      - "The drain completes instantly because minAvailable is only advisory, not enforced"
      - "The PDB is silently ignored during drains and honored only for autoscaler scale-downs"
      - "Kubernetes automatically scales the Deployment up to 4 replicas so one can be evicted safely"
      - "The drain blocks indefinitely because evicting any Pod would violate the PDB"
    answer: 3
    explanation: |
      With minAvailable equal to the replica count, no Pod can be evicted without dropping below
      the budget, so the Eviction API blocks and drain hangs forever. Leave headroom (e.g.
      minAvailable: 2 with 3 replicas) so at least one Pod can be evicted at a time.
    ref: "concepts.md#draining-nodes-and-poddisruptionbudgets"

  - id: cluster-installation-upgrades-032
    difficulty: advanced
    tags: [pdb, voluntary-involuntary, node-controller]
    question: |
      A node suffers a sudden kernel panic and goes offline, taking down more Pods than the app's
      PDB allows. Why didn't the PDB prevent this?
    options:
      - "PDBs only guard voluntary disruptions (drain/eviction); a crash is an involuntary disruption"
      - "The PDB was misconfigured with a selector that failed to match the affected Pods"
      - "PDBs only take effect for StatefulSet workloads, never for Deployment-managed Pods"
      - "The node controller automatically disabled the PDB the moment the node went offline"
    answer: 0
    explanation: |
      PDBs constrain voluntary disruptions routed through the Eviction API. An abrupt node
      failure is involuntary — the Pods are simply gone — and the node controller reschedules
      them without consulting the PDB.
    ref: "concepts.md#draining-nodes-and-poddisruptionbudgets"

  - id: cluster-installation-upgrades-033
    difficulty: beginner
    tags: [certificates, expiry, kubeadm]
    question: |
      By default, how long are the leaf certificates issued by kubeadm valid for?
    options:
      - "90 days"
      - "1 year"
      - "5 years"
      - "10 years"
    answer: 1
    explanation: |
      kubeadm-issued certificates (apiserver, etcd, client certs) default to a 1-year lifetime.
      The cluster CA itself defaults to 10 years. This is why un-upgraded clusters famously break
      about a year after install.
    ref: "concepts.md#certificate-management-and-rotation"

  - id: cluster-installation-upgrades-034
    difficulty: intermediate
    tags: [certificates, troubleshooting, expiry]
    question: |
      A cluster that ran fine for a year suddenly returns TLS/authentication errors from the
      control plane. What is the most likely cause and fix?
    options:
      - "etcd ran out of disk after a year of writes; add storage and compact the keyspace to recover"
      - "The CNI plugin crashed after running for a year; reinstall it and restart every node's kubelet"
      - "kube-proxy's iptables rules drifted over the year; restart the kube-proxy DaemonSet to rebuild them"
      - "Control-plane certificates expired; run `kubeadm certs renew all` and restart control-plane Pods"
    answer: 3
    explanation: |
      The classic ~12-month outage is expired control-plane certs (1-year default). Renew with
      `kubeadm certs renew all` and restart the control-plane static Pods. Upgrading regularly
      also auto-renews certs and prevents this.
    ref: "concepts.md#certificate-management-and-rotation"

  - id: cluster-installation-upgrades-035
    difficulty: intermediate
    tags: [certificates, upgrade, auto-renew]
    question: |
      Which routine cluster operation automatically renews the kubeadm-managed certificates?
    options:
      - "kubeadm upgrade (apply/node)"
      - "kubectl apply -f any manifest"
      - "Restarting kube-proxy"
      - "Deleting and recreating CoreDNS"
    answer: 0
    explanation: |
      `kubeadm upgrade` automatically renews the certificates it manages (unless you pass
      `--certificate-renewal=false`). So a cluster upgraded at least yearly never hits the 1-year
      expiry.
    ref: "concepts.md#certificate-management-and-rotation"

  - id: cluster-installation-upgrades-036
    difficulty: advanced
    tags: [certificates, kubelet, csr-rotation]
    question: |
      How do kubelet client/serving certificates typically stay valid without manual renewal?
    options:
      - "They are issued once with no expiry, so no renewal mechanism is ever needed for them"
      - "kube-proxy watches their expiry dates and reissues them from the cluster CA before they lapse"
      - "The kubelet auto-rotates them via the CSR API, and the controller-manager signs the new certs"
      - "They are stored inside etcd and transparently refreshed on every write the kubelet performs"
    answer: 2
    explanation: |
      With certificate rotation enabled (default in kubeadm setups), the kubelet requests a new
      cert through the CSR API before expiry, and the controller-manager (configured with cluster
      signing keys) signs it. So node certs are largely self-healing; control-plane certs follow
      the kubeadm 1-year renewal.
    ref: "concepts.md#certificate-management-and-rotation"

  - id: cluster-installation-upgrades-037
    difficulty: beginner
    tags: [node-lifecycle, add-node, token]
    question: |
      To add a new worker node to an existing kubeadm cluster days after install, what do you
      typically generate first?
    options:
      - "A new etcd snapshot saved with `etcdctl snapshot save` to seed the joining node"
      - "A brand-new cluster CA generated so the joining node can trust the control plane"
      - "A PodDisruptionBudget covering the new node so its future Pods stay protected"
      - "A fresh bootstrap join command via `kubeadm token create --print-join-command`"
    answer: 3
    explanation: |
      Bootstrap tokens are short-lived (default 24h), so to join a node later you mint a new one:
      `kubeadm token create --print-join-command` prints a ready-to-run `kubeadm join` with the
      token and CA hash.
    ref: "concepts.md#node-lifecycle-add-remove-cordon-drain-uncordon"

  - id: cluster-installation-upgrades-038
    difficulty: intermediate
    tags: [node-lifecycle, remove-node, sequence]
    question: |
      What is the correct sequence to cleanly remove a worker node from a cluster?
    options:
      - "drain the node, then `kubectl delete node`, then `kubeadm reset` on the node"
      - "kubectl delete node first, then drain the workloads off it, then reboot the host"
      - "Just power off the machine and let the node controller clean up the objects for you"
      - "cordon the node only to stop new Pods, then leave the existing workloads in place"
    answer: 0
    explanation: |
      Cleanly: drain to evict workloads, delete the Node object from the API, then run
      `kubeadm reset` on the node itself to undo kubeadm state. If you delete the node while the
      kubelet still runs, it can re-register.
    ref: "concepts.md#node-lifecycle-add-remove-cordon-drain-uncordon"

  - id: cluster-installation-upgrades-039
    difficulty: intermediate
    tags: [node-lifecycle, uncordon, maintenance]
    question: |
      After finishing maintenance on a drained node, what command makes it schedulable again?
    options:
      - "kubectl cordon <node>"
      - "kubectl drain <node>"
      - "kubectl uncordon <node>"
      - "kubectl delete node <node>"
    answer: 2
    explanation: |
      `kubectl uncordon <node>` clears the unschedulable mark so the scheduler can place new Pods
      there again. cordon/drain do the opposite; delete removes the node entirely.
    ref: "concepts.md#node-lifecycle-add-remove-cordon-drain-uncordon"

  - id: cluster-installation-upgrades-040
    difficulty: advanced
    tags: [node-lifecycle, node-controller, notready]
    question: |
      A node stops sending heartbeats to the control plane. Which statement about the node
      controller's automatic response is correct?
    options:
      - "It immediately deletes the node object the instant one heartbeat is missed, with no grace period"
      - "It does nothing on its own and simply waits for an operator to run `kubectl uncordon` manually"
      - "It marks the node NotReady and, after a timeout, marks its Pods for deletion/reschedule — an involuntary path that ignores PDBs"
      - "It restarts the etcd members to force a fresh round of node heartbeat registration"
    answer: 2
    explanation: |
      The node controller marks a non-heartbeating node NotReady, and after the eviction timeout
      its Pods are marked for deletion and rescheduled. Because this is an involuntary disruption
      (node effectively gone), it does not honor PodDisruptionBudgets.
    ref: "concepts.md#node-lifecycle-add-remove-cordon-drain-uncordon"

  - id: cluster-installation-upgrades-041
    difficulty: beginner
    tags: [backup, velero, dr]
    question: |
      Which tool is commonly used for selective, object-level backup of Kubernetes resources plus
      PersistentVolume data (and cross-cluster migration)?
    options:
      - "etcdctl"
      - "kube-proxy"
      - "CoreDNS"
      - "Velero"
    answer: 3
    explanation: |
      Velero backs up selected namespaces/objects to object storage and snapshots PersistentVolumes,
      enabling granular restore and migration between clusters — capabilities a whole-cluster etcd
      snapshot cannot provide.
    ref: "concepts.md#backup-and-disaster-recovery-strategies"

  - id: cluster-installation-upgrades-042
    difficulty: intermediate
    tags: [backup, layered, gitops]
    question: |
      Why might a team use BOTH etcd snapshots and Velero (plus GitOps) rather than relying on
      etcd snapshots alone?
    options:
      - "etcd snapshots restore the whole cluster only; Velero adds selective/PV restore and cross-cluster migration, and GitOps re-applies desired manifests"
      - "etcd snapshots are explicitly disallowed in production clusters by the upstream support policy"
      - "Velero fully replaces the control plane, so a backed-up cluster no longer needs an apiserver"
      - "GitOps repositories store the container images themselves, which makes any state backup unnecessary"
    answer: 0
    explanation: |
      Each layer covers a gap: etcd snapshots = whole-cluster state; Velero = selective objects +
      PV data + cross-cluster migration; GitOps = declarative desired config re-applied to a fresh
      cluster. Together they form a layered DR posture.
    ref: "concepts.md#backup-and-disaster-recovery-strategies"

  - id: cluster-installation-upgrades-043
    difficulty: advanced
    tags: [backup, managed, dr-strategy]
    question: |
      On a managed cluster (EKS/GKE) where you have no direct etcd access, which DR levers do you
      primarily rely on?
    options:
      - "Manual `etcdctl snapshot save` runs against the provider's hidden etcd endpoint each night"
      - "Nothing at all; managed control planes are fully replicated and can never lose your data"
      - "GitOps (declarative re-apply) plus Velero for object/PV backup, since the provider owns etcd"
      - "Running `kubeadm certs renew all` periodically to keep the managed control plane recoverable"
    answer: 2
    explanation: |
      Managed providers own and back up etcd (no etcdctl access for you), so your DR levers operate
      at the Kubernetes-object layer you control: GitOps for declarative re-apply and Velero for
      object + PersistentVolume backup/restore.
    ref: "concepts.md#backup-and-disaster-recovery-strategies"

  - id: cluster-installation-upgrades-044
    difficulty: beginner
    tags: [deprecated-api, migration, upgrade]
    question: |
      Why must you check for deprecated/removed APIs before upgrading a cluster's minor version?
    options:
      - "Because removed API versions stop working after the upgrade, breaking manifests/controllers still using them"
      - "Because leaving deprecated APIs in place measurably speeds up etcd reads and compaction"
      - "Because kubectl refuses to connect to any cluster running a newly upgraded minor version"
      - "Because CNI network plugins fail to install unless all deprecated APIs are removed first"
    answer: 0
    explanation: |
      When an API version is removed in a release, objects/controllers still using it stop working
      after you upgrade. You must find and migrate deprecated API usage to the new apiVersion first
      to avoid resources silently failing to apply.
    ref: "concepts.md#deprecated-api-migration-on-upgrade"

  - id: cluster-installation-upgrades-045
    difficulty: intermediate
    tags: [deprecated-api, psp, pss]
    question: |
      PodSecurityPolicy (PSP) was removed in Kubernetes 1.25. What replaced it for enforcing pod
      security at admission?
    options:
      - "NetworkPolicy objects enforcing pod-to-pod traffic rules at admission time"
      - "ResourceQuota limits applied per namespace to constrain what pods may request"
      - "The scheduler's node affinity and taint/toleration rules blocking risky pods"
      - "Pod Security Standards enforced by the built-in Pod Security admission controller"
    answer: 3
    explanation: |
      PSP was removed in 1.25 in favor of Pod Security Standards (privileged/baseline/restricted)
      enforced by the built-in Pod Security admission controller. Migrating off PSP before that
      upgrade is a classic deprecated-API task. See security-rbac / workload-network-security.
    ref: "concepts.md#deprecated-api-migration-on-upgrade"

  - id: cluster-installation-upgrades-046
    difficulty: intermediate
    tags: [deprecated-api, tooling, kubent]
    question: |
      Which tools help you find deprecated/removed API usage in live objects and Helm releases
      before an upgrade?
    options:
      - "kubent (kube-no-trouble) and Pluto"
      - "etcdctl and etcdutl"
      - "kube-proxy and CoreDNS"
      - "cordon and drain"
    answer: 0
    explanation: |
      kubent (kube-no-trouble) and Pluto scan live cluster objects and Helm releases for APIs that
      will be removed in a target version. `kubeadm upgrade plan` also surfaces deprecated/removed
      APIs relevant to the target release.
    ref: "concepts.md#deprecated-api-migration-on-upgrade"

  - id: cluster-installation-upgrades-047
    difficulty: advanced
    tags: [deprecated-api, ingress, history]
    question: |
      The Ingress resource moved from `extensions/v1beta1` to `networking.k8s.io/v1`, with the old
      version removed in 1.22. What is the correct migration approach?
    options:
      - "Pass `--force` on apply to make the apiserver keep serving the removed extensions/v1beta1 version"
      - "Delete every Ingress object permanently and route external traffic through NodePorts instead"
      - "Update the manifests to apiVersion networking.k8s.io/v1 and re-apply before upgrading"
      - "Pin the apiserver at 1.21 forever so the old extensions/v1beta1 Ingress API stays available"
    answer: 2
    explanation: |
      Removed API versions cannot be force-served — there is no flag to keep them. You migrate the
      manifests (and any Helm charts/controllers) to the current apiVersion and re-apply, then
      upgrade. Remember charts and CRD-based controllers can embed old apiVersions too.
    ref: "concepts.md#deprecated-api-migration-on-upgrade"

  - id: cluster-installation-upgrades-048
    difficulty: advanced
    tags: [etcd, ha, failure-domains]
    question: |
      When placing a 3-member etcd cluster across a cloud region, why spread the members across
      separate availability zones?
    options:
      - "To reduce the number of TLS certificates the etcd members must issue to each other"
      - "To make each point-in-time etcd snapshot smaller by splitting data across the zones"
      - "Because etcd strictly requires exactly one member per availability zone to form a cluster"
      - "So a single-AZ outage cannot take down the majority and cause quorum loss"
    answer: 3
    explanation: |
      Spreading members across failure domains (AZs) ensures one AZ failure removes at most one
      member, preserving quorum (2 of 3). Co-locating a majority in one AZ would let a single AZ
      outage freeze the control plane's writes.
    ref: "concepts.md#etcd-quorum-and-high-availability"
