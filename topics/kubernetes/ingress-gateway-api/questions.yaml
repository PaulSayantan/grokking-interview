topic: Ingress, Gateway API & External Traffic
domain: kubernetes
topic_slug: ingress-gateway-api
version: 1
questions:
- id: ingress-gateway-api-001
  difficulty: beginner
  tags:
  - north-south
  - east-west
  - traffic
  question: |
    In Kubernetes networking terminology, what does "north-south" traffic refer to?
  options:
  - Traffic crossing the cluster boundary, i.e. external clients talking in to services (and responses
    out)
  - Traffic between Pods on different worker nodes, hopping across the CNI overlay network inside the cluster
  - Traffic between the control plane and worker nodes, such as kubelet heartbeats and API watch streams
  - Replication traffic between etcd members as they sync the Raft log for cluster-state consensus
  answer: 0
  explanation: |
    North-south is client-to-cluster traffic crossing the boundary (a browser or external
    system into your services). East-west is service-to-service traffic inside the cluster.
    Ingress and the Gateway API handle north-south; a service mesh handles east-west.
  ref: concepts.md#north-south-vs-east-west-traffic
- id: ingress-gateway-api-002
  difficulty: beginner
  tags:
  - east-west
  - mesh
  question: |
    Which tooling is most associated with managing east-west (service-to-service) traffic
    concerns like mTLS, retries, and circuit breaking?
  options:
  - An Ingress controller fronting every internal service call
  - ExternalDNS syncing service records into your DNS provider
  - A service mesh (e.g. Istio, Linkerd)
  - cert-manager issuing per-connection mTLS certificates on demand
  answer: 2
  explanation: |
    East-west concerns (mTLS, retries, timeouts, circuit breaking, traffic shifting between
    versions) are the domain of a service mesh. Ingress/Gateway are the north-south "front
    door"; the mesh handles the internal "hallways".
  ref: concepts.md#north-south-vs-east-west-traffic
- id: ingress-gateway-api-003
  difficulty: beginner
  tags:
  - loadbalancer
  - service
  question: |
    What is the main limitation of exposing many microservices with Service type=LoadBalancer?
  options:
  - It only supports UDP traffic and silently drops any TCP-based connections that reach it
  - It requires a fully installed service mesh with sidecar injection before it will route packets
  - It cannot terminate TLS at any layer, forcing every backend Pod to speak plaintext HTTP only
  - It provisions one external cloud load balancer (and often one IP/cost) per Service, with no HTTP host/path
    routing
  answer: 3
  explanation: |
    type=LoadBalancer is L4 and gives one external LB per Service — expensive at scale and
    with no hostname/URL-path routing or shared TLS. Ingress/Gateway front many backends
    behind a single LB with L7 routing.
  ref: concepts.md#service-typeloadbalancer-and-nodeport-recap
- id: ingress-gateway-api-004
  difficulty: beginner
  tags:
  - nodeport
  - service
  question: |
    A NodePort Service exposes the Service on which of the following?
  options:
  - A random high port on a single leader-elected node, failing over if that node goes down
  - A port (default 30000-32767) on every node in the cluster
  - Port 443 on the control-plane nodes only, proxied there by the kube-apiserver front proxy
  - An ephemeral port inside each Pod's own network namespace, assigned fresh on every restart
  answer: 1
  explanation: |
    NodePort allocates a port in the default 30000-32767 range on every node; traffic to
    any-node-ip:nodePort is forwarded to the Service. type=LoadBalancer builds on this by
    pointing a cloud LB at those NodePorts.
  ref: concepts.md#service-typeloadbalancer-and-nodeport-recap
- id: ingress-gateway-api-005
  difficulty: beginner
  tags:
  - ingress
  - definition
  - l7
  question: |
    What kind of routing does the Ingress resource (networking.k8s.io/v1) provide?
  options:
  - L4 TCP/UDP port forwarding for any protocol, load-balancing raw connections by four-tuple
  - DNS-based service discovery, resolving service names to ClusterIP addresses for callers
  - Pod-to-Pod overlay networking, encapsulating packets across nodes via the CNI plugin
  - L7 HTTP/HTTPS routing by host and URL path to Services
  answer: 3
  explanation: |
    Ingress is an L7 object for HTTP/HTTPS routing: host-based virtual hosting, path fanout,
    and TLS termination. It does not handle arbitrary protocols — those need
    NodePort/LoadBalancer or the Gateway API's TCP/UDP routes.
  ref: concepts.md#the-ingress-resource
- id: ingress-gateway-api-006
  difficulty: intermediate
  tags:
  - ingress
  - default-backend
  - spec
  question: |
    An Ingress is written with no `rules` and no `defaultBackend`. What is the problem?
  options:
  - If no rules are specified, a defaultBackend is required; otherwise there is nothing to route to
  - Nothing — an empty Ingress silently routes all traffic to the first Service alphabetically in the namespace
  - It will route all traffic to the kube-apiserver, exposing the cluster control plane on port 443
  - It automatically creates a NodePort for every Service currently defined in the same namespace
  answer: 0
  explanation: |
    The Ingress spec requires a defaultBackend when there are no rules — without either,
    there is no destination for requests. defaultBackend handles requests that match no rule.
  ref: concepts.md#the-ingress-resource
- id: ingress-gateway-api-007
  difficulty: intermediate
  tags:
  - ingress
  - frozen
  - gateway-api
  question: |
    What is the current development status of the Ingress API?
  options:
  - Alpha and likely to be removed in the next release once Gateway API replaces it entirely
  - Deprecated and scheduled for removal in v1.30, with a migration webhook rewriting objects
  - Stable and supported, but frozen — no new features; the project recommends Gateway API for new work
  - Beta, pending promotion to stable once conformance tests across controllers finish passing
  answer: 2
  explanation: |
    Ingress has been stable since v1.19 and remains supported with no removal planned, but
    it is feature-frozen. New capabilities go into the Gateway API, which the Kubernetes
    docs now recommend for new deployments.
  ref: concepts.md#the-ingress-resource
- id: ingress-gateway-api-008
  difficulty: beginner
  tags:
  - ingress
  - controller
  question: |
    You run `kubectl apply -f ingress.yaml` on a cluster with no ingress controller
    installed. What happens?
  options:
  - Kubernetes automatically installs a default nginx controller from the upstream registry on first use
  - Nothing — the Ingress object is inert; a controller must exist to program real routing infrastructure
  - The apiserver rejects the Ingress as invalid because no matching IngressClass can be resolved
  - Every node opens port 80 automatically and forwards matching Host headers to the backend Service
  answer: 1
  explanation: |
    An Ingress is just desired-state data. Without a running ingress controller watching it
    and programming a proxy/LB, it does nothing — ADDRESS stays empty. This is the most
    commonly tested Ingress fact.
  ref: concepts.md#ingress-needs-a-controller-the-resource-alone-does-nothing
- id: ingress-gateway-api-009
  difficulty: intermediate
  tags:
  - ingress
  - controller
  - control-plane
  question: |
    Unlike most Kubernetes controllers, the Ingress controller is which of the following?
  options:
  - Not built into the control plane — you must install it yourself (nginx, Traefik, cloud, etc.)
  - Built into kube-controller-manager and always running as one of its default reconcile loops
  - Part of kube-proxy on every node, programming iptables rules for each Ingress host and path
  - A component of etcd that watches the keyspace and rewrites routing entries on every change
  answer: 0
  explanation: |
    Most built-in controllers ship inside kube-controller-manager, but the Ingress
    controller is not. You choose and install one (ingress-nginx, Traefik, Envoy Gateway,
    a cloud LB controller). Without it, Ingress objects have no effect.
  ref: concepts.md#ingress-needs-a-controller-the-resource-alone-does-nothing
- id: ingress-gateway-api-010
  difficulty: intermediate
  tags:
  - ingressclass
  - multiple-controllers
  question: |
    Why does the IngressClass resource exist?
  options:
  - To encrypt Ingress traffic end to end using a cluster-wide mesh certificate authority
  - To define the TLS cipher suites and minimum protocol version applied to all Ingresses
  - To store the external IP address of the cluster and publish it into the DNS provider
  - To let a cluster run multiple ingress controllers and let each Ingress select which controller satisfies
    it
  answer: 3
  explanation: |
    A cluster can run several ingress controllers (e.g., internal and external). IngressClass
    names a controller, and an Ingress picks one via spec.ingressClassName. Controllers
    ignore Ingresses whose class they don't own.
  ref: concepts.md#ingressclass-and-ingressclassname
- id: ingress-gateway-api-011
  difficulty: intermediate
  tags:
  - ingressclass
  - default
  question: |
    An Ingress omits `ingressClassName`. Under what condition is it still handled?
  options:
  - Always — the first controller alphabetically claims it by sorting the installed IngressClass names
  - Never — ingressClassName is mandatory and the apiserver rejects the object during admission
  - 'Only if an IngressClass is annotated as the default (ingressclass.kubernetes.io/is-default-class:
    true)'
  - Only if it is created in the kube-system namespace, which the built-in default controller watches
  answer: 2
  explanation: |
    With no ingressClassName, the Ingress is handled by the default IngressClass (the one
    marked is-default-class: "true"), if one exists. If none is default and none is
    specified, no controller claims it.
  ref: concepts.md#ingressclass-and-ingressclassname
- id: ingress-gateway-api-012
  difficulty: intermediate
  tags:
  - ingressclass
  - annotation
  - deprecated
  question: |
    Which of these is the deprecated predecessor to the spec.ingressClassName field?
  options:
  - The spec.controller field that named the implementing controller directly on the Ingress object
  - The kubernetes.io/ingress.class annotation
  - The metadata.ingressType label read by the controller during its route-reconciliation loop
  - The status.loadBalancer field, which used to also carry the selected controller's identifier
  answer: 1
  explanation: |
    The older kubernetes.io/ingress.class annotation was the way to select a controller
    before the ingressClassName field. It is deprecated in favor of the typed field.
  ref: concepts.md#ingressclass-and-ingressclassname
- id: ingress-gateway-api-013
  difficulty: advanced
  tags:
  - ingressclass
  - misconfiguration
  question: |
    Two IngressClasses are both annotated as the default class. What is the consequence?
  options:
  - Kubernetes averages their configs and merges annotations from both default classes together
  - The apiserver picks the newest one deterministically by creationTimestamp, per the Ingress spec
  - All Ingresses are automatically disabled until exactly one default class remains in the cluster
  - It is a misconfiguration with undefined/controller-dependent behavior; there should be at most one
    default
  answer: 3
  explanation: |
    Having more than one default IngressClass is a misconfiguration; the outcome is
    undefined/controller-dependent. At most one IngressClass should carry the
    is-default-class annotation.
  ref: concepts.md#ingressclass-and-ingressclassname
- id: ingress-gateway-api-014
  difficulty: intermediate
  tags:
  - pathtype
  - prefix
  question: |
    An Ingress rule uses `pathType: Prefix` with `path: /foo`. Which incoming path does it
    NOT match?
  options:
  - /foobar
  - /foo
  - /foo/
  - /foo/bar
  answer: 0
  explanation: |
    Prefix matching splits the path by "/" element-wise, so /foo matches /foo, /foo/, and
    /foo/bar — but not /foobar, because "foobar" is not the "foo" element followed by a
    boundary. Expecting /foobar to match is a common bug.
  ref: concepts.md#ingress-path-types-and-routing
- id: ingress-gateway-api-015
  difficulty: intermediate
  tags:
  - pathtype
  - required
  question: |
    What is the default pathType if you omit it from an Ingress path?
  options:
  - Prefix is assumed by default
  - Exact is assumed by default
  - There is no default — pathType is a required field
  - ImplementationSpecific is assumed by default
  answer: 2
  explanation: |
    pathType has no default and is required on every path. The three values are Exact,
    Prefix, and ImplementationSpecific (controller-defined matching, e.g. regex).
  ref: concepts.md#ingress-path-types-and-routing
- id: ingress-gateway-api-016
  difficulty: intermediate
  tags:
  - pathtype
  - exact
  question: |
    With `pathType: Exact` and `path: /foo`, which request path matches?
  options:
  - Both /foo and /foo/
  - Only /foo (case-sensitive), not /foo/
  - /foo and any subpath like /foo/bar
  - Any path containing the substring foo
  answer: 1
  explanation: |
    Exact matches the URL path exactly and case-sensitively. /foo matches only /foo — not
    /foo/ or subpaths. Prefix is the type that also matches trailing-slash and subpaths.
  ref: concepts.md#ingress-path-types-and-routing
- id: ingress-gateway-api-017
  difficulty: advanced
  tags:
  - pathtype
  - regex
  - implementation-specific
  question: |
    You need substring/regex path matching that the standard Exact and Prefix types cannot
    express. Which pathType lets a controller apply its own matching (e.g. regex)?
  options:
  - ImplementationSpecific
  - Exact
  - Prefix
  - Wildcard
  answer: 0
  explanation: |
    ImplementationSpecific delegates matching to the IngressClass/controller, which may
    support regex or other semantics (e.g. nginx with rewrite/regex annotations). Exact and
    Prefix have fixed, portable semantics.
  ref: concepts.md#ingress-path-types-and-routing
- id: ingress-gateway-api-018
  difficulty: beginner
  tags:
  - tls
  - secret
  question: |
    To terminate TLS in an Ingress, spec.tls references a Secret of which type?
  options:
  - Opaque (an arbitrary key/value Secret with no schema the controller enforces)
  - kubernetes.io/dockerconfigjson (holding registry pull credentials, not serving certs)
  - bootstrap.kubernetes.io/token (a kubeadm node-join token, unrelated to edge TLS)
  - kubernetes.io/tls (containing tls.crt and tls.key)
  answer: 3
  explanation: |
    Ingress TLS termination references a kubernetes.io/tls Secret holding tls.crt and
    tls.key. The controller loads the cert and serves HTTPS for the listed hosts.
  ref: concepts.md#tls-termination-in-ingress
- id: ingress-gateway-api-019
  difficulty: intermediate
  tags:
  - tls
  - namespace
  question: |
    An Ingress in namespace `web` references TLS secret `shop-tls`. Where must that Secret
    live?
  options:
  - In the kube-system namespace
  - In any namespace, resolved cluster-wide
  - In the same namespace as the Ingress (web)
  - In the namespace of the backend Service
  answer: 2
  explanation: |
    The referenced TLS Secret must be in the same namespace as the Ingress. Ingress cannot
    reference Secrets across namespaces; the Gateway API adds controlled cross-namespace
    references via ReferenceGrant.
  ref: concepts.md#tls-termination-in-ingress
- id: ingress-gateway-api-020
  difficulty: intermediate
  tags:
  - tls
  - termination
  - backend
  question: |
    By default with Ingress TLS termination, how does traffic travel from the ingress
    controller to the backend Pod?
  options:
  - Always re-encrypted end-to-end, reusing the same edge certificate on the controller-to-Pod hop
  - Typically plaintext HTTP, unless you explicitly configure backend/re-encryption TLS or a mesh
  - Over a dedicated IPsec tunnel the controller provisions automatically between itself and each Pod
  - It never reaches the backend Pod; the controller serves cached responses to clients directly
  answer: 1
  explanation: |
    TLS terminates at the controller/edge. The hop to the backend is usually plaintext
    unless you configure backend TLS/re-encryption or run a mesh for in-cluster mTLS.
  ref: concepts.md#tls-termination-in-ingress
- id: ingress-gateway-api-021
  difficulty: intermediate
  tags:
  - annotations
  - portability
  question: |
    Why are Ingress controller annotations (e.g. nginx.ingress.kubernetes.io/rewrite-target)
    considered a weakness?
  options:
  - They increase the controller Pod's memory usage significantly, since each annotation is parsed on every request
  - They require a service mesh with sidecar injection to interpret before any routing takes effect
  - They can only be set by cluster-admins because annotation keys are gated by a validating admission webhook
  - They are controller-specific, non-portable, and unvalidated (typos are silently ignored)
  answer: 3
  explanation: |
    Because the Ingress spec is minimal and frozen, extra behavior lives in annotations that
    are controller-specific (an nginx annotation means nothing to Traefik), unvalidated
    (typos silently ignored), and non-portable — the main motivation for the Gateway API.
  ref: concepts.md#ingress-annotations-and-their-limits
- id: ingress-gateway-api-022
  difficulty: intermediate
  tags:
  - annotations
  - canary
  question: |
    To do a weighted canary rollout with the ingress-nginx controller, you must use
    annotations like `canary` and `canary-weight`. What does the Gateway API do differently?
  options:
  - Traffic splitting by weight is a first-class typed field (backendRefs weights), not an annotation
  - It also requires the same canary and canary-weight annotations, just moved onto the HTTPRoute object
  - It disallows canary deployments entirely, forcing an all-at-once cutover between backend versions
  - It requires a separate GatewayClass CRD per weight value, one for each percentage split you configure
  answer: 0
  explanation: |
    Gateway API promotes common annotation use-cases into typed spec fields. Weighted
    traffic splitting is native via backendRefs weights on an HTTPRoute, portable across
    conformant implementations.
  ref: concepts.md#ingress-annotations-and-their-limits
- id: ingress-gateway-api-023
  difficulty: intermediate
  tags:
  - gateway-api
  - motivation
  question: |
    Which of these is a primary design goal of the Gateway API that Ingress lacks?
  options:
  - Running application containers directly on nodes without any container runtime such as containerd
  - Eliminating the need for any controller by having the kube-apiserver program the dataplane itself
  - Role orientation — splitting responsibilities across GatewayClass/Gateway/Route with matching RBAC
  - Replacing etcd as the cluster datastore with a purpose-built routing-configuration key-value store
  answer: 2
  explanation: |
    Gateway API is explicitly role-oriented (infra provider, cluster operator, app dev),
    expressive (typed matching/splitting), portable, and extensible — addressing Ingress's
    single-object, annotation-driven, non-portable limitations.
  ref: concepts.md#why-the-gateway-api-was-created
- id: ingress-gateway-api-024
  difficulty: intermediate
  tags:
  - gateway-api
  - crd
  - installation
  question: |
    How is the Gateway API delivered/installed in a cluster?
  options:
  - It is built into the kube-apiserver as core types like Pods and Services, available on every cluster
  - As installable CRDs (an add-on) plus a conformant controller implementation
  - As a kernel module loaded on each node's host OS to intercept and route packets in the dataplane
  - By enabling the GatewayAPI feature gate on kube-proxy, which then reconciles the new route objects
  answer: 1
  explanation: |
    Gateway API ships as installable CRDs (a specific version's bundle) rather than being
    baked into core Kubernetes. You install the CRDs and a controller (Envoy Gateway, Istio,
    Cilium, NGINX Gateway Fabric, cloud gateways) that implements a GatewayClass.
  ref: concepts.md#why-the-gateway-api-was-created
- id: ingress-gateway-api-025
  difficulty: intermediate
  tags:
  - gateway-api
  - roles
  - resource-model
  question: |
    In the Gateway API role model, which resource is typically owned by the application
    developer?
  options:
  - HTTPRoute
  - GatewayClass
  - Gateway
  - IngressClass
  answer: 0
  explanation: |
    GatewayClass is the infrastructure provider's; Gateway is the cluster operator's
    (listeners, ports, TLS); HTTPRoute (and GRPCRoute, etc.) is the app developer's routing
    rules. RBAC can enforce this split across teams.
  ref: concepts.md#the-gateway-api-resource-model-roles
- id: ingress-gateway-api-026
  difficulty: intermediate
  tags:
  - gateway-api
  - roles
  - gatewayclass
  question: |
    Which Gateway API resource is analogous to IngressClass — naming the controller that
    implements it — and is owned by the infrastructure provider?
  options:
  - Gateway
  - HTTPRoute
  - ReferenceGrant
  - GatewayClass
  answer: 3
  explanation: |
    GatewayClass (cluster-scoped) names the controllerName that implements Gateways of that
    class, analogous to IngressClass or StorageClass. It is owned by the infra provider.
  ref: concepts.md#the-gateway-api-resource-model-roles
- id: ingress-gateway-api-027
  difficulty: intermediate
  tags:
  - gateway
  - listeners
  question: |
    On a Gateway resource, what do "listeners" define?
  options:
  - The ordered list of backend Pod IPs and ports that matching traffic is load-balanced across
  - The Pod anti-affinity and topology-spread rules governing where the Gateway controller replicas run
  - Port, protocol, optional hostname, and TLS config for accepting traffic, plus which routes may attach
  - The set of DNS A and CNAME records the Gateway should create in the configured external DNS provider
  answer: 2
  explanation: |
    Listeners on a Gateway carry port + protocol (HTTP/HTTPS/TCP/TLS/UDP), optional hostname,
    TLS config, and allowedRoutes. TLS lives on the operator-owned Gateway rather than
    scattered across app routes.
  ref: concepts.md#gatewayclass-and-gateway
- id: ingress-gateway-api-028
  difficulty: advanced
  tags:
  - gateway
  - allowedroutes
  - multi-tenancy
  question: |
    A Gateway listener sets `allowedRoutes.namespaces.from: Same`. What does this control?
  options:
  - Which worker nodes the Gateway dataplane Pods are eligible to be scheduled onto by the scheduler
  - Which namespaces' Routes are permitted to attach to that listener (here, only the Gateway's own namespace)
  - The maximum number of concurrent client connections the listener will accept before shedding load
  - Which TLS Secrets in the cluster the Gateway is authorized to read for terminating HTTPS connections
  answer: 1
  explanation: |
    allowedRoutes is the Gateway's trust control over route attachment: from can be Same
    (default), All, or Selector. It decides which namespaces' routes may bind — a key
    multi-tenant safety knob.
  ref: concepts.md#gatewayclass-and-gateway
- id: ingress-gateway-api-029
  difficulty: intermediate
  tags:
  - httproute
  - parentrefs
  question: |
    How does an HTTPRoute declare which Gateway it attaches to?
  options:
  - Via a label selector under spec.gatewaySelector that matches labels on the target Gateway object
  - Via the spec.ingressClassName field, reusing the same class-selection mechanism that Ingress uses
  - Automatically — every route attaches to all Gateways in the cluster unless explicitly excluded
  - Via spec.parentRefs referencing the Gateway (name/namespace)
  answer: 3
  explanation: |
    An HTTPRoute uses spec.parentRefs to attach to one or more Gateways (and listeners).
    Attachment is bidirectional: the route names the Gateway, and the Gateway's allowedRoutes
    controls acceptance.
  ref: concepts.md#httproute-matching-splitting-and-filters
- id: ingress-gateway-api-030
  difficulty: intermediate
  tags:
  - httproute
  - traffic-splitting
  - weights
  question: |
    An HTTPRoute has backendRefs to api-v1 (weight 80) and api-v2 (weight 20). What is the
    effect?
  options:
  - Roughly 80% of matching traffic goes to api-v1 and 20% to api-v2 — native weighted traffic splitting
  - All matching traffic goes to api-v1 because the first backendRef in the list always takes precedence
  - The route is rejected as invalid because an HTTPRoute rule may only reference a single backendRef
  - Traffic alternates strictly one request to each backend in round-robin, ignoring the weight values
  answer: 0
  explanation: |
    Weighted backendRefs give native traffic splitting (canary/blue-green): ~80/20 here.
    No controller-specific canary annotations are needed, unlike with Ingress.
  ref: concepts.md#httproute-matching-splitting-and-filters
- id: ingress-gateway-api-031
  difficulty: advanced
  tags:
  - httproute
  - matches
  - headers
  question: |
    In an HTTPRoute rule, a `matches` entry specifies both a path prefix `/api` AND a header
    `x-canary: true`. How are the two conditions combined?
  options:
  - ORed — the rule applies if either the path prefix OR the x-canary header condition matches
  - The header condition is ignored at match time; only the path prefix is honored for selecting the rule
  - ANDed — both the path AND the header must match for the rule to apply
  - It is invalid to combine path and header conditions in one matches entry and the route is rejected
  answer: 2
  explanation: |
    Within a single matches entry, multiple conditions (path, headers, method, query) are
    ANDed. To OR conditions, you list multiple entries in the matches array.
  ref: concepts.md#httproute-matching-splitting-and-filters
- id: ingress-gateway-api-032
  difficulty: advanced
  tags:
  - httproute
  - filters
  - redirect
  question: |
    Which HTTPRoute feature lets you perform an HTTP-to-HTTPS redirect as a typed,
    portable spec field?
  options:
  - A controller-specific ssl-redirect annotation applied to the HTTPRoute, interpreted only by that vendor
  - A filter of type RequestRedirect
  - The defaultBackend field on the parent Gateway, which forwards unmatched requests to an HTTPS listener
  - A NetworkPolicy that blocks port 80 at the Pod level, forcing clients to retry over the HTTPS port
  answer: 1
  explanation: |
    HTTPRoute filters include RequestHeaderModifier, ResponseHeaderModifier, RequestRedirect
    (e.g. HTTP->HTTPS), URLRewrite, RequestMirror, and ExtensionRef — all typed spec fields,
    no annotations.
  ref: concepts.md#httproute-matching-splitting-and-filters
- id: ingress-gateway-api-033
  difficulty: advanced
  tags:
  - cross-namespace
  - referencegrant
  question: |
    An HTTPRoute in namespace `web` references a backend Service in namespace `backend` with
    no ReferenceGrant present. What happens?
  options:
  - The reference is denied (default-deny); the route status shows RefNotPermitted and traffic is not
    routed
  - The reference works normally; cross-namespace backend references are permitted by default in the Gateway API
  - Kubernetes auto-creates a ReferenceGrant in the backend namespace and the reference resolves after a short delay
  - The apiserver rejects and deletes the offending HTTPRoute during admission for referencing another namespace
  answer: 0
  explanation: |
    Cross-namespace references are default-deny. A ReferenceGrant in the target namespace
    must explicitly allow the reference; otherwise the route reports RefNotPermitted and
    does not route traffic. This prevents tenants hijacking others' Services/Secrets.
  ref: concepts.md#cross-namespace-routing-and-referencegrant
- id: ingress-gateway-api-034
  difficulty: advanced
  tags:
  - cross-namespace
  - referencegrant
  - placement
  question: |
    In which namespace must a ReferenceGrant be created to allow a cross-namespace reference?
  options:
  - In the source namespace (where the referencing HTTPRoute lives), so the route's owner grants its own access
  - In the kube-system namespace, where a cluster-scoped admission controller reads all ReferenceGrants
  - In the Gateway's own namespace only, since the Gateway mediates every cross-namespace backend reference
  - In the target namespace (where the referenced Service/Secret lives)
  answer: 3
  explanation: |
    A ReferenceGrant lives in the TARGET namespace (the one owning the Service/Secret being
    referenced). Its `from` lists who may reference in, and `to` lists what kinds may be
    referenced — so the resource owner controls access.
  ref: concepts.md#cross-namespace-routing-and-referencegrant
- id: ingress-gateway-api-035
  difficulty: intermediate
  tags:
  - cross-namespace
  - ingress-limitation
  question: |
    Regarding namespaces, how does Ingress differ from the Gateway API?
  options:
  - Ingress freely references backends in any namespace, whereas the Gateway API restricts routing to a single namespace
  - Both Ingress and Gateway API objects are cluster-scoped and therefore entirely namespace-agnostic
  - Ingress is single-namespace (Ingress, Services, TLS Secret together); Gateway API supports controlled
    cross-namespace references
  - Neither Ingress nor the Gateway API is namespaced; both ignore namespace boundaries when resolving backends
  answer: 2
  explanation: |
    Ingress ties an Ingress to Services and a TLS Secret in the same namespace. Gateway API
    allows cross-namespace routing but guards it with default-deny plus ReferenceGrant and
    the Gateway's allowedRoutes.
  ref: concepts.md#cross-namespace-routing-and-referencegrant
- id: ingress-gateway-api-036
  difficulty: intermediate
  tags:
  - gateway-api
  - ga
  - versioning
  question: |
    Which Gateway API resources reached GA (the v1 API version) in the v1.0 release
    (October 2023)?
  options:
  - TCPRoute, UDPRoute, and TLSRoute
  - GatewayClass, Gateway, and HTTPRoute
  - Only HTTPRoute
  - ReferenceGrant and GRPCRoute
  answer: 1
  explanation: |
    Gateway API v1.0 (Oct 2023) graduated GatewayClass, Gateway, and HTTPRoute to v1
    (GA/stable) — the milestone establishing production readiness. GRPCRoute followed in
    v1.1; TCPRoute/UDPRoute later.
  ref: concepts.md#gateway-api-ga-status-and-release-channels
- id: ingress-gateway-api-037
  difficulty: advanced
  tags:
  - gateway-api
  - channels
  question: |
    What is the difference between the Gateway API's "standard" and "experimental" release
    channels?
  options:
  - Standard is only for managed cloud clusters, while experimental is the on-prem build shipped for self-hosted
    bare-metal installs
  - Standard requires a paid support subscription, while experimental is the free community bundle with
    no vendor backing
  - Standard supports only HTTP and HTTPS listeners, while experimental is the only channel that can route
    raw TCP and UDP
  - Standard contains GA/stable resources and fields; experimental contains alpha/beta resources and fields
    that may change or be removed
  answer: 3
  explanation: |
    The two CRD bundles separate maturity: standard = GA/stable (Gateway, HTTPRoute, etc.
    at v1) with stability guarantees; experimental = alpha/beta features (e.g. TLSRoute,
    newer fields/policies) that may change.
  ref: concepts.md#gateway-api-ga-status-and-release-channels
- id: ingress-gateway-api-038
  difficulty: advanced
  tags:
  - gateway-api
  - gamma
  - mesh
  question: |
    What does the Gateway API's GAMMA initiative enable?
  options:
  - Extending HTTPRoute to configure east-west service mesh routing (a Route's parentRef can be a Service)
  - Running Gateways in a fully controllerless mode where the kube-apiserver programs the dataplane directly
  - Replacing kube-proxy on every node with an eBPF datapath that the GAMMA controller compiles and loads
  - Encrypting etcd at rest by rotating a GAMMA-managed KMS key on every cluster-state write
  answer: 0
  explanation: |
    GAMMA extends the same HTTPRoute model to east-west mesh traffic — a route can parentRef
    a Service instead of a Gateway — unifying north-south and in-mesh routing under one API.
  ref: concepts.md#gateway-api-ga-status-and-release-channels
- id: ingress-gateway-api-039
  difficulty: beginner
  tags:
  - comparison
  - loadbalancer
  - layer
  question: |
    At which OSI layer does Service type=LoadBalancer operate, compared with Ingress?
  options:
  - Both operate at L7 (HTTP/HTTPS), differing only in whether a cloud LB is provisioned per Service
  - type=LoadBalancer is L7 (HTTP host/path aware); Ingress is a plain L4 four-tuple forwarder below it
  - type=LoadBalancer is L4 (TCP/UDP); Ingress is L7 (HTTP/HTTPS)
  - Both operate at L3 (IP), routing purely on destination address with no port or protocol awareness
  answer: 2
  explanation: |
    type=LoadBalancer is L4 with no HTTP awareness (one LB per Service). Ingress is L7 and
    routes by host/path. Gateway API spans L4 and L7 across multiple protocols.
  ref: concepts.md#ingress-vs-gateway-api-vs-typeloadbalancer
- id: ingress-gateway-api-040
  difficulty: intermediate
  tags:
  - comparison
  - decision
  question: |
    You need to expose a non-HTTP (raw TCP) database endpoint to a single external client.
    Which is the most appropriate choice?
  options:
  - An Ingress with a Prefix path rule, letting the L7 controller stream the raw database protocol to the backend
  - Service type=LoadBalancer (or Gateway API TCPRoute) — Ingress is HTTP/HTTPS only
  - A ConfigMap that maps the external client's source IP to the database Pod's port for direct connection
  - cert-manager, which brokers the raw TCP session and issues a per-client certificate for the database endpoint
  answer: 1
  explanation: |
    Ingress handles only HTTP/HTTPS. Raw TCP needs type=LoadBalancer/NodePort or the Gateway
    API's TCPRoute. Choosing Ingress for a non-HTTP protocol is a classic wrong answer.
  ref: concepts.md#ingress-vs-gateway-api-vs-typeloadbalancer
- id: ingress-gateway-api-041
  difficulty: intermediate
  tags:
  - comparison
  - gateway-api
  - decision
  question: |
    For a new multi-team platform needing traffic splitting, header-based routing, and
    portability across implementations, which is recommended?
  options:
  - The Gateway API
  - Ingress with vendor annotations
  - NodePort on every node
  - A single type=LoadBalancer Service per route
  answer: 0
  explanation: |
    Gateway API is recommended for new, advanced, multi-tenant needs: native traffic
    splitting, header/method/query matching, role separation, and portability via typed
    fields and conformance — exactly the gaps in Ingress.
  ref: concepts.md#ingress-vs-gateway-api-vs-typeloadbalancer
- id: ingress-gateway-api-042
  difficulty: beginner
  tags:
  - cert-manager
  - acme
  - tls
  question: |
    What does cert-manager primarily do in a Kubernetes cluster?
  options:
  - Load-balances north-south traffic across ready Pods by weight, replacing the ingress controller dataplane
  - Watches Services and creates matching A/CNAME records in your external DNS provider automatically
  - Encrypts etcd data at rest by managing an envelope KMS key that the apiserver rotates on each write
  - Issues and auto-renews TLS certificates (commonly via ACME/Let's Encrypt) as Kubernetes resources,
    storing them in tls Secrets
  answer: 3
  explanation: |
    cert-manager automates certificate issuance and renewal (often ACME/Let's Encrypt via
    HTTP-01 or DNS-01), writing a kubernetes.io/tls Secret that Ingress/Gateway references,
    and renewing before expiry.
  ref: concepts.md#cert-manager-automated-tls-certificates
- id: ingress-gateway-api-043
  difficulty: advanced
  tags:
  - cert-manager
  - dns-01
  - wildcard
  question: |
    You need a wildcard certificate (*.example.com) via cert-manager and Let's Encrypt.
    Which ACME challenge type is required?
  options:
  - HTTP-01
  - TLS-ALPN-01 only
  - DNS-01
  - No challenge is needed for wildcards
  answer: 2
  explanation: |
    Wildcard certificates require the DNS-01 challenge (proving control via a DNS TXT record),
    which needs API access to your DNS provider. HTTP-01 cannot issue wildcards.
  ref: concepts.md#cert-manager-automated-tls-certificates
- id: ingress-gateway-api-044
  difficulty: intermediate
  tags:
  - cert-manager
  - issuer
  question: |
    In cert-manager, what is the role of an Issuer/ClusterIssuer?
  options:
  - It stores the backend Pod IPs and ports so the controller can load-balance TLS connections across them
  - It defines the certificate authority configuration (e.g. an ACME/Let's Encrypt account) that signs
    Certificate requests
  - It is the cluster's public DNS record, published so external clients can resolve the ingress hostname
  - It defines the Ingress host and path routing rules that select which backend serves each request
  answer: 1
  explanation: |
    Issuer (namespaced) / ClusterIssuer (cluster-scoped) configure a CA such as an ACME
    endpoint. Certificate objects reference an issuer to obtain signed certs. Using the
    staging issuer avoids Let's Encrypt production rate limits while testing.
  ref: concepts.md#cert-manager-automated-tls-certificates
- id: ingress-gateway-api-045
  difficulty: beginner
  tags:
  - externaldns
  - dns
  question: |
    What does ExternalDNS do?
  options:
  - Terminates TLS at the edge using the referenced tls Secret before forwarding cleartext to backends
  - Runs the ingress controller dataplane, proxying matched HTTP requests to the selected backend Service
  - Scans container images for known CVEs and blocks Pods whose images fail the configured severity gate
  - Watches Ingress/Gateway/Service objects and programs matching records in your DNS provider (Route
    53, Cloud DNS, etc.)
  answer: 3
  explanation: |
    ExternalDNS reads hostnames and assigned addresses from Ingress, Gateway/HTTPRoute, and
    Service objects and creates/updates/deletes records in your DNS provider automatically,
    closing the "resolvable name" part of publishing an app.
  ref: concepts.md#externaldns-automating-dns-records
- id: ingress-gateway-api-046
  difficulty: intermediate
  tags:
  - externaldns
  - cert-manager
  - stack
  question: |
    Which set of components together publish an app to the internet with HTTPS in the
    full "front door" stack?
  options:
  - Gateway/Ingress (routing) + controller (dataplane) + cert-manager (TLS certs) + ExternalDNS (DNS records)
  - kube-proxy (Service routing) + etcd (state store) + CoreDNS (in-cluster DNS) + containerd (container runtime)
  - HPA (pod autoscaling) + VPA (right-sizing) + Cluster Autoscaler (node scaling) + KEDA (event-driven scaling)
  - RBAC (authorization) + NetworkPolicy (pod firewalling) + PodSecurity (admission) + Secrets (credential storage)
  answer: 0
  explanation: |
    The complete public-facing stack: Gateway/Ingress declares routing, the controller
    programs the dataplane, cert-manager provides/renews TLS, and ExternalDNS publishes the
    DNS records — all reconciled from declarative objects.
  ref: concepts.md#externaldns-automating-dns-records
- id: ingress-gateway-api-047
  difficulty: intermediate
  tags:
  - traffic-flow
  - tls
  - sni
  question: |
    For an HTTPS request through a Gateway, at what point is TLS terminated in the
    end-to-end flow?
  options:
  - Inside the backend Pod always, since the Gateway passes encrypted bytes straight through untouched
  - In the client's browser, which decrypts before the request ever leaves the machine toward the Gateway
  - At the Gateway dataplane proxy edge, using the operator-owned certificate Secret, before selecting
    a backend
  - At the etcd layer, where the apiserver unwraps the session key stored alongside cluster state
  answer: 2
  explanation: |
    The Gateway matches the listener by hostname/port and terminates TLS at the edge using
    the certificate Secret, then applies HTTPRoute matching/filters and picks a weighted
    backend before forwarding to a ready Pod via the Service/EndpointSlice.
  ref: concepts.md#traffic-flow-request-to-pod-end-to-end
- id: ingress-gateway-api-048
  difficulty: intermediate
  tags:
  - troubleshooting
  - 503
  - endpoints
  question: |
    An ingress/gateway returns "503 Service Temporarily Unavailable" for a valid route.
    What is the most likely cause?
  options:
  - The TLS certificate has the wrong SAN, so the edge rejects the handshake before any backend is chosen
  - The backend Service has no ready endpoints (Pods failing readiness, wrong selector, or wrong port)
  - The controller Pod is missing a NetworkPolicy, so egress to the backend is silently dropped by the CNI
  - DNS is misconfigured and the hostname resolves to an old address that no longer fronts the controller
  answer: 1
  explanation: |
    A 503 from the edge almost always means the backend Service has zero ready endpoints —
    failing readiness probes, a mismatched selector, or the wrong port. Check
    `kubectl get endpointslices` for the Service first.
  ref: concepts.md#troubleshooting-external-traffic
- id: ingress-gateway-api-049
  difficulty: intermediate
  tags:
  - troubleshooting
  - address
  - status
  question: |
    After applying an Ingress, `kubectl get ingress` shows an empty ADDRESS column even
    though the manifest is valid. What should you check first?
  options:
  - Whether an ingress controller is installed/running and ingressClassName matches an installed IngressClass
  - Whether the backend Pods have enough CPU headroom, since the ADDRESS is only published once probes pass
  - Whether the backend Service uses ClusterIP, because ADDRESS stays blank unless it is NodePort instead
  - Whether etcd is encrypted at rest, as the apiserver withholds the assigned address until storage is sealed
  answer: 0
  explanation: |
    An empty ADDRESS means no controller has claimed and programmed the Ingress. Verify a
    controller is running and that ingressClassName matches an installed IngressClass (or a
    default exists). The resource alone does nothing.
  ref: concepts.md#troubleshooting-external-traffic
- id: ingress-gateway-api-050
  difficulty: advanced
  tags:
  - troubleshooting
  - gateway
  - conditions
  question: |
    When debugging why an HTTPRoute isn't serving traffic, which status conditions on the
    route/Gateway are the key signals to inspect?
  options:
  - CPUThrottled and MemoryPressure conditions raised on the route by the dataplane proxy under sustained load
  - Ready and Initialized conditions only, mirrored from the controller Pod's own lifecycle probe results
  - PodScheduled and ContainersReady, since an HTTPRoute reports the readiness of the Pods it fronts directly
  - Accepted, ResolvedRefs, and Programmed (plus reasons like RefNotPermitted or NoMatchingListenerHostname)
  answer: 3
  explanation: |
    Gateway API surfaces reconciliation feedback via conditions: Accepted (route bound to a
    listener), ResolvedRefs (backends/Secrets resolvable), and Programmed (dataplane
    configured). Reasons like RefNotPermitted or NoMatchingListenerHostname pinpoint the
    failure.
  ref: concepts.md#troubleshooting-external-traffic
- id: ingress-gateway-api-051
  difficulty: beginner
  tags:
  - ingress
  - host
  - virtual-hosting
  question: |
    In an Ingress rule, what happens if the `host` field is omitted?
  options:
  - The rule is invalid and the apiserver rejects the Ingress during admission for a missing required host
  - The rule only matches localhost, so it serves solely requests originating from inside the controller Pod
  - The rule applies to all inbound HTTP hosts (no name-based virtual host filtering)
  - The controller assigns a random generated hostname and publishes it into the configured external DNS zone
  answer: 2
  explanation: |
    A rule with no host matches all inbound HTTP traffic regardless of the Host header. A
    host (e.g. shop.example.com) restricts the rule to that name, enabling name-based
    virtual hosting.
  ref: concepts.md#the-ingress-resource
- id: ingress-gateway-api-052
  difficulty: advanced
  tags:
  - gateway-api
  - tcproute
  - udproute
  - ga
  question: |
    Beyond HTTPRoute and GRPCRoute, which additional route types graduated to GA (v1) in the
    Gateway API v1.6 release?
  options:
  - TLSRoute and a new MeshRoute
  - TCPRoute and UDPRoute
  - IngressRoute and NetworkRoute
  - None — only HTTP-based routes are ever GA
  answer: 1
  explanation: |
    TCPRoute and UDPRoute graduated to GA (v1, moved to the standard channel) in the v1.6
    release, extending stable routing beyond HTTP/gRPC. TLSRoute and various policies
    remained experimental.
  ref: concepts.md#gateway-api-ga-status-and-release-channels
- id: ingress-gateway-api-053
  difficulty: intermediate
  tags:
  - comparison
  - tls
  - ownership
  question: |
    A benefit of the Gateway API's role model for TLS is that:
  options:
  - TLS listener config lives on the operator-owned Gateway, not scattered across each app team's routes
  - TLS certificates are stored unencrypted in ConfigMaps so any team can read the shared serving key freely
  - TLS is disabled entirely on the Gateway to simplify config, relying on the cloud LB to re-add encryption
  - Each HTTPRoute must carry its own inline copy of the certificate, duplicating the key across every route
  answer: 0
  explanation: |
    By putting listeners and TLS on the Gateway (cluster operator), the platform team owns
    certs and ports centrally, while app teams manage only their HTTPRoutes — a cleaner
    separation than Ingress, where TLS and rules share one object.
  ref: concepts.md#gatewayclass-and-gateway
