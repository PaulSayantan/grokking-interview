topic: "Kubernetes API, Objects & kubectl"
domain: kubernetes
topic_slug: api-objects-kubectl
version: 1
questions:
  - id: api-objects-kubectl-001
    difficulty: beginner
    tags: [declarative, desired-state, fundamentals]
    question: |
      What does it mean that Kubernetes uses a "declarative" model?
    options:
      - "You issue step-by-step commands and Kubernetes executes them in order"
      - "You must declare every variable's type before using it in a manifest"
      - "You declare the desired end state, and controllers continuously work to make actual state match it"
      - "Objects become read-only once created and can only be changed by deleting and recreating them"
    answer: 2
    explanation: |
      Declarative means you describe the desired end state (in objects) and submit it;
      controllers figure out the actions and continuously reconcile actual state toward
      desired. This gives idempotency, drift correction, and self-healing — unlike an
      imperative "do these steps" model.
    ref: "concepts.md#the-kubernetes-api-and-the-declarative-model"

  - id: api-objects-kubectl-002
    difficulty: beginner
    tags: [apiserver, etcd, architecture]
    question: |
      Which component is the only one that reads from and writes to etcd, acting as the
      single source of truth for cluster state?
    options:
      - "kubelet"
      - "kube-scheduler"
      - "kube-controller-manager"
      - "kube-apiserver"
    answer: 3
    explanation: |
      The kube-apiserver is the front door and the only component that talks to etcd. The
      scheduler, controllers, kubelets, and kubectl all read and write cluster state through
      the API server, which centralizes auth, RBAC, and admission control.
    ref: "concepts.md#the-kubernetes-api-and-the-declarative-model"

  - id: api-objects-kubectl-003
    difficulty: beginner
    tags: [object-model, spec, status]
    question: |
      In a Kubernetes object, what is the relationship between `spec` and `status`?
    options:
      - "`spec` is the actual observed state; `status` is what you want"
      - "`spec` is desired state that you set; `status` is actual state that a controller reports"
      - "They are identical copies that etcd keeps byte-for-byte in sync on every write"
      - "`spec` is used at creation only; `status` then replaces it as the object's live definition"
    answer: 1
    explanation: |
      `spec` is the desired state you author; `status` is the actual/observed state a
      controller writes. The controller's job is to notice when spec != status and act to
      close the gap. You never hand-write status.
    ref: "concepts.md#the-object-model-apiversion-kind-metadata-spec-status"

  - id: api-objects-kubectl-004
    difficulty: beginner
    tags: [object-model, required-fields]
    question: |
      Which four top-level fields must you typically provide when authoring a Kubernetes
      object manifest?
    options:
      - "name, namespace, labels, image"
      - "group, version, resource, name"
      - "apiVersion, kind, status, data"
      - "apiVersion, kind, metadata, spec"
    answer: 3
    explanation: |
      You provide apiVersion, kind, metadata, and spec. `status` is written by the system,
      not by you. `group/version/resource` describe the API path but aren't the manifest's
      top-level fields.
    ref: "concepts.md#the-object-model-apiversion-kind-metadata-spec-status"

  - id: api-objects-kubectl-005
    difficulty: intermediate
    tags: [object-model, generation, observedGeneration]
    question: |
      How can you tell whether a controller has caught up with your most recent `spec`
      change to an object?
    options:
      - "Compare metadata.generation to status.observedGeneration"
      - "Check that status.phase equals Running"
      - "Compare metadata.creationTimestamp to the current time"
      - "Re-apply the manifest and see if it errors"
    answer: 0
    explanation: |
      metadata.generation is bumped when the spec changes; status.observedGeneration is the
      generation the controller has processed. When observedGeneration lags generation, the
      controller hasn't yet reconciled your latest change.
    ref: "concepts.md#the-object-model-apiversion-kind-metadata-spec-status"

  - id: api-objects-kubectl-006
    difficulty: intermediate
    tags: [object-model, status, gotcha]
    question: |
      You manually edit an object's `status` block with `kubectl edit` to fix a value.
      What most likely happens?
    options:
      - "The controller overwrites your edit on its next reconcile because it owns status"
      - "The change is permanent because status is a user-owned field that controllers never touch"
      - "The object is rejected by admission control for editing a server-managed subresource"
      - "etcd immediately rolls the entire object back to its previous stored resourceVersion"
    answer: 0
    explanation: |
      status is owned by the controller, which drives it toward reality. Hand-editing status
      is meaningless — the controller overwrites it on the next reconcile. The real fix is to
      change spec or address why the controller can't reach desired state.
    ref: "concepts.md#the-object-model-apiversion-kind-metadata-spec-status"

  - id: api-objects-kubectl-007
    difficulty: beginner
    tags: [api-groups, core-group]
    question: |
      A Pod manifest starts with `apiVersion: v1` (no group prefix). Which API group does
      this indicate?
    options:
      - "The apps group"
      - "The networking.k8s.io group"
      - "The core (legacy) group"
      - "A custom resource group"
    answer: 2
    explanation: |
      `v1` with no group name is the core (legacy) group, served at /api/v1. It contains the
      oldest fundamental types: Pod, Service, ConfigMap, Secret, Namespace, Node, PVC,
      ServiceAccount. Named groups use `<group>/<version>` like apps/v1.
    ref: "concepts.md#api-groups-versions-and-resources-vs-kinds"

  - id: api-objects-kubectl-008
    difficulty: beginner
    tags: [api-groups, apps]
    question: |
      What is the correct `apiVersion` for a Deployment?
    options:
      - "v1"
      - "apps/v1"
      - "deployments/v1"
      - "extensions/v1"
    answer: 1
    explanation: |
      Deployment, StatefulSet, DaemonSet, and ReplicaSet live in the apps group at apps/v1.
      Deployment was historically in extensions/v1beta1 but that was removed; apps/v1 is the
      stable location.
    ref: "concepts.md#api-groups-versions-and-resources-vs-kinds"

  - id: api-objects-kubectl-009
    difficulty: intermediate
    tags: [kind, resource, terminology]
    question: |
      What is the difference between a "kind" and a "resource" in the Kubernetes API?
    options:
      - "A kind is namespaced; a resource is always cluster-scoped"
      - "They are exact synonyms with no distinction, used interchangeably in YAML and REST paths"
      - "A kind is a custom type; a resource is a built-in type"
      - "A kind is the PascalCase type name in YAML (e.g. Pod); a resource is the lowercase plural REST/RBAC name (e.g. pods)"
    answer: 3
    explanation: |
      A kind is the type name used in YAML (Pod, Deployment) — PascalCase, singular. A resource
      is the lowercase plural URL segment used in REST paths and RBAC rules (pods, deployments).
      kind: Pod is served at the pods resource.
    ref: "concepts.md#api-groups-versions-and-resources-vs-kinds"

  - id: api-objects-kubectl-010
    difficulty: intermediate
    tags: [api-versions, alpha-beta-stable]
    question: |
      What does an API version of `v1alpha1` signal compared to `v1`?
    options:
      - "It is a faster, more performant re-implementation that supersedes the v1 endpoint"
      - "It is stable and fully supported but restricted to serving objects in a single namespace"
      - "It is a numbered hotfix layer applied on top of v1 to patch security issues in place"
      - "It is experimental, may change or be removed, and is often disabled by default"
    answer: 3
    explanation: |
      Alpha versions are experimental: they may change incompatibly or be removed, and are
      often disabled by default. Beta is well-tested and enabled by default but may still
      change; v1 (stable/GA) carries long-term compatibility guarantees.
    ref: "concepts.md#api-groups-versions-and-resources-vs-kinds"

  - id: api-objects-kubectl-011
    difficulty: intermediate
    tags: [kubectl, explain, discovery]
    question: |
      Which command prints the schema and documentation for a specific object field
      straight from the server?
    options:
      - "kubectl describe deployment.spec.strategy"
      - "kubectl explain deployment.spec.strategy"
      - "kubectl get deployment --schema"
      - "kubectl api-versions deployment"
    answer: 1
    explanation: |
      kubectl explain <type>.<field> prints the field's schema and docs from the server's
      OpenAPI definitions. Add --recursive for the full field tree. It's the fastest way to
      discover what fields an object supports.
    ref: "concepts.md#api-groups-versions-and-resources-vs-kinds"

  - id: api-objects-kubectl-012
    difficulty: beginner
    tags: [labels, selectors]
    question: |
      What is the primary purpose of labels in Kubernetes?
    options:
      - "To store large binary configuration blobs on an object"
      - "To identify and group objects so they can be selected by label selectors"
      - "To encrypt an object's sensitive fields at rest before they are written to etcd"
      - "To set the CPU and memory resource limits enforced for an object's containers"
    answer: 1
    explanation: |
      Labels are key/value pairs used to identify and group objects. Selectors query them,
      which is how Services find Pods, controllers find their owned objects, and you filter
      with -l. Labels are the loose-coupling glue of the object graph.
    ref: "concepts.md#labels-and-selectors-the-glue"

  - id: api-objects-kubectl-013
    difficulty: intermediate
    tags: [labels, selectors, set-based]
    question: |
      Which selector expression matches Pods whose `environment` label is either `prod` or
      `staging`?
    options:
      - "environment in (prod,staging)"
      - "environment=prod,staging"
      - "environment: [prod, staging]"
      - "environment ~ prod|staging"
    answer: 0
    explanation: |
      Set-based selectors support `in`, `notin`, key existence, and negation. `environment in
      (prod,staging)` matches either value. Equality-based selectors like `environment=prod`
      match only one value; commas mean logical AND, not OR.
    ref: "concepts.md#labels-and-selectors-the-glue"

  - id: api-objects-kubectl-014
    difficulty: intermediate
    tags: [labels, deployment, selector, immutable]
    question: |
      Why must a Deployment's Pod template labels match its `spec.selector.matchLabels`?
    options:
      - "So the kube-dns add-on can register each Pod's hostname for in-cluster DNS resolution"
      - "So the Deployment recognizes the Pods it creates as its own; the selector defines which Pods it manages"
      - "Because the API server rejects any Pod template that omits at least one metadata label"
      - "To ensure the scheduler places the Pods onto the node named in the matching label value"
    answer: 1
    explanation: |
      The selector defines which Pods the Deployment (via its ReplicaSet) owns and counts. If
      the template labels didn't match the selector, the controller would create Pods it
      doesn't recognize as its own. The selector is also immutable after creation.
    ref: "concepts.md#labels-and-selectors-the-glue"

  - id: api-objects-kubectl-015
    difficulty: advanced
    tags: [labels, selector, immutable, gotcha]
    question: |
      You try to change a running Deployment's `spec.selector.matchLabels`. What happens?
    options:
      - "It updates immediately and re-labels all existing Pods"
      - "The API server rejects it because a Deployment's selector is immutable"
      - "It silently creates a second ReplicaSet with the old selector"
      - "It triggers a rolling update with the new labels"
    answer: 1
    explanation: |
      A Deployment's spec.selector is immutable after creation. Changing which Pods it owns
      requires deleting and recreating the Deployment. This prevents a controller from
      abruptly abandoning or hijacking Pods mid-flight.
    ref: "concepts.md#labels-and-selectors-the-glue"

  - id: api-objects-kubectl-016
    difficulty: beginner
    tags: [annotations, labels, comparison]
    question: |
      Which statement about annotations is correct?
    options:
      - "You can select and filter objects by their annotations using the -l selector flag"
      - "Annotations replace labels entirely in Kubernetes versions after 1.16"
      - "Annotations carry non-identifying metadata and cannot be used in selectors"
      - "Annotations are limited to 63 characters like label values"
    answer: 2
    explanation: |
      Annotations hold non-identifying metadata (build info, tool config, URLs, JSON blobs)
      and are NOT selectable. Labels are for identity/selection; annotations are just data
      riding along. Annotations can hold much larger, arbitrary values.
    ref: "concepts.md#annotations-non-identifying-metadata"

  - id: api-objects-kubectl-017
    difficulty: intermediate
    tags: [annotations, use-cases]
    question: |
      Which of these is the most appropriate use of an annotation rather than a label?
    options:
      - "Marking Pods with tier=frontend so a Service's selector can find and route to them"
      - "Tagging objects with environment=prod so you can filter them with a selector query"
      - "Grouping Pods with a shared key so a NetworkPolicy's podSelector can target them"
      - "Storing an ingress controller's rewrite-target configuration on an Ingress"
    answer: 3
    explanation: |
      Ingress controller tuning like nginx.ingress.kubernetes.io/rewrite-target is arbitrary
      config data consumed by a tool — an annotation. The other options are selection-based
      grouping, which is exactly what labels are for.
    ref: "concepts.md#annotations-non-identifying-metadata"

  - id: api-objects-kubectl-018
    difficulty: beginner
    tags: [namespaces, scoping]
    question: |
      What guarantee does a namespace provide about object names?
    options:
      - "Names must be globally unique across the entire cluster, regardless of namespace or resource"
      - "Names must be unique within a namespace + resource, so the same name can exist in different namespaces"
      - "Names are automatically suffixed with a random hash to guarantee they never collide"
      - "Names are shared across all namespaces, so any given name may be claimed only once cluster-wide"
    answer: 1
    explanation: |
      Names are unique per namespace + resource, not cluster-wide. You can have Service/api in
      team-a and Service/api in team-b. Namespaces are a scope for names and a boundary for
      policy (RBAC, quotas, NetworkPolicy).
    ref: "concepts.md#namespaces-and-scoping-namespaced-vs-cluster-scoped"

  - id: api-objects-kubectl-019
    difficulty: intermediate
    tags: [namespaces, cluster-scoped]
    question: |
      Which of these resources is cluster-scoped (not namespaced)?
    options:
      - "ConfigMap"
      - "Deployment"
      - "PersistentVolume"
      - "Role"
    answer: 2
    explanation: |
      PersistentVolume is cluster-scoped, along with Node, Namespace, StorageClass,
      ClusterRole, ClusterRoleBinding, and CRDs. ConfigMap, Deployment, and Role are all
      namespaced (Role vs the cluster-scoped ClusterRole is a common trap).
    ref: "concepts.md#namespaces-and-scoping-namespaced-vs-cluster-scoped"

  - id: api-objects-kubectl-020
    difficulty: intermediate
    tags: [namespaces, isolation, networking]
    question: |
      Does putting two applications in separate namespaces prevent their Pods from reaching
      each other over the network?
    options:
      - "No, namespaces provide scoping/policy, not network isolation; Pods can still communicate unless a NetworkPolicy restricts it"
      - "Yes, each namespace gets an isolated network segment, so cross-namespace Pod traffic is dropped at the CNI layer by default"
      - "Yes, but only when the Pods land on the same node, because namespace isolation is enforced by the node's kube-proxy rules"
      - "No, but Pods can only reach each other after you create a ResourceQuota that explicitly grants cross-namespace network access"
    answer: 0
    explanation: |
      Namespaces scope names and policy, not the network. By default Pods in different
      namespaces can still reach each other; you need a NetworkPolicy to restrict traffic
      (covered in workload-network-security). DNS reflects namespaces via
      <service>.<namespace>.svc.cluster.local.
    ref: "concepts.md#namespaces-and-scoping-namespaced-vs-cluster-scoped"

  - id: api-objects-kubectl-021
    difficulty: beginner
    tags: [namespaces, kubectl]
    question: |
      Which flag makes `kubectl get pods` list Pods across every namespace?
    options:
      - "-A"
      - "--every-namespace"
      - "-n all"
      - "--global"
    answer: 0
    explanation: |
      -A (equivalent to --all-namespaces) lists across all namespaces. -n <ns> targets one
      namespace; without either, kubectl uses the context's default namespace (usually
      `default`).
    ref: "concepts.md#namespaces-and-scoping-namespaced-vs-cluster-scoped"

  - id: api-objects-kubectl-022
    difficulty: beginner
    tags: [kubectl, describe, debugging]
    question: |
      A Pod isn't starting and you want to see the events (scheduling failures, image pulls,
      probe failures) associated with it. Which command is the best first step?
    options:
      - "kubectl get pod <name> -o name"
      - "kubectl apply -f pod.yaml"
      - "kubectl describe pod <name>"
      - "kubectl explain pod"
    answer: 2
    explanation: |
      kubectl describe pod <name> shows human-readable detail plus the object's Events —
      scheduling failures, image pull errors, probe failures, OOMKills. It's the standard
      first stop for debugging why a Pod isn't healthy.
    ref: "concepts.md#kubectl-essentials-get-describe-apply-logs-exec-explain"

  - id: api-objects-kubectl-023
    difficulty: intermediate
    tags: [kubectl, logs, crashloop, debugging]
    question: |
      A Pod is in CrashLoopBackOff. `kubectl logs <pod>` shows nothing useful because the
      container already restarted. How do you see the logs from the crashed instance?
    options:
      - "kubectl logs <pod> --since=1h"
      - "kubectl describe pod <pod> --logs"
      - "kubectl logs <pod> --previous"
      - "kubectl get pod <pod> -o logs"
    answer: 2
    explanation: |
      kubectl logs <pod> --previous retrieves logs from the previous (crashed) container
      instance, which is essential for diagnosing CrashLoopBackOff since the current instance
      may have just started or not started at all.
    ref: "concepts.md#kubectl-essentials-get-describe-apply-logs-exec-explain"

  - id: api-objects-kubectl-024
    difficulty: beginner
    tags: [kubectl, exec]
    question: |
      Which command opens an interactive shell inside a running container in Pod `web`?
    options:
      - "kubectl exec -it web -- sh"
      - "kubectl attach web sh"
      - "kubectl run web -- sh"
      - "kubectl shell web"
    answer: 0
    explanation: |
      kubectl exec -it <pod> -- <command> runs a command inside a running container; -it gives
      an interactive TTY. kubectl run creates a new Pod, and attach connects to an existing
      process's streams rather than starting a new shell.
    ref: "concepts.md#kubectl-essentials-get-describe-apply-logs-exec-explain"

  - id: api-objects-kubectl-025
    difficulty: intermediate
    tags: [kubectl, output, jsonpath]
    question: |
      You want to script-extract just the names of all Pods. Which output format is most
      appropriate?
    options:
      - "-o wide"
      - "-o describe"
      - "-o jsonpath='{.items[*].metadata.name}'"
      - "-o events"
    answer: 2
    explanation: |
      -o jsonpath lets you extract specific fields with a JSONPath expression —
      {.items[*].metadata.name} yields every Pod name. jsonpath and custom-columns are the
      scripting workhorses; prefer them over grep/awk on table output.
    ref: "concepts.md#output-formats-yaml-json-wide-jsonpath"

  - id: api-objects-kubectl-026
    difficulty: intermediate
    tags: [kubectl, output, yaml]
    question: |
      Why does `kubectl get pod web -o yaml` show fields (like uid, resourceVersion, and a
      full status) that weren't in the manifest you applied?
    options:
      - "kubectl injects placeholder uid and resourceVersion values purely for on-screen display"
      - "The manifest file was silently rewritten on disk by kubectl to add the server's bookkeeping fields"
      - "It shows the live object as stored by the server, including server-set metadata, defaults, and status"
      - "Those extra bookkeeping fields are only rendered when the Pod is unhealthy or failing a probe"
    answer: 2
    explanation: |
      -o yaml/json returns the live object as stored by the server, including fields you never
      wrote: defaults the API server filled in, server-set metadata (uid, resourceVersion,
      creationTimestamp), and the controller-written status. That differs from your source
      manifest.
    ref: "concepts.md#output-formats-yaml-json-wide-jsonpath"

  - id: api-objects-kubectl-027
    difficulty: beginner
    tags: [kubectl, output, wide]
    question: |
      Which output format adds extra columns like the node and Pod IP to the default table?
    options:
      - "-o wide"
      - "-o name"
      - "-o yaml"
      - "-o json"
    answer: 0
    explanation: |
      -o wide keeps the table format but adds extra columns such as the node the Pod is on and
      its IP. yaml/json return the full object; name returns just resource/name.
    ref: "concepts.md#output-formats-yaml-json-wide-jsonpath"

  - id: api-objects-kubectl-028
    difficulty: beginner
    tags: [apply, create, imperative-declarative]
    question: |
      What is the key behavioral difference between `kubectl create -f x.yaml` and
      `kubectl apply -f x.yaml` when the object already exists?
    options:
      - "create patches the existing object in place, while apply aborts with an AlreadyExists error"
      - "create errors with AlreadyExists; apply updates it to match the file (idempotent)"
      - "Both commands fail identically with the same AlreadyExists error and leave the object unchanged"
      - "create deletes the existing object and recreates it from scratch, while apply becomes a no-op"
    answer: 1
    explanation: |
      create is imperative and fails with AlreadyExists if the object exists. apply is
      declarative and idempotent: it creates the object if absent and updates it to match if
      present. That idempotency is why apply underpins GitOps.
    ref: "concepts.md#declarative-apply-vs-imperative-commands"

  - id: api-objects-kubectl-029
    difficulty: beginner
    tags: [imperative, commands]
    question: |
      Which of these is an imperative kubectl command?
    options:
      - "kubectl apply -f deploy.yaml"
      - "kubectl diff -f deploy.yaml"
      - "kubectl apply -k ./overlays/prod"
      - "kubectl scale deployment web --replicas=5"
    answer: 3
    explanation: |
      kubectl scale issues a direct action — imperative. So are create, run, delete, set
      image, and expose. apply (and apply -k for kustomize) and diff are part of the
      declarative workflow.
    ref: "concepts.md#declarative-apply-vs-imperative-commands"

  - id: api-objects-kubectl-030
    difficulty: intermediate
    tags: [apply, imperative, drift, gotcha]
    question: |
      You scaled a Deployment to 5 replicas with `kubectl scale`, then re-ran `kubectl apply`
      from a manifest that still says `replicas: 3`. Using classic client-side apply, what
      happens to the replica count?
    options:
      - "It stays at 5 because client-side apply treats replicas as an imperative-only field it never reconciles"
      - "It errors out with a field-ownership conflict and leaves the replica count at 5 until you resolve it"
      - "It is set back to 3 because the manifest declares replicas: 3 and apply manages that field"
      - "It is set to 8, because apply adds the manifest's 3 to the 5 replicas already scaled up"
    answer: 2
    explanation: |
      Because the manifest declares replicas: 3 and apply manages that field (it's in the
      last-applied configuration), apply reconciles the live value back to 3. Mixing
      imperative edits with declarative apply is exactly why drift surprises happen.
    ref: "concepts.md#declarative-apply-vs-imperative-commands"

  - id: api-objects-kubectl-031
    difficulty: advanced
    tags: [three-way-merge, last-applied, apply]
    question: |
      Classic client-side `kubectl apply` uses a three-way merge. Which three inputs does it
      combine?
    options:
      - "The object's spec block, its controller-written status block, and its recent event stream"
      - "The new manifest, the old manifest on disk, and etcd's write-ahead log"
      - "The parent Deployment object, its managed ReplicaSet, and the Pods that ReplicaSet owns"
      - "The new manifest, the last-applied-configuration annotation, and the live object"
    answer: 3
    explanation: |
      The three-way merge combines your new manifest, the
      kubectl.kubernetes.io/last-applied-configuration annotation (what you applied last time),
      and the live object on the server. Diffing new vs last-applied reveals which fields you
      added, changed, or removed.
    ref: "concepts.md#the-three-way-merge-and-last-applied-configuration"

  - id: api-objects-kubectl-032
    difficulty: advanced
    tags: [three-way-merge, deletion, last-applied]
    question: |
      What role does the `last-applied-configuration` annotation play in client-side apply?
    options:
      - "It lets kubectl detect which fields you removed since last apply, so it can delete them without touching fields it never managed"
      - "It caches the object's full status block so kubectl can show a diff of observed state for auditing"
      - "It holds an encrypted copy of the manifest at rest so secrets in the spec are never stored in plaintext"
      - "It records the username and timestamp of the last apply so RBAC can attribute the change to an actor"
    answer: 0
    explanation: |
      The annotation is kubectl's memory of what it applied last time. By diffing the new
      manifest against it, kubectl knows which fields you dropped and can delete them, while
      leaving fields it never managed (like an HPA-controlled replica count or server
      defaults) untouched.
    ref: "concepts.md#the-three-way-merge-and-last-applied-configuration"

  - id: api-objects-kubectl-033
    difficulty: intermediate
    tags: [server-side-apply, field-management]
    question: |
      Where does server-side apply track which actor owns each field of an object?
    options:
      - "In the kubectl.kubernetes.io/last-applied-configuration annotation on the object"
      - "In a separate cluster-scoped ConfigMap that maps each field path to its owning manager"
      - "In metadata.managedFields, maintained by the API server"
      - "Only inside etcd's internal transaction log, which the API server consults on each apply"
    answer: 2
    explanation: |
      Server-side apply records field ownership in metadata.managedFields, maintained by the
      API server. Each field manager records which fields it set and via which operation
      (Apply vs Update). This replaces the client-side last-applied annotation.
    ref: "concepts.md#server-side-apply-and-field-management"

  - id: api-objects-kubectl-034
    difficulty: advanced
    tags: [server-side-apply, conflict, force]
    question: |
      With server-side apply, you try to change a field another manager owns. What happens,
      and how do you take ownership if you're sure?
    options:
      - "The server returns a conflict error; you can force it with kubectl apply --server-side --force-conflicts"
      - "It silently overwrites the other manager's value and transfers ownership with no flag required"
      - "It automatically merges both managers' values into a list so neither write is lost"
      - "The apply is queued and retried in the background until the other manager releases the field"
    answer: 0
    explanation: |
      SSA returns an explicit conflict rather than silently overwriting. You resolve it by
      forcing with --server-side --force-conflicts (take ownership), dropping the field (yield
      the claim), or matching the current value (become a shared owner).
    ref: "concepts.md#server-side-apply-and-field-management"

  - id: api-objects-kubectl-035
    difficulty: intermediate
    tags: [server-side-apply, ga-version]
    question: |
      Server-side apply's main advantage over client-side apply is that it enables safe
      multi-writer collaboration. Which statement captures why?
    options:
      - "It compresses each submitted manifest before storage, shrinking the object's footprint in etcd"
      - "It keeps every historical revision of the object so multiple writers can diff against past states"
      - "It bypasses admission webhooks on apply, letting concurrent writers commit changes faster"
      - "Field ownership makes overlapping writes explicit conflicts instead of silent overwrites"
    answer: 3
    explanation: |
      Because SSA tracks per-field ownership, an HPA can own replicas while a GitOps tool owns
      the image/template, and neither silently stomps the other — overlaps surface as explicit
      conflicts. SSA went GA in Kubernetes 1.22; note the kubectl apply CLI still defaults to
      client-side apply unless you pass --server-side, though the API server tracks managedFields
      for every writer regardless.
    ref: "concepts.md#server-side-apply-and-field-management"

  - id: api-objects-kubectl-036
    difficulty: intermediate
    tags: [dry-run, client, server]
    question: |
      What is the key difference between `--dry-run=client` and `--dry-run=server`?
    options:
      - "client processes locally without contacting the API server; server runs the full pipeline (validation, defaulting, admission webhooks) but doesn't persist"
      - "client writes the object to etcd for a moment then rolls it back, whereas server never persists at all"
      - "They are just two aliases for the same flag and produce byte-for-byte identical output"
      - "server is faster than client because it skips schema validation and admission entirely"
    answer: 0
    explanation: |
      --dry-run=client processes the manifest locally with no server contact, so it skips
      validation, defaulting, and admission webhooks. --dry-run=server sends the request
      through the whole API pipeline — including admission/validating webhooks — but does not
      persist to etcd, giving a true "what would happen?" check.
    ref: "concepts.md#dry-run-client-vs-server"

  - id: api-objects-kubectl-037
    difficulty: intermediate
    tags: [dry-run, generate-yaml, kubectl]
    question: |
      Which command generates a Deployment manifest YAML without creating anything in the
      cluster?
    options:
      - "kubectl create deployment web --image=nginx -o yaml --dry-run=client"
      - "kubectl apply deployment web --image=nginx --recursive -o yaml"
      - "kubectl generate deployment web --image=nginx -o yaml"
      - "kubectl get deployment web -o yaml --show-managed-fields"
    answer: 0
    explanation: |
      kubectl create ... -o yaml --dry-run=client processes the request locally and prints the
      resulting YAML without contacting the server or persisting anything — the idiomatic way
      to scaffold a manifest from an imperative command.
    ref: "concepts.md#dry-run-client-vs-server"

  - id: api-objects-kubectl-038
    difficulty: advanced
    tags: [dry-run, admission, ci]
    question: |
      You want CI to catch that a manifest would be rejected by a Pod Security admission
      policy BEFORE merging. Which check works?
    options:
      - "kubectl apply --dry-run=client -f manifest.yaml"
      - "kubectl apply --dry-run=server -f manifest.yaml"
      - "kubectl explain -f manifest.yaml"
      - "kubectl validate manifest.yaml"
    answer: 1
    explanation: |
      Only --dry-run=server runs the request through admission controllers and
      validating/mutating webhooks (including Pod Security Standards, OPA/Kyverno). Client
      dry-run never contacts the server, so it can't catch admission rejections.
    ref: "concepts.md#dry-run-client-vs-server"

  - id: api-objects-kubectl-039
    difficulty: beginner
    tags: [kubeconfig, context]
    question: |
      In a kubeconfig, what does a "context" combine?
    options:
      - "A Pod, a Service, and an Ingress"
      - "A cluster, a user, and a default namespace"
      - "A CA certificate and a private key only"
      - "An API group and its version, such as apps/v1"
    answer: 1
    explanation: |
      A context is a named triple of cluster (where) + user (who/credentials) + default
      namespace. current-context points at the active one. Switching contexts moves you
      between clusters or identities without retyping connection details.
    ref: "concepts.md#kubeconfig-clusters-users-and-contexts"

  - id: api-objects-kubectl-040
    difficulty: beginner
    tags: [kubeconfig, kubectl, context]
    question: |
      Which command switches the active cluster/identity by changing the current context?
    options:
      - "kubectl config use-context prod"
      - "kubectl config set-cluster prod --current"
      - "kubectl config switch-context prod"
      - "kubectl config change-context prod"
    answer: 0
    explanation: |
      kubectl config use-context <name> sets current-context to that named cluster+user+namespace
      combination. get-contexts lists them and current-context shows the active one.
    ref: "concepts.md#kubeconfig-clusters-users-and-contexts"

  - id: api-objects-kubectl-041
    difficulty: intermediate
    tags: [kubeconfig, safety, context]
    question: |
      A large share of "I ran it against the wrong cluster" incidents trace back to what?
    options:
      - "Using -o yaml instead of -o json when reading the object back"
      - "Forgetting to re-run kubectl apply a second time to commit the change"
      - "An unexpected active current-context in the kubeconfig"
      - "Missing identifying labels on the target Pods being operated on"
    answer: 2
    explanation: |
      current-context is shared, stateful, and easy to forget. Running a destructive command
      while pointed at the wrong context hits the wrong cluster. Verify with kubectl config
      current-context (or a prompt tool) before destructive prod operations.
    ref: "concepts.md#kubeconfig-clusters-users-and-contexts"

  - id: api-objects-kubectl-042
    difficulty: intermediate
    tags: [kubeconfig, env]
    question: |
      Which environment variable lets you point kubectl at a non-default kubeconfig (or merge
      several)?
    options:
      - "KUBE_CONFIG_PATH"
      - "KUBECTL_HOME"
      - "KUBE_CONTEXT"
      - "KUBECONFIG"
    answer: 3
    explanation: |
      The KUBECONFIG env var overrides the default ~/.kube/config and can list several files
      (colon-separated) that kubectl merges. --kubeconfig does the same per-command.
    ref: "concepts.md#kubeconfig-clusters-users-and-contexts"

  - id: api-objects-kubectl-043
    difficulty: intermediate
    tags: [finalizers, deletion, lifecycle]
    question: |
      What does the API server do when you delete an object that still has entries in
      `metadata.finalizers`?
    options:
      - "Immediately removes the object from etcd and discards its finalizer list without running them"
      - "Sets metadata.deletionTimestamp (object becomes Terminating) and waits until finalizers are cleared before removing it"
      - "Rejects the delete request with a 409 error until every finalizer key is removed by hand first"
      - "Moves the object to the kube-system namespace and pauses its owning controller's reconcile loop"
    answer: 1
    explanation: |
      The API server sets deletionTimestamp (the object enters Terminating) and returns 202
      Accepted, but does not remove the object until every finalizer key is cleared by its
      responsible controller. This lets controllers run cleanup before actual deletion.
    ref: "concepts.md#finalizers-and-the-deletion-lifecycle"

  - id: api-objects-kubectl-044
    difficulty: advanced
    tags: [finalizers, stuck-terminating, gotcha]
    question: |
      A PersistentVolume has been stuck in `Terminating` for an hour. What is the most likely
      cause?
    options:
      - "etcd is out of disk space and has entered read-only compaction mode"
      - "A finalizer's controller is gone or wedged and never removed its finalizer key"
      - "The object was created in the wrong namespace so its owner cannot be found"
      - "The API server is rejecting the delete because of a stale resourceVersion token"
    answer: 1
    explanation: |
      A stuck Terminating object almost always means a finalizer (e.g. pv-protection) whose
      controller is gone or wedged, so the key is never cleared. Force-removing the finalizer
      makes it vanish but skips the guarded cleanup, risking leaked cloud resources.
    ref: "concepts.md#finalizers-and-the-deletion-lifecycle"

  - id: api-objects-kubectl-045
    difficulty: intermediate
    tags: [owner-references, garbage-collection]
    question: |
      What do owner references (metadata.ownerReferences) drive in Kubernetes?
    options:
      - "Network routing and service discovery between Pods across namespaces"
      - "Which node a Pod is scheduled onto during placement decisions"
      - "Garbage collection: the GC uses them (not labels) to decide which dependents to delete when an owner is removed"
      - "RBAC permissions granted to a ServiceAccount for the owning object"
    answer: 2
    explanation: |
      Owner references express parent to child relationships (Deployment owns ReplicaSet owns
      Pods) storing the owner's uid. The garbage collector uses these references — not labels
      — to determine which dependents to clean up when an owner is deleted.
    ref: "concepts.md#owner-references-and-cascading-deletion"

  - id: api-objects-kubectl-046
    difficulty: intermediate
    tags: [cascading-deletion, orphan, gotcha]
    question: |
      You run `kubectl delete deployment web --cascade=orphan`. What is the result?
    options:
      - "The Deployment and all its Pods are deleted immediately in the foreground"
      - "Only the Pods are deleted while the Deployment and its ReplicaSet remain in place"
      - "Nothing is deleted until every Pod finishes draining its active connections"
      - "The Deployment is deleted but the ReplicaSet and Pods keep running with no controller managing them"
    answer: 3
    explanation: |
      The orphan policy deletes the owner but keeps its dependents, clearing their owner
      references. The Deployment goes away while its ReplicaSet and Pods keep running,
      unmanaged — a common cause of "I deleted the Deployment but Pods are still running."
    ref: "concepts.md#owner-references-and-cascading-deletion"

  - id: api-objects-kubectl-047
    difficulty: advanced
    tags: [cascading-deletion, foreground, background]
    question: |
      What is the difference between foreground and background cascading deletion?
    options:
      - "They are identical except for the logging verbosity emitted by the garbage collector"
      - "Foreground orphans dependents and clears their owner references; background deletes them"
      - "Foreground deletes dependents first then the owner (owner stays until children are gone); background deletes the owner immediately and cleans dependents asynchronously"
      - "Foreground runs the deletion on the kubectl client; background runs it inside the API server"
    answer: 2
    explanation: |
      Foreground (via the foregroundDeletion finalizer) keeps the owner in "deletion in
      progress" until all dependents are deleted, then removes the owner. Background (the
      default) removes the owner immediately and the GC deletes dependents asynchronously
      afterward.
    ref: "concepts.md#owner-references-and-cascading-deletion"

  - id: api-objects-kubectl-048
    difficulty: advanced
    tags: [lifecycle, admission, reconciliation]
    question: |
      When you `kubectl apply` a manifest, in what order does the API server process the
      request before persisting it?
    options:
      - "Authenticate and authorize (RBAC), then admission (mutating, schema validation, validating), then persist to etcd"
      - "Persist to etcd first, then authenticate the caller, then run admission after the write"
      - "Run the owning controller's reconcile loop, then authorize via RBAC, then persist to etcd"
      - "Validate against the last-applied annotation, then schedule the Pod, then persist to etcd"
    answer: 0
    explanation: |
      The pipeline is: authenticate the caller, authorize via RBAC, then admission — mutating
      webhooks/controllers, schema validation, then validating webhooks — and only then
      persist the accepted spec to etcd with server-set metadata filled in.
    ref: "concepts.md#the-object-lifecycle-from-apply-to-reconciliation"

  - id: api-objects-kubectl-049
    difficulty: advanced
    tags: [reconciliation, level-triggered, self-healing]
    question: |
      Kubernetes controllers are described as "level-triggered." What practical property does
      this give?
    options:
      - "They act exactly once, at the moment an object is first created, and never again"
      - "They require an explicit manual trigger or API call before each reconcile pass"
      - "They re-check desired-vs-actual state on every resync and correct drift, rather than only reacting to a single change event"
      - "They process incoming watch events in strict FIFO order with no retries on failure"
    answer: 2
    explanation: |
      Level-triggered (vs edge-triggered) means controllers repeatedly compare desired vs
      actual state and converge, so they self-heal drift even if they missed an event. This is
      why a deleted Pod gets recreated and why re-applying an unchanged manifest is a safe
      no-op.
    ref: "concepts.md#the-object-lifecycle-from-apply-to-reconciliation"

  - id: api-objects-kubectl-050
    difficulty: advanced
    tags: [resourceVersion, optimistic-concurrency]
    question: |
      What is `metadata.resourceVersion` used for?
    options:
      - "It records the container image tag and digest currently running in the object"
      - "It counts the number of times the object has been read or viewed via the API"
      - "It tracks the Kubernetes release version the object was originally created on"
      - "It is an optimistic-concurrency token: an update carries the version it read, and the server rejects the write with a conflict if the object changed underneath"
    answer: 3
    explanation: |
      resourceVersion is the optimistic-concurrency token. Updates carry the version they read;
      if the object changed since then, the server returns a Conflict and the client must
      re-read and retry. This lets many controllers safely write shared state through one API
      server without locks.
    ref: "concepts.md#the-object-lifecycle-from-apply-to-reconciliation"

  - id: api-objects-kubectl-051
    difficulty: beginner
    tags: [kubectl, api-resources, discovery]
    question: |
      Which command lists every resource type with its short name, API group, whether it's
      namespaced, and its kind?
    options:
      - "kubectl explain all"
      - "kubectl api-resources"
      - "kubectl get all"
      - "kubectl describe resources"
    answer: 1
    explanation: |
      kubectl api-resources lists all resource types with columns for NAME, SHORTNAMES,
      APIVERSION, NAMESPACED, and KIND. You can filter with --namespaced=true/false. kubectl
      get all only lists common workload objects, not resource metadata.
    ref: "concepts.md#api-groups-versions-and-resources-vs-kinds"

  - id: api-objects-kubectl-052
    difficulty: intermediate
    tags: [kubectl, diff, apply]
    question: |
      What does `kubectl diff -f manifest.yaml` show?
    options:
      - "The difference between two git commits of the manifest"
      - "The difference between the alpha and stable API versions"
      - "A list of all Pods that don't match the manifest's labels"
      - "What apply would change on the live object, computed against the server"
    answer: 3
    explanation: |
      kubectl diff sends the manifest to the server to compute what an apply would change on
      the live object, and prints the diff — without persisting. It's commonly paired with
      --dry-run=server in CI to preview changes and catch policy rejections.
    ref: "concepts.md#dry-run-client-vs-server"

  - id: api-objects-kubectl-053
    difficulty: expert
    tags: [server-side-apply, hpa, field-management, scenario]
    question: |
      An HPA is actively managing a Deployment's `spec.replicas`. Your GitOps tool then does a
      server-side apply of a manifest that also sets `replicas`. What is the cleanest outcome
      that avoids the two fighting?
    options:
      - "The GitOps tool should always pass --force-conflicts so its apply wins and takes the field"
      - "The GitOps tool should omit replicas from its manifest so the HPA remains the sole owner of that field"
      - "The HPA should be deleted and recreated around every apply the GitOps tool performs"
      - "Both managers should hard-code replicas to an identical fixed value and keep it there forever"
    answer: 1
    explanation: |
      With SSA's field ownership, the fix is for the GitOps tool to NOT declare replicas,
      leaving the HPA as sole owner of that field. If the tool declares it, the server raises
      a conflict; forcing it would strip the HPA's ownership and cause thrashing. Omitting the
      field is the idiomatic resolution.
    ref: "concepts.md#server-side-apply-and-field-management"

  - id: api-objects-kubectl-054
    difficulty: intermediate
    tags: [object-model, scenario, manifest]
    question: |
      A teammate's manifest has `apiVersion: apps/v1`, `kind: Deployment`, and a `spec` but no
      `metadata.name`. What happens on apply?
    options:
      - "It succeeds and the API server auto-generates a random hashed name from the spec"
      - "It creates a Deployment named 'default' matching the current context's namespace"
      - "It creates the Deployment in the kube-system namespace as an unnamed system object"
      - "It is rejected because a name (or generateName) is required to identify the object"
    answer: 3
    explanation: |
      An object needs an identifier — metadata.name (or generateName for server-generated
      names). Without one, apply/create is rejected. Names must be unique within the
      namespace + resource.
    ref: "concepts.md#the-object-model-apiversion-kind-metadata-spec-status"

  - id: api-objects-kubectl-055
    difficulty: intermediate
    tags: [labels, kubectl, bulk-operations, scenario]
    question: |
      You run `kubectl delete pods -l app=web,environment=prod`. Which Pods are deleted?
    options:
      - "Pods with both app=web AND environment=prod"
      - "Pods with app=web OR environment=prod"
      - "All Pods, because -l is ignored by delete"
      - "Only the first Pod matching app=web"
    answer: 0
    explanation: |
      In equality-based selectors, a comma means logical AND. So this deletes only Pods that
      have both app=web AND environment=prod. Selectors power bulk kubectl operations just as
      they power Service/controller ownership.
    ref: "concepts.md#labels-and-selectors-the-glue"
