topic: "Pods & Workload Controllers"
domain: kubernetes
topic_slug: pods-workload-controllers
version: 1
questions:
  - id: pods-workload-controllers-001
    difficulty: beginner
    tags: [pod, fundamentals]
    question: |
      What is a Pod in Kubernetes?
    options:
      - "A physical worker machine, equipped with a container runtime, onto which the scheduler places workloads"
      - "The smallest deployable unit: one or more containers that share a network namespace and can share volumes"
      - "Simply another name for one Docker container, mapping one-to-one onto a single OCI image instance"
      - "A cluster-wide load balancer that spreads inbound traffic evenly across all containers"
    answer: 1
    explanation: |
      A Pod is the smallest deployable object in the Kubernetes API. It wraps one or more containers
      that are co-scheduled on the same node and share a network namespace (one IP, shared localhost
      and port space) and can share volumes. You cannot schedule a lone container — only a Pod.
    ref: "concepts.md#what-is-a-pod"

  - id: pods-workload-controllers-002
    difficulty: beginner
    tags: [pod, networking]
    question: |
      Two containers in the same Pod need to talk to each other. How do they reach one another?
    options:
      - "Through a Service object that load-balances between them"
      - "Only by writing to a shared file, never over the network"
      - "Via the node's external IP address, dialing the port that kube-proxy has published on the host"
      - "Over the Pod's shared network namespace via localhost"
    answer: 3
    explanation: |
      All containers in a Pod share one network namespace — a single IP and port space — so they
      reach each other over localhost. They must not bind the same port. A Service is only needed to
      reach Pods from outside the Pod.
    ref: "concepts.md#what-is-a-pod"

  - id: pods-workload-controllers-003
    difficulty: intermediate
    tags: [pod, pause-container, internals]
    question: |
      What is the role of the hidden "pause" (infrastructure) container in a Pod?
    options:
      - "It runs the application's main process while the other containers act as its helpers"
      - "It holds the shared network (and IPC) namespace open so app containers can join it"
      - "It suspends the Pod during rolling updates so old and new revisions never overlap"
      - "It monitors per-container resource usage and enforces the Pod's cgroup memory limits"
    answer: 1
    explanation: |
      The pause container holds the Pod's shared namespaces (network, IPC) open. App containers join
      that namespace, which is why the Pod IP survives an individual app-container restart but not a
      Pod reschedule. It runs no application logic.
    ref: "concepts.md#what-is-a-pod"

  - id: pods-workload-controllers-004
    difficulty: beginner
    tags: [bare-pod, self-healing]
    question: |
      Why are bare (directly-created) Pods discouraged for application workloads?
    options:
      - "They are forbidden from mounting volumes because no controller exists to provision the PVC for them"
      - "They start more slowly because the scheduler deprioritizes any Pod lacking an ownerReference"
      - "They cannot be assigned a cluster IP, so nothing on the Pod network is ever able to reach them"
      - "They have no self-healing — nothing recreates them if the node dies or they are evicted"
    answer: 3
    explanation: |
      A bare Pod has no controller watching over it. If its node fails or it is evicted, nothing
      recreates it. Controllers (Deployment, StatefulSet, etc.) reconcile desired state and replace
      lost Pods, which is why you deploy those instead of naked Pods.
    ref: "concepts.md#why-you-rarely-create-bare-pods"

  - id: pods-workload-controllers-005
    difficulty: intermediate
    tags: [bare-pod, static-pod, debugging]
    question: |
      Which is a legitimate use of a bare Pod (not managed by a workload controller)?
    options:
      - "Running a production stateless web API that must survive node failures and scale on demand"
      - "A short-lived debugging Pod, or a static Pod managed directly by the kubelet"
      - "Running a clustered database that needs stable per-replica storage and a fixed network identity"
      - "A per-node log-collection agent that must appear automatically on every node as it joins"
    answer: 1
    explanation: |
      Bare Pods are fine for interactive debugging (kubectl run -it --rm) and for static Pods that
      the kubelet manages directly from an on-disk manifest (how kubeadm runs control-plane
      components). Production apps, stateful services, and per-node agents each want a proper
      controller.
    ref: "concepts.md#why-you-rarely-create-bare-pods"

  - id: pods-workload-controllers-006
    difficulty: intermediate
    tags: [reconciliation, control-loop]
    question: |
      Kubernetes controllers are described as "level-triggered." What does that mean?
    options:
      - "They only act on a one-time edge event and permanently miss the change whenever that event is dropped"
      - "They require an administrator to manually trigger each reconciliation pass from the command line"
      - "They react to the current observed level of state and converge toward desired state on each pass, even if an event was missed"
      - "They run their reconcile logic exactly once, at cluster startup, and then remain idle afterward"
    answer: 2
    explanation: |
      Level-triggered means the loop compares the current level of actual state to desired state and
      acts to close the gap on every pass — it doesn't depend on catching a single edge/event. This
      makes controllers robust and self-healing: a missed event is corrected on the next reconcile.
    ref: "concepts.md#the-reconciliation-loop-controllers"

  - id: pods-workload-controllers-007
    difficulty: beginner
    tags: [reconciliation, declarative]
    question: |
      In the declarative model, what is the difference between an object's `spec` and its `status`?
    options:
      - "spec is what you declare as desired; status is the observed actual state maintained by the controller"
      - "spec is the observed state the controller reports, while status is the request you submit to the API"
      - "They are byte-for-byte identical copies kept in sync so the object survives a control-plane failover"
      - "spec exists only on Pod objects, while status is a field that appears only on controller objects"
    answer: 0
    explanation: |
      spec holds your declared desired state; status holds the controller's observed actual state.
      The reconciliation loop continuously drives status toward spec. This split is the backbone of
      every Kubernetes object.
    ref: "concepts.md#the-reconciliation-loop-controllers"

  - id: pods-workload-controllers-008
    difficulty: intermediate
    tags: [reconciliation, deployment, scenario]
    question: |
      A Pod is managed by a Deployment. You run `kubectl delete pod <name>`. What happens?
    options:
      - "The Pod is gone permanently and the application quietly runs one replica short from then on"
      - "The Deployment and its ReplicaSet are cascade-deleted along with the Pod you removed"
      - "kubectl refuses the command outright because the Pod carries an ownerReference to a controller"
      - "The owning ReplicaSet's reconciler sees replicas below desired and creates a replacement Pod within seconds"
    answer: 3
    explanation: |
      Deleting a controller-owned Pod just lowers the observed replica count. The ReplicaSet's loop
      detects the shortfall and creates a new Pod almost immediately. To truly remove the workload
      you edit/scale/delete the controller, not the Pod.
    ref: "concepts.md#the-reconciliation-loop-controllers"

  - id: pods-workload-controllers-009
    difficulty: intermediate
    tags: [ownership, garbage-collection]
    question: |
      How does a ReplicaSet know which Pods belong to it, and how does the garbage collector clean up
      Pods when the ReplicaSet is deleted?
    options:
      - "By matching a shared Pod name prefix, and the garbage collector deletes anything with that prefix"
      - "By the node the Pods land on, cleaning up every Pod scheduled to the same node as the ReplicaSet"
      - "By the chronological order in which the Pods were created relative to the ReplicaSet's own timestamp"
      - "Via a label selector plus ownerReferences stamped on each created Pod"
    answer: 3
    explanation: |
      A ReplicaSet matches Pods by its label selector and stamps each Pod it creates with an
      ownerReference. The selector tells it which Pods to count/own, and the ownerReference lets the
      garbage collector cascade-delete the Pods when the owner is removed.
    ref: "concepts.md#the-reconciliation-loop-controllers"

  - id: pods-workload-controllers-010
    difficulty: beginner
    tags: [replicaset]
    question: |
      What is the core job of a ReplicaSet?
    options:
      - "To place exactly one Pod on every node and track the node set as machines join or leave"
      - "To run a Pod through to successful completion and then stop retrying once it finishes"
      - "To act as the scheduler, placing Pods onto nodes according to affinity and taint rules"
      - "To maintain a stable set of N identical Pod replicas at all times"
    answer: 3
    explanation: |
      A ReplicaSet keeps a specified number (.spec.replicas) of identical Pods running, creating or
      deleting Pods that match its selector to hit that number. One-per-node is a DaemonSet;
      run-to-completion is a Job.
    ref: "concepts.md#replicaset"

  - id: pods-workload-controllers-011
    difficulty: intermediate
    tags: [replicaset, deployment]
    question: |
      Why do you almost never create a ReplicaSet directly?
    options:
      - "ReplicaSets are capped at a single replica and cannot scale beyond one Pod no matter the spec"
      - "ReplicaSets have been deprecated and removed from recent versions of the Kubernetes API entirely"
      - "A Deployment manages ReplicaSets for you and adds rolling updates and rollback, which a ReplicaSet alone lacks"
      - "ReplicaSets support only manual scaling and cannot be targeted by a HorizontalPodAutoscaler"
    answer: 2
    explanation: |
      A bare ReplicaSet has no update strategy — changing its Pod template does not replace running
      Pods. Deployments own ReplicaSets and orchestrate rolling updates and rollbacks, so you almost
      always create a Deployment and let it manage the ReplicaSet.
    ref: "concepts.md#replicaset"

  - id: pods-workload-controllers-012
    difficulty: intermediate
    tags: [replicaset, selector, gotcha]
    question: |
      What can happen if a bare Pod's labels happen to match a ReplicaSet's selector?
    options:
      - "The ReplicaSet adopts the Pod and counts it toward its replica total"
      - "The API server rejects the Pod at admission because its labels collide with a controller's selector"
      - "The ReplicaSet ignores the Pod entirely since it lacks a matching ownerReference back to the ReplicaSet"
      - "The node hosting the duplicate Pod is cordoned automatically to prevent further scheduling conflicts"
    answer: 0
    explanation: |
      A ReplicaSet adopts any matching Pod (including a pre-existing bare one) via its selector and
      counts it toward .spec.replicas — potentially leaving it short a Pod it creates itself. This is
      a subtle gotcha of overlapping labels.
    ref: "concepts.md#replicaset"

  - id: pods-workload-controllers-013
    difficulty: beginner
    tags: [deployment, stateless]
    question: |
      A Deployment is the recommended controller for which kind of workload?
    options:
      - "Stateful databases that need stable per-Pod storage and a fixed ordinal identity per replica"
      - "Stateless applications where any replica is interchangeable"
      - "Per-node monitoring agents that must run one copy on every node in the cluster"
      - "One-shot batch jobs that run to completion and are then cleaned up automatically"
    answer: 1
    explanation: |
      Deployments are for stateless apps where replicas are fungible. They provide declarative
      rolling updates and rollback via ReplicaSets. Stateful apps want StatefulSets; per-node agents
      want DaemonSets; batch tasks want Jobs.
    ref: "concepts.md#deployment"

  - id: pods-workload-controllers-014
    difficulty: intermediate
    tags: [deployment, replicaset, hierarchy]
    question: |
      What is the ownership hierarchy created by a Deployment?
    options:
      - "Deployment → Pods directly, with the Deployment stamping its ownerReference on each Pod"
      - "Deployment → ReplicaSet (one per revision) → Pods"
      - "Deployment → StatefulSet → Pods, so each replica gets a stable ordinal name and disk"
      - "Deployment → Node → Pods, binding each replica to a node before the Pods are created"
    answer: 1
    explanation: |
      A Deployment owns one ReplicaSet per template revision, and each ReplicaSet owns its Pods. On
      an update, the Deployment creates a new ReplicaSet and scales it up while scaling the old one
      down, keeping old ReplicaSets for rollback.
    ref: "concepts.md#deployment"

  - id: pods-workload-controllers-015
    difficulty: intermediate
    tags: [deployment, rollout, kubectl, scenario]
    question: |
      After `kubectl set image deployment/web app=nginx:1.28`, you run `kubectl get rs -l app=web`
      and see two ReplicaSets. Why?
    options:
      - "The cluster's control plane is corrupted and has duplicated the ReplicaSet object by mistake"
      - "Each replica always gets its own dedicated ReplicaSet, so the count simply reflects two Pods"
      - "One ReplicaSet manages Pods that pass the readiness probe and the other manages liveness probes"
      - "The Deployment created a new ReplicaSet for the new revision and is scaling down the old one during the rolling update"
    answer: 3
    explanation: |
      Changing the Pod template triggers a new revision. The Deployment spins up a new ReplicaSet and
      gradually shifts replicas to it while draining the old one, so you transiently (and, thanks to
      revision history, afterward) see both.
    ref: "concepts.md#deployment"

  - id: pods-workload-controllers-016
    difficulty: intermediate
    tags: [deployment, rollback, kubectl]
    question: |
      Which command rolls a Deployment back to its previous revision?
    options:
      - "kubectl rollback deployment/web"
      - "kubectl delete deployment/web --previous"
      - "kubectl scale deployment/web --revision=previous"
      - "kubectl rollout undo deployment/web"
    answer: 3
    explanation: |
      `kubectl rollout undo deployment/web` reverts to the prior ReplicaSet revision. Deployments
      keep old ReplicaSets (bounded by revisionHistoryLimit) precisely so rollback is fast and
      declarative.
    ref: "concepts.md#deployment"

  - id: pods-workload-controllers-017
    difficulty: beginner
    tags: [statefulset]
    question: |
      Which guarantee does a StatefulSet provide that a Deployment does not?
    options:
      - "Stable, sticky Pod identity (name/ordinal) and stable per-Pod persistent storage"
      - "Faster Pod startup, because StatefulSet Pods skip the scheduler and image-pull steps"
      - "Automatic horizontal autoscaling that adds and removes replicas as load on the set changes"
      - "Running exactly one Pod per node and tracking the node set as machines join or leave"
    answer: 0
    explanation: |
      StatefulSet Pods are not interchangeable: each has a stable ordinal name (web-0, web-1, ...) it
      keeps across rescheduling, and its own PVC from volumeClaimTemplates that follows that ordinal.
      Deployments treat replicas as fungible with no such identity.
    ref: "concepts.md#statefulset"

  - id: pods-workload-controllers-018
    difficulty: intermediate
    tags: [statefulset, headless-service, dns]
    question: |
      A StatefulSet named `web` in namespace `default` uses serviceName `nginx`. What is the stable
      DNS name of its first Pod?
    options:
      - "web-0.nginx.default.svc.cluster.local"
      - "web.default.svc.cluster.local"
      - "nginx-0.web.default.svc.cluster.local"
      - "web.nginx.pod.cluster.local"
    answer: 0
    explanation: |
      With a governing headless Service, each Pod gets the DNS record
      <pod>.<service>.<namespace>.svc.cluster.local. The first Pod is web-0, so it resolves at
      web-0.nginx.default.svc.cluster.local.
    ref: "concepts.md#statefulset"

  - id: pods-workload-controllers-019
    difficulty: intermediate
    tags: [statefulset, headless-service, gotcha]
    question: |
      What must you create yourself for a StatefulSet to give its Pods stable network identities?
    options:
      - "A LoadBalancer Service that gives each replica its own stable external IP"
      - "An Ingress resource mapping a hostname to each ordinal Pod in turn"
      - "A headless Service (clusterIP: None) referenced by serviceName"
      - "Nothing — the StatefulSet creates it automatically"
    answer: 2
    explanation: |
      A StatefulSet requires a headless Service (clusterIP: None) that you must create; it is not
      created for you. That Service is responsible for the per-Pod DNS records. Forgetting it is a
      classic cause of Pods lacking resolvable identities.
    ref: "concepts.md#statefulset"

  - id: pods-workload-controllers-020
    difficulty: advanced
    tags: [statefulset, pvc, gotcha]
    question: |
      By default, what happens to a StatefulSet's PersistentVolumeClaims when you scale it down or
      delete the StatefulSet?
    options:
      - "The PVCs and their underlying cloud disks are deleted immediately to reclaim storage"
      - "The PVCs are automatically converted into ephemeral emptyDir volumes on the node"
      - "The PVCs are retained by default; data is preserved (data safety over auto-cleanup)"
      - "The PVCs are reassigned to a replacement StatefulSet created by the controller"
    answer: 2
    explanation: |
      By default StatefulSet PVCs are NOT deleted on scale-down or delete — Kubernetes prioritizes
      data safety. This can leave orphaned PVCs (and cloud disks costing money). You can change this
      with persistentVolumeClaimRetentionPolicy.
    ref: "concepts.md#statefulset"

  - id: pods-workload-controllers-021
    difficulty: advanced
    tags: [statefulset, pod-management-policy, ordering]
    question: |
      With the default `podManagementPolicy: OrderedReady`, how does a StatefulSet create and scale
      down its Pods?
    options:
      - "Pods are created in ascending ordinal order (each Ready before the next); scale-down and updates proceed in reverse ordinal order"
      - "All Pods are created and deleted in parallel, with ordinals assigned only once every Pod is Ready"
      - "Pods are created in a random order determined by a hash of each Pod's ordinal and node"
      - "Pods are created newest-first, from the highest ordinal down to zero, one at a time"
    answer: 0
    explanation: |
      OrderedReady creates Pods 0,1,2... one at a time, each must be Running and Ready before the
      next. Scale-down and rolling updates go in reverse ordinal order. Parallel policy launches or
      terminates them all at once while keeping identity/storage stable.
    ref: "concepts.md#statefulset"

  - id: pods-workload-controllers-022
    difficulty: intermediate
    tags: [statefulset, use-cases]
    question: |
      Which workload is the best fit for a StatefulSet?
    options:
      - "A clustered database like Cassandra or a broker like Kafka that needs stable identity and per-node storage"
      - "A stateless REST API behind a load balancer where every replica is fully interchangeable"
      - "A per-node log shipper that must place one collector agent on every node in the cluster"
      - "A nightly report-generation batch job that runs to completion once and is then removed"
    answer: 0
    explanation: |
      StatefulSets suit quorum/clustered stateful systems (Kafka, ZooKeeper, etcd, Cassandra,
      Postgres) where each replica has an identity and its own durable disk. Stateless APIs use
      Deployments; per-node agents use DaemonSets; batch jobs use Jobs.
    ref: "concepts.md#statefulset"

  - id: pods-workload-controllers-023
    difficulty: beginner
    tags: [daemonset]
    question: |
      What does a DaemonSet ensure?
    options:
      - "That exactly one copy of a Pod runs on every (matching) node"
      - "That a Pod runs its task through to completion and then stops permanently once done"
      - "That N replicas run across the cluster regardless of node count"
      - "That Pods run only on control-plane nodes, and are repelled from all worker nodes by taints"
    answer: 0
    explanation: |
      A DaemonSet runs one Pod per node (optionally filtered by nodeSelector/affinity). As nodes
      join, it adds the Pod; as nodes leave, those Pods are cleaned up. It is ideal for per-node
      agents like log collectors and metrics exporters.
    ref: "concepts.md#daemonset"

  - id: pods-workload-controllers-024
    difficulty: intermediate
    tags: [daemonset, replicas]
    question: |
      How do you set the number of replicas on a DaemonSet?
    options:
      - "With the .spec.replicas field, which the DaemonSet controller clamps to the node count"
      - "Via a HorizontalPodAutoscaler that scales the DaemonSet as per-node load rises and falls"
      - "You don't — the count is the number of matching nodes, managed by the controller"
      - "With the .spec.parallelism field, mirroring how a Job caps its concurrent Pods"
    answer: 2
    explanation: |
      DaemonSets have no replicas field. The effective count equals the number of nodes matching the
      Pod's placement rules, and the controller keeps it in sync as the node set changes. Using a
      Deployment with replicas = node count would not track nodes or guarantee one-per-node.
    ref: "concepts.md#daemonset"

  - id: pods-workload-controllers-025
    difficulty: advanced
    tags: [daemonset, tolerations, scheduling]
    question: |
      Why do DaemonSet Pods for node agents often include broad tolerations?
    options:
      - "To increase their CPU scheduling priority so the kubelet starts them ahead of app Pods"
      - "To disable their readiness probes so they are always counted as available on the node"
      - "So they can also be scheduled onto tainted nodes (e.g., control-plane or specially-tainted nodes)"
      - "To force every one of them onto a single dedicated node chosen by the controller"
    answer: 2
    explanation: |
      Nodes may carry taints (control-plane, dedicated hardware, etc.) that repel ordinary Pods.
      Node-level agents usually need to run everywhere, so their DaemonSet Pods add tolerations
      (often operator: Exists) to land on tainted nodes too.
    ref: "concepts.md#daemonset"

  - id: pods-workload-controllers-026
    difficulty: intermediate
    tags: [daemonset, scenario]
    question: |
      You need a metrics agent running on every node, including nodes that join later. Which is
      correct?
    options:
      - "A Deployment with replicas equal to the current node count"
      - "A StatefulSet with one Pod per ordinal"
      - "A DaemonSet"
      - "A CronJob that runs every minute"
    answer: 2
    explanation: |
      A DaemonSet auto-schedules one Pod per node and follows the node set as nodes join or leave.
      A Deployment with a fixed replica count neither guarantees one-per-node nor tracks new nodes.
    ref: "concepts.md#daemonset"

  - id: pods-workload-controllers-027
    difficulty: beginner
    tags: [job, batch]
    question: |
      What is the purpose of a Job?
    options:
      - "To keep a long-running service alive forever, restarting its Pods on any exit or crash"
      - "To run exactly one Pod per node and track the node set as machines join or leave"
      - "To load-balance inbound HTTP traffic evenly across a set of backing Pods"
      - "To run a Pod (or Pods) to completion for a batch/one-shot task"
    answer: 3
    explanation: |
      A Job runs work to completion — a migration, backup, or computation — tracking successful Pod
      completions and retrying failures per policy. Long-running services use Deployments/StatefulSets
      instead.
    ref: "concepts.md#job"

  - id: pods-workload-controllers-028
    difficulty: intermediate
    tags: [job, backofflimit]
    question: |
      What does a Job's `backoffLimit` control?
    options:
      - "The number of Pod retries (with exponential back-off) before the Job is marked Failed"
      - "The maximum wall-clock time the Job may run before its Pods are terminated as expired"
      - "How many Pods the Job is allowed to run in parallel at any one moment"
      - "How long to keep the finished Job object around before it is garbage-collected"
    answer: 0
    explanation: |
      backoffLimit is the retry budget: failed Pods are recreated with exponential back-off up to
      this count, after which the Job is marked Failed (default 6). Wall-clock cap is
      activeDeadlineSeconds; concurrency is parallelism; retention is ttlSecondsAfterFinished.
    ref: "concepts.md#job"

  - id: pods-workload-controllers-029
    difficulty: advanced
    tags: [job, activedeadlineseconds]
    question: |
      A Job has `backoffLimit: 10` and `activeDeadlineSeconds: 60`. The Pods keep failing and 60
      seconds elapse with retries still remaining. What happens?
    options:
      - "The Job keeps retrying until the full backoffLimit of 10 attempts is exhausted"
      - "The Job is marked Succeeded because reaching the deadline resets the failure counter"
      - "All running Pods are terminated and the Job is marked Failed — activeDeadlineSeconds takes precedence"
      - "The Job is suspended and waits for an operator to manually approve further retries"
    answer: 2
    explanation: |
      activeDeadlineSeconds is a hard wall-clock limit measured from the Job's start; when it
      expires, all Pods are terminated and the Job fails — this takes precedence over any remaining
      backoffLimit retries.
    ref: "concepts.md#job"

  - id: pods-workload-controllers-030
    difficulty: advanced
    tags: [job, completion-mode, indexed]
    question: |
      What distinguishes a Job with `completionMode: Indexed` from the default NonIndexed mode?
    options:
      - "Each Pod gets a fixed completion index (0..completions-1), exposed via JOB_COMPLETION_INDEX, and the Job is done when each index succeeds once"
      - "Indexed Jobs cannot run their Pods in parallel and are forced to complete strictly one at a time"
      - "Indexed Jobs ignore backoffLimit entirely and instead retry every failed index without any cap"
      - "Indexed Jobs must set restartPolicy: Always so each indexed Pod restarts in place on failure"
    answer: 0
    explanation: |
      In Indexed mode each Pod is assigned a unique completion index (via env var, annotation, label,
      hostname suffix), and the Job completes when there is one successful Pod per index — ideal for
      static work partitioning. NonIndexed treats completions as interchangeable.
    ref: "concepts.md#job"

  - id: pods-workload-controllers-031
    difficulty: intermediate
    tags: [job, ttl, cleanup]
    question: |
      What does `ttlSecondsAfterFinished` do on a Job?
    options:
      - "Delays the Job's start by that many seconds after it is submitted to the API"
      - "Sets how long each individual Pod may run before the kubelet kills it as expired"
      - "Automatically deletes the finished Job (and its Pods) that many seconds after it completes or fails"
      - "Retries the whole Job once more that many seconds after it first finishes"
    answer: 2
    explanation: |
      ttlSecondsAfterFinished lets the TTL controller garbage-collect a Job once it reaches a
      terminal state, deleting it and its dependent Pods after the delay (0 = immediately). It keeps
      finished Jobs from accumulating.
    ref: "concepts.md#job"

  - id: pods-workload-controllers-032
    difficulty: beginner
    tags: [cronjob, schedule]
    question: |
      What does a CronJob do?
    options:
      - "Creates Jobs on a repeating cron schedule"
      - "Runs one Pod per node continuously"
      - "Provides stable storage to Pods"
      - "Load-balances traffic across Pods on a timer"
    answer: 0
    explanation: |
      A CronJob is a Kubernetes-native crontab: on each scheduled time it creates a Job (which
      creates Pods). Used for periodic backups, reports, and cleanup.
    ref: "concepts.md#cronjob"

  - id: pods-workload-controllers-033
    difficulty: intermediate
    tags: [cronjob, concurrency, scenario]
    question: |
      Two runs of a CronJob overlapped and corrupted shared state because the previous run had not
      finished. Which setting prevents overlapping runs?
    options:
      - "concurrencyPolicy: Allow"
      - "startingDeadlineSeconds: 0"
      - "successfulJobsHistoryLimit: 1"
      - "concurrencyPolicy: Forbid"
    answer: 3
    explanation: |
      concurrencyPolicy: Forbid skips a new run while the previous Job is still running (Replace
      would kill the running one and start fresh). Allow (the default) permits overlap, which caused
      the corruption.
    ref: "concepts.md#cronjob"

  - id: pods-workload-controllers-034
    difficulty: advanced
    tags: [cronjob, starting-deadline]
    question: |
      What does `startingDeadlineSeconds` control on a CronJob?
    options:
      - "How late a scheduled run may still start (e.g., after controller downtime) before it counts as a missed run"
      - "How long each Job spawned by the CronJob may run before the kubelet kills its Pods as expired"
      - "How many past completed and failed Jobs the CronJob keeps in history before pruning old ones"
      - "The fixed interval between scheduled runs, overriding whatever the cron schedule expression says"
    answer: 0
    explanation: |
      If a scheduled time is missed (say the controller was down), startingDeadlineSeconds bounds how
      late that run may still begin; missed runs beyond the window are skipped. It is not a run-time
      limit (that's the Job's activeDeadlineSeconds).
    ref: "concepts.md#cronjob"

  - id: pods-workload-controllers-035
    difficulty: intermediate
    tags: [cronjob, hierarchy]
    question: |
      What is the ownership chain when a CronJob fires?
    options:
      - "CronJob → Pods directly"
      - "CronJob → Job → Pods"
      - "CronJob → ReplicaSet → Pods"
      - "CronJob → DaemonSet → Pods"
    answer: 1
    explanation: |
      A CronJob creates a Job at each scheduled time, and that Job creates the Pods. Fields like
      backoffLimit and restartPolicy live on the Job template, not the CronJob.
    ref: "concepts.md#cronjob"

  - id: pods-workload-controllers-036
    difficulty: beginner
    tags: [choosing-controller]
    question: |
      For a stateless HTTP API where any replica is interchangeable and you want rolling updates,
      which controller should you use?
    options:
      - "StatefulSet"
      - "Deployment"
      - "DaemonSet"
      - "Job"
    answer: 1
    explanation: |
      A Deployment is the standard choice for stateless, fungible replicas and gives you rolling
      updates and rollback via ReplicaSets. StatefulSet is for identity/storage; DaemonSet is
      per-node; Job is run-to-completion.
    ref: "concepts.md#choosing-the-right-controller"

  - id: pods-workload-controllers-037
    difficulty: intermediate
    tags: [choosing-controller, scenario]
    question: |
      You must run a nightly database backup task that finishes and should not overlap with itself.
      Which combination fits best?
    options:
      - "A Deployment with a sleep loop that runs the backup script on a timer"
      - "A CronJob whose Job template runs the backup, with concurrencyPolicy: Forbid"
      - "A DaemonSet on the database nodes running a backup Pod on each one"
      - "A StatefulSet with one replica that reruns the backup on each restart"
    answer: 1
    explanation: |
      A scheduled, run-to-completion task is a CronJob (which creates Jobs). concurrencyPolicy:
      Forbid prevents a new backup from starting while the previous one is still running. Deployments
      and StatefulSets are for long-running services.
    ref: "concepts.md#choosing-the-right-controller"

  - id: pods-workload-controllers-038
    difficulty: beginner
    tags: [pod-phase, lifecycle]
    question: |
      A Pod is waiting to be scheduled and pulling its image. Which phase is it in?
    options:
      - "Running"
      - "Pending"
      - "Succeeded"
      - "Unknown"
    answer: 1
    explanation: |
      Pending means the Pod is accepted but not all containers are running yet — this includes time
      spent waiting to be scheduled and time downloading images. Once bound and started it moves to
      Running.
    ref: "concepts.md#pod-phases-and-conditions"

  - id: pods-workload-controllers-039
    difficulty: intermediate
    tags: [pod-phase, status, gotcha]
    question: |
      A `kubectl get pods` STATUS column shows `CrashLoopBackOff`. Which statement is correct?
    options:
      - "CrashLoopBackOff is one of the five Pod phases, alongside Pending, Running, Succeeded, and Failed in status.phase"
      - "The Pod phase is Succeeded, since the STATUS column always mirrors status.phase verbatim on every line"
      - "CrashLoopBackOff is a display-level reason, not a Pod phase; the five phases are Pending/Running/Succeeded/Failed/Unknown"
      - "CrashLoopBackOff means the node has gone Unknown and the kubelet stopped reporting the Pod's status"
    answer: 2
    explanation: |
      status.phase has exactly five values: Pending, Running, Succeeded, Failed, Unknown. Strings
      like CrashLoopBackOff, ImagePullBackOff, ContainerCreating, and Completed are display-level
      reasons in the STATUS column, not phases.
    ref: "concepts.md#pod-phases-and-conditions"

  - id: pods-workload-controllers-040
    difficulty: intermediate
    tags: [pod-conditions, readiness, scenario]
    question: |
      A Pod shows phase Running but `0/1 READY`. What is the most likely explanation?
    options:
      - "The Pod has crashed and will not restart because its restartPolicy was set to Never at creation"
      - "The node hosting the Pod is unreachable, so its containers were all marked not ready"
      - "The container image failed to pull, leaving it stuck in Waiting with an ImagePullBackOff reason"
      - "Its readiness probe has not passed, so the Ready condition is False and it is excluded from Service endpoints"
    answer: 3
    explanation: |
      Running is the phase; readiness is a separate condition. If the readiness probe hasn't
      succeeded, the Ready condition is False and the Pod is kept out of matching Services' endpoints
      even though its container is running.
    ref: "concepts.md#pod-phases-and-conditions"

  - id: pods-workload-controllers-041
    difficulty: advanced
    tags: [pod-conditions, endpoints]
    question: |
      Which Pod condition determines whether a Pod is added to the endpoints of matching Services?
    options:
      - "PodScheduled"
      - "Ready"
      - "Initialized"
      - "PodReadyToStartContainers"
    answer: 1
    explanation: |
      The Ready condition indicates the Pod can serve requests; Services/Endpoints route only to Pods
      whose Ready condition is True. Readiness gates (spec.readinessGates) can also feed into Ready.
    ref: "concepts.md#pod-phases-and-conditions"

  - id: pods-workload-controllers-042
    difficulty: intermediate
    tags: [container-state, lifecycle]
    question: |
      In `kubectl describe pod`, a container shows state `Waiting` with a Reason. What does Waiting
      mean?
    options:
      - "The container has finished executing and exited cleanly, so it no longer appears in the running set"
      - "The container is not yet Running or Terminated — it is still doing startup work like pulling the image or applying secrets"
      - "The container has been deliberately paused by an administrator via a kubectl command that suspends it"
      - "The container has just passed its liveness probe and is being held briefly before it receives traffic"
    answer: 1
    explanation: |
      Waiting means the container is neither Running nor Terminated; it is performing operations
      required to start (pulling the image, mounting/decoding secrets, etc.). The Reason field
      explains why (e.g., ImagePullBackOff).
    ref: "concepts.md#pod-phases-and-conditions"

  - id: pods-workload-controllers-043
    difficulty: beginner
    tags: [restartpolicy, default]
    question: |
      What is the default value of a Pod's `restartPolicy`?
    options:
      - "Never"
      - "OnFailure"
      - "Always"
      - "IfHealthy"
    answer: 2
    explanation: |
      The default restartPolicy is Always: the kubelet restarts the container after any termination.
      Deployments/ReplicaSets/StatefulSets/DaemonSets must use Always; Jobs must use Never or
      OnFailure.
    ref: "concepts.md#restartpolicy"

  - id: pods-workload-controllers-044
    difficulty: intermediate
    tags: [restartpolicy, job, scenario]
    question: |
      You write a Job with `restartPolicy: Always`. What happens?
    options:
      - "It runs normally, retrying the failed Pod forever"
      - "It is silently converted into an equivalent Deployment object"
      - "The API rejects it — a Job's restartPolicy must be Never or OnFailure"
      - "It runs but quietly ignores the backoffLimit you configured"
    answer: 2
    explanation: |
      Always is invalid for a Job; the allowed values are Never (a failed Pod is replaced by a new
      one) or OnFailure (the container restarts in place). Retries are bounded by backoffLimit, not
      by an Always restart loop.
    ref: "concepts.md#restartpolicy"

  - id: pods-workload-controllers-045
    difficulty: advanced
    tags: [restartpolicy, crashloopbackoff, internals]
    question: |
      A Deployment's Pod keeps crashing and shows `CrashLoopBackOff`. Which statement is accurate?
    options:
      - "The kubelet restarts the same container in place with exponential back-off (honoring restartPolicy: Always); the back-off caps around 5 minutes"
      - "The Deployment controller notices the crash and creates a brand-new Pod each time, discarding the old one"
      - "restartPolicy has no effect here; only the scheduler acts, rebinding the crashed Pod to a fresh node each time"
      - "The Pod is rescheduled to a different node on each crash by the control plane to escape the failing host"
    answer: 0
    explanation: |
      restartPolicy is a container-level, in-place restart by the kubelet. A crashing Deployment Pod
      is restarted in place with growing back-off (capped ~5 min), surfacing as CrashLoopBackOff. The
      Deployment does not make a new Pod for a crash, and restartPolicy does not trigger cross-node
      rescheduling.
    ref: "concepts.md#restartpolicy"

  - id: pods-workload-controllers-046
    difficulty: intermediate
    tags: [multi-container, sidecar-pattern]
    question: |
      In the sidecar pattern, what is the sidecar container's role?
    options:
      - "It replaces the main application container once that container has finished its initial startup work"
      - "It runs on a different node than the app and communicates with it over the cluster network"
      - "It is a long-running helper that augments the main container (e.g., log shipping, a proxy, metrics export) within the same Pod"
      - "It only runs before the app container starts, completes a one-time setup task, and then exits for good"
    answer: 2
    explanation: |
      A sidecar is a co-located, long-running helper that shares the Pod's network and volumes with
      the main container — log shippers, service-mesh proxies, metrics exporters, config reloaders.
      It runs for the life of the Pod alongside the app.
    ref: "concepts.md#multi-container-pod-patterns"

  - id: pods-workload-controllers-047
    difficulty: advanced
    tags: [multi-container, ambassador, adapter]
    question: |
      Which best describes the difference between the ambassador and adapter multi-container patterns?
    options:
      - "Ambassador runs as an init container before the app starts, whereas the adapter is a hook that runs only after the app exits"
      - "They are simply two interchangeable names for the exact same sidecar pattern, with no behavioral difference at all"
      - "Ambassador persists the app's data to a shared volume, while the adapter exclusively serves inbound HTTP requests for it"
      - "Ambassador proxies the app's outbound connections to the outside world via localhost; adapter transforms the app's output/interface into a standardized external format"
    answer: 3
    explanation: |
      An ambassador is an outbound proxy: the app talks to localhost and the ambassador handles
      discovery/sharding/TLS to remote services. An adapter reshapes the app's output/interface into
      a standard form (e.g., exposing app stats in Prometheus format) for external consumers.
    ref: "concepts.md#multi-container-pod-patterns"

  - id: pods-workload-controllers-048
    difficulty: intermediate
    tags: [init-container, ordering]
    question: |
      How do init containers behave relative to the app containers in a Pod?
    options:
      - "They run in parallel with the app containers, sharing the Pod's startup window so everything comes up at once"
      - "They run before the app containers, sequentially, and each must complete successfully before the next (and before any app container) starts"
      - "They run only when an app container fails its liveness probe, acting as an automatic recovery step for it"
      - "They restart continuously alongside the app containers throughout the entire lifetime of the running Pod"
    answer: 1
    explanation: |
      Init containers run to completion, one after another, before any app container starts. Each
      must succeed before the next begins. They are ideal for setup tasks like waiting on a
      dependency or running a migration.
    ref: "concepts.md#init-containers-vs-sidecar-containers"

  - id: pods-workload-controllers-049
    difficulty: advanced
    tags: [native-sidecar, restartpolicy, version]
    question: |
      How do you declare a native sidecar container, and since which Kubernetes version has the
      feature been enabled by default?
    options:
      - "Add it to containers[] and mark it with a special app.kubernetes.io/sidecar label; available since v1.20"
      - "Set the sidecar: true boolean field directly in the Pod spec's container entry; available since v1.25"
      - "Use a separate Sidecar resource kind that references the target Pod by selector; available since v1.31"
      - "Add it to initContainers[] with restartPolicy: Always; enabled by default (beta) since v1.29 and stable in v1.33"
    answer: 3
    explanation: |
      A native sidecar is an init container with restartPolicy: Always — it starts before the app and
      keeps running. The SidecarContainers feature gate has been on by default (beta) since v1.29 and
      reached stable in v1.33.
    ref: "concepts.md#init-containers-vs-sidecar-containers"

  - id: pods-workload-controllers-050
    difficulty: advanced
    tags: [native-sidecar, job, scenario]
    question: |
      A Job's Pod includes a log-shipping helper. As a plain extra container in containers[], the Job
      never completes because the helper runs forever. How does a native sidecar fix this?
    options:
      - "It reconfigures the log-shipping helper so it exits immediately once the Job's main container begins running, freeing the Pod to complete"
      - "Declared as an init container with restartPolicy: Always, the sidecar does not block Job completion — the Job completes when the main container finishes, and the sidecar is then terminated"
      - "It forces the Job's backoffLimit down to 0 so the never-ending helper container is never retried and the overall Job can finish"
      - "It relocates the helper onto a separate worker node from the main container so its endless runtime no longer blocks the Job's Pod"
    answer: 1
    explanation: |
      This is exactly why native sidecars were introduced. A never-ending plain sidecar keeps a Job's
      Pod from completing. As a native sidecar (init container with restartPolicy: Always), it is not
      counted against completion: the Job finishes when the main container exits, and the kubelet
      shuts sidecars down afterward in reverse order.
    ref: "concepts.md#init-containers-vs-sidecar-containers"

  - id: pods-workload-controllers-051
    difficulty: advanced
    tags: [native-sidecar, probes, shutdown]
    question: |
      Which is true of native sidecar containers but NOT of regular init containers?
    options:
      - "They run before the app containers, whereas ordinary init containers start only after the app is already up"
      - "They can use a different image than the app, which regular init containers cannot do since they must reuse it"
      - "They run sequentially one after another, while regular init containers are instead launched all in parallel"
      - "They support startup/readiness/liveness probes and are terminated after the app containers (in reverse order) on Pod shutdown"
    answer: 3
    explanation: |
      Regular init containers don't support probes and exit before app containers start. Native
      sidecars support all three probe types, run for the whole Pod life, and on termination are shut
      down after the main containers, in reverse order of appearance.
    ref: "concepts.md#init-containers-vs-sidecar-containers"

  - id: pods-workload-controllers-052
    difficulty: intermediate
    tags: [pod, sharing, follow-up]
    question: |
      By default, which of the following is NOT shared among containers in the same Pod?
    options:
      - "The root filesystem (each container has its own from its image)"
      - "The network namespace (a single shared IP and port space)"
      - "Declared volumes (available to any container that mounts them)"
      - "The Pod's scheduling lifecycle (all containers share one node)"
    answer: 0
    explanation: |
      Containers in a Pod share the network namespace, IPC, declared volumes, and are co-scheduled.
      They do NOT share a root filesystem — each has its own from its image — and by default they do
      not share a PID namespace (unless shareProcessNamespace is enabled).
    ref: "concepts.md#what-is-a-pod"
