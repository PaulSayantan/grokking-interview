topic: "Scheduling, Affinity & Multi-tenancy"
domain: kubernetes
topic_slug: scheduling-affinity-namespaces
version: 1
questions:
- id: scheduling-affinity-namespaces-001
  difficulty: beginner
  tags: [scheduler, filter, score, bind]
  question: |
    In one sentence, what are the three phases the kube-scheduler runs to place a Pod?
  options:
  - "Filter (predicates), score (priorities), then bind"
  - "Build, ship, run"
  - "Cordon, drain, uncordon"
  - "Request, limit, evict"
  answer: 0
  explanation: |
    The scheduler first filters out nodes on which the Pod cannot run (predicates), scores the
    remaining feasible nodes (priorities), and then binds the Pod to the highest-scoring node by
    setting .spec.nodeName via the API server.
  ref: "concepts.md#what-the-scheduler-does"

- id: scheduling-affinity-namespaces-002
  difficulty: beginner
  tags: [scheduler, kubelet, binding]
  question: |
    After the scheduler picks a node, what actually starts the containers on that node?
  options:
  - "The scheduler itself SSHes into the node and runs them"
  - "etcd writes them directly to the container runtime"
  - "The kubelet on that node, via the CRI"
  - "The kube-proxy on that node"
  answer: 2
  explanation: |
    Scheduling only writes a binding (sets nodeName). The kubelet on the chosen node then sees the
    bound Pod and calls the container runtime through the CRI to pull images and start containers.
    "Scheduled" is not the same as "running".
  ref: "concepts.md#what-the-scheduler-does"

- id: scheduling-affinity-namespaces-003
  difficulty: intermediate
  tags: [scheduler, pending]
  question: |
    A Pod requests 32Gi of memory, but the largest node in the cluster has 16Gi allocatable. What
    state does the Pod end up in?
  options:
  - "Running, but throttled"
  - "CrashLoopBackOff"
  - "Pending indefinitely, with a FailedScheduling event"
  - "Evicted immediately"
  answer: 2
  explanation: |
    Filtering finds no feasible node (no single node can satisfy the memory request), so the Pod
    stays Pending. kubectl describe pod shows a FailedScheduling event like "Insufficient memory".
    Requests, not usage, drive this check.
  ref: "concepts.md#what-the-scheduler-does"

- id: scheduling-affinity-namespaces-004
  difficulty: advanced
  tags: [scheduling-framework, preemption, extension-points]
  question: |
    In the Scheduling Framework, which extension point runs only when the Filter phase found no
    feasible node, and is where preemption logic lives?
  options:
  - "PreFilter"
  - "PreScore"
  - "PostFilter"
  - "PostBind"
  answer: 2
  explanation: |
    PostFilter runs only if a Pod could not be scheduled after filtering. The default preemption
    plugin implements PostFilter: it tries to evict lower-priority Pods to make room for the pending
    Pod.
  ref: "concepts.md#what-the-scheduler-does"

- id: scheduling-affinity-namespaces-005
  difficulty: intermediate
  tags: [scheduler, scoring, ties]
  question: |
    If two feasible nodes end up with exactly the same total score, how does the scheduler choose?
  options:
  - "It picks the node with the lowest name alphabetically"
  - "It leaves the Pod Pending until scores differ"
  - "It selects one of the tied nodes at random"
  - "It always picks the node with the most free memory"
  answer: 2
  explanation: |
    When multiple nodes have equal top scores, kube-scheduler selects one of them at random. Scoring
    ranks feasible nodes; ties are broken randomly.
  ref: "concepts.md#what-the-scheduler-does"

- id: scheduling-affinity-namespaces-006
  difficulty: beginner
  tags: [nodeselector, labels]
  question: |
    How does nodeSelector decide which nodes are eligible for a Pod?
  options:
  - "The node must contain ALL of the specified key/value labels (exact match)"
  - "The node must contain at least ONE of the specified labels"
  - "It matches nodes by regular expression on the node name"
  - "It matches nodes that do NOT have the labels"
  answer: 0
  explanation: |
    nodeSelector is a simple map; a node is feasible only if its labels include every listed
    key/value pair (logical AND, exact equality). It cannot express soft preferences, ranges, or
    negation.
  ref: "concepts.md#nodeselector-and-node-labels"

- id: scheduling-affinity-namespaces-007
  difficulty: intermediate
  tags: [nodeselector, node-affinity, combined]
  question: |
    A Pod specifies both a nodeSelector and a nodeAffinity required rule. What must be true for a
    node to be feasible?
  options:
  - "Only the nodeSelector must match"
  - "Only the nodeAffinity must match"
  - "Either one matching is enough"
  - "Both the nodeSelector AND the nodeAffinity must be satisfied"
  answer: 3
  explanation: |
    When both are present, they are ANDed: the node must satisfy the nodeSelector and the required
    node affinity. They are not alternatives.
  ref: "concepts.md#nodeselector-and-node-labels"

- id: scheduling-affinity-namespaces-008
  difficulty: advanced
  tags: [nodeselector, node-restriction, security]
  question: |
    For isolation you want node labels that a compromised kubelet cannot set on its own node. Which
    label prefix is enforced by the NodeRestriction admission plugin for this purpose?
  options:
  - "topology.kubernetes.io/"
  - "kubernetes.io/hostname/"
  - "node-role.kubernetes.io/"
  - "node-restriction.kubernetes.io/"
  answer: 3
  explanation: |
    The NodeRestriction admission plugin prevents a kubelet from modifying labels under the
    node-restriction.kubernetes.io/ prefix on its own Node object, so those labels are trustworthy
    for isolation decisions.
  ref: "concepts.md#nodeselector-and-node-labels"

- id: scheduling-affinity-namespaces-009
  difficulty: intermediate
  tags: [node-affinity, required, preferred]
  question: |
    What is the difference between requiredDuringSchedulingIgnoredDuringExecution and
    preferredDuringSchedulingIgnoredDuringExecution node affinity?
  options:
  - "Required is a hard rule (won't schedule if unmet); preferred is a soft, weighted preference"
  - "Preferred is the hard rule; required is only a hint"
  - "Both are hard rules but preferred re-evaluates during execution"
  - "Required applies to nodes, preferred applies to Pods"
  answer: 0
  explanation: |
    Required means the scheduler will not place the Pod on a non-matching node. Preferred adds a
    weight (1-100) to matching nodes' scores but the Pod is still scheduled somewhere even if nothing
    matches.
  ref: "concepts.md#node-affinity"

- id: scheduling-affinity-namespaces-010
  difficulty: advanced
  tags: [node-affinity, ignored-during-execution]
  question: |
    A Pod has required node affinity on label disktype=ssd. After it is scheduled, an admin changes
    that node's label to disktype=hdd. What happens to the running Pod?
  options:
  - "It keeps running; affinity is only evaluated at scheduling time (IgnoredDuringExecution)"
  - "It is immediately evicted for violating the affinity rule"
  - "It is restarted on a node that still has ssd"
  - "The kubelet marks it CrashLoopBackOff"
  answer: 0
  explanation: |
    The "IgnoredDuringExecution" part means affinity is checked only when scheduling. Label changes
    after placement do not evict the Pod; there is no RequiredDuringExecution variant yet.
  ref: "concepts.md#node-affinity"

- id: scheduling-affinity-namespaces-011
  difficulty: advanced
  tags: [node-affinity, operators]
  question: |
    Which pair of nodeAffinity operators effectively provide node ANTI-affinity (avoid nodes with a
    label)?
  options:
  - "In and Exists"
  - "Gt and Lt"
  - "NotIn and DoesNotExist"
  - "Equal and Exists"
  answer: 2
  explanation: |
    matchExpressions support In, NotIn, Exists, DoesNotExist, Gt, Lt. NotIn and DoesNotExist express
    negation, giving node anti-affinity (schedule where a label is absent or not in a set). Equal is
    a toleration operator, not an affinity operator.
  ref: "concepts.md#node-affinity"

- id: scheduling-affinity-namespaces-012
  difficulty: advanced
  tags: [node-affinity, terms, and-or]
  question: |
    Within required node affinity, how are multiple nodeSelectorTerms combined, and how are multiple
    matchExpressions within a single term combined?
  options:
  - "Terms are ANDed; expressions within a term are ORed"
  - "Both are ANDed"
  - "Terms are ORed; expressions within a term are ANDed"
  - "Both are ORed"
  answer: 2
  explanation: |
    Multiple nodeSelectorTerms are ORed (any one satisfied makes the node feasible), while multiple
    matchExpressions inside a single term are ANDed (all must match).
  ref: "concepts.md#node-affinity"

- id: scheduling-affinity-namespaces-013
  difficulty: beginner
  tags: [pod-affinity, anti-affinity]
  question: |
    What is the difference between podAffinity and podAntiAffinity?
  options:
  - "podAffinity co-locates a Pod near matching Pods; podAntiAffinity keeps it away from them"
  - "podAffinity targets node labels; podAntiAffinity targets Pod labels"
  - "podAffinity is a hard rule; podAntiAffinity is always soft"
  - "They both spread Pods, just across different regions"
  answer: 0
  explanation: |
    Inter-pod affinity places a Pod in the same topology domain as Pods matching a label selector
    (co-locate); anti-affinity repels it from domains running matching Pods (spread). Both work on
    Pod labels, not node labels.
  ref: "concepts.md#pod-affinity-and-anti-affinity"

- id: scheduling-affinity-namespaces-014
  difficulty: intermediate
  tags: [pod-affinity, topologykey]
  question: |
    In a podAntiAffinity rule, what does topologyKey define?
  options:
  - "The container port to spread traffic across"
  - "The Pod's priority class"
  - "The namespace the rule is scoped to"
  - "The node label whose value groups nodes into the domain the rule applies to"
  answer: 3
  explanation: |
    topologyKey is a node label key (e.g. kubernetes.io/hostname or topology.kubernetes.io/zone).
    Nodes sharing the same value form one domain; the (anti-)affinity is evaluated within each such
    domain.
  ref: "concepts.md#pod-affinity-and-anti-affinity"

- id: scheduling-affinity-namespaces-015
  difficulty: advanced
  tags: [pod-anti-affinity, pending, replicas]
  question: |
    A Deployment has 5 replicas with REQUIRED podAntiAffinity on topologyKey kubernetes.io/hostname
    (one replica per node). The cluster has 3 schedulable nodes. What happens?
  options:
  - "All 5 Pods schedule, doubling up on 2 nodes"
  - "The Deployment is rejected at creation"
  - "3 Pods run (one per node); the other 2 stay Pending"
  - "The scheduler ignores the anti-affinity and spreads evenly"
  answer: 2
  explanation: |
    Required host-level anti-affinity hard-caps at one matching Pod per node. With only 3 nodes, 3
    Pods schedule and the remaining 2 stay Pending until more nodes appear. This is a classic reason
    for stuck Pending replicas.
  ref: "concepts.md#pod-affinity-and-anti-affinity"

- id: scheduling-affinity-namespaces-016
  difficulty: advanced
  tags: [pod-affinity, performance, topology-spread]
  question: |
    Why does the documentation caution against heavy use of pod affinity/anti-affinity in large
    clusters, and what is the recommended lighter alternative for even spreading?
  options:
  - "It uses too much Pod memory; use limits instead"
  - "It only works in a single namespace; use ResourceQuota instead"
  - "It requires a custom scheduler; use nodeSelector instead"
  - "The scheduler must compare the Pod against all existing Pods across domains (slow); prefer topology spread constraints"
  answer: 3
  explanation: |
    Inter-pod affinity requires comparing the incoming Pod against all existing Pods across all
    topology domains, which significantly slows scheduling at scale. Topology spread constraints were
    designed to be cheaper and more declarative for even distribution.
  ref: "concepts.md#pod-affinity-and-anti-affinity"

- id: scheduling-affinity-namespaces-017
  difficulty: beginner
  tags: [taints, tolerations, concept]
  question: |
    What is the relationship between a taint and a toleration?
  options:
  - "A taint on a node repels Pods unless the Pod has a matching toleration"
  - "A toleration on a node repels Pods unless they are tainted"
  - "Both must be set on the Pod to enable scheduling"
  - "A taint forces a Pod onto a specific node"
  answer: 0
  explanation: |
    A taint marks a node to repel Pods; a matching toleration on a Pod allows (but does not force) it
    to be scheduled there. This is how dedicated node pools (GPU, control-plane) are built.
  ref: "concepts.md#taints-and-tolerations"

- id: scheduling-affinity-namespaces-018
  difficulty: intermediate
  tags: [taints, effects, noexecute]
  question: |
    Which taint effect can EVICT Pods that are already running on the node if they don't tolerate it?
  options:
  - "NoSchedule"
  - "PreferNoSchedule"
  - "NoExecute"
  - "NoAdmit"
  answer: 2
  explanation: |
    NoSchedule and PreferNoSchedule only affect new placements; existing Pods keep running.
    NoExecute additionally evicts running Pods that don't tolerate the taint (after tolerationSeconds
    if specified). NoAdmit is not a real effect.
  ref: "concepts.md#taints-and-tolerations"

- id: scheduling-affinity-namespaces-019
  difficulty: intermediate
  tags: [taints, toleration, attract]
  question: |
    You taint a GPU node with gpu=true:NoSchedule and add a matching toleration to your Pod. Does the
    toleration guarantee the Pod runs on the GPU node?
  options:
  - "Yes, the toleration pins it to the GPU node"
  - "Yes, but only if the node has no other Pods"
  - "No, tolerations disable scheduling entirely"
  - "No, a toleration only permits placement; you also need node affinity/nodeSelector to attract it"
  answer: 3
  explanation: |
    A toleration permits but does not attract. The Pod could still be scheduled on an ordinary node.
    To repel others AND pull your workload onto the GPU nodes, pair the taint with node affinity or
    nodeSelector.
  ref: "concepts.md#taints-and-tolerations"

- id: scheduling-affinity-namespaces-020
  difficulty: advanced
  tags: [taints, built-in, node-conditions]
  question: |
    When a node becomes NotReady, the node controller adds node.kubernetes.io/not-ready:NoExecute.
    Why don't all Pods get evicted the instant the node goes NotReady?
  options:
  - "NoExecute never evicts Pods, only reschedules them"
  - "The taint is actually NoSchedule, which never evicts"
  - "Kubernetes injects a default tolerationSeconds (300s) so Pods tolerate the taint briefly before eviction"
  - "Pods are only evicted if they lack a readiness probe"
  answer: 2
  explanation: |
    Kubernetes automatically adds a toleration for not-ready/unreachable with tolerationSeconds of
    300 by default, so Pods tolerate a transient NotReady node for ~5 minutes before NoExecute evicts
    them. This avoids mass eviction on brief blips.
  ref: "concepts.md#taints-and-tolerations"

- id: scheduling-affinity-namespaces-021
  difficulty: intermediate
  tags: [taints, control-plane]
  question: |
    Why don't ordinary application Pods normally run on control-plane nodes?
  options:
  - "Control-plane nodes have no kubelet"
  - "The scheduler is hard-coded to ignore control-plane nodes"
  - "They carry the taint node-role.kubernetes.io/control-plane:NoSchedule, which most Pods don't tolerate"
  - "Control-plane nodes are always cordoned"
  answer: 2
  explanation: |
    Control-plane nodes are tainted node-role.kubernetes.io/control-plane:NoSchedule. Ordinary Pods
    lack a matching toleration, so they are repelled. System add-ons that must run there carry the
    toleration.
  ref: "concepts.md#taints-and-tolerations"

- id: scheduling-affinity-namespaces-022
  difficulty: intermediate
  tags: [taints, toleration, operators]
  question: |
    A toleration is written with operator Exists and no value. What does it match?
  options:
  - "Only taints whose value is exactly empty"
  - "Nothing; value is required"
  - "Every taint on every node unconditionally"
  - "Any taint with the given key (any value), as long as the effect matches"
  answer: 3
  explanation: |
    With operator Exists you omit value; the toleration matches any taint that has the same key and
    effect regardless of value. Equal requires the value to match too. (An empty key with Exists
    matches all taints of that effect.)
  ref: "concepts.md#taints-and-tolerations"

- id: scheduling-affinity-namespaces-023
  difficulty: beginner
  tags: [topology-spread, maxskew]
  question: |
    What is the purpose of a Pod topology spread constraint?
  options:
  - "To pack Pods onto as few nodes as possible"
  - "To restrict a Pod to a single namespace"
  - "To distribute matching Pods evenly across failure domains like zones or nodes"
  - "To set CPU and memory limits automatically"
  answer: 2
  explanation: |
    Topology spread constraints control even distribution of matching Pods across topology domains
    (zones, nodes) for high availability, using maxSkew to bound how uneven the spread may be.
  ref: "concepts.md#topology-spread-constraints"

- id: scheduling-affinity-namespaces-024
  difficulty: intermediate
  tags: [topology-spread, whenunsatisfiable]
  question: |
    In a topology spread constraint, what does whenUnsatisfiable: DoNotSchedule mean?
  options:
  - "The Pod is deleted if it can't spread"
  - "It's a soft constraint: schedule anyway but prefer balanced domains"
  - "The constraint is ignored during upgrades"
  - "It's a hard constraint: rather than exceed maxSkew, leave the Pod Pending"
  answer: 3
  explanation: |
    DoNotSchedule is the hard mode: the scheduler will not place the Pod if doing so would exceed
    maxSkew, so the Pod stays Pending. ScheduleAnyway is the soft mode that schedules but prefers
    skew-reducing nodes.
  ref: "concepts.md#topology-spread-constraints"

- id: scheduling-affinity-namespaces-025
  difficulty: advanced
  tags: [topology-spread, skew, calculation]
  question: |
    Three zones currently hold 2, 2, and 1 matching Pods. With maxSkew: 1 and DoNotSchedule, into
    which zone(s) may a new matching Pod be scheduled?
  options:
  - "Any zone"
  - "Only the zone with 1 Pod"
  - "Only the two zones with 2 Pods"
  - "None; the Pod stays Pending"
  answer: 1
  explanation: |
    Global minimum is 1. Placing in the zone with 1 makes counts 2,2,2 (skew 0). Placing in a zone
    with 2 makes it 3 while min stays 1 -> skew 2 > maxSkew 1, which is forbidden. So only the
    zone with 1 Pod is allowed.
  ref: "concepts.md#topology-spread-constraints"

- id: scheduling-affinity-namespaces-026
  difficulty: advanced
  tags: [topology-spread, nodetaintspolicy, defaults]
  question: |
    By default (field left null), how does a topology spread constraint treat node taints when
    computing which nodes count toward skew?
  options:
  - "nodeTaintsPolicy defaults to Honor (only tolerated/untainted nodes count)"
  - "It always errors if any node is tainted"
  - "nodeTaintsPolicy defaults to Ignore (all nodes count regardless of taints)"
  - "Tainted nodes are counted twice"
  answer: 2
  explanation: |
    nodeTaintsPolicy defaults to Ignore, so all nodes are counted for skew even if the Pod can't
    tolerate their taints. (nodeAffinityPolicy, by contrast, defaults to Honor.) You can set Honor to
    count only tolerated/untainted nodes.
  ref: "concepts.md#topology-spread-constraints"

- id: scheduling-affinity-namespaces-027
  difficulty: intermediate
  tags: [topology-spread, matchlabelkeys, rollout]
  question: |
    Why would you add matchLabelKeys: [pod-template-hash] to a topology spread constraint?
  options:
  - "To count only Pods of the same Deployment revision when computing skew during a rollout"
  - "To spread Pods across namespaces"
  - "To disable the constraint during scale-down"
  - "To make the constraint apply to nodes instead of Pods"
  answer: 0
  explanation: |
    matchLabelKeys narrows the Pod group for skew calculation by copying the incoming Pod's label
    values (like pod-template-hash) into the selector. This keeps a rolling update from counting the
    old revision's Pods, so each new revision spreads on its own.
  ref: "concepts.md#topology-spread-constraints"

- id: scheduling-affinity-namespaces-028
  difficulty: beginner
  tags: [resources, requests, scheduling]
  question: |
    Which field does the scheduler use to decide whether a Pod fits on a node?
  options:
  - "resources.limits"
  - "the Pod's actual live CPU usage"
  - "the container image size"
  - "resources.requests"
  answer: 3
  explanation: |
    Scheduling uses requests: the NodeResourcesFit filter checks that the sum of container requests
    fits within the node's allocatable minus already-requested amounts. Limits are runtime
    enforcement and don't affect placement.
  ref: "concepts.md#resource-request-based-placement"

- id: scheduling-affinity-namespaces-029
  difficulty: advanced
  tags: [resources, requests, utilization]
  question: |
    A node shows only 10% CPU utilization, yet the scheduler reports "Insufficient cpu" for a new
    Pod. How is this possible?
  options:
  - "Existing Pods have REQUESTED nearly all allocatable CPU, even though they use little; scheduling is based on requests, not usage"
  - "The node is broken and should be rebooted"
  - "The scheduler measures memory, not CPU"
  - "The Pod has no limits set"
  answer: 0
  explanation: |
    The scheduler reserves capacity by requests, not live usage. If existing Pods requested almost
    all allocatable CPU, the node is "full" for scheduling regardless of actual utilization. Right-
    sizing requests fixes this.
  ref: "concepts.md#resource-request-based-placement"

- id: scheduling-affinity-namespaces-030
  difficulty: advanced
  tags: [resources, scoring, bin-pack, spread]
  question: |
    The default NodeResourcesFit SCORING strategy is LeastAllocated (spread load). What would you
    switch it to if you wanted to bin-pack Pods onto fewer nodes (e.g. to let idle nodes scale down)?
  options:
  - "RequestedToCapacityRatio only"
  - "BalancedAllocation"
  - "MostAllocated"
  - "NodeAffinity"
  answer: 2
  explanation: |
    MostAllocated favors nodes that are already heavily allocated, packing Pods tightly so other
    nodes can be emptied and removed by Cluster Autoscaler/Karpenter. LeastAllocated does the
    opposite (spreads).
  ref: "concepts.md#resource-request-based-placement"

- id: scheduling-affinity-namespaces-031
  difficulty: intermediate
  tags: [resources, no-requests, besteffort]
  question: |
    A Pod is created with NO resource requests or limits. What is a consequence at scheduling and
    eviction time?
  options:
  - "The scheduler refuses to place it"
  - "The scheduler assumes ~0 requests and packs it freely; it becomes BestEffort QoS and is evicted first under node pressure"
  - "It is guaranteed the most resources"
  - "It automatically inherits the node's total capacity as its request"
  answer: 1
  explanation: |
    With no requests the scheduler treats it as needing ~0, so nodes get oversubscribed. The Pod is
    BestEffort QoS and is the first to be evicted when the node runs low. A LimitRange with default
    requests prevents this.
  ref: "concepts.md#resource-request-based-placement"

- id: scheduling-affinity-namespaces-032
  difficulty: beginner
  tags: [priority, priorityclass]
  question: |
    What does a PriorityClass do?
  options:
  - "Assigns an integer priority value to Pods that reference it, influencing scheduling order and preemption"
  - "Sets the CPU limit for a namespace"
  - "Defines which nodes a Pod can run on"
  - "Encrypts the Pod's secrets"
  answer: 0
  explanation: |
    A PriorityClass is a cluster-scoped object mapping a name to an integer value. Pods reference it
    via priorityClassName; higher values are scheduled ahead of lower ones and can preempt lower-
    priority Pods when resources are scarce.
  ref: "concepts.md#priority-and-preemption"

- id: scheduling-affinity-namespaces-033
  difficulty: intermediate
  tags: [preemption, victims]
  question: |
    A high-priority Pod cannot schedule anywhere. How does preemption make room?
  options:
  - "It creates a new node automatically"
  - "It finds a node where evicting one or more LOWER-priority Pods lets the pending Pod fit, then removes those victims"
  - "It reduces the CPU limits of running Pods"
  - "It merges two Pods into one"
  answer: 1
  explanation: |
    Preemption looks for a node where deleting lower-priority Pods frees enough room for the pending
    higher-priority Pod, evicts those victims (giving them graceful termination), and schedules the
    incoming Pod. Cluster Autoscaler, not preemption, adds nodes.
  ref: "concepts.md#priority-and-preemption"

- id: scheduling-affinity-namespaces-034
  difficulty: advanced
  tags: [priority, preemptionpolicy, never]
  question: |
    A batch job should jump ahead in the scheduling queue but must NEVER evict already-running
    workloads. Which setting achieves this?
  options:
  - "globalDefault: true"
  - "preemptionPolicy: Never"
  - "value: 0"
  - "effect: PreferNoSchedule"
  answer: 1
  explanation: |
    preemptionPolicy: Never makes the Pod non-preempting: it is ordered ahead of lower-priority Pods
    in the queue but will not preempt anyone; it waits for resources to free naturally. (It can still
    be preempted by something higher.)
  ref: "concepts.md#priority-and-preemption"

- id: scheduling-affinity-namespaces-035
  difficulty: advanced
  tags: [preemption, pdb]
  question: |
    During preemption, how are PodDisruptionBudgets treated?
  options:
  - "They are strictly enforced; preemption never violates a PDB"
  - "They are ignored entirely"
  - "Honored on a best-effort basis; if no PDB-respecting victim set exists, preemption proceeds anyway"
  - "They convert preemption into a rolling update"
  answer: 2
  explanation: |
    The scheduler tries to pick victims without violating PDBs, but if that's impossible it preempts
    lower-priority Pods regardless. PDBs are best-effort during preemption, not a hard guarantee.
  ref: "concepts.md#priority-and-preemption"

- id: scheduling-affinity-namespaces-036
  difficulty: advanced
  tags: [priority, multi-tenancy, quota]
  question: |
    In a shared multi-tenant cluster, why can unrestricted PriorityClasses be dangerous, and how do
    you mitigate it?
  options:
  - "They leak secrets; rotate them"
  - "A tenant could set a very high priority and preempt everyone else; restrict with a ResourceQuota scoped by PriorityClass and RBAC"
  - "They double CPU billing; use LimitRange"
  - "They break DNS; use a NetworkPolicy"
  answer: 1
  explanation: |
    A malicious or careless tenant creating max-priority Pods could evict other tenants' workloads.
    Mitigate with a ResourceQuota that has a PriorityClass scope (limiting who can consume high
    classes) plus RBAC on the cluster-scoped PriorityClass objects.
  ref: "concepts.md#priority-and-preemption"

- id: scheduling-affinity-namespaces-037
  difficulty: intermediate
  tags: [priority, nominatednodename]
  question: |
    After a Pod triggers preemption on node N, its status shows nominatedNodeName: N. Is the Pod
    guaranteed to run on N?
  options:
  - "Yes, nominatedNodeName is binding"
  - "No; the scheduler tries N first but the Pod may land elsewhere (e.g. if another node frees up or a higher-priority Pod takes N)"
  - "No; nominatedNodeName means the Pod failed"
  - "Yes, unless the node is cordoned"
  answer: 1
  explanation: |
    nominatedNodeName records where preemption is expected to make room and helps track reserved
    resources, but it is not a guarantee. The Pod can end up on a different node, and an even
    higher-priority Pod arriving can clear the nomination.
  ref: "concepts.md#priority-and-preemption"

- id: scheduling-affinity-namespaces-038
  difficulty: beginner
  tags: [namespaces, scope]
  question: |
    Which of the following is a correct statement about Kubernetes namespaces?
  options:
  - "Namespaces scope resource names and are the attachment point for RBAC, ResourceQuota, LimitRange and NetworkPolicy"
  - "Namespaces isolate the Linux kernel between tenants"
  - "Nodes and PersistentVolumes are namespaced objects"
  - "Pods in different namespaces cannot reach each other by design"
  answer: 0
  explanation: |
    A namespace partitions names and anchors RBAC/quota/limits/network policy. It does not isolate
    the kernel, Nodes and PVs are cluster-scoped, and Pods across namespaces can talk on the flat
    network unless a NetworkPolicy restricts them.
  ref: "concepts.md#namespaces-as-a-tenancy-boundary"

- id: scheduling-affinity-namespaces-039
  difficulty: intermediate
  tags: [namespaces, cluster-scoped]
  question: |
    Which of these objects is CLUSTER-scoped (not inside a namespace)?
  options:
  - "Deployment"
  - "ConfigMap"
  - "PersistentVolume"
  - "Service"
  answer: 2
  explanation: |
    PersistentVolumes are cluster-scoped (as are Nodes, StorageClasses, ClusterRoles, PriorityClasses,
    CRDs, IngressClasses, and namespaces themselves). Deployments, ConfigMaps, and Services are
    namespaced.
  ref: "concepts.md#namespaces-as-a-tenancy-boundary"

- id: scheduling-affinity-namespaces-040
  difficulty: intermediate
  tags: [namespaces, dns, cross-namespace]
  question: |
    A Pod in namespace team-a needs to reach a Service named db in namespace team-b. Which DNS name
    works (assuming no NetworkPolicy blocks it)?
  options:
  - "db"
  - "db.team-b.svc.cluster.local"
  - "team-b.db.cluster.local"
  - "db@team-b"
  answer: 1
  explanation: |
    Cross-namespace Service DNS is <service>.<namespace>.svc.cluster.local, so db.team-b.svc.cluster
    .local resolves. The bare name "db" only resolves within the caller's own namespace.
  ref: "concepts.md#namespaces-as-a-tenancy-boundary"

- id: scheduling-affinity-namespaces-041
  difficulty: intermediate
  tags: [resourcequota, requests-required]
  question: |
    A namespace has a ResourceQuota setting requests.cpu and requests.memory. A developer submits a
    Pod with NO cpu/memory requests. What happens?
  options:
  - "The Pod is admitted with zero requests"
  - "The scheduler assigns default requests automatically"
  - "The quota is silently increased"
  - "The API server rejects the Pod with 403 Forbidden because required requests are missing"
  answer: 3
  explanation: |
    Once a quota constrains cpu/memory requests (or limits), every new Pod MUST declare them or
    admission fails with 403. Pairing the quota with a LimitRange that supplies defaults is the usual
    way to avoid forcing every manifest to set them.
  ref: "concepts.md#resourcequota-and-limitrange"

- id: scheduling-affinity-namespaces-042
  difficulty: intermediate
  tags: [resourcequota, limitrange, difference]
  question: |
    What is the core difference between a ResourceQuota and a LimitRange?
  options:
  - "ResourceQuota caps aggregate consumption/object counts for the whole namespace; LimitRange sets per-object defaults and min/max"
  - "They are identical; LimitRange is just the older name"
  - "ResourceQuota applies to Pods only; LimitRange applies to nodes"
  - "LimitRange caps the namespace total; ResourceQuota sets per-container defaults"
  answer: 0
  explanation: |
    ResourceQuota bounds the sum of resources and counts of objects across the namespace. LimitRange
    operates per container/Pod/PVC, injecting default requests/limits and enforcing min/max bounds.
    They are commonly used together.
  ref: "concepts.md#resourcequota-and-limitrange"

- id: scheduling-affinity-namespaces-043
  difficulty: advanced
  tags: [resourcequota, deployment, replicaset]
  question: |
    A Deployment requesting 40 replicas is created in a namespace whose ResourceQuota only allows
    enough CPU for 10 Pods. What is observed?
  options:
  - "The Deployment create is rejected outright"
  - "The Deployment object is created successfully, but only ~10 Pods start; the rest fail quota and the ReplicaSet reports errors"
  - "All 40 Pods run and the quota auto-expands"
  - "The namespace is deleted"
  answer: 1
  explanation: |
    Creating the Deployment succeeds because the Deployment object itself isn't the resource being
    counted; its ReplicaSet then fails to create Pods beyond the quota. kubectl describe replicaset
    shows quota-exceeded (403) events for the blocked Pods.
  ref: "concepts.md#resourcequota-and-limitrange"

- id: scheduling-affinity-namespaces-044
  difficulty: intermediate
  tags: [limitrange, defaults]
  question: |
    A LimitRange in a namespace defines defaultRequest cpu 250m and default (limit) cpu 500m. A Pod
    is created specifying neither requests nor limits for CPU. What CPU values does the container
    get?
  options:
  - "No requests or limits (unbounded)"
  - "requests 250m and limits 500m, injected by the LimitRange"
  - "requests 500m and limits 250m"
  - "It is rejected"
  answer: 1
  explanation: |
    LimitRange injects defaults for unset fields: defaultRequest becomes the request (250m) and
    default becomes the limit (500m). This is how LimitRange complements a ResourceQuota that requires
    requests/limits.
  ref: "concepts.md#resourcequota-and-limitrange"

- id: scheduling-affinity-namespaces-045
  difficulty: intermediate
  tags: [multi-tenancy, soft, stack]
  question: |
    Which combination is the standard recipe for SOFT multi-tenancy within a single cluster?
  options:
  - "One giant namespace shared by all teams"
  - "Separate physical clusters per tenant only"
  - "PriorityClasses and taints alone"
  - "Namespace per tenant + RBAC + ResourceQuota + LimitRange + NetworkPolicy"
  answer: 3
  explanation: |
    Soft multi-tenancy layers a per-tenant namespace with RBAC (who can act), ResourceQuota +
    LimitRange (how much), and NetworkPolicy (who talks to whom). Optionally taints/affinity pin
    tenants to dedicated nodes.
  ref: "concepts.md#soft-vs-hard-multi-tenancy"

- id: scheduling-affinity-namespaces-046
  difficulty: advanced
  tags: [multi-tenancy, hard, isolation]
  question: |
    Why is a namespace-based setup considered only "soft" multi-tenancy, and what is needed for
    "hard" tenancy with untrusted tenants?
  options:
  - "Because namespaces cost money; hard tenancy just needs more nodes"
  - "Because tenants share one kernel, API server and etcd; hard tenancy needs separate/virtual clusters (e.g. vCluster) or sandboxed runtimes (gVisor/Kata)"
  - "Because RBAC is optional; hard tenancy just enforces RBAC"
  - "Because namespaces expire; hard tenancy uses permanent namespaces"
  answer: 1
  explanation: |
    All namespaces share the same kernel, control plane, and cluster-scoped resources, so a container
    escape or over-broad ClusterRole crosses the boundary. Untrusted tenants need stronger isolation:
    separate clusters, virtual clusters like vCluster, or sandboxed runtimes such as gVisor/Kata.
  ref: "concepts.md#soft-vs-hard-multi-tenancy"

- id: scheduling-affinity-namespaces-047
  difficulty: beginner
  tags: [cordon, drain, maintenance]
  question: |
    What is the difference between kubectl cordon and kubectl drain?
  options:
  - "cordon deletes the node; drain reboots it"
  - "They are the same command"
  - "cordon only marks the node unschedulable (existing Pods stay); drain also evicts the node's Pods"
  - "cordon evicts Pods; drain only marks the node unschedulable"
  answer: 2
  explanation: |
    cordon marks a node unschedulable so no new Pods land, but running Pods stay. drain does that AND
    evicts the existing Pods (via the Eviction API) so you can safely reboot or remove the node.
  ref: "concepts.md#cordon-drain-and-node-maintenance"

- id: scheduling-affinity-namespaces-048
  difficulty: advanced
  tags: [drain, pdb, eviction]
  question: |
    kubectl drain on a node hangs, refusing to evict a Pod. The Deployment has a PodDisruptionBudget
    with minAvailable equal to its replica count. Why does drain block?
  options:
  - "Drain uses raw deletion which ignores PDBs"
  - "Drain uses the Eviction API, which honors PDBs; with no disruption budget slack the eviction is refused, so drain waits"
  - "The node is already deleted"
  - "PDBs only apply to StatefulSets, so this can't happen"
  answer: 1
  explanation: |
    drain evicts via the Eviction API specifically so PDBs are respected. If minAvailable leaves no
    room to disrupt even one Pod, the eviction is denied and drain blocks until the budget allows it
    (or you fix the PDB). This drain+PDB interplay is a common senior question.
  ref: "concepts.md#cordon-drain-and-node-maintenance"

- id: scheduling-affinity-namespaces-049
  difficulty: intermediate
  tags: [drain, daemonset, flags]
  question: |
    Why does kubectl drain typically require the --ignore-daemonsets flag?
  options:
  - "DaemonSet Pods hold PersistentVolumes that can't be moved"
  - "DaemonSet Pods are managed to run on every node and would be immediately recreated, so drain won't evict them unless told to ignore them"
  - "DaemonSets are cluster-scoped and can't be evicted"
  - "The flag deletes the DaemonSet entirely"
  answer: 1
  explanation: |
    A DaemonSet controller recreates its Pod on the node regardless of cordon, so draining them is
    pointless; drain refuses unless you pass --ignore-daemonsets to acknowledge that those Pods are
    intentionally left/recreated.
  ref: "concepts.md#cordon-drain-and-node-maintenance"

- id: scheduling-affinity-namespaces-050
  difficulty: advanced
  tags: [scheduler, profiles, schedulername]
  question: |
    How can a specific Pod be handled by a non-default scheduler profile or a custom scheduler?
  options:
  - "By setting .spec.schedulerName to the profile/scheduler name"
  - "By adding a nodeSelector"
  - "By raising its PriorityClass value"
  - "It is impossible; there is only one scheduler"
  answer: 0
  explanation: |
    kube-scheduler can run multiple named profiles, and you can also deploy custom schedulers. A Pod
    selects one by setting .spec.schedulerName; the matching scheduler/profile is responsible for
    binding it.
  ref: "concepts.md#what-the-scheduler-does"
