topic: Helm & Package Management
domain: kubernetes
topic_slug: helm-package-management
version: 1
questions:
  - id: helm-package-management-001
    difficulty: beginner
    tags:
      - overview
      - package-manager
    question: |
      In one sentence, what is Helm?
    options:
      - A CNI plugin that provides pod-to-pod networking and enforces NetworkPolicy across cluster nodes
      - A drop-in replacement for the kube-apiserver that serves the cluster's REST API and admission control
      - A CRI-compatible container runtime that replaces containerd for pulling images and running pods on worker nodes
      - The package manager for Kubernetes — it packages, distributes, and manages the lifecycle of applications
        defined as templated manifests
    answer: 3
    explanation: |
      Helm is the de-facto package manager for Kubernetes: it packages templated manifests
      into versioned charts, distributes them via repositories/OCI registries, and manages
      releases (install/upgrade/rollback/uninstall). It is not a runtime, CNI, or API server.
    ref: concepts.md#the-problem-helm-solves
  - id: helm-package-management-002
    difficulty: beginner
    tags:
      - terminology
      - chart
      - release
    question: |
      In Helm terminology, what is a "chart"?
    options:
      - A running, deployed instance of an application together with its live pods in a cluster
      - A package of templated Kubernetes manifests plus default values and metadata
      - The append-only revision history and rollback log of a deployed application
      - A web dashboard visualizing cluster resource usage, pod health, and node metrics
    answer: 1
    explanation: |
      A chart is the package: a directory (or .tgz) containing Chart.yaml metadata,
      values.yaml defaults, and templated manifests. A running instance of a chart in a
      cluster is a "release", not a chart.
    ref: concepts.md#chart-structure
  - id: helm-package-management-003
    difficulty: beginner
    tags:
      - terminology
      - release
    question: |
      A "release" in Helm is best described as:
    options:
      - An immutable Git tag applied to the chart's source repository to freeze its templates
      - A newly built version of the Helm CLI binary distributed to operators for a given platform
      - A packaged chart that has been published to a repository and listed in its index.yaml catalog
      - An installed instance of a chart in a cluster, identified by name and namespace
    answer: 3
    explanation: |
      A release is an instance of a chart running in a cluster, identified by a name and
      namespace. The same chart can be installed many times as separate releases, each with
      its own values and revision history.
    ref: concepts.md#releases-revisions-and-the-release-lifecycle
  - id: helm-package-management-004
    difficulty: beginner
    tags:
      - problem
      - motivation
    question: |
      Which problem does Helm primarily NOT solve on its own?
    options:
      - Distributing a versioned application package
      - Building the container image from a Dockerfile
      - Installing/upgrading/rolling back an app as a single unit
      - Templating manifests so one chart serves many environments
    answer: 1
    explanation: |
      Helm templates, packages/distributes, and manages the lifecycle of manifests. It never
      builds images — it only references image tags. Building images is the job of the
      container tooling covered in the docker domain.
    ref: concepts.md#the-problem-helm-solves
  - id: helm-package-management-005
    difficulty: beginner
    tags:
      - chart-structure
      - chart-yaml
    question: |
      Which file holds a chart's metadata (name, version, appVersion, dependencies)?
    options:
      - Chart.yaml
      - _helpers.tpl
      - NOTES.txt
      - values.yaml
    answer: 0
    explanation: |
      Chart.yaml is the chart's metadata file: name, chart version, appVersion, type, and the
      dependencies list. values.yaml holds default configuration; _helpers.tpl holds named
      templates; NOTES.txt is the post-install message.
    ref: concepts.md#chart-structure
  - id: helm-package-management-006
    difficulty: intermediate
    tags:
      - chart-structure
      - templates
      - partials
    question: |
      Why do partial files like `_helpers.tpl` start with an underscore?
    options:
      - It marks them as deprecated so Helm emits a warning and skips them on the next major chart release
      - Files whose names start with `_` are treated as partials and are not rendered into standalone
        manifests
      - It tells Helm to encrypt the file's contents at rest before storing them in the release Secret
      - It forces the file to be loaded last so its named templates override any defined earlier
    answer: 1
    explanation: |
      In templates/, any file whose name begins with `_` is a partial — a place for `define`d
      named templates — and Helm never renders it as its own Kubernetes manifest. That is why
      helpers live in _helpers.tpl.
    ref: concepts.md#named-templates-and-_helperstpl
  - id: helm-package-management-007
    difficulty: intermediate
    tags:
      - chart-structure
      - crds
    question: |
      What is special about the `crds/` directory in a Helm 3 chart?
    options:
      - It stores each revision's serialized release history as raw YAML for later rollback lookups
      - Its files are rendered through the Go template engine exactly like everything under templates/
      - It holds raw (non-templated) CRDs installed before other resources, only on first install, and
        never upgraded or deleted by Helm
      - It is tracked as a normal release resource and deleted automatically on `helm uninstall`
    answer: 2
    explanation: |
      crds/ contains raw CRD YAML (not templated) that Helm installs before the rest of the
      chart and only on first install. Helm does not template, upgrade, or delete these CRDs
      automatically — a deliberate safety choice.
    ref: concepts.md#chart-structure
  - id: helm-package-management-008
    difficulty: intermediate
    tags:
      - chart-yaml
      - versioning
    question: |
      What is the difference between `version` and `appVersion` in Chart.yaml?
    options:
      - '`appVersion` declares the minimum Helm CLI version required to render and install the chart'
      - They must always be kept identical or `helm lint` rejects the chart as malformed
      - '`version` is the SemVer of the chart package; `appVersion` is the (informational) version of
        the application being deployed'
      - '`version` is the Kubernetes API version the chart targets; `appVersion` is the chart package SemVer'
    answer: 2
    explanation: |
      `version` is the chart's own SemVer (bump it on any chart change). `appVersion` is the
      version of the app shipped by the chart — informational, and often used as the default
      image tag. They are independent.
    ref: concepts.md#chart-structure
  - id: helm-package-management-009
    difficulty: beginner
    tags:
      - templating
      - values
    question: |
      In a Helm template, how do you reference a value named `replicaCount` from values.yaml?
    options:
      - '{{ replicaCount }}'
      - '{{ .Values.replicaCount }}'
      - '{{ $replicaCount }}'
      - ${replicaCount}
    answer: 1
    explanation: |
      User-facing values are exposed under the top-level `.Values` object, so
      `{{ .Values.replicaCount }}` reads it. Bare names or shell-style `${}` are not how Go
      templates access values.
    ref: concepts.md#go-templating-and-values
  - id: helm-package-management-010
    difficulty: intermediate
    tags:
      - templating
      - built-in-objects
    question: |
      Which built-in object exposes the release name, namespace, and revision number?
    options:
      - .Release
      - .Files
      - .Chart
      - .Capabilities
    answer: 0
    explanation: |
      `.Release` holds `.Name`, `.Namespace`, `.Revision`, `.IsInstall`, and `.IsUpgrade`.
      `.Chart` exposes Chart.yaml fields, `.Capabilities` exposes cluster/API versions, and
      `.Files` accesses non-template files.
    ref: concepts.md#go-templating-and-values
  - id: helm-package-management-011
    difficulty: intermediate
    tags:
      - templating
      - whitespace
      - indent
    question: |
      You inject a values map into a manifest with `{{ toYaml .Values.resources }}` and get
      invalid YAML because the block is not indented under its key. What is the idiomatic fix?
    options:
      - Pipe through `nindent`, e.g. `{{- toYaml .Values.resources | nindent 12 }}`
      - Pass the block only via `--set resources=...` on the CLI so Helm skips the toYaml call entirely
      - Move the resources map out of values.yaml and into Chart.yaml so Helm indents it automatically
      - Wrap the whole manifest file in quotes so the YAML parser treats the block as a single string
    answer: 0
    explanation: |
      `nindent N` adds a leading newline and indents every line of the block by N spaces, so a
      multi-line YAML block lands correctly under its key. `indent` (no leading newline) and
      `nindent` are the standard tools for injecting blocks.
    ref: concepts.md#go-templating-and-values
  - id: helm-package-management-012
    difficulty: intermediate
    tags:
      - templating
      - whitespace
    question: |
      What does the `-` in `{{-` do in a Helm/Go template?
    options:
      - Trims the whitespace and newline preceding the action
      - Comments out the entire line so the action is skipped during rendering, like a `{{/* */}}` block
      - Marks the value as optional and substitutes an empty string if the referenced field is unset
      - Negates the boolean value that follows the dash, equivalent to wrapping it in the `not` function
    answer: 0
    explanation: |
      `{{-` trims whitespace/newline before the action, and `-}}` trims whitespace after it.
      This whitespace control is essential to keep rendered YAML valid and correctly indented.
    ref: concepts.md#go-templating-and-values
  - id: helm-package-management-013
    difficulty: intermediate
    tags:
      - functions
      - pipelines
      - default
    question: |
      What does `{{ .Values.tier | default "backend" | upper }}` produce when `tier` is unset?
    options:
      - An empty string
      - '"backend"'
      - '"BACKEND"'
      - A template render error
    answer: 2
    explanation: |
      The pipeline applies `default "backend"` (supplying the fallback since tier is empty),
      then `upper` uppercases it, yielding "BACKEND". Pipelines feed each function's output
      into the next.
    ref: concepts.md#template-functions-pipelines-and-flow-control
  - id: helm-package-management-014
    difficulty: advanced
    tags:
      - functions
      - include
      - template
    question: |
      Why is `include` preferred over the built-in `template` action when composing named
      templates?
    options:
      - '`include` runs faster at render time because it caches the named template after first evaluation'
      - '`include` returns the rendered output as a string, so it can be piped (e.g. into `nindent`),
        whereas `template` is a statement that cannot be piped'
      - '`template` was removed in Helm 3 and only `include` remains supported by the Go template engine'
      - '`include` automatically base64-encodes and encrypts the rendered output before it is emitted'
    answer: 1
    explanation: |
      `template` emits directly and cannot be piped, so you cannot indent its output. `include`
      returns a string, letting you write `{{ include "x" . | nindent 4 }}`. That pipeability
      is why charts standardize on `include`.
    ref: concepts.md#template-functions-pipelines-and-flow-control
  - id: helm-package-management-015
    difficulty: advanced
    tags:
      - functions
      - tpl
    question: |
      When would you use the `tpl` function?
    options:
      - To base64-encode a Secret's data field before it is written into the rendered manifest
      - To fail the template render with a custom error message whenever a required value is missing
      - To convert a Go struct or values map into a compact JSON string for embedding in a ConfigMap
      - To render a string (e.g. a user-supplied value) that itself contains template directives, using
        the current context
    answer: 3
    explanation: |
      `tpl "{{ .Release.Name }}-cfg" .` evaluates a string that contains template syntax
      against the current context. It is the tool for the case where a *value* provided by the
      user is itself a template.
    ref: concepts.md#template-functions-pipelines-and-flow-control
  - id: helm-package-management-016
    difficulty: intermediate
    tags:
      - functions
      - required
    question: |
      What does `{{ required "image.repository is required" .Values.image.repository }}` do?
    options:
      - Logs the message as a warning to stderr but continues rendering with an empty value substituted
      - Always returns the literal string 'required' regardless of what the value field actually holds
      - Renders the value, but fails the template render with the given message if the value is empty/unset
      - Marks the value as optional and falls back to the message string as its default when unset
    answer: 2
    explanation: |
      `required` returns the value if present, but aborts the render with the supplied error
      message if it is empty or unset. It is how charts enforce mandatory user-supplied values.
    ref: concepts.md#template-functions-pipelines-and-flow-control
  - id: helm-package-management-017
    difficulty: intermediate
    tags:
      - flow-control
      - with
      - scope
    question: |
      What does the `{{- with .Values.podAnnotations }}` block do to the `.` inside it?
    options:
      - It converts the podAnnotations map into a list of key/value pairs for the duration of the block
      - Nothing — `.` still refers to the root context and podAnnotations must be addressed by full path
      - It rebinds `.` to `.Values.podAnnotations` for the duration of the block
      - It deletes podAnnotations from the values tree once the block has finished rendering its output
    answer: 2
    explanation: |
      `with` sets the scope: inside the block, `.` refers to `.Values.podAnnotations` (and the
      block is skipped if that value is empty). That is why you often see `toYaml . | nindent`
      inside a `with`. To reach the root inside it, use `$`.
    ref: concepts.md#template-functions-pipelines-and-flow-control
  - id: helm-package-management-018
    difficulty: advanced
    tags:
      - helpers
      - naming
      - truncation
    question: |
      A common fullname helper does `printf "%s-%s" .Release.Name .Chart.Name | trunc 63 | trimSuffix "-"`.
      Why the `trunc 63`?
    options:
      - 63 is the maximum length of a Kubernetes object name / label value; longer strings produce invalid
        objects
      - It improves DNS lookup performance by keeping service names within a single 63-byte cache line
      - Helm rejects any rendered template file that exceeds 63 lines of output as a safety guardrail
      - It reserves the remaining characters as space for the release namespace prefix Helm prepends later
    answer: 0
    explanation: |
      Kubernetes limits many names and label values to 63 characters (RFC 1123 label). Long
      release names would otherwise generate invalid object names, so helpers truncate to 63
      and trim a trailing hyphen.
    ref: concepts.md#named-templates-and-_helperstpl
  - id: helm-package-management-019
    difficulty: beginner
    tags:
      - helpers
      - define
      - include
    question: |
      How do you define a reusable named template in `_helpers.tpl`?
    options:
      - With an `export "chart.labels"` statement placed in the file
      - With a `function "chart.labels"` declaration block
      - With `{{ define "chart.labels" }} ... {{ end }}`
      - By listing it under a `namedTemplates:` key in values.yaml
    answer: 2
    explanation: |
      Named templates are created with `{{- define "name" -}} ... {{- end -}}` and invoked
      with `include "name" .`. Conventionally they live in templates/_helpers.tpl.
    ref: concepts.md#named-templates-and-_helperstpl
  - id: helm-package-management-020
    difficulty: beginner
    tags:
      - lifecycle
      - install
      - commands
    question: |
      Which command creates a new release named `web` from a local chart?
    options:
      - helm apply web ./mychart
      - helm install web ./mychart
      - helm create web ./mychart
      - kubectl helm install web ./mychart
    answer: 1
    explanation: |
      `helm install <release> <chart>` creates a release. `helm create` scaffolds a new chart
      directory; there is no `helm apply`. `helm` is a standalone CLI, not a kubectl subcommand.
    ref: concepts.md#releases-revisions-and-the-release-lifecycle
  - id: helm-package-management-021
    difficulty: intermediate
    tags:
      - lifecycle
      - upgrade-install
      - idempotent
    question: |
      In a CI pipeline you want a single command that installs the release if it doesn't exist
      and upgrades it if it does. Which do you use?
    options:
      - helm install --force
      - helm upgrade --install
      - helm rollback --create
      - helm apply --idempotent
    answer: 1
    explanation: |
      `helm upgrade --install <release> <chart>` is idempotent: it installs when the release is
      absent and upgrades when present. It is the standard CI pattern, often paired with
      `--atomic --wait`.
    ref: concepts.md#releases-revisions-and-the-release-lifecycle
  - id: helm-package-management-022
    difficulty: intermediate
    tags:
      - lifecycle
      - revisions
      - rollback
    question: |
      A release is at revision 3. You run `helm rollback web 1`. What is the resulting revision?
    options:
      - Revision 0 — rollback wipes all prior history and restarts numbering from zero
      - Revision 4 — rollback creates a new revision whose content equals revision 1
      - It stays at revision 3 and only the live cluster objects are changed
      - Revision 1 — the revision counter resets to the rollback target
    answer: 1
    explanation: |
      Rollback does not rewind the counter or delete history; it creates a new revision
      (revision 4) whose manifest content equals the target revision (1). History is
      append-only, which is what makes further rollbacks predictable.
    ref: concepts.md#releases-revisions-and-the-release-lifecycle
  - id: helm-package-management-023
    difficulty: intermediate
    tags:
      - lifecycle
      - atomic
      - failure
    question: |
      What does the `--atomic` flag do on `helm upgrade`?
    options:
      - Forces every pod in the release to restart at the same instant during the upgrade
      - Runs the entire upgrade as one atomic transaction committed directly to etcd
      - If the upgrade fails, it automatically rolls the release back to the previous successful revision
      - Disables the release's revision history so old manifests stop consuming etcd space
    answer: 2
    explanation: |
      `--atomic` waits for the upgrade to succeed and, on failure, automatically rolls back to
      the last good revision (implying `--wait`). It prevents leaving the release stuck in a
      failed/pending state.
    ref: concepts.md#releases-revisions-and-the-release-lifecycle
  - id: helm-package-management-024
    difficulty: beginner
    tags:
      - lifecycle
      - history
      - commands
    question: |
      Which command lists the revision history of a release?
    options:
      - helm log web
      - helm history web
      - helm revisions web
      - helm get history web
    answer: 1
    explanation: |
      `helm history <release>` lists each revision with its status, chart version, and update
      time. `helm status` shows the current state; `helm get` fetches manifest/values/notes.
    ref: concepts.md#releases-revisions-and-the-release-lifecycle
  - id: helm-package-management-025
    difficulty: advanced
    tags:
      - lifecycle
      - three-way-merge
      - drift
    question: |
      When you run `helm upgrade`, how does Helm 3 reconcile changes a user made directly with
      `kubectl edit`?
    options:
      - It deletes and recreates every object in the release from scratch on each upgrade
      - It ignores live state entirely and overwrites everything with the newly rendered manifest
      - It performs a three-way merge between the old manifest, the new manifest, and the live cluster
        state
      - It refuses to upgrade and aborts if any managed object was edited outside Helm
    answer: 2
    explanation: |
      Helm 3 computes a three-way strategic merge patch (previous release manifest, proposed
      new manifest, and current live state), so manual drift is considered rather than blindly
      clobbered. This was a notable improvement over Helm 2.
    ref: concepts.md#releases-revisions-and-the-release-lifecycle
  - id: helm-package-management-026
    difficulty: intermediate
    tags:
      - precedence
      - values
    question: |
      A value is set in the chart's values.yaml, in a `-f values-prod.yaml` file, and via
      `--set` on the command line. Which value wins?
    options:
      - The `-f values-prod.yaml` value
      - The `--set` value
      - It is undefined / an error
      - The chart's values.yaml default
    answer: 1
    explanation: |
      Precedence (highest last): chart values.yaml < parent-chart values < `-f` files
      (left-to-right) < `--set*`. Command-line `--set` has the highest priority and wins.
    ref: concepts.md#values-overriding-and-precedence
  - id: helm-package-management-027
    difficulty: intermediate
    tags:
      - precedence
      - values-files
    question: |
      You run `helm upgrade web ./c -f base.yaml -f prod.yaml`. A key `logLevel` is set in both
      files. Which value applies?
    options:
      - base.yaml wins because the first `-f` file listed is treated as the authoritative source
      - prod.yaml wins because later `-f` files override earlier ones
      - The two values are concatenated into a single list under the `logLevel` key
      - Helm aborts with a conflict error because the same key is set in two value files
    answer: 1
    explanation: |
      Multiple `-f`/`--values` files are merged left-to-right, so the right-most file
      (prod.yaml) overrides earlier ones for overlapping keys.
    ref: concepts.md#values-overriding-and-precedence
  - id: helm-package-management-028
    difficulty: advanced
    tags:
      - values
      - lists
      - merge
    question: |
      You want to add one item to a list value defined in the chart. What actually happens if
      you supply that value via `--set` or `-f`?
    options:
      - Helm deep-merges the two arrays element-by-element, aligning them by their list index
      - Your supplied array replaces the chart's array wholesale — lists are not merged
      - Helm rejects the override and keeps the chart's original list unless you use `--force`
      - Helm appends your single item to the end of the chart's existing list of values
    answer: 1
    explanation: |
      Helm deep-merges maps but replaces lists entirely. To change one element you must supply
      the whole array. This surprises people expecting an append/merge.
    ref: concepts.md#values-overriding-and-precedence
  - id: helm-package-management-029
    difficulty: intermediate
    tags:
      - values
      - set-string
    question: |
      Why might you use `--set-string replicaCount=3` instead of `--set replicaCount=3`?
    options:
      - It is mandatory for every integer value because `--set` cannot handle numeric types
      - There is no functional difference; the two flags are aliases for each other
      - To speed up rendering by skipping the type-inference step that `--set` performs
      - To force the value to be treated as a string rather than being type-coerced to a number/bool
    answer: 3
    explanation: |
      `--set` infers types (so `3` becomes an integer, `true` a bool). `--set-string` forces
      the value to be a string, which matters when a field must be quoted (e.g. an image tag
      like "3" or a value like "0755").
    ref: concepts.md#values-overriding-and-precedence
  - id: helm-package-management-030
    difficulty: intermediate
    tags:
      - values
      - get-values
      - debug
    question: |
      How do you see the fully computed values (defaults plus overrides) for a deployed release?
    options:
      - kubectl get values web
      - helm list --values web
      - helm get values web --all
      - helm show values web
    answer: 2
    explanation: |
      `helm get values web` shows the user-supplied values; adding `-a`/`--all` shows the full
      computed set including chart defaults. `helm show values <chart>` shows a chart's default
      values.yaml, not a release's.
    ref: concepts.md#values-overriding-and-precedence
  - id: helm-package-management-031
    difficulty: beginner
    tags:
      - dependencies
      - subcharts
    question: |
      Where are a chart's dependencies (subcharts) declared in Helm 3?
    options:
      - In values.yaml under `deps:`
      - In the .helmignore file
      - In a separate requirements.yaml only
      - In the `dependencies:` list of Chart.yaml
    answer: 3
    explanation: |
      Helm 3 declares dependencies in the `dependencies:` list of Chart.yaml (the separate
      requirements.yaml of Helm 2 is gone). `helm dependency update` then vendors them into
      charts/.
    ref: concepts.md#chart-dependencies-and-subcharts
  - id: helm-package-management-032
    difficulty: intermediate
    tags:
      - dependencies
      - lockfile
    question: |
      What is the purpose of `Chart.lock`, produced by `helm dependency update`?
    options:
      - It encrypts the subchart values so credentials are not stored in plain text
      - It locks the release so that no operator can run `helm upgrade` against it
      - It pins the exact resolved dependency versions so dependency builds are reproducible
      - It stores the release's revision history for use during a later rollback
    answer: 2
    explanation: |
      Chart.lock records the exact versions resolved for the dependency ranges in Chart.yaml,
      much like a package lockfile, so `helm dependency build` reproduces the same charts/
      contents later.
    ref: concepts.md#chart-dependencies-and-subcharts
  - id: helm-package-management-033
    difficulty: intermediate
    tags:
      - dependencies
      - condition
    question: |
      A dependency has `condition: postgresql.enabled` in Chart.yaml. What does that let you do?
    options:
      - Pin the subchart to a specific SemVer version from the repository
      - Grant the subchart extra RBAC permissions when it is installed
      - Rename the subchart under a different alias in the charts/ directory
      - Toggle the subchart on or off based on the boolean value at that path
    answer: 3
    explanation: |
      `condition` points at a boolean value; when false, the subchart is not installed. `alias`
      renames a subchart, `version` pins it, and `tags` group several subcharts under one
      toggle.
    ref: concepts.md#chart-dependencies-and-subcharts
  - id: helm-package-management-034
    difficulty: advanced
    tags:
      - dependencies
      - global-values
      - subcharts
    question: |
      In a parent chart, how do you set a value that must be visible to the parent AND all its
      subcharts?
    options:
      - Duplicate it into every subchart's values.yaml manually and it merges automatically
      - Use `--set` together with the `--propagate` flag so the value flows into subcharts
      - Put it at the top level of the parent chart's values.yaml so subcharts inherit it
      - Put it under the `global:` key of values.yaml (`.Values.global.*`)
    answer: 3
    explanation: |
      Values under `global:` are shared with the parent and every subchart via
      `.Values.global.*`. A bare top-level value only reaches a subchart if it is nested under
      that subchart's name/alias.
    ref: concepts.md#chart-dependencies-and-subcharts
  - id: helm-package-management-035
    difficulty: advanced
    tags:
      - dependencies
      - library-chart
    question: |
      What is a Helm "library chart" (`type: library`)?
    options:
      - A chart that ships only reusable named templates and is not installable on its own
      - A chart that is published as an OCI artifact to a container registry instead of an HTTP repo
      - A chart flagged as deprecated in Chart.yaml so it is hidden from repository listings
      - A chart that installs a shared database instance consumed by several other charts
    answer: 0
    explanation: |
      A library chart (type: library) provides reusable helpers/named templates for other
      charts to depend on. It contains no installable manifests and cannot be `helm install`ed
      by itself.
    ref: concepts.md#chart-dependencies-and-subcharts
  - id: helm-package-management-036
    difficulty: beginner
    tags:
      - repositories
      - commands
    question: |
      Which command adds a classic HTTP chart repository?
    options:
      - helm pull bitnami --repo https://charts.bitnami.com/bitnami
      - helm install bitnami --add-repo https://charts.bitnami.com/bitnami
      - helm registry add bitnami https://charts.bitnami.com/bitnami
      - helm repo add bitnami https://charts.bitnami.com/bitnami
    answer: 3
    explanation: |
      `helm repo add <name> <url>` registers a classic HTTP repository (which serves an
      index.yaml catalog of packaged charts). `helm repo update` refreshes the cached indexes.
    ref: concepts.md#repositories-and-oci-registries
  - id: helm-package-management-037
    difficulty: intermediate
    tags:
      - oci
      - registries
    question: |
      Which statement about Helm OCI registry support is correct?
    options:
      - Charts are pushed as OCI artifacts to a container registry (e.g. `oci://...`); there is no index.yaml
        and you don't `helm repo add` it
      - OCI support was a Helm 2 feature that was dropped in Helm 3 in favor of classic HTTP index.yaml repos
      - OCI registries can only store container images, so charts must always be served from a separate HTTP repository
      - OCI charts still require `helm repo add` plus a generated index.yaml catalog, exactly like classic HTTP repositories
    answer: 0
    explanation: |
      With OCI (GA since Helm 3.8) charts are OCI artifacts stored in any container registry.
      There is no index.yaml and no `helm repo add`; you `helm push`/`helm pull`/`helm install`
      with an `oci://` reference and authenticate via `helm registry login`.
    ref: concepts.md#repositories-and-oci-registries
  - id: helm-package-management-038
    difficulty: beginner
    tags:
      - packaging
      - commands
    question: |
      Which command produces a distributable `.tgz` archive from a chart directory?
    options:
      - helm tar ./mychart --output chart.tgz to archive the directory into a gzip tarball
      - helm build ./mychart to compile the chart's templates and emit a distributable bundle
      - helm package ./mychart
      - helm compress ./mychart --format tgz to zip the chart files for publishing to a repo
    answer: 2
    explanation: |
      `helm package ./mychart` bundles the chart into a versioned `.tgz` (named
      chart-<version>.tgz) ready to publish to a repo or push to an OCI registry.
    ref: concepts.md#repositories-and-oci-registries
  - id: helm-package-management-039
    difficulty: intermediate
    tags:
      - helm3
      - tiller
      - architecture
    question: |
      What is the single biggest architectural change from Helm 2 to Helm 3?
    options:
      - The templating engine was swapped from Go templates to Jinja2 for compatibility with Ansible tooling
      - Chart manifests switched from YAML to JSON so the API server could validate them without conversion
      - The in-cluster Tiller server was removed; Helm 3 is a client that talks directly to the API server
        with the caller's own kubeconfig/RBAC
      - Helm 3 now requires a dedicated PostgreSQL database to persist all release state outside the cluster
    answer: 2
    explanation: |
      Helm 2 relied on Tiller, an in-cluster server usually granted broad permissions. Helm 3
      removed Tiller entirely: the client uses the caller's kubeconfig and RBAC, eliminating a
      major security and operational pain point.
    ref: concepts.md#helm-3-architecture--no-tiller
  - id: helm-package-management-040
    difficulty: intermediate
    tags:
      - helm3
      - release-state
      - storage
    question: |
      By default, where and how does Helm 3 store a release's state?
    options:
      - Inside a dedicated Tiller pod that serializes each release into its in-memory store
      - In a single ConfigMap in the kube-system namespace shared across every release in the cluster
      - In a local state file under ~/.helm on the operator's laptop, synced manually between machines
      - As a Kubernetes Secret (one per release revision) in the release's namespace
    answer: 3
    explanation: |
      Helm 3 stores each release revision as a Secret of type helm.sh/release.v1, named
      sh.helm.release.v1.<release>.v<revision>, in the release's namespace. The state lives in
      the cluster, not on the client.
    ref: concepts.md#helm-3-architecture--no-tiller
  - id: helm-package-management-041
    difficulty: advanced
    tags:
      - helm3
      - helm-driver
      - storage-backend
    question: |
      A release's serialized state grows beyond the ~1MB Secret/etcd size limit. Which
      HELM_DRIVER backend is designed for this case?
    options:
      - configmap, which transparently shards oversized release data across multiple ConfigMaps to dodge the limit
      - secret, whose gzip compression of the payload keeps even multi-megabyte releases under the etcd limit
      - sql (beta, PostgreSQL)
      - file, which streams release state to a local disk volume so it is never bounded by the etcd object size
    answer: 2
    explanation: |
      HELM_DRIVER accepts secret (default), configmap, or sql. The sql backend (beta,
      PostgreSQL) is meant for releases whose state exceeds the ~1MB limit imposed by storing
      data in Secrets/ConfigMaps in etcd. Switching backends requires manual migration.
    ref: concepts.md#helm-3-architecture--no-tiller
  - id: helm-package-management-042
    difficulty: advanced
    tags:
      - helm3
      - rbac
      - security
    question: |
      In Helm 3, what determines whether a `helm install` succeeds against a cluster?
    options:
      - A cluster-admin token embedded in the chart's Chart.yaml that Helm presents to the API server
      - Nothing — Helm bypasses RBAC entirely and applies manifests through a privileged backdoor client
      - The permissions granted to a Tiller service account that Helm 3 still deploys into kube-system
      - The RBAC bound to the user's own kubeconfig credentials
    answer: 3
    explanation: |
      Because Helm 3 is client-only, it acts as the caller. Whatever your kubeconfig identity
      is allowed to do via RBAC is exactly what Helm can do — no Tiller, no privilege
      escalation.
    ref: concepts.md#helm-3-architecture--no-tiller
  - id: helm-package-management-043
    difficulty: intermediate
    tags:
      - hooks
      - annotations
    question: |
      How do you turn an ordinary Job manifest into a Helm pre-upgrade hook?
    options:
      - 'Add the annotation `helm.sh/hook: pre-upgrade` to the resource''s metadata'
      - Move the Job manifest into the chart's crds/ directory so Helm runs it before other resources
      - 'Change the manifest''s `kind` from Job to the dedicated `Hook` type that Helm registers at install time'
      - Rename the manifest file to hook.yaml, which Helm scans for and executes ahead of the main resources
    answer: 0
    explanation: |
      A resource becomes a hook via the `helm.sh/hook` annotation (e.g. pre-upgrade,
      pre-install). Otherwise it is an ordinary templated resource. Multiple phases can be
      comma-separated.
    ref: concepts.md#hooks
  - id: helm-package-management-044
    difficulty: intermediate
    tags:
      - hooks
      - ordering
      - weight
    question: |
      Two hooks share the same phase. One has `helm.sh/hook-weight: "-5"` and the other `"10"`.
      Which runs first?
    options:
      - The one with weight 10, since Helm runs hooks in descending weight order (highest first)
      - The one with weight -5 (hooks run in ascending weight order)
      - They run simultaneously because weights only affect deletion order, not execution order
      - Order is random since hook weights are advisory hints that Helm does not actually enforce
    answer: 1
    explanation: |
      Within a phase, Helm executes hooks in ascending weight order (lowest first), so -5 runs
      before 10. Weights default to 0 and must be quoted strings.
    ref: concepts.md#hooks
  - id: helm-package-management-045
    difficulty: advanced
    tags:
      - hooks
      - delete-policy
    question: |
      What does `helm.sh/hook-delete-policy: hook-succeeded` do?
    options:
      - Deletes the hook resource only when the hook exits with a non-zero failure status
      - Deletes the hook resource after it completes successfully
      - Pins the hook resource in place so Helm never garbage-collects it across future upgrades
      - Triggers deletion of the entire release and all its tracked objects once the hook succeeds
    answer: 1
    explanation: |
      hook-succeeded deletes the hook object after a successful run. Other policies are
      hook-failed (delete on failure) and before-hook-creation (the default — delete the prior
      hook object before recreating).
    ref: concepts.md#hooks
  - id: helm-package-management-046
    difficulty: advanced
    tags:
      - hooks
      - tracking
      - uninstall
    question: |
      Why might a resource created by a Helm hook survive `helm uninstall`?
    options:
      - Hook resources are not part of the release's normal tracked set, so unless a delete policy or
        normal tracking applies, Helm leaves them alone
      - uninstall never deletes any resource whose kind is Job, regardless of how it was created
      - The hook resource is protected by a finalizer that Helm injects and only removes on the next install
      - Hook resources are serialized straight into etcd as raw records that the API server cannot delete
    answer: 0
    explanation: |
      Hook resources are managed only for their lifecycle phase and are not tracked as part of
      the release like normal resources. Unless a hook-delete-policy removes them, `helm
      uninstall` may not clean them up.
    ref: concepts.md#hooks
  - id: helm-package-management-047
    difficulty: intermediate
    tags:
      - kustomize
      - comparison
    question: |
      What is the fundamental difference between Helm and Kustomize?
    options:
      - Kustomize tracks release revisions and can roll them back, whereas Helm has no rollback capability
      - They are the same underlying tool rebranded, with Kustomize being the community fork of Helm 2
      - Helm runs only on GKE clusters while Kustomize is restricted to EKS by its build integration
      - Helm uses a templating language plus packaging and release lifecycle; Kustomize uses overlays/patches
        with no templating language and no release management
    answer: 3
    explanation: |
      Helm templates manifests (Go/Sprig) and adds packaging + lifecycle (install/upgrade/
      rollback/history). Kustomize is overlay/patch-based with no templating language and only
      emits YAML for kubectl to apply — no release lifecycle.
    ref: concepts.md#helm-vs-kustomize
  - id: helm-package-management-048
    difficulty: intermediate
    tags:
      - kustomize
      - when-to-use
    question: |
      Your team owns simple manifests and wants per-environment variation without learning a
      templating language, letting `kubectl` apply the result. Which tool fits best?
    options:
      - Tiller, the in-cluster component that renders per-environment manifests on the API server's behalf
      - Neither tool supports per-environment configuration without writing a custom controller
      - Helm, because packaging every manifest as a versioned chart is mandatory for any multi-env setup
      - Kustomize (`kubectl apply -k`), overlaying patches on a base
    answer: 3
    explanation: |
      Kustomize's overlay model (a base plus per-environment patches) with no templating
      language is a good fit when you own the manifests and just need environment variation.
      It is built into kubectl via `apply -k`.
    ref: concepts.md#helm-vs-kustomize
  - id: helm-package-management-049
    difficulty: advanced
    tags:
      - kustomize
      - helm
      - post-render
    question: |
      Can Helm and Kustomize be used together?
    options:
      - Only if you first disable RBAC on the cluster so both tools can share a single service account
      - Only in Helm 2, where Tiller exposed a plugin hook that Kustomize could attach its overlays to
      - No — their rendering pipelines conflict, so a cluster must standardize on exactly one of them
      - Yes — e.g. `helm template` renders the chart and Kustomize post-renders patches (Helm supports
        `--post-renderer`)
    answer: 3
    explanation: |
      They compose. A common pattern is rendering a chart with `helm template` (or `--post-renderer`)
      and then applying Kustomize patches, or having Argo CD/Flux consume either. They solve
      overlapping but not identical problems.
    ref: concepts.md#helm-vs-kustomize
  - id: helm-package-management-050
    difficulty: beginner
    tags:
      - testing
      - lint
    question: |
      Which command runs static checks on a chart (Chart.yaml, values, obvious template
      errors) without needing a cluster?
    options:
      - helm lint
      - helm verify ./chart, which cryptographically checks the chart's provenance signature and structure
      - helm check ./chart, which statically validates the templates and values against the schema offline
      - helm test
    answer: 0
    explanation: |
      `helm lint ./chart` performs static/structural validation without a cluster. `helm test`
      instead runs the release's test hooks against a live deployment.
    ref: concepts.md#chart-testing-linting-and-validation
  - id: helm-package-management-051
    difficulty: intermediate
    tags:
      - testing
      - template
      - dry-run
    question: |
      What is the practical difference between `helm template` and `helm install --dry-run`?
    options:
      - '`--dry-run` skips templating entirely and only prints the values that would be merged for the release'
      - They are identical aliases that both render locally and never contact the cluster in any way
      - '`helm template` renders locally without contacting the API server; `--dry-run` additionally sends
        the manifests to the API server for schema/admission validation without persisting them'
      - '`helm template` actually applies the manifests to the cluster, whereas `--dry-run` does no rendering at all'
    answer: 2
    explanation: |
      `helm template` is a pure client-side render (so .Capabilities/lookup are limited).
      `--dry-run` renders and then submits to the API server for validation (schema, admission)
      without creating objects, catching cluster-side errors.
    ref: concepts.md#chart-testing-linting-and-validation
  - id: helm-package-management-052
    difficulty: intermediate
    tags:
      - testing
      - values-schema
    question: |
      What does a `values.schema.json` file in a chart do?
    options:
      - Enforces a JSON Schema on user-supplied values, failing fast on wrong types or missing required
        keys
      - Encrypts the user-supplied values at rest inside the release Secret using an AES key from the schema
      - Declares the chart's subchart dependencies and their version ranges as a JSON alternative to Chart.yaml
      - Documents the value fields purely for display in the repository UI, with no effect on installs
    answer: 0
    explanation: |
      values.schema.json validates the merged values against a JSON Schema at install/upgrade
      time, catching typos, wrong types, and missing required fields before rendering proceeds.
    ref: concepts.md#chart-testing-linting-and-validation
  - id: helm-package-management-053
    difficulty: advanced
    tags:
      - templating
      - checksum
      - rollout
    question: |
      You changed a ConfigMap's values and ran `helm upgrade`, but the pods did not restart to
      pick up the new config. What is the idiomatic Helm fix to force a rollout?
    options:
      - 'Add a pod-template annotation with a checksum of the ConfigMap (e.g. `checksum/config: {{ include
        (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}`) so the template changes and triggers
        a rollout'
      - Use `--set replicaCount` to a random number each time
      - Switch the storage backend to sql
      - Delete the Deployment manually every upgrade
    answer: 0
    explanation: |
      A Deployment only rolls when its pod template changes. Adding a checksum annotation of the
      ConfigMap/Secret to the pod template means any config change alters the template hash,
      forcing a new rollout so pods pick up the change.
    ref: concepts.md#common-follow-up-questions
  - id: helm-package-management-054
    difficulty: intermediate
    tags:
      - lifecycle
      - multiple-releases
    question: |
      You run `helm install web-blue ./chart` and `helm install web-green ./chart` in the same
      namespace. What happens?
    options:
      - You get two independent releases (web-blue and web-green), each with its own values and history
      - The second install silently overwrites the first because both derive from the same chart name
      - Helm detects the shared chart and merges both into a single release with a combined revision log
      - The second command errors because a chart can only be installed once per namespace
    answer: 0
    explanation: |
      A chart can be installed many times; each install is a separate release identified by its
      name. web-blue and web-green are independent, each with its own revision history — useful
      for blue/green patterns.
    ref: concepts.md#releases-revisions-and-the-release-lifecycle
  - id: helm-package-management-055
    difficulty: advanced
    tags:
      - templating
      - capabilities
    question: |
      A chart needs to emit an `autoscaling/v2` HPA only if the cluster supports that API.
      Which built-in helps decide this at render time?
    options:
      - .Chart.APIVersions.Contains "autoscaling/v2"
      - .Values.apiVersions.Includes "autoscaling/v2"
      - .Capabilities.APIVersions.Has "autoscaling/v2"
      - .Release.APIVersions.Has "autoscaling/v2"
    answer: 2
    explanation: |
      `.Capabilities.APIVersions.Has "group/version"` (and `.Capabilities.KubeVersion`) let a
      template branch on what the target cluster supports. Note these are limited/empty under a
      pure client-side `helm template`.
    ref: concepts.md#go-templating-and-values
  - id: helm-package-management-056
    difficulty: beginner
    tags:
      - chart-structure
      - notes
    question: |
      What is `templates/NOTES.txt`?
    options:
      - The file where Helm serializes each release revision's manifest history for rollback lookups
      - A required manifest listing the chart's maintainers, their emails, and support contact URLs
      - A mandatory changelog Helm parses and appends to Chart.yaml on every `helm package` run
      - A template whose rendered output is the usage message shown after a successful install/upgrade
    answer: 3
    explanation: |
      NOTES.txt is itself templated; its rendered output is printed to the user after a
      successful install or upgrade — typically how to reach the app (URLs, next steps).
    ref: concepts.md#chart-structure
