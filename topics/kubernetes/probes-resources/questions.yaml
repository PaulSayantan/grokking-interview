topic: "Health Probes & Resource Management"
domain: kubernetes
topic_slug: probes-resources
version: 1
questions:
- id: probes-resources-001
  difficulty: beginner
  tags: [liveness, readiness, probes]
  question: |
    In one sentence, what is the fundamental difference in what liveness and
    readiness probes DO on failure?
  options:
  - "Liveness restarts the container, readiness removes the Pod from Service endpoints"
  - "Liveness removes the Pod from Service endpoints, readiness restarts the container"
  - "Both restart the container, but liveness uses a shorter default interval than readiness"
  - "Both remove the Pod from endpoints, but readiness also logs an event"
  answer: 0
  explanation: |
    Liveness restarts (kills the container, restartPolicy applies); readiness re-routes
    (the endpoints controller removes the Pod IP from Service EndpointSlices, no restart).
    "Liveness restarts, readiness reroutes" is the one-line mnemonic.
  ref: "concepts.md#liveness-vs-readiness--the-classic-mistake"

- id: probes-resources-002
  difficulty: beginner
  tags: [readiness, endpoints, 503]
  question: |
    A Pod shows "1/1 Running" but users intermittently get 503 errors right after a
    deploy. The Deployment has a liveness probe but no readiness probe. What is the
    most likely cause?
  options:
  - "The liveness probe keeps failing and restarting the container, so requests land during one of those brief restart windows"
  - "The container image is corrupt, so only some replicas pulled a complete layer set and a fraction of requests hit broken Pods"
  - "With no readiness probe, the Pod joins Service endpoints as soon as the container runs, before the
    app can serve"
  - "The Service selector does not fully match the Pod labels, so only some Pods are ever added to the Service's EndpointSlices"
  answer: 2
  explanation: |
    "Running" means the container process is up, not that the app is ready. Without a
    readiness probe, the Pod is added to the Service's EndpointSlices immediately, so it
    receives traffic before it can serve — causing 503s during startup and every rollout.
  ref: "concepts.md#readiness-probe"

- id: probes-resources-003
  difficulty: beginner
  tags: [liveness, restart]
  question: |
    What does the kubelet do when a container's liveness probe fails failureThreshold
    consecutive times?
  options:
  - "Removes the Pod's IP from the Service endpoints so it stops receiving traffic"
  - "Deletes and recreates the entire Pod object on a freshly selected node"
  - "Kills the container, which is then restarted according to the Pod's restartPolicy"
  - "Marks the node as NotReady and drains its remaining Pods to healthy nodes"
  answer: 2
  explanation: |
    A failing liveness probe causes the kubelet to kill just that container; the Pod's
    restartPolicy (Always for Deployments) then restarts it in place, incrementing the
    RESTARTS count. The Pod object itself is not recreated.
  ref: "concepts.md#liveness-probe"

- id: probes-resources-004
  difficulty: beginner
  tags: [startup, slow-start]
  question: |
    What is the primary purpose of a startup probe?
  options:
  - "To load-balance incoming traffic evenly across all replicas while they are still starting up"
  - "To protect slow-starting containers by disabling liveness and readiness probes until the app has
    booted"
  - "To warm up the container image layer cache on the node so later restarts start faster"
  - "To verify the container image signature and digest against the registry before the process starts"
  answer: 1
  explanation: |
    While a startup probe runs, liveness and readiness probes are disabled. This lets a
    slow app have a generous startup budget without a short liveness timer killing it
    mid-boot. Once the startup probe succeeds once, the other probes take over.
  ref: "concepts.md#startup-probe"

- id: probes-resources-005
  difficulty: beginner
  tags: [requests, scheduling]
  question: |
    Which value does the kube-scheduler use to decide whether a Pod fits on a node?
  options:
  - "The container's resource limits"
  - "The container's actual measured CPU/memory usage"
  - "The QoS class of the Pod"
  - "The container's resource requests"
  answer: 3
  explanation: |
    Scheduling is based on requests, not limits and not live usage. The scheduler sums
    container requests and places the Pod only where allocatable minus already-requested
    capacity can fit it. A node can be "full" on requests while nearly idle in usage.
  ref: "concepts.md#requests-vs-limits"

- id: probes-resources-006
  difficulty: beginner
  tags: [memory, oomkilled, limits]
  question: |
    What happens when a container tries to exceed its MEMORY limit?
  options:
  - "It is OOMKilled (terminated) and restarted per restartPolicy"
  - "It is throttled and slowed down but keeps running"
  - "The container's memory request is automatically raised to match its current usage"
  - "The Pod is evicted from the node immediately by the kubelet under memory pressure"
  answer: 0
  explanation: |
    Memory is incompressible — you cannot slow memory usage. Exceeding the memory limit
    triggers the kernel OOM killer; the container status shows OOMKilled (exit 137) and it
    is restarted. Repeated OOMKills lead to CrashLoopBackOff.
  ref: "concepts.md#cpu-vs-memory-compressible-vs-incompressible"

- id: probes-resources-007
  difficulty: beginner
  tags: [cpu, throttling, limits]
  question: |
    What happens when a container tries to exceed its CPU limit?
  options:
  - "It is OOMKilled (exit 137) and then restarted per the Pod's restartPolicy"
  - "The Pod is evicted from the node under CPU pressure by the kubelet"
  - "The container is restarted in place the moment it exceeds the CPU limit"
  - "It is throttled by the kernel (CFS) — slowed but not killed"
  answer: 3
  explanation: |
    CPU is compressible. When a container hits its CPU limit, the Linux CFS bandwidth
    controller throttles it: the process runs slower (latency spikes) but is never killed.
    The symptom is high cpu_cfs_throttled periods, not a crash.
  ref: "concepts.md#cpu-vs-memory-compressible-vs-incompressible"

- id: probes-resources-008
  difficulty: beginner
  tags: [qos, best-effort]
  question: |
    A Pod is created with no CPU or memory requests or limits on any container. Which QoS
    class does it get, and what does that mean under node pressure?
  options:
  - "Guaranteed — evicted last"
  - "BestEffort — evicted first"
  - "Burstable — evicted in the middle"
  - "It is rejected at admission"
  answer: 1
  explanation: |
    No requests or limits at all → BestEffort, the lowest tier. Under node-pressure
    eviction, BestEffort Pods are the first to be evicted.
  ref: "concepts.md#qos-classes"

- id: probes-resources-009
  difficulty: intermediate
  tags: [qos, guaranteed]
  question: |
    What is required for a Pod to be classified as Guaranteed QoS?
  options:
  - "At least one container has a CPU or memory request set, even if no limits are given"
  - "The Pod is assigned a high PriorityClass value above the cluster default"
  - "Every container has CPU and memory requests and limits set, with request equal to limit for both"
  - "Every container has memory requests and limits set but leaves CPU unbounded"
  answer: 2
  explanation: |
    Guaranteed requires that, for every container, both CPU and memory have requests and
    limits set and request == limit for each. Such Pods are evicted last and are eligible
    for exclusive CPUs under the static CPU manager policy.
  ref: "concepts.md#qos-classes"

- id: probes-resources-010
  difficulty: intermediate
  tags: [liveness, dependencies, cascading]
  question: |
    Why is it dangerous to make a liveness probe check a downstream dependency such as a
    database?
  options:
  - "Liveness probes are not permitted to open outbound network connections to other services"
  - "Adding a dependency check would silently promote the Pod to Guaranteed QoS"
  - "The scheduler would refuse to place the Pod until the database dependency is reachable"
  - "A dependency blip fails liveness on every replica at once, restarting them all and amplifying the
    outage"
  answer: 3
  explanation: |
    If the DB blips, every replica's liveness probe fails simultaneously and every
    container restarts — a self-inflicted cascading outage plus CrashLoopBackOff storms.
    Liveness should test only local process health; dependency checks belong in readiness.
  ref: "concepts.md#liveness-probe"

- id: probes-resources-011
  difficulty: intermediate
  tags: [probe-mechanisms, httpget]
  question: |
    For an httpGet probe, which HTTP response status codes are considered a success?
  options:
  - "Codes greater than or equal to 200 and less than 400"
  - "Only a plain 200 OK response is treated as a success"
  - "Any status code strictly less than 500 counts as a success"
  - "Only codes in the 200 through 299 range count as a success"
  answer: 0
  explanation: |
    An httpGet probe succeeds when the response status is >= 200 and < 400. So 2xx and 3xx
    (including redirects) pass; 4xx and 5xx fail.
  ref: "concepts.md#probe-mechanisms-httpget-tcpsocket-exec-grpc"

- id: probes-resources-012
  difficulty: intermediate
  tags: [probe-timing, defaults]
  question: |
    What is the DEFAULT value of periodSeconds for a probe?
  options:
  - "1"
  - "10"
  - "5"
  - "30"
  answer: 1
  explanation: |
    periodSeconds defaults to 10 (minimum 1). Other defaults: initialDelaySeconds 0,
    timeoutSeconds 1, successThreshold 1, failureThreshold 3.
  ref: "concepts.md#probe-timing-parameters"

- id: probes-resources-013
  difficulty: intermediate
  tags: [probe-timing, timeout, jvm]
  question: |
    A healthy JVM service is being restarted occasionally after brief GC pauses. Its
    liveness probe uses the default timeoutSeconds and failureThreshold. What is the best
    first fix?
  options:
  - "Raise timeoutSeconds and/or failureThreshold so momentary pauses don't count as failures"
  - "Lower periodSeconds so probe failures are detected and acted on faster"
  - "Switch the probe from httpGet to an exec command that checks the JVM heap"
  - "Remove the liveness probe entirely so the container can never be restarted"
  answer: 0
  explanation: |
    The default timeoutSeconds is 1, which a GC pause can exceed; three misses restart the
    container. Raising timeoutSeconds and/or failureThreshold (and using a startup probe
    for slow boot) tolerates transient pauses without needless restarts.
  ref: "concepts.md#probe-timing-parameters"

- id: probes-resources-014
  difficulty: intermediate
  tags: [startup, crashloop, initialdelay]
  question: |
    A container CrashLoopBackOffs right after every deploy: it takes ~80s to boot but its
    liveness probe has initialDelaySeconds of 10. What is the cleanest fix?
  options:
  - "Set initialDelaySeconds to 300 on the liveness probe to cover the slow boot"
  - "Remove the liveness probe so nothing can ever restart the slow-booting container"
  - "Add a startup probe with a generous failureThreshold x periodSeconds budget"
  - "Switch to a tcpSocket liveness probe that only checks the listening port"
  answer: 2
  explanation: |
    A large liveness initialDelay also delays detecting real runtime hangs. A startup probe
    decouples the two: give a generous startup budget, then keep liveness tight. Until the
    startup probe succeeds, liveness/readiness are disabled, so the slow boot isn't killed.
  ref: "concepts.md#startup-probe"

- id: probes-resources-015
  difficulty: intermediate
  tags: [eviction, qos, node-pressure]
  question: |
    Under node memory pressure, in what order does the kubelet evict Pods?
  options:
  - "Guaranteed, then Burstable, then BestEffort"
  - "By PriorityClass only, ignoring QoS"
  - "Randomly among all Pods on the node"
  - "BestEffort, then Burstable, then Guaranteed"
  answer: 3
  explanation: |
    Node-pressure eviction goes BestEffort first, then Burstable (most-over-request first),
    then Guaranteed last. Pods exceeding their requests are the prime candidates; Guaranteed
    Pods (request==limit) never exceed requests, so they go last.
  ref: "concepts.md#eviction-under-node-pressure"

- id: probes-resources-016
  difficulty: intermediate
  tags: [pending, scheduling, requests]
  question: |
    A Pod stays Pending with a FailedScheduling event: "0/5 nodes are available:
    Insufficient cpu." The nodes' actual CPU usage is low. What is happening?
  options:
  - "The Pod's CPU limit exceeds the raw CPU capacity of every node in the cluster"
  - "No node has enough unreserved allocatable CPU to satisfy the Pod's CPU request"
  - "The liveness probe is failing and blocking the Pod before it can be scheduled"
  - "The container image is too large to fit on the available node disk space"
  answer: 1
  explanation: |
    Scheduling bins against requests and allocatable capacity, not live usage. If the sum
    of already-requested CPU leaves no node with room for this Pod's request, it stays
    Pending — even though real usage is low. Fix: lower requests, free capacity, or scale out.
  ref: "concepts.md#overcommit-and-node-allocatable"

- id: probes-resources-017
  difficulty: intermediate
  tags: [resourcequota, limitrange, admission]
  question: |
    A namespace has a ResourceQuota specifying requests.cpu and requests.memory. A developer
    applies a Deployment whose containers set no requests. What happens?
  options:
  - "The Pods are admitted with zero requests and allowed to consume unlimited resources"
  - "The namespace quota is automatically increased to accommodate the new Pods"
  - "The Pods are rejected unless requests are specified (or a LimitRange supplies defaults)"
  - "The Pods are admitted but silently marked BestEffort and exempted from the quota"
  answer: 2
  explanation: |
    When a ResourceQuota constrains requests.* or limits.*, every Pod in the namespace must
    specify those values or it is rejected at admission. The standard fix is to pair the
    quota with a LimitRange that injects default requests/limits.
  ref: "concepts.md#resourcequota"

- id: probes-resources-018
  difficulty: intermediate
  tags: [limitrange, defaults]
  question: |
    What does the defaultRequest field of a LimitRange do?
  options:
  - "Injects a request into containers that don't specify one"
  - "Sets the maximum request a container may ask for"
  - "Sets the total request budget for the namespace"
  - "Forces every Pod in the namespace into the Guaranteed QoS class"
  answer: 0
  explanation: |
    LimitRange.defaultRequest supplies a request to any container that omits one (and
    `default` supplies a limit). This prevents Pods from silently becoming BestEffort and
    is what makes a namespace with a request-enforcing ResourceQuota usable.
  ref: "concepts.md#limitrange"

- id: probes-resources-019
  difficulty: intermediate
  tags: [probe-mechanisms, tcpsocket]
  question: |
    What does a tcpSocket probe actually verify?
  options:
  - "That an HTTP endpoint returns a 200 OK status"
  - "That a command inside the container exits 0"
  - "That the gRPC health service reports SERVING"
  - "That a TCP connection to the port can be opened"
  answer: 3
  explanation: |
    A tcpSocket probe succeeds if the kubelet can open a TCP connection to the port. It
    only proves the port is accepting connections, not that the app's logic works — weaker
    than an HTTP or gRPC health check.
  ref: "concepts.md#probe-mechanisms-httpget-tcpsocket-exec-grpc"

- id: probes-resources-020
  difficulty: intermediate
  tags: [requests, limits, defaulting]
  question: |
    A container specifies only a memory limit of 512Mi and no memory request. What memory
    request does Kubernetes assign?
  options:
  - "0 (an omitted request is treated as zero)"
  - "512Mi (request defaults to equal the limit)"
  - "256Mi (defaults to half the stated limit)"
  - "The node's total allocatable memory capacity"
  answer: 1
  explanation: |
    If you set a limit but no request, Kubernetes defaults the request to equal the limit.
    So this container is scheduled as if it requests 512Mi of memory.
  ref: "concepts.md#requests-vs-limits"

- id: probes-resources-021
  difficulty: advanced
  tags: [oomkilled, eviction, difference]
  question: |
    What is the key difference between an OOMKilled container (from a limit) and a
    node-pressure eviction?
  options:
  - "OOMKilled deletes the whole Pod object; eviction only restarts a single container in place"
  - "They are the same underlying kernel event exposed under two different status names"
  - "OOMKilled restarts just the offending container in place; eviction terminates whole Pods by QoS order"
  - "OOMKilled only happens to BestEffort Pods, since Guaranteed Pods are exempt from the OOM killer"
  answer: 2
  explanation: |
    An OOMKilled from a memory limit is per-container: the kernel kills that container
    (exit 137) and it restarts in place. Node-pressure eviction is the kubelet reclaiming a
    node under pressure — it terminates whole Pods, ranked by QoS/over-request, and the
    controller may reschedule them elsewhere.
  ref: "concepts.md#eviction-under-node-pressure"

- id: probes-resources-022
  difficulty: advanced
  tags: [qos, priorityclass, preemption]
  question: |
    Which statement about QoS class and PriorityClass is correct?
  options:
  - "QoS class alone determines which Pods the scheduler picks to preempt for a pending Pod"
  - "Guaranteed QoS Pods are exempt from preemption regardless of their PriorityClass value"
  - "QoS and PriorityClass are two different names for the exact same underlying Pod value"
  - "PriorityClass drives preemption; QoS drives node-pressure eviction — they are different mechanisms"
  answer: 3
  explanation: |
    Preemption (evicting Pods to fit a higher-priority pending Pod) is driven by
    PriorityClass and ignores QoS. QoS governs node-pressure eviction. Conflating the two
    is a common senior-level trap.
  ref: "concepts.md#qos-classes"

- id: probes-resources-023
  difficulty: advanced
  tags: [allocatable, capacity, reserved]
  question: |
    Why can't a Pod request 100% of a node's raw memory capacity?
  options:
  - "The scheduler bins against allocatable = capacity minus kube/system reserved and the eviction threshold"
  - "The scheduler always holds back a fixed 50% of every node's memory as a safety buffer"
  - "Container memory limits are hard-capped at 90% of node capacity by an admission default"
  - "Memory requests are silently rounded down to the nearest whole Gi before scheduling"
  answer: 0
  explanation: |
    The scheduler uses a node's allocatable resources, which is capacity minus reservations
    for the kubelet/system (--kube-reserved, --system-reserved) minus the eviction hard
    threshold. So some capacity is always held back from schedulable requests.
  ref: "concepts.md#overcommit-and-node-allocatable"

- id: probes-resources-024
  difficulty: advanced
  tags: [probe-mechanisms, exec, overhead]
  question: |
    What is a real downside of using frequent exec probes on a busy node?
  options:
  - "exec probes can only report success and have no mechanism to signal a failure result"
  - "Each probe forks a process inside the container every period, adding CPU overhead at scale"
  - "exec probes run on the host and bypass the container's mount and network namespace"
  - "exec probes require the Pod to be classified as Guaranteed QoS before they will run"
  answer: 1
  explanation: |
    An exec probe runs a command inside the container each period. With many Pods and short
    periods, forking a process repeatedly adds measurable CPU overhead. Prefer httpGet or
    grpc where possible.
  ref: "concepts.md#probe-mechanisms-httpget-tcpsocket-exec-grpc"

- id: probes-resources-025
  difficulty: advanced
  tags: [probes, networking, kubelet]
  question: |
    Do HTTP liveness/readiness probes travel through the Service or Ingress?
  options:
  - "No, the kubelet probes the Pod IP directly from the node, bypassing Service/Ingress"
  - "Yes, every probe is routed through the target Service's ClusterIP and kube-proxy"
  - "Yes, but only readiness probes traverse the Service while liveness hits the Pod IP"
  - "Only when the probe is configured with the HTTPS scheme rather than plain HTTP"
  answer: 0
  explanation: |
    The kubelet issues probes from the node directly against the Pod IP and container port,
    bypassing Services, Ingress, and any load balancer. That is why a readiness probe can
    pass while external traffic still can't reach the Pod for other reasons.
  ref: "concepts.md#probe-mechanisms-httpget-tcpsocket-exec-grpc"

- id: probes-resources-026
  difficulty: advanced
  tags: [success-threshold, liveness, readiness]
  question: |
    Which statement about successThreshold is correct?
  options:
  - "It must be set greater than 1 for every probe type or the Pod is rejected"
  - "It applies only to exec probes and is ignored by httpGet and tcpSocket probes"
  - "It sets how many consecutive failures must occur before a container is restarted"
  - "It must be 1 for liveness and startup probes, but may be greater than 1 for readiness"
  answer: 3
  explanation: |
    successThreshold (consecutive successes to be considered healthy again) must be 1 for
    liveness and startup probes. Readiness may set it > 1 to require several consecutive
    successes before re-adding the Pod to endpoints, reducing flapping.
  ref: "concepts.md#probe-timing-parameters"

- id: probes-resources-027
  difficulty: advanced
  tags: [rolling-update, readiness, availability]
  question: |
    How does a readiness probe affect a Deployment's rolling update?
  options:
  - "It has no effect on rollouts, which count only container start and image pull"
  - "It makes the rollout skip all health checks and cut over instantly to new Pods"
  - "A new Pod isn't counted as available until its readiness probe passes, so the rollout won't scale
    down old Pods prematurely"
  - "It forces the rollout's maxUnavailable field to 0 for the duration of the update"
  answer: 2
  explanation: |
    A rolling update waits for new Pods to become available, and availability requires the
    readiness probe to pass (plus minReadySeconds). Without a readiness probe, Pods are
    "available" as soon as they run, so the rollout can route traffic to not-yet-ready Pods.
  ref: "concepts.md#readiness-probe"

- id: probes-resources-028
  difficulty: advanced
  tags: [grpc, probe-mechanisms, version]
  question: |
    Which is true about gRPC probes in modern Kubernetes?
  options:
  - "They are still gated behind the alpha GRPCContainerProbe feature flag, off by default"
  - "They reached GA (stable) in v1.27 and require the app to implement the gRPC Health Checking Protocol"
  - "They require a sidecar container to translate the gRPC health call into HTTP"
  - "They only work for readiness checks and cannot be configured as liveness probes"
  answer: 1
  explanation: |
    Native gRPC probes went GA in Kubernetes v1.27 (GRPCContainerProbe on by default). The
    app must implement the standard gRPC health service; the probe's port field is required
    and service is optional.
  ref: "concepts.md#probe-mechanisms-httpget-tcpsocket-exec-grpc"

- id: probes-resources-029
  difficulty: advanced
  tags: [probe-timing, calculation]
  question: |
    A liveness probe has initialDelaySeconds 15, periodSeconds 20, failureThreshold 3.
    Roughly how long after container start, in the worst case, before a container that is
    hung from the beginning is killed?
  options:
  - "About 20 seconds (just one periodSeconds interval)"
  - "About 35 seconds (initialDelaySeconds plus one period)"
  - "About 75 seconds (15 + 3 x 20)"
  - "About 300 seconds (the maximum back-off cap applies)"
  answer: 2
  explanation: |
    First probe at ~15s, then every 20s; three consecutive failures trigger the kill. Worst
    case is roughly initialDelaySeconds + failureThreshold x periodSeconds = 15 + 60 = 75s.
  ref: "concepts.md#probe-timing-parameters"

- id: probes-resources-030
  difficulty: intermediate
  tags: [cpu-units, millicores]
  question: |
    What does a CPU request of "500m" mean?
  options:
  - "Half of one CPU core (500 millicores)"
  - "500 megabytes of memory reserved for the container"
  - "500 milliseconds of absolute CPU time granted per second"
  - "500 full CPU cores dedicated to the container"
  answer: 0
  explanation: |
    CPU is measured in cores/millicores: 1 = one core, 1000m = one core, so 500m = half a
    core. It's a proportional share, not a memory value.
  ref: "concepts.md#requests-vs-limits"

- id: probes-resources-031
  difficulty: intermediate
  tags: [qos, burstable]
  question: |
    A Pod has one container with a memory request of 128Mi and no limits, and no CPU
    request or limit. What QoS class is it?
  options:
  - "Guaranteed, because a memory request is set on the container"
  - "BestEffort, because CPU is left completely unspecified"
  - "Invalid — a Pod with partial requests is rejected at admission"
  - "Burstable"
  answer: 3
  explanation: |
    It doesn't meet Guaranteed (needs both CPU and memory requests==limits on every
    container), but at least one container has some request → Burstable. Burstable Pods are
    evicted in the middle tier.
  ref: "concepts.md#qos-classes"

- id: probes-resources-032
  difficulty: advanced
  tags: [resourcequota, object-count]
  question: |
    Besides CPU/memory totals, what else can a ResourceQuota limit?
  options:
  - "Only CPU and memory totals — no other resource types are supported"
  - "Object counts such as pods, services, configmaps, and count/<resource>"
  - "The container image registry that Pods in the namespace may pull from"
  - "The probe interval and timeout values used by Pods across the namespace"
  answer: 1
  explanation: |
    ResourceQuota can cap aggregate compute (requests/limits) AND object counts (pods,
    services, configmaps, count/deployments.apps, etc.), and can scope by PriorityClass.
    Exceeding quota rejects new objects with a 403.
  ref: "concepts.md#resourcequota"

- id: probes-resources-033
  difficulty: advanced
  tags: [overcommit, cpu, memory]
  question: |
    Why is overcommitting CPU limits generally safer than overcommitting memory limits?
  options:
  - "CPU limits are ignored by the kernel and never actually enforced at runtime"
  - "Memory is always physically reserved 1:1 with the request at schedule time"
  - "CPU is compressible (over-usage throttles), while memory over-usage causes OOM kills and eviction"
  - "CPU requests are not counted by the scheduler when placing Pods on nodes"
  answer: 2
  explanation: |
    Because CPU is compressible, contention just throttles Pods — no crash. Memory is
    incompressible, so if many Pods peak past their memory limits/requests the node OOMs and
    the kubelet must evict. Hence memory overcommit is the riskier bet.
  ref: "concepts.md#overcommit-and-node-allocatable"

- id: probes-resources-034
  difficulty: intermediate
  tags: [liveness, readiness, endpoint-design]
  question: |
    Why should liveness and readiness probes generally use DIFFERENT endpoints?
  options:
  - "Kubernetes rejects a Pod spec that points two probes at the same endpoint path"
  - "Serving probes from different endpoints lets the kubelet run them in parallel and faster"
  - "Readiness endpoints must return a 500 status code in order to be counted as passing"
  - "If they share an endpoint, shedding traffic (readiness fail) also fails liveness and needlessly restarts
    the container"
  answer: 3
  explanation: |
    Readiness should be able to fail (shed traffic) without the container being killed. If
    liveness uses the same endpoint, a readiness-driven shed also trips liveness and
    restarts the container, losing warm state. Keep liveness local-only and separate.
  ref: "concepts.md#liveness-vs-readiness--the-classic-mistake"

- id: probes-resources-035
  difficulty: advanced
  tags: [termination-grace-period, probes]
  question: |
    What does a probe-level terminationGracePeriodSeconds do?
  options:
  - "Overrides the Pod-level grace period for the termination that this probe triggers"
  - "Sets how long the probe waits before its first check"
  - "Delays adding the Pod to Service endpoints"
  - "Sets the interval between probes"
  answer: 0
  explanation: |
    A probe can specify its own terminationGracePeriodSeconds that overrides the Pod-level
    value when that probe triggers termination. Example: a long Pod grace period for normal
    shutdown, but a short override so a wedged container detected by liveness dies quickly.
  ref: "concepts.md#probe-timing-parameters"

- id: probes-resources-036
  difficulty: beginner
  tags: [crashloopbackoff, restart]
  question: |
    What does the CrashLoopBackOff status indicate?
  options:
  - "The Pod is still being scheduled and waiting for a node assignment"
  - "A container keeps failing/restarting, and the kubelet is applying an increasing back-off delay between
    restarts"
  - "The node has run out of disk and cannot pull the container image"
  - "The readiness probe removed the Pod from Service endpoints for traffic"
  answer: 1
  explanation: |
    CrashLoopBackOff means a container repeatedly starts and dies (crash, failed liveness,
    or repeated OOMKill). The kubelet backs off with an exponential delay (capped at 5
    minutes) between restart attempts.
  ref: "concepts.md#liveness-probe"

- id: probes-resources-037
  difficulty: intermediate
  tags: [readiness, flapping, success-threshold]
  question: |
    A readiness probe is flapping — the Pod is repeatedly added to and removed from Service
    endpoints. Which setting best reduces the flapping when re-adding the Pod?
  options:
  - "Increase successThreshold above 1 to require several consecutive passes before re-adding"
  - "Lower failureThreshold to 1 so the Pod is pulled from endpoints after a single failed check"
  - "Set initialDelaySeconds to 0 so the probe starts checking the instant the container launches"
  - "Switch to a liveness probe so a failing check restarts the container instead of shedding traffic"
  answer: 0
  explanation: |
    Readiness allows successThreshold > 1. Requiring several consecutive successes before
    re-adding the Pod to endpoints dampens flapping from a marginally healthy app.
  ref: "concepts.md#probe-timing-parameters"

- id: probes-resources-038
  difficulty: advanced
  tags: [oom-score-adj, kernel, qos]
  question: |
    How does QoS influence the Linux kernel's own OOM killer on a node?
  options:
  - "QoS has no effect at the kernel level; the OOM killer picks purely by each process's resident set size"
  - "Guaranteed Pods are exempt from the kernel OOM killer entirely, so their containers are never reaped on memory pressure"
  - "The kubelet sets oom_score_adj so BestEffort/over-request containers are more likely to be killed
    first in a kernel OOM"
  - "The kernel evicts whole nodes rather than containers, cordoning the machine until memory frees up"
  answer: 2
  explanation: |
    The kubelet applies oom_score_adj per container based on QoS: BestEffort and
    over-request containers get a higher score (more killable), Guaranteed a lower one. So
    even a raw kernel OOM event favors killing lower-QoS containers first.
  ref: "concepts.md#eviction-under-node-pressure"

- id: probes-resources-039
  difficulty: intermediate
  tags: [limitrange, max, ratio]
  question: |
    Which of these is a job of a LimitRange (not a ResourceQuota)?
  options:
  - "Cap the total memory requested across all Pods in the namespace as a single aggregate ceiling"
  - "Limit the number of Services that may be created within the namespace before admission rejects more"
  - "Restrict which nodes Pods schedule onto by injecting nodeSelector and affinity terms at admission"
  - "Enforce per-container min/max values and inject default requests/limits"
  answer: 3
  explanation: |
    LimitRange operates per container/Pod/PVC: it sets defaults (default/defaultRequest),
    enforces min/max bounds, and can cap maxLimitRequestRatio. Aggregate namespace totals
    and object counts are ResourceQuota's job.
  ref: "concepts.md#limitrange"

- id: probes-resources-040
  difficulty: intermediate
  tags: [readiness, dependencies, traffic-shedding]
  question: |
    A service needs a cache to serve requests. The cache is briefly unavailable. Which probe
    behavior is the correct design so the Pod stops receiving traffic but is NOT restarted?
  options:
  - "Fail the liveness probe while the cache is down"
  - "Fail the readiness probe while the cache is down"
  - "Fail the startup probe while the cache is down"
  - "Set failureThreshold to 0 on liveness"
  answer: 1
  explanation: |
    Failing readiness pulls the Pod from Service endpoints (sheds traffic) without a
    restart, and it re-joins when the cache returns. Failing liveness would restart the
    container, which is wrong for a transient, recoverable dependency outage.
  ref: "concepts.md#readiness-probe"

- id: probes-resources-041
  difficulty: beginner
  tags: [why-probes, self-healing]
  question: |
    Why are health probes needed when Kubernetes already knows if a container's process
    exited?
  options:
  - "A running process is a weak proxy for health — an app can be deadlocked or not ready while the PID
    is alive"
  - "Probes exist only to emit health events into the cluster log stream for later auditing, not to drive any action"
  - "Probes fully replace the need for a restartPolicy, taking over container restart decisions from the kubelet"
  - "The kubelet has no way to notice a process exiting on its own and depends entirely on probes to detect it"
  answer: 0
  explanation: |
    "Process running" doesn't mean "app healthy." A deadlocked or still-warming app has a
    live PID but is useless or harmful if it gets traffic. Probes let the kubelet ask the
    app itself so it can restart, reroute, or wait.
  ref: "concepts.md#why-health-probes-exist"

- id: probes-resources-042
  difficulty: advanced
  tags: [manifest, qos, scenario]
  question: |
    Given a container with requests {cpu: 500m, memory: 256Mi} and limits {cpu: 500m,
    memory: 512Mi}, what QoS class results and why?
  options:
  - "BestEffort — because the CPU and memory values differ, the Pod is treated as having no requests at all"
  - "Guaranteed — requests and limits are both set on the container, which is all the class requires"
  - "Burstable — memory request (256Mi) does not equal its limit (512Mi)"
  - "Guaranteed — the CPU request equals its limit, and CPU alone is what decides the Guaranteed class"
  answer: 2
  explanation: |
    Guaranteed requires request == limit for BOTH cpu and memory on every container. Here
    CPU matches (500m==500m) but memory does not (256Mi != 512Mi), so the Pod is Burstable.
  ref: "concepts.md#qos-classes"

- id: probes-resources-043
  difficulty: intermediate
  tags: [cpu-limits, throttling, latency]
  question: |
    A latency-sensitive service shows periodic p99 spikes but never crashes, and metrics
    show high CPU CFS throttling. What is the most likely cause?
  options:
  - "The memory limit is too low, so the container is repeatedly OOMKilled and restarted mid-request"
  - "The readiness probe is failing intermittently and pulling the Pod out of Service endpoints during spikes"
  - "The node is out of disk, forcing the kubelet to throttle the Pod's writes and stall responses"
  - "The CPU limit is too low, so the kernel throttles the container during bursts"
  answer: 3
  explanation: |
    No crash + high CFS throttling = the container is hitting its CPU limit and being
    throttled during bursts, adding latency. Options: raise or remove the CPU limit (while
    keeping a CPU request for fair scheduling).
  ref: "concepts.md#cpu-vs-memory-compressible-vs-incompressible"

- id: probes-resources-044
  difficulty: advanced
  tags: [scheduling, requests, overcommit, scenario]
  question: |
    A node reports actual CPU usage of 20% yet the scheduler places no new Pods on it,
    leaving them Pending. What is the explanation?
  options:
  - "The node is cordoned automatically once its measured CPU usage crosses a 20% low-utilization floor"
  - "Existing Pods' CPU REQUESTS already sum to the node's allocatable, even though usage is low"
  - "The scheduler will only place Pods on nodes whose live CPU usage is already above 50% for bin-packing"
  - "The Pods' liveness probes are failing, and a failing liveness check blocks scheduling onto any node"
  answer: 1
  explanation: |
    Scheduling is request-based. If placed Pods' requests already consume the node's
    allocatable CPU, the scheduler treats it as full regardless of the low actual usage. This
    is the classic overcommit/requests-vs-usage gap.
  ref: "concepts.md#overcommit-and-node-allocatable"

- id: probes-resources-045
  difficulty: beginner
  tags: [readiness, no-restart]
  question: |
    When a readiness probe fails, does the container get restarted?
  options:
  - "Yes, the container is restarted immediately on the first failed readiness check"
  - "Yes, but only after failureThreshold consecutive readiness failures have accumulated"
  - "No — only the Pod's IP is removed from Service endpoints; the container keeps running"
  - "Only if there is no liveness probe defined, in which case readiness takes over restart duty"
  answer: 2
  explanation: |
    Readiness never restarts. On failure the endpoints controller removes the Pod IP from
    matching Service EndpointSlices so it stops receiving traffic; when readiness passes
    again the Pod rejoins. Restarting is the liveness/startup behavior.
  ref: "concepts.md#readiness-probe"

- id: probes-resources-046
  difficulty: advanced
  tags: [qos, immutable, resize]
  question: |
    Which statement about QoS class mutability is correct?
  options:
  - "QoS can be changed at runtime by editing the Pod's qosClass field with kubectl edit"
  - "QoS changes automatically as a container's live CPU and memory usage rises and falls"
  - "QoS is recalculated by the kubelet on every successful probe and updated on the Pod status"
  - "QoS is set at Pod creation and is immutable; an in-place resize that would change the class is rejected"
  answer: 3
  explanation: |
    QoS is derived from requests/limits at Pod creation and is immutable for the Pod's life.
    An in-place Pod resize that would change the QoS class is rejected by admission.
  ref: "concepts.md#qos-classes"

- id: probes-resources-047
  difficulty: intermediate
  tags: [why-probes, readiness, warmup]
  question: |
    An app needs 30 seconds to warm a cache before it can serve, then stays healthy. Which
    probe should gate whether it receives traffic during that warm-up?
  options:
  - "Readiness probe"
  - "Liveness probe, which restarts the container until the cache finishes warming up"
  - "A CPU limit sized so the container cannot serve traffic until the cache is fully loaded"
  - "A ResourceQuota that withholds the Pod from endpoints for the first 30 seconds of its life"
  answer: 0
  explanation: |
    Readiness governs endpoint membership: it should fail during warm-up so no traffic is
    sent, then pass once the cache is ready. (A startup probe could give the warm-up budget,
    but readiness is what controls traffic.)
  ref: "concepts.md#why-health-probes-exist"

- id: probes-resources-048
  difficulty: advanced
  tags: [eviction, requests, protection]
  question: |
    Two Burstable Pods are on a node under memory pressure. Pod A is using memory below its
    request; Pod B is using well above its request. Which is more likely to be evicted?
  options:
  - "Pod A, because using less memory ranks it as the cheapest Pod for the kubelet to reclaim first"
  - "Pod B, because Pods exceeding their requests are ranked as eviction candidates first"
  - "Neither — Burstable Pods are exempt from node-pressure eviction and only BestEffort ones are removed"
  - "Whichever was scheduled first, since the kubelet evicts in oldest-Pod-first order under pressure"
  answer: 1
  explanation: |
    Node-pressure eviction targets Pods exceeding their requests, ranked by how far over
    they are. Pod B is well over its request and is the prime candidate; Pod A, living within
    its request, is treated closer to Guaranteed for ranking. Well-set requests protect you.
  ref: "concepts.md#eviction-under-node-pressure"
