topic: Records, Sealed Classes and Modern Data Modeling
domain: java-jvm
topic_slug: records-sealed-classes
version: 1
questions:
- id: records-sealed-classes-001
  difficulty: beginner
  tags:
  - records
  - versions
  - history
  question: |
    In which JDK release did records become a final, standard (non-preview)
    language feature?
  options:
  - JDK 14
  - JDK 15
  - JDK 16
  - JDK 17
  answer: 2
  explanation: |
    Records were previewed in JDK 14 (JEP 359) and again in JDK 15 (JEP 384),
    then finalized as a standard feature in JDK 16 (JEP 395). JDK 17 is the LTS
    that finalized sealed classes, not records.
  ref: concepts.md#records-basics
- id: records-sealed-classes-002
  difficulty: beginner
  tags:
  - sealed
  - versions
  - history
  question: |
    In which JDK release were sealed classes finalized as a standard feature?
  options:
  - JDK 15
  - JDK 16
  - JDK 17
  - JDK 21
  answer: 2
  explanation: |
    Sealed classes were previewed in JDK 15 (JEP 360) and JDK 16 (JEP 397), and
    finalized in JDK 17 (JEP 409). JDK 21 finalized pattern matching for switch
    and record patterns, not sealed classes themselves.
  ref: concepts.md#sealed-classes-and-interfaces
- id: records-sealed-classes-003
  difficulty: beginner
  tags:
  - records
  - accessors
  question: |
    Given `public record Point(int x, int y) {}`, what is the name of the
    generated accessor for the first component?
  options:
  - x()
  - getX()
  - getx()
  - readX()
  answer: 0
  explanation: |
    Record accessors are named exactly after the component, so it is `x()`.
    Records deliberately do NOT follow the JavaBeans get/set convention, so
    `getX()` is wrong.
  ref: concepts.md#records-basics
- id: records-sealed-classes-004
  difficulty: beginner
  tags:
  - records
  - generated-members
  question: |
    Which of these members does the compiler NOT automatically generate for a
    record?
  options:
  - equals(Object) based on all components
  - hashCode() based on all components
  - A public setter for each component
  - toString() listing all components
  answer: 2
  explanation: |
    Records generate equals, hashCode, toString, an all-args canonical
    constructor, and one accessor per component. They are immutable, so no
    setters are ever generated — record component fields are private final.
  ref: concepts.md#record-auto-generated-members
- id: records-sealed-classes-005
  difficulty: beginner
  tags:
  - records
  - immutability
  question: |
    What is the mutability of a record's component fields?
  options:
  - private and final
  - public and mutable
  - protected and mutable
  - package-private and volatile
  answer: 0
  explanation: |
    Each record component becomes a private final instance field. This is why
    records are immutable (shallowly) and cannot have setters.
  ref: concepts.md#records-basics
- id: records-sealed-classes-006
  difficulty: beginner
  tags:
  - records
  - inheritance
  question: |
    Which statement about record inheritance is correct?
  options:
  - A record is implicitly final, cannot extend a class, but can implement interfaces
  - A record can extend one other class but cannot implement interfaces
  - A record can be declared abstract and extended by other records
  - A record can extend java.lang.Object explicitly and any other class
  answer: 0
  explanation: |
    Records are implicitly final and already extend java.lang.Record, so they
    cannot extend any other class and cannot be abstract. They CAN implement any
    number of interfaces.
  ref: concepts.md#records-restrictions-and-constraints
- id: records-sealed-classes-007
  difficulty: beginner
  tags:
  - sealed
  - permits
  question: |
    What is the purpose of the `permits` clause in a sealed class declaration?
  options:
  - It lists exactly which classes/interfaces are allowed to directly extend or implement the sealed type
  - It grants runtime security permissions to subclasses
  - It marks which methods subclasses are permitted to override
  - It declares which packages may import the class
  answer: 0
  explanation: |
    `permits` enumerates the complete, closed set of direct subtypes allowed for
    a sealed class or interface. It has nothing to do with SecurityManager
    permissions, method overriding, or imports.
  ref: concepts.md#sealed-classes-and-interfaces
- id: records-sealed-classes-008
  difficulty: beginner
  tags:
  - sealed
  - modifiers
  question: |
    A class that is named in a sealed type's `permits` clause must be declared
    with one of exactly which set of modifiers?
  options:
  - final, sealed, or non-sealed
  - public, private, or protected
  - static, abstract, or final
  - open, closed, or partial
  answer: 0
  explanation: |
    Every permitted direct subtype must itself be `final` (no further
    subclasses), `sealed` (continue the closed hierarchy with its own permits),
    or `non-sealed` (deliberately re-open that branch). The others are not the
    correct triad.
  ref: concepts.md#sealed-classes-and-interfaces
- id: records-sealed-classes-009
  difficulty: beginner
  tags:
  - records
  - keyword
  question: |
    Which keyword is used to declare a record?
  options:
  - record
  - data
  - struct
  - value
  answer: 0
  explanation: |
    The `record` contextual keyword declares a record class. `struct`, `data`,
    and `value` are not Java record keywords (value classes are a separate
    Project Valhalla effort, still not standard).
  ref: concepts.md#records-basics
- id: records-sealed-classes-010
  difficulty: beginner
  tags:
  - records
  - components
  question: |
    In record terminology, the values declared in the record header (e.g.
    `int x, int y`) are called its:
  options:
  - components
  - attributes
  - properties
  - members
  answer: 0
  explanation: |
    The header entries are the record's "components." Each component yields a
    field and an accessor. The other terms are used loosely elsewhere but are not
    the JLS term for records.
  ref: concepts.md#records-basics
- id: records-sealed-classes-011
  difficulty: beginner
  tags:
  - sealed
  - versions
  question: |
    Sealed classes enable exhaustive pattern-matching switches. In which JDK was
    pattern matching for `switch` itself finalized (made non-preview)?
  options:
  - JDK 17
  - JDK 19
  - JDK 20
  - JDK 21
  answer: 3
  explanation: |
    Pattern matching for switch was preview from JDK 17 (JEP 406) through JDK 20
    and finalized in JDK 21 (JEP 441). Sealed classes themselves were final in
    JDK 17, but the pattern switch that best exploits them arrived later.
  ref: concepts.md#sealed-types-and-exhaustiveness
- id: records-sealed-classes-012
  difficulty: beginner
  tags:
  - records
  - serialization
  question: |
    Can a record implement `java.io.Serializable`?
  options:
  - No, records can never be serialized
  - Only if it declares a writeObject method
  - Yes, and it can be serialized/deserialized like other objects
  - Only if it extends a Serializable superclass
  answer: 2
  explanation: |
    Records may implement Serializable and be serialized since JDK 16. Records
    cannot extend a superclass at all, and they do not require a custom
    writeObject.
  ref: concepts.md#serialization-of-records
- id: records-sealed-classes-013
  difficulty: intermediate
  tags:
  - records
  - compact-constructor
  question: |
    What is distinctive about a record's compact constructor compared to the
    explicit canonical constructor?
  options:
  - It has no parameter list and does not (and must not) explicitly assign this.field for each component
  - It must list all parameters but is not allowed to contain any statements
  - It runs after the fields have already been made immutable by a separate pass
  - It can only be used for records with a single component
  answer: 0
  explanation: |
    A compact constructor omits the parameter list entirely; you validate or
    normalize the parameter variables, and the compiler appends the field
    assignments automatically. You must NOT write `this.x = x` yourself in a
    compact constructor.
  ref: concepts.md#canonical-compact-and-custom-constructors
- id: records-sealed-classes-014
  difficulty: intermediate
  tags:
  - records
  - compact-constructor
  - code-analysis
  question: |
    What does this print?

    ```java
    record R(int hi) {
        R {
            hi = Math.min(hi, 10);
        }
    }
    System.out.println(new R(50).hi());
    ```
  options:
  - '50'
  - '0'
  - '10'
  - It does not compile
  answer: 2
  explanation: |
    In a compact constructor you reassign the PARAMETER (`hi`), and the compiler
    then stores the (possibly modified) parameter into the field. So `hi` is
    clamped to 10 before assignment, and `hi()` returns 10.
  ref: concepts.md#canonical-compact-and-custom-constructors
- id: records-sealed-classes-015
  difficulty: intermediate
  tags:
  - records
  - custom-constructor
  question: |
    A non-canonical (custom) record constructor must do what on its first line?
  options:
  - Call super(...)
  - Assign all component fields directly
  - Delegate to another constructor via this(...)
  - Throw if validation fails
  answer: 2
  explanation: |
    Any non-canonical record constructor must delegate to another constructor via
    `this(...)` as its first statement, ultimately reaching the canonical
    constructor. This guarantees the canonical constructor's validation always
    runs. Calling super(...) or assigning fields directly is not allowed.
  ref: concepts.md#canonical-compact-and-custom-constructors
- id: records-sealed-classes-016
  difficulty: intermediate
  tags:
  - records
  - restrictions
  - code-analysis
  question: |
    Which line causes a compile error?

    ```java
    record Bad(int x) {
        static int count = 0;        // line A
        int cachedHash;              // line B
        int doubled() { return x*2; }// line C
    }
    ```
  options:
  - line A
  - line C
  - line B
  - None — it compiles
  answer: 2
  explanation: |
    Records cannot declare additional INSTANCE fields; all instance state must
    come from the components. `cachedHash` (line B) is an instance field and is a
    compile error. Static fields (A) and instance methods (C) are fine.
  ref: concepts.md#records-restrictions-and-constraints
- id: records-sealed-classes-017
  difficulty: intermediate
  tags:
  - records
  - equals
  - code-analysis
  question: |
    What does this print?

    ```java
    record D(double v) {}
    System.out.println(new D(Double.NaN).equals(new D(Double.NaN)));
    ```
  options:
  - 'true'
  - 'false'
  - It throws at runtime
  - It does not compile
  answer: 0
  explanation: |
    Record equals for double/float components uses Double.compare-style semantics
    (like Double.valueOf(x).equals(...)), NOT the == operator. Under those
    semantics NaN equals NaN, so this prints true — the opposite of what `==`
    would give.
  ref: concepts.md#record-auto-generated-members
- id: records-sealed-classes-018
  difficulty: intermediate
  tags:
  - records
  - equals
  - code-analysis
  question: |
    What does this print?

    ```java
    record D(double v) {}
    System.out.println(new D(0.0).equals(new D(-0.0)));
    ```
  options:
  - 'true'
  - It throws NaNException
  - 'false'
  - It does not compile
  answer: 2
  explanation: |
    Under the Double.compare-style semantics used by record equals, +0.0 and -0.0
    are considered DIFFERENT (distinct bit patterns), so this prints false. Note
    the `==` operator would consider them equal — records intentionally differ.
  ref: concepts.md#record-auto-generated-members
- id: records-sealed-classes-019
  difficulty: intermediate
  tags:
  - sealed
  - permits
  - same-file
  question: |
    Under what condition may you omit the `permits` clause on a sealed type?
  options:
  - When there is exactly one permitted subtype
  - When the sealed type is an interface rather than a class
  - When all permitted subtypes are declared in the same source file (compilation unit)
  - You can never omit permits; it is always required
  answer: 2
  explanation: |
    If every permitted direct subtype is declared in the same compilation unit as
    the sealed type, the compiler infers the permits list and you may omit it.
    Otherwise you must list them explicitly.
  ref: concepts.md#sealed-classes-and-interfaces
- id: records-sealed-classes-020
  difficulty: intermediate
  tags:
  - sealed
  - non-sealed
  question: |
    What does declaring a permitted subtype `non-sealed` accomplish?
  options:
  - It makes that subtype abstract
  - It forbids that subtype from being instantiated
  - It re-opens that branch of the hierarchy so arbitrary classes may extend it
  - It removes the subtype from the sealed hierarchy entirely
  answer: 2
  explanation: |
    `non-sealed` deliberately re-opens a branch: any class may then extend that
    subtype, escaping the closed hierarchy below that point. It does not make it
    abstract, uninstantiable, or remove it from the hierarchy.
  ref: concepts.md#sealed-classes-and-interfaces
- id: records-sealed-classes-021
  difficulty: intermediate
  tags:
  - records
  - sealed
  - adt
  question: |
    Combining a sealed interface with several record implementations models which
    programming concept?
  options:
  - Dependency injection
  - Aspect-oriented programming
  - Algebraic data types (a sum of products)
  - The singleton pattern
  answer: 2
  explanation: |
    A sealed interface is the "sum" (one of a fixed set of alternatives) and each
    record is a "product" (a bundle of fields), together forming an algebraic data
    type. This enables exhaustive pattern matching.
  ref: concepts.md#records-and-sealed-as-algebraic-data-types
- id: records-sealed-classes-022
  difficulty: intermediate
  tags:
  - records
  - lombok
  - comparison
  question: |
    Which is a genuine difference between a Java record and a Lombok `@Value`
    class?
  options:
  - A record is a language feature requiring no dependency or IDE plugin; Lombok is an annotation processor
    that rewrites the AST and needs the Lombok library/plugin
  - Records are mutable while Lombok @Value is immutable
  - Lombok generates x() accessors while records generate getX()
  - Only Lombok classes can implement interfaces
  answer: 0
  explanation: |
    Records are a first-class JDK language feature (no external dependency, no IDE
    plugin). Lombok is a third-party compile-time annotation processor that
    injects code into the AST and needs its plugin. Both are immutable in this
    case; records use x() accessors while Lombok @Value uses getX(); both can
    implement interfaces.
  ref: concepts.md#records-vs-lombok-vs-classic-pojo
- id: records-sealed-classes-023
  difficulty: intermediate
  tags:
  - records
  - defensive-copy
  - code-analysis
  question: |
    To make `record Tags(List<String> values)` safely immutable against callers
    mutating the passed list, what is the idiomatic fix?
  options:
  - Mark the values field volatile
  - Override hashCode to ignore the list
  - Declare the record final (it already is)
  - In the compact constructor, do `values = List.copyOf(values);`
  answer: 3
  explanation: |
    Records give only shallow immutability, so a mutable component like a List can
    still be changed by the caller. Defensive copying in the compact
    constructor (`values = List.copyOf(values)`) snapshots an immutable copy on
    the way in. Marking final or overriding hashCode does not address aliasing.
  ref: concepts.md#canonical-compact-and-custom-constructors
- id: records-sealed-classes-024
  difficulty: intermediate
  tags:
  - sealed
  - code-analysis
  question: |
    What is wrong with this code?

    ```java
    public sealed interface Shape permits Circle {}
    public class Circle implements Shape {}
    ```
  options:
  - Nothing; it compiles
  - permits must list at least two subtypes
  - A sealed type cannot be an interface
  - Circle must be declared final, sealed, or non-sealed
  answer: 3
  explanation: |
    Every permitted subtype must choose one of final, sealed, or non-sealed.
    `Circle` here has none, which is a compile error. Sealed interfaces are legal
    and there is no minimum count for permits.
  ref: concepts.md#sealed-classes-and-interfaces
- id: records-sealed-classes-025
  difficulty: intermediate
  tags:
  - records
  - local-records
  - versions
  question: |
    Local records (records declared inside a method body) became available in
    which JDK, along with the finalization of records?
  options:
  - JDK 11
  - JDK 14
  - JDK 16
  - JDK 21
  answer: 2
  explanation: |
    Local records arrived with the finalization of records in JDK 16. They are
    useful for modeling intermediate tuples inside a stream pipeline and are
    implicitly static.
  ref: concepts.md#records-restrictions-and-constraints
- id: records-sealed-classes-026
  difficulty: intermediate
  tags:
  - sealed
  - reflection
  - versions
  question: |
    Which reflection methods report a class's sealed status and its permitted
    subtypes (added in JDK 17)?
  options:
  - Class::isFinal and Class::getSubclasses
  - Class::isRecord and Class::getRecordComponents
  - Class::isEnum and Class::getEnumConstants
  - Class::isSealed and Class::getPermittedSubclasses
  answer: 3
  explanation: |
    `Class::isSealed` and `Class::getPermittedSubclasses` (JDK 17) expose sealing
    via reflection, backed by the PermittedSubclasses class-file attribute.
    isRecord/getRecordComponents are for records; the other options are not real
    or not for sealing.
  ref: concepts.md#sealed-classes-and-interfaces
- id: records-sealed-classes-027
  difficulty: intermediate
  tags:
  - records
  - reflection
  question: |
    Which method returns the components of a record class in declaration order
    (since JDK 16)?
  options:
  - Class::getDeclaredFields
  - Class::getBeanProperties
  - Class::getComponents
  - Class::getRecordComponents
  answer: 3
  explanation: |
    `Class::getRecordComponents()` returns a RecordComponent[] in declaration
    order. getDeclaredFields returns Field objects but not the ordered component
    metadata; the other two do not exist.
  ref: concepts.md#record-auto-generated-members
- id: records-sealed-classes-028
  difficulty: intermediate
  tags:
  - records
  - jpa
  - tradeoffs
  question: |
    Which scenario is a POOR fit for using a record?
  options:
  - A DTO returned from a REST endpoint
  - A cache key needing value-based equals/hashCode
  - A JPA @Entity requiring a no-arg constructor and mutable, lazily-set fields
  - A coordinate pair passed around a geometry library
  answer: 2
  explanation: |
    Records are immutable, have no no-arg constructor, and forbid extra instance
    fields — a bad match for JPA entities that need mutability, a default
    constructor, and lifecycle-managed state. The other three exploit records'
    immutable value semantics perfectly.
  ref: concepts.md#records-vs-lombok-vs-classic-pojo
- id: records-sealed-classes-029
  difficulty: intermediate
  tags:
  - sealed
  - exhaustiveness
  question: |
    Why does sealing a type enable an exhaustive `switch` without a `default`
    branch?
  options:
  - Because the JVM disables the default branch for sealed types
  - Because pattern switches ignore missing cases at runtime
  - Because sealed types are automatically enums
  - Because the compiler knows the complete, closed set of permitted subtypes and can verify all are covered
  answer: 3
  explanation: |
    A sealed type has a compiler-known complete set of subtypes, so the compiler
    can prove a switch covers every alternative. If you cover all of them, no
    default is needed; if you miss one, it is a compile error.
  ref: concepts.md#sealed-types-and-exhaustiveness
- id: records-sealed-classes-030
  difficulty: intermediate
  tags:
  - records
  - static
  - code-analysis
  question: |
    What does this print?

    ```java
    record Counter(int value) {
        static int instances = 0;
        Counter {
            instances++;
        }
    }
    new Counter(1); new Counter(2); new Counter(3);
    System.out.println(Counter.instances);
    ```
  options:
  - '0'
  - '1'
  - '3'
  - It does not compile
  answer: 2
  explanation: |
    Static fields ARE allowed in records. The compact constructor runs on every
    instantiation, so `instances` is incremented three times, printing 3.
  ref: concepts.md#records-restrictions-and-constraints
- id: records-sealed-classes-031
  difficulty: advanced
  tags:
  - records
  - serialization
  - security
  question: |
    Why is deserializing a record generally SAFER than deserializing an ordinary
    Serializable class?
  options:
  - Records are never actually written to the stream
  - Records skip deserialization of all fields, avoiding attacks
  - Records use encryption on the wire by default
  - Record deserialization goes through the canonical constructor, so validation in the compact constructor
    re-runs and invariants are restored
  answer: 3
  explanation: |
    Ordinary Serializable classes are reconstructed by allocating the object and
    setting fields WITHOUT calling any constructor, letting crafted streams bypass
    invariants. Record deserialization instead runs the canonical constructor, so
    your compact-constructor validation executes and restores invariants.
  ref: concepts.md#serialization-of-records
- id: records-sealed-classes-032
  difficulty: advanced
  tags:
  - records
  - serialization
  - hooks
  question: |
    For records, which serialization customization is effectively IGNORED with
    respect to how components are read back?
  options:
  - The canonical constructor
  - The class name in the stream
  - The component list
  - Custom readObject/writeObject field-substitution logic (deserialization cannot be diverted from the
    canonical constructor)
  answer: 3
  explanation: |
    Record deserialization is fixed to go through the canonical constructor using
    the component state; custom readObject/writeObject field-substitution hooks
    cannot divert it. (Whole-object writeReplace/readResolve substitution still
    works.) This is precisely what hardens records against invariant-bypass
    attacks.
  ref: concepts.md#serialization-of-records
- id: records-sealed-classes-033
  difficulty: advanced
  tags:
  - records
  - constructors
  - code-analysis
  question: |
    Does this compile, and if so what is the behavior?

    ```java
    record Range(int lo, int hi) {
        Range {                       // compact
            this.lo = lo;             // explicit assignment
        }
    }
    ```
  options:
  - Compiles and works fine
  - Runtime exception on construction
  - Compiles but hi is never set
  - 'Compile error: a compact constructor must not explicitly assign this.field'
  answer: 3
  explanation: |
    Inside a compact constructor you may not explicitly assign to `this.field`;
    the compiler performs the assignments automatically after the body. Writing
    `this.lo = lo` is a compile error.
  ref: concepts.md#canonical-compact-and-custom-constructors
- id: records-sealed-classes-034
  difficulty: advanced
  tags:
  - records
  - constructors
  question: |
    Can a record declare BOTH a compact canonical constructor and an explicit
    canonical constructor (with the full parameter list)?
  options:
  - Yes, they are treated as overloads
  - Only if the record has no components
  - Yes, if one is private
  - No — a record has exactly one canonical constructor; you choose either the compact form or the explicit
    form, not both
  answer: 3
  explanation: |
    A record has a single canonical constructor. You may write it in the compact
    form OR the explicit full-parameter form, but declaring both is a compile
    error (duplicate canonical constructor).
  ref: concepts.md#canonical-compact-and-custom-constructors
- id: records-sealed-classes-035
  difficulty: advanced
  tags:
  - sealed
  - exhaustiveness
  - matchexception
  - versions
  question: |
    In JDK 21, when an exhaustive pattern switch over a sealed type has no case
    matching the runtime value (e.g. due to separate compilation adding a
    subtype), what does the implicitly generated default do?
  options:
  - Silently falls through and returns null
  - Logs a warning and continues
  - Throws NullPointerException
  - Throws MatchException
  answer: 3
  explanation: |
    Since JDK 21 the compiler inserts an implicit total default that throws
    MatchException if no label matches, keeping the switch total without you
    writing default. NPE is thrown for a null selector without a `case null`, but
    the unmatched-remainder case is MatchException.
  ref: concepts.md#sealed-types-and-exhaustiveness
- id: records-sealed-classes-036
  difficulty: advanced
  tags:
  - records
  - patterns
  - versions
  - code-analysis
  question: |
    This code deconstructs records inside a switch. What is the minimum JDK where
    it is a FINAL (non-preview) feature?

    ```java
    sealed interface Expr permits Num, Add {}
    record Num(double val) implements Expr {}
    record Add(Expr left, Expr right) implements Expr {}
    double eval(Expr e) {
        return switch (e) {
            case Num(double v)       -> v;
            case Add(Expr l, Expr r) -> eval(l) + eval(r);
        };
    }
    ```
  options:
  - JDK 16
  - JDK 17
  - JDK 19
  - JDK 21
  answer: 3
  explanation: |
    This uses record patterns (deconstruction) plus pattern matching for switch.
    Record patterns were finalized in JDK 21 (JEP 440) and pattern switch in JDK
    21 (JEP 441). Both were only preview before 21.
  ref: concepts.md#sealed-types-and-exhaustiveness
- id: records-sealed-classes-037
  difficulty: advanced
  tags:
  - sealed
  - modules
  - accessibility
  question: |
    For a sealed type and its permitted subtypes in the unnamed module, what
    locality constraint applies (JDK 17)?
  options:
  - They must all be in the same method
  - They must be in different packages for encapsulation
  - They may be in any package as long as they are public
  - They must be in the same package
  answer: 3
  explanation: |
    Permitted subtypes must be accessible to the sealed type and in the same
    module; in the unnamed module (no explicit modules), that means the same
    package. Named modules relax this to same-module across packages.
  ref: concepts.md#sealed-classes-and-interfaces
- id: records-sealed-classes-038
  difficulty: advanced
  tags:
  - records
  - restrictions
  - code-analysis
  question: |
    Which of these record features is a COMPILE ERROR?
  options:
  - Declaring a static nested record
  - Implementing Comparable and providing compareTo
  - Overriding the generated toString()
  - Adding an instance initializer block { ... } to a record
  answer: 3
  explanation: |
    Records cannot declare instance initializer blocks (only static initializers
    are allowed). Static nested records, overriding generated members, and
    implementing interfaces like Comparable are all permitted.
  ref: concepts.md#records-restrictions-and-constraints
- id: records-sealed-classes-039
  difficulty: advanced
  tags:
  - records
  - sealed
  - expression-problem
  question: |
    Sealed interfaces + records + pattern switch versus the classic Visitor
    pattern illustrate the "expression problem." Which characterization is
    correct?
  options:
  - ADTs make adding new operations easy but adding new variants forces edits across all switches; Visitor
    makes adding new operations require touching every class
  - Both approaches make adding variants and operations equally trivial
  - Visitor is always superior because it is object-oriented
  - ADTs make adding new variant TYPES trivial but adding operations hard
  answer: 0
  explanation: |
    With sealed+records ADTs, a new operation is just one new switch, but a new
    variant forces updating every exhaustive switch. Visitor is the dual: adding a
    variant is easy-ish but a new operation touches every class's accept/visit.
    Option D reverses the ADT trade-off.
  ref: concepts.md#records-and-sealed-as-algebraic-data-types
- id: records-sealed-classes-040
  difficulty: advanced
  tags:
  - sealed
  - enum
  - record
  question: |
    Which of the following can legally be named in a sealed type's `permits`
    clause as a leaf?
  options:
  - A record (which is implicitly final)
  - An interface declared non-sealed by mistake without extending the sealed type
  - A primitive type such as int
  - A lambda expression
  answer: 0
  explanation: |
    A record is implicitly final and can implement a sealed interface, appearing
    as a permitted leaf. A permitted subtype must actually extend/implement the
    sealed type; primitives and lambdas cannot; an unrelated interface cannot be
    permitted.
  ref: concepts.md#sealed-classes-and-interfaces
- id: records-sealed-classes-041
  difficulty: advanced
  tags:
  - records
  - serialization
  - serialversionuid
  question: |
    For a Serializable record that does not declare a serialVersionUID, what is
    its default value?
  options:
  - A hash computed from the class layout
  - 0L
  - 1L
  - It is illegal to omit serialVersionUID on a record
  answer: 1
  explanation: |
    For records the default serialVersionUID is 0L unless explicitly declared, and
    the stream form is derived from the component list. It is not the
    layout-computed hash used for ordinary classes, and omitting it is legal.
  ref: concepts.md#serialization-of-records
- id: records-sealed-classes-042
  difficulty: advanced
  tags:
  - records
  - accessors
  - code-analysis
  question: |
    What subtle bug does this record have?

    ```java
    record Data(int[] values) {}
    int[] a = {1, 2, 3};
    Data d = new Data(a);
    a[0] = 99;
    System.out.println(d.values()[0]);
    ```
  options:
  - Prints 1 because records deep-copy arrays
  - Prints 99 because the array reference is shared (no defensive copy)
  - It does not compile because arrays cannot be record components
  - Throws ArrayStoreException
  answer: 1
  explanation: |
    Records provide only shallow immutability. The component holds the same array
    reference, and the accessor returns it directly, so external mutation is
    visible: it prints 99. Fixing requires defensive copies in the constructor and
    accessor.
  ref: concepts.md#records-basics
- id: records-sealed-classes-043
  difficulty: advanced
  tags:
  - sealed
  - class-file
  - jvm
  question: |
    How is a sealed type's closed set of subtypes enforced at the bytecode/JVM
    level?
  options:
  - By a runtime SecurityManager check
  - By the PermittedSubclasses class-file attribute, which the compiler and JVM both honor
  - It is only a compiler convention with no bytecode representation
  - By marking the class ACC_FINAL in every case
  answer: 1
  explanation: |
    Sealing is recorded in the PermittedSubclasses attribute in the class file.
    Both the compiler and the runtime enforce it, so even bytecode-manipulated
    unlisted subtypes are rejected. It is not merely a compiler convention and not
    SecurityManager-based.
  ref: concepts.md#sealed-classes-and-interfaces
- id: records-sealed-classes-044
  difficulty: advanced
  tags:
  - records
  - compact-constructor
  - code-analysis
  question: |
    What is printed?

    ```java
    record Range(int lo, int hi) {
        Range {
            if (lo > hi) throw new IllegalArgumentException();
        }
    }
    try {
        new Range(5, 1);
        System.out.println("ok");
    } catch (IllegalArgumentException e) {
        System.out.println("bad");
    }
    ```
  options:
  - ok
  - bad
  - Nothing; it does not compile
  - It prints ok then throws
  answer: 1
  explanation: |
    The compact constructor validates lo <= hi. With lo=5, hi=1 it throws
    IllegalArgumentException, so the catch prints "bad". This is the canonical use
    of a compact constructor for invariant enforcement.
  ref: concepts.md#canonical-compact-and-custom-constructors
- id: records-sealed-classes-045
  difficulty: expert
  tags:
  - records
  - serialization
  - proxy-pattern
  question: |
    Why are records especially well suited to a serialization-hardening strategy
    compared to ordinary classes?
  options:
  - Because their deserialization is guaranteed to pass through the validating canonical constructor,
    closing the classic invariant-bypass hole that plagues ordinary readObject-based classes
  - Because they compress the byte stream automatically
  - Because they are exempt from Java serialization entirely
  - Because their fields are transient by default
  answer: 0
  explanation: |
    The core value is that record deserialization always runs the canonical
    constructor, so validation cannot be bypassed by a crafted stream — the exact
    weakness the serialization proxy pattern was invented to mitigate for ordinary
    classes. Records neither compress streams, skip serialization, nor make fields
    transient.
  ref: concepts.md#serialization-of-records
- id: records-sealed-classes-046
  difficulty: expert
  tags:
  - sealed
  - exhaustiveness
  - null
  - code-analysis
  question: |
    Given an exhaustive pattern switch over a sealed type with no `case null`
    label, what happens if the selector is `null` at runtime (JDK 21)?
  options:
  - It matches the first case
  - It throws NullPointerException
  - It throws MatchException
  - It silently returns the default value of the return type
  answer: 1
  explanation: |
    A switch (even a pattern switch) throws NullPointerException on a null selector
    unless a `case null` label is present. MatchException is for the
    unmatched-remainder situation, not for null selectors.
  ref: concepts.md#sealed-types-and-exhaustiveness
- id: records-sealed-classes-047
  difficulty: expert
  tags:
  - records
  - generics
  - code-analysis
  question: |
    Is `record Pair<A, B>(A first, B second) {}` legal, and what are the accessor
    signatures?
  options:
  - 'Illegal: records cannot be generic'
  - Legal; accessors are A first() and B second()
  - Legal, but only if A and B are bounded by Comparable
  - Legal; accessors are getFirst() and getSecond()
  answer: 1
  explanation: |
    Records can be generic. The accessors are named after the components and
    return the component types: `A first()` and `B second()`. There is no bound
    requirement, and records never use get-prefixed accessors.
  ref: concepts.md#records-basics
- id: records-sealed-classes-048
  difficulty: expert
  tags:
  - sealed
  - interface
  - code-analysis
  question: |
    Consider:

    ```java
    public sealed interface Node permits Leaf, Branch {}
    public record Leaf(int v) implements Node {}
    public sealed interface Branch extends Node permits BinBranch {}
    public record BinBranch(Node l, Node r) implements Branch {}
    ```
    Which statement is true?
  options:
  - 'It fails: a sealed interface cannot permit another sealed interface'
  - 'It compiles: Branch continues the closed hierarchy as its own sealed interface'
  - 'It fails: records cannot implement a sealed interface'
  - 'It fails: Node must be a class, not an interface, to be sealed'
  answer: 1
  explanation: |
    A permitted subtype may itself be `sealed` and continue the closed hierarchy
    with its own permits clause — exactly what Branch does. Records can implement
    sealed interfaces, and sealed interfaces are fully legal.
  ref: concepts.md#sealed-classes-and-interfaces
- id: records-sealed-classes-049
  difficulty: expert
  tags:
  - records
  - canonical-constructor
  - visibility
  question: |
    If a record declares an explicit canonical constructor, what visibility
    constraint applies relative to the record itself?
  options:
  - It must be private
  - Its access modifier must be at least as accessible as the record class
  - It must always be public regardless of the record's visibility
  - It may have any visibility, fully independent of the record
  answer: 1
  explanation: |
    The canonical constructor's access level must be at least as permissive as the
    record class (e.g. a public record cannot have a private canonical
    constructor). It need not be public if the record itself is package-private.
  ref: concepts.md#canonical-compact-and-custom-constructors
- id: records-sealed-classes-050
  difficulty: expert
  tags:
  - records
  - sealed
  - structured-concurrency
  - versions
  question: |
    A candidate claims "records, sealed classes, virtual threads, and structured
    concurrency are all final in JDK 21." Which part is INCORRECT as of JDK 21?
  options:
  - Records being final
  - Sealed classes being final
  - Virtual threads being final
  - Structured concurrency being final (it was still preview/incubating in JDK 21)
  answer: 3
  explanation: |
    Records (JDK 16) and sealed classes (JDK 17) are final; virtual threads were
    finalized in JDK 21 (JEP 444). Structured concurrency, however, was still a
    preview/incubating API in JDK 21 — not final. This version precision is a
    common trap.
  ref: concepts.md#records-and-sealed-as-algebraic-data-types
- id: records-sealed-classes-051
  difficulty: expert
  tags:
  - records
  - equals
  - hashcode
  - contract
  question: |
    If you override `equals` in a record but do NOT override `hashCode`, what is
    the situation?
  options:
  - It is a compile error
  - The compiler keeps generating hashCode over all components, which may now be inconsistent with your
    custom equals
  - hashCode is automatically derived from your custom equals
  - The record silently disables hashCode
  answer: 1
  explanation: |
    Overriding only equals is legal but risky: the compiler-generated hashCode
    still hashes all components and may violate the equals/hashCode contract with
    your custom equals. As with any class, you must keep them consistent yourself.
  ref: concepts.md#record-auto-generated-members
- id: records-sealed-classes-052
  difficulty: expert
  tags:
  - sealed
  - abstract
  - code-analysis
  question: |
    Which combination is legal?
  options:
  - An abstract class declared sealed with a permits clause
  - A record declared sealed
  - An enum declared sealed
  - A final class declared sealed
  answer: 0
  explanation: |
    An abstract class can be sealed (with permits). Records and enums are already
    implicitly final, so declaring them sealed is a contradiction/error, and a
    final class cannot also be sealed (final forbids subclasses entirely).
  ref: concepts.md#sealed-classes-and-interfaces
- id: records-sealed-classes-053
  difficulty: intermediate
  tags:
  - records
  - tostring
  - code-analysis
  question: |
    For `record Point(int x, int y) {}`, what does `new Point(1, 2).toString()`
    return?
  options:
  - Point@1a2b3c
  - Point[x=1, y=2]
  - Point{1, 2}
  - '{x:1, y:2}'
  answer: 1
  explanation: |
    The generated toString has the form `TypeName[comp1=val1, comp2=val2]`, so it
    returns `Point[x=1, y=2]`. The identity-hash form would only appear if you
    overrode toString to Object's default, which records do not.
  ref: concepts.md#record-auto-generated-members
- id: records-sealed-classes-054
  difficulty: intermediate
  tags:
  - records
  - instanceof
  - versions
  question: |
    Pattern matching for `instanceof` (e.g. `if (o instanceof Point p)`) was
    finalized in which JDK — the same release that finalized records?
  options:
  - JDK 14
  - JDK 15
  - JDK 16
  - JDK 17
  answer: 2
  explanation: |
    Pattern matching for instanceof was finalized in JDK 16 (JEP 394), the same
    release that finalized records (JEP 395). Sealed classes came in JDK 17.
  ref: concepts.md#sealed-types-and-exhaustiveness
- id: records-sealed-classes-055
  difficulty: beginner
  tags:
  - records
  - superclass
  question: |
    Every record implicitly extends which class?
  options:
  - java.lang.Object directly
  - java.lang.Record
  - java.lang.Enum
  - java.io.Serializable
  answer: 1
  explanation: |
    Records implicitly extend java.lang.Record (which itself extends Object). This
    is why a record cannot extend any other class. Serializable is an interface,
    not a superclass, and not implicitly added.
  ref: concepts.md#records-restrictions-and-constraints
- id: records-sealed-classes-056
  difficulty: advanced
  tags:
  - records
  - nested
  - static
  question: |
    A record declared as a member of another class is implicitly:
  options:
  - public
  - static
  - abstract
  - transient
  answer: 1
  explanation: |
    Like nested enums and interfaces, a nested record is implicitly static — it
    has no reference to an enclosing instance. It is not implicitly public,
    abstract (records can't be abstract), or transient.
  ref: concepts.md#records-restrictions-and-constraints
- id: records-sealed-classes-057
  difficulty: advanced
  tags:
  - sealed
  - code-analysis
  - permits
  question: |
    What is the compilation result?

    ```java
    public sealed class Animal permits Dog {}
    public final class Dog extends Animal {}
    public final class Cat extends Animal {}   // not in permits
    ```
  options:
  - Compiles; Cat is allowed because it is final
  - 'Compile error: Cat is not a permitted subtype of the sealed class Animal'
  - Compiles with a warning
  - 'Compile error: a sealed class cannot have any subclasses'
  answer: 1
  explanation: |
    Animal permits only Dog. Cat attempts to extend Animal without being in the
    permits clause, which is a compile error. Being final does not exempt a
    subtype from the permits requirement.
  ref: concepts.md#sealed-classes-and-interfaces
- id: records-sealed-classes-058
  difficulty: intermediate
  tags:
  - records
  - isrecord
  - reflection
  question: |
    What does `SomeRecord.class.isRecord()` return, and since which JDK is
    `isRecord()` available?
  options:
  - true; since JDK 16
  - false; since JDK 11
  - true; since JDK 8
  - It throws UnsupportedOperationException
  answer: 0
  explanation: |
    Class::isRecord() was added in JDK 16 and returns true for record classes. It
    lets frameworks detect records reflectively to bind data without get/set
    conventions.
  ref: concepts.md#record-auto-generated-members
- id: records-sealed-classes-059
  difficulty: expert
  tags:
  - records
  - compact-constructor
  - code-analysis
  question: |
    What does this print?

    ```java
    record R(int x) {
        R {
            System.out.print(this.x + " ");   // read this.x inside compact ctor
        }
    }
    new R(7);
    ```
  options:
  - '7'
  - '0'
  - It does not compile
  - 'null'
  answer: 1
  explanation: |
    Inside a compact constructor the implicit field assignments happen at the END
    of the body, so reading `this.x` before then sees the field's default value,
    0. The incoming value lives in the parameter `x`, not yet in the field.
  ref: concepts.md#canonical-compact-and-custom-constructors
- id: records-sealed-classes-060
  difficulty: advanced
  tags:
  - records
  - lombok
  - tradeoffs
  question: |
    A team wants an immutable data carrier that must extend an existing abstract
    base class AND expose JavaBeans-style getX() accessors for a legacy framework.
    Which choice best fits?
  options:
  - A record, since it can extend the base class
  - A Lombok @Value or hand-written class, since records cannot extend a class and do not produce getX()
    accessors
  - A record with @Override getX() methods added
  - An enum
  answer: 1
  explanation: |
    Records cannot extend a class and use x()-style accessors, so they fail both
    requirements here. A Lombok @Value class (or a hand-written immutable class)
    can extend the base and generate getX() accessors, making it the right tool.
  ref: concepts.md#records-vs-lombok-vs-classic-pojo
