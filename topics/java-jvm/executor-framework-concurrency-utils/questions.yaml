topic: "Executor Framework and java.util.concurrent"
domain: java-jvm
topic_slug: executor-framework-concurrency-utils
version: 1
questions:
  - id: executor-framework-concurrency-utils-001
    difficulty: beginner
    tags: [executor, interfaces, basics]
    question: |
      What is the single method declared by the `java.util.concurrent.Executor` interface?
    options:
      - "Future<?> submit(Runnable task)"
      - "void execute(Runnable command)"
      - "void run()"
      - "void shutdown()"
    answer: 1
    explanation: |
      `Executor` is intentionally minimal: `void execute(Runnable command)`. It decouples task
      submission from the mechanics of how each task runs. `submit(...)` and `shutdown()` belong to the
      richer `ExecutorService` sub-interface, and `run()` is on `Runnable` itself.
    ref: "concepts.md#executor-executorservice-and-threadpoolexecutor"

  - id: executor-framework-concurrency-utils-002
    difficulty: beginner
    tags: [executorservice, lifecycle]
    question: |
      Which capability does `ExecutorService` add over the base `Executor` interface?
    options:
      - "Nothing; they are identical interfaces."
      - "Lifecycle management (shutdown/awaitTermination) and result-bearing submission (submit/invokeAll)."
      - "It removes the ability to run Runnables."
      - "It guarantees single-threaded execution."
    answer: 1
    explanation: |
      `ExecutorService` extends `Executor` with lifecycle control (`shutdown()`, `shutdownNow()`,
      `awaitTermination()`) and submission methods that return `Future`s (`submit`, `invokeAll`,
      `invokeAny`). Single-threaded execution is a property of a specific implementation, not the
      interface.
    ref: "concepts.md#executor-executorservice-and-threadpoolexecutor"

  - id: executor-framework-concurrency-utils-003
    difficulty: beginner
    tags: [threadpoolexecutor, parameters]
    question: |
      In a `ThreadPoolExecutor`, what does `keepAliveTime` control?
    options:
      - "How long a submitted task may run before being cancelled."
      - "How long the pool waits during shutdown before force-stopping."
      - "How long idle threads above the core size are kept before being terminated."
      - "The maximum time a task may wait in the queue before rejection."
    answer: 2
    explanation: |
      `keepAliveTime` is the idle timeout for threads *in excess of* `corePoolSize`. When such a thread
      sits idle longer than this, it is terminated to shrink the pool back toward core size. (With
      `allowCoreThreadTimeOut(true)` it also applies to core threads.) It has nothing to do with task
      execution time or shutdown timing.
    ref: "concepts.md#executor-executorservice-and-threadpoolexecutor"

  - id: executor-framework-concurrency-utils-004
    difficulty: intermediate
    tags: [threadpoolexecutor, admission-algorithm]
    question: |
      A `ThreadPoolExecutor` has corePoolSize=2, maximumPoolSize=4, and a `LinkedBlockingQueue` with
      capacity 10. Currently 2 core threads are busy and the queue is empty. A new task is submitted.
      What happens?
    options:
      - "A third thread is immediately created to run the task, since the pool is below maximum."
      - "The task is placed on the queue; no new thread is created because core threads exist and the queue is not full."
      - "The task is rejected because both core threads are busy."
      - "The task runs on the submitting thread."
    answer: 1
    explanation: |
      The admission algorithm creates threads beyond core ONLY when the queue is full. Here the bounded
      queue has room, so the task is enqueued and no third thread is created. Threads grow past core
      (up to maximum) only after the queue saturates. This is why an unbounded queue makes maximumPoolSize
      irrelevant.
    ref: "concepts.md#executor-executorservice-and-threadpoolexecutor"

  - id: executor-framework-concurrency-utils-005
    difficulty: intermediate
    tags: [rejection-policy, backpressure]
    question: |
      Which `RejectedExecutionHandler` provides natural back-pressure by slowing down the task submitter?
    options:
      - "AbortPolicy"
      - "DiscardPolicy"
      - "DiscardOldestPolicy"
      - "CallerRunsPolicy"
    answer: 3
    explanation: |
      `CallerRunsPolicy` runs the rejected task synchronously on the thread that called `execute`/`submit`.
      While that thread is busy running the task, it cannot submit more work, which throttles the producer
      and lets the pool catch up. `AbortPolicy` throws, and the two `Discard` policies drop tasks silently.
    ref: "concepts.md#executor-executorservice-and-threadpoolexecutor"

  - id: executor-framework-concurrency-utils-006
    difficulty: intermediate
    tags: [execute-vs-submit, exceptions]
    question: |
      What is the key difference in exception handling between `execute(Runnable)` and `submit(Runnable)`
      on an `ExecutorService`?
    options:
      - "There is no difference; both propagate exceptions to the thread's UncaughtExceptionHandler."
      - "With execute the exception reaches the thread's UncaughtExceptionHandler; with submit it is captured in the Future and only surfaces on get()."
      - "submit swallows all exceptions permanently and they can never be recovered."
      - "execute wraps exceptions in ExecutionException while submit rethrows them immediately."
    answer: 1
    explanation: |
      `execute` lets a thrown exception propagate to the worker thread's uncaught-exception handling.
      `submit` wraps the task in a `FutureTask`; any thrown exception is stored and re-thrown (wrapped in
      `ExecutionException`) only when you call `future.get()`. Submitting and never calling `get()` is a
      classic way to lose exceptions silently.
    ref: "concepts.md#executor-executorservice-and-threadpoolexecutor"

  - id: executor-framework-concurrency-utils-007
    difficulty: intermediate
    tags: [shutdown, lifecycle]
    question: |
      What does `shutdownNow()` do that `shutdown()` does not?
    options:
      - "It blocks until all tasks complete."
      - "It attempts to interrupt actively running tasks and returns the list of tasks that never started."
      - "It rejects new tasks but lets queued tasks finish normally."
      - "It permanently deletes the thread pool's queue without returning anything."
    answer: 1
    explanation: |
      `shutdown()` is a graceful drain: no new tasks accepted, already-queued tasks still run. `shutdownNow()`
      additionally interrupts active workers and returns the `List<Runnable>` of tasks still waiting in the
      queue that were never started. Neither method blocks — use `awaitTermination` for that.
    ref: "concepts.md#executor-executorservice-and-threadpoolexecutor"

  - id: executor-framework-concurrency-utils-008
    difficulty: advanced
    tags: [threadpoolexecutor, unbounded-queue]
    question: |
      Why does a `ThreadPoolExecutor` configured with an unbounded `LinkedBlockingQueue` effectively ignore
      its `maximumPoolSize`?
    options:
      - "Because the constructor throws an exception if maximumPoolSize is set with an unbounded queue."
      - "Because an unbounded queue can always accept a task, so the pool never needs to grow beyond corePoolSize."
      - "Because unbounded queues force the pool to always use maximumPoolSize threads."
      - "Because LinkedBlockingQueue disables the rejection handler, which resets max to core."
    answer: 1
    explanation: |
      The pool only creates threads beyond core when enqueuing fails (queue full). An unbounded queue never
      fills, so the enqueue step always succeeds and the pool stays at corePoolSize. `maximumPoolSize` and
      the rejection handler become dead configuration — this is exactly the trap in `newFixedThreadPool`.
    ref: "concepts.md#executor-executorservice-and-threadpoolexecutor"

  - id: executor-framework-concurrency-utils-009
    difficulty: advanced
    tags: [sizing, tuning]
    question: |
      For a purely CPU-bound workload on a machine with N processors, which pool sizing is the common
      starting heuristic?
    options:
      - "Roughly N + 1 threads."
      - "Exactly 2 threads regardless of N."
      - "Hundreds of threads to maximize throughput."
      - "N * 50 threads to hide any stalls."
    answer: 0
    explanation: |
      CPU-bound tasks keep a core busy continuously, so ~N (often N+1 to cover an occasional page fault)
      threads is the sweet spot; more threads just add context-switching overhead. IO-bound work is the
      opposite case, needing many more threads because each spends most of its time blocked, roughly
      N * (1 + wait/compute).
    ref: "concepts.md#executor-executorservice-and-threadpoolexecutor"

  - id: executor-framework-concurrency-utils-010
    difficulty: beginner
    tags: [executors-factory, basics]
    question: |
      Which `Executors` factory method creates a pool with a fixed number of threads?
    options:
      - "Executors.newCachedThreadPool()"
      - "Executors.newFixedThreadPool(int n)"
      - "Executors.newWorkStealingPool()"
      - "Executors.newVirtualThreadPerTaskExecutor()"
    answer: 1
    explanation: |
      `newFixedThreadPool(n)` creates a pool where corePoolSize == maximumPoolSize == n, backed by an
      unbounded `LinkedBlockingQueue`. `newCachedThreadPool` grows/shrinks on demand, work-stealing is a
      ForkJoinPool, and the virtual-thread executor makes one virtual thread per task.
    ref: "concepts.md#executors-factory-methods-and-their-pitfalls"

  - id: executor-framework-concurrency-utils-011
    difficulty: intermediate
    tags: [cached-thread-pool, pitfall]
    question: |
      Why can `Executors.newCachedThreadPool()` create an unbounded number of threads under load?
    options:
      - "It uses a LinkedBlockingQueue that never fills, so threads keep spawning."
      - "Its maximumPoolSize is Integer.MAX_VALUE and it uses a SynchronousQueue (zero capacity), so each task with no free thread spawns a new one."
      - "It intentionally ignores keepAliveTime and never reuses threads."
      - "It reads the number of CPUs incorrectly and multiplies by 1000."
    answer: 1
    explanation: |
      A `SynchronousQueue` has no storage — every offer must be immediately taken by a waiting thread. If no
      idle thread is available, the pool (max = Integer.MAX_VALUE) creates a new one. A burst of tasks can
      therefore spawn thousands of threads, risking `OutOfMemoryError: unable to create native thread`. Idle
      threads are reclaimed after the 60s keep-alive.
    ref: "concepts.md#executors-factory-methods-and-their-pitfalls"

  - id: executor-framework-concurrency-utils-012
    difficulty: intermediate
    tags: [fixed-thread-pool, oom]
    question: |
      What is the primary production risk of `Executors.newFixedThreadPool(n)` under a sustained overload of
      submissions?
    options:
      - "It throws RejectedExecutionException immediately, dropping traffic."
      - "Its unbounded queue accumulates tasks without limit, eventually causing OutOfMemoryError with no back-pressure."
      - "It creates unbounded threads and exhausts native memory."
      - "It silently discards the oldest tasks."
    answer: 1
    explanation: |
      `newFixedThreadPool` uses an unbounded `LinkedBlockingQueue`. With n threads saturated, incoming tasks
      queue indefinitely — memory grows until OOM. There is no rejection (the queue never fills) and thus no
      back-pressure. The fix is a directly constructed `ThreadPoolExecutor` with a bounded queue and a
      deliberate rejection policy.
    ref: "concepts.md#executors-factory-methods-and-their-pitfalls"

  - id: executor-framework-concurrency-utils-013
    difficulty: advanced
    tags: [best-practice, threadpoolexecutor]
    question: |
      Following production best practice, which configuration best prevents both unbounded memory growth and
      unbounded thread creation while still applying back-pressure?
    options:
      - "Executors.newCachedThreadPool() with a custom ThreadFactory."
      - "A directly constructed ThreadPoolExecutor with a bounded ArrayBlockingQueue, an explicit maximumPoolSize, and CallerRunsPolicy."
      - "Executors.newFixedThreadPool(Integer.MAX_VALUE)."
      - "A single-thread executor to avoid all concurrency concerns."
    answer: 1
    explanation: |
      A bounded queue caps memory, an explicit maximumPoolSize caps threads, and `CallerRunsPolicy` throttles
      producers when saturated (back-pressure). This is the canonical robust setup. The `Executors` factories
      either use unbounded queues (fixed/single) or unbounded threads (cached), and MAX_VALUE defeats the point.
    ref: "concepts.md#executors-factory-methods-and-their-pitfalls"

  - id: executor-framework-concurrency-utils-014
    difficulty: intermediate
    tags: [work-stealing-pool, version]
    question: |
      `Executors.newWorkStealingPool()` was introduced in Java 8. What does it return under the hood?
    options:
      - "A ThreadPoolExecutor with a SynchronousQueue."
      - "A ForkJoinPool configured with parallelism equal to the number of available processors, in async (FIFO) mode."
      - "A ScheduledThreadPoolExecutor."
      - "A single-threaded executor with work stealing simulated via a priority queue."
    answer: 1
    explanation: |
      `newWorkStealingPool()` (Java 8) returns a `ForkJoinPool` with parallelism defaulting to
      `Runtime.availableProcessors()` and asynchronous (FIFO) task handling, suited to many independent tasks.
      It leverages per-worker deques and work stealing rather than a single shared queue.
    ref: "concepts.md#executors-factory-methods-and-their-pitfalls"

  - id: executor-framework-concurrency-utils-015
    difficulty: beginner
    tags: [future, basics]
    question: |
      What does calling `future.get()` on a `Future` whose task has not yet completed do?
    options:
      - "Returns null immediately."
      - "Throws IllegalStateException."
      - "Blocks the calling thread until the task completes and the result is available."
      - "Cancels the task."
    answer: 2
    explanation: |
      `Future.get()` blocks until the computation finishes, then returns its value (or throws
      `ExecutionException` wrapping a task failure). The timed overload `get(timeout, unit)` throws
      `TimeoutException` if the deadline passes. This blocking, poll-only nature is the main limitation that
      `CompletableFuture` addresses.
    ref: "concepts.md#future-and-completablefuture"

  - id: executor-framework-concurrency-utils-016
    difficulty: beginner
    tags: [completablefuture, version]
    question: |
      In which Java version was `CompletableFuture` introduced?
    options:
      - "Java 5"
      - "Java 7"
      - "Java 8"
      - "Java 11"
    answer: 2
    explanation: |
      `CompletableFuture` (implementing `Future` and `CompletionStage`) arrived in Java 8 (2014) alongside
      lambdas and streams, enabling fluent, non-blocking composition of asynchronous work. Plain `Future` came
      with `java.util.concurrent` in Java 5; `orTimeout`/`completeOnTimeout` were later added in Java 9.
    ref: "concepts.md#future-and-completablefuture"

  - id: executor-framework-concurrency-utils-017
    difficulty: intermediate
    tags: [completablefuture, thencompose-vs-thenapply]
    question: |
      You have `CompletableFuture<User> uf` and a method `CompletableFuture<Address> lookup(User u)`. Which
      operator gives you a `CompletableFuture<Address>` (not a nested future)?
    options:
      - "uf.thenApply(u -> lookup(u))"
      - "uf.thenCompose(u -> lookup(u))"
      - "uf.thenAccept(u -> lookup(u))"
      - "uf.thenRun(() -> lookup(null))"
    answer: 1
    explanation: |
      `thenCompose` is the flat-map: when the mapping function itself returns a `CompletableFuture`, it flattens
      the result to `CompletableFuture<Address>`. `thenApply` with the same lambda would yield
      `CompletableFuture<CompletableFuture<Address>>` (nested). `thenAccept`/`thenRun` return `Void`.
    ref: "concepts.md#future-and-completablefuture"

  - id: executor-framework-concurrency-utils-018
    difficulty: intermediate
    tags: [completablefuture, combine]
    question: |
      Which method combines the results of two *independent* `CompletableFuture`s into a single result once
      both complete?
    options:
      - "thenCompose"
      - "thenCombine"
      - "thenAccept"
      - "exceptionally"
    answer: 1
    explanation: |
      `thenCombine(other, biFunction)` waits for both this future and `other` (which run independently) and
      applies a `BiFunction` to their two results. `thenCompose` chains a *dependent* future sequentially,
      `thenAccept` consumes a single result, and `exceptionally` handles errors.
    ref: "concepts.md#future-and-completablefuture"

  - id: executor-framework-concurrency-utils-019
    difficulty: advanced
    tags: [completablefuture, async-suffix, common-pool]
    question: |
      When you call `cf.thenApplyAsync(fn)` WITHOUT passing an executor, which thread pool runs `fn`?
    options:
      - "The thread that completed the previous stage."
      - "A brand-new thread created per call."
      - "ForkJoinPool.commonPool()."
      - "The main thread only."
    answer: 2
    explanation: |
      The `...Async` variants without an explicit executor use `ForkJoinPool.commonPool()`. The non-Async
      variant (`thenApply`) instead runs in whatever thread completed the prior stage (or the caller if already
      complete). Because the common pool has only ~cores-1 threads, running blocking IO on it via async stages
      can starve parallel streams and other CompletableFutures — pass a dedicated executor for blocking work.
    ref: "concepts.md#future-and-completablefuture"

  - id: executor-framework-concurrency-utils-020
    difficulty: advanced
    tags: [completablefuture, error-handling]
    question: |
      What is the difference between `handle` and `whenComplete` on a `CompletableFuture`?
    options:
      - "handle only runs on success; whenComplete only runs on failure."
      - "Both run on completion, but handle can transform the outcome into a new result, whereas whenComplete observes (result, throwable) and returns the original outcome."
      - "whenComplete can transform the result; handle cannot."
      - "They are exact synonyms."
    answer: 1
    explanation: |
      Both `handle((r, ex) -> ...)` and `whenComplete((r, ex) -> ...)` fire on both success and failure.
      `handle`'s return value becomes the new stage's result (it can recover or transform). `whenComplete` is a
      side-effect observer: it passes the original result/exception through unchanged (though if its own action
      throws, that is propagated). `exceptionally` differs again — it fires only on failure.
    ref: "concepts.md#future-and-completablefuture"

  - id: executor-framework-concurrency-utils-021
    difficulty: advanced
    tags: [completablefuture, join-vs-get]
    question: |
      How do `CompletableFuture.join()` and `CompletableFuture.get()` differ in how they report a task failure?
    options:
      - "join() throws an unchecked CompletionException; get() throws a checked ExecutionException."
      - "join() returns null on failure; get() throws."
      - "Both throw the exact same checked exception type."
      - "get() never throws; only join() does."
    answer: 0
    explanation: |
      `join()` wraps the cause in an unchecked `CompletionException`, so it needs no checked-exception handling
      (handy inside lambdas). `get()` throws the checked `ExecutionException` (and `InterruptedException`). Both
      surface the same underlying cause via `getCause()`.
    ref: "concepts.md#future-and-completablefuture"

  - id: executor-framework-concurrency-utils-022
    difficulty: expert
    tags: [completablefuture, cancellation]
    question: |
      What happens when you call `cancel(true)` on a `CompletableFuture` that is running a task submitted via
      `supplyAsync`?
    options:
      - "The running task is guaranteed to be interrupted mid-execution."
      - "It throws UnsupportedOperationException."
      - "The future completes exceptionally with CancellationException, but the running supplyAsync task is NOT actually interrupted (the mayInterruptIfRunning flag has no effect)."
      - "The task is paused and can be resumed later."
    answer: 2
    explanation: |
      For `CompletableFuture`, `cancel` completes the future exceptionally with `CancellationException`, but the
      `mayInterruptIfRunning` argument is ignored — the underlying `supplyAsync` computation keeps running and is
      not interrupted (unlike `FutureTask`, where interruption works). This surprises many developers expecting
      Loom/Future-style interruption.
    ref: "concepts.md#future-and-completablefuture"

  - id: executor-framework-concurrency-utils-023
    difficulty: expert
    tags: [completablefuture, version, timeout]
    question: |
      Which Java version added `orTimeout(long, TimeUnit)` and `completeOnTimeout(...)` to `CompletableFuture`?
    options:
      - "Java 8"
      - "Java 17"
      - "Java 11"
      - "Java 9"
    answer: 3
    explanation: |
      The timeout methods `orTimeout` (complete exceptionally with `TimeoutException` after a delay) and
      `completeOnTimeout` (complete with a default value) were added in Java 9 (JEP 266, "More Concurrency
      Updates"), which also added `defaultExecutor()`, `newIncompleteFuture()`, and delay/completion helpers.
    ref: "concepts.md#future-and-completablefuture"

  - id: executor-framework-concurrency-utils-024
    difficulty: beginner
    tags: [scheduled-executor, basics]
    question: |
      Which method schedules a one-shot task to run once after a given delay?
    options:
      - "scheduleAtFixedRate"
      - "scheduleWithFixedDelay"
      - "schedule(task, delay, unit)"
      - "submit(task)"
    answer: 2
    explanation: |
      `schedule(command, delay, unit)` runs the task a single time after the delay and returns a
      `ScheduledFuture`. The two `scheduleAt*/With*` methods create repeating tasks, and `submit` runs a task as
      soon as a thread is free with no delay.
    ref: "concepts.md#scheduledexecutorservice"

  - id: executor-framework-concurrency-utils-025
    difficulty: intermediate
    tags: [scheduled-executor, fixed-rate-vs-fixed-delay]
    question: |
      A task takes 3 seconds to run. It is scheduled with `scheduleWithFixedDelay(task, 0, 1, SECONDS)`.
      Approximately how much time elapses between the END of one run and the START of the next?
    options:
      - "1 second (the fixed delay is measured from completion to next start)."
      - "0 seconds (runs back to back)."
      - "3 seconds."
      - "4 seconds."
    answer: 0
    explanation: |
      `scheduleWithFixedDelay` measures the delay from the END of one execution to the START of the next, so the
      gap is always ~1 second regardless of the 3-second run time. `scheduleAtFixedRate` instead measures period
      start-to-start and would try to run every 1s, falling behind when the task overruns the period.
    ref: "concepts.md#scheduledexecutorservice"

  - id: executor-framework-concurrency-utils-026
    difficulty: advanced
    tags: [scheduled-executor, exception, gotcha]
    question: |
      A periodic task scheduled via `scheduleAtFixedRate` throws an uncaught RuntimeException on its third run.
      What happens?
    options:
      - "The pool logs the exception and continues running the task on schedule."
      - "The entire JVM crashes."
      - "That periodic task is suppressed and never runs again, though the executor itself stays alive; the failure surfaces only if you call get() on its ScheduledFuture."
      - "The task automatically restarts after a backoff delay."
    answer: 2
    explanation: |
      If a periodically scheduled task throws an uncaught exception, subsequent executions are cancelled — the
      task silently stops recurring while the pool keeps running other work. Because nothing prints by default,
      this is a notorious silent-failure bug. Defensive code wraps the task body in try/catch (or checks the
      `ScheduledFuture`'s `get()`, which rethrows the exception).
    ref: "concepts.md#scheduledexecutorservice"

  - id: executor-framework-concurrency-utils-027
    difficulty: intermediate
    tags: [timer-vs-scheduled, comparison]
    question: |
      Why is `ScheduledExecutorService` generally preferred over the legacy `java.util.Timer`?
    options:
      - "Timer cannot schedule tasks with a delay."
      - "ScheduledExecutorService is the only one that can run periodic tasks."
      - "Timer is not thread-safe at all."
      - "Timer uses a single thread and an uncaught exception in a TimerTask kills that thread, cancelling all future tasks; the scheduled executor uses a pool and isolates failures better."
    answer: 3
    explanation: |
      `Timer` runs everything on one thread, so a long task blocks the others, and an uncaught exception in a
      `TimerTask` terminates the Timer thread, silently cancelling all remaining scheduled tasks.
      `ScheduledThreadPoolExecutor` uses a configurable pool and contains failures far better, making it the
      recommended choice.
    ref: "concepts.md#scheduledexecutorservice"

  - id: executor-framework-concurrency-utils-028
    difficulty: expert
    tags: [scheduled-executor, internals]
    question: |
      For a `ScheduledThreadPoolExecutor`, why does `maximumPoolSize` have essentially no effect?
    options:
      - "Because it is backed by an unbounded DelayQueue that never fills, so the pool never grows past corePoolSize."
      - "Because it always uses exactly one thread."
      - "Because it rejects tasks once corePoolSize threads are busy."
      - "Because scheduled tasks always run on the common ForkJoinPool."
    answer: 0
    explanation: |
      `ScheduledThreadPoolExecutor` uses an unbounded `DelayQueue` (a priority queue ordered by scheduled time).
      Since the queue never fills, the thread-growth-beyond-core step never triggers, so only `corePoolSize`
      matters — the same reason unbounded queues neutralize `maximumPoolSize` in a plain `ThreadPoolExecutor`.
    ref: "concepts.md#scheduledexecutorservice"

  - id: executor-framework-concurrency-utils-029
    difficulty: beginner
    tags: [fork-join, version]
    question: |
      In which Java version was the Fork/Join framework (`ForkJoinPool`, `RecursiveTask`) introduced?
    options:
      - "Java 5"
      - "Java 6"
      - "Java 7"
      - "Java 8"
    answer: 2
    explanation: |
      The Fork/Join framework was introduced in Java 7 (2011), designed by Doug Lea for divide-and-conquer
      parallelism using work-stealing. Java 8 later added the shared `ForkJoinPool.commonPool()` used by parallel
      streams and `CompletableFuture` async methods.
    ref: "concepts.md#fork-join-framework-and-work-stealing"

  - id: executor-framework-concurrency-utils-030
    difficulty: intermediate
    tags: [fork-join, work-stealing]
    question: |
      In the work-stealing algorithm used by `ForkJoinPool`, how does an idle worker obtain more work?
    options:
      - "It waits for the main thread to hand it a task."
      - "It pulls from a single shared global queue guarded by one lock."
      - "It steals a task from the TAIL of another worker's deque, while workers process their own tasks from the HEAD."
      - "It creates a brand-new task from scratch."
    answer: 2
    explanation: |
      Each worker uses its own double-ended queue: it pushes/pops its own subtasks LIFO from the head (good cache
      locality). An idle worker steals from the TAIL of a victim's deque (FIFO), grabbing the oldest, typically
      largest task, which minimizes contention with the victim and improves load balancing.
    ref: "concepts.md#fork-join-framework-and-work-stealing"

  - id: executor-framework-concurrency-utils-031
    difficulty: advanced
    tags: [fork-join, ordering, code-analysis]
    question: |
      Consider this snippet inside a RecursiveTask.compute():
      ```
      left.fork();
      long r = right.compute();
      long l = left.join();
      return l + r;
      ```
      Why is this ordering preferred over `left.fork(); right.fork(); return left.join() + right.join();`?
    options:
      - "It is not preferred; both are equivalent in every way."
      - "The first form runs everything sequentially."
      - "join() cannot be called after fork() in the second form."
      - "Computing the right half in the current thread avoids the overhead of forking a second task and keeps the current thread productive while the left half runs elsewhere."
    answer: 3
    explanation: |
      Forking the left subtask and computing the right in the current thread means the current thread does useful
      work instead of just blocking on joins, and it avoids the overhead of scheduling a second fork. Forking both
      is valid too, but the fork-one/compute-one/join pattern is the canonical, efficient idiom recommended in the
      ForkJoinTask docs.
    ref: "concepts.md#fork-join-framework-and-work-stealing"

  - id: executor-framework-concurrency-utils-032
    difficulty: expert
    tags: [fork-join, common-pool, managed-blocker]
    question: |
      You must perform blocking IO inside tasks running on `ForkJoinPool.commonPool()`. What is the correct way to
      avoid starving the pool?
    options:
      - "Wrap the blocking call in a ForkJoinPool.ManagedBlocker so the pool can spawn a compensation thread while the worker is blocked."
      - "Increase the task threshold so fewer tasks are created."
      - "Call Thread.sleep(0) before blocking."
      - "There is nothing to worry about; the common pool grows unboundedly on demand."
    answer: 0
    explanation: |
      `ForkJoinPool.ManagedBlocker` tells the pool that a worker is about to block, allowing it to start a
      compensation thread so parallelism is maintained. Without it, blocking IO ties up the small common pool
      (~cores-1 threads) and starves every parallel stream and CompletableFuture async stage in the JVM. The
      common pool does not grow unboundedly.
    ref: "concepts.md#fork-join-framework-and-work-stealing"

  - id: executor-framework-concurrency-utils-033
    difficulty: beginner
    tags: [concurrent-hashmap, null]
    question: |
      What happens if you call `map.put(null, "x")` on a `ConcurrentHashMap`?
    options:
      - "It stores the entry with a null key."
      - "It silently ignores the call."
      - "It throws NullPointerException — null keys and values are not permitted."
      - "It replaces the entire map with a single null entry."
    answer: 2
    explanation: |
      `ConcurrentHashMap` forbids null keys AND null values, throwing `NullPointerException`. The rationale: in a
      concurrent map, a `get` returning null must unambiguously mean "no mapping," which conflicts with a stored
      null (you could not distinguish absence from a null value without extra locking). `HashMap` permits nulls
      because it is single-threaded by design.
    ref: "concepts.md#concurrent-collections"

  - id: executor-framework-concurrency-utils-034
    difficulty: intermediate
    tags: [concurrent-hashmap, internals, version]
    question: |
      How does `ConcurrentHashMap`'s locking model in Java 8+ differ from the Java 7 implementation?
    options:
      - "Java 8 locks the entire map on every write; Java 7 was lock-free."
      - "Java 8 removed thread safety and relies on volatile alone."
      - "Both use exactly one global lock."
      - "Java 7 used segment-based lock striping (default 16 segments); Java 8+ dropped segments in favor of CAS on empty bins plus synchronizing on the first node of a bin, and treeifies long bins."
    answer: 3
    explanation: |
      Java 7 divided the map into ~16 `Segment`s, each a separate lock (lock striping), so concurrency was capped
      by segment count. Java 8+ removed segments: empty bins are populated via CAS, and updates to a non-empty bin
      synchronize only on that bin's first node, giving finer-grained concurrency. Bins with >8 entries convert to
      red-black trees for O(log n) worst-case lookups.
    ref: "concepts.md#concurrent-collections"

  - id: executor-framework-concurrency-utils-035
    difficulty: intermediate
    tags: [copyonwritearraylist, use-case]
    question: |
      For which access pattern is `CopyOnWriteArrayList` the best fit?
    options:
      - "Read-mostly workloads where iterations vastly outnumber mutations (e.g., event listener lists)."
      - "Write-heavy workloads with frequent additions and removals."
      - "Large lists needing frequent random-index updates."
      - "A queue with high-throughput producer/consumer traffic."
    answer: 0
    explanation: |
      Every mutation copies the whole backing array, so writes are O(n) and expensive. Reads and iterations are
      lock-free and never block, making it ideal when reads dominate and writes are rare (classic case: a
      subscriber/listener registry). Write-heavy or high-throughput queue workloads should use other structures
      like `ConcurrentLinkedQueue` or a `BlockingQueue`.
    ref: "concepts.md#concurrent-collections"

  - id: executor-framework-concurrency-utils-036
    difficulty: intermediate
    tags: [blockingqueue, synchronousqueue]
    question: |
      What is distinctive about a `SynchronousQueue`?
    options:
      - "It has an unbounded capacity."
      - "It orders elements by priority."
      - "It has zero capacity — each insert must wait for a corresponding take, so it hands off elements directly between threads."
      - "It only releases elements after a per-element delay expires."
    answer: 2
    explanation: |
      `SynchronousQueue` holds no elements; a `put` blocks until another thread does a `take` (and vice versa),
      making it a direct hand-off channel. This is exactly why `newCachedThreadPool` uses it — a task is either
      immediately taken by an idle thread or triggers creation of a new one. Priority ordering is
      `PriorityBlockingQueue`; delay-based release is `DelayQueue`.
    ref: "concepts.md#concurrent-collections"

  - id: executor-framework-concurrency-utils-037
    difficulty: advanced
    tags: [concurrent-hashmap, iterator]
    question: |
      What does "weakly consistent" mean for a `ConcurrentHashMap` iterator?
    options:
      - "It throws ConcurrentModificationException if the map changes during iteration."
      - "It always reflects every concurrent modification in real time."
      - "It locks the entire map for the duration of iteration."
      - "It never throws ConcurrentModificationException, traverses elements as they existed at some point, and may or may not reflect modifications made after the iterator was created."
    answer: 3
    explanation: |
      Weakly consistent iterators tolerate concurrent modification: they never throw
      `ConcurrentModificationException`, are guaranteed to traverse elements once, and may (but need not) reflect
      updates that happen after creation. Consequently `size()` and `isEmpty()` are only estimates in a concurrent
      setting. This contrasts with the fail-fast iterators of `HashMap`/`ArrayList`.
    ref: "concepts.md#concurrent-collections"

  - id: executor-framework-concurrency-utils-038
    difficulty: expert
    tags: [concurrent-hashmap, computeifabsent, gotcha]
    question: |
      What is the danger of performing another update to the SAME `ConcurrentHashMap` inside a
      `computeIfAbsent` mapping function for a different-but-hash-colliding key?
    options:
      - "The mapping function runs while holding the bin lock, so a recursive update to the same map can deadlock or throw an IllegalStateException ('Recursive update')."
      - "Nothing; it is fully supported and recommended."
      - "It silently corrupts the map's size counter only."
      - "It converts the map to a synchronized HashMap."
    answer: 0
    explanation: |
      `computeIfAbsent` executes the mapping function while holding the lock on the target bin's first node.
      Mutating the same map from inside that function (especially colliding into the locked bin) can deadlock;
      modern JDKs detect some cases and throw `IllegalStateException: Recursive update`. The remapping/compute
      functions should be short and must not update the same map.
    ref: "concepts.md#concurrent-collections"

  - id: executor-framework-concurrency-utils-039
    difficulty: beginner
    tags: [reentrantlock, basics]
    question: |
      What is the idiomatic way to release a `ReentrantLock`?
    options:
      - "Call unlock() at the end of the try block."
      - "Rely on garbage collection to release it."
      - "Call unlock() inside a finally block so it is released even if the critical section throws."
      - "Locks release automatically at method return like synchronized."
    answer: 2
    explanation: |
      Unlike `synchronized` (which auto-releases on block exit), an explicit `Lock` must be released manually.
      The safe idiom is `lock.lock(); try { ... } finally { lock.unlock(); }` so an exception in the critical
      section cannot leave the lock held forever. Placing `unlock()` inside the try body risks skipping it on
      exception.
    ref: "concepts.md#locks-reentrantlock-readwritelock-and-stampedlock"

  - id: executor-framework-concurrency-utils-040
    difficulty: intermediate
    tags: [reentrantlock, features]
    question: |
      Which capability does `ReentrantLock` offer that intrinsic `synchronized` locking does NOT?
    options:
      - "Reentrancy (acquiring the same lock multiple times in one thread)."
      - "Memory visibility guarantees."
      - "Mutual exclusion."
      - "Timed and interruptible lock acquisition via tryLock(timeout) and lockInterruptibly(), plus optional fairness and multiple Conditions."
    answer: 3
    explanation: |
      Both provide reentrancy, mutual exclusion, and happens-before visibility. `ReentrantLock` adds
      `tryLock()`/`tryLock(timeout, unit)` (give up or wait with a deadline), `lockInterruptibly()`, optional
      fairness (FIFO ordering), and multiple `Condition` wait-sets per lock — none of which `synchronized`
      supports.
    ref: "concepts.md#locks-reentrantlock-readwritelock-and-stampedlock"

  - id: executor-framework-concurrency-utils-041
    difficulty: advanced
    tags: [readwritelock, downgrade]
    question: |
      Regarding `ReentrantReadWriteLock`, which statement is correct?
    options:
      - "Lock downgrading (hold write, acquire read, then release write) is supported, but upgrading a read lock to a write lock is not and will deadlock."
      - "Lock upgrading (read lock -> write lock while holding read) is fully supported and safe."
      - "Multiple writers may hold the write lock simultaneously."
      - "Readers and a writer can hold their locks at the same time."
    answer: 0
    explanation: |
      `ReentrantReadWriteLock` allows downgrading — a thread holding the write lock can acquire the read lock and
      then release the write lock, transitioning smoothly to read access. Upgrading (read → write) is NOT
      supported: if two readers both tried to upgrade, neither could proceed, so an attempt deadlocks. Only one
      writer is allowed, and writers exclude readers.
    ref: "concepts.md#locks-reentrantlock-readwritelock-and-stampedlock"

  - id: executor-framework-concurrency-utils-042
    difficulty: advanced
    tags: [stampedlock, optimistic-read, version]
    question: |
      `StampedLock` (Java 8) offers an optimistic read mode. How is it used correctly?
    options:
      - "Acquire tryOptimisticRead(), read the fields, then call validate(stamp); if validation fails (a write intervened), fall back to a pessimistic readLock()."
      - "Acquire readLock(), then call validate() to confirm no other reader is active."
      - "Call tryOptimisticRead() and trust the values unconditionally without validating."
      - "Optimistic reads acquire the write lock briefly to guarantee consistency."
    answer: 0
    explanation: |
      `tryOptimisticRead()` returns a stamp WITHOUT acquiring any lock. You read the fields into locals, then call
      `validate(stamp)`; if it returns false, a writer modified the state, so you must retry under a real
      `readLock()`. Never trust the values without validating. This gives near-zero read overhead when writes are
      rare.
    ref: "concepts.md#locks-reentrantlock-readwritelock-and-stampedlock"

  - id: executor-framework-concurrency-utils-043
    difficulty: expert
    tags: [stampedlock, restrictions]
    question: |
      Which of the following is a genuine restriction of `StampedLock`?
    options:
      - "It cannot be used for read/write coordination."
      - "It only works with virtual threads."
      - "It is NOT reentrant, does not support Condition objects, and is not a fair lock."
      - "It requires all access to occur on a single thread."
    answer: 2
    explanation: |
      `StampedLock` is deliberately not reentrant (re-acquiring in the same thread can deadlock), it provides no
      `Condition` support, and it offers no fairness policy. It also does not track ownership. These trade-offs buy
      its high performance and the optimistic-read capability, but they make it a poor drop-in replacement for
      `ReentrantLock` when you need those features.
    ref: "concepts.md#locks-reentrantlock-readwritelock-and-stampedlock"

  - id: executor-framework-concurrency-utils-044
    difficulty: intermediate
    tags: [reentrantlock, fairness]
    question: |
      What does constructing `new ReentrantLock(true)` (fair mode) change?
    options:
      - "It makes the lock non-reentrant."
      - "It makes lock/unlock operations atomic, which the default does not guarantee."
      - "It disables the lock's Condition support."
      - "It grants the lock approximately in FIFO arrival order, avoiding starvation at the cost of lower throughput."
    answer: 3
    explanation: |
      A fair `ReentrantLock` hands the lock to the longest-waiting thread (FIFO), which prevents starvation but
      generally reduces throughput because of reduced barging and more context switching. The default (unfair)
      lock allows barging — a thread may grab a just-released lock ahead of queued waiters — which is faster in
      practice.
    ref: "concepts.md#locks-reentrantlock-readwritelock-and-stampedlock"

  - id: executor-framework-concurrency-utils-045
    difficulty: beginner
    tags: [countdownlatch, basics]
    question: |
      Which statement about `CountDownLatch` is TRUE?
    options:
      - "It is a one-shot device: once the count reaches zero it cannot be reset or reused."
      - "It is reusable and resets automatically after reaching zero."
      - "Only one thread may ever call await()."
      - "countDown() blocks until the count reaches zero."
    answer: 0
    explanation: |
      A `CountDownLatch` starts at a count and counts down via `countDown()` (non-blocking). Threads calling
      `await()` block until the count hits zero, after which the latch is permanently open — it cannot be reset.
      For a reusable rendezvous you need `CyclicBarrier` or `Phaser`.
    ref: "concepts.md#synchronizers-countdownlatch-cyclicbarrier-semaphore-and-phaser"

  - id: executor-framework-concurrency-utils-046
    difficulty: intermediate
    tags: [countdownlatch-vs-cyclicbarrier, comparison]
    question: |
      Which is the key difference between `CountDownLatch` and `CyclicBarrier`?
    options:
      - "CountDownLatch supports a barrier action; CyclicBarrier does not."
      - "CyclicBarrier can only be used by exactly two threads."
      - "CountDownLatch is one-shot and any thread can count it down, whereas CyclicBarrier is reusable and the participating threads wait on each other, optionally running a barrier action."
      - "There is no functional difference; the names are interchangeable."
    answer: 2
    explanation: |
      `CountDownLatch` is single-use; its count can be decremented by ANY thread and waiters proceed once it hits
      zero. `CyclicBarrier` is reusable (auto-resets each cycle), the parties themselves rendezvous by each calling
      `await()`, and it can run an optional barrier action on the last arriver. If a waiter is interrupted/timed
      out, a `CyclicBarrier` breaks with `BrokenBarrierException`.
    ref: "concepts.md#synchronizers-countdownlatch-cyclicbarrier-semaphore-and-phaser"

  - id: executor-framework-concurrency-utils-047
    difficulty: intermediate
    tags: [semaphore, basics]
    question: |
      What is the primary purpose of a `Semaphore`?
    options:
      - "To count down to zero and then permanently open."
      - "To synchronize threads at the end of each iteration of a loop."
      - "To guarantee a single thread owns a lock and only that thread can release it."
      - "To limit the number of threads concurrently accessing a resource by managing a set of permits."
    answer: 3
    explanation: |
      A `Semaphore` maintains a set of permits; `acquire()` blocks until one is free and `release()` returns one,
      bounding concurrent access (e.g., limiting simultaneous connections to K). Notably, unlike a
      `ReentrantLock`, permits have no ownership — a permit acquired by one thread can be released by another. That
      ownership guarantee is the lock's job.
    ref: "concepts.md#synchronizers-countdownlatch-cyclicbarrier-semaphore-and-phaser"

  - id: executor-framework-concurrency-utils-048
    difficulty: advanced
    tags: [phaser, version]
    question: |
      What makes `Phaser` (Java 7) more flexible than a combination of `CountDownLatch` and `CyclicBarrier`?
    options:
      - "It supports a dynamically changing number of registered parties and multiple phases, making it ideal for staged, multi-round computations where participants join or leave."
      - "It can only handle a fixed number of parties known at construction time."
      - "It is faster because it avoids all memory-visibility guarantees."
      - "It replaces locks entirely."
    answer: 0
    explanation: |
      `Phaser` allows parties to `register()` and `arriveAndDeregister()` dynamically and coordinates across
      multiple phases (`arriveAndAwaitAdvance()`), so participant count can change between rounds. This suits
      iterative algorithms with a variable set of workers — something neither the one-shot latch nor the
      fixed-party barrier handles gracefully.
    ref: "concepts.md#synchronizers-countdownlatch-cyclicbarrier-semaphore-and-phaser"

  - id: executor-framework-concurrency-utils-049
    difficulty: expert
    tags: [aqs, internals]
    question: |
      Most JUC locks and synchronizers (ReentrantLock, Semaphore, CountDownLatch) are built on which underlying
      framework?
    options:
      - "The Fork/Join framework."
      - "Direct use of Object.wait()/notify()."
      - "AbstractQueuedSynchronizer (AQS), which manages a volatile int state via CAS and a CLH-based FIFO wait queue."
      - "The Disruptor ring buffer."
    answer: 2
    explanation: |
      `AbstractQueuedSynchronizer` (AQS) is the backbone of `ReentrantLock`, `Semaphore`, `CountDownLatch`,
      `ReentrantReadWriteLock`, and more. It represents synchronization state as a `volatile int` updated with CAS
      and parks/unparks waiters via a CLH-derived FIFO queue. Subclasses implement `tryAcquire`/`tryRelease` (or
      shared variants) to define their semantics.
    ref: "concepts.md#synchronizers-countdownlatch-cyclicbarrier-semaphore-and-phaser"

  - id: executor-framework-concurrency-utils-050
    difficulty: beginner
    tags: [virtual-threads, version]
    question: |
      In which JDK release did virtual threads (Project Loom) become a FINAL (non-preview) feature?
    options:
      - "JDK 17"
      - "JDK 19"
      - "JDK 20"
      - "JDK 21"
    answer: 3
    explanation: |
      Virtual threads were finalized in JDK 21 via JEP 444. They were previewed earlier: JEP 425 (Preview) in JDK
      19 and JEP 436 (Second Preview) in JDK 20. JDK 21 is an LTS release, so this is a common version question.
    ref: "concepts.md#virtual-threads-and-modern-executors"

  - id: executor-framework-concurrency-utils-051
    difficulty: intermediate
    tags: [virtual-threads, executor]
    question: |
      Which executor, added in JDK 21, creates a new virtual thread for each submitted task?
    options:
      - "Executors.newFixedThreadPool(1000)"
      - "Executors.newCachedThreadPool()"
      - "Executors.newWorkStealingPool()"
      - "Executors.newVirtualThreadPerTaskExecutor()"
    answer: 3
    explanation: |
      `Executors.newVirtualThreadPerTaskExecutor()` (JDK 21) starts a fresh virtual thread per task. Because
      virtual threads are cheap, this scales to millions of concurrent tasks and is the recommended pattern —
      you do NOT pool virtual threads. The other factories create platform-thread pools.
    ref: "concepts.md#virtual-threads-and-modern-executors"

  - id: executor-framework-concurrency-utils-052
    difficulty: advanced
    tags: [virtual-threads, pinning]
    question: |
      In JDK 21, what is "pinning" of a virtual thread, and when does it occur?
    options:
      - "When a virtual thread cannot unmount from its carrier thread — notably while executing inside a synchronized block/method or a native/JNI call — potentially exhausting carrier threads."
      - "When a virtual thread is permanently bound to the main thread for its whole life."
      - "When too many virtual threads share one CPU core."
      - "When a virtual thread is garbage collected while running."
    answer: 0
    explanation: |
      A pinned virtual thread cannot be unmounted from its carrier platform thread while it blocks, so it ties up
      a carrier. In JDK 21 this happens inside `synchronized` blocks/methods and during native/JNI calls. The
      guidance was to prefer `ReentrantLock` over `synchronized` on hot blocking paths; later JDKs reduced pinning
      significantly.
    ref: "concepts.md#virtual-threads-and-modern-executors"

  - id: executor-framework-concurrency-utils-053
    difficulty: expert
    tags: [structured-concurrency, version]
    question: |
      What is the status of Structured Concurrency (`StructuredTaskScope`) in JDK 21?
    options:
      - "Finalized as a stable API in JDK 21."
      - "Removed from the JDK entirely."
      - "Still a PREVIEW feature in JDK 21 (JEP 453), requiring --enable-preview; its API is not final."
      - "Available only in JDK 17."
    answer: 2
    explanation: |
      Structured concurrency remained a PREVIEW feature in JDK 21 (JEP 453), after incubating via JEP 428 in JDK
      19. It requires `--enable-preview` and its API may still change — so it must NOT be described as a finalized
      Java 21 feature, unlike virtual threads (JEP 444), which were final in 21.
    ref: "concepts.md#virtual-threads-and-modern-executors"

  - id: executor-framework-concurrency-utils-054
    difficulty: advanced
    tags: [virtual-threads, anti-pattern]
    question: |
      Which practice is an ANTI-pattern with virtual threads in JDK 21?
    options:
      - "Writing straightforward blocking, sequential code inside them."
      - "Using a Semaphore when you specifically need to limit concurrency to a downstream resource."
      - "Creating one virtual thread per task."
      - "Pooling virtual threads in a fixed-size pool to reuse them."
    answer: 3
    explanation: |
      Virtual threads are cheap and disposable, so pooling them (as you would platform threads) adds no value and
      reintroduces the very bottleneck they eliminate — you should create one per task. Blocking sequential code is
      exactly their strength, and a `Semaphore` is the correct tool to limit concurrency (do not try to limit it by
      capping thread count).
    ref: "concepts.md#virtual-threads-and-modern-executors"

  - id: executor-framework-concurrency-utils-055
    difficulty: intermediate
    tags: [executorservice, autocloseable, version]
    question: |
      Since JDK 19, `ExecutorService` implements `AutoCloseable`. What does its `close()` method do when used in a
      try-with-resources block?
    options:
      - "It initiates an orderly shutdown and blocks until all previously submitted tasks complete (or the thread is interrupted)."
      - "It immediately calls shutdownNow() and discards running tasks."
      - "It only closes the underlying queue and leaves threads running."
      - "Nothing; it is a no-op for compatibility."
    answer: 0
    explanation: |
      `ExecutorService` became `AutoCloseable` in JDK 19, so `try (var e = Executors...) { ... }` calls `close()`,
      which performs `shutdown()` and then awaits termination of all submitted tasks (retrying `shutdownNow` if
      interrupted). This pairs elegantly with `newVirtualThreadPerTaskExecutor()` for fan-out/await patterns.
    ref: "concepts.md#virtual-threads-and-modern-executors"

  - id: executor-framework-concurrency-utils-056
    difficulty: advanced
    tags: [completablefuture, code-analysis]
    question: |
      What does this print?
      ```
      CompletableFuture.supplyAsync(() -> 10)
          .thenApply(x -> x / 0)
          .exceptionally(ex -> -1)
          .thenAccept(System.out::println);
      ```
    options:
      - "10"
      - "0"
      - "-1"
      - "It throws ArithmeticException on the main thread."
    answer: 2
    explanation: |
      `thenApply(x -> x / 0)` throws `ArithmeticException`, completing that stage exceptionally. `exceptionally`
      catches the failure and substitutes `-1`, so the downstream `thenAccept` prints `-1`. The exception is
      confined to the pipeline (wrapped in `CompletionException` internally) and does not escape to the main
      thread here.
    ref: "concepts.md#future-and-completablefuture"

  - id: executor-framework-concurrency-utils-057
    difficulty: expert
    tags: [threadpoolexecutor, code-analysis]
    question: |
      A `ThreadPoolExecutor(1, 1, 0, SECONDS, new ArrayBlockingQueue<>(1), new AbortPolicy())` receives three
      tasks in quick succession, each of which runs for a long time. What happens to the THIRD task?
    options:
      - "It runs immediately on a new thread."
      - "It is queued behind the second task."
      - "It is rejected with RejectedExecutionException because the single thread is busy and the capacity-1 queue already holds the second task."
      - "It replaces the second task in the queue."
    answer: 2
    explanation: |
      Task 1 occupies the single core thread. Task 2 goes into the capacity-1 queue. Task 3 cannot start a new
      thread (max = 1) and cannot be queued (queue full), so the `AbortPolicy` handler throws
      `RejectedExecutionException`. This illustrates how bounded queues plus a small max produce rejection —
      exactly the back-pressure signal unbounded queues hide.
    ref: "concepts.md#executor-executorservice-and-threadpoolexecutor"

  - id: executor-framework-concurrency-utils-058
    difficulty: intermediate
    tags: [blockingqueue, producer-consumer]
    question: |
      In a `BlockingQueue`, which pair of methods BLOCKS the caller when the queue is full (on insert) or empty
      (on remove)?
    options:
      - "offer / poll"
      - "add / remove"
      - "put / take"
      - "peek / element"
    answer: 2
    explanation: |
      `put` blocks until space is available; `take` blocks until an element is present — the backbone of the
      producer-consumer pattern. `offer`/`poll` are non-blocking (or timed) and return a status/null. `add`/`remove`
      throw exceptions on capacity/empty. `peek`/`element` just inspect the head.
    ref: "concepts.md#concurrent-collections"

  - id: executor-framework-concurrency-utils-059
    difficulty: advanced
    tags: [semaphore-vs-lock, ownership]
    question: |
      Which statement about a binary `Semaphore` (1 permit) versus a `ReentrantLock` is correct?
    options:
      - "They are identical in every respect."
      - "A ReentrantLock has no ownership, but a semaphore does."
      - "A binary semaphore lacks ownership — a permit acquired by one thread can be released by another — whereas a ReentrantLock is owned and must be released by the acquiring thread, and it is reentrant."
      - "A binary semaphore is reentrant while a ReentrantLock is not."
    answer: 2
    explanation: |
      A binary semaphore can mimic mutual exclusion, but permits are not owned: any thread may `release()` a
      permit it never acquired, and semaphores are not reentrant. A `ReentrantLock` tracks the owning thread
      (releasing from a non-owner throws `IllegalMonitorStateException`) and supports reentrant re-acquisition.
      Choose the lock when you need ownership/reentrancy, the semaphore when you need to bound concurrency.
    ref: "concepts.md#synchronizers-countdownlatch-cyclicbarrier-semaphore-and-phaser"

  - id: executor-framework-concurrency-utils-060
    difficulty: expert
    tags: [cyclicbarrier, code-analysis, broken-barrier]
    question: |
      Five threads share `new CyclicBarrier(5)` and all call `await()`. One of the five is interrupted while
      waiting. What do the OTHER four threads observe?
    options:
      - "They proceed normally as if nothing happened."
      - "They receive a TimeoutException."
      - "They deadlock forever with no exception."
      - "They each receive a BrokenBarrierException because the barrier is broken when a waiting party is interrupted."
    answer: 3
    explanation: |
      If a thread waiting at a `CyclicBarrier` is interrupted (or times out), the barrier enters a BROKEN state:
      the interrupted thread gets `InterruptedException`, and all other waiting parties receive
      `BrokenBarrierException`. The barrier must be `reset()` before reuse. This all-or-nothing behavior is a key
      contrast with `CountDownLatch`.
    ref: "concepts.md#synchronizers-countdownlatch-cyclicbarrier-semaphore-and-phaser"

  - id: executor-framework-concurrency-utils-061
    difficulty: advanced
    tags: [completablefuture, allof, code-analysis]
    question: |
      `CompletableFuture.allOf(cf1, cf2, cf3)` returns what type, and what does it complete with?
    options:
      - "CompletableFuture<Void> that completes when all three complete; you must read each future's own result separately."
      - "CompletableFuture<List<T>> completed with all three results."
      - "CompletableFuture<T> completed with the first result."
      - "void, running synchronously."
    answer: 0
    explanation: |
      `allOf(...)` returns `CompletableFuture<Void>` — it signals completion of all supplied futures but does not
      aggregate their results. To collect values you typically call `join()`/`get()` on each individual future
      after the `allOf` completes (often inside a `thenApply`). `anyOf` returns `CompletableFuture<Object>` with the
      first completed result.
    ref: "concepts.md#future-and-completablefuture"

  - id: executor-framework-concurrency-utils-062
    difficulty: intermediate
    tags: [invokeall, invokeany]
    question: |
      What is the difference between `ExecutorService.invokeAll` and `invokeAny`?
    options:
      - "invokeAll returns after the first task completes; invokeAny waits for all."
      - "They are synonyms."
      - "invokeAll runs all tasks and returns a List of Futures once all complete (or timeout); invokeAny returns the result of the first task to complete successfully and cancels the rest."
      - "invokeAny throws if more than one task is submitted."
    answer: 2
    explanation: |
      `invokeAll(tasks)` submits every `Callable`, blocks until all finish (or the optional timeout), and returns a
      `List<Future>` in the same order. `invokeAny(tasks)` returns the result of ANY one that completes
      successfully first, cancelling the others — useful for redundant queries where the fastest answer wins.
    ref: "concepts.md#executor-executorservice-and-threadpoolexecutor"

  - id: executor-framework-concurrency-utils-063
    difficulty: beginner
    tags: [decoupling, concept]
    question: |
      What core design benefit does the Executor framework provide over `new Thread(r).start()`?
    options:
      - "It runs tasks faster by skipping the JVM scheduler."
      - "It guarantees tasks never throw exceptions."
      - "It eliminates the need for any synchronization."
      - "It decouples task submission from execution policy (thread creation, pooling, scheduling, queueing), letting you tune concurrency independently of business logic."
    answer: 3
    explanation: |
      The framework's central idea is separating WHAT (the task) from HOW it runs (the execution policy). You can
      swap thread pools, queue types, and rejection policies without touching task code, and you avoid the cost and
      risk of manually managing raw threads. It does not remove the need for synchronization or exception handling.
    ref: "concepts.md#executor-executorservice-and-threadpoolexecutor"

  - id: executor-framework-concurrency-utils-064
    difficulty: advanced
    tags: [copyonwritearraylist, iterator, code-analysis]
    question: |
      A thread iterates a `CopyOnWriteArrayList` while another thread calls `add(...)` mid-iteration. What does the
      iterating thread see, and can it call `iterator.remove()`?
    options:
      - "It iterates over a snapshot taken at iterator creation (does not see the added element), and iterator.remove()/set()/add() throw UnsupportedOperationException."
      - "It sees the new element and remove() works normally."
      - "It throws ConcurrentModificationException."
      - "It blocks until the add completes."
    answer: 0
    explanation: |
      `CopyOnWriteArrayList` iterators operate on an immutable snapshot of the array captured when the iterator was
      created, so concurrent additions are invisible to that iteration and no `ConcurrentModificationException`
      occurs. Because the snapshot is immutable, the iterator's mutating operations (`remove`, `set`, `add`) throw
      `UnsupportedOperationException`.
    ref: "concepts.md#concurrent-collections"

  - id: executor-framework-concurrency-utils-065
    difficulty: expert
    tags: [scheduled-executor, fixed-rate, code-analysis]
    question: |
      A task scheduled with `scheduleAtFixedRate(task, 0, 1, SECONDS)` consistently takes 2.5 seconds per run in a
      single-threaded scheduled pool. What is the observable behavior?
    options:
      - "Multiple copies of the task run concurrently to keep pace with the 1s rate."
      - "The scheduler throws IllegalStateException because the task is too slow."
      - "Executions do not overlap; each run starts only after the previous finishes, so the task effectively runs back-to-back roughly every 2.5s and never catches up to the intended 1s rate."
      - "The task is silently skipped whenever it overruns."
    answer: 2
    explanation: |
      `scheduleAtFixedRate` never runs a given periodic task concurrently with itself; if a run overruns the
      period, the next execution is delayed until the current one completes, then runs immediately. With a 2.5s
      task and a 1s period, runs happen back-to-back every ~2.5s — the task perpetually lags the nominal schedule.
      A pool with more threads still won't overlap the same periodic task.
    ref: "concepts.md#scheduledexecutorservice"

  - id: executor-framework-concurrency-utils-066
    difficulty: expert
    tags: [concurrent-hashmap, happens-before, memory-model]
    question: |
      Which memory-visibility guarantee do JUC concurrent collections and synchronizers provide?
    options:
      - "None; you must add your own volatile fields for visibility."
      - "They only guarantee visibility on single-core machines."
      - "They guarantee sequential consistency across the entire program."
      - "Actions in a thread before placing an object into a concurrent collection (or before release/countDown/await) happen-before actions in another thread that access/remove it (or after the matching acquire)."
    answer: 3
    explanation: |
      The JUC classes establish happens-before edges: writes made before an element is put into a concurrent
      collection are visible to a thread that later reads/removes it, and likewise for
      release/acquire, countDown/await, and unlock/lock pairs. This lets you safely publish data between threads
      without extra volatile fields — a cornerstone guarantee documented in the java.util.concurrent package spec.
    ref: "concepts.md#concurrent-collections"
