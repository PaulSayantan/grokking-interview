topic: "Multithreading and Concurrency Fundamentals"
domain: java-jvm
topic_slug: multithreading-concurrency
version: 1
questions:
  - id: multithreading-concurrency-001
    difficulty: beginner
    tags: [thread-lifecycle, states]
    question: |
        A thread has been created with `new Thread(task)` but `start()` has not
        yet been called. What does `thread.getState()` return?
    options:
      - "NEW"
      - "RUNNABLE"
      - "WAITING"
      - "TERMINATED"
    answer: 0
    explanation: |
        Before start() is called the thread is in the NEW state. It moves to
        RUNNABLE only after start(). WAITING requires a blocking call like wait()/
        join(), and TERMINATED means run() has already completed.
    ref: "concepts.md#thread-lifecycle-and-states"
  - id: multithreading-concurrency-002
    difficulty: beginner
    tags: [thread-lifecycle, start]
    question: |
        What happens if you call `start()` twice on the same Thread instance?
    options:
      - "The second call is a no-op and returns silently."
      - "It runs the task a second time on a new thread."
      - "It throws IllegalThreadStateException."
      - "It throws InterruptedException."
    answer: 2
    explanation: |
        A Thread can only be started once; calling start() on an already-started
        or terminated thread throws IllegalThreadStateException. You cannot restart
        a terminated thread.
    ref: "concepts.md#thread-lifecycle-and-states"
  - id: multithreading-concurrency-003
    difficulty: intermediate
    tags: [thread-lifecycle, run-vs-start]
    question: |
        ```java
        Thread t = new Thread(() -> System.out.println(Thread.currentThread().getName()));
        t.run();   // note: run(), not start()
        ```
        Running this from the main thread prints what, and why?
    options:
      - "Thread-0, because run() spawns a new thread named Thread-0"
      - "Nothing at all, because run() stays inert until start() is invoked"
      - "It throws IllegalThreadStateException because start() was skipped"
      - "main, because run() executes synchronously on the calling (main) thread"
    answer: 3
    explanation: |
        Calling run() directly is an ordinary method call on the current thread —
        no new thread is created. So it prints the caller's name, "main". Only
        start() creates a new thread of execution (which would print "Thread-0").
    ref: "concepts.md#thread-lifecycle-and-states"
  - id: multithreading-concurrency-004
    difficulty: intermediate
    tags: [thread-lifecycle, blocked, waiting]
    question: |
        A thread is currently executing a blocking socket read (network I/O).
        Assuming no Java monitor is involved, what state does `getState()` report?
    options:
      - "BLOCKED, because any thread blocked on I/O reports BLOCKED"
      - "RUNNABLE, because BLOCKED is reserved for waiting on a monitor lock"
      - "WAITING, because it waits indefinitely for the socket data"
      - "TIMED_WAITING, because socket reads always carry a timeout"
    answer: 1
    explanation: |
        Thread.State.BLOCKED specifically means waiting to acquire a Java monitor
        (synchronized) lock. A thread blocked on OS-level I/O is still reported as
        RUNNABLE — the JVM does not distinguish "running" from "blocked in a native
        I/O call" in the State enum.
    ref: "concepts.md#thread-lifecycle-and-states"
  - id: multithreading-concurrency-005
    difficulty: advanced
    tags: [thread-lifecycle, wait, monitor]
    question: |
        A thread that had called `obj.wait()` is now notified. Which sequence of
        states does it pass through before it can continue executing after wait()?
    options:
      - "WAITING then directly RUNNABLE, since it was notified"
      - "TIMED_WAITING then RUNNABLE once the monitor is reacquired"
      - "WAITING then BLOCKED (re-acquiring the monitor) then RUNNABLE"
      - "BLOCKED then WAITING then RUNNABLE after the notification"
    answer: 2
    explanation: |
        wait() releases the monitor while waiting (WAITING). On notification the
        thread must re-acquire the monitor before wait() can return; while
        contending for that lock it is BLOCKED, then RUNNABLE once it holds the
        lock again.
    ref: "concepts.md#thread-lifecycle-and-states"
  - id: multithreading-concurrency-006
    difficulty: beginner
    tags: [runnable, callable, interfaces]
    question: |
        Which statement about Runnable and Callable is correct?
    options:
      - "Callable.call() can return a value and throw checked exceptions; Runnable.run() can do neither."
      - "Runnable.run() returns a value while Callable.call() returns void and cannot."
      - "Both were introduced in Java 8 as the standard functional interfaces."
      - "Runnable can throw checked exceptions from run() but Callable cannot."
    answer: 0
    explanation: |
        Callable<V>.call() returns V and may throw checked exceptions. Runnable.run()
        returns void and cannot throw checked exceptions. Runnable dates to Java 1.0;
        Callable was added in Java 5 (both later usable as lambdas in Java 8, but
        neither was introduced in 8).
    ref: "concepts.md#runnable-vs-thread-vs-callable"
  - id: multithreading-concurrency-007
    difficulty: beginner
    tags: [runnable, thread, design]
    question: |
        Why is implementing Runnable generally preferred over extending Thread?
    options:
      - "Runnable runs measurably faster than Thread at the JVM bytecode level because it skips native setup."
      - "Only Runnable can be submitted to an ExecutorService, because Callable is rejected by submit()."
      - "Thread cannot be used with lambdas but Runnable can, so Runnable is always faster to write."
      - "Extending Thread uses your single-inheritance slot and couples task to mechanism; Runnable keeps them separate and reusable."
    answer: 3
    explanation: |
        Runnable separates the task (what to do) from execution (how it runs), and
        leaves your class free to extend something else. There is no inherent
        performance difference. Both Runnable and Callable can be submitted to an
        executor.
    ref: "concepts.md#runnable-vs-thread-vs-callable"
  - id: multithreading-concurrency-008
    difficulty: intermediate
    tags: [callable, future, executor]
    question: |
        ```java
        ExecutorService pool = Executors.newFixedThreadPool(1);
        Future<Integer> f = pool.submit(() -> { throw new IllegalStateException("boom"); });
        // ... later
        f.get();
        ```
        What happens at `f.get()`?
    options:
      - "It returns null since the exception was silently swallowed by the pool."
      - "It throws ExecutionException wrapping the IllegalStateException."
      - "It throws the IllegalStateException directly, entirely unwrapped."
      - "It throws InterruptedException from the get() call."
    answer: 1
    explanation: |
        Exceptions thrown by a submitted task are captured by the Future and
        rethrown from get() wrapped in an ExecutionException (getCause() is the
        original IllegalStateException). InterruptedException is only thrown if the
        waiting thread is interrupted.
    ref: "concepts.md#runnable-vs-thread-vs-callable-execution-model"
  - id: multithreading-concurrency-009
    difficulty: intermediate
    tags: [executor, submit, execute]
    question: |
        What is the key behavioral difference between `ExecutorService.submit(task)`
        and `Executor.execute(runnable)` regarding exceptions?
    options:
      - "submit returns a Future and captures the exception for rethrow at get(); execute has no Future and lets the exception reach the uncaught-exception handler."
      - "Both return a Future, but only execute captures the exception for later rethrow."
      - "execute runs the task asynchronously while submit blocks and runs it synchronously."
      - "submit swallows all exceptions permanently, whereas execute always crashes the whole JVM."
    answer: 0
    explanation: |
        submit() returns a Future; a thrown exception is stored and surfaces
        (wrapped) when you call get(). execute() returns void and any exception
        propagates to the thread's UncaughtExceptionHandler. Both are asynchronous.
    ref: "concepts.md#runnable-vs-thread-vs-callable-execution-model"
  - id: multithreading-concurrency-010
    difficulty: advanced
    tags: [executor, shutdown]
    question: |
        What is the difference between `shutdown()` and `shutdownNow()` on an
        ExecutorService?
    options:
      - "shutdown() immediately interrupts every running task while shutdownNow() politely waits for them to finish."
      - "They are identical aliases that behave exactly the same way at runtime."
      - "shutdown() stops accepting new tasks but lets queued/running tasks finish; shutdownNow() attempts to interrupt running tasks and returns the queued, never-started tasks."
      - "shutdown() terminates the whole JVM process while shutdownNow() merely pauses the pool temporarily."
    answer: 2
    explanation: |
        shutdown() is a graceful drain: no new tasks accepted, already-submitted
        ones complete. shutdownNow() tries to interrupt actively running tasks and
        returns the list of tasks that were queued but never started. Neither
        forcibly kills threads — cancellation is cooperative.
    ref: "concepts.md#runnable-vs-thread-vs-callable-execution-model"
  - id: multithreading-concurrency-011
    difficulty: expert
    tags: [callable, futuretask, adapters]
    question: |
        Which statement about FutureTask and Executors.callable() is correct?
    options:
      - "FutureTask implements Callable but not Runnable, so it can only be submitted, never run directly."
      - "Executors.callable(Runnable) returns a Callable whose call() returns the Runnable's own return value from run()."
      - "Executors.callable() converts a Callable into a Runnable whose run() is allowed to throw checked exceptions."
      - "FutureTask implements both Runnable and Future, wrapping a Callable (or Runnable); Executors.callable(Runnable) adapts a Runnable to a Callable that returns null (or a supplied result)."
    answer: 3
    explanation: |
        FutureTask is both Runnable and Future, wrapping a Callable/Runnable so it
        can be run and its result retrieved. Executors.callable(Runnable) adapts a
        Runnable (which has no return value) into a Callable returning null, or a
        caller-supplied fixed result.
    ref: "concepts.md#runnable-vs-thread-vs-callable"
  - id: multithreading-concurrency-012
    difficulty: beginner
    tags: [race-condition, atomicity]
    question: |
        Two threads each execute `count++` 1000 times on a shared non-synchronized
        `int count` starting at 0. What is the danger?
    options:
      - "count will always end up exactly 2000 because ++ is atomic on primitive ints."
      - "Lost updates: count++ is a non-atomic read-modify-write, so interleavings can lose increments and the final value may be < 2000."
      - "The program throws ConcurrentModificationException on the shared int field."
      - "count will always end up negative due to signed integer overflow wrapping."
    answer: 1
    explanation: |
        count++ is three steps (read, add, write) and is not atomic. Two threads can
        read the same value and both write back the same incremented value, losing
        an update. This is a classic race condition; the result is a value at most
        2000 and often less.
    ref: "concepts.md#race-conditions-deadlock-livelock-and-starvation"
  - id: multithreading-concurrency-013
    difficulty: intermediate
    tags: [deadlock, coffman]
    question: |
        Two threads acquire locks A and B in opposite orders and deadlock. Which
        single strategy most directly prevents this specific circular-wait
        deadlock?
    options:
      - "Increase the scheduling priority of both threads so neither stalls waiting."
      - "Replace every synchronized block with volatile fields for mutual exclusion."
      - "Acquire the locks in a globally consistent order in every thread."
      - "Give each thread its own private copy of both lock objects."
    answer: 2
    explanation: |
        Deadlock here is caused by inconsistent lock ordering (circular wait).
        Enforcing a single global lock-acquisition order breaks the circular-wait
        Coffman condition. Priorities don't prevent deadlock, volatile provides no
        mutual exclusion, and separate locks would break the intended mutual
        exclusion.
    ref: "concepts.md#race-conditions-deadlock-livelock-and-starvation"
  - id: multithreading-concurrency-014
    difficulty: intermediate
    tags: [livelock, deadlock]
    question: |
        Which best distinguishes livelock from deadlock?
    options:
      - "In deadlock threads are blocked and make no progress; in livelock threads remain active (RUNNABLE) and keep reacting to each other but still make no progress."
      - "Livelock always throws a runtime exception when detected, whereas deadlock never surfaces any exception."
      - "Deadlock only happens with volatile variables, while livelock arises exclusively from monitor locks."
      - "They are the exact same phenomenon simply described at different CPU clock speeds."
    answer: 0
    explanation: |
        Deadlocked threads are stuck (BLOCKED/WAITING) holding resources. Livelocked
        threads are not blocked — they run and continually respond to each other
        (e.g., repeatedly backing off) but accomplish nothing. Randomized backoff is
        a common fix for livelock.
    ref: "concepts.md#race-conditions-deadlock-livelock-and-starvation"
  - id: multithreading-concurrency-015
    difficulty: advanced
    tags: [starvation, fairness, reentrantlock]
    question: |
        A low-priority thread repeatedly fails to acquire a heavily contended lock
        while other threads keep grabbing it. Which mechanism most directly
        addresses this starvation?
    options:
      - "Marking the shared data volatile so the waiting thread sees updates sooner."
      - "Calling System.gc() periodically to nudge the scheduler toward the waiter."
      - "Promoting the low-priority thread to a daemon thread so it acquires the lock first."
      - "Using a fair lock, e.g. new ReentrantLock(true), which grants the lock in approximate FIFO order."
    answer: 3
    explanation: |
        Starvation from lock unfairness is mitigated by a fair lock
        (ReentrantLock(true)), which hands the lock to the longest-waiting thread
        rather than allowing barging. Fairness reduces starvation at some throughput
        cost. Volatile, GC, and daemon status are irrelevant here.
    ref: "concepts.md#race-conditions-deadlock-livelock-and-starvation"
  - id: multithreading-concurrency-016
    difficulty: expert
    tags: [deadlock, coffman-conditions]
    question: |
        Which set correctly lists the four Coffman conditions that must ALL hold
        for a deadlock to be possible?
    options:
      - "Atomicity, visibility, ordering, fairness"
      - "Mutual exclusion, hold-and-wait, no preemption, circular wait"
      - "Starvation, livelock, priority inversion, spurious wakeup"
      - "Race condition, memory barrier, happens-before, safe publication"
    answer: 1
    explanation: |
        The four Coffman conditions are mutual exclusion, hold-and-wait, no
        preemption, and circular wait. Removing any one prevents deadlock — e.g.,
        breaking circular wait via consistent lock ordering, or breaking
        hold-and-wait via tryLock with backoff.
    ref: "concepts.md#race-conditions-deadlock-livelock-and-starvation"
  - id: multithreading-concurrency-017
    difficulty: beginner
    tags: [wait, notify, monitor]
    question: |
        Where must you be to legally call `obj.wait()`?
    options:
      - "Inside a synchronized block/method holding obj's monitor."
      - "Anywhere in the code, as long as the obj reference is not null."
      - "Only inside a static method declared on obj's own class."
      - "Only on the main application thread, never a worker thread."
    answer: 0
    explanation: |
        wait(), notify(), and notifyAll() require the calling thread to own the
        object's monitor. You must call them inside a synchronized block on that
        same object, otherwise IllegalMonitorStateException is thrown.
    ref: "concepts.md#wait-notify-and-notifyall-with-intrinsic-locks"
  - id: multithreading-concurrency-018
    difficulty: intermediate
    tags: [wait, spurious-wakeup, guarded-block]
    question: |
        Why should a wait() call be placed inside a `while (!condition)` loop rather
        than an `if (!condition)`?
    options:
      - "Because while loops execute measurably faster than equivalent if statements here."
      - "Because an if statement is syntactically forbidden from containing a wait() call."
      - "To guard against spurious wakeups and stolen wakeups: on return the condition must be re-checked, and if still false the thread must wait again."
      - "Because notify() only ever delivers its signal to threads waiting inside while loops."
    answer: 2
    explanation: |
        A thread may wake spuriously (without notification) or lose the race to
        another consumer after notifyAll (stolen wakeup). Re-checking the condition
        in a while loop and re-waiting if it is still false is the only correct
        pattern; an if would let the thread proceed with a false condition.
    ref: "concepts.md#wait-notify-and-notifyall-with-intrinsic-locks"
  - id: multithreading-concurrency-019
    difficulty: intermediate
    tags: [notify, notifyall]
    question: |
        Which statement about notify() vs notifyAll() is correct?
    options:
      - "notify() wakes every waiting thread at once, while notifyAll() deterministically wakes exactly one chosen waiter."
      - "Both methods wake all waiting threads identically; the only difference between them is raw runtime performance."
      - "notifyAll() releases waiting threads in a strict first-in-first-out order that the JVM specification formally guarantees."
      - "notify() wakes one arbitrary waiting thread; notifyAll() wakes all waiters, which then compete to re-acquire the monitor."
    answer: 3
    explanation: |
        notify() wakes a single, arbitrarily chosen waiter; notifyAll() wakes all
        waiters (which then contend for the monitor one at a time). notifyAll is
        safer when waiters aren't interchangeable, since notify can wake the "wrong"
        thread and cause a hang. No FIFO order is guaranteed.
    ref: "concepts.md#wait-notify-and-notifyall-with-intrinsic-locks"
  - id: multithreading-concurrency-020
    difficulty: advanced
    tags: [wait, sleep, locks]
    question: |
        Which of the following releases the monitor lock it holds while it pauses?
    options:
      - "Thread.sleep(1000) invoked from inside the synchronized block"
      - "obj.wait() (called while synchronized on obj)"
      - "Thread.yield() called while the thread still holds the monitor"
      - "A busy-wait spin loop reading a volatile flag"
    answer: 1
    explanation: |
        Only wait() atomically releases the monitor while the thread is parked (and
        re-acquires it on return). sleep() and yield() do NOT release any lock they
        hold — a common source of unexpected contention. A spin loop obviously holds
        whatever it holds.
    ref: "concepts.md#wait-notify-and-notifyall-with-intrinsic-locks"
  - id: multithreading-concurrency-021
    difficulty: expert
    tags: [missed-signal, wait, notify]
    question: |
        A consumer checks a condition without holding the lock, then a producer
        calls notify() before the consumer calls wait(). What is the classic bug?
    options:
      - "A deadlock, because notify() blocks the producer until the consumer eventually calls a matching wait()."
      - "An IllegalMonitorStateException thrown on the consumer because it checked the condition outside the lock."
      - "A missed signal (lost notification): notifications are not queued, so the wait() begins after the notify and may block forever."
      - "Nothing at all; wait() transparently replays the most recent buffered notification the moment it is finally called."
    answer: 2
    explanation: |
        Notifications are not stored; if notify() runs before the consumer is
        actually waiting, the signal is lost and the consumer can block forever.
        Holding the same lock during the state change and the wait, plus the
        while-loop condition check, prevents this missed-signal (lost-wakeup) bug.
    ref: "concepts.md#wait-notify-and-notifyall-with-intrinsic-locks"
  - id: multithreading-concurrency-022
    difficulty: expert
    tags: [condition, reentrantlock, wait-notify]
    question: |
        What advantage does Condition (from ReentrantLock.newCondition(), Java 5)
        offer over a single object's wait/notify?
    options:
      - "Condition supports multiple independent wait-sets per lock, so producers and consumers can await/signal on separate conditions."
      - "Condition removes the need for any locking, since await() and signal() work correctly without holding the lock."
      - "Condition guarantees that spurious wakeups can never occur, so a plain if-check around await() is always sufficient."
      - "Condition is inherently faster because it parks threads entirely in user space and never involves the OS scheduler."
    answer: 0
    explanation: |
        A single intrinsic monitor has exactly one wait-set. ReentrantLock can create
        multiple Conditions (e.g., notFull and notEmpty), letting you signal exactly
        the right group. Spurious wakeups can still occur, so await() still needs a
        while-loop condition check.
    ref: "concepts.md#wait-notify-and-notifyall-with-intrinsic-locks"
  - id: multithreading-concurrency-023
    difficulty: beginner
    tags: [join]
    question: |
        What does calling `t.join()` do?
    options:
      - "It merges thread t's call stack into the current thread's stack so they share one execution context."
      - "It lazily starts thread t if it has not been started yet, then returns without waiting."
      - "It interrupts thread t, setting its interrupt flag and unblocking any blocking call it is in."
      - "It makes the calling thread wait until thread t terminates."
    answer: 3
    explanation: |
        join() blocks the caller until the target thread t completes (reaches
        TERMINATED). It does not start or interrupt t; it is purely a wait-for-
        completion operation.
    ref: "concepts.md#join"
  - id: multithreading-concurrency-024
    difficulty: intermediate
    tags: [join, timeout]
    question: |
        What does `t.join(0)` mean?
    options:
      - "Return immediately without waiting, since a timeout of 0 means poll-and-continue."
      - "Wait indefinitely until t terminates (same as join())."
      - "Wait exactly 0 milliseconds and then throw a TimeoutException back to the caller."
      - "Wait until the next garbage-collection cycle completes before returning to the caller."
    answer: 1
    explanation: |
        join(0) is defined as "wait forever" — identical to the no-arg join(). A
        positive timeout waits at most that many milliseconds and then returns
        regardless of whether t finished (no TimeoutException is thrown by join).
    ref: "concepts.md#join"
  - id: multithreading-concurrency-025
    difficulty: advanced
    tags: [join, wait, internals]
    question: |
        join() is internally implemented using which mechanism, and what is the
        practical consequence?
    options:
      - "It uses wait() on the Thread object (the JVM notifies on termination); consequence: you should never call wait/notify on a Thread object yourself."
      - "It uses Thread.sleep in a fixed 10ms loop; consequence: it wastes CPU and adds latency detecting termination."
      - "It uses a busy-spin polling getState() until TERMINATED; consequence: it pins a core and never yields the CPU."
      - "It uses LockSupport.park with no matching unpark on termination; consequence: a completed join() can never wake up."
    answer: 0
    explanation: |
        Classic join() waits on the Thread object's monitor, and the JVM calls
        notifyAll on that Thread when it terminates. Because of this, calling
        wait()/notify() on a Thread instance yourself can interfere with join()'s
        correctness.
    ref: "concepts.md#join"
  - id: multithreading-concurrency-026
    difficulty: beginner
    tags: [thread-safety, immutability]
    question: |
        Which of these is inherently thread-safe with no external synchronization?
    options:
      - "A mutable ArrayList shared across threads, since its internal array resize is atomic under the JMM."
      - "A plain non-volatile int field incremented by many threads, because single-word writes are always safe."
      - "A properly constructed immutable object (all fields final, no mutation, no this-escape)."
      - "A HashMap written to concurrently by multiple threads, as its bucket entries are independently locked."
    answer: 2
    explanation: |
        Immutable objects cannot change state after construction, so concurrent
        reads are always safe (and final fields have JMM publication guarantees).
        The other options involve unsynchronized shared mutable state and are not
        thread-safe.
    ref: "concepts.md#thread-safety-strategies"
  - id: multithreading-concurrency-027
    difficulty: intermediate
    tags: [thread-safety, concurrenthashmap, compound-action]
    question: |
        ```java
        ConcurrentHashMap<String,Integer> map = new ConcurrentHashMap<>();
        if (!map.containsKey(k)) {   // (1)
            map.put(k, 0);           // (2)
        }
        ```
        Why is this still racy despite ConcurrentHashMap being thread-safe?
    options:
      - "ConcurrentHashMap is not actually thread-safe; its per-bucket locking was removed after Java 7."
      - "containsKey acquires a segment lock that the following put cannot re-enter, so the pair self-deadlocks."
      - "ConcurrentHashMap throws ConcurrentModificationException here because the map is structurally modified during the check."
      - "The check-then-act across (1) and (2) is a compound action; two threads can both pass the check and both put. Use putIfAbsent/computeIfAbsent instead."
    answer: 3
    explanation: |
        Each individual method is atomic, but the containsKey-then-put sequence is
        not. Two threads can both see the key absent and both put. Atomic compound
        operations like putIfAbsent or computeIfAbsent close this window.
    ref: "concepts.md#thread-safety-strategies"
  - id: multithreading-concurrency-028
    difficulty: advanced
    tags: [thread-safety, collections, iteration]
    question: |
        You wrap a list with `Collections.synchronizedList(list)`. Which statement
        is true?
    options:
      - "Iteration over the wrapper is automatically thread-safe with no extra work, since the iterator locks per element."
      - "Individual method calls are synchronized, but iterating (for-each) still requires client-side synchronization on the returned list to avoid ConcurrentModificationException."
      - "It is measurably faster than ConcurrentHashMap for concurrent maps because it avoids CAS retry overhead."
      - "It permits null-free concurrent iteration by internally partitioning the list into independently striped lock segments."
    answer: 1
    explanation: |
        synchronizedList synchronizes each individual method, but a compound
        operation like iteration is not atomic — you must manually synchronize on
        the wrapper collection during the whole iteration, or risk
        ConcurrentModificationException. Concurrent collections like
        CopyOnWriteArrayList avoid this.
    ref: "concepts.md#thread-safety-strategies"
  - id: multithreading-concurrency-029
    difficulty: expert
    tags: [thread-safety, longadder, atomic]
    question: |
        Under very high write contention on a single counter, why can LongAdder
        (Java 8) outperform AtomicLong?
    options:
      - "LongAdder uses a single volatile field with no CAS, relying purely on cache-line flushes for correctness."
      - "AtomicLong acquires an internal synchronized lock on each update, whereas LongAdder is entirely lock-free."
      - "LongAdder spreads updates across multiple internal cells to reduce CAS contention, summing them on read; AtomicLong hammers one memory location with contended CAS."
      - "LongAdder guarantees a strictly stronger, linearizable consistency model than AtomicLong for concurrent readers."
    answer: 2
    explanation: |
        LongAdder maintains a set of striped cells so concurrent updates hit
        different memory locations, reducing CAS failures/retries under contention;
        sum() aggregates them. AtomicLong updates one location and suffers heavy CAS
        contention. This is a throughput trade-off, not a consistency guarantee.
    ref: "concepts.md#thread-safety-strategies"
  - id: multithreading-concurrency-030
    difficulty: beginner
    tags: [visibility, volatile, flag]
    question: |
        A worker loops `while (running) { ... }` where a non-volatile boolean
        `running` is set to false by another thread. What can go wrong?
    options:
      - "The worker may never see the updated value (visibility problem) and loop forever, because without volatile/synchronization the write may not be visible."
      - "Nothing at all; the loop always observes the change immediately because boolean writes flush caches instantly."
      - "A NullPointerException is thrown the first time the worker reads the boxed boolean flag after it is cleared."
      - "The JVM refuses to compile the code because a shared boolean loop condition must be declared volatile."
    answer: 0
    explanation: |
        Without volatile or other synchronization there is no happens-before edge,
        so the writer's update to running may never be observed by the reader (it can
        cache the value). Declaring running volatile fixes the visibility problem.
    ref: "concepts.md#atomicity-visibility-and-ordering"
  - id: multithreading-concurrency-031
    difficulty: intermediate
    tags: [volatile, atomicity]
    question: |
        Given `volatile int count;`, is `count++` thread-safe across multiple
        threads?
    options:
      - "Yes, volatile makes ++ atomic by fusing the read, add, and write into one hardware instruction."
      - "Yes, but only for a 32-bit int; the same guarantee does not extend to a 64-bit long or double."
      - "No, because volatile fields are read-only after initialization and cannot be incremented at all."
      - "No; volatile guarantees visibility and ordering but not atomicity of the read-modify-write, so count++ can still lose updates."
    answer: 3
    explanation: |
        volatile ensures each read/write is visible and ordered, but count++ is a
        compound read-modify-write; two threads can interleave and lose updates.
        Use AtomicInteger.incrementAndGet() or a lock for atomic increments.
    ref: "concepts.md#atomicity-visibility-and-ordering"
  - id: multithreading-concurrency-032
    difficulty: advanced
    tags: [happens-before, jmm]
    question: |
        Which of the following establishes a happens-before relationship in the
        Java Memory Model?
    options:
      - "Two threads running concurrently with no shared synchronization, as long as they touch distinct cache lines."
      - "An unlock of a monitor happens-before every subsequent lock of that same monitor."
      - "Reading a non-volatile field happens-before another thread later writes that same field."
      - "A higher-priority thread's actions happen-before those of any lower-priority thread scheduled after it."
    answer: 1
    explanation: |
        Monitor unlock happens-before subsequent lock of the same monitor is a core
        JMM edge (along with volatile write-before-read, Thread.start, and join).
        Priorities and unsynchronized access create no happens-before ordering.
    ref: "concepts.md#atomicity-visibility-and-ordering"
  - id: multithreading-concurrency-033
    difficulty: advanced
    tags: [atomicity, long, double, jls]
    question: |
        According to the Java Language Specification, which assignment is NOT
        guaranteed to be atomic (may be seen half-written) without volatile?
    options:
      - "Writing a long or double field (64-bit), which may be split into two 32-bit writes."
      - "Writing a 32-bit int field, which the JLS permits to tear into two 16-bit halfword stores."
      - "Writing a reference field, which may be observed half-published on 64-bit compressed-oops JVMs."
      - "Writing a boolean field, which can be seen in an intermediate state during bit-packing into a byte."
    answer: 0
    explanation: |
        JLS §17.7 allows non-volatile long and double (64-bit) writes to be treated
        as two separate 32-bit operations, so another thread could observe a torn
        value. int, reference, and boolean writes are atomic. Declaring the field
        volatile makes 64-bit access atomic.
    ref: "concepts.md#atomicity-visibility-and-ordering"
  - id: multithreading-concurrency-034
    difficulty: expert
    tags: [final, safe-publication, jmm]
    question: |
        What special guarantee does the JMM give for `final` fields of a properly
        constructed object?
    options:
      - "final fields can never be read by more than one thread at a time, since the JMM serializes access to them."
      - "final fields are always stored in a per-thread local copy that the JMM never shares across threads."
      - "Any thread that obtains a reference to the object (after construction, with no this-escape) is guaranteed to see the correctly initialized final field values without extra synchronization."
      - "final fields force the entire enclosing object to behave as if every one of its fields were declared volatile."
    answer: 2
    explanation: |
        The final-field freeze semantics (JSR-133) guarantee that once construction
        completes without leaking this, any thread seeing the reference sees the
        correct final field values — the basis for safe publication of immutable
        objects and String's thread safety. It does not restrict readers or make the
        object volatile.
    ref: "concepts.md#atomicity-visibility-and-ordering"
  - id: multithreading-concurrency-035
    difficulty: beginner
    tags: [daemon-threads, shutdown]
    question: |
        What is the defining property of a daemon thread?
    options:
      - "It always runs at the highest possible priority, preempting any user thread that competes for the CPU."
      - "It automatically restarts from the beginning if its run() method crashes with an uncaught exception."
      - "It cannot access shared heap memory and is confined to its own private thread-local address space."
      - "It does not prevent the JVM from exiting; the JVM shuts down when only daemon threads remain."
    answer: 3
    explanation: |
        A daemon thread is a background thread that the JVM will not wait for at
        shutdown. Once all non-daemon (user) threads finish, the JVM exits and
        abandons daemons. Priority, auto-restart, and memory access are unrelated.
    ref: "concepts.md#daemon-threads"
  - id: multithreading-concurrency-036
    difficulty: intermediate
    tags: [daemon-threads, setdaemon]
    question: |
        ```java
        Thread t = new Thread(task);
        t.start();
        t.setDaemon(true);   // <-- here
        ```
        What happens?
    options:
      - "The thread silently becomes a daemon, since setDaemon(true) is honored at any point in its lifecycle."
      - "It throws IllegalThreadStateException because setDaemon must be called before start()."
      - "It throws InterruptedException because reclassifying a live thread interrupts its current execution."
      - "Nothing happens at runtime, but the compiler rejects the setDaemon(true) call as unreachable after start()."
    answer: 1
    explanation: |
        Daemon status can only be changed before the thread is started. Calling
        setDaemon() on an already-started thread throws IllegalThreadStateException.
        It compiles fine; the error is at runtime.
    ref: "concepts.md#daemon-threads"
  - id: multithreading-concurrency-037
    difficulty: advanced
    tags: [daemon-threads, cleanup]
    question: |
        Why should you avoid using daemon threads for tasks that must flush buffers
        or release external resources on completion?
    options:
      - "Daemon threads run on a throttled low-priority scheduler too slow to flush large buffers in time."
      - "Daemon threads are sandboxed by the JVM and structurally forbidden from opening any files."
      - "At JVM shutdown daemon threads are abruptly abandoned; their finally blocks and cleanup logic may not run."
      - "Daemon threads always throw an IOException the moment they touch any external resource."
    answer: 2
    explanation: |
        Because the JVM does not wait for daemons, it can terminate them mid-
        execution at shutdown, so finally blocks and resource cleanup may never
        execute — risking data loss or leaked resources. Use user threads or explicit
        shutdown hooks for critical cleanup.
    ref: "concepts.md#daemon-threads"
  - id: multithreading-concurrency-038
    difficulty: expert
    tags: [daemon-threads, virtual-threads, jdk21]
    question: |
        Which statement about virtual threads (JEP 444, final in JDK 21) and daemon
        status is correct?
    options:
      - "Virtual threads are always daemon threads; you cannot make one non-daemon, so the JVM will not stay alive solely because virtual threads are running."
      - "Virtual threads are always user (non-daemon) threads, so they keep the JVM alive."
      - "Virtual threads ignore daemon status entirely and behave like user threads at shutdown."
      - "Virtual threads inherit daemon status from the platform thread that carries them at that instant."
    answer: 0
    explanation: |
        Virtual threads are always daemon threads; setDaemon(false) on one throws.
        Consequently a JVM will exit even if virtual threads are still running,
        unless a user thread keeps it alive. This is why you typically block a
        non-daemon thread (or the main thread) while virtual-thread work completes.
    ref: "concepts.md#daemon-threads"
  - id: multithreading-concurrency-039
    difficulty: beginner
    tags: [threadlocal]
    question: |
        What does ThreadLocal<T> provide?
    options:
      - "A single value shared by every thread but guarded by an implicit per-access monitor lock."
      - "A wrapper that freezes any object's fields, making the wrapped instance deeply immutable."
      - "A concurrent FIFO queue that all threads publish to and drain from in a shared buffer."
      - "A separate, independent copy of a variable for each thread that accesses it."
    answer: 3
    explanation: |
        ThreadLocal gives each thread its own isolated value; get()/set() operate on
        the calling thread's copy and threads never see each other's values. It is a
        form of thread confinement, not sharing or locking.
    ref: "concepts.md#threadlocal"
  - id: multithreading-concurrency-040
    difficulty: intermediate
    tags: [threadlocal, simpledateformat]
    question: |
        A common use of ThreadLocal is to hold a SimpleDateFormat instance. Why?
    options:
      - "SimpleDateFormat is already immutable, so wrapping it in a ThreadLocal only serves to speed up its formatting."
      - "SimpleDateFormat is not thread-safe; giving each thread its own instance avoids shared-state corruption without locking on every format call."
      - "ThreadLocal parallelises SimpleDateFormat so a single instance can parse many dates concurrently."
      - "The java.time API mandates a ThreadLocal-held SimpleDateFormat for any date parsing."
    answer: 1
    explanation: |
        SimpleDateFormat holds mutable internal state and is not thread-safe; sharing
        one across threads corrupts output. A ThreadLocal gives each thread its own
        instance, avoiding both corruption and lock contention. (java.time's
        DateTimeFormatter, Java 8, is immutable/thread-safe and needs no ThreadLocal.)
    ref: "concepts.md#threadlocal"
  - id: multithreading-concurrency-041
    difficulty: advanced
    tags: [threadlocal, memory-leak, thread-pool]
    question: |
        Why can ThreadLocal cause a memory leak in a thread pool, and what prevents
        it?
    options:
      - "Because pooled threads live indefinitely and the ThreadLocalMap holds values by strong reference; the value is not collected until overwritten or removed. Calling remove() (usually in finally) prevents the leak."
      - "Because the ThreadLocalMap keys are strong references that pin every entry forever, and no API can ever remove them."
      - "Because each ThreadLocal quietly spawns a dedicated background thread that never terminates and accumulates over time."
      - "It cannot leak at all; the garbage collector proactively clears every ThreadLocal value the instant a task completes."
    answer: 0
    explanation: |
        A Thread's ThreadLocalMap uses weak keys but strong values. In a pool the
        thread outlives the task, so the stored value survives until overwritten,
        potentially leaking large objects (and their loaders). Always call remove()
        in a finally block for pooled/web threads.
    ref: "concepts.md#threadlocal"
  - id: multithreading-concurrency-042
    difficulty: expert
    tags: [threadlocal, scoped-values, virtual-threads]
    question: |
        Regarding context propagation with millions of virtual threads (JDK 21),
        which statement is accurate?
    options:
      - "ScopedValue (JEP 429) was finalized in JDK 21 as the mandatory replacement for ThreadLocal."
      - "ThreadLocal is explicitly forbidden on virtual threads and throws UnsupportedOperationException the first time get() or set() is called."
      - "ScopedValue is the intended modern, immutable, bounded-lifetime alternative to ThreadLocal, but it was still a preview/incubating feature in JDK 21 (not final)."
      - "InheritableThreadLocal automatically re-propagates its value across thread-pool boundaries every time a pooled worker picks up a new task."
    answer: 2
    explanation: |
        ScopedValue targets the same problem (implicit context) with immutable,
        structured, bounded-lifetime semantics that scale to many virtual threads,
        but it was a preview/incubating API in JDK 21 — not finalized. ThreadLocal
        still works on virtual threads. InheritableThreadLocal copies parent-to-child
        at creation, not across pool reuse.
    ref: "concepts.md#threadlocal"
  - id: multithreading-concurrency-043
    difficulty: beginner
    tags: [interrupt, cancellation]
    question: |
        What does calling `t.interrupt()` do to a running (non-blocked) thread t?
    options:
      - "It forcibly stops and kills t immediately, unwinding its stack and releasing every monitor it holds."
      - "It throws an InterruptedException on the calling thread, which must be caught wherever interrupt() is invoked."
      - "It suspends t indefinitely and keeps it parked until a second interrupt() call is issued to resume it."
      - "It sets t's interrupt status flag; t must check the flag and choose to stop (cooperative cancellation)."
    answer: 3
    explanation: |
        Interruption is cooperative: interrupt() only sets a flag (or wakes a
        blocking call). A running thread must poll isInterrupted() and stop
        voluntarily. Java has no safe forced-kill; Thread.stop() was removed/degraded
        for that reason.
    ref: "concepts.md#interrupt-mechanism"
  - id: multithreading-concurrency-044
    difficulty: intermediate
    tags: [interrupt, interrupted, flag]
    question: |
        Which difference between `Thread.interrupted()` and `isInterrupted()` is
        correct?
    options:
      - "Both methods read and then clear the interrupt flag as an identical side effect of the query."
      - "Thread.interrupted() is static, checks the CURRENT thread, and CLEARS the flag; isInterrupted() is an instance method that checks a thread and does NOT clear the flag."
      - "Neither method clears the flag; both are pure read-only queries that leave the interrupt status untouched."
      - "isInterrupted() clears the flag on every read, whereas the static Thread.interrupted() only ever reports it."
    answer: 1
    explanation: |
        Thread.interrupted() is static, operates on the current thread, and clears
        the interrupt status as a side effect. isInterrupted() is an instance method
        that queries a thread's status without clearing it. Confusing them causes
        lost interrupts.
    ref: "concepts.md#interrupt-mechanism"
  - id: multithreading-concurrency-045
    difficulty: advanced
    tags: [interrupt, interruptedexception, best-practice]
    question: |
        ```java
        try {
            queue.take();
        } catch (InterruptedException e) {
            // ??? what belongs here
        }
        ```
        What is the correct minimal handling if this method does not itself
        propagate InterruptedException?
    options:
      - "Leave the catch block completely empty, since take() has already fully consumed and handled the interrupt for you."
      - "Call System.exit(0) so the whole JVM shuts down cleanly in response to the cancellation request."
      - "Call Thread.currentThread().interrupt() to restore the flag (which the exception cleared), then unwind, so callers can still observe the cancellation."
      - "Wrap and rethrow it as an unchecked RuntimeException, deliberately leaving the interrupt flag cleared for callers."
    answer: 2
    explanation: |
        Catching InterruptedException clears the interrupt flag. If you don't
        re-propagate the exception, you should restore the status via
        Thread.currentThread().interrupt() so higher-level code (and thread pools)
        can still detect the cancellation. Swallowing it silently is a classic bug.
    ref: "concepts.md#interrupt-mechanism"
  - id: multithreading-concurrency-046
    difficulty: advanced
    tags: [interrupt, blocking-io]
    question: |
        Which operation will NOT be unblocked by calling interrupt() on the thread?
    options:
      - "A thread blocked reading from a classic InputStream (e.g., socket read) or waiting to enter a synchronized block"
      - "A thread parked in Object.wait() waiting for a monitor notification from another thread"
      - "A thread suspended inside Thread.sleep() for a fixed number of milliseconds"
      - "A thread blocked in BlockingQueue.take() waiting for an element to be enqueued"
    answer: 0
    explanation: |
        wait(), sleep(), join(), and interruptible j.u.c. calls (like
        BlockingQueue.take) respond to interruption by throwing InterruptedException.
        A plain blocking InputStream read and contention for a synchronized monitor
        are NOT interruptible — the flag is set but the thread keeps blocking.
    ref: "concepts.md#interrupt-mechanism"
  - id: multithreading-concurrency-047
    difficulty: expert
    tags: [interrupt, exception, flag-state]
    question: |
        When a thread blocked in sleep()/wait() is interrupted and throws
        InterruptedException, what is the state of its interrupt flag inside the
        catch block?
    options:
      - "The flag remains set (true) inside the catch, because interrupt() set it and throwing preserves that status."
      - "The flag is left unspecified and varies by JVM vendor, so portable code cannot rely on either value."
      - "The flag toggles its value on each subsequent read, alternating between true and false as you poll it."
      - "The flag is cleared (false), because throwing InterruptedException resets the interrupt status."
    answer: 3
    explanation: |
        When a blocking method throws InterruptedException it clears the interrupt
        status as part of throwing. So inside the catch the flag is false — which is
        exactly why the recommended practice is to call
        Thread.currentThread().interrupt() to restore it if you don't rethrow.
    ref: "concepts.md#interrupt-mechanism"
  - id: multithreading-concurrency-048
    difficulty: beginner
    tags: [producer-consumer, blockingqueue]
    question: |
        In the producer-consumer pattern, what is the primary role of a bounded
        BlockingQueue?
    options:
      - "To automatically sort every enqueued item by priority before any consumer can take it."
      - "To decouple producers from consumers and apply backpressure: block producers when full and consumers when empty."
      - "To guarantee that each item is always processed on the very same thread that produced it."
      - "To deep-copy and make every item immutable as it passes through the queue's internal buffer."
    answer: 1
    explanation: |
        A bounded BlockingQueue decouples the two sides and provides backpressure —
        put() blocks when full and take() blocks when empty — so a fast producer
        cannot overwhelm a slow consumer. It does not sort (unless it is a priority
        queue) or make items immutable.
    ref: "concepts.md#producer-consumer"
  - id: multithreading-concurrency-049
    difficulty: intermediate
    tags: [blockingqueue, methods]
    question: |
        For a full ArrayBlockingQueue, which method BLOCKS the caller until space
        becomes available?
    options:
      - "put(e)"
      - "offer(e)"
      - "add(e)"
      - "poll()"
    answer: 0
    explanation: |
        put() blocks until space is available. offer(e) returns false immediately
        (or after a timeout), add(e) throws IllegalStateException when full, and
        poll() is a non-blocking take. The blocking put/take pair is the classic
        producer-consumer choice.
    ref: "concepts.md#producer-consumer"
  - id: multithreading-concurrency-050
    difficulty: advanced
    tags: [blockingqueue, synchronousqueue]
    question: |
        What distinguishes a SynchronousQueue from ArrayBlockingQueue/
        LinkedBlockingQueue?
    options:
      - "SynchronousQueue has effectively unlimited capacity and buffers as many elements as memory allows."
      - "SynchronousQueue keeps its internal buffer ordered by element priority using a comparator."
      - "SynchronousQueue has zero capacity: each put must directly hand off to a corresponding take (no element is stored)."
      - "SynchronousQueue is not thread-safe and needs external synchronization on every put and take."
    answer: 2
    explanation: |
        SynchronousQueue holds no elements; every insert must wait for a matching
        remove (direct handoff), and vice versa. It is used, for example, by
        Executors.newCachedThreadPool to hand tasks directly to threads. The others
        buffer elements.
    ref: "concepts.md#producer-consumer"
  - id: multithreading-concurrency-051
    difficulty: expert
    tags: [producer-consumer, poison-pill, shutdown]
    question: |
        What is the "poison pill" technique in a BlockingQueue-based producer-
        consumer system?
    options:
      - "Throwing a deliberate RuntimeException into the queue so every consumer crashes and stops draining work."
      - "Calling shutdownNow() on the executor so it interrupts every consumer immediately and discards queued items."
      - "Dynamically resizing the queue's capacity down to zero at runtime so no further items can be enqueued."
      - "Placing a special sentinel object on the queue that signals consumers to stop when they take it."
    answer: 3
    explanation: |
        A poison pill is a distinguished sentinel value enqueued after real work; a
        consumer that takes it knows to terminate. With N consumers you typically
        enqueue N pills (or re-enqueue). It provides an orderly, in-band shutdown
        without interrupting mid-item.
    ref: "concepts.md#producer-consumer"
  - id: multithreading-concurrency-052
    difficulty: intermediate
    tags: [thread-lifecycle, deprecated]
    question: |
        Why were Thread.stop(), suspend(), and resume() deprecated (and later
        degraded to throw in modern JDKs)?
    options:
      - "They were too slow for modern multicore hardware and added unacceptable per-call scheduling overhead."
      - "They are fundamentally unsafe — e.g., stop() releases locks abruptly leaving objects in inconsistent state, and suspend() can hold locks and cause deadlock."
      - "They only ever worked correctly on the Windows JVM and behaved unpredictably on Linux and macOS."
      - "They were simply replaced by byte-for-byte identical methods that run faster under the same names."
    answer: 1
    explanation: |
        stop() forcibly throws ThreadDeath at an arbitrary point and releases all
        monitors, potentially leaving shared objects half-updated; suspend() can hold
        locks while frozen, deadlocking anyone needing them. These are unfixable
        design flaws, so cooperative interruption replaced them.
    ref: "concepts.md#thread-lifecycle-and-states"
  - id: multithreading-concurrency-053
    difficulty: advanced
    tags: [executor, future, completablefuture, java8]
    question: |
        Which is a genuine advantage of CompletableFuture (Java 8) over a plain
        Future?
    options:
      - "CompletableFuture deliberately cannot be cancelled once started, which makes it inherently safer than a plain Future."
      - "A plain Future runs its task asynchronously while a CompletableFuture always executes its stages synchronously on the caller."
      - "CompletableFuture supports non-blocking composition and callbacks (thenApply, thenCompose, thenCombine, allOf), whereas Future offers only blocking get() and cancel()."
      - "Only a CompletableFuture can ever be returned by ExecutorService.submit(); a plain Future cannot be produced that way."
    answer: 2
    explanation: |
        Future exposes only get()/cancel()/isDone; you must block to consume the
        result. CompletableFuture (Java 8) adds a fluent, non-blocking composition
        and callback API for chaining and combining async stages. submit() returns a
        plain Future, not a CompletableFuture.
    ref: "concepts.md#runnable-vs-thread-vs-callable-execution-model"
  - id: multithreading-concurrency-054
    difficulty: expert
    tags: [virtual-threads, jdk21, jep444]
    question: |
        Which Java release FINALIZED virtual threads, and what problem do they
        solve versus platform threads?
    options:
      - "JDK 21 (JEP 444); they make thread-per-request scale by being cheap user-mode threads multiplexed onto few OS carrier threads, so blocking a virtual thread does not tie up an OS thread."
      - "JDK 17; they replace the garbage collector with a thread-based reclamation model for heap management."
      - "JDK 19; they were made a final, production-ready feature there as JEP 425 well before JDK 21."
      - "JDK 16; they were finalized alongside records and pattern matching in that same release."
    answer: 0
    explanation: |
        Virtual threads were previewed in JDK 19 (JEP 425) and 20, and FINALIZED in
        JDK 21 as JEP 444. They are lightweight threads scheduled by the JVM onto a
        small pool of OS carrier threads; a blocking call unmounts the virtual thread
        instead of blocking an OS thread, letting simple thread-per-request code
        scale to millions of concurrent tasks.
    ref: "concepts.md#runnable-vs-thread-vs-callable"
  - id: multithreading-concurrency-055
    difficulty: intermediate
    tags: [thread-safety, confinement]
    question: |
        Which strategy makes shared data safe by NOT sharing it at all?
    options:
      - "Lock striping, splitting one lock into several independent segment locks"
      - "Double-checked locking guarded by a volatile lazily-initialized field"
      - "Compare-and-swap retry loops updating one shared atomic memory location"
      - "Thread confinement (e.g., ThreadLocal or stack-confined locals)"
    answer: 3
    explanation: |
        Thread confinement keeps data accessible to only one thread (via ThreadLocal
        or by never letting a local escape the stack), eliminating the need for
        synchronization. The other techniques manage genuinely shared mutable state.
    ref: "concepts.md#thread-safety-strategies"
  - id: multithreading-concurrency-056
    difficulty: advanced
    tags: [visibility, ordering, reordering]
    question: |
        Which statement about instruction reordering in the JMM is correct?
    options:
      - "Reordering never happens on the JVM, which always executes bytecode in strict program order."
      - "Within a single thread execution appears sequential (as-if-serial), but another thread may observe reorderings unless a happens-before edge forbids them."
      - "Reordering only ever affects volatile fields; plain non-volatile field accesses are never reordered."
      - "The CPU never reorders memory operations; only the compiler rearranges them during optimization."
    answer: 1
    explanation: |
        Compilers and CPUs may reorder operations for performance. A single thread
        always sees its own actions as-if-serial, but other threads can observe
        out-of-order effects on shared data unless happens-before (via volatile,
        locks, final, etc.) constrains the ordering.
    ref: "concepts.md#atomicity-visibility-and-ordering"
  - id: multithreading-concurrency-057
    difficulty: beginner
    tags: [join, states]
    question: |
        While a thread is blocked inside `otherThread.join()` (no timeout), what
        state is the WAITING thread in?
    options:
      - "WAITING"
      - "RUNNABLE"
      - "BLOCKED"
      - "TERMINATED"
    answer: 0
    explanation: |
        A no-timeout join() waits indefinitely for another thread, so the caller is
        in WAITING. With a timeout (join(ms)) it would be TIMED_WAITING. BLOCKED is
        reserved for monitor-lock contention.
    ref: "concepts.md#join"
  - id: multithreading-concurrency-058
    difficulty: intermediate
    tags: [atomic, cas, thread-safety]
    question: |
        How do classes like AtomicInteger achieve thread-safe increments without
        locking?
    options:
      - "By acquiring an internal synchronized monitor lock on the value before every increment call."
      - "By confining the value to one owner thread and rejecting cross-thread increment calls at runtime."
      - "By using lock-free compare-and-swap (CAS) hardware instructions, retrying if another thread changed the value."
      - "By declaring the backing value volatile, which alone makes the ++ read-modify-write fully atomic."
    answer: 2
    explanation: |
        Atomics use CAS: read the current value, compute the new value, and
        atomically swap only if the value hasn't changed; otherwise retry. This is
        lock-free. Plain volatile alone cannot make ++ atomic, and no per-call
        synchronized block is used.
    ref: "concepts.md#thread-safety-strategies"
  - id: multithreading-concurrency-059
    difficulty: expert
    tags: [daemon-threads, inheritance]
    question: |
        A user (non-daemon) thread creates a new thread without calling setDaemon().
        Is the new thread a daemon?
    options:
      - "Yes; every thread created by new Thread() defaults to daemon unless setDaemon(false) is called first."
      - "It is nondeterministic: the JVM picks daemon or user status at random on each separate run."
      - "Only when the new thread runs a Runnable target; threads that extend Thread instead default to daemon."
      - "No; daemon status is inherited from the creating thread, so a thread created by a non-daemon thread is also non-daemon by default."
    answer: 3
    explanation: |
        A new thread inherits its daemon status from the thread that creates it. The
        main thread is a user thread, so threads it spawns are user threads unless
        you explicitly call setDaemon(true) before start(). The Runnable-vs-Thread
        distinction is irrelevant.
    ref: "concepts.md#daemon-threads"
  - id: multithreading-concurrency-060
    difficulty: intermediate
    tags: [wait, illegalmonitorstateexception]
    question: |
        ```java
        Object lock = new Object();
        lock.wait();   // not inside any synchronized block
        ```
        What is the result?
    options:
      - "It parks the current thread and waits until another thread calls lock.notify() on it."
      - "It throws IllegalMonitorStateException at runtime because the current thread does not own lock's monitor."
      - "It throws InterruptedException immediately because no synchronized block ever claimed the monitor."
      - "It fails to compile, since the compiler rejects wait() calls made outside a synchronized block."
    answer: 1
    explanation: |
        wait() requires holding the object's monitor. Calling it outside a
        synchronized(lock) block means the thread doesn't own the monitor, so the JVM
        throws IllegalMonitorStateException at runtime (it compiles fine).
    ref: "concepts.md#wait-notify-and-notifyall-with-intrinsic-locks"
  - id: multithreading-concurrency-061
    difficulty: advanced
    tags: [race-condition, check-then-act]
    question: |
        Which of these code patterns is a "check-then-act" race condition even
        though each individual operation looks harmless?
    options:
      - "Reading a final field that was frozen once during the enclosing object's construction."
      - "Printing a compile-time constant string literal that no thread can ever mutate afterward."
      - "Lazy init: if (instance == null) instance = new Singleton(); performed by multiple threads without synchronization."
      - "Assigning a computed value to a method-local variable confined to a single thread's stack."
    answer: 2
    explanation: |
        The unsynchronized lazy-initialization check (if null, then create) is a
        check-then-act race: two threads can both see null and both create/assign the
        instance, breaking the singleton and possibly publishing a partially
        constructed object. Correct approaches include holder-class idiom or
        double-checked locking with a volatile field.
    ref: "concepts.md#race-conditions-deadlock-livelock-and-starvation"
  - id: multithreading-concurrency-062
    difficulty: expert
    tags: [structured-concurrency, jdk21, preview]
    question: |
        What is the accurate status of Structured Concurrency (StructuredTaskScope)
        in JDK 21?
    options:
      - "It was still a preview/incubating API in JDK 21, not finalized."
      - "It was promoted to a final, production-ready API in JDK 21, right alongside virtual threads."
      - "It was withdrawn and removed from the JDK entirely in the 21 release after failing preview."
      - "It has been a stable, finalized part of the standard library since the JDK 17 LTS release."
    answer: 0
    explanation: |
        Unlike virtual threads (final in JDK 21 via JEP 444), structured concurrency
        (StructuredTaskScope) remained a preview/incubating feature in JDK 21 and was
        not finalized there. Be precise: virtual threads final, structured
        concurrency still preview in 21.
    ref: "concepts.md#producer-consumer"
  - id: multithreading-concurrency-063
    difficulty: beginner
    tags: [executor, thread-pool]
    question: |
        Why is submitting tasks to an ExecutorService generally preferred over
        creating a new Thread per task with `new Thread(...).start()`?
    options:
      - "The new Thread(...).start() idiom was removed and no longer compiles in modern Java releases."
      - "ExecutorService executes each submitted task inline without ever allocating a backing thread."
      - "A raw new Thread() can only extend Thread and is structurally unable to run a Runnable target."
      - "An ExecutorService pools and reuses threads, bounding resource usage and avoiding the cost of creating a new OS thread per task."
    answer: 3
    explanation: |
        Thread pools reuse a bounded set of threads, amortizing creation cost and
        preventing resource exhaustion from unbounded thread creation. Raw new
        Thread() works but scales poorly. (With virtual threads in JDK 21,
        thread-per-task becomes cheap again, but you still use an executor to manage
        lifecycle.)
    ref: "concepts.md#runnable-vs-thread-vs-callable-execution-model"
  - id: multithreading-concurrency-064
    difficulty: advanced
    tags: [interrupt, cooperative, loop]
    question: |
        A CPU-bound task runs a long loop and never calls a blocking method. How
        should it support cancellation via interrupt()?
    options:
      - "It cannot be cancelled at all, since interrupt() has no effect on a thread that never blocks."
      - "Periodically check Thread.currentThread().isInterrupted() in the loop and stop when it becomes true."
      - "Call the deprecated Thread.stop() from within the loop to forcibly abort the computation at once."
      - "Mark the thread as a daemon so the JVM automatically kills it the instant interrupt() is called."
    answer: 1
    explanation: |
        Since interrupt() only sets a flag for a running (non-blocking) thread, a
        compute loop must poll isInterrupted() and exit cooperatively. There is no
        safe forced kill; making it a daemon only affects JVM shutdown, not mid-run
        cancellation.
    ref: "concepts.md#interrupt-mechanism"
  - id: multithreading-concurrency-065
    difficulty: intermediate
    tags: [visibility, synchronized, happens-before]
    question: |
        Besides mutual exclusion, what memory-visibility guarantee does a
        synchronized block provide?
    options:
      - "Entering the block sees all writes made by any thread that previously exited a synchronized block on the same monitor (unlock happens-before lock), and exiting flushes writes for the next locker."
      - "None; synchronized delivers only mutual exclusion and adds no memory-visibility guarantee whatsoever."
      - "It permanently promotes every field of the locked object to volatile for the rest of the program run."
      - "It guarantees the protected block is pinned to one dedicated CPU core for its entire duration."
    answer: 0
    explanation: |
        synchronized gives both mutual exclusion and visibility: an unlock
        happens-before a subsequent lock of the same monitor, so writes done under
        the lock are visible to the next thread that acquires it. It does not make
        fields volatile or pin cores.
    ref: "concepts.md#atomicity-visibility-and-ordering"
