topic: "OOP Principles and Polymorphism"
domain: java-jvm
topic_slug: oop-principles-polymorphism
version: 1
questions:
  - id: oop-principles-polymorphism-001
    difficulty: beginner
    tags: [encapsulation, fundamentals]
    question: |
      What is the primary purpose of encapsulation in Java?
    options:
      - "To allow a class to inherit fields and methods from multiple superclasses simultaneously"
      - "To let the JVM choose which overridden method to run at runtime based on the object's actual type"
      - "To guarantee that every field of a class is automatically thread-safe"
      - "To bundle state with behavior and restrict direct access to internal fields so a class can enforce its invariants"
    answer: 3
    explanation: |
      Encapsulation bundles data and the methods that operate on it into one unit and hides the internal representation (typically `private` fields with controlled accessors), letting the class enforce invariants and change internals without breaking callers. Multiple inheritance is unrelated (Java forbids multiple class inheritance). Runtime method selection is dynamic dispatch/polymorphism, not encapsulation. Encapsulation provides no thread-safety guarantee.
    ref: "concepts.md#encapsulation"
  - id: oop-principles-polymorphism-002
    difficulty: beginner
    tags: [encapsulation, final, immutability]
    question: |
      A class has `private final List<String> items = new ArrayList<>();` with a getter `return items;`. Which statement is correct?
    options:
      - "The list is fully immutable because the field is `final`"
      - "`final` prevents reassigning the reference, but callers can still mutate the list contents through the returned reference"
      - "The getter will not compile because you cannot return a `final` field"
      - "`final` makes the ArrayList thread-safe for concurrent modification"
    answer: 1
    explanation: |
      `final` only prevents reassigning `items` to a different list; the ArrayList's contents remain mutable, and returning the reference directly leaks internal state so callers can `add`/`remove`. True immutability needs defensive copies or an unmodifiable view (`List.copyOf`). Returning a final field compiles fine, and `final` has nothing to do with thread-safety.
    ref: "concepts.md#encapsulation"
  - id: oop-principles-polymorphism-003
    difficulty: intermediate
    tags: [encapsulation, defensive-copy]
    question: |
      Which technique best preserves encapsulation when a class must expose a mutable internal collection to callers?
    options:
      - "Return an unmodifiable view (e.g. `Collections.unmodifiableList`) or a defensive copy (`List.copyOf`)"
      - "Declare the field `public` but `final`"
      - "Return the internal collection directly to avoid the cost of copying"
      - "Mark the getter `synchronized`"
    answer: 0
    explanation: |
      Returning an unmodifiable view or a defensive copy prevents callers from mutating internal state through an alias while still giving read access. A `public final` field still exposes the mutable object. Returning the collection directly leaks the representation. `synchronized` addresses concurrency, not the aliasing/encapsulation problem.
    ref: "concepts.md#encapsulation"
  - id: oop-principles-polymorphism-004
    difficulty: beginner
    tags: [inheritance, is-a]
    question: |
      Which relationship does class inheritance (`extends`) most directly model?
    options:
      - "A 'has-a' relationship between a whole and its parts"
      - "A 'uses-a' relationship between a client and a service"
      - "An 'is-a' relationship between a subtype and its supertype"
      - "A 'creates-a' relationship between a factory and a product"
    answer: 2
    explanation: |
      `extends` models an is-a relationship: a `Car` is a `Vehicle`. Has-a (whole/parts) is composition (holding a field). Uses-a is a dependency/association, and creates-a describes factories. Choosing inheritance for a has-a relationship is a classic modeling error.
    ref: "concepts.md#inheritance"
  - id: oop-principles-polymorphism-005
    difficulty: intermediate
    tags: [inheritance, constructors, super]
    question: |
      Given `class A { A(int x) {} }` and `class B extends A { B() {} }`, what happens?
    options:
      - "It compiles; the compiler inserts a call to `A(int)` with a default value of 0"
      - "It is a compile error: `B()`'s implicit `super()` call has no matching no-arg constructor in `A`"
      - "It compiles; `B()` implicitly calls `A()` which the compiler generates automatically"
      - "It compiles but throws an exception at runtime when `new B()` is called"
    answer: 1
    explanation: |
      Because `A` declares a constructor, the compiler does NOT synthesize a no-arg `A()`. `B()` begins with an implicit `super()`, which finds no matching `A()`, producing a compile error. The fix is an explicit `super(someInt)` in `B()`. The compiler never invents argument values, and the error is at compile time, not runtime.
    ref: "concepts.md#inheritance"
  - id: oop-principles-polymorphism-006
    difficulty: advanced
    tags: [inheritance, constructors, initialization-order]
    question: |
      What does this program print?

      ```java
      class A { A() { init(); } void init() { System.out.println("A"); } }
      class B extends A {
          private int x = 10;
          @Override void init() { System.out.println("B x=" + x); }
      }
      // new B();
      ```
    options:
      - "B x=0"
      - "B x=10"
      - "A"
      - "A then B x=10"
    answer: 0
    explanation: |
      `new B()` runs `A()`'s body first (via implicit `super()`), which calls the overridden `init()` in `B`. But `B`'s field initializer `x = 10` runs only AFTER `super()` returns, so at that point `x` is still its default `0`. Hence `B x=0`. This illustrates why you must not call overridable methods from a constructor.
    ref: "concepts.md#inheritance"
  - id: oop-principles-polymorphism-007
    difficulty: beginner
    tags: [polymorphism, fundamentals]
    question: |
      Which pair correctly matches the polymorphism kind to its binding time in Java?
    options:
      - "Method overriding → compile-time binding; method overloading → runtime binding"
      - "Both overloading and overriding → runtime binding"
      - "Method overloading → compile-time binding; method overriding → runtime binding"
      - "Both overloading and overriding → compile-time binding"
    answer: 2
    explanation: |
      Overloading (same name, different parameter lists) is resolved by the compiler using the static types of the arguments — compile-time/static binding. Overriding is resolved by the JVM using the receiver's runtime class — runtime/dynamic binding. The other options invert or conflate these.
    ref: "concepts.md#polymorphism"
  - id: oop-principles-polymorphism-008
    difficulty: intermediate
    tags: [polymorphism, generics, erasure]
    question: |
      Which statement about parametric polymorphism (generics) versus subtype polymorphism in Java is correct?
    options:
      - "Generic type parameters are available at runtime via reflection on the instance's class"
      - "Subtype polymorphism is resolved at compile time while generics are resolved at runtime"
      - "Generics and subtype polymorphism are identical mechanisms with different syntax"
      - "Generics are erased at compile time, so there is one runtime class for `List<T>`; subtype polymorphism is the runtime dispatch mechanism"
    answer: 3
    explanation: |
      Java generics use type erasure: `List<String>` and `List<Integer>` share one runtime `List` class, and the type argument is not recoverable from `getClass()`. Subtype polymorphism (dynamic dispatch on the receiver) is the runtime mechanism. So generics are a compile-time device, not a runtime one, making the other options wrong.
    ref: "concepts.md#polymorphism"
  - id: oop-principles-polymorphism-009
    difficulty: beginner
    tags: [abstraction, interfaces]
    question: |
      In Java, abstraction is primarily about:
    options:
      - "Exposing what an object can do (a contract) while hiding how it does it"
      - "Making all fields `private` and adding getters and setters"
      - "Copying behavior from a superclass into subclasses"
      - "Preventing a class from being instantiated by making it `final`"
    answer: 0
    explanation: |
      Abstraction exposes capabilities/contracts (via interfaces and abstract classes) while hiding implementation. Making fields private with accessors is encapsulation. Copying behavior down a hierarchy is inheritance. A `final` class can still be instantiated; `final` prevents subclassing, not construction.
    ref: "concepts.md#abstraction"
  - id: oop-principles-polymorphism-010
    difficulty: intermediate
    tags: [abstraction, encapsulation, distinction]
    question: |
      What is the clearest distinction between abstraction and encapsulation?
    options:
      - "They are two words for the same concept"
      - "Encapsulation hides implementation details/state of an object; abstraction hides complexity behind a simplified model or contract"
      - "Abstraction only applies to interfaces; encapsulation only applies to classes"
      - "Encapsulation is a runtime concept; abstraction is a compile-time concept"
    answer: 1
    explanation: |
      Encapsulation is about information hiding within an object (private state, controlled access); abstraction is about modeling — exposing a simplified contract and hiding complexity. They are related but distinct. Both can involve classes and interfaces, and both are design/compile-time concerns, not a runtime vs compile-time split.
    ref: "concepts.md#abstraction"
  - id: oop-principles-polymorphism-011
    difficulty: beginner
    tags: [overloading, signature]
    question: |
      Which of the following can distinguish two overloaded methods in Java?
    options:
      - "A different return type only"
      - "A different `throws` clause only"
      - "A different access modifier only"
      - "A different parameter list (number, types, or order of parameters)"
    answer: 3
    explanation: |
      Overloads must differ in their parameter list — number, types, or order. Return type, `throws` clause, and access modifier are NOT part of the method signature for overload resolution; two methods differing only in those cannot coexist and will fail to compile.
    ref: "concepts.md#overloading-versus-overriding"
  - id: oop-principles-polymorphism-012
    difficulty: intermediate
    tags: [overriding, rules, exceptions]
    question: |
      Which of these is a VALID override of `void read() throws IOException` (from a superclass)?
    options:
      - "`void read() throws Exception` in the subclass"
      - "`int read() throws IOException` in the subclass"
      - "`void read() throws FileNotFoundException` in the subclass"
      - "`private void read() throws IOException` in the subclass"
    answer: 2
    explanation: |
      An override may throw the same or NARROWER checked exceptions. `FileNotFoundException` is a subclass of `IOException`, so it is allowed. `throws Exception` broadens the checked exceptions — illegal. Changing the return type to `int` breaks the signature (and int is not covariant with void). Narrowing access from public/package to `private` is illegal (access can only widen).
    ref: "concepts.md#overloading-versus-overriding"
  - id: oop-principles-polymorphism-013
    difficulty: advanced
    tags: [overloading, resolution, boxing]
    question: |
      What does this print?

      ```java
      static void f(int x)     { System.out.println("int"); }
      static void f(long x)    { System.out.println("long"); }
      static void f(Integer x) { System.out.println("Integer"); }
      static void f(Object x)  { System.out.println("Object"); }
      // f(5);
      ```
    options:
      - "long"
      - "Integer"
      - "int"
      - "Object"
    answer: 2
    explanation: |
      Overload resolution runs in phases. Phase 1 (no boxing, no varargs) considers `f(int)` and `f(long)`; both apply to the literal `5`, and `int` is more specific than `long`, so `f(int)` wins. Boxing to `Integer` or widening to `Object` is only considered in phase 2, which is never reached. Hence "int".
    ref: "concepts.md#overloading-versus-overriding"
  - id: oop-principles-polymorphism-014
    difficulty: advanced
    tags: [overloading, null-arg, ambiguity]
    question: |
      Given overloads `void g(String s)`, `void g(Integer i)`, and `void g(Object o)`, what happens with `g(null)`?
    options:
      - "Calls `g(Object)` because null is of type Object"
      - "Calls `g(String)` because String is alphabetically first"
      - "Throws NullPointerException at runtime"
      - "Compile error: the call is ambiguous between `g(String)` and `g(Integer)`"
    answer: 3
    explanation: |
      `null` is assignable to all three reference types. The compiler picks the MOST SPECIFIC applicable method, but `String` and `Integer` are unrelated (neither is more specific than the other), so the call is ambiguous — a compile error. If only `g(String)` and `g(Object)` existed, `String` would win as more specific. There is no runtime NPE because it never compiles.
    ref: "concepts.md#overloading-versus-overriding"
  - id: oop-principles-polymorphism-015
    difficulty: intermediate
    tags: [overriding, static, hiding]
    question: |
      What is the correct term for what happens when a subclass declares a `static` method with the same signature as a `static` method in its superclass?
    options:
      - "Hiding — the method invoked is determined by the static (declared) type, not the runtime type"
      - "Overriding — the subclass version replaces the superclass version polymorphically"
      - "Overloading — the two static methods coexist as different signatures"
      - "It is a compile error; static methods cannot share a signature across a hierarchy"
    answer: 0
    explanation: |
      Static methods are not polymorphic; a same-signature static method in a subclass HIDES the superclass one. Which runs is decided by the static type of the reference, not the runtime object. It is not overriding (no dynamic dispatch), not overloading (same signature), and it compiles fine.
    ref: "concepts.md#overloading-versus-overriding"
  - id: oop-principles-polymorphism-016
    difficulty: expert
    tags: [overriding, equals, annotation]
    question: |
      A developer writes `public boolean equals(MyClass other) { ... }` intending to override `Object.equals`. What is the consequence?
    options:
      - "It correctly overrides `Object.equals`, and collections like HashSet will use it"
      - "It does not override `Object.equals(Object)` — it overloads it; HashSet still uses the inherited identity-based equals, and `@Override` would fail to compile"
      - "It is a compile error because equals must return void"
      - "It overrides equals only for reference comparisons but not for HashMap keys"
    answer: 1
    explanation: |
      `Object.equals` takes an `Object` parameter. A method taking `MyClass` has a different parameter type, so it is an OVERLOAD, not an override. Collections call `equals(Object)`, so they use the inherited identity comparison, causing subtle bugs. Annotating it `@Override` triggers a compile error, which is exactly why you should always use `@Override`.
    ref: "concepts.md#overloading-versus-overriding"
  - id: oop-principles-polymorphism-017
    difficulty: beginner
    tags: [dynamic-dispatch, fundamentals]
    question: |
      With `Vehicle v = new Car();` where `Car` overrides `start()`, which `start()` runs when you call `v.start()`?
    options:
      - "Car.start(), because dynamic dispatch uses the object's actual runtime class"
      - "Vehicle.start(), because `v` is declared as Vehicle"
      - "Neither; it is ambiguous and fails to compile"
      - "Both, in superclass-then-subclass order"
    answer: 0
    explanation: |
      Instance methods are dynamically dispatched: the JVM selects the implementation based on the receiver's runtime class (`Car`), not the declared reference type (`Vehicle`). So `Car.start()` runs. This is the essence of runtime polymorphism.
    ref: "concepts.md#dynamic-dispatch"
  - id: oop-principles-polymorphism-018
    difficulty: advanced
    tags: [dynamic-dispatch, bytecode, jvm]
    question: |
      Which JVM bytecode instruction is used for a `super.method()` call or a `private` instance method call (statically bound, non-virtual)?
    options:
      - "invokevirtual"
      - "invokeinterface"
      - "invokespecial"
      - "invokedynamic"
    answer: 2
    explanation: |
      `invokespecial` handles constructors, `private` methods, and `super.method()` calls — all statically (non-virtually) bound. `invokevirtual` dispatches virtual class-method calls, `invokeinterface` dispatches interface calls, and `invokedynamic` is used for lambdas and string concatenation via bootstrap methods, not ordinary dispatch.
    ref: "concepts.md#dynamic-dispatch"
  - id: oop-principles-polymorphism-019
    difficulty: advanced
    tags: [dynamic-dispatch, fields]
    question: |
      What does this print?

      ```java
      class A { int x = 1; }
      class B extends A { int x = 2; }
      A a = new B();
      System.out.println(a.x);
      ```
    options:
      - "2, because `a` refers to a B object"
      - "Compile error: `x` is defined twice"
      - "0, because the field is shadowed and uninitialized"
      - "1, because field access is resolved by the static (declared) type A"
    answer: 3
    explanation: |
      Fields are NOT polymorphic. Field access is resolved at compile time by the static type of the reference. Since `a` is declared as `A`, `a.x` reads `A.x` = 1, even though the object is a `B`. Shadowing fields is legal (both exist), and both are properly initialized. Only instance methods are dynamically dispatched.
    ref: "concepts.md#dynamic-dispatch"
  - id: oop-principles-polymorphism-020
    difficulty: expert
    tags: [dynamic-dispatch, jit, devirtualization]
    question: |
      In HotSpot JIT terminology, what is a "megamorphic" call site?
    options:
      - "A call site the JIT has proven has exactly one target, enabling guarded inlining"
      - "A call site with many observed target implementations, hard to inline, typically falling back to a vtable lookup"
      - "A call site with exactly two observed targets, still cheaply inlinable"
      - "A call site that has never been executed and thus cannot be profiled"
    answer: 1
    explanation: |
      Monomorphic = one target (best; guarded inline). Bimorphic = two targets (still inlinable). Megamorphic = many targets, defeating inlining and falling back to a virtual (vtable) dispatch. An unexecuted call site is simply not yet profiled. Understanding this explains why marking methods `final` rarely helps: the JIT already devirtualizes monomorphic/bimorphic sites.
    ref: "concepts.md#dynamic-dispatch"
  - id: oop-principles-polymorphism-021
    difficulty: beginner
    tags: [abstract-class, interface, comparison]
    question: |
      Which is true of an `interface` but NOT of an `abstract class` in Java?
    options:
      - "It can declare abstract methods"
      - "It can contain method bodies"
      - "It cannot be instantiated directly"
      - "A single class can implement many of them (multiple inheritance of type)"
    answer: 3
    explanation: |
      A class can implement multiple interfaces but can extend only one class — multiple inheritance of type is unique to interfaces. Both can declare abstract methods, both can contain method bodies (interfaces via `default`/`static` since Java 8), and neither can be instantiated directly.
    ref: "concepts.md#abstract-class-versus-interface"
  - id: oop-principles-polymorphism-022
    difficulty: intermediate
    tags: [interface, default-methods, java8]
    question: |
      Which Java version introduced `default` and `static` methods in interfaces?
    options:
      - "Java 7"
      - "Java 8"
      - "Java 9"
      - "Java 11"
    answer: 1
    explanation: |
      Java 8 (2014) added `default` methods (bodied instance methods enabling interface evolution without breaking implementers) and `static` interface methods. Java 9 later added `private`/`private static` interface methods. Java 7 had neither; Java 11 is far later and just an LTS milestone.
    ref: "concepts.md#abstract-class-versus-interface"
  - id: oop-principles-polymorphism-023
    difficulty: intermediate
    tags: [interface, private-methods, java9]
    question: |
      Which Java version added the ability to declare `private` (and `private static`) methods inside an interface?
    options:
      - "Java 9"
      - "Java 8"
      - "Java 10"
      - "Java 14"
    answer: 0
    explanation: |
      Java 9 added `private` and `private static` interface methods, used to share code between `default`/`static` methods without exposing helpers in the public API. Java 8 introduced `default`/`static` but not `private` interface methods. Java 10 and 14 are unrelated to this feature.
    ref: "concepts.md#abstract-class-versus-interface"
  - id: oop-principles-polymorphism-024
    difficulty: advanced
    tags: [interface, diamond, default-methods]
    question: |
      A class implements two interfaces that each provide a `default String hi()` method. What must the class do?
    options:
      - "Nothing; the compiler automatically picks the first interface listed"
      - "Nothing; the JVM chooses at runtime based on insertion order"
      - "Override `hi()` to resolve the conflict, optionally calling `Interface.super.hi()` to delegate"
      - "Mark one of the interfaces `abstract` to suppress its default"
    answer: 2
    explanation: |
      Inheriting two default methods with the same signature from unrelated interfaces is a compile error unless the class OVERRIDES the method to resolve the ambiguity. Inside the override, `Interface.super.hi()` can delegate to a specific interface's default. The compiler does not silently pick one, and you cannot mark an interface abstract to suppress a default.
    ref: "concepts.md#abstract-class-versus-interface"
  - id: oop-principles-polymorphism-025
    difficulty: advanced
    tags: [interface, default-methods, precedence]
    question: |
      When a class inherits a method from both a superclass and an interface `default` method with the same signature, which wins?
    options:
      - "The interface default method always wins"
      - "The concrete class (superclass) method wins over the interface default"
      - "It is always a compile error requiring an explicit override"
      - "The one with the more permissive access modifier wins"
    answer: 1
    explanation: |
      The resolution rule is "class wins": a concrete method inherited from a superclass takes precedence over an interface `default` method with the same signature. Among interfaces, the more specific (sub)interface wins. It is not automatically an error in the class-vs-interface case, and access modifiers do not decide precedence.
    ref: "concepts.md#abstract-class-versus-interface"
  - id: oop-principles-polymorphism-026
    difficulty: intermediate
    tags: [abstract-class, interface, choosing]
    question: |
      Since Java 8 added default methods, which remains a valid reason to choose an abstract class over an interface?
    options:
      - "Only abstract classes can declare methods with bodies"
      - "Only abstract classes support polymorphism"
      - "You need to hold shared mutable instance state and/or provide constructors"
      - "Interfaces cannot be used as reference types"
    answer: 2
    explanation: |
      Abstract classes can hold mutable instance fields and define constructors, which interfaces cannot (interfaces only allow `public static final` constants and no constructors). Interfaces gained method bodies via default/static methods in Java 8, both support polymorphism, and interfaces are perfectly valid reference types.
    ref: "concepts.md#abstract-class-versus-interface"
  - id: oop-principles-polymorphism-027
    difficulty: beginner
    tags: [composition, fundamentals]
    question: |
      "Favor composition over inheritance" primarily advises you to:
    options:
      - "Reuse behavior by holding an instance of another class as a field and delegating to it, rather than subclassing"
      - "Always use `extends` to reuse code from another class"
      - "Avoid interfaces in favor of concrete classes"
      - "Make every class `final` to prevent extension"
    answer: 0
    explanation: |
      Composition means holding a collaborator as a field and delegating, which is looser coupling than inheritance's compile-time, white-box relationship. The guidance is the opposite of "always extends." It does not say avoid interfaces, and while some classes should be final, that is a separate recommendation (design for inheritance or prohibit it).
    ref: "concepts.md#composition-over-inheritance"
  - id: oop-principles-polymorphism-028
    difficulty: intermediate
    tags: [composition, fragile-base-class, hashset]
    question: |
      Why does subclassing `HashSet` to count added elements (overriding both `add` and `addAll` to increment a counter) produce a wrong count?
    options:
      - "HashSet forbids subclassing at runtime"
      - "HashSet is not thread-safe, so the counter races"
      - "The counter field is not `volatile`"
      - "`HashSet.addAll` internally calls `add`, so elements added via `addAll` are counted twice — once in the overridden addAll and again in the overridden add"
    answer: 3
    explanation: |
      `HashSet.addAll` is implemented in terms of `add`. If both are overridden to increment, `addAll(collection)` increments by the collection size, then delegates to `add` for each element, incrementing again — double counting. This "self-use" is the fragile base class problem; composition (wrap-and-delegate) avoids depending on undocumented internal call patterns. It is not about thread-safety or volatility.
    ref: "concepts.md#composition-over-inheritance"
  - id: oop-principles-polymorphism-029
    difficulty: advanced
    tags: [composition, decorator, trade-offs]
    question: |
      Which is a genuine advantage of composition-with-delegation over inheritance?
    options:
      - "It requires writing less code because you never forward methods"
      - "It eliminates the need for interfaces entirely"
      - "It guarantees better performance in every case"
      - "It allows runtime flexibility such as swapping or wrapping the delegate, which fixed compile-time `extends` cannot provide"
    answer: 3
    explanation: |
      Composition lets you choose or replace the delegate at runtime and stack decorators — flexibility that a fixed `extends` relationship cannot offer. It typically requires MORE code (forwarding methods), not less. It usually relies on interfaces for the delegate type, and it carries a small indirection cost, so it is not universally faster.
    ref: "concepts.md#composition-over-inheritance"
  - id: oop-principles-polymorphism-030
    difficulty: beginner
    tags: [solid, principles]
    question: |
      What does the "S" in SOLID stand for?
    options:
      - "Substitution Principle"
      - "Single Responsibility Principle"
      - "Segregation Principle"
      - "Static Resolution Principle"
    answer: 1
    explanation: |
      S is the Single Responsibility Principle: a class should have one reason to change. The Liskov Substitution Principle is the "L", Interface Segregation is the "I", and "Static Resolution" is not a SOLID principle at all.
    ref: "concepts.md#solid-principles"
  - id: oop-principles-polymorphism-031
    difficulty: intermediate
    tags: [solid, liskov, lsp]
    question: |
      Why is `class Square extends Rectangle` (where `setWidth` also sets height and vice versa) considered a Liskov Substitution Principle violation?
    options:
      - "Because code written against Rectangle assumes width and height can be set independently, and Square breaks that behavioral contract when substituted"
      - "Because a Square has fewer fields than a Rectangle"
      - "Because Square cannot be instantiated"
      - "Because Rectangle must be declared `final`"
    answer: 0
    explanation: |
      LSP requires subtypes to be usable wherever the base type is expected without breaking behavior. Rectangle's implicit contract lets width and height vary independently; Square's overrides couple them, so client code (e.g. set width 5, height 4, expect area 20) misbehaves. It is a behavioral, not a structural or instantiation, issue.
    ref: "concepts.md#solid-principles"
  - id: oop-principles-polymorphism-032
    difficulty: intermediate
    tags: [solid, dependency-inversion]
    question: |
      Which design best embodies the Dependency Inversion Principle?
    options:
      - "A service directly instantiates `new JdbcUserRepository()` inside its constructor"
      - "A service extends `JdbcUserRepository` to reuse its query methods"
      - "A service depends on a `UserRepository` interface injected via its constructor, with the concrete implementation provided externally"
      - "A service uses a global static `DatabaseManager.getInstance()`"
    answer: 2
    explanation: |
      DIP says depend on abstractions, not concretions, with high-level and low-level modules both depending on interfaces. Injecting a `UserRepository` interface achieves this and enables test doubles and swapping implementations. Directly instantiating or extending the concrete class, or reaching for a global singleton, all couple to a concretion.
    ref: "concepts.md#solid-principles"
  - id: oop-principles-polymorphism-033
    difficulty: advanced
    tags: [solid, open-closed, polymorphism]
    question: |
      How does polymorphism support the Open/Closed Principle?
    options:
      - "By letting you edit existing classes freely whenever requirements change"
      - "By letting you add new behavior through new subtypes/strategies implementing an existing abstraction, without modifying the code that consumes that abstraction"
      - "By making all classes `final` so they cannot change"
      - "By replacing interfaces with large switch statements"
    answer: 1
    explanation: |
      OCP means open for extension, closed for modification. Polymorphism lets you introduce a new implementation of an existing interface/abstract type; the consuming code (which programs to the abstraction) needs no changes. Editing existing classes or growing a switch statement is exactly what OCP tries to avoid, and making everything final would prevent extension.
    ref: "concepts.md#solid-principles"
  - id: oop-principles-polymorphism-034
    difficulty: beginner
    tags: [covariant-returns, fundamentals]
    question: |
      A covariant return type in an overriding method means the override may:
    options:
      - "Return a subtype of the overridden method's return type"
      - "Return a supertype of the overridden method's return type"
      - "Return any unrelated type as long as the name matches"
      - "Change the return type from an object type to a primitive"
    answer: 0
    explanation: |
      Covariant returns (since Java 5) allow an override to declare a return type that is a SUBTYPE of the original. Returning a supertype or an unrelated type is not allowed, and you cannot switch to an unrelated primitive because primitives have no subtype relationship with reference types.
    ref: "concepts.md#covariant-return-types"
  - id: oop-principles-polymorphism-035
    difficulty: intermediate
    tags: [covariant-returns, version]
    question: |
      Since which Java version have covariant return types been supported?
    options:
      - "Java 1.4"
      - "Java 8"
      - "Java 11"
      - "Java 5 (J2SE 5.0)"
    answer: 3
    explanation: |
      Covariant return types arrived in Java 5 (J2SE 5.0, 2004), alongside generics, annotations, and autoboxing. Before Java 5 the return type of an override had to be identical. They were not part of 1.4, and Java 8/11 are much later.
    ref: "concepts.md#covariant-return-types"
  - id: oop-principles-polymorphism-036
    difficulty: advanced
    tags: [covariant-returns, parameters, override]
    question: |
      Given `class Animal { Animal reproduce() {...} }`, which subclass method in `Cat extends Animal` is a valid override?
    options:
      - "`Object reproduce()` returning a broader type"
      - "`Animal reproduce(Cat mate)` adding a parameter"
      - "`Cat reproduce()` returning a subtype of Animal"
      - "`Cat produce()` with a different name"
    answer: 2
    explanation: |
      `Cat reproduce()` is a valid covariant override because `Cat` is a subtype of `Animal` and the signature (name + no params) matches. Returning a broader type (`Object`) is illegal. Adding a parameter makes it an overload, not an override. A different name is an unrelated method. Java is invariant on parameter types.
    ref: "concepts.md#covariant-return-types"
  - id: oop-principles-polymorphism-037
    difficulty: expert
    tags: [covariant-returns, bridge-methods, erasure]
    question: |
      Covariant return types (and generic overrides) are implemented in bytecode using what compiler-generated construct?
    options:
      - "Synthetic bridge methods that preserve the original/erased signature for binary compatibility"
      - "Reflection proxies created at class-load time"
      - "invokedynamic call sites bootstrapped at runtime"
      - "Duplicate constant pool entries with no additional methods"
    answer: 0
    explanation: |
      The compiler emits synthetic BRIDGE methods carrying the overridden/erased signature; they delegate to the actual covariant method, preserving binary compatibility and correct dynamic dispatch. This is unrelated to reflection proxies or invokedynamic, and it does add methods (visible in reflection/stack traces), not just constant-pool entries.
    ref: "concepts.md#covariant-return-types"
  - id: oop-principles-polymorphism-038
    difficulty: beginner
    tags: [access-modifiers, visibility]
    question: |
      Which access modifier makes a member visible only within its own class?
    options:
      - "protected"
      - "public"
      - "private"
      - "package-private (no keyword)"
    answer: 2
    explanation: |
      `private` restricts a member to its own class (and enclosing top-level class for nested types). `protected` adds package plus subclasses. `public` is visible everywhere. Package-private (no keyword) is visible within the same package.
    ref: "concepts.md#access-modifiers"
  - id: oop-principles-polymorphism-039
    difficulty: intermediate
    tags: [access-modifiers, default, package]
    question: |
      With no explicit access modifier, a class member has which visibility?
    options:
      - "public"
      - "protected"
      - "private"
      - "package-private (visible only within the same package)"
    answer: 3
    explanation: |
      The default (no keyword) access is package-private: visible to all classes in the same package, but not to subclasses in other packages nor to the outside world. It is neither public, protected, nor private.
    ref: "concepts.md#access-modifiers"
  - id: oop-principles-polymorphism-040
    difficulty: advanced
    tags: [access-modifiers, protected, cross-package]
    question: |
      A `protected` member of a superclass in package `p1` is accessed from a subclass in package `p2`. Which rule applies?
    options:
      - "The subclass can access the protected member through a reference of the superclass type freely"
      - "The subclass can access it only through a reference of its own type (or a subtype), not through a bare superclass-typed reference"
      - "Protected members are never accessible across packages"
      - "Protected members behave exactly like public across packages"
    answer: 1
    explanation: |
      The JLS restricts cross-package `protected` access: a subclass in another package may access the inherited protected member only via a reference whose type is the subclass (or a subtype), not through an arbitrary superclass-typed reference. This surprises many; protected is not fully cross-package accessible and is not equivalent to public.
    ref: "concepts.md#access-modifiers"
  - id: oop-principles-polymorphism-041
    difficulty: advanced
    tags: [access-modifiers, top-level-class]
    question: |
      Which access modifiers are legal on a TOP-LEVEL (non-nested) class?
    options:
      - "public, protected, private, and package-private"
      - "public and package-private (no keyword) only"
      - "protected and private only"
      - "public and private only"
    answer: 1
    explanation: |
      A top-level class may be `public` or package-private (no modifier). `private` and `protected` are not allowed on top-level types — they are only meaningful for nested/member types. So only `public` and package-private are valid at the top level.
    ref: "concepts.md#access-modifiers"
  - id: oop-principles-polymorphism-042
    difficulty: expert
    tags: [access-modifiers, jpms, modules]
    question: |
      In the Java Platform Module System (Java 9+), what does declaring a type `public` guarantee about its accessibility from another module?
    options:
      - "It is accessible from another module only if its package is `exported` (or `opens` for reflection) by the declaring module"
      - "It is accessible from every other module, exactly as before modules existed"
      - "It becomes accessible only via reflection, never via direct references"
      - "It is accessible only within the same module and never outside"
    answer: 0
    explanation: |
      JPMS adds a layer above access modifiers: a `public` type is accessible from another module only if its package is `exported` (or `opens` for reflective access). "Public" no longer means "accessible to all." It can still be used via direct references when exported, and it is not permanently confined to its own module.
    ref: "concepts.md#access-modifiers"
  - id: oop-principles-polymorphism-043
    difficulty: intermediate
    tags: [overriding, access, rules]
    question: |
      A superclass declares `protected void run()`. Which override in a subclass is legal regarding access?
    options:
      - "`private void run()`"
      - "`void run()` (package-private)"
      - "`public void run()`"
      - "Removing the method entirely"
    answer: 2
    explanation: |
      An override may keep the same access or WIDEN it, never narrow it. `protected` can be widened to `public`. Narrowing to package-private or `private` is illegal and won't compile. "Removing the method" doesn't override anything. So `public void run()` is the legal choice.
    ref: "concepts.md#overloading-versus-overriding"
  - id: oop-principles-polymorphism-044
    difficulty: intermediate
    tags: [polymorphism, dynamic-dispatch, code-analysis]
    question: |
      What does this print?

      ```java
      class Animal { String speak() { return "..."; } }
      class Dog extends Animal { @Override String speak() { return "Woof"; } }
      class Cat extends Animal { @Override String speak() { return "Meow"; } }
      List<Animal> zoo = List.of(new Dog(), new Cat(), new Animal());
      for (Animal a : zoo) System.out.print(a.speak());
      ```
    options:
      - "......"
      - "Compile error: speak() is ambiguous"
      - "WoofMeowWoof"
      - "WoofMeow..."
    answer: 3
    explanation: |
      Each element dispatches to its runtime class's `speak()`: Dog -> "Woof", Cat -> "Meow", plain Animal -> "...". Concatenated: "WoofMeow...". The declared element type is Animal, but overriding uses the runtime type. There is no ambiguity.
    ref: "concepts.md#polymorphism"
  - id: oop-principles-polymorphism-045
    difficulty: advanced
    tags: [overloading, widening, boxing, varargs]
    question: |
      Given `void h(Integer x)` and `void h(long x)`, what does `h(5)` (where 5 is an `int` literal) resolve to?
    options:
      - "h(Integer) via autoboxing"
      - "Compile error: ambiguous"
      - "h(Integer) because Integer is more specific than long"
      - "h(long) via primitive widening"
    answer: 3
    explanation: |
      Overload resolution phase 1 allows primitive widening but NOT boxing. `int` widens to `long`, so `h(long)` is applicable in phase 1 and is chosen. Boxing `int` to `Integer` is only considered in phase 2, which is never reached. Widening beats boxing.
    ref: "concepts.md#overloading-versus-overriding"
  - id: oop-principles-polymorphism-046
    difficulty: expert
    tags: [overriding, final, private, code-analysis]
    question: |
      What does this print?

      ```java
      class Base {
          private String id() { return "Base"; }
          public String show() { return id(); }
      }
      class Sub extends Base {
          public String id() { return "Sub"; } // not an override — Base.id is private
      }
      // System.out.println(new Sub().show());
      ```
    options:
      - "Base"
      - "Sub"
      - "Compile error: id() in Sub conflicts with private id() in Base"
      - "null"
    answer: 0
    explanation: |
      `Base.id()` is `private`, so it is not inherited and cannot be overridden. `Sub.id()` is a brand-new, unrelated method. `Base.show()` calls its OWN private `id()` (statically bound via invokespecial), which returns "Base". No polymorphism occurs, and there is no naming conflict because private methods aren't inherited.
    ref: "concepts.md#dynamic-dispatch"
  - id: oop-principles-polymorphism-047
    difficulty: intermediate
    tags: [interface, static-methods, inheritance]
    question: |
      Which statement about `static` methods declared in an interface (Java 8+) is correct?
    options:
      - "They are inherited by implementing classes and can be called on an instance"
      - "They can be overridden by implementing classes"
      - "They are NOT inherited by implementing classes; you call them on the interface itself (e.g. `MyInterface.of(...)`)"
      - "They must be `public` and `abstract`"
    answer: 2
    explanation: |
      Interface `static` methods belong to the interface, are not inherited by implementers, and are invoked as `InterfaceName.method(...)`. They cannot be overridden (static, non-virtual) and are not abstract (they have bodies). They are implicitly public but not abstract.
    ref: "concepts.md#abstract-class-versus-interface"
  - id: oop-principles-polymorphism-048
    difficulty: advanced
    tags: [interface, diamond, super, code-analysis]
    question: |
      What does this print?

      ```java
      interface X { default String v() { return "X"; } }
      interface Y { default String v() { return "Y"; } }
      class Z implements X, Y {
          @Override public String v() { return X.super.v() + Y.super.v(); }
      }
      // System.out.println(new Z().v());
      ```
    options:
      - "X"
      - "XY"
      - "Y"
      - "Compile error: cannot call super on interfaces"
    answer: 1
    explanation: |
      Z must override `v()` to resolve the conflict between the two default methods (required, or it won't compile). Inside, `X.super.v()` returns "X" and `Y.super.v()` returns "Y", concatenating to "XY". The `Interface.super.method()` syntax is exactly how you delegate to a specific inherited default.
    ref: "concepts.md#abstract-class-versus-interface"
  - id: oop-principles-polymorphism-049
    difficulty: beginner
    tags: [inheritance, single-multiple]
    question: |
      How many direct superclasses can a Java class have, and how many interfaces can it implement?
    options:
      - "Multiple superclasses; one interface"
      - "One superclass; multiple interfaces"
      - "One superclass; one interface"
      - "Multiple superclasses; multiple interfaces"
    answer: 1
    explanation: |
      Java allows single class inheritance (exactly one direct superclass, defaulting to Object) but multiple interface inheritance (a class may implement many interfaces). This avoids the classic multiple-inheritance-of-state diamond problem while still allowing multiple inheritance of type.
    ref: "concepts.md#inheritance"
  - id: oop-principles-polymorphism-050
    difficulty: expert
    tags: [overloading, resolution, code-analysis]
    question: |
      What does this print?

      ```java
      static void m(Object o)    { System.out.println("Object"); }
      static void m(String s)    { System.out.println("String"); }
      static void m(String... s) { System.out.println("varargs"); }
      // m("hello");
      ```
    options:
      - "Object"
      - "varargs"
      - "String"
      - "Compile error: ambiguous"
    answer: 2
    explanation: |
      In phase 1 (no boxing, no varargs), both `m(Object)` and `m(String)` apply; `String` is more specific, so it wins. The varargs overload is only considered in phase 3, which is never reached. Fixed-arity, more-specific matches always beat varargs. Output: "String".
    ref: "concepts.md#overloading-versus-overriding"
  - id: oop-principles-polymorphism-051
    difficulty: intermediate
    tags: [abstraction, abstract-class, instantiation]
    question: |
      Which statement about an `abstract class` is correct?
    options:
      - "It can be instantiated with `new` as long as it has no abstract methods"
      - "It cannot declare constructors because it is abstract"
      - "It must contain at least one abstract method to be valid"
      - "It cannot be instantiated directly, but it can declare constructors and be subclassed"
    answer: 3
    explanation: |
      An abstract class cannot be instantiated directly (even with zero abstract methods) but it can and often does declare constructors (invoked by subclasses via `super`). It need not contain any abstract methods — `abstract` alone forbids instantiation. Subclasses provide the concrete implementations.
    ref: "concepts.md#abstract-class-versus-interface"
  - id: oop-principles-polymorphism-052
    difficulty: advanced
    tags: [composition, delegation, code-analysis]
    question: |
      In a composition-based `CountingSet<E>` that wraps a `Set<E> delegate` and only its own `add` increments `addCount`, why is it immune to the double-counting bug that plagues the inheritance version?
    options:
      - "Because the delegate's internal call from its addAll to its add stays entirely within the delegate and never re-enters the wrapper's counting code"
      - "Because the wrapper's `addAll` cannot call the delegate's `add`"
      - "Because composition disables the delegate's addAll method"
      - "Because Set implementations never call add from addAll"
    answer: 0
    explanation: |
      With composition, the delegate is a separate object. When the wrapper forwards `addAll` to `delegate.addAll`, any internal `add` calls the delegate makes stay inside the delegate and never call back into the wrapper's counting `add`. The self-use that causes double counting in the subclass version is thus broken. Some Set implementations DO call add from addAll — that's precisely why inheritance is fragile.
    ref: "concepts.md#composition-over-inheritance"
  - id: oop-principles-polymorphism-053
    difficulty: intermediate
    tags: [solid, interface-segregation]
    question: |
      The Interface Segregation Principle recommends:
    options:
      - "One large interface that every class in the system implements"
      - "Replacing all interfaces with abstract classes"
      - "Many small, client-specific interfaces so implementers aren't forced to depend on methods they don't use"
      - "Segregating interfaces into separate packages regardless of size"
    answer: 2
    explanation: |
      ISP says clients should not be forced to depend on methods they do not use; prefer several focused, role-specific interfaces over one fat interface. Java 8 functional interfaces (`Runnable`, `Function`) embody this. It is not about abstract classes or package layout.
    ref: "concepts.md#solid-principles"
  - id: oop-principles-polymorphism-054
    difficulty: beginner
    tags: [polymorphism, overriding, annotation]
    question: |
      What is the main benefit of adding `@Override` to a method?
    options:
      - "It causes a compile error if the method does not actually override a supertype method, catching signature mistakes"
      - "It makes the method run faster at runtime"
      - "It automatically generates the method body"
      - "It makes the method final"
    answer: 0
    explanation: |
      `@Override` is a compile-time check: if the annotated method does not correctly override (or implement) a supertype method — for example due to a typo or wrong parameter type — the compiler flags it. It has no runtime performance effect, generates nothing, and does not imply `final`.
    ref: "concepts.md#overloading-versus-overriding"
  - id: oop-principles-polymorphism-055
    difficulty: advanced
    tags: [inheritance, effective-java, design-for-inheritance]
    question: |
      Effective Java Item 19 advises "design and document for inheritance, or else prohibit it." How do you prohibit inheritance of a concrete class?
    options:
      - "Declare all its methods `abstract`"
      - "Declare the class `final` (or make its only constructors private and provide static factories)"
      - "Mark the class `private`"
      - "Implement an empty marker interface"
    answer: 1
    explanation: |
      Making a class `final` prevents subclassing; alternatively, private constructors plus static factories block extension. Declaring methods abstract would force subclassing (the opposite). A top-level class cannot be `private`. A marker interface has no bearing on extensibility.
    ref: "concepts.md#composition-over-inheritance"
  - id: oop-principles-polymorphism-056
    difficulty: expert
    tags: [dynamic-dispatch, super, code-analysis]
    question: |
      What does this print?

      ```java
      class A { String f() { return "A"; } }
      class B extends A { String f() { return "B" + super.f(); } }
      class C extends B { String f() { return "C" + super.f(); } }
      // System.out.println(new C().f());
      ```
    options:
      - "C"
      - "CB"
      - "ABC"
      - "CBA"
    answer: 3
    explanation: |
      `new C().f()` runs C.f -> "C" + super.f(); C's super is B.f -> "B" + super.f(); B's super is A.f -> "A". Building outward: "C" + ("B" + "A") = "CBA". `super.f()` is statically bound to the immediate superclass method (invokespecial), so the chain is deterministic.
    ref: "concepts.md#dynamic-dispatch"
  - id: oop-principles-polymorphism-057
    difficulty: intermediate
    tags: [encapsulation, records, immutability]
    question: |
      Regarding immutability, what is true of Java records (final in JDK 16)?
    options:
      - "Records are shallowly immutable: the accessor returns the same reference to a mutable component unless a compact constructor defensively copies it"
      - "Records deep-copy all mutable components automatically to guarantee full immutability"
      - "Records cannot have any methods beyond accessors"
      - "Records fields are mutable by default and require `final` to lock them"
    answer: 0
    explanation: |
      Records give shallow immutability — the record's own component fields are final, but if a component is a mutable object (e.g. a `List`), the accessor hands out the same reference unless you add a compact constructor that defensively copies. They do NOT deep-copy automatically, can declare extra methods, and their component fields are implicitly final.
    ref: "concepts.md#encapsulation"
  - id: oop-principles-polymorphism-058
    difficulty: advanced
    tags: [overriding, covariant, parameters, code-analysis]
    question: |
      What happens when you annotate this with `@Override`?

      ```java
      class Base { Number pick(Number n) { return n; } }
      class Sub extends Base {
          @Override Integer pick(Integer n) { return n; }
      }
      ```
    options:
      - "Compiles: covariant return AND covariant parameter are both allowed"
      - "Compiles: the parameter narrowing is treated as an override"
      - "Compiles but throws ClassCastException at runtime"
      - "Compile error: the parameter type change makes it an overload, not an override, so `@Override` fails"
    answer: 3
    explanation: |
      Java allows covariant RETURN types but is INVARIANT on parameter types. Changing the parameter from `Number` to `Integer` produces a new overload with a different signature, not an override. `@Override` therefore fails to compile — which is the annotation doing its job of catching an unintended overload.
    ref: "concepts.md#covariant-return-types"
  - id: oop-principles-polymorphism-059
    difficulty: beginner
    tags: [abstract-class, interface, fields]
    question: |
      What kind of fields can a (non-nested) interface declare?
    options:
      - "Any instance fields, like a class"
      - "Only `public static final` constants (implicitly)"
      - "Only `private` instance fields"
      - "No fields of any kind"
    answer: 1
    explanation: |
      Interface fields are implicitly `public static final` constants — they cannot hold per-instance mutable state. This is a key difference from abstract classes, which can hold instance fields of any kind. Interfaces can declare fields (they're constants), just not instance/private ones.
    ref: "concepts.md#abstract-class-versus-interface"
  - id: oop-principles-polymorphism-060
    difficulty: expert
    tags: [dynamic-dispatch, invokeinterface, invokevirtual]
    question: |
      Which bytecode instruction does the JVM emit for calling a method through an interface-typed reference (e.g. `List<String> l = ...; l.size();`)?
    options:
      - "invokevirtual"
      - "invokespecial"
      - "invokeinterface"
      - "invokestatic"
    answer: 2
    explanation: |
      Calling a method through an interface-typed reference emits `invokeinterface`, which resolves the target using the interface method table of the object's runtime class. `invokevirtual` is used for class-typed virtual calls, `invokespecial` for constructors/private/super calls, and `invokestatic` for static methods. Both invokeinterface and invokevirtual perform dynamic dispatch.
    ref: "concepts.md#dynamic-dispatch"
  - id: oop-principles-polymorphism-061
    difficulty: intermediate
    tags: [abstraction, over-abstraction, gotcha]
    question: |
      What is the "speculative generality" (over-abstraction) anti-pattern?
    options:
      - "Introducing interfaces, type parameters, or extension points 'just in case' when there is only one implementation and no demonstrated need"
      - "Writing concrete classes without any interfaces"
      - "Using composition instead of inheritance"
      - "Declaring fields private"
    answer: 0
    explanation: |
      Speculative generality means adding abstractions/flexibility that no current requirement justifies (an interface with a single implementation "for the future"), which adds indirection and maintenance cost without payoff. Abstractions should be introduced when there is a real seam (testing, multiple implementations). The other options describe good or neutral practices.
    ref: "concepts.md#abstraction"
  - id: oop-principles-polymorphism-062
    difficulty: advanced
    tags: [solid, liskov, exceptions, contracts]
    question: |
      Which override behavior would violate the Liskov Substitution Principle even though it compiles cleanly?
    options:
      - "Returning a subtype of the declared return type"
      - "Widening the access modifier from protected to public"
      - "Throwing a narrower checked exception than the base method"
      - "An override that strengthens a precondition (e.g. rejecting inputs the base method accepted) or throws an unexpected exception, breaking callers that relied on the base contract"
    answer: 3
    explanation: |
      LSP is a BEHAVIORAL contract beyond syntax: an override must not strengthen preconditions, weaken postconditions, or surprise callers with new exceptions. Doing so breaks substitutability even if the code compiles. Covariant returns, widening access, and narrowing checked exceptions are all explicitly ALLOWED by the language and are LSP-friendly.
    ref: "concepts.md#solid-principles"
  - id: oop-principles-polymorphism-063
    difficulty: intermediate
    tags: [dynamic-dispatch, static, code-analysis]
    question: |
      What does this print?

      ```java
      class A { static String who() { return "A"; } }
      class B extends A { static String who() { return "B"; } }
      A ref = new B();
      System.out.println(ref.who());
      ```
    options:
      - "B, because the object is a B"
      - "A, because static methods are resolved by the static (declared) type of the reference"
      - "Compile error: cannot call static via instance reference"
      - "null"
    answer: 1
    explanation: |
      Static methods are not polymorphic; `B.who()` merely HIDES `A.who()`. Calling `ref.who()` (bad style, but legal) resolves against the static type `A`, printing "A". Calling a static method through an instance reference compiles (with a warning), so it is not an error, and it does not print "B".
    ref: "concepts.md#dynamic-dispatch"
  - id: oop-principles-polymorphism-064
    difficulty: expert
    tags: [interface, default-methods, object-methods]
    question: |
      Can an interface provide a `default` implementation of `equals`, `hashCode`, or `toString` (methods inherited from `Object`)?
    options:
      - "Yes, and it will override Object's implementation for all implementers"
      - "Yes, but only for `toString`, not `equals`/`hashCode`"
      - "No, an interface cannot declare default methods that override methods from `java.lang.Object` — this is a compile error"
      - "Yes, but the default is ignored at runtime"
    answer: 2
    explanation: |
      The JLS explicitly forbids an interface from declaring a `default` method that overrides a public method of `Object` (`equals`, `hashCode`, `toString`). Attempting it is a compile error. The rationale: every class already inherits Object's implementations, and allowing interface defaults to override them would create confusing precedence. This holds for all three, not just toString.
    ref: "concepts.md#abstract-class-versus-interface"
  - id: oop-principles-polymorphism-065
    difficulty: advanced
    tags: [inheritance, hiding, fields, code-analysis]
    question: |
      What does this print?

      ```java
      class Shape { String kind = "shape"; String describe() { return kind; } }
