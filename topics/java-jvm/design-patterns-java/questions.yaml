topic: "Design Patterns (framework-relevant)"
domain: java-jvm
topic_slug: design-patterns-java
version: 1
questions:
  - id: design-patterns-java-001
    difficulty: beginner
    tags: [singleton, definition]
    question: |
      What does the Singleton pattern guarantee?
    options:
      - "That a class exposes only static methods and cannot be instantiated at all"
      - "That a class has exactly one instance and provides a global access point to it"
      - "That every subclass shares the same field values as its parent"
      - "That object creation is deferred to a subclass factory method"
    answer: 1
    explanation: |
      Singleton ensures exactly one instance exists and provides a global point of
      access. A class of only static methods is a utility class, not a singleton.
      Deferring creation to a subclass is Factory Method.
    ref: "concepts.md#singleton-pattern-including-enum-and-double-checked-locking"

  - id: design-patterns-java-002
    difficulty: intermediate
    tags: [singleton, double-checked-locking, volatile]
    question: |
      In the double-checked locking (DCL) singleton, why must the instance field be
      declared `volatile`?
    options:
      - "To make the field visible to serialization frameworks"
      - "Because static fields cannot be read without volatile in Java"
      - "To prevent instruction reordering that could publish a partially constructed object to another thread"
      - "Because synchronized blocks require all accessed fields to be volatile"
    answer: 2
    explanation: |
      Without `volatile`, the write that assigns the reference can become visible before
      the constructor finishes (reordering / lack of happens-before), so another thread
      may see a non-null but partially initialized object. `volatile` (with the JSR-133
      Java 5 memory model) establishes the needed happens-before ordering. Serialization
      and synchronized semantics are unrelated to this requirement.
    ref: "concepts.md#singleton-pattern-including-enum-and-double-checked-locking"

  - id: design-patterns-java-003
    difficulty: intermediate
    tags: [singleton, enum, effective-java]
    question: |
      According to Effective Java, why is a single-element enum often the best way to
      implement a singleton?
    options:
      - "It is serialization-safe and reflection-safe by default, and concise"
      - "It is the only approach that allows lazy initialization"
      - "It permits multiple instances per classloader for flexibility"
      - "It avoids the JVM class-initialization thread-safety guarantee"
    answer: 0
    explanation: |
      Enum singletons are concise and, crucially, immune to the two classic attacks that
      break ordinary singletons: reflection (invoking a private constructor) and
      serialization (which otherwise creates a new instance without readResolve). Enums
      are eagerly initialized on first reference, not lazily, and still rely on the JVM's
      class-init thread-safety.
    ref: "concepts.md#singleton-pattern-including-enum-and-double-checked-locking"

  - id: design-patterns-java-004
    difficulty: advanced
    tags: [singleton, serialization, gotcha]
    question: |
      A hand-written singleton implements `Serializable` but does nothing else special.
      What happens when an instance is serialized and then deserialized?
    options:
      - "Deserialization throws NotSerializableException because singletons cannot be serialized"
      - "The same canonical instance is returned automatically by the JVM"
      - "A brand-new second instance is created, breaking the singleton guarantee unless readResolve() is provided"
      - "The private constructor is invoked and rejected, returning null"
    answer: 2
    explanation: |
      Default deserialization constructs a new object graph, so you get a second instance
      unless you implement `readResolve()` to return the canonical instance (and mark
      instance fields transient as needed). Enum singletons handle this for you.
    ref: "concepts.md#singleton-pattern-including-enum-and-double-checked-locking"

  - id: design-patterns-java-005
    difficulty: advanced
    tags: [singleton, holder-idiom, lazy]
    question: |
      Which statement about the initialization-on-demand holder idiom (static nested
      Holder class) is correct?
    options:
      - "It requires a synchronized getInstance() method on every call"
      - "It is not thread-safe and needs a volatile field like DCL"
      - "It eagerly creates the instance when the outer class is loaded"
      - "It is lazy and lock-free, relying on the JVM initializing the nested class only when first referenced"
    answer: 3
    explanation: |
      The holder idiom defers creation until `Holder.INSTANCE` is first referenced; class
      initialization is guaranteed thread-safe by the JVM without explicit locking or
      volatile. It is lazy (the holder is not touched when the outer class loads).
    ref: "concepts.md#singleton-pattern-including-enum-and-double-checked-locking"

  - id: design-patterns-java-006
    difficulty: expert
    tags: [singleton, classloader, gotcha]
    question: |
      A library defines an enum singleton. In an application server it is loaded by two
      different classloaders. What is the observable result?
    options:
      - "A single instance is shared across both classloaders because enums are JVM-global"
      - "A LinkageError is thrown because two classloaders cannot load the same enum"
      - "Two independent instances exist, one per classloader, since the singleton guarantee is per-classloader"
      - "The second classloader silently reuses the first classloader's Class object"
    answer: 2
    explanation: |
      Class identity in the JVM is (classloader, class name). Two classloaders create two
      distinct Class objects and therefore two distinct enum instances. The singleton
      guarantee is per-classloader, not per-JVM. This applies to enum singletons too.
    ref: "concepts.md#singleton-pattern-including-enum-and-double-checked-locking"

  - id: design-patterns-java-007
    difficulty: beginner
    tags: [factory, definition]
    question: |
      What is the primary purpose of a factory?
    options:
      - "To add responsibilities to an object dynamically at runtime"
      - "To encapsulate object creation so callers depend on an interface rather than a concrete constructor"
      - "To ensure only one instance of a class exists"
      - "To convert one interface into another"
    answer: 1
    explanation: |
      A factory centralizes and encapsulates creation, decoupling clients from concrete
      classes. Adding responsibilities at runtime is Decorator; single instance is
      Singleton; converting interfaces is Adapter.
    ref: "concepts.md#factory-method-and-abstract-factory"

  - id: design-patterns-java-008
    difficulty: intermediate
    tags: [factory, factory-method, abstract-factory]
    question: |
      What distinguishes Abstract Factory from Factory Method?
    options:
      - "Abstract Factory uses inheritance while Factory Method uses composition exclusively"
      - "Factory Method creates families of related products; Abstract Factory creates only one product"
      - "They are identical; the names are interchangeable"
      - "Abstract Factory creates families of related products; Factory Method defers instantiation of a single product to subclasses"
    answer: 3
    explanation: |
      Factory Method is a single overridable method that a subclass implements to choose
      one product type. Abstract Factory is an object that produces whole families of
      related products (e.g., matching UI widgets for a theme).
    ref: "concepts.md#factory-method-and-abstract-factory"

  - id: design-patterns-java-009
    difficulty: intermediate
    tags: [factory, static-factory, effective-java]
    question: |
      Which of the following is NOT an advantage of static factory methods over
      constructors (per Effective Java, Item 1)?
    options:
      - "They can have descriptive names"
      - "They are not required to create a new object on each invocation"
      - "They can return any subtype of their declared return type"
      - "They are always inherited and overridable by subclasses like ordinary methods"
    answer: 3
    explanation: |
      Static methods are not polymorphic/overridable in the way instance methods are — a
      known limitation, not an advantage. The other three (meaningful names, instance
      control/caching, returning subtypes) are genuine advantages Bloch lists.
    ref: "concepts.md#factory-method-and-abstract-factory"

  - id: design-patterns-java-010
    difficulty: advanced
    tags: [factory, jdk, caching, code-analysis]
    question: |
      Consider:
      ```java
      Integer a = Integer.valueOf(100);
      Integer b = Integer.valueOf(100);
      Integer c = Integer.valueOf(1000);
      Integer d = Integer.valueOf(1000);
      System.out.println((a == b) + " " + (c == d));
      ```
      What is printed, and why?
    options:
      - "true true — valueOf always returns the same cached object"
      - "false false — valueOf always creates a new object"
      - "true false — the static factory caches Integers in the range -128..127, so 100 is cached but 1000 is not"
      - "false true — larger values are cached, smaller values are not"
    answer: 2
    explanation: |
      `Integer.valueOf` is a static factory that caches instances for -128..127 (the
      IntegerCache), so `a == b` is true, but 1000 is outside the cache so `c` and `d`
      are distinct objects and `c == d` is false. This is a classic instance-control
      benefit of static factories.
    ref: "concepts.md#factory-method-and-abstract-factory"

  - id: design-patterns-java-011
    difficulty: beginner
    tags: [builder, telescoping-constructor]
    question: |
      The Builder pattern is most directly a solution to which problem?
    options:
      - "Too many concrete subclasses in a hierarchy"
      - "The need to convert one interface into another"
      - "The telescoping-constructor and mutable-JavaBeans problems when an object has many optional parameters"
      - "Guaranteeing a single instance per JVM"
    answer: 2
    explanation: |
      Builder addresses objects with many (especially optional) parameters, replacing
      telescoping constructors and mutable setter-based construction with a fluent,
      validating, immutable-result API.
    ref: "concepts.md#builder-pattern"

  - id: design-patterns-java-012
    difficulty: intermediate
    tags: [builder, jdk-11, http-client]
    question: |
      Which standard-library API introduced in JDK 11 is an actual GoF Builder in the
      java.net.http package?
    options:
      - "HttpRequest.newBuilder()"
      - "HttpURLConnection.open()"
      - "URL.openStream()"
      - "Socket.connect()"
    answer: 0
    explanation: |
      The JDK 11 HTTP Client (`java.net.http`) exposes `HttpRequest.newBuilder()`, a
      genuine fluent Builder producing an immutable `HttpRequest`. The other options are
      older, non-builder APIs.
    ref: "concepts.md#builder-pattern"

  - id: design-patterns-java-013
    difficulty: advanced
    tags: [builder, records, jdk-16]
    question: |
      Records became a final feature in JDK 16. When comparing records to the Builder
      pattern, which statement is accurate?
    options:
      - "Records generate a builder automatically, making the Builder pattern obsolete"
      - "Records cannot have a canonical constructor, so a builder is mandatory"
      - "Records are mutable, so a builder is still required to make them immutable"
      - "Records give an immutable carrier with a canonical constructor for free but offer no built-in optional-parameter or builder ergonomics"
    answer: 3
    explanation: |
      A record provides an immutable data carrier and a canonical constructor, but every
      component must be supplied positionally — there is no auto-generated builder and no
      optional-argument support. For many optional fields you still want a builder (which
      can itself produce a record). Records are immutable by design.
    ref: "concepts.md#builder-pattern"

  - id: design-patterns-java-014
    difficulty: intermediate
    tags: [builder, validation, immutability]
    question: |
      In a well-designed Builder, where should invariant validation live?
    options:
      - "In the build() method, so an invalid object is never actually constructed"
      - "In each setter method so invalid values are rejected immediately"
      - "In the object's public constructor, which callers invoke directly"
      - "Validation is unnecessary because builders guarantee valid state"
    answer: 0
    explanation: |
      Placing final cross-field validation in `build()` ensures the immutable target is
      never created in an invalid state. Per-setter checks can catch obvious errors but
      cannot validate cross-field invariants until all fields are set. The public
      constructor is typically private in the builder idiom.
    ref: "concepts.md#builder-pattern"

  - id: design-patterns-java-015
    difficulty: beginner
    tags: [adapter, definition]
    question: |
      What does the Adapter pattern do?
    options:
      - "Adds new behavior to an object while keeping its interface"
      - "Converts the interface of a class into another interface that clients expect"
      - "Controls access to an object without changing its interface"
      - "Provides a single simplified entry point to a subsystem"
    answer: 1
    explanation: |
      Adapter changes/translates an interface so incompatible types can collaborate.
      Adding behavior with the same interface is Decorator; controlling access is Proxy;
      simplifying a subsystem is Facade.
    ref: "concepts.md#adapter-pattern"

  - id: design-patterns-java-016
    difficulty: intermediate
    tags: [adapter, jdk]
    question: |
      Which JDK API is a classic example of the Adapter pattern?
    options:
      - "StringBuilder.append()"
      - "Optional.ofNullable()"
      - "Thread.sleep()"
      - "java.io.InputStreamReader, which adapts a byte InputStream to a character Reader"
    answer: 3
    explanation: |
      `InputStreamReader` adapts a byte-oriented `InputStream` to the char-oriented
      `Reader` interface. `Arrays.asList` and `Collections.list(Enumeration)` are other
      JDK adapters. The others are unrelated (builder, concurrency, factory).
    ref: "concepts.md#adapter-pattern"

  - id: design-patterns-java-017
    difficulty: intermediate
    tags: [adapter, object-vs-class]
    question: |
      Why is the object adapter (composition) generally preferred over the class adapter
      (inheritance) in Java?
    options:
      - "Because Java forbids composition in adapters"
      - "Because object adapters are faster at runtime by avoiding virtual dispatch"
      - "Because Java has single inheritance, limiting the class adapter's flexibility, whereas object adapters delegate to a held adaptee"
      - "Because class adapters cannot implement the target interface"
    answer: 2
    explanation: |
      A class adapter extends the adaptee, and Java allows extending only one class,
      restricting reuse. The object adapter holds the adaptee and delegates, so it can
      adapt any subtype and implement the target interface freely.
    ref: "concepts.md#adapter-pattern"

  - id: design-patterns-java-018
    difficulty: advanced
    tags: [adapter, decorator, proxy, facade, comparison]
    question: |
      Match the intent: which pattern "keeps the same interface but controls access to the
      target"?
    options:
      - "Adapter"
      - "Decorator"
      - "Proxy"
      - "Facade"
    answer: 2
    explanation: |
      Proxy preserves the interface and controls access (lazy loading, protection, remote,
      caching). Adapter changes the interface; Decorator keeps the interface but adds
      behavior; Facade simplifies a subsystem behind a new, smaller interface.
    ref: "concepts.md#adapter-pattern"

  - id: design-patterns-java-019
    difficulty: beginner
    tags: [decorator, definition]
    question: |
      The Decorator pattern primarily provides what?
    options:
      - "A flexible alternative to subclassing for adding responsibilities to an object at runtime"
      - "A way to ensure only one instance exists"
      - "A translation between two incompatible interfaces"
      - "A method whose steps subclasses override"
    answer: 0
    explanation: |
      Decorator wraps an object in another object of the same interface to add behavior
      dynamically, avoiding a subclass explosion. The others describe Singleton, Adapter,
      and Template Method.
    ref: "concepts.md#decorator-pattern"

  - id: design-patterns-java-020
    difficulty: intermediate
    tags: [decorator, java-io]
    question: |
      Why is `new BufferedReader(new InputStreamReader(new FileInputStream(f)))` cited as
      the canonical Decorator example?
    options:
      - "Because each wrapper implements a compatible stream/reader interface and adds one responsibility (decoding, buffering) while delegating to the wrapped instance"
      - "Because each wrapper changes the interface to an incompatible type"
      - "Because it guarantees a single shared stream instance"
      - "Because it uses reflection to generate the streams at runtime"
    answer: 0
    explanation: |
      The java.io streams stack decorators: each layer keeps a compatible interface and
      adds a single concern (char decoding, buffering) while delegating downward. It is
      the textbook Decorator, not an interface change, singleton, or proxy.
    ref: "concepts.md#decorator-pattern"

  - id: design-patterns-java-021
    difficulty: advanced
    tags: [decorator, inheritance, class-explosion]
    question: |
      What advantage does Decorator have over subclassing to combine behaviors like
      buffering, encryption, and compression?
    options:
      - "It resolves all combinations at compile time for better performance"
      - "It removes the need for a shared interface among the layers"
      - "It guarantees object identity is preserved through the wrapper chain"
      - "It avoids a combinatorial explosion of subclasses by composing single-responsibility wrappers at runtime"
    answer: 3
    explanation: |
      Subclassing every combination (BufferedEncryptedCompressed...) explodes
      combinatorially and is fixed at compile time. Decorators compose one responsibility
      per wrapper at runtime. Note it does NOT preserve object identity (a gotcha), and it
      relies on a shared interface.
    ref: "concepts.md#decorator-pattern"

  - id: design-patterns-java-022
    difficulty: expert
    tags: [decorator, identity, equals, gotcha]
    question: |
      A team wraps domain objects in several decorators and then puts them in a HashSet.
      They are surprised duplicates appear. What is the most likely design pitfall?
    options:
      - "Decorators break object identity and typically do not delegate equals/hashCode, so a wrapped object and its wrapper are not 'equal'"
      - "Decorators automatically synchronize equals and hashCode with the wrapped object"
      - "HashSet cannot store decorated objects at all"
      - "Decorators force all elements to be considered equal, collapsing the set"
    answer: 0
    explanation: |
      Decorators wrap the target and, by default, inherit Object identity semantics rather
      than delegating equals/hashCode to the wrappee, so wrapper != original and different
      wrappers of the same object are unequal. Relying on identity-sensitive collections
      with decorator chains is a known gotcha.
    ref: "concepts.md#decorator-pattern"

  - id: design-patterns-java-023
    difficulty: beginner
    tags: [proxy, definition]
    question: |
      What is the intent of the Proxy pattern?
    options:
      - "Provide a surrogate or placeholder that controls access to another object while keeping the same interface"
      - "Convert one interface into another"
      - "Compose objects into tree structures"
      - "Encapsulate a request as an object"
    answer: 0
    explanation: |
      Proxy stands in for a real subject, keeping the same interface but controlling
      access (lazy init, protection, remoting, caching). Interface conversion is Adapter;
      tree structures is Composite; encapsulating a request is Command.
    ref: "concepts.md#proxy-pattern"

  - id: design-patterns-java-024
    difficulty: intermediate
    tags: [proxy, jdk, dynamic-proxy]
    question: |
      `java.lang.reflect.Proxy.newProxyInstance(...)` creates dynamic proxies. What is a
      key limitation?
    options:
      - "It is interface-based only — the target must be accessed through one or more interfaces"
      - "It can proxy concrete classes but not interfaces"
      - "It can only proxy final classes"
      - "It requires the target to extend java.lang.reflect.Proxy"
    answer: 0
    explanation: |
      JDK dynamic proxies implement interfaces at runtime and route calls through an
      InvocationHandler; they cannot proxy a class that has no interface. For class-based
      proxying you need CGLIB/ByteBuddy (subclassing), which cannot proxy final classes.
    ref: "concepts.md#proxy-pattern"

  - id: design-patterns-java-025
    difficulty: advanced
    tags: [proxy, spring, aop, cglib]
    question: |
      In Spring AOP, when does the framework use CGLIB rather than a JDK dynamic proxy?
    options:
      - "Always, because JDK dynamic proxies are deprecated"
      - "Only for prototype-scoped beans"
      - "Only when the bean is annotated with @Component"
      - "When the target bean does not implement an interface (proxying by subclassing instead)"
    answer: 3
    explanation: |
      Spring uses a JDK dynamic proxy when the bean implements at least one interface,
      and falls back to CGLIB subclass proxies when it does not (or when forced). CGLIB
      cannot proxy final classes/methods. Neither depends on @Component or bean scope.
    ref: "concepts.md#proxy-pattern"

  - id: design-patterns-java-026
    difficulty: advanced
    tags: [proxy, spring, transactional, self-invocation]
    question: |
      A Spring bean has a public method `outer()` that calls `this.inner()`, where
      `inner()` is annotated `@Transactional`. Why does the transaction advice on
      `inner()` not take effect?
    options:
      - "Because @Transactional only works on private methods"
      - "Because @Transactional requires the method to be static"
      - "Because the transaction manager is not thread-safe"
      - "Because self-invocation calls the method directly on the target, bypassing the proxy that applies the advice"
    answer: 3
    explanation: |
      The advice lives in the proxy that wraps the bean. `this.inner()` is a direct call
      on the target object, so it never passes through the proxy and the transactional
      behavior is skipped. This self-invocation gotcha is a classic Spring interview
      question. @Transactional also does not work on private/final methods for the same
      proxying reasons.
    ref: "concepts.md#proxy-pattern"

  - id: design-patterns-java-027
    difficulty: expert
    tags: [proxy, decorator, comparison]
    question: |
      Both Proxy and Decorator wrap an object and share its interface. What best captures
      the intent difference?
    options:
      - "Proxy changes the interface; Decorator preserves it"
      - "Decorator adds behavior to the wrapped object; Proxy controls access to it and often manages the target's lifecycle/creation"
      - "Proxy can only be used with final classes; Decorator cannot"
      - "There is no difference; the terms are synonyms"
    answer: 1
    explanation: |
      Structurally similar, but intent differs: Decorator enriches behavior (and the
      client typically supplies the wrappee), while Proxy controls access and frequently
      owns creation/lifecycle of the real subject (e.g., lazy virtual proxy). Neither
      changes the interface.
    ref: "concepts.md#proxy-pattern"

  - id: design-patterns-java-028
    difficulty: beginner
    tags: [strategy, definition]
    question: |
      The Strategy pattern lets you do what?
    options:
      - "Guarantee a single instance of an algorithm"
      - "Define a family of interchangeable algorithms and make them swappable at runtime behind a common interface"
      - "Notify many observers when a subject changes"
      - "Build a complex object step by step"
    answer: 1
    explanation: |
      Strategy encapsulates interchangeable algorithms behind a common interface so the
      client can swap them at runtime, favoring composition over conditionals/inheritance.
      The others are Singleton, Observer, and Builder.
    ref: "concepts.md#strategy-pattern"

  - id: design-patterns-java-029
    difficulty: intermediate
    tags: [strategy, lambda, java-8, functional]
    question: |
      Since Java 8, how are single-method Strategy interfaces most idiomatically
      implemented?
    options:
      - "By subclassing an abstract base class for every strategy"
      - "By reflection at runtime"
      - "By a lambda or method reference, because a single-abstract-method interface is a functional interface"
      - "By an enum with one constant per strategy only"
    answer: 2
    explanation: |
      A Strategy interface with one abstract method is a functional interface, so a lambda
      or method reference IS the strategy — no concrete class per algorithm needed. This
      is the canonical "modern Java replaces a pattern" example. Enums or subclasses are
      no longer required for the common case.
    ref: "concepts.md#strategy-pattern"

  - id: design-patterns-java-030
    difficulty: intermediate
    tags: [strategy, jdk, comparator]
    question: |
      Which JDK type is a Strategy passed into sorting operations?
    options:
      - "Iterator"
      - "Serializable"
      - "AutoCloseable"
      - "Comparator"
    answer: 3
    explanation: |
      A `Comparator` supplied to `Collections.sort` or `Stream.sorted` is a pluggable
      ordering strategy. `ThreadPoolExecutor`'s `RejectedExecutionHandler` is another JDK
      strategy. The other interfaces serve different purposes.
    ref: "concepts.md#strategy-pattern"

  - id: design-patterns-java-031
    difficulty: advanced
    tags: [strategy, map-dispatch, refactoring]
    question: |
      You have a large `switch` selecting one of many algorithms by a String key. What is
      a clean, extensible refactor using Strategy plus modern Java?
    options:
      - "Replace it with a Map<String, Strategy> of lambdas, looking up the strategy by key"
      - "Replace the switch with a chain of nested ternary operators"
      - "Move the switch into a static initializer"
      - "Convert the switch to a series of instanceof checks"
    answer: 0
    explanation: |
      A `Map<String, Strategy>` populated with lambdas turns the switch into a data-driven
      lookup that is open for extension (add an entry) without editing control flow. The
      other options are still branching logic and do not improve extensibility.
    ref: "concepts.md#strategy-pattern"

  - id: design-patterns-java-032
    difficulty: expert
    tags: [strategy, command, functional-interfaces]
    question: |
      Which set of built-in functional interfaces most naturally replaces small Strategy
      and Command style classes in Java 8+?
    options:
      - "Comparable, Cloneable, Serializable, Iterable"
      - "Function, Consumer, Supplier, Runnable"
      - "AutoCloseable, Closeable, Flushable, Readable"
      - "Collection, List, Set, Map"
    answer: 1
    explanation: |
      `Function`, `Consumer`, `Supplier`, and `Runnable` are general-purpose functional
      interfaces whose lambda instances stand in for one-method Strategy/Command classes.
      The other groups are markers, resource interfaces, and collection types, not
      general behavior carriers.
    ref: "concepts.md#strategy-pattern"

  - id: design-patterns-java-033
    difficulty: beginner
    tags: [observer, definition]
    question: |
      The Observer pattern establishes what kind of relationship?
    options:
      - "A one-to-many dependency where dependents are notified automatically when the subject changes"
      - "A one-to-one adapter between two interfaces"
      - "A single global instance shared by all callers"
      - "A skeleton algorithm with overridable steps"
    answer: 0
    explanation: |
      Observer defines a one-to-many notification relationship (publish/subscribe). The
      others describe Adapter, Singleton, and Template Method.
    ref: "concepts.md#observer-pattern"

  - id: design-patterns-java-034
    difficulty: intermediate
    tags: [observer, deprecation, java-9]
    question: |
      What is the status of `java.util.Observer` and `java.util.Observable`?
    options:
      - "They were deprecated in Java 9 because they are not generic, force inheritance, and have unspecified notification semantics"
      - "They are the currently recommended observer implementation"
      - "They were removed in Java 8"
      - "They were made final and generic in Java 11"
    answer: 0
    explanation: |
      Both were deprecated in Java 9: `Observable` is a class (forcing inheritance), the
      API is not generic, and notification order/threading is unspecified. Use listeners,
      an event bus, java.util.concurrent.Flow, or a reactive library instead.
    ref: "concepts.md#observer-pattern"

  - id: design-patterns-java-035
    difficulty: advanced
    tags: [observer, flow, reactive, java-9]
    question: |
      Which standard API, added in Java 9, provides a Reactive Streams observer model with
      backpressure?
    options:
      - "java.util.EventObject"
      - "java.beans.PropertyChangeSupport"
      - "java.util.concurrent.Flow with Publisher, Subscriber, Subscription, and Processor"
      - "java.util.concurrent.CompletableFuture"
    answer: 2
    explanation: |
      `java.util.concurrent.Flow` (JDK 9) defines the Reactive Streams interfaces
      Publisher/Subscriber/Subscription/Processor with backpressure. CompletableFuture is
      for async single results; PropertyChangeSupport is an older bound-property mechanism.
    ref: "concepts.md#observer-pattern"

  - id: design-patterns-java-036
    difficulty: expert
    tags: [observer, concurrency, gotcha, code-analysis]
    question: |
      A subject stores observers in an `ArrayList` and, during `publish()`, iterates the
      list calling each observer; one observer unsubscribes itself inside `update()`. What
      is the likely result?
    options:
      - "The subject silently ignores the removal"
      - "A ConcurrentModificationException is thrown because the list is structurally modified during iteration"
      - "A NullPointerException is always thrown"
      - "The JVM deadlocks"
    answer: 1
    explanation: |
      Removing from an `ArrayList` while iterating it triggers the fail-fast
      ConcurrentModificationException. Using a `CopyOnWriteArrayList` (snapshot iteration)
      or collecting removals for after iteration avoids this. It is a classic Observer
      gotcha along with listener memory leaks.
    ref: "concepts.md#observer-pattern"

  - id: design-patterns-java-037
    difficulty: advanced
    tags: [observer, memory-leak, gotcha]
    question: |
      Why can a naive Observer implementation cause a memory leak?
    options:
      - "Because observers are always stored in ThreadLocal variables"
      - "Because CopyOnWriteArrayList duplicates every observer permanently"
      - "Because notifications create new threads that never terminate"
      - "Because the subject holds strong references to observers that are never unsubscribed, preventing them from being garbage collected"
    answer: 3
    explanation: |
      If the subject keeps strong references to observers and clients forget to
      unsubscribe (the "lapsed listener" problem), those observers stay reachable and
      cannot be collected. Weak references or explicit unsubscription mitigate this.
    ref: "concepts.md#observer-pattern"

  - id: design-patterns-java-038
    difficulty: beginner
    tags: [template-method, definition]
    question: |
      The Template Method pattern does what?
    options:
      - "Defines the skeleton of an algorithm in a base method and defers specific steps to subclasses via overridable hooks"
      - "Swaps whole algorithms at runtime via composition"
      - "Creates families of related products"
      - "Wraps an object to add behavior"
    answer: 0
    explanation: |
      Template Method fixes the overall algorithm structure in a (often final) base method
      and lets subclasses override individual steps. Swapping whole algorithms at runtime
      is Strategy; families of products is Abstract Factory; wrapping is Decorator.
    ref: "concepts.md#template-method-pattern"

  - id: design-patterns-java-039
    difficulty: intermediate
    tags: [template-method, jdk, servlet]
    question: |
      Which is a Template Method example in the JDK or Servlet API?
    options:
      - "Runtime.getRuntime()"
      - "AbstractList, where you implement get() and size() and inherit iterator()/contains(); and HttpServlet.service() dispatching to doGet()/doPost()"
      - "Integer.valueOf()"
      - "Proxy.newProxyInstance()"
    answer: 1
    explanation: |
      `AbstractList` implements the algorithm skeleton (iteration, contains) in terms of
      the abstract steps you provide (get, size); `HttpServlet.service()` is a template
      that dispatches to overridable doGet/doPost. The others are singleton, factory, and
      proxy examples.
    ref: "concepts.md#template-method-pattern"

  - id: design-patterns-java-040
    difficulty: intermediate
    tags: [template-method, strategy, comparison]
    question: |
      What is the core difference between Template Method and Strategy?
    options:
      - "Both rely on reflection to select behavior"
      - "Strategy uses inheritance; Template Method uses composition"
      - "Template Method uses inheritance (override protected steps of a fixed skeleton); Strategy uses composition (swap the whole algorithm at runtime)"
      - "Template Method can only be used with static methods"
    answer: 2
    explanation: |
      Template Method relies on inheritance and overriding steps in a compile-time-fixed
      skeleton; Strategy relies on composition and lets you swap the entire algorithm at
      runtime. Spring's *Template classes blend both: a skeleton that takes a strategy
      callback.
    ref: "concepts.md#template-method-pattern"

  - id: design-patterns-java-041
    difficulty: advanced
    tags: [template-method, final, hollywood-principle]
    question: |
      Why is the template method itself frequently declared `final`?
    options:
      - "To allow subclasses to change the algorithm's step order"
      - "To prevent subclasses from overriding and breaking the fixed invariant sequence of steps"
      - "Because final methods run faster in all JVMs"
      - "Because abstract classes require all methods to be final"
    answer: 1
    explanation: |
      Making the template method final protects the invariant sequence (the "don't call
      us, we'll call you" Hollywood Principle) — subclasses may override the hook steps but
      not the orchestration. Performance and abstract-class rules are not the reason.
    ref: "concepts.md#template-method-pattern"

  - id: design-patterns-java-042
    difficulty: advanced
    tags: [template-method, spring, jdbctemplate]
    question: |
      How does Spring's JdbcTemplate embody the Template Method pattern (and combine it
      with Strategy)?
    options:
      - "It owns the fixed open-connection/execute/close/exception-translation sequence and calls your supplied callback (a strategy, often a lambda) for the varying step"
      - "It generates SQL at compile time via annotation processing"
      - "It creates one database connection per JVM as a singleton"
      - "It adapts JDBC to the Servlet API"
    answer: 0
    explanation: |
      JdbcTemplate fixes the boilerplate lifecycle (acquire connection, execute, close,
      translate exceptions) and delegates the variable part (row mapping, statement
      setting) to a callback strategy you supply, commonly a lambda since Java 8. This is
      Template Method plus Strategy.
    ref: "concepts.md#template-method-pattern"

  - id: design-patterns-java-043
    difficulty: beginner
    tags: [spring, singleton-scope]
    question: |
      What is the default scope of a Spring bean?
    options:
      - "prototype (a new instance per lookup)"
      - "singleton (one instance per ApplicationContext)"
      - "request (one per HTTP request)"
      - "session (one per HTTP session)"
    answer: 1
    explanation: |
      The default Spring bean scope is singleton, meaning one shared instance per
      ApplicationContext (not per JVM as in the GoF pattern). Prototype/request/session
      are opt-in scopes.
    ref: "concepts.md#patterns-in-spring-and-the-jdk"

  - id: design-patterns-java-044
    difficulty: intermediate
    tags: [spring, singleton-scope, comparison]
    question: |
      How does a Spring "singleton" scope differ from the GoF Singleton pattern?
    options:
      - "Spring singletons are one per JVM; GoF singletons are one per thread"
      - "Spring singletons must be implemented as enums"
      - "They are identical in meaning"
      - "Spring singletons are one per ApplicationContext (multiple contexts yield multiple instances); GoF implies one instance for the whole application"
    answer: 3
    explanation: |
      Spring scopes the "singleton" to the container: two ApplicationContexts each get
      their own instance. The GoF pattern implies a single global instance. Spring does
      not require the enum idiom.
    ref: "concepts.md#patterns-in-spring-and-the-jdk"

  - id: design-patterns-java-045
    difficulty: intermediate
    tags: [spring, factory, factorybean]
    question: |
      In Spring, what is the role of a `FactoryBean<T>`?
    options:
      - "It is a bean that itself acts as a factory, producing other bean instances of type T from the container"
      - "It marks a bean as prototype-scoped"
      - "It disables dependency injection for a bean"
      - "It converts a bean into a singleton automatically"
    answer: 0
    explanation: |
      A `FactoryBean<T>` is a specialized bean whose job is to create and return instances
      of T, letting complex construction be encapsulated behind the container's factory
      abstraction. It does not control scope or DI directly.
    ref: "concepts.md#patterns-in-spring-and-the-jdk"

  - id: design-patterns-java-046
    difficulty: advanced
    tags: [spring, bean-post-processor, decorator]
    question: |
      Spring's `BeanPostProcessor` can wrap a bean in a proxy after initialization. Which
      pattern(s) does this most reflect?
    options:
      - "Only Singleton"
      - "Proxy/Decorator style wrapping to add cross-cutting behavior around the original bean"
      - "Abstract Factory only"
      - "Template Method only"
    answer: 1
    explanation: |
      BeanPostProcessor hooks let Spring return a wrapped/proxied bean, applying
      cross-cutting concerns (AOP) around the original — proxy/decorator-style wrapping.
      This is how @Transactional/@Async advice gets attached.
    ref: "concepts.md#patterns-in-spring-and-the-jdk"

  - id: design-patterns-java-047
    difficulty: intermediate
    tags: [spring, observer, events]
    question: |
      Which Spring mechanism implements the Observer pattern for in-application events?
    options:
      - "@Autowired on a field"
      - "The @Value annotation"
      - "@Configuration classes"
      - "ApplicationEventPublisher publishing events consumed by @EventListener methods"
    answer: 3
    explanation: |
      Spring's event system uses `ApplicationEventPublisher` to publish events and
      `@EventListener` (or `ApplicationListener`) beans to observe them — a first-class
      Observer implementation. The others concern injection and configuration.
    ref: "concepts.md#patterns-in-spring-and-the-jdk"

  - id: design-patterns-java-048
    difficulty: beginner
    tags: [anti-patterns, definition]
    question: |
      What is an anti-pattern?
    options:
      - "A pattern that only works in functional languages"
      - "A commonly used but counter-productive solution to a recurring problem"
      - "Any pattern not in the original GoF book"
      - "A pattern that requires reflection"
    answer: 1
    explanation: |
      An anti-pattern is a frequently-used approach that seems helpful but is actually
      counter-productive. Applying a valid pattern where it adds no value (over-
      engineering) is itself an anti-pattern.
    ref: "concepts.md#anti-patterns-and-over-engineering"

  - id: design-patterns-java-049
    difficulty: intermediate
    tags: [anti-patterns, singleton, testability]
    question: |
      Why is over-reliance on the Singleton pattern often criticized?
    options:
      - "It always causes memory leaks by design"
      - "It prevents the use of interfaces entirely"
      - "It cannot be implemented thread-safely in Java"
      - "It introduces global mutable state, hides dependencies, and hurts testability (hard to mock/replace)"
    answer: 3
    explanation: |
      Singletons act as global mutable state, hide dependencies from callers, and are hard
      to substitute in tests. Dependency injection with a container-managed instance is
      usually preferable. Singletons can be thread-safe and can implement interfaces.
    ref: "concepts.md#anti-patterns-and-over-engineering"

  - id: design-patterns-java-050
    difficulty: intermediate
    tags: [anti-patterns, anemic-domain-model]
    question: |
      What characterizes the "anemic domain model" anti-pattern (per Martin Fowler)?
    options:
      - "Domain classes contain rich behavior and enforce their own invariants"
      - "Domain classes use records exclusively"
      - "Domain classes are all singletons"
      - "Domain classes are little more than getters/setters with all logic pushed into separate service classes"
    answer: 3
    explanation: |
      An anemic domain model has data-only objects (getters/setters) with behavior living
      in service classes, undermining object-oriented encapsulation. Fowler describes it
      as an anti-pattern relative to a rich domain model.
    ref: "concepts.md#anti-patterns-and-over-engineering"

  - id: design-patterns-java-051
    difficulty: advanced
    tags: [anti-patterns, over-engineering, yagni]
    question: |
      Which situation best illustrates over-engineering with design patterns?
    options:
      - "Introducing a Strategy interface with several genuinely different runtime algorithms"
      - "Adding a Strategy interface with a single implementation and no foreseeable variation, purely 'in case' it is needed later"
      - "Using a Builder for an object with many optional parameters"
      - "Using a Decorator to add buffering to a stream"
    answer: 1
    explanation: |
      A single-implementation Strategy with no real variation adds indirection for no
      current benefit (a YAGNI/speculative-generality violation). The other cases apply
      patterns where genuine variation, optional params, or added behavior exist.
    ref: "concepts.md#anti-patterns-and-over-engineering"

  - id: design-patterns-java-052
    difficulty: advanced
    tags: [sealed-classes, pattern-matching, visitor, jdk-21]
    question: |
      Sealed classes were finalized in JDK 17 and pattern matching for switch in JDK 21.
      Together, how can they replace a classic Visitor?
    options:
      - "They cannot; Visitor has no modern replacement"
      - "A sealed hierarchy plus an exhaustive pattern-matching switch lets the compiler verify all subtypes are handled, replacing double-dispatch with a single switch"
      - "They replace Visitor only when all subtypes are records with zero components"
      - "They require reflection to dispatch on subtype"
    answer: 1
    explanation: |
      A sealed type restricts its permitted subtypes, so an exhaustive `switch` with
      pattern matching (final in JDK 21) can be checked for completeness by the compiler,
      replacing the Visitor's double-dispatch boilerplate with a concise, type-safe switch.
    ref: "concepts.md#anti-patterns-and-over-engineering"

  - id: design-patterns-java-053
    difficulty: expert
    tags: [singleton, dcl, code-analysis, concurrency]
    question: |
      A developer writes DCL but declares the field as a plain (non-volatile) reference.
      Under the Java Memory Model, what is the precise risk?
    options:
      - "Guaranteed compile error"
      - "The synchronized block is optimized away entirely"
      - "The instance is created twice, once per thread, always"
      - "Another thread may observe a non-null reference to an object whose constructor has not finished, seeing default/partial field values"
    answer: 3
    explanation: |
      Without volatile, the store publishing the reference can be reordered before the
      constructor's field writes are visible, so a second thread reading outside the lock
      may see a non-null but partially constructed object. Volatile establishes the
      happens-before that prevents this. It is a subtle runtime data race, not a compile
      error.
    ref: "concepts.md#singleton-pattern-including-enum-and-double-checked-locking"

  - id: design-patterns-java-054
    difficulty: expert
    tags: [factory, code-analysis, static-factory]
    question: |
      Given:
      ```java
      List<String> a = List.of("x");
      a.add("y");
      ```
      What happens at runtime?
    options:
      - "It compiles and adds 'y' successfully"
      - "It throws UnsupportedOperationException because List.of returns an immutable list"
      - "It throws NullPointerException"
      - "It fails to compile because List has no add method"
    answer: 1
    explanation: |
      `List.of(...)` is a static factory returning an immutable list; calling `add` throws
      `UnsupportedOperationException` at runtime. It compiles fine (List declares add) and
      the elements are non-null here, so no NPE.
    ref: "concepts.md#factory-method-and-abstract-factory"

  - id: design-patterns-java-055
    difficulty: expert
    tags: [proxy, spring, cglib, final, code-analysis]
    question: |
      A Spring service bean implements no interface, is annotated `@Cacheable` on a
      method, and the class is declared `final`. What is the likely outcome at startup or
      first call?
    options:
      - "Caching works normally through a JDK dynamic proxy"
      - "The bean is silently converted to prototype scope"
      - "Spring cannot create a CGLIB subclass proxy for a final class, so proxy creation fails (or advice is not applied)"
      - "Caching works because final classes are proxied via reflection"
    answer: 2
    explanation: |
      With no interface, Spring needs a CGLIB subclass proxy, but CGLIB cannot subclass a
      final class (nor override final methods), so proxying fails or the caching advice
      does not apply. JDK dynamic proxies need an interface, which is absent here.
    ref: "concepts.md#proxy-pattern"

  - id: design-patterns-java-056
    difficulty: expert
    tags: [strategy, enum, functional]
    question: |
      An interviewer asks when you would still write a named Strategy class or enum
      instead of a bare lambda in Java 8+. Which is the strongest justification?
    options:
      - "When the strategy carries state, needs a meaningful name/toString, must be shared/reused, or when a fixed set of strategies benefits from an enum's exhaustiveness and identity"
      - "Lambdas cannot implement functional interfaces"
      - "Named classes are always faster than lambdas at runtime"
      - "Lambdas cannot be stored in variables or collections"
    answer: 0
    explanation: |
      Lambdas are ideal for stateless one-off algorithms, but a named class/enum is better
      when the strategy has state, needs a descriptive identity/toString, is reused across
      the codebase, or the domain has a closed set of options where an enum gives
      exhaustiveness. Lambdas do implement functional interfaces and can be stored freely;
      performance is not the deciding factor.
    ref: "concepts.md#strategy-pattern"

  - id: design-patterns-java-057
    difficulty: beginner
    tags: [builder, jdk, stringbuilder]
    question: |
      Which everyday JDK class is commonly cited as a Builder-style API?
    options:
      - "StringBuilder"
      - "Thread"
      - "Object"
      - "System"
    answer: 0
    explanation: |
      `StringBuilder` accumulates state via chained `append` calls and produces the final
      String, a builder-style fluent API. `Stream.Builder` and JDK 11's
      `HttpRequest.newBuilder()` are others.
    ref: "concepts.md#builder-pattern"

  - id: design-patterns-java-058
    difficulty: intermediate
    tags: [decorator, collections, synchronized]
    question: |
      `Collections.synchronizedList(list)` returns a wrapper that adds synchronization
      around the same List interface. Which pattern is this?
    options:
      - "Decorator, because it keeps the same interface and adds thread-safety behavior"
      - "Adapter, because it changes the interface"
      - "Singleton, because there is one list"
      - "Template Method, because sorting is deferred"
    answer: 0
    explanation: |
      The synchronized wrapper implements the same `List` interface and adds locking
      behavior around each operation — a Decorator. It does not change the interface
      (Adapter) or defer algorithm steps (Template Method).
    ref: "concepts.md#decorator-pattern"

  - id: design-patterns-java-059
    difficulty: advanced
    tags: [proxy, invocation-handler, code-analysis]
    question: |
      In a JDK dynamic proxy's `InvocationHandler.invoke(proxy, method, args)`, what is the
      most common way to forward the call to the real target?
    options:
      - "Call proxy.getClass().newInstance()"
      - "Throw UnsupportedOperationException and let Spring handle it"
      - "Recursively call invoke(proxy, method, args)"
      - "Call method.invoke(realTarget, args), reflectively invoking the same method on the wrapped target"
    answer: 3
    explanation: |
      You typically delegate with `method.invoke(realTarget, args)` — reflectively calling
      the same method on the underlying target, optionally adding behavior before/after.
      Calling invoke on the proxy itself recurses infinitely; the other options are wrong.
    ref: "concepts.md#proxy-pattern"

  - id: design-patterns-java-060
    difficulty: advanced
    tags: [adapter, streams, arrays-aslist, code-analysis]
    question: |
      Given:
      ```java
      List<Integer> l = Arrays.asList(1, 2, 3);
      l.add(4);
      ```
      What happens?
    options:
      - "It throws UnsupportedOperationException because Arrays.asList returns a fixed-size list backed by the array"
      - "It succeeds and l becomes [1, 2, 3, 4]"
      - "It throws ArrayIndexOutOfBoundsException"
      - "It fails to compile"
    answer: 0
    explanation: |
      `Arrays.asList` adapts an array to a fixed-size `List` view backed by the array; you
      can `set` elements but not `add`/`remove`, so `add` throws
      UnsupportedOperationException. It compiles and the index is valid; the limitation is
      structural mutation.
    ref: "concepts.md#adapter-pattern"

  - id: design-patterns-java-061
    difficulty: intermediate
    tags: [template-method, abstract-list]
    question: |
      To create a read-only custom List by extending `AbstractList`, which methods must
      you implement, with the rest provided by the template?
    options:
      - "add and remove"
      - "equals and hashCode"
      - "iterator and toArray"
      - "get(int index) and size()"
    answer: 3
    explanation: |
      `AbstractList` (a Template Method example) implements iteration, contains, indexOf,
      etc. in terms of the abstract `get(int)` and `size()` you supply. For a mutable list
      you'd also override set/add/remove, but a read-only list needs only get and size.
    ref: "concepts.md#template-method-pattern"

  - id: design-patterns-java-062
    difficulty: beginner
    tags: [spring, jdk, mapping]
    question: |
      Which pairing correctly maps a pattern to a Spring or JDK usage?
    options:
      - "Observer -> StringBuilder"
      - "Template Method -> JdbcTemplate / RestTemplate / TransactionTemplate"
      - "Singleton -> Arrays.asList"
      - "Adapter -> Runtime.getRuntime()"
    answer: 1
    explanation: |
      Spring's *Template classes are Template Method examples. StringBuilder is a Builder,
      Arrays.asList is an Adapter, and Runtime.getRuntime() is a Singleton — the other
      options are mismatched.
    ref: "concepts.md#patterns-in-spring-and-the-jdk"

  - id: design-patterns-java-063
    difficulty: advanced
    tags: [records, sealed, version, jdk]
    question: |
      Which statement about the Java versions of these modern features is correct?
    options:
      - "Records were final in JDK 14 and sealed classes in JDK 15"
      - "Records were final in JDK 16 and sealed classes in JDK 17"
      - "Records and sealed classes were both final in JDK 11"
      - "Records were final in JDK 17 and sealed classes in JDK 21"
    answer: 1
    explanation: |
      Records were previewed in JDK 14/15 and finalized in JDK 16 (JEP 395). Sealed
      classes were previewed in 15/16 and finalized in JDK 17 (JEP 409). Getting these
      versions right matters for accuracy.
    ref: "concepts.md#anti-patterns-and-over-engineering"

  - id: design-patterns-java-064
    difficulty: expert
    tags: [pattern-matching, switch, version, jdk-21]
    question: |
      Pattern matching for switch and record patterns reached final status in which Java
      release?
    options:
      - "JDK 17"
      - "JDK 19"
      - "JDK 21"
      - "JDK 16"
    answer: 2
    explanation: |
      Pattern matching for switch (JEP 441) and record patterns (JEP 440) were both
      finalized in JDK 21, the current LTS. Pattern matching for instanceof was final
      earlier, in JDK 16. Getting the exact release right is important.
    ref: "concepts.md#anti-patterns-and-over-engineering"

  - id: design-patterns-java-065
    difficulty: intermediate
    tags: [anti-patterns, golden-hammer]
    question: |
      A team applies the Factory pattern to every class in the codebase, even trivial value
      objects. Which anti-pattern is this?
    options:
      - "God object — one class doing everything"
      - "Poltergeist — short-lived pass-through classes"
      - "Golden hammer — forcing one favorite pattern everywhere regardless of fit"
      - "Yo-yo problem — excessive inheritance navigation"
    answer: 2
    explanation: |
      Applying a single favored tool/pattern to every problem is the "golden hammer"
      anti-pattern. Poltergeist, God object, and yo-yo describe different structural
      problems.
    ref: "concepts.md#anti-patterns-and-over-engineering"

  - id: design-patterns-java-066
    difficulty: expert
    tags: [strategy, code-analysis, lambda, comparator]
    question: |
      Given:
      ```java
      List<String> words = new ArrayList<>(List.of("bb", "a", "ccc"));
      words.sort(Comparator.comparingInt(String::length).reversed());
      System.out.println(words);
      ```
      What is printed?
    options:
      - "[a, bb, ccc]"
      - "[ccc, bb, a]"
      - "[bb, a, ccc]"
      - "It throws UnsupportedOperationException"
    answer: 1
    explanation: |
      The Comparator strategy orders by length ascending, then `.reversed()` flips it to
      descending length: ccc (3), bb (2), a (1) -> [ccc, bb, a]. The list is a mutable
      ArrayList, so sort works. This shows a Comparator as a composable Strategy built
      from method references.
    ref: "concepts.md#strategy-pattern"
