topic: "JVM Architecture and Class Loading"
domain: java-jvm
topic_slug: jvm-architecture-class-loading
version: 1
questions:
  - id: jvm-architecture-class-loading-001
    difficulty: beginner
    tags: [jvm, jre, jdk, definitions]
    question: |
      Which statement correctly describes the containment relationship between the JDK, JRE, and JVM?
    options:
      - "JDK contains the JRE, which contains the JVM"
      - "JVM contains the JRE, which contains the JDK"
      - "JRE contains the JDK, which contains the JVM"
      - "They are three independent installations with no containment relationship"
    answer: 0
    explanation: |
      The JDK is the superset: it bundles the JRE (JVM + core class libraries) plus development
      tools like javac, jar, and javadoc. The JRE in turn contains the JVM plus the runtime
      libraries. So JDK ⊃ JRE ⊃ JVM. The other orderings invert the nesting.
    ref: "concepts.md#jvm-vs-jre-vs-jdk"

  - id: jvm-architecture-class-loading-002
    difficulty: beginner
    tags: [jvm, tools]
    question: |
      Which tool is part of the JDK but NOT part of a plain JRE?
    options:
      - "The bytecode interpreter"
      - "The garbage collector"
      - "The javac compiler"
      - "The JIT compiler"
    answer: 2
    explanation: |
      javac (the compiler) is a development tool found only in the JDK. The interpreter, garbage
      collector, and JIT compiler are all part of the JVM itself, which ships inside the JRE. That
      is precisely why you need a JDK to compile but only a runtime to execute.
    ref: "concepts.md#jvm-vs-jre-vs-jdk"

  - id: jvm-architecture-class-loading-003
    difficulty: intermediate
    tags: [jvm, java9, jlink, jre]
    question: |
      What changed about distributing a runtime environment starting in Java 9?
    options:
      - "The JVM was rewritten in Java, so no native runtime is needed"
      - "The JRE and JDK were merged into a single product with no way to produce a runtime-only image"
      - "The JRE now includes javac so it can compile at runtime"
      - "The standalone JRE download was de-emphasized in favor of building custom trimmed runtime images with jlink"
    answer: 3
    explanation: |
      With the module system (JEP 200/220/261), Oracle stopped shipping standalone JREs for most
      distributions and introduced jlink (JEP 282), which builds a minimal custom runtime image
      containing only the modules an application needs. The JVM remains native (C++/assembly), the
      JRE does not gain javac, and JDK/JRE were not fused into an un-trimmable blob.
    ref: "concepts.md#jvm-vs-jre-vs-jdk"

  - id: jvm-architecture-class-loading-004
    difficulty: intermediate
    tags: [jvm, rt-jar, java9]
    question: |
      What happened to rt.jar (the monolithic runtime JAR) in Java 9?
    options:
      - "It was renamed to core.jar but kept the same structure"
      - "It was removed and replaced by the modular lib/modules file plus the module system"
      - "It was moved from the JRE into the JDK only"
      - "It was split into rt.jar and ext.jar"
    answer: 1
    explanation: |
      JEP 220 (Modular Run-Time Images) removed rt.jar and the endorsed/ext mechanisms in Java 9,
      replacing the monolithic JAR with the modular lib/modules image consumed by JPMS. The other
      options describe renames/splits that never happened.
    ref: "concepts.md#jvm-vs-jre-vs-jdk"

  - id: jvm-architecture-class-loading-005
    difficulty: beginner
    tags: [runtime-data-areas, heap]
    question: |
      In the JVM runtime data areas, where are all objects and arrays allocated?
    options:
      - "On the heap"
      - "In the PC register"
      - "On the thread's JVM stack"
      - "In the native method stack"
    answer: 0
    explanation: |
      Objects and arrays are allocated on the heap, which is shared across all threads and managed
      by the garbage collector. The stack holds frames with local variables and references; the PC
      register holds the current instruction address; the native method stack supports JNI calls.
    ref: "concepts.md#runtime-data-areas"

  - id: jvm-architecture-class-loading-006
    difficulty: beginner
    tags: [runtime-data-areas, stack, thread]
    question: |
      Which runtime data areas are per-thread rather than shared across all threads?
    options:
      - "Heap and Method Area"
      - "Runtime Constant Pool and Heap"
      - "JVM Stack, PC register, and Native Method Stack"
      - "Metaspace and Heap"
    answer: 2
    explanation: |
      Each thread gets its own JVM stack, PC register, and native method stack. The heap, method
      area (Metaspace), and runtime constant pool are shared across all threads — which is exactly
      why heap data may need synchronization while local variables on the stack are inherently
      thread-confined.
    ref: "concepts.md#runtime-data-areas"

  - id: jvm-architecture-class-loading-007
    difficulty: intermediate
    tags: [runtime-data-areas, static, memory]
    question: |
      Where does a `static int counter;` field's storage live in HotSpot on Java 8+?
    options:
      - "In each thread's JVM stack frame"
      - "In the PC register"
      - "It is never allocated until the first thread reads it"
      - "In the method area / Metaspace region for the class (with the class mirror), not in a stack frame"
    answer: 3
    explanation: |
      Static fields belong to the class, not to any instance or method invocation, so they are
      stored with the class's data in the method area (implemented by Metaspace since Java 8; the
      static field values actually reside with the class mirror on the heap). They are prepared to
      default values during the class's preparation phase, well before any read.
    ref: "concepts.md#runtime-data-areas"

  - id: jvm-architecture-class-loading-008
    difficulty: advanced
    tags: [runtime-data-areas, string-pool, java7]
    question: |
      In which Java version was the interned String pool moved out of PermGen and into the main heap?
    options:
      - "Java 6"
      - "Java 7"
      - "Java 8, at the same time PermGen was removed"
      - "Java 11"
    answer: 1
    explanation: |
      The interned String pool was relocated from PermGen to the regular heap in Java 7 — a full
      release BEFORE PermGen itself was removed in Java 8. A common trap is to assume the String
      pool lives in Metaspace; it actually lives on the heap.
    ref: "concepts.md#runtime-data-areas"

  - id: jvm-architecture-class-loading-009
    difficulty: advanced
    tags: [runtime-data-areas, escape-analysis, jit]
    question: |
      A candidate says "in Java, objects are ALWAYS allocated on the heap." What HotSpot optimization
      makes this statement not strictly true at the machine level?
    options:
      - "Escape analysis with scalar replacement, which can allocate a non-escaping object's fields on the stack or in registers"
      - "Compressed oops, which store references as 32-bit values"
      - "TLABs, which move objects into thread-local heaps"
      - "Tiered compilation, which recompiles hot methods"
    answer: 0
    explanation: |
      When the C2 JIT proves via escape analysis that an object never escapes a method, it can
      perform scalar replacement — breaking the object into its individual fields and keeping them
      in registers or on the stack, so no heap allocation occurs. Compressed oops only shrink
      reference size; TLABs are still heap regions; tiered compilation is unrelated to allocation
      location.
    ref: "concepts.md#runtime-data-areas"

  - id: jvm-architecture-class-loading-010
    difficulty: intermediate
    tags: [runtime-data-areas, stackoverflow, errors]
    question: |
      Deep unbounded recursion in a single thread most directly causes which error?
    options:
      - "OutOfMemoryError: Java heap space"
      - "OutOfMemoryError: Metaspace"
      - "StackOverflowError"
      - "NoClassDefFoundError"
    answer: 2
    explanation: |
      Each method call pushes a frame onto the thread's JVM stack; unbounded recursion exhausts that
      stack and throws StackOverflowError. Heap OOM comes from too many live objects, Metaspace OOM
      from too much class metadata, and NoClassDefFoundError from a missing class definition.
    ref: "concepts.md#runtime-data-areas"

  - id: jvm-architecture-class-loading-011
    difficulty: beginner
    tags: [class-loading, phases]
    question: |
      What are the three top-level phases of the class lifecycle, in order?
    options:
      - "Verification, Preparation, Resolution"
      - "Loading, Initialization, Verification"
      - "Compilation, Loading, Execution"
      - "Loading, Linking, Initialization"
    answer: 3
    explanation: |
      The three top-level phases are Loading → Linking → Initialization. Verification, Preparation,
      and Resolution are the three SUB-steps of Linking, not top-level phases. Compilation is done
      by javac before the JVM sees the class at all.
    ref: "concepts.md#class-loading-phases"

  - id: jvm-architecture-class-loading-012
    difficulty: intermediate
    tags: [class-loading, linking, sub-phases]
    question: |
      Which sequence correctly lists the three sub-steps of the Linking phase?
    options:
      - "Resolution, Verification, Preparation"
      - "Verification, Preparation, Resolution"
      - "Preparation, Resolution, Verification"
      - "Loading, Verification, Initialization"
    answer: 1
    explanation: |
      Linking consists of Verification (bytecode safety checks), Preparation (allocate static fields
      to default values), and Resolution (replace symbolic references with direct references), in
      that order. Loading and Initialization are separate top-level phases, not part of linking.
    ref: "concepts.md#class-loading-phases"

  - id: jvm-architecture-class-loading-013
    difficulty: advanced
    tags: [class-loading, preparation, static-fields]
    question: |
      During the Preparation sub-phase of linking, what value does a `static int count = 42;` field hold?
    options:
      - "0, the default value; the assignment to 42 happens later during initialization"
      - "42, because the initializer runs during preparation"
      - "It is undefined and reading it throws an error"
      - "42, but only if the class is loaded by the bootstrap loader"
    answer: 0
    explanation: |
      Preparation allocates storage for static fields and sets them to their DEFAULT values (0 here).
      The explicit assignment count = 42 is compiled into the class initializer <clinit> and only
      runs during the Initialization phase. Only static final compile-time constants get their real
      value earlier (via the ConstantValue attribute).
    ref: "concepts.md#class-loading-phases"

  - id: jvm-architecture-class-loading-014
    difficulty: advanced
    tags: [class-loading, verification, verifyerror]
    question: |
      Which task belongs specifically to the Verification sub-phase of linking?
    options:
      - "Running the class's static initializer blocks"
      - "Assigning default zero values to static fields"
      - "Checking that the bytecode is structurally correct and type-safe, e.g. no operand stack overflow/underflow and final classes are not subclassed"
      - "Replacing symbolic references with direct references"
    answer: 2
    explanation: |
      Verification ensures the loaded bytecode is well-formed and cannot violate JVM safety
      invariants (valid constant pool, type-safe operations, no stack over/underflow, final classes
      not extended). Failing it throws VerifyError. Static initializers run in Initialization,
      zeroing statics is Preparation, and symbolic→direct reference replacement is Resolution.
    ref: "concepts.md#class-loading-phases"

  - id: jvm-architecture-class-loading-015
    difficulty: intermediate
    tags: [class-loading, resolution, lazy]
    question: |
      Regarding the Resolution sub-phase, which statement is accurate per the JVM specification?
    options:
      - "Resolution must always happen eagerly, immediately after verification"
      - "Resolution only applies to bootstrap-loaded classes"
      - "Resolution runs the static initializer for each referenced class"
      - "Resolution replaces symbolic references with direct references and MAY be performed lazily, at first use of each reference"
    answer: 3
    explanation: |
      The spec permits resolution to be eager or lazy; HotSpot resolves each symbolic reference in
      the runtime constant pool to a direct reference lazily, at its first use. Resolution does not
      run static initializers (that is Initialization) and is not restricted to bootstrap classes.
    ref: "concepts.md#class-loading-phases"

  - id: jvm-architecture-class-loading-016
    difficulty: advanced
    tags: [class-loading, initialization, active-use]
    question: |
      Given `class Config { static final int C = 100; static { System.out.println("init"); } }`,
      what happens when another class only reads `Config.C`?
    options:
      - "It prints \"init\" because reading any static field is active use"
      - "It does NOT print \"init\"; C is a compile-time constant inlined into the caller, so Config is not initialized"
      - "It throws NoClassDefFoundError because C is final"
      - "It prints \"init\" only on the second read"
    answer: 1
    explanation: |
      C is a static final compile-time constant (a constant expression). The compiler inlines its
      value 100 directly into the reading class's bytecode, so the read does not reference Config at
      runtime at all and never triggers Config's initialization — "init" is not printed. Reading a
      non-constant static field would trigger initialization.
    ref: "concepts.md#class-loading-phases"

  - id: jvm-architecture-class-loading-017
    difficulty: advanced
    tags: [class-loading, active-use, initialization]
    question: |
      Which of the following does NOT trigger class initialization of `MyClass`?
    options:
      - "Declaring MyClass[] arr = new MyClass[10];"
      - "Executing new MyClass()"
      - "Calling a static method MyClass.doWork()"
      - "Reading a non-constant static field MyClass.counter"
    answer: 0
    explanation: |
      Creating an array of a type loads (and links) the array type but does NOT initialize the
      element class MyClass — no instance is created. Calling a static method, using new, and reading
      a non-constant static field are all forms of active use that DO trigger initialization.
    ref: "concepts.md#class-loading-phases"

  - id: jvm-architecture-class-loading-018
    difficulty: expert
    tags: [class-loading, reflection, forname]
    question: |
      Which reflective call loads a class WITHOUT initializing it?
    options:
      - "Class.forName(\"com.x.Foo\")"
      - "Class.forName(\"com.x.Foo\", true, loader)"
      - "classLoader.loadClass(\"com.x.Foo\")"
      - "Creating an instance via Foo.class.getDeclaredConstructor().newInstance()"
    answer: 2
    explanation: |
      ClassLoader.loadClass() loads (and may link) a class but never initializes it. Class.forName
      with the single-arg form defaults initialize=true, and forName(name, true, loader) explicitly
      initializes. newInstance() creates an object, which is active use and forces initialization.
      To load without init via forName use Class.forName(name, false, loader).
    ref: "concepts.md#class-loading-phases"

  - id: jvm-architecture-class-loading-019
    difficulty: intermediate
    tags: [class-loading, clinit, thread-safety]
    question: |
      What guarantee does the JVM make about the synthesized <clinit> method of a class?
    options:
      - "It runs once per instance created"
      - "It runs eagerly at JVM startup for all classes on the classpath"
      - "It runs on every thread that touches the class"
      - "It runs exactly once, and the JVM synchronizes on the class's initialization lock so it is thread-safe"
    answer: 3
    explanation: |
      The JVM guarantees <clinit> runs exactly once and holds a per-class initialization lock while
      it runs, so concurrent threads block until initialization completes. This exactly-once,
      thread-safe guarantee is the foundation of the initialization-on-demand holder singleton idiom.
      Classes initialize lazily on first active use, not eagerly at startup.
    ref: "concepts.md#class-loading-phases"

  - id: jvm-architecture-class-loading-020
    difficulty: beginner
    tags: [classloader, hierarchy]
    question: |
      Which built-in classloader is responsible for loading core JDK classes such as java.lang.String?
    options:
      - "Application (System) classloader"
      - "Bootstrap classloader"
      - "A custom URLClassLoader"
      - "Platform classloader"
    answer: 1
    explanation: |
      The bootstrap classloader loads the core JDK classes (the java.base module in Java 9+; from
      rt.jar in Java 8). It sits at the top of the hierarchy. The application loader handles classpath
      classes; the platform loader handles other platform modules; custom loaders handle bespoke
      sources.
    ref: "concepts.md#classloader-hierarchy-and-parent-delegation"

  - id: jvm-architecture-class-loading-021
    difficulty: intermediate
    tags: [classloader, java9, platform-loader]
    question: |
      In Java 9, what replaced the Extension classloader from Java 8?
    options:
      - "The Platform classloader (and the ext directory mechanism was removed)"
      - "The Bootstrap classloader absorbed its duties"
      - "A mandatory custom classloader per application"
      - "The System classloader was renamed to Extension"
    answer: 0
    explanation: |
      JEP 261 replaced the Extension classloader with the Platform classloader in Java 9, and JEP 220
      removed the jre/lib/ext extension mechanism entirely. The bootstrap loader did not absorb it,
      and no per-app custom loader is mandated.
    ref: "concepts.md#classloader-hierarchy-and-parent-delegation"

  - id: jvm-architecture-class-loading-022
    difficulty: advanced
    tags: [classloader, java9, urlclassloader, migration]
    question: |
      A Java 8 codebase does `((URLClassLoader) ClassLoader.getSystemClassLoader()).getURLs()`. Why
      might this break when migrated to Java 9+?
    options:
      - "getSystemClassLoader() was removed in Java 9"
      - "getURLs() now requires a security permission that is denied by default"
      - "In Java 9+ the built-in loaders no longer extend URLClassLoader, so the cast throws ClassCastException"
      - "The system classloader became the bootstrap loader, which is null"
    answer: 2
    explanation: |
      In Java 9+ the built-in application/platform loaders are internal AppClassLoader/PlatformClassLoader
      types that no longer extend URLClassLoader, so casting the system loader to URLClassLoader throws
      ClassCastException — a very common migration break. getSystemClassLoader() still exists and is not
      null, and no new permission on getURLs was introduced.
    ref: "concepts.md#classloader-hierarchy-and-parent-delegation"

  - id: jvm-architecture-class-loading-023
    difficulty: intermediate
    tags: [classloader, parent-delegation]
    question: |
      Under the standard parent delegation model, what does a classloader do FIRST when asked to load a class?
    options:
      - "Immediately calls its own findClass to define the class"
      - "Loads the class from the network"
      - "Asks its child classloaders to load it"
      - "Delegates the request to its parent classloader before attempting to load it itself"
    answer: 3
    explanation: |
      Parent delegation means loadClass first checks if the class is already loaded, then delegates
      upward to the parent, and only if the parent fails does it call its own findClass. There is no
      child loader to delegate down to in the standard model, and the source (network/disk) is a
      findClass concern.
    ref: "concepts.md#classloader-hierarchy-and-parent-delegation"

  - id: jvm-architecture-class-loading-024
    difficulty: intermediate
    tags: [classloader, parent-delegation, security]
    question: |
      What key problem does the parent delegation model solve?
    options:
      - "It makes class loading faster by caching bytecode on disk"
      - "It prevents user code from replacing core classes (e.g. a fake java.lang.String) and ensures core types are loaded once"
      - "It allows two versions of the same class to coexist by default"
      - "It removes the need for a bootstrap classloader"
    answer: 1
    explanation: |
      Delegating upward guarantees that core classes are always resolved by the bootstrap loader, so
      a malicious or accidental user-defined java.lang.String can never shadow the real one, and each
      core type is defined exactly once. Coexisting versions is actually what child-first (inverted)
      delegation enables, which is the opposite goal.
    ref: "concepts.md#classloader-hierarchy-and-parent-delegation"

  - id: jvm-architecture-class-loading-025
    difficulty: advanced
    tags: [classloader, class-identity, classcastexception]
    question: |
      Two classes have the identical fully qualified name com.foo.Bar but are defined by two different
      classloaders. What is true at runtime?
    options:
      - "They are distinct types; assigning an instance of one to a variable of the other throws ClassCastException"
      - "They are the same type because the name matches"
      - "The JVM automatically merges them into one Class object"
      - "The second load fails with ClassNotFoundException"
    answer: 0
    explanation: |
      Runtime class identity is (fully qualified name + defining classloader). Same name loaded by
      different loaders yields two distinct Class objects and thus distinct types, producing the
      infamous "com.foo.Bar cannot be cast to com.foo.Bar" ClassCastException / loader constraint
      LinkageError. The JVM does not merge them, and loading itself succeeds.
    ref: "concepts.md#classloader-hierarchy-and-parent-delegation"

  - id: jvm-architecture-class-loading-026
    difficulty: advanced
    tags: [classloader, bootstrap, getparent]
    question: |
      What does `String.class.getClassLoader()` return, and why?
    options:
      - "The application classloader, since String is used by apps"
      - "The platform classloader"
      - "null, because String is loaded by the bootstrap classloader, which is implemented in native code and has no Java object"
      - "It throws a SecurityException"
    answer: 2
    explanation: |
      Core classes like String are loaded by the bootstrap classloader, which is written in native
      code and is not represented by a java.lang.ClassLoader instance. The API convention is to
      return null in that case (and getParent() on the platform loader also returns null). It does
      not return the app/platform loader and does not throw.
    ref: "concepts.md#classloader-hierarchy-and-parent-delegation"

  - id: jvm-architecture-class-loading-027
    difficulty: expert
    tags: [classloader, tccl, spi]
    question: |
      Why do JDBC's DriverManager and other SPI mechanisms rely on the Thread Context ClassLoader (TCCL)?
    options:
      - "Because the TCCL is always the bootstrap loader"
      - "Because SPI classes must be loaded before the JVM starts"
      - "Because the TCCL disables verification for driver classes"
      - "Because core JDK code loaded by the bootstrap loader cannot see application-level classes via parent delegation, and the TCCL provides a back-door to the application classloader"
    answer: 3
    explanation: |
      Under parent delegation a parent loader (bootstrap, which loaded java.sql) cannot see classes
      visible only to child loaders (the app's JDBC driver on the classpath). The Thread Context
      ClassLoader gives such core code a way to reach down to the application loader to load the
      implementation. It is not the bootstrap loader, does not disable verification, and SPI loading
      happens at runtime, not before startup.
    ref: "concepts.md#classloader-hierarchy-and-parent-delegation"

  - id: jvm-architecture-class-loading-028
    difficulty: advanced
    tags: [classloader, tomcat, child-first]
    question: |
      Why does an application server like Tomcat use a child-first (inverted) delegation strategy for web app classloaders?
    options:
      - "To load classes faster than parent-first"
      - "To isolate each web application so different WARs can bundle and use conflicting versions of the same library"
      - "Because parent delegation is forbidden for servlets"
      - "To allow web apps to override java.lang classes"
    answer: 1
    explanation: |
      Tomcat's WebappClassLoader tries to load most classes itself before delegating to the parent,
      so each WAR can ship its own version of a library without collisions between apps. It does not
      let web apps override java.* classes (still delegated and forbidden), and speed is not the
      motive.
    ref: "concepts.md#classloader-hierarchy-and-parent-delegation"

  - id: jvm-architecture-class-loading-029
    difficulty: intermediate
    tags: [custom-classloader, findclass, defineclass]
    question: |
      When writing a custom classloader that should still honor parent delegation, which method should you override?
    options:
      - "findClass"
      - "loadClass"
      - "resolveClass"
      - "getParent"
    answer: 0
    explanation: |
      Override findClass, which loadClass calls only after the parent has failed — preserving
      delegation. Overriding loadClass risks bypassing delegation (which is exactly how deliberate
      child-first loaders are built). resolveClass links a class and getParent just returns the parent.
    ref: "concepts.md#custom-classloaders"

  - id: jvm-architecture-class-loading-030
    difficulty: advanced
    tags: [custom-classloader, defineclass, verification]
    question: |
      In a custom classloader's findClass, what does the call `defineClass(name, bytes, 0, bytes.length)` do?
    options:
      - "Reads the class file from disk into the byte array"
      - "Initializes the class by running its static blocks"
      - "Converts the raw byte[] into a Class object; this is where the JVM performs verification and the loader becomes the class's defining loader"
      - "Delegates loading to the parent classloader"
    answer: 2
    explanation: |
      defineClass turns raw bytecode into a runtime Class, triggering verification, and marks this
      loader as the class's defining loader (part of its runtime identity). It does not read from disk
      (that is your job before calling it), does not run static initializers, and does not delegate.
    ref: "concepts.md#custom-classloaders"

  - id: jvm-architecture-class-loading-031
    difficulty: expert
    tags: [custom-classloader, unloading, metaspace-leak]
    question: |
      Under what condition can a loaded class be unloaded (garbage collected) from Metaspace?
    options:
      - "As soon as no instances of the class exist"
      - "Automatically every full GC regardless of references"
      - "Never; classes live for the lifetime of the JVM"
      - "Only when its defining classloader, its Class object, and all its instances are all unreachable"
    answer: 3
    explanation: |
      A class can only be unloaded when its defining classloader becomes unreachable, along with the
      Class object and all instances. This is why a lingering reference (a static field, live thread,
      or ThreadLocal) to an old classloader causes a Metaspace leak on repeated redeploys. Having no
      instances is insufficient if the loader is still referenced, and the bootstrap loader's classes
      effectively never unload.
    ref: "concepts.md#custom-classloaders"

  - id: jvm-architecture-class-loading-032
    difficulty: expert
    tags: [custom-classloader, hidden-classes, java15]
    question: |
      Which feature, finalized in Java 15, lets frameworks define classes that are not discoverable by
      name and replaces the deprecated Unsafe.defineAnonymousClass?
    options:
      - "Records"
      - "Hidden classes (JEP 371) via Lookup.defineHiddenClass"
      - "Sealed classes"
      - "Text blocks"
    answer: 1
    explanation: |
      JEP 371 introduced hidden classes in Java 15, created via MethodHandles.Lookup.defineHiddenClass.
      They are invisible to normal name-based lookup and are used by frameworks and the lambda/
      invokedynamic machinery, replacing Unsafe.defineAnonymousClass. Records, sealed classes, and
      text blocks are unrelated language features (though text blocks were also finalized in 15).
    ref: "concepts.md#custom-classloaders"

  - id: jvm-architecture-class-loading-033
    difficulty: expert
    tags: [custom-classloader, parallel-capable, concurrency]
    question: |
      What does ClassLoader.registerAsParallelCapable() (since Java 7) achieve?
    options:
      - "It lets the loader synchronize per class NAME rather than on the whole loader object, improving concurrent loading"
      - "It makes the classloader load classes on multiple threads automatically"
      - "It disables parent delegation"
      - "It allows the same class to be defined twice"
    answer: 0
    explanation: |
      Registering as parallel-capable switches the internal locking granularity from a single lock on
      the loader instance to a lock per class name, so different classes can be loaded concurrently
      without contention. It does not spawn threads, disable delegation, or permit duplicate class
      definitions.
    ref: "concepts.md#custom-classloaders"

  - id: jvm-architecture-class-loading-034
    difficulty: beginner
    tags: [exceptions, classnotfound, noclassdeffound]
    question: |
      In the Java class hierarchy, ClassNotFoundException and NoClassDefFoundError differ how?
    options:
      - "Both are checked exceptions"
      - "Both are Errors"
      - "ClassNotFoundException is a checked Exception; NoClassDefFoundError is an Error (LinkageError)"
      - "ClassNotFoundException is an Error; NoClassDefFoundError is a checked Exception"
    answer: 2
    explanation: |
      ClassNotFoundException extends ReflectiveOperationException → Exception (checked).
      NoClassDefFoundError extends LinkageError → Error. This fundamental type difference reflects
      their origins: one from explicit reflective lookups, the other from the JVM linker.
    ref: "concepts.md#classnotfoundexception-vs-noclassdeffounderror"

  - id: jvm-architecture-class-loading-035
    difficulty: intermediate
    tags: [exceptions, classnotfound]
    question: |
      Which scenario most typically produces a ClassNotFoundException?
    options:
      - "A class present at compile time is missing from the runtime classpath and referenced directly"
      - "The heap running out of space"
      - "A static initializer throwing an exception on the first use"
      - "Calling Class.forName(\"com.x.Missing\") for a class not on the classpath"
    answer: 3
    explanation: |
      ClassNotFoundException arises from explicit, by-name loading at runtime — classically
      Class.forName or ClassLoader.loadClass with a name that cannot be found. A directly referenced
      class missing at runtime yields NoClassDefFoundError; a failing initializer yields
      ExceptionInInitializerError; heap exhaustion yields OutOfMemoryError.
    ref: "concepts.md#classnotfoundexception-vs-noclassdeffounderror"

  - id: jvm-architecture-class-loading-036
    difficulty: intermediate
    tags: [exceptions, noclassdeffound]
    question: |
      You compile your program against libX.jar and it builds fine, but at runtime libX.jar is absent
      from the classpath. On first reference to a class from that jar you get:
    options:
      - "ClassNotFoundException"
      - "NoClassDefFoundError"
      - "VerifyError"
      - "IllegalAccessError"
    answer: 1
    explanation: |
      The class was present at compile time (so javac linked against it) but is missing at runtime
      when the JVM tries to resolve/load it via a direct reference, producing NoClassDefFoundError.
      ClassNotFoundException would arise from explicit reflective loading, not a direct compiled
      reference.
    ref: "concepts.md#classnotfoundexception-vs-noclassdeffounderror"

  - id: jvm-architecture-class-loading-037
    difficulty: expert
    tags: [exceptions, clinit, exceptionininitializer]
    question: |
      Consider:
      ```java
      class Bad { static final int X = 1 / 0; }
      // usage:
      new Bad();   // first access
      new Bad();   // second access
      ```
      Assuming X is computed at runtime (not a constant expression), what does each access throw?
    options:
      - "First throws ExceptionInInitializerError; second throws NoClassDefFoundError"
      - "Both throw ArithmeticException"
      - "First throws NoClassDefFoundError; second throws ExceptionInInitializerError"
      - "Both throw NoClassDefFoundError"
    answer: 0
    explanation: |
      When a static initializer throws during initialization, the JVM wraps it in
      ExceptionInInitializerError on the FIRST access and marks the class erroneous. Every subsequent
      attempt to use the now-unusable class throws NoClassDefFoundError ("Could not initialize class
      Bad"). This ordering is a classic interview trap.
    ref: "concepts.md#classnotfoundexception-vs-noclassdeffounderror"

  - id: jvm-architecture-class-loading-038
    difficulty: advanced
    tags: [exceptions, exceptionininitializer]
    question: |
      What kind of exception thrown inside a static initializer gets wrapped in ExceptionInInitializerError?
    options:
      - "Only checked exceptions"
      - "Only ClassNotFoundException"
      - "Any unchecked (RuntimeException/Error) exception that escapes the static initializer, while an Error like OutOfMemoryError may propagate directly"
      - "Only IOException"
    answer: 2
    explanation: |
      A static initializer cannot declare checked exceptions, so an escaping unchecked exception
      (RuntimeException) is wrapped in ExceptionInInitializerError. If an Error (like a StackOverflow
      or OOM) escapes, the JVM may propagate it directly rather than wrapping. The wrapping is not
      limited to ClassNotFoundException or IOException.
    ref: "concepts.md#classnotfoundexception-vs-noclassdeffounderror"

  - id: jvm-architecture-class-loading-039
    difficulty: beginner
    tags: [metaspace, permgen, java8]
    question: |
      In which Java version was PermGen removed and replaced by Metaspace?
    options:
      - "Java 7"
      - "Java 11"
      - "Java 9"
      - "Java 8"
    answer: 3
    explanation: |
      JEP 122 removed the Permanent Generation in Java 8, replacing it with Metaspace. In Java 7 the
      interned String pool was moved to the heap, but PermGen itself still existed. Passing
      -XX:MaxPermSize on Java 8+ is ignored with a warning.
    ref: "concepts.md#metaspace-vs-permgen"

  - id: jvm-architecture-class-loading-040
    difficulty: intermediate
    tags: [metaspace, memory-location]
    question: |
      Where is Metaspace allocated, and what is its default maximum size?
    options:
      - "On the Java heap, with a fixed default around 64 MB"
      - "In native (off-heap) memory, with no fixed upper bound by default (it auto-grows)"
      - "In the thread stacks, sized by -Xss"
      - "In the young generation of the heap"
    answer: 1
    explanation: |
      Metaspace lives in native memory outside the Java heap and grows automatically, effectively
      unbounded until you set -XX:MaxMetaspaceSize or the machine runs out of memory. PermGen, by
      contrast, was a fixed-size heap region. Metaspace is neither in thread stacks nor the young gen.
    ref: "concepts.md#metaspace-vs-permgen"

  - id: jvm-architecture-class-loading-041
    difficulty: intermediate
    tags: [metaspace, tuning, flags]
    question: |
      Which JVM flag caps the maximum size of Metaspace on Java 8+?
    options:
      - "-XX:MaxMetaspaceSize"
      - "-XX:MaxPermSize"
      - "-Xmx"
      - "-Xss"
    answer: 0
    explanation: |
      -XX:MaxMetaspaceSize bounds Metaspace. -XX:MaxPermSize applied to the now-removed PermGen and
      is ignored on Java 8+. -Xmx caps the Java heap and -Xss sets thread stack size. In containers
      you should always set -XX:MaxMetaspaceSize so a classloader leak cannot exhaust host memory.
    ref: "concepts.md#metaspace-vs-permgen"

  - id: jvm-architecture-class-loading-042
    difficulty: advanced
    tags: [metaspace, oom, containers]
    question: |
      Why is it recommended to set -XX:MaxMetaspaceSize explicitly, especially in containers?
    options:
      - "Because Metaspace is disabled by default"
      - "Because otherwise interned strings will leak"
      - "Because Metaspace auto-grows in native memory, so an unbounded classloader leak can exhaust host memory and get the process OOM-killed by the OS"
      - "Because Metaspace shares space with the young generation and starves object allocation"
    answer: 2
    explanation: |
      Since Metaspace grows automatically in native memory, an unbounded leak (e.g. repeated
      classloader creation or redeploys) can consume all host memory, triggering an OS OOM-kill of the
      JVM rather than a clean OutOfMemoryError: Metaspace. Capping it converts uncontrolled native
      growth into a catchable JVM error. Interned strings are on the heap, and Metaspace is separate
      from the young generation.
    ref: "concepts.md#metaspace-vs-permgen"

  - id: jvm-architecture-class-loading-043
    difficulty: advanced
    tags: [permgen, static-fields, heap]
    question: |
      After PermGen was removed in Java 8, where do static field VALUES reside?
    options:
      - "In Metaspace along with all class metadata"
      - "In the PC register"
      - "In the thread stacks"
      - "On the Java heap (with the class mirror), while the class's structural metadata is in Metaspace"
    answer: 3
    explanation: |
      In Java 8+, static field values were moved to the heap alongside the java.lang.Class mirror,
      while structural class metadata (bytecode, constant pool, method/field descriptors) lives in
      native Metaspace. In PermGen days statics lived in PermGen. They are never in stacks or the PC
      register.
    ref: "concepts.md#metaspace-vs-permgen"

  - id: jvm-architecture-class-loading-044
    difficulty: beginner
    tags: [static-init, order]
    question: |
      Static field initializers and static blocks within a single class execute in what order?
    options:
      - "In reverse textual order"
      - "In the exact textual order they appear in the source"
      - "Static blocks always run before all static field initializers"
      - "In alphabetical order of field names"
    answer: 1
    explanation: |
      The compiler collects static field initializers and static blocks into <clinit> in the exact
      textual (top-to-bottom) order they appear in source. Blocks and field initializers are
      interleaved by position, not grouped, and never reordered alphabetically or reversed.
    ref: "concepts.md#static-initialization-order"

  - id: jvm-architecture-class-loading-045
    difficulty: intermediate
    tags: [static-init, instance-init, order]
    question: |
      How often does a static initializer block run compared to an instance initializer block?
    options:
      - "Static block runs once (at class initialization); instance block runs on every new instance"
      - "Both run once per instance"
      - "Both run once at class initialization"
      - "Static block runs on every new; instance block runs once"
    answer: 0
    explanation: |
      A static block runs exactly once, when the class is first initialized (before any instance
      exists). Instance initializer blocks and instance field initializers are copied into every
      constructor and thus run on every object creation. The other options invert or conflate these.
    ref: "concepts.md#static-initialization-order"

  - id: jvm-architecture-class-loading-046
    difficulty: advanced
    tags: [static-init, inheritance, output]
    question: |
      Given:
      ```java
      class Parent { static { System.out.print("1 "); } { System.out.print("2 "); } Parent(){ System.out.print("3 "); } }
      class Child extends Parent { static { System.out.print("4 "); } { System.out.print("5 "); } Child(){ System.out.print("6 "); } }
      ```
      What does the FIRST `new Child()` print?
    options:
      - "1 2 3 4 5 6"
      - "4 1 2 3 5 6"
      - "1 4 2 3 5 6"
      - "1 4 3 2 6 5"
    answer: 2
    explanation: |
      Statics run first, superclass before subclass: Parent "1", Child "4". Then instance
      construction: super() runs Parent's instance block "2" then Parent ctor "3", followed by Child's
      instance block "5" then Child ctor "6". Result: 1 4 2 3 5 6. Statics precede all instance init,
      and each class's instance block precedes its own constructor body.
    ref: "concepts.md#static-initialization-order"

  - id: jvm-architecture-class-loading-047
    difficulty: advanced
    tags: [static-init, second-instance, output]
    question: |
      Using the same Parent/Child classes from the previous question, what does a SECOND `new Child()`
      print (in the same JVM run)?
    options:
      - "1 4 2 3 5 6"
      - "Nothing, because the objects are cached"
      - "4 2 3 5 6"
      - "2 3 5 6"
    answer: 3
    explanation: |
      Static blocks ("1" and "4") only run once, during the first initialization, so the second
      instantiation runs only the instance initialization: Parent block "2", Parent ctor "3", Child
      block "5", Child ctor "6" → "2 3 5 6". Objects are not cached by new.
    ref: "concepts.md#static-initialization-order"

  - id: jvm-architecture-class-loading-048
    difficulty: expert
    tags: [static-init, forward-reference, output]
    question: |
      What is the value of Holder.x after the class initializes?
      ```java
      class Holder {
          static int x = getY();
          static int y = 10;
          static int getY() { return y; }
      }
      ```
    options:
      - "10"
      - "0"
      - "It fails to compile"
      - "It throws NoClassDefFoundError"
    answer: 1
    explanation: |
      During <clinit>, initializers run top-to-bottom. When x = getY() runs, y has only been prepared
      to its default 0 and not yet assigned 10, so getY() returns 0 and x becomes 0. This "forward
      reference via a method" compiles fine (only direct textual forward references are illegal) and
      does not error at runtime.
    ref: "concepts.md#static-initialization-order"

  - id: jvm-architecture-class-loading-049
    difficulty: expert
    tags: [static-init, holder-idiom, singleton]
    question: |
      Why is the initialization-on-demand holder idiom (a private static nested Holder class holding
      the singleton INSTANCE) thread-safe without any explicit synchronization?
    options:
      - "Because the JVM guarantees a class's <clinit> runs exactly once under an initialization lock, and Holder is only initialized on first access to Holder.INSTANCE"
      - "Because static fields are volatile by default"
      - "Because nested classes cannot be accessed by multiple threads"
      - "Because the instance is created eagerly at JVM startup"
    answer: 0
    explanation: |
      The JVM's exactly-once, lock-protected class initialization guarantee means the Holder class
      (and therefore INSTANCE) is initialized safely the first time any thread references Holder.INSTANCE
      — lazily and thread-safely, with no synchronized or volatile needed. Static fields are not
      implicitly volatile, nested classes are accessible by many threads, and the point of the idiom is
      LAZY (not eager) initialization.
    ref: "concepts.md#static-initialization-order"

  - id: jvm-architecture-class-loading-050
    difficulty: expert
    tags: [static-init, circular-dependency]
    question: |
      Two classes A and B have static initializers where A's <clinit> reads a field of B and B's
      <clinit> reads a field of A (a circular static dependency), triggered from a single thread. What
      is the likely outcome?
    options:
      - "The JVM detects the cycle and throws ExceptionInInitializerError"
      - "The program deadlocks unconditionally on a single thread"
      - "Because a class already being initialized by the current thread is treated as initialized, one side may observe default/partial values instead of the fully initialized value"
      - "The compiler rejects the code"
    answer: 2
    explanation: |
      The JVM's initialization lock treats a class already being initialized BY THE CURRENT THREAD as
      already initialized (to avoid self-deadlock), so the recursive access proceeds and can read
      not-yet-assigned default values, yielding surprising partial results. It does not throw or fail
      to compile; a single-thread cycle does not deadlock (cross-thread cycles can). This is why static
      init cycles should be avoided.
    ref: "concepts.md#static-initialization-order"

  - id: jvm-architecture-class-loading-051
    difficulty: intermediate
    tags: [runtime-data-areas, method-area, constant-pool]
    question: |
      The runtime constant pool is logically part of which runtime data area?
    options:
      - "The heap's young generation"
      - "The PC register"
      - "The per-thread JVM stack"
      - "The Method Area (implemented by Metaspace in HotSpot Java 8+)"
    answer: 3
    explanation: |
      The runtime constant pool is a per-class structure that the spec places logically within the
      Method Area, which HotSpot implements via Metaspace since Java 8. It holds literals and symbolic
      references resolved from the class file constant pool. It is neither in the young gen, the stack,
      nor the PC register.
    ref: "concepts.md#runtime-data-areas"

  - id: jvm-architecture-class-loading-052
    difficulty: beginner
    tags: [runtime-data-areas, pc-register]
    question: |
      What does the PC (Program Counter) register hold for a thread executing a Java (non-native) method?
    options:
      - "The return value of the current method"
      - "The address of the JVM instruction currently being executed"
      - "The size of the thread's stack"
      - "A reference to the current object (this)"
    answer: 1
    explanation: |
      The per-thread PC register holds the address of the currently executing JVM instruction (its
      value is undefined for native methods). It does not store return values, stack size, or the this
      reference (which lives as local variable 0 in the current frame).
    ref: "concepts.md#runtime-data-areas"

  - id: jvm-architecture-class-loading-053
    difficulty: intermediate
    tags: [runtime-data-areas, frame, stack]
    question: |
      What does a single frame on a thread's JVM stack contain?
    options:
      - "Local variables, an operand stack, and a reference to the runtime constant pool for the current class"
      - "All objects created by the method"
      - "The entire class metadata"
      - "The garbage collector roots for the whole JVM"
    answer: 0
    explanation: |
      Each method invocation pushes a frame holding local variables, an operand stack for computation,
      and a reference to the current class's runtime constant pool. Objects themselves live on the heap
      (the frame only holds references), class metadata lives in Metaspace, and GC roots span more than
      one frame.
    ref: "concepts.md#runtime-data-areas"

  - id: jvm-architecture-class-loading-054
    difficulty: advanced
    tags: [runtime-data-areas, compressed-oops]
    question: |
      What is the purpose of compressed ordinary object pointers (compressed oops) on a 64-bit HotSpot JVM?
    options:
      - "To encrypt object references for security"
      - "To compress the bytecode of loaded classes"
      - "To store object references as 32-bit values (for heaps up to ~32 GB) to save memory and improve cache efficiency"
      - "To reduce the size of the Metaspace region"
    answer: 2
    explanation: |
      Compressed oops let a 64-bit JVM represent references as 32-bit offsets when the heap is ≤ ~32 GB,
      cutting memory footprint and improving cache locality versus full 64-bit pointers. It does not
      encrypt references, compress bytecode, or shrink Metaspace.
    ref: "concepts.md#runtime-data-areas"

  - id: jvm-architecture-class-loading-055
    difficulty: advanced
    tags: [runtime-data-areas, tlab, allocation]
    question: |
      What problem does a Thread-Local Allocation Buffer (TLAB) solve?
    options:
      - "It stores thread-local variables set via ThreadLocal"
      - "It replaces the thread's stack for large arrays"
      - "It caches loaded classes per thread"
      - "It gives each thread a private slice of the heap for fast bump-pointer allocation, avoiding contention on a shared allocation pointer"
    answer: 3
    explanation: |
      A TLAB is a per-thread chunk of the (shared) heap so each thread can allocate objects via a
      cheap bump-pointer without synchronizing against other threads on every allocation. It is
      unrelated to java.lang.ThreadLocal, does not cache classes, and does not replace the stack.
    ref: "concepts.md#runtime-data-areas"

  - id: jvm-architecture-class-loading-056
    difficulty: intermediate
    tags: [jvm, bytecode, languages]
    question: |
      Which statement about the JVM is correct?
    options:
      - "The JVM can only run programs written in Java source code"
      - "The JVM executes bytecode, so any language that compiles to valid .class files (Kotlin, Scala, Groovy, Clojure) can run on it"
      - "The JVM compiles Java source directly without producing bytecode"
      - "The JVM is defined only for 64-bit platforms"
    answer: 1
    explanation: |
      The JVM is language-agnostic: it executes verified bytecode, so any language targeting valid
      .class files runs on it — Kotlin, Scala, Groovy, Clojure, and more. Source is compiled to
      bytecode first (by javac or another compiler), and the JVM spec is not restricted to 64-bit
      platforms.
    ref: "concepts.md#jvm-vs-jre-vs-jdk"

  - id: jvm-architecture-class-loading-057
    difficulty: advanced
    tags: [class-loading, subclass-static, initialization]
    question: |
      Given `class A { static int v = 5; static { System.out.print("A "); } }` and
      `class B extends A { static { System.out.print("B "); } }`, what prints when you evaluate `B.v`?
    options:
      - "A"
      - "A B"
      - "B A"
      - "Nothing"
    answer: 0
    explanation: |
      A static field referenced through a subclass name is still declared in the superclass, so only
      the DECLARING class (A) is initialized — B is not. Thus only "A" prints. Accessing an inherited
      static field does not count as active use of the subclass. (If v were a compile-time constant,
      nothing would print.)
    ref: "concepts.md#class-loading-phases"

  - id: jvm-architecture-class-loading-058
    difficulty: intermediate
    tags: [class-loading, superclass, initialization-order]
    question: |
      When class Child is initialized, what happens with respect to its superclass Parent?
    options:
      - "Only Child's <clinit> runs; Parent is never touched"
      - "Child is initialized first, then Parent lazily on demand"
      - "Parent is initialized first (recursively up the hierarchy), then Child"
      - "Both initialize concurrently on separate threads"
    answer: 2
    explanation: |
      Initializing a class first triggers initialization of its superclass (recursively to the top of
      the hierarchy), so Parent's <clinit> completes before Child's runs. Interfaces are a special case
      (only initialized if they declare default methods or when their fields are used), but the
      superclass-before-subclass rule for classes is firm.
    ref: "concepts.md#class-loading-phases"

  - id: jvm-architecture-class-loading-059
    difficulty: expert
    tags: [class-loading, verifyerror, linkage]
    question: |
      A VerifyError is thrown at runtime. Within the class lifecycle, which phase produced it, and what
      is its supertype?
    options:
      - "Initialization phase; supertype is RuntimeException"
      - "Resolution sub-phase; supertype is IOException"
      - "Loading phase; supertype is Exception"
      - "Verification sub-phase of Linking; supertype is LinkageError (an Error)"
    answer: 3
    explanation: |
      VerifyError is thrown during the Verification sub-phase of Linking when bytecode fails safety
      checks, and it extends LinkageError, which is an Error (not a RuntimeException or checked
      Exception). It is not produced by loading, initialization, or resolution.
    ref: "concepts.md#class-loading-phases"

  - id: jvm-architecture-class-loading-060
    difficulty: beginner
    tags: [classloader, definitions]
    question: |
      Which classloader loads classes from the application classpath (your own program's classes)?
    options:
      - "Bootstrap classloader"
      - "Application (System) classloader"
      - "Platform classloader"
      - "The JIT compiler"
    answer: 1
    explanation: |
      The application (a.k.a. system) classloader loads classes from the application classpath / module
      path — your own code and its non-JDK dependencies. Bootstrap loads core JDK classes, the platform
      loader loads other platform modules, and the JIT compiler is not a classloader.
    ref: "concepts.md#classloader-hierarchy-and-parent-delegation"

  - id: jvm-architecture-class-loading-061
    difficulty: intermediate
    tags: [metaspace, permgen, comparison]
    question: |
      Which pair of OutOfMemoryError messages correctly maps to (PermGen era) vs (Metaspace era)?
    options:
      - "\"PermGen space\" for Java 7 and earlier, \"Metaspace\" for Java 8+"
      - "\"PermGen space\" for Java 8+, \"Metaspace\" for Java 7"
      - "Both eras report \"Java heap space\""
      - "\"Metaspace\" for both eras"
    answer: 0
    explanation: |
      Class-metadata exhaustion surfaced as OutOfMemoryError: PermGen space in Java 7 and earlier, and
      as OutOfMemoryError: Metaspace in Java 8+ after JEP 122. Neither reports "Java heap space" for
      metadata exhaustion, and the messages are era-specific.
    ref: "concepts.md#metaspace-vs-permgen"

  - id: jvm-architecture-class-loading-062
    difficulty: advanced
    tags: [custom-classloader, same-package, security]
    question: |
      Two classes are considered members of the same RUNTIME package only when they share what?
    options:
      - "The same package name only"
      - "The same source directory"
      - "The same package name AND the same defining classloader"
      - "The same Maven artifact"
    answer: 2
    explanation: |
      Runtime package identity requires both the same package name and the same defining classloader.
      This affects package-private access and sealing: classes with the same package name loaded by
      different loaders are in different runtime packages. Source directory and build artifact are not
      runtime concepts.
    ref: "concepts.md#custom-classloaders"

  - id: jvm-architecture-class-loading-063
    difficulty: expert
    tags: [class-loading, interface, default-methods]
    question: |
      Initializing a class triggers initialization of its superCLASS. When does initializing a class
      also force initialization of an implemented INTERFACE?
    options:
      - "Always, all implemented interfaces initialize with the class"
      - "Only if the interface has static final constants"
      - "Never; interfaces cannot be initialized"
      - "Only interfaces that declare a non-abstract, non-static (default) method are initialized when the implementing class initializes"
    answer: 3
    explanation: |
      Per JLS 12.4, initializing a class initializes its superclass and superinterfaces that declare
      default methods; interfaces without default methods are NOT initialized just because an
      implementer is. Interfaces can be initialized (they can have static fields/initializers), and
      referencing a constant field does not trigger initialization (it is inlined).
    ref: "concepts.md#class-loading-phases"

  - id: jvm-architecture-class-loading-064
    difficulty: advanced
    tags: [metaspace, class-unloading, leak-cause]
    question: |
      Which of the following is the most common root cause of a Metaspace leak in a long-running
      application server?
    options:
      - "Allocating too many short-lived objects"
      - "Repeatedly loading classes via new classloaders (e.g. redeploying WARs) while a lingering reference keeps the old classloaders alive, preventing class unloading"
      - "Setting -Xmx too low"
      - "Using too many threads"
    answer: 1
    explanation: |
      Metaspace leaks come from class metadata that cannot be unloaded because the defining
      classloader stays reachable — typically repeated redeploys/dynamic class generation combined with
      a static reference, live thread, or ThreadLocal pinning the old loader. Short-lived object churn
      stresses the heap, not Metaspace; -Xmx and thread count are unrelated to metadata growth.
    ref: "concepts.md#metaspace-vs-permgen"

  - id: jvm-architecture-class-loading-065
    difficulty: intermediate
    tags: [class-loading, static-final, constant]
    question: |
      Which static final field is inlined by the compiler and does NOT appear in the class's <clinit>?
    options:
      - "static final int MAX = 100;"
      - "static final long T = System.nanoTime();"
      - "static final List<String> L = new ArrayList<>();"
      - "static final Object O = new Object();"
    answer: 0
    explanation: |
      static final MAX = 100 is a compile-time constant expression (primitive with a constant
      initializer), so the compiler inlines its value via a ConstantValue attribute and it never runs
      in <clinit>. The others are computed at runtime (nanoTime, new ArrayList, new Object), so their
      assignments execute in <clinit> and reading them triggers initialization.
    ref: "concepts.md#static-initialization-order"

  - id: jvm-architecture-class-loading-066
    difficulty: expert
    tags: [class-loading, constant-inlining, recompilation]
    question: |
      Library L exposes `public static final int VERSION = 1;`. App A is compiled against it and prints
      L.VERSION. L is later rebuilt with VERSION = 2 but A is NOT recompiled. What does A print, and why?
    options:
      - "2, because static fields are read fresh at runtime"
      - "It throws NoSuchFieldError"
      - "1, because the compile-time constant was inlined into A's bytecode and A was never recompiled"
      - "It throws IllegalAccessError"
    answer: 2
    explanation: |
      Because VERSION is a static final compile-time constant, javac inlined the literal 1 directly
      into A's bytecode. Since A was not recompiled, it still contains 1 and never reads the new value
      2 from L at runtime. This "constant inlining" pitfall is why public API constants that may change
      should sometimes be computed at runtime rather than declared as inlinable constants.
    ref: "concepts.md#static-initialization-order"
