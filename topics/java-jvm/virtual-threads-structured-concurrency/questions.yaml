topic: "Virtual Threads and Structured Concurrency (JDK 21, Project Loom)"
domain: java-jvm
topic_slug: virtual-threads-structured-concurrency
version: 1
questions:
  - id: virtual-threads-structured-concurrency-001
    difficulty: beginner
    tags: [version, jep, virtual-threads]
    question: |
      In which Java release did virtual threads become a final (permanent, non-preview) feature?
    options:
      - "JDK 21"
      - "JDK 17"
      - "JDK 19"
      - "JDK 24"
    answer: 0
    explanation: |
      Virtual threads were finalized in JDK 21 via JEP 444. They previewed earlier: JEP 425 in JDK 19
      and JEP 436 in JDK 20. JDK 17 predates the feature entirely, and JDK 24 later removed the
      synchronized-pinning limitation (JEP 491) but did not introduce virtual threads.
    ref: "concepts.md#what-are-virtual-threads"

  - id: virtual-threads-structured-concurrency-002
    difficulty: beginner
    tags: [definition, virtual-threads]
    question: |
      Which statement best describes a virtual thread in JDK 21?
    options:
      - "A thread that runs only on GPU cores managed by the JVM"
      - "A separate OS process that shares memory with the JVM"
      - "A lightweight java.lang.Thread scheduled by the JVM and mounted onto OS threads as needed"
      - "A special coroutine type that is not a subclass of java.lang.Thread"
    answer: 2
    explanation: |
      A virtual thread is a real instance of java.lang.Thread, but it is lightweight and scheduled by
      the JVM. It is mounted onto a platform (carrier) OS thread only while running, and unmounted when
      it blocks. It is not a GPU construct, not a process, and it IS a java.lang.Thread subtype.
    ref: "concepts.md#what-are-virtual-threads"

  - id: virtual-threads-structured-concurrency-003
    difficulty: beginner
    tags: [structured-concurrency, status, version]
    question: |
      What is the status of the StructuredTaskScope API (structured concurrency) in JDK 21?
    options:
      - "Finalized alongside virtual threads"
      - "Removed after JDK 20"
      - "Deprecated for removal"
      - "Preview — requires --enable-preview"
    answer: 3
    explanation: |
      Structured concurrency (JEP 453) is a PREVIEW API in JDK 21 and needs --enable-preview to compile
      and run. Only virtual threads (JEP 444) were finalized in 21. It was not removed or deprecated.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"

  - id: virtual-threads-structured-concurrency-004
    difficulty: beginner
    tags: [carrier-thread, scheduler]
    question: |
      What is the "carrier thread" that a virtual thread runs on?
    options:
      - "A dedicated hardware timer thread inside the CPU"
      - "The platform (OS) thread onto which the virtual thread is mounted while executing"
      - "A special garbage-collection thread"
      - "The main thread of the JVM only"
    answer: 1
    explanation: |
      Carrier threads are the platform/OS threads (managed by the JVM's ForkJoinPool scheduler) onto
      which virtual threads are mounted while running. It is not a CPU timer, GC thread, or restricted
      to the main thread.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"

  - id: virtual-threads-structured-concurrency-005
    difficulty: beginner
    tags: [scalability, blocking-io]
    question: |
      What core problem do virtual threads primarily aim to solve?
    options:
      - "Scaling large numbers of blocking-I/O tasks without paying the cost of one OS thread per task"
      - "Making CPU-bound computations run faster than the number of cores allows"
      - "Eliminating the need for garbage collection"
      - "Automatically parallelizing single-threaded algorithms"
    answer: 0
    explanation: |
      Virtual threads make the thread-per-request/blocking-I/O model scale by decoupling task count from
      OS-thread count. They do not speed up CPU-bound work beyond core count, do not remove GC, and do
      not auto-parallelize sequential algorithms.
    ref: "concepts.md#the-thread-per-request-model-without-the-cost"

  - id: virtual-threads-structured-concurrency-006
    difficulty: beginner
    tags: [creation, api]
    question: |
      Which of the following starts a virtual thread in JDK 21?
    options:
      - "new Thread(runnable).start()"
      - "Executors.newFixedThreadPool(10).submit(runnable)"
      - "Thread.startVirtualThread(runnable)"
      - "ForkJoinPool.commonPool().execute(runnable)"
    answer: 2
    explanation: |
      Thread.startVirtualThread(Runnable) creates and starts a virtual thread. `new Thread(...).start()`
      creates a platform thread; newFixedThreadPool and the common pool use platform threads.
    ref: "concepts.md#creating-and-using-virtual-threads"

  - id: virtual-threads-structured-concurrency-007
    difficulty: beginner
    tags: [daemon, properties]
    question: |
      Regarding a virtual thread's daemon status and priority in JDK 21, which is true?
    options:
      - "Virtual threads are always non-daemon and keep the JVM alive"
      - "Virtual threads default to daemon but can be made non-daemon"
      - "Virtual threads have the highest priority by default"
      - "Virtual threads are always daemon threads and their priority cannot be changed"
    answer: 3
    explanation: |
      Virtual threads are always daemon threads (they never keep the JVM alive) and always have priority
      NORM_PRIORITY; attempts to change daemon status or priority are ignored.
    ref: "concepts.md#virtual-threads-versus-platform-threads"

  - id: virtual-threads-structured-concurrency-008
    difficulty: beginner
    tags: [scoped-values, status]
    question: |
      What is the status of Scoped Values (java.lang.ScopedValue) in JDK 21?
    options:
      - "Final and stable"
      - "Preview (JEP 446)"
      - "Only available in JDK 17"
      - "A third-party library, not part of the JDK"
    answer: 1
    explanation: |
      Scoped Values are a preview feature in JDK 21 (JEP 446), requiring --enable-preview. They are part
      of the JDK, not a library, and were not available in JDK 17.
    ref: "concepts.md#scoped-values"

  - id: virtual-threads-structured-concurrency-009
    difficulty: beginner
    tags: [executor, api]
    question: |
      What does Executors.newVirtualThreadPerTaskExecutor() do?
    options:
      - "Creates a new virtual thread for each submitted task"
      - "Creates a bounded pool of reusable virtual threads"
      - "Creates a single virtual thread reused for all tasks"
      - "Creates a pool of platform threads sized to the CPU count"
    answer: 0
    explanation: |
      It creates a new virtual thread per task — not a bounded or single-thread pool, and not platform
      threads. Submitting a million tasks creates a million virtual threads.
    ref: "concepts.md#creating-and-using-virtual-threads"

  - id: virtual-threads-structured-concurrency-010
    difficulty: beginner
    tags: [pinning, definition]
    question: |
      In the context of virtual threads, what does "pinning" mean?
    options:
      - "The virtual thread is permanently bound to one CPU core"
      - "The virtual thread is prevented from being garbage collected"
      - "The virtual thread cannot be unmounted from its carrier thread while blocked"
      - "The virtual thread's stack is pinned in native memory forever"
    answer: 2
    explanation: |
      Pinning means the virtual thread cannot unmount from its carrier while it blocks, so the carrier
      OS thread stays occupied. It is not CPU affinity, GC pinning, or permanent native-memory pinning.
    ref: "concepts.md#pinning-synchronized-and-native-calls"

  - id: virtual-threads-structured-concurrency-011
    difficulty: beginner
    tags: [is-virtual, api]
    question: |
      Which JDK 21 method tells you whether the current thread is virtual?
    options:
      - "Thread.currentThread().isDaemon()"
      - "Thread.isVirtualThread()"
      - "Thread.currentThread().getState() == VIRTUAL"
      - "Thread.currentThread().isVirtual()"
    answer: 3
    explanation: |
      Thread.isVirtual() (an instance method, added in Java 21) returns true for virtual threads.
      isDaemon() checks daemon status, there is no static Thread.isVirtualThread(), and there is no
      VIRTUAL Thread.State.
    ref: "concepts.md#virtual-threads-versus-platform-threads"

  - id: virtual-threads-structured-concurrency-012
    difficulty: intermediate
    tags: [pinning, synchronized]
    question: |
      In JDK 21, consider this code executed on a virtual thread:

      ```java
      synchronized (lock) {
          byte[] data = socket.getInputStream().readAllBytes(); // blocking I/O
      }
      ```
      What happens with respect to the carrier thread?
    options:
      - "The virtual thread unmounts normally; the carrier is freed during the read"
      - "The virtual thread pins its carrier for the duration of the blocking read"
      - "The code fails to compile because synchronized is illegal in virtual threads"
      - "The read is automatically converted to non-blocking, so no pinning occurs"
    answer: 1
    explanation: |
      In JDK 21, blocking inside a synchronized block pins the carrier thread for the whole blocking
      operation, because the monitor is associated with the OS thread. It compiles fine, and there is no
      automatic conversion to non-blocking. (JDK 24's JEP 491 later removed this limitation.)
    ref: "concepts.md#pinning-synchronized-and-native-calls"

  - id: virtual-threads-structured-concurrency-013
    difficulty: intermediate
    tags: [reentrantlock, pinning]
    question: |
      To avoid pinning while holding a lock across a blocking call on a virtual thread in JDK 21, the
      recommended change is to:
    options:
      - "Replace synchronized with a java.util.concurrent.locks.ReentrantLock"
      - "Replace the blocking call with Thread.sleep"
      - "Wrap the synchronized block in another synchronized block"
      - "Increase -Djdk.virtualThreadScheduler.parallelism"
    answer: 0
    explanation: |
      ReentrantLock does not pin the carrier, so a virtual thread can unmount while blocked inside it.
      Sleeping does not help, nesting synchronized makes it worse, and raising scheduler parallelism only
      masks the symptom by adding carriers, not fixing the pin.
    ref: "concepts.md#reentrantlock-versus-synchronized"

  - id: virtual-threads-structured-concurrency-014
    difficulty: intermediate
    tags: [scheduler, forkjoinpool]
    question: |
      By default, which scheduler runs virtual threads, and what is its default parallelism?
    options:
      - "A cached thread pool with unbounded parallelism"
      - "The ForkJoinPool.commonPool() shared with parallel streams"
      - "A dedicated ForkJoinPool (FIFO mode), parallelism = available processors"
      - "A single-threaded executor"
    answer: 2
    explanation: |
      Virtual threads are scheduled by a dedicated ForkJoinPool in FIFO mode whose default parallelism
      equals the number of available processors (tunable via jdk.virtualThreadScheduler.parallelism).
      It is a separate pool from the common pool used by parallel streams.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"

  - id: virtual-threads-structured-concurrency-015
    difficulty: intermediate
    tags: [thread-pools, anti-pattern]
    question: |
      Why is placing virtual threads inside a fixed-size (bounded) thread pool considered an anti-pattern?
    options:
      - "Virtual threads cannot be submitted to any ExecutorService"
      - "Virtual threads throw an exception when reused"
      - "A bounded pool converts them back into platform threads automatically"
      - "Bounding the pool re-imposes the concurrency cap virtual threads were meant to remove, and reusing them breaks per-task identity"
    answer: 3
    explanation: |
      Since virtual threads are cheap to create, pooling gains nothing and a bounded pool reintroduces
      the very thread-count limit virtual threads eliminate; reuse also breaks the clean one-thread-per-
      task model. They can be submitted to executors, do not throw on reuse, and are not converted to
      platform threads.
    ref: "concepts.md#thread-pools-as-an-anti-pattern"

  - id: virtual-threads-structured-concurrency-016
    difficulty: intermediate
    tags: [concurrency-limit, semaphore]
    question: |
      You must limit concurrent access to a resource that supports only 10 simultaneous connections,
      while still using virtual threads. What is the idiomatic approach?
    options:
      - "Use a fixed platform-thread pool of size 10"
      - "Use a Semaphore(10) acquired inside each virtual-thread task"
      - "Set jdk.virtualThreadScheduler.parallelism=10"
      - "Create exactly 10 virtual threads and reuse them"
    answer: 1
    explanation: |
      A Semaphore with 10 permits limits the concurrency to the resource without capping how many virtual
      threads you create. A platform pool of 10 or reusing 10 virtual threads reintroduces pooling
      anti-patterns; scheduler parallelism controls carriers, not this resource limit.
    ref: "concepts.md#thread-pools-as-an-anti-pattern"

  - id: virtual-threads-structured-concurrency-017
    difficulty: intermediate
    tags: [cpu-bound, when-not-to-use]
    question: |
      For a purely CPU-bound workload (e.g. heavy numeric computation), why do virtual threads not
      improve throughput?
    options:
      - "Throughput is bounded by CPU cores, so extra virtual threads only add scheduling overhead"
      - "Virtual threads cannot execute arithmetic operations"
      - "Virtual threads run at a lower priority so they finish slower"
      - "The JVM refuses to schedule more than one virtual thread for CPU work"
    answer: 0
    explanation: |
      CPU-bound throughput is limited by the number of cores; adding more virtual threads than cores
      just adds context-switching/scheduling overhead without more compute. Virtual threads run
      arithmetic fine and are not artificially throttled to one thread.
    ref: "concepts.md#when-virtual-threads-do-not-help-cpu-bound-work"

  - id: virtual-threads-structured-concurrency-018
    difficulty: intermediate
    tags: [thread-local, scoped-values]
    question: |
      Why are ThreadLocal variables discouraged with large numbers of virtual threads, and what is the
      recommended alternative?
    options:
      - "ThreadLocals are illegal on virtual threads; use static fields instead"
      - "ThreadLocals leak the carrier thread; use InheritableThreadLocal instead"
      - "Millions of threads each with ThreadLocal copies can blow up memory; use ScopedValue instead"
      - "ThreadLocals slow down GC; use volatile fields instead"
    answer: 2
    explanation: |
      With potentially millions of virtual threads, per-thread ThreadLocal copies can explode memory and
      are mutable/unbounded. Scoped values are immutable, dynamically scoped, and virtual-thread-friendly.
      ThreadLocals are still legal (just discouraged); static fields and volatiles do not provide the same
      per-invocation context.
    ref: "concepts.md#scoped-values"

  - id: virtual-threads-structured-concurrency-019
    difficulty: intermediate
    tags: [structured-concurrency, shutdown-on-failure]
    question: |
      With StructuredTaskScope.ShutdownOnFailure in JDK 21 (preview), what happens when one forked
      subtask throws an exception?
    options:
      - "The other subtasks continue and their results are silently discarded"
      - "The JVM exits immediately"
      - "The failing subtask is retried automatically up to three times"
      - "The scope cancels the remaining subtasks and throwIfFailed() propagates the failure"
    answer: 3
    explanation: |
      ShutdownOnFailure implements fail-fast semantics: the first subtask failure triggers cancellation
      of the others, and after join(), throwIfFailed() rethrows the failure to the parent. There is no
      silent discard, no JVM exit, and no automatic retry.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"

  - id: virtual-threads-structured-concurrency-020
    difficulty: intermediate
    tags: [structured-concurrency, shutdown-on-success]
    question: |
      Which StructuredTaskScope policy implements "return the result of the first subtask to succeed and
      cancel the rest"?
    options:
      - "ShutdownOnFailure"
      - "ShutdownOnSuccess"
      - "ShutdownOnTimeout"
      - "ShutdownOnCompletion"
    answer: 1
    explanation: |
      ShutdownOnSuccess captures the first successful result and cancels the remaining subtasks (racing/
      "any" semantics). ShutdownOnFailure is the fail-fast/all-must-succeed policy. The other two are not
      built-in JDK 21 policies.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"

  - id: virtual-threads-structured-concurrency-021
    difficulty: intermediate
    tags: [reactive, comparison]
    question: |
      Compared to reactive/CompletableFuture programming, what is the main developer-experience advantage
      of virtual threads?
    options:
      - "You write ordinary sequential blocking code with readable stack traces instead of callback chains"
      - "They provide built-in backpressure for streaming data"
      - "They eliminate the need for exception handling"
      - "They automatically retry failed network calls"
    answer: 0
    explanation: |
      Virtual threads let you write straightforward blocking, sequential code with full, meaningful stack
      traces and normal try/catch/finally — avoiding the callback/operator complexity of reactive code.
      Backpressure/streaming is precisely where reactive still wins; they do not remove exception handling
      or add auto-retry.
    ref: "concepts.md#comparison-to-reactive-and-completablefuture"

  - id: virtual-threads-structured-concurrency-022
    difficulty: intermediate
    tags: [reactive, backpressure]
    question: |
      In which scenario do reactive frameworks (Reactive Streams) still hold an advantage over plain
      virtual threads?
    options:
      - "Simple request/response with blocking downstream calls"
      - "Reading a file synchronously"
      - "Push-based streaming with first-class backpressure"
      - "Sleeping a thread for a fixed duration"
    answer: 2
    explanation: |
      Virtual threads do not provide built-in backpressure or push-based stream composition; Reactive
      Streams do. For plain request/response, blocking file reads, or sleeps, virtual threads are simpler
      and sufficient.
    ref: "concepts.md#comparison-to-reactive-and-completablefuture"

  - id: virtual-threads-structured-concurrency-023
    difficulty: intermediate
    tags: [mount-unmount, internals]
    question: |
      When a virtual thread blocks on a JDK-instrumented operation and later resumes, which is true?
    options:
      - "It always resumes on exactly the same carrier thread it started on"
      - "Its OS thread stack is preserved unchanged in kernel space"
      - "It is destroyed and a brand-new virtual thread replaces it"
      - "Its continuation is stored on the heap and it may be remounted on a different carrier"
    answer: 3
    explanation: |
      On blocking, the virtual thread's stack (continuation) is stored on the Java heap and the carrier is
      freed; on resumption it may be mounted on a different carrier. It is not tied to one carrier, its
      stack is not kept in kernel space, and the same virtual thread object resumes.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"

  - id: virtual-threads-structured-concurrency-024
    difficulty: intermediate
    tags: [code-analysis, executor]
    question: |
      What does this JDK 21 code do?

      ```java
      try (var e = Executors.newVirtualThreadPerTaskExecutor()) {
          IntStream.range(0, 1_000_000).forEach(i ->
              e.submit(() -> { Thread.sleep(Duration.ofSeconds(1)); return i; }));
      }
      ```
    options:
      - "Throws OutOfMemoryError because 1,000,000 OS threads are created"
      - "Creates ~1,000,000 virtual threads that mostly sleep; the try-with-resources waits for all to finish"
      - "Only runs a number of tasks equal to the CPU count; the rest are rejected"
      - "Deadlocks because virtual threads cannot sleep"
    answer: 1
    explanation: |
      Each task gets its own virtual thread; a million sleeping virtual threads are cheap (heap stacks,
      few carriers). The executor is AutoCloseable, so close() at the end of try-with-resources waits for
      all tasks. No million OS threads, no rejection, no deadlock.
    ref: "concepts.md#the-thread-per-request-model-without-the-cost"

  - id: virtual-threads-structured-concurrency-025
    difficulty: intermediate
    tags: [creation, builder-api]
    question: |
      Which API introduced in Java 21 is used to build either platform or virtual threads via a fluent
      builder?
    options:
      - "Thread.Builder via Thread.ofVirtual() / Thread.ofPlatform()"
      - "ThreadGroup.create()"
      - "Executors.threadBuilder()"
      - "Thread.newInstance()"
    answer: 0
    explanation: |
      Thread.ofVirtual() and Thread.ofPlatform() return Thread.Builder instances (new in Java 21) with
      fluent configuration. ThreadGroup.create(), Executors.threadBuilder(), and Thread.newInstance() are
      not real APIs for this.
    ref: "concepts.md#creating-and-using-virtual-threads"

  - id: virtual-threads-structured-concurrency-026
    difficulty: intermediate
    tags: [version, preview-history]
    question: |
      Which pair correctly lists the two preview releases of virtual threads before finalization?
    options:
      - "JDK 17 (JEP 425) and JDK 18 (JEP 436)"
      - "JDK 20 (JEP 436) and JDK 21 (JEP 444)"
      - "JDK 19 (JEP 425) and JDK 20 (JEP 436)"
      - "JDK 15 (JEP 425) and JDK 16 (JEP 436)"
    answer: 2
    explanation: |
      Virtual threads previewed in JDK 19 (JEP 425) and again in JDK 20 (JEP 436), then were finalized in
      JDK 21 (JEP 444). The other pairings misattribute the versions/JEPs.
    ref: "concepts.md#what-are-virtual-threads"

  - id: virtual-threads-structured-concurrency-027
    difficulty: advanced
    tags: [pinning, native, edge-case]
    question: |
      Besides blocking inside a synchronized block, what else causes a virtual thread to pin its carrier
      in JDK 21?
    options:
      - "Calling Thread.sleep(Duration)"
      - "Reading from a java.util.concurrent BlockingQueue"
      - "Awaiting a CompletableFuture with get()"
      - "Blocking while executing a native method or foreign function (JNI/FFM downcall)"
    answer: 3
    explanation: |
      Native/foreign-function frames on the stack prevent unmounting, so blocking within them pins the
      carrier. Thread.sleep, BlockingQueue.take, and Future.get are JDK-instrumented and unmount cleanly
      (do not pin).
    ref: "concepts.md#pinning-synchronized-and-native-calls"

  - id: virtual-threads-structured-concurrency-028
    difficulty: advanced
    tags: [pinning, detection]
    question: |
      Which JVM flag helps you detect pinning of virtual threads at runtime in JDK 21?
    options:
      - "-XX:+PrintPinnedThreads"
      - "-Djdk.tracePinnedThreads=full"
      - "-Dvirtual.threads.debug=true"
      - "-XX:+TraceVirtualThreads"
    answer: 1
    explanation: |
      -Djdk.tracePinnedThreads=full (or =short) prints a stack trace whenever a virtual thread pins its
      carrier while blocking. The other flags are not real JVM options for this purpose.
    ref: "concepts.md#pinning-synchronized-and-native-calls"

  - id: virtual-threads-structured-concurrency-029
    difficulty: advanced
    tags: [version, jep-491, synchronized]
    question: |
      The limitation that a virtual thread pins its carrier when blocking inside a synchronized block was
      addressed in which later release/JEP?
    options:
      - "JDK 24, JEP 491"
      - "JDK 21, JEP 444"
      - "JDK 22, JEP 453"
      - "JDK 17, JEP 306"
    answer: 0
    explanation: |
      JEP 491 (JDK 24) allows virtual threads to unmount even inside synchronized blocks, removing that
      pinning source. In JDK 21 the pinning is real. JEP 444 finalized virtual threads (21), JEP 453 is
      structured concurrency, JEP 306 is unrelated (floating-point).
    ref: "concepts.md#pinning-synchronized-and-native-calls"

  - id: virtual-threads-structured-concurrency-030
    difficulty: advanced
    tags: [scheduler, preemption, edge-case]
    question: |
      A virtual thread runs a tight, purely CPU-bound loop with no blocking calls. What is the behavior of
      the default JDK 21 scheduler?
    options:
      - "It time-slices the loop every 10ms, freeing the carrier periodically"
      - "It automatically migrates the loop to another carrier every second"
      - "It does not preempt between blocking points, so the virtual thread monopolizes its carrier until it yields or blocks"
      - "It throws a StackOverflowError to break the loop"
    answer: 2
    explanation: |
      The scheduler is cooperative around blocking/instrumented points, not preemptively time-sliced; a
      CPU loop that never blocks holds its carrier until it finishes, yields, or blocks. There is no 10ms
      slice, no automatic migration mid-loop, and no forced error.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"

  - id: virtual-threads-structured-concurrency-031
    difficulty: advanced
    tags: [structured-concurrency, confinement, edge-case]
    question: |
      In the JDK 21 StructuredTaskScope preview API, which sequence is required for correct usage inside
      the try-with-resources block?
    options:
      - "fork subtasks, then close() immediately without join()"
      - "join() first, then fork subtasks, then throwIfFailed()"
      - "call throwIfFailed() before any fork() to pre-register failures"
      - "fork subtasks, then join(), then (for ShutdownOnFailure) throwIfFailed(), then read results"
    answer: 3
    explanation: |
      The correct order is: fork() the subtasks, join() to wait for them, then throwIfFailed() to
      propagate any error, then read results via the returned Suppliers. You must join before reading
      results, and throwIfFailed only makes sense after join.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"

  - id: virtual-threads-structured-concurrency-032
    difficulty: advanced
    tags: [scoped-values, immutability]
    question: |
      Which statement about ScopedValue (JDK 21 preview) is correct?
    options:
      - "A bound ScopedValue can be freely reassigned at any point with set()"
      - "It is immutable within its dynamic scope; rebinding requires a nested where(...) scope"
      - "It must be manually cleared with remove() to avoid leaks"
      - "It is only visible on the thread that created it, never on forked subtasks"
    answer: 1
    explanation: |
      ScopedValue is immutable for the duration of the binding; to use a different value you open a nested
      where(...) scope. There is no set()/remove() (that's ThreadLocal), and bindings are visible to
      subtasks forked within the scope.
    ref: "concepts.md#scoped-values"

  - id: virtual-threads-structured-concurrency-033
    difficulty: advanced
    tags: [code-analysis, pinning, reentrantlock]
    question: |
      Two virtual-thread tasks run the following bodies. Which best describes the JDK 21 behavior?

      ```java
      // Task A
      synchronized (m) { httpClient.send(req, handler); }   // blocking send
      // Task B
      lock.lock(); try { httpClient.send(req, handler); } finally { lock.unlock(); }
      ```
    options:
      - "A pins its carrier during the send; B does not pin and unmounts while blocked"
      - "Both A and B pin their carriers during the send"
      - "B pins its carrier during the send; A does not pin"
      - "Neither pins because HTTP is asynchronous"
    answer: 0
    explanation: |
      Blocking inside the synchronized block (Task A) pins the carrier in JDK 21. Task B uses ReentrantLock,
      which does not pin, so the virtual thread unmounts during the blocking send. The blocking send is a
      real block, so 'neither pins' is wrong.
    ref: "concepts.md#reentrantlock-versus-synchronized"

  - id: virtual-threads-structured-concurrency-034
    difficulty: advanced
    tags: [reactive, throughput, trade-off]
    question: |
      A team migrates a blocking-I/O microservice from a 200-thread platform pool to one virtual thread
      per request. Assuming downstream services are the bottleneck, what is the most likely outcome?
    options:
      - "Throughput is capped at 200 concurrent requests as before"
      - "CPU-bound sections become dramatically faster"
      - "Concurrency now scales toward the downstream capacity instead of the old thread-count limit"
      - "The service can no longer handle blocking calls"
    answer: 2
    explanation: |
      Removing the 200-thread cap lets concurrency rise to the real bottleneck (downstream capacity)
      rather than an arbitrary thread count. It does not speed up CPU-bound code, and blocking calls are
      exactly what virtual threads handle well.
    ref: "concepts.md#the-thread-per-request-model-without-the-cost"

  - id: virtual-threads-structured-concurrency-035
    difficulty: advanced
    tags: [scheduler, parallelism, tuning]
    question: |
      Which system property tunes the parallelism (number of carrier threads) of the default virtual
      thread scheduler?
    options:
      - "java.util.concurrent.ForkJoinPool.common.parallelism"
      - "jdk.virtualThread.carrierCount"
      - "vm.virtualThreads.maxCarriers"
      - "jdk.virtualThreadScheduler.parallelism"
    answer: 3
    explanation: |
      jdk.virtualThreadScheduler.parallelism sets the scheduler's parallelism (default = available
      processors). The ForkJoinPool.common.parallelism property affects the common pool (parallel
      streams), not the virtual-thread scheduler. The other two are not real properties.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"

  - id: virtual-threads-structured-concurrency-036
    difficulty: advanced
    tags: [code-analysis, daemon, jvm-exit]
    question: |
      What is the risk in this snippet?

      ```java
      public static void main(String[] args) {
          Thread.startVirtualThread(() -> {
              // long-running background work
              doWork();
          });
      }
      ```
    options:
      - "It will not compile because main cannot start virtual threads"
      - "The JVM may exit before doWork() finishes, because virtual threads are daemon threads"
      - "The virtual thread will keep the JVM alive until doWork() completes"
      - "doWork() runs on the main platform thread, blocking main"
    answer: 1
    explanation: |
      Virtual threads are daemon threads, so they do not keep the JVM alive. When main returns, the JVM
      may exit before doWork() completes. You must join the thread (or otherwise wait). It compiles fine,
      does not keep the JVM alive, and runs on a separate virtual thread, not main.
    ref: "concepts.md#virtual-threads-versus-platform-threads"

  - id: virtual-threads-structured-concurrency-037
    difficulty: advanced
    tags: [structured-concurrency, leak, motivation]
    question: |
      What problem with unstructured ExecutorService fan-out does structured concurrency specifically fix?
    options:
      - "It ensures forked subtasks complete or are cancelled before the enclosing scope exits, preventing thread/error leaks"
      - "It makes tasks run faster by using SIMD instructions"
      - "It removes the need for virtual threads"
      - "It guarantees results are always returned in submission order"
    answer: 0
    explanation: |
      Structured concurrency binds subtask lifetimes to a lexical scope: subtasks must finish or be
      cancelled before the scope closes, and errors propagate to the parent — preventing orphaned threads
      and lost exceptions. It does not add SIMD, replace virtual threads, or guarantee submission ordering.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"

  - id: virtual-threads-structured-concurrency-038
    difficulty: advanced
    tags: [memory, stack, internals]
    question: |
      How does a virtual thread's stack differ from a platform thread's stack?
    options:
      - "The virtual thread has no stack at all"
      - "Both use identical fixed 1 MB OS stacks"
      - "The virtual thread's stack lives on the Java heap and grows/shrinks; the platform thread's is a fixed OS stack (~1 MB)"
      - "The virtual thread's stack is stored in the CPU registers only"
    answer: 2
    explanation: |
      A virtual thread's stack is stored on the Java heap (as a continuation) and resizes as needed, so it
      is cheap; a platform thread uses a large fixed OS stack (~1 MB). It does have a stack, they are not
      identical, and it is not register-only.
    ref: "concepts.md#virtual-threads-versus-platform-threads"

  - id: virtual-threads-structured-concurrency-039
    difficulty: advanced
    tags: [cpu-bound, design]
    question: |
      A workload does heavy image transformations (CPU-bound) with occasional blocking uploads. What is a
      reasonable design in JDK 21?
    options:
      - "Run everything on one giant unbounded set of virtual threads and rely on the scheduler"
      - "Use only synchronized blocks around the CPU work to force pinning"
      - "Avoid threads entirely and run sequentially"
      - "Do CPU transforms on a bounded platform pool sized near core count, and use virtual threads for the blocking upload phase"
    answer: 3
    explanation: |
      Separate the concerns: CPU-bound transforms belong on a bounded platform pool near the core count
      (parallelism), while blocking uploads scale well on virtual threads (concurrency). Piling CPU work on
      unbounded virtual threads just adds overhead; forcing pinning is counterproductive.
    ref: "concepts.md#when-virtual-threads-do-not-help-cpu-bound-work"

  - id: virtual-threads-structured-concurrency-040
    difficulty: expert
    tags: [code-analysis, structured-concurrency, cancellation]
    question: |
      Given (JDK 21 preview, --enable-preview):

      ```java
      try (var scope = new StructuredTaskScope.ShutdownOnSuccess<String>()) {
          scope.fork(() -> { Thread.sleep(2000); return "slow"; });
          scope.fork(() -> { Thread.sleep(50);   return "fast"; });
          scope.join();
          System.out.println(scope.result());
      }
      ```
      What is the most likely printed value and what happens to the slow subtask?
    options:
      - "Prints \"slow\"; the fast subtask is cancelled"
      - "Prints \"fast\"; the slow subtask is cancelled/interrupted when the first success occurs"
      - "Prints both \"fast\" and \"slow\""
      - "Throws because two subtasks succeed"
    answer: 1
    explanation: |
      ShutdownOnSuccess completes on the first successful subtask ("fast" at ~50ms) and shuts down the
      scope, cancelling/interrupting the still-running slow subtask. result() returns the first success;
      it does not print both, and having a later success does not throw.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"

  - id: virtual-threads-structured-concurrency-041
    difficulty: expert
    tags: [pinning, starvation, edge-case]
    question: |
      In JDK 21, why can many virtual threads simultaneously pinning their carriers lead to a throughput
      collapse resembling deadlock?
    options:
      - "Pinned carriers stay occupied and the scheduler can add only a limited number of extra carriers, so runnable virtual threads may be starved"
      - "Pinned virtual threads consume the entire Java heap"
      - "The garbage collector stops the world permanently"
      - "Pinning corrupts the ForkJoinPool work-stealing deque"
    answer: 0
    explanation: |
      Each pinned carrier is stuck while its virtual thread blocks; because the pool grows carriers only
      up to a limit, if enough pin at once there are no free carriers to run other ready virtual threads —
      a starvation/deadlock-like throughput collapse. It is not heap exhaustion, a permanent GC pause, or
      deque corruption.
    ref: "concepts.md#pinning-synchronized-and-native-calls"

  - id: virtual-threads-structured-concurrency-042
    difficulty: expert
    tags: [code-analysis, thread-local, pooling]
    question: |
      A service caches a heavyweight SimpleDateFormat in a ThreadLocal and runs one virtual thread per
      request at ~500k concurrent requests. What is the primary risk?
    options:
      - "SimpleDateFormat is now thread-safe, so no risk"
      - "The formatter is shared across all virtual threads causing data races"
      - "Roughly 500k ThreadLocal copies of the formatter are retained, risking excessive memory use"
      - "ThreadLocal is illegal on virtual threads and throws at runtime"
    answer: 2
    explanation: |
      One ThreadLocal copy per virtual thread means ~500k live formatter instances, which can blow up
      memory — the anti-pattern virtual threads expose. ThreadLocal isolates per thread (so no sharing/
      race and it is not illegal), but the per-thread caching optimization backfires at scale. Prefer a
      ScopedValue or a small shared pool.
    ref: "concepts.md#scoped-values"

  - id: virtual-threads-structured-concurrency-043
    difficulty: expert
    tags: [internals, continuation]
    question: |
      Which low-level JVM mechanism underlies a virtual thread's ability to unmount and later resume its
      execution state?
    options:
      - "OS-level fibers exposed through JNI"
      - "Copying the OS thread's kernel stack into shared memory"
      - "Serializing the thread to disk and reloading it"
      - "Delimited continuations captured by the JVM, storing the stack on the heap"
    answer: 3
    explanation: |
      Virtual threads are built on the JVM's (internal) delimited continuation support: the runtime
      captures the virtual thread's stack as a continuation on the heap so it can be unmounted and later
      resumed. It is not OS fibers, kernel-stack copying, or disk serialization.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"

  - id: virtual-threads-structured-concurrency-044
    difficulty: expert
    tags: [code-analysis, synchronized, decision]
    question: |
      You find a synchronized method that only increments an in-memory counter and returns — no I/O, no
      blocking. On virtual threads in JDK 21, what is the best action?
    options:
      - "Immediately rewrite it as ReentrantLock to avoid pinning"
      - "Leave it as synchronized; pinning only harms throughput when blocking occurs while pinned"
      - "Wrap it in a Semaphore to prevent pinning"
      - "Move it onto a platform thread pool"
    answer: 1
    explanation: |
      Pinning is only a problem when a virtual thread BLOCKS while pinned. A short, non-blocking
      synchronized critical section does not block, so it is fine to leave as-is. Not every synchronized
      block needs converting; a Semaphore or platform pool would be needless complexity here.
    ref: "concepts.md#reentrantlock-versus-synchronized"

  - id: virtual-threads-structured-concurrency-045
    difficulty: expert
    tags: [structured-concurrency, custom-policy]
    question: |
      Beyond the two built-in shutdown policies, how does the JDK 21 StructuredTaskScope preview support
      custom completion policies?
    options:
      - "By subclassing StructuredTaskScope and overriding handleComplete(...) to collect results/errors"
      - "It does not; only the two built-ins exist and cannot be extended"
      - "By passing a lambda to StructuredTaskScope.of(...)"
      - "By annotating subtasks with @OnComplete"
    answer: 0
    explanation: |
      In the JDK 21 preview (JEP 453) you subclass StructuredTaskScope and override
      handleComplete(Future<T>) to implement custom aggregation/short-circuit logic beyond
      ShutdownOnFailure/ShutdownOnSuccess. (The Subtask type only arrived later in JEP 462/JDK 22.)
      There is no of(lambda) factory or @OnComplete annotation in this preview API.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"

  - id: virtual-threads-structured-concurrency-046
    difficulty: expert
    tags: [code-analysis, executor-close, semantics]
    question: |
      In JDK 21, what is the behavior of closing a newVirtualThreadPerTaskExecutor via try-with-resources
      while tasks are still running?

      ```java
      try (var e = Executors.newVirtualThreadPerTaskExecutor()) {
          e.submit(task1);
          e.submit(task2);
      } // <-- here
      ```
    options:
      - "close() returns immediately and abandons the tasks"
      - "close() cancels all tasks and interrupts them right away"
      - "close() blocks until all submitted tasks complete (like an implicit shutdown + awaitTermination)"
      - "It does not compile because ExecutorService is not AutoCloseable"
    answer: 2
    explanation: |
      Since Java 19, ExecutorService implements AutoCloseable, and close() performs an orderly shutdown
      that waits for previously submitted tasks to finish. It does not abandon or forcibly cancel them,
      and it compiles because ExecutorService IS AutoCloseable.
    ref: "concepts.md#the-thread-per-request-model-without-the-cost"

  - id: virtual-threads-structured-concurrency-047
    difficulty: expert
    tags: [scoped-values, structured-concurrency, inheritance]
    question: |
      How do ScopedValue bindings interact with subtasks forked inside a StructuredTaskScope (JDK 21
      preview)?
    options:
      - "Subtasks cannot see any ScopedValue from the parent"
      - "Each subtask must re-bind every ScopedValue manually with where()"
      - "ScopedValues are copied and mutated independently per subtask"
      - "Subtasks automatically inherit the parent's ScopedValue bindings for the scope's lifetime"
    answer: 3
    explanation: |
      Scoped values are designed to be inherited by subtasks forked within the dynamic scope where they
      are bound, providing safe context propagation without manual passing. They are not invisible, need
      not be re-bound per subtask, and are immutable (not independently mutated copies).
    ref: "concepts.md#scoped-values"

  - id: virtual-threads-structured-concurrency-048
    difficulty: intermediate
    tags: [comparison, table]
    question: |
      Which capability does ReentrantLock offer that intrinsic synchronized does not?
    options:
      - "Automatic release when the block exits"
      - "Interruptible lock acquisition and tryLock with a timeout"
      - "Zero lines of code to use"
      - "Guaranteed no deadlocks"
    answer: 1
    explanation: |
      ReentrantLock supports interruptible acquisition, tryLock(timeout), fairness, and multiple
      Conditions. synchronized auto-releases and is terser, but ReentrantLock requires manual unlock in
      finally. Neither guarantees deadlock freedom.
    ref: "concepts.md#reentrantlock-versus-synchronized"

  - id: virtual-threads-structured-concurrency-049
    difficulty: intermediate
    tags: [count, scalability]
    question: |
      Roughly how many virtual threads can a typical JVM support compared to platform threads?
    options:
      - "Millions of virtual threads versus a few thousand platform threads"
      - "About the same number as platform threads"
      - "Fewer than platform threads because each needs a 2 MB stack"
      - "Exactly one per CPU core"
    answer: 0
    explanation: |
      Because virtual threads use cheap heap-based growable stacks, a JVM can host millions of them, versus
      only a few thousand platform threads limited by ~1 MB OS stacks and kernel overhead.
    ref: "concepts.md#virtual-threads-versus-platform-threads"

  - id: virtual-threads-structured-concurrency-050
    difficulty: beginner
    tags: [structured-concurrency, jep]
    question: |
      Which JEP number corresponds to the Structured Concurrency preview in JDK 21?
    options:
      - "JEP 444"
      - "JEP 446"
      - "JEP 453"
      - "JEP 425"
    answer: 2
    explanation: |
      JEP 453 is Structured Concurrency (preview) in JDK 21. JEP 444 is final virtual threads, JEP 446 is
      Scoped Values (preview), and JEP 425 was the first virtual-threads preview (JDK 19).
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"

  - id: virtual-threads-structured-concurrency-051
    difficulty: intermediate
    tags: [code-analysis, is-virtual]
    question: |
      What does this print in JDK 21?

      ```java
      Thread.ofVirtual().start(() ->
          System.out.println(Thread.currentThread().isVirtual())).join();
      ```
      (assume join is handled correctly)
    options:
      - "false"
      - "It throws UnsupportedOperationException"
      - "It prints nothing"
      - "true"
    answer: 3
    explanation: |
      The runnable executes on a virtual thread, so Thread.currentThread().isVirtual() returns true. There
      is no exception, and the println does run.
    ref: "concepts.md#virtual-threads-versus-platform-threads"

  - id: virtual-threads-structured-concurrency-052
    difficulty: intermediate
    tags: [reactive, migration]
    question: |
      Which statement about combining virtual threads with existing code is most accurate?
    options:
      - "All existing synchronous blocking libraries must be rewritten to be non-blocking"
      - "Most existing blocking JDK APIs (sockets, files, locks) already unmount virtual threads because they were retrofitted"
      - "Virtual threads only work with reactive libraries like Reactor"
      - "Virtual threads require rewriting code as CompletableFuture chains"
    answer: 1
    explanation: |
      A major benefit is that the JDK's blocking APIs (java.net sockets, NIO, java.util.concurrent locks,
      etc.) were updated so blocking on them unmounts the virtual thread — existing blocking code just
      works. You do not need reactive libraries or CompletableFuture rewrites.
    ref: "concepts.md#comparison-to-reactive-and-completablefuture"

  - id: virtual-threads-structured-concurrency-053
    difficulty: advanced
    tags: [code-analysis, structured-concurrency, exception]
    question: |
      Given (JDK 21 preview):

      ```java
      try (var scope = new StructuredTaskScope.ShutdownOnFailure()) {
          var a = scope.fork(() -> callA());  // throws IOException
          var b = scope.fork(() -> callB());  // slow, still running
          scope.join();
          scope.throwIfFailed();
          use(a.get(), b.get());
      }
      ```
      If callA() throws IOException, what happens?
    options:
      - "The scope cancels callB, and throwIfFailed() throws an ExecutionException wrapping the IOException"
      - "use() is called with a null for a and the result of b"
      - "The IOException is swallowed and use() runs normally"
      - "callA is retried until it succeeds"
    answer: 0
    explanation: |
      ShutdownOnFailure shuts down the scope on the first failure (cancelling callB) and throwIfFailed()
      throws an ExecutionException wrapping the IOException, so use() is never reached. The exception is
      not swallowed, and there is no retry.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"

  - id: virtual-threads-structured-concurrency-054
    difficulty: advanced
    tags: [subtask-get, structured-concurrency, edge-case]
    question: |
      In the JDK 21 StructuredTaskScope preview, fork() returns a Supplier<T>. When is it valid to call
      that Supplier's get() to retrieve a forked subtask's result?
    options:
      - "Immediately after fork(), before join()"
      - "Only from a different thread than the scope owner"
      - "Only after join() has returned and the subtask completed successfully"
      - "At any time, even while the subtask is still running"
    answer: 2
    explanation: |
      In JDK 21 (JEP 453) fork() returns a Supplier<T>; calling its get() is only valid after join()
      completes and for a subtask that finished successfully. Calling it before join or while running
      throws IllegalStateException. Fork/join/result access is confined to the scope owner.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"

  - id: virtual-threads-structured-concurrency-055
    difficulty: advanced
    tags: [carrier, thread-local, identity]
    question: |
      Why should you avoid using carrier-thread identity as a cache key or lock key with virtual threads?
    options:
      - "Virtual threads share a single Thread object"
      - "Virtual threads have no thread id"
      - "The id changes every millisecond by design"
      - "A virtual thread has a distinct, stable identity but the carrier it runs on can change across mount/unmount, so carrier identity is unreliable"
    answer: 3
    explanation: |
      Each virtual thread has its own stable identity, but the CARRIER it runs on can change across
      unmount/remount, so keying on carrier identity is unreliable. Virtual threads do not share one
      object, do have ids, and those ids do not change every millisecond.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"

  - id: virtual-threads-structured-concurrency-056
    difficulty: expert
    tags: [code-analysis, cpu-bound, benchmark]
    question: |
      On an 8-core machine, you run 10,000 virtual threads each doing a 1-second pure CPU computation with
      no blocking. Approximately how long until all complete, ignoring overhead?
    options:
      - "About 1 second, because virtual threads run in parallel massively"
      - "About 10,000 / 8 ≈ 1,250 seconds, because CPU throughput is bounded by 8 cores"
      - "Instantly, because the JVM batches CPU work"
      - "Never, because CPU-bound virtual threads deadlock"
    answer: 1
    explanation: |
      Only 8 cores can compute at once, so 10,000 seconds of CPU work divided across 8 cores is roughly
      1,250 seconds. Virtual threads do not add cores; there is no massive parallelism, no batching magic,
      and no deadlock for CPU work.
    ref: "concepts.md#when-virtual-threads-do-not-help-cpu-bound-work"

  - id: virtual-threads-structured-concurrency-057
    difficulty: intermediate
    tags: [version, scoped-values, jep]
    question: |
      Which JEP introduced Scoped Values as a preview in JDK 21?
    options:
      - "JEP 446"
      - "JEP 444"
      - "JEP 453"
      - "JEP 436"
    answer: 0
    explanation: |
      JEP 446 is Scoped Values (preview) in JDK 21. JEP 444 = final virtual threads, JEP 453 = structured
      concurrency preview, JEP 436 = second virtual-threads preview (JDK 20).
    ref: "concepts.md#scoped-values"

  - id: virtual-threads-structured-concurrency-058
    difficulty: intermediate
    tags: [code-analysis, factory]
    question: |
      What kind of threads does this factory produce?

      ```java
      ThreadFactory tf = Thread.ofVirtual().name("task-", 0).factory();
      Thread t = tf.newThread(() -> {});
      ```
    options:
      - "Platform threads named task-0, task-1, ..."
      - "A single reused virtual thread"
      - "Virtual threads named task-0, task-1, ... (counter increments per created thread)"
      - "Daemon platform threads with no name"
    answer: 2
    explanation: |
      Thread.ofVirtual() builds virtual threads; name("task-", 0) sets a name prefix with a starting
      counter, so successive threads are task-0, task-1, etc. The factory creates new virtual threads each
      call, not platform threads or a single reused thread.
    ref: "concepts.md#creating-and-using-virtual-threads"

  - id: virtual-threads-structured-concurrency-059
    difficulty: advanced
    tags: [debugging, thread-dump]
    question: |
      Which observability advantage do virtual threads and structured concurrency provide over reactive
      callback chains?
    options:
      - "They disable stack traces to save memory"
      - "They export metrics automatically to CloudWatch"
      - "They compress stack traces into a single frame"
      - "Thread dumps show each task's full stack (and parent-child hierarchy under structured concurrency), aiding debugging"
    answer: 3
    explanation: |
      Because each task is a real thread with its own stack, thread dumps show meaningful per-task stacks,
      and structured concurrency adds parent-child hierarchy — far easier to debug than fragmented reactive
      callbacks. They do not disable/compress stack traces or auto-export metrics.
    ref: "concepts.md#comparison-to-reactive-and-completablefuture"

  - id: virtual-threads-structured-concurrency-060
    difficulty: beginner
    tags: [concurrency-vs-parallelism]
    question: |
      Which slogan best captures the intended use of virtual threads versus platform-thread pools?
    options:
      - "Virtual threads for parallelism; platform pools for concurrency"
      - "Virtual threads for concurrency (many waiting tasks); platform pools / parallel streams for parallelism (many computing tasks)"
      - "Both are only for CPU-bound work"
      - "Both are only for blocking I/O"
    answer: 1
    explanation: |
      Virtual threads excel at concurrency — huge numbers of mostly-waiting (I/O) tasks — while bounded
      platform pools or parallel streams handle parallelism — many simultaneously computing CPU-bound
      tasks. The other options invert or overgeneralize this.
    ref: "concepts.md#when-virtual-threads-do-not-help-cpu-bound-work"

  - id: virtual-threads-structured-concurrency-061
    difficulty: advanced
    tags: [code-analysis, compile, preview]
    question: |
      A developer writes StructuredTaskScope code and compiles it on JDK 21 with `javac Main.java` (no
      extra flags). What happens?
    options:
      - "Compilation fails because StructuredTaskScope is a preview API requiring --enable-preview --release 21"
      - "It compiles and runs normally; StructuredTaskScope is final in 21"
      - "It compiles but throws NoClassDefFoundError at runtime"
      - "It silently falls back to a platform-thread executor"
    answer: 0
    explanation: |
      StructuredTaskScope is a preview API in JDK 21, so it cannot be used without --enable-preview (and
      --release/-source 21) at both compile and run time; plain javac errors on preview API use. It is not
      final in 21 and there is no silent fallback.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"

  - id: virtual-threads-structured-concurrency-062
    difficulty: expert
    tags: [code-analysis, semaphore, pinning, trap]
    question: |
      A team limits DB concurrency with `synchronized (dbGate) { conn.executeQuery(sql); }` running on
      virtual threads in JDK 21. Reviewers flag it. What is the strongest reason and best fix?
    options:
      - "synchronized is slower than volatile; switch to volatile"
      - "synchronized cannot guard a database; move the query outside any guard"
      - "The blocking query inside synchronized pins carriers, throttling all virtual threads; use a Semaphore (or ReentrantLock) around the query instead"
      - "The query must run on a platform thread; wrap it in newFixedThreadPool"
    answer: 2
    explanation: |
      Blocking (the query) inside a synchronized block pins the carrier in JDK 21; with many requests this
      starves carriers and collapses throughput. Replace it with a Semaphore for the concurrency limit (or
      ReentrantLock) so virtual threads can unmount while the query blocks. volatile does not provide
      mutual exclusion, the guard is legitimate, and a fixed platform pool is unnecessary.
    ref: "concepts.md#reentrantlock-versus-synchronized"

  - id: virtual-threads-structured-concurrency-063
    difficulty: intermediate
    tags: [platform-thread, api]
    question: |
      Which call explicitly creates and starts a PLATFORM (OS-backed) thread using the Java 21 builder API?
    options:
      - "Thread.startVirtualThread(task)"
      - "Executors.newVirtualThreadPerTaskExecutor().submit(task)"
      - "Thread.ofVirtual().start(task)"
      - "Thread.ofPlatform().start(task)"
    answer: 3
    explanation: |
      Thread.ofPlatform().start(task) builds and starts a platform thread. startVirtualThread and
      Thread.ofVirtual().start create virtual threads, and newVirtualThreadPerTaskExecutor uses virtual
      threads.
    ref: "concepts.md#creating-and-using-virtual-threads"

  - id: virtual-threads-structured-concurrency-064
    difficulty: expert
    tags: [internals, blocking, unmount-triggers]
    question: |
      Which of these operations does NOT (by itself) cause a virtual thread to unmount from its carrier in
      JDK 21?
    options:
      - "Thread.sleep(Duration)"
      - "A busy-wait spin loop like while(!ready) {} with no blocking call"
      - "Blocking on a Selector / socket read via NIO"
      - "LockSupport.park()"
    answer: 1
    explanation: |
      A pure busy-wait spin loop contains no blocking/instrumented point, so the virtual thread never
      unmounts and just burns its carrier. Thread.sleep, NIO blocking reads, and LockSupport.park are
      unmount points that free the carrier.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"

  - id: virtual-threads-structured-concurrency-065
    difficulty: beginner
    tags: [lts, releases]
    question: |
      Which two of the following are the current LTS releases relevant to adopting virtual threads?
    options:
      - "JDK 17 and JDK 21"
      - "JDK 8 and JDK 11"
      - "JDK 19 and JDK 20"
      - "JDK 14 and JDK 16"
