topic: "Virtual Threads and Structured Concurrency (JDK 21, Project Loom)"
domain: java-jvm
topic_slug: virtual-threads-structured-concurrency
version: 1
questions:
  - id: virtual-threads-structured-concurrency-001
    difficulty: beginner
    tags: [version, virtual-threads, loom]
    question: |
      In which Java release were virtual threads finalized (made a permanent, non-preview feature)?
    options:
      - "JDK 21"
      - "JDK 19"
      - "JDK 17"
      - "JDK 23"
    answer: 0
    explanation: |
      Virtual threads were previewed in JDK 19 (JEP 425) and JDK 20 (JEP 436), then finalized in
      JDK 21 (JEP 444). JDK 17 is an LTS but predates virtual threads entirely. JDK 19 was only the
      first preview, not final.
    ref: "concepts.md#what-are-virtual-threads"
  - id: virtual-threads-structured-concurrency-002
    difficulty: beginner
    tags: [definition, virtual-threads]
    question: |
      What best describes a virtual thread in JDK 21?
    options:
      - "A brand-new class type unrelated to java.lang.Thread, requiring a separate API"
      - "A coroutine object that cannot be joined or named"
      - "A lightweight java.lang.Thread scheduled by the JVM and multiplexed onto carrier platform threads"
      - "A pooled OS thread that is recycled between tasks"
    answer: 2
    explanation: |
      A virtual thread is a full java.lang.Thread (not a new type), but it is scheduled by the JVM
      and runs by being mounted onto a carrier platform thread. It supports join, names, and stack
      traces. It is not a separate coroutine type, and it is not a recycled OS thread.
    ref: "concepts.md#what-are-virtual-threads"
  - id: virtual-threads-structured-concurrency-003
    difficulty: beginner
    tags: [status, structured-concurrency, version]
    question: |
      What is the status of structured concurrency (StructuredTaskScope) in JDK 21?
    options:
      - "Finalized alongside virtual threads"
      - "Available only as a third-party library"
      - "Removed from the JDK"
      - "A preview feature, not final"
    answer: 3
    explanation: |
      Structured concurrency is a preview API in JDK 21 (JEP 453) and must be enabled with
      --enable-preview. It was NOT finalized in 21 (unlike virtual threads). It ships in the JDK
      (java.util.concurrent.StructuredTaskScope), not as a third-party library.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"
  - id: virtual-threads-structured-concurrency-004
    difficulty: beginner
    tags: [problem, blocking-io]
    question: |
      What core problem do virtual threads primarily solve?
    options:
      - "They make CPU-bound numeric computations run faster on multiple cores"
      - "They let the thread-per-request model scale to many concurrent blocking-I/O tasks without exhausting OS threads"
      - "They eliminate the need for garbage collection"
      - "They guarantee lower latency for every individual request"
    answer: 1
    explanation: |
      Virtual threads make blocking cheap, so you can keep the simple thread-per-request model while
      serving huge numbers of concurrent I/O-bound requests. They do not speed up CPU-bound work
      (still limited by cores), do not affect GC, and do not reduce a single task's latency.
    ref: "concepts.md#the-thread-per-request-model-without-the-cost"
  - id: virtual-threads-structured-concurrency-005
    difficulty: beginner
    tags: [creation, api]
    question: |
      Which of the following creates and starts a virtual thread in JDK 21?
    options:
      - "Thread.startVirtualThread(runnable)"
      - "new Thread(runnable).start()"
      - "Executors.newFixedThreadPool(1).submit(runnable)"
      - "Runtime.getRuntime().exec(runnable)"
    answer: 0
    explanation: |
      Thread.startVirtualThread(Runnable) and Thread.ofVirtual().start(...) create virtual threads.
      new Thread(...).start() creates a platform thread. newFixedThreadPool uses platform threads.
      Runtime.exec runs an OS process, not a thread.
    ref: "concepts.md#what-are-virtual-threads"
  - id: virtual-threads-structured-concurrency-006
    difficulty: beginner
    tags: [pooling, executor]
    question: |
      Which executor is designed for the virtual-thread-per-task model in JDK 21?
    options:
      - "Executors.newSingleThreadExecutor()"
      - "Executors.newCachedThreadPool()"
      - "Executors.newVirtualThreadPerTaskExecutor()"
      - "Executors.newWorkStealingPool()"
    answer: 2
    explanation: |
      Executors.newVirtualThreadPerTaskExecutor() starts a new virtual thread for each submitted
      task. The others create pools of platform threads and are meant for reusing expensive threads,
      which is unnecessary (and an anti-pattern) with virtual threads.
    ref: "concepts.md#thread-pools-as-an-anti-pattern"
  - id: virtual-threads-structured-concurrency-007
    difficulty: beginner
    tags: [pinning, definition]
    question: |
      What does it mean for a virtual thread to be "pinned"?
    options:
      - "It has been permanently assigned a thread priority"
      - "It has been moved to old-generation heap by the GC"
      - "It is prevented from ever running"
      - "It cannot unmount from its carrier thread while blocked, holding the carrier out of circulation"
    answer: 3
    explanation: |
      Pinning means the virtual thread stays mounted on its carrier even while blocked, so that
      carrier cannot run other virtual threads. It is unrelated to priority, GC generations, or being
      permanently blocked from running.
    ref: "concepts.md#pinning-synchronized-and-native-calls"
  - id: virtual-threads-structured-concurrency-008
    difficulty: beginner
    tags: [scheduler, carrier]
    question: |
      By default, what schedules virtual threads onto carrier threads in JDK 21?
    options:
      - "The operating system kernel scheduler"
      - "A dedicated ForkJoinPool running in FIFO mode"
      - "A single-threaded event loop"
      - "The garbage collector threads"
    answer: 1
    explanation: |
      The default virtual-thread scheduler is a dedicated ForkJoinPool in FIFO mode, sized to the
      number of available processors by default. The OS kernel schedules the carrier (platform)
      threads, but the virtual threads themselves are scheduled by the JVM's ForkJoinPool.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"
  - id: virtual-threads-structured-concurrency-009
    difficulty: beginner
    tags: [cpu-bound, limits]
    question: |
      For which type of workload do virtual threads provide the LEAST benefit?
    options:
      - "Thousands of concurrent HTTP calls to downstream services"
      - "Handling many simultaneous database queries that block on I/O"
      - "A tight CPU-bound loop doing heavy numeric computation"
      - "Serving many slow clients over sockets"
    answer: 2
    explanation: |
      Virtual threads help I/O-bound, high-concurrency work by making blocking cheap. CPU-bound work
      never hits a blocking point to unmount, and true parallelism is still capped by the number of
      cores/carriers, so virtual threads add overhead without speeding it up.
    ref: "concepts.md#when-virtual-threads-do-not-help-cpu-bound-work"
  - id: virtual-threads-structured-concurrency-010
    difficulty: beginner
    tags: [daemon, properties]
    question: |
      Which statement about virtual threads is TRUE in JDK 21?
    options:
      - "Virtual threads are always daemon threads"
      - "Virtual threads keep the JVM alive after main() returns like non-daemon platform threads"
      - "You can promote a virtual thread to non-daemon with setDaemon(false)"
      - "Virtual threads have configurable priority that the scheduler honors"
    answer: 0
    explanation: |
      Virtual threads are always daemon threads; you cannot make them non-daemon, and calling
      setDaemon(false) throws. Their priority is fixed at NORM_PRIORITY and setting it has no effect.
      Because they are daemons, they do not keep the JVM alive on their own.
    ref: "concepts.md#virtual-threads-versus-platform-threads"
  - id: virtual-threads-structured-concurrency-011
    difficulty: beginner
    tags: [scoped-values, version]
    question: |
      What is the status of scoped values (ScopedValue) in JDK 21?
    options:
      - "Final and stable"
      - "Only in the incubator module and not usable"
      - "Deprecated for removal"
      - "A preview feature (JEP 446)"
    answer: 3
    explanation: |
      Scoped values are a preview feature in JDK 21 via JEP 446 (they were an incubator in JDK 20).
      They are not final in 21. They are usable with --enable-preview, not deprecated.
    ref: "concepts.md#scoped-values"
  - id: virtual-threads-structured-concurrency-012
    difficulty: beginner
    tags: [platform-thread, definition]
    question: |
      A platform thread in Java is best described as:
    options:
      - "A green thread scheduled entirely by the JVM with no OS involvement"
      - "A thin wrapper around a single operating-system kernel thread"
      - "A task queued in a ForkJoinPool"
      - "An immutable value bound to a scope"
    answer: 1
    explanation: |
      A platform thread is a thin wrapper over one OS kernel thread, which is why it is relatively
      expensive and limited in count. Virtual threads are the ones scheduled by the JVM. Neither is a
      queued task or a scoped value.
    ref: "concepts.md#virtual-threads-versus-platform-threads"
  - id: virtual-threads-structured-concurrency-013
    difficulty: intermediate
    tags: [pinning, synchronized, reentrantlock]
    question: |
      In JDK 21, which change most reliably prevents a virtual thread from pinning its carrier while
      it performs a blocking I/O call?
    options:
      - "Replace the synchronized block with a java.util.concurrent.locks.ReentrantLock"
      - "Wrap the blocking call in a synchronized block on a dedicated lock object"
      - "Mark the method volatile"
      - "Increase the virtual thread's priority to MAX_PRIORITY"
    answer: 0
    explanation: |
      In JDK 21, blocking inside a synchronized block pins the carrier. Replacing synchronized with
      ReentrantLock is the recommended fix because the virtual thread can unmount while holding/waiting
      on the lock. volatile applies to fields, not blocking; virtual-thread priority has no effect.
    ref: "concepts.md#pinning-synchronized-and-native-calls"
  - id: virtual-threads-structured-concurrency-014
    difficulty: intermediate
    tags: [pinning, causes]
    question: |
      Which TWO situations cause a virtual thread to pin its carrier in JDK 21?
    options:
      - "Using a ReentrantLock, and awaiting a CompletableFuture"
      - "Calling Thread.sleep, and reading from a BlockingQueue"
      - "Blocking while inside a synchronized block, and blocking inside a native method"
      - "Allocating a large array, and calling System.gc()"
    answer: 2
    explanation: |
      Pinning in JDK 21 occurs when a virtual thread blocks while holding a monitor (inside
      synchronized) or while there is a native frame on the stack (native/foreign call). Thread.sleep,
      BlockingQueue, ReentrantLock, and CompletableFuture awaits all unmount properly. Allocation and
      GC do not pin.
    ref: "concepts.md#pinning-synchronized-and-native-calls"
  - id: virtual-threads-structured-concurrency-015
    difficulty: intermediate
    tags: [pooling, semaphore, anti-pattern]
    question: |
      You must ensure no more than 20 concurrent calls hit a fragile downstream database, but still
      handle thousands of requests each on its own virtual thread. What is the recommended approach?
    options:
      - "Submit all tasks to a fixed platform thread pool of size 20"
      - "Pool 20 virtual threads and reuse them"
      - "Set jdk.virtualThreadScheduler.parallelism=20"
      - "Use newVirtualThreadPerTaskExecutor() and guard the DB call with a Semaphore(20)"
    answer: 3
    explanation: |
      Bound only the scarce resource: keep one virtual thread per task and gate the DB call with a
      Semaphore(20). Pooling virtual threads is an anti-pattern. A fixed platform pool of 20 caps ALL
      work, not just the DB. The scheduler parallelism property changes carrier count, not
      per-resource concurrency.
    ref: "concepts.md#thread-pools-as-an-anti-pattern"
  - id: virtual-threads-structured-concurrency-016
    difficulty: intermediate
    tags: [structured-concurrency, shutdown-policy]
    question: |
      In JDK 21's StructuredTaskScope, what does ShutdownOnFailure do?
    options:
      - "Waits for every subtask to finish regardless of failures, then reports all results"
      - "Cancels the remaining subtasks as soon as any one subtask fails"
      - "Cancels the remaining subtasks as soon as any one subtask succeeds"
      - "Restarts a failed subtask up to three times"
    answer: 1
    explanation: |
      ShutdownOnFailure is a fail-fast "invoke all" policy: the first subtask failure triggers
      cancellation of the rest, and throwIfFailed() propagates the error. Cancelling on first SUCCESS
      is ShutdownOnSuccess (a race/any-of). There is no built-in retry policy.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"
  - id: virtual-threads-structured-concurrency-017
    difficulty: intermediate
    tags: [structured-concurrency, shutdown-policy]
    question: |
      Which StructuredTaskScope policy is appropriate for "call three replicas and use whichever
      responds first, cancelling the others"?
    options:
      - "ShutdownOnSuccess"
      - "ShutdownOnFailure"
      - "A plain ExecutorService with invokeAll"
      - "newSingleThreadExecutor"
    answer: 0
    explanation: |
      ShutdownOnSuccess implements the race/any-of pattern: as soon as one subtask succeeds, the rest
      are cancelled and result() returns the first success. ShutdownOnFailure is the opposite
      (fail-fast on error). invokeAll and a single-thread executor do not give this cancellation
      semantics cleanly.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"
  - id: virtual-threads-structured-concurrency-018
    difficulty: intermediate
    tags: [scoped-values, threadlocal]
    question: |
      Why are scoped values preferred over ThreadLocal when working with millions of virtual threads?
    options:
      - "Scoped values are mutable and can be updated from anywhere for flexibility"
      - "ThreadLocal is not supported by virtual threads at all"
      - "Scoped values are immutable, bounded to a dynamic extent (auto-unbound), and cheap to share with child threads"
      - "Scoped values guarantee the value is stored off-heap"
    answer: 2
    explanation: |
      Scoped values are immutable and bound only for the duration of a run/call extent, so they cannot
      leak and are cheap to share with forked child threads. ThreadLocal IS supported by virtual
      threads but is mutable, leak-prone, and costly to copy at scale. Storage location is not the
      point.
    ref: "concepts.md#scoped-values"
  - id: virtual-threads-structured-concurrency-019
    difficulty: intermediate
    tags: [reactive, completablefuture, comparison]
    question: |
      Compared with reactive/CompletableFuture-style asynchronous code, what is the main advantage of
      virtual threads?
    options:
      - "They make individual requests complete faster"
      - "They remove the need to ever bound concurrency"
      - "They provide built-in backpressure automatically"
      - "They let you write simple blocking, imperative code with real stack traces while still scaling"
    answer: 3
    explanation: |
      Virtual threads let you keep straight-line, blocking, debuggable code (full stack traces,
      try/catch) yet scale like async. They do not make a single request faster, they do NOT provide
      automatic backpressure (you add a Semaphore), and you still sometimes need to bound concurrency.
    ref: "concepts.md#comparison-to-reactive-and-completablefuture"
  - id: virtual-threads-structured-concurrency-020
    difficulty: intermediate
    tags: [carrier, parallelism, tuning]
    question: |
      How many carrier threads does the default virtual-thread scheduler use, and how can it be
      changed?
    options:
      - "Exactly one; it cannot be changed"
      - "Equal to available processors by default; tunable via jdk.virtualThreadScheduler.parallelism"
      - "Equal to the number of virtual threads created"
      - "Fixed at 256 regardless of hardware"
    answer: 1
    explanation: |
      The default scheduler is a ForkJoinPool sized to Runtime.availableProcessors(), and you can tune
      it with the system property jdk.virtualThreadScheduler.parallelism. It is not one thread, not
      one-per-virtual-thread, and not a fixed 256.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"
  - id: virtual-threads-structured-concurrency-021
    difficulty: intermediate
    tags: [code-analysis, executor, try-with-resources]
    question: |
      What is the effect of the try-with-resources close on this executor?

      ```java
      try (var exec = Executors.newVirtualThreadPerTaskExecutor()) {
          exec.submit(() -> task1());
          exec.submit(() -> task2());
      }
      System.out.println("done");
      ```
    options:
      - "close() interrupts and discards both tasks immediately"
      - "The tasks run only after close() returns"
      - "close() blocks until both submitted tasks complete before 'done' prints"
      - "It throws because ExecutorService is not AutoCloseable"
    answer: 2
    explanation: |
      ExecutorService is AutoCloseable since JDK 19; close() performs an orderly shutdown that waits
      for all submitted tasks to finish. So "done" prints only after task1 and task2 complete. It does
      not discard tasks, and tasks run as soon as submitted, not after close.
    ref: "concepts.md#the-thread-per-request-model-without-the-cost"
  - id: virtual-threads-structured-concurrency-022
    difficulty: intermediate
    tags: [mount-unmount, blocking]
    question: |
      When a virtual thread calls a Loom-aware blocking operation (e.g. socket read) and the data is
      not yet available, what happens?
    options:
      - "The virtual thread unmounts; its stack is stored on the heap and the carrier runs other virtual threads"
      - "The carrier platform thread blocks in the OS until data arrives"
      - "The virtual thread spins in a busy-wait loop"
      - "The JVM creates a new OS thread for every blocked read"
    answer: 0
    explanation: |
      On a Loom-aware blocking point, the virtual thread unmounts: its continuation/stack is parked on
      the heap and the carrier is freed to run other virtual threads. It is remounted when the I/O is
      ready. The carrier does not block, there is no busy-wait, and no new OS thread is spun up per
      read.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"
  - id: virtual-threads-structured-concurrency-023
    difficulty: intermediate
    tags: [detection, pinning, tooling]
    question: |
      Which JVM flag helps you detect virtual threads that pin their carriers?
    options:
      - "-verbose:class"
      - "-XX:+PrintGCDetails"
      - "-Djdk.virtualThreadScheduler.parallelism=1"
      - "-Djdk.tracePinnedThreads=full"
    answer: 3
    explanation: |
      -Djdk.tracePinnedThreads=full (or =short) prints a stack trace when a virtual thread pins,
      helping you locate the offending synchronized/native section. PrintGCDetails is for GC,
      the parallelism property tunes carriers, and verbose:class traces class loading.
    ref: "concepts.md#pinning-synchronized-and-native-calls"
  - id: virtual-threads-structured-concurrency-024
    difficulty: intermediate
    tags: [stack, memory, comparison]
    question: |
      Why can a JVM run millions of virtual threads but only thousands of platform threads?
    options:
      - "Virtual threads share a single stack among all of them"
      - "Virtual thread stacks live on the heap and grow/shrink, avoiding the large fixed OS stack reservation of platform threads"
      - "Virtual threads do not have stacks at all"
      - "Platform threads are limited to 1024 by the JLS"
    answer: 1
    explanation: |
      Each platform thread reserves a large fixed stack (~1 MB) tied to an OS thread, capping the
      count. Virtual thread stacks are stored on the heap and resize as needed, so they start tiny and
      cost little. Virtual threads do have their own stacks; they are not shared, and there is no
      JLS-mandated 1024 limit.
    ref: "concepts.md#virtual-threads-versus-platform-threads"
  - id: virtual-threads-structured-concurrency-025
    difficulty: intermediate
    tags: [structured-concurrency, code-analysis]
    question: |
      Given this JDK 21 preview code, what does scope.throwIfFailed() do after join()?

      ```java
      try (var scope = new StructuredTaskScope.ShutdownOnFailure()) {
          var a = scope.fork(() -> fetchA());
          var b = scope.fork(() -> fetchB());
          scope.join();
          scope.throwIfFailed();
          return combine(a.get(), b.get());
      }
      ```
    options:
      - "If any subtask failed, it throws (wrapping the first exception); otherwise it returns normally"
      - "Silently ignores any subtask exception and returns null"
      - "It blocks forever until a subtask succeeds"
      - "It cancels the scope only if BOTH subtasks failed"
    answer: 0
    explanation: |
      With ShutdownOnFailure, join() waits for completion (or first failure triggering shutdown), and
      throwIfFailed() propagates the first subtask's exception if any failed; if none failed it returns
      normally so a.get()/b.get() are safe. It neither ignores errors nor requires both to fail.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"
  - id: virtual-threads-structured-concurrency-026
    difficulty: intermediate
    tags: [scoped-values, code-analysis]
    question: |
      In this JDK 21 preview snippet, what is true after the run() call returns?

      ```java
      static final ScopedValue<String> NAME = ScopedValue.newInstance();
      ScopedValue.where(NAME, "alice").run(() -> handle());
      // point X
      ```
    options:
      - "At point X, NAME.get() returns \"alice\""
      - "The binding \"alice\" persists for the lifetime of the thread"
      - "At point X, NAME.isBound() is false and NAME.get() throws"
      - "NAME can be reassigned with NAME.set(\"bob\") at point X"
    answer: 2
    explanation: |
      A scoped value is bound only for the dynamic extent of run()/call(). After run() returns, NAME
      is unbound, so isBound() is false and get() throws. The binding does not persist, and ScopedValue
      has no set() method (it is immutable).
    ref: "concepts.md#scoped-values"
  - id: virtual-threads-structured-concurrency-027
    difficulty: intermediate
    tags: [best-practice, anti-pattern]
    question: |
      Which practice is explicitly discouraged when using virtual threads?
    options:
      - "Creating one virtual thread per task"
      - "Using try-with-resources on a virtual-thread-per-task executor"
      - "Letting a virtual thread block on I/O"
      - "Pooling and reusing virtual threads via a bounded pool to amortize creation cost"
    answer: 3
    explanation: |
      Pooling virtual threads is an anti-pattern because they are cheap to create; pooling only made
      sense to amortize the cost of expensive platform threads. One-per-task, blocking on I/O, and
      closing the executor via try-with-resources are all correct/recommended.
    ref: "concepts.md#thread-pools-as-an-anti-pattern"
  - id: virtual-threads-structured-concurrency-028
    difficulty: intermediate
    tags: [littles-law, throughput]
    question: |
      A server capped its platform thread pool at 200 to avoid OS thread exhaustion, so only 200
      requests could be in flight even though each spent most of its time waiting on I/O. How do
      virtual threads improve throughput here?
    options:
      - "By making each request's I/O wait shorter"
      - "By allowing far more requests to be concurrently in flight, since blocked virtual threads cost heap not OS threads"
      - "By running the I/O on the GPU"
      - "By skipping the I/O entirely through caching"
    answer: 1
    explanation: |
      Throughput = concurrency / latency (Little's Law). The bottleneck was concurrency capped by
      thread count. Virtual threads make blocked tasks cheap, raising achievable concurrency
      dramatically without changing per-request I/O latency. They do not shorten I/O, use a GPU, or add
      caching.
    ref: "concepts.md#the-thread-per-request-model-without-the-cost"
  - id: virtual-threads-structured-concurrency-029
    difficulty: intermediate
    tags: [scheduler, fairness, preemption]
    question: |
      Which statement about the virtual-thread scheduler in JDK 21 is correct?
    options:
      - "Virtual threads yield cooperatively at blocking points; a CPU-bound loop with no blocking point will not voluntarily release its carrier"
      - "It time-slices virtual threads preemptively at arbitrary bytecode boundaries"
      - "It uses LIFO ordering to maximize cache locality"
      - "Each virtual thread gets a guaranteed fixed time quantum"
    answer: 0
    explanation: |
      The scheduler is cooperative: virtual threads unmount at Loom-aware blocking points, not via
      arbitrary preemption, so a pure CPU loop keeps its carrier. The default ForkJoinPool runs in FIFO
      mode, and there is no guaranteed fixed quantum per virtual thread.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"
  - id: virtual-threads-structured-concurrency-030
    difficulty: intermediate
    tags: [completablefuture, composition]
    question: |
      Which statement about CompletableFuture in the era of virtual threads is most accurate?
    options:
      - "CompletableFuture is removed in JDK 21"
      - "CompletableFuture cannot be used together with virtual threads"
      - "CompletableFuture is still useful for composition (thenCombine, allOf) and can run tasks on a virtual-thread executor"
      - "Virtual threads are just a renamed CompletableFuture"
    answer: 2
    explanation: |
      CompletableFuture is not removed and is not obsolete for composition operators; it can even use a
      virtual-thread executor for its async tasks. Virtual threads are a different mechanism (real
      threads), not a rename of CompletableFuture.
    ref: "concepts.md#comparison-to-reactive-and-completablefuture"
  - id: virtual-threads-structured-concurrency-031
    difficulty: intermediate
    tags: [version, history]
    question: |
      Which sequence correctly describes the virtual-threads preview-to-final path?
    options:
      - "Final in JDK 17, deprecated in 21"
      - "Preview only in JDK 21, final in JDK 22"
      - "Incubator in JDK 15, final in JDK 18"
      - "Preview in JDK 19 (JEP 425), second preview in JDK 20 (JEP 436), final in JDK 21 (JEP 444)"
    answer: 3
    explanation: |
      Virtual threads: first preview JDK 19 (JEP 425), second preview JDK 20 (JEP 436), finalized JDK
      21 (JEP 444). They were never in JDK 15/17/18 and were finalized in 21, not merely previewed
      there.
    ref: "concepts.md#what-are-virtual-threads"
  - id: virtual-threads-structured-concurrency-032
    difficulty: intermediate
    tags: [isvirtual, api]
    question: |
      How can code determine at runtime whether the current thread is virtual?
    options:
      - "Thread.currentThread().isDaemon() returning false"
      - "Thread.currentThread().isVirtual()"
      - "Checking that the thread name starts with 'ForkJoinPool'"
      - "Calling Thread.currentThread().getPriority() == 0"
    answer: 1
    explanation: |
      Thread.isVirtual() (JDK 21) returns true for virtual threads. isDaemon() is true for virtual
      threads but is not a reliable discriminator (platform threads can be daemon too). Name prefixes
      and priority checks are unreliable heuristics.
    ref: "concepts.md#what-are-virtual-threads"
  - id: virtual-threads-structured-concurrency-033
    difficulty: advanced
    tags: [pinning, deadlock, scenario]
    question: |
      A service under heavy load hangs. Threads dumps show many virtual threads blocked inside a
      synchronized method that performs a slow remote call, and only a few carrier threads exist. What
      is the most likely explanation?
    options:
      - "The GC is running a full collection"
      - "The heap is too small for the virtual thread stacks"
      - "Carriers are pinned by the synchronized blocking calls, exhausting the small carrier pool"
      - "Virtual threads have deadlocked on a ReentrantLock"
    answer: 2
    explanation: |
      Blocking inside synchronized pins the carrier in JDK 21. If many virtual threads pin while
      awaiting slow remote calls, the few carriers are all held, starving the scheduler and stalling
      throughput. The symptom points to pinning, not GC, heap sizing, or ReentrantLock (which would not
      pin).
    ref: "concepts.md#pinning-synchronized-and-native-calls"
  - id: virtual-threads-structured-concurrency-034
    difficulty: advanced
    tags: [internals, continuation]
    question: |
      Internally, a virtual thread is best understood as which combination?
    options:
      - "A continuation (capturable/resumable stack) plus a scheduler"
      - "An OS thread plus a mutex"
      - "A CompletableFuture plus a callback chain"
      - "A ThreadLocal map plus a priority queue"
    answer: 0
    explanation: |
      A virtual thread is implemented as a continuation (its stack can be captured on unmount and
      restored on mount, via internal jdk.internal.vm.Continuation) driven by a scheduler (the
      ForkJoinPool). It is not an OS thread, a CompletableFuture, or a ThreadLocal construct.
    ref: "concepts.md#what-are-virtual-threads"
  - id: virtual-threads-structured-concurrency-035
    difficulty: advanced
    tags: [pinning, compensation, scheduler]
    question: |
      What can the default scheduler do to mitigate short-lived pinning, and why is long pinning still
      dangerous?
    options:
      - "It migrates the pinned virtual thread to another carrier; long pinning is fine"
      - "It cancels the pinned virtual thread automatically after 1 second"
      - "It promotes the pinned thread's stack to old-gen; long pinning causes GC"
      - "It may temporarily add compensating carrier threads, but sustained pinning under load can still exhaust/expand carriers uncontrollably and collapse throughput"
    answer: 3
    explanation: |
      The ForkJoinPool can add compensating carrier threads to keep making progress when threads pin,
      so brief pinning is tolerable. But sustained pinning under high load defeats the model, may spawn
      excessive carriers, and can collapse throughput. It cannot migrate a pinned (mounted) thread, and
      it does not auto-cancel or GC-promote it.
    ref: "concepts.md#pinning-synchronized-and-native-calls"
  - id: virtual-threads-structured-concurrency-036
    difficulty: advanced
    tags: [threadlocal, scale, gotcha]
    question: |
      Why can heavy use of ThreadLocal be problematic specifically with millions of virtual threads?
    options:
      - "ThreadLocal is not supported by virtual threads and throws at get()"
      - "Each virtual thread may hold its own copy, so ThreadLocal state (and inheritable copies) multiplies memory across millions of threads"
      - "ThreadLocal forces all virtual threads onto a single carrier"
      - "ThreadLocal disables the ForkJoinPool scheduler"
    answer: 1
    explanation: |
      Virtual threads support ThreadLocal, but with millions of them each holding per-thread copies,
      memory can balloon, and inheritable thread-locals must be copied to children. That is why scoped
      values are recommended. ThreadLocal does not throw, does not pin to one carrier, and does not
      disable the scheduler.
    ref: "concepts.md#scoped-values"
  - id: virtual-threads-structured-concurrency-037
    difficulty: advanced
    tags: [code-analysis, cpu-bound, scenario]
    question: |
      This code submits 100,000 CPU-bound tasks to a virtual-thread executor on an 8-core machine.
      What is the most accurate expectation?

      ```java
      try (var exec = Executors.newVirtualThreadPerTaskExecutor()) {
          for (int i = 0; i < 100_000; i++)
              exec.submit(() -> heavyMathNoBlocking());
      }
      ```
    options:
      - "No better than ~8-way parallelism (bounded by cores), plus overhead from scheduling 100k threads"
      - "Roughly 100,000-way parallel speedup because each task has its own thread"
      - "A compile error because you cannot submit CPU-bound work to virtual threads"
      - "Each task runs on its own dedicated CPU core"
    answer: 0
    explanation: |
      CPU-bound tasks never unmount (no blocking point), so true parallelism is still capped by the
      ~8 carriers/cores. Creating 100k virtual threads adds scheduling and memory overhead without
      speedup. There is no compile error, and you cannot have more running cores than exist.
    ref: "concepts.md#when-virtual-threads-do-not-help-cpu-bound-work"
  - id: virtual-threads-structured-concurrency-038
    difficulty: advanced
    tags: [structured-concurrency, cancellation, propagation]
    question: |
      In structured concurrency (JDK 21 preview), what happens to still-running child subtasks if the
      enclosing StructuredTaskScope block exits (e.g. the scope is closed) before they finish?
    options:
      - "They continue running detached in the background"
      - "They are promoted to platform threads"
      - "They are cancelled/interrupted so no subtask outlives its scope"
      - "The JVM throws IllegalStateException and crashes"
    answer: 2
    explanation: |
      A core guarantee of structured concurrency is that subtasks do not outlive the scope: on scope
      exit, outstanding subtasks are cancelled/interrupted, preventing thread leaks. They are not
      detached, not promoted to platform threads, and this does not crash the JVM.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"
  - id: virtual-threads-structured-concurrency-039
    difficulty: advanced
    tags: [code-analysis, pinning, reentrantlock]
    question: |
      Two versions guard a slow blocking call. On JDK 21 under high concurrency, which behaves better
      and why?

      ```java
      // Version A
      synchronized (this) { slowRemoteCall(); }

      // Version B
      lock.lock(); try { slowRemoteCall(); } finally { lock.unlock(); }
      ```
    options:
      - "A, because synchronized is faster than ReentrantLock"
      - "A, because ReentrantLock is not reentrant"
      - "They are identical on JDK 21"
      - "B, because the virtual thread can unmount during slowRemoteCall so the carrier is freed; A pins the carrier"
    answer: 3
    explanation: |
      In JDK 21, Version A pins the carrier for the whole slowRemoteCall (blocking while holding a
      monitor). Version B with ReentrantLock lets the virtual thread unmount while blocked, freeing the
      carrier. They are not identical here, and ReentrantLock IS reentrant.
    ref: "concepts.md#pinning-synchronized-and-native-calls"
  - id: virtual-threads-structured-concurrency-040
    difficulty: advanced
    tags: [observability, debugging]
    question: |
      Why do virtual threads improve debuggability compared to reactive/callback pipelines?
    options:
      - "They automatically log every method call"
      - "Because each task runs as a real thread with an intact, meaningful stack trace and normal try/catch/step-through debugging"
      - "They disable the optimizing JIT so line numbers are exact"
      - "They serialize all execution to a single thread"
    answer: 1
    explanation: |
      Because a virtual thread executes straight-line blocking code as a real thread, its stack trace
      is complete and meaningful, and try/catch plus debuggers work as usual, unlike fragmented
      reactive stack traces. They do not auto-log, do not disable the JIT, and do not serialize
      execution.
    ref: "concepts.md#comparison-to-reactive-and-completablefuture"
  - id: virtual-threads-structured-concurrency-041
    difficulty: advanced
    tags: [scoped-values, inheritance, structured-concurrency]
    question: |
      How do scoped values interact with subtasks forked in a StructuredTaskScope?
    options:
      - "Bindings established in the parent's extent are visible (shared, not copied) to subtasks forked within that extent"
      - "Child subtasks cannot see any scoped value from the parent"
      - "Each subtask must call set() to receive the value"
      - "Scoped values are converted to ThreadLocal for the children"
    answer: 0
    explanation: |
      Scoped values are designed to flow cheaply into forked subtasks: bindings in the parent's dynamic
      extent are shared with children (no expensive per-thread copy). ScopedValue has no set(), children
      do not need to re-bind, and it is not converted to ThreadLocal.
    ref: "concepts.md#scoped-values"
  - id: virtual-threads-structured-concurrency-042
    difficulty: advanced
    tags: [code-analysis, output]
    question: |
      What does this print on JDK 21?

      ```java
      Thread t = Thread.ofVirtual().unstarted(() -> {});
      System.out.println(t.isVirtual() + " " + t.isDaemon());
      ```
    options:
      - "false true"
      - "true false"
      - "true true"
      - "It throws because an unstarted virtual thread has no properties"
    answer: 2
    explanation: |
      The thread is virtual (isVirtual() == true) and virtual threads are always daemon threads
      (isDaemon() == true), even before being started. So it prints "true true". These properties are
      queryable before start; nothing throws.
    ref: "concepts.md#virtual-threads-versus-platform-threads"
  - id: virtual-threads-structured-concurrency-043
    difficulty: advanced
    tags: [scenario, mixed-workload]
    question: |
      A request handler does: (1) three parallel downstream HTTP calls, then (2) a heavy CPU-bound
      aggregation over the results. What is the best design on JDK 21?
    options:
      - "Run everything, including the CPU aggregation, on thousands of virtual threads to maximize parallelism"
      - "Avoid virtual threads because the handler contains CPU work"
      - "Use only a fixed platform thread pool of size 3 for the whole handler"
      - "Use a virtual thread per request (and per HTTP call) for the I/O fan-out, but perform the CPU-bound aggregation on a sized pool matched to cores"
    answer: 3
    explanation: |
      Virtual threads shine for the I/O fan-out (many concurrent blocking HTTP calls). CPU-bound
      aggregation gains nothing from more virtual threads and should use a pool sized to cores. A fixed
      pool of 3 caps the I/O concurrency unnecessarily, and abandoning virtual threads entirely
      sacrifices the I/O scalability.
    ref: "concepts.md#when-virtual-threads-do-not-help-cpu-bound-work"
  - id: virtual-threads-structured-concurrency-044
    difficulty: advanced
    tags: [structured-concurrency, exception, code-analysis]
    question: |
      Using ShutdownOnFailure, fetchB() throws immediately while fetchA() is a long-running call. What
      is the expected behavior?

      ```java
      var a = scope.fork(() -> fetchA()); // slow
      var b = scope.fork(() -> fetchB()); // throws fast
      scope.join();
      scope.throwIfFailed();
      ```
    options:
      - "fetchA runs to completion; then throwIfFailed throws fetchB's exception"
      - "fetchB's failure triggers shutdown, cancelling fetchA; join() returns and throwIfFailed() rethrows fetchB's exception"
      - "join() blocks forever because fetchA never finishes"
      - "Both results are returned and the exception is swallowed"
    answer: 1
    explanation: |
      ShutdownOnFailure cancels remaining subtasks on the first failure, so fetchB's exception triggers
      cancellation of the slow fetchA. join() then returns promptly and throwIfFailed() rethrows the
      captured failure. It neither waits for fetchA to complete nor swallows the exception.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"
  - id: virtual-threads-structured-concurrency-045
    difficulty: advanced
    tags: [preview, compilation, version]
    question: |
      You wrote code using StructuredTaskScope and ScopedValue targeting JDK 21. What must you do to
      compile and run it?
    options:
      - "Nothing special; both are final APIs in JDK 21"
      - "Add an external Maven dependency for structured concurrency"
      - "Compile and run with --enable-preview (and target the JDK 21 release), since both are preview features in JDK 21"
      - "Enable an incubator module with --add-modules jdk.incubator.concurrent"
    answer: 2
    explanation: |
      In JDK 21 both StructuredTaskScope (JEP 453) and ScopedValue (JEP 446) are PREVIEW APIs, so you
      must use --enable-preview at compile and run time. They are not final, not external
      dependencies. The incubator module name applied to earlier JDKs (19/20), not the JDK 21 preview.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"
  - id: virtual-threads-structured-concurrency-046
    difficulty: advanced
    tags: [migration, blocking, connection-pool]
    question: |
      After switching a service to virtual threads, throughput did NOT improve and the app still stalls
      at ~50 concurrent requests. The DB access uses a JDBC connection pool of size 50 and synchronized
      internally. What is the most likely dominant limiter?
    options:
      - "The bounded connection pool (and possibly synchronized pinning) caps effective concurrency regardless of virtual threads"
      - "The number of carrier threads is too high"
      - "Virtual threads cannot perform JDBC calls"
      - "The heap is fragmented"
    answer: 0
    explanation: |
      Virtual threads remove the thread-count ceiling, but a bounded resource downstream (a 50-connection
      pool) still caps concurrency; synchronized internals could additionally pin carriers. Virtual
      threads can do JDBC. Carrier count and heap fragmentation are not the described bottleneck.
    ref: "concepts.md#thread-pools-as-an-anti-pattern"
  - id: virtual-threads-structured-concurrency-047
    difficulty: advanced
    tags: [scheduler, thread-dump, carrier]
    question: |
      In a thread dump of a JDK 21 app using virtual threads, what will you typically observe about
      carrier threads?
    options:
      - "One carrier per virtual thread, so millions of OS threads"
      - "Exactly two carriers regardless of core count"
      - "No platform threads at all"
      - "A small number of carrier platform threads (roughly the ForkJoinPool parallelism) onto which many virtual threads are multiplexed"
    answer: 3
    explanation: |
      Virtual threads are multiplexed onto a small pool of carriers (roughly availableProcessors by
      default), so you see few carrier platform threads and potentially many virtual threads. There is
      not one carrier per virtual thread, there are still platform threads, and the count is not fixed
      at two.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"
  - id: virtual-threads-structured-concurrency-048
    difficulty: advanced
    tags: [comparison, coloring, async]
    question: |
      "Function coloring" is a criticism of async/reactive APIs. How do virtual threads address it?
    options:
      - "They introduce a new 'async' keyword that colors functions explicitly"
      - "Because blocking is cheap, methods can just block and return values normally, so callers need not propagate an async return type up the call chain"
      - "They forbid returning CompletableFuture entirely"
      - "They automatically convert all synchronous methods to asynchronous ones"
    answer: 1
    explanation: |
      With async APIs, once a method returns a future/promise, callers must also become async
      (coloring). Virtual threads let methods block and return plain values, so there is no forced
      propagation of an async type. Java adds no async keyword, does not forbid CompletableFuture, and
      does not auto-convert methods.
    ref: "concepts.md#comparison-to-reactive-and-completablefuture"
  - id: virtual-threads-structured-concurrency-049
    difficulty: expert
    tags: [version, jep, future]
    question: |
      Regarding the pinning caused by synchronized: what is the correct version-precise statement?
    options:
      - "In JDK 21 synchronized around blocking pins; a later release (JEP 491, JDK 24) reworked monitors so most synchronized no longer pins"
      - "synchronized never pinned virtual threads in any JDK"
      - "Pinning from synchronized was fixed in JDK 21 itself"
      - "ReentrantLock pins but synchronized does not, in JDK 21"
    answer: 0
    explanation: |
      For a JDK 21 interview, synchronized blocking pins and ReentrantLock is the recommended fix.
      JEP 491 (JDK 24) later reworked object monitors so most synchronized blocking no longer pins. It
      was not fixed in 21, synchronized did pin, and ReentrantLock does not pin.
    ref: "concepts.md#pinning-synchronized-and-native-calls"
  - id: virtual-threads-structured-concurrency-050
    difficulty: expert
    tags: [jep, structured-concurrency, history]
    question: |
      Which JEP finalized virtual threads, and which JEP delivered structured concurrency as a preview
      in JDK 21?
    options:
      - "JEP 425 finalized virtual threads; JEP 428 previewed structured concurrency"
      - "JEP 436 finalized virtual threads; JEP 437 previewed structured concurrency"
      - "JEP 444 finalized virtual threads; JEP 453 previewed structured concurrency"
      - "JEP 446 finalized virtual threads; JEP 429 previewed structured concurrency"
    answer: 2
    explanation: |
      JEP 444 finalized virtual threads in JDK 21; JEP 453 delivered structured concurrency as a
      preview in JDK 21. JEP 425/436 were the virtual-thread previews (19/20); JEP 428/437 were
      structured-concurrency incubators (19/20); JEP 446/429 concern scoped values.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"
  - id: virtual-threads-structured-concurrency-051
    difficulty: expert
    tags: [code-analysis, pinning, subtle]
    question: |
      On JDK 21 with -Djdk.tracePinnedThreads=full, which snippet is most likely to log a pinning
      event?

      ```java
      // (A)
      lock.lock(); try { Thread.sleep(1000); } finally { lock.unlock(); }
      // (B)
      synchronized (mutex) { Thread.sleep(1000); }
      // (C)
      Thread.sleep(1000);
      ```
    options:
      - "(A)"
      - "None will ever pin"
      - "(C)"
      - "(B)"
    answer: 3
    explanation: |
      (B) blocks (Thread.sleep) while holding a monitor via synchronized, which pins the carrier in JDK
      21 and logs under tracePinnedThreads. (A) uses ReentrantLock and (C) is a bare sleep; both unmount
      normally without pinning.
    ref: "concepts.md#pinning-synchronized-and-native-calls"
  - id: virtual-threads-structured-concurrency-052
    difficulty: expert
    tags: [semantics, thread-identity, gotcha]
    question: |
      Which subtle behavior is CORRECT for virtual threads in JDK 21?
    options:
      - "Two different tasks submitted to newVirtualThreadPerTaskExecutor may run on the same Thread object because virtual threads are pooled"
      - "Each task gets a distinct virtual Thread object; virtual threads are not reused across tasks"
      - "Thread.currentThread() returns the carrier platform thread, not the virtual thread, inside a virtual thread"
      - "Setting a name on a virtual thread throws UnsupportedOperationException"
    answer: 1
    explanation: |
      newVirtualThreadPerTaskExecutor creates a fresh virtual thread per task; they are not pooled or
      reused. Inside a virtual thread, Thread.currentThread() returns the VIRTUAL thread, not the
      carrier. Naming virtual threads is supported. So the correct statement is that each task gets a
      distinct virtual thread.
    ref: "concepts.md#thread-pools-as-an-anti-pattern"
  - id: virtual-threads-structured-concurrency-053
    difficulty: expert
    tags: [scoped-values, rebinding, code-analysis]
    question: |
      Using scoped values (JDK 21 preview), how do you make a nested block "see" a different value for
      the same ScopedValue?

      ```java
      static final ScopedValue<Integer> LEVEL = ScopedValue.newInstance();
      ScopedValue.where(LEVEL, 1).run(() -> {
          // want LEVEL == 2 here temporarily
      });
      ```
    options:
      - "Nest another ScopedValue.where(LEVEL, 2).run(...) inside; the rebinding applies only to that inner extent, reverting afterward"
      - "Call LEVEL.set(2) inside the block"
      - "Reassign the static field LEVEL = 2"
      - "It is impossible; a ScopedValue can only ever be bound once per thread"
    answer: 0
    explanation: |
      Scoped values are immutable but support rebinding by nesting another where(...).run/call: the new
      value applies only within the inner dynamic extent and reverts on exit. There is no set() method,
      you cannot reassign the ScopedValue instance field to an Integer, and nesting/rebinding is
      explicitly allowed.
    ref: "concepts.md#scoped-values"
  - id: virtual-threads-structured-concurrency-054
    difficulty: expert
    tags: [scheduler, custom, expert]
    question: |
      Which statement about customizing where virtual threads run in JDK 21 is accurate?
    options:
      - "There is a stable, public factory method to supply an arbitrary custom Executor as the virtual-thread scheduler"
      - "Virtual threads always run on the common ForkJoinPool used by parallel streams"
      - "The default scheduler is a ForkJoinPool whose parallelism is configurable via a system property, but plugging in a fully custom scheduler is not a stable, supported public API in JDK 21"
      - "You configure the scheduler by subclassing Thread"
    answer: 2
    explanation: |
      In JDK 21 the default scheduler is a dedicated ForkJoinPool (not the common pool) tunable via
      jdk.virtualThreadScheduler.parallelism, but there is no stable public API to install an arbitrary
      custom scheduler. You do not configure it by subclassing Thread.
    ref: "concepts.md#carrier-threads-and-the-forkjoinpool-scheduler"
  - id: virtual-threads-structured-concurrency-055
    difficulty: expert
    tags: [code-analysis, output, structured-concurrency]
    question: |
      What is the outcome of this JDK 21 preview code if both fetches succeed quickly?

      ```java
      try (var scope = new StructuredTaskScope.ShutdownOnSuccess<String>()) {
          scope.fork(() -> "fast");
          scope.fork(() -> { Thread.sleep(5000); return "slow"; });
          scope.join();
          System.out.println(scope.result());
      }
      ```
    options:
      - "Prints \"slow\" after ~5 seconds"
      - "Throws because two subtasks cannot both be forked"
      - "Prints both \"fast\" and \"slow\""
      - "Prints \"fast\" quickly; the slow subtask is cancelled once the first success arrives"
    answer: 3
    explanation: |
      ShutdownOnSuccess returns the first successful result and cancels the rest. The "fast" task
      completes first, so result() returns "fast" quickly and the sleeping subtask is cancelled. It
      does not wait for the slow one, print both, or reject multiple forks.
    ref: "concepts.md#structured-concurrency-and-structuredtaskscope"
  - id: virtual-threads-structured-concurrency-056
    difficulty: expert
    tags: [memory, stack, internals]
    question: |
      What best explains how a virtual thread's stack is managed across unmount/remount cycles?
    options:
      - "The full OS thread stack is copied byte-for-byte to disk on unmount"
      - "The stack frames are stored on the Java heap as part of the continuation when unmounted, and restored onto a carrier when remounted"
      - "The stack is discarded on unmount and rebuilt from scratch on remount"
      - "The stack always stays in a fixed native memory region reserved per virtual thread"
    answer: 1
    explanation: |
      When a virtual thread unmounts, its stack (frames) is held on the Java heap as part of the
      continuation, then restored onto a carrier at remount. It is not written to disk, not discarded
      and rebuilt (that would lose state), and it is not a fixed per-thread native reservation (that is
      the platform-thread model).
    ref: "concepts.md#what-are-virtual-threads"
  - id: virtual-threads-structured-concurrency-057
    difficulty: expert
    tags: [trade-off, backpressure, reactive]
    question: |
      A team argues virtual threads make reactive frameworks entirely obsolete. What is the most
      defensible nuance?
    options:
      - "Correct: reactive frameworks provide nothing virtual threads cannot"
      - "Reactive is always faster, so virtual threads are pointless"
      - "Virtual threads simplify the common fan-out-and-join blocking pattern, but reactive still adds value for streaming and built-in backpressure, which virtual threads do not provide automatically"
      - "Virtual threads and reactive cannot coexist in one application"
    answer: 2
    explanation: |
      Virtual threads greatly simplify blocking fan-out/join and are often preferable there, but
      reactive streams still offer value for streaming pipelines and automatic backpressure, which
      virtual threads do not give you for free (you add Semaphores/queues). Neither claim of total
      superiority nor incompatibility holds.
    ref: "concepts.md#comparison-to-reactive-and-completablefuture"
  - id: virtual-threads-structured-concurrency-058
    difficulty: expert
    tags: [code-analysis, gotcha, thread-per-request]
    question: |
      A developer caches expensive per-request context in a ThreadLocal and reuses a small fixed
      virtual-thread pool they built manually. On JDK 21 this design is problematic mainly because:
    options:
      - "It reintroduces pooling/reuse of virtual threads (an anti-pattern) and risks stale ThreadLocal state bleeding across unrelated tasks sharing a reused thread"
      - "Virtual threads cannot use ThreadLocal, so it throws"
      - "ThreadLocal is faster than scoped values, so there is no downside"
      - "Fixed virtual-thread pools are the officially recommended design"
    answer: 0
    explanation: |
      Manually pooling/reusing virtual threads is an anti-pattern, and reusing a thread means a
      ThreadLocal set by one task can leak into the next task on that same reused thread. Virtual
      threads DO support ThreadLocal (no throw). Scoped values, bound per extent, avoid the leak; fixed
      virtual-thread pools are not recommended.
    ref: "concepts.md#thread-pools-as-an-anti-pattern"
