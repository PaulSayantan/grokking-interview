topic: Serialization and Deserialization
domain: java-jvm
topic_slug: serialization
version: 1
questions:
- id: serialization-001
  difficulty: beginner
  tags:
  - serializable
  - basics
  question: |
    What kind of interface is `java.io.Serializable`?
  options:
  - A marker interface with no methods, used to signal that a class may be serialized
  - A functional interface with a single abstract method `serialize()`
  - An abstract class that provides default read and write serialization logic
  - An annotation processed at compile time to auto-generate the object stream logic
  answer: 0
  explanation: |
    `Serializable` is a marker (tag) interface with no methods. Implementing it
    signals to the JVM that instances of the class may be serialized. The actual
    logic lives in `ObjectOutputStream`/`ObjectInputStream`. It is not functional
    (no SAM), not an abstract class, and not an annotation.
  ref: concepts.md#native-java-serialization-basics
- id: serialization-002
  difficulty: beginner
  tags:
  - api
  - streams
  question: |
    Which pair of classes and methods performs native Java serialization and
    deserialization of an object?
  options:
  - '`DataOutputStream.writeObject` and `DataInputStream.readObject` over a byte channel'
  - '`ObjectOutputStream.writeObject` and `ObjectInputStream.readObject`'
  - '`PrintWriter.print` and `BufferedReader.readLine` with reflection-based field mapping'
  - '`Serializer.encode` and `Deserializer.decode` from the `java.io.serial` package'
  answer: 1
  explanation: |
    Native Java serialization uses `ObjectOutputStream.writeObject(Object)` to
    write and `ObjectInputStream.readObject()` to read. `DataOutputStream`
    handles only primitives/strings, and the other options are not part of the
    standard serialization API.
  ref: concepts.md#native-java-serialization-basics
- id: serialization-003
  difficulty: beginner
  tags:
  - transient
  - static
  question: |
    Which fields are excluded from the default serialized form of an object?
  options:
  - Only `private` fields, since the stream cannot access encapsulated state
  - Only `final` fields, because their values are fixed at construction time
  - '`transient` and `static` fields'
  - Fields annotated with `@Override`, which the serializer treats as compiler metadata
  answer: 2
  explanation: |
    The default serialization mechanism skips `transient` fields (explicitly
    excluded) and `static` fields (they belong to the class, not the instance).
    Access modifiers like `private`/`final` do not affect whether a field is
    serialized.
  ref: concepts.md#native-java-serialization-basics
- id: serialization-004
  difficulty: beginner
  tags:
  - serialversionuid
  question: |
    What is the declared type of a `serialVersionUID` field?
  options:
  - '`private static final int`'
  - '`public String`'
  - '`protected transient long`'
  - '`private static final long`'
  answer: 3
  explanation: |
    The recommended declaration is `private static final long serialVersionUID`.
    It must be a `long`; an `int` would not be recognized as the version UID by
    the serialization machinery.
  ref: concepts.md#serialversionuid-and-class-versioning
- id: serialization-005
  difficulty: beginner
  tags:
  - transient
  - use-cases
  question: |
    Which is a good use of the `transient` keyword?
  options:
  - Marking a password field so it is not written to the serialized stream
  - Making a field visible across threads by forcing a main-memory flush on write
  - Preventing a field's referenced object from being reclaimed by the garbage collector
  - Forcing a field to be serialized even when it is declared `static` on the class
  answer: 0
  explanation: |
    `transient` excludes a field from the default serialized form, which is ideal
    for sensitive data (passwords, keys) or derived/cached values. It has nothing
    to do with thread visibility (that is `volatile`) or garbage collection.
  ref: concepts.md#transient-and-custom-writeobject-and-readobject
- id: serialization-006
  difficulty: beginner
  tags:
  - json
  - jackson
  question: |
    Which Jackson class is the primary entry point for serializing a Java object
    to a JSON string and back?
  options:
  - '`JsonParser`'
  - '`ObjectMapper`'
  - '`JsonNode`'
  - '`Serializable`'
  answer: 1
  explanation: |
    `ObjectMapper` is Jackson's central class; `writeValueAsString(obj)`
    serializes and `readValue(json, Type.class)` deserializes. `JsonParser` and
    `JsonNode` are lower-level/tree constructs, and `Serializable` is unrelated
    to Jackson.
  ref: concepts.md#json-serialization-with-jackson
- id: serialization-007
  difficulty: beginner
  tags:
  - records
  - versions
  question: |
    In which JDK release did records become a final (standard, non-preview)
    feature that can implement `Serializable`?
  options:
  - JDK 14
  - JDK 15
  - JDK 16
  - JDK 17
  answer: 2
  explanation: |
    Records were previewed in JDK 14 (JEP 359) and JDK 15 (JEP 384), then
    finalized in JDK 16 (JEP 395). Records may implement `Serializable`, with
    reconstruction going through the canonical constructor.
  ref: concepts.md#records-and-serialization
- id: serialization-008
  difficulty: beginner
  tags:
  - protobuf
  - alternatives
  question: |
    What file defines the data structures used by Protocol Buffers?
  options:
  - A `.json` schema embedded in the head of every serialized payload
  - A `.class` file generated by javac and shipped alongside the binary
  - A `serialVersionUID` constant declared on each generated message type
  - A `.proto` schema file compiled to language-specific classes
  answer: 3
  explanation: |
    Protobuf messages are defined in a `.proto` schema file, which the protobuf
    compiler turns into typed classes for many languages. The wire format is
    compact binary keyed by field numbers.
  ref: concepts.md#alternatives-such-as-protobuf-and-avro
- id: serialization-009
  difficulty: beginner
  tags:
  - externalizable
  question: |
    Which two methods must a class implement when it uses `Externalizable`?
  options:
  - '`writeExternal` and `readExternal`'
  - '`writeObject` and `readObject`'
  - '`serialize` and `deserialize`'
  - '`marshal` and `unmarshal`'
  answer: 0
  explanation: |
    `Externalizable` declares `writeExternal(ObjectOutput)` and
    `readExternal(ObjectInput)`, giving the class full manual control of the wire
    format. `writeObject`/`readObject` are the private hooks used with
    `Serializable`, not `Externalizable`.
  ref: concepts.md#externalizable
- id: serialization-010
  difficulty: beginner
  tags:
  - security
  - discouraged
  question: |
    What is the single most important security rule about native Java
    deserialization?
  options:
  - Always compress the stream before writing it
  - Never deserialize data from an untrusted source
  - Always declare `serialVersionUID` as 0
  - Only serialize objects smaller than 1 KB
  answer: 1
  explanation: |
    Deserializing untrusted bytes can trigger gadget-chain attacks leading to
    remote code execution (CWE-502). The core rule is to never deserialize data
    from an untrusted source with native Java serialization. Compression and size
    limits do not address the vulnerability.
  ref: concepts.md#why-native-serialization-is-discouraged
- id: serialization-011
  difficulty: intermediate
  tags:
  - constructor
  - deserialization
  question: |
    During deserialization of a class that implements `Serializable` (and whose
    superclass is also `Serializable`), what happens regarding constructors?
  options:
  - The no-arg constructor of the class runs, then fields are set
  - Every constructor in the class hierarchy runs top to bottom
  - No constructor of the serializable class runs; the object is allocated and fields are restored directly
  - The constructor with the most parameters is chosen and invoked
  answer: 2
  explanation: |
    For a `Serializable` class, no constructor of that class (or its serializable
    superclasses) is invoked; the JVM allocates the instance and restores fields
    directly from the stream. Only the constructor of the first non-serializable
    superclass runs. This constructor bypass is why invariants can be violated.
  ref: concepts.md#native-java-serialization-basics
- id: serialization-012
  difficulty: intermediate
  tags:
  - serialversionuid
  - mismatch
  question: |
    A class was serialized with `serialVersionUID = 1L`. Later the field is
    changed to `2L` and the same bytes are read back. What happens?
  options:
  - The object deserializes successfully; the UID is only advisory
  - A `NotSerializableException` is thrown because the stored UID is now stale
  - The stream is silently truncated and every field falls back to null or zero
  - An `InvalidClassException` is thrown due to the UID mismatch
  answer: 3
  explanation: |
    The UID in the stream (1L) is compared to the loaded class's UID (2L). A
    mismatch throws `InvalidClassException`. `NotSerializableException` is thrown
    at write time for non-serializable classes, not on UID mismatch.
  ref: concepts.md#serialversionuid-and-class-versioning
- id: serialization-013
  difficulty: intermediate
  tags:
  - serialversionuid
  - implicit
  question: |
    What is the risk of NOT declaring `serialVersionUID` explicitly?
  options:
  - The compiler generates one implicitly, and it can change with unrelated code edits, breaking deserialization
    of old data
  - The class cannot be serialized at all until a UID is added by hand
  - All non-static fields are silently promoted to transient and dropped from the stream
  - Serialization becomes roughly twice as slow because the UID is recomputed on every write
  answer: 0
  explanation: |
    Without an explicit UID, the runtime computes one from the class's structure
    (fields, methods, modifiers, interfaces). Seemingly harmless changes (adding
    a method, recompiling) can alter the computed value, causing
    `InvalidClassException` when reading previously written bytes. Declaring it
    explicitly locks the version.
  ref: concepts.md#serialversionuid-and-class-versioning
- id: serialization-014
  difficulty: intermediate
  tags:
  - writeobject
  - readobject
  question: |
    Inside a custom `readObject(ObjectInputStream in)` method, which call restores
    the default (non-transient) fields from the stream?
  options:
  - '`in.readObject()` to pull the current instance back off the stream'
  - '`in.defaultReadObject()`'
  - '`in.reset()` to rewind the stream and replay the default field block'
  - '`in.readFields().restore()` to copy the persisted field set into `this`'
  answer: 1
  explanation: |
    `in.defaultReadObject()` reads the non-transient, non-static fields written by
    `defaultWriteObject()`. You typically call it first, then read any custom
    extra data and re-establish invariants. `readObject()` reads a whole separate
    object, not the current instance's default fields.
  ref: concepts.md#transient-and-custom-writeobject-and-readobject
- id: serialization-015
  difficulty: intermediate
  tags:
  - readresolve
  - singleton
  question: |
    Why do singletons and enums that are serializable typically implement
    `readResolve()`?
  options:
  - To speed up deserialization by caching the reconstructed object graph
  - To compress the serialized form down to a single shared byte handle
  - To replace the freshly deserialized instance with the canonical singleton, preventing creation of
    a second instance
  - To make the class thread-safe by synchronizing the deserialization callback
  answer: 2
  explanation: |
    Deserialization creates a brand-new object, which would break a singleton's
    single-instance invariant. `readResolve()` returns the canonical instance to
    replace the newly created one. (Enums are handled specially by the JVM and are
    inherently safe, but the underlying principle is the same.)
  ref: concepts.md#transient-and-custom-writeobject-and-readobject
- id: serialization-016
  difficulty: intermediate
  tags:
  - externalizable
  - constructor
  question: |
    What does `Externalizable` require that plain `Serializable` does not?
  options:
  - A declared `serialVersionUID` on both the class and its superclass
  - All instance fields to be marked transient so the stream stays empty
  - Implementation of `Cloneable` to support the manual object reconstruction
  - A public no-argument constructor that is invoked during deserialization
  answer: 3
  explanation: |
    An `Externalizable` object is reconstructed by calling its public no-arg
    constructor and then `readExternal` to populate state. If that public no-arg
    constructor is missing, deserialization fails with `InvalidClassException`.
    Plain `Serializable` does not call any constructor of the serializable class.
  ref: concepts.md#externalizable
- id: serialization-017
  difficulty: intermediate
  tags:
  - jackson
  - constructor
  question: |
    To deserialize JSON into a plain Java class with Jackson using default
    settings, what does Jackson typically require?
  options:
  - A no-arg constructor plus setters, or a constructor annotated with `@JsonCreator`/`@JsonProperty`
  - The class must implement `java.io.Serializable` so Jackson can reuse the object stream hooks
  - A declared `serialVersionUID` that Jackson matches against the incoming JSON payload
  - The class must be a record only, since Jackson binds JSON through canonical constructors alone
  answer: 0
  explanation: |
    Jackson binds via a no-arg constructor and setters/fields by default, or a
    constructor annotated for property binding. It does not need `Serializable`
    or `serialVersionUID` at all. Records work too (2.12+), but they are not the
    only option.
  ref: concepts.md#json-serialization-with-jackson
- id: serialization-018
  difficulty: intermediate
  tags:
  - jackson
  - unknown-properties
  question: |
    By default, what does Jackson's `ObjectMapper` do when the JSON contains a
    property that does not exist on the target class?
  options:
  - Silently ignores it and binds only the recognized properties
  - Throws an `UnrecognizedPropertyException` (FAIL_ON_UNKNOWN_PROPERTIES is enabled)
  - Adds it as a dynamic field on an internal map attached to the object
  - Logs a warning through SLF4J and continues binding the rest of the payload
  answer: 1
  explanation: |
    `FAIL_ON_UNKNOWN_PROPERTIES` is enabled by default, so unknown JSON fields
    cause an exception. Teams often disable it (or use `@JsonIgnoreProperties`)
    for forward compatibility when producers add new fields.
  ref: concepts.md#json-serialization-with-jackson
- id: serialization-019
  difficulty: intermediate
  tags:
  - records
  - canonical-constructor
  question: |
    When a serializable record is deserialized, how is its state reconstructed?
  options:
  - Fields are set directly via reflection, bypassing the constructor
  - A no-arg constructor is called, then generated setter methods run
  - The component values are passed to the record's canonical constructor
  - The `readObject` hook must be implemented to set fields
  answer: 2
  explanation: |
    Record deserialization invokes the canonical constructor with the component
    values from the stream. This means compact-constructor validation runs, so a
    record cannot be deserialized into an invalid state. This is a key safety
    advantage over classic serialization, which bypasses constructors.
  ref: concepts.md#records-and-serialization
- id: serialization-020
  difficulty: intermediate
  tags:
  - protobuf
  - versioning
  question: |
    In Protocol Buffers, how do you evolve a message so old and new code remain
    compatible?
  options:
  - Rename fields freely, since the field names are what identify each field on the wire
  - Reorder the fields so their positions match the new class layout exactly
  - Change an existing field's type freely as long as its declared name stays the same
  - Add new fields with new, never-reused field numbers; never change or reuse existing numbers
  answer: 3
  explanation: |
    Protobuf identifies fields by their numeric tag, not their name. Adding new
    fields with fresh numbers keeps forward/backward compatibility; reusing or
    changing an existing number corrupts compatibility. Names and order are not
    significant on the wire.
  ref: concepts.md#alternatives-such-as-protobuf-and-avro
- id: serialization-021
  difficulty: intermediate
  tags:
  - discouraged
  - api-surface
  question: |
    Why does making a class `Serializable` increase its long-term maintenance
    burden?
  options:
  - Its serialized form (including private field names/types) becomes part of the class's public API,
    constraining future refactoring
  - It forces the class to be declared `final`, since the JVM cannot serialize subclasses of a serializable type
  - It disables garbage collection for instances, because the serialization runtime pins every serializable object in memory
  - It requires an active network connection at runtime, because the serialization machinery streams objects through a socket layer
  answer: 0
  explanation: |
    Once objects are serialized and stored/sent, the byte format (derived from
    private fields) becomes an implicit public contract. Renaming or retyping
    fields can break deserialization of existing data, so refactoring freedom is
    lost. This brittleness is a major reason serialization is discouraged.
  ref: concepts.md#why-native-serialization-is-discouraged
- id: serialization-022
  difficulty: intermediate
  tags:
  - notserializableexception
  - code-analysis
  question: |
    ```java
    class Engine {}                       // NOT Serializable
    class Car implements Serializable {
        Engine engine = new Engine();
    }
    new ObjectOutputStream(out).writeObject(new Car());
    ```
    What happens when `writeObject` runs?
  options:
  - Compiles and runs fine because the `engine` field is automatically skipped
  - Throws `NotSerializableException` at runtime because `Engine` is not serializable
  - Fails to compile because the compiler rejects the unserializable `Engine` field
  - Serializes the `engine` reference as null automatically, dropping the field
  answer: 1
  explanation: |
    Serialization is transitive: every non-transient reachable field must be
    serializable. `Engine` is not, so `writeObject` throws
    `NotSerializableException` at runtime. It is not a compile-time error because
    the marker interface is checked dynamically. Marking `engine` `transient`
    would avoid the exception.
  ref: concepts.md#native-java-serialization-basics
- id: serialization-023
  difficulty: intermediate
  tags:
  - transient
  - code-analysis
  question: |
    ```java
    class Box implements Serializable {
        transient int cached = 42;
        int value = 7;
    }
    // serialize a Box, then deserialize into b
    ```
    After deserialization (with the default mechanism, no custom readObject),
    what are `b.cached` and `b.value`?
  options:
  - cached = 42, value = 7
  - cached = 0, value = 0
  - cached = 0, value = 7
  - cached = 42, value = 0
  answer: 2
  explanation: |
    `value` (non-transient) is restored to 7. `cached` is `transient`, so it is
    not written and is not re-initialized by the default mechanism; it comes back
    as the default `int` value 0 (field initializers do not run during
    deserialization). Only a custom `readObject` could restore it.
  ref: concepts.md#transient-and-custom-writeobject-and-readobject
- id: serialization-024
  difficulty: intermediate
  tags:
  - jackson
  - java-time
  question: |
    Serializing a `java.time.LocalDateTime` with a bare `new ObjectMapper()`
    (no extra modules) often fails or produces odd output. What is the fix?
  options:
  - Mark the field transient so Jackson computes the timestamp lazily on access
  - Implement Serializable on the DTO so Jackson can reuse the JVM's date handling
  - Set serialVersionUID on the DTO so Jackson pins a stable temporal format
  - Register the JavaTimeModule (jackson-datatype-jsr310)
  answer: 3
  explanation: |
    Jackson needs the `jackson-datatype-jsr310` module
    (`mapper.registerModule(new JavaTimeModule())`) to properly handle
    `java.time` types; otherwise it may fail or serialize them as verbose
    field-by-field objects. `Serializable`/`serialVersionUID` are irrelevant to
    Jackson.
  ref: concepts.md#json-serialization-with-jackson
- id: serialization-025
  difficulty: intermediate
  tags:
  - comparison
  - alternatives
  question: |
    Which statement best contrasts JSON (Jackson) with native Java serialization?
  options:
  - JSON is human-readable and cross-language and does not execute arbitrary code on read, unlike native
    serialization
  - JSON is a Java-only text format while native serialization is the cross-language binary standard
  - Native serialization is both faster and safer than JSON binding in essentially every case
  - Both JSON binding and native serialization require the target class to implement Serializable
  answer: 0
  explanation: |
    JSON is text-based, human-readable, cross-language, and binds to a fixed
    target class without executing arbitrary code. Native serialization is
    Java-only, opaque, and can execute gadget code on read. JSON does not require
    `Serializable`.
  ref: concepts.md#json-serialization-with-jackson
- id: serialization-026
  difficulty: intermediate
  tags:
  - versioning
  - compatible-change
  question: |
    You keep the same `serialVersionUID` and simply ADD a new field to a
    serializable class. You then read bytes written by the OLD version. What
    happens to the new field?
  options:
  - Deserialization throws InvalidClassException because the field count no longer matches the stream
  - Deserialization succeeds and the new field gets its default value
  - The old bytes are rejected as corrupt since they lack the added field's data block
  - The new field is filled with an arbitrary value read from the leftover trailing stream bytes
  answer: 1
  explanation: |
    Adding a field is a compatible change. Old streams lack data for the new
    field, so it takes the default value (0/false/null). Keeping the UID stable
    lets old and new coexist. Removing a field is likewise compatible (extra data
    is ignored).
  ref: concepts.md#serialversionuid-and-class-versioning
- id: serialization-027
  difficulty: advanced
  tags:
  - superclass
  - deserialization
  question: |
    A `Serializable` class `B` extends a NON-serializable class `A`. What must be
    true of `A` for `B` to deserialize successfully?
  options:
  - '`A` must also implement Serializable so its inherited fields are restored from the stream'
  - '`A` must declare a serialVersionUID so the runtime can version-match the inherited portion'
  - '`A` must have an accessible no-arg constructor, which is invoked during deserialization of B'
  - '`A` must be declared final so no non-serializable state can be inherited by B'
  answer: 2
  explanation: |
    Fields inherited from a non-serializable superclass are not restored from the
    stream; instead that superclass's no-arg constructor runs to initialize them.
    If `A` lacks an accessible no-arg constructor, deserialization throws
    `InvalidClassException`.
  ref: concepts.md#native-java-serialization-basics
- id: serialization-028
  difficulty: advanced
  tags:
  - security
  - gadget-chains
  question: |
    In a Java deserialization RCE attack, what is a "gadget chain"?
  options:
  - A sequence of oversized network packets crafted to overload and crash the server socket
  - A chain of deliberate serialVersionUID mismatches that force repeated class reloading
  - A set of transient fields used to smuggle hidden data past the serialization filter
  - A crafted object graph of existing classpath classes whose readObject/other callbacks chain together
    to execute attacker-chosen code
  answer: 3
  explanation: |
    A gadget chain is a carefully constructed graph of objects from classes
    already on the classpath (e.g., Apache Commons Collections) whose
    deserialization callbacks invoke each other to ultimately execute arbitrary
    code. The vulnerability is that `readObject` can trigger such behavior on
    untrusted input.
  ref: concepts.md#why-native-serialization-is-discouraged
- id: serialization-029
  difficulty: advanced
  tags:
  - security
  - jep-290
  question: |
    Which JDK 9 feature lets you allow-list acceptable classes and cap graph
    depth/array size during deserialization to mitigate attacks?
  options:
  - '`ObjectInputFilter` (JEP 290)'
  - '`SecurityManager.checkRead`'
  - '`sun.misc.Unsafe`'
  - '`ClassLoader.defineClass`'
  answer: 0
  explanation: |
    JEP 290 (JDK 9) introduced `ObjectInputFilter`, allowing filters that
    allow-list/deny classes and limit stream depth, references, and array sizes.
    JEP 415 (JDK 17) added context-specific filter factories. These reduce risk
    but do not fully eliminate it.
  ref: concepts.md#why-native-serialization-is-discouraged
- id: serialization-030
  difficulty: advanced
  tags:
  - writereplace
  - readresolve
  question: |
    What is the difference between `writeReplace()` and `readResolve()`?
  options:
  - They are synonyms for the same hook, so implementing either one alone is sufficient
  - '`writeReplace` runs during serialization to substitute the object to be written; `readResolve` runs
    after deserialization to substitute the reconstructed object'
  - '`writeReplace` gzip-compresses the object stream while `readResolve` inflates it back on read'
  - '`writeReplace` validates field invariants while `readResolve` assigns the class serialVersionUID'
  answer: 1
  explanation: |
    `writeReplace()` is invoked before writing and returns the object that should
    actually be serialized (e.g., a proxy). `readResolve()` is invoked after
    reading and returns the object that should replace the freshly deserialized
    instance (e.g., a canonical singleton or the real object from a proxy).
  ref: concepts.md#transient-and-custom-writeobject-and-readobject
- id: serialization-031
  difficulty: advanced
  tags:
  - serialization-proxy
  - pattern
  question: |
    What key guarantee does the serialization proxy pattern (Effective Java Item
    90) provide that default serialization does not?
  options:
  - Guaranteed smaller serialized output in all cases, because the proxy strips redundant field metadata
  - Cross-language interoperability, letting non-JVM readers decode the proxy's neutral wire format
  - The real object is reconstructed through its normal constructor/API, so invariants are enforced and
    attackers cannot fabricate an invalid instance
  - Automatic compression of the object stream, since the proxy encodes state in a packed binary layout
  answer: 2
  explanation: |
    The proxy holds logical state and its `readResolve()` builds the real object
    via its public constructor/factory, so all validation runs and `final` fields
    work. Default serialization bypasses constructors, allowing bogus/hostile
    object graphs. Records provide the same guarantee automatically.
  ref: concepts.md#serialization-proxy-pattern
- id: serialization-032
  difficulty: advanced
  tags:
  - records
  - hooks
  question: |
    For a serializable record, which is TRUE about custom `readObject`/`writeObject`
    hooks controlling field state?
  options:
  - They fully override how record components are read and written, replacing the canonical constructor path
  - They are mandatory for records and must be declared before a record can implement Serializable
  - They cause a compile error on records, since the compiler forbids these hooks on record types
  - They are effectively ignored for setting component state, because a record must be reconstructed through
    its canonical constructor
  answer: 3
  explanation: |
    Record serialization is component-based and always flows through the
    canonical constructor, so the classic `readObject`/`writeObject`/
    `readObjectNoData` mechanisms cannot be used to customize how component state
    is restored. This is deliberate: it preserves record invariants and safety.
  ref: concepts.md#records-and-serialization
- id: serialization-033
  difficulty: advanced
  tags:
  - jackson
  - security
  - default-typing
  question: |
    Why is Jackson's "default typing" (`enableDefaultTyping`) dangerous with
    untrusted input?
  options:
  - It embeds Java class names in the JSON and can instantiate arbitrary/gadget classes on deserialization,
    enabling attacks
  - It roughly doubles the payload size by writing each value twice for type verification on read
  - It disables all Jackson annotations, so `@JsonIgnore` and `@JsonProperty` are silently ignored
  - It forces every field to be treated as transient, dropping them from the serialized JSON output
  answer: 0
  explanation: |
    Default typing writes concrete Java type names into the JSON so polymorphic
    types round-trip. With untrusted input, an attacker can name gadget classes,
    reintroducing a deserialization-RCE risk similar to native serialization. Use
    a validating `PolymorphicTypeValidator` or avoid default typing. Plain binding
    to a fixed class is safe.
  ref: concepts.md#json-serialization-with-jackson
- id: serialization-034
  difficulty: advanced
  tags:
  - code-analysis
  - singleton
  question: |
    ```java
    enum Config { INSTANCE; }
    // serialize Config.INSTANCE, then deserialize into c
    boolean same = (c == Config.INSTANCE);
    ```
    What is `same`, and why?
  options:
  - false, because deserialization always allocates a brand-new object distinct from the constant
  - true, because the JVM handles enum serialization specially and preserves the single instance
  - It throws NotSerializableException because enum types are not serializable by default
  - It depends on the declared serialVersionUID of the enum, which decides instance identity
  answer: 1
  explanation: |
    Enums are serialized by name and the JVM guarantees the deserialized value is
    the existing constant, so `c == Config.INSTANCE` is `true`. This is exactly
    why enums are the preferred serialization-safe singleton (Effective Java Item
    3): no custom `readResolve` is even needed.
  ref: concepts.md#transient-and-custom-writeobject-and-readobject
- id: serialization-035
  difficulty: advanced
  tags:
  - externalizable
  - performance
  question: |
    Which is a genuine advantage AND a genuine risk of `Externalizable` over
    `Serializable`?
  options:
  - 'Advantage: automatic field handling; Risk: cannot use transient'
  - 'Advantage: cross-language support; Risk: slower'
  - 'Advantage: full control over the compact wire format (can be faster/smaller); Risk: you must hand-manage
    field order and versioning, and a public no-arg constructor is mandatory'
  - 'Advantage: no serialVersionUID needed; Risk: cannot be subclassed'
  answer: 2
  explanation: |
    `Externalizable` lets you hand-write `writeExternal`/`readExternal` for a
    compact, potentially faster format, but you own all field ordering and
    versioning by hand and must provide a public no-arg constructor (invoked on
    read). Mistakes in field order silently corrupt data.
  ref: concepts.md#externalizable
- id: serialization-036
  difficulty: advanced
  tags:
  - versioning
  - incompatible-change
  question: |
    Which of the following is an INCOMPATIBLE change under the Java Object
    Serialization Specification (would break deserialization even with the same
    serialVersionUID)?
  options:
  - Adding a new instance field to the class
  - Removing a method from the class definition
  - Changing an existing field's access modifier from private to public
  - Changing the declared type of an existing field (e.g., int to long)
  answer: 3
  explanation: |
    Changing a field's declared type is incompatible because the stream data no
    longer matches. Adding fields, removing methods, and changing access
    modifiers are compatible changes. Also incompatible: changing non-static to
    static or non-transient to transient (treated like deletion).
  ref: concepts.md#serialversionuid-and-class-versioning
- id: serialization-037
  difficulty: advanced
  tags:
  - object-graph
  - references
  question: |
    You write the SAME object twice to one `ObjectOutputStream`, then read two
    references back from the corresponding `ObjectInputStream`. What is true?
  options:
  - The two read references point to the same object, because the stream uses a handle/back-reference
    table to preserve identity within a stream
  - The two read references point to two distinct, independently reconstructed objects,
    because the stream writes a fresh full copy on every writeObject call
  - The second write throws a DuplicateObjectException, because ObjectOutputStream refuses
    to serialize an instance it has already written once
  - Only the first write succeeds; the second is silently ignored because the handle table
    treats the repeated instance as a no-op
  answer: 0
  explanation: |
    Within a single stream, `ObjectOutputStream` tracks written objects with a
    handle table and writes a back-reference the second time, so both reads return
    the same reconstructed instance, preserving shared identity and enabling
    cyclic graphs. Note: calling `reset()` clears this table.
  ref: concepts.md#native-java-serialization-basics
- id: serialization-038
  difficulty: advanced
  tags:
  - jackson
  - immutable
  - jsoncreator
  question: |
    To deserialize JSON into an immutable class that has only `final` fields and a
    single all-args constructor (no setters), what do you use with Jackson?
  options:
  - Nothing works; Jackson cannot bind immutable classes at all and requires mutable
    fields with public setters for every property it deserializes
  - Annotate the constructor with `@JsonCreator` and its parameters with `@JsonProperty` (or use records
    / the parameter-names module)
  - Add `implements Serializable` so Jackson can fall back to the JVM object-stream hooks
    to populate the final fields reflectively
  - Mark all fields transient so Jackson injects the constructor arguments after allocation
  answer: 1
  explanation: |
    Jackson binds immutable types via a `@JsonCreator`-annotated constructor with
    `@JsonProperty` on each parameter (or the parameter-names module, or records
    which Jackson 2.12+ supports natively). Setters are not required. `Serializable`
    and `transient` are irrelevant to Jackson binding.
  ref: concepts.md#json-serialization-with-jackson
- id: serialization-039
  difficulty: advanced
  tags:
  - protobuf
  - proto3
  question: |
    Which statement about proto3 (Protocol Buffers version 3) is correct?
  options:
  - Every scalar field must be explicitly marked `required`, and the parser rejects any
    message in which a required field is missing from the wire bytes
  - Field names, not numbers, identify fields on the wire, so renaming a field silently
    breaks compatibility with previously encoded messages
  - The `required` keyword was removed; scalar fields are effectively optional, and compatibility is maintained
    through stable field numbers
  - The full `.proto` schema is embedded in the head of every serialized message payload
    so that any reader can decode it without prior knowledge
  answer: 2
  explanation: |
    proto3 removed `required` (a source of compatibility pain); fields are
    effectively optional. Compatibility relies on stable numeric field tags, and
    unknown fields are preserved/ignored. The schema is external (`.proto`), not
    embedded in the payload.
  ref: concepts.md#alternatives-such-as-protobuf-and-avro
- id: serialization-040
  difficulty: advanced
  tags:
  - code-analysis
  - final-transient
  question: |
    ```java
    class C implements Serializable {
        private final transient int id = 5;
        private void readObject(ObjectInputStream in) throws Exception {
            in.defaultReadObject();
            this.id = in.readInt();   // (*)
        }
    }
    ```
    What is the problem with line (*)?
  options:
  - Nothing; it compiles and works, because readObject is treated as an honorary constructor
    that is permitted to assign final fields exactly once
  - It throws NotSerializableException at runtime because the transient final field has no
    persisted data block in the incoming stream
  - It compiles but silently ignores the assignment, leaving the field at its initializer value 5
    because final fields are write-protected after construction
  - It fails to compile because you cannot assign to a `final` field in readObject
  answer: 3
  explanation: |
    A `final` field can only be assigned in a constructor/initializer, not in
    `readObject`, so the assignment does not compile. To restore a `final`
    transient field on read you must use the serialization proxy pattern (whose
    `readResolve` calls a constructor) or make the field non-final.
  ref: concepts.md#transient-and-custom-writeobject-and-readobject
- id: serialization-041
  difficulty: expert
  tags:
  - records
  - serialversionuid
  question: |
    What is true about `serialVersionUID` for a serializable record that does not
    declare one?
  options:
  - The default serialVersionUID for a record is 0L, and the record's serialized form is based on its
    components rather than a structural hash of fields
  - Records cannot be serialized at all until you declare an explicit serialVersionUID, and
    omitting it produces an InvalidClassException the first time you write one
  - It is computed by hashing the record's accessor methods and component types, exactly the
    same structural algorithm used for an ordinary serializable class
  - It is always set equal to the number of components declared in the record header
  answer: 0
  explanation: |
    For records, the default `serialVersionUID` is `0L`, and serialization is
    component-based with reconstruction via the canonical constructor. This
    differs from ordinary classes, whose implicit UID is a structural hash. Per
    the serialization spec, the requirement for matching serialVersionUID values
    is waived for records, so a UID mismatch does not block deserialization.
  ref: concepts.md#records-and-serialization
- id: serialization-042
  difficulty: expert
  tags:
  - security
  - jep-415
  question: |
    JEP 415 (JDK 17) added which capability on top of JEP 290's serialization
    filters?
  options:
  - It removed the native serialization subsystem from the JDK entirely, forcing all code
    to migrate to an external library such as Jackson or protobuf
  - Context-specific / per-stream filter factories, allowing a JVM-wide factory to select filters dynamically
    based on context
  - Automatic AES encryption of all serialized byte streams using a JVM-managed key so that
    intercepted payloads cannot be inspected or replayed
  - Compile-time rejection of any class implementing Serializable unless it is explicitly
    added to a module-level allow list
  answer: 1
  explanation: |
    JEP 415 (JDK 17) introduced context-specific deserialization filters via a
    configurable filter factory, letting applications choose or combine filters
    per stream/context (e.g., different rules per component). JEP 290 provided the
    base filtering; JEP 415 makes it composable and context-aware.
  ref: concepts.md#why-native-serialization-is-discouraged
- id: serialization-043
  difficulty: expert
  tags:
  - code-analysis
  - readresolve-proxy
  question: |
    ```java
    class Period implements Serializable {
        private final Date start, end;
        Period(Date s, Date e) { /* validates s <= e, defensive copies */ }
        private Object writeReplace() { return new Proxy(this); }
        private void readObject(ObjectInputStream in) throws InvalidObjectException {
            throw new InvalidObjectException("Proxy required");
        }
        private static class Proxy implements Serializable {
            private final Date start, end;
            Proxy(Period p){ start=p.start; end=p.end; }
            private Object readResolve(){ return new Period(start, end); }
        }
    }
    ```
    Why does `readObject` deliberately throw?
  options:
  - To disable serialization entirely for Period, since writeReplace alone cannot stop the
    class from being written to a stream
  - Because the serialization spec requires the guarded class in every proxy pattern to
    throw from readObject before writeReplace is allowed to run
  - To prevent an attacker from crafting a raw byte stream that bypasses the proxy and constructs a Period
    directly without validation
  - To force the JVM to fall back to the Externalizable code path, which validates fields
    through the public no-arg constructor
  answer: 2
  explanation: |
    Normally an attacker could hand-craft bytes that look like a direct `Period`
    stream, bypassing the proxy's `readResolve` (and thus validation). Throwing in
    `Period.readObject` ensures a genuine `Period` stream is never accepted; only
    the proxy path (which runs the validating constructor) can reconstruct the
    object.
  ref: concepts.md#serialization-proxy-pattern
- id: serialization-044
  difficulty: expert
  tags:
  - effective-java
  - trade-offs
  question: |
    Which best summarizes the Effective Java (Item 85) guidance on serialization?
  options:
  - Use Java serialization for all new persistence and RPC, because its built-in object-graph
    handling is more robust than any third-party structured format
  - Always prefer Externalizable over JSON, since hand-written writeExternal methods give both
    better performance and a safer attack surface in every scenario
  - Serialization is perfectly safe for untrusted input as long as you declare an explicit
    serialVersionUID and keep it stable across releases
  - There is no reason to use Java serialization in a new system; prefer cross-platform structured representations
    like JSON or protobuf
  answer: 3
  explanation: |
    Item 85 states there is essentially no reason to use Java serialization in
    new systems, primarily due to the security attack surface, and recommends
    cross-platform structured-data representations (e.g., JSON, protobuf).
    `serialVersionUID` addresses versioning, not the security problem.
  ref: concepts.md#why-native-serialization-is-discouraged
- id: serialization-045
  difficulty: expert
  tags:
  - code-analysis
  - static
  question: |
    ```java
    class Counter implements Serializable {
        static int instances = 0;   // static
        int id;
        Counter(){ id = ++instances; }
    }
    // In JVM #1: serialize a Counter c (id becomes 3 after 3 constructions).
    // In JVM #2 (fresh, instances==0): deserialize bytes into d.
    ```
    In JVM #2, what are `d.id` and `Counter.instances`?
  options:
  - d.id = 3, instances = 0
  - d.id = 3, instances = 3
  - d.id = 0, instances = 3
  - d.id = 1, instances = 1
  answer: 0
  explanation: |
    `id` is an instance field and is restored to 3 from the stream. `instances`
    is `static`, so it is NOT part of the serialized form; in the fresh JVM #2 it
    retains its class-init value 0. Also note the `Counter` constructor does not
    run during deserialization, so `instances` is not incremented.
  ref: concepts.md#native-java-serialization-basics
- id: serialization-046
  difficulty: expert
  tags:
  - performance
  - alternatives
  question: |
    A high-throughput internal service needs compact, fast, schema-evolving
    cross-language messages. Which choice best fits, and why?
  options:
  - Native Java serialization, because it is built into the JDK and its binary object-stream
    format is both cross-language and immune to schema-evolution problems
  - Protocol Buffers, because it is compact binary, cross-language, has explicit field-number-based versioning,
    and no code-execution-on-parse risk
  - Externalizable, because its hand-written wire format is the fastest and most compact option
    for every workload and is readable by non-JVM consumers
  - XML, because it is human-readable and its verbose tag structure gives the most compact
    encoding for high-throughput binary messaging
  answer: 1
  explanation: |
    Protobuf is designed for exactly this: compact binary encoding, codegen for
    many languages, controlled schema evolution via stable field numbers, and no
    arbitrary code execution on parse. Native serialization is Java-only and
    unsafe; Externalizable is still Java-only; XML is verbose.
  ref: concepts.md#alternatives-such-as-protobuf-and-avro
- id: serialization-047
  difficulty: expert
  tags:
  - readobjectnodata
  question: |
    When is a class's `readObjectNoData()` method invoked?
  options:
  - Every time an object is deserialized, as a mandatory pre-pass that runs just before
    defaultReadObject restores the non-transient fields
  - Whenever the stream's serialVersionUID matches the loaded class exactly, in which case it
    is called instead of readObject to confirm the version
  - When the stream being read does not contain data for a class that the current (receiving) class hierarchy
    includes as a superclass, e.g., a superclass was added after the sender serialized
  - Only for Externalizable classes, where it replaces readExternal when the incoming stream
    turns out to be empty
  answer: 2
  explanation: |
    `readObjectNoData()` is called to initialize a class's state when the sender's
    stream has no data for that superclass, typically because the receiver added
    the superclass to the hierarchy after the data was written. It lets the class
    set sensible defaults instead of leaving fields zeroed unexpectedly.
  ref: concepts.md#transient-and-custom-writeobject-and-readobject
- id: serialization-048
  difficulty: expert
  tags:
  - code-analysis
  - jackson-records
  question: |
    ```java
    public record Money(String currency, long cents) {
        public Money {
            if (cents < 0) throw new IllegalArgumentException("negative");
        }
    }
    // Jackson 2.15, default config:
    Money m = mapper.readValue("{\"currency\":\"USD\",\"cents\":-5}", Money.class);
    ```
    What happens?
  options:
  - Deserializes to Money[currency=USD, cents=-5]; Jackson sets the record components by
    field reflection, so the compact constructor's validation is bypassed
  - Compile error, because Jackson cannot bind JSON to a record type without a hand-written
    custom deserializer registered on the ObjectMapper
  - Returns null, because Jackson swallows the constructor exception and falls back to the
    record's all-defaults instance when validation fails
  - Deserialization invokes the canonical constructor, whose compact constructor throws IllegalArgumentException
    (surfaced as a Jackson value-instantiation exception)
  answer: 3
  explanation: |
    Jackson 2.12+ deserializes records through their canonical constructor, so the
    compact-constructor validation runs. With `cents = -5` it throws
    `IllegalArgumentException`, which Jackson wraps/propagates as a
    value-instantiation error. This mirrors the safety of native record
    serialization: state always flows through the constructor.
  ref: concepts.md#records-and-serialization
- id: serialization-049
  difficulty: expert
  tags:
  - externalizable
  - security
  question: |
    Does implementing `Externalizable` instead of `Serializable` eliminate the
    untrusted-deserialization security risk?
  options:
  - No; `readExternal` still runs during deserialization of attacker-controlled streams and instantiates
    objects, so untrusted input remains dangerous
  - Yes; Externalizable is structurally immune to gadget attacks because it never invokes
    reflective readObject callbacks on the classes named in the stream
  - Yes, because the public no-arg constructor runs first and fully validates the object
    before any attacker-supplied bytes are read into it
  - Only if serialVersionUID is set to 0, which disables the class-descriptor loading that
    gadget chains rely on to reach vulnerable classes
  answer: 0
  explanation: |
    `Externalizable` still deserializes attacker-controlled bytes and runs
    `readExternal` plus object construction, so it does not close the
    untrusted-input attack surface (and the object-graph reading machinery is the
    same). The real mitigation is not deserializing untrusted native streams at
    all, plus `ObjectInputFilter`.
  ref: concepts.md#externalizable
- id: serialization-050
  difficulty: expert
  tags:
  - code-analysis
  - validation
  question: |
    ```java
    class Age implements Serializable {
        private int years;             // invariant: 0..150
        Age(int y){ if(y<0||y>150) throw new IllegalArgumentException(); years=y; }
    }
    ```
    An attacker crafts a byte stream with `years = -99999`. With plain default
    serialization and no custom `readObject`, what results?
  options:
  - Deserialization re-runs the Age constructor to rebuild the instance, so its range check
    fires and an IllegalArgumentException aborts the read
  - Deserialization succeeds and produces an Age with years = -99999, violating the invariant, because
    no constructor runs
  - A NotSerializableException is thrown at read time because the crafted stream fails the
    built-in bounds check that the runtime applies to primitive int fields
  - The value is silently clamped to the nearest valid bound (0) by the default field-restore
    logic before the object is handed back
  answer: 1
  explanation: |
    Default deserialization bypasses the constructor, so the `0..150` invariant is
    never re-checked and the object ends up with `years = -99999`. Defending
    against this requires a validating custom `readObject` (Effective Java Item
    88) or the serialization proxy pattern; records get this for free via the
    canonical constructor.
  ref: concepts.md#why-native-serialization-is-discouraged
- id: serialization-051
  difficulty: beginner
  tags:
  - readobject
  - exceptions
  question: |
    Which checked exceptions must you typically handle when calling
    `ObjectInputStream.readObject()`?
  options:
  - Only `IOException`, because the class descriptor is always embedded in the stream so
    the class can never be missing at read time
  - Only `RuntimeException` subclasses such as `IllegalStateException`, since readObject
    declares no checked exceptions of its own
  - '`IOException` and `ClassNotFoundException`'
  - '`SQLException` and `IOException`, since readObject may consult the JDBC layer while
    materializing persisted objects'
  answer: 2
  explanation: |
    `readObject()` declares both `IOException` (stream errors) and
    `ClassNotFoundException` (the class named in the stream is not on the
    classpath). Both are checked and must be caught or declared.
  ref: concepts.md#native-java-serialization-basics
- id: serialization-052
  difficulty: intermediate
  tags:
  - jackson
  - annotations
  question: |
    Which Jackson annotation excludes a property from BOTH serialization and
    deserialization?
  options:
  - '`@JsonProperty`, which drops a property from both directions once you give it an
    empty name value'
  - '`@JsonInclude`, which excludes a property from serialization and deserialization
    whenever its value is null or empty'
  - '`@JsonFormat`, which removes a property from the JSON on both read and write by
    formatting it as an ignored token'
  - '`@JsonIgnore`'
  answer: 3
  explanation: |
    `@JsonIgnore` on a field/getter removes it from serialization and
    deserialization. `@JsonProperty` renames/maps, `@JsonInclude` controls
    null/empty inclusion, and `@JsonFormat` controls formatting (e.g., dates).
  ref: concepts.md#json-serialization-with-jackson
- id: serialization-053
  difficulty: intermediate
  tags:
  - discouraged
  - cross-language
  question: |
    Why is native Java serialization a poor choice for communication between a
    Java service and a Python service?
  options:
  - The native serialized format is Java-specific and not readable by other languages
  - Python code always executes faster than Java, so the Java service becomes the throughput
    bottleneck whenever native serialization is on the path
  - Python processes are sandboxed and cannot open raw network sockets, so they are unable
    to receive any serialized byte stream at all
  - JSON is dramatically slower than native serialization, so choosing it for cross-language
    calls would make the Python integration unacceptably sluggish
  answer: 0
  explanation: |
    Native Java serialization produces a Java-only binary format (it embeds Java
    class descriptors), so non-JVM languages cannot decode it. Cross-language
    communication needs a neutral format such as JSON or protobuf.
  ref: concepts.md#why-native-serialization-is-discouraged
- id: serialization-054
  difficulty: advanced
  tags:
  - code-analysis
  - inheritance
  question: |
    ```java
    class A { A(){ System.out.println("A ctor"); } }        // NOT Serializable
    class B extends A implements Serializable { int x = 9; }
    // deserialize a previously written B
    ```
    What is printed during deserialization of `B`, if anything?
  options:
  - Nothing is printed, because deserialization restores the whole B instance directly from
    the stream and never touches any constructor in the hierarchy
  - '"A ctor" is printed, because the non-serializable superclass constructor runs'
  - '"A ctor" is printed twice, once for the allocation of B and once when its inherited A
    portion is initialized from the stream data'
  - A compile error occurs, because B may not implement Serializable while extending a
    superclass that does not
  answer: 1
  explanation: |
    Because `A` is not serializable, its no-arg constructor is invoked to
    initialize the `A` portion during `B`'s deserialization, printing "A ctor"
    once. `B`'s own state (`x`) is restored from the stream without running B's
    constructor.
  ref: concepts.md#native-java-serialization-basics
- id: serialization-055
  difficulty: advanced
  tags:
  - avro
  - alternatives
  question: |
    A common reason to choose Apache Avro (over protobuf) in a Kafka/big-data
    pipeline is:
  options:
  - Avro executes arbitrary Java code embedded in the payload on read, letting producers ship custom deserialization logic to consumers
  - Avro serializes to a human-readable text format like JSON, so operators can hand-inspect and edit records directly in the topic log
  - Avro carries/uses a schema (often via a schema registry) enabling dynamic reading and strong schema-evolution
    support for streaming data
  - Avro requires no schema at all and infers field types purely from the byte layout, so producers and consumers never need to agree on a definition
  answer: 2
  explanation: |
    Avro is schema-based (schemas expressed in JSON) and pairs well with a schema
    registry, supporting dynamic reading and robust schema evolution common in
    Kafka/big-data ecosystems. It is compact binary (not human-readable) and,
    like protobuf, does not execute arbitrary code on parse.
  ref: concepts.md#alternatives-such-as-protobuf-and-avro
- id: serialization-056
  difficulty: intermediate
  tags:
  - transient
  - recompute
  question: |
    A class caches an expensive computed value in a field and also stores the raw
    inputs. What is the cleanest way to keep the cache out of the serialized form
    while still restoring it after read?
  options:
  - Make the cache field `static` so the serialization runtime skips it and lazily rebuilds it the next time any instance reads the value
  - Mark every field `transient` so the whole object is excluded from the stream and the JVM regenerates all state from constructors on read
  - Set `serialVersionUID` to 0, which tells the runtime to drop derived fields and recompute them automatically during deserialization
  - Mark the cache field `transient` and recompute it in a custom `readObject` (after `defaultReadObject`)
  answer: 3
  explanation: |
    Marking the cache `transient` keeps it out of the stream (smaller, avoids
    stale data), and recomputing it inside a custom `readObject` after
    `defaultReadObject()` restores it from the deserialized inputs. Making it
    `static` would wrongly share it across instances.
  ref: concepts.md#transient-and-custom-writeobject-and-readobject
