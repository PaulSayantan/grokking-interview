topic: "Parallelism: Parallel Streams, Fork/Join and Data Parallelism"
domain: java-jvm
topic_slug: parallelism-parallel-streams-forkjoin
version: 1
questions:
  - id: parallelism-parallel-streams-forkjoin-001
    difficulty: beginner
    tags: [concurrency, parallelism, definitions]
    question: |
      Which statement best captures the difference between concurrency and parallelism?
    options:
      - "Concurrency requires multiple CPU cores; parallelism can run on a single core"
      - "Concurrency is about dealing with many tasks in progress at once (structure), while parallelism is about executing multiple computations simultaneously on multiple cores (execution)"
      - "They are two names for the same thing; the JDK uses them interchangeably"
      - "Parallelism is only possible with virtual threads, concurrency only with platform threads"
    answer: 1
    explanation: |
      Concurrency is a structuring/composition concern (many tasks interleaved, possibly on one core via time-slicing); parallelism is an execution concern that needs real hardware (multiple cores) to run computations at the same instant. Option 0 reverses the truth: parallelism needs multiple cores, not concurrency. Option 2 and 3 are simply false — the concepts are distinct and neither is tied to a specific thread type.
    ref: "concepts.md#concurrency-versus-parallelism"

  - id: parallelism-parallel-streams-forkjoin-002
    difficulty: beginner
    tags: [concurrency, single-core]
    question: |
      Can you have concurrency on a single-core machine with no true parallelism?
    options:
      - "No — concurrency is impossible without at least two cores"
      - "Yes — tasks can be interleaved via time-slicing/context switching, which is concurrency without simultaneous execution"
      - "Only if you use parallel streams"
      - "Only if hyper-threading is enabled"
    answer: 1
    explanation: |
      Concurrency is about managing multiple in-progress tasks; a single core can interleave them by context switching, giving concurrency without parallelism. Parallelism specifically means simultaneous execution and requires multiple cores. Parallel streams (option 2) actually target parallelism, and hyper-threading (option 3) is an unrelated hardware detail.
    ref: "concepts.md#concurrency-versus-parallelism"

  - id: parallelism-parallel-streams-forkjoin-003
    difficulty: beginner
    tags: [data-parallelism, task-parallelism]
    question: |
      Applying the SAME operation to many independent pieces of data, split across cores, is called:
    options:
      - "Task parallelism"
      - "Data parallelism"
      - "Speculative execution"
      - "Pipelining"
    answer: 1
    explanation: |
      Data parallelism applies one identical operation to many data elements independently (what parallel streams and Arrays.parallelSort do). Task parallelism (option 0) runs *different* operations concurrently. Speculative execution and pipelining are CPU micro-architecture techniques, not the decomposition strategy in question.
    ref: "concepts.md#data-parallelism-versus-task-parallelism"

  - id: parallelism-parallel-streams-forkjoin-004
    difficulty: beginner
    tags: [forkjoin, version]
    question: |
      In which Java release was the Fork/Join framework (ForkJoinPool, RecursiveTask, RecursiveAction) introduced?
    options:
      - "Java 5"
      - "Java 6"
      - "Java 7"
      - "Java 8"
    answer: 2
    explanation: |
      The Fork/Join framework arrived in Java 7 (2011) as part of JSR 166. Java 5 added java.util.concurrent basics (executors, concurrent collections); Java 8 (2014) added parallel streams and the *common* pool plus CountedCompleter, but Fork/Join itself predates streams.
    ref: "concepts.md#the-fork-join-framework"

  - id: parallelism-parallel-streams-forkjoin-005
    difficulty: beginner
    tags: [parallel-streams, api]
    question: |
      Which are valid ways to obtain a parallel stream in Java 8+?
    options:
      - "collection.parallelStream() or stream.parallel()"
      - "collection.concurrentStream() only"
      - "new ParallelStream(collection)"
      - "Stream.parallelOf(collection)"
    answer: 0
    explanation: |
      You get a parallel stream via Collection.parallelStream() or by calling .parallel() on an existing stream (and .sequential() to switch back). There is no concurrentStream(), no public ParallelStream constructor, and no Stream.parallelOf factory.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-006
    difficulty: beginner
    tags: [parallel-streams, common-pool]
    question: |
      By default, which thread pool executes a parallel stream's work?
    options:
      - "The shared common ForkJoinPool (ForkJoinPool.commonPool())"
      - "A brand-new cached thread pool created per stream"
      - "The JVM's finalizer thread"
      - "A single-threaded ScheduledExecutorService"
    answer: 0
    explanation: |
      Parallel streams submit their splitting/combining work to the JVM-wide shared common ForkJoinPool. No new pool is created per stream, which is exactly why a blocking task in one parallel stream can starve all others.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-007
    difficulty: beginner
    tags: [amdahl, definitions]
    question: |
      Amdahl's law describes:
    options:
      - "The maximum theoretical speedup of a program limited by its inherently serial fraction"
      - "The rate at which garbage collection pauses grow with heap size"
      - "How many virtual threads can be mounted on one carrier thread"
      - "The optimal threshold for splitting a RecursiveTask"
    answer: 0
    explanation: |
      Amdahl's law bounds speedup by the serial (non-parallelizable) fraction of a program: with fraction p parallelizable, max speedup is 1/(1-p). The other options describe unrelated GC, virtual-thread, and Fork/Join tuning concerns.
    ref: "concepts.md#amdahls-law-and-diminishing-returns"

  - id: parallelism-parallel-streams-forkjoin-008
    difficulty: beginner
    tags: [arrays, parallelsort, version]
    question: |
      Arrays.parallelSort was introduced in which Java version and is built on top of what?
    options:
      - "Java 8, built on the Fork/Join framework"
      - "Java 7, built on Timsort only"
      - "Java 11, built on virtual threads"
      - "Java 6, built on quicksort"
    answer: 0
    explanation: |
      Arrays.parallelSort was added in Java 8 and uses a parallel merge sort implemented on the Fork/Join framework (common pool). Virtual threads did not exist until much later (final in JDK 21) and are unrelated.
    ref: "concepts.md#arrays-parallelsort-and-parallelprefix"

  - id: parallelism-parallel-streams-forkjoin-009
    difficulty: beginner
    tags: [primitive-streams, boxing]
    question: |
      To sum a large range of numbers in parallel while avoiding boxing overhead, you should prefer:
    options:
      - "IntStream / LongStream (primitive specialized streams)"
      - "Stream<Integer> with .parallel()"
      - "A parallel Stream<Object>"
      - "Collections.synchronizedList with a parallel forEach"
    answer: 0
    explanation: |
      Primitive specialized streams (IntStream, LongStream, DoubleStream) avoid boxing/unboxing that a Stream<Integer> incurs per element, which matters a lot in tight numeric loops. A synchronized list with parallel forEach both boxes and serializes on a lock — the worst of both worlds.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-010
    difficulty: beginner
    tags: [virtual-threads, version]
    question: |
      In which JDK release did virtual threads become a FINAL (non-preview) feature?
    options:
      - "JDK 17"
      - "JDK 19"
      - "JDK 21"
      - "JDK 25"
    answer: 2
    explanation: |
      Virtual threads were previewed in JDK 19 (JEP 425) and 20 (JEP 436) and became final in JDK 21 via JEP 444. JDK 17 predates them; they were not merely previews in 21 but finalized.
    ref: "concepts.md#choosing-between-parallel-streams-completablefuture-and-virtual-threads"

  - id: parallelism-parallel-streams-forkjoin-011
    difficulty: beginner
    tags: [measuring, benchmarking]
    question: |
      What is the recommended tool/approach for reliably benchmarking sequential vs parallel Java code?
    options:
      - "Use JMH (Java Microbenchmark Harness) with proper warmup and measurement iterations"
      - "Wrap the code in System.nanoTime() once and print the difference"
      - "Count the number of lines of code executed"
      - "Trust the Amdahl's law formula instead of measuring"
    answer: 0
    explanation: |
      JMH handles JIT warmup, dead-code elimination and constant folding that naive nanoTime timing gets wrong. Amdahl's law gives a theoretical ceiling but does not replace measurement on real data/hardware.
    ref: "concepts.md#measuring-before-parallelizing"

  - id: parallelism-parallel-streams-forkjoin-012
    difficulty: intermediate
    tags: [forkjoin, recursivetask, recursiveaction]
    question: |
      When implementing Fork/Join divide-and-conquer, when do you extend RecursiveTask vs RecursiveAction?
    options:
      - "RecursiveTask for tasks that return a result; RecursiveAction for tasks that return nothing (void)"
      - "RecursiveTask for CPU work; RecursiveAction for IO work"
      - "RecursiveTask only on the common pool; RecursiveAction only on custom pools"
      - "They are identical; the names are aliases"
    answer: 0
    explanation: |
      RecursiveTask<V> overrides compute() returning a value V; RecursiveAction overrides void compute() and produces no result (it mutates state or writes output). The distinction is about return value, not IO vs CPU or which pool is used.
    ref: "concepts.md#the-fork-join-framework"

  - id: parallelism-parallel-streams-forkjoin-013
    difficulty: intermediate
    tags: [forkjoin, work-stealing]
    question: |
      In Fork/Join work-stealing, how does an idle worker obtain more work?
    options:
      - "It waits for a central dispatcher thread to assign it a task"
      - "It steals a task from the TAIL of another busy worker's deque, while it pushes/pops its own tasks at the HEAD"
      - "It steals from the HEAD of another worker's deque to preserve LIFO order globally"
      - "It creates a brand new task from scratch"
    answer: 1
    explanation: |
      Each worker owns a double-ended queue: it pushes and pops its own subtasks LIFO at the head (cache-friendly, and the newest task is smallest). An idle worker steals from the *tail* of another worker's deque — the oldest, largest chunk — which minimizes contention (two ends) and reduces steal frequency. There is no central dispatcher.
    ref: "concepts.md#the-fork-join-framework"

  - id: parallelism-parallel-streams-forkjoin-014
    difficulty: intermediate
    tags: [parallel-streams, shared-mutable-state]
    question: |
      What is wrong with this code?

      ```java
      List<Integer> sink = new ArrayList<>();
      IntStream.range(0, 100_000).parallel()
               .forEach(sink::add);
      ```
    options:
      - "Nothing — ArrayList.add is atomic"
      - "It has a data race on the non-thread-safe ArrayList; results may be corrupted, elements lost, or an exception thrown"
      - "It won't compile because forEach can't take a method reference"
      - "It always throws ConcurrentModificationException deterministically"
    answer: 1
    explanation: |
      Multiple worker threads call add() on a single non-thread-safe ArrayList concurrently — a classic data race. Behavior is undefined: lost/duplicated elements, corrupted internal array, ArrayIndexOutOfBoundsException, or NPE. It is not guaranteed to throw (option 3), and ArrayList.add is not atomic (option 0). The correct approach is a reduction/collector (e.g. .boxed().collect(toList())).
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-015
    difficulty: intermediate
    tags: [parallel-streams, ordering]
    question: |
      On a PARALLEL stream, what is the difference between forEach and forEachOrdered?
    options:
      - "forEach preserves encounter order; forEachOrdered does not"
      - "forEach makes no ordering guarantee; forEachOrdered processes elements in encounter order at the cost of some parallelism"
      - "Both always preserve encounter order on parallel streams"
      - "forEachOrdered is only valid on infinite streams"
    answer: 1
    explanation: |
      On a parallel stream forEach gives no ordering guarantee (elements are processed by whatever thread, whenever), whereas forEachOrdered honors the encounter order, which requires coordination and reduces parallel throughput. Option 0 reverses them.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-016
    difficulty: intermediate
    tags: [parallel-streams, findany, findfirst]
    question: |
      In a parallel stream, why can findAny be faster than findFirst?
    options:
      - "findAny may return any matching element that any thread finds first, avoiding the encounter-order constraint that findFirst must honor"
      - "findAny caches results between runs"
      - "findFirst is not supported on parallel streams"
      - "findAny runs sequentially, which is always faster"
    answer: 0
    explanation: |
      findFirst must return the first element in *encounter order*, forcing coordination among threads. findAny is free to return whatever matching element is discovered first by any worker, avoiding that constraint and often finishing sooner in parallel. Both are supported on parallel streams.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-017
    difficulty: intermediate
    tags: [data-parallelism, task-parallelism, completablefuture]
    question: |
      You must call three independent remote services and combine their responses. Which tool is the most appropriate?
    options:
      - "CompletableFuture (supplyAsync + thenCombine/allOf) on a dedicated executor"
      - "A parallel stream over a list of the three calls"
      - "Arrays.parallelSort"
      - "A single RecursiveTask that blocks on all three"
    answer: 0
    explanation: |
      This is task parallelism with blocking IO — CompletableFuture composing independent async calls on a sized executor is ideal. A parallel stream would run the blocking calls on the shared common pool (starving it) and adds no benefit for just three heterogeneous tasks. parallelSort is unrelated; blocking inside Fork/Join is discouraged.
    ref: "concepts.md#data-parallelism-versus-task-parallelism"

  - id: parallelism-parallel-streams-forkjoin-018
    difficulty: intermediate
    tags: [parallel-streams, spliterator]
    question: |
      Which source generally splits best (parallelizes most efficiently) for a parallel stream?
    options:
      - "LinkedList"
      - "Stream.iterate(0, i -> i + 1)"
      - "ArrayList or an int[] array / IntStream.range"
      - "Lines read from a BufferedReader"
    answer: 2
    explanation: |
      Array-backed sources (ArrayList, arrays, IntStream.range) are SIZED/SUBSIZED and split in O(1) into evenly sized halves — excellent for load balancing. LinkedList must be traversed to split, Stream.iterate is unsized and hard to split, and IO-backed line streams have unknown size and are inherently sequential.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-019
    difficulty: intermediate
    tags: [common-pool, parallelism-level]
    question: |
      What is the default parallelism (target worker count) of the common ForkJoinPool?
    options:
      - "Runtime.getRuntime().availableProcessors() - 1"
      - "Exactly Runtime.getRuntime().availableProcessors()"
      - "Always 4, regardless of hardware"
      - "Twice the number of cores"
    answer: 0
    explanation: |
      The common pool's default parallelism is availableProcessors() - 1, because the thread that submits the task can also participate, bringing effective parallelism up to the core count. It can be overridden via the system property java.util.concurrent.ForkJoinPool.common.parallelism.
    ref: "concepts.md#the-fork-join-framework"

  - id: parallelism-parallel-streams-forkjoin-020
    difficulty: intermediate
    tags: [parallel-streams, small-datasets]
    question: |
      Why is calling .parallel() on a stream over a small list of, say, 20 elements doing trivial work usually slower than sequential?
    options:
      - "Parallel streams cap out at 16 elements"
      - "Small lists cannot be split at all, so it throws an exception"
      - "The fixed overhead of splitting, task scheduling, and thread hand-off/merging dwarfs the tiny amount of actual work"
      - "The common pool refuses tasks under 100 elements"
    answer: 2
    explanation: |
      Parallelization has fixed costs — spliterator splitting, submitting Fork/Join tasks, thread coordination, and merging results. For small N and cheap per-element work (small N×Q), that overhead exceeds any benefit, so sequential wins. There is no hard element cap or exception; the pool will happily (but wastefully) run it.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-021
    difficulty: intermediate
    tags: [amdahl, calculation]
    question: |
      A workload is 80% parallelizable and 20% inherently serial. As the number of processors approaches infinity, the maximum speedup approaches:
    options:
      - "5x"
      - "10x"
      - "80x"
      - "Unbounded"
    answer: 0
    explanation: |
      By Amdahl's law the ceiling is 1/(1-p) with p=0.8, giving 1/0.2 = 5x. The serial 20% can never be sped up, so no amount of hardware exceeds 5x. It is definitely bounded, not unbounded.
    ref: "concepts.md#amdahls-law-and-diminishing-returns"

  - id: parallelism-parallel-streams-forkjoin-022
    difficulty: intermediate
    tags: [arrays, parallelprefix]
    question: |
      What does the following print?

      ```java
      int[] a = {1, 2, 3, 4};
      Arrays.parallelPrefix(a, (x, y) -> x + y);
      System.out.println(Arrays.toString(a));
      ```
    options:
      - "[1, 2, 3, 4]"
      - "[0, 1, 3, 6]"
      - "[1, 3, 6, 10]"
      - "[10, 9, 7, 4]"
    answer: 2
    explanation: |
      parallelPrefix performs an in-place cumulative (prefix scan): a[0]=1, a[1]=1+2=3, a[2]=3+3=6, a[3]=6+4=10 → [1,3,6,10]. The operator must be associative because segments are combined in parallel.
    ref: "concepts.md#arrays-parallelsort-and-parallelprefix"

  - id: parallelism-parallel-streams-forkjoin-023
    difficulty: intermediate
    tags: [virtual-threads, cpu-bound]
    question: |
      Do virtual threads (final in JDK 21) speed up a CPU-bound numeric loop compared to running it on platform threads?
    options:
      - "Yes — virtual threads run faster on the CPU than platform threads"
      - "No — virtual threads help with high-concurrency BLOCKING IO, not CPU-bound work, which is still limited by core count"
      - "Yes, but only if you have more than 1000 of them"
      - "No — virtual threads cannot execute CPU instructions at all"
    answer: 1
    explanation: |
      Virtual threads make blocking cheap (a task unmounts its carrier while waiting on IO), enabling millions of concurrent blocking tasks. They do NOT add CPU throughput — CPU-bound work is still bounded by physical cores, so for that you want parallel streams/Fork/Join. Virtual threads absolutely can run CPU instructions (option 3 is wrong).
    ref: "concepts.md#choosing-between-parallel-streams-completablefuture-and-virtual-threads"

  - id: parallelism-parallel-streams-forkjoin-024
    difficulty: intermediate
    tags: [structured-concurrency, version]
    question: |
      What is the status of Structured Concurrency (StructuredTaskScope) as of JDK 21?
    options:
      - "Final and production-ready in JDK 21"
      - "Removed from the JDK entirely"
      - "Still a preview/incubating API in JDK 21 (not finalized)"
      - "Available only in JDK 8"
    answer: 2
    explanation: |
      Structured concurrency was an incubator in JDK 19 (JEP 428) and a preview in JDK 21 (JEP 453) — it was NOT finalized in 21. Virtual threads (a related Loom feature) did become final in 21, but structured concurrency stayed preview.
    ref: "concepts.md#choosing-between-parallel-streams-completablefuture-and-virtual-threads"

  - id: parallelism-parallel-streams-forkjoin-025
    difficulty: intermediate
    tags: [parallel-streams, stateful-ops]
    question: |
      Which of these intermediate operations is STATEFUL and can therefore erode parallel-stream performance?
    options:
      - "map"
      - "filter"
      - "sorted"
      - "peek"
    answer: 2
    explanation: |
      sorted is a stateful operation: it must buffer/collect elements before it can emit any, forcing coordination and often a full barrier in parallel pipelines. map, filter, and peek are stateless per-element operations that parallelize cleanly. distinct, limit, and skip are also stateful.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-026
    difficulty: intermediate
    tags: [collectors, concurrent]
    question: |
      When collecting a parallel stream into a Map, why might groupingByConcurrent outperform groupingBy?
    options:
      - "groupingByConcurrent preserves encounter order, which is faster"
      - "groupingBy does not compile in a parallel stream"
      - "groupingByConcurrent lets all threads write into a single shared ConcurrentMap (unordered), avoiding the per-thread-map-then-merge that groupingBy requires"
      - "There is no performance difference; the names are aliases"
    answer: 2
    explanation: |
      groupingBy in parallel builds a separate map per thread and then merges them (an extra combine step). groupingByConcurrent (and toConcurrentMap) let threads accumulate directly into one shared thread-safe ConcurrentMap with an UNORDERED characteristic, skipping the merge and often winning in parallel. It does not preserve encounter order — that's the trade-off.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-027
    difficulty: intermediate
    tags: [io-bound, parallel-streams]
    question: |
      A teammate parallelizes a stream that makes a blocking HTTP call per element on the common pool. Under load, unrelated parallel streams in the same JVM slow to a crawl. What happened?
    options:
      - "The GC ran out of memory"
      - "The HTTP library disabled parallelism globally"
      - "The blocking calls occupy the shared common ForkJoinPool's workers, starving all other parallel streams in the process"
      - "Parallel streams automatically fall back to single-threaded mode after an HTTP call"
    answer: 2
    explanation: |
      The common ForkJoinPool is shared JVM-wide. Blocking IO tasks tie up its limited workers, so every other parallel stream (including library code) is starved of threads. The fix is to not do blocking IO on parallel streams — use CompletableFuture with a dedicated executor or virtual threads, or at least a separate ForkJoinPool.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-028
    difficulty: advanced
    tags: [forkjoin, fork-compute-join, ordering]
    question: |
      Consider the idiomatic Fork/Join pattern inside compute():

      ```java
      left.fork();
      long r = right.compute();
      long l = left.join();
      return l + r;
      ```
      Why is this generally preferred over `left.fork(); right.fork(); return left.join() + right.join();`?
    options:
      - "Because fork() spawns a real OS thread and the second form leaks threads"
      - "Because computing one half in the current thread avoids an extra queue push, and joining the forked task after computing keeps the current worker productive instead of blocking"
      - "Because join() can only be called once per task"
      - "Because RecursiveTask forbids calling fork() twice"
    answer: 1
    explanation: |
      Forking one subtask and directly computing the other keeps the current worker busy and avoids the overhead of pushing a second task onto the deque only to pop it again. Joining the forked task afterward lets it (or a stealer) run while making progress. fork() pushes onto a deque — it does not spawn an OS thread (option 0). You can fork twice and join once each (options 2,3 false), it's just less efficient.
    ref: "concepts.md#the-fork-join-framework"

  - id: parallelism-parallel-streams-forkjoin-029
    difficulty: advanced
    tags: [forkjoin, join-order]
    question: |
      Why can `left.fork(); right.fork(); long a = right.join(); long b = left.join();` (joining in REVERSE of fork order) be inefficient?
    options:
      - "It causes a compile error due to ordering rules"
      - "It always deadlocks"
      - "The current worker most recently pushed 'right' onto the top of its own deque and could pop it immediately, but blocking on right.join() while left sits below is fine; the classic pitfall is joining the OLDER (left) task first, forcing the worker to wait while its freshly pushed task can't be self-executed in LIFO order"
      - "join() in reverse order silently drops one result"
    answer: 2
    explanation: |
      Fork/Join deques are LIFO for the owner: the most recently forked task sits on top and is the one the worker can pop and run itself. Joining the task you forked LAST first aligns with that LIFO order and lets the worker do useful work; joining the older task first can force the worker to block/help instead of running the ready top task, hurting throughput. It does not deadlock, drop results, or fail to compile.
    ref: "concepts.md#the-fork-join-framework"

  - id: parallelism-parallel-streams-forkjoin-030
    difficulty: advanced
    tags: [forkjoin, threshold]
    question: |
      How should you choose the THRESHOLD (base-case size) in a RecursiveTask?
    options:
      - "Always 1 element, so the framework has maximum parallelism"
      - "Large enough that per-task overhead is amortized but small enough to keep all cores busy and balanced — tuned by measurement, not a fixed universal value"
      - "Exactly the number of CPU cores"
      - "It must equal the array length divided by 2"
    answer: 1
    explanation: |
      Too small a threshold creates a flood of tiny tasks whose scheduling overhead dominates; too large under-utilizes cores and causes imbalance. The sweet spot amortizes fork/join overhead while keeping enough tasks for work-stealing to balance load, and it depends on element cost/hardware — so you measure. A threshold of 1 (option 0) maximizes overhead, and the others are arbitrary.
    ref: "concepts.md#the-fork-join-framework"

  - id: parallelism-parallel-streams-forkjoin-031
    difficulty: advanced
    tags: [parallel-streams, reduce, associativity]
    question: |
      What is the risk of this parallel reduction?

      ```java
      int r = Stream.of(1, 2, 3, 4, 5).parallel()
                    .reduce(100, (a, b) -> a - b);
      ```
    options:
      - "It won't compile"
      - "It always returns 85, matching the sequential result"
      - "Subtraction is not associative, so the parallel result is nondeterministic and generally differs from the sequential result"
      - "reduce is not allowed on parallel streams"
    answer: 2
    explanation: |
      reduce requires an associative accumulator. Subtraction is not associative, and worse, the identity 100 gets applied per split, so parallel execution produces different (and unstable) results than the sequential left-fold. It compiles and runs — that's what makes it dangerous. Sequential would give 100-1-2-3-4-5 = 85, but parallel will not reliably match.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-032
    difficulty: advanced
    tags: [parallel-streams, custom-pool]
    question: |
      What does submitting a parallel-stream terminal op to your own ForkJoinPool accomplish, as in:

      ```java
      ForkJoinPool pool = new ForkJoinPool(4);
      long c = pool.submit(() -> list.parallelStream().filter(x -> heavy(x)).count()).get();
      ```
    options:
      - "Nothing — parallel streams always use the common pool regardless"
      - "It makes the stream sequential"
      - "The stream runs on that custom pool instead of the common pool, isolating the workload and bounding its parallelism (relying on an implementation detail)"
      - "It causes a compile error because streams cannot be nested in submit()"
    answer: 2
    explanation: |
      When a parallel-stream terminal operation executes inside a task running on a specific ForkJoinPool, the stream uses THAT pool rather than the common pool. This is the standard workaround to isolate a heavy/blocking workload and cap its thread count, though it depends on a JDK implementation detail. It does not make the stream sequential and compiles fine.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-033
    difficulty: advanced
    tags: [spliterator, characteristics]
    question: |
      Which Spliterator characteristics most help the stream framework split evenly and pre-size output for parallelism?
    options:
      - "CONCURRENT and IMMUTABLE"
      - "ORDERED and SORTED"
      - "SIZED and SUBSIZED"
      - "NONNULL and DISTINCT"
    answer: 2
    explanation: |
      SIZED means the total element count is known; SUBSIZED means every split also reports an exact size — together they let the framework compute balanced splits and pre-allocate result arrays, which is ideal for parallel performance. ORDERED/SORTED actually add ordering constraints; CONCURRENT/IMMUTABLE describe mutability, and NONNULL/DISTINCT describe element properties, none of which drive even splitting the way SIZED/SUBSIZED do.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-034
    difficulty: advanced
    tags: [parallel-streams, limit, ordered]
    question: |
      Why are limit and skip particularly expensive on an ORDERED parallel stream?
    options:
      - "They are not supported and throw UnsupportedOperationException"
      - "They silently make the stream sequential and are therefore free"
      - "They double the number of common-pool threads"
      - "To honor encounter order they force cross-thread coordination/buffering to determine exactly which elements fall within the first/last N, undermining independent parallel processing"
    answer: 3
    explanation: |
      On an ordered stream, limit(n) must yield exactly the first n in encounter order, and skip(n) must drop exactly the first n — both require coordinating across partitions to know positions, which buffers and synchronizes, hurting parallel scalability. They are supported (not exceptions) and do not silently go sequential or add threads.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-035
    difficulty: advanced
    tags: [arrays, parallelsort, threshold]
    question: |
      Below roughly what array size does Arrays.parallelSort effectively behave like a sequential sort?
    options:
      - "Below ~8192 elements it falls back to a sequential sort (no parallel split)"
      - "Below 2 elements only"
      - "It always splits, even for a 2-element array"
      - "Below 1 million elements"
    answer: 0
    explanation: |
      Arrays.parallelSort uses a minimum granularity (about 8192 elements in the JDK) below which splitting isn't worthwhile, so it just performs the ordinary sequential sort. It does not blindly split tiny arrays, and the cutoff is far below a million.
    ref: "concepts.md#arrays-parallelsort-and-parallelprefix"

  - id: parallelism-parallel-streams-forkjoin-036
    difficulty: advanced
    tags: [amdahl, overhead]
    question: |
      Real measured parallel speedup often falls SHORT of the Amdahl's law ceiling. Why, and can speedup ever be negative (slower than sequential)?
    options:
      - "Measured speedup always exactly matches Amdahl; it can never be negative"
      - "Speedup falls short only because of Java's garbage collector, nothing else"
      - "Negative speedup is impossible on modern CPUs"
      - "Coordination overhead (splitting, merging, scheduling, cache-coherency, memory bandwidth) is not modeled by basic Amdahl, and for small/cheap workloads this overhead can make parallel SLOWER than sequential"
    answer: 3
    explanation: |
      Basic Amdahl's law ignores the real costs of parallelization: task splitting/merging, thread scheduling, synchronization, cache-coherency traffic, and finite memory bandwidth. These push measured speedup below the ideal ceiling, and for small N or trivial per-element work they can make parallel execution slower than sequential (net negative). GC is only one possible contributor.
    ref: "concepts.md#amdahls-law-and-diminishing-returns"

  - id: parallelism-parallel-streams-forkjoin-037
    difficulty: advanced
    tags: [measuring, memory-bandwidth]
    question: |
      A simple operation (e.g. multiply each element by 2) over a huge array shows almost no speedup when parallelized across 8 cores. The most likely reason is:
    options:
      - "The JIT refuses to compile parallel code"
      - "Arrays cannot be processed in parallel"
      - "Parallel streams cap at 2 threads for arrays"
      - "The workload is memory-bandwidth-bound: all cores compete for the same limited RAM bandwidth, so adding cores doesn't help"
    answer: 3
    explanation: |
      When per-element compute is trivial, the bottleneck shifts to memory bandwidth — cores stall waiting on RAM rather than doing arithmetic, so throughput saturates regardless of core count. This is a classic reason parallelism disappoints. Arrays parallelize fine and there is no 2-thread cap.
    ref: "concepts.md#measuring-before-parallelizing"

  - id: parallelism-parallel-streams-forkjoin-038
    difficulty: advanced
    tags: [forkjoin, managedblocker]
    question: |
      If you must perform a blocking operation inside a Fork/Join task without permanently starving the pool, the intended mechanism is:
    options:
      - "Thread.sleep in a loop until data arrives"
      - "Calling System.gc() to free a worker"
      - "Setting the task priority to MAX_PRIORITY"
      - "ForkJoinPool.ManagedBlocker, which signals a managed block so the pool can spawn a compensation thread to maintain parallelism"
    answer: 3
    explanation: |
      ManagedBlocker lets a Fork/Join task declare that it is about to block; the pool can then start a compensating worker so target parallelism is preserved and the pool doesn't stall. Plain Thread.sleep, System.gc, or thread priority do nothing to prevent worker starvation.
    ref: "concepts.md#the-fork-join-framework"

  - id: parallelism-parallel-streams-forkjoin-039
    difficulty: advanced
    tags: [parallel-streams, boxing, code-analysis]
    question: |
      Which pipeline is the most efficient way to compute the sum of squares of 1..N in parallel?
    options:
      - "IntStream.rangeClosed(1, N).parallel().map(i -> i * i).sum()"
      - "Stream.iterate(1, i -> i + 1).limit(N).parallel().mapToInt(i -> i * i).sum()"
      - "IntStream.rangeClosed(1, N).boxed().parallel().reduce(0, (a, b) -> a + b * b)"
      - "IntStream.rangeClosed(1, N).parallel().mapToObj(Integer::valueOf).mapToInt(i -> i * i).sum()"
    answer: 0
    explanation: |
      Option 0 stays primitive throughout (no boxing) and rangeClosed is SIZED/SUBSIZED so it splits perfectly. Option 1 uses Stream.iterate which is unsized and splits poorly, plus limit adds ordering cost. Option 2 boxes to Integer and reduce with b*b is confusing/incorrect semantics. Option 3 needlessly boxes then unboxes. Primitive, splittable, stateless = fastest.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-040
    difficulty: advanced
    tags: [completablefuture, executor]
    question: |
      By default (no executor argument), CompletableFuture.supplyAsync(...) runs the supplier on which pool, and why is passing your own executor recommended for blocking IO?
    options:
      - "On a new thread each time; passing an executor is purely cosmetic"
      - "On the main thread; an executor makes it asynchronous"
      - "On the GC thread; an executor changes priority"
      - "On the common ForkJoinPool; a dedicated sized executor avoids starving the shared common pool with blocking IO"
    answer: 3
    explanation: |
      Without an explicit Executor, supplyAsync uses ForkJoinPool.commonPool(). Since the common pool is shared and sized for CPU work, running blocking IO there can starve parallel streams and other CF tasks — so you supply a dedicated, appropriately sized executor for blocking workloads.
    ref: "concepts.md#choosing-between-parallel-streams-completablefuture-and-virtual-threads"

  - id: parallelism-parallel-streams-forkjoin-041
    difficulty: advanced
    tags: [parallel-streams, nq-heuristic]
    question: |
      The "NQ" heuristic for deciding whether to parallelize a stream says parallelism pays off when:
    options:
      - "N (number of cores) exceeds Q (queue depth)"
      - "N is prime and Q is even"
      - "N equals Q exactly"
      - "N (number of elements) times Q (cost per element) is large — big data and/or expensive per-element work"
    answer: 3
    explanation: |
      The NQ model (popularized by Brian Goetz) says parallelism helps when N × Q is large, where N is element count and Q is the per-element work. Small N or trivial Q means overhead dominates and you should stay sequential. The other options invent unrelated definitions.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-042
    difficulty: expert
    tags: [forkjoin, code-analysis, common-pool]
    question: |
      On a machine reporting 8 processors, with no system properties set, what is the target parallelism of ForkJoinPool.commonPool().getParallelism(), and how many additional threads does the SUBMITTING external thread contribute when it calls invoke()?
    options:
      - "8, and the submitter adds nothing"
      - "16, matching hyper-threads"
      - "1, because the common pool is single-threaded by default"
      - "7, and the submitting thread can also help execute, so effective parallelism reaches ~8"
    answer: 3
    explanation: |
      Common-pool parallelism defaults to availableProcessors() - 1 = 7 on an 8-core box. The external thread that calls invoke()/join() can participate in executing tasks, so effective concurrency reaches about 8. It is neither single-threaded nor sized to hyper-thread counts by default.
    ref: "concepts.md#the-fork-join-framework"

  - id: parallelism-parallel-streams-forkjoin-043
    difficulty: expert
    tags: [parallel-streams, code-analysis, ordering]
    question: |
      What can you say about the output of this code?

      ```java
      List<Integer> out = Collections.synchronizedList(new ArrayList<>());
      IntStream.range(0, 8).parallel().forEach(out::add);
      System.out.println(out);
      ```
    options:
      - "It always prints [0, 1, 2, 3, 4, 5, 6, 7] in order"
      - "It throws ConcurrentModificationException"
      - "It fails to compile"
      - "It is thread-safe (no corruption) but the ORDER of elements is nondeterministic across runs"
    answer: 3
    explanation: |
      A synchronized list makes each add() thread-safe, so there is no corruption or lost update (unlike a plain ArrayList). However, forEach on a parallel stream gives no encounter-order guarantee, so the insertion order — and thus the printed order — varies run to run. The lock also serializes writes, defeating much of the parallelism. To keep order and safety you'd use a collector or forEachOrdered.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-044
    difficulty: expert
    tags: [reduce, combiner, code-analysis]
    question: |
      For the 3-argument reduce (identity, accumulator, combiner) on a parallel stream, which constraint must hold to get correct, deterministic results?
    options:
      - "The accumulator must be commutative but the combiner is ignored in parallel"
      - "identity must be null"
      - "The accumulator must mutate the identity in place"
      - "combiner.apply(identity, u) must equal u, and the combiner must be associative and consistent with the accumulator"
    answer: 3
    explanation: |
      The contract requires the identity to be a true identity (combiner.apply(identity, u) == u), and the accumulator and combiner must be associative and mutually consistent (combining partial results equals sequentially accumulating). Violating these yields wrong/nondeterministic parallel results. The combiner is essential in parallel (it merges sub-results); the accumulator in the standard reduce should not mutate the identity — that's what mutable reduction/collect is for.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-045
    difficulty: expert
    tags: [forkjoin, invokeAll, code-analysis]
    question: |
      Inside a RecursiveAction, you split into subtasks a, b, c. Which is the cleanest, correct way to run them and wait?
    options:
      - "a.compute(); b.compute(); c.compute(); // sequential, no parallelism"
      - "invokeAll(a, b, c); // forks all but the last, runs one in current thread, and joins all"
      - "a.fork(); b.fork(); c.fork(); return; // never joined, results may be incomplete"
      - "new Thread(a).start(); new Thread(b).start(); new Thread(c).start();"
    answer: 1
    explanation: |
      ForkJoinTask.invokeAll(...) is the convenient primitive: it forks all tasks except one, executes one in the current thread, then joins them all — correct and efficient. Option 0 is purely sequential; option 2 forks without ever joining, so the parent may complete before children finish; option 3 abandons the pool entirely and creates raw OS threads, defeating work-stealing.
    ref: "concepts.md#the-fork-join-framework"

  - id: parallelism-parallel-streams-forkjoin-046
    difficulty: expert
    tags: [parallel-streams, stream-iterate, version]
    question: |
      Historically, Stream.iterate parallelized poorly because it was unsized and hard to split. Which Java version added the 3-argument Stream.iterate (seed, hasNext predicate, next) that behaves like a bounded for-loop?
    options:
      - "Java 8"
      - "Java 11"
      - "Java 17"
      - "Java 9"
    answer: 3
    explanation: |
      The bounded, predicate-terminated Stream.iterate(seed, hasNext, next) overload was added in Java 9. The original 2-arg Stream.iterate from Java 8 is infinite and unsized, which is why it splits badly for parallel streams. Even the 3-arg form is still sequential-natured for splitting, but the overload itself dates to Java 9.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-047
    difficulty: expert
    tags: [completablefuture, thenapply, thenapplyasync, code-analysis]
    question: |
      Given `cf.thenApply(fn)` vs `cf.thenApplyAsync(fn)` where cf completed on the common pool, which thread typically runs fn?
    options:
      - "Both always run fn on a brand-new thread"
      - "thenApply blocks the main thread until fn completes on the GC thread"
      - "There is no difference; Async is deprecated"
      - "thenApply may run fn on the thread that completed cf (or the caller if already complete); thenApplyAsync submits fn to run asynchronously on a pool (common pool or a supplied executor)"
    answer: 3
    explanation: |
      thenApply runs the function in the thread that completed the previous stage, or in the calling thread if the stage was already complete — no guaranteed hand-off. thenApplyAsync always schedules the function to run asynchronously on the common pool (or the executor you pass), which matters for controlling where work runs and avoiding blocking a completing thread. Neither guarantees a new thread nor is Async deprecated.
    ref: "concepts.md#choosing-between-parallel-streams-completablefuture-and-virtual-threads"

  - id: parallelism-parallel-streams-forkjoin-048
    difficulty: expert
    tags: [gustafson, amdahl, scaling]
    question: |
      How does Gustafson's law reframe scaling relative to Amdahl's law?
    options:
      - "It proves Amdahl's law is wrong and speedup is always linear"
      - "It states that adding cores always halves runtime"
      - "It only applies to single-threaded programs"
      - "It observes that as problem size grows the parallel fraction tends to grow too, so larger workloads scale more favorably than Amdahl's fixed-size assumption suggests"
    answer: 3
    explanation: |
      Amdahl assumes a fixed problem size, so the serial fraction caps speedup. Gustafson notes that in practice bigger machines are used to solve bigger problems, and the parallelizable portion scales with problem size, yielding better-than-Amdahl scaling for scaled workloads. It doesn't claim linear speedup for fixed problems or disprove Amdahl.
    ref: "concepts.md#amdahls-law-and-diminishing-returns"

  - id: parallelism-parallel-streams-forkjoin-049
    difficulty: expert
    tags: [parallel-streams, code-analysis, boxing, distinct]
    question: |
      Rank the parallelization friendliness (best to worst) of these three pipeline shapes over N elements:
      (I) IntStream.range(0,N).parallel().filter(...).sum()
      (II) list.parallelStream().distinct().sorted().collect(toList())
      (III) Stream.iterate(0, i->i+1).limit(N).parallel().sum()
    options:
      - "I best, II worst, III middle"
      - "II best, I middle, III worst"
      - "III best, I middle, II worst"
      - "I best, III middle, II worst"
    answer: 3
    explanation: |
      (I) is primitive, SIZED/SUBSIZED, stateless — best. (II) chains two stateful barrier ops (distinct then sorted) requiring buffering/merging — heavy, worst here. (III) uses Stream.iterate (unsized, poor split) plus limit (ordered, costly) — bad but arguably still processes a numeric sum; between I and II. So I best, III middle, II worst.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-050
    difficulty: expert
    tags: [common-pool, system-property, code-analysis]
    question: |
      Which system property, set at JVM startup, changes the number of worker threads in the common ForkJoinPool used by parallel streams?
    options:
      - "-Djava.util.stream.parallelism=N"
      - "-Xss:forkjoin=N"
      - "-Dforkjoin.pool.size=N"
      - "-Djava.util.concurrent.ForkJoinPool.common.parallelism=N"
    answer: 3
    explanation: |
      The documented property is java.util.concurrent.ForkJoinPool.common.parallelism. Setting it (before the pool is first used) changes common-pool sizing globally — a blunt, JVM-wide lever, which is why per-workload isolation via a dedicated ForkJoinPool is often preferred. The other property names are fabricated.
    ref: "concepts.md#the-fork-join-framework"

  - id: parallelism-parallel-streams-forkjoin-051
    difficulty: intermediate
    tags: [parallel-streams, sequential]
    question: |
      What does calling .sequential() after .parallel() on the same stream pipeline do?
    options:
      - "Throws IllegalStateException because you cannot switch modes"
      - "Runs the first half in parallel and the second half sequentially"
      - "Silently does nothing; parallel() is permanent"
      - "The last call wins — the pipeline's execution mode is determined by the final parallel()/sequential() call before the terminal operation"
    answer: 3
    explanation: |
      A stream has a single execution mode determined by the last parallel()/sequential() call before the terminal operation; the whole pipeline then runs in that mode. It is not per-stage, does not throw, and parallel() is not permanent.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-052
    difficulty: intermediate
    tags: [countedcompleter, version]
    question: |
      CountedCompleter, a Fork/Join task type that triggers a completion action when its pending count reaches zero, was added in which release?
    options:
      - "Java 7 alongside RecursiveTask"
      - "Java 8"
      - "Java 11"
      - "Java 17"
    answer: 1
    explanation: |
      CountedCompleter was introduced in Java 8 (used internally by the streams implementation for efficient completion-based combining). RecursiveTask/RecursiveAction came with the original Fork/Join in Java 7, but CountedCompleter is a Java 8 addition.
    ref: "concepts.md#the-fork-join-framework"

  - id: parallelism-parallel-streams-forkjoin-053
    difficulty: advanced
    tags: [parallel-streams, side-effects, code-analysis]
    question: |
      What is the primary correctness problem with using a captured mutable counter like this?

      ```java
      int[] count = {0};
      list.parallelStream().forEach(x -> count[0]++);
      ```
    options:
      - "count[0]++ is not compile-legal in a lambda"
      - "count[0]++ is a non-atomic read-modify-write executed by multiple threads, so updates are lost and the final count is unreliable"
      - "It always produces the correct count because arrays are thread-safe"
      - "It deadlocks on the common pool"
    answer: 1
    explanation: |
      count[0]++ is a read-modify-write with no synchronization; concurrent worker threads interleave and lose updates, so the final value is typically less than the element count and varies run to run. Using an array to sidestep the effectively-final rule compiles fine but does not make it thread-safe. Correct approaches: a reduction/count() or an AtomicInteger/LongAdder.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-054
    difficulty: advanced
    tags: [choosing, io-bound, virtual-threads]
    question: |
      You need to fan out 50,000 concurrent HTTP requests, each mostly waiting on the network. In JDK 21 the most scalable choice is:
    options:
      - "A parallel stream over the 50,000 URLs on the common pool"
      - "One virtual thread per request (e.g. Executors.newVirtualThreadPerTaskExecutor()), since blocking is cheap and they unmount their carrier while waiting"
      - "A fixed platform-thread pool of size = cores, blocking on each request"
      - "A single RecursiveTask that loops over all URLs sequentially"
    answer: 1
    explanation: |
      This is massively concurrent blocking IO — the sweet spot for virtual threads (final in JDK 21): a virtual thread per task, cheap to block, unmounting its carrier during the wait, scaling to tens of thousands. A parallel stream would clog the shared common pool; a core-sized platform pool bottlenecks at core count; a sequential RecursiveTask has no concurrency at all.
    ref: "concepts.md#choosing-between-parallel-streams-completablefuture-and-virtual-threads"

  - id: parallelism-parallel-streams-forkjoin-055
    difficulty: intermediate
    tags: [arrays, parallelsort, stability]
    question: |
      Which statement about Arrays.parallelSort is correct?
    options:
      - "It guarantees a stable sort for primitive arrays"
      - "It uses the common ForkJoinPool and, for object arrays, is stable; primitive sorts are not stable (same as Arrays.sort semantics)"
      - "It is always faster than Arrays.sort for any array size"
      - "It sorts in descending order by default"
    answer: 1
    explanation: |
      parallelSort runs on the common ForkJoinPool; like Arrays.sort, the object overload is stable while primitive sorts have no stability concept. It is only faster for sufficiently large arrays (above the ~8192 threshold) on multicore hardware — for small arrays it just does the sequential sort. It sorts ascending, not descending.
    ref: "concepts.md#arrays-parallelsort-and-parallelprefix"

  - id: parallelism-parallel-streams-forkjoin-056
    difficulty: expert
    tags: [parallel-streams, findany, code-analysis, ordering]
    question: |
      For an ORDERED parallel stream, which pair of results is guaranteed deterministic across runs?
    options:
      - "findAny() and forEach()"
      - "findFirst() and forEachOrdered()"
      - "findAny() and forEachOrdered()"
      - "peek() ordering and findAny()"
    answer: 1
    explanation: |
      On an ordered stream, findFirst() must return the encounter-order-first match (deterministic) and forEachOrdered() processes in encounter order (deterministic sequence of side effects). findAny() and forEach() explicitly relax ordering, so their results/observation order are nondeterministic in parallel. peek() ordering is likewise unspecified in parallel.
    ref: "concepts.md#parallel-streams"

  - id: parallelism-parallel-streams-forkjoin-057
    difficulty: advanced
    tags: [choosing, cpu-bound, decision]
    question: |
      Which scenario is the BEST fit for a parallel stream (rather than CompletableFuture or virtual threads)?
    options:
      - "Aggregating/transforming a large in-memory array of 50 million doubles with CPU-heavy math per element"
      - "Issuing thousands of concurrent database queries that block on IO"
      - "Orchestrating three heterogeneous async service calls and combining them"
      - "Running one long-lived background polling loop"
    answer: 0
    explanation: |
      Parallel streams excel at CPU-bound data parallelism over a large, splittable in-memory dataset — exactly option 0. Blocking IO fan-out suits virtual threads; composing a few heterogeneous async calls suits CompletableFuture; a single background loop needs neither data parallelism nor the stream API.
    ref: "concepts.md#choosing-between-parallel-streams-completablefuture-and-virtual-threads"

  - id: parallelism-parallel-streams-forkjoin-058
    difficulty: expert
    tags: [forkjoin, deque, work-stealing, rationale]
    question: |
      Why does a Fork/Join worker take from the HEAD of its OWN deque but a thief take from the TAIL of a VICTIM's deque?
    options:
      - "To randomize execution order for security"
      - "Owner uses the head (LIFO) for cache locality and to run the smallest/newest task first; the thief uses the tail (oldest/largest task) to reduce contention with the owner and steal fewer, bigger chunks"
      - "It is arbitrary and has no performance rationale"
      - "Because the head is thread-safe and the tail is not"
    answer: 1
    explanation: |
      Owner LIFO access to the head gives cache locality (recently created data is hot) and prefers the newest, typically smallest subtask. Thieves take from the opposite end (the tail) so they touch the oldest, usually largest task — which yields more work per steal and minimizes contention with the owner, who is working the other end of the deque. It is a deliberate design, not arbitrary or a thread-safety artifact of a single end.
    ref: "concepts.md#the-fork-join-framework"

  - id: parallelism-parallel-streams-forkjoin-059
    difficulty: beginner
    tags: [data-parallelism, task-parallelism, mapping]
    question: |
      Match the tool to the parallelism style: which is the classic pairing?
    options:
      - "Parallel streams → task parallelism; CompletableFuture → data parallelism"
      - "Parallel streams / Fork/Join → data parallelism; CompletableFuture / executors → task parallelism"
      - "Both are only for task parallelism"
      - "Both are only for data parallelism"
    answer: 1
    explanation: |
      Data parallelism (same op over many data pieces) maps to parallel streams and Fork/Join; task parallelism (different operations at once) maps to CompletableFuture and executors (and virtual threads for blocking tasks). Option 0 swaps them.
    ref: "concepts.md#data-parallelism-versus-task-parallelism"

  - id: parallelism-parallel-streams-forkjoin-060
    difficulty: intermediate
    tags: [measuring, common-pool, production]
    question: |
      A parallel stream benchmarks beautifully in isolation but regresses under production load. What is the most likely explanation tied to this topic?
    options:
      - "The JIT is disabled in production"
      - "In production many callers share the single common ForkJoinPool, so contention for its limited workers erases the isolated-benchmark gains"
      - "Parallel streams only work in benchmarks"
      - "Production JVMs cap streams to one thread"
    answer: 1
    explanation: |
      An isolated microbenchmark has the whole common pool to itself; in production, concurrent requests and library code all compete for the same shared common pool, so real available parallelism per stream drops and gains vanish (or turn into slowdowns). This is why you measure under representative load and consider isolating heavy work in a dedicated pool.
    ref: "concepts.md#measuring-before-parallelizing"
