topic: "JVM Memory Model: Heap versus Stack"
domain: java-jvm
topic_slug: heap-vs-stack-memory
version: 1
questions:
  - id: heap-vs-stack-memory-001
    difficulty: beginner
    tags: [heap, stack, basics]
    question: |
      Which JVM runtime region is shared by all threads and managed by the
      garbage collector?
    options:
      - "The heap"
      - "The JVM (Java) stack"
      - "The PC register"
      - "The native method stack"
    answer: 0
    explanation: |
      The heap is a single, process-wide region shared by all threads; every
      object and array lives there and it is reclaimed by the garbage collector.
      JVM stacks, PC registers, and native method stacks are all per-thread
      structures reclaimed automatically as methods return, not by the GC.
    ref: "concepts.md#heap-versus-stack-overview"
  - id: heap-vs-stack-memory-002
    difficulty: beginner
    tags: [stack, per-thread, frames]
    question: |
      How many JVM stacks exist in a running JVM?
    options:
      - "Exactly one, shared by all threads"
      - "One per CPU core"
      - "One per thread"
      - "One per loaded class"
    answer: 2
    explanation: |
      Each thread gets its own JVM stack, which holds that thread's chain of
      method frames. This is why the stack is inherently thread-confined and
      needs no synchronization. The heap and Metaspace are shared; stacks and
      PC registers are per-thread.
    ref: "concepts.md#heap-versus-stack-overview"
  - id: heap-vs-stack-memory-003
    difficulty: beginner
    tags: [error, stackoverflow, recursion]
    question: |
      Uncontrolled infinite recursion (no base case) on a normal platform thread
      most directly causes which throwable?
    options:
      - "OutOfMemoryError: Java heap space"
      - "OutOfMemoryError: Metaspace"
      - "IllegalStateException"
      - "StackOverflowError"
    answer: 3
    explanation: |
      Each call pushes a frame; when the thread's stack cannot allocate another
      frame the JVM throws StackOverflowError (a VirtualMachineError). It is not
      an OutOfMemoryError — that is a separate sibling error about region
      exhaustion (heap, Metaspace, etc.).
    ref: "concepts.md#stack-frames-and-stackoverflowerror"
  - id: heap-vs-stack-memory-004
    difficulty: beginner
    tags: [metaspace, permgen, versions]
    question: |
      In which Java release was PermGen removed and replaced by Metaspace?
    options:
      - "Java 6"
      - "Java 8"
      - "Java 7"
      - "Java 11"
    answer: 1
    explanation: |
      Java 8 (2014), via JEP 122, removed the permanent generation and
      introduced Metaspace, which stores class metadata in native memory. Java 7
      had already moved the string pool out of PermGen onto the heap, but PermGen
      itself was not removed until Java 8.
    ref: "concepts.md#metaspace"
  - id: heap-vs-stack-memory-005
    difficulty: beginner
    tags: [flags, xmx, heap]
    question: |
      Which JVM flag sets the maximum heap size?
    options:
      - "-Xmx"
      - "-Xss"
      - "-XX:MaxMetaspaceSize"
      - "-XX:MaxDirectMemorySize"
    answer: 0
    explanation: |
      -Xmx sets the maximum heap size (e.g. -Xmx4g). -Xms sets the initial heap.
      -Xss sizes each thread's stack, -XX:MaxMetaspaceSize caps Metaspace, and
      -XX:MaxDirectMemorySize caps off-heap direct buffers — none of which are
      bounded by -Xmx.
    ref: "concepts.md#heap-and-stack-tuning-flags"
  - id: heap-vs-stack-memory-006
    difficulty: beginner
    tags: [young-gen, eden, allocation]
    question: |
      In a generational HotSpot heap, where are almost all brand-new objects
      initially allocated?
    options:
      - "A survivor space"
      - "The old (tenured) generation"
      - "Eden space in the young generation"
      - "Metaspace"
    answer: 2
    explanation: |
      New objects are allocated in Eden (the young generation). Survivor spaces
      hold objects that survived at least one minor GC; the old generation holds
      objects promoted after aging; Metaspace holds class metadata, not
      application objects.
    ref: "concepts.md#young-generation-eden-and-survivor-spaces"
  - id: heap-vs-stack-memory-007
    difficulty: beginner
    tags: [references, primitives, basics]
    question: |
      A local variable declared as `String s = new String("hi");`. Where does the
      variable `s` itself (the reference) live, and where does the String object
      live?
    options:
      - "Both on the heap"
      - "Both on the stack"
      - "The reference in Metaspace; the object on the stack"
      - "The reference `s` on the stack frame; the String object on the heap"
    answer: 3
    explanation: |
      A local variable's slot lives in the current method's frame on the stack;
      it holds a reference value. The String object it points to is allocated on
      the heap. When the method returns, the slot vanishes but the object remains
      until it becomes unreachable and is collected.
    ref: "concepts.md#what-lives-where-primitives-versus-references"
  - id: heap-vs-stack-memory-008
    difficulty: beginner
    tags: [metaspace, class-metadata]
    question: |
      What does Metaspace primarily store?
    options:
      - "All application objects and arrays"
      - "Class metadata such as method bytecode and field/method structures"
      - "Each thread's local variables"
      - "Direct NIO byte buffers"
    answer: 1
    explanation: |
      Metaspace holds the runtime representation of loaded classes: field and
      method structures, method bytecode, the runtime constant pool, and
      annotations. Application objects live on the heap; local variables live on
      thread stacks; direct buffers are separate native off-heap memory.
    ref: "concepts.md#metaspace"
  - id: heap-vs-stack-memory-009
    difficulty: beginner
    tags: [flags, xss, stack]
    question: |
      Which flag controls the per-thread stack size?
    options:
      - "-Xss"
      - "-Xmn"
      - "-Xms"
      - "-XX:NewRatio"
    answer: 0
    explanation: |
      -Xss sets each thread's stack size (e.g. -Xss1m), trading recursion depth
      against how many threads fit. -Xmn sets young-gen size, -Xms sets initial
      heap, and -XX:NewRatio sets the old:young ratio.
    ref: "concepts.md#heap-and-stack-tuning-flags"
  - id: heap-vs-stack-memory-010
    difficulty: beginner
    tags: [string-pool, location, versions]
    question: |
      On a modern JVM (Java 7 and later), where do the pooled String objects of
      the string pool reside?
    options:
      - "In PermGen"
      - "In Metaspace"
      - "On the Java heap"
      - "On the current thread's stack"
    answer: 2
    explanation: |
      Java 7 moved the string pool out of PermGen onto the main Java heap, where
      it can be garbage collected and grows with the heap. In Java 8+ PermGen is
      gone entirely and the pool remains on the heap; Metaspace holds class
      metadata, not pooled strings.
    ref: "concepts.md#the-string-pool-location"
  - id: heap-vs-stack-memory-011
    difficulty: beginner
    tags: [gc, generational, hypothesis]
    question: |
      What assumption underlies splitting the heap into young and old
      generations?
    options:
      - "Most objects are large arrays"
      - "Most objects live forever"
      - "Objects are never shared between threads"
      - "Most objects die young"
    answer: 3
    explanation: |
      The weak generational hypothesis states that most objects die young.
      Generational GCs exploit this by collecting the small young generation
      frequently and cheaply, reclaiming the bulk of garbage without scanning the
      whole heap.
    ref: "concepts.md#young-generation-eden-and-survivor-spaces"
  - id: heap-vs-stack-memory-012
    difficulty: beginner
    tags: [error, oome, heap]
    question: |
      Filling the heap with reachable objects until no allocation can succeed
      produces which error?
    options:
      - "StackOverflowError"
      - "OutOfMemoryError: Java heap space"
      - "OutOfMemoryError: Metaspace"
      - "OutOfMemoryError: Direct buffer memory"
    answer: 1
    explanation: |
      Exhausting the heap with live objects yields OutOfMemoryError: Java heap
      space. Metaspace and Direct buffer memory OOMEs concern class metadata and
      off-heap buffers respectively; StackOverflowError concerns per-thread stack
      depth.
    ref: "concepts.md#outofmemoryerror-kinds"
  - id: heap-vs-stack-memory-013
    difficulty: intermediate
    tags: [instance-fields, primitives, heap]
    question: |
      Given `class Counter { int value; }` and `Counter c = new Counter();`
      inside a method, where does the `int value` field physically live?
    options:
      - "Inside the Counter object on the heap"
      - "On the method's stack frame because it is a primitive"
      - "In Metaspace with the class definition"
      - "In the string pool"
    answer: 0
    explanation: |
      The rule 'primitives on the stack' applies only to LOCAL primitives. A
      primitive instance field is stored inside its owning object, which is on
      the heap. Metaspace stores the class's metadata (that a field named value
      of type int exists), not the per-instance value.
    ref: "concepts.md#what-lives-where-primitives-versus-references"
  - id: heap-vs-stack-memory-014
    difficulty: intermediate
    tags: [frames, jvms, structure]
    question: |
      According to the JVM specification, which three components make up a stack
      frame?
    options:
      - "Heap, Metaspace, and PC register"
      - "Eden, survivor, and old generation pointers"
      - "Local variable array, operand stack, and reference to the run-time constant pool"
      - "TLAB, card table, and remembered set"
    answer: 2
    explanation: |
      Per JVMS §2.6, each frame contains a local variable array (arguments and
      locals, including `this`), an operand stack (scratch space for bytecode
      computation), and a reference to the run-time constant pool of the current
      method's class. The other options mix in unrelated heap/GC structures.
    ref: "concepts.md#stack-frames-and-stackoverflowerror"
  - id: heap-vs-stack-memory-015
    difficulty: intermediate
    tags: [pass-by-value, references, semantics]
    question: |
      What does this print?

      ```java
      static void reassign(StringBuilder sb) { sb = new StringBuilder("new"); }
      public static void main(String[] a) {
          StringBuilder s = new StringBuilder("orig");
          reassign(s);
          System.out.println(s);
      }
      ```
    options:
      - "new"
      - "null"
      - "It does not compile"
      - "orig"
    answer: 3
    explanation: |
      Java is pass-by-value; the reference value is copied into the parameter.
      Reassigning the parameter `sb` only rebinds the local copy, leaving the
      caller's `s` pointing at the original builder. So it prints "orig". Had the
      method called sb.append(...), the mutation WOULD be visible.
    ref: "concepts.md#what-lives-where-primitives-versus-references"
  - id: heap-vs-stack-memory-016
    difficulty: intermediate
    tags: [survivor, tenuring, promotion]
    question: |
      In HotSpot's young generation, what is the role of the two survivor spaces
      during a minor GC?
    options:
      - "Both always hold live objects simultaneously to double throughput"
      - "One is always empty; live objects are copied into it, then the roles swap"
      - "They store class metadata evacuated from Metaspace"
      - "They hold humongous objects too large for Eden"
    answer: 1
    explanation: |
      Survivor spaces are used as a copying collector's to/from pair: at any time
      one is empty. A minor GC copies live objects from Eden and the occupied
      survivor into the empty one, then swaps their roles. This compacts survivors
      and increments their age for tenuring decisions.
    ref: "concepts.md#young-generation-eden-and-survivor-spaces"
  - id: heap-vs-stack-memory-017
    difficulty: intermediate
    tags: [tlab, allocation, concurrency]
    question: |
      Why do JVMs give each thread a Thread-Local Allocation Buffer (TLAB)?
    options:
      - "To allow lock-free bump-pointer allocation without synchronizing on a shared pointer"
      - "To give each thread a private heap that the GC never scans"
      - "To store the thread's local variables off the stack"
      - "To cache interned strings per thread"
    answer: 0
    explanation: |
      A TLAB is a private slice of Eden so a thread can allocate by simply bumping
      a pointer without locking. Only when a TLAB fills does the thread take the
      slow, synchronized path to grab a new one. TLABs are still part of the
      shared, GC-scanned heap — not a private heap or a place for locals/strings.
    ref: "concepts.md#escape-analysis-and-tlab"
  - id: heap-vs-stack-memory-018
    difficulty: intermediate
    tags: [string-pool, intern, equality]
    question: |
      What does this print?

      ```java
      String a = "hi";
      String c = new String("hi");
      System.out.println((a == c) + " " + (a == c.intern()));
      ```
    options:
      - "true true"
      - "false false"
      - "false true"
      - "true false"
    answer: 2
    explanation: |
      `a` refers to the pooled literal; `new String("hi")` creates a distinct heap
      object, so a == c is false. c.intern() returns the canonical pooled instance,
      which is the same object as `a`, so a == c.intern() is true. Output:
      "false true".
    ref: "concepts.md#the-string-pool-location"
  - id: heap-vs-stack-memory-019
    difficulty: intermediate
    tags: [oome, threads, native]
    question: |
      A server crashes with `OutOfMemoryError: unable to create new native
      thread` even though heap usage is low. What is the most likely cause?
    options:
      - "The heap (-Xmx) is too small"
      - "The string pool is full"
      - "A recursive method has no base case"
      - "Too many threads are being created; native memory for thread stacks is exhausted"
    answer: 3
    explanation: |
      Thread stacks are allocated from native memory, not the Java heap, so this
      OOME appears when too many threads are created regardless of heap usage.
      Note it is NOT StackOverflowError (that is deep recursion on one thread).
      Reducing -Xss or the thread count, or using virtual threads, addresses it.
    ref: "concepts.md#outofmemoryerror-kinds"
  - id: heap-vs-stack-memory-020
    difficulty: intermediate
    tags: [xms, xmx, tuning]
    question: |
      Why do latency-sensitive server operators frequently set `-Xms` equal to
      `-Xmx`?
    options:
      - "It disables garbage collection entirely"
      - "It pre-allocates the whole heap up front, avoiding runtime heap resizing pauses and fragmentation"
      - "It converts the heap into off-heap memory"
      - "It forces all objects into the old generation"
    answer: 1
    explanation: |
      Equal -Xms and -Xmx commit the full heap at startup so the JVM never pauses
      to grow/shrink the heap or suffers resize-related fragmentation during
      steady state. It does not disable GC, change heap location, or affect object
      promotion policy.
    ref: "concepts.md#heap-and-stack-tuning-flags"
  - id: heap-vs-stack-memory-021
    difficulty: intermediate
    tags: [metaspace, permgen, comparison]
    question: |
      Compared with the old PermGen, a key difference of Metaspace is that by
      default it:
    options:
      - "Resides in native memory and is unbounded (grows to the native limit) unless capped"
      - "Lives inside the Java heap with a small fixed maximum"
      - "Cannot be garbage collected at all"
      - "Stores the string pool"
    answer: 0
    explanation: |
      Metaspace lives in native memory and, by default, has no fixed cap — it
      grows to the available native memory limit unless you set
      -XX:MaxMetaspaceSize. PermGen was inside the heap with a small fixed max,
      causing frequent PermGen OOMEs. The string pool moved to the heap in Java 7.
    ref: "concepts.md#metaspace"
  - id: heap-vs-stack-memory-022
    difficulty: intermediate
    tags: [error-hierarchy, stackoverflow, oome]
    question: |
      In the Java exception hierarchy, StackOverflowError and OutOfMemoryError
      are both:
    options:
      - "Checked exceptions extending Exception"
      - "Subclasses of RuntimeException"
      - "Subclasses of VirtualMachineError (and thus Error)"
      - "The same class with different messages"
    answer: 2
    explanation: |
      Both are subclasses of VirtualMachineError, which extends Error. They are
      unchecked and generally not meant to be caught and recovered from. They are
      distinct classes: StackOverflowError is about stack depth; OutOfMemoryError
      is about region exhaustion.
    ref: "concepts.md#outofmemoryerror-kinds"
  - id: heap-vs-stack-memory-023
    difficulty: intermediate
    tags: [g1, regions, default, versions]
    question: |
      G1 became the default collector in JDK 9. How does it organize the heap
      relative to the classic fixed young/old layout?
    options:
      - "It abolishes generations entirely"
      - "It stores the young generation in Metaspace"
      - "It uses one contiguous space with no generational concept"
      - "It divides the heap into equal-size regions dynamically tagged Eden, Survivor, Old, or Humongous"
    answer: 3
    explanation: |
      G1 (default since JDK 9, JEP 248) keeps the generational concept logically
      but replaces fixed contiguous spaces with equal-size regions dynamically
      labeled as Eden, Survivor, Old, or Humongous. It does not abolish
      generations or move young gen into Metaspace.
    ref: "concepts.md#young-generation-eden-and-survivor-spaces"
  - id: heap-vs-stack-memory-024
    difficulty: intermediate
    tags: [direct-buffer, off-heap, oome]
    question: |
      An application using `ByteBuffer.allocateDirect(...)` heavily fails with
      `OutOfMemoryError: Direct buffer memory` while heap usage stays modest. What
      is true?
    options:
      - "Direct buffers are allocated on the heap, so increasing -Xmx fixes it"
      - "Direct buffers use native off-heap memory bounded by -XX:MaxDirectMemorySize"
      - "This is actually a StackOverflowError"
      - "Direct buffers are stored in Metaspace"
    answer: 1
    explanation: |
      allocateDirect uses native off-heap memory that is freed via a Cleaner tied
      to the buffer's garbage collection, and is bounded by
      -XX:MaxDirectMemorySize. So the heap can stay small while direct memory is
      exhausted; increasing -Xmx does not help.
    ref: "concepts.md#outofmemoryerror-kinds"
  - id: heap-vs-stack-memory-025
    difficulty: intermediate
    tags: [static-fields, heap, versions]
    question: |
      Since Java 8, where are a class's static field values stored?
    options:
      - "On the Java heap (in the java.lang.Class mirror)"
      - "In PermGen"
      - "On each thread's stack"
      - "In the compressed class space"
    answer: 0
    explanation: |
      Since Java 8 removed PermGen, static field values live on the heap,
      associated with the class's java.lang.Class object. Metaspace holds the
      class metadata (that the static exists), not its runtime value. Pre-8 they
      lived in PermGen.
    ref: "concepts.md#what-lives-where-primitives-versus-references"
  - id: heap-vs-stack-memory-026
    difficulty: intermediate
    tags: [array-elements, heap, references]
    question: |
      For a local variable `int[] arr = new int[1000];`, where are the 1000 int
      elements stored?
    options:
      - "In the stack frame alongside arr"
      - "In Metaspace"
      - "Inside the array object on the heap"
      - "In the string pool"
    answer: 2
    explanation: |
      Only the reference `arr` sits in the stack frame. The array object,
      including all 1000 int elements, lives on the heap. Array elements are never
      stored in the frame even when they are primitives.
    ref: "concepts.md#what-lives-where-primitives-versus-references"
  - id: heap-vs-stack-memory-027
    difficulty: intermediate
    tags: [gc-overhead, oome, heap]
    question: |
      `OutOfMemoryError: GC overhead limit exceeded` is thrown when the JVM
      detects that it:
    options:
      - "Cannot create a new thread"
      - "Has exhausted Metaspace"
      - "Ran a single GC that took longer than 1 second"
      - "Has spent over 98% of time in GC while recovering under 2% of the heap"
    answer: 3
    explanation: |
      This pre-emptive OOME fires when the collector spends more than 98% of time
      in GC recovering less than 2% of the heap — a sign the heap is effectively
      full — rather than waiting for a hard allocation failure. It can be disabled
      with -XX:-UseGCOverheadLimit (not recommended).
    ref: "concepts.md#outofmemoryerror-kinds"
  - id: heap-vs-stack-memory-028
    difficulty: intermediate
    tags: [old-gen, full-gc, promotion]
    question: |
      Which of the following is NOT a way an object ends up in the old
      generation?
    options:
      - "Surviving MaxTenuringThreshold minor GCs"
      - "Being explicitly moved there via a System.promote() call"
      - "Premature promotion due to survivor-space overflow"
      - "Direct allocation because it is too large for the young generation"
    answer: 1
    explanation: |
      There is no System.promote() API. Objects reach the old gen by aging out
      (surviving enough minor GCs), by premature promotion when survivor space
      overflows, or by direct allocation of very large objects. Promotion is a GC
      policy decision, not a programmer-invoked call.
    ref: "concepts.md#old-generation-and-object-promotion"
  - id: heap-vs-stack-memory-029
    difficulty: intermediate
    tags: [integer-cache, boxing, equality]
    question: |
      What does this print?

      ```java
      Integer a = 127, b = 127;
      Integer c = 128, d = 128;
      System.out.println((a == b) + " " + (c == d));
      ```
    options:
      - "true false"
      - "true true"
      - "false false"
      - "false true"
    answer: 0
    explanation: |
      Autoboxing uses Integer.valueOf, which caches values in the range -128..127.
      So a and b refer to the same cached object (true), but 128 is outside the
      cache, producing two distinct objects (false). Output: "true false". Use
      .equals for value comparison of boxed types.
    ref: "concepts.md#what-lives-where-primitives-versus-references"
  - id: heap-vs-stack-memory-030
    difficulty: intermediate
    tags: [flags, metaspace, tuning]
    question: |
      What does the `-XX:MetaspaceSize` flag actually specify?
    options:
      - "The hard maximum size of Metaspace"
      - "The minimum native memory reserved for Metaspace"
      - "The initial high-water mark that triggers the first Metaspace GC"
      - "The size of the compressed class space"
    answer: 2
    explanation: |
      -XX:MetaspaceSize is the initial threshold (high-water mark) at which the
      first Metaspace GC is triggered — not a hard cap or a reserved minimum. The
      hard cap is -XX:MaxMetaspaceSize, and compressed class space is sized with
      -XX:CompressedClassSpaceSize. This is a commonly misread flag.
    ref: "concepts.md#metaspace"
  - id: heap-vs-stack-memory-031
    difficulty: advanced
    tags: [escape-analysis, scalar-replacement, jit]
    question: |
      What optimization does HotSpot's escape analysis primarily enable for an
      object that provably does not escape a method?
    options:
      - "Literal allocation of the object on the call stack in every case"
      - "Immediate promotion of the object to the old generation"
      - "Pinning the object so the GC never moves it"
      - "Scalar replacement, where the object's fields become local scalars and no object is allocated"
    answer: 3
    explanation: |
      HotSpot's escape analysis primarily performs scalar replacement: a
      non-escaping object is never allocated as an object; its fields are kept as
      scalars in registers/stack slots. People loosely call this 'stack
      allocation,' but the real mechanism is scalar replacement (plus lock
      elision), and it applies only in JIT-compiled hot code.
    ref: "concepts.md#escape-analysis-and-tlab"
  - id: heap-vs-stack-memory-032
    difficulty: advanced
    tags: [tenuring, object-header, age]
    question: |
      Why is the maximum value of `-XX:MaxTenuringThreshold` capped at 15?
    options:
      - "Because HotSpot allows at most 15 survivor spaces"
      - "Because the object's age is stored in 4 bits of the mark word in the object header"
      - "Because minor GCs cannot run more than 15 times per second"
      - "Because the old generation has 15 regions"
    answer: 1
    explanation: |
      An object's age (number of minor GCs survived) is stored in a 4-bit field in
      the mark word of the object header, so the maximum representable age — and
      thus the max tenuring threshold — is 15. It has nothing to do with survivor
      count or GC frequency.
    ref: "concepts.md#young-generation-eden-and-survivor-spaces"
  - id: heap-vs-stack-memory-033
    difficulty: advanced
    tags: [escape-analysis, lock-elision, jit]
    question: |
      Besides scalar replacement, what other optimization can escape analysis
      unlock for a non-escaping object?
    options:
      - "Lock elision (removing synchronization on the object)"
      - "Automatic conversion of the object to a record"
      - "Moving the object to Metaspace"
      - "Interning the object into the string pool"
    answer: 0
    explanation: |
      If an object cannot escape the current thread, synchronization on it is
      provably uncontended and the JIT can perform lock elision
      (-XX:+EliminateLocks). Records, Metaspace, and the string pool are unrelated
      to escape analysis.
    ref: "concepts.md#escape-analysis-and-tlab"
  - id: heap-vs-stack-memory-034
    difficulty: advanced
    tags: [rss, xmx, footprint]
    question: |
      A container with a 2 GB limit runs a JVM started with `-Xmx2g` and is killed
      by the OOM killer. Why?
    options:
      - "-Xmx must always be set larger than the container limit"
      - "Containers ignore -Xmx entirely"
      - "-Xmx2g leaves no headroom: total JVM RSS also includes Metaspace, thread stacks, direct buffers, code cache, and GC structures beyond the heap"
      - "The heap is stored off-heap so -Xmx has no effect"
    answer: 2
    explanation: |
      -Xmx bounds only the heap. Total resident memory (RSS) additionally includes
      Metaspace, per-thread stacks, direct/off-heap buffers, the JIT code cache,
      and GC bookkeeping — so RSS substantially exceeds -Xmx. Sizing the container
      exactly to -Xmx without headroom invites OOM kills. Use -XX:MaxRAMPercentage
      instead.
    ref: "concepts.md#heap-and-stack-tuning-flags"
  - id: heap-vs-stack-memory-035
    difficulty: advanced
    tags: [string-constant-folding, intern, equality]
    question: |
      What does this print?

      ```java
      String x = "ab";
      String y = "a" + "b";                 // both compile-time constants
      String z = "a";
      String w = z + "b";                   // z is not a compile-time constant
      System.out.println((x == y) + " " + (x == w));
      ```
    options:
      - "true true"
      - "false false"
      - "false true"
      - "true false"
    answer: 3
    explanation: |
      "a" + "b" is a constant expression folded at compile time to the pooled "ab",
      so x == y is true. But z is a (non-final) variable, so z + "b" is a runtime
      concatenation producing a new heap String, so x == w is false. Output:
      "true false".
    ref: "concepts.md#the-string-pool-location"
  - id: heap-vs-stack-memory-036
    difficulty: advanced
    tags: [classloader-leak, metaspace, redeploy]
    question: |
      An application server repeatedly redeployed a WAR and eventually threw
      `OutOfMemoryError: Metaspace`. What is the most likely root cause?
    options:
      - "The heap was too small"
      - "A classloader leak: old application classloaders (and their classes) stayed reachable, so class metadata was never unloaded"
      - "Too many strings were interned"
      - "The survivor spaces were too small"
    answer: 1
    explanation: |
      Class metadata is reclaimed only when its entire defining classloader
      becomes unreachable. If a redeployed app's classloader is pinned (e.g. by a
      lingering thread, ThreadLocal, or JDBC driver reference), its classes never
      unload and Metaspace grows until it OOMEs. Heap size, interning, and
      survivor sizing are unrelated.
    ref: "concepts.md#metaspace"
  - id: heap-vs-stack-memory-037
    difficulty: advanced
    tags: [tail-call, recursion, stackoverflow]
    question: |
      Regarding tail recursion on the HotSpot JVM, which statement is correct?
    options:
      - "Java does not guarantee tail-call optimization, so even tail-recursive methods can throw StackOverflowError"
      - "Java guarantees tail-call optimization, so tail-recursive methods never overflow"
      - "Tail-recursive methods automatically run on a separate native stack"
      - "The compiler always converts recursion to iteration"
    answer: 0
    explanation: |
      Java (HotSpot) does not guarantee tail-call optimization, so a deeply
      tail-recursive method still pushes frames and can overflow the stack. For
      deep data, convert to iteration or use an explicit data-structure stack.
    ref: "concepts.md#stack-frames-and-stackoverflowerror"
  - id: heap-vs-stack-memory-038
    difficulty: advanced
    tags: [premature-promotion, survivor, tuning]
    question: |
      A workload with many medium-lived objects shows frequent expensive full GCs.
      Survivor spaces are very small. What is the likely mechanism?
    options:
      - "The string pool is overflowing into the old generation"
      - "Metaspace is leaking into the young generation"
      - "Premature promotion: undersized survivor space forces medium-lived objects straight into the old generation, driving full GCs"
      - "TLABs are too large"
    answer: 2
    explanation: |
      When survivor space is too small to hold the medium-lived cohort, those
      objects spill directly into the old gen (premature promotion) even though
      they would have died soon. This inflates old-gen occupancy and triggers
      frequent, costly full GCs. Enlarging survivor space or tuning tenuring helps.
    ref: "concepts.md#old-generation-and-object-promotion"
  - id: heap-vs-stack-memory-039
    difficulty: advanced
    tags: [zgc, versions, low-pause]
    question: |
      Which statement about ZGC's version history is accurate?
    options:
      - "ZGC has been the default collector since JDK 9"
      - "ZGC was removed in JDK 17"
      - "ZGC only runs on 32-bit JVMs"
      - "ZGC became production-ready in JDK 15 and gained a generational mode in JDK 21"
    answer: 3
    explanation: |
      ZGC reached production readiness in JDK 15 (JEP 377) and Generational ZGC
      arrived in JDK 21 (JEP 439). G1 (not ZGC) is the default since JDK 9. ZGC is
      a modern low-latency collector, not removed and not limited to 32-bit.
    ref: "concepts.md#old-generation-and-object-promotion"
  - id: heap-vs-stack-memory-040
    difficulty: advanced
    tags: [direct-buffer, cleaner, gc]
    question: |
      How is the native memory backing a DirectByteBuffer typically freed?
    options:
      - "Immediately when the buffer variable goes out of scope"
      - "By a Cleaner / PhantomReference mechanism tied to the buffer object's garbage collection"
      - "By calling System.gc() which synchronously frees it"
      - "It is never freed until JVM exit"
    answer: 1
    explanation: |
      A DirectByteBuffer's off-heap memory is released by a Cleaner (backed by a
      PhantomReference) that runs after the buffer object is collected. This is why
      holding references to direct buffers, or a heap that rarely GCs, can starve
      direct memory even while the heap looks healthy. It is not tied to scope
      exit, and System.gc() only hints.
    ref: "concepts.md#outofmemoryerror-kinds"
  - id: heap-vs-stack-memory-041
    difficulty: advanced
    tags: [virtual-threads, stack, heap, versions]
    question: |
      Virtual threads (finalized in JDK 21, JEP 444) make millions of concurrent
      threads feasible partly because their call stacks are:
    options:
      - "Growable and stored on the heap while the virtual thread is unmounted"
      - "Fixed-size OS thread stacks like platform threads"
      - "Stored in Metaspace"
      - "Never used because virtual threads have no stack"
    answer: 0
    explanation: |
      A virtual thread's stack is growable and lives on the heap; when the virtual
      thread is unmounted from its carrier, its stack is kept on the heap rather
      than reserving a fixed OS-backed stack. This makes them far cheaper than
      platform threads, which reserve fixed native stacks (sized by -Xss).
    ref: "concepts.md#stack-frames-and-stackoverflowerror"
  - id: heap-vs-stack-memory-042
    difficulty: advanced
    tags: [escape-analysis, jit-tier, limits]
    question: |
      Which statement about relying on escape analysis is correct?
    options:
      - "It guarantees no heap allocation for local objects even in interpreted code"
      - "It runs at class-load time in Metaspace"
      - "It is a JIT (C2) optimization that only applies to hot, compiled code and cannot be relied on for correctness"
      - "It is controlled by -Xss"
    answer: 2
    explanation: |
      Escape analysis is a C2 JIT optimization: it only affects methods hot enough
      to be optimized, and interpreted or C1-tier code still heap-allocates. It is
      purely a performance win you cannot depend on for correctness, and it can be
      defeated when an object escapes. It is not a load-time or -Xss concern.
    ref: "concepts.md#escape-analysis-and-tlab"
  - id: heap-vs-stack-memory-043
    difficulty: advanced
    tags: [humongous, g1, allocation]
    question: |
      In G1, an object larger than half a region size is treated as 'humongous.'
      What is notable about how it is handled?
    options:
      - "It is allocated in Metaspace"
      - "It is split across survivor spaces"
      - "It is always scalar-replaced by the JIT"
      - "It is given special handling and typically allocated directly in (humongous) old-gen regions rather than through the normal young-gen path"
    answer: 3
    explanation: |
      G1 handles humongous objects (larger than half a region) specially,
      allocating them in contiguous humongous regions outside the normal young-gen
      allocation path. This avoids churning the young generation with very large
      objects. Metaspace, survivor splitting, and scalar replacement do not apply.
    ref: "concepts.md#young-generation-eden-and-survivor-spaces"
  - id: heap-vs-stack-memory-044
    difficulty: advanced
    tags: [oome, array-size, heap]
    question: |
      What triggers `OutOfMemoryError: Requested array size exceeds VM limit`?
    options:
      - "Creating too many small arrays"
      - "Allocating an array whose length is near Integer.MAX_VALUE, exceeding the VM's array size limit"
      - "Interning too many strings"
      - "Exceeding -XX:MaxDirectMemorySize"
    answer: 1
    explanation: |
      This specific OOME is thrown when a requested array length is near
      Integer.MAX_VALUE and exceeds the VM's implementation limit on array size —
      distinct from simply filling the heap. It is not about many small arrays,
      interning, or direct memory.
    ref: "concepts.md#outofmemoryerror-kinds"
  - id: heap-vs-stack-memory-045
    difficulty: advanced
    tags: [container, maxram, versions]
    question: |
      For a JVM running in a memory-limited container, why is
      `-XX:MaxRAMPercentage` often preferred over a hard-coded `-Xmx`?
    options:
      - "It lets the heap scale automatically with the container's detected memory limit (container-aware since JDK 8u191+/10+)"
      - "It disables Metaspace"
      - "It forces off-heap allocation"
      - "It guarantees zero GC pauses"
    answer: 0
    explanation: |
      -XX:MaxRAMPercentage sizes the heap as a percentage of the container's
      cgroup-detected memory limit, so the heap adapts if the limit changes —
      leveraging container support that is on by default in modern JVMs
      (8u191+/10+). It does not disable Metaspace, force off-heap, or eliminate GC
      pauses.
    ref: "concepts.md#heap-and-stack-tuning-flags"
  - id: heap-vs-stack-memory-046
    difficulty: advanced
    tags: [class-unloading, metaspace, gc]
    question: |
      When is the metadata for a loaded class reclaimed from Metaspace?
    options:
      - "As soon as the last instance of the class is garbage collected"
      - "After MaxTenuringThreshold minor GCs"
      - "Only when the entire defining classloader becomes unreachable"
      - "Never; class metadata lives for the JVM's lifetime"
    answer: 2
    explanation: |
      Classes are unloaded as a unit with their defining classloader: metadata is
      reclaimed only when that classloader (and all its classes) becomes
      unreachable, not when individual instances die. This is why classloader leaks
      cause Metaspace growth. The bootstrap/app classloaders usually live for the
      JVM lifetime, but user classloaders can be unloaded.
    ref: "concepts.md#metaspace"
  - id: heap-vs-stack-memory-047
    difficulty: advanced
    tags: [operand-stack, bytecode, frames]
    question: |
      During execution of a single method, what is the operand stack within its
      frame used for?
    options:
      - "Storing all objects the method allocates"
      - "Caching the method's class metadata"
      - "Tracking the method's tenuring age"
      - "Holding intermediate values that bytecode instructions push and pop while computing"
    answer: 3
    explanation: |
      The operand stack is the working scratch space of a frame: bytecode
      instructions push operands and pop results (e.g. iadd pops two ints and
      pushes their sum). Allocated objects go on the heap; class metadata is in
      Metaspace; tenuring age applies to heap objects, not frames.
    ref: "concepts.md#stack-frames-and-stackoverflowerror"
  - id: heap-vs-stack-memory-048
    difficulty: advanced
    tags: [xss, threads, tradeoff]
    question: |
      Increasing `-Xss` from 512k to 8m on a service that spawns thousands of
      threads is most likely to:
    options:
      - "Increase heap fragmentation"
      - "Reduce the number of threads the process can create before running out of native address space/memory"
      - "Move thread stacks onto the heap"
      - "Have no effect because -Xss is ignored on 64-bit JVMs"
    answer: 1
    explanation: |
      Each thread reserves its stack from native address space, so a larger -Xss
      means each thread consumes more native memory, reducing how many threads can
      be created (risking OOME: unable to create new native thread). It does not
      affect the heap or move stacks onto the heap, and -Xss is honored on 64-bit
      JVMs.
    ref: "concepts.md#heap-and-stack-tuning-flags"
  - id: heap-vs-stack-memory-049
    difficulty: advanced
    tags: [compressed-class-space, metaspace, flags]
    question: |
      What is the compressed class space?
    options:
      - "A sub-region of Metaspace holding compressed class pointers, sized by -XX:CompressedClassSpaceSize"
      - "A compressed copy of the heap"
      - "A part of the young generation"
      - "The zlib buffer used by the string pool"
    answer: 0
    explanation: |
      The compressed class space is a sub-region of Metaspace that stores
      compressed class pointers (klass pointers) when compressed oops/class
      pointers are enabled; it is sized separately with
      -XX:CompressedClassSpaceSize. It is not part of the heap or young gen and has
      nothing to do with the string pool.
    ref: "concepts.md#metaspace"
  - id: heap-vs-stack-memory-050
    difficulty: advanced
    tags: [heap-dump, oome, diagnostics]
    question: |
      Which flag combination captures a heap dump automatically when an
      OutOfMemoryError occurs, for post-mortem analysis?
    options:
      - "-Xss2m -Xmn512m"
      - "-XX:+UseG1GC -XX:MaxGCPauseMillis=200"
      - "-XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/path"
      - "-XX:-UseGCOverheadLimit"
    answer: 2
    explanation: |
      -XX:+HeapDumpOnOutOfMemoryError writes a heap dump when an OOME is thrown, and
      -XX:HeapDumpPath directs where it is written; the dump can then be analyzed
      in tools like Eclipse MAT. The other options tune stacks, GC selection, or
      the GC overhead guard — none capture a dump.
    ref: "concepts.md#outofmemoryerror-kinds"
  - id: heap-vs-stack-memory-051
    difficulty: expert
    tags: [escape-analysis, iterator, allocation]
    question: |
      A hot loop iterates a HashMap using an enhanced for-loop, creating an
      Iterator each pass. Under HotSpot C2 with escape analysis, why might no
      Iterator object actually be allocated on the heap?
    options:
      - "Because iterators are always interned in the string pool"
      - "Because HashMap iterators are stored in Metaspace"
      - "Because the GC pre-allocates iterators in a survivor space"
      - "Because the Iterator provably does not escape the loop, so it is scalar-replaced (its state kept in registers/stack slots)"
    answer: 3
    explanation: |
      If C2 proves the Iterator does not escape the method, escape analysis can
      scalar-replace it: the iterator's fields are held as scalars rather than a
      heap object being allocated, eliminating allocation and GC pressure in the
      hot loop. This is only when the method is JIT-compiled and the escape proof
      holds.
    ref: "concepts.md#escape-analysis-and-tlab"
  - id: heap-vs-stack-memory-052
    difficulty: expert
    tags: [thread-local, classloader-leak, metaspace]
    question: |
      In a redeployable web app, which pattern most classically pins a webapp
      classloader in memory and causes a slow Metaspace leak across redeploys?
    options:
      - "Using try-with-resources for JDBC connections"
      - "A ThreadLocal set on a pooled (container-owned) thread holding a value whose class was loaded by the webapp classloader, never removed"
      - "Marking classes final"
      - "Interning short-lived strings"
    answer: 1
    explanation: |
      A ThreadLocal whose value's class is loaded by the webapp classloader, set on
      a long-lived container/pool thread and never cleared, keeps the whole webapp
      classloader reachable through the thread → threadLocals map → value → its
      Class → its classloader chain. Across redeploys the old classloaders and
      their classes never unload, leaking Metaspace. The other options are benign.
    ref: "concepts.md#metaspace"
  - id: heap-vs-stack-memory-053
    difficulty: expert
    tags: [pass-by-value, arrays, mutation]
    question: |
      What does this print?

      ```java
      static void f(int[] a, int x) { a[0] = 99; x = 99; }
      public static void main(String[] args) {
          int[] arr = {1};
          int n = 1;
          f(arr, n);
          System.out.println(arr[0] + " " + n);
      }
      ```
    options:
      - "99 1"
      - "99 99"
      - "1 1"
      - "1 99"
    answer: 0
    explanation: |
      Java copies argument values. The int n is copied, so reassigning x inside f
      cannot change n → n stays 1. The array reference is also copied, but it still
      points to the same heap array object, so a[0] = 99 mutates the shared array
      visible to the caller. Output: "99 1".
    ref: "concepts.md#what-lives-where-primitives-versus-references"
  - id: heap-vs-stack-memory-054
    difficulty: expert
    tags: [oome-vs-soe, threads, diagnosis]
    question: |
      A service intermittently fails. In case A a single request recurses very
      deeply; in case B thousands of requests each spawn a new platform thread.
      Which throwables occur, respectively?
    options:
      - "Both throw StackOverflowError"
      - "A: OutOfMemoryError: Java heap space; B: StackOverflowError"
      - "A: StackOverflowError; B: OutOfMemoryError: unable to create new native thread"
      - "Both throw OutOfMemoryError: Metaspace"
    answer: 2
    explanation: |
      Deep recursion on one thread exhausts that thread's stack → StackOverflowError.
      Creating thousands of platform threads exhausts native memory for their
      stacks → OutOfMemoryError: unable to create new native thread. They stem from
      the same resource (stacks) but manifest as different throwables — a classic
      distinction interviewers probe.
    ref: "concepts.md#outofmemoryerror-kinds"
  - id: heap-vs-stack-memory-055
    difficulty: expert
    tags: [intern, string-table, tuning]
    question: |
      An intern-heavy application spends excessive time in String.intern(). Which
      tuning knob most directly targets this, and what changed historically?
    options:
      - "-Xss, because interned strings live on the stack"
      - "-XX:MaxTenuringThreshold, because interned strings are always tenured"
      - "-XX:MaxDirectMemorySize, because the pool is off-heap"
      - "-XX:StringTableSize, which sizes the intern hashtable's buckets; interning risk shifted from PermGen exhaustion (<=6) to heap/hashtable performance (7+)"
    answer: 3
    explanation: |
      -XX:StringTableSize sets the number of buckets in the intern hashtable; a
      too-small table degrades intern performance. Historically, when the pool was
      in PermGen (<=6), over-interning risked PermGen OOME; since Java 7 the pooled
      strings are on the heap so the concern shifted to table sizing and heap
      footprint. Stacks, tenuring, and direct memory are unrelated.
    ref: "concepts.md#the-string-pool-location"
  - id: heap-vs-stack-memory-056
    difficulty: expert
    tags: [tlab, allocation, retirement]
    question: |
      When a thread's TLAB does not have enough room for the next allocation, what
      does HotSpot typically do?
    options:
      - "Immediately throw OutOfMemoryError"
      - "Either allocate the object directly in the shared Eden (slow path) or retire the current TLAB and request a new one, depending on wasted-space heuristics"
      - "Move the object to the old generation"
      - "Store the object on the thread's stack"
    answer: 1
    explanation: |
      On a TLAB overflow HotSpot weighs the wasted space at the end of the current
      TLAB: for large allocations it may allocate the object directly in shared
      Eden via the slow (synchronized) path; otherwise it retires the current TLAB
      and grabs a fresh one. It does not OOME, force tenuring, or use the stack.
    ref: "concepts.md#escape-analysis-and-tlab"
  - id: heap-vs-stack-memory-057
    difficulty: expert
    tags: [generational-zgc, versions, low-pause]
    question: |
      Which is the most version-accurate statement about generational low-pause
      collectors as of JDK 21?
    options:
      - "Generational ZGC arrived in JDK 21 (JEP 439); non-generational ZGC and Shenandoah both reached production in JDK 15"
      - "Generational ZGC was finalized in JDK 15"
      - "Shenandoah became the default collector in JDK 21"
      - "ZGC is still experimental as of JDK 21"
    answer: 0
    explanation: |
      Generational ZGC was introduced in JDK 21 (JEP 439). Plain ZGC (JEP 377) and
      Shenandoah (JEP 379) both reached production in JDK 15. G1 remains the default
      collector; Shenandoah is not the default, and ZGC is no longer experimental.
    ref: "concepts.md#old-generation-and-object-promotion"
  - id: heap-vs-stack-memory-058
    difficulty: expert
    tags: [string-pool, gc, heap, versions]
    question: |
      One practical consequence of moving the string pool from PermGen to the heap
      in Java 7 is that:
    options:
      - "Interned strings can never be garbage collected"
      - "The pool now lives in Metaspace"
      - "Unreferenced interned strings can now be garbage collected and the pool grows with heap capacity rather than a small fixed PermGen"
      - "String literals stopped being interned automatically"
    answer: 2
    explanation: |
      Once on the heap, interned strings are subject to normal GC (collectible when
      unreferenced) and the pool is bounded by heap size rather than a small fixed
      PermGen — greatly reducing the old 'PermGen space' risk from heavy interning.
      Literals are still auto-interned, and the pool is on the heap, not Metaspace.
    ref: "concepts.md#the-string-pool-location"
  - id: heap-vs-stack-memory-059
    difficulty: expert
    tags: [footprint, formula, sizing]
    question: |
      Which expression best approximates a JVM process's total resident memory
      (RSS)?
    options:
      - "Exactly -Xmx"
      - "-Xmx + -Xms"
      - "young gen + old gen only"
      - "heap (-Xmx) + Metaspace + (threads x -Xss) + direct memory + JIT code cache + GC overhead"
    answer: 3
    explanation: |
      Total RSS is roughly the heap plus Metaspace, plus the sum of per-thread
      stacks (threads x -Xss), plus direct/off-heap memory, plus the JIT code
      cache, plus GC bookkeeping. Sizing a container to -Xmx alone ignores all the
      non-heap regions and invites OOM kills. -Xms/-Xmx alone or young+old only are
      incomplete.
    ref: "concepts.md#heap-and-stack-tuning-flags"
  - id: heap-vs-stack-memory-060
    difficulty: expert
    tags: [escape-analysis, defeat, field-store]
    question: |
      Which action most reliably DEFEATS escape analysis for an object created in
      a method, forcing a genuine heap allocation?
    options:
      - "Reading one of the object's fields into a local variable"
      - "Storing the object into a static field or returning it from the method"
      - "Calling a private final method on the object"
      - "Declaring the object with the var keyword"
    answer: 1
    explanation: |
      An object escapes when it becomes reachable beyond the method — e.g. stored
      in a static/instance field or returned to the caller — so the JIT can no
      longer prove confinement and must heap-allocate it. Reading a field, calling
      a method that does not leak `this`, or using var does not by itself cause
      escape.
    ref: "concepts.md#escape-analysis-and-tlab"
