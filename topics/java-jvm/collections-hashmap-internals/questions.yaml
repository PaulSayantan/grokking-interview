topic: Collections Framework and HashMap Internals
domain: java-jvm
topic_slug: collections-hashmap-internals
version: 1
questions:
- id: collections-hashmap-internals-001
  difficulty: beginner
  tags:
  - hierarchy
  - map
  - collection
  question: |
    Which statement about the top-level interfaces of the Java Collections Framework is correct?
  options:
  - Map is NOT a subtype of Collection; it is a separate root interface.
  - Map extends Collection, so every Map is also a Collection.
  - Collection extends Map to inherit key/value semantics.
  - List, Set, and Map all directly extend Iterable.
  answer: 0
  explanation: |
    Map is deliberately not part of the Collection hierarchy because it models key→value
    associations, not a group of single elements. Collection extends Iterable; List, Set, and
    Queue extend Collection. Map exposes collection *views* (keySet, values, entrySet) but is
    itself a separate root, so options claiming inheritance either direction are wrong.
  ref: concepts.md#collection-hierarchy
- id: collections-hashmap-internals-002
  difficulty: beginner
  tags:
  - hierarchy
  - set
  question: |
    Which collection type forbids duplicate elements by definition?
  options:
  - List
  - Set
  - Queue
  - Deque
  answer: 1
  explanation: |
    A Set models a mathematical set and rejects duplicates (using equals/hashCode for hash sets,
    or the comparator for TreeSet). List allows duplicates and positional access; Queue and Deque
    allow duplicates and are ordered by FIFO/priority or both ends.
  ref: concepts.md#collection-hierarchy
- id: collections-hashmap-internals-003
  difficulty: intermediate
  tags:
  - sequenced-collections
  - jdk21
  question: |
    Sequenced Collections (SequencedCollection, SequencedSet, SequencedMap) with methods like
    getFirst, getLast, and reversed() were FINALIZED in which Java release?
  options:
  - Java 17 (LTS)
  - Java 19
  - Java 21 (LTS), via JEP 431
  - Java 11 (LTS)
  answer: 2
  explanation: |
    JEP 431 (Sequenced Collections) shipped as a final feature in JDK 21. It retrofitted List,
    Deque, LinkedHashSet, and LinkedHashMap with a uniform encounter-order API. It was not a
    preview and did not exist in 11 or 17.
  ref: concepts.md#collection-hierarchy
- id: collections-hashmap-internals-004
  difficulty: intermediate
  tags:
  - immutable
  - factory
  - jdk9
  question: |
    What happens when you execute the following?

    ```java
    List<String> l = List.of("a", "b");
    l.add("c");
    ```
  options:
  - It compiles and l becomes [a, b, c].
  - 'Compile-time error: List.of returns void.'
  - It throws ConcurrentModificationException at runtime.
  - It throws UnsupportedOperationException at runtime.
  answer: 3
  explanation: |
    List.of (immutable collection factories, since Java 9, JEP 269) returns an unmodifiable list;
    any mutator (add/set/remove) throws UnsupportedOperationException. These factories also reject
    null elements with NullPointerException. It is not a CME (no iteration involved).
  ref: concepts.md#collection-hierarchy
- id: collections-hashmap-internals-005
  difficulty: intermediate
  tags:
  - arrays-aslist
  - fixed-size
  question: |
    Given `List<Integer> l = Arrays.asList(1, 2, 3);`, which operation succeeds?
  options:
  - l.set(0, 99)
  - l.add(4)
  - l.remove(0)
  - l.clear()
  answer: 0
  explanation: |
    Arrays.asList returns a fixed-size list backed by the array. You may replace elements with
    set (writes through to the array), but structural changes (add, remove, clear) throw
    UnsupportedOperationException because the size is fixed.
  ref: concepts.md#collection-hierarchy
- id: collections-hashmap-internals-006
  difficulty: beginner
  tags:
  - arraylist
  - linkedlist
  - performance
  question: |
    For frequent random access by index (get(i)) on a large list, which is generally the better
    choice and why?
  options:
  - LinkedList, because it stores elements as nodes.
  - ArrayList, because it is backed by a contiguous array giving O(1) indexed access.
  - LinkedList, because it has O(1) get(i).
  - They are identical for get(i).
  answer: 1
  explanation: |
    ArrayList backs elements with a contiguous array, so get(i) is O(1). LinkedList must walk the
    chain from the nearest end, making get(i) O(n). ArrayList also has far better cache locality.
  ref: concepts.md#arraylist-vs-linkedlist
- id: collections-hashmap-internals-007
  difficulty: intermediate
  tags:
  - arraylist
  - growth
  - capacity
  question: |
    When an ArrayList exceeds its capacity, by roughly what factor does the backing array grow in
    the OpenJDK implementation?
  options:
  - It doubles (2x).
  - It grows by 1 element each time.
  - About 1.5x (oldCapacity + (oldCapacity >> 1)).
  - It grows by a fixed 16 elements.
  answer: 2
  explanation: |
    ArrayList uses roughly 1.5x growth: newCapacity = oldCapacity + (oldCapacity >> 1). HashMap
    doubles, but ArrayList does not. Pre-sizing with an initial capacity avoids repeated array
    copies.
  ref: concepts.md#arraylist-vs-linkedlist
- id: collections-hashmap-internals-008
  difficulty: advanced
  tags:
  - arraylist
  - autoboxing
  - overloading
  question: |
    What does this print?

    ```java
    List<Integer> list = new ArrayList<>(List.of(10, 20, 30));
    list.remove(1);
    System.out.println(list);
    ```
  options:
  - '[20, 30]'
  - '[10, 20]'
  - It throws IndexOutOfBoundsException.
  - '[10, 30]'
  answer: 3
  explanation: |
    The literal 1 is an int, so remove(int index) is chosen (not remove(Object)). It removes the
    element at index 1 (the value 20), leaving [10, 30]. To remove the value 1 you would need
    list.remove(Integer.valueOf(1)). This overload ambiguity is a classic trap.
  ref: concepts.md#arraylist-vs-linkedlist
- id: collections-hashmap-internals-009
  difficulty: advanced
  tags:
  - linkedlist
  - arraydeque
  - best-practice
  question: |
    Modern guidance is to prefer ArrayDeque over LinkedList for stack/queue use cases. What is the
    primary reason?
  options:
  - ArrayDeque uses a contiguous array giving better cache locality and lower per-element memory overhead.
  - LinkedList is not thread-safe but ArrayDeque is.
  - ArrayDeque allows null elements and LinkedList does not.
  - LinkedList cannot be used as a queue at all.
  answer: 0
  explanation: |
    ArrayDeque is array-backed, so it has excellent cache locality and no per-node pointer
    overhead, making it faster and lighter than LinkedList for FIFO/LIFO use. Neither is
    thread-safe. Notably ArrayDeque *rejects* null, while LinkedList permits it — the opposite of
    the distractor. LinkedList can act as a queue (it implements Deque), just less efficiently.
  ref: concepts.md#arraylist-vs-linkedlist
- id: collections-hashmap-internals-010
  difficulty: intermediate
  tags:
  - linkedlist
  - complexity
  question: |
    Using a ListIterator already positioned in the middle of a LinkedList, what is the cost of
    removing the current element?
  options:
  - O(n), because the list must shift elements.
  - O(1), because it just relinks the neighboring nodes.
  - O(log n).
  - O(n), because it must recompute indices.
  answer: 1
  explanation: |
    Once positioned, LinkedList removal is O(1) — only the previous/next pointers are updated, no
    shifting. (ArrayList removal in the middle is O(n) due to array shifting.) The O(n) cost for
    LinkedList is in *finding* the position, not in the unlink itself.
  ref: concepts.md#arraylist-vs-linkedlist
- id: collections-hashmap-internals-011
  difficulty: beginner
  tags:
  - hashmap
  - load-factor
  question: |
    What are HashMap's default initial capacity and default load factor?
  options:
  - Capacity 10, load factor 0.5
  - Capacity 32, load factor 1.0
  - Capacity 16, load factor 0.75
  - Capacity 16, load factor 0.5
  answer: 2
  explanation: |
    DEFAULT_INITIAL_CAPACITY is 16 (a power of two) and DEFAULT_LOAD_FACTOR is 0.75. The map
    resizes when size exceeds capacity * loadFactor (12 for a fresh default map).
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-012
  difficulty: intermediate
  tags:
  - hashmap
  - hashing
  - bucket-index
  question: |
    How does HashMap compute the bucket index for a key in Java 8+?
  options:
  - index = key.hashCode() % table.length
  - index = key.hashCode() & table.length
  - index = System.identityHashCode(key) % 16
  - index = (h = key.hashCode()) ^ (h >>> 16), then AND with (table.length - 1)
  answer: 3
  explanation: |
    HashMap perturbs the hash by XORing the high 16 bits into the low bits: h ^ (h >>> 16). It
    then masks with (length - 1). Because capacity is a power of two, `hash & (n-1)` is equivalent
    to `hash % n` but faster; the perturbation spreads high bits down so they influence the index.
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-013
  difficulty: intermediate
  tags:
  - hashmap
  - power-of-two
  question: |
    Why is HashMap's table capacity always maintained as a power of two?
  options:
  - To allow the fast bitmask hash & (n-1) to replace the modulo operation.
  - Because red-black trees require power-of-two sizes.
  - So that null keys can be stored.
  - To guarantee zero collisions.
  answer: 0
  explanation: |
    With n a power of two, (n-1) is a mask of all-ones in the low bits, so `hash & (n-1)` yields
    the same result as `hash % n` but with a single fast AND. It does nothing to eliminate
    collisions (that is what the hash perturbation and treeification address) and is unrelated to
    trees or nulls.
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-014
  difficulty: advanced
  tags:
  - hashmap
  - treeification
  - jdk8
  question: |
    A HashMap bucket accumulates its 8th colliding node. Under what condition does that bucket
    actually convert to a red-black tree (Since Java 8)?
  options:
  - Always — reaching TREEIFY_THRESHOLD (8) alone triggers treeification.
  - Only if the total table capacity is at least MIN_TREEIFY_CAPACITY (64); otherwise the map resizes
    instead.
  - Only if the keys implement Serializable.
  - Never — HashMap uses only linked lists.
  answer: 1
  explanation: |
    Treeification requires BOTH conditions: a chain length reaching TREEIFY_THRESHOLD (8) AND
    table capacity ≥ MIN_TREEIFY_CAPACITY (64). If capacity is below 64, HashMap resizes instead,
    since resizing usually redistributes colliding entries. Treeification (JEP 180) gives O(log n)
    worst-case for pathological hashing.
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-015
  difficulty: advanced
  tags:
  - hashmap
  - untreeify
  question: |
    A treeified HashMap bucket loses entries during removals/resize. At what size does it revert
    from a red-black tree back to a linked list?
  options:
  - At 8 (TREEIFY_THRESHOLD).
  - At 0 (only when empty).
  - At 6 (UNTREEIFY_THRESHOLD).
  - It never reverts once treeified.
  answer: 2
  explanation: |
    UNTREEIFY_THRESHOLD is 6. The gap between treeify (8) and untreeify (6) provides hysteresis so
    a bucket hovering around the boundary does not thrash between the two representations on every
    add/remove.
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-016
  difficulty: advanced
  tags:
  - hashmap
  - resize
  - rehash
  - jdk8
  question: |
    When a Java 8+ HashMap doubles its table during resize, how is each existing node's new
    position determined?
  options:
  - Every key's hashCode is fully recomputed from scratch.
  - All nodes are rehashed with a new random seed.
  - Nodes are re-sorted by key order.
  - Each node either stays at index i or moves to i + oldCapacity, decided by testing one bit (hash &
    oldCap).
  answer: 3
  explanation: |
    Because capacity doubles, the only new bit that matters is oldCap. If (hash & oldCap) == 0 the
    node stays at index i (the "lo" list); otherwise it moves to i + oldCapacity (the "hi" list).
    Hashes are not recomputed. This split also preserves relative order, unlike Java 7 which
    reversed chains.
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-017
  difficulty: expert
  tags:
  - hashmap
  - jdk7
  - concurrency-bug
  question: |
    The infamous HashMap "infinite loop / 100% CPU" bug under concurrent use was primarily rooted
    in a Java 7 resize behavior that Java 8 changed. What was that behavior?
  options:
  - Java 7 reversed the order of each bucket's linked list during transfer, which under a race could create
    a circular node reference.
  - Java 7 used red-black trees that could form cycles.
  - Java 7 stored keys and values in separate arrays.
  - Java 7 used CAS instead of locks.
  answer: 0
  explanation: |
    In Java 7 the transfer during resize inserted nodes at the head, reversing each chain. Two
    threads resizing concurrently could interleave and form a cycle in the linked list, so a later
    get would spin forever. Java 8's lo/hi split preserves order and avoids that specific cycle
    (though HashMap is still not thread-safe and must not be shared without synchronization).
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-018
  difficulty: intermediate
  tags:
  - hashmap
  - null-key
  question: |
    Where does a null key end up in a HashMap, and is it allowed?
  options:
  - Not allowed — HashMap throws NullPointerException on a null key.
  - Allowed; it hashes to 0 and is always stored in bucket 0.
  - Allowed; it is stored in the last bucket.
  - Allowed, but only if the load factor is 1.0.
  answer: 1
  explanation: |
    HashMap permits exactly one null key. Its hash(null) returns 0, so it always maps to bucket 0.
    (Hashtable and ConcurrentHashMap, by contrast, throw NPE for null keys.)
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-019
  difficulty: expert
  tags:
  - hashmap
  - sizing
  - best-practice
  question: |
    You need a HashMap that will hold exactly 1000 entries without resizing. Which initial-capacity
    argument best achieves that with the default load factor?
  options:
  - new HashMap<>(1000)
  - new HashMap<>(750)
  - new HashMap<>((int)(1000 / 0.75) + 1)   // ~1335
  - new HashMap<>(16)
  answer: 2
  explanation: |
    The resize threshold is capacity * 0.75. To fit 1000 without crossing it you need capacity
    such that capacity * 0.75 > 1000, i.e. capacity > ~1333. Passing 1000 would resize once 750
    entries are inserted. HashMap rounds the requested capacity up to the next power of two (2048
    here), so the +1 formula safely avoids resizes.
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-020
  difficulty: advanced
  tags:
  - hashmap
  - mutable-key
  - gotcha
  question: |
    You put an entry into a HashMap, then mutate a field of the key object that affects its
    hashCode. What is the most likely consequence?
  options:
  - Nothing; HashMap re-indexes keys automatically on mutation.
  - The map immediately throws ConcurrentModificationException.
  - All other entries are rehashed.
  - The entry may become unreachable via get() because it now hashes to a different bucket.
  answer: 3
  explanation: |
    HashMap indexes an entry by the key's hash at insertion time. If the key's hashCode later
    changes, get() computes a different bucket and cannot find the stranded entry, even though it
    is still physically present. This is why keys should be immutable.
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-021
  difficulty: beginner
  tags:
  - hashtable
  - concurrenthashmap
  - nulls
  question: |
    Which map implementation does NOT permit null keys or null values?
  options:
  - ConcurrentHashMap
  - HashMap
  - LinkedHashMap
  - TreeMap (with a comparator that allows nulls)
  answer: 0
  explanation: |
    ConcurrentHashMap (and Hashtable) reject null keys and null values with NullPointerException.
    In a concurrent map, allowing null would make get()==null ambiguous between "absent" and
    "present with null value". HashMap and LinkedHashMap allow one null key and null values.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-022
  difficulty: intermediate
  tags:
  - concurrenthashmap
  - jdk8
  - locking
  question: |
    How does ConcurrentHashMap achieve thread-safe writes in Java 8+ (after the segment redesign)?
  options:
  - A single synchronized lock around the whole map.
  - CAS to install the first node in an empty bin, plus synchronized on the bin's head node for further
    updates.
  - 16 fixed segment locks (lock striping), as in Java 5.
  - A global ReadWriteLock shared by all threads.
  answer: 1
  explanation: |
    Java 8 dropped the segment array. For an empty bin it uses a lock-free CAS to install the
    first node; when a bin is non-empty it synchronizes on that bin's head node, so concurrency
    scales with the number of buckets rather than a fixed 16 segments. Reads are lock-free.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-023
  difficulty: intermediate
  tags:
  - linkedhashmap
  - lru
  question: |
    Which combination turns a LinkedHashMap into an LRU cache?
  options:
  - Construct it with a negative load factor.
  - Call synchronizedMap and set a TTL.
  - Construct it with accessOrder=true and override removeEldestEntry to return true past a size limit.
  - Override compareTo to sort by access time.
  answer: 2
  explanation: |
    LinkedHashMap's access-order constructor (accessOrder=true) moves the most recently accessed
    entry to the tail. Overriding removeEldestEntry to return true when size exceeds the cap makes
    put() evict the least-recently-used (head) entry, yielding an LRU cache. LinkedHashMap has no
    compareTo and TTL is not built in.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-024
  difficulty: intermediate
  tags:
  - treemap
  - ordering
  question: |
    What backing data structure does TreeMap use, and what ordering does it provide?
  options:
  - A hash table; no ordering.
  - A skip list; insertion ordering.
  - A resizable array; sorted by insertion time.
  - A red-black tree; keys sorted by natural ordering or a supplied Comparator.
  answer: 3
  explanation: |
    TreeMap is a red-black (self-balancing) tree implementing NavigableMap. It keeps keys sorted
    by their natural ordering (Comparable) or by a Comparator provided to the constructor, giving
    O(log n) operations and range queries like headMap/tailMap/subMap.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-025
  difficulty: advanced
  tags:
  - treemap
  - comparator
  - equals
  question: |
    What does this print?

    ```java
    TreeMap<String, Integer> m =
        new TreeMap<>(Comparator.comparingInt(String::length));
    m.put("aa", 1);
    m.put("bb", 2);
    System.out.println(m.size());
    ```
  options:
  - '1'
  - '2'
  - '0'
  - It throws IllegalStateException.
  answer: 0
  explanation: |
    TreeMap decides key equality by the comparator, NOT equals. The comparator compares by length,
    so "aa" and "bb" both have length 2 and are treated as the SAME key; the second put overwrites
    the first. size() is 1. This mismatch between compare()==0 and equals() is a classic TreeMap
    gotcha.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-026
  difficulty: advanced
  tags:
  - hashtable
  - synchronizedmap
  - concurrenthashmap
  question: |
    Which statement comparing Hashtable, Collections.synchronizedMap, and ConcurrentHashMap is
    accurate?
  options:
  - All three scale identically under high write contention.
  - Hashtable and synchronizedMap serialize on a single lock, while ConcurrentHashMap uses fine-grained
    per-bin locking and lock-free reads.
  - ConcurrentHashMap requires you to synchronize manually while iterating.
  - synchronizedMap iterators never require external synchronization.
  answer: 1
  explanation: |
    Hashtable synchronizes every method on the whole object, and synchronizedMap wraps each method
    in one lock — both serialize all access and both require you to manually synchronize during
    iteration. ConcurrentHashMap uses per-bin synchronization plus lock-free reads and needs no
    external lock for its weakly-consistent iterators.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-027
  difficulty: expert
  tags:
  - concurrenthashmap
  - size
  - atomicity
  question: |
    In ConcurrentHashMap, which method returns the mapping count as a long (recommended over size()
    for large maps), and why is size() considered approximate under concurrency?
  options:
  - count(); size() rounds to the nearest thousand.
  - longSize(); size() only counts non-null values.
  - mappingCount(); size() is an int and its value can be momentarily inexact while concurrent updates
    are in flight.
  - cardinality(); size() ignores treeified bins.
  answer: 2
  explanation: |
    mappingCount() returns a long and is preferred because a concurrent map can exceed
    Integer.MAX_VALUE and because size() (an int) is a best-effort snapshot that may be slightly
    off while updates race. Neither counts differently based on treeification or null values.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-028
  difficulty: intermediate
  tags:
  - linkedhashmap
  - ordering
  question: |
    A default LinkedHashMap (accessOrder=false) iterates its entries in what order?
  options:
  - Sorted by key.
  - Random order that changes each run.
  - Reverse insertion order.
  - Insertion order.
  answer: 3
  explanation: |
    By default LinkedHashMap maintains a doubly-linked list threaded through entries in insertion
    order, so iteration reflects the order keys were first added. With accessOrder=true it becomes
    access order instead. Sorted-by-key is TreeMap; random-ish is plain HashMap.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-029
  difficulty: beginner
  tags:
  - iterators
  - fail-fast
  - cme
  question: |
    A fail-fast iterator responds to structural modification of its collection during iteration
    (other than via its own remove) by doing what?
  options:
  - Throwing ConcurrentModificationException (best effort).
  - Silently skipping the modified element.
  - Blocking until the modification completes.
  - Restarting iteration from the beginning.
  answer: 0
  explanation: |
    Fail-fast iterators (ArrayList, HashMap, HashSet, etc.) detect structural modification via a
    modCount check and throw ConcurrentModificationException. It is best-effort — meant for bug
    detection, not a guarantee — so you must not rely on it firing in every case.
  ref: concepts.md#fail-fast-vs-fail-safe-iterators
- id: collections-hashmap-internals-030
  difficulty: intermediate
  tags:
  - iterators
  - modcount
  question: |
    What mechanism do fail-fast iterators use to detect concurrent structural modification?
  options:
  - A synchronized lock on the collection.
  - Comparing an expectedModCount snapshot against the collection's current modCount.
  - A checksum of all elements recomputed on each next().
  - A version timestamp from System.nanoTime().
  answer: 1
  explanation: |
    The collection increments an int modCount on each structural change. The iterator snapshots it
    as expectedModCount at creation and calls checkForComodification() on next()/remove(); a
    mismatch throws CME. No locking, checksums, or timestamps are involved.
  ref: concepts.md#fail-fast-vs-fail-safe-iterators
- id: collections-hashmap-internals-031
  difficulty: intermediate
  tags:
  - iterators
  - code-analysis
  - cme
  question: |
    What is the most likely result of running this?

    ```java
    List<Integer> list = new ArrayList<>(List.of(1, 2, 3, 4));
    for (Integer x : list) {
        if (x == 2) list.remove(x);
    }
    ```
  options:
  - It prints nothing and completes normally.
  - It throws IndexOutOfBoundsException.
  - It throws ConcurrentModificationException.
  - It removes 2 cleanly and leaves [1, 3, 4].
  answer: 2
  explanation: |
    Removing directly from the list (not via the iterator) bumps modCount, so the next call to the
    enhanced-for's iterator.next() detects the mismatch and throws ConcurrentModificationException.
    The safe approaches are Iterator.remove() or list.removeIf(x -> x == 2).
  ref: concepts.md#fail-fast-vs-fail-safe-iterators
- id: collections-hashmap-internals-032
  difficulty: advanced
  tags:
  - iterators
  - fail-safe
  - copyonwrite
  question: |
    Which pair of collections provides weakly-consistent or snapshot (fail-safe) iterators that
    never throw ConcurrentModificationException?
  options:
  - ArrayList and HashMap
  - Vector and Hashtable
  - TreeMap and LinkedHashMap
  - CopyOnWriteArrayList and ConcurrentHashMap
  answer: 3
  explanation: |
    CopyOnWriteArrayList iterates over an immutable snapshot taken at iterator creation, and
    ConcurrentHashMap's iterators are weakly consistent — both never throw CME. The other options
    are fail-fast (Vector/Hashtable's Enumeration is not fail-fast, but their iterator() views are;
    still, they throw CME, not fail-safe behavior).
  ref: concepts.md#fail-fast-vs-fail-safe-iterators
- id: collections-hashmap-internals-033
  difficulty: advanced
  tags:
  - iterators
  - removeif
  - safe-removal
  question: |
    Which is the cleanest and correct way to remove all elements matching a predicate during a
    single pass, introduced in Java 8?
  options:
  - collection.removeIf(predicate).
  - Enhanced for-loop with collection.remove(x).
  - Stream.forEach with a remove side effect.
  - Recomputing the list inside the loop body.
  answer: 0
  explanation: |
    Collection.removeIf(Predicate) (since Java 8) removes matching elements safely in one pass
    without CME, and is more efficient/clear than manual Iterator.remove(). Mutating a collection
    inside forEach or an enhanced-for loop risks CME or undefined behavior.
  ref: concepts.md#fail-fast-vs-fail-safe-iterators
- id: collections-hashmap-internals-034
  difficulty: expert
  tags:
  - iterators
  - cme
  - edge-case
  question: |
    Why might removing the second-to-last element of an ArrayList inside an enhanced for-loop
    sometimes NOT throw ConcurrentModificationException?
  options:
  - ArrayList disables modCount for the last two elements.
  - After the removal, hasNext() sees cursor == size and returns false, so the loop ends before next()
    runs the modCount check.
  - ArrayList automatically fixes the modCount when the size drops.
  - The enhanced for-loop does not use an iterator.
  answer: 1
  explanation: |
    The CME check lives in next(), not hasNext(). After removing the second-to-last element, size
    drops so the cursor now equals size; hasNext() returns false and the loop exits before another
    next() can detect the modification. This is exactly why CME is documented as best-effort and
    must not be relied upon.
  ref: concepts.md#fail-fast-vs-fail-safe-iterators
- id: collections-hashmap-internals-035
  difficulty: beginner
  tags:
  - equals
  - hashcode
  - contract
  question: |
    According to the Object contract, if a.equals(b) is true, what must be true of their hash
    codes?
  options:
  - a.hashCode() must be greater than b.hashCode().
  - Their hash codes must differ.
  - a.hashCode() must equal b.hashCode().
  - Nothing is required about hash codes.
  answer: 2
  explanation: |
    The contract requires equal objects to have equal hash codes. The converse is not required
    (unequal objects may collide). Violating this breaks hash-based collections: equal keys could
    land in different buckets and never be found.
  ref: concepts.md#equals-and-hashcode-contract-in-maps
- id: collections-hashmap-internals-036
  difficulty: intermediate
  tags:
  - equals
  - hashcode
  - code-analysis
  question: |
    A class overrides equals() correctly but does NOT override hashCode(). What happens here?

    ```java
    Map<Point, String> m = new HashMap<>();
    m.put(new Point(1, 2), "a");
    String v = m.get(new Point(1, 2));
    ```
  options:
  - v is "a".
  - It throws NullPointerException.
  - It throws ConcurrentModificationException.
  - v is likely null, because the two equal Points usually have different identity hash codes and map
    to different buckets.
  answer: 3
  explanation: |
    Without a hashCode override, Object's identity hash is used, so the two logically-equal Points
    almost always produce different hash codes and thus different buckets. get() looks in the wrong
    bucket and returns null. Overriding equals without hashCode is a canonical bug.
  ref: concepts.md#equals-and-hashcode-contract-in-maps
- id: collections-hashmap-internals-037
  difficulty: intermediate
  tags:
  - records
  - jdk16
  - equals
  question: |
    Records, which auto-generate value-based equals(), hashCode(), and toString(), became a FINAL
    language feature in which JDK?
  options:
  - JDK 16 (JEP 395)
  - JDK 14
  - JDK 15
  - JDK 17
  answer: 0
  explanation: |
    Records previewed in JDK 14 and 15 and were finalized in JDK 16 via JEP 395. Their
    compiler-generated equals/hashCode from the record components make them excellent, bug-resistant
    HashMap keys, replacing hand-written boilerplate or Lombok's @EqualsAndHashCode.
  ref: concepts.md#equals-and-hashcode-contract-in-maps
- id: collections-hashmap-internals-038
  difficulty: advanced
  tags:
  - equals
  - hashcode
  - override-half
  question: |
    A class overrides hashCode() to return a value based on its fields but does NOT override
    equals(). What is the consequence when used as a HashMap key?
  options:
  - It works perfectly; hashCode alone is sufficient.
  - Logically-equal instances are treated as distinct keys because equals falls back to identity, allowing
    duplicate keys.
  - The map throws UnsupportedOperationException.
  - hashCode is ignored and identity is used for bucketing.
  answer: 1
  explanation: |
    With only hashCode overridden, two field-equal instances may share a bucket but fail the
    equals() identity check, so they are stored as separate entries — you get duplicate logical
    keys. Both methods must be overridden consistently.
  ref: concepts.md#equals-and-hashcode-contract-in-maps
- id: collections-hashmap-internals-039
  difficulty: intermediate
  tags:
  - objects
  - hashcode
  - null-safe
  question: |
    Which utility helps implement a null-safe equals/hashCode without writing null checks by hand
    (since Java 7)?
  options:
  - java.lang.Math
  - java.util.Arrays.deepEquals only
  - java.util.Objects (Objects.equals, Objects.hash)
  - java.util.Optional
  answer: 2
  explanation: |
    java.util.Objects (Java 7) provides Objects.equals(a, b) (null-safe) and Objects.hash(...)
    (varargs combining of field hashes). Note Objects.hash boxes into an array, so for hot paths a
    hand-rolled hashCode is faster.
  ref: concepts.md#equals-and-hashcode-contract-in-maps
- id: collections-hashmap-internals-040
  difficulty: advanced
  tags:
  - treemap
  - equals
  - compareto
  question: |
    Why can an object that behaves correctly as a HashMap key behave differently as a TreeMap key?
  options:
  - TreeMap uses hashCode but HashMap uses equals.
  - TreeMap requires keys to be Serializable.
  - HashMap ignores equals entirely.
  - TreeMap determines key identity via compareTo/compare (ignoring equals/hashCode), so a compare()==0
    that disagrees with equals() collapses distinct keys.
  answer: 3
  explanation: |
    TreeMap locates and dedups keys using the ordering (compareTo or Comparator), not equals or
    hashCode. If your compareTo returns 0 for two objects that equals() considers different, TreeMap
    treats them as one key — behavior that never occurs in a hash-based map.
  ref: concepts.md#equals-and-hashcode-contract-in-maps
- id: collections-hashmap-internals-041
  difficulty: beginner
  tags:
  - comparable
  - comparator
  - basics
  question: |
    What is the fundamental difference between Comparable and Comparator?
  options:
  - Comparable defines a class's natural ordering via compareTo; Comparator is an external ordering via
    compare(a, b).
  - Comparable is for numbers; Comparator is for strings.
  - Comparable is in java.util; Comparator is in java.lang.
  - They are identical; the names are interchangeable.
  answer: 0
  explanation: |
    Comparable<T> (java.lang) is implemented by a class to define its single natural ordering via
    compareTo(T). Comparator<T> (java.util) is a separate object defining an alternative ordering
    via compare(T, T); a type can have many comparators.
  ref: concepts.md#comparable-vs-comparator
- id: collections-hashmap-internals-042
  difficulty: intermediate
  tags:
  - comparator
  - chaining
  - jdk8
  question: |
    Which Java 8 Comparator idiom sorts by lastName ascending, then firstName ascending?
  options:
  - Comparator.comparing(Person::getLastName).andThen(Person::getFirstName)
  - Comparator.comparing(Person::getLastName).thenComparing(Person::getFirstName)
  - Comparator.sort(Person::getLastName, Person::getFirstName)
  - Person::getLastName.compose(Person::getFirstName)
  answer: 1
  explanation: |
    Comparator.comparing(...).thenComparing(...) composes multi-key ordering (since Java 8).
    andThen belongs to Function, not Comparator; there is no Comparator.sort factory; compose is
    also a Function method.
  ref: concepts.md#comparable-vs-comparator
- id: collections-hashmap-internals-043
  difficulty: advanced
  tags:
  - comparator
  - overflow
  - code-analysis
  question: |
    Why is `(a, b) -> a.getValue() - b.getValue()` (getValue returns int) a dangerous Comparator
    implementation?
  options:
  - Subtraction is slower than Integer.compare.
  - It returns a long, which does not compile.
  - For large-magnitude or opposite-sign values the subtraction can overflow, flipping the sign and producing
    a wrong or inconsistent ordering.
  - It cannot be used with thenComparing.
  answer: 2
  explanation: |
    Integer subtraction can overflow (e.g. Integer.MAX_VALUE - (-1)), wrapping to a negative
    result and inverting the comparison. This yields an inconsistent (non-transitive) order and can
    trigger TimSort's "Comparison method violates its general contract" error. Use
    Integer.compare(a, b) or Comparator.comparingInt.
  ref: concepts.md#comparable-vs-comparator
- id: collections-hashmap-internals-044
  difficulty: advanced
  tags:
  - comparator
  - timsort
  - contract
  question: |
    Collections.sort throws `IllegalArgumentException: Comparison method violates its general
    contract!`. What is the root cause?
  options:
  - The list contains null elements.
  - The list is too large to sort.
  - The comparator returns only 0.
  - The comparator is not a consistent total order (e.g. violates transitivity), which TimSort detects.
  answer: 3
  explanation: |
    TimSort relies on a self-consistent total ordering. If the comparator is intransitive or
    inconsistent (a common cause is integer-overflow subtraction), TimSort detects the contradiction
    mid-merge and throws IllegalArgumentException. The fix is a correct comparator, not smaller data.
  ref: concepts.md#comparable-vs-comparator
- id: collections-hashmap-internals-045
  difficulty: intermediate
  tags:
  - comparator
  - nulls
  question: |
    Which Comparator factory safely orders a stream where some keys may be null, placing nulls
    last?
  options:
  - Comparator.nullsLast(Comparator.naturalOrder())
  - Comparator.naturalOrder()
  - Comparator.reverseOrder()
  - Comparator.comparingInt(x -> 0)
  answer: 0
  explanation: |
    Comparator.nullsLast wraps another comparator so nulls sort to the end (nullsFirst puts them
    at the start). naturalOrder alone throws NPE on null elements. This is the idiomatic null-safe
    ordering in Java 8+.
  ref: concepts.md#comparable-vs-comparator
- id: collections-hashmap-internals-046
  difficulty: expert
  tags:
  - comparator
  - reversed
  - chaining
  question: |
    Given `Comparator.comparing(P::getA).thenComparing(P::getB).reversed()`, how does reversed()
    affect the ordering?
  options:
  - It reverses only the getB portion of the ordering.
  - It reverses the entire composed comparator (both getA and getB), effectively sorting by getA descending
    then getB descending.
  - It has no effect on a chained comparator.
  - It reverses only the getA portion.
  answer: 1
  explanation: |
    reversed() wraps and inverts the whole comparator it is called on — here the full A-then-B
    composite. To reverse only one key you must call reversed on that key's comparator before
    composing, e.g. comparing(P::getA).thenComparing(Comparator.comparing(P::getB).reversed()).
  ref: concepts.md#comparable-vs-comparator
- id: collections-hashmap-internals-047
  difficulty: beginner
  tags:
  - queue
  - deque
  question: |
    Which interface represents a double-ended queue supporting insertion and removal at both ends?
  options:
  - List
  - SortedSet
  - Deque
  - NavigableMap
  answer: 2
  explanation: |
    Deque (double-ended queue) supports addFirst/addLast, pollFirst/pollLast, etc. ArrayDeque and
    LinkedList implement it. It can serve as both a stack and a queue.
  ref: concepts.md#collection-hierarchy
- id: collections-hashmap-internals-048
  difficulty: intermediate
  tags:
  - hashset
  - hashmap
  - relationship
  question: |
    How is HashSet typically implemented internally?
  options:
  - As a red-black tree.
  - As a resizable array of unique elements.
  - As a linked list with duplicate checks on each add.
  - By delegating to a backing HashMap where elements are keys and a shared dummy Object is the value.
  answer: 3
  explanation: |
    HashSet wraps a HashMap: each element is stored as a key mapped to a constant PRESENT dummy
    value. Thus HashSet inherits HashMap's hashing, load factor, and treeification behavior, and
    the same equals/hashCode requirements apply to elements.
  ref: concepts.md#collection-hierarchy
- id: collections-hashmap-internals-049
  difficulty: advanced
  tags:
  - hashmap
  - get-path
  - chain
  question: |
    When HashMap.get walks a bucket's linked list, what comparison does it perform on each node to
    identify a match?
  options:
  - First compares the stored int hash; if equal, then checks (k == key || key.equals(k)).
  - Only key.equals(k).
  - Only reference identity (k == key).
  - Compares toString() of the keys.
  answer: 0
  explanation: |
    Each node caches its (perturbed) hash. get first compares that cached int hash (a cheap
    short-circuit); only when hashes match does it perform the reference-or-equals check
    (k == key || key.equals(k)). This avoids costly equals calls for hash mismatches.
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-050
  difficulty: intermediate
  tags:
  - concurrenthashmap
  - atomic-ops
  question: |
    To atomically insert a computed value only if a key is absent in a ConcurrentHashMap, which
    method should you use?
  options:
  - get followed by put (check-then-act).
  - computeIfAbsent(key, mappingFunction).
  - putAll(Map.of(key, value)).
  - replace(key, value).
  answer: 1
  explanation: |
    computeIfAbsent performs the check-and-insert atomically within the bin lock, avoiding the
    race present in a separate get-then-put. Note: the mapping function must not update the same
    map (Java 9+ can throw/deadlock). replace only acts when the key is already present.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-051
  difficulty: expert
  tags:
  - treeification
  - comparable
  - tie-break
  question: |
    Inside a treeified HashMap bucket, when two keys have equal hashes and are NOT mutually
    Comparable, how are they ordered within the red-black tree?
  options:
  - Insertion is rejected with an exception.
  - By calling equals repeatedly until an order emerges.
  - By a tie-breaking rule using class name and System.identityHashCode.
  - By their toString() lengths.
  answer: 2
  explanation: |
    Tree nodes are ordered primarily by hash, then by Comparable if the keys implement it and are
    mutually comparable. When they are not, HashMap falls back to a deterministic tie-break
    (tieBreakOrder) using the classes' names and, if still tied, System.identityHashCode, so the
    tree stays well-defined without requiring Comparable keys.
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-052
  difficulty: intermediate
  tags:
  - treemap
  - navigablemap
  - range
  question: |
    Which method set is available on TreeMap (via NavigableMap) but NOT on HashMap?
  options:
  - put, get, remove
  - containsKey, containsValue
  - keySet, values, entrySet
  - floorKey, ceilingKey, headMap, tailMap, subMap
  answer: 3
  explanation: |
    NavigableMap adds ordered navigation and range operations (floorKey, ceilingKey, lowerKey,
    higherKey, headMap, tailMap, subMap, firstEntry, lastEntry). HashMap, being unordered, offers
    none of these. The other options are standard Map methods present on both.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-053
  difficulty: beginner
  tags:
  - hashtable
  - legacy
  question: |
    Which statement about Hashtable is correct?
  options:
  - It is a legacy, fully-synchronized class largely superseded by ConcurrentHashMap.
  - It is the recommended modern concurrent map.
  - It allows one null key like HashMap.
  - It preserves insertion order.
  answer: 0
  explanation: |
    Hashtable predates the Collections Framework and synchronizes every method on the whole object,
    giving poor concurrency. It is considered legacy; ConcurrentHashMap (or synchronizedMap) is
    preferred. It rejects null keys/values and does not preserve insertion order.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-054
  difficulty: advanced
  tags:
  - code-analysis
  - hashmap
  - ordering
  question: |
    What is the most accurate statement about the iteration order of a plain HashMap?
  options:
  - It always iterates in insertion order.
  - It has no guaranteed order and may change across resizes or JDK versions.
  - It always iterates in sorted key order.
  - It iterates in reverse insertion order.
  answer: 1
  explanation: |
    HashMap makes no ordering guarantee. Order depends on hash values, bucket count, and internal
    layout, and can change when the map resizes or between JDK versions. For predictable order use
    LinkedHashMap (insertion/access) or TreeMap (sorted).
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-055
  difficulty: intermediate
  tags:
  - priorityqueue
  - ordering
  question: |
    What ordering does an element retrieved by PriorityQueue.poll() follow?
  options:
  - FIFO insertion order.
  - LIFO stack order.
  - The least element according to natural ordering or the supplied Comparator (a min-heap by default).
  - Random order.
  answer: 2
  explanation: |
    PriorityQueue is a binary heap; poll() returns the smallest element per natural ordering or the
    provided Comparator (a min-heap by default). Its own iterator does NOT traverse in sorted order;
    only repeated poll() yields sorted retrieval.
  ref: concepts.md#collection-hierarchy
- id: collections-hashmap-internals-056
  difficulty: expert
  tags:
  - concurrenthashmap
  - computeifabsent
  - recursion
  question: |
    Why can calling computeIfAbsent on a ConcurrentHashMap and, inside the mapping function,
    updating the SAME map be dangerous in Java 9+?
  options:
  - It always returns null.
  - It silently ignores the nested update.
  - It converts the map to a Hashtable.
  - The mapping function runs while holding the bin lock, so a reentrant modification of the same map
    can deadlock or throw IllegalStateException.
  answer: 3
  explanation: |
    computeIfAbsent executes the mapping function while synchronized on the bin. Recursively
    modifying the same map from within that function can cause a self-deadlock or, in Java 9+, an
    IllegalStateException ("Recursive update"). The documented rule is that the function must not
    modify the map it is operating on.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-057
  difficulty: intermediate
  tags:
  - copyonwrite
  - iterator
  - remove
  question: |
    What happens if you call remove() on the iterator of a CopyOnWriteArrayList?
  options:
  - It throws UnsupportedOperationException.
  - It removes the current element from the backing list.
  - It throws ConcurrentModificationException.
  - It marks the element for lazy deletion.
  answer: 0
  explanation: |
    CopyOnWriteArrayList's iterator operates on an immutable snapshot, so mutating operations
    (remove, set, add) throw UnsupportedOperationException. It never throws CME because it does not
    observe later modifications. Modify the list itself via its own methods instead.
  ref: concepts.md#fail-fast-vs-fail-safe-iterators
- id: collections-hashmap-internals-058
  difficulty: advanced
  tags:
  - hashmap
  - treeify
  - capacity-interaction
  question: |
    A HashMap has default capacity 16 and one bucket reaches 8 colliding entries. What does the
    map do?
  options:
  - Treeifies that bucket immediately.
  - Resizes (doubles the table) instead of treeifying, because capacity (16) is below MIN_TREEIFY_CAPACITY
    (64).
  - Throws an error.
  - Ignores further inserts into that bucket.
  answer: 1
  explanation: |
    Treeification requires capacity ≥ 64. At capacity 16 the map prefers to resize, which usually
    redistributes the colliding entries across more buckets. Only if collisions persist past
    capacity 64 will a bucket become a red-black tree.
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-059
  difficulty: intermediate
  tags:
  - synchronizedmap
  - iteration
  question: |
    When iterating a map returned by Collections.synchronizedMap, what must you do to avoid
    undefined behavior?
  options:
  - Nothing; iteration is automatically thread-safe.
  - Convert it to a ConcurrentHashMap first.
  - Manually synchronize on the returned map object during the entire iteration.
  - Call map.lock() before iterating.
  answer: 2
  explanation: |
    synchronizedMap synchronizes individual method calls but NOT compound iteration. You must wrap
    the whole loop in `synchronized (theMap) { ... }`, otherwise another thread can mutate it
    mid-iteration and cause CME or corruption. ConcurrentHashMap needs no such external lock.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-060
  difficulty: expert
  tags:
  - code-analysis
  - linkedhashmap
  - access-order
  question: |
    What does this print?

    ```java
    LinkedHashMap<Integer, String> m = new LinkedHashMap<>(16, 0.75f, true);
    m.put(1, "a"); m.put(2, "b"); m.put(3, "c");
    m.get(1);
    System.out.println(m.keySet());
    ```
  options:
  - '[1, 2, 3]'
  - '[3, 2, 1]'
  - '[1, 3, 2]'
  - '[2, 3, 1]'
  answer: 3
  explanation: |
    The constructor's third arg true enables access-order. Accessing key 1 via get moves it to the
    end of the linked list, so iteration order becomes [2, 3, 1]. In default insertion order
    (false) it would remain [1, 2, 3]. This access-order behavior underpins LRU caches.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-061
  difficulty: beginner
  tags:
  - comparable
  - treeset
  question: |
    You add instances of your own class to a TreeSet using its no-arg constructor, but the class
    does not implement Comparable. What happens?
  options:
  - A ClassCastException is thrown when the second, uncomparable element is added.
  - Elements are stored in insertion order.
  - The set silently drops all elements.
  - It compiles error at the add call.
  answer: 0
  explanation: |
    A TreeSet with natural ordering requires elements to be mutually Comparable. With no Comparator
    supplied, adding a second element triggers a cast to Comparable and throws ClassCastException at
    runtime. Supply a Comparator or implement Comparable to fix it.
  ref: concepts.md#comparable-vs-comparator
- id: collections-hashmap-internals-062
  difficulty: advanced
  tags:
  - equals
  - symmetry
  - contract
  question: |
    Which of these is a required property of a correct equals() implementation?
  options:
  - 'It must be asymmetric: a.equals(b) implies !b.equals(a).'
  - It must be reflexive, symmetric, transitive, and consistent.
  - It must return true for any two objects of the same class.
  - It must compare object memory addresses only.
  answer: 1
  explanation: |
    The equals contract requires reflexivity (a.equals(a)), symmetry (a.equals(b) iff b.equals(a)),
    transitivity, consistency, and that x.equals(null) is false. Asymmetry would violate the
    contract; comparing addresses only is identity equality, not logical equality.
  ref: concepts.md#equals-and-hashcode-contract-in-maps
- id: collections-hashmap-internals-063
  difficulty: intermediate
  tags:
  - hierarchy
  - vector
  - legacy
  question: |
    Which List implementation is the legacy, fully-synchronized counterpart to ArrayList?
  options:
  - LinkedList
  - CopyOnWriteArrayList
  - Vector
  - ArrayDeque
  answer: 2
  explanation: |
    Vector is a legacy (Java 1.0) resizable-array List whose methods are synchronized. It is
    generally avoided in favor of ArrayList (unsynchronized) plus explicit synchronization or
    CopyOnWriteArrayList/Collections.synchronizedList when concurrency is needed. ArrayDeque is not
    a List.
  ref: concepts.md#collection-hierarchy
- id: collections-hashmap-internals-064
  difficulty: expert
  tags:
  - hashmap
  - load-factor
  - tradeoff
  question: |
    Increasing a HashMap's load factor from 0.75 to 0.95 has which trade-off?
  options:
  - Higher memory use and faster lookups.
  - No effect on anything.
  - It disables treeification permanently.
  - Lower memory use but more collisions and slower average lookups.
  answer: 3
  explanation: |
    A higher load factor lets the table fill more before resizing, saving memory but packing more
    entries per bucket, which increases collisions and lengthens chains, slowing average get/put.
    A lower load factor does the reverse (more memory, fewer collisions). 0.75 is the balanced
    default.
  ref: concepts.md#hashmap-internals
- id: collections-hashmap-internals-065
  difficulty: intermediate
  tags:
  - map-methods
  - jdk8
  - getordefault
  question: |
    Which Java 8 Map method returns a supplied default when a key is absent, without inserting
    anything?
  options:
  - getOrDefault
  - putIfAbsent
  - merge
  - compute
  answer: 0
  explanation: |
    getOrDefault(key, defaultValue) (since Java 8) returns the mapped value or the default if the
    key is absent, and does NOT modify the map. putIfAbsent, merge, and compute all can insert or
    change mappings.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
- id: collections-hashmap-internals-066
  difficulty: advanced
  tags:
  - code-analysis
  - map-merge
  question: |
    What does this print?

    ```java
    Map<String, Integer> counts = new HashMap<>();
    for (String w : List.of("a", "b", "a", "a")) {
        counts.merge(w, 1, Integer::sum);
    }
    System.out.println(counts.get("a"));
    ```
  options:
  - '1'
  - '3'
  - 'null'
  - It throws NullPointerException on the first merge.
  answer: 1
  explanation: |
    merge inserts the value (1) if the key is absent, otherwise applies the remapping function
    (Integer::sum) to the existing and new values. "a" occurs three times, so its count becomes 3.
    merge handles the absent-key case without NPE, making it the idiomatic frequency-counting tool.
  ref: concepts.md#hashmap-vs-hashtable-vs-concurrenthashmap-vs-linkedhashmap-vs-treemap
