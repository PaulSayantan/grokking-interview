topic: "Java 8 Functional Interfaces and Method References"
domain: java-jvm
topic_slug: java8-functional-interfaces-method-references
version: 1
questions:
  - id: java8-functional-interfaces-method-references-001
    difficulty: beginner
    tags: [functional-interface, sam, definition]
    question: |
      What is the defining characteristic of a functional interface in Java 8?
    options:
      - "It has exactly one abstract method (the Single Abstract Method)."
      - "It has no methods at all, only constants."
      - "It must be annotated with @Override on every method."
      - "It can only be implemented by anonymous inner classes, never by lambdas."
    answer: 0
    explanation: |
      A functional interface has exactly one abstract method — the SAM. That single method
      is what a lambda or method reference implements. default, static, and Object-inherited
      public methods do not count toward the limit. @FunctionalInterface merely asks the
      compiler to verify this; it is not required. Interfaces with no methods (marker
      interfaces) cannot be lambda targets.
    ref: "concepts.md#functionalinterface-and-the-sam-concept"

  - id: java8-functional-interfaces-method-references-002
    difficulty: beginner
    tags: [annotation, functional-interface]
    question: |
      Is the @FunctionalInterface annotation required for an interface to be used as a
      lambda target?
    options:
      - "Yes, without it the compiler rejects any lambda assigned to the interface."
      - "No, it is optional; it only makes the compiler verify the single-abstract-method rule."
      - "Yes, and it must also be placed on the abstract method."
      - "No, but it changes the interface's runtime behavior by adding a default method."
    answer: 1
    explanation: |
      The annotation is optional and documentary. Any interface that structurally qualifies
      (one abstract method) can be a lambda target with or without it. What the annotation
      does is trigger a compile-time check that fails if the interface does not have exactly
      one abstract method — a safety net for maintainers. It changes nothing at runtime.
    ref: "concepts.md#functionalinterface-and-the-sam-concept"

  - id: java8-functional-interfaces-method-references-003
    difficulty: intermediate
    tags: [functional-interface, object-methods, comparator]
    question: |
      Consider this interface:

      ```java
      @FunctionalInterface
      interface Foo<T> {
          int compare(T a, T b);
          boolean equals(Object o);
      }
      ```

      Does it compile, and why?
    options:
      - "No — it has two abstract methods, so @FunctionalInterface fails."
      - "No — you cannot redeclare equals in an interface."
      - "Yes — equals(Object) is a public method of java.lang.Object, so it does not count toward the SAM limit; compare is the only real abstract method."
      - "Yes — but only because equals is implicitly made a default method."
    answer: 2
    explanation: |
      Public methods inherited from Object (equals, hashCode, toString) are exempt from the
      single-abstract-method count. Redeclaring them in an interface is legal and does not
      break functional-interface status. This is exactly why java.util.Comparator, which
      declares int compare(T,T) plus boolean equals(Object), is a valid functional interface.
    ref: "concepts.md#functionalinterface-and-the-sam-concept"

  - id: java8-functional-interfaces-method-references-004
    difficulty: beginner
    tags: [catalog, supplier]
    question: |
      Which functional interface takes no arguments and produces a result of type T?
    options:
      - "Consumer<T>"
      - "Function<T,R>"
      - "Predicate<T>"
      - "Supplier<T>"
    answer: 3
    explanation: |
      Supplier<T> declares T get() — no input, produces a T. Consumer takes a T and returns
      nothing (void accept(T)). Function transforms T to R. Predicate takes a T and returns
      boolean. Supplier is commonly used for lazy value creation, e.g. Optional.orElseGet.
    ref: "concepts.md#the-javautilfunction-catalog"

  - id: java8-functional-interfaces-method-references-005
    difficulty: beginner
    tags: [catalog, consumer]
    question: |
      What is the abstract method signature of Consumer<T>?
    options:
      - "void accept(T t)"
      - "T get()"
      - "boolean test(T t)"
      - "R apply(T t)"
    answer: 0
    explanation: |
      Consumer<T> has void accept(T t): it consumes an input and returns nothing (a side
      effect, e.g. printing). get() belongs to Supplier, test() to Predicate, apply() to
      Function.
    ref: "concepts.md#the-javautilfunction-catalog"

  - id: java8-functional-interfaces-method-references-006
    difficulty: beginner
    tags: [catalog, predicate]
    question: |
      Which interface is designed to test a condition and return a boolean?
    options:
      - "Supplier<T>"
      - "Predicate<T>"
      - "UnaryOperator<T>"
      - "BiFunction<T,U,R>"
    answer: 1
    explanation: |
      Predicate<T> declares boolean test(T t). It is the standard choice for filtering
      (Stream.filter, Collection.removeIf). The others do not return boolean as their core
      contract.
    ref: "concepts.md#the-javautilfunction-catalog"

  - id: java8-functional-interfaces-method-references-007
    difficulty: intermediate
    tags: [catalog, unary-operator, binary-operator]
    question: |
      How do UnaryOperator<T> and BinaryOperator<T> relate to Function and BiFunction?
    options:
      - "They are unrelated interfaces that happen to share method names."
      - "Function extends UnaryOperator, and BiFunction extends BinaryOperator."
      - "UnaryOperator<T> extends Function<T,T>, and BinaryOperator<T> extends BiFunction<T,T,T>; they fix the type parameters to a single type."
      - "They are primitive-only specializations and cannot be used with reference types."
    answer: 2
    explanation: |
      UnaryOperator<T> is a Function whose input and output are the same type T; it extends
      Function<T,T>. BinaryOperator<T> extends BiFunction<T,T,T>. This gives cleaner
      signatures for APIs like List.replaceAll(UnaryOperator) and Stream.reduce(BinaryOperator).
      They work with any reference type; primitive variants are separate.
    ref: "concepts.md#the-javautilfunction-catalog"

  - id: java8-functional-interfaces-method-references-008
    difficulty: intermediate
    tags: [catalog, primitive, method-name]
    question: |
      What is the name of the abstract method on IntSupplier?
    options:
      - "get()"
      - "applyAsInt()"
      - "supplyInt()"
      - "getAsInt()"
    answer: 3
    explanation: |
      Primitive specializations rename the abstract method to reflect the primitive.
      IntSupplier declares int getAsInt(); LongSupplier has getAsLong(); ToIntFunction has
      applyAsInt; IntUnaryOperator has applyAsInt. Only the generic interfaces use the plain
      get/apply/accept/test names. This trips people up when implementing them explicitly.
    ref: "concepts.md#the-javautilfunction-catalog"

  - id: java8-functional-interfaces-method-references-009
    difficulty: intermediate
    tags: [catalog, primitive, performance]
    question: |
      Why do primitive specializations like IntPredicate and ToIntFunction exist in
      java.util.function?
    options:
      - "They avoid autoboxing/unboxing overhead when working with int, long, or double values."
      - "They provide extra methods not available on the generic versions."
      - "They are required because generics cannot be used with lambdas."
      - "They exist only for backward compatibility with Java 7."
    answer: 0
    explanation: |
      Generic interfaces work on reference types, so using them with primitives forces
      boxing (int to Integer) and unboxing, which creates garbage and costs CPU in hot loops
      and streams. The primitive specializations operate directly on int/long/double,
      eliminating that overhead. Generics work fine with lambdas; there is no Java 7 story
      here (the whole package is Java 8).
    ref: "concepts.md#the-javautilfunction-catalog"

  - id: java8-functional-interfaces-method-references-010
    difficulty: advanced
    tags: [catalog, primitive, mapping]
    question: |
      You have a Stream<String> and want an IntStream of their lengths without boxing.
      Which functional interface does Stream.mapToInt expect?
    options:
      - "Function<String,Integer>"
      - "ToIntFunction<String>"
      - "IntFunction<String>"
      - "IntUnaryOperator"
    answer: 1
    explanation: |
      mapToInt takes a ToIntFunction<? super T>, i.e. T to int (applyAsInt). String::length
      fits ToIntFunction<String>. Function<String,Integer> would box. IntFunction<R> is
      int to R (the opposite direction). IntUnaryOperator is int to int, wrong input type.
    ref: "concepts.md#the-javautilfunction-catalog"

  - id: java8-functional-interfaces-method-references-011
    difficulty: beginner
    tags: [composing, function, andthen]
    question: |
      Given `Function<Integer,Integer> f = x -> x + 1;` and
      `Function<Integer,Integer> g = x -> x * 2;`, what does `f.andThen(g).apply(3)` return?
    options:
      - "7"
      - "6"
      - "8"
      - "9"
    answer: 2
    explanation: |
      andThen runs f first, then g on the result: g(f(3)) = g(4) = 8. If it were
      f.compose(g), it would be f(g(3)) = f(6) = 7. Remember: andThen = this-first,
      compose = argument-first.
    ref: "concepts.md#composing-functions"

  - id: java8-functional-interfaces-method-references-012
    difficulty: intermediate
    tags: [composing, function, compose]
    question: |
      Given `Function<Integer,Integer> times2 = x -> x*2;` and
      `Function<Integer,Integer> plus3 = x -> x+3;`, what is
      `times2.compose(plus3).apply(5)`?
    options:
      - "13"
      - "10"
      - "25"
      - "16"
    answer: 3
    explanation: |
      compose applies the argument function first: times2(plus3(5)) = times2(8) = 16.
      Contrast with times2.andThen(plus3).apply(5) = plus3(times2(5)) = plus3(10) = 13.
    ref: "concepts.md#composing-functions"

  - id: java8-functional-interfaces-method-references-013
    difficulty: intermediate
    tags: [composing, predicate, short-circuit]
    question: |
      Which statement about Predicate.and / or is TRUE?
    options:
      - "and and or short-circuit exactly like the && and || operators."
      - "and and or evaluate both predicates always, with no short-circuiting."
      - "or throws if the first predicate returns false."
      - "and can only be called on primitive predicates like IntPredicate."
    answer: 0
    explanation: |
      Predicate.and short-circuits: if the first test returns false, the second is not
      evaluated. Predicate.or short-circuits when the first returns true. This mirrors && and
      ||. The default-method implementations are literally `(t) -> test(t) && other.test(t)`
      etc. They are available on the generic Predicate as well as primitive variants.
    ref: "concepts.md#composing-functions"

  - id: java8-functional-interfaces-method-references-014
    difficulty: advanced
    tags: [composing, predicate, precedence]
    question: |
      For predicates p1, p2, p3, how is `p1.and(p2).or(p3)` grouped?
    options:
      - "p1 AND (p2 OR p3), because OR binds tighter."
      - "(p1 AND p2) OR p3, because the methods are simply applied left to right."
      - "It is a compile error; you cannot chain and then or."
      - "p1 AND p2 AND p3, because or is ignored after and."
    answer: 1
    explanation: |
      Method calls have no operator precedence; they evaluate left to right. p1.and(p2)
      produces a new predicate, and .or(p3) ORs that result with p3, giving (p1 AND p2) OR p3.
      If you want p1 AND (p2 OR p3), you must write p1.and(p2.or(p3)).
    ref: "concepts.md#composing-functions"

  - id: java8-functional-interfaces-method-references-015
    difficulty: expert
    tags: [composing, unary-operator, typing]
    question: |
      You chain two UnaryOperator<String> values: `UnaryOperator<String> a = ...; a.andThen(b)`.
      What is the compile-time type of the result?
    options:
      - "UnaryOperator<String>"
      - "BinaryOperator<String>"
      - "Function<String,String>"
      - "It does not compile; UnaryOperator has no andThen."
    answer: 2
    explanation: |
      UnaryOperator inherits andThen from Function without overriding its return type, so
      andThen returns Function<String,String>, not UnaryOperator<String>. It compiles fine
      (andThen is inherited), but if you need a UnaryOperator you must adapt it, e.g.
      `UnaryOperator<String> c = s -> a.andThen(b).apply(s);`.
    ref: "concepts.md#composing-functions"

  - id: java8-functional-interfaces-method-references-016
    difficulty: intermediate
    tags: [composing, consumer, andthen]
    question: |
      What does this print?

      ```java
      Consumer<String> a = s -> System.out.print("A" + s);
      Consumer<String> b = s -> System.out.print("B" + s);
      a.andThen(b).accept("1");
      ```
    options:
      - "A1"
      - "B1A1"
      - "A1B(result of a)"
      - "A1B1"
    answer: 3
    explanation: |
      Consumer.andThen performs this consumer first, then the after consumer, and BOTH
      receive the same original input "1". So it prints A1 then B1 → "A1B1". There is no
      compose on Consumer, and no result is threaded between them (Consumer returns void).
    ref: "concepts.md#composing-functions"

  - id: java8-functional-interfaces-method-references-017
    difficulty: intermediate
    tags: [composing, function-identity]
    question: |
      What does Function.identity() return, and where is it commonly used?
    options:
      - "A function t -> t; commonly used as the value mapper in Collectors.toMap."
      - "A function that returns null for any input."
      - "A Supplier that produces a new object each call."
      - "A Predicate that is always true."
    answer: 0
    explanation: |
      Function.identity() is a static method returning t -> t. It is frequently used in
      Collectors.toMap(keyMapper, Function.identity()) to store the element itself as the
      value. It is not a Supplier or Predicate.
    ref: "concepts.md#composing-functions"

  - id: java8-functional-interfaces-method-references-018
    difficulty: beginner
    tags: [method-reference, kinds]
    question: |
      How many distinct kinds of method reference does Java define?
    options:
      - "Two"
      - "Four"
      - "Three"
      - "Five"
    answer: 1
    explanation: |
      Four: static (Type::staticMethod), bound instance (instance::method), unbound instance
      (Type::instanceMethod), and constructor (Type::new). Each maps to a specific lambda
      shape.
    ref: "concepts.md#the-four-method-reference-kinds"

  - id: java8-functional-interfaces-method-references-019
    difficulty: beginner
    tags: [method-reference, static]
    question: |
      `Integer::parseInt` is which kind of method reference?
    options:
      - "Bound instance reference"
      - "Unbound instance reference"
      - "Static method reference"
      - "Constructor reference"
    answer: 2
    explanation: |
      parseInt is a static method of Integer, so Integer::parseInt is a static method
      reference equivalent to s -> Integer.parseInt(s). It fits Function<String,Integer>.
    ref: "concepts.md#the-four-method-reference-kinds"

  - id: java8-functional-interfaces-method-references-020
    difficulty: intermediate
    tags: [method-reference, bound-vs-unbound]
    question: |
      Which best describes the difference between `String::toUpperCase` and
      `"hello"::toUpperCase`?
    options:
      - "Both are bound references; they behave identically."
      - "String::toUpperCase is a static reference; \"hello\"::toUpperCase is unbound."
      - "Neither compiles because toUpperCase takes no arguments."
      - "String::toUpperCase is unbound (the receiver comes from the first argument); \"hello\"::toUpperCase is bound (receiver is the literal captured now)."
    answer: 3
    explanation: |
      String::toUpperCase uses a type name on the left, so it is an unbound instance
      reference: the first lambda parameter becomes the receiver — it fits
      Function<String,String>, i.e. s -> s.toUpperCase(). "hello"::toUpperCase uses a value
      on the left, so the receiver is fixed to that literal now — it fits Supplier<String>,
      i.e. () -> "hello".toUpperCase().
    ref: "concepts.md#the-four-method-reference-kinds"

  - id: java8-functional-interfaces-method-references-021
    difficulty: intermediate
    tags: [method-reference, unbound]
    question: |
      To which lambda is the unbound reference `String::equals` equivalent?
    options:
      - "(a, b) -> a.equals(b)"
      - "() -> \"\".equals(\"\")"
      - "(a) -> a.equals(a)"
      - "(a, b) -> String.equals(a, b)"
    answer: 0
    explanation: |
      For an unbound instance reference Type::method, the first parameter is the receiver and
      the rest are arguments. equals takes one argument, so String::equals corresponds to
      (a, b) -> a.equals(b), fitting BiPredicate<String,String> (or BiFunction returning
      Boolean). There is no static String.equals(a,b).
    ref: "concepts.md#the-four-method-reference-kinds"

  - id: java8-functional-interfaces-method-references-022
    difficulty: beginner
    tags: [method-reference, constructor]
    question: |
      What kind of method reference is `ArrayList::new` and what does it typically target?
    options:
      - "A static reference to a factory method named new."
      - "A constructor reference; e.g. a Supplier<List<T>> producing new ArrayList instances."
      - "An unbound instance reference to an instance method."
      - "It is invalid syntax; you must write new ArrayList()."
    answer: 1
    explanation: |
      Type::new is a constructor reference. ArrayList::new with a no-arg target fits
      Supplier<List<T>> (() -> new ArrayList<>()). If the target takes an int, it can bind to
      the ArrayList(int) capacity constructor via Function<Integer,List<T>>.
    ref: "concepts.md#the-four-method-reference-kinds"

  - id: java8-functional-interfaces-method-references-023
    difficulty: advanced
    tags: [method-reference, bound, evaluation-timing]
    question: |
      Consider:

      ```java
      List<String> getList() { System.out.print("called "); return new ArrayList<>(); }
      Consumer<String> c = getList()::add;
      c.accept("a");
      c.accept("b");
      ```

      How many times is "called " printed?
    options:
      - "Zero — getList() is never invoked."
      - "Twice — once per accept call."
      - "Once — the receiver of a bound reference is evaluated when the reference expression is evaluated, then captured."
      - "Three — once at declaration and once per accept."
    answer: 2
    explanation: |
      In a bound method reference expr::m, the expression expr is evaluated exactly once,
      at the point the method-reference expression is evaluated, and the resulting object is
      captured. So getList() runs once (prints "called " once); both accept calls add to the
      same captured list.
    ref: "concepts.md#the-four-method-reference-kinds"

  - id: java8-functional-interfaces-method-references-024
    difficulty: advanced
    tags: [method-reference, ambiguity, overload]
    question: |
      A type has both `static int size(String s)` and `int size()` (instance). You write
      `Function<String,Integer> f = MyType::size;`. What happens?
    options:
      - "It always picks the static method."
      - "It always picks the instance method."
      - "It is a runtime error, not a compile error."
      - "It may be ambiguous — Type::name can match either a static method or an unbound instance method, and if both fit the target type the compiler reports an ambiguity error."
    answer: 3
    explanation: |
      For Type::name the compiler considers both the static interpretation (static size(String))
      and the unbound-instance interpretation (String receiver calling size()). Here both fit
      Function<String,Integer>, so the reference is ambiguous and javac reports a compile-time
      error. You disambiguate by using a lambda or changing the target.
    ref: "concepts.md#the-four-method-reference-kinds"

  - id: java8-functional-interfaces-method-references-025
    difficulty: advanced
    tags: [method-reference, array-constructor]
    question: |
      What does `IntFunction<int[]> f = int[]::new; int[] a = f.apply(5);` produce?
    options:
      - "An int array of length 5 (equivalent to n -> new int[n])."
      - "A compile error — arrays have no constructor reference."
      - "An int array containing the single value 5."
      - "A NullPointerException at apply time."
    answer: 0
    explanation: |
      Array constructor references type[]::new are legal and behave like n -> new type[n].
      IntFunction<int[]> is exactly the right target: apply(5) yields a new int[5]. This form
      is heavily used with Stream.toArray(String[]::new) and similar.
    ref: "concepts.md#the-four-method-reference-kinds"

  - id: java8-functional-interfaces-method-references-026
    difficulty: intermediate
    tags: [method-reference, bound, println]
    question: |
      `System.out::println` is which kind of method reference?
    options:
      - "Static reference"
      - "Bound instance reference (receiver is the System.out object)"
      - "Unbound instance reference"
      - "Constructor reference"
    answer: 1
    explanation: |
      System.out is a value (a PrintStream instance), so System.out::println binds that
      specific object as the receiver — a bound instance reference equivalent to
      x -> System.out.println(x), fitting Consumer<T>.
    ref: "concepts.md#the-four-method-reference-kinds"

  - id: java8-functional-interfaces-method-references-027
    difficulty: beginner
    tags: [default-methods, definition]
    question: |
      What is a default method in a Java 8 interface?
    options:
      - "An abstract method that must be implemented by every class."
      - "A method that runs only if no other method matches."
      - "A concrete method with a body declared using the default keyword, providing an implementation that implementers inherit."
      - "A private helper method usable only inside the interface."
    answer: 2
    explanation: |
      A default method has a body and is declared with the default keyword. Implementing
      classes inherit it and may override it. It does not count toward the SAM total. Private
      interface methods (a separate feature) arrived in Java 9, not Java 8.
    ref: "concepts.md#default-and-static-methods-on-interfaces"

  - id: java8-functional-interfaces-method-references-028
    difficulty: intermediate
    tags: [default-methods, motivation, interface-evolution]
    question: |
      What core problem were default methods introduced to solve in Java 8?
    options:
      - "To allow interfaces to have instance fields."
      - "To make interfaces instantiable with new."
      - "To replace abstract classes entirely."
      - "Interface evolution: adding methods like stream()/forEach() to existing interfaces such as Collection without breaking all existing implementers."
    answer: 3
    explanation: |
      Adding a new abstract method to Collection would have broken every existing
      implementation that did not define it. Default methods let the JDK ship new methods
      (forEach, stream, removeIf, etc.) with a working implementation, so old code keeps
      compiling. Interfaces still cannot have instance state and cannot be instantiated.
    ref: "concepts.md#default-and-static-methods-on-interfaces"

  - id: java8-functional-interfaces-method-references-029
    difficulty: advanced
    tags: [default-methods, diamond, conflict-resolution]
    question: |
      A class C implements both A and B, and both declare `default String hi()`. What must C do?
    options:
      - "C must override hi() to resolve the conflict, optionally delegating via A.super.hi() or B.super.hi()."
      - "Nothing — Java picks A's version alphabetically."
      - "Nothing — Java picks B's version because it was listed last."
      - "It is impossible; a class cannot implement two interfaces with default methods."
    answer: 0
    explanation: |
      When two unrelated interfaces provide the same default method, the class inherits an
      ambiguous conflict and must override the method. It can delegate explicitly using
      InterfaceName.super.method(). Java does not pick alphabetically or by listing order.
      (If one interface extended the other, the more specific subinterface would win
      automatically.)
    ref: "concepts.md#default-and-static-methods-on-interfaces"

  - id: java8-functional-interfaces-method-references-030
    difficulty: advanced
    tags: [default-methods, class-wins]
    question: |
      When a superclass provides a concrete method and an implemented interface provides a
      default method of the same signature, which one wins?
    options:
      - "The interface default method always wins."
      - "The class (superclass) method wins — 'classes win over interfaces'."
      - "It is always a compile error."
      - "Whichever is declared with the @Override annotation."
    answer: 1
    explanation: |
      The first rule of default-method resolution is 'classes win over interfaces': a method
      inherited from a superclass takes precedence over a default from an interface. This
      prevents surprising behavior when mixing class hierarchies and interfaces.
    ref: "concepts.md#default-and-static-methods-on-interfaces"

  - id: java8-functional-interfaces-method-references-031
    difficulty: intermediate
    tags: [static-methods, interface]
    question: |
      Which statement about static methods on interfaces (Java 8) is correct?
    options:
      - "They are inherited by implementing classes and can be called on instances."
      - "They count as the interface's single abstract method."
      - "They belong to the interface and must be called via the interface name; they are not inherited by implementers."
      - "They cannot exist; only default methods can have bodies."
    answer: 2
    explanation: |
      Interface static methods (e.g. Comparator.comparing, Function.identity, Stream.of) are
      called via the interface name and are NOT inherited by implementing classes. They have
      bodies and do not count toward the SAM total. default methods are the other kind of
      concrete interface method.
    ref: "concepts.md#default-and-static-methods-on-interfaces"

  - id: java8-functional-interfaces-method-references-032
    difficulty: intermediate
    tags: [version, private-interface-methods]
    question: |
      Which Java version introduced private (and private static) methods in interfaces?
    options:
      - "Java 8"
      - "Java 11"
      - "Java 17"
      - "Java 9"
    answer: 3
    explanation: |
      Private interface methods were added in Java 9, not Java 8. They let default methods
      share code without exposing it as public API. Java 8 introduced only default and static
      interface methods. Confusing these is a common interview trap.
    ref: "concepts.md#default-and-static-methods-on-interfaces"

  - id: java8-functional-interfaces-method-references-033
    difficulty: beginner
    tags: [target-typing, poly-expression]
    question: |
      Why can the same lambda `() -> "hi"` be assigned to different interface types depending
      on context?
    options:
      - "Because a lambda is a poly expression with no standalone type; its type is decided by the target type of the context."
      - "Because lambdas have a fixed type of java.lang.Object."
      - "Because the compiler creates a new class for every possible interface."
      - "Because lambdas can only be assigned to Runnable."
    answer: 0
    explanation: |
      A lambda has no intrinsic type; it is a poly expression whose type is determined by the
      target type (variable type, method parameter, return type, cast, ternary). () -> "hi"
      fits Callable<String> or Supplier<String> or any no-arg interface returning a String.
    ref: "concepts.md#target-typing-and-type-inference"

  - id: java8-functional-interfaces-method-references-034
    difficulty: intermediate
    tags: [target-typing, capture, effectively-final]
    question: |
      What does this code do?

      ```java
      int base = 10;
      Function<Integer,Integer> f = x -> x + base;
      base = 20;
      System.out.println(f.apply(1));
      ```
    options:
      - "Prints 21."
      - "Does not compile — base is not effectively final because it is reassigned."
      - "Prints 11."
      - "Throws at runtime."
    answer: 1
    explanation: |
      A lambda may only capture a local variable that is final or effectively final.
      Reassigning base = 20 after it is used in the lambda makes it NOT effectively final, so
      the program fails to compile. If the reassignment were removed, it would print 11.
    ref: "concepts.md#target-typing-and-type-inference"

  - id: java8-functional-interfaces-method-references-035
    difficulty: advanced
    tags: [target-typing, this-semantics]
    question: |
      Inside a lambda, what does the keyword `this` refer to?
    options:
      - "The lambda object itself, which is a new anonymous instance."
      - "null, because lambdas are static."
      - "The enclosing instance (the same this as the surrounding method); a lambda does not introduce a new this scope."
      - "The functional interface's default this implementation."
    answer: 2
    explanation: |
      A lambda is lexically scoped: this, super, and names resolve exactly as in the enclosing
      context, so this is the enclosing instance. This differs from an anonymous inner class,
      which introduces its own this. Consequently lambda parameters cannot shadow enclosing
      locals.
    ref: "concepts.md#target-typing-and-type-inference"

  - id: java8-functional-interfaces-method-references-036
    difficulty: advanced
    tags: [target-typing, capture, fields]
    question: |
      Can a lambda mutate state, given the effectively-final rule on local variables?
    options:
      - "No — lambdas can never modify any state."
      - "Yes — it can reassign any captured local as long as it is declared with var."
      - "No — even fields are frozen once captured by a lambda."
      - "Yes — it cannot reassign captured locals, but it CAN mutate fields (instance/static) and the contents of captured mutable objects."
    answer: 3
    explanation: |
      The effectively-final restriction applies only to captured LOCAL variables (you cannot
      reassign them). A lambda can freely read and write fields (captured via this), and it
      can mutate the internal state of a captured object (e.g. call list.add on a captured
      final List). var does not change the effectively-final rule.
    ref: "concepts.md#target-typing-and-type-inference"

  - id: java8-functional-interfaces-method-references-037
    difficulty: expert
    tags: [internals, invokedynamic, lambda-metafactory]
    question: |
      How does javac compile a lambda expression?
    options:
      - "It emits an invokedynamic instruction bootstrapped by LambdaMetafactory, so the implementation class is created dynamically at runtime."
      - "It generates a separate synthetic .class file (an inner class) for each lambda, exactly like an anonymous class."
      - "It inlines the lambda body directly into the caller as raw bytecode with no indirection."
      - "It converts the lambda into a reflective Proxy created via java.lang.reflect.Proxy."
    answer: 0
    explanation: |
      Lambdas are compiled to an invokedynamic call site whose bootstrap method is
      java.lang.invoke.LambdaMetafactory. The JVM links and spins up the implementing class
      on first execution. This avoids emitting a class file per lambda at compile time, gives
      a smaller footprint than anonymous classes, and lets the runtime cache stateless
      (non-capturing) lambda instances.
    ref: "concepts.md#target-typing-and-type-inference"

  - id: java8-functional-interfaces-method-references-038
    difficulty: expert
    tags: [internals, non-capturing, caching]
    question: |
      What is a practical performance consequence of how non-capturing lambdas are linked via
      invokedynamic?
    options:
      - "A new object is always allocated on every evaluation of the lambda expression."
      - "A non-capturing (stateless) lambda is typically instantiated once and reused (cached) across evaluations, avoiding per-use allocation."
      - "Non-capturing lambdas run on a dedicated thread pool."
      - "Non-capturing lambdas are slower than anonymous classes in every case."
    answer: 1
    explanation: |
      Because a non-capturing lambda has no captured state, the LambdaMetafactory-generated
      call site can return the same singleton instance every time, so evaluating the lambda
      expression repeatedly does not allocate. A capturing lambda must bind its captured
      values, so it generally allocates per capture. This is an advantage over always
      allocating a new anonymous-class instance.
    ref: "concepts.md#target-typing-and-type-inference"

  - id: java8-functional-interfaces-method-references-039
    difficulty: expert
    tags: [target-typing, overload-ambiguity]
    question: |
      Given overloads `void run(Runnable r)` and `void run(Callable<Object> c)` and a method
      `Object compute()`, why does `run(() -> compute());` fail to compile, and how do you fix it?
    options:
      - "It fails because lambdas cannot call methods; inline the body instead."
      - "It fails because Callable is not a functional interface; remove that overload."
      - "It fails because () -> compute() is applicable to both overloads — a method-call body is both void-compatible (a statement expression) and value-compatible — so the call is ambiguous; fix by casting, e.g. run((Callable<Object>) () -> compute())."
      - "It compiles fine and always calls run(Runnable)."
    answer: 2
    explanation: |
      A method-call expression like compute() is a statement expression, so () -> compute() is
      both void-compatible (fits Runnable) and value-compatible (fits Callable<Object>). Both
      overloads are applicable and neither is more specific, so overload resolution is
      ambiguous. An explicit cast selects the target: run((Callable<Object>) () -> compute()).
      (By contrast, () -> null would NOT be ambiguous: null is not a statement expression, so
      the lambda is not void-compatible and only matches Callable.)
    ref: "concepts.md#target-typing-and-type-inference"

  - id: java8-functional-interfaces-method-references-040
    difficulty: intermediate
    tags: [target-typing, parameter-inference]
    question: |
      Which of the following lambda parameter declarations is ILLEGAL?
    options:
      - "(String s, String t) -> s + t"
      - "(s, t) -> s + t"
      - "(var s, var t) -> s + t"
      - "(String s, t) -> s + t"
    answer: 3
    explanation: |
      You must be all-or-nothing with parameter typing: either all explicit types, all
      implicit (inferred), or all var. Mixing an explicit type with an implicit one —
      (String s, t) — is illegal. The other three are each internally consistent (var forms
      require Java 11+).
    ref: "concepts.md#target-typing-and-type-inference"

  - id: java8-functional-interfaces-method-references-041
    difficulty: intermediate
    tags: [version, var-lambda-params]
    question: |
      Which Java release added support for `var` in lambda parameter lists, e.g.
      `(var x, var y) -> x + y`?
    options:
      - "Java 11 (JEP 323)"
      - "Java 8"
      - "Java 10"
      - "Java 17"
    answer: 0
    explanation: |
      JEP 323, Local-Variable Syntax for Lambda Parameters, shipped in Java 11. Java 10
      introduced var for local variables (JEP 286) but not in lambda parameters. Java 8 had
      neither. The main benefit is allowing annotations/modifiers on inferred-type lambda
      parameters uniformly.
    ref: "concepts.md#target-typing-and-type-inference"

  - id: java8-functional-interfaces-method-references-042
    difficulty: expert
    tags: [target-typing, var-lambda-rules]
    question: |
      Which lambda using var is ILLEGAL under JEP 323 rules?
    options:
      - "(var x, var y) -> x + y"
      - "(var x, y) -> x + y"
      - "(@NonNull var x) -> x"
      - "x -> x + 1"
    answer: 1
    explanation: |
      If you use var for one lambda parameter you must use it for ALL of them, and you cannot
      mix var with implicit (bare) or explicit types. (var x, y) mixes var with an implicit
      parameter, which is illegal. Using var uniformly, adding annotations to a var
      parameter, or omitting types entirely are all fine.
    ref: "concepts.md#target-typing-and-type-inference"

  - id: java8-functional-interfaces-method-references-043
    difficulty: advanced
    tags: [functional-interface, generic-method]
    question: |
      Why can an interface whose sole abstract method is generic, e.g.
      `<T> T pick(T a, T b);`, not be targeted by a lambda?
    options:
      - "Because generic methods are always static."
      - "Because such an interface has two abstract methods."
      - "Because a lambda cannot declare its own type parameters, so it cannot implement a generic method."
      - "Because generics are erased at runtime."
    answer: 2
    explanation: |
      Lambdas cannot be generic — they cannot introduce their own type parameters. A method
      that declares <T> is generic, so no lambda can implement it, and the interface is not a
      valid lambda target (a method reference may sometimes work through inference). Erasure
      is unrelated to this compile-time rule.
    ref: "concepts.md#functionalinterface-and-the-sam-concept"

  - id: java8-functional-interfaces-method-references-044
    difficulty: beginner
    tags: [catalog, function]
    question: |
      Which functional interface transforms an input of type T into a result of type R?
    options:
      - "Consumer<T> with void accept(T t)"
      - "Supplier<R> with R get()"
      - "Predicate<T> with boolean test(T t)"
      - "Function<T,R> with R apply(T t)"
    answer: 3
    explanation: |
      Function<T,R> declares R apply(T t) — a general transformation T to R. Consumer returns
      nothing, Supplier takes nothing, Predicate returns boolean. Function is the backbone of
      Stream.map.
    ref: "concepts.md#the-javautilfunction-catalog"

  - id: java8-functional-interfaces-method-references-045
    difficulty: intermediate
    tags: [catalog, bifunction]
    question: |
      Which interface fits a lambda `(String s, Integer i) -> s.substring(i)`?
    options:
      - "BiFunction<String,Integer,String>"
      - "Function<String,Integer>"
      - "BinaryOperator<String>"
      - "BiConsumer<String,Integer>"
    answer: 0
    explanation: |
      The lambda takes two arguments of different types (String, Integer) and returns a
      String, matching BiFunction<String,Integer,String> (R apply(T,U)). BinaryOperator
      requires all three types identical. BiConsumer returns void. Function takes one arg.
    ref: "concepts.md#the-javautilfunction-catalog"

  - id: java8-functional-interfaces-method-references-046
    difficulty: expert
    tags: [method-reference, generic-inference, constructor]
    question: |
      In `Stream<String> s = ...; List<String> list = s.collect(Collectors.toCollection(ArrayList::new));`
      what role does ArrayList::new play?
    options:
      - "It is an unbound instance reference that appends to an existing list."
      - "It is a Supplier<ArrayList<String>> whose type argument is inferred from the stream/collector target typing."
      - "It is a static method reference to a factory."
      - "It fails because constructor references cannot be used with generics."
    answer: 1
    explanation: |
      toCollection expects a Supplier<C>. ArrayList::new is a constructor reference that,
      through target-type inference against Collectors.toCollection and the stream element
      type, resolves to Supplier<ArrayList<String>>. Constructor references work fine with
      generics; the diamond type is inferred from context.
    ref: "concepts.md#the-four-method-reference-kinds"

  - id: java8-functional-interfaces-method-references-047
    difficulty: intermediate
    tags: [composing, predicate, negate]
    question: |
      What does `nonEmpty.negate()` produce for `Predicate<String> nonEmpty = s -> !s.isEmpty();`?
    options:
      - "A predicate that always returns false."
      - "A predicate that throws for empty strings."
      - "A predicate that returns true when the string IS empty."
      - "A Function<String,Boolean> rather than a Predicate."
    answer: 2
    explanation: |
      negate returns a predicate that is the logical inverse: it returns true exactly when
      the original returns false. Since nonEmpty is true for non-empty strings, its negation
      is true for empty strings. The result is still a Predicate<String>.
    ref: "concepts.md#composing-functions"

  - id: java8-functional-interfaces-method-references-048
    difficulty: advanced
    tags: [composing, binary-operator, reduce]
    question: |
      Which static factory returns a BinaryOperator<T> that keeps the larger of two elements
      per a comparator, suitable for Stream.reduce?
    options:
      - "Comparator.comparing"
      - "Function.identity"
      - "Collectors.maxBy"
      - "BinaryOperator.maxBy(comparator)"
    answer: 3
    explanation: |
      BinaryOperator.maxBy(comparator) returns a BinaryOperator<T> that yields the greater of
      two operands; minBy yields the smaller. These are handy in reduce, e.g.
      stream.reduce(BinaryOperator.maxBy(cmp)). Comparator.comparing builds a Comparator;
      Collectors.maxBy is a collector, not a BinaryOperator.
    ref: "concepts.md#composing-functions"

  - id: java8-functional-interfaces-method-references-049
    difficulty: expert
    tags: [method-reference, unbound, comparator]
    question: |
      `Comparator<String> c = String::compareTo;` — why does this unbound reference compile
      against Comparator<String>?
    options:
      - "Because the unbound reference maps to (a, b) -> a.compareTo(b), matching Comparator's int compare(String, String)."
      - "Because compareTo is static on String."
      - "Because Comparator is not a functional interface."
      - "Because compareTo returns void."
    answer: 0
    explanation: |
      String::compareTo is an unbound instance reference: the first parameter is the receiver
      and the second is the argument, i.e. (a, b) -> a.compareTo(b). That has signature
      (String, String) -> int, exactly matching Comparator's SAM int compare(String, String).
      compareTo is an instance method returning int.
    ref: "concepts.md#the-four-method-reference-kinds"

  - id: java8-functional-interfaces-method-references-050
    difficulty: beginner
    tags: [catalog, binary-operator]
    question: |
      `BinaryOperator<Integer> add = Integer::sum;` — what is add.apply(3, 4)?
    options:
      - "34"
      - "7"
      - "12"
      - "Compile error"
    answer: 1
    explanation: |
      Integer.sum(int,int) returns the arithmetic sum, so add.apply(3,4) is 7. Integer::sum
      is a static method reference fitting BinaryOperator<Integer> (which is
      BiFunction<Integer,Integer,Integer>).
    ref: "concepts.md#the-javautilfunction-catalog"

  - id: java8-functional-interfaces-method-references-051
    difficulty: intermediate
    tags: [functional-interface, default-count]
    question: |
      Can a functional interface declare multiple default methods and still be functional?
    options:
      - "No — a functional interface may contain only the single abstract method and nothing else."
      - "Yes, but only if all default methods are private."
      - "Yes — only the count of ABSTRACT methods matters; it may have any number of default and static methods."
      - "No — default methods automatically become abstract."
    answer: 2
    explanation: |
      Functional-interface status depends solely on there being exactly one abstract method.
      default and static methods have bodies and do not count, so an interface may have many
      of them (e.g. Function has apply plus andThen, compose, and identity) and remain
      functional.
    ref: "concepts.md#functionalinterface-and-the-sam-concept"

  - id: java8-functional-interfaces-method-references-052
    difficulty: expert
    tags: [method-reference, mapping-table, lambda-equivalence]
    question: |
      For an unbound instance reference targeting a two-arg functional interface, how are
      parameters mapped?

      ```java
      BiFunction<String,String,Boolean> f = String::startsWith;
      ```
    options:
      - "Both parameters are passed as arguments to a static method."
      - "The second parameter becomes the receiver: (a, b) -> b.startsWith(a)."
      - "It does not compile because startsWith returns boolean, not Boolean."
      - "The first parameter becomes the receiver and the second becomes the method argument: (a, b) -> a.startsWith(b)."
    answer: 3
    explanation: |
      For an unbound reference Type::instanceMethod, the FIRST functional-interface parameter
      is the receiver and the remaining parameters are the method's arguments:
      (a, b) -> a.startsWith(b). boolean autoboxes to Boolean, so it fits
      BiFunction<String,String,Boolean>.
    ref: "concepts.md#the-four-method-reference-kinds"

  - id: java8-functional-interfaces-method-references-053
    difficulty: intermediate
    tags: [catalog, primitive, obj-consumer]
    question: |
      Which interface represents a consumer that accepts an object of type T and a primitive
      int, returning nothing?
    options:
      - "ObjIntConsumer<T>"
      - "BiConsumer<T,Integer>"
      - "IntConsumer"
      - "ToIntBiFunction<T,Integer>"
    answer: 0
    explanation: |
      ObjIntConsumer<T> declares void accept(T t, int value) — an object plus a primitive int,
      no return, no boxing of the int. BiConsumer<T,Integer> would box the int. IntConsumer
      takes only an int. ToIntBiFunction returns an int rather than void.
    ref: "concepts.md#the-javautilfunction-catalog"

  - id: java8-functional-interfaces-method-references-054
    difficulty: expert
    tags: [target-typing, ternary, inference]
    question: |
      Why does `Supplier<String> s = cond ? () -> "a" : () -> "b";` compile, while assigning a
      bare `cond ? () -> "a" : () -> "b"` to `var x` does not?
    options:
      - "Because ternary expressions cannot contain lambdas."
      - "Because a lambda needs a target type; the Supplier<String> declaration supplies it to both branches, but var provides no target type to infer the poly expression against."
      - "Because var cannot be used with String."
      - "Because the two branches return different types."
    answer: 1
    explanation: |
      Lambdas are poly expressions requiring a target type. With Supplier<String> on the left,
      each ternary branch is typed against Supplier<String>. With var, there is no target
      type to infer from — var relies on the initializer having a standalone type, which a
      lambda/ternary-of-lambdas lacks — so it fails to compile.
    ref: "concepts.md#target-typing-and-type-inference"

  - id: java8-functional-interfaces-method-references-055
    difficulty: advanced
    tags: [default-methods, subinterface-wins]
    question: |
      Interface B extends A; both declare `default int val()`. A class implements B only.
      Which val() is used, and must the class override it?
    options:
      - "A's version, and the class must override it."
      - "It is ambiguous and requires an explicit override."
      - "B's version is used automatically because the more specific subinterface wins; no override is required."
      - "Neither; default methods are not inherited across interface extension."
    answer: 2
    explanation: |
      When one interface extends another and both provide the default, the more specific
      (sub)interface's version wins automatically — B's val() here. No override or explicit
      disambiguation is needed. Explicit resolution is only required for unrelated interfaces
      that conflict.
    ref: "concepts.md#default-and-static-methods-on-interfaces"

  - id: java8-functional-interfaces-method-references-056
    difficulty: intermediate
    tags: [method-reference, static-vs-bound]
    question: |
      Which pairing of method reference and equivalent lambda is INCORRECT?
    options:
      - "Math::max  ==  (a, b) -> Math.max(a, b)"
      - "list::add  ==  x -> list.add(x)"
      - "String::valueOf  ==  o -> String.valueOf(o)"
      - "String::length  ==  (s, n) -> s.length(n)"
    answer: 3
    explanation: |
      length() takes no arguments, so the unbound reference String::length maps to
      s -> s.length(), not a two-argument form. The other three are correct: Math::max is
      static, list::add is bound instance, String::valueOf is static.
    ref: "concepts.md#the-four-method-reference-kinds"

  - id: java8-functional-interfaces-method-references-057
    difficulty: beginner
    tags: [version, java8-features]
    question: |
      Lambda expressions, the java.util.function package, method references, and default
      methods were all introduced in which Java release?
    options:
      - "Java 8"
      - "Java 7"
      - "Java 11"
      - "Java 17"
    answer: 0
    explanation: |
      All four shipped final in Java 8 (2014) under Project Lambda (JSR 335 / JEP 126). They
      were not previews and were not finalized later. Later versions only added ergonomics
      like var lambda parameters (Java 11) and private interface methods (Java 9).
    ref: "concepts.md#functionalinterface-and-the-sam-concept"

  - id: java8-functional-interfaces-method-references-058
    difficulty: expert
    tags: [target-typing, exception-transparency]
    question: |
      A lambda targeting `Runnable` (whose run() declares no checked exceptions) contains code
      that can throw a checked IOException. What happens?
    options:
      - "It compiles; checked exceptions are ignored inside lambdas."
      - "It does not compile — a lambda body may only throw checked exceptions that the target functional interface's abstract method permits."
      - "It compiles but the exception is silently swallowed at runtime."
      - "It compiles and the exception is automatically wrapped in a RuntimeException."
    answer: 1
    explanation: |
      A lambda's body is bound by the throws clause of the target SAM. Runnable.run() declares
      no checked exceptions, so a body that can throw a checked IOException fails to compile.
      To allow it, target an interface whose method declares that checked exception (e.g.
      Callable), catch it inside the lambda, or wrap it in an unchecked exception yourself.
    ref: "concepts.md#target-typing-and-type-inference"
