topic: "Generics and the Type System"
domain: java-jvm
topic_slug: generics-type-system
version: 1
questions:
  - id: generics-type-system-001
    difficulty: beginner
    tags: [motivation, type-safety]
    question: |
      What is the primary benefit generics added over the pre-Java-5 collections that stored `Object`?
    options:
      - "They move many type errors from run time to compile time and remove explicit casts"
      - "They allow primitives such as int to be stored directly in a List"
      - "They let a single collection instance hold multiple unrelated element types safely"
      - "They make collections run faster at run time by avoiding boxing"
    answer: 0
    explanation: |
      Generics give compile-time type checking and eliminate the casts you needed when everything was
      `Object`. They do NOT speed up run time (erasure means the bytecode is essentially the same),
      they do NOT allow primitives (you still need `Integer`, boxing still happens), and they exist
      precisely to PREVENT mixing unrelated types.
    ref: "concepts.md#generics-motivation-and-type-safety"
  - id: generics-type-system-002
    difficulty: beginner
    tags: [erasure, definition]
    question: |
      What does "type erasure" mean in Java generics?
    options:
      - "The compiler rejects at build time any code that uses generics unless the programmer supplies an explicit cast for every parameterized reference"
      - "The JVM discards the class objects of unused generic instantiations during a garbage-collection sweep to reclaim metaspace"
      - "The compiler removes generic type information after checking, replacing type parameters with their leftmost bound (or Object) and inserting casts"
      - "Generic type arguments are recorded in a hidden per-object runtime field so the JVM can consult them during method dispatch"
    answer: 2
    explanation: |
      Erasure is a compile-time transformation: after the compiler verifies type correctness, it
      replaces each type parameter with its leftmost bound (or `Object` when unbounded) and inserts
      casts where needed. There is no per-object runtime type-argument field, and it is unrelated to
      garbage collection.
    ref: "concepts.md#type-erasure-and-its-consequences"
  - id: generics-type-system-003
    difficulty: beginner
    tags: [invariance, arrays]
    question: |
      Which statement is true about the assignability of `List<String>` and arrays in Java?
    options:
      - "`List<String>` is a subtype of `List<Object>` because String is a subtype of Object"
      - "`String[]` is a subtype of `Object[]`, but `List<String>` is NOT a subtype of `List<Object>`"
      - "Both `List<String>` and `String[]` are subtypes of their Object counterparts, since assignability follows the element type in each case"
      - "Neither `String[]` nor `List<String>` is assignable to its Object counterpart, because Java makes every container type strictly invariant"
    answer: 1
    explanation: |
      Arrays are covariant, so `String[]` IS-A `Object[]`. Generics are invariant, so `List<String>`
      is NOT a `List<Object>` even though `String` extends `Object`. This asymmetry is a core generics
      interview point.
    ref: "concepts.md#invariance-of-generics-versus-array-covariance"
  - id: generics-type-system-004
    difficulty: beginner
    tags: [wildcards, definition]
    question: |
      What does the unbounded wildcard type `List<?>` mean?
    options:
      - "A raw list identical in every way to `List`"
      - "A list whose element type is always Object"
      - "A list that can hold any mix of element types simultaneously"
      - "A list of some single but unknown element type"
    answer: 3
    explanation: |
      `List<?>` is a list of some specific-but-unknown type. Because the exact type is unknown, you
      cannot add anything except `null`, and reads yield `Object`. It is not the same as a raw `List`
      (which opts out of generic checking) and is not a heterogeneous container.
    ref: "concepts.md#wildcards-and-pecs"
  - id: generics-type-system-005
    difficulty: beginner
    tags: [pecs, mnemonic]
    question: |
      In the PECS mnemonic, what does the phrase "Producer Extends, Consumer Super" recommend?
    options:
      - "Use `? extends T` for every position, since one bound safely covers both reading from and writing into the collection"
      - "Avoid wildcards entirely and always name an exact type T, because bounded wildcards add no real flexibility over an invariant parameter"
      - "Use `? extends T` for a source you read from, and `? super T` for a sink you write to"
      - "Use `? super T` for a source you read from, and `? extends T` for a sink you write to"
    answer: 2
    explanation: |
      PECS: a Producer (you read/consume its output) uses `? extends T`; a Consumer (you write into
      it) uses `? super T`. `Collections.copy(List<? super T> dest, List<? extends T> src)` is the
      canonical illustration.
    ref: "concepts.md#wildcards-and-pecs"
  - id: generics-type-system-006
    difficulty: beginner
    tags: [diamond, version]
    question: |
      Which Java version introduced the diamond operator, allowing `List<String> l = new ArrayList<>();`?
    options:
      - "Java 7"
      - "Java 8"
      - "Java 5"
      - "Java 6"
    answer: 0
    explanation: |
      The diamond operator arrived in Java 7 as part of Project Coin. Java 9 extended it to work with
      anonymous inner classes in denotable cases. Generics themselves date to Java 5.
    ref: "concepts.md#generics-motivation-and-type-safety"
  - id: generics-type-system-007
    difficulty: beginner
    tags: [bounded-types, syntax]
    question: |
      What does the declaration `<T extends Number>` express?
    options:
      - "T must be a supertype of Number, so only Number, Serializable, or Object are permitted as arguments"
      - "T can be any type at all, and the `Number` bound is treated as inert documentation with no compile-time effect"
      - "T must be exactly the class Number, with no subclass such as Integer or Double allowed as the argument"
      - "T must be Number or a subtype of Number (a class or interface subtype)"
    answer: 3
    explanation: |
      `extends` in a bound means "is a subtype of," so T is Number or any subclass. The keyword
      `extends` is used for both class and interface bounds. It also lets you call Number's methods on
      a value of type T inside the method.
    ref: "concepts.md#bounded-type-parameters"
  - id: generics-type-system-008
    difficulty: beginner
    tags: [reifiable, definition]
    question: |
      Which of the following types is reifiable (fully known at run time)?
    options:
      - "`List<? extends Number>`"
      - "`List<?>`"
      - "`Map<String,Integer>`"
      - "`List<String>`"
    answer: 1
    explanation: |
      `List<?>` is reifiable because all its type arguments are unbounded wildcards — no concrete type
      information is lost by erasure. `List<String>`, `List<? extends Number>`, and
      `Map<String,Integer>` all carry type arguments that erasure discards, so they are non-reifiable.
    ref: "concepts.md#reifiable-types"
  - id: generics-type-system-009
    difficulty: beginner
    tags: [generic-methods, syntax]
    question: |
      Where are the type parameters of a generic METHOD declared?
    options:
      - "After the method name, before the parameter list"
      - "Before the return type"
      - "In the class declaration only"
      - "After the parameter list, before the throws clause"
    answer: 1
    explanation: |
      A generic method declares its type parameters immediately before the return type, e.g.
      `static <T> List<T> of(T item)`. This is independent of any type parameters on the enclosing
      class, which is why static utility methods can be generic.
    ref: "concepts.md#generic-methods-and-generic-classes"
  - id: generics-type-system-010
    difficulty: beginner
    tags: [bridge-methods, definition]
    question: |
      Why does the compiler generate bridge methods?
    options:
      - "To allow parameterized types to be used as the selector expression in switch statements after erasure"
      - "To let primitive types such as int be passed directly as generic type arguments without autoboxing"
      - "To improve run-time performance by inlining monomorphic generic method calls at their call sites"
      - "To preserve polymorphism (correct overriding dispatch) after type erasure"
    answer: 3
    explanation: |
      After erasure, an override like `compare(String,String)` no longer matches the erased interface
      method `compare(Object,Object)`. The compiler generates a synthetic bridge method with the
      erased signature that forwards (with a cast) to the specific one, keeping virtual dispatch
      correct.
    ref: "concepts.md#bridge-methods"
  - id: generics-type-system-011
    difficulty: beginner
    tags: [reflection, erasure]
    question: |
      What does `new ArrayList<String>().getClass()` return?
    options:
      - "`java.util.ArrayList` (the raw class) — the type argument is not present"
      - "`java.lang.String`, because the runtime tracks the element type argument of the instance"
      - "`null`, because erasure leaves the instance with no associated `Class` object at run time"
      - "A distinct Class object representing the parameterized type `ArrayList<String>` specifically"
    answer: 0
    explanation: |
      Because of erasure, all `ArrayList` instantiations share one `Class` object: plain
      `java.util.ArrayList`. Reflection over an instance cannot recover the `String` type argument;
      that information is only kept in Signature attributes on declarations.
    ref: "concepts.md#interaction-with-reflection"
  - id: generics-type-system-012
    difficulty: beginner
    tags: [motivation, casts]
    question: |
      With `List<String> names = new ArrayList<>();`, what does `String s = names.get(0);` require?
    options:
      - "A `@SuppressWarnings(\"unchecked\")` annotation on the line to silence a mandatory unchecked warning"
      - "An explicit `(String)` cast written in source, since `get` is only known to return `Object`"
      - "No cast — the compiler knows the element type is String"
      - "A call to a distinct typed accessor such as `getString(0)` generated for parameterized lists"
    answer: 2
    explanation: |
      One headline benefit of generics is the elimination of casts: because the list is declared
      `List<String>`, `get` is known to return `String`, so no cast is needed. Under the hood erasure
      inserts a synthetic cast, but you never write it.
    ref: "concepts.md#generics-motivation-and-type-safety"
  - id: generics-type-system-013
    difficulty: intermediate
    tags: [erasure, code-analysis]
    question: |
      What is printed?

      ```java
      List<String> a = new ArrayList<>();
      List<Integer> b = new ArrayList<>();
      System.out.println(a.getClass() == b.getClass());
      ```
    options:
      - "true"
      - "It does not compile"
      - "It throws a ClassCastException"
      - "false"
    answer: 0
    explanation: |
      Both variables refer to `ArrayList` objects, and erasure means there is exactly one
      `ArrayList` class shared by all element types. So the two `getClass()` results are identical and
      the comparison prints `true`.
    ref: "concepts.md#type-erasure-and-its-consequences"
  - id: generics-type-system-014
    difficulty: intermediate
    tags: [wildcards, code-analysis, pecs]
    question: |
      Which line causes a COMPILE error?

      ```java
      List<? extends Number> nums = new ArrayList<Integer>();
      Number n = nums.get(0);   // line A
      nums.add(3);              // line B
      nums.add(null);           // line C
      ```
    options:
      - "None — all compile"
      - "Line A"
      - "Line B"
      - "Line C"
    answer: 2
    explanation: |
      With `? extends Number` the list is a producer: reading yields a `Number` (line A OK), and
      adding `null` is always allowed (line C OK). But you cannot add a concrete value like `3`
      (line B) because the compiler cannot prove the real element type is `Integer` — it might be
      `List<Double>`.
    ref: "concepts.md#wildcards-and-pecs"
  - id: generics-type-system-015
    difficulty: intermediate
    tags: [wildcards, code-analysis, super]
    question: |
      Given `List<? super Integer> list = new ArrayList<Number>();`, which statement is TRUE?
    options:
      - "`list.add(42)` compiles, and `Integer x = list.get(0);` also compiles because the lower bound pins the element type to Integer"
      - "`list.add(42)` compiles, but a read only produces `Object`, so `Integer x = list.get(0);` fails"
      - "Neither the add nor the get compiles, because a `? super Integer` element type is entirely unknown in both directions"
      - "`list.add(42)` fails to compile because a `? super` bound treats Integer as excluded from being its own supertype"
    answer: 1
    explanation: |
      With `? super Integer` the list is a consumer: you can add an `Integer` (or subtype) safely.
      But the compiler only knows the element type is some supertype of `Integer`, so a read is typed
      as `Object` — assigning it to `Integer` without a cast fails to compile.
    ref: "concepts.md#wildcards-and-pecs"
  - id: generics-type-system-016
    difficulty: intermediate
    tags: [invariance, code-analysis, arrays]
    question: |
      What is the behavior of this code?

      ```java
      Object[] arr = new String[2];
      arr[0] = 42;
      ```
    options:
      - "Compiles and runs with no error, storing an Integer in a String array"
      - "Compile error on `Object[] arr = new String[2]`"
      - "Compile error on the assignment `arr[0] = 42`"
      - "Compiles, and throws ArrayStoreException at run time"
    answer: 3
    explanation: |
      Array covariance makes `Object[] arr = new String[2]` legal at compile time. The JVM performs a
      store-time check (aastore), and storing an `Integer` into a backing `String[]` throws
      `ArrayStoreException` at run time. This is exactly the unsoundness generic invariance avoids.
    ref: "concepts.md#invariance-of-generics-versus-array-covariance"
  - id: generics-type-system-017
    difficulty: intermediate
    tags: [bounded-types, multiple-bounds]
    question: |
      Which declaration of multiple bounds is legal?
    options:
      - "`<T extends Comparable<T> & Runnable & Number>`"
      - "`<T extends Comparable<T> & Number>`"
      - "`<T extends Number & Comparable<T> & Serializable>`"
      - "`<T extends Number & String>`"
    answer: 2
    explanation: |
      With multiple bounds, at most one may be a class and it must be listed FIRST; the rest must be
      interfaces. `Number & Comparable<T> & Serializable` is valid. Listing an interface
      (`Comparable`/`Runnable`) before the class `Number` is illegal, and `Number & String` lists two
      classes (illegal, and String is final anyway).
    ref: "concepts.md#bounded-type-parameters"
  - id: generics-type-system-018
    difficulty: intermediate
    tags: [generic-methods, inference, version]
    question: |
      Which Java version's improved target-type inference lets `List<String> l = Collections.emptyList();`
      compile without an explicit `<String>` type witness?
    options:
      - "Java 8"
      - "Java 11"
      - "Java 5"
      - "Java 7"
    answer: 0
    explanation: |
      Java 8 significantly improved target-typing (poly expressions), so the target type of the
      assignment feeds the inference for `emptyList()`. Before Java 8 you often needed
      `Collections.<String>emptyList()`.
    ref: "concepts.md#generic-methods-and-generic-classes"
  - id: generics-type-system-019
    difficulty: intermediate
    tags: [erasure, overloading, code-analysis]
    question: |
      Why does this class fail to compile?

      ```java
      class C {
          void f(List<String> s) {}
          void f(List<Integer> i) {}
      }
      ```
    options:
      - "The raw type List may not be used as a formal parameter type in a method declaration"
      - "It actually compiles fine, since the differing type arguments give each f a distinct signature"
      - "You cannot legally declare two methods that share the name f within a single class body"
      - "Both methods erase to `f(List)`, producing a name-clash / same-erasure error"
    answer: 3
    explanation: |
      After erasure both signatures become `f(List)`, which is the identical descriptor. The compiler
      reports a name clash ("have the same erasure"). Overloading cannot distinguish methods that
      differ only by type arguments.
    ref: "concepts.md#type-erasure-and-its-consequences"
  - id: generics-type-system-020
    difficulty: intermediate
    tags: [reifiable, instanceof, code-analysis]
    question: |
      Which `instanceof` expression compiles?
    options:
      - "`o instanceof List<? extends Number>`"
      - "`o instanceof List<?>`"
      - "`o instanceof T` (T a type variable)"
      - "`o instanceof List<String>`"
    answer: 1
    explanation: |
      `instanceof` requires a reifiable type. `List<?>` is reifiable (all args unbounded wildcards),
      so it compiles. `List<String>` and `List<? extends Number>` are non-reifiable, and a type
      variable `T` does not exist at run time; all three fail to compile. (`o instanceof List` — raw —
      would also compile.)
    ref: "concepts.md#reifiable-types"
  - id: generics-type-system-021
    difficulty: intermediate
    tags: [reflection, parameterized-type]
    question: |
      Given `class StringList extends ArrayList<String> {}`, how can you recover `String` at run time?
    options:
      - "`new StringList().getClass().getTypeParameters()[0]` returns String"
      - "`StringList.class.getGenericSuperclass()` returns a ParameterizedType whose actual type argument is String"
      - "`StringList.class.getComponentType()` returns the String element class recorded for the subclass"
      - "It is impossible, because erasure strips the String argument from both the class file and its Signature attribute"
    answer: 1
    explanation: |
      Generic supertypes are recorded in the class file's Signature attribute.
      `getGenericSuperclass()` returns `ArrayList<String>` as a `ParameterizedType`, whose
      `getActualTypeArguments()[0]` is `String`. `getTypeParameters()` returns the class's own declared
      variables (here none), not the supertype's arguments.
    ref: "concepts.md#interaction-with-reflection"
  - id: generics-type-system-022
    difficulty: intermediate
    tags: [wildcards, unbounded, code-analysis]
    question: |
      What can you do with a parameter of type `List<?>`?
    options:
      - "Add elements as long as each one matches the runtime class of the first stored element"
      - "Nothing at all — the wildcard reference is inert and permits no method calls whatsoever"
      - "Add any object to it, because an unbounded wildcard accepts every element type freely"
      - "Add only null to it; read elements as Object; call size()/clear()"
    answer: 3
    explanation: |
      Because the element type is unknown, the only value you can add is `null`. Reads are typed as
      `Object`, and type-independent operations like `size()`, `isEmpty()`, `clear()`,
      `remove(Object)` still work. It is far from useless — just write-restricted.
    ref: "concepts.md#wildcards-and-pecs"
  - id: generics-type-system-023
    difficulty: intermediate
    tags: [bridge-methods, reflection, code-analysis]
    question: |
      A class `implements Comparator<String>` and defines `public int compare(String a, String b)`.
      How many methods named `compare` will reflection typically find on that class, and why?
    options:
      - "Two — your `compare(String,String)` plus a synthetic bridge `compare(Object,Object)`"
      - "Three — the source method plus one generated overload per primitive widening conversion"
      - "Zero — because compare is merely inherited from Comparator and never declared on the class"
      - "One — only the `compare(String,String)` method exactly as you wrote it in the source"
    answer: 0
    explanation: |
      The compiler emits a synthetic bridge `compare(Object,Object)` (flagged ACC_BRIDGE and
      ACC_SYNTHETIC) that casts and forwards to your `compare(String,String)`. So
      `getDeclaredMethods()` shows two, and `Method.isBridge()` distinguishes the generated one.
    ref: "concepts.md#bridge-methods"
  - id: generics-type-system-024
    difficulty: intermediate
    tags: [var, inference, version, code-analysis]
    question: |
      In Java 10+, what type does `var list = new ArrayList<>();` infer for `list`?
    options:
      - "It does not compile — var cannot combine with the diamond"
      - "ArrayList (raw)"
      - "ArrayList<Object>"
      - "ArrayList<?>"
    answer: 2
    explanation: |
      `var` uses the initializer's inferred type. With no target type and an empty diamond, the
      compiler falls back to `Object` for the type argument, so `list` is `ArrayList<Object>`. This is
      a common gotcha: `var x = new ArrayList<>()` is rarely what you intend.
    ref: "concepts.md#generic-methods-and-generic-classes"
  - id: generics-type-system-025
    difficulty: intermediate
    tags: [raw-types, code-analysis, heap-pollution]
    question: |
      What happens at run time?

      ```java
      List<String> ls = new ArrayList<>();
      List raw = ls;
      raw.add(42);
      String s = ls.get(0);
      ```
    options:
      - "Compiles (with unchecked warning); ClassCastException thrown at `ls.get(0)`"
      - "Runs cleanly to completion; the boxed 42 is coerced so that s ends up as the String \"42\""
      - "ArrayStoreException at `raw.add(42)`, since the backing store rejects the wrong element type"
      - "Compile error at `raw.add(42)`, because a raw List still enforces the original String element type"
    answer: 0
    explanation: |
      Assigning to a raw `List` disables generic checks, so `raw.add(42)` compiles (with an unchecked
      warning) and pollutes the heap. The failure surfaces later at `ls.get(0)`, where the synthetic
      cast to `String` throws `ClassCastException`. Note collections are not arrays, so there is no
      ArrayStoreException.
    ref: "concepts.md#type-erasure-and-its-consequences"
  - id: generics-type-system-026
    difficulty: intermediate
    tags: [bounded-types, api-access]
    question: |
      Inside `static <T extends Number> double sumFirst(List<T> xs) { ... }`, which call on
      `xs.get(0)` is valid without a cast?
    options:
      - "None — T's methods are unknown"
      - "`xs.get(0).length()`"
      - "`xs.get(0).doubleValue()`"
      - "`xs.get(0).charAt(0)`"
    answer: 2
    explanation: |
      Because T is bounded by `Number`, a value of type T is known to be a `Number`, so you can call
      `Number` methods such as `doubleValue()`. `length()`/`charAt()` are String methods and are not
      available. The bound both restricts callers and grants API access inside the method.
    ref: "concepts.md#bounded-type-parameters"
  - id: generics-type-system-027
    difficulty: intermediate
    tags: [generic-methods, type-witness, code-analysis]
    question: |
      What is the correct syntax for an explicit type witness on a static generic method `List<T> make(T t)`
      declared in class `Factory`?
    options:
      - "`Factory.make(String.class, \"x\")`"
      - "`Factory.<String>make(\"x\")`"
      - "`Factory.make<String>(\"x\")`"
      - "`<String>Factory.make(\"x\")`"
    answer: 1
    explanation: |
      The type witness goes after the dot and before the method name: `Factory.<String>make("x")`.
      The C++/C#-style `make<String>(...)` is not valid Java syntax. Passing `String.class` is a
      different (class-token) technique, not a type witness.
    ref: "concepts.md#generic-methods-and-generic-classes"
  - id: generics-type-system-028
    difficulty: intermediate
    tags: [invariance, wildcards, api-design]
    question: |
      You want a method that prints every element of any list of numbers, including `List<Integer>`
      and `List<Double>`. Which parameter type works?
    options:
      - "`List<? super Number>`"
      - "`List<Number>`"
      - "`List<Object>`"
      - "`List<? extends Number>`"
    answer: 3
    explanation: |
      Because generics are invariant, `List<Number>` accepts neither `List<Integer>` nor
      `List<Double>`. `List<? extends Number>` accepts any list whose element type is Number or a
      subtype — exactly what you need for a read-only producer. `? super Number` would exclude
      `List<Integer>`.
    ref: "concepts.md#wildcards-and-pecs"
  - id: generics-type-system-029
    difficulty: intermediate
    tags: [reifiable, safevarargs, version]
    question: |
      As of which Java version can `@SafeVarargs` be applied to a `private` instance method
      (in addition to static and final methods)?
    options:
      - "Java 7"
      - "Java 8"
      - "Java 9"
      - "Java 11"
    answer: 2
    explanation: |
      `@SafeVarargs` was introduced in Java 7 for static and final methods (methods that cannot be
      overridden). JEP 213 (Milling Project Coin) in Java 9 extended it to `private` methods, which
      also cannot be overridden.
    ref: "concepts.md#reifiable-types"
  - id: generics-type-system-030
    difficulty: intermediate
    tags: [erasure, static-context, code-analysis]
    question: |
      Why does `class Box<T> { static T instance; }` fail to compile?
    options:
      - "A static member is shared across all instantiations, so it cannot depend on the per-instance type parameter T"
      - "The type parameter T must carry an explicit upper bound before it may appear in a static field"
      - "It actually compiles without error, and T is silently treated as Object in the static context"
      - "Static fields inside a generic class are forbidden from having any initializer expression"
    answer: 0
    explanation: |
      There is only one copy of a static field for the whole class, but `Box<String>` and
      `Box<Integer>` share the same class after erasure. A static member cannot reference the
      instance-level type parameter T, so the compiler rejects it. Static generic *methods* solve this
      by declaring their own type parameters.
    ref: "concepts.md#type-erasure-and-its-consequences"
  - id: generics-type-system-031
    difficulty: advanced
    tags: [wildcards, capture, code-analysis]
    question: |
      This method fails to compile with a "capture" error. What is the standard fix?

      ```java
      public static void swapFirstTwo(List<?> list) {
          Object tmp = list.get(0);
          list.set(0, list.get(1));
          list.set(1, tmp);          // error: set(int, CAP#1) cannot accept Object
      }
      ```
    options:
      - "Cast tmp to the list's runtime element class obtained via `list.get(0).getClass()` before the set"
      - "Replace the `list.set(index, value)` calls with `list.add(value)` so no captured type is needed"
      - "Change the parameter declaration from `List<?>` to the concrete supertype `List<Object>`"
      - "Add a private generic helper `<T> void swap(List<T> l)` and delegate to it to capture the wildcard"
    answer: 3
    explanation: |
      The wildcard prevents `set` because the captured element type CAP#1 is unknown. Delegating to a
      private generic method binds the wildcard to a named type variable T, so `get` and `set` share
      that T and type-check. Changing to `List<Object>` would break callers passing e.g.
      `List<String>` (invariance).
    ref: "concepts.md#wildcards-and-pecs"
  - id: generics-type-system-032
    difficulty: advanced
    tags: [bounded-types, recursive, comparable]
    question: |
      `Collections.max` is declared `<T extends Comparable<? super T>> T max(Collection<? extends T> coll)`.
      Why `Comparable<? super T>` rather than the simpler `Comparable<T>`?
    options:
      - "It is purely a JIT performance optimization; the two bounds are otherwise semantically identical"
      - "So a subclass whose comparison is defined by a superclass (e.g. a subtype comparing via a base `Comparable<Base>`) still satisfies the bound"
      - "Because a plain `Comparable<T>` bound would let the sort throw an ArrayStoreException at run time"
      - "Because the Comparable interface is not itself generic and cannot take a type argument at all"
    answer: 1
    explanation: |
      If `Base implements Comparable<Base>` and `Sub extends Base` (without redeclaring Comparable),
      then `Sub` is only `Comparable<Base>`, not `Comparable<Sub>`. The `? super T` lower bound lets T
      be comparable to itself OR any supertype, admitting such subtypes. This is the most flexible,
      correct bound — a classic PECS-on-a-type-parameter case.
    ref: "concepts.md#bounded-type-parameters"
  - id: generics-type-system-033
    difficulty: advanced
    tags: [erasure, arrays, code-analysis]
    question: |
      Why is `T[] arr = new T[10];` (T a type parameter) forbidden by the compiler?
    options:
      - "A Java array's length is fixed at ten elements maximum when its component type is a type variable"
      - "T is non-reifiable, so the JVM's array store check could not enforce the true element type — creating such an array is unsafe and disallowed"
      - "Java arrays are restricted to primitive component types and cannot store reference objects like T"
      - "It is in fact allowed, and the array is quietly created with an Object[] backing at run time"
    answer: 1
    explanation: |
      Array creation needs a reifiable component type because arrays carry their component type at run
      time and rely on it for the store check. Since T is erased, `new T[10]` cannot be created safely.
      Idiomatic workarounds are `(T[]) new Object[10]` (unchecked) or
      `Array.newInstance(clazz, 10)`.
    ref: "concepts.md#invariance-of-generics-versus-array-covariance"
  - id: generics-type-system-034
    difficulty: advanced
    tags: [erasure, bounds, bytecode]
    question: |
      To what type does the field `value` erase?

      ```java
      class Holder<T extends Comparable<T> & Serializable> { T value; }
      ```
    options:
      - "Serializable"
      - "Comparable & Serializable (an intersection type in bytecode)"
      - "Object"
      - "Comparable"
    answer: 3
    explanation: |
      A type variable erases to its LEFTMOST bound. Here the leftmost bound is `Comparable`, so
      `value` becomes a `Comparable` field in bytecode. (Casts to `Serializable` are inserted where
      needed.) This is why bound order matters at the bytecode level.
    ref: "concepts.md#type-erasure-and-its-consequences"
  - id: generics-type-system-035
    difficulty: advanced
    tags: [generic-arrays, code-analysis, unchecked]
    question: |
      Which array-creation expression compiles WITHOUT error?
    options:
      - "`new List<?>[10]`"
      - "`new T[10]` inside a generic class"
      - "`new List<String>[10]`"
      - "`new ArrayList<Integer>[10]`"
    answer: 0
    explanation: |
      Generic array creation with a concrete type argument (`List<String>[]`, `ArrayList<Integer>[]`)
      is a compile error, as is `new T[]`. But `List<?>[]` is allowed because `List<?>` is reifiable —
      an unbounded wildcard loses no type information under erasure.
    ref: "concepts.md#reifiable-types"
  - id: generics-type-system-036
    difficulty: advanced
    tags: [bridge-methods, covariant-return, code-analysis]
    question: |
      Given `class Base { Object get() {...} }` and `class Sub extends Base { @Override String get() {...} }`,
      what does the compiler generate in `Sub`?
    options:
      - "A compile error, because an overriding method is never permitted to narrow the declared return type"
      - "Nothing special at all, since covariant return types are resolved entirely by the JVM without any bridge"
      - "A synthetic bridge `Object get()` that calls the `String get()` — because the JVM matches overrides by full signature including return type"
      - "A second `String get()` overload that coexists with the inherited `Object get()` in the vtable"
    answer: 2
    explanation: |
      Covariant return types (legal since Java 5) require a bridge: the JVM identifies an override by
      the complete descriptor, so `Sub` needs an `Object get()` bridge that delegates to `String get()`
      for dispatch through a `Base` reference to work. This is the second common source of bridge
      methods besides generic interface implementation.
    ref: "concepts.md#bridge-methods"
  - id: generics-type-system-037
    difficulty: advanced
    tags: [reflection, type-token, code-analysis]
    question: |
      How does Gson's `TypeToken` (or Jackson's `TypeReference`) capture a full generic type like
      `List<String>` at run time despite erasure?
    options:
      - "By being an abstract generic class subclassed with an anonymous type — the concrete type argument is recorded in the subclass's `Signature`/generic-superclass and read reflectively"
      - "It parses the original `.java` source file at run time by locating it on the classpath and reading the declared type argument from the text"
      - "It calls `value.getClass().getTypeParameters()` on the stored instance, which the JVM populates with the concrete `String` argument for that object"
      - "It reads a hidden per-object runtime field that the JVM secretly attaches to every generic instance to record its actual type arguments"
    answer: 0
    explanation: |
      The super type token idiom: `new TypeReference<List<String>>(){}` creates an anonymous subclass
      whose generic superclass is recorded in the Signature attribute. Reflection reads
      `getGenericSuperclass()` and pulls `List<String>` out of the ParameterizedType. Erasure removes
      type arguments from *instances*, but not from *declarations*.
    ref: "concepts.md#interaction-with-reflection"
  - id: generics-type-system-038
    difficulty: advanced
    tags: [wildcards, code-analysis, super]
    question: |
      Which of these assignments compiles?

      ```java
      List<? super Integer> a = new ArrayList<Number>();   // 1
      List<? super Integer> b = new ArrayList<Object>();   // 2
      List<? super Integer> c = new ArrayList<Long>();     // 3
      List<? extends Number> d = new ArrayList<Object>();  // 4
      ```
    options:
      - "Only 2 and 4 — Object satisfies both the lower and the upper bound"
      - "1, 2, and 3"
      - "1, 2, but not 3 or 4"
      - "All four"
    answer: 2
    explanation: |
      `? super Integer` accepts Integer or any supertype: Number (1) and Object (2) qualify, but Long
      (3) is neither Integer nor a supertype of Integer — it fails. `? extends Number` (4) requires a
      subtype of Number; Object is a supertype, so it fails. Thus only 1 and 2 compile.
    ref: "concepts.md#wildcards-and-pecs"
  - id: generics-type-system-039
    difficulty: advanced
    tags: [erasure, exceptions, code-analysis]
    question: |
      Why can you NOT write `class MyException<T> extends Exception {}` and then
      `catch (MyException<String> e)`?
    options:
      - "Exception classes are forbidden from declaring instance fields, so the type parameter T has nowhere valid to be stored"
      - "A generic class may not directly or indirectly extend Throwable, and catch clauses require reifiable types"
      - "The type parameter T must be explicitly bounded by `<T extends Throwable>` before the class may extend Exception"
      - "It is fully allowed and works fine, because the compiler retains the `<String>` argument in each catch clause for run-time matching"
    answer: 1
    explanation: |
      The JLS forbids a generic type from being (directly or indirectly) a subclass of `Throwable`,
      precisely because exception matching happens at run time and needs reifiable types — a
      `catch (MyException<String>)` could not be enforced after erasure. So this does not compile.
    ref: "concepts.md#type-erasure-and-its-consequences"
  - id: generics-type-system-040
    difficulty: advanced
    tags: [generic-methods, inference, code-analysis]
    question: |
      What does this print, and why?

      ```java
      static <T> T pick(T a, T b) { return a; }
      Object o = pick("hello", 42);
      System.out.println(o.getClass().getSimpleName());
      ```
    options:
      - "Integer — T is inferred as the type of the second argument `42`, and `pick` returns `b`, so the printed class is `Integer`"
      - "Object — the mismatch forces T to erase to plain `Object`, and `getSimpleName()` on the boxed result therefore reports `Object`"
      - "It fails to compile because T cannot be bound to two different argument types, String and Integer, in a single invocation"
      - "String — T is inferred as the least upper bound (Object & Serializable & Comparable...), and \"hello\" is returned"
    answer: 3
    explanation: |
      The compiler infers T as the least upper bound of String and Integer (an intersection like
      `Object & Serializable & Comparable<...>`), so the call type-checks. At run time `pick` returns
      its first argument `"hello"`, whose class is `String`. Inference finding a common supertype is
      the key insight.
    ref: "concepts.md#generic-methods-and-generic-classes"
  - id: generics-type-system-041
    difficulty: advanced
    tags: [reifiable, safevarargs, code-analysis]
    question: |
      Why does the compiler warn about "possible heap pollution" on
      `static <T> List<T> listOf(T... items)`?
    options:
      - "Because a varargs method is not permitted to return a parameterized type such as `List<T>`, forcing an unsafe raw return"
      - "Because the per-call array allocation that varargs performs is slow enough that the compiler flags it as a pollution hazard"
      - "Because `T...` becomes a `T[]` — a non-reifiable array — and the caller-created array could be aliased and polluted with the wrong element type"
      - "Because T can never be bound to a primitive type, the boxed varargs array is treated as potentially heap-polluting"
    answer: 2
    explanation: |
      A `T...` parameter is compiled to a `T[]`, an array of a non-reifiable type. Because arrays are
      covariant and the true element type is erased, storing/aliasing through that array can cause heap
      pollution. If the method does not store into or leak the array, annotate it `@SafeVarargs` to
      suppress the warning.
    ref: "concepts.md#reifiable-types"
  - id: generics-type-system-042
    difficulty: advanced
    tags: [invariance, api-design, code-analysis]
    question: |
      A method `void addNumbers(List<? super Integer> dst)` calls `dst.add(1); dst.add(2);`.
      Which argument is REJECTED at compile time?
    options:
      - "`new ArrayList<Double>()`"
      - "`new ArrayList<Integer>()`"
      - "`new ArrayList<Number>()`"
      - "`new ArrayList<Object>()`"
    answer: 0
    explanation: |
      `? super Integer` accepts lists of Integer or any supertype (Number, Object). `List<Double>` is
      rejected because Double is not a supertype of Integer — and indeed adding Integers to a Double
      list would be unsafe. This is the consumer side of PECS.
    ref: "concepts.md#invariance-of-generics-versus-array-covariance"
  - id: generics-type-system-043
    difficulty: advanced
    tags: [reflection, type-variable, code-analysis]
    question: |
      For `class Cache<K, V> {}`, what does `Cache.class.getTypeParameters()` return?
    options:
      - "An array containing `Object.class` twice, since each unbounded parameter K and V erases to the reified `Object` class token"
      - "`null`, because a class with no supplied type arguments exposes no reflective information about its formal parameters"
      - "An empty array, because the formal type parameters K and V are erased from the class file and cannot be recovered"
      - "An array of two TypeVariable objects named K and V"
    answer: 3
    explanation: |
      A class's own declared type parameters are stored in its Signature attribute and are recoverable
      as `TypeVariable` objects via `getTypeParameters()` — here `[K, V]`. Erasure removes type
      *arguments* from instances, but the *declaration's* formal type parameters remain reflectable.
    ref: "concepts.md#interaction-with-reflection"
  - id: generics-type-system-044
    difficulty: advanced
    tags: [wildcards, nested, code-analysis]
    question: |
      Is `List<List<String>>` assignable to `List<List<?>>`?
    options:
      - "Yes, because `List<String>` is a subtype of `List<?>`, and subtype relationships propagate outward through the enclosing type argument"
      - "No — generics are invariant, so `List<X>` is not a subtype of `List<Y>` when X != Y, even if X is assignable to Y; you would need `List<? extends List<?>>`"
      - "Yes, because a wildcard type argument makes the enclosing generic covariant in that position at every nesting level"
      - "Only if you insert an explicit cast to `List<List<?>>`, which the compiler accepts here with just an unchecked warning"
    answer: 1
    explanation: |
      Invariance applies at every level: although `List<String>` is (via wildcard) a `List<?>`,
      `List<List<String>>` is NOT a `List<List<?>>`. To accept it you need
      `List<? extends List<?>>`. This nested-invariance case trips up many candidates.
    ref: "concepts.md#invariance-of-generics-versus-array-covariance"
  - id: generics-type-system-045
    difficulty: advanced
    tags: [erasure, bytecode, casts]
    question: |
      After erasure, roughly what does the compiler generate for
      `String first = list.get(0);` where `list` is `List<String>`?
    options:
      - "`String first = list.get(0);` with no cast — after erasure the `List.get` method retains a `String` return type for this instantiation"
      - "`String first = (String) list.get(0);` — a synthetic checked cast is inserted because erased get returns Object"
      - "`String first = list.<String>get(0);` — the compiler emits an explicit type witness on the `get` call to recover the element type"
      - "A reflective lookup of the element type via `getGenericReturnType()` is inlined at the call site to type the result"
    answer: 1
    explanation: |
      The erased `List.get` returns `Object`. The compiler inserts a synthetic `(String)` cast at the
      call site so the code is type-safe at run time. This is also where a `ClassCastException` would
      appear if the heap had been polluted with a non-String.
    ref: "concepts.md#type-erasure-and-its-consequences"
  - id: generics-type-system-046
    difficulty: advanced
    tags: [generic-classes, self-type, code-analysis]
    question: |
      What pattern does `abstract class Builder<T extends Builder<T>>` with methods returning `T` enable?
    options:
      - "Covariant array assignment, letting a `Builder<Sub>[]` be stored into a `Builder<Base>[]` reference safely"
      - "Automatic elimination of the synthetic bridge methods the compiler would otherwise emit for the overridden builder setters"
      - "Reified generics, giving the builder run-time access to its own type argument T for `new T()` allocation"
      - "A fluent/self-referential builder where subclass builder methods return the subclass type without casting at each call site"
    answer: 3
    explanation: |
      This is the curiously recurring template pattern (CRTP) / self-type idiom. By bounding
      `T extends Builder<T>`, chained methods declared to return `T` yield the concrete subtype,
      enabling fluent builders and inheritance without downcasts on every call. It is an F-bounded
      generic, same shape as `Enum<E extends Enum<E>>`.
    ref: "concepts.md#generic-methods-and-generic-classes"
  - id: generics-type-system-047
    difficulty: advanced
    tags: [reifiable, class-token, heterogeneous-container]
    question: |
      In a typesafe heterogeneous container `class Favorites { <T> void put(Class<T> k, T v); <T> T get(Class<T> k); }`,
      what role does the `Class<T>` key play?
    options:
      - "It is a reifiable type token that carries the type at run time so `get` can cast with `Class.cast` and restore full type safety across heterogeneous entries"
      - "It forces every value in the container to share one common element type, degrading it to an ordinary homogeneous `Map<Object,Object>`"
      - "It prevents the container from using generics internally, so the backing map must be declared with raw types throughout"
      - "It is purely documentation of intent and has no run-time effect, since the `Class<T>` argument is discarded by erasure"
    answer: 0
    explanation: |
      Because a `Class<T>` object is reifiable, it can be used as a runtime type token. `get` uses
      `type.cast(map.get(type))` to return a correctly typed value, giving a single container that
      safely holds many different types — Effective Java Item 33. Erasure alone could not provide this;
      the class token supplies the missing runtime type.
    ref: "concepts.md#reifiable-types"
  - id: generics-type-system-048
    difficulty: advanced
    tags: [bridge-methods, classcastexception, code-analysis]
    question: |
      How can a `ClassCastException` be thrown from *inside* a bridge method that you never wrote?
    options:
      - "Only when reflection is used to invoke the bridge directly, since a normal virtual call never routes through the synthetic method"
      - "Bridge methods always throw ClassCastException on their first invocation and rely on the caller to catch and retry"
      - "If heap pollution places a wrong-typed object where the override expects a specific type, the bridge's inserted cast (e.g. `(String) arg`) fails when invoked through the erased signature"
      - "Bridge methods contain no executable body and therefore cannot throw any exception, checked or unchecked"
    answer: 2
    explanation: |
      A bridge like `compare(Object,Object)` casts its arguments to the specific type before
      forwarding. If, through raw types or unchecked casts, a wrong-typed object reaches that erased
      entry point, the bridge's cast throws `ClassCastException` — appearing to originate from a
      synthetic method you never authored.
    ref: "concepts.md#bridge-methods"
  - id: generics-type-system-049
    difficulty: expert
    tags: [erasure, design-tradeoff]
    question: |
      Compared with reified generics (as in C#), which is a genuine COST that Java's erasure imposes,
      versus a benefit erasure provided?
    options:
      - "Cost: no runtime access to type arguments (no `new T()`, `new T[]`, `x instanceof List<String>`). Benefit: migration/binary compatibility with pre-generics code and no per-instantiation class bloat"
      - "Cost: generic method dispatch is measurably slower due to extra indirection. Benefit: the JVM performs reified type-argument checks at run time"
      - "Cost: generics cannot be used with the collections framework at all. Benefit: noticeably smaller source and class files"
      - "Cost: erased generics cannot interoperate with legacy raw pre-generics code. Benefit: expressions like `new T[]` become legal"
    answer: 0
    explanation: |
      Erasure's cost is the loss of runtime type-argument information: no `new T()`, no `new T[]`, no
      `instanceof` on parameterized types, limited reflection over instances. Its deliberate benefit
      was migration compatibility — generic and legacy raw code interoperate, existing bytecode kept
      working, and there is no code explosion per instantiation (unlike C#'s reified specializations).
    ref: "concepts.md#type-erasure-and-its-consequences"
  - id: generics-type-system-050
    difficulty: expert
    tags: [wildcards, capture, code-analysis]
    question: |
      Why does `Collections.swap` accept `List<?>` and work, while a naive user method that reads and
      writes a `List<?>` fails to compile?
    options:
      - "Wildcard types are given special covariant treatment by the compiler when they appear inside the `java.util` package"
      - "Collections.swap bypasses the generic type system entirely by using reflection to read and write the list elements"
      - "The JDK method internally delegates to a private generic method `<T> void swap(List<T>, int, int)` that captures the wildcard into a named type T, allowing typed get+set"
      - "Collections.swap falls back to raw `List` operations guarded by a `@SuppressWarnings(\"unchecked\")` on every statement"
    answer: 2
    explanation: |
      `Collections.swap(List<?>, i, j)` publicly takes a wildcard for caller convenience but delegates
      to a private `<T> void swap(List<T> l, int i, int j)`. That capture helper binds the wildcard to
      a single T, so `l.set(i, l.set(j, l.get(i)))`-style code type-checks. The wildcard-capture
      delegation idiom is exactly why the public API is ergonomic.
    ref: "concepts.md#wildcards-and-pecs"
  - id: generics-type-system-051
    difficulty: expert
    tags: [erasure, overriding, code-analysis]
    question: |
      Does this compile, and if so what happens at run time?

      ```java
      class Node<T> { public void set(T t) { System.out.println("Node.set"); } }
      class MyNode extends Node<Integer> {
          public void set(Integer i) { System.out.println("MyNode.set"); }
      }
      Node<Object> n = (Node) new MyNode();  // raw + unchecked
      n.set("hello");
      ```
    options:
      - "Compile error at `n.set(\"hello\")`, because the raw `Node` reference still enforces the `Integer` parameter type declared on `MyNode`"
      - "Compiles with warnings; throws ClassCastException at run time when the bridge `set(Object)` casts \"hello\" to Integer"
      - "Compiles and prints `MyNode.set`, since virtual dispatch selects the most specific `set(Integer)` override for the passed string"
      - "Compiles and prints `Node.set`, because the raw reference resolves the call to the erased base-class method rather than the override"
    answer: 1
    explanation: |
      `MyNode` gets a synthetic bridge `set(Object)` that casts to `Integer` and calls
      `set(Integer)`. Through the raw/unchecked `Node<Object>` reference, `n.set("hello")` dispatches
      to the bridge, whose `(Integer) "hello"` cast throws `ClassCastException`. This is the textbook
      bridge-method + heap-pollution interaction.
    ref: "concepts.md#bridge-methods"
  - id: generics-type-system-052
    difficulty: expert
    tags: [inference, target-type, code-analysis]
    question: |
      Why did pre-Java-8 code often need `Collections.<String>emptyList()` while
      `List<String> l = Collections.emptyList();` works from Java 8 onward?
    options:
      - "Java 8 added reified generics, so `emptyList` can now read its intended element type at run time"
      - "The `emptyList` method changed its declared return type from `List<T>` to a concrete `List<String>` in Java 8"
      - "Java 8 made `emptyList` a non-generic method returning a plain `List` that the assignment then narrows implicitly"
      - "Java 8 introduced target-type inference for method invocations (poly expressions), so the assignment's target type `List<String>` drives inference of the method's type argument"
    answer: 3
    explanation: |
      Java 8 expanded target typing so a generic method invocation is a poly expression whose type
      argument can be inferred from the surrounding context (here, the declared `List<String>`).
      Before that, `emptyList()` in a standalone context inferred `List<Object>`, forcing an explicit
      `<String>` witness. The method's signature did not change.
    ref: "concepts.md#generic-methods-and-generic-classes"
  - id: generics-type-system-053
    difficulty: expert
    tags: [reflection, wildcard-type, code-analysis]
    question: |
      Reflecting on a field declared `Map<String, ? extends Number> m;`, what does the second actual
      type argument of its ParameterizedType look like?
    options:
      - "`null`, because the wildcard argument is stripped by erasure and leaves no reflective entry in the field's signature"
      - "A plain `Class` object for `Number`, since reflection collapses the `? extends Number` bound down to its erased upper bound"
      - "A WildcardType whose upper bounds contain Number and whose lower bounds are empty"
      - "A `TypeVariable` object literally named `?`, treating the wildcard as an anonymous single-use type parameter"
    answer: 2
    explanation: |
      Generic field signatures are preserved in the Signature attribute. The second argument is a
      `WildcardType`; `getUpperBounds()` returns `[Number]` and `getLowerBounds()` returns `[]`. A
      `? super X` wildcard would instead have a non-empty lower-bounds array. Wildcards in
      *declarations* are fully reflectable even though erasure strips them from instances.
    ref: "concepts.md#interaction-with-reflection"
  - id: generics-type-system-054
    difficulty: expert
    tags: [reifiable, arrays, code-analysis]
    question: |
      Consider a generic class that does `elements = (E[]) new Object[capacity];` internally (as
      `ArrayList` and `ArrayDeque` effectively do). Which statement is accurate?
    options:
      - "It compiles with an unchecked-cast warning; it is safe only if the E[] reference never leaks such that external code stores incompatible elements — the backing array is really Object[]"
      - "It creates a genuine `E[]` at run time whose reified component type is the actual argument bound to E for that instantiation"
      - "It throws `ArrayStoreException` immediately at construction, because an `Object[]` cannot back a reference typed as `E[]`"
      - "It is a compile error, since casting an `Object[]` to a type-variable array type `E[]` is rejected outright by javac"
    answer: 0
    explanation: |
      Since `new E[]` is illegal, the idiom allocates an `Object[]` and casts to `E[]`, yielding an
      unchecked-cast warning. The runtime component type is `Object`, so it is safe only if the array
      is kept private and never exposed where callers could rely on/violate its apparent component
      type. Returning it as `E[]` to callers can later cause a `ClassCastException`. This is Effective
      Java Item 28's "prefer lists to arrays" tension.
    ref: "concepts.md#reifiable-types"
  - id: generics-type-system-055
    difficulty: expert
    tags: [wildcards, contravariance, code-analysis]
    question: |
      A `Comparator<Object>` can sort a `List<String>` because `Collections.sort` is declared roughly
      `static <T> void sort(List<T> list, Comparator<? super T> c)`. Why is `? super T` essential here?
    options:
      - "Because a Comparator is covariant in its type parameter, so `Comparator<Object>` is automatically a subtype of `Comparator<String>`, making any wildcard bound redundant here"
      - "It is not essential at all; a plain `Comparator<T>` bound accepts exactly the same set of comparators and offers identical flexibility when sorting a `List<String>`"
      - "To let the comparator act as a producer that manufactures fresh T values during the sort, which by PECS is precisely what a lower-bounded `? super T` enables"
      - "Because a Comparator is a CONSUMER of T; one written for a supertype (e.g. Comparator<Object>) can compare Ts, so `? super T` admits it — consumer-super"
    answer: 3
    explanation: |
      A `Comparator<X>` consumes X values (it compares them), so by PECS it takes `? super T`. A
      `Comparator<Object>` can compare any objects, including Strings, so it must be accepted when
      sorting a `List<String>`. Plain `Comparator<T>` would needlessly reject supertype comparators.
    ref: "concepts.md#wildcards-and-pecs"
  - id: generics-type-system-056
    difficulty: expert
    tags: [erasure, unchecked, code-analysis]
    question: |
      What is the run-time result?

      ```java
      static <T> T unsafeCast(Object o) { return (T) o; }
      String s = unsafeCast(Integer.valueOf(7));
      ```
    options:
      - "ClassCastException thrown inside unsafeCast, because the `(T) o` cast compiles to a real `(Integer)`-to-`String` check that fails the moment the method body runs"
      - "ClassCastException at the assignment site `String s = ...`, where the synthetic (String) cast runs; the `(T)` cast inside is a no-op after erasure"
      - "Prints nothing and runs cleanly to completion, with s harmlessly referencing the boxed Integer since erasure removes every cast on this code path"
      - "Compile error inside unsafeCast, because javac forbids casting an `Object` reference to an unbounded type variable T without an explicit class token"
    answer: 1
    explanation: |
      Inside `unsafeCast`, `(T) o` erases to `(Object) o` — effectively a no-op, no exception. The
      dangerous cast is the synthetic `(String)` the compiler inserts at the call site to satisfy the
      `String s` assignment. That is where the `ClassCastException` fires. Understanding *where* the
      real cast lives is the expert insight.
    ref: "concepts.md#type-erasure-and-its-consequences"
  - id: generics-type-system-057
    difficulty: expert
    tags: [invariance, arrays, generics, safety]
    question: |
      Which single sentence best explains why generics chose invariance while arrays are covariant?
    options:
      - "Invariance was required so that primitives such as int could be stored directly as generic type arguments without the boxing that array covariance forces"
      - "Arrays predate generics and their covariance is a language design mistake that generic invariance deliberately avoids, trading run-time ArrayStoreException for compile-time rejection"
      - "Generics dispatch faster when invariant, because the JIT can devirtualize element accesses that covariant containers would have to guard with a run-time type check"
      - "Arrays can only hold primitive component types and never object references, so their covariance is free of the heap-pollution risk that generics would incur"
    answer: 1
    explanation: |
      Array covariance lets unsafe stores compile and defers the check to run time
      (`ArrayStoreException`). Because generics are erased, no equivalent run-time store check exists,
      so allowing covariance would permit undetectable heap pollution. Invariance rejects the unsafe
      assignment at compile time — widely regarded as fixing the earlier array design.
    ref: "concepts.md#invariance-of-generics-versus-array-covariance"
  - id: generics-type-system-058
    difficulty: expert
    tags: [reflection, generic-signature, code-analysis]
    question: |
      A method `List<String> parse()` is compiled. Which statement about recovering `String` from
      that method via reflection is correct?
    options:
      - "Both getReturnType() and getGenericReturnType() return a ParameterizedType for List<String>, since reflection reifies the element type identically through either accessor"
      - "You must actually invoke the method and inspect the runtime class of an element in the returned list, because the declared return type carries no recoverable String information"
      - "Impossible; the return type is fully erased to raw List and the String argument survives nowhere in the compiled class file for reflection to read"
      - "`method.getReturnType()` gives `List`, but `method.getGenericReturnType()` gives a ParameterizedType from which `String` is recoverable via the Signature attribute"
    answer: 3
    explanation: |
      `getReturnType()` returns the erased class `List`. `getGenericReturnType()` reads the method's
      Signature attribute and returns `List<String>` as a `ParameterizedType`, from which `String` is
      recoverable. Declarations keep generic signatures even though instances do not — and inspecting a
      returned object cannot recover its element type due to erasure.
    ref: "concepts.md#interaction-with-reflection"
  - id: generics-type-system-059
    difficulty: expert
    tags: [bounded-types, inference, code-analysis]
    question: |
      Why does `<T extends Comparable<T>> T max(List<T> list)` fail to accept a `List<java.sql.Timestamp>`,
      whereas `<T extends Comparable<? super T>>` succeeds?
    options:
      - "`java.sql.Timestamp extends java.util.Date`, and Date implements `Comparable<Date>` not `Comparable<Timestamp>`; the strict `Comparable<T>` bound is unsatisfiable, but `Comparable<? super T>` admits Comparable<Date>"
      - "Timestamps are not comparable at all, because java.sql.Timestamp overrides compareTo to throw UnsupportedOperationException and therefore satisfies neither bound"
      - "Both signatures fail equally, since the compiler resolves any `Comparable` bound to its erasure and cannot distinguish `Comparable<T>` from `Comparable<? super T>` at inference time"
      - "Timestamp is not a class but a JDBC interface, so it can never be bound to a type variable T that a wildcard-free `Comparable<T>` bound requires"
    answer: 0
    explanation: |
      `Timestamp` inherits `Comparable<Date>` from `Date` (it is `Comparable<Date>`, not
      `Comparable<Timestamp>`). The strict `T extends Comparable<T>` requires `Timestamp` to be
      `Comparable<Timestamp>`, which it is not, so inference fails. The `? super T` lower bound accepts
      `Comparable<Date>`, so the general signature works — the real-world justification for
      `Collections.max`'s bound.
    ref: "concepts.md#bounded-type-parameters"
  - id: generics-type-system-060
    difficulty: expert
    tags: [reifiable, varargs, code-analysis, safety]
    question: |
      Even on a `@SafeVarargs` method, which action would make the annotation a LIE and reintroduce
      heap pollution?
    options:
      - "Iterating the array with an enhanced for loop, which internally rewrites to indexed stores that overwrite the caller's elements with erased Object values"
      - "Reading elements out of the varargs array by index, because each indexed read inserts a synthetic cast that can silently corrupt the underlying array's component type"
      - "Returning the varargs array itself (or storing a reference to it) so callers can put a wrong-typed element into the underlying array"
      - "Passing the array's length to another method, since exposing the count leaks enough type metadata for external code to pollute the backing store"
    answer: 2
    explanation: |
      `@SafeVarargs` promises the method does not do anything unsafe with the generic array. Merely
      reading or iterating is safe. But if the method returns the `T[]` (whose real component type is
      the erased bound) or otherwise leaks the reference, external code can store an incompatible
      element and pollute the heap — Effective Java Item 32's rule: never return or expose the varargs
      array.
    ref: "concepts.md#reifiable-types"
