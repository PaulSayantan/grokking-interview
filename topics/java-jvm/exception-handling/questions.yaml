topic: "Exception Handling"
domain: java-jvm
topic_slug: exception-handling
version: 1
questions:
  - id: exception-handling-001
    difficulty: beginner
    tags: [hierarchy, throwable]
    question: |
      What is the common superclass of every object that can be thrown with the
      `throw` keyword or caught in a `catch` clause in Java?
    options:
      - "java.lang.Throwable"
      - "java.lang.Object"
      - "java.lang.Exception"
      - "java.lang.Error"
    answer: 0
    explanation: |
      `Throwable` is the root of the throwable hierarchy; only `Throwable` and its
      subtypes may be thrown or caught. `Exception` and `Error` are its two direct
      subclasses, and `Object` is the parent of `Throwable` but is not itself
      throwable.
    ref: "concepts.md#the-throwable-hierarchy"

  - id: exception-handling-002
    difficulty: beginner
    tags: [checked, unchecked]
    question: |
      Which of the following is a CHECKED exception (one the compiler forces you to
      catch or declare)?
    options:
      - "NullPointerException"
      - "IllegalArgumentException"
      - "IOException"
      - "ArrayIndexOutOfBoundsException"
    answer: 2
    explanation: |
      `IOException` extends `Exception` but not `RuntimeException`, so it is checked.
      The other three all extend `RuntimeException` and are unchecked, so the compiler
      never requires them to be handled.
    ref: "concepts.md#checked-versus-unchecked-versus-error"

  - id: exception-handling-003
    difficulty: beginner
    tags: [error, hierarchy]
    question: |
      Which category do `OutOfMemoryError` and `StackOverflowError` belong to?
    options:
      - "Compiler-enforced checked exceptions"
      - "Subclasses of RuntimeException"
      - "Subclasses of IOException"
      - "Subclasses of Error (unchecked)"
    answer: 3
    explanation: |
      Both extend `Error`, which represents serious JVM/environment failures. Errors
      are unchecked (the compiler does not require handling them) and by convention
      should generally not be caught, because the JVM may be in a compromised state.
    ref: "concepts.md#checked-versus-unchecked-versus-error"

  - id: exception-handling-004
    difficulty: beginner
    tags: [finally]
    question: |
      In a `try`/`catch`/`finally` statement, when does the `finally` block run?
    options:
      - "Only when the try block finishes normally without throwing any exception"
      - "After the try (and any matching catch) completes, whether normally or abruptly"
      - "Only when an exception is thrown and a matching catch clause handles it"
      - "Only when the enclosing method contains no return statement anywhere"
    answer: 1
    explanation: |
      `finally` runs regardless of how the `try`/`catch` completes — normal
      completion, a caught exception, a propagating exception, or a `return`. It is
      intended for cleanup. It is skipped only in extreme cases like `System.exit()`
      or a JVM crash.
    ref: "concepts.md#try-catch-finally"

  - id: exception-handling-005
    difficulty: beginner
    tags: [try-with-resources, version]
    question: |
      In which Java version were try-with-resources, multi-catch, and suppressed
      exceptions all introduced?
    options:
      - "Java 7"
      - "Java 5"
      - "Java 6"
      - "Java 8"
    answer: 0
    explanation: |
      All three arrived in Java 7 as part of JSR 334 ("Project Coin"). Java 8 added
      lambdas and streams; Java 5 added generics and autoboxing; none of those three
      features existed before Java 7.
    ref: "concepts.md#try-with-resources-and-autocloseable"

  - id: exception-handling-006
    difficulty: beginner
    tags: [try-with-resources, autocloseable]
    question: |
      Which interface must a resource implement to be usable in the header of a
      try-with-resources statement?
    options:
      - "java.io.Serializable"
      - "java.lang.Runnable"
      - "java.lang.AutoCloseable"
      - "java.util.concurrent.Callable"
    answer: 2
    explanation: |
      A try-with-resources resource must implement `AutoCloseable` (introduced in Java
      7), whose single method is `void close() throws Exception`. `Closeable` also
      works because it extends `AutoCloseable`, but `AutoCloseable` is the required
      supertype.
    ref: "concepts.md#try-with-resources-and-autocloseable"

  - id: exception-handling-007
    difficulty: beginner
    tags: [chaining]
    question: |
      What does exception chaining accomplish?
    options:
      - "It automatically retries the failed operation a fixed number of times before giving up"
      - "It converts a checked exception into an unchecked one automatically at runtime"
      - "It merges several exceptions into a single stack trace with no cause"
      - "It wraps a lower-level exception as the 'cause' of a higher-level one, preserving the original"
    answer: 3
    explanation: |
      Chaining stores the original throwable as the `cause` of a new exception (via the
      two-arg constructor or `initCause`), preserving the root diagnostic detail while
      raising the abstraction level. It does not retry, and it does not change the
      checked/unchecked status of anything.
    ref: "concepts.md#exception-chaining"

  - id: exception-handling-008
    difficulty: beginner
    tags: [best-practices, swallow]
    question: |
      Why is an empty `catch` block such as `catch (IOException e) {}` considered an
      anti-pattern?
    options:
      - "It causes a compile error because a catch block must contain a statement"
      - "It silently swallows the failure, hiding bugs and discarding the stack trace"
      - "It rethrows the caught exception twice, producing a duplicated stack trace"
      - "It silently converts the caught exception into an unchecked Error at runtime"
    answer: 1
    explanation: |
      Swallowing an exception discards all information about the failure, so bugs go
      unnoticed and are extremely hard to diagnose later. At minimum you should log the
      exception object (which carries the stack trace); usually you should rethrow or
      handle it meaningfully. It compiles fine — that is exactly why it is dangerous.
    ref: "concepts.md#best-practices"

  - id: exception-handling-009
    difficulty: beginner
    tags: [custom-exceptions]
    question: |
      To define a custom UNCHECKED exception, which class should you extend?
    options:
      - "RuntimeException"
      - "Exception"
      - "Throwable"
      - "Error"
    answer: 0
    explanation: |
      Extending `RuntimeException` makes the exception unchecked. Extending `Exception`
      (but not `RuntimeException`) would make it checked. You should not normally extend
      `Throwable` or `Error` directly.
    ref: "concepts.md#custom-exceptions"

  - id: exception-handling-010
    difficulty: beginner
    tags: [performance]
    question: |
      Which operation is generally the most expensive part of throwing an exception in
      Java?
    options:
      - "The catch block searching for a handler that matches the exception type"
      - "The garbage collection of the exception object after it is caught and handled"
      - "Capturing the stack trace in fillInStackTrace() when the exception is constructed"
      - "Serializing the exception object to disk before it propagates to the caller"
    answer: 2
    explanation: |
      Constructing a `Throwable` calls `fillInStackTrace()`, which walks the call stack
      to record frames — this dominates the cost. The actual stack unwinding of
      `throw`/`catch` is comparatively cheap, and exceptions are not serialized to disk
      by default.
    ref: "concepts.md#performance-of-exceptions"

  - id: exception-handling-011
    difficulty: beginner
    tags: [multi-catch]
    question: |
      What is the primary benefit of multi-catch (`catch (A | B e)`) introduced in
      Java 7?
    options:
      - "It catches exceptions thrown across several different worker threads at once"
      - "It automatically retries the operation once for each listed exception type"
      - "It quietly reclassifies the listed checked exceptions as unchecked ones"
      - "It lets one catch clause handle several exception types without duplicating handler code"
    answer: 3
    explanation: |
      Multi-catch removes the need to duplicate identical handling logic across several
      `catch` blocks for unrelated exception types. It has no effect on threads,
      retries, or the checked/unchecked distinction.
    ref: "concepts.md#multi-catch"

  - id: exception-handling-012
    difficulty: beginner
    tags: [checked, keyword]
    question: |
      Which keyword declares that a method may propagate a checked exception to its
      caller instead of handling it?
    options:
      - "throw"
      - "throws"
      - "catch"
      - "finally"
    answer: 1
    explanation: |
      `throws` in a method signature declares checked exceptions the method may
      propagate. `throw` (no 's') actually raises an exception instance. `catch` and
      `finally` are part of the `try` statement.
    ref: "concepts.md#checked-versus-unchecked-versus-error"

  - id: exception-handling-013
    difficulty: intermediate
    tags: [finally, return, code-analysis]
    question: |
      What does this method return?

      ```java
      int f() {
          try {
              return 1;
          } finally {
              return 2;
          }
      }
      ```
    options:
      - "2"
      - "1"
      - "It does not compile"
      - "It throws an exception"
    answer: 0
    explanation: |
      A `return` in `finally` replaces the value the `try` was about to return, so the
      method returns 2. This is exactly why returning from `finally` is discouraged: it
      silently overrides (and can discard exceptions from) the `try`/`catch`.
    ref: "concepts.md#finally-and-return-gotchas"

  - id: exception-handling-014
    difficulty: intermediate
    tags: [finally, return, code-analysis]
    question: |
      What does this method return?

      ```java
      int h() {
          int x = 1;
          try {
              return x;
          } finally {
              x = 99;
          }
      }
      ```
    options:
      - "99"
      - "0"
      - "1"
      - "It does not compile"
    answer: 2
    explanation: |
      The return expression `x` is evaluated to the value 1 and held on the operand
      stack before `finally` runs. Reassigning the local `x` to 99 afterward has no
      effect on the already-captured return value, so the method returns 1.
    ref: "concepts.md#finally-and-return-gotchas"

  - id: exception-handling-015
    difficulty: intermediate
    tags: [finally, exception, code-analysis]
    question: |
      What does the caller observe when calling `g()`?

      ```java
      int g() {
          try {
              throw new RuntimeException("boom");
          } finally {
              return 0;
          }
      }
      ```
    options:
      - "A RuntimeException with message 'boom' propagates"
      - "The method returns 0 and then throws 'boom'"
      - "It does not compile because a finally block may not contain a return"
      - "The method returns 0 and the exception is silently discarded"
    answer: 3
    explanation: |
      A `return` in `finally` completes the method abruptly by returning, which
      discards the in-flight `RuntimeException`. The caller sees 0 and never learns
      about "boom" — a classic reason not to return from `finally`.
    ref: "concepts.md#finally-and-return-gotchas"

  - id: exception-handling-016
    difficulty: intermediate
    tags: [catch-order, code-analysis]
    question: |
      Why does the following code fail to compile?

      ```java
      try {
          risky();
      } catch (Exception e) {
          handle(e);
      } catch (IOException e) {
          handleIo(e);
      }
      ```
    options:
      - "IOException is unchecked, so it can never appear in a catch clause at all"
      - "The IOException clause is unreachable because Exception (a supertype) is caught first"
      - "You cannot attach two separate catch clauses to a single try block"
      - "Exception must be caught last, but only when a finally block is also present"
    answer: 1
    explanation: |
      Catch clauses are evaluated top-to-bottom. Since `IOException` is a subtype of
      `Exception`, the first clause already handles it, making the second clause
      unreachable — a compile error. The more specific type must come first.
    ref: "concepts.md#try-catch-finally"

  - id: exception-handling-017
    difficulty: intermediate
    tags: [multi-catch, code-analysis]
    question: |
      Why does this multi-catch fail to compile?

      ```java
      try {
          io();
      } catch (IOException | FileNotFoundException e) {
          log(e);
      }
      ```
    options:
      - "FileNotFoundException is a subclass of IOException, so listing both is redundant and illegal"
      - "Multi-catch clauses are limited to at most one exception type each"
      - "The variable e must be declared final explicitly before it can be used"
      - "IOException is unchecked and therefore cannot be combined in a multi-catch"
    answer: 0
    explanation: |
      In a multi-catch the alternatives must not be in a subclass/superclass
      relationship. `FileNotFoundException` extends `IOException`, so it is already
      covered — the compiler rejects the redundant alternative.
    ref: "concepts.md#multi-catch"

  - id: exception-handling-018
    difficulty: intermediate
    tags: [multi-catch]
    question: |
      In a multi-catch clause `catch (A | B e)`, what is true about the variable `e`?
    options:
      - "It can be reassigned to a different exception instance inside the block"
      - "Its static type is always Throwable regardless of A and B"
      - "It is implicitly final and its static type is the least upper bound of A and B"
      - "It must be explicitly declared with the final keyword or it will not compile"
    answer: 2
    explanation: |
      The multi-catch variable is implicitly final (you cannot reassign it), and its
      static type is the most specific common supertype (least upper bound) of the
      listed alternatives, so you can only call members common to all of them. You do
      not need to write `final` yourself.
    ref: "concepts.md#multi-catch"

  - id: exception-handling-019
    difficulty: intermediate
    tags: [try-with-resources, order, code-analysis]
    question: |
      Given `try (A a = new A(); B b = new B()) { ... }`, in what order are the
      resources closed?
    options:
      - "a is closed first, then b (the same order they were declared in)"
      - "The order is unspecified and may vary between JVM implementations"
      - "Only the last declared resource (b) is closed"
      - "b is closed first, then a (reverse of declaration order)"
    answer: 3
    explanation: |
      try-with-resources closes resources in the reverse of their declaration order, so
      `b.close()` runs before `a.close()`. This mirrors correct manual nesting and
      ensures dependent resources are torn down before the ones they rely on.
    ref: "concepts.md#try-with-resources-and-autocloseable"

  - id: exception-handling-020
    difficulty: intermediate
    tags: [suppressed, code-analysis]
    question: |
      Consider:

      ```java
      try (AutoCloseable a = () -> { throw new RuntimeException("close-fail"); }) {
          throw new IllegalStateException("body-fail");
      }
      ```

      Which exception propagates, and what happens to the other?
    options:
      - "close-fail propagates as primary; body-fail is attached to it as suppressed"
      - "body-fail propagates; close-fail is added as a suppressed exception"
      - "Both are thrown together, wrapped in a single MultiException container"
      - "body-fail propagates and close-fail is silently discarded with no record"
    answer: 1
    explanation: |
      In try-with-resources the body's exception is primary and propagates; an
      exception from an automatic `close()` is attached to it via `addSuppressed` and
      retrievable with `getSuppressed()`. This is the opposite of the old manual
      `finally { close(); }` idiom, where the close exception would mask the body's.
    ref: "concepts.md#suppressed-exceptions"

  - id: exception-handling-021
    difficulty: intermediate
    tags: [chaining, api]
    question: |
      Which of these correctly preserves the original `SQLException` as the cause when
      wrapping it?
    options:
      - "throw new RepositoryException(\"failed\", e);"
      - "throw new RepositoryException(\"failed\");"
      - "throw new RepositoryException(\"failed\" + e.getMessage());"
      - "throw new RepositoryException(e.toString());"
    answer: 0
    explanation: |
      Passing `e` to a constructor that forwards to `Throwable(String, Throwable)`
      records it as the cause, preserving the original stack trace under `Caused by:`.
      Merely including the message text (options with string concatenation or
      `toString`) loses the original stack trace and cause linkage.
    ref: "concepts.md#exception-chaining"

  - id: exception-handling-022
    difficulty: intermediate
    tags: [chaining, initcause]
    question: |
      What happens if you call `initCause(x)` on a throwable that already had a cause
      supplied through its two-arg `(message, cause)` constructor?
    options:
      - "The new cause silently replaces the old one"
      - "It throws IllegalArgumentException"
      - "It throws IllegalStateException"
      - "It returns null and does nothing"
    answer: 2
    explanation: |
      `initCause` can be called at most once and only if no cause was already set. If
      the cause was already provided (via constructor or a prior `initCause`), calling
      it again throws `IllegalStateException`.
    ref: "concepts.md#exception-chaining"

  - id: exception-handling-023
    difficulty: intermediate
    tags: [checked, error, catch]
    question: |
      Does `catch (Exception e)` catch an `OutOfMemoryError`?
    options:
      - "Yes, because Error is a subclass of Exception in the Throwable hierarchy"
      - "Yes, but only if the try block also explicitly catches Throwable first"
      - "No, because OutOfMemoryError is a checked exception the compiler tracks"
      - "No, because Error is a sibling of Exception under Throwable, not a subtype"
    answer: 3
    explanation: |
      `Error` and `Exception` are both direct subclasses of `Throwable`; `Error` is not
      under `Exception`. So `catch (Exception e)` does not catch `OutOfMemoryError`. To
      catch it you would need `catch (Error e)` or `catch (Throwable t)`.
    ref: "concepts.md#checked-versus-unchecked-versus-error"

  - id: exception-handling-024
    difficulty: intermediate
    tags: [best-practices, interrupt]
    question: |
      You catch an `InterruptedException` in a worker but do not rethrow it. What is
      the recommended thing to do?
    options:
      - "Ignore it entirely; the interrupt flag is irrelevant once the exception is caught"
      - "Call Thread.currentThread().interrupt() to restore the interrupt status"
      - "Call Thread.sleep(0) to reset the thread's interrupt state to its default"
      - "Rethrow it wrapped as an Error so it bypasses the checked-exception rules"
    answer: 1
    explanation: |
      Catching `InterruptedException` clears the thread's interrupt flag. If you do not
      propagate the exception, you should restore the flag with
      `Thread.currentThread().interrupt()` so that higher-level code can still observe
      that an interruption was requested.
    ref: "concepts.md#best-practices"

  - id: exception-handling-025
    difficulty: intermediate
    tags: [when-checked, lambdas]
    question: |
      Why do checked exceptions interact poorly with the Java 8 Streams API and
      functional interfaces?
    options:
      - "Functional interfaces like Function do not declare throws, so a checked exception inside a lambda forces a try/catch within the lambda"
      - "Streams disable exception handling entirely inside any pipeline operation"
      - "Lambdas automatically convert every checked exception into an unchecked Error"
      - "The stream pipeline silently swallows every exception thrown by its stages"
    answer: 0
    explanation: |
      Standard `java.util.function` interfaces (e.g. `Function`, `Supplier`) declare no
      checked exceptions, so code inside a lambda that throws a checked exception must
      catch it inline or wrap it in an unchecked exception. This friction is a major
      reason modern code favors unchecked exceptions.
    ref: "concepts.md#when-to-use-checked-versus-unchecked"

  - id: exception-handling-026
    difficulty: intermediate
    tags: [closeable, autocloseable]
    question: |
      What is the relationship between `java.io.Closeable` and `java.lang.AutoCloseable`?
    options:
      - "They are entirely unrelated interfaces with no inheritance link between them"
      - "AutoCloseable extends Closeable and inherits its IOException-only close() method"
      - "Closeable extends AutoCloseable and narrows close() to throw only IOException"
      - "Closeable was removed and fully replaced by AutoCloseable starting in Java 7"
    answer: 2
    explanation: |
      `AutoCloseable` (Java 7) is the more general interface whose `close()` throws
      `Exception`. The pre-existing `Closeable` extends it and overrides `close()` to
      throw only `IOException`, keeping backward compatibility for I/O streams.
    ref: "concepts.md#try-with-resources-and-autocloseable"

  - id: exception-handling-027
    difficulty: intermediate
    tags: [best-practices, fail-fast]
    question: |
      What does the "fail fast" principle recommend for argument validation?
    options:
      - "Catch every exception and continue processing using safe default values instead"
      - "Defer all validation to the outermost caller at the top of the call stack"
      - "Only validate arguments inside a finally block after the main work has run"
      - "Validate preconditions at the top of a method and throw immediately on bad input"
    answer: 3
    explanation: |
      Fail fast means detecting invalid state as early as possible (e.g.
      `Objects.requireNonNull`, `IllegalArgumentException` at method entry) so the error
      surfaces close to its origin, rather than propagating corrupt state that fails far
      away and is hard to trace.
    ref: "concepts.md#best-practices"

  - id: exception-handling-028
    difficulty: intermediate
    tags: [custom-exceptions, standard]
    question: |
      Which is the best practice when you need to signal that a method argument is
      invalid?
    options:
      - "Define a brand-new MyInvalidArgException class for every validation case"
      - "Reuse the standard IllegalArgumentException"
      - "Throw a raw Throwable so any handler in the stack can catch it"
      - "Return null and let each caller check the result before proceeding"
    answer: 1
    explanation: |
      Reuse standard exceptions where they fit; `IllegalArgumentException` is the
      idiomatic choice for invalid arguments. Inventing redundant custom types adds
      noise, and returning null pushes error handling onto every caller and invites
      NullPointerExceptions.
    ref: "concepts.md#custom-exceptions"

  - id: exception-handling-029
    difficulty: intermediate
    tags: [suppressed, api]
    question: |
      What does `Throwable.getSuppressed()` return when no exceptions have been
      suppressed?
    options:
      - "An empty array (length 0)"
      - "null"
      - "The primary exception itself"
      - "It throws NoSuchElementException"
    answer: 0
    explanation: |
      `getSuppressed()` returns an empty `Throwable[]` (length 0), never null, when
      nothing has been suppressed. This lets callers iterate safely without a null
      check.
    ref: "concepts.md#suppressed-exceptions"

  - id: exception-handling-030
    difficulty: intermediate
    tags: [try-with-resources, version]
    question: |
      What enhancement to try-with-resources did Java 9 (JEP 213) introduce?
    options:
      - "The ability to omit the close() call entirely and let the GC finalize resources"
      - "Support for catching Error subclasses directly in the resource declaration header"
      - "The ability to use an already-declared effectively final variable in the try header"
      - "Automatic retry of failed close() calls up to three times before giving up"
    answer: 2
    explanation: |
      JEP 213 ("Milling Project Coin", Java 9) lets you write `try (r) { ... }` where
      `r` is a final or effectively final variable declared earlier, instead of
      requiring a fresh declaration inside the header. Java 7's version required
      declaring the variable in the header.
    ref: "concepts.md#try-with-resources-and-autocloseable"

  - id: exception-handling-031
    difficulty: intermediate
    tags: [best-practices, logging]
    question: |
      Why is "log and rethrow the same exception at every layer" discouraged?
    options:
      - "It silently changes the exception's runtime type as it moves up each layer"
      - "The act of logging consumes and swallows the exception so it stops propagating"
      - "Rethrowing a given exception instance is only permitted once per JVM lifetime"
      - "It produces duplicate, noisy stack traces; log once at the handling boundary instead"
    answer: 3
    explanation: |
      Logging the same exception at each layer as it propagates yields multiple copies
      of essentially the same stack trace, cluttering logs and making the real handling
      point unclear. Best practice is to log once, at the boundary where the exception
      is actually handled.
    ref: "concepts.md#best-practices"

  - id: exception-handling-032
    difficulty: intermediate
    tags: [finally, skip]
    question: |
      Which of the following WILL cause a `finally` block to be skipped?
    options:
      - "A return statement in the try block"
      - "A call to System.exit() in the try block"
      - "An exception thrown in the try block"
      - "A break statement in the try block"
    answer: 1
    explanation: |
      `System.exit()` terminates the JVM, so `finally` does not run. A `return`,
      `break`, or thrown exception all still run `finally` before completing. Other ways
      to skip it are a JVM crash, an infinite loop, or a daemon thread killed at
      shutdown.
    ref: "concepts.md#try-catch-finally"

  - id: exception-handling-033
    difficulty: advanced
    tags: [suppressed, code-analysis, twr]
    question: |
      In this code, what is printed?

      ```java
      class R implements AutoCloseable {
          public void close() { throw new RuntimeException("close"); }
      }
      try (R r = new R()) {
          throw new IllegalStateException("body");
      } catch (Exception e) {
          System.out.println(e.getMessage() + " / " + e.getSuppressed().length);
      }
      ```
    options:
      - "body / 1"
      - "close / 0"
      - "body / 0"
      - "close / 1"
    answer: 0
    explanation: |
      The body throws `IllegalStateException("body")`, which is primary and caught. The
      `close()` exception is suppressed and attached to it, so `getMessage()` is "body"
      and `getSuppressed().length` is 1.
    ref: "concepts.md#suppressed-exceptions"

  - id: exception-handling-034
    difficulty: advanced
    tags: [performance, fillinstacktrace]
    question: |
      How can you make a custom exception dramatically cheaper to throw on a hot path,
      at the cost of diagnosability?
    options:
      - "Mark the exception class final so the JIT can inline its constructor cheaply"
      - "Extend Error instead of RuntimeException so the JVM skips capturing the trace"
      - "Override fillInStackTrace() to return this without walking the stack, or use the 4-arg constructor with writableStackTrace=false"
      - "Wrap the throwing call site in a try/finally, since the cost lives in the catch/unwind rather than the throw"
    answer: 2
    explanation: |
      The dominant cost of an exception is capturing the stack trace in
      `fillInStackTrace()`. Overriding it to skip the walk, or using the Java 7 four-arg
      `Throwable` constructor with `writableStackTrace=false`, removes that cost. You
      lose the stack trace, so this is only appropriate for controlled control-flow
      signals.
    ref: "concepts.md#performance-of-exceptions"

  - id: exception-handling-035
    difficulty: advanced
    tags: [performance, jvm-flag]
    question: |
      A production log shows repeated `NullPointerException` with no message and no
      stack trace. What is the most likely cause and fix?
    options:
      - "The exception objects were serialized incorrectly; make the class implement Serializable"
      - "The JVM is silently running low on heap and truncating the traces; add more heap"
      - "The logging framework is stripping the stack traces; reconfigure the logger layout"
      - "HotSpot's fast-throw optimization is reusing a preallocated stackless instance; disable it with -XX:-OmitStackTraceInFastThrow"
    answer: 3
    explanation: |
      After a built-in exception recurs many times at the same hot site, HotSpot
      switches to throwing a preallocated, stackless instance for speed — hence no
      message and no trace. Running with `-XX:-OmitStackTraceInFastThrow` disables this
      so full traces reappear for debugging.
    ref: "concepts.md#performance-of-exceptions"

  - id: exception-handling-036
    difficulty: advanced
    tags: [finally, code-analysis, exception-override]
    question: |
      What does the caller see?

      ```java
      String m() {
          try {
              throw new RuntimeException("A");
          } finally {
              throw new IllegalStateException("B");
          }
      }
      ```
    options:
      - "RuntimeException 'A' propagates; 'B' is attached to it via addSuppressed()"
      - "IllegalStateException 'B' propagates; 'A' is discarded (not suppressed)"
      - "Both 'A' and 'B' propagate together bundled in a single composite exception"
      - "It does not compile because m() has no reachable return statement"
    answer: 1
    explanation: |
      A `throw` in `finally` completes the block abruptly with the new exception,
      replacing the in-flight `RuntimeException("A")`. Unlike try-with-resources
      suppression, the original is simply lost — it is NOT added to
      `getSuppressed()`. The method compiles because it always completes abruptly.
    ref: "concepts.md#finally-and-return-gotchas"

  - id: exception-handling-037
    difficulty: advanced
    tags: [twr, close-order, code-analysis]
    question: |
      Given resources that print on close, what is the output?

      ```java
      class C implements AutoCloseable {
          final String n; C(String n){this.n=n;}
          public void close(){ System.out.print(n); }
      }
      try (C a = new C("A"); C b = new C("B"); C c = new C("C")) { }
      ```
    options:
      - "CBA"
      - "ABC"
      - "BCA"
      - "ACB"
    answer: 0
    explanation: |
      Resources are closed in reverse declaration order, so C is closed first, then B,
      then A, printing "CBA".
    ref: "concepts.md#try-with-resources-and-autocloseable"

  - id: exception-handling-038
    difficulty: advanced
    tags: [twr, old-idiom, masking]
    question: |
      In the pre-Java-7 idiom below, if `use()` throws E1 and then `in.close()` throws
      E2, which exception does the caller see?

      ```java
      InputStream in = open();
      try {
          use(in);          // throws E1
      } finally {
          in.close();       // throws E2
      }
      ```
    options:
      - "E1, with E2 suppressed"
      - "E1 propagates, E2 lost"
      - "E2, and E1 is lost (masked)"
      - "Both E1 and E2 propagate"
    answer: 2
    explanation: |
      A throw from `finally` (here `in.close()` throwing E2) replaces the in-flight E1,
      so the caller sees E2 and E1 is masked/lost. This masking bug is precisely what
      try-with-resources fixed by making E1 primary and E2 suppressed.
    ref: "concepts.md#try-with-resources-and-autocloseable"

  - id: exception-handling-039
    difficulty: advanced
    tags: [chaining, code-analysis, mutable]
    question: |
      What does this print?

      ```java
      StringBuilder m() {
          StringBuilder sb = new StringBuilder("x");
          try {
              return sb;
          } finally {
              sb.append("y");
          }
      }
      // caller: System.out.println(m());
      ```
    options:
      - "x"
      - "y"
      - "It does not compile"
      - "xy"
    answer: 3
    explanation: |
      The return captures the reference to the `StringBuilder`, not a snapshot of its
      contents. `finally` then mutates the same object via `append("y")`. Since the
      caller holds that same reference, it sees "xy". Contrast with a primitive/local
      reassignment, which would not be visible.
    ref: "concepts.md#finally-and-return-gotchas"

  - id: exception-handling-040
    difficulty: advanced
    tags: [multi-catch, bytecode]
    question: |
      Compared to two separate catch blocks with identical bodies, how does the
      compiler typically implement a single multi-catch clause?
    options:
      - "It duplicates the full handler body once for each listed exception type"
      - "It generates one shared handler referenced by multiple entries in the method's exception table"
      - "It creates a runtime instanceof chain inside a single catch(Throwable)"
      - "It extracts the handler into a synthetic private method invoked from each type"
    answer: 1
    explanation: |
      Multi-catch compiles to a single handler block that multiple exception-table
      entries point to, producing more compact bytecode than duplicating the handler
      body per type — which is what two identical single catches would generate.
    ref: "concepts.md#multi-catch"

  - id: exception-handling-041
    difficulty: advanced
    tags: [rethrow, precise-rethrow, code-analysis]
    question: |
      Java 7 "more precise rethrow" allows the following to compile even though the
      catch parameter is declared as `Exception`. Why?

      ```java
      void m() throws IOException, ParseException {
          try {
              if (cond()) throw new IOException();
              else throw new ParseException("", 0);
          } catch (Exception e) {
              cleanup();
              throw e;   // legal: declared throws are only IOException, ParseException
          }
      }
      ```
    options:
      - "Because the compiler analyzes that e can only be one of the exact types thrown in the try, not any Exception"
      - "Because e is reassigned to a fresh Exception inside the catch block first"
      - "Because Exception was reclassified as an unchecked runtime type in Java 7"
      - "Because throw of a caught parameter is always allowed regardless of its type"
    answer: 0
    explanation: |
      Since Java 7, if the catch parameter is effectively final and not reassigned, the
      compiler performs precise-rethrow analysis: it knows `e` can only be one of the
      types actually thrown in the try (`IOException` or `ParseException`), so `throw e`
      is compatible with a narrower `throws` clause. Reassigning `e` would defeat this.
    ref: "concepts.md#multi-catch"

  - id: exception-handling-042
    difficulty: advanced
    tags: [suppressed, api, manual]
    question: |
      Which statement about `addSuppressed` is correct?
    options:
      - "It can only be called by the JVM during try-with-resources, never by user code"
      - "It replaces getCause() and cannot coexist with a cause"
      - "User code may call it directly to attach secondary throwables, and suppression can be disabled via the 4-arg Throwable constructor"
      - "It throws IllegalStateException if called more than once"
    answer: 2
    explanation: |
      `addSuppressed(Throwable)` is public API that user code can call to attach
      secondary exceptions; it can be called multiple times. Suppression can be turned
      off per-throwable through the protected four-arg `Throwable` constructor
      (`enableSuppression=false`). It is independent of the cause mechanism.
    ref: "concepts.md#suppressed-exceptions"

  - id: exception-handling-043
    difficulty: advanced
    tags: [npe, version, jep358]
    question: |
      Which JEP introduced "Helpful NullPointerExceptions" that describe exactly which
      variable was null, and in which Java version did it first appear?
    options:
      - "JEP 213, Java 9"
      - "JEP 358, Java 11"
      - "JEP 286, Java 10"
      - "JEP 358, Java 14 (off by default), on by default since Java 15"
    answer: 3
    explanation: |
      JEP 358 delivered Helpful NullPointerExceptions in Java 14, initially disabled by
      default and enabled with `-XX:+ShowCodeDetailsInExceptionMessages`; it became
      enabled by default in Java 15. It reports which specific expression/variable was
      null.
    ref: "concepts.md#performance-of-exceptions"

  - id: exception-handling-044
    difficulty: advanced
    tags: [checked, override, rules]
    question: |
      An overriding method in a subclass may declare which checked exceptions in its
      `throws` clause, relative to the overridden superclass method?
    options:
      - "Any checked exceptions it wants, with no restriction"
      - "Only the same or narrower (subtype) checked exceptions, or fewer — it may not add new broader checked exceptions"
      - "Only broader checked exceptions"
      - "It must declare exactly the same throws clause"
    answer: 1
    explanation: |
      An override cannot broaden the checked-exception contract: it may throw the same
      checked exceptions, subtypes of them, or fewer (including none), but not new or
      broader checked exceptions. It may freely throw unchecked exceptions regardless.
    ref: "concepts.md#checked-versus-unchecked-versus-error"

  - id: exception-handling-045
    difficulty: advanced
    tags: [twr, close-throws, code-analysis]
    question: |
      If the body of a try-with-resources completes NORMALLY but `close()` throws, what
      happens?
    options:
      - "The close() exception propagates as the primary (thrown) exception"
      - "The close() exception is swallowed because the body succeeded"
      - "The close() exception is stored only in getSuppressed() and does not propagate"
      - "It is converted into an Error"
    answer: 0
    explanation: |
      When the body finishes normally, there is no primary exception, so an exception
      from `close()` becomes the one that propagates. Suppression only occurs when the
      body already threw; then close's exception is the suppressed one.
    ref: "concepts.md#suppressed-exceptions"

  - id: exception-handling-046
    difficulty: advanced
    tags: [performance, try-cost]
    question: |
      What is the steady-state performance cost of a `try` block that never actually
      throws, on a modern HotSpot JVM?
    options:
      - "Significant, because every try installs a runtime guard on each statement"
      - "Proportional to the number of catch clauses, executed on every iteration"
      - "Essentially negligible, because HotSpot uses static exception tables rather than per-statement instrumentation"
      - "It disables JIT compilation of the enclosing method"
    answer: 2
    explanation: |
      Exception dispatch uses a per-method exception table consulted only when a throw
      occurs. A try block that does not throw adds essentially no runtime cost, so
      wrapping code in try/catch is cheap until an exception is actually raised.
    ref: "concepts.md#performance-of-exceptions"

  - id: exception-handling-047
    difficulty: advanced
    tags: [custom-exceptions, serialization]
    question: |
      Why should a custom exception generally provide a constructor that accepts a
      `Throwable cause`?
    options:
      - "Because the compiler requires all exceptions to have such a constructor"
      - "Because getSuppressed() will not work otherwise"
      - "Because it is the only way to make the exception Serializable"
      - "So callers can chain the underlying cause, preserving the original stack trace when wrapping"
    answer: 3
    explanation: |
      A cause-accepting constructor (forwarding to `super(message, cause)`) lets callers
      wrap a lower-level exception while retaining its diagnostic chain. It is a
      convention, not a compiler requirement, and is unrelated to suppression or
      serializability.
    ref: "concepts.md#custom-exceptions"

  - id: exception-handling-048
    difficulty: advanced
    tags: [when-checked, design]
    question: |
      According to Effective Java's guidance, which condition best justifies a CHECKED
      exception rather than an unchecked one?
    options:
      - "A programming bug such as passing null where non-null is required"
      - "A recoverable condition the caller can reasonably be expected to handle and act on"
      - "Any condition inside a stream pipeline"
      - "An unrecoverable JVM failure such as running out of memory"
    answer: 1
    explanation: |
      Bloch's guidance: use checked exceptions for recoverable conditions the caller
      should handle, and unchecked (runtime) exceptions for programming errors.
      Unrecoverable JVM failures are `Error`s, and precondition violations are unchecked
      `RuntimeException`s.
    ref: "concepts.md#when-to-use-checked-versus-unchecked"

  - id: exception-handling-049
    difficulty: advanced
    tags: [chaining, code-analysis, caused-by]
    question: |
      A stack trace shows a top-level `ServiceException` followed by a `Caused by:
      SQLException` section. What does this tell you?
    options:
      - "The SQLException was chained as the cause of the ServiceException via a two-arg constructor or initCause"
      - "Two independent exceptions were thrown on different threads"
      - "The SQLException was suppressed by try-with-resources"
      - "The ServiceException is a subclass of SQLException"
    answer: 0
    explanation: |
      `Caused by:` sections render the `cause` chain set through `Throwable(String,
      Throwable)` or `initCause`. Suppressed exceptions appear under `Suppressed:`, not
      `Caused by:`, and chaining implies no subclass relationship between the two.
    ref: "concepts.md#exception-chaining"

  - id: exception-handling-050
    difficulty: expert
    tags: [twr, spec, close-both-throw, code-analysis]
    question: |
      With TWO resources, if `close()` on the FIRST-closed resource throws E1 and
      `close()` on the second-closed resource throws E2 (and the body completed
      normally), what propagates?

      ```java
      try (C a = new C(); C b = new C()) { }  // b closes first (E_b), then a (E_a)
      ```
    options:
      - "E_a propagates as primary; E_b is suppressed onto it"
      - "Both are wrapped in a new RuntimeException"
      - "E_b propagates as primary; E_a is suppressed onto it"
      - "Only the last-thrown (E_a) propagates; E_b is silently lost"
    answer: 2
    explanation: |
      Resources close in reverse order, so `b` closes first and its exception E_b
      becomes the primary propagating exception. When `a` then closes and throws E_a,
      that exception is added as suppressed onto E_b. The first exception encountered
      during the close sequence wins; later ones are suppressed.
    ref: "concepts.md#suppressed-exceptions"

  - id: exception-handling-051
    difficulty: expert
    tags: [finally, jls, break, code-analysis]
    question: |
      What does this loop print?

      ```java
      int r = 0;
      for (int i = 0; i < 3; i++) {
          try {
              if (i == 1) break;
          } finally {
              r += 10;
          }
      }
      System.out.println(r);
      ```
    options:
      - "10"
      - "30"
      - "0"
      - "20"
    answer: 3
    explanation: |
      Iteration i=0: no break, finally adds 10 (r=10). Iteration i=1: `break` exits the
      loop, but `finally` still runs first, adding 10 (r=20), then the break takes
      effect. The loop ends, so r=20. `finally` runs on the break path too.
    ref: "concepts.md#try-catch-finally"

  - id: exception-handling-052
    difficulty: expert
    tags: [class-init, exceptioninitializererror, code-analysis]
    question: |
      A static initializer throws a `RuntimeException` during class initialization.
      What does the JVM throw to the code that triggered initialization?
    options:
      - "The original RuntimeException, unchanged"
      - "ExceptionInInitializerError, with the RuntimeException as its cause"
      - "NoClassDefFoundError immediately"
      - "ClassNotFoundException"
    answer: 1
    explanation: |
      If a static initializer completes abruptly with an unchecked exception, the JVM
      wraps it in `ExceptionInInitializerError` (an `Error`) whose cause is the original
      exception. Subsequent attempts to use the now-failed class throw
      `NoClassDefFoundError`, but the first trigger sees `ExceptionInInitializerError`.
    ref: "concepts.md#checked-versus-unchecked-versus-error"

  - id: exception-handling-053
    difficulty: expert
    tags: [twr, resource-init-fail, code-analysis]
    question: |
      In `try (A a = new A(); B b = new B()) { body(); }`, if `new B()` (the second
      resource's construction) throws, what is closed?
    options:
      - "Only a is closed; b was never successfully constructed so its close() is not called"
      - "Both a and b are closed"
      - "Neither is closed"
      - "Only b is closed"
    answer: 0
    explanation: |
      Resources are initialized left to right. `a` was successfully constructed, so it
      is closed. `new B()` threw before `b` was assigned, so there is no `b` to close.
      try-with-resources only closes resources that were successfully initialized.
    ref: "concepts.md#try-with-resources-and-autocloseable"

  - id: exception-handling-054
    difficulty: expert
    tags: [finally, return, nested, code-analysis]
    question: |
      What does this return?

      ```java
      int m() {
          try {
              try {
                  return 1;
              } finally {
                  return 2;
              }
          } finally {
              return 3;
          }
      }
      ```
    options:
      - "1"
      - "2"
      - "3"
      - "It does not compile"
    answer: 2
    explanation: |
      The inner try's `return 1` is overridden by the inner `finally`'s `return 2`. But
      that entire inner statement is inside the outer try, so the outer `finally`'s
      `return 3` overrides everything. The outermost finally wins: 3.
    ref: "concepts.md#finally-and-return-gotchas"

  - id: exception-handling-055
    difficulty: expert
    tags: [assertionerror, hierarchy]
    question: |
      To which branch of the Throwable hierarchy does `AssertionError` belong, and what
      does that imply for `catch (Exception e)`?
    options:
      - "It extends RuntimeException, so catch(Exception) catches it"
      - "It extends Throwable directly, so nothing but catch(Throwable) catches it"
      - "It is a compiler-checked exception sitting directly under Exception, not Error"
      - "It extends Error, so catch(Exception) does NOT catch it"
    answer: 3
    explanation: |
      `AssertionError` extends `Error`. Since `Error` is a sibling of `Exception`,
      `catch (Exception e)` will not catch it — you would need `catch (Error e)` or
      `catch (Throwable t)`. This is why failed assertions typically propagate past
      ordinary exception handlers.
    ref: "concepts.md#checked-versus-unchecked-versus-error"

  - id: exception-handling-056
    difficulty: expert
    tags: [multi-catch, lub, code-analysis]
    question: |
      Given `catch (IOException | RuntimeException e)`, what methods can you invoke on
      `e` inside the block, and why?
    options:
      - "Any method declared on IOException, because it is listed first"
      - "Only members of the least upper bound of the two types — effectively the members of Exception/Throwable common to both"
      - "Any method on either type; the compiler inserts an implicit instanceof cast automatically"
      - "Only methods inherited from java.lang.Object such as toString(), hashCode(), and equals()"
    answer: 1
    explanation: |
      The static type of a multi-catch variable is the least upper bound of the
      alternatives. `IOException` and `RuntimeException` share `Exception` (and
      `Throwable`) as a common supertype, so you may call members declared there (e.g.
      `getMessage()`, `getCause()`), but not members specific to just one alternative.
    ref: "concepts.md#multi-catch"

  - id: exception-handling-057
    difficulty: expert
    tags: [performance, control-flow, anti-pattern]
    question: |
      Which scenario is the clearest legitimate use of a deliberately stackless
      exception (writableStackTrace=false)?
    options:
      - "A high-throughput internal control-flow signal (e.g., a coroutine/generator boundary or parser backtracking) where the trace is never inspected"
      - "Reporting a genuine, rare disk-full I/O failure to an operator who must read the full trace to diagnose it"
      - "Validating user-supplied arguments in a public API where the caller needs the offending frame to fix the bug"
      - "Wrapping a SQLException before logging it at the service boundary so the root Caused-by chain survives"
    answer: 0
    explanation: |
      A stackless exception makes sense only when the throw is a frequent,
      performance-critical control-flow signal whose stack trace nobody reads. For
      genuine failures reported to humans (I/O errors, argument validation, wrapped
      SQL exceptions) you want the full trace, so the optimization is inappropriate.
    ref: "concepts.md#performance-of-exceptions"

  - id: exception-handling-058
    difficulty: expert
    tags: [suppressed, getcause, distinction]
    question: |
      What is the semantic difference between an exception's CAUSE and a SUPPRESSED
      exception?
    options:
      - "They are identical mechanisms; both are retrieved by getCause() and printed under the same Caused-by heading"
      - "The cause must always be an unchecked RuntimeException, while suppressed exceptions must always be checked ones"
      - "The cause is the underlying reason this exception was thrown (chaining); a suppressed exception is a secondary failure that occurred while handling the primary one and would otherwise be lost"
      - "A suppressed exception always replaces the primary one as it propagates, while the cause is discarded entirely"
    answer: 2
    explanation: |
      The cause (via `getCause()`) expresses a "because of" relationship — this
      exception was thrown because of that one. A suppressed exception (via
      `getSuppressed()`) is a separate failure that happened concurrently with handling
      the primary (typically during resource close) and is recorded so it is not lost.
      They are distinct mechanisms with distinct accessors.
    ref: "concepts.md#suppressed-exceptions"

  - id: exception-handling-059
    difficulty: expert
    tags: [checked, sneaky-throws, generics]
    question: |
      The "sneaky throws" trick lets code throw a checked exception without declaring
      it. Which language mechanism makes this possible?
    options:
      - "Reflection's Method.invoke rewrites the method's throws clause at runtime to bypass the compiler's checking"
      - "The synchronized keyword tells the compiler to suppress throws checking for the duration of the guarded block"
      - "It is impossible; the JVM verifier rejects any undeclared checked exception the moment it propagates"
      - "Unchecked generic casts erase the checked-exception type at compile time, and the JVM never enforces the checked/unchecked distinction at runtime"
    answer: 3
    explanation: |
      Because checked-ness is only a compile-time rule and generics use type erasure, a
      generic helper with an unchecked cast (`<T extends Throwable> void throwUnchecked(Throwable t) throws T`)
      can fool the compiler into not requiring a declaration. At runtime the JVM does
      not distinguish checked from unchecked, so the exception propagates normally.
    ref: "concepts.md#checked-versus-unchecked-versus-error"

  - id: exception-handling-060
    difficulty: expert
    tags: [twr, desugaring, code-analysis]
    question: |
      Conceptually, the Java 7 compiler desugars `try (R r = acquire()) { body(); }`
      into roughly which structure?
    options:
      - "A plain try/finally that calls r.close() unconditionally in the finally, with no primary variable or suppression tracking at all"
      - "Code that captures any body exception in a primary variable, calls r.close() in a way that adds a close-exception as suppressed to the primary (or rethrows it if the body succeeded)"
      - "A synchronized block that locks on r around body() and then calls r.close() once the monitor is released"
      - "A retry loop that re-invokes body() up to three times whenever the trailing r.close() call fails"
    answer: 1
    explanation: |
      The compiler generates code that tracks a primary throwable from the body; in the
      generated finally-like logic it calls `close()`, and if the body already threw it
      calls `primary.addSuppressed(closeEx)`, otherwise it lets the close exception
      propagate. This is exactly what produces the suppressed-exception behavior and
      avoids the old masking bug.
    ref: "concepts.md#suppressed-exceptions"
