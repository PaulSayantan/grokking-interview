topic: "synchronized, volatile and the Java Memory Model"
domain: java-jvm
topic_slug: synchronized-volatile-jmm
schema: 1
pass: clarity-v1

prompts:
  - id: synchronized-volatile-jmm-p001
    ref: "concepts.md#the-java-memory-model-and-happens-before"
    kind: refute
    tier: A
    prompt: |
      A reviewer writes: "X happens-before Y, so X's store reaches memory before Y's load runs —
      the hardware guarantees the order." State what is actually guaranteed instead.
    hint: "The model constrains one thing only. Which one?"
    answer_in: "concepts.md#where-it-breaks-an-edge-is-not-a-moment-in-time"

  - id: synchronized-volatile-jmm-p002
    ref: "concepts.md#visibility-reordering-and-atomicity"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you meet a spin-wait loop in a codebase, find what stops the JIT from reading the
      flag once and testing a register forever. Check whether anything does.
    hint: "Look at the field's declaration, not at the loop body."
    answer_in: "concepts.md#visibility-reordering-and-atomicity"

  - id: synchronized-volatile-jmm-p003
    ref: "concepts.md#volatile"
    kind: name-the-price
    tier: A
    prompt: |
      A volatile field buys you an edge for the price of one keyword. Name what that edge costs at
      the instruction level, and the access pattern where that cost dominates.
    hint: "The two directions do not cost the same."
    answer_in: "concepts.md#what-it-costs-the-four-barriers-and-the-one-that-stalls"

  - id: synchronized-volatile-jmm-p004
    ref: "concepts.md#what-it-costs-the-four-barriers-and-the-one-that-stalls"
    kind: draw-the-boundary
    tier: A
    prompt: |
      All four barriers order accesses across two different variables. Find the access mode later in
      this file that orders a variable against itself and against nothing else.
    hint: "It is the one that would fix the shutdown flag but not the piggyback pattern."
    answer_in: "concepts.md#the-version-specific-truth-access-modes-and-fences-since-java-9"

  - id: synchronized-volatile-jmm-p005
    ref: "concepts.md#what-the-jvm-does-underneath-the-mark-word-and-inflation"
    kind: predict-failure
    tier: A
    prompt: |
      At startup, a cache calls `wait()` once on each of a million small objects, with no contention
      anywhere in the process. Predict what happens to heap footprint.
    hint: "Count the two events that force inflation, then count the allocations."
    answer_in: "concepts.md#what-the-jvm-does-underneath-the-mark-word-and-inflation"

  - id: synchronized-volatile-jmm-p006
    ref: "concepts.md#what-the-jit-is-allowed-to-do-roach-motel-coarsening-elision"
    kind: refute
    tier: A
    prompt: |
      A colleague moves a slow `flush()` from inside a `synchronized` block to just after it, saying
      "the JIT does this anyway." Say why the two edits are not the same edit.
    hint: "Which direction is the JIT allowed to move code, and which are you?"
    answer_in: "concepts.md#what-the-jit-is-allowed-to-do-roach-motel-coarsening-elision"

  - id: synchronized-volatile-jmm-p007
    ref: "concepts.md#where-it-breaks-two-locks-opposite-orders"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a service stops serving with no CPU load and no timeout firing, take a thread dump
      and count how many BLOCKED threads are waiting on a monitor another BLOCKED thread owns.
    answer_in: "concepts.md#where-it-breaks-two-locks-opposite-orders"

  - id: synchronized-volatile-jmm-p008
    ref: "concepts.md#atomic-classes-and-cas"
    kind: name-the-price
    tier: A
    prompt: |
      `LongAdder` gives you a counter whose write path scales with cores. Name what it costs, and
      the caller whose requirement makes that cost unacceptable.
    hint: "Read the two halves of the class separately: increment, then sum."
    answer_in: "concepts.md#atomic-classes-and-cas"

  - id: synchronized-volatile-jmm-p009
    ref: "concepts.md#where-it-breaks-the-value-came-back"
    kind: draw-the-boundary
    tier: A
    prompt: |
      The trace says node B is "recycled/free", and Java has a garbage collector that would keep B
      alive. Explain why the corruption survives that objection.
    hint: "Which value does Thread 1 write, and when did it read that value?"
    answer_in: "concepts.md#where-it-breaks-the-value-came-back"

  - id: synchronized-volatile-jmm-p010
    ref: "concepts.md#the-version-specific-truth-access-modes-and-fences-since-java-9"
    kind: draw-the-boundary
    tier: C
    prompt: |
      This section gave you opaque's promise and its limit. Work out where release-only and
      acquire-only sit between opaque and volatile, and what each one still permits.
    success_criterion: |
      You can say, for each of plain, opaque, release, acquire and volatile, which reorderings the
      mode forbids and which it still allows, and you can name at least one JDK class that
      deliberately uses a mode weaker than volatile and say why that class can afford it.
    search_hint: |
      Doug Lea, "Using JDK 9 Memory Order Modes" — the primary write-up. It predates the final
      Java 9 API in places, so check every method name against the current `VarHandle` javadoc.
    answer_in: external

  - id: synchronized-volatile-jmm-p011
    ref: "concepts.md#double-checked-locking"
    kind: refute
    tier: A
    prompt: |
      A reviewer deletes `volatile` from a double-checked-locking field, arguing the `synchronized`
      block already orders everything inside it. Name the thread their argument never reaches.
    hint: "Trace the thread that returns without entering the block."
    answer_in: "concepts.md#double-checked-locking"

  - id: synchronized-volatile-jmm-p012
    ref: "concepts.md#final-field-semantics"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you write a constructor that registers `this` somewhere — a listener, a cache, a
      static map — check how many of that class's fields are `final`.
    answer_in: "concepts.md#where-it-breaks-the-constructor-that-leaked-itself"

  - id: synchronized-volatile-jmm-p013
    ref: "concepts.md#false-sharing"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a parallel loop scales badly with no lock anywhere in the profile, print the field
      offsets of the per-thread counters and check whether two land inside one 64-byte span.
    answer_in: "concepts.md#false-sharing"

  - id: synchronized-volatile-jmm-p014
    ref: "concepts.md#the-version-specific-truth-contended-is-not-application-api"
    kind: name-the-price
    tier: D
    prompt: |
      You cannot use `@Contended`, and your hot per-thread counters still false-share. Decide
      whether to pad by hand, and say what evidence would make you stop.
    answer_shape: |
      A credible answer prices three things: the memory cost of one padded instance multiplied by
      how many instances exist, the coherence traffic you measured being removed rather than
      predicted, and the risk that a JVM layout change or a dead-field elimination quietly reverts
      the fix while the memory cost stays.

cliffhanger:
  pattern: A
  hook: |
    You have the rule now. A monitor buys mutual exclusion and a happens-before edge, and for most
    code that is enough. The deadlock above named the boundary. `synchronized` has exactly one
    acquisition mode, and no way to give up. The fix named there was `tryLock(50, MILLISECONDS)`,
    and nothing here showed how that is even possible. It should look impossible. `synchronized`
    compiles to a single `monitorenter` bytecode, which takes no timeout argument and returns
    nothing at all. So a plain Java class somehow offers a timed, interruptible, fair acquisition
    that the bytecode cannot express. Something is doing the queueing and the parking in Java code
    rather than in the VM. That something has a price you can measure.
  teaser_questions:
    - "If the monitor's entry list is not involved, where does the queue of waiting threads live?"
    - "What does a timed acquisition cost that `monitorenter` does not?"
    - "Which of a monitor's two guarantees does a read-write lock give up so readers can run together?"
  payoff:
    anchor: "concepts.md#locks-reentrantlock-readwritelock-and-stampedlock"
    claim: "tryLock"
