topic: "synchronized, volatile and the Java Memory Model"
domain: java-jvm
topic_slug: synchronized-volatile-jmm
version: 1
questions:
  - id: synchronized-volatile-jmm-001
    difficulty: beginner
    tags: [jmm, happens-before, visibility]
    question: |
      In the Java Memory Model, what does it mean when action X "happens-before" action Y?
    options:
      - "X must execute at an earlier wall-clock time than Y on the same CPU core, as timed by the system clock."
      - "The memory effects of X (including its writes) are guaranteed to be visible to Y, and X is ordered before Y."
      - "X and Y are guaranteed to run on the same thread, with no context switch occurring between them."
      - "The JVM will always execute X and Y without any reordering anywhere in the program."
    answer: 1
    explanation: |
      Happens-before is an ordering relation defined by the JMM guaranteeing visibility and
      ordering of memory effects: if X hb Y, the writes of X are visible to Y. It is NOT about
      wall-clock time (option 0), does not imply same-thread execution (2), and does not forbid
      all reordering globally (3) — only reorderings that would violate happens-before edges.
    ref: "concepts.md#the-java-memory-model-and-happens-before"
  - id: synchronized-volatile-jmm-002
    difficulty: beginner
    tags: [volatile, atomicity]
    question: |
      Does declaring `volatile int count;` make the statement `count++` thread-safe?
    options:
      - "Yes, volatile makes every operation on the field atomic, including compound read-modify-write updates."
      - "Yes, but only on 64-bit JVMs where the field fits in one machine word."
      - "No, because count++ is a read-modify-write sequence and volatile does not provide compound atomicity."
      - "No, because volatile fields cannot be incremented at all — it is a compile error."
    answer: 2
    explanation: |
      volatile guarantees visibility and ordering plus atomicity of a *single* read or write,
      but count++ is three operations (load, add, store). Two threads can interleave and lose
      updates. Use AtomicInteger or a lock. It compiles fine (option 3 wrong) and 64-bitness
      (option 1) is irrelevant to compound atomicity.
    ref: "concepts.md#volatile"
  - id: synchronized-volatile-jmm-003
    difficulty: beginner
    tags: [synchronized, mutual-exclusion, visibility]
    question: |
      Which two guarantees does a `synchronized` block provide?
    options:
      - "Mutual exclusion only, with no guarantee that writes become visible to other threads."
      - "Visibility only, allowing two threads to execute the same block at the same time."
      - "Mutual exclusion and visibility (memory consistency)."
      - "Atomicity of 64-bit long and double reads only, but no mutual exclusion."
    answer: 2
    explanation: |
      synchronized provides mutual exclusion (one thread per monitor) AND visibility: the
      unlock happens-before a subsequent lock on the same monitor, so writes made under the
      lock are visible to the next holder. It gives both, not just one.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-004
    difficulty: beginner
    tags: [volatile, visibility, loop]
    question: |
      A thread spins in `while (!stop) { }` where `stop` is a plain (non-volatile) boolean,
      and another thread sets `stop = true`. What is the correct explanation of the risk?
    options:
      - "The write throws a MemoryConsistencyException at runtime when the two threads observe different values."
      - "The code will always terminate because Java flushes caches on every loop iteration."
      - "The spinning thread may never observe stop==true because the JIT can legally hoist the read out of the loop; making stop volatile fixes it."
      - "It only fails on single-core machines; multi-core CPUs snoop each other's caches and so guarantee visibility automatically."
    answer: 2
    explanation: |
      With no happens-before edge, nothing forces the reader to re-read stop, so the JIT can
      hoist it, producing an infinite loop. volatile establishes the needed edge. Java does not
      flush caches every iteration, there is no such exception, and cache snooping is beside the
      point: the read was deleted, not stale, so the hoist would happen on a machine with no
      caches at all.
    ref: "concepts.md#visibility-reordering-and-atomicity"
  - id: synchronized-volatile-jmm-005
    difficulty: beginner
    tags: [atomic, cas]
    question: |
      Which class from `java.util.concurrent.atomic` is the idiomatic choice for a counter that
      must be incremented atomically by many threads without using locks?
    options:
      - "SynchronizedInteger"
      - "volatile int wrapped in a helper"
      - "Integer"
      - "AtomicInteger"
    answer: 3
    explanation: |
      AtomicInteger provides lock-free atomic read-modify-write via incrementAndGet() built on
      CAS. A volatile int does not make ++ atomic; Integer is immutable and not thread-safe for
      counting; SynchronizedInteger does not exist.
    ref: "concepts.md#atomic-classes-and-cas"
  - id: synchronized-volatile-jmm-006
    difficulty: beginner
    tags: [synchronized, monitor, static]
    question: |
      What monitor does a `static synchronized` method lock on?
    options:
      - "The Class object for the class declaring the method."
      - "The 'this' instance the method is invoked on, just like an instance method."
      - "A fresh anonymous object the JVM allocates and locks on for each individual call."
      - "The thread's own monitor, so each calling thread locks a different object."
    answer: 0
    explanation: |
      A static synchronized method locks the Class object (e.g., MyClass.class). An instance
      synchronized method locks 'this'. Because these are different monitors, a static and an
      instance synchronized method do not mutually exclude each other.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-007
    difficulty: beginner
    tags: [final, immutability]
    question: |
      Which statement about a `final` instance field is correct?
    options:
      - "It can be reassigned as long as it happens inside a synchronized block."
      - "It must be assigned exactly once, by the time the constructor completes."
      - "It is automatically volatile, so writes to it are always visible across threads."
      - "It can only hold primitive values, not object references or arrays."
    answer: 1
    explanation: |
      A final field must be definitely assigned exactly once during construction (field
      initializer, instance initializer, or constructor). It cannot be reassigned later even
      under a lock. final is not the same as volatile, and it can hold references.
    ref: "concepts.md#final-field-semantics"
  - id: synchronized-volatile-jmm-008
    difficulty: beginner
    tags: [false-sharing, cache-line]
    question: |
      What is "false sharing"?
    options:
      - "Two threads unintentionally sharing the same monitor object, so they serialize on an unrelated lock."
      - "Two independent variables residing on the same CPU cache line, so writing one invalidates the other core's cached copy, hurting performance."
      - "A thread reading a stale value from a shared volatile field because a fence was skipped."
      - "Sharing an object reference across threads without synchronization, leading to a visibility bug."
    answer: 1
    explanation: |
      False sharing is a performance (not correctness) problem: logically independent variables
      land on the same cache line (~64 bytes), so a write by one core invalidates the line in
      another core's cache, causing coherence ping-pong. The other options describe different
      concurrency issues.
    ref: "concepts.md#false-sharing"
  - id: synchronized-volatile-jmm-009
    difficulty: beginner
    tags: [jmm, version]
    question: |
      Which Java release finalized the modern Java Memory Model (via JSR-133), fixing the
      previously broken semantics of `volatile` and `final`?
    options:
      - "Java 1.4"
      - "Java 5"
      - "Java 8"
      - "Java 11"
    answer: 1
    explanation: |
      JSR-133 redefined the JMM and shipped in Java 5 (2004). Before Java 5, volatile did not
      guarantee the release/acquire ordering that fixes double-checked locking, and final field
      guarantees were weaker.
    ref: "concepts.md#the-java-memory-model-and-happens-before"
  - id: synchronized-volatile-jmm-010
    difficulty: beginner
    tags: [volatile, array]
    question: |
      Given `volatile int[] arr;`, which access has volatile (happens-before) semantics?
    options:
      - "Reads and writes of individual elements like arr[0]."
      - "Neither; the volatile modifier is silently ignored by the compiler when applied to array types."
      - "Both the array reference and every element access, since volatile propagates into the array."
      - "Reads and writes of the array reference arr itself."
    answer: 3
    explanation: |
      volatile applies to the field holding the array *reference*, not to the elements. arr[i]
      accesses are plain. For per-element volatile semantics use AtomicIntegerArray or a
      VarHandle over the array.
    ref: "concepts.md#volatile"
  - id: synchronized-volatile-jmm-011
    difficulty: intermediate
    tags: [volatile, release-acquire, visibility]
    question: |
      Consider:
      ```java
      int data;                 // plain
      volatile boolean ready;   // guard
      // Writer thread
      data = 42;
      ready = true;
      // Reader thread
      if (ready) { System.out.println(data); }
      ```
      If the reader observes `ready == true`, what can it print for `data`?
    options:
      - "Only 0, because data is a plain field and volatile never publishes non-volatile writes alongside it."
      - "It throws an unsynchronized-access error because data is read outside any synchronized block."
      - "Either 0 or 42, nondeterministically, since the two writes can be reordered by the compiler."
      - "Only 42, because the volatile write of ready releases the prior write of data, which the acquiring read makes visible."
    answer: 3
    explanation: |
      This is the piggyback idiom. data=42 happens-before ready=true (program order); the
      volatile write happens-before the reader's volatile read that sees true; that read
      happens-before the println. By transitivity data=42 is visible, so it prints 42. This is
      precisely the JSR-133 release/acquire guarantee.
    ref: "concepts.md#volatile"
  - id: synchronized-volatile-jmm-012
    difficulty: intermediate
    tags: [synchronized, reentrancy]
    question: |
      What does it mean that Java intrinsic locks are "reentrant"?
    options:
      - "Multiple threads can enter the same synchronized block simultaneously as long as they share the monitor."
      - "The lock is automatically released after a fixed timeout if the holder does not exit the block in time."
      - "A thread that already holds a monitor can acquire it again without deadlocking; a hold count is tracked."
      - "The lock can be acquired from any thread even while another thread currently holds it."
    answer: 2
    explanation: |
      Reentrancy means the *same* thread can re-acquire a monitor it already holds (e.g., one
      synchronized method calling another on the same object), incrementing a hold count;
      release happens when the count reaches zero. It does not let multiple threads in, nor
      other threads bypass the lock.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-013
    difficulty: intermediate
    tags: [dcl, volatile, singleton]
    question: |
      In the double-checked locking singleton, why must the `instance` field be declared
      `volatile`?
    options:
      - "To make the synchronized block unnecessary, since volatile alone fully guards the initialization."
      - "To prevent a reader on the fast path from seeing a non-null reference to a partially constructed object due to reordering of the construction and publication."
      - "Because non-volatile references cannot legally be assigned inside a synchronized block at all."
      - "Only for performance; correctness of the singleton does not depend on the modifier at all."
    answer: 1
    explanation: |
      instance = new Singleton() may be reordered so the reference is published before the
      constructor finishes. Without volatile, another thread's first (unlocked) check could see
      a non-null but half-initialized object. volatile's release/acquire ordering (since Java 5)
      prevents this, making DCL correct.
    ref: "concepts.md#double-checked-locking"
  - id: synchronized-volatile-jmm-014
    difficulty: intermediate
    tags: [cas, atomic]
    question: |
      What does the compare-and-swap (CAS) operation underlying atomic classes do?
    options:
      - "Atomically updates the variable to a new value only if it currently equals an expected value, reporting success or failure."
      - "Blocks the thread until the variable equals the expected value, then updates it."
      - "Swaps the values held by two separate memory locations atomically in a single step."
      - "Locks the variable, updates it, then unlocks — a mutex under the hood."
    answer: 0
    explanation: |
      CAS atomically checks that a location still holds an expected value and, if so, writes the
      new value, returning whether it succeeded. It is non-blocking/optimistic — callers retry
      on failure rather than block. It is not a mutex and does not swap two variables.
    ref: "concepts.md#atomic-classes-and-cas"
  - id: synchronized-volatile-jmm-015
    difficulty: intermediate
    tags: [synchronized, lock-object, bug]
    question: |
      Which lock object is the safest choice for a `synchronized` block guarding shared state?
    options:
      - "A boxed Integer or Boolean field, since autoboxing gives each object a distinct monitor."
      - "An interned String literal, because the constant pool keeps exactly one shared instance."
      - "A private final Object created once and never reassigned."
      - "The 'this' reference, always, so the whole object's monitor guards the state."
    answer: 2
    explanation: |
      A private final Object lock = new Object() is unshared and cannot be reassigned or
      accidentally locked elsewhere. Boxed Integer/Boolean and interned Strings are cached/shared
      globally (external code may lock the same instance), and locking on 'this' exposes your
      lock publicly. A dedicated private lock is the robust idiom.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-016
    difficulty: intermediate
    tags: [long, atomicity, jls]
    question: |
      According to the JLS, when is a write or read of a non-volatile `long` or `double`
      permitted to be non-atomic (split into two 32-bit halves)?
    options:
      - "Never; the JLS mandates that all primitive reads and writes are atomic on every JVM."
      - "Only when running under a SecurityManager that has disabled 64-bit atomic access."
      - "Only for arrays of long or double, never for a plain long or double field."
      - "The JVM is permitted to treat non-volatile long/double reads and writes as two separate 32-bit operations; declaring the field volatile guarantees 64-bit atomicity."
    answer: 3
    explanation: |
      JLS 17.7 allows non-volatile 64-bit long/double accesses to be split, so a reader can see
      a torn value. Declaring the field volatile guarantees atomic 64-bit access. References and
      all other primitives are always accessed atomically.
    ref: "concepts.md#visibility-reordering-and-atomicity"
  - id: synchronized-volatile-jmm-017
    difficulty: intermediate
    tags: [wait-notify, synchronized]
    question: |
      What happens if you call `obj.wait()` without holding `obj`'s monitor?
    options:
      - "It blocks the thread indefinitely until some other thread happens to call notify()."
      - "It transparently acquires the object's monitor for you first and then begins waiting."
      - "It returns immediately with no effect, silently ignoring the missing monitor ownership."
      - "It throws IllegalMonitorStateException."
    answer: 3
    explanation: |
      wait(), notify(), and notifyAll() must be called by a thread that owns the object's
      monitor; otherwise they throw IllegalMonitorStateException. wait() then atomically
      releases the monitor while waiting.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-018
    difficulty: intermediate
    tags: [wait-notify, spurious-wakeup]
    question: |
      Why should `wait()` be called inside a `while` loop that re-checks the condition rather
      than a single `if`?
    options:
      - "To improve performance by polling the condition faster than a single if would allow."
      - "Because the compiler forbids an if statement syntactically around a wait() call."
      - "Because of spurious wakeups and because the condition may become false again before the woken thread re-acquires the monitor; the loop re-checks it."
      - "Because wait() may be legally invoked only once per thread when guarded by an if."
    answer: 2
    explanation: |
      A thread can wake spuriously, and even a legitimate notify does not guarantee the
      condition still holds by the time the thread reacquires the lock (another thread may have
      changed it). Re-checking in a while loop guards against both. This is the standard
      condition-wait idiom.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-019
    difficulty: intermediate
    tags: [trade-offs, decision]
    question: |
      You have a single `boolean shutdownRequested` flag set by one thread and polled by
      others, with no compound update. What is the most appropriate mechanism?
    options:
      - "synchronized on a shared lock for every read and write."
      - "A ReentrantReadWriteLock."
      - "An AtomicReference<Boolean>."
      - "A volatile boolean."
    answer: 3
    explanation: |
      A single flag with independent reads and a single write needs only visibility and
      ordering — exactly what volatile provides, at minimal cost. synchronized or locks add
      unnecessary blocking, and an atomic is overkill when there is no read-modify-write.
    ref: "concepts.md#volatile-vs-atomic-vs-synchronized-trade-offs"
  - id: synchronized-volatile-jmm-020
    difficulty: intermediate
    tags: [ioh, singleton, class-init]
    question: |
      The initialization-on-demand holder idiom achieves lazy, thread-safe singleton
      initialization without volatile or explicit synchronization. What guarantees its
      correctness?
    options:
      - "The JVM guarantee that class initialization is thread-safe and occurs exactly once, deferred until the holder class is first referenced."
      - "The synchronized keyword on getInstance(), which serializes every caller so only one thread can ever run the initializer."
      - "The volatile modifier on the INSTANCE field, whose release/acquire ordering publishes the finished object to later readers."
      - "A CAS loop inside the static initializer that installs the instance only if no other thread has already set it."
    answer: 0
    explanation: |
      The JVM guarantees (JLS 12.4) that a class is initialized lazily on first active use and
      that initialization is thread-safe (exactly once). The nested Holder class is not
      initialized until getInstance() references INSTANCE, giving lazy + safe init with no
      volatile or explicit lock.
    ref: "concepts.md#double-checked-locking"
  - id: synchronized-volatile-jmm-021
    difficulty: intermediate
    tags: [final, publication, immutability]
    question: |
      An immutable class with only `final` fields and no escaping `this` is published to another
      thread via a plain (non-volatile, unsynchronized) field — a data race. What does the JMM
      guarantee the reader sees for the final fields?
    options:
      - "Possibly default (zero/null) values, because the publication was racy."
      - "The correctly initialized values of the final fields, thanks to the final-field guarantee."
      - "A NullPointerException thrown when the racily published fields are first dereferenced."
      - "The correct values only if the reader acquires a lock before reading the reference."
    answer: 1
    explanation: |
      JLS 17.5's final-field guarantee ensures that, for a properly constructed object (no this
      escape), any thread that obtains a reference — even through a data race — sees the correct
      final-field values without synchronization. This is what makes immutable objects safe to
      publish.
    ref: "concepts.md#final-field-semantics"
  - id: synchronized-volatile-jmm-022
    difficulty: intermediate
    tags: [contended, false-sharing, version]
    question: |
      Which Java version introduced the `@Contended` annotation (JEP 142) to pad fields onto
      their own cache line to avoid false sharing?
    options:
      - "Java 7"
      - "Java 17"
      - "Java 11"
      - "Java 8"
    answer: 3
    explanation: |
      JEP 142 delivered @Contended in Java 8 (originally sun.misc.Contended, later
      jdk.internal.vm.annotation.Contended). It is a JDK-internal facility behind two gates:
      application code needs --add-exports java.base/jdk.internal.vm.annotation=ALL-UNNAMED to
      name the annotation at all AND -XX:-RestrictContended for the layouter to honour it.
      The two gates fail differently: miss the export and it will not compile, so you find out
      immediately; pass only the export and the annotation compiles and silently does nothing.
    ref: "concepts.md#false-sharing"
  - id: synchronized-volatile-jmm-023
    difficulty: intermediate
    tags: [synchronized, reentrantlock, comparison]
    question: |
      Which capability does `ReentrantLock` offer that intrinsic `synchronized` does NOT?
    options:
      - "Timed, interruptible, and non-blocking (tryLock) acquisition, plus optional fairness and multiple Conditions."
      - "Reentrancy, letting the same thread re-acquire a lock it already holds without deadlocking itself."
      - "Mutual exclusion, ensuring at most one thread at a time runs inside the guarded critical section."
      - "Visibility guarantees on release, so writes made under the lock are seen by the next acquirer."
    answer: 0
    explanation: |
      Both are reentrant and provide mutual exclusion and visibility. ReentrantLock adds
      tryLock(), timed/interruptible lock acquisition, a fairness policy, and multiple Condition
      objects — features intrinsic locks lack. The cost is the mandatory try/finally unlock().
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-024
    difficulty: intermediate
    tags: [atomic, longadder, contention]
    question: |
      Under very high write contention on a shared counter that is read infrequently, which is
      typically the best-scaling choice?
    options:
      - "AtomicLong, because its single CAS instruction never contends under load."
      - "volatile long, since skipping the CAS entirely makes each increment cheapest."
      - "LongAdder, because it stripes the count across multiple cells to reduce contention."
      - "A synchronized method guarding a plain long, which serializes all writers cheaply."
    answer: 2
    explanation: |
      LongAdder (Java 8) spreads increments across multiple internal cells (padded to avoid
      false sharing), so threads rarely contend; sum() aggregates them. Under heavy contention a
      single AtomicLong's CAS loop becomes a bottleneck. volatile long can't do atomic ++ at all.
    ref: "concepts.md#atomic-classes-and-cas"
  - id: synchronized-volatile-jmm-025
    difficulty: intermediate
    tags: [jmm, data-race, drf-sc]
    question: |
      What does the JMM's DRF-SC guarantee state?
    options:
      - "Correctly synchronized (data-race-free) programs behave as if sequentially consistent."
      - "All Java programs, even those with data races, execute as if sequentially consistent."
      - "Data races always surface as a runtime exception thrown at the conflicting access."
      - "Volatile fields alone make an entire program behave sequentially consistently."
    answer: 0
    explanation: |
      The JMM guarantees that data-race-free programs (all conflicting accesses ordered by
      happens-before) appear sequentially consistent. Programs with data races have weaker,
      partly-unspecified semantics — but the JMM still forbids out-of-thin-air values to
      preserve safety. Not all programs are SC, and races do not throw.
    ref: "concepts.md#the-java-memory-model-and-happens-before"
  - id: synchronized-volatile-jmm-026
    difficulty: intermediate
    tags: [synchronized, visibility, non-volatile]
    question: |
      If a field is written only inside `synchronized` blocks on the same lock and read only
      inside `synchronized` blocks on that same lock, must the field also be `volatile` for
      correct visibility?
    options:
      - "Yes; cross-thread visibility always demands volatile in addition to holding the monitor lock."
      - "No, but only when the guard is a ReentrantLock; intrinsic synchronized still needs volatile too."
      - "Yes, unless the field is a 64-bit long or double, whose halves the monitor cannot publish atomically."
      - "No; the monitor's unlock-happens-before-lock edge already provides visibility for writes made under the lock."
    answer: 3
    explanation: |
      The monitor happens-before edge (unlock hb subsequent lock on the same monitor) makes all
      writes under the lock visible to the next holder, including non-volatile fields. Adding
      volatile is redundant here. This holds for synchronized and Lock alike.
    ref: "concepts.md#volatile-vs-atomic-vs-synchronized-trade-offs"
  - id: synchronized-volatile-jmm-027
    difficulty: intermediate
    tags: [volatile, ordering, reordering]
    question: |
      Which reordering is FORBIDDEN by volatile semantics (JSR-133)?
    options:
      - "Moving a plain store that precedes a volatile write to after the volatile write."
      - "Moving a plain load that follows a volatile read to before the volatile read."
      - "Both of the above."
      - "Neither; volatile only affects the volatile field itself, not surrounding operations."
    answer: 2
    explanation: |
      A volatile write is a release: prior stores cannot move after it (StoreStore/LoadStore). A
      volatile read is an acquire: subsequent loads cannot move before it (LoadLoad/LoadStore).
      Both reorderings are forbidden, which is exactly what enables the piggyback idiom. Option 3
      reflects the pre-Java-5 (broken) understanding.
    ref: "concepts.md#volatile"
  - id: synchronized-volatile-jmm-028
    difficulty: intermediate
    tags: [enum, singleton]
    question: |
      Why is an `enum` with a single constant often recommended as a singleton implementation?
    options:
      - "It is the fastest possible singleton at runtime because the JIT inlines the constant as a compile-time literal."
      - "It is inherently thread-safe on initialization and provides serialization safety against creating duplicate instances."
      - "It supports lazy initialization better than any other approach, deferring the instance until the first method call."
      - "It allows the singleton to extend another class while still implementing any number of interfaces cleanly."
    answer: 1
    explanation: |
      Enum constants are initialized once by the JVM's thread-safe class-init mechanism, and the
      enum machinery guarantees serialization does not create a second instance (a common flaw of
      hand-rolled singletons). It is eager, not lazy, and enums can't extend a class — but for
      correctness and simplicity it is often the best choice.
    ref: "concepts.md#double-checked-locking"
  - id: synchronized-volatile-jmm-029
    difficulty: advanced
    tags: [code-analysis, volatile, atomicity]
    question: |
      ```java
      class C {
          volatile long v = 0;
          void inc() { v++; }       // called by 100 threads, 1000 times each
      }
      ```
      After all threads finish, what is the most accurate statement about the final value of v?
    options:
      - "Exactly 100000, because volatile makes the entire v++ read-modify-write atomic across all threads."
      - "At most 100000 but often less, because v++ is a non-atomic read-modify-write and updates are lost under contention."
      - "Undefined, possibly a torn 64-bit value, since even a volatile long read can be split into two halves."
      - "Exactly 100000, but only on strongly-ordered x86 CPUs where the increments cannot interleave."
    answer: 1
    explanation: |
      volatile guarantees visibility and atomic 64-bit access of a single read or write, but v++
      is load-add-store; concurrent increments interleave and lose updates, so the total is <=
      100000 and typically less. It won't be torn (volatile guarantees 64-bit atomicity of each
      access), so option 2 is wrong.
    ref: "concepts.md#volatile"
  - id: synchronized-volatile-jmm-030
    difficulty: advanced
    tags: [code-analysis, dcl, reordering]
    question: |
      ```java
      class Lazy {
          private Config instance;                 // NOT volatile
          Config get() {
              if (instance == null) {
                  synchronized (this) {
                      if (instance == null) instance = new Config();
                  }
              }
              return instance;
          }
      }
      ```
      What is the defect?
    options:
      - "None; the two null-checks around the synchronized block make this lazy initialization fully correct with no further ordering constraints."
      - "It will deadlock, because the outer check and the inner block both lock 'this', re-entering the same monitor recursively."
      - "The synchronized block is entirely unnecessary and can be removed, since the outer null-check alone guarantees single initialization."
      - "Because instance is not volatile, a thread on the fast path may see a non-null reference to a partially constructed Config due to publication/construction reordering."
    answer: 3
    explanation: |
      This is classic broken DCL. Without volatile, the write publishing the reference can be
      reordered ahead of the constructor's completion, so the unlocked first check can observe a
      non-null but not-yet-initialized object. The fix is to declare instance volatile. It does
      not deadlock (reentrancy is fine), and the sync block is essential.
    ref: "concepts.md#double-checked-locking"
  - id: synchronized-volatile-jmm-031
    difficulty: advanced
    tags: [aba, cas, atomic]
    question: |
      Which problem does `AtomicStampedReference` specifically address that a plain
      `AtomicReference.compareAndSet` cannot?
    options:
      - "The cross-thread visibility of the mutable fields inside the referenced object itself."
      - "The ABA problem: a value changing from A to B and back to A, which a plain CAS cannot detect."
      - "False sharing between the reference and other fields sharing the same 64-byte cache line."
      - "The non-atomicity of 64-bit reference writes, which can tear into halves on 32-bit JVMs."
    answer: 1
    explanation: |
      A plain CAS only checks the current value equals expected; if it went A->B->A it still
      succeeds, hiding intervening changes (ABA). AtomicStampedReference pairs the reference with
      an integer stamp so CAS also verifies the version, detecting ABA. References are always
      written atomically, so option 3 is irrelevant.
    ref: "concepts.md#atomic-classes-and-cas"
  - id: synchronized-volatile-jmm-032
    difficulty: advanced
    tags: [biased-locking, version, hotspot]
    question: |
      What is the status of biased locking in HotSpot as of JDK 15 (JEP 374)?
    options:
      - "Enabled by default and still recommended for all workloads with uncontended locks."
      - "Removed entirely in JDK 15 and replaced outright by a new lightweight thin-lock scheme."
      - "Disabled by default and deprecated for removal, because it no longer paid off on modern hardware."
      - "Newly introduced in JDK 15 to accelerate uncontended locks on many-core server hardware."
    answer: 2
    explanation: |
      JEP 374 disabled biased locking by default and deprecated it in JDK 15 (it could still be
      re-enabled via a flag then). It was not fully removed in 15, was not newly added, and is
      not recommended-on. Modern atomic-instruction costs made its bookkeeping a net loss.
      The removal came later: JDK-8256425 deleted the implementation in JDK 18, where
      -XX:+UseBiasedLocking became obsolete (accepted, ignored, warned about); JDK 19 expired
      the flag and rejects it outright.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-033
    difficulty: advanced
    tags: [final, this-escape, publication]
    question: |
      The final-field visibility guarantee can be defeated. Which situation breaks it?
    options:
      - "Letting the 'this' reference escape during construction (e.g., registering this in a shared collection or starting a thread using this before the constructor returns)."
      - "Assigning the final field inside the constructor body rather than at its declaration, which delays the freeze past publication."
      - "Declaring more than one final field in the class, since the freeze action can cover only a single field per constructor."
      - "Reading the field from the same thread that constructed the object, because the freeze applies only to other reader threads."
    answer: 0
    explanation: |
      The guarantee holds only for *properly constructed* objects where 'this' does not escape
      before construction completes. If this is published early, another thread can observe the
      object before the final-field freeze, seeing default values. Where you assign the field or
      how many finals exist is irrelevant.
    ref: "concepts.md#final-field-semantics"
  - id: synchronized-volatile-jmm-034
    difficulty: advanced
    tags: [volatile, barriers, hotspot]
    question: |
      Which memory barrier makes a volatile *write* more expensive than a volatile *read* on
      typical hardware, by ordering the write against a subsequent load of a different variable?
    options:
      - "LoadLoad (drains the store buffer after the write)"
      - "LoadStore (the full fence emitted after a volatile store)"
      - "StoreLoad (a full fence, e.g. lock addl / mfence on x86)"
      - "StoreStore (the mfence added after a volatile write)"
    answer: 2
    explanation: |
      HotSpot emits a StoreLoad barrier after a volatile write — the most expensive fence,
      because it must drain the store buffer so a following volatile load of a different variable
      is correctly ordered. StoreStore/LoadStore/LoadLoad are cheaper and are used around reads
      and before writes.
    ref: "concepts.md#volatile"
  - id: synchronized-volatile-jmm-035
    difficulty: advanced
    tags: [code-analysis, synchronized, monitor]
    question: |
      ```java
      class Counter {
          private int count;
          public synchronized void inc() { count++; }
          public int get() { return count; }   // NOT synchronized
      }
      ```
      What is the concurrency flaw?
    options:
      - "inc() is not thread-safe because count is not declared volatile, so its increments can be silently lost even while holding the monitor."
      - "get() has no happens-before relationship with inc(), so a reader may observe a stale count value; get() should also synchronize (or count be made visible via the same lock)."
      - "There is no flaw; the synchronized modifier on inc() automatically extends its monitor's protection to the unsynchronized get()."
      - "count++ inside a synchronized method is still non-atomic, because the read-modify-write can interleave despite the thread holding the lock."
    answer: 1
    explanation: |
      inc() is correctly atomic and safe. The bug is get(): reading without acquiring the same
      monitor establishes no happens-before edge, so it may see a stale value. Synchronizing
      get() (or otherwise establishing visibility) fixes it. count++ under the lock IS atomic, so
      option 3 is wrong.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-036
    difficulty: advanced
    tags: [varhandle, version, memory-order]
    question: |
      `VarHandle` (JEP 193) was introduced to provide safe, fine-grained memory-ordering access
      modes as a replacement for `sun.misc.Unsafe`. In which Java version did it arrive?
    options:
      - "Java 8"
      - "Java 14"
      - "Java 11"
      - "Java 9"
    answer: 3
    explanation: |
      VarHandle shipped in Java 9 (JEP 193), exposing access modes such as plain get/set,
      getOpaque, getAcquire/setRelease, getVolatile, and compareAndSet — a standard-API
      alternative to the unofficial sun.misc.Unsafe. Note there is no getPlain: plain access is
      exactly what get and set already mean.
    ref: "concepts.md#atomic-classes-and-cas"
  - id: synchronized-volatile-jmm-037
    difficulty: advanced
    tags: [code-analysis, final, safe-publication]
    question: |
      ```java
      final class Range {
          final int lo, hi;
          Range(int lo, int hi) { this.lo = lo; this.hi = hi; }
      }
      static Range r;   // plain static field, written by one thread, read by others
      ```
      One thread does `r = new Range(1, 10);` and others read `r`. Ignoring whether `r` itself is
      seen, once a thread observes a non-null `r`, what does the JMM guarantee about `lo`/`hi`?
    options:
      - "They may still be 0, since the racy plain publication of r cancels out the final-field freeze guarantee."
      - "They are guaranteed to be 1 and 10 because they are final fields of a properly constructed object."
      - "They are guaranteed correct only if r is declared volatile."
      - "Behavior is undefined and the JVM may crash with a SIGSEGV when the racily published fields are dereferenced."
    answer: 1
    explanation: |
      Even though r is published racily, the final-field guarantee ensures a thread that sees the
      object observes its final fields (lo=1, hi=10) correctly, since this did not escape
      construction. Making r volatile would additionally guarantee visibility of r itself, but is
      not required for the final-field values once the reference is seen.
    ref: "concepts.md#final-field-semantics"
  - id: synchronized-volatile-jmm-038
    difficulty: advanced
    tags: [false-sharing, padding, jit]
    question: |
      Why is manually adding unused `long` padding fields around a hot field an unreliable way to
      prevent false sharing on modern JVMs?
    options:
      - "Cache lines are only 8 bytes wide on modern CPUs, so seven padding longs never span enough memory to isolate the hot field."
      - "Padding fields must each be declared volatile, otherwise the JVM coalesces them into a single slot and the padding has no effect."
      - "The JIT (and field layout) may eliminate or reorder unused fields, so the intended padding is not guaranteed; only the JVM's layouter can force it."
      - "Manual padding bloats each object so much that it triggers an OutOfMemoryError once many instances are allocated under load."
    answer: 2
    explanation: |
      Unused fields can be optimized away or laid out unexpectedly, so hand-rolled padding is
      fragile. Only the JVM's own field layouter can guarantee the gap, and the annotation that
      asks it to — @Contended (JEP 142, Java 8) — is JDK-internal: it needs both --add-exports
      and -XX:-RestrictContended, so application code should not reach for it. Use the classes
      that already carry it (LongAdder's cells, fork/join) instead. Cache lines are typically 64
      bytes, not 8.
    ref: "concepts.md#false-sharing"
  - id: synchronized-volatile-jmm-039
    difficulty: advanced
    tags: [code-analysis, cas, retry-loop]
    question: |
      ```java
      AtomicInteger max = new AtomicInteger(Integer.MIN_VALUE);
      void updateMax(int candidate) {
          int cur;
          do {
              cur = max.get();
              if (candidate <= cur) return;
          } while (!max.compareAndSet(cur, candidate));
      }
      ```
      Is this correct under concurrency, and why?
    options:
      - "Incorrect; because the guard is checked before the CAS, a slow thread can commit a candidate that is lower than the current maximum installed meanwhile."
      - "Incorrect; compareAndSet only compares and does not lock, so two threads reading the same cur can both succeed and double-apply the update."
      - "Correct; the CAS retry loop re-reads cur and only commits when the value is unchanged, otherwise it retries or bails out if candidate is no longer larger."
      - "Correct only if max is also declared volatile in addition to AtomicInteger."
    answer: 2
    explanation: |
      This is the canonical lock-free max update. On CAS failure another thread changed max, so
      the loop re-reads cur; the guard `candidate <= cur` ensures it never lowers the max.
      compareAndSet IS atomic, and AtomicInteger already stores its value volatile-ly, so no
      extra volatile is needed.
    ref: "concepts.md#atomic-classes-and-cas"
  - id: synchronized-volatile-jmm-040
    difficulty: advanced
    tags: [jmm, out-of-thin-air, causality]
    question: |
      Even for programs with data races, the JMM forbids "out-of-thin-air" values. Why is this
      rule important?
    options:
      - "It upgrades racy programs to full sequential consistency by retroactively ordering their conflicting accesses."
      - "It forces the compiler to emit a full memory fence before every field read so no fabricated value can be observed."
      - "It preserves basic type/memory safety by preventing reads from returning fabricated values (e.g., a reference no thread ever wrote), which could otherwise break the VM's safety guarantees."
      - "It only applies to volatile fields, leaving plain fields free to yield out-of-thin-air values."
    answer: 2
    explanation: |
      The causality model exists so that, even in racy code, a read cannot return a value that
      was never written by any thread (which for references could corrupt memory safety). It does
      NOT make racy programs sequentially consistent, and applies to all fields, not just
      volatile. It is a safety floor, not a promise of ordering.
    ref: "concepts.md#the-java-memory-model-and-happens-before"
  - id: synchronized-volatile-jmm-041
    difficulty: advanced
    tags: [synchronized, inflation, hotspot]
    question: |
      In HotSpot, what is "lock inflation"?
    options:
      - "Transitioning an object's lock from a lightweight (CAS-on-mark-word) lock to a heavyweight OS-backed ObjectMonitor when contention occurs."
      - "Automatically growing the JVM heap when too many monitor objects are created and the lock table fills up."
      - "Increasing the reentrancy hold count of a lock so a thread can nest deeper into the same monitor."
      - "Adding cache-line padding around a lock object so its mark word avoids false sharing with neighboring fields."
    answer: 0
    explanation: |
      When a lightweight (thin) lock experiences contention, HotSpot inflates it into a
      heavyweight monitor (ObjectMonitor) backed by OS primitives, with a wait set and entry
      list. It has nothing to do with heap growth, reentrancy counts, or padding.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-042
    difficulty: advanced
    tags: [code-analysis, visibility, ordering]
    question: |
      ```java
      class Race {
          int a = 0, b = 0;
          // Thread 1              // Thread 2
          void t1() { a = 1;       void t2() { int r1 = b;
                      b = 1; }                  int r2 = a; }
      }
      ```
      With no volatile/synchronization, which outcome (r1, r2) is possible that would be
      impossible under sequential consistency?
    options:
      - "(0, 0) — this can only arise through the compiler reordering both writes past both reads, which SC forbids"
      - "(0, 1) — r1 sees the stale b while r2 sees a==1, an outcome only a relaxed non-SC model could produce"
      - "(1, 1) — observing both writes requires speculative read-ahead that violates sequential consistency"
      - "(1, 0) — r1 sees b==1 but r2 sees a==0, due to reordering with no happens-before edge"
    answer: 3
    explanation: |
      Under SC, if r1==1 (b written) then a was written first (program order), so r2 must be 1.
      But with a data race and no happens-before edge, the writes/reads can be reordered so
      Thread 2 sees b==1 yet a==0 — the (1,0) result, which SC forbids. The other tuples are all
      SC-consistent outcomes.
    ref: "concepts.md#visibility-reordering-and-atomicity"
  - id: synchronized-volatile-jmm-043
    difficulty: advanced
    tags: [atomic, lock-free, progress]
    question: |
      CAS-based atomics are described as "lock-free" but not "wait-free." What is the practical
      implication under very high contention?
    options:
      - "They can deadlock exactly like blocking locks, because a stalled thread holding a half-completed CAS blocks all the others."
      - "They silently corrupt data when contention is high, because overlapping CAS attempts can both write and interleave their partial results."
      - "A given thread may retry its CAS loop many times (it is not guaranteed bounded steps), and a blocking lock can sometimes outperform heavy CAS spinning."
      - "They automatically fall back to an internal synchronized block once the CAS retry count crosses a JVM-tuned threshold."
    answer: 2
    explanation: |
      Lock-freedom guarantees system-wide progress (some thread makes progress) but an individual
      thread may spin/retry unboundedly (not wait-free). Under extreme contention this wasted CAS
      work can be slower than a lock that parks threads. They never deadlock or corrupt data, and
      do not auto-fallback.
    ref: "concepts.md#volatile-vs-atomic-vs-synchronized-trade-offs"
  - id: synchronized-volatile-jmm-044
    difficulty: advanced
    tags: [code-analysis, synchronized, different-monitors]
    question: |
      ```java
      class Account {
          private double balance;
          public synchronized void deposit(double x) { balance += x; }
          public static synchronized double rate() { return 0.05; }
      }
      ```
      Do `deposit()` on an instance and `rate()` mutually exclude each other?
    options:
      - "Yes; because both methods carry the synchronized modifier, the JVM funnels them through one shared class-wide monitor, so only one runs at a time."
      - "No, because deposit() locks the instance ('this') while rate() locks the Account.class object — different monitors."
      - "Yes, but only when both calls originate on the same thread, since the monitor is tracked per-thread."
      - "No, because static methods cannot be synchronized at all and rate() silently runs without any lock."
    answer: 1
    explanation: |
      An instance synchronized method locks 'this'; a static synchronized method locks the Class
      object. They use different monitors, so they can run concurrently. Static methods CAN be
      synchronized (option 3 wrong).
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-045
    difficulty: advanced
    tags: [volatile, dcl, local-variable]
    question: |
      A common micro-optimization in a volatile double-checked locking getter is to read the
      volatile field into a local variable. Why?
    options:
      - "To make the field effectively non-volatile, so the JVM can drop the barriers for every subsequent access to it."
      - "To force the JIT to inline the getter, because it will only inline methods whose volatile reads are cached in a local first."
      - "Because volatile fields cannot be returned directly from a method and must be copied to a local before the return statement."
      - "To avoid a second (redundant) volatile read on the common path, reducing barrier cost while preserving correctness."
    answer: 3
    explanation: |
      Reading the volatile once into a local avoids a second volatile read (each carries ordering
      cost) when the field is already initialized, a documented DCL micro-optimization. It does
      not change the field's volatility or its return-ability.
    ref: "concepts.md#double-checked-locking"
  - id: synchronized-volatile-jmm-046
    difficulty: expert
    tags: [code-analysis, final, reflection]
    question: |
      Which statement about reflectively changing a `final` field after construction is most
      accurate with respect to the JMM?
    options:
      - "It is outside the final-field reader guarantees; readers may observe either the old or new value with no ordering promise, and the behavior is unspecified for optimization purposes."
      - "The change is guaranteed visible to all threads immediately, exactly like a volatile write, because reflective mutation inserts a release fence on the field."
      - "It always throws IllegalAccessException regardless of setAccessible, because the JLS forbids reflectively writing any final field after construction."
      - "It is fully equivalent to a normal non-final field write, carrying the same sequential-consistency semantics that the JMM grants ordinary stores."
    answer: 0
    explanation: |
      JLS 17.5.3 does add a freeze after each reflective modification, exactly as at the end of a
      constructor — what it withholds is the reader's half. The rules that let a read see a
      frozen value are written for a reader that obtains the reference after the freeze, so a
      thread already holding the reference may keep seeing the old value indefinitely (the JIT
      may have constant-folded it), and no synchronization on its side changes that. It is not
      treated as volatile, not SC, and with setAccessible(true) it does not necessarily throw.
    ref: "concepts.md#final-field-semantics"
  - id: synchronized-volatile-jmm-047
    difficulty: expert
    tags: [code-analysis, volatile, piggyback, negative]
    question: |
      ```java
      int x;             // plain
      volatile int g;    // guard
      // Writer            // Reader
      x = 1;               int r = g;      // reads g, ignores result
      g = 2;               int s = x;      // what can s be?
      ```
      The reader reads `g` into a discarded local, then reads `x`. If the reader's `g` read
      returns the *initial* value (0), what values may `s` take?
    options:
      - "s must be 1, because x=1 happens-before g=2 and any read of g therefore publishes the prior x write."
      - "The code does not compile because g's read result is assigned to a local that is never used afterward."
      - "s must be 0, because the acquiring read of g forces the two reader loads to be reordered ahead of the writer."
      - "s may be 0 or 1: reading the stale/initial g creates no happens-before edge to the writer's g=2, so the writer's x=1 is not guaranteed visible."
    answer: 3
    explanation: |
      The release/acquire edge only forms when the acquiring read *observes the value written by*
      the releasing write. If the reader's g-read returns the initial 0 (not the writer's 2),
      there is no happens-before to the writer, so x=1 may or may not be visible: s can be 0 or 1.
      Discarding a read result is legal Java.
    ref: "concepts.md#volatile"
  - id: synchronized-volatile-jmm-048
    difficulty: expert
    tags: [jmm, roach-motel, reordering]
    question: |
      The JMM permits "roach motel" ordering around synchronized blocks. What does this mean?
    options:
      - "Nothing can ever be reordered near a synchronized block, since the lock acts as a full two-way fence pinning every surrounding operation in place."
      - "The block can be entirely eliminated whenever it is uncontended, because an unshared lock lets the JIT delete the critical section outright."
      - "Operations can move out of the block but not into it, so the critical section can legally shrink but never expand."
      - "Operations can be moved INTO a synchronized block (past the lock acquire or before the release) but cannot be moved OUT of it, so the critical section can legally expand but not shrink."
    answer: 3
    explanation: |
      Lock acquire has acquire semantics and release has release semantics, so the compiler may
      sink operations into the critical section (they can go in but not come out) — the
      "roach motel" model. This can enlarge but never shrink the effective critical section,
      preserving correctness while allowing optimization such as lock coarsening.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-049
    difficulty: expert
    tags: [code-analysis, atomic, compound]
    question: |
      ```java
      AtomicReference<List<String>> ref = new AtomicReference<>(List.of());
      void add(String s) {
          List<String> cur = ref.get();
          List<String> next = new ArrayList<>(cur);
          next.add(s);
          ref.set(next);        // <-- note: set, not compareAndSet
      }
      ```
      Called concurrently, what is the defect?
    options:
      - "Using set() instead of compareAndSet() creates a lost-update race: two threads can both read the same cur and one overwrites the other's addition."
      - "None; AtomicReference makes the whole read-copy-modify-write method atomic because every call to get() and set() goes through the same guarded reference."
      - "List.of() returns an immutable list, so passing it to new ArrayList<>(cur) throws UnsupportedOperationException at copy time."
      - "AtomicReference cannot hold a List, because its type parameter is restricted to primitive wrapper types."
    answer: 0
    explanation: |
      The read-copy-modify-write is only atomic if the write is conditional on the value not
      having changed. Using set() unconditionally means two threads reading the same cur will
      each build their own next and the later set() clobbers the earlier — a lost update. The fix
      is a compareAndSet retry loop (or updateAndGet). ArrayList copy of an immutable list is fine.
    ref: "concepts.md#atomic-classes-and-cas"
  - id: synchronized-volatile-jmm-050
    difficulty: expert
    tags: [code-analysis, safe-publication, non-final]
    question: |
      ```java
      class Holder { int n; Holder(int n) { this.n = n; } }   // n is NOT final
      static Holder h;                                         // plain static
      // Publisher: h = new Holder(42);
      // Reader:    Holder local = h; if (local != null) use(local.n);
      ```
      With the racy publication above and a non-final field, what may the reader observe for
      `local.n`?
    options:
      - "Always 42, identical to the final-field case, because writing n in the constructor freezes it regardless of the field's modifier."
      - "Possibly 0 (the default) as well as 42, because without final or safe publication there is no happens-before guaranteeing the constructor's write of n is visible."
      - "A NullPointerException, always, because the racy publication leaves local pointing at an uninitialized object header."
      - "A torn 32-bit value somewhere between 0 and 42, since the int write to n can be split across the race window."
    answer: 1
    explanation: |
      Because n is not final and publication is racy (plain static, no synchronization/volatile),
      there is no happens-before edge guaranteeing the write n=42 is visible even after the
      reference is seen. The reader can observe the default 0. Making n final, or publishing h
      via volatile/synchronization, would fix it. int writes aren't torn (option 3).
    ref: "concepts.md#final-field-semantics"
  - id: synchronized-volatile-jmm-051
    difficulty: expert
    tags: [volatile, opaque, memory-order, version]
    question: |
      Doug Lea's JDK 9 memory-order modes (via VarHandle) include an "opaque" mode. How does
      opaque access differ from volatile access?
    options:
      - "Opaque is stronger than volatile, layering an extra full StoreLoad fence on top of the release/acquire edges volatile already provides."
      - "Opaque is identical to plain access, offering no atomicity, coherence, or progress guarantees whatsoever."
      - "Opaque guarantees atomicity, coherence, and progress (the write will eventually be visible and per-variable order is preserved) but does NOT provide the release/acquire ordering across other variables that volatile does."
      - "Opaque only works on 64-bit long and double fields, since narrower types cannot carry its coherence metadata."
    answer: 2
    explanation: |
      Opaque mode ensures the access is atomic and coherent and that updates make progress
      (bitwise visibility) and preserves program order per variable, but unlike volatile it does
      not create release/acquire happens-before edges ordering *other* variables. It is weaker
      than volatile (which adds acquire/release + the StoreLoad fence), and stronger than plain.
    ref: "concepts.md#atomic-classes-and-cas"
  - id: synchronized-volatile-jmm-052
    difficulty: expert
    tags: [code-analysis, this-escape, listener]
    question: |
      ```java
      class Widget {
          final int size;
          Widget(EventSource src) {
              src.register(this);     // (A) publishes 'this' before ctor completes
              this.size = 100;        // (B)
          }
      }
      ```
      Why is this constructor unsafe even though `size` is `final`?
    options:
      - "It is safe; final fields are always visible after construction, so the freeze covers size no matter when 'this' is handed out."
      - "Because final fields cannot legally be assigned in a constructor body, so line (B) fails to freeze size at all."
      - "Because 'this' escapes at (A) before the final field is frozen at construction end, another thread invoked via the listener may observe size == 0."
      - "Because register() must itself be synchronized on the Widget instance for the assignment at (B) to publish safely."
    answer: 2
    explanation: |
      Publishing this before the constructor finishes (the classic this-escape via listener
      registration) defeats the final-field guarantee: another thread reaching the object through
      src can see size before its freeze, observing the default 0. Final fields CAN be set in the
      constructor body; the problem is the premature escape.
    ref: "concepts.md#final-field-semantics"
  - id: synchronized-volatile-jmm-053
    difficulty: expert
    tags: [false-sharing, longadder, contended]
    question: |
      Why does `LongAdder` typically outperform a single `AtomicLong` under heavy write
      contention, at the memory-model level?
    options:
      - "It maintains multiple @Contended-padded cells that threads update independently (reducing both CAS contention and false sharing), summing them only on read."
      - "It uses a short synchronized block internally, which on modern JVMs is faster than an equivalent CAS retry loop under heavy contention."
      - "It caches the running total in one volatile field that is updated with a plain store, so no CAS is ever needed on the hot path."
      - "It disables the StoreLoad barrier on its writes, trading a little visibility latency for much cheaper increments."
    answer: 0
    explanation: |
      LongAdder stripes updates across an array of cells, each padded via @Contended onto its own
      cache line, so different threads hit different cells — reducing CAS retries AND false
      sharing. sum() adds the cells. A single AtomicLong forces all threads onto one memory
      location. It does not use synchronized or disable barriers.
    ref: "concepts.md#false-sharing"
  - id: synchronized-volatile-jmm-054
    difficulty: expert
    tags: [code-analysis, double-checked, non-volatile-safe]
    question: |
      Which of these correctly implements a thread-safe lazy singleton WITHOUT declaring any
      field `volatile`?
    options:
      - "A plain double-checked locking where instance is a non-volatile field."
      - "A single unlocked null-check that assigns instance if null."
      - "The initialization-on-demand holder idiom, using a private static nested Holder class with a static final INSTANCE."
      - "Storing the instance in a plain static field written by the first caller."
    answer: 2
    explanation: |
      The holder idiom relies on the JVM's thread-safe, once-only, lazy class initialization
      (JLS 12.4) — no volatile or explicit lock needed. Non-volatile DCL is broken; a plain
      unlocked check races; a plain static field written by the first caller is not lazy and is
      racy for visibility of construction.
    ref: "concepts.md#double-checked-locking"
  - id: synchronized-volatile-jmm-055
    difficulty: beginner
    tags: [synchronized, deadlock]
    question: |
      Which situation is a classic cause of deadlock with `synchronized`?
    options:
      - "A single thread re-entering the same monitor it already holds, incrementing the reentrant hold count on each nested acquire."
      - "Two threads acquiring two locks in opposite orders (thread A takes L1 then L2; thread B takes L2 then L1)."
      - "Reading a volatile field inside a synchronized block, which forces a redundant StoreLoad fence and stalls every other waiting thread."
      - "Using a private final Object as the lock, which prevents the JIT from ever coarsening or eliding that critical section."
    answer: 1
    explanation: |
      Lock-ordering deadlock arises when threads acquire the same set of locks in different
      orders and each waits on a lock the other holds. Reentrancy by one thread is fine (option
      0), and the other options are benign practices.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-056
    difficulty: beginner
    tags: [atomic, package, version]
    question: |
      In which Java release did the `java.util.concurrent.atomic` package (AtomicInteger, etc.)
      first appear?
    options:
      - "Java 1.4"
      - "Java 8"
      - "Java 7"
      - "Java 5"
    answer: 3
    explanation: |
      The java.util.concurrent packages, including atomic, arrived in Java 5 (2004) along with
      the JSR-133 memory model. LongAdder/DoubleAdder were later added in Java 8.
    ref: "concepts.md#atomic-classes-and-cas"
  - id: synchronized-volatile-jmm-057
    difficulty: intermediate
    tags: [trade-offs, comparison]
    question: |
      Which single statement best captures what `volatile` does NOT provide but `synchronized`
      does?
    options:
      - "Mutual exclusion and the ability to make multi-step operations atomic."
      - "Visibility of writes across threads, so a value stored by one thread is reliably observed by another that reads later."
      - "Ordering (happens-before) guarantees between the write of the field and subsequent reads by other threads."
      - "Atomic reads of a 64-bit long, guaranteeing the value is never observed as a torn pair of 32-bit halves."
    answer: 0
    explanation: |
      Both provide visibility, ordering, and (for volatile) atomic single 64-bit access. Only
      synchronized (or a Lock) provides mutual exclusion and lets you make an arbitrary block of
      multiple operations atomic. That is the key differentiator.
    ref: "concepts.md#volatile-vs-atomic-vs-synchronized-trade-offs"
  - id: synchronized-volatile-jmm-058
    difficulty: intermediate
    tags: [happens-before, thread-start-join]
    question: |
      Which pair of happens-before edges does the JMM guarantee for thread lifecycle?
    options:
      - "Thread.start() happens-before actions in the started thread; and actions in a thread happen-before another thread's return from join() on it."
      - "Thread.run() happens-before Thread.start(), so the body executes and publishes its writes before the thread is even launched."
      - "join() happens-before start() on the same thread, so a joining caller sees the thread's results before it has been started."
      - "A thread's own actions happen-before its own start() call, making its later writes visible to the code that launched it."
    answer: 0
    explanation: |
      The start rule: everything before t.start() is visible to the new thread. The join rule:
      everything the joined thread did is visible to the thread that returns from t.join(). The
      other orderings are nonsensical or reversed.
    ref: "concepts.md#the-java-memory-model-and-happens-before"
  - id: synchronized-volatile-jmm-059
    difficulty: intermediate
    tags: [code-analysis, volatile, compound-check]
    question: |
      ```java
      volatile int low, high;   // both volatile
      // Thread A sets low then high; Thread B:
      if (low < high) { doWork(low, high); }   // reads low and high separately
      ```
      Is the check-then-act on two separate volatile reads atomic?
    options:
      - "No; each volatile read is atomic individually, but the pair of reads is not a single atomic action, so low/high can change between them."
      - "Yes, because both fields are volatile, and the JMM fuses consecutive volatile reads in one method into a single atomic snapshot."
      - "Yes, but only if low and high sit on the same cache line, so the CPU loads both in one coherent cache-line fill atomically."
      - "No, because volatile fields cannot be compared with the < operator without first copying them into plain local variables."
    answer: 0
    explanation: |
      volatile makes each read atomic and ordered, but it does not make a *sequence* of reads
      atomic. Another thread can modify low or high between the two reads, so the invariant
      checked may not hold when doWork runs. You need a lock or an atomic snapshot of both values
      together.
    ref: "concepts.md#volatile"
  - id: synchronized-volatile-jmm-060
    difficulty: advanced
    tags: [synchronized, lock-coarsening, jit]
    question: |
      The JIT may perform "lock coarsening." What is it?
    options:
      - "Merging adjacent synchronized blocks that repeatedly lock/unlock the same monitor into a single larger critical section to reduce overhead."
      - "Splitting one synchronized block into several smaller ones so each holds the monitor for a shorter time and boosts concurrency."
      - "Replacing a contended lock with a volatile field whenever the guarded block performs only a single read or single write."
      - "Increasing the fairness of a lock so the longest-waiting thread is always granted the monitor next, preventing starvation."
    answer: 0
    explanation: |
      Lock coarsening merges repeated lock/unlock of the same monitor (e.g., in a loop) into one
      broader lock region, eliminating redundant acquire/release overhead. This is enabled by the
      roach-motel ordering model. It is the opposite of splitting, and unrelated to fairness or
      volatile substitution.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-061
    difficulty: advanced
    tags: [lock-elision, escape-analysis, jit]
    question: |
      The JIT can sometimes remove synchronization entirely via "lock elision." When is this
      legal?
    options:
      - "Whenever a lock is observed to be uncontended at runtime, since a monitor no other thread is competing for provably has no effect."
      - "When escape analysis proves the lock object is thread-local (never visible to another thread), so the lock can have no effect on other threads."
      - "Whenever the synchronized block contains no field writes, because a read-only critical section cannot create a visibility hazard."
      - "Only for static synchronized methods, whose Class-object monitor the JIT can safely prove is never truly contended."
    answer: 1
    explanation: |
      If escape analysis determines that the monitor object cannot be reached by any other thread
      (it does not escape), synchronizing on it is provably unobservable and the JIT can elide
      the lock. Mere lack of contention (option 0) is not sufficient justification for removal,
      and the other conditions are unrelated.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-062
    difficulty: advanced
    tags: [code-analysis, atomic, field-updater]
    question: |
      What is the primary purpose of `AtomicIntegerFieldUpdater`?
    options:
      - "To perform atomic CAS updates on a designated volatile int field of many existing objects without the per-object memory overhead of an AtomicInteger wrapper."
      - "To make any plain int field behave atomically without declaring it volatile, by inserting the required fences on each reflective access."
      - "To update several distinct int fields of an object atomically as one grouped transaction that either fully commits or fully rolls back."
      - "To replace synchronized blocks with automatic locking that the updater acquires and releases around each field mutation for you."
    answer: 0
    explanation: |
      AtomicXFieldUpdater lets you do atomic/CAS operations reflectively on an existing
      volatile field, avoiding an AtomicInteger object per instance (memory savings for many
      objects). The target field MUST be volatile (so option 1 is wrong); it operates on one
      field at a time, not a group.
    ref: "concepts.md#atomic-classes-and-cas"
  - id: synchronized-volatile-jmm-063
    difficulty: advanced
    tags: [jls, final, freeze, reference]
    question: |
      A `final` field holds a reference to a mutable object. Which guarantee applies?
    options:
      - "All future mutations of the referenced object are automatically visible to every thread, as if each of its fields were implicitly volatile."
      - "The final-field guarantee covers the reference and the state reachable through it as of the end of construction; later mutations of that object still require normal synchronization."
      - "The referenced object becomes deeply immutable, so any attempt to mutate its fields afterwards throws an UnsupportedOperationException."
      - "The reference itself may still be observed as null due to construction reordering, unless the field is additionally declared volatile."
    answer: 1
    explanation: |
      The freeze guarantee ensures a reader sees the final reference and the object state that
      existed when construction completed. It does NOT make the referenced object immutable or
      publish subsequent mutations — those need their own synchronization. The reference won't be
      seen as null for a properly constructed object.
    ref: "concepts.md#final-field-semantics"
  - id: synchronized-volatile-jmm-064
    difficulty: expert
    tags: [code-analysis, jmm, reordering, independent-reads]
    question: |
      ```java
      // all fields plain ints, initially 0
      // Thread 1: x = 1;
      // Thread 2: y = 1;
      // Thread 3: r1 = x; r2 = y;
      // Thread 4: r3 = y; r4 = x;
      ```
      Under the JMM (with data races), is the result r1==1, r2==0, r3==1, r4==0 permitted?
    options:
      - "No; if Thread 3 sees x==1 then Thread 4 must also see x==1, because the JMM propagates each write to all readers atomically."
      - "Yes, but only on weakly-ordered x86 hardware, whose store buffers let different cores drain the two writes in disagreeing orders."
      - "No; the JMM enforces a single total order on all writes to all fields, so every reader thread must agree on their global sequence."
      - "Yes; without happens-before edges, different reader threads may observe the two independent writes in inconsistent (non-globally-agreed) orders — this is the IRIW (independent reads of independent writes) scenario."
    answer: 3
    explanation: |
      This is the IRIW litmus test. With plain (non-volatile) accesses there is no global
      agreement on the order of the two independent writes, so Thread 3 can see x before y while
      Thread 4 sees y before x — the given result is allowed. Making the fields volatile would
      forbid it by imposing a total order on volatile accesses. It is not x86-specific.
    ref: "concepts.md#visibility-reordering-and-atomicity"
  - id: synchronized-volatile-jmm-065
    difficulty: expert
    tags: [fences, jep171, version]
    question: |
      `VarHandle.fullFence()`, `acquireFence()`, `releaseFence()`, `loadLoadFence()`, and
      `storeStoreFence()` expose explicit memory fences. The underlying fence intrinsics were
      introduced by which JEP / version?
    options:
      - "JEP 171 (Fence Intrinsics) in Java 8, later surfaced via VarHandle in Java 9"
      - "JEP 142 in Java 8"
      - "JEP 193 in Java 9 only"
      - "JEP 374 in Java 15"
    answer: 0
    explanation: |
      JEP 171 added fence intrinsics in Java 8 (originally exposed via sun.misc.Unsafe); the
      standard, public API for them arrived on VarHandle in Java 9 (JEP 193). JEP 142 is
      @Contended and JEP 374 is biased-locking disablement.
    ref: "concepts.md#atomic-classes-and-cas"
  - id: synchronized-volatile-jmm-066
    difficulty: expert
    tags: [code-analysis, synchronized, wait-condition]
    question: |
      ```java
      synchronized (lock) {
          if (!ready) lock.wait();   // uses 'if'
          consume();
      }
      ```
      Beyond spurious wakeups, what concrete bug can the `if` (instead of `while`) cause?
    options:
      - "After waking, another thread may have already consumed the condition (ready flipped back to false), so consume() runs when it should not — a missed/invalidated signal."
      - "None; the if is exactly equivalent to a while here, because a notified thread always re-acquires the lock with the predicate still guaranteed true."
      - "wait() will throw IllegalMonitorStateException, because guarding it with an if rather than a while relinquishes monitor ownership before blocking."
      - "The thread will never wake up at all, since notify() can only release a waiter that was parked inside a while loop rather than an if."
    answer: 0
    explanation: |
      With if, once notified the thread proceeds without re-checking. But between the notify and
      re-acquiring the monitor, another consumer could have taken the resource and reset ready.
      The woken thread then wrongly runs consume(). A while loop re-tests the predicate after
      reacquiring the lock, which is why it is mandatory. This applies to spurious wakeups too.
    ref: "concepts.md#synchronized-monitors-and-reentrancy"
  - id: synchronized-volatile-jmm-067
    difficulty: intermediate
    tags: [volatile, cost, read-write]
    question: |
      On typical hardware, which is generally true about the relative cost of volatile access?
    options:
      - "Volatile reads and writes cost exactly the same, because the JMM requires an identical full fence on both sides of every volatile access."
      - "Both a volatile read and a volatile write are always as expensive as acquiring an uncontended lock, since each performs a monitor enter under the hood."
      - "A volatile write is cheaper than a volatile read, because the write can be buffered and drained lazily while the read must stall for a fence."
      - "A volatile read is usually cheap (often close to a normal read), while a volatile write is more expensive because it requires a StoreLoad-style full fence."
    answer: 3
    explanation: |
      Volatile reads are relatively cheap (on x86 essentially a normal load plus compiler
      ordering constraints), while volatile writes need the expensive StoreLoad fence to order
      against later loads. Neither is generally as costly as an actual lock acquire under
      contention.
    ref: "concepts.md#volatile-vs-atomic-vs-synchronized-trade-offs"
  - id: synchronized-volatile-jmm-068
    difficulty: expert
    tags: [code-analysis, atomic, updateAndGet]
    question: |
      Which rewrite of a lock-free counter increment is BOTH correct and idiomatic in Java 8+?
    options:
      - "`counter.set(counter.get() + 1);`"
      - "`counter.updateAndGet(x -> x + 1);` (or `incrementAndGet()`)"
      - "`counter.lazySet(counter.get() + 1);`"
      - "`synchronized(counter) { counter.set(counter.get() + 1); }`"
    answer: 1
    explanation: |
      updateAndGet applies the function atomically via an internal CAS retry loop (as does
      incrementAndGet). Option 0 and option 2 do a non-atomic read-then-write (lost updates;
      lazySet also relaxes ordering). Option 3 synchronizes on the atomic object, which does not
      make get()+set() atomic w.r.t. other threads using the atomic's own methods.
    ref: "concepts.md#atomic-classes-and-cas"
