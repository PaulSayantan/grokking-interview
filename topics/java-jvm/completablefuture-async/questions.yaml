topic: "CompletableFuture and Asynchronous Programming"
domain: java-jvm
topic_slug: completablefuture-async
version: 1
questions:
- id: completablefuture-async-001
  difficulty: beginner
  tags: [future, history, versions]
  question: |
    In which Java release were `CompletableFuture` and the `CompletionStage`
    interface introduced?
  options:
  - "Java 8"
  - "Java 11"
  - "Java 5"
  - "Java 7"
  answer: 0
  explanation: |
    `CompletableFuture` and `CompletionStage` shipped in Java 8 (2014), the same
    release as lambdas and streams. `Future` (and `ExecutorService`) came earlier
    in Java 5 (2004). Java 9 later *added* methods (orTimeout, completeOnTimeout,
    etc.) but did not introduce the class.
  ref: "concepts.md#creating-a-completablefuture"

- id: completablefuture-async-002
  difficulty: beginner
  tags: [future, limitations]
  question: |
    Which of the following is a genuine limitation of `java.util.concurrent.Future`
    that `CompletableFuture` was designed to address?
  options:
  - "Future cannot be submitted to an ExecutorService"
  - "Future has no way to register a callback or chain further work; you must block on get() or poll isDone()"
  - "Future cannot represent a result of a generic type"
  - "Future cannot be cancelled once submitted"
  answer: 1
  explanation: |
    `Future` offers no completion callback and no composition — you must block on
    `get()` or poll `isDone()`. It *can* be submitted to an executor, is generic,
    and *can* be cancelled. The lack of chaining/combining/callbacks is precisely
    what `CompletableFuture` (via `CompletionStage`) fixes.
  ref: "concepts.md#future-limitations"

- id: completablefuture-async-003
  difficulty: beginner
  tags: [creation, supplyasync, runasync]
  question: |
    What is the return type of `CompletableFuture.runAsync(() -> doWork())`?
  options:
  - "CompletableFuture<Object>"
  - "void"
  - "CompletableFuture<Void>"
  - "CompletableFuture<Runnable>"
  answer: 2
  explanation: |
    `runAsync` takes a `Runnable` (no result) and returns
    `CompletableFuture<Void>`. `supplyAsync` takes a `Supplier<U>` and returns
    `CompletableFuture<U>` when you need a produced value.
  ref: "concepts.md#creating-a-completablefuture"

- id: completablefuture-async-004
  difficulty: beginner
  tags: [creation, executor, forkjoinpool]
  question: |
    If you call `CompletableFuture.supplyAsync(supplier)` WITHOUT passing an
    executor, which thread pool runs the supplier?
  options:
  - "The main thread synchronously"
  - "A fixed thread pool sized to 10 threads"
  - "A newly created single-thread executor"
  - "The common ForkJoinPool (ForkJoinPool.commonPool())"
  answer: 3
  explanation: |
    The no-executor overloads of `supplyAsync`/`runAsync` and all `...Async`
    methods submit to `ForkJoinPool.commonPool()`. To control threading (especially
    for blocking work) pass an explicit `Executor`.
  ref: "concepts.md#common-forkjoinpool-vs-a-custom-executor"

- id: completablefuture-async-005
  difficulty: beginner
  tags: [creation, completedfuture]
  question: |
    What does `CompletableFuture.completedFuture("x")` do?
  options:
  - "Returns an already-completed future holding \"x\" without using any thread pool"
  - "Blocks until \"x\" is computed"
  - "Throws because no Supplier was provided"
  - "Submits a task to the common pool that returns \"x\""
  answer: 0
  explanation: |
    `completedFuture` returns a stage that is already done with the given value —
    no executor, no async work. It is useful for cache hits, defaults, and tests.
  ref: "concepts.md#creating-a-completablefuture"

- id: completablefuture-async-006
  difficulty: beginner
  tags: [chaining, thenapply, map]
  question: |
    Which method is the closest analogue of `Stream.map` — transforming the value
    with a plain `Function<T,U>`?
  options:
  - "thenCompose"
  - "thenApply"
  - "thenCombine"
  - "thenRun"
  answer: 1
  explanation: |
    `thenApply` applies a `Function<T,U>` and yields `CompletableFuture<U>` — the
    map analogue. `thenCompose` is flatMap (function returns another stage),
    `thenCombine` zips two stages, and `thenRun` ignores the value entirely.
  ref: "concepts.md#thenapply-vs-thencompose-vs-thencombine"

- id: completablefuture-async-007
  difficulty: beginner
  tags: [blocking, join, get]
  question: |
    What is the primary behavioral characteristic shared by `get()` and `join()`?
  options:
  - "Both run the supplier on the common pool"
  - "Both are non-blocking and return immediately"
  - "Both block the calling thread until the future completes"
  - "Both cancel the future"
  answer: 2
  explanation: |
    Both block until completion. The difference is exception style: `get()` throws
    checked `InterruptedException`/`ExecutionException`, while `join()` throws the
    unchecked `CompletionException`.
  ref: "concepts.md#blocking-pitfalls-with-join-and-get"

- id: completablefuture-async-008
  difficulty: beginner
  tags: [exception, exceptionally]
  question: |
    When does the function passed to `exceptionally(fn)` run?
  options:
  - "Only when the upstream stage completed successfully"
  - "Never; it is deprecated"
  - "Always, on both success and failure"
  - "Only when the upstream stage completed exceptionally (failed)"
  answer: 3
  explanation: |
    `exceptionally` fires only on the failure path and supplies a fallback value.
    On success it is skipped. Contrast with `handle`/`whenComplete`, which run on
    both paths.
  ref: "concepts.md#exception-handling-with-exceptionally-handle-and-whencomplete"

- id: completablefuture-async-009
  difficulty: beginner
  tags: [allof, anyof]
  question: |
    What is the declared return type of `CompletableFuture.allOf(cf1, cf2)`?
  options:
  - "CompletableFuture<Void>"
  - "CompletableFuture<Object>"
  - "CompletableFuture<T[]>"
  - "CompletableFuture<List<T>>"
  answer: 0
  explanation: |
    `allOf` returns `CompletableFuture<Void>` — it signals completion of all inputs
    but does not aggregate results. You collect results yourself (e.g., via
    `cf1.join()` after `allOf` completes). `anyOf` returns `CompletableFuture<Object>`.
  ref: "concepts.md#combining-futures-with-allof-and-anyof"

- id: completablefuture-async-010
  difficulty: beginner
  tags: [virtual-threads, versions]
  question: |
    In which JDK release did virtual threads (Project Loom) become a final,
    permanent feature?
  options:
  - "JDK 19"
  - "JDK 21"
  - "JDK 24"
  - "JDK 17"
  answer: 1
  explanation: |
    Virtual threads were previews in JDK 19 (JEP 425) and JDK 20 (JEP 436) and
    became final in JDK 21 (JEP 444). JDK 24 later removed the `synchronized`
    pinning limitation (JEP 491) but did not introduce virtual threads.
  ref: "concepts.md#comparison-to-virtual-threads"

- id: completablefuture-async-011
  difficulty: beginner
  tags: [interfaces, completionstage]
  question: |
    `CompletableFuture<T>` implements which two types?
  options:
  - "Future<T> and Flow.Publisher<T>"
  - "Future<T> and Runnable"
  - "Future<T> and CompletionStage<T>"
  - "Callable<T> and CompletionStage<T>"
  answer: 2
  explanation: |
    `CompletableFuture` implements `Future<T>` (so `get`/`cancel` work) and
    `CompletionStage<T>` (the ~50 chaining/combining/exception methods).
  ref: "concepts.md#future-limitations"

- id: completablefuture-async-012
  difficulty: beginner
  tags: [creation, manual-completion]
  question: |
    Which method completes a manually created `CompletableFuture` with a normal
    value from outside code?
  options:
  - "join(value)"
  - "thenApply(value)"
  - "supplyAsync(value)"
  - "complete(value)"
  answer: 3
  explanation: |
    `complete(value)` imperatively fulfils an incomplete future (returning `false`
    if already completed). `completeExceptionally(ex)` fails it. This ability to
    push a value in is a core feature `Future` lacks.
  ref: "concepts.md#creating-a-completablefuture"

- id: completablefuture-async-013
  difficulty: intermediate
  tags: [chaining, thencompose, flatmap]
  question: |
    You have `CompletableFuture<Long> fetchId()` and
    `CompletableFuture<User> fetchUser(long id)`. Which composition correctly
    yields a `CompletableFuture<User>`?
  options:
  - "fetchId().thenCompose(id -> fetchUser(id))"
  - "fetchId().thenCombine(fetchUser(0), (a, b) -> b)"
  - "fetchId().thenAccept(id -> fetchUser(id))"
  - "fetchId().thenApply(id -> fetchUser(id))"
  answer: 0
  explanation: |
    `fetchUser` itself returns a `CompletableFuture`, so you need `thenCompose`
    (flatMap) to avoid nesting. `thenApply` would yield
    `CompletableFuture<CompletableFuture<User>>`. `thenAccept` returns
    `CompletableFuture<Void>`, and `thenCombine` is for independent futures.
  ref: "concepts.md#thenapply-vs-thencompose-vs-thencombine"

- id: completablefuture-async-014
  difficulty: intermediate
  tags: [chaining, thenapply, nesting]
  question: |
    What is the compile-time type of the following expression?

    ```java
    CompletableFuture<Long> idF = CompletableFuture.supplyAsync(() -> 1L);
    var x = idF.thenApply(id -> CompletableFuture.supplyAsync(() -> "u" + id));
    ```
  options:
  - "CompletableFuture<String>"
  - "CompletableFuture<CompletableFuture<String>>"
  - "CompletableFuture<Long>"
  - "It does not compile"
  answer: 1
  explanation: |
    The lambda returns a `CompletableFuture<String>`, and `thenApply` wraps that
    return value, producing `CompletableFuture<CompletableFuture<String>>`. This is
    the classic nesting bug — `thenCompose` would flatten it to
    `CompletableFuture<String>`.
  ref: "concepts.md#thenapply-vs-thencompose-vs-thencombine"

- id: completablefuture-async-015
  difficulty: intermediate
  tags: [chaining, thencombine, zip]
  question: |
    Two independent calls `price()` and `tax()` each return `CompletableFuture<Double>`.
    You want their sum once both finish, running both concurrently. Which is best?
  options:
  - "price().thenApply(p -> p + tax().join())"
  - "price().thenCompose(p -> tax().thenApply(t -> p + t))"
  - "price().thenCombine(tax(), (p, t) -> p + t)"
  - "CompletableFuture.allOf(price()).thenApply(v -> price().join())"
  answer: 2
  explanation: |
    `thenCombine` is purpose-built to zip two independent futures once both
    complete, and both run concurrently. The `thenCompose` version works but
    sequences `tax()` after `price()` conceptually (and is less clear). The
    `thenApply` + `join()` version blocks a callback thread — an anti-pattern.
  ref: "concepts.md#thenapply-vs-thencompose-vs-thencombine"

- id: completablefuture-async-016
  difficulty: intermediate
  tags: [threading, async-variants]
  question: |
    What thread does `thenApplyAsync(fn)` (with NO executor argument) run the
    callback on?
  options:
  - "Always the main thread"
  - "A brand-new thread created per call"
  - "The thread that completed the previous stage"
  - "The common ForkJoinPool"
  answer: 3
  explanation: |
    `...Async` without an executor uses the common ForkJoinPool. The non-async
    `thenApply` instead runs on whichever thread completed the previous stage (or
    the caller if the stage was already complete). `...Async(fn, executor)` uses
    your executor.
  ref: "concepts.md#async-vs-non-async-variants-and-callback-threads"

- id: completablefuture-async-017
  difficulty: intermediate
  tags: [threading, non-async, already-complete]
  question: |
    Consider:

    ```java
    CompletableFuture<Integer> done = CompletableFuture.completedFuture(10);
    done.thenApply(x -> { System.out.println(Thread.currentThread().getName()); return x; });
    ```

    On which thread does the `thenApply` lambda most likely run?
  options:
  - "The current (calling) thread, synchronously, because the future is already complete"
  - "A dedicated timer thread"
  - "It never runs because the future is already complete"
  - "A common ForkJoinPool worker thread"
  answer: 0
  explanation: |
    When the upstream stage is already complete, a non-async callback like
    `thenApply` runs synchronously on the calling thread. Only `...Async` variants
    guarantee execution on a pool. It certainly still runs — attaching a callback
    to a completed future triggers it immediately.
  ref: "concepts.md#async-vs-non-async-variants-and-callback-threads"

- id: completablefuture-async-018
  difficulty: intermediate
  tags: [exception, handle, whencomplete]
  question: |
    Which statement about `whenComplete((v, ex) -> ...)` is correct?
  options:
  - "It runs only on success"
  - "It runs on both success and failure but does NOT consume the exception — the returned stage still completes exceptionally"
  - "It is identical to exceptionally"
  - "It can replace the failure with a fallback value and recover the chain"
  answer: 1
  explanation: |
    `whenComplete` is a side-effect observer (logging/cleanup). It runs on both
    paths but cannot transform the result; if the upstream failed, the returned
    stage still fails with the same cause. Use `handle` or `exceptionally` to
    actually recover.
  ref: "concepts.md#exception-handling-with-exceptionally-handle-and-whencomplete"

- id: completablefuture-async-019
  difficulty: intermediate
  tags: [exception, handle]
  question: |
    Why is `handle((v, ex) -> ...)` considered the most general exception method?
  options:
  - "Because it blocks until completion"
  - "Because it only runs on failure"
  - "Because it runs on both success and failure and can return a new value (transforming errors into values or introducing new errors)"
  - "Because it never wraps exceptions"
  answer: 2
  explanation: |
    `handle` receives both the value and the throwable, always runs, and returns a
    new result — so it can recover from errors, transform successes, or even throw.
    `exceptionally` only runs on failure; `whenComplete` cannot change the result.
  ref: "concepts.md#exception-handling-with-exceptionally-handle-and-whencomplete"

- id: completablefuture-async-020
  difficulty: intermediate
  tags: [exception, short-circuit, code-analysis]
  question: |
    What does the following print?

    ```java
    CompletableFuture.supplyAsync(() -> { throw new RuntimeException("boom"); })
        .thenApply(x -> x + "!")
        .exceptionally(ex -> "recovered")
        .thenApply(String::toUpperCase)
        .thenAccept(System.out::println);
    ```
  options:
  - "recovered"
  - "It throws and prints nothing"
  - "boom!"
  - "RECOVERED"
  answer: 3
  explanation: |
    The exception short-circuits `thenApply(x -> x + "!")` (skipped). `exceptionally`
    catches it and returns "recovered", so the chain resumes normally:
    `toUpperCase` -> "RECOVERED", which is printed.
  ref: "concepts.md#exception-handling-with-exceptionally-handle-and-whencomplete"

- id: completablefuture-async-021
  difficulty: intermediate
  tags: [allof, results, code-analysis]
  question: |
    Since `allOf` returns `CompletableFuture<Void>`, what is the standard idiom to
    collect results after it completes?
  options:
  - "Chain thenApply on the allOf future and call join() on each original future (safe, since they're already done)"
  - "Call allOf().get() which returns a List of results"
  - "Use anyOf instead, which returns the list"
  - "allOf returns the results directly; no extra step is needed"
  answer: 0
  explanation: |
    `allOf` yields `Void`; you gather results by chaining
    `all.thenApply(v -> List.of(a.join(), b.join()))`. Calling `join()` there is
    safe because `allOf` completing means each input is already done, so no real
    blocking occurs.
  ref: "concepts.md#combining-futures-with-allof-and-anyof"

- id: completablefuture-async-022
  difficulty: intermediate
  tags: [anyof, semantics]
  question: |
    `CompletableFuture.anyOf(a, b, c)` completes when...
  options:
  - "all of a, b, c complete successfully"
  - "the first of a, b, c completes (whether normally or exceptionally), with that result"
  - "the first of a, b, c completes SUCCESSFULLY, ignoring failures"
  - "any two of them complete"
  answer: 1
  explanation: |
    `anyOf` is "first to settle" — it completes as soon as any input completes,
    even if that first completion is a failure. It is NOT "first to succeed"; a
    fast failure will propagate even if slower inputs would have succeeded.
  ref: "concepts.md#combining-futures-with-allof-and-anyof"

- id: completablefuture-async-023
  difficulty: intermediate
  tags: [blocking, get, join, exceptions]
  question: |
    What is the difference in exception handling between `get()` and `join()`?
  options:
  - "They are identical"
  - "get() never throws; join() always throws"
  - "get() throws checked InterruptedException and ExecutionException; join() throws only the unchecked CompletionException"
  - "join() throws checked exceptions; get() throws unchecked"
  answer: 2
  explanation: |
    `get()` declares checked `InterruptedException` and `ExecutionException`
    (cause wrapped in `ExecutionException`). `join()` throws only unchecked
    `CompletionException`, which makes it convenient inside lambdas that can't
    declare checked exceptions.
  ref: "concepts.md#blocking-pitfalls-with-join-and-get"

- id: completablefuture-async-024
  difficulty: intermediate
  tags: [creation, versions, timeout]
  question: |
    Methods like `orTimeout`, `completeOnTimeout`, `completeAsync`, and
    `delayedExecutor` were added to `CompletableFuture` in which release?
  options:
  - "Java 11"
  - "Java 17"
  - "Java 8 (with the original class)"
  - "Java 9"
  answer: 3
  explanation: |
    These were added in Java 9 (JEP 266, "More Concurrency Updates"), which also
    added the `Flow` reactive streams interfaces. The base class itself was Java
    8. (The `exceptionallyAsync`/`exceptionallyCompose` family came later, in Java
    12.)
  ref: "concepts.md#creating-a-completablefuture"

- id: completablefuture-async-025
  difficulty: intermediate
  tags: [reactive, eager-lazy]
  question: |
    A key semantic difference between a `CompletableFuture` and a Project Reactor
    `Mono` is:
  options:
  - "CompletableFuture is eager (work starts on creation); Mono is lazy/cold (nothing runs until subscribed)"
  - "Both are lazy"
  - "Both are eager"
  - "CompletableFuture is lazy (nothing runs until subscribe); Mono is eager"
  answer: 0
  explanation: |
    `supplyAsync` starts work immediately — CF is eager and one-shot. A `Mono` is
    lazy/cold: defining the pipeline does nothing until a subscriber arrives, and
    it can be re-subscribed. Reactive types also support backpressure and 0..N
    values.
  ref: "concepts.md#comparison-to-reactive-streams"

- id: completablefuture-async-026
  difficulty: intermediate
  tags: [reactive, flow, versions]
  question: |
    The JDK's built-in Reactive Streams interfaces (`java.util.concurrent.Flow`
    with `Publisher`, `Subscriber`, `Subscription`, `Processor`) were added in:
  options:
  - "Java 8"
  - "Java 9"
  - "Java 14"
  - "They are not in the JDK; only in Reactor/RxJava"
  answer: 1
  explanation: |
    The `Flow` API (matching the Reactive Streams spec) arrived in Java 9. Note the
    JDK ships only the *interfaces* — no full implementation — so you still use
    Reactor or RxJava for operators and an actual runtime.
  ref: "concepts.md#comparison-to-reactive-streams"

- id: completablefuture-async-027
  difficulty: intermediate
  tags: [virtual-threads, executor]
  question: |
    Which executor (JDK 21) is well suited to run blocking `CompletableFuture`
    stages cheaply, one lightweight thread per task?
  options:
  - "Executors.newSingleThreadExecutor()"
  - "Executors.newFixedThreadPool(4)"
  - "Executors.newVirtualThreadPerTaskExecutor()"
  - "ForkJoinPool.commonPool()"
  answer: 2
  explanation: |
    `Executors.newVirtualThreadPerTaskExecutor()` (final in JDK 21) creates a new
    virtual thread per task. Because blocking a virtual thread is cheap (it unmounts
    from its carrier), it is ideal for blocking I/O work handed to CF's `...Async`
    methods.
  ref: "concepts.md#comparison-to-virtual-threads"

- id: completablefuture-async-028
  difficulty: intermediate
  tags: [threading, custom-executor, blocking-io]
  question: |
    Why should blocking I/O work generally NOT be submitted to the default common
    ForkJoinPool?
  options:
  - "The common pool runs tasks on the main thread"
  - "Blocking tasks are automatically moved to a new pool"
  - "The common pool refuses blocking tasks and throws"
  - "The common pool is small (≈ availableProcessors - 1) and shared JVM-wide (also by parallel streams); blocking its few workers can stall unrelated work"
  answer: 3
  explanation: |
    The common pool defaults to `availableProcessors() - 1` workers and is shared
    by parallel streams and other CF work across the JVM. Blocking those few
    threads starves everything relying on the pool. Use a dedicated, right-sized
    executor for blocking work.
  ref: "concepts.md#common-forkjoinpool-vs-a-custom-executor"

- id: completablefuture-async-029
  difficulty: intermediate
  tags: [creation, getnow]
  question: |
    What does `getNow(fallback)` do?
  options:
  - "Returns the value if the future is already complete, otherwise returns the fallback immediately without blocking"
  - "Cancels the future and returns fallback"
  - "Throws if the future is not yet complete"
  - "Blocks until the result is available, then returns it"
  answer: 0
  explanation: |
    `getNow(valueIfAbsent)` is non-blocking: it returns the completed value if
    ready, else the supplied fallback right away. Handy for "use it if it's ready,
    else a default" without stalling the thread.
  ref: "concepts.md#blocking-pitfalls-with-join-and-get"

- id: completablefuture-async-030
  difficulty: intermediate
  tags: [chaining, thenaccept, thenrun]
  question: |
    What is the difference between `thenAccept` and `thenRun`?
  options:
  - "thenAccept ignores the value; thenRun receives it"
  - "thenAccept takes a Consumer<T> (receives the value) and returns CF<Void>; thenRun takes a Runnable (ignores the value) and returns CF<Void>"
  - "Both return CF<T>"
  - "thenRun can transform the value; thenAccept cannot"
  answer: 1
  explanation: |
    `thenAccept` consumes the value (`Consumer<T>`) and returns
    `CompletableFuture<Void>`; `thenRun` ignores the value entirely
    (`Runnable`) and also returns `CompletableFuture<Void>`. Neither produces a
    new value.
  ref: "concepts.md#thenapply-vs-thencompose-vs-thencombine"

- id: completablefuture-async-031
  difficulty: advanced
  tags: [cancellation, gotcha]
  question: |
    What does `cf.cancel(true)` actually do to a `CompletableFuture` whose
    supplier is currently running on a thread?
  options:
  - "Removes the task from the executor queue and guarantees it never runs"
  - "Interrupts the running thread and stops the computation immediately"
  - "Completes the future exceptionally with CancellationException, but does NOT interrupt the running computation (the mayInterruptIfRunning flag is effectively ignored)"
  - "Blocks until the computation finishes, then discards the result"
  answer: 2
  explanation: |
    Unlike `FutureTask`, `CompletableFuture.cancel(true)` does not interrupt the
    running thread — `mayInterruptIfRunning` is effectively ignored. It just
    completes the future exceptionally with `CancellationException`; the underlying
    computation continues to run. This trips up people migrating from `Future`.
  ref: "concepts.md#composing-async-pipelines"

- id: completablefuture-async-032
  difficulty: advanced
  tags: [exception, wrapping, completionexception]
  question: |
    Inside `exceptionally(ex -> ...)` on a stage that failed because its supplier
    threw `new IllegalStateException("x")`, what is the runtime type of `ex`, and
    how do you reach the original?
  options:
  - "ex is an ExecutionException; call ex.getCause()"
  - "ex is always a RuntimeException with no cause"
  - "ex is the IllegalStateException directly"
  - "ex is typically a CompletionException wrapping the cause; call ex.getCause() to get the IllegalStateException"
  answer: 3
  explanation: |
    When an exception propagates through the dependency chain, CF wraps it in a
    `CompletionException`. So `ex` is usually a `CompletionException` and you call
    `ex.getCause()` to inspect the real `IllegalStateException`. (`ExecutionException`
    is what `get()` throws, not what these callbacks receive.)
  ref: "concepts.md#exception-handling-with-exceptionally-handle-and-whencomplete"

- id: completablefuture-async-033
  difficulty: advanced
  tags: [allof, failure, code-analysis]
  question: |
    Given `CompletableFuture<Void> all = CompletableFuture.allOf(a, b, c);` where
    `b` completes exceptionally but `a` and `c` succeed, what happens?
  options:
  - "all completes exceptionally with b's failure; a and c still finish running (they are not cancelled)"
  - "a and c are cancelled as soon as b fails"
  - "all blocks forever"
  - "all completes normally; b's failure is swallowed"
  answer: 0
  explanation: |
    If any input to `allOf` fails, the `allOf` future completes exceptionally. The
    other futures are not cancelled — they keep running to completion. Calling
    `b.join()` would rethrow b's cause; `a.join()`/`c.join()` return their values.
  ref: "concepts.md#combining-futures-with-allof-and-anyof"

- id: completablefuture-async-034
  difficulty: advanced
  tags: [threading, common-pool, deadlock]
  question: |
    On a container reporting a single available processor, why can a
    `CompletableFuture` chain that blocks with `join()` on a common-pool thread
    deadlock?
  options:
  - "Because join() is not thread-safe"
  - "Because the common pool has parallelism 1; the blocking task occupies the only worker while waiting on another task that also needs that worker to make progress"
  - "Because join() always spawns a new thread"
  - "Because single-CPU JVMs disable the common pool"
  answer: 1
  explanation: |
    Common-pool parallelism defaults to `availableProcessors() - 1`; on a 1-CPU box
    that is effectively 1 (or very small). A task that blocks (`join`) on a
    common-pool worker while the awaited task also needs a common-pool worker can
    starve and deadlock. This is a real cloud/container footgun — use dedicated
    executors and avoid blocking in the pipeline.
  ref: "concepts.md#blocking-pitfalls-with-join-and-get"

- id: completablefuture-async-035
  difficulty: advanced
  tags: [creation, daemon-threads, code-analysis]
  question: |
    What is the likely observable behavior of this program?

    ```java
    public static void main(String[] args) {
        CompletableFuture.supplyAsync(() -> {
            sleep(500);
            return "result";
        }).thenAccept(System.out::println);
        // main returns here
    }
    ```
  options:
  - "It deadlocks"
  - "It reliably prints \"result\" after 500ms"
  - "It may print nothing and exit, because common ForkJoinPool threads are daemon threads that don't keep the JVM alive"
  - "It throws IllegalStateException"
  answer: 2
  explanation: |
    The common pool's worker threads are daemon threads. If `main` returns before
    the 500ms task finishes, the JVM can shut down and "result" is never printed.
    Blocking on the future (`join`) or using non-daemon threads would keep the JVM
    alive.
  ref: "concepts.md#common-forkjoinpool-vs-a-custom-executor"

- id: completablefuture-async-036
  difficulty: advanced
  tags: [threading, hijacked-thread, non-async]
  question: |
    A `CompletableFuture` is completed by calling `promise.complete(x)` from a
    Netty I/O thread. A downstream `thenApply(fn)` (non-async) does heavy blocking
    work. What is the risk?
  options:
  - "fn never runs because complete() doesn't trigger callbacks"
  - "fn runs on the main thread"
  - "fn runs on the common pool, so no risk"
  - "fn runs on the Netty I/O thread that called complete(), so blocking there can starve the I/O event loop"
  answer: 3
  explanation: |
    Non-async callbacks run on whichever thread completed the stage — here the
    Netty I/O thread that called `complete()`. Blocking there starves the event
    loop. Use `thenApplyAsync(fn, dedicatedExecutor)` to move the work off the I/O
    thread.
  ref: "concepts.md#async-vs-non-async-variants-and-callback-threads"

- id: completablefuture-async-037
  difficulty: advanced
  tags: [structured-concurrency, versions]
  question: |
    Regarding structured concurrency (`StructuredTaskScope`) in JDK 21, which
    statement is accurate?
  options:
  - "It was still a preview/incubating API in JDK 21, not final"
  - "It was removed in JDK 21"
  - "It has been final since JDK 19"
  - "It was finalized (made permanent) in JDK 21 alongside virtual threads"
  answer: 0
  explanation: |
    While virtual threads (JEP 444) were finalized in JDK 21, structured
    concurrency (JEP 453) remained a *preview* API in 21 — it was not finalized in
    that release. Be careful to distinguish the two on interviews.
  ref: "concepts.md#comparison-to-virtual-threads"

- id: completablefuture-async-038
  difficulty: advanced
  tags: [exception, whencomplete, code-analysis]
  question: |
    What does this print?

    ```java
    CompletableFuture.supplyAsync(() -> { throw new RuntimeException("fail"); })
        .whenComplete((v, ex) -> System.out.println("observed: " + (ex != null)))
        .thenApply(v -> "next")
        .exceptionally(ex -> "recovered: " + ex.getClass().getSimpleName());
    ```

    Assume the final stage's value is then printed with join()/println.
  options:
  - "observed: true, then value \"next\""
  - "observed: true, then value \"recovered: CompletionException\""
  - "observed: false, then value \"next\""
  - "Nothing prints; it throws"
  answer: 1
  explanation: |
    `whenComplete` observes the failure (prints "observed: true") but does NOT
    consume it, so the stage still completes exceptionally. `thenApply` is skipped,
    and `exceptionally` receives the wrapping `CompletionException`, producing
    "recovered: CompletionException".
  ref: "concepts.md#exception-handling-with-exceptionally-handle-and-whencomplete"

- id: completablefuture-async-039
  difficulty: advanced
  tags: [timeout, versions, ortimeout]
  question: |
    What is the difference between `orTimeout(2, SECONDS)` and
    `completeOnTimeout(fallback, 2, SECONDS)` (both Java 9)?
  options:
  - "Both cancel the underlying supplier"
  - "orTimeout completes with a fallback value; completeOnTimeout throws"
  - "orTimeout completes the future exceptionally with TimeoutException if not done in time; completeOnTimeout completes it with a fallback VALUE"
  - "They are identical"
  answer: 2
  explanation: |
    `orTimeout` fails the future with a `TimeoutException` on expiry (you then
    handle it), whereas `completeOnTimeout` supplies a default *value* so the chain
    proceeds normally. Neither interrupts/cancels the underlying computation.
  ref: "concepts.md#composing-async-pipelines"

- id: completablefuture-async-040
  difficulty: advanced
  tags: [pipeline, thencompose, thencombine, design]
  question: |
    In pipeline design, when should you prefer `thenCompose` over `allOf` /
    `thenCombine`?
  options:
  - "When you want to ignore all results"
  - "thenCompose and thenCombine are interchangeable in all cases"
  - "When the calls are independent and should run in parallel"
  - "When one async call DEPENDS on the result of a previous async call (sequential dependency)"
  answer: 3
  explanation: |
    `thenCompose` is for *dependent* sequential async calls (the second needs the
    first's result). `thenCombine`/`allOf` are for *independent* calls that run in
    parallel and fan in. Choosing correctly affects both correctness and latency.
  ref: "concepts.md#composing-async-pipelines"

- id: completablefuture-async-041
  difficulty: advanced
  tags: [virtual-threads, pinning]
  question: |
    Before JDK 24, what commonly caused a virtual thread to "pin" its carrier
    platform thread, harming scalability?
  options:
  - "Blocking inside a synchronized block/method (and native/JNI calls)"
  - "Calling Thread.sleep"
  - "Performing socket I/O"
  - "Using a ReentrantLock"
  answer: 0
  explanation: |
    Blocking while holding a `synchronized` monitor (and native/JNI frames) pinned
    the carrier so it couldn't be reused. The guidance was to prefer
    `ReentrantLock`. JDK 24 (JEP 491) largely removed the `synchronized` pinning
    limitation. Ordinary blocking I/O and `sleep` unmount the virtual thread fine.
  ref: "concepts.md#comparison-to-virtual-threads"

- id: completablefuture-async-042
  difficulty: advanced
  tags: [anyof, first-success, design]
  question: |
    You want the fastest SUCCESSFUL result among three redundant mirrors, ignoring
    ones that fail. Why is a plain `anyOf(m1, m2, m3)` insufficient?
  options:
  - "anyOf only accepts two arguments"
  - "anyOf completes on the first to SETTLE, so if the fastest one fails, anyOf fails too instead of waiting for a slower success"
  - "anyOf always waits for all three"
  - "anyOf returns CompletableFuture<Void> with no value"
  answer: 1
  explanation: |
    `anyOf` is first-to-settle, so a fast failure propagates and you never get the
    slower successes. To get first-*success*, you typically make each mirror's
    failure not "settle" the combined future (e.g., via `handle`/`exceptionally`
    that defers, or a custom combinator).
  ref: "concepts.md#combining-futures-with-allof-and-anyof"

- id: completablefuture-async-043
  difficulty: advanced
  tags: [chaining, thencompose, sequential]
  question: |
    Which statement about `thenCombine` vs `thenCompose` execution is correct?
  options:
  - "Both always run everything in parallel"
  - "thenCombine runs the two sources sequentially; thenCompose runs them in parallel"
  - "thenCombine runs its two source futures concurrently and merges results; thenCompose is sequential — the second future's work starts only after the first completes"
  - "Both always run everything sequentially"
  answer: 2
  explanation: |
    `thenCombine` takes two already-existing futures that typically run concurrently
    and merges their results once both are done. `thenCompose` is inherently
    sequential: the function that produces the second future is only invoked after
    the first completes and hands over its value.
  ref: "concepts.md#thenapply-vs-thencompose-vs-thencombine"

- id: completablefuture-async-044
  difficulty: advanced
  tags: [reactive, backpressure, cardinality]
  question: |
    Which capability do Reactive Streams (Reactor/RxJava/Flow) provide that
    `CompletableFuture` fundamentally does not?
  options:
  - "Exception handling"
  - "Timeouts"
  - "Running work on a thread pool"
  - "Backpressure and handling 0..N values over time (streams)"
  answer: 3
  explanation: |
    `CompletableFuture` represents exactly one value (or void) and has no
    backpressure. Reactive Streams model 0..N values over time with backpressure —
    a consumer can signal how many items it can handle. Both do thread pools,
    exceptions, and timeouts.
  ref: "concepts.md#comparison-to-reactive-streams"

- id: completablefuture-async-045
  difficulty: advanced
  tags: [creation, supplyasync, exception-timing]
  question: |
    A `Supplier` passed to `supplyAsync` throws immediately. When/where does the
    caller observe that exception?
  options:
  - "It does not propagate to the supplyAsync caller; the returned future completes exceptionally and the error surfaces on join()/get() or via an exception-handling stage"
  - "It is silently swallowed forever"
  - "It is thrown on the next thenApply's declaration line"
  - "supplyAsync itself throws on the calling thread right away"
  answer: 0
  explanation: |
    `supplyAsync` returns normally; the supplier's exception completes the returned
    future exceptionally. It only surfaces when you `join()`/`get()` or attach
    `handle`/`exceptionally`/`whenComplete`. This decoupling of failure from the
    call site is central to async programming.
  ref: "concepts.md#creating-a-completablefuture"

- id: completablefuture-async-046
  difficulty: expert
  tags: [threading, code-analysis, async-variants]
  question: |
    Consider (single-threaded custom executor `ex`, distinct from the common pool):

    ```java
    CompletableFuture.supplyAsync(() -> "a", ex)     // runs on ex
        .thenApply(s -> s + "b")                     // (1)
        .thenApplyAsync(s -> s + "c")                // (2)
        .thenApplyAsync(s -> s + "d", ex);           // (3)
    ```

    Which thread runs stages (1), (2), and (3) respectively?
  options:
  - "(1) ex, (2) ex, (3) ex"
  - "(1) ex, (2) common ForkJoinPool, (3) ex"
  - "(1) common pool, (2) common pool, (3) common pool"
  - "(1) main, (2) main, (3) ex"
  answer: 1
  explanation: |
    (1) is non-async, so it runs on the thread that completed the upstream stage —
    the `ex` worker. (2) is `...Async` with no executor, so the common ForkJoinPool.
    (3) is `...Async` with `ex`, so `ex`. This tests the three threading rules
    precisely.
  ref: "concepts.md#async-vs-non-async-variants-and-callback-threads"

- id: completablefuture-async-047
  difficulty: expert
  tags: [exception, handle, code-analysis]
  question: |
    What value does the final future hold?

    ```java
    CompletableFuture<Integer> f = CompletableFuture.supplyAsync(() -> 10)
        .thenApply(x -> x / 0)                 // ArithmeticException
        .handle((v, ex) -> ex != null ? -1 : v)
        .thenApply(x -> x + 100);
    // f.join()
    ```
  options:
  - "-1"
  - "It throws ArithmeticException from join()"
  - "99"
  - "110"
  answer: 2
  explanation: |
    `x / 0` throws `ArithmeticException`, so the stage fails. `handle` runs on the
    failure path and returns -1 (recovering the chain). The next `thenApply` adds
    100 -> 99. `handle`'s ability to turn an error into a normal value is what makes
    this succeed.
  ref: "concepts.md#exception-handling-with-exceptionally-handle-and-whencomplete"

- id: completablefuture-async-048
  difficulty: expert
  tags: [exception, whencomplete, action-throws]
  question: |
    If the ACTION passed to `whenComplete` itself throws an exception while the
    upstream stage completed SUCCESSFULLY with value `v`, what does the returned
    stage do?
  options:
  - "Completes with null"
  - "Retries the action"
  - "Completes normally with v; the action's exception is ignored"
  - "Completes exceptionally with the exception thrown by the whenComplete action"
  answer: 3
  explanation: |
    When upstream succeeded but the `whenComplete` action throws, the returned
    stage completes exceptionally with that thrown exception. (If the upstream had
    *failed* and the action also throws, the original upstream exception is the one
    that propagates as primary.) `whenComplete` normally passes the upstream result
    through unchanged only when its action does not throw.
  ref: "concepts.md#exception-handling-with-exceptionally-handle-and-whencomplete"

- id: completablefuture-async-049
  difficulty: expert
  tags: [blocking, deadlock, code-analysis]
  question: |
    Why is embedding `join()` inside a `thenApply` lambda (as below) an
    anti-pattern that risks deadlock on a bounded pool?

    ```java
    cfA.thenApply(a -> {
        String b = cfB.join();   // block inside the callback
        return a + b;
    });
    ```
  options:
  - "The callback thread is held blocked waiting on cfB; if cfB needs the same bounded pool to complete, no thread is free to run it — deadlock"
  - "thenApply cannot return a String"
  - "It compiles but always returns null"
  - "join() cannot be called inside a lambda"
  answer: 0
  explanation: |
    Blocking (`join`) inside a callback occupies a pool worker while waiting for
    another future. If that future's completion depends on the same limited pool,
    you can exhaust the pool and deadlock. The composable fix is
    `cfA.thenCombine(cfB, (a, b) -> a + b)` — no blocking.
  ref: "concepts.md#blocking-pitfalls-with-join-and-get"

- id: completablefuture-async-050
  difficulty: expert
  tags: [design, virtual-threads, old-vs-new]
  question: |
    A senior engineer argues that virtual threads (JDK 21) make `CompletableFuture`
    entirely obsolete. What is the most accurate rebuttal?
  options:
  - "Correct — CompletableFuture should never be used after JDK 21"
  - "Virtual threads make blocking sequential code scalable, but CompletableFuture still excels at COMBINING independent async results (allOf/thenCombine) and adapting callback-style APIs; the two are complementary"
  - "Virtual threads only work with reactive streams, not plain code"
  - "CompletableFuture is faster than virtual threads for CPU-bound work"
  answer: 1
  explanation: |
    Virtual threads eliminate much callback-style code by making blocking cheap, but
    CF remains valuable for fan-out/fan-in composition (`allOf`, `thenCombine`,
    `anyOf`) and for adapting callback APIs into futures. They are complementary —
    you can even run CF stages on a virtual-thread executor.
  ref: "concepts.md#comparison-to-virtual-threads"

- id: completablefuture-async-051
  difficulty: expert
  tags: [allof, code-analysis, results]
  question: |
    What does this print?

    ```java
    CompletableFuture<Integer> a = CompletableFuture.completedFuture(1);
    CompletableFuture<Integer> b = CompletableFuture.completedFuture(2);
    CompletableFuture<Integer> c = CompletableFuture.completedFuture(3);
    int sum = CompletableFuture.allOf(a, b, c)
        .thenApply(v -> a.join() + b.join() + c.join())
        .join();
    System.out.println(sum);
    ```
  options:
  - "It blocks forever"
  - "0"
  - "6"
  - "It throws because allOf returns Void"
  answer: 2
  explanation: |
    `allOf` completes once all three (already-complete) futures are done. Inside the
    `thenApply`, joining each returns 1, 2, 3 -> sum 6. The joins don't block since
    each is already complete. `allOf` returning `Void` is exactly why you re-join
    the originals to gather results.
  ref: "concepts.md#combining-futures-with-allof-and-anyof"

- id: completablefuture-async-052
  difficulty: expert
  tags: [exceptionallycompose, versions]
  question: |
    Which Java 12 method lets you recover from a failure by supplying ANOTHER
    `CompletionStage` (i.e., a flatMap-style recovery on the error path)?
  options:
  - "handleAsync"
  - "whenComplete"
  - "exceptionally"
  - "exceptionallyCompose"
  answer: 3
  explanation: |
    `exceptionallyCompose` (Java 12) recovers on the failure path by returning a
    new `CompletionStage` (like flatMap for errors), with an async variant
    `exceptionallyComposeAsync`. `exceptionally` (Java 8) only returns a plain
    value, not a stage.
  ref: "concepts.md#exception-handling-with-exceptionally-handle-and-whencomplete"

- id: completablefuture-async-053
  difficulty: expert
  tags: [common-pool, parallelism, tuning]
  question: |
    How is the parallelism of `ForkJoinPool.commonPool()` determined by default,
    and how can it be overridden globally?
  options:
  - "Defaults to availableProcessors() - 1; overridable via the system property java.util.concurrent.ForkJoinPool.common.parallelism"
  - "Defaults to 1; cannot be changed"
  - "Equals the number of CompletableFutures created; auto-scales"
  - "Fixed at 10; overridden via a constructor argument"
  answer: 0
  explanation: |
    The common pool's default parallelism is `Runtime.availableProcessors() - 1`.
    It can be tuned via the system property
    `java.util.concurrent.ForkJoinPool.common.parallelism`, but changing a JVM-wide
    global is fragile — prefer explicit executors for isolation.
  ref: "concepts.md#common-forkjoinpool-vs-a-custom-executor"

- id: completablefuture-async-054
  difficulty: expert
  tags: [code-analysis, anyof, cast]
  question: |
    Given `Object first = CompletableFuture.anyOf(cfInt, cfStr).join();` where
    `cfInt` is `CompletableFuture<Integer>` and `cfStr` is
    `CompletableFuture<String>`, why is the result typed `Object`?
  options:
  - "A bug in the JDK"
  - "anyOf accepts heterogeneous futures and cannot know which completes first, so it returns CompletableFuture<Object> holding whichever value settled first"
  - "Because join() erases all generics to Object"
  - "Because Integer and String share no common supertype"
  answer: 1
  explanation: |
    `anyOf` can be given futures of different types and completes with whichever
    finishes first, so its declared result is `CompletableFuture<Object>`. You
    usually cast based on which mirror/source you expect. (`allOf` sidesteps this by
    returning `Void`.)
  ref: "concepts.md#combining-futures-with-allof-and-anyof"

- id: completablefuture-async-055
  difficulty: expert
  tags: [design, error-funnel, pipeline]
  question: |
    In a long CF pipeline, why is placing a single `exceptionally`/`handle` near the
    END often preferred over scattering handlers after every stage?
  options:
  - "Because it forces all stages onto the common pool"
  - "Because exceptions cannot be caught mid-pipeline"
  - "Because failures short-circuit downstream transformation stages until a handler intervenes, so one terminal funnel cleanly catches errors from any earlier stage"
  - "Because handle is faster than exceptionally"
  answer: 2
  explanation: |
    A failure propagates (short-circuits) through subsequent `thenApply`/`thenCompose`
    stages until an exception handler is reached. A single terminal
    `exceptionally`/`handle` therefore catches an error originating anywhere upstream,
    keeping the pipeline readable — analogous to one outer try/catch.
  ref: "concepts.md#composing-async-pipelines"

- id: completablefuture-async-056
  difficulty: expert
  tags: [completeexceptionally, code-analysis]
  question: |
    What is printed?

    ```java
    CompletableFuture<String> p = new CompletableFuture<>();
    p.completeExceptionally(new IllegalArgumentException("bad"));
    String r = p.exceptionally(ex -> "caught:" + ex.getClass().getSimpleName())
                 .join();
    System.out.println(r);
    ```
  options:
  - "caught:CompletionException"
  - "It throws IllegalArgumentException from join()"
  - "bad"
  - "caught:IllegalArgumentException"
  answer: 3
  explanation: |
    When a future is completed directly via `completeExceptionally(e)`, the
    exception delivered to a directly-attached `exceptionally` on that same future is
    the original `IllegalArgumentException` (not yet wrapped), so it prints
    "caught:IllegalArgumentException". Wrapping in `CompletionException` occurs when
    the error propagates across dependent stages.
  ref: "concepts.md#exception-handling-with-exceptionally-handle-and-whencomplete"

- id: completablefuture-async-057
  difficulty: intermediate
  tags: [reactive, reusability]
  question: |
    Which statement about reusability is correct?
  options:
  - "A CompletableFuture is one-shot (single result), while a reactive publisher (Mono/Flux) can typically be subscribed multiple times, re-running its work"
  - "Both are one-shot"
  - "Both can be re-subscribed"
  - "A CompletableFuture can be re-run many times by re-subscribing"
  answer: 0
  explanation: |
    A `CompletableFuture` holds a single result and cannot be "re-run" — it's
    one-shot. A cold reactive publisher can be subscribed multiple times, each
    subscription re-triggering the underlying work. This ties to eager (CF) vs
    lazy (reactive) semantics.
  ref: "concepts.md#comparison-to-reactive-streams"

- id: completablefuture-async-058
  difficulty: intermediate
  tags: [creation, delayedexecutor, versions]
  question: |
    What does `CompletableFuture.delayedExecutor(1, TimeUnit.SECONDS)` (Java 9)
    return?
  options:
  - "A CompletableFuture that completes after 1 second"
  - "An Executor that runs submitted tasks after a 1-second delay"
  - "A ScheduledFuture"
  - "The number of milliseconds until execution"
  answer: 1
  explanation: |
    `delayedExecutor` returns an `Executor` that defers execution of submitted tasks
    by the given delay. It's often combined with `supplyAsync`/`completeAsync` to
    implement delays or timeouts without a separate scheduler.
  ref: "concepts.md#creating-a-completablefuture"
