topic: Java Platform Module System (JPMS)
domain: java-jvm
topic_slug: java-module-system-jpms
version: 1
questions:
- id: java-module-system-jpms-001
  difficulty: beginner
  tags:
  - history
  - project-jigsaw
  - versions
  question: |
    In which Java release was the Java Platform Module System (JPMS),
    delivered by Project Jigsaw, first shipped as a final feature?
  options:
  - Java 9
  - Java 8
  - Java 7
  - Java 11
  answer: 0
  explanation: |
    JPMS shipped in Java 9 (2017) via Project Jigsaw, primarily JEP 261 (Module System),
    along with JEP 200 (Modular JDK), JEP 220 (Modular Run-Time Images), and others. Java 8
    brought lambdas/streams but no modules. Java 11 is a later LTS that inherited the module
    system; it did not introduce it.
  ref: concepts.md#requires-and-module-readability
- id: java-module-system-jpms-002
  difficulty: beginner
  tags:
  - module-info
  - descriptor
  question: |
    What is the name of the special source file that declares a module?
  options:
  - package-info.java
  - module-info.java
  - MANIFEST.MF
  - module.properties
  answer: 1
  explanation: |
    A module is declared in module-info.java at the module's source root, which compiles to
    module-info.class. package-info.java holds package-level annotations/docs, MANIFEST.MF is
    a JAR manifest, and there is no module.properties in JPMS.
  ref: concepts.md#requires-and-module-readability
- id: java-module-system-jpms-003
  difficulty: beginner
  tags:
  - requires
  - dependencies
  question: |
    Which directive expresses that a module depends on (reads) another module?
  options:
  - exports
  - opens
  - requires
  - provides
  answer: 2
  explanation: |
    requires declares a dependency (readability edge) on another module. exports and opens
    make packages available to others; provides declares a service implementation. None of
    those express an inbound dependency.
  ref: concepts.md#requires-and-module-readability
- id: java-module-system-jpms-004
  difficulty: beginner
  tags:
  - exports
  - encapsulation
  question: |
    A module contains a public class in a package that is NOT listed in any `exports`
    directive. From another module (which requires this one), that public class is:
  options:
  - Accessible, because it is declared public
  - A compile error to even declare
  - Accessible only via reflection with setAccessible(true)
  - Inaccessible, because its package is not exported
  answer: 3
  explanation: |
    JPMS adds a dimension to access control: a public type is only accessible to other modules
    if its package is exported. This is the "public but not accessible" rule — strong
    encapsulation. Declaring it public is legal; it just isn't visible outside the module.
  ref: concepts.md#exports-and-strong-encapsulation
- id: java-module-system-jpms-005
  difficulty: beginner
  tags:
  - java-base
  - implicit
  question: |
    Which module is implicitly required by every other module without being written explicitly?
  options:
  - java.base
  - java.lang
  - java.se
  - jdk.unsupported
  answer: 0
  explanation: |
    java.base (containing java.lang, java.util, etc.) is implicitly read by every module, like
    classes implicitly extend Object. java.lang is a package, not a module. java.se is an
    aggregator of the full SE API, not implicit. jdk.unsupported holds sun.misc.Unsafe and is
    not implicit.
  ref: concepts.md#classpath-versus-module-path
- id: java-module-system-jpms-006
  difficulty: beginner
  tags:
  - classpath
  - module-path
  - cli
  question: |
    Which JVM/compiler option specifies the module path (as opposed to the classpath)?
  options:
  - -cp / --class-path
  - -p / --module-path
  - --add-modules
  - -jar
  answer: 1
  explanation: |
    -p / --module-path specifies the module path, where JARs are resolved as modules.
    -cp/--class-path is the legacy classpath (everything becomes the unnamed module).
    --add-modules adds root modules to resolution but is not the path itself; -jar runs a JAR.
  ref: concepts.md#classpath-versus-module-path
- id: java-module-system-jpms-007
  difficulty: beginner
  tags:
  - unnamed-module
  - classpath
  question: |
    Code loaded from the classpath in Java 9+ belongs to which module?
  options:
  - The java.base module
  - A new automatic module per JAR
  - The unnamed module
  - No module at all; classpath code is not part of any module system
  answer: 2
  explanation: |
    All classpath code is placed into the single unnamed module, which reads every module and
    exports all its packages, preserving legacy behavior. Automatic modules arise only for
    plain JARs on the module path, not the classpath.
  ref: concepts.md#named-automatic-and-unnamed-modules
- id: java-module-system-jpms-008
  difficulty: beginner
  tags:
  - jlink
  - runtime-image
  question: |
    What does the `jlink` tool produce?
  options:
  - A fat/uber JAR bundling all dependencies
  - A Maven BOM listing module versions
  - A native machine-code executable with no JVM
  - A custom, minimal runtime image containing only needed modules plus a trimmed JVM
  answer: 3
  explanation: |
    jlink (JEP 282, Java 9) assembles selected modules and their transitive dependencies into a
    self-contained runtime image with a stripped-down JVM. It is not an uber JAR, not an
    AOT-compiled native binary (that is GraalVM native-image), and not a build descriptor.
  ref: concepts.md#jlink-and-custom-runtime-images
- id: java-module-system-jpms-009
  difficulty: beginner
  tags:
  - opens
  - reflection
  question: |
    Which directive grants other code deep reflective access (including setAccessible on
    private members) to a package at runtime?
  options:
  - opens
  - requires transitive
  - exports
  - uses
  answer: 0
  explanation: |
    opens grants deep reflection (setAccessible on private members) at runtime — what frameworks
    like Hibernate and Jackson need. exports grants compile/runtime access to public types only,
    not deep reflection. requires transitive is about readability; uses declares a service
    consumer.
  ref: concepts.md#exports-and-strong-encapsulation
- id: java-module-system-jpms-010
  difficulty: beginner
  tags:
  - services
  - provides
  question: |
    Which pair of directives implements the ServiceLoader provider/consumer relationship in a
    module declaration?
  options:
  - exports and opens
  - uses and provides ... with
  - requires and requires transitive
  - reads and writes
  answer: 1
  explanation: |
    A consumer declares `uses ServiceType;` and a provider declares
    `provides ServiceType with Impl;`. exports/opens control package visibility; requires
    controls readability; "reads/writes" are not JPMS directives.
  ref: concepts.md#services-with-uses-and-provides
- id: java-module-system-jpms-011
  difficulty: beginner
  tags:
  - module-name
  - keywords
  question: |
    Are `module` and `requires` reserved keywords that can no longer be used as identifiers in
    ordinary Java code?
  options:
  - Yes, they became fully reserved keywords in Java 9
  - Yes, but only when the -source 9 flag is set
  - No, they are restricted keywords with special meaning only inside module-info.java
  - No, they were never given any special meaning
  answer: 2
  explanation: |
    module, requires, exports, opens, uses, provides, to, with, transitive are RESTRICTED
    keywords: they have special meaning only within a module declaration. Ordinary code can
    still use `module` as a variable name, preserving backward compatibility.
  ref: concepts.md#requires-and-module-readability
- id: java-module-system-jpms-012
  difficulty: beginner
  tags:
  - encapsulation
  - exception
  question: |
    Which exception is thrown when reflective code calls setAccessible(true) on a member of a
    package that is not open to the caller?
  options:
  - IllegalAccessException
  - SecurityException
  - NoSuchFieldException
  - InaccessibleObjectException
  answer: 3
  explanation: |
    InaccessibleObjectException (a RuntimeException introduced in Java 9) is thrown by
    setAccessible when the target package is not open to the caller module. IllegalAccessException
    is thrown at invocation for normal access-check failures; NoSuchFieldException is for missing
    members; SecurityException relates to the (now removed) SecurityManager.
  ref: concepts.md#exports-and-strong-encapsulation
- id: java-module-system-jpms-013
  difficulty: intermediate
  tags:
  - readability
  - accessibility
  - rules
  question: |
    For code in module A to access a public type T in package P of module B, ALL of the
    following must hold EXCEPT which one?
  options:
  - P must also be opened by B
  - B exports P (unqualified, or qualified to A)
  - T (and the accessed member) is public/protected
  - A reads B (via requires, directly or through implied readability)
  answer: 0
  explanation: |
    Normal (non-reflective) accessibility requires readability + the package being exported +
    the member being public/protected. `opens` is only needed for deep reflection, not for
    ordinary compile/runtime access, so it is NOT a requirement here.
  ref: concepts.md#requires-and-module-readability
- id: java-module-system-jpms-014
  difficulty: intermediate
  tags:
  - requires-transitive
  - implied-readability
  question: |
    Module `api` declares `requires transitive model;`. Module `web` declares `requires api;`
    but does NOT mention `model`. Can `web` use public exported types from `model`?
  options:
  - No; web must add `requires model;` explicitly
  - Yes; implied readability from `requires transitive` lets web read model automatically
  - Only if model is an automatic module
  - Only at runtime, not at compile time
  answer: 1
  explanation: |
    `requires transitive model` in api establishes implied readability: any module that reads
    api also reads model, at both compile and runtime. This is exactly how aggregator modules
    (like java.se) work. web does not need to name model itself.
  ref: concepts.md#requires-and-module-readability
- id: java-module-system-jpms-015
  difficulty: intermediate
  tags:
  - exports-vs-opens
  - comparison
  question: |
    A JPA entity module needs Hibernate (in another module) to set private fields via
    reflection, but does NOT want the entity package usable at compile time by other modules.
    Which directive is correct?
  options:
  - exports com.acme.entity;
  - exports com.acme.entity to hibernate.core;
  - opens com.acme.entity to org.hibernate.orm.core;
  - requires transitive com.acme.entity;
  answer: 2
  explanation: |
    opens (here qualified to the Hibernate module) grants deep reflective access at runtime
    without granting compile-time access to the package — exactly the requirement. exports would
    expose the package for compile-time use AND still would not permit deep reflection into
    private members. requires transitive is nonsensical here (a module cannot require itself).
  ref: concepts.md#exports-and-strong-encapsulation
- id: java-module-system-jpms-016
  difficulty: intermediate
  tags:
  - automatic-module
  - naming
  question: |
    A plain JAR named `commons-lang3-3.12.0.jar` (no module-info, no Automatic-Module-Name
    manifest entry) is placed on the module path. What is its module name?
  options:
  - commons-lang3-3.12.0
  - commons-lang3 (with the hyphen preserved)
  - org.apache.commons.lang3
  - commons.lang3
  answer: 3
  explanation: |
    Without an Automatic-Module-Name manifest entry, the name is derived from the file name:
    the version suffix is stripped and non-alphanumeric runs are replaced by dots, yielding
    commons.lang3. It does not become the JAR's base package (org.apache.commons.lang3), keep
    the version, or retain hyphens (hyphens are illegal in module names).
  ref: concepts.md#named-automatic-and-unnamed-modules
- id: java-module-system-jpms-017
  difficulty: intermediate
  tags:
  - automatic-module
  - reads
  question: |
    Which statement about automatic modules is TRUE?
  options:
  - They read all other resolved modules AND the unnamed module, and export all their packages
  - They export only the packages named in a module-info.class
  - They cannot be required by explicit modules
  - They can be linked into a runtime image with jlink
  answer: 0
  explanation: |
    An automatic module (a plain JAR on the module path) reads every other module including the
    unnamed module, and exports/opens all of its packages. It CAN be required by explicit modules
    (that is the whole point of the migration bridge). It has no module-info, and jlink refuses
    to link automatic modules.
  ref: concepts.md#named-automatic-and-unnamed-modules
- id: java-module-system-jpms-018
  difficulty: intermediate
  tags:
  - unnamed-module
  - explicit-module
  question: |
    Why can an explicit (named) module NOT declare a dependency on a plain library that sits on
    the classpath?
  options:
  - Because classpath JARs are always encrypted
  - Because classpath code lives in the unnamed module, which has no name to `requires`
  - Because the classpath is disabled once any module is present
  - Because explicit modules can only require java.* modules
  answer: 1
  explanation: |
    Classpath code is in the unnamed module, and the unnamed module has no name — so nothing can
    `requires` it. To be required by an explicit module, a library must move to the module path
    (becoming an automatic or explicit module). The classpath is not disabled, and explicit
    modules may require any named module.
  ref: concepts.md#named-automatic-and-unnamed-modules
- id: java-module-system-jpms-019
  difficulty: intermediate
  tags:
  - split-packages
  - resolution
  question: |
    Two JARs on the module path both define classes in package `com.acme.util`. What happens?
  options:
  - The JVM merges the packages as it did on the classpath
  - Only the first JAR's classes are loaded, the rest silently ignored
  - A split package error occurs; the module path forbids the same package in two modules
  - It compiles fine but throws ClassNotFoundException at runtime
  answer: 2
  explanation: |
    The module system forbids split packages: a package may belong to exactly one module. On the
    module path this is a hard resolution error, whereas the classpath tolerated split packages
    (loading whichever came first). This is a common migration blocker.
  ref: concepts.md#classpath-versus-module-path
- id: java-module-system-jpms-020
  difficulty: intermediate
  tags:
  - services
  - serviceloader
  question: |
    With `uses`/`provides`, does the provider's implementation package need to be exported for
    ServiceLoader to instantiate it?
  options:
  - Yes, the implementation package must be exported
  - Only if the provider uses a static provider() method
  - Yes, and it must also be opened
  - No; ServiceLoader uses a privileged path, so only the service interface must be public/exported
  answer: 3
  explanation: |
    The service interface is public/exported, but the implementation class can live in an
    un-exported package: the module system grants ServiceLoader a privileged path to instantiate
    the provider declared via `provides ... with`. This gives loose coupling with strong
    encapsulation. The static provider() method is an alternative to a public constructor, not a
    requirement for encapsulation.
  ref: concepts.md#services-with-uses-and-provides
- id: java-module-system-jpms-021
  difficulty: intermediate
  tags:
  - jlink
  - constraints
  question: |
    Why can jlink NOT create a runtime image from an application whose dependency tree includes
    automatic modules?
  options:
  - Automatic modules lack a reliable module-info describing exactly what packages they contain
  - Automatic modules are always signed and cannot be repackaged
  - jlink only works on Windows
  - Automatic modules are loaded lazily and jlink cannot see them
  answer: 0
  explanation: |
    jlink requires explicit modules with real module-info.class descriptors so it can reliably
    compute the module graph and packages. Automatic modules have no descriptor, so jlink refuses
    them. Teams use tools like moditect/jdeps to generate descriptors first.
  ref: concepts.md#jlink-and-custom-runtime-images
- id: java-module-system-jpms-022
  difficulty: intermediate
  tags:
  - add-opens
  - launcher
  question: |
    A legacy library needs deep reflective access into `java.lang` but you cannot recompile the
    JDK. Which launcher flag makes it work on JDK 11-16?
  options:
  - --add-reads java.base=ALL-UNNAMED
  - --add-opens java.base/java.lang=ALL-UNNAMED
  - --add-exports java.base/java.lang=ALL-UNNAMED
  - --patch-module java.base=java.lang
  answer: 1
  explanation: |
    --add-opens M/pkg=target opens a package for DEEP REFLECTION at runtime. --add-exports grants
    compile/runtime access to public types but NOT deep reflection into private members.
    --add-reads adds a readability edge only. --patch-module is for injecting classes, not
    granting reflective access.
  ref: concepts.md#exports-and-strong-encapsulation
- id: java-module-system-jpms-023
  difficulty: intermediate
  tags:
  - migration
  - javaee-removal
  - versions
  question: |
    Modules such as java.xml.bind (JAXB), java.activation, java.xml.ws, and java.corba were
    deprecated for removal in Java 9 and then REMOVED from the JDK in which release?
  options:
  - Java 10
  - Java 14
  - Java 11
  - Java 17
  answer: 2
  explanation: |
    JEP 320 removed the Java EE and CORBA modules in Java 11. Since then, apps needing JAXB/JAX-WS
    must add external artifacts (e.g. Jakarta/Glassfish implementations). They were deprecated for
    removal in Java 9, not removed in 10, 14, or 17.
  ref: concepts.md#migration-strategies-and-challenges
- id: java-module-system-jpms-024
  difficulty: intermediate
  tags:
  - automatic-module-name
  - manifest
  question: |
    What is the recommended first step for a library author to make their non-modular JAR
    predictable to modularize against?
  options:
  - Ship an empty module-info.class
  - Publish the JAR only to the module path repository
  - Rename the JAR to remove all hyphens
  - Add an `Automatic-Module-Name` entry to the JAR manifest
  answer: 3
  explanation: |
    Adding Automatic-Module-Name to META-INF/MANIFEST.MF gives the JAR a stable module name as an
    automatic module, so downstream `requires` won't break when the file name changes. It is a
    cheap first step that doesn't require a full module-info. An empty module-info would over-
    encapsulate; renaming is fragile; the repository doesn't set the name.
  ref: concepts.md#named-automatic-and-unnamed-modules
- id: java-module-system-jpms-025
  difficulty: intermediate
  tags:
  - requires-static
  - optional
  question: |
    What does `requires static M;` mean?
  options:
  - M is a compile-time-only dependency, optional (not required) at runtime
  - M is loaded eagerly before any other module
  - M's static members are imported into this module
  - M is required but cannot itself require anything
  answer: 0
  explanation: |
    requires static declares an optional dependency: present at compile time but not mandatory in
    the runtime module graph — commonly used for annotations or code paths that only execute when
    the dependency happens to be present. It says nothing about eager loading, static imports, or
    transitive restrictions.
  ref: concepts.md#requires-and-module-readability
- id: java-module-system-jpms-026
  difficulty: intermediate
  tags:
  - qualified-exports
  question: |
    What does `exports com.acme.internal to com.acme.billing;` achieve?
  options:
  - Exports the package to every module that requires com.acme.billing
  - Exports the package only to the com.acme.billing module (a qualified export)
  - Opens the package for reflection to com.acme.billing
  - Re-exports com.acme.billing's packages
  answer: 1
  explanation: |
    A qualified export makes the package's public types accessible ONLY to the explicitly named
    modules — here just com.acme.billing. It does not cascade to modules that require billing, is
    not the same as `opens` (no deep reflection), and does not re-export another module.
  ref: concepts.md#exports-and-strong-encapsulation
- id: java-module-system-jpms-027
  difficulty: intermediate
  tags:
  - cli
  - launch
  - module-path
  question: |
    Which command launches the class com.acme.Main in module com.acme.app from the `mods`
    directory on the module path?
  options:
  - java -cp mods com.acme.app.Main
  - java -jar mods/com.acme.app.jar --module com.acme.Main
  - java --module-path mods --module com.acme.app/com.acme.Main
  - java --add-modules com.acme.app com.acme.Main
  answer: 2
  explanation: |
    Launching a module main class uses --module-path (-p) plus --module (-m) in the form
    module/mainclass: `java -p mods -m com.acme.app/com.acme.Main`. The -cp form uses the unnamed
    module; -jar ignores the --module syntax; --add-modules only adds roots, it doesn't specify
    the main class.
  ref: concepts.md#classpath-versus-module-path
- id: java-module-system-jpms-028
  difficulty: intermediate
  tags:
  - open-module
  - reflection
  question: |
    What does declaring `open module com.acme.data { ... }` do?
  options:
  - Exports all packages for compile-time use by any module
  - Automatically adds requires for every observable module
  - Disables all encapsulation, making the module identical to classpath code
  - Opens all of the module's packages for deep reflection at runtime, but does not export them
  answer: 3
  explanation: |
    An open module implicitly opens ALL its packages for runtime deep reflection, without
    exporting them for compile-time access. It does not export packages, does not turn the module
    into classpath/unnamed behavior, and does not auto-add requires edges. It is handy for
    reflection-heavy modules while still controlling compile-time API via exports.
  ref: concepts.md#exports-and-strong-encapsulation
- id: java-module-system-jpms-029
  difficulty: intermediate
  tags:
  - jdeps
  - tooling
  question: |
    Which JDK tool analyzes class/module dependencies and can flag uses of internal or removed
    APIs and help generate module descriptors?
  options:
  - jdeps
  - jpackage
  - jlink
  - jshell
  answer: 0
  explanation: |
    jdeps is the dependency analyzer; it reports package/module dependencies, flags uses of
    internal/JDK-internal APIs (e.g. sun.*), and can suggest module descriptors. jlink builds
    runtime images, jpackage builds native installers, and jshell is the REPL.
  ref: concepts.md#jlink-and-custom-runtime-images
- id: java-module-system-jpms-030
  difficulty: intermediate
  tags:
  - jpackage
  - versions
  question: |
    In which JDK did the packaging tool `jpackage` (for building native installers from a runtime
    image) become a final feature?
  options:
  - JDK 11
  - JDK 16
  - JDK 14
  - JDK 21
  answer: 1
  explanation: |
    jpackage was incubating in JDK 14 and became final in JDK 16 (JEP 392). It wraps a runtime
    image (often produced by jlink) into platform-native installers (msi/dmg/deb). It was not
    final in 11, 14, or first in 21.
  ref: concepts.md#jlink-and-custom-runtime-images
- id: java-module-system-jpms-031
  difficulty: advanced
  tags:
  - illegal-access
  - versions
  - jep-396
  question: |
    On which JDK release did the default value of `--illegal-access` change from `permit`
    (allow-with-warning) to `deny`?
  options:
  - JDK 11
  - JDK 15
  - JDK 16
  - JDK 17
  answer: 2
  explanation: |
    JEP 396 (JDK 16) flipped the default from permit to deny, blocking illegal reflective access
    to JDK internals by default (still overridable). JDK 9-15 defaulted to permit with a warning.
    JDK 17 (JEP 403) went further and removed the flag entirely.
  ref: concepts.md#reflection-encapsulation-in-modern-jdks
- id: java-module-system-jpms-032
  difficulty: advanced
  tags:
  - illegal-access
  - versions
  - jep-403
  question: |
    On JDK 17+, how can code still perform deep reflection into a strongly-encapsulated JDK
    internal package such as jdk.internal.misc?
  options:
  - By passing --illegal-access=permit
  - By calling setAccessible(true) which always succeeds for JDK classes
  - It is completely impossible under any circumstances
  - By using an explicit --add-opens for that specific package
  answer: 3
  explanation: |
    JEP 403 (JDK 17) made strong encapsulation of JDK internals permanent and REMOVED
    --illegal-access (so `permit` no longer exists). The only supported override is a targeted
    --add-opens (or --add-exports) for the specific package. setAccessible does not universally
    succeed; access without an opens throws InaccessibleObjectException.
  ref: concepts.md#reflection-encapsulation-in-modern-jdks
- id: java-module-system-jpms-033
  difficulty: advanced
  tags:
  - code-analysis
  - reflection
  question: |
    Given a strongly-encapsulated JDK (JDK 17, no extra flags), what is the result of:

    ```java
    Field f = String.class.getDeclaredField("value");
    f.setAccessible(true);
    ```
  options:
  - Throws InaccessibleObjectException because java.base does not open java.lang to the caller
  - Runs fine; String is in java.base which is always open
  - Throws NoSuchFieldException because String has no `value` field
  - Prints a warning but succeeds, as on JDK 11
  answer: 0
  explanation: |
    java.lang is exported but NOT open, so setAccessible(true) on the private String.value field
    throws InaccessibleObjectException on JDK 16+ (deny by default) and definitively on 17+. On
    JDK 11 it would have succeeded with an "illegal reflective access" warning. String does have
    a private `value` field, so NoSuchFieldException is wrong.
  ref: concepts.md#reflection-encapsulation-in-modern-jdks
- id: java-module-system-jpms-034
  difficulty: advanced
  tags:
  - cyclic-dependencies
  - resolution
  question: |
    Module A has `requires B;` and module B has `requires A;`. What is the outcome?
  options:
  - Allowed; the module system resolves cycles lazily
  - A compile-time / resolution error — module dependencies must be acyclic
  - Allowed only if both are automatic modules
  - Allowed only if one uses requires static
  answer: 1
  explanation: |
    The module graph must be acyclic; a direct or transitive requires cycle between modules is a
    compile/resolution error. (Package-level cycles WITHIN a single module remain legal.) Neither
    automatic modules nor requires static legalizes a module-level cycle.
  ref: concepts.md#requires-and-module-readability
- id: java-module-system-jpms-035
  difficulty: advanced
  tags:
  - code-analysis
  - accessibility
  question: |
    Module `lib` declares `exports com.lib.api;` (and nothing about com.lib.impl). Module `app`
    declares `requires lib;`. In app you write `new com.lib.impl.Helper()` where Helper is a
    public class in com.lib.impl. What happens?
  options:
  - Compiles and runs; Helper is public
  - Compiles, but throws IllegalAccessError at runtime
  - 'Compile error: package com.lib.impl is not visible / not exported by lib'
  - Compiles only with --add-opens
  answer: 2
  explanation: |
    Because com.lib.impl is not exported, app cannot reference its types at all — javac reports
    the package as not visible (it is not on app's readable, exported surface). This is a
    compile-time failure, not a runtime one. --add-opens concerns reflection, not compile-time
    package access (that would be --add-exports).
  ref: concepts.md#exports-and-strong-encapsulation
- id: java-module-system-jpms-036
  difficulty: advanced
  tags:
  - add-exports-vs-add-opens
  question: |
    What is the precise difference between `--add-exports M/p=T` and `--add-opens M/p=T`?
  options:
  - They are aliases; both do the same thing
  - --add-exports works only at compile time; --add-opens works only at runtime
  - --add-exports opens for reflection; --add-opens grants compile access
  - --add-exports grants compile/runtime access to public types of p; --add-opens additionally grants
    deep reflection into all members
  answer: 3
  explanation: |
    --add-exports makes package p accessible (as if exported) so target T can use its public
    types at compile/runtime. --add-opens makes p open, additionally permitting deep reflection
    (setAccessible) into non-public members. The roles are not swapped; both flags apply at
    runtime (and --add-exports also at compile via javac).
  ref: concepts.md#exports-and-strong-encapsulation
- id: java-module-system-jpms-037
  difficulty: advanced
  tags:
  - aggregator
  - java-se
  question: |
    What is an "aggregator module" such as java.se?
  options:
  - A module with no packages of its own that uses `requires transitive` to re-expose a set of modules
  - A module that contains the implementations of all SE APIs
  - A module that automatically opens all JDK packages
  - A synonym for the unnamed module
  answer: 0
  explanation: |
    An aggregator module typically has no packages/code of its own; it simply `requires transitive`
    a group of modules so that requiring the aggregator gives readability to all of them.
    java.se aggregates the full Java SE API this way. It does not contain implementations, open
    packages, or equal the unnamed module.
  ref: concepts.md#requires-and-module-readability
- id: java-module-system-jpms-038
  difficulty: advanced
  tags:
  - code-analysis
  - automatic-module
  - requires
  question: |
    An explicit module needs Guava, provided as a plain JAR guava-32.1.3-jre.jar with an
    Automatic-Module-Name of `com.google.common`. Which requires line is correct and stable?
  options:
  - requires guava;
  - requires com.google.common;
  - requires guava.32.1.3.jre;
  - requires transitive unnamed;
  answer: 1
  explanation: |
    When Automatic-Module-Name is present, that value (com.google.common) IS the module name, and
    it is stable across versions/filenames. You require it by that name. The filename-derived
    name (guava) only applies when the manifest entry is absent; there is no `unnamed` module you
    can require.
  ref: concepts.md#named-automatic-and-unnamed-modules
- id: java-module-system-jpms-039
  difficulty: advanced
  tags:
  - module-resolution
  - errors
  question: |
    At startup the JVM reports "java.lang.module.FindException: Module com.acme.core not found".
    What does this indicate?
  options:
  - A class in com.acme.core failed to load lazily
  - com.acme.core has a split package
  - A root/required module could not be located on the module path during resolution
  - com.acme.core requires a cyclic dependency
  answer: 2
  explanation: |
    FindException at resolution means a required (or root) module was not found on the module
    path — an example of "reliable configuration" failing fast at startup rather than surfacing
    as a late NoClassDefFoundError. Split packages and cycles produce different, distinct errors.
  ref: concepts.md#classpath-versus-module-path
- id: java-module-system-jpms-040
  difficulty: advanced
  tags:
  - mixed-path
  - migration
  question: |
    In a "mixed" run where some JARs are on the module path and some on the classpath, which
    statement is TRUE?
  options:
  - Classpath JARs are ignored once a module path is present
  - Explicit modules can read the classpath by default
  - All classpath JARs are automatically promoted to automatic modules
  - The classpath contents form the unnamed module, which explicit modules still cannot require
  answer: 3
  explanation: |
    Mixed execution is the common migration reality. Classpath JARs still form the single unnamed
    module. Explicit (named) modules cannot require the unnamed module, though automatic modules
    can read it. Classpath contents are not ignored, not promoted to automatic modules, and not
    readable by explicit modules by default.
  ref: concepts.md#named-automatic-and-unnamed-modules
- id: java-module-system-jpms-041
  difficulty: advanced
  tags:
  - services
  - code-analysis
  question: |
    A module declares `provides com.acme.spi.Codec with com.acme.impl.JsonCodec;` but the module
    declaration omits any `uses` for Codec, and the consumer is a different module. Is that a
    problem for the PROVIDER module?
  options:
  - No; the provider only declares provides — it is the CONSUMER that declares uses
  - Yes, a provider must always also declare uses for the same service
  - Yes, provides requires the implementation package to be exported
  - No, but JsonCodec must be in an opened package
  answer: 0
  explanation: |
    `uses` is declared by the CONSUMER module that calls ServiceLoader.load; the PROVIDER only
    declares `provides ... with`. The provider need not (and typically does not) declare uses.
    The impl package need not be exported (ServiceLoader is privileged), nor opened.
  ref: concepts.md#services-with-uses-and-provides
- id: java-module-system-jpms-042
  difficulty: advanced
  tags:
  - jlink
  - cli
  - launcher
  question: |
    Which jlink invocation correctly creates an image with a launcher script named `run` for
    com.acme.Main in module com.acme.app?
  options:
  - jlink --add-modules com.acme.app --main-class com.acme.Main --output img
  - jlink --module-path $JAVA_HOME/jmods:mods --add-modules com.acme.app --launcher run=com.acme.app/com.acme.Main
    --output img
  - jlink --classpath mods --module com.acme.app/com.acme.Main --output img
  - jlink --module com.acme.app --strip-debug --output img
  answer: 1
  explanation: |
    jlink needs the module path (including the JDK's jmods and your mods), the root modules via
    --add-modules, and --launcher name=module/mainclass to generate the launcher script. jlink
    has no --classpath (it links modules only) and --launcher syntax is name=module/main, not
    --main-class.
  ref: concepts.md#jlink-and-custom-runtime-images
- id: java-module-system-jpms-043
  difficulty: advanced
  tags:
  - programmatic-api
  - addOpens
  question: |
    Which statement about the runtime API `Module.addOpens(String pkg, Module other)` is correct?
  options:
  - Any code can open any module's package to any other module
  - It permanently opens the package to all modules
  - It can only be called by code within the module that owns the package (self-opening)
  - It is equivalent to --add-exports
  answer: 2
  explanation: |
    Module.addOpens is caller-sensitive: a module may open one of ITS OWN packages to another
    module at runtime, but arbitrary code cannot open a package it doesn't own. It targets a
    specific module (not all), and opening is about reflection (like opens), not compile-time
    export like --add-exports.
  ref: concepts.md#reflection-encapsulation-in-modern-jdks
- id: java-module-system-jpms-044
  difficulty: advanced
  tags:
  - code-analysis
  - requires-transitive
  - compile
  question: |
    Module `api` has a public method `Model build()` returning a type from module `model`, but
    api only declares `requires model;` (NOT transitive). A consumer module `app` does
    `requires api;` and calls `api.build().getName()`. What happens in app?
  options:
  - Compiles fine; model is implicitly readable through api
  - Compiles but model methods return null
  - Runtime InaccessibleObjectException
  - 'Compile error in app: the Model type is not accessible because app cannot read model'
  answer: 3
  explanation: |
    Because api uses plain `requires model` (not `requires transitive`), app does NOT read model.
    When app tries to use the returned Model type, javac fails because app cannot access a type in
    a module it does not read. The fix is to change api to `requires transitive model;` (or have
    app also require model). This is a classic API-design mistake.
  ref: concepts.md#requires-and-module-readability
- id: java-module-system-jpms-045
  difficulty: advanced
  tags:
  - multi-release-jar
  - versions
  question: |
    Multi-Release JAR files (JEP 238), which let a JAR carry version-specific class files under
    META-INF/versions/N, were introduced in which Java release?
  options:
  - Java 9
  - Java 8
  - Java 11
  - Java 17
  answer: 0
  explanation: |
    JEP 238 (Multi-Release JARs) shipped in Java 9 alongside JPMS, enabling a single JAR to
    provide alternative class versions selected by the running JDK. This helps libraries adopt
    newer APIs (or module-info) while staying compatible with older runtimes.
  ref: concepts.md#migration-strategies-and-challenges
- id: java-module-system-jpms-046
  difficulty: advanced
  tags:
  - adoption
  - tradeoffs
  question: |
    Which is the MOST accurate characterization of JPMS adoption as of the modern LTS releases
    (17/21)?
  options:
  - 'Mandatory: all Java code must be modularized to run on JDK 17+'
  - Highly successful inside the JDK and among library authors, but optional and unevenly adopted for
    application code
  - Abandoned and removed from recent JDKs
  - Adopted universally by Spring Boot which now refuses to run on the classpath
  answer: 1
  explanation: |
    The JDK itself is fully modular, internals are strongly encapsulated, and jlink exists — a
    clear success. Many libraries ship module-info or Automatic-Module-Name. But applications can
    still run entirely on the classpath (Spring Boot commonly does), so app-level adoption is
    optional and uneven. JPMS is neither mandatory nor removed.
  ref: concepts.md#module-trade-offs-and-uneven-adoption
- id: java-module-system-jpms-047
  difficulty: advanced
  tags:
  - strong-encapsulation
  - rationale
  question: |
    Which problem of the pre-Java-9 classpath does strong encapsulation specifically address?
  options:
  - Slow class loading due to bytecode verification
  - The inability to run more than one JAR at a time
  - Any public type in any JAR being accessible to everything, so implementation details leaked and were
    depended upon
  - Lack of generics in collections
  answer: 2
  explanation: |
    On the classpath, every public type everywhere was accessible, so internal/implementation
    classes (e.g. sun.misc.Unsafe, com.sun.*) leaked and became de-facto public APIs that the JDK
    couldn't evolve. Strong encapsulation hides non-exported packages so they cannot be depended
    upon. The other options are unrelated to encapsulation.
  ref: concepts.md#module-trade-offs-and-uneven-adoption
- id: java-module-system-jpms-048
  difficulty: advanced
  tags:
  - code-analysis
  - opens-vs-exports
  question: |
    A module declares ONLY `opens com.acme.dto;` (no exports for that package). Another module
    that requires it tries, at compile time, to write `com.acme.dto.User u = new com.acme.dto.User();`.
    Result?
  options:
  - Compiles and runs — opens implies exports
  - Only works with --add-reads
  - Compiles but throws at runtime
  - 'Compile error: opens grants reflective runtime access only, not compile-time access'
  answer: 3
  explanation: |
    opens grants deep REFLECTIVE access at runtime but NOT compile-time (or ordinary) access to
    the package's types. So compile-time use of com.acme.dto.User fails. To use it directly at
    compile time you need exports. opens and exports are independent; opens does not imply exports.
  ref: concepts.md#exports-and-strong-encapsulation
- id: java-module-system-jpms-049
  difficulty: advanced
  tags:
  - migration
  - bottom-up-top-down
  question: |
    In a top-down migration, how are not-yet-modularized dependencies typically handled?
  options:
  - Placed on the module path as automatic modules, required by their derived/manifest names
  - Left on the classpath and required by name from the application module
  - Rewritten from scratch as explicit modules before the app can compile
  - Bundled into the java.base module
  answer: 0
  explanation: |
    Top-down migration modularizes the application first and puts its (non-modular) dependencies
    on the module path as automatic modules, requiring them by their Automatic-Module-Name or
    derived name. You cannot require classpath (unnamed) code from an explicit module, so leaving
    them on the classpath won't satisfy `requires`, and rewriting everything up front is
    impractical.
  ref: concepts.md#migration-strategies-and-challenges
- id: java-module-system-jpms-050
  difficulty: expert
  tags:
  - modulelayer
  - dynamic
  question: |
    Which construct enables advanced dynamic scenarios (e.g. plugin/container systems) to load
    modules into a child graph on top of the boot layer at runtime?
  options:
  - ClassLoader.getSystemClassLoader()
  - java.lang.ModuleLayer
  - ServiceLoader.installProvider()
  - Module.addExports() alone
  answer: 1
  explanation: |
    java.lang.ModuleLayer represents a layer of modules; applications can create child layers
    (with their own configurations/class loaders) atop the boot layer to dynamically load plugin
    modules — used by app servers and plugin frameworks. There is no ServiceLoader.installProvider,
    and addExports/addOpens adjust edges but don't create layers.
  ref: concepts.md#reflection-encapsulation-in-modern-jdks
- id: java-module-system-jpms-051
  difficulty: expert
  tags:
  - code-analysis
  - services
  - layers
  question: |
    A consumer module declares `uses com.acme.Codec;` and calls
    `ServiceLoader.load(com.acme.Codec.class)`. On the module path, which providers are located?
  options:
  - Only providers whose implementation package is exported
  - Any class on the classpath implementing Codec, regardless of module declarations
  - Providers declared via `provides` in modules within the same or an ancestor ModuleLayer, resolved
    through the module graph
  - None; ServiceLoader does not work with modules
  answer: 2
  explanation: |
    With modules, ServiceLoader.load(Class) uses the caller's module layer and locates providers
    declared with `provides` in that layer and its ancestors, honoring the module graph — the
    impl package need NOT be exported. Classpath-style META-INF/services still works for unnamed-
    module code, but on the module path the `provides` declaration is the mechanism.
  ref: concepts.md#services-with-uses-and-provides
- id: java-module-system-jpms-052
  difficulty: expert
  tags:
  - reflection
  - caller-sensitive
  - edge-case
  question: |
    Module `frameworkA` obtained a `Method` object and passes it to `frameworkB` (a different
    module). `frameworkB` calls `method.invoke(target)`. The target's package is opened to
    `frameworkA` but NOT to `frameworkB`. What is the outcome (JDK 17)?
  options:
  - Works, because access is checked once when the Method is created
  - Always throws NoSuchMethodException
  - Works, because Method objects carry the original caller's permissions
  - Fails, because access is checked against the module actually performing the reflective operation,
    and frameworkB lacks access
  answer: 3
  explanation: |
    Reflective access checks are evaluated against the module performing the operation at the time
    of use, and setAccessible/invoke are caller-sensitive. Since the package is open to frameworkA
    but not frameworkB, frameworkB's invocation fails (an IllegalAccessException, or
    InaccessibleObjectException if it tried setAccessible). Method objects do not carry a prior
    caller's grant; the method exists so NoSuchMethodException is wrong.
  ref: concepts.md#reflection-encapsulation-in-modern-jdks
- id: java-module-system-jpms-053
  difficulty: expert
  tags:
  - patch-module
  - testing
  - edge-case
  question: |
    When unit tests need to access internal (non-exported) packages of the module under test —
    e.g. white-box tests compiled into the same packages — which mechanism do build tools
    typically use?
  options:
  - --patch-module to merge test classes into the module, plus --add-reads/--add-exports as needed
  - --add-opens only
  - Making all packages exported permanently in module-info
  - Running tests only on the classpath is impossible
  answer: 0
  explanation: |
    Build tools (Maven Surefire, Gradle) use --patch-module to graft test classes into the module
    under test so they share its packages, combined with --add-reads (to read the test framework)
    and --add-exports/--add-opens for internals. Exporting everything in module-info would break
    encapsulation for production; and tests can also just run on the classpath as a simpler
    alternative, so the "impossible" option is false.
  ref: concepts.md#migration-strategies-and-challenges
- id: java-module-system-jpms-054
  difficulty: expert
  tags:
  - versions
  - unsafe
  - ffm
  question: |
    Which statement about sun.misc.Unsafe and modern encapsulation is MOST accurate?
  options:
  - Unsafe was removed from the JDK in Java 11
  - Unsafe's memory-access methods are being deprecated for removal (JEP 471, JDK 23) in favor of the
    Foreign Function and Memory API, which was finalized in JDK 22
  - Unsafe is fully exported by java.base and always accessible
  - Unsafe access has nothing to do with the module system
  answer: 1
  explanation: |
    Unsafe still ships (in jdk.unsupported), but its memory-access methods are being deprecated
    for removal via JEP 471 (JDK 23), with the Foreign Function and Memory API (JEP 454, final in
    JDK 22) as the replacement, alongside VarHandles. It was not removed in 11, is exposed via
    jdk.unsupported (not broadly exported), and the encapsulation push is closely tied to the
    module system's lock-down of internals.
  ref: concepts.md#reflection-encapsulation-in-modern-jdks
- id: java-module-system-jpms-055
  difficulty: expert
  tags:
  - code-analysis
  - qualified-opens
  - edge-case
  question: |
    Module M declares `opens com.acme.model to com.fasterxml.jackson.databind;`. A DIFFERENT
    module `spring.beans` tries to deeply reflect into com.acme.model at runtime. Result?
  options:
  - Succeeds; a qualified opens opens to everyone once declared
  - Succeeds only if spring.beans requires jackson.databind
  - Fails with InaccessibleObjectException; the qualified opens only grants access to the named module
    (jackson.databind)
  - Fails at compile time
  answer: 2
  explanation: |
    A qualified `opens ... to X` grants deep reflection ONLY to the named module(s). spring.beans
    is not named, so its reflective access fails at runtime with InaccessibleObjectException. It
    is not a compile-time issue (opens is a runtime reflection grant), and requiring jackson does
    not transfer the opens grant.
  ref: concepts.md#exports-and-strong-encapsulation
- id: java-module-system-jpms-056
  difficulty: expert
  tags:
  - resolution
  - root-modules
  - add-modules
  question: |
    An explicit module `com.acme.app` uses a service via `uses com.acme.spi.Plugin;`, and the
    only provider lives in module `com.acme.plugin`, which nothing `requires`. On the module path,
    is the provider module resolved into the graph by default?
  options:
  - Yes, `uses` automatically pulls in all provider modules
  - Yes, but only if the provider is an automatic module
  - No, providers must always be on the classpath
  - Not necessarily; provider modules are resolved via service binding only if they are reachable — often
    you must add them as roots (e.g. --add-modules) or ensure they're bound
  answer: 3
  explanation: |
    Module resolution performs service binding: modules that `provide` a service used by resolved
    modules are drawn in — but only observable provider modules participate, and edge cases
    (unreachable providers, needing them as roots) mean you sometimes add them via --add-modules.
    `uses` alone does not force in arbitrary providers that aren't observable/bound; providers do
    not have to be on the classpath or automatic.
  ref: concepts.md#services-with-uses-and-provides
- id: java-module-system-jpms-057
  difficulty: expert
  tags:
  - code-analysis
  - split-package
  - jdk
  question: |
    A legacy app puts a JAR containing package `javax.annotation` on the module path while the
    resolved platform also supplies types in an overlapping package. What is the likely failure?
  options:
  - A split-package / package-conflict resolution error at startup, because the package is defined by
    more than one module
  - NoSuchMethodError at runtime
  - A ClassCastException
  - Silent shadowing with a warning
  answer: 0
  explanation: |
    Overlapping the same package across the module path and a platform module is a split package,
    which the module system rejects at resolution/startup with a package-conflict error. This is a
    well-known migration pain point (old javax.annotation / JAXB fragments). It is not a late
    NoSuchMethodError, ClassCastException, or silent shadowing.
  ref: concepts.md#migration-strategies-and-challenges
- id: java-module-system-jpms-058
  difficulty: expert
  tags:
  - tradeoffs
  - jlink
  - containers
  question: |
    Which is a legitimate reason many server-side teams have NOT adopted jlink despite its
    benefits?
  options:
  - jlink images cannot run Spring at all
  - Container base images and layered builds already address 'small runtime' needs, and full modularization
    (required by jlink) of all transitive deps is costly
  - jlink was removed in JDK 17
  - jlink images are slower to start than a full JDK
  answer: 1
  explanation: |
    jlink requires all modules in the tree to be explicit (no automatic modules), which is costly
    when dependencies aren't fully modularized; meanwhile container tooling already gives small,
    layered images, reducing the incentive. jlink was not removed, images generally start faster
    (smaller), and Spring can run on jlink images with effort. So the modularization cost +
    container alternatives is the real deterrent.
  ref: concepts.md#module-trade-offs-and-uneven-adoption
- id: java-module-system-jpms-059
  difficulty: expert
  tags:
  - code-analysis
  - transitive
  - aggregator
  question: |
    Consider:

    ```
    module a { exports a.pkg; requires transitive b; }
    module b { exports b.pkg; }
    module c { requires a; }
    ```

    Which types can code in module `c` reference at compile time (assuming public exported types)?
  options:
  - Only a.pkg types
  - b.pkg types only
  - a.pkg and b.pkg types
  - None until c adds requires b
  answer: 2
  explanation: |
    c requires a; a re-exposes b via `requires transitive b`, so c gains implied readability to b
    and can use both a.pkg and b.pkg public exported types without naming b. If a had used plain
    `requires b`, then c would see only a.pkg. So c does not need its own `requires b`.
  ref: concepts.md#requires-and-module-readability
- id: java-module-system-jpms-060
  difficulty: expert
  tags:
  - versions
  - timeline
  - illegal-access
  question: |
    Which sequence correctly orders the tightening of reflective access to JDK internals?
  options:
  - JDK 9 deny by default -> JDK 16 permit -> JDK 17 removed the flag
  - All three releases behaved identically with permit as default
  - JDK 11 removed the flag -> JDK 16 re-added it -> JDK 17 deny
  - JDK 9 permit-with-warning -> JDK 16 deny by default (JEP 396) -> JDK 17 --illegal-access removed and
    internals permanently encapsulated (JEP 403)
  answer: 3
  explanation: |
    The correct timeline: JDK 9-15 defaulted to --illegal-access=permit (deep reflection allowed
    with a warning); JDK 16 (JEP 396) changed the default to deny; JDK 17 (JEP 403) removed the
    flag entirely and made strong encapsulation of internals permanent (only targeted --add-opens/
    --add-exports remain). The other orderings misstate the version behavior.
  ref: concepts.md#reflection-encapsulation-in-modern-jdks
