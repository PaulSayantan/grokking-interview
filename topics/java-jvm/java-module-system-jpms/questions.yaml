topic: "Java Platform Module System (JPMS)"
domain: java-jvm
topic_slug: java-module-system-jpms
version: 1
questions:
  - id: java-module-system-jpms-001
    difficulty: beginner
    tags: [history, versions, jigsaw]
    question: |
      In which Java release was the Java Platform Module System (Project Jigsaw)
      first delivered as a final, standard feature?
    options:
      - "Java 9"
      - "Java 7"
      - "Java 8"
      - "Java 11"
    answer: 0
    explanation: |
      JPMS shipped in Java 9 (2017) under Project Jigsaw, via JEP 261 and related
      JEPs (200, 201, 220). Java 8 delivered lambdas/streams but no modules;
      Java 11 is a later LTS that inherited the module system.
    ref: "concepts.md#modules-and-project-jigsaw-overview"

  - id: java-module-system-jpms-002
    difficulty: beginner
    tags: [module-info, syntax]
    question: |
      What is the name of the file that declares a module, and where must it live?
    options:
      - "manifest.mf inside META-INF"
      - "module.properties in the resources folder"
      - "module-info.java at the root of the module's source tree"
      - "package-info.java in each package"
    answer: 2
    explanation: |
      A module is declared in module-info.java placed at the root of the module's
      source tree (the default package); it compiles to module-info.class.
      package-info.java carries package-level annotations, not module declarations,
      and the manifest predates modules.
    ref: "concepts.md#the-module-infojava-descriptor"

  - id: java-module-system-jpms-003
    difficulty: beginner
    tags: [java-base, requires]
    question: |
      Which platform module does every module implicitly require without any
      explicit directive?
    options:
      - "java.lang"
      - "java.base"
      - "java.se"
      - "jdk.unsupported"
    answer: 1
    explanation: |
      Every module implicitly requires java.base, which exports java.lang,
      java.util, java.io, etc. java.lang is a package, not a module; java.se is an
      aggregator you must require explicitly; jdk.unsupported holds legacy APIs
      like sun.misc.Unsafe.
    ref: "concepts.md#modules-and-project-jigsaw-overview"

  - id: java-module-system-jpms-004
    difficulty: beginner
    tags: [exports, encapsulation]
    question: |
      A public class sits in a package that is NOT listed in any `exports`
      directive of its module. Another module tries to import and use it. What
      happens?
    options:
      - "It works because the class is public"
      - "It works but emits a deprecation warning"
      - "It works only if both modules are on the classpath"
      - "It fails: the package is strongly encapsulated and not accessible outside the module"
    answer: 3
    explanation: |
      Strong encapsulation means public types in non-exported packages are
      invisible outside their module at both compile and run time. `public` is no
      longer enough by itself; the package must be exported (and the consumer must
      read the module).
    ref: "concepts.md#exports-and-strong-encapsulation"

  - id: java-module-system-jpms-005
    difficulty: beginner
    tags: [requires, readability]
    question: |
      What does the directive `requires com.acme.core;` establish for your module?
    options:
      - "It makes your module able to read com.acme.core (readability)"
      - "It exports com.acme.core's packages to your consumers"
      - "It opens com.acme.core for reflection"
      - "It registers com.acme.core as a service provider"
    answer: 0
    explanation: |
      `requires` establishes readability: your module can read the required
      module, a precondition for accessing its exported types. It does not
      re-export anything (that is `requires transitive`), does not open packages,
      and has nothing to do with services.
    ref: "concepts.md#requires-and-module-readability"

  - id: java-module-system-jpms-006
    difficulty: beginner
    tags: [classpath, module-path, cli]
    question: |
      Which command-line option specifies the module path?
    options:
      - "-cp / --class-path"
      - "--source-path"
      - "-p / --module-path"
      - "-jar"
    answer: 2
    explanation: |
      --module-path (short form -p) specifies the module path. --class-path (-cp)
      is the traditional classpath whose contents form the unnamed module.
    ref: "concepts.md#classpath-versus-module-path"

  - id: java-module-system-jpms-007
    difficulty: beginner
    tags: [jlink, tooling]
    question: |
      What is the primary purpose of the `jlink` tool introduced in Java 9?
    options:
      - "To link native C libraries into a JAR"
      - "To merge multiple JARs into one fat JAR"
      - "To download module dependencies from Maven Central"
      - "To assemble a custom, self-contained runtime image containing only the modules an app needs"
    answer: 3
    explanation: |
      jlink (JEP 282) builds a minimal, self-contained runtime image from the set
      of platform (and app) modules actually required, producing a smaller runtime
      that ships without a pre-installed JRE. Fat-JAR assembly and dependency
      downloads are build-tool concerns, not jlink's.
    ref: "concepts.md#jlink-and-custom-runtime-images"

  - id: java-module-system-jpms-008
    difficulty: beginner
    tags: [unnamed-module, classpath]
    question: |
      Code loaded from the classpath in Java 9+ belongs to which module?
    options:
      - "A separate automatic module per JAR"
      - "The single unnamed module"
      - "java.base"
      - "No module at all; it is unavailable"
    answer: 1
    explanation: |
      All classpath code lives in the single unnamed module, which reads every
      other module and effectively exports/opens all its packages. Automatic
      modules come from JARs on the module path, not the classpath.
    ref: "concepts.md#named-automatic-and-unnamed-modules"

  - id: java-module-system-jpms-009
    difficulty: beginner
    tags: [opens, reflection]
    question: |
      Which directive grants deep reflection (setAccessible on private members)
      into a package at runtime?
    options:
      - "exports P;"
      - "requires P;"
      - "opens P;"
      - "uses P;"
    answer: 2
    explanation: |
      `opens P;` allows deep reflection at runtime, which frameworks like Jackson
      and Hibernate need. `exports` grants compile/run access to public API but not
      deep reflection into private members.
    ref: "concepts.md#opens-and-reflective-access"

  - id: java-module-system-jpms-010
    difficulty: beginner
    tags: [problem, motivation]
    question: |
      Which two long-standing problems was JPMS primarily designed to address?
    options:
      - "Weak encapsulation (public = visible to all) and the flat, unreliable classpath"
      - "Slow startup and large heap usage"
      - "Lack of generics and lack of lambdas"
      - "Checked exceptions and null pointers"
    answer: 0
    explanation: |
      JPMS targets (1) weak encapsulation where public meant visible everywhere and
      internal APIs were reachable, and (2) the flat classpath / JAR-hell problem
      with no reliable dependency configuration. Generics/lambdas and GC concerns
      are unrelated.
    ref: "concepts.md#modules-and-project-jigsaw-overview"

  - id: java-module-system-jpms-011
    difficulty: beginner
    tags: [java-base, modular-jdk]
    question: |
      Roughly how was the monolithic pre-Java-9 rt.jar restructured in Java 9?
    options:
      - "Into a single giant module named java.se"
      - "Into one module per package"
      - "It was left unchanged; only applications became modular"
      - "Into ~90+ platform modules such as java.base, java.sql, java.xml, java.logging"
    answer: 3
    explanation: |
      The JDK was split into ~90+ platform modules (java.base, java.sql, java.xml,
      java.logging, jdk.httpserver, etc.), enabling jlink and encapsulation of
      internal APIs. rt.jar no longer exists as a monolith.
    ref: "concepts.md#modules-and-project-jigsaw-overview"

  - id: java-module-system-jpms-012
    difficulty: intermediate
    tags: [exports, opens, comparison]
    question: |
      You want a framework to read the private fields of classes in
      `com.acme.dto` via reflection, but you do NOT want other modules to
      compile against those classes. Which directive is correct?
    options:
      - "exports com.acme.dto;"
      - "opens com.acme.dto;"
      - "requires transitive com.acme.dto;"
      - "provides com.acme.dto;"
    answer: 1
    explanation: |
      `opens` grants runtime deep reflection but no compile-time access, exactly
      matching the requirement. `exports` would grant compile-time access (which
      you explicitly do not want) yet still not permit deep reflection on private
      members.
    ref: "concepts.md#opens-and-reflective-access"

  - id: java-module-system-jpms-013
    difficulty: intermediate
    tags: [requires-transitive, implied-readability]
    question: |
      Module A has `requires transitive B;`. Module C has `requires A;` and uses a
      type from B returned by one of A's methods. What must C declare about B?
    options:
      - "Nothing — C reads B automatically via implied readability"
      - "C must add `requires B;` explicitly"
      - "C must add `opens B;`"
      - "C must add `uses B;`"
    answer: 0
    explanation: |
      `requires transitive` grants implied readability: consumers of A automatically
      read B, so C needs no explicit `requires B`. This solves the leaky-API problem
      where A's public API exposes B's types.
    ref: "concepts.md#requires-and-module-readability"

  - id: java-module-system-jpms-014
    difficulty: intermediate
    tags: [automatic-module, module-path]
    question: |
      You place a plain JAR with no module-info on the MODULE path. What is it, and
      how does it behave?
    options:
      - "An unnamed module that no named module can require"
      - "A named module whose name is java.base"
      - "An automatic module that exports all its packages and reads all other modules"
      - "Ignored entirely because it lacks module-info"
    answer: 2
    explanation: |
      A plain JAR on the module path becomes an automatic module: it exports all
      packages, reads all other modules (including the unnamed module), and derives
      a name from the JAR file or its Automatic-Module-Name header. It is the
      migration bridge between the classpath and named modules.
    ref: "concepts.md#named-automatic-and-unnamed-modules"

  - id: java-module-system-jpms-015
    difficulty: intermediate
    tags: [services, uses, provides]
    question: |
      A consumer module calls `ServiceLoader.load(Codec.class)` but gets no
      providers even though a provider module with `provides Codec with GzipCodec;`
      is present. What is the most likely missing piece in the consumer?
    options:
      - "An `exports` of the Codec package"
      - "A `uses Codec;` directive"
      - "An `opens` of the provider package"
      - "A `requires transitive` on the provider module"
    answer: 1
    explanation: |
      The consumer must declare `uses Codec;`. Without it the module system does not
      wire the readability/binding to providers, so ServiceLoader finds nothing.
      `uses` is what authorizes and enables service discovery for the consumer.
    ref: "concepts.md#services-with-uses-and-provides"

  - id: java-module-system-jpms-016
    difficulty: intermediate
    tags: [qualified-exports]
    question: |
      What does `exports com.acme.spi to com.acme.plugin.a;` accomplish?
    options:
      - "Exports the package to every module that reads com.acme"
      - "Opens the package for reflection to com.acme.plugin.a"
      - "Makes the package part of the unnamed module"
      - "Exports the package only to the module com.acme.plugin.a (a qualified export)"
    answer: 3
    explanation: |
      This is a qualified export: only the explicitly named module(s) can access
      the package. The JDK uses this pattern to expose jdk.internal.* packages to
      specific JDK modules only. It grants compile/run access, not deep reflection.
    ref: "concepts.md#exports-and-strong-encapsulation"

  - id: java-module-system-jpms-017
    difficulty: intermediate
    tags: [named-module, unnamed-module, migration]
    question: |
      Why can a named module NOT declare `requires` on classpath-only code?
    options:
      - "Because classpath code lives in the unnamed module, which has no name to reference"
      - "Because the classpath is read-only"
      - "Because named modules can only require platform modules"
      - "Because it would create a cyclic dependency"
    answer: 0
    explanation: |
      Classpath code forms the unnamed module, and a module cannot require something
      with no name. This is why full modularization requires moving dependencies to
      the module path (as automatic or named modules); it is a key migration
      constraint.
    ref: "concepts.md#named-automatic-and-unnamed-modules"

  - id: java-module-system-jpms-018
    difficulty: intermediate
    tags: [jlink, automatic-module, adoption]
    question: |
      Why does `jlink` fail to build an image when one of your dependencies is an
      automatic module?
    options:
      - "Automatic modules are too large"
      - "Automatic modules cannot be compressed"
      - "jlink requires all inputs to be proper (explicit) modules; automatic modules are not allowed"
      - "jlink only works with the classpath"
    answer: 2
    explanation: |
      jlink demands a fully modular graph; automatic modules are rejected as inputs.
      This is a real adoption blocker: you cannot produce a clean custom runtime
      until every dependency ships a proper module-info (or you synthesize one).
    ref: "concepts.md#jlink-and-custom-runtime-images"

  - id: java-module-system-jpms-019
    difficulty: intermediate
    tags: [reflection, inaccessibleobjectexception]
    question: |
      After adding module-info.java to an app that uses Jackson, deserialization
      throws `InaccessibleObjectException`. What is the correct, targeted fix?
    options:
      - "Add `exports` for the DTO package"
      - "Add `requires transitive jackson`"
      - "Move Jackson to the classpath and delete module-info"
      - "Add `opens <dtoPackage> to com.fasterxml.jackson.databind;` (or open it broadly)"
    answer: 3
    explanation: |
      The exception means the package is not open for deep reflection to Jackson.
      The precise fix is `opens` on the DTO package (qualified to the Jackson module
      or unqualified). `exports` grants compile access but not the deep reflection
      Jackson needs on private fields.
    ref: "concepts.md#accessibility-rules-and-why-reflection-broke"

  - id: java-module-system-jpms-020
    difficulty: intermediate
    tags: [same-jar, classpath-vs-module-path]
    question: |
      A JAR containing module-info.class is placed on the CLASSPATH (not the module
      path). How is it treated?
    options:
      - "As a named module"
      - "As part of the unnamed module; its module-info is ignored"
      - "As an automatic module"
      - "It fails to load because module-info is present"
    answer: 1
    explanation: |
      On the classpath the module-info.class is ignored and the JAR's classes join
      the unnamed module. The same JAR becomes a named module only when placed on
      the module path — placement determines identity.
    ref: "concepts.md#classpath-versus-module-path"

  - id: java-module-system-jpms-021
    difficulty: intermediate
    tags: [requires-static]
    question: |
      What is the purpose of `requires static M;`?
    options:
      - "Requires M and re-exports it to consumers"
      - "Requires a static-linked native version of M"
      - "Declares M as a compile-time-only dependency, optional at runtime"
      - "Requires M and opens all its packages"
    answer: 2
    explanation: |
      `requires static` marks a mandatory compile-time dependency that may be absent
      at runtime (e.g. annotation processors, optional integrations). At runtime the
      module is not pulled into the graph unless another non-static edge requires it.
    ref: "concepts.md#requires-and-module-readability"

  - id: java-module-system-jpms-022
    difficulty: intermediate
    tags: [add-opens, cli, third-party]
    question: |
      You cannot edit a third-party module's descriptor, but your code must deeply
      reflect into its package `p` from your module `m`. Which launch flag helps?
    options:
      - "--add-opens thirdparty/p=m"
      - "--add-reads thirdparty=m"
      - "--add-exports thirdparty/p=m"
      - "--patch-module thirdparty=m"
    answer: 0
    explanation: |
      --add-opens M/P=OTHER opens the package for deep reflection at runtime without
      editing module-info. --add-exports grants only public/compile-style access;
      --add-reads only adds a readability edge; --patch-module injects classes.
    ref: "concepts.md#accessibility-rules-and-why-reflection-broke"

  - id: java-module-system-jpms-023
    difficulty: intermediate
    tags: [split-package, migration]
    question: |
      What is a "split package" and why is it a problem on the module path?
    options:
      - "A package split across multiple files; harmless"
      - "A package with both public and private classes"
      - "A package that spans two JVMs"
      - "The same package name present in two modules, which is illegal and breaks resolution"
    answer: 3
    explanation: |
      A split package is one whose name appears in more than one module. JPMS
      forbids this on the module path because a package must belong to exactly one
      module; it causes resolution errors and is a classic migration blocker (e.g.
      old JAXB/annotation JARs).
    ref: "concepts.md#migration-strategies-and-challenges"

  - id: java-module-system-jpms-024
    difficulty: intermediate
    tags: [open-module]
    question: |
      What does declaring `open module com.acme.app { ... }` do?
    options:
      - "Exports every package for compile-time use"
      - "Opens every package for deep reflection at runtime"
      - "Makes the module part of the unnamed module"
      - "Disables strong encapsulation for all other modules"
    answer: 1
    explanation: |
      An `open module` implicitly opens all its packages for runtime deep
      reflection. It does not export them for compile-time access (you still need
      `exports`), and you cannot add individual `opens` directives inside it.
    ref: "concepts.md#opens-and-reflective-access"

  - id: java-module-system-jpms-025
    difficulty: intermediate
    tags: [automatic-module-name, manifest]
    question: |
      What is the recommended way for a library author on Java 8 to reserve a stable
      module name before shipping a real module-info?
    options:
      - "Add an `Automatic-Module-Name` header to the JAR's MANIFEST.MF"
      - "Rename the JAR to match the desired module name"
      - "Add a module-info.class compiled for Java 8"
      - "Publish an empty module-info.java in the sources JAR"
    answer: 0
    explanation: |
      The Automatic-Module-Name manifest header lets a library declare its future
      module name while remaining Java 8 compatible (no module-info.class). Deriving
      the name from the file name is fragile and version-dependent.
    ref: "concepts.md#named-automatic-and-unnamed-modules"

  - id: java-module-system-jpms-026
    difficulty: intermediate
    tags: [accessibility, three-conditions]
    question: |
      For a public type in package P of module N to be accessible from module M,
      which combination of conditions must ALL hold?
    options:
      - "P is exported by N, and M is on the classpath"
      - "N opens P, and M requires transitive N"
      - "The type is public, N exports P, and M reads N"
      - "The type is public and N and M share a package"
    answer: 2
    explanation: |
      Accessibility requires all three: sufficient visibility (public), N exports P
      (unqualified or qualified to M), and M reads N. Missing any one blocks access.
      `opens` is only for deep reflection, a separate concern.
    ref: "concepts.md#accessibility-rules-and-why-reflection-broke"

  - id: java-module-system-jpms-027
    difficulty: intermediate
    tags: [cyclic-dependencies]
    question: |
      Module A requires B, and module B requires A. What happens?
    options:
      - "Allowed; module cycles are resolved lazily"
      - "Compile/resolution error: cyclic module dependencies are forbidden"
      - "Allowed only if both use requires transitive"
      - "Allowed only on the classpath"
    answer: 1
    explanation: |
      JPMS forbids cyclic dependencies between modules; the readable-modules graph
      must be acyclic and resolution fails on a cycle. (Cycles among packages within
      a single module are fine.)
    ref: "concepts.md#requires-and-module-readability"

  - id: java-module-system-jpms-028
    difficulty: intermediate
    tags: [jpackage, versions, tooling]
    question: |
      Which tool wraps a jlink runtime image into a native platform installer, and
      in which JDK did it become a final feature?
    options:
      - "jdeps, final in JDK 9"
      - "jmod, final in JDK 11"
      - "jlink, final in JDK 14"
      - "jpackage, final in JDK 16"
    answer: 3
    explanation: |
      jpackage (JEP 392) became a final feature in JDK 16, producing native
      installers/executables (.dmg, .msi, .deb). jdeps analyzes dependencies; jmod
      packages modules; jlink builds the runtime image jpackage consumes.
    ref: "concepts.md#jlink-and-custom-runtime-images"

  - id: java-module-system-jpms-029
    difficulty: intermediate
    tags: [add-reads, cli]
    question: |
      What does the runtime flag `--add-reads M=N` do?
    options:
      - "Adds a readability edge so module M reads module N without editing module-info"
      - "Exports M's packages to N"
      - "Opens M's packages to N for reflection"
      - "Adds N to the module path"
    answer: 0
    explanation: |
      --add-reads M=N injects a readability edge at compile/run time. It does not
      export or open packages (those are --add-exports and --add-opens) and does not
      change the module path.
    ref: "concepts.md#classpath-versus-module-path"

  - id: java-module-system-jpms-030
    difficulty: advanced
    tags: [code-analysis, exports, compile-error]
    question: |
      Given:
      ```java
      module com.acme.lib {
          exports com.acme.lib.api;
      }
      // package com.acme.lib.internal has a public class Helper
      ```
      Another named module does `requires com.acme.lib;` and writes
      `import com.acme.lib.internal.Helper;`. What is the result?
    options:
      - "Compiles and runs fine because Helper is public"
      - "Runtime IllegalAccessError only"
      - "Compile error: package com.acme.lib.internal is not visible"
      - "Compiles with a warning, fails at link time"
    answer: 2
    explanation: |
      Only com.acme.lib.api is exported. com.acme.lib.internal is strongly
      encapsulated, so importing Helper produces a compile-time error ("package ...
      is not visible") even though Helper is public. Public visibility is
      necessary but not sufficient across module boundaries.
    ref: "concepts.md#exports-and-strong-encapsulation"

  - id: java-module-system-jpms-031
    difficulty: advanced
    tags: [code-analysis, opens, exports, reflection]
    question: |
      A module declares only `exports com.acme.model;` (no opens). At runtime a
      framework in another module calls `field.setAccessible(true)` on a PRIVATE
      field of a class in com.acme.model. What happens?
    options:
      - "Succeeds because the package is exported"
      - "Succeeds only if the field is final"
      - "Throws NoSuchFieldException"
      - "Throws InaccessibleObjectException because the package is not opened"
    answer: 3
    explanation: |
      `exports` permits public reflection over public members but NOT deep
      reflection on private members. setAccessible(true) on a private field of a
      merely-exported (not opened) package throws InaccessibleObjectException. You
      need `opens` for that.
    ref: "concepts.md#opens-and-reflective-access"

  - id: java-module-system-jpms-032
    difficulty: advanced
    tags: [illegal-access, versions, jep403]
    question: |
      In which JDK was the `--illegal-access` flag removed entirely, so JDK internals
      became strongly encapsulated with no permissive fallback (only explicit
      --add-opens/--add-exports work)?
    options:
      - "JDK 11"
      - "JDK 17"
      - "JDK 16"
      - "JDK 21"
    answer: 1
    explanation: |
      JEP 403 in JDK 17 removed --illegal-access outright. JDK 16 (JEP 396) only
      flipped its default to "deny" but the flag still existed. This is why
      upgrading legacy apps to JDK 17 LTS commonly surfaces InaccessibleObjectException.
    ref: "concepts.md#reflection-encapsulation-in-modern-jdks"

  - id: java-module-system-jpms-033
    difficulty: advanced
    tags: [illegal-access, versions, jep396]
    question: |
      In which JDK did the default value of `--illegal-access` change from `permit`
      to `deny`?
    options:
      - "JDK 9"
      - "JDK 11"
      - "JDK 16"
      - "JDK 17"
    answer: 2
    explanation: |
      JEP 396 (JDK 16) flipped the default to deny, so illegal reflective access to
      JDK internals began failing by default (opt back in with
      --illegal-access=permit). From Java 9 through 15 the default was permit-with-warning.
      JDK 17 then removed the flag entirely (JEP 403).
    ref: "concepts.md#reflection-encapsulation-in-modern-jdks"

  - id: java-module-system-jpms-034
    difficulty: advanced
    tags: [services, provider-method]
    question: |
      A service provider class has BOTH a public no-arg constructor and a public
      static `provider()` method returning the service type. Which does
      ServiceLoader use?
    options:
      - "The static provider() method; the constructor is ignored"
      - "The no-arg constructor"
      - "It throws ServiceConfigurationError due to ambiguity"
      - "It calls both and uses whichever returns non-null"
    answer: 0
    explanation: |
      If a public static provider() method exists, ServiceLoader uses it and ignores
      the constructor. The no-arg constructor is only the fallback when no provider()
      method is present. There is no ambiguity error.
    ref: "concepts.md#services-with-uses-and-provides"

  - id: java-module-system-jpms-035
    difficulty: advanced
    tags: [patch-module, migration, split-package]
    question: |
      Which mechanism injects additional classes into an existing module — useful for
      resolving a split package or patching platform classes during tests?
    options:
      - "--add-modules"
      - "--add-reads"
      - "-Xbootclasspath/p"
      - "--patch-module M=dir/jar"
    answer: 3
    explanation: |
      --patch-module M=path injects extra classes into module M and is the modern
      replacement for the removed boot-classpath override. It is commonly used to
      resolve split packages or patch platform classes in tests. --add-modules only
      adds whole modules to the resolution.
    ref: "concepts.md#migration-strategies-and-challenges"

  - id: java-module-system-jpms-036
    difficulty: advanced
    tags: [jep320, versions, java-ee]
    question: |
      Which JDK removed the Java EE and CORBA modules (e.g. java.xml.bind /
      java.activation / java.corba), forcing apps to add standalone Jakarta
      artifacts?
    options:
      - "JDK 9"
      - "JDK 11"
      - "JDK 10"
      - "JDK 17"
    answer: 1
    explanation: |
      JEP 320 removed the Java EE and CORBA modules in JDK 11. They were deprecated
      for removal in JDK 9 and dropped in 11, which is why migrating from Java 8 to
      11 often requires pulling in standalone Jakarta/GlassFish dependencies for
      JAXB, activation, etc.
    ref: "concepts.md#migration-strategies-and-challenges"

  - id: java-module-system-jpms-037
    difficulty: advanced
    tags: [code-analysis, automatic-module-name-clash]
    question: |
      Two different JARs on the module path, neither with module-info nor
      Automatic-Module-Name, both derive the automatic module name `commons`. What
      happens at resolution?
    options:
      - "Resolution fails because two modules would have the same name"
      - "The first one wins and the second is silently dropped"
      - "They are merged into one module named commons"
      - "Both are moved to the unnamed module automatically"
    answer: 0
    explanation: |
      Two modules cannot share a name in the same configuration, so resolution
      fails. The fix is to give the JARs distinct Automatic-Module-Name headers (or
      rename). Modules are never silently merged or dropped.
    ref: "concepts.md#named-automatic-and-unnamed-modules"

  - id: java-module-system-jpms-038
    difficulty: advanced
    tags: [code-analysis, requires-transitive, compile-error]
    question: |
      Module `web` has `requires com.acme.api;` (plain, NOT transitive) and its
      public method returns `com.acme.api.Result`. Module `client` has
      `requires web;` and calls that method, then a method on the returned Result.
      What is the result for `client`?
    options:
      - "Compiles fine because web re-exports api"
      - "Runtime NoClassDefFoundError only"
      - "Compile error: com.acme.api.Result is not accessible because client does not read com.acme.api"
      - "Compiles but Result methods are inaccessible"
    answer: 2
    explanation: |
      Plain `requires` does not propagate readability. Because web exposes an api
      type in its public API without `requires transitive`, client cannot read
      com.acme.api and gets a compile error when it touches Result. The fix is
      `requires transitive com.acme.api;` in web (or an explicit requires in client).
    ref: "concepts.md#requires-and-module-readability"

  - id: java-module-system-jpms-039
    difficulty: advanced
    tags: [methodhandles, privatelookupin, reflection]
    question: |
      `MethodHandles.privateLookupIn(Target.class, lookup)` is called from module M
      where Target lives in module N. Under what condition does it succeed?
    options:
      - "Always, since MethodHandles bypass module rules"
      - "Only if N opens Target's package to M (otherwise IllegalAccessException)"
      - "Only if M and N are both automatic modules"
      - "Only if Target is public"
    answer: 1
    explanation: |
      privateLookupIn requires N to open Target's package to M; otherwise it throws
      IllegalAccessException. MethodHandles.Lookup honors the module graph and does
      not bypass encapsulation. Public visibility alone is insufficient for a
      private-capable lookup across module boundaries.
    ref: "concepts.md#accessibility-rules-and-why-reflection-broke"

  - id: java-module-system-jpms-040
    difficulty: advanced
    tags: [split-package, module-path-classpath]
    question: |
      A package exists both in a named module (module path) and in a JAR on the
      classpath (unnamed module). From a modular consumer's perspective, which copy
      is visible?
    options:
      - "The classpath copy, because classpath has priority"
      - "Both, merged"
      - "Neither; it is a hard error at startup"
      - "The named module's copy; the classpath copy is invisible to modules"
    answer: 3
    explanation: |
      When a package is defined by a named module, that module owns it and the
      classpath copy becomes invisible to modules — which can surprise you with
      NoClassDefFoundError for classes that only existed in the classpath copy.
    ref: "concepts.md#classpath-versus-module-path"

  - id: java-module-system-jpms-041
    difficulty: advanced
    tags: [jlink, missing-modules, runtime]
    question: |
      A jlink image built without `jdk.crypto.ec` runs fine locally but fails during
      TLS handshakes in production. Why?
    options:
      - "The elliptic-curve crypto provider module was not linked into the image, so certain TLS cipher suites fail"
      - "jlink images cannot do networking"
      - "jlink strips all security by default"
      - "The image needs --illegal-access=permit for TLS"
    answer: 0
    explanation: |
      jlink includes only the modules you specify plus their dependencies. Modules
      loaded via services/reflection (like jdk.crypto.ec, or jdk.localedata for
      locales) are easily forgotten and must be added with --add-modules, or TLS/
      locale features fail at runtime. This is a classic jlink pitfall.
    ref: "concepts.md#jlink-and-custom-runtime-images"

  - id: java-module-system-jpms-042
    difficulty: advanced
    tags: [add-exports, compile-time, jdk-internals]
    question: |
      Your code must call a method in `jdk.internal.misc` at COMPILE time on JDK 17.
      Which flag makes that package visible for compilation from the unnamed module?
    options:
      - "--add-opens java.base/jdk.internal.misc=ALL-UNNAMED"
      - "--add-reads java.base=ALL-UNNAMED"
      - "--add-exports java.base/jdk.internal.misc=ALL-UNNAMED"
      - "--illegal-access=permit"
    answer: 2
    explanation: |
      --add-exports grants compile/normal access to a package (here to ALL-UNNAMED).
      --add-opens is for deep reflection, not compilation of direct references.
      --illegal-access was removed in JDK 17, so it is not an option.
    ref: "concepts.md#reflection-encapsulation-in-modern-jdks"

  - id: java-module-system-jpms-043
    difficulty: advanced
    tags: [code-analysis, opens-vs-exports, compile]
    question: |
      A developer sees a COMPILE error "package com.acme.p is not visible" and tries
      to fix it by adding `opens com.acme.p;` to the providing module. Does it work?
    options:
      - "Yes, opens makes the package compile-visible"
      - "Yes, but only for private members"
      - "No, only --add-reads can fix a compile error"
      - "No, opens is runtime-only; the compile fix is `exports` (plus a `requires` in the consumer)"
    answer: 3
    explanation: |
      `opens` has no compile-time effect whatsoever — it only enables runtime deep
      reflection. A compile-time visibility error is fixed with `exports` on the
      provider and `requires` on the consumer.
    ref: "concepts.md#opens-and-reflective-access"

  - id: java-module-system-jpms-044
    difficulty: advanced
    tags: [services, accessibility, uses]
    question: |
      For a module to legally declare `uses com.acme.spi.Codec;`, what must be true
      about the Codec type?
    options:
      - "Codec must be in the same module"
      - "The Codec type must be accessible: its package exported by its module and that module required by the consumer"
      - "Codec must be an abstract class, not an interface"
      - "Codec must be opened for reflection"
    answer: 1
    explanation: |
      The service type named in `uses` must be accessible to the declaring module —
      i.e. its package is exported by the defining module and that module is required
      by the consumer. The service type may be an interface or class; it need not be
      opened.
    ref: "concepts.md#services-with-uses-and-provides"

  - id: java-module-system-jpms-045
    difficulty: advanced
    tags: [subpackages, exports, encapsulation]
    question: |
      A module declares `exports com.acme.api;`. Is the sub-package
      `com.acme.api.internal` also exported?
    options:
      - "Yes, exports is recursive into sub-packages"
      - "Yes, but only its public classes"
      - "No, packages are not hierarchical in JPMS; each package needs its own directive"
      - "Only if the sub-package has a package-info.java"
    answer: 2
    explanation: |
      JPMS treats packages as flat, independent units. Exporting com.acme.api does
      NOT export com.acme.api.internal; each package requires its own exports/opens
      directive. This surprises developers expecting hierarchical semantics.
    ref: "concepts.md#exports-and-strong-encapsulation"

  - id: java-module-system-jpms-046
    difficulty: advanced
    tags: [add-modules, all-system, all-module-path]
    question: |
      What does `--add-modules ALL-MODULE-PATH` do at launch?
    options:
      - "Adds every observable module found on the module path to the root set, even if not otherwise required"
      - "Adds every JDK platform module to the graph"
      - "Opens all modules for reflection"
      - "Puts all module-path JARs onto the classpath"
    answer: 0
    explanation: |
      ALL-MODULE-PATH resolves every module on the module path as a root, useful
      when modules are only reached via reflection/services. ALL-SYSTEM refers to
      all system (JDK) modules; neither opens packages nor moves JARs to the classpath.
    ref: "concepts.md#classpath-versus-module-path"

  - id: java-module-system-jpms-047
    difficulty: advanced
    tags: [adoption, trade-offs, jlink]
    question: |
      Which statement best explains why the marginal benefit of modularizing your
      OWN application is often smaller than expected?
    options:
      - "Modules make code run slower"
      - "The JVM ignores application module-info files"
      - "Named modules cannot use generics"
      - "The JDK is already modular, so you get encapsulated internals and jlink benefits without your app being modular"
    answer: 3
    explanation: |
      A key adoption insight: because the JDK itself is modular, teams already
      benefit from encapsulated internals and can use jlink for a bundled runtime
      even with classpath apps in many cases — so fully modularizing the app adds
      cost with a smaller incremental payoff for typical server apps.
    ref: "concepts.md#module-trade-offs-and-uneven-adoption"

  - id: java-module-system-jpms-048
    difficulty: advanced
    tags: [code-analysis, provides, multiple-impls]
    question: |
      Is `provides com.acme.spi.Codec with com.acme.GzipCodec, com.acme.LzoCodec;`
      valid, and what is the effect?
    options:
      - "Invalid: only one implementation per provides is allowed"
      - "Valid: the module supplies two implementations of Codec, both discoverable via ServiceLoader"
      - "Valid but only the first implementation is used"
      - "Invalid unless both are in different modules"
    answer: 1
    explanation: |
      A single `provides ... with` may list multiple implementation classes; all are
      registered and discoverable by ServiceLoader in the order given. There is no
      one-per-provides restriction.
    ref: "concepts.md#services-with-uses-and-provides"

  - id: java-module-system-jpms-049
    difficulty: advanced
    tags: [migration, top-down, bottom-up]
    question: |
      In a top-down migration strategy, what happens FIRST?
    options:
      - "Put your own application on the module path (often as a named or automatic module) while dependencies stay as automatic modules or on the classpath"
      - "Modularize the lowest-level leaf libraries"
      - "Run jlink to build a runtime image"
      - "Delete all module-info files and use the classpath only"
    answer: 0
    explanation: |
      Top-down means you modularize your own app first while dependencies remain
      automatic/classpath, then work inward as libraries modularize. Bottom-up
      starts from leaf libraries but is blocked when a dependency is not yet modular.
    ref: "concepts.md#migration-strategies-and-challenges"

  - id: java-module-system-jpms-050
    difficulty: advanced
    tags: [restricted-keywords, code-analysis]
    question: |
      Consider ordinary (non-module) source code with a variable named `module` and
      a method named `requires`. Does it still compile on Java 9+?
    options:
      - "No, module and requires became reserved keywords everywhere"
      - "Only if compiled with --release 8"
      - "Yes, they are restricted keywords with special meaning only inside module-info.java"
      - "No, requires is reserved but module is fine"
    answer: 2
    explanation: |
      module, requires, exports, opens, to, with, transitive, uses, provides, and
      open are RESTRICTED keywords: they carry meaning only inside a module
      declaration, so existing identifiers using these words still compile in normal
      code. This preserved backward compatibility.
    ref: "concepts.md#the-module-infojava-descriptor"

  - id: java-module-system-jpms-051
    difficulty: expert
    tags: [expert, layers, reflection, code-analysis]
    question: |
      Module `m1` (module path) has `exports p1;` and `opens p2;`. A class in the
      unnamed module (classpath) does `Class.forName("p1.PublicClass").getConstructor().newInstance()`
      via the public no-arg constructor, then `setAccessible(true)` on a PRIVATE
      field of a `p1` class. Which line fails?
    options:
      - "The newInstance() call fails because p1 is only exported, not opened"
      - "The setAccessible(true) on the private p1 field throws InaccessibleObjectException because p1 is exported but not opened"
      - "Neither fails; both succeed"
      - "Class.forName fails because unnamed module cannot read m1"
    answer: 1
    explanation: |
      p1 is exported, so instantiating a public class via its public constructor is
      fine (the unnamed module reads all modules). But p1 is not OPENED, so deep
      reflection on a private field of a p1 class throws InaccessibleObjectException.
      Only p2 was opened. The distinction between exports and opens is the crux.
    ref: "concepts.md#opens-and-reflective-access"

  - id: java-module-system-jpms-052
    difficulty: expert
    tags: [expert, requires-static, runtime, code-analysis]
    question: |
      Module `m` declares `requires static com.acme.optional;` and directly
      references a type from it inside a method that DOES execute at runtime, but
      com.acme.optional is absent from the runtime module graph. What happens?
    options:
      - "The whole module fails to resolve at startup"
      - "The reference is silently replaced with null"
      - "requires static forces the module to be present at runtime, so it always works"
      - "It compiles fine; at runtime, executing that method throws NoClassDefFoundError because the optional module is not present"
    answer: 3
    explanation: |
      `requires static` satisfies compilation but does NOT guarantee runtime
      presence. If the module is absent and code actually touches its types, you get
      NoClassDefFoundError at that point. Correct use guards such references (e.g.
      only via reflection / optional code paths).
    ref: "concepts.md#requires-and-module-readability"

  - id: java-module-system-jpms-053
    difficulty: expert
    tags: [expert, jdk-internals, versions, ffm]
    question: |
      A legacy library reaches into `sun.misc.Unsafe`-style JDK internals. Which
      statement about running it on JDK 17 and about the modern supported successor
      is CORRECT?
    options:
      - "On JDK 17 --illegal-access is gone, so you need explicit --add-opens/--add-exports; the modern successor for off-heap/native interop is the Foreign Function and Memory API, final in JDK 22"
      - "On JDK 17 you can restore access with --illegal-access=permit; the successor API is JNI"
      - "JDK 17 removed reflection entirely; there is no successor"
      - "On JDK 17 Unsafe is fully removed; use the Security Manager instead"
    answer: 0
    explanation: |
      JDK 17 (JEP 403) removed --illegal-access, so relaxed access must be granted
      per-package via --add-opens/--add-exports. The supported modern replacement for
      much Unsafe/off-heap and native interop is the Foreign Function and Memory API,
      which became final in JDK 22 (JEP 454). The Security Manager was itself
      deprecated for removal in JDK 17 (JEP 411), so it is not a successor.
    ref: "concepts.md#reflection-encapsulation-in-modern-jdks"

  - id: java-module-system-jpms-054
    difficulty: expert
    tags: [expert, code-analysis, services, uses-missing]
    question: |
      A modular consumer requires the api module and calls
      `ServiceLoader.load(Codec.class)`, but the consumer's module-info OMITS
      `uses Codec;`. The Codec package IS exported and read. What is the outcome?
    options:
      - "Providers are found normally because Codec is accessible"
      - "A compile-time error on the ServiceLoader.load call"
      - "It compiles, but at runtime finds no providers (effectively empty) because without `uses` the module system does not bind providers to this consumer"
      - "It throws a ClassNotFoundException for Codec"
    answer: 2
    explanation: |
      Accessibility of Codec is not enough. The `uses` directive is what makes the
      module system bind service providers for this consumer; without it,
      ServiceLoader in a modular context does not discover module-path providers, so
      you get an empty result. The call itself compiles.
    ref: "concepts.md#services-with-uses-and-provides"

  - id: java-module-system-jpms-055
    difficulty: expert
    tags: [expert, layers, exports-to, code-analysis]
    question: |
      Module `core` declares `exports com.acme.spi to plugin.a;`. Module `plugin.b`
      does `requires core;` and imports `com.acme.spi.Ext`. What is the result for
      plugin.b, and could plugin.a's access differ?
    options:
      - "Both plugin.a and plugin.b compile; qualified exports affect only runtime"
      - "Neither compiles; qualified exports require opens"
      - "plugin.b compiles because requires overrides the qualified export"
      - "plugin.b gets a compile error (package not visible to it); plugin.a compiles because the qualified export names it"
    answer: 3
    explanation: |
      A qualified export exposes the package only to the named modules. plugin.a is
      named, so it has access; plugin.b is not, so com.acme.spi is not visible to it
      and it fails to compile despite requiring core. `requires` does not override a
      qualified export.
    ref: "concepts.md#exports-and-strong-encapsulation"

  - id: java-module-system-jpms-056
    difficulty: expert
    tags: [expert, automatic-module, reads-unnamed]
    question: |
      Why is an automatic module able to depend on code that lives ONLY on the
      classpath, while a fully named explicit module cannot?
    options:
      - "Automatic modules are compiled with a special flag"
      - "Automatic modules implicitly read the unnamed module, whereas a named module cannot require or read the unnamed module (it has no name)"
      - "Named modules also read the unnamed module, so both can"
      - "Classpath code is copied into automatic modules at build time"
    answer: 1
    explanation: |
      Automatic modules implicitly read the unnamed module (and all other modules),
      so they can use classpath-only code — the essence of the migration bridge. A
      named explicit module reads only what it requires and cannot name/require the
      unnamed module, so it cannot depend on classpath-only code.
    ref: "concepts.md#named-automatic-and-unnamed-modules"

  - id: java-module-system-jpms-057
    difficulty: expert
    tags: [expert, jlink, jdeps, migration]
    question: |
      Your dependency ships no module-info, so jlink refuses to include it. Which
      approach is the most appropriate to move forward toward a jlink-able build?
    options:
      - "Put the dependency on the classpath and run jlink with --illegal-access=permit"
      - "Rename the JAR so its automatic name is unique; jlink then accepts it"
      - "Use jdeps (e.g. --generate-module-info) or a tool like Moditect to synthesize a module-info for the dependency, making it a proper named module"
      - "Add Automatic-Module-Name to the manifest; jlink then accepts automatic modules"
    answer: 2
    explanation: |
      jlink requires proper (explicit) modules; automatic modules are rejected even
      with a manifest name. The practical path is to synthesize a module-info
      (jdeps --generate-module-info, Moditect, etc.) so the dependency becomes a real
      named module. --illegal-access was removed in JDK 17 and does not make jlink
      accept classpath code.
    ref: "concepts.md#jlink-and-custom-runtime-images"

  - id: java-module-system-jpms-058
    difficulty: expert
    tags: [expert, code-analysis, cyclic, transitive]
    question: |
      Modules: A `requires transitive B;`, B `requires transitive C;`, C `requires A;`.
      What is the outcome?
    options:
      - "Resolution/compile error: A -> B -> C -> A forms a forbidden module cycle regardless of transitivity"
      - "Valid: transitive edges break cycles"
      - "Valid only if all three are automatic modules"
      - "Valid at compile time but fails at runtime"
    answer: 0
    explanation: |
      requires transitive changes readability propagation, not the acyclicity rule.
      A requires B, B requires C, C requires A forms a dependency cycle among
      modules, which JPMS forbids; resolution fails. Cycles are illegal whether or
      not edges are transitive.
    ref: "concepts.md#requires-and-module-readability"

  - id: java-module-system-jpms-059
    difficulty: expert
    tags: [expert, add-opens-all-unnamed, reflection]
    question: |
      A framework running on the CLASSPATH (unnamed module) must deeply reflect into
      package `p` of a named module `m` you cannot modify. Which launch flag is
      correct?
    options:
      - "--add-opens m/p=m"
      - "--add-exports m/p=ALL-UNNAMED"
      - "--add-reads m=ALL-UNNAMED"
      - "--add-opens m/p=ALL-UNNAMED"
    answer: 3
    explanation: |
      The reflecting code is in the unnamed module, so the target of the open must be
      ALL-UNNAMED, and deep reflection requires --add-opens (not --add-exports).
      --add-opens m/p=m would open p to m itself (useless), and --add-reads does not
      grant reflective access.
    ref: "concepts.md#accessibility-rules-and-why-reflection-broke"

  - id: java-module-system-jpms-060
    difficulty: expert
    tags: [expert, trade-offs, adoption, discussion]
    question: |
      Which of the following is the MOST accurate characterization of why partial
      JPMS migration can yield "costs without the top benefits"?
    options:
      - "Automatic modules run in interpreted mode, hurting performance"
      - "Automatic modules relax encapsulation (export/open everything) and are disallowed as jlink inputs, so you pay module-path friction without gaining strong encapsulation or a jlink image"
      - "Named modules cannot be debugged"
      - "Partial migration disables the JIT compiler"
    answer: 1
    explanation: |
      Automatic modules open and export all packages (undermining strong
      encapsulation) and cannot be fed to jlink, so a half-migrated app takes on
      module-path complexity while missing the headline benefits — encapsulation and
      a slim custom runtime. This is central to the uneven-adoption discussion.
    ref: "concepts.md#module-trade-offs-and-uneven-adoption"

  - id: java-module-system-jpms-061
    difficulty: expert
    tags: [expert, code-analysis, public-reflection, exports]
    question: |
      Package `p` of module `m` is `exports`ed but NOT `opens`ed. From another
      module, reflection calls `clazz.getMethod("run").invoke(obj)` where `run` is a
      PUBLIC method of a PUBLIC class in `p`. Does it succeed?
    options:
      - "Yes: public reflective access to public members of an exported package works; opens is only needed for setAccessible on non-public members"
      - "No, any reflection on a non-opened package throws InaccessibleObjectException"
      - "No, invoke always requires setAccessible(true)"
      - "Only if the other module is an automatic module"
    answer: 0
    explanation: |
      An exported package permits normal (public) reflective access to public
      members without setAccessible. `opens` is required only for deep reflection
      that bypasses access checks (e.g. setAccessible on private/non-public members).
      Invoking a public method on a public class needs no opens.
    ref: "concepts.md#accessibility-rules-and-why-reflection-broke"

  - id: java-module-system-jpms-062
    difficulty: expert
    tags: [expert, aggregator, java-se, requires-transitive]
    question: |
      What characterizes an aggregator module such as `java.se`?
    options:
      - "It contains all JDK bytecode in one place"
      - "It is the parent class loader of all modules"
      - "It has no code of its own; it only re-exports other modules via requires transitive edges"
      - "It is an automatic module generated at startup"
    answer: 2
    explanation: |
      An aggregator module has no packages/code; it consists solely of
      `requires transitive` directives, so requiring it grants implied readability
      to a whole set of modules (java.se pulls in the Java SE API surface). It is not
      a class loader nor a code container.
    ref: "concepts.md#requires-and-module-readability"
