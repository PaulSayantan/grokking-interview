topic: "Reflection, Annotations and Dynamic Proxies"
domain: java-jvm
topic_slug: reflection-annotations-proxies
version: 1
questions:
  - id: reflection-annotations-proxies-001
    difficulty: beginner
    tags: [reflection, class-object, basics]
    question: |
      What does reflection primarily allow a Java program to do?
    options:
      - "Inspect and manipulate classes, methods, and fields at runtime without compile-time knowledge of the types"
      - "Compile Java source code into bytecode faster"
      - "Automatically parallelize loops across CPU cores"
      - "Encrypt class files to prevent decompilation"
    answer: 0
    explanation: |
      Reflection is the runtime facility for inspecting and manipulating types, members, and metadata
      when the concrete types are not known at compile time. It has nothing to do with compilation
      speed, parallelism, or encryption. Frameworks like Spring, Hibernate, and Jackson depend on it.
    ref: "concepts.md#the-reflection-api-and-class-objects"

  - id: reflection-annotations-proxies-002
    difficulty: beginner
    tags: [class-object, forName, initialization]
    question: |
      Which statement about obtaining a Class object is correct?
    options:
      - "String.class triggers the static initializer of String"
      - "Class.forName never loads the class; it only checks the classpath"
      - "getClass() returns the declared (static) type of the reference variable"
      - "Class.forName(\"com.X\") by default runs the class's static initializer, while X.class does not"
    answer: 3
    explanation: |
      Class.forName(name) initializes the class by default (running static initializers), whereas a
      class literal like X.class does not initialize it. getClass() returns the runtime (dynamic)
      type, not the declared type. The three-arg forName overload can suppress initialization.
    ref: "concepts.md#the-reflection-api-and-class-objects"

  - id: reflection-annotations-proxies-003
    difficulty: beginner
    tags: [getMethods, getDeclaredMethods]
    question: |
      What is the difference between getMethods() and getDeclaredMethods() on a Class?
    options:
      - "getMethods() returns only static methods; getDeclaredMethods() returns only instance methods"
      - "They are identical; one is just an alias for the other"
      - "getMethods() returns public methods including inherited ones; getDeclaredMethods() returns all methods declared in this class (any visibility) but not inherited ones"
      - "getMethods() returns private methods only; getDeclaredMethods() returns public methods only"
    answer: 2
    explanation: |
      getMethods() = public members including those inherited from superclasses and interfaces.
      getDeclaredMethods() = every method declared directly in this class regardless of access
      modifier, but excluding inherited members. The same public/declared distinction applies to
      fields and constructors.
    ref: "concepts.md#the-reflection-api-and-class-objects"

  - id: reflection-annotations-proxies-004
    difficulty: beginner
    tags: [retention, annotations]
    question: |
      Which retention policy is required for an annotation to be readable via reflection at runtime?
    options:
      - "RetentionPolicy.SOURCE"
      - "RetentionPolicy.CLASS"
      - "RetentionPolicy.RUNTIME"
      - "RetentionPolicy.COMPILE"
    answer: 2
    explanation: |
      Only RUNTIME retention keeps the annotation in the class file AND makes the JVM load it so
      reflection (getAnnotation, isAnnotationPresent) can read it. SOURCE is discarded after
      compilation; CLASS is kept in the .class file but not loaded at runtime. COMPILE is not a real
      policy.
    ref: "concepts.md#annotations-retention-and-target"

  - id: reflection-annotations-proxies-005
    difficulty: beginner
    tags: [jdk-proxy, interfaces]
    question: |
      A JDK dynamic proxy created with java.lang.reflect.Proxy can proxy which of the following?
    options:
      - "One or more interfaces only"
      - "Any concrete class, even without interfaces"
      - "Final classes by rewriting their bytecode"
      - "Primitive types like int and long"
    answer: 0
    explanation: |
      JDK dynamic proxies implement interfaces. The generated proxy already extends
      java.lang.reflect.Proxy, and since Java has single inheritance it cannot also subclass a
      concrete class. To proxy a class without interfaces you need subclassing tools like CGLIB or
      ByteBuddy.
    ref: "concepts.md#jdk-dynamic-proxies"

  - id: reflection-annotations-proxies-006
    difficulty: beginner
    tags: [meta-annotations]
    question: |
      What is a meta-annotation?
    options:
      - "An annotation that can only be used on metadata files"
      - "An annotation with no elements"
      - "An annotation that is generated automatically by the JVM"
      - "An annotation applied to another annotation type (e.g., @Retention, @Target)"
    answer: 3
    explanation: |
      Meta-annotations annotate other annotation declarations. The core ones are @Retention,
      @Target, @Documented, @Inherited, and @Repeatable (Java 8). They configure how a custom
      annotation behaves.
    ref: "concepts.md#meta-annotations"

  - id: reflection-annotations-proxies-007
    difficulty: beginner
    tags: [newInstance, instantiation]
    question: |
      Since Java 9, what is the preferred way to instantiate a class reflectively, replacing the
      deprecated Class.newInstance()?
    options:
      - "clazz.getDeclaredConstructor().newInstance()"
      - "clazz.allocate()"
      - "new clazz()"
      - "Class.forName(clazz).build()"
    answer: 0
    explanation: |
      Class.newInstance() was deprecated in Java 9 because it improperly propagated checked
      exceptions thrown by the constructor. The replacement is
      clazz.getDeclaredConstructor().newInstance(), which wraps constructor exceptions in
      InvocationTargetException correctly.
    ref: "concepts.md#the-reflection-api-and-class-objects"

  - id: reflection-annotations-proxies-008
    difficulty: beginner
    tags: [annotation-processing, compile-time]
    question: |
      When do annotation processors (JSR 269) run?
    options:
      - "At runtime, when the annotated class is first loaded"
      - "At compile time, during javac in processing rounds"
      - "At class-load time inside the JIT compiler"
      - "Only when the debugger is attached"
    answer: 1
    explanation: |
      The Pluggable Annotation Processing API (JSR 269, since Java 6) runs processors at compile time
      inside javac, in rounds. They inspect the program via the javax.lang.model mirror API and can
      generate new source files. This is distinct from runtime reflection.
    ref: "concepts.md#building-annotation-processors"

  - id: reflection-annotations-proxies-009
    difficulty: beginner
    tags: [setAccessible, encapsulation]
    question: |
      What does AccessibleObject.setAccessible(true) do?
    options:
      - "Makes a field or method public permanently for all callers"
      - "Marks a class as thread-safe"
      - "Speeds up reflective calls by caching them"
      - "Suppresses Java language access checks so private/protected members can be accessed reflectively"
    answer: 3
    explanation: |
      setAccessible(true) suppresses the standard access-control checks for a specific reflective
      object (Method/Field/Constructor), allowing code to read/write private or protected members.
      It does not change the member's declared visibility for other callers, nor does it improve
      performance. Since Java 9 it also respects module boundaries.
    ref: "concepts.md#setaccessible-and-strong-encapsulation"

  - id: reflection-annotations-proxies-010
    difficulty: beginner
    tags: [target, elementtype]
    question: |
      Which meta-annotation restricts the program elements (types, methods, fields, etc.) to which a
      custom annotation may be applied?
    options:
      - "@Retention"
      - "@Documented"
      - "@Target"
      - "@Inherited"
    answer: 2
    explanation: |
      @Target takes ElementType values (TYPE, FIELD, METHOD, PARAMETER, CONSTRUCTOR, TYPE_USE, etc.)
      and constrains where the annotation is legal. Omitting @Target makes the annotation applicable
      almost everywhere.
    ref: "concepts.md#annotations-retention-and-target"

  - id: reflection-annotations-proxies-011
    difficulty: beginner
    tags: [getClass, runtime-type]
    question: |
      Given `Object o = new ArrayList<>();`, what does `o.getClass()` return?
    options:
      - "class java.lang.Object"
      - "class java.util.List"
      - "class java.util.ArrayList"
      - "It throws a ClassCastException"
    answer: 2
    explanation: |
      getClass() returns the runtime (dynamic) type of the object, which is ArrayList, regardless of
      the declared reference type Object. This is a fundamental reflection concept.
    ref: "concepts.md#the-reflection-api-and-class-objects"

  - id: reflection-annotations-proxies-012
    difficulty: beginner
    tags: [performance, avoid-reflection]
    question: |
      Which is a legitimate reason to AVOID reflection in a piece of code?
    options:
      - "It is executing in a tight, hot loop where per-element reflective access adds overhead and defers type errors to runtime"
      - "The types are genuinely unknown until runtime"
      - "You are writing a generic serialization framework"
      - "You are writing a test runner that discovers test methods"
    answer: 0
    explanation: |
      Hot loops are exactly where reflective overhead (boxing, lookup, weaker JIT optimization) and
      loss of compile-time type safety hurt most. The other three are classic legitimate use cases
      for reflection where types truly are not known at compile time.
    ref: "concepts.md#performance-and-when-to-avoid-reflection"

  - id: reflection-annotations-proxies-013
    difficulty: intermediate
    tags: [InvocationTargetException, exceptions]
    question: |
      A method invoked via Method.invoke() throws an IllegalStateException internally. What exception
      does the caller of invoke() observe?
    options:
      - "IllegalStateException directly"
      - "IllegalAccessException"
      - "InvocationTargetException, whose getCause() is the IllegalStateException"
      - "NoSuchMethodException"
    answer: 2
    explanation: |
      Method.invoke wraps any exception thrown by the target method in an InvocationTargetException.
      The original exception is retrieved via getCause(). This is why a catch block expecting the raw
      business exception around a reflective call won't catch it directly.
    ref: "concepts.md#working-with-fields-methods-and-constructors"

  - id: reflection-annotations-proxies-014
    difficulty: intermediate
    tags: [default-retention, gotcha]
    question: |
      If a custom annotation declares no @Retention meta-annotation, what is its retention policy, and
      what is the consequence?
    options:
      - "RUNTIME; it is fully visible to reflection"
      - "SOURCE; it is discarded after compilation and invisible everywhere"
      - "CLASS; it is stored in the .class file but is NOT visible to runtime reflection"
      - "It fails to compile without an explicit @Retention"
    answer: 2
    explanation: |
      The default retention is CLASS. The annotation is written to the class file but is not loaded
      into the runtime, so reflective checks like isAnnotationPresent return false. This is a classic
      trap where a framework annotation silently does nothing because RUNTIME was forgotten.
    ref: "concepts.md#annotations-retention-and-target"

  - id: reflection-annotations-proxies-015
    difficulty: intermediate
    tags: [primitive, overload, method-lookup]
    question: |
      To look up a method `void f(int x)` via reflection, which Class object must you pass as the
      parameter type?
    options:
      - "int.class (equivalently Integer.TYPE); autoboxing does NOT apply to reflective method lookup"
      - "Integer.class, because autoboxing applies to reflective lookup"
      - "Object.class, since reflection erases parameter types"
      - "Number.class, the common supertype"
    answer: 0
    explanation: |
      Reflective method lookup matches exact declared parameter types. int.class and Integer.class
      resolve to different overloads, and autoboxing does not apply. You must use the primitive class
      literal int.class (== Integer.TYPE) for a primitive parameter.
    ref: "concepts.md#working-with-fields-methods-and-constructors"

  - id: reflection-annotations-proxies-016
    difficulty: intermediate
    tags: [jpms, opens, exports]
    question: |
      In a module-info.java, what is the difference between `exports pkg;` and `opens pkg;`?
    options:
      - "They are synonyms in the module system"
      - "opens exposes the package to the internet; exports keeps it private"
      - "exports permits reflection; opens permits only compilation"
      - "exports permits compile-time and public API access; opens additionally permits deep reflective access (setAccessible) at runtime"
    answer: 3
    explanation: |
      exports makes a package's public types available for normal compile-time/public API use. opens
      grants runtime deep reflective access (setAccessible on non-public members). A package can be
      exported without being open, in which case reflection into its private members throws
      InaccessibleObjectException.
    ref: "concepts.md#setaccessible-and-strong-encapsulation"

  - id: reflection-annotations-proxies-017
    difficulty: intermediate
    tags: [static-members, invoke]
    question: |
      When invoking a static method reflectively via Method.invoke, what should be passed as the first
      (receiver) argument?
    options:
      - "The Class object of the declaring class"
      - "A new instance of the class"
      - "null"
      - "The string name of the class"
    answer: 2
    explanation: |
      For static methods and static fields, the receiver (object) argument is ignored, so you pass
      null: staticMethod.invoke(null, args) and staticField.get(null).
    ref: "concepts.md#working-with-fields-methods-and-constructors"

  - id: reflection-annotations-proxies-018
    difficulty: intermediate
    tags: [inherited, meta-annotations]
    question: |
      Which statement about the @Inherited meta-annotation is accurate?
    options:
      - "It causes annotations on interfaces to be inherited by implementing classes"
      - "It causes a class-level annotation to be inherited by subclasses, but does not apply to interfaces, methods, or fields"
      - "It makes all annotations on a class inherited automatically"
      - "It allows a method annotation to be inherited by overriding methods"
    answer: 1
    explanation: |
      @Inherited applies only to TYPE-target annotations and makes getAnnotation walk up the
      superclass chain. It does not work for interface-declared annotations, nor for method/field
      annotations. Overriding methods do not inherit annotations via @Inherited.
    ref: "concepts.md#meta-annotations"

  - id: reflection-annotations-proxies-019
    difficulty: intermediate
    tags: [spring, proxy-selection]
    question: |
      In Spring AOP, when does the framework use a JDK dynamic proxy versus a CGLIB proxy by default?
    options:
      - "It always uses JDK dynamic proxies"
      - "It always uses CGLIB"
      - "JDK dynamic proxy when the target implements at least one interface; CGLIB (subclassing) otherwise"
      - "CGLIB for singletons, JDK proxies for prototypes"
    answer: 2
    explanation: |
      By default Spring uses a JDK dynamic proxy if the bean implements an interface, and falls back
      to CGLIB subclassing when it does not. You can force CGLIB with proxyTargetClass=true; Spring
      Boot 2.0+ defaults to CGLIB proxying.
    ref: "concepts.md#dynamic-proxies-versus-cglib"

  - id: reflection-annotations-proxies-020
    difficulty: intermediate
    tags: [self-invocation, transactional, gotcha]
    question: |
      Why does an internal `this.methodB()` call from within `methodA()` of a @Transactional bean fail
      to start a new transaction on methodB?
    options:
      - "Because @Transactional only works on private methods"
      - "Because methodB must be static"
      - "Because Spring disables transactions inside other transactional methods"
      - "Because the self-invocation goes directly to the target object and bypasses the proxy that applies the transactional advice"
    answer: 3
    explanation: |
      Proxy-based advice only fires for calls routed through the proxy reference. An internal
      this.methodB() call hits the raw target instance directly, so the proxy never intercepts it and
      methodB's transactional/caching advice does not apply. This is the classic self-invocation
      limitation of both JDK proxies and CGLIB.
    ref: "concepts.md#dynamic-proxies-versus-cglib"

  - id: reflection-annotations-proxies-021
    difficulty: intermediate
    tags: [repeatable, java8, annotations]
    question: |
      To read the values of a @Repeatable annotation (Java 8) that appears multiple times on an
      element, which reflective method transparently handles the synthesized container?
    options:
      - "getAnnotationsByType(X.class)"
      - "getAnnotation(X.class)"
      - "isAnnotationPresent(X.class)"
      - "getDeclaredAnnotation(X.class)"
    answer: 0
    explanation: |
      getAnnotationsByType(X.class) understands the container annotation the compiler synthesizes for
      repeatable annotations and returns all instances. Plain getAnnotation(X.class) returns null (or
      just the container) because there is no single X directly present.
    ref: "concepts.md#annotations-retention-and-target"

  - id: reflection-annotations-proxies-022
    difficulty: intermediate
    tags: [cglib, final, subclassing]
    question: |
      What happens when a framework using CGLIB tries to proxy (intercept) a `final` method?
    options:
      - "CGLIB rewrites the method to remove final"
      - "It throws a compile error"
      - "The final method cannot be overridden, so it is silently not intercepted"
      - "CGLIB automatically switches to a JDK dynamic proxy"
    answer: 2
    explanation: |
      CGLIB (and ByteBuddy) work by subclassing and overriding methods. final methods (and final
      classes) cannot be overridden, so the interception advice simply does not apply to them — often
      silently, which is a subtle source of bugs.
    ref: "concepts.md#dynamic-proxies-versus-cglib"

  - id: reflection-annotations-proxies-023
    difficulty: intermediate
    tags: [type-use, java8, annotations]
    question: |
      The ElementType.TYPE_USE target, introduced in Java 8, enables annotations in which position?
    options:
      - "Only on class declarations"
      - "On any use of a type, e.g., List<@NonNull String>, casts, throws clauses"
      - "Only on package declarations"
      - "Only on enum constants"
    answer: 1
    explanation: |
      TYPE_USE (and TYPE_PARAMETER), added in Java 8 (JSR 308), allow annotations on any use of a
      type: generic type arguments, casts, throws clauses, array components, etc. This powers
      pluggable type checkers such as the Checker Framework.
    ref: "concepts.md#annotations-retention-and-target"

  - id: reflection-annotations-proxies-024
    difficulty: intermediate
    tags: [proxy, object-methods]
    question: |
      For a JDK dynamic proxy, which Object methods are routed to the InvocationHandler.invoke()?
    options:
      - "getClass, wait, and notify"
      - "None of the Object methods"
      - "All Object methods including final ones"
      - "equals, hashCode, and toString"
    answer: 3
    explanation: |
      A JDK proxy forwards equals, hashCode, and toString to the InvocationHandler. It does not
      forward getClass or the final methods wait/notify/notifyAll. Handlers must therefore be prepared
      to answer equals/hashCode/toString sensibly.
    ref: "concepts.md#jdk-dynamic-proxies"

  - id: reflection-annotations-proxies-025
    difficulty: intermediate
    tags: [annotation-processing, mirror-api]
    question: |
      An annotation processor inspects program elements using which API, and why not runtime
      reflection?
    options:
      - "The javax.lang.model mirror API (Element, TypeMirror), because the classes are still being compiled and not yet loaded"
      - "java.lang.reflect, because the classes are already loaded"
      - "sun.misc.Unsafe, for performance"
      - "The JDWP debugging protocol"
    answer: 0
    explanation: |
      During annotation processing the classes are being compiled, not loaded, so runtime reflection
      is unavailable. Processors use the compile-time mirror API in javax.lang.model (Element,
      TypeElement, TypeMirror) to inspect declarations and generate code via the Filer.
    ref: "concepts.md#building-annotation-processors"

  - id: reflection-annotations-proxies-026
    difficulty: intermediate
    tags: [performance, method-handle]
    question: |
      Which alternative to Method.invoke is resolved once and then executes close to direct-call speed
      because it is JIT-friendly?
    options:
      - "java.lang.invoke.MethodHandle"
      - "Class.forName"
      - "Thread.sleep"
      - "System.identityHashCode"
    answer: 0
    explanation: |
      MethodHandle (Java 7) and VarHandle (Java 9) are resolved once and then invoked with near
      direct-call performance because the JIT can optimize them well, unlike the boxing- and
      lookup-heavy Method.invoke. LambdaMetafactory can further turn a handle into a lambda.
    ref: "concepts.md#performance-and-when-to-avoid-reflection"

  - id: reflection-annotations-proxies-027
    difficulty: intermediate
    tags: [generics, erasure, reflection]
    question: |
      Generics are erased at runtime, yet frameworks recover type arguments from field/method
      signatures. Which reflective feature makes this possible?
    options:
      - "getClass() returns the parameterized type"
      - "getGenericType() / getGenericSuperclass() expose ParameterizedType retained in declared signatures"
      - "instanceof checks preserve generics at runtime"
      - "Reflection re-runs the compiler"
    answer: 1
    explanation: |
      While generic type information is erased for object instances, it is retained in class, field,
      and method signatures. Reflective methods returning java.lang.reflect.Type (getGenericType,
      getGenericSuperclass, getGenericInterfaces) expose ParameterizedType. This is how Jackson's
      TypeReference and Spring's ResolvableType recover generic arguments.
    ref: "concepts.md#the-reflection-api-and-class-objects"

  - id: reflection-annotations-proxies-028
    difficulty: intermediate
    tags: [invokeDefault, java16, proxy]
    question: |
      An InvocationHandler needs to invoke the interface's own default method implementation. Which
      API, added in Java 16, does this cleanly?
    options:
      - "method.invoke(proxy, args)"
      - "Proxy.callDefault(method)"
      - "super.method()"
      - "InvocationHandler.invokeDefault(proxy, method, args)"
    answer: 3
    explanation: |
      InvocationHandler.invokeDefault(proxy, method, args) was added in Java 16 to let a handler
      dispatch to the interface's default method implementation. Calling method.invoke(proxy, ...)
      would recurse into the handler, and before Java 16 you needed brittle private-lookup
      MethodHandles hacks.
    ref: "concepts.md#jdk-dynamic-proxies"

  - id: reflection-annotations-proxies-029
    difficulty: intermediate
    tags: [code-analysis, retention]
    question: |
      Consider:
      ```java
      @Target(ElementType.METHOD)
      @interface Audited {}

      class Svc { @Audited void run() {} }

      Method m = Svc.class.getDeclaredMethod("run");
      System.out.println(m.isAnnotationPresent(Audited.class));
      ```
      What is printed?
    options:
      - "true"
      - "false"
      - "It throws NoSuchMethodException"
      - "It fails to compile"
    answer: 1
    explanation: |
      @Audited declares no @Retention, so it defaults to CLASS retention and is not visible at
      runtime. isAnnotationPresent therefore returns false. Adding @Retention(RetentionPolicy.RUNTIME)
      would make it print true.
    ref: "concepts.md#annotations-retention-and-target"

  - id: reflection-annotations-proxies-030
    difficulty: intermediate
    tags: [caching, performance]
    question: |
      Where does most of reflection's per-call cost come from, and what is the standard mitigation?
    options:
      - "Object allocation in getClass(); mitigate by using == instead"
      - "Thread contention; mitigate with volatile"
      - "Network calls; mitigate by caching DNS"
      - "Member lookup by name and access checks; mitigate by resolving Method/Field once and reusing the cached object"
    answer: 3
    explanation: |
      Resolving members by name and validating access dominate reflection cost. The standard fix is to
      look up the Method/Field once, call setAccessible(true) once, cache the object, and reuse it for
      all subsequent invocations rather than re-resolving each time.
    ref: "concepts.md#performance-and-when-to-avoid-reflection"

  - id: reflection-annotations-proxies-031
    difficulty: advanced
    tags: [jep-396, jdk16, encapsulation]
    question: |
      Which JEP made strong encapsulation of JDK internals the DEFAULT, so deep reflection into
      internal packages is denied unless --add-opens is supplied?
    options:
      - "JEP 261 in JDK 9"
      - "JEP 396 in JDK 16"
      - "JEP 416 in JDK 18"
      - "JEP 193 in JDK 9"
    answer: 1
    explanation: |
      JEP 396 ("Strongly Encapsulate JDK Internals by Default") shipped in JDK 16 and flipped the
      default so illegal reflective access to JDK internals is denied unless explicitly opened with
      --add-opens. JEP 261 introduced modules (JDK 9), JEP 403 completed strong encapsulation in JDK
      17, and JEP 416 reimplemented reflection in JDK 18.
    ref: "concepts.md#setaccessible-and-strong-encapsulation"

  - id: reflection-annotations-proxies-032
    difficulty: advanced
    tags: [jep-403, jdk17, illegal-access]
    question: |
      What happened to the --illegal-access command-line flag across JDK versions?
    options:
      - "It was introduced in JDK 17 and remains the recommended way to enable reflection"
      - "Its default became deny in JDK 16, then in JDK 17 (JEP 403) it was made obsolete and ignored (removed entirely later, in JDK 22)"
      - "It has always defaulted to deny since JDK 9"
      - "It was renamed to --enable-reflection in JDK 21"
    answer: 1
    explanation: |
      During JDK 9–15 the default was permit (with a warning). JDK 16 (JEP 396) changed the default to
      deny. JDK 17 (JEP 403) did NOT remove the flag; it made --illegal-access obsolete — the option is
      silently ignored (any value only triggers a warning) and can no longer re-enable deep access. The
      flag was finally removed entirely in JDK 22. From JDK 17 on, deep access requires explicit
      --add-opens or opens directives.
    ref: "concepts.md#setaccessible-and-strong-encapsulation"

  - id: reflection-annotations-proxies-033
    difficulty: advanced
    tags: [jep-416, jdk18, reflection-internals]
    question: |
      Which JDK release re-implemented core reflection (Method, Constructor, Field) on top of
      MethodHandles, removing the old bytecode-generating "inflation" accessor machinery?
    options:
      - "JDK 11"
      - "JDK 16"
      - "JDK 18 (JEP 416)"
      - "JDK 21"
    answer: 2
    explanation: |
      JEP 416 in JDK 18 reimplemented java.lang.reflect Method/Constructor/Field using
      java.lang.invoke.MethodHandle, eliminating the legacy sun.reflect generated accessor classes and
      the inflation mechanism. Behavior is unchanged; startup and maintainability improved.
    ref: "concepts.md#performance-and-when-to-avoid-reflection"

  - id: reflection-annotations-proxies-034
    difficulty: advanced
    tags: [InaccessibleObjectException, jdk9]
    question: |
      In modern JDKs, calling setAccessible(true) on a private member of a type in a module that has
      not opened its package results in what?
    options:
      - "It silently succeeds"
      - "A compile error"
      - "An InaccessibleObjectException (a RuntimeException introduced in Java 9)"
      - "A ClassNotFoundException"
    answer: 2
    explanation: |
      Since Java 9, setAccessible respects module boundaries. If the target package is not opened
      (via opens or --add-opens), setAccessible(true) throws InaccessibleObjectException, a subclass
      of RuntimeException added in Java 9.
    ref: "concepts.md#setaccessible-and-strong-encapsulation"

  - id: reflection-annotations-proxies-035
    difficulty: advanced
    tags: [code-analysis, proxy, class-name]
    question: |
      What will `proxy.getClass().getName()` typically return for a JDK dynamic proxy of interface
      Service (classic classpath scenario)?
    options:
      - "Service"
      - "java.lang.reflect.Proxy"
      - "Something like com.sun.proxy.$Proxy0"
      - "java.lang.Object"
    answer: 2
    explanation: |
      The runtime-generated proxy class has a synthetic name such as com.sun.proxy.$Proxy0 (or a
      per-module name under JPMS). It extends java.lang.reflect.Proxy and implements Service, but its
      class name is the generated $ProxyN name, not the interface's.
    ref: "concepts.md#jdk-dynamic-proxies"

  - id: reflection-annotations-proxies-036
    difficulty: advanced
    tags: [spring, meta-annotation, component]
    question: |
      Does plain JDK reflection (getAnnotation) on a class annotated with Spring's @RestController
      report that @Component is present?
    options:
      - "Yes, JDK reflection recursively resolves meta-annotations"
      - "No, because @RestController has SOURCE retention"
      - "Yes, because @Component has RUNTIME retention"
      - "No; JDK reflection does not see through meta-annotations (except @Inherited up the class hierarchy) — Spring's own merged-annotation search finds @Component"
    answer: 3
    explanation: |
      JDK reflection only reports annotations directly present (plus @Inherited superclass
      annotations). It does not transitively resolve meta-annotations, so it would not report
      @Component on a @RestController class. Spring implements its own recursive merged-annotation
      resolution (AnnotatedElementUtils) to discover @Component transitively.
    ref: "concepts.md#meta-annotations"

  - id: reflection-annotations-proxies-037
    difficulty: advanced
    tags: [final-field, reflection, jit]
    question: |
      Why can reflectively setting a non-static `final` field appear to "not take effect" even after
      setAccessible(true)?
    options:
      - "The JIT/compiler may have inlined the constant value at use sites, so reads may not observe the mutated field; modern JDKs also increasingly reject such writes"
      - "final fields cannot be read reflectively"
      - "The field is automatically reset to its default after each write"
      - "final fields are stored in a separate immutable heap that reflection cannot reach"
    answer: 0
    explanation: |
      Constant final fields can be inlined by the compiler/JIT at their use sites, so a later
      reflective mutation may not be observed by already-inlined reads. static final writes are
      effectively blocked, and modern JDKs increasingly reject reflective final writes altogether.
      Treat mutating final as unsupported.
    ref: "concepts.md#working-with-fields-methods-and-constructors"

  - id: reflection-annotations-proxies-038
    difficulty: advanced
    tags: [graalvm, native-image, reflection]
    question: |
      Why do compile-time annotation processors (MapStruct, Dagger) work better than runtime
      reflection under GraalVM native image?
    options:
      - "Native image runs annotation processors at runtime"
      - "Native image cannot generate any code"
      - "Runtime reflection requires explicit reflect-config.json registration and is fragile under closed-world AOT, whereas generated code needs no runtime reflection at all"
      - "Reflection is faster in native image than generated code"
    answer: 2
    explanation: |
      GraalVM native image uses closed-world AOT compilation; runtime reflection targets must be
      declared in reflect-config.json and are fragile. Compile-time code generation produces ordinary
      classes with no runtime reflection, so it works cleanly with native image. This is a key reason
      Micronaut/Quarkus favor compile-time DI over Spring's traditional runtime reflection.
    ref: "concepts.md#building-annotation-processors"

  - id: reflection-annotations-proxies-039
    difficulty: advanced
    tags: [code-analysis, invoke, exception]
    question: |
      ```java
      Method m = List.class.getMethod("add", Object.class);
      List<String> list = new ArrayList<>();
      m.invoke(list, 42);          // note: Integer, not String
      String s = list.get(0);      // line X
      ```
      What best describes the outcome?
    options:
      - "m.invoke throws IllegalArgumentException immediately because 42 is not a String"
      - "m.invoke succeeds (generics are erased so add(Object) accepts Integer); the ClassCastException occurs at line X when retrieving as String"
      - "It fails to compile because add is not found"
      - "m.invoke throws InvocationTargetException wrapping a ClassCastException"
    answer: 1
    explanation: |
      Because of type erasure, List.add is really add(Object), so invoking it with an Integer
      succeeds — reflection bypasses the compile-time generic check (heap pollution). The
      ClassCastException surfaces later at line X when the synthetic cast to String executes on
      list.get(0).
    ref: "concepts.md#working-with-fields-methods-and-constructors"

  - id: reflection-annotations-proxies-040
    difficulty: advanced
    tags: [varhandle, jep-193, jdk9]
    question: |
      What is the modern, JIT-friendly replacement for reflective field access and sun.misc.Unsafe
      field operations, introduced in Java 9?
    options:
      - "AtomicReference"
      - "WeakReference"
      - "ThreadLocal"
      - "VarHandle (JEP 193)"
    answer: 3
    explanation: |
      VarHandle (JEP 193, Java 9) provides typed, JIT-optimizable access to fields and array elements,
      including atomic and ordered memory operations, as a safe replacement for reflective Field
      access and much of sun.misc.Unsafe.
    ref: "concepts.md#performance-and-when-to-avoid-reflection"

  - id: reflection-annotations-proxies-041
    difficulty: advanced
    tags: [annotation-processing, filer, rounds]
    question: |
      Within an AbstractProcessor's process() method, what does returning `true` signify?
    options:
      - "The processor claims the annotations it declared support for, so subsequent processors will not receive them"
      - "The build should fail"
      - "The processor wants to run again in the same round"
      - "All generated files should be deleted"
    answer: 0
    explanation: |
      Returning true from process() means this processor claims the set of annotations it supports;
      other processors will not be given those annotations. Returning false lets them pass through to
      other processors. Code generation happens via the Filer across processing rounds.
    ref: "concepts.md#building-annotation-processors"

  - id: reflection-annotations-proxies-042
    difficulty: advanced
    tags: [cglib, bytebuddy, modern]
    question: |
      Which statement about CGLIB versus ByteBuddy in modern frameworks is accurate?
    options:
      - "CGLIB is part of the JDK, while ByteBuddy is proprietary"
      - "ByteBuddy has largely replaced CGLIB (used by Hibernate, Mockito, etc.) because CGLIB struggles on modern JDKs, though both share the subclassing limitation on final members"
      - "ByteBuddy uses JDK dynamic proxies internally and thus needs interfaces"
      - "CGLIB can proxy final classes while ByteBuddy cannot"
    answer: 1
    explanation: |
      ByteBuddy is the modern successor to the largely-unmaintained CGLIB and is used by Hibernate,
      Mockito, and newer Spring. Both operate by subclassing, so neither can override/intercept final
      classes or final methods. Neither is part of the JDK.
    ref: "concepts.md#dynamic-proxies-versus-cglib"

  - id: reflection-annotations-proxies-043
    difficulty: advanced
    tags: [code-analysis, getFields, inheritance]
    question: |
      ```java
      class A { public int a; private int pa; }
      class B extends A { public int b; private int pb; }
      Field[] fs = B.class.getFields();
      ```
      Which fields appear in fs?
    options:
      - "b and pb only"
      - "b, pb, and a (declared plus public inherited)"
      - "a, pa, b, pb (all fields)"
      - "a and b only (public fields including inherited)"
    answer: 3
    explanation: |
      getFields() returns only public fields, including inherited ones: A.a (inherited public) and
      B.b (public). Private fields pa and pb are excluded. To get all fields declared in B (including
      private, but not inherited) you would use getDeclaredFields().
    ref: "concepts.md#the-reflection-api-and-class-objects"

  - id: reflection-annotations-proxies-044
    difficulty: advanced
    tags: [proxy, single-inheritance, why]
    question: |
      What is the fundamental technical reason a JDK dynamic proxy cannot extend a concrete class?
    options:
      - "The security manager forbids it"
      - "The generated proxy already extends java.lang.reflect.Proxy, and Java permits only single class inheritance, so it can only add interfaces"
      - "Concrete classes cannot be loaded reflectively"
      - "InvocationHandler only supports interface methods syntactically"
    answer: 1
    explanation: |
      The synthesized proxy class extends java.lang.reflect.Proxy. Because Java allows a class to
      extend only one superclass, the proxy cannot also extend your concrete class; it can only
      implement additional interfaces. This is why subclass-based tools (CGLIB/ByteBuddy) are needed
      for classes without interfaces.
    ref: "concepts.md#jdk-dynamic-proxies"

  - id: reflection-annotations-proxies-045
    difficulty: advanced
    tags: [lambdametafactory, performance]
    question: |
      How does LambdaMetafactory help achieve near-direct-call performance for repeated dynamic
      invocation?
    options:
      - "It converts a MethodHandle into an implementation of a functional interface once, after which calls dispatch like a normal virtual call"
      - "It caches reflective Method objects in a ConcurrentHashMap"
      - "It compiles the target method to native code eagerly"
      - "It disables the security manager"
    answer: 0
    explanation: |
      LambdaMetafactory (the same machinery behind lambda expressions) can bind a MethodHandle to a
      functional-interface instance one time; subsequent invocations go through an ordinary
      (JIT-inlinable) interface call rather than the boxing-heavy Method.invoke path. High-performance
      mappers use this technique.
    ref: "concepts.md#performance-and-when-to-avoid-reflection"

  - id: reflection-annotations-proxies-046
    difficulty: advanced
    tags: [annotation-elements, rules]
    question: |
      Which of the following is a LEGAL return type for an annotation element?
    options:
      - "java.util.List<String>"
      - "A two-dimensional array int[][]"
      - "An enum type, another annotation type, Class, String, a primitive, or a one-dimensional array of those"
      - "Any arbitrary reference type, including your own POJO class"
    answer: 2
    explanation: |
      Annotation element types are restricted to primitives, String, Class, enums, other annotation
      types, and one-dimensional arrays of those. Collections like List, multi-dimensional arrays, and
      arbitrary classes are not permitted.
    ref: "concepts.md#annotations-retention-and-target"

  - id: reflection-annotations-proxies-047
    difficulty: advanced
    tags: [code-analysis, forName, initialization]
    question: |
      ```java
      class Config {
          static { System.out.println("init"); }
      }
      // elsewhere:
      Class<?> c = Config.class;          // line 1
      Class<?> d = Class.forName("Config"); // line 2
      ```
      Assuming Config was not previously loaded/initialized, when is "init" printed?
    options:
      - "At line 1 only"
      - "At both line 1 and line 2"
      - "At line 2 only (Class.forName initializes; the class literal does not)"
      - "Never"
    answer: 2
    explanation: |
      A class literal (Config.class) loads the class but does not initialize it, so no static
      initializer runs at line 1. Class.forName(name) initializes by default, so "init" prints at
      line 2. Using the three-arg forName with initialize=false would suppress it.
    ref: "concepts.md#the-reflection-api-and-class-objects"

  - id: reflection-annotations-proxies-048
    difficulty: expert
    tags: [add-opens, module, runtime]
    question: |
      A library performs deep reflection into java.base's java.lang package and runs on JDK 17. Which
      launch configuration makes this work for code on the classpath (unnamed module)?
    options:
      - "--illegal-access=permit"
      - "-Dreflection.enabled=true"
      - "--add-exports java.base/java.lang=ALL-UNNAMED"
      - "--add-opens java.base/java.lang=ALL-UNNAMED"
    answer: 3
    explanation: |
      --illegal-access is obsolete and ignored in JDK 17 (JEP 403), so it cannot re-enable deep access.
      Deep reflection requires opening
      the package: --add-opens java.base/java.lang=ALL-UNNAMED. --add-exports only grants public API
      access (compilation/normal calls), not the setAccessible deep access that opens provides.
    ref: "concepts.md#setaccessible-and-strong-encapsulation"

  - id: reflection-annotations-proxies-049
    difficulty: expert
    tags: [code-analysis, proxy, equals, recursion]
    question: |
      An InvocationHandler naively implements every method by calling
      `method.invoke(realTarget, args)` but forgets to special-case Object methods, and the proxy is
      placed into a HashSet. What is the risk?
    options:
      - "None; HashSet never calls proxy methods"
      - "equals/hashCode are forwarded to the real target, which is usually fine, but if the handler instead re-invoked the method ON THE PROXY it would infinitely recurse and StackOverflowError"
      - "The proxy cannot be stored in a HashSet at all"
      - "It throws InaccessibleObjectException"
    answer: 1
    explanation: |
      hashCode/equals are routed through the handler. Forwarding them to the real target is generally
      safe. The danger is a handler that dispatches Object methods back onto the proxy itself (e.g.,
      method.invoke(proxy, ...)), which re-enters invoke() and causes unbounded recursion /
      StackOverflowError. Handlers must handle Object methods carefully.
    ref: "concepts.md#jdk-dynamic-proxies"

  - id: reflection-annotations-proxies-050
    difficulty: expert
    tags: [boxing, invoke, performance]
    question: |
      Besides lookup cost, which characteristic of Method.invoke specifically penalizes primitive-heavy
      workloads compared to a MethodHandle bound to the exact type?
    options:
      - "invoke acquires a global lock per call"
      - "invoke takes/returns Object and Object[], forcing autoboxing of primitives (allocation and GC pressure) on every call"
      - "invoke recompiles the target method each time"
      - "invoke disables the JIT for the whole thread"
    answer: 1
    explanation: |
      Method.invoke's signature is Object invoke(Object, Object...), so primitive arguments and return
      values must be boxed/unboxed and packed into an Object[] on every call, creating allocation and
      GC pressure. A MethodHandle can be typed to exact primitive signatures, avoiding boxing and
      enabling JIT inlining.
    ref: "concepts.md#performance-and-when-to-avoid-reflection"

  - id: reflection-annotations-proxies-051
    difficulty: expert
    tags: [code-analysis, repeatable, container]
    question: |
      ```java
      @Repeatable(Roles.class)
      @Retention(RUNTIME) @interface Role { String value(); }
      @Retention(RUNTIME) @interface Roles { Role[] value(); }

      @Role("admin") @Role("user") class User {}

      System.out.println(User.class.getAnnotation(Role.class));
      System.out.println(User.class.getAnnotationsByType(Role.class).length);
      ```
      What is printed?
    options:
      - "@Role(admin) then 1"
      - "null then 0"
      - "@Role(admin) then 2"
      - "null then 2"
    answer: 3
    explanation: |
      With two @Role annotations present, the compiler wraps them in the container @Roles, so no single
      @Role is directly present — getAnnotation(Role.class) returns null. getAnnotationsByType(Role.class)
      understands the container and returns both, so length is 2.
    ref: "concepts.md#annotations-retention-and-target"

  - id: reflection-annotations-proxies-052
    difficulty: expert
    tags: [nestmates, jdk11, reflection]
    question: |
      Before JDK 11 nestmates (JEP 181), how did javac enable an outer class to access a private member
      of its nested class, and what did reflection historically expose?
    options:
      - "It generated synthetic bridge/access$ methods, which showed up as extra synthetic methods in getDeclaredMethods()"
      - "It used sun.misc.Unsafe at runtime"
      - "Private nested access was impossible before JDK 11"
      - "It stored members in a shared static map"
    answer: 0
    explanation: |
      Before JDK 11's nestmate attribute (JEP 181), the compiler generated synthetic bridge methods
      (often named access$NNN) to let enclosing and nested classes reach each other's private members
      at the bytecode level. These synthetic methods were visible via getDeclaredMethods(). Nestmates
      let the JVM permit such access directly, and getNestHost/getNestMembers expose the nest.
    ref: "concepts.md#the-reflection-api-and-class-objects"

  - id: reflection-annotations-proxies-053
    difficulty: expert
    tags: [records, sealed, reflection, jdk16, jdk17]
    question: |
      Which pair of reflection methods was added to inspect records and sealed types, and in which
      final releases did those language features arrive?
    options:
      - "getRecordComponents (records, final JDK 16) and getPermittedSubclasses (sealed, final JDK 17)"
      - "getRecordComponents (records, final JDK 14) and getPermittedSubclasses (sealed, final JDK 15)"
      - "getComponents (JDK 11) and getSubtypes (JDK 12)"
      - "getRecordComponents and getPermittedSubclasses both arrived final in JDK 21"
    answer: 0
    explanation: |
      Records were finalized in JDK 16 (JEP 395) and Class.getRecordComponents() reflects their
      components. Sealed classes were finalized in JDK 17 (JEP 409) and Class.getPermittedSubclasses()
      returns the permitted subtypes. (Both had earlier preview stints: records preview in 14/15,
      sealed preview in 15/16.)
    ref: "concepts.md#the-reflection-api-and-class-objects"

  - id: reflection-annotations-proxies-054
    difficulty: expert
    tags: [code-analysis, private-method, invoke]
    question: |
      ```java
      class Secret { private String token() { return "abc"; } }
      Method m = Secret.class.getDeclaredMethod("token");
      Secret s = new Secret();
      String r = (String) m.invoke(s);   // line X
      ```
      Running on the classpath (unnamed module) with no module restrictions, what happens?
    options:
      - "Line X throws IllegalAccessException because setAccessible(true) was not called on the private method"
      - "It prints abc with no extra steps needed"
      - "getDeclaredMethod throws NoSuchMethodException because token is private"
      - "It fails to compile"
    answer: 0
    explanation: |
      getDeclaredMethod finds private methods, so no NoSuchMethodException. But invoking a private
      method requires suppressing access checks first via m.setAccessible(true); without it,
      m.invoke throws IllegalAccessException. (On the classpath in the unnamed module, setAccessible
      would succeed since no module has closed the package.)
    ref: "concepts.md#working-with-fields-methods-and-constructors"

  - id: reflection-annotations-proxies-055
    difficulty: expert
    tags: [proxy, module, jdk9-plus]
    question: |
      When creating a JDK dynamic proxy for a non-public interface in modern JDKs, which constraint
      applies?
    options:
      - "It is impossible; JDK proxies only support public interfaces"
      - "All interfaces must be public and in exported packages regardless of JDK version"
      - "The proxy class is defined in the same package/module as the non-public interface, and all non-public interfaces passed must be in the same package"
      - "You must call --add-opens for every non-public interface"
    answer: 2
    explanation: |
      JDK proxies do support non-public interfaces, but a non-public interface constrains the proxy's
      package: the generated proxy class is defined in the same package (and, since JPMS, module) as
      the non-public interface, and all non-public interfaces in the set must share that package.
      Java 16+ improved defining proxies within specific modules.
    ref: "concepts.md#jdk-dynamic-proxies"

  - id: reflection-annotations-proxies-056
    difficulty: expert
    tags: [code-analysis, inherited, meta]
    question: |
      ```java
      @Inherited @Retention(RUNTIME) @interface Tag {}
      @Tag class Base {}
      class Sub extends Base {}
      interface I {}
      @Tag interface J {}
      class Impl implements J {}

      System.out.println(Sub.class.isAnnotationPresent(Tag.class));   // A
      System.out.println(Impl.class.isAnnotationPresent(Tag.class));  // B
      ```
      What is printed for A and B?
    options:
      - "true, true"
      - "true, false"
      - "false, false"
      - "false, true"
    answer: 1
    explanation: |
      @Inherited causes Sub to inherit @Tag from its superclass Base, so A is true. But @Inherited does
      NOT propagate annotations from implemented interfaces to classes, so Impl does not inherit @Tag
      from J; B is false.
    ref: "concepts.md#meta-annotations"

  - id: reflection-annotations-proxies-057
    difficulty: expert
    tags: [design, trade-off, alternatives]
    question: |
      A service loads a strategy implementation whose class name comes from configuration. Which design
      best balances flexibility and performance for repeated use?
    options:
      - "Call Class.forName + getDeclaredConstructor().newInstance() on every request"
      - "Hardcode all strategies with a giant switch and drop configuration"
      - "Use Method.invoke on a re-looked-up method for every call to stay flexible"
      - "Resolve the Class once at startup, construct/cache the instance (or a MethodHandle/Supplier), then dispatch through a normal interface reference on each request"
    answer: 3
    explanation: |
      The flexible-and-fast pattern is to pay the reflective cost once at startup (resolve the class,
      instantiate, cache behind an interface or Supplier/MethodHandle), then invoke via ordinary
      virtual dispatch on the hot path. Re-resolving and re-invoking reflectively per request wastes
      the lookup cost and loses JIT optimization.
    ref: "concepts.md#performance-and-when-to-avoid-reflection"

  - id: reflection-annotations-proxies-058
    difficulty: expert
    tags: [code-analysis, proxy, self-invocation, cache]
    question: |
      A Spring bean method getUser() is annotated @Cacheable and internally calls this.getUserById(id),
      which is ALSO @Cacheable. External callers invoke getUser(). Which caching actually occurs?
    options:
      - "getUser's cache advice fires (called via the proxy), but getUserById's does NOT, because the internal this.getUserById call bypasses the proxy"
      - "Both getUser and getUserById are cached on every call"
      - "Neither is cached because nesting @Cacheable is illegal"
      - "Only getUserById is cached"
    answer: 0
    explanation: |
      External calls to getUser() go through the proxy, so its @Cacheable advice fires. The internal
      this.getUserById() call is a self-invocation on the raw target and does not pass through the
      proxy, so getUserById's caching advice does not apply. This is the self-invocation limitation.
    ref: "concepts.md#dynamic-proxies-versus-cglib"

  - id: reflection-annotations-proxies-059
    difficulty: expert
    tags: [annotation-processing, lombok, modification]
    question: |
      Regarding the public JSR 269 contract, which statement is correct about what processors may do?
    options:
      - "Processors can freely modify the ASTs of existing source files via the public API"
      - "Processors can only read annotations, never generate anything"
      - "Processors run after the class is loaded and can rewrite loaded classes"
      - "Processors may generate new source/class files via the Filer but cannot modify existing files through the public API; Lombok reaches into compiler internals to mutate ASTs, which makes it fragile across JDKs"
    answer: 3
    explanation: |
      The public annotation-processing contract supports generating new files (via Filer) but not
      modifying existing source through the API. Lombok bypasses this by manipulating the compiler's
      internal ASTs, which is why Lombok breaks more readily across JDK upgrades. Processing happens at
      compile time, not after loading.
    ref: "concepts.md#building-annotation-processors"

  - id: reflection-annotations-proxies-060
    difficulty: expert
    tags: [code-analysis, primitive, method-lookup]
    question: |
      ```java
      class C {
          void f(int x)     { System.out.println("int"); }
          void f(Integer x) { System.out.println("Integer"); }
      }
      Method m = C.class.getMethod("f", Integer.class);
      m.invoke(new C(), 5);
      ```
      What is printed?
    options:
      - "int"
      - "Integer"
      - "It throws NoSuchMethodException because of the ambiguous overload"
      - "It fails to compile"
    answer: 1
    explanation: |
      Reflective lookup uses exact declared parameter types. getMethod("f", Integer.class) selects the
      f(Integer) overload specifically, so "Integer" is printed. Requesting int.class would select
      f(int). Autoboxing does not influence which overload reflection resolves.
    ref: "concepts.md#working-with-fields-methods-and-constructors"
