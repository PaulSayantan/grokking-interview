topic: "Object Class Contract: equals, hashCode, toString and clone"
domain: java-jvm
topic_slug: object-methods-equality
version: 1
questions:
  - id: object-methods-equality-001
    difficulty: beginner
    tags: [equals, identity, basics]
    question: |
      What does the `==` operator compare when applied to two reference-type variables?
    options:
      - "Whether the two references point to the same object in memory (reference identity)"
      - "Whether the two objects are logically equal by comparing their fields"
      - "Whether the two objects have the same hashCode"
      - "Whether the two objects are the same class"
    answer: 0
    explanation: |
      For reference types, `==` compares references (identity): it is true only when both
      variables point at the exact same heap object. Logical/value equality is what
      `equals` is meant to express; field comparison and hashCode are not what `==` does.
    ref: "concepts.md#reference-identity-versus-logical-equality"

  - id: object-methods-equality-002
    difficulty: beginner
    tags: [equals, default-behavior]
    question: |
      What does the default `Object.equals(Object)` implementation do if you never override it?
    options:
      - "Returns `this == obj`, i.e. reference identity"
      - "Compares all fields for value equality using reflection"
      - "Compares the two objects' hashCodes"
      - "Always returns false unless the objects are the same class"
    answer: 0
    explanation: |
      `Object.equals` is defined as `this == obj` — pure identity. That is why value classes
      must override it; otherwise two logically-equal instances are considered unequal.
    ref: "concepts.md#reference-identity-versus-logical-equality"

  - id: object-methods-equality-003
    difficulty: beginner
    tags: [string, equals]
    question: |
      ```java
      String a = new String("hi");
      String b = new String("hi");
      System.out.println(a == b);
      System.out.println(a.equals(b));
      ```
      What is printed?
    options:
      - "true / true"
      - "false / false"
      - "false / true"
      - "true / false"
    answer: 2
    explanation: |
      `new String(...)` creates distinct objects, so `a == b` is false. `String` overrides
      `equals` for character-by-character value equality, so `a.equals(b)` is true.
    ref: "concepts.md#reference-identity-versus-logical-equality"

  - id: object-methods-equality-004
    difficulty: beginner
    tags: [equals-contract, properties]
    question: |
      Which set correctly names the five properties of the `equals` contract for non-null references?
    options:
      - "Reflexive, symmetric, transitive, consistent, non-nullity"
      - "Commutative, associative, distributive, idempotent, total"
      - "Reflexive, antisymmetric, transitive, total, consistent"
      - "Symmetric, transitive, ordered, hashed, cached"
    answer: 0
    explanation: |
      The Object Javadoc lists reflexive (x.equals(x)), symmetric, transitive, consistent
      (stable across calls), and non-nullity (x.equals(null) is false). The other lists mix
      in ordering or algebraic terms that do not apply.
    ref: "concepts.md#the-equals-contract"

  - id: object-methods-equality-005
    difficulty: beginner
    tags: [equals-hashcode, contract]
    question: |
      The primary rule linking `equals` and `hashCode` is:
    options:
      - "If two objects are equal per `equals`, they must have the same `hashCode`"
      - "If two objects have equal hashCodes they must be equal"
      - "Unequal objects must have different hashCodes"
      - "hashCode must always return a positive number"
    answer: 0
    explanation: |
      The contract is one-directional: equal objects MUST return equal hashCodes. The
      converse is false — equal hashCodes do not imply equality (collisions are legal), and
      hashCodes may legally be negative.
    ref: "concepts.md#the-hashcode-contract-and-the-equals-hashcode-link"

  - id: object-methods-equality-006
    difficulty: beginner
    tags: [tostring]
    question: |
      What does the default `Object.toString()` return?
    options:
      - "An empty string"
      - "The object's memory address in decimal"
      - "`getClass().getName() + \"@\" + Integer.toHexString(hashCode())`"
      - "A JSON representation of all fields"
    answer: 2
    explanation: |
      Default `toString` is the class name, an `@`, and the hashCode in hex. The hex value is
      the (identity) hash in hexadecimal, not a raw memory address, and it is not JSON.
    ref: "concepts.md#tostring"

  - id: object-methods-equality-007
    difficulty: beginner
    tags: [clone, cloneable]
    question: |
      What kind of interface is `java.lang.Cloneable`?
    options:
      - "A marker interface with no methods that changes how `Object.clone()` behaves"
      - "A functional interface with a single `clone()` method"
      - "An abstract class providing a default deep-copy"
      - "A sealed interface permitting only JDK collection types"
    answer: 0
    explanation: |
      `Cloneable` declares no methods. It is a marker: if a class implements it,
      `Object.clone()` performs a shallow field copy instead of throwing
      `CloneNotSupportedException`. It does not itself declare `clone()`.
    ref: "concepts.md#clone-and-cloneable-pitfalls"

  - id: object-methods-equality-008
    difficulty: beginner
    tags: [records, version]
    question: |
      In which JDK release were records finalized (made a permanent, non-preview feature)?
    options:
      - "JDK 14"
      - "JDK 15"
      - "JDK 16"
      - "JDK 17"
    answer: 2
    explanation: |
      Records were previewed in JDK 14 (JEP 359) and 15 (JEP 384) and finalized in JDK 16
      (JEP 395). JDK 17 finalized sealed classes, not records.
    ref: "concepts.md#records-auto-generate-equals-hashcode-and-tostring"

  - id: object-methods-equality-009
    difficulty: beginner
    tags: [records, generated-methods]
    question: |
      For `public record Point(int x, int y) {}`, which methods does the compiler auto-generate?
    options:
      - "`equals`, `hashCode`, `toString`, accessors, and a canonical constructor"
      - "Only a constructor and getters"
      - "Only `equals` and `hashCode`"
      - "Nothing; you must write everything yourself"
    answer: 0
    explanation: |
      A record generates the canonical constructor, one accessor per component (`x()`, `y()`),
      plus contract-correct `equals`, `hashCode`, and `toString` derived from the components.
    ref: "concepts.md#records-auto-generate-equals-hashcode-and-tostring"

  - id: object-methods-equality-010
    difficulty: beginner
    tags: [equals, null]
    question: |
      According to the equals contract, what must `x.equals(null)` do for a non-null `x`?
    options:
      - "Throw NullPointerException"
      - "Return true"
      - "Return false"
      - "Return the result of `x == null`, which may vary"
    answer: 2
    explanation: |
      Non-nullity requires `x.equals(null)` to return false and never throw. Using
      `instanceof` for the type check gives this for free, since `null instanceof T` is false.
    ref: "concepts.md#the-equals-contract"

  - id: object-methods-equality-011
    difficulty: beginner
    tags: [tostring, string-valueof]
    question: |
      What does `String.valueOf(obj)` return when `obj` is `null`?
    options:
      - "It throws NullPointerException"
      - "The empty string \"\""
      - "The four-character string \"null\""
      - "The string \"None\""
    answer: 2
    explanation: |
      `String.valueOf(Object)` is null-safe and returns the literal `"null"` for a null
      argument, whereas calling `obj.toString()` directly on null would throw NPE.
    ref: "concepts.md#tostring"

  - id: object-methods-equality-012
    difficulty: beginner
    tags: [records, accessors]
    question: |
      For a record component named `name`, what is the generated accessor method called?
    options:
      - "`name()`"
      - "`getName()`"
      - "`readName()`"
      - "`fetchName()`"
    answer: 0
    explanation: |
      Records use component-named accessors with no `get` prefix: the accessor for `name` is
      `name()`. This differs from the JavaBeans `getName()` convention.
    ref: "concepts.md#records-auto-generate-equals-hashcode-and-tostring"

  - id: object-methods-equality-013
    difficulty: intermediate
    tags: [integer-cache, boxing]
    question: |
      ```java
      Integer a = 127, b = 127;
      Integer c = 128, d = 128;
      System.out.println((a == b) + " " + (c == d));
      ```
      What is printed?
    options:
      - "true true"
      - "false false"
      - "true false"
      - "false true"
    answer: 2
    explanation: |
      The JLS-mandated Integer cache reuses boxed objects for -128..127, so `a == b` is true.
      128 is outside the cache, producing distinct objects, so `c == d` is false. Value
      comparison should use `.equals` or unboxing.
    ref: "concepts.md#reference-identity-versus-logical-equality"

  - id: object-methods-equality-014
    difficulty: intermediate
    tags: [hashmap, missing-hashcode]
    question: |
      A class overrides `equals` to compare fields but does NOT override `hashCode`. What
      happens when you `put` an instance in a `HashMap` and later `get` with an equal instance?
    options:
      - "The get usually returns null because the two instances land in different buckets"
      - "The map throws IllegalStateException on put"
      - "It works fine; HashMap only uses equals"
      - "The map falls back to a linear scan and finds it"
    answer: 0
    explanation: |
      Without overriding `hashCode`, the inherited identity-based hash differs between the two
      instances, so they map to different buckets; `get` looks in the wrong bucket and misses.
      HashMap does not linearly scan the whole table.
    ref: "concepts.md#the-hashcode-contract-and-the-equals-hashcode-link"

  - id: object-methods-equality-015
    difficulty: intermediate
    tags: [equals, override-vs-overload]
    question: |
      ```java
      class P {
          int v;
          public boolean equals(P other) { return v == other.v; } // note the param type
      }
      ```
      Why is this implementation dangerous?
    options:
      - "It overloads rather than overrides `equals(Object)`, so collections call Object's identity equals"
      - "It will not compile because equals must be public"
      - "It throws NullPointerException for equal objects"
      - "It breaks reflexivity"
    answer: 0
    explanation: |
      Because the parameter is `P`, not `Object`, this is a new overloaded method; it does not
      override `Object.equals(Object)`. Collections and `List.contains` call `equals(Object)`,
      which still resolves to identity. Always use `@Override` and an `Object` parameter.
    ref: "concepts.md#the-equals-contract"

  - id: object-methods-equality-016
    difficulty: intermediate
    tags: [hashcode, constant]
    question: |
      Is `@Override public int hashCode() { return 42; }` a violation of the hashCode contract?
    options:
      - "Yes, because equal objects might get different hashCodes"
      - "Yes, because hashCode must be unique per object"
      - "No, and it has no performance impact due to treeification"
      - "No, it is contract-valid but degrades hash collections to poor performance"
    answer: 3
    explanation: |
      A constant satisfies the contract (equal objects trivially share the hash, and unequal
      objects are permitted to collide). But every element falls into one bucket, degrading
      lookups toward O(n) (O(log n) if the bucket treeifies). It is legal but harmful.
    ref: "concepts.md#the-hashcode-contract-and-the-equals-hashcode-link"

  - id: object-methods-equality-017
    difficulty: intermediate
    tags: [equals, instanceof-null]
    question: |
      Why is `if (!(o instanceof MyType))` a convenient first check in `equals`?
    options:
      - "It handles the null case (null instanceof T is false) and the type check in one test"
      - "It is faster than `==`"
      - "It automatically calls hashCode"
      - "It guarantees symmetry with subclasses"
    answer: 0
    explanation: |
      `instanceof` returns false for null, so a single `instanceof` test rejects both nulls and
      wrong types, satisfying non-nullity without a separate null check. It does not by itself
      guarantee symmetry when subclasses add state.
    ref: "concepts.md#the-equals-contract"

  - id: object-methods-equality-018
    difficulty: intermediate
    tags: [clone, shallow-copy]
    question: |
      What copy semantics does `Object.clone()` provide by default for a `Cloneable` class?
    options:
      - "A deep copy of the entire object graph"
      - "A shallow copy: field values are copied, so reference fields are shared with the original"
      - "A copy that re-runs the no-arg constructor"
      - "An immutable snapshot"
    answer: 1
    explanation: |
      `Object.clone` copies each field's value. For reference fields that means the clone and
      the original share the same referenced objects (shallow). Deep copies require manually
      cloning mutable reference fields. No constructor is invoked.
    ref: "concepts.md#clone-and-cloneable-pitfalls"

  - id: object-methods-equality-019
    difficulty: intermediate
    tags: [clone, alternatives]
    question: |
      Effective Java recommends which alternatives to implementing `Cloneable`/`clone`?
    options:
      - "A copy constructor or a static copy factory method"
      - "Serialization round-trips only"
      - "Reflection-based field copying"
      - "Overriding finalize to duplicate state"
    answer: 0
    explanation: |
      Copy constructors (e.g. `new ArrayList<>(other)`) and static copy factories invoke
      constructors, work with final fields, accept interface types, don't need `Cloneable`, and
      avoid the checked exception — the preferred pattern over `clone`.
    ref: "concepts.md#clone-and-cloneable-pitfalls"

  - id: object-methods-equality-020
    difficulty: intermediate
    tags: [records, immutability]
    question: |
      Which statement about records is correct?
    options:
      - "Records can extend another class to reuse its fields"
      - "Record components are final, and a record class is implicitly final"
      - "Records are mutable value holders by default"
      - "Records cannot implement interfaces"
    answer: 1
    explanation: |
      Record components are final and records are implicitly final (cannot be subclassed) and
      cannot extend a class (they extend java.lang.Record). They CAN implement interfaces. This
      immutability is what makes their generated equals/hashCode dependable.
    ref: "concepts.md#records-auto-generate-equals-hashcode-and-tostring"

  - id: object-methods-equality-021
    difficulty: intermediate
    tags: [hashcode, objects-hash]
    question: |
      Why is `Objects.hash(a, b, c)` discouraged on a performance-critical hashing path?
    options:
      - "It produces non-deterministic results"
      - "It violates the hashCode contract"
      - "It is not available before Java 11"
      - "It allocates a varargs array and boxes primitive arguments"
    answer: 3
    explanation: |
      `Objects.hash` takes varargs (`Object...`), so it allocates an array and autoboxes any
      primitives on every call. For hot paths, compute the hash manually with the
      `31 * result + fieldHash` idiom. It is contract-correct and available since Java 7.
    ref: "concepts.md#the-hashcode-contract-and-the-equals-hashcode-link"

  - id: object-methods-equality-022
    difficulty: intermediate
    tags: [pattern-matching, version, equals]
    question: |
      Pattern matching for `instanceof`, which lets `equals` be written as
      `o instanceof Point p && ...`, was finalized in which JDK?
    options:
      - "JDK 11"
      - "JDK 14"
      - "JDK 16"
      - "JDK 21"
    answer: 2
    explanation: |
      Pattern matching for `instanceof` was previewed in JDK 14/15 and finalized in JDK 16
      (JEP 394). It binds the cast variable when the test passes, removing the explicit cast.
    ref: "concepts.md#the-equals-contract"

  - id: object-methods-equality-023
    difficulty: intermediate
    tags: [tostring, best-practice]
    question: |
      Which is the best practice regarding `toString` output?
    options:
      - "Always make it a strict machine-parseable format so callers can parse it"
      - "Provide programmatic accessors for the data and treat the string format as parseable only if documented as a contract"
      - "Never include field values, only the class name"
      - "Return the same as hashCode in hex"
    answer: 1
    explanation: |
      Callers should never have to parse `toString`; expose accessors instead. If you DO commit
      to a parseable format, document it in the Javadoc because it then becomes an API contract
      you must maintain.
    ref: "concepts.md#tostring"

  - id: object-methods-equality-024
    difficulty: intermediate
    tags: [equals, mutable-key]
    question: |
      You use a mutable object as a `HashMap` key, then mutate a field that participates in
      `equals`/`hashCode`. What is the most likely outcome?
    options:
      - "The map automatically rehashes and moves the entry"
      - "A ConcurrentModificationException is thrown"
      - "Nothing changes; keys are copied on insert"
      - "The entry becomes unreachable: get/remove with the mutated key look in the wrong bucket"
    answer: 3
    explanation: |
      HashMap does not observe key mutations. The entry stays in the bucket chosen at insertion
      time, but the new hashCode routes lookups to a different bucket, so the entry is
      effectively lost (a leak). Use immutable keys.
    ref: "concepts.md#consequences-of-breaking-the-contract-in-hash-collections"

  - id: object-methods-equality-025
    difficulty: intermediate
    tags: [equals, arrays]
    question: |
      To compare two `int[]` fields for value equality inside `equals`, you should use:
    options:
      - "`==`"
      - "`array1.equals(array2)`"
      - "`Arrays.equals(array1, array2)`"
      - "`Objects.equals(array1, array2)`"
    answer: 2
    explanation: |
      Arrays inherit identity `equals`, so `==` and `array.equals` compare references.
      `Objects.equals` also just delegates to that identity `equals`. `Arrays.equals` compares
      element-by-element (use `Arrays.deepEquals` for nested arrays).
    ref: "concepts.md#the-equals-contract"

  - id: object-methods-equality-026
    difficulty: intermediate
    tags: [hashcode, multiplier-31]
    question: |
      Why is 31 the conventional multiplier in hand-written `hashCode` implementations?
    options:
      - "It is the largest prime that fits in a byte"
      - "It is an odd prime and `31 * i` optimizes to `(i << 5) - i`, aiding the JIT"
      - "It guarantees no collisions"
      - "The hashCode contract mandates 31"
    answer: 1
    explanation: |
      31 is an odd prime that gives good distribution, and `31 * i == (i << 5) - i`, which the
      JIT can implement as a shift and subtract. It is a convention, not a contract requirement,
      and it does not guarantee collision-freedom.
    ref: "concepts.md#the-hashcode-contract-and-the-equals-hashcode-link"

  - id: object-methods-equality-027
    difficulty: intermediate
    tags: [equals, double]
    question: |
      ```java
      System.out.println(0.0 == -0.0);
      System.out.println(Double.valueOf(0.0).equals(-0.0));
      ```
      What is printed?
    options:
      - "true / true"
      - "true / false"
      - "false / true"
      - "false / false"
    answer: 1
    explanation: |
      `0.0 == -0.0` is true (numeric comparison). `Double.equals` compares raw bit patterns via
      `doubleToLongBits`, and +0.0 and -0.0 have different bit patterns, so `equals` returns
      false — deliberately, so hash collections stay consistent.
    ref: "concepts.md#reference-identity-versus-logical-equality"

  - id: object-methods-equality-028
    difficulty: intermediate
    tags: [records, override]
    question: |
      Can you override the compiler-generated `equals`/`hashCode`/`toString` of a record?
    options:
      - "No, they are final in records"
      - "Only `toString` can be overridden"
      - "Only if the record implements Comparable"
      - "Yes, you may override them, but you must still keep equals and hashCode consistent yourself"
    answer: 3
    explanation: |
      You may override any of the generated methods (e.g. to hide a secret in `toString`). But
      the language only auto-generates them; once you override `equals` you must keep `hashCode`
      consistent, exactly as with any class.
    ref: "concepts.md#records-auto-generate-equals-hashcode-and-tostring"

  - id: object-methods-equality-029
    difficulty: intermediate
    tags: [equals, string-intern]
    question: |
      ```java
      String a = "hi";
      String b = "hi";
      System.out.println(a == b);
      ```
      With two string *literals*, what is printed and why?
    options:
      - "false, because Strings are always distinct objects"
      - "true, because identical string literals are interned into the same pooled object"
      - "It depends on the JVM and is undefined"
      - "It throws because literals cannot be compared with =="
    answer: 1
    explanation: |
      Compile-time string literals are interned into the string constant pool, so identical
      literals refer to the same object; `a == b` is true. This differs from `new String("hi")`,
      which forces a fresh object. Relying on this for equality is still bad practice.
    ref: "concepts.md#reference-identity-versus-logical-equality"

  - id: object-methods-equality-030
    difficulty: intermediate
    tags: [clone, arrays]
    question: |
      Which statement about `array.clone()` is accurate?
    options:
      - "It performs a deep copy including all element objects"
      - "It throws CloneNotSupportedException for object arrays"
      - "It is discouraged; use a loop instead"
      - "It returns a shallow copy of the array; element references are shared with the original"
    answer: 3
    explanation: |
      Arrays support `clone()` cleanly and it is the recommended way to copy an array, but it is
      shallow: the new array holds the same element references. For a deep copy you must copy
      elements individually.
    ref: "concepts.md#clone-and-cloneable-pitfalls"

  - id: object-methods-equality-031
    difficulty: advanced
    tags: [symmetry, inheritance]
    question: |
      ```java
      final class CIString {
          private final String s;
          CIString(String s) { this.s = s; }
          public boolean equals(Object o) {
              if (o instanceof CIString c) return s.equalsIgnoreCase(c.s);
              if (o instanceof String str) return s.equalsIgnoreCase(str);
              return false;
          }
      }
      ```
      What contract property does this violate?
    options:
      - "Reflexivity, because a CIString does not equal itself"
      - "Symmetry, because cis.equals(\"abc\") can be true while \"abc\".equals(cis) is false"
      - "Consistency, because results change between calls"
      - "Non-nullity, because it throws on null"
    answer: 1
    explanation: |
      By trying to equal a plain `String`, `cis.equals("abc")` may return true, but
      `String.equals` knows nothing of CIString, so `"abc".equals(cis)` is false — asymmetric.
      An object should never attempt to be equal to instances of an unrelated class.
    ref: "concepts.md#symmetry-transitivity-and-the-inheritance-trap"

  - id: object-methods-equality-032
    difficulty: advanced
    tags: [instanceof-vs-getclass, liskov]
    question: |
      Which statement best contrasts using `instanceof` versus `getClass()` in `equals`?
    options:
      - "getClass() preserves the Liskov substitution principle; instanceof always breaks it"
      - "instanceof lets a subclass instance equal a superclass instance (risking symmetry/transitivity if the subclass adds state); getClass() forbids cross-class equality but violates Liskov substitution"
      - "They are functionally identical"
      - "instanceof throws for null while getClass() does not"
    answer: 1
    explanation: |
      `instanceof` permits value equality across the inheritance boundary but can break
      symmetry/transitivity when subclasses add significant state. `getClass()` requires the
      exact same class, which breaks substitutability (e.g. proxies, Hibernate) and thus the
      Liskov principle. Neither is universally correct; composition avoids the dilemma.
    ref: "concepts.md#symmetry-transitivity-and-the-inheritance-trap"

  - id: object-methods-equality-033
    difficulty: advanced
    tags: [hashmap, internals]
    question: |
      When `HashMap` looks up a key, in what order does it use hash and `equals` within a bucket?
    options:
      - "It calls equals on every entry in the table, ignoring hashCode"
      - "It calls hashCode only; equals is never used"
      - "It compares equals first, then hashCode as a tie-breaker"
      - "It spreads the hash to find the bucket, then within the bucket compares hash first and only calls equals when hashes match"
    answer: 3
    explanation: |
      HashMap spreads the hash (`h ^ (h >>> 16)`), masks to the bucket index, then walks that
      bucket comparing the stored hash first (cheap) and calling `equals` only when hashes match.
      A bad hashCode routes to the wrong bucket entirely, so equals never gets a chance.
    ref: "concepts.md#consequences-of-breaking-the-contract-in-hash-collections"

  - id: object-methods-equality-034
    difficulty: advanced
    tags: [treeification, hashmap, version]
    question: |
      Regarding HashMap treeification (introduced in Java 8), which pair of thresholds is correct?
    options:
      - "A bucket treeifies at 8 entries, but only if table capacity is at least 64; otherwise it resizes"
      - "A bucket treeifies at 16 entries regardless of capacity"
      - "The whole map converts to a tree once it holds 64 entries"
      - "Treeification happens at 2 entries per bucket"
    answer: 0
    explanation: |
      With Java 8, a bucket converts its linked list to a red-black tree when it reaches
      TREEIFY_THRESHOLD (8) AND the table capacity is at least MIN_TREEIFY_CAPACITY (64). Below
      64, the map resizes instead. This bounds pathological buckets at O(log n).
    ref: "concepts.md#consequences-of-breaking-the-contract-in-hash-collections"

  - id: object-methods-equality-035
    difficulty: advanced
    tags: [compareto, equals, treeset]
    question: |
      ```java
      Set<BigDecimal> s = new TreeSet<>();
      s.add(new BigDecimal("1.0"));
      s.add(new BigDecimal("1.00"));
      System.out.println(s.size());
      ```
      What is printed, and why does a HashSet differ?
    options:
      - "2, because BigDecimal equals treats them as different, and TreeSet agrees"
      - "1, because TreeSet uses compareTo (which returns 0 for 1.0 vs 1.00) so it treats them as duplicates; a HashSet uses equals and would hold 2"
      - "2, and a HashSet would also hold 2"
      - "1, and a HashSet would also hold 1"
    answer: 1
    explanation: |
      `TreeSet` decides membership via `compareTo`, and `new BigDecimal("1.0").compareTo("1.00")`
      is 0, so the second add is a duplicate → size 1. `HashSet` uses `equals`, which for
      BigDecimal considers scale, so they are unequal → size 2. This is the classic
      equals/compareTo inconsistency.
    ref: "concepts.md#consequences-of-breaking-the-contract-in-hash-collections"

  - id: object-methods-equality-036
    difficulty: advanced
    tags: [inheritance, composition]
    question: |
      According to Effective Java, how do you add a value-significant field (e.g. color) to a
      value class (e.g. Point) without violating the equals contract?
    options:
      - "Subclass Point and override equals using getClass()"
      - "Subclass Point and override equals using instanceof"
      - "Favor composition: give the new class a Point field plus a view method, instead of extending Point"
      - "Make Point's equals non-symmetric on purpose"
    answer: 2
    explanation: |
      There is no way to extend an instantiable class and add a value component while preserving
      the equals contract. The recommended fix is composition: ColorPoint HAS-A Point plus a
      Color, exposing `asPoint()` when needed. An abstract (non-instantiable) superclass also
      avoids the problem.
    ref: "concepts.md#symmetry-transitivity-and-the-inheritance-trap"

  - id: object-methods-equality-037
    difficulty: advanced
    tags: [clone, final-fields]
    question: |
      Why do `final` fields conflict with a `clone()` implementation that needs deep copying?
    options:
      - "final fields cannot be read inside clone"
      - "final fields make clone throw CloneNotSupportedException"
      - "There is no conflict; final fields clone perfectly"
      - "clone must reassign a field to a fresh deep copy, but a final field cannot be reassigned after super.clone()"
    answer: 3
    explanation: |
      After `super.clone()` copies field values shallowly, a correct deep clone must overwrite
      mutable reference fields with fresh copies. If such a field is `final`, it cannot be
      reassigned, so the clone architecture is incompatible with the immutability you want —
      one of the reasons clone is discouraged.
    ref: "concepts.md#clone-and-cloneable-pitfalls"

  - id: object-methods-equality-038
    difficulty: advanced
    tags: [clone, constructor]
    question: |
      Which statement about object construction and `clone()` is true?
    options:
      - "clone() invokes the no-argument constructor"
      - "clone() invokes the canonical constructor"
      - "clone() produces an object WITHOUT invoking any constructor, so constructor-enforced invariants can be bypassed"
      - "clone() invokes every constructor in the hierarchy"
    answer: 2
    explanation: |
      `Object.clone` creates the new instance by copying fields, not by calling a constructor.
      Any invariant normally established in a constructor is therefore not re-checked, which can
      leave a clone in an invalid state if not handled carefully.
    ref: "concepts.md#clone-and-cloneable-pitfalls"

  - id: object-methods-equality-039
    difficulty: advanced
    tags: [clone, covariant-return]
    question: |
      Since Java 5, what improvement can you make to a `clone()` override's signature?
    options:
      - "Declare it to throw a narrower unchecked exception only"
      - "Mark it default in an interface"
      - "Make it static"
      - "Use a covariant return type so `clone()` returns your concrete type instead of Object"
    answer: 3
    explanation: |
      Covariant return types (Java 5) let an overriding `clone()` return the subclass type
      directly, sparing callers a cast. It improves ergonomics but does not solve clone's deeper
      problems (shallow copy, no constructor, final-field conflict).
    ref: "concepts.md#clone-and-cloneable-pitfalls"

  - id: object-methods-equality-040
    difficulty: advanced
    tags: [equals, consistency, mutable-state]
    question: |
      Which design most reliably keeps `equals` consistent (repeated calls give the same result)?
    options:
      - "Base equals on immutable, in-memory, value-defining fields only"
      - "Base equals on remotely-fetched or time-varying data"
      - "Base equals on System.currentTimeMillis()"
      - "Base equals on the object's identity hashCode"
    answer: 0
    explanation: |
      Consistency requires that the data used by equals not change unexpectedly. Basing equals on
      unreliable or mutable external resources (e.g. network state, time) can flip results between
      calls. The Javadoc explicitly warns against equals relying on unreliable resources.
    ref: "concepts.md#the-equals-contract"

  - id: object-methods-equality-041
    difficulty: advanced
    tags: [hashcode, cached]
    question: |
      For an immutable class whose `hashCode` is expensive, a common optimization is to:
    options:
      - "Return a constant to avoid computation"
      - "Recompute it on every call to stay consistent"
      - "Exclude some fields to make it cheaper, even those used by equals"
      - "Lazily compute and cache the hashCode in a field (safe because the object is immutable)"
    answer: 3
    explanation: |
      Because the object is immutable, the hashCode never changes, so it can be computed once and
      cached (lazy initialization is fine). A constant would harm distribution, and excluding
      fields that equals uses would break the equals→hashCode link.
    ref: "concepts.md#the-hashcode-contract-and-the-equals-hashcode-link"

  - id: object-methods-equality-042
    difficulty: advanced
    tags: [transitivity, mixed-comparison]
    question: |
      Why does a superclass equals using `instanceof` tend to break *transitivity* once two
      different subclasses each add their own state?
    options:
      - "Because instanceof is slower than getClass()"
      - "A parent P can be 'equal' to child A and to child B (ignoring their extra state), yet A and B are not equal to each other"
      - "Because hashCode is not overridden"
      - "Because null handling differs"
    answer: 1
    explanation: |
      If P.equals compares only the shared field, P can equal both a ColorPoint A and a
      ColorPoint B whose colors differ, while A.equals(B) is false. Then P~A and P~B but A≁B —
      transitivity is violated. This is the core inheritance trap.
    ref: "concepts.md#symmetry-transitivity-and-the-inheritance-trap"

  - id: object-methods-equality-043
    difficulty: advanced
    tags: [tostring, identity-hash]
    question: |
      In the default `Object.toString`, the hex value after `@` corresponds to what?
    options:
      - "The object's physical memory address"
      - "The result of `hashCode()` (the identity hash unless overridden) rendered in hex"
      - "A monotonically increasing object counter"
      - "The size of the object in bytes"
    answer: 1
    explanation: |
      The suffix is `Integer.toHexString(hashCode())`. It reflects the object's hashCode — the
      identity hash if hashCode is not overridden — not a memory address. GC can move objects, so
      addresses would be unstable anyway.
    ref: "concepts.md#tostring"

  - id: object-methods-equality-044
    difficulty: advanced
    tags: [equals, objects-equals]
    question: |
      Inside `equals`, comparing two possibly-null object fields is best done with:
    options:
      - "`Objects.equals(f1, f2)` which is null-safe"
      - "`f1.equals(f2)`"
      - "`f1 == f2`"
      - "`f1.hashCode() == f2.hashCode()`"
    answer: 0
    explanation: |
      `Objects.equals(a, b)` (since Java 7) handles nulls: returns true if both null, false if
      exactly one is null, else delegates to `a.equals(b)`. `f1.equals(f2)` risks NPE when f1 is
      null, and hashCode equality is not value equality.
    ref: "concepts.md#the-equals-contract"

  - id: object-methods-equality-045
    difficulty: advanced
    tags: [hashset, symmetry-consequence]
    question: |
      A class has an asymmetric `equals`. You add object x then object y (where x.equals(y) is
      true but y.equals(x) is false) to a `HashSet`. Why is the set's behavior unreliable?
    options:
      - "HashSet ignores equals entirely"
      - "It always throws ConcurrentModificationException"
      - "It always stores both objects correctly"
      - "Whether y is seen as a duplicate can depend on iteration/probe order and which object's equals is invoked, so results are inconsistent"
    answer: 3
    explanation: |
      Set operations depend on equals being symmetric. With asymmetric equals, whether a
      candidate is treated as a duplicate depends on which stored object's `equals` is called
      during probing, making `contains`/`add`/`remove` unpredictable. Contract violations produce
      undefined collection behavior.
    ref: "concepts.md#symmetry-transitivity-and-the-inheritance-trap"

  - id: object-methods-equality-046
    difficulty: advanced
    tags: [records, compact-constructor]
    question: |
      Where should you validate or normalize component values in a record?
    options:
      - "In the compact canonical constructor (or an explicit canonical constructor)"
      - "In a static initializer block"
      - "In the generated accessor methods only"
      - "You cannot validate record components"
    answer: 0
    explanation: |
      A compact constructor `public Point { if (x < 0) throw ...; }` runs validation/normalization
      before the fields are assigned, without re-listing parameters. You can alternatively write a
      full canonical constructor. Accessors are not the place for validation.
    ref: "concepts.md#records-auto-generate-equals-hashcode-and-tostring"

  - id: object-methods-equality-047
    difficulty: expert
    tags: [nan, equals, doubletolongbits]
    question: |
      ```java
      System.out.println(Double.NaN == Double.NaN);
      System.out.println(Double.valueOf(Double.NaN).equals(Double.NaN));
      ```
      What is printed and what is the underlying reason?
    options:
      - "true / true, because NaN equals itself"
      - "false / false, because NaN is never equal to anything"
      - "false / true, because == uses IEEE-754 (NaN != NaN) but Double.equals compares bit patterns via doubleToLongBits"
      - "true / false, the opposite of the correct behavior"
    answer: 2
    explanation: |
      IEEE-754 defines `NaN == NaN` as false, so the primitive comparison is false. `Double.equals`
      canonicalizes with `doubleToLongBits`, giving all NaNs the same bit pattern, so it returns
      true — deliberately, so a NaN key can be found in a hash collection.
    ref: "concepts.md#reference-identity-versus-logical-equality"

  - id: object-methods-equality-048
    difficulty: expert
    tags: [hashcode, spreading, internals]
    question: |
      Why does `HashMap` apply `(h = key.hashCode()) ^ (h >>> 16)` before masking with
      `(n - 1)`?
    options:
      - "To make the hashCode positive"
      - "To comply with the hashCode contract"
      - "To sort entries within a bucket"
      - "To mix high-order bits into the low-order bits, since masking with a power-of-two table size otherwise discards the high bits"
    answer: 3
    explanation: |
      Because bucket index is `(n-1) & hash` and `n` is a power of two, only the low bits of the
      hash select the bucket. XORing the high 16 bits down ('spreading') lets high-order entropy
      influence the index, reducing collisions from hashCodes that differ mainly in high bits.
    ref: "concepts.md#consequences-of-breaking-the-contract-in-hash-collections"

  - id: object-methods-equality-049
    difficulty: expert
    tags: [treeification, comparable]
    question: |
      When a HashMap bucket treeifies, how are keys ordered within the red-black tree?
    options:
      - "By insertion order only"
      - "Strictly by the keys' equals result"
      - "Randomly, to defeat hash-collision attacks"
      - "By hash; ties are broken by natural ordering if keys are Comparable, otherwise by a tie-breaking rule"
    answer: 3
    explanation: |
      Treeified bins order primarily by hash. When hashes tie, if the keys implement Comparable,
      their `compareTo` is used; otherwise HashMap falls back to a deterministic tie-break (based
      on class name / identity hash). This keeps worst-case bucket operations at O(log n).
    ref: "concepts.md#consequences-of-breaking-the-contract-in-hash-collections"

  - id: object-methods-equality-050
    difficulty: expert
    tags: [equals, floating-point, compare]
    question: |
      Inside a hand-written `equals`, why prefer `Double.compare(a, b) == 0` over `a == b` for
      `double` fields?
    options:
      - "It is faster"
      - "`Double.compare` handles NaN and signed-zero consistently with the way Double.hashCode/equals treat bits, keeping equals and hashCode aligned"
      - "`a == b` does not compile for doubles"
      - "There is no difference for doubles"
    answer: 1
    explanation: |
      Using `==` would make two NaN fields 'unequal' and +0.0/-0.0 'equal', diverging from how
      Double's bit-based equals/hashCode behave and risking an equals/hashCode mismatch.
      `Double.compare` gives the same NaN/signed-zero treatment, keeping the contract intact.
    ref: "concepts.md#the-equals-contract"

  - id: object-methods-equality-051
    difficulty: expert
    tags: [clone, super-clone, hierarchy]
    question: |
      In a class hierarchy where each level implements `Cloneable`, why must every `clone()`
      override start by calling `super.clone()` rather than `new`?
    options:
      - "Because new is not allowed inside clone"
      - "So the returned object has the correct runtime class throughout the hierarchy; using `new` in a superclass would produce the wrong type for subclasses that inherit clone"
      - "Because super.clone() performs a deep copy automatically"
      - "Because CloneNotSupportedException is only thrown by new"
    answer: 1
    explanation: |
      `Object.clone` allocates an instance of the actual runtime class. If a superclass's clone
      used `new Superclass()`, a subclass inheriting that clone would get a Superclass instance,
      not its own type. Chaining `super.clone()` preserves the correct runtime class — a fragile
      requirement that further motivates using copy constructors instead.
    ref: "concepts.md#clone-and-cloneable-pitfalls"

  - id: object-methods-equality-052
    difficulty: expert
    tags: [records, equals-semantics, double]
    question: |
      A record has a `double` component. How does the auto-generated `equals` compare that
      component across two record instances?
    options:
      - "With `==`, so two NaN-valued records are never equal"
      - "By truncating to int first"
      - "By comparing string representations"
      - "Using the equivalent of `Double.compare`/bitwise semantics, so two records each holding NaN in that component ARE equal"
    answer: 3
    explanation: |
      The generated record `equals` uses component-appropriate comparison; for `double` it uses
      the same bitwise/`Double.compare` semantics as `Double.equals`. Consequently two records
      with a NaN in that component are equal, and +0.0 vs -0.0 in that component are not — matching
      the boxed-type behavior.
    ref: "concepts.md#records-auto-generate-equals-hashcode-and-tostring"

  - id: object-methods-equality-053
    difficulty: expert
    tags: [record-patterns, version]
    question: |
      Record patterns, which allow deconstructing a record directly in a `switch`/`instanceof`
      (e.g. `case Point(int x, int y)`), were finalized in which JDK?
    options:
      - "JDK 16"
      - "JDK 17"
      - "JDK 19"
      - "JDK 21"
    answer: 3
    explanation: |
      Record patterns were previewed in JDK 19/20 and finalized in JDK 21 (JEP 440), alongside
      pattern matching for switch (also final in JDK 21, JEP 441). Records themselves are final
      since JDK 16, and sealed classes since JDK 17.
    ref: "concepts.md#records-auto-generate-equals-hashcode-and-tostring"

  - id: object-methods-equality-054
    difficulty: expert
    tags: [identityhashcode, system]
    question: |
      What does `System.identityHashCode(x)` return, and how does it relate to a class that
      overrides `hashCode`?
    options:
      - "It returns the overridden hashCode result"
      - "It returns the value Object.hashCode would return (the identity hash), ignoring any override"
      - "It always returns 0"
      - "It throws if hashCode is overridden"
    answer: 1
    explanation: |
      `System.identityHashCode(x)` yields the same value that `Object.hashCode()` would produce
      for x, regardless of whether the class overrides `hashCode`. It is useful for identity-based
      structures like `IdentityHashMap`, which use `==` and identity hashing rather than
      equals/hashCode.
    ref: "concepts.md#the-hashcode-contract-and-the-equals-hashcode-link"

  - id: object-methods-equality-055
    difficulty: expert
    tags: [equals, getclass, proxy]
    question: |
      Why can a `getClass()`-based `equals` silently break when using frameworks like Hibernate
      or dynamic proxies?
    options:
      - "Because proxies override hashCode to a constant"
      - "Because getClass() is not available at runtime"
      - "Because proxies disable equals entirely"
      - "Because the proxy/enhanced object is an instance of a generated subclass, so getClass() differs from the real entity class and equals returns false for logically-equal objects"
    answer: 3
    explanation: |
      ORMs and proxy libraries create runtime subclasses (e.g. `Entity$$EnhancerBy...`). A
      `getClass()` check then sees different classes for a proxy and a plain instance and returns
      false even when they represent the same entity. `instanceof` tolerates this, which is one
      reason instanceof is often preferred with such frameworks.
    ref: "concepts.md#symmetry-transitivity-and-the-inheritance-trap"

  - id: object-methods-equality-056
    difficulty: expert
    tags: [hashcode, deep-copy, defensive]
    question: |
      A class stores a `Date` field (mutable) and computes equals/hashCode from it. Beyond
      overriding equals/hashCode, what additional practice prevents subtle bugs?
    options:
      - "Store the Date in a static field"
      - "Defensively copy the Date on construction and on access so external code cannot mutate the field and corrupt the object's hash bucket"
      - "Mark the Date field transient"
      - "Return a constant hashCode"
    answer: 1
    explanation: |
      If external code holds a reference to the internal `Date` and mutates it, the object's
      hashCode/equals change while it may be a live key in a HashMap — the same 'mutated key'
      failure. Defensive copies on construction and on getters (or using immutable
      java.time.Instant) keep the value-defining state effectively immutable.
    ref: "concepts.md#consequences-of-breaking-the-contract-in-hash-collections"
