topic: "Pattern Matching, Switch Expressions and Text Blocks (JDK 14-21)"
domain: java-jvm
topic_slug: pattern-matching-switch-expressions
version: 1
questions:
  - id: pattern-matching-switch-expressions-001
    difficulty: beginner
    tags: [switch-expressions, versions]
    question: |
      In which JDK release did switch expressions become a final (standard, non-preview)
      language feature?
    options:
      - "JDK 12"
      - "JDK 13"
      - "JDK 14"
      - "JDK 17"
    answer: 2
    explanation: |
      Switch expressions were previewed in JDK 12 (JEP 325) and JDK 13 (JEP 354), then
      finalized in JDK 14 via JEP 361. JDK 12 and 13 only offered them as preview features.
      JDK 17 is a later LTS where they are of course already final, but 14 is the release that
      standardized them.
    ref: "concepts.md#switch-expressions"

  - id: pattern-matching-switch-expressions-002
    difficulty: beginner
    tags: [switch-expressions, yield]
    question: |
      Inside a block on the arrow form of a switch expression, which keyword produces the
      value of the case?
    options:
      - "return"
      - "break"
      - "yield"
      - "produce"
    answer: 2
    explanation: |
      A block in a switch expression produces its value with `yield`. `return` would attempt to
      return from the enclosing method and is a compile error inside a switch expression.
      `break` cannot carry a value in this context. There is no `produce` keyword.
    ref: "concepts.md#switch-expressions"

  - id: pattern-matching-switch-expressions-003
    difficulty: beginner
    tags: [switch-expressions, fall-through]
    question: |
      What is true of the arrow (`->`) label form in a switch?
    options:
      - "It has no fall-through; only the matched label's code executes."
      - "It falls through to the next case unless you write break."
      - "It requires every case to end with yield."
      - "It can only be used in switch statements, never expressions."
    answer: 0
    explanation: |
      The arrow form eliminates fall-through entirely: only the code associated with the matched
      label runs. `break` is neither needed nor used to prevent fall-through. `yield` is only
      needed inside a block that must produce a value. Arrow form works in both switch statements
      and switch expressions.
    ref: "concepts.md#switch-expressions"

  - id: pattern-matching-switch-expressions-004
    difficulty: beginner
    tags: [text-blocks, versions]
    question: |
      Which JDK finalized text blocks as a standard feature?
    options:
      - "JDK 13"
      - "JDK 14"
      - "JDK 15"
      - "JDK 16"
    answer: 2
    explanation: |
      Text blocks were previewed in JDK 13 (JEP 355) and JDK 14 (JEP 368), and became final in
      JDK 15 via JEP 378. JDK 16 is later and already has them as final.
    ref: "concepts.md#text-blocks"

  - id: pattern-matching-switch-expressions-005
    difficulty: beginner
    tags: [text-blocks, syntax]
    question: |
      What must immediately follow the opening `"""` delimiter of a text block?
    options:
      - "A line terminator (the content must begin on the next line)."
      - "The first character of content, on the same line."
      - "A backslash escape."
      - "A closing \"\"\" on the same line for empty blocks."
    answer: 0
    explanation: |
      The opening delimiter must be followed by a line terminator; you cannot place content on
      the same line as the opening `"""`. Content begins on the following line. This is a
      compile-time rule enforced by the grammar.
    ref: "concepts.md#text-blocks"

  - id: pattern-matching-switch-expressions-006
    difficulty: beginner
    tags: [instanceof, versions]
    question: |
      Pattern matching for `instanceof` (with a binding variable) became final in which JDK?
    options:
      - "JDK 14"
      - "JDK 15"
      - "JDK 16"
      - "JDK 21"
    answer: 2
    explanation: |
      It was previewed in JDK 14 (JEP 305) and JDK 15 (JEP 375), and finalized in JDK 16 via
      JEP 394. Pattern matching for `switch` and record patterns are the ones that became final
      in JDK 21 — not `instanceof`.
    ref: "concepts.md#pattern-matching-for-instanceof"

  - id: pattern-matching-switch-expressions-007
    difficulty: beginner
    tags: [instanceof, binding]
    question: |
      What does the binding variable in `if (obj instanceof String s)` give you?
    options:
      - "A new String created by calling toString() on obj."
      - "A boolean indicating whether obj is a String."
      - "A copy of obj that is always non-null even if obj is null."
      - "obj cast to String, available where the compiler proves the test succeeded."
    answer: 3
    explanation: |
      The binding variable `s` is `obj` already cast to `String`, in scope wherever the compiler
      can prove the `instanceof` matched (flow scoping). It is not a fresh object, not a boolean,
      and since `null instanceof String` is false, the binding is never bound to `null`.
    ref: "concepts.md#pattern-matching-for-instanceof"

  - id: pattern-matching-switch-expressions-008
    difficulty: beginner
    tags: [pattern-matching-for-switch, versions]
    question: |
      Pattern matching for `switch` and record patterns both became final language features in
      which JDK release?
    options:
      - "JDK 17"
      - "JDK 19"
      - "JDK 20"
      - "JDK 21"
    answer: 3
    explanation: |
      Both were finalized in JDK 21 — pattern matching for `switch` via JEP 441 and record
      patterns via JEP 440. On JDK 17 (also an LTS) they were still preview features. JDK 19 and
      20 were intermediate preview rounds.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-009
    difficulty: beginner
    tags: [record-patterns, deconstruction]
    question: |
      What does the pattern `obj instanceof Point(int x, int y)` do for a record `Point(int x, int y)`?
    options:
      - "Checks obj is a Point and binds x and y to its components."
      - "Creates a new Point with fields x and y set to zero."
      - "Only compiles if Point is a sealed class."
      - "Checks obj is a Point but does not bind any variables."
    answer: 0
    explanation: |
      This is a record (deconstruction) pattern: it tests that `obj` is a `Point` and, if so,
      binds `x` and `y` to the values returned by the record's canonical accessors. It does not
      create a new object, does not require sealed, and it does bind component variables.
    ref: "concepts.md#record-patterns"

  - id: pattern-matching-switch-expressions-010
    difficulty: beginner
    tags: [switch-expressions, syntax]
    question: |
      How do you handle multiple values with the same result in an arrow-form switch?
    options:
      - "List the labels comma-separated in a single case, e.g. case A, B, C -> ...;"
      - "Stack empty case labels above the one with code."
      - "Use the OR operator: case A || B || C -> ...;"
      - "You must write a separate case for each value."
    answer: 0
    explanation: |
      Arrow-form switch lets you list multiple labels separated by commas in a single case:
      `case MONDAY, FRIDAY, SUNDAY -> 6;`. Stacking empty labels is the old colon-form
      fall-through idiom. `||` is not valid syntax for case labels.
    ref: "concepts.md#switch-expressions"

  - id: pattern-matching-switch-expressions-011
    difficulty: beginner
    tags: [text-blocks, type]
    question: |
      What is the runtime type of a text block?
    options:
      - "A new TextBlock type introduced in JDK 15."
      - "CharSequence but not String."
      - "java.lang.String — identical to a normal string literal."
      - "char[]"
    answer: 2
    explanation: |
      A text block is just a `String`; there is no new type. It compiles to the same string
      constant, so an equal text block and normal literal are interned to the same instance
      (`"abc" == """abc"""` is true).
    ref: "concepts.md#text-blocks"

  - id: pattern-matching-switch-expressions-012
    difficulty: beginner
    tags: [switch-expressions, statement-vs-expression]
    question: |
      Which statement about exhaustiveness is correct?
    options:
      - "Both switch statements and switch expressions must be exhaustive."
      - "Neither form is ever required to be exhaustive."
      - "Only switch statements must be exhaustive."
      - "A switch expression must be exhaustive; a traditional switch statement need not be."
    answer: 3
    explanation: |
      A switch expression must always yield a value, so the compiler requires it to be
      exhaustive. A classic switch statement can legally match nothing and simply do nothing, so
      it is not required to be exhaustive.
    ref: "concepts.md#switch-expressions"

  - id: pattern-matching-switch-expressions-013
    difficulty: intermediate
    tags: [switch-expressions, code-analysis]
    question: |
      What does this code print?

      ```java
      int day = 3;
      int r = switch (day) {
          case 1, 2, 3 -> {
              int x = day * 2;
              yield x + 1;
          }
          default -> 0;
      };
      System.out.println(r);
      ```
    options:
      - "0"
      - "6"
      - "7"
      - "It does not compile because a block cannot appear on the arrow form."
    answer: 2
    explanation: |
      `day` is 3, which matches `case 1, 2, 3`. The block computes `x = 3 * 2 = 6`, then
      `yield x + 1` produces 7. Blocks are perfectly legal on the arrow form as long as they
      `yield` a value.
    ref: "concepts.md#switch-expressions"

  - id: pattern-matching-switch-expressions-014
    difficulty: intermediate
    tags: [switch-expressions, return, code-analysis]
    question: |
      What happens with this code?

      ```java
      int classify(int n) {
          int r = switch (n) {
              case 0 -> 0;
              default -> {
                  return -1;   // line A
              }
          };
          return r;
      }
      ```
    options:
      - "Compile error: return is not allowed inside a switch expression."
      - "Compiles; classify(5) returns -1."
      - "Compiles; classify(5) returns 0."
      - "Compiles but throws at runtime for n != 0."
    answer: 0
    explanation: |
      `return` cannot appear inside a switch expression — it would return from the enclosing
      method while the expression is still being evaluated, which the language forbids. Line A
      is a compile error; you must use `yield -1;` instead.
    ref: "concepts.md#switch-expressions"

  - id: pattern-matching-switch-expressions-015
    difficulty: intermediate
    tags: [switch-expressions, colon-form, yield]
    question: |
      In a colon-form (`case L:`) switch expression, how do you produce the value, and does
      fall-through still apply?
    options:
      - "Use break value; and there is no fall-through."
      - "Use return value; fall-through is removed."
      - "You cannot use the colon form in a switch expression."
      - "Use yield value; and fall-through still applies within the colon form."
    answer: 3
    explanation: |
      The colon form is still allowed in switch expressions; you produce the value with `yield`,
      and traditional fall-through semantics still apply between colon labels. Only the arrow
      form removes fall-through. `break value;` and `return value;` are not valid here.
    ref: "concepts.md#switch-expressions"

  - id: pattern-matching-switch-expressions-016
    difficulty: intermediate
    tags: [switch-expressions, mixing-forms]
    question: |
      What is the result of mixing arrow and colon labels in the same switch?
    options:
      - "Allowed, but colon labels then lose fall-through."
      - "Allowed only in switch statements, not expressions."
      - "A compile error — a single switch must use one label style consistently."
      - "Allowed; the compiler picks arrow semantics for all labels."
    answer: 2
    explanation: |
      You cannot mix the two label styles in the same `switch`; doing so is a compile error. A
      switch is either all arrow-form or all colon-form.
    ref: "concepts.md#switch-expressions"

  - id: pattern-matching-switch-expressions-017
    difficulty: intermediate
    tags: [text-blocks, incidental-whitespace, code-analysis]
    question: |
      Given this text block, what is the exact resulting string?

      ```java
      String s = """
              hello
              world
              """;
      ```
      (The content lines and the closing delimiter are all indented the same amount.)
    options:
      - "\"hello\\nworld\\n\""
      - "\"        hello\\n        world\\n\" (indentation preserved)"
      - "\"hello\\nworld\" (no trailing newline)"
      - "\"hello world\""
    answer: 0
    explanation: |
      The closing `"""` is on its own line at the same indentation as the content, so the common
      (incidental) indentation is stripped from every line, and because the closing delimiter is
      on its own line there is a trailing newline. Result: `"hello\nworld\n"`.
    ref: "concepts.md#text-blocks"

  - id: pattern-matching-switch-expressions-018
    difficulty: intermediate
    tags: [text-blocks, closing-delimiter, code-analysis]
    question: |
      Compared to the previous question, if the closing `"""` is instead placed right after
      the `d` in `world` (same line), what changes?
    options:
      - "The string gains a leading newline."
      - "Nothing changes."
      - "It becomes a compile error."
      - "The trailing newline disappears (result is \"hello\\nworld\")."
    answer: 3
    explanation: |
      When the closing delimiter is on the same line as the last content character, there is no
      trailing newline, giving `"hello\nworld"`. Putting the closing `"""` on its own line adds
      the trailing `\n`. This is a common source of off-by-one newline bugs.
    ref: "concepts.md#text-blocks"

  - id: pattern-matching-switch-expressions-019
    difficulty: intermediate
    tags: [text-blocks, escapes]
    question: |
      What does a backslash (`\`) placed at the very end of a line inside a text block do?
    options:
      - "Inserts a literal backslash character."
      - "Escapes the next line entirely, removing it."
      - "Suppresses the line terminator, joining that line with the next."
      - "Marks the end of the text block."
    answer: 2
    explanation: |
      A trailing `\` is the line-continuation escape (new in text blocks): it suppresses the
      newline that would otherwise be inserted, joining the line with the following one. This
      lets you break a long logical line across multiple source lines. A literal backslash is
      `\\`.
    ref: "concepts.md#text-blocks"

  - id: pattern-matching-switch-expressions-020
    difficulty: intermediate
    tags: [text-blocks, escapes, whitespace]
    question: |
      What is the purpose of the `\s` escape in a text block?
    options:
      - "It translates to a single space and prevents trailing whitespace from being stripped."
      - "It inserts a tab character."
      - "It strips all surrounding whitespace."
      - "It is a syntax error inside text blocks."
    answer: 0
    explanation: |
      `\s` is the space escape: it becomes a single space and acts as a fence so that trailing
      whitespace up to and including it is preserved rather than stripped. It is not a tab (`\t`)
      and it does not strip whitespace.
    ref: "concepts.md#text-blocks"

  - id: pattern-matching-switch-expressions-021
    difficulty: intermediate
    tags: [instanceof, flow-scoping, code-analysis]
    question: |
      Does this compile, and if so what does it print for an argument of "hello world"?

      ```java
      void f(Object obj) {
          if (!(obj instanceof String s)) {
              return;
          }
          System.out.println(s.length());
      }
      ```
    options:
      - "Compile error: s is not in scope after the if block."
      - "Compiles; prints 0."
      - "Compiles but throws NullPointerException."
      - "Compiles; prints 11."
    answer: 3
    explanation: |
      Flow scoping: because the method returns when the pattern does NOT match, control reaches
      the println only when `obj` IS a String, so `s` is in scope there. For "hello world"
      (length 11) it prints 11.
    ref: "concepts.md#pattern-matching-for-instanceof"

  - id: pattern-matching-switch-expressions-022
    difficulty: intermediate
    tags: [instanceof, flow-scoping]
    question: |
      Why is `if (obj instanceof String s || s.length() > 0)` a compile error?
    options:
      - "Because s is not in scope on the right of ||: reaching it means the pattern failed."
      - "Because instanceof cannot be used with ||."
      - "Because length() may throw NullPointerException."
      - "Because binding variables cannot be used in boolean expressions."
    answer: 0
    explanation: |
      With `||`, the right operand is evaluated only when the left is false — i.e. when the
      pattern did NOT match — so the binding `s` cannot be in scope there. This contrasts with
      `&&`, where the right operand is only reached when the pattern matched, so the binding is
      in scope.
    ref: "concepts.md#pattern-matching-for-instanceof"

  - id: pattern-matching-switch-expressions-023
    difficulty: intermediate
    tags: [pattern-matching-for-switch, when, guards]
    question: |
      In the final JDK 21 syntax, how do you add a boolean guard to a case pattern?
    options:
      - "case Integer i && i > 100 ->"
      - "case Integer i where i > 100 ->"
      - "case Integer i when i > 100 ->"
      - "case Integer i if (i > 100) ->"
    answer: 2
    explanation: |
      The final syntax uses the contextual keyword `when`: `case Integer i when i > 100 ->`. The
      `&&` form was used during the preview rounds but was replaced. `where` and `if` are not
      valid guard syntaxes.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-024
    difficulty: intermediate
    tags: [pattern-matching-for-switch, null-handling, code-analysis]
    question: |
      What does this print when called as `f(null)`?

      ```java
      static String f(Object obj) {
          return switch (obj) {
              case Integer i -> "int";
              case String s  -> "string";
              default        -> "other";
          };
      }
      ```
    options:
      - "\"other\""
      - "\"string\""
      - "null"
      - "It throws NullPointerException."
    answer: 3
    explanation: |
      Without an explicit `case null`, a pattern switch preserves the classic behavior: a null
      selector throws NullPointerException. The `default` label does NOT catch null unless you
      write `case null, default`. To handle null you must add `case null`.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-025
    difficulty: intermediate
    tags: [pattern-matching-for-switch, sealed, exhaustiveness]
    question: |
      Why can a pattern switch over a sealed interface omit the `default` label and still compile?
    options:
      - "Because sealed types disable exhaustiveness checking."
      - "Because switch always inserts a default automatically."
      - "It cannot — a default is always mandatory."
      - "Because the compiler knows the complete set of permitted subtypes and can verify coverage."
    answer: 3
    explanation: |
      A sealed type declares its permitted subtypes, so the compiler knows the finite universe of
      possible runtime types and can verify that the case labels cover them all. When coverage is
      complete, no `default` is needed. Exhaustiveness checking is not disabled — it is what makes
      this possible.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-026
    difficulty: intermediate
    tags: [record-patterns, nested, code-analysis]
    question: |
      Given `record Point(int x, int y) {}` and `record Line(Point a, Point b) {}`, which
      pattern correctly binds all four coordinates of a Line?
    options:
      - "case Line l -> use l.x(), l.y()..."
      - "case Line(Point(var x1, var y1), Point(var x2, var y2)) ->"
      - "case Line(int x1, int y1, int x2, int y2) ->"
      - "case Line(Point a, Point b, var x, var y) ->"
    answer: 1
    explanation: |
      Record patterns nest: `Line(Point(var x1, var y1), Point(var x2, var y2))` deconstructs the
      Line into two Points and each Point into its two int components. Option 2 fails because
      Line's components are Points, not four ints. Option 3 has the wrong arity. Option 0 does not
      deconstruct.
    ref: "concepts.md#record-patterns"

  - id: pattern-matching-switch-expressions-027
    difficulty: intermediate
    tags: [record-patterns, var]
    question: |
      Which is true about using `var` in a record pattern component?
    options:
      - "var infers the component's declared type, e.g. Point(var x, var y)."
      - "var is forbidden in record patterns."
      - "var makes the component nullable."
      - "var can be used for the record type itself, e.g. var(int x, int y)."
    answer: 0
    explanation: |
      You can use `var` for component patterns and the compiler infers each component's declared
      type. You cannot write `var` for the record type name in the deconstruction (you must name
      the record type). `var` does not affect nullability.
    ref: "concepts.md#record-patterns"

  - id: pattern-matching-switch-expressions-028
    difficulty: intermediate
    tags: [switch-expressions, enum, code-analysis]
    question: |
      For an enum with constants RED, GREEN, BLUE, this switch expression covers all three
      constants but has no default. Is it valid?

      ```java
      int f(Color c) {
          return switch (c) {
              case RED -> 1;
              case GREEN -> 2;
              case BLUE -> 3;
          };
      }
      ```
    options:
      - "No — a switch expression on an enum always requires an explicit default."
      - "No — enums cannot be used as switch expression selectors."
      - "Yes, but only if Color is declared sealed."
      - "Yes — covering all enum constants makes it exhaustive; the compiler adds a synthetic default."
    answer: 3
    explanation: |
      Covering every enum constant makes the switch expression exhaustive without an explicit
      default. The compiler inserts a synthetic default that guards against an enum constant added
      at runtime after compilation (throwing at that point). Enums are valid selectors and need
      not be sealed.
    ref: "concepts.md#switch-expressions"

  - id: pattern-matching-switch-expressions-029
    difficulty: intermediate
    tags: [text-blocks, methods, versions]
    question: |
      Which String method, useful with text blocks, applies the same incidental-whitespace
      algorithm to an ordinary string and was added in JDK 15?
    options:
      - "String.trim()"
      - "String.strip()"
      - "String.stripIndent()"
      - "String.repeat()"
    answer: 2
    explanation: |
      `stripIndent()` (JDK 15) applies the text-block incidental-whitespace stripping algorithm to
      any string. `trim()` (very old) removes leading/trailing whitespace by codepoint <= U+0020;
      `strip()` (JDK 11) is Unicode-aware trimming; `repeat()` (JDK 11) repeats a string.
    ref: "concepts.md#text-blocks"

  - id: pattern-matching-switch-expressions-030
    difficulty: intermediate
    tags: [pattern-matching-for-switch, null-handling]
    question: |
      Which combined label correctly handles a null selector and all otherwise-unmatched values
      in one case?
    options:
      - "case null, default ->"
      - "case null && default ->"
      - "case default null ->"
      - "case (null | default) ->"
    answer: 0
    explanation: |
      `case null, default ->` is the sanctioned way to handle null together with everything else.
      `case null` may be combined only with `default`, using a comma. The other spellings are not
      valid syntax.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-031
    difficulty: advanced
    tags: [pattern-matching-for-switch, dominance, code-analysis]
    question: |
      Why does this switch fail to compile?

      ```java
      String f(CharSequence cs) {
          return switch (cs) {
              case CharSequence c -> "seq";
              case String s       -> "str";
              default             -> "?";
          };
      }
      ```
    options:
      - "Because CharSequence is an interface and cannot be a pattern."
      - "Because a default is not allowed once patterns are used."
      - "Because String does not implement CharSequence."
      - "Because the String case is dominated by (unreachable after) the CharSequence case."
    answer: 3
    explanation: |
      Case labels are tested top-to-bottom. `case CharSequence c` matches every String too, so the
      later `case String s` is unreachable — it is *dominated*. The compiler reports an error.
      Reordering (more specific patterns first) fixes it. String does implement CharSequence.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-032
    difficulty: advanced
    tags: [pattern-matching-for-switch, matchexception, sealed]
    question: |
      A pattern switch over a sealed interface is compiled without a default (all current subtypes
      covered). A new permitted subtype is later added and the enum/hierarchy recompiled, but the
      switch's class is NOT recompiled. What happens if that new subtype reaches the switch at
      runtime?
    options:
      - "The switch silently returns the default value of the result type."
      - "It throws NullPointerException."
      - "It throws MatchException."
      - "The JVM refuses to load the class."
    answer: 2
    explanation: |
      When the set of subtypes changes after compilation and a value falls through all known
      patterns, the JVM throws `MatchException` (introduced in JDK 21). This is safer than silently
      producing a wrong value. Recompiling the switch would surface the gap as a compile error.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-033
    difficulty: advanced
    tags: [pattern-matching-for-switch, guards, dominance, code-analysis]
    question: |
      Why does this switch fail to compile?

      ```java
      String f(Object o) {
          return switch (o) {
              case Integer i        -> "int";
              case Integer i when i > 0 -> "positive int";
              default               -> "?";
          };
      }
      ```
    options:
      - "Because when is not a valid keyword."
      - "Because you cannot have two cases with the same pattern type."
      - "Because a guard must always come last, after default."
      - "Because the guarded Integer case is dominated by the earlier unguarded Integer case."
    answer: 3
    explanation: |
      An unguarded `case Integer i` matches every Integer, so the later guarded
      `case Integer i when i > 0` can never be reached — it is dominated, a compile error. Guarded
      cases must precede their unguarded counterpart. Two cases of the same type ARE allowed as
      long as ordering keeps them reachable.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-034
    difficulty: advanced
    tags: [pattern-matching-for-switch, guards, exhaustiveness]
    question: |
      A switch over a sealed type covers all subtypes but the final catch-all case is guarded
      with `when`. Does it compile without a `default`?
    options:
      - "No — the compiler cannot prove a guarded case is total, so a default (or unguarded total pattern) is still required."
      - "Yes — any coverage of all subtypes is sufficient regardless of guards."
      - "Yes, but only if the guard is a compile-time constant."
      - "No — guards are never allowed in an exhaustive switch."
    answer: 0
    explanation: |
      A guard can evaluate to false at runtime, so the compiler cannot treat a guarded case as
      covering all values of that type. Exhaustiveness therefore requires an unguarded total
      pattern or a `default`. Guards are allowed in exhaustive switches — they just do not count
      toward exhaustiveness.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-035
    difficulty: advanced
    tags: [instanceof, flow-scoping, reassignment]
    question: |
      Is a binding variable from `instanceof` final by default, and can it be reassigned?
    options:
      - "It is implicitly final and reassignment is a compile error."
      - "It is a constant folded at compile time."
      - "It is final only inside if statements, non-final inside while loops."
      - "It is a normal (non-final) local variable and can be reassigned, though doing so is discouraged."
    answer: 3
    explanation: |
      A pattern binding is an ordinary local variable; it is not implicitly final (you may add
      `final` yourself). It can be reassigned, but reassigning it undermines the flow-typing
      reasoning and is considered poor style.
    ref: "concepts.md#pattern-matching-for-instanceof"

  - id: pattern-matching-switch-expressions-036
    difficulty: advanced
    tags: [pattern-matching-for-switch, total-pattern, null-handling]
    question: |
      Does a bare total type pattern such as `case Object o ->` match a null selector?
    options:
      - "No — you must additionally add case null to match null; otherwise null still throws NPE."
      - "Yes — a total type pattern always matches null."
      - "Yes, but only in switch statements, not expressions."
      - "It depends on whether the switch is exhaustive."
    answer: 0
    explanation: |
      Even a total type pattern like `case Object o` does NOT match null unless you also add
      `case null`. Without it a null selector throws NullPointerException, preserving backward
      compatibility. This is a frequent trap.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-037
    difficulty: advanced
    tags: [record-patterns, matchexception, accessors]
    question: |
      During a record deconstruction pattern match, one of the record's canonical accessors
      throws a RuntimeException. What does the pattern match do?
    options:
      - "Silently skips to the next case."
      - "Returns null for that component."
      - "Catches and ignores the exception."
      - "Propagates the original exception wrapped in a MatchException."
    answer: 3
    explanation: |
      Record patterns invoke the record's accessors to obtain component values. If an accessor
      throws, the exception is wrapped and surfaced as a `MatchException` (with the original as its
      cause). The match does not silently skip or null out the component.
    ref: "concepts.md#record-patterns"

  - id: pattern-matching-switch-expressions-038
    difficulty: advanced
    tags: [record-patterns, unnamed, versions]
    question: |
      Are unnamed patterns and variables (using `_`) a final, standard feature in JDK 21?
    options:
      - "Yes, they were finalized alongside record patterns in JDK 21."
      - "No — they were preview in JDK 21 (JEP 443) and became final in JDK 22 (JEP 456)."
      - "Yes, they have been final since JDK 16."
      - "No — they are still preview as of JDK 21 and were removed in JDK 22."
    answer: 1
    explanation: |
      Unnamed variables and patterns (`_`) were a preview feature in JDK 21 (JEP 443) and became
      final in JDK 22 (JEP 456). Do not claim `_` is a standard feature in 21. Record patterns
      themselves are final in 21, but the unnamed `_` shorthand is not.
    ref: "concepts.md#record-patterns"

  - id: pattern-matching-switch-expressions-039
    difficulty: advanced
    tags: [text-blocks, line-endings]
    question: |
      A text block is written in a source file saved with Windows CRLF line endings. What line
      terminator appears in the resulting String?
    options:
      - "CRLF (\\r\\n), matching the source file."
      - "LF (\\n) — line terminators are normalized to LF regardless of source encoding."
      - "The platform line separator at runtime."
      - "No line terminator; they are all stripped."
    answer: 1
    explanation: |
      Text block line terminators are normalized to `\n` (LF) at compile time, regardless of
      whether the source used CRLF or LF. This makes the resulting string deterministic across
      platforms. It is not `System.lineSeparator()` and terminators are not stripped.
    ref: "concepts.md#text-blocks"

  - id: pattern-matching-switch-expressions-040
    difficulty: advanced
    tags: [text-blocks, code-analysis, escapes]
    question: |
      What is the value of `s`?

      ```java
      String s = """
              a\
              b""";
      ```
      (Both content lines share the same indentation; closing """ is on the b line.)
    options:
      - "\"a\\nb\""
      - "\"ab\""
      - "\"a b\""
      - "\"a\\\\b\""
    answer: 1
    explanation: |
      The trailing `\` after `a` is the line-continuation escape, which suppresses the newline, so
      the two lines join to `"ab"`. Incidental indentation is stripped. There is no trailing
      newline because the closing delimiter is on the same line as `b`.
    ref: "concepts.md#text-blocks"

  - id: pattern-matching-switch-expressions-041
    difficulty: advanced
    tags: [pattern-matching-for-switch, constants-and-patterns]
    question: |
      Can constant labels and type-pattern labels coexist in the same switch (e.g. `case 0` and
      `case Integer i` for an Integer selector)?
    options:
      - "No — a switch must use either all constants or all patterns."
      - "Yes — they can be mixed, subject to dominance/reachability rules."
      - "Yes, but only if the selector is an enum."
      - "No — constants are only allowed with primitive selectors."
    answer: 1
    explanation: |
      A pattern switch may mix constant case labels (like `case 0`) with type-pattern labels
      (like `case Integer i`) for a boxed selector, provided the ordering respects
      dominance/reachability. The more specific constant must precede the general pattern that
      would otherwise dominate it.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-042
    difficulty: advanced
    tags: [pattern-matching-for-switch, code-analysis, guards]
    question: |
      What does `describe(150)` print (autoboxed to Integer)?

      ```java
      String describe(Object o) {
          return switch (o) {
              case Integer i when i > 100 -> "big";
              case Integer i              -> "small";
              case null, default          -> "other";
          };
      }
      ```
    options:
      - "\"other\""
      - "\"small\""
      - "\"big\""
      - "It throws NullPointerException."
    answer: 2
    explanation: |
      150 boxes to an Integer and 150 > 100, so the guarded first case matches and returns "big".
      The order is correct: the guarded case precedes the unguarded `case Integer i`. `case null,
      default` handles null and anything non-Integer.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-043
    difficulty: advanced
    tags: [record-patterns, generics]
    question: |
      For `record Box<T>(T content) {}`, which record pattern is valid to deconstruct a
      `Box<String>` value?
    options:
      - "case Box(var content) -> (component type inferred)"
      - "case Box<>(String content) ->"
      - "case Box content ->  (this deconstructs the box)"
      - "Record patterns cannot be used with generic records."
    answer: 0
    explanation: |
      With a generic record you can write `case Box(var content)` and the compiler infers the
      type argument (here String) from the selector, giving `content` type String. Raw record
      patterns and the diamond spelling in this position are not the right form; and record
      patterns fully support generics.
    ref: "concepts.md#record-patterns"

  - id: pattern-matching-switch-expressions-044
    difficulty: advanced
    tags: [record-patterns, guards, code-analysis]
    question: |
      Given `record Point(int x, int y) {}`, what does this return for `new Point(4, 4)`?

      ```java
      String f(Object o) {
          return switch (o) {
              case Point(int x, int y) when x == y -> "diagonal";
              case Point p                          -> "point";
              default                               -> "other";
          };
      }
      ```
    options:
      - "\"other\""
      - "\"point\""
      - "\"diagonal\""
      - "Compile error: cannot mix record pattern and type pattern for Point."
    answer: 2
    explanation: |
      The record pattern deconstructs Point into x=4, y=4; the guard `x == y` is true, so it
      returns "diagonal". Mixing a guarded record pattern with a later type pattern for the same
      type is fine because the guard keeps the first case from dominating the second.
    ref: "concepts.md#record-patterns"

  - id: pattern-matching-switch-expressions-045
    difficulty: expert
    tags: [pattern-matching-for-switch, exhaustiveness, sealed, code-analysis]
    question: |
      Given:

      ```java
      sealed interface S permits A, B {}
      record A(int v) implements S {}
      record B(int v) implements S {}

      int f(S s) {
          return switch (s) {
              case A a -> a.v();
              case B(int v) when v > 0 -> v;
          };
      }
      ```
      Why does this fail to compile?
    options:
      - "Because you cannot mix a type pattern (A a) and a record pattern (B(int v))."
      - "Because the B case is guarded, so the switch is not proven exhaustive and needs a default or unguarded B case."
      - "Because sealed interfaces cannot be switch selectors."
      - "Because record patterns require a default label."
    answer: 1
    explanation: |
      The only coverage for the B subtype is a guarded case (`when v > 0`), which the compiler
      cannot treat as total. So the switch is not exhaustive and must add either an unguarded
      `case B` / `case B(int v)` or a `default`. Mixing type and record patterns is allowed, and
      sealed types are valid selectors.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-046
    difficulty: expert
    tags: [switch-expressions, matchexception, enum]
    question: |
      An exhaustive switch expression over an enum (all constants covered, no default) is
      compiled. The enum later gains a new constant and only the enum is recompiled. At runtime a
      value equal to the new constant reaches the switch. In JDK 21, what is thrown?
    options:
      - "ClassCastException"
      - "MatchException"
      - "The switch returns 0."
      - "NoSuchFieldError"
    answer: 1
    explanation: |
      In JDK 21 the synthetic default inserted for a fully-covered enum/pattern switch throws
      `MatchException` when an unforeseen value arrives (older JDKs used
      IncompatibleClassChangeError for the enum case). This signals the compiled switch is stale
      relative to the enum.
    ref: "concepts.md#switch-expressions"

  - id: pattern-matching-switch-expressions-047
    difficulty: expert
    tags: [instanceof, flow-scoping, code-analysis]
    question: |
      Does this compile, and what does `g("hi")` print?

      ```java
      void g(Object obj) {
          while (!(obj instanceof String s)) {
              obj = String.valueOf(obj);
          }
          System.out.println(s.length());
      }
      ```
    options:
      - "Compile error: s not in scope after the loop."
      - "Compiles; prints 2."
      - "Compiles but loops forever."
      - "Compile error: cannot reassign obj inside the loop."
    answer: 1
    explanation: |
      Flow scoping extends through loops: the `while` continues until `obj instanceof String s` is
      true, and control exits the loop only when the pattern matched, so `s` is definitely assigned
      and in scope afterward. For "hi" (already a String, length 2) the loop body never runs and it
      prints 2.
    ref: "concepts.md#pattern-matching-for-instanceof"

  - id: pattern-matching-switch-expressions-048
    difficulty: expert
    tags: [pattern-matching-for-switch, versions, lts]
    question: |
      You must ship on JDK 17 (LTS) without any preview flags. Which of these can you use as a
      standard feature?
    options:
      - "Pattern matching for switch with type patterns"
      - "Record patterns (deconstruction)"
      - "Pattern matching for instanceof with binding variables"
      - "Unnamed patterns (_) in switch cases"
    answer: 2
    explanation: |
      On JDK 17 without preview, pattern matching for `instanceof` (final in 16) is available.
      Pattern matching for `switch` and record patterns were still preview in 17 (final in 21).
      Unnamed patterns were preview in 21 and final in 22. Only the instanceof feature is standard
      on 17.
    ref: "concepts.md#pattern-matching-for-instanceof"

  - id: pattern-matching-switch-expressions-049
    difficulty: expert
    tags: [pattern-matching-for-switch, dominance, sealed, code-analysis]
    question: |
      Given a sealed hierarchy `sealed interface Shape permits Circle, Square {}` with records
      `Circle(double r)` and `Square(double s)`, which ordering compiles?
    options:
      - "case Shape sh -> ...; case Circle c -> ...; case Square s -> ...;"
      - "case Circle c -> ...; case Square s -> ...;   (no default)"
      - "case Circle c -> ...;   (no Square case, no default)"
      - "default -> ...; case Circle c -> ...; case Square s -> ...;"
    answer: 1
    explanation: |
      Covering both permitted subtypes with no default is exhaustive and compiles (option 1).
      Option 0 puts the total `case Shape sh` first, dominating the later cases (error). Option 2
      omits Square, so it is not exhaustive (error). Option 3 places `default` first, dominating
      everything after it (error).
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-050
    difficulty: expert
    tags: [text-blocks, code-analysis, interning]
    question: |
      What does this print?

      ```java
      String a = "hi";
      String b = """
              hi""";
      System.out.println(a == b);
      ```
    options:
      - "false — text blocks create distinct String objects."
      - "true — both are compile-time constant strings and are interned to the same instance."
      - "It does not compile."
      - "It throws at runtime."
    answer: 1
    explanation: |
      A text block compiles to the same interned String constant as an equal literal. Both `a` and
      `b` refer to the interned "hi", so `a == b` is true. Text blocks are ordinary compile-time
      string constants.
    ref: "concepts.md#text-blocks"

  - id: pattern-matching-switch-expressions-051
    difficulty: expert
    tags: [pattern-matching-for-switch, code-analysis, null-handling]
    question: |
      What does `f(null)` return?

      ```java
      String f(Object o) {
          return switch (o) {
              case null     -> "null!";
              case String s -> "str";
              default        -> "other";
          };
      }
      ```
    options:
      - "\"other\""
      - "\"str\""
      - "\"null!\""
      - "It throws NullPointerException."
    answer: 2
    explanation: |
      An explicit `case null` intercepts a null selector before the NPE would be thrown, so
      `f(null)` returns "null!". This is exactly how pattern switches let you handle null
      gracefully rather than throwing.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-052
    difficulty: expert
    tags: [record-patterns, exhaustiveness, sealed, code-analysis]
    question: |
      Given `sealed interface Expr permits Num, Add {}`, `record Num(int v) implements Expr {}`,
      `record Add(Expr l, Expr r) implements Expr {}`, which switch is exhaustive without a default?
    options:
      - "case Num(int v) -> ...; case Add(Num(int a), Num(int b)) -> ...;"
      - "case Num n -> ...; case Add a -> ...;"
      - "case Add(var l, var r) -> ...;"
      - "case Num(int v) when v > 0 -> ...; case Add a -> ...;"
    answer: 1
    explanation: |
      Option 1 covers both permitted subtypes with total type patterns, so it is exhaustive with no
      default. Option 0 only matches Adds whose children are both Nums — not all Adds — so it is not
      exhaustive. Option 2 omits Num. Option 3's guarded Num case does not cover all Nums.
    ref: "concepts.md#record-patterns"

  - id: pattern-matching-switch-expressions-053
    difficulty: expert
    tags: [switch-expressions, yield, code-analysis]
    question: |
      What does this print?

      ```java
      int n = 2;
      int r = switch (n) {
          case 1: yield 10;
          case 2: yield 20;
          default: yield 0;
      };
      System.out.println(r);
      ```
    options:
      - "10"
      - "20"
      - "0"
      - "Compile error: colon form cannot be used in a switch expression."
    answer: 1
    explanation: |
      This is a colon-form switch expression. `n == 2` matches `case 2:` and `yield 20` produces
      the value 20. The colon form IS allowed in switch expressions (you produce values with
      `yield`), so it compiles and prints 20.
    ref: "concepts.md#switch-expressions"

  - id: pattern-matching-switch-expressions-054
    difficulty: expert
    tags: [pattern-matching-for-switch, code-analysis, dominance]
    question: |
      Which change makes the dominated-case compile error in the following disappear?

      ```java
      switch (obj) {
          case Object o  -> "obj";
          case String s  -> "str";   // error: dominated
      }
      ```
    options:
      - "Add a default label at the end."
      - "Swap the order so case String s comes before case Object o."
      - "Change case Object o to case null."
      - "Add a when guard to the String case."
    answer: 1
    explanation: |
      `case Object o` is a total pattern that dominates every later case, so `case String s` is
      unreachable. Moving the more specific `case String s` before `case Object o` fixes the
      reachability. Adding a default or a guard on the already-unreachable case does not help;
      changing to `case null` changes the semantics entirely.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-055
    difficulty: intermediate
    tags: [instanceof, equals, code-analysis]
    question: |
      What is the idiomatic JDK 16+ way to write an equals method for `record`-like class
      `Point` with fields x, y using pattern matching?
    options:
      - "return o instanceof Point && ((Point)o).x == x && ((Point)o).y == y;"
      - "return o instanceof Point p && p.x == x && p.y == y;"
      - "return o instanceof Point p || p.x == x;"
      - "return (Point) o != null;"
    answer: 1
    explanation: |
      `o instanceof Point p && p.x == x && p.y == y` binds `p` and, thanks to flow scoping across
      `&&`, uses it in the same expression — no explicit cast needed. Option 0 works but keeps the
      redundant casts. Option 2 misuses `||` (p not in scope). Option 3 is wrong.
    ref: "concepts.md#pattern-matching-for-instanceof"

  - id: pattern-matching-switch-expressions-056
    difficulty: intermediate
    tags: [record-patterns, instanceof, code-analysis]
    question: |
      Given `record Pair(Object a, Object b) {}`, what does this print for `new Pair("x", 5)`?

      ```java
      if (obj instanceof Pair(String a, Integer b)) {
          System.out.println(a + ":" + b);
      } else {
          System.out.println("no match");
      }
      ```
    options:
      - "\"x:5\""
      - "\"no match\""
      - "It throws ClassCastException."
      - "It does not compile because components are Object."
    answer: 0
    explanation: |
      A nested record pattern also type-checks each component: it matches only if `a` is a String
      and `b` is an Integer. For `Pair("x", 5)` both component type patterns match, binding a="x"
      and b=5, printing "x:5". Component patterns can narrow from the declared Object type.
    ref: "concepts.md#record-patterns"

  - id: pattern-matching-switch-expressions-057
    difficulty: beginner
    tags: [pattern-matching-for-switch, when]
    question: |
      Is `when` a reserved keyword that could break existing code using it as a variable name?
    options:
      - "Yes — when became fully reserved in JDK 21, breaking old code."
      - "No — when is a contextual keyword, so existing identifiers named when still compile."
      - "Yes — but only inside switch blocks."
      - "No — when is not part of Java at all."
    answer: 1
    explanation: |
      `when` is a contextual keyword: it has special meaning only in the guard position of a
      case label. Elsewhere it remains a valid identifier, so existing code using `when` as a
      variable or method name continues to compile. The same design was used for `yield` and
      `var`.
    ref: "concepts.md#pattern-matching-for-switch"

  - id: pattern-matching-switch-expressions-058
    difficulty: advanced
    tags: [text-blocks, formatted, code-analysis]
    question: |
      Which JDK 15 instance method lets you write `template.formatted(name, age)` as an
      alternative to `String.format(template, name, age)`?
    options:
      - "String.interpolate"
      - "String.formatted"
      - "String.sprintf"
      - "String.format is the only option; there is no instance variant."
    answer: 1
    explanation: |
      JDK 15 added the instance method `String.formatted(Object...)`, which is equivalent to
      `String.format(this, args)` and reads naturally when chained off a text block. There is no
      `interpolate` or `sprintf` method (string templates were a separate, later preview effort
      that was ultimately withdrawn).
    ref: "concepts.md#text-blocks"

  - id: pattern-matching-switch-expressions-059
    difficulty: advanced
    tags: [switch-expressions, throw, code-analysis]
    question: |
      Is the following a valid arrow-form switch expression?

      ```java
      int f(String cmd) {
          return switch (cmd) {
              case "up"   -> 1;
              case "down" -> -1;
              default     -> throw new IllegalArgumentException(cmd);
          };
      }
      ```
    options:
      - "No — you cannot throw on the right of an arrow in a switch expression."
      - "Yes — a throw statement is allowed on the arrow and satisfies exhaustiveness for that case."
      - "No — a String switch expression cannot have a default."
      - "Yes, but only if wrapped in a block with yield."
    answer: 1
    explanation: |
      The arrow right-hand side may be an expression, a block, or a `throw` statement. Throwing is
      valid and that case simply never produces a value (it transfers control). A String switch may
      have a default, and no block/yield wrapping is required around the throw.
    ref: "concepts.md#switch-expressions"

  - id: pattern-matching-switch-expressions-060
    difficulty: expert
    tags: [record-patterns, primitives, versions]
    question: |
      In JDK 21, can a record pattern component like `Point(int x, int y)` be used to match a
      record whose component is declared as `Integer` (adapting reference to primitive)?
    options:
      - "Yes — record patterns freely adapt between primitive and boxed component types."
      - "No — the component pattern type must match the record component's type; general primitive type patterns were not standard in JDK 21."
      - "Yes, but only with an explicit when guard."
      - "Yes — the compiler auto-unboxes any reference component in a pattern."
    answer: 1
    explanation: |
      In JDK 21 the deconstruction component pattern must align with the record's declared
      component type; you cannot rely on primitive/reference adaptation in the pattern. General
      primitive type patterns (which would allow such matching/unboxing) remained a preview effort
      after JDK 21, not a standard feature.
    ref: "concepts.md#record-patterns"
