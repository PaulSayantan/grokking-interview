topic: "Java 8+ Features: Lambdas, Streams and Optional"
domain: java-jvm
topic_slug: java8-streams-lambdas-optional
version: 1
questions:
  - id: java8-streams-lambdas-optional-001
    difficulty: beginner
    tags: [lambdas, functional-interface]
    question: |
      What is a "functional interface" in Java 8?
    options:
      - "An interface with exactly one abstract method (SAM), which a lambda can implement"
      - "An interface whose single method is annotated with @Override for the compiler"
      - "Any interface that directly extends java.util.function.Function or one of its subtypes"
      - "An interface that contains only default and static methods with no abstract one"
    answer: 0
    explanation: |
      A functional interface has exactly one abstract method, so a lambda unambiguously supplies its
      implementation. default and static methods, and overrides of java.lang.Object public methods,
      do not count against the single-abstract-method rule. @FunctionalInterface is optional but makes
      the compiler enforce the rule. Extending Function is not required, and an interface with only
      default methods has zero abstract methods, so it is not functional.
    ref: "concepts.md#lambda-expressions-and-functional-interfaces"
  - id: java8-streams-lambdas-optional-002
    difficulty: beginner
    tags: [version, java8]
    question: |
      Which Java version introduced lambda expressions, the Stream API, and Optional?
    options:
      - "Java 7"
      - "Java 8"
      - "Java 11"
      - "Java 17"
    answer: 1
    explanation: |
      Java 8 (March 2014) introduced lambdas, the Stream API, java.util.function, method references,
      Optional, default methods, java.time, and CompletableFuture. Java 11 and 17 are later LTS
      releases that added refinements (e.g., var in lambda params in 11) but not the core features.
    ref: "concepts.md#lambda-expressions-and-functional-interfaces"
  - id: java8-streams-lambdas-optional-003
    difficulty: beginner
    tags: [functional-interface, supplier]
    question: |
      Which functional interface has the abstract method signature `T get()` and takes no arguments?
    options:
      - "Consumer<T>"
      - "Function<T,R>"
      - "Supplier<T>"
      - "Predicate<T>"
    answer: 2
    explanation: |
      Supplier<T> declares `T get()` — it produces a value with no input, ideal for lazy/deferred
      creation (e.g., orElseGet). Consumer takes a value and returns void; Function maps T to R;
      Predicate takes a T and returns boolean.
    ref: "concepts.md#lambda-expressions-and-functional-interfaces"
  - id: java8-streams-lambdas-optional-004
    difficulty: beginner
    tags: [streams, terminal]
    question: |
      Which of the following is a TERMINAL stream operation?
    options:
      - "filter"
      - "map"
      - "sorted"
      - "collect"
    answer: 3
    explanation: |
      collect is terminal — it triggers pipeline execution and returns a non-stream result. filter,
      map, and sorted are intermediate operations that return another Stream and are lazy.
    ref: "concepts.md#stream-api-fundamentals-intermediate-versus-terminal-operations"
  - id: java8-streams-lambdas-optional-005
    difficulty: beginner
    tags: [optional, purpose]
    question: |
      What is the primary intended purpose of java.util.Optional?
    options:
      - "As a method return type to explicitly signal that a result may be absent"
      - "To replace all uses of null everywhere in a program including fields and parameters"
      - "To make collection access thread-safe by wrapping each element in a synchronized box"
      - "To improve the runtime performance of null checks by caching absent results internally"
    answer: 0
    explanation: |
      The JDK designers intended Optional as a return type that makes 'a result may be absent' explicit
      in the API. It was not meant for fields, parameters, or collection elements (it is not
      Serializable and adds allocation overhead). It has nothing to do with thread-safety or caching.
    ref: "concepts.md#optional-correct-usage-and-anti-patterns"
  - id: java8-streams-lambdas-optional-006
    difficulty: beginner
    tags: [method-reference]
    question: |
      Which lambda is equivalent to the method reference `String::toUpperCase` used as a
      `Function<String,String>`?
    options:
      - "() -> String.toUpperCase()"
      - "s -> s.toUpperCase()"
      - "(a, b) -> a.toUpperCase(b)"
      - "s -> String.toUpperCase(s)"
    answer: 1
    explanation: |
      String::toUpperCase is an 'instance method of an arbitrary object of a type' reference: the first
      (and here only) argument becomes the receiver, giving `s -> s.toUpperCase()`. toUpperCase is not
      static, so String.toUpperCase(s) does not compile.
    ref: "concepts.md#method-references"
  - id: java8-streams-lambdas-optional-007
    difficulty: beginner
    tags: [primitive-streams, range]
    question: |
      What does `IntStream.rangeClosed(1, 5).sum()` evaluate to?
    options:
      - "10"
      - "14"
      - "15"
      - "6"
    answer: 2
    explanation: |
      rangeClosed(1,5) is inclusive on both ends: 1,2,3,4,5. Their sum is 15. (range(1,5) would be
      1..4, summing to 10.)
    ref: "concepts.md#primitive-streams"
  - id: java8-streams-lambdas-optional-008
    difficulty: beginner
    tags: [flatmap]
    question: |
      You have a `Stream<List<Integer>>` and want a single `Stream<Integer>` of all the elements.
      Which operation do you use?
    options:
      - "map(List::stream)"
      - "reduce(List::stream)"
      - "filter(List::stream)"
      - "flatMap(List::stream)"
    answer: 3
    explanation: |
      flatMap(List::stream) maps each list to a stream and concatenates them into one flat
      Stream<Integer>. map(List::stream) would produce a Stream<Stream<Integer>> instead.
    ref: "concepts.md#flatmap-and-stream-flattening"
  - id: java8-streams-lambdas-optional-009
    difficulty: beginner
    tags: [collectors, joining]
    question: |
      Which collector concatenates the elements of a `Stream<String>` into one comma-separated String?
    options:
      - "Collectors.joining(\", \")"
      - "Collectors.toList()"
      - "Collectors.groupingBy(s -> s)"
      - "Collectors.counting()"
    answer: 0
    explanation: |
      Collectors.joining(", ") concatenates the stream's strings using ", " as a delimiter. An
      overload also accepts prefix and suffix. toList collects into a List, groupingBy builds a Map,
      and counting returns a Long.
    ref: "concepts.md#collectors-groupingby-joining-tomap-and-partitioningby"
  - id: java8-streams-lambdas-optional-010
    difficulty: beginner
    tags: [streams, single-use]
    question: |
      How many times can a single Stream instance be consumed by a terminal operation?
    options:
      - "Twice"
      - "Exactly once"
      - "Unlimited times, it is reusable like a List"
      - "Once per thread"
    answer: 1
    explanation: |
      A stream can be traversed only once. Reusing it after a terminal operation throws
      IllegalStateException: 'stream has already been operated upon or closed'. To iterate again,
      create a fresh stream from the source.
    ref: "concepts.md#stream-api-fundamentals-intermediate-versus-terminal-operations"
  - id: java8-streams-lambdas-optional-011
    difficulty: beginner
    tags: [closures, effectively-final]
    question: |
      A local variable captured by a lambda must be:
    options:
      - "Declared with the volatile keyword"
      - "A static field"
      - "Final or effectively final"
      - "Wrapped in an AtomicReference"
    answer: 2
    explanation: |
      Captured local variables must be final or effectively final (assigned once, never reassigned).
      Since Java 8 the explicit `final` keyword is not required as long as the variable is never
      reassigned. Instance/static fields are exempt because they are captured via `this`.
    ref: "concepts.md#closures-and-effectively-final-capture"
  - id: java8-streams-lambdas-optional-012
    difficulty: beginner
    tags: [optional, api]
    question: |
      Which factory method returns an empty Optional when passed a null reference, instead of throwing?
    options:
      - "Optional.of(value)"
      - "Optional.empty(value)"
      - "Optional.get(value)"
      - "Optional.ofNullable(value)"
    answer: 3
    explanation: |
      Optional.ofNullable(value) returns Optional.empty() when value is null and Optional.of(value)
      otherwise. Optional.of throws NullPointerException on null. get() takes no argument and
      empty() takes no argument.
    ref: "concepts.md#optional-correct-usage-and-anti-patterns"
  - id: java8-streams-lambdas-optional-013
    difficulty: intermediate
    tags: [lambdas, this-binding]
    question: |
      Inside a lambda expression, the keyword `this` refers to:
    options:
      - "The enclosing instance in which the lambda is defined"
      - "The lambda object itself, a newly created instance"
      - "null until the lambda is first invoked"
      - "The functional interface's default method holder"
    answer: 0
    explanation: |
      A lambda does not introduce a new scope for `this`; `this` refers to the enclosing instance.
      This differs from an anonymous inner class, where `this` refers to the anonymous instance
      itself. This is the key semantic difference between lambdas and anonymous classes.
    ref: "concepts.md#lambda-expressions-and-functional-interfaces"
  - id: java8-streams-lambdas-optional-014
    difficulty: intermediate
    tags: [short-circuiting, code-analysis]
    question: |
      What does this print?

      ```java
      Stream.of("a", "bb", "ccc", "dddd")
          .peek(s -> System.out.println("peek " + s))
          .filter(s -> s.length() > 1)
          .findFirst();
      ```
    options:
      - "peek a, peek bb, peek ccc, peek dddd"
      - "peek a, peek bb"
      - "peek bb"
      - "Nothing is printed because findFirst is lazy"
    answer: 1
    explanation: |
      Streams process elements vertically and findFirst short-circuits. 'a' is peeked but filtered out
      (length 1); 'bb' is peeked and passes the filter, so findFirst returns immediately. 'ccc' and
      'dddd' are never touched. findFirst is terminal, so the pipeline does execute.
    ref: "concepts.md#lazy-evaluation-and-short-circuiting"
  - id: java8-streams-lambdas-optional-015
    difficulty: intermediate
    tags: [optional, orelse-orelseget]
    question: |
      Given `Optional<String> o = Optional.of("value");`, which statement is TRUE about
      `o.orElse(expensiveCall())` versus `o.orElseGet(() -> expensiveCall())`?
    options:
      - "Both skip expensiveCall() because the Optional is present"
      - "orElseGet still invokes expensiveCall(); orElse does not"
      - "orElse still invokes expensiveCall() even though the value is present; orElseGet does not"
      - "Both always invoke expensiveCall() because Java evaluates method arguments eagerly before either call"
    answer: 2
    explanation: |
      orElse's argument is an ordinary expression evaluated before the method call, so
      expensiveCall() runs regardless of presence. orElseGet takes a Supplier and only invokes it when
      the Optional is empty. With a present value, orElseGet skips the call — this is the classic
      eager-vs-lazy bug.
    ref: "concepts.md#optional-correct-usage-and-anti-patterns"
  - id: java8-streams-lambdas-optional-016
    difficulty: intermediate
    tags: [collectors, tomap, code-analysis]
    question: |
      What happens when this runs and two employees share the name "Sam"?

      ```java
      Map<String, Employee> m = employees.stream()
          .collect(Collectors.toMap(Employee::getName, e -> e));
      ```
    options:
      - "The last Sam silently overwrites the first"
      - "The first Sam is kept and the second is silently ignored"
      - "It stores a List<Employee> under the key \"Sam\""
      - "It throws IllegalStateException due to a duplicate key"
    answer: 3
    explanation: |
      The two-argument Collectors.toMap throws IllegalStateException on duplicate keys. To resolve it,
      supply a merge function, e.g. toMap(getName, e->e, (a,b)->a) to keep the first. Note it does not
      silently overwrite — that behavior only comes from providing a merge function.
    ref: "concepts.md#collectors-groupingby-joining-tomap-and-partitioningby"
  - id: java8-streams-lambdas-optional-017
    difficulty: intermediate
    tags: [collectors, partitioningby]
    question: |
      How does partitioningBy differ from groupingBy on a boolean condition?
    options:
      - "partitioningBy always returns a Map<Boolean,...> containing BOTH true and false keys, even if one side is empty"
      - "partitioningBy returns a Map that omits the boolean key whose partition ends up with no elements"
      - "partitioningBy can only be used on parallel streams because it splits the source into two halves"
      - "There is no difference; partitioningBy is just an alias that delegates directly to groupingBy"
    answer: 0
    explanation: |
      partitioningBy is specialized for a boolean predicate and guarantees both the true and false
      entries exist (possibly mapping to empty lists). groupingBy only creates keys for classifier
      values that actually appear, so a missing group would simply be absent.
    ref: "concepts.md#collectors-groupingby-joining-tomap-and-partitioningby"
  - id: java8-streams-lambdas-optional-018
    difficulty: intermediate
    tags: [reduce, code-analysis]
    question: |
      What is the type and value of `result`?

      ```java
      List<Integer> nums = List.of(1, 2, 3, 4);
      var result = nums.stream().reduce((a, b) -> a + b);
      ```
    options:
      - "A primitive int holding the value 10"
      - "Optional<Integer> holding 10"
      - "Integer with value 24"
      - "It fails to compile without an identity"
    answer: 1
    explanation: |
      The single-argument reduce (no identity) returns Optional<T> because an empty stream has no
      result. Here the stream is non-empty, so it holds 10. The identity-based two-arg overload would
      return a plain int instead.
    ref: "concepts.md#map-filter-reduce-and-collect"
  - id: java8-streams-lambdas-optional-019
    difficulty: intermediate
    tags: [primitive-streams, code-analysis]
    question: |
      What is the difference between `Arrays.stream(arr)` and `Stream.of(arr)` when `arr` is an
      `int[]`?
    options:
      - "Both are overloaded to unbox and produce an identical IntStream iterating over the individual ints"
      - "Both wrap the whole array and produce a Stream<int[]> containing exactly one element, never the ints"
      - "Arrays.stream(arr) yields an IntStream of the ints; Stream.of(arr) yields a Stream<int[]> with one element"
      - "Stream.of(arr) fails to compile with an int[] because varargs reject primitive arrays outright"
    answer: 2
    explanation: |
      Arrays.stream(int[]) is overloaded to return an IntStream over the elements. Stream.of uses
      varargs; with an int[] it treats the whole array as a single T, producing Stream<int[]> of size
      1. (With an Integer[] both would stream the elements.) This is a classic trap.
    ref: "concepts.md#primitive-streams"
  - id: java8-streams-lambdas-optional-020
    difficulty: intermediate
    tags: [version, java9, takewhile]
    question: |
      In which Java version were the stream operations `takeWhile` and `dropWhile` added?
    options:
      - "Java 8"
      - "Java 16"
      - "Java 11"
      - "Java 9"
    answer: 3
    explanation: |
      takeWhile and dropWhile were added in Java 9, along with the 3-argument Stream.iterate,
      Optional.stream/or/ifPresentOrElse, and Collectors.flatMapping/filtering. Java 8 shipped the
      core Stream API without these.
    ref: "concepts.md#lazy-evaluation-and-short-circuiting"
  - id: java8-streams-lambdas-optional-021
    difficulty: intermediate
    tags: [parallel-streams]
    question: |
      Which workload is the BEST candidate for a parallel stream speedup?
    options:
      - "A large ArrayList of hundreds of thousands of elements with a CPU-heavy stateless per-element operation"
      - "A tiny LinkedList of roughly 50 elements paired with a trivial constant-time per-element operation"
      - "A stream that performs a blocking network I/O round-trip per element while awaiting remote responses"
      - "A short pipeline demanding strict encounter order and an order-sensitive findFirst short-circuit"
    answer: 0
    explanation: |
      Parallel streams help with large, cheaply and evenly splittable sources (arrays, ArrayList,
      IntStream.range) and stateless CPU-bound work. LinkedList splits poorly; blocking I/O starves
      the shared common pool; and strict-order findFirst constrains parallelism. Small N loses to
      overhead.
    ref: "concepts.md#parallel-streams-when-they-help-and-when-they-hurt"
  - id: java8-streams-lambdas-optional-022
    difficulty: intermediate
    tags: [optional, anti-pattern]
    question: |
      Which of the following is considered an Optional anti-pattern?
    options:
      - "Returning Optional.empty() to signal no result"
      - "Calling opt.get() without first checking presence"
      - "Using opt.map(...).orElse(default) to transform and default"
      - "Using opt.ifPresent(x -> ...) to act on a present value"
    answer: 1
    explanation: |
      Calling get() without checking throws NoSuchElementException and defeats Optional's purpose;
      prefer map/orElse/orElseThrow/ifPresent. Returning Optional.empty(), chaining map+orElse, and
      ifPresent are all correct idioms.
    ref: "concepts.md#optional-correct-usage-and-anti-patterns"
  - id: java8-streams-lambdas-optional-023
    difficulty: intermediate
    tags: [collectors, groupingby, downstream]
    question: |
      What does this produce?

      ```java
      Map<Dept, Long> m = emps.stream()
          .collect(Collectors.groupingBy(Emp::getDept, Collectors.counting()));
      ```
    options:
      - "A map from each department to the list of its employees"
      - "A map from each department to a single employee"
      - "A map from each department to the count of its employees"
      - "A compile error because counting() cannot be a downstream collector"
    answer: 2
    explanation: |
      groupingBy with a downstream Collectors.counting() maps each key (department) to the number of
      elements in that group, i.e., Map<Dept, Long>. Downstream collectors compose with groupingBy to
      transform each group's contents.
    ref: "concepts.md#collectors-groupingby-joining-tomap-and-partitioningby"
  - id: java8-streams-lambdas-optional-024
    difficulty: intermediate
    tags: [method-reference, comparator]
    question: |
      Why does `Comparator.comparing(Person::getName)` compile, given getName is an instance method?
    options:
      - "The compiler implicitly rewrites getName into a hidden static helper method before binding it"
      - "It only compiles when Person implements Comparable and exposes a natural ordering via compareTo"
      - "comparing demands a static method reference, so it silently treats getName as a static method"
      - "It is an 'arbitrary object' method reference where the compared element becomes the receiver of getName"
    answer: 3
    explanation: |
      Person::getName is an unbound (arbitrary-object) instance method reference. comparing needs a
      key-extractor Function<Person,K>; the Person passed in becomes the receiver on which getName is
      invoked. Person need not implement Comparable.
    ref: "concepts.md#method-references"
  - id: java8-streams-lambdas-optional-025
    difficulty: intermediate
    tags: [streams, code-analysis, reuse]
    question: |
      What is the result of running this code?

      ```java
      Stream<String> s = Stream.of("a", "b", "c");
      s.forEach(System.out::println);
      long n = s.count();
      ```
    options:
      - "Prints a, b, c then throws IllegalStateException at s.count()"
      - "Prints a, b, c and then prints 3, reusing the same stream twice"
      - "Prints a, b, c a second time as count() re-traverses the elements"
      - "Compile error: the Stream interface does not declare any count() method"
    answer: 0
    explanation: |
      The first terminal operation forEach consumes the stream. Reusing s for count() throws
      IllegalStateException: 'stream has already been operated upon or closed'. Streams are single-use.
    ref: "concepts.md#stream-api-fundamentals-intermediate-versus-terminal-operations"
  - id: java8-streams-lambdas-optional-026
    difficulty: intermediate
    tags: [primitive-streams, average, code-analysis]
    question: |
      What is the return type of `IntStream.of(1, 2, 3).average()`?
    options:
      - "int"
      - "OptionalDouble"
      - "double"
      - "Optional<Double>"
    answer: 1
    explanation: |
      average() returns OptionalDouble because the average of an empty stream is undefined. sum() by
      contrast returns a primitive int (0 for empty). Do not confuse the two; note it is OptionalDouble,
      not Optional<Double>.
    ref: "concepts.md#primitive-streams"
  - id: java8-streams-lambdas-optional-027
    difficulty: intermediate
    tags: [lambdas, anonymous-class, code-analysis]
    question: |
      What does this print?

      ```java
      public class T {
          String name = "outer";
          Runnable make() {
              return () -> System.out.println(this.name);
          }
          public static void main(String[] a) {
              new T().make().run();
          }
      }
      ```
    options:
      - "null"
      - "A compile error: this is not allowed in a lambda"
      - "outer"
      - "The Runnable's class name"
    answer: 2
    explanation: |
      In a lambda, `this` is the enclosing T instance, so this.name is "outer". Had this been an
      anonymous Runnable, `this` would refer to the Runnable instance (which has no name field), and
      the code would have to reference T.this.name.
    ref: "concepts.md#lambda-expressions-and-functional-interfaces"
  - id: java8-streams-lambdas-optional-028
    difficulty: intermediate
    tags: [flatmap, map]
    question: |
      When should you prefer flatMap over map?
    options:
      - "When the mapper returns exactly one value per element and you simply want a one-to-one transformation"
      - "When you need to reorder the pipeline into sorted encounter order using the element's natural ordering"
      - "When you want to discard elements that fail a boolean predicate while keeping the rest unchanged"
      - "When the mapper returns zero or more results per element (a stream/collection) that you want flattened"
    answer: 3
    explanation: |
      flatMap is for one-to-many: the mapper returns a stream per element and flatMap concatenates
      them. If the mapper returns exactly one value, use map. flatMap does not filter or sort.
    ref: "concepts.md#flatmap-and-stream-flattening"
  - id: java8-streams-lambdas-optional-029
    difficulty: intermediate
    tags: [streams, loop, checked-exceptions]
    question: |
      Why is throwing a checked exception from inside a `stream.map(...)` lambda problematic?
    options:
      - "The Function interface's apply method does not declare checked exceptions, so the lambda cannot throw them directly"
      - "The Stream API installs a handler that disables all exception propagation inside pipeline stages entirely"
      - "Checked exceptions thrown in a lambda are always auto-converted into unchecked Error subtypes at runtime"
      - "map internally catches and silently swallows every checked exception, discarding the offending elements"
    answer: 0
    explanation: |
      Function.apply declares no checked exceptions, so a lambda implementing it cannot throw one; you
      must wrap and rethrow as unchecked. A plain loop can use try/catch naturally, which is one
      readability advantage of loops over streams.
    ref: "concepts.md#stream-versus-loop-trade-offs"
  - id: java8-streams-lambdas-optional-030
    difficulty: intermediate
    tags: [version, java16, tolist]
    question: |
      Which Java version added `Stream.toList()` (returning an unmodifiable list) as a convenient
      terminal operation distinct from `collect(Collectors.toList())`?
    options:
      - "Java 8"
      - "Java 16"
      - "Java 10"
      - "Java 21"
    answer: 1
    explanation: |
      Stream.toList() arrived in Java 16 and always returns an unmodifiable list. Collectors.toList()
      (Java 8) gives no mutability guarantee, and Collectors.toUnmodifiableList() (Java 10) returns an
      immutable list.
    ref: "concepts.md#collectors-groupingby-joining-tomap-and-partitioningby"
  - id: java8-streams-lambdas-optional-031
    difficulty: intermediate
    tags: [optional, flatmap]
    question: |
      You call `opt.map(fn)` where `fn` returns `Optional<String>`. What is the resulting type, and how
      do you avoid nesting?
    options:
      - "It returns a flat Optional<String>; map auto-unwraps the inner Optional so no nesting occurs"
      - "It returns a bare String because map eagerly calls get() on the inner Optional for you"
      - "It returns Optional<Optional<String>>; use flatMap instead to get Optional<String>"
      - "It fails to compile because map rejects any mapper whose return type is itself an Optional"
    answer: 2
    explanation: |
      map wraps the mapper's result in another Optional, yielding Optional<Optional<String>>. Using
      flatMap, whose mapper already returns an Optional, avoids the nesting and gives a flat
      Optional<String>. This mirrors Stream.map vs flatMap.
    ref: "concepts.md#optional-correct-usage-and-anti-patterns"
  - id: java8-streams-lambdas-optional-032
    difficulty: intermediate
    tags: [collectors, mutability]
    question: |
      What guarantee does `Collectors.toList()` give about the returned List?
    options:
      - "It always returns an unmodifiable ArrayList that throws on any structural mutation attempt"
      - "It always returns a thread-safe CopyOnWriteArrayList safe for concurrent iteration and writes"
      - "It always returns a LinkedList optimized for fast head and tail insertion of elements"
      - "It gives NO guarantee about type, mutability, serializability, or thread-safety"
    answer: 3
    explanation: |
      Collectors.toList() guarantees nothing about the concrete type, mutability, serializability, or
      thread-safety. For an immutable list use toUnmodifiableList() (Java 10) or Stream.toList()
      (Java 16). Relying on it being a mutable ArrayList is fragile.
    ref: "concepts.md#collectors-groupingby-joining-tomap-and-partitioningby"
  - id: java8-streams-lambdas-optional-033
    difficulty: advanced
    tags: [reduce, combiner, parallel]
    question: |
      In the 3-argument `reduce(identity, accumulator, combiner)`, when is the combiner actually
      invoked?
    options:
      - "Only when merging partial results, which in practice happens during parallel execution"
      - "On every single element during sequential execution, replacing the accumulator entirely for each item"
      - "Never at runtime; it exists purely as type documentation and the JIT strips it out before execution"
      - "Exactly once at the very start, where it is invoked to validate that the supplied identity is correct"
    answer: 0
    explanation: |
      The combiner merges partial accumulations of type U. In a sequential stream there is a single
      accumulation so the combiner is not needed; it is exercised when the pipeline runs in parallel
      and sub-results must be merged. It must be associative and consistent with the accumulator.
    ref: "concepts.md#map-filter-reduce-and-collect"
  - id: java8-streams-lambdas-optional-034
    difficulty: advanced
    tags: [parallel-streams, common-pool]
    question: |
      Why can a single blocking task inside one parallel stream degrade unrelated code elsewhere in
      the same JVM?
    options:
      - "Parallel streams spawn a brand-new OS thread for every element, quickly exhausting the process thread limit"
      - "All parallel streams share the ForkJoinPool.commonPool by default, so a blocked task starves that shared pool"
      - "Parallel streams acquire a single JVM-wide global lock for the entire duration of the pipeline's execution"
      - "The garbage collector triggers a stop-the-world pause across all threads whenever a parallel stream runs"
    answer: 1
    explanation: |
      By default all parallel streams use the shared ForkJoinPool.commonPool (size ~ #cores - 1). A
      blocking or very long task occupies a worker thread, starving every other parallel stream and
      library code that relies on the common pool. Blocking work should use a dedicated pool or avoid
      parallel streams.
    ref: "concepts.md#parallel-streams-when-they-help-and-when-they-hurt"
  - id: java8-streams-lambdas-optional-035
    difficulty: advanced
    tags: [collectors, tomap, null-value, code-analysis]
    question: |
      What happens here if `getEmail()` returns null for some user?

      ```java
      Map<Long, String> m = users.stream()
          .collect(Collectors.toMap(User::getId, User::getEmail));
      ```
    options:
      - "The null value is stored under that id, exactly like a plain HashMap.put accepting a null value"
      - "That entry is silently skipped and the resulting map simply omits any id whose email was null"
      - "It throws NullPointerException because toMap is implemented with Map.merge which rejects null values"
      - "It substitutes an empty string in place of the null email before inserting the entry into the map"
    answer: 2
    explanation: |
      Collectors.toMap uses Map.merge internally, and merge throws NullPointerException on a null
      value — unlike HashMap.put which permits null values. This surprises people who expect
      HashMap-like tolerance. Filter out or map nulls first, or use a different construction.
    ref: "concepts.md#collectors-groupingby-joining-tomap-and-partitioningby"
  - id: java8-streams-lambdas-optional-036
    difficulty: advanced
    tags: [closures, mutation, code-analysis]
    question: |
      Why does this compile, and what is the risk in a parallel stream?

      ```java
      int[] sum = {0};
      list.parallelStream().forEach(x -> sum[0] += x);
      ```
    options:
      - "It fails to compile because the captured local variable sum is not effectively final within the lambda"
      - "It compiles, but parallelStream().forEach silently falls back to sequential execution so no race can occur"
      - "It compiles and is fully thread-safe because Java arrays synchronize every element write automatically"
      - "It compiles because the array reference sum is effectively final; but sum[0] += x is a data race in parallel"
    answer: 3
    explanation: |
      The captured reference `sum` never changes, so it is effectively final and compiles; only the
      array contents mutate. In a parallel stream, concurrent sum[0] += x is an unsynchronized
      read-modify-write data race producing wrong/nondeterministic results. Use reduce/collect for
      accumulation instead.
    ref: "concepts.md#closures-and-effectively-final-capture"
  - id: java8-streams-lambdas-optional-037
    difficulty: advanced
    tags: [reduce, collect, performance]
    question: |
      Why is `stream.reduce("", String::concat)` a poor way to concatenate strings compared to
      `collect(Collectors.joining())`?
    options:
      - "reduce is an immutable reduction that creates a new String at each step, giving O(n^2) behavior; joining uses a mutable StringBuilder"
      - "reduce rejects a String identity argument and demands a numeric zero, so the empty case forces autoboxing"
      - "String::concat is not associative, so reduce detects the violation at runtime and throws IllegalArgumentException"
      - "collect defers all work as a lazy intermediate step while reduce eagerly materializes each partial result"
    answer: 0
    explanation: |
      reduce performs an immutable reduction: each concat allocates a new String, so total work is
      quadratic in the number of characters. collect(joining()) is a mutable reduction backed by a
      StringBuilder, giving linear behavior. Prefer collect for accumulating into containers.
    ref: "concepts.md#map-filter-reduce-and-collect"
  - id: java8-streams-lambdas-optional-038
    difficulty: advanced
    tags: [lambdas, invokedynamic, internals]
    question: |
      How does a lambda expression differ from an anonymous inner class in terms of compilation and
      class loading?
    options:
      - "A lambda compiles to a separate Outer$1.class file just like an anonymous class, loaded eagerly by the classloader at enclosing-class initialization time"
      - "A lambda compiles to a private method plus an invokedynamic bootstrap via LambdaMetafactory, avoiding a per-lambda class file and allowing caching of stateless instances"
      - "A lambda is interpreted directly from the AST at runtime and is never lowered to bytecode, so the JIT profiles and inlines it purely from source-level metadata"
      - "There is no difference; javac fully desugars every lambda into an equivalent anonymous class before bytecode generation, producing identical .class output"
    answer: 1
    explanation: |
      Anonymous classes produce a separate class file and allocate eagerly. Lambdas use invokedynamic;
      the LambdaMetafactory bootstrap links the lambda lazily on first execution, avoids emitting a
      class file per lambda, and can cache a stateless (non-capturing) lambda as a singleton.
    ref: "concepts.md#lambda-expressions-and-functional-interfaces"
  - id: java8-streams-lambdas-optional-039
    difficulty: advanced
    tags: [lazy-evaluation, peek, internals]
    question: |
      Why does the JavaDoc warn that `peek` should be used only for debugging?
    options:
      - "peek is a terminal operation that consumes and closes the stream, so any operation chained after it throws IllegalStateException"
      - "peek always dispatches its action to a separate worker thread from the common pool, making its output order nondeterministic"
      - "Because peek is lazy and pipeline optimizations (e.g., eliding operations when a count is derivable) may cause its action never to run for some or all elements"
      - "peek reorders elements unpredictably because it buffers the upstream and re-emits them sorted by hashCode for debugging"
    answer: 2
    explanation: |
      peek is an intermediate, lazy operation. In some pipelines the JDK can optimize away element
      realization (for instance, deriving a count from the known source size), so peek's side effect
      may not execute for every element. Therefore essential logic must never depend on peek.
    ref: "concepts.md#lazy-evaluation-and-short-circuiting"
  - id: java8-streams-lambdas-optional-040
    difficulty: advanced
    tags: [collectors, groupingby, factory]
    question: |
      Which default data structures does `Collectors.groupingBy(classifier)` (single-arg) use, and how
      do you change the outer map type?
    options:
      - "TreeMap for the result and LinkedList for each group; both are hard-wired and cannot be changed by any overload"
      - "LinkedHashMap for insertion order and HashSet per group; override the map type by passing a Comparator argument"
      - "ConcurrentHashMap and CopyOnWriteArrayList for thread safety; call sequential() beforehand to switch to plain types"
      - "HashMap and ArrayList; supply a map factory, e.g. groupingBy(fn, TreeMap::new, toList())"
    answer: 3
    explanation: |
      The single-arg groupingBy uses a HashMap for the result and ArrayList for each group. To get an
      ordered map, use the three-arg form with a map supplier such as TreeMap::new and an explicit
      downstream collector like toList().
    ref: "concepts.md#collectors-groupingby-joining-tomap-and-partitioningby"
  - id: java8-streams-lambdas-optional-041
    difficulty: advanced
    tags: [optional, serializable, fields]
    question: |
      Why is declaring a field of type `Optional<X>` generally discouraged?
    options:
      - "Optional is not Serializable and adds an allocation; the designers intended it for return types, not fields"
      - "Optional cannot be parameterized as a generic type in a field declaration, so the compiler erases it to raw Object"
      - "The JVM's verifier explicitly forbids Optional-typed instance fields and rejects such classes at class-load time"
      - "Optional fields hold hidden strong references that pin their contents and prevent the garbage collector from reclaiming them"
    answer: 0
    explanation: |
      Optional was designed as a return type. It is not Serializable, so an Optional field can break
      serialization, and it adds an extra object allocation and indirection per instance. Prefer null
      (or an empty collection) for fields and use Optional at API boundaries returning values.
    ref: "concepts.md#optional-correct-usage-and-anti-patterns"
  - id: java8-streams-lambdas-optional-042
    difficulty: advanced
    tags: [parallel-streams, ordering]
    question: |
      In a parallel stream, why should you avoid `forEach` when you need results in encounter order,
      and what should you use instead?
    options:
      - "forEach is illegal on a parallel stream and throws UnsupportedOperationException; use map to iterate side effects instead"
      - "forEach does not guarantee encounter order in parallel; use forEachOrdered or collect for ordered results"
      - "forEach always sorts elements into natural order first; call unordered() beforehand to preserve the original order"
      - "forEach throws ConcurrentModificationException in parallel because worker threads mutate the shared spliterator concurrently"
    answer: 1
    explanation: |
      In parallel execution forEach makes no encounter-order guarantee (elements are processed on
      multiple threads). Use forEachOrdered when order matters, or collect into an ordered container.
      Note ordered processing sacrifices some parallel throughput.
    ref: "concepts.md#parallel-streams-when-they-help-and-when-they-hurt"
  - id: java8-streams-lambdas-optional-043
    difficulty: advanced
    tags: [reduce, associativity, code-analysis]
    question: |
      For a `reduce` to give the same result sequentially and in parallel, the accumulator/combiner
      must be:
    options:
      - "Commutative only, so that swapping any two operands leaves the merged result unchanged across threads"
      - "Synchronized on a shared lock so concurrent accumulation into the partial results is mutually exclusive"
      - "Associative, with a proper identity value"
      - "Idempotent, so re-applying the accumulator to an already-processed element yields the same accumulation"
    answer: 2
    explanation: |
      Correct parallel reduction requires the combining operation to be associative and the identity to
      be a true identity (combine(identity, x) == x). Associativity lets sub-results be merged in any
      grouping. Commutativity is not required by the spec, and synchronization is unnecessary for a
      correct associative reduction.
    ref: "concepts.md#map-filter-reduce-and-collect"
  - id: java8-streams-lambdas-optional-044
    difficulty: advanced
    tags: [streams, iterate, code-analysis]
    question: |
      What happens when this runs?

      ```java
      Stream.iterate(1, n -> n * 2).forEach(System.out::println);
      ```
    options:
      - "Prints 1, 2, 4, 8 then stops because iterate defaults to a built-in cap of four elements without a limit"
      - "Prints nothing at all because iterate is lazy and forEach never triggers evaluation of an unbounded source"
      - "Throws IllegalStateException immediately since forEach refuses to consume a stream that has no defined size"
      - "Prints powers of two forever (infinite loop) because the stream is unbounded"
    answer: 3
    explanation: |
      The two-arg Stream.iterate produces an infinite stream, and forEach is not short-circuiting, so
      it prints doubling values forever. You must bound it with limit(...), or use the Java 9 3-arg
      iterate(seed, hasNext, next) which self-terminates.
    ref: "concepts.md#lazy-evaluation-and-short-circuiting"
  - id: java8-streams-lambdas-optional-045
    difficulty: advanced
    tags: [collectors, nested, code-analysis]
    question: |
      What does this build?

      ```java
      Map<Dept, String> m = emps.stream().collect(
          Collectors.groupingBy(Emp::getDept,
              Collectors.mapping(Emp::getName, Collectors.joining(", "))));
      ```
    options:
      - "A map from department to a comma-joined String of that department's employee names"
      - "A map from department to a List of employee objects, because mapping is ignored when nested and toList is used by default"
      - "A map from each employee name to its department, since the innermost joining collector determines the map's key type"
      - "A compile error, because Collectors.mapping cannot be supplied as a downstream collector inside groupingBy"
    answer: 0
    explanation: |
      The nested downstream collectors first group by department, then within each group map each Emp
      to its name and join those names with ", ". The result is Map<Dept, String>. Collectors compose
      arbitrarily deep this way.
    ref: "concepts.md#collectors-groupingby-joining-tomap-and-partitioningby"
  - id: java8-streams-lambdas-optional-046
    difficulty: advanced
    tags: [optional, orelse, lazy, code-analysis]
    question: |
      A method does `return cache.get(key).orElse(loadFromDb(key));` where get returns Optional. Users
      report the DB is hit even on cache hits. What is the fix?
    options:
      - "Wrap the whole expression in a synchronized block so the eager DB call is serialized and executes only once"
      - "Replace orElse(loadFromDb(key)) with orElseGet(() -> loadFromDb(key)) so the DB call is deferred and only runs on a miss"
      - "Use get() instead of orElse, since get() lazily loads the fallback value only when the Optional is empty"
      - "Change Optional to a nullable return and check with == null, because Optional itself is what forces the eager load"
    answer: 1
    explanation: |
      orElse's argument loadFromDb(key) is evaluated eagerly before orElse runs, so it executes even on
      a cache hit. orElseGet takes a Supplier and only invokes it when the Optional is empty, so the DB
      is queried only on a miss. This is the canonical orElse-vs-orElseGet bug.
    ref: "concepts.md#optional-correct-usage-and-anti-patterns"
  - id: java8-streams-lambdas-optional-047
    difficulty: advanced
    tags: [parallel-streams, concurrent-collector]
    question: |
      What is the advantage of `groupingByConcurrent`/`toConcurrentMap` over their non-concurrent
      counterparts in a parallel stream?
    options:
      - "They sort the resulting map entries automatically into natural key order as a side effect of concurrent insertion"
      - "They quietly force the stream back to sequential execution so that map writes are safe from any concurrent access"
      - "They accumulate into a shared concurrent map, avoiding the cost of merging per-thread maps, but shine on unordered streams"
      - "They guarantee that entries are stored in strict encounter order even when the pipeline runs across many threads"
    answer: 2
    explanation: |
      Non-concurrent collectors accumulate into per-thread containers and merge them, which is costly.
      Concurrent collectors write directly into one shared concurrent map, avoiding the merge step;
      they perform best on unordered streams and give up encounter-order guarantees.
    ref: "concepts.md#parallel-streams-when-they-help-and-when-they-hurt"
  - id: java8-streams-lambdas-optional-048
    difficulty: advanced
    tags: [primitive-streams, boxed, code-analysis]
    question: |
      You have an `IntStream` and need a `List<Integer>`. Which is correct?
    options:
      - "intStream.collect(Collectors.toList())"
      - "Collectors.toList(intStream)"
      - "intStream.toList()"
      - "intStream.boxed().collect(Collectors.toList())"
    answer: 3
    explanation: |
      IntStream's collect signature differs (supplier/accumulator/combiner) and does not accept a
      Collector, so you must first box the primitives with boxed() to obtain a Stream<Integer>, then
      collect to a list. intStream.toList() does not exist on primitive streams.
    ref: "concepts.md#primitive-streams"
  - id: java8-streams-lambdas-optional-049
    difficulty: expert
    tags: [streams, ordering, distinct, internals]
    question: |
      In a parallel ordered stream, why can `distinct()` be more expensive than in a sequential stream?
    options:
      - "To preserve encounter order for duplicates, distinct must do extra buffering/coordination across threads; making the stream unordered relaxes this"
      - "distinct is not supported on parallel streams at all and throws UnsupportedOperationException the moment the pipeline splits"
      - "distinct silently forces the entire pipeline back to sequential execution, which is what makes it slower than the parallel case"
      - "distinct recomputes the hashCode of every element again on each cross-thread merge, doubling the hashing cost per duplicate"
    answer: 0
    explanation: |
      For an ordered stream, distinct must keep the FIRST occurrence in encounter order, which in
      parallel requires extra buffering and cross-thread coordination. Calling unordered() (or using an
      inherently unordered source) lets distinct drop the ordering constraint and run more cheaply.
    ref: "concepts.md#parallel-streams-when-they-help-and-when-they-hurt"
  - id: java8-streams-lambdas-optional-050
    difficulty: expert
    tags: [collectors, teeing, version]
    question: |
      `Collectors.teeing`, which feeds each element to two downstream collectors and merges their
      results with a BiFunction, was introduced in which Java version?
    options:
      - "Java 8"
      - "Java 12"
      - "Java 9"
      - "Java 17"
    answer: 1
    explanation: |
      Collectors.teeing was added in Java 12. It sends every element to two collectors (e.g., counting
      and summing) and combines their results — handy for computing an average in one pass. Java 8 and
      9 predate it; Java 17 is later.
    ref: "concepts.md#collectors-groupingby-joining-tomap-and-partitioningby"
  - id: java8-streams-lambdas-optional-051
    difficulty: expert
    tags: [lambdas, overload-resolution, code-analysis]
    question: |
      Consider:

      ```java
      void run(Runnable r) {}
      void run(Callable<String> c) {}
      // call site:
      run(() -> "hello");
      ```
      What is the outcome?
    options:
      - "Compile error: the lambda is always ambiguous between the two"
      - "It resolves to run(Runnable) because lambdas are Runnable by default"
      - "Ambiguous? No — it resolves to run(Callable) because the lambda body yields a value"
      - "It resolves to whichever overload is declared first"
    answer: 2
    explanation: |
      A lambda's body `() -> "hello"` returns a value, which is incompatible with Runnable's void run()
      but compatible with Callable's String call(). Overload resolution picks run(Callable). Had the
      body been a void-compatible statement expression, disambiguation could differ. (A truly ambiguous
      case would require an explicit cast.)
    ref: "concepts.md#lambda-expressions-and-functional-interfaces"
  - id: java8-streams-lambdas-optional-052
    difficulty: expert
    tags: [streams, findany, findfirst]
    question: |
      In a parallel stream, what is the practical difference between `findFirst` and `findAny`?
    options:
      - "findAny is illegal on a parallel stream and throws IllegalStateException unless you first call sequential()"
      - "findFirst returns an Optional wrapper, but findAny unwraps and returns the raw matching element directly"
      - "They are identical in every respect; findAny is merely a documented alias that delegates straight to findFirst"
      - "findFirst must return the first element in encounter order (constraining parallelism), while findAny may return any matching element, often faster in parallel"
    answer: 3
    explanation: |
      findFirst honors encounter order and must return the first matching element, which limits how
      much a parallel stream can shortcut. findAny is free to return any match, letting the runtime
      return whatever a thread finds first — usually cheaper in parallel. Both return Optional.
    ref: "concepts.md#lazy-evaluation-and-short-circuiting"
  - id: java8-streams-lambdas-optional-053
    difficulty: expert
    tags: [optional, stream, version, code-analysis]
    question: |
      What does this idiom accomplish, and which Java version enabled `Optional::stream` here?

      ```java
      List<User> users = ids.stream()
          .map(repo::findById)          // Stream<Optional<User>>
          .flatMap(Optional::stream)    // (X)
          .collect(Collectors.toList());
      ```
    options:
      - "It keeps only present values by turning each Optional into a 0- or 1-element stream; Optional.stream() was added in Java 9"
      - "It throws NoSuchElementException the moment any empty Optional is reached, unwinding the whole pipeline; Optional.stream() was added in Java 8"
      - "It boxes each Optional into a singleton List and flattens those, preserving empties as null placeholders; the method was added in Java 10"
      - "It fails to compile on any release before Java 16, because flatMap only accepts an Optional-returning mapper starting from that version"
    answer: 0
    explanation: |
      Optional.stream() (Java 9) yields an empty stream for absent values and a single-element stream
      for present ones. flatMapping over it filters out empties and unwraps present values in one step,
      producing a List<User> of only the found users.
    ref: "concepts.md#optional-correct-usage-and-anti-patterns"
  - id: java8-streams-lambdas-optional-054
    difficulty: expert
    tags: [streams, stateful, sorted, internals]
    question: |
      Why does `sorted()` limit the benefit of laziness and short-circuiting in a pipeline?
    options:
      - "sorted is a terminal operation that eagerly triggers the pipeline and returns the ordered result immediately, closing the stream"
      - "sorted is a stateful intermediate operation that must consume and buffer all upstream elements before it can emit any, so it blocks short-circuiting through it"
      - "sorted implicitly converts the stream into a parallel stream so the comparisons can be spread across worker threads for speed"
      - "sorted disables the ForkJoinPool for the remainder of the pipeline so ordering cannot be corrupted by concurrent processing"
    answer: 1
    explanation: |
      sorted is a stateful intermediate operation: it cannot emit its first element until it has seen
      every upstream element (to know the order). This forces full materialization of upstream data at
      that stage, defeating short-circuiting for operations placed before it in the flow.
    ref: "concepts.md#lazy-evaluation-and-short-circuiting"
  - id: java8-streams-lambdas-optional-055
    difficulty: expert
    tags: [reduce, code-analysis, type]
    question: |
      Which reduce call correctly sums the total length of all strings and compiles?

      ```java
      List<String> words = List.of("ab", "cde");
      ```
    options:
      - "words.stream().reduce(0, (acc, w) -> acc + w.length())  // 2-arg, won't compile"
      - "words.stream().reduce((a, b) -> a + b)  // 1-arg concat form, yields Optional<String>, not a length total"
      - "words.stream().reduce(0, (acc, w) -> acc + w.length(), Integer::sum)  // 3-arg with combiner"
      - "words.stream().reduce(0, Integer::sum)  // Integer::sum needs two ints, so the String arg won't compile"
    answer: 2
    explanation: |
      When the result type (Integer) differs from the element type (String), you need the 3-arg reduce:
      identity 0, accumulator (Integer, String) -> Integer, and a combiner (Integer, Integer) -> Integer
      such as Integer::sum. The 2-arg form requires accumulator type BinaryOperator<T> matching the
      element type, so it cannot mix String and int.
    ref: "concepts.md#map-filter-reduce-and-collect"
  - id: java8-streams-lambdas-optional-056
    difficulty: expert
    tags: [parallel-streams, custom-pool]
    question: |
      How can you run a parallel stream on a dedicated ForkJoinPool instead of the common pool?
    options:
      - "Call stream.parallel(myPool), passing your ForkJoinPool as an overloaded argument to the parallel() method"
      - "It is impossible; every parallel stream is permanently bound to ForkJoinPool.commonPool with no escape hatch"
      - "Set the system property java.util.stream.pool to your pool's name before the terminal operation runs"
      - "Submit the terminal operation as a task to your own ForkJoinPool, e.g. myPool.submit(() -> stream.parallel()....).get()"
    answer: 3
    explanation: |
      There is no API to pass a pool to parallel(). The known trick is to submit the pipeline's terminal
      operation to your own ForkJoinPool via submit(...).get(); the parallel stream then uses the pool
      whose worker thread invokes it. This isolates blocking work from the shared common pool. It relies
      on ForkJoinTask behavior and should be used carefully.
    ref: "concepts.md#parallel-streams-when-they-help-and-when-they-hurt"
  - id: java8-streams-lambdas-optional-057
    difficulty: expert
    tags: [version, java9, iterate]
    question: |
      Which Java version added the 3-argument `Stream.iterate(seed, hasNext, next)` that terminates
      itself without needing `limit`?
    options:
      - "Java 9"
      - "Java 8"
      - "Java 11"
      - "Java 14"
    answer: 0
    explanation: |
      The self-bounding 3-arg Stream.iterate(seed, predicate, next) was added in Java 9, alongside
      takeWhile/dropWhile. In Java 8 only the infinite 2-arg iterate existed, requiring an explicit
      limit to terminate.
    ref: "concepts.md#lazy-evaluation-and-short-circuiting"
  - id: java8-streams-lambdas-optional-058
    difficulty: expert
    tags: [flatmap, mapmulti, version]
    question: |
      Since Java 16, which operation offers a lower-allocation alternative to flatMap by pushing
      results to a consumer instead of creating an intermediate stream per element?
    options:
      - "Stream.flatMapToObj"
      - "Stream.mapMulti"
      - "Stream.expand"
      - "Stream.spread"
    answer: 1
    explanation: |
      Stream.mapMulti (Java 16) lets the mapper push zero or more results into a downstream consumer,
      avoiding a fresh Stream allocation per element that flatMap requires. It can be more efficient
      when each element yields few results in a hot path. The other names do not exist.
    ref: "concepts.md#flatmap-and-stream-flattening"
  - id: java8-streams-lambdas-optional-059
    difficulty: expert
    tags: [collectors, filtering, groupingby, code-analysis]
    question: |
      Why prefer `groupingBy(byDept, filtering(e -> e.active, toList()))` (Java 9) over
      `stream.filter(e -> e.active).collect(groupingBy(byDept, toList()))` when you want every
      department key present?
    options:
      - "filtering runs in parallel automatically, splitting the predicate evaluation across common-pool threads for you"
      - "There is no functional difference; both forms always yield exactly the same map with the same set of keys"
      - "The upfront filter removes elements before grouping, so departments with no active employees lose their key entirely; downstream filtering keeps the key with an empty list"
      - "filtering is faster because it skips the classifier's hashing step and buckets elements by identity instead"
    answer: 2
    explanation: |
      Filtering before groupingBy discards elements first, so a department whose employees are all
      inactive produces no key at all. Collectors.filtering (Java 9) applies the predicate as a
      downstream collector, so the grouping key is still created and maps to an empty list. Choose based
      on whether you need all keys represented.
    ref: "concepts.md#collectors-groupingby-joining-tomap-and-partitioningby"
  - id: java8-streams-lambdas-optional-060
    difficulty: expert
    tags: [streams, loop, performance, internals]
    question: |
      For a trivial sum over a small primitive array, why can a plain `for` loop outperform a
      sequential stream?
    options:
      - "Streams always run in parallel, so the thread-scheduling overhead dominates a tiny single-threaded sum"
      - "Streams disable JIT compilation for their pipeline stages, forcing every lambda to run interpreted"
      - "for loops use SIMD vector instructions but the JLS explicitly forbids streams from ever being vectorized"
      - "The stream pipeline adds per-element abstraction (lambda invocation, pipeline traversal) that the JIT may not fully elide for tiny workloads, whereas a counted loop is trivially optimized/vectorized"
    answer: 3
    explanation: |
      A sequential stream introduces pipeline and lambda-invocation overhead. For tiny, simple
      workloads the JIT may not fully inline/eliminate that overhead, while a counted for loop is a
      textbook target for loop optimizations and vectorization. For large or parallel/primitive-stream
      workloads the gap narrows or reverses — always measure before rewriting hot paths.
    ref: "concepts.md#stream-versus-loop-trade-offs"
