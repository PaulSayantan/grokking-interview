topic: "Immutability and String Handling"
domain: java-jvm
topic_slug: immutability-strings
version: 1
questions:
  - id: immutability-strings-001
    difficulty: beginner
    tags: [immutability, definition]
    question: |
      What does it mean for a Java object to be "immutable"?
    options:
      - "Its observable state cannot change after construction; any 'change' returns a new object"
      - "Its fields can be changed only from within the same package"
      - "It is stored in a special read-only region of the heap that the GC never touches"
      - "It can only be created via reflection"
    answer: 0
    explanation: |
      An immutable object's observable state is fixed at construction. Operations that
      appear to modify it (e.g. String.toUpperCase) return new objects. It is not about
      package visibility, GC regions, or reflection.
    ref: "concepts.md#why-immutability"
  - id: immutability-strings-002
    difficulty: beginner
    tags: [immutability, thread-safety]
    question: |
      Which is a direct benefit of immutability?
    options:
      - "Immutable objects are always faster to allocate than mutable ones"
      - "Immutable objects never need a constructor"
      - "Immutable objects are automatically serializable"
      - "Immutable objects can be safely shared across threads without synchronization"
    answer: 3
    explanation: |
      With no writable state there are no data races, so immutable objects (once safely
      published) can be shared across threads without locks. They are not inherently
      faster to allocate, still need constructors, and are not automatically serializable.
    ref: "concepts.md#why-immutability"
  - id: immutability-strings-003
    difficulty: beginner
    tags: [string, immutability]
    question: |
      What does the following print?
      
      ```java
      String s = "hello";
      s.toUpperCase();
      System.out.println(s);
      ```
    options:
      - "HELLO"
      - "Hello"
      - "hello"
      - "It throws an exception"
    answer: 2
    explanation: |
      String is immutable. toUpperCase() returns a NEW string but does not modify s, and
      the return value is discarded. So s is still "hello". To capture it you would need
      s = s.toUpperCase().
    ref: "concepts.md#string-immutability-and-the-string-pool"
  - id: immutability-strings-004
    difficulty: beginner
    tags: [string-pool, literals]
    question: |
      What does this print?
      
      ```java
      String a = "java";
      String b = "java";
      System.out.println(a == b);
      ```
    options:
      - "false"
      - "true"
      - "Compilation error"
      - "It depends on the JVM vendor"
    answer: 1
    explanation: |
      Compile-time string literals are automatically interned, so both a and b reference
      the same pooled instance and == is true. This is guaranteed by the JLS, not
      vendor-specific.
    ref: "concepts.md#string-immutability-and-the-string-pool"
  - id: immutability-strings-005
    difficulty: beginner
    tags: [stringbuilder, thread-safety]
    question: |
      Which statement about StringBuilder is correct?
    options:
      - "It is mutable and NOT thread-safe"
      - "It is immutable"
      - "It is thread-safe because its methods are synchronized"
      - "It was introduced before StringBuffer"
    answer: 0
    explanation: |
      StringBuilder (added in Java 5) is a mutable, non-synchronized character buffer.
      StringBuffer is the older, synchronized (thread-safe) sibling. StringBuilder is
      neither immutable nor thread-safe.
    ref: "concepts.md#string-vs-stringbuilder-vs-stringbuffer"
  - id: immutability-strings-006
    difficulty: beginner
    tags: [records, version]
    question: |
      In which JDK did records become a final (non-preview) language feature?
    options:
      - "JDK 14"
      - "JDK 15"
      - "JDK 17"
      - "JDK 16"
    answer: 3
    explanation: |
      Records were previewed in JDK 14 (JEP 359) and JDK 15 (JEP 384), and finalized in
      JDK 16 (JEP 395). Sealed classes finalized later, in JDK 17.
    ref: "concepts.md#records-as-immutable-carriers"
  - id: immutability-strings-007
    difficulty: beginner
    tags: [string, equals]
    question: |
      To compare the CONTENTS of two String objects for equality, you should use:
    options:
      - "The == operator"
      - "System.identityHashCode()"
      - "The equals() method"
      - "The compareTo() sign only"
    answer: 2
    explanation: |
      equals() compares character contents. == compares object references (identity),
      which can be false for equal-valued non-pooled strings. identityHashCode reflects
      identity, not content equality.
    ref: "concepts.md#string-immutability-and-the-string-pool"
  - id: immutability-strings-008
    difficulty: beginner
    tags: [records, accessor]
    question: |
      Given `record Point(int x, int y) {}`, what is the generated accessor for x called?
    options:
      - "getX()"
      - "x()"
      - "getx()"
      - "readX()"
    answer: 1
    explanation: |
      Record accessors are named after the component with no "get" prefix, so it is x().
      This differs from the JavaBeans getX() convention.
    ref: "concepts.md#records-as-immutable-carriers"
  - id: immutability-strings-009
    difficulty: beginner
    tags: [immutability, examples]
    question: |
      Which of these standard library types is mutable?
    options:
      - "java.util.Date"
      - "String"
      - "Integer"
      - "LocalDate"
    answer: 0
    explanation: |
      java.util.Date is mutable (e.g. setTime). String, the boxed primitives, and the
      java.time types (LocalDate, Instant, etc.) are immutable. This is exactly why Date
      requires defensive copying.
    ref: "concepts.md#building-immutable-classes"
  - id: immutability-strings-010
    difficulty: beginner
    tags: [text-blocks, version]
    question: |
      Text blocks (multi-line string literals using triple quotes) became a final feature in:
    options:
      - "JDK 11"
      - "JDK 13"
      - "JDK 17"
      - "JDK 15"
    answer: 3
    explanation: |
      Text blocks (JEP 378) were finalized in JDK 15 after previews in JDK 13 and 14. They
      produce ordinary immutable String objects — a source-level convenience only.
    ref: "concepts.md#concatenation-and-compact-strings"
  - id: immutability-strings-011
    difficulty: beginner
    tags: [immutability, hashmap]
    question: |
      Why are immutable objects good keys in a HashMap?
    options:
      - "They use less memory than mutable objects"
      - "They bypass the need to implement equals()"
      - "Their hashCode never changes, so they stay findable in the correct bucket"
      - "HashMap only accepts immutable keys"
    answer: 2
    explanation: |
      Because state never changes, hashCode stays constant, so the key remains in the
      right bucket and is retrievable. A mutable key mutated after insertion may become
      unreachable. HashMap does accept mutable keys (it just becomes dangerous).
    ref: "concepts.md#why-immutability"
  - id: immutability-strings-012
    difficulty: beginner
    tags: [defensive-copy, definition]
    question: |
      What is a "defensive copy"?
    options:
      - "A backup written to disk before mutation"
      - "A copy of a mutable object made when accepting or returning it, to protect internal invariants"
      - "A synchronized wrapper around a collection"
      - "A serialized clone stored in the string pool"
    answer: 1
    explanation: |
      A defensive copy is made when a class accepts a mutable argument (copy in) or returns
      internal mutable state (copy out), preventing callers from mutating the object's
      internals. It is unrelated to disk backups, synchronization, or serialization.
    ref: "concepts.md#defensive-copies"
  - id: immutability-strings-013
    difficulty: intermediate
    tags: [string-pool, new-string]
    question: |
      What does the following print?
      
      ```java
      String a = "x";
      String b = new String("x");
      System.out.println((a == b) + " " + (a == b.intern()) + " " + a.equals(b));
      ```
    options:
      - "false true true"
      - "true true true"
      - "false false true"
      - "false true false"
    answer: 0
    explanation: |
      a==b is false: new String creates a distinct heap object. b.intern() returns the
      pooled instance equal to the literal "x", so a==b.intern() is true. a.equals(b) is
      true because contents match. Hence "false true true".
    ref: "concepts.md#the-intern-method"
  - id: immutability-strings-014
    difficulty: intermediate
    tags: [concatenation, constant-folding]
    question: |
      What does this print?
      
      ```java
      String a = "hello";
      String b = "hel" + "lo";
      System.out.println(a == b);
      ```
    options:
      - "false"
      - "Compilation error"
      - "Runtime exception"
      - "true"
    answer: 3
    explanation: |
      "hel" + "lo" is a compile-time constant expression, folded by javac into the single
      literal "hello" and interned. It therefore refers to the same pooled object as a,
      so == is true.
    ref: "concepts.md#concatenation-and-compact-strings"
  - id: immutability-strings-015
    difficulty: intermediate
    tags: [concatenation, runtime]
    question: |
      What does this print?
      
      ```java
      String p = "hel";
      String a = "hello";
      String b = p + "lo";
      System.out.println(a == b);
      ```
    options:
      - "true"
      - "Compilation error"
      - "false"
      - "true only on JDK 9+"
    answer: 2
    explanation: |
      Because p is a non-constant variable, p + "lo" is evaluated at runtime and produces
      a new, non-pooled String. Thus a == b is false. (Had p been a compile-time constant
      `final String p = "hel"`, the result would be a constant and == would be true.)
    ref: "concepts.md#concatenation-and-compact-strings"
  - id: immutability-strings-016
    difficulty: intermediate
    tags: [concatenation, final-constant]
    question: |
      What does this print?
      
      ```java
      final String p = "hel";
      String a = "hello";
      String b = p + "lo";
      System.out.println(a == b);
      ```
    options:
      - "false"
      - "true"
      - "Compilation error"
      - "Depends on -XX:-CompactStrings"
    answer: 1
    explanation: |
      A `final` local initialized with a literal is a compile-time constant, so p + "lo"
      is itself a constant expression folded to "hello" and interned. Therefore a == b is
      true. Removing final makes it a runtime concat (false).
    ref: "concepts.md#concatenation-and-compact-strings"
  - id: immutability-strings-017
    difficulty: intermediate
    tags: [stringbuilder, performance]
    question: |
      A loop does `s += i;` on a String s for n iterations. What is the time complexity,
      and what is the fix?
    options:
      - "O(n^2); hoist a single StringBuilder out of the loop and append"
      - "O(n); no fix needed, the compiler already reuses one buffer"
      - "O(log n); switch to StringBuffer"
      - "O(n^2); switch to StringBuffer for thread-safety"
    answer: 0
    explanation: |
      Each += creates a new String (and, pre-Java-9, a fresh StringBuilder) copying all
      prior characters, giving O(n^2). The fix is one reused StringBuilder appended to in
      the loop, yielding O(n). StringBuffer adds lock overhead and does not fix the
      complexity if you still concatenate.
    ref: "concepts.md#string-vs-stringbuilder-vs-stringbuffer"
  - id: immutability-strings-018
    difficulty: intermediate
    tags: [compact-strings, version]
    question: |
      Compact Strings (JEP 254) changed String's internal storage. Which describes it,
      and in which Java version did it ship?
    options:
      - "String switched from byte[] to char[] in Java 8"
      - "String started compressing all content with gzip in Java 11"
      - "String began storing text off-heap in Java 9"
      - "String switched from a char[] to a byte[] plus a coder flag in Java 9"
    answer: 3
    explanation: |
      Since Java 9, String is backed by a byte[] with a coder flag: LATIN1 (1 byte/char)
      for Latin-1-only content, else UTF16 (2 bytes/char). This halves memory for the
      common ASCII/Latin-1 case. It is not gzip and not off-heap.
    ref: "concepts.md#concatenation-and-compact-strings"
  - id: immutability-strings-019
    difficulty: intermediate
    tags: [defensive-copy, building-immutable]
    question: |
      An immutable class stores `private final Date start;`. Which is required to keep it
      truly immutable?
    options:
      - "Nothing extra; final guarantees the Date cannot change"
      - "Mark the Date field volatile"
      - "Copy the Date in the constructor and return a copy from the getter"
      - "Override finalize() to reset the Date"
    answer: 2
    explanation: |
      final only fixes the reference, not the mutable Date object. Without copying in and
      out, callers can mutate the shared Date and break immutability. volatile and
      finalize do not address this.
    ref: "concepts.md#defensive-copies"
  - id: immutability-strings-020
    difficulty: intermediate
    tags: [records, immutability]
    question: |
      Which statement about records is TRUE?
    options:
      - "Records can extend another class to inherit fields"
      - "Records are implicitly final and cannot declare instance fields beyond their components"
      - "Record accessors follow the getX() naming convention"
      - "Records are deeply immutable regardless of component types"
    answer: 1
    explanation: |
      Records are implicitly final, extend java.lang.Record (so cannot extend another
      class), and forbid extra instance fields. Accessors are named like the component
      (x(), not getX()). They are only SHALLOWLY immutable — a mutable component (e.g. a
      List) can still be mutated unless defensively copied.
    ref: "concepts.md#records-as-immutable-carriers"
  - id: immutability-strings-021
    difficulty: intermediate
    tags: [stringbuffer, stringbuilder]
    question: |
      When is StringBuffer genuinely preferable to StringBuilder?
    options:
      - "In the rare case a single mutable buffer must be shared and mutated by multiple threads"
      - "Always, because thread-safety is free"
      - "In tight single-threaded loops, for speed"
      - "When you need the string to be interned automatically"
    answer: 0
    explanation: |
      StringBuffer's synchronized methods only help in the uncommon scenario of a mutable
      buffer shared across threads. For single-threaded building, StringBuilder is faster.
      Its lock overhead is not free, and neither type interns automatically.
    ref: "concepts.md#string-vs-stringbuilder-vs-stringbuffer"
  - id: immutability-strings-022
    difficulty: intermediate
    tags: [why-immutable, security]
    question: |
      Which is a security reason that String is immutable?
    options:
      - "It prevents strings from being printed to logs"
      - "It encrypts the string contents automatically"
      - "It hides the string from the garbage collector"
      - "It closes the time-of-check-to-time-of-use gap for validated values like file paths and hostnames"
    answer: 3
    explanation: |
      If a String could be mutated after a security check, an attacker could pass
      validation then change the value (TOCTOU). Immutability guarantees the checked value
      is the used value. It does not encrypt, hide from GC, or block logging.
    ref: "concepts.md#why-string-is-immutable"
  - id: immutability-strings-023
    difficulty: intermediate
    tags: [why-immutable, hashcode]
    question: |
      String caches its hashCode in a field. Why is that safe and beneficial?
    options:
      - "Because String synchronizes hashCode() on every call"
      - "Because the JVM recomputes it on every GC cycle"
      - "Because the contents never change, so the cached hash stays valid and repeated lookups are cheap"
      - "Because the hash is stored in the string pool, not the object"
    answer: 2
    explanation: |
      Immutability means the content — and thus the hash — never changes, so String
      computes it lazily once and caches it. This makes repeated HashMap lookups cheap.
      hashCode() is not synchronized and is not recomputed by GC.
    ref: "concepts.md#why-string-is-immutable"
  - id: immutability-strings-024
    difficulty: intermediate
    tags: [string-pool, version, permgen]
    question: |
      Where did the string pool live before Java 7, and what changed?
    options:
      - "In the heap; it moved to PermGen in Java 7"
      - "In PermGen; it moved to the main heap in Java 7"
      - "Off-heap; it moved to Metaspace in Java 8"
      - "In the stack; it moved to the heap in Java 6"
    answer: 1
    explanation: |
      The string pool lived in PermGen before Java 7 and moved to the main heap in Java 7
      (so interned strings can be GC'd and the pool can grow). PermGen itself was removed
      in Java 8 (replaced by Metaspace), but the string pool had already moved to the heap.
    ref: "concepts.md#string-immutability-and-the-string-pool"
  - id: immutability-strings-025
    difficulty: intermediate
    tags: [defensive-copy, collections]
    question: |
      Which produces an independent immutable snapshot rather than a live view of a list?
    options:
      - "List.copyOf(source)"
      - "Collections.unmodifiableList(backing)"
      - "Collections.synchronizedList(backing)"
      - "backing.subList(0, backing.size())"
    answer: 0
    explanation: |
      List.copyOf (Java 10) creates an independent unmodifiable snapshot. unmodifiableList
      wraps a LIVE backing list — changes to the backing show through. synchronizedList
      adds locking, not immutability. subList is a live view.
    ref: "concepts.md#defensive-copies"
  - id: immutability-strings-026
    difficulty: intermediate
    tags: [string, substring]
    question: |
      What does this print?
      
      ```java
      String s = "immutable";
      String t = s.substring(0, 2);
      System.out.println(s + " " + t);
      ```
    options:
      - "im immutable"
      - "immutable immutable"
      - "im im"
      - "immutable im"
    answer: 3
    explanation: |
      substring returns a new String "im" and leaves s unchanged. Printing s + " " + t
      yields "immutable im".
    ref: "concepts.md#string-immutability-and-the-string-pool"
  - id: immutability-strings-027
    difficulty: intermediate
    tags: [records, compact-constructor]
    question: |
      What does a record's "compact canonical constructor" let you do?
    options:
      - "Declare extra instance fields not listed as components"
      - "Make the record mutable"
      - "Validate arguments and normalize/defensively-copy components without re-listing the parameters"
      - "Skip generating equals and hashCode"
    answer: 2
    explanation: |
      The compact constructor (public Holder { ... }) runs validation/normalization before
      the implicit field assignments, ideal for defensive copies like xs = List.copyOf(xs).
      It cannot add fields, make the record mutable, or suppress equals/hashCode.
    ref: "concepts.md#records-as-immutable-carriers"
  - id: immutability-strings-028
    difficulty: intermediate
    tags: [immutability, final-class]
    question: |
      Why is making an immutable class `final` (or its constructor private) recommended?
    options:
      - "It makes the class load faster"
      - "It prevents a subclass from adding mutable state or overriding to break invariants"
      - "It is required for the class to be serializable"
      - "It enables the string pool for that class"
    answer: 1
    explanation: |
      A non-final class could be subclassed with mutable behavior or overridden methods
      that violate immutability, so making it final (or using a private constructor plus
      factory) protects invariants. It has nothing to do with load speed, serialization,
      or the string pool.
    ref: "concepts.md#building-immutable-classes"
  - id: immutability-strings-029
    difficulty: intermediate
    tags: [passwords, char-array]
    question: |
      Why is char[] recommended over String for holding passwords?
    options:
      - "A char[] can be explicitly zeroed (Arrays.fill) so the secret does not linger in memory, unlike an immutable pooled String"
      - "char[] is faster to hash"
      - "String cannot store non-ASCII characters"
      - "char[] is automatically encrypted by the JVM"
    answer: 0
    explanation: |
      A String is immutable and may sit in the pool/heap until GC, so you cannot wipe it.
      A char[] can be overwritten with Arrays.fill immediately after use, minimizing the
      window a secret is exposed. It is not about speed, encoding, or encryption.
    ref: "concepts.md#why-string-is-immutable"
  - id: immutability-strings-030
    difficulty: intermediate
    tags: [stringbuilder, capacity]
    question: |
      What is the benefit of `new StringBuilder(1024)` when you know the approximate final size?
    options:
      - "It makes the resulting String immutable sooner"
      - "It enables thread-safety"
      - "It interns the result automatically"
      - "It pre-allocates the backing array, avoiding repeated resize-and-copy operations"
    answer: 3
    explanation: |
      Pre-sizing the internal array avoids the cost of growing and copying it as content
      is appended. It does not change immutability of the final String, add thread-safety,
      or intern anything.
    ref: "concepts.md#string-vs-stringbuilder-vs-stringbuffer"
  - id: immutability-strings-031
    difficulty: advanced
    tags: [jmm, final-fields, safe-publication]
    question: |
      Under the Java Memory Model, what special guarantee do `final` fields provide?
    options:
      - "They are automatically volatile"
      - "They can never be null"
      - "Other threads are guaranteed to see their correctly-initialized values even if the object reference is published via a data race"
      - "They are stored in a thread-local cache"
    answer: 2
    explanation: |
      JLS 17.5 gives final fields a freeze at the end of the constructor: threads that
      obtain a reference (even through a race) see the correctly initialized final values.
      Non-final fields get no such guarantee. final is not the same as volatile, does not
      forbid null, and is not thread-local.
    ref: "concepts.md#why-immutability"
  - id: immutability-strings-032
    difficulty: advanced
    tags: [jep-280, invokedynamic, concatenation]
    question: |
      How did JEP 280 (Java 9) change how `javac` compiles the `+` string concatenation
      operator for runtime operands?
    options:
      - "It replaced + with explicit StringBuilder.append chains in bytecode"
      - "It emits an invokedynamic call bound to StringConcatFactory, letting the runtime pick the strategy"
      - "It made all + concatenations compile-time constants"
      - "It removed the + operator, requiring String.concat"
    answer: 1
    explanation: |
      Before Java 9, javac desugared + into new StringBuilder().append(...).toString().
      Since Java 9 (JEP 280), it emits invokedynamic wired to
      java.lang.invoke.StringConcatFactory, so the JDK chooses/optimizes the concatenation
      strategy at runtime without recompiling old code. The + operator still exists.
    ref: "concepts.md#concatenation-and-compact-strings"
  - id: immutability-strings-033
    difficulty: advanced
    tags: [jep-280, loop, misconception]
    question: |
      A candidate claims: "Since Java 9 uses invokedynamic for concatenation, `s += x`
      inside a loop is now O(n) and StringBuilder is no longer needed." Why is this WRONG?
    options:
      - "Each loop iteration is still a separate concatenation producing a new intermediate String, so the loop remains O(n^2)"
      - "JEP 280 only applies to char[] strings"
      - "invokedynamic is disabled inside loops"
      - "The claim is actually correct"
    answer: 0
    explanation: |
      JEP 280 optimizes each individual concatenation expression, but a loop still executes
      a fresh concat per iteration, copying the accumulated string each time — still O(n^2).
      An explicit StringBuilder hoisted out of the loop is still required for O(n).
    ref: "concepts.md#concatenation-and-compact-strings"
  - id: immutability-strings-034
    difficulty: advanced
    tags: [intern, string-table, tuning]
    question: |
      Which JVM flag tunes the capacity of the native string intern table, and what is the
      risk of interning millions of unique strings?
    options:
      - "-Xmx; the strings will be moved off-heap"
      - "-XX:+UseStringDeduplication; it disables the pool"
      - "-XX:MaxMetaspaceSize; it forces a full GC per intern"
      - "-XX:StringTableSize; long hash chains degrade lookup/intern performance"
    answer: 3
    explanation: |
      -XX:StringTableSize sets the bucket count of the intern table. Interning huge numbers
      of unique strings creates long chains and slows operations (and pre-Java-7 risked
      PermGen OOM). -Xmx sets heap size; UseStringDeduplication is a separate G1 feature
      that dedups backing arrays, not the pool.
    ref: "concepts.md#the-intern-method"
  - id: immutability-strings-035
    difficulty: advanced
    tags: [string-dedup, g1, version]
    question: |
      G1 String Deduplication (-XX:+UseStringDeduplication) differs from manual intern()
      because it:
    options:
      - "Changes == comparisons to return true for equal strings"
      - "Only works on strings created with new String()"
      - "Deduplicates the underlying byte[]/char[] backing arrays automatically without altering String identity or == semantics"
      - "Requires the ZGC collector"
    answer: 2
    explanation: |
      G1 String Deduplication (available with G1 since JDK 8u20) shares identical backing
      arrays among distinct String objects, saving memory transparently. It does NOT merge
      the String objects themselves, so == is unaffected. intern(), by contrast, merges the
      String objects so == can become true.
    ref: "concepts.md#the-intern-method"
  - id: immutability-strings-036
    difficulty: advanced
    tags: [defensive-copy, toctou]
    question: |
      Best practice for an immutable class is to copy a mutable argument BEFORE validating
      it (not after). Why?
    options:
      - "Validation is faster on a copy"
      - "To avoid a TOCTOU window where another thread mutates the original between the check and the copy"
      - "The copy resets the object's hashCode"
      - "Because validation requires an unmodifiable object"
    answer: 1
    explanation: |
      If you validate the caller's object then copy, another thread could mutate the
      original in that gap, so you'd copy an invalid (or attacker-controlled) value. Copying
      first, then validating the copy, closes that time-of-check-to-time-of-use window.
      This is Effective Java Item 50.
    ref: "concepts.md#defensive-copies"
  - id: immutability-strings-037
    difficulty: advanced
    tags: [compact-strings, coder, latin1]
    question: |
      With Compact Strings enabled (default since Java 9), a String containing only ASCII
      characters is stored as:
    options:
      - "A byte[] with LATIN1 coder, roughly 1 byte per character"
      - "A char[] with 2 bytes per character"
      - "A byte[] with UTF16 coder, 2 bytes per character"
      - "An off-heap direct buffer"
    answer: 0
    explanation: |
      ASCII fits within Latin-1, so the string is stored as byte[] with the LATIN1 coder
      (~1 byte/char), halving memory versus the old char[] representation. Content requiring
      more than Latin-1 falls back to UTF16 (2 bytes/char).
    ref: "concepts.md#concatenation-and-compact-strings"
  - id: immutability-strings-038
    difficulty: advanced
    tags: [records, sealed, version]
    question: |
      Records pair naturally with sealed classes to model closed hierarchies. In which JDK
      did SEALED CLASSES become final?
    options:
      - "JDK 15"
      - "JDK 16"
      - "JDK 21"
      - "JDK 17"
    answer: 3
    explanation: |
      Sealed classes were previewed in JDK 15 and 16 and finalized in JDK 17 (JEP 409).
      (Records finalized earlier in JDK 16; record patterns finalized in JDK 21.)
    ref: "concepts.md#records-as-immutable-carriers"
  - id: immutability-strings-039
    difficulty: advanced
    tags: [records, record-patterns, version]
    question: |
      Record patterns, which allow destructuring like
      `if (obj instanceof Point(int x, int y))`, became final in which JDK?
    options:
      - "JDK 16"
      - "JDK 17"
      - "JDK 21"
      - "JDK 19"
    answer: 2
    explanation: |
      Record patterns (JEP 440) were finalized in JDK 21, alongside pattern matching for
      switch. Records themselves finalized in JDK 16, but destructuring came later.
    ref: "concepts.md#records-as-immutable-carriers"
  - id: immutability-strings-040
    difficulty: advanced
    tags: [records, shallow-immutability, code]
    question: |
      What does this print?
      
      ```java
      record Holder(List<Integer> xs) {}
      var list = new ArrayList<>(List.of(1, 2));
      var h = new Holder(list);
      list.add(3);
      System.out.println(h.xs());
      ```
    options:
      - "[1, 2]"
      - "[1, 2, 3]"
      - "Compilation error"
      - "UnsupportedOperationException"
    answer: 1
    explanation: |
      This record does NOT defensively copy, so h.xs() holds the same ArrayList reference.
      Mutating list after construction shows through: [1, 2, 3]. A compact constructor doing
      xs = List.copyOf(xs) would have prevented this (and made mutation attempts throw).
    ref: "concepts.md#records-as-immutable-carriers"
  - id: immutability-strings-041
    difficulty: advanced
    tags: [string-pool, count, new-string]
    question: |
      How many String objects can the statement `String s = new String("abc");` create,
      and where?
    options:
      - "Up to two: the pooled literal 'abc' (if not already present) plus a new heap object"
      - "Exactly one, on the heap"
      - "Exactly one, in the pool"
      - "Three: pool, heap, and stack copies"
    answer: 0
    explanation: |
      The literal "abc" is placed in the pool (if not already interned) and new String()
      always allocates a distinct heap object copying that content — so up to two objects.
      If the literal was already interned, only the heap object is newly created. Strings
      are never stored on the stack.
    ref: "concepts.md#string-immutability-and-the-string-pool"
  - id: immutability-strings-042
    difficulty: advanced
    tags: [immutability, this-escape]
    question: |
      Which subtle mistake can break the safe-publication guarantee of an otherwise
      immutable, all-final-fields class?
    options:
      - "Declaring the class final"
      - "Providing a static factory method"
      - "Overriding toString()"
      - "Leaking `this` from the constructor (e.g. registering a listener) before final fields are assigned"
    answer: 3
    explanation: |
      If the constructor publishes `this` (e.g. to a listener registry or another thread)
      before the final-field freeze completes, other threads can observe partially
      constructed state, defeating the JMM guarantee. Declaring the class final, adding a
      factory, or overriding toString are all fine.
    ref: "concepts.md#building-immutable-classes"
  - id: immutability-strings-043
    difficulty: advanced
    tags: [intern, gc, heap]
    question: |
      Since the string pool moved to the heap (Java 7), which statement about interned
      strings is correct?
    options:
      - "Interned strings can never be garbage collected"
      - "Interning forces an immediate full GC"
      - "Interned strings can be garbage collected once no references (including the pool entry) keep them reachable"
      - "Interned strings are always moved to Metaspace"
    answer: 2
    explanation: |
      With the pool on the heap, interned strings are subject to normal GC and can be
      reclaimed once unreachable. Interning does not trigger a full GC, and interned
      strings are not placed in Metaspace (that holds class metadata).
    ref: "concepts.md#the-intern-method"
  - id: immutability-strings-044
    difficulty: advanced
    tags: [stringbuilder, code, equals]
    question: |
      What does this print?
      
      ```java
      StringBuilder a = new StringBuilder("hi");
      StringBuilder b = new StringBuilder("hi");
      System.out.println(a.equals(b) + " " + a.toString().equals(b.toString()));
      ```
    options:
      - "true true"
      - "false true"
      - "true false"
      - "false false"
    answer: 1
    explanation: |
      StringBuilder does NOT override equals(), so a.equals(b) uses Object identity and is
      false. Converting to String and comparing contents gives true. This is a classic trap:
      never rely on StringBuilder equality — call toString() first.
    ref: "concepts.md#string-vs-stringbuilder-vs-stringbuffer"
  - id: immutability-strings-045
    difficulty: advanced
    tags: [compact-strings, flag]
    question: |
      Which flag disables Compact Strings, forcing the pre-Java-9 UTF-16 char storage
      behavior?
    options:
      - "-XX:-CompactStrings"
      - "-XX:+CompactStrings"
      - "-XX:-UseCompressedOops"
      - "-Dstring.compact=false"
    answer: 0
    explanation: |
      Compact Strings is enabled by default; -XX:-CompactStrings turns it off so all strings
      use two bytes per character. -XX:+CompactStrings would enable (the default).
      UseCompressedOops is about object pointers, unrelated to string storage.
    ref: "concepts.md#concatenation-and-compact-strings"
  - id: immutability-strings-046
    difficulty: advanced
    tags: [defensive-copy, unmodifiable, live-view]
    question: |
      What does this print?
      
      ```java
      List<Integer> backing = new ArrayList<>(List.of(1, 2));
      List<Integer> view = Collections.unmodifiableList(backing);
      backing.add(3);
      System.out.println(view);
      ```
    options:
      - "[1, 2]"
      - "UnsupportedOperationException"
      - "ConcurrentModificationException"
      - "[1, 2, 3]"
    answer: 3
    explanation: |
      unmodifiableList returns a read-only VIEW over the live backing list, not a snapshot.
      Modifying backing directly is allowed and shows through the view: [1, 2, 3]. Only
      calling add on `view` itself would throw UnsupportedOperationException. Use
      List.copyOf for an independent snapshot.
    ref: "concepts.md#defensive-copies"
  - id: immutability-strings-047
    difficulty: expert
    tags: [string-pool, intern, pre-pooled]
    question: |
      What does this print?
      
      ```java
      String lit = "java";                    // interns "java" into the pool
      String s = new StringBuilder("ja").append("va").toString();
      System.out.println(s == lit);
      System.out.println(s.intern() == lit);
      ```
    options:
      - "false then false"
      - "true then true"
      - "false then true"
      - "true then false"
    answer: 2
    explanation: |
      s is a runtime-built, non-pooled string, so s == lit is false. The literal "java" is
      already in the pool (via lit), so s.intern() returns that pre-existing pooled instance,
      which IS lit — hence s.intern() == lit is true. The intern() "self-insertion" trick only
      returns s itself when no equal literal has been pooled yet.
    ref: "concepts.md#the-intern-method"
  - id: immutability-strings-048
    difficulty: expert
    tags: [string-pool, intern-trick]
    question: |
      On Java 7+, what does this print, assuming the literal "javalang" appears NOWHERE
      else in the program?
      
      ```java
      String s = new StringBuilder("java").append("lang").toString();
      System.out.println(s.intern() == s);
      ```
    options:
      - "false"
      - "true"
      - "Compilation error"
      - "NullPointerException"
    answer: 1
    explanation: |
      Because no equal literal has been interned yet, s.intern() adds s ITSELF to the pool
      and returns it, so s.intern() == s is true on Java 7+ (where the pool holds references,
      not copies). This famous trick fails only if an equal literal was already pooled.
    ref: "concepts.md#the-intern-method"
  - id: immutability-strings-049
    difficulty: expert
    tags: [reflection, immutability-break]
    question: |
      Can reflection mutate the internal byte[] of a String, and what does that imply?
    options:
      - "Yes; String's value array can be reached via reflection (setAccessible), which can corrupt pooled strings and violate the JMM final-field guarantee — a reason immutability is a contract, not an unbreakable law"
      - "No; String has no fields"
      - "Yes, and it is a fully supported, recommended technique"
      - "No; the JIT prevents any field access"
    answer: 0
    explanation: |
      With deep reflection (and access not blocked by strong encapsulation/module rules),
      the private value array can be reached and mutated, corrupting shared/pooled strings
      and breaking the safe-publication guarantee for final fields. It is unsupported and
      dangerous; immutability is a language/API contract that reflection can subvert.
    ref: "concepts.md#why-string-is-immutable"
  - id: immutability-strings-050
    difficulty: expert
    tags: [records, canonical-constructor, validation]
    question: |
      What does this code do at construction of `new Range(5, 1)`?
      
      ```java
      record Range(int lo, int hi) {
          Range {
              if (lo > hi) throw new IllegalArgumentException("lo>hi");
          }
      }
      ```
    options:
      - "Silently swaps lo and hi"
      - "Compiles but the check is ignored"
      - "Fails to compile because records cannot have constructors"
      - "Throws IllegalArgumentException before the fields are assigned"
    answer: 3
    explanation: |
      The compact canonical constructor runs its body (the validation) before the implicit
      field assignments; new Range(5, 1) triggers lo>hi and throws
      IllegalArgumentException. Records certainly can declare constructors, and the check is
      not ignored.
    ref: "concepts.md#records-as-immutable-carriers"
  - id: immutability-strings-051
    difficulty: expert
    tags: [immutability, escape-analysis, performance]
    question: |
      A reviewer worries that returning new defensive-copy objects from getters will thrash
      the GC. Which JVM optimization can mitigate short-lived defensive copies that never
      escape?
    options:
      - "String interning"
      - "Compressed oops"
      - "Escape analysis leading to scalar replacement / stack allocation of non-escaping objects"
      - "Biased locking"
    answer: 2
    explanation: |
      The JIT's escape analysis can prove a defensive copy does not escape a method and
      apply scalar replacement, effectively allocating on the stack and avoiding heap
      garbage. Interning is for strings, compressed oops shrink pointers, and biased locking
      concerns monitors — none address defensive-copy allocation.
    ref: "concepts.md#defensive-copies"
  - id: immutability-strings-052
    difficulty: expert
    tags: [concatenation, bytecode, version]
    question: |
      You decompile a class compiled with a Java 8 `javac` and see explicit
      `StringBuilder.append` chains for `a + b`. You recompile the same source with a Java 17
      `javac`. What is most likely in the new bytecode for `a + b`?
    options:
      - "The same explicit StringBuilder chains"
      - "An invokedynamic instruction referencing StringConcatFactory"
      - "A call to String.format"
      - "A constant-folded literal regardless of operand types"
    answer: 1
    explanation: |
      Since Java 9 (JEP 280), javac compiles runtime concatenation to invokedynamic bound to
      StringConcatFactory rather than explicit StringBuilder chains. It is not String.format,
      and non-constant operands cannot be constant-folded.
    ref: "concepts.md#concatenation-and-compact-strings"
  - id: immutability-strings-053
    difficulty: expert
    tags: [records, equals, floating-point]
    question: |
      A record's generated equals/hashCode for a `double` component uses which semantics?
    options:
      - "Double.compare / Double.hashCode semantics, so components are compared by their bit representation (e.g. treating NaN as equal to NaN and -0.0 as distinct from 0.0)"
      - "The == operator on the raw doubles"
      - "String comparison of Double.toString"
      - "Reference identity of boxed Double objects"
    answer: 0
    explanation: |
      Record-generated equals/hashCode use the appropriate primitive semantics: for double
      that means Double.compare/Double.hashCode behavior, where NaN equals NaN and +0.0 and
      -0.0 are distinct — differing from the == operator. It is not string or reference
      comparison.
    ref: "concepts.md#records-as-immutable-carriers"
  - id: immutability-strings-054
    difficulty: expert
    tags: [immutability, wrapper-cache, code]
    question: |
      What does this print, and why?
      
      ```java
      Integer a = 127, b = 127;
      Integer c = 128, d = 128;
      System.out.println((a == b) + " " + (c == d));
      ```
    options:
      - "true true"
      - "false false"
      - "false true"
      - "true false"
    answer: 3
    explanation: |
      Integer is immutable and autoboxing uses Integer.valueOf, which caches values in
      [-128, 127] by default. 127 is cached (a == b true); 128 is outside the cache so two
      distinct objects are created (c == d false). This relies on the immutability that makes
      caching safe.
    ref: "concepts.md#why-immutability"
  - id: immutability-strings-055
    difficulty: expert
    tags: [stringbuffer, sync, atomicity]
    question: |
      Why does StringBuffer's per-method synchronization NOT guarantee correctness for a
      compound operation like "append X only if length < N" from multiple threads?
    options:
      - "Because StringBuffer methods are not actually synchronized"
      - "Because synchronization is disabled under contention"
      - "Because each method call is individually atomic, but the check-then-act sequence spanning two calls is not, creating a race between the length read and the append"
      - "Because StringBuffer delegates to StringBuilder internally"
    answer: 2
    explanation: |
      Synchronizing each method makes single calls atomic, but a read of length() followed by
      a conditional append() is two separate atomic operations; another thread can append in
      between, breaking the invariant. Correct compound behavior needs external
      synchronization over the whole sequence. StringBuffer methods are indeed synchronized.
    ref: "concepts.md#string-vs-stringbuilder-vs-stringbuffer"
  - id: immutability-strings-056
    difficulty: expert
    tags: [substring, memory, version]
    question: |
      Before Java 7u6, String.substring shared the parent's backing char[] via an offset.
      What problem did this cause, and what changed?
    options:
      - "It caused StackOverflowError; substring became recursive"
      - "A small substring could retain the entire large parent array (memory leak); since Java 7u6 substring copies into a new right-sized array"
      - "It made substrings mutable; they were made immutable in Java 8"
      - "It broke interning; interning was removed"
    answer: 1
    explanation: |
      The old shared-array offset/count implementation meant a tiny substring kept the whole
      original array alive — a subtle memory leak. Since Java 7u6, substring copies the needed
      characters into a new array, trading a copy for predictable memory. Substrings were
      always immutable; interning was not removed.
    ref: "concepts.md#string-immutability-and-the-string-pool"
  - id: immutability-strings-057
    difficulty: expert
    tags: [records, serialization]
    question: |
      Which statement about record serialization is correct?
    options:
      - "Serializable records are serialized/deserialized based solely on their components, and deserialization always invokes the canonical constructor (so its validation runs)"
      - "Records cannot be serialized"
      - "Records bypass the canonical constructor on deserialization, like ordinary classes bypass constructors"
      - "Records require a custom readObject to be deserializable"
    answer: 0
    explanation: |
      Record serialization is component-based and, crucially, deserialization goes through
      the canonical constructor — so invariants enforced there are re-checked, closing the
      classic deserialization-bypasses-constructor hole that plagues ordinary Serializable
      classes. No custom readObject is required.
    ref: "concepts.md#records-as-immutable-carriers"
  - id: immutability-strings-058
    difficulty: expert
    tags: [concatenation, "null", code]
    question: |
      What does this print?
      
      ```java
      String x = null;
      String y = "val=" + x;
      System.out.println(y);
      ```
    options:
      - "val="
      - "It throws NullPointerException"
      - "val=nil"
      - "val=null"
    answer: 3
    explanation: |
      String concatenation converts a null reference to the literal string "null" (via the
      concatenation machinery / String.valueOf), so y is "val=null". It does not throw NPE and
      does not produce an empty or "nil" value.
    ref: "concepts.md#concatenation-and-compact-strings"
