topic: "Java 8 Date and Time API (java.time)"
domain: java-jvm
topic_slug: java8-date-time-api
version: 1
questions:
- id: java8-date-time-api-001
  difficulty: beginner
  tags: [history, java8, jsr-310]
  question: |
    In which Java release was the java.time package (JSR-310) introduced?
  options:
  - "Java 8"
  - "Java 7"
  - "Java 11"
  - "Java 17"
  answer: 0
  explanation: |
    java.time was introduced in Java 8 (2014) as JSR-310, delivered under JEP 150 and largely
    designed by Stephen Colebourne (author of Joda-Time). Java 7 predates it; Java 11 and 17 are
    later LTS releases that inherited the API essentially unchanged (only minor method additions).
  ref: "concepts.md#why-the-legacy-date-and-calendar-classes-were-broken"

- id: java8-date-time-api-002
  difficulty: beginner
  tags: [legacy, calendar, months]
  question: |
    Using the legacy API, what date does `new GregorianCalendar(2014, 1, 1)` represent?
  options:
  - "January 1, 2014"
  - "February 1, 2014"
  - "January 2, 2014"
  - "It throws an exception for an invalid month"
  answer: 1
  explanation: |
    Calendar months are 0-based (0 = January ... 11 = December), so month value 1 is February.
    This 0-based month convention is one of the classic sources of off-by-one bugs the java.time
    API fixed by making months 1-based (or using the Month enum). It does not throw.
  ref: "concepts.md#why-the-legacy-date-and-calendar-classes-were-broken"

- id: java8-date-time-api-003
  difficulty: beginner
  tags: [localdate, factory, months]
  question: |
    What date does `LocalDate.of(2014, 1, 1)` represent in java.time?
  options:
  - "February 1, 2014, because months are 0-based"
  - "It fails to compile"
  - "January 1, 2014, because months are 1-based"
  - "January 1, 1914, due to a 1900 year offset"
  answer: 2
  explanation: |
    Unlike Calendar, java.time months are 1-based, so month value 1 is January. There is no
    1900-year offset (that was a java.util.Date deprecated-constructor trap). You may also write
    LocalDate.of(2014, Month.JANUARY, 1) for clarity.
  ref: "concepts.md#localdate-localtime-and-localdatetime"

- id: java8-date-time-api-004
  difficulty: beginner
  tags: [thread-safety, formatter, simpledateformat]
  question: |
    Which statement about DateTimeFormatter versus SimpleDateFormat is correct?
  options:
  - "Both are mutable and must never be shared across threads"
  - "SimpleDateFormat is thread-safe; DateTimeFormatter is not"
  - "Neither can be used as a static final field"
  - "DateTimeFormatter is immutable and thread-safe; SimpleDateFormat is mutable and not thread-safe"
  answer: 3
  explanation: |
    DateTimeFormatter is immutable and thread-safe, so a single instance can be a shared static
    final constant. SimpleDateFormat keeps mutable internal Calendar state and is not thread-safe;
    sharing it across threads corrupts output or throws. The legacy workaround was
    ThreadLocal<SimpleDateFormat>.
  ref: "concepts.md#datetimeformatter-thread-safe-unlike-simpledateformat"

- id: java8-date-time-api-005
  difficulty: beginner
  tags: [immutability, localdate]
  question: |
    What is the value of `d` after this code runs?

    ```java
    LocalDate d = LocalDate.of(2026, 1, 1);
    d.plusDays(10);
    ```
  options:
  - "2026-01-01"
  - "2026-01-11"
  - "It throws because the result was not used"
  - "It does not compile"
  answer: 0
  explanation: |
    java.time types are immutable. plusDays returns a NEW LocalDate; the receiver d is never
    mutated. Because the returned value is discarded, d is still 2026-01-01. The correct usage is
    `d = d.plusDays(10);`. This mirrors the same trap with String.
  ref: "concepts.md#immutability-of-the-api"

- id: java8-date-time-api-006
  difficulty: beginner
  tags: [instant, machine-time, utc]
  question: |
    An `Instant` represents which of the following?
  options:
  - "A date without a time, in the system default zone"
  - "A point on the global timeline, counted from the 1970 UTC epoch"
  - "A wall-clock time with an attached region zone"
  - "An amount of time such as 2 hours 30 minutes"
  answer: 1
  explanation: |
    Instant is machine time: a single point on the UTC timeline stored as seconds + nanoseconds
    since 1970-01-01T00:00:00Z. It has no human calendar fields on its own. A zoneless date is
    LocalDate; a wall time with a region is ZonedDateTime; an amount of time is Duration/Period.
  ref: "concepts.md#instant-vs-localdatetime-machine-time-vs-human-time"

- id: java8-date-time-api-007
  difficulty: beginner
  tags: [duration, period, basics]
  question: |
    Which pair correctly matches the class to what it measures?
  options:
  - "Duration measures years/months/days; Period measures seconds/nanos"
  - "Both measure only whole days"
  - "Duration measures time-based amounts (seconds/nanos); Period measures date-based amounts (years/months/days)"
  - "Period is for Instant; Duration is for LocalDate"
  answer: 2
  explanation: |
    Duration is time-based (seconds and nanoseconds), used with Instant/LocalTime/LocalDateTime.
    Period is date-based (years, months, days), used with LocalDate. Swapping them is a common bug,
    especially across DST boundaries.
  ref: "concepts.md#duration-vs-period"

- id: java8-date-time-api-008
  difficulty: beginner
  tags: [zoneddatetime, zoneid, dst]
  question: |
    Which class should you use to represent a specific moment in a specific region while correctly
    accounting for Daylight Saving Time transitions?
  options:
  - "LocalDateTime"
  - "Instant"
  - "Duration"
  - "ZonedDateTime"
  answer: 3
  explanation: |
    ZonedDateTime = LocalDateTime + ZoneId + resolved offset, and it applies the region's DST rules
    and historical offset changes. LocalDateTime has no zone; Instant is UTC machine time without
    human fields; Duration is an amount of time.
  ref: "concepts.md#zoneddatetime-and-zoneid"

- id: java8-date-time-api-009
  difficulty: beginner
  tags: [parsing, iso-8601, localdate]
  question: |
    By default, `LocalDate.parse("2026-07-16")` expects the input in which format?
  options:
  - "ISO-8601 (yyyy-MM-dd)"
  - "US locale MM/dd/yyyy"
  - "Whatever the system default locale specifies"
  - "Epoch milliseconds as a string"
  answer: 0
  explanation: |
    The single-argument parse methods use ISO-8601 by default (yyyy-MM-dd for LocalDate). To parse
    any other layout you must supply a DateTimeFormatter. Malformed input throws
    DateTimeParseException.
  ref: "concepts.md#localdate-localtime-and-localdatetime"

- id: java8-date-time-api-010
  difficulty: beginner
  tags: [comparison, equals]
  question: |
    What is the recommended way to check whether one LocalDate comes before another?
  options:
  - "Use the == operator"
  - "Use isBefore(other)"
  - "Compare their toString() lengths"
  - "Cast both to long and subtract"
  answer: 1
  explanation: |
    Use isBefore/isAfter/isEqual/compareTo. These are value-based classes, so == compares identity
    and must not be relied upon. There is no meaningful long representation to subtract for a
    LocalDate.
  ref: "concepts.md#localdate-localtime-and-localdatetime"

- id: java8-date-time-api-011
  difficulty: beginner
  tags: [conversion, legacy, date, instant]
  question: |
    Which method converts a legacy `java.util.Date` into an `Instant`?
  options:
  - "Date.toLocalDate()"
  - "Instant.parse(date)"
  - "date.toInstant()"
  - "date.getInstant()"
  answer: 2
  explanation: |
    Java 8 added java.util.Date.toInstant() to bridge to java.time, and Date.from(Instant) for the
    reverse. Both Date and Instant are UTC-based instants, so no zone is needed. There is no
    toLocalDate() on Date and no Instant.parse(Date) overload.
  ref: "concepts.md#converting-legacy-date-to-and-from-instant"

- id: java8-date-time-api-012
  difficulty: beginner
  tags: [temporal-adjuster, basics]
  question: |
    What is the purpose of a TemporalAdjuster such as `TemporalAdjusters.lastDayOfMonth()`?
  options:
  - "To format a date into a String"
  - "To measure the amount of time between two dates"
  - "To convert between time zones"
  - "To encapsulate reusable date-manipulation logic applied via with(...)"
  answer: 3
  explanation: |
    A TemporalAdjuster encapsulates a date transformation (last day of month, next Monday, etc.)
    and is applied with temporal.with(adjuster). Formatting is DateTimeFormatter's job; amounts are
    Duration/Period; zone conversion is withZoneSameInstant.
  ref: "concepts.md#temporal-adjusters"

- id: java8-date-time-api-013
  difficulty: intermediate
  tags: [instant, localdatetime, conversion, zone]
  question: |
    Why does the API require you to supply a ZoneId when converting a LocalDateTime to an Instant?
  options:
  - "Because a LocalDateTime is zoneless and maps to different instants in different zones"
  - "Because ZoneId is needed only for formatting, not conversion"
  - "Because Instant internally stores a ZoneId"
  - "It does not require a zone; LocalDateTime.toInstant() takes no arguments"
  answer: 0
  explanation: |
    A LocalDateTime describes wall-clock date/time with no zone, so a given value is a different
    point on the global timeline depending on the zone. To pin it to a unique Instant you must
    supply the zone (e.g. ldt.atZone(zone).toInstant()). Instant itself is always UTC and stores no
    ZoneId.
  ref: "concepts.md#instant-vs-localdatetime-machine-time-vs-human-time"

- id: java8-date-time-api-014
  difficulty: intermediate
  tags: [zoneid, zoneoffset, dst]
  question: |
    What is the key difference between a ZoneId like "America/New_York" and a ZoneOffset like "-05:00"?
  options:
  - "There is no difference; they are aliases"
  - "The region ZoneId carries full DST/historical rules; a ZoneOffset is a single fixed offset with no rules"
  - "ZoneOffset carries DST rules; ZoneId does not"
  - "ZoneId is only valid in the UTC zone"
  answer: 1
  explanation: |
    A region ZoneId (e.g. America/New_York) knows the full history of offset changes and DST
    transitions via its ZoneRules, so its actual offset varies through the year. A ZoneOffset is a
    fixed offset from UTC with no DST awareness (though it is technically a subclass of ZoneId).
  ref: "concepts.md#zoneddatetime-and-zoneid"

- id: java8-date-time-api-015
  difficulty: intermediate
  tags: [zoneddatetime, withzone, instant]
  question: |
    Given `zdt` at 10:15 in Europe/Paris (summer, +02:00), what does
    `zdt.withZoneSameInstant(ZoneId.of("Asia/Tokyo"))` produce?
  options:
  - "10:15 in Tokyo, a different instant than the Paris time"
  - "10:15 in Tokyo, the same instant as the Paris time"
  - "17:15 in Tokyo, the same instant as the Paris time"
  - "It throws because the zones are incompatible"
  answer: 2
  explanation: |
    withZoneSameInstant keeps the same point on the global timeline and recomputes the local wall
    time for the new zone. Tokyo is +09:00, so 10:15 +02:00 becomes 17:15 +09:00. withZoneSameLocal
    would instead keep 10:15 as the wall time and change the instant.
  ref: "concepts.md#zoneddatetime-and-zoneid"

- id: java8-date-time-api-016
  difficulty: intermediate
  tags: [period, fields, totals]
  question: |
    For `Period p = Period.between(LocalDate.of(2020,1,1), LocalDate.of(2021,3,5))`, what does
    `p.getMonths()` return?
  options:
  - "14"
  - "15"
  - "426"
  - "2"
  answer: 3
  explanation: |
    The period is P1Y2M4D. getMonths() returns only the MONTHS component (2), not the total months.
    For the normalized total use p.toTotalMonths() (14). Confusing the component accessor with a
    total is a classic Period gotcha.
  ref: "concepts.md#duration-vs-period"

- id: java8-date-time-api-017
  difficulty: intermediate
  tags: [chronounit, between, days]
  question: |
    What is the cleanest way to compute the total number of days between two LocalDate values as a
    single long?
  options:
  - "ChronoUnit.DAYS.between(d1, d2)"
  - "Period.between(d1, d2).getDays()"
  - "d2.toEpochDay() - d1.getDayOfYear()"
  - "Duration.between(d1, d2).toDays()"
  answer: 0
  explanation: |
    ChronoUnit.DAYS.between(d1, d2) returns the total whole days as a long. Period.between gives a
    broken-down Y/M/D amount whose getDays() is only the day component. Duration.between does not
    accept LocalDate (it is date-based, not time-based) and would throw.
  ref: "concepts.md#duration-vs-period"

- id: java8-date-time-api-018
  difficulty: intermediate
  tags: [instant, chronounit, unsupported]
  question: |
    What happens when you evaluate `Instant.now().plus(1, ChronoUnit.MONTHS)`?
  options:
  - "It adds roughly 30 days"
  - "It throws UnsupportedTemporalTypeException"
  - "It adds exactly one calendar month"
  - "It returns the same Instant unchanged"
  answer: 1
  explanation: |
    Instant supports only time-based units (nanos up to days as 24h). Months and years have no
    fixed length without a calendar/zone, so adding ChronoUnit.MONTHS throws
    UnsupportedTemporalTypeException. Convert to a ZonedDateTime/LocalDate first for month math.
  ref: "concepts.md#instant-vs-localdatetime-machine-time-vs-human-time"

- id: java8-date-time-api-019
  difficulty: intermediate
  tags: [formatter, pattern-letters, year]
  question: |
    In a DateTimeFormatter pattern, what does the letter `Y` (uppercase) mean, and why is it a common bug?
  options:
  - "Year-of-era; identical to lowercase y in all cases"
  - "Two-digit year; it truncates to the last two digits"
  - "Week-based year; it can differ from the calendar year around January 1"
  - "Day-of-year; it ranges 1 to 366"
  answer: 2
  explanation: |
    Uppercase Y is the week-based year (from WeekFields), which near the New Year can differ from
    the calendar year y. Writing YYYY where you meant yyyy produces the wrong year for dates in late
    December / early January. Day-of-year is D.
  ref: "concepts.md#datetimeformatter-thread-safe-unlike-simpledateformat"

- id: java8-date-time-api-020
  difficulty: intermediate
  tags: [formatter, pattern-letters, month-minute]
  question: |
    In a format pattern, which statement about `M` and `m` is correct?
  options:
  - "M is minute-of-hour, m is month-of-year"
  - "Both mean month; case is ignored"
  - "M is milliseconds, m is minutes"
  - "M is month-of-year, m is minute-of-hour"
  answer: 3
  explanation: |
    Uppercase M is month-of-year; lowercase m is minute-of-hour. Case is significant. Writing mm
    where MM was intended (or vice versa) is a frequent bug. Milliseconds/fraction use S, and nanos
    use n.
  ref: "concepts.md#datetimeformatter-thread-safe-unlike-simpledateformat"

- id: java8-date-time-api-021
  difficulty: intermediate
  tags: [localdate, strict, exception]
  question: |
    What does `LocalDate.of(2026, 2, 30)` do?
  options:
  - "Throws DateTimeException because February 30 is invalid"
  - "Rolls over to March 2, 2026, like lenient Calendar"
  - "Returns February 28, 2026 by clamping"
  - "Compiles but returns null"
  answer: 0
  explanation: |
    java.time is strict by default and rejects impossible dates with DateTimeException. This differs
    from Calendar's lenient mode, which would silently roll February 30 into early March. There is
    no clamping and it never returns null.
  ref: "concepts.md#localdate-localtime-and-localdatetime"

- id: java8-date-time-api-022
  difficulty: intermediate
  tags: [offsetdatetime, storage, zone]
  question: |
    Where does OffsetDateTime sit relative to LocalDateTime and ZonedDateTime?
  options:
  - "It is identical to ZonedDateTime with a region ID"
  - "It is a date-time with a fixed offset but no zone rules (no DST), often used for storage"
  - "It is a date-only type like LocalDate"
  - "It is an amount of time like Duration"
  answer: 1
  explanation: |
    OffsetDateTime = LocalDateTime + fixed ZoneOffset. It is unambiguous on the timeline but carries
    no DST/region rules, which makes it simpler and a common choice for database columns and wire
    formats. ZonedDateTime additionally carries a region ZoneId with full rules.
  ref: "concepts.md#zoneddatetime-and-zoneid"

- id: java8-date-time-api-023
  difficulty: intermediate
  tags: [conversion, sql-date, precision]
  question: |
    Which statement about converting `java.util.Date` to `Instant` and back is TRUE?
  options:
  - "The conversion needs a ZoneId in both directions"
  - "Instant has only millisecond precision, so no data can ever be lost"
  - "java.util.Date only has millisecond precision, so nanoseconds on the Instant are lost when calling Date.from(instant)"
  - "Date.from(instant) throws for any non-UTC instant"
  answer: 2
  explanation: |
    Both are UTC-based instants, so no zone is needed. However, java.util.Date stores only
    milliseconds while Instant supports nanoseconds, so the sub-millisecond part is truncated in
    Date.from(instant). Instant is NOT limited to milliseconds.
  ref: "concepts.md#converting-legacy-date-to-and-from-instant"

- id: java8-date-time-api-024
  difficulty: intermediate
  tags: [temporal-adjuster, next, nextOrSame]
  question: |
    Given `d` is a Thursday, what is the difference between `d.with(next(THURSDAY))` and
    `d.with(nextOrSame(THURSDAY))`?
  options:
  - "Both return d unchanged"
  - "next returns d itself; nextOrSame returns the following Thursday"
  - "Both throw because d already matches"
  - "next returns the following Thursday (7 days later); nextOrSame returns d itself"
  answer: 3
  explanation: |
    next(DAY) always moves strictly forward to the next occurrence, so from a Thursday it returns
    the Thursday one week later. nextOrSame(DAY) returns the same date if it already matches, so it
    returns d unchanged. Neither throws.
  ref: "concepts.md#temporal-adjusters"

- id: java8-date-time-api-025
  difficulty: intermediate
  tags: [now, clock, default-zone]
  question: |
    What does `LocalDate.now()` (no arguments) use to determine the date?
  options:
  - "The system clock together with the system default time zone"
  - "Always UTC"
  - "The epoch date 1970-01-01"
  - "A random zone chosen at startup"
  answer: 0
  explanation: |
    The no-arg now() uses the system clock in the default time zone. Because the default zone
    matters, near midnight two machines in different zones can report different dates. For UTC use
    now(ZoneOffset.UTC) or an explicit Clock. It never uses the epoch or a random zone.
  ref: "concepts.md#localdate-localtime-and-localdatetime"

- id: java8-date-time-api-026
  difficulty: intermediate
  tags: [immutability, value-based, equality]
  question: |
    java.time value types are documented as "value-based." Which practice does that discourage?
  options:
  - "Using them as keys in a HashMap"
  - "Synchronizing on them or relying on identity (==)"
  - "Comparing them with equals()"
  - "Sharing a single instance across threads"
  answer: 1
  explanation: |
    Value-based classes should not be used with identity-sensitive operations: do not synchronize on
    them and do not rely on == or identity hash. equals()/hashCode() (state-based), HashMap keys, and
    cross-thread sharing are all perfectly fine and encouraged because instances are immutable.
  ref: "concepts.md#immutability-of-the-api"

- id: java8-date-time-api-027
  difficulty: intermediate
  tags: [duration, tostring, iso-8601]
  question: |
    What is the toString() output of `Duration.ofHours(2).plusMinutes(30)`?
  options:
  - "2:30:00"
  - "P0Y0M0DT2H30M"
  - "PT2H30M"
  - "150M"
  answer: 2
  explanation: |
    Duration uses the ISO-8601 duration format prefixed with PT (a time-based amount): PT2H30M.
    Period would use the P...D form. There is no colon-separated clock form, and it does not collapse
    to plain minutes.
  ref: "concepts.md#duration-vs-period"

- id: java8-date-time-api-028
  difficulty: intermediate
  tags: [legacy, mutability, thread-safety]
  question: |
    Which was NOT one of the design flaws of java.util.Date / Calendar that java.time addressed?
  options:
  - "Mutability leading to accidental shared-state corruption"
  - "0-based months causing off-by-one errors"
  - "No dedicated type for a date without a time"
  - "Immutable value objects that were hard to modify"
  answer: 3
  explanation: |
    The legacy classes were mutable, not immutable, which is precisely what caused shared-state
    corruption and thread-safety issues. The other options (0-based months, no dedicated
    date-without-time type) are genuine legacy flaws. Immutability is a feature of java.time, not a
    flaw of the old API.
  ref: "concepts.md#why-the-legacy-date-and-calendar-classes-were-broken"

- id: java8-date-time-api-029
  difficulty: intermediate
  tags: [formatter, static-final, best-practice]
  question: |
    Which is the recommended way to declare a reusable DateTimeFormatter shared by many threads?
  options:
  - "A single private static final DateTimeFormatter constant"
  - "A new instance per method call to avoid stale state"
  - "A ThreadLocal<DateTimeFormatter>"
  - "It cannot be shared; each thread must build its own"
  answer: 0
  explanation: |
    DateTimeFormatter is immutable and thread-safe, so the idiomatic pattern is one private static
    final constant shared by all threads. The ThreadLocal dance was necessary only for the mutable,
    unsafe SimpleDateFormat. Creating one per call is wasteful and unnecessary.
  ref: "concepts.md#datetimeformatter-thread-safe-unlike-simpledateformat"

- id: java8-date-time-api-030
  difficulty: advanced
  tags: [duration, period, dst]
  question: |
    In a zone with spring-forward DST, `zdt` is at 2026-03-08T00:00. What is the difference between
    `zdt.plus(Duration.ofDays(1))` and `zdt.plus(Period.ofDays(1))` on that 23-hour day?
  options:
  - "Both yield 2026-03-09T00:00"
  - "Duration.ofDays(1) yields 2026-03-09T01:00 (24 exact hours); Period.ofDays(1) yields 2026-03-09T00:00 (same wall time)"
  - "Period.ofDays(1) yields 2026-03-09T01:00; Duration.ofDays(1) yields 2026-03-09T00:00"
  - "Both throw a DateTimeException on the DST boundary"
  answer: 1
  explanation: |
    Duration adds exact elapsed time: 24 hours across a 23-hour calendar day lands at 01:00 the next
    day. Period adds a calendar day, preserving the wall-clock time (00:00). This divergence on DST
    transition days is a top interview gotcha. Neither throws.
  ref: "concepts.md#duration-vs-period"

- id: java8-date-time-api-031
  difficulty: advanced
  tags: [zoneddatetime, dst-gap, resolution]
  question: |
    You build a ZonedDateTime at a local time that falls in a spring-forward DST gap (a time that
    never occurred, e.g. 02:30). How does ZonedDateTime resolve it?
  options:
  - "It throws DateTimeException because the time does not exist"
  - "It silently rolls back to 01:30"
  - "It pushes the time forward by the length of the gap (e.g. to 03:30)"
  - "It returns null"
  answer: 2
  explanation: |
    For a gap, ZonedDateTime moves the local time forward by the gap length (typically one hour), so
    02:30 becomes 03:30 with the post-transition offset. It does not throw or return null. For an
    overlap (fall-back), the earlier offset is chosen by default.
  ref: "concepts.md#zoneddatetime-and-zoneid"

- id: java8-date-time-api-032
  difficulty: advanced
  tags: [zoneddatetime, dst-overlap, offset]
  question: |
    During a fall-back DST overlap, a local time such as 01:30 occurs twice. What does ZonedDateTime
    choose by default, and how can you select the other occurrence?
  options:
  - "The later offset by default; use withEarlierOffsetAtOverlap() for the earlier one"
  - "It throws; there is no way to disambiguate"
  - "It averages the two offsets"
  - "The earlier offset by default; use withLaterOffsetAtOverlap() for the later one"
  answer: 3
  explanation: |
    By default the earlier offset (before the clocks fall back) is chosen. You can switch to the
    second occurrence with withLaterOffsetAtOverlap() (and force the first with
    withEarlierOffsetAtOverlap()). It does not throw and offsets are never averaged.
  ref: "concepts.md#zoneddatetime-and-zoneid"

- id: java8-date-time-api-033
  difficulty: advanced
  tags: [localdate, plusmonths, end-of-month]
  question: |
    What is the result of `LocalDate.of(2020, 1, 31).plusMonths(1)`?
  options:
  - "2020-02-29, clamped to the last valid day of February"
  - "2020-03-02, rolling the extra days into March"
  - "It throws DateTimeException because February 31 is invalid"
  - "2020-02-28, always using 28 for February"
  answer: 0
  explanation: |
    Month arithmetic in java.time adjusts the day-of-month down to the last valid day of the target
    month rather than rolling over. Jan 31 + 1 month lands on Feb 29 in the leap year 2020 (Feb 28 in
    a non-leap year). It does not throw or roll into March.
  ref: "concepts.md#duration-vs-period"

- id: java8-date-time-api-034
  difficulty: advanced
  tags: [instant, tostring, offset]
  question: |
    What does `Instant.now().toString()` always end with, regardless of the system's time zone?
  options:
  - "The local UTC offset, e.g. +05:30"
  - "Z, because Instant is rendered in UTC"
  - "The zone region name in brackets, e.g. [Asia/Kolkata]"
  - "Nothing; Instant has no toString()"
  answer: 1
  explanation: |
    Instant is always UTC and its ISO-8601 rendering ends in Z (Zulu = UTC), e.g.
    2026-07-16T08:15:30Z. It never prints a local offset or a zone-region suffix; those belong to
    OffsetDateTime and ZonedDateTime respectively.
  ref: "concepts.md#instant-vs-localdatetime-machine-time-vs-human-time"

- id: java8-date-time-api-035
  difficulty: advanced
  tags: [conversion, sql-date, exception]
  question: |
    Why can calling `.toInstant()` on a `java.sql.Date` be problematic?
  options:
  - "It silently returns the epoch instant"
  - "It requires a ZoneId argument that java.sql.Date lacks"
  - "java.sql.Date has no time-of-day component, so toInstant() throws UnsupportedOperationException"
  - "There is no problem; it always works"
  answer: 2
  explanation: |
    java.sql.Date represents a date only (its time fields are zeroed/undefined), so it overrides
    toInstant() to throw UnsupportedOperationException. Use toLocalDate() instead. java.sql.Timestamp,
    which does carry time, supports toInstant().
  ref: "concepts.md#converting-legacy-date-to-and-from-instant"

- id: java8-date-time-api-036
  difficulty: advanced
  tags: [temporal-adjuster, custom, lambda]
  question: |
    Which correctly implements a custom "next working day" TemporalAdjuster (Sat/Sun skip to Monday)?
  options:
  - |
    ```java
    TemporalAdjuster adj = t -> t.minus(1, ChronoUnit.DAYS);
    ```
  - |
    ```java
    TemporalAdjuster adj = t -> LocalDate.now();
    ```
  - |
    ```java
    TemporalAdjuster adj = t -> t.plus(1, ChronoUnit.MONTHS);
    ```
  - |
    ```java
    TemporalAdjuster adj = t -> {
        DayOfWeek d = LocalDate.from(t).getDayOfWeek();
        int add = d == DayOfWeek.FRIDAY ? 3 : d == DayOfWeek.SATURDAY ? 2 : 1;
        return t.plus(add, ChronoUnit.DAYS);
    };
    ```
  answer: 3
  explanation: |
    TemporalAdjuster is a functional interface (Temporal adjustInto(Temporal)). The first lambda
    inspects the day of week and adds 3 days from Friday, 2 from Saturday, otherwise 1, correctly
    skipping the weekend. The others subtract a day, ignore the input, or add a month, none of which
    is "next working day."
  ref: "concepts.md#temporal-adjusters"

- id: java8-date-time-api-037
  difficulty: advanced
  tags: [truncatedTo, precision]
  question: |
    What is the idiomatic way to zero out the sub-second (nanosecond) part of a LocalDateTime?
  options:
  - "ldt.truncatedTo(ChronoUnit.SECONDS)"
  - "ldt.withNano(0).withSecond(0).withMinute(0)"
  - "ldt.minusNanos(ldt.getNano())"
  - "There is no way; you must reconstruct the object field by field"
  answer: 0
  explanation: |
    truncatedTo(ChronoUnit.SECONDS) returns a copy with all fields smaller than a second set to
    zero, cleanly dropping nanoseconds. Option A also zeroes minutes/seconds (too much), and
    minusNanos works but is clumsier and less clear. Reconstruction is unnecessary.
  ref: "concepts.md#common-pitfalls"

- id: java8-date-time-api-038
  difficulty: advanced
  tags: [zone-future-event, offset-vs-region]
  question: |
    For a recurring meeting scheduled far in the future in New York, should you store a fixed
    ZoneOffset (e.g. -05:00) or a region ZoneId (America/New_York), and why?
  options:
  - "A fixed offset, because it is simpler and never changes"
  - "A region ZoneId, so DST and any future legislative offset changes are applied correctly"
  - "It does not matter; both give identical wall-clock times all year"
  - "Store an Instant, since instants track DST automatically"
  answer: 1
  explanation: |
    Store the region ZoneId so DST transitions (and any future government rule changes) are honored
    when the instant is recomputed; a fixed offset would drift by an hour across DST and ignore rule
    changes. An Instant fixes a single point and cannot represent a recurring local wall time.
  ref: "concepts.md#zoneddatetime-and-zoneid"

- id: java8-date-time-api-039
  difficulty: advanced
  tags: [formatter, missing-field, exception]
  question: |
    What happens if you format a plain `LocalDate` using a formatter built from the pattern
    "yyyy-MM-dd HH:mm:ss"?
  options:
  - "It fills the time with 00:00:00"
  - "It silently drops the time portion of the pattern"
  - "It throws a DateTimeException / UnsupportedTemporalTypeException because the date lacks time fields"
  - "It uses the current wall-clock time for the time portion"
  answer: 2
  explanation: |
    A LocalDate has no hour/minute/second fields, so a formatter that requires HH:mm:ss cannot obtain
    them and throws (UnsupportedTemporalTypeon the missing field, surfaced as a DateTimeException).
    It does not invent 00:00:00 or the current time. Convert to LocalDateTime first if you need a
    time portion.
  ref: "concepts.md#datetimeformatter-thread-safe-unlike-simpledateformat"

- id: java8-date-time-api-040
  difficulty: advanced
  tags: [period, normalized, days]
  question: |
    Why does `Period.ofMonths(14).normalized()` return P1Y2M rather than converting anything into days?
  options:
  - "Because normalized() converts everything into a total number of days"
  - "Because 14 months always equals exactly 420 days"
  - "Because normalized() is a no-op and returns P14M"
  - "Because normalized() only splits months into years/months; days are left untouched since month lengths vary"
  answer: 3
  explanation: |
    normalized() only regroups years and months (12 months = 1 year), giving P1Y2M. It never touches
    the days field because months have variable length (28-31 days), so months cannot be losslessly
    converted to days. It is not a no-op for 14 months.
  ref: "concepts.md#duration-vs-period"

- id: java8-date-time-api-041
  difficulty: advanced
  tags: [withZoneSameLocal, instant-change]
  question: |
    `zdt` is 2026-07-16T10:15 in Europe/Paris. What does
    `zdt.withZoneSameLocal(ZoneId.of("Asia/Tokyo"))` produce?
  options:
  - "10:15 in Tokyo, representing a DIFFERENT instant than the original"
  - "17:15 in Tokyo, representing the SAME instant"
  - "10:15 in Paris, unchanged"
  - "It throws DateTimeException"
  answer: 0
  explanation: |
    withZoneSameLocal keeps the wall-clock fields (10:15) but reinterprets them in the new zone,
    which changes the underlying instant. withZoneSameInstant is the opposite: it keeps the instant
    and changes the wall time (to 17:15 Tokyo). It does not throw.
  ref: "concepts.md#zoneddatetime-and-zoneid"

- id: java8-date-time-api-042
  difficulty: advanced
  tags: [chronounit, between, partial]
  question: |
    What does `ChronoUnit.DAYS.between(LocalDate.of(2026,1,1), LocalDate.of(2026,1,10))` return, and
    what type is it?
  options:
  - "The Period P9D"
  - "The long value 9"
  - "The long value 10 (inclusive of both endpoints)"
  - "It throws because LocalDate is not a Temporal"
  answer: 1
  explanation: |
    ChronoUnit.between returns a long count of complete units and is exclusive of the end in the
    sense of counting elapsed units: Jan 1 to Jan 10 is 9 days. It returns a primitive long, not a
    Period, and LocalDate does implement Temporal.
  ref: "concepts.md#duration-vs-period"

- id: java8-date-time-api-043
  difficulty: advanced
  tags: [instant, epoch, ofEpochSecond]
  question: |
    What does `Instant.ofEpochSecond(60, 1_000_000_000)` represent?
  options:
  - "60 seconds after the epoch, with an invalid nanosecond that throws"
  - "60 seconds and 1 billion nanoseconds stored literally without normalization"
  - "61 seconds after the epoch (the 1,000,000,000 nanos carry into 1 extra second)"
  - "The epoch itself, ignoring both arguments"
  answer: 2
  explanation: |
    ofEpochSecond(seconds, nanoAdjustment) normalizes the nanosecond adjustment into the seconds
    field. 1,000,000,000 nanos = 1 second, so the result is 61 seconds after the epoch with zero
    leftover nanos. The nano adjustment may even be negative and is normalized accordingly.
  ref: "concepts.md#instant-vs-localdatetime-machine-time-vs-human-time"

- id: java8-date-time-api-044
  difficulty: advanced
  tags: [legacy, timezone, zoneid, conversion]
  question: |
    Which conversion between the legacy TimeZone and the new API is correct?
  options:
  - "TimeZone tz = ZoneId.systemDefault().toTimeZone();"
  - "ZoneId zone = new ZoneId(TimeZone.getDefault());"
  - "ZoneId zone = ZoneId.parse(TimeZone.getDefault());"
  - "ZoneId zone = TimeZone.getDefault().toZoneId();"
  answer: 3
  explanation: |
    Java 8 added TimeZone.toZoneId() to bridge to the new API, and TimeZone.getTimeZone(ZoneId) for
    the reverse. ZoneId has no public constructor and no toTimeZone() method, and ZoneId.parse does
    not exist (it is ZoneId.of).
  ref: "concepts.md#converting-legacy-date-to-and-from-instant"

- id: java8-date-time-api-045
  difficulty: advanced
  tags: [duration, java9, part-methods]
  question: |
    The component-extraction methods `Duration.toHoursPart()`, `toMinutesPart()`, and `toSecondsPart()`
    were added in which release?
  options:
  - "Java 9"
  - "Java 8, alongside the original Duration class"
  - "Java 11"
  - "Java 17"
  answer: 0
  explanation: |
    The toXxxPart() methods (toDaysPart, toHoursPart, toMinutesPart, toSecondsPart, toMillisPart,
    toNanosPart) were added in Java 9 to conveniently extract individual components. Java 8 shipped
    Duration with only whole-unit accessors like toHours() and getSeconds().
  ref: "concepts.md#duration-vs-period"

- id: java8-date-time-api-046
  difficulty: advanced
  tags: [year, month, enums]
  question: |
    What does `Month.JANUARY.plus(2)` return?
  options:
  - "FEBRUARY"
  - "MARCH"
  - "It throws because Month is a plain enum without arithmetic"
  - "The integer 3"
  answer: 1
  explanation: |
    Month is a java.time enum that supports cyclic arithmetic: JANUARY.plus(2) wraps forward two
    months to MARCH (and DECEMBER.plus(1) wraps to JANUARY). It returns a Month, not an int, and does
    not throw.
  ref: "concepts.md#localdate-localtime-and-localdatetime"

- id: java8-date-time-api-047
  difficulty: expert
  tags: [formatter, resolverstyle, lenient-strict]
  question: |
    By default, `DateTimeFormatter.ofPattern("yyyy-MM-dd")` uses which ResolverStyle, and what does
    that imply for parsing "2026-02-30"?
  options:
  - "ResolverStyle.LENIENT, so it rolls over to 2026-03-02"
  - "ResolverStyle.STRICT, which silently returns February 28"
  - "ResolverStyle.SMART, which rejects the impossible February 30 and throws DateTimeParseException"
  - "There is no resolver style; parsing always succeeds"
  answer: 2
  explanation: |
    ofPattern defaults to ResolverStyle.SMART, which validates that the date is possible; February 30
    is invalid, so parsing throws DateTimeParseException. LENIENT (which you can opt into with
    withResolverStyle) would roll over; STRICT is even more rigorous about ranges but does not
    silently clamp to Feb 28.
  ref: "concepts.md#datetimeformatter-thread-safe-unlike-simpledateformat"

- id: java8-date-time-api-048
  difficulty: expert
  tags: [formatter, year-of-era, u-vs-y]
  question: |
    You must format dates that may fall before year 1 (proleptic, i.e. BCE). Which pattern letter
    should you use for the year, and why?
  options:
  - "y (year-of-era), because it handles negative years directly"
  - "Y (week-based year), because it spans eras"
  - "It is impossible to format pre-year-1 dates with DateTimeFormatter"
  - "u (proleptic year), because y is year-of-era and requires an era (G) to disambiguate BCE"
  answer: 3
  explanation: |
    Lowercase y is year-of-era (always positive) and needs an era field G to express BCE. Lowercase u
    is the signed proleptic year, so u naturally represents 0 and negative years for BCE dates. Y is
    the week-based year and is unrelated. Pre-year-1 dates are formattable using u.
  ref: "concepts.md#datetimeformatter-thread-safe-unlike-simpledateformat"

- id: java8-date-time-api-049
  difficulty: expert
  tags: [instant, comparison, ordering]
  question: |
    Two log events are recorded on servers in different time zones. Which type stored per event lets
    you order them correctly on the global timeline without any zone conversion at compare time?
  options:
  - "Instant, because it is a zone-independent point on the UTC timeline"
  - "LocalDateTime, since it captures the exact wall-clock time"
  - "LocalDate, since dates are globally unique"
  - "A formatted String in each server's local pattern"
  answer: 0
  explanation: |
    Instant is a zone-agnostic UTC point, so comparing two Instants directly gives correct global
    ordering. LocalDateTime/LocalDate are zoneless and ambiguous across servers, and comparing
    locale-formatted strings is both zone-dependent and lexically unreliable.
  ref: "concepts.md#instant-vs-localdatetime-machine-time-vs-human-time"

- id: java8-date-time-api-050
  difficulty: expert
  tags: [zonerules, tzdb, updates]
  question: |
    Where do the DST and offset rules used by ZoneId come from, and how can they change without a JDK
    upgrade?
  options:
  - "Hard-coded in the ZoneId class; they never change without a new JDK"
  - "From the IANA tz database bundled with the JDK, updatable via the TZUpdater tool or a newer tzdata"
  - "From the operating system registry only, ignored by the JVM"
  - "Downloaded live from the internet on every ZoneId.of call"
  answer: 1
  explanation: |
    ZoneRules are backed by the IANA time-zone database shipped with the JDK. Because governments
    change DST/offset rules, Oracle/OpenJDK ship tzdata updates and provide the TZUpdater tool so the
    rules can be refreshed without a full JDK upgrade. The rules are not hard-coded, OS-only, or
    fetched live per call.
  ref: "concepts.md#zoneddatetime-and-zoneid"

- id: java8-date-time-api-051
  difficulty: expert
  tags: [period, between, sign, direction]
  question: |
    What does `Period.between(LocalDate.of(2026, 3, 1), LocalDate.of(2026, 1, 1))` return?
  options:
  - "P2M (the magnitude, always positive)"
  - "It throws IllegalArgumentException for a reversed range"
  - "P-2M (a negative period, because the end is before the start)"
  - "P0D, because Period cannot be negative"
  answer: 2
  explanation: |
    Period.between computes end minus start and CAN be negative when the end precedes the start:
    here it is P-2M. It does not take an absolute value or throw. (ChronoUnit.between similarly returns
    a negative long for a reversed range.)
  ref: "concepts.md#duration-vs-period"

- id: java8-date-time-api-052
  difficulty: expert
  tags: [clock, testability, dependency-injection]
  question: |
    Which java.time abstraction lets you make now()-based code deterministic and testable by
    injecting a fixed or offset time source?
  options:
  - "ZoneId"
  - "TemporalAdjuster"
  - "DateTimeFormatter"
  - "Clock, e.g. Clock.fixed(instant, zone) passed into now(clock)"
  answer: 3
  explanation: |
    Clock abstracts the current instant and zone. Methods like Instant.now(clock),
    LocalDate.now(clock), etc. accept a Clock, and Clock.fixed / Clock.offset / Clock.tick let tests
    pin or shift time deterministically. ZoneId, TemporalAdjuster, and DateTimeFormatter do not
    control the current time.
  ref: "concepts.md#instant-vs-localdatetime-machine-time-vs-human-time"

- id: java8-date-time-api-053
  difficulty: expert
  tags: [chronology, non-iso, calendars]
  question: |
    The ISO-based LocalDate uses the ISO proleptic Gregorian calendar. Which package/type supports
    alternative calendar systems such as Japanese, Thai Buddhist, or Hijrah?
  options:
  - "java.time.chrono with the Chronology interface and types like JapaneseDate, HijrahDate"
  - "java.time.zone with ZoneRules"
  - "java.time.format with DateTimeFormatterBuilder"
  - "java.time.temporal with ChronoUnit"
  answer: 0
  explanation: |
    The java.time.chrono package provides the Chronology abstraction and non-ISO calendar
    implementations: JapaneseDate, ThaiBuddhistDate, HijrahDate, MinguoDate, plus ChronoLocalDate.
    java.time.zone handles zone rules, java.time.format handles parsing/printing, and
    java.time.temporal handles fields/units.
  ref: "concepts.md#localdate-localtime-and-localdatetime"

- id: java8-date-time-api-054
  difficulty: expert
  tags: [instant, overflow, exception]
  question: |
    What happens when you evaluate `Instant.MAX.plusSeconds(1)`?
  options:
  - "It wraps around to Instant.MIN"
  - "It throws DateTimeException (arithmetic overflow beyond the supported range)"
  - "It saturates and returns Instant.MAX unchanged"
  - "It returns null"
  answer: 1
  explanation: |
    Instant has a bounded supported range; exceeding it (as adding to Instant.MAX does) throws a
    DateTimeException (backed by arithmetic overflow detection). java.time does not silently wrap,
    saturate, or return null on overflow.
  ref: "concepts.md#common-pitfalls"

- id: java8-date-time-api-055
  difficulty: expert
  tags: [formatter, optional-sections, builder]
  question: |
    Which java.time.format tool lets you build a formatter with optional sections, default field
    values, and case-insensitive parsing (beyond what a simple pattern string allows)?
  options:
  - "DateTimeFormatter.ofPattern with a single pattern only"
  - "SimpleDateFormat.applyPattern"
  - "DateTimeFormatterBuilder, with methods like optionalStart()/optionalEnd(), parseDefaulting(), and parseCaseInsensitive()"
  - "ChronoUnit.parse"
  answer: 2
  explanation: |
    DateTimeFormatterBuilder (Java 8) provides fine-grained construction: optionalStart/optionalEnd
    for optional sections, parseDefaulting to supply defaults for missing fields, parseCaseInsensitive,
    appendLiteral, and more. A plain ofPattern string cannot express all of these. SimpleDateFormat
    is legacy; ChronoUnit.parse does not exist.
  ref: "concepts.md#datetimeformatter-thread-safe-unlike-simpledateformat"

- id: java8-date-time-api-056
  difficulty: expert
  tags: [temporal-adjuster, adjustInto, contract]
  question: |
    TemporalAdjuster is a functional interface. What is the signature of its single abstract method?
  options:
  - "long between(Temporal a, Temporal b)"
  - "String format(TemporalAccessor t)"
  - "boolean isSupported(TemporalField f)"
  - "Temporal adjustInto(Temporal temporal)"
  answer: 3
  explanation: |
    TemporalAdjuster declares Temporal adjustInto(Temporal temporal). When you call
    temporal.with(adjuster), it delegates to adjuster.adjustInto(this). The between signature belongs
    to TemporalUnit, format to formatters, and isSupported to TemporalAccessor.
  ref: "concepts.md#temporal-adjusters"

- id: java8-date-time-api-057
  difficulty: intermediate
  tags: [localtime, range, edge]
  question: |
    What is the maximum value representable by LocalTime?
  options:
  - "23:59:59.999999999"
  - "24:00:00"
  - "23:59:59.999 (millisecond precision only)"
  - "23:59:60 (allowing a leap second)"
  answer: 0
  explanation: |
    LocalTime ranges from 00:00 to 23:59:59.999999999 (nanosecond precision). There is no 24:00 value,
    java.time supports nanoseconds (not just millis), and it does not model leap seconds (no 23:59:60).
  ref: "concepts.md#localdate-localtime-and-localdatetime"

- id: java8-date-time-api-058
  difficulty: intermediate
  tags: [conversion, gregoriancalendar, zoneddatetime]
  question: |
    Which method converts a `GregorianCalendar` to a `ZonedDateTime`?
  options:
  - "ZonedDateTime.of(gregorianCalendar)"
  - "gregorianCalendar.toZonedDateTime()"
  - "gregorianCalendar.toInstant().toZonedDateTime()"
  - "ZonedDateTime.from(gregorianCalendar)"
  answer: 1
  explanation: |
    Java 8 added GregorianCalendar.toZonedDateTime() (and the reverse GregorianCalendar.from(ZonedDateTime)).
    There is no ZonedDateTime.of(GregorianCalendar) overload, Instant has no toZonedDateTime() no-arg
    method, and ZonedDateTime.from expects a TemporalAccessor, which GregorianCalendar is not.
  ref: "concepts.md#converting-legacy-date-to-and-from-instant"

- id: java8-date-time-api-059
  difficulty: intermediate
  tags: [period, duration, tostring, output]
  question: |
    Given `Period.of(1, 2, 3)`, what does its toString() produce?
  options:
  - "PT1H2M3S"
  - "1 year, 2 months, 3 days"
  - "P1Y2M3D"
  - "P1Y2M3DT0H0M0S"
  answer: 2
  explanation: |
    Period uses the ISO-8601 period form P1Y2M3D (years, months, days). The PT... form is Duration
    (time-based). Period never appends a time (T) section, and it does not produce a human-readable
    English string.
  ref: "concepts.md#duration-vs-period"

- id: java8-date-time-api-060
  difficulty: advanced
  tags: [localdate, datesUntil, java9, stream]
  question: |
    The method `LocalDate.datesUntil(endExclusive)` that returns a Stream<LocalDate> was added in
    which release?
  options:
  - "Java 8"
  - "Java 14"
  - "Java 21"
  - "Java 9"
  answer: 3
  explanation: |
    LocalDate.datesUntil (both the daily and stepped overloads) was added in Java 9, enabling
    stream-based iteration over a date range. Java 8 shipped the core LocalDate but without this
    stream helper.
  ref: "concepts.md#localdate-localtime-and-localdatetime"

- id: java8-date-time-api-061
  difficulty: beginner
  tags: [instant, epoch, definition]
  question: |
    The Unix epoch that Instant counts from is which moment?
  options:
  - "1970-01-01T00:00:00Z (UTC)"
  - "1900-01-01T00:00:00 in the local zone"
  - "2000-01-01T00:00:00Z (UTC)"
  - "The JVM start time"
  answer: 0
  explanation: |
    Instant is measured as seconds/nanoseconds from the Unix epoch, 1970-01-01T00:00:00Z (UTC). The
    1900 reference was a java.util.Date year-offset quirk, not the epoch; 2000 and JVM start time are
    unrelated.
  ref: "concepts.md#instant-vs-localdatetime-machine-time-vs-human-time"

- id: java8-date-time-api-062
  difficulty: advanced
  tags: [formatter, parse, offset, zoned]
  question: |
    To parse the string "2026-07-16T10:15:30+02:00[Europe/Paris]" back into a ZonedDateTime with its
    region, which is true?
  options:
  - "LocalDateTime.parse handles it because the pattern is ISO"
  - "ZonedDateTime.parse handles it; the [Europe/Paris] region suffix is part of ISO_ZONED_DATE_TIME"
  - "It is unparseable; the bracketed region is not standard"
  - "Instant.parse handles it and keeps the region"
  answer: 1
  explanation: |
    ZonedDateTime.parse (default ISO_ZONED_DATE_TIME) understands the offset plus the bracketed IANA
    region suffix and reconstructs the full ZonedDateTime. LocalDateTime.parse would reject the
    offset/zone, and Instant.parse expects a UTC instant (Z) and does not retain a region.
  ref: "concepts.md#zoneddatetime-and-zoneid"

- id: java8-date-time-api-063
  difficulty: expert
  tags: [duration, negative, abs, sign]
  question: |
    `Duration.between(later, earlier)` where later is after earlier produces what, and how do you get
    the magnitude?
  options:
  - "Always a positive Duration; sign is discarded"
  - "It throws because arguments are out of order"
  - "A negative Duration; call .abs() to get the magnitude"
  - "Zero, because Duration cannot be negative"
  answer: 2
  explanation: |
    Duration.between(start, end) computes end minus start, so passing them reversed yields a negative
    Duration (isNegative() is true). Use abs() for the magnitude or negated() to flip the sign.
    Duration can indeed be negative and does not throw on reversed inputs.
  ref: "concepts.md#duration-vs-period"

- id: java8-date-time-api-064
  difficulty: intermediate
  tags: [instant, localdate, no-fields]
  question: |
    Why can you not call `getMonth()` directly on an Instant?
  options:
  - "Because Instant is mutable and month access is disabled for safety"
  - "Because getMonth() exists only on Duration"
  - "You can; Instant.getMonth() returns the UTC month"
  - "Because an Instant has no human calendar fields without a zone; convert via atZone(...) first"
  answer: 3
  explanation: |
    An Instant is just a UTC point in time and has no year/month/day fields until interpreted in some
    zone. To read a month you must convert, e.g. instant.atZone(zone).getMonth(). Instant is immutable
    (not the reason), and getMonth is not a Duration method.
  ref: "concepts.md#instant-vs-localdatetime-machine-time-vs-human-time"

- id: java8-date-time-api-065
  difficulty: advanced
  tags: [zoneid, of, Z, utc]
  question: |
    What does `ZoneId.of("Z")` resolve to?
  options:
  - "ZoneOffset.UTC (a fixed +00:00 offset), since Z is the UTC designator"
  - "A region zone for Zulu military time with DST rules"
  - "It throws ZoneRulesException because Z is not a valid region"
  - "The system default zone"
  answer: 0
  explanation: |
    "Z" is the ISO designator for UTC, and ZoneId.of("Z") returns ZoneOffset.UTC, a fixed zero offset
    with no DST. It is not a region with rules, does not throw, and is not the system default. Note
    that a fixed offset differs behaviorally from a region like Etc/UTC only in metadata.
  ref: "concepts.md#zoneddatetime-and-zoneid"
