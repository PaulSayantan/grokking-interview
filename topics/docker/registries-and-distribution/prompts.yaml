topic: "Registries, Tagging & Distribution"
domain: docker
topic_slug: registries-and-distribution
schema: 1
pass: clarity-v1

prompts:
  - id: registries-and-distribution-p001
    ref: "concepts.md#image-reference-anatomy"
    kind: predict-failure
    tier: A
    prompt: |
      You meant a private host but typed `docker push acme/app` — no registry, no dot.
      Which server receives the push, and what single character would have redirected it?
    hint: "Recall the one test Docker uses to decide what counts as a registry host."
    answer_in: "concepts.md#image-reference-anatomy"

  - id: registries-and-distribution-p002
    ref: "concepts.md#tags-are-mutable-pointers"
    kind: predict-failure
    tier: A
    prompt: |
      Two servers run different code from the same `myorg/api:1.4`, and nobody edited the
      checked-in Compose file. Name the single action that made their bytes diverge.
    hint: "A tag is a pointer; what moves it?"
    answer_in: "concepts.md#tags-are-mutable-pointers"

  - id: registries-and-distribution-p003
    ref: "concepts.md#the-immutable-digest"
    kind: name-the-price
    tier: A
    prompt: |
      Pinning `repo@sha256:…` guarantees identical bytes forever. Name what that costs you,
      and the routine event where paying it turns into real work.
    hint: "If the bytes can never change, what stops arriving on its own?"
    answer_in: "concepts.md#the-immutable-digest"

  - id: registries-and-distribution-p004
    ref: "concepts.md#the-latest-tag-foot-gun"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you read a Dockerfile, check every `FROM` line: does it omit the tag or use
      `latest`, and what actually pins that base if anything does?
    answer_in: "concepts.md#the-latest-tag-foot-gun"

  - id: registries-and-distribution-p005
    ref: "concepts.md#authentication-login-tokens-credential-helpers"
    kind: predict-failure
    tier: A
    prompt: |
      Your `~/.docker/config.json` is world-readable on a shared build box. What can another
      user there recover from it, and why does the file's encoding not protect you?
    hint: "What form is the stored credential in by default?"
    answer_in: "concepts.md#authentication-login-tokens-credential-helpers"

  - id: registries-and-distribution-p006
    ref: "concepts.md#what-travels-layers-blobs-and-dedup"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you `docker push` a rebuilt image, count how many layers report
      `Layer already exists` versus upload, and note which layer you actually changed.
    answer_in: "concepts.md#what-travels-layers-blobs-and-dedup"

  - id: registries-and-distribution-p007
    ref: "concepts.md#image-manifest-and-config"
    kind: notice-in-wild
    tier: A
    prompt: |
      For any local image, compare its ID in `docker images` with its `RepoDigest` from
      `docker inspect`. Note that they differ, and which file each one hashes.
    answer_in: "concepts.md#image-manifest-and-config"

  - id: registries-and-distribution-p008
    ref: "concepts.md#multi-arch-images-and-manifest-lists"
    kind: draw-the-boundary
    tier: A
    prompt: |
      The same `myapp:1.0` runs on an amd64 runner and an arm64 server with no change to your
      command. What did each daemon select, and what must the publisher have pushed?
    hint: "One tag, two binaries — what sits between them?"
    answer_in: "concepts.md#multi-arch-images-and-manifest-lists"

  - id: registries-and-distribution-p009
    ref: "concepts.md#pull-rate-limits"
    kind: draw-the-boundary
    tier: C
    prompt: |
      Confirm today's Docker Hub pull limits: the anonymous cap, the authenticated-free cap,
      and the window they are measured over. Have they moved from this file's snapshot?
    search_hint: "docs.docker.com/docker-hub/usage/ and its /pulls/ page; Docker revises these, so read the date on the page rather than trusting a blog."
    success_criterion: |
      You can state the current anonymous cap, the current authenticated-free cap, and the
      measurement window, and say for each whether it still matches this file's 100 / 200 /
      6-hour mid-2026 snapshot or has since changed.
    answer_in: external

  - id: registries-and-distribution-p010
    ref: "concepts.md#garbage-collection-and-cleanup"
    kind: predict-failure
    tier: A
    prompt: |
      You delete 50 stale tags from your self-hosted registry to reclaim disk, but usage does
      not drop. What did untagging actually change, and what step still owes you the space?
    hint: "A tag is a pointer; deleting it removes what, exactly?"
    answer_in: "concepts.md#garbage-collection-and-cleanup"

cliffhanger:
  hook: |
    You can now put exactly the right bytes on every host: pinned by digest, promoted between
    registries, verified byte for byte. So you ship the new image and watch the graph. For
    about two seconds during the rollout, a fraction of real user requests come back
    `502 Bad Gateway`. Those errors come from the image you just proved correct. Nothing in this topic touches
    that window, because distribution ends the moment the bytes reach a host. A deploy does
    something distribution never does: it replaces containers that are already running and
    serving live traffic. That swap is not free, and the bill arrives as those 502s. The next
    topic works out where they come from, and what a running container must do in its last
    seconds to stop emitting them.
  teaser_questions:
    - "During that two-second window, which container is the load balancer still sending requests to?"
    - "If the new image is provably correct, what else has to be true for zero requests to fail during the swap?"
  payoff:
    anchor: "concepts.md#putting-it-together-anatomy-of-a-deploy-the-502-timeline"
    claim: |
      Topic 10's section walks the deploy second by second: the orchestrator replaces running
      containers, and "users see 502s" during the ~2s while the load balancer still routes to
      an old container that has already stopped accepting connections.
