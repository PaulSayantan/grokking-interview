topic: "Registries, Tagging & Distribution"
domain: docker
topic_slug: registries-and-distribution
version: 1
questions:
  - id: registries-and-distribution-001
    difficulty: beginner
    tags: [registry, basics]
    question: |
      What is a Docker/OCI registry?
    options:
      - "A server that stores and distributes images over the OCI Distribution API"
      - "A runtime that executes and supervises running containers on a host"
      - "A local cache tracking the state of running container processes"
      - "A build tool that compiles Dockerfiles into image layers"
    answer: 0
    explanation: |
      A registry is a stateful server (Docker Hub, GHCR, ECR, self-hosted
      Distribution) that stores image manifests and layer blobs and serves them
      over the OCI Distribution Spec (HTTP API v2). It does not run containers —
      the engine/containerd is the client that pushes and pulls.
    ref: "concepts.md#what-a-registry-is"

  - id: registries-and-distribution-002
    difficulty: beginner
    tags: [image-reference, defaults]
    question: |
      When you run `docker pull nginx`, what fully-qualified reference does Docker
      actually resolve it to?
    options:
      - "localhost/nginx:latest"
      - "docker.io/nginx:stable"
      - "docker.io/library/nginx:latest"
      - "registry.local/library/nginx:1"
    answer: 2
    explanation: |
      With no registry, Docker defaults to Docker Hub (docker.io). Official images
      live under the implicit `library/` namespace, and with no tag `:latest` is
      appended, giving `docker.io/library/nginx:latest`.
    ref: "concepts.md#image-reference-anatomy"

  - id: registries-and-distribution-003
    difficulty: intermediate
    tags: [image-reference, parsing]
    question: |
      How does Docker decide that `myregistry.com/app` refers to a registry host but
      `myorg/app` refers to a Docker Hub namespace?
    options:
      - "Docker probes both a registry host and Docker Hub, then uses whichever endpoint responds first"
      - "Each name is compared alphabetically against a built-in list of known registry hostnames shipped with Docker"
      - "The first path segment is treated as a registry only if it contains a '.' or ':' (or is 'localhost')"
      - "Any reference containing a '/' separator is always resolved as a registry host plus repository path"
    answer: 2
    explanation: |
      Docker treats the first component as a registry host only if it contains a dot,
      a port colon, or is `localhost`. Otherwise the first segment is a Hub namespace.
      That is why `myorg/app` → `docker.io/myorg/app` but `myregistry.com/app` uses that
      host.
    ref: "concepts.md#image-reference-anatomy"

  - id: registries-and-distribution-004
    difficulty: beginner
    tags: [tags, mutability]
    question: |
      What best describes a Docker image tag?
    options:
      - "An immutable cryptographic identity computed from the image's content bytes"
      - "A checksum of the largest layer blob, used to detect corruption on pull"
      - "A mutable, human-readable pointer to a manifest that can be moved to new content"
      - "A registry-enforced guarantee that the image is the newest build in the repository"
    answer: 2
    explanation: |
      A tag is a mutable label pointing at a manifest digest. Re-pushing the same tag
      moves the pointer to different content. It is not a hash and carries no
      "newest" guarantee.
    ref: "concepts.md#tags-are-mutable-pointers"

  - id: registries-and-distribution-005
    difficulty: intermediate
    tags: [tags, reproducibility]
    question: |
      Two CI machines pull `myorg/api:1.4` a week apart and get different image
      contents. What is the most likely explanation?
    options:
      - "The tag `1.4` was re-pushed to point at a new manifest digest"
      - "Docker corrupted one of the two downloads in transfer"
      - "The stored digest drifted on the registry over time"
      - "The `1.4` tag automatically tracks the latest patch"
    answer: 0
    explanation: |
      Tags are mutable pointers. Someone re-pushed `:1.4`, moving it to a new digest,
      so the two pulls received different bytes. Digests never change for the same
      content; tags do. Pin by digest to avoid this.
    ref: "concepts.md#tags-are-mutable-pointers"

  - id: registries-and-distribution-006
    difficulty: beginner
    tags: [tags, docker-tag]
    question: |
      What does `docker tag myorg/api:1.4 myorg/api:stable` do?
    options:
      - "Duplicates all layers under the new tag, roughly doubling disk usage"
      - "Renames the image in place, dropping the original `1.4` tag entirely"
      - "Pushes the image to the configured registry under both tag names"
      - "Adds another pointer to the same image; no layers are copied"
    answer: 3
    explanation: |
      `docker tag` just creates an additional reference to the same underlying image;
      no layer data is duplicated and nothing is pushed. Both tags resolve to the same
      manifest until one is re-pushed elsewhere.
    ref: "concepts.md#tags-are-mutable-pointers"

  - id: registries-and-distribution-007
    difficulty: intermediate
    tags: [digest, content-addressable]
    question: |
      An image digest such as `sha256:e3b0c4...` is the hash of what?
    options:
      - "The single largest layer blob"
      - "The container's running filesystem"
      - "The Dockerfile source text"
      - "The image manifest"
    answer: 3
    explanation: |
      "The image digest" is the SHA-256 of the manifest JSON. Because it is derived
      from content, the same digest always refers to the exact same bytes on any
      registry. Layers and the config also have their own digests, but the image
      digest is the manifest digest.
    ref: "concepts.md#the-immutable-digest"

  - id: registries-and-distribution-008
    difficulty: intermediate
    tags: [digest, reproducibility, deploy]
    question: |
      Your team must guarantee that production runs the exact image bytes that passed
      testing. What is the correct approach?
    options:
      - "Always deploy the `:latest` tag so prod matches the newest build"
      - "Rebuild the image separately for production from the same Dockerfile"
      - "Capture the manifest digest at test time and deploy `repo@sha256:...`"
      - "Deploy by tag but add a timestamp suffix to the tag"
    answer: 2
    explanation: |
      Only a digest is immutable and content-addressable. Capturing the digest at
      test time and deploying `repo@sha256:...` guarantees identical bytes. Rebuilding
      can produce different layers/CVEs; tags can be re-pushed.
    ref: "concepts.md#the-immutable-digest"

  - id: registries-and-distribution-009
    difficulty: advanced
    tags: [digest, image-id]
    question: |
      Why does the image ID shown by `docker images` often differ from the RepoDigest
      the registry reports for the same image?
    options:
      - "The registry rehashes every image with a fresh salt on upload"
      - "The image ID uses SHA-256 while the RepoDigest uses SHA-512"
      - "The image ID folds in the running container's live filesystem state"
      - "Image ID is the hash of the config blob; RepoDigest is the hash of the manifest"
    answer: 3
    explanation: |
      The local image ID is the digest of the image config blob, while the RepoDigest
      is the digest of the manifest (which references the config and layers). They
      describe different JSON objects, so the hashes differ.
    ref: "concepts.md#the-immutable-digest"

  - id: registries-and-distribution-010
    difficulty: beginner
    tags: [latest, foot-gun]
    question: |
      What does the `latest` tag mean to Docker?
    options:
      - "The most recently pushed image in the repository, tracked automatically"
      - "A special immutable release channel actively maintained by the registry"
      - "The default tag name used when none is specified — nothing more"
      - "The image carrying the highest semantic version number in the repo"
    answer: 2
    explanation: |
      `latest` is not special. It is simply the tag applied when you push or pull
      without specifying one. It is not updated automatically and does not mean
      "newest," which makes it a common foot-gun.
    ref: "concepts.md#the-latest-tag-foot-gun"

  - id: registries-and-distribution-011
    difficulty: intermediate
    tags: [latest, reproducibility, base-image]
    question: |
      Why is `FROM node:latest` discouraged in a production Dockerfile?
    options:
      - "It is consistently slower to pull than an equivalent pinned tag"
      - "`latest` images are always built larger than their versioned counterparts"
      - "The base image can drift over time, making builds non-reproducible"
      - "Docker refuses to cache any layers built on top of a `latest` base"
    answer: 2
    explanation: |
      `latest` is a moving pointer; the base can silently change between builds,
      breaking reproducibility and potentially altering your runtime. Pin a specific
      version (and ideally a digest) instead.
    ref: "concepts.md#the-latest-tag-foot-gun"

  - id: registries-and-distribution-012
    difficulty: intermediate
    tags: [latest, workflow]
    question: |
      You build and push `myorg/api:1.5` but `docker run myorg/api` still starts an
      old build. Why?
    options:
      - "The registry has not finished indexing the newly pushed 1.5 tag yet"
      - "Running an image requires a digest, so the plain tag reference is ignored"
      - "1.5 was automatically pushed to a different namespace under your account"
      - "`docker run` with no tag pulls `:latest`, which still points at the old build"
    answer: 3
    explanation: |
      `docker run myorg/api` resolves to `:latest`. Pushing `:1.5` does not update
      `:latest`; you must explicitly tag and push `:latest` (or run `myorg/api:1.5`).
    ref: "concepts.md#the-latest-tag-foot-gun"

  - id: registries-and-distribution-013
    difficulty: beginner
    tags: [auth, login]
    question: |
      Which operations on a private repository require authentication?
    options:
      - "Both pushing and pulling private repositories"
      - "Only pulling images from private repositories"
      - "Only pushing images to private repositories"
      - "Neither — HTTPS transport alone handles all access control"
    answer: 0
    explanation: |
      Public images pull anonymously, but pushing and pulling private repositories both
      require credentials via `docker login`. TLS only secures the channel; it does not
      grant access.
    ref: "concepts.md#authentication-login-tokens-credential-helpers"

  - id: registries-and-distribution-014
    difficulty: advanced
    tags: [auth, token-flow]
    question: |
      In the OCI/Docker registry auth flow, what happens after the registry returns
      `401` with a `WWW-Authenticate` header?
    options:
      - "The client aborts the operation and reports a fatal authentication error"
      - "The client resends the identical request carrying a session cookie instead"
      - "The registry emails a one-time verification code to the account owner"
      - "The client obtains a short-lived bearer token scoped to the requested repository/action and retries"
    answer: 3
    explanation: |
      The 401 names a token service and required scope. The client authenticates to that
      service, receives a scoped bearer token (e.g. `repository:myorg/api:pull,push`),
      and retries with `Authorization: Bearer <token>`.
    ref: "concepts.md#authentication-login-tokens-credential-helpers"

  - id: registries-and-distribution-015
    difficulty: intermediate
    tags: [auth, credentials, security]
    question: |
      By default, how does `docker login` store your registry credentials in
      `~/.docker/config.json`?
    options:
      - "Encrypted at rest using a key derived from your account password"
      - "Hashed with bcrypt so the original token cannot be recovered"
      - "Base64-encoded (not encrypted) unless a credential helper is configured"
      - "Not stored at all; you must re-enter them on every command"
    answer: 2
    explanation: |
      By default the token is stored base64-encoded, which is reversible, not encrypted —
      a common security finding. Configure a `credsStore` credential helper to keep
      secrets in the OS keychain instead.
    ref: "concepts.md#authentication-login-tokens-credential-helpers"

  - id: registries-and-distribution-016
    difficulty: intermediate
    tags: [auth, ecr]
    question: |
      How is authentication to Amazon ECR typically obtained?
    options:
      - "A permanent static password configured once in the ECR console"
      - "Docker Hub credentials shared across all linked AWS accounts"
      - "A short-lived token via `aws ecr get-login-password` or the ECR credential helper using IAM"
      - "An anonymous token, since ECR repositories are public by default"
    answer: 2
    explanation: |
      ECR uses IAM: `aws ecr get-login-password` issues a ~12-hour token, or the ECR
      credential helper fetches tokens automatically. ECR repositories are private by
      default.
    ref: "concepts.md#authentication-login-tokens-credential-helpers"

  - id: registries-and-distribution-017
    difficulty: intermediate
    tags: [push, layers, dedup]
    question: |
      During `docker push`, why do you frequently see "Layer already exists" for most
      layers?
    options:
      - "Docker silently skips any layers that failed to build correctly"
      - "Layers larger than 100MB are never uploaded to the registry"
      - "The client compresses duplicate layers into a single shared blob"
      - "The registry already has those blob digests (from another tag/image), so they are not re-uploaded"
    answer: 3
    explanation: |
      Push issues a HEAD for each layer's digest; if the registry already stores that
      content-addressed blob (shared base layers, prior builds), it is skipped. Only new
      or changed layers upload.
    ref: "concepts.md#what-travels-layers-blobs-and-dedup"

  - id: registries-and-distribution-018
    difficulty: beginner
    tags: [image-structure, blobs]
    question: |
      What does an image manifest reference?
    options:
      - "Only the Dockerfile source text that originally built the image"
      - "The container's live process tree captured at runtime"
      - "A config blob and an ordered list of layer blobs, all by digest"
      - "A list of every registry where the image has been mirrored"
    answer: 2
    explanation: |
      The manifest is small JSON that references, by digest and size, the image config
      blob and the ordered layer blobs. Everything is content-addressed.
    ref: "concepts.md#what-travels-layers-blobs-and-dedup"

  - id: registries-and-distribution-019
    difficulty: advanced
    tags: [push, dedup, blob-mount]
    question: |
      What is the purpose of a cross-repository blob mount
      (`?mount=<digest>&from=<repo>`) on push?
    options:
      - "It live-migrates a running container's process tree between two hosts"
      - "It mounts the registry's backing storage as a local bind volume on the client host"
      - "It lets a new repo reference an existing blob without re-uploading it"
      - "It converts a manifest list into a single-arch image"
    answer: 2
    explanation: |
      Blob mount reuses a blob already present in another repository on the same
      registry, avoiding re-upload. This makes promotion within a registry nearly free
      on bandwidth.
    ref: "concepts.md#what-travels-layers-blobs-and-dedup"

  - id: registries-and-distribution-020
    difficulty: intermediate
    tags: [config, metadata]
    question: |
      Where are an image's runtime settings like `Env`, `Entrypoint`, `Cmd`, and
      `User` stored?
    options:
      - "In the top layer's filesystem"
      - "In the tag string"
      - "In the registry's database, not the image"
      - "In the image config blob"
    answer: 3
    explanation: |
      The image config blob holds runtime metadata (Env, Cmd, Entrypoint, WorkingDir,
      User, ExposedPorts, architecture/os, rootfs.diff_ids, history). Layers hold the
      filesystem; the config holds how to run it.
    ref: "concepts.md#image-manifest-and-config"

  - id: registries-and-distribution-021
    difficulty: advanced
    tags: [manifest, inspect]
    question: |
      Which command inspects an image's raw manifest from a registry without pulling
      the layers?
    options:
      - "docker run --inspect nginx:1.27 --format '{{json .Manifest}}'"
      - "docker history nginx:1.27 --no-trunc --format '{{.Manifest}}'"
      - "docker buildx imagetools inspect nginx:1.27 --raw"
      - "docker export nginx:1.27 --output manifest.json"
    answer: 2
    explanation: |
      `docker buildx imagetools inspect <ref> --raw` fetches and prints the raw manifest
      (or index) JSON from the registry without downloading layer blobs. `docker history`
      needs a local image; `export` dumps a container filesystem.
    ref: "concepts.md#image-manifest-and-config"

  - id: registries-and-distribution-022
    difficulty: beginner
    tags: [multi-arch, manifest-list]
    question: |
      How can a single tag like `nginx:1.27` serve both amd64 and arm64 machines?
    options:
      - "The registry recompiles the image from source for each client's reported architecture"
      - "The client emulates the missing architecture at runtime via a bundled QEMU translation layer"
      - "A manifest list / image index maps each platform to a per-platform manifest"
      - "Docker stores a fat binary containing all architectures in one layer"
    answer: 2
    explanation: |
      A manifest list (Docker) / image index (OCI) points to one image manifest per
      platform. On pull, the daemon selects the manifest matching the host's os/arch.
    ref: "concepts.md#multi-arch-images-and-manifest-lists"

  - id: registries-and-distribution-023
    difficulty: intermediate
    tags: [multi-arch, buildx, exec-format-error]
    question: |
      You build with plain `docker build` on an Apple Silicon Mac and push. On an
      x86-64 server the container fails with `exec format error`. Why?
    options:
      - "The x86-64 server is missing a shared glibc runtime library the image was linked against"
      - "The registry stripped the amd64 layers during push to save storage space"
      - "The `:latest` tag was pulled instead of the version tag you built and pushed"
      - "Legacy `docker build` produced an arm64-only image; the amd64 host cannot run it"
    answer: 3
    explanation: |
      Legacy `docker build` produces a single-arch image for the builder's platform
      (here arm64). Running it on amd64 gives `exec format error`. Use
      `docker buildx build --platform linux/amd64,linux/arm64 --push` for a multi-arch
      index.
    ref: "concepts.md#multi-arch-images-and-manifest-lists"

  - id: registries-and-distribution-024
    difficulty: intermediate
    tags: [multi-arch, pull]
    question: |
      When a client pulls a multi-arch tag, what does it download?
    options:
      - "Every platform's layers, then discards the unused ones"
      - "Just the image index, resolving layers lazily at runtime"
      - "The amd64 variant always, since it is treated as the canonical default platform"
      - "Only the per-platform manifest and layers matching the host platform"
    answer: 3
    explanation: |
      The daemon reads the index and pulls only the manifest and layers for the host's
      platform. Other platforms' blobs are never downloaded.
    ref: "concepts.md#multi-arch-images-and-manifest-lists"

  - id: registries-and-distribution-025
    difficulty: advanced
    tags: [multi-arch, buildx, imagetools]
    question: |
      You have two single-arch images `api:1.4-amd64` and `api:1.4-arm64` already pushed.
      How do you combine them into one multi-arch tag `api:1.4`?
    options:
      - "docker tag api:1.4-amd64 api:1.4 && docker tag api:1.4-arm64 api:1.4"
      - "docker buildx imagetools create -t api:1.4 api:1.4-amd64 api:1.4-arm64"
      - "docker manifest push --amend api:1.4 api:1.4-amd64 api:1.4-arm64"
      - "docker save api:1.4-amd64 api:1.4-arm64 then docker load them as api:1.4"
    answer: 1
    explanation: |
      `docker buildx imagetools create -t <tag> <ref>...` builds an image index from
      existing manifests without rebuilding. (`docker manifest` can also do this but is
      the older experimental path.)
    ref: "concepts.md#multi-arch-images-and-manifest-lists"

  - id: registries-and-distribution-026
    difficulty: intermediate
    tags: [oci, distribution-spec, api]
    question: |
      Under the OCI Distribution Spec, which endpoint retrieves an image manifest?
    options:
      - "GET /v2/<name>/manifests/<tag or digest>"
      - "GET /v2/<name>/blobs/<digest>"
      - "GET /v1/images/<name>"
      - "POST /v2/<name>/pull"
    answer: 0
    explanation: |
      Manifests are fetched via `GET /v2/<name>/manifests/<reference>` where the
      reference is a tag or digest. `/blobs/<digest>` fetches layer/config blobs.
    ref: "concepts.md#the-oci-distribution-spec-registry-api"

  - id: registries-and-distribution-027
    difficulty: advanced
    tags: [oci, integrity, security]
    question: |
      How does a client verify integrity when pulling a layer blob over an untrusted
      CDN?
    options:
      - "It trusts the CDN's TLS certificate chain and performs no further content checks"
      - "It recomputes the SHA-256 of the blob and compares it to the requested digest"
      - "It re-downloads the blob three times and majority-votes on the bytes that agree"
      - "The registry signs each byte range with a per-request HMAC the client verifies"
    answer: 1
    explanation: |
      Blobs are content-addressed. The client hashes the downloaded bytes and checks the
      digest matches what it requested, giving end-to-end integrity even if the transport
      or CDN is untrusted.
    ref: "concepts.md#the-oci-distribution-spec-registry-api"

  - id: registries-and-distribution-028
    difficulty: advanced
    tags: [oci, referrers, artifacts]
    question: |
      What did the OCI Distribution Spec v1.1 referrers API
      (`GET /v2/<name>/referrers/<digest>`) enable?
    options:
      - "Listing every user and IP address that has pulled a given image digest"
      - "Discovering signatures, SBOMs, and attestations attached to an image by digest"
      - "Streaming a running container's stdout/stderr logs directly from the registry"
      - "Automatic garbage collection of tags older than a configured retention window"
    answer: 1
    explanation: |
      The referrers API lets clients discover artifacts (signatures, SBOMs,
      attestations) that reference a given image manifest by digest, standardizing how
      supply-chain metadata attaches to images.
    ref: "concepts.md#the-oci-distribution-spec-registry-api"

  - id: registries-and-distribution-029
    difficulty: beginner
    tags: [rate-limits, docker-hub]
    question: |
      What is the Docker Hub pull limit for an anonymous (unauthenticated) user?
    options:
      - "100 pulls per 6 hours per IPv4 address or IPv6 /64 subnet"
      - "10 pulls per hour per IPv4 address, resetting on a rolling 60-minute window"
      - "Unlimited, since rate limits apply only to authenticated accounts"
      - "1000 pulls per calendar day counted per Docker Hub account"
    answer: 0
    explanation: |
      Anonymous pulls are limited to 100 per 6-hour window, counted per IPv4 address or
      IPv6 /64 subnet. Authenticated free users get 200; paid Pro/Team/Business are
      unlimited.
    ref: "concepts.md#pull-rate-limits"

  - id: registries-and-distribution-030
    difficulty: intermediate
    tags: [rate-limits, ci, troubleshooting]
    question: |
      CI in a corporate network suddenly fails pulling base images with
      `429 toomanyrequests`. What is the most likely cause and fix?
    options:
      - "The upstream base images were deleted from the registry; rebuild and re-push them"
      - "Many CI runners share one egress IP and hit Docker Hub's anonymous limit; authenticate or mirror the images"
      - "The registry is experiencing a global outage; wait for it to recover and retry"
      - "The Dockerfile syntax is invalid; fix the malformed FROM line to resolve the 429"
    answer: 1
    explanation: |
      Behind NAT, all runners share one public IP, quickly exhausting the anonymous
      100/6h limit. Fixes: `docker login` with a paid account, run a pull-through cache,
      or pull from a non-Hub registry.
    ref: "concepts.md#pull-rate-limits"

  - id: registries-and-distribution-031
    difficulty: intermediate
    tags: [rate-limits, mitigation]
    question: |
      Which is NOT an effective way to avoid Docker Hub pull rate limits?
    options:
      - "Authenticate CI with a paid Docker account"
      - "Run a pull-through cache / registry mirror"
      - "Mirror base images into ECR or GHCR and pull from there"
      - "Add `--no-cache` to every docker build"
    answer: 3
    explanation: |
      `--no-cache` affects the build cache, not registry pulls, and would actually
      increase pulls. Authenticating, running a mirror, or pulling from a non-Hub
      registry all reduce Hub rate-limit exposure.
    ref: "concepts.md#pull-rate-limits"

  - id: registries-and-distribution-032
    difficulty: intermediate
    tags: [promotion, build-once]
    question: |
      What is the recommended pattern for moving a tested image from staging to
      production?
    options:
      - "Rebuild from the same Dockerfile in a separate production pipeline stage"
      - "Build once and promote the exact image by digest to the prod registry"
      - "Copy the running staging container's filesystem onto the production host"
      - "Re-tag `latest` in production so it always matches the staging image"
    answer: 1
    explanation: |
      "Build once, promote by digest" ships the exact bytes that were tested. Rebuilding
      per environment can change layers and CVEs, so staging results would not guarantee
      prod behavior.
    ref: "concepts.md#image-promotion-across-registries"

  - id: registries-and-distribution-033
    difficulty: advanced
    tags: [promotion, skopeo, multi-arch]
    question: |
      When promoting a multi-arch image between registries with
      `skopeo copy --all docker://...@sha256:... docker://...`, what does `--all`
      ensure?
    options:
      - "Every tag in the source repository is copied to the destination in one pass"
      - "The full image index and every per-platform manifest/layer are copied, preserving the digest"
      - "All registry users are notified that the promotion copy has completed"
      - "Only the amd64 variant is copied for speed, dropping the other platforms"
    answer: 1
    explanation: |
      `--all` copies the entire index (all platforms), not just the host's manifest. The
      content is copied by digest, so digests are preserved and the multi-arch index
      stays intact.
    ref: "concepts.md#image-promotion-across-registries"

  - id: registries-and-distribution-034
    difficulty: intermediate
    tags: [promotion, retag]
    question: |
      Retagging an image within the same registry (adding a new tag to an existing
      manifest) uploads how much layer data?
    options:
      - "All layers again, re-uploaded in full under the new tag"
      - "Only the layers that changed since the previous tag was pushed"
      - "No layer data — it only creates a new manifest/tag pointer"
      - "Roughly half the layers, thanks to on-the-wire compression"
    answer: 2
    explanation: |
      Retagging within a registry moves/creates a pointer to an existing manifest; no
      blobs are uploaded because the content already exists there.
    ref: "concepts.md#image-promotion-across-registries"

  - id: registries-and-distribution-035
    difficulty: intermediate
    tags: [garbage-collection, storage]
    question: |
      On a self-hosted registry, you delete several tags but disk usage does not drop.
      Why?
    options:
      - "Deleting a tag only removes a pointer; blobs remain until unreferenced and garbage collection runs"
      - "Tags are stored on a separate disk volume that this measurement did not include"
      - "The registry reclaims and compresses freed space automatically only after a week"
      - "Tag deletion is disabled by default, so the command silently did nothing at all"
    answer: 0
    explanation: |
      Untagging removes a pointer, not the underlying manifest/blobs. Storage is reclaimed
      only after you delete manifests by digest and run mark-and-sweep garbage collection
      (with deletion enabled).
    ref: "concepts.md#garbage-collection-and-cleanup"

  - id: registries-and-distribution-036
    difficulty: advanced
    tags: [garbage-collection, mark-sweep]
    question: |
      How does the CNCF Distribution registry's garbage collection work?
    options:
      - "It deletes any blob whose upload timestamp is older than a fixed 30-day threshold"
      - "Mark-and-sweep: mark blobs referenced by live manifests, then sweep unreferenced blobs"
      - "It removes the largest blobs first until total storage falls under a configured size quota"
      - "It deletes a manifest's blobs immediately the moment its last tag is removed"
    answer: 1
    explanation: |
      GC marks every blob reachable from a live manifest and sweeps the rest. Blobs shared
      by another still-tagged image survive. The registry should be read-only during GC and
      deletion must be enabled.
    ref: "concepts.md#garbage-collection-and-cleanup"

  - id: registries-and-distribution-037
    difficulty: beginner
    tags: [cleanup, prune]
    question: |
      Which command removes dangling (untagged) images from the local daemon?
    options:
      - "docker image prune"
      - "docker rmi --all"
      - "docker gc"
      - "docker registry clean"
    answer: 0
    explanation: |
      `docker image prune` removes dangling images locally; `-a` removes all images not
      used by a container. This is client-side cleanup, distinct from registry GC.
    ref: "concepts.md#garbage-collection-and-cleanup"

  - id: registries-and-distribution-038
    difficulty: intermediate
    tags: [cleanup, ecr, lifecycle]
    question: |
      How do cloud registries like Amazon ECR automate image cleanup?
    options:
      - "They never delete images; cloud registry storage is unlimited and never reclaimed"
      - "Lifecycle policies (e.g. expire untagged after N days, keep last N tagged)"
      - "By running `docker system prune` on your behalf nightly"
      - "By automatically deleting the single least-pulled image from each repository every hour"
    answer: 1
    explanation: |
      ECR lifecycle policies let you expire untagged images after a period or keep only
      the last N tagged images, preventing unbounded storage growth from frequent builds.
    ref: "concepts.md#garbage-collection-and-cleanup"

  - id: registries-and-distribution-039
    difficulty: beginner
    tags: [registry, hosts]
    question: |
      Which of these is a valid private/self-hosted registry option?
    options:
      - "Running `registry:2` (CNCF Distribution) or Harbor on your own host"
      - "Pointing `docker.io` at localhost via an /etc/hosts override so pulls stay on-box"
      - "Using `docker save` in server mode to accept push and pull requests over TCP"
      - "Enabling `--privileged` on the client so it can act as its own registry daemon"
    answer: 0
    explanation: |
      You can self-host with the CNCF Distribution image (`registry:2`) or richer
      platforms like Harbor (RBAC, scanning, replication). The other options are not
      registries.
    ref: "concepts.md#what-a-registry-is"

  - id: registries-and-distribution-040
    difficulty: intermediate
    tags: [image-reference, tag-digest]
    question: |
      What does the reference `nginx:1.27@sha256:abc...` mean?
    options:
      - "Try to pull tag 1.27 first, and fall back to the digest only if that tag is missing"
      - "Pull the content at that digest and verify the tag `1.27` resolves to it"
      - "It is a malformed reference that Docker rejects because a tag and digest cannot coexist"
      - "Pull whatever tag 1.27 currently points at and silently discard the appended digest"
    answer: 1
    explanation: |
      A reference may include both a tag (for readability) and a digest (for identity).
      Docker resolves the digest and checks the tag points at it. The digest wins on
      identity.
    ref: "concepts.md#image-reference-anatomy"

  - id: registries-and-distribution-041
    difficulty: intermediate
    tags: [security, credentials, layers]
    question: |
      Why must you never bake registry credentials or cloud keys into a Dockerfile
      layer?
    options:
      - "Secrets persist in the image layer history and can be extracted even if later removed"
      - "Embedding credentials measurably slows the build because Docker encrypts each secret layer"
      - "Docker's build daemon refuses to build any image whose layers contain the word 'password'"
      - "It only matters for public images, since private repositories keep the layers confidential"
    answer: 0
    explanation: |
      Anything written into a layer stays in that layer's history; a later `rm` adds a new
      layer but the secret remains recoverable from the earlier one. Use build secrets,
      credential helpers, or runtime injection instead.
    ref: "concepts.md#authentication-login-tokens-credential-helpers"

  - id: registries-and-distribution-042
    difficulty: advanced
    tags: [manifest, media-types, negotiation]
    question: |
      An old Docker client pulls a multi-arch tag but receives a single platform image
      instead of the index. What mechanism causes this?
    options:
      - "The registry randomly picks one platform's manifest whenever a tag has several available"
      - "Content negotiation via the Accept header — old clients that don't advertise index media types get a legacy manifest"
      - "The tag was actually single-arch all along and never carried a real multi-platform index"
      - "The client's local disk was too small to hold the full index, so it fell back to one manifest"
    answer: 1
    explanation: |
      Manifest retrieval negotiates via the `Accept` header. Clients that do not advertise
      manifest-list/index media types receive a compatible single manifest, preserving
      backward compatibility.
    ref: "concepts.md#the-oci-distribution-spec-registry-api"

  - id: registries-and-distribution-043
    difficulty: intermediate
    tags: [digest, inspect, cli]
    question: |
      Which command shows the registry manifest digest (RepoDigest) of a local image?
    options:
      - "docker inspect --format '{{index .RepoDigests 0}}' myorg/api:1.4"
      - "docker version --format '{{.Server.RepoDigest}}' myorg/api:1.4"
      - "docker top myorg/api:1.4 --format '{{.RepoDigests}}' --no-trunc"
      - "docker diff myorg/api:1.4 --show-digest --format '{{.RepoDigest}}'"
    answer: 0
    explanation: |
      `RepoDigests` holds the `repo@sha256:...` manifest digest as pushed/pulled from the
      registry. `docker images --digests` shows it in tabular form too.
    ref: "concepts.md#the-immutable-digest"

  - id: registries-and-distribution-044
    difficulty: advanced
    tags: [garbage-collection, safety]
    question: |
      Why should you delete images by digest (not just by tag) and rely on the
      registry's GC when reclaiming space?
    options:
      - "Deleting by digest runs measurably faster than deleting the equivalent tag reference"
      - "Registry tags are permanent records and cannot be removed once a manifest is pushed"
      - "Deleting shared blobs manually can corrupt other images; GC uses reference counting to keep shared blobs"
      - "The registry bills a per-request storage fee for every tag deletion you perform"
    answer: 2
    explanation: |
      Layers are shared across images. Blindly deleting a blob can break another image
      that references it. Deleting manifests by digest and letting mark-and-sweep GC handle
      shared blobs preserves integrity.
    ref: "concepts.md#garbage-collection-and-cleanup"

  - id: registries-and-distribution-045
    difficulty: intermediate
    tags: [buildx, multi-arch, build]
    question: |
      Which command builds and pushes a multi-architecture image in one step?
    options:
      - "docker build --arch all --push -t myorg/api:1.4 . to compile every supported platform"
      - "docker buildx build --platform linux/amd64,linux/arm64 -t myorg/api:1.4 --push ."
      - "docker push --multi-arch --platform amd64,arm64 myorg/api:1.4 to the target registry"
      - "docker run --platform all --build myorg/api:1.4 to assemble and publish each variant"
    answer: 1
    explanation: |
      Buildx with `--platform` produces per-platform images and, with `--push`, assembles
      and uploads the manifest list/index under one tag. Legacy `docker build` is
      single-arch.
    ref: "concepts.md#multi-arch-images-and-manifest-lists"

  - id: registries-and-distribution-046
    difficulty: beginner
    tags: [repository, terminology]
    question: |
      In the reference `ghcr.io/myorg/api:1.4.2`, which part is the repository?
    options:
      - "ghcr.io"
      - "myorg"
      - "api"
      - "1.4.2"
    answer: 2
    explanation: |
      `ghcr.io` is the registry host, `myorg` the namespace, `api` the repository, and
      `1.4.2` the tag. A repository is the named collection that holds many tags/digests.
    ref: "concepts.md#image-reference-anatomy"

  - id: registries-and-distribution-047
    difficulty: advanced
    tags: [immutable-tags, registry-policy]
    question: |
      Your organization wants to prevent anyone from re-pushing an existing tag with new
      content. What feature enforces this?
    options:
      - "Marking only the `latest` tag as read-only, which locks every other tag by inheritance"
      - "Immutable tags (supported by ECR, GHCR, Harbor)"
      - "A client-side `docker pull --frozen` flag that refuses to overwrite any existing local tag"
      - "Individually signing every layer blob, which blocks the registry from accepting re-pushes"
    answer: 1
    explanation: |
      Registry immutable-tag settings reject pushes that would overwrite an existing tag,
      guaranteeing a tag always maps to the same content. This complements digest pinning
      on the consumer side.
    ref: "concepts.md#tags-are-mutable-pointers"

  - id: registries-and-distribution-048
    difficulty: intermediate
    tags: [oci, distribution-spec, tags-list]
    question: |
      Which OCI Distribution endpoint lists the tags available in a repository?
    options:
      - "GET /v2/<name>/tags/list"
      - "GET /v2/<name>/manifests/all"
      - "GET /v2/tags"
      - "POST /v2/<name>/list"
    answer: 0
    explanation: |
      `GET /v2/<name>/tags/list` returns the repository's tags. Manifests are fetched per
      reference and blobs by digest under the same `/v2/` API.
    ref: "concepts.md#the-oci-distribution-spec-registry-api"
