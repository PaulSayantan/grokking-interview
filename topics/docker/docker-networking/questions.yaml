topic: "Docker Networking"
domain: docker
topic_slug: docker-networking
version: 1
questions:
  - id: docker-networking-001
    difficulty: beginner
    tags: [namespaces, isolation]
    question: |
      What Linux kernel feature gives each Docker container its own private set of
      network interfaces, IP addresses, routing table, and port space?
    options:
      - "The network namespace"
      - "The cgroups subsystem"
      - "The mount namespace"
      - "SELinux security labels"
    answer: 0
    explanation: |
      A network namespace is the kernel isolation primitive that gives a container an
      independent copy of the network stack. Because each container has its own namespace,
      two containers can both bind port 8080 without conflicting. cgroups limit resources,
      not networking.
    ref: "concepts.md#network-namespaces-the-isolation-mechanism"

  - id: docker-networking-002
    difficulty: intermediate
    tags: [veth, bridge, namespaces]
    question: |
      When Docker attaches a container to a bridge network, what connects the container's
      network namespace to the host's docker0 bridge?
    options:
      - "A shared physical NIC that the container and host both bind to directly for packets"
      - "A veth (virtual ethernet) pair — one end in the container as eth0, the other on the bridge"
      - "An NFS mount that transparently carries the container's network packets to the bridge"
      - "A Unix domain socket that shuttles packets between the container and the docker0 bridge"
    answer: 1
    explanation: |
      Docker creates a veth pair (like a virtual patch cable). One end appears inside the
      container's namespace as eth0; the other end is attached to the docker0 bridge in the
      host namespace. That pair is what carries packets in and out of the container.
    ref: "concepts.md#network-namespaces-the-isolation-mechanism"

  - id: docker-networking-003
    difficulty: beginner
    tags: [bridge, default-driver]
    question: |
      Which network driver does Docker use by default for a standalone container started
      with `docker run` and no `--network` flag?
    options:
      - "host"
      - "overlay"
      - "bridge"
      - "macvlan"
    answer: 2
    explanation: |
      Without an explicit --network, a standalone container attaches to the default bridge
      network (docker0). Bridge is the default single-host driver; overlay is for multi-host
      Swarm, and host/macvlan must be requested explicitly.
    ref: "concepts.md#the-bridge-network-driver-default"

  - id: docker-networking-004
    difficulty: beginner
    tags: [bridge, docker0, subnet]
    question: |
      What is `docker0` on a Linux Docker host?
    options:
      - "The Docker daemon's main configuration file that stores default network settings"
      - "A dedicated physical network card the host reserves exclusively for Docker traffic"
      - "The very first container ever started, which then forwards packets for the rest"
      - "A Linux software bridge Docker creates for the default bridge network"
    answer: 3
    explanation: |
      docker0 is the Linux software bridge the daemon creates (default subnet 172.17.0.0/16,
      gateway 172.17.0.1). Containers on the default bridge get a veth into docker0 and a
      private IP on that subnet.
    ref: "concepts.md#the-bridge-network-driver-default"

  - id: docker-networking-005
    difficulty: intermediate
    tags: [default-bridge, user-defined, dns]
    question: |
      What is the key functional difference between the default `bridge` network and a
      user-defined bridge network created with `docker network create`?
    options:
      - "The default bridge is faster because it skips the NAT and iptables path entirely"
      - "Only the default bridge supports port publishing; user-defined bridges reject -p flags"
      - "User-defined bridges provide automatic DNS resolution by container name; the default bridge does not"
      - "User-defined bridges cannot reach the internet because Docker withholds egress NAT from them"
    answer: 2
    explanation: |
      Both use the bridge driver, but a user-defined bridge runs Docker's embedded DNS so
      containers resolve each other by name/alias. On the default bridge you can only reach
      peers by IP (or the deprecated --link). This is the single most-asked Docker networking
      distinction.
    ref: "concepts.md#default-bridge-vs-user-defined-bridge"

  - id: docker-networking-006
    difficulty: intermediate
    tags: [default-bridge, dns, troubleshooting]
    question: |
      Two containers were started with `docker run` (no --network) on the default bridge.
      Container A cannot reach container B by the name `b`. What is the correct fix?
    options:
      - "Add `-p 80:80` to both containers so the published ports register their names in DNS"
      - "Restart the Docker daemon to force it to rebuild the default bridge's name table"
      - "Set EXPOSE 80 in both Dockerfiles so Docker registers each container's hostname"
      - "Put both containers on a user-defined network so name resolution works"
    answer: 3
    explanation: |
      The default bridge has no embedded DNS, so names don't resolve. Creating a user-defined
      network (or using Compose, which does it automatically) enables resolution by container
      name. Publishing ports and EXPOSE are unrelated to inter-container name resolution.
    ref: "concepts.md#default-bridge-vs-user-defined-bridge"

  - id: docker-networking-007
    difficulty: beginner
    tags: [embedded-dns, resolver]
    question: |
      On a user-defined network, at what special IP address does Docker's embedded DNS
      resolver listen inside each container?
    options:
      - "127.0.0.11"
      - "172.17.0.1"
      - "8.8.8.8"
      - "169.254.169.254"
    answer: 0
    explanation: |
      Docker injects nameserver 127.0.0.11 into the container's /etc/resolv.conf. That
      embedded resolver answers container-name/alias lookups and forwards everything else to
      the host's upstream DNS. 169.254.169.254 is the cloud metadata endpoint, not DNS.
    ref: "concepts.md#the-embedded-dns-resolver"

  - id: docker-networking-008
    difficulty: intermediate
    tags: [embedded-dns, upstream]
    question: |
      When a container on a user-defined network looks up `example.com`, what does Docker's
      embedded DNS resolver (127.0.0.11) do?
    options:
      - "Returns NXDOMAIN because the embedded resolver only ever knows container names"
      - "Forwards the query to the host's configured upstream DNS servers"
      - "Blocks all external DNS lookups by default as a container hardening measure"
      - "Resolves every external name to the docker0 bridge gateway address instead"
    answer: 1
    explanation: |
      The embedded resolver answers names of containers on the same network; anything it can't
      answer (external hostnames) it forwards to the host's upstream DNS servers. It does not
      block external lookups.
    ref: "concepts.md#the-embedded-dns-resolver"

  - id: docker-networking-009
    difficulty: advanced
    tags: [network-alias, dns]
    question: |
      What does a `--network-alias` (or Compose alias shared by several replicas) provide?
    options:
      - "A static host port mapping that survives container restarts and reschedules"
      - "A dedicated MAC address on the physical LAN so the container appears as real hardware"
      - "A firewall rule that automatically allows inbound traffic to the aliased container"
      - "An additional DNS name for the container, with basic round-robin when multiple containers share one alias"
    answer: 3
    explanation: |
      A network alias gives a container extra resolvable names on a network. If multiple
      containers share the same alias, the embedded DNS returns their IPs round-robin — a
      simple client-side load-balancing mechanism. It is unrelated to ports or MACs.
    ref: "concepts.md#the-embedded-dns-resolver"

  - id: docker-networking-010
    difficulty: intermediate
    tags: [host-network, isolation]
    question: |
      What happens when you run a container with `--network host` on native Linux?
    options:
      - "The container shares the host's network namespace — no veth, no NAT, binds ports directly on the host"
      - "The container gets its own fresh network namespace but Docker attaches no interfaces to it at all"
      - "The container is isolated on a private per-host overlay segment that only Swarm managers can reach"
      - "The container can only use its loopback interface and is cut off from every external network"
    answer: 0
    explanation: |
      With --network host the container does not get its own network namespace; it uses the
      host's stack directly. There is no veth pair, no docker0, and no NAT. A process binding
      8080 in the container binds 8080 on the host.
    ref: "concepts.md#host-network-driver"

  - id: docker-networking-011
    difficulty: intermediate
    tags: [host-network, port-publishing]
    question: |
      Why does `-p 8080:80` have no effect when a container uses `--network host`?
    options:
      - "Host mode disables all container networking, so no port flag could ever take effect"
      - "There is no separate namespace to map into — the container is already on the host's network stack"
      - "Host mode only allows UDP traffic, so a TCP port mapping like 8080:80 is silently dropped"
      - "Docker silently rewrites it to a 80:80 mapping to match the container's listening port"
    answer: 1
    explanation: |
      Port publishing maps a host port to a container's isolated namespace via NAT. In host
      mode there is no separate namespace, so there is nothing to map — the container already
      listens directly on host ports. Docker ignores -p in host mode.
    ref: "concepts.md#host-network-driver"

  - id: docker-networking-012
    difficulty: advanced
    tags: [host-network, security, performance]
    question: |
      Which statement about `--network host` is correct?
    options:
      - "It improves isolation between containers by giving each its own hardened network stack"
      - "It is the default mode for docker run when no --network flag is supplied on the command line"
      - "It gives the lowest network overhead (no NAT/bridge hop) but removes network isolation"
      - "It requires Swarm mode to be initialized before any container can use it"
    answer: 2
    explanation: |
      Host mode skips the bridge and NAT, giving the best raw network performance, but at the
      cost of isolation — the container sees and can bind all host interfaces/ports and can
      conflict with host services. It is a deliberate trade-off, not a default.
    ref: "concepts.md#host-network-driver"

  - id: docker-networking-013
    difficulty: intermediate
    tags: [none-network, isolation]
    question: |
      What does `--network none` give a container?
    options:
      - "Its own namespace with only a loopback interface and no external connectivity"
      - "Full unrestricted access to the host's network stack, interfaces, and all its ports"
      - "A randomly assigned host port mapping created automatically for the container's service"
      - "Direct access to the multi-host overlay network shared across the whole Swarm cluster"
    answer: 0
    explanation: |
      With --network none the container has its own network namespace but only the lo
      interface — no eth0, no bridge, no external access. It is the strongest built-in network
      isolation, useful for untrusted or purely local workloads.
    ref: "concepts.md#none-network-driver"

  - id: docker-networking-014
    difficulty: beginner
    tags: [expose, documentation]
    question: |
      What does the `EXPOSE 8080` instruction in a Dockerfile actually do?
    options:
      - "Publishes port 8080 to the host automatically as soon as the container starts running"
      - "Records documentation/metadata about which port the container listens on — it does not publish anything"
      - "Opens an inbound firewall rule on the host so the port becomes reachable from the LAN"
      - "Maps port 8080 to a randomly chosen host port at image build time and bakes it into the image"
    answer: 1
    explanation: |
      EXPOSE is metadata only. It documents intent and is read by tools and by `docker run -P`,
      but it does not publish the port or make it reachable from the host. You still need -p
      (or -P) to actually expose a port.
    ref: "concepts.md#port-publishing--p-vs-expose"

  - id: docker-networking-015
    difficulty: beginner
    tags: [port-publishing, run]
    question: |
      In `docker run -p 8080:80 nginx`, what does the mapping mean?
    options:
      - "Container port 8080 maps to host port 80"
      - "Both port numbers must always be equal (8080)"
      - "Host port 8080 forwards to container port 80"
      - "It publishes 8080 to a random container port"
    answer: 2
    explanation: |
      The format is host:container. So -p 8080:80 forwards traffic arriving on the host's port
      8080 to the container's port 80. External clients connect to host:8080.
    ref: "concepts.md#port-publishing--p-vs-expose"

  - id: docker-networking-016
    difficulty: intermediate
    tags: [expose, port-publishing, troubleshooting]
    question: |
      A Dockerfile has `EXPOSE 3000` and the app listens on 3000, but `curl localhost:3000`
      on the host fails. Why?
    options:
      - "The app crashed on startup, so nothing is listening on port 3000 anymore"
      - "EXPOSE only works with UDP, so a TCP curl to the published port cannot connect"
      - "Docker blocks all localhost traffic to containers unless privileged mode is enabled"
      - "EXPOSE does not publish the port; you must run with `-p 3000:3000` (or -P)"
    answer: 3
    explanation: |
      EXPOSE is documentation only and never publishes a port. To reach the container from the
      host you must publish it with -p 3000:3000 (or -P to publish all EXPOSEd ports to random
      host ports).
    ref: "concepts.md#port-publishing--p-vs-expose"

  - id: docker-networking-017
    difficulty: advanced
    tags: [port-publishing, bind-address, security]
    question: |
      What is the difference between `-p 8080:80` and `-p 127.0.0.1:8080:80`?
    options:
      - "Nothing; the two forms are completely identical and Docker treats them the same way"
      - "The second form quietly switches the published port to UDP instead of the default TCP"
      - "The first binds the host port on 0.0.0.0 (reachable from the LAN); the second binds only on loopback (host-local)"
      - "The first form publishes the container to a randomly chosen ephemeral host port instead"
    answer: 2
    explanation: |
      Omitting the host IP binds the published port on 0.0.0.0 (all interfaces), so it is
      reachable from other machines on the LAN. Prefixing 127.0.0.1 binds only the loopback
      interface, keeping the service host-local — a common hardening step.
    ref: "concepts.md#port-publishing--p-vs-expose"

  - id: docker-networking-018
    difficulty: intermediate
    tags: [port-publishing, capital-p]
    question: |
      What does `docker run -P` (capital P) do?
    options:
      - "Publishes nothing at all and is only a documentation flag like EXPOSE"
      - "Enables privileged mode, granting the container full host device access"
      - "Publishes only the well-known port 80, ignoring any other EXPOSEd ports"
      - "Publishes every EXPOSEd port to a randomly chosen high host port"
    answer: 3
    explanation: |
      -P publishes all ports declared by EXPOSE, each to a random ephemeral host port. You
      discover the mappings with `docker port <container>` or `docker ps`. Lowercase -p maps a
      specific host:container port.
    ref: "concepts.md#port-publishing--p-vs-expose"

  - id: docker-networking-019
    difficulty: intermediate
    tags: [container-to-container, user-defined, ports]
    question: |
      Two containers `api` and `db` are on the same user-defined network. Does `api` need a
      published port on `db` to connect to Postgres?
    options:
      - "No — on a shared network api reaches db by name on the container port (db:5432); publishing is only for host/external access"
      - "Yes, db must be run with -p 5432:5432 to publish Postgres to the host, otherwise the embedded DNS refuses to route api's traffic to it"
      - "Yes, both containers must switch to --network host so they share the host stack and can see each other's ports directly"
      - "No, but only if the two containers also share a mounted volume so Docker can register db's socket path for discovery"
    answer: 0
    explanation: |
      Containers on the same network reach each other directly on the container's own port
      using the service/container name. Port publishing (-p) is only needed to expose a
      service to the host or the outside world, not for container-to-container traffic.
    ref: "concepts.md#container-to-container-communication"

  - id: docker-networking-020
    difficulty: advanced
    tags: [multi-homing, segmentation, security]
    question: |
      You want a public-facing `proxy` to reach `api`, but the `db` must be unreachable from
      the proxy. How do you structure the networks?
    options:
      - "Put all three containers on the default bridge and rely on iptables ordering to keep the proxy from reaching db"
      - "Use two networks: db and api on `backend`; proxy and api on `frontend`; keep db off frontend so proxy cannot reach it"
      - "Use --network host for all three so the shared host stack lets Docker firewall proxy-to-db traffic automatically"
      - "Give db no published ports and trust that an unpublished container is unreachable by peers on the same network"
    answer: 1
    explanation: |
      Attach api to both frontend and backend (multi-homing), keep db only on backend, and
      keep proxy only on frontend. A container reaches only peers on networks it shares, so the
      proxy cannot reach db directly — a real segmentation control.
    ref: "concepts.md#container-to-container-communication"

  - id: docker-networking-021
    difficulty: beginner
    tags: [localhost, loopback, troubleshooting]
    question: |
      Inside a container, what does `localhost` (127.0.0.1) refer to?
    options:
      - "The Docker host machine, since containers proxy their loopback traffic straight to the host's 127.0.0.1"
      - "The embedded DNS resolver at 127.0.0.11, which localhost is aliased to inside every container"
      - "The default bridge gateway (172.17.0.1) that every container uses as its loopback endpoint"
      - "The container's own loopback interface — not the host and not other containers"
    answer: 3
    explanation: |
      Each container has its own network namespace, so localhost/127.0.0.1 is the container's
      own loopback. It does not reach the host or other containers. To reach another container,
      use its service name on a shared network.
    ref: "concepts.md#localhost-inside-a-container-is-not-the-host"

  - id: docker-networking-022
    difficulty: intermediate
    tags: [localhost, container-to-container, troubleshooting]
    question: |
      An app in the `api` container connects to `localhost:5432` to reach Postgres running in
      a separate `db` container, and it fails. What is the fix?
    options:
      - "Connect to `db:5432` (the service name) with both containers on a shared user-defined network"
      - "Rebind Postgres to listen on 0.0.0.0 inside db so api's localhost lookup reaches it across the namespace boundary"
      - "Run the api container with --privileged so its loopback interface is allowed to span into the db container"
      - "Add EXPOSE 5432 to the api Dockerfile so Docker maps api's localhost onto the db container's port"
    answer: 0
    explanation: |
      localhost inside api is api's own loopback, not the db container. On a shared
      user-defined network the embedded DNS resolves the db service name, so the app should
      connect to db:5432.
    ref: "concepts.md#localhost-inside-a-container-is-not-the-host"

  - id: docker-networking-023
    difficulty: intermediate
    tags: [host-access, host-docker-internal]
    question: |
      From inside a container, which special DNS name lets you reach a service running on the
      host machine (on Docker Desktop, or Linux with the right --add-host)?
    options:
      - "host.local"
      - "host.docker.internal"
      - "gateway.docker"
      - "docker.host"
    answer: 1
    explanation: |
      host.docker.internal resolves to the host from inside a container. It works on Docker
      Desktop, and on native Linux when you add `--add-host=host.docker.internal:host-gateway`.
      On Linux you can also use the bridge gateway IP (e.g. 172.17.0.1).
    ref: "concepts.md#localhost-inside-a-container-is-not-the-host"

  - id: docker-networking-024
    difficulty: advanced
    tags: [iptables, nat, egress]
    question: |
      When a bridged container makes an outbound connection to the internet, why does the
      remote server see the host's IP rather than the container's 172.17.0.x address?
    options:
      - "The docker-proxy userland process copies each packet and re-sends it from the host, stripping the container's private IP"
      - "The container has no IP of its own on the bridge, so packets already leave carrying the host's address by default"
      - "iptables source-NAT (masquerade) in the nat table's POSTROUTING chain rewrites the source IP to the host's"
      - "The embedded DNS resolver at 127.0.0.11 substitutes the host's public address into the outbound packet headers"
    answer: 2
    explanation: |
      Docker adds MASQUERADE/SNAT rules in the nat POSTROUTING chain so container egress is
      rewritten to the host's IP, allowing return traffic to route back. That is why external
      services see the host IP, not the private container IP.
    ref: "concepts.md#iptables-and-nat-under-the-hood"

  - id: docker-networking-025
    difficulty: advanced
    tags: [iptables, dnat, port-publishing]
    question: |
      What kind of iptables rule does `-p 8080:80` create to route inbound traffic to the
      container?
    options:
      - "A DNAT rule (in PREROUTING / DOCKER chain) rewriting the destination to the container IP:80"
      - "A SNAT/masquerade rule in the POSTROUTING chain that rewrites the source address of inbound packets to the container's IP"
      - "A DROP rule in the FORWARD chain that discards host-port traffic unless the container has explicitly allowlisted it"
      - "A REJECT rule in the filter table that bounces connections to host port 8080 back with an ICMP unreachable"
    answer: 0
    explanation: |
      Publishing a port installs a destination-NAT (DNAT) rule that rewrites packets arriving
      on host port 8080 so their destination becomes the container's 172.17.0.x:80. SNAT
      handles egress; DNAT handles published-port ingress.
    ref: "concepts.md#iptables-and-nat-under-the-hood"

  - id: docker-networking-026
    difficulty: expert
    tags: [iptables, docker-user, firewall]
    question: |
      Where should you add custom iptables rules so they are evaluated before Docker's own
      rules and are not overwritten by Docker?
    options:
      - "The INPUT chain of the filter table"
      - "The DOCKER-USER chain"
      - "The DOCKER chain directly"
      - "The nat OUTPUT chain"
    answer: 1
    explanation: |
      Docker provides the DOCKER-USER chain specifically for administrator rules. It is
      evaluated before Docker's automatically managed rules, and Docker will not flush it, so
      it is the supported place for custom filtering of container traffic.
    ref: "concepts.md#iptables-and-nat-under-the-hood"

  - id: docker-networking-027
    difficulty: expert
    tags: [iptables, ufw, security]
    question: |
      Why can a container published with `-p 8080:80` be reachable from the LAN even though
      `ufw` is configured to block port 8080 on the host?
    options:
      - "ufw does not support TCP port rules and can only filter UDP, so an 8080 TCP block never registers"
      - "The container ignores the host firewall by design and cannot be restricted"
      - "Docker's DNAT rules in the nat table run before the filter rules ufw manages, bypassing ufw"
      - "ufw only ever blocks IPv6 traffic, so an IPv4 client on the LAN reaches the published port unfiltered"
    answer: 2
    explanation: |
      Docker inserts DNAT rules that process published-port traffic before ufw's filter rules
      take effect, so ufw's block is bypassed. Mitigations: publish to 127.0.0.1:, or add rules
      to the DOCKER-USER chain. This is a well-known Docker+ufw gotcha.
    ref: "concepts.md#iptables-and-nat-under-the-hood"

  - id: docker-networking-028
    difficulty: advanced
    tags: [ip-forwarding, kernel]
    question: |
      Which kernel setting must be enabled for the docker0 bridge to route packets between
      containers and external networks (Docker enables it automatically)?
    options:
      - "net.ipv4.tcp_syncookies"
      - "net.core.somaxconn"
      - "kernel.randomize_va_space"
      - "net.ipv4.ip_forward"
    answer: 3
    explanation: |
      IP forwarding (net.ipv4.ip_forward=1) allows the host to route packets between
      interfaces, which bridge networking with NAT requires. Docker enables it automatically
      on startup. The others are unrelated TCP/security/socket tunables.
    ref: "concepts.md#iptables-and-nat-under-the-hood"

  - id: docker-networking-029
    difficulty: intermediate
    tags: [overlay, multi-host, swarm]
    question: |
      Which network driver connects containers running on different Docker hosts as if they
      were on the same L2 network?
    options:
      - "bridge"
      - "host"
      - "overlay"
      - "none"
    answer: 2
    explanation: |
      The overlay driver spans multiple hosts, typically in Docker Swarm. It encapsulates
      traffic in VXLAN tunnels between hosts. Bridge is single-host, host shares the host
      stack, and none is isolated.
    ref: "concepts.md#overlay-networks-multi-host--swarm"

  - id: docker-networking-030
    difficulty: advanced
    tags: [overlay, vxlan, swarm]
    question: |
      What encapsulation and prerequisite does the overlay driver rely on?
    options:
      - "GRE tunnels between hosts with no special daemon mode required beyond the bridge driver"
      - "HTTP tunneling that relays container frames through the shared image registry as the control plane"
      - "IPsec transport only, layered on top of each host's docker0 bridge for cross-host delivery"
      - "VXLAN (UDP 4789) and Swarm mode for the control plane"
    answer: 3
    explanation: |
      Overlay networks encapsulate container traffic in VXLAN (UDP port 4789) and use Swarm's
      distributed store for network state. Swarm mode provides the control plane; --attachable
      lets standalone containers also join.
    ref: "concepts.md#overlay-networks-multi-host--swarm"

  - id: docker-networking-031
    difficulty: advanced
    tags: [macvlan, lan, mac-address]
    question: |
      What is the defining characteristic of the macvlan driver?
    options:
      - "Each container gets its own MAC address and an IP directly on the physical LAN, appearing as a physical device"
      - "It shares the host's single IP via source-NAT and multiplexes containers behind it using published-port mappings"
      - "It provides no external connectivity and confines every attached container to loopback-only traffic"
      - "It only works once Swarm mode is initialized, since it depends on the cluster's distributed control plane"
    answer: 0
    explanation: |
      macvlan assigns each container a unique MAC and a routable IP on the physical LAN, so it
      looks like a real host to routers/DHCP — no NAT, no port publishing needed. It's useful
      for legacy apps that expect to be first-class network devices.
    ref: "concepts.md#macvlan-and-ipvlan"

  - id: docker-networking-032
    difficulty: expert
    tags: [macvlan, gotcha, host-connectivity]
    question: |
      What is a common gotcha with macvlan networks?
    options:
      - "Containers can never reach the internet because macvlan strips the default route from every attached interface"
      - "By default the host cannot communicate with its own macvlan containers, and many cloud/Wi-Fi NICs block multiple MACs / promiscuous mode"
      - "It requires the overlay driver to be enabled first so VXLAN can carry the per-container MAC addresses"
      - "It disables the embedded DNS resolver entirely for every container running anywhere on the host"
    answer: 1
    explanation: |
      A parent NIC won't loop a frame back to itself, so the host can't talk to its macvlan
      containers without an extra sub-interface. Also cloud providers and Wi-Fi adapters often
      forbid promiscuous mode / multiple MACs, so macvlan usually works only on wired/bare-metal.
    ref: "concepts.md#macvlan-and-ipvlan"

  - id: docker-networking-033
    difficulty: expert
    tags: [ipvlan, macvlan, mac]
    question: |
      How does ipvlan differ from macvlan?
    options:
      - "ipvlan routes container traffic through source-NAT while macvlan places containers directly on the LAN without translation"
      - "ipvlan requires Swarm mode and its distributed store, whereas macvlan runs on a standalone single host"
      - "ipvlan only supports IPv6 addressing, while macvlan is limited to handing out IPv4 addresses on the LAN"
      - "ipvlan shares the parent interface's MAC (containers get distinct IPs but the same MAC), useful where the network limits MACs per port"
    answer: 3
    explanation: |
      With ipvlan, containers share the parent NIC's MAC and are differentiated by IP only.
      This helps in environments that restrict the number of MAC addresses per switch port,
      where macvlan (unique MAC per container) would be rejected.
    ref: "concepts.md#macvlan-and-ipvlan"

  - id: docker-networking-034
    difficulty: beginner
    tags: [cli, network-create]
    question: |
      Which command creates a new user-defined bridge network named `appnet`?
    options:
      - "docker network create appnet"
      - "docker network add appnet"
      - "docker create network appnet"
      - "docker run --net appnet"
    answer: 0
    explanation: |
      `docker network create appnet` creates a user-defined bridge (the default driver). You
      then attach containers with --network appnet. The other forms are not valid Docker
      network commands.
    ref: "concepts.md#managing-networks-and-connecting-containers"

  - id: docker-networking-035
    difficulty: intermediate
    tags: [cli, network-connect, multi-homing]
    question: |
      What does `docker network connect other c1` do?
    options:
      - "Creates a brand-new user-defined bridge network named `other` and leaves container c1 unchanged"
      - "Attaches the already-running container c1 to an additional network `other`, making it multi-homed"
      - "Renames the running container c1 to `other` while keeping its existing single network attachment"
      - "Publishes all of c1's exposed ports onto the host through a network profile called `other`"
    answer: 1
    explanation: |
      `docker network connect` attaches a running container to another network on the fly, so
      c1 ends up on multiple networks (multi-homed) with an interface on each. `disconnect`
      reverses it. This dynamic attach works with user-defined networks.
    ref: "concepts.md#managing-networks-and-connecting-containers"

  - id: docker-networking-036
    difficulty: intermediate
    tags: [cli, inspect]
    question: |
      Which command shows a network's subnet, gateway, and the containers currently attached
      to it?
    options:
      - "docker network ls"
      - "docker ps -a"
      - "docker network inspect <network>"
      - "docker network stats"
    answer: 2
    explanation: |
      `docker network inspect <network>` prints detailed JSON including the IPAM subnet/gateway
      and the containers (with their IPs) connected to it. `docker network ls` only lists
      networks by name/driver/scope.
    ref: "concepts.md#managing-networks-and-connecting-containers"

  - id: docker-networking-037
    difficulty: advanced
    tags: [cli, subnet, ipam]
    question: |
      Why might you create a network with an explicit `--subnet`, e.g.
      `docker network create --subnet 10.10.0.0/24 appnet`?
    options:
      - "To control addressing and avoid clashing with corporate/VPN subnets that overlap Docker's default 172.x ranges"
      - "It makes containers start faster by pre-allocating every container's IP address at network-create time"
      - "It switches the network to the host driver so containers bind ports directly on the host with no NAT layer"
      - "It is mandatory because the embedded DNS resolver only functions on networks given an explicit subnet"
    answer: 0
    explanation: |
      Docker's default bridge ranges (172.17.x, 172.18.x, ...) sometimes collide with corporate
      or VPN networks, breaking routing. Specifying --subnet lets you pick a non-conflicting
      range. DNS works regardless on user-defined networks.
    ref: "concepts.md#managing-networks-and-connecting-containers"

  - id: docker-networking-038
    difficulty: beginner
    tags: [cli, prune]
    question: |
      What does `docker network prune` do?
    options:
      - "Deletes all networks including the built-in ones"
      - "Removes all unused (no containers attached) networks"
      - "Removes every container on the host along with its volumes"
      - "Resets the host's iptables NAT and filter chains"
    answer: 1
    explanation: |
      `docker network prune` removes user-defined networks that have no containers attached. It
      does not touch the built-in bridge/host/none networks or any network still in use.
    ref: "concepts.md#managing-networks-and-connecting-containers"

  - id: docker-networking-039
    difficulty: intermediate
    tags: [compose, default-network, dns]
    question: |
      By default, what does Docker Compose do about networking for a project?
    options:
      - "Puts every service in the host network namespace so they all share the host's ports directly"
      - "Attaches every service to the shared default bridge (docker0), which has no embedded DNS resolution"
      - "Creates one user-defined bridge network per project and attaches every service, so services resolve each other by service name"
      - "Requires you to hand-declare a network under the top-level networks: key or nothing will start at all"
    answer: 2
    explanation: |
      Compose automatically creates a per-project user-defined bridge (named <project>_default)
      and attaches all services. Because it's user-defined, the embedded DNS lets services
      reach each other by service name with no extra configuration.
    ref: "concepts.md#compose-networks"

  - id: docker-networking-040
    difficulty: intermediate
    tags: [compose, service-discovery, ports]
    question: |
      In a Compose file, a `web` service needs to call a `db` service. What hostname does it
      use, and does `db` need a `ports:` mapping for this internal call?
    options:
      - "localhost, and yes db must declare a ports: mapping to register itself for that call"
      - "host.docker.internal, which routes the call out to the host and back with no ports: needed"
      - "The container's full ID hash, and yes a ports: mapping is required for the lookup to resolve"
      - "The service name `db`, and no ports: is needed — publishing is only for host access"
    answer: 3
    explanation: |
      Compose puts both services on a shared user-defined network with embedded DNS, so web
      connects to hostname `db` on the DB's container port. `ports:` publishes to the host and
      is not required for service-to-service communication.
    ref: "concepts.md#compose-networks"

  - id: docker-networking-041
    difficulty: advanced
    tags: [compose, expose, ports]
    question: |
      In Compose, what is the difference between `ports:` and `expose:`?
    options:
      - "They are identical aliases and Compose treats either key exactly the same way"
      - "`expose:` publishes the mapping to the host while `ports:` merely documents the container port"
      - "`ports:` publishes to the host (host:container); `expose:` is documentation only and does not publish"
      - "Both keys must be declared together or the service's port stays completely unreachable"
    answer: 2
    explanation: |
      `ports:` maps host:container ports (real publishing, like -p). `expose:` only documents
      which container ports are used and does not publish them — mirroring the Dockerfile
      EXPOSE vs -p distinction.
    ref: "concepts.md#compose-networks"

  - id: docker-networking-042
    difficulty: advanced
    tags: [compose, segmentation, networks]
    question: |
      Given this Compose snippet, which statement is true?

          services:
            api:
              networks: [frontend, backend]
            db:
              networks: [backend]
          networks:
            frontend:
            backend:
    options:
      - "db can be reached from any container in the project regardless of the networks each one lists"
      - "All services implicitly join one shared default network, so the explicit lists are ignored"
      - "api cannot reach db at all because their networks lists are not byte-for-byte identical"
      - "api can reach db (both on backend), but any service only on frontend cannot reach db"
    answer: 3
    explanation: |
      A container reaches only peers on networks it shares. api is on backend with db, so api
      reaches db. A service placed only on frontend does not share a network with db, so it
      cannot reach db — the idiomatic way to isolate a database tier.
    ref: "concepts.md#compose-networks"

  - id: docker-networking-043
    difficulty: intermediate
    tags: [default-bridge, link, deprecated]
    question: |
      Before user-defined networks, how did people get name-based access between containers on
      the default bridge, and what is its status today?
    options:
      - "The `--link` flag, which is now legacy/deprecated and discouraged"
      - "The `--dns` flag, which registered container names and is still the recommended approach today"
      - "The `--mac-address` flag, which tied each name to a fixed hardware address for lookups"
      - "There was never any way to do it before user-defined networks existed"
    answer: 0
    explanation: |
      The legacy `--link` flag injected the linked container's name into /etc/hosts. It is
      deprecated and discouraged for security and flexibility reasons; user-defined networks
      with embedded DNS are the modern replacement.
    ref: "concepts.md#default-bridge-vs-user-defined-bridge"

  - id: docker-networking-044
    difficulty: intermediate
    tags: [dns, dynamic-ip, best-practice]
    question: |
      Why should you avoid hard-coding a container's IP address (e.g. 172.17.0.3) in
      application config?
    options:
      - "Raw IP literals are rejected by Docker's config parser and must always be hostnames"
      - "Container IPs can change across restarts; use the service/container name so the embedded DNS tracks the current IP"
      - "Referencing an IP directly disables the host's source-NAT masquerade for that container"
      - "Embedding an IP string bloats the final image because the value is baked into every layer"
    answer: 1
    explanation: |
      Container IPs are assigned dynamically and can change when containers restart or
      reschedule. On a user-defined network the embedded DNS maps names to the current IP, so
      connecting by name is robust while hard-coded IPs break.
    ref: "concepts.md#the-embedded-dns-resolver"

  - id: docker-networking-045
    difficulty: advanced
    tags: [docker-proxy, port-publishing]
    question: |
      What is the `docker-proxy` userland process associated with a published port?
    options:
      - "A full reverse proxy that replaces nginx and terminates HTTP for the container"
      - "A dedicated DNS server that answers container-name lookups for published services"
      - "The Docker daemon process itself, simply renamed once a port is published"
      - "A small helper process per published port that provides a fallback path (e.g. host-loopback hairpin) alongside the primary iptables DNAT"
    answer: 3
    explanation: |
      docker-proxy is a lightweight per-published-port process that handles cases where
      iptables hairpin/loopback forwarding doesn't apply (such as reaching a published port
      from the host itself). Modern Docker relies primarily on iptables, with docker-proxy as a
      fallback.
    ref: "concepts.md#iptables-and-nat-under-the-hood"

  - id: docker-networking-046
    difficulty: expert
    tags: [overlay, routing-mesh, swarm]
    question: |
      In Docker Swarm, what does the overlay routing mesh provide for a service published on a
      port?
    options:
      - "The published port is reachable on any swarm node and load-balanced to the service's tasks (via a virtual IP)"
      - "Nothing automatic; clients must target the exact node where each task happens to be scheduled"
      - "It disables the embedded DNS resolver so services must be reached by task IP instead"
      - "It requires the macvlan driver so every task gets a routable MAC on the physical LAN"
    answer: 0
    explanation: |
      Swarm's routing mesh makes a service's published port answerable on every node in the
      cluster and load-balances incoming connections across the service's tasks using a virtual
      IP, so clients can hit any node.
    ref: "concepts.md#overlay-networks-multi-host--swarm"

  - id: docker-networking-047
    difficulty: intermediate
    tags: [none, use-case, security]
    question: |
      Which scenario best fits `--network none`?
    options:
      - "A web server that must be reachable from other machines on the LAN over a published port"
      - "A batch job or untrusted workload that should have no network access at all"
      - "A database that several other containers must reach by its service name over DNS"
      - "A multi-host clustered service whose replicas span several Docker hosts"
    answer: 1
    explanation: |
      --network none removes all connectivity except loopback, making it ideal for
      network-isolated batch jobs or running untrusted code. Reachable web servers, named DB
      access, and multi-host clustering all require actual networking.
    ref: "concepts.md#none-network-driver"

  - id: docker-networking-048
    difficulty: advanced
    tags: [namespaces, exec, inspection]
    question: |
      Which command lets you inspect the isolated network stack (interfaces/IPs) that a
      running container sees?
    options:
      - "docker network stack <c>, which dumps the container's interface and route tables"
      - "docker inspect --net <c>, filtering the inspect output down to just the network stack"
      - "docker exec <c> ip addr"
      - "docker top <c>, which lists the container's interfaces alongside its processes"
    answer: 2
    explanation: |
      Running `docker exec <c> ip addr` (and `ip route`) inside the container shows the eth0 and
      routes in its network namespace — one end of the veth pair whose peer sits on docker0 in
      the host namespace.
    ref: "concepts.md#network-namespaces-the-isolation-mechanism"

  - id: docker-networking-049
    difficulty: intermediate
    tags: [egress, bridge, default]
    question: |
      For a container on the default bridge, which kind of traffic works out of the box without
      any extra flags?
    options:
      - "Outbound (egress) connections to the internet"
      - "Inbound connections initiated from other LAN hosts straight to the container"
      - "Name-based resolution of other containers through the embedded DNS resolver"
      - "Cross-host container traffic to peers running on a different Docker host"
    answer: 0
    explanation: |
      Outbound egress works immediately via NAT/masquerade. Inbound from outside the host needs
      -p publishing; name resolution needs a user-defined network; cross-host traffic needs
      overlay. So only egress is automatic.
    ref: "concepts.md#the-bridge-network-driver-default"

  - id: docker-networking-050
    difficulty: expert
    tags: [iptables-false, advanced, gotcha]
    question: |
      What happens if the Docker daemon is started with `--iptables=false`?
    options:
      - "Nothing changes; Docker keeps programming its NAT and forwarding rules exactly as before"
      - "Docker stops managing NAT/forwarding rules, so you must supply them yourself or container connectivity typically breaks"
      - "Containers automatically get faster networking because the packet-filtering hop is removed"
      - "It silently forces every container into host mode so they share the host's network stack"
    answer: 1
    explanation: |
      With --iptables=false Docker no longer programs the NAT/forwarding rules that make bridge
      networking and port publishing work. You then own those rules; without them, container
      connectivity generally breaks. It's an advanced escape hatch, not a default.
    ref: "concepts.md#iptables-and-nat-under-the-hood"

  - id: docker-networking-051
    difficulty: beginner
    tags: [ports, format, run]
    question: |
      Which `-p` form binds a container port to a specific protocol and host interface?
    options:
      - "-p 80, which pins TCP on the host's primary interface for container port 80"
      - "-p tcp, which selects the protocol and defaults the interface to loopback"
      - "-p 127.0.0.1:8080:80/tcp"
      - "-p 80->8080, an arrow form that binds the protocol to the host's main NIC"
    answer: 2
    explanation: |
      The full syntax is [hostIP:]hostPort:containerPort[/protocol]. So
      127.0.0.1:8080:80/tcp binds host loopback port 8080 to container port 80 over TCP — the
      only form here that pins both a protocol and a host interface. (`-p 80` alone is valid but
      publishes to a random host port; `-p tcp` and `-p 80->8080` are not valid syntax.)
    ref: "concepts.md#port-publishing--p-vs-expose"

  - id: docker-networking-052
    difficulty: advanced
    tags: [kubernetes, cni, cross-reference]
    question: |
      In Kubernetes (a separate orchestration layer), what performs the cross-node
      pod-networking role that Docker's overlay driver plays for Swarm?
    options:
      - "The Docker daemon directly, reusing its overlay VXLAN tunnels between the nodes"
      - "The kubelet's own iptables rules alone, with no separate networking component involved"
      - "The docker0 bridge on each node, stitched together across the cluster automatically"
      - "A CNI plugin (e.g. Calico, Cilium, Flannel)"
    answer: 3
    explanation: |
      Kubernetes delegates pod networking to CNI plugins such as Calico, Cilium, or Flannel,
      rather than Docker overlay. This is the "what replaced it" cross-reference — Kubernetes
      internals are covered in the separate kubernetes domain.
    ref: "concepts.md#overlay-networks-multi-host--swarm"
