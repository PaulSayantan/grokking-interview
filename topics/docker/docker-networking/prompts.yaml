topic: "Docker Networking"
domain: docker
topic_slug: docker-networking
schema: 1
pass: clarity-v1

# Where THIS topic settles the loop topic 6 left open (rule K1): what one container calls
# another when neither one's IP survives a restart, and which process answers that name.
resolves:
  anchor: "concepts.md#the-embedded-dns-resolver"

prompts:
  - id: docker-networking-p001
    ref: "concepts.md#network-namespaces-the-isolation-mechanism"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you have any container running, run `docker exec <c> ip addr` and then
      `docker exec <c> ip route`. Count the interfaces, and note which address the default
      route points at.
    hint: "Compare that gateway address with what `docker network inspect bridge` reports."
    answer_in: "concepts.md#network-namespaces-the-isolation-mechanism"

  - id: docker-networking-p002
    ref: "concepts.md#the-bridge-network-driver-default"
    kind: draw-the-boundary
    tier: A
    prompt: |
      That trace assumed both containers were on the same bridge. Two containers on two
      different user-defined bridges, both on one host: name the exact point a packet from
      A to B is stopped.
    hint: "There are two candidate stopping points. Only one of them is ever reached."
    answer_in: "concepts.md#how-a-frame-crosses-the-bridge-mac-learning-not-routing"

  - id: docker-networking-p003
    ref: "concepts.md#default-bridge-vs-user-defined-bridge"
    kind: refute
    tier: A
    prompt: |
      A colleague writes in review: "The default bridge has no name resolution because the
      `bridge` driver cannot do DNS." Name what is wrong with that diagnosis.
    hint: "Both networks in this section run the same driver."
    answer_in: "concepts.md#why-the-default-bridge-kept-the-old-behaviour"

  - id: docker-networking-p004
    ref: "concepts.md#the-embedded-dns-resolver"
    kind: predict-failure
    tier: A
    prompt: |
      Your API resolves `db` once at startup and reuses the address for the life of the
      process. Someone recreates the `db` container after a config change. Name the first
      thing that breaks, and when.
    hint: "Ask what the engine changes at attach time, and what it does not go back and tell anyone."
    answer_in: "concepts.md#the-embedded-dns-resolver"

  - id: docker-networking-p005
    ref: "concepts.md#port-publishing--p-vs-expose"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you start a container with `-p`, run `ss -ltnp | grep docker` on the host.
      Note which address the listener is bound to, and which process is holding it.
    hint: "You are looking at two separate facts: the bind address, and the process name."
    answer_in: "concepts.md#port-publishing--p-vs-expose"

  - id: docker-networking-p006
    ref: "concepts.md#localhost-inside-a-container-is-not-the-host"
    kind: predict-failure
    tier: A
    prompt: |
      Redis on the host is bound to `127.0.0.1:6379`. You add
      `--add-host=host.docker.internal:host-gateway` and point the container at
      `host.docker.internal:6379`. Name what still fails.
    hint: "The name now resolves. Ask what the resolved address is, and who is listening on it."
    answer_in: "concepts.md#localhost-inside-a-container-is-not-the-host"

  - id: docker-networking-p007
    ref: "concepts.md#iptables-and-nat-under-the-hood"
    kind: refute
    tier: A
    prompt: |
      A colleague runs `iptables -I DOCKER-USER -p tcp --dport 8080 -j DROP` and reports
      the published port is still reachable. The chain is the right one. Say why the rule
      matches nothing.
    hint: "Write down the packet's destination address and port at the moment it reaches that chain."
    answer_in: "concepts.md#where-the-chains-sit-why-ufw-never-sees-the-packet"

  - id: docker-networking-p008
    ref: "concepts.md#overlay-networks-multi-host--swarm"
    kind: name-the-price
    tier: C
    prompt: |
      This section derived a 1450-byte ceiling on an overlay's inner IP packet. Find what MTU
      the engine actually applies to an overlay network, and the option that changes it.
    hint: "Start from `docker network inspect` on a live overlay network, then look for the option name."
    answer_in: external
    search_hint: |
      The `com.docker.network.driver.mtu` network option in the Docker Engine networking
      reference, plus `docker network inspect` output on your own swarm. Check the engine
      version the page you are reading documents against the version you are running — this
      value is a driver default, not a spec requirement, so it is free to move between
      releases.
    success_criterion: |
      You can state the MTU value the engine applies to overlay interfaces on your engine
      version, name the option that overrides it, and say whether that value sits at or below
      the 1450-byte inner-IP ceiling this section derived from the 50-byte VXLAN wrapper. If
      your answer is a single number with no engine version attached, you have not finished.

  - id: docker-networking-p009
    ref: "concepts.md#macvlan-and-ipvlan"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you are on a cloud VM, create a macvlan network on it and try to reach a
      container on that network from another machine in the same subnet. Note where it stops.
    hint: "Compare what the container's own `ip addr` says with what the other machine's `arp -n` learns."
    answer_in: "concepts.md#where-it-breaks-the-host-the-cloud-and-the-count-of-mac-addresses"

  - id: docker-networking-p010
    ref: "concepts.md#managing-networks-and-connecting-containers"
    kind: predict-failure
    tier: A
    prompt: |
      Your VPN routes `172.18.0.0/16`. You create three networks with no `--subnet`, and
      containers on the third one can no longer reach an internal wiki that the host reaches
      fine. Name the mechanism.
    hint: "Read the container's routing table, not the host's."
    answer_in: "concepts.md#why-you-would-set-the-subnet-yourself"

cliffhanger:
  hook: |
    The resolver's mapping is written when the engine attaches a container to a network.
    That happens before the container's first process runs. So `getent hosts db` inside
    `api` answers correctly while nothing inside `db` is listening on 5432. Postgres is
    still initialising its data directory. Nothing is misconfigured, and `docker ps` lists
    both containers as up.

    Now bring both up at once with one command. `api` resolves `db`, opens a socket, and
    gets back:

        Error: connect ECONNREFUSED 172.18.0.3:5432

    The name was right. The address was right. The port was closed.
  teaser_questions:
    - "What does a tool that starts your containers for you actually promise about order, and what does it not?"
    - "How many things have to be true before a connection succeeds, and how many of them can a start order guarantee?"
  payoff:
    anchor: "concepts.md#depends_on-ordering-not-readiness"
    claim: |
      The destination section states that the dependency directive controls only the order
      in which containers are started and stopped, and that by default it waits for the
      dependency's container to be started rather than ready to serve traffic. It then names
      exactly this failure: a Postgres container can be running while the engine inside is
      still initializing and refusing connections, so the dependent service starts, tries to
      connect, and crashes.
