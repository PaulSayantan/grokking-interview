topic: "ENTRYPOINT vs CMD & Container Startup"
domain: docker
topic_slug: entrypoint-vs-cmd
schema: 1
pass: clarity-v1

# K1: topic 3's cliffhanger asked which process becomes PID 1 and who forwards SIGTERM.
resolves:
  anchor: "concepts.md#the-pid-1--sigterm-problem-with-shell-form"

prompts:
  - id: entrypoint-vs-cmd-p001
    ref: "concepts.md#cmd-the-default-command-and-arguments"
    kind: predict-failure
    tier: A
    prompt: |
      The Node API image ends in `CMD ["node", "server.js"]` and sets no `ENTRYPOINT`. A
      teammate runs `docker run api --inspect` to attach a debugger. Name what starts.
    hint: "Write out the final command line before deciding what the flag attaches to."
    answer_in: "concepts.md#cmd-the-default-command-and-arguments"

  - id: entrypoint-vs-cmd-p002
    ref: "concepts.md#entrypoint-the-containers-fixed-executable"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you use a CLI that ships as a container image, run `ls` inside it and see
      whether you get a directory listing or the tool's own help output.
    hint: "Help output means the image made a promise about its first element."
    answer_in: "concepts.md#entrypoint-the-containers-fixed-executable"

  - id: entrypoint-vs-cmd-p003
    ref: "concepts.md#exec-form-vs-shell-form"
    kind: refute
    tier: A
    prompt: |
      A reviewer writes: "dash execs the last command, so shell form still ends with my app at
      PID 1. Brackets are a style preference." Answer them.
    hint: "Name a string no shell can hand over, then say what the handover depends on."
    answer_in: "concepts.md#where-it-breaks-the-shell-that-steps-out-of-the-way"

  - id: entrypoint-vs-cmd-p004
    ref: "concepts.md#the-pid-1--sigterm-problem-with-shell-form"
    kind: draw-the-boundary
    tier: C
    prompt: |
      PID 1 is exempt from the default action of signals it has not handled. Find the signals
      that exemption does not cover.
    hint: "The exemption belongs to being PID 1 in a PID namespace, not to containers."
    answer_in: external
    search_hint: >
      The Linux man page `pid_namespaces(7)`, the part describing the init process of a PID
      namespace. It never says "container", so read it alongside `signal(7)`.
    success_criterion: >
      You can name the two signals the exemption never covers, say where they have to be sent
      from for that to hold, and explain from both halves why `docker stop`'s second stage
      always works on a process that ignored the first.

  - id: entrypoint-vs-cmd-p005
    ref: "concepts.md#overriding-cmd-and-entrypoint-at-runtime"
    kind: predict-failure
    tier: A
    prompt: |
      An image sets `ENTRYPOINT ["docker-entrypoint.sh"]` and `CMD ["postgres"]`. You run
      `docker run --entrypoint sh img -c 'psql -l'`. Name two things that did not happen.
    hint: "Write out what this one run's ENTRYPOINT and CMD actually are."
    answer_in: "concepts.md#what-it-costs-the-flag-that-replaces-the-binary-also-erases-the-defaults"

  - id: entrypoint-vs-cmd-p006
    ref: "concepts.md#entrypoint-scripts-and-exec-"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you open an official image's `docker-entrypoint.sh`, read its last line and
      check whether anything at all comes after it.
    hint: "Count the processes left alive if that last line were missing."
    answer_in: "concepts.md#entrypoint-scripts-and-exec-"

  - id: entrypoint-vs-cmd-p007
    ref: "concepts.md#graceful-shutdown-docker-stop-stopsignal-and-inittini"
    kind: name-the-price
    tier: D
    prompt: |
      A longer grace period buys every in-flight request a chance to finish. Name what it
      costs, in the units you would have to defend.
    hint: "Time one deploy, then multiply by the containers it replaces in sequence."
    answer_shape: >
      A credible answer prices three things: the longest in-flight request you are unwilling
      to drop, the per-container delay a rolling deploy pays in the worst case where every
      container uses its whole window, and what a `SIGKILL` mid-write costs in the specific
      store this service writes to. A number without all three is a guess.

cliffhanger:
  hook: |
    Every repair in this topic assumes a shell exists somewhere. Exec form against shell form
    is only a choice while `/bin/sh` is present. An entrypoint script's first line names a
    shell, and `exec "$@"` is a shell builtin. Even the debugging move,
    `docker exec -it <c> sh`, is a shell.

    The next topic asks you to ship an image with no shell in it at all. Not a smaller shell.
    None. So `CMD npm start` cannot run, and `RUN` cannot execute in the final stage. The
    container nobody can open a prompt inside is the one you are told to put in production.

    "Pick whichever form suits you" turns out to have a base-image boundary.
  teaser_questions:
    - "With no `/bin/sh` in the image, what is `ENTRYPOINT node server.js` at container start?"
    - "Where does `exec \"$@\"` go when there is no shell to run the script that calls it?"
    - "How do you look inside a running container you cannot get a shell into?"
  payoff:
    anchor: "concepts.md#distroless-images"
    claim: >-
      Read at line 308 of the un-rewritten destination: "No shell means `docker exec -it <c>
      sh` fails and shell-form `CMD`/`ENTRYPOINT` (`CMD npm start`) cannot work — you must use
      exec (vector) form". The same section's WARNING adds that `RUN` instructions are
      impossible in a distroless final stage because there is no shell.
