topic: "ENTRYPOINT vs CMD & Container Startup"
domain: docker
topic_slug: entrypoint-vs-cmd
version: 1
questions:
  - id: entrypoint-vs-cmd-001
    difficulty: beginner
    tags: [cmd, basics]
    question: |
      In `docker run myimg echo hi`, if the image was built with `CMD ["echo", "hello"]`,
      what happens to the CMD?
    options:
      - "The trailing args are appended, so it prints 'hello echo hi'"
      - "CMD is ignored and the container exits with an error"
      - "The trailing args replace CMD entirely, so it prints 'hi'"
      - "Both run in order: first 'hello' from CMD, then 'hi'"
    answer: 2
    explanation: |
      Arguments passed after the image name on `docker run` completely replace `CMD`. So
      `echo hi` runs and `echo hello` is discarded. This is the defining property of CMD:
      it is an easily-overridden default.
    ref: "concepts.md#cmd-the-default-command-and-arguments"
  - id: entrypoint-vs-cmd-002
    difficulty: beginner
    tags: [entrypoint, basics]
    question: |
      An image has `ENTRYPOINT ["echo", "hello"]`. What does `docker run myimg world`
      print?
    options:
      - "hello world"
      - "world"
      - "hello"
      - "an error: too many arguments"
    answer: 0
    explanation: |
      With ENTRYPOINT, `docker run` args are APPENDED, not replaced. So the command becomes
      `echo hello world` and it prints "hello world". The entrypoint binary always runs.
    ref: "concepts.md#entrypoint-the-containers-fixed-executable"
  - id: entrypoint-vs-cmd-003
    difficulty: beginner
    tags: [cmd, entrypoint, semantics]
    question: |
      What is the single most important behavioral difference between CMD and ENTRYPOINT
      with respect to `docker run` arguments?
    options:
      - "Args replace ENTRYPOINT but are appended to CMD"
      - "Args are ignored by both unless --entrypoint is used"
      - "Args only work with the shell form of either"
      - "Args replace CMD but are appended to ENTRYPOINT"
    answer: 3
    explanation: |
      `docker run` arguments REPLACE CMD entirely, but are APPENDED to ENTRYPOINT. That is
      why CMD is overridable defaults and ENTRYPOINT is the fixed executable.
    ref: "concepts.md#entrypoint-the-containers-fixed-executable"
  - id: entrypoint-vs-cmd-004
    difficulty: beginner
    tags: [exec-form, shell-form]
    question: |
      Which of these is the exec form of CMD?
    options:
      - "CMD nginx -g 'daemon off;'"
      - "CMD [\"nginx\", \"-g\", \"daemon off;\"]"
      - "CMD run nginx -g 'daemon off;'"
      - "CMD = nginx -g 'daemon off;'"
    answer: 1
    explanation: |
      Exec form is a JSON array of strings with double quotes. It runs the binary directly
      with no shell. Shell form is a bare string that gets wrapped in `/bin/sh -c`.
    ref: "concepts.md#exec-form-vs-shell-form"
  - id: entrypoint-vs-cmd-005
    difficulty: intermediate
    tags: [exec-form, shell-form, pid1]
    question: |
      With `ENTRYPOINT ["java", "-jar", "/app.jar"]` (exec form), what process is PID 1
      inside the container?
    options:
      - "/bin/sh"
      - "the docker daemon"
      - "java"
      - "an init process injected automatically"
    answer: 2
    explanation: |
      Exec form runs the binary directly, so `java` becomes PID 1. That means it receives
      signals like SIGTERM directly and can shut down gracefully. No shell is involved.
    ref: "concepts.md#exec-form-vs-shell-form"
  - id: entrypoint-vs-cmd-006
    difficulty: intermediate
    tags: [shell-form, pid1, signals]
    question: |
      With `ENTRYPOINT java -jar /app.jar` (shell form), what is PID 1 and why is that a
      problem for `docker stop`?
    options:
      - "java is PID 1, and the JVM's built-in SIGTERM handler means docker stop shuts it down cleanly"
      - "dockerd is PID 1 inside the container and swallows SIGTERM, so the signal never reaches java"
      - "java is PID 1 but ignores SIGTERM by design, so docker stop must escalate to a forced SIGKILL"
      - "/bin/sh is PID 1; it often doesn't forward SIGTERM to java, so java is SIGKILLed after the grace period"
    answer: 3
    explanation: |
      Shell form runs `/bin/sh -c "java -jar /app.jar"`, so the shell is PID 1 and java is
      its child. `docker stop` sends SIGTERM to PID 1 (the shell), which typically doesn't
      forward it, so java never shuts down gracefully and gets SIGKILLed after the timeout.
    ref: "concepts.md#the-pid-1--sigterm-problem-with-shell-form"
  - id: entrypoint-vs-cmd-007
    difficulty: intermediate
    tags: [entrypoint, cmd, combined]
    question: |
      Given `ENTRYPOINT ["nginx"]` and `CMD ["-g", "daemon off;"]`, what runs for a plain
      `docker run myimg`?
    options:
      - "nginx -g 'daemon off;'"
      - "nginx"
      - "-g daemon off;"
      - "/bin/sh -c nginx"
    answer: 0
    explanation: |
      With no runtime args, the effective command is ENTRYPOINT followed by CMD:
      `nginx -g "daemon off;"`. CMD supplies the default arguments to the entrypoint binary.
    ref: "concepts.md#entrypoint-and-cmd-combined-binary--default-args"
  - id: entrypoint-vs-cmd-008
    difficulty: intermediate
    tags: [entrypoint, cmd, combined, override]
    question: |
      Given `ENTRYPOINT ["nginx"]` and `CMD ["-g", "daemon off;"]`, what does
      `docker run myimg -t` execute?
    options:
      - "nginx -g 'daemon off;' -t"
      - "nginx -t"
      - "-t"
      - "nginx -g 'daemon off;'"
    answer: 1
    explanation: |
      Runtime args replace CMD but are appended to ENTRYPOINT. So `-t` replaces the default
      CMD (`-g "daemon off;"`), giving `nginx -t`. The entrypoint binary nginx still runs.
    ref: "concepts.md#entrypoint-and-cmd-combined-binary--default-args"
  - id: entrypoint-vs-cmd-009
    difficulty: intermediate
    tags: [entrypoint-script, exec, signals]
    question: |
      In an entrypoint script, why does the last line `exec "$@"` matter for graceful
      shutdown?
    options:
      - "It runs the command in the background so the script can keep monitoring it"
      - "It forces Docker to send SIGKILL instead of SIGTERM, skipping the grace period entirely on shutdown"
      - "It prevents the CMD from being overridden at runtime, locking in the arguments the script received"
      - "It replaces the shell process with the target program, so the app inherits PID 1 and receives SIGTERM"
    answer: 3
    explanation: |
      `exec` replaces the shell's process image with the target program (from `"$@"`), so
      the app becomes PID 1 and receives signals directly. Without `exec`, the script stays
      PID 1 and the app is a child that may never see SIGTERM.
    ref: "concepts.md#entrypoint-scripts-and-exec-"
  - id: entrypoint-vs-cmd-010
    difficulty: intermediate
    tags: [entrypoint-script, args]
    question: |
      In the entrypoint script line `exec "$@"`, what does `"$@"` expand to?
    options:
      - "The environment variables passed into the container with the -e flag"
      - "The name of the entrypoint script itself, the same as $0 in shell"
      - "The container's arguments — the CMD or the args passed to docker run"
      - "The list of ports the image declared with EXPOSE"
    answer: 2
    explanation: |
      `"$@"` expands to the positional arguments the script received — which are the CMD
      (e.g. `nginx -g "daemon off;"`) or whatever the user passed to `docker run`. That is
      what makes an entrypoint script generic: set up, then run whatever command it was given.
    ref: "concepts.md#entrypoint-scripts-and-exec-"
  - id: entrypoint-vs-cmd-011
    difficulty: intermediate
    tags: [override, entrypoint, cli]
    question: |
      How do you override the ENTRYPOINT of an image at `docker run` time to get a shell?
    options:
      - "docker run myimg --cmd sh"
      - "docker run --entrypoint sh -it myimg"
      - "docker run -it myimg && sh"
      - "docker run --override sh myimg"
    answer: 1
    explanation: |
      The `--entrypoint` flag replaces the image's ENTRYPOINT. `docker run --entrypoint sh
      -it myimg` runs a shell, which is the standard way to debug an image whose entrypoint
      is a long-running app.
    ref: "concepts.md#overriding-cmd-and-entrypoint-at-runtime"
  - id: entrypoint-vs-cmd-012
    difficulty: advanced
    tags: [exec-form, variable-expansion]
    question: |
      With `ENV PORT=8080` and `ENTRYPOINT ["node", "server.js", "--port", "$PORT"]`, what
      does the app receive as the port argument?
    options:
      - "the literal string $PORT"
      - "8080"
      - "an empty string"
      - "a build-time error, the variable is undefined"
    answer: 0
    explanation: |
      Exec form does NO shell processing, so `$PORT` is passed as the literal string
      "$PORT" — it is not expanded. To expand it you need a shell (shell form, `sh -c`), or
      you should read the env var inside the app instead.
    ref: "concepts.md#shell-form-variable-expansion-and-shell-features"
  - id: entrypoint-vs-cmd-013
    difficulty: beginner
    tags: [cmd, multiple]
    question: |
      A Dockerfile has three CMD lines. Which take effect?
    options:
      - "All three run one after another in sequence"
      - "The first CMD only; the later lines are ignored"
      - "Only the last CMD; the earlier ones are ignored"
      - "It is a build error to have more than one CMD"
    answer: 2
    explanation: |
      CMD (like ENTRYPOINT) is not additive. Only the last CMD in the Dockerfile takes
      effect; earlier ones are silently overridden.
    ref: "concepts.md#cmd-the-default-command-and-arguments"
  - id: entrypoint-vs-cmd-014
    difficulty: beginner
    tags: [cmd, entrypoint, requirement]
    question: |
      What happens if a Dockerfile (and its base image) define neither CMD nor ENTRYPOINT
      and you run the image with no command?
    options:
      - "It runs /bin/sh by default as a fallback shell"
      - "It runs the first binary found in PATH"
      - "It builds but the container exits 0 immediately"
      - "docker run errors because no command is specified"
    answer: 3
    explanation: |
      A container must have something to run. With no CMD, no ENTRYPOINT, and none inherited,
      `docker run` fails with an error that no command was specified. An image should define
      at least one of CMD or ENTRYPOINT.
    ref: "concepts.md#cmd-the-default-command-and-arguments"
  - id: entrypoint-vs-cmd-015
    difficulty: advanced
    tags: [shell-form, interaction-table, cmd]
    question: |
      With `ENTRYPOINT top -b` (shell form) and `CMD ["-c"]` (exec form), what actually
      runs?
    options:
      - "top -b -c  — CMD's -c appended to the entrypoint"
      - "/bin/sh -c 'top -b'  — CMD is ignored entirely"
      - "top -c  — shell form drops -b but keeps CMD's -c"
      - "/bin/sh -c '-c'  — only the CMD survives here"
    answer: 1
    explanation: |
      A shell-form ENTRYPOINT ignores CMD (and any docker run args) completely. The command
      is just `/bin/sh -c "top -b"`. This is a classic trap where CMD defaults silently do
      nothing.
    ref: "concepts.md#reference-the-entrypoint--cmd-interaction-table"
  - id: entrypoint-vs-cmd-016
    difficulty: advanced
    tags: [interaction-table, mixed-form, gotcha]
    question: |
      With `ENTRYPOINT ["exec_entry", "p1"]` (exec form) and `CMD exec_cmd p1_cmd` (shell
      form), what is the final command per the ENTRYPOINT×CMD table?
    options:
      - "exec_entry p1 /bin/sh -c exec_cmd p1_cmd"
      - "exec_entry p1 exec_cmd p1_cmd"
      - "/bin/sh -c exec_entry p1 exec_cmd p1_cmd"
      - "exec_entry exec_cmd p1 p1_cmd"
    answer: 0
    explanation: |
      A shell-form CMD is wrapped as `/bin/sh -c ...` and appended to the exec-form
      ENTRYPOINT, giving `exec_entry p1 /bin/sh -c exec_cmd p1_cmd`. This stray `/bin/sh -c`
      in the middle of the args is the mixed-form mangling bug — use exec form for both.
    ref: "concepts.md#reference-the-entrypoint--cmd-interaction-table"
  - id: entrypoint-vs-cmd-017
    difficulty: intermediate
    tags: [graceful-shutdown, docker-stop, signals]
    question: |
      What does `docker stop` do by default?
    options:
      - "Sends SIGKILL immediately with no grace period or chance to clean up"
      - "Sends SIGHUP and never escalates, relying on the app to exit on its own"
      - "Pauses the container's cgroup without sending any signal"
      - "Sends SIGTERM, waits a grace period (default 10s on Linux), then sends SIGKILL"
    answer: 3
    explanation: |
      `docker stop` sends SIGTERM (or the configured STOPSIGNAL) to PID 1, waits the grace
      period (10s default on Linux), and only then sends SIGKILL. `docker kill` by contrast
      sends SIGKILL immediately.
    ref: "concepts.md#graceful-shutdown-docker-stop-stopsignal-and-inittini"
  - id: entrypoint-vs-cmd-018
    difficulty: advanced
    tags: [stopsignal, graceful-shutdown]
    question: |
      What does the `STOPSIGNAL` Dockerfile instruction control?
    options:
      - "How long docker stop waits, in seconds, before escalating to SIGKILL"
      - "Which signal docker stop sends to the container (instead of the default SIGTERM)"
      - "Whether the container automatically restarts after it has been stopped"
      - "The signal the container process sends back to the host kernel on exit"
    answer: 1
    explanation: |
      STOPSIGNAL sets the image's stop signal, changing which signal `docker stop` sends
      (e.g. `STOPSIGNAL SIGQUIT` for nginx fast shutdown). The grace period is controlled
      separately by `docker stop -t`. `--stop-signal` / `docker stop -s` override it.
    ref: "concepts.md#graceful-shutdown-docker-stop-stopsignal-and-inittini"
  - id: entrypoint-vs-cmd-019
    difficulty: advanced
    tags: [init, tini, zombies, signals]
    question: |
      What is the purpose of `docker run --init`?
    options:
      - "It initializes and pre-populates any named volumes from the image contents before the container starts"
      - "It runs any database initialization scripts placed in /docker-entrypoint-initdb.d before the app starts"
      - "It injects a tiny init process (tini) as PID 1 that forwards signals and reaps zombie processes"
      - "It resets the container's writable filesystem layer back to the image's initial state on each restart"
    answer: 2
    explanation: |
      `--init` runs a minimal init (tini) as PID 1 that forwards signals to your app and
      reaps zombie (orphaned) children. It's useful when your main process isn't a proper
      init — e.g. a shell script or an app that spawns children but doesn't reap them.
    ref: "concepts.md#graceful-shutdown-docker-stop-stopsignal-and-inittini"
  - id: entrypoint-vs-cmd-020
    difficulty: intermediate
    tags: [entrypoint, cmd, base-image]
    question: |
      Your base image defines `CMD ["bash"]`. In your Dockerfile you add
      `ENTRYPOINT ["myapp"]` but no CMD. What is the effective CMD?
    options:
      - "empty — setting ENTRYPOINT resets the inherited CMD to empty"
      - "bash, inherited unchanged from the base image's CMD instruction"
      - "myapp, since the ENTRYPOINT value is copied into CMD as well"
      - "bash myapp, the base CMD appended after your new ENTRYPOINT"
    answer: 0
    explanation: |
      Setting ENTRYPOINT in a Dockerfile resets any inherited CMD to empty. If you still
      want default arguments, you must redefine CMD after your ENTRYPOINT.
    ref: "concepts.md#entrypoint-the-containers-fixed-executable"
  - id: entrypoint-vs-cmd-021
    difficulty: intermediate
    tags: [exec-form, json, gotcha]
    question: |
      What happens with `CMD ['echo', 'hi']` (single quotes) in a Dockerfile?
    options:
      - "It runs echo hi via proper exec form as intended, since Docker accepts both quote styles"
      - "It's invalid JSON, so Docker treats it as shell form and runs /bin/sh -c \"['echo', 'hi']\""
      - "It's a hard build error that fails the image because the JSON array is malformed"
      - "Single and double quotes are treated as equivalent inside exec-form arrays, so nothing changes"
    answer: 1
    explanation: |
      The exec-form array must be valid JSON, which requires double quotes. Single quotes
      make it invalid JSON, so Docker falls back to shell form and literally runs
      `/bin/sh -c "['echo', 'hi']"` — almost never what you wanted.
    ref: "concepts.md#exec-form-vs-shell-form"
  - id: entrypoint-vs-cmd-022
    difficulty: beginner
    tags: [cmd, use-case]
    question: |
      When is CMD-only (no ENTRYPOINT) the right choice?
    options:
      - "When the container must always run one fixed binary that users are never allowed to swap out"
      - "When you need Docker to forward SIGTERM through a wrapper shell to a long-lived child process"
      - "When you require shell variable expansion of env vars in the command at container runtime"
      - "When you want users to be able to fully replace the command, e.g. a general-purpose base/tool image"
    answer: 3
    explanation: |
      CMD-only is ideal for general-purpose images (base images, ad-hoc tool images) where
      users should be able to override the entire command, e.g. `docker run ubuntu ls`.
      ENTRYPOINT is for when the container is a fixed executable.
    ref: "concepts.md#cmd-the-default-command-and-arguments"
  - id: entrypoint-vs-cmd-023
    difficulty: intermediate
    tags: [exec-form, shell-features]
    question: |
      Which capability do you LOSE by using exec form instead of shell form?
    options:
      - "Shell features like $VAR expansion, pipes, &&, and glob expansion"
      - "The ability to pass any command-line arguments to the container process at all"
      - "The ability to run the container detached in the background with the -d flag"
      - "Support for referencing earlier stages in multi-stage Dockerfile builds"
    answer: 0
    explanation: |
      Exec form runs the binary directly with no shell, so shell features — variable
      expansion, pipes, `&&`, `;`, globbing — are not processed and are passed as literal
      strings. Shell form provides them (at the cost of the shell being PID 1).
    ref: "concepts.md#exec-form-vs-shell-form"
  - id: entrypoint-vs-cmd-024
    difficulty: advanced
    tags: [shell-form, exec, variable-expansion]
    question: |
      You need `$PORT` expanded at runtime AND your app to be PID 1 for graceful shutdown.
      Which ENTRYPOINT achieves both?
    options:
      - "ENTRYPOINT [\"node\", \"server.js\", \"--port\", \"$PORT\"]"
      - "ENTRYPOINT node server.js --port $PORT"
      - "ENTRYPOINT exec node server.js --port $PORT"
      - "ENTRYPOINT $PORT node server.js"
    answer: 2
    explanation: |
      `ENTRYPOINT exec node server.js --port $PORT` uses shell form (so the shell expands
      `$PORT`), then `exec` replaces the shell with node so node becomes PID 1 and receives
      signals. Equivalently `["sh","-c","exec node server.js --port $PORT"]`.
    ref: "concepts.md#shell-form-variable-expansion-and-shell-features"
  - id: entrypoint-vs-cmd-025
    difficulty: intermediate
    tags: [override, cmd, cli]
    question: |
      Image has `ENTRYPOINT ["python", "/app.py"]` and `CMD ["--port", "8080"]`. What does
      `docker run myimg --port 9000` run?
    options:
      - "python /app.py --port 8080 --port 9000"
      - "--port 9000"
      - "python /app.py --port 8080"
      - "python /app.py --port 9000"
    answer: 3
    explanation: |
      Runtime args replace CMD but are appended to ENTRYPOINT. `--port 9000` replaces the
      default CMD `--port 8080`, so the container runs `python /app.py --port 9000`.
    ref: "concepts.md#overriding-cmd-and-entrypoint-at-runtime"
  - id: entrypoint-vs-cmd-026
    difficulty: advanced
    tags: [entrypoint, override, cli, details]
    question: |
      Which statement about `docker run --entrypoint` is correct?
    options:
      - "It can only set the binary to exec (no sh -c is used) and typically resets CMD"
      - "It always wraps the given command in /bin/sh -c automatically before executing it"
      - "It appends its value to the existing ENTRYPOINT tokens rather than replacing them"
      - "It can only be used with images that define no ENTRYPOINT of their own already"
    answer: 0
    explanation: |
      `--entrypoint` replaces the entrypoint and can only set the executable to run directly
      (no shell wrapping). Any tokens after the image name become the new CMD; the previous
      CMD is typically reset.
    ref: "concepts.md#overriding-cmd-and-entrypoint-at-runtime"
  - id: entrypoint-vs-cmd-027
    difficulty: advanced
    tags: [pid1, signals, kernel]
    question: |
      Why can a process that relies on the DEFAULT action for SIGTERM fail to terminate
      when it runs as PID 1 (even in exec form)?
    options:
      - "PID 1 runs in a separate PID namespace where incoming termination signals are silently blocked"
      - "Docker deliberately strips SIGTERM from any process running as PID 1 for container safety reasons"
      - "The kernel does not apply default signal dispositions to PID 1 unless the process installs its own handler"
      - "PID 1 always runs with SIGTERM masked by dockerd until the grace period fully elapses"
    answer: 2
    explanation: |
      The kernel gives PID 1 special treatment: default signal actions (like terminate on
      SIGTERM) are NOT applied unless the process installs an explicit handler. Apps with
      real handlers are fine; otherwise use an init (tini / --init).
    ref: "concepts.md#the-pid-1--sigterm-problem-with-shell-form"
  - id: entrypoint-vs-cmd-028
    difficulty: intermediate
    tags: [entrypoint-script, quoting]
    question: |
      Why use `exec "$@"` (double-quoted) rather than `exec $@` in an entrypoint script?
    options:
      - "The double quotes make the command run measurably faster by skipping re-parsing"
      - "Double quotes preserve argument boundaries, keeping args with spaces intact"
      - "Without the surrounding double quotes the exec builtin is disabled by the shell"
      - "There is no real difference between the two; it is purely a stylistic choice"
    answer: 1
    explanation: |
      `"$@"` preserves each argument as a separate word, so arguments containing spaces stay
      intact. Bare `$@` (or `$*`) re-splits on whitespace and mangles such arguments.
    ref: "concepts.md#entrypoint-scripts-and-exec-"
  - id: entrypoint-vs-cmd-029
    difficulty: intermediate
    tags: [graceful-shutdown, deploy, scenario]
    question: |
      A team reports every deploy takes ~10 extra seconds per container and drops in-flight
      requests. The Dockerfile ends with `ENTRYPOINT java -jar /app.jar`. Most likely cause?
    options:
      - "Shell-form ENTRYPOINT means java isn't PID 1, never gets SIGTERM, and is SIGKILLed after the 10s grace period"
      - "The container image is simply too large, so tearing it down and unmounting layers takes ten seconds"
      - "docker stop has been misconfigured with a fixed timeout that forces it to always wait ten full seconds"
      - "The JVM cannot handle the SIGTERM signal at all and must be stopped with an explicit SIGKILL instead"
    answer: 0
    explanation: |
      Shell form makes `/bin/sh` PID 1; SIGTERM goes to the shell, not java. java never
      drains, so after the 10s grace period it's SIGKILLed — hence the delay and dropped
      requests. Fix: exec form `["java","-jar","/app.jar"]` (plus a SIGTERM handler).
    ref: "concepts.md#the-pid-1--sigterm-problem-with-shell-form"
  - id: entrypoint-vs-cmd-030
    difficulty: beginner
    tags: [shell-form, mechanism]
    question: |
      When you use shell form, what does Docker actually execute?
    options:
      - "The command directly as the only process"
      - "bash --login -c \"<your command>\""
      - "The command inside a new pseudo-terminal"
      - "/bin/sh -c \"<your command string>\""
    answer: 3
    explanation: |
      Shell form wraps the command string as `/bin/sh -c "<command>"`. That shell becomes
      PID 1 and your program runs as its child, which is what causes the signal-forwarding
      issues.
    ref: "concepts.md#exec-form-vs-shell-form"
  - id: entrypoint-vs-cmd-031
    difficulty: advanced
    tags: [interaction-table, no-entrypoint]
    question: |
      With no ENTRYPOINT and `CMD echo hi` (shell form), what runs?
    options:
      - "echo hi (direct exec)"
      - "/bin/sh -c echo hi"
      - "error, not allowed"
      - "/bin/sh -c ENTRYPOINT echo hi"
    answer: 1
    explanation: |
      With no ENTRYPOINT, CMD behaves per its own form. Shell-form CMD runs
      `/bin/sh -c "echo hi"`. (Exec-form CMD would exec `echo hi` directly.)
    ref: "concepts.md#reference-the-entrypoint--cmd-interaction-table"
  - id: entrypoint-vs-cmd-032
    difficulty: intermediate
    tags: [compose, entrypoint, cmd]
    question: |
      In a Docker Compose service, which keys map to ENTRYPOINT and CMD respectively?
    options:
      - "command and entrypoint"
      - "exec and args"
      - "entrypoint and command"
      - "run and cmd"
    answer: 2
    explanation: |
      In Compose, `entrypoint:` overrides the image's ENTRYPOINT and `command:` overrides
      its CMD. (Note Kubernetes inverts the naming: `command:` = ENTRYPOINT, `args:` = CMD.)
    ref: "concepts.md#overriding-cmd-and-entrypoint-at-runtime"
  - id: entrypoint-vs-cmd-033
    difficulty: advanced
    tags: [kubernetes, mapping, cross-reference]
    question: |
      In Kubernetes, a Pod container's `command:` and `args:` fields correspond to which
      Docker concepts?
    options:
      - "command = CMD, args = ENTRYPOINT"
      - "both override CMD only"
      - "both override ENTRYPOINT only"
      - "command = ENTRYPOINT, args = CMD"
    answer: 3
    explanation: |
      Kubernetes `command:` overrides the image's ENTRYPOINT and `args:` overrides its CMD.
      The naming inversion (Docker calls them ENTRYPOINT/CMD) is a frequent point of
      confusion.
    ref: "concepts.md#overriding-cmd-and-entrypoint-at-runtime"
  - id: entrypoint-vs-cmd-034
    difficulty: intermediate
    tags: [entrypoint-script, official-images]
    question: |
      Official images like postgres and nginx use a `docker-entrypoint.sh` that does setup
      and ends with `exec "$@"`. What role does CMD play in that pattern?
    options:
      - "CMD is entirely unused in this pattern; the entrypoint script hardcodes the command it launches"
      - "CMD provides the actual app command that the script runs via exec \"$@\""
      - "CMD silently overrides and replaces the entrypoint script whenever both are present in the image"
      - "CMD lists the environment variables the entrypoint script should export before it starts the app"
    answer: 1
    explanation: |
      ENTRYPOINT is the setup script; CMD holds the real command (e.g. `postgres`). The
      script runs its init logic, then `exec "$@"` hands off to CMD (or docker run args) as
      PID 1. Users can override CMD to run a different command through the same setup.
    ref: "concepts.md#entrypoint-scripts-and-exec-"
  - id: entrypoint-vs-cmd-035
    difficulty: advanced
    tags: [interaction-table, exec-exec]
    question: |
      With `ENTRYPOINT ["exec_entry", "p1"]` and `CMD ["exec_cmd", "p1_cmd"]` (both exec
      form) and no runtime args, the final command is:
    options:
      - "exec_entry p1 exec_cmd p1_cmd"
      - "exec_cmd p1_cmd"
      - "/bin/sh -c exec_entry p1"
      - "exec_entry p1"
    answer: 0
    explanation: |
      Exec-form ENTRYPOINT + exec-form CMD cleanly concatenates:
      `exec_entry p1 exec_cmd p1_cmd`. This is the recommended combination — no shell, args
      passed cleanly.
    ref: "concepts.md#reference-the-entrypoint--cmd-interaction-table"
  - id: entrypoint-vs-cmd-036
    difficulty: beginner
    tags: [docker-kill, signals]
    question: |
      How does `docker kill` differ from `docker stop` by default?
    options:
      - "docker kill sends a graceful SIGTERM first, while docker stop sends SIGKILL right away"
      - "They are effectively identical; both send SIGTERM and then escalate after the grace period"
      - "docker kill sends SIGKILL immediately; docker stop sends SIGTERM then SIGKILL after a grace period"
      - "docker kill only pauses the container's processes rather than terminating them outright"
    answer: 2
    explanation: |
      `docker kill` sends SIGKILL immediately by default (no grace period), forcibly ending
      the container. `docker stop` is graceful: SIGTERM first, then SIGKILL only after the
      timeout.
    ref: "concepts.md#graceful-shutdown-docker-stop-stopsignal-and-inittini"
  - id: entrypoint-vs-cmd-037
    difficulty: advanced
    tags: [mixed-form, best-practice, scenario]
    question: |
      A Dockerfile has `ENTRYPOINT ["python", "app.py"]` and `CMD --verbose --config /c.yml`
      (shell form). A user runs `docker run myimg`. What goes wrong?
    options:
      - "Nothing goes wrong; it correctly runs python app.py --verbose --config /c.yml as intended"
      - "CMD is wrapped as /bin/sh -c, so python receives '/bin/sh -c --verbose --config /c.yml' as args, mangling them"
      - "The container refuses to start because Docker rejects the mixed exec-form and shell-form combination"
      - "python becomes a child of the wrapping shell and never receives forwarded SIGTERM signals"
    answer: 1
    explanation: |
      Mixing exec-form ENTRYPOINT with shell-form CMD inserts `/bin/sh -c` into the
      arguments: `python app.py /bin/sh -c "--verbose --config /c.yml"`. The args arrive
      mangled. Use exec form for CMD too: `CMD ["--verbose","--config","/c.yml"]`.
    ref: "concepts.md#entrypoint-and-cmd-combined-binary--default-args"
  - id: entrypoint-vs-cmd-038
    difficulty: intermediate
    tags: [signals, app-responsibility, graceful-shutdown]
    question: |
      Even with exec form (app is PID 1), the container still gets SIGKILLed after the grace
      period on `docker stop`. What is the most likely remaining cause?
    options:
      - "The image is missing a HEALTHCHECK, so Docker cannot tell the app is ready to receive SIGTERM"
      - "docker stop cannot deliver signals to a PID 1 that was started via exec form rather than a shell"
      - "STOPSIGNAL is left unset, so docker stop sends no signal at all and simply waits out the timeout"
      - "The app has no SIGTERM handler (or doesn't finish draining within the grace window)"
    answer: 3
    explanation: |
      Being PID 1 only guarantees the app RECEIVES SIGTERM. It must also handle it — install
      a handler that drains and exits within the grace window. If it ignores SIGTERM or
      takes too long, it's still SIGKILLed. Increase the window with `docker stop -t` if
      needed.
    ref: "concepts.md#graceful-shutdown-docker-stop-stopsignal-and-inittini"
  - id: entrypoint-vs-cmd-039
    difficulty: intermediate
    tags: [override, cmd, debug]
    question: |
      An image runs a web server via `CMD ["nginx","-g","daemon off;"]` with no ENTRYPOINT.
      How do you start it with a shell instead to poke around?
    options:
      - "docker run --entrypoint sh is required here because a CMD-only image cannot be overridden at runtime"
      - "docker exec myimg sh, run against the image before the container has actually started up"
      - "docker run -it myimg sh"
      - "You must rebuild the image with a shell CMD, since a running container's command is fixed"
    answer: 2
    explanation: |
      With no ENTRYPOINT, trailing args replace CMD. `docker run -it myimg sh` swaps the
      nginx CMD for a shell. (If there WERE an ENTRYPOINT, you'd need `--entrypoint sh`.)
    ref: "concepts.md#overriding-cmd-and-entrypoint-at-runtime"
  - id: entrypoint-vs-cmd-040
    difficulty: beginner
    tags: [exec-form, preferred]
    question: |
      Which form is generally recommended for ENTRYPOINT in production images?
    options:
      - "Exec form, so the app is PID 1 and receives signals for graceful shutdown"
      - "Shell form, because wrapping the app in /bin/sh gives more runtime flexibility"
      - "Either form works identically; the choice has no meaningful effect on signal handling"
      - "Neither; use a RUN instruction instead to launch the long-running production process"
    answer: 0
    explanation: |
      Exec form is preferred for ENTRYPOINT: the app becomes PID 1, receives SIGTERM
      directly, and shuts down gracefully. Shell form should be reserved for cases needing
      shell features, ideally with `exec`.
    ref: "concepts.md#exec-form-vs-shell-form"
  - id: entrypoint-vs-cmd-041
    difficulty: advanced
    tags: [entrypoint-script, privilege-drop, scenario]
    question: |
      An entrypoint script does `chown -R app /data` then `su app -c "myserver"` (without
      exec). What signal-handling problem remains?
    options:
      - "None; su transparently forwards SIGTERM to myserver, so shutdown is already clean"
      - "The chown -R on /data resets the process's signal mask and breaks SIGTERM delivery"
      - "myserver becomes PID 0, an invalid process id that the kernel refuses to signal"
      - "The script (and su) stay in the process tree above myserver, so SIGTERM to PID 1 isn't cleanly delivered to myserver"
    answer: 3
    explanation: |
      Without `exec`, the shell script remains PID 1 and `su` spawns myserver as a
      grandchild; SIGTERM to PID 1 isn't cleanly forwarded. Better: `exec gosu app myserver`
      (or `exec su-exec ...`) so myserver becomes PID 1 and receives signals directly.
    ref: "concepts.md#entrypoint-scripts-and-exec-"
  - id: entrypoint-vs-cmd-042
    difficulty: intermediate
    tags: [interaction-table, no-cmd, exec-entrypoint]
    question: |
      With `ENTRYPOINT ["myapp"]` (exec form) and no CMD and no runtime args, what runs?
    options:
      - "error, not allowed"
      - "/bin/sh -c myapp"
      - "myapp"
      - "myapp with an empty string argument"
    answer: 2
    explanation: |
      Exec-form ENTRYPOINT alone simply runs `myapp` as PID 1. No CMD is needed; CMD would
      only add default arguments. (The 'error, not allowed' case is when there's NO
      ENTRYPOINT and NO CMD at all.)
    ref: "concepts.md#reference-the-entrypoint--cmd-interaction-table"
  - id: entrypoint-vs-cmd-043
    difficulty: advanced
    tags: [shell, sh-vs-bash, default-shell]
    question: |
      In `ENTRYPOINT some_command` (shell form), which shell runs it, and how do you change
      it to bash?
    options:
      - "It uses /bin/sh -c; change it with the SHELL instruction, e.g. SHELL [\"/bin/bash\",\"-c\"]"
      - "It uses /bin/bash by default, so no change is needed to get bash behavior here"
      - "It uses the login shell configured for the current USER; switch it by changing USER"
      - "It uses zsh whenever zsh is installed in the image, and falls back to sh otherwise"
    answer: 0
    explanation: |
      Shell form uses `/bin/sh -c` by default. The `SHELL` instruction changes the shell
      used for subsequent shell-form RUN/CMD/ENTRYPOINT, e.g. `SHELL ["/bin/bash","-c"]`.
    ref: "concepts.md#exec-form-vs-shell-form"
  - id: entrypoint-vs-cmd-044
    difficulty: intermediate
    tags: [zombies, init, scenario]
    question: |
      Your PID 1 app spawns short-lived worker subprocesses and you notice a growing number
      of <defunct> (zombie) processes. What's the fix?
    options:
      - "Switch the ENTRYPOINT to shell form so /bin/sh becomes PID 1 and reaps the workers"
      - "Run with --init (or use tini) so a proper init reaps orphaned children"
      - "Add more CPU and memory to the container so the defunct workers get cleaned up faster"
      - "Use docker kill instead of docker stop so the zombie children are force-terminated"
    answer: 1
    explanation: |
      Zombie children accumulate when PID 1 doesn't reap them (a duty of a real init).
      `docker run --init` (or baking in tini) provides an init as PID 1 that reaps zombies
      and forwards signals.
    ref: "concepts.md#graceful-shutdown-docker-stop-stopsignal-and-inittini"
  - id: entrypoint-vs-cmd-045
    difficulty: advanced
    tags: [shell-form, signals, ignores-args]
    question: |
      Why does a shell-form ENTRYPOINT ignore both CMD and any `docker run` command-line
      arguments?
    options:
      - "Because Docker deliberately disables all argument passing whenever a shell wraps the entrypoint"
      - "Because CMD is only compatible with exec-form ENTRYPOINT and is dropped in shell form"
      - "Because the entire shell-form string is passed as one argument to /bin/sh -c, leaving no slot for appended args"
      - "Because /bin/sh strips any extra positional arguments for security when invoked with -c"
    answer: 2
    explanation: |
      Shell form becomes `/bin/sh -c "<the whole entrypoint string>"`. There's no mechanism
      to append CMD or run-time args into that fixed `sh -c` invocation, so they're ignored.
      This matches the identical middle column of the ENTRYPOINT×CMD table.
    ref: "concepts.md#the-pid-1--sigterm-problem-with-shell-form"
  - id: entrypoint-vs-cmd-046
    difficulty: intermediate
    tags: [env, exec-form, best-practice]
    question: |
      What is the cleanest way to make a containerized app use a runtime-provided PORT
      value set via `docker run -e PORT=9000`?
    options:
      - "Read the PORT environment variable inside the application code"
      - "Put $PORT directly in an exec-form ENTRYPOINT array"
      - "Only shell form can access env vars, so you must avoid exec form entirely"
      - "Bake the port into the image at build time with ARG"
    answer: 0
    explanation: |
      Environment variables are passed into the container regardless of ENTRYPOINT form.
      Having the app read `PORT` (e.g. `process.env.PORT`) avoids needing a shell to expand
      it and keeps the exec-form / PID-1 benefits.
    ref: "concepts.md#shell-form-variable-expansion-and-shell-features"
  - id: entrypoint-vs-cmd-047
    difficulty: intermediate
    tags: [override, entrypoint, cmd, scenario]
    question: |
      Image: `ENTRYPOINT ["/entrypoint.sh"]`, `CMD ["server"]`. You run
      `docker run --entrypoint /bin/sh myimg -c "env"`. What executes?
    options:
      - "/entrypoint.sh server, since --entrypoint only adds to the existing script and CMD"
      - "/bin/sh server, keeping the original CMD but swapping in the new entrypoint binary"
      - "/entrypoint.sh /bin/sh -c env, appending the new tokens after the original entrypoint"
      - "/bin/sh -c env"
    answer: 3
    explanation: |
      `--entrypoint /bin/sh` replaces the entrypoint and resets the effective command; the
      tokens after the image (`-c "env"`) become the new args. Result: `/bin/sh -c env` —
      the original entrypoint script and `server` CMD are bypassed.
    ref: "concepts.md#overriding-cmd-and-entrypoint-at-runtime"
  - id: entrypoint-vs-cmd-048
    difficulty: beginner
    tags: [entrypoint, use-case]
    question: |
      You're building an image that wraps the `curl` tool so users run
      `docker run mycurl https://example.com`. Which is the right design?
    options:
      - "CMD [\"curl\"] with no ENTRYPOINT, so the URL is appended cleanly as a curl parameter"
      - "ENTRYPOINT [\"curl\"] so the URL arg is appended as a parameter to curl"
      - "ENTRYPOINT curl (shell form) so signals are forwarded correctly to the curl process"
      - "Neither; use RUN curl at build time so the fetch is baked into the image layer"
    answer: 1
    explanation: |
      When the container IS a tool, use `ENTRYPOINT ["curl"]`. Trailing `docker run` args
      (the URL) are appended as curl's parameters, and users can't accidentally replace the
      executable. CMD-only would let args replace curl entirely.
    ref: "concepts.md#entrypoint-the-containers-fixed-executable"
