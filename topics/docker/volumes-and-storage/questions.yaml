topic: "Volumes, Bind Mounts & Data Persistence"
domain: docker
topic_slug: volumes-and-storage
version: 1
questions:
  - id: volumes-and-storage-001
    difficulty: beginner
    tags: [writable-layer, persistence, lifecycle]
    question: |
      You run a container, write a file to it, then run `docker rm` on the
      container. What happens to that file?
    options:
      - "It persists on the host under /var/lib/docker/volumes"
      - "It is lost — it lived in the container's writable layer, which is deleted on rm"
      - "It is committed back into the image automatically"
      - "It moves to an anonymous volume that survives removal"
    answer: 1
    explanation: |
      Files written to a path not covered by a mount go to the container's ephemeral
      writable layer, which is created at start and destroyed when the container is
      removed. Nothing is auto-persisted or committed.
    ref: "concepts.md#the-ephemeral-writable-layer"

  - id: volumes-and-storage-002
    difficulty: beginner
    tags: [writable-layer, stop-vs-rm]
    question: |
      A teammate says "stopping a container loses its data." For a container with
      no volumes, when is the writable-layer data actually lost?
    options:
      - "On docker stop"
      - "On docker pause"
      - "Only on docker rm (removal), not on stop"
      - "Whenever the host reboots"
    answer: 2
    explanation: |
      `docker stop` keeps the writable layer — `docker start` brings the same data back.
      The layer is only destroyed when the container is removed (`docker rm`,
      `docker run --rm`, or `docker compose down`).
    ref: "concepts.md#the-ephemeral-writable-layer"

  - id: volumes-and-storage-003
    difficulty: beginner
    tags: [persistence, databases, best-practice]
    question: |
      What is the recommended way to persist a database's data files when running
      it in a container?
    options:
      - "Rely on the container's writable layer and never run docker rm"
      - "docker commit the container after each write"
      - "Store the data inside the image with a COPY instruction"
      - "Mount a named volume at the database's data directory"
    answer: 3
    explanation: |
      Persistent state must live outside the container's writable layer. A named
      volume gives durable storage decoupled from the container lifecycle and bypasses
      copy-on-write for better write performance.
    ref: "concepts.md#named-volumes-docker-managed-storage"

  - id: volumes-and-storage-004
    difficulty: intermediate
    tags: [copy-on-write, storage-driver, performance]
    question: |
      When a containerized process modifies one byte of a large file that exists only
      in a lower read-only image layer, what does the copy-on-write storage driver do?
    options:
      - "Modifies the file in place in the shared image layer"
      - "Copies the entire file up into the writable layer, then applies the change there"
      - "Redirects the write to /dev/null and warns"
      - "Automatically stores the change in a volume"
    answer: 1
    explanation: |
      Union/overlay filesystems are copy-on-write: modifying a file from a lower layer
      triggers a full copy-up of that file into the writable layer before the write is
      applied. This first-write cost is why write-heavy workloads should use volumes.
    ref: "concepts.md#copy-on-write-and-why-databases-must-not-use-the-container-layer"

  - id: volumes-and-storage-005
    difficulty: intermediate
    tags: [copy-on-write, databases, performance, durability]
    question: |
      Why is running a write-heavy database on the container's writable layer a bad
      idea? Choose the most complete answer.
    options:
      - "Only because the data is lost on docker rm"
      - "Only because union filesystems are slow for random writes"
      - "Both: data is destroyed on rm AND copy-on-write/union-fs overhead hurts random-write/fsync performance"
      - "It isn't a problem; the writable layer is optimized for databases"
    answer: 2
    explanation: |
      Two independent reasons: durability (the writable layer dies with the container)
      and performance (copy-on-write plus union-filesystem overhead is poor for the
      random-write, fsync-heavy access pattern of a database). A volume fixes both.
    ref: "concepts.md#copy-on-write-and-why-databases-must-not-use-the-container-layer"

  - id: volumes-and-storage-006
    difficulty: intermediate
    tags: [volumes, direct-io, performance]
    question: |
      How does I/O to a Docker volume differ from I/O to the container's writable layer?
    options:
      - "A volume bypasses the storage driver and writes directly to the host filesystem"
      - "A volume always routes through the union/overlay copy-on-write layer"
      - "A volume compresses all writes before storing them"
      - "There is no difference; both use the same code path"
    answer: 0
    explanation: |
      Volume I/O bypasses the storage driver's union/CoW machinery and goes directly to
      the host filesystem (or a volume driver), giving more predictable performance —
      one of the main reasons volumes are preferred for data.
    ref: "concepts.md#named-volumes-docker-managed-storage"

  - id: volumes-and-storage-007
    difficulty: beginner
    tags: [volumes, storage-location]
    question: |
      On a Linux host, where does the default `local` driver store a named volume's data?
    options:
      - "/etc/docker/volumes/<name>"
      - "/var/lib/docker/volumes/<name>/_data"
      - "/tmp/docker/<name>"
      - "In the container's /var/lib directory"
    answer: 1
    explanation: |
      Local-driver volumes live under /var/lib/docker/volumes/<name>/_data. You can see
      the exact path in `docker volume inspect` as the Mountpoint, though you should
      access volumes via the API rather than depending on that path.
    ref: "concepts.md#named-volumes-docker-managed-storage"

  - id: volumes-and-storage-008
    difficulty: beginner
    tags: [volumes, preferred, portability]
    question: |
      Which is a reason volumes are preferred over bind mounts for persistent
      application data?
    options:
      - "Volumes can only be mounted read-only, which is safer"
      - "Volumes depend on a specific host directory layout existing"
      - "Volumes are stored inside the image so they ship with it"
      - "Volumes are Docker-managed and portable — no dependency on host path structure"
    answer: 3
    explanation: |
      Volumes are managed by Docker at a Docker-owned path, so they don't depend on a
      particular host directory existing, are easy to back up, support drivers, and are
      decoupled from any single container's lifecycle.
    ref: "concepts.md#named-volumes-docker-managed-storage"

  - id: volumes-and-storage-009
    difficulty: beginner
    tags: [bind-mounts, use-cases, dev]
    question: |
      Which use case is the classic fit for a bind mount rather than a volume?
    options:
      - "Storing a production database's data files"
      - "Mounting your local source-code directory into a dev container for live reload"
      - "Persisting data that must follow a container across hosts"
      - "Keeping secrets in RAM only"
    answer: 1
    explanation: |
      Bind mounts map an arbitrary host path in, so they shine when a human needs to
      read/edit the files on the host — source code in development or config files.
      They are host-path dependent and thus not portable for production data.
    ref: "concepts.md#bind-mounts"

  - id: volumes-and-storage-010
    difficulty: intermediate
    tags: [bind-mounts, gotcha, missing-path]
    question: |
      You run `docker run -v /srv/appconfig.yml:/app/config.yml myimg` but the host
      file /srv/appconfig.yml does not exist. What happens with the `-v` syntax?
    options:
      - "Docker creates /srv/appconfig.yml as an empty directory and bind-mounts it"
      - "Docker errors out because the source is missing"
      - "Docker creates an empty file at that path"
      - "Docker falls back to a named volume"
    answer: 0
    explanation: |
      With `-v`, a missing bind-mount source is auto-created as a directory. So you get
      an empty directory mounted where you expected a file, causing confusing errors.
      `--mount` errors instead (unless bind-create-src is set), catching the typo.
    ref: "concepts.md#bind-mounts"

  - id: volumes-and-storage-011
    difficulty: advanced
    tags: [bind-mounts, obscuring, gotcha]
    question: |
      An image has files at /app/public. You start the container with a bind mount
      `--mount type=bind,src=./empty,dst=/app/public` where ./empty is empty. What does
      the container see at /app/public?
    options:
      - "The image's files merged with the empty host dir"
      - "The image's original files, because bind mounts copy them in"
      - "An empty directory — the bind mount obscures the image's existing files"
      - "An error, because the target already has files"
    answer: 2
    explanation: |
      Bind mounts obscure (hide) whatever was in the container directory for as long as
      they're mounted — like mounting a USB drive over /mnt. Unlike volumes, they do not
      copy the image's existing files in.
    ref: "concepts.md#bind-mounts"

  - id: volumes-and-storage-012
    difficulty: intermediate
    tags: [tmpfs, in-memory, persistence]
    question: |
      Which statement about a tmpfs mount is correct?
    options:
      - "It persists data to /var/lib/docker/volumes after the container stops"
      - "It can be shared between multiple containers like a named volume"
      - "It works on Linux, Windows, and macOS hosts identically"
      - "It stores data in host memory and is removed when the container stops"
    answer: 3
    explanation: |
      tmpfs mounts keep data in the host's memory, are never intended to persist, are
      removed when the container stops, cannot be shared between containers, and are
      Linux-only.
    ref: "concepts.md#tmpfs-mounts-in-memory"

  - id: volumes-and-storage-013
    difficulty: intermediate
    tags: [tmpfs, use-cases, secrets]
    question: |
      What is a good use case for a tmpfs mount?
    options:
      - "Long-term storage of a database's data directory"
      - "Sharing files between two running containers"
      - "Holding sensitive data (e.g. secrets) that should never be written to disk"
      - "Seeding a container with default files from the image"
    answer: 2
    explanation: |
      tmpfs is ideal for sensitive or high-volume non-persistent data you don't want on
      disk. It cannot persist or be shared, so it's wrong for databases, inter-container
      sharing, or seeding.
    ref: "concepts.md#tmpfs-mounts-in-memory"

  - id: volumes-and-storage-014
    difficulty: intermediate
    tags: [tmpfs, options, size]
    question: |
      In `--mount type=tmpfs,dst=/cache,tmpfs-size=64m`, what does `tmpfs-size` control,
      and what is its default if omitted?
    options:
      - "Disk quota; default 1 GB"
      - "Memory size limit for the mount; default 50% of host RAM"
      - "Number of inodes; default unlimited"
      - "Swap size; default equals host RAM"
    answer: 1
    explanation: |
      tmpfs-size caps the amount of memory the tmpfs may use (in bytes/units). If not
      set, it defaults to 50% of the host's total RAM. tmpfs-mode sets the octal
      permissions (default 1777).
    ref: "concepts.md#tmpfs-mounts-in-memory"

  - id: volumes-and-storage-015
    difficulty: beginner
    tags: [comparison, decision]
    question: |
      Which mount type is NOT persisted after the container is removed?
    options:
      - "Named volume"
      - "Bind mount"
      - "A volume backed by an NFS driver"
      - "tmpfs mount"
    answer: 3
    explanation: |
      tmpfs lives in RAM and is gone when the container stops. Named volumes persist
      independently of the container, and bind mounts persist because the data is on the
      host filesystem.
    ref: "concepts.md#choosing-volumes-vs-bind-mounts-vs-tmpfs"

  - id: volumes-and-storage-016
    difficulty: intermediate
    tags: [comparison, first-mount-copy]
    question: |
      Which mount type copies the image directory's existing contents into the mount on
      first use (when the mount is empty)?
    options:
      - "Bind mount"
      - "tmpfs mount"
      - "Named/anonymous volume"
      - "A read-only bind mount specifically"
    answer: 2
    explanation: |
      Only volumes seed themselves from the image directory's existing files on first
      mount of an empty volume. Bind mounts and tmpfs obscure the image contents instead.
    ref: "concepts.md#choosing-volumes-vs-bind-mounts-vs-tmpfs"

  - id: volumes-and-storage-017
    difficulty: beginner
    tags: [lifecycle, docker-volume-cli]
    question: |
      Which command removes all volumes that are not currently referenced by any
      container?
    options:
      - "docker volume prune"
      - "docker volume clean"
      - "docker volume rm --all"
      - "docker system flush"
    answer: 0
    explanation: |
      `docker volume prune` removes dangling (unused) volumes. `docker volume rm` removes
      a specific named volume but fails if a container still references it.
    ref: "concepts.md#volume-lifecycle-and-the-docker-volume-commands"

  - id: volumes-and-storage-018
    difficulty: intermediate
    tags: [lifecycle, rm, anonymous]
    question: |
      Running `docker rm <container>` on a container that used a named volume and an
      anonymous volume does what to those volumes?
    options:
      - "Deletes both the named and anonymous volumes"
      - "Deletes only the named volume"
      - "Deletes only the anonymous volume"
      - "Deletes neither; both volumes remain"
    answer: 3
    explanation: |
      Plain `docker rm` leaves all volumes intact. To also remove the container's
      anonymous volumes you must pass `-v` (`docker rm -v`). Named volumes are never
      auto-removed by container removal.
    ref: "concepts.md#volume-lifecycle-and-the-docker-volume-commands"

  - id: volumes-and-storage-019
    difficulty: intermediate
    tags: [lifecycle, rm-in-use]
    question: |
      Why might `docker volume rm app-data` fail?
    options:
      - "Volumes can never be deleted once created"
      - "A container (even a stopped one) still references the volume"
      - "The volume is empty"
      - "You must stop the Docker daemon first"
    answer: 1
    explanation: |
      `docker volume rm` refuses to delete a volume that is still referenced by any
      container, running or stopped. Remove the referencing containers first (or use
      `docker rm -v`), then delete the volume.
    ref: "concepts.md#volume-lifecycle-and-the-docker-volume-commands"

  - id: volumes-and-storage-020
    difficulty: intermediate
    tags: [mount-syntax, missing-source]
    question: |
      For a BIND mount whose source path does not exist, how do `-v` and `--mount`
      differ by default?
    options:
      - "Both create the missing path automatically"
      - "Both error out"
      - "-v auto-creates the path as a directory; --mount errors unless bind-create-src is set"
      - "--mount auto-creates it; -v errors"
    answer: 2
    explanation: |
      `-v` silently creates a missing bind-mount source as a directory (a common
      footgun). `--mount` treats a missing source as an error unless you add
      bind-create-src, making it the safer, more explicit choice.
    ref: "concepts.md#-v---volume-vs---mount-syntax"

  - id: volumes-and-storage-021
    difficulty: advanced
    tags: [mount-syntax, features]
    question: |
      Which capability REQUIRES the `--mount` syntax and cannot be expressed with the
      bare `-v` form?
    options:
      - "Mounting a named volume at a path"
      - "Making a mount read-only"
      - "Mounting the current working directory"
      - "Passing volume-driver options (e.g. NFS opts) or mounting a volume subpath"
    answer: 3
    explanation: |
      You must use `--mount` (or `docker volume create` opts) to pass volume-driver
      options, mount a subdirectory of a volume, or mount into a Swarm service. Basic
      read-only and simple mounts work with either syntax.
    ref: "concepts.md#-v---volume-vs---mount-syntax"

  - id: volumes-and-storage-022
    difficulty: intermediate
    tags: [mount-syntax, volume-vs-bind]
    question: |
      With the `-v` syntax, how does Docker decide whether `foo:/data` is a named volume
      or a bind mount?
    options:
      - "A source containing a slash (/) is a bind mount; a bare name is a named volume"
      - "It always treats it as a bind mount"
      - "It always treats it as a named volume"
      - "It depends on whether the target directory exists"
    answer: 0
    explanation: |
      In `-v`, if the source looks like a path (contains a `/`) it's a bind mount;
      a bare token like `foo` is a named volume. `--mount type=...` removes this
      ambiguity by stating intent explicitly.
    ref: "concepts.md#-v---volume-vs---mount-syntax"

  - id: volumes-and-storage-023
    difficulty: intermediate
    tags: [anonymous-volumes, dockerfile-volume]
    question: |
      A Dockerfile contains `VOLUME /var/lib/mysql` and you run the image without
      specifying a mount for that path. What is created?
    options:
      - "Nothing; the instruction is ignored at runtime"
      - "A named volume called mysql"
      - "A fresh anonymous volume for that path, per container"
      - "A bind mount to the host's /var/lib/mysql"
    answer: 2
    explanation: |
      A Dockerfile VOLUME instruction causes a new anonymous volume to be created for
      that path each time a container starts (unless the operator overrides the mount).
      These accumulate as dangling volumes.
    ref: "concepts.md#anonymous-vs-named-volumes"

  - id: volumes-and-storage-024
    difficulty: beginner
    tags: [anonymous-volumes, named-volumes]
    question: |
      What most distinguishes a named volume from an anonymous volume?
    options:
      - "Anonymous volumes are stored in RAM"
      - "Named volumes have a human-chosen name; anonymous ones get a random ID and are hard to identify later"
      - "Named volumes cannot be shared between containers"
      - "Anonymous volumes bypass copy-on-write while named ones don't"
    answer: 1
    explanation: |
      Both are Docker-managed local volumes; the difference is identity. Named volumes
      carry a chosen name (easy to reuse/back up/reason about); anonymous volumes get a
      random 64-hex ID and tend to pile up as dangling volumes.
    ref: "concepts.md#anonymous-vs-named-volumes"

  - id: volumes-and-storage-025
    difficulty: intermediate
    tags: [anonymous-volumes, disk-usage, gotcha]
    question: |
      A host is slowly running out of disk and `docker volume ls` shows dozens of
      64-hex-named volumes. What most likely caused them?
    options:
      - "Named volumes declared in Compose"
      - "tmpfs mounts spilling to disk"
      - "Read-only bind mounts"
      - "Anonymous volumes (from VOLUME or unnamed -v) left behind by removed containers"
    answer: 3
    explanation: |
      Anonymous volumes from Dockerfile VOLUME instructions or unnamed `-v /path` mounts
      persist after containers are removed (unless `docker rm -v` was used), becoming
      dangling volumes. `docker volume prune` reclaims them.
    ref: "concepts.md#anonymous-vs-named-volumes"

  - id: volumes-and-storage-026
    difficulty: advanced
    tags: [first-mount-copy, volume-nocopy]
    question: |
      You mount an EMPTY named volume at nginx's /usr/share/nginx/html (which ships
      default files in the image). What is in the volume after the container starts?
    options:
      - "The image's default files, copied into the volume on first mount"
      - "It stays empty; the image files are obscured"
      - "An error, because the target is non-empty"
      - "Only a .keep placeholder file"
    answer: 0
    explanation: |
      When an empty volume is mounted over a non-empty image directory, Docker copies the
      image's existing files into the volume on first mount. You can disable this with the
      volume-nocopy option.
    ref: "concepts.md#populating-a-volume-from-image-content-first-mount-copy"

  - id: volumes-and-storage-027
    difficulty: advanced
    tags: [first-mount-copy, non-empty-volume]
    question: |
      The first-mount copy of image files into a volume happens under which condition?
    options:
      - "Every time the container starts, overwriting the volume"
      - "Only when the volume is empty at mount time"
      - "Only for bind mounts"
      - "Only when volume-nocopy is set"
    answer: 1
    explanation: |
      The seed-from-image copy occurs only when the volume is empty. If the volume
      already contains data, its contents win and nothing is copied. volume-nocopy
      disables the behavior entirely.
    ref: "concepts.md#populating-a-volume-from-image-content-first-mount-copy"

  - id: volumes-and-storage-028
    difficulty: intermediate
    tags: [first-mount-copy, bind-vs-volume]
    question: |
      A developer adds `-v ./html:/usr/share/nginx/html` (bind mount) expecting to keep
      nginx's default page, but the page 404s. Why?
    options:
      - "Bind mounts copy the image files, but only after a restart"
      - "nginx requires a named volume to serve files"
      - "The bind mount obscured the image's default files; bind mounts do not seed from the image"
      - "The volume-nocopy option was implicitly set"
    answer: 2
    explanation: |
      Only volumes seed themselves from the image directory. A bind mount obscures the
      image's default files, so an empty host ./html leaves nginx with nothing to serve.
    ref: "concepts.md#populating-a-volume-from-image-content-first-mount-copy"

  - id: volumes-and-storage-029
    difficulty: beginner
    tags: [read-only, mounts]
    question: |
      How do you mount a named volume `cfg` read-only at /etc/app using `-v`?
    options:
      - "-v cfg:/etc/app:readonly=true"
      - "-v --readonly cfg:/etc/app"
      - "-v ro:cfg:/etc/app"
      - "-v cfg:/etc/app:ro"
    answer: 3
    explanation: |
      With `-v`, append `:ro` (or `:readonly`) as the options field:
      `-v cfg:/etc/app:ro`. With `--mount`, add `,readonly` (or `,ro`). Inspect shows
      "RW": false for a read-only mount.
    ref: "concepts.md#read-only-mounts"

  - id: volumes-and-storage-030
    difficulty: intermediate
    tags: [read-only, sharing]
    question: |
      Can the same volume be mounted read-write into one container and read-only into
      another at the same time?
    options:
      - "No; a volume's mode is fixed at creation"
      - "Yes; the read-only/read-write mode is per-mount, not per-volume"
      - "Only if the volume uses the NFS driver"
      - "Only in Docker Compose, not with docker run"
    answer: 1
    explanation: |
      Read-only vs read-write is a property of each mount, so one container can mount a
      volume rw while another mounts the same volume ro simultaneously.
    ref: "concepts.md#read-only-mounts"

  - id: volumes-and-storage-031
    difficulty: advanced
    tags: [read-only, read-only-rootfs, security]
    question: |
      Which pattern pairs well with read-only mounts to harden a container?
    options:
      - "A read-only root filesystem (--read-only), where only explicit volumes/tmpfs are writable"
      - "Running with --privileged"
      - "Disabling all volumes"
      - "Mounting the Docker socket into the container"
    answer: 0
    explanation: |
      Read-only mounts complement `--read-only` on the root filesystem: the rootfs is
      immutable and only declared volumes or tmpfs mounts are writable, shrinking the
      attack surface. --privileged and mounting the Docker socket do the opposite.
    ref: "concepts.md#read-only-mounts"

  - id: volumes-and-storage-032
    difficulty: intermediate
    tags: [sharing, volumes]
    question: |
      What is the standard way for two running containers to share the same files?
    options:
      - "Use docker cp repeatedly between them"
      - "Use tmpfs in both containers"
      - "Commit one container and rebuild the other"
      - "Mount the same named volume into both containers"
    answer: 3
    explanation: |
      Mounting the same named volume into multiple containers lets them share data
      concurrently. tmpfs cannot be shared, and docker cp is a manual one-off copy.
    ref: "concepts.md#sharing-volumes-between-containers"

  - id: volumes-and-storage-033
    difficulty: advanced
    tags: [sharing, concurrency, databases]
    question: |
      Two containers mount the same volume. What does Docker guarantee about concurrent
      writes?
    options:
      - "Docker serializes writes to prevent corruption"
      - "Docker provides shared access but NOT write safety; the apps must coordinate"
      - "Only one container can ever write; the other is forced read-only"
      - "Writes are automatically merged with last-writer-wins"
    answer: 1
    explanation: |
      Docker only provides concurrent access, not concurrency control. Applications must
      coordinate/lock. Most databases assume exclusive access to their data dir, so never
      point two DB containers at one volume.
    ref: "concepts.md#sharing-volumes-between-containers"

  - id: volumes-and-storage-034
    difficulty: advanced
    tags: [sharing, volumes-from]
    question: |
      What does `docker run --rm --volumes-from writer -v "$(pwd)":/backup busybox tar cvf /backup/data.tar /data` do?
    options:
      - "Creates a new volume named writer"
      - "Deletes the writer container's volumes after archiving"
      - "Attaches all of the 'writer' container's mounts into a throwaway container to back them up via tar"
      - "Converts the writer's bind mounts into named volumes"
    answer: 2
    explanation: |
      `--volumes-from` copies all mounts of the source container into the new one, so a
      throwaway busybox can tar the volume's data to a bind-mounted backup dir without
      needing to know the volume names.
    ref: "concepts.md#sharing-volumes-between-containers"

  - id: volumes-and-storage-035
    difficulty: intermediate
    tags: [permissions, uid, bind-mounts]
    question: |
      A container runs as non-root USER 1001 and gets "permission denied" writing to its
      bind-mounted data directory. What is the most likely cause?
    options:
      - "Bind mounts are always read-only"
      - "Docker requires root for all bind mounts"
      - "The volume driver rejected the write"
      - "The host directory is owned by a different UID than the container process (bind mounts don't remap ownership)"
    answer: 3
    explanation: |
      Bind mounts preserve the host's numeric ownership/permissions. If the host dir is
      owned by a UID the container process (1001) can't write, you get permission denied.
      Fix by chown-ing the host path, using --user, or aligning the image's USER.
    ref: "concepts.md#permissions-and-uidgid-issues"

  - id: volumes-and-storage-036
    difficulty: advanced
    tags: [permissions, volumes, first-mount]
    question: |
      Why does a non-root container often write fine to a fresh NAMED volume but fail on
      a bind mount at the same path?
    options:
      - "Named volumes are always world-writable"
      - "On first mount of an empty volume, Docker initializes the volume's ownership/perms to match the image directory; bind mounts keep host ownership"
      - "Bind mounts run as root, volumes as the container user"
      - "Named volumes ignore the USER instruction"
    answer: 1
    explanation: |
      When an empty named volume is first mounted, Docker sets its ownership/permissions
      from the image's directory, so a well-built image "just works." Bind mounts instead
      inherit the host directory's ownership, which may not match the container UID.
    ref: "concepts.md#permissions-and-uidgid-issues"

  - id: volumes-and-storage-037
    difficulty: expert
    tags: [permissions, rootless, user-namespaces]
    question: |
      In rootless Docker or with user-namespace remapping, why can mounted files look
      like they're owned by an unexpected UID on the host?
    options:
      - "Container UIDs are remapped to a different host UID range, shifting on-disk ownership"
      - "Docker randomizes file ownership for security"
      - "Rootless Docker disables all volume writes"
      - "User namespaces only affect networking, not files"
    answer: 0
    explanation: |
      User-namespace remapping (and rootless mode) maps container UID/GIDs to a distinct
      host range, so a file owned by UID 0 inside the container appears owned by a high
      offset UID on the host. This interacts with mount permissions (see docker-security).
    ref: "concepts.md#permissions-and-uidgid-issues"

  - id: volumes-and-storage-038
    difficulty: advanced
    tags: [volume-drivers, nfs, remote]
    question: |
      What do volume drivers (beyond the default `local`) enable?
    options:
      - "Storing volumes inside the image"
      - "Encrypting the container's writable layer"
      - "Placing a volume on network/remote storage such as NFS or cloud storage"
      - "Automatically converting bind mounts to volumes"
    answer: 2
    explanation: |
      Volume drivers/plugins let a volume live on remote or networked storage (NFS,
      cloud block/file), so data isn't tied to one host and can follow containers across
      hosts, at the cost of network latency and a backend dependency.
    ref: "concepts.md#volume-drivers-nfs-cloud-plugins"

  - id: volumes-and-storage-039
    difficulty: advanced
    tags: [volume-drivers, nfs, syntax]
    question: |
      Given: `docker volume create --driver local --opt type=nfs --opt o=addr=10.0.0.5,rw --opt device=:/exports/appdata nfs-data`. What is this doing?
    options:
      - "Creating a tmpfs volume in RAM"
      - "Creating a volume backed by an NFS export using the local driver's mount options"
      - "Bind-mounting a host NFS client directory"
      - "Creating an anonymous volume"
    answer: 1
    explanation: |
      The built-in local driver can mount network filesystems via mount options: type=nfs
      plus the server addr and the exported device path produce a volume whose data lives
      on the NFS server rather than local disk.
    ref: "concepts.md#volume-drivers-nfs-cloud-plugins"

  - id: volumes-and-storage-040
    difficulty: intermediate
    tags: [compose, volumes, persistence]
    question: |
      In Docker Compose, what does `docker compose down` (without flags) do to named
      volumes declared under the top-level `volumes:` key?
    options:
      - "Deletes them along with the containers"
      - "Converts them to bind mounts"
      - "Marks them external"
      - "Keeps them; you must pass -v/--volumes to delete them"
    answer: 3
    explanation: |
      `docker compose down` removes containers and networks but preserves named volumes.
      Use `docker compose down -v` (or --volumes) to also remove the project's declared
      volumes — a frequent source of "why is my data still/gone" confusion.
    ref: "concepts.md#volumes-in-docker-compose"

  - id: volumes-and-storage-041
    difficulty: intermediate
    tags: [compose, external]
    question: |
      In a Compose file, what does declaring a volume with `external: true` mean?
    options:
      - "The volume is stored outside /var/lib/docker on purpose"
      - "The volume is exposed to the public internet"
      - "Compose references a volume created outside this project and won't create or delete it"
      - "The volume uses an external (non-local) driver by default"
    answer: 2
    explanation: |
      `external: true` tells Compose the volume already exists (created elsewhere), so
      Compose neither creates it on `up` nor removes it on `down -v`. It just attaches to
      the existing volume.
    ref: "concepts.md#volumes-in-docker-compose"

  - id: volumes-and-storage-042
    difficulty: intermediate
    tags: [compose, bind-mount, config]
    question: |
      In the Compose service `volumes:` list, what is `./initdb:/docker-entrypoint-initdb.d:ro`?
    options:
      - "A read-only bind mount of the host ./initdb directory into the container"
      - "A named volume mounted read-only"
      - "A tmpfs mount"
      - "An anonymous volume with nocopy"
    answer: 0
    explanation: |
      A source that is a relative/absolute path (./initdb) is a bind mount; `:ro` makes
      it read-only. This is the common pattern for injecting config or seed scripts from
      the host.
    ref: "concepts.md#volumes-in-docker-compose"

  - id: volumes-and-storage-043
    difficulty: intermediate
    tags: [backup, volumes, tar]
    question: |
      What is the portable pattern to back up a Docker volume named db-data to a local
      tar file?
    options:
      - "Copy /var/lib/docker/volumes/db-data/_data with scp from another machine"
      - "Run a throwaway container that mounts the volume plus a bind mount and tars the data"
      - "docker volume export db-data > db-data.tar"
      - "docker commit the volume into an image"
    answer: 1
    explanation: |
      Because a volume is just a directory Docker manages, the portable backup is a
      helper container mounting the volume (often :ro) and a bind mount for the archive,
      then tar. This works regardless of driver, unlike reading the local path directly.
    ref: "concepts.md#backing-up-and-restoring-volumes"

  - id: volumes-and-storage-044
    difficulty: advanced
    tags: [backup, databases, consistency]
    question: |
      Why is `tar`-ing a live database's volume directly a risky backup strategy?
    options:
      - "tar cannot handle files larger than 2 GB"
      - "Volumes cannot be read while mounted"
      - "You may capture an inconsistent on-disk state; quiesce the DB or use its own dump tool"
      - "It corrupts the image layers"
    answer: 2
    explanation: |
      A running database may have in-flight writes and buffered state, so a raw tar can
      capture an inconsistent snapshot. Stop/quiesce the DB or use a logical dump
      (pg_dump, mongodump) for a consistent backup.
    ref: "concepts.md#backing-up-and-restoring-volumes"

  - id: volumes-and-storage-045
    difficulty: beginner
    tags: [decision, databases, volumes]
    question: |
      For a production PostgreSQL container, which storage choice is most appropriate for
      its data directory?
    options:
      - "The container writable layer"
      - "A tmpfs mount"
      - "A read-only bind mount"
      - "A named volume (or a networked volume / managed DB)"
    answer: 3
    explanation: |
      Persistent DB data needs a named volume: durable across container recreation,
      bypasses copy-on-write, and is backup-able. tmpfs is non-persistent, the writable
      layer dies on rm, and read-only can't be written to.
    ref: "concepts.md#choosing-volumes-vs-bind-mounts-vs-tmpfs"

  - id: volumes-and-storage-046
    difficulty: expert
    tags: [dockerfile-volume, gotcha, build]
    question: |
      A Dockerfile has `VOLUME /data` on one line and, on a LATER line,
      `RUN echo seed > /data/seed.txt`. Why might /data/seed.txt be missing at runtime?
    options:
      - "Once VOLUME declares /data, writes to it in later build steps are discarded"
      - "RUN cannot write to any directory"
      - "echo output is buffered and lost"
      - "The file is created but hidden by the storage driver"
    answer: 0
    explanation: |
      After a VOLUME instruction freezes a path, changes made to that path by subsequent
      build steps are discarded — the layer's contents there are not preserved. This is a
      classic reason to declare VOLUME late or avoid it and let operators choose mounts.
    ref: "concepts.md#anonymous-vs-named-volumes"

  - id: volumes-and-storage-047
    difficulty: intermediate
    tags: [docker-desktop, volumes, performance]
    question: |
      On Docker Desktop (Mac/Windows), why do named volumes generally outperform bind
      mounts to the host for I/O-heavy workloads?
    options:
      - "Bind mounts are disabled on Docker Desktop"
      - "Volumes are cached in the GPU"
      - "Bind mounts always run read-only there"
      - "Volumes live inside the Linux VM, avoiding the host<->VM filesystem sharing overhead of bind mounts"
    answer: 3
    explanation: |
      Docker Desktop runs the daemon in a Linux VM. Named volumes reside inside that VM,
      so I/O is native, whereas host bind mounts must cross the host-to-VM filesystem
      sharing boundary, which is comparatively slow.
    ref: "concepts.md#named-volumes-docker-managed-storage"

  - id: volumes-and-storage-048
    difficulty: intermediate
    tags: [mount-syntax, equivalence]
    question: |
      Which `--mount` form is equivalent to `-v app-data:/data:ro`?
    options:
      - "--mount type=bind,src=app-data,dst=/data,readonly"
      - "--mount type=volume,src=app-data,dst=/data,readonly"
      - "--mount type=tmpfs,dst=/data,readonly"
      - "--mount volume=app-data,path=/data,ro=true"
    answer: 1
    explanation: |
      `app-data` is a bare name, so it is a named volume: type=volume, src=app-data,
      dst=/data, plus readonly. The bind and tmpfs forms describe different mount types,
      and the last option is not valid syntax.
    ref: "concepts.md#-v---volume-vs---mount-syntax"

  - id: volumes-and-storage-049
    difficulty: advanced
    tags: [first-mount-copy, volume-nocopy]
    question: |
      You want a mounted named volume to start EMPTY even though the image dir has files.
      Which option achieves this?
    options:
      - "readonly"
      - "bind-create-src"
      - "volume-nocopy (e.g. -v name:/path:nocopy)"
      - "tmpfs-mode"
    answer: 2
    explanation: |
      volume-nocopy disables the default first-mount copy of image directory contents
      into an empty volume, so the volume starts empty. readonly, bind-create-src, and
      tmpfs-mode address unrelated concerns.
    ref: "concepts.md#populating-a-volume-from-image-content-first-mount-copy"

  - id: volumes-and-storage-050
    difficulty: beginner
    tags: [tmpfs, syntax]
    question: |
      Which command mounts an in-memory scratch space at /run using the shorthand flag?
    options:
      - "docker run --tmpfs /run myapp"
      - "docker run --volume tmpfs:/run myapp"
      - "docker run --mount type=volume,dst=/run myapp"
      - "docker run --ram /run myapp"
    answer: 0
    explanation: |
      `--tmpfs /run` is the shorthand for an in-memory tmpfs mount. The explicit
      equivalent is `--mount type=tmpfs,dst=/run`. The other forms create a volume or are
      invalid.
    ref: "concepts.md#tmpfs-mounts-in-memory"
