topic: "Volumes, Bind Mounts & Data Persistence"
domain: docker
topic_slug: volumes-and-storage
schema: 1
pass: clarity-v1

# Where this topic settles the loop topic 5 left open (rule K1). Unit 3 of that bill
# (the bytes gone on `docker rm`) is paid in #the-ephemeral-writable-layer; units 1 and 2
# (first-write latency and the tax after it) are paid here, with the magnitude.
resolves:
  anchor: "concepts.md#copy-on-write-and-why-databases-must-not-use-the-container-layer"

prompts:
  - id: volumes-and-storage-p001
    ref: "concepts.md#the-ephemeral-writable-layer"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you change one environment variable in a Compose file and run
      `docker compose up -d`, note the service's container ID from `docker ps` before and
      after.
    hint: "A different ID means a different writable layer."
    answer_in: "concepts.md#the-ephemeral-writable-layer"

  - id: volumes-and-storage-p002
    ref: "concepts.md#copy-on-write-and-why-databases-must-not-use-the-container-layer"
    kind: predict-failure
    tier: A
    prompt: |
      Your image bakes a 4 GB read-only dataset at `/data`, and the entrypoint runs
      `chmod -R g+r /data` before starting. No byte of content changes. Name what this
      costs at startup.
    hint: "Ask what a permission bit lives in, and where that has to end up."
    answer_in: "concepts.md#copy-on-write-and-why-databases-must-not-use-the-container-layer"

  - id: volumes-and-storage-p003
    ref: "concepts.md#named-volumes-docker-managed-storage"
    kind: refute
    tier: A
    prompt: |
      A review comment: "Use a bind mount to `/opt/appdata` instead of a named volume. It is
      the same storage underneath and you can read the files directly." Name what that
      trade actually gives up.
    hint: "Two of the three things the engine's ownership buys you are gone."
    answer_in: "concepts.md#where-it-breaks-the-host-path-you-should-not-reach-for"

  - id: volumes-and-storage-p004
    ref: "concepts.md#bind-mounts"
    kind: predict-failure
    tier: A
    prompt: |
      A Compose file bind-mounts `./config` over `/etc/app`, where the image ships three
      defaults. On a fresh machine `./config` does not exist. The app finds no config at
      all. Name both steps.
    hint: "One thing happened on the host, then one thing happened in the container."
    answer_in: "concepts.md#where-it-breaks-the-mount-that-hides-your-application"

  - id: volumes-and-storage-p005
    ref: "concepts.md#tmpfs-mounts-in-memory"
    kind: predict-failure
    tier: A
    prompt: |
      A container runs with a 512 MB memory limit and a tmpfs mount at `/scratch` with no
      `size=` given. Name the number that decides how much the process can write there
      before something fails.
    hint: "Two limits apply. Only one of them is about the filesystem."
    answer_in: "concepts.md#tmpfs-mounts-in-memory"

  - id: volumes-and-storage-p006
    ref: "concepts.md#-v---volume-vs---mount-syntax"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you read someone else's `docker run` line, check each `-v` source for a
      slash before you assume it names a host path.
    hint: "A bare word and a path are two different mount types on the same flag."
    answer_in: "concepts.md#-v---volume-vs---mount-syntax"

  - id: volumes-and-storage-p007
    ref: "concepts.md#anonymous-vs-named-volumes"
    kind: draw-the-boundary
    tier: A
    prompt: |
      This topic has assumed the operator picks the mounts. Find what a `VOLUME` line in
      somebody else's Dockerfile still decides for you after you override that path with
      your own named volume.
    hint: "Ask what the image layer at that path contains, and why."
    answer_in: "concepts.md#the-version-specific-truth-what-a-dockerfile-volume-does-to-a-later-build-step"

  - id: volumes-and-storage-p008
    ref: "concepts.md#populating-a-volume-from-image-content-first-mount-copy"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you upgrade an image whose defaults live on a path you keep a volume on,
      check whether the new defaults actually appear inside the volume.
    hint: "Look at whether the volume was empty when you mounted it."
    answer_in: "concepts.md#populating-a-volume-from-image-content-first-mount-copy"

  - id: volumes-and-storage-p009
    ref: "concepts.md#sharing-volumes-between-containers"
    kind: predict-failure
    tier: A
    prompt: |
      Two containers mount `shared:/data`, and both maintain a running total in
      `/data/ledger` by reading it, adding to it and writing it back. Name the failure and
      the smallest change that removes it.
    hint: "Count how many operations there are between the read and the write."
    answer_in: "concepts.md#sharing-volumes-between-containers"

  - id: volumes-and-storage-p010
    ref: "concepts.md#permissions-and-uidgid-issues"
    kind: draw-the-boundary
    tier: C
    prompt: |
      This file says the first-mount copy carries the image directory's owner and mode, and
      that Docker never promises it. Find out what the `local` volume driver actually does.
    hint: "The behaviour is in code, not on a docs page."
    answer_in: external
    search_hint: |
      The moby/moby repository: the `local` volume driver and the daemon code that
      initialises a fresh volume before a container starts. Docker's volumes and storage
      documentation pages do not mention ownership at all, so a docs search will not settle
      it.
    success_criterion: |
      You can name the copy routine the daemon calls when it seeds an empty volume, and say
      from that code whether uid, gid and mode travel with the file contents. Reading it
      also tells you what happens to a symlink and to a file the daemon cannot read, which
      no documentation page states.

  - id: volumes-and-storage-p011
    ref: "concepts.md#backing-up-and-restoring-volumes"
    kind: name-the-price
    tier: D
    prompt: |
      You need a nightly backup of a 400 GB Postgres volume with under a minute of
      downtime. Name what each of the two options in this section costs you at that size.
    hint: "One of the two costs is only visible on the day you restore."
    answer_shape: |
      Any credible answer prices three dimensions. First, the downtime window and whether
      it scales with the volume's size. Second, restore time and how sensitive the restore
      is to the database's version. Third, whether the copy is guaranteed consistent or
      only consistent if nothing wrote during the walk — and what you would do to find out
      which you got.

cliffhanger:
  hook: |
    The writer and the reader in the shared-volume example never spoke to each other. One
    appended a line to `/data/log`; the other ran `cat /data/log` and found it. The volume
    did all the work in between, and neither container knew the other existed. A mount and a
    published port are the same kind of thing. Both are per-container kernel arrangements
    that the host wires in from outside. Now change the requirement. The reader has to ask
    the writer for the last line instead of reading the file. It needs a way to refer to a
    container whose ID changes on every recreate. A shared volume hands over bytes at rest
    and no way to name the process that wrote them. Something has to answer that name.
  teaser_questions:
    - "What does one container call another when neither one's IP survives a restart?"
    - "Which process answers that name, and how does it know the answer?"
  payoff:
    anchor: "concepts.md#the-embedded-dns-resolver"
    claim: >-
      Docker runs an embedded DNS server at 127.0.0.11 inside each container's namespace on
      user-defined networks; a lookup of another container's name or network-alias returns
      that container's IP on the shared network, and resolution is scoped to the network, so
      a container resolves only names of containers it shares a user-defined network with.
