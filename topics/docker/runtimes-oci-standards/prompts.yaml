topic: "Container Runtimes, Isolation Internals & OCI Standards"
domain: docker
topic_slug: runtimes-oci-standards
schema: 1
pass: clarity-v1

# K1: where THIS topic settles the loop topic 15 (image-internals-storage-drivers) left open.
resolves:
  anchor: "concepts.md#runc-and-the-oci-runtime-flow"

prompts:
  - id: runtimes-oci-standards-p001
    ref: "concepts.md#the-docker-runtime-stack-cli-dockerd-containerd-runc"
    kind: predict-failure
    tier: A
    prompt: |
      You restart the Docker daemon and your containers keep serving traffic. Which process
      was holding each container's stdio and exit code open while the daemon was gone?
    hint: "After runc exits, who is the container's parent?"
    answer_in: "concepts.md#where-it-breaks-restarting-the-daemon-under-a-live-container"

  - id: runtimes-oci-standards-p002
    ref: "concepts.md#containerd-the-high-level-runtime"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time `docker images` and `crictl images` disagree on the same node, check which
      containerd metadata namespace each command is reading.
    answer_in: "concepts.md#containerd-the-high-level-runtime"

  - id: runtimes-oci-standards-p003
    ref: "concepts.md#runc-and-the-oci-runtime-flow"
    kind: predict-failure
    tier: A
    prompt: |
      You edit `config.json` to raise a memory limit after `runc create` but before
      `runc start`. Does the started container get the new limit?
    hint: "When is the environment actually built — at create, or at start?"
    answer_in: "concepts.md#where-it-breaks-create-and-start-are-two-separate-commands"

  - id: runtimes-oci-standards-p004
    ref: "concepts.md#the-oci-specifications-image-runtime-distribution"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time `docker pull nginx:latest` just works on both an arm64 laptop and an amd64
      server, check what one tag mapped to for each machine.
    answer_in: "concepts.md#the-oci-specifications-image-runtime-distribution"

  - id: runtimes-oci-standards-p005
    ref: "concepts.md#cri-the-container-runtime-interface-and-dockershim-removal"
    kind: refute
    tier: A
    prompt: |
      A teammate writes: "Our cluster runs containerd, not Docker, so we must rebuild every
      `docker build` image before it will run." What is wrong with this?
    hint: "What layer is an image actually defined by?"
    answer_in: "concepts.md#why-standards-matter-interoperability"

  - id: runtimes-oci-standards-p006
    ref: "concepts.md#linux-namespaces-what-a-container-sees"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you debug with `docker run --pid=host`, run `ps` inside the container and
      check how many host processes you can now see.
    answer_in: "concepts.md#where-it-breaks-sharing-a-namespace-turns-isolation-off"

  - id: runtimes-oci-standards-p007
    ref: "concepts.md#cgroups-what-a-container-can-use"
    kind: name-the-price
    tier: A
    prompt: |
      A CPU-bound container hits its `--cpus=1.5` cap. Name the price it pays, and say why
      that outcome differs from a container that hits its memory cap.
    hint: "One limit throttles; the other kills."
    answer_in: "concepts.md#where-it-breaks-a-cpu-limit-throttles-it-never-kills"

  - id: runtimes-oci-standards-p008
    ref: "concepts.md#capabilities-slicing-up-root"
    kind: draw-the-boundary
    tier: C
    prompt: |
      This topic says root splits into "roughly forty" capabilities. Find the exact number
      your own running kernel exposes, and why that number is not a fixed constant.
    search_hint: "capabilities(7); then read /proc/sys/kernel/cap_last_cap (the CAP_LAST_CAP value) on a live kernel."
    success_criterion: |
      You can state your kernel's highest capability index (CAP_LAST_CAP) and explain that
      newer kernels add capabilities, so the count rises over time — which is exactly why the
      prose says "roughly forty" rather than a fixed number.
    answer_in: external

  - id: runtimes-oci-standards-p009
    ref: "concepts.md#alternative-runtimes-gvisor-and-kata-stronger-isolation"
    kind: name-the-price
    tier: A
    prompt: |
      gVisor's `runsc` puts a syscall boundary between the container and the host kernel.
      Name what every syscall now costs, and the workload where that cost dominates.
    answer_in: "concepts.md#where-it-breaks-what-intercepting-a-syscall-actually-costs"

  - id: runtimes-oci-standards-p010
    ref: "concepts.md#rootless-containers"
    kind: predict-failure
    tier: A
    prompt: |
      You move a web container to rootless mode and it can no longer bind port 80, though
      the same image bound port 80 as root before. Why can't it now?
    hint: "Which host uid is a rootless container's 'root' actually running as?"
    answer_in: "concepts.md#rootless-containers"

cliffhanger:
  hook: |
    You started this domain with a slogan: a container is just a process. Sixteen topics
    later, it is not a slogan but a syscall trace. `clone` with namespace flags decides what
    it sees; cgroup writes decide what it can use. A trimmed capability set decides what it
    may do, and then `exec` runs your program. Everything above it, from images and layers to
    registries and the runtime interface, is bookkeeping around that one sequence. But the
    process still runs on the host's kernel. gVisor and Kata move that boundary, and each
    charges a per-syscall toll to do it. How much? Nobody has published a general answer. It
    depends on your syscall mix, and measuring your own is the last thing this domain leaves
    you to do.
  teaser_questions:
    - "The kubelet drives containerd and runc through the CRI you just met — so where does a Pod's shared network namespace actually come from?"
    - "A single container's HEALTHCHECK becomes something else once a scheduler owns it: into how many separate kinds of probe?"
    - "And who builds the OCI image in the first place, on a fresh CI machine, before any of this runtime stack runs?"
  payoff:
    anchor: "kubernetes/architecture-control-plane#container-runtime-and-the-cri"
    claim: >-
      That H2 teaches that the kubelet talks to a CRI runtime (containerd or CRI-O) which in
      turn calls runc, the low-level OCI runtime — the exact stack this topic built, now
      consumed rather than explained.
