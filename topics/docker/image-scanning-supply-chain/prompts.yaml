topic: "Image Scanning & Supply-Chain Security"
domain: docker
topic_slug: image-scanning-supply-chain
schema: 1
pass: clarity-v1

prompts:
  - id: image-scanning-supply-chain-p001
    ref: "concepts.md#the-image-supply-chain-threat-model"
    kind: refute
    tier: A
    prompt: |
      A teammate closes a review with "we sign every image with cosign, so scanning is belt-and-braces
      we can drop." The claim is wrong. Say what a signature never tells you.
    hint: "Which of the two guarantees does a signature actually give?"
    answer_in: "concepts.md#the-image-supply-chain-threat-model"

  - id: image-scanning-supply-chain-p002
    ref: "concepts.md#what-image-scanning-actually-finds"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a scan of an image reports zero vulnerabilities, check whether the image even carries a
      package database the scanner could have read before you treat the zero as clean.
    answer_in: "concepts.md#what-image-scanning-actually-finds"

  - id: image-scanning-supply-chain-p003
    ref: "concepts.md#scanner-landscape-trivy-grype-docker-scout-clair"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time the same image passes a CI scan but a registry scan flags it days later with no rebuild,
      check the vulnerability-database date each scanner used.
    answer_in: "concepts.md#scanner-landscape-trivy-grype-docker-scout-clair"

  - id: image-scanning-supply-chain-p004
    ref: "concepts.md#base-image-vulnerabilities--minimal--distroless-bases"
    kind: predict-failure
    tier: A
    prompt: |
      You move a statically linked C service onto `scratch` and its Trivy report drops from 40 CVEs to
      zero. Predict what that zero actually measures, and what it hides.
    hint: "What record does the scanner read, and does a bare C binary leave one?"
    answer_in: "concepts.md#base-image-vulnerabilities--minimal--distroless-bases"

  - id: image-scanning-supply-chain-p005
    ref: "concepts.md#sbom-of-an-image--whats-inside"
    kind: refute
    tier: A
    prompt: |
      A colleague says "we attach an SBOM to every image, so we've proven how each one was built."
      Correct the confusion between the two artifacts.
    hint: "Which question does an SBOM answer, and which does it not?"
    answer_in: "concepts.md#sbom-of-an-image--whats-inside"

  - id: image-scanning-supply-chain-p006
    ref: "concepts.md#image-signing--verification--docker-content-trust--notary"
    kind: predict-failure
    tier: A
    prompt: |
      An air-gapped mirror cannot refresh DCT's timestamp metadata for a week. Predict what
      `docker pull` does with `DOCKER_CONTENT_TRUST=1` against an image on that mirror.
    hint: "What does the timestamp role expire, and what does the client do with expired metadata?"
    answer_in: "concepts.md#image-signing--verification--docker-content-trust--notary"

  - id: image-scanning-supply-chain-p007
    ref: "concepts.md#cosign--sigstore--keyless-signing-and-transparency"
    kind: refute
    tier: A
    prompt: |
      A colleague runs `cosign sign myorg/api:1.4.2` on the tag and calls the deploy tamper-proof.
      Name the flaw, and what they should have signed instead.
    hint: "What can a tag do next week that a digest cannot?"
    answer_in: "concepts.md#cosign--sigstore--keyless-signing-and-transparency"

  - id: image-scanning-supply-chain-p008
    ref: "concepts.md#pinning-base-images-by-digest"
    kind: name-the-price
    tier: A
    prompt: |
      Pinning `FROM ...@sha256:` makes a build byte-for-byte reproducible. Name the security cost that
      buys, and the process that has to run for the pin to stay safe.
    hint: "What does a fixed digest never do on its own?"
    answer_in: "concepts.md#pinning-base-images-by-digest"

  - id: image-scanning-supply-chain-p009
    ref: "concepts.md#scanning-in-ci-and-at-the-registry--gating-on-severity"
    kind: predict-failure
    tier: A
    prompt: |
      Your gate is `--severity CRITICAL,HIGH` with no `--ignore-unfixed`. A CRITICAL with no upstream fix
      is disclosed against your base. Predict what happens to every deploy that day.
    hint: "Can the pipeline pass a gate on a CVE nobody can remediate yet?"
    answer_in: "concepts.md#scanning-in-ci-and-at-the-registry--gating-on-severity"

  - id: image-scanning-supply-chain-p010
    ref: "concepts.md#admission-control--verifying-signatures-at-deploy"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a repo's README says "all our images are signed", check what — if anything — verifies
      that signature at deploy time before the workload is scheduled.
    answer_in: "concepts.md#admission-control--verifying-signatures-at-deploy"

  - id: image-scanning-supply-chain-p011
    ref: "concepts.md#scanner-accuracy-false-positives--limitations"
    kind: draw-the-boundary
    tier: C
    prompt: |
      Take one HIGH your scanner reports on a real image. Establish whether the distro already
      backported the fix, and whether your code even reaches the vulnerable function.
    hint: "The NVD summary answers neither question; two other sources do."
    answer_in: external
    search_hint: >
      For the backport, read the distro's own advisory feed — Debian's Security Tracker or Red Hat's
      OVAL page for that CVE, not the NVD entry. For reachability, read the advisory's "affected
      functions" or the fix commit, then grep your dependency graph for a call into that path.
    success_criterion: >
      For that one CVE you can state (a) whether the installed distro build is actually patched despite an
      unchanged upstream version number, from the vendor advisory, and (b) whether any code path you ship
      calls the vulnerable function — so you can justify blocking, tracking with an SLA, or suppressing
      with a written VEX reason, rather than treating the raw finding as an automatic blocker.

cliffhanger:
  from: image-scanning-supply-chain
  to_position: 14
  pattern: B
  key_noun_for_K1_grep: attestation
  hook: |
    Twice this topic told you to attach something at build time and never said how.
    `docker buildx build --sbom=true` writes an SBOM, but the classic `docker build` cannot.
    Provenance, the record of how an image was built, is the same story: the old builder cannot
    emit it. There is a matching debt on the way in. Every rule about keeping secrets out of a
    layer assumed a build-time place for them that is not a layer. The classic builder has none.
    Both bills come due at one address. It is a newer build engine, one that can attach
    signed attestations and mount a secret that never lands in a layer. What has to change about
    the builder itself for a signed attestation to exist at all?
  teaser_questions:
    - "What can the classic `docker build` not attach to an image?"
    - "Where does a secret live during a build if it never enters a layer?"
    - "What must the build engine itself provide before a signed attestation can exist?"
  payoff:
    anchor: "concepts.md#provenance--sbom-attestations"
    claim: >
      Topic 14 shows BuildKit attaching build attestations — provenance and SBOM — to an image as
      extra manifests in the image index (the in-toto format), via
      `docker buildx build --provenance=true --sbom=true`; a separate section shows
      `RUN --mount=type=secret` keeping a secret out of any layer, image, or build cache.
