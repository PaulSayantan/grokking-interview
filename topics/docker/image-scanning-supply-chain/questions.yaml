topic: "Image Scanning & Supply-Chain Security"
domain: docker
topic_slug: image-scanning-supply-chain
version: 1
questions:
  - id: image-scanning-supply-chain-001
    difficulty: beginner
    tags: [scanning, signing, concepts]
    question: |
      Image scanning and image signing protect against different things. Which
      pairing is correct?
    options:
      - "Scanning proves authenticity; signing finds vulnerabilities"
      - "Scanning finds known vulnerabilities inside the image; signing proves the image is authentic and untampered"
      - "Both prove the image contains no vulnerabilities"
      - "Both prove the image came from a trusted publisher"
    answer: 1
    explanation: |
      Scanning answers "does this contain known-bad components?" It says nothing
      about authenticity. Signing answers "was this exact digest produced by the
      party I trust, and is it untampered?" It says nothing about vulnerabilities.
      You need both — they are orthogonal guarantees.
    ref: "concepts.md#the-image-supply-chain-threat-model"

  - id: image-scanning-supply-chain-002
    difficulty: beginner
    tags: [threat-model, base-image]
    question: |
      You wrote perfect application code but your image still shows dozens of CVEs.
      What is the most likely source?
    options:
      - "Your Dockerfile syntax is wrong"
      - "The base image drags in an OS userland (openssl, glibc, zlib, etc.) whose packages have known CVEs"
      - "The container runtime is outdated"
      - "The registry corrupted the layers"
    answer: 1
    explanation: |
      `FROM node:20` pulls in a full Debian userland with many OS packages. A CVE in
      any of them becomes your CVE even if your own code is flawless. Most image CVEs
      come from the base image, which is why smaller/distroless bases matter.
    ref: "concepts.md#the-image-supply-chain-threat-model"

  - id: image-scanning-supply-chain-003
    difficulty: intermediate
    tags: [threat-model, tag-hijack]
    question: |
      Why is depending on the floating tag `node:20` a supply-chain risk beyond just
      reproducibility?
    options:
      - "Tags are always slower to pull than digests"
      - "A tag is a mutable pointer, so a compromised or mistaken upstream can re-point it at different (possibly backdoored) bytes"
      - "Tags cannot be scanned by Trivy"
      - "Docker refuses to sign tagged images"
    answer: 1
    explanation: |
      A tag is a mutable pointer. The bytes `node:20` resolves to can change at any
      time. Tag mutation / hijack means the "same" build can silently pull different
      or malicious content. Pinning by digest defends against this.
    ref: "concepts.md#the-image-supply-chain-threat-model"

  - id: image-scanning-supply-chain-004
    difficulty: beginner
    tags: [scanning, what-it-finds]
    question: |
      A container image scanner like Trivy inventories two broad classes of
      components. Which pair is correct?
    options:
      - "OS/distro packages and application/language dependencies"
      - "CPU instructions and kernel modules"
      - "Network ports and mounted volumes"
      - "Environment variables and build args"
    answer: 0
    explanation: |
      Scanners find OS/distro packages (apk, dpkg/apt, rpm) by reading the package
      DB inside the image, and application/language dependencies (npm, pip, Maven,
      Go modules) parsed from lockfiles and installed metadata.
    ref: "concepts.md#what-image-scanning-actually-finds"

  - id: image-scanning-supply-chain-005
    difficulty: intermediate
    tags: [scanning, mechanism]
    question: |
      How does a scanner determine which OS packages are installed in a Debian-based
      image?
    options:
      - "It runs the container and executes `apt list`"
      - "It reads the package database inside the image (e.g. /var/lib/dpkg/status), without running the container"
      - "It guesses from filenames and directory structure"
      - "It queries Docker Hub for the image's package list"
    answer: 1
    explanation: |
      Scanners perform static analysis: they read the package DB files inside the
      layers (`/var/lib/dpkg/status` for dpkg, `/lib/apk/db/installed` for apk) to
      get an exact `(package, version)` inventory. No container needs to run.
    ref: "concepts.md#what-image-scanning-actually-finds"

  - id: image-scanning-supply-chain-006
    difficulty: intermediate
    tags: [scanning, limitations, cve]
    question: |
      A scanner reports zero vulnerabilities. What can you correctly conclude?
    options:
      - "The image is guaranteed free of all security bugs"
      - "No known CVEs currently in the scanner's database matched the inventoried components; unknown/zero-day issues and logic bugs are undetected"
      - "The image needs no further review of any kind"
      - "The image has been cryptographically signed"
    answer: 1
    explanation: |
      Scanners only find *known* CVEs that are *in their database*. A clean scan means
      no known-DB matches — it says nothing about zero-days, unpublished vulns, or
      your own logic bugs. Scanning is necessary, not sufficient.
    ref: "concepts.md#what-image-scanning-actually-finds"

  - id: image-scanning-supply-chain-007
    difficulty: intermediate
    tags: [scanning, advisory-sources]
    question: |
      Which set of data sources does a mature image scanner typically match components
      against?
    options:
      - "Only the NVD CVE feed"
      - "NVD plus distro advisories (Red Hat OVAL, Debian, Alpine secdb, Amazon ALAS) plus the GitHub Advisory Database"
      - "Only Docker Hub metadata"
      - "Only the CIS Docker Benchmark"
    answer: 1
    explanation: |
      Good scanners combine NVD (CVE + CVSS), per-distro advisory sources (Red Hat
      OVAL, Debian Security Tracker, Alpine secdb, Amazon Linux ALAS) for OS packages,
      and the GitHub Advisory Database (GHSA) for language ecosystems.
    ref: "concepts.md#what-image-scanning-actually-finds"

  - id: image-scanning-supply-chain-008
    difficulty: beginner
    tags: [tools, trivy]
    question: |
      Which command scans an image for CVEs with Trivy?
    options:
      - "docker inspect myorg/api:1.4.2"
      - "trivy build myorg/api:1.4.2"
      - "trivy image myorg/api:1.4.2"
      - "cosign verify myorg/api:1.4.2"
    answer: 2
    explanation: |
      `trivy image <ref>` scans a container image, reporting both OS-package and
      language-dependency vulnerabilities. `docker inspect` shows metadata, and
      `cosign verify` checks signatures — neither scans for CVEs.
    ref: "concepts.md#scanner-landscape-trivy-grype-docker-scout-clair"

  - id: image-scanning-supply-chain-009
    difficulty: intermediate
    tags: [tools, grype, syft, sbom]
    question: |
      What is the architectural relationship between Syft and Grype?
    options:
      - "Syft signs images; Grype verifies signatures"
      - "They are two names for the same binary"
      - "Grype builds images; Syft deploys them"
      - "Syft generates the SBOM (inventory); Grype matches that SBOM against the vulnerability database"
    answer: 3
    explanation: |
      Syft produces the SBOM (component inventory); Grype matches components against
      the CVE database. Decoupling means you can generate an SBOM once and rescan it
      later as new CVEs land, without re-pulling or rebuilding the image.
    ref: "concepts.md#scanner-landscape-trivy-grype-docker-scout-clair"

  - id: image-scanning-supply-chain-010
    difficulty: intermediate
    tags: [tools, docker-scout]
    question: |
      Beyond listing CVEs, what capability distinguishes Docker Scout?
    options:
      - "It builds SBOMs, recommends newer/smaller base images, and can `compare` two images' CVEs"
      - "It runs containers in production"
      - "It replaces the container runtime"
      - "It is the only tool that can read a dpkg database"
    answer: 0
    explanation: |
      Docker Scout is integrated into the Docker CLI/Hub, builds an SBOM, matches it
      against a vuln DB, adds remediation guidance (recommend a newer/smaller base),
      and offers `docker scout compare` to diff two images' vulnerabilities.
    ref: "concepts.md#scanner-landscape-trivy-grype-docker-scout-clair"

  - id: image-scanning-supply-chain-011
    difficulty: advanced
    tags: [tools, clair]
    question: |
      How does Clair typically operate compared with Trivy?
    options:
      - "As a long-running service/API embedded in a registry (e.g. Quay) that scans images statically, often on push"
      - "As a single CLI binary run in CI"
      - "As a kernel module that intercepts syscalls"
      - "As a Dockerfile linter only"
    answer: 0
    explanation: |
      Clair runs as a service exposing an API and is commonly embedded in registries
      (Quay) to scan images on push. Trivy, by contrast, ships as a single Go binary
      well-suited to CI usage.
    ref: "concepts.md#scanner-landscape-trivy-grype-docker-scout-clair"

  - id: image-scanning-supply-chain-012
    difficulty: advanced
    tags: [tools, trivy, database]
    question: |
      How is Trivy's vulnerability database distributed and cached, enabling fast,
      offline-capable scans after the first run?
    options:
      - "As a live SQL query to NVD on every scan"
      - "It is embedded in every scanned image"
      - "As a browser cookie"
      - "As an OCI artifact pulled from a registry and cached locally"
    answer: 3
    explanation: |
      Trivy distributes its vuln DB as an OCI artifact pulled from a registry and
      caches it locally. After the first pull, scans are fast and can run offline
      until the DB needs refreshing.
    ref: "concepts.md#scanner-landscape-trivy-grype-docker-scout-clair"

  - id: image-scanning-supply-chain-013
    difficulty: intermediate
    tags: [ci, registry, defense-in-depth]
    question: |
      Why scan an image in CI *and* again at the registry — isn't that redundant?
    options:
      - "It is redundant and should be avoided"
      - "Registry scanning is faster so CI scanning is skipped"
      - "CI blocks bad images before publishing; registry re-scanning surfaces CVEs disclosed *after* the image already passed CI, without a rebuild"
      - "CI scanning only checks signatures, not CVEs"
    answer: 2
    explanation: |
      They serve different moments. CI catches problems before publish (fail the
      build). Registry-side continuous scanning re-evaluates already-published images
      against today's DB, catching newly disclosed CVEs without rebuilding.
    ref: "concepts.md#scanner-landscape-trivy-grype-docker-scout-clair"

  - id: image-scanning-supply-chain-014
    difficulty: beginner
    tags: [base-image, distroless, attack-surface]
    question: |
      Why does a smaller base image (e.g. distroless) usually have far fewer CVEs
      than `ubuntu`?
    options:
      - "Smaller images compress better"
      - "Small images disable the vulnerability scanner"
      - "Fewer OS packages are installed, so there are fewer components that can have advisories"
      - "Ubuntu is not scannable"
    answer: 2
    explanation: |
      Most image CVEs come from OS packages you never use. Fewer installed packages
      means fewer components that can be vulnerable — a smaller CVE surface and a
      smaller attack surface overall.
    ref: "concepts.md#base-image-vulnerabilities--minimal--distroless-bases"

  - id: image-scanning-supply-chain-015
    difficulty: intermediate
    tags: [distroless, security]
    question: |
      A distroless image ships your app and runtime dependencies but no shell and no
      package manager. What security benefit does the *absence of a shell* give?
    options:
      - "An attacker with RCE has no shell to pivot with, and a class of `sh -c`/living-off-the-land exploits is unavailable"
      - "Faster container startup"
      - "Smaller image layers on disk"
      - "Automatic signing of the image"
    answer: 0
    explanation: |
      No shell means an attacker who achieves code execution cannot spawn `sh`, run
      shell-based exploit chains, or use `docker exec` to poke around. It removes a
      whole class of post-exploitation tooling.
    ref: "concepts.md#base-image-vulnerabilities--minimal--distroless-bases"

  - id: image-scanning-supply-chain-016
    difficulty: intermediate
    tags: [distroless, debugging, gotcha]
    question: |
      Your team ships a distroless production image and now `docker exec -it ctr sh`
      fails. What is the correct way to debug?
    options:
      - "Use an ephemeral debug container (e.g. `docker debug` / K8s ephemeral containers) or a separate multi-stage debug target — don't add a shell to prod"
      - "Add `RUN apt-get install -y bash` to the production Dockerfile"
      - "Rebuild on `ubuntu` permanently"
      - "Disable the entrypoint"
    answer: 0
    explanation: |
      Distroless intentionally omits a shell. Attach an ephemeral debug container that
      brings its own tools, or build a separate debug target — do not add a shell to
      the production image, which reintroduces attack surface.
    ref: "concepts.md#base-image-vulnerabilities--minimal--distroless-bases"

  - id: image-scanning-supply-chain-017
    difficulty: advanced
    tags: [alpine, musl, tradeoffs]
    question: |
      What is a real trade-off of choosing `alpine` purely to minimize CVE count?
    options:
      - "Alpine cannot be scanned"
      - "Alpine images are always larger than Ubuntu"
      - "Alpine has no package manager at all"
      - "Alpine uses musl libc (not glibc), which can cause compatibility, DNS, or performance differences for some workloads"
    answer: 3
    explanation: |
      Alpine is tiny (musl + busybox + apk) but musl differs from glibc in subtle
      ways — occasional library incompatibilities, DNS resolution quirks, and
      performance differences. Smaller is not automatically correct for every app.
    ref: "concepts.md#base-image-vulnerabilities--minimal--distroless-bases"

  - id: image-scanning-supply-chain-018
    difficulty: intermediate
    tags: [multi-stage, distroless, dockerfile]
    question: |
      Given this Dockerfile, why is the final image both small and low-CVE?
      ```dockerfile
      FROM golang:1.22 AS build
      RUN CGO_ENABLED=0 go build -o /app ./cmd/api
      FROM gcr.io/distroless/static-debian12:nonroot
      COPY --from=build /app /app
      USER nonroot
      ENTRYPOINT ["/app"]
      ```
    options:
      - "The build toolchain (golang) is discarded; only the static binary ships on a distroless base with no shell/package manager"
      - "Distroless compresses the Go binary"
      - "The image inherits Go's own CVE scanner"
      - "Multi-stage builds skip vulnerability scanning"
    answer: 0
    explanation: |
      Multi-stage build: the heavy `golang` toolchain stays in the build stage and is
      not copied forward. The final image is a distroless base plus one static binary
      — minimal packages, no shell, running as nonroot.
    ref: "concepts.md#base-image-vulnerabilities--minimal--distroless-bases"

  - id: image-scanning-supply-chain-019
    difficulty: advanced
    tags: [rebuild-cadence, immutable, cve]
    question: |
      You built and signed an image 6 months ago, deployed it, and changed nothing.
      Is it necessarily still secure today?
    options:
      - "Yes — an immutable image cannot become vulnerable"
      - "No — new CVEs may have been disclosed against the OS packages/libraries frozen inside it; immutable bytes are not immune bytes"
      - "Yes — the signature keeps it patched"
      - "Only if it was built on Alpine"
    answer: 1
    explanation: |
      Immutable ≠ immune. The image's bytes never change, but new CVEs get disclosed
      against its frozen packages over time. This is why continuous registry scanning
      and a rebuild cadence exist — and why an old signed digest can still be vulnerable.
    ref: "concepts.md#keeping-bases-updated--rebuild-cadence"

  - id: image-scanning-supply-chain-020
    difficulty: intermediate
    tags: [rebuild-cadence, automation]
    question: |
      Which practice best keeps base images patched over time with the least manual
      toil?
    options:
      - "Automated dependency PRs (Dependabot/Renovate) that bump the FROM digest and lockfiles, plus a regular rebuild cadence, both re-scanned by CI"
      - "Never rebuild once the image passes CI"
      - "Manually rebuild only when a customer complains"
      - "Delete and recreate the registry weekly"
    answer: 0
    explanation: |
      Renovate/Dependabot open PRs bumping the base digest and lockfiles, which CI
      scans; combined with a scheduled rebuild cadence this picks up patched packages
      even when your source is unchanged, with minimal manual work.
    ref: "concepts.md#keeping-bases-updated--rebuild-cadence"

  - id: image-scanning-supply-chain-021
    difficulty: intermediate
    tags: [sbom, definition]
    question: |
      What is an SBOM for a container image?
    options:
      - "A machine-readable inventory of every component (OS packages, language deps, versions, often licenses) inside the image"
      - "A signature over the image digest"
      - "A network policy describing exposed ports"
      - "The build cache metadata"
    answer: 0
    explanation: |
      An SBOM (Software Bill of Materials) is the component inventory: OS packages,
      language dependencies, their versions, and often licenses/hashes. It is the
      inventory that scanning and audit both build on.
    ref: "concepts.md#sbom-of-an-image--whats-inside"

  - id: image-scanning-supply-chain-022
    difficulty: intermediate
    tags: [sbom, formats]
    question: |
      Which two are the dominant standardized SBOM formats?
    options:
      - "YAML and TOML"
      - "SPDX and CycloneDX"
      - "JSON Schema and Protobuf"
      - "PEM and DER"
    answer: 1
    explanation: |
      SPDX (Linux Foundation / ISO) and CycloneDX (OWASP) are the two dominant SBOM
      formats. Tools like Syft and Docker Scout can emit either.
    ref: "concepts.md#sbom-of-an-image--whats-inside"

  - id: image-scanning-supply-chain-023
    difficulty: advanced
    tags: [sbom, incident-response]
    question: |
      When the next Log4Shell-class CVE drops, what is the main operational payoff of
      having stored SBOMs for all your images?
    options:
      - "You can instantly delete the registry"
      - "SBOMs auto-patch the vulnerable library"
      - "SBOMs prevent the CVE from being exploitable"
      - "You can query the SBOMs ('which images contain log4j-core < 2.15?') instead of rescanning every image from scratch"
    answer: 3
    explanation: |
      Stored SBOMs let you answer "which of our images contain the affected component
      and version?" with a fast query, rather than rescanning hundreds of images.
      SBOMs enable rapid re-assessment; they don't patch or prevent anything.
    ref: "concepts.md#sbom-of-an-image--whats-inside"

  - id: image-scanning-supply-chain-024
    difficulty: advanced
    tags: [sbom, buildkit, attestation]
    question: |
      What does `docker buildx build --sbom=true --provenance=true` do?
    options:
      - "Signs the image with cosign"
      - "Attaches the SBOM and build provenance as attestations stored in the image index alongside the manifest, so they travel with the image"
      - "Scans the image and fails on CRITICAL CVEs"
      - "Strips all metadata from the image"
    answer: 1
    explanation: |
      BuildKit can emit the SBOM and provenance as attestations stored in the image
      index next to the manifest, so both travel with the image in the registry. This
      is generation, not signing (cosign) or scanning.
    ref: "concepts.md#sbom-of-an-image--whats-inside"

  - id: image-scanning-supply-chain-025
    difficulty: intermediate
    tags: [sbom, provenance, distinction]
    question: |
      What is the difference between an SBOM and provenance/attestation?
    options:
      - "They are the same thing"
      - "SBOM is binary; provenance is text"
      - "SBOM describes what components are inside; provenance describes how and where the image was built (the SLSA concern)"
      - "SBOM is signed; provenance is never signed"
    answer: 2
    explanation: |
      SBOM = the inventory of components inside the image. Provenance = how and where
      it was built (build inputs, builder identity) — the SLSA concern. BuildKit can
      emit both as attestations. Deep SLSA detail lives in devops-cicd.
    ref: "concepts.md#sbom-of-an-image--whats-inside"

  - id: image-scanning-supply-chain-026
    difficulty: beginner
    tags: [signing, dct]
    question: |
      What does enabling `DOCKER_CONTENT_TRUST=1` do when you push and pull?
    options:
      - "It compresses layers more aggressively"
      - "It signs pushed tags and, on pull, refuses unsigned or tampered content"
      - "It scans the image for CVEs before pushing"
      - "It disables TLS to the registry"
    answer: 1
    explanation: |
      Docker Content Trust (DCT) signs the tags you push and, on pull, verifies
      signatures and rejects unsigned/tampered images. It provides authenticity and
      tamper-evidence, not vulnerability scanning.
    ref: "concepts.md#image-signing--verification--docker-content-trust--notary"

  - id: image-scanning-supply-chain-027
    difficulty: advanced
    tags: [signing, dct, notary, tuf]
    question: |
      Docker Content Trust is built on which technology, and what extra protection
      does it provide beyond a plain signature?
    options:
      - "Built on Sigstore; provides keyless signing"
      - "Built on GPG; provides encryption of layers"
      - "Built on TLS; provides transport encryption only"
      - "Built on Notary v1 / TUF; provides freshness and rollback protection via signed timestamp metadata"
    answer: 3
    explanation: |
      DCT uses Notary v1, which implements TUF (The Update Framework). Beyond signing
      tags, TUF's timestamp metadata provides freshness and rollback protection so an
      attacker cannot serve stale signed content indefinitely.
    ref: "concepts.md#image-signing--verification--docker-content-trust--notary"

  - id: image-scanning-supply-chain-028
    difficulty: advanced
    tags: [signing, dct, limitations]
    question: |
      Why has the industry largely moved away from Docker Content Trust for new work?
    options:
      - "It signs too many images at once"
      - "It cannot sign anything smaller than 1 GB"
      - "It was removed from the OCI spec"
      - "It was tied to a Notary server / Docker Hub, had awkward key management, and poor CI ergonomics; cosign and notation superseded it"
    answer: 3
    explanation: |
      DCT/Notary v1 required a Notary server, was coupled to Docker Hub, and had
      clumsy key management and CI ergonomics. Sigstore/cosign and Notary v2
      (notation, using the OCI referrers model) have largely superseded it.
    ref: "concepts.md#image-signing--verification--docker-content-trust--notary"

  - id: image-scanning-supply-chain-029
    difficulty: intermediate
    tags: [cosign, sigstore]
    question: |
      Where does cosign store an image signature?
    options:
      - "As a separate OCI artifact in the same registry, referenced from the image digest — no separate server required"
      - "In a dedicated Notary server only"
      - "Inside the image's ENTRYPOINT"
      - "In a local file that must be shipped separately"
    answer: 0
    explanation: |
      Cosign stores the signature as its own OCI artifact in the same registry,
      referenced from the image digest. This removes the need for a separate Notary
      server, a key ergonomic win over DCT.
    ref: "concepts.md#cosign--sigstore--keyless-signing-and-transparency"

  - id: image-scanning-supply-chain-030
    difficulty: advanced
    tags: [cosign, keyless, fulcio, rekor]
    question: |
      In cosign keyless signing, what are the roles of Fulcio and Rekor?
    options:
      - "Fulcio scans for CVEs; Rekor builds the SBOM"
      - "Fulcio stores the image; Rekor runs the container"
      - "Both are private key vaults"
      - "Fulcio issues a short-lived signing certificate bound to your OIDC identity; Rekor is an append-only transparency log recording the signing event"
    answer: 3
    explanation: |
      Fulcio is a CA that issues a short-lived (~10 min) cert tied to your OIDC
      identity (e.g. a GitHub Actions workflow). Rekor is a public append-only
      transparency log recording the signature so the event is auditable even after
      the ephemeral key is gone.
    ref: "concepts.md#cosign--sigstore--keyless-signing-and-transparency"

  - id: image-scanning-supply-chain-031
    difficulty: advanced
    tags: [cosign, keyless, tradeoffs]
    question: |
      What does cosign keyless signing primarily eliminate, and at what cost?
    options:
      - "It eliminates the need to scan; cost is slower pulls"
      - "It eliminates the registry; cost is more storage"
      - "It eliminates the SBOM; cost is less auditability"
      - "It eliminates long-lived private keys (a common leak vector); cost is a dependency on Fulcio/Rekor availability and an OIDC identity"
    answer: 3
    explanation: |
      Keyless signing removes long-lived private keys — a frequent leak vector —
      using short-lived OIDC-bound certificates instead. The trade-off is a runtime
      dependency on Fulcio/Rekor and having a workable OIDC identity provider.
    ref: "concepts.md#cosign--sigstore--keyless-signing-and-transparency"

  - id: image-scanning-supply-chain-032
    difficulty: intermediate
    tags: [cosign, digest, gotcha]
    question: |
      Cosign signs `myorg/api@sha256:abc123...` rather than `myorg/api:1.4.2`. Why
      sign the digest and not the tag?
    options:
      - "Digests are shorter to type"
      - "Tags cannot be pushed to a registry"
      - "Cosign cannot read tags"
      - "A tag is mutable, so signing a tag is meaningless — it could later point at different bytes; the digest is the immutable content identity"
    answer: 3
    explanation: |
      A tag is a mutable pointer; signing it proves nothing durable because it can be
      re-pointed. The digest is the content-addressed, immutable identity, so cosign
      always signs `repo@sha256:...`.
    ref: "concepts.md#cosign--sigstore--keyless-signing-and-transparency"

  - id: image-scanning-supply-chain-033
    difficulty: beginner
    tags: [digest-pinning, reproducibility]
    question: |
      What does changing `FROM node:20-slim` to `FROM node:20-slim@sha256:2b3f...` in
      a Dockerfile achieve?
    options:
      - "It makes the base content-addressed and immutable, so the build is reproducible and unaffected by tag re-points"
      - "It makes the image smaller"
      - "It automatically applies security patches"
      - "It disables layer caching"
    answer: 0
    explanation: |
      Pinning by digest fixes the exact base bytes: the Dockerfile always resolves to
      the same base image, builds are deterministic, and an upstream re-pointing the
      `node:20-slim` tag cannot change your build.
    ref: "concepts.md#pinning-base-images-by-digest"

  - id: image-scanning-supply-chain-034
    difficulty: intermediate
    tags: [digest-pinning, tag-hijack]
    question: |
      How does pinning the base image by digest defend against tag hijacking?
    options:
      - "It encrypts the base layers"
      - "It blocks all network access during build"
      - "If an attacker re-points the tag to malicious bytes, your build still resolves the pinned digest and is unaffected until you deliberately bump it"
      - "It signs the resulting image automatically"
    answer: 2
    explanation: |
      A pinned digest is content-addressed, so a re-pointed or hijacked tag cannot
      change what your build pulls. You only move to new bytes when you explicitly
      update the digest — a deliberate, reviewable action.
    ref: "concepts.md#pinning-base-images-by-digest"

  - id: image-scanning-supply-chain-035
    difficulty: advanced
    tags: [digest-pinning, anti-pattern]
    question: |
      What is the common anti-pattern when pinning base images by digest?
    options:
      - "Pinning makes builds non-reproducible"
      - "Pinning forces you to use Alpine"
      - "Pinning and never updating the digest — you avoid unexpected changes but silently rot on old CVEs; pinning must be paired with automated bumps + rescan"
      - "Pinning breaks multi-stage builds"
    answer: 2
    explanation: |
      A pinned digest never receives security updates on its own. Pin-and-forget means
      you freeze on an increasingly vulnerable base. Digest pinning is only safe when
      paired with an automated update-and-rescan loop (Renovate/Dependabot).
    ref: "concepts.md#pinning-base-images-by-digest"

  - id: image-scanning-supply-chain-036
    difficulty: intermediate
    tags: [ci, gating, trivy]
    question: |
      Given `trivy image --exit-code 1 --severity CRITICAL,HIGH myorg/api:1.4.2` in a
      pipeline, what happens?
    options:
      - "It always passes and just prints a report"
      - "It signs the image if it is clean"
      - "It exits non-zero (failing the stage) if any CRITICAL or HIGH vulnerability is found"
      - "It uploads the image to Docker Hub"
    answer: 2
    explanation: |
      `--exit-code 1` makes Trivy return non-zero when vulnerabilities matching
      `--severity CRITICAL,HIGH` are present, which fails the CI stage — the standard
      "fail the build on critical/high" gate.
    ref: "concepts.md#scanning-in-ci-and-at-the-registry--gating-on-severity"

  - id: image-scanning-supply-chain-037
    difficulty: advanced
    tags: [ci, ignore-unfixed, tradeoffs]
    question: |
      Why do teams often add `--ignore-unfixed` to a CI scan gate, and what is the
      trade-off?
    options:
      - "It scans faster; no trade-off"
      - "It stops failing the build on CVEs with no vendor fix available (so you don't block on unremediable issues); trade-off is those CVEs stop being tracked unless you add an SLA/allowlist"
      - "It ignores all CRITICAL vulnerabilities; trade-off is nothing"
      - "It only scans OS packages; trade-off is missing app deps"
    answer: 1
    explanation: |
      `--ignore-unfixed` drops CVEs that have no fix yet, so the pipeline stays
      actionable rather than blocking on things you cannot remediate. The downside is
      you stop surfacing them — pair with an allowlist and remediation SLA.
    ref: "concepts.md#scanning-in-ci-and-at-the-registry--gating-on-severity"

  - id: image-scanning-supply-chain-038
    difficulty: intermediate
    tags: [ci, severity-threshold, alert-fatigue]
    question: |
      Why gate the pipeline only on Critical/High and merely warn on Medium/Low?
    options:
      - "Medium/Low CVEs are not real"
      - "Because scanners cannot detect Medium severity"
      - "To keep the gate actionable and avoid alert fatigue that leads to ignored reports, while still blocking the most dangerous issues"
      - "Because Low severity CVEs are always false positives"
    answer: 2
    explanation: |
      Blocking on every severity produces noise and fatigue, so teams block on
      Critical/High (the dangerous, usually fixable ones) and track Medium/Low with an
      SLA. The goal is an actionable, respected gate.
    ref: "concepts.md#scanning-in-ci-and-at-the-registry--gating-on-severity"

  - id: image-scanning-supply-chain-039
    difficulty: advanced
    tags: [ci, vex, suppression]
    question: |
      What is the purpose of VEX (Vulnerability Exploitability eXchange) / a
      `.trivyignore` with justification?
    options:
      - "To permanently disable scanning"
      - "To automatically patch the vulnerability"
      - "To document that a present CVE is not exploitable in your context (e.g. not reachable) rather than blanket-ignoring it"
      - "To convert HIGH severity to LOW"
    answer: 2
    explanation: |
      VEX formalizes "present but not exploitable" statements, and a justified
      `.trivyignore` records why a specific CVE is suppressed. This preserves an audit
      trail instead of silently hiding findings.
    ref: "concepts.md#scanning-in-ci-and-at-the-registry--gating-on-severity"

  - id: image-scanning-supply-chain-040
    difficulty: beginner
    tags: [admission-control, verification]
    question: |
      Why is signing images pointless without admission control (or DCT gating)?
    options:
      - "Signatures expire after one hour"
      - "Signing corrupts the image"
      - "Unless something verifies the signature and rejects unsigned/untrusted images at deploy time, a signature buys nothing"
      - "Admission control creates the signature"
    answer: 2
    explanation: |
      A signature only matters if a consumer verifies it and refuses to run unsigned
      or untrusted images. Without a verification/enforcement step (admission
      controller, or `DOCKER_CONTENT_TRUST=1` on a host), "we sign images" achieves
      nothing.
    ref: "concepts.md#admission-control--verifying-signatures-at-deploy"

  - id: image-scanning-supply-chain-041
    difficulty: advanced
    tags: [admission-control, tools]
    question: |
      Which tools are used to *verify* cosign signatures and enforce image policy at
      deploy time in a cluster?
    options:
      - "Syft and Grype"
      - "Trivy and Clair"
      - "BuildKit and Buildx"
      - "Sigstore policy-controller, Connaisseur, Kyverno, or OPA Gatekeeper"
    answer: 3
    explanation: |
      Sigstore policy-controller and Connaisseur verify cosign signatures on
      admission; Kyverno and OPA Gatekeeper are general policy engines with image
      verification rules. (Syft/Grype/Trivy/Clair scan; BuildKit builds.)
    ref: "concepts.md#admission-control--verifying-signatures-at-deploy"

  - id: image-scanning-supply-chain-042
    difficulty: intermediate
    tags: [admission-control, policy]
    question: |
      Which policy is a typical admission-control rule for supply-chain security?
    options:
      - "Only images signed by our CI identity, from approved registries, that passed scanning below a severity threshold may run"
      - "Only images larger than 1 GB may run"
      - "Only images tagged `latest` may run"
      - "Only images without an ENTRYPOINT may run"
    answer: 0
    explanation: |
      Admission controllers commonly enforce: signature from a trusted key/identity,
      origin from an approved registry, and passing scan results below a severity
      threshold — before scheduling the workload.
    ref: "concepts.md#admission-control--verifying-signatures-at-deploy"

  - id: image-scanning-supply-chain-043
    difficulty: advanced
    tags: [accuracy, backported-fixes, false-positive]
    question: |
      Trivy flags a Red Hat package as vulnerable, but Red Hat's advisory says it is
      patched. Why, and what is the fix?
    options:
      - "Trivy is broken; reinstall it"
      - "The package must be downgraded"
      - "Red Hat backported the security fix without bumping the upstream version, so a naive NVD version match over-reports; use a distro-advisory-aware (OVAL) scan"
      - "Red Hat images cannot be scanned"
    answer: 2
    explanation: |
      Distros backport fixes while keeping the version string unchanged. Matching only
      against NVD upstream versions produces false positives. Distro-aware scanners
      consult vendor advisories (Red Hat OVAL) to correctly account for backports.
    ref: "concepts.md#scanner-accuracy-false-positives--limitations"

  - id: image-scanning-supply-chain-044
    difficulty: advanced
    tags: [accuracy, reachability]
    question: |
      A classic scanner reports a CVE in a dependency your code never calls. What does
      this illustrate?
    options:
      - "The scanner is malfunctioning"
      - "The dependency must be deleted immediately"
      - "Presence always equals exploitability"
      - "Classic scanners report *presence* of a vulnerable component, not *exploitability/reachability*; a present-but-unreached CVE is lower risk"
    answer: 3
    explanation: |
      Most scanners report that a vulnerable version is present, not whether the
      vulnerable code path is reachable at runtime. Reachability analysis (newer tools)
      refines this; presence alone overstates risk for unused code paths.
    ref: "concepts.md#scanner-accuracy-false-positives--limitations"

  - id: image-scanning-supply-chain-045
    difficulty: intermediate
    tags: [accuracy, db-freshness]
    question: |
      Two runs of the same scanner on the same image give different CVE counts a week
      apart, with no image change. What is the most likely cause?
    options:
      - "The image mutated on disk"
      - "The vulnerability database was updated — new CVEs were disclosed against components already inside the (unchanged) image"
      - "The scanner randomly reports results"
      - "The registry re-signed the image"
    answer: 1
    explanation: |
      DB freshness is decisive. As new CVEs are published, a scan of the same
      unchanged image surfaces additional findings. This is exactly why continuous
      rescanning of already-published images matters.
    ref: "concepts.md#scanner-accuracy-false-positives--limitations"

  - id: image-scanning-supply-chain-046
    difficulty: intermediate
    tags: [accuracy, triage, program]
    question: |
      What is the recommended way to handle the flood of findings a scanner produces
      across many images?
    options:
      - "Block every deploy on any finding of any severity"
      - "Ignore all findings to avoid noise"
      - "Triage: gate on fixable Critical/High, track the rest against an SLA, and record suppressions with justification"
      - "Only scan once per year"
    answer: 2
    explanation: |
      Treating every finding as a hard blocker causes alert fatigue and ignored
      reports; ignoring everything is unsafe. Effective programs triage — gate on
      fixable Critical/High, SLA-track the rest, and document justified suppressions.
    ref: "concepts.md#scanner-accuracy-false-positives--limitations"

  - id: image-scanning-supply-chain-047
    difficulty: advanced
    tags: [accuracy, layer-attribution]
    question: |
      Tools like Docker Scout and Trivy can attribute a vulnerable package to a
      specific layer. Why is that useful?
    options:
      - "It makes the image smaller"
      - "It signs the affected layer"
      - "It encrypts the vulnerable layer"
      - "It shows whether the fix belongs in the base image or in one of your own RUN instructions, guiding remediation"
    answer: 3
    explanation: |
      Knowing which layer introduced a vulnerable package tells you whether to bump
      the base image (if it came from `FROM`) or fix your own instruction (if a `RUN`
      installed it), directing the remediation effort correctly.
    ref: "concepts.md#scanner-accuracy-false-positives--limitations"

  - id: image-scanning-supply-chain-048
    difficulty: intermediate
    tags: [ci, full-loop, signing, scanning]
    question: |
      What is the correct end-to-end order for a supply-chain-secure image pipeline?
    options:
      - "Deploy, then scan, then sign, then build"
      - "Sign → deploy → build → scan"
      - "Build → scan in CI (fail on Critical/High) → sign the digest → push → continuous registry rescan and admission-control signature verification at deploy"
      - "Push → build → sign → scan"
    answer: 2
    explanation: |
      The full loop: build the image, scan in CI and fail on Critical/High, sign the
      resulting digest (e.g. cosign), push, then continuously rescan at the registry
      and verify the signature via admission control before scheduling.
    ref: "concepts.md#scanning-in-ci-and-at-the-registry--gating-on-severity"
