topic: "Health Checks, Logging & Graceful Shutdown"
domain: docker
topic_slug: production-healthchecks-logging
schema: 1
pass: clarity-v1

prompts:
  - id: production-healthchecks-logging-p001
    ref: "concepts.md#why-orchestrators-need-health-signals"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a replica returns errors while `docker ps` still shows it `Up`, check what
      the platform is routing on — the running process, or an application health signal.
    answer_in: "concepts.md#why-orchestrators-need-health-signals"

  - id: production-healthchecks-logging-p002
    ref: "concepts.md#healthcheck-options-and-defaults"
    kind: predict-failure
    tier: A
    prompt: |
      The defaults make `--timeout` and `--interval` both 30s. A probe hangs and never
      returns. How long can it tie up before it is finally scored a failure?
    hint: "Compare the timeout against the interval."
    answer_in: "concepts.md#healthcheck-options-and-defaults"

  - id: production-healthchecks-logging-p003
    ref: "concepts.md#health-states-and-state-transitions"
    kind: predict-failure
    tier: A
    prompt: |
      To detect a dead backend faster you set `--retries=1`. Name the new failure mode you
      just bought, and the kind of noise that now flips the container `unhealthy`.
    hint: "Retries demand *consecutive* failures for a reason."
    answer_in: "concepts.md#health-states-and-state-transitions"

  - id: production-healthchecks-logging-p004
    ref: "concepts.md#health-check-gotchas-in-real-dockerfiles"
    kind: refute
    tier: A
    prompt: |
      A teammate's PR comment: "The probe passes locally with `curl localhost/health`, so
      it is fine on our distroless image." What breaks, and what state does the container land in?
    hint: "What is installed on distroless, and what does the probe exit with when it is missing?"
    answer_in: "concepts.md#health-check-gotchas-in-real-dockerfiles"

  - id: production-healthchecks-logging-p005
    ref: "concepts.md#health-check-vs-kubernetes-livenessreadinessstartup-probes"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a pod restart-loops whenever a downstream dependency is slow, check whether
      that dependency check is wired into the liveness probe instead of readiness.
    answer_in: "concepts.md#health-check-vs-kubernetes-livenessreadinessstartup-probes"

  - id: production-healthchecks-logging-p006
    ref: "concepts.md#the-container-logging-model-stdoutstderr"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you exec into a container and find an app-written `*.log` file growing inside
      it, note that `docker logs` cannot see it and it dies with the container.
    answer_in: "concepts.md#the-container-logging-model-stdoutstderr"

  - id: production-healthchecks-logging-p007
    ref: "concepts.md#the-json-file-driver-and-log-rotation-avoiding-disk-fill"
    kind: predict-failure
    tier: A
    prompt: |
      You add `max-size` and `max-file` to `daemon.json` and restart Docker, but the container
      that filled the disk keeps growing. Why did the new setting not apply to it?
    hint: "What does a `daemon.json` change apply to — existing containers, or new ones?"
    answer_in: "concepts.md#the-json-file-driver-and-log-rotation-avoiding-disk-fill"

  - id: production-healthchecks-logging-p008
    ref: "concepts.md#what-it-costs-across-a-fleet-the-disk-budget-math"
    kind: draw-the-boundary
    tier: C
    prompt: |
      The docs call the `local` driver's on-disk format only "internal" and "compact." Go find
      what that encoding actually is.
    hint: "The daemon is the only reader; look at where it writes the log."
    answer_in: external
    search_hint: |
      Docker Engine source under `daemon/logger/local/` (the `local` log driver), plus the
      logging drivers/local docs page — which describes the format but may never name it.
    success_criterion: |
      You can name the actual encoding (for example, whether it is protobuf-framed) and cite the
      Docker source file or docs line that states it. If no public source ever names it, recording
      that the format is undocumented is itself the finding.

  - id: production-healthchecks-logging-p009
    ref: "concepts.md#other-logging-drivers"
    kind: predict-failure
    tier: A
    prompt: |
      A latency-sensitive service uses the `fluentd` log driver in its default delivery mode.
      The Fluentd host becomes unreachable. What happens to the service's request latency?
    hint: "The default delivery mode is blocking."
    answer_in: "concepts.md#other-logging-drivers"

  - id: production-healthchecks-logging-p010
    ref: "concepts.md#graceful-shutdown-docker-stop-sigterm-and-the-grace-period"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time `docker stop` on a container takes the full grace period every single time
      before exiting, check whether the app installs a handler for the stop signal at all.
    answer_in: "concepts.md#graceful-shutdown-docker-stop-sigterm-and-the-grace-period"

  - id: production-healthchecks-logging-p011
    ref: "concepts.md#pid-1-signal-forwarding-and-the-exec-form-requirement"
    kind: refute
    tier: A
    prompt: |
      A colleague says: "We switched to the exec form, so the app is PID 1 — shutdown is
      handled." The app forks worker subprocesses. What did they still miss?
    hint: "PID 1 has a second job besides receiving signals."
    answer_in: "concepts.md#pid-1-signal-forwarding-and-the-exec-form-requirement"

  - id: production-healthchecks-logging-p012
    ref: "concepts.md#draining-in-flight-requests-during-shutdown"
    kind: predict-failure
    tier: A
    prompt: |
      Your Node service calls `server.close()` on SIGTERM and exits in the callback. Under
      keep-alive traffic it still runs out the whole grace period to SIGKILL. Why?
    hint: "What does `server.close()` do to idle keep-alive sockets that are open between requests?"
    answer_in: "concepts.md#draining-in-flight-requests-during-shutdown"

cliffhanger:
  from: production-healthchecks-logging
  pattern: A
  hook: |
    This topic taught the whole shutdown negotiation: trap SIGTERM, stop accepting, drain, and
    exit inside the grace period. It never once said how you find out whether the app actually
    caught the signal. The rule "handle SIGTERM and you shut down cleanly" has no observable
    attached to it. You ran `docker stop`; the container is gone; `docker ps -a` shows
    `Exited (N)`. Was that a clean exit on the signal, or did the app ignore it and get
    force-killed when the grace period ran out? Or was it never a shutdown problem at all, and
    the kernel killed the process for something else entirely? The exit code N answers all
    three, and reading it is the next topic's first tool.
  teaser_questions:
    - "After a `docker stop`, how do you tell a clean signal-driven exit from a force-kill at the end of the timeout?"
    - "When a container is force-killed, how do you tell an out-of-memory kill from a stop-timeout escalation?"
  payoff:
    anchor: "concepts.md#exit-codes-oomkilled-137-sigterm-143-and-friends"
    claim: |
      The next topic's exit-code table maps `Exited (N)` to its cause: 143 is a clean SIGTERM
      exit, 137 is SIGKILL (an OOM kill, or a stop-timeout escalation after the app ignored
      SIGTERM), and the `.State.OOMKilled` flag separates the two 137 cases.
