topic: "Health Checks, Logging & Graceful Shutdown"
domain: docker
topic_slug: production-healthchecks-logging
version: 1
questions:
  - id: production-healthchecks-logging-001
    difficulty: beginner
    tags: [healthcheck, basics]
    question: |
      What does a Docker `HEALTHCHECK` command's exit code of 0 mean?
    options:
      - "The container is healthy"
      - "The container is unhealthy"
      - "The check is reserved / undefined"
      - "The check timed out"
    answer: 0
    explanation: |
      The health check's exit code is the whole contract: 0 = healthy (success), 1 =
      unhealthy, and 2 is reserved and must not be used. Docker runs the command inside
      the container and reads its exit code.
    ref: "concepts.md#the-healthcheck-instruction"

  - id: production-healthchecks-logging-002
    difficulty: beginner
    tags: [healthcheck, exit-codes]
    question: |
      In a `HEALTHCHECK CMD`, which exit code is explicitly reserved and should not be
      used by your check?
    options:
      - "0"
      - "1"
      - "2"
      - "127"
    answer: 2
    explanation: |
      Exit code 0 = healthy, 1 = unhealthy, and 2 is reserved with undefined behavior —
      you should never make your health command exit 2.
    ref: "concepts.md#the-healthcheck-instruction"

  - id: production-healthchecks-logging-003
    difficulty: beginner
    tags: [healthcheck, states]
    question: |
      What is the initial health state of a container that has just started with a
      defined HEALTHCHECK?
    options:
      - "healthy"
      - "unhealthy"
      - "starting"
      - "pending"
    answer: 2
    explanation: |
      A container with a health check begins in the `starting` state. It moves to
      `healthy` after a check succeeds, or to `unhealthy` after enough consecutive
      failures (once the start period is over).
    ref: "concepts.md#health-states-and-state-transitions"

  - id: production-healthchecks-logging-004
    difficulty: beginner
    tags: [logging, twelve-factor]
    question: |
      Following the 12-factor approach, where should a containerized application write its
      logs?
    options:
      - "To stdout/stderr, letting the platform capture the stream"
      - "To a rotating file inside /var/log in the container"
      - "Directly to a database it manages itself"
      - "To a file on a bind-mounted host volume it creates"
    answer: 0
    explanation: |
      The 12-factor rule is that the app treats logs as an event stream written to
      stdout/stderr and does not manage log files. The runtime/logging driver decides
      where the stream is stored or shipped.
    ref: "concepts.md#the-container-logging-model-stdoutstderr"

  - id: production-healthchecks-logging-005
    difficulty: beginner
    tags: [logging, drivers, defaults]
    question: |
      What is Docker's default logging driver?
    options:
      - "json-file"
      - "journald"
      - "local"
      - "syslog"
    answer: 0
    explanation: |
      `json-file` is the default driver; it writes each log line as a JSON object to a
      file under /var/lib/docker/containers/. `docker logs` replays that file.
    ref: "concepts.md#the-json-file-driver-and-log-rotation-avoiding-disk-fill"

  - id: production-healthchecks-logging-006
    difficulty: beginner
    tags: [graceful-shutdown, signals]
    question: |
      Which signal does `docker stop` send to the container's PID 1 first?
    options:
      - "SIGHUP"
      - "SIGKILL"
      - "SIGTERM"
      - "SIGINT"
    answer: 2
    explanation: |
      `docker stop` sends SIGTERM first, waits the grace period (default 10s), then sends
      SIGKILL if the process is still running. `docker kill` skips straight to SIGKILL.
    ref: "concepts.md#graceful-shutdown-docker-stop-sigterm-and-the-grace-period"

  - id: production-healthchecks-logging-007
    difficulty: beginner
    tags: [graceful-shutdown, grace-period]
    question: |
      What is the default grace period `docker stop` waits before sending SIGKILL?
    options:
      - "0 seconds (immediate SIGKILL)"
      - "5 seconds"
      - "10 seconds"
      - "60 seconds"
    answer: 2
    explanation: |
      The default stop timeout is 10 seconds. After SIGTERM, Docker waits 10s (adjustable
      with `docker stop -t`, `--stop-timeout`, or Compose `stop_grace_period`) before
      SIGKILL.
    ref: "concepts.md#graceful-shutdown-docker-stop-sigterm-and-the-grace-period"

  - id: production-healthchecks-logging-008
    difficulty: intermediate
    tags: [healthcheck, options, defaults]
    question: |
      In `HEALTHCHECK --interval=30s --timeout=3s --retries=3 CMD ...`, what does
      `--retries=3` control?
    options:
      - "The number of consecutive check failures needed to mark the container unhealthy"
      - "How many parallel checks run at once"
      - "How many times to retry starting the container"
      - "The number of checks that must pass before healthy"
    answer: 0
    explanation: |
      `--retries` is the number of *consecutive* failures required to transition to
      `unhealthy`. A single success resets the failing streak.
    ref: "concepts.md#healthcheck-options-and-defaults"

  - id: production-healthchecks-logging-009
    difficulty: intermediate
    tags: [healthcheck, start-period, slow-boot]
    question: |
      A JVM service takes ~40s to boot. Which HEALTHCHECK option prevents those early
      boot-time failures from marking the container unhealthy?
    options:
      - "--timeout"
      - "--start-period"
      - "--interval"
      - "--retries"
    answer: 1
    explanation: |
      `--start-period` defines a bootstrap window during which failing checks do NOT count
      toward retries, and a single success ends the period early. It's the right knob for
      slow-starting apps.
    ref: "concepts.md#healthcheck-options-and-defaults"

  - id: production-healthchecks-logging-010
    difficulty: intermediate
    tags: [healthcheck, restart, gotcha]
    question: |
      A container is defined with a HEALTHCHECK and `restart: unless-stopped`, but nothing
      else (plain Docker, no orchestrator). The check starts failing and the container is
      marked `unhealthy`. What happens?
    options:
      - "Docker automatically restarts the container because it's unhealthy"
      - "Nothing restarts it; plain Docker only reports the unhealthy status"
      - "The container is immediately removed"
      - "Docker sends SIGTERM to force a graceful restart"
    answer: 1
    explanation: |
      Plain Docker only *reports* health; it doesn't act on it. `restart` reacts to the
      process *exiting*, not to `unhealthy`. Something must consume the status (Swarm, a
      load balancer, an autoheal sidecar) to take action.
    ref: "concepts.md#health-states-and-state-transitions"

  - id: production-healthchecks-logging-011
    difficulty: intermediate
    tags: [healthcheck, distroless, gotcha]
    question: |
      A Dockerfile using a `distroless` base has `HEALTHCHECK CMD curl -f http://localhost:8080/health || exit 1`.
      The container is always `unhealthy`. What is the most likely cause?
    options:
      - "curl is not installed in the distroless image, so the check always fails"
      - "HEALTHCHECK is not supported on distroless"
      - "distroless images block localhost connections"
      - "The exit 1 forces it to always fail"
    answer: 0
    explanation: |
      Distroless/scratch/minimal images often lack `curl`. The command can't run, so it
      fails every time. Use a tool that exists (e.g. wget on alpine) or ship a
      self-contained health binary like `CMD ["/app","-healthcheck"]`.
    ref: "concepts.md#health-check-gotchas-in-real-dockerfiles"

  - id: production-healthchecks-logging-012
    difficulty: intermediate
    tags: [logging, rotation, disk-fill]
    question: |
      A production host running many chatty containers runs out of disk in
      /var/lib/docker and the daemon dies. The containers use default logging. What is the
      most likely root cause?
    options:
      - "The images were too large"
      - "json-file logs were never rotated and grew until the disk filled"
      - "Too many volumes were created"
      - "The overlay2 storage driver leaks space by design"
    answer: 1
    explanation: |
      The default `json-file` driver does NOT rotate logs by default. A verbose container
      grows its log file until the disk fills, taking down the daemon. The fix is
      `max-size`/`max-file`, or the `local` driver (which rotates by default).
    ref: "concepts.md#the-json-file-driver-and-log-rotation-avoiding-disk-fill"

  - id: production-healthchecks-logging-013
    difficulty: intermediate
    tags: [graceful-shutdown, pid1, shell-form]
    question: |
      A Dockerfile uses `CMD java -jar app.jar` (shell form). On `docker stop`, the app
      never shuts down cleanly and always takes the full 10s before being killed. Why?
    options:
      - "Java can't handle SIGTERM"
      - "docker stop doesn't send any signal in shell form"
      - "PID 1 is /bin/sh, which receives SIGTERM but doesn't forward it to the java child"
      - "The grace period is too short for Java"
    answer: 2
    explanation: |
      Shell form makes `/bin/sh -c` PID 1, and the app runs as its child. `/bin/sh`
      typically does not forward SIGTERM to the child, so java never sees it and is
      SIGKILLed after the grace period. Use exec form so java is PID 1.
    ref: "concepts.md#pid-1-signal-forwarding-and-the-exec-form-requirement"

  - id: production-healthchecks-logging-014
    difficulty: intermediate
    tags: [graceful-shutdown, exec-form, fix]
    question: |
      Which Dockerfile change ensures the application process receives SIGTERM directly on
      `docker stop`?
    options:
      - "Change `CMD java -jar app.jar` to `CMD [\"java\", \"-jar\", \"app.jar\"]` (exec form)"
      - "Add `STOPSIGNAL SIGKILL`"
      - "Increase the grace period to 60s"
      - "Run the container with `--rm`"
    answer: 0
    explanation: |
      The exec form (JSON array) makes the app PID 1, so SIGTERM reaches it directly.
      Shell form interposes /bin/sh as PID 1, which swallows the signal.
    ref: "concepts.md#pid-1-signal-forwarding-and-the-exec-form-requirement"

  - id: production-healthchecks-logging-015
    difficulty: intermediate
    tags: [graceful-shutdown, tini, zombies]
    question: |
      What problem does adding `tini` (or `docker run --init`) as PID 1 solve, beyond
      signal forwarding?
    options:
      - "It makes images smaller"
      - "It reaps zombie (defunct) child processes that the app leaves behind"
      - "It encrypts the container filesystem"
      - "It rotates logs automatically"
    answer: 1
    explanation: |
      An init process like tini forwards signals AND reaps reparented zombie processes —
      a responsibility of PID 1 that many apps don't implement. `--init` bundles tini.
    ref: "concepts.md#pid-1-signal-forwarding-and-the-exec-form-requirement"

  - id: production-healthchecks-logging-016
    difficulty: intermediate
    tags: [kubernetes, liveness, readiness, pointer]
    question: |
      Does Kubernetes use the Docker `HEALTHCHECK` instruction defined in an image?
    options:
      - "Yes, it reads HEALTHCHECK and treats it as the liveness probe"
      - "Only if no probes are set on the Pod"
      - "No, Kubernetes ignores it and defines its own liveness/readiness/startup probes"
      - "Yes, but only for readiness routing"
    answer: 2
    explanation: |
      Kubernetes ignores the Docker HEALTHCHECK entirely. Health is configured via Pod
      liveness, readiness, and startup probes. (Kubernetes is covered in its own domain.)
    ref: "concepts.md#health-check-vs-kubernetes-livenessreadinessstartup-probes"

  - id: production-healthchecks-logging-017
    difficulty: intermediate
    tags: [kubernetes, liveness, readiness]
    question: |
      In Kubernetes, what is the core distinction between a liveness probe and a readiness
      probe?
    options:
      - "Liveness runs once, readiness runs continuously"
      - "Liveness decides whether to restart the container; readiness decides whether to route traffic to it"
      - "They are identical; the names are interchangeable"
      - "Readiness restarts the pod, liveness removes it from DNS"
    answer: 1
    explanation: |
      Liveness = should we restart it. Readiness = should it receive traffic. Collapsing
      the two causes restart storms (e.g. failing liveness on a slow dependency).
    ref: "concepts.md#health-check-vs-kubernetes-livenessreadinessstartup-probes"

  - id: production-healthchecks-logging-018
    difficulty: intermediate
    tags: [logging, docker-logs, drivers]
    question: |
      You configured the `awslogs` driver and now `docker logs <container>` returns
      nothing. Why?
    options:
      - "The container has no stdout output"
      - "awslogs disables logging entirely"
      - "`docker logs` only works with json-file, local, and journald drivers"
      - "You must run `docker logs --remote`"
    answer: 2
    explanation: |
      `docker logs` can only read logs stored in a way it understands: `json-file`,
      `local`, and `journald`. With `awslogs`, `fluentd`, `splunk`, `gelf`, etc., you must
      view logs in the backend.
    ref: "concepts.md#other-logging-drivers"

  - id: production-healthchecks-logging-019
    difficulty: advanced
    tags: [logging, delivery-mode, blocking]
    question: |
      With the default `blocking` log delivery mode, what can happen to your application
      if the logging backend becomes slow or unreachable and the buffer fills?
    options:
      - "Logs are silently dropped with no effect on the app"
      - "The app's write to stdout blocks, potentially stalling or hanging the application"
      - "Docker automatically switches to json-file"
      - "The container is marked unhealthy"
    answer: 1
    explanation: |
      In blocking mode, if the driver buffer is full the container's write to stdout
      blocks — a stuck backend can stall the app. `mode=non-blocking` with a
      `max-buffer-size` drops logs instead of blocking.
    ref: "concepts.md#other-logging-drivers"

  - id: production-healthchecks-logging-020
    difficulty: intermediate
    tags: [healthcheck, network-namespace, gotcha]
    question: |
      A container publishes port 8080 to host port 9090. Inside a HEALTHCHECK, which
      address should the probe use to reach the app?
    options:
      - "http://<host-ip>:9090 (the published host port)"
      - "http://localhost:8080 (inside the container's network namespace)"
      - "http://0.0.0.0:9090"
      - "http://docker.internal:8080"
    answer: 1
    explanation: |
      The health check runs inside the container's own network namespace, so it should
      target the container's internal port via localhost/127.0.0.1 — the host-published
      port is irrelevant from inside.
    ref: "concepts.md#health-check-gotchas-in-real-dockerfiles"

  - id: production-healthchecks-logging-021
    difficulty: intermediate
    tags: [healthcheck, override, none]
    question: |
      Your base image defines a HEALTHCHECK you don't want. How do you disable it in your
      Dockerfile?
    options:
      - "Delete the base image's HEALTHCHECK line"
      - "Set `--retries=0`"
      - "Add `HEALTHCHECK NONE`"
      - "Add `HEALTHCHECK DISABLE`"
    answer: 2
    explanation: |
      `HEALTHCHECK NONE` disables any inherited health check. Only the last HEALTHCHECK in
      a Dockerfile takes effect, so this overrides the base image's.
    ref: "concepts.md#the-healthcheck-instruction"

  - id: production-healthchecks-logging-022
    difficulty: advanced
    tags: [graceful-shutdown, draining, load-balancer, race]
    question: |
      An app correctly handles SIGTERM and drains, yet users still see occasional
      connection errors during deploys. What is the most likely cause?
    options:
      - "The app isn't handling SIGTERM after all"
      - "A deregistration race: the LB is still routing new requests while the app has begun shutting down"
      - "The grace period is too long"
      - "json-file logging is blocking the app"
    answer: 1
    explanation: |
      SIGTERM and endpoint removal aren't atomic. There's a window where the LB still
      routes to a shutting-down container. Mitigate with a preStop delay / brief sleep so
      the app keeps serving until the LB deregisters it.
    ref: "concepts.md#draining-in-flight-requests-during-shutdown"

  - id: production-healthchecks-logging-023
    difficulty: advanced
    tags: [graceful-shutdown, draining, sequence]
    question: |
      What is the correct FIRST action an app should take on receiving SIGTERM for a
      graceful shutdown?
    options:
      - "Immediately call exit(0)"
      - "Send SIGKILL to itself"
      - "Open more connections to warm the pool"
      - "Stop accepting new connections/requests while letting in-flight ones finish"
    answer: 3
    explanation: |
      Graceful shutdown: stop accepting new work first (close the listener / fail
      readiness), let in-flight requests complete up to a deadline, close resources, then
      exit 0. Exiting immediately drops in-flight requests.
    ref: "concepts.md#draining-in-flight-requests-during-shutdown"

  - id: production-healthchecks-logging-024
    difficulty: beginner
    tags: [orchestration, health, routing]
    question: |
      Why do orchestrators and load balancers rely on health signals rather than just
      "is the process running?"
    options:
      - "Because a running process can still be unable to serve (deadlocked, warming up, dependencies down)"
      - "Because processes always exit when they fail"
      - "Because health checks make containers start faster"
      - "Because the kernel can't tell if a process is running"
    answer: 0
    explanation: |
      A process being alive doesn't mean it can serve. Health checks give an
      application-level readiness/health signal so the platform routes traffic only to
      replicas that actually work.
    ref: "concepts.md#why-orchestrators-need-health-signals"

  - id: production-healthchecks-logging-025
    difficulty: intermediate
    tags: [logging, files-in-container, gotcha]
    question: |
      Why is writing application logs to a file inside the container (e.g.
      /app/logs/app.log) discouraged?
    options:
      - "Files inside containers are read-only"
      - "Docker forbids file writes entirely"
      - "The logs die with the container, aren't visible to `docker logs`, and grow the writable layer"
      - "It automatically triggers SIGTERM"
    answer: 2
    explanation: |
      Log files in the container's writable layer are ephemeral, hidden from `docker logs`
      and centralized logging, and bloat the writable layer. Log to stdout/stderr and let
      the platform route.
    ref: "concepts.md#the-container-logging-model-stdoutstderr"

  - id: production-healthchecks-logging-026
    difficulty: intermediate
    tags: [logging, nginx, stdout-symlink]
    question: |
      The official nginx image runs `ln -sf /dev/stdout /var/log/nginx/access.log`. What
      does this accomplish?
    options:
      - "It disables access logging"
      - "It compresses the logs"
      - "It rotates the log daily"
      - "It redirects the log file writes to stdout so the log stream is captured by Docker"
    answer: 3
    explanation: |
      Symlinking the log file to /dev/stdout (and error.log to /dev/stderr) forces a tool
      that insists on writing to a file to instead emit to the captured streams, so
      `docker logs` and the logging driver see the output.
    ref: "concepts.md#the-container-logging-model-stdoutstderr"

  - id: production-healthchecks-logging-027
    difficulty: intermediate
    tags: [logging, json-file, rotation-config]
    question: |
      Which `daemon.json` configuration enables log rotation for the default driver?
    options:
      - '{"log-driver": "json-file", "log-opts": {"max-size": "10m", "max-file": "3"}}'
      - '{"log-driver": "json-file", "rotate": true}'
      - '{"log-rotation": "daily"}'
      - '{"log-driver": "json-file", "max-log": "100"}'
    answer: 0
    explanation: |
      `max-size` (per file) and `max-file` (number of rotated files) under `log-opts`
      enable rotation. Values must be strings. Note this only applies to newly created
      containers.
    ref: "concepts.md#the-json-file-driver-and-log-rotation-avoiding-disk-fill"

  - id: production-healthchecks-logging-028
    difficulty: advanced
    tags: [logging, daemon-json, recreate]
    question: |
      You edit `daemon.json` to add log rotation and restart the daemon, but an existing
      long-running container's logs still don't rotate. Why?
    options:
      - "The daemon needs a reboot of the host"
      - "max-size must be at least 100m to take effect"
      - "json-file never rotates regardless of settings"
      - "Log settings apply only to newly created containers; existing ones keep their original settings until recreated"
    answer: 3
    explanation: |
      Changing the daemon default only affects containers created afterward. Existing
      containers retain the driver/options they were created with — you must recreate them.
    ref: "concepts.md#the-json-file-driver-and-log-rotation-avoiding-disk-fill"

  - id: production-healthchecks-logging-029
    difficulty: intermediate
    tags: [logging, local-driver]
    question: |
      What advantage does the `local` logging driver have over `json-file` out of the box?
    options:
      - "It ships logs to CloudWatch automatically"
      - "It rotates logs by default and uses a more compact, efficient on-disk format"
      - "It supports `docker logs` while json-file does not"
      - "It encrypts logs"
    answer: 1
    explanation: |
      The `local` driver rotates by default (20 MB × 5 files, ~100 MB per container) and
      uses a more efficient format, making it a safer single-host default than the
      non-rotating `json-file`.
    ref: "concepts.md#the-json-file-driver-and-log-rotation-avoiding-disk-fill"

  - id: production-healthchecks-logging-030
    difficulty: intermediate
    tags: [graceful-shutdown, docker-kill]
    question: |
      How does `docker kill` differ from `docker stop` by default?
    options:
      - "docker kill sends SIGTERM, docker stop sends SIGKILL"
      - "They are identical"
      - "docker kill only pauses the container"
      - "docker kill sends SIGKILL immediately with no grace period; docker stop sends SIGTERM then waits"
    answer: 3
    explanation: |
      `docker kill` sends SIGKILL immediately (no chance to clean up). `docker stop` sends
      SIGTERM, waits the grace period, then SIGKILL if still running.
    ref: "concepts.md#graceful-shutdown-docker-stop-sigterm-and-the-grace-period"

  - id: production-healthchecks-logging-031
    difficulty: advanced
    tags: [graceful-shutdown, stopsignal, nginx]
    question: |
      An app expects `SIGQUIT` for graceful shutdown rather than SIGTERM. How do you make
      `docker stop` send SIGQUIT first?
    options:
      - "It's impossible; docker stop always sends SIGTERM"
      - "Set `--restart=on-signal`"
      - "Use the `STOPSIGNAL SIGQUIT` Dockerfile instruction (or `--stop-signal`)"
      - "Rename the process to nginx"
    answer: 2
    explanation: |
      `STOPSIGNAL` (or `docker run --stop-signal`) changes which signal `docker stop` sends
      first. nginx, for example, does a graceful quit on SIGQUIT.
    ref: "concepts.md#graceful-shutdown-docker-stop-sigterm-and-the-grace-period"

  - id: production-healthchecks-logging-032
    difficulty: intermediate
    tags: [healthcheck, inspect, observability]
    question: |
      Which command shows the recent probe results (exit codes and output) of a
      container's health check?
    options:
      - "docker health web"
      - "docker stats web"
      - "docker logs --health web"
      - "docker inspect --format '{{json .State.Health}}' web"
    answer: 3
    explanation: |
      `docker inspect` exposes `.State.Health` with `.Status`, `.FailingStreak`, and a
      `.Log[]` array of recent probes (Start, End, ExitCode, Output). `docker ps` shows
      the summary status.
    ref: "concepts.md#health-states-and-state-transitions"

  - id: production-healthchecks-logging-033
    difficulty: advanced
    tags: [healthcheck, deep-check, flapping]
    question: |
      Why can a health/liveness endpoint that checks every downstream dependency be
      dangerous under load?
    options:
      - "It uses too much disk"
      - "It always returns 200"
      - "Docker forbids network calls in health checks"
      - "It can flap and cause cascading unhealthiness/restarts when a dependency is briefly slow"
    answer: 3
    explanation: |
      A deep dependency check turns any downstream blip into mass unhealthiness (and, on
      liveness, restart storms). Keep liveness cheap; put dependency checks in readiness.
    ref: "concepts.md#health-check-gotchas-in-real-dockerfiles"

  - id: production-healthchecks-logging-034
    difficulty: intermediate
    tags: [healthcheck, exec-shell-form]
    question: |
      What is the difference between `HEALTHCHECK CMD wget -q localhost/health || exit 1`
      and `HEALTHCHECK CMD ["wget","-q","localhost/health"]`?
    options:
      - "No difference"
      - "The second is invalid syntax"
      - "The first runs via /bin/sh (shell form, allows ||); the second runs directly (exec form, no shell/no ||)"
      - "The first disables the check"
    answer: 2
    explanation: |
      A shell-string CMD runs through `/bin/sh -c`, so shell features like `||` and
      variable expansion work. The JSON-array (exec) form runs the binary directly with no
      shell, so `||` and `$VARS` are not interpreted.
    ref: "concepts.md#health-check-gotchas-in-real-dockerfiles"

  - id: production-healthchecks-logging-035
    difficulty: intermediate
    tags: [compose, healthcheck, depends-on]
    question: |
      In Compose, what does `depends_on: { db: { condition: service_healthy } }` require?
    options:
      - "The db container's process to be running"
      - "The db image to be built"
      - "A volume named db to exist"
      - "The db container to report a `healthy` status from its health check before the dependent starts"
    answer: 3
    explanation: |
      `condition: service_healthy` gates startup on the dependency's *health* status
      (from its HEALTHCHECK), not merely on the process running — useful so an app waits
      until the DB is actually ready.
    ref: "concepts.md#why-orchestrators-need-health-signals"

  - id: production-healthchecks-logging-036
    difficulty: advanced
    tags: [graceful-shutdown, grace-period, sizing]
    question: |
      Your longest in-flight requests take up to 25s, but the stop grace period is the
      default 10s. What is the consequence during a rolling deploy?
    options:
      - "Nothing; Docker extends the timeout automatically"
      - "Requests still in flight after 10s are cut off when the container is SIGKILLed"
      - "The deploy is blocked until requests finish"
      - "The container refuses to stop"
    answer: 1
    explanation: |
      SIGKILL fires after the grace period regardless of in-flight work. If the grace
      period is shorter than your longest request, those requests are truncated. Set the
      grace period longer than the longest expected request plus drain time.
    ref: "concepts.md#draining-in-flight-requests-during-shutdown"

  - id: production-healthchecks-logging-037
    difficulty: beginner
    tags: [logging, drivers, journald]
    question: |
      Which of these logging drivers writes container logs to the systemd journal?
    options:
      - "fluentd"
      - "awslogs"
      - "gelf"
      - "journald"
    answer: 3
    explanation: |
      The `journald` driver sends logs to the systemd journal (queryable by metadata).
      It's also one of the three drivers `docker logs` can read.
    ref: "concepts.md#other-logging-drivers"

  - id: production-healthchecks-logging-038
    difficulty: intermediate
    tags: [logging, drivers, aws]
    question: |
      On AWS ECS/Fargate, which built-in Docker logging driver ships container logs
      directly to CloudWatch Logs?
    options:
      - "splunk"
      - "gelf"
      - "awslogs"
      - "syslog"
    answer: 2
    explanation: |
      The `awslogs` driver sends stdout/stderr straight to Amazon CloudWatch Logs,
      commonly used on ECS/Fargate. Note `docker logs` won't show these — view them in
      CloudWatch.
    ref: "concepts.md#other-logging-drivers"

  - id: production-healthchecks-logging-039
    difficulty: advanced
    tags: [healthcheck, states, transitions]
    question: |
      A container is `healthy`. Its check then fails 3 consecutive times (retries=3, start
      period long over). What state is it in, and did Docker restart it?
    options:
      - "healthy; no restart"
      - "unhealthy; and Docker automatically restarts it"
      - "unhealthy; but Docker does not restart it (report-only)"
      - "starting; and it resets the timer"
    answer: 2
    explanation: |
      After `--retries` consecutive failures it transitions healthy → unhealthy. Docker
      only reports this; it does not restart the container. An external consumer must act.
    ref: "concepts.md#health-states-and-state-transitions"

  - id: production-healthchecks-logging-040
    difficulty: advanced
    tags: [graceful-shutdown, node, drain-code]
    question: |
      In a Node HTTP server, which pattern correctly begins draining on SIGTERM?
    options:
      - "process.on('SIGTERM', () => process.exit(0)) immediately"
      - "server.on('SIGTERM', () => server.listen())"
      - "Ignoring SIGTERM so requests never drop"
      - "process.on('SIGTERM', () => server.close(() => { pool.end(); process.exit(0); }))"
    answer: 3
    explanation: |
      `server.close()` stops accepting new connections and invokes the callback once
      in-flight requests finish; then you close the DB pool and exit 0. A safety timer
      should force-exit before SIGKILL. Exiting immediately drops in-flight work.
    ref: "concepts.md#draining-in-flight-requests-during-shutdown"

  - id: production-healthchecks-logging-041
    difficulty: intermediate
    tags: [graceful-shutdown, run-init]
    question: |
      What does the `docker run --init` flag do?
    options:
      - "Runs the container's entrypoint twice"
      - "Initializes a named volume"
      - "Sets the restart policy to always"
      - "Injects a tiny init process (tini) as PID 1 to forward signals and reap zombies"
    answer: 3
    explanation: |
      `--init` runs a bundled tini as PID 1 in front of your process, giving you signal
      forwarding and zombie reaping without editing the Dockerfile.
    ref: "concepts.md#pid-1-signal-forwarding-and-the-exec-form-requirement"

  - id: production-healthchecks-logging-042
    difficulty: intermediate
    tags: [healthcheck, options, timeout]
    question: |
      What happens if a health check command runs longer than the `--timeout` duration?
    options:
      - "The result is ignored"
      - "The interval is doubled"
      - "It is treated as a failed check"
      - "The container is paused"
    answer: 2
    explanation: |
      A check that exceeds `--timeout` counts as a failure. Keep timeout well under the
      interval and keep the probe cheap so a slow probe doesn't cause false unhealthiness.
    ref: "concepts.md#healthcheck-options-and-defaults"

  - id: production-healthchecks-logging-043
    difficulty: expert
    tags: [healthcheck, defaults, values]
    question: |
      If a Dockerfile has `HEALTHCHECK CMD curl -f localhost/health` with no options, what
      interval, timeout, and retries apply?
    options:
      - "interval 10s, timeout 10s, retries 1"
      - "interval 60s, timeout 5s, retries 5"
      - "interval 30s, timeout 30s, retries 3"
      - "no defaults; the check never runs without explicit options"
    answer: 2
    explanation: |
      The defaults are interval 30s, timeout 30s, start-period 0s, and retries 3. They
      apply whenever the corresponding option is omitted.
    ref: "concepts.md#healthcheck-options-and-defaults"

  - id: production-healthchecks-logging-044
    difficulty: expert
    tags: [start-period, start-interval]
    question: |
      During the `--start-period`, how does Docker treat check results?
    options:
      - "All results are ignored until the period fully elapses"
      - "Failures immediately mark the container unhealthy"
      - "The container is paused for the whole period"
      - "Failures don't count toward retries, and a single success ends the start period early"
    answer: 3
    explanation: |
      In the start period, failing checks are not counted toward `--retries`, giving a
      slow app time to boot. A single successful check ends the start period; thereafter
      failures count normally. (`--start-interval` governs probe spacing during this window.)
    ref: "concepts.md#healthcheck-options-and-defaults"

  - id: production-healthchecks-logging-045
    difficulty: expert
    tags: [pid1, kernel, signals]
    question: |
      Why does an application running as PID 1 with no SIGTERM handler simply ignore
      SIGTERM (rather than terminating by default)?
    options:
      - "Docker strips signals from PID 1"
      - "SIGTERM can only be sent to child processes"
      - "PID 1 automatically converts SIGTERM to SIGCHLD"
      - "The kernel does not apply default signal dispositions to PID 1, so unhandled signals are ignored"
    answer: 3
    explanation: |
      The kernel treats PID 1 specially: default signal actions (like terminate on
      SIGTERM) are not applied unless the process explicitly installs a handler. So an app
      as PID 1 with no handler ignores SIGTERM and is only stopped by SIGKILL.
    ref: "concepts.md#pid-1-signal-forwarding-and-the-exec-form-requirement"

  - id: production-healthchecks-logging-046
    difficulty: advanced
    tags: [compose, healthcheck, override]
    question: |
      In a Compose file, how do you disable a health check inherited from the image
      without editing the Dockerfile?
    options:
      - "healthcheck: { disable: true } or test: [\"NONE\"]"
      - "restart: never"
      - "remove the image tag"
      - "set retries: 0"
    answer: 0
    explanation: |
      Compose lets you override the health check: `disable: true` (or `test: ["NONE"]`)
      turns off an inherited check, and you can otherwise redefine test/interval/timeout/
      retries/start_period there.
    ref: "concepts.md#health-check-gotchas-in-real-dockerfiles"

  - id: production-healthchecks-logging-047
    difficulty: advanced
    tags: [logging, non-blocking, tradeoff]
    question: |
      What is the trade-off of setting log delivery `mode=non-blocking`?
    options:
      - "Logs are encrypted but slower"
      - "The app won't stall on a slow backend, but logs may be dropped when the buffer fills"
      - "docker logs stops working"
      - "It forces the json-file driver"
    answer: 1
    explanation: |
      Non-blocking uses an in-memory ring buffer so the app never blocks on logging, but
      when the buffer (`max-buffer-size`) fills, new logs are dropped. It trades log
      completeness for application liveness.
    ref: "concepts.md#other-logging-drivers"

  - id: production-healthchecks-logging-048
    difficulty: expert
    tags: [graceful-shutdown, prestop, race]
    question: |
      Why does adding a short pre-shutdown delay (e.g. a preStop sleep, or delaying
      closing the listener) reduce errors during rollouts even when the app handles
      SIGTERM correctly?
    options:
      - "It gives the CPU time to cool down"
      - "It keeps the app serving during the gap between SIGTERM and the load balancer removing the endpoint"
      - "It resets the health check state"
      - "It forces logs to flush first"
    answer: 1
    explanation: |
      Endpoint deregistration isn't instantaneous or synchronized with SIGTERM. A brief
      delay keeps the app accepting requests until the LB/orchestrator has actually stopped
      routing to it, closing the race window that causes connection-refused errors.
    ref: "concepts.md#draining-in-flight-requests-during-shutdown"
