topic: "Security Best Practices"
domain: docker
topic_slug: docker-security
schema: 1
pass: clarity-v1

prompts:
  - id: docker-security-p001
    ref: "concepts.md#root-in-container-is-risky-run-as-non-root"
    kind: refute
    tier: A
    prompt: |
      A teammate's review says "we set `USER app` in the Dockerfile, so this container cannot run
      as root." The comment is wrong. Say why, and what would actually enforce non-root.
    hint: "Who gets to choose the UID at `docker run` time?"
    answer_in: "concepts.md#root-in-container-is-risky-run-as-non-root"

  - id: docker-security-p002
    ref: "concepts.md#rootless-docker"
    kind: name-the-price
    tier: A
    prompt: |
      Rootless Docker means a breakout lands in your user account, not root. Name the workload
      where its default networking cost is the one that would actually hurt.
    hint: "What does slirp4netns move out of the kernel?"
    answer_in: "concepts.md#rootless-docker"

  - id: docker-security-p003
    ref: "concepts.md#user-namespaces-userns-remap"
    kind: predict-failure
    tier: A
    prompt: |
      You enable `userns-remap`, then bind-mount a host directory that a host-side cron job also
      writes to. Predict what breaks the next time that cron job runs.
    hint: "Who owns the files the container now creates in that mount?"
    answer_in: "concepts.md#user-namespaces-userns-remap"

  - id: docker-security-p004
    ref: "concepts.md#drop-linux-capabilities"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you harden a web service that listens on a high port as non-root, add
      `--cap-drop ALL` with nothing added back and see whether anything actually breaks.
    answer_in: "concepts.md#drop-linux-capabilities"

  - id: docker-security-p005
    ref: "concepts.md#--privileged-is-dangerous"
    kind: refute
    tier: A
    prompt: |
      A colleague writes: "`--privileged` is fine here, seccomp and AppArmor are still enforcing,
      so the container stays contained." Correct the two false assumptions in that sentence.
    hint: "What does `--privileged` do to the default seccomp and AppArmor profiles?"
    answer_in: "concepts.md#--privileged-is-dangerous"

  - id: docker-security-p006
    ref: "concepts.md#seccomp-profiles"
    kind: draw-the-boundary
    tier: A
    prompt: |
      Everything about seccomp assumed the danger is which syscall runs. Find an attack that
      passes the syscall filter untouched, and name the control that would still catch it.
    hint: "Does seccomp know which file an allowed `open` is opening?"
    answer_in: "concepts.md#seccomp-profiles"

  - id: docker-security-p007
    ref: "concepts.md#apparmor--selinux-mac--lsms"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time `docker run -v /data:/data` gives permission denied on a RHEL or Fedora host,
      check whether the volume was relabelled with `:z` or `:Z` before blaming file permissions.
    answer_in: "concepts.md#apparmor--selinux-mac--lsms"

  - id: docker-security-p008
    ref: "concepts.md#keep-secrets-out-of-images-and-layers"
    kind: predict-failure
    tier: A
    prompt: |
      A build runs `COPY .env .` then `RUN rm .env` on the next line and ships the image. Predict
      how someone who only pulled that image recovers the secret.
    hint: "Which layer added the file, and does a later `rm` edit it?"
    answer_in: "concepts.md#keep-secrets-out-of-images-and-layers"

  - id: docker-security-p009
    ref: "concepts.md#the-docker-socket--root"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a CI job mounts `/var/run/docker.sock`, check what — if anything — stops that job
      from asking the API for a `--privileged` container that mounts the host root.
    answer_in: "concepts.md#the-docker-socket--root"

  - id: docker-security-p010
    ref: "concepts.md#container-escape-threat-model"
    kind: draw-the-boundary
    tier: C
    prompt: |
      Pick one published container-escape CVE and map it onto the escape table: which primitive it
      abused, and which single control in this topic would have blocked it.
    hint: "Read one advisory's technical detail, not its summary line."
    answer_in: external
    search_hint: >
      Start with the runc CVE-2019-5736 write-up, or the MITRE CVE list filtered for "container
      escape"; the vendor or researcher advisory carries the mechanism, the NVD summary does not.
    success_criterion: >
      You can name the abused primitive (a leaked host file descriptor, a writable host bind mount,
      `/proc` or device access, or a broad capability like `CAP_SYS_ADMIN`) and point to the exact
      control already in this topic — `--cap-drop ALL`, `--read-only`, userns-remap, or
      no-new-privileges — that would have removed it.

  - id: docker-security-p011
    ref: "concepts.md#cis-docker-benchmark--hardening-checklist"
    kind: name-the-price
    tier: A
    prompt: |
      The checklist adds `--pids-limit`. Name the specific failure it bounds, and the multi-tenant
      workload where leaving it off lets one container take the whole host down.
    hint: "What shared, finite thing can a fork bomb exhaust?"
    answer_in: "concepts.md#cis-docker-benchmark--hardening-checklist"

cliffhanger:
  from: docker-security
  to_position: 13
  pattern: A
  hook: |
    Every control in this topic constrains what a container may do once it is running. All of them
    assume the image already contains what you think it contains. A hijacked base image, or a
    transitive dependency published yesterday, is inside the boundary before seccomp, capabilities,
    or a read-only rootfs get a say. `FROM node:22` alone pulls in a whole Debian userland your code
    never chose. This topic even defers the point in its own "Image scanning & supply chain"
    section. The next topic opens on exactly that: an image is a supply chain, not a single file.
    Its first question is which base image you inherited a vulnerability from.
  teaser_questions:
    - "If your own code is perfect, where do the CVEs in your image come from?"
    - "What is actually inside `FROM node:22` besides Node?"
    - "How do you know the image you deploy is the image you scanned?"
  payoff:
    anchor: "concepts.md#the-image-supply-chain-threat-model"
    claim: >
      Topic 13 opens by framing a container image as a supply chain, not a single file, and names
      the vulnerable base image — `FROM node:22` dragging in a Debian userland whose CVEs become
      yours — as the first threat in that chain.
