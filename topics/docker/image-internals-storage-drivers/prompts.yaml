topic: "Image Internals & Storage Drivers"
domain: docker
topic_slug: image-internals-storage-drivers
schema: 1
pass: clarity-v1

# Where THIS topic settles the loop topic 14 (buildkit-advanced-builds) left open (rule K1):
# why a classic local image store cannot hold a multi-platform manifest list, when a
# containerd image store can — the chain-ID-vs-content-key difference.
resolves:
  anchor: "concepts.md#graph-drivers-vs-containerd-snapshotters-the-modern-shift"

prompts:
  - id: image-internals-storage-drivers-p001
    ref: "concepts.md#the-manifest-the-images-table-of-contents"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you `docker pull` an image, watch which layers report "Pull complete" and which
      say "Already exists". Note that the "Already exists" ones were matched by digest, not by name.
    hint: "Pull two images that share a base and compare which layers download the second time."
    answer_in: "concepts.md#content-addressable-storage-and-digests"

  - id: image-internals-storage-drivers-p002
    ref: "concepts.md#content-addressable-storage-and-digests"
    kind: draw-the-boundary
    tier: A
    prompt: |
      Everything here assumed the digest re-hash proves an image is safe to run. Name what that
      check does not prove, and which mechanism would.
    hint: "Integrity answers 'are these the bytes I asked for?'. What question is left?"
    answer_in: "concepts.md#content-addressable-storage-and-digests"

  - id: image-internals-storage-drivers-p003
    ref: "concepts.md#diff_id-vs-digest-uncompressed-content-vs-stored-blob"
    kind: refute
    tier: A
    prompt: |
      A colleague writes in review: "`docker image inspect` and `docker manifest inspect` print
      different hashes for the same layer, so our registry blob is corrupt." Name what is wrong.
    hint: "Ask which bytes each command hashes."
    answer_in: "concepts.md#diff_id-vs-digest-uncompressed-content-vs-stored-blob"

  - id: image-internals-storage-drivers-p004
    ref: "concepts.md#layers-as-filesystem-diffs-changesets-not-snapshots"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you write `RUN … && rm …` in a Dockerfile, note that the `rm` only saves space
      because it sits in the same layer as the file it removes.
    hint: "A layer is the net change of one build step. What is the net change of add-then-delete?"
    answer_in: "concepts.md#layers-as-filesystem-diffs-changesets-not-snapshots"

  - id: image-internals-storage-drivers-p005
    ref: "concepts.md#copy-on-write-and-copy_up"
    kind: predict-failure
    tier: A
    prompt: |
      Inside a running container you `chmod 600` a 2 GB file that lives in a lower image layer.
      Predict the disk cost, and name the one setting that changes your answer.
    hint: "Metadata changes are still writes. What does overlayfs copy on a write?"
    answer_in: "concepts.md#copy-on-write-and-copy_up"

  - id: image-internals-storage-drivers-p006
    ref: "concepts.md#whiteouts-and-opaque-directories-how-deletions-work"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a built image is far larger than the files you can see inside it, run
      `docker history` and look for an early layer that adds something a later layer deletes.
    hint: "The deleted bytes did not leave; a later layer only hid them."
    answer_in: "concepts.md#whiteouts-and-opaque-directories-how-deletions-work"

  - id: image-internals-storage-drivers-p007
    ref: "concepts.md#overlay2-on-disk-layout-under-varlibdockeroverlay2"
    kind: draw-the-boundary
    tier: A
    prompt: |
      An app renames a directory and it works on the host but fails inside a container with
      `EXDEV`. Find the layer condition under which overlayfs allows a directory rename.
    hint: "Where must both the source and the destination already live?"
    answer_in: "concepts.md#overlay2-on-disk-layout-under-varlibdockeroverlay2"

  - id: image-internals-storage-drivers-p008
    ref: "concepts.md#storage-drivers-compared-overlay2-fuse-overlayfs-btrfs-zfs-vfs-devicemapper"
    kind: name-the-price
    tier: A
    prompt: |
      vfs gives you a working storage driver with no kernel union filesystem at all. Name what
      that costs, and the one situation where you would still choose it.
    hint: "What does 'each layer is a full deep copy' do to disk and start time?"
    answer_in: "concepts.md#storage-drivers-compared-overlay2-fuse-overlayfs-btrfs-zfs-vfs-devicemapper"

  - id: image-internals-storage-drivers-p009
    ref: "concepts.md#multi-arch-images-the-image-index-manifest-list"
    kind: name-the-price
    tier: A
    prompt: |
      Building one tag for three platforms instead of one gives you a single portable image.
      Name what it costs at build time, and why a pull is unaffected.
    hint: "How many layer stacks get built and stored? How many does one host fetch?"
    answer_in: "concepts.md#multi-arch-images-the-image-index-manifest-list"

  - id: image-internals-storage-drivers-p010
    ref: "concepts.md#graph-drivers-vs-containerd-snapshotters-the-modern-shift"
    kind: draw-the-boundary
    tier: C
    prompt: |
      The prose says a graph driver keys a layer by a chain ID over its uncompressed content
      chained with its parents. Find the exact algorithm and where it is specified.
    hint: "The term is 'chainID'; it is defined over diff_ids, recursively."
    answer_in: external
    success_criterion: |
      You can write the recursive chainID formula from a primary source — chainID of the first
      layer is its diff_id, and each subsequent one is sha256 of the parent chainID joined with
      the next diff_id — and say which spec or implementation defines it (the OCI image-spec
      note on chainID, or containerd's `identity` package).
    search_hint: |
      OCI image-spec (search "chainID" in config.md / the descriptor docs) and containerd's
      `pkg/identity` / `ChainID` helper. Note the input is diff_ids (uncompressed), not manifest
      digests.

  - id: image-internals-storage-drivers-p011
    ref: "concepts.md#layer-sharing-dedup-and-why-order-saves-space"
    kind: name-the-price
    tier: D
    prompt: |
      Your org wants one standard base image so every team's layers dedup on disk and on the
      wire. Is mandating a single base worth it? Price the decision.
    answer_in: external
    answer_shape: |
      A credible answer prices at least three dimensions against each other: (1) the storage and
      network dedup won by a shared base, which grows with the number of images and hosts;
      (2) the security and patch cadence of that one base — a shared base is a shared blast radius
      and a single upgrade lever; and (3) team autonomy and fit — one base rarely suits every
      language runtime, so the cost is friction or a forked base per stack. The answer changes
      with fleet size and how uniform the workloads already are.

cliffhanger:
  hook: |
    You have the whole image on disk now. overlay2 has stacked the read-only layers under one
    writable layer and mounted them at a single `merged` directory. Every file the container will
    ever see is in place. Yet nothing is running. A mounted root filesystem is only a directory
    tree. It has no process, no private view of PIDs or the network, and no resource limits.
    Something still has to pair that directory with a small `config.json`. The JSON names the
    process to start and the isolation to apply. A low-level runtime then reads the two together
    and makes the kernel calls that turn a directory into a contained process.
  teaser_questions:
    - "What is the directory-plus-config.json pair called, and which runtime reads it?"
    - "Which of a container's properties — its PIDs, its network, its limits — come from that JSON rather than from the image?"
    - "What kernel features does the runtime use to give one process an isolated view of the machine?"
  payoff:
    anchor: "concepts.md#runc-and-the-oci-runtime-flow"
    claim: "runc consumes an OCI bundle (config.json + rootfs/ of unpacked layers) and reads config.json to make the kernel calls that create the container"
