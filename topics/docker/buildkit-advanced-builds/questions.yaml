topic: "BuildKit & Advanced Builds"
domain: docker
topic_slug: buildkit-advanced-builds
version: 1
questions:
- id: buildkit-advanced-builds-001
  difficulty: beginner
  tags: [buildkit, basics, default-builder]
  question: |
    On a current Docker Engine / Docker Desktop building Linux containers, which build
    engine does a plain `docker build` use by default?
  options:
  - The legacy sequential builder
  - Kaniko
  - BuildKit
  - The containerd image store only, with no builder
  answer: 2
  explanation: |
    BuildKit is the default builder for Docker Desktop and Docker Engine on Linux
    containers. Plain `docker build` already runs on BuildKit; the legacy builder is only
    used for Windows containers or when explicitly forced with DOCKER_BUILDKIT=0.
  ref: "concepts.md#buildkit-vs-the-legacy-builder"

- id: buildkit-advanced-builds-002
  difficulty: beginner
  tags: [buildkit, parallelism]
  question: |
    A Dockerfile has two independent builder stages (one compiling Go, one bundling JS
    assets) that both feed a final stage. How does BuildKit execute them?
  options:
  - Strictly one after another in top-to-bottom file order
  - In parallel, because they have no dependency edge between them
  - Only the last-defined stage runs, others are ignored
  - Both run but the earlier one is discarded from cache
  answer: 1
  explanation: |
    BuildKit compiles the Dockerfile into a dependency graph. Stages with no edge between
    them are independent, so the concurrent solver runs them in parallel and joins at the
    final stage. The legacy builder would have run them one after another.
  ref: "concepts.md#buildkit-vs-the-legacy-builder"

- id: buildkit-advanced-builds-003
  difficulty: intermediate
  tags: [buildkit, caching, checksums]
  question: |
    How does BuildKit decide whether a build step can be served from cache, compared to the
    legacy builder?
  options:
  - By exact checksums of the step's inputs and mounted content, rather than image-history heuristics
  - By comparing the previous image's creation timestamps
  - By re-running the step and diffing the output image
  - By checking the number of layers in the parent image
  answer: 0
  explanation: |
    BuildKit tracks exact checksums of the build graph and the content mounted to each
    operation. Identical inputs produce a cache hit regardless of unrelated changes. The
    legacy builder relied on looser heuristics over image history.
  ref: "concepts.md#buildkit-vs-the-legacy-builder"

- id: buildkit-advanced-builds-004
  difficulty: intermediate
  tags: [buildkit, unused-stages]
  question: |
    Your Dockerfile defines a `test` stage that no other stage COPYs from and that isn't the
    build target. What does BuildKit do with it?
  options:
  - Builds it anyway as an intermediate image before pruning the target
  - Fails the build with an error for having an unreferenced dead stage
  - Builds it but flags the resulting layers as uncacheable scratch space
  - Skips it entirely because it doesn't affect the requested output
  answer: 3
  explanation: |
    Because BuildKit resolves the Dockerfile to a dependency graph, a stage that nothing
    references and that isn't the target is dead code and is not executed. The legacy
    builder would have built every stage up to the target sequentially.
  ref: "concepts.md#buildkit-vs-the-legacy-builder"

- id: buildkit-advanced-builds-005
  difficulty: intermediate
  tags: [buildkit, build-context]
  question: |
    How does BuildKit handle the build context differently from the legacy builder?
  options:
  - It sends the entire context tarball to the daemon before starting, like the legacy builder
  - It incrementally streams only the files actually needed, skipping unchanged/unused files
  - It ignores the local context entirely and pulls every file from the registry instead
  - It requires the build context to be supplied as a remote git URL, never a local path
  answer: 1
  explanation: |
    The legacy builder tars up and uploads the whole context up front. BuildKit transfers
    the context incrementally, sending only files that are needed and changed, which speeds
    up builds with large contexts.
  ref: "concepts.md#buildkit-vs-the-legacy-builder"

- id: buildkit-advanced-builds-006
  difficulty: advanced
  tags: [llb, internals, frontend]
  question: |
    What is LLB in BuildKit?
  options:
  - A structured logging layer that streams build step output to the client
  - The load balancer component that distributes build jobs across worker nodes
  - A lockfile format for pinning base image digests across repeatable builds
  - An intermediate binary format describing a content-addressable dependency graph of build operations
  answer: 3
  explanation: |
    LLB (Low-Level Build) is the intermediate binary format that a frontend compiles a
    Dockerfile into. It is a content-addressable dependency graph of operations that the
    BuildKit solver executes; it is what enables parallelism, precise caching, and dead-code
    elimination.
  ref: "concepts.md#llb-the-low-level-build-graph"

- id: buildkit-advanced-builds-007
  difficulty: advanced
  tags: [llb, frontend, graph]
  question: |
    In BuildKit's architecture, what component turns a human-readable Dockerfile into LLB?
  options:
  - A frontend
  - The solver
  - The exporter
  - The snapshotter
  answer: 0
  explanation: |
    A frontend is the component that compiles a human-readable build format (e.g. a
    Dockerfile) into LLB. The solver then executes the LLB graph. Because frontends ship as
    versioned images, new syntax can be delivered without upgrading the engine.
  ref: "concepts.md#llb-the-low-level-build-graph"

- id: buildkit-advanced-builds-008
  difficulty: intermediate
  tags: [enabling, env-var]
  question: |
    On an older Docker Engine where BuildKit is not yet the default, how do you force a
    single `docker build` invocation to use BuildKit?
  options:
  - Add `# buildkit` as the very first comment line of the Dockerfile
  - Pass the `--legacy=false` flag to the `docker build` command
  - Rename the file from `Dockerfile` to `BuildKitfile` before building
  - Set the environment variable `DOCKER_BUILDKIT=1`
  answer: 3
  explanation: |
    `DOCKER_BUILDKIT=1 docker build .` enables BuildKit on engines where it isn't the
    default. Conversely, `DOCKER_BUILDKIT=0` forces the legacy builder even on modern
    engines.
  ref: "concepts.md#enabling-buildkit-and-buildx"

- id: buildkit-advanced-builds-009
  difficulty: intermediate
  tags: [buildx, cli]
  question: |
    What is `docker buildx`?
  options:
  - A standalone registry client for pushing and pulling built image tags
  - The CLI plugin that exposes BuildKit's full feature set (multi-platform, cache export, multiple builders)
  - A static analysis tool that only lints Dockerfile syntax and best practices
  - A drop-in replacement for `docker run` that also launches built containers
  answer: 1
  explanation: |
    buildx is the CLI plugin front-end to BuildKit. It exposes advanced capabilities like
    multi-platform builds, cache export/import, and managing multiple builder instances
    and drivers that plain `docker build` doesn't fully surface.
  ref: "concepts.md#enabling-buildkit-and-buildx"

- id: buildkit-advanced-builds-010
  difficulty: advanced
  tags: [drivers, docker-container]
  question: |
    You run `docker buildx build --platform linux/amd64,linux/arm64 -t app --load .` on the
    default `docker` driver and it fails to produce a multi-platform image. What's the fix?
  options:
  - Add several more `--platform` values so the manifest list has quorum
  - Downgrade Docker and force the legacy builder with DOCKER_BUILDKIT=0
  - Use the `docker-container` driver (or enable the containerd image store)
  - Remove the `-t` tag flag so buildx defaults to a multi-arch output
  answer: 2
  explanation: |
    The default `docker` driver can't build a multi-platform manifest list without the
    containerd image store. Create a `docker-container` builder (docker buildx create
    --driver docker-container --use). Also note multi-platform results generally must be
    pushed, not `--load`ed.
  ref: "concepts.md#enabling-buildkit-and-buildx"

- id: buildkit-advanced-builds-011
  difficulty: intermediate
  tags: [create-builder, drivers]
  question: |
    Which command creates and selects a BuildKit builder that runs inside a dedicated
    container and supports all advanced features?
  options:
  - "docker buildx create --name mybuilder --driver docker-container --use"
  - "docker build --new-builder mybuilder --driver docker-container"
  - "docker buildx enable --full --name mybuilder --use"
  - "docker run buildkit --daemon --name mybuilder --detach"
  answer: 0
  explanation: |
    `docker buildx create --driver docker-container --use` provisions a builder backed by a
    BuildKit container and makes it the active builder. This driver supports multi-platform
    builds and all cache export backends, unlike the default `docker` driver.
  ref: "concepts.md#enabling-buildkit-and-buildx"

- id: buildkit-advanced-builds-012
  difficulty: beginner
  tags: [cache-mount, run-mount]
  question: |
    What does `RUN --mount=type=cache,target=/root/.npm npm ci` give you?
  options:
  - A directory baked into the final image as a committed read-only layer
  - A way to expose npm registry credentials to the container at runtime
  - Faster container startup at runtime by preloading node_modules into memory
  - A persistent cache directory reused across builds but NOT committed to the image
  answer: 3
  explanation: |
    A cache mount is a persistent scratch directory that survives across builds on the
    builder but is never committed to the image. Even when the npm layer is rebuilt, the
    download cache is reused so only new/changed packages are fetched.
  ref: "concepts.md#run---mounttypecache--persistent-build-caches"

- id: buildkit-advanced-builds-013
  difficulty: intermediate
  tags: [cache-mount, layer]
  question: |
    True or false: a `--mount=type=cache` directory becomes part of the image's layers.
  options:
  - "True — it is committed as a normal read-only layer in the final image"
  - "False — it is never committed to the image; only the RUN output is"
  - "True, but only in mode=max builds where intermediate layers are kept"
  - "True, but only when running on the docker-container builder driver"
  answer: 1
  explanation: |
    A cache mount is not a layer. It's a persistent build-time scratchpad on the builder.
    Nothing in the cache mount lands in the image, which is exactly why it both speeds
    rebuilds and keeps download caches out of the final image size.
  ref: "concepts.md#run---mounttypecache--persistent-build-caches"

- id: buildkit-advanced-builds-014
  difficulty: advanced
  tags: [cache-mount, sharing, apt]
  question: |
    When caching apt data with a cache mount, why use `sharing=locked`?
  options:
  - To encrypt the cached package archives at rest on the builder
  - To make the mounted cache directory strictly read-only during the RUN
  - Because apt needs exclusive access to its data, so parallel builds must serialize on the cache
  - To share the populated cache directory into the final committed image
  answer: 2
  explanation: |
    `sharing=locked` makes concurrent builds acquire a lock and wait for each other. Tools
    like apt (dpkg database) require exclusive access, so a shared cache would corrupt.
    The default is `sharing=shared`; `sharing=private` gives each build its own copy.
  ref: "concepts.md#run---mounttypecache--persistent-build-caches"

- id: buildkit-advanced-builds-015
  difficulty: intermediate
  tags: [cache-mount, go]
  question: |
    A Go build re-downloads all modules on every CI build even though `go.mod` rarely
    changes. Which change fixes the wasted network time without bloating the image?
  options:
  - Add `RUN --mount=type=cache,target=/go/pkg/mod` (and the go-build cache) to the build step
  - Switch the build stage base image to `scratch` to shrink the download surface
  - Copy the whole repo into the image before running `go mod download` early
  - Add `ENV GOFLAGS=-mod=vendor` and vendor all modules into a committed layer
  answer: 0
  explanation: |
    Mounting the module cache (/go/pkg/mod) and build cache (/root/.cache/go-build) as cache
    mounts persists them across builds, so only new/changed modules download. The cache is
    not committed to the image, so image size is unaffected.
  ref: "concepts.md#run---mounttypecache--persistent-build-caches"

- id: buildkit-advanced-builds-016
  difficulty: intermediate
  tags: [bind-mount, run-mount]
  question: |
    What is the main advantage of `RUN --mount=type=bind,target=.` over `COPY . .` when you
    only need the source to produce a build artifact?
  options:
  - It encrypts the mounted source files while the RUN executes
  - It makes the source tree writable and persistent in the final image
  - It automatically parallelizes the build across independent stages
  - It mounts the context for that RUN without creating a COPY layer, so a large context doesn't bloat the image/cache
  answer: 3
  explanation: |
    A bind mount exposes context (or another stage) to a single RUN without producing a
    layer. Only the RUN's output persists. This avoids adding a heavy COPY layer for a large
    context that's only needed to compile an artifact.
  ref: "concepts.md#run---mounttypebind--mounting-context-without-a-copy-layer"

- id: buildkit-advanced-builds-017
  difficulty: advanced
  tags: [bind-mount, rw]
  question: |
    You use `RUN --mount=type=bind,rw,target=/src ...` and the command writes files under
    /src. What happens to those writes?
  options:
  - They are committed to the final image as a new writable layer
  - They are discarded after the instruction and never reach the image or build cache
  - They are synced back to the host build context directory on disk
  - They are persisted into an implicit cache mount automatically by BuildKit
  answer: 1
  explanation: |
    Even with the `rw` option, changes to a bind mount are not persisted in the final image
    or the build cache. The mount is a transient view for that RUN; only the command's
    actual output (files it creates elsewhere) can persist.
  ref: "concepts.md#run---mounttypebind--mounting-context-without-a-copy-layer"

- id: buildkit-advanced-builds-018
  difficulty: beginner
  tags: [secret-mount, security]
  question: |
    Why prefer `RUN --mount=type=secret` over passing a token via `ARG` for `npm install`
    against a private registry?
  options:
  - ARG resolution is measurably slower during the build than a secret mount
  - Secret mounts stay warm in the build cache far longer than ARG values do
  - The secret mount is never written to a layer, image, or build cache, whereas ARG values leak into image history
  - ARG values can only hold numeric or boolean data, never a token string
  answer: 2
  explanation: |
    A secret mount exposes the file only for the single RUN and never persists it to a
    layer, image, or cache. An ARG (or ENV/COPY) value is recoverable from `docker history`
    and the layers, leaking the credential to anyone with the image.
  ref: "concepts.md#run---mounttypesecret--secrets-that-never-hit-a-layer"

- id: buildkit-advanced-builds-019
  difficulty: intermediate
  tags: [secret-mount, cli]
  question: |
    Which invocation correctly supplies a secret to a build that uses
    `RUN --mount=type=secret,id=npmrc,target=/root/.npmrc npm install`?
  options:
  - "docker buildx build --build-arg npmrc=$HOME/.npmrc ."
  - "docker buildx build --secret id=npmrc,src=$HOME/.npmrc ."
  - "docker buildx build --env npmrc=$HOME/.npmrc ."
  - "docker buildx build --mount=secret,src=$HOME/.npmrc ."
  answer: 1
  explanation: |
    Secrets are supplied with `--secret id=<id>,src=<file>` (or `env=<VAR>`). The `id` must
    match the `id` in the Dockerfile mount. Using `--build-arg`/`--env` would bake the value
    into image history, defeating the purpose.
  ref: "concepts.md#run---mounttypesecret--secrets-that-never-hit-a-layer"

- id: buildkit-advanced-builds-020
  difficulty: advanced
  tags: [secret-mount, default-path]
  question: |
    If you write `RUN --mount=type=secret,id=api_key ...` without specifying `target=`, where
    is the secret mounted by default?
  options:
  - "/tmp/api_key"
  - "/root/api_key"
  - "It is exported as the ARG api_key"
  - "/run/secrets/api_key"
  answer: 3
  explanation: |
    By default a secret is mounted as a file at /run/secrets/<id>. You can override the
    location with `target=`. The secret exists only for the lifetime of that RUN and leaves
    no trace in layers or history.
  ref: "concepts.md#run---mounttypesecret--secrets-that-never-hit-a-layer"

- id: buildkit-advanced-builds-021
  difficulty: advanced
  tags: [secret-mount, history, gotcha]
  question: |
    A teammate uses `ARG GITHUB_TOKEN` then `RUN git clone https://$GITHUB_TOKEN@github.com/...`
    and argues a later multi-stage copy "hides" the token. Why is this still a leak?
  options:
  - Starting a fresh stage with a new FROM automatically deletes every ARG declared earlier, so the token cannot survive into any later layer
  - The git clone over HTTPS transmits the token only to GitHub's servers and never records it in any local build layer or history
  - The token is recorded in the build ARG history/layer of that stage and remains recoverable; squashing/multi-stage doesn't reliably scrub it
  - BuildKit automatically encrypts every ARG value at rest in the layer, so `docker history` only ever shows an unreadable ciphertext blob
  answer: 2
  explanation: |
    An ARG-provided secret is embedded in that stage's history and layer. A downstream stage
    copying only artifacts does not scrub the earlier stage's recorded ARG/command. The
    correct approach is `--mount=type=secret` (or type=ssh), which never persists.
  ref: "concepts.md#run---mounttypesecret--secrets-that-never-hit-a-layer"

- id: buildkit-advanced-builds-022
  difficulty: intermediate
  tags: [ssh-mount, git]
  question: |
    You need to `git clone` a private repo during the build using your host SSH keys, without
    baking any key into the image. Which mount type is designed for this?
  options:
  - "type=cache"
  - "type=ssh"
  - "type=bind"
  - "type=tmpfs"
  answer: 1
  explanation: |
    `--mount=type=ssh` forwards the host SSH agent socket into a RUN step, so git/pip can
    authenticate to private repos. The private key stays in the agent on the host; only the
    socket is exposed, and nothing key-related is committed to a layer.
  ref: "concepts.md#run---mounttypessh--private-git-and-ssh-auth"

- id: buildkit-advanced-builds-023
  difficulty: intermediate
  tags: [ssh-mount, cli]
  question: |
    With a Dockerfile step `RUN --mount=type=ssh git clone git@github.com:acme/repo.git`,
    which CLI flag forwards your running SSH agent to the build?
  options:
  - "--ssh default"
  - "--build-arg SSH_KEY"
  - "--secret id=ssh"
  - "--mount ssh"
  answer: 0
  explanation: |
    `docker buildx build --ssh default .` forwards the default SSH agent socket. The build
    step can then use the agent to authenticate git over SSH without any key material being
    copied into the image.
  ref: "concepts.md#run---mounttypessh--private-git-and-ssh-auth"

- id: buildkit-advanced-builds-024
  difficulty: advanced
  tags: [ssh-mount, security]
  question: |
    With `--mount=type=ssh`, what is actually exposed to the build step?
  options:
  - The raw private key file itself, decrypted and copied into a committed layer of the image
  - The user's account password, injected as an environment variable for the whole build
  - A long-lived personal access token, written into a dedicated layer for later reuse
  - The SSH agent socket only, for the duration of that RUN
  answer: 3
  explanation: |
    Only the SSH agent socket is forwarded, and only during that instruction. The private
    key never leaves the host agent and is never written to a layer, so the image contains
    no credential.
  ref: "concepts.md#run---mounttypessh--private-git-and-ssh-auth"

- id: buildkit-advanced-builds-025
  difficulty: beginner
  tags: [heredocs, dockerfile]
  question: |
    What does BuildKit's heredoc support in a Dockerfile let you do?
  options:
  - Transparently encrypt each RUN command's text so it cannot be read back from `docker history`
  - Break out of the build sandbox and run commands directly on the host instead of the build container
  - Write multi-line RUN scripts (or inline file contents) without long `&&` chains
  - Omit the FROM instruction entirely and let BuildKit infer a base image from the shell commands used
  answer: 2
  explanation: |
    Heredocs (`RUN <<EOF ... EOF`) let you write readable multi-line shell scripts as a single
    RUN, and `COPY <<EOF file` lets you inline file content. This replaces awkward
    `&&`-chained or `echo`-piped one-liners.
  ref: "concepts.md#heredocs-in-dockerfiles"

- id: buildkit-advanced-builds-026
  difficulty: advanced
  tags: [heredocs, error-handling, gotcha]
  question: |
    Why is it important to add `set -e` at the top of a multi-line heredoc `RUN`?
  options:
  - It strips shell built-ins from the resulting layer, measurably shrinking the final image size
  - Without it, a failing line mid-script may not fail the build, unlike a `&&`-chained RUN
  - It signals BuildKit to run the independent lines of the script concurrently for a faster build
  - It is mandatory heredoc syntax, and the frontend refuses to parse a `<<EOF` block that omits it
  answer: 1
  explanation: |
    A `&&`-chained RUN stops on the first failure. A heredoc runs a shell script, so without
    `set -e` a mid-script command can fail while later lines still run and the RUN exits 0,
    masking the error. Add `set -e` (or `set -eux`) to fail fast.
  ref: "concepts.md#heredocs-in-dockerfiles"

- id: buildkit-advanced-builds-027
  difficulty: beginner
  tags: [syntax-directive, frontend]
  question: |
    What is the purpose of `# syntax=docker/dockerfile:1` as the first line of a Dockerfile?
  options:
  - It is an ordinary comment that BuildKit ignores completely and has no effect on the build
  - It sets the default base image for the build to release 1 of the Debian distribution
  - It turns off the build cache so every step is rebuilt from scratch on each invocation
  - It pins the BuildKit frontend image used to parse the Dockerfile
  answer: 3
  explanation: |
    The syntax directive selects the frontend image that compiles the Dockerfile to LLB.
    Because the frontend is a downloadable, versioned image, advanced syntax (mounts,
    heredocs, secrets) works regardless of the engine's built-in parser version.
  ref: "concepts.md#the-syntax-directive-and-frontends"

- id: buildkit-advanced-builds-028
  difficulty: intermediate
  tags: [syntax-directive, features]
  question: |
    Why does pinning `# syntax=docker/dockerfile:1` let you use newer Dockerfile features
    without upgrading Docker Engine?
  options:
  - Because the engine downloads and runs that frontend image at build time, so features travel with the frontend, not the daemon
  - Because the directive triggers an in-place recompile of the Docker daemon from source before the build begins
  - Because it disables the engine's internal version compatibility checks and lets any syntax through unvalidated
  - Because it forces a fallback to the legacy builder, which is documented to support every Dockerfile feature
  answer: 0
  explanation: |
    BuildKit pulls the specified frontend image and uses it to parse the Dockerfile. New
    Dockerfile capabilities ship in the frontend image, so upgrading the frontend (not the
    engine) is enough to get them.
  ref: "concepts.md#the-syntax-directive-and-frontends"

- id: buildkit-advanced-builds-029
  difficulty: advanced
  tags: [syntax-directive, placement, gotcha]
  question: |
    Where must the `# syntax=` directive appear to take effect?
  options:
  - On any line of the file, since BuildKit scans the whole Dockerfile for the directive
  - As a comment before any instruction, including before `FROM`
  - Only on the line immediately after the first `FROM`, so the base image is resolved first
  - Inside a RUN instruction, so it is evaluated when that build step executes
  answer: 1
  explanation: |
    The syntax directive must be a comment at the very top of the Dockerfile, before any
    instruction such as FROM. Placed later it is treated as an ordinary comment and ignored,
    so the pinned frontend won't be used.
  ref: "concepts.md#the-syntax-directive-and-frontends"

- id: buildkit-advanced-builds-030
  difficulty: beginner
  tags: [multi-platform, manifest-list]
  question: |
    What backs a single multi-platform image tag like `acme/app:1.0` that serves both amd64
    and arm64?
  options:
  - A single squashed layer containing fat binaries compiled for both architectures at once
  - Two separate tags that happen to share the same name but resolve by client CPU type
  - A manifest list (OCI image index) pointing to per-architecture manifests
  - A server-side symlink in the registry that redirects pulls to the matching arch tag
  answer: 2
  explanation: |
    A multi-platform image is a manifest list / OCI image index referencing one manifest per
    architecture. On pull, Docker automatically selects the variant matching the host's
    OS/CPU (e.g. arm64 on Apple Silicon or Graviton).
  ref: "concepts.md#multi-platform-builds-with-buildx"

- id: buildkit-advanced-builds-031
  difficulty: intermediate
  tags: [multi-platform, cli]
  question: |
    Which command builds and publishes an image for both amd64 and arm64 in one shot?
  options:
  - "docker build --arch all -t acme/app:1.0 --push ."
  - "docker run --platform multi --build acme/app:1.0 ."
  - "docker manifest build --all-arch acme/app:1.0 ."
  - "docker buildx build --platform linux/amd64,linux/arm64 -t acme/app:1.0 --push ."
  answer: 3
  explanation: |
    `docker buildx build --platform linux/amd64,linux/arm64 ... --push` builds each
    architecture and pushes a manifest list to the registry. It needs a builder that
    supports multi-platform (docker-container driver or containerd image store).
  ref: "concepts.md#multi-platform-builds-with-buildx"

- id: buildkit-advanced-builds-032
  difficulty: intermediate
  tags: [multi-platform, qemu, emulation]
  question: |
    Which multi-platform strategy requires no Dockerfile changes but can be much slower for
    compile-heavy builds?
  options:
  - QEMU emulation
  - Native builder nodes
  - Cross-compilation
  - Registry cache import
  answer: 0
  explanation: |
    QEMU user-mode emulation runs foreign-architecture steps transparently with no Dockerfile
    changes, but emulating a compiler is much slower than native. Native nodes or
    cross-compilation are faster alternatives for heavy builds.
  ref: "concepts.md#multi-platform-builds-with-buildx"

- id: buildkit-advanced-builds-033
  difficulty: advanced
  tags: [multi-platform, build-args, cross-compile]
  question: |
    In a cross-compiling Go Dockerfile you write `FROM --platform=$BUILDPLATFORM golang AS
    build`. Why pin the build stage to `$BUILDPLATFORM`?
  options:
  - To force the resulting image to be published as linux/amd64 only, regardless of the requested targets
  - Because the Dockerfile syntax requires $BUILDPLATFORM in every FROM line that names a build stage
  - So the compiler toolchain runs natively and only the output is cross-compiled, avoiding slow QEMU emulation of the compiler
  - To opt this stage out of the build cache so its compiled output is always rebuilt from scratch
  answer: 2
  explanation: |
    $BUILDPLATFORM is the builder's native platform. Pinning the toolchain to it runs the
    compiler natively (fast) while GOOS/GOARCH from $TARGETOS/$TARGETARCH cross-compile the
    binary for each target — avoiding emulating the whole compiler under QEMU.
  ref: "concepts.md#multi-platform-builds-with-buildx"

- id: buildkit-advanced-builds-034
  difficulty: advanced
  tags: [multi-platform, build-args]
  question: |
    Which predefined build arg tells a stage which OS it is *targeting* during a
    multi-platform build?
  options:
  - "BUILDPLATFORM"
  - "TARGETOS"
  - "BUILDARCH"
  - "HOSTOS"
  answer: 1
  explanation: |
    TARGETOS (with TARGETARCH, TARGETPLATFORM, TARGETVARIANT) describes the platform being
    built. BUILDPLATFORM/BUILDOS/BUILDARCH describe the builder's own native platform. These
    are injected automatically by BuildKit.
  ref: "concepts.md#multi-platform-builds-with-buildx"

- id: buildkit-advanced-builds-035
  difficulty: advanced
  tags: [multi-platform, load, gotcha]
  question: |
    Why can't you `--load` a multi-architecture build result into your local classic image
    store?
  options:
  - Because --load is implemented only in the legacy builder, which cannot produce multi-arch output at all
  - Because a multi-arch image always exceeds the 2GB per-image size ceiling the local store enforces
  - Because --load must run each foreign architecture under QEMU emulation, which the local engine forbids
  - Because the classic local image store can't hold a manifest list, so you push to a registry (or use the containerd store); --load handles a single platform
  answer: 3
  explanation: |
    The classic Docker image store cannot store a manifest list locally, so a multi-platform
    result must be pushed to a registry (or you enable the containerd image store). `--load`
    can only import one platform into the local engine.
  ref: "concepts.md#multi-platform-builds-with-buildx"

- id: buildkit-advanced-builds-036
  difficulty: intermediate
  tags: [registry-cache, ci]
  question: |
    In CI, builders are ephemeral so the local build cache is lost each run. Which BuildKit
    feature lets the next run reuse cache?
  options:
  - Squashing all layers into one so the single result layer is trivially re-fetched next run
  - Setting a HEALTHCHECK so the builder detects a warm cache and restores it automatically
  - Exporting/importing remote cache with `--cache-to` and `--cache-from`
  - Using `docker commit` on the builder container to snapshot its cache for the following job
  answer: 2
  explanation: |
    `--cache-to` exports the build cache to a shared backend (e.g. a registry) and
    `--cache-from` imports it on the next run, giving cache hits across ephemeral CI
    machines that don't share a local cache.
  ref: "concepts.md#remote--registry-cache---cache-to----cache-from"

- id: buildkit-advanced-builds-037
  difficulty: advanced
  tags: [registry-cache, mode-max]
  question: |
    You want the CI cache to include intermediate multi-stage build steps, not just the final
    image layers. Which setting do you use?
  options:
  - "--cache-to type=registry,...,mode=max"
  - "--cache-to type=inline (embeds every intermediate stage layer into the image itself)"
  - "--squash (collapses intermediate stages into one exported cache layer)"
  - "--cache-to type=registry,...,mode=min"
  answer: 0
  explanation: |
    `mode=max` exports all layers including intermediate build steps, maximizing future cache
    hits (at the cost of a larger cache). `mode=min` (the default) caches only layers that
    end up in the final image. Inline cache can't do mode=max.
  ref: "concepts.md#remote--registry-cache---cache-to----cache-from"

- id: buildkit-advanced-builds-038
  difficulty: advanced
  tags: [registry-cache, inline, limitations]
  question: |
    What is a key limitation of the `inline` cache backend compared to the `registry` backend?
  options:
  - It cannot be pushed to a registry and only ever persists on the local builder's disk
  - It doesn't support `mode=max`, so it can't cache intermediate build stages
  - It only works with the legacy builder and is rejected outright by the BuildKit solver
  - It requires QEMU emulation to be installed before any cache metadata can be exported
  answer: 1
  explanation: |
    Inline cache embeds cache metadata into the image itself and only works with the image
    exporter; it doesn't support the `mode` option, so it can only do min-mode caching. The
    registry backend stores cache separately and supports mode=max.
  ref: "concepts.md#remote--registry-cache---cache-to----cache-from"

- id: buildkit-advanced-builds-039
  difficulty: advanced
  tags: [registry-cache, drivers, gotcha]
  question: |
    Your CI job fails when exporting `--cache-to type=registry,...` on the default `docker`
    driver. What's the typical fix?
  options:
  - Use a smaller base image so the exported cache blob fits under the registry's layer size limit
  - Add more `--platform` values so the exporter has a manifest list to attach the cache to
  - Remove `--cache-from` because importing and exporting registry cache in the same job deadlocks
  - Use a `docker-container` builder (the default `docker` driver can't export registry cache without the containerd store)
  answer: 3
  explanation: |
    The default `docker` driver supports only limited cache backends (and only with the
    containerd image store). To export registry-type cache reliably, create and use a
    `docker-container` builder.
  ref: "concepts.md#remote--registry-cache---cache-to----cache-from"

- id: buildkit-advanced-builds-040
  difficulty: intermediate
  tags: [registry-cache, backends]
  question: |
    Which of these is a valid BuildKit cache backend?
  options:
  - "type=volume (persists cache in a named Docker volume)"
  - "type=commit (snapshots the builder container as cache)"
  - "type=gha (GitHub Actions cache)"
  - "type=layerfs (dedupes cache at the overlay layer level)"
  answer: 2
  explanation: |
    Valid backends include inline, registry, local, gha (GitHub Actions cache), s3, and
    azblob. `gha` uploads cache to the GitHub Actions cache service, handy for
    GitHub-hosted CI. The others listed are not BuildKit cache backends.
  ref: "concepts.md#remote--registry-cache---cache-to----cache-from"

- id: buildkit-advanced-builds-041
  difficulty: intermediate
  tags: [attestations, provenance, sbom]
  question: |
    What are provenance and SBOM attestations produced by BuildKit?
  options:
  - Runtime health probes that the orchestrator polls to decide when the container is ready
  - Signed structured metadata about how the image was built and what it contains, stored as extra manifests in the image index
  - Network policies embedded in the image that restrict which endpoints the container may reach
  - Layer compression settings that tune how aggressively each image layer is gzip-packed
  answer: 1
  explanation: |
    Attestations are in-toto metadata attached to the image index. Provenance records how
    the image was built (command, source, materials); the SBOM lists packages/components.
    They are the image-level primitive for supply-chain security.
  ref: "concepts.md#provenance--sbom-attestations"

- id: buildkit-advanced-builds-042
  difficulty: intermediate
  tags: [attestations, cli]
  question: |
    Which flags request provenance and SBOM attestations on a buildx build?
  options:
  - "--attest none (BuildKit emits both attestations unless you opt out)"
  - "--metadata-only (writes provenance and SBOM to a sidecar metadata file)"
  - "--sign cosign (generates the attestations as part of cosign signing)"
  - "--provenance=true --sbom=true"
  answer: 3
  explanation: |
    `docker buildx build --provenance=true --sbom=true ...` attaches provenance and SBOM
    attestations. Provenance also supports mode=min/max for how much build detail is
    recorded. General signing/verification (cosign, SLSA) is a pipeline-level concern.
  ref: "concepts.md#provenance--sbom-attestations"

- id: buildkit-advanced-builds-043
  difficulty: advanced
  tags: [attestations, drivers, gotcha]
  question: |
    Why do attestations typically require pushing to a registry (or an OCI/docker exporter)
    rather than the default `docker` driver's classic store?
  options:
  - The classic image store can't hold the extra OCI-index attestation manifests locally
  - Attestations are only supported when building Windows containers, never Linux ones
  - Attestations arrive encrypted and must be decrypted by the registry before they load
  - The default driver silently strips attestations from any multi-stage build it produces
  answer: 0
  explanation: |
    Attestations are stored as additional manifests in the OCI image index. The default
    driver's classic image store can't represent that locally, so you push to a registry (or
    use an exporter that supports the index) — the same reason CI uses docker-container.
  ref: "concepts.md#provenance--sbom-attestations"

- id: buildkit-advanced-builds-044
  difficulty: intermediate
  tags: [supply-chain, boundary, cross-reference]
  question: |
    A BuildKit SBOM attestation lists an image's components. Where does the broader
    supply-chain framework (SLSA levels, cosign signing policy, verifying provenance in a
    pipeline) belong in this library?
  options:
  - It is fully covered here under BuildKit, since the SBOM attestation already encodes SLSA levels and signing policy
  - It belongs to docker-networking, because provenance verification happens over the registry pull connection at runtime
  - It belongs to devops-cicd/software-supply-chain-security (pipeline framework); scanning image layers for CVEs is in image-scanning-supply-chain
  - It is not covered anywhere in this library, as supply-chain signing is considered out of scope for the whole collection
  answer: 2
  explanation: |
    BuildKit owns the image-level primitive (producing SBOM/provenance attestations). The
    general framework — SLSA, Sigstore/cosign policy, pipeline verification — lives in
    devops-cicd/software-supply-chain-security, and CVE scanning of layers in
    image-scanning-supply-chain.
  ref: "concepts.md#provenance--sbom-attestations"

- id: buildkit-advanced-builds-045
  difficulty: intermediate
  tags: [bake, orchestration]
  question: |
    What problem does `docker buildx bake` solve?
  options:
  - It runs the built containers with health checks and restart policies once the build finishes
  - It scans each built image for CVEs and fails the build when a critical vulnerability is found
  - It replaces the container runtime with a BuildKit-native daemon for both building and running
  - It declaratively builds multiple images/targets together from an HCL/JSON/Compose file, with shared config
  answer: 3
  explanation: |
    Bake is a build orchestrator: instead of many `buildx build` commands with long flags,
    you declare targets and groups in a file and build them together (in parallel, with
    inheritance and variables). It's to `buildx build` what Compose is to `docker run`.
  ref: "concepts.md#docker-buildx-bake"

- id: buildkit-advanced-builds-046
  difficulty: advanced
  tags: [bake, hcl, override]
  question: |
    In a `docker-bake.hcl`, how can you override the platforms for all targets at the command
    line without editing the file?
  options:
  - "docker buildx bake --platform-all arm64 (applies one platform to every declared target)"
  - "docker buildx bake --set *.platform=linux/arm64"
  - "docker buildx bake --arch arm64 (shorthand that rewrites each target's platform field)"
  - "You cannot override bake values from the CLI; you must edit the HCL file and re-run bake"
  answer: 1
  explanation: |
    `--set <target>.<field>=<value>` overrides bake attributes at the CLI, and `*` matches
    all targets. So `--set *.platform=linux/arm64` sets the platform for every target without
    editing the HCL file.
  ref: "concepts.md#docker-buildx-bake"

- id: buildkit-advanced-builds-047
  difficulty: beginner
  tags: [enabling, legacy, windows]
  question: |
    In which case does modern Docker still use the legacy builder rather than BuildKit?
  options:
  - Building Windows containers (or when DOCKER_BUILDKIT=0 is set)
  - Any build on Linux, since BuildKit only ships in the Docker Desktop edition for macOS
  - Whenever multi-stage builds are used, because the legacy builder handles stage graphs faster
  - Whenever a cache mount is used, as those mounts are a feature carried over from the legacy engine
  answer: 0
  explanation: |
    BuildKit is default for Linux containers on Docker Desktop/Engine. Windows containers
    still use the legacy builder, and you can force legacy anywhere with DOCKER_BUILDKIT=0.
  ref: "concepts.md#enabling-buildkit-and-buildx"

- id: buildkit-advanced-builds-048
  difficulty: advanced
  tags: [cache-mount, sharing, private]
  question: |
    Which `sharing` value for a cache mount gives each concurrent build its own independent
    cache instance?
  options:
  - "sharing=shared (all concurrent builds read and write the one cache at once)"
  - "sharing=locked (builds queue on a lock and reuse the same cache in turn)"
  - "sharing=private"
  - "sharing=isolated (spins up a throwaway cache namespace per build stage)"
  answer: 2
  explanation: |
    `sharing=private` creates a separate cache per concurrent build. `shared` (default) lets
    builds use it simultaneously; `locked` serializes access with a lock. `isolated` is not
    a valid value.
  ref: "concepts.md#run---mounttypecache--persistent-build-caches"
