topic: "BuildKit & Advanced Builds"
domain: docker
topic_slug: buildkit-advanced-builds
schema: 1
pass: clarity-v1

prompts:
  - id: buildkit-advanced-builds-p001
    ref: "concepts.md#buildkit-vs-the-legacy-builder"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a build log shows two stages finishing in an order you did not write, check
      whether either stage COPYs from the other. If not, you are watching the graph solver.
    hint: "An edge is a `COPY --from` or a shared base; no edge means no ordering."
    answer_in: "concepts.md#buildkit-vs-the-legacy-builder"

  - id: buildkit-advanced-builds-p002
    ref: "concepts.md#llb-the-low-level-build-graph"
    kind: draw-the-boundary
    tier: A
    prompt: |
      BuildKit runs independent stages in parallel with no flag from you. Name one Dockerfile
      edit that would silently make two currently-parallel stages run one after the other.
    hint: "Parallelism is the absence of an edge. What adds an edge?"
    answer_in: "concepts.md#llb-the-low-level-build-graph"

  - id: buildkit-advanced-builds-p003
    ref: "concepts.md#enabling-buildkit-and-buildx"
    kind: refute
    tier: A
    prompt: |
      A colleague writes: "We don't need buildx — plain `docker build` already runs BuildKit,
      so it can build multi-platform images too." Say precisely where they are wrong.
    hint: "Separate the engine from the builder driver."
    answer_in: "concepts.md#enabling-buildkit-and-buildx"

  - id: buildkit-advanced-builds-p004
    ref: "concepts.md#run---mounttypecache--persistent-build-caches"
    kind: predict-failure
    tier: A
    prompt: |
      Two `apt-get install` builds run at once against the same default cache mount and one
      corrupts the other's dpkg state. Name the `sharing` value that serializes them, and the
      one that isolates them instead.
    hint: "Three values, three answers. Which waits, which copies?"
    answer_in: "concepts.md#run---mounttypecache--persistent-build-caches"

  - id: buildkit-advanced-builds-p005
    ref: "concepts.md#run---mounttypesecret--secrets-that-never-hit-a-layer"
    kind: refute
    tier: A
    prompt: |
      A colleague says: "I passed the token as `ARG TOKEN` in an early stage, but the final
      image is multi-stage, so the token is gone." Explain why the token can still leak.
    hint: "Where does `docker history` read from?"
    answer_in: "concepts.md#run---mounttypesecret--secrets-that-never-hit-a-layer"

  - id: buildkit-advanced-builds-p006
    ref: "concepts.md#run---mounttypessh--private-git-and-ssh-auth"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you see a Dockerfile `COPY` a deploy key to clone a private repo, notice the
      key now lives in a layer forever. Check whether `--mount=type=ssh` removes the need.
    hint: "What is forwarded is the agent socket, not the key file."
    answer_in: "concepts.md#run---mounttypessh--private-git-and-ssh-auth"

  - id: buildkit-advanced-builds-p007
    ref: "concepts.md#heredocs-in-dockerfiles"
    kind: predict-failure
    tier: A
    prompt: |
      A heredoc `RUN` runs three shell commands; the middle one fails, yet the build succeeds
      and ships a broken image. Name the single line that would have failed the build instead.
    hint: "A heredoc has no `&&` chain. What is the block's exit status by default?"
    answer_in: "concepts.md#heredocs-in-dockerfiles"

  - id: buildkit-advanced-builds-p008
    ref: "concepts.md#the-syntax-directive-and-frontends"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you copy `# syntax=docker/dockerfile:1` to the top of a Dockerfile, notice that
      `:1.7` would freeze the parser instead. Check which your repo pins, and why.
    hint: "One auto-updates; one is reproducible."
    answer_in: "concepts.md#the-syntax-directive-and-frontends"

  - id: buildkit-advanced-builds-p009
    ref: "concepts.md#multi-platform-builds-with-buildx"
    kind: name-the-price
    tier: A
    prompt: |
      QEMU emulation builds `linux/arm64` on an amd64 host with zero Dockerfile changes. Name
      the price, roughly how large it is, and the kind of step where it hurts most.
    hint: "Emulation is not native execution. Which steps are CPU-bound?"
    answer_in: "concepts.md#where-it-gets-slow-what-emulation-actually-costs"

  - id: buildkit-advanced-builds-p010
    ref: "concepts.md#remote--registry-cache---cache-to----cache-from"
    kind: predict-failure
    tier: A
    prompt: |
      Your CI uses `inline` cache with multi-stage builds, yet each run rebuilds the builder
      stage from scratch. Name why inline cannot help here, and the one change that fixes it.
    hint: "Which mode does inline support, and which stages does that mode keep?"
    answer_in: "concepts.md#remote--registry-cache---cache-to----cache-from"

  - id: buildkit-advanced-builds-p011
    ref: "concepts.md#provenance--sbom-attestations"
    kind: name-the-price
    tier: A
    prompt: |
      `--provenance=true --sbom=true` gives you a verifiable record of how an image was built.
      Name what the build itself must do differently for those attestations to survive.
    hint: "Where can the attestation manifests actually be stored?"
    answer_in: "concepts.md#provenance--sbom-attestations"

  - id: buildkit-advanced-builds-p012
    ref: "concepts.md#docker-buildx-bake"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you meet a shell script looping `docker buildx build` over several images,
      notice it is reinventing bake. Check whether one `docker-bake.hcl` with `inherits` replaces it.
    hint: "What does bake share between targets that the loop repeats?"
    answer_in: "concepts.md#docker-buildx-bake"

  - id: buildkit-advanced-builds-p013
    ref: "concepts.md#where-it-gets-slow-what-emulation-actually-costs"
    kind: name-the-price
    tier: C
    prompt: |
      The prose says emulation is "several times slower, up to an order of magnitude, depending
      on the workload." Measure the real factor for one of your own multi-arch builds.
    hint: "Time the same stage native versus emulated; the ratio is workload-specific."
    answer_in: external
    success_criterion: |
      You can quote a native-versus-emulated wall-clock ratio for one specific build stage of
      your own, and explain why that ratio is not a universal constant — it moves with how
      CPU-bound the stage is and with the guest/host architecture pair.
    search_hint: |
      Docker's multi-platform docs on QEMU/binfmt emulation, plus `time` on a native build and
      the same build forced under emulation on one host. There is no single published factor.

cliffhanger:
  hook: |
    Three times this topic said the same thing. A multi-platform manifest must be pushed to a
    registry, or the containerd image store must be switched on. You have met the symptom too:
    `docker load` refuses a multi-arch image, and `--load` takes a single platform. The classic
    local store simply cannot hold a manifest list. But why would a local store care about a
    list of manifests? A tag is a tag. This topic never says. The next one does, in how the two
    stores key the layers underneath.
  teaser_questions:
    - "What does the classic store key a layer to, that a bare list of manifests cannot give it?"
    - "How can a store hold an image whose member layers it may never unpack?"
  payoff:
    anchor: "concepts.md#graph-drivers-vs-containerd-snapshotters-the-modern-shift"
    claim: "native multi-arch image storage"
