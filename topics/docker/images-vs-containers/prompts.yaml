topic: "Docker Fundamentals: Images vs Containers"
domain: docker
topic_slug: images-vs-containers
schema: 1
pass: clarity-v1

prompts:
  - id: images-vs-containers-p001
    ref: "concepts.md#image-the-immutable-read-only-template"
    kind: draw-the-boundary
    tier: A
    prompt: |
      An image can never change after it is built, yet `nginx:1.27` gave two hosts different
      code last month. Which part of "immutable" does that not contradict?
    hint: "Ask what a digest names, and what a tag names."
    answer_in: "concepts.md#image-identity-repository-tag-and-digest"

  - id: images-vs-containers-p002
    ref: "concepts.md#container-a-running-instance-of-an-image"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time several containers of one image are running, run `docker ps -s`, add the
      virtual sizes up, then compare that total with what `docker system df` reports.
    hint: "Only one of those two columns is additive."
    answer_in: "concepts.md#layers-are-shared-across-containers-and-images"

  - id: images-vs-containers-p003
    ref: "concepts.md#copy-on-write-and-the-thin-writable-layer"
    kind: predict-failure
    tier: A
    prompt: |
      Your image ships a 4 GB model file. The container's start script runs
      `chown app /models/model.bin` and nothing else. Predict the writable layer's size one
      second later.
    hint: "Count the bytes the command writes, then count what it makes the driver move."
    answer_in: "concepts.md#copy-on-write-and-the-thin-writable-layer"

  - id: images-vs-containers-p004
    ref: "concepts.md#layers-are-shared-across-containers-and-images"
    kind: name-the-price
    tier: B
    prompt: |
      Sharing rewards putting every service on one common base image. Name what a fatter shared
      base costs beyond disk, and the workload where that cost decides the choice.
    answer_in: "docker/dockerfile-layers-build-cache#base-images-from-scratch-tags-and-digests"

  - id: images-vs-containers-p005
    ref: "concepts.md#image-identity-repository-tag-and-digest"
    kind: refute
    tier: A
    prompt: |
      A reviewer writes: "Pin the image ID from `docker images` in the Dockerfile — it is a
      digest, so the build is reproducible." Name what goes wrong.
    hint: "Two objects in an image get hashed. Which one does a registry answer for?"
    answer_in: "concepts.md#image-identity-repository-tag-and-digest"

  - id: images-vs-containers-p006
    ref: "concepts.md#container-vs-virtual-machine"
    kind: notice-in-wild
    tier: A
    prompt: |
      On a Mac or a Windows machine, run `docker run --rm alpine uname -r` and compare the
      kernel version it prints with your own machine's.
    answer_in: "concepts.md#container-vs-virtual-machine"

  - id: images-vs-containers-p007
    ref: "concepts.md#where-it-breaks-when-one-shared-kernel-is-not-enough"
    kind: draw-the-boundary
    tier: C
    prompt: |
      gVisor services a container's system calls in userspace. Find what it does with a system
      call its own kernel does not implement.
    search_hint: "gVisor's own architecture guide on gvisor.dev — the Sentry's syscall handling, then its compatibility notes."
    success_criterion: >-
      You can name the component that handles the call, say what an unimplemented call returns to
      the application, and name one class of program that breaks because of it.
    answer_in: "external"

  - id: images-vs-containers-p008
    ref: "concepts.md#a-container-is-just-a-process"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a container is running, get its host PID with
      `docker inspect -f '{{.State.Pid}}' <name>`, then list `/proc/<pid>/ns/` on the host.
    hint: "Compare that listing with `ls -l /proc/1/ns/`."
    answer_in: "concepts.md#a-container-is-just-a-process"

  - id: images-vs-containers-p009
    ref: "concepts.md#the-union-filesystem-stacking-layers-into-one-root"
    kind: predict-failure
    tier: A
    prompt: |
      A container deletes a 2 GB file that came from an image layer. Predict what happens to
      free space on the host, and what the next container from that image sees at that path.
    hint: "Which layer in the stack is allowed to change?"
    answer_in: "concepts.md#copy-on-write-and-the-thin-writable-layer"

  - id: images-vs-containers-p010
    ref: "concepts.md#ephemeral-and-disposable-containers-12-factor"
    kind: name-the-price
    tier: D
    prompt: |
      Disposability buys you rollback by redeploy and replacement without ceremony. Name what it
      costs the application itself, and the workload where that cost is the one that hurts.
    answer_shape: >-
      A credible answer prices two things: where the durable state goes and who then operates that
      store, and what the application has to finish in the moments between a stop request and its
      exit.

cliffhanger:
  hook: |
    You have been told a container is disposable: kill it, start another, lose nothing. Try that
    on an idle web server.

    ```
    $ time docker stop web
    web
    real    0m10.3s
    ```

    Ten seconds to throw away something disposable, with no work in flight and nothing to
    flush. `docker stop` did not kill that process. Whatever it did instead took ten seconds,
    and the container sat there for all of them. The next topic opens here, because "free to
    throw away" turns out to have a boundary you can measure with a stopwatch. Which side of it
    you land on is decided by one line in your Dockerfile.
  teaser_questions:
    - "Where do the ten seconds go when the container is idle?"
    - "Which process is asked to stop, and what happens if it never answers?"
    - "What in your Dockerfile decides whether the wait is ten seconds or none?"
  payoff:
    anchor: "concepts.md#stopping-sigterm-the-grace-period-then-sigkill"
    claim: >-
      Read in the destination: stopping is a two-phase, graceful operation — Docker sends the
      stop signal (default SIGTERM) to PID 1, waits a grace period of 10 seconds by default on
      Linux (30s on Windows), and sends SIGKILL only if PID 1 is still alive when it expires.
