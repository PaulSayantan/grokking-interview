topic: "Docker Fundamentals: Images vs Containers"
domain: docker
topic_slug: images-vs-containers
version: 1
questions:
  - id: images-vs-containers-001
    difficulty: beginner
    tags: [image, container, definition]
    question: |
      Which statement best captures the difference between a Docker image and a
      container?
    options:
      - "An image is an immutable read-only template; a container is a running instance of that image plus a writable layer"
      - "An image is the running process; a container is the file it was built from"
      - "They are two names for the same thing"
      - "A container is immutable and read-only; an image is the mutable running instance"
    answer: 0
    explanation: |
      An image is a static, immutable, read-only template (a stack of layers plus
      config). A container is a running (or created) instance of that image: the
      image's read-only layers plus a thin writable layer, executed as an isolated
      process. Class vs instance.
    ref: "concepts.md#image-the-immutable-read-only-template"

  - id: images-vs-containers-002
    difficulty: beginner
    tags: [image, immutability]
    question: |
      What does it mean that Docker images are "immutable"?
    options:
      - "They cannot be pushed to a registry once built"
      - "They cannot be deleted"
      - "Their tags can never be reassigned"
      - "Once built, an image never changes — you build a new image or stack layers on top rather than editing it in place"
    answer: 3
    explanation: |
      Immutability means an existing image's contents never change after it is built.
      To make a change you build a new image (new layers) on top. This is what makes
      images reproducible and cacheable.
    ref: "concepts.md#image-the-immutable-read-only-template"

  - id: images-vs-containers-003
    difficulty: beginner
    tags: [image, layers, structure]
    question: |
      A Docker image is composed of what?
    options:
      - "A single monolithic filesystem blob"
      - "A stack of read-only layers, each representing filesystem changes, plus a config/manifest"
      - "A running process tree"
      - "Only environment variables and a start command"
    answer: 1
    explanation: |
      An image is a stack of read-only layers (each a set of filesystem changes)
      plus a config object (metadata like Cmd, Env, User) and a manifest that lists
      them. Layers are stacked via a union filesystem into one root.
    ref: "concepts.md#image-the-immutable-read-only-template"

  - id: images-vs-containers-004
    difficulty: intermediate
    tags: [oci, manifest, config]
    question: |
      In the OCI image format, what does the image *config* object primarily hold?
    options:
      - "The gzipped layer tarballs themselves"
      - "The container's runtime logs"
      - "Image metadata such as default Cmd/Entrypoint, Env, WorkingDir, User, plus rootfs diff_ids and build history"
      - "The registry credentials used to push the image"
    answer: 2
    explanation: |
      The OCI image config carries metadata: default command/entrypoint, env vars,
      working dir, user, exposed ports, plus rootfs.diff_ids and build history. The
      manifest references the config and the ordered layer blobs (the actual
      filesystem data).
    ref: "concepts.md#image-the-immutable-read-only-template"

  - id: images-vs-containers-005
    difficulty: beginner
    tags: [container, writable-layer]
    question: |
      When you create a container from an image, what is added on top of the image's
      read-only layers?
    options:
      - "A second read-only copy of the base image"
      - "A new immutable image layer that is pushed to the registry"
      - "Nothing — the container writes directly into the image layers"
      - "A thin writable layer unique to that container"
    answer: 3
    explanation: |
      Creating a container adds a single thin writable layer on top of the shared
      read-only image layers. All runtime writes (logs, temp files) go there, and it
      is unique to that container.
    ref: "concepts.md#container-a-running-instance-of-an-image"

  - id: images-vs-containers-006
    difficulty: beginner
    tags: [container, cardinality]
    question: |
      How many containers can be created from a single image?
    options:
      - "Exactly one"
      - "At most one per host"
      - "Many — one image can spawn any number of containers"
      - "Only as many as there are layers in the image"
    answer: 2
    explanation: |
      Like a class and its instances, one image can spawn many containers. The
      read-only image layers are shared on disk; each container just adds its own
      writable layer.
    ref: "concepts.md#container-a-running-instance-of-an-image"

  - id: images-vs-containers-007
    difficulty: intermediate
    tags: [container, ephemeral, persistence]
    question: |
      You write an important file to a container's filesystem (not a volume), then run
      `docker rm` on the container. What happens to the file?
    options:
      - "It is discarded along with the container's writable layer"
      - "It is automatically committed back into the image"
      - "It is moved into a default volume"
      - "It persists in the image's read-only layers"
    answer: 0
    explanation: |
      Writes land in the container's ephemeral writable layer, which is destroyed on
      `docker rm`. To survive a container's death, data must go to a volume or bind
      mount — not the container filesystem.
    ref: "concepts.md#container-a-running-instance-of-an-image"

  - id: images-vs-containers-008
    difficulty: intermediate
    tags: [ps, size, virtual-size]
    question: |
      `docker ps -s` shows a container as `size 5B (virtual 142MB)`. What do these two
      numbers mean?
    options:
      - "5B is the image size; 142MB is free disk"
      - "5B is data written in this container's writable layer; 142MB is that plus the shared read-only image data"
      - "5B is RAM used; 142MB is disk used"
      - "5B is the compressed size; 142MB is the uncompressed size of the writable layer"
    answer: 1
    explanation: |
      `size` is the bytes written into this container's own writable layer; `virtual`
      is the writable layer plus the shared read-only image layers. The read-only
      layers are shared across all containers of the image.
    ref: "concepts.md#container-a-running-instance-of-an-image"

  - id: images-vs-containers-009
    difficulty: intermediate
    tags: [copy-on-write, cow]
    question: |
      Under Docker's copy-on-write model, what happens the first time a container
      *modifies* a file that exists only in a read-only image layer?
    options:
      - "The change is written directly into the shared image layer"
      - "The modification is rejected because image layers are read-only"
      - "The file is copied up into the container's writable layer, then modified there"
      - "The entire image layer is duplicated for the container"
    answer: 2
    explanation: |
      On first modification the storage driver performs a copy_up: it copies just
      that file into the container's writable layer and applies the change there. The
      original in the read-only layer is untouched and still shared.
    ref: "concepts.md#copy-on-write-and-the-thin-writable-layer"

  - id: images-vs-containers-010
    difficulty: beginner
    tags: [copy-on-write, reads]
    question: |
      When a container only *reads* a file that lives in a lower read-only image layer,
      what does copy-on-write do?
    options:
      - "Copies the file into the writable layer first, then reads it"
      - "Blocks the read until the file is committed"
      - "Reads it directly from the shared read-only layer with no copy"
      - "Reads it from the registry over the network"
    answer: 2
    explanation: |
      Reads require no copy — the container reads straight from the shared read-only
      layer. The copy only happens on the first write/modify (copy_up). This is why
      starting and reading from containers is essentially free in disk terms.
    ref: "concepts.md#copy-on-write-and-the-thin-writable-layer"

  - id: images-vs-containers-011
    difficulty: advanced
    tags: [copy-on-write, performance, volumes]
    question: |
      A container modifies one byte of a 2 GB file that came from a read-only image
      layer. Why can this be surprisingly expensive?
    options:
      - "copy_up copies the entire 2 GB file up into the writable layer on first write"
      - "It forces every other container to re-pull the image"
      - "The image must be rebuilt before the write can succeed"
      - "Docker compresses the whole layer synchronously before writing"
    answer: 0
    explanation: |
      copy_up copies the whole file, not just the changed bytes — even a chmod/chown
      triggers it. Modifying a huge file in the writable layer copies all of it. This
      is why large or write-heavy files belong on a volume, which bypasses the union
      filesystem.
    ref: "concepts.md#copy-on-write-and-the-thin-writable-layer"

  - id: images-vs-containers-012
    difficulty: advanced
    tags: [copy-on-write, delete, whiteout]
    question: |
      Inside a container you `rm` a file that exists in a lower read-only image layer.
      How is this represented on disk?
    options:
      - "The file is physically deleted from the image layer"
      - "The layer is marked mutable and the file removed"
      - "Nothing changes; deletes inside containers are ignored"
      - "A whiteout marker is written in the container's writable layer to hide the lower-layer file"
    answer: 3
    explanation: |
      The union filesystem cannot alter the read-only layer, so a delete records a
      whiteout marker in the writable layer that hides the lower file from the merged
      view. The underlying file remains and is still shared with other containers.
    ref: "concepts.md#copy-on-write-and-the-thin-writable-layer"

  - id: images-vs-containers-013
    difficulty: intermediate
    tags: [layers, sharing, disk]
    question: |
      You run 40 containers from the same 900 MB image. Approximately how much disk do
      the image layers consume?
    options:
      - "About 40 × 900 MB, one full copy per container"
      - "About 900 MB total — the read-only layers are shared; each container adds only its small writable layer"
      - "Zero — images are stored only in the registry"
      - "It depends on how much RAM the host has"
    answer: 1
    explanation: |
      Read-only layers are content-addressed and shared on disk across all containers
      of an image. Forty containers share the one ~900 MB image; each adds only its
      (usually tiny) writable layer.
    ref: "concepts.md#layers-are-shared-across-containers-and-images"

  - id: images-vs-containers-014
    difficulty: intermediate
    tags: [layers, content-addressed, sharing]
    question: |
      Two different images are both built `FROM debian:12`. How is the Debian base
      stored on the host?
    options:
      - "Once — the identical base layers are shared between the two images (same layer digests)"
      - "Twice — every image gets a private copy of all its layers"
      - "It is never stored locally, only referenced from Docker Hub"
      - "Only the newer image keeps the base layers; the older one loses them"
    answer: 0
    explanation: |
      Layers are content-addressed by digest, so identical base layers are stored
      once and shared between images. `docker image inspect` shows matching layer
      digests. This also speeds up pulls over the network.
    ref: "concepts.md#layers-are-shared-across-containers-and-images"

  - id: images-vs-containers-015
    difficulty: intermediate
    tags: [layers, pull, network]
    question: |
      Why is pulling a new tag of an image whose base you already have often fast?
    options:
      - "Docker skips verification for known bases"
      - "New tags are always smaller than old ones"
      - "The daemon and registry transfer only the layers you don't already have; shared layers are reused"
      - "The image is streamed uncompressed, which is faster"
    answer: 2
    explanation: |
      Because layers are content-addressed, push/pull skip layers already present
      locally. Pulling a new tag downloads only changed layers, reducing bandwidth and
      storage.
    ref: "concepts.md#layers-are-shared-across-containers-and-images"

  - id: images-vs-containers-016
    difficulty: beginner
    tags: [tag, latest, identity]
    question: |
      If you run `docker pull nginx` with no tag, which tag is pulled?
    options:
      - "The newest released version, resolved automatically"
      - "The smallest available image"
      - "None; a tag is required"
      - ":latest — the default tag name"
    answer: 3
    explanation: |
      Omitting the tag defaults to `:latest`, which is simply the default tag name —
      not necessarily the newest version. It points at whatever was last pushed with
      that tag. Omitting the registry defaults to Docker Hub.
    ref: "concepts.md#image-identity-repository-tag-and-digest"

  - id: images-vs-containers-017
    difficulty: intermediate
    tags: [tag, digest, immutability]
    question: |
      What is the key difference between referencing an image by tag (`nginx:1.27`)
      versus by digest (`nginx@sha256:abcd...`)?
    options:
      - "A tag is a mutable pointer that can be moved; a digest is the immutable, content-addressed identity that always resolves to the same bytes"
      - "Tags are faster to pull than digests"
      - "Digests only work on private registries"
      - "There is no functional difference; digests are just longer tags"
    answer: 0
    explanation: |
      A tag is a human-friendly, movable label. A digest is the SHA-256 of the image
      manifest — immutable and content-addressed, so it always resolves to the exact
      same image. Pinning by digest gives reproducible, tamper-evident references.
    ref: "concepts.md#image-identity-repository-tag-and-digest"

  - id: images-vs-containers-018
    difficulty: intermediate
    tags: [latest, production, reproducibility]
    question: |
      Why is depending on `:latest` risky for production deployments?
    options:
      - "`:latest` images are always larger"
      - "`:latest` cannot be pulled from private registries"
      - "The tag can be re-pointed to a different image, so two hosts pulling the same tag at different times may run different code"
      - "Docker deletes `:latest` images after 24 hours"
    answer: 2
    explanation: |
      A tag is a mutable pointer. If the publisher re-pushes `:latest`, pulls at
      different times yield different images — non-reproducible. Pin by digest or an
      immutable version tag your pipeline never reuses.
    ref: "concepts.md#image-identity-repository-tag-and-digest"

  - id: images-vs-containers-019
    difficulty: advanced
    tags: [image-id, digest, manifest]
    question: |
      The local image ID shown by `docker images` is the digest of what?
    options:
      - "The image *config* object (local identity)"
      - "The largest layer in the image"
      - "The registry hostname"
      - "The container's writable layer"
    answer: 0
    explanation: |
      The local image ID is the digest of the image config object. That is distinct
      from the manifest digest used for `pull`/`push` by `@sha256:` (the registry
      identity). Interviewers sometimes probe this config-vs-manifest distinction.
    ref: "concepts.md#image-identity-repository-tag-and-digest"

  - id: images-vs-containers-020
    difficulty: beginner
    tags: [container-vs-vm, kernel]
    question: |
      What is the fundamental difference in how containers and virtual machines
      achieve isolation?
    options:
      - "Containers use more RAM than VMs by design"
      - "Containers share the host kernel and isolate via namespaces/cgroups; VMs run their own guest OS on a hypervisor"
      - "VMs share the host kernel; containers each ship a private kernel"
      - "Containers require special CPU virtualization extensions; VMs do not"
    answer: 1
    explanation: |
      Containers virtualize the OS: they share the host kernel and isolate processes
      with namespaces and cgroups. VMs virtualize hardware: each runs a full guest OS
      with its own kernel on a hypervisor.
    ref: "concepts.md#container-vs-virtual-machine"

  - id: images-vs-containers-021
    difficulty: beginner
    tags: [container-vs-vm, size, startup]
    question: |
      Compared to a VM, why does a container typically start in milliseconds and ship
      as MBs rather than GBs?
    options:
      - "A container has no guest OS to ship or boot — it just starts a process against a shared kernel"
      - "Containers compress their guest OS more aggressively"
      - "Containers run only interpreted languages"
      - "Containers keep their filesystem entirely in RAM"
    answer: 0
    explanation: |
      A container ships only the app plus minimal userland and borrows the running
      host kernel, so there is no OS image to ship (small) and no OS to boot (fast) —
      starting it is essentially starting a process.
    ref: "concepts.md#container-vs-virtual-machine"

  - id: images-vs-containers-022
    difficulty: intermediate
    tags: [container-vs-vm, isolation, security]
    question: |
      Which statement about isolation strength is accurate?
    options:
      - "Containers provide stronger isolation than VMs because they use namespaces"
      - "Both provide identical isolation guarantees"
      - "Containers are fully isolated because each has its own kernel"
      - "VMs generally provide stronger isolation (a hardware-level boundary) than containers, which share the host kernel"
    answer: 3
    explanation: |
      Sharing the host kernel means a container escape or kernel vulnerability has a
      larger blast radius, so container isolation is weaker than a VM's hardware-level
      boundary. This motivates kernel hardening (seccomp, user namespaces, capability
      drops) and micro-VM runtimes for hostile workloads.
    ref: "concepts.md#container-vs-virtual-machine"

  - id: images-vs-containers-023
    difficulty: intermediate
    tags: [container-vs-vm, kernel, cross-os]
    question: |
      Why can't a native Linux container image run directly on a Windows kernel, and
      how does Docker Desktop on macOS/Windows run Linux containers anyway?
    options:
      - "It can run directly; the kernel is irrelevant to containers"
      - "Docker recompiles the image for the host OS on pull"
      - "A container needs a compatible kernel; Docker Desktop runs Linux containers inside a hidden lightweight Linux VM"
      - "Windows emulates the Linux kernel at the CPU level for every container"
    answer: 2
    explanation: |
      Because containers share the host kernel, a Linux container needs a Linux
      kernel. Docker Desktop transparently runs a lightweight Linux VM and starts the
      containers inside it — that's how "Docker on a Mac" works.
    ref: "concepts.md#container-vs-virtual-machine"

  - id: images-vs-containers-024
    difficulty: beginner
    tags: [lightweight, portability]
    question: |
      Which best explains why containers are considered "portable"?
    options:
      - "They automatically rewrite code for the target OS"
      - "The image bundles the app and all its dependencies into one immutable artifact that runs identically anywhere with a compatible kernel and runtime"
      - "They run only in the cloud, which is the same everywhere"
      - "They store no files, so there is nothing to move"
    answer: 1
    explanation: |
      Portability comes from bundling all dependencies into one immutable image. Given
      a compatible kernel/CPU architecture and a runtime, the same image runs the same
      on a laptop, CI runner, and prod — killing "works on my machine."
    ref: "concepts.md#why-containers-are-lightweight-fast-and-portable"

  - id: images-vs-containers-025
    difficulty: intermediate
    tags: [portability, architecture, multi-arch]
    question: |
      What is a real limit on container portability?
    options:
      - "Images only run on the exact host they were built on"
      - "Images can never move between clouds"
      - "Containers can only run one process, limiting portability"
      - "Architecture: an amd64 image won't run on arm64 without emulation or a multi-arch image"
    answer: 3
    explanation: |
      Portability is bounded by CPU architecture and kernel compatibility. An amd64
      image won't natively run on arm64; you need emulation (slow) or a multi-arch
      image. Otherwise the same artifact runs anywhere with a compatible runtime.
    ref: "concepts.md#why-containers-are-lightweight-fast-and-portable"

  - id: images-vs-containers-026
    difficulty: intermediate
    tags: [lightweight, root-cause]
    question: |
      The lightweight, fast-start, and portable properties of containers all trace
      back to one root cause. Which?
    options:
      - "Containers are written in Go"
      - "Containers keep all state in RAM"
      - "A container is just a host process using a shared kernel, running against an immutable layered filesystem"
      - "Containers use a proprietary compression format"
    answer: 2
    explanation: |
      No guest OS to ship (lightweight), no OS to boot (fast), self-contained
      immutable artifact (portable) — all because a container is fundamentally a host
      process over a shared kernel and a layered read-only filesystem.
    ref: "concepts.md#why-containers-are-lightweight-fast-and-portable"

  - id: images-vs-containers-027
    difficulty: beginner
    tags: [process, isolation]
    question: |
      From the host operating system's perspective, what is a running container?
    options:
      - "A specialized micro-VM with its own kernel"
      - "A normal host process (or process tree) wrapped in kernel namespaces and cgroups"
      - "A remote connection to Docker Hub"
      - "An entry in a database with no process behind it"
    answer: 1
    explanation: |
      A container is an ordinary host process visible in the host's `ps`/`top`. What
      makes it a container is the kernel isolation around it — namespaces (view
      isolation) and cgroups (resource limits) over the image's rootfs.
    ref: "concepts.md#a-container-is-just-a-process"

  - id: images-vs-containers-028
    difficulty: intermediate
    tags: [namespaces, isolation]
    question: |
      What do Linux *namespaces* provide for a container?
    options:
      - "Hard limits on CPU and memory usage"
      - "Encryption of the container filesystem"
      - "Automatic restart when the process crashes"
      - "An isolated *view* of a global resource — e.g. its own PID space, mount tree, network stack, and hostname"
    answer: 3
    explanation: |
      Namespaces isolate what a process can *see*: pid (own PID space, so PID 1 is the
      main process), mnt (own root fs), net (own interfaces/IPs), uts (hostname), ipc,
      user, and cgroup. Resource *limits* are the job of cgroups.
    ref: "concepts.md#a-container-is-just-a-process"

  - id: images-vs-containers-029
    difficulty: intermediate
    tags: [cgroups, limits]
    question: |
      `docker run --memory=512m --cpus=1.5 myapp` enforces those limits using which
      kernel feature?
    options:
      - "Namespaces"
      - "seccomp profiles"
      - "Control groups (cgroups)"
      - "The union filesystem"
    answer: 2
    explanation: |
      cgroups limit and account resource usage — CPU, memory, block I/O, PIDs. The
      `--memory` and `--cpus` flags set cgroup limits. Namespaces handle view
      isolation, not resource caps.
    ref: "concepts.md#a-container-is-just-a-process"

  - id: images-vs-containers-030
    difficulty: intermediate
    tags: [pid1, lifecycle, process]
    question: |
      A container's main process (PID 1 inside it) exits. What happens to the
      container?
    options:
      - "It keeps running in the background"
      - "The container stops — it lives and dies with its main process"
      - "Docker automatically restarts a new main process forever"
      - "It converts into an image"
    answer: 1
    explanation: |
      A container is its process: when PID 1 inside exits, the container stops. This is
      why the foreground process must be your app (not a wrapper that backgrounds it),
      and why PID 1 signal handling and zombie reaping (`--init`) matter.
    ref: "concepts.md#a-container-is-just-a-process"

  - id: images-vs-containers-031
    difficulty: advanced
    tags: [process, emergent, kernel]
    question: |
      Which statement most accurately describes what a "container" is at the kernel
      level?
    options:
      - "A first-class kernel object created by a `create_container()` syscall"
      - "A lightweight kernel thread scheduled separately from processes"
      - "An emergent bundle of a process plus namespaces, cgroups, and a union rootfs — there is no single kernel 'container object'"
      - "A hypervisor guest with a reduced feature set"
    answer: 2
    explanation: |
      There is no kernel "container" primitive. A container is an emergent combination
      of a process, the namespaces isolating its view, the cgroups limiting its
      resources, and a union filesystem as its root. Docker/runc assemble these.
    ref: "concepts.md#a-container-is-just-a-process"

  - id: images-vs-containers-032
    difficulty: beginner
    tags: [union-filesystem, overlay]
    question: |
      Why does a container need a union (overlay) filesystem?
    options:
      - "To encrypt the image layers at rest"
      - "To compress the image before pushing"
      - "To share the container's writable layer with the registry"
      - "To stack the many read-only image layers plus the writable layer into a single coherent root filesystem the container sees as /"
    answer: 3
    explanation: |
      An image is many read-only layers, but the container needs one root filesystem.
      A union filesystem stacks them (upper layers shadow lower ones) and presents a
      single merged view, with the writable layer on top.
    ref: "concepts.md#the-union-filesystem-stacking-layers-into-one-root"

  - id: images-vs-containers-033
    difficulty: advanced
    tags: [overlay2, lowerdir, upperdir]
    question: |
      In the overlay2 storage driver, which directory holds the container's writable
      layer?
    options:
      - "lowerdir"
      - "upperdir"
      - "merged"
      - "workdir"
    answer: 1
    explanation: |
      overlay2 maps to OverlayFS: lowerdir = the read-only image layers, upperdir =
      the container's writable layer, merged = the unified view the container sees as
      /, and workdir = internal scratch space OverlayFS needs for atomic operations.
    ref: "concepts.md#the-union-filesystem-stacking-layers-into-one-root"

  - id: images-vs-containers-034
    difficulty: intermediate
    tags: [union-filesystem, overlay2, default-driver]
    question: |
      What is the default storage/union-filesystem driver on modern Linux Docker
      installations?
    options:
      - "aufs"
      - "devicemapper"
      - "overlay2 (backed by the kernel's OverlayFS)"
      - "vfs"
    answer: 2
    explanation: |
      overlay2 is the default on modern Linux Docker, backed by kernel OverlayFS.
      Older/alternative drivers include aufs (historical), btrfs, zfs, devicemapper,
      and the copy-everything vfs used when no CoW filesystem is available.
    ref: "concepts.md#the-union-filesystem-stacking-layers-into-one-root"

  - id: images-vs-containers-035
    difficulty: advanced
    tags: [vfs, storage-driver, cow]
    question: |
      How does the `vfs` storage driver differ from overlay2?
    options:
      - "vfs is faster because it caches everything in RAM"
      - "vfs has no copy-on-write filesystem, so it makes a full copy of image data for each container"
      - "vfs stores layers only in the registry"
      - "vfs encrypts each layer independently"
    answer: 1
    explanation: |
      vfs provides no CoW, so each container/layer is a full physical copy — high disk
      use and slow, but robust where no union filesystem is available. overlay2 shares
      read-only layers and copies up only on first write.
    ref: "concepts.md#the-union-filesystem-stacking-layers-into-one-root"

  - id: images-vs-containers-036
    difficulty: beginner
    tags: [docker-run, create, start]
    question: |
      `docker run` is a convenience that combines which two lower-level operations?
    options:
      - "`docker build` and `docker push`"
      - "`docker pull` and `docker commit`"
      - "`docker create` (instantiate the container) and `docker start` (launch its process)"
      - "`docker exec` and `docker attach`"
    answer: 2
    explanation: |
      `docker run` = `docker create` (allocate the writable layer and config, state
      Created) then `docker start` (set up namespaces/cgroups and launch the process,
      state Running). Splitting them lets you, e.g., `docker cp` files in before start.
    ref: "concepts.md#docker-run--create--start-and-the-lifecycle"

  - id: images-vs-containers-037
    difficulty: intermediate
    tags: [docker-run, reuse, containers]
    question: |
      You run `docker run nginx` three times. What is the result?
    options:
      - "One container that is restarted three times"
      - "An error on the second run because the name is taken"
      - "The image is rebuilt three times"
      - "Three separate containers are created from the image (repeated runs don't reuse a previous container)"
    answer: 3
    explanation: |
      `docker run` always creates a *new* container from the image. Three runs leave
      three containers (two likely stopped). To resume an existing one use `docker
      start <name>`; use `--rm` to auto-remove on exit.
    ref: "concepts.md#docker-run--create--start-and-the-lifecycle"

  - id: images-vs-containers-038
    difficulty: intermediate
    tags: [lifecycle, stopped, removed]
    question: |
      What is the difference between a *stopped* container and a *removed* container?
    options:
      - "A stopped container still exists on disk (writable layer + config, shown by `docker ps -a`) and can be restarted; `docker rm` deletes it and its writable layer"
      - "There is none; both free all resources"
      - "A stopped container has been pushed to the registry; a removed one has not"
      - "A removed container can be restarted; a stopped one cannot"
    answer: 0
    explanation: |
      Stopping keeps the container and its writable layer on disk, so it can be
      restarted with its prior writes intact and shows in `docker ps -a`. Only
      `docker rm` deletes the container and discards its writable layer.
    ref: "concepts.md#docker-run--create--start-and-the-lifecycle"

  - id: images-vs-containers-039
    difficulty: intermediate
    tags: [lifecycle, create, cp]
    question: |
      Why might you deliberately use `docker create` instead of `docker run`?
    options:
      - "To build an image without a Dockerfile"
      - "To push the container to a registry"
      - "To instantiate a container (allocate its writable layer/config) so you can, e.g., `docker cp` files into it before starting it"
      - "To run the container with no writable layer"
    answer: 2
    explanation: |
      `docker create` puts a container in the Created state without starting the
      process, which is useful to stage it — for example copy files in with `docker
      cp`, then `docker start` it later.
    ref: "concepts.md#docker-run--create--start-and-the-lifecycle"

  - id: images-vs-containers-040
    difficulty: beginner
    tags: [ephemeral, disposable, 12-factor]
    question: |
      The "cattle, not pets" / disposable-container mindset implies which practice?
    options:
      - "SSH into running containers to patch them in place"
      - "Treat containers as replaceable — never store durable state in the container filesystem; rebuild and replace rather than mutate"
      - "Keep one long-lived container and never restart it"
      - "Store secrets inside image layers for convenience"
    answer: 1
    explanation: |
      Disposability means any container can be killed and replaced by an identical one
      with no data loss. State lives in volumes/databases/object storage, and you
      replace containers (immutable infrastructure) rather than patching them live.
    ref: "concepts.md#ephemeral-and-disposable-containers-12-factor"

  - id: images-vs-containers-041
    difficulty: intermediate
    tags: [12-factor, config, immutable-infra]
    question: |
      Following the twelve-factor "immutable infrastructure" idea, how should you apply
      a code change to a running container?
    options:
      - "Build a new image and replace the container with one from the new image"
      - "Exec into the container and edit files in place"
      - "Commit the running container back to `:latest` and keep using it"
      - "Mount the new code over the old code at runtime"
    answer: 0
    explanation: |
      Immutable infrastructure means you don't mutate running containers; you build a
      new image and replace the container. Rollbacks become trivial (redeploy the
      prior image) and configuration drift is eliminated.
    ref: "concepts.md#ephemeral-and-disposable-containers-12-factor"

  - id: images-vs-containers-042
    difficulty: intermediate
    tags: [persistence, volumes, state]
    question: |
      A containerized app accepts user file uploads. Where should those uploads be
      stored so they survive container replacement?
    options:
      - "In the container's writable layer for speed"
      - "Baked into the image at build time"
      - "In a volume/bind mount or an external service (e.g. object storage), not the writable layer"
      - "In environment variables"
    answer: 2
    explanation: |
      The writable layer is ephemeral and not shared, so it is the wrong place for
      durable data. Persist uploads to a volume/bind mount for local storage or, better,
      an external managed service like S3 — containers are disposable, state lives
      outside them.
    ref: "concepts.md#ephemeral-and-disposable-containers-12-factor"

  - id: images-vs-containers-043
    difficulty: advanced
    tags: [graceful-shutdown, sigterm, disposability]
    question: |
      Why does the disposability principle emphasize handling `SIGTERM` in the
      container's PID 1?
    options:
      - "SIGTERM rebuilds the image"
      - "SIGTERM is required to persist the writable layer"
      - "It prevents the container from ever being removed"
      - "So the app can drain in-flight work and shut down gracefully before the SIGKILL timeout, letting the orchestrator freely reschedule it"
    answer: 3
    explanation: |
      `docker stop` sends SIGTERM then SIGKILL after a grace period. Handling SIGTERM
      in PID 1 lets the app finish/redirect in-flight work and exit cleanly, so it can
      be started and destroyed at will — the essence of disposability.
    ref: "concepts.md#ephemeral-and-disposable-containers-12-factor"

  - id: images-vs-containers-044
    difficulty: advanced
    tags: [scenario, cow, database]
    question: |
      A team runs a write-heavy database *inside* a container, writing to the container
      filesystem, and reports poor and degrading I/O plus data loss on redeploys. What
      is the core problem?
    options:
      - "The image is too small"
      - "Heavy writes go through the copy-on-write writable layer (per-file copy_up overhead) and are ephemeral — the data belongs on a volume, which bypasses the union FS and persists"
      - "The database needs its own kernel"
      - "cgroups are blocking disk writes"
    answer: 1
    explanation: |
      Writing hot data into the writable layer incurs copy_up overhead and is
      destroyed on container removal (hence data loss on redeploy). Databases should
      write to a volume, which bypasses the union filesystem for performance and
      persists independently of the container.
    ref: "concepts.md#copy-on-write-and-the-thin-writable-layer"

  - id: images-vs-containers-045
    difficulty: intermediate
    tags: [scenario, image-vs-container, mental-model]
    question: |
      An interviewer asks you to map Docker images/containers onto object-oriented
      terms. Which mapping is correct?
    options:
      - "Image = object instance; container = class"
      - "Image and container are both instances of a Dockerfile object"
      - "Image = class (template); container = instance"
      - "Container = class; image = the compiled binary"
    answer: 2
    explanation: |
      The image is the class/template (immutable definition); each container is an
      instance created from it, with its own state (writable layer, running process).
      One image → many containers, mirroring class → many instances.
    ref: "concepts.md#container-a-running-instance-of-an-image"

  - id: images-vs-containers-046
    difficulty: advanced
    tags: [scenario, layers, disk-usage]
    question: |
      `docker system df` reports 12 GB of images but the images you list only "add up"
      to far more than 12 GB if counted individually. Why the discrepancy?
    options:
      - "Docker is misreporting sizes"
      - "Stopped containers are being counted as images"
      - "The registry is caching layers locally"
      - "Images share content-addressed layers; shared base layers are counted once on disk, so summing per-image sizes double-counts them"
    answer: 3
    explanation: |
      Per-image sizes include shared layers, but on disk those layers are stored once.
      Summing per-image sizes double-counts shared base layers; `docker system df`
      reports actual (deduplicated) disk usage.
    ref: "concepts.md#layers-are-shared-across-containers-and-images"

  - id: images-vs-containers-047
    difficulty: intermediate
    tags: [scenario, latest, deployment]
    question: |
      Two production hosts deploy the same manifest referencing `myapp:latest` a week
      apart and end up running different code. What is the most likely cause and fix?
    options:
      - "A network glitch; retry the pull"
      - "`:latest` was re-pushed between the two pulls; pin to an immutable digest or a version tag your pipeline never reuses"
      - "One host has a different kernel; upgrade it"
      - "The image ran out of layers; rebuild it"
    answer: 1
    explanation: |
      A tag is a mutable pointer. If `:latest` is re-pushed between pulls, hosts get
      different images. The fix is to reference an immutable digest (or an
      always-unique version tag) so every host runs identical bytes.
    ref: "concepts.md#image-identity-repository-tag-and-digest"

  - id: images-vs-containers-048
    difficulty: advanced
    tags: [scenario, process, orphaned-process]
    question: |
      A Dockerfile uses `CMD ["sh", "-c", "myserver &"]` (backgrounding the server).
      The container starts and immediately exits. Why?
    options:
      - "Backgrounding is forbidden in containers"
      - "The image lacks a writable layer"
      - "PID 1 (the shell) has nothing left to do after launching the server in the background, so it exits — and when PID 1 exits, the container stops"
      - "SIGTERM was delivered on startup"
    answer: 2
    explanation: |
      A container lives with its PID 1. Backgrounding the server makes the shell (PID 1)
      return immediately, so it exits and the container stops — taking the backgrounded
      server with it. Run the server in the foreground as PID 1 instead.
    ref: "concepts.md#a-container-is-just-a-process"

  - id: images-vs-containers-049
    difficulty: beginner
    tags: [container, state, running]
    question: |
      Which of the following does a *container* have that an *image* does not?
    options:
      - "Filesystem layers"
      - "A config with a default command"
      - "Runtime state: a running process, PID, network interfaces, and a writable layer"
      - "A content-addressed digest"
    answer: 2
    explanation: |
      An image is a static artifact (layers + config + digest). Only a container has
      runtime state — a live process, PID, network namespace, and its own writable
      layer. That runtime state is what makes it an "instance."
    ref: "concepts.md#container-a-running-instance-of-an-image"

  - id: images-vs-containers-050
    difficulty: intermediate
    tags: [union-filesystem, shadowing, layers]
    question: |
      In a union filesystem, if the same path `/app/config.json` exists in two
      different image layers, which version does the container see?
    options:
      - "The version in the lowest (base) layer"
      - "The version in the highest (upper-most) layer, which shadows the lower one"
      - "Both, merged byte-by-byte"
      - "Neither — a conflict error is raised"
    answer: 1
    explanation: |
      Union filesystems resolve top-down: a file in an upper layer shadows a
      same-path file in a lower layer. The container sees the upper-most version;
      the lower one is hidden but still present on disk.
    ref: "concepts.md#the-union-filesystem-stacking-layers-into-one-root"
