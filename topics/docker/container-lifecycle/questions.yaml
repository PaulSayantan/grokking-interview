topic: "Container Lifecycle & Runtime Operations"
domain: docker
topic_slug: container-lifecycle
version: 1
questions:
  - id: container-lifecycle-001
    difficulty: beginner
    tags: [process-model, mental-model]
    question: |
      Which statement best captures the correct mental model of a Docker container?
    options:
      - "One or more processes on the host kernel, isolated by namespaces and limited by cgroups"
      - "A lightweight virtual machine with its own guest kernel"
      - "A snapshot of an operating system that boots on startup"
      - "A network service that always runs an init system as PID 1"
    answer: 0
    explanation: |
      A container is not a VM: it shares the host kernel and is simply a process (or process tree)
      wrapped in namespaces (isolation) and cgroups (limits). There is no guest kernel and no boot
      sequence, which is why a container lives only as long as its main process.
    ref: "concepts.md#the-container-as-a-process-model"

  - id: container-lifecycle-002
    difficulty: beginner
    tags: [process-model, exit]
    question: |
      You run `docker run ubuntu` and the container exits immediately. Why?
    options:
      - "The default command (bash) has no TTY/work to do, so PID 1 finishes and the container stops"
      - "Docker requires a -d flag or it refuses to keep any container running"
      - "Ubuntu images are broken without a --name flag"
      - "The image failed to pull and silently exited"
    answer: 0
    explanation: |
      A container lives exactly as long as its PID 1. Ubuntu's default command is a shell; with no
      interactive TTY and nothing to do, it exits, so the container stops immediately. A container
      stays up only when its foreground process keeps running.
    ref: "concepts.md#the-container-as-a-process-model"

  - id: container-lifecycle-003
    difficulty: intermediate
    tags: [process-model, foreground, gotcha]
    question: |
      Which Dockerfile CMD keeps an nginx container running as intended?
    options:
      - 'CMD service nginx start'
      - 'CMD nginx &'
      - 'CMD systemctl start nginx'
      - 'CMD ["nginx", "-g", "daemon off;"]'
    answer: 3
    explanation: |
      The container lives as long as PID 1. `service nginx start` and backgrounding return
      immediately, so PID 1 exits and the container stops. Running nginx in the foreground
      (`daemon off;`) keeps PID 1 alive serving requests.
    ref: "concepts.md#the-container-as-a-process-model"

  - id: container-lifecycle-004
    difficulty: beginner
    tags: [state-machine, status]
    question: |
      In `docker ps -a`, what STATUS does a container that has finished running report?
    options:
      - "exited"
      - "terminated"
      - "stopped"
      - "halted"
    answer: 0
    explanation: |
      Docker has no "stopped" status string; a container whose process has ended reports `exited`
      (with its exit code). People say "stopped" colloquially, but the daemon's term is `exited`.
    ref: "concepts.md#the-lifecycle-state-machine"

  - id: container-lifecycle-005
    difficulty: intermediate
    tags: [state-machine, states]
    question: |
      Which lifecycle state means the container's config and filesystem exist but its process has
      never been started?
    options:
      - "paused"
      - "restarting"
      - "created"
      - "dead"
    answer: 2
    explanation: |
      `created` is produced by `docker create` (or a `run` that failed before start): the writable
      layer and config exist, but PID 1 has never executed. `docker start` moves it to `running`.
    ref: "concepts.md#the-lifecycle-state-machine"

  - id: container-lifecycle-006
    difficulty: advanced
    tags: [state-machine, dead]
    question: |
      When does a container end up in the `dead` state?
    options:
      - "Whenever it exits with a non-zero code"
      - "When it is paused for too long"
      - "When its restart policy has exhausted all retries"
      - "When the daemon could not fully remove it (e.g. an unkillable process or storage error)"
    answer: 3
    explanation: |
      `dead` is a rare, defunct state: the daemon attempted to remove the container but could not
      fully do so (for example a process that won't die or an underlying storage/driver error). It
      requires manual cleanup and does not correspond to normal exits.
    ref: "concepts.md#the-lifecycle-state-machine"

  - id: container-lifecycle-007
    difficulty: intermediate
    tags: [run, create, start]
    question: |
      `docker run` is best described as which combination of lower-level operations?
    options:
      - "docker build + docker start"
      - "docker pull + docker exec"
      - "docker create + docker start"
      - "docker start + docker attach only"
    answer: 2
    explanation: |
      `docker run` is `docker create` (make the writable layer + config, ID printed) followed by
      `docker start` (launch PID 1), with attach/log wiring. Splitting them lets you configure a
      container and get its ID before anything executes.
    ref: "concepts.md#run-vs-create-vs-start"

  - id: container-lifecycle-008
    difficulty: intermediate
    tags: [start, immutability, writable-layer]
    question: |
      You `docker run` a container, it writes a file to its writable layer, then exits. You run
      `docker start` on that same container again. What happens to the file?
    options:
      - "It is gone; start always begins from a clean image layer"
      - "Start creates a brand-new container, so a fresh copy is made"
      - "It is still there; start re-runs the same container with its existing writable layer"
      - "Docker refuses to start an exited container"
    answer: 2
    explanation: |
      `docker start` re-runs the *same* container with the same original command and its intact
      writable layer, so files written previously persist. `docker run`, by contrast, always
      creates a brand-new container from the image.
    ref: "concepts.md#run-vs-create-vs-start"

  - id: container-lifecycle-009
    difficulty: intermediate
    tags: [start, immutability, config]
    question: |
      You need to change the published ports of a running container. What must you do?
    options:
      - "Run `docker update --publish` to remap ports live"
      - "Remove the container and `docker run` a fresh one with the new port mapping"
      - "Stop it and `docker start -p` with new ports"
      - "Edit the container's config JSON and restart the daemon"
    answer: 1
    explanation: |
      Ports, env, and the command are fixed at create/run time and cannot be changed on an
      existing container. To change them you must remove the container and run a new one. This
      immutability is intentional and supports reproducibility.
    ref: "concepts.md#run-vs-create-vs-start"

  - id: container-lifecycle-010
    difficulty: beginner
    tags: [detached, foreground]
    question: |
      What does the `-d` / `--detach` flag on `docker run` do?
    options:
      - "Deletes the container automatically when it exits"
      - "Disables the container's network"
      - "Runs the container in the background and returns immediately, printing the container ID"
      - "Detaches the container's storage volumes"
    answer: 2
    explanation: |
      `-d` runs the container in the background; the CLI returns right away with the container ID
      instead of blocking on the container's output. You interact afterward via logs/exec/attach.
      (Auto-remove on exit is `--rm`, a different flag.)
    ref: "concepts.md#foreground-detached-and-interactive-tty-flags"

  - id: container-lifecycle-011
    difficulty: intermediate
    tags: [tty, interactive, flags]
    question: |
      What does the `-t` flag add compared to using `-i` alone?
    options:
      - "It keeps stdin open"
      - "It runs the container as root"
      - "It tails the container logs"
      - "It allocates a pseudo-TTY (prompt, line editing, job control)"
    answer: 3
    explanation: |
      `-i` keeps stdin open; `-t` allocates a pseudo-TTY, giving terminal features like a prompt
      and line editing. `-it` together is the classic interactive-shell combination.
    ref: "concepts.md#foreground-detached-and-interactive-tty-flags"

  - id: container-lifecycle-012
    difficulty: intermediate
    tags: [tty, pipe, ci, gotcha]
    question: |
      You are piping data into a container in a CI script: `cat data | docker run ??? alpine cat`.
      Which flag(s) are appropriate?
    options:
      - "-it (both)"
      - "-t only"
      - "-i only"
      - "-d only"
    answer: 2
    explanation: |
      Use `-i` alone to keep stdin open for the pipe. Adding `-t` allocates a TTY the app thinks is
      a real terminal, producing garbled output/CRLF artifacts in non-interactive contexts like CI.
    ref: "concepts.md#foreground-detached-and-interactive-tty-flags"

  - id: container-lifecycle-013
    difficulty: beginner
    tags: [stop, signals, sigterm]
    question: |
      What signal does `docker stop` send to PID 1 by default first?
    options:
      - "SIGKILL"
      - "SIGHUP"
      - "SIGTERM"
      - "SIGSTOP"
    answer: 2
    explanation: |
      `docker stop` sends the container's stop signal — `SIGTERM` by default — to give the process a
      chance to shut down gracefully. Only after the grace period does it escalate to SIGKILL.
    ref: "concepts.md#stopping-sigterm-the-grace-period-then-sigkill"

  - id: container-lifecycle-014
    difficulty: intermediate
    tags: [stop, grace-period, sigkill]
    question: |
      With no override, how long does `docker stop` wait on Linux after SIGTERM before sending
      SIGKILL?
    options:
      - "1 second"
      - "10 seconds"
      - "60 seconds"
      - "30 seconds"
    answer: 1
    explanation: |
      The default Linux grace period is 10 seconds (Windows containers default to 30). If PID 1 is
      still alive when it expires, Docker sends the uncatchable SIGKILL. Change it with `-t`.
    ref: "concepts.md#stopping-sigterm-the-grace-period-then-sigkill"

  - id: container-lifecycle-015
    difficulty: intermediate
    tags: [stop, kill, signals]
    question: |
      What is the key difference between `docker kill` and `docker stop`?
    options:
      - "`kill` removes the container; `stop` only pauses it"
      - "They are identical aliases"
      - "`kill` works only on paused containers"
      - "`stop` sends SIGTERM then SIGKILL after a grace period; `kill` sends SIGKILL immediately by default"
    answer: 3
    explanation: |
      `docker stop` is graceful: SIGTERM, wait, then SIGKILL. `docker kill` sends SIGKILL right away
      by default (or any signal via `--signal`, e.g. SIGHUP to trigger a reload). Neither removes
      the container.
    ref: "concepts.md#stopping-sigterm-the-grace-period-then-sigkill"

  - id: container-lifecycle-016
    difficulty: advanced
    tags: [stop, shell-form, signals, gotcha]
    question: |
      A container's Dockerfile ends with `CMD npm start`. Every `docker stop` takes a full 10
      seconds and the app never logs a clean shutdown. What is the most likely cause?
    options:
      - "The shell form makes PID 1 be /bin/sh, which does not forward SIGTERM to the app"
      - "The grace period must be increased"
      - "npm is too slow to boot"
      - "The container has no restart policy"
    answer: 0
    explanation: |
      Shell form runs the app as a child of `/bin/sh -c`, so PID 1 is the shell, which does not
      forward SIGTERM. The app never sees the signal, the grace period elapses, and Docker
      SIGKILLs after 10s. Use exec form (`CMD ["npm","start"]`) so the app is PID 1.
    ref: "concepts.md#stopping-sigterm-the-grace-period-then-sigkill"

  - id: container-lifecycle-017
    difficulty: advanced
    tags: [stop, stopsignal, dockerfile]
    question: |
      An app shuts down gracefully on SIGQUIT but not SIGTERM. How do you make `docker stop`
      trigger a graceful shutdown without changing the app?
    options:
      - "Increase the stop timeout to 60s"
      - "Add `--restart always`"
      - "Set `STOPSIGNAL SIGQUIT` (or `--stop-signal=SIGQUIT`)"
      - "Run with `--init`"
    answer: 2
    explanation: |
      The stop signal is configurable. `STOPSIGNAL SIGQUIT` in the Dockerfile (or `--stop-signal`
      at run) makes `docker stop` send SIGQUIT instead of SIGTERM, matching what the app handles.
    ref: "concepts.md#stopping-sigterm-the-grace-period-then-sigkill"

  - id: container-lifecycle-018
    difficulty: beginner
    tags: [exit-codes, exit]
    question: |
      What determines a container's exit code?
    options:
      - "The number of layers in the image"
      - "How long the container ran"
      - "The restart policy in effect"
      - "The exit status of PID 1 (the container's main process)"
    answer: 3
    explanation: |
      A container's exit code is exactly the exit status of its main process (PID 1). `sh -c 'exit
      7'` yields `exited (7)`. This code is the primary clue when debugging why a container stopped.
    ref: "concepts.md#why-a-container-exits-and-exit-codes"

  - id: container-lifecycle-019
    difficulty: intermediate
    tags: [exit-codes, oom, sigkill]
    question: |
      A container repeatedly ends with `Exited (137)`. What does 137 indicate?
    options:
      - "A successful clean exit"
      - "The command was not found"
      - "A Docker daemon configuration error"
      - "The process was killed by SIGKILL (128 + 9), often an OOM kill or a stop timeout"
    answer: 3
    explanation: |
      By the 128+N convention, 137 = 128 + 9 = killed by SIGKILL. Common causes: the kernel OOM
      killer (check `OOMKilled=true`) after exceeding `--memory`, or `docker stop` escalating to
      SIGKILL after the grace period.
    ref: "concepts.md#why-a-container-exits-and-exit-codes"

  - id: container-lifecycle-020
    difficulty: advanced
    tags: [exit-codes, daemon]
    question: |
      `docker run` fails and reports exit code 125. What does that signify?
    options:
      - "The container's own process returned 125"
      - "The Docker daemon itself failed to run the container (bad flag/config), not your process"
      - "The command was found but not executable"
      - "The container ran out of memory"
    answer: 1
    explanation: |
      125 is reserved for the Docker engine erroring before/while launching (invalid flag,
      config error). 126 = command not executable, 127 = command not found — those are about your
      command; 125 is about Docker itself.
    ref: "concepts.md#why-a-container-exits-and-exit-codes"

  - id: container-lifecycle-021
    difficulty: intermediate
    tags: [exit-codes, command-not-found]
    question: |
      `docker run myimage /usr/local/bin/app` exits with 127. What is wrong?
    options:
      - "The binary exists but lacks execute permission"
      - "The daemon rejected the run"
      - "The app ran successfully and returned 127 on purpose"
      - "The command/binary could not be found in the container"
    answer: 3
    explanation: |
      127 means "command not found" — the path doesn't exist in the image (e.g. wrong path, or the
      binary wasn't copied in). 126 would mean it was found but not executable.
    ref: "concepts.md#why-a-container-exits-and-exit-codes"

  - id: container-lifecycle-022
    difficulty: beginner
    tags: [restart-policy, default]
    question: |
      What is the default restart policy for `docker run` if you specify none?
    options:
      - "no"
      - "on-failure"
      - "always"
      - "unless-stopped"
    answer: 0
    explanation: |
      The default is `no`: Docker never automatically restarts the container, regardless of how it
      exits or whether the daemon/host restarts. You opt into automatic restarts with `--restart`.
    ref: "concepts.md#restart-policies"

  - id: container-lifecycle-023
    difficulty: intermediate
    tags: [restart-policy, on-failure]
    question: |
      Which restart policy restarts the container only when it exits with a non-zero code, and can
      cap the number of attempts?
    options:
      - "always"
      - "on-failure[:N]"
      - "unless-stopped"
      - "no"
    answer: 1
    explanation: |
      `on-failure[:N]` restarts only on a non-zero exit (a failure) and optionally limits retries
      to N. A clean exit (0) is left alone, unlike `always`/`unless-stopped` which restart on any
      exit.
    ref: "concepts.md#restart-policies"

  - id: container-lifecycle-024
    difficulty: advanced
    tags: [restart-policy, always, unless-stopped]
    question: |
      You manually `docker stop` a container, then the Docker daemon restarts (e.g. host reboot).
      Which policy will bring the container back up, and which will leave it down?
    options:
      - "`always` brings it back; `unless-stopped` leaves it down"
      - "`unless-stopped` brings it back; `always` leaves it down"
      - "Both bring it back up"
      - "Neither brings it back up"
    answer: 0
    explanation: |
      `always` forgets your manual stop and relaunches the container when the daemon restarts.
      `unless-stopped` remembers that you deliberately stopped it and leaves it down. That's the
      one behavioral difference between them.
    ref: "concepts.md#restart-policies"

  - id: container-lifecycle-025
    difficulty: intermediate
    tags: [restart-policy, manual-stop]
    question: |
      A container runs with `--restart unless-stopped`. You run `docker stop` on it. Does the
      restart policy immediately bring it back?
    options:
      - "No — a manual stop overrides the policy; it only reacts to the process exiting on its own"
      - "Yes, after the grace period"
      - "Yes, immediately"
      - "Only if it exited non-zero"
    answer: 0
    explanation: |
      A manual `docker stop` overrides restart policies to avoid fighting the operator. The policy
      reacts to the process exiting on its own (crash) or to a daemon restart, not to your explicit
      stop.
    ref: "concepts.md#restart-policies"

  - id: container-lifecycle-026
    difficulty: advanced
    tags: [restart-policy, backoff, crash-loop]
    question: |
      To avoid hammering the host when a container crashes repeatedly, how does Docker schedule
      restarts under a restart policy?
    options:
      - "It restarts at a fixed 1-second interval forever"
      - "It stops trying after the first failure"
      - "It waits exactly the grace period between attempts"
      - "It uses an increasing (exponential) backoff delay between restart attempts"
    answer: 3
    explanation: |
      Docker uses an exponential backoff (starting around 100ms and doubling) between restart
      attempts so a tight crash loop doesn't overwhelm the host.
    ref: "concepts.md#restart-policies"

  - id: container-lifecycle-027
    difficulty: intermediate
    tags: [restart-policy, rm, conflict]
    question: |
      Why can't you combine `--restart` with `--rm`?
    options:
      - "`--rm` requires root"
      - "`--restart` only works with detached mode"
      - "A restart policy keeps the container around to restart it, while `--rm` deletes it on exit — the two conflict"
      - "They can be combined; there is no conflict"
    answer: 2
    explanation: |
      `--rm` auto-removes the container the moment it exits, but a restart policy needs the
      container to persist so it can be restarted. The two are mutually exclusive.
    ref: "concepts.md#restart-policies"

  - id: container-lifecycle-028
    difficulty: intermediate
    tags: [pause, freezer-cgroup]
    question: |
      What does `docker pause` do to a container's processes?
    options:
      - "Swaps the container's memory to disk and stops it"
      - "Freezes all processes via the freezer cgroup, with no signal delivered and memory retained"
      - "Sends SIGSTOP to PID 1 only"
      - "Sends SIGTERM and waits"
    answer: 1
    explanation: |
      `docker pause` uses the kernel freezer cgroup to suspend all processes in place. No signal is
      sent, memory stays resident, and the process doesn't know it was paused. `unpause` resumes it
      exactly where it left off.
    ref: "concepts.md#pausing-and-unpausing"

  - id: container-lifecycle-029
    difficulty: intermediate
    tags: [pause, memory, misconception]
    question: |
      Which statement about `docker pause` is TRUE?
    options:
      - "It keeps memory resident and port bindings held; it only stops CPU scheduling"
      - "It frees the container's memory back to the host"
      - "It is functionally the same as `docker stop`"
      - "The process receives a SIGSTOP it can handle"
    answer: 0
    explanation: |
      Pausing is a scheduler freeze: memory stays allocated and ports stay bound; the container
      just stops consuming CPU. It is not a substitute for stopping, and no catchable signal is
      delivered.
    ref: "concepts.md#pausing-and-unpausing"

  - id: container-lifecycle-030
    difficulty: beginner
    tags: [exec, debug-shell]
    question: |
      What is the correct command to open an interactive shell in an already-running container
      named `web`?
    options:
      - "docker exec -it web sh"
      - "docker run -it web sh"
      - "docker attach web"
      - "docker start -it web sh"
    answer: 0
    explanation: |
      `docker exec -it web sh` starts a new process (a shell) inside the running container's
      namespaces — the standard way to poke around. `attach` connects to PID 1 (risky), and `run`
      would create a new container.
    ref: "concepts.md#exec-vs-attach"

  - id: container-lifecycle-031
    difficulty: intermediate
    tags: [exec, attach, difference]
    question: |
      What fundamentally distinguishes `docker exec` from `docker attach`?
    options:
      - "exec starts a new process inside the container; attach connects your terminal to the existing PID 1"
      - "exec works only on stopped containers; attach only on running ones"
      - "exec runs as root; attach runs as the container user"
      - "There is no difference"
    answer: 0
    explanation: |
      `exec` spawns an additional process in the container's namespaces (safe to exit). `attach`
      wires your terminal to the original PID 1's streams, so a stray Ctrl-C can signal and kill
      the main process.
    ref: "concepts.md#exec-vs-attach"

  - id: container-lifecycle-032
    difficulty: intermediate
    tags: [attach, sigint, gotcha]
    question: |
      A junior engineer runs `docker attach web` on a production service and presses Ctrl-C. What
      is the risk?
    options:
      - "Nothing; Ctrl-C is ignored by attach"
      - "It only detaches the terminal safely"
      - "It restarts the container"
      - "Ctrl-C sends SIGINT to PID 1 and can stop the container (the service)"
    answer: 3
    explanation: |
      `attach` connects to PID 1's stdin/stdout/stderr, so Ctrl-C delivers SIGINT to the main
      process and may kill the service. To detach without killing, use the escape sequence
      Ctrl-P Ctrl-Q. For debugging, prefer `exec`.
    ref: "concepts.md#exec-vs-attach"

  - id: container-lifecycle-033
    difficulty: advanced
    tags: [exec, distroless, shell]
    question: |
      `docker exec -it web sh` fails with "no such file or directory" on a distroless-based image.
      Why?
    options:
      - "Distroless/scratch images ship no shell, so there's no `sh` binary to exec"
      - "exec is disabled by default"
      - "The container is paused"
      - "You must use -d instead of -it"
    answer: 0
    explanation: |
      `exec` runs a binary that must exist in the image. Distroless/scratch images contain no shell
      (part of their small-attack-surface value), so `exec sh` fails. Use `docker debug`, an
      ephemeral debug container, or nsenter instead.
    ref: "concepts.md#exec-vs-attach"

  - id: container-lifecycle-034
    difficulty: beginner
    tags: [logs, observability]
    question: |
      `docker logs` captures which output from the container?
    options:
      - "Any file the app writes inside the container"
      - "The kernel logs of the host"
      - "The stdout and stderr of the container's main process"
      - "Only lines matching a log level filter"
    answer: 2
    explanation: |
      The default json-file/local driver captures PID 1's stdout/stderr. This is why apps that log
      to a file *inside* the container produce empty `docker logs` output — a common gotcha.
    ref: "concepts.md#observing-a-running-container-ps-inspect-logs-stats"

  - id: container-lifecycle-035
    difficulty: intermediate
    tags: [logs, empty-logs, gotcha]
    question: |
      A container is clearly working but `docker logs web` shows nothing. What is the most likely
      explanation?
    options:
      - "The logging driver is broken"
      - "Logs are only visible with root"
      - "You must pause the container to see logs"
      - "The app writes its logs to a file inside the container instead of stdout/stderr"
    answer: 3
    explanation: |
      `docker logs` only surfaces what PID 1 sends to stdout/stderr. If the app logs to a file
      inside the container, `docker logs` is empty. The container-native pattern is to log to
      stdout/stderr and let the platform collect it.
    ref: "concepts.md#observing-a-running-container-ps-inspect-logs-stats"

  - id: container-lifecycle-036
    difficulty: intermediate
    tags: [inspect, templates]
    question: |
      Which command extracts just the current state status of a container using a Go template?
    options:
      - "docker ps --state web"
      - "docker inspect -f '{{.State.Status}}' web"
      - "docker logs --state web"
      - "docker stats --status web"
    answer: 1
    explanation: |
      `docker inspect` dumps the full config + live state as JSON; `-f`/`--format` with a Go
      template extracts specific fields such as `{{.State.Status}}`, `{{.State.ExitCode}}`, or
      `{{.State.OOMKilled}}`.
    ref: "concepts.md#observing-a-running-container-ps-inspect-logs-stats"

  - id: container-lifecycle-037
    difficulty: intermediate
    tags: [stats, resources, observability]
    question: |
      Which command gives you a live view of per-container CPU %, memory usage vs limit, and I/O?
    options:
      - "docker inspect"
      - "docker stats"
      - "docker top"
      - "docker events"
    answer: 1
    explanation: |
      `docker stats` streams live resource metrics (CPU %, mem usage/limit, net and block I/O) per
      container — the quick way to see if something is near its memory limit or pegging a CPU. Use
      `--no-stream` for a one-shot snapshot.
    ref: "concepts.md#observing-a-running-container-ps-inspect-logs-stats"

  - id: container-lifecycle-038
    difficulty: beginner
    tags: [ps, observability]
    question: |
      By default, `docker ps` (no flags) shows which containers?
    options:
      - "All containers in any state"
      - "Only running containers"
      - "Only exited containers"
      - "Only paused containers"
    answer: 1
    explanation: |
      Plain `docker ps` lists only running containers. Add `-a` to include all states (created,
      exited, paused), and `-q` for just the IDs.
    ref: "concepts.md#observing-a-running-container-ps-inspect-logs-stats"

  - id: container-lifecycle-039
    difficulty: intermediate
    tags: [pid1, signals, kernel]
    question: |
      Why can a process running as PID 1 silently ignore SIGTERM if it has no explicit handler?
    options:
      - "Docker blocks SIGTERM for PID 1"
      - "SIGTERM is only valid for background processes"
      - "The kernel does not install the default signal actions for PID 1, so an unhandled SIGTERM has no effect"
      - "PID 1 always converts SIGTERM to SIGKILL"
    answer: 2
    explanation: |
      For PID 1 the kernel does not apply the usual default action (terminate) for signals like
      SIGTERM. Without an explicit handler, SIGTERM is effectively ignored, so `docker stop` must
      escalate to SIGKILL after the grace period.
    ref: "concepts.md#pid-1-signal-handling-and-the-zombie-reaping-problem"

  - id: container-lifecycle-040
    difficulty: advanced
    tags: [pid1, zombies, reaping]
    question: |
      What is the "zombie reaping" problem that PID 1 in a container must handle?
    options:
      - "Orphaned child processes get re-parented to PID 1, which must wait() on them or they accumulate as zombies"
      - "Containers that refuse to stop"
      - "Malware processes that hide from ps"
      - "Memory leaks in the writable layer"
    answer: 0
    explanation: |
      When a process's parent dies, its children re-parent to PID 1. Exited children become zombies
      until their parent reaps them with wait(). A normal app as PID 1 isn't written to reap
      arbitrary orphans, so zombies can pile up and exhaust the process table.
    ref: "concepts.md#pid-1-signal-handling-and-the-zombie-reaping-problem"

  - id: container-lifecycle-041
    difficulty: intermediate
    tags: [init, tini, pid1]
    question: |
      What does the `docker run --init` flag do?
    options:
      - "Runs an image build step before starting"
      - "Initializes a named volume for the container"
      - "Forces the container to restart on failure"
      - "Inserts a tiny init (tini) as PID 1 that forwards signals to your app and reaps zombies"
    answer: 3
    explanation: |
      `--init` injects tini as PID 1, running your app as its child. tini forwards signals (so
      SIGTERM reaches your app) and reaps orphaned zombies — solving both PID 1 responsibilities
      without changing your app.
    ref: "concepts.md#pid-1-signal-handling-and-the-zombie-reaping-problem"

  - id: container-lifecycle-042
    difficulty: advanced
    tags: [init, when-to-use, scenario]
    question: |
      Which container most clearly benefits from `--init` (or a bundled tini)?
    options:
      - "A single static binary that handles SIGTERM and never forks"
      - "A container that only runs `sleep infinity`"
      - "A shell script entrypoint that launches and manages several worker subprocesses"
      - "A read-only nginx serving static files"
    answer: 2
    explanation: |
      `--init` matters most when PID 1 spawns children it won't properly reap (zombie risk) and/or
      doesn't forward signals — a shell managing workers is the classic case. A single well-behaved
      binary that forks nothing and handles SIGTERM usually doesn't need it.
    ref: "concepts.md#pid-1-signal-handling-and-the-zombie-reaping-problem"

  - id: container-lifecycle-043
    difficulty: intermediate
    tags: [resource-limits, memory, oom]
    question: |
      What happens when a container exceeds its `--memory` hard limit?
    options:
      - "Docker automatically raises the limit"
      - "The container is paused until memory frees up"
      - "The kernel OOM killer kills a process in the cgroup (usually PID 1), so the container dies with exit 137 and OOMKilled=true"
      - "The excess memory is swapped to disk indefinitely"
    answer: 2
    explanation: |
      `--memory` is a hard cap enforced by cgroups. Exceeding it triggers the kernel OOM killer,
      which typically kills PID 1, so the container exits with 137 and `docker inspect` shows
      `OOMKilled=true`.
    ref: "concepts.md#runtime-resource-limits-memory-and-cpu"

  - id: container-lifecycle-044
    difficulty: advanced
    tags: [resource-limits, cpu, cpu-shares]
    question: |
      What is the difference between `--cpus=1.5` and `--cpu-shares=512`?
    options:
      - "They are two names for the same thing"
      - "`--cpus` is a hard cap on CPU time (throttling); `--cpu-shares` is only a relative weight that matters under contention"
      - "`--cpus` is a relative weight; `--cpu-shares` is a hard cap"
      - "Both are hard caps, differing only in units"
    answer: 1
    explanation: |
      `--cpus=N` uses the CFS quota to hard-cap CPU time at N cores' worth (throttling). `--cpu-shares`
      is only a proportional weight (default 1024) that influences scheduling *under contention*;
      on an idle host a low-share container can use everything. It is not a cap.
    ref: "concepts.md#runtime-resource-limits-memory-and-cpu"

  - id: container-lifecycle-045
    difficulty: advanced
    tags: [resource-limits, jvm, cgroups]
    question: |
      Why is setting `--memory` especially important for a JVM (or Node) workload in a container?
    options:
      - "Because the JVM cannot start without a memory limit"
      - "Because Docker charges by memory limit"
      - "Because it disables garbage collection"
      - "Because container-aware runtimes size their heap/pools from the cgroup limit; without one they see the host's total RAM and may over-allocate and get OOM-killed"
    answer: 3
    explanation: |
      Modern JVMs/Node are container-aware and derive heap and thread-pool sizing from the cgroup
      memory limit. Without `--memory`, they see the host's full RAM, size themselves too large,
      and risk being OOM-killed. Always set explicit limits in production.
    ref: "concepts.md#runtime-resource-limits-memory-and-cpu"

  - id: container-lifecycle-046
    difficulty: intermediate
    tags: [resource-limits, memory-swap]
    question: |
      You run with `--memory=512m --memory-swap=512m`. What is the effect of setting swap equal to
      memory?
    options:
      - "It doubles available memory to 1g"
      - "It disables swap for the container (memory + swap = memory)"
      - "It reserves 512m of swap in addition to RAM"
      - "It has no effect"
    answer: 1
    explanation: |
      `--memory-swap` is the combined memory+swap total. Setting it equal to `--memory` leaves zero
      for swap, effectively disabling swap for the container.
    ref: "concepts.md#runtime-resource-limits-memory-and-cpu"

  - id: container-lifecycle-047
    difficulty: beginner
    tags: [rm, cleanup]
    question: |
      An `exited` container still appears in `docker ps -a` and consumes disk. What removes it?
    options:
      - "docker stop"
      - "docker pause"
      - "docker kill"
      - "docker rm"
    answer: 3
    explanation: |
      An exited container persists (writable layer, config, logs) until explicitly removed with
      `docker rm`. `stop`/`kill` only affect the process; `docker container prune` bulk-removes all
      stopped containers.
    ref: "concepts.md#removing-containers-and-cleanup"

  - id: container-lifecycle-048
    difficulty: intermediate
    tags: [rm, force, running]
    question: |
      What does `docker rm -f web` do to a running container?
    options:
      - "Refuses, because running containers cannot be removed"
      - "Gracefully stops it with SIGTERM first, then removes"
      - "SIGKILLs the process and then removes the container"
      - "Pauses then removes it"
    answer: 2
    explanation: |
      Plain `docker rm` refuses a running container; `-f` forces it by sending SIGKILL and then
      removing it — note there is no graceful SIGTERM phase, so use it deliberately.
    ref: "concepts.md#removing-containers-and-cleanup"

  - id: container-lifecycle-049
    difficulty: intermediate
    tags: [rm, writable-layer, data, gotcha]
    question: |
      A teammate stored important data by writing it inside a running container (not to a volume),
      then ran `docker rm` on it after it exited. What happened to the data?
    options:
      - "It was preserved in the image automatically"
      - "It moved to a dangling volume"
      - "Docker blocked the removal to protect the data"
      - "It is gone — removing a container deletes its writable layer"
    answer: 3
    explanation: |
      Data written to the container's writable layer (not a volume/bind mount) is deleted with the
      container. This is why persistent data belongs in volumes and why containers are treated as
      ephemeral and disposable.
    ref: "concepts.md#removing-containers-and-cleanup"

  - id: container-lifecycle-050
    difficulty: beginner
    tags: [rm, run-flag, ci]
    question: |
      Which flag makes a container delete itself automatically as soon as it exits — ideal for
      one-off/CI tasks?
    options:
      - "--detach"
      - "--restart no"
      - "--rm"
      - "--init"
    answer: 2
    explanation: |
      `docker run --rm` auto-removes the container the instant it exits, avoiding a buildup of dead
      containers from short-lived tasks. It cannot be combined with a restart policy.
    ref: "concepts.md#removing-containers-and-cleanup"

  - id: container-lifecycle-051
    difficulty: intermediate
    tags: [name-conflict, run, gotcha]
    question: |
      You try to `docker run --name web ...` but get a name conflict error, even though no `web`
      container is running. Why?
    options:
      - "Names must be unique across all hosts"
      - "Names can only be used once ever"
      - "The image is still being pulled"
      - "A stopped (exited) container named `web` still exists and holds the name until removed"
    answer: 3
    explanation: |
      Container names are unique among all containers, not just running ones. An exited container
      keeps its name until you `docker rm` it, so re-running with the same `--name` conflicts until
      the old one is removed.
    ref: "concepts.md#removing-containers-and-cleanup"

  - id: container-lifecycle-052
    difficulty: intermediate
    tags: [restart, stop-start]
    question: |
      What is `docker restart` equivalent to?
    options:
      - "A fresh `docker run` from the image"
      - "`docker stop` (with the same grace semantics) followed by `docker start`"
      - "`docker kill` followed by `docker rm`"
      - "`docker pause` then `docker unpause`"
    answer: 1
    explanation: |
      `docker restart [-t N]` stops the container using the same SIGTERM→grace→SIGKILL semantics as
      `docker stop`, then starts it again (same container, same writable layer). It does not create
      a new container.
    ref: "concepts.md#run-vs-create-vs-start"
