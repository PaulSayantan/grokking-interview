topic: "Container Lifecycle & Runtime Operations"
domain: docker
topic_slug: container-lifecycle
schema: 1
pass: clarity-v1

# Where this topic settles the loop images-vs-containers left open (rule K1):
# the 10.3-second stop on an idle container.
resolves:
  anchor: "concepts.md#stopping-sigterm-the-grace-period-then-sigkill"

prompts:
  - id: container-lifecycle-p001
    ref: "concepts.md#the-container-as-a-process-model"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a container is running, run `docker top` on it, then look for the PID it prints
      in the host's own `ps -ef` output.
    hint: "You are looking for the same process in two places, not two processes."
    answer_in: "concepts.md#the-container-as-a-process-model"

  - id: container-lifecycle-p002
    ref: "concepts.md#the-lifecycle-state-machine"
    kind: refute
    tier: A
    prompt: |
      A colleague's cleanup script runs `docker ps --filter status=stopped -q | xargs docker rm`
      and has never removed anything. Name what is wrong with the filter.
    hint: "Check that word against the status strings the daemon actually reports."
    answer_in: "concepts.md#the-lifecycle-state-machine"

  - id: container-lifecycle-p003
    ref: "concepts.md#run-vs-create-vs-start"
    kind: name-the-price
    tier: A
    prompt: |
      Your container has written 200 MB of cache into `/tmp`, and you now realise it needs
      `-p 8080:80`. Name what getting the port costs you.
    hint: "There is no `docker start -p`. Work out which command you are forced into."
    answer_in: "concepts.md#removing-containers-and-cleanup"

  - id: container-lifecycle-p004
    ref: "concepts.md#stopping-sigterm-the-grace-period-then-sigkill"
    kind: predict-failure
    tier: A
    prompt: |
      Your app's SIGTERM handler flushes a buffer that takes 25 seconds. Ops runs `docker stop web`
      with default settings. Predict what reaches disk and what exit code you see.
    hint: "Two clocks are running. Only one of them is yours."
    answer_in: "concepts.md#why-a-container-exits-and-exit-codes"

  - id: container-lifecycle-p005
    ref: "concepts.md#why-a-container-exits-and-exit-codes"
    kind: refute
    tier: A
    prompt: |
      A teammate sees `Exited (125)` and asks you for the application's stack trace so they can
      find the bug. Predict what the logs contain.
    hint: "Ask how far the container got before the code was assigned."
    answer_in: "concepts.md#where-the-rule-breaks-codes-your-process-never-produced"

  - id: container-lifecycle-p006
    ref: "concepts.md#restart-policies"
    kind: name-the-price
    tier: D
    prompt: |
      Automatic restart buys recovery with nobody watching. Name what it costs you when the failure
      is permanent rather than a blip.
    answer_shape: >-
      A credible answer prices two things: how long a crash-looping container keeps a broken
      version in the load balancer's rotation while it looks like it is recovering, and who else
      could have seen the exit — where that observer runs, and what it can do that a policy
      reacting to one exit code cannot.

  - id: container-lifecycle-p007
    ref: "concepts.md#pausing-and-unpausing"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a container is up, run `docker stats --no-stream`, then `docker pause` it and run
      the same command again. Note which column moved.
    hint: "Two columns are in play. Only one of them is about the scheduler."
    answer_in: "concepts.md#pausing-and-unpausing"

  - id: container-lifecycle-p008
    ref: "concepts.md#exec-vs-attach"
    kind: predict-failure
    tier: A
    prompt: |
      Production is down. `docker exec -it web sh` on your distroless image returns
      `executable file not found`. Name what you can still run to see the container's process list.
    hint: "The command that answers this runs on the host, not in the container."
    answer_in: "concepts.md#observing-a-running-container-ps-inspect-logs-stats"

  - id: container-lifecycle-p009
    ref: "concepts.md#pid-1-signal-handling-and-the-zombie-reaping-problem"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you run a container whose PID 1 is a shell script that launches workers, run
      `docker exec <c> ps -ef` and count the `<defunct>` entries.
    hint: "Run it once at startup and once after a worker has been restarted a few times."
    answer_in: "concepts.md#pid-1-signal-handling-and-the-zombie-reaping-problem"

  - id: container-lifecycle-p010
    ref: "concepts.md#runtime-resource-limits-memory-and-cpu"
    kind: draw-the-boundary
    tier: C
    prompt: |
      Everything above assumed the OOM killer takes one process out of the cgroup. Find what
      cgroup v2's `memory.oom.group` changes, and how you would set it for a container.
    search_hint: >-
      The kernel's own Control Group v2 admin guide, memory-controller section, for
      `memory.oom.group`; then Docker's resource-constraints reference for whether any
      `docker run` flag reaches it. The kernel document is authoritative; Docker's is not
      guaranteed to mention the knob at all.
    success_criterion: >-
      You can state what the kernel does to every task in the cgroup when the value is 1, name
      the default value, and say whether Docker exposes a flag for it or you have to set it on
      the cgroup yourself.
    answer_in: "external"

cliffhanger:
  hook: |
    A hundred containers, one image, and `prune` gives back forty megabytes.

    ```
    $ docker container prune -f
    Total reclaimed space: 41.6MB

    $ docker system df
    TYPE      TOTAL   SIZE
    Images    1       1.19GB
    ```

    That number is correct. `rm` reclaims writable layers, and writable layers are where almost
    nothing was written. The gigabyte underneath belongs to the image, shared by every container
    that ever started from it. So you go to shrink the image instead. The Dockerfile downloads a
    400 MB toolchain, builds with it, and deletes it on the next line. The build succeeds. The
    image is still 1.19 GB. The last topic said that a delete writes a whiteout, and that a
    container's writable layer goes away with the container. Neither of those says where 400 MB
    of deleted toolchain is still sitting.
  teaser_questions:
    - "Why does removing a hundred containers free megabytes when the image is a gigabyte?"
    - "A file deleted on the next line of a Dockerfile: where did its bytes go?"
    - "Which layer in a stack is a later instruction allowed to change?"
  payoff:
    anchor: "concepts.md#why-each-layer-adds-size-deleting-in-a-later-layer"
    claim: >-
      Read in the un-rewritten destination: layers are additive diffs stacked by a union
      filesystem (overlay2); a file deleted in a later layer is represented by a whiteout marker,
      so it appears gone in the merged view while the original bytes still exist in the earlier
      layer and still ship in the image. "You cannot shrink an existing layer from a later one."
      The section then names `RUN rm -rf /some/big/thing` in a separate later `RUN`, and
      `RUN apt-get purge ...` after an earlier install, as things that do not reduce image size.
