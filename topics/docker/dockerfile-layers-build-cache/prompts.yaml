topic: "Dockerfile, Layers & Build Cache"
domain: docker
topic_slug: dockerfile-layers-build-cache
schema: 1
pass: clarity-v1

# Settles topic 2's open loop: the whiteout that still ships 400 MB.
resolves:
  anchor: "concepts.md#why-each-layer-adds-size-deleting-in-a-later-layer"

prompts:
  - id: dockerfile-layers-build-cache-p001
    ref: "concepts.md#what-a-dockerfile-is-and-the-image-layer-model"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you push a rebuilt image, watch the per-layer lines and count how many say the
      layer already exists on the registry.
    hint: "Compare that count with how many instructions your Dockerfile actually re-ran."
    answer_in: "concepts.md#where-the-layers-go-pushing-and-pulling-only-what-is-missing"

  - id: dockerfile-layers-build-cache-p002
    ref: "concepts.md#which-instructions-create-layers-vs-metadata"
    kind: refute
    tier: A
    prompt: |
      A reviewer writes: "Merge these four `ENV` lines into one — we are wasting four layers."
      Say what is wrong with the claim, and what merging them would actually change.
    hint: "Ask which of the two lists in the image config an `ENV` line is written into."
    answer_in: "concepts.md#what-docker-history-is-really-listing"

  - id: dockerfile-layers-build-cache-p003
    ref: "concepts.md#how-the-build-cache-works-and-cache-invalidation-rules"
    kind: predict-failure
    tier: A
    prompt: |
      Line 2 of your Dockerfile is `ENV BUILD_ID=1234`, which CI rewrites on every build. `RUN
      npm ci` is line 6. Predict how often the install runs.
    hint: "Metadata instructions are keyed on something too."
    answer_in: "concepts.md#what-each-instruction-hashes"

  - id: dockerfile-layers-build-cache-p004
    ref: "concepts.md#ordering-instructions-least-to-most-frequently-changed"
    kind: name-the-price
    tier: A
    prompt: |
      Splitting the `COPY` buys you a cached `npm ci`. Name the property of a repository that
      makes that saving disappear, and what you would reach for instead.
    hint: "Look at what has to be true about how often each copied file changes."
    answer_in: "concepts.md#where-it-breaks-when-the-dependency-manifest-changes-as-often-as-the-source"

  - id: dockerfile-layers-build-cache-p005
    ref: "concepts.md#copy-vs-add"
    kind: refute
    tier: A
    prompt: |
      A colleague writes `ADD https://example.com/tools.tar.gz /opt/` and says it saves a `RUN`
      because `ADD` unpacks archives. Name both things they will get wrong.
    hint: "One is about extraction, the other about what is left sitting in the layer."
    answer_in: "concepts.md#what-it-costs-the-layer-you-cannot-clean-up"

  - id: dockerfile-layers-build-cache-p006
    ref: "concepts.md#combining-run-commands-to-reduce-layers"
    kind: name-the-price
    tier: A
    prompt: |
      Collapsing six `RUN` lines into one keeps the temp files out of the image. Name what you
      give up, and the edit that makes you regret it.
    hint: "Ask what the cache key of the combined instruction now covers."
    answer_in: "concepts.md#what-it-costs-cache-granularity"

  - id: dockerfile-layers-build-cache-p007
    ref: "concepts.md#why-each-layer-adds-size-deleting-in-a-later-layer"
    kind: predict-failure
    tier: A
    prompt: |
      A build adds a 500 MB dataset at line 3 and deletes it at line 4. You fix the size with
      `--squash`. Predict what the next code-only push costs.
    hint: "Count the blobs the registry can skip afterwards."
    answer_in: "concepts.md#what-actually-fixes-it"

  - id: dockerfile-layers-build-cache-p008
    ref: "concepts.md#run-cache-with-package-managers-buildkit-cache-mounts"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a CI job runs `pip install` or `npm ci`, check the log for whether it
      downloaded the packages or reused them, and whether the runner was a fresh machine.
    hint: "A fresh runner has an empty mount, which is the case the build must survive."
    answer_in: "concepts.md#what-sharinglocked-prevents"

  - id: dockerfile-layers-build-cache-p009
    ref: "concepts.md#arg-vs-env"
    kind: refute
    tier: A
    prompt: |
      A colleague declares both `ARG PORT` and `ENV PORT=8080` "so the build arg reaches
      runtime", then passes `--build-arg PORT=9000`. Say what the build sees, and why.
    hint: "One of the two always wins in a `RUN` environment."
    answer_in: "concepts.md#arg-vs-env"

  - id: dockerfile-layers-build-cache-p010
    ref: "concepts.md#what-alpines-musl-libc-costs"
    kind: draw-the-boundary
    tier: C
    prompt: |
      This section dates the UDP-truncation fix to musl 1.2.4. Find which musl your own base
      image ships, and therefore which of the two differences still applies to you.
    hint: "The Alpine release notes for your tag are where the musl version is pinned."
    answer_in: external
    search_hint: >-
      The Alpine release notes for your tag (alpinelinux.org/releases), which pin the musl
      version, plus musl's own release notes and git log (musl.libc.org) if your tag predates
      1.2.4. Blog posts about "Alpine DNS" rarely say which musl they were written against.
    success_criterion: >-
      You can name the musl version in your base image and say whether it is before or after
      1.2.4 — and if before, name the Alpine release you would move to.

  - id: dockerfile-layers-build-cache-p011
    ref: "concepts.md#the-version-specific-truth-tags-move-digests-do-not"
    kind: name-the-price
    tier: D
    prompt: |
      Forty services share five base images. Would you pin every Dockerfile to a digest, and
      what would have to be in place before you did?
    hint: "Price the patch that arrives on a Tuesday, not the happy path."
    answer_shape: >-
      A credible answer prices three things: how long a security patch takes to reach
      production once the base image publishes it; who or what raises the pull request that
      moves each digest, and what happens when that automation is down; and what a
      non-reproducible build costs you when you are bisecting an incident.

  - id: dockerfile-layers-build-cache-p012
    ref: "concepts.md#inspecting-layers-and-diagnosing-sizecache"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a build feels slow, run it with `--progress=plain` and note the first step
      without `CACHED`, then look at what feeds that one step.
    hint: "Everything below the first miss was going to re-run regardless."
    answer_in: "concepts.md#reading-the-cached-column"

cliffhanger:
  hook: |
    Your image is now correct, fast and small, and its last line is `CMD ["node",
    "server.js"]`. Change that to `CMD npm start` and nothing about the build changes. The
    layers are identical. The size is identical. What changes is which process becomes PID 1
    inside the container: `/bin/sh`, with your app running as its child. Now run `docker
    stop`. The shell gets SIGTERM and does not pass it on. Your Node process never hears it,
    keeps serving, and ten seconds later Docker sends SIGKILL and the container dies mid
    request. Every deploy drops connections. Every log line says the build was fine. The form
    of that one instruction decided it.
  teaser_questions:
    - "Which process is PID 1 in your container, and did you choose it?"
    - "Who is supposed to forward SIGTERM to your application, and does it?"
    - "Why would a correct image still take ten seconds to stop?"
  payoff:
    anchor: "concepts.md#the-pid-1--sigterm-problem-with-shell-form"
    claim: >-
      Read in the un-rewritten destination: with shell form the container's PID 1 is `/bin/sh
      -c "..."` and the application runs as a child; `/bin/sh` does not forward signals to its
      children by default; after the grace period (default 10s on Linux) Docker sends
      `SIGKILL`, giving dropped requests and a 10-second delay on every stop.
