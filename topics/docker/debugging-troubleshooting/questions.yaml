topic: "Debugging & Troubleshooting Containers"
domain: docker
topic_slug: debugging-troubleshooting
version: 1
questions:
- id: debugging-troubleshooting-001
  difficulty: beginner
  tags: [methodology, ps, state]
  question: |
    A container you started a minute ago is missing from `docker ps`. What is the correct
    next step to find out what happened to it?
  options:
  - "Run `docker logs` — it recreates exited containers"
  - "Run `docker pull` again because the image was deleted"
  - "Run `docker ps -a` to list all containers including exited ones and read its STATUS/exit code"
  - "Restart the Docker daemon to make it reappear"
  answer: 2
  explanation: |
    `docker ps` shows only running containers. A container that "disappeared" almost always
    exited; `docker ps -a` lists all containers with their STATUS column (e.g. `Exited (137)`),
    which classifies the failure before you read any logs.
  ref: "concepts.md#a-debugging-methodology-for-containers"

- id: debugging-troubleshooting-002
  difficulty: beginner
  tags: [logs, stdout-stderr]
  question: |
    By convention, where should a containerised application write its logs so that
    `docker logs` can display them?
  options:
  - "To stdout and stderr"
  - "To a file under /var/log inside the container"
  - "To a syslog socket only"
  - "To a database configured at startup"
  answer: 0
  explanation: |
    Containers are expected to log to stdout/stderr, which the runtime captures via the logging
    driver. Writing to a file inside the container buries the logs in an ephemeral layer where
    `docker logs` cannot see them.
  ref: "concepts.md#reading-container-logs-docker-logs"

- id: debugging-troubleshooting-003
  difficulty: beginner
  tags: [logs, flags]
  question: |
    Which command streams new log output from a container as it is produced, like `tail -f`?
  options:
  - "`docker logs --tail my-app`"
  - "`docker logs --since my-app`"
  - "`docker logs --stream my-app`"
  - "`docker logs -f my-app`"
  answer: 3
  explanation: |
    `-f`/`--follow` continuously streams new stdout/stderr output. `--tail` limits to the last N
    lines, `--since` filters by time, and `--stream` is not a flag.
  ref: "concepts.md#reading-container-logs-docker-logs"

- id: debugging-troubleshooting-004
  difficulty: intermediate
  tags: [logs, drivers]
  question: |
    You run `docker logs my-app` and get an error that the logging driver does not support
    reading. What is the most likely cause?
  options:
  - "The container is still running"
  - "The container was started with a remote logging driver such as gelf, syslog, or awslogs"
  - "The log file exceeded max-size"
  - "You forgot the -f flag"
  answer: 1
  explanation: |
    `docker logs` only works with drivers that keep a local copy — `json-file` (default) and
    `local`. Remote drivers like `syslog`, `gelf`, `fluentd`, or `awslogs` ship logs elsewhere,
    so the daemon has nothing local to read and returns that error.
  ref: "concepts.md#reading-container-logs-docker-logs"

- id: debugging-troubleshooting-005
  difficulty: intermediate
  tags: [logs, buffering, python]
  question: |
    A Python app clearly runs but `docker logs` shows nothing until it crashes, then a burst
    appears. What is the usual fix?
  options:
  - "Set PYTHONUNBUFFERED=1 (or run python -u) so stdout isn't block-buffered"
  - "Add `--tail all` to docker logs"
  - "Switch the logging driver to syslog"
  - "Run the container with -it always"
  answer: 0
  explanation: |
    Many runtimes block-buffer stdout when it isn't a TTY, so output appears only in bursts or at
    exit. Setting `PYTHONUNBUFFERED=1` (or `python -u`) forces unbuffered output so logs stream in
    real time.
  ref: "concepts.md#reading-container-logs-docker-logs"

- id: debugging-troubleshooting-006
  difficulty: beginner
  tags: [exec, shell]
  question: |
    Which command gives you an interactive shell inside a running container named `my-app`?
  options:
  - "`docker run my-app sh`"
  - "`docker attach --shell my-app`"
  - "`docker exec -it my-app sh`"
  - "`docker logs -it my-app sh`"
  answer: 2
  explanation: |
    `docker exec` runs a new process inside a running container; `-i` keeps stdin open and `-t`
    allocates a TTY, giving an interactive shell. `docker run` would start a brand-new container,
    not enter the existing one.
  ref: "concepts.md#getting-a-shell-inside-a-running-container-docker-exec"

- id: debugging-troubleshooting-007
  difficulty: intermediate
  tags: [exec, attach, difference]
  question: |
    What is the key difference between `docker exec` and `docker attach` for debugging?
  options:
  - "attach is faster because it reuses the existing shell"
  - "exec starts a NEW process, while attach connects to the existing PID 1's stdio (and exiting can stop the container)"
  - "exec only works on stopped containers"
  - "There is no difference; they are aliases"
  answer: 1
  explanation: |
    `exec` spawns a fresh process (e.g. a new shell), which is safe for debugging. `attach`
    connects to the running PID 1's stdin/stdout/stderr, so typing `exit` or Ctrl-C can terminate
    PID 1 and stop the whole container.
  ref: "concepts.md#getting-a-shell-inside-a-running-container-docker-exec"

- id: debugging-troubleshooting-008
  difficulty: intermediate
  tags: [exec, entrypoint, crash-loop]
  question: |
    An image's entrypoint crashes immediately, so `docker exec` never gets a chance to run.
    How do you get a shell to investigate the image's filesystem and run the failing command
    by hand?
  options:
  - "`docker exec -it <image> sh` using the image name"
  - "`docker attach <image>`"
  - "`docker logs --shell <image>`"
  - "`docker run --rm -it --entrypoint sh <image>`"
  answer: 3
  explanation: |
    Overriding the entrypoint with a shell at run time starts the container's shell instead of the
    broken command, giving you the exact filesystem and env to reproduce the failure. `docker exec`
    needs a running container, which you don't have.
  ref: "concepts.md#getting-a-shell-inside-a-running-container-docker-exec"

- id: debugging-troubleshooting-009
  difficulty: intermediate
  tags: [exec, user, root]
  question: |
    A container runs as a non-root user and you need root inside it to install a debug tool.
    Which flag lets `docker exec` enter as root?
  options:
  - "`--privileged`"
  - "`-u root` (or `--user 0`)"
  - "`--root`"
  - "`--sudo`"
  answer: 1
  explanation: |
    `docker exec -u root` (equivalently `--user 0`) runs the exec'd process as root even when the
    container's default user is unprivileged. `--privileged` is a run-time capability grant, not an
    exec user override.
  ref: "concepts.md#getting-a-shell-inside-a-running-container-docker-exec"

- id: debugging-troubleshooting-010
  difficulty: beginner
  tags: [inspect, config]
  question: |
    Which command shows the full resolved configuration and state (command, env, mounts,
    networks, exit code) of a container as JSON?
  options:
  - "`docker inspect`"
  - "`docker stats`"
  - "`docker diff`"
  - "`docker top`"
  answer: 0
  explanation: |
    `docker inspect` dumps the complete metadata for a container or image — the source of truth
    for the resolved Entrypoint/Cmd/Env, mounts, network settings, restart policy, and state
    including exit code.
  ref: "concepts.md#docker-inspect-config-state-mounts-networks-exit-code"

- id: debugging-troubleshooting-011
  difficulty: intermediate
  tags: [inspect, format, exit-code]
  question: |
    Which `docker inspect` invocation prints just the exit code of a container?
  options:
  - "`docker inspect --exit-code my-app`"
  - "`docker inspect --format '{{.Config.ExitCode}}' my-app`"
  - "`docker inspect --code my-app`"
  - "`docker inspect --format '{{.State.ExitCode}}' my-app`"
  answer: 3
  explanation: |
    The exit code lives under `.State.ExitCode`, extracted with a Go template via `--format`.
    There is no `--exit-code` flag, and exit code is runtime state (`.State`), not image config
    (`.Config`).
  ref: "concepts.md#docker-inspect-config-state-mounts-networks-exit-code"

- id: debugging-troubleshooting-012
  difficulty: advanced
  tags: [inspect, oom, state]
  question: |
    A container exited with code 137. Which `docker inspect` field distinguishes a kernel
    OOM-kill from a SIGKILL escalated after a stop timeout?
  options:
  - "`.State.ExitCode`"
  - "`.State.OOMKilled`"
  - "`.HostConfig.Memory`"
  - "`.Config.Healthcheck`"
  answer: 1
  explanation: |
    Both cases yield exit 137 (SIGKILL). `.State.OOMKilled` is `true` only when the kernel
    OOM-killer terminated the container for exceeding its memory limit; `false` means it was
    SIGKILLed for another reason, such as ignoring SIGTERM past the stop grace period.
  ref: "concepts.md#docker-inspect-config-state-mounts-networks-exit-code"

- id: debugging-troubleshooting-013
  difficulty: intermediate
  tags: [inspect, image, entrypoint]
  question: |
    You pulled an image with no accompanying Dockerfile and want to see its baked-in
    ENTRYPOINT, CMD, and default USER. What works?
  options:
  - "Nothing — that info is only in the Dockerfile"
  - "`docker logs <image>`"
  - "`docker inspect --format '{{json .Config}}' <image>` — inspect works on images too"
  - "`docker diff <image>`"
  answer: 2
  explanation: |
    `docker inspect` accepts images as well as containers. The image's `.Config` object exposes
    the baked-in `Entrypoint`, `Cmd`, `Env`, `User`, `WorkingDir`, and exposed ports without
    needing the original Dockerfile.
  ref: "concepts.md#docker-inspect-config-state-mounts-networks-exit-code"

- id: debugging-troubleshooting-014
  difficulty: beginner
  tags: [stats, resources]
  question: |
    Which command gives a live, streaming view of per-container CPU, memory, network, and
    block I/O usage?
  options:
  - "`docker inspect`"
  - "`docker events`"
  - "`docker diff`"
  - "`docker stats`"
  answer: 3
  explanation: |
    `docker stats` streams live resource usage per container, reading from the container's cgroup
    accounting. It's the first triage tool for "why is it slow / why did it get OOM-killed?"
  ref: "concepts.md#live-resource-usage-with-docker-stats"

- id: debugging-troubleshooting-015
  difficulty: intermediate
  tags: [stats, scripting]
  question: |
    You want a single snapshot of resource usage in a script, not a continuous stream. Which
    flag do you add to `docker stats`?
  options:
  - "`--once`"
  - "`--no-stream`"
  - "`--snapshot`"
  - "`--tail 1`"
  answer: 1
  explanation: |
    `docker stats --no-stream` prints one snapshot and exits, making it scriptable. Without it,
    `docker stats` runs continuously until interrupted.
  ref: "concepts.md#live-resource-usage-with-docker-stats"

- id: debugging-troubleshooting-016
  difficulty: intermediate
  tags: [stats, cpu, multicore]
  question: |
    In `docker stats`, a container shows CPU % of 320% on an 8-core host. What does this mean?
  options:
  - "The container is using roughly 3.2 CPU cores' worth of time (100% = one full core)"
  - "The reading is corrupt; CPU % can never exceed 100%"
  - "The container is throttled to 3 cores"
  - "Memory pressure is inflating the CPU number"
  answer: 0
  explanation: |
    On multi-core hosts `docker stats` CPU % can exceed 100%: 100% equals one fully-used core, so
    320% means about 3.2 cores of CPU time. It's normal for multi-threaded workloads.
  ref: "concepts.md#live-resource-usage-with-docker-stats"

- id: debugging-troubleshooting-017
  difficulty: beginner
  tags: [wont-start, pid1, foreground]
  question: |
    A Dockerfile ends with `CMD ["service", "nginx", "start"]` and the container exits
    immediately. Why?
  options:
  - "nginx must be installed as root"
  - "CMD cannot take three arguments"
  - "`service nginx start` backgrounds nginx and returns, so PID 1 finishes and the container stops"
  - "The image is missing an init system"
  answer: 2
  explanation: |
    A container lives only as long as its PID 1. `service nginx start` daemonises nginx into the
    background and returns, so PID 1 exits and the container stops. The fix is to run nginx in the
    foreground: `nginx -g 'daemon off;'`.
  ref: "concepts.md#why-a-container-wont-start-or-exits-immediately"

- id: debugging-troubleshooting-018
  difficulty: beginner
  tags: [wont-start, ubuntu, exit-0]
  question: |
    `docker run ubuntu` exits immediately with code 0 and no error. Why?
  options:
  - "The image failed to download"
  - "Ubuntu's default command is a shell that, with no TTY and nothing to do, returns immediately"
  - "You must pass -d or Docker refuses to run it"
  - "Exit 0 always indicates a crash"
  answer: 1
  explanation: |
    The container ran its default command (a shell), which had no interactive TTY and nothing to
    do, so it returned with exit 0 and the container stopped. Giving it a foreground task (or
    `-it`) keeps it alive.
  ref: "concepts.md#why-a-container-wont-start-or-exits-immediately"

- id: debugging-troubleshooting-019
  difficulty: intermediate
  tags: [wont-start, exit-127, path]
  question: |
    A container fails with `exec: "myapp": executable file not found in $PATH` and exit code
    127. What does this indicate?
  options:
  - "The binary exists but isn't executable"
  - "The container ran out of memory"
  - "The image is the wrong architecture"
  - "The command named in ENTRYPOINT/CMD isn't installed or isn't on PATH"
  answer: 3
  explanation: |
    Exit 127 with "executable file not found" means the runtime couldn't locate the command. The
    binary isn't installed, the WORKDIR/PATH is wrong, or the name is misspelled. Confirm by
    shelling in and running `which myapp`.
  ref: "concepts.md#why-a-container-wont-start-or-exits-immediately"

- id: debugging-troubleshooting-020
  difficulty: intermediate
  tags: [wont-start, exit-126, permission]
  question: |
    A container using `ENTRYPOINT ["./entrypoint.sh"]` fails with `permission denied` and exit
    code 126. What is the fix?
  options:
  - "Make the script executable, e.g. `RUN chmod +x entrypoint.sh` in the Dockerfile"
  - "Add more memory with --memory"
  - "Change CMD to ENTRYPOINT"
  - "Rebuild for a different architecture"
  answer: 0
  explanation: |
    Exit 126 means the file was found but could not be executed — typically the script lacks the
    executable bit. Adding `RUN chmod +x entrypoint.sh` (or `chmod` before copying) resolves it.
  ref: "concepts.md#why-a-container-wont-start-or-exits-immediately"

- id: debugging-troubleshooting-021
  difficulty: advanced
  tags: [wont-start, exec-format-error, arch]
  question: |
    On an amd64 server, running an image built for arm64 fails with `exec format error`. What
    is happening and how do you fix it?
  options:
  - "The image is corrupt; re-pull it"
  - "CPU architecture mismatch — build/pull the image for the host's architecture (e.g. with buildx multi-arch or --platform)"
  - "The Docker daemon is out of date"
  - "The entrypoint has too many arguments"
  answer: 1
  explanation: |
    `exec format error` on startup usually means the binary's architecture doesn't match the host
    kernel (arm64 image on amd64, or vice versa). Build a multi-arch image with buildx or pull/run
    with the correct `--platform`. (A missing `#!` shebang in a script can also cause it.)
  ref: "concepts.md#why-a-container-wont-start-or-exits-immediately"

- id: debugging-troubleshooting-022
  difficulty: intermediate
  tags: [wont-start, restart-policy, crash-loop]
  question: |
    A container with `restart: always` crashes on startup. `docker ps` shows it as
    `Restarting` and logs scroll the same error forever. How do you investigate calmly?
  options:
  - "Delete the image and rebuild from scratch"
  - "Increase the CPU limit"
  - "Run `docker stats` until it stabilises"
  - "Temporarily remove the restart policy (or run with `--entrypoint sh`) to break the loop, then read the error"
  answer: 3
  explanation: |
    An `always` restart policy re-launches a crashing container endlessly (a crash-loop). Breaking
    the loop — dropping the policy or overriding the entrypoint with a shell — lets you inspect the
    filesystem and run the failing command by hand.
  ref: "concepts.md#why-a-container-wont-start-or-exits-immediately"

- id: debugging-troubleshooting-023
  difficulty: beginner
  tags: [exit-codes, sigkill, 137]
  question: |
    What does a container exit code of 137 signify at the signal level?
  options:
  - "128 + 9, i.e. the process received SIGKILL"
  - "A clean exit"
  - "128 + 15, i.e. the process received SIGTERM"
  - "Command not found"
  answer: 0
  explanation: |
    Linux encodes signal deaths as 128 + signal number. 137 = 128 + 9 = SIGKILL, produced by an
    OOM-kill or a forced kill (e.g. SIGKILL escalation after a stop timeout).
  ref: "concepts.md#exit-codes-oomkilled-137-sigterm-143-and-friends"

- id: debugging-troubleshooting-024
  difficulty: intermediate
  tags: [exit-codes, sigterm, 143]
  question: |
    A well-behaved app exits with code 143 when you run `docker stop`. What does that tell you?
  options:
  - "It ran out of memory"
  - "It crashed with a segfault"
  - "It received SIGTERM (128 + 15) and shut down gracefully on it"
  - "The command was not executable"
  answer: 2
  explanation: |
    143 = 128 + 15 = SIGTERM. `docker stop` sends SIGTERM first; an app that handles it and exits
    cleanly reports 143. This is the signature of a graceful shutdown, not a failure.
  ref: "concepts.md#exit-codes-oomkilled-137-sigterm-143-and-friends"

- id: debugging-troubleshooting-025
  difficulty: advanced
  tags: [exit-codes, oom, memory]
  question: |
    A container repeatedly dies with exit 137 and `docker inspect` shows `OOMKilled: true`.
    What is the correct interpretation and remedy?
  options:
  - "It ignored SIGTERM; add a signal handler"
  - "It exceeded its --memory cgroup limit and the kernel OOM-killer terminated it; raise the limit or fix the leak / tune the heap"
  - "The image is the wrong architecture"
  - "The host disk is full"
  answer: 1
  explanation: |
    `OOMKilled: true` means the container hit its cgroup memory limit and the kernel killed it with
    SIGKILL (137). Remedies: raise `--memory`, fix the memory leak, or bound the runtime's heap
    (e.g. JVM `-XX:MaxRAMPercentage`).
  ref: "concepts.md#exit-codes-oomkilled-137-sigterm-143-and-friends"

- id: debugging-troubleshooting-026
  difficulty: intermediate
  tags: [exit-codes, 125, daemon]
  question: |
    `docker run --bad-flag myimage` returns exit code 125 and the container never appears in
    `docker ps -a`. What does 125 indicate?
  options:
  - "The application inside the container failed"
  - "SIGKILL was received"
  - "The command inside was not found"
  - "The Docker daemon/CLI itself failed to run the container (bad flag or run-time error), so it never started"
  answer: 3
  explanation: |
    Exit 125 comes from Docker itself, not the container process — the daemon couldn't create/start
    the container (bad flag, invalid option, etc.), so no container was created. 126/127 are the
    container's own not-executable / not-found errors.
  ref: "concepts.md#exit-codes-oomkilled-137-sigterm-143-and-friends"

- id: debugging-troubleshooting-027
  difficulty: advanced
  tags: [exit-codes, 137, disambiguation]
  question: |
    A container exits 137 but `docker inspect` shows `OOMKilled: false`. What most likely
    happened?
  options:
  - "The kernel OOM-killer fired"
  - "The app exited cleanly"
  - "It was SIGKILLed — e.g. `docker stop` sent SIGTERM, the app ignored it, and Docker escalated to SIGKILL after the grace period"
  - "The image architecture is wrong"
  answer: 2
  explanation: |
    137 is SIGKILL, but `OOMKilled: false` rules out a memory-limit kill. The common cause is a
    stop-timeout escalation: the app didn't honour SIGTERM within the grace period (default 10s),
    so Docker sent SIGKILL. Fix by implementing graceful SIGTERM handling.
  ref: "concepts.md#exit-codes-oomkilled-137-sigterm-143-and-friends"

- id: debugging-troubleshooting-028
  difficulty: intermediate
  tags: [distroless, shell, exec]
  question: |
    `docker exec -it my-app sh` on a distroless image fails with `exec: "sh": executable file
    not found`. Why?
  options:
  - "The container is paused"
  - "Distroless images ship no shell (and few tools) by design, to shrink size and attack surface"
  - "You need to run it as root"
  - "sh must be spelled /bin/bash on distroless"
  answer: 1
  explanation: |
    Distroless (and scratch) images deliberately omit a shell and general tooling. There is no
    `sh`/`bash` to exec into, which is exactly why alternative debugging approaches exist for these
    images.
  ref: "concepts.md#debugging-distroless--shell-less-images"

- id: debugging-troubleshooting-029
  difficulty: intermediate
  tags: [distroless, docker-debug]
  question: |
    Which purpose-built command attaches a debug shell with a built-in toolbox into any
    container or image, even one that contains no shell, without modifying the image?
  options:
  - "`docker debug`"
  - "`docker exec --debug`"
  - "`docker attach --tools`"
  - "`docker run --debug`"
  answer: 0
  explanation: |
    `docker debug` (a Docker Desktop feature) provides a debug shell with tools like vim, curl, and
    htop into any container or image — including shell-less/distroless ones — without altering the
    image. It's the modern answer to debugging slim images.
  ref: "concepts.md#debugging-distroless--shell-less-images"

- id: debugging-troubleshooting-030
  difficulty: advanced
  tags: [distroless, namespaces, netshoot]
  question: |
    Without Docker Desktop, how can you inspect the process tree and network of a running
    distroless container using a full toolbox image?
  options:
  - "You cannot debug distroless containers at all"
  - "Copy the distroless image's shell into /tmp"
  - "Use `docker logs --exec`"
  - "Run a toolbox image (e.g. nicolaka/netshoot) joined to the target's namespaces: `docker run --pid container:my-app --network container:my-app -it netshoot sh`"
  answer: 3
  explanation: |
    Running a fat toolbox image joined to the target's PID and network namespaces
    (`--pid container:<t> --network container:<t>`) lets its `ps`, `curl`, `tcpdump`, and `dig`
    operate against the target. The target's filesystem is reachable via `/proc/1/root`. In K8s
    the analogue is `kubectl debug --target`.
  ref: "concepts.md#debugging-distroless--shell-less-images"

- id: debugging-troubleshooting-031
  difficulty: advanced
  tags: [distroless, multi-stage, debug-target]
  question: |
    What Dockerfile pattern keeps production images lean while still giving you a shell on
    demand?
  options:
  - "Install busybox in the production stage just in case"
  - "Add a separate `FROM production AS debug` stage that installs busybox/curl; ship production by default and build --target debug when needed"
  - "Never use distroless images"
  - "Always run containers with --privileged"
  answer: 1
  explanation: |
    A dedicated `debug` build target layered on top of the production stage adds tooling only when
    you explicitly `docker build --target debug`. Production stays distroless (small, low attack
    surface) while a debuggable variant is one build away.
  ref: "concepts.md#debugging-distroless--shell-less-images"

- id: debugging-troubleshooting-032
  difficulty: beginner
  tags: [events, daemon]
  question: |
    Which command streams real-time daemon events such as container create/start/die/oom and
    health-status changes?
  options:
  - "`docker stats`"
  - "`docker inspect --watch`"
  - "`docker events`"
  - "`docker logs --daemon`"
  answer: 2
  explanation: |
    `docker events` emits a live stream of daemon-wide events — container lifecycle transitions,
    `oom`, image pulls, network connects, volume mounts, and `health_status:` changes — ideal for
    answering "what just happened?"
  ref: "concepts.md#watching-the-daemon-with-docker-events"

- id: debugging-troubleshooting-033
  difficulty: intermediate
  tags: [events, intermittent, filter]
  question: |
    A container restarts on its own sporadically and you keep missing it. Which approach best
    catches the cause?
  options:
  - "Leave `docker events --filter event=die` (and/or event=oom) running to capture the event when it fires"
  - "Run `docker stats` and stare at it"
  - "Run `docker inspect` in a loop every second"
  - "Increase the log level of the app"
  answer: 0
  explanation: |
    `docker events` is daemon-wide and time-filterable, so leaving a filtered stream running
    captures intermittent `die`/`oom` events you'd otherwise miss — including an explicit `oom`
    event when the kernel OOM-kills a container.
  ref: "concepts.md#watching-the-daemon-with-docker-events"

- id: debugging-troubleshooting-034
  difficulty: intermediate
  tags: [events, oom, health]
  question: |
    Besides lifecycle transitions, which of the following does `docker events` surface that
    helps distinguish an OOM kill from an ordinary crash?
  options:
  - "The container's full stdout"
  - "An explicit `oom` event when the kernel OOM-kills a container"
  - "The image's Dockerfile"
  - "Live CPU percentage"
  answer: 1
  explanation: |
    `docker events` emits a distinct `oom` event when the OOM-killer fires, separate from the
    subsequent `die`. That's a clean signal that the failure was a memory-limit kill rather than an
    application crash.
  ref: "concepts.md#watching-the-daemon-with-docker-events"

- id: debugging-troubleshooting-035
  difficulty: beginner
  tags: [diff, filesystem]
  question: |
    What does `docker diff <container>` report?
  options:
  - "The difference between two images"
  - "The diff between the running and desired config"
  - "Network changes since startup"
  - "Files Added, Changed, or Deleted in the container's writable layer relative to its image"
  answer: 3
  explanation: |
    `docker diff` lists filesystem changes in the container's writable (copy-on-write) layer versus
    the image: `A` added, `C` changed, `D` deleted. It answers "what has this container written to
    its filesystem?"
  ref: "concepts.md#inspecting-filesystem-changes-with-docker-diff"

- id: debugging-troubleshooting-036
  difficulty: advanced
  tags: [diff, volumes, mounts]
  question: |
    You expect a path written by the app to show up in `docker diff`, but it doesn't appear.
    What is the most likely reason?
  options:
  - "That path is a volume or bind mount, which lives outside the writable layer and is invisible to docker diff"
  - "docker diff only shows deletions"
  - "The container hasn't been committed yet"
  - "docker diff ignores files under /app"
  answer: 0
  explanation: |
    Volume and bind-mount paths are separate mounts outside the container's writable layer, so
    writes there don't show up in `docker diff`. A missing expected path usually means it's mounted
    (which is the correct place for mutable data).
  ref: "concepts.md#inspecting-filesystem-changes-with-docker-diff"

- id: debugging-troubleshooting-037
  difficulty: intermediate
  tags: [diff, symbols]
  question: |
    In `docker diff` output, what do the prefixes `A`, `C`, and `D` mean?
  options:
  - "Allowed, Cached, Denied"
  - "Archive, Compress, Decompress"
  - "Added, Changed, Deleted"
  - "Active, Closed, Detached"
  answer: 2
  explanation: |
    `A` = added, `C` = changed, `D` = deleted, each relative to the image's layers. It's a quick
    map of everything the container has mutated in its writable layer.
  ref: "concepts.md#inspecting-filesystem-changes-with-docker-diff"

- id: debugging-troubleshooting-038
  difficulty: beginner
  tags: [common-errors, port-in-use]
  question: |
    `docker run -p 8080:80 nginx` fails with `bind: address already in use` / `port is already
    allocated`. What does this mean?
  options:
  - "Port 80 inside the container is taken"
  - "nginx isn't installed"
  - "The image is the wrong architecture"
  - "The host port 8080 is already in use by another process or container"
  answer: 3
  explanation: |
    The error is about the host-side port (8080). Something else — another container or host
    process — already holds it. Find the holder with `docker ps`/`lsof -i :8080` and pick another
    host port or stop the holder.
  ref: "concepts.md#common-errors-and-their-fixes"

- id: debugging-troubleshooting-039
  difficulty: intermediate
  tags: [common-errors, pull, manifest]
  question: |
    `docker run myco/private-app` fails with `pull access denied` / `repository does not exist`.
    What are the likely causes?
  options:
  - "The container ran out of memory"
  - "The image name/tag is wrong, or the repo is private and you're not authenticated (`docker login`)"
  - "Port 80 is in use"
  - "The entrypoint isn't executable"
  answer: 1
  explanation: |
    That error means the daemon couldn't find or access the image: a wrong image path/tag, or a
    private repository you haven't authenticated to. Fix the tag or run `docker login` for the
    registry.
  ref: "concepts.md#common-errors-and-their-fixes"

- id: debugging-troubleshooting-040
  difficulty: intermediate
  tags: [common-errors, disk-space, prune]
  question: |
    A build fails with `no space left on device` even though your source is small. What's the
    most likely cause and a safe first diagnostic?
  options:
  - "The host disk is full of images/layers/volumes/logs; run `docker system df` to see what's consuming space before pruning"
  - "The image is the wrong architecture; rebuild it"
  - "You need more RAM; add --memory"
  - "The registry is down"
  answer: 0
  explanation: |
    Docker accumulates images, build cache, volumes, and container logs that can fill the host
    disk. `docker system df` breaks down usage so you can prune deliberately, rather than blindly
    running a destructive `prune -a --volumes`.
  ref: "concepts.md#common-errors-and-their-fixes"

- id: debugging-troubleshooting-041
  difficulty: advanced
  tags: [common-errors, prune, data-loss]
  question: |
    Which statement about `docker system prune` is correct and safety-relevant?
  options:
  - "It only removes stopped containers and never touches images or volumes"
  - "It never deletes anything without a backup"
  - "With `-a` it removes all unused images, and `--volumes` deletes unused volumes — which can destroy data you meant to keep"
  - "It only affects the current project directory"
  answer: 2
  explanation: |
    Plain `prune` removes stopped containers, dangling images, and unused networks. Adding `-a`
    removes all unused images and `--volumes` removes unused volumes — potentially deleting
    important data. In production, prune narrowly and read the confirmation prompt.
  ref: "concepts.md#common-errors-and-their-fixes"

- id: debugging-troubleshooting-042
  difficulty: intermediate
  tags: [common-errors, daemon-connection]
  question: |
    Any docker command returns `Cannot connect to the Docker daemon at unix:///var/run/docker.sock`.
    What are the usual causes?
  options:
  - "The image tag is wrong"
  - "A container is OOMKilled"
  - "The port is already allocated"
  - "The daemon isn't running, or DOCKER_HOST/socket permissions are wrong (user not in the docker group)"
  answer: 3
  explanation: |
    This is a client-to-daemon connectivity problem: the daemon isn't started, `DOCKER_HOST` points
    elsewhere, or your user lacks permission on the socket. Start Docker, check `DOCKER_HOST`, and
    add the user to the `docker` group (or use sudo).
  ref: "concepts.md#common-errors-and-their-fixes"

- id: debugging-troubleshooting-043
  difficulty: intermediate
  tags: [logs, since, time-filter]
  question: |
    You only care about a container's log output from the last 15 minutes. Which flag does that?
  options:
  - "`docker logs --tail 15 my-app`"
  - "`docker logs --since 15m my-app`"
  - "`docker logs --window 15 my-app`"
  - "`docker logs -n 15 my-app`"
  answer: 1
  explanation: |
    `--since` filters by time and accepts Go durations (`15m`), UNIX timestamps, or RFC3339 dates.
    `--tail`/`-n` limits by line count, not time, so `--tail 15` would show only 15 lines total.
  ref: "concepts.md#reading-container-logs-docker-logs"

- id: debugging-troubleshooting-044
  difficulty: advanced
  tags: [stats, pids, zombies]
  question: |
    In `docker stats`, a container's PIDS count keeps climbing without bound. What class of
    problem does this hint at?
  options:
  - "A runaway fork or a zombie-reaping problem — PID 1 not reaping dead children (or a fork bomb)"
  - "Normal behaviour for any web server"
  - "A memory leak only"
  - "A DNS misconfiguration"
  answer: 0
  explanation: |
    A steadily rising PIDS count suggests processes/threads are being created faster than they're
    cleaned up — often PID 1 failing to reap zombie children (use an init like `--init`/tini) or a
    fork bomb. It's a distinct signal from memory growth.
  ref: "concepts.md#live-resource-usage-with-docker-stats"

- id: debugging-troubleshooting-045
  difficulty: beginner
  tags: [logs, redirect, stderr]
  question: |
    `docker logs` interleaves stdout and stderr. How do you view only stderr from a container?
  options:
  - "`docker logs --stderr my-app`"
  - "`docker logs -e my-app`"
  - "`docker logs my-app 1>/dev/null` (discard stdout, keep stderr)"
  - "You cannot separate them at all"
  answer: 2
  explanation: |
    `docker logs` writes the container's stdout to the command's stdout and stderr to stderr, so
    shell redirection separates them: `1>/dev/null` discards stdout leaving stderr; `2>/dev/null`
    keeps only stdout. There is no `--stderr` flag.
  ref: "concepts.md#reading-container-logs-docker-logs"

- id: debugging-troubleshooting-046
  difficulty: intermediate
  tags: [methodology, order-of-operations]
  question: |
    You're asked how you debug a container that won't stay up. Which ordering reflects the
    recommended methodology?
  options:
  - "Rebuild the image, then redeploy, then hope"
  - "Run `docker stats` first, then delete the container"
  - "Immediately run `docker system prune -a`"
  - "Check `docker ps -a` for the exit code, read `docker logs`, `docker inspect` the resolved command/mounts, then override the entrypoint with a shell to poke around"
  answer: 3
  explanation: |
    The disciplined loop is: identify the state/exit code (`docker ps -a`, `inspect`), read the
    logs, verify the resolved config, then get inside (shell/`docker debug`) or reproduce by
    overriding the entrypoint. It classifies the failure before random changes.
  ref: "concepts.md#a-debugging-methodology-for-containers"
