topic: "Debugging & Troubleshooting Containers"
domain: docker
topic_slug: debugging-troubleshooting
schema: 1
pass: clarity-v1

prompts:
  - id: debugging-troubleshooting-p001
    ref: "concepts.md#reading-container-logs-docker-logs"
    kind: refute
    tier: A
    prompt: |
      A teammate switches to the `awslogs` driver, sees `docker logs` error out, and declares
      the container's logs lost. What is wrong with that conclusion?
    hint: "Ask where a remote driver puts the stream instead."
    answer_in: "concepts.md#reading-container-logs-docker-logs"

  - id: debugging-troubleshooting-p002
    ref: "concepts.md#getting-a-shell-inside-a-running-container-docker-exec"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you ship a shell-form `CMD`, run `docker top` on the container. When does `PID 1`
      turn out to be your process, and when is it `/bin/sh` with your process as its child?
    hint: "How many commands did you hand the shell — one, or more than one?"
    answer_in: "concepts.md#getting-a-shell-inside-a-running-container-docker-exec"

  - id: debugging-troubleshooting-p003
    ref: "concepts.md#live-resource-usage-with-docker-stats"
    kind: predict-failure
    tier: A
    prompt: |
      `docker stats` shows a container at `250%` CPU on an 8-core host and on-call wants to
      page. Is that a runaway, and what figure would be?
    hint: "100% is one full core."
    answer_in: "concepts.md#live-resource-usage-with-docker-stats"

  - id: debugging-troubleshooting-p004
    ref: "concepts.md#why-a-container-wont-start-or-exits-immediately"
    kind: refute
    tier: A
    prompt: |
      A container running `service nginx start` keeps exiting, so a colleague blames an nginx
      crash and adds `restart: always`. Now it crash-loops. What actually ended?
    hint: "What was `PID 1` here, and did it fail?"
    answer_in: "concepts.md#why-a-container-wont-start-or-exits-immediately"

  - id: debugging-troubleshooting-p005
    ref: "concepts.md#exit-codes-oomkilled-137-sigterm-143-and-friends"
    kind: draw-the-boundary
    tier: A
    prompt: |
      The section says a container's exit code is its `PID 1`'s exit code. Find the three codes
      where that is not true, and say what produced the number instead.
    hint: "Which codes fire before any program of yours runs?"
    answer_in: "concepts.md#exit-codes-oomkilled-137-sigterm-143-and-friends"

  - id: debugging-troubleshooting-p006
    ref: "concepts.md#debugging-distroless--shell-less-images"
    kind: name-the-price
    tier: C
    prompt: |
      `docker debug` shells into any image, even a shell-less one. What does relying on it
      require that the `netshoot` namespace-join route does not?
    hint: "It is a Docker Desktop feature, not part of the open-source Engine CLI."
    answer_in: external
    success_criterion: |
      You can name the Docker subscription tier `docker debug` requires and the Docker Desktop
      version that made it generally available, and explain why the namespace-join and
      `netshoot` routes carry no such requirement (they use only the open-source Engine).
    search_hint: |
      The `docker debug` CLI reference and the Docker Desktop release notes on docs.docker.com;
      confirm it is a Desktop feature bound to a paid subscription tier, not an Engine command.

  - id: debugging-troubleshooting-p007
    ref: "concepts.md#inspecting-filesystem-changes-with-docker-diff"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time `docker diff` comes back empty for a path the app clearly writes to, what does
      that tell you about how the path is mounted?
    hint: "The writable layer is not the only place bytes land."
    answer_in: "concepts.md#inspecting-filesystem-changes-with-docker-diff"

  - id: debugging-troubleshooting-p008
    ref: "concepts.md#common-errors-and-their-fixes"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you run Docker commands inside a CI job, check what makes the daemon reachable
      at all: what is mounted into the runner for that to work?
    hint: "Look for a socket path in the job's mounts."
    answer_in: "concepts.md#common-errors-and-their-fixes"

cliffhanger:
  pattern: A
  hook: |
    Every escalation in this topic opened the isolation boundary on purpose. To read a
    shell-less container you joined its PID and network namespaces. You read its files through
    `/proc/1/root`. To run Docker in CI you reached the daemon through a mounted
    `/var/run/docker.sock`. Each move works by dissolving the wall between one container and the
    rest of the host. The next topic lists those same moves as attack vectors, in a table of
    container escapes headed `--privileged`, mounted `docker.sock`, and `CAP_SYS_ADMIN`. To
    debug a container you join it; to break out of one, an attacker joins it the same way. The
    only difference is who is typing, and that is what the next topic learns to price.
  teaser_questions:
    - "If joining a container's namespaces is how you debug it, what stops an attacker from joining yours?"
    - "Of the three debug primitives — namespace join, `/proc/1/root`, mounted socket — which is most dangerous left enabled in production?"
  payoff:
    anchor: concepts.md#container-escape-threat-model
    claim: |
      The destination's escape table is the debug primitives inverted: `--privileged`, mounted
      `docker.sock`, and `CAP_SYS_ADMIN` appear as escape vectors, each paired with the control
      that stops it. The exact string "docker.sock" resolves there today.
