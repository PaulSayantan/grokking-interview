topic: Docker Compose & Multi-Container Apps
domain: docker
topic_slug: docker-compose
version: 1
questions:
- id: docker-compose-001
  difficulty: beginner
  tags:
  - fundamentals
  - purpose
  question: |
    What problem does Docker Compose primarily solve?
  options:
  - It defines and runs a multi-container application declaratively as one unit
  - It builds a single image faster than the Dockerfile can
  - It replaces the container runtime with a lighter alternative
  - It schedules containers across many nodes in a cluster
  answer: 0
  explanation: |
    Compose lets you describe a whole multi-container app (services, networks,
    volumes, dependency order) in one YAML file and manage it as a single project
    with commands like `up`/`down`. It does not build images itself (the Dockerfile
    does) and it is single-host, not a multi-node scheduler.
  ref: concepts.md#what-docker-compose-is
- id: docker-compose-002
  difficulty: beginner
  tags:
  - compose-v2
  - cli
  question: |
    Which command invokes the current Compose V2?
  options:
  - docker-compose up (hyphenated binary)
  - docker run --compose
  - docker compose up (a docker subcommand)
  - compose start
  answer: 2
  explanation: |
    Compose V2 is a Go plugin invoked as the `docker compose` subcommand (with a
    space). The legacy `docker-compose` (hyphen) is the older Python V1 binary. V2
    implements the open Compose Specification.
  ref: concepts.md#what-docker-compose-is
- id: docker-compose-003
  difficulty: beginner
  tags:
  - compose-vs-dockerfile
  - concepts
  question: |
    What is the correct division of responsibility between a Dockerfile and a
    compose.yaml?
  options:
  - Both build images; Compose is just a faster Dockerfile
  - The Dockerfile orchestrates containers; Compose builds images
  - They are interchangeable; use whichever you prefer
  - The Dockerfile builds one image; Compose orchestrates how many containers run together
  answer: 3
  explanation: |
    A Dockerfile turns source into a single image at build time. Compose wires many
    containers together at runtime — networks, dependency order, ports, env, volumes.
    They are complementary; a Compose service can point at a Dockerfile via `build:`.
  ref: concepts.md#compose-vs-dockerfile
- id: docker-compose-004
  difficulty: intermediate
  tags:
  - compose-vs-dockerfile
  - build
  question: |
    A teammate asks you to "add the database startup and networking to the
    Dockerfile." What's the correct response?
  options:
  - Add a RUN instruction that starts Postgres in the Dockerfile
  - Multi-container orchestration belongs in compose.yaml, not the Dockerfile
  - Use an ENTRYPOINT that launches both the app and the database
  - Put the network config in a HEALTHCHECK instruction
  answer: 1
  explanation: |
    A Dockerfile builds one image's filesystem and metadata; it cannot express
    "start the DB then the API on a shared network." That is orchestration and lives
    in compose.yaml (services, networks, depends_on).
  ref: concepts.md#compose-vs-dockerfile
- id: docker-compose-005
  difficulty: beginner
  tags:
  - structure
  - top-level
  question: |
    Which top-level key in a compose.yaml is required and defines the containers of
    the app?
  options:
  - networks
  - volumes
  - version
  - services
  answer: 3
  explanation: |
    `services` is the heart of the file — each key is a service name whose value
    configures a container (or replicas). `networks` and `volumes` are optional
    (defaults are auto-created), and `version` is obsolete.
  ref: concepts.md#composeyaml-structure
- id: docker-compose-006
  difficulty: intermediate
  tags:
  - structure
  - version
  - gotcha
  question: |
    You inherit a file starting with `version: "3.8"`. What is true in modern
    Compose?
  options:
  - It is obsolete and ignored; modern Compose warns about it
  - It is required or the file will not parse
  - It selects a stricter validation mode
  - It pins the Docker Engine version
  answer: 0
  explanation: |
    The Compose Specification merged the old 2.x/3.x schemas and is versionless. The
    top-level `version:` field is obsolete — Compose ignores it and warns. New files
    start directly with `services:`.
  ref: concepts.md#composeyaml-structure
- id: docker-compose-007
  difficulty: beginner
  tags:
  - structure
  - defaults
  question: |
    If a compose.yaml has services but no top-level `networks:` section, what
    happens to networking?
  options:
  - Services get no network and cannot communicate
  - Each service is placed on the host network
  - Compose creates a default network and attaches every service to it
  - The file fails validation
  answer: 2
  explanation: |
    When you omit `networks:`, Compose creates a single default bridge network for
    the project and attaches all services, so they can discover and reach each other
    by service name.
  ref: concepts.md#composeyaml-structure
- id: docker-compose-008
  difficulty: intermediate
  tags:
  - declarative
  - reconciliation
  question: |
    You edit only the `api` service's source and run `docker compose up -d` again on
    a running project. What does Compose do?
  options:
  - Recreates every container in the project from scratch
  - Recreates only what changed (e.g. api), leaving db and its data untouched
  - Refuses to run because containers already exist
  - Deletes all named volumes and rebuilds
  answer: 1
  explanation: |
    Compose is declarative: it diffs desired vs actual state and makes the minimum
    change, recreating only affected containers. The DB container and its named
    volume are left alone. (Note: it won't rebuild the api image unless you pass
    --build.)
  ref: concepts.md#defining-a-multi-container-app-declaratively
- id: docker-compose-009
  difficulty: beginner
  tags:
  - service-discovery
  - dns
  question: |
    In the same Compose project, how should the `api` service address the `db`
    service?
  options:
  - By the container's IP address, hardcoded
  - Via localhost on the db's port
  - Only through a published host port
  - By the service name `db` (Docker's embedded DNS resolves it)
  answer: 3
  explanation: |
    Compose attaches services to a shared network with an embedded DNS server
    (127.0.0.11) that resolves service names to the current container IP. Use the
    service name (`db`), which is stable across restarts, not an IP.
  ref: concepts.md#service-discovery-and-the-default-network
- id: docker-compose-010
  difficulty: intermediate
  tags:
  - service-discovery
  - localhost
  - gotcha
  question: |
    Your app's config points the database URL at `localhost:5432`, but it can't
    connect to the `db` service. Why?
  options:
  - Inside a container, localhost is that container itself, not the db container
  - Postgres does not listen on 5432 by default
  - Compose blocks all loopback traffic
  - You must publish 5432 with ports first
  answer: 0
  explanation: |
    `localhost` inside a container refers to that container, not a peer. To reach the
    database, use the service name Docker DNS resolves — `db:5432` — not localhost.
  ref: concepts.md#service-discovery-and-the-default-network
- id: docker-compose-011
  difficulty: intermediate
  tags:
  - service-discovery
  - links
  - legacy
  question: |
    Do you need the legacy `links:` directive for one service to resolve another by
    name?
  options:
  - Yes, links is mandatory for DNS resolution
  - No — DNS on the shared network handles name resolution; links is legacy
  - Only when services are in different projects
  - Only for UDP-based services
  answer: 1
  explanation: |
    Service-name DNS on the shared Compose network makes `links:` unnecessary. It is
    a legacy directive kept for backward compatibility; you don't need it.
  ref: concepts.md#service-discovery-and-the-default-network
- id: docker-compose-012
  difficulty: advanced
  tags:
  - networks
  - segmentation
  - isolation
  question: |
    Given proxy on network `frontend`, api on `[frontend, backend]`, and db on
    `backend` only — can `proxy` reach `db`?
  options:
  - Yes, all services in a project can always reach each other
  - Yes, but only via the api as a relay automatically
  - No, proxy and db share no common network, so they cannot resolve or reach each other
  - Only if db publishes a host port
  answer: 2
  explanation: |
    Name resolution and reachability are scoped to a shared network. proxy (frontend)
    and db (backend) have no common network, so proxy cannot reach db. api bridges
    both tiers. This is network segmentation to reduce blast radius.
  ref: concepts.md#networks-per-service
- id: docker-compose-013
  difficulty: advanced
  tags:
  - networks
  - internal
  question: |
    Which network option makes a network have no external/outbound connectivity —
    useful for locking down a backend tier?
  options:
  - 'internal: true'
  - 'driver: host'
  - 'external: true'
  - 'attachable: true'
  answer: 0
  explanation: |
    `internal: true` creates a network with no external access, so services on it
    can talk to each other but not reach outside. `external: true` attaches to a
    pre-existing network; `driver: host` shares the host stack.
  ref: concepts.md#networks-per-service
- id: docker-compose-014
  difficulty: intermediate
  tags:
  - networks
  - design
  question: |
    An interviewer asks how you'd stop the web/edge tier from talking directly to the
    database in a Compose app. Best answer?
  options:
  - Set a firewall rule inside the database container
  - Use depends_on to block the connection
  - Remove the db service's ports mapping
  - Put the DB only on a backend network the edge proxy is not attached to
  answer: 3
  explanation: |
    Network segmentation: attach the DB only to a `backend` network, and don't attach
    the edge proxy to it. With no shared network, the proxy cannot resolve or reach
    the DB. Removing `ports` only affects host publishing, not inter-container reach.
  ref: concepts.md#networks-per-service
- id: docker-compose-015
  difficulty: beginner
  tags:
  - depends_on
  - ordering
  question: |
    What does a plain `depends_on: [db]` guarantee for the dependent service?
  options:
  - The db is fully ready to accept queries before the dependent starts
  - Compose starts the db container before the dependent (start order only)
  - The dependent restarts whenever db restarts
  - The db and dependent start simultaneously
  answer: 1
  explanation: |
    Short-form `depends_on` controls start (and stop) order only: Compose starts db
    first. It waits only for the container to be *started*, NOT for the app inside to
    be ready to serve — that's the classic gotcha.
  ref: concepts.md#depends_on-ordering-not-readiness
- id: docker-compose-016
  difficulty: intermediate
  tags:
  - depends_on
  - readiness
  - gotcha
  question: |
    Your API depends_on the db but crashes on startup with "connection refused" even
    though the db container is running. What's the root cause and fix?
  options:
  - The db image is broken; rebuild it
  - 'You must publish the db port with ports:'
  - 'depends_on waits for start, not readiness; use condition: service_healthy (or app retries)'
  - 'You need to add links: between the services'
  answer: 2
  explanation: |
    The db container is running but the engine is still initializing. depends_on only
    guarantees start order, not readiness. Fix with `condition: service_healthy`
    (needs a healthcheck on db) or connection-retry-with-backoff in the app.
  ref: concepts.md#depends_on-ordering-not-readiness
- id: docker-compose-017
  difficulty: intermediate
  tags:
  - depends_on
  - conditions
  - migrations
  question: |
    You have a one-shot `migrate` job that must finish successfully before `api`
    starts. Which depends_on condition expresses this?
  options:
  - service_started
  - service_healthy
  - service_restarted
  - service_completed_successfully
  answer: 3
  explanation: |
    `service_completed_successfully` waits until the dependency runs to completion
    with exit code 0 — exactly right for a migration/seed job that must finish before
    the app comes up.
  ref: concepts.md#depends_on-ordering-not-readiness
- id: docker-compose-018
  difficulty: advanced
  tags:
  - depends_on
  - best-practice
  - portability
  question: |
    Why is app-level connection retry-with-backoff often preferred over relying
    solely on depends_on conditions?
  options:
  - It is more portable and resilient — dependencies can drop/restart anytime, not just at boot
  - It is faster to type
  - depends_on does not work in Compose V2
  - Healthchecks are not supported by any database image
  answer: 0
  explanation: |
    Dependencies can become unavailable at any time (restart, transient failure), not
    only at startup. An app that retries connecting is resilient regardless of
    orchestration and portable across environments (including K8s), which is why it's
    the production-grade habit.
  ref: concepts.md#depends_on-ordering-not-readiness
- id: docker-compose-019
  difficulty: intermediate
  tags:
  - healthcheck
  - states
  question: |
    During a healthcheck's configured `start_period`, what happens to failing
    probes?
  options:
  - They immediately mark the container unhealthy
  - They do not count toward retries; the container stays in 'starting'
  - They count double toward the retries limit
  - They restart the container each time
  answer: 1
  explanation: |
    `start_period` is a grace window for slow-booting services: the container is in
    the `starting` state and failures during it are not counted toward `retries`, so
    it isn't prematurely flagged unhealthy.
  ref: concepts.md#healthchecks-and-waiting-for-readiness
- id: docker-compose-020
  difficulty: intermediate
  tags:
  - healthcheck
  - test
  - forms
  question: |
    What is the difference between `test: ["CMD", ...]` and `test: ["CMD-SHELL", ...]`
    in a healthcheck?
  options:
  - CMD runs via a shell; CMD-SHELL runs directly with no shell
  - They are identical aliases
  - CMD runs the command directly (exec); CMD-SHELL runs it through the shell (pipes/$ work)
  - CMD is for Windows only; CMD-SHELL for Linux only
  answer: 2
  explanation: |
    `CMD` executes the command directly (exec form, no shell). `CMD-SHELL` runs the
    command through the shell, so shell features like pipes, environment expansion,
    and `&&` work. A bare string implies CMD-SHELL.
  ref: concepts.md#healthchecks-and-waiting-for-readiness
- id: docker-compose-021
  difficulty: intermediate
  tags:
  - healthcheck
  - best-practice
  question: |
    Which is the best healthcheck for a Postgres service intended to gate a dependent
    via service_healthy?
  options:
  - Check that TCP port 5432 is open
  - Check that the container process exists
  - Curl an unrelated public URL
  - Run `pg_isready` (or a real query) to confirm the engine accepts connections
  answer: 3
  explanation: |
    Use the dependency's own readiness tooling (`pg_isready`) so 'healthy' means the
    database actually accepts connections. Port-open does not equal app-ready — the
    port can be open while the engine is still initializing.
  ref: concepts.md#healthchecks-and-waiting-for-readiness
- id: docker-compose-022
  difficulty: advanced
  tags:
  - healthcheck
  - kubernetes
  - pointer
  question: |
    The Compose healthcheck concept maps to which Kubernetes feature?
  options:
  - Ingress rules
  - Liveness and readiness probes
  - ConfigMaps
  - Namespaces
  answer: 1
  explanation: |
    Kubernetes consumes the same idea as liveness/readiness probes (covered in the
    kubernetes domain). Mentioning this lineage shows you understand how single-host
    healthchecks generalize to an orchestrator.
  ref: concepts.md#healthchecks-and-waiting-for-readiness
- id: docker-compose-023
  difficulty: beginner
  tags:
  - build-vs-image
  - basics
  question: |
    A service declares neither `image:` nor `build:`. What happens?
  options:
  - The service is invalid — a service must resolve to an image via build or image
  - Compose uses a default alpine image
  - It runs an empty container
  - Compose builds from the current directory automatically
  answer: 0
  explanation: |
    Every service must resolve to an image, obtained either from a registry via
    `image:` or built from a Dockerfile via `build:`. With neither, there is nothing
    to run.
  ref: concepts.md#build-vs-image
- id: docker-compose-024
  difficulty: intermediate
  tags:
  - build-vs-image
  - tagging
  question: |
    A service specifies both `build: ./api` and `image: myorg/api:dev`. What does
    Compose do?
  options:
  - Pulls myorg/api:dev and ignores the build
  - Errors because the two conflict
  - Builds from ./api and tags the result as myorg/api:dev
  - Builds and pushes to the registry automatically
  answer: 2
  explanation: |
    When both are present, Compose builds the image from the context and tags it with
    the `image:` name (it does not pull). This lets you name/reuse the locally built
    image.
  ref: concepts.md#build-vs-image
- id: docker-compose-025
  difficulty: intermediate
  tags:
  - build-vs-image
  - rebuild
  - gotcha
  question: |
    You changed application source, then ran `docker compose up` (no flags), but the
    change isn't running. Why?
  options:
  - Compose cached DNS entries
  - The container needs a reboot of the host
  - You must delete all volumes first
  - Compose reused the existing image; it doesn't rebuild on source change unless you pass --build
  answer: 3
  explanation: |
    Plain `docker compose up` builds only if the image is absent; it does not rebuild
    just because source changed. Use `docker compose up --build` (or bind-mount source
    in dev to skip rebuilds entirely).
  ref: concepts.md#build-vs-image
- id: docker-compose-026
  difficulty: beginner
  tags:
  - ports
  - publishing
  question: |
    In `ports: ["8080:80"]`, what does the mapping mean?
  options:
  - Container port 8080 maps to host port 80
  - Host port 8080 forwards to container port 80
  - Both ports are on the container
  - It exposes 8080 only to peer containers
  answer: 1
  explanation: |
    Short syntax is HOST:CONTAINER. So host port 8080 is published and forwards to
    port 80 inside the container, making the service reachable from outside Docker at
    8080.
  ref: concepts.md#ports-and-expose
- id: docker-compose-027
  difficulty: intermediate
  tags:
  - ports
  - expose
  - difference
  question: |
    What is the difference between `ports:` and `expose:`?
  options:
  - ports publishes to the host machine; expose only advertises the port to other containers on the network
  - ports is for TCP, expose is for UDP
  - They are synonyms
  - expose publishes to the host; ports is internal-only
  answer: 0
  explanation: |
    `ports:` maps a container port to the host so external clients can reach it.
    `expose:` only documents/opens a port for peer containers on the network and is
    not published to the host.
  ref: concepts.md#ports-and-expose
- id: docker-compose-028
  difficulty: intermediate
  tags:
  - ports
  - inter-service
  - gotcha
  question: |
    Two services need to talk to each other over the Compose network. Does the target
    service need a `ports:` mapping for this?
  options:
  - Yes, without ports the container is unreachable by anyone
  - Only if they are on different networks
  - Only for HTTP services
  - No — inter-service traffic uses the container's own port on the shared network; ports is only for
    host access
  answer: 3
  explanation: |
    Publishing with `ports:` is only about host/external access. Services reach each
    other over the Compose network on the container's own port regardless of
    publishing. Publish only what a human/external client must hit.
  ref: concepts.md#ports-and-expose
- id: docker-compose-029
  difficulty: advanced
  tags:
  - ports
  - scaling
  - gotcha
  question: |
    You run `docker compose up --scale api=3` on a service with `ports: ["8080:80"]`.
    What goes wrong?
  options:
  - Nothing; all three share port 8080 fine
  - Compose silently drops to one replica
  - Only one replica can bind host port 8080 — the others collide on the fixed host port
  - The api can no longer reach the db
  answer: 2
  explanation: |
    A fixed host port can't be bound by three replicas simultaneously — they collide.
    Use a port range (`8080-8082:80`), let Docker assign random host ports (`- "80"`),
    or front the replicas with a proxy/load balancer.
  ref: concepts.md#ports-and-expose
- id: docker-compose-030
  difficulty: intermediate
  tags:
  - ports
  - security
  - binding
  question: |
    What does `ports: ["127.0.0.1:9090:9090"]` accomplish versus `["9090:9090"]`?
  options:
  - Nothing different; the IP is decorative
  - It binds the published port to loopback only, so it's reachable locally but not from other hosts
  - It disables the port entirely
  - It maps to a random host port
  answer: 1
  explanation: |
    Prefixing with `127.0.0.1:` binds the published port to the loopback interface
    only, so external machines can't reach it. Plain `9090:9090` binds all interfaces,
    widening the attack surface.
  ref: concepts.md#ports-and-expose
- id: docker-compose-031
  difficulty: beginner
  tags:
  - volumes
  - persistence
  question: |
    Why put a database's data directory on a named volume in Compose?
  options:
  - So data persists across container recreation instead of living in the ephemeral writable layer
  - To make the image smaller
  - To speed up DNS resolution
  - To publish the DB port automatically
  answer: 0
  explanation: |
    A container's writable layer is discarded when it's removed. A named volume,
    managed by Docker, persists independently so the database's data survives
    container recreation and image updates.
  ref: concepts.md#volumes-and-data-persistence
- id: docker-compose-032
  difficulty: intermediate
  tags:
  - volumes
  - down
  - gotcha
  question: |
    Does `docker compose down` delete named volumes (e.g. your database data)?
  options:
  - Yes, always
  - Only if the volume is empty
  - Only bind mounts are deleted
  - No — named volumes survive; you must run `down -v` to remove them
  answer: 3
  explanation: |
    `docker compose down` removes containers and the default network but intentionally
    keeps named volumes so you don't accidentally destroy your database. Use `down -v`
    to also delete volumes.
  ref: concepts.md#volumes-and-data-persistence
- id: docker-compose-033
  difficulty: intermediate
  tags:
  - volumes
  - bind-mount
  - dev
  question: |
    A dev compose file has `volumes: ["./src:/app/src"]`. What is the main purpose?
  options:
  - To persist database data
  - To reduce the image size
  - To bind-mount host source into the container so edits appear instantly (hot reload)
  - To create a named volume called src
  answer: 2
  explanation: |
    A bind mount maps a host directory into the container; edits on the host show up
    immediately inside, enabling hot-reload in development. It couples the container to
    host layout, so it's a dev pattern, not prod.
  ref: concepts.md#volumes-and-data-persistence
- id: docker-compose-034
  difficulty: beginner
  tags:
  - environment
  - env-vars
  question: |
    What does the service-level `environment:` block do?
  options:
  - Interpolates variables in the compose file
  - Sets environment variables inside the running container
  - Configures the Docker daemon
  - Declares named volumes
  answer: 1
  explanation: |
    `environment:` sets env vars inside the container's process environment. It is
    distinct from `.env` (which interpolates the YAML) and from configuring the
    daemon.
  ref: concepts.md#environment-env_file-and-env-substitution
- id: docker-compose-035
  difficulty: advanced
  tags:
  - environment
  - dotenv
  - substitution
  - gotcha
  question: |
    What is the difference between the auto-loaded `.env` file and the `env_file:`
    service key?
  options:
  - '`.env` interpolates ${VAR} in the compose file itself; `env_file:` injects variables into a container'
  - They are the same feature with two names
  - '`.env` injects into the container; `env_file:` interpolates the YAML'
  - Both only work in Compose V1
  answer: 0
  explanation: |
    The project `.env` is read automatically to substitute `${VAR}` references in the
    compose YAML before parsing. `env_file:` points at a file whose KEY=VALUE lines are
    injected into a container's environment. A `.env` value reaches a container only if
    you explicitly pass it.
  ref: concepts.md#environment-env_file-and-env-substitution
- id: docker-compose-036
  difficulty: intermediate
  tags:
  - substitution
  - defaults
  question: |
    In the compose file, what does `image: myorg/api:${TAG:-latest}` do if `TAG` is
    unset?
  options:
  - Fails to parse
  - Uses the literal string ${TAG:-latest}
  - Substitutes the default, resolving to myorg/api:latest
  - Prompts you interactively for TAG
  answer: 2
  explanation: |
    `${VAR:-default}` uses the default value when the variable is unset or empty. So
    with TAG unset the image resolves to `myorg/api:latest`. `${VAR:?msg}` would
    instead error out with a message if unset.
  ref: concepts.md#environment-env_file-and-env-substitution
- id: docker-compose-037
  difficulty: advanced
  tags:
  - environment
  - precedence
  question: |
    A variable is set as a static value in `environment:` in the compose file, and the
    same name is also exported in your shell. Which value ends up in the container?
  options:
  - The env_file value
  - The image's ENV default
  - The shell/host value always wins
  - The static `environment:` value wins over the shell for that variable
  answer: 3
  explanation: |
    A common misconception is that the host shell always wins — it does not. Docker's
    documented precedence puts a *static* value in `environment:` above the host shell.
    The shell value only reaches the container when the file passes it through (a bare
    `environment: [VAR]` or `${VAR}` interpolation). Full order: `run --env` >
    interpolated value from shell/`.env` > static `environment:` > `env_file` >
    image `ENV`.
  ref: concepts.md#environment-env_file-and-env-substitution
- id: docker-compose-038
  difficulty: intermediate
  tags:
  - scaling
  - replicas
  question: |
    Which command runs four replica containers of the `worker` service?
  options:
  - docker compose replicate worker 4
  - docker compose up -d --scale worker=4
  - docker compose worker --count 4
  - docker run --scale 4 worker
  answer: 1
  explanation: |
    `docker compose up -d --scale worker=4` starts four replicas of the worker
    service. You can also set `deploy.replicas: 4` (or the `scale:` key) declaratively
    in the file.
  ref: concepts.md#scaling-services
- id: docker-compose-039
  difficulty: intermediate
  tags:
  - scaling
  - dns
  - load-balancing
  question: |
    When a service is scaled to multiple replicas, how does traffic to its service
    name get distributed?
  options:
  - Docker's embedded DNS round-robins across the replica IPs
  - It always goes to the first replica
  - Compose starts an external load balancer automatically
  - Each replica gets a unique DNS name only
  answer: 0
  explanation: |
    All replicas share the service name; Docker's embedded DNS returns the replica IPs
    in round-robin order, giving basic client-side load spreading. It is not a full L7
    load balancer.
  ref: concepts.md#scaling-services
- id: docker-compose-040
  difficulty: advanced
  tags:
  - scaling
  - single-host
  - limits
  question: |
    What is a fundamental limitation of Compose scaling versus an orchestrator?
  options:
  - It cannot run more than two replicas
  - It only scales stateless HTTP services
  - It requires a paid license
  - All replicas run on the same single host, so it isn't multi-node HA or autoscaling
  answer: 3
  explanation: |
    Compose is single-host: every replica runs on the same machine. That gives local
    concurrency but not high availability across nodes or autoscaling — those need
    Kubernetes/Swarm.
  ref: concepts.md#scaling-services
- id: docker-compose-041
  difficulty: intermediate
  tags:
  - profiles
  - optional-services
  question: |
    A service has `profiles: [tools]`. When does it start with a plain
    `docker compose up`?
  options:
  - Always, like any other service
  - Never, under any circumstances
  - Only when the 'tools' profile is activated (or the service is named explicitly)
  - Only in production mode
  answer: 2
  explanation: |
    Services with a profile start only when that profile is activated (via
    `--profile tools`, `COMPOSE_PROFILES`, or naming the service). Services with no
    profile always start.
  ref: concepts.md#profiles
- id: docker-compose-042
  difficulty: beginner
  tags:
  - profiles
  - use-case
  question: |
    Which is a good use of profiles?
  options:
  - Keeping optional tools (a DB admin UI, a seed job) in the same file without running them by default
  - Storing database passwords
  - Setting the container's CPU limit
  - Defining the default network
  answer: 0
  explanation: |
    Profiles gate optional/heavyweight services (pgAdmin, seed jobs, debuggers) so one
    shared file serves the team without forcing everyone to run them by default.
  ref: concepts.md#profiles
- id: docker-compose-043
  difficulty: intermediate
  tags:
  - override
  - multiple-files
  question: |
    By default (no `-f` flags), which files does Compose auto-load and merge if
    present?
  options:
  - Only compose.yaml
  - compose.yaml plus compose.override.yaml (override layered on top)
  - Every .yaml file in the directory
  - compose.prod.yaml only
  answer: 1
  explanation: |
    Compose auto-loads `compose.yaml` and, if present, `compose.override.yaml`,
    merging the override on top. Other files (like compose.prod.yaml) must be passed
    explicitly with `-f`.
  ref: concepts.md#override-files-and-merging
- id: docker-compose-044
  difficulty: advanced
  tags:
  - override
  - merge-semantics
  question: |
    When merging compose files, how are a scalar like `image` and a sequence like
    `ports` treated?
  options:
  - Both are always replaced by the later file
  - Both are always appended
  - Merging is not allowed; the last file wins entirely
  - Scalars are replaced by the later value; sequences (ports, volumes) are combined/appended
  answer: 3
  explanation: |
    Merge semantics differ by type: scalars (image, a single value) are replaced by
    the later file, while sequences like ports and volumes are appended/combined.
    Mappings like environment merge key by key.
  ref: concepts.md#override-files-and-merging
- id: docker-compose-045
  difficulty: intermediate
  tags:
  - override
  - cli
  - order
  question: |
    With `docker compose -f compose.yaml -f compose.prod.yaml up`, if both set
    `api.image`, which value applies?
  options:
  - The value in compose.yaml (first file)
  - Neither; it errors on conflict
  - The value in compose.prod.yaml (later file wins for scalars)
  - A merge of both strings
  answer: 2
  explanation: |
    Files are merged in the order given, and later files win for scalar values. So
    `compose.prod.yaml`'s `api.image` overrides the base. This is the idiom for
    environment-specific overrides.
  ref: concepts.md#override-files-and-merging
- id: docker-compose-046
  difficulty: intermediate
  tags:
  - dev-vs-prod
  - patterns
  question: |
    Which pairing correctly reflects dev vs prod Compose practice?
  options:
  - 'Dev: build from source, bind-mount code for hot reload / Prod: run a pinned prebuilt image, no source
    mount'
  - 'Dev: pinned prebuilt image, no source mount / Prod: build from source, bind-mount code'
  - Both should bind-mount source for consistency
  - Both should publish every port on all interfaces
  answer: 0
  explanation: |
    Dev builds from local source and bind-mounts code for hot reload; prod runs a
    pinned, prebuilt image with the code baked in and no source mount, preserving the
    immutable-image guarantee.
  ref: concepts.md#dev-vs-prod-compose
- id: docker-compose-047
  difficulty: advanced
  tags:
  - dev-vs-prod
  - immutability
  - gotcha
  question: |
    Why is bind-mounting source (`./:/app`) a bad idea in production?
  options:
  - It makes DNS resolution slower
  - It disables healthchecks
  - Volumes are not supported in production
  - The running code depends on host files, defeating the immutable-image guarantee
  answer: 3
  explanation: |
    In prod the running code should come from the built image, not from files on the
    host. A source bind mount couples the container to host state and undermines
    immutability/reproducibility. Prod runs the image with no source mount.
  ref: concepts.md#dev-vs-prod-compose
- id: docker-compose-048
  difficulty: beginner
  tags:
  - single-host
  - scope
  question: |
    Docker Compose manages containers on how many hosts?
  options:
  - Any number of hosts in a cluster
  - A single Docker host
  - Exactly two hosts (primary and replica)
  - As many as you have CPU cores
  answer: 1
  explanation: |
    Compose provisions and manages containers on one Docker host. It has no scheduler,
    multi-node networking, or cross-machine self-healing — that is by design.
  ref: concepts.md#compose-is-single-host
- id: docker-compose-049
  difficulty: intermediate
  tags:
  - single-host
  - kubernetes
  - pointer
  question: |
    When should you graduate from Compose to an orchestrator like Kubernetes?
  options:
  - As soon as you have more than one service
  - Only when you need environment variables
  - When you need multi-node scheduling, self-healing across machines, rolling updates, and autoscaling
  - Never; Compose scales to any size
  answer: 2
  explanation: |
    Compose is ideal for local dev, CI, and single-node deployments. Multi-node
    scheduling, cross-machine self-healing, rolling updates, and autoscaling are the
    signals to move to Kubernetes (its own domain in this library).
  ref: concepts.md#compose-is-single-host
- id: docker-compose-050
  difficulty: intermediate
  tags:
  - lifecycle
  - down
  - cleanup
  question: |
    What does `docker compose down` remove by default?
  options:
  - Only the containers, leaving the network
  - Everything including named volumes and images
  - Only stopped containers older than 24h
  - Containers, the default network, but not named volumes
  answer: 3
  explanation: |
    `down` stops and removes the project's containers and the default network it
    created, but keeps named volumes (and images) by design. Add `-v` for volumes and
    `--rmi` to remove images.
  ref: concepts.md#defining-a-multi-container-app-declaratively
- id: docker-compose-051
  difficulty: advanced
  tags:
  - service-discovery
  - host-access
  question: |
    A container needs to reach a service running on the host machine. On Linux, which
    approach is commonly used?
  options:
  - 'Add extra_hosts: ["host.docker.internal:host-gateway"] and connect to host.docker.internal'
  - Use localhost inside the container
  - Publish every host port into the container
  - It is impossible without Swarm
  answer: 0
  explanation: |
    `localhost` inside a container is the container itself. Mapping
    `host.docker.internal` to the special `host-gateway` (via extra_hosts) lets the
    container resolve and reach the host. On Docker Desktop this name is provided
    automatically.
  ref: concepts.md#service-discovery-and-the-default-network
- id: docker-compose-052
  difficulty: intermediate
  tags:
  - build
  - rebuild
  - cli
  question: |
    Which command forces images to rebuild before starting the stack?
  options:
  - docker compose start
  - docker compose up --build
  - docker compose refresh
  - docker compose up --no-cache-start
  answer: 1
  explanation: |
    `docker compose up --build` rebuilds service images (that have a build section)
    before starting. `docker compose build` builds without starting. Plain `up` reuses
    existing images.
  ref: concepts.md#build-vs-image
