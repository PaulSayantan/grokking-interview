topic: "Docker Compose & Multi-Container Apps"
domain: docker
topic_slug: docker-compose
schema: 1
pass: clarity-v1

# Where THIS topic settles the loop topic 7 (docker-networking) left open (rule K1):
# a name that resolves at create time is not a process that is ready to serve.
resolves:
  anchor: "concepts.md#depends_on-ordering-not-readiness"

prompts:
  - id: docker-compose-p001
    ref: "concepts.md#compose-vs-dockerfile"
    kind: refute
    tier: A
    prompt: |
      A colleague says the DB-then-API start order belongs in the API's Dockerfile as a
      launch script. Name what a Dockerfile structurally cannot reach to make that work.
    hint: "A Dockerfile builds one image; ask how many containers it can name."
    answer_in: "concepts.md#compose-vs-dockerfile"

  - id: docker-compose-p002
    ref: "concepts.md#service-discovery-and-the-default-network"
    kind: predict-failure
    tier: A
    prompt: |
      A colleague hardcodes `DB_HOST: 172.18.0.3` because "the service name feels flaky." The
      stack works today. Name the first event that breaks it, and why `db` would have survived.
    hint: "Ask what Docker hands out fresh on every container restart, and what it does not."
    answer_in: "concepts.md#service-discovery-and-the-default-network"

  - id: docker-compose-p003
    ref: "concepts.md#defining-a-multi-container-app-declaratively"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time a stack is running, edit one service's source, run `docker compose up -d`
      again, and read which containers Compose reports as Recreated versus left alone.
    hint: "Watch whether the database and its volume are touched when only the API changed."
    answer_in: "concepts.md#defining-a-multi-container-app-declaratively"

  - id: docker-compose-p004
    ref: "concepts.md#networks-per-service"
    kind: draw-the-boundary
    tier: A
    prompt: |
      This kept the DB off the proxy's network. Name the one service in the example that
      could still carry an attacker from the proxy through to the DB, and why.
    hint: "List each service's networks; find the one attached to both tiers."
    answer_in: "concepts.md#networks-per-service"

  - id: docker-compose-p005
    ref: "concepts.md#depends_on-ordering-not-readiness"
    kind: name-the-price
    tier: A
    prompt: |
      `condition: service_healthy` finally makes `api` wait for a ready DB. Name what that
      wait still does not protect against once both containers are up and serving.
    hint: "The gate opens once. Ask what happens the hour after it opens."
    answer_in: "concepts.md#depends_on-ordering-not-readiness"

  - id: docker-compose-p006
    ref: "concepts.md#healthchecks-and-waiting-for-readiness"
    kind: predict-failure
    tier: A
    prompt: |
      Your DB needs 40s to accept connections. You set `interval: 5s`, `retries: 5`, and no
      `start_period`. Predict whether Compose marks it unhealthy before it is ready.
    hint: "Multiply interval by retries, compare with 40s, and note what start_period changes."
    answer_in: "concepts.md#healthchecks-and-waiting-for-readiness"

  - id: docker-compose-p007
    ref: "concepts.md#build-vs-image"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you edit source and run plain `docker compose up`, check whether the change is
      live, then run `docker compose images` to see which image ID it actually used.
    hint: "Compare the image ID before and after; plain `up` does not rebuild."
    answer_in: "concepts.md#build-vs-image"

  - id: docker-compose-p008
    ref: "concepts.md#ports-and-expose"
    kind: draw-the-boundary
    tier: A
    prompt: |
      You published no ports for your database and the API reaches it fine. Name the exact
      moment "no published ports" stops working.
    hint: "Peers on the network need no publishing; ask who else might have to connect."
    answer_in: "concepts.md#ports-and-expose"

  - id: docker-compose-p009
    ref: "concepts.md#volumes-and-data-persistence"
    kind: notice-in-wild
    tier: A
    prompt: |
      Next time you run `docker compose down` on a stack with a database, run `docker volume
      ls` right after and confirm the named volume is still listed.
    hint: "Then compare with what `docker compose down -v` would have left behind."
    answer_in: "concepts.md#volumes-and-data-persistence"

  - id: docker-compose-p010
    ref: "concepts.md#environment-env_file-and-env-substitution"
    kind: predict-failure
    tier: A
    prompt: |
      You put `API_KEY=xyz` in `.env` but never reference it anywhere in the compose file.
      Predict whether the container finds `API_KEY` in its environment, and why.
    hint: "Ask what `.env` actually feeds: the YAML text, or the container."
    answer_in: "concepts.md#environment-env_file-and-env-substitution"

  - id: docker-compose-p011
    ref: "concepts.md#scaling-services"
    kind: name-the-price
    tier: C
    prompt: |
      `deploy.replicas` gives you N containers on one host. Name which other `deploy:` sub-keys
      `docker compose up` applies there, and which it ignores as swarm-only.
    hint: "Start from the Compose Deploy spec, then confirm with `docker compose config`."
    answer_in: external
    search_hint: |
      The Compose Deploy specification (the compose-spec `deploy` page) and Docker's notes on
      what `docker compose up` supports, plus `docker compose config` on a file that uses
      `deploy:`. Support has shifted across Compose releases, so check the version the page
      documents against the version you are running.
    success_criterion: |
      For your Compose version you can list which `deploy:` sub-keys `docker compose up` applies
      on a single host and which it ignores as swarm-only, and cite the spec section that says
      so. A single answer with no version attached is unfinished, because this set has moved
      between releases.

cliffhanger:
  hook: |
    You just built one file that pins the whole deployment: the topology, the networks, the
    volumes, and the exact tag each service runs, like `myorg/api:1.4`. Check it into git and
    any machine rebuilds the same shape.

    But run this on two machines a week apart:

        docker compose pull && docker compose up -d

    Both read `image: myorg/api:1.4`. Both pull "1.4". They can still land different bytes. A
    tag is only a label, and nothing stops someone pushing new content under the same one. The
    file pinned the name. It did not pin what the name points to.
  teaser_questions:
    - "If two machines pull the same tag and get different images, what did the tag actually promise?"
    - "What could you write in the file instead of a tag to pin the exact bytes?"
  payoff:
    anchor: "concepts.md#tags-are-mutable-pointers"
    claim: |
      The destination section states that a tag is a mutable pointer: pushing a new image with
      the same tag moves the pointer, the old image is not deleted, and the tag then resolves to
      different content. It gives the two-machine case directly — two machines pulling
      `myorg/api:1.4` at different times can get different bytes.
