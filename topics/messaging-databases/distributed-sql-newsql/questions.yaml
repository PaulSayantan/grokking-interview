topic: "Distributed SQL & NewSQL"
domain: messaging-databases
topic_slug: distributed-sql-newsql
version: 1
questions:
  - id: distributed-sql-newsql-001
    difficulty: beginner
    tags: [newsql, definition, acid, scaling]
    question: |
      What is the defining premise of a "NewSQL" database compared to a
      traditional single-node RDBMS and a first-generation NoSQL store?
    options:
      - "It keeps the SQL interface and full ACID transactions while also scaling out horizontally"
      - "It drops SQL in favor of a document API but keeps ACID transactions via a coordinator node"
      - "It is an in-memory cache layer that sits in front of a traditional relational database"
      - "It provides eventual consistency with tunable read/write quorums like Amazon Dynamo"
    answer: 0
    explanation: |
      NewSQL's whole pitch is that you should not have to choose between SQL+ACID
      (traditional RDBMS) and horizontal scale + fault tolerance (NoSQL). It keeps
      the relational/SQL interface and full ACID transactions while scaling out
      across many nodes with replication and consensus.
    ref: "concepts.md#the-newsql-premise-vs-nosql-and-sharded-sql"
  - id: distributed-sql-newsql-002
    difficulty: beginner
    tags: [distributed-sql, examples, spanner, cockroachdb]
    question: |
      Which of the following is the landmark geo-distributed distributed-SQL
      system that popularized the category?
    options:
      - "Apache Cassandra"
      - "Google Spanner"
      - "Redis Cluster"
      - "MongoDB"
    answer: 1
    explanation: |
      Google Spanner (OSDI 2012) is the landmark geo-distributed distributed-SQL
      system, introducing TrueTime and external consistency. Cassandra, Redis
      Cluster, and MongoDB are NoSQL systems that historically relaxed strong
      consistency and/or SQL.
    ref: "concepts.md#the-newsql-premise-vs-nosql-and-sharded-sql"
  - id: distributed-sql-newsql-003
    difficulty: intermediate
    tags: [newsql, nosql, cap, consistency]
    question: |
      An interviewer asks, "Isn't NewSQL just NoSQL with a SQL layer bolted on?"
      What is the most accurate rebuttal?
    options:
      - "Yes — the underlying storage engines are byte-for-byte identical, and only the SQL query parser layered on top actually differs"
      - "No — NewSQL fundamentally cannot scale horizontally the way NoSQL does, so it stays confined to a single node"
      - "No — NewSQL's defining claim is ACID + serializable transactions across shards, which NoSQL deliberately gave up for availability/latency"
      - "Yes — but NewSQL additionally guarantees literally zero write latency across regions by skipping any consensus round-trip"
    answer: 2
    explanation: |
      The distinguishing feature is cross-shard ACID with serializable isolation.
      Dynamo-style NoSQL chose the AP side of CAP (availability + low latency) and
      dropped multi-key ACID and strong consistency. NewSQL chooses the CP side and
      engineers around the latency cost with consensus and clever clocks.
    ref: "concepts.md#the-newsql-premise-vs-nosql-and-sharded-sql"
  - id: distributed-sql-newsql-004
    difficulty: intermediate
    tags: [scaling, comparison, sharded-sql]
    question: |
      Before NewSQL, teams scaling a relational database chose from three
      unappealing options. Which statement correctly characterizes them?
    options:
      - "Scale up (unlimited), add read replicas (scales writes), or adopt NoSQL (keeps ACID)"
      - "Add caching, add indexes, or denormalize — all fully transparent"
      - "Use a bigger box, use SSDs, or use compression — all preserve horizontal scale"
      - "Scale up (hits a hardware ceiling), manually shard SQL (app owns cross-shard txns/joins), or adopt NoSQL (drop multi-key ACID / strong consistency)"
    answer: 3
    explanation: |
      The three classic options each had a real drawback: vertical scale-up hits a
      hardware ceiling and is a single point of failure; manual sharding (or Vitess)
      pushes cross-shard transactions/joins/resharding onto the application; NoSQL
      scales out but historically dropped multi-key ACID and strong consistency.
    ref: "concepts.md#the-newsql-premise-vs-nosql-and-sharded-sql"
  - id: distributed-sql-newsql-005
    difficulty: beginner
    tags: [consensus, raft, replication]
    question: |
      In a Raft replication group, when is a log entry considered committed?
    options:
      - "As soon as the leader writes it to its own local log"
      - "Once every replica in the group has persisted it"
      - "Once a majority (quorum) of replicas have durably persisted it"
      - "Once any single follower acknowledges receipt, since one confirmation proves the entry left the leader"
    answer: 2
    explanation: |
      An entry is committed once a majority (quorum) of replicas have durably
      persisted it — with 3 replicas the quorum is 2, with 5 it is 3. Waiting for
      the leader alone would be unsafe; waiting for all replicas would sacrifice
      availability whenever any replica is down.
    ref: "concepts.md#consensus-replication-with-raft"
  - id: distributed-sql-newsql-006
    difficulty: beginner
    tags: [consensus, raft, paxos, spanner]
    question: |
      Which consensus protocol does Google Spanner use to replicate data, versus
      CockroachDB, YugabyteDB, and TiDB?
    options:
      - "Spanner uses Raft; the others use Paxos"
      - "Spanner uses Multi-Paxos; the others use Raft"
      - "All four use two-phase commit as their replication protocol"
      - "All four use Zab (ZooKeeper Atomic Broadcast)"
    answer: 1
    explanation: |
      Spanner uses Multi-Paxos; CockroachDB, YugabyteDB, and TiDB use Raft. Both are
      majority-based consensus protocols that commit an entry once a quorum persists
      it; Raft is generally considered easier to understand and implement.
    ref: "concepts.md#consensus-replication-with-raft"
  - id: distributed-sql-newsql-007
    difficulty: intermediate
    tags: [consensus, fault-tolerance, quorum, replica-count]
    question: |
      Why do distributed-SQL clusters typically use 3 or 5 replicas per group and
      not 4?
    options:
      - "A 4-node group needs a 3-node quorum, so it tolerates only 1 failure — same as 3 replicas — but with more write cost"
      - "Even replica counts are explicitly forbidden by the Raft specification and rejected at cluster startup"
      - "4 replicas can never elect a leader because the vote always ends in an unbreakable 2-2 tie"
      - "Odd replica counts are purely a naming convention and have no measurable impact on fault tolerance"
    answer: 0
    explanation: |
      Fault tolerance depends on keeping a majority. With 4 replicas the quorum is 3,
      so you tolerate only 1 failure — identical to 3 replicas — while paying more
      write cost. Odd replica counts maximize fault tolerance per replica: 3 tolerates
      1, 5 tolerates 2.
    ref: "concepts.md#consensus-replication-with-raft"
  - id: distributed-sql-newsql-008
    difficulty: advanced
    tags: [consensus, quorum, overlap, safety]
    question: |
      What property of majority quorums guarantees a newly elected Raft leader has
      seen the latest committed entry?
    options:
      - "Leaders always keep a full backup of every follower's log"
      - "The leader with the lowest node ID always wins and holds all data"
      - "Followers forward all entries to a central coordinator before voting"
      - "Any two majorities of the same group overlap in at least one node"
    answer: 3
    explanation: |
      Any two majorities of the same group must intersect in at least one node.
      Because a committed entry was persisted by a majority, and a new leader needs
      votes from a majority, the two sets overlap — so at least one voter has the
      latest committed entry, and Raft's election rules ensure such a node is chosen.
    ref: "concepts.md#consensus-replication-with-raft"
  - id: distributed-sql-newsql-009
    difficulty: intermediate
    tags: [reads, leaseholder, linearizable, latency]
    question: |
      How does CockroachDB serve a linearizable read without paying a consensus
      round-trip on every read?
    options:
      - "The leaseholder serves the read locally because its time-based lease guarantees it has all committed writes for that range"
      - "It reads from a randomly chosen follower replica and simply assumes the data returned is current"
      - "It runs a full Raft consensus round-trip on every single read to be certain the value is committed"
      - "It caches all read results in an external Redis tier sitting in front of the cluster nodes"
    answer: 0
    explanation: |
      Reads are not usually run through the log. The leaseholder (CockroachDB) or the
      Paxos leader (Spanner) holds a valid time-based lease that guarantees it has seen
      all committed writes for that range, so it can serve a linearizable read locally
      without a consensus round-trip.
    ref: "concepts.md#consensus-replication-with-raft"
  - id: distributed-sql-newsql-010
    difficulty: advanced
    tags: [consensus, failure-domain, availability, placement]
    question: |
      A range's 3 replicas all happen to live in the same availability zone, and
      that AZ goes down. What happens, and why?
    options:
      - "Nothing at all — consensus replication makes the data fully durable against any conceivable failure scenario"
      - "The range loses quorum and becomes unavailable for writes until replicas recover; consensus provides consistency, not immunity to correlated failure"
      - "The range automatically re-replicates itself to another availability zone in under one millisecond with no interruption"
      - "Reads fail immediately but writes keep succeeding because the leaseholder alone can commit new entries"
    answer: 1
    explanation: |
      Consensus guarantees consistency, not free durability against correlated
      failure. If a majority of a range's replicas share a failure domain and it dies,
      the range loses quorum and cannot commit writes until replicas recover. This is
      why zone/placement constraints spread replicas across failure domains.
    ref: "concepts.md#consensus-replication-with-raft"
  - id: distributed-sql-newsql-011
    difficulty: beginner
    tags: [sharding, ranges, terminology]
    question: |
      Distributed-SQL systems use different names for the automatically-partitioned,
      independently-replicated unit of data. Which mapping is correct?
    options:
      - "CockroachDB: tablets; YugabyteDB: ranges; Spanner: regions"
      - "All four systems use the identical term 'shard record' for this partitioned, replicated unit of data"
      - "CockroachDB: ranges; YugabyteDB: tablets; TiDB: regions; Spanner: splits"
      - "Spanner: ranges; CockroachDB: splits; TiDB: tablets; YugabyteDB: regions"
    answer: 2
    explanation: |
      The unit is called a range in CockroachDB, a tablet in YugabyteDB, a region in
      TiDB, and a split in Spanner. Each is an independently Raft/Paxos-replicated
      partition of the keyspace, and the system rebalances these units automatically.
    ref: "concepts.md#automatic-sharding-ranges-vs-hashing-and-rebalancing"
  - id: distributed-sql-newsql-012
    difficulty: intermediate
    tags: [sharding, range, hash, range-scan]
    question: |
      Your workload does many `ORDER BY` and `BETWEEN` range scans on the primary
      key. Which partitioning strategy is more efficient for that access pattern,
      and why?
    options:
      - "Hash partitioning, because applying a hash function to the key preserves its natural sorted order across shards"
      - "Either strategy performs identically for range scans since the optimizer rewrites both into the same plan"
      - "Hash partitioning, because it deterministically routes an entire sorted range onto one node that holds all of it"
      - "Range partitioning, because it keeps sorted order so a scan hits a small number of contiguous ranges instead of fanning out to every shard"
    answer: 3
    explanation: |
      Range partitioning splits the keyspace into contiguous sorted ranges, so a range
      scan touches only a few adjacent ranges. Hash partitioning spreads writes evenly
      but destroys key order, forcing a range scan to fan out to every shard.
    ref: "concepts.md#automatic-sharding-ranges-vs-hashing-and-rebalancing"
  - id: distributed-sql-newsql-013
    difficulty: intermediate
    tags: [sharding, hotspot, monotonic-key, anti-pattern]
    question: |
      You use a monotonically increasing primary key (auto-increment ID or a
      timestamp prefix) with range partitioning and see one node saturated while
      others idle. What is happening and what is the standard fix?
    options:
      - "The underlying disk on that node is failing under load; the fix is to replace the drive and rebalance"
      - "The cluster is running far too many replicas per range; the fix is to reduce the replication factor down to 1"
      - "Every new row lands in the 'end' range so one shard/leaseholder takes all writes; fix with a random UUID, a hash-sharded index, or a scattered key prefix"
      - "Range partitioning is fundamentally broken for inserts; the fix is to collapse every table onto a single shard"
    answer: 2
    explanation: |
      A monotonic key under range partitioning creates a write hotspot: every insert
      targets the last range, so one shard's leaseholder absorbs all write traffic.
      The standard fixes are a random UUID, a hash-sharded index, or reversing/
      scattering the key prefix. This is the most common distributed-SQL perf bug.
    ref: "concepts.md#automatic-sharding-ranges-vs-hashing-and-rebalancing"
  - id: distributed-sql-newsql-014
    difficulty: intermediate
    tags: [sharding, rebalancing, split, merge]
    question: |
      How does a distributed-SQL cluster grow capacity without a global
      stop-the-world reshard?
    options:
      - "It locks the whole database, dumps it, and reloads it onto more nodes"
      - "Ranges split when they exceed a size/heat threshold and a background process continuously rebalances small, independently-replicated ranges across nodes"
      - "It requires a manual DBA-run resharding script for every new node"
      - "It refuses new writes until an operator adds shards by hand"
    answer: 1
    explanation: |
      Each range is small and independently replicated. When a range exceeds a size
      threshold (CockroachDB default ~512 MiB) or gets hot it splits; shrunken ranges
      can merge. A background rebalancer (CockroachDB distribution layer, Spanner
      placement driver, TiDB's PD) moves replicas to equalize load — no global reshard.
    ref: "concepts.md#automatic-sharding-ranges-vs-hashing-and-rebalancing"
  - id: distributed-sql-newsql-015
    difficulty: advanced
    tags: [sharding, rebalancing, raft-membership]
    question: |
      When the rebalancer relocates a range replica from one node to another, how is
      the move performed safely?
    options:
      - "It adds a new replica on the target node and removes the old one via Raft membership changes, so quorum is preserved throughout"
      - "It deletes the range from the old node first, then copies the bytes to the new node during a scheduled maintenance window"
      - "It pauses all writes across the entire cluster until the range copy to the target node finishes completely"
      - "It streams the range data over an unreplicated side channel that bypasses consensus entirely for speed"
    answer: 0
    explanation: |
      Replica movement is done through Raft membership changes: a new replica is added
      on the target node and the old one removed. Because the change goes through
      consensus, quorum and consistency are preserved during the move with no
      stop-the-world step.
    ref: "concepts.md#automatic-sharding-ranges-vs-hashing-and-rebalancing"
  - id: distributed-sql-newsql-016
    difficulty: beginner
    tags: [spanner, truetime, clocks]
    question: |
      What does Spanner's TrueTime API return, and what hardware backs it?
    options:
      - "A single exact nanosecond value derived purely from a software NTP daemon running on each node"
      - "A monotonic logical counter only, with no relationship whatsoever to physical wall-clock time"
      - "A pseudo-random timestamp chosen by the current Paxos leader and broadcast to the group"
      - "A bounded time interval [earliest, latest] that quantifies clock uncertainty, backed by GPS receivers and atomic clocks"
    answer: 3
    explanation: |
      TrueTime returns time as an interval [earliest, latest], explicitly bounding the
      clock uncertainty ε (typically a few milliseconds), and is backed by GPS
      receivers and atomic clocks in every datacenter. It quantifies uncertainty rather
      than pretending a clock is exact.
    ref: "concepts.md#truetime-and-external-consistency-spanner"
  - id: distributed-sql-newsql-017
    difficulty: intermediate
    tags: [spanner, external-consistency, linearizable]
    question: |
      Spanner guarantees "external consistency." What does that mean for two
      transactions T1 and T2?
    options:
      - "If T1 commits before T2 starts in real time, then T1's timestamp < T2's and every reader sees them in that order"
      - "T1 and T2 may be reordered arbitrarily by the database as long as each transaction is internally consistent on its own"
      - "Only reads are guaranteed a total order; the writes of T1 and T2 may still become visible out of real-time order"
      - "It guarantees the replicas eventually converge to the same state but makes no promise about real-time ordering"
    answer: 0
    explanation: |
      External consistency (strict serializability) means the serial order the database
      chooses respects real-world wall-clock order: if T1 commits before T2 begins,
      T1's assigned timestamp is smaller and all readers observe that order. It is the
      strongest guarantee, combining serializability with real-time recency.
    ref: "concepts.md#truetime-and-external-consistency-spanner"
  - id: distributed-sql-newsql-018
    difficulty: advanced
    tags: [spanner, commit-wait, truetime, latency]
    question: |
      What is Spanner's "commit-wait" and why is it necessary?
    options:
      - "A wait for the local disk to fsync the committed write to durable storage before the leader sends its ack"
      - "The commit blocks until TT.now().earliest > the chosen commit timestamp s, ensuring s is provably in the past everywhere; it lasts roughly 2ε"
      - "A configurable delay that batches many small writes together purely for throughput, unrelated to correctness"
      - "A wait for every follower replica, not merely a majority quorum, to acknowledge the committed entry"
    answer: 1
    explanation: |
      After picking commit timestamp s, Spanner waits until TT.now().earliest > s so it
      is certain s is in the past everywhere before making writes visible. This
      commit-wait (about 2ε) is what converts bounded clock uncertainty into the
      external-consistency guarantee.
    ref: "concepts.md#truetime-and-external-consistency-spanner"
  - id: distributed-sql-newsql-019
    difficulty: intermediate
    tags: [spanner, truetime, clock-sync, latency]
    question: |
      How does tighter clock synchronization (a smaller uncertainty ε) affect a
      Spanner cluster?
    options:
      - "It has no effect on write latency, because commit-wait is a fixed protocol constant"
      - "Smaller ε actually forces longer commit-waits to preserve extra safety margin"
      - "Smaller ε means shorter commit-waits and lower write latency"
      - "It silently disables external consistency and falls back to snapshot reads"
    answer: 2
    explanation: |
      Commit-wait is proportional to the uncertainty ε. Tighter clock sync shrinks ε,
      shrinking the wait and lowering write latency. This is precisely why Spanner
      invests in GPS + atomic clocks — and why commodity-hardware systems, with large ε,
      took a different route (HLC) rather than commit-wait.
    ref: "concepts.md#truetime-and-external-consistency-spanner"
  - id: distributed-sql-newsql-020
    difficulty: beginner
    tags: [hlc, cockroachdb, yugabytedb, clocks]
    question: |
      Why do CockroachDB and YugabyteDB use Hybrid Logical Clocks (HLC) instead of
      something like TrueTime?
    options:
      - "HLC is strictly faster than atomic clocks in every deployment, so it is the obvious default for any workload"
      - "HLC eliminates the need for any physical clock at all, deriving global order purely from message passing"
      - "They copied the HLC design directly from Amazon Dynamo, which used it for quorum conflict resolution"
      - "They run on commodity cloud hardware without GPS/atomic clocks, so they combine an NTP-synced physical time with a logical counter"
    answer: 3
    explanation: |
      CockroachDB and YugabyteDB target commodity hardware in any cloud, where GPS/
      atomic clocks are unavailable. HLC combines a physical wall-clock component (kept
      loosely in sync by NTP) with a logical counter that breaks ties and preserves
      causality, giving monotonic, causally-consistent timestamps without special hardware.
    ref: "concepts.md#hybrid-logical-clocks-cockroachdb-yugabytedb--no-truetime"
  - id: distributed-sql-newsql-021
    difficulty: intermediate
    tags: [hlc, causality, logical-clock]
    question: |
      In a Hybrid Logical Clock, what does a node do to its clock when it receives a
      message carrying an HLC timestamp?
    options:
      - "It ignores the received timestamp entirely and continues using only its own local wall-clock reading for every event"
      - "It resets its clock to zero and restarts the logical counter, renumbering every subsequent event from scratch"
      - "It advances its clock to max(local, received), incrementing the logical counter, so causally-related events get increasing timestamps"
      - "It always takes the smaller of the two timestamps, so cluster clocks steadily converge downward toward the minimum"
    answer: 2
    explanation: |
      On receiving a message the node advances its HLC to max(local, received) and bumps
      the logical counter, ensuring causally-related events always get increasing
      timestamps even if physical clocks drift. This preserves the happens-before
      relationship without a global clock.
    ref: "concepts.md#hybrid-logical-clocks-cockroachdb-yugabytedb--no-truetime"
  - id: distributed-sql-newsql-022
    difficulty: advanced
    tags: [cockroachdb, max-offset, uncertainty-restart, reads]
    question: |
      CockroachDB assumes a maximum clock skew (default 500 ms via `--max-offset`).
      How does it handle a read that encounters a value whose timestamp falls inside
      the reader's uncertainty window?
    options:
      - "It returns the value immediately and ignores the uncertainty window, trusting the local clock to already be perfectly synchronized"
      - "It restarts the transaction at a higher timestamp (or advances the read timestamp) — an 'uncertainty restart' — because it can't tell if the write is before or after the read"
      - "It crashes the whole cluster to preserve safety, forcing an operator to manually restart every node before any read can proceed"
      - "It blocks the read indefinitely until every node's clock re-synchronizes back below the configured maximum offset threshold"
    answer: 1
    explanation: |
      Within the max-offset window, a read that sees a value timestamped inside its
      uncertainty interval cannot order that write relative to itself, so the
      transaction performs an uncertainty restart at a higher timestamp. This is
      CockroachDB's analog to Spanner's commit-wait: it pays the uncertainty cost on the
      read side as occasional retries rather than on every commit.
    ref: "concepts.md#hybrid-logical-clocks-cockroachdb-yugabytedb--no-truetime"
  - id: distributed-sql-newsql-023
    difficulty: advanced
    tags: [cockroachdb, max-offset, safety, ntp]
    question: |
      What happens in CockroachDB if a node's physical clock drifts beyond the
      configured `--max-offset`, and what does that imply operationally?
    options:
      - "The node is forcibly crashed to protect correctness, which is why NTP/PTP clock hygiene matters"
      - "The node keeps running but silently begins returning stale reads until an operator intervenes to fix it"
      - "Nothing happens — max-offset is only an advisory hint with no runtime enforcement whatsoever"
      - "The whole cluster automatically switches to eventual consistency until the drifting clock recovers"
    answer: 0
    explanation: |
      A node that detects its clock has drifted beyond max-offset self-terminates
      (crashes) to protect the serializability guarantee, since HLC has no explicit
      uncertainty interval to fall back on. If drift exceeds max-offset without being
      noticed in time, correctness can be violated — hence NTP/PTP hygiene matters.
    ref: "concepts.md#hybrid-logical-clocks-cockroachdb-yugabytedb--no-truetime"
  - id: distributed-sql-newsql-024
    difficulty: beginner
    tags: [distributed-transactions, 2pc, sharding]
    question: |
      Why does a transaction that touches keys in different ranges/shards need a
      distributed commit protocol like two-phase commit?
    options:
      - "Because the SQL standard explicitly forbids committing a single-range transaction without a distributed coordinator"
      - "Because two-phase commit is inherently faster than a single-range commit, so it is preferred even within one shard"
      - "Because every read in the system must first consult a lock table hosted on one central coordinator server"
      - "Because those keys likely have different Raft leaders on different nodes, and the whole transaction must still be atomic across them"
    answer: 3
    explanation: |
      Keys in different ranges are led by different Raft groups on potentially different
      nodes. To keep a multi-range transaction atomic (all-or-nothing), the system needs
      a distributed commit protocol — two-phase commit — coordinating the participant
      ranges.
    ref: "concepts.md#distributed-transactions-2pc-layered-on-consensus"
  - id: distributed-sql-newsql-025
    difficulty: intermediate
    tags: [distributed-transactions, 2pc, write-intents, cockroachdb]
    question: |
      In CockroachDB's distributed transaction, what is a "write intent"?
    options:
      - "A provisional value tagged with the transaction ID and a pointer to its transaction record, itself Raft-replicated so it survives a node crash"
      - "A read lock held solely on the coordinator node and released the instant any single participant acknowledges the prepare phase"
      - "A non-binding hint passed to the query optimizer describing the writes the transaction expects to perform later"
      - "A cached copy of the row kept on the client so later statements can re-read it without another round-trip"
    answer: 0
    explanation: |
      A write intent is a provisional write laid down during the prepare phase, tagged
      with the transaction ID and a pointer to the transaction record. Because each
      intent is itself Raft-replicated, it survives node crashes — a key part of why
      this 2PC variant is non-blocking.
    ref: "concepts.md#distributed-transactions-2pc-layered-on-consensus"
  - id: distributed-sql-newsql-026
    difficulty: intermediate
    tags: [distributed-transactions, 2pc, commit-point, transaction-record]
    question: |
      In this 2PC-over-consensus design, what single action constitutes the atomic
      commit point of a multi-shard transaction?
    options:
      - "Fsyncing every participant's data file to durable disk simultaneously, so all shards persist their writes in one step"
      - "Flipping a single transaction record to COMMITTED in one atomic, Raft-replicated write; intents are then resolved asynchronously"
      - "The client receiving TCP-level ACKs from every participant shard, confirming each one durably committed on its own"
      - "Deleting all provisional write intents across the shards first, which is what atomically reveals the committed values"
    answer: 1
    explanation: |
      Once all participants vote COMMIT, the coordinator flips one transaction record to
      COMMITTED via a single atomic Raft-replicated write. That flip is the linearization
      point — the transaction is committed at that instant. The provisional intents are
      then resolved into real values asynchronously.
    ref: "concepts.md#distributed-transactions-2pc-layered-on-consensus"
  - id: distributed-sql-newsql-027
    difficulty: advanced
    tags: [distributed-transactions, 2pc, blocking, coordinator]
    question: |
      The classic critique is that "2PC is blocking." Why does distributed SQL's
      version avoid the blocking failure mode?
    options:
      - "It uses a three-phase commit protocol instead of two-phase commit, adding a pre-commit round that removes the blocking window"
      - "It never designates any coordinator at all, so participants negotiate the outcome peer-to-peer and no single crash can stall them"
      - "The coordinator state (transaction record) and every intent are replicated by consensus, so a crashed node is replaced by a new leader that drives the transaction to completion"
      - "It holds no locks whatsoever during the prepare phase, so a coordinator crash leaves participants free to abort unilaterally"
    answer: 2
    explanation: |
      Textbook 2PC blocks because a single non-replicated coordinator crashing after
      PREPARE leaves participants holding locks forever. Distributed SQL replicates the
      coordinator's state and the participants via Raft/Paxos, so a new leader can always
      recover and finish the transaction. This is exactly "2PC over Paxos groups" from
      the Spanner paper.
    ref: "concepts.md#distributed-transactions-2pc-layered-on-consensus"
  - id: distributed-sql-newsql-028
    difficulty: intermediate
    tags: [distributed-transactions, 2pc, ddia, interview]
    question: |
      A candidate says "DDIA says avoid 2PC, so Spanner and CockroachDB must not use
      it." What is the correct reconciliation?
    options:
      - "The candidate is right; those systems replicate with Paxos or Raft instead of 2PC and never combine the two techniques at all"
      - "DDIA is simply mistaken about 2PC here, since modern consensus protocols have rendered every classic objection to it obsolete"
      - "Spanner internally relies on 2PC while CockroachDB avoids it entirely by ordering all its transactions through a global sequencer"
      - "Both are true — the critique targets 2PC with a non-replicated coordinator; replicating the coordinator and participants with Paxos/Raft is the fix these systems use"
    answer: 3
    explanation: |
      The DDIA critique is about 2PC with a single, non-replicated coordinator. Spanner
      and CockroachDB do use 2PC — but layered over Paxos/Raft groups so the coordinator
      and participants are fault-tolerant. Both statements are compatible once you note
      the coordinator is replicated.
    ref: "concepts.md#distributed-transactions-2pc-layered-on-consensus"
  - id: distributed-sql-newsql-029
    difficulty: beginner
    tags: [latency, cross-region, consensus, physics]
    question: |
      What is the fundamental reason a strongly-consistent write in a
      geo-distributed SQL cluster is slow?
    options:
      - "The SQL parser runs remotely and must ship each query token across the WAN before the write can begin executing"
      - "Disks in other regions spin measurably slower, so the durable fsync of each replicated write is what dominates commit time"
      - "Every strongly-consistent write needs at least one consensus round-trip to a majority of replicas, and if those replicas span regions it is a WAN round-trip"
      - "TLS encryption and decryption of every replicated packet dominates the latency, swamping any network propagation delay"
    answer: 2
    explanation: |
      Committing a Raft/Paxos entry requires a majority ack. If replicas are spread
      across regions, the leader must wait for at least one distant region, so the commit
      is floored by inter-region network latency (tens of ms) regardless of disk speed.
    ref: "concepts.md#why-cross-region-commit-is-slow-the-latency-cost-of-strong-consistency"
  - id: distributed-sql-newsql-030
    difficulty: intermediate
    tags: [latency, cross-region, follower-reads, geo-partitioning]
    question: |
      Your multi-region CockroachDB cluster has high write latency because commits
      cross regions. Which mitigation actually reduces the physical round-trips for
      the common case?
    options:
      - "Increase the replication factor to 7 replicas so more nodes acknowledge each write, shrinking the effective commit round-trip"
      - "Geo-partition data (e.g. REGIONAL BY ROW) so a row's replicas and leaseholder live in the region where it's accessed, keeping most commits within one region"
      - "Disable MVCC entirely so writes overwrite in place and no longer need to be versioned across the distant regional replicas"
      - "Switch the default isolation level to READ COMMITTED, which removes all cross-region consensus hops for reads and writes"
    answer: 1
    explanation: |
      Geo-partitioning / data domiciling (CockroachDB REGIONAL BY ROW, Spanner placement)
      pins a row's replicas and leaseholder to the region that accesses it, so the common
      write commits within one region and avoids WAN consensus. Adding replicas would
      increase, not decrease, coordination; disabling MVCC or lowering isolation does not
      remove the cross-region hop for globally-replicated rows.
    ref: "concepts.md#why-cross-region-commit-is-slow-the-latency-cost-of-strong-consistency"
  - id: distributed-sql-newsql-031
    difficulty: intermediate
    tags: [latency, follower-reads, stale-reads]
    question: |
      What do "follower reads" / "stale reads" trade to gain local, low-latency reads
      in a multi-region cluster?
    options:
      - "They trade a small amount of staleness (reading a slightly past timestamp from a nearby replica) to avoid a cross-region leaseholder round-trip"
      - "They trade away write durability for speed, since the nearby replica may acknowledge a read before the data is fully persisted"
      - "They trade the correctness of concurrent writes for read speed, letting readers observe partially-applied transactions"
      - "They require giving up standard SQL support, forcing the application onto a key-value interface for those local reads"
    answer: 0
    explanation: |
      Follower/stale reads serve data from the nearest replica at a slightly past,
      safe timestamp (CockroachDB AS OF SYSTEM TIME follower_read_timestamp(); Spanner
      bounded-staleness reads). You accept a few seconds of staleness in exchange for a
      local read with no consensus round-trip — often the biggest multi-region latency win.
    ref: "concepts.md#why-cross-region-commit-is-slow-the-latency-cost-of-strong-consistency"
  - id: distributed-sql-newsql-032
    difficulty: advanced
    tags: [latency, multi-shard, 2pc, compounding]
    question: |
      Why can a multi-shard read-write transaction in a geo-distributed cluster be
      substantially slower than a single-shard one?
    options:
      - "Multi-shard transactions are always scheduled onto a pool of slower background nodes reserved for coordination-heavy work"
      - "The SQL optimizer automatically disables all secondary indexes for multi-shard queries, forcing a full scan on every shard"
      - "Multi-shard transactions bypass MVCC entirely and take a coarse table-level lock spanning every shard for their full duration"
      - "It adds a 2PC round (prepare across shards, then commit) on top of per-shard consensus, so several consensus round-trips compound; Spanner also pays commit-wait"
    answer: 3
    explanation: |
      A multi-shard transaction layers 2PC (prepare, then commit) on top of the
      per-shard consensus round-trips, so the latencies compound across shards and
      regions. Spanner additionally pays commit-wait (~2ε) on read-write transactions.
    ref: "concepts.md#why-cross-region-commit-is-slow-the-latency-cost-of-strong-consistency"
  - id: distributed-sql-newsql-033
    difficulty: beginner
    tags: [consistency, serializability, isolation]
    question: |
      What does serializability, as an isolation property, guarantee?
    options:
      - "That the result of executing concurrent transactions equals some serial order of them (it says nothing about matching real time)"
      - "That reads always return the single most recent write in strict real-time order across every node in the cluster"
      - "That transactions physically execute one at a time on a single dedicated core, never actually running in parallel"
      - "That every write is synchronously replicated to all nodes before the committing transaction is allowed to return"
    answer: 0
    explanation: |
      Serializability guarantees the outcome is equivalent to some serial (one-at-a-time)
      execution of the transactions. It is a transaction-isolation property and does not
      require that serial order to match real-world time — that stronger property is
      strict serializability.
    ref: "concepts.md#consistency-guarantees-serializable-vs-linearizable-vs-external-consistency"
  - id: distributed-sql-newsql-034
    difficulty: intermediate
    tags: [consistency, linearizability, single-object]
    question: |
      How does linearizability differ from serializability?
    options:
      - "They are simply two interchangeable names for the exact same underlying consistency property, differing only by community"
      - "Linearizability is a single-object recency/real-time property; serializability is a multi-object transaction-equivalence property"
      - "Linearizability constrains only read operations while serializability constrains only write operations, so they never overlap"
      - "Serializability is strictly weaker than linearizability and, like it, applies only to a single isolated object or register"
    answer: 1
    explanation: |
      Linearizability is a consistency property about a single object/register: each
      operation appears to take effect atomically between its invocation and response,
      and reads see the latest write in real time. Serializability is about multiple
      transactions being equivalent to some serial order. They are orthogonal; you need
      both (strict serializability) for the intuitive "one database, real-time order."
    ref: "concepts.md#consistency-guarantees-serializable-vs-linearizable-vs-external-consistency"
  - id: distributed-sql-newsql-035
    difficulty: advanced
    tags: [consistency, snapshot-isolation, write-skew]
    question: |
      In the table of guarantees, which one permits write skew and does NOT respect
      real-time order?
    options:
      - "Strict serializable / external consistency"
      - "Linearizable"
      - "Snapshot isolation"
      - "Serializable"
    answer: 2
    explanation: |
      Snapshot isolation allows the write-skew anomaly (two transactions read an
      overlapping set, each updates a disjoint part, and together they violate an
      invariant) and does not guarantee real-time ordering. Serializable forbids write
      skew; linearizable and strict serializable additionally respect real-time order.
    ref: "concepts.md#consistency-guarantees-serializable-vs-linearizable-vs-external-consistency"
  - id: distributed-sql-newsql-036
    difficulty: intermediate
    tags: [consistency, defaults, cockroachdb, isolation]
    question: |
      What has historically been CockroachDB's default (and until v23.2, only)
      transaction isolation level?
    options:
      - "READ COMMITTED"
      - "REPEATABLE READ"
      - "READ UNCOMMITTED"
      - "SERIALIZABLE"
    answer: 3
    explanation: |
      CockroachDB defaults to SERIALIZABLE and until v23.2 it was the only isolation
      level offered; v23.2+ adds an opt-in READ COMMITTED. This is stronger than the
      legacy single-node defaults (PostgreSQL READ COMMITTED, MySQL/InnoDB REPEATABLE READ).
    ref: "concepts.md#consistency-guarantees-serializable-vs-linearizable-vs-external-consistency"
  - id: distributed-sql-newsql-037
    difficulty: intermediate
    tags: [consistency, defaults, postgres, mysql, contrast]
    question: |
      What are the default isolation levels of classic single-node PostgreSQL and
      MySQL/InnoDB, respectively?
    options:
      - "SERIALIZABLE (PostgreSQL) and SERIALIZABLE (MySQL/InnoDB)"
      - "REPEATABLE READ (PostgreSQL) and READ COMMITTED (MySQL/InnoDB)"
      - "READ COMMITTED (PostgreSQL) and REPEATABLE READ (MySQL/InnoDB)"
      - "READ UNCOMMITTED (PostgreSQL) and READ UNCOMMITTED (MySQL/InnoDB)"
    answer: 2
    explanation: |
      PostgreSQL defaults to READ COMMITTED; MySQL/InnoDB defaults to REPEATABLE READ.
      Distributed-SQL systems tend to push the default stronger (toward SERIALIZABLE)
      than these legacy engines — a common point of confusion in interviews.
    ref: "concepts.md#consistency-guarantees-serializable-vs-linearizable-vs-external-consistency"
  - id: distributed-sql-newsql-038
    difficulty: advanced
    tags: [consistency, strict-serializable, external-consistency, spanner]
    question: |
      Which combination is equivalent to Spanner's "external consistency"?
    options:
      - "Snapshot isolation plus eventual consistency: readers see a consistent past snapshot while replicas converge lazily in the background"
      - "Serializable plus linearizable (strict serializability): transactions are serializable and the serial order respects real-time order"
      - "Read committed plus monotonic reads: dirty reads are barred and a session never sees time move backward, which together bound recency"
      - "Linearizable reads with no transaction isolation, so single-key reads are real-time fresh but multi-key writes may interleave freely"
    answer: 1
    explanation: |
      Strict serializability = serializable + linearizable: transactions are equivalent
      to a serial order AND that order respects real-time order across the whole
      database. Spanner calls this external consistency, and it is the strongest practical
      guarantee.
    ref: "concepts.md#consistency-guarantees-serializable-vs-linearizable-vs-external-consistency"
  - id: distributed-sql-newsql-039
    difficulty: beginner
    tags: [mvcc, reads, writes]
    question: |
      How does MVCC (multi-version concurrency control) let distributed SQL serve
      lock-free consistent reads?
    options:
      - "By creating new versioned values tagged with a commit timestamp instead of overwriting in place, so readers never block writers and vice versa; a read at time t sees the latest version with commit timestamp <= t"
      - "By taking a shared table-level lock on every read so no writer can modify any row while any reader is still scanning the table"
      - "By caching the entire dataset in memory on each client so reads are served locally and never have to touch the replicated storage layer"
      - "By disallowing concurrent transactions entirely and forcing every statement through a single global serialization queue before it runs"
    answer: 0
    explanation: |
      MVCC writes new timestamped versions rather than overwriting, so readers never
      block writers and writers never block readers. A read at timestamp t returns the
      latest version whose commit timestamp is <= t, enabling consistent snapshot reads
      and time-travel queries.
    ref: "concepts.md#mvcc-and-reads-in-distributed-sql"
  - id: distributed-sql-newsql-040
    difficulty: intermediate
    tags: [mvcc, time-travel, as-of-system-time]
    question: |
      What feature does MVCC's timestamped versioning enable in CockroachDB via
      `AS OF SYSTEM TIME`?
    options:
      - "Automatic online schema migration that rewrites every historical row version in place"
      - "Transparent encryption of data at rest keyed off each version's stored commit timestamp"
      - "Automatic secondary-index creation derived by scanning the retained older row versions"
      - "Time-travel / historical reads at a past timestamp (within the GC window)"
    answer: 3
    explanation: |
      Because MVCC retains prior versions tagged by commit timestamp, you can read the
      database as of a past timestamp (AS OF SYSTEM TIME), i.e. time-travel queries —
      but only within the GC TTL window before old versions are reclaimed.
    ref: "concepts.md#mvcc-and-reads-in-distributed-sql"
  - id: distributed-sql-newsql-041
    difficulty: advanced
    tags: [mvcc, gc, ttl, bloat]
    question: |
      What limits how far back an `AS OF SYSTEM TIME` read can go, and what
      operational problem mirrors PostgreSQL's vacuum concerns?
    options:
      - "The GC TTL (CockroachDB default historically ~25 hours) reclaims old MVCC versions; long-running transactions and GC backlogs cause storage bloat"
      - "The number of CPU cores available for scans; there is no version cleanup, so history is bounded only by compute throughput"
      - "The replication factor; a higher factor retains proportionally more old versions, so 5 replicas gives roughly 5x the history of 3"
      - "The network MTU size, which caps how large a single historical read response can be and thus how far back a query may reach"
    answer: 0
    explanation: |
      Old MVCC versions are garbage-collected after a GC TTL (CockroachDB default
      historically ~25 hours), so time-travel reads only work within that window.
      Long-running transactions and large GC backlogs cause version bloat, analogous to
      PostgreSQL's dead-tuple/vacuum concerns.
    ref: "concepts.md#mvcc-and-reads-in-distributed-sql"
  - id: distributed-sql-newsql-042
    difficulty: intermediate
    tags: [mvcc, leaseholder-reads, follower-reads]
    question: |
      Which statement correctly contrasts leaseholder reads with follower reads in
      an MVCC distributed-SQL system?
    options:
      - "Leaseholder reads serve a lagging snapshot because the lease is refreshed asynchronously, while follower reads are always current at the live commit timestamp"
      - "Leaseholder reads are strongly consistent (current time, no consensus round-trip needed because the lease guarantees all committed writes); follower reads are slightly stale but local"
      - "Both leaseholder and follower reads require a full Raft consensus round-trip per read to confirm the value is committed before returning it"
      - "Follower reads are the linearizable default, and the leaseholder is consulted only as a slower fallback when a nearby follower is unavailable"
    answer: 1
    explanation: |
      The leaseholder serves strongly-consistent reads at current time without a
      consensus round-trip because its lease guarantees it has all committed writes for
      the range. Follower reads read a slightly older safe timestamp from the nearest
      replica, trading recency for locality.
    ref: "concepts.md#mvcc-and-reads-in-distributed-sql"
  - id: distributed-sql-newsql-043
    difficulty: intermediate
    tags: [calvin, deterministic, sequencer]
    question: |
      How does Calvin achieve distributed ACID transactions without two-phase commit?
    options:
      - "It swaps two-phase commit for a three-phase commit protocol whose extra pre-commit round removes the blocking window while still voting per shard"
      - "It gives up serializability entirely and settles for snapshot isolation, accepting write skew as the price of dropping the commit vote"
      - "A sequencing layer orders all incoming transactions into a global input log up front; deterministic execution then lets replicas replay the log independently with no commit-time coordination"
      - "It funnels every transaction through a single global execution node, so a network-wide serial order emerges without any cross-shard voting"
    answer: 2
    explanation: |
      Calvin decides the serial order up front via a sequencing layer that agrees on a
      global input log. Because execution is deterministic, every replica computes the
      same result from the same ordered inputs, so no cross-shard commit vote (2PC) is
      needed — the agreed order plus determinism prevents divergence.
    ref: "concepts.md#the-deterministic-alternative-calvin"
  - id: distributed-sql-newsql-044
    difficulty: advanced
    tags: [calvin, read-write-set, trade-off]
    question: |
      What is the main programming-model trade-off of Calvin's deterministic approach?
    options:
      - "It cannot survive node failures, because a single replica falling behind in the log stalls the whole deterministic schedule until it recovers"
      - "It cannot provide serializability and instead tops out at read-committed, since deterministic replay only preserves ordering for single-key operations"
      - "It requires TrueTime-style GPS and atomic clocks in every datacenter to keep each replica's deterministic execution aligned to the same commit timestamp"
      - "It needs the transaction's read/write set known in advance to schedule locks deterministically, making interactive/conversational transactions awkward (may need a reconnaissance pre-read)"
    answer: 3
    explanation: |
      To schedule locks deterministically, Calvin must know a transaction's read/write
      set ahead of time. Interactive transactions where a later statement depends on an
      earlier read don't fit naturally and may require a reconnaissance pre-read phase.
      In exchange, Calvin avoids 2PC latency and handles high-contention workloads well.
    ref: "concepts.md#the-deterministic-alternative-calvin"
  - id: distributed-sql-newsql-045
    difficulty: intermediate
    tags: [calvin, spanner, ordering, comparison]
    question: |
      What is the core conceptual difference between Spanner/CockroachDB-style
      ordering and Calvin-style ordering?
    options:
      - "Spanner orders transactions eagerly through a global sequencer while Calvin defers ordering until commit time using synchronized physical clocks"
      - "Both order transactions identically through a shared sequencing log, and only the underlying storage engine and replication protocol differ"
      - "Spanner/CockroachDB order transactions lazily at commit (timestamps + 2PC); Calvin orders them eagerly up front with a deterministic sequencer"
      - "Neither system guarantees any total ordering, so each relies on the application to detect and resolve conflicting transaction outcomes"
    answer: 2
    explanation: |
      Spanner and CockroachDB assign order lazily at commit time using clocks (TrueTime/
      HLC) and 2PC; Calvin assigns order eagerly up front with a deterministic sequencer.
      Calvin removes 2PC latency but pays with a less flexible programming model — the
      classic Abadi Spanner-vs-Calvin debate.
    ref: "concepts.md#the-deterministic-alternative-calvin"
  - id: distributed-sql-newsql-046
    difficulty: beginner
    tags: [vitess, sharded-mysql, comparison]
    question: |
      What best describes Vitess relative to distributed SQL like CockroachDB or
      Spanner?
    options:
      - "A single logical database with native Raft-based consensus replication built directly into its own custom storage engine"
      - "A sharding/routing layer on top of many independent MySQL instances, routing queries via a VSchema and vindexes"
      - "An in-memory key-value cache that fronts a relational database and serves hot rows to cut read latency"
      - "A columnar analytics warehouse optimized for large scans and aggregations rather than transactional row-level access"
    answer: 1
    explanation: |
      Vitess is a sharding/routing middleware over many independent MySQL instances. It
      routes queries to the right shard(s) using a VSchema and vindexes and manages
      resharding, but each shard is a normal MySQL primary+replicas. Distributed SQL, by
      contrast, is one logical database whose consensus and rebalancing are native to the
      engine.
    ref: "concepts.md#distributed-sql-vs-sharded-mysqlvitess"
  - id: distributed-sql-newsql-047
    difficulty: intermediate
    tags: [vitess, cross-shard, 2pc, mysql-replication]
    question: |
      Which pair of statements correctly contrasts Vitess with distributed SQL on
      cross-shard transactions and replication?
    options:
      - "In Vitess cross-shard transactions are limited (2PC is opt-in and discouraged) and replication is per-shard MySQL; distributed SQL offers native serializable cross-shard transactions with per-range Raft/Paxos consensus"
      - "Vitess offers native serializable cross-shard transactions out of the box, while distributed SQL confines every transaction to a single range and cannot span shards atomically"
      - "Both Vitess and distributed SQL use per-range Raft consensus to coordinate cross-shard transactions, so their commit paths are effectively identical"
      - "Vitess resharding is automatic and continuous, whereas distributed SQL resharding is a manual DBA workflow that requires an offline dump-and-reload window"
    answer: 0
    explanation: |
      In Vitess cross-shard transactions are limited and 2PC is opt-in and discouraged;
      the app is expected to stay within a shard. Replication is per-shard MySQL (semi-
      sync/async). Distributed SQL provides native, first-class serializable cross-shard
      transactions with per-range Raft/Paxos consensus and automatic, continuous resharding.
    ref: "concepts.md#distributed-sql-vs-sharded-mysqlvitess"
  - id: distributed-sql-newsql-048
    difficulty: advanced
    tags: [vitess, distributed-sql, decision, trade-off]
    question: |
      When is Vitess a better fit than distributed SQL, per the trade-off summary?
    options:
      - "When you need transparent cross-shard ACID transactions and fully automatic geo-distribution of data across regions with no app changes"
      - "When you need serializable global transactions that span many shards with zero application awareness of how the data is partitioned"
      - "When you want the newest purpose-built distributed engine regardless of ecosystem maturity and are willing to leave the MySQL toolchain behind"
      - "When you already run MySQL at scale and can shard cleanly by a key (e.g. tenant/user), keeping most transactions within a shard"
    answer: 3
    explanation: |
      Vitess scales the plumbing around MySQL while asking the application to mostly stay
      within a shard for transactions, so it fits teams already running MySQL at scale
      that shard cleanly by a key like tenant or user. Choose distributed SQL when you
      need transparent cross-shard ACID and automatic geo-distribution.
    ref: "concepts.md#distributed-sql-vs-sharded-mysqlvitess"
  - id: distributed-sql-newsql-049
    difficulty: intermediate
    tags: [yugabytedb, sharding, defaults]
    question: |
      Which statement about YugabyteDB's default partitioning is correct?
    options:
      - "It defaults to hash sharding, which spreads writes evenly but does not preserve key order"
      - "It defaults to range sharding just like Spanner and CockroachDB, keeping keys in sorted order so range scans stay contiguous"
      - "It has no automatic partitioning at all, so the entire keyspace lives on a single node until an operator splits it by hand"
      - "It uses application-managed sharding only, requiring the client to compute the target shard for every read and write itself"
    answer: 0
    explanation: |
      YugabyteDB defaults to hash sharding, which distributes writes evenly and avoids
      monotonic-key hotspots but destroys key order (range scans fan out). CockroachDB
      and Spanner default to range sharding; CockroachDB offers hash-sharded indexes as
      an opt-in.
    ref: "concepts.md#automatic-sharding-ranges-vs-hashing-and-rebalancing"
  - id: distributed-sql-newsql-050
    difficulty: beginner
    tags: [key-takeaway, latency, physics]
    question: |
      What is the honest one-line summary of what NewSQL / distributed SQL buys you?
    options:
      - "Free low-latency global writes with no coordination, because the engine hides all cross-region round-trips behind a local write cache"
      - "SQL + serializable ACID at scale, but a globally-replicated write's latency is floored by consensus round-trips (physics) between regions"
      - "Eventual consistency with unlimited write throughput and zero latency, since replicas reconcile lazily in the background after each write"
      - "The ability to abandon replication entirely and rely on a single authoritative node while still tolerating that node's failure"
    answer: 1
    explanation: |
      NewSQL gives you SQL + ACID (serializable) at horizontal scale with automatic fault
      tolerance. It does not repeal physics: a globally-replicated row's write latency is
      floored by the consensus round-trips between regions. You engineer locality (geo-
      partitioning, follower reads); you don't wish the latency away.
    ref: "concepts.md#why-cross-region-commit-is-slow-the-latency-cost-of-strong-consistency"
