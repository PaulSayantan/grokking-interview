topic: "Messaging Reliability & Distributed Messaging Patterns"
domain: messaging-databases
topic_slug: messaging-reliability-patterns
version: 1
questions:
  - id: messaging-reliability-patterns-001
    difficulty: beginner
    tags: [delivery-semantics, at-least-once]
    question: |
      A consumer acknowledges (commits) a message only AFTER it finishes
      processing it. If the consumer crashes mid-processing before acking, what
      delivery semantic does this give?
    options:
      - "At-least-once (the message is redelivered and may be processed twice)"
      - "At-most-once (the message is lost)"
      - "Exactly-once (the broker deduplicates automatically)"
      - "No delivery guarantee at all"
    answer: 0
    explanation: |
      Acking after processing means an unacked message is redelivered on crash.
      The work may have partially completed, so it can be processed again →
      at-least-once, with possible duplicates.
    ref: "concepts.md#delivery-semantics-at-most-once-at-least-once-exactly-once"

  - id: messaging-reliability-patterns-002
    difficulty: beginner
    tags: [delivery-semantics, at-most-once]
    question: |
      Which acknowledgement strategy produces AT-MOST-ONCE semantics?
    options:
      - "Ack after the side effects are durably committed"
      - "Never ack; let the broker infer completion"
      - "Ack before processing (or auto-commit the offset early)"
      - "Ack twice to be safe"
    answer: 2
    explanation: |
      Acking before processing means a crash during processing leaves the
      message already acked, so it is never redelivered — at-most-once, with
      possible loss.
    ref: "concepts.md#delivery-semantics-at-most-once-at-least-once-exactly-once"

  - id: messaging-reliability-patterns-003
    difficulty: intermediate
    tags: [delivery-semantics, exactly-once, two-generals]
    question: |
      Why is true exactly-once *delivery* fundamentally impossible over an
      unreliable network?
    options:
      - "Brokers are too slow to track message state"
      - "TCP does not support acknowledgements"
      - "Encryption prevents deduplication"
      - "A sender can never know whether its message or the receiver's ack was lost, so it must either risk loss or risk a duplicate"
    answer: 3
    explanation: |
      This is the Two Generals problem: lost messages and lost acks are
      indistinguishable to the sender, so it must choose between giving up
      (loss) or retrying (duplicate). No acking scheme removes the ambiguity.
    ref: "concepts.md#delivery-semantics-at-most-once-at-least-once-exactly-once"

  - id: messaging-reliability-patterns-004
    difficulty: beginner
    tags: [delivery-semantics, defaults]
    question: |
      For most business systems, which combination is the pragmatic default?
    options:
      - "At-most-once delivery with no dedup"
      - "At-least-once delivery plus idempotent consumers"
      - "Two-phase commit across every service"
      - "Exactly-once delivery guaranteed by the network"
    answer: 1
    explanation: |
      Since exactly-once delivery is unattainable, systems standardize on
      at-least-once (retry until acked) and make consumers idempotent so
      duplicates cause no additional effect — a.k.a. effectively-once.
    ref: "concepts.md#delivery-semantics-at-most-once-at-least-once-exactly-once"

  - id: messaging-reliability-patterns-005
    difficulty: intermediate
    tags: [delivery-semantics, at-most-once, use-case]
    question: |
      Which workload is the best candidate for deliberately choosing
      at-most-once semantics?
    options:
      - "High-volume metric/telemetry samples where occasional loss is acceptable"
      - "Payment capture events"
      - "Order-created events that trigger fulfilment"
      - "Account balance updates"
    answer: 0
    explanation: |
      At-most-once trades possible loss for simplicity/throughput. It is only
      acceptable where losing an occasional message doesn't matter, such as
      sampled metrics — never for money or fulfilment.
    ref: "concepts.md#delivery-semantics-at-most-once-at-least-once-exactly-once"

  - id: messaging-reliability-patterns-006
    difficulty: intermediate
    tags: [effectively-once, definition]
    question: |
      "Effectively-once" processing is best described as:
    options:
      - "The network delivering each message exactly one time"
      - "At-most-once delivery with retries disabled"
      - "At-least-once delivery combined with idempotent (or transactionally deduplicated) processing"
      - "A broker feature that removes all duplicates before delivery"
    answer: 2
    explanation: |
      Effectively-once = at-least-once delivery + processing that is idempotent
      or deduplicated, so duplicate deliveries produce no additional observable
      effect. It is a processing property, not a delivery property.
    ref: "concepts.md#effectively-once-and-why-exactly-once-is-really-idempotency"

  - id: messaging-reliability-patterns-007
    difficulty: advanced
    tags: [kafka, exactly-once, eos]
    question: |
      Kafka's exactly-once semantics (EOS) genuinely apply to which scenario?
    options:
      - "Any consumer that writes to an external database"
      - "Sending emails from a Kafka consumer"
      - "Calling a third-party payment API from a stream processor"
      - "A consume-transform-produce loop entirely within Kafka, using the idempotent producer plus transactions that atomically commit output records and input offsets"
    answer: 3
    explanation: |
      Kafka EOS covers Kafka-internal stream processing: idempotent producer
      (per-partition sequence numbers) + transactions that atomically write
      outputs and commit input offsets. Once a side effect leaves Kafka, you're
      back to at-least-once.
    ref: "concepts.md#effectively-once-and-why-exactly-once-is-really-idempotency"

  - id: messaging-reliability-patterns-008
    difficulty: intermediate
    tags: [kafka, idempotent-producer, gotcha]
    question: |
      A developer sets enable.idempotence=true on the Kafka producer and claims
      "our consumer's database writes are now exactly-once." What is wrong?
    options:
      - "Producer idempotence only dedups producer retries to a partition; consumer-side DB idempotency is a separate application concern"
      - "Nothing; producer idempotence makes DB writes idempotent"
      - "enable.idempotence disables retries, so writes can be lost"
      - "It only works if acks=0"
    answer: 0
    explanation: |
      The idempotent producer dedups a producer's own retries appending to a
      partition. It does nothing for a consumer's external database writes,
      which must be made idempotent separately (dedup store / upsert).
    ref: "concepts.md#effectively-once-and-why-exactly-once-is-really-idempotency"

  - id: messaging-reliability-patterns-009
    difficulty: beginner
    tags: [idempotency, definition]
    question: |
      An idempotent consumer is one that:
    options:
      - "Processes each message faster on the second attempt"
      - "Produces the same end state whether a message is processed once or many times"
      - "Never receives duplicate messages"
      - "Acknowledges messages before processing them"
    answer: 1
    explanation: |
      Idempotency means repeated application yields the same result. An
      idempotent consumer tolerates duplicate deliveries without additional
      observable effect.
    ref: "concepts.md#idempotent-consumers-and-idempotency-keys"

  - id: messaging-reliability-patterns-010
    difficulty: intermediate
    tags: [idempotency, sql]
    question: |
      Which SQL statement is naturally idempotent (safe to apply twice)?
    options:
      - "INSERT INTO account_state (id, status) VALUES ('a1','CLOSED') ON CONFLICT (id) DO UPDATE SET status='CLOSED';"
      - "UPDATE accounts SET balance = balance - 50 WHERE id = 'a1';"
      - "INSERT INTO ledger (amount) VALUES (50);"
      - "UPDATE counters SET n = n + 1 WHERE id = 'a1';"
    answer: 0
    explanation: |
      The upsert sets an absolute value and can run any number of times with the
      same result. The others are deltas or unconditional inserts that duplicate
      effects when applied twice.
    ref: "concepts.md#idempotent-consumers-and-idempotency-keys"

  - id: messaging-reliability-patterns-011
    difficulty: advanced
    tags: [idempotency, dedup, transaction]
    question: |
      Using an idempotency-key dedup table, why must the dedup INSERT and the
      business side effect be in the SAME transaction?
    options:
      - "To make the query faster"
      - "Because separate transactions are not allowed in SQL"
      - "So that a crash between recording the key and applying the effect cannot leave the effect applied without the key recorded (or vice versa)"
      - "To avoid using a primary key"
    answer: 2
    explanation: |
      If they're separate, you could apply the effect, crash before recording
      the key, and reprocess on redelivery — a duplicate. Committing both
      atomically makes dedup reliable.
    ref: "concepts.md#idempotent-consumers-and-idempotency-keys"

  - id: messaging-reliability-patterns-012
    difficulty: intermediate
    tags: [idempotency, idempotency-key, design]
    question: |
      Why is a *business* idempotency key (e.g. order id, payment intent id)
      often preferable to a broker-assigned message id for deduplication?
    options:
      - "Business ids are always shorter"
      - "Broker message ids are not unique"
      - "Business keys never need a database"
      - "A broker message id changes if the upstream republishes the same business event, so it catches redeliveries but not genuine upstream duplicates"
    answer: 3
    explanation: |
      A broker message id is unique per publish, so a re-published business
      event gets a new id and slips past dedup. A stable business key dedups
      both redeliveries and upstream re-publishes.
    ref: "concepts.md#idempotent-consumers-and-idempotency-keys"

  - id: messaging-reliability-patterns-013
    difficulty: intermediate
    tags: [idempotency, dedup-store, gotcha]
    question: |
      What is a real operational gotcha of a dedup/processed-messages table?
    options:
      - "It cannot use a primary key"
      - "It grows unbounded unless old keys are expired (TTL, partition drop, or time-windowed index)"
      - "It makes all writes at-most-once"
      - "It only works with MySQL"
    answer: 1
    explanation: |
      A dedup table accumulates one row per processed message forever unless you
      age out old keys. Sizing/expiring it (TTL, partitioning, windowed unique
      index) is a genuine design concern.
    ref: "concepts.md#idempotent-consumers-and-idempotency-keys"

  - id: messaging-reliability-patterns-014
    difficulty: beginner
    tags: [dual-write, definition]
    question: |
      The "dual-write problem" refers to:
    options:
      - "A service updating its database AND publishing a message to a broker as two separate, non-atomic operations that can diverge on failure"
      - "Writing the same row twice in one transaction"
      - "Two consumers writing to the same queue"
      - "Replicating a database to two regions"
    answer: 0
    explanation: |
      The dual write is updating two independent systems (DB + broker) with no
      shared transaction. A crash or failure between them leaves DB and broker
      inconsistent.
    ref: "concepts.md#the-dual-write-problem"

  - id: messaging-reliability-patterns-015
    difficulty: intermediate
    tags: [dual-write, failure-mode]
    question: |
      A service does orderRepository.save(order) (commits to DB) and then
      kafkaProducer.send(event). It crashes after the DB commit but before the
      send. What is the outcome?
    options:
      - "The DB is rolled back automatically"
      - "The event is sent anyway when the process restarts"
      - "Kafka detects the missing send and requests it"
      - "The order exists in the DB but no event is ever published — a silently lost message"
    answer: 3
    explanation: |
      There is no coordination between the two writes. A crash in the gap leaves
      the committed order with no corresponding event, and nothing republishes
      it — a silent lost message. This is why the dual write is unsafe.
    ref: "concepts.md#the-dual-write-problem"

  - id: messaging-reliability-patterns-016
    difficulty: advanced
    tags: [dual-write, misconception]
    question: |
      Why does "just call producer.send() inside the DB transaction, before
      COMMIT" NOT solve the dual-write problem?
    options:
      - "It works perfectly and is the recommended fix"
      - "Because sending before commit is faster"
      - "The broker send is not part of the DB transaction, and the DB COMMIT can still fail after the send succeeds"
      - "Because the send always fails inside a transaction"
    answer: 2
    explanation: |
      The broker send is not enrolled in the DB transaction. Whichever order you
      choose, one commit can succeed and the other fail. No ordering of two
      independent commits is atomic — you need a single atomic write (outbox).
    ref: "concepts.md#the-dual-write-problem"

  - id: messaging-reliability-patterns-017
    difficulty: beginner
    tags: [outbox, definition]
    question: |
      The transactional outbox pattern makes publishing reliable by:
    options:
      - "Sending the message twice for redundancy"
      - "Writing the event as a row in the SAME local DB transaction as the business change, then relaying it to the broker asynchronously"
      - "Using a two-phase commit across DB and broker"
      - "Disabling the broker until the DB confirms"
    answer: 1
    explanation: |
      The service commits the business row and an outbox row atomically in one
      local transaction. A separate relay reads the outbox and publishes,
      guaranteeing the event is published iff the DB change committed.
    ref: "concepts.md#transactional-outbox-pattern"

  - id: messaging-reliability-patterns-018
    difficulty: intermediate
    tags: [outbox, delivery-semantics]
    question: |
      What delivery guarantee does the outbox relay provide, and what does that
      imply for consumers?
    options:
      - "At-least-once; the relay may republish after a crash, so consumers must still be idempotent"
      - "Exactly-once; consumers need no special handling"
      - "At-most-once; consumers may miss events"
      - "No guarantee; the relay is best-effort"
    answer: 0
    explanation: |
      If the relay publishes then crashes before marking the row published, it
      republishes on restart. Outbox guarantees no *lost* events, not no
      duplicates — consumers must remain idempotent.
    ref: "concepts.md#transactional-outbox-pattern"

  - id: messaging-reliability-patterns-019
    difficulty: advanced
    tags: [outbox, polling, concurrency]
    question: |
      Multiple polling-relay instances read the outbox with
      "SELECT ... WHERE published_at IS NULL". Which clause prevents two
      instances from grabbing and publishing the same rows?
    options:
      - "ORDER BY id DESC"
      - "LIMIT 1"
      - "FOR UPDATE SKIP LOCKED"
      - "DISTINCT"
    answer: 2
    explanation: |
      FOR UPDATE SKIP LOCKED locks the selected rows and skips rows already
      locked by another instance, so concurrent relays partition the work
      instead of double-publishing.
    ref: "concepts.md#transactional-outbox-pattern"

  - id: messaging-reliability-patterns-020
    difficulty: intermediate
    tags: [outbox, cdc, debezium]
    question: |
      Relaying the outbox via Change Data Capture (CDC, e.g. Debezium) instead
      of polling works by:
    options:
      - "Tailing the database's replication log (Postgres WAL / MySQL binlog) so every committed outbox insert becomes a broker message"
      - "Running a cron job that scans the whole table hourly"
      - "Having the application push each row twice"
      - "Locking the outbox table on every write"
    answer: 0
    explanation: |
      CDC tails the WAL/binlog. Each committed outbox insert appears in the log
      and is turned into a broker message — lower latency and no polling query
      load, at the cost of running CDC infrastructure.
    ref: "concepts.md#transactional-outbox-pattern"

  - id: messaging-reliability-patterns-021
    difficulty: advanced
    tags: [2pc, blocking, coordinator]
    question: |
      What is the classic failure mode that makes two-phase commit (2PC)
      undesirable for DB-plus-broker atomicity?
    options:
      - "It always duplicates messages"
      - "It cannot span more than one machine"
      - "It requires the broker to be a relational database"
      - "The coordinator can crash after participants vote 'yes' but before the commit/abort decision reaches them, leaving participants blocked holding locks (in-doubt)"
    answer: 3
    explanation: |
      2PC is a blocking protocol: a coordinator crash in the window between the
      prepare votes and the global decision leaves in-doubt participants holding
      locks until the coordinator recovers. This, plus tight coupling, is why
      outbox is preferred.
    ref: "concepts.md#transactional-outbox-with-cdc-vs-two-phase-commit"

  - id: messaging-reliability-patterns-022
    difficulty: intermediate
    tags: [outbox, 2pc, kafka]
    question: |
      Which statement about outbox vs 2PC is correct?
    options:
      - "Kafka natively supports XA/2PC, so 2PC is the simplest choice"
      - "Outbox tolerates a broker outage (the relay catches up later); 2PC requires all participants to be up and Kafka is not XA-capable"
      - "Both give exactly-once with no duplicates"
      - "2PC is loosely coupled while outbox is tightly coupled"
    answer: 1
    explanation: |
      Outbox is loosely coupled: a broker outage just delays the relay. 2PC
      couples availability across all participants and needs XA-capable
      resources — Kafka isn't one. Hence outbox is the industry default.
    ref: "concepts.md#transactional-outbox-with-cdc-vs-two-phase-commit"

  - id: messaging-reliability-patterns-023
    difficulty: intermediate
    tags: [outbox, 2pc, availability]
    question: |
      Compared with 2PC, the transactional outbox improves availability because:
    options:
      - "The atomic unit is a single LOCAL database transaction, so the broker can be down without blocking the business write"
      - "It uses less disk space"
      - "It never writes to disk"
      - "It removes the need for a database"
    answer: 0
    explanation: |
      Outbox turns the atomic requirement into one local DB commit. The broker
      being unavailable only delays the asynchronous relay; the business
      transaction still commits. 2PC would block on broker availability.
    ref: "concepts.md#transactional-outbox-with-cdc-vs-two-phase-commit"

  - id: messaging-reliability-patterns-024
    difficulty: beginner
    tags: [inbox, definition]
    question: |
      The inbox pattern (consumer side) achieves exactly-once *processing* by:
    options:
      - "Deleting the queue after each read"
      - "Acking every message twice"
      - "Recording each incoming message id in an inbox table in the SAME transaction as the side effect, so duplicates are detected and skipped"
      - "Publishing an event before processing"
    answer: 2
    explanation: |
      The inbox atomically stores the message id (with a unique constraint)
      alongside the effect. A redelivery hits a unique violation and is skipped
      — effectively-once processing over at-least-once delivery.
    ref: "concepts.md#inbox-pattern"

  - id: messaging-reliability-patterns-025
    difficulty: intermediate
    tags: [inbox, unique-violation]
    question: |
      In the inbox pattern, an INSERT of the incoming message id raises a
      unique-key violation. What does this signal, and what should the consumer do?
    options:
      - "A database corruption; crash the consumer"
      - "The broker is misconfigured; disable acks"
      - "The message is new; apply the effect twice"
      - "The message is a redelivery/duplicate; abort the transaction and ack without re-applying the effect"
    answer: 3
    explanation: |
      A unique violation on the message id means it was already processed. The
      consumer rolls back (no re-applied effect) and acks so the broker stops
      redelivering.
    ref: "concepts.md#inbox-pattern"

  - id: messaging-reliability-patterns-026
    difficulty: intermediate
    tags: [outbox, inbox, pipeline]
    question: |
      How do the outbox and inbox patterns combine to give an effectively-once
      pipeline over an at-least-once broker?
    options:
      - "Outbox ensures sends are not lost (atomic with the DB write); inbox ensures receipts are not double-applied (atomic dedup with the effect)"
      - "Outbox removes duplicates; inbox removes latency"
      - "They are alternatives; you never use both"
      - "Both are broker features requiring no application code"
    answer: 0
    explanation: |
      Outbox guarantees the producer doesn't lose events; inbox guarantees the
      consumer doesn't apply an event twice. Together, over at-least-once
      delivery, you get effectively-once end to end.
    ref: "concepts.md#inbox-pattern"

  - id: messaging-reliability-patterns-027
    difficulty: beginner
    tags: [ordering, kafka, partition]
    question: |
      In Kafka, ordering of records is guaranteed:
    options:
      - "Globally across the whole topic"
      - "Only within a single partition"
      - "Only across consumer groups"
      - "Never; Kafka has no ordering"
    answer: 1
    explanation: |
      Kafka guarantees order only within a partition. Records with the same key
      hash to the same partition, preserving same-key order; there is no
      cross-partition (topic-wide) ordering.
    ref: "concepts.md#message-ordering-and-partitioning-for-order"

  - id: messaging-reliability-patterns-028
    difficulty: intermediate
    tags: [ordering, parallelism, trade-off]
    question: |
      What is the core trade-off between strict total ordering and throughput?
    options:
      - "Strict total order requires more disk"
      - "There is no trade-off; you can always have both"
      - "Strict total order forces a single serial consumer (no parallelism); partitioning by key keeps related messages ordered while unrelated ones process in parallel"
      - "Parallelism requires disabling acknowledgements"
    answer: 2
    explanation: |
      Total order means one consumer processing serially. To scale you partition
      by a key so per-entity order is preserved while different entities process
      concurrently — trading global order for parallelism.
    ref: "concepts.md#message-ordering-and-partitioning-for-order"

  - id: messaging-reliability-patterns-029
    difficulty: advanced
    tags: [ordering, kafka, in-flight]
    question: |
      A Kafka producer has max.in.flight.requests.per.connection=5, retries
      enabled, and enable.idempotence=false. Why can records within a partition
      end up out of order?
    options:
      - "Because Kafka randomizes offsets"
      - "Because acks=all disables ordering"
      - "Ordering is never affected by retries"
      - "A retried batch can be appended AFTER a later batch that already succeeded, reordering the partition; the idempotent producer uses sequence numbers to prevent this"
    answer: 3
    explanation: |
      With multiple in-flight requests and non-idempotent retries, a failed
      batch can be retried and land after a later successful batch. Enabling
      idempotence makes the broker use per-partition sequence numbers to keep
      order for up to 5 in-flight requests.
    ref: "concepts.md#message-ordering-and-partitioning-for-order"

  - id: messaging-reliability-patterns-030
    difficulty: intermediate
    tags: [ordering, dlq, gotcha]
    question: |
      Which of these silently BREAKS per-key ordering even when the broker
      guarantees partition order?
    options:
      - "Routing a failed message to a retry/DLQ topic and continuing, so later messages for the same key are processed before the retried one"
      - "Using the entity id as the partition key"
      - "Committing offsets after processing"
      - "Using a single consumer per partition"
    answer: 0
    explanation: |
      Detouring a failed message to a retry/DLQ topic while the main flow
      continues means a later record for the same key is processed before the
      retried one — reordering. Concurrent consumers of one partition and
      repartitioning are other order-breakers.
    ref: "concepts.md#message-ordering-and-partitioning-for-order"

  - id: messaging-reliability-patterns-031
    difficulty: intermediate
    tags: [ordering, sqs, message-group]
    question: |
      In Amazon SQS FIFO, ordering is preserved:
    options:
      - "Across the entire queue globally"
      - "Only if there is exactly one message per second"
      - "Within a message group id (analogous to a partition key)"
      - "Never; SQS is unordered"
    answer: 2
    explanation: |
      SQS FIFO orders messages within a message group id, similar to Kafka's
      per-key partition ordering. SQS *standard* queues are only best-effort
      ordered.
    ref: "concepts.md#message-ordering-and-partitioning-for-order"

  - id: messaging-reliability-patterns-032
    difficulty: advanced
    tags: [ordering, repartition, kafka]
    question: |
      Why can adding partitions to a keyed Kafka topic break ordering for some
      keys?
    options:
      - "It deletes old messages"
      - "It disables the idempotent producer"
      - "It resets all consumer offsets"
      - "It changes the key→partition mapping, so a key's future records may go to a different partition than its history, splitting its ordered stream"
    answer: 3
    explanation: |
      Partition assignment is typically hash(key) % partitionCount. Changing the
      count remaps keys, so a key's new records can land on a different partition
      from its old ones — its history is split and can be reordered.
    ref: "concepts.md#message-ordering-and-partitioning-for-order"

  - id: messaging-reliability-patterns-033
    difficulty: beginner
    tags: [poison-message, definition]
    question: |
      A "poison message" is:
    options:
      - "A message larger than the broker's size limit"
      - "A message the consumer can never successfully process (malformed, buggy, unresolvable), which under naive at-least-once retry is redelivered forever"
      - "An encrypted message the consumer can't read the headers of"
      - "The last message before a broker shutdown"
    answer: 1
    explanation: |
      A poison message repeatedly fails processing. With plain at-least-once
      retry it is redelivered endlessly, causing head-of-line blocking and
      wasted resources — which is why DLQs exist.
    ref: "concepts.md#poison-messages-and-dead-letter-queues"

  - id: messaging-reliability-patterns-034
    difficulty: beginner
    tags: [dlq, purpose]
    question: |
      The primary purpose of a dead-letter queue (DLQ) is to:
    options:
      - "Move a message aside after a bounded number of failed attempts so the main flow continues, and preserve it for inspection/redrive"
      - "Speed up message delivery"
      - "Encrypt failed messages"
      - "Delete failed messages immediately"
    answer: 0
    explanation: |
      A DLQ captures messages that exceed a retry limit (or expire/overflow) so
      they stop blocking the main queue, while retaining them with failure
      context for debugging and later redrive.
    ref: "concepts.md#poison-messages-and-dead-letter-queues"

  - id: messaging-reliability-patterns-035
    difficulty: intermediate
    tags: [dlq, rabbitmq, dlx]
    question: |
      In RabbitMQ, which of these does NOT cause a message to be dead-lettered
      via a configured dead-letter exchange?
    options:
      - "The message is rejected/nacked with requeue=false"
      - "The message's TTL expires in the queue"
      - "The consumer acks the message successfully"
      - "The queue length limit is exceeded"
    answer: 2
    explanation: |
      RabbitMQ dead-letters a message on nack/reject with requeue=false, TTL
      expiry, or queue-length overflow. A successful ack means normal
      processing — it is not dead-lettered.
    ref: "concepts.md#poison-messages-and-dead-letter-queues"

  - id: messaging-reliability-patterns-036
    difficulty: intermediate
    tags: [dlq, kafka]
    question: |
      How is a dead-letter queue typically implemented for Kafka?
    options:
      - "Kafka has a built-in DLQ per topic enabled by default"
      - "Kafka automatically deletes poison records"
      - "By setting acks=0"
      - "The application (or a framework like Spring Kafka / Kafka Connect) publishes the failed record to a separate dead-letter TOPIC after N retries and commits the offset to move past it"
    answer: 3
    explanation: |
      Kafka has no built-in DLQ. The application or a framework routes the failed
      record to a dead-letter topic after exhausting retries and commits the
      offset so the partition can progress.
    ref: "concepts.md#poison-messages-and-dead-letter-queues"

  - id: messaging-reliability-patterns-037
    difficulty: intermediate
    tags: [dlq, sqs, redrive]
    question: |
      In Amazon SQS, what determines when a message is moved to the DLQ?
    options:
      - "The redrive policy's maxReceiveCount — after that many receives without deletion, SQS moves it to the configured DLQ"
      - "A random timer"
      - "The message size only"
      - "Whenever the consumer is idle"
    answer: 0
    explanation: |
      SQS uses a redrive policy with maxReceiveCount. Once a message has been
      received that many times without being deleted (processed), SQS moves it
      to the DLQ.
    ref: "concepts.md#poison-messages-and-dead-letter-queues"

  - id: messaging-reliability-patterns-038
    difficulty: intermediate
    tags: [dlq, operations, alerting]
    question: |
      Which operational practice is essential once you introduce a DLQ?
    options:
      - "Deleting the DLQ nightly to save space"
      - "Alerting on DLQ depth > 0 (and storing the failure reason), since a DLQ nobody watches is a silent data-loss hole"
      - "Setting maxReceiveCount to 1 for all queues"
      - "Disabling retries entirely"
    answer: 1
    explanation: |
      A DLQ without monitoring silently accumulates lost work. Alert on DLQ
      depth, store the failure reason/attempt count with each message, and build
      a redrive path to replay after fixing the bug.
    ref: "concepts.md#poison-messages-and-dead-letter-queues"

  - id: messaging-reliability-patterns-039
    difficulty: beginner
    tags: [retry, backoff]
    question: |
      Exponential backoff between retries means:
    options:
      - "Retrying immediately as fast as possible"
      - "Waiting a fixed 1 second every time"
      - "Only retrying once"
      - "Waiting a progressively longer time after each attempt (e.g. base * 2^attempt), capped at a maximum"
    answer: 3
    explanation: |
      Exponential backoff grows the wait after each failed attempt
      (base·2^attempt, capped) so a struggling dependency gets room to recover
      instead of being hammered.
    ref: "concepts.md#retry-with-exponential-backoff-and-jitter"

  - id: messaging-reliability-patterns-040
    difficulty: intermediate
    tags: [retry, jitter, thundering-herd]
    question: |
      Why add JITTER (randomness) to exponential backoff?
    options:
      - "To make retries slower on average"
      - "To guarantee exactly-once delivery"
      - "So that many clients that failed at the same instant don't retry in a synchronized wave (thundering herd / retry storm) that keeps a recovering service down"
      - "Because it is required by TCP"
    answer: 2
    explanation: |
      Plain exponential backoff still synchronizes clients into retry waves.
      Jitter spreads retries randomly in time, breaking the thundering herd so a
      recovering dependency isn't immediately re-overwhelmed.
    ref: "concepts.md#retry-with-exponential-backoff-and-jitter"

  - id: messaging-reliability-patterns-041
    difficulty: advanced
    tags: [retry, full-jitter, formula]
    question: |
      AWS's "full jitter" backoff computes the sleep for an attempt as:
    options:
      - "A random value in [0, min(cap, base * 2^attempt)]"
      - "Exactly min(cap, base * 2^attempt)"
      - "cap * 2^attempt with no randomness"
      - "A fixed base regardless of attempt"
    answer: 0
    explanation: |
      Full jitter first computes the capped exponential delay
      cap_delay = min(max, base·2^attempt), then sleeps a uniformly random
      amount in [0, cap_delay]. This spreads retries most evenly.
    ref: "concepts.md#retry-with-exponential-backoff-and-jitter"

  - id: messaging-reliability-patterns-042
    difficulty: intermediate
    tags: [retry, non-retryable]
    question: |
      Which error should generally NOT be retried and should go straight toward
      a DLQ?
    options:
      - "A 503 Service Unavailable"
      - "A connection timeout"
      - "A database deadlock"
      - "A 400 Bad Request / validation / deserialization failure"
    answer: 3
    explanation: |
      Validation/deserialization/400 errors are deterministic — retrying will
      never succeed, so they should be dead-lettered. Transient errors (503,
      timeouts, deadlocks, 429) are worth retrying with backoff.
    ref: "concepts.md#retry-with-exponential-backoff-and-jitter"

  - id: messaging-reliability-patterns-043
    difficulty: intermediate
    tags: [retry, idempotency]
    question: |
      Why are retries and idempotency described as "inseparable"?
    options:
      - "Because retries are only allowed on idempotent brokers"
      - "Because retrying a non-idempotent operation duplicates its side effect — you can only safely retry operations that are idempotent"
      - "Because idempotency disables retries"
      - "They are unrelated concepts"
    answer: 1
    explanation: |
      A retry re-executes the operation. If the operation isn't idempotent, the
      retry (which may have partially succeeded already) duplicates the effect.
      Safe retry requires idempotency.
    ref: "concepts.md#retry-with-exponential-backoff-and-jitter"

  - id: messaging-reliability-patterns-044
    difficulty: advanced
    tags: [retry, kafka, retry-topic]
    question: |
      In Kafka, why is retrying a failed record "in place" (blocking on the same
      partition) problematic, and what is the common fix?
    options:
      - "It is fine; in-place retry never blocks"
      - "The fix is to disable acks"
      - "In-place retry blocks the partition (head-of-line blocking) for all later records; the fix is tiered retry topics (e.g. orders.retry.5s, orders.retry.1m) so the main consumer keeps moving"
      - "The fix is to increase max.in.flight to 1"
    answer: 2
    explanation: |
      Because a partition is processed in order, retrying one record in place
      stalls every later record. Tiered retry topics move the record off the hot
      path so the main consumer continues while retries happen separately.
    ref: "concepts.md#retry-with-exponential-backoff-and-jitter"

  - id: messaging-reliability-patterns-045
    difficulty: beginner
    tags: [saga, definition]
    question: |
      A saga is used when:
    options:
      - "A business transaction spans multiple services/databases where one distributed ACID transaction is impractical, so it is modeled as a sequence of local transactions with compensating transactions on failure"
      - "A single ACID transaction can cover all the work"
      - "You need to speed up a single-database write"
      - "You want to disable the broker"
    answer: 0
    explanation: |
      Sagas coordinate a multi-service business transaction as local
      transactions per service. If a step fails, earlier steps are undone via
      compensating transactions — no global 2PC needed.
    ref: "concepts.md#saga-pattern-and-compensating-transactions"

  - id: messaging-reliability-patterns-046
    difficulty: intermediate
    tags: [saga, compensation]
    question: |
      A compensating transaction is best described as:
    options:
      - "A database ROLLBACK of the committed local transaction"
      - "A retry of the failed step"
      - "A lock held until the saga completes"
      - "A semantic undo — a new action that counteracts a previously committed step (e.g. issue a refund for a captured payment)"
    answer: 3
    explanation: |
      Committed local steps can't be rolled back, so compensation is a semantic
      undo: a new operation (refund, cancellation, release) that counteracts the
      earlier effect. Compensations should be idempotent.
    ref: "concepts.md#saga-pattern-and-compensating-transactions"

  - id: messaging-reliability-patterns-047
    difficulty: intermediate
    tags: [saga, choreography, orchestration]
    question: |
      What distinguishes choreography-based from orchestration-based sagas?
    options:
      - "Choreography uses a central coordinator; orchestration is fully decentralized"
      - "Only orchestration supports compensations"
      - "In choreography each service reacts to events and emits the next; in orchestration a central orchestrator explicitly tells each service what to do"
      - "They are the same thing"
    answer: 2
    explanation: |
      Choreography is decentralized event-reaction (no central brain);
      orchestration uses a central coordinator that drives each step. Choreography
      suits simple flows; orchestration gives visibility for complex ones.
    ref: "concepts.md#saga-pattern-and-compensating-transactions"

  - id: messaging-reliability-patterns-048
    difficulty: advanced
    tags: [saga, isolation, consistency]
    question: |
      Which property do sagas notably LACK compared with a single ACID
      transaction, and what is the consequence?
    options:
      - "Durability; committed steps can be lost"
      - "Isolation; intermediate states (e.g. a reservation before payment) are visible to others, so you must design semantic locks / pending states"
      - "Atomicity of each local step"
      - "Consistency of any kind"
    answer: 1
    explanation: |
      Sagas give ACD without I — no isolation. Intermediate states are visible
      to concurrent actors, so you guard them with semantic locks or PENDING
      statuses rather than relying on isolation. Overall consistency is eventual.
    ref: "concepts.md#saga-pattern-and-compensating-transactions"

  - id: messaging-reliability-patterns-049
    difficulty: advanced
    tags: [saga, compensation, failure]
    question: |
      If a compensating transaction itself fails, the standard approach is to:
    options:
      - "Make compensations idempotent and retry them (persisting saga state to resume), escalating truly unrecoverable cases to a DLQ / human"
      - "Ignore it and mark the saga complete"
      - "Roll back the entire distributed system with 2PC"
      - "Restart every service"
    answer: 0
    explanation: |
      Compensations must be idempotent and retried until they succeed; saga
      state is persisted so it can resume after crashes. Genuinely unrecoverable
      cases are escalated (DLQ/human intervention).
    ref: "concepts.md#saga-pattern-and-compensating-transactions"

  - id: messaging-reliability-patterns-050
    difficulty: beginner
    tags: [consumer-lag, kafka, definition]
    question: |
      In Kafka, consumer lag for a partition is:
    options:
      - "The network latency to the broker"
      - "The number of consumers in the group"
      - "The time since the last rebalance"
      - "log-end-offset minus committed-offset — the number of records produced but not yet consumed"
    answer: 3
    explanation: |
      Lag = log-end-offset − committed-offset per partition: how many records
      exist beyond what the consumer has committed. It is the key health metric;
      growing lag means the consumer can't keep up.
    ref: "concepts.md#consumer-lag-and-backpressure"

  - id: messaging-reliability-patterns-051
    difficulty: intermediate
    tags: [consumer-lag, kafka, parallelism]
    question: |
      A Kafka topic has 4 partitions and a consumer group has 6 consumers. Lag
      is growing. Which statement is correct?
    options:
      - "Adding more consumers beyond 4 helps because each partition gets multiple active readers"
      - "Lag is unrelated to partition count"
      - "At most 4 consumers in the group can be active (one per partition); the extra 2 are idle, so adding consumers alone won't reduce lag — you need more partitions or faster processing"
      - "You must reduce partitions to 1 to fix ordering"
    answer: 2
    explanation: |
      Within a group, a partition is consumed by at most one consumer, so
      partition count caps active parallelism. With 4 partitions, 2 of 6
      consumers sit idle. To cut lag, add partitions or speed up processing.
    ref: "concepts.md#consumer-lag-and-backpressure"

  - id: messaging-reliability-patterns-052
    difficulty: intermediate
    tags: [backpressure, kafka, pull]
    question: |
      Why do pull-based brokers like Kafka have "natural" backpressure?
    options:
      - "Because the consumer polls at its own pace; unread data sits durably in the log (bounded by retention, not consumer memory)"
      - "Because they push data faster than consumers"
      - "Because they drop messages when consumers are slow"
      - "Because they use TCP flow control only"
    answer: 0
    explanation: |
      In a pull model the consumer decides when and how much to fetch. Unconsumed
      data stays durably on the broker up to the retention limit, so a slow
      consumer doesn't overflow — it just lags.
    ref: "concepts.md#consumer-lag-and-backpressure"

  - id: messaging-reliability-patterns-053
    difficulty: intermediate
    tags: [backpressure, rabbitmq, prefetch]
    question: |
      In push-based RabbitMQ, the primary knob for backpressure is:
    options:
      - "Increasing the message TTL"
      - "Consumer prefetch (basic.qos / prefetch_count) — the max unacked messages the broker will push to a consumer"
      - "The number of exchanges"
      - "Disabling acknowledgements"
    answer: 1
    explanation: |
      RabbitMQ pushes to consumers, so you throttle with prefetch (basic.qos):
      the max number of unacked messages in flight to a consumer. Too high bloats
      consumer memory; too low underutilizes it.
    ref: "concepts.md#consumer-lag-and-backpressure"

  - id: messaging-reliability-patterns-054
    difficulty: advanced
    tags: [backpressure, kafka, poll-interval]
    question: |
      A Kafka consumer sets a very high max.poll.records but its processing of a
      batch sometimes exceeds max.poll.interval.ms. What happens?
    options:
      - "Nothing; the consumer just runs slower"
      - "Messages are automatically dead-lettered"
      - "The offset is committed twice"
      - "The broker considers the consumer dead and triggers a group rebalance, reassigning its partitions — which typically worsens lag"
    answer: 3
    explanation: |
      If a consumer doesn't call poll() within max.poll.interval.ms, the group
      coordinator assumes it has failed and rebalances, reassigning its
      partitions. Frequent rebalances add overhead and worsen lag — so size the
      poll batch to what you can process in time.
    ref: "concepts.md#consumer-lag-and-backpressure"

  - id: messaging-reliability-patterns-055
    difficulty: intermediate
    tags: [consumer-lag, backpressure, key-takeaway]
    question: |
      Which statement correctly contrasts how lag is absorbed in pull vs push
      brokers?
    options:
      - "Both absorb lag in consumer memory"
      - "Push brokers store lag on disk; Kafka stores it in RAM"
      - "Kafka absorbs lag durably on the broker (risking staleness and eventual data expiry past retention), while a push broker without prefetch limits risks overwhelming the consumer's memory"
      - "Neither broker can accumulate lag"
    answer: 2
    explanation: |
      In Kafka the log retains unread data, so a lagging consumer risks
      staleness and, if it falls behind retention, data expiry — not memory
      exhaustion. A push broker without prefetch caps can flood a slow consumer's
      memory. Backpressure matches intake to processing rate.
    ref: "concepts.md#consumer-lag-and-backpressure"
