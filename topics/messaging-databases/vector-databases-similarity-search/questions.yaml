topic: "Vector Databases & Similarity Search"
domain: messaging-databases
topic_slug: vector-databases-similarity-search
version: 1
questions:
  - id: vector-databases-similarity-search-001
    difficulty: beginner
    tags: [embeddings, similarity, basics]
    question: |
      What does an embedding represent in the context of a vector database?
    options:
      - "A fixed-length numeric vector that positions semantically similar inputs near each other"
      - "A compressed binary copy of the original document's raw bytes kept for retrieval"
      - "A B-tree index key produced by hashing the raw input text into an integer"
      - "A foreign key column linking each row to its separate full-text search index"
    answer: 0
    explanation: |
      An embedding is a dense fixed-length vector produced by an ML model such that
      semantically similar inputs map to nearby points in the vector space. Similarity search
      then finds the stored vectors closest to a query vector.
    ref: "concepts.md#embeddings-and-vector-similarity-metrics"

  - id: vector-databases-similarity-search-002
    difficulty: beginner
    tags: [cosine, metrics]
    question: |
      Cosine similarity between two vectors measures primarily:
    options:
      - "The straight-line distance between their endpoints"
      - "The angle (direction) between them, ignoring magnitude"
      - "The number of dimensions in which they differ in sign"
      - "The sum of element-wise products including magnitude"
    answer: 1
    explanation: |
      Cosine similarity = (a·b)/(‖a‖‖b‖). It is magnitude-invariant and compares the direction
      (angle) of the two vectors, which is why it is the common default for text embeddings.
    ref: "concepts.md#embeddings-and-vector-similarity-metrics"

  - id: vector-databases-similarity-search-003
    difficulty: intermediate
    tags: [metrics, normalization, dot-product]
    question: |
      For vectors that are already L2-normalized (unit length), which statement is true?
    options:
      - "Cosine similarity and dot product produce different neighbor rankings for unit vectors"
      - "Euclidean distance can no longer be computed once vectors are normalized to unit length"
      - "Ranking by dot product, cosine, and Euclidean distance is equivalent"
      - "The dot product of two unit vectors always exceeds 1.0 after normalization"
    answer: 2
    explanation: |
      For unit vectors, ‖a−b‖² = 2 − 2(a·b), so minimizing L2 equals maximizing dot product
      equals maximizing cosine — they rank neighbors identically. This is why normalizing and
      using the cheaper dot product is a common recommendation.
    ref: "concepts.md#embeddings-and-vector-similarity-metrics"

  - id: vector-databases-similarity-search-004
    difficulty: intermediate
    tags: [pgvector, operators]
    question: |
      In pgvector, which operator computes cosine distance?
    options:
      - "<-> "
      - "<#>"
      - "@@"
      - "<=>"
    answer: 3
    explanation: |
      pgvector uses `<->` for L2 distance, `<#>` for negative inner product, and `<=>` for
      cosine distance. `@@` is Postgres full-text match, unrelated to vectors.
    ref: "concepts.md#embeddings-and-vector-similarity-metrics"

  - id: vector-databases-similarity-search-005
    difficulty: advanced
    tags: [pgvector, inner-product, operators]
    question: |
      Why does pgvector's `<#>` operator return the *negative* inner product rather than the
      raw dot product?
    options:
      - "So that 'smaller value = closer' holds, matching ascending ORDER BY / index scan order"
      - "Because the inner product can be negative and Postgres index keys reject negative values"
      - "To implicitly L2-normalize both vectors to unit length before the comparison is applied"
      - "Because the raw dot product is mathematically undefined for high-dimensional float vectors"
    answer: 0
    explanation: |
      Larger dot product means more similar, but index scans and ORDER BY return rows in
      ascending distance order. Negating the inner product makes 'smaller = closer' hold so the
      index can return nearest neighbors first.
    ref: "concepts.md#embeddings-and-vector-similarity-metrics"

  - id: vector-databases-similarity-search-006
    difficulty: intermediate
    tags: [metrics, gotcha]
    question: |
      A team trains retrieval on a model that expects cosine similarity but queries the index
      configured for Euclidean distance on *unnormalized* vectors. Most likely outcome?
    options:
      - "A hard type-mismatch error raised at query time by the metric validator"
      - "Silently degraded recall/relevance with no error raised"
      - "Identical results, since all distance metrics are fully interchangeable"
      - "The index refuses to build until the metric configuration is corrected"
    answer: 1
    explanation: |
      Using the wrong metric for a model does not raise an error — it silently returns lower
      quality results. Metrics are only equivalent for normalized vectors; on unnormalized
      vectors L2 and cosine can rank differently.
    ref: "concepts.md#embeddings-and-vector-similarity-metrics"

  - id: vector-databases-similarity-search-007
    difficulty: beginner
    tags: [ann, knn, scaling]
    question: |
      What is the time complexity of exact brute-force kNN search over N vectors of dimension D?
    options:
      - "O(log N)"
      - "O(D · log N)"
      - "O(N · D)"
      - "O(1)"
    answer: 2
    explanation: |
      Exact kNN computes the distance from the query to every stored vector — O(N·D) — then
      keeps the top k. It scales linearly with the dataset size, which is why ANN is needed at
      scale.
    ref: "concepts.md#the-ann-problem-why-exact-knn-doesnt-scale"

  - id: vector-databases-similarity-search-008
    difficulty: beginner
    tags: [ann, recall]
    question: |
      What does "recall@k" measure for an ANN index?
    options:
      - "The average bytes of memory consumed per stored vector in the index"
      - "The number of nearest-neighbor queries the index can serve per second"
      - "The average distance from the query to the k returned neighbor vectors"
      - "The fraction of the true top-k neighbors the index actually returns"
    answer: 3
    explanation: |
      recall@k = (number of true top-k neighbors returned) / k. It quantifies how much accuracy
      an approximate index gives up relative to exact search; production targets are often
      0.95–0.99.
    ref: "concepts.md#the-ann-problem-why-exact-knn-doesnt-scale"

  - id: vector-databases-similarity-search-009
    difficulty: intermediate
    tags: [ann, tradeoff]
    question: |
      The fundamental trade-off that nearly every vector-index tuning knob adjusts is:
    options:
      - "Recall vs latency vs memory"
      - "Consistency vs availability vs partition tolerance"
      - "Read vs write vs delete throughput"
      - "Serializable vs read-committed isolation"
    answer: 0
    explanation: |
      ANN design centers on the recall ↔ latency ↔ memory triangle. Parameters like ef, nprobe,
      M, and quantization each trade one of these against the others.
    ref: "concepts.md#the-ann-problem-why-exact-knn-doesnt-scale"

  - id: vector-databases-similarity-search-010
    difficulty: intermediate
    tags: [ann, index-tree]
    question: |
      Why can't a standard B-tree provide O(log N) exact nearest-neighbor lookups for
      high-dimensional embeddings?
    options:
      - "B-trees can only store integer keys internally, so every float embedding must be rounded and truncated before insertion"
      - "There is no meaningful total ordering of high-dimensional points; spatial trees degrade to near-linear scans past ~10-20 dims"
      - "B-trees are hard-capped at exactly 512 dimensions per key by the fixed Postgres 8 KB page-size limit"
      - "Nearest-neighbor lookups require exclusive write locks that the standard B-tree access method is unable to grant"
    answer: 1
    explanation: |
      B-trees rely on a total order over a single key. High-dimensional points have no such
      ordering, and spatial structures (k-d/ball/R-trees) must backtrack into nearly every
      branch past ~10-20 dimensions (curse of dimensionality), degrading to O(N).
    ref: "concepts.md#the-ann-problem-why-exact-knn-doesnt-scale"

  - id: vector-databases-similarity-search-011
    difficulty: intermediate
    tags: [exact, brute-force, small-data]
    question: |
      For a 5,000-row table of embeddings queried occasionally, which is usually the best choice?
    options:
      - "Build a large HNSW graph index immediately to guarantee the lowest possible query latency"
      - "Shard the table across 10 separate nodes before adding any similarity index at all"
      - "Use a flat/exact scan — simpler, 100% recall, instant updates, and fast enough at this size"
      - "Apply IVF-PQ centroid partitioning and code compression to minimize memory footprint"
    answer: 2
    explanation: |
      For small collections (up to ~10K-100K), a flat exact scan is simpler, uses no extra
      index memory, gives 100% recall, supports instant updates, and is fast with SIMD. HNSW's
      build cost and memory are unjustified here.
    ref: "concepts.md#exact-vs-brute-force-when-its-actually-fine"

  - id: vector-databases-similarity-search-012
    difficulty: beginner
    tags: [exact, use-case]
    question: |
      Which workload genuinely requires exact (not approximate) nearest-neighbor search?
    options:
      - "Interactive semantic search ranking results across 50M crawled web pages"
      - "A personalized recommendation feed that tolerates a few silently missed items"
      - "Real-time autocomplete suggestions rendered as the user types in a search bar"
      - "Compliance-driven exact deduplication where every true match must be found"
    answer: 3
    explanation: |
      Most interactive workloads tolerate approximate results. Compliance/exact-dedup use cases
      that must not miss any true match require exact (brute-force or exact GPU) kNN.
    ref: "concepts.md#exact-vs-brute-force-when-its-actually-fine"

  - id: vector-databases-similarity-search-013
    difficulty: beginner
    tags: [hnsw, graph]
    question: |
      HNSW is best described as which kind of ANN index?
    options:
      - "A multi-layer proximity graph searched by greedy traversal"
      - "A hash-bucket index where locality-sensitive functions map similar vectors together"
      - "An inverted file that lists every vector under its nearest k-means centroid cell"
      - "A forest of random-projection trees that recursively split the vector space"
    answer: 0
    explanation: |
      HNSW (Hierarchical Navigable Small World) is a graph index: nodes link to approximate
      neighbors across multiple layers, and search is a greedy best-first walk from a top-layer
      entry point down to the dense bottom layer.
    ref: "concepts.md#hnsw-hierarchical-navigable-small-world-graphs"

  - id: vector-databases-similarity-search-014
    difficulty: intermediate
    tags: [hnsw, parameters, recall]
    question: |
      You need higher recall on an existing HNSW index without rebuilding it. Which parameter
      do you change?
    options:
      - "efConstruction, applied while inserting nodes"
      - "ef (efSearch), at query time"
      - "M, the per-node graph degree set at build"
      - "nlist, the number of coarse cells to create"
    answer: 1
    explanation: |
      ef/efSearch is the query-time candidate-list size and is the runtime recall/latency knob;
      raising it improves recall at the cost of latency, no rebuild needed. M and efConstruction
      are build-time; nlist belongs to IVF.
    ref: "concepts.md#hnsw-hierarchical-navigable-small-world-graphs"

  - id: vector-databases-similarity-search-015
    difficulty: intermediate
    tags: [hnsw, parameters, memory]
    question: |
      In HNSW, increasing the parameter M primarily causes:
    options:
      - "Lower memory use per node and noticeably faster index construction times"
      - "Fewer graph layers overall and correspondingly lower achievable recall"
      - "More neighbors per node — higher recall but more memory and slower builds"
      - "Automatic int8 scalar quantization of every stored vector in the index"
    answer: 2
    explanation: |
      M is the maximum number of neighbor links per node (graph degree). Higher M raises recall
      but increases memory (more links stored per node) and slows construction.
    ref: "concepts.md#hnsw-hierarchical-navigable-small-world-graphs"

  - id: vector-databases-similarity-search-016
    difficulty: advanced
    tags: [hnsw, layers, complexity]
    question: |
      What is the role of HNSW's upper (sparser) layers?
    options:
      - "They store full-precision float copies of every vector, used only for the final re-ranking pass"
      - "They contain the learned k-means centroids that assign each incoming vector to its nearest cell"
      - "They hold only the deleted or tombstoned nodes that are awaiting the next periodic compaction cycle"
      - "They provide long-range links for fast coarse navigation before descending to the dense bottom layer"
    answer: 3
    explanation: |
      Higher layers hold exponentially fewer nodes with long-range links, acting like express
      lanes for coarse navigation. Search descends layer by layer until the dense layer 0
      (which contains every node) for fine-grained accuracy — giving ~O(log N) search.
    ref: "concepts.md#hnsw-hierarchical-navigable-small-world-graphs"

  - id: vector-databases-similarity-search-017
    difficulty: advanced
    tags: [hnsw, deletes, gotcha]
    question: |
      Why are in-place deletions problematic for HNSW indexes?
    options:
      - "Removing nodes damages graph connectivity, so systems typically soft-delete/tombstone and rebuild periodically"
      - "Each delete requires fully re-training the k-means codebook over the entire stored dataset from scratch"
      - "HNSW stores all of its vector data immutably on the local disk and cannot be modified after the build step"
      - "Any single delete forces the index to switch its configured distance metric on the fly during the operation"
    answer: 0
    explanation: |
      Removing a node breaks the proximity-graph links that navigation depends on. Systems
      usually mark nodes deleted (tombstone) and filter them at query time, rebuilding the index
      periodically to reclaim space and restore connectivity.
    ref: "concepts.md#hnsw-hierarchical-navigable-small-world-graphs"

  - id: vector-databases-similarity-search-018
    difficulty: beginner
    tags: [ivf, partitioning]
    question: |
      How does an IVF (inverted file) index reduce search cost?
    options:
      - "It compresses each stored vector down to a single byte code before any distance scan runs"
      - "It partitions vectors into cells via k-means and only scans the nprobe cells nearest the query"
      - "It builds a single balanced B-tree keyed on just the first dimension of every stored vector"
      - "It keeps all vectors physically sorted on disk by their precomputed L2 norm magnitude value"
    answer: 1
    explanation: |
      IVF uses k-means to create nlist Voronoi cells, assigns each vector to its nearest
      centroid's inverted list, and at query time scans only the nprobe closest cells instead of
      the whole dataset.
    ref: "concepts.md#ivf-inverted-file-index-coarse-quantization"

  - id: vector-databases-similarity-search-019
    difficulty: intermediate
    tags: [ivf, nprobe, recall]
    question: |
      In an IVF index, raising `nprobe` toward `nlist` does what?
    options:
      - "Lowers recall while making each individual query noticeably faster"
      - "Shrinks the index's resident memory footprint at query time"
      - "Approaches exact search — higher recall at higher latency"
      - "Has no runtime effect because nprobe is fixed at index build time"
    answer: 2
    explanation: |
      nprobe controls how many cells are scanned. nprobe=1 is fastest/lowest recall; raising it
      scans more cells, approaching exact search with higher recall but more latency. It is IVF's
      runtime recall/latency knob, analogous to HNSW's ef.
    ref: "concepts.md#ivf-inverted-file-index-coarse-quantization"

  - id: vector-databases-similarity-search-020
    difficulty: intermediate
    tags: [ivf, boundary, gotcha]
    question: |
      The "boundary problem" in IVF search refers to:
    options:
      - "Query vectors whose dimension exceeds the per-cell maximum the index enforces"
      - "The inverted lists spilling past available disk once too many cells are created"
      - "Integer overflow of the cell-id counter when nlist is configured very large"
      - "A true nearest neighbor sitting in an unprobed cell just across a cell boundary, so it is missed"
    answer: 3
    explanation: |
      Because IVF only scans nprobe cells, a genuine nearest neighbor located just across a cell
      boundary in a cell you didn't probe is missed. Increasing nprobe mitigates this.
    ref: "concepts.md#ivf-inverted-file-index-coarse-quantization"

  - id: vector-databases-similarity-search-021
    difficulty: intermediate
    tags: [ivf, hnsw, training]
    question: |
      A key operational difference between IVF and HNSW is that IVF:
    options:
      - "Requires a training step (k-means) over sample data before vectors can be added, whereas HNSW is incremental"
      - "Is restricted to Hamming distance and rejects cosine, L2, and inner-product metrics"
      - "Always achieves strictly higher recall than HNSW at equal latency for in-memory data"
      - "Persists only the learned centroids to disk and discards the raw vectors after build"
    answer: 0
    explanation: |
      IVF must first learn its centroids via k-means on a representative sample before insertion.
      HNSW builds incrementally as vectors arrive. IVF is more memory-efficient (no graph links)
      but generally lower recall-at-latency in memory than HNSW.
    ref: "concepts.md#ivf-inverted-file-index-coarse-quantization"

  - id: vector-databases-similarity-search-022
    difficulty: intermediate
    tags: [pq, compression]
    question: |
      Product Quantization (PQ) compresses vectors by:
    options:
      - "Truncating each vector down to its first 8 dimensions and discarding the remaining ones"
      - "Splitting a vector into sub-vectors and encoding each as the id of its nearest sub-centroid from a learned codebook"
      - "Storing only the vector's scalar L2 norm and reconstructing direction at query time"
      - "Running general-purpose gzip compression over the raw float32 byte representation"
    answer: 1
    explanation: |
      PQ splits each vector into m sub-vectors, learns a codebook per sub-space (typically 256
      centroids = 1 byte each), and stores each sub-vector as its nearest centroid's id, giving
      large compression (e.g. 512 bytes → 8 bytes).
    ref: "concepts.md#product-quantization-pq-and-ivf-pq"

  - id: vector-databases-similarity-search-023
    difficulty: advanced
    tags: [pq, adc, search]
    question: |
      Asymmetric Distance Computation (ADC) in PQ search means:
    options:
      - "Both the query and the stored vectors are quantized to PQ codes before any distance is compared"
      - "Distances are propagated in only one direction along the proximity graph's edges during traversal"
      - "The query stays full-precision; distances to stored codes are computed via small precomputed lookup tables"
      - "The index applies one distance metric on inserts and a different, asymmetric metric on queries"
    answer: 2
    explanation: |
      ADC keeps the query full-precision and precomputes a table of query-to-sub-centroid
      distances per sub-space. Each stored vector's distance is then just m table lookups and
      adds — fast, with no decompression, and more accurate than quantizing the query too.
    ref: "concepts.md#product-quantization-pq-and-ivf-pq"

  - id: vector-databases-similarity-search-024
    difficulty: intermediate
    tags: [ivf-pq, billion-scale]
    question: |
      Why is IVF-PQ the common choice for billion-scale, memory-constrained vector search?
    options:
      - "It guarantees exact 100% recall even on billion-scale collections"
      - "It keeps every vector at full float32 precision resident in RAM for accuracy"
      - "It needs no training step and supports instant single-vector updates in place"
      - "IVF narrows which cells to scan while PQ compresses the vectors inside them, so a billion vectors fit in tens of GB"
    answer: 3
    explanation: |
      IVF-PQ combines coarse partitioning (scan few cells) with heavy compression (PQ codes),
      letting e.g. 1B×128-dim vectors fit in tens of GB instead of ~500 GB. It is FAISS's
      workhorse for huge datasets.
    ref: "concepts.md#product-quantization-pq-and-ivf-pq"

  - id: vector-databases-similarity-search-025
    difficulty: advanced
    tags: [pq, re-rank, recall]
    question: |
      PQ is lossy and lowers recall. The standard way to recover recall is:
    options:
      - "Retrieve a larger candidate set with PQ, then re-rank those candidates using full-precision vectors"
      - "Increase the embedding dimension so each PQ sub-vector carries more information"
      - "Switch the distance metric to Hamming to compensate for the quantization error"
      - "Disable the IVF cell partitioning and scan every inverted list exhaustively"
    answer: 0
    explanation: |
      A refinement/re-ranking step retrieves an over-sized approximate candidate set via PQ, then
      re-scores those candidates with full-precision vectors (stored on disk/SSD) to pick the
      final top-k — recovering much of the lost recall.
    ref: "concepts.md#product-quantization-pq-and-ivf-pq"

  - id: vector-databases-similarity-search-026
    difficulty: intermediate
    tags: [scalar-quantization, memory]
    question: |
      Scalar quantization (int8) of embeddings typically provides:
    options:
      - "Roughly 32× compression accompanied by a large, unavoidable drop in recall"
      - "~4× compression with small recall loss, and faster int8 SIMD distance computation"
      - "No storage reduction at all, delivering only faster index construction times"
      - "Fully lossless compression that reconstructs the original float32 values exactly"
    answer: 1
    explanation: |
      Scalar quantization maps each float32 dimension to int8 (per-dimension min-max rescale),
      giving ~4× compression, usually <1-2% recall loss, and faster int8 SIMD math — a popular
      near-free win.
    ref: "concepts.md#scalar-and-binary-quantization"

  - id: vector-databases-similarity-search-027
    difficulty: intermediate
    tags: [binary-quantization, hamming]
    question: |
      Binary quantization reduces each dimension to a single bit. The distance function used is:
    options:
      - "Cosine similarity computed directly over the packed bit vectors"
      - "Euclidean distance measured on the floats decompressed back from the bits"
      - "Hamming distance via XOR + popcount"
      - "Jaccard similarity between each vector's assigned k-means centroids"
    answer: 2
    explanation: |
      Binary quantization keeps only the sign bit per dimension (32× compression). Distance
      becomes Hamming distance, computed extremely fast with XOR followed by popcount. Recall
      loss is larger, so it is paired with oversampling + full-precision re-ranking.
    ref: "concepts.md#scalar-and-binary-quantization"

  - id: vector-databases-similarity-search-028
    difficulty: advanced
    tags: [quantization, orthogonal, config]
    question: |
      Which statement about combining quantization with an index structure is correct?
    options:
      - "Quantization is only valid under flat/brute-force search and cannot layer beneath a graph or cell index"
      - "HNSW graphs are incompatible with every quantization scheme and must store full float32 vectors"
      - "Applying any quantization silently forces the index's distance metric to switch to Euclidean"
      - "Quantization is orthogonal to the index; e.g. HNSW + int8 scalar quantization cuts RAM ~4× with negligible recall loss"
    answer: 3
    explanation: |
      Quantization (scalar/binary/PQ) is orthogonal to the index structure — you can layer it
      under HNSW or IVF. 'HNSW + int8 scalar quantization' is a common production config that
      reduces memory ~4× with little recall impact.
    ref: "concepts.md#scalar-and-binary-quantization"

  - id: vector-databases-similarity-search-029
    difficulty: intermediate
    tags: [binary-quantization, re-rank, gotcha]
    question: |
      Binary quantization works best when:
    options:
      - "Paired with oversampling and full-precision re-ranking on high-dimensional embeddings"
      - "Applied to low-dimensional (<64) vectors and returned directly with no re-ranking pass"
      - "Reserved for workloads that demand exact, guaranteed-complete nearest-neighbor results"
      - "Configured so the distance metric becomes inner product computed over the packed bits"
    answer: 0
    explanation: |
      Binary quantization's large recall loss is recovered by retrieving many more candidates via
      fast Hamming distance and re-ranking with full-precision vectors. It suits high-dimensional
      embeddings (1024+ dims); it performs poorly on low-dimensional vectors.
    ref: "concepts.md#scalar-and-binary-quantization"

  - id: vector-databases-similarity-search-030
    difficulty: intermediate
    tags: [scann, mips]
    question: |
      Google's ScaNN improves inner-product (MIPS) search accuracy primarily through:
    options:
      - "Keeping every vector uncompressed in RAM and scanning them exhaustively per query"
      - "Anisotropic vector quantization that weights quantization error along the direction that matters for ranking"
      - "Building a balanced B-tree keyed on each vector's precomputed L2 norm magnitude"
      - "Constructing a forest of random-projection trees in the same style as Spotify's Annoy"
    answer: 1
    explanation: |
      ScaNN's key idea is anisotropic vector quantization: a loss that penalizes quantization
      error more along the direction affecting inner-product ranking, yielding better MIPS recall
      than plain PQ, combined with partitioning and SIMD scoring.
    ref: "concepts.md#other-index-families-scann-lsh-diskann-annoy"

  - id: vector-databases-similarity-search-031
    difficulty: intermediate
    tags: [lsh, index-families]
    question: |
      Locality-Sensitive Hashing (LSH) works by:
    options:
      - "Building a multi-layer navigable proximity graph traversed greedily, as HNSW does"
      - "Compressing each vector into a 1-byte product-quantization code from a learned codebook"
      - "Using hash functions under which nearby vectors collide in the same bucket with high probability"
      - "Sorting all vectors along their first principal component and binary-searching that order"
    answer: 2
    explanation: |
      LSH designs hash functions so that similar vectors are likely to hash to the same bucket.
      Queries scan colliding buckets. It has strong theoretical guarantees but usually needs many
      tables (high memory) and is generally outperformed by HNSW/IVF on real embeddings.
    ref: "concepts.md#other-index-families-scann-lsh-diskann-annoy"

  - id: vector-databases-similarity-search-032
    difficulty: advanced
    tags: [diskann, ssd]
    question: |
      DiskANN enables billion-scale search on a single node by:
    options:
      - "Holding every full-precision vector resident in RAM to avoid any disk access"
      - "Restricting each stored embedding to at most 64 dimensions before it is indexed"
      - "Replicating the full index across roughly 100 machines and fanning queries out"
      - "Keeping most vectors on SSD with a compressed (PQ) copy in RAM for navigation"
    answer: 3
    explanation: |
      DiskANN (Vamana graph) stores most vectors on SSD and keeps a compressed PQ copy in memory
      to guide graph navigation, enabling billion-point search on one node at much lower cost,
      trading a little latency for large memory savings.
    ref: "concepts.md#other-index-families-scann-lsh-diskann-annoy"

  - id: vector-databases-similarity-search-033
    difficulty: intermediate
    tags: [annoy, read-only]
    question: |
      A notable limitation of Spotify's Annoy index is that it:
    options:
      - "Is immutable/read-only — it does not support incremental updates after building"
      - "Requires one or more CUDA-capable GPUs to construct its trees at build time"
      - "Supports only cosine distance and rejects Euclidean or inner-product metrics"
      - "Cannot be memory-mapped and must be fully loaded into heap memory to query"
    answer: 0
    explanation: |
      Annoy builds an immutable, memory-mapped forest of random-projection trees — easy to share
      for read-only recommendation indexes, but it has no incremental updates and lower
      recall/latency than HNSW.
    ref: "concepts.md#other-index-families-scann-lsh-diskann-annoy"

  - id: vector-databases-similarity-search-034
    difficulty: intermediate
    tags: [curse-of-dimensionality]
    question: |
      Which phenomenon is a direct consequence of the curse of dimensionality?
    options:
      - "Every stored vector collapses to a single identical point in the space"
      - "Distances to the nearest and farthest points become nearly equal (distance concentration)"
      - "Cosine similarity becomes mathematically undefined above a few hundred dimensions"
      - "The memory required to store each individual vector effectively drops to zero"
    answer: 1
    explanation: |
      In very high dimensions, the ratio of nearest to farthest distances approaches 1 — distance
      concentration — so 'nearest neighbor' is less distinguishable and threshold-based pruning
      loses power, one reason exact tree indexes fail.
    ref: "concepts.md#the-curse-of-dimensionality"

  - id: vector-databases-similarity-search-035
    difficulty: advanced
    tags: [dimensionality, matryoshka]
    question: |
      Matryoshka embeddings help control dimensionality cost because:
    options:
      - "They encode each dimension as a single binary bit to shrink storage 32×"
      - "They remove the need to choose any distance metric at query time"
      - "A prefix of the vector (e.g. first 256 of 1536 dims) remains usable, so you can truncate to shrink D with modest accuracy loss"
      - "They guarantee exact nearest-neighbor retrieval in O(log N) time"
    answer: 2
    explanation: |
      Matryoshka Representation Learning trains models so that leading prefixes of the embedding
      are themselves useful. You can truncate to a shorter dimension to cut memory and compute,
      trading a little accuracy — a practical lever against the curse of dimensionality.
    ref: "concepts.md#the-curse-of-dimensionality"

  - id: vector-databases-similarity-search-036
    difficulty: intermediate
    tags: [dimensionality, manifold]
    question: |
      Real embeddings often permit effective ANN search despite nominally high dimension because:
    options:
      - "Real embeddings are in practice always fewer than 10 nominal dimensions"
      - "Distance computation between two vectors is O(1) regardless of their dimension D"
      - "The curse of dimensionality applies only to integers and never to float-valued vectors"
      - "The data lies on a lower-dimensional manifold rather than filling the space uniformly"
    answer: 3
    explanation: |
      Although embeddings have hundreds/thousands of nominal dimensions, real data concentrates on
      a lower-dimensional manifold, so neighbors are still meaningful and ANN structures work well
      in practice.
    ref: "concepts.md#the-curse-of-dimensionality"

  - id: vector-databases-similarity-search-037
    difficulty: intermediate
    tags: [filtering, post-filter, gotcha]
    question: |
      A user runs a vector search with LIMIT 20 plus a highly selective metadata filter using a
      post-filter strategy, and complains the query returned only 3 rows. Why?
    options:
      - "ANN returned its top-20 first, then the predicate removed most of them, leaving fewer than requested"
      - "The HNSW graph silently corrupted itself during the last insert and can now only return partial result sets"
      - "Post-filtering internally hard-caps every filtered query at three rows to bound worst-case scan cost"
      - "The cosine metric was quietly swapped for L2 at query time, discarding all but the three closest rows"
    answer: 0
    explanation: |
      Post-filtering fetches the ANN top-k, then drops rows failing the predicate. With a
      selective filter, many/most of those top-k fail, so you get far fewer than LIMIT. Fix with
      pre-filter, in-index filtering, or over-fetching.
    ref: "concepts.md#metadata-filtering-pre-filter-vs-post-filter"

  - id: vector-databases-similarity-search-038
    difficulty: advanced
    tags: [filtering, hnsw, connectivity]
    question: |
      Why can a very selective pre-filter degrade recall on an HNSW index?
    options:
      - "The pre-filter silently rewrites the query's distance metric from cosine to Hamming, corrupting all rankings"
      - "So few nodes match that the graph becomes disconnected among matching nodes, so the greedy walk gets stuck"
      - "Pre-filtering forces HNSW to rebuild its entire multi-layer graph from scratch on every filtered query"
      - "HNSW physically cannot attach any metadata to its nodes, so every filter must scan a separate side table"
    answer: 1
    explanation: |
      HNSW navigation depends on graph connectivity. If a selective filter leaves only a few
      matching nodes, the walk may fail to reach them, cratering recall. Systems mitigate with
      brute-force below a threshold, extra connectivity, or iterative widening of ef.
    ref: "concepts.md#metadata-filtering-pre-filter-vs-post-filter"

  - id: vector-databases-similarity-search-039
    difficulty: intermediate
    tags: [filtering, in-index]
    question: |
      "Single-stage" / in-index filtered search (e.g. filterable HNSW) works by:
    options:
      - "Running the full SQL predicate only after ANN retrieval completes, then discarding every candidate row that fails it"
      - "Disabling the ANN index entirely for any filtered query and falling back to a sequential brute-force table scan"
      - "Applying the predicate during graph/list traversal — skipping non-matching nodes as results but still using them to navigate"
      - "Building and maintaining a completely separate HNSW index for every distinct value the filter column can take"
    answer: 2
    explanation: |
      In-index filtering evaluates the predicate during traversal, so non-matching nodes are not
      returned but can still be traversed to preserve connectivity — combining pre-filter
      correctness with ANN speed. Requires index support (Qdrant, Weaviate, Milvus, pgvector
      iterative scan).
    ref: "concepts.md#metadata-filtering-pre-filter-vs-post-filter"

  - id: vector-databases-similarity-search-040
    difficulty: beginner
    tags: [filtering, definitions]
    question: |
      In a pre-filter strategy, the metadata predicate is evaluated:
    options:
      - "Only after the ANN search has already returned its full candidate set, discarding any that fail the predicate"
      - "Never — the pre-filter strategy deliberately ignores all metadata and ranks purely on vector distance"
      - "Only against the query vector's own metadata fields, never touching the metadata stored on candidate rows"
      - "Before/while restricting the similarity search to only rows that match the predicate"
    answer: 3
    explanation: |
      Pre-filtering restricts the similarity search to the subset of rows satisfying the
      predicate, giving a correct result count. Its risk is performance (naive brute force over
      matches) or breaking ANN graph connectivity if selective.
    ref: "concepts.md#metadata-filtering-pre-filter-vs-post-filter"

  - id: vector-databases-similarity-search-041
    difficulty: intermediate
    tags: [hybrid, bm25]
    question: |
      Why does hybrid search add a keyword ranker like BM25 alongside vector search?
    options:
      - "Dense vectors can blur exact terms (SKUs, error codes, rare acronyms); BM25 nails exact-term matches that semantics miss"
      - "BM25 lexical scoring is always faster than any vector index, so it is bolted on purely to cut query latency"
      - "Adding a BM25 ranker removes the need to compute or store dense embeddings for the corpus entirely"
      - "Pure vector search produces an unordered candidate bag and cannot rank documents, so BM25 supplies all ordering"
    answer: 0
    explanation: |
      Dense embeddings capture semantics/paraphrase but can miss exact tokens like product
      numbers or error codes. BM25 (lexical) handles exact-term matching. Hybrid runs both and
      fuses results, consistently beating either alone.
    ref: "concepts.md#hybrid-search-combining-vector-and-keyword-bm25--rrf"

  - id: vector-databases-similarity-search-042
    difficulty: advanced
    tags: [hybrid, rrf, fusion]
    question: |
      Reciprocal Rank Fusion (RRF) is popular for combining vector and keyword results because it:
    options:
      - "Simply averages the raw cosine similarity and raw BM25 scores together despite their differing numeric scales"
      - "Uses each document's rank (not raw score) via Σ 1/(k + rank), sidestepping incomparable score scales"
      - "Always keeps whichever single ranker produced the higher raw score for a document and drops the other's opinion"
      - "Requires training a small supervised neural network on labeled relevance judgments before it can fuse the lists"
    answer: 1
    explanation: |
      BM25 scores are unbounded while cosine is −1…1, so they can't be added directly. RRF sums
      1/(k + rank) over each ranker (k commonly ~60), using ranks rather than raw scores, which
      avoids score normalization entirely.
    ref: "concepts.md#hybrid-search-combining-vector-and-keyword-bm25--rrf"

  - id: vector-databases-similarity-search-043
    difficulty: intermediate
    tags: [hybrid, splade, sparse]
    question: |
      Learned sparse embeddings such as SPLADE aim to:
    options:
      - "Replace every dense embedding with a single scalar float that summarizes the whole document's meaning"
      - "Compress each dense float32 vector down to a single-byte product-quantization code from a learned codebook"
      - "Produce sparse term-weight vectors that combine lexical exactness with some semantic expansion, searchable in an inverted index"
      - "Eliminate the need for any ranking function by returning documents in raw insertion order instead"
    answer: 2
    explanation: |
      SPLADE-style learned sparse models output sparse term-weight vectors, giving lexical
      matching plus semantic term expansion, and can be served through a traditional inverted
      index — a middle ground between BM25 and dense retrieval.
    ref: "concepts.md#hybrid-search-combining-vector-and-keyword-bm25--rrf"

  - id: vector-databases-similarity-search-044
    difficulty: beginner
    tags: [rag, retrieval]
    question: |
      In a RAG pipeline, the vector database primarily serves as the:
    options:
      - "Backend that runs the LLM's gradient-descent training loop over the stored document embeddings"
      - "Metering component that counts prompt and completion tokens for downstream usage billing"
      - "Central registry that stores and versions the reusable prompt templates the application sends"
      - "Retrieval layer that returns relevant chunks to ground the LLM's answer"
    answer: 3
    explanation: |
      RAG retrieves relevant document chunks from the vector DB and injects them into the LLM
      prompt so the answer is grounded in real data, reducing hallucination and adding private or
      fresh knowledge without retraining.
    ref: "concepts.md#vector-search-in-rag-retrieval-augmented-generation"

  - id: vector-databases-similarity-search-045
    difficulty: intermediate
    tags: [rag, embedding-model, gotcha]
    question: |
      A critical correctness requirement when querying a RAG vector index is that:
    options:
      - "The query must be embedded with the same model used to embed the stored documents"
      - "The query must always be scored with L2 distance regardless of which embedding model produced the vectors"
      - "The query vector must carry more dimensions than the stored document vectors to remain comparable"
      - "Every stored document must be re-embedded from scratch on each incoming query for results to stay valid"
    answer: 0
    explanation: |
      Distances are only meaningful when query and documents share the same embedding space. If
      you change the embedding model, you must re-embed all documents — a costly migration —
      otherwise retrieval returns garbage.
    ref: "concepts.md#vector-search-in-rag-retrieval-augmented-generation"

  - id: vector-databases-similarity-search-046
    difficulty: intermediate
    tags: [rag, re-rank, k]
    question: |
      Why is a cross-encoder re-ranking step often added after ANN retrieval in RAG?
    options:
      - "To shrink the embedding dimension of the retrieved chunks so they consume fewer prompt tokens"
      - "To cheaply retrieve a large k with ANN, then precisely re-score and keep a smaller, higher-quality set for the LLM"
      - "To replace the vector index entirely by scoring the whole corpus with the cross-encoder on each query"
      - "To convert the retrieved dense vectors back into keyword strings before they enter the prompt"
    answer: 1
    explanation: |
      ANN cheaply fetches a large candidate set (high recall), then a slower but more precise
      cross-encoder re-ranks them so only the most relevant n chunks (avoiding noise and context
      bloat) go into the prompt.
    ref: "concepts.md#vector-search-in-rag-retrieval-augmented-generation"

  - id: vector-databases-similarity-search-047
    difficulty: intermediate
    tags: [rag, chunking]
    question: |
      Which statement about chunking in RAG ingestion is correct?
    options:
      - "Chunk size has no measurable effect on retrieval quality, so any arbitrary split works equally well"
      - "Chunks must always be exactly one sentence long or the embedding model will reject them at ingestion"
      - "Too-large chunks dilute relevance and waste context; too-small chunks lose surrounding context"
      - "Chunking is only ever needed for image data and is skipped entirely for plain text documents"
    answer: 2
    explanation: |
      Chunk size is a real quality lever: oversized chunks dilute the signal and waste prompt
      tokens, while tiny chunks strip away context. Overlapping windows of a few hundred tokens
      are common.
    ref: "concepts.md#vector-search-in-rag-retrieval-augmented-generation"

  - id: vector-databases-similarity-search-048
    difficulty: beginner
    tags: [pgvector, index-types]
    question: |
      Which ANN index types does pgvector support?
    options:
      - "Only brute-force flat scans with no approximate-nearest-neighbor index support at all"
      - "Just the standard Postgres B-tree and GiST access methods adapted for vector keys"
      - "Only locality-sensitive hashing (LSH) buckets, matching Elasticsearch's vector approach"
      - "IVFFlat and HNSW"
    answer: 3
    explanation: |
      pgvector supports IVFFlat and, since version 0.5.0, HNSW, along with L2 (<->), inner
      product (<#>), and cosine (<=>) operators, integrated with normal SQL.
    ref: "concepts.md#pgvector-vs-dedicated-vector-databases"

  - id: vector-databases-similarity-search-049
    difficulty: intermediate
    tags: [pgvector, buy-vs-build]
    question: |
      A team already running PostgreSQL needs semantic search over ~5M rows with rich SQL filters
      and joins, moderate QPS. The most pragmatic first choice is:
    options:
      - "Use pgvector — one system for relational data + vectors, SQL filtering/joins, transactions, at this scale"
      - "Immediately stand up a distributed multi-node dedicated vector DB and stream every row into it via CDC"
      - "Hand-build a custom HNSW graph library from scratch in the application to avoid any external dependency"
      - "Store each embedding as a JSON array string and linearly scan and score them all in application code"
    answer: 0
    explanation: |
      At single-node scale with heavy relational filtering/joins and existing Postgres ops,
      pgvector avoids a second system to run and sync, gives ACID and SQL filtering, and handles
      millions of vectors well. Dedicated DBs earn their keep at much larger scale/QPS.
    ref: "concepts.md#pgvector-vs-dedicated-vector-databases"

  - id: vector-databases-similarity-search-050
    difficulty: intermediate
    tags: [dedicated, scaling]
    question: |
      Which is a genuine advantage of dedicated vector databases (Pinecone/Milvus/Weaviate/Qdrant)
      over a single-node pgvector deployment?
    options:
      - "They can join vectors to arbitrary normalized relational tables through full SQL far more easily than Postgres"
      - "Native horizontal sharding of the vector index to billions of vectors, plus rich quantization and built-in hybrid search"
      - "They guarantee full ACID multi-statement transactions across arbitrary unrelated tables like a relational engine"
      - "They remove the need to pick a distance metric by auto-detecting the right one from the stored vectors"
    answer: 1
    explanation: |
      Dedicated vector DBs are built for distributed/sharded ANN at billions of vectors, high
      QPS, advanced quantization (SQ/PQ/BQ), filterable HNSW, and built-in hybrid + RRF. The
      trade-off is running and syncing a separate system from your source of truth.
    ref: "concepts.md#pgvector-vs-dedicated-vector-databases"

  - id: vector-databases-similarity-search-051
    difficulty: advanced
    tags: [pgvector, sql, config]
    question: |
      Given this pgvector setup, which statement is correct?
      `CREATE INDEX ON items USING hnsw (embedding vector_cosine_ops) WITH (m=16, ef_construction=64);`
      then `SET hnsw.ef_search = 100;`
    options:
      - "ef_search is fixed at index build time and, once created, can never be changed for the duration of a session"
      - "The vector_cosine_ops opclass forces every query on this index to use the <-> (L2) distance operator instead"
      - "hnsw.ef_search is a runtime knob raising recall (at higher latency) without rebuilding the index"
      - "The m=16 setting controls how many coarse IVF cells (nlist) the index scans per query at search time"
    answer: 2
    explanation: |
      hnsw.ef_search is a per-session runtime parameter that raises recall at the cost of latency
      and needs no rebuild. m and ef_construction are build-time. vector_cosine_ops pairs with the
      <=> cosine operator; m is graph degree, not IVF's nlist.
    ref: "concepts.md#pgvector-vs-dedicated-vector-databases"

  - id: vector-databases-similarity-search-052
    difficulty: advanced
    tags: [pgvector, filtering, iterative-scan]
    question: |
      pgvector's `iterative_scan` (0.8+) primarily addresses which problem?
    options:
      - "Automatically choosing the correct distance metric for a query based on how the vectors were stored"
      - "Transparently sharding a single HNSW index across multiple Postgres nodes for horizontal scale-out"
      - "Compressing stored float32 vectors down to int8 codes to cut the index's resident memory footprint"
      - "Returning too few rows after a selective metadata filter by re-scanning with a larger candidate set until enough matches are found"
    answer: 3
    explanation: |
      Iterative scan tackles the 'too few results after filtering' issue: instead of a single
      fixed-size ANN scan whose matches get filtered away, it widens the search iteratively until
      it collects enough rows satisfying the predicate.
    ref: "concepts.md#pgvector-vs-dedicated-vector-databases"

  - id: vector-databases-similarity-search-053
    difficulty: intermediate
    tags: [sync, source-of-truth, ops]
    question: |
      Best practice for keeping a dedicated vector DB consistent with your primary datastore is to:
    options:
      - "Treat the vector DB as a derived index, updated via CDC/streaming or dual writes, and re-embed on model change"
      - "Promote the vector DB to the authoritative system of record and decommission the primary relational store"
      - "Manually export the primary store to a CSV once a year and bulk-reload the entire vector index from it"
      - "Load it once at launch and never update it again, since embeddings are assumed to stay valid forever"
    answer: 0
    explanation: |
      The vector DB is a derived index, not the source of truth. Keep it in sync via CDC/streaming
      or dual writes, and re-embed content when the embedding model changes, since embeddings from
      different models are incomparable.
    ref: "concepts.md#pgvector-vs-dedicated-vector-databases"

  - id: vector-databases-similarity-search-054
    difficulty: intermediate
    tags: [evaluation, recall, benchmarking]
    question: |
      How is ANN search quality standardly evaluated (e.g. ann-benchmarks methodology)?
    options:
      - "By counting total rows in the index"
      - "By measuring recall@k against an exact-kNN ground truth, together with latency percentiles/QPS at that recall"
      - "By the size of the embedding model in GB"
      - "By the number of graph layers"
    answer: 1
    explanation: |
      You compute recall@k against exact-kNN ground truth and report it alongside latency
      percentiles and QPS. The right comparison is recall-at-a-given-latency (or QPS), since any
      index can hit high recall if allowed unlimited time.
    ref: "concepts.md#the-ann-problem-why-exact-knn-doesnt-scale"
