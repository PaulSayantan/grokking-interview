topic: "Relational Modeling & Normalization"
domain: messaging-databases
topic_slug: relational-modeling-normalization
version: 1
questions:
  - id: relational-modeling-normalization-001
    difficulty: beginner
    tags: [relational-model, terminology]
    question: |
      In the relational model, what does a "tuple" correspond to in SQL?
    options:
      - "A column"
      - "A row"
      - "A table"
      - "A data type"
    answer: 1
    explanation: |
      A relation is a set of tuples over a fixed set of attributes. In SQL a
      relation is a table, a tuple is a row, and an attribute is a column. The
      domain (set of legal values) maps to a column's data type plus constraints.
    ref: "concepts.md#the-relational-model"

  - id: relational-modeling-normalization-002
    difficulty: beginner
    tags: [relational-model, ordering]
    question: |
      Why must you write an ORDER BY clause to get rows back in a defined order?
    options:
      - "Because SQL engines physically sort every table by its primary key and only re-sort the result when explicitly asked"
      - "Because a table's secondary indexes always store their entries in hash-randomized order that ORDER BY then reverses"
      - "Because the ANSI SQL standard explicitly forbids engines from returning sorted results unless spare CPU budget allows it"
      - "Because a relation is a set, which has no inherent row order; physical order is an implementation detail"
    answer: 3
    explanation: |
      A relation is mathematically a set of tuples, so there is no inherent order
      to rows. Any order you observe without ORDER BY is an accident of physical
      storage/plan and can change. ORDER BY is the only way to guarantee ordering.
    ref: "concepts.md#the-relational-model"

  - id: relational-modeling-normalization-003
    difficulty: intermediate
    tags: [null, three-valued-logic]
    question: |
      A query uses WHERE status = NULL and returns zero rows even though many
      rows have a NULL status. Why?
    options:
      - "NULL can only be compared against numeric columns, so a text status column silently returns no matching rows"
      - "The column must carry a dedicated NULL-aware index before an equality comparison against NULL will ever evaluate"
      - "Comparing anything to NULL yields UNKNOWN (not TRUE), so the row is not selected; you must use IS NULL"
      - "NULL equals NULL internally, so all NULL rows first match and are then discarded by a hidden deduplication pass"
    answer: 2
    explanation: |
      SQL uses three-valued logic. Any comparison with NULL evaluates to UNKNOWN,
      and WHERE only keeps rows where the predicate is TRUE. So = NULL never
      matches; you must write IS NULL / IS NOT NULL.
    ref: "concepts.md#the-relational-model"

  - id: relational-modeling-normalization-004
    difficulty: intermediate
    tags: [relational-model, set-vs-bag]
    question: |
      Which statement about SQL tables versus the pure relational model is correct?
    options:
      - "SQL tables strictly forbid duplicate rows exactly like mathematical relations, rejecting any repeat at insert time"
      - "SQL tables are technically multisets (bags) and can hold duplicate rows unless a key or UNIQUE constraint prevents it"
      - "SQL tables guarantee a permanently stable physical row order fixed at the moment each row is first inserted"
      - "SQL tables cannot represent a valid relation at all unless you first declare an explicit surrogate integer key"
    answer: 1
    explanation: |
      The pure relational model forbids duplicate tuples (every relation has a
      key). SQL relaxes this: tables are bags/multisets and can contain duplicate
      rows unless a PRIMARY KEY or UNIQUE constraint enforces uniqueness.
    ref: "concepts.md#the-relational-model"

  - id: relational-modeling-normalization-005
    difficulty: beginner
    tags: [keys, primary-key]
    question: |
      What two properties does declaring a PRIMARY KEY implicitly enforce?
    options:
      - "UNIQUE and NOT NULL"
      - "NOT NULL and DEFAULT 0"
      - "UNIQUE and indexed descending"
      - "CHECK and FOREIGN KEY"
    answer: 0
    explanation: |
      A primary key is the chosen candidate key and implies both UNIQUE (no two
      rows share it) and NOT NULL (every row must have an identity). A table has
      at most one primary key.
    ref: "concepts.md#keys-primary-candidate-foreign-composite-surrogate-vs-natural"

  - id: relational-modeling-normalization-006
    difficulty: intermediate
    tags: [keys, candidate-key, superkey]
    question: |
      What distinguishes a candidate key from a general superkey?
    options:
      - "A candidate key must always be a single column, while a superkey is the term used for any multi-column key"
      - "A superkey is by definition always the table's chosen primary key, whereas a candidate key can never be selected as it"
      - "A candidate key is permitted to contain NULL values in its columns, but a superkey must be entirely NOT NULL"
      - "A candidate key is a minimal superkey — no attribute can be removed without losing uniqueness"
    answer: 3
    explanation: |
      A superkey uniquely identifies rows but may contain redundant attributes. A
      candidate key is a minimal superkey: removing any attribute breaks
      uniqueness. The primary key is one chosen candidate key.
    ref: "concepts.md#keys-primary-candidate-foreign-composite-surrogate-vs-natural"

  - id: relational-modeling-normalization-007
    difficulty: beginner
    tags: [keys, foreign-key, referential-integrity]
    question: |
      What does a FOREIGN KEY constraint enforce?
    options:
      - "That every value in the constrained column stays unique across the entire table, like a UNIQUE constraint"
      - "That each child value exists as a key value in the referenced table, or is NULL — i.e. referential integrity"
      - "That the constrained column can never hold a NULL value and must always carry an explicit populated entry"
      - "That the child rows are physically stored on disk in exactly the same clustered order as their parent rows"
    answer: 1
    explanation: |
      A foreign key enforces referential integrity: every non-NULL value in the
      child column must match an existing key value in the parent table. It
      prevents orphaned references.
    ref: "concepts.md#keys-primary-candidate-foreign-composite-surrogate-vs-natural"

  - id: relational-modeling-normalization-008
    difficulty: intermediate
    tags: [keys, surrogate, natural]
    question: |
      Which is the strongest argument for a surrogate primary key over a natural key?
    options:
      - "Surrogate keys never change, whereas natural attributes (email, name) can change and are not always truly unique"
      - "Surrogate keys cause queries to automatically return rows sorted in their original insertion order without ORDER BY"
      - "Surrogate keys entirely remove the need for any UNIQUE constraints on the table's natural business attributes"
      - "Natural keys such as email or account number physically cannot be indexed by the storage engine at all"
    answer: 0
    explanation: |
      Surrogate keys are system-generated with no business meaning, so they are
      stable and narrow. Natural attributes can change (breaking every FK) and may
      not be reliably unique. Best practice: surrogate PK plus a UNIQUE constraint
      on the natural key.
    ref: "concepts.md#keys-primary-candidate-foreign-composite-surrogate-vs-natural"

  - id: relational-modeling-normalization-009
    difficulty: advanced
    tags: [keys, uuid, innodb, clustered-index]
    question: |
      Why can a random UUIDv4 primary key hurt insert performance in InnoDB
      specifically?
    options:
      - "UUIDs at 128 bits exceed InnoDB's maximum index-key width, so they cannot be indexed and force full table scans"
      - "InnoDB flatly rejects any non-integer primary key, so a UUID must be silently converted to a hashed integer first"
      - "UUID primary keys automatically disable InnoDB's query cache, so every lookup re-executes against disk each time"
      - "InnoDB clusters the table on the PK, so random UUIDs scatter inserts across the B-tree causing page splits and poor cache locality"
    answer: 3
    explanation: |
      InnoDB stores rows in a clustered index ordered by the primary key. A
      monotonic auto-increment appends to the rightmost leaf; a random UUIDv4
      inserts scatter across the whole index, causing page splits, fragmentation,
      and poor buffer-pool locality. Time-ordered UUIDv7/ULID mitigates this.
    ref: "concepts.md#keys-primary-candidate-foreign-composite-surrogate-vs-natural"

  - id: relational-modeling-normalization-010
    difficulty: intermediate
    tags: [keys, composite-key]
    question: |
      A junction table order_line has columns (order_id, product_id, qty). The
      natural way to identify a line is the pair (order_id, product_id). What kind
      of key is that pair?
    options:
      - "A composite (compound) key"
      - "A foreign key"
      - "A surrogate key"
      - "An alternate key"
    answer: 0
    explanation: |
      A key made of two or more columns is a composite/compound key. Here
      (order_id, product_id) together identify a line item; each column is also
      individually a foreign key to its parent table.
    ref: "concepts.md#keys-primary-candidate-foreign-composite-surrogate-vs-natural"

  - id: relational-modeling-normalization-011
    difficulty: beginner
    tags: [er-modeling, cardinality]
    question: |
      One customer can place many orders, but each order belongs to exactly one
      customer. What cardinality is this, and where does the foreign key go?
    options:
      - "One-to-many; the FK goes on the 'many' side (orders.customer_id)"
      - "Many-to-many; you must add a separate junction table holding a foreign key to each of the two sides"
      - "One-to-one; the FK can be placed on either side since both entities appear exactly once in the pairing"
      - "One-to-many; the FK goes on the 'one' side (customer.order_id)"
    answer: 0
    explanation: |
      This is one-to-many. The foreign key is placed on the many side, so
      orders.customer_id references customer(customer_id). Putting a single
      order_id on customer could not represent many orders.
    ref: "concepts.md#er-modeling-and-cardinality"

  - id: relational-modeling-normalization-012
    difficulty: intermediate
    tags: [er-modeling, many-to-many, junction-table]
    question: |
      Students can enroll in many courses and each course has many students. How
      do you model this many-to-many relationship in a relational schema?
    options:
      - "Introduce a junction (associative) table whose PK is the composite of both foreign keys"
      - "Add a single nullable course_id foreign-key column directly to the student table for the current enrollment"
      - "Store a comma-separated list of enrolled course IDs packed into one text column on each student row"
      - "Add a UNIQUE constraint that spans columns in both the student and course tables simultaneously"
    answer: 0
    explanation: |
      Relational tables cannot store M:N directly. You introduce a junction/bridge
      table (e.g. enrollment) holding a foreign key to each side, typically with a
      composite primary key (student_id, course_id). Relationship attributes like
      enrolled_on live on that table.
    ref: "concepts.md#er-modeling-and-cardinality"

  - id: relational-modeling-normalization-013
    difficulty: intermediate
    tags: [er-modeling, participation, optionality]
    question: |
      Every order must be associated with a customer (mandatory participation).
      How is that best enforced at the schema level?
    options:
      - "A CHECK constraint that counts the related customer rows and rejects the order when the count is zero"
      - "Declaring orders.customer_id NOT NULL together with the foreign key"
      - "A trigger firing after each insert that queries the customer table and rolls back when no match is found"
      - "Making customer_id the sole primary key of the orders table so that every order row is a customer"
    answer: 1
    explanation: |
      Mandatory (total) participation maps to a NOT NULL foreign key: the order
      cannot exist without a customer_id, and the FK guarantees that customer
      exists. Optional participation would use a nullable FK.
    ref: "concepts.md#er-modeling-and-cardinality"

  - id: relational-modeling-normalization-014
    difficulty: intermediate
    tags: [er-modeling, one-to-one]
    question: |
      How do you typically implement a one-to-one relationship such as user ↔
      user_profile without merging the tables?
    options:
      - "Put a foreign key on one side with a UNIQUE constraint on it"
      - "Use two foreign keys, one on each table, pointing at each other with no uniqueness constraints applied"
      - "Create a junction table keyed on the composite of both entities' identifiers, as with many-to-many"
      - "Add a CHECK constraint that compares the row counts of the two tables and requires them to match"
    answer: 0
    explanation: |
      A one-to-one is implemented by placing a foreign key on one side and adding a
      UNIQUE constraint to that FK column, so at most one profile row can reference
      a given user. Alternatively the two entities can be merged into one table.
    ref: "concepts.md#er-modeling-and-cardinality"

  - id: relational-modeling-normalization-015
    difficulty: intermediate
    tags: [functional-dependencies, definition]
    question: |
      A functional dependency X → Y in a relation means:
    options:
      - "Any two tuples that agree on X must also agree on Y"
      - "The attributes X and Y are physically stored together in the same composite index structure on disk"
      - "The value of Y is always guaranteed to be numerically larger than the corresponding value of X"
      - "Deleting the value of X from a row automatically cascades and deletes the value of Y as well"
    answer: 0
    explanation: |
      X → Y ("X determines Y") means any two rows with the same X value must have
      the same Y value. It is a semantic statement about the data derived from
      domain knowledge, not about one table instance.
    ref: "concepts.md#functional-dependencies"

  - id: relational-modeling-normalization-016
    difficulty: advanced
    tags: [functional-dependencies, closure, superkey]
    question: |
      You compute the attribute closure X⁺ and find it includes every attribute of
      the relation. What does that tell you about X?
    options:
      - "X is a foreign key"
      - "X is a superkey of the relation"
      - "X violates 1NF"
      - "X must be a single attribute"
    answer: 1
    explanation: |
      If the closure X⁺ (all attributes functionally determined by X, via
      Armstrong's axioms) covers every attribute, then X uniquely determines every
      row and is therefore a superkey. If X is also minimal, it is a candidate key.
    ref: "concepts.md#functional-dependencies"

  - id: relational-modeling-normalization-017
    difficulty: advanced
    tags: [functional-dependencies, transitive]
    question: |
      Given employee_id → dept_id and dept_id → dept_name, what kind of dependency
      does dept_name have on employee_id?
    options:
      - "A partial dependency"
      - "A trivial dependency"
      - "A multivalued dependency"
      - "A transitive dependency"
    answer: 3
    explanation: |
      Because employee_id → dept_id → dept_name, dept_name depends on the key only
      transitively (through dept_id, a non-key attribute). This transitive
      dependency is exactly what 3NF forbids.
    ref: "concepts.md#functional-dependencies"

  - id: relational-modeling-normalization-018
    difficulty: advanced
    tags: [functional-dependencies, partial, prime-attribute]
    question: |
      A table has composite key (student_id, course_id) and FD student_id →
      student_name. How is student_name's dependency on the key classified, and
      which normal form does it break?
    options:
      - "Full dependency; breaks 1NF"
      - "Partial dependency (on part of the key); breaks 2NF"
      - "Transitive dependency; breaks 3NF"
      - "Trivial dependency; breaks BCNF"
    answer: 1
    explanation: |
      student_name depends on only part of the composite key (student_id), i.e. a
      partial dependency. 2NF requires every non-prime attribute to depend on the
      whole key, so this violates 2NF.
    ref: "concepts.md#functional-dependencies"

  - id: relational-modeling-normalization-019
    difficulty: intermediate
    tags: [functional-dependencies, trivial]
    question: |
      Which of these is a trivial functional dependency?
    options:
      - "{a, b} → c"
      - "{a, b} → a"
      - "a → b"
      - "zip → city"
    answer: 1
    explanation: |
      A trivial FD is X → Y where Y is a subset of X. {a,b} → a holds
      automatically because a is already part of the left side. The others assert
      non-trivial dependencies about the data.
    ref: "concepts.md#functional-dependencies"

  - id: relational-modeling-normalization-020
    difficulty: beginner
    tags: [normal-forms, 1nf]
    question: |
      A column phone_numbers stores "555-1234, 555-9876" as one string. Which
      normal form does this violate?
    options:
      - "1NF (values must be atomic / single-valued)"
      - "2NF (partial dependency on a composite key)"
      - "3NF (a transitive dependency on the key)"
      - "BCNF (a determinant that is not a superkey)"
    answer: 0
    explanation: |
      1NF requires atomic, single-valued attributes with no repeating groups. A
      comma-separated list packs multiple values into one column, violating 1NF.
      The fix is to split into separate rows (a child table).
    ref: "concepts.md#normal-forms-1nf-to-bcnf-with-decomposition"

  - id: relational-modeling-normalization-021
    difficulty: intermediate
    tags: [normal-forms, 2nf]
    question: |
      order_line(order_id, product_id, qty, product_name, product_price) has PK
      (order_id, product_id). Why is it not in 2NF and how do you fix it?
    options:
      - "It has a transitive dependency through qty; split product_price into its own dedicated table"
      - "qty is nullable so the key is incomplete; add NOT NULL to qty and the table then satisfies 2NF"
      - "product_name and product_price depend only on product_id (part of the key); move them to a product table"
      - "It has a multivalued dependency between product_name and product_price; apply 4NF to separate them"
    answer: 2
    explanation: |
      product_name and product_price are determined by product_id alone — a
      partial dependency on the composite key — which breaks 2NF. Decompose into
      order_line(order_id, product_id, qty) and product(product_id, product_name,
      product_price).
    ref: "concepts.md#normal-forms-1nf-to-bcnf-with-decomposition"

  - id: relational-modeling-normalization-022
    difficulty: intermediate
    tags: [normal-forms, 3nf]
    question: |
      employee(employee_id, name, dept_id, dept_name) has PK employee_id and FD
      dept_id → dept_name. Which normal form is violated?
    options:
      - "3NF (transitive dependency: employee_id → dept_id → dept_name)"
      - "2NF (a non-prime attribute depends on only part of the composite key)"
      - "1NF (the dept_name column still holds a non-atomic repeating group)"
      - "It is already in BCNF, since every determinant here is a superkey"
    answer: 0
    explanation: |
      dept_name depends on the non-key attribute dept_id, which depends on the key
      — a transitive dependency. 3NF forbids that; decompose into employee(...,
      dept_id) and department(dept_id, dept_name). (2NF is fine since the key is a
      single column.)
    ref: "concepts.md#normal-forms-1nf-to-bcnf-with-decomposition"

  - id: relational-modeling-normalization-023
    difficulty: advanced
    tags: [normal-forms, bcnf, determinant]
    question: |
      What is the defining condition of Boyce–Codd Normal Form (BCNF)?
    options:
      - "Every non-key attribute is atomic and free of any repeating groups"
      - "There are no composite keys, so every determinant is a single column"
      - "For every non-trivial FD X → Y, X is a superkey"
      - "Every table has a system-generated surrogate key as its primary key"
    answer: 2
    explanation: |
      BCNF requires that for every non-trivial functional dependency X → Y, the
      determinant X is a superkey. This is stricter than 3NF, which permits a prime
      attribute to be transitively determined when candidate keys overlap.
    ref: "concepts.md#normal-forms-1nf-to-bcnf-with-decomposition"

  - id: relational-modeling-normalization-024
    difficulty: advanced
    tags: [normal-forms, bcnf, 3nf, dependency-preservation]
    question: |
      Why is 3NF, rather than BCNF, usually the practical decomposition target?
    options:
      - "BCNF cannot be achieved without a lossy decomposition that permanently drops rows from the original relation and cannot rebuild them"
      - "BCNF requires you to denormalize the schema back to 2NF first, dropping its foreign keys before its stricter constraints can be applied"
      - "3NF removes every multivalued and join dependency from a relation, whereas a BCNF decomposition deliberately leaves all of those in place"
      - "3NF is always achievable via a lossless AND dependency-preserving decomposition, whereas a BCNF decomposition may sacrifice dependency preservation"
    answer: 3
    explanation: |
      3NF can always be reached with a decomposition that is both lossless and
      dependency-preserving. BCNF is always lossless but may not preserve all FDs
      in single-table constraints, so 3NF is the common practical target.
    ref: "concepts.md#normal-forms-1nf-to-bcnf-with-decomposition"

  - id: relational-modeling-normalization-025
    difficulty: advanced
    tags: [normal-forms, lossless-join, decomposition]
    question: |
      A binary decomposition of R into R1 and R2 is guaranteed lossless when:
    options:
      - "R1 and R2 have no columns in common, so the join produces a clean Cartesian product"
      - "Both R1 and R2 are given their own independent system-generated surrogate primary keys"
      - "R1 and R2 end up holding exactly the same number of rows after the decomposition"
      - "The common attributes (R1 ∩ R2) form a superkey of at least one of R1 or R2"
    answer: 3
    explanation: |
      A binary decomposition is lossless iff the shared attributes form a superkey
      of at least one of the two relations, guaranteeing the natural join
      reconstructs exactly the original rows with no spurious tuples.
    ref: "concepts.md#normal-forms-1nf-to-bcnf-with-decomposition"

  - id: relational-modeling-normalization-026
    difficulty: advanced
    tags: [normal-forms, 4nf, multivalued-dependency]
    question: |
      A table person_facts(person_id, skill, language) stores each person's skills
      and languages, which are independent of each other. Joining them produces a
      Cartesian explosion of rows. Which normal form addresses this and how?
    options:
      - "2NF; remove the partial dependency of skill and language on part of the composite key"
      - "3NF; remove the transitive dependency chaining skill through language back to person_id"
      - "1NF; make the skill and language columns atomic by splitting their comma-separated values"
      - "4NF; separate the two independent multivalued dependencies into two tables"
    answer: 3
    explanation: |
      Two independent multivalued facts keyed by the same attribute cause a
      cross-product of rows — a non-trivial multivalued dependency. 4NF removes it
      by splitting into person_skill and person_language.
    ref: "concepts.md#normal-forms-1nf-to-bcnf-with-decomposition"

  - id: relational-modeling-normalization-027
    difficulty: beginner
    tags: [anomalies, update-anomaly]
    question: |
      A table repeats dept_location on every employee row. The Sales dept moves
      buildings and only some rows get updated. What is this problem called?
    options:
      - "Update anomaly"
      - "Deletion anomaly"
      - "Insertion anomaly"
      - "Referential anomaly"
    answer: 0
    explanation: |
      Storing the same fact redundantly means an update must touch every copy.
      Missing some leaves contradictory values for one department — an update
      anomaly. Normalization stores the fact once, eliminating it.
    ref: "concepts.md#anomalies-normalization-prevents"

  - id: relational-modeling-normalization-028
    difficulty: intermediate
    tags: [anomalies, insertion-anomaly]
    question: |
      In employee(emp_id, emp_name, dept_id, dept_name) with emp_id in the key, you
      cannot record a brand-new department that has no employees yet without
      inventing a fake employee or storing NULL key parts. This is a:
    options:
      - "Update anomaly"
      - "Join anomaly"
      - "Deletion anomaly"
      - "Insertion anomaly"
    answer: 3
    explanation: |
      An insertion anomaly: you cannot add a fact (the new department) because the
      table's key requires unrelated data (an employee). Separating department into
      its own table lets it exist independently.
    ref: "concepts.md#anomalies-normalization-prevents"

  - id: relational-modeling-normalization-029
    difficulty: intermediate
    tags: [anomalies, deletion-anomaly]
    question: |
      You delete the last employee in a department and the department's name and
      location disappear too, even though the department still exists. This is a:
    options:
      - "Deletion anomaly"
      - "Insertion anomaly"
      - "Update anomaly"
      - "Cascade anomaly"
    answer: 0
    explanation: |
      A deletion anomaly: removing a row unintentionally erases an independent fact
      that was co-located only because of poor design. Normalizing department into
      its own table preserves it.
    ref: "concepts.md#anomalies-normalization-prevents"

  - id: relational-modeling-normalization-030
    difficulty: intermediate
    tags: [anomalies, purpose-of-normalization]
    question: |
      What is the primary purpose of normalization?
    options:
      - "To minimize raw disk usage above all else, even at the cost of query correctness"
      - "To make every query run faster by guaranteeing fewer joins than a denormalized model"
      - "To store each fact in exactly one place so insert/update/delete anomalies become structurally impossible"
      - "To eliminate the need for secondary indexes by ordering rows purely by their primary key"
    answer: 2
    explanation: |
      Normalization is about correctness under change: one fact, one place. That
      eliminates update, insertion, and deletion anomalies. Storage savings are a
      side effect, and it can actually make some reads slower (more joins).
    ref: "concepts.md#anomalies-normalization-prevents"

  - id: relational-modeling-normalization-031
    difficulty: beginner
    tags: [constraints, check]
    question: |
      Which constraint best enforces that a product's price is never negative?
    options:
      - "UNIQUE (price)"
      - "CHECK (price >= 0)"
      - "NOT NULL on price"
      - "FOREIGN KEY (price)"
    answer: 1
    explanation: |
      A CHECK constraint enforces an arbitrary boolean predicate per row, e.g.
      CHECK (price >= 0). Note MySQL only began enforcing CHECK constraints in
      8.0.16; earlier versions parsed but ignored them.
    ref: "concepts.md#constraints-not-null-unique-check-foreign-key-actions"

  - id: relational-modeling-normalization-032
    difficulty: advanced
    tags: [constraints, check, three-valued-logic]
    question: |
      A CHECK (discount < price) constraint exists. A row is inserted where
      discount is NULL. What happens?
    options:
      - "The insert is accepted, because the predicate evaluates to UNKNOWN, and CHECK only rejects rows that evaluate to FALSE"
      - "The insert is rejected because every CHECK constraint implicitly adds a NOT NULL rule to each column it names"
      - "The insert is rejected because a NULL operand makes the comparison FALSE and so fails the check predicate"
      - "The database aborts and raises a dedicated three-valued-logic error that must be caught by the application"
    answer: 0
    explanation: |
      CHECK constraints reject a row only when the predicate is FALSE. With a NULL
      operand the comparison is UNKNOWN, which is treated as satisfied, so the row
      is accepted. Add NOT NULL separately if NULL must be disallowed.
    ref: "concepts.md#constraints-not-null-unique-check-foreign-key-actions"

  - id: relational-modeling-normalization-033
    difficulty: intermediate
    tags: [constraints, unique, null]
    question: |
      In standard SQL and most engines (e.g. PostgreSQL default), how are NULLs
      treated by a UNIQUE constraint?
    options:
      - "Only one NULL is allowed in the column, since the engine treats all NULLs as one shared marker value"
      - "NULLs are always rejected outright by UNIQUE columns, which implicitly enforce NOT NULL on the column"
      - "Multiple NULLs are allowed, because NULL is not considered equal to NULL"
      - "NULLs count as duplicates of zero, so at most one NULL and one literal zero can coexist in the column"
    answer: 2
    explanation: |
      Because NULL ≠ NULL under three-valued logic, most engines allow multiple
      NULLs in a UNIQUE column. PostgreSQL 15+ can opt into the opposite with
      UNIQUE NULLS NOT DISTINCT; SQL Server historically allowed only one NULL.
    ref: "concepts.md#constraints-not-null-unique-check-foreign-key-actions"

  - id: relational-modeling-normalization-034
    difficulty: intermediate
    tags: [constraints, foreign-key-actions, cascade]
    question: |
      A foreign key on order_line.order_id is declared ON DELETE CASCADE. What
      happens when you delete an order that has line items?
    options:
      - "The delete is rejected because child line items still reference the parent order row"
      - "The order_id column in each surviving line item is quietly set to NULL by the cascade"
      - "The line items are reassigned to their column's default order_id value defined in the DDL"
      - "The order's line-item rows are automatically deleted too"
    answer: 3
    explanation: |
      ON DELETE CASCADE propagates the delete: removing the parent order also
      deletes its child line-item rows. This is convenient but risky, as one delete
      can silently remove large subtrees under long locks.
    ref: "concepts.md#constraints-not-null-unique-check-foreign-key-actions"

  - id: relational-modeling-normalization-035
    difficulty: intermediate
    tags: [constraints, foreign-key-actions, restrict, set-null]
    question: |
      You want to prevent deleting a product while it still appears on any order
      line. Which referential action expresses that?
    options:
      - "ON DELETE CASCADE"
      - "ON DELETE SET NULL"
      - "ON DELETE RESTRICT (or NO ACTION)"
      - "ON DELETE SET DEFAULT"
    answer: 2
    explanation: |
      RESTRICT (or NO ACTION) rejects the parent delete while referencing children
      exist. CASCADE would delete the lines, SET NULL would orphan them (and needs
      a nullable FK), and SET DEFAULT would point them at a default product.
    ref: "concepts.md#constraints-not-null-unique-check-foreign-key-actions"

  - id: relational-modeling-normalization-036
    difficulty: advanced
    tags: [constraints, foreign-key, indexing, postgres, innodb]
    question: |
      Which statement about indexing foreign-key columns is accurate?
    options:
      - "Both PostgreSQL and MySQL/InnoDB automatically create an index on every foreign-key column you declare"
      - "PostgreSQL auto-indexes FK columns while InnoDB never does, requiring you to add the index by hand there"
      - "InnoDB requires and auto-creates an index on the FK column, but PostgreSQL does NOT auto-index FK columns"
      - "Neither engine allows any index on a foreign-key column, so FK joins must always fall back to a full scan"
    answer: 2
    explanation: |
      InnoDB requires an index on the referencing column and creates one
      automatically. PostgreSQL does not auto-index FK columns, so FK-heavy
      delete/join workloads can be slow until you add the index yourself.
    ref: "concepts.md#constraints-not-null-unique-check-foreign-key-actions"

  - id: relational-modeling-normalization-037
    difficulty: intermediate
    tags: [constraints, set-null]
    question: |
      ON DELETE SET NULL is chosen for a child FK column. What is a prerequisite
      for this to be valid?
    options:
      - "The FK column must be part of the primary key"
      - "The FK column must be nullable"
      - "The parent table must have a surrogate key"
      - "The child table must be empty"
    answer: 1
    explanation: |
      SET NULL writes NULL into the child FK when the parent is deleted, so the
      column must be nullable. It cannot be used if the FK column is NOT NULL or
      part of the primary key.
    ref: "concepts.md#constraints-not-null-unique-check-foreign-key-actions"

  - id: relational-modeling-normalization-038
    difficulty: beginner
    tags: [denormalization, definition]
    question: |
      What is denormalization?
    options:
      - "Stripping every NOT NULL, CHECK, and foreign-key constraint out of a schema so write validation is skipped entirely"
      - "Decomposing a table all the way into fifth normal form to remove every remaining join dependency it has"
      - "Deliberately reintroducing redundancy (duplicated or precomputed data) to speed up reads at the cost of harder writes"
      - "Dropping a table's secondary indexes and reclaiming their pages so the on-disk storage footprint shrinks"
    answer: 2
    explanation: |
      Denormalization intentionally adds redundancy — duplicated columns,
      precomputed aggregates, pre-joined wide tables — to make reads faster,
      accepting slower/riskier writes and staleness. It is a targeted optimization,
      not a starting point.
    ref: "concepts.md#denormalization-and-when-its-justified"

  - id: relational-modeling-normalization-039
    difficulty: intermediate
    tags: [denormalization, when-justified]
    question: |
      In which scenario is denormalization most clearly justified?
    options:
      - "A write-heavy OLTP table taking frequent concurrent updates from many simultaneous sessions"
      - "A table that must guarantee strict, immediate consistency on every read"
      - "A read-heavy reporting query with an expensive repeated join, where source data changes rarely"
      - "Any table at all, since a normalized model is always inherently slower to query"
    answer: 2
    explanation: |
      Denormalization pays off for read-heavy/reporting workloads with expensive
      repeated joins and rarely-changing source data. Write-heavy or strict-
      consistency workloads suffer, because every duplicated fact must be kept in
      sync and can be temporarily stale.
    ref: "concepts.md#denormalization-and-when-its-justified"

  - id: relational-modeling-normalization-040
    difficulty: intermediate
    tags: [denormalization, cost, consistency]
    question: |
      What is the fundamental cost you take on when you denormalize?
    options:
      - "You permanently lose the ability to express queries in declarative SQL and must hand-code access paths"
      - "The query planner can no longer build or use any secondary index on the widened redundant columns"
      - "Foreign-key constraints silently stop being enforced once columns are duplicated across several tables"
      - "You reintroduce the very anomalies normalization removed — every duplicated fact must be kept in sync and can be stale"
    answer: 3
    explanation: |
      Denormalization brings back update/insert/delete anomalies: each redundant
      copy must be maintained (triggers, app logic, materialized-view refresh, or
      CDC) and there is a staleness window. Only denormalize with a concrete
      consistency mechanism.
    ref: "concepts.md#denormalization-and-when-its-justified"

  - id: relational-modeling-normalization-041
    difficulty: advanced
    tags: [denormalization, materialized-view]
    question: |
      A team pre-joins a costly reporting query into a physical table refreshed on
      a schedule. Which mechanism most directly describes this?
    options:
      - "A materialized view"
      - "A foreign key cascade"
      - "A CHECK constraint"
      - "A candidate key"
    answer: 0
    explanation: |
      A materialized view stores the physical result of a query so reads hit
      precomputed data. PostgreSQL refreshes them manually/on schedule; some
      engines support incremental refresh. It is a common, disciplined form of
      denormalization for reporting.
    ref: "concepts.md#denormalization-and-when-its-justified"

  - id: relational-modeling-normalization-042
    difficulty: intermediate
    tags: [denormalization, best-practice]
    question: |
      What is the recommended sequence when deciding on normalization vs
      denormalization for a new OLTP schema?
    options:
      - "Denormalize aggressively first for raw speed, then normalize later only if data-integrity bugs actually appear"
      - "Always keep every entity together in one single wide table so that no query ever has to perform a join"
      - "Normalize (usually to 3NF) first, then denormalize specific hot paths backed by measurements and a consistency mechanism"
      - "Keep the schema in BCNF for all read paths and in 1NF for all write paths, switching between the two"
    answer: 2
    explanation: |
      The default is a normalized model (typically 3NF) so the DB guarantees
      correctness. Denormalize only specific, measured hot paths, and pair each with
      an explicit consistency mechanism (trigger, materialized view, CDC/event sync).
    ref: "concepts.md#denormalization-and-when-its-justified"

  - id: relational-modeling-normalization-043
    difficulty: beginner
    tags: [star-schema, fact-table, dimension]
    question: |
      In a star schema, what does the central fact table hold?
    options:
      - "Numeric measures (e.g. amount, quantity) plus foreign keys to dimension tables"
      - "Only the surrogate primary keys of every dimension, carrying no measures or event data of its own"
      - "The descriptive textual attributes (names, categories, labels) used purely for grouping and filtering reports"
      - "Fully normalized sub-dimension lookup rows split out of the surrounding dimension tables"
    answer: 0
    explanation: |
      The fact table stores measurements/events — numeric measures and foreign keys
      to the dimension tables. Dimensions hold the descriptive context (date,
      product, store, customer) you filter and group by.
    ref: "concepts.md#star-vs-snowflake-schema-for-analytics"

  - id: relational-modeling-normalization-044
    difficulty: intermediate
    tags: [star-schema, snowflake-schema, comparison]
    question: |
      What is the key structural difference between a star and a snowflake schema?
    options:
      - "A star schema has no central fact table at all, whereas a snowflake schema always adds one"
      - "A star schema keys everything on surrogate integers, whereas a snowflake schema must use natural business keys"
      - "Star dimensions are denormalized (flat); snowflake dimensions are normalized into sub-tables"
      - "A snowflake schema always requires strictly fewer joins per analytical query than an equivalent star schema"
    answer: 2
    explanation: |
      In a star schema each dimension is a single flat, denormalized table. A
      snowflake normalizes dimensions into sub-tables (e.g. product → category →
      department), reducing redundancy but adding joins per query.
    ref: "concepts.md#star-vs-snowflake-schema-for-analytics"

  - id: relational-modeling-normalization-045
    difficulty: intermediate
    tags: [star-schema, tradeoffs]
    question: |
      Why do most data warehouses default to a star schema rather than a snowflake
      schema?
    options:
      - "Star schemas enforce referential integrity across dimensions far more strictly than snowflake schemas can"
      - "Star schemas dispense with the central fact table entirely, so there is one less table to scan per query"
      - "Snowflake schemas are fundamentally incompatible with mainstream BI and reporting tools and cannot be queried by them"
      - "Fewer joins mean simpler SQL and faster scans, and columnar compression makes the redundant dimension columns cheap"
    answer: 3
    explanation: |
      Analytical queries scan and aggregate; star schemas need fewer joins, produce
      simpler SQL, and are BI-tool friendly. Modern columnar storage compresses the
      redundant flat dimension columns cheaply, so query speed wins over storage
      savings.
    ref: "concepts.md#star-vs-snowflake-schema-for-analytics"

  - id: relational-modeling-normalization-046
    difficulty: advanced
    tags: [star-schema, olap-vs-oltp, normalization]
    question: |
      Why do OLTP schemas favor normalization while OLAP/warehouse schemas favor
      denormalized star schemas?
    options:
      - "OLAP database engines are structurally unable to define or enforce any integrity constraints on their tables"
      - "OLTP has concurrent transactional writes where 'one fact one place' protects correctness; OLAP does bulk ETL loads and scan-and-aggregate reads where fewer joins win"
      - "OLTP working sets are guaranteed to always be physically smaller in bytes than any OLAP warehouse dataset"
      - "Applying normalization is technically impossible once data is held in a columnar storage format"
    answer: 1
    explanation: |
      The optimization pressure is opposite. OLTP has many concurrent small writes,
      so normalization protects write correctness. OLAP writes are bulk ETL and
      reads are large aggregations, so denormalized stars minimize joins and scan
      cost.
    ref: "concepts.md#star-vs-snowflake-schema-for-analytics"

  - id: relational-modeling-normalization-047
    difficulty: advanced
    tags: [star-schema, scd, grain]
    question: |
      In dimensional modeling, what does a "Type 2 slowly changing dimension" do?
    options:
      - "Overwrites the changed attribute value in place on the existing row, deliberately keeping no prior history"
      - "Adds a new versioned dimension row when an attribute changes, preserving history"
      - "Deletes the entire dimension row the moment any of its tracked attributes changes, then reinserts a fresh one"
      - "Packs each successive version of the attribute into one comma-separated list column on a single dimension row"
    answer: 1
    explanation: |
      SCD Type 2 preserves history by inserting a new versioned row (often with
      effective-date/current-flag columns) each time a tracked attribute changes.
      Type 1 simply overwrites and keeps no history.
    ref: "concepts.md#star-vs-snowflake-schema-for-analytics"

  - id: relational-modeling-normalization-048
    difficulty: intermediate
    tags: [keys, alternate-key, unique]
    question: |
      A customer table uses a surrogate customer_id as its primary key but email
      must also be unique. What is email in this design, and how is it enforced?
    options:
      - "A foreign key back to a parent table, enforced with a REFERENCES clause on the email column"
      - "An alternate (candidate) key, enforced with a UNIQUE constraint"
      - "A composite key spanning customer_id and email, enforced by listing both in PRIMARY KEY"
      - "A prime attribute that forms part of the surrogate customer_id key itself"
    answer: 1
    explanation: |
      Email is a candidate key not chosen as the primary key — an alternate key.
      You enforce its uniqueness with a UNIQUE constraint, getting the business
      uniqueness guarantee alongside the stable surrogate PK.
    ref: "concepts.md#keys-primary-candidate-foreign-composite-surrogate-vs-natural"

  - id: relational-modeling-normalization-049
    difficulty: intermediate
    tags: [keys, identity, generated-always, postgres]
    question: |
      In PostgreSQL, why is GENERATED ALWAYS AS IDENTITY generally preferred over
      the legacy SERIAL pseudo-type for a surrogate primary key?
    options:
      - "SERIAL is restricted to 32-bit columns and cannot back a BIGINT surrogate key at all"
      - "IDENTITY is the ANSI-standard form and the DB owns the backing sequence (dropped with the table), avoiding SERIAL's loose ownership and manual-insert collision quirks"
      - "SERIAL secretly stores each generated value as a 128-bit UUID rather than as an integer"
      - "IDENTITY columns are automatically given a descending-order index that SERIAL columns never receive"
    answer: 1
    explanation: |
      GENERATED ALWAYS AS IDENTITY is SQL-standard and ties the sequence's
      lifecycle to the column (dropped with the table, cleaner grants). SERIAL is
      sugar that leaves the sequence loosely attached, and manual inserts can later
      collide with nextval() and raise duplicate-key errors. ALWAYS also blocks
      accidental manual values unless you use OVERRIDING SYSTEM VALUE.
    ref: "concepts.md#auto-generated-primary-keys-identity-vs-sequence-vs-uuid"

  - id: relational-modeling-normalization-050
    difficulty: advanced
    tags: [keys, uuid, uuidv7, uuidv4, index-locality]
    question: |
      You need a globally unique primary key generated on the client for a very
      high-insert table. Between UUIDv4 and UUIDv7, which should you choose and why?
    options:
      - "UUIDv4, because its full randomness spreads inserts evenly across index pages and eliminates hot-page contention"
      - "UUIDv4, because it encodes fewer bits than UUIDv7 and so occupies a narrower primary-key column"
      - "UUIDv7, because its leading millisecond timestamp makes values time-ordered, so inserts stay sequential and preserve index locality"
      - "Neither one — a 128-bit UUID value is fundamentally disallowed as a table's primary key"
    answer: 2
    explanation: |
      UUIDv7 prefixes a 48-bit Unix-millisecond timestamp, so newly generated keys
      sort roughly in insert order and append near the right edge of the B-tree /
      clustered index, avoiding page splits. UUIDv4 is fully random and scatters
      inserts, causing fragmentation and poor cache locality — the specific problem
      to avoid on insert-heavy tables. Both are 128 bits, so v4 is not smaller.
    ref: "concepts.md#auto-generated-primary-keys-identity-vs-sequence-vs-uuid"

  - id: relational-modeling-normalization-051
    difficulty: intermediate
    tags: [keys, auto-increment, mysql, gaps]
    question: |
      An application relies on MySQL AUTO_INCREMENT values being perfectly
      contiguous with no gaps. Why is this assumption unsafe?
    options:
      - "A rolled-back or failed insert still consumes the counter value, and bulk inserts may reserve ranges, so gaps are normal"
      - "The AUTO_INCREMENT counter is reset back to 1 automatically after every committed transaction on the table"
      - "AUTO_INCREMENT hands out values in a randomized order rather than a monotonically increasing sequence"
      - "MySQL recycles the ids of deleted rows and renumbers every later row down to keep the sequence dense"
    answer: 0
    explanation: |
      AUTO_INCREMENT is a table-level counter; a value consumed by a rolled-back or
      failed insert is not returned, and lock modes / bulk inserts can reserve
      ranges. Gaps are expected behavior, so never treat the sequence as a
      gapless, contiguous numbering.
    ref: "concepts.md#auto-generated-primary-keys-identity-vs-sequence-vs-uuid"

  - id: relational-modeling-normalization-052
    difficulty: advanced
    tags: [keys, bigint, uuid, tradeoffs]
    question: |
      A single primary database mints all keys and the table will hold billions of
      rows referenced by several foreign keys. Which surrogate key minimizes total
      index and FK storage while keeping good insert locality?
    options:
      - "A random UUIDv4 stored as CHAR(36)"
      - "A composite natural key of several VARCHARs"
      - "A UUIDv7 stored as text"
      - "A BIGINT identity/auto-increment column"
    answer: 3
    explanation: |
      With a single key-minting database, a monotonic BIGINT identity is 8 bytes vs
      a UUID's 16, and that width compounds across every secondary index and foreign
      key. It also appends to the right edge for good locality. UUIDs shine mainly
      when you need coordination-free/client-side generation, which is not required
      here.
    ref: "concepts.md#auto-generated-primary-keys-identity-vs-sequence-vs-uuid"

  - id: relational-modeling-normalization-053
    difficulty: intermediate
    tags: [keys, uuid, storage, mysql]
    question: |
      When storing UUID primary keys in MySQL/InnoDB, why is BINARY(16) strongly
      preferred over CHAR(36)?
    options:
      - "A CHAR(36) column holding a UUID is not eligible to be indexed by InnoDB at all"
      - "BINARY(16) deliberately stores UUID bytes in random order, which is what improves clustered-index locality"
      - "CHAR(36) more than doubles the per-value size, bloating the clustered index and every secondary index that copies the PK"
      - "MySQL flatly refuses to store any UUID value that is kept in a textual CHAR or VARCHAR column"
    answer: 2
    explanation: |
      A UUID is 128 bits = 16 bytes. Storing it as the 36-character text form uses
      ~36+ bytes and, because InnoDB's secondary indexes carry a copy of the PK,
      that extra width multiplies across every index. BINARY(16) (with
      UUID_TO_BIN) keeps keys compact.
    ref: "concepts.md#auto-generated-primary-keys-identity-vs-sequence-vs-uuid"

  - id: relational-modeling-normalization-054
    difficulty: advanced
    tags: [keys, identity, generated-always, ddl]
    question: |
      A column is defined as GENERATED ALWAYS AS IDENTITY. An INSERT tries to supply
      an explicit value for it. What happens by default?
    options:
      - "The explicit value is silently ignored and a generated one is used"
      - "The statement is rejected unless it uses OVERRIDING SYSTEM VALUE"
      - "The column switches permanently to manual mode"
      - "The value is accepted and the internal sequence advances to match"
    answer: 1
    explanation: |
      With GENERATED ALWAYS, the database rejects a user-supplied value unless the
      INSERT explicitly says OVERRIDING SYSTEM VALUE. GENERATED BY DEFAULT AS
      IDENTITY, in contrast, allows manual values without that clause.
    ref: "concepts.md#auto-generated-primary-keys-identity-vs-sequence-vs-uuid"

  - id: relational-modeling-normalization-055
    difficulty: intermediate
    tags: [keys, identity, uuid, distributed]
    question: |
      Which requirement most justifies choosing a UUID surrogate key over an
      integer identity/auto-increment key despite the larger width?
    options:
      - "You must generate globally unique keys client-side without a database round-trip, e.g. for sharding, multi-primary writes, or offline creation"
      - "You want the smallest possible per-key index footprint, since a 16-byte UUID packs more compactly on disk than an 8-byte BIGINT"
      - "You want the primary key itself to expose the exact row count and insertion order so clients can cheaply infer table size"
      - "You need the key to fit inside a single 4-byte integer column so existing legacy 32-bit foreign keys keep referencing it"
    answer: 0
    explanation: |
      UUIDs can be generated anywhere without coordination, which is the decisive
      advantage for sharded/multi-primary systems, merging datasets, or minting an
      id before insert. They are wider than a BIGINT and (unlike a counter) do not
      leak row counts or insertion order.
    ref: "concepts.md#auto-generated-primary-keys-identity-vs-sequence-vs-uuid"

  - id: relational-modeling-normalization-056
    difficulty: advanced
    tags: [keys, serial, int-overflow, bigint]
    question: |
      A high-growth table used a 32-bit SERIAL (INT) primary key and inserts start
      failing after about 2.1 billion rows. What is the root cause and the fix?
    options:
      - "The sequence's in-memory value cache has been exhausted; restart the database instance to force it to reallocate a fresh cache block"
      - "PostgreSQL caps SERIAL columns at 2.1 billion rows unless you buy a higher edition license; upgrade the edition to raise the ceiling"
      - "A signed 32-bit integer overflows near 2.1 billion; use BIGINT / BIGSERIAL (or a BIGINT identity)"
      - "The primary key's clustered index has run out of free leaf pages; rebuild the index online to compact it and reclaim insert space"
    answer: 2
    explanation: |
      A plain SERIAL/INT is a signed 32-bit integer maxing out near 2,147,483,647.
      Once the sequence passes that, inserts fail. Anything that might grow large
      should use BIGINT (BIGSERIAL, or better, a BIGINT GENERATED ALWAYS AS IDENTITY)
      from the start, since widening the type later is an expensive migration.
    ref: "concepts.md#auto-generated-primary-keys-identity-vs-sequence-vs-uuid"
