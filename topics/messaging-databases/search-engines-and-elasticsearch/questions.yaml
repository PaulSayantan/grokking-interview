topic: "Search Engines & Elasticsearch Internals"
domain: messaging-databases
topic_slug: search-engines-and-elasticsearch
version: 1
questions:
  - id: search-engines-and-elasticsearch-001
    difficulty: beginner
    tags: [like-scan, full-text, motivation]
    question: |
      Why can't a relational `WHERE body LIKE '%headphone%'` use a normal B-tree index
      on the `body` column?
    options:
      - "B-tree indexes physically cannot store or index text and varchar columns, only fixed-width numeric types"
      - "The LIKE operator is only supported on primary-key columns, never on ordinary indexed text fields"
      - "The optimizer always prefers a sequential scan for string comparisons"
      - "A leading wildcard means no index prefix can be matched, so the engine full-scans every row"
    answer: 3
    explanation: |
      A B-tree is ordered by value prefix. A pattern beginning with `%` gives no known prefix
      to seek on, so the index is useless and the engine scans every row, running a substring
      match on each — O(rows × length). That linear cost, plus the lack of ranking and
      linguistic matching, is what motivates a dedicated search engine.
    ref: "concepts.md#why-full-text-search-needs-a-search-engine"

  - id: search-engines-and-elasticsearch-002
    difficulty: beginner
    tags: [inverted-index, definition]
    question: |
      What does an inverted index map?
    options:
      - "Each document ID to the list of terms it contains"
      - "Each row's primary key to the physical byte offset of its record on disk"
      - "Each term to a posting list of the document IDs that contain it"
      - "Each incoming query string to the cached result set it produced last time"
    answer: 2
    explanation: |
      An inverted index maps term → posting list of doc IDs (the inverse of a forward
      document→terms index). Answering "which docs contain this word" becomes a dictionary
      lookup plus a read of the pre-sorted posting list, instead of scanning every document.
    ref: "concepts.md#the-inverted-index"

  - id: search-engines-and-elasticsearch-003
    difficulty: intermediate
    tags: [inverted-index, posting-list]
    question: |
      Posting lists in Lucene are stored sorted by document ID primarily so that:
    options:
      - "Documents can be deleted more quickly because the tombstone markers stay physically contiguous"
      - "Doc-ID ordering makes the posting list take less disk space than any other possible ordering"
      - "Relevance scores can be computed directly from doc-ID gaps without storing term frequencies"
      - "Boolean AND/OR across terms becomes a fast merge-intersection/union of sorted lists"
    answer: 3
    explanation: |
      Sorting posting lists by doc ID lets an AND be computed as a merge-intersection and an OR
      as a merge-union of sorted streams (accelerated by skip lists). This is why boolean
      combinations of terms are efficient.
    ref: "concepts.md#the-inverted-index"

  - id: search-engines-and-elasticsearch-004
    difficulty: intermediate
    tags: [inverted-index, positions, phrase]
    question: |
      Besides document IDs, what does Lucene store in the index to support phrase and
      proximity queries?
    options:
      - "A secondary B-tree built over the original untokenized column values"
      - "Term positions (and offsets for highlighting)"
      - "A materialized join table linking each term back to its source rows"
      - "The SHA-256 content hash of every indexed document for dedup"
    answer: 1
    explanation: |
      To answer phrase queries like "noise cancelling" (terms adjacent, in order), Lucene stores
      term positions; offsets are stored to support highlighting. Term frequencies are stored for
      scoring.
    ref: "concepts.md#the-inverted-index"

  - id: search-engines-and-elasticsearch-005
    difficulty: beginner
    tags: [analysis, pipeline]
    question: |
      What are the three stages of an Elasticsearch analyzer, in order?
    options:
      - "Character filters -> tokenizer -> token filters"
      - "Tokenizer -> character filters -> token filters"
      - "Token filters -> tokenizer -> character filters"
      - "Character filters -> token filters -> tokenizer"
    answer: 0
    explanation: |
      An analyzer runs character filters (on the raw stream, e.g. html_strip), then exactly one
      tokenizer (splits into tokens), then token filters (lowercase, stop, stemmer, synonym…).
      The output terms are what land in the inverted index.
    ref: "concepts.md#the-analysis-pipeline"

  - id: search-engines-and-elasticsearch-006
    difficulty: beginner
    tags: [analysis, stemming]
    question: |
      A stemming token filter helps a search for "running" match a document containing
      "runs" because it:
    options:
      - "Reduces related word forms to a common root (e.g. run) at index and query time"
      - "Stores every inflected word form verbatim in the index so exact strings always match"
      - "Expands the query with a thesaurus lookup that adds unrelated synonyms at search time"
      - "Increases the BM25 relevance score of long documents that repeat the term many times"
    answer: 0
    explanation: |
      A stemmer normalizes inflected forms to a shared root ("running"/"runs"→"run"). If the same
      analyzer runs at index and query time, both sides reduce to "run" and match. This is how
      search matches concepts rather than exact strings.
    ref: "concepts.md#the-analysis-pipeline"

  - id: search-engines-and-elasticsearch-007
    difficulty: intermediate
    tags: [analysis, tokenizer]
    question: |
      How many tokenizers may a single analyzer have?
    options:
      - "Zero or one"
      - "Exactly one"
      - "One per token filter"
      - "Any number, applied in sequence"
    answer: 1
    explanation: |
      An analyzer has exactly one tokenizer. It may have zero or more character filters (before)
      and zero or more token filters (after), but precisely one tokenizer splits the character
      stream into tokens.
    ref: "concepts.md#the-analysis-pipeline"

  - id: search-engines-and-elasticsearch-008
    difficulty: intermediate
    tags: [analysis, char-filter]
    question: |
      Stripping HTML tags from a field's raw text before tokenization is the job of a:
    options:
      - "Token filter"
      - "Tokenizer"
      - "Character filter"
      - "Similarity module"
    answer: 2
    explanation: |
      Character filters operate on the raw character stream before tokenization; `html_strip`
      removes markup so tags don't become tokens. Token filters operate after tokenization on
      the token stream instead.
    ref: "concepts.md#the-analysis-pipeline"

  - id: search-engines-and-elasticsearch-009
    difficulty: advanced
    tags: [analysis, reindex, gotcha]
    question: |
      You add a new synonym rule to a field's index-time analyzer. Why don't documents indexed
      last week start matching the new synonyms?
    options:
      - "Synonym token filters only work on keyword fields, never on the analyzed text fields you index prose into"
      - "The synonym token filter ships disabled by default and must be explicitly enabled per cluster before it applies"
      - "BM25 scoring silently ignores any terms that were generated by a synonym filter rather than typed by the user"
      - "Analysis is applied at index time, so existing docs keep the terms they were indexed with; you must reindex"
    answer: 3
    explanation: |
      Index-time analysis produces the terms stored in the inverted index. Changing the analyzer
      does not retroactively re-analyze old documents — they keep their old terms. You must
      reindex (or apply the synonyms at query time instead).
    ref: "concepts.md#the-analysis-pipeline"

  - id: search-engines-and-elasticsearch-010
    difficulty: intermediate
    tags: [analysis, index-time, query-time]
    question: |
      For a `match` query to find a document, what must be true about analysis?
    options:
      - "The index-time terms and the query-time terms must be compatible (produce overlapping terms)"
      - "The query string must be passed through completely unanalyzed and matched against raw stored terms"
      - "The query-side analyzer must always be configured to differ from the index-time analyzer"
      - "Only the query text is ever analyzed, while the document is stored and matched verbatim"
    answer: 0
    explanation: |
      Analysis happens at both index time (producing stored terms) and query time (producing
      lookup terms). For `match` to hit, the two term streams must overlap. By default the same
      analyzer is used for both, guaranteeing compatibility.
    ref: "concepts.md#index-time-vs-query-time-analysis"

  - id: search-engines-and-elasticsearch-011
    difficulty: advanced
    tags: [autocomplete, edge-ngram, search-analyzer]
    question: |
      For edge-ngram autocomplete you index "quick" as q, qu, qui, quic, quick. Why set a
      different (plain) `search_analyzer` on the query side?
    options:
      - "So the query 'qui' is looked up as-is against the indexed ngrams instead of being re-ngrammed into an explosion of terms"
      - "To also edge-ngram the query token so that many more partial matches are produced per keystroke"
      - "Because keyword-typed fields technically require a separately configured search analyzer to be queried"
      - "To disable BM25 relevance scoring entirely for any prefix-style autocomplete query"
    answer: 0
    explanation: |
      You want the document broken into prefixes at index time, but the query token looked up
      directly. If you also ngram the query, "qui" becomes q/qu/qui and matches far too much. A
      plain search analyzer keeps the query token intact for a clean prefix match.
    ref: "concepts.md#index-time-vs-query-time-analysis"

  - id: search-engines-and-elasticsearch-012
    difficulty: intermediate
    tags: [debugging, analyze-api]
    question: |
      Which API is the fastest way to see exactly what terms a field/analyzer produces from
      some text, to debug why a query doesn't match?
    options:
      - "The _explain API"
      - "The _analyze API"
      - "The _reindex API"
      - "The _cat/shards API"
    answer: 1
    explanation: |
      `GET /<index>/_analyze` with a field or analyzer and some text returns the exact token
      stream. Most "why doesn't it match?" bugs are index-time vs query-time term mismatches,
      which the Analyze API reveals immediately. (`_explain` shows scoring, not tokenization.)
    ref: "concepts.md#index-time-vs-query-time-analysis"

  - id: search-engines-and-elasticsearch-013
    difficulty: beginner
    tags: [scoring, bm25, default]
    question: |
      What is the default relevance-scoring model in current Elasticsearch/OpenSearch (Lucene)?
    options:
      - "Plain TF-IDF"
      - "BM25"
      - "Cosine similarity"
      - "PageRank"
    answer: 1
    explanation: |
      Since Lucene 6, BM25 (Okapi BM25) is the default similarity. It refines TF-IDF with
      saturating term frequency and explicit document-length normalization.
    ref: "concepts.md#relevance-scoring-tf-idf-and-bm25"

  - id: search-engines-and-elasticsearch-014
    difficulty: beginner
    tags: [scoring, idf]
    question: |
      In TF-IDF/BM25, the IDF component gives higher weight to terms that are:
    options:
      - "Frequent across the whole corpus"
      - "Rare across the corpus (more discriminating)"
      - "Longest in character count"
      - "Stored in keyword fields"
    answer: 1
    explanation: |
      Inverse document frequency up-weights rare terms because they discriminate between
      documents; ubiquitous terms like "the" carry little signal and are weighted down.
    ref: "concepts.md#relevance-scoring-tf-idf-and-bm25"

  - id: search-engines-and-elasticsearch-015
    difficulty: advanced
    tags: [scoring, bm25, k1, saturation]
    question: |
      The BM25 `k1` parameter (default 1.2) primarily controls:
    options:
      - "How strongly document length normalizes the final relevance score for each hit"
      - "The minimum relevance score a document must reach to be returned as a hit"
      - "The number of shards that are queried in parallel when the term is looked up"
      - "Term-frequency saturation — the diminishing returns of repeated term occurrences"
    answer: 3
    explanation: |
      `k1` controls non-linear term-frequency saturation: the 10th occurrence adds far less than
      the 2nd. Document-length normalization is controlled by `b` (default 0.75) instead.
    ref: "concepts.md#relevance-scoring-tf-idf-and-bm25"

  - id: search-engines-and-elasticsearch-016
    difficulty: advanced
    tags: [scoring, bm25, b, length]
    question: |
      What does setting the BM25 `b` parameter to 0 do?
    options:
      - "Disables the inverse-document-frequency weighting term"
      - "Makes term frequency contribute linearly with no saturation"
      - "Turns BM25 scoring back into plain cosine similarity"
      - "Disables document-length normalization"
    answer: 3
    explanation: |
      `b` (default 0.75) controls how strongly document length normalizes the term-frequency
      component. `b=0` removes length normalization entirely, so a match in a long document
      counts the same as in a short one.
    ref: "concepts.md#relevance-scoring-tf-idf-and-bm25"

  - id: search-engines-and-elasticsearch-017
    difficulty: intermediate
    tags: [scoring, bm25, tf-idf, comparison]
    question: |
      The key improvement of BM25 over classic TF-IDF is that BM25:
    options:
      - "Removes the inverse-document-frequency term from the formula entirely"
      - "Requires dense vector embeddings to be generated for every document"
      - "Adds saturating term frequency and explicit length normalization"
      - "Only works on exact keyword fields, not on analyzed text fields"
    answer: 2
    explanation: |
      BM25 keeps IDF but adds saturating TF (bounded by k1) so repeated terms have diminishing
      returns, and explicit length normalization (b) so short-field matches rank higher. Both
      fix TF-IDF's tendency to over-reward long, keyword-stuffed documents.
    ref: "concepts.md#relevance-scoring-tf-idf-and-bm25"

  - id: search-engines-and-elasticsearch-018
    difficulty: intermediate
    tags: [boosting, multi-match]
    question: |
      In `multi_match` with `fields: ["title^3", "body"]`, what does the `^3` do?
    options:
      - "Boosts a match in `title` to count roughly three times as much as a match in `body`"
      - "Requires the search term to occur at least 3 times within the title before the doc matches"
      - "Limits the response to only the top 3 documents whose title matched the query"
      - "Sets the fuzziness for the title clause to an edit distance of 3 characters"
    answer: 0
    explanation: |
      `title^3` is a field boost: matches in `title` contribute about 3× the score of matches in
      `body`, pushing docs whose title matches to the top. It has nothing to do with occurrence
      counts or result limits.
    ref: "concepts.md#boosting-and-query-time-relevance-tuning"

  - id: search-engines-and-elasticsearch-019
    difficulty: advanced
    tags: [boosting, function-score, business-signal]
    question: |
      You want relevance to also reflect product popularity (units sold). Which mechanism blends
      BM25 with such a business signal?
    options:
      - "`function_score` / `field_value_factor` (e.g. multiply score by log(1+sales))"
      - "A `term` filter on the sales field that only filters matches, never scoring it"
      - "Adding more replica shards, which boosts read throughput but not scoring at all"
      - "Setting `b=0` in BM25, which only removes document-length normalization from scoring"
    answer: 0
    explanation: |
      `function_score` (often with `field_value_factor`) combines the text relevance score with a
      numeric field via a function like `log(1+sales)`, letting popularity, recency, or rating
      influence ranking without discarding BM25 relevance.
    ref: "concepts.md#boosting-and-query-time-relevance-tuning"

  - id: search-engines-and-elasticsearch-020
    difficulty: advanced
    tags: [scoring, explain, gotcha]
    question: |
      Why is it wrong to treat the `_score` value as an absolute quality metric to threshold on
      across different queries?
    options:
      - "Scores are always normalized onto a fixed 0-to-1 scale, so any threshold transfers directly"
      - "Scores are only ever computed for keyword fields, never for analyzed text fields"
      - "The score is defined as the exact integer count of query terms that matched the document"
      - "`_score` is relative within a query and depends on term statistics, so it isn't comparable across different queries"
    answer: 3
    explanation: |
      BM25 scores are relative sums/products of term contributions and depend on corpus/term
      statistics; they aren't normalized or comparable across different queries. Tune with the
      `_explain` API and A/B tests, not by comparing raw magnitudes.
    ref: "concepts.md#boosting-and-query-time-relevance-tuning"

  - id: search-engines-and-elasticsearch-021
    difficulty: beginner
    tags: [data-model, index, shard]
    question: |
      In Elasticsearch, a single primary shard is implemented as:
    options:
      - "A row in a relational table"
      - "A Kafka partition"
      - "An independent Lucene index"
      - "A Redis hash slot"
    answer: 2
    explanation: |
      Each primary shard is a self-contained Lucene index. An Elasticsearch index is partitioned
      into primary shards to scale beyond one node and parallelize search across them.
    ref: "concepts.md#the-elasticsearch--opensearch-data-model"

  - id: search-engines-and-elasticsearch-022
    difficulty: intermediate
    tags: [data-model, shards, immutable]
    question: |
      Which statement about primary shard count is correct?
    options:
      - "It is fixed at index creation; changing it requires reindex (or Split/Shrink)"
      - "It can be increased at any time with a live update to the number_of_shards setting"
      - "It automatically grows as documents are added and shards approach their size limit"
      - "It must always equal the number of replica shards configured for the same index"
    answer: 0
    explanation: |
      Primary shard count is set at creation and is immutable because routing (`hash(_id) %
      primaries`) depends on it. To change it you reindex into a new index or use the Split/Shrink
      APIs. Replica count, by contrast, is adjustable at runtime.
    ref: "concepts.md#the-elasticsearch--opensearch-data-model"

  - id: search-engines-and-elasticsearch-023
    difficulty: intermediate
    tags: [data-model, replica, ha]
    question: |
      Replica shards provide two main benefits. Which pair?
    options:
      - "Higher write throughput because indexing fans out in parallel, plus stronger consistency"
      - "Smaller on-disk index size and faster background segment merges on the primary"
      - "High availability (survive node loss) and additional read/search throughput"
      - "Automatic schema evolution and transparent reindexing whenever a mapping changes"
    answer: 2
    explanation: |
      Replicas are copies of primaries on other nodes. They keep the index available if a node
      holding a primary fails, and searches can be served from replicas, increasing read
      throughput. They don't speed writes (writes go to primary then replicas).
    ref: "concepts.md#the-elasticsearch--opensearch-data-model"

  - id: search-engines-and-elasticsearch-024
    difficulty: intermediate
    tags: [data-model, routing]
    question: |
      By default, which primary shard does a document with a given `_id` land on?
    options:
      - "The shard given by hash(_id) modulo the number of primary shards"
      - "A random shard chosen by the coordinating node at index time for even spread"
      - "Always shard 0, with the cluster rebalancing documents to other shards later"
      - "The least-loaded shard at that moment, based on current CPU and disk usage"
    answer: 0
    explanation: |
      Default routing is `shard = hash(_id) % number_of_primary_shards`, so a document
      deterministically maps to one primary (and its replicas). This determinism is exactly why
      the primary count can't change without reindexing.
    ref: "concepts.md#the-elasticsearch--opensearch-data-model"

  - id: search-engines-and-elasticsearch-025
    difficulty: beginner
    tags: [opensearch, history]
    question: |
      OpenSearch originated as:
    options:
      - "A ground-up rewrite sharing no code or query DSL with Elasticsearch at all"
      - "An Apache-2.0 fork of Elasticsearch 7.10, maintained after Elastic's license change"
      - "A proprietary, AWS-only closed-source product with no public source available"
      - "A plugin that runs inside an unmodified Elasticsearch node to add features"
    answer: 1
    explanation: |
      OpenSearch is an Apache-2.0 licensed fork of Elasticsearch/Kibana 7.10, created after
      Elastic moved to non-OSI licenses. It shares the same core model (indices, shards, Lucene,
      query DSL, aggregations) covered here.
    ref: "concepts.md#the-elasticsearch--opensearch-data-model"

  - id: search-engines-and-elasticsearch-026
    difficulty: intermediate
    tags: [segments, immutable, updates]
    question: |
      How is a document "update" handled given that Lucene segments are immutable?
    options:
      - "The segment file is edited in place, rewriting just the changed document's bytes"
      - "The entire shard's Lucene index is rebuilt from scratch on every single update"
      - "Updates are rejected outright on Lucene indices, which are strictly append-only stores"
      - "The old doc is marked deleted and a new doc is written; space is reclaimed later by segment merges"
    answer: 3
    explanation: |
      Segments are write-once. An update marks the old document deleted (a .del bit) and writes a
      new document into a newer segment. Background segment merges eventually reclaim the space of
      deleted docs.
    ref: "concepts.md#lucene-segments-refresh-and-near-real-time-search"

  - id: search-engines-and-elasticsearch-027
    difficulty: beginner
    tags: [refresh, nrt, default]
    question: |
      What is the default refresh interval that makes newly indexed documents searchable?
    options:
      - "10 milliseconds"
      - "30 seconds"
      - "1 second"
      - "5 minutes"
    answer: 2
    explanation: |
      By default a refresh runs about every 1 second (on indices searched in the last 30s),
      moving buffered docs into a new searchable segment. This ~1s gap is why Elasticsearch is
      "near-real-time" rather than real-time.
    ref: "concepts.md#lucene-segments-refresh-and-near-real-time-search"

  - id: search-engines-and-elasticsearch-028
    difficulty: intermediate
    tags: [refresh, nrt, definition]
    question: |
      What exactly does a refresh do?
    options:
      - "Fsyncs all open segments to disk and trims the translog to guarantee durability"
      - "Scans the shard and physically deletes stale segments left behind by prior merges"
      - "Replays the translog from the last commit point to rebuild in-memory state"
      - "Writes the in-memory buffer into a new segment in the filesystem cache and opens it for search"
    answer: 3
    explanation: |
      A refresh takes buffered docs, writes them to a new segment in the filesystem cache (cheap,
      not yet fsynced), and opens it so those docs become searchable. Durability (fsync to disk)
      is a separate, heavier operation.
    ref: "concepts.md#lucene-segments-refresh-and-near-real-time-search"

  - id: search-engines-and-elasticsearch-029
    difficulty: advanced
    tags: [bulk-indexing, refresh-interval, tuning]
    question: |
      To maximize throughput of a large bulk load, a common tuning is to:
    options:
      - "Set refresh_interval down to 100ms and add extra replicas to spread the write load"
      - "Increase the number of primary shards mid-load so incoming documents fan out wider"
      - "Switch translog durability to request so every single doc is fsynced before its ack"
      - "Temporarily set refresh_interval to -1 (disable) and drop replicas to 0, then restore them"
    answer: 3
    explanation: |
      Disabling refresh (`-1`) avoids building a segment every second and the resulting constant
      re-merging, and dropping replicas avoids replicating each op during load. Restore both
      afterward and refresh. This is one of the highest-impact indexing throughput levers.
    ref: "concepts.md#lucene-segments-refresh-and-near-real-time-search"

  - id: search-engines-and-elasticsearch-030
    difficulty: intermediate
    tags: [translog, durability, wal]
    question: |
      What is the role of the translog?
    options:
      - "It caches recent query results so repeated searches skip re-scoring the segments"
      - "It stores the analyzed token stream produced before terms land in the inverted index"
      - "It holds the cluster's replica routing tables that map each doc to its shard copies"
      - "It is a write-ahead log of operations, appended before ack, and replayed on recovery to avoid losing writes"
    answer: 3
    explanation: |
      Because a refresh only puts data in the filesystem cache (not durably on disk), the translog
      records each operation as a WAL before acknowledgment. On crash recovery, unflushed
      operations are replayed from the translog.
    ref: "concepts.md#the-translog-and-durability"

  - id: search-engines-and-elasticsearch-031
    difficulty: advanced
    tags: [translog, durability, default]
    question: |
      With the default `index.translog.durability` setting, when is the translog fsynced?
    options:
      - "Every 5 seconds in the background, batching operations from the interval together"
      - "Only during a full flush, when segments are committed and the translog is trimmed"
      - "After every index/delete/update/bulk request, before it is acknowledged"
      - "Never — it stays purely in memory and is reconstructed from segments on restart"
    answer: 2
    explanation: |
      The default is `request`: the translog is fsynced and committed on the primary and each
      allocated replica after every request, before acknowledging. So no acknowledged write is
      lost on a single-node crash. `async` (fsync every sync_interval, default 5s) trades some
      durability for speed.
    ref: "concepts.md#the-translog-and-durability"

  - id: search-engines-and-elasticsearch-032
    difficulty: advanced
    tags: [translog, async, sync-interval]
    question: |
      If you set `index.translog.durability: async`, what is the default `sync_interval` and the
      main risk?
    options:
      - "1s; the main risk is that newly indexed documents become searchable late"
      - "5s; operations from the last interval can be lost if the node crashes"
      - "30s; the main risk is that ongoing queries begin returning stale results"
      - "0s; the translog is fsynced continuously, so there is effectively no risk"
    answer: 1
    explanation: |
      With `async`, the translog is fsynced in the background every `sync_interval` (default 5s),
      so a crash can lose operations acknowledged in the last interval. It's faster but weaker
      than the default per-request durability.
    ref: "concepts.md#the-translog-and-durability"

  - id: search-engines-and-elasticsearch-033
    difficulty: intermediate
    tags: [refresh, flush, translog, distinction]
    question: |
      Which correctly distinguishes refresh from flush?
    options:
      - "Refresh fsyncs segments to disk for durability; flush only makes docs searchable in cache"
      - "Refresh makes docs searchable in the fs cache (cheap); flush fsyncs segments to disk and trims the translog (expensive)"
      - "They are two names for the same underlying operation on a Lucene shard"
      - "Flush runs automatically every second; refresh only ever runs when explicitly requested"
    answer: 1
    explanation: |
      Refresh = new searchable segment in the filesystem cache, cheap, ~1s. Flush = commit
      segments to disk with fsync and start a fresh translog, expensive, triggered by size/age.
      Refresh gives visibility; the translog (and flush) give durability.
    ref: "concepts.md#the-translog-and-durability"

  - id: search-engines-and-elasticsearch-034
    difficulty: beginner
    tags: [mapping, text, keyword]
    question: |
      Which field type stores its value as a single, exact, un-analyzed token?
    options:
      - "text"
      - "match"
      - "keyword"
      - "analyzed"
    answer: 2
    explanation: |
      `keyword` stores the value verbatim as one token — ideal for exact-match `term` filters,
      sorting, and aggregations. `text` is analyzed into multiple terms for full-text search.
    ref: "concepts.md#mapping-text-vs-keyword"

  - id: search-engines-and-elasticsearch-035
    difficulty: intermediate
    tags: [mapping, multi-field, text, keyword]
    question: |
      Why does dynamic mapping create both a `text` field and a `.keyword` sub-field for a string?
    options:
      - "To store the value twice for redundancy so a corrupted segment can fall back to the copy"
      - "Because a `keyword` field is technically not allowed to exist without a parent `text` field"
      - "So you can both full-text `match` (text) and exactly sort/aggregate/`term`-filter (keyword) on the same field"
      - "To double the BM25 relevance score by counting the term once in each of the two sub-fields"
    answer: 2
    explanation: |
      Full-text search needs an analyzed `text` field, but sorting, aggregations, and exact
      `term` filters need an un-analyzed `keyword`. The multi-field gives you `field` (text) plus
      `field.keyword` (exact) so one string serves both use cases.
    ref: "concepts.md#mapping-text-vs-keyword"

  - id: search-engines-and-elasticsearch-036
    difficulty: intermediate
    tags: [mapping, sorting, gotcha]
    question: |
      You try to sort search results by a `text`-typed `brand` field and it errors or misbehaves.
      Why?
    options:
      - "text fields cannot be indexed at all, so there is nothing stored to sort the results on"
      - "Sorting on any field first requires you to disable BM25 similarity scoring for that query"
      - "text fields are analyzed into tokens and lack doc values, so use the keyword sub-field (brand.keyword) for sorting"
      - "You must add more replica shards first so the coordinating node can sort in parallel"
    answer: 2
    explanation: |
      Analyzed `text` fields store tokenized terms and don't have doc values enabled, so they
      can't be used for exact sort/aggregation. Sort on the exact `keyword` sub-field
      (`brand.keyword`) instead.
    ref: "concepts.md#mapping-text-vs-keyword"

  - id: search-engines-and-elasticsearch-037
    difficulty: advanced
    tags: [dynamic-mapping, type-inference, pitfall]
    question: |
      A field first appears as JSON number `90210` (ZIP code) and is dynamically mapped as
      `long`. What happens when a later document sends `"SW1A"` for that field?
    options:
      - "It fails to index / triggers a mapping conflict, because the field type is already long and immutable"
      - "It is silently coerced to the numeric value 0 and indexed as a valid long"
      - "The field mapping is automatically widened to text so the alphanumeric value indexes fine"
      - "Both values index fine because dynamic mapping stores every string field as flexible text"
    answer: 0
    explanation: |
      Dynamic mapping infers the type from the first value and that type is immutable. A ZIP
      seen first as a number becomes `long`; the later alphanumeric value can't be parsed as a
      long and the document is rejected. Explicit mappings (map ZIP as keyword) avoid this.
    ref: "concepts.md#dynamic-mapping-pitfalls"

  - id: search-engines-and-elasticsearch-038
    difficulty: advanced
    tags: [dynamic-mapping, mapping-explosion]
    question: |
      Logging documents with arbitrary, user-controlled keys under a `labels` object can cause a
      "mapping explosion." The main defense is to:
    options:
      - "Set dynamic to strict/false (and/or index.mapping.total_fields.limit) so unbounded fields aren't auto-mapped"
      - "Add more primary shards so the exploding set of label fields spreads thinly across nodes"
      - "Enable async translog durability so the extra mapped fields flush without blocking writes"
      - "Increase the refresh_interval so new label fields are batched and mapped less frequently"
    answer: 0
    explanation: |
      Every new distinct key becomes a mapped field, bloating cluster state and heap. Setting
      `dynamic: strict` (reject unknown fields) or `false` (store but don't index), using runtime
      fields, and capping `total_fields.limit` prevents unbounded field growth.
    ref: "concepts.md#dynamic-mapping-pitfalls"

  - id: search-engines-and-elasticsearch-039
    difficulty: intermediate
    tags: [dynamic-mapping, best-practice]
    question: |
      For a production index, the recommended stance on dynamic mapping is:
    options:
      - "Always rely on dynamic mapping; hand-written explicit mappings only slow the index down"
      - "Define explicit mappings and set dynamic to strict or false to control field types"
      - "Disable indexing entirely and store documents as opaque source-only blobs for safety"
      - "Map every field as text so any value can be ingested without triggering a type conflict"
    answer: 1
    explanation: |
      Explicit mappings give correct, stable types and prevent surprise mapping conflicts and
      explosions. Setting `dynamic` to `strict` (reject unknowns) or `false` (ignore) keeps the
      schema under control. Dynamic mapping is fine for prototypes, risky in production.
    ref: "concepts.md#dynamic-mapping-pitfalls"

  - id: search-engines-and-elasticsearch-040
    difficulty: beginner
    tags: [query-dsl, match, term]
    question: |
      What is the key difference between a `match` query and a `term` query?
    options:
      - "match uses a cached bitset so it is always faster, while term rescans the segment each time"
      - "match works only on numeric fields, whereas term is restricted to date and range fields"
      - "There is no functional difference; the two are interchangeable aliases for the same lookup"
      - "match analyzes the query string (for text fields); term looks up the value verbatim (no analysis)"
    answer: 3
    explanation: |
      `match` is a full-text query: it runs the query string through the field's analyzer and
      looks up the resulting terms. `term` does no analysis and looks up the exact value — use it
      on keyword/numeric/date fields.
    ref: "concepts.md#query-dsl-match-vs-term-vs-bool"

  - id: search-engines-and-elasticsearch-041
    difficulty: advanced
    tags: [query-dsl, term, text, gotcha]
    question: |
      A `term` query for `{"status": "Active"}` on a `text` field returns no results even though
      documents say "Active". Most likely cause?
    options:
      - "The underlying Lucene segment is corrupt and silently drops any capitalized token on read"
      - "term queries were deprecated for text fields and now require the match_phrase query instead"
      - "The text field lowercased the indexed term to 'active', but term doesn't analyze the query value 'Active', so they don't match"
      - "You need to increase the fuzziness parameter so the capital 'A' is treated as an edit away"
    answer: 2
    explanation: |
      The `text` field's analyzer stored `active` (lowercased), but `term` looks up `Active`
      verbatim without analysis — no match. Query the exact `keyword` sub-field
      (`status.keyword`) or use `match`. This is the single most common query bug.
    ref: "concepts.md#query-dsl-match-vs-term-vs-bool"

  - id: search-engines-and-elasticsearch-042
    difficulty: intermediate
    tags: [query-dsl, bool, clauses]
    question: |
      In a `bool` query, which clause contributes to matching but does NOT affect the relevance
      score and is cacheable?
    options:
      - "must"
      - "should"
      - "match_phrase"
      - "filter"
    answer: 3
    explanation: |
      `filter` clauses run in filter context: they require a match (yes/no) but assign no score
      and their result bitset is cacheable. `must` and `should` run in query context and
      contribute to `_score`.
    ref: "concepts.md#query-dsl-match-vs-term-vs-bool"

  - id: search-engines-and-elasticsearch-043
    difficulty: advanced
    tags: [query-dsl, bool, scenario]
    question: |
      You need: title matches "wireless headphones", brand is exactly Sony, price <= 200, and
      exclude discontinued items — with ranking driven only by the title match. How should you
      structure the bool query?
    options:
      - "Put every condition in must so brand, price, and exclusion all contribute to the score"
      - "Put everything in should so any single matching condition is enough to return the document"
      - "match title in must; brand term, price range in filter; discontinued in must_not"
      - "Use a single term query on a field concatenating title, brand, price, and status together"
    answer: 2
    explanation: |
      The title match should drive ranking, so it goes in `must` (query context). Exact brand,
      the price range, and the exclusion are hard yes/no criteria with no bearing on relevance:
      brand/price in `filter` (cacheable, unscored) and discontinued in `must_not`.
    ref: "concepts.md#query-dsl-match-vs-term-vs-bool"

  - id: search-engines-and-elasticsearch-044
    difficulty: intermediate
    tags: [filter-context, query-context, caching]
    question: |
      Why can filter-context clauses be cached while query-context clauses generally cannot?
    options:
      - "Filters run on a physically separate cache-only cluster that never recomputes their results"
      - "Filters produce a yes/no matching bitset independent of scoring, whereas scores depend on term statistics that vary"
      - "Query-context results are byte-for-byte identical on every request, so they cache just as well"
      - "Filters are always evaluated first in alphabetical clause order, making their output reusable"
    answer: 1
    explanation: |
      A filter's output is a deterministic set (bitset) of matching docs — reusable across
      queries. A scored clause's contribution depends on term/corpus statistics and the specific
      query, so it isn't a cache-friendly boolean result.
    ref: "concepts.md#query-context-vs-filter-context"

  - id: search-engines-and-elasticsearch-045
    difficulty: intermediate
    tags: [filter-context, performance, best-practice]
    question: |
      Which criterion is the best candidate to move into `filter` context for both performance
      and correctness?
    options:
      - "A hard yes/no constraint like status = active or created_at within a date range"
      - "The main free-text search phrase the user typed, which should drive result ranking"
      - "A relevance boost applied to the title field to push title matches toward the top"
      - "A synonym expansion of the query that broadens which terms count as a textual match"
    answer: 0
    explanation: |
      Hard yes/no constraints (status, category, date/price ranges, ownership) belong in
      `filter`: they gain caching, skip score computation, and don't pollute relevance. The
      user's actual search phrase should stay in query context so it drives ranking.
    ref: "concepts.md#query-context-vs-filter-context"

  - id: search-engines-and-elasticsearch-046
    difficulty: beginner
    tags: [aggregations, bucket, facets]
    question: |
      Which aggregation would you use to build a "brand" facet showing counts per brand
      (e.g. Sony (42), Bose (18))?
    options:
      - "an avg metric aggregation, which returns one averaged number rather than per-brand counts"
      - "terms bucket aggregation on brand.keyword"
      - "a cardinality aggregation, which returns only the distinct-brand count, not each brand's total"
      - "a date_histogram aggregation, which buckets documents by time interval instead of by brand"
    answer: 1
    explanation: |
      A `terms` bucket aggregation groups documents by field value and counts each bucket — the
      classic faceted-navigation building block. It runs on an exact field (`brand.keyword`),
      since aggregations use doc values, not analyzed text.
    ref: "concepts.md#aggregations"

  - id: search-engines-and-elasticsearch-047
    difficulty: advanced
    tags: [aggregations, approximate, cardinality]
    question: |
      Why can a `terms` aggregation's counts be slightly inaccurate on a multi-shard index?
    options:
      - "Aggregations silently skip documents that are marked deleted but not yet merged away"
      - "BM25 relevance scoring rounds each bucket's document count to the nearest power of two"
      - "Replica shards are counted alongside primaries, so every matching document is tallied twice"
      - "Each shard returns only its local top-N buckets which are then merged, so a globally frequent term missed by some shard can be undercounted"
    answer: 3
    explanation: |
      Each shard computes its local top buckets and sends them to the coordinating node to merge.
      A term that's just below a shard's local cutoff isn't reported by that shard, so merged
      counts can be off for high-cardinality fields. Raising `shard_size` reduces the error.
      `cardinality` (HyperLogLog++) and `percentiles` (t-digest) are also approximate by design.
    ref: "concepts.md#aggregations"

  - id: search-engines-and-elasticsearch-048
    difficulty: intermediate
    tags: [aggregations, doc-values]
    question: |
      Aggregations and sorting rely on which per-field, columnar on-disk structure?
    options:
      - "Doc values"
      - "The translog"
      - "The term dictionary FST"
      - "The query cache"
    answer: 0
    explanation: |
      Doc values are a columnar, per-field store optimized for reading a field's value across
      many docs — exactly what sorting and aggregations need. They're enabled by default on
      keyword/numeric fields but not on analyzed text, which is why you aggregate on keyword.
    ref: "concepts.md#aggregations"

  - id: search-engines-and-elasticsearch-049
    difficulty: intermediate
    tags: [reindex, alias, zero-downtime]
    question: |
      Why is an alias used when performing a zero-downtime mapping change via reindex?
    options:
      - "The app queries the stable alias name, so you can atomically repoint it from the old index to the new one without the app seeing a missing index"
      - "Aliases transparently compress the underlying index so the reindexed copy needs far less disk"
      - "Aliases automatically raise the primary shard count of whichever index they point at during reindex"
      - "Aliases disable the per-second refresh on the target index so the reindex writes go faster"
    answer: 0
    explanation: |
      The application always uses the alias. After reindexing into the new index and catching up
      writes, a single atomic `_aliases` call removes the old index and adds the new one, so
      searches never break. The concrete index names are hidden behind the alias.
    ref: "concepts.md#reindex-and-alias-swap-for-zero-downtime-mapping-changes"

  - id: search-engines-and-elasticsearch-050
    difficulty: advanced
    tags: [reindex, alias, atomicity, scenario]
    question: |
      During an alias-swap reindex, why must you handle writes that arrive while `_reindex` is
      running (via dual-write or CDC replay)?
    options:
      - "Because reindex copies a point-in-time snapshot; new writes to the old index after that point won't be in the new index unless you also apply them"
      - "Because _reindex takes an exclusive write lock on the old index and rejects all incoming writes"
      - "Because an alias is strictly read-only and silently drops any write routed through it during reindex"
      - "Because the new index is created with fewer shards, so it cannot accept the extra concurrent writes"
    answer: 0
    explanation: |
      `_reindex` copies documents as of when it reads them. Any writes landing on the old index
      afterward aren't automatically in the new index, so you dual-write to both (or replay from
      the CDC stream) to catch up before the swap — otherwise those updates are lost.
    ref: "concepts.md#reindex-and-alias-swap-for-zero-downtime-mapping-changes"

  - id: search-engines-and-elasticsearch-051
    difficulty: intermediate
    tags: [reindex, mapping, immutability]
    question: |
      Why is reindexing usually required to change a field's analyzer or type (e.g. text to
      keyword)?
    options:
      - "Reindexing is simply faster than an in-place analyzer edit, which is otherwise fully supported"
      - "A field's mapping/analyzer is immutable once set, so you build a new index with the new mapping and copy data in"
      - "Elasticsearch forbids editing the mapping of any index that currently has replica shards allocated"
      - "The translog must be fully cleared and fsynced before a live analyzer change can take effect"
    answer: 1
    explanation: |
      Once a field's mapping and analyzer are set they can't be changed in place (existing terms
      were produced by the old analyzer). You create a new index with the desired mapping and
      `_reindex` the documents so they're re-analyzed correctly.
    ref: "concepts.md#reindex-and-alias-swap-for-zero-downtime-mapping-changes"

  - id: search-engines-and-elasticsearch-052
    difficulty: intermediate
    tags: [cdc, dual-write, sync]
    question: |
      Why is naive dual-write (app writes to DB and to Elasticsearch in the same request) an
      anti-pattern for correctness?
    options:
      - "The extra network round trip to Elasticsearch makes every request too slow to be usable"
      - "The two writes aren't atomic — a crash or partial failure between them leaves DB and index inconsistent"
      - "Elasticsearch rejects direct writes from application code and only accepts them via CDC connectors"
      - "It requires disabling the translog on the index, which silently sacrifices write durability"
    answer: 1
    explanation: |
      There's no transaction spanning the DB and the search engine. If the process crashes or one
      write fails after the other succeeds, the two stores diverge with no ordering guarantee.
      CDC or a transactional outbox avoids this gap.
    ref: "concepts.md#indexing-from-the-database-cdc-vs-dual-write"

  - id: search-engines-and-elasticsearch-053
    difficulty: advanced
    tags: [cdc, debezium, robust]
    question: |
      The robust, industry-standard way to keep a search index in sync with a database is:
    options:
      - "Poll the whole table every minute and re-index everything"
      - "Let clients write directly to both stores from the browser"
      - "Log-based CDC (e.g. Debezium tailing the WAL/binlog into Kafka) projecting changes into the index"
      - "Store all data only in Elasticsearch"
    answer: 2
    explanation: |
      CDC tails the DB's transaction log (Postgres WAL / MySQL binlog via Debezium → Kafka) and
      applies changes to the index asynchronously and idempotently. The DB commit remains the
      single source of truth, and the stream can be replayed to rebuild the index.
    ref: "concepts.md#indexing-from-the-database-cdc-vs-dual-write"

  - id: search-engines-and-elasticsearch-054
    difficulty: advanced
    tags: [outbox, dual-write, atomicity]
    question: |
      The transactional outbox pattern avoids the dual-write atomicity gap by:
    options:
      - "Writing to Elasticsearch first and only committing to the DB once the index write is acknowledged"
      - "Disabling replica shards during writes so there is only a single copy to keep consistent"
      - "Writing an outbox row in the same DB transaction as the business change, then reliably relaying it to the index"
      - "Using a distributed two-phase commit that spans the DB and Elasticsearch as one XA transaction"
    answer: 2
    explanation: |
      The business change and an `outbox` record commit atomically in one DB transaction. A relay
      process then reads the outbox and updates the search index. Since only the DB transaction
      must be atomic, there's no cross-system dual-write to lose data in.
    ref: "concepts.md#indexing-from-the-database-cdc-vs-dual-write"

  - id: search-engines-and-elasticsearch-055
    difficulty: intermediate
    tags: [source-of-truth, derived-index]
    question: |
      What is the recommended relationship between the database and the search index?
    options:
      - "Elasticsearch is the durable system of record, and the relational DB is kept only as a disposable cache"
      - "The DB is the system of record; the search index is a rebuildable, derived read model"
      - "Both stores are independent, co-equal sources of truth that each accept authoritative writes directly"
      - "Neither one holds authoritative data; the true record lives in an external message queue instead"
    answer: 1
    explanation: |
      Elasticsearch is optimized for search, not durable OLTP state. Keep the DB authoritative
      and treat the index as a derived, rebuildable read model — so you can reconstruct it from
      the DB or CDC stream if it's lost or corrupted. Never store data only in the index.
    ref: "concepts.md#search-engine-vs-the-database-as-source-of-truth"

  - id: search-engines-and-elasticsearch-056
    difficulty: advanced
    tags: [source-of-truth, limitations]
    question: |
      Which limitation makes Elasticsearch a poor choice as a primary transactional datastore?
    options:
      - "It lacks multi-document ACID transactions and is near-real-time / eventually consistent by design"
      - "It has no native document model and can only persist flat, primitive key-value pairs, never nested JSON"
      - "It exposes no way to query by an individual field, supporting only whole-document retrieval by internal ID"
      - "It cannot scale horizontally and is architecturally limited to running as a single-node process"
    answer: 0
    explanation: |
      Elasticsearch offers only per-document atomicity — no multi-doc ACID transactions, no
      foreign keys, no general joins — and its NRT refresh plus async replication make it
      eventually consistent. That's fine for a derived search model, wrong for authoritative
      transactional state.
    ref: "concepts.md#search-engine-vs-the-database-as-source-of-truth"

  - id: search-engines-and-elasticsearch-057
    difficulty: beginner
    tags: [when-not, decision]
    question: |
      Which scenario is the weakest justification for introducing Elasticsearch/OpenSearch?
    options:
      - "Ranked full-text relevance with typo tolerance over millions of docs"
      - "Faceting and aggregations at scale for a product catalog"
      - "Log/observability analytics across large volumes"
      - "Exact-match lookups by ID and status with no relevance ranking on a modest dataset"
    answer: 3
    explanation: |
      Exact structured lookups with no ranking are exactly what a B-tree/GIN index in your
      existing database handles simply and consistently. Adding a second stateful system to sync
      buys nothing there. The other cases genuinely need search-engine capabilities.
    ref: "concepts.md#when-not-to-use-a-search-engine"

  - id: search-engines-and-elasticsearch-058
    difficulty: intermediate
    tags: [when-not, postgres-fts, alternative]
    question: |
      For a small corpus with modest full-text needs and no appetite for a second system to
      operate, a reasonable alternative to Elasticsearch is:
    options:
      - "Loading every document into Redis as plain strings and linearly scanning them all on each query"
      - "Postgres full-text search (tsvector/tsquery with a GIN index)"
      - "A leading-wildcard LIKE scan that substring-matches each row's full text on every single request"
      - "A shared spreadsheet, relying on its built-in find dialog to locate matching rows by keyword"
    answer: 1
    explanation: |
      Postgres FTS is a real inverted index with basic ranking (`ts_rank`) and dictionaries; a
      GIN index makes it fast enough for modest corpora — without running, securing, and syncing
      a separate cluster. Reach for a dedicated engine when scale, relevance, or analytics needs
      outgrow it.
    ref: "concepts.md#when-not-to-use-a-search-engine"

  - id: search-engines-and-elasticsearch-059
    difficulty: advanced
    tags: [xref, hybrid-search, vector]
    question: |
      For a query needing both keyword precision and semantic recall, the modern approach
      combines BM25 with vector similarity (often fused via RRF). Where is that hybrid-search
      technique covered in depth?
    options:
      - "In this topic's aggregations section, alongside the terms and cardinality bucket examples"
      - "In the translog section, where durability of the fused BM25-plus-vector scores is discussed"
      - "In the vector-databases-similarity-search topic"
      - "It is not covered in this library at all; hybrid search is left entirely as an outside exercise"
    answer: 2
    explanation: |
      Semantic and hybrid search (BM25 + vector, reciprocal rank fusion) belongs to the
      vector-databases-similarity-search topic. This topic focuses on the lexical/BM25 side; see
      that topic for embeddings, ANN, and fusion details.
    ref: "concepts.md#relevance-scoring-tf-idf-and-bm25"

  - id: search-engines-and-elasticsearch-060
    difficulty: intermediate
    tags: [segments, merges, operations]
    question: |
      Over time a shard accumulates many small segments and deleted-doc markers. What background
      process consolidates them and reclaims deleted space?
    options:
      - "Refresh"
      - "Translog fsync"
      - "Alias swap"
      - "Segment merging"
    answer: 3
    explanation: |
      Background segment merges combine smaller segments into larger ones and drop documents
      marked deleted, reclaiming space and reducing the number of segments a search must visit.
      Refresh creates segments; merging cleans them up.
    ref: "concepts.md#lucene-segments-refresh-and-near-real-time-search"
