topic: "Money, Currency & Financial Data Handling"
domain: messaging-databases
topic_slug: money-currency-and-financial-data
version: 1
questions:
  - id: money-currency-and-financial-data-001
    difficulty: beginner
    tags: [floating-point, correctness]
    question: |
      Why is `double` (IEEE 754 binary floating point) the wrong type for storing money?
    options:
      - "It is slower than integer arithmetic on modern CPUs"
      - "It cannot represent common decimal fractions like 0.10 exactly, so errors accumulate"
      - "It uses too much memory compared with a 32-bit integer"
      - "It rounds every result to two decimal places automatically"
    answer: 1
    explanation: |
      Binary floating point represents numbers as mantissa × 2^exponent and cannot exactly
      represent most decimal fractions, including 0.10. The tiny representation errors
      accumulate across many operations and make equality comparisons unreliable — a defect
      in financial systems. Use a fixed-precision decimal or integer minor units instead.
    ref: "concepts.md#why-never-use-float-or-double-for-money"

  - id: money-currency-and-financial-data-002
    difficulty: beginner
    tags: [floating-point]
    question: |
      In most languages, what does `0.1 + 0.2 == 0.3` evaluate to when using `double`?
    options:
      - "true, since both sides round to the same double first"
      - "It throws an ArithmeticException on inexact rounding"
      - "true, but only on 64-bit systems with wider mantissas"
      - "false, because 0.1 + 0.2 is stored as 0.30000000000000004"
    answer: 3
    explanation: |
      Neither 0.1, 0.2, nor 0.3 is exactly representable in binary floating point, and the
      nearest double to 0.1+0.2 (0.30000000000000004) differs from the nearest double to 0.3.
      The comparison is false — a classic demonstration of why doubles are unfit for money.
    ref: "concepts.md#why-never-use-float-or-double-for-money"

  - id: money-currency-and-financial-data-003
    difficulty: intermediate
    tags: [floating-point, gotcha]
    question: |
      A developer argues "we can keep using double and just round to 2 decimals when we
      display." Why is this insufficient?
    options:
      - "The representation error is already baked in before rounding, and intermediate steps can round across a boundary the wrong way"
      - "Rounding on every read is too slow and would dominate the query's CPU budget on large result sets"
      - "Displaying only two decimals violates the ISO 4217 minor-unit rules for high-precision currencies"
      - "It works fine as long as you never add more than two numbers together in a single expression"
    answer: 0
    explanation: |
      The binary representation error exists before you round, and intermediate rounding can
      push a value across a .5 boundary incorrectly. Summing in a different order can even
      produce a different total. The fix is to never introduce binary FP error: use decimal
      or integer minor units.
    ref: "concepts.md#why-never-use-float-or-double-for-money"

  - id: money-currency-and-financial-data-004
    difficulty: intermediate
    tags: [floating-point, associativity]
    question: |
      Why can summing a column of monetary `double` values give different totals depending
      on order?
    options:
      - "Databases return rows in a random order unless an explicit ORDER BY is present"
      - "The CPU keeps recent additions in a register cache and reuses stale partial sums"
      - "Floating-point addition is not associative, so (a+b)+c can differ from a+(b+c)"
      - "Doubles overflow silently once the running total passes one million units"
    answer: 2
    explanation: |
      Because of rounding at each step, IEEE 754 addition is not associative: regrouping the
      operands can change the result. Two runs that sum the same rows in different orders can
      disagree — unacceptable for financial totals.
    ref: "concepts.md#why-never-use-float-or-double-for-money"

  - id: money-currency-and-financial-data-005
    difficulty: beginner
    tags: [decimal, sql]
    question: |
      In SQL, which column type is appropriate for exact monetary amounts?
    options:
      - "FLOAT, which stores amounts as exact base-10 fractions"
      - "DOUBLE PRECISION, since 64 bits guarantee two-decimal accuracy"
      - "REAL, the SQL standard's dedicated fixed-point money type"
      - "NUMERIC(12, 2) (a.k.a. DECIMAL)"
    answer: 3
    explanation: |
      NUMERIC/DECIMAL is a fixed-precision base-10 type that stores decimal fractions exactly.
      FLOAT, DOUBLE PRECISION, and REAL are all binary floating point and unsuitable for money.
    ref: "concepts.md#decimalnumeric-vs-integer-minor-units"

  - id: money-currency-and-financial-data-006
    difficulty: intermediate
    tags: [decimal, precision-scale]
    question: |
      In `DECIMAL(p, s)`, what do `p` and `s` mean?
    options:
      - "p is the number of decimal places allowed, s is the arithmetic sign of the value"
      - "p is total significant digits (precision), s is digits after the decimal point (scale)"
      - "p is the left-side zero padding width, s is the on-disk storage size in bytes"
      - "p is the smallest value the column accepts, s is the largest value it accepts"
    answer: 1
    explanation: |
      p (precision) is the total count of significant digits the value may hold; s (scale) is
      how many of those digits fall after the decimal point. DECIMAL(12,2) allows up to
      99,999,999.99.
    ref: "concepts.md#decimalnumeric-vs-integer-minor-units"

  - id: money-currency-and-financial-data-007
    difficulty: beginner
    tags: [minor-units, integer]
    question: |
      Storing money as "integer minor units" means storing $19.99 as which value?
    options:
      - "19.99 in a DECIMAL"
      - "19 with a separate 0.99 field"
      - "1999 (cents) in an integer"
      - "0x1399 in a binary blob"
    answer: 2
    explanation: |
      Integer minor units store the amount as a whole number of the smallest unit — cents for
      USD — so $19.99 becomes 1999 in a bigint. Arithmetic is exact integer math with no
      fractional-cent risk.
    ref: "concepts.md#decimalnumeric-vs-integer-minor-units"

  - id: money-currency-and-financial-data-008
    difficulty: intermediate
    tags: [minor-units, currency, gotcha]
    question: |
      What hidden assumption makes a hard-coded "divide by 100 to get the major unit" a bug?
    options:
      - "Not every currency has 2 minor-unit digits — JPY has 0, and BHD/KWD have 3"
      - "Integer division is unsupported in SQL and silently returns NULL for the quotient"
      - "The literal 100 has no exact binary representation, so the division drifts"
      - "Dividing by 100 rounds toward zero instead of applying half-even banker's rounding"
    answer: 0
    explanation: |
      ISO 4217 defines a different number of minor-unit digits per currency: JPY has 0 (so
      "cents" don't exist), and Bahraini dinar/Kuwaiti dinar have 3. Assuming a global scale
      of 2 breaks any multi-currency system.
    ref: "concepts.md#decimalnumeric-vs-integer-minor-units"

  - id: money-currency-and-financial-data-009
    difficulty: intermediate
    tags: [minor-units, decimal, trade-offs]
    question: |
      Which statement about DECIMAL vs integer minor units is correct?
    options:
      - "DECIMAL is exact, but integer minor units accumulate rounding error over many operations"
      - "Integer minor units are exact, but DECIMAL is really binary floating point under the hood"
      - "Only DECIMAL can be used in a multi-currency system; integer minor units are single-currency"
      - "Both are exact; integer minor units require the reader to know the scale, DECIMAL reads naturally"
    answer: 3
    explanation: |
      Both representations are exact for the decimal fractions money uses. A trade-off: a raw
      integer like 1999 is meaningless without knowing the scale, whereas DECIMAL reads as
      19.99. Both still require storing the currency separately.
    ref: "concepts.md#decimalnumeric-vs-integer-minor-units"

  - id: money-currency-and-financial-data-010
    difficulty: intermediate
    tags: [intermediate-precision, rounding]
    question: |
      Why do many systems store intermediate values (per-unit prices, tax, FX) with 4-6
      decimal places rather than 2?
    options:
      - "To carry extra precision through calculations and round only once, at the final settlement/presentation step"
      - "To make the numbers look more precise and trustworthy to auditors reading the reports"
      - "Because most relational databases reject columns declared with a scale of only 2 digits"
      - "Because tax law in most jurisdictions forbids storing amounts at just 2 decimal places"
    answer: 0
    explanation: |
      Rounding on every intermediate multiply compounds error. Keeping extra scale internally
      and rounding once at the boundary (settlement or display) preserves accuracy for
      per-unit pricing, tax, and FX.
    ref: "concepts.md#decimalnumeric-vs-integer-minor-units"

  - id: money-currency-and-financial-data-011
    difficulty: beginner
    tags: [money-pattern, currency]
    question: |
      According to the Money pattern, a money value is fundamentally what?
    options:
      - "A single high-precision decimal number, currency-agnostic by design"
      - "An integer number of cents, with the currency inferred from context"
      - "An inseparable pair of an amount and a currency"
      - "A string already formatted for display in the user's locale"
    answer: 2
    explanation: |
      Fowler's Money pattern models money as (amount, currency). A bare number like 1000 is
      ambiguous — dollars, yen, or minor units? The currency must always travel with the
      amount, and every operation is currency-aware.
    ref: "concepts.md#money-is-an-amount-plus-a-currency"

  - id: money-currency-and-financial-data-012
    difficulty: intermediate
    tags: [currency, iso-4217]
    question: |
      What is ISO 4217 and how does it relate to money storage?
    options:
      - "A rounding standard that mandates banker's rounding for all monetary settlement"
      - "The standard defining three-letter currency codes (USD, EUR, JPY) and each currency's minor-unit digits"
      - "A JSON schema that standardizes the request format for card-payment APIs"
      - "The IEEE floating-point specification governing binary decimal arithmetic"
    answer: 1
    explanation: |
      ISO 4217 defines the three-letter alphabetic currency codes and the number of minor-unit
      digits for each currency — exactly the scale you need. Store the code as char(3) rather
      than inventing your own enum.
    ref: "concepts.md#money-is-an-amount-plus-a-currency"

  - id: money-currency-and-financial-data-013
    difficulty: intermediate
    tags: [currency, arithmetic, gotcha]
    question: |
      In a well-designed Money type, what should adding two amounts in different currencies do?
    options:
      - "Silently convert one operand to the other using today's mid-market rate"
      - "Return the larger of the two amounts and discard the smaller operand"
      - "Add the raw numeric values together and keep the first operand's currency"
      - "Throw an error — you cannot add different currencies without a rate and timestamp"
    answer: 3
    explanation: |
      $10 + €10 has no meaning without an exchange rate and a rate time. A correct Money type
      rejects cross-currency addition with a hard error; silent coercion is exactly the bug
      that plain-number models allow.
    ref: "concepts.md#money-is-an-amount-plus-a-currency"

  - id: money-currency-and-financial-data-014
    difficulty: intermediate
    tags: [schema, currency]
    question: |
      What is the minimum correct schema for a monetary column in a multi-currency system?
    options:
      - "An amount column plus a currency column, always stored together"
      - "A single DECIMAL amount column with the currency fixed system-wide"
      - "A double column with a schema comment naming the intended currency"
      - "A string column holding the fully formatted, locale-specific display value"
    answer: 0
    explanation: |
      An amount alone is ambiguous. You always need amount plus currency together. Aggregates
      must then be constrained to one currency or grouped by currency.
    ref: "concepts.md#money-is-an-amount-plus-a-currency"

  - id: money-currency-and-financial-data-015
    difficulty: beginner
    tags: [rounding, half-up]
    question: |
      Under "round half up," what does 2.5 round to at zero decimal places?
    options:
      - "2"
      - "3"
      - "2.5 stays unchanged"
      - "0"
    answer: 1
    explanation: |
      Round half up sends ties away from zero, so 2.5 → 3 and 2.4 → 2. It is the intuitive
      "round" most people mean and is common in retail pricing.
    ref: "concepts.md#rounding-modes-half-even-vs-half-up-and-others"

  - id: money-currency-and-financial-data-016
    difficulty: intermediate
    tags: [rounding, half-even, bankers]
    question: |
      Under "round half to even" (banker's rounding), what do 2.5 and 3.5 round to?
    options:
      - "3 and 4"
      - "3 and 3"
      - "2 and 3"
      - "2 and 4"
    answer: 3
    explanation: |
      Half-even breaks ties toward the nearest even last digit: 2.5 → 2 (2 is even) and 3.5 → 4
      (4 is even). This removes the directional bias that half-up introduces.
    ref: "concepts.md#rounding-modes-half-even-vs-half-up-and-others"

  - id: money-currency-and-financial-data-017
    difficulty: advanced
    tags: [rounding, half-even, bias]
    question: |
      What is the main statistical advantage of banker's rounding over round-half-up when
      rounding and summing many values?
    options:
      - "It is faster to compute because it inspects only the final digit of the mantissa"
      - "It always rounds ties downward, which systematically saves money across a large sum"
      - "It has no directional bias, so rounding errors tend to cancel instead of accumulating in one direction"
      - "It avoids binary floating-point representation entirely by working purely in base 10"
    answer: 2
    explanation: |
      Round-half-up nudges every tie the same way, so a large sum drifts upward (error grows
      roughly linearly). Half-even splits ties between up and down, so the error of a sum has
      no directional bias and tends to cancel — which matters when reconciling totals over many
      line items.
    ref: "concepts.md#rounding-modes-half-even-vs-half-up-and-others"

  - id: money-currency-and-financial-data-018
    difficulty: intermediate
    tags: [rounding, ieee-754]
    question: |
      Which rounding mode is the default in IEEE 754 arithmetic?
    options:
      - "Round half to even (banker's rounding)"
      - "Round half away from zero (arithmetic rounding)"
      - "Round toward zero (truncate the fractional part)"
      - "Round toward positive infinity (always ceiling)"
    answer: 0
    explanation: |
      IEEE 754's default rounding mode for binary results is round-half-to-even, chosen because
      it is unbiased. Note this is about the arithmetic standard — money should still use a
      decimal type, but the rounding mode concept carries over.
    ref: "concepts.md#rounding-modes-half-even-vs-half-up-and-others"

  - id: money-currency-and-financial-data-019
    difficulty: advanced
    tags: [rounding, business-rules]
    question: |
      For a production system, what is the best answer to "which rounding mode should we use"?
    options:
      - "Always half-even, since it is the IEEE 754 default and therefore mandatory for regulated finance"
      - "Always half-up, because it is the most intuitive to users and is the mode mandated by GAAP rules"
      - "Whatever your language's built-in default is, since the standard library always picks a compliant mode"
      - "Whatever the jurisdiction/contract mandates — make it explicit, configurable, and applied consistently"
    answer: 3
    explanation: |
      Rounding is a business/legal decision that varies by jurisdiction and contract. The right
      engineering answer is to make the chosen mode explicit and consistent rather than relying
      on a language's silent default.
    ref: "concepts.md#rounding-modes-half-even-vs-half-up-and-others"

  - id: money-currency-and-financial-data-020
    difficulty: intermediate
    tags: [rounding, intermediate-precision]
    question: |
      When should rounding to the currency's minor unit happen in a multi-step calculation?
    options:
      - "After every arithmetic operation, so each intermediate value is already a clean minor-unit amount"
      - "Once, at the final presentation/settlement boundary, carrying extra precision internally"
      - "Only when writing to the database, since the storage engine cannot persist sub-cent precision"
      - "Never — keep full precision forever and let the display layer format whatever digits remain"
    answer: 1
    explanation: |
      Rounding on every step compounds error. Carry extra precision internally and round once
      at the boundary where you present or settle the value.
    ref: "concepts.md#rounding-modes-half-even-vs-half-up-and-others"

  - id: money-currency-and-financial-data-021
    difficulty: beginner
    tags: [multi-currency]
    question: |
      Why is `SELECT SUM(amount) FROM payments` dangerous in a multi-currency table?
    options:
      - "SUM is slow on large tables and will time out once the payments table exceeds a few million rows"
      - "SUM cannot handle DECIMAL types and silently truncates the fractional cents before adding them"
      - "It adds together amounts denominated in different currencies, producing a meaningless number"
      - "It takes an exclusive table lock for writes, blocking every concurrent payment until it finishes"
    answer: 2
    explanation: |
      Summing across currencies (USD + EUR + JPY) is a category error. You must either GROUP BY
      currency, constrain the set to one currency, or convert to a single reporting currency at
      a recorded rate.
    ref: "concepts.md#multi-currency-exchange-rates-and-conversion"

  - id: money-currency-and-financial-data-022
    difficulty: intermediate
    tags: [multi-currency, fx, audit]
    question: |
      When converting between currencies, what must you persist for the result to be auditable
      and reproducible?
    options:
      - "Only the converted amount, since the rate can always be recomputed later from historical data"
      - "The user's IP address and browser locale, so the conversion can be attributed to a session"
      - "Just the source currency code, because the target currency is fixed by the reporting system"
      - "The rate, its source, and the timestamp used for the conversion"
    answer: 3
    explanation: |
      An exchange rate is valid only at an instant. Recording the rate, its source, and the
      timestamp makes the conversion reproducible and auditable. Model FX as a recorded event,
      not a lossless transformation.
    ref: "concepts.md#multi-currency-exchange-rates-and-conversion"

  - id: money-currency-and-financial-data-023
    difficulty: advanced
    tags: [multi-currency, fx, rounding]
    question: |
      Why does converting USD→EUR and then EUR→USD generally NOT return the original amount?
    options:
      - "Conversion involves division and rounding, which is lossy, so round-tripping doesn't restore the exact original"
      - "Exchange rates are stored as negative multipliers for the reverse direction, which flips the sign"
      - "The database drops the currency code during conversion, so the second step reconstructs it wrongly"
      - "Because EUR is defined with more minor-unit digits than USD, so the extra precision is discarded"
    answer: 0
    explanation: |
      Each conversion divides by (or multiplies by) a rate and rounds to the target currency's
      unit, which loses information. Round-tripping does not recover the exact original, so FX
      should be recorded as its own event rather than recomputed on demand.
    ref: "concepts.md#multi-currency-exchange-rates-and-conversion"

  - id: money-currency-and-financial-data-024
    difficulty: intermediate
    tags: [multi-currency, reporting]
    question: |
      A dashboard shows "total revenue" across USD, EUR, and JPY orders as one number. What is
      the correct fix?
    options:
      - "Round the total to the nearest whole dollar so the mixed-currency artifacts average out"
      - "Convert every amount to one reporting currency at a recorded rate/time, or group by currency"
      - "Cast every amount to double before summing so the different scales reconcile automatically"
      - "Only count the USD orders and ignore the EUR and JPY rows as statistically insignificant noise"
    answer: 1
    explanation: |
      A raw cross-currency sum is meaningless. Convert everything into a single reporting
      currency using recorded rates and timestamps, or report per-currency subtotals via GROUP
      BY currency.
    ref: "concepts.md#multi-currency-exchange-rates-and-conversion"

  - id: money-currency-and-financial-data-025
    difficulty: beginner
    tags: [ledger, double-entry]
    question: |
      In double-entry bookkeeping, what must be true of every transaction?
    options:
      - "It must involve exactly one account, with the offsetting side recorded in a separate journal"
      - "It must be denominated in USD and converted from any foreign currency before it is posted"
      - "It must update a running balance column on the account row as part of the same write"
      - "The sum of debits must equal the sum of credits"
    answer: 3
    explanation: |
      Double-entry means every transaction is a balanced set of postings: total debits equal
      total credits. Money is never created or destroyed, only moved — which makes the system
      self-checking.
    ref: "concepts.md#double-entry-ledger-vs-a-mutable-balance-column"

  - id: money-currency-and-financial-data-026
    difficulty: intermediate
    tags: [ledger, append-only]
    question: |
      In a proper double-entry ledger, how are corrections made to a posted entry?
    options:
      - "Post a new reversing entry — the ledger is append-only and history is never edited"
      - "UPDATE the erroneous row in place, keeping the original posting timestamp for the audit trail"
      - "DELETE the row and insert a corrected one within the same transaction so no gap is visible"
      - "Truncate the affected account's entries and replay them from the most recent nightly backup"
    answer: 0
    explanation: |
      The ledger is immutable/append-only. You never UPDATE or DELETE a posting; you post a
      reversing (adjusting) entry. This preserves the full audit trail and keeps history intact.
    ref: "concepts.md#double-entry-ledger-vs-a-mutable-balance-column"

  - id: money-currency-and-financial-data-027
    difficulty: intermediate
    tags: [ledger, balance]
    question: |
      In a ledger-based design, how is an account's balance obtained?
    options:
      - "Read directly from a single mutable balance column that every posting overwrites in place"
      - "Estimated from the most recent transaction alone, since it already reflects the latest state"
      - "Derived by summing the account's entries (optionally cached/materialized)"
      - "Stored redundantly in every entry row, so any single row already carries the current balance"
    answer: 2
    explanation: |
      The balance is derived by aggregating the account's immutable entries. High-read systems
      keep a cached/materialized balance as a derived optimization that is reconcilable against
      the ledger, which remains the source of truth.
    ref: "concepts.md#double-entry-ledger-vs-a-mutable-balance-column"

  - id: money-currency-and-financial-data-028
    difficulty: intermediate
    tags: [ledger, mutable-balance, trade-offs]
    question: |
      What is the main drawback of storing each account as a single mutable balance column that
      you UPDATE?
    options:
      - "It uses more disk than a full ledger because the balance must be re-indexed on every write"
      - "It keeps only the current balance — no audit trail, no self-checking, and a bug can silently create or destroy money"
      - "It cannot be updated inside a database transaction, so concurrent writes always lose data"
      - "It requires banker's rounding on every update, which most database engines do not support"
    answer: 1
    explanation: |
      A mutable balance is fast but forgetful: you can't explain why the balance is what it is,
      there's no history, and nothing verifies money was conserved. The append-only double-entry
      ledger is auditable and self-balancing.
    ref: "concepts.md#double-entry-ledger-vs-a-mutable-balance-column"

  - id: money-currency-and-financial-data-029
    difficulty: advanced
    tags: [ledger, transactions, acid]
    question: |
      Why must all the postings for one business event be written inside a single database
      transaction?
    options:
      - "To make the query faster by batching all the postings into one round trip to the database"
      - "To avoid using DECIMAL columns, since a single transaction can share one integer accumulator"
      - "Because the ISO 4217 currency standard requires every posting group to commit as one unit"
      - "So the balanced set of debits and credits is applied atomically — all or nothing — never leaving the ledger unbalanced"
    answer: 3
    explanation: |
      If only some postings landed, the ledger would be unbalanced and money apparently created
      or lost. Atomicity (see transactions-acid-isolation-levels) guarantees the whole balanced
      set commits together or not at all.
    ref: "concepts.md#double-entry-ledger-vs-a-mutable-balance-column"

  - id: money-currency-and-financial-data-030
    difficulty: advanced
    tags: [ledger, cached-balance]
    question: |
      A team keeps a cached running balance for fast reads alongside an append-only ledger. What
      is the correct relationship between them?
    options:
      - "The cached balance is the source of truth; the ledger is only a backup log kept for compliance"
      - "They are two independent systems of record and are allowed to disagree with each other permanently"
      - "The ledger is the source of truth; the cached balance is a derived value reconciled against it"
      - "The cached balance fully replaces the ledger once it has been populated from the first entries"
    answer: 2
    explanation: |
      The immutable ledger is authoritative. A cached balance is a performance optimization
      derived from it and must be reconcilable against the sum of entries; if they diverge, the
      ledger wins and the cache is corrected.
    ref: "concepts.md#double-entry-ledger-vs-a-mutable-balance-column"

  - id: money-currency-and-financial-data-031
    difficulty: beginner
    tags: [idempotency]
    question: |
      What problem does an idempotency key solve in a payment API?
    options:
      - "It prevents a retried request from performing the same charge twice"
      - "It encrypts the card number in transit so the payment processor never sees the raw PAN"
      - "It converts currencies automatically by attaching the current mid-market rate to the request"
      - "It compresses the request body so large batches of charges fit within the API size limit"
    answer: 0
    explanation: |
      Networks retry. An idempotency key uniquely identifies a logical operation; if the server
      sees the same key again it returns the original result instead of charging a second time.
    ref: "concepts.md#idempotent-financial-operations-no-double-charge"

  - id: money-currency-and-financial-data-032
    difficulty: intermediate
    tags: [idempotency, database]
    question: |
      Why should the idempotency key be stored with a unique constraint in the database?
    options:
      - "To make the key shorter, since a unique index compresses the stored value on disk"
      - "So concurrent duplicate requests collide at the database, not just in application logic that could race"
      - "To allow the same key to be safely reused across different users without any collision"
      - "Because DECIMAL amount columns require an associated unique key to be indexed correctly"
    answer: 1
    explanation: |
      A pure application-level check can race under concurrency: two duplicate requests both see
      "not processed yet." A unique constraint makes the duplicate insert fail at the database,
      guaranteeing only one succeeds.
    ref: "concepts.md#idempotent-financial-operations-no-double-charge"

  - id: money-currency-and-financial-data-033
    difficulty: advanced
    tags: [idempotency, ledger, transactions]
    question: |
      To get the strongest guarantee, how should the idempotency-key record and the ledger
      postings be written?
    options:
      - "In two separate transactions, committing the key first and then the postings right after"
      - "The key in Redis and the postings in SQL, relying on TTL expiry to keep the two in sync"
      - "The postings first, then the idempotency key written hours later in a nightly batch job"
      - "In the same database transaction, so 'recorded the key' and 'posted the entries' succeed or fail together"
    answer: 3
    explanation: |
      Committing the key insert and the postings in one transaction means there is never a key
      without a charge or a charge without a key. This ties request-level idempotency to
      ledger-level correctness.
    ref: "concepts.md#idempotent-financial-operations-no-double-charge"

  - id: money-currency-and-financial-data-034
    difficulty: intermediate
    tags: [idempotency, api-design]
    question: |
      A client retries a charge with the same idempotency key after not receiving a response.
      What should the server return?
    options:
      - "A fresh charge with a new id, treating the retry as a distinct payment attempt"
      - "An error telling the client to generate a new key before it may retry the request"
      - "The same result (same charge id) as the original request, performing no second charge"
      - "A partial refund of the first charge to offset the duplicate that the retry created"
    answer: 2
    explanation: |
      The whole point is that a retry with the same key returns the original stored result — the
      same charge id — so the client can safely retry without risking a double charge.
    ref: "concepts.md#idempotent-financial-operations-no-double-charge"

  - id: money-currency-and-financial-data-035
    difficulty: advanced
    tags: [idempotency, edge-case]
    question: |
      Why is it good practice to store a hash of the request alongside the idempotency key?
    options:
      - "So a different request that reuses an existing key (a client bug) can be detected and rejected"
      - "To compress storage, since a fixed-length hash takes less room than the full request body"
      - "To convert the currency, because the hash encodes the amount in a currency-neutral form"
      - "To speed up the unique index by giving it a shorter, fixed-width value to compare against"
    answer: 0
    explanation: |
      An idempotency key should map to one specific request. Storing a request hash lets the
      server detect when a caller reuses a key for a materially different request and reject it,
      rather than silently returning the wrong prior result.
    ref: "concepts.md#idempotent-financial-operations-no-double-charge"

  - id: money-currency-and-financial-data-036
    difficulty: beginner
    tags: [reconciliation]
    question: |
      What is reconciliation in a financial system?
    options:
      - "Encrypting money data at rest so ledger balances cannot be read from a stolen backup"
      - "Verifying that two independent records of the same money agree (e.g. ledger vs bank statement)"
      - "Rounding all account balances to whole dollars at the end of each accounting period"
      - "Deleting old, fully-settled transactions from the ledger to reclaim storage space over time"
    answer: 1
    explanation: |
      Reconciliation compares independent records — your ledger against the processor/bank
      statement, or a cached balance against the sum of ledger entries — to detect and resolve
      discrepancies.
    ref: "concepts.md#reconciliation"

  - id: money-currency-and-financial-data-037
    difficulty: intermediate
    tags: [reconciliation, internal-checks]
    question: |
      Which of these is an example of an internal reconciliation check?
    options:
      - "Confirming the customer's email address is valid before a payment is accepted"
      - "Checking that the payment endpoint's TLS certificate has not yet expired"
      - "Ensuring the payment API responds with an HTTP 200 status on every call"
      - "Verifying that each account's cached balance equals SUM of its ledger entries"
    answer: 3
    explanation: |
      Internal reconciliation verifies invariants like cached_balance == SUM(entries), that
      every transaction's debits equal its credits, and that internal accounts net to zero per
      currency.
    ref: "concepts.md#reconciliation"

  - id: money-currency-and-financial-data-038
    difficulty: intermediate
    tags: [reconciliation, corrections]
    question: |
      When reconciliation finds a discrepancy in an append-only ledger, how is it resolved?
    options:
      - "Post adjusting/reversing entries — history is never edited"
      - "UPDATE the incorrect historical entry in place, keeping its original posting timestamp"
      - "DELETE the affected transactions and let the derived balances recompute themselves"
      - "Disable reconciliation for that account until the next scheduled audit clears it"
    answer: 0
    explanation: |
      Because the ledger is immutable, discrepancies are corrected by posting new
      adjusting/reversing entries, preserving the full audit trail rather than rewriting history.
    ref: "concepts.md#reconciliation"

  - id: money-currency-and-financial-data-039
    difficulty: beginner
    tags: [json, precision-in-transit]
    question: |
      Why is representing money as a JSON number (e.g. `"amount": 10.10`) risky?
    options:
      - "JSON numbers are always decoded as strings anyway, so the amount is safe by definition"
      - "The JSON grammar forbids decimal points in numbers, so 10.10 fails to parse at all"
      - "Most parsers decode a JSON number into an IEEE 754 double, reintroducing floating-point error"
      - "It makes the serialized payload noticeably larger than an equivalent string field"
    answer: 2
    explanation: |
      JSON doesn't bound numeric precision, but most parsers (all of JavaScript) decode numbers
      into doubles, so 10.10 becomes a lossy double — undoing the exactness you kept in the
      database.
    ref: "concepts.md#precision-in-transit-json-and-message-payloads"

  - id: money-currency-and-financial-data-040
    difficulty: intermediate
    tags: [json, precision-in-transit]
    question: |
      What is the safest, most language-neutral way to represent a monetary amount in JSON?
    options:
      - "As a floating-point number, since 64-bit doubles are exact for two-decimal amounts"
      - "As a string, e.g. \"amount\": \"10.10\""
      - "As a percentage of the account's total, letting the receiver reconstruct the amount"
      - "As scientific-notation mantissa/exponent, which every JSON parser reads without loss"
    answer: 1
    explanation: |
      Sending the amount as a string preserves the exact decimal text; the receiver parses it
      into a decimal type. This avoids the double round-trip problem and is what many payment
      APIs do.
    ref: "concepts.md#precision-in-transit-json-and-message-payloads"

  - id: money-currency-and-financial-data-041
    difficulty: advanced
    tags: [json, javascript, big-integers]
    question: |
      Sending money as integer minor units in JSON is safe UNLESS what?
    options:
      - "The amount is negative, because JSON cannot encode a leading minus sign on integers"
      - "The currency is USD, since dollar amounts are the only ones parsers special-case"
      - "The scale is exactly 2, because two-digit minor units overflow a 32-bit integer field"
      - "The value exceeds 2^53 (JavaScript's Number.MAX_SAFE_INTEGER) while sent as a bare number"
    answer: 3
    explanation: |
      JavaScript numbers are doubles, which represent integers exactly only up to 2^53. A large
      minor-units integer beyond that loses precision unless it is sent as a string. The receiver
      also needs to know the scale.
    ref: "concepts.md#precision-in-transit-json-and-message-payloads"

  - id: money-currency-and-financial-data-042
    difficulty: advanced
    tags: [json, contract]
    question: |
      Your service uses BigDecimal internally, but the public API contract types `amount` as a
      JSON number. Why is this still a problem?
    options:
      - "Consumers using double-based parsers (e.g. JavaScript) can corrupt the value regardless of your internal type"
      - "BigDecimal arithmetic is slower than double, so the endpoint would miss its latency budget"
      - "BigDecimal values cannot be serialized to JSON at all without a custom binary codec"
      - "Emitting a BigDecimal roughly doubles the payload size compared with a plain number"
    answer: 0
    explanation: |
      Correctness end-to-end depends on the wire contract, not just your internals. A JSON number
      means any consumer with a double-based parser can lose precision. Type money as a string in
      the schema and validate on both sides.
    ref: "concepts.md#precision-in-transit-json-and-message-payloads"

  - id: money-currency-and-financial-data-043
    difficulty: beginner
    tags: [allocation, splitting]
    question: |
      Splitting $10.00 three ways as `round(10.00/3)` = $3.33 each has what problem?
    options:
      - "$3.33 is not a valid two-decimal amount and the database will reject the column value"
      - "It divides by the wrong number, since three shares should be computed as 10.00 / 2"
      - "3.33 × 3 = 9.99, so a penny is lost"
      - "It silently creates an extra dollar that has to be written off at period close"
    answer: 2
    explanation: |
      Independent rounding of each share loses (or invents) money: three shares of $3.33 sum to
      $9.99, not $10.00. Allocation must ensure the parts re-sum exactly to the original.
    ref: "concepts.md#allocation-and-splitting-without-losing-pennies"

  - id: money-currency-and-financial-data-044
    difficulty: intermediate
    tags: [allocation, algorithm]
    question: |
      Using the largest-remainder method, how is $10.00 split three ways in cents?
    options:
      - "[333, 333, 333] and simply drop the leftover cent as an unavoidable rounding loss"
      - "[350, 325, 325], weighting the first share higher to absorb the remainder proportionally"
      - "[333.33, 333.33, 333.33], keeping fractional cents in each share for exactness"
      - "[334, 333, 333] — floor each share, then distribute the leftover cent"
    answer: 3
    explanation: |
      Work in minor units: 1000 cents / 3 = 333 each with remainder 1. Distribute the leftover
      cent to one share → [334, 333, 333], which sums exactly to 1000. No penny is lost or
      created.
    ref: "concepts.md#allocation-and-splitting-without-losing-pennies"

  - id: money-currency-and-financial-data-045
    difficulty: intermediate
    tags: [allocation, principle]
    question: |
      What is the general rule for allocating an amount into parts without losing pennies?
    options:
      - "Use double division and round each part independently to the nearest minor unit"
      - "Work in integer minor units, floor each share, then deterministically distribute the remainder so parts re-sum to the whole"
      - "Always give every recipient the ceiling of the share so no one is ever shorted"
      - "Convert the total to another currency first so the division comes out even"
    answer: 1
    explanation: |
      The safe pattern: compute floored shares in minor units, then hand out the remaining minor
      units one at a time by a deterministic rule. This guarantees the shares add back to the
      original total.
    ref: "concepts.md#allocation-and-splitting-without-losing-pennies"

  - id: money-currency-and-financial-data-046
    difficulty: advanced
    tags: [allocation, weighted]
    question: |
      For a weighted split (e.g. ratio 3:1), how does the largest-remainder allocation decide who
      gets leftover minor units?
    options:
      - "Floor each weighted share, then give leftover units to the entries with the largest fractional parts until the total matches"
      - "Randomly, drawing a recipient by lottery for each leftover minor unit that remains"
      - "Give all the leftover units to whichever entry carries the smallest weight in the ratio"
      - "Round every weighted share up to the next minor unit and absorb the overage elsewhere"
    answer: 0
    explanation: |
      Compute each weighted share, floor it, then distribute the remaining minor units to the
      entries whose fractional parts were largest, until the pieces sum exactly to the total —
      a deterministic, penny-exact allocation.
    ref: "concepts.md#allocation-and-splitting-without-losing-pennies"

  - id: money-currency-and-financial-data-047
    difficulty: intermediate
    tags: [scenario, design]
    question: |
      You are designing a wallet service. Which combination best reflects money-handling best
      practices?
    options:
      - "Double balances summed directly across currencies, with no idempotency keys on charges"
      - "Store formatted display strings like \"$10.00\" and parse them back into numbers when needed"
      - "One mutable balance column per user, updated in place as a floating-point running total"
      - "Integer minor units (or DECIMAL) with currency, append-only double-entry ledger, idempotency keys, and money as strings in JSON"
    answer: 3
    explanation: |
      The correct stack: exact representation (integer minor units or DECIMAL) always paired with
      currency, an append-only double-entry ledger as source of truth, idempotency keys to prevent
      double-charges, and string-encoded money on the wire to preserve precision.
    ref: "concepts.md#double-entry-ledger-vs-a-mutable-balance-column"

  - id: money-currency-and-financial-data-048
    difficulty: advanced
    tags: [scenario, currency, gotcha]
    question: |
      A JPY (0 minor digits) amount flows through code that assumes 2 minor digits and divides by
      100. What is the likely result?
    options:
      - "Correct output, since dividing by 100 yields the right major unit for every currency"
      - "A database constraint violation only, with the numeric amount itself left untouched"
      - "The amount is misinterpreted by a factor of 100 — e.g. ¥500 treated as ¥5.00"
      - "The stored currency code is silently rewritten from JPY to USD during the division"
    answer: 2
    explanation: |
      JPY has no minor unit, so ¥500 is stored as 500 minor units. Code that divides by 100 to get
      "major units" turns it into 5.00, off by a factor of 100. Minor-unit scale must come from the
      currency (ISO 4217), never a hard-coded constant.
    ref: "concepts.md#decimalnumeric-vs-integer-minor-units"

  - id: money-currency-and-financial-data-049
    difficulty: intermediate
    tags: [scenario, reconciliation, idempotency]
    question: |
      A processor webhook is delivered twice for the same payment. Which two mechanisms together
      prevent double-counting and let you verify correctness afterward?
    options:
      - "Idempotency keys (dedupe the duplicate) plus reconciliation (verify ledger vs processor)"
      - "Float-typed running balances combined with a nightly service restart to clear duplicates"
      - "A higher DECIMAL scale on the amount column together with banker's rounding on each write"
      - "Sending the money value as a JSON number so the duplicate webhook parses identically"
    answer: 0
    explanation: |
      Idempotency on the webhook (keyed by the event/payment id) prevents applying the duplicate
      twice, and reconciliation against the processor statement confirms the ledger matches
      external reality. They address different layers and complement each other.
    ref: "concepts.md#idempotent-financial-operations-no-double-charge"

  - id: money-currency-and-financial-data-050
    difficulty: expert
    tags: [scenario, ledger, isolation]
    question: |
      Two concurrent transfers debit the same account whose cached balance you also update. Without
      proper isolation, which anomaly risks overdrawing the account?
    options:
      - "A dirty read only — one transfer reads the other's uncommitted balance and nothing more"
      - "A phantom insert, where a new currency row appears mid-transaction and skews the balance"
      - "Durability loss on commit, so an acknowledged debit vanishes after the database restarts"
      - "Lost update — both read the same starting balance and each writes back its own decrement, losing one"
    answer: 3
    explanation: |
      Concurrent read-modify-write on the cached balance is the classic lost-update race: both
      transactions read the old balance and overwrite it, so one debit disappears and the account
      can be overdrawn. Prevent it with atomic updates, row locks, a version/CAS column, or
      SERIALIZABLE — see transactions-acid-isolation-levels.
    ref: "concepts.md#double-entry-ledger-vs-a-mutable-balance-column"
