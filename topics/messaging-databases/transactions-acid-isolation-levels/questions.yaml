topic: "Transactions, ACID & Isolation Levels"
domain: messaging-databases
topic_slug: transactions-acid-isolation-levels
version: 1
questions:
  - id: transactions-acid-isolation-levels-001
    difficulty: beginner
    tags: [acid, atomicity]
    question: |
      Which ACID property guarantees that a transaction is "all-or-nothing" — if
      any part fails, every change it made is undone?
    options:
      - "Consistency"
      - "Atomicity"
      - "Isolation"
      - "Durability"
    answer: 1
    explanation: |
      Atomicity is about abortability: a transaction either fully takes effect or is
      completely rolled back. It is implemented with undo logging (or, in PostgreSQL,
      by never overwriting rows in place).
    ref: "concepts.md#acid-properties-precisely"

  - id: transactions-acid-isolation-levels-002
    difficulty: beginner
    tags: [acid, durability]
    question: |
      Which ACID property ensures that once a transaction commits, its effects
      survive a crash or power loss?
    options:
      - "Atomicity"
      - "Durability"
      - "Isolation"
      - "Consistency"
    answer: 1
    explanation: |
      Durability means committed data has reached non-volatile storage (via fsync of
      the WAL), so it survives restarts. In replicated systems it may also require a
      quorum of replicas.
    ref: "concepts.md#acid-properties-precisely"

  - id: transactions-acid-isolation-levels-003
    difficulty: intermediate
    tags: [acid, consistency]
    question: |
      In ACID, why is "Consistency" considered the odd one out among the four
      properties?
    options:
      - "It is enforced entirely by the storage hardware's firmware during each block write"
      - "It is merely a synonym for Isolation and adds nothing beyond concurrency control"
      - "It is largely the application's responsibility; the DB only enforces the constraints you declare"
      - "It only applies to read-only transactions and is ignored for write-heavy work"
    answer: 2
    explanation: |
      The database enforces declared constraints (CHECK, FK, UNIQUE), but application-
      level invariants (e.g. "all balances sum to a constant") are the app's job. The
      "C" is often described as the letter added to make ACID pronounceable.
    ref: "concepts.md#acid-properties-precisely"

  - id: transactions-acid-isolation-levels-004
    difficulty: intermediate
    tags: [acid, isolation, constraints]
    question: |
      A UNIQUE constraint that rejects a duplicate key is enforcing which ACID
      property?
    options:
      - "Isolation"
      - "Consistency"
      - "Durability"
      - "Atomicity"
    answer: 1
    explanation: |
      Constraint enforcement (UNIQUE, CHECK, FK) is the database's contribution to
      Consistency — preserving declared invariants. Isolation is strictly about
      interference between concurrent transactions, not about invariant validity.
    ref: "concepts.md#acid-properties-precisely"

  - id: transactions-acid-isolation-levels-005
    difficulty: beginner
    tags: [atomicity, undo, rollback]
    question: |
      What mechanism lets an engine restore a row to its prior value when a
      transaction is rolled back?
    options:
      - "The query planner cache, which replays each statement's chosen execution plan in reverse"
      - "The undo log (old-version records saved before in-place update)"
      - "The buffer pool eviction list, which restores pages by re-reading them from disk on rollback"
      - "The connection pool, which discards the client session and reopens it with the prior state"
    answer: 1
    explanation: |
      Before an in-place update, engines like InnoDB save the old value in an undo
      log; ROLLBACK (and crash recovery of uncommitted work) replays those records.
      Those same old versions also serve MVCC reads.
    ref: "concepts.md#atomicity-and-the-undo-log"

  - id: transactions-acid-isolation-levels-006
    difficulty: advanced
    tags: [atomicity, postgresql, mvcc]
    question: |
      How does PostgreSQL implement "undo" for a rolled-back UPDATE, given it never
      overwrites a row in place?
    options:
      - "An UPDATE writes a new row version and marks the old one dead; rollback simply never makes the new version visible"
      - "It copies the whole table to a shadow file and atomically swaps it in at commit time"
      - "It reverses each individual byte change previously recorded in the physical redo log"
      - "It restores the affected row from the most recent full backup taken before the update"
    answer: 0
    explanation: |
      PostgreSQL's MVCC writes a new tuple and marks the prior one dead. On rollback
      the new version is simply never made visible (dead tuples are later reclaimed by
      VACUUM), so there is no separate in-place undo step.
    ref: "concepts.md#atomicity-and-the-undo-log"

  - id: transactions-acid-isolation-levels-007
    difficulty: intermediate
    tags: [atomicity, ddl, mysql]
    question: |
      A developer runs `ALTER TABLE` inside a MySQL transaction and later issues
      ROLLBACK. What happens?
    options:
      - "Most DDL causes an implicit commit and cannot be rolled back in MySQL"
      - "The ALTER is rolled back cleanly, like any DML"
      - "MySQL raises a syntax error; DDL is not allowed inside any transaction block"
      - "The whole connection is dropped and every prior statement in the transaction is discarded"
    answer: 0
    explanation: |
      In MySQL most DDL statements cause an implicit commit and are non-transactional,
      so they cannot be rolled back. PostgreSQL, by contrast, supports transactional
      DDL. This is a classic portability gotcha.
    ref: "concepts.md#atomicity-and-the-undo-log"

  - id: transactions-acid-isolation-levels-008
    difficulty: intermediate
    tags: [atomicity, savepoint]
    question: |
      What does `ROLLBACK TO SAVEPOINT sp1` do?
    options:
      - "Aborts the entire transaction and disconnects the client session immediately"
      - "Commits everything up to the savepoint durably while discarding later statements"
      - "Creates a new independent transaction that runs nested inside the current one"
      - "Undoes only the work performed after the savepoint, keeping the transaction open"
    answer: 3
    explanation: |
      A savepoint marks a point inside a transaction; rolling back to it undoes only
      the work done after it, leaving earlier changes and the transaction itself
      intact. It uses the same undo machinery as full rollback.
    ref: "concepts.md#atomicity-and-the-undo-log"

  - id: transactions-acid-isolation-levels-009
    difficulty: intermediate
    tags: [durability, wal]
    question: |
      What is the write-ahead logging (WAL) rule?
    options:
      - "The log record describing a change must reach durable storage before the data page and before the commit is acknowledged"
      - "Data pages must be flushed to disk first, and only afterward may the matching log record be written"
      - "The log may be safely discarded once the transaction begins, since the buffer pool holds the truth"
      - "Every SELECT must be logged to durable storage before it is allowed to return rows to the client"
    answer: 0
    explanation: |
      WAL (formalized by ARIES) requires the log to be persisted before the
      corresponding data page and before commit is reported. Sequential log flushes
      are far cheaper than random data-page flushes, enabling durability efficiently.
    ref: "concepts.md#durability-wal-and-fsync"

  - id: transactions-acid-isolation-levels-010
    difficulty: intermediate
    tags: [durability, fsync, commit]
    question: |
      Why does a durable commit typically call fsync on the log?
    options:
      - "To compress the log with zlib before it is written to the underlying storage device"
      - "To force the log (up to the commit record) physically onto disk before acknowledging the commit"
      - "To rebuild all indexes touched by the transaction so later reads stay consistent"
      - "To acquire an exclusive table lock that blocks other writers until the commit finishes"
    answer: 1
    explanation: |
      Data pages are flushed lazily from the buffer pool. fsync forces the WAL
      (including the commit record) to durable storage first, so a committed
      transaction survives a crash even if its data pages are still only in RAM.
    ref: "concepts.md#durability-wal-and-fsync"

  - id: transactions-acid-isolation-levels-011
    difficulty: advanced
    tags: [durability, mysql, innodb]
    question: |
      What does `innodb_flush_log_at_trx_commit = 2` trade off compared to the
      default value of 1?
    options:
      - "It writes the log to the OS cache each commit but fsyncs about once per second, gaining speed but risking loss of recent commits on an OS/host crash"
      - "It fsyncs the redo log twice on every commit for extra safety against torn writes"
      - "It disables the redo log entirely and relies on the doublewrite buffer for recovery"
      - "It makes commits strictly more durable by requiring an acknowledgement from every replica"
    answer: 0
    explanation: |
      Value 1 fsyncs the redo log on every commit (fully durable). Value 2 writes to
      the OS cache per commit but flushes ~once a second, so a host crash can lose the
      last ~1s of commits — faster but weaker durability.
    ref: "concepts.md#durability-wal-and-fsync"

  - id: transactions-acid-isolation-levels-012
    difficulty: advanced
    tags: [durability, hardware, fsync]
    question: |
      Even with fsync called on every commit, what can still defeat durability?
    options:
      - "A disk write cache that acknowledges writes before they are truly persisted, with no power-loss protection"
      - "Using a primary key on the table, which forces buffered writes to bypass the WAL"
      - "Running the transaction at SERIALIZABLE, which defers the fsync until the snapshot closes"
      - "Having more than one secondary index on the table, which splits the flush across files"
    answer: 0
    explanation: |
      A volatile disk/controller write cache can ack an fsync before data is on stable
      media; a power loss then loses it. True durability needs power-loss-protected /
      battery-backed caches or the volatile cache disabled.
    ref: "concepts.md#durability-wal-and-fsync"

  - id: transactions-acid-isolation-levels-013
    difficulty: advanced
    tags: [durability, innodb, binlog, redo-log]
    question: |
      In InnoDB, what is the difference between the redo log and the binlog?
    options:
      - "They are two names for the same underlying file, kept only for historical compatibility"
      - "The binlog handles crash recovery for InnoDB; the redo log records and replays user queries"
      - "The redo log is for crash recovery (durability); the binlog is a logical, engine-independent log for replication and point-in-time recovery"
      - "The redo log stores buffered query results; the binlog stores the table's secondary indexes"
    answer: 2
    explanation: |
      The redo log provides physical crash recovery/durability for InnoDB, while the
      binlog is a server-level logical log used for replication and PITR. A two-phase
      commit between them keeps the two consistent.
    ref: "concepts.md#durability-wal-and-fsync"

  - id: transactions-acid-isolation-levels-014
    difficulty: beginner
    tags: [isolation-levels]
    question: |
      Which isolation level is the strictest of the four ANSI levels?
    options:
      - "READ UNCOMMITTED"
      - "SERIALIZABLE"
      - "READ COMMITTED"
      - "REPEATABLE READ"
    answer: 1
    explanation: |
      SERIALIZABLE is the strongest; it forbids dirty reads, non-repeatable reads, and
      phantoms, producing results equivalent to some serial execution of the
      transactions.
    ref: "concepts.md#the-four-sql-isolation-levels"

  - id: transactions-acid-isolation-levels-015
    difficulty: intermediate
    tags: [isolation-levels, defaults, postgresql, mysql]
    question: |
      What are the default isolation levels of PostgreSQL and MySQL/InnoDB
      respectively?
    options:
      - "REPEATABLE READ and READ COMMITTED"
      - "READ COMMITTED and REPEATABLE READ"
      - "SERIALIZABLE and SERIALIZABLE"
      - "READ UNCOMMITTED and READ COMMITTED"
    answer: 1
    explanation: |
      PostgreSQL defaults to READ COMMITTED; MySQL/InnoDB defaults to REPEATABLE READ.
      This difference is a very common interview question and changes cross-statement
      snapshot behavior.
    ref: "concepts.md#the-four-sql-isolation-levels"

  - id: transactions-acid-isolation-levels-016
    difficulty: beginner
    tags: [isolation-levels, read-committed]
    question: |
      At READ COMMITTED, which anomaly is guaranteed to be prevented?
    options:
      - "Phantom reads"
      - "Dirty reads"
      - "Write skew"
      - "Non-repeatable reads"
    answer: 1
    explanation: |
      READ COMMITTED prevents dirty reads (you never see another transaction's
      uncommitted data) but still allows non-repeatable reads and phantoms.
    ref: "concepts.md#the-four-sql-isolation-levels"

  - id: transactions-acid-isolation-levels-017
    difficulty: advanced
    tags: [isolation-levels, read-uncommitted, postgresql]
    question: |
      What happens if you request READ UNCOMMITTED in PostgreSQL?
    options:
      - "You get true dirty reads, seeing other transactions' uncommitted row versions directly"
      - "It behaves identically to READ COMMITTED — PostgreSQL never returns uncommitted data"
      - "PostgreSQL raises an unsupported-isolation-level error and aborts the current transaction"
      - "It silently upgrades the whole session to SERIALIZABLE with full predicate locking"
    answer: 1
    explanation: |
      PostgreSQL implements READ UNCOMMITTED as READ COMMITTED; its MVCC never exposes
      uncommitted rows. InnoDB, in contrast, does allow real dirty reads at READ
      UNCOMMITTED.
    ref: "concepts.md#the-four-sql-isolation-levels"

  - id: transactions-acid-isolation-levels-018
    difficulty: intermediate
    tags: [isolation-levels, syntax]
    question: |
      Which statement correctly sets the isolation level for a single transaction?
    options:
      - "BEGIN TRANSACTION ISOLATION LEVEL REPEATABLE READ;"
      - "SET GLOBAL isolation = high FOR CURRENT TRANSACTION;"
      - "CREATE ISOLATION REPEATABLE READ ON CURRENT SESSION;"
      - "ALTER SESSION FORCE SERIALIZABLE UNTIL COMMIT;"
    answer: 0
    explanation: |
      `BEGIN TRANSACTION ISOLATION LEVEL <level>` (or `SET TRANSACTION ISOLATION LEVEL
      ...`) sets the level for that transaction per the SQL standard.
    ref: "concepts.md#the-four-sql-isolation-levels"

  - id: transactions-acid-isolation-levels-019
    difficulty: beginner
    tags: [anomalies, dirty-read]
    question: |
      A transaction reads a row another transaction has written but not committed,
      and that other transaction then rolls back. What anomaly occurred?
    options:
      - "Non-repeatable read"
      - "Phantom read"
      - "Dirty read"
      - "Write skew"
    answer: 2
    explanation: |
      Reading uncommitted data that is later rolled back is a dirty read — you acted on
      a value that never officially existed. It is prevented at READ COMMITTED and
      above.
    ref: "concepts.md#read-phenomena-and-anomalies"

  - id: transactions-acid-isolation-levels-020
    difficulty: intermediate
    tags: [anomalies, non-repeatable-read]
    question: |
      T1 reads row id=1 and gets balance 100. T2 updates it to 150 and commits. T1
      re-reads the same row and now gets 150. What is this called?
    options:
      - "Dirty read"
      - "Phantom read"
      - "Non-repeatable read"
      - "Lost update"
    answer: 2
    explanation: |
      Reading the same existing row twice and getting different committed values is a
      non-repeatable (fuzzy) read. It is prevented at REPEATABLE READ, where the
      transaction sees a stable snapshot.
    ref: "concepts.md#read-phenomena-and-anomalies"

  - id: transactions-acid-isolation-levels-021
    difficulty: intermediate
    tags: [anomalies, phantom]
    question: |
      What distinguishes a phantom read from a non-repeatable read?
    options:
      - "A phantom involves rows appearing/disappearing from a range query; a non-repeatable read is an existing row's value changing"
      - "They are two names for the exact same anomaly, differing only in which SQL dialect's documentation describes it"
      - "A phantom can only occur at READ UNCOMMITTED, while a non-repeatable read is unique to the READ COMMITTED level"
      - "A non-repeatable read is caused only by INSERT statements, while a phantom read is triggered only by DELETE statements"
    answer: 0
    explanation: |
      A phantom concerns the set of rows matching a predicate changing (an INSERT/
      DELETE by another transaction); a non-repeatable read concerns an existing row's
      value changing. Phantoms are prevented at SERIALIZABLE (and by gap locks in
      InnoDB RR).
    ref: "concepts.md#read-phenomena-and-anomalies"

  - id: transactions-acid-isolation-levels-022
    difficulty: intermediate
    tags: [anomalies, phantom, count]
    question: |
      T1 runs `SELECT count(*) FROM orders WHERE amount > 1000` and gets 5. T2 inserts
      a matching row and commits. T1 re-runs the query and gets 6. Which anomaly is
      this?
    options:
      - "Dirty read"
      - "Lost update"
      - "Non-repeatable read"
      - "Phantom read"
    answer: 3
    explanation: |
      A predicate/range query returning a different set of rows because another
      transaction inserted a matching row is a phantom read.
    ref: "concepts.md#read-phenomena-and-anomalies"

  - id: transactions-acid-isolation-levels-023
    difficulty: intermediate
    tags: [anomalies, lost-update]
    question: |
      Two transactions both read counter=42, both compute 43, and both write 43. The
      final value should have been 44. What anomaly is this?
    options:
      - "Phantom read"
      - "Write skew"
      - "Lost update"
      - "Dirty read"
    answer: 2
    explanation: |
      This is a lost update: two read-modify-write cycles on the same row, and one
      overwrites the other's change. Fixes include atomic `SET count = count + 1`,
      `SELECT ... FOR UPDATE`, or a version/CAS column.
    ref: "concepts.md#lost-update-and-write-skew"

  - id: transactions-acid-isolation-levels-024
    difficulty: intermediate
    tags: [lost-update, atomic-write, fix]
    question: |
      Which single statement most directly avoids a lost update when incrementing a
      counter under concurrency?
    options:
      - "SELECT count FROM counters WHERE id=1; then UPDATE counters SET count=43 WHERE id=1"
      - "SELECT count FROM counters WHERE id=1 FOR SHARE"
      - "SET TRANSACTION ISOLATION LEVEL READ UNCOMMITTED"
      - "UPDATE counters SET count = count + 1 WHERE id = 1"
    answer: 3
    explanation: |
      Pushing the read-modify-write into one atomic statement (`count = count + 1`)
      lets the database serialize the row write, eliminating the lost-update race
      without an explicit lock round trip.
    ref: "concepts.md#lost-update-and-write-skew"

  - id: transactions-acid-isolation-levels-025
    difficulty: advanced
    tags: [write-skew, snapshot-isolation]
    question: |
      In the "at least one doctor on call" example, both transactions read that 2
      doctors are on call, and each takes a different doctor off call, ending with
      zero. This is which anomaly, and does snapshot isolation prevent it?
    options:
      - "Lost update; snapshot isolation prevents it"
      - "Dirty read; snapshot isolation prevents it"
      - "Write skew; snapshot isolation does NOT prevent it"
      - "Phantom; snapshot isolation always prevents it"
    answer: 2
    explanation: |
      This is write skew: each transaction reads an overlapping set and writes a
      different row, so there is no write-write conflict for SI to catch. Snapshot
      isolation permits it; only true SERIALIZABLE (SSI) or locking the read rows
      prevents it.
    ref: "concepts.md#lost-update-and-write-skew"

  - id: transactions-acid-isolation-levels-026
    difficulty: advanced
    tags: [write-skew, fix, select-for-update]
    question: |
      Which approach reliably prevents write skew?
    options:
      - "Running at SERIALIZABLE (SSI), or materializing the conflict by locking all read rows with SELECT ... FOR UPDATE"
      - "Switching from REPEATABLE READ down to READ COMMITTED, so each statement takes a fresher snapshot of the rows"
      - "Adding a UNIQUE index on the primary key, which forces the two writers to serialize on the shared key value"
      - "Reducing the connection pool size so fewer transactions run concurrently and the overlapping snapshots stop forming"
    answer: 0
    explanation: |
      Write skew stems from decisions made on stale snapshots across different rows.
      SERIALIZABLE detects it (SSI), or you can materialize the conflict by taking
      row locks (`FOR UPDATE`) on everything the decision depends on.
    ref: "concepts.md#lost-update-and-write-skew"

  - id: transactions-acid-isolation-levels-027
    difficulty: intermediate
    tags: [lost-update, optimistic, version-column]
    question: |
      Using `UPDATE items SET data='new', version=4 WHERE id=7 AND version=3` and
      checking rows-affected is an example of what?
    options:
      - "Pessimistic locking"
      - "A dirty read"
      - "Optimistic concurrency control (compare-and-set on a version column)"
      - "Two-phase commit"
    answer: 2
    explanation: |
      This is optimistic concurrency: no lock is held; the update succeeds only if the
      version is unchanged. Zero rows affected means someone else won, and the app
      re-reads and retries.
    ref: "concepts.md#lost-update-and-write-skew"

  - id: transactions-acid-isolation-levels-028
    difficulty: intermediate
    tags: [mvcc, locking]
    question: |
      What is the defining concurrency benefit of MVCC over strict two-phase locking?
    options:
      - "Writers never need to take any locks at all, since each write simply appends a brand-new version"
      - "It eliminates deadlocks entirely, because version timestamps replace every lock the engine would take"
      - "It removes the need for a write-ahead log, since old row versions already provide full crash recovery"
      - "Readers never block writers and writers never block readers"
    answer: 3
    explanation: |
      MVCC serves each reader the version visible as of its snapshot, so reads and
      writes don't block each other. (Conflicting writers still block each other.)
      This is why MVCC scales read-heavy workloads well.
    ref: "concepts.md#mvcc-versus-locking"

  - id: transactions-acid-isolation-levels-029
    difficulty: intermediate
    tags: [locking, 2pl]
    question: |
      Under strict two-phase locking (2PL), what is true of shared (S) and exclusive
      (X) locks?
    options:
      - "S and X locks never conflict with each other, so any number of readers and writers proceed in parallel"
      - "Only writers ever take locks; readers run entirely lock-free by consulting the buffer pool directly"
      - "Readers take S locks, writers take X locks; S/X conflict, so readers block writers and vice versa, and locks are held to commit"
      - "Locks are released immediately after each individual statement finishes, well before the transaction commits"
    answer: 2
    explanation: |
      In strict 2PL readers hold S locks and writers hold X locks until commit; because
      S and X conflict, readers block writers and writers block readers. It yields true
      serializability but lower concurrency and deadlock risk.
    ref: "concepts.md#mvcc-versus-locking"

  - id: transactions-acid-isolation-levels-030
    difficulty: advanced
    tags: [mvcc, postgresql, vacuum]
    question: |
      In PostgreSQL's MVCC, where do superseded (dead) row versions live and how are
      they reclaimed?
    options:
      - "In a dedicated undo tablespace outside the heap; reclaimed asynchronously by background purge threads"
      - "In the redo log alongside the WAL records; reclaimed automatically at each checkpoint flush"
      - "They are deleted synchronously during the UPDATE itself, so no leftover versions ever remain on disk"
      - "In the table heap as dead tuples; reclaimed by VACUUM (autovacuum)"
    answer: 3
    explanation: |
      PostgreSQL keeps old versions in the heap as dead tuples and relies on VACUUM /
      autovacuum to reclaim them, which is why table/index bloat and autovacuum tuning
      matter. InnoDB instead keeps old versions in the undo log.
    ref: "concepts.md#mvcc-versus-locking"

  - id: transactions-acid-isolation-levels-031
    difficulty: advanced
    tags: [mvcc, long-transaction, bloat]
    question: |
      Why is a long-running read transaction (or idle-in-transaction connection)
      dangerous in an MVCC database?
    options:
      - "It forces every other concurrent transaction to abort and retry until the long reader finally commits"
      - "It disables the write-ahead log for the duration, leaving recent commits unrecoverable after a crash"
      - "It pins old row versions, blocking VACUUM/purge and causing heap bloat or undo-log growth"
      - "It silently escalates every read in the whole database to SERIALIZABLE, adding predicate locks everywhere"
    answer: 2
    explanation: |
      MVCC must retain versions still visible to any open snapshot. A long/idle
      transaction holds back cleanup (PostgreSQL VACUUM, InnoDB purge), causing bloat
      and undo growth — so transaction age should be monitored and capped.
    ref: "concepts.md#mvcc-versus-locking"

  - id: transactions-acid-isolation-levels-032
    difficulty: intermediate
    tags: [snapshot-isolation]
    question: |
      In snapshot isolation, what does a transaction see when it reads?
    options:
      - "Whatever value is currently latest on disk, including writes from transactions that have not yet committed"
      - "Only the rows that this transaction has itself written, treating all other rows as if they do not exist"
      - "A random sample of committed rows chosen by the planner to keep the working set small during the read"
      - "A consistent snapshot: all data committed before its snapshot point and none committed after"
    answer: 3
    explanation: |
      Each SI transaction reads from a consistent snapshot fixed at its start, so it
      sees a stable, point-in-time view. Writes are validated at commit via first-
      committer-wins.
    ref: "concepts.md#snapshot-isolation-and-why-it-is-not-serializable"

  - id: transactions-acid-isolation-levels-033
    difficulty: advanced
    tags: [snapshot-isolation, first-committer-wins]
    question: |
      Under snapshot isolation, two concurrent transactions update the same row. What
      does "first-committer-wins" do?
    options:
      - "Both commits succeed and the later writer's value silently overwrites the earlier one with no error raised"
      - "The first transaction to commit is aborted so the newer, fresher write is the one that ends up winning"
      - "The second transaction to commit is aborted with a serialization error"
      - "Both transactions are merged automatically, combining their column changes into a single committed row"
    answer: 2
    explanation: |
      SI enforces first-committer-wins on write-write conflicts to the same item: the
      second committer aborts (e.g. PostgreSQL "could not serialize access" at
      REPEATABLE READ), which is how SI prevents same-row lost updates.
    ref: "concepts.md#snapshot-isolation-and-why-it-is-not-serializable"

  - id: transactions-acid-isolation-levels-034
    difficulty: advanced
    tags: [snapshot-isolation, serializable, write-skew]
    question: |
      Why is snapshot isolation NOT equivalent to serializable?
    options:
      - "It allows dirty reads, exposing the uncommitted row versions of other in-flight transactions to readers"
      - "It cannot prevent phantom reads at all, so range queries always see rows inserted by concurrent writers"
      - "It only detects write-write conflicts on the same item, so it permits write skew (a read-write conflict across different items)"
      - "It requires long-held read locks that block writers, so it behaves exactly like strict two-phase locking"
    answer: 2
    explanation: |
      SI's commit check only catches same-item write-write conflicts. Write skew is a
      read-write conflict across different rows with no common write item, so SI misses
      it. Hence SI is strictly weaker than SERIALIZABLE.
    ref: "concepts.md#snapshot-isolation-and-why-it-is-not-serializable"

  - id: transactions-acid-isolation-levels-035
    difficulty: advanced
    tags: [snapshot-isolation, oracle]
    question: |
      Oracle's isolation level named "SERIALIZABLE" is actually implemented as what,
      and what can it therefore still exhibit?
    options:
      - "True serializable snapshot isolation; it therefore exhibits none of the classic concurrency anomalies at all"
      - "Strict two-phase locking with predicate locks; it can therefore still exhibit dirty reads under contention"
      - "Plain READ COMMITTED under the hood; it can therefore still exhibit dirty reads on uncommitted row versions"
      - "Snapshot isolation; it can still exhibit write skew"
    answer: 3
    explanation: |
      Oracle's SERIALIZABLE is snapshot isolation, so it can still show write skew.
      Knowing that a vendor's level name may not match true serializability is a
      classic senior-level point.
    ref: "concepts.md#snapshot-isolation-and-why-it-is-not-serializable"

  - id: transactions-acid-isolation-levels-036
    difficulty: advanced
    tags: [ssi, postgresql]
    question: |
      How does PostgreSQL's SERIALIZABLE (SSI) make snapshot isolation truly
      serializable?
    options:
      - "It tracks rw-dependencies with non-blocking SIREAD predicate locks and aborts a transaction when a dangerous structure (potential cycle) is detected"
      - "It falls back to strict two-phase locking, taking blocking shared read locks on every row a transaction reads"
      - "It serializes all read-write transactions onto a single worker core so only one can ever execute at a time"
      - "It disables MVCC entirely and switches to shadow paging, atomically swapping in a new page tree at commit"
    answer: 0
    explanation: |
      SSI (Cahill/Röhm/Fekete, PostgreSQL 9.1+) runs on snapshots but records rw-
      dependencies via lightweight non-blocking SIREAD locks; when it sees the
      dangerous structure that can form a serialization cycle, it aborts one
      transaction.
    ref: "concepts.md#serializable-snapshot-isolation-ssi"

  - id: transactions-acid-isolation-levels-037
    difficulty: advanced
    tags: [ssi, retry, sqlstate]
    question: |
      What is the most important operational requirement when using PostgreSQL SSI /
      optimistic SERIALIZABLE?
    options:
      - "Disable autovacuum so old row versions are never reclaimed while long transactions run"
      - "Run every transaction as read-only so the SSI dependency checker has nothing left to validate"
      - "Set a very large lock-wait timeout so blocked transactions eventually acquire their locks and never abort"
      - "The application must retry transactions that fail with a serialization error (SQLSTATE 40001)"
    answer: 3
    explanation: |
      SSI trades blocking for occasional aborts, so transactions can fail with SQLSTATE
      40001 ("could not serialize access ..."). Without a retry loop those aborts
      surface as user-visible errors.
    ref: "concepts.md#serializable-snapshot-isolation-ssi"

  - id: transactions-acid-isolation-levels-038
    difficulty: advanced
    tags: [ssi, innodb, serializable]
    question: |
      How does InnoDB's SERIALIZABLE level differ from PostgreSQL's SSI?
    options:
      - "InnoDB uses the same non-blocking SIREAD predicate-lock algorithm and aborts a victim only when it detects a dangerous rw-dependency cycle"
      - "InnoDB SERIALIZABLE allows dirty reads, exposing other transactions' uncommitted row versions to gain extra concurrency"
      - "InnoDB promotes plain SELECTs to shared (LOCK IN SHARE MODE) locking reads — a 2PL-style approach with next-key locks — rather than SSI"
      - "InnoDB does not support SERIALIZABLE at all and silently downgrades any such request to REPEATABLE READ"
    answer: 2
    explanation: |
      InnoDB implements SERIALIZABLE by implicitly turning plain SELECT into a shared
      locking read (with next-key locks), i.e. a 2PL-flavored approach, not the
      optimistic rw-dependency tracking that PostgreSQL SSI uses.
    ref: "concepts.md#serializable-snapshot-isolation-ssi"

  - id: transactions-acid-isolation-levels-039
    difficulty: intermediate
    tags: [postgresql, mysql, read-committed]
    question: |
      A reporting query runs several SELECTs across a PostgreSQL transaction at the
      default level and sees different data between statements. Why, and what fixes it?
    options:
      - "PostgreSQL is broken; restart the server so its snapshot state is rebuilt and the reads become consistent again"
      - "The default is READ COMMITTED, giving each statement a fresh snapshot; use REPEATABLE READ for a stable cross-statement view"
      - "It is running at SERIALIZABLE, whose commit-time validation reshuffles reads; downgrade to READ COMMITTED to stabilize them"
      - "Add covering indexes on the queried columns so every statement is forced to read from one shared cached result set"
    answer: 1
    explanation: |
      At READ COMMITTED (PostgreSQL default) each statement takes a new snapshot, so
      concurrent commits are visible between statements. REPEATABLE READ fixes one
      snapshot for the whole transaction, giving a stable report.
    ref: "concepts.md#postgresql-versus-mysql-innodb-defaults"

  - id: transactions-acid-isolation-levels-040
    difficulty: advanced
    tags: [innodb, repeatable-read, locking-read]
    question: |
      In InnoDB REPEATABLE READ, why can an `UPDATE ... WHERE` affect rows that an
      earlier plain SELECT in the same transaction did not see?
    options:
      - "Plain (non-locking) SELECT reads the transaction snapshot, but locking reads/writes see the latest committed version, not the snapshot"
      - "InnoDB reloads and re-scans the whole table on every UPDATE, so it necessarily picks up rows committed after the earlier SELECT"
      - "REPEATABLE READ disables consistent snapshots entirely, so each statement in the transaction sees whatever is latest on disk"
      - "The UPDATE silently switches the transaction to READ UNCOMMITTED, letting it match rows from other in-flight transactions"
    answer: 0
    explanation: |
      In InnoDB RR, non-locking SELECTs use the consistent snapshot, but locking reads
      and writes (UPDATE, SELECT ... FOR UPDATE) operate on the latest committed data.
      This mismatch is a well-known InnoDB surprise; PostgreSQL is more uniform.
    ref: "concepts.md#postgresql-versus-mysql-innodb-defaults"

  - id: transactions-acid-isolation-levels-041
    difficulty: intermediate
    tags: [innodb, repeatable-read, phantom, gap-lock]
    question: |
      How does InnoDB prevent phantom reads at REPEATABLE READ?
    options:
      - "By taking a full-table exclusive lock for the whole transaction so no other session can insert or modify any row"
      - "By copying the matching rows into a private temporary snapshot file that is re-read on every statement"
      - "With gap / next-key locks that block inserts into the scanned range"
      - "It does not; phantoms are always possible in InnoDB regardless of the isolation level chosen"
    answer: 2
    explanation: |
      InnoDB uses gap and next-key locks on range scans (for locking reads) so other
      transactions cannot insert rows into the locked range, preventing phantoms at
      REPEATABLE READ.
    ref: "concepts.md#lock-types-shared-exclusive-gap-and-next-key"

  - id: transactions-acid-isolation-levels-042
    difficulty: advanced
    tags: [locking, gap-lock, next-key]
    question: |
      What is a next-key lock in InnoDB?
    options:
      - "A lock taken only on the primary key column, leaving all secondary indexes and gaps completely unlocked"
      - "A single lock that spans the entire index structure, blocking every reader and writer of that index at once"
      - "A special lock used only during DDL such as ALTER TABLE, never taken during ordinary DML statements"
      - "A record lock combined with a gap lock on the gap before that record"
    answer: 3
    explanation: |
      A next-key lock = record lock on an index record + gap lock on the gap preceding
      it. It is the default locking granularity for range scans at REPEATABLE READ and
      is what blocks phantom inserts.
    ref: "concepts.md#lock-types-shared-exclusive-gap-and-next-key"

  - id: transactions-acid-isolation-levels-043
    difficulty: intermediate
    tags: [locking, select-for-update]
    question: |
      What does `SELECT * FROM orders WHERE amount > 1000 FOR UPDATE` do under InnoDB
      REPEATABLE READ?
    options:
      - "Returns a read-only consistent snapshot and takes no locks at all, so concurrent inserts and updates proceed freely"
      - "Locks the whole database exclusively for the duration of the transaction, blocking every other session's reads and writes"
      - "Takes next-key (range) locks so concurrent inserts of matching rows block, preventing phantoms in that range"
      - "Silently downgrades the transaction to READ COMMITTED, so each statement re-reads the newest committed rows"
    answer: 2
    explanation: |
      `FOR UPDATE` is a locking read; on a range predicate InnoDB takes next-key locks
      over the scanned range, so a concurrent INSERT of a matching row blocks — no
      phantom.
    ref: "concepts.md#lock-types-shared-exclusive-gap-and-next-key"

  - id: transactions-acid-isolation-levels-044
    difficulty: advanced
    tags: [locking, gap-lock, read-committed, tuning]
    question: |
      A team sees frequent deadlocks caused by InnoDB gap locks at REPEATABLE READ.
      Which change reduces gap locking (accepting that phantoms become possible)?
    options:
      - "Switch that transaction to READ COMMITTED, which disables most gap locking (only record locks remain)"
      - "Switch to SERIALIZABLE for stronger locking, which folds gap locks into record locks and thereby avoids the cycles"
      - "Drop all indexes on the table so range scans stop acquiring the gap locks that sit on index records"
      - "Increase innodb_flush_log_at_trx_commit to 2 so commits fsync less often and release their gap locks sooner"
    answer: 0
    explanation: |
      Under READ COMMITTED, InnoDB largely disables gap locking (retaining record
      locks), which reduces gap-lock deadlocks — at the cost of allowing phantoms. It
      is a real tuning lever.
    ref: "concepts.md#lock-types-shared-exclusive-gap-and-next-key"

  - id: transactions-acid-isolation-levels-045
    difficulty: intermediate
    tags: [concurrency, optimistic, pessimistic]
    question: |
      When is optimistic concurrency control generally preferable to pessimistic?
    options:
      - "When contention is high and writes frequently collide, so most transactions hit a conflict and must retry anyway"
      - "Only for DDL statements such as ALTER TABLE, since schema changes cannot be protected by row-level locks"
      - "When durability is not required, because optimistic checks replace the need to fsync the commit record"
      - "When contention is low / read-heavy, so the lock-free happy path wins and conflicts are rare"
    answer: 3
    explanation: |
      Optimistic control avoids lock overhead and shines under low contention; it
      validates at commit and retries on conflict. Under high contention it degrades
      into retry storms, where pessimistic locking or serialized writes are better.
    ref: "concepts.md#optimistic-versus-pessimistic-concurrency-control"

  - id: transactions-acid-isolation-levels-046
    difficulty: intermediate
    tags: [concurrency, pessimistic]
    question: |
      Which is a defining characteristic of pessimistic concurrency control?
    options:
      - "It never uses locks and validates conflicts only at commit time, retrying any transaction that lost the race"
      - "It requires a dedicated integer version column on every table so writes can compare-and-set before committing"
      - "It assumes conflicts are likely and takes locks up front so conflicting work blocks"
      - "It is only available at the READ UNCOMMITTED isolation level, where locks are otherwise unavailable to readers"
    answer: 2
    explanation: |
      Pessimistic control (e.g. SELECT ... FOR UPDATE, 2PL) locks up front, blocking
      conflicting transactions. It suits high-contention workloads where wasted retry
      work would otherwise dominate.
    ref: "concepts.md#optimistic-versus-pessimistic-concurrency-control"

  - id: transactions-acid-isolation-levels-047
    difficulty: intermediate
    tags: [deadlock, detection]
    question: |
      How do PostgreSQL and InnoDB typically resolve a true deadlock?
    options:
      - "They wait indefinitely until one of the deadlocked transactions voluntarily releases its lock or the client disconnects"
      - "They restart the entire database process to clear all held locks and let the transactions re-run from scratch"
      - "A wait-for-graph cycle detector aborts a victim transaction so the others proceed"
      - "They escalate both deadlocked transactions to SERIALIZABLE, whose stricter locking resolves the cycle automatically"
    answer: 2
    explanation: |
      Both engines detect deadlocks via a wait-for graph and abort a victim (often the
      one with the least work done). The victim gets an error and the application
      should retry.
    ref: "concepts.md#deadlocks-detection-and-prevention"

  - id: transactions-acid-isolation-levels-048
    difficulty: intermediate
    tags: [deadlock, prevention, lock-ordering]
    question: |
      What is the single most effective practical technique to prevent deadlocks
      between transactions that update multiple rows?
    options:
      - "Acquire rows/tables in a consistent order (e.g. ascending primary key) across all transactions"
      - "Increase the connection pool size so more transactions run at once and each waits a shorter time for its locks"
      - "Disable the write-ahead log during writes so transactions commit faster and release their row locks sooner"
      - "Always run the transactions at READ UNCOMMITTED so reads skip locking and can never join a wait-for cycle"
    answer: 0
    explanation: |
      Consistent lock ordering makes wait-for cycles impossible, so it is the top
      practical deadlock-prevention technique. Keeping transactions short and touching
      fewer rows also helps.
    ref: "concepts.md#deadlocks-detection-and-prevention"

  - id: transactions-acid-isolation-levels-049
    difficulty: advanced
    tags: [deadlock, timeout, innodb]
    question: |
      How does InnoDB's `innodb_lock_wait_timeout` differ from deadlock detection?
    options:
      - "Deadlock detection resolves true lock cycles quickly; the lock-wait timeout is a blunt fallback that rolls back a transaction waiting too long, even without a cycle"
      - "They are the same mechanism under two different names, kept only for backward compatibility with older releases"
      - "The lock-wait timeout only applies to plain SELECT statements and never affects UPDATE, DELETE, or INSERT waits"
      - "Deadlock detection only runs after the lock-wait timeout expires, so shortening the timeout speeds up cycle detection"
    answer: 0
    explanation: |
      Deadlock detection finds and breaks actual wait-for cycles; the lock-wait timeout
      (default 50s) simply rolls back a transaction that has waited too long, which may
      or may not be a real deadlock. Tuning the timeout does not fix true deadlocks —
      fix lock ordering.
    ref: "concepts.md#deadlocks-detection-and-prevention"

  - id: transactions-acid-isolation-levels-050
    difficulty: intermediate
    tags: [deadlock, retry, sqlstate]
    question: |
      Your service occasionally fails writes with a deadlock error (SQLSTATE 40001
      family). What is the correct handling?
    options:
      - "Treat every occurrence as a fatal bug and page the on-call engineer, since deadlock aborts always signal data corruption"
      - "Permanently switch the whole service to READ UNCOMMITTED so no transaction ever waits on a lock and cycles cannot form"
      - "Disable deadlock detection entirely and rely on the lock-wait timeout to eventually clear every blocked transaction"
      - "Wrap the write in a bounded retry with backoff, keeping the transaction idempotent and short"
    answer: 3
    explanation: |
      Deadlock (and serialization) aborts are normal under concurrency. The correct
      response is a bounded retry with backoff on idempotent, short transactions, plus
      consistent lock ordering to reduce their frequency.
    ref: "concepts.md#deadlocks-detection-and-prevention"
