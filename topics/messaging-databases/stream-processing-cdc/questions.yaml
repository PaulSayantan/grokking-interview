topic: "Stream Processing and Change Data Capture"
domain: messaging-databases
topic_slug: stream-processing-cdc
version: 1
questions:
  - id: stream-processing-cdc-001
    difficulty: beginner
    tags: [stream-vs-batch, fundamentals]
    question: |
      What most fundamentally distinguishes stream processing from batch processing?
    options:
      - "Stream processing operates on an unbounded, never-ending input while batch operates on a bounded, finite dataset"
      - "Stream processing always uses less memory than batch processing"
      - "Batch processing runs on a single machine while streaming requires a cluster"
      - "Stream processing cannot compute aggregations"
    answer: 0
    explanation: |
      The core distinction is boundedness: batch reads a finite input and finishes;
      streaming processes an unbounded sequence of events continuously. The DDIA/Dataflow
      insight is that batch is a special case of streaming over a bounded stream.
    ref: "concepts.md#stream-vs-batch-processing"

  - id: stream-processing-cdc-002
    difficulty: intermediate
    tags: [stream-vs-batch, kappa, lambda]
    question: |
      A team runs a slow, accurate batch layer plus a fast, approximate speed layer and
      merges the results. They want to simplify to a single pipeline that can reprocess
      history by replaying the log from the beginning. Which architecture are they moving to?
    options:
      - "Lambda architecture"
      - "Kappa architecture"
      - "Star schema"
      - "Two-phase commit"
    answer: 1
    explanation: |
      Lambda maintains duplicated batch + speed layers. Kappa uses a single streaming
      pipeline and reprocesses history by replaying the log, eliminating the duplicated logic.
    ref: "concepts.md#stream-vs-batch-processing"

  - id: stream-processing-cdc-003
    difficulty: beginner
    tags: [event-time, processing-time]
    question: |
      In stream processing, what is "event time"?
    options:
      - "The wall-clock time when the engine observes the record"
      - "The time the record entered the messaging system"
      - "The time the event actually happened at the source, embedded in the record"
      - "The time a window fires and emits its result"
    answer: 2
    explanation: |
      Event time is when the event actually occurred at the source (embedded in the
      record). Processing time is when the engine observes it; ingestion time is when it
      entered the messaging system.
    ref: "concepts.md#event-time-vs-processing-time"

  - id: stream-processing-cdc-004
    difficulty: intermediate
    tags: [event-time, processing-time, correctness]
    question: |
      Why do practitioners prefer windowing by event time rather than processing time for
      correctness?
    options:
      - "Event time avoids the need to store any state"
      - "Processing time cannot represent timestamps before 1970"
      - "Processing time is always unavailable in streaming engines"
      - "Event-time results are deterministic and reproducible regardless of cluster speed or arrival delays"
    answer: 3
    explanation: |
      With event time, replaying the same data yields the same result independent of how
      busy the cluster is. Processing-time windows depend on machine speed and arrival
      timing, so results are non-reproducible.
    ref: "concepts.md#event-time-vs-processing-time"

  - id: stream-processing-cdc-005
    difficulty: beginner
    tags: [windowing, tumbling]
    question: |
      Which statement correctly describes a tumbling window?
    options:
      - "Fixed-size, non-overlapping windows where each event belongs to exactly one window"
      - "Variable-size windows that close after a gap of inactivity"
      - "A window that never closes"
      - "Windows overlap and each event may fall into several windows"
    answer: 0
    explanation: |
      Tumbling windows are fixed-size and contiguous with no overlap, so each event lands
      in exactly one bucket (e.g. orders per minute).
    ref: "concepts.md#windowing-tumbling-sliding-session"

  - id: stream-processing-cdc-006
    difficulty: intermediate
    tags: [windowing, sliding]
    question: |
      A dashboard shows "orders in the last 10 minutes, refreshed every 1 minute." Which
      window type is this, and what is a consequence?
    options:
      - "Tumbling window; each event lands in exactly one window"
      - "Sliding (hopping) window; windows overlap so each event lands in multiple windows, increasing state"
      - "Global window; no state is retained"
      - "Session window; boundaries are data-driven"
    answer: 1
    explanation: |
      Size 10 min with a 1-min slide is a sliding/hopping window. Overlap means each event
      is counted in multiple windows, so there are more concurrent windows and more state.
    ref: "concepts.md#windowing-tumbling-sliding-session"

  - id: stream-processing-cdc-007
    difficulty: intermediate
    tags: [windowing, session]
    question: |
      You want to group a user's activity into "sessions" that end whenever the user is
      inactive for 30 minutes. Which window type fits?
    options:
      - "Tumbling window of 30 minutes"
      - "Sliding window with 30-minute slide"
      - "Session window with a 30-minute inactivity gap"
      - "Fixed hourly window"
    answer: 2
    explanation: |
      Session windows are variable-length and defined by a gap of inactivity: events keep
      extending the session until no event arrives for the gap timeout.
    ref: "concepts.md#windowing-tumbling-sliding-session"

  - id: stream-processing-cdc-008
    difficulty: advanced
    tags: [windowing, tumbling, sliding]
    question: |
      Which statement about the relationship between window types is correct?
    options:
      - "A session window is a tumbling window with fixed boundaries"
      - "A sliding window can never overlap"
      - "A tumbling window always overlaps its neighbors"
      - "A tumbling window is a sliding window whose slide equals its size"
    answer: 3
    explanation: |
      When a sliding window's slide equals its size, consecutive windows neither overlap
      nor leave gaps — that is exactly a tumbling window.
    ref: "concepts.md#windowing-tumbling-sliding-session"

  - id: stream-processing-cdc-009
    difficulty: beginner
    tags: [watermarks, late-data]
    question: |
      What does a watermark represent in a stream processing engine?
    options:
      - "The engine's assertion that it believes it has seen all events with event-time up to time T"
      - "The maximum number of events a window may hold"
      - "The offset of the last committed record"
      - "A cryptographic signature proving an event is authentic"
    answer: 0
    explanation: |
      A watermark is a moving low-watermark on event time: "I believe I have seen all
      events with event-time ≤ T." It lets the engine decide when a window is complete.
    ref: "concepts.md#watermarks-and-late-data"

  - id: stream-processing-cdc-010
    difficulty: intermediate
    tags: [watermarks, late-data, trade-offs]
    question: |
      Increasing the allowed out-of-orderness (making watermarks lag further behind the
      max observed event time) has what primary effect?
    options:
      - "Results emit sooner but more events are dropped as late"
      - "Higher completeness (fewer late-drops) but higher latency before windows fire"
      - "It eliminates the need for state entirely"
      - "It makes processing time and event time identical"
    answer: 1
    explanation: |
      A larger lag gives stragglers more time to arrive (higher completeness) but delays
      when the engine is confident a window is complete, raising latency. This is the
      fundamental latency-vs-completeness trade-off.
    ref: "concepts.md#watermarks-and-late-data"

  - id: stream-processing-cdc-011
    difficulty: intermediate
    tags: [watermarks, late-data]
    question: |
      An event arrives whose event-time is behind the current watermark. What is this
      called, and what is a common way to still account for it?
    options:
      - "A barrier; align it across input channels"
      - "An early event; buffer it until the watermark catches up"
      - "A late event; use allowed lateness to keep window state and update the result, or route it to a side output"
      - "A duplicate; discard via idempotence"
    answer: 2
    explanation: |
      An event behind the watermark is late data. Options include dropping it, keeping
      window state for a grace period (allowed lateness) to update the result, or emitting
      it to a side output/dead-letter for reconciliation.
    ref: "concepts.md#watermarks-and-late-data"

  - id: stream-processing-cdc-012
    difficulty: advanced
    tags: [watermarks, gotcha]
    question: |
      Which statement about watermarks is most accurate?
    options:
      - "Watermarks are only used in batch processing"
      - "Watermarks replace the need for checkpoints"
      - "A watermark is a hard guarantee that no later event can ever arrive"
      - "A watermark is a heuristic; too tight drops genuinely late events, too loose delays all results"
    answer: 3
    explanation: |
      Watermarks are heuristics encoding your tolerance for lateness. There is no
      objectively correct watermark: too tight causes late-drops, too loose delays output.
    ref: "concepts.md#watermarks-and-late-data"

  - id: stream-processing-cdc-013
    difficulty: beginner
    tags: [stateful, state]
    question: |
      Which of these is a STATELESS stream operation?
    options:
      - "A filter that drops records failing a predicate"
      - "A stream-stream join"
      - "A running count per key"
      - "A windowed aggregation"
    answer: 0
    explanation: |
      A filter needs no memory of past events — it decides per record. Running counts,
      windows, and joins all maintain state across events.
    ref: "concepts.md#stateful-stream-processing"

  - id: stream-processing-cdc-014
    difficulty: intermediate
    tags: [stateful, kafka-streams, state-backend]
    question: |
      How does Kafka Streams make local state durable so a restarted task can recover it?
    options:
      - "It writes state to a shared NFS mount"
      - "It keeps state in RocksDB locally and backs it with a compacted changelog topic in Kafka"
      - "It relies solely on the OS page cache"
      - "It recomputes all state from the beginning of every topic on each restart"
    answer: 1
    explanation: |
      Kafka Streams keeps local state in RocksDB and mirrors updates to a compacted
      changelog topic. On restart the task rebuilds state by replaying that changelog.
    ref: "concepts.md#stateful-stream-processing"

  - id: stream-processing-cdc-015
    difficulty: advanced
    tags: [stateful, state-growth, ttl]
    question: |
      A production Flink job's keyed state has grown to several terabytes and keeps
      growing. Which is the most likely root cause and fix?
    options:
      - "Event time should be replaced with processing time"
      - "Watermarks are too tight; loosen them"
      - "Long-lived keyed state has no TTL/cleanup, so entries for old keys leak forever — add state TTL or explicit cleanup"
      - "The checkpoint interval is too short; lengthen it"
    answer: 2
    explanation: |
      Window state is freed once the watermark passes, but long-lived keyed state grows
      unbounded unless you set TTL or clean it up. Unbounded keyed state is a classic cause
      of runaway state size.
    ref: "concepts.md#stateful-stream-processing"

  - id: stream-processing-cdc-016
    difficulty: intermediate
    tags: [stateful, keyed-state]
    question: |
      Why is streaming state described as "keyed"?
    options:
      - "Only primary-key columns can be stored in state"
      - "Keys are required to compress the state backend"
      - "State is encrypted with a per-record key"
      - "State is partitioned by the record key so each key's state is owned by exactly one parallel task"
    answer: 3
    explanation: |
      State is partitioned by key so a single parallel task owns each key's state,
      analogous to a Kafka partition owning its offsets. This enables scalable, consistent
      per-key updates.
    ref: "concepts.md#stateful-stream-processing"

  - id: stream-processing-cdc-017
    difficulty: intermediate
    tags: [exactly-once, checkpointing, barriers]
    question: |
      In Flink's checkpointing, what is a "barrier"?
    options:
      - "A numbered marker injected into the data stream that triggers each operator to snapshot its state as it flows through"
      - "A firewall rule isolating the job manager"
      - "The maximum event-time lag allowed before dropping data"
      - "A lock that stops all producers during a snapshot"
    answer: 0
    explanation: |
      A checkpoint barrier is a numbered marker interleaved with the data. As it flows
      downstream, each operator snapshots its state, producing a consistent global snapshot
      (Chandy-Lamport asynchronous barrier snapshotting).
    ref: "concepts.md#exactly-once-with-checkpointing-and-barriers"

  - id: stream-processing-cdc-018
    difficulty: advanced
    tags: [exactly-once, barriers, alignment]
    question: |
      When a Flink operator has multiple input channels, why does it "align" barriers before
      snapshotting?
    options:
      - "To compress the state before writing it"
      - "To wait for the same barrier number on every input channel so the snapshot is a consistent cut across the dataflow"
      - "To drop late events that arrived after the barrier"
      - "To guarantee the fastest input is processed first"
    answer: 1
    explanation: |
      Alignment makes the operator wait for the same barrier on all inputs (buffering the
      faster ones) so the resulting snapshot reflects a consistent point across every input
      stream.
    ref: "concepts.md#exactly-once-with-checkpointing-and-barriers"

  - id: stream-processing-cdc-019
    difficulty: intermediate
    tags: [exactly-once, semantics]
    question: |
      What does "exactly-once" typically mean in a streaming pipeline?
    options:
      - "Duplicates are impossible at the source"
      - "Each event physically traverses the network exactly one time"
      - "Effectively-once: the observable state and output are as if each event were processed exactly once, even across failures"
      - "The pipeline never retries any record"
    answer: 2
    explanation: |
      Exactly-once almost always means effectively-once: the observable output/state is as
      if each event were processed once, achieved via replay from checkpoints plus
      idempotent or transactional sinks. Physical once-only delivery is not what is meant.
    ref: "concepts.md#exactly-once-with-checkpointing-and-barriers"

  - id: stream-processing-cdc-020
    difficulty: advanced
    tags: [exactly-once, sinks, two-phase-commit]
    question: |
      A Flink job with exactly-once checkpointing writes results to an external system via a
      plain, non-idempotent, non-transactional REST call. On failure and replay, what
      guarantee does the sink actually provide?
    options:
      - "At-most-once, because records are dropped on failure"
      - "Exactly-once, because REST is idempotent by definition"
      - "Exactly-once, because the engine checkpoints"
      - "At-least-once, because replayed records after the last checkpoint are re-emitted and the sink cannot dedupe or roll back"
    answer: 3
    explanation: |
      Exactly-once is a whole-pipeline property. Engine checkpointing only gives replay
      (at-least-once) unless the sink is idempotent or transactional. A plain REST call is
      neither, so duplicates occur on replay.
    ref: "concepts.md#exactly-once-with-checkpointing-and-barriers"

  - id: stream-processing-cdc-021
    difficulty: intermediate
    tags: [kafka, idempotent-producer, eos]
    question: |
      What problem does Kafka's idempotent producer (enable.idempotence=true) solve?
    options:
      - "It dedupes producer retries so a network retry does not create a duplicate record on a partition"
      - "It encrypts records in transit"
      - "It commits consumer offsets automatically"
      - "It guarantees global ordering across all partitions"
    answer: 0
    explanation: |
      The idempotent producer tags batches with a producer ID and per-partition sequence
      numbers; the broker rejects duplicate sequence numbers, so retries do not create
      duplicates. It addresses retry duplicates, not reprocessing.
    ref: "concepts.md#kafka-transactions-and-exactly-once-semantics"

  - id: stream-processing-cdc-022
    difficulty: advanced
    tags: [kafka, transactions, offsets]
    question: |
      In Kafka's consume-transform-produce EOS pattern, why does the producer call
      sendOffsetsToTransaction?
    options:
      - "To encrypt the offsets before storage"
      - "So the consumed input offsets commit atomically in the same transaction as the produced output records"
      - "To reset the consumer to the earliest offset"
      - "To disable idempotence for that transaction"
    answer: 1
    explanation: |
      Writing the consumer offsets into the transaction makes "I consumed these offsets AND
      produced these outputs" atomic — either both commit or neither does, which is what
      makes the loop exactly-once.
    ref: "concepts.md#kafka-transactions-and-exactly-once-semantics"

  - id: stream-processing-cdc-023
    difficulty: intermediate
    tags: [kafka, read-committed, isolation]
    question: |
      To ensure a downstream Kafka consumer never reads records from aborted transactions,
      what must you set?
    options:
      - "acks=all"
      - "auto.offset.reset=earliest"
      - "isolation.level=read_committed"
      - "enable.auto.commit=false"
    answer: 2
    explanation: |
      With isolation.level=read_committed the consumer skips aborted-transaction records
      and won't read past the Last Stable Offset (an open transaction), so it sees only
      committed output. read_uncommitted (default) would see aborted records.
    ref: "concepts.md#kafka-transactions-and-exactly-once-semantics"

  - id: stream-processing-cdc-024
    difficulty: advanced
    tags: [kafka, eos, boundaries]
    question: |
      Which statement about Kafka's exactly-once semantics is correct?
    options:
      - "EOS makes transactions free of any performance cost"
      - "EOS requires disabling the idempotent producer"
      - "EOS automatically extends to any external database sink"
      - "EOS covers Kafka-to-Kafka processing and adds commit latency/coordinator overhead; external sinks need their own idempotence or transaction participation"
    answer: 3
    explanation: |
      Kafka EOS (and Kafka Streams exactly_once_v2) guarantees Kafka-to-Kafka. It does not
      cover external DB sinks unless they participate transactionally or are idempotent, and
      transactions add real latency and coordinator overhead.
    ref: "concepts.md#kafka-transactions-and-exactly-once-semantics"

  - id: stream-processing-cdc-025
    difficulty: beginner
    tags: [engines, kafka-streams]
    question: |
      What is a defining characteristic of Kafka Streams compared to Flink and Spark?
    options:
      - "It is a client library embedded in your JVM application, needing no separate processing cluster"
      - "It only supports batch processing"
      - "It cannot maintain any state"
      - "It requires its own dedicated processing cluster"
    answer: 0
    explanation: |
      Kafka Streams is a library you embed in your application (both source and sink are
      Kafka). There is no separate cluster to run, unlike Flink or Spark.
    ref: "concepts.md#kafka-streams-vs-flink-vs-spark-structured-streaming"

  - id: stream-processing-cdc-026
    difficulty: intermediate
    tags: [engines, spark, latency]
    question: |
      Why does Spark Structured Streaming typically have higher latency than Flink?
    options:
      - "Spark cannot use event time"
      - "Spark's default execution is micro-batch, so latency is bounded below by the batch/trigger interval, whereas Flink processes each record as it arrives"
      - "Spark writes every record to disk synchronously"
      - "Flink does not support windowing"
    answer: 1
    explanation: |
      Structured Streaming groups records into small micro-batches and runs a mini job per
      trigger, so latency is bounded by the batch interval. Flink is true per-record
      streaming, reaching millisecond latency.
    ref: "concepts.md#kafka-streams-vs-flink-vs-spark-structured-streaming"

  - id: stream-processing-cdc-027
    difficulty: intermediate
    tags: [engines, selection, flink]
    question: |
      For a demanding pipeline needing the lowest latency, rich event-time/watermark
      semantics, very large managed state, and complex-event-processing (CEP), which engine
      is the strongest fit?
    options:
      - "A single-threaded Python script"
      - "Query-based CDC polling"
      - "Apache Flink"
      - "A nightly cron job"
    answer: 2
    explanation: |
      Flink is the most capable true-streaming engine: rich event-time/watermark handling,
      huge managed state (RocksDB + incremental checkpoints), CEP, and lowest latency.
    ref: "concepts.md#kafka-streams-vs-flink-vs-spark-structured-streaming"

  - id: stream-processing-cdc-028
    difficulty: intermediate
    tags: [engines, selection, spark]
    question: |
      A team already operates a Spark/lakehouse platform with many batch jobs and wants to
      add streaming while reusing one engine and API. Second-based latency is acceptable.
      Which engine fits best?
    options:
      - "A bare Kafka consumer with no framework"
      - "Trigger-based CDC"
      - "Kafka Streams"
      - "Spark Structured Streaming"
    answer: 3
    explanation: |
      Spark Structured Streaming reuses the Spark engine and unifies batch + streaming under
      one API. Its micro-batch latency (100s ms to seconds) is fine when second-level
      freshness is acceptable and the team already runs Spark.
    ref: "concepts.md#kafka-streams-vs-flink-vs-spark-structured-streaming"

  - id: stream-processing-cdc-029
    difficulty: beginner
    tags: [stream-table-duality]
    question: |
      According to stream-table duality, a table can be viewed as what?
    options:
      - "The current state per key produced by replaying (folding) a stream of change events"
      - "An unrelated concept with no connection to streams"
      - "A compressed archive of a stream"
      - "A random sample of a stream"
    answer: 0
    explanation: |
      A stream is an append-only log of change events; a table is the current
      latest-value-per-key you get by folding/replaying that stream. Conversely a table's
      changelog is a stream — that is the duality.
    ref: "concepts.md#stream-table-duality-and-materialized-views"

  - id: stream-processing-cdc-030
    difficulty: intermediate
    tags: [stream-table-duality, log-compaction]
    question: |
      How does Kafka log compaction support the "table" view of a topic?
    options:
      - "It deletes the entire topic after a time limit"
      - "It retains at least the latest value per key and garbage-collects older values, so the topic is a replayable snapshot of current state per key"
      - "It compresses records with gzip only"
      - "It reorders records by timestamp"
    answer: 1
    explanation: |
      Log compaction keeps at least the most recent value for each key and removes older
      values, so a compacted topic durably represents current state per key and can rebuild
      a KTable or cache.
    ref: "concepts.md#stream-table-duality-and-materialized-views"

  - id: stream-processing-cdc-031
    difficulty: intermediate
    tags: [materialized-view, streaming]
    question: |
      What is a materialized view in the streaming context?
    options:
      - "A read-only replica of the entire database"
      - "A view recomputed from scratch on every query"
      - "A precomputed, continuously and incrementally updated query result stored for fast reads"
      - "A temporary in-memory buffer discarded after each batch"
    answer: 2
    explanation: |
      A streaming materialized view is precomputed and maintained incrementally: each event
      updates the stored result rather than triggering a full recomputation, enabling fast
      reads of an always-current aggregate.
    ref: "concepts.md#stream-table-duality-and-materialized-views"

  - id: stream-processing-cdc-032
    difficulty: beginner
    tags: [cdc, fundamentals]
    question: |
      What does Change Data Capture (CDC) do?
    options:
      - "Compresses tables to save disk space"
      - "Rewrites SQL queries for better performance"
      - "Encrypts data at rest in a database"
      - "Captures row-level changes (INSERT/UPDATE/DELETE) and delivers them as an ordered stream of change events"
    answer: 3
    explanation: |
      CDC captures every row-level change and emits an ordered stream describing what
      changed, in what order, and (often) the before/after values — used to keep derived
      systems in sync.
    ref: "concepts.md#change-data-capture-fundamentals"

  - id: stream-processing-cdc-033
    difficulty: intermediate
    tags: [cdc, event-contents]
    question: |
      A typical log-based CDC change event (e.g. from Debezium) usually contains which of
      the following?
    options:
      - "The operation type, before and after row images, table/schema info, and the source log position (LSN/binlog offset) with a timestamp"
      - "Just a boolean indicating that something changed"
      - "The full database backup at the time of the change"
      - "Only the primary key of the changed row"
    answer: 0
    explanation: |
      CDC events carry the op (create/update/delete/snapshot-read), before/after images,
      table and schema metadata, and the source log position and timestamp — enough to
      reconstruct and order the change downstream.
    ref: "concepts.md#change-data-capture-fundamentals"

  - id: stream-processing-cdc-034
    difficulty: beginner
    tags: [cdc, postgres, wal]
    question: |
      Which PostgreSQL mechanism does log-based CDC read to capture changes?
    options:
      - "The query planner statistics"
      - "The Write-Ahead Log (WAL) via logical decoding over a replication slot"
      - "The shared buffer pool directly"
      - "The pg_stat_activity view"
    answer: 1
    explanation: |
      Postgres log-based CDC reads the WAL through logical decoding (an output plugin like
      pgoutput) over a logical replication slot, which requires wal_level=logical and tracks
      the last consumed LSN.
    ref: "concepts.md#log-based-cdc-with-wal-and-binlog"

  - id: stream-processing-cdc-035
    difficulty: intermediate
    tags: [cdc, mysql, binlog]
    question: |
      For MySQL log-based CDC to capture full before/after row images, which binlog setting
      is required?
    options:
      - "sql_log_bin=OFF"
      - "binlog_format=STATEMENT"
      - "binlog_format=ROW"
      - "binlog_format=MIXED with triggers disabled"
    answer: 2
    explanation: |
      ROW-format binlog records the actual before/after row images, which CDC needs.
      STATEMENT format logs the SQL text, not row images, so it can't reliably reconstruct
      per-row changes.
    ref: "concepts.md#log-based-cdc-with-wal-and-binlog"

  - id: stream-processing-cdc-036
    difficulty: intermediate
    tags: [cdc, debezium, snapshot]
    question: |
      When a Debezium connector starts against an existing table with historical data, what
      does it do before streaming ongoing changes?
    options:
      - "It ignores all pre-existing rows permanently"
      - "It runs a nightly full-table SELECT forever"
      - "It deletes and recreates the table"
      - "It performs an initial consistent snapshot of the existing rows, then streams subsequent changes from the log"
    answer: 3
    explanation: |
      Debezium first takes a consistent snapshot of current rows (op = read), then switches
      to streaming changes from the WAL/binlog, so consumers get both existing state and all
      future changes.
    ref: "concepts.md#log-based-cdc-with-wal-and-binlog"

  - id: stream-processing-cdc-037
    difficulty: advanced
    tags: [cdc, postgres, replication-slot, operations]
    question: |
      A Debezium/Postgres CDC consumer crashes and stops advancing its replication slot for
      hours. What is the dangerous consequence?
    options:
      - "Postgres cannot recycle WAL segments the slot still needs, so WAL accumulates and can fill the disk, taking the primary down"
      - "The primary switches to STATEMENT-based logging"
      - "All queries speed up because the slot is idle"
      - "Postgres automatically drops the slot and loses no data"
    answer: 0
    explanation: |
      An un-advancing slot pins WAL: Postgres retains WAL from the slot's restart_lsn
      onward, so WAL grows and can exhaust disk, crashing the primary. Monitoring slot lag /
      restart_lsn is essential.
    ref: "concepts.md#log-based-cdc-with-wal-and-binlog"

  - id: stream-processing-cdc-038
    difficulty: advanced
    tags: [cdc, log-based, advantages]
    question: |
      Why is log-based CDC generally preferred over query-based and trigger-based
      approaches?
    options:
      - "It requires no database privileges at all"
      - "It captures every change including DELETEs in commit order, adds minimal write-path overhead, and streams with low latency by reusing a log the DB already maintains"
      - "It works without the database keeping any log"
      - "It is the only method that can compute aggregations"
    answer: 1
    explanation: |
      Log-based CDC reads the transaction log the DB already writes, so it captures all
      changes (including deletes) in exact commit order with low overhead and low latency —
      polling misses transient/deleted rows and adds query load; triggers add per-write cost.
    ref: "concepts.md#log-based-cdc-with-wal-and-binlog"

  - id: stream-processing-cdc-039
    difficulty: intermediate
    tags: [cdc, query-based, gotcha]
    question: |
      A team syncs data by running "SELECT * FROM orders WHERE updated_at > :last_poll"
      every few minutes. Which limitation is inherent to this query-based approach?
    options:
      - "It captures full before-images automatically"
      - "It cannot connect to the database"
      - "It misses DELETEs (the row is gone, so nothing is selected) and misses intermediate states between polls"
      - "It requires binlog_format=ROW"
    answer: 2
    explanation: |
      Query-based CDC can't see deletes (the row no longer exists to select) and misses any
      changes that happened and were overwritten between polls. It also relies on a
      correctly maintained updated_at column and trades latency for poll frequency.
    ref: "concepts.md#query-based-and-trigger-based-cdc"

  - id: stream-processing-cdc-040
    difficulty: intermediate
    tags: [cdc, trigger-based, trade-offs]
    question: |
      What is the main drawback of trigger-based CDC?
    options:
      - "It never captures before/after values"
      - "It only works on in-memory databases"
      - "It cannot capture DELETE operations"
      - "Every write does extra work inside the transaction (write amplification, higher latency, more contention), and triggers are DB-specific and hard to maintain"
    answer: 3
    explanation: |
      Trigger-based CDC captures deletes and before/after values transactionally, but each
      write now fires a trigger that writes an audit row, adding overhead and contention;
      triggers are also DB-specific and hard to maintain.
    ref: "concepts.md#query-based-and-trigger-based-cdc"

  - id: stream-processing-cdc-041
    difficulty: beginner
    tags: [cdc, use-cases, search]
    question: |
      Which is a classic use case for CDC?
    options:
      - "Keeping a search index (e.g. Elasticsearch) in sync with a source database in near real time"
      - "Rendering HTML templates"
      - "Managing OS process scheduling"
      - "Compiling application source code"
    answer: 0
    explanation: |
      Streaming row changes into a search index keeps search current without nightly
      reindexing. Other classic uses: cache invalidation, warehouse replication, and the
      outbox pattern.
    ref: "concepts.md#cdc-use-cases"

  - id: stream-processing-cdc-042
    difficulty: intermediate
    tags: [cdc, cache-invalidation]
    question: |
      How does CDC help solve cache-consistency problems that dual writes cause?
    options:
      - "It makes the cache the system of record"
      - "Change events derived from the committed DB log drive cache eviction/refresh, so you avoid brittle app-side dual writes to both DB and cache"
      - "It disables caching entirely"
      - "It replicates the cache into the WAL"
    answer: 1
    explanation: |
      Instead of the app writing to both DB and cache (which can diverge on failure), CDC
      derives change events from the committed DB log and uses them to invalidate/refresh
      cache keys, keeping the cache consistent with the source of truth.
    ref: "concepts.md#cdc-use-cases"

  - id: stream-processing-cdc-043
    difficulty: advanced
    tags: [cdc, outbox, dual-write]
    question: |
      A service must update its database AND publish an event, but a crash between the two
      writes leaves them inconsistent. Which pattern, combined with CDC, solves this without
      distributed transactions?
    options:
      - "Caching the event in memory until the broker is available"
      - "Two-phase commit across DB and broker"
      - "The Transactional Outbox pattern: write the business row and an outbox row in one local transaction, and let CDC tail the outbox to publish events"
      - "Retrying the broker publish in a tight loop"
    answer: 2
    explanation: |
      The outbox pattern writes the business change and an outbox row atomically in one
      local transaction; CDC then publishes the committed outbox rows. The event fires iff
      the transaction committed — no XA/distributed transaction needed.
    ref: "concepts.md#cdc-use-cases"

  - id: stream-processing-cdc-044
    difficulty: intermediate
    tags: [cdc, dual-write, problem]
    question: |
      What is the "dual-write problem"?
    options:
      - "Two replicas accepting writes simultaneously"
      - "Writing to both RDB and AOF in Redis"
      - "Writing the same row twice by mistake"
      - "Updating a database and separately publishing an event are not atomic, so a crash between them leaves the DB and event stream inconsistent"
    answer: 3
    explanation: |
      When a service does two separate writes (DB update + event publish) that are not in
      one atomic transaction, a failure between them can lose the event or publish an event
      for a rolled-back change — the dual-write problem the outbox pattern addresses.
    ref: "concepts.md#cdc-use-cases"

  - id: stream-processing-cdc-045
    difficulty: intermediate
    tags: [event-sourcing, cdc, comparison]
    question: |
      What is the key architectural difference between event sourcing and CDC?
    options:
      - "In event sourcing the event log is the source of truth (app is built around domain events); in CDC the database tables are the source of truth and the change stream is a derived byproduct"
      - "Event sourcing only works with NoSQL; CDC only with SQL"
      - "CDC stores full history forever while event sourcing never retains history"
      - "They are identical concepts"
    answer: 0
    explanation: |
      Event sourcing makes the event log the primary record and derives state by replaying
      domain events. CDC keeps tables as the source of truth and derives a low-level change
      stream by tailing the DB log.
    ref: "concepts.md#event-sourcing-vs-cdc"

  - id: stream-processing-cdc-046
    difficulty: advanced
    tags: [event-sourcing, cdc, semantics]
    question: |
      Which statement best captures the semantic difference between event-sourced events and
      CDC events?
    options:
      - "CDC events capture business intent while event-sourced events are mechanical"
      - "Event-sourced events capture business intent (why), while CDC events are mechanical row-level deltas (how the data changed) that don't distinguish a bulk UPDATE from a user action"
      - "Both capture identical business intent"
      - "Neither captures any change information"
    answer: 1
    explanation: |
      Event-sourced events express domain intent ("OrderShipped"); CDC events are row-level
      before/after deltas that look the same whether caused by a user action or a bulk
      update, so you can't reliably reverse-engineer intent from them.
    ref: "concepts.md#event-sourcing-vs-cdc"

  - id: stream-processing-cdc-047
    difficulty: intermediate
    tags: [event-sourcing, cqrs]
    question: |
      Event sourcing is commonly paired with which pattern, where commands append events and
      separate read models are built by projecting those events?
    options:
      - "Sharding"
      - "CAP theorem"
      - "CQRS (Command Query Responsibility Segregation)"
      - "Two-phase commit"
    answer: 2
    explanation: |
      With CQRS, commands append events and separate read models (materialized views) are
      built by projecting those events, giving fast, purpose-built query paths distinct from
      the write path.
    ref: "concepts.md#event-sourcing-vs-cdc"

  - id: stream-processing-cdc-048
    difficulty: intermediate
    tags: [stream-joins, stream-stream]
    question: |
      Why does a stream-stream join require a time window?
    options:
      - "Because windows make the join stateless"
      - "Because Kafka forbids joins without windows"
      - "Because streams are always sorted by key"
      - "Because both sides are unbounded, so you can't buffer either forever; the window bounds which events can match and lets old state be evicted"
    answer: 3
    explanation: |
      Both inputs are unbounded, so you buffer each side only for a window and match events
      whose timestamps are close, evicting state after the window. Without a window, state
      would grow forever.
    ref: "concepts.md#stream-joins"

  - id: stream-processing-cdc-049
    difficulty: intermediate
    tags: [stream-joins, stream-table, enrichment]
    question: |
      In a stream-table join used for enrichment (e.g. enrich each click with the current
      user profile), which statement is correct?
    options:
      - "Only the stream side triggers output; the table holds current state per key, so no time window is needed"
      - "Neither side triggers output"
      - "The join requires exactly-once transactions to function"
      - "Both the stream and the table trigger output, and a window is required"
    answer: 0
    explanation: |
      A stream-table (KTable) join enriches each stream event with the table's current
      value per key. Only the stream side emits output, and because the table is bounded
      (one value per key) no windowing is needed.
    ref: "concepts.md#stream-joins"

  - id: stream-processing-cdc-050
    difficulty: advanced
    tags: [stream-joins, temporal, gotcha]
    question: |
      A naive stream-table join enriches each event with whatever the table holds "now."
      Why can this be incorrect, and what addresses it?
    options:
      - "It's always correct; there is no issue"
      - "It ignores event time: an older stream event should be enriched with the table value as of the event's time, not a later value — temporal/versioned-table joins address this"
      - "It uses too much memory; add more RAM"
      - "It requires read_committed isolation to fix"
    answer: 1
    explanation: |
      Temporal correctness requires enriching each event with the table value as of the
      event's time, not the latest value, when the stream event predates a later table
      update. Temporal/versioned-table join semantics (in Flink and Kafka Streams) address
      this.
    ref: "concepts.md#stream-joins"

  - id: stream-processing-cdc-051
    difficulty: beginner
    tags: [stream-joins, table-table]
    question: |
      A join between two changelog tables that produces a new continuously updated table is
      called a:
    options:
      - "Nested-loop batch join"
      - "Stream-stream join"
      - "Table-table join"
      - "Cross join with no keys"
    answer: 2
    explanation: |
      A table-table join joins two KTables (changelog tables); either side's update
      re-evaluates the join, yielding a new continuously updated table (a materialized view
      of the join).
    ref: "concepts.md#stream-joins"

  - id: stream-processing-cdc-052
    difficulty: beginner
    tags: [stream-vs-batch, latency]
    question: |
      Which scenario is the best fit for batch rather than streaming, per the trade-offs
      discussed?
    options:
      - "Real-time leaderboard updates"
      - "Live clickstream enrichment"
      - "Fraud detection that must react within milliseconds"
      - "A nightly financial close where latency doesn't matter, the input is naturally bounded, and simpler correctness guarantees are preferred"
    answer: 3
    explanation: |
      Batch is preferable when freshness has little business value, the input is bounded,
      and simpler operational/correctness guarantees outweigh low latency — e.g. a nightly
      financial close. Streaming pays a complexity tax worth taking only when freshness
      matters.
    ref: "concepts.md#stream-vs-batch-processing"
