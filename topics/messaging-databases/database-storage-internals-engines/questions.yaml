topic: Database Storage Internals & Engines
domain: messaging-databases
topic_slug: database-storage-internals-engines
version: 1
questions:
- id: database-storage-internals-engines-001
  difficulty: beginner
  tags:
  - b-tree
  - structure
  question: |
    In a B+tree used as a database index, where is the actual row data (or the
    pointer to it) stored?
  options:
  - Only in the leaf level
  - Only in the root node
  - In every node, including interior/branch nodes
  - In a separate hash table alongside the tree
  answer: 0
  explanation: |
    In a B+tree, interior (branch) nodes hold only keys and child pointers to route
    the search; all data or row pointers live in the leaf level, and leaves are linked
    for range scans. This is the key difference from a plain B-tree, which stores data
    in every node.
  ref: concepts.md#b-tree-and-btree-storage-engines
- id: database-storage-internals-engines-002
  difficulty: beginner
  tags:
  - b-tree
  - range-scan
  question: |
    Why are the leaf nodes of a B+tree typically linked together in a doubly-linked list?
  options:
  - To reduce the overall height of the tree so that fewer levels must be traversed
  - To make range scans and ordered traversal efficient without re-descending the tree
  - To store multiple redundant copies of each row on separate leaves for durability
  - To eliminate the need for a buffer pool by keeping every leaf permanently in memory
  answer: 1
  explanation: |
    Linked leaves let a range scan walk sibling leaf pages in order after locating the
    start key, without descending from the root again for each page. This is why B+trees
    excel at range queries and ordered scans.
  ref: concepts.md#b-tree-and-btree-storage-engines
- id: database-storage-internals-engines-003
  difficulty: intermediate
  tags:
  - b-tree
  - clustered-index
  - innodb
  - postgres
  question: |
    A candidate says "in both InnoDB and PostgreSQL the table is physically stored as a
    B+tree ordered by primary key." What is wrong with this statement?
  options:
  - Nothing is wrong — both engines physically order the table as a primary-key clustered B+tree
  - PostgreSQL stores tables as a clustered PK index, but InnoDB keeps rows in an unordered heap
  - InnoDB uses a clustered PK B+tree, but a PostgreSQL table is an unordered heap with all indexes stored separately
  - Neither engine uses B+trees; both index tables with hash maps ordered by insertion time
  answer: 2
  explanation: |
    InnoDB stores the table as a clustered B+tree keyed by the primary key (leaf holds the
    full row). PostgreSQL stores rows in an unordered heap; every index (including the PK)
    is a separate B+tree whose leaves hold a ctid pointing into the heap. Postgres has no
    clustered index.
  ref: concepts.md#b-tree-and-btree-storage-engines
- id: database-storage-internals-engines-004
  difficulty: intermediate
  tags:
  - innodb
  - secondary-index
  - bookmark-lookup
  question: |
    In InnoDB, a secondary index leaf entry stores the indexed column values plus what
    else, and what does that imply for a query selecting non-indexed columns?
  options:
  - A direct physical disk-page pointer to the row, so no additional lookup is ever needed
  - The complete row image, because InnoDB secondary indexes maintain no clustered index at all
  - Nothing else; InnoDB permits only a single index per table so no further probe can occur
  - The primary key value; a second probe into the clustered index is needed for non-indexed columns
  answer: 3
  explanation: |
    InnoDB secondary index leaves store the indexed columns plus the primary key value.
    To fetch columns not in the secondary index, the engine does a second probe into the
    clustered index using that PK (a bookmark lookup). A covering index avoids this.
  ref: concepts.md#b-tree-and-btree-storage-engines
- id: database-storage-internals-engines-005
  difficulty: beginner
  tags:
  - b-tree
  - height
  - performance
  question: |
    Why does a B+tree over billions of rows still resolve a point lookup with only a
    handful of page accesses?
  options:
  - Because high fan-out per page keeps the tree only ~3-4 levels deep, and upper levels stay cached
  - Because it stores every row directly in the root node, which is always resident in memory
  - Because it rebalances and fully rebuilds its entire structure from scratch on every query
  - Because it resolves lookups with a single hash computation instead of any key comparison
  answer: 0
  explanation: |
    With hundreds of keys per page, fan-out is large, so even billions of rows fit in a
    tree only 3-4 levels deep. The upper levels are almost always cached in the buffer
    pool, so a point lookup is typically ~1 physical I/O.
  ref: concepts.md#b-tree-and-btree-storage-engines
- id: database-storage-internals-engines-006
  difficulty: intermediate
  tags:
  - b-tree
  - page-split
  - write-amplification
  question: |
    What happens when a row is inserted into a B+tree leaf page that is already full?
  options:
  - The insert is rejected and the transaction aborts with a page-full error until pages are compacted
  - The page is split into two, and a separator key is pushed up to the parent
  - The row is written to the WAL only and never materialized into any page of the tree
  - The entire tree is converted on the fly into an LSM-tree to absorb the overflowing row
  answer: 1
  explanation: |
    A full leaf page splits into two roughly half-full pages, and a separator key is
    propagated to the parent (which may itself split). Page splits keep the tree balanced
    but are a source of write amplification and fragmentation.
  ref: concepts.md#b-tree-and-btree-storage-engines
- id: database-storage-internals-engines-007
  difficulty: beginner
  tags:
  - lsm
  - memtable
  - writes
  question: |
    In an LSM-tree, where does a write go before it is ever written to a sorted file on disk?
  options:
  - Directly into the newest existing SSTable, which is opened and updated in place on each write
  - Only into the per-SSTable Bloom filter, which is later expanded into the sorted data file
  - Into the WAL for durability and an in-memory memtable
  - Into the buffer pool's dirty-page list, from which a background thread rewrites the SSTable
  answer: 2
  explanation: |
    An LSM write is appended to the WAL (durability) and inserted into the in-memory
    memtable (a sorted structure like a skip list). No SSTable is touched; when the
    memtable fills it is flushed as a new immutable SSTable.
  ref: concepts.md#lsm-trees-memtable-sstables-and-compaction
- id: database-storage-internals-engines-008
  difficulty: beginner
  tags:
  - lsm
  - sstable
  - immutability
  question: |
    A defining property of an SSTable in an LSM-tree is that it is:
  options:
  - Mutable and updated in place on every incoming write, much like a B+tree leaf page
  - Always kept entirely resident in memory and never persisted to disk during its lifetime
  - Stored completely unsorted on disk, requiring a full sequential scan for every point read
  - Immutable once written — only created and deleted, never modified
  answer: 3
  explanation: |
    SSTables (Sorted String Tables) are immutable, sorted files. Once flushed they are
    never modified in place; compaction merges them into new SSTables and deletes the old
    ones. Immutability is what makes LSM writes sequential.
  ref: concepts.md#lsm-trees-memtable-sstables-and-compaction
- id: database-storage-internals-engines-009
  difficulty: intermediate
  tags:
  - lsm
  - bloom-filter
  - read-path
  question: |
    Why do LSM-tree engines keep a Bloom filter per SSTable?
  options:
  - To let a read skip SSTables that definitely do not contain the key, reducing read amplification
  - To compress the SSTable's data blocks by deduplicating keys before they are flushed to disk
  - To guarantee that a lookup can never return a false positive when probing multiple SSTables
  - To order incoming writes sequentially so that the memtable stays sorted before it is flushed
  answer: 0
  explanation: |
    A read may have to check multiple SSTables newest-to-oldest. A per-SSTable Bloom
    filter answers "definitely not present" cheaply, so the read skips files that cannot
    contain the key, bounding read amplification. (Bloom filters have false positives, not
    false negatives.)
  ref: concepts.md#lsm-trees-memtable-sstables-and-compaction
- id: database-storage-internals-engines-010
  difficulty: intermediate
  tags:
  - lsm
  - compaction
  question: |
    What is the primary purpose of compaction in an LSM-tree?
  options:
  - To split full leaf pages into two roughly half-full pages as new keys are inserted
  - To merge SSTables into fewer/larger ones, discarding overwritten values and tombstones
  - To flush all dirty pages from the buffer pool to disk at each periodic checkpoint
  - To convert the engine's row-oriented storage into a compressed columnar layout on disk
  answer: 1
  explanation: |
    Compaction merges overlapping SSTables into fewer, larger, non-overlapping files,
    dropping obsolete versions and processed tombstones. It reclaims space and bounds read
    amplification, and is the dominant source of an LSM engine's write amplification.
  ref: concepts.md#lsm-trees-memtable-sstables-and-compaction
- id: database-storage-internals-engines-011
  difficulty: advanced
  tags:
  - lsm
  - compaction
  - leveled
  - tiered
  question: |
    Compared with size-tiered compaction, leveled compaction (e.g. RocksDB default)
    generally offers:
  options:
  - Lower write amplification along with strictly lower space amplification on every level
  - Higher read amplification combined with higher write amplification than size-tiered
  - Lower read and space amplification but higher write amplification
  - Identical amplification on all three axes regardless of the compaction strategy chosen
  answer: 2
  explanation: |
    Leveled compaction keeps non-overlapping levels where a key exists in at most one
    SSTable per level, giving low read and space amplification. The cost is high write
    amplification (~10-30x). Size-tiered compaction inverts this: low write amp but higher
    read and transient space amp.
  ref: concepts.md#lsm-trees-memtable-sstables-and-compaction
- id: database-storage-internals-engines-012
  difficulty: advanced
  tags:
  - lsm
  - tombstone
  - delete
  - cassandra
  question: |
    In an LSM engine, how is a delete physically represented, and what is the common
    operational hazard?
  options:
  - The key is immediately located and erased from every SSTable that holds it, so there is no hazard
  - The row is copied into a per-transaction undo log and dropped, with no impact on subsequent reads
  - A leaf page split is triggered to reclaim the key's slot, wasting space through fragmentation
  - A tombstone marker is written; accumulated tombstones can slow reads/range scans until compaction removes them
  answer: 3
  explanation: |
    LSM engines cannot erase in place, so a delete writes a tombstone. The key is only
    truly gone after compaction processes every older version and (in Cassandra) after
    gc_grace_seconds. Meanwhile reads must scan past tombstones, which can be pathological
    for frequently-deleted key ranges (the queue anti-pattern).
  ref: concepts.md#lsm-trees-memtable-sstables-and-compaction
- id: database-storage-internals-engines-013
  difficulty: intermediate
  tags:
  - rum
  - amplification
  question: |
    The RUM conjecture states that an access method can optimize for at most two of which
    three overheads?
  options:
  - Read, Update, and Memory (space)
  - Reliability, Uptime, Maintainability
  - Recovery, Undo, Merge
  - Random, Uniform, Managed
  answer: 0
  explanation: |
    The RUM conjecture (Athanassoulis et al., 2016) says you can minimize at most two of
    Read overhead, Update overhead, and Memory/space overhead at the expense of the third.
    It is the theoretical anchor for the B+tree-vs-LSM trade-off.
  ref: concepts.md#read-write-and-space-amplification-the-rum-conjecture
- id: database-storage-internals-engines-014
  difficulty: intermediate
  tags:
  - write-amplification
  - ssd
  question: |
    Write amplification is best defined as:
  options:
  - The number of concurrent writer sessions a database can sustain before commits queue
  - Bytes actually written to storage divided by the logical bytes of data written
  - The ratio of read operations to write operations observed across a mixed workload
  - The total wall-clock time an engine takes to fsync the WAL at each transaction commit
  answer: 1
  explanation: |
    Write amplification = physical bytes written / logical bytes written. A B+tree
    rewrites a whole page for a small change (plus WAL); an LSM rewrites data repeatedly
    during compaction. High write amplification steals write bandwidth and, on flash, wears
    out the device.
  ref: concepts.md#read-write-and-space-amplification-the-rum-conjecture
- id: database-storage-internals-engines-015
  difficulty: intermediate
  tags:
  - rum
  - engine-choice
  - workload
  question: |
    Given a write-heavy ingest workload (time-series/event logs) on SSDs where reads are
    mostly recent data, which engine family is generally the better fit, and why?
  options:
  - B+tree, because in-place page updates avoid any compaction overhead on write-heavy ingest
  - MyISAM, because its table-level write locks serialize and thereby accelerate bulk inserts
  - LSM-tree, because it converts random writes into sequential appends and defers/merges I/O in compaction
  - A column store, because per-column encoding makes individual single-row inserts extremely cheap
  answer: 2
  explanation: |
    LSM-trees turn random in-place writes into sequential memtable flushes plus WAL, and
    merge the real I/O in background compaction — ideal for write/ingest-heavy workloads on
    flash. The cost is higher read and compaction (write) amplification, acceptable here.
  ref: concepts.md#read-write-and-space-amplification-the-rum-conjecture
- id: database-storage-internals-engines-016
  difficulty: advanced
  tags:
  - space-amplification
  - comparison
  question: |
    Which statement about space amplification is correct?
  options:
  - B+trees have exactly zero space amplification because every update is applied in place
  - LSM-trees never exhibit any space amplification because compaction continuously reclaims it
  - Space amplification is a metric that applies only to columnar analytical storage engines
  - B+trees waste space via partially-full pages and fragmentation, while LSMs hold obsolete versions/tombstones until compaction
  answer: 3
  explanation: |
    Space amplification = on-disk bytes / live logical bytes. B+trees waste space through
    half-full pages and fragmentation from splits; LSM-trees hold obsolete versions and
    tombstones until compaction reclaims them (tiered compaction transiently doubles space).
  ref: concepts.md#read-write-and-space-amplification-the-rum-conjecture
- id: database-storage-internals-engines-017
  difficulty: beginner
  tags:
  - page
  - buffer-pool
  question: |
    What is a database "page" (block)?
  options:
  - The fixed-size unit of I/O transferred between disk and memory
  - A single logical row of a table, stored and addressed independently on disk
  - A compiled and cached SQL query plan ready for repeated execution by the engine
  - A contiguous segment of the replication log shipped from primary to replica hosts
  answer: 0
  explanation: |
    A page/block is the fixed-size unit of I/O between disk and the buffer pool (commonly
    4-16 KB; InnoDB 16 KB, Postgres 8 KB). Rows are packed into pages; the engine reads and
    writes whole pages, not individual rows.
  ref: concepts.md#page-layout-heap-files-and-the-buffer-pool
- id: database-storage-internals-engines-018
  difficulty: intermediate
  tags:
  - slotted-page
  - layout
  question: |
    In a slotted page layout, what is the purpose of the slot (line pointer) array?
  options:
  - It stores the page's per-page Bloom filter so point lookups can skip pages that lack the key
  - It provides an indirection so a row can be moved within its page without invalidating references to it
  - It compresses the row data within the page using dictionary and run-length encoding schemes
  - It links the page to its sibling pages in a doubly-linked list to accelerate ordered range scans
  answer: 1
  explanation: |
    The slot/line-pointer array gives each tuple a stable slot number. Because references
    point at the slot rather than a raw offset, the engine can relocate a tuple within the
    page (e.g. after an update grows it) without breaking pointers.
  ref: concepts.md#page-layout-heap-files-and-the-buffer-pool
- id: database-storage-internals-engines-019
  difficulty: intermediate
  tags:
  - heap-file
  - postgres
  question: |
    A PostgreSQL table is stored as a heap file. What does that mean?
  options:
  - Rows are always kept physically sorted by primary key in a clustered index on disk
  - The table is stored as an in-memory priority-queue that pops the lowest key first
  - Rows are stored as an unordered collection of pages, appended wherever there is free space
  - The table has no on-disk representation and lives only as replayed WAL records in RAM
  answer: 2
  explanation: |
    A heap file is an unordered collection of pages; new/updated tuples go wherever free
    space exists (found via the Free Space Map). Order is not guaranteed — contrast with
    InnoDB's clustered index where the table is the PK-ordered B+tree.
  ref: concepts.md#page-layout-heap-files-and-the-buffer-pool
- id: database-storage-internals-engines-020
  difficulty: advanced
  tags:
  - toast
  - overflow
  - large-values
  question: |
    How does PostgreSQL store a column value too large to fit in a single page?
  options:
  - It rejects the insert and returns a value-too-long error until the column is split by hand
  - It converts the whole table to an LSM-tree so oversized values spill into overflow SSTables
  - It stores the oversized value only in the WAL and rebuilds it by replaying log records on read
  - Via TOAST — it compresses and slices the value into chunks stored in a side table
  answer: 3
  explanation: |
    PostgreSQL uses TOAST (The Oversized-Attribute Storage Technique): large values are
    compressed and, if still too big, sliced into chunks stored in an associated TOAST
    table. InnoDB analogously uses overflow pages with a pointer in the row.
  ref: concepts.md#page-layout-heap-files-and-the-buffer-pool
- id: database-storage-internals-engines-021
  difficulty: intermediate
  tags:
  - buffer-pool
  - tuning
  - innodb
  question: |
    For a B+tree OLTP engine like InnoDB, why is the buffer pool size the single most
    important performance knob?
  options:
  - Because if the hot working set and index upper levels fit in it, most reads are memory hits instead of disk I/O
  - Because it controls the fill factor of newly allocated pages and how densely rows are packed
  - Because it determines how often the WAL is fsync'd to disk at each transaction commit boundary
  - Because it sets the compaction strategy used to merge overlapping on-disk files in the background
  answer: 0
  explanation: |
    The buffer pool caches pages; if the working set (hot data pages plus index upper
    levels) fits in memory, most reads never touch disk. Undersizing it forces frequent
    evictions and physical I/O, which dominates latency in a B+tree engine.
  ref: concepts.md#page-layout-heap-files-and-the-buffer-pool
- id: database-storage-internals-engines-022
  difficulty: advanced
  tags:
  - postgres
  - innodb
  - buffer-pool
  - double-buffering
  question: |
    Why is PostgreSQL's shared_buffers commonly sized to only ~25% of RAM while InnoDB's
    buffer pool is often ~70-80%?
  options:
  - PostgreSQL is architecturally hard-capped and cannot address more than 25% of total system RAM for caching
  - PostgreSQL also relies on the OS page cache (double buffering), while InnoDB expects to own memory and often uses O_DIRECT to bypass the OS cache
  - InnoDB keeps all of its table and index data resident in RAM at all times and never persists pages to disk
  - PostgreSQL performs no data-page caching whatsoever and re-reads every block directly from disk on every query
  answer: 1
  explanation: |
    PostgreSQL deliberately keeps shared_buffers modest because it leans on the OS page
    cache as a second layer (double buffering). InnoDB is designed to own the memory,
    typically using O_DIRECT to skip the OS cache, so it is sized much larger.
  ref: concepts.md#page-layout-heap-files-and-the-buffer-pool
- id: database-storage-internals-engines-023
  difficulty: beginner
  tags:
  - dirty-page
  - buffer-pool
  question: |
    What is a "dirty page" in the buffer pool?
  options:
  - A page that failed its stored checksum validation and was quarantined by the engine as corrupt
  - A page that has been evicted from the buffer pool to make room for a newly requested page
  - A cached page that has been modified in memory and differs from its on-disk copy
  - A page containing only tombstone markers left after every live row on it was deleted
  answer: 2
  explanation: |
    A dirty page is a cached page modified in memory whose on-disk copy is stale. Its
    change is already durable via the WAL; the dirty page itself is flushed asynchronously
    (write-behind), typically at a checkpoint.
  ref: concepts.md#dirty-pages-checkpoints-and-flushing
- id: database-storage-internals-engines-024
  difficulty: intermediate
  tags:
  - checkpoint
  - recovery
  question: |
    What are the two primary purposes of a checkpoint?
  options:
  - To compress existing SSTables and rebuild their per-file Bloom filters during background merges
  - To choose the optimal query execution plan and cache it in the shared plan cache for reuse
  - To split full B+tree leaf pages into two half-full pages when new keys can no longer fit
  - To bound crash-recovery time by advancing the replay start point, and to allow old WAL to be recycled
  answer: 3
  explanation: |
    A checkpoint flushes dirty pages and records a WAL position, so recovery only replays
    WAL from that point (bounding recovery time) and WAL segments older than the checkpoint
    can be recycled or removed.
  ref: concepts.md#dirty-pages-checkpoints-and-flushing
- id: database-storage-internals-engines-025
  difficulty: advanced
  tags:
  - postgres
  - checkpoint
  - tuning
  question: |
    In PostgreSQL, what does checkpoint_completion_target (default 0.9) do?
  options:
  - Spreads the checkpoint's dirty-page flush over ~90% of the interval to avoid an I/O spike
  - Sets the fraction of total system RAM that PostgreSQL allocates to the shared_buffers cache
  - Determines how many redundant copies of each WAL segment are retained on disk for recovery
  - Controls the size ratio between adjacent LSM levels that governs when compaction is triggered
  answer: 0
  explanation: |
    checkpoint_completion_target spreads the write of dirty pages over that fraction of the
    checkpoint interval (0.9 = ~90%), smoothing I/O instead of dumping all dirty pages at
    once and stalling foreground work.
  ref: concepts.md#dirty-pages-checkpoints-and-flushing
- id: database-storage-internals-engines-026
  difficulty: advanced
  tags:
  - innodb
  - checkpoint
  - fuzzy
  question: |
    How does InnoDB perform checkpointing?
  options:
  - It halts all incoming writes and synchronously flushes every dirty page to disk at a fixed five-minute interval
  - Continuously via page-cleaner threads (fuzzy checkpointing), driven by redo-log fullness / adaptive flushing
  - It never checkpoints at all and instead relies solely on streaming replication to rebuild state after a crash
  - It checkpoints only when the server is cleanly shut down, flushing every dirty page in a single final pass
  answer: 1
  explanation: |
    InnoDB does continuous fuzzy checkpointing: page-cleaner threads trickle dirty pages
    out, and adaptive flushing speeds up as the redo log fills. It tracks the oldest
    unflushed change via an LSN so redo can be trimmed.
  ref: concepts.md#dirty-pages-checkpoints-and-flushing
- id: database-storage-internals-engines-027
  difficulty: beginner
  tags:
  - wal
  - durability
  question: |
    The write-ahead logging rule states that:
  options:
  - The modified data page must be flushed to stable storage before its corresponding log record is written
  - Every write must go directly to disk with no in-memory buffering, so the buffer pool is bypassed entirely
  - The log record for a change must be made durable before the modified data page (and before commit is acknowledged)
  - The server-layer binlog must always be fsync'd to disk before the engine's redo log on every commit
  answer: 2
  explanation: |
    WAL requires the log record to reach durable storage before the corresponding data
    page, and before commit is acknowledged. This makes commit durable via a cheap
    sequential append while data pages are flushed lazily — the basis of ACID durability.
  ref: concepts.md#write-ahead-logging-redo-undo-and-the-binlog
- id: database-storage-internals-engines-028
  difficulty: intermediate
  tags:
  - redo
  - undo
  - distinction
  question: |
    Which pair correctly distinguishes the redo log from the undo log?
  options:
  - Redo reverses uncommitted changes at rollback while undo replays committed changes during crash recovery
  - Redo is used exclusively for shipping changes to replicas while undo is the only log consulted during crash recovery
  - They are simply two different names for one and the same physical log file written on every commit
  - Redo rolls forward committed changes at recovery; undo reverses changes and reconstructs old row versions for MVCC
  answer: 3
  explanation: |
    The redo log holds physical records used to roll forward committed changes not yet
    flushed (crash recovery). The undo log records how to reverse a change — used to roll
    back uncommitted transactions and to reconstruct prior row versions for MVCC reads.
  ref: concepts.md#write-ahead-logging-redo-undo-and-the-binlog
- id: database-storage-internals-engines-029
  difficulty: intermediate
  tags:
  - binlog
  - mysql
  - replication
  question: |
    In MySQL, what is the binary log (binlog) used for, and how does it differ from the
    InnoDB redo log?
  options:
  - The binlog is a server-layer logical log for replication and point-in-time recovery; the redo log is InnoDB's physical crash-recovery log
  - The binlog is InnoDB's engine-layer physical crash-recovery log, while the redo log is the server-layer stream shipped to replicas
  - They are identical logical logs stored together in the same file and written by a single shared code path
  - The binlog stores cached query execution plans for reuse, whereas the redo log stores the actual changed row images
  answer: 0
  explanation: |
    The binlog is a server-layer, logical record of changes used for replication and PITR,
    not crash recovery. The InnoDB redo log is a physical, engine-layer log for durability
    and crash recovery. A commit writes to both, coordinated by internal two-phase commit.
  ref: concepts.md#write-ahead-logging-redo-undo-and-the-binlog
- id: database-storage-internals-engines-030
  difficulty: advanced
  tags:
  - postgres
  - wal
  - replication
  question: |
    Unlike MySQL, PostgreSQL does not have a separate binlog. What serves both crash
    recovery and streaming replication in PostgreSQL?
  options:
  - The undo log
  - Its single WAL
  - The visibility map
  - The free space map
  answer: 1
  explanation: |
    PostgreSQL has one WAL that is used both for crash recovery and for streaming
    replication (WAL records are shipped to replicas). There is no separate logical
    replication binlog at the core level as in MySQL.
  ref: concepts.md#write-ahead-logging-redo-undo-and-the-binlog
- id: database-storage-internals-engines-031
  difficulty: intermediate
  tags:
  - aries
  - recovery
  - phases
  question: |
    What is the correct order of the three phases of ARIES crash recovery?
  options:
  - Redo, Undo, Analysis
  - Undo, Analysis, Redo
  - Analysis, Redo, Undo
  - Analysis, Undo, Redo
  answer: 2
  explanation: |
    ARIES runs Analysis (rebuild dirty-page and transaction tables from the last
    checkpoint), then Redo ("repeat history" — replay all logged changes idempotently),
    then Undo (roll back transactions uncommitted at crash time, logging CLRs).
  ref: concepts.md#crash-recovery-and-aries
- id: database-storage-internals-engines-032
  difficulty: advanced
  tags:
  - aries
  - lsn
  - idempotent
  question: |
    During the ARIES redo phase, how does recovery avoid re-applying a change already
    reflected in a page?
  options:
  - It checks a per-page Bloom filter that records which log records have already been applied to that page
  - It re-applies every logged change unconditionally, which is safe only because all page writes are commutative
  - It consults the server-layer binlog to see whether the transaction was already committed and flushed
  - It compares the record's LSN to the page's stored pageLSN and skips if the page is already up to date
  answer: 3
  explanation: |
    Each page stores the LSN of the last change applied to it (pageLSN). During redo, a log
    record is applied only if pageLSN < logLSN; otherwise the change is already present.
    This makes redo idempotent, so recovery can crash and restart repeatedly and still
    converge.
  ref: concepts.md#crash-recovery-and-aries
- id: database-storage-internals-engines-033
  difficulty: advanced
  tags:
  - aries
  - clr
  - undo
  question: |
    What is the role of a Compensation Log Record (CLR) in ARIES?
  options:
  - It logs undo actions so that undo work is itself crash-safe and never repeated if recovery restarts
  - It compresses older redo-log records to reclaim log space once their changes are safely flushed
  - It marks the exact start position of a checkpoint so the analysis phase knows where to begin scanning
  - It stores the compiled query execution plan of the aborting transaction so it can be replayed on undo
  answer: 0
  explanation: |
    ARIES logs each undo action as a CLR. If recovery is interrupted during undo and
    restarts, CLRs let it continue rolling back from where it left off rather than redoing
    already-completed undo work — undo becomes crash-safe.
  ref: concepts.md#crash-recovery-and-aries
- id: database-storage-internals-engines-034
  difficulty: intermediate
  tags:
  - mvcc
  - postgres
  - heap-bloat
  question: |
    In PostgreSQL's MVCC, what does an UPDATE do to the old row version, and what is the
    operational consequence?
  options:
  - It overwrites the existing row in place with the new values, leaving no old version and no cleanup consequence
  - It writes a new tuple version and marks the old one dead (xmax), causing table/index bloat until VACUUM reclaims it
  - It relocates the old row version into a separate undo tablespace that a background purge thread later trims
  - It physically deletes the entire row and re-inserts the updated values into a companion hash index structure
  answer: 1
  explanation: |
    PostgreSQL never overwrites a row on UPDATE; it inserts a new tuple version and marks
    the old one with xmax. Dead tuples accumulate as bloat in the table and indexes until
    VACUUM/autovacuum reclaims the space.
  ref: concepts.md#mvcc-version-storage-postgres-heap-vs-innodb-undo
- id: database-storage-internals-engines-035
  difficulty: intermediate
  tags:
  - mvcc
  - innodb
  - undo-log
  question: |
    Where does InnoDB keep the previous versions of a row needed for MVCC snapshot reads?
  options:
  - As additional dead tuple versions chained together inside the same clustered index leaf page
  - In the server-layer binlog, from which snapshot readers replay prior committed row images
  - In the undo log, reconstructed by walking the row's roll pointer
  - In a per-table Bloom filter that indexes every historical version of each primary key
  answer: 2
  explanation: |
    InnoDB updates the row in place in the clustered index and writes the previous values
    to the undo log. A reader needing an older snapshot follows the row's roll pointer back
    through the undo chain to reconstruct that version.
  ref: concepts.md#mvcc-version-storage-postgres-heap-vs-innodb-undo
- id: database-storage-internals-engines-036
  difficulty: advanced
  tags:
  - mvcc
  - long-transaction
  - incident
  question: |
    A monitoring dashboard shows one connection has held an open transaction (idle in
    transaction) for hours. Why is this dangerous in an MVCC database?
  options:
  - It saturates a CPU core by continuously polling the server for its transaction status while idle
  - It forces the engine to trigger an immediate full checkpoint that flushes every dirty page at once
  - It pins and disables the entire buffer pool, forcing all other sessions to read directly from disk
  - 'It pins the oldest snapshot: PostgreSQL cannot vacuum dead tuples (bloat) and InnoDB cannot purge undo (history-list growth)'
  answer: 3
  explanation: |
    A long-running/idle transaction holds the oldest snapshot, so old versions can't be
    reclaimed: Postgres autovacuum can't remove dead tuples (table/index bloat) and InnoDB's
    purge thread can't discard undo (history-list growth, slower scans). It's a classic
    production incident.
  ref: concepts.md#mvcc-version-storage-postgres-heap-vs-innodb-undo
- id: database-storage-internals-engines-037
  difficulty: advanced
  tags:
  - postgres
  - hot
  - mvcc
  - index
  question: |
    What is a HOT (Heap-Only Tuple) update in PostgreSQL, and when does it apply?
  options:
  - An update where no indexed columns change and the new version fits on the same page, so no new index entries are created
  - An update that runs on a read replica and is streamed back to the primary only after the replica acknowledges it
  - An update that bypasses the WAL and writes the new tuple straight into the heap page for lower commit latency
  - An update that triggers an immediate VACUUM FULL to reclaim the dead tuple's space before the commit returns
  answer: 0
  explanation: |
    A HOT update applies when the changed columns are not indexed and the new tuple version
    fits on the same page. Postgres chains the new version on that page without adding index
    entries, greatly reducing index bloat. Reserving free space (lower fillfactor) enables it.
  ref: concepts.md#mvcc-version-storage-postgres-heap-vs-innodb-undo
- id: database-storage-internals-engines-038
  difficulty: intermediate
  tags:
  - vacuum
  - postgres
  question: |
    In PostgreSQL, what is the difference between VACUUM and VACUUM FULL?
  options:
  - They are identical aliases for the same command, and PostgreSQL simply picks one form at random per invocation
  - VACUUM reclaims dead-tuple space for reuse within the table; VACUUM FULL rewrites the table to actually shrink it and takes an ACCESS EXCLUSIVE lock
  - VACUUM permanently deletes the table's rows, while VACUUM FULL truncates the file and resets the table's sequences to zero
  - VACUUM runs only against index structures, while VACUUM FULL runs exclusively against heap pages and skips all indexes
  answer: 1
  explanation: |
    VACUUM marks dead-tuple space reusable within the table (no exclusive lock, doesn't
    shrink the file). VACUUM FULL rewrites the entire table into a new file, returning space
    to the OS, but requires an ACCESS EXCLUSIVE lock that blocks all access.
  ref: concepts.md#mvcc-version-storage-postgres-heap-vs-innodb-undo
- id: database-storage-internals-engines-039
  difficulty: intermediate
  tags:
  - fill-factor
  - updates
  question: |
    Why might you lower the fill factor on a frequently-updated heap table?
  options:
  - To pack more rows into every page and improve cache density so that fewer buffer-pool pages are touched per scan
  - To force each update to be written through the WAL twice, doubling durability at the cost of write throughput
  - To leave free space on each page so an updated row can stay on the same page, enabling HOT updates and avoiding page splits/row migration
  - To convert the heap table into columnar storage so per-column compression can shrink its on-disk footprint
  answer: 2
  explanation: |
    A lower fill factor reserves in-page free space so a growing/updated row stays put. In
    Postgres this enables HOT updates (no new index entries); more generally it avoids
    B+tree page splits and InnoDB row migration (forwarding pointers). The trade-off is
    wasted space and lower cache density.
  ref: concepts.md#fill-factor-and-page-fragmentation
- id: database-storage-internals-engines-040
  difficulty: intermediate
  tags:
  - fill-factor
  - index
  - defaults
  question: |
    B+tree indexes typically default to a high fill factor (~90%). Why is that appropriate
    for indexes but not necessarily for update-heavy heap tables?
  options:
  - Because indexes are never updated after creation and are rebuilt from scratch on every write to the base table
  - Because index pages live entirely inside the WAL and are therefore exempt from the engine's normal fill-factor rules
  - Because B+tree indexes use LSM-trees internally, so their leaf pages are immutable and can always be packed completely full
  - Because index entries rarely grow in place, so packing them tightly improves read efficiency and size
  answer: 3
  explanation: |
    Index entries generally don't grow in place, so a high fill factor packs them densely
    for read efficiency and smaller size. Update-heavy heap tables benefit from headroom
    (lower fillfactor) to keep updated rows on the same page and avoid splits/migration.
  ref: concepts.md#fill-factor-and-page-fragmentation
- id: database-storage-internals-engines-041
  difficulty: advanced
  tags:
  - fragmentation
  - maintenance
  question: |
    Over time, page splits and dead-tuple churn cause fragmentation (logical order differs
    from physical order, half-empty pages). Which operations remedy this by rewriting the
    structure?
  options:
  - REINDEX, CLUSTER, VACUUM FULL, or OPTIMIZE TABLE
  - ANALYZE and EXPLAIN, which recompute planner statistics and reveal how badly the pages are fragmented
  - COMMIT and ROLLBACK, which finalize or discard the in-flight transaction and thereby release the wasted slots
  - Increasing the buffer pool size only, so the fragmented pages stay resident in memory and are never re-read
  answer: 0
  explanation: |
    Fragmentation is fixed by rewriting the structure: REINDEX rebuilds indexes, CLUSTER
    reorders a table by an index, VACUUM FULL rewrites a Postgres table, and OPTIMIZE TABLE
    does the equivalent in MySQL. ANALYZE only updates statistics; it doesn't defragment.
  ref: concepts.md#fill-factor-and-page-fragmentation
- id: database-storage-internals-engines-042
  difficulty: beginner
  tags:
  - row-store
  - column-store
  question: |
    A row store keeps all columns of a row contiguously; a column store keeps each column's
    values contiguously. Which is better suited to a query like
    SELECT AVG(price) FROM sales over a wide table?
  options:
  - Row store, because reading whole contiguous rows lets the CPU compute the average in a single pass
  - Column store, because it reads only the price column and compresses it well
  - Neither; both layouts read the identical number of bytes for this query, so the choice is irrelevant
  - Row store, because column stores can only retrieve raw values and cannot evaluate aggregate functions like AVG
  answer: 1
  explanation: |
    A column store reads only the price column, skipping all others — a huge I/O saving on
    wide tables — and compresses homogeneous column values very well. Row stores must read
    every column of every row for such a scan.
  ref: concepts.md#row-vs-column-storage
- id: database-storage-internals-engines-043
  difficulty: intermediate
  tags:
  - column-store
  - compression
  question: |
    Why do column stores achieve much better compression than row stores?
  options:
  - They physically store fewer rows by discarding duplicate records during the write path before flushing to disk
  - They avoid storing any secondary indexes, so the space normally consumed by index structures is saved entirely
  - A column holds homogeneous values, enabling run-length, dictionary, delta, and bit-packing encodings
  - They keep all of the table's data resident in memory, where a general-purpose compressor squeezes it far harder
  answer: 2
  explanation: |
    Within a column, values are the same type and often similar, so encodings like
    run-length, dictionary, delta, and bit-packing/frame-of-reference are highly effective.
    Row stores mix heterogeneous column values, compressing far less well.
  ref: concepts.md#row-vs-column-storage
- id: database-storage-internals-engines-044
  difficulty: intermediate
  tags:
  - oltp
  - olap
  - storage-orientation
  question: |
    An engineer proposes running heavy analytical aggregations directly on the OLTP row-store
    primary "since the data is already there." What is the strongest technical objection?
  options:
  - Row stores are physically incapable of running GROUP BY, so the aggregation query would fail to parse on the primary
  - OLTP databases maintain no indexes at all, forcing every analytical aggregate into a full unindexed sequential scan
  - Analytical aggregations can only be evaluated by an LSM-tree engine, which the OLTP row-store primary does not provide
  - A full aggregate over a wide row store reads every column of every row, whereas a column store reads only needed columns and compresses them 10x+
  answer: 3
  explanation: |
    Analytical scans over a row store must read all columns of all rows, thrashing I/O and
    cache. Column stores read only the referenced columns and compress them heavily, which
    is why analytics belongs on a columnar engine or columnar replica, not the OLTP primary.
  ref: concepts.md#row-vs-column-storage
- id: database-storage-internals-engines-045
  difficulty: advanced
  tags:
  - wal
  - write-behind
  - caching
  question: |
    How do write-ahead logging and write-behind (write-back) caching relate in a database?
  options:
  - WAL provides a durability-ordering guarantee that makes lazy (write-behind) flushing of dirty data pages safe
  - They are the same mechanism under two different names, both writing the identical bytes to the identical file
  - Write-behind flushing of a dirty data page must always complete before its corresponding WAL record is made durable
  - WAL fully replaces the need for any on-disk data pages, since every read is served by replaying log records instead
  answer: 0
  explanation: |
    WAL is an ordering guarantee (log durable before the data page, for durability).
    Write-behind is a timing optimization (flush dirty data pages lazily, for throughput).
    Because the WAL already recorded the change durably, the data-page flush is free to be
    deferred safely.
  ref: concepts.md#write-ahead-wal-vs-write-behind-caching
- id: database-storage-internals-engines-046
  difficulty: advanced
  tags:
  - fsync
  - durability
  - hardware
  question: |
    A RAID controller has a volatile write-back cache with no battery/flash backup. Why can
    this break a database's durability guarantee even with WAL enabled?
  options:
  - It slows down reads by forcing every cached block to be re-validated against the underlying platters on access
  - It can acknowledge an fsync before the data actually reaches stable media, so a power loss loses supposedly-durable WAL
  - It silently disables MVCC, so snapshot readers begin seeing uncommitted rows written by other transactions
  - It forces the controller into write-through mode, which makes each WAL append wait for a full disk rotation
  answer: 1
  explanation: |
    Durability depends on fsync truly persisting data. A volatile write-back cache that
    acks fsync before writing to stable media silently violates the WAL's guarantee: a power
    loss loses "committed" transactions. Such caches need battery/flash backup (BBU/FBWC).
  ref: concepts.md#fsync-durability-and-the-performance-knob
- id: database-storage-internals-engines-047
  difficulty: intermediate
  tags:
  - innodb
  - fsync
  - tuning
  question: |
    Setting innodb_flush_log_at_trx_commit = 2 (instead of the default 1) has what effect?
  options:
  - It disables the redo log entirely and, with no crash-recovery record, can silently corrupt the database on restart
  - It makes every single commit both fully durable to stable media and measurably faster than the default setting
  - The redo log is written to the OS cache every commit but fsync'd only ~once per second, surviving a process crash but risking ~1s loss on OS/power failure
  - It switches InnoDB from its row-oriented B+tree into a compressed column store optimized for analytical scans
  answer: 2
  explanation: |
    With value 2, InnoDB writes redo to the OS cache on every commit but flushes (fsync)
    only about once per second. A MySQL process crash loses nothing (OS cache survives), but
    an OS/power crash can lose ~1s of committed transactions. Value 1 (default) fsyncs every
    commit; it never disables the log (that's not an option here).
  ref: concepts.md#fsync-durability-and-the-performance-knob
- id: database-storage-internals-engines-048
  difficulty: advanced
  tags:
  - postgres
  - synchronous-commit
  - fsync
  question: |
    In PostgreSQL, what is the crucial difference between synchronous_commit = off and
    fsync = off?
  options:
  - They are exactly equivalent settings, differing only in the name PostgreSQL exposes for backward compatibility
  - synchronous_commit=off leaves the database corrupt after any crash, whereas fsync=off is the safe production default
  - Both settings disable the WAL entirely, so after a crash the database can only be restored from a base backup
  - synchronous_commit=off risks losing the last few hundred ms of committed transactions but never corrupts the DB; fsync=off can corrupt the database
  answer: 3
  explanation: |
    synchronous_commit=off lets COMMIT return before the WAL fsync, risking a bounded loss
    of recently-committed transactions on crash, but the WAL stays consistent so the DB is
    never corrupted. fsync=off disables flushes entirely and can leave the database corrupt
    after a crash — never use it in production.
  ref: concepts.md#fsync-durability-and-the-performance-knob
- id: database-storage-internals-engines-049
  difficulty: intermediate
  tags:
  - group-commit
  - fsync
  - throughput
  question: |
    Why can higher write concurrency actually increase commit throughput on a WAL-based
    engine?
  options:
  - Because group commit batches the fsyncs of many concurrent commits into a single flush, amortizing fsync cost
  - Because a larger pool of connections spreads SQL parsing across more CPU cores, which is what caps commit rate
  - Because the engine automatically disables the WAL once write concurrency crosses a threshold, skipping all fsyncs
  - Because heavier write load triggers more frequent checkpoints, and each checkpoint flushes pending commits faster
  answer: 0
  explanation: |
    Group commit collects multiple concurrent commits and flushes their WAL with one fsync.
    Since fsync latency dominates, amortizing it across many transactions raises overall
    commit throughput as concurrency rises.
  ref: concepts.md#fsync-durability-and-the-performance-knob
- id: database-storage-internals-engines-050
  difficulty: intermediate
  tags:
  - innodb
  - myisam
  - comparison
  question: |
    Which is a correct reason InnoDB replaced MyISAM as MySQL's default storage engine?
  options:
  - MyISAM consumed far too much buffer-pool memory per open table, which starved concurrent connections of cache
  - MyISAM has no transactions, is not crash-safe, and uses only table-level locking, while InnoDB provides ACID transactions, crash recovery, and row-level locking
  - MyISAM could only store data in a compressed columnar layout, making it unsuitable for row-oriented OLTP workloads
  - InnoDB is a standalone embedded key-value library, whereas MyISAM was the only true server-side engine MySQL shipped
  answer: 1
  explanation: |
    MyISAM offers no transactions, is not crash-safe (needs REPAIR TABLE), and locks at the
    table level (one writer blocks all readers/writers). InnoDB adds ACID transactions,
    crash recovery via redo/undo, MVCC, foreign keys, and row-level locking — hence it became
    the default.
  ref: concepts.md#innodb-vs-myisam-vs-rocksdb-vs-leveldb
- id: database-storage-internals-engines-051
  difficulty: advanced
  tags:
  - rocksdb
  - leveldb
  - comparison
  question: |
    RocksDB is a fork of LevelDB. Which best describes what RocksDB adds?
  options:
  - It converts LevelDB's underlying LSM-tree into an in-place B+tree to cut read amplification on point lookups
  - A built-in SQL parser and cost-based query optimizer that turns the embedded library into a standalone database server
  - Multi-threaded compaction, column families, transactions, merge operators, and much greater tunability
  - Removal of the write-ahead log so that writes skip the fsync path entirely and achieve much higher throughput
  answer: 2
  explanation: |
    RocksDB is a heavily-engineered fork of the minimal, single-threaded LevelDB, adding
    multi-threaded compaction, column families, pessimistic/optimistic transactions, merge
    operators, prefix Bloom filters, and extensive tunability. Both remain LSM-based embedded
    libraries, not SQL servers.
  ref: concepts.md#innodb-vs-myisam-vs-rocksdb-vs-leveldb
- id: database-storage-internals-engines-052
  difficulty: intermediate
  tags:
  - rocksdb
  - leveldb
  - embedded
  question: |
    A key architectural difference between RocksDB/LevelDB and InnoDB is that RocksDB and
    LevelDB are:
  options:
  - Standalone database servers that listen on their own network protocol and accept remote client connections
  - Column stores optimized for analytics, encoding each attribute separately for high-ratio compression on wide scans
  - In-memory-only caches with no disk persistence, so all stored keys are lost the moment the host process exits
  - Embedded key-value storage libraries linked into your process, not standalone servers
  answer: 3
  explanation: |
    RocksDB and LevelDB are embedded storage libraries (you link them into your process);
    they have no network server or SQL layer. InnoDB is a storage engine running inside the
    MySQL server. RocksDB does persist to disk via SSTables and a WAL.
  ref: concepts.md#innodb-vs-myisam-vs-rocksdb-vs-leveldb
- id: database-storage-internals-engines-053
  difficulty: advanced
  tags:
  - myrocks
  - lsm
  - engine-swap
  question: |
    MyRocks (MySQL with RocksDB as the storage engine) was adopted at Meta primarily for
    which benefit over InnoDB on flash?
  options:
  - Lower space and write amplification
  - Faster point reads due to a B+tree
  - Support for table-level locking
  - Elimination of the need for a WAL
  answer: 0
  explanation: |
    MyRocks swaps InnoDB's B+tree for RocksDB's LSM under the same SQL layer, giving far
    lower space and write amplification on flash — reducing storage footprint and device
    wear for write-heavy workloads. It's a clean illustration of the RUM trade-off.
  ref: concepts.md#innodb-vs-myisam-vs-rocksdb-vs-leveldb
- id: database-storage-internals-engines-054
  difficulty: beginner
  tags:
  - b-tree
  - complexity
  question: |
    What is the typical time complexity of a point lookup, insert, or delete in a B+tree?
  options:
  - O(1)
  - O(log n)
  - O(n)
  - O(n log n)
  answer: 1
  explanation: |
    A B+tree provides O(log n) point lookup, insert, and delete because operations descend
    from the root to a leaf, and the balanced structure keeps height logarithmic in the
    number of keys.
  ref: concepts.md#b-tree-and-btree-storage-engines
- id: database-storage-internals-engines-055
  difficulty: advanced
  tags:
  - lsm
  - read-amplification
  - read-path
  question: |
    Given an LSM engine under a read-heavy point-lookup workload where many keys were
    recently overwritten across several SSTables, which statement is most accurate?
  options:
  - Every read is a single disk I/O because all SSTables are merged into one globally sorted file that a binary search indexes directly
  - Reads are served entirely from the WAL, which retains each key's latest value, so on-disk SSTables are only ever consulted during compaction
  - A read may probe the memtable plus multiple SSTables newest-to-oldest, though Bloom filters and block indexes bound the cost
  - Each read triggers an in-place page split to rebalance the SSTable, exactly as a B+tree leaf splits when it overflows on an insert
  answer: 2
  explanation: |
    Because a key's versions can be spread across the memtable and several SSTables, an LSM
    read checks them newest-to-oldest until found. Per-SSTable Bloom filters skip files that
    can't contain the key and sparse block indexes locate the block, bounding read
    amplification but not eliminating it.
  ref: concepts.md#lsm-trees-memtable-sstables-and-compaction
- id: database-storage-internals-engines-056
  difficulty: intermediate
  tags:
  - postgres
  - visibility-map
  - free-space-map
  question: |
    In PostgreSQL, what is the Free Space Map (FSM) used for?
  options:
  - Tracking which transactions are still in flight so snapshot visibility can be computed per tuple
  - Storing the redo log records that are replayed to roll changes forward during crash recovery
  - Bounding crash-recovery time by marking the WAL position where log replay is allowed to begin
  - Finding a heap page with enough room to store a new or updated tuple
  answer: 3
  explanation: |
    The FSM tracks free space per page so the engine can quickly find a page with room for
    a new/updated tuple. The separate Visibility Map tracks all-visible pages to enable
    index-only scans and let vacuum skip pages.
  ref: concepts.md#page-layout-heap-files-and-the-buffer-pool
