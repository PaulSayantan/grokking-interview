topic: "NoSQL Databases & Data Models"
domain: messaging-databases
topic_slug: nosql-databases-data-models
version: 1
questions:
  - id: nosql-databases-data-models-001
    difficulty: beginner
    tags: [families, data-models]
    question: |
      Which NoSQL family stores data as nodes and edges with properties, making
      relationships first-class and multi-hop traversals cheap?
    options:
      - "Key-value"
      - "Document"
      - "Wide-column"
      - "Graph"
    answer: 3
    explanation: |
      Graph databases (Neo4j, Neptune) model data as nodes and edges. Index-free
      adjacency makes traversing a relationship O(1), so multi-hop queries that would be
      many self-joins in SQL are cheap walks.
    ref: "concepts.md#the-four-nosql-families-and-when-each-fits"

  - id: nosql-databases-data-models-002
    difficulty: beginner
    tags: [families, wide-column]
    question: |
      Cassandra, HBase, and Google Bigtable are examples of which NoSQL family?
    options:
      - "Wide-column"
      - "Document"
      - "Graph"
      - "Key-value"
    answer: 0
    explanation: |
      These are wide-column stores: rows of sparse column families partitioned by a key
      and stored sorted within a partition, built for high write volume and partitioned
      range scans.
    ref: "concepts.md#the-four-nosql-families-and-when-each-fits"

  - id: nosql-databases-data-models-003
    difficulty: beginner
    tags: [families, choosing]
    question: |
      A team needs to store and retrieve user session blobs strictly by session id, with
      sub-millisecond latency and no querying by other fields. Which family fits best?
    options:
      - "Key-value"
      - "Wide-column"
      - "Graph"
      - "Relational"
    answer: 0
    explanation: |
      Access is always by a single known key and the value is opaque to the DB — the
      textbook key-value use case (e.g. Redis or DynamoDB). No secondary access paths are
      needed, so the simplest, fastest family wins.
    ref: "concepts.md#the-four-nosql-families-and-when-each-fits"

  - id: nosql-databases-data-models-004
    difficulty: intermediate
    tags: [families, choosing, graph]
    question: |
      You must detect fraud rings by finding accounts within 4 relationship hops of a
      flagged account that share devices or addresses. Which datastore best fits this
      access pattern?
    options:
      - "A graph database traversing account/device/address relationships"
      - "A key-value store keyed by account id"
      - "A wide-column store bucketed by day"
      - "A document store with one document per account"
    answer: 0
    explanation: |
      Variable-depth relationship traversal is the defining strength of a graph database.
      A 4-hop traversal is a linear walk with index-free adjacency, whereas the same
      query in the other families becomes a cascade of joins or scatter reads.
    ref: "concepts.md#the-four-nosql-families-and-when-each-fits"

  - id: nosql-databases-data-models-005
    difficulty: intermediate
    tags: [philosophy, access-patterns]
    question: |
      What is the defining modeling philosophy of aggregate-oriented NoSQL databases
      compared with relational modeling?
    options:
      - "Enumerate the queries first and shape data so each is a single cheap lookup"
      - "Normalize entities first, then discover queries at read time via joins"
      - "Store every entity in third normal form and rely on the query planner"
      - "Always keep one table per entity and never duplicate data"
    answer: 0
    explanation: |
      NoSQL is access-pattern-first: you list the queries the app will run and denormalize
      the data so each query is a single cheap lookup. Duplication is a deliberate design
      choice, not a smell.
    ref: "concepts.md#the-four-nosql-families-and-when-each-fits"

  - id: nosql-databases-data-models-006
    difficulty: beginner
    tags: [redis, key-value, data-structures]
    question: |
      Which statement about Redis as a key-value store is correct?
    options:
      - "Values can be typed structures (hashes, lists, sets, sorted sets) with O(1)/O(log n) operations"
      - "Values are always opaque byte strings with no server-side operations"
      - "Redis cannot set a per-key expiry (TTL)"
      - "Redis executes many commands concurrently with row-level locks"
    answer: 0
    explanation: |
      Redis is a data-structure server: strings, hashes, lists, sets, sorted sets,
      bitmaps, streams, etc., each with efficient operations. It also supports per-key TTL
      (EXPIRE) and executes commands single-threaded, so each command is atomic.
    ref: "concepts.md#key-value-stores-redis-and-dynamodb"

  - id: nosql-databases-data-models-007
    difficulty: beginner
    tags: [dynamodb, keys]
    question: |
      In DynamoDB, what does a composite primary key consist of?
    options:
      - "Two partition keys hashed together"
      - "A partition key plus a mandatory global secondary index"
      - "A clustering column plus a column family"
      - "A partition (hash) key plus a sort (range) key"
    answer: 3
    explanation: |
      A DynamoDB composite primary key is a partition key (hashed to pick the physical
      partition) plus a sort key that orders items within that partition, enabling range
      queries with begins_with/between/comparison operators.
    ref: "concepts.md#key-value-stores-redis-and-dynamodb"

  - id: nosql-databases-data-models-008
    difficulty: intermediate
    tags: [dynamodb, limits, item-size]
    question: |
      What is the maximum size of a single DynamoDB item (all attribute names and values
      combined)?
    options:
      - "400 KB"
      - "1 MB"
      - "16 MB"
      - "64 KB"
    answer: 0
    explanation: |
      A DynamoDB item is capped at 400 KB including attribute names and values. (16 MB is
      the MongoDB *document* limit; 1 MB is DynamoDB's per-request result-page size — easy
      distractors.)
    ref: "concepts.md#key-value-stores-redis-and-dynamodb"

  - id: nosql-databases-data-models-009
    difficulty: intermediate
    tags: [redis, threading, atomicity]
    question: |
      Why are individual Redis commands atomic without explicit locking?
    options:
      - "Redis wraps every command in a distributed two-phase commit"
      - "Redis uses optimistic multi-version concurrency control per key"
      - "Every key is guarded by an OS-level mutex"
      - "Command execution is single-threaded, so commands cannot interleave"
    answer: 3
    explanation: |
      Redis executes commands on a single thread, so one command runs to completion before
      the next starts — no interleaving and thus atomicity without locks. Enhanced I/O
      threading handles networking, but the command/data path is serialized.
    ref: "concepts.md#key-value-stores-redis-and-dynamodb"

  - id: nosql-databases-data-models-010
    difficulty: beginner
    tags: [document, mongodb, model]
    question: |
      What is a distinguishing property of a document store like MongoDB?
    options:
      - "Documents in a collection must all share an identical, DB-enforced schema"
      - "Documents can only be fetched by primary key, never filtered by content"
      - "Documents are self-describing (JSON/BSON) and can be queried by nested fields"
      - "Documents cannot contain arrays or nested objects"
    answer: 2
    explanation: |
      Documents are self-describing JSON/BSON that can nest objects and arrays, and rich
      secondary indexes let you query by fields inside the document (including nested paths
      and array elements). Schema is flexible per document.
    ref: "concepts.md#document-stores-mongodb-and-the-document-model"

  - id: nosql-databases-data-models-011
    difficulty: intermediate
    tags: [mongodb, limits, document-size]
    question: |
      What is the maximum size of a single MongoDB (BSON) document?
    options:
      - "400 KB"
      - "16 MB"
      - "2 GB"
      - "100 MB"
    answer: 1
    explanation: |
      MongoDB caps a single BSON document at 16 MB. This is exactly why unbounded embedded
      arrays (e.g. every comment on a viral post) are an anti-pattern — they eventually
      exceed the limit and should be referenced instead.
    ref: "concepts.md#document-stores-mongodb-and-the-document-model"

  - id: nosql-databases-data-models-012
    difficulty: intermediate
    tags: [mongodb, transactions, atomicity]
    question: |
      Which statement about atomicity in MongoDB is correct?
    options:
      - "MongoDB has never supported multi-document transactions"
      - "Only multi-document transactions are atomic; single writes may be partial"
      - "Atomicity requires disabling the WiredTiger storage engine"
      - "A single-document write is always atomic; multi-document ACID transactions exist since 4.0/4.2"
    answer: 3
    explanation: |
      A write to a single document is always atomic in MongoDB. Multi-document ACID
      transactions were added in 4.0 (replica sets) and extended to sharded clusters in
      4.2, but they cost more than a single-document write, so aggregate boundaries are
      preferred.
    ref: "concepts.md#document-stores-mongodb-and-the-document-model"

  - id: nosql-databases-data-models-013
    difficulty: intermediate
    tags: [wide-column, misconception, columnar]
    question: |
      Which statement about wide-column stores (Cassandra/Bigtable) is correct?
    options:
      - "They are columnar analytics engines optimized for OLAP aggregations"
      - "They are a sparse, distributed, sorted map: rows keyed and partitioned, sorted within a partition"
      - "They enforce a rigid relational schema with foreign keys"
      - "They store each column in a separate compressed file for scan speed"
    answer: 1
    explanation: |
      Despite the name, wide-column is not columnar/OLAP storage. Following the Bigtable
      model, it is a sparse, distributed, multi-dimensional sorted map: rows partitioned by
      a key and stored sorted within each partition — optimized for write-heavy partitioned
      range access, not analytics.
    ref: "concepts.md#wide-column-stores-cassandra-hbase-bigtable"

  - id: nosql-databases-data-models-014
    difficulty: intermediate
    tags: [cassandra, primary-key, clustering]
    question: |
      In the Cassandra table `PRIMARY KEY ((sensor_id, bucket), reading_ts)`, what role
      does `reading_ts` play?
    options:
      - "It is part of the partition key and decides which node stores the row"
      - "It is a clustering column that sorts rows within a partition and enables range scans"
      - "It is a secondary index maintained on every node"
      - "It is a static column shared by all rows in the table"
    answer: 1
    explanation: |
      The first parenthesized group `(sensor_id, bucket)` is the partition key (chooses the
      node); the remaining element `reading_ts` is a clustering column that orders rows
      within the partition and enables efficient range scans / ORDER BY.
    ref: "concepts.md#wide-column-stores-cassandra-hbase-bigtable"

  - id: nosql-databases-data-models-015
    difficulty: advanced
    tags: [cassandra, lsm, storage]
    question: |
      Cassandra's write path is fast largely because its storage engine is based on which
      structure?
    options:
      - "A single shared B+tree updated in place"
      - "A write-ahead heap file scanned linearly on read"
      - "An in-memory-only hash table with no durability"
      - "An LSM-tree: memtable plus immutable SSTables merged by compaction"
    answer: 3
    explanation: |
      Cassandra uses an LSM-tree design: writes hit a commit log and an in-memory memtable,
      which is flushed to immutable SSTables; background compaction merges SSTables. Writes
      are append-only and very fast; reads may merge several SSTables.
    ref: "concepts.md#wide-column-stores-cassandra-hbase-bigtable"

  - id: nosql-databases-data-models-016
    difficulty: intermediate
    tags: [cassandra, allow-filtering, anti-pattern]
    question: |
      A Cassandra query only filters on a non-key column and the driver reports it needs
      `ALLOW FILTERING`. What does this indicate?
    options:
      - "The query will scan across the cluster and gets slower as the cluster grows — a modeling smell"
      - "The query is optimal and uses a covering index"
      - "Cassandra will automatically create a global secondary index to speed it up"
      - "The query is rejected because Cassandra never scans multiple partitions"
    answer: 0
    explanation: |
      ALLOW FILTERING means the query does not restrict the partition key, forcing a
      cluster-wide scan whose cost grows with the cluster. It is an anti-pattern: the fix is
      to model a query-specific table or materialized view keyed for that access pattern.
    ref: "concepts.md#wide-column-stores-cassandra-hbase-bigtable"

  - id: nosql-databases-data-models-017
    difficulty: intermediate
    tags: [graph, index-free-adjacency]
    question: |
      What is "index-free adjacency" in a native graph database?
    options:
      - "Edges are stored in a global B-tree index scanned per traversal"
      - "The database has no indexes of any kind"
      - "Adjacency lists are recomputed from a join table at query time"
      - "Each node holds direct pointers to its neighbors, so traversing an edge is O(1) regardless of total graph size"
    answer: 3
    explanation: |
      Index-free adjacency means each node physically references its neighbors, so hopping
      an edge is a constant-time pointer follow independent of how big the graph is. This is
      why deep traversals are cheap versus repeated joins in a relational store.
    ref: "concepts.md#graph-databases-neo4j-and-traversals"

  - id: nosql-databases-data-models-018
    difficulty: beginner
    tags: [graph, query-language, cypher]
    question: |
      Which query language is associated with Neo4j (and openCypher / Neptune)?
    options:
      - "CQL"
      - "N1QL"
      - "Cypher"
      - "AQL"
    answer: 2
    explanation: |
      Cypher is Neo4j's pattern-matching graph query language (also openCypher, supported by
      Neptune). Gremlin (TinkerPop) is the other major graph language. CQL is Cassandra,
      N1QL is Couchbase, AQL is ArangoDB.
    ref: "concepts.md#graph-databases-neo4j-and-traversals"

  - id: nosql-databases-data-models-019
    difficulty: advanced
    tags: [graph, trade-offs, sharding]
    question: |
      What is a commonly cited operational trade-off of graph databases at scale?
    options:
      - "They cannot store properties on nodes or edges"
      - "They only support single-hop queries"
      - "Graphs are hard to shard cleanly because edges cross partitions"
      - "They cannot enforce any consistency guarantees"
    answer: 2
    explanation: |
      Graphs partition poorly: any partitioning cuts edges, so cross-partition traversals
      become expensive network hops. This is why graph DBs are often run on fewer, larger
      nodes and are overkill when relationships are shallow.
    ref: "concepts.md#graph-databases-neo4j-and-traversals"

  - id: nosql-databases-data-models-020
    difficulty: beginner
    tags: [modeling, embedding, referencing]
    question: |
      In document modeling, when is embedding (nesting related data in one document)
      generally preferred over referencing?
    options:
      - "When the child data is unbounded and shared across many parents"
      - "When the relationship is many-to-many"
      - "When the child data is bounded, owned by, and read together with the parent"
      - "When the referenced entity is large and changes independently"
    answer: 2
    explanation: |
      Embed for one-to-few: bounded child data that is owned by and read with the parent
      (order + its line items). This gives single-read/single-write atomicity. Reference for
      one-to-many, many-to-many, or large/shared entities.
    ref: "concepts.md#aggregate-oriented-modeling-embedding-vs-referencing"

  - id: nosql-databases-data-models-021
    difficulty: intermediate
    tags: [modeling, referencing, unbounded]
    question: |
      A blog post can accumulate millions of comments. Should comments be embedded in the
      post document or referenced, and why?
    options:
      - "Embed them, because a single read is always better regardless of size"
      - "Embed them, because MongoDB has no document size limit"
      - "Reference them, because an unbounded array would eventually exceed the 16 MB document limit"
      - "Reference them, because embedding is impossible for arrays"
    answer: 2
    explanation: |
      Comments are unbounded (one-to-many), so embedding them risks blowing the 16 MB
      document cap and makes every post read huge. Store comments in their own collection
      referencing the post id. Embed only bounded one-to-few data.
    ref: "concepts.md#aggregate-oriented-modeling-embedding-vs-referencing"

  - id: nosql-databases-data-models-022
    difficulty: intermediate
    tags: [modeling, denormalization, consistency]
    question: |
      What is the main downside of denormalizing (duplicating) data across many aggregates
      in NoSQL?
    options:
      - "It makes reads require expensive joins"
      - "It violates the 400 KB item limit automatically"
      - "It prevents the use of any secondary indexes"
      - "Updating the duplicated data must touch every copy, requiring a fan-out or accepting staleness"
    answer: 3
    explanation: |
      Denormalization speeds reads by co-locating data, but the same value now lives in many
      places. Updates must fan out to all copies (on write) or you accept temporary
      inconsistency. This update/consistency strategy is the cost you trade for read speed.
    ref: "concepts.md#aggregate-oriented-modeling-embedding-vs-referencing"

  - id: nosql-databases-data-models-023
    difficulty: beginner
    tags: [base, acid, definitions]
    question: |
      In the BASE model, what does the "E" stand for?
    options:
      - "Exactly-once"
      - "Encrypted storage"
      - "Explicit locking"
      - "Eventual consistency"
    answer: 3
    explanation: |
      BASE = Basically Available, Soft state, Eventual consistency. Eventual consistency
      means replicas converge to the same value once writes stop, though a read right after
      a write may be stale.
    ref: "concepts.md#base-vs-acid-and-eventual-consistency"

  - id: nosql-databases-data-models-024
    difficulty: intermediate
    tags: [eventual-consistency, definition]
    question: |
      Which statement best describes eventual consistency?
    options:
      - "Every read is guaranteed to return the most recent committed write"
      - "Writes are discarded unless all replicas are online"
      - "After writes stop, all replicas converge, but a read right after a write may be stale"
      - "Reads and writes are serialized through a single global lock"
    answer: 2
    explanation: |
      Eventual consistency guarantees convergence: if no new writes are made, all replicas
      eventually agree. It does not guarantee that an immediate read sees the latest write —
      that is strong/linearizable consistency.
    ref: "concepts.md#base-vs-acid-and-eventual-consistency"

  - id: nosql-databases-data-models-025
    difficulty: intermediate
    tags: [dynamodb, consistency, reads]
    question: |
      By default, DynamoDB reads are which kind, and what is the alternative?
    options:
      - "Strongly consistent by default; eventually consistent reads are an opt-in for lower cost"
      - "Linearizable across all regions by default"
      - "Eventually consistent by default; strongly consistent reads are an opt-in (ConsistentRead=true) at higher cost"
      - "Reads always block until all replicas in all regions ack"
    answer: 2
    explanation: |
      DynamoDB reads are eventually consistent by default (cheaper, lower latency). You can
      request a strongly consistent read per operation with ConsistentRead=true, which costs
      about 2x and only applies within a single region.
    ref: "concepts.md#base-vs-acid-and-eventual-consistency"

  - id: nosql-databases-data-models-026
    difficulty: advanced
    tags: [acid, nosql, transactions, misconception]
    question: |
      Which statement about ACID in modern NoSQL databases is most accurate?
    options:
      - "NoSQL databases never provide any atomicity guarantees"
      - "All NoSQL databases are fully linearizable by default"
      - "ACID is only available if you disable replication"
      - "Single-item/single-document writes are atomic, and several stores add limited multi-item transactions; what is lost at scale is cheap cross-partition transactions and joins"
    answer: 3
    explanation: |
      "NoSQL = no ACID" is outdated. Single-row/single-document writes are atomic in
      MongoDB, DynamoDB, and Cassandra; MongoDB has multi-document transactions and DynamoDB
      has TransactWriteItems (up to 100 items). The real cost at scale is cheap
      cross-partition transactions and joins, not atomicity itself.
    ref: "concepts.md#base-vs-acid-and-eventual-consistency"

  - id: nosql-databases-data-models-027
    difficulty: intermediate
    tags: [quorum, consistency, r-w-n]
    question: |
      With replication factor N=3, which quorum setting guarantees a read observes the
      latest acknowledged write while still tolerating one node being down?
    options:
      - "W=2, R=2"
      - "W=1, R=1"
      - "W=1, R=3"
      - "W=3, R=1"
    answer: 0
    explanation: |
      R + W > N guarantees the read and write replica sets overlap. With N=3, W=2 and R=2
      gives 4 > 3, so a read sees the latest write, and the system still works with one node
      down. W=1,R=1 gives 2 which is not > 3 (eventual only); W=3 or R=3 cannot tolerate a
      node loss.
    ref: "concepts.md#consistency-tunables-quorums-r--w--n-readwrite-concern"

  - id: nosql-databases-data-models-028
    difficulty: intermediate
    tags: [quorum, r-w-n, theory]
    question: |
      What does the inequality R + W > N guarantee in a Dynamo-style quorum system?
    options:
      - "That writes are strictly faster than reads"
      - "That the system is fully linearizable under all failures"
      - "That the read and write replica sets overlap by at least one node, so a read sees the latest acknowledged write"
      - "That no node can ever be unavailable"
    answer: 2
    explanation: |
      If R + W > N, the set of replicas a read contacts and the set a write updated must
      share at least one node, so the read observes the most recent acknowledged write. Note
      this overlap is not full linearizability — plain quorums lack leader-based ordering.
    ref: "concepts.md#consistency-tunables-quorums-r--w--n-readwrite-concern"

  - id: nosql-databases-data-models-029
    difficulty: intermediate
    tags: [cassandra, consistency-level, multi-dc]
    question: |
      In a multi-datacenter Cassandra deployment, which consistency level gives quorum
      strength within the local DC without paying cross-DC latency?
    options:
      - "ONE"
      - "EACH_QUORUM"
      - "LOCAL_QUORUM"
      - "ALL"
    answer: 2
    explanation: |
      LOCAL_QUORUM requires a quorum of replicas within the local datacenter, giving strong
      consistency there without waiting on remote DCs. EACH_QUORUM needs a quorum in every
      DC (higher latency); ALL needs all replicas; ONE is weakest.
    ref: "concepts.md#consistency-tunables-quorums-r--w--n-readwrite-concern"

  - id: nosql-databases-data-models-030
    difficulty: intermediate
    tags: [mongodb, write-concern, default]
    question: |
      Since MongoDB 5.0, what is the default write concern, and what does it require?
    options:
      - "`w:1` — acknowledgment from the primary only"
      - "`w:\"majority\"` — acknowledgment from a majority of replica-set members"
      - "`w:0` — fire-and-forget, no acknowledgment"
      - "`w:\"all\"` — acknowledgment from every member including arbiters"
    answer: 1
    explanation: |
      Since MongoDB 5.0 the implicit default write concern is w:"majority" (with a P-S-A
      edge case that falls back to w:1). Majority acknowledgment survives failover because
      the write is durable on a majority of members.
    ref: "concepts.md#consistency-tunables-quorums-r--w--n-readwrite-concern"

  - id: nosql-databases-data-models-031
    difficulty: advanced
    tags: [quorum, linearizability, gotcha]
    question: |
      A candidate claims "R + W > N makes Dynamo-style quorums fully linearizable." Why is
      this imprecise?
    options:
      - "Because quorums always sacrifice durability"
      - "Because R + W > N actually reduces consistency"
      - "Because plain quorums guarantee read/write set overlap but lack the leader-based ordering of Paxos/Raft, so concurrent writes and edge cases can still violate linearizability"
      - "Because linearizability requires R + W < N"
    answer: 2
    explanation: |
      Quorum overlap ensures a read sees a recent acknowledged write, but sloppy quorums,
      concurrent writes, read-repair timing, and lack of a total order (no consensus leader)
      mean plain Dynamo-style quorums are not strictly linearizable. That needs consensus
      (Paxos/Raft) or extra coordination.
    ref: "concepts.md#consistency-tunables-quorums-r--w--n-readwrite-concern"

  - id: nosql-databases-data-models-032
    difficulty: beginner
    tags: [partition-key, sharding]
    question: |
      In a horizontally-sharded NoSQL store, what does the partition key primarily
      determine?
    options:
      - "Which physical node/partition stores an item (usually via hashing)"
      - "The isolation level of transactions"
      - "The on-disk compression algorithm"
      - "The maximum number of secondary indexes allowed"
    answer: 0
    explanation: |
      The partition key is hashed to select the physical partition/node holding the item.
      A poorly chosen key concentrates data or traffic on one partition (a hot partition),
      which extra capacity cannot fix.
    ref: "concepts.md#partition-key-design-and-hot-partitions"

  - id: nosql-databases-data-models-033
    difficulty: intermediate
    tags: [hot-partition, monotonic-key, time-series]
    question: |
      Why is choosing a monotonically increasing value (like the current date or an
      auto-increment id) as the partition key a classic mistake for high-write workloads?
    options:
      - "It uses too much disk space per item"
      - "All new writes target the newest partition, creating a hot 'tail' while other partitions sit idle"
      - "It makes strong consistency impossible"
      - "It prevents any range queries"
    answer: 1
    explanation: |
      A monotonic partition key funnels every new write into the single newest partition, so
      one node is scalding while the rest of the cluster is idle. Fix with a high-cardinality
      key, bucketing, or write-sharding/salting.
    ref: "concepts.md#partition-key-design-and-hot-partitions"

  - id: nosql-databases-data-models-034
    difficulty: intermediate
    tags: [hot-partition, salting, write-sharding]
    question: |
      A single celebrity user's key overwhelms one partition. Which technique spreads that
      hot key across multiple partitions, at the cost of read scatter-gather?
    options:
      - "Increasing the item's TTL"
      - "Switching to a lower replication factor"
      - "Enabling eventually consistent reads"
      - "Write sharding / salting: append a small random or hashed suffix to the key"
    answer: 3
    explanation: |
      Salting appends a small suffix (e.g. #0..#9) so a hot key fans across N partitions on
      write. Reads must then scatter-gather across the suffixes and merge — trading read
      complexity for write distribution.
    ref: "concepts.md#partition-key-design-and-hot-partitions"

  - id: nosql-databases-data-models-035
    difficulty: intermediate
    tags: [hot-partition, cardinality]
    question: |
      Which partition key is most likely to cause a hot partition?
    options:
      - "A low-cardinality `status` column with only a few distinct values"
      - "An order id"
      - "A user UUID"
      - "A high-cardinality device id combined with a day bucket"
    answer: 0
    explanation: |
      Low-cardinality keys (a handful of status values) funnel most traffic into a few
      partitions, creating hotspots. High-cardinality, evenly distributed keys (UUIDs, order
      ids, device+day composites) spread load well.
    ref: "concepts.md#partition-key-design-and-hot-partitions"

  - id: nosql-databases-data-models-036
    difficulty: intermediate
    tags: [dynamodb, gsi, lsi]
    question: |
      Which statement about DynamoDB Local vs Global Secondary Indexes is correct?
    options:
      - "An LSI can be added at any time; a GSI must be created with the table"
      - "An LSI shares the table's partition key with a different sort key and can be strongly consistent; a GSI has its own partition/sort key, its own capacity, and is eventually consistent"
      - "Both LSIs and GSIs are always strongly consistent"
      - "A GSI shares the base table's throughput capacity"
    answer: 1
    explanation: |
      An LSI keeps the same partition key but a different sort key, must be created with the
      table (max 5), and can be strongly consistent. A GSI has its own partition and sort
      key and its own provisioned capacity, can be added anytime (max 20), and is eventually
      consistent.
    ref: "concepts.md#secondary-indexes-in-nosql"

  - id: nosql-databases-data-models-037
    difficulty: intermediate
    tags: [dynamodb, gsi, consistency, gotcha]
    question: |
      Immediately after writing an item, an application queries a DynamoDB GSI and does not
      find it. What is the most likely explanation?
    options:
      - "GSIs are strongly consistent, so this indicates data corruption"
      - "The base table write silently failed"
      - "GSIs never index new items, only updates"
      - "Writes propagate to a GSI asynchronously, so a read-after-write against a GSI can miss the just-written item"
    answer: 3
    explanation: |
      GSIs are maintained asynchronously and are eventually consistent, so there is a small
      propagation lag between a base-table write and its appearance in the GSI. A
      read-after-write on a GSI may miss the new item briefly.
    ref: "concepts.md#secondary-indexes-in-nosql"

  - id: nosql-databases-data-models-038
    difficulty: advanced
    tags: [cassandra, secondary-index, anti-pattern]
    question: |
      Why is a native Cassandra secondary index on a low-cardinality column considered a
      trap?
    options:
      - "It silently drops rows during compaction"
      - "The index is local per node, so a query on it scatters to every node in the cluster"
      - "It requires the entire table to fit in memory"
      - "Cassandra forbids indexes on non-key columns entirely"
    answer: 1
    explanation: |
      Cassandra secondary indexes are local to each node. Querying by a low-cardinality
      indexed column must contact every node (scatter), which scales poorly. Prefer a
      materialized view or a purpose-built denormalized query table instead.
    ref: "concepts.md#secondary-indexes-in-nosql"

  - id: nosql-databases-data-models-039
    difficulty: intermediate
    tags: [dynamodb, limits, gsi, lsi]
    question: |
      What are the default per-table limits for LSIs and GSIs in DynamoDB?
    options:
      - "Up to 5 LSIs and up to 20 GSIs"
      - "Up to 20 LSIs and up to 5 GSIs"
      - "Unlimited LSIs and up to 10 GSIs"
      - "Up to 1 LSI and up to 1 GSI"
    answer: 0
    explanation: |
      DynamoDB allows up to 5 LSIs per table (defined only at creation) and a default of 20
      GSIs per table. This asymmetry reflects that LSIs share the partition and are storage-
      constrained (10 GB per partition-key value), while GSIs are independent structures.
    ref: "concepts.md#secondary-indexes-in-nosql"

  - id: nosql-databases-data-models-040
    difficulty: beginner
    tags: [cassandra, query-first-modeling]
    question: |
      What is the core principle of query-first modeling in Cassandra?
    options:
      - "Normalize to third normal form, then let the planner optimize joins"
      - "List every query first and create one table per query, denormalizing as needed"
      - "Create one table per entity and join them at query time"
      - "Store everything in a single generic key-value table"
    answer: 1
    explanation: |
      Cassandra has no joins, so you enumerate access patterns up front and build one table
      per query whose partition + clustering keys make that query a single-partition sorted
      read, duplicating data across tables and keeping them in sync on write.
    ref: "concepts.md#cassandra-query-first-modeling-and-wide-rows"

  - id: nosql-databases-data-models-041
    difficulty: advanced
    tags: [cassandra, wide-row, bounded-partitions]
    question: |
      A "wide row" (wide partition) in Cassandra holds many clustering rows sorted for a
      feed. What critical constraint must the design respect?
    options:
      - "Partitions must be kept bounded (well under ~100 MB / ~2 billion cells) via bucketing"
      - "Partitions must contain exactly one clustering row"
      - "Wide rows must be re-sorted by the client on every read"
      - "Wide rows require disabling the commit log"
    answer: 0
    explanation: |
      Wide partitions are the natural shape for feeds/time series, but Cassandra degrades on
      partitions over roughly 100 MB or ~2 billion cells (compaction/repair suffer). Bucket
      the partition key (e.g. add a month) so partitions stay bounded.
    ref: "concepts.md#cassandra-query-first-modeling-and-wide-rows"

  - id: nosql-databases-data-models-042
    difficulty: intermediate
    tags: [cassandra, modeling, tables]
    question: |
      An app needs both "get a message by its id" and "get a conversation's messages
      newest-first." What is the idiomatic Cassandra approach?
    options:
      - "One normalized messages table joined against a conversations table"
      - "Two denormalized tables, one keyed for each query, kept in sync on write"
      - "One table with a secondary index on conversation_id"
      - "A single table scanned with ALLOW FILTERING for both queries"
    answer: 1
    explanation: |
      Query-first modeling means one table per access pattern: a messages_by_id table
      (partition by message_id) and a messages_by_conversation table (partition by
      conversation, clustered by time). You duplicate the data and keep both current on
      write — joins and ALLOW FILTERING are avoided.
    ref: "concepts.md#cassandra-query-first-modeling-and-wide-rows"

  - id: nosql-databases-data-models-043
    difficulty: intermediate
    tags: [dynamodb, single-table-design]
    question: |
      What is the primary motivation for DynamoDB single-table design?
    options:
      - "To enforce a strict relational schema across entity types"
      - "To co-locate related entity types under a shared partition key so common access patterns are satisfied in one Query, since DynamoDB has no joins"
      - "To reduce the item size limit below 400 KB"
      - "To enable ad-hoc analytical queries directly on the table"
    answer: 1
    explanation: |
      DynamoDB has no joins and charges per request. Single-table design overloads the
      PK/SK to store multiple entity types together so related items share a partition and a
      single Query (e.g. PK=USER#42, begins_with(SK,"ORDER#")) returns them in one
      round-trip.
    ref: "concepts.md#dynamodb-single-table-design"

  - id: nosql-databases-data-models-044
    difficulty: advanced
    tags: [dynamodb, single-table-design, trade-offs]
    question: |
      Which is a genuine downside of DynamoDB single-table design?
    options:
      - "It automatically enables strong consistency on all reads"
      - "It makes single-item reads slower than multi-table designs"
      - "It removes the need for any secondary indexes"
      - "It demands knowing all access patterns up front; new patterns often require a new GSI or backfill, and keys are opaque and hard to read"
    answer: 3
    explanation: |
      Single-table design is query-first: you must know every access pattern in advance,
      the overloaded keys are opaque to newcomers, and adding an unforeseen pattern usually
      means a new GSI or a data backfill. Analytics are impractical directly on the table.
    ref: "concepts.md#dynamodb-single-table-design"

  - id: nosql-databases-data-models-045
    difficulty: intermediate
    tags: [dynamodb, single-table-design, keys]
    question: |
      In single-table design, storing items like `PK=USER#42, SK=PROFILE` and
      `PK=USER#42, SK=ORDER#1001` enables what?
    options:
      - "A relational JOIN between users and orders"
      - "Automatic cross-region replication of the user's data"
      - "Fetching a user's profile and all their orders in one Query on PK=USER#42, using begins_with on the SK to filter by type"
      - "Enforcing a foreign-key constraint between profile and orders"
    answer: 2
    explanation: |
      Overloading the PK/SK co-locates a user's profile and orders in one partition. A
      single Query on PK=USER#42 (optionally begins_with(SK,"ORDER#")) returns them together
      in one request — the join-free equivalent of related-row access.
    ref: "concepts.md#dynamodb-single-table-design"

  - id: nosql-databases-data-models-046
    difficulty: intermediate
    tags: [when-not-to-use, relational, judgment]
    question: |
      Which requirement most strongly argues for a relational database over a distributed
      NoSQL store?
    options:
      - "Simple lookups by a single known key at massive scale"
      - "Append-heavy time-series writes queried by a partition key"
      - "Ad-hoc, unpredictable queries with multi-table joins and engine-enforced referential integrity"
      - "Storing large opaque session blobs with a TTL"
    answer: 2
    explanation: |
      Ad-hoc queries, joins, and engine-enforced constraints (foreign keys, uniqueness) are
      relational strengths and NoSQL weaknesses. The other options are precisely what
      key-value/wide-column stores do best.
    ref: "concepts.md#when-nosql-is-the-wrong-choice"

  - id: nosql-databases-data-models-047
    difficulty: intermediate
    tags: [when-not-to-use, postgres, jsonb]
    question: |
      A team says "we need flexible schema, so we must use a NoSQL document store." What is
      the strongest counterpoint?
    options:
      - "Flexible schema is impossible in any relational database"
      - "Document stores cannot store JSON"
      - "PostgreSQL offers JSONB (document-style storage with indexing), so flexible schema alone is not a reason to give up joins, transactions, and constraints"
      - "NoSQL always outperforms relational for every workload"
    answer: 2
    explanation: |
      Modern PostgreSQL supports JSONB with GIN indexing, giving document-style flexibility
      while keeping joins, ACID transactions, and constraints. "Flexible schema" alone does
      not justify abandoning relational; choose NoSQL for a specific access-pattern/scale
      reason.
    ref: "concepts.md#when-nosql-is-the-wrong-choice"

  - id: nosql-databases-data-models-048
    difficulty: advanced
    tags: [when-not-to-use, transactions, anti-pattern]
    question: |
      A payments system needs to atomically debit one account, credit another, and append a
      ledger entry with strong consistency. Why is a typical distributed NoSQL store a poor
      fit?
    options:
      - "NoSQL cannot store monetary values"
      - "NoSQL cannot achieve single-digit-millisecond latency"
      - "Multi-entity ACID transactions with strong consistency are limited/costly in distributed NoSQL (e.g. DynamoDB caps transactions at 100 items), whereas relational ACID handles this natively"
      - "NoSQL forbids more than one write per second"
    answer: 2
    explanation: |
      Cross-entity, strongly-consistent transactions are exactly what relational engines do
      well. Distributed NoSQL offers only limited transactions (DynamoDB TransactWriteItems
      is all-or-nothing but capped at 100 items) and cross-partition coordination is costly,
      making it a poor default for core financial transactions.
    ref: "concepts.md#when-nosql-is-the-wrong-choice"

  - id: nosql-databases-data-models-049
    difficulty: beginner
    tags: [multi-model, definition]
    question: |
      What is a multi-model database?
    options:
      - "A database that runs on multiple physical machines"
      - "A database that can only be queried with machine-learning models"
      - "A single engine that supports more than one data model (e.g. document, key-value, graph) over one system"
      - "A relational database with more than one schema"
    answer: 2
    explanation: |
      A multi-model database supports several data models (document, key-value, graph,
      relational, etc.) over a single engine/interface, reducing the need to run and sync
      multiple specialized stores. ArangoDB and Cosmos DB are examples.
    ref: "concepts.md#multi-model-databases"

  - id: nosql-databases-data-models-050
    difficulty: intermediate
    tags: [multi-model, trade-offs]
    question: |
      What is the key trade-off when choosing a multi-model database over several
      specialized stores?
    options:
      - "Multi-model databases cannot be queried at all"
      - "Specialized stores are always cheaper and simpler to operate"
      - "Multi-model databases only support the key-value model"
      - "Multi-model reduces operational sprawl and data duplication, but a purpose-built engine usually beats a generalist on peak performance for its model"
    answer: 3
    explanation: |
      Multi-model is a consolidation/simplicity play: fewer systems to run and sync. But a
      dedicated engine (Neo4j for deep graph traversal, Cassandra for write-heavy
      wide-column) typically outperforms a generalist on its home turf. Choose based on
      whether specialized peak performance is required.
    ref: "concepts.md#multi-model-databases"

  - id: nosql-databases-data-models-051
    difficulty: intermediate
    tags: [multi-model, postgres]
    question: |
      Why is PostgreSQL sometimes described as "multi-model by extension"?
    options:
      - "Because it drops relational features when extensions are installed"
      - "Because extensions/features add JSONB (document), hstore (key-value), PostGIS (geo), and pgvector (vectors) on top of the relational core"
      - "Because it can only store one model at a time"
      - "Because it is actually a graph database internally"
    answer: 1
    explanation: |
      PostgreSQL's relational core plus JSONB, hstore, PostGIS, pgvector, and recursive
      CTEs/ltree lets it serve document, key-value, geospatial, vector, and hierarchical
      models, so it is often called multi-model by extension.
    ref: "concepts.md#multi-model-databases"

  - id: nosql-databases-data-models-052
    difficulty: beginner
    tags: [families, document, examples]
    question: |
      Which of these is a document database?
    options:
      - "Neo4j"
      - "MongoDB"
      - "Cassandra"
      - "Memcached"
    answer: 1
    explanation: |
      MongoDB is the canonical document store (JSON/BSON documents). Neo4j is a graph
      database, Cassandra is wide-column, and Memcached is a pure key-value cache.
    ref: "concepts.md#the-four-nosql-families-and-when-each-fits"

  - id: nosql-databases-data-models-053
    difficulty: intermediate
    tags: [mongodb, indexes, capabilities]
    question: |
      Compared with other NoSQL families, MongoDB's secondary indexing is notable because
      it supports which capabilities?
    options:
      - "Only a single index on the _id field"
      - "Compound, multikey (array), text, geospatial, partial, and TTL B-tree indexes"
      - "Indexes that must be defined at collection-creation time only"
      - "No indexes on nested document fields"
    answer: 1
    explanation: |
      MongoDB has rich B-tree secondary indexes: compound, multikey (indexing array
      elements), text, geospatial, partial, and TTL — including on nested fields. This is
      the closest to relational indexing among NoSQL families.
    ref: "concepts.md#secondary-indexes-in-nosql"

  - id: nosql-databases-data-models-054
    difficulty: advanced
    tags: [cassandra, architecture, masterless]
    question: |
      Which statement about Cassandra's cluster architecture is correct?
    options:
      - "It uses a single primary node that coordinates all writes"
      - "It is masterless/peer-to-peer using consistent hashing, giving linear write scalability and no single point of failure"
      - "It stores all data on one coordinator and replicas are read-only mirrors"
      - "It requires ZooKeeper to elect a write leader for every partition"
    answer: 1
    explanation: |
      Cassandra is masterless: every node is a peer arranged on a consistent-hashing ring,
      any node can coordinate a request, and there is no single point of failure. This
      contrasts with HBase/Bigtable's coordinator + region/tablet-server model.
    ref: "concepts.md#wide-column-stores-cassandra-hbase-bigtable"

  - id: nosql-databases-data-models-055
    difficulty: intermediate
    tags: [cap, pacelc, consistency]
    question: |
      According to PACELC, what trade-off exists even when there is no network partition?
    options:
      - "You must choose between durability and atomicity"
      - "You trade latency against consistency (lower latency often means weaker consistency)"
      - "You must choose between reads and writes"
      - "There is no trade-off without a partition"
    answer: 1
    explanation: |
      PACELC extends CAP: during a Partition, choose Availability or Consistency; Else (no
      partition), choose Latency or Consistency. Even in normal operation, stronger
      consistency (e.g. majority quorums) costs latency.
    ref: "concepts.md#base-vs-acid-and-eventual-consistency"
