topic: SQL Query Language & Advanced Queries
domain: messaging-databases
topic_slug: sql-query-language-advanced-queries
version: 1
questions:
  - id: sql-query-language-advanced-queries-001
    difficulty: beginner
    tags:
      - logical-order
      - select
    question: |
      In SQL's logical query processing order, which clause is evaluated FIRST?
    options:
      - FROM / JOIN
      - SELECT
      - WHERE
      - ORDER BY
    answer: 0
    explanation: |
      The logical order is FROM/JOIN -> WHERE -> GROUP BY -> HAVING -> SELECT ->
      DISTINCT -> ORDER BY -> LIMIT. FROM/JOIN builds the working set of rows first;
      everything else operates on that set.
    ref: concepts.md#logical-query-processing-order
  - id: sql-query-language-advanced-queries-002
    difficulty: intermediate
    tags:
      - logical-order
      - alias
    question: |
      Why does `SELECT price * 1.1 AS gross FROM items WHERE gross > 100` raise an
      error in standard SQL?
    options:
      - Arithmetic is not allowed in a SELECT list
      - Aliases must be quoted with double quotes
      - gross is a reserved keyword
      - WHERE is evaluated before SELECT, so the alias 'gross' does not yet exist
    answer: 3
    explanation: |
      SELECT (where the alias is defined) runs logically AFTER WHERE. So WHERE cannot see
      the alias. Repeat the expression, or wrap it in a subquery/CTE.
    ref: concepts.md#logical-query-processing-order
  - id: sql-query-language-advanced-queries-003
    difficulty: intermediate
    tags:
      - logical-order
      - limit
      - determinism
    question: |
      A query uses `LIMIT 10` with no `ORDER BY`. What is guaranteed about the rows
      returned?
    options:
      - The 10 most recently inserted rows
      - The 10 rows with the smallest primary key
      - An arbitrary, non-deterministic subset that may change between runs
      - The first 10 rows in physical disk order, always stable
    answer: 2
    explanation: |
      Without ORDER BY, row order is undefined. LIMIT then slices an arbitrary set, and the
      chosen rows can differ across executions or plan changes. Always pair LIMIT with a
      deterministic ORDER BY for stable results.
    ref: concepts.md#logical-query-processing-order
  - id: sql-query-language-advanced-queries-004
    difficulty: beginner
    tags:
      - logical-order
      - having
      - where
    question: |
      Which clause can reference an aggregate function like `SUM(amount)` in its predicate?
    options:
      - WHERE
      - HAVING
      - FROM
      - JOIN ... ON
    answer: 1
    explanation: |
      HAVING filters groups after aggregation, so it can reference aggregates. WHERE runs
      before GROUP BY and operates on individual rows, so `WHERE SUM(...) > x` is illegal.
    ref: concepts.md#logical-query-processing-order
  - id: sql-query-language-advanced-queries-005
    difficulty: intermediate
    tags:
      - logical-order
      - order-by
      - alias
    question: |
      In which clause is a SELECT-list column alias reliably usable across PostgreSQL,
      MySQL, and SQL Server?
    options:
      - ORDER BY
      - WHERE
      - GROUP BY
      - JOIN ... ON
    answer: 0
    explanation: |
      ORDER BY runs logically after SELECT, so the alias exists by then and is portable.
      Alias use in WHERE is never allowed; some engines allow it in GROUP BY/HAVING as a
      non-standard extension.
    ref: concepts.md#logical-query-processing-order
  - id: sql-query-language-advanced-queries-006
    difficulty: beginner
    tags:
      - joins
      - inner
    question: |
      An INNER JOIN between A and B on a predicate returns which rows?
    options:
      - All rows of A, with NULLs where B has no match
      - Every combination of A rows with B rows
      - All rows of B, with NULLs where A has no match
      - Only rows where the predicate matches in both A and B
    answer: 3
    explanation: |
      INNER JOIN keeps only rows that satisfy the join predicate on both sides. Unmatched
      rows from either table are dropped.
    ref: concepts.md#join-types-and-result-semantics
  - id: sql-query-language-advanced-queries-007
    difficulty: advanced
    tags:
      - joins
      - left-join
      - on-vs-where
    question: |
      You wrote `FROM customers c LEFT JOIN orders o ON o.customer_id = c.id
      WHERE o.status = 'paid'` and customers with no orders disappeared. Why?
    options:
      - LEFT JOIN silently became a CROSS JOIN
      - customers with no orders were never in the table
      - The WHERE predicate on o.status rejects NULL-extended rows, turning the outer join into an inner
        join
      - LEFT JOIN requires an index on customer_id or it drops unmatched rows
    answer: 2
    explanation: |
      For unmatched customers, o.status is NULL, so `o.status = 'paid'` is UNKNOWN and the
      row is filtered out by WHERE. Move the condition into the ON clause to preserve the
      outer-join semantics.
    ref: concepts.md#join-types-and-result-semantics
  - id: sql-query-language-advanced-queries-008
    difficulty: intermediate
    tags:
      - joins
      - cross-join
    question: |
      A CROSS JOIN of a 100-row table and a 50-row table produces how many rows?
    options:
      - '150'
      - '5000'
      - '50'
      - '100'
    answer: 1
    explanation: |
      A CROSS JOIN is the Cartesian product: every left row paired with every right row,
      so 100 x 50 = 5000 rows. There is no join predicate.
    ref: concepts.md#join-types-and-result-semantics
  - id: sql-query-language-advanced-queries-009
    difficulty: intermediate
    tags:
      - joins
      - self-join
    question: |
      To list each employee alongside their manager's name from a single `employees`
      table with a `manager_id` column, you should use:
    options:
      - 'A self join: FROM employees e JOIN employees m ON e.manager_id = m.id'
      - A UNION of employees with itself
      - A CROSS JOIN of employees with employees
      - A recursive CTE (the only way)
    answer: 0
    explanation: |
      A self join references the same table twice under different aliases. Here e is the
      employee and m is the manager, joined on e.manager_id = m.id. Recursion is only
      needed for multi-level hierarchy traversal.
    ref: concepts.md#join-types-and-result-semantics
  - id: sql-query-language-advanced-queries-010
    difficulty: advanced
    tags:
      - joins
      - natural-join
      - gotcha
    question: |
      Why is `NATURAL JOIN` discouraged in production schemas?
    options:
      - It is not part of the SQL standard
      - It always produces a Cartesian product
      - It cannot use indexes
      - It joins on all identically named columns, so adding a column later can silently change the join
    answer: 3
    explanation: |
      NATURAL JOIN implicitly joins on every column that shares a name. If a schema change
      later introduces another common column name (e.g. created_at), the join predicate
      silently changes and results break. Explicit ON/USING is safer.
    ref: concepts.md#join-types-and-result-semantics
  - id: sql-query-language-advanced-queries-011
    difficulty: intermediate
    tags:
      - joins
      - anti-join
      - null
    question: |
      What is the correct, NULL-safe way to find customers that have NO matching orders?
    options:
      - INNER JOIN orders and check id IS NULL
      - customers WHERE id NOT IN (SELECT customer_id FROM orders)
      - LEFT JOIN orders o ON o.customer_id = c.id WHERE o.id IS NULL (or NOT EXISTS)
      - CROSS JOIN orders WHERE customer_id IS NULL
    answer: 2
    explanation: |
      A LEFT JOIN keeping only rows where the right key is NULL is a classic anti-join;
      NOT EXISTS is equivalent and NULL-safe. NOT IN is dangerous because a single NULL in
      the subquery makes it return no rows.
    ref: concepts.md#join-types-and-result-semantics
  - id: sql-query-language-advanced-queries-012
    difficulty: beginner
    tags:
      - aggregates
      - count
    question: |
      What is the difference between `COUNT(*)` and `COUNT(email)`?
    options:
      - They are always identical
      - COUNT(*) counts all rows; COUNT(email) counts only rows where email is not NULL
      - COUNT(*) counts distinct rows; COUNT(email) counts all rows
      - COUNT(*) ignores NULLs; COUNT(email) includes NULLs
    answer: 1
    explanation: |
      COUNT(*) counts rows regardless of NULLs. COUNT(col) counts only non-NULL values of
      that column. They diverge whenever the column contains NULLs.
    ref: concepts.md#aggregation-with-group-by-and-having
  - id: sql-query-language-advanced-queries-013
    difficulty: intermediate
    tags:
      - aggregates
      - avg
      - null
    question: |
      A column `score` has values [10, 20, NULL, NULL]. What does `AVG(score)` return?
    options:
      - 15 (divides by the 2 non-NULL values)
      - 7.5 (divides by 4 rows)
      - 'NULL'
      - '0'
    answer: 0
    explanation: |
      Aggregates (except COUNT(*)) ignore NULLs. AVG sums the non-NULL values (30) and
      divides by the count of non-NULL values (2) = 15, not by the total row count.
    ref: concepts.md#aggregation-with-group-by-and-having
  - id: sql-query-language-advanced-queries-014
    difficulty: intermediate
    tags:
      - aggregates
      - empty-set
    question: |
      Running `SELECT SUM(amount), COUNT(*) FROM orders WHERE 1=0` (no rows match) returns:
    options:
      - 0 and 0
      - NULL and NULL
      - An error (aggregate over empty set)
      - NULL and 0
    answer: 3
    explanation: |
      Over an empty set, COUNT(*) returns 0 but SUM (and AVG/MIN/MAX) return NULL. Use
      COALESCE(SUM(amount), 0) if you need a numeric zero.
    ref: concepts.md#aggregation-with-group-by-and-having
  - id: sql-query-language-advanced-queries-015
    difficulty: intermediate
    tags:
      - aggregates
      - where-vs-having
    question: |
      For best performance, where should you put a filter on a raw column (e.g.
      status = 'paid') before aggregating?
    options:
      - In HAVING, because it runs after grouping
      - It makes no difference which clause you use
      - In WHERE, so rows are filtered before GROUP BY and fewer rows are aggregated
      - In the ORDER BY clause
    answer: 2
    explanation: |
      WHERE filters rows before grouping, so the aggregation processes fewer rows. HAVING
      is for predicates on aggregate results; using it for a raw-column filter needlessly
      aggregates rows you will discard.
    ref: concepts.md#aggregation-with-group-by-and-having
  - id: sql-query-language-advanced-queries-016
    difficulty: advanced
    tags:
      - aggregates
      - only-full-group-by
      - mysql
    question: |
      Which statement about MySQL's `ONLY_FULL_GROUP_BY` (default since 5.7.5) is correct?
    options:
      - It disables GROUP BY entirely
      - It requires every non-aggregated SELECT column to appear in GROUP BY, matching standard SQL
      - It forces all aggregates to ignore NULLs
      - It is a PostgreSQL-only setting
    answer: 1
    explanation: |
      Historically MySQL let you SELECT bare columns not in GROUP BY and returned an
      arbitrary value. ONLY_FULL_GROUP_BY enforces the standard rule that non-aggregated
      columns must be grouped (or functionally dependent on grouped keys).
    ref: concepts.md#aggregation-with-group-by-and-having
  - id: sql-query-language-advanced-queries-017
    difficulty: intermediate
    tags:
      - aggregates
      - filter
      - conditional
    question: |
      Which expression counts only paid orders per customer as a separate column alongside
      total orders?
    options:
      - COUNT(*) FILTER (WHERE status = 'paid')  -- or SUM(CASE WHEN status='paid' THEN 1 ELSE 0 END)
      - COUNT(*) WHERE status = 'paid'
      - COUNT(status = 'paid')
      - HAVING status = 'paid'
    answer: 0
    explanation: |
      The SQL-standard FILTER clause (PostgreSQL) restricts an aggregate to matching rows.
      Portable equivalent is SUM(CASE WHEN ... THEN 1 ELSE 0 END). You cannot attach a bare
      WHERE to a single aggregate.
    ref: concepts.md#aggregation-with-group-by-and-having
  - id: sql-query-language-advanced-queries-018
    difficulty: intermediate
    tags:
      - subqueries
      - scalar
    question: |
      A scalar subquery used as a column value returns more than one row at runtime. What
      happens?
    options:
      - It returns the first row
      - It returns NULL
      - It returns a comma-separated list
      - The query raises a runtime error
    answer: 3
    explanation: |
      A scalar subquery must yield at most one row and one column. Zero rows yields NULL,
      but more than one row is a runtime error. Use aggregation or LIMIT 1 with ORDER BY to
      guarantee a single row.
    ref: concepts.md#subqueries-scalar-correlated-and-exists-vs-in
  - id: sql-query-language-advanced-queries-019
    difficulty: advanced
    tags:
      - subqueries
      - not-in
      - null
    question: |
      `SELECT * FROM customers WHERE id NOT IN (SELECT customer_id FROM orders)` returns
      zero rows even though many customers have no orders. The most likely cause is:
    options:
      - orders is empty
      - NOT IN is not valid SQL
      - At least one row in orders has a NULL customer_id, making the NOT IN predicate UNKNOWN for every
        customer
      - customers has a NULL primary key
    answer: 2
    explanation: |
      NOT IN with a subquery containing a NULL expands to `id <> v1 AND id <> NULL AND ...`,
      and `id <> NULL` is UNKNOWN, so the whole predicate is never TRUE. Use NOT EXISTS,
      which is NULL-safe.
    ref: concepts.md#subqueries-scalar-correlated-and-exists-vs-in
  - id: sql-query-language-advanced-queries-020
    difficulty: intermediate
    tags:
      - subqueries
      - exists
      - correlated
    question: |
      Why is `EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id)` often efficient?
    options:
      - It caches the entire orders table in memory
      - It can short-circuit and stop scanning as soon as the first matching row is found
      - It never uses an index
      - It automatically deduplicates the outer query
    answer: 1
    explanation: |
      EXISTS only tests for the presence of at least one matching row, so the engine can
      stop at the first match. It is also NULL-safe, unlike IN.
    ref: concepts.md#subqueries-scalar-correlated-and-exists-vs-in
  - id: sql-query-language-advanced-queries-021
    difficulty: advanced
    tags:
      - subqueries
      - join
      - duplicates
    question: |
      Replacing `WHERE EXISTS (...)` with an INNER JOIN can change results by:
    options:
      - Multiplying outer rows when the join key matches multiple inner rows (a semi-join returns each
        outer row at most once)
      - Filtering out NULL columns
      - Automatically sorting the output
      - Converting the query to a CROSS JOIN
    answer: 0
    explanation: |
      EXISTS is a semi-join: each qualifying outer row appears once. A plain JOIN emits one
      output row per matching inner row, so a one-to-many relationship duplicates outer
      rows unless you add DISTINCT.
    ref: concepts.md#subqueries-scalar-correlated-and-exists-vs-in
  - id: sql-query-language-advanced-queries-022
    difficulty: intermediate
    tags:
      - subqueries
      - derived-table
    question: |
      A subquery used in the FROM clause (a derived table) must:
    options:
      - Be correlated to the outer query
      - Return exactly one row
      - Not contain a GROUP BY
      - Have a table alias in standard SQL / MySQL / PostgreSQL
    answer: 3
    explanation: |
      Derived tables in FROM require an alias in most engines (MySQL and PostgreSQL both
      require one). They may return many rows and can contain grouping, ordering, etc.
    ref: concepts.md#subqueries-scalar-correlated-and-exists-vs-in
  - id: sql-query-language-advanced-queries-023
    difficulty: beginner
    tags:
      - window
      - row-number
    question: |
      What distinguishes a window function from an aggregate with GROUP BY?
    options:
      - Window functions can only be used on numeric columns
      - Window functions cannot use PARTITION BY
      - A window function computes across related rows but preserves every input row (no collapsing)
      - Window functions require a subquery
    answer: 2
    explanation: |
      GROUP BY collapses rows into one per group. A window function computes over a window
      of related rows yet returns a value for every original row, keeping row-level detail.
    ref: concepts.md#window-functions
  - id: sql-query-language-advanced-queries-024
    difficulty: intermediate
    tags:
      - window
      - rank
      - dense-rank
    question: |
      Salaries in a department are [100, 100, 90]. Ordering by salary DESC, what does
      `RANK()` assign versus `DENSE_RANK()` for the row with 90?
    options:
      - RANK gives 2, DENSE_RANK gives 2
      - RANK gives 3, DENSE_RANK gives 2
      - RANK gives 2, DENSE_RANK gives 3
      - Both give 3
    answer: 1
    explanation: |
      The two 100s are tied at rank 1. RANK leaves a gap and gives the next value rank 3;
      DENSE_RANK leaves no gap and gives rank 2. ROW_NUMBER would give unique 1,2,3.
    ref: concepts.md#window-functions
  - id: sql-query-language-advanced-queries-025
    difficulty: intermediate
    tags:
      - window
      - top-n
      - subquery
    question: |
      Which pattern correctly returns the top 3 highest-paid employees per department?
    options:
      - Compute ROW_NUMBER() in a subquery/CTE, then filter WHERE rn <= 3 in the outer query
      - SELECT ... WHERE ROW_NUMBER() OVER (PARTITION BY dept ORDER BY salary DESC) <= 3
      - SELECT ... GROUP BY dept HAVING salary IN (top 3)
      - SELECT TOP 3 ... GROUP BY dept
    answer: 0
    explanation: |
      Window functions are computed in the SELECT step, after WHERE, so you cannot filter
      on them directly in WHERE. Compute the ROW_NUMBER in a subquery/CTE and filter on the
      alias in the outer query.
    ref: concepts.md#window-functions
  - id: sql-query-language-advanced-queries-026
    difficulty: intermediate
    tags:
      - window
      - lag
      - lead
    question: |
      To compute each day's revenue change versus the previous day within a partition, you
      would use:
    options:
      - SUM() OVER ()
      - COUNT(*) OVER (ORDER BY day)
      - RANK() OVER (ORDER BY day)
      - revenue - LAG(revenue) OVER (PARTITION BY ... ORDER BY day)
    answer: 3
    explanation: |
      LAG returns the value from the previous row in the ordered partition. Subtracting it
      from the current revenue gives the day-over-day delta. LEAD does the same looking
      forward.
    ref: concepts.md#window-functions
  - id: sql-query-language-advanced-queries-027
    difficulty: advanced
    tags:
      - window
      - frame
      - range-vs-rows
    question: |
      A window has `ORDER BY order_date` but no explicit frame clause. What is the default
      frame, and why can a running SUM behave unexpectedly?
    options:
      - ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW; no peer issue
      - RANGE BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING
      - RANGE BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW; peer rows with equal order values are all included
        together
      - There is no default frame; it errors
    answer: 2
    explanation: |
      With ORDER BY and no frame, the default is RANGE UNBOUNDED PRECEDING to CURRENT ROW.
      RANGE treats rows with equal ORDER BY values as peers and includes them all at once,
      so a running SUM jumps on ties. Use ROWS for a precise physical window.
    ref: concepts.md#window-functions
  - id: sql-query-language-advanced-queries-028
    difficulty: advanced
    tags:
      - window
      - partition-by
      - group-by
    question: |
      What does `AVG(salary) OVER (PARTITION BY department_id)` produce?
    options:
      - One row per department with the average
      - The department average repeated on every employee row, keeping all rows
      - The overall company average on every row
      - An error because AVG requires GROUP BY
    answer: 1
    explanation: |
      PARTITION BY defines the window per department but does not collapse rows. Each
      employee row shows its department's average, preserving row-level detail unlike
      GROUP BY.
    ref: concepts.md#window-functions
  - id: sql-query-language-advanced-queries-029
    difficulty: beginner
    tags:
      - cte
      - with
    question: |
      What is the primary purpose of a Common Table Expression (`WITH` clause)?
    options:
      - To name a subquery so it can be referenced and reused within a single statement, improving readability
      - To create a permanent table
      - To index a query result
      - To enforce a foreign key
    answer: 0
    explanation: |
      A CTE is a named, statement-scoped inline view. It improves readability and lets you
      reference the same subquery multiple times. It is not persisted like a table or view.
    ref: concepts.md#common-table-expressions-and-recursion
  - id: sql-query-language-advanced-queries-030
    difficulty: intermediate
    tags:
      - cte
      - recursive
    question: |
      A recursive CTE (`WITH RECURSIVE`) is composed of which two parts joined by UNION
      [ALL]?
    options:
      - A SELECT and an INSERT
      - Two independent aggregates
      - A WHERE and a HAVING
      - An anchor member (base case) and a recursive member that references the CTE
    answer: 3
    explanation: |
      A recursive CTE has an anchor (non-recursive seed) member, then a recursive member
      that references the CTE name to iterate, combined via UNION or UNION ALL until no new
      rows are produced.
    ref: concepts.md#common-table-expressions-and-recursion
  - id: sql-query-language-advanced-queries-031
    difficulty: advanced
    tags:
      - cte
      - materialization
      - postgres
    question: |
      Regarding PostgreSQL CTE materialization, which statement is accurate?
    options:
      - CTEs are never materialized in any version
      - CTEs always create temporary tables on disk
      - Before v12 a CTE was always an optimization fence (materialized); since v12 a single-reference,
        side-effect-free CTE is inlined by default
      - MATERIALIZED is the only allowed keyword
    answer: 2
    explanation: |
      Historically PostgreSQL materialized every CTE, blocking predicate push-down. Since
      version 12, simple CTEs referenced once are inlined by default; WITH ... AS
      MATERIALIZED / NOT MATERIALIZED override the choice.
    ref: concepts.md#common-table-expressions-and-recursion
  - id: sql-query-language-advanced-queries-032
    difficulty: advanced
    tags:
      - cte
      - recursive
      - cycle
    question: |
      When traversing a graph that may contain cycles with a recursive CTE, which technique
      helps avoid an infinite loop?
    options:
      - Always use UNION ALL and no other guard
      - Use UNION (dedup), a depth counter/LIMIT, or a CYCLE clause / MAXRECURSION option
      - Disable the recursive member
      - Add an ORDER BY to the recursive member
    answer: 1
    explanation: |
      UNION removes already-seen rows (helping on cycles); a depth column with a bound, a
      LIMIT, PostgreSQL's CYCLE clause, or SQL Server's OPTION (MAXRECURSION n) all guard
      against unbounded recursion.
    ref: concepts.md#common-table-expressions-and-recursion
  - id: sql-query-language-advanced-queries-033
    difficulty: beginner
    tags:
      - set-ops
      - union
    question: |
      What is the difference between `UNION` and `UNION ALL`?
    options:
      - UNION removes duplicate rows (implicit DISTINCT); UNION ALL keeps all rows and is faster
      - UNION keeps duplicates; UNION ALL removes them
      - They are identical
      - UNION combines columns horizontally; UNION ALL stacks rows
    answer: 0
    explanation: |
      UNION performs an implicit DISTINCT (sort/hash to deduplicate), which costs extra
      work. UNION ALL simply concatenates, keeping duplicates, and is faster when you know
      duplicates are acceptable or impossible.
    ref: concepts.md#set-operations-union-intersect-except
  - id: sql-query-language-advanced-queries-034
    difficulty: intermediate
    tags:
      - set-ops
      - except
      - minus
    question: |
      Which set operator returns rows in the first query that are NOT in the second, and
      what is its Oracle spelling?
    options:
      - INTERSECT; Oracle calls it DIFF
      - UNION; Oracle calls it MERGE
      - SUBTRACT; Oracle calls it EXCLUDE
      - EXCEPT; Oracle calls it MINUS
    answer: 3
    explanation: |
      EXCEPT returns rows from the first query absent from the second (deduplicated by
      default). Oracle historically spells this operator MINUS.
    ref: concepts.md#set-operations-union-intersect-except
  - id: sql-query-language-advanced-queries-035
    difficulty: intermediate
    tags:
      - set-ops
      - requirements
    question: |
      For `UNION` between two SELECTs to be valid, the queries must have:
    options:
      - Identical table names
      - The same WHERE clause
      - The same number of columns with compatible data types
      - A shared primary key
    answer: 2
    explanation: |
      Set operators combine rows vertically, so both inputs must project the same number of
      columns with type-compatible positions. Output column names come from the first query.
    ref: concepts.md#set-operations-union-intersect-except
  - id: sql-query-language-advanced-queries-036
    difficulty: advanced
    tags:
      - set-ops
      - null
    question: |
      How do set operators (UNION/INTERSECT/EXCEPT) treat two NULL values when matching
      rows for duplicate elimination?
    options:
      - As unequal, like WHERE comparisons
      - As equal, so two all-NULL rows are considered duplicates
      - They raise an error
      - NULLs are always removed from the result
    answer: 1
    explanation: |
      For duplicate/row matching in set operations, NULL is treated as equal to NULL - the
      opposite of WHERE/join equality where NULL = NULL is UNKNOWN. So INTERSECT can match
      NULL rows and UNION collapses duplicate NULL rows.
    ref: concepts.md#set-operations-union-intersect-except
  - id: sql-query-language-advanced-queries-037
    difficulty: beginner
    tags:
      - null
      - three-valued-logic
    question: |
      What is the result of the predicate `NULL = NULL` in SQL?
    options:
      - UNKNOWN
      - 'TRUE'
      - 'FALSE'
      - It raises an error
    answer: 0
    explanation: |
      NULL means unknown, so comparing two unknowns yields UNKNOWN (three-valued logic).
      Use IS NULL / IS NOT NULL or IS [NOT] DISTINCT FROM for NULL-aware comparisons.
    ref: concepts.md#null-and-three-valued-logic
  - id: sql-query-language-advanced-queries-038
    difficulty: intermediate
    tags:
      - null
      - where
      - filtering
    question: |
      When a WHERE predicate evaluates to UNKNOWN for a row, that row is:
    options:
      - Included in the result
      - Converted to NULL and included
      - Duplicated
      - Excluded from the result (only TRUE rows are kept)
    answer: 3
    explanation: |
      WHERE, ON, and HAVING keep only rows where the predicate is TRUE. UNKNOWN (and FALSE)
      rows are discarded. Note CHECK constraints have the opposite polarity: they accept
      UNKNOWN and reject only FALSE.
    ref: concepts.md#null-and-three-valued-logic
  - id: sql-query-language-advanced-queries-039
    difficulty: intermediate
    tags:
      - null
      - coalesce
      - nullif
    question: |
      Which expression safely avoids a division-by-zero error by returning NULL when the
      denominator is zero?
    options:
      - x / COALESCE(y, 0)
      - COALESCE(x / y, 0)
      - x / NULLIF(y, 0)
      - x / ISNULL(y)
    answer: 2
    explanation: |
      NULLIF(y, 0) returns NULL when y = 0, so the division yields NULL instead of raising
      a divide-by-zero error. COALESCE(y, 0) would do the opposite - substitute 0 and cause
      the error.
    ref: concepts.md#null-and-three-valued-logic
  - id: sql-query-language-advanced-queries-040
    difficulty: advanced
    tags:
      - null
      - boolean-logic
    question: |
      In three-valued logic, what does `NULL OR TRUE` evaluate to?
    options:
      - UNKNOWN
      - 'TRUE'
      - 'FALSE'
      - 'NULL'
    answer: 1
    explanation: |
      OR is TRUE if either operand is TRUE, regardless of the other, so NULL OR TRUE = TRUE.
      By contrast NULL AND TRUE = UNKNOWN and NULL OR FALSE = UNKNOWN.
    ref: concepts.md#null-and-three-valued-logic
  - id: sql-query-language-advanced-queries-041
    difficulty: advanced
    tags:
      - null
      - unique-constraint
    question: |
      Regarding NULLs and UNIQUE constraints, which is correct?
    options:
      - Standard SQL/PostgreSQL/MySQL allow multiple NULLs (two NULLs are not equal); SQL Server allows
        only one NULL
      - No database allows NULL in a unique column
      - UNIQUE constraints convert NULL to an empty string
      - NULLs are always rejected by UNIQUE
    answer: 0
    explanation: |
      Because NULL = NULL is UNKNOWN, most engines permit many NULLs in a unique column.
      SQL Server is a notable exception: its unique index treats NULLs as equal and allows
      only one.
    ref: concepts.md#null-and-three-valued-logic
  - id: sql-query-language-advanced-queries-042
    difficulty: beginner
    tags:
      - distinct
    question: |
      What does `SELECT DISTINCT country, city FROM customers` return?
    options:
      - Distinct countries, with any arbitrary city
      - Distinct cities only
      - All rows, unchanged
      - Unique (country, city) pairs across the whole select list
    answer: 3
    explanation: |
      DISTINCT applies to the entire select list, so it returns unique combinations of the
      listed columns - here unique (country, city) pairs, not distinct values of just one
      column.
    ref: concepts.md#distinct-and-duplicate-elimination
  - id: sql-query-language-advanced-queries-043
    difficulty: intermediate
    tags:
      - distinct
      - null
    question: |
      When DISTINCT eliminates duplicates, how are NULL values treated?
    options:
      - Every NULL is treated as unique, so all are kept
      - NULLs are removed entirely
      - Multiple NULLs are treated as equal and collapse to a single row
      - It raises an error
    answer: 2
    explanation: |
      For duplicate elimination, NULLs are considered equal to each other, so repeated NULL
      rows collapse into one - the opposite of the = operator's UNKNOWN semantics.
    ref: concepts.md#distinct-and-duplicate-elimination
  - id: sql-query-language-advanced-queries-044
    difficulty: advanced
    tags:
      - distinct
      - distinct-on
      - postgres
    question: |
      In PostgreSQL, `SELECT DISTINCT ON (customer_id) customer_id, id, created_at FROM
      orders ORDER BY customer_id, created_at DESC` returns:
    options:
      - All orders sorted by date
      - The most recent order per customer (first row per customer_id per the ORDER BY)
      - Distinct customer_ids only, dropping other columns
      - A syntax error - DISTINCT ON is not valid
    answer: 1
    explanation: |
      DISTINCT ON (expr) keeps the first row for each distinct expr according to ORDER BY.
      Ordering by created_at DESC within each customer yields that customer's latest order -
      a concise one-row-per-group idiom.
    ref: concepts.md#distinct-and-duplicate-elimination
  - id: sql-query-language-advanced-queries-045
    difficulty: intermediate
    tags:
      - distinct
      - performance
    question: |
      A developer adds DISTINCT to remove unexpectedly duplicated rows from a JOIN. What is
      the better diagnosis?
    options:
      - The duplication likely comes from a one-to-many join; fix the join logic rather than masking it
        with DISTINCT (which adds a sort/hash cost)
      - DISTINCT is free, so it is fine
      - DISTINCT should be replaced with GROUP BY on all columns for correctness
      - The table needs a new primary key
    answer: 0
    explanation: |
      Row multiplication usually signals a join matching multiple rows on one side. DISTINCT
      hides the symptom and adds a sort/hash cost. Prefer fixing the join (or use a semi-join
      via EXISTS) so the multiplication never happens.
    ref: concepts.md#distinct-and-duplicate-elimination
  - id: sql-query-language-advanced-queries-046
    difficulty: intermediate
    tags:
      - upsert
      - on-conflict
      - postgres
    question: |
      In PostgreSQL's `INSERT ... ON CONFLICT (sku) DO UPDATE SET qty = inventory.qty +
      EXCLUDED.qty`, what does `EXCLUDED` refer to?
    options:
      - The rows that were excluded by a WHERE filter
      - The existing row in the table
      - A temporary table you must create first
      - The pseudo-table holding the row proposed for insertion (the new values)
    answer: 3
    explanation: |
      EXCLUDED is the pseudo-relation containing the values that would have been inserted.
      You combine it with the existing row (referenced by table name) in the DO UPDATE
      action. ON CONFLICT requires a unique index/constraint to detect the conflict.
    ref: concepts.md#upsert-insert-on-conflict-and-merge
  - id: sql-query-language-advanced-queries-047
    difficulty: beginner
    tags:
      - upsert
      - definition
    question: |
      What problem does an atomic UPSERT (e.g. INSERT ... ON CONFLICT) solve versus doing a
      SELECT then INSERT-or-UPDATE in application code?
    options:
      - It reduces the number of columns
      - It makes the query case-insensitive
      - It avoids a race condition where two concurrent writers both see 'not present' and both insert
      - It removes the need for a primary key
    answer: 2
    explanation: |
      A check-then-act in application code has a window where two sessions both find no row
      and both insert, causing a duplicate-key error or lost update. An atomic upsert
      resolves the conflict inside a single statement.
    ref: concepts.md#upsert-insert-on-conflict-and-merge
  - id: sql-query-language-advanced-queries-048
    difficulty: intermediate
    tags:
      - upsert
      - mysql
    question: |
      Which MySQL syntax performs an upsert?
    options:
      - INSERT ... ON CONFLICT DO UPDATE
      - INSERT ... ON DUPLICATE KEY UPDATE ...
      - UPSERT INTO ...
      - REPLACE ... WHERE EXISTS
    answer: 1
    explanation: |
      MySQL uses INSERT ... ON DUPLICATE KEY UPDATE, which fires when a unique/primary key
      collision occurs. (ON CONFLICT is PostgreSQL/SQLite syntax.) REPLACE exists but
      deletes then re-inserts, which can trigger foreign-key/AUTO_INCREMENT side effects.
    ref: concepts.md#upsert-insert-on-conflict-and-merge
  - id: sql-query-language-advanced-queries-049
    difficulty: advanced
    tags:
      - upsert
      - merge
      - concurrency
    question: |
      Which statement about the standard `MERGE` command is accurate?
    options:
      - It is SQL-standard (SQL Server, Oracle, DB2, PostgreSQL 15+) with WHEN MATCHED / WHEN NOT MATCHED
        branches; SQL Server's MERGE has documented concurrency pitfalls
      - MERGE is only available in MySQL
      - MERGE cannot insert new rows
      - MERGE guarantees no deadlocks under any concurrency
    answer: 0
    explanation: |
      MERGE joins a target and source and takes WHEN MATCHED (update/delete) and WHEN NOT
      MATCHED (insert) actions. It is standard and now in PostgreSQL 15+, but SQL Server's
      implementation has known concurrency/deadlock issues, so ON CONFLICT is often
      preferred on PostgreSQL.
    ref: concepts.md#upsert-insert-on-conflict-and-merge
  - id: sql-query-language-advanced-queries-050
    difficulty: advanced
    tags:
      - upsert
      - sequence
      - gaps
    question: |
      Using `INSERT ... ON CONFLICT DO NOTHING` on a table with a serial/AUTO_INCREMENT
      primary key, what side effect can occur on a conflict?
    options:
      - The sequence rolls back to the previous value
      - The conflicting row is deleted
      - The whole transaction aborts
      - A sequence value may still be consumed ('burned'), producing gaps in the IDs
    answer: 3
    explanation: |
      Sequence/AUTO_INCREMENT values are typically allocated before the conflict is detected
      and are not returned on conflict, so IDs can develop gaps. This is expected behavior,
      not a bug - never rely on gapless sequences.
    ref: concepts.md#upsert-insert-on-conflict-and-merge
  - id: sql-query-language-advanced-queries-051
    difficulty: intermediate
    tags:
      - joins
      - full-outer
      - mysql
    question: |
      A developer needs a FULL OUTER JOIN on MySQL, which has no FULL OUTER JOIN keyword.
      What is the standard workaround?
    options:
      - Use a CROSS JOIN and filter
      - Use two INNER JOINs
      - Combine a LEFT JOIN and a RIGHT JOIN with UNION
      - FULL OUTER JOIN cannot be emulated
    answer: 2
    explanation: |
      A FULL OUTER JOIN equals (LEFT JOIN) UNION (RIGHT JOIN). UNION removes the duplicated
      inner-matched rows. This is the classic emulation where FULL OUTER JOIN is unsupported.
    ref: concepts.md#join-types-and-result-semantics
  - id: sql-query-language-advanced-queries-052
    difficulty: intermediate
    tags:
      - null
      - order-by
    question: |
      By default, where do NULLs sort in an ascending ORDER BY in PostgreSQL versus MySQL?
    options:
      - Both put NULLs first
      - PostgreSQL puts NULLs last; MySQL puts NULLs first (for ASC), by default
      - Both put NULLs last
      - NULLs are always excluded from ORDER BY
    answer: 1
    explanation: |
      SQL standard/PostgreSQL default NULLs last for ascending order (configurable with
      NULLS FIRST/LAST). MySQL sorts NULLs first for ascending order. Always specify NULLS
      ordering when it matters for portability.
    ref: concepts.md#null-and-three-valued-logic
  - id: sql-query-language-advanced-queries-053
    difficulty: advanced
    tags:
      - subqueries
      - in-vs-exists
      - optimizer
    question: |
      A candidate claims "IN is always slower than EXISTS." What is the more accurate
      statement?
    options:
      - Modern optimizers often rewrite IN, EXISTS, and JOIN into the same semi-join plan, so performance
        is often similar; the real difference is NULL semantics (NOT IN vs NOT EXISTS)
      - IN is always faster than EXISTS
      - EXISTS cannot use indexes
      - They produce different result sets in all cases
    answer: 0
    explanation: |
      Cost-based optimizers frequently transform IN/EXISTS/JOIN into equivalent semi-join
      plans, so raw performance is often comparable. The correctness difference that
      matters is NULL handling: NOT IN breaks on NULLs while NOT EXISTS is safe.
    ref: concepts.md#subqueries-scalar-correlated-and-exists-vs-in
  - id: sql-query-language-advanced-queries-054
    difficulty: beginner
    tags:
      - logical-order
      - group-by
    question: |
      In the logical processing order, GROUP BY is evaluated:
    options:
      - Before WHERE
      - After SELECT
      - After ORDER BY
      - After WHERE and before HAVING
    answer: 3
    explanation: |
      Order is FROM -> WHERE -> GROUP BY -> HAVING -> SELECT -> DISTINCT -> ORDER BY ->
      LIMIT. GROUP BY runs after row filtering (WHERE) and before group filtering (HAVING).
    ref: concepts.md#logical-query-processing-order
  - id: sql-query-language-advanced-queries-055
    difficulty: intermediate
    tags:
      - set-ops
      - intersect
    question: |
      Which set operator returns only rows present in BOTH result sets?
    options:
      - UNION
      - EXCEPT
      - INTERSECT
      - CROSS
    answer: 2
    explanation: |
      INTERSECT returns rows common to both queries (deduplicated by default; INTERSECT ALL
      preserves duplicate multiplicity). In the standard, INTERSECT binds tighter than UNION
      and EXCEPT.
    ref: concepts.md#set-operations-union-intersect-except
  - id: sql-query-language-advanced-queries-056
    difficulty: advanced
    tags:
      - aggregates
      - rollup
      - grouping-sets
    question: |
      To produce per-category subtotals plus a grand total in a single query, which feature
      helps?
    options:
      - DISTINCT
      - GROUP BY ... WITH ROLLUP / GROUPING SETS / CUBE
      - A recursive CTE
      - UNION ALL is the only option
    answer: 1
    explanation: |
      ROLLUP, CUBE, and GROUPING SETS generate multiple grouping levels (subtotals and grand
      totals) in one pass, avoiding repeated UNION ALL of separately aggregated queries.
    ref: concepts.md#aggregation-with-group-by-and-having
  - id: sql-query-language-advanced-queries-057
    difficulty: beginner
    tags:
      - command-categories
      - ddl
    question: |
      Which group of statements belongs to DDL (Data Definition Language)?
    options:
      - INSERT, UPDATE, DELETE
      - CREATE, ALTER, DROP, TRUNCATE
      - GRANT, REVOKE
      - COMMIT, ROLLBACK, SAVEPOINT
    answer: 1
    explanation: |
      DDL defines schema objects: CREATE, ALTER, DROP, TRUNCATE, COMMENT, RENAME.
      INSERT/UPDATE/DELETE are DML, GRANT/REVOKE are DCL, and COMMIT/ROLLBACK/SAVEPOINT are
      TCL.
    ref: concepts.md#sql-command-categories-ddl-dml-dcl-tcl-dql
  - id: sql-query-language-advanced-queries-058
    difficulty: advanced
    tags:
      - command-categories
      - ddl
      - implicit-commit
    question: |
      You run several UPDATEs, then an `ALTER TABLE`, inside a transaction on MySQL/InnoDB,
      and later issue ROLLBACK. What happens to the earlier UPDATEs?
    options:
      - They roll back cleanly along with the ALTER
      - They were already committed, because DDL causes an implicit commit before it runs
      - The ALTER is rejected inside a transaction
      - Nothing is committed until an explicit COMMIT
    answer: 1
    explanation: |
      On Oracle and MySQL most DDL triggers an implicit commit: the pending
      transaction is committed before the DDL executes, so the prior UPDATEs are durable and
      cannot be rolled back. PostgreSQL and SQL Server are the exceptions - their DDL is
      transactional and rolls back with the surrounding transaction.
    ref: concepts.md#sql-command-categories-ddl-dml-dcl-tcl-dql
  - id: sql-query-language-advanced-queries-059
    difficulty: intermediate
    tags:
      - command-categories
      - truncate
      - delete
    question: |
      Which statement about TRUNCATE versus DELETE is correct?
    options:
      - TRUNCATE fires per-row triggers just like DELETE
      - DELETE can reset the identity/sequence but TRUNCATE cannot
      - TRUNCATE (DDL) deallocates pages in bulk and typically resets identity; DELETE (DML) removes rows
        per-row with optional WHERE
      - Both support a WHERE clause to filter which rows are removed
    answer: 2
    explanation: |
      TRUNCATE is DDL: it bulk-deallocates storage, is minimally logged, usually resets the
      identity/sequence, and takes no WHERE. DELETE is DML: per-row, fully logged, WHERE-able,
      and rollback-able (until commit).
    ref: concepts.md#sql-command-categories-ddl-dml-dcl-tcl-dql
  - id: sql-query-language-advanced-queries-060
    difficulty: advanced
    tags:
      - lateral
      - cross-apply
      - top-n
    question: |
      Why does putting a correlated subquery like
      `(SELECT ... FROM orders o WHERE o.customer_id = c.id ORDER BY o.created_at DESC LIMIT 3)`
      in the FROM clause require LATERAL (or CROSS APPLY)?
    options:
      - Because LIMIT is not allowed in a normal derived table
      - Because a normal derived table in FROM cannot reference columns from tables listed to its left; LATERAL
        lifts that restriction
      - Because ORDER BY is illegal inside a subquery without LATERAL
      - Because CROSS JOIN forbids subqueries
    answer: 1
    explanation: |
      A plain derived table is evaluated independently and cannot see left-side columns, so
      the c.id reference is a syntax error. LATERAL (SQL Server/Oracle: CROSS APPLY) makes the
      subquery correlated per left row, enabling per-row ORDER BY + LIMIT (top-N-per-group).
    ref: concepts.md#lateral-joins-and-cross-apply
  - id: sql-query-language-advanced-queries-061
    difficulty: intermediate
    tags:
      - lateral
      - outer-apply
      - left-join
    question: |
      You use `CROSS JOIN LATERAL (...)` and notice left rows whose subquery returns no rows
      have disappeared. How do you keep those left rows?
    options:
      - Use LEFT JOIN LATERAL (...) ON true (equivalent to OUTER APPLY)
      - Add DISTINCT to the outer query
      - Wrap the subquery in COALESCE
      - Replace LATERAL with a scalar subquery in SELECT
    answer: 0
    explanation: |
      CROSS JOIN LATERAL behaves like an inner join and drops left rows with no subquery
      match. LEFT JOIN LATERAL (...) ON true preserves them with NULLs - the same semantics as
      SQL Server's OUTER APPLY.
    ref: concepts.md#lateral-joins-and-cross-apply
  - id: sql-query-language-advanced-queries-062
    difficulty: intermediate
    tags:
      - jsonb
      - operators
      - postgres
    question: |
      In PostgreSQL, you need the text value of the `name` key to compare it to a string.
      Which operator do you use?
    options:
      - data -> 'name' (returns jsonb, not text)
      - data ->> 'name' (returns text)
      - data @> 'name'
      - data ? 'name'
    answer: 1
    explanation: |
      ->> returns the field as text (comparable to a string / castable), while -> returns it
      as jsonb. @> tests containment and ? tests key existence - neither yields a scalar text
      value for comparison.
    ref: concepts.md#jsonb-and-semi-structured-data
  - id: sql-query-language-advanced-queries-063
    difficulty: advanced
    tags:
      - jsonb
      - gin-index
      - containment
    question: |
      Which index lets `WHERE data @> '{"type":"login"}'` use an index scan on a jsonb column?
    options:
      - A plain B-tree index on the whole column: CREATE INDEX ON events (data)
      - A GIN index: CREATE INDEX ON events USING GIN (data)
      - A hash index on data
      - No index can accelerate @> containment
    answer: 1
    explanation: |
      Containment (@>) and key-existence (?) queries are accelerated by a GIN index over the
      jsonb column. A B-tree can only index a single extracted scalar expression, not
      arbitrary containment. jsonb_path_ops is a smaller GIN variant supporting @> only.
    ref: concepts.md#jsonb-and-semi-structured-data
  - id: sql-query-language-advanced-queries-064
    difficulty: intermediate
    tags:
      - jsonb
      - json
      - modeling
    question: |
      When is a normalized column the better choice over stuffing a value into a jsonb
      document?
    options:
      - When the attribute is sparse and its shape is unknown
      - When it is an external payload you do not own the schema of
      - When you constantly filter, join, or aggregate on the attribute and want column statistics, typing,
        and cheap B-tree indexes
      - When you want the whole row rewritten on every update
    answer: 2
    explanation: |
      Frequently filtered/joined/aggregated attributes benefit from per-column statistics,
      typed constraints (NOT NULL/FK), and cheap B-tree indexes - so normalize them. jsonb
      fits sparse, variable, or externally-shaped data; note a jsonb update rewrites the whole
      document.
    ref: concepts.md#jsonb-and-semi-structured-data
  - id: sql-query-language-advanced-queries-065
    difficulty: intermediate
    tags:
      - jsonb
      - json
      - storage
    question: |
      What is a key difference between PostgreSQL's `json` and `jsonb` types?
    options:
      - json is binary and indexable; jsonb is plain text
      - jsonb stores a decomposed binary form (reorders keys, drops whitespace, last duplicate key wins) and
        is GIN-indexable; json keeps the exact text and is not
      - They are identical aliases
      - json supports containment queries but jsonb does not
    answer: 1
    explanation: |
      json preserves the exact input text (whitespace, key order, duplicate keys) and reparses
      on each access. jsonb parses into a binary representation - faster field access,
      whitespace lost, keys reordered, last duplicate key wins - and can be GIN-indexed for
      @> / ? queries.
    ref: concepts.md#jsonb-and-semi-structured-data
