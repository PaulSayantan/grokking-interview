topic: "Zero-Downtime Schema Migrations & Backfills"
domain: messaging-databases
topic_slug: zero-downtime-schema-migrations
version: 1
questions:
  - id: zero-downtime-schema-migrations-001
    difficulty: beginner
    tags: [expand-contract, parallel-change, fundamentals]
    question: |
      In the expand/contract (parallel-change) pattern, what is the purpose of the
      first "expand" phase?
    options:
      - "Add the new structure in a purely additive, backward-compatible way"
      - "Drop the old column so the new one can take its place"
      - "Switch all application reads to the new column immediately"
      - "Rename the existing column atomically in a single migration"
    answer: 0
    explanation: |
      Expand adds new structure (nullable/defaulted column, new table, index) that old
      code simply ignores. Nothing breaks because the change is additive; destructive
      steps come much later in the "contract" phase.
    ref: "concepts.md#the-expandcontract-parallel-change-pattern"

  - id: zero-downtime-schema-migrations-002
    difficulty: beginner
    tags: [expand-contract, ordering]
    question: |
      What are the three phases of the expand/contract pattern, in order?
    options:
      - "Contract, migrate, expand"
      - "Migrate, expand, contract"
      - "Expand, migrate, contract"
      - "Expand, contract, migrate"
    answer: 2
    explanation: |
      Expand (add new structure), migrate (dual-write + backfill), contract (switch
      reads, stop writing old, drop old). Each phase is a separate deploy so old and
      new code coexist safely.
    ref: "concepts.md#the-expandcontract-parallel-change-pattern"

  - id: zero-downtime-schema-migrations-003
    difficulty: intermediate
    tags: [locking, postgres, lock-queue]
    question: |
      In PostgreSQL, a metadata-only `ALTER TABLE` that "should take 1 ms" caused a
      multi-minute outage on a busy table. What is the most likely explanation?
    options:
      - "The ALTER performed a full table rewrite, copying every row on disk under an exclusive lock for the whole operation"
      - "PostgreSQL takes a database-wide lock during any DDL, freezing every other database and connection for the change"
      - "The metadata change automatically triggered a VACUUM FULL of the table, rewriting it and blocking access throughout"
      - "The ALTER waited behind a long-running query for its ACCESS EXCLUSIVE lock, and all new queries then queued behind the ALTER"
    answer: 3
    explanation: |
      The ALTER needs ACCESS EXCLUSIVE. If a slow query holds a conflicting lock, the
      ALTER waits — and every new query arriving now queues behind the ALTER in the
      lock queue, stalling all traffic until the original slow query finishes.
    ref: "concepts.md#why-naive-migrations-cause-downtime"

  - id: zero-downtime-schema-migrations-004
    difficulty: intermediate
    tags: [locking, lock-timeout, safety]
    question: |
      Why should production DDL be run with an aggressive `lock_timeout` (Postgres) or
      `lock_wait_timeout` (MySQL)?
    options:
      - "So a migration that can't acquire its lock quickly fails fast instead of parking at the head of the lock queue and blocking all traffic"
      - "It makes the schema change execute faster by letting the storage engine skip its lock-acquisition bookkeeping entirely"
      - "It reduces the disk space and WAL the migration consumes by capping how long temporary lock structures are retained"
      - "It automatically reroutes and retries the blocked migration on a read replica so the primary is never touched at all"
    answer: 0
    explanation: |
      Without a short lock timeout, a blocked DDL sits at the head of the lock queue and
      every subsequent query queues behind it. Failing fast (then retrying with backoff)
      keeps the migration from taking the whole service down.
    ref: "concepts.md#why-naive-migrations-cause-downtime"

  - id: zero-downtime-schema-migrations-005
    difficulty: beginner
    tags: [naive-migration, downtime]
    question: |
      What is the fundamental reason a naive `ALTER TABLE` on a large production table
      can cause downtime?
    options:
      - "SQL syntax errors are common in hand-written ALTER statements and abort the deploy mid-flight"
      - "ALTER statements can never be executed while the database is online and serving live production traffic"
      - "It always drops and recreates the entire table from scratch, discarding and then reloading all the rows"
      - "It holds strong locks and/or does long-running work on a hot table, blocking or queuing other queries"
    answer: 3
    explanation: |
      Downtime comes from locks and long-running work on a hot table — a table rewrite
      holding a lock for the whole copy, a short lock queuing behind a slow query, or a
      giant transaction exhausting shared resources — not from the change being
      inherently impossible online.
    ref: "concepts.md#why-naive-migrations-cause-downtime"

  - id: zero-downtime-schema-migrations-006
    difficulty: intermediate
    tags: [rolling-deploy, compatibility]
    question: |
      During a rolling deploy, why must every migration leave the schema compatible with
      both the old and the new application version?
    options:
      - "Because there is always a window where old and new code run simultaneously against the same schema"
      - "Because the database engine itself cannot be upgraded safely while a deploy is in progress"
      - "Because production rollbacks are strictly forbidden once a migration has been applied to the schema"
      - "Because the new code is deployed to a completely separate database"
    answer: 0
    explanation: |
      Rolling (and canary/blue-green) deploys run old and new instances at the same time
      against one database. The schema must satisfy both, which is exactly why additive
      changes are safe and destructive ones are deferred.
    ref: "concepts.md#backward-vs-forward-compatibility-and-mixed-version-windows"

  - id: zero-downtime-schema-migrations-007
    difficulty: intermediate
    tags: [compatibility, definitions]
    question: |
      "The old code must not break when it encounters the schema/data the new code
      produces (e.g. an extra column it doesn't know about)." This describes which
      property?
    options:
      - "Backward compatibility"
      - "Referential integrity"
      - "Forward compatibility"
      - "Idempotency"
    answer: 2
    explanation: |
      Forward compatibility means older code tolerates artifacts of newer code. Backward
      compatibility is the reverse: newer code working with data/shape produced by older
      code. Both must hold during a mixed-version rollout.
    ref: "concepts.md#backward-vs-forward-compatibility-and-mixed-version-windows"

  - id: zero-downtime-schema-migrations-008
    difficulty: advanced
    tags: [postgres, fast-default, add-column]
    question: |
      In PostgreSQL 11+, running `ALTER TABLE t ADD COLUMN status text NOT NULL DEFAULT
      'pending'` on a huge table is best described as which of the following?
    options:
      - "A full table rewrite, because NOT NULL forces every existing row to be visited and stamped with the value"
      - "A full table rewrite, because the DEFAULT clause must be materialized into every existing row on disk"
      - "Rejected at parse time, because you cannot add a NOT NULL column that also carries a DEFAULT in one statement"
      - "Metadata-only (fast default) — the default is stored in the catalog and returned for existing rows"
    answer: 3
    explanation: |
      Since PG 11, a non-volatile default is stored in the catalog and returned for
      existing rows on read, so no rewrite occurs — even combined with NOT NULL, because
      the stored default proves no existing row is null.
    ref: "concepts.md#native-online-ddl-postgresql"

  - id: zero-downtime-schema-migrations-009
    difficulty: advanced
    tags: [postgres, volatile-default, rewrite]
    question: |
      Which of these `ADD COLUMN` defaults in PostgreSQL forces a full table rewrite?
    options:
      - "DEFAULT 'pending' (a constant string literal, evaluated once)"
      - "DEFAULT clock_timestamp() (a volatile function)"
      - "DEFAULT 0 (a constant integer literal, evaluated once)"
      - "DEFAULT now() (a stable function, fixed within the statement)"
    answer: 1
    explanation: |
      A volatile default like clock_timestamp() must be evaluated per row, so it rewrites
      the whole table under ACCESS EXCLUSIVE. Constants and now() (stable within a
      statement) qualify as non-volatile and use the fast-default path.
    ref: "concepts.md#native-online-ddl-postgresql"

  - id: zero-downtime-schema-migrations-010
    difficulty: advanced
    tags: [postgres, not-valid, validate-constraint]
    question: |
      In PostgreSQL, what is the advantage of adding a constraint with `NOT VALID` and
      then running `VALIDATE CONSTRAINT` separately?
    options:
      - "NOT VALID marks the constraint permanent and unremovable, hard-coding it into the table definition forever"
      - "It rewrites the table faster than a single ALTER by parallelizing the row copy across background worker processes"
      - "It disables the constraint entirely, so neither existing rows nor new writes are ever checked against it again"
      - "The NOT VALID step is instant (checks only new rows) and VALIDATE scans existing rows under a weaker SHARE UPDATE EXCLUSIVE lock that allows concurrent reads and writes"
    answer: 3
    explanation: |
      NOT VALID adds the constraint immediately without scanning (enforced on new writes
      only). VALIDATE then scans existing rows under SHARE UPDATE EXCLUSIVE, which permits
      concurrent DML — avoiding the long ACCESS EXCLUSIVE hold of a one-shot ADD CONSTRAINT.
    ref: "concepts.md#native-online-ddl-postgresql"

  - id: zero-downtime-schema-migrations-011
    difficulty: intermediate
    tags: [mysql, online-ddl, algorithms]
    question: |
      In MySQL 8, which `ALGORITHM` for an online DDL operation is the cheapest,
      performing only a metadata change in the data dictionary with no data touched?
    options:
      - "COPY"
      - "INPLACE"
      - "REBUILD"
      - "INSTANT"
    answer: 3
    explanation: |
      INSTANT changes only the data dictionary metadata — no table rebuild or copy. It is
      the default for ADD COLUMN since 8.0.12 (and DROP COLUMN since 8.0.29). INPLACE
      rebuilds in the tablespace, COPY copies every row.
    ref: "concepts.md#native-online-ddl-mysql--innodb-algorithms"

  - id: zero-downtime-schema-migrations-012
    difficulty: advanced
    tags: [mysql, instant, row-version-limit]
    question: |
      What limits how many times you can use `ALGORITHM=INSTANT` for add/drop column on
      a MySQL 8 InnoDB table before you must rebuild it?
    options:
      - "A maximum of 64 row versions per table"
      - "A maximum of 1024 columns"
      - "There is no limit"
      - "A maximum of 8 instant operations per hour"
    answer: 0
    explanation: |
      Each instant add/drop column bumps a row-version counter; after 64 you get
      ERROR 4092 and must rebuild the table (OPTIMIZE TABLE or a rebuilding ALTER) to
      reset the counter to 0.
    ref: "concepts.md#native-online-ddl-mysql--innodb-algorithms"

  - id: zero-downtime-schema-migrations-013
    difficulty: intermediate
    tags: [mysql, copy, blocking]
    question: |
      Which of the following MySQL 8 operations typically requires the `COPY` algorithm
      and blocks concurrent writes?
    options:
      - "Adding a secondary index"
      - "Changing a column's data type"
      - "Adding a column at the end of the table"
      - "Setting a column's default value"
    answer: 1
    explanation: |
      Changing a column data type (along with dropping a lone primary key, shrinking
      VARCHAR, and charset conversions) needs COPY, which copies all rows and blocks
      writes. Adding a column/index and setting defaults are INSTANT or INPLACE.
    ref: "concepts.md#native-online-ddl-mysql--innodb-algorithms"

  - id: zero-downtime-schema-migrations-014
    difficulty: advanced
    tags: [mysql, algorithm-clause, safety]
    question: |
      Why is it a good practice to explicitly write `ALGORITHM=INSTANT` or
      `ALGORITHM=INPLACE, LOCK=NONE` in production MySQL DDL?
    options:
      - "It makes the statement run in parallel across all available CPU cores, splitting the row copy into concurrent threads"
      - "It compresses the resulting table on disk, reclaiming space as a side effect of applying the schema change"
      - "It is mandatory syntax that MySQL 8 rejects every ALTER statement without, so the clause must always be present"
      - "If the operation can't meet that requirement, MySQL raises an error instead of silently falling back to a table-locking COPY"
    answer: 3
    explanation: |
      Pinning the algorithm turns a silent, write-blocking COPY into a caught error. If
      the change can't be done instantly/inplace without locking, you find out at parse
      time rather than during an outage.
    ref: "concepts.md#native-online-ddl-mysql--innodb-algorithms"

  - id: zero-downtime-schema-migrations-015
    difficulty: intermediate
    tags: [pt-osc, gh-ost, tools]
    question: |
      What is the key mechanical difference between `pt-online-schema-change` and
      `gh-ost`?
    options:
      - "pt-osc uses triggers on the original table (synchronous, on the write path) while gh-ost reads the binary log (asynchronous, off the write path)"
      - "pt-osc targets PostgreSQL exclusively while gh-ost was built for MySQL and cannot operate against Postgres tables at all"
      - "gh-ost rewrites the table in place with no copy while pt-osc always builds and swaps a separate shadow table on disk"
      - "pt-osc requires a scheduled maintenance-window downtime to cut over, whereas gh-ost performs its migration fully online"
    answer: 0
    explanation: |
      Both build a shadow/ghost table and swap it in, but pt-osc mirrors live writes via
      AFTER triggers (running inside every production write), whereas gh-ost impersonates
      a replica and tails the binlog, decoupling migration load from the write path.
    ref: "concepts.md#online-schema-change-tools-pt-online-schema-change--gh-ost"

  - id: zero-downtime-schema-migrations-016
    difficulty: advanced
    tags: [gh-ost, throttling, binlog]
    question: |
      Why is gh-ost often preferred over pt-online-schema-change for the very hottest
      tables?
    options:
      - "It installs more triggers than pt-osc, and the extra triggers give it better row-copy accuracy on hot tables"
      - "It never has to copy any existing rows, applying the schema change purely as an in-place metadata operation"
      - "Its binlog-based, triggerless design keeps migration work off the production write path and offers throttling on replication lag and load"
      - "It performs the entire migration without ever opening a connection to the database, driving everything from binlog files"
    answer: 2
    explanation: |
      Because gh-ost applies changes asynchronously from the binlog rather than via
      synchronous triggers, it adds no latency to production writes, can offload copy
      load to a replica, and throttles on lag/load (--max-lag-millis, --critical-load).
    ref: "concepts.md#online-schema-change-tools-pt-online-schema-change--gh-ost"

  - id: zero-downtime-schema-migrations-017
    difficulty: intermediate
    tags: [tools, shadow-table, cutover]
    question: |
      Both pt-osc and gh-ost complete their migration with which final step?
    options:
      - "A full database restart to flush the shadow table's changes into the original table"
      - "A manual data export from the ghost table followed by a bulk import back into the original"
      - "Dropping every index on the original table and rebuilding them all from the ghost copy"
      - "An atomic swap (RENAME / cut-over) of the ghost table in place of the original"
    answer: 3
    explanation: |
      After the ghost/shadow table is populated and kept in sync, both tools perform an
      atomic cut-over (RENAME TABLE swap) to put the new table in place of the original,
      then clean up.
    ref: "concepts.md#online-schema-change-tools-pt-online-schema-change--gh-ost"

  - id: zero-downtime-schema-migrations-018
    difficulty: advanced
    tags: [postgres, pg-repack, rewrite]
    question: |
      For rewrite-heavy schema changes in PostgreSQL (which has no ALGORITHM/LOCK clause
      like MySQL), which approach is recommended over a raw rewriting `ALTER`?
    options:
      - "Locking the whole database and rewriting in a maintenance window"
      - "Deleting and recreating the table from a backup"
      - "Running the ALTER inside a long single transaction"
      - "Expand/contract (new column + backfill) or a tool like pg_repack"
    answer: 3
    explanation: |
      A rewriting ALTER in Postgres holds ACCESS EXCLUSIVE and, due to MVCC, creates bloat
      and heavy WAL. Prefer expand/contract with a batched backfill, or pg_repack/pg_squeeze
      which reorganize without a long exclusive lock.
    ref: "concepts.md#native-online-ddl-postgresql"

  - id: zero-downtime-schema-migrations-019
    difficulty: intermediate
    tags: [postgres, create-index-concurrently]
    question: |
      What is the main benefit of `CREATE INDEX CONCURRENTLY` in PostgreSQL?
    options:
      - "It builds the index without blocking concurrent reads, inserts, updates, or deletes on the table"
      - "It builds the index in roughly half the wall-clock time of a normal build by skipping the sort phase"
      - "It creates the matching index on every read replica automatically as part of the same command"
      - "It guarantees the resulting index can never be left in an INVALID state, even if the build fails midway"
    answer: 0
    explanation: |
      A plain CREATE INDEX locks the table against writes for the whole build. CONCURRENTLY
      avoids that write-lockout by doing two scans and waiting for in-flight transactions,
      so live traffic keeps flowing.
    ref: "concepts.md#adding-indexes-without-locking"

  - id: zero-downtime-schema-migrations-020
    difficulty: advanced
    tags: [postgres, create-index-concurrently, gotchas]
    question: |
      Which statement about `CREATE INDEX CONCURRENTLY` is TRUE?
    options:
      - "It runs faster than a normal build because it skips the second validation scan and index sort entirely"
      - "It never requires more total work than a normal index build, doing exactly one table scan just like CREATE INDEX"
      - "It cannot run inside a transaction block, and if it fails it can leave an INVALID index that must be dropped and rebuilt"
      - "It automatically retries itself with exponential backoff until the build eventually succeeds without intervention"
    answer: 2
    explanation: |
      CONCURRENTLY cannot run in a transaction block (frameworks must run it standalone),
      does two table scans (more total work/time), and on failure leaves an INVALID index
      that still incurs write overhead and must be dropped/rebuilt or REINDEXed CONCURRENTLY.
    ref: "concepts.md#adding-indexes-without-locking"

  - id: zero-downtime-schema-migrations-021
    difficulty: advanced
    tags: [postgres, create-index-concurrently, internals]
    question: |
      Why does `CREATE INDEX CONCURRENTLY` take longer and use more CPU/IO than a normal
      index build?
    options:
      - "It compresses the index pages on the fly as it builds, spending extra CPU to shrink the final on-disk footprint"
      - "It transparently rebuilds every other index on the same table as well, doubling the maintenance work each time"
      - "It copies the entire table to a temporary staging location first, then builds the index against that snapshot copy"
      - "It does two passes over the table and must wait for in-flight transactions to drain between and after the scans so writers are never blocked"
    answer: 3
    explanation: |
      The concurrent build makes two scans and waits for concurrent transactions to finish
      (before each scan and for snapshots predating the second scan), trading wall-clock
      time and extra CPU/IO for zero write-lockout.
    ref: "concepts.md#adding-indexes-without-locking"

  - id: zero-downtime-schema-migrations-022
    difficulty: intermediate
    tags: [mysql, index, inplace]
    question: |
      In MySQL 8 InnoDB, adding a secondary index:
    options:
      - "Requires the COPY algorithm and blocks all concurrent writes for the full build"
      - "Uses INPLACE and permits concurrent reads and writes (LOCK=NONE)"
      - "Uses the INSTANT algorithm and completes with no scan of the table data at all"
      - "Is impossible without an external online-schema-change tool such as gh-ost"
    answer: 1
    explanation: |
      Secondary index creation is INPLACE — it scans data (so not INSTANT) but does not
      rewrite the table and allows concurrent read+write DML with LOCK=NONE. No special
      CONCURRENTLY keyword exists in MySQL.
    ref: "concepts.md#adding-indexes-without-locking"

  - id: zero-downtime-schema-migrations-023
    difficulty: advanced
    tags: [postgres, not-null, existing-column]
    question: |
      You need to add `NOT NULL` to an existing nullable column on a billion-row
      PostgreSQL table without a long blocking scan. Which sequence works?
    options:
      - "Just run ALTER COLUMN ... SET NOT NULL directly; on modern PostgreSQL this is always a metadata-only, instant operation"
      - "Drop the column and re-add it as NOT NULL, letting the fast-default path stamp every existing row in place instantly"
      - "Add a CHECK (col IS NOT NULL) NOT VALID, VALIDATE CONSTRAINT, then SET NOT NULL (which skips its scan given the valid CHECK)"
      - "Convert the table to an unlogged table first so the SET NOT NULL scan runs without writing WAL and completes instantly"
    answer: 2
    explanation: |
      A bare SET NOT NULL scans the whole table under ACCESS EXCLUSIVE. Adding CHECK ...
      NOT VALID (instant), then VALIDATE (weak lock, concurrent), lets SET NOT NULL skip
      its own scan in PG 12+ because the validated CHECK already proves no null exists.
    ref: "concepts.md#adding-not-null-and-defaults-safely"

  - id: zero-downtime-schema-migrations-024
    difficulty: intermediate
    tags: [not-null, add-column, ordering]
    question: |
      Why does adding a `NOT NULL` column with no default to a non-empty table fail?
    options:
      - "Because NOT NULL columns can only be defined at CREATE TABLE time and are rejected on any table that already exists"
      - "Because existing rows would have no value for the new column, violating NOT NULL"
      - "Because the table must be fully emptied and its rows reloaded afterward before any ALTER statement is permitted to run"
      - "Because a NOT NULL column must be backed by a unique index that has to be built and validated before the column is added"
    answer: 1
    explanation: |
      Existing rows would get a null for the new column, which violates NOT NULL. The safe
      order is: add nullable, backfill, then add the default/constraint (or supply a
      non-volatile default up front so the fast-default path fills existing rows).
    ref: "concepts.md#adding-not-null-and-defaults-safely"

  - id: zero-downtime-schema-migrations-025
    difficulty: intermediate
    tags: [dual-write, migrate-phase]
    question: |
      During the "migrate" phase, what does dual-write mean?
    options:
      - "Writing every change to two entirely separate databases so a second cluster can serve as a hot standby"
      - "Physically writing each row twice on disk to gain extra durability against single-block corruption"
      - "New code writes every change to both the old and new columns/tables so both stay consistent going forward"
      - "Running two independent migration jobs in parallel so the schema change finishes in roughly half the time"
    answer: 2
    explanation: |
      Dual-write keeps the new structure current from the moment new code deploys, by
      writing to both old and new on each change. The backfill then handles historical
      rows the dual-write never touched.
    ref: "concepts.md#dual-write-and-switching-reads"

  - id: zero-downtime-schema-migrations-026
    difficulty: advanced
    tags: [dual-write, backfill, ordering]
    question: |
      Why should you enable dual-write BEFORE running the backfill, rather than
      backfilling first and then enabling dual-write?
    options:
      - "If you backfill first, rows changed between the backfill read and dual-write being enabled can be lost; dual-write-first means any concurrent write is already covered"
      - "Dual-write pre-warms the buffer cache and index pages, letting the subsequent backfill run several times faster"
      - "Backfilling before dual-write silently corrupts the old column by overwriting its live values with defaults"
      - "The database engine physically requires dual-write mode to be enabled before it will accept any UPDATE statement"
    answer: 0
    explanation: |
      With dual-write on first, live changes are already mirrored to the new structure, so
      the backfill only needs to fill untouched historical rows idempotently (WHERE new
      IS NULL). Backfilling first leaves a gap where concurrent updates aren't captured.
    ref: "concepts.md#dual-write-and-switching-reads"

  - id: zero-downtime-schema-migrations-027
    difficulty: intermediate
    tags: [shadow-read, verification, cutover]
    question: |
      Before switching reads to the new column, what is a common safety step?
    options:
      - "Dropping the old column immediately so stale reads against it become impossible during the cutover"
      - "Disabling all writes to the table for the duration of the read switch to freeze a consistent snapshot"
      - "Running the entire backfill a second time in reverse to confirm the old column can be reconstructed"
      - "A shadow-read/comparison phase: read from both, emit a metric on mismatches, and only cut over when the mismatch rate is zero"
    answer: 3
    explanation: |
      Shadow reads compare old vs new results and surface mismatches as metrics. Only when
      mismatches are zero (backfill complete and dual-write proven) do you switch reads to
      the new structure.
    ref: "concepts.md#dual-write-and-switching-reads"

  - id: zero-downtime-schema-migrations-028
    difficulty: beginner
    tags: [backfill, batching]
    question: |
      What is the cardinal rule for backfilling a column across millions of existing
      rows?
    options:
      - "Run it as one large UPDATE statement so the whole change commits atomically for consistency"
      - "Never do it as one giant UPDATE; process it in small, batched, throttled, idempotent, resumable chunks"
      - "Always run it directly on the primary during peak traffic so replicas stay perfectly in sync"
      - "Disable all indexes and run the update with autocommit off to maximize raw write throughput"
    answer: 1
    explanation: |
      A single huge UPDATE holds locks for the whole run, generates massive WAL/redo and
      undo, spikes replication lag, and can't be paused/resumed. Batched, throttled,
      idempotent, resumable chunks avoid all of this.
    ref: "concepts.md#backfills-at-scale"

  - id: zero-downtime-schema-migrations-029
    difficulty: advanced
    tags: [backfill, pagination, keyset]
    question: |
      For iterating over rows in a large backfill, why is keyset/range pagination on the
      primary key preferred over `OFFSET`-based paging?
    options:
      - "OFFSET must scan and discard all preceding rows, getting slower as it goes deeper, while keyset ranges stay fast and don't skip or re-scan rows"
      - "OFFSET returns rows in an effectively random order, so batches would silently overlap and miss rows"
      - "Keyset pagination reduces memory usage on the client side only, while server-side cost is identical for both"
      - "OFFSET clauses are not supported inside explicit transaction blocks, so batches cannot be committed safely"
    answer: 0
    explanation: |
      OFFSET N scans and throws away N rows every batch, degrading quadratically. Driving
      batches by an indexed monotonic key range (id > last AND id <= last + batch) stays
      O(batch) and avoids skipping or re-processing rows.
    ref: "concepts.md#backfills-at-scale"

  - id: zero-downtime-schema-migrations-030
    difficulty: advanced
    tags: [backfill, idempotency]
    question: |
      Why should each backfill batch be idempotent (e.g. scoped with `WHERE new_col IS
      NULL`)?
    options:
      - "To let the entire backfill collapse into a single transaction that commits all batches at once"
      - "To let the planner skip the primary key index and scan the heap directly for faster writes"
      - "So re-processing a batch after a crash or retry does nothing extra and can't double-apply changes"
      - "Because non-idempotent UPDATE statements are rejected outright by the database's constraint checker"
    answer: 2
    explanation: |
      Backfills crash, get paused, and retried. An idempotent guard means a re-run of a
      batch is a no-op for already-processed rows, so retries are safe and correctness is
      preserved.
    ref: "concepts.md#backfills-at-scale"

  - id: zero-downtime-schema-migrations-031
    difficulty: advanced
    tags: [backfill, throttling, replication-lag]
    question: |
      A backfill on the primary is causing read replicas to fall badly behind. What is
      the appropriate mitigation?
    options:
      - "Promote a lagging replica to primary mid-backfill so it stops having to replay the write stream"
      - "Increase the batch size substantially so the whole backfill finishes sooner and the lag window closes"
      - "Throttle the backfill: sleep between batches and back off when replication lag exceeds a threshold so replicas can keep up"
      - "Disable replication entirely until the backfill completes, then re-enable it to let replicas resync"
    answer: 2
    explanation: |
      Backfill write volume becomes replication lag. Watching lag/load and pausing or
      slowing between batches lets replicas catch up and keeps OLTP traffic from being
      starved. Bigger batches would make lag worse, not better.
    ref: "concepts.md#backfills-at-scale"

  - id: zero-downtime-schema-migrations-032
    difficulty: intermediate
    tags: [backfill, resumability, checkpoint]
    question: |
      What makes a backfill resumable?
    options:
      - "Persisting a checkpoint (last processed id / cursor) so a crashed or paused run continues from where it stopped"
      - "Running the whole job inside one long-lived transaction so an abort cleanly rolls back to the very start"
      - "Loading the entire table into memory up front so progress survives even if the connection is lost"
      - "Disabling autocommit so each batch is held open and can be replayed from the session buffer on restart"
    answer: 0
    explanation: |
      Recording the last-processed key after each committed batch lets the job restart
      from that point rather than from the beginning, which is essential for long backfills
      that will inevitably be interrupted.
    ref: "concepts.md#backfills-at-scale"

  - id: zero-downtime-schema-migrations-033
    difficulty: advanced
    tags: [backfill, long-transaction, vacuum]
    question: |
      In PostgreSQL, besides holding locks, why are long-running backfill transactions
      especially harmful?
    options:
      - "They automatically flip the entire database into read-only mode until the transaction commits or aborts"
      - "They disable the cost-based query planner for the session, forcing every statement onto sequential scans"
      - "A long transaction holds back the xmin horizon and blocks VACUUM from reclaiming dead tuples, causing bloat"
      - "They force a full rewrite of the target table on disk once the transaction has run past a size threshold"
    answer: 2
    explanation: |
      A long-lived transaction keeps an old snapshot alive, holding back the xmin horizon
      so VACUUM cannot remove dead tuples that might still be visible to it — leading to
      table/index bloat. Short batches keep transaction age bounded.
    ref: "concepts.md#backfills-at-scale"

  - id: zero-downtime-schema-migrations-034
    difficulty: intermediate
    tags: [rename-column, expand-contract]
    question: |
      What is the WRONG way to rename a column with zero downtime?
    options:
      - "Add a new column, dual-write, backfill, switch reads, then drop the old column"
      - "Run ALTER TABLE ... RENAME COLUMN in a single step"
      - "Deploy the rename as several separate releases, each keeping the schema compatible with old and new code"
      - "Backfill the new column and verify it before switching any reads over to it during the rollout"
    answer: 1
    explanation: |
      A one-step RENAME COLUMN atomically breaks every running instance of the old code
      the instant it commits. The correct approach is the multi-phase expand/contract
      dance: add new, dual-write + backfill, switch reads, drop old.
    ref: "concepts.md#renaming-and-removing-columns-safely"

  - id: zero-downtime-schema-migrations-035
    difficulty: advanced
    tags: [drop-column, select-star, ordering]
    question: |
      To drop a column safely with zero downtime, what must happen first?
    options:
      - "Add a replacement column and begin dual-writing to it before the old one is removed"
      - "Take a full backup of the table and then run DROP COLUMN immediately in the same window"
      - "Rename the column to a tombstone name and then drop it within that same single migration"
      - "Deploy code that no longer references the column (no SELECT *, no inserts/updates to it), fully rolled out, before running DROP COLUMN"
    answer: 3
    explanation: |
      Dropping a column an old instance still references (including via SELECT *) breaks
      that instance the moment it commits. The code must stop depending on the column and
      be fully rolled out before the drop, which lives in its own reversible release.
    ref: "concepts.md#renaming-and-removing-columns-safely"

  - id: zero-downtime-schema-migrations-036
    difficulty: intermediate
    tags: [select-star, tolerant-reader]
    question: |
      Why is `SELECT *` described as "the silent killer" of column adds and drops?
    options:
      - "It is measurably slower than selecting specific columns because the server must expand the wildcard on every call"
      - "Adding a column can break old code that expects a fixed column count (e.g. INSERT ... SELECT *), and dropping one breaks old readers that map every returned column"
      - "It always returns the columns in a randomized order, so positional field access silently reads the wrong values"
      - "It cannot be used inside prepared statements, forcing every wildcard query onto the slower ad-hoc parse path"
    answer: 1
    explanation: |
      SELECT * couples code to the exact column set. Adding a column can break INSERT INTO
      t SELECT * or fixed-arity mappers; dropping one breaks readers expecting it. Explicit
      column lists make schema changes far safer.
    ref: "concepts.md#renaming-and-removing-columns-safely"

  - id: zero-downtime-schema-migrations-037
    difficulty: intermediate
    tags: [ordering, deploy-sequencing]
    question: |
      When should an "expand" (additive) migration run relative to the code that uses it?
    options:
      - "After the new code is fully deployed, since the running code can add the column itself on first use"
      - "At exactly the same instant as the code deploy, wrapped together in one atomic release transaction"
      - "Before the new code deploys, so the new structure exists when the code that writes it starts"
      - "Only during a scheduled maintenance window, when the table can be locked without affecting live traffic"
    answer: 2
    explanation: |
      Additive migrations must precede the code that depends on them — the new column must
      exist before code tries to write it, and old code tolerates the addition. Contract
      (drop) migrations run after the new code is fully rolled out.
    ref: "concepts.md#migration-ordering-deploy-sequencing--rollback"

  - id: zero-downtime-schema-migrations-038
    difficulty: advanced
    tags: [ordering, contract, rollout]
    question: |
      When should a "contract" (drop/rename-away) migration run?
    options:
      - "Before deploying any new code, ahead of the release that first introduces the change"
      - "After the new code is fully rolled out and no running instance still references the old structure"
      - "In the same release as the code that stops using the old structure entirely"
      - "Immediately after the expand migration, bundled into that very same deploy step"
    answer: 1
    explanation: |
      The old structure must not be dropped until the last instance referencing it is
      gone. Coupling the drop to the same release as the code that stops using it risks
      breaking old instances still running during the rollout.
    ref: "concepts.md#migration-ordering-deploy-sequencing--rollback"

  - id: zero-downtime-schema-migrations-039
    difficulty: advanced
    tags: [rollback, testing]
    question: |
      What does it mean to make a migration "rollback-safe"?
    options:
      - "Ensuring the migration is written so it can never be reversed once it has been applied to production"
      - "Taking a full backup before every migration and relying on a point-in-time restore if anything goes wrong"
      - "Ensuring the PREVIOUS application version can still run correctly against the NEW schema, and keeping destructive steps last in their own release"
      - "Running all migrations inside one big transaction so they commit or roll back together as a single unit"
    answer: 2
    explanation: |
      Rollback safety means the older code you might roll back to still works against the
      migrated schema. Because the destructive drop is the one irreversible step, it goes
      last, in its own release, gated behind confidence (metrics, grace period, backup).
    ref: "concepts.md#migration-ordering-deploy-sequencing--rollback"

  - id: zero-downtime-schema-migrations-040
    difficulty: intermediate
    tags: [tolerant-reader, forward-compatibility]
    question: |
      Which practice best embodies the "tolerant reader" pattern for forward-compatible
      application code?
    options:
      - "Always using SELECT * so the code eagerly sees every column that currently exists on the table"
      - "Ignoring unknown extra fields and treating a not-yet-backfilled column as null/default rather than assuming it is present"
      - "Failing fast and aborting the request whenever the schema differs at all from what the code was built against"
      - "Requiring every expected column to be present and non-null before the code will process any row at all"
    answer: 1
    explanation: |
      A tolerant reader is liberal in what it accepts: ignore new unknown fields and don't
      assume a value that may not be backfilled yet. This lets old and new code coexist
      during a rollout. SELECT * does the opposite by coupling to the exact column set.
    ref: "concepts.md#forward-compatible-application-code-tolerant-reader"

  - id: zero-downtime-schema-migrations-041
    difficulty: advanced
    tags: [feature-flags, cutover, decoupling]
    question: |
      Why is feature-flagging the dual-write / read-switch useful in a zero-downtime
      migration?
    options:
      - "It makes the database ignore the migration entirely until the flag is switched on at runtime"
      - "It removes the need for a backfill by letting the flag populate the new column lazily on each read"
      - "It decouples 'code is deployed' from 'behavior changed', so you can enable dual-write only after the column is live and flip reads over independently"
      - "It automatically rolls back failed migrations and reverts the schema to its previous state on error"
    answer: 2
    explanation: |
      Flags separate deployment from cutover. You ship the new read/write path dark, then
      flip a flag once the expand migration is applied and the backfill is verified —
      giving precise, reversible control over each expand/contract transition.
    ref: "concepts.md#forward-compatible-application-code-tolerant-reader"

  - id: zero-downtime-schema-migrations-042
    difficulty: expert
    tags: [scenario, postgres, add-column, downtime]
    question: |
      A team adds `ALTER TABLE events ADD COLUMN source text DEFAULT 'unknown'` on PG 13
      and expects it to be instant, but the deploy stalls and requests time out. The
      column add itself is metadata-only. What is the most likely cause?
    options:
      - "The non-volatile constant default forced a full table rewrite that copied every existing row under a lock"
      - "PostgreSQL 13 does not support fast defaults, so any ADD COLUMN with a default still rewrites the table"
      - "The ALTER could not obtain its ACCESS EXCLUSIVE lock because a long autovacuum or slow query held a conflicting lock, and all subsequent queries queued behind the waiting ALTER"
      - "DEFAULT 'unknown' is treated as a volatile expression that must be re-evaluated per row, forcing a rewrite"
    answer: 2
    explanation: |
      The add is fast (non-volatile default, PG 11+), so the problem is lock acquisition:
      the ALTER waited for ACCESS EXCLUSIVE behind a conflicting long operation, and every
      new query then queued behind the blocked ALTER — stalling traffic. A short
      lock_timeout with retry prevents this.
    ref: "concepts.md#why-naive-migrations-cause-downtime"

  - id: zero-downtime-schema-migrations-043
    difficulty: expert
    tags: [scenario, table-split, expand-contract]
    question: |
      You must split `users.address` (a single text column) into a separate `addresses`
      table with zero downtime. Which overall plan is correct?
    options:
      - "Create addresses and migrate the data, then in one big deploy drop users.address and switch all application code at once"
      - "Immediately switch all reads to the new addresses table before any backfill runs, then populate the historical rows afterward"
      - "Rename the users.address column into a new addresses table in a single atomic ALTER TABLE statement"
      - "Expand: create addresses table. Migrate: dual-write to both users.address and addresses, backfill existing rows idempotently. Contract: switch reads to addresses, stop writing users.address, then drop it in a later release"
    answer: 3
    explanation: |
      This is expand/contract applied to a cross-table split: add the new table, dual-write
      both places while backfilling historical rows, verify, switch reads, stop the old
      write, and only then drop the old column in its own reversible release.
    ref: "concepts.md#the-expandcontract-parallel-change-pattern"

  - id: zero-downtime-schema-migrations-044
    difficulty: expert
    tags: [scenario, mysql, varchar, copy]
    question: |
      On MySQL 8 (single-byte charset) you run `ALTER TABLE t MODIFY name VARCHAR(300)`
      where name was `VARCHAR(255)`, pinned with `ALGORITHM=INPLACE`. It errors. Why?
    options:
      - "VARCHAR columns cannot exceed 255 characters in MySQL, so widening past that limit is rejected outright"
      - "Crossing the 255-to-256 byte boundary changes the length-byte count (1 to 2 bytes), so the change requires COPY, not INPLACE"
      - "The INPLACE algorithm is never permitted for any VARCHAR modification, only for adding brand-new columns"
      - "The table must be completely empty before MySQL will allow you to widen an existing VARCHAR column"
    answer: 1
    explanation: |
      Extending VARCHAR is INPLACE only when the number of length bytes is unchanged (0-255
      uses 1 byte, 256+ uses 2). Going from 255 to 300 crosses that boundary and requires
      COPY, so ALGORITHM=INPLACE errors instead of silently doing a copy.
    ref: "concepts.md#native-online-ddl-mysql--innodb-algorithms"

  - id: zero-downtime-schema-migrations-045
    difficulty: expert
    tags: [scenario, create-index-concurrently, invalid-index]
    question: |
      A `CREATE INDEX CONCURRENTLY` on a large PG table fails partway due to a deadlock.
      A later query is slower than before the attempt. What happened and what should you
      do?
    options:
      - "The index actually built successfully despite the error, so you only need to refresh planner statistics with ANALYZE"
      - "The failed build rewrote and corrupted the underlying table, which must now be restored from a recent backup"
      - "It left an INVALID index that is ignored for querying but still adds write overhead; DROP INDEX CONCURRENTLY and retry (or REINDEX INDEX CONCURRENTLY)"
      - "Nothing was created at all, so you can simply re-run the exact same statement inside an explicit transaction block"
    answer: 2
    explanation: |
      A failed concurrent build leaves an INVALID index: not used for reads but still
      maintained on writes (extra overhead). The fix is to drop it (DROP INDEX
      CONCURRENTLY) and retry, or REINDEX INDEX CONCURRENTLY. It also can't be run inside
      a transaction block.
    ref: "concepts.md#adding-indexes-without-locking"

  - id: zero-downtime-schema-migrations-046
    difficulty: intermediate
    tags: [maintenance-window, tradeoffs]
    question: |
      Why isn't "just do it in a maintenance window" a general solution for schema
      migrations?
    options:
      - "Maintenance windows are contractually prohibited for most managed production database services"
      - "Migrations actually run faster during peak traffic because the buffer cache is already fully warmed"
      - "Taking a maintenance window always leaves the schema in a corrupted, half-migrated state afterward"
      - "Large tables can exceed any acceptable window and 24/7 services can't take one; expand/contract avoids needing a window at all"
    answer: 3
    explanation: |
      A window may suffice for small systems, but a multi-hour rewrite on a huge table
      won't fit an acceptable window, and always-on services can't schedule downtime.
      Expand/contract with online techniques removes the need for a window.
    ref: "concepts.md#the-expandcontract-parallel-change-pattern"

  - id: zero-downtime-schema-migrations-047
    difficulty: intermediate
    tags: [postgres, type-change, binary-coercible]
    question: |
      Which column type change in PostgreSQL can AVOID a full table rewrite?
    options:
      - "integer to text (changes the on-disk byte representation of every value)"
      - "varchar(50) to text (binary-coercible, no content change)"
      - "text to integer (must parse and re-encode each stored value)"
      - "timestamp to bigint (alters the physical storage format on disk)"
    answer: 1
    explanation: |
      Binary-coercible changes such as varchar to text (or widening varchar length) don't
      change the stored representation, so PostgreSQL skips the rewrite. Changes that alter
      the on-disk representation (e.g. integer to text) require a full rewrite.
    ref: "concepts.md#native-online-ddl-postgresql"

  - id: zero-downtime-schema-migrations-048
    difficulty: beginner
    tags: [contract, drop, safety]
    question: |
      Why is the "contract" (drop) step placed last in the expand/contract pattern?
    options:
      - "Because dropping a column is by far the fastest DDL operation, so it naturally belongs at the very end"
      - "Because it is the destructive, hardest-to-reverse step, so it only runs after the new path is fully proven and the old code is gone"
      - "Because the database engine strictly requires every DROP statement to execute after all other DDL"
      - "Because it must run inside the very same transaction as the expand step to keep them atomic"
    answer: 1
    explanation: |
      Dropping destroys data/structure and is the one irreversible step. Deferring it to
      last — after backfill, verification, read switch, and full rollout of code that no
      longer uses the old structure — keeps every earlier phase safely reversible.
    ref: "concepts.md#the-expandcontract-parallel-change-pattern"
