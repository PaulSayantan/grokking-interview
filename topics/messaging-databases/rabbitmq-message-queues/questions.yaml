topic: "RabbitMQ & Message Queue Patterns"
domain: messaging-databases
topic_slug: rabbitmq-message-queues
version: 1
questions:
  - id: rabbitmq-message-queues-001
    difficulty: beginner
    tags: [amqp, model, exchange]
    question: |
      In the AMQP 0-9-1 model, where does a producer send a message?
    options:
      - "To an exchange, along with a routing key"
      - "Directly to a named queue, bypassing all exchanges"
      - "To a specific consumer's channel over the connection"
      - "To a binding registered against the target queue"
    answer: 0
    explanation: |
      In AMQP 0-9-1 a producer never publishes straight to a queue. It publishes
      to an exchange with a routing key; the exchange uses its bindings to decide
      which queue(s) receive a copy. Consumers then read from queues.
    ref: "concepts.md#amqp-0-9-1-model-producer-exchange-binding-queue-consumer"

  - id: rabbitmq-message-queues-002
    difficulty: beginner
    tags: [amqp, binding]
    question: |
      What is a "binding" in AMQP 0-9-1?
    options:
      - "The TCP connection between producer and broker"
      - "A rule that links an exchange to a queue, optionally with a binding key"
      - "The acknowledgement a consumer sends back to the broker"
      - "The serialized byte payload of a message"
    answer: 1
    explanation: |
      A binding is a link from an exchange to a queue (or to another exchange),
      optionally carrying a binding key or header-match arguments. Bindings are
      where the routing rules live — they tell the exchange which queues match.
    ref: "concepts.md#amqp-0-9-1-model-producer-exchange-binding-queue-consumer"

  - id: rabbitmq-message-queues-003
    difficulty: intermediate
    tags: [amqp, channel, connection]
    question: |
      Your service opens a new TCP connection to RabbitMQ for every publish and
      closes it afterward, and throughput is poor. What is the recommended fix?
    options:
      - "Open one connection per message but reuse the same queue for every publish"
      - "Disable acknowledgements so each publish avoids a broker round-trip"
      - "Open one long-lived TCP connection per process and multiplex many channels over it"
      - "Publish to the queue directly to bypass the exchange overhead"
    answer: 2
    explanation: |
      A connection is one TCP socket; a channel is a lightweight virtual session
      multiplexed over it. Apps should keep a long-lived connection per process
      and open many channels (e.g. one per thread) rather than churning TCP
      connections, which is expensive.
    ref: "concepts.md#amqp-0-9-1-model-producer-exchange-binding-queue-consumer"

  - id: rabbitmq-message-queues-004
    difficulty: intermediate
    tags: [amqp, default-exchange]
    question: |
      Tutorials often "publish to a queue by name" with an empty exchange string
      ("") and a routing key equal to the queue name. Why does this work?
    options:
      - "RabbitMQ special-cases the empty exchange name to mean 'skip routing and inject straight into the queue'"
      - "The client library silently creates a temporary fanout exchange behind the scenes for that call"
      - "Queues are always reachable directly by name regardless of which exchanges exist"
      - "The empty string names the default exchange, a direct exchange to which every queue is auto-bound with a binding key equal to its name"
    answer: 3
    explanation: |
      The default exchange is a pre-declared, nameless ("") direct exchange. Every
      queue is automatically bound to it with a binding key equal to the queue's
      name, so publishing with routing key = queue name routes straight to that
      queue. It is still going through an exchange.
    ref: "concepts.md#amqp-0-9-1-model-producer-exchange-binding-queue-consumer"

  - id: rabbitmq-message-queues-005
    difficulty: intermediate
    tags: [amqp, unroutable, mandatory]
    question: |
      A message is published but no binding matches, so it is routed to zero
      queues. By default, what happens?
    options:
      - "The broker silently drops the message"
      - "The broker returns it to the producer automatically"
      - "The broker stores it in a dead-letter queue"
      - "The publish call raises an exception"
    answer: 0
    explanation: |
      By default an unroutable message is silently dropped. To detect this, publish
      with the mandatory flag (the broker returns it via basic.return) or configure
      an alternate exchange to catch unroutable messages.
    ref: "concepts.md#amqp-0-9-1-model-producer-exchange-binding-queue-consumer"

  - id: rabbitmq-message-queues-006
    difficulty: beginner
    tags: [vhost]
    question: |
      What is a virtual host (vhost) in RabbitMQ?
    options:
      - "A physical replica node in the cluster that mirrors queue state"
      - "A logical namespace of exchanges, queues, and bindings for multi-tenancy and permission isolation"
      - "A cache of recently delivered messages kept for fast redelivery"
      - "A DNS alias mapping to the broker's real hostname and port"
    answer: 1
    explanation: |
      A vhost is a logical namespace grouping exchanges, queues, and bindings,
      used for multi-tenancy and permission isolation. The default vhost is "/".
      It is not a physical node.
    ref: "concepts.md#amqp-0-9-1-model-producer-exchange-binding-queue-consumer"

  - id: rabbitmq-message-queues-007
    difficulty: beginner
    tags: [exchange-types, fanout]
    question: |
      Which exchange type ignores the routing key entirely and delivers a copy of
      each message to every bound queue?
    options:
      - "direct"
      - "topic"
      - "fanout"
      - "headers"
    answer: 2
    explanation: |
      A fanout exchange ignores the routing key and broadcasts every message to all
      bound queues — the classic pub/sub primitive used for cache invalidation,
      notifications, and other broadcast events.
    ref: "concepts.md#exchange-types-direct-topic-fanout-headers"

  - id: rabbitmq-message-queues-008
    difficulty: beginner
    tags: [exchange-types, direct]
    question: |
      In a direct exchange, how is a message routed to queues?
    options:
      - "By matching the routing key against `*` and `#` wildcard patterns in the binding key"
      - "By delivering to the queue with the lowest number of pending messages"
      - "By inspecting the message's header attributes and ignoring the routing key"
      - "The routing key must equal the binding key exactly"
    answer: 3
    explanation: |
      A direct exchange delivers a message to every queue whose binding key is
      exactly equal to the message's routing key. Multiple queues can share a
      binding key (each gets a copy), and one queue can bind with several keys.
    ref: "concepts.md#exchange-types-direct-topic-fanout-headers"

  - id: rabbitmq-message-queues-009
    difficulty: intermediate
    tags: [exchange-types, topic, wildcards]
    question: |
      A topic exchange has a queue bound with binding key `orders.*`. A message is
      published with routing key `orders.eu.created`. Is it delivered to that queue?
    options:
      - "No, because `*` matches exactly one word and two words follow `orders.`"
      - "Yes, because `*` greedily matches one or more trailing words"
      - "Yes, because topic exchanges ignore any words beyond the binding prefix"
      - "No, because topic exchanges require a full exact string match"
    answer: 0
    explanation: |
      In topic exchanges, `*` matches exactly one word. `orders.*` matches
      `orders.eu` but not `orders.eu.created` (two words after `orders.`). To match
      any number of trailing words you would use `orders.#`.
    ref: "concepts.md#exchange-types-direct-topic-fanout-headers"

  - id: rabbitmq-message-queues-010
    difficulty: intermediate
    tags: [exchange-types, topic, wildcards]
    question: |
      In a topic exchange binding key, what does the `#` (hash) wildcard match?
    options:
      - "Exactly one word"
      - "Zero or more words"
      - "One or more words, but never zero"
      - "Any single character"
    answer: 1
    explanation: |
      `#` matches zero or more words; `*` matches exactly one word. A binding key of
      just `#` matches every routing key, making the topic exchange behave like a
      fanout for that binding.
    ref: "concepts.md#exchange-types-direct-topic-fanout-headers"

  - id: rabbitmq-message-queues-011
    difficulty: intermediate
    tags: [exchange-types, headers, x-match]
    question: |
      A headers exchange has a binding with `x-match=all` and two required header
      matches. When is a message routed to that queue?
    options:
      - "When at least one of the two listed headers matches"
      - "When the routing key equals the binding key"
      - "When both of the listed headers match (logical AND)"
      - "Whenever the message carries any headers at all"
    answer: 2
    explanation: |
      A headers exchange matches on header key/value pairs, not the routing key.
      With x-match=all every listed header must match (AND); with x-match=any at
      least one must match (OR).
    ref: "concepts.md#exchange-types-direct-topic-fanout-headers"

  - id: rabbitmq-message-queues-012
    difficulty: advanced
    tags: [exchange-types, direct, topic]
    question: |
      An interviewer asks: "How does a topic exchange behave when its binding key
      contains no wildcards at all, e.g. `payments.settled`?"
    options:
      - "It rejects the binding at declare time because topic keys require a wildcard"
      - "It matches any routing key that merely starts with the word `payments`"
      - "It broadcasts to all bound queues like a fanout, ignoring the key"
      - "It behaves exactly like a direct exchange (exact match on that key)"
    answer: 3
    explanation: |
      Topic is a strict superset of direct. A topic binding key with no wildcards
      matches only the exact routing key, behaving just like a direct exchange.
      Direct is chosen for clarity/performance when only exact match is needed.
    ref: "concepts.md#exchange-types-direct-topic-fanout-headers"

  - id: rabbitmq-message-queues-013
    difficulty: intermediate
    tags: [exchange-types, topic, wildcards]
    question: |
      For the routing key `stock.usd.nyse`, which binding key does NOT match in a
      topic exchange?
    options:
      - "`stock.*`"
      - "`stock.#`"
      - "`stock.*.nyse`"
      - "`*.usd.*`"
    answer: 0
    explanation: |
      `stock.*` matches exactly one word after `stock.` (e.g. `stock.usd`), so it
      does not match the three-word `stock.usd.nyse`. The others match: `stock.#`
      (# = usd.nyse), `stock.*.nyse` (* = usd), and `*.usd.*`.
    ref: "concepts.md#exchange-types-direct-topic-fanout-headers"

  - id: rabbitmq-message-queues-014
    difficulty: intermediate
    tags: [pub-sub, work-queue, topology]
    question: |
      Two independent services must EACH react to every `order.created` event. A
      junior engineer points both services' consumers at a single shared queue.
      What actually happens?
    options:
      - "Both services receive their own copy of every message, exactly as intended"
      - "The two services compete: each message is processed by only one of them"
      - "The broker rejects the second consumer that tries to attach to the queue"
      - "Messages are duplicated automatically, delivering one copy per attached consumer"
    answer: 1
    explanation: |
      Consumers on one queue are competing consumers — each message goes to exactly
      one of them. To have both services react to every event, give each service its
      own queue bound to a fanout (or topic) exchange. Fan-out happens at the
      exchange; load-balancing happens at the queue.
    ref: "concepts.md#queue-vs-pub-sub-semantics-work-queue-vs-broadcast"

  - id: rabbitmq-message-queues-015
    difficulty: beginner
    tags: [work-queue, competing-consumers]
    question: |
      In a work queue (competing consumers) pattern with one queue and three
      consumers, how many consumers process a given message?
    options:
      - "All three"
      - "Two, for redundancy"
      - "Exactly one"
      - "Zero until all three are ready"
    answer: 2
    explanation: |
      With competing consumers on a single queue, each message is delivered to
      exactly one consumer. Adding consumers increases parallel throughput but does
      not duplicate messages.
    ref: "concepts.md#queue-vs-pub-sub-semantics-work-queue-vs-broadcast"

  - id: rabbitmq-message-queues-016
    difficulty: advanced
    tags: [ordering, requeue]
    question: |
      Which statement about message ordering in RabbitMQ is most accurate?
    options:
      - "RabbitMQ guarantees strict global ordering across every queue in the vhost"
      - "Ordering is guaranteed as long as all messages are published as persistent"
      - "Ordering is only ever broken when messages flow through fanout exchanges"
      - "Ordering is guaranteed within a single queue to a single consumer, but requeues/redeliveries and multiple consumers can reorder"
    answer: 3
    explanation: |
      Ordering holds only within a single queue delivered to a single consumer, and
      even then a nack-requeue or redelivery can reorder messages. With multiple
      competing consumers there is no ordering guarantee. For strict ordering, use a
      single consumer or a partitioned log like Kafka.
    ref: "concepts.md#queue-vs-pub-sub-semantics-work-queue-vs-broadcast"

  - id: rabbitmq-message-queues-017
    difficulty: beginner
    tags: [ack, reliability]
    question: |
      With manual acknowledgement, what does the broker do after delivering a
      message but before receiving an ack?
    options:
      - "Marks the message unacknowledged and keeps it, ready to redeliver if the consumer's channel drops"
      - "Deletes the message immediately once it leaves the queue for the consumer"
      - "Moves the message straight to a dead-letter exchange while awaiting the ack"
      - "Blocks delivery to all other consumers on the queue until the ack arrives"
    answer: 0
    explanation: |
      With manual ack the broker keeps the delivered message in an unacknowledged
      state. If the consumer's channel/connection drops before acking, the message
      is redelivered (with the redelivered flag set), giving at-least-once delivery.
    ref: "concepts.md#acknowledgements-ack-nack-reject-requeue"

  - id: rabbitmq-message-queues-018
    difficulty: intermediate
    tags: [ack, delivery-semantics]
    question: |
      A consumer processes a message successfully, but crashes after processing yet
      before sending basic.ack. What is the consequence?
    options:
      - "The message is lost permanently once the consumer dies"
      - "The message is redelivered and processed again, so consumers must be idempotent"
      - "The broker automatically deduplicates and suppresses the reprocessing"
      - "The message is moved to a dead-letter exchange for later inspection"
    answer: 1
    explanation: |
      A crash after processing but before acking causes redelivery — the message is
      processed twice. This is the at-least-once model, which is exactly why
      consumers must be idempotent.
    ref: "concepts.md#acknowledgements-ack-nack-reject-requeue"

  - id: rabbitmq-message-queues-019
    difficulty: intermediate
    tags: [nack, requeue, dlx]
    question: |
      A consumer calls basic.nack with `requeue=false` on a message, and the queue
      has a dead-letter exchange configured. What happens to the message?
    options:
      - "It is put back at the head of the same queue for retry"
      - "It is discarded immediately and dropped with no log entry"
      - "It is dead-lettered: republished to the dead-letter exchange"
      - "It is returned to the original producer via basic.return"
    answer: 2
    explanation: |
      nack/reject with requeue=false discards the message, but if a DLX is
      configured the message is dead-lettered — republished to the dead-letter
      exchange instead of being dropped. With requeue=true it would go back on the
      queue.
    ref: "concepts.md#acknowledgements-ack-nack-reject-requeue"

  - id: rabbitmq-message-queues-020
    difficulty: intermediate
    tags: [auto-ack, at-most-once]
    question: |
      Which statement about auto-ack (no-ack=true) is correct?
    options:
      - "It gives at-least-once delivery and is the safest choice for critical work that must never be lost"
      - "It requires publisher confirms to be enabled first, so the broker can track each unacked delivery"
      - "It automatically requeues any message whose processing throws an exception on the consumer"
      - "It acknowledges on delivery before processing, giving at-most-once delivery — a crash loses the in-flight message"
    answer: 3
    explanation: |
      Auto-ack acknowledges the message at delivery time, before the consumer
      processes it. It is faster but at-most-once: a crash loses in-flight messages.
      Use it only when loss is acceptable (e.g. live metrics).
    ref: "concepts.md#acknowledgements-ack-nack-reject-requeue"

  - id: rabbitmq-message-queues-021
    difficulty: advanced
    tags: [poison-message, requeue]
    question: |
      A message always throws an exception during processing, and the consumer
      responds each time with nack requeue=true. What is the failure mode, and the
      correct remedy?
    options:
      - "A poison-message loop that endlessly redelivers and burns CPU; fix by dead-lettering after N attempts (nack requeue=false into a DLX)"
      - "Nothing bad happens; the broker detects the repeated failure and quietly drops the message after a fixed timeout"
      - "The message is silently deleted after exactly three failed attempts, which is the broker's built-in default retry cap"
      - "The whole queue is paused until an operator intervenes; the fix is to raise the consumer's prefetch count"
    answer: 0
    explanation: |
      Blindly requeuing a message that always fails creates a poison-message loop —
      redeliver, fail, requeue, forever. The fix is to stop requeuing after N
      attempts: nack with requeue=false into a dead-letter exchange (and track a
      retry count).
    ref: "concepts.md#acknowledgements-ack-nack-reject-requeue"

  - id: rabbitmq-message-queues-022
    difficulty: advanced
    tags: [redelivered-flag, dedup]
    question: |
      Which statement about the `redelivered` flag on a delivery is correct?
    options:
      - "It is a reliable dedup mechanism — if false, the message was never delivered before"
      - "It is only a hint; it can be true even for a message that was never actually processed (e.g. after a broker restart)"
      - "It carries an integer that counts the exact number of prior redelivery attempts for that message"
      - "It is set only when a message is dead-lettered and republished to a dead-letter exchange"
    answer: 1
    explanation: |
      The redelivered flag is a hint, not a guarantee. It can be true even if the
      message was never processed (e.g. broker restart re-marked in-flight
      messages). Use it as a caution signal, not as a reliable deduplication or
      attempt-count mechanism.
    ref: "concepts.md#acknowledgements-ack-nack-reject-requeue"

  - id: rabbitmq-message-queues-023
    difficulty: intermediate
    tags: [prefetch, qos, fair-dispatch]
    question: |
      One consumer is overloaded with a burst of heavy messages while other
      consumers sit idle. Which single change best restores fair dispatch?
    options:
      - "Increase the prefetch count to a very large value so each consumer buffers more work in advance"
      - "Switch the queue to auto-ack so the broker stops tracking per-consumer unacked backlogs"
      - "Set a low basic.qos prefetch (e.g. 1) so the broker won't send a new message until the previous is acked"
      - "Add a dead-letter exchange to reroute the overloaded consumer's excess messages"
    answer: 2
    explanation: |
      Unbounded/high prefetch lets the broker dump a burst onto one consumer under
      round-robin. Setting a low prefetch via basic.qos (e.g. 1) means the broker
      waits for an ack before sending the next message, so faster consumers
      naturally pull more work — fair dispatch.
    ref: "concepts.md#prefetch-and-qos-fair-dispatch-and-flow-control"

  - id: rabbitmq-message-queues-024
    difficulty: intermediate
    tags: [prefetch, qos]
    question: |
      What exactly does prefetch_count (basic.qos) limit?
    options:
      - "The total number of messages a queue is allowed to hold before rejecting publishes"
      - "The maximum size in bytes that any single delivered message may reach"
      - "How many consumers may attach concurrently to one queue over its channels"
      - "The number of unacknowledged messages a consumer may hold at once"
    answer: 3
    explanation: |
      prefetch_count caps the number of outstanding unacknowledged messages the
      broker will dispatch to a consumer at a time. It only has effect with manual
      ack (auto-ack has no unacked state to bound).
    ref: "concepts.md#prefetch-and-qos-fair-dispatch-and-flow-control"

  - id: rabbitmq-message-queues-025
    difficulty: advanced
    tags: [prefetch, throughput, tuning]
    question: |
      Your tasks are tiny and uniform, and throughput matters more than fairness.
      What is the trade-off of prefetch=1 versus a higher prefetch here?
    options:
      - "prefetch=1 is maximally fair but adds a round-trip per message, hurting throughput for small/fast tasks; a higher prefetch pipelines better"
      - "prefetch=1 maximizes throughput for tiny tasks because it eliminates the broker's per-batch dispatch overhead"
      - "A higher prefetch always reduces consumer memory usage by keeping fewer messages buffered on the broker side"
      - "Prefetch has no measurable effect whenever the tasks are uniform in size and processing time"
    answer: 0
    explanation: |
      prefetch=1 is maximally fair but forces a broker round-trip per message, which
      throttles throughput for small/fast, uniform tasks. A higher prefetch pipelines
      deliveries for better throughput at the cost of some fairness and more
      in-flight memory. Tune roughly to round-trip-time / processing-time.
    ref: "concepts.md#prefetch-and-qos-fair-dispatch-and-flow-control"

  - id: rabbitmq-message-queues-026
    difficulty: intermediate
    tags: [prefetch, auto-ack]
    question: |
      Why does setting a prefetch count have no effect when a consumer uses auto-ack?
    options:
      - "Auto-ack consumers are always single-threaded and process one message at a time"
      - "There is no unacknowledged state to bound, since messages are acked on delivery"
      - "Auto-ack disables the channel's QoS negotiation entirely by protocol, so basic.qos is ignored"
      - "Prefetch only applies to persistent messages, and auto-ack consumers read only transient ones"
    answer: 1
    explanation: |
      Prefetch limits the number of unacknowledged messages. With auto-ack, messages
      are acknowledged the moment they are delivered, so there is never any unacked
      backlog for prefetch to cap.
    ref: "concepts.md#prefetch-and-qos-fair-dispatch-and-flow-control"

  - id: rabbitmq-message-queues-027
    difficulty: intermediate
    tags: [durability, persistence]
    question: |
      Which THREE things must all be true for a message to reliably survive a broker
      restart?
    options:
      - "Auto-ack delivery, a high prefetch count, and a fanout exchange fronting the queue"
      - "A priority queue, a per-message TTL, and a dead-letter exchange for expired messages"
      - "Durable queue, persistent message (delivery_mode=2), and publisher confirms"
      - "An exclusive queue, transient (delivery_mode=1) messages, and the mandatory flag set"
    answer: 2
    explanation: |
      Surviving a broker restart needs a durable queue (durable=true), persistent
      messages (delivery_mode=2), and publisher confirms so the producer knows the
      broker durably accepted the message. Miss any one and messages can be lost.
    ref: "concepts.md#durability-and-persistence-surviving-a-broker-restart"

  - id: rabbitmq-message-queues-028
    difficulty: advanced
    tags: [durability, gotcha]
    question: |
      An engineer declares a durable queue but publishes messages with
      delivery_mode=1 (transient). After a broker restart, what happens to those
      messages?
    options:
      - "They survive intact, because a durable queue persists every message it holds"
      - "They are automatically upgraded to persistent (delivery_mode=2) by the broker at enqueue time"
      - "They are dead-lettered to the configured DLX during the broker's restart sequence"
      - "They are lost, because a durable queue does not make transient messages persistent"
    answer: 3
    explanation: |
      Durable queue and persistent message are independent. A durable queue with
      transient (delivery_mode=1) messages loses those messages on restart — you need
      both a durable queue AND persistent (delivery_mode=2) messages.
    ref: "concepts.md#durability-and-persistence-surviving-a-broker-restart"

  - id: rabbitmq-message-queues-029
    difficulty: intermediate
    tags: [publisher-confirms]
    question: |
      What does a basic.ack sent from the broker back to the PUBLISHER (in confirm
      mode) mean?
    options:
      - "The broker has taken responsibility for the message (routed, persisted if persistent, replicated for quorum)"
      - "A downstream consumer has finished processing the message and acked it back"
      - "The message was rejected by routing and should be dropped by the producer"
      - "The message expired via its TTL before any queue could accept it"
    answer: 0
    explanation: |
      In publisher confirm mode the broker sends an async basic.ack to the publisher
      once it has safely handled the message (routed, persisted if persistent, and
      replicated to a majority for quorum queues). A basic.nack to the publisher means
      the broker could not take responsibility and the producer should resend.
    ref: "concepts.md#durability-and-persistence-surviving-a-broker-restart"

  - id: rabbitmq-message-queues-030
    difficulty: advanced
    tags: [publisher-confirms, transactions]
    question: |
      Why are publisher confirms generally preferred over AMQP transactions for
      reliable publishing?
    options:
      - "Confirms guarantee exactly-once delivery to consumers, whereas transactions only give at-least-once"
      - "Confirms are asynchronous and can be batched/pipelined, making them far faster than the synchronous transaction round-trips"
      - "Transactions do not persist messages at all, so a durable queue silently ignores them"
      - "Confirms work without a durable queue, while transactions require the queue to be declared durable"
    answer: 1
    explanation: |
      Publisher confirms are a lightweight, asynchronous alternative to AMQP
      transactions. Confirms can be awaited asynchronously or batched, so they avoid
      the slow synchronous commit round-trip of transactions while still telling the
      producer the broker took responsibility.
    ref: "concepts.md#durability-and-persistence-surviving-a-broker-restart"

  - id: rabbitmq-message-queues-031
    difficulty: intermediate
    tags: [dlx, dead-letter]
    question: |
      Which of the following does NOT cause a message to be dead-lettered?
    options:
      - "The message is rejected/nacked with requeue=false"
      - "The message's TTL expires"
      - "A consumer successfully acks the message"
      - "The queue overflows its x-max-length and the message is dropped from the head"
    answer: 2
    explanation: |
      Successful acknowledgement simply deletes the message — it is not
      dead-lettering. Messages are dead-lettered when nacked/rejected with
      requeue=false, when their TTL expires, or when the queue overflows its
      max-length and drops the message.
    ref: "concepts.md#dead-letter-exchanges-dlx-ttl-and-retrybackoff"

  - id: rabbitmq-message-queues-032
    difficulty: beginner
    tags: [dlx]
    question: |
      What is a dead-letter exchange (DLX)?
    options:
      - "A special internal broker process that is dedicated to handling only priority messages"
      - "A dedicated queue that stores only the connections that have already expired or dropped"
      - "A distinct exchange type whose defining feature is guaranteeing exactly-once delivery"
      - "A normal exchange that a queue republishes messages to when they are dead-lettered"
    answer: 3
    explanation: |
      A DLX is just an ordinary exchange. A queue is configured (via
      x-dead-letter-exchange) to republish messages to it when they are
      dead-lettered — e.g. on nack requeue=false, TTL expiry, or overflow.
    ref: "concepts.md#dead-letter-exchanges-dlx-ttl-and-retrybackoff"

  - id: rabbitmq-message-queues-033
    difficulty: intermediate
    tags: [ttl]
    question: |
      Which two ways can a TTL (time-to-live) be applied to messages in RabbitMQ?
    options:
      - "Per-queue (x-message-ttl) and per-message (the expiration property)"
      - "Per-connection (set at handshake) and per-channel (set on channel open)"
      - "Per-exchange (as a declare argument) and per-binding (in the binding key)"
      - "Per-consumer (via basic.consume) and per-vhost (as a vhost policy)"
    answer: 0
    explanation: |
      TTL can be set per-queue via the x-message-ttl argument (applies to all
      messages in that queue) or per-message via the message's expiration property.
    ref: "concepts.md#dead-letter-exchanges-dlx-ttl-and-retrybackoff"

  - id: rabbitmq-message-queues-034
    difficulty: advanced
    tags: [retry, backoff, ttl, dlx]
    question: |
      How is a delayed-retry-with-backoff pattern typically built using core
      RabbitMQ features (no plugin)?
    options:
      - "By setting prefetch=0 and looping the consumer to re-poll the failed message after a sleep"
      - "By publishing to a retry/wait queue whose x-message-ttl is the delay and whose DLX points back at the work queue"
      - "By increasing the priority of failed messages so the broker delays their next redelivery"
      - "By enabling auto-ack on the work queue so failed messages are re-sent after a backoff"
    answer: 1
    explanation: |
      The failed message goes to a wait/retry queue with an x-message-ttl equal to
      the backoff delay; that queue's own DLX points back to the work queue. When the
      TTL expires the message dead-letters back for another attempt. Increasing TTLs
      per level give exponential backoff.
    ref: "concepts.md#dead-letter-exchanges-dlx-ttl-and-retrybackoff"

  - id: rabbitmq-message-queues-035
    difficulty: advanced
    tags: [ttl, gotcha]
    question: |
      Why does per-queue TTL (x-message-ttl) not guarantee that every message expires
      promptly at its TTL?
    options:
      - "TTL is only ever approximate, rounded by the broker to the nearest whole minute"
      - "Per-queue TTL is silently ignored unless the queue was declared as durable"
      - "RabbitMQ only checks expiry from the head of the queue, so a message behind an un-expired one isn't removed until it reaches the head"
      - "TTL only applies to persistent messages, so transient ones never expire on time"
    answer: 2
    explanation: |
      RabbitMQ evaluates per-queue TTL from the front of the queue. A message stuck
      behind a not-yet-expired message won't be removed until it reaches the head. For
      precise, varied per-message delays, prefer the delayed-message exchange plugin.
    ref: "concepts.md#dead-letter-exchanges-dlx-ttl-and-retrybackoff"

  - id: rabbitmq-message-queues-036
    difficulty: intermediate
    tags: [rpc, correlation-id, reply-to]
    question: |
      In the RabbitMQ RPC pattern, how does a client match a response to the request
      it sent?
    options:
      - "By the order in which responses arrive back on the reply queue (strict FIFO)"
      - "By reading the delivery_mode property the server copies onto each response"
      - "By comparing the request and response message timestamps for the closest match"
      - "By a unique correlation_id echoed by the server, plus a reply_to queue on the request"
    answer: 3
    explanation: |
      The client sends the request with reply_to (the reply queue) and a unique
      correlation_id. The server echoes the same correlation_id on its response, and
      the client uses it to match responses to requests — necessary because many
      requests may be outstanding on one reply queue.
    ref: "concepts.md#work-queues-competing-consumers-rpc-and-priority-queues"

  - id: rabbitmq-message-queues-037
    difficulty: advanced
    tags: [rpc, direct-reply-to]
    question: |
      For RPC, why is the pseudo-queue `amq.rabbitmq.reply-to` (direct reply-to)
      preferred over declaring a fresh reply queue per request?
    options:
      - "It avoids churning (declaring/deleting) queues per request, which hurts performance"
      - "It guarantees exactly-once delivery of the reply by deduplicating on correlation_id"
      - "It automatically retries failed RPC calls by resending once the reply-to timeout fires"
      - "It encrypts the reply payload end-to-end using the broker's per-session TLS key"
    answer: 0
    explanation: |
      Declaring and tearing down a reply queue for every request creates queue churn
      that hurts performance. Direct reply-to (amq.rabbitmq.reply-to) provides a
      cheap pseudo-queue for replies without that overhead. Clients should also set a
      timeout in case the reply never arrives.
    ref: "concepts.md#work-queues-competing-consumers-rpc-and-priority-queues"

  - id: rabbitmq-message-queues-038
    difficulty: intermediate
    tags: [priority-queues]
    question: |
      You declare a queue with x-max-priority=10 and publish some messages with
      priority=9 and some with priority=1. With a consumer using prefetch=200, high
      priority messages are NOT clearly jumping ahead. Why?
    options:
      - "Priority queues require persistent messages (delivery_mode=2) before the broker will honor the priority field at all"
      - "Priority only reorders messages still in the queue; with a large prefetch, many are already delivered/prefetched to the consumer and can't be jumped"
      - "x-max-priority must be set to at least 255 for any reordering to take effect on the queue"
      - "Priority ordering is silently ignored on durable queues and only applies to transient ones"
    answer: 1
    explanation: |
      Priority only reorders messages that are still sitting in the queue. A high
      prefetch pulls many messages into the consumer's in-flight buffer, where a newly
      arriving high-priority message cannot jump ahead of already-delivered ones. Keep
      prefetch low for priorities to matter.
    ref: "concepts.md#work-queues-competing-consumers-rpc-and-priority-queues"

  - id: rabbitmq-message-queues-039
    difficulty: beginner
    tags: [work-queue, pattern]
    question: |
      Which combination is the canonical, robust setup for a background-job work
      queue?
    options:
      - "Transient queue, auto-ack, unbounded prefetch"
      - "Fanout exchange, one queue per worker, priority ordering"
      - "Durable queue, manual ack, low prefetch, N worker consumers"
      - "Exclusive queue, no acknowledgements, single consumer"
    answer: 2
    explanation: |
      The canonical work queue uses a durable queue, manual acknowledgement, a low
      prefetch for fair dispatch, and multiple worker consumers. Work is distributed,
      survives crashes via redelivery, and scales by adding workers.
    ref: "concepts.md#work-queues-competing-consumers-rpc-and-priority-queues"

  - id: rabbitmq-message-queues-040
    difficulty: beginner
    tags: [rabbitmq-vs-kafka, model]
    question: |
      Which pairing correctly describes the two brokers?
    options:
      - "RabbitMQ = dumb broker/smart consumer (pull); Kafka = smart broker/dumb consumer (push)"
      - "Both are smart brokers using push delivery with server-side routing and offsets"
      - "Both are append-only replayable logs with per-partition consumer-tracked offsets"
      - "RabbitMQ = smart broker/dumb consumer (push); Kafka = dumb broker/smart consumer (pull)"
    answer: 3
    explanation: |
      RabbitMQ is a smart broker / dumb consumer with push delivery and rich routing.
      Kafka is a dumb broker / smart consumer with pull-based reads from a replayable
      append-only log, where each consumer group tracks its own offset.
    ref: "concepts.md#rabbitmq-vs-kafka-smart-broker-vs-replayable-log"

  - id: rabbitmq-message-queues-041
    difficulty: intermediate
    tags: [rabbitmq-vs-kafka, replay]
    question: |
      A requirement states: "Multiple teams must independently re-process the same
      stream of events, sometimes replaying from days ago." Which broker fits, and
      why?
    options:
      - "Kafka, because it retains a replayable log and each consumer group reads independently at its own offset"
      - "RabbitMQ, because acked messages are moved into a per-vhost history queue teams can rewind through later"
      - "RabbitMQ, because fanout exchanges retain a copy of every routed message for on-demand replay"
      - "Either broker equally; both retain messages after consumption and let groups re-read at will"
    answer: 0
    explanation: |
      Kafka retains records by time/size and lets each consumer group seek to any
      offset and re-read history independently. RabbitMQ deletes messages once acked,
      so it cannot natively replay old events. Independent replay across teams points
      to Kafka.
    ref: "concepts.md#rabbitmq-vs-kafka-smart-broker-vs-replayable-log"

  - id: rabbitmq-message-queues-042
    difficulty: intermediate
    tags: [rabbitmq-vs-kafka, routing]
    question: |
      A system needs complex routing (topic/header rules), per-message retry with
      dead-lettering, RPC, and messages consumed once then discarded. Which broker is
      the better fit?
    options:
      - "Kafka, because partition keys provide topic/header-style routing and per-record dead-lettering"
      - "RabbitMQ, because of rich exchange routing, per-message ack/retry, RPC, and consume-once semantics"
      - "Kafka, because it offers native priority queues and synchronous RPC reply-to support"
      - "Neither broker; this combination of routing and RPC requires a relational database instead"
    answer: 1
    explanation: |
      RabbitMQ excels at rich routing (direct/topic/headers exchanges), per-message
      acknowledgement/retry/dead-lettering, RPC, and classic task-queue consume-once
      semantics. Kafka's routing is minimal (topic + partition key) and it is built
      around a retained, replayable log.
    ref: "concepts.md#rabbitmq-vs-kafka-smart-broker-vs-replayable-log"

  - id: rabbitmq-message-queues-043
    difficulty: advanced
    tags: [rabbitmq-vs-kafka, storage]
    question: |
      Which statement about message storage/lifecycle is correct?
    options:
      - "Both RabbitMQ and Kafka delete a message from storage immediately after a single consumer reads it"
      - "Kafka deletes records the moment a consumer group acks the offset; RabbitMQ retains them by time/size"
      - "In RabbitMQ a queue message is deleted after it is acked; in Kafka records stay on the log until retention expires, regardless of reads"
      - "Both brokers retain every message forever by default until an operator manually purges them"
    answer: 2
    explanation: |
      RabbitMQ deletes a message from a queue once it is acknowledged. Kafka never
      deletes on read — records remain on the append-only log until the configured
      time/size retention expires, which is what enables replay and multiple
      independent consumer groups.
    ref: "concepts.md#rabbitmq-vs-kafka-smart-broker-vs-replayable-log"

  - id: rabbitmq-message-queues-044
    difficulty: beginner
    tags: [quorum-queues, ha]
    question: |
      What consensus algorithm do RabbitMQ quorum queues use to replicate state
      across cluster nodes?
    options:
      - "Paxos"
      - "Two-phase commit"
      - "Gossip"
      - "Raft"
    answer: 3
    explanation: |
      Quorum queues use the Raft consensus algorithm. Writes are confirmed once a
      majority (quorum) of replicas have persisted them, tolerating the loss of a
      minority of nodes (e.g. 1 of 3) without data loss.
    ref: "concepts.md#quorum-queues-and-high-availability"

  - id: rabbitmq-message-queues-045
    difficulty: intermediate
    tags: [quorum-queues, mirrored-queues]
    question: |
      What is the current guidance regarding classic mirrored queues (the old ha-mode
      policy) in modern RabbitMQ?
    options:
      - "They are deprecated and removed in RabbitMQ 4.0; new designs should use quorum queues"
      - "They remain the officially recommended HA mechanism for all new production systems"
      - "They are both faster and safer than quorum queues under network partitions"
      - "They use the Raft consensus protocol internally, making them identical to quorum queues"
    answer: 0
    explanation: |
      Classic mirrored queues had split-brain and unsafe-failover problems and are
      deprecated and removed in RabbitMQ 4.0. Modern HA designs should use quorum
      queues (Raft, majority-ack).
    ref: "concepts.md#quorum-queues-and-high-availability"

  - id: rabbitmq-message-queues-046
    difficulty: advanced
    tags: [quorum-queues, durability]
    question: |
      On a 3-node cluster with a quorum queue, when does a publisher confirm arrive
      for a persistent message?
    options:
      - "As soon as the leader node writes it to memory"
      - "Once a majority (2 of 3) of replicas have persisted the message"
      - "Only after all 3 nodes and every consumer have acked"
      - "Immediately on publish, before any replication"
    answer: 1
    explanation: |
      A quorum queue confirms a write once a majority of replicas have persisted it
      (2 of 3). This is what gives a publisher confirm on a quorum queue real
      durability — the message survives loss of a minority of nodes, not just a
      single-process restart.
    ref: "concepts.md#quorum-queues-and-high-availability"

  - id: rabbitmq-message-queues-047
    difficulty: advanced
    tags: [streams, quorum-queues]
    question: |
      How do RabbitMQ Streams differ from quorum queues?
    options:
      - "Streams are simply quorum queues with per-message priority enabled on top of Raft"
      - "Streams keep data on a single node and never replicate, whereas quorum queues replicate across the cluster"
      - "Streams are an append-only, replayable log (Kafka-like) for high-throughput fan-out and replay, whereas quorum queues keep AMQP delete-on-ack queue semantics"
      - "Streams support per-message priority, while quorum queues are the ones that support offset-based replay"
    answer: 2
    explanation: |
      Streams are a separate construct: an append-only, replayable log (similar to
      Kafka) for high-throughput fan-out and replay. Quorum queues keep classic AMQP
      queue semantics (messages deleted on ack). Use Streams when you need a
      replayable log rather than a queue.
    ref: "concepts.md#quorum-queues-and-high-availability"

  - id: rabbitmq-message-queues-048
    difficulty: intermediate
    tags: [quorum-queues, tradeoffs]
    question: |
      Which limitation of quorum queues should you keep in mind when designing?
    options:
      - "They cannot be made durable and always drop their contents on a broker restart"
      - "They only work on a single node and cannot be replicated across a cluster at all"
      - "They lose all enqueued data whenever a single replica node restarts or rejoins"
      - "They optimize for durability/data-safety over raw latency and do not support some classic features like per-message priority"
    answer: 3
    explanation: |
      Quorum queues always persist and replicate, favoring durability and data safety
      over raw latency, so they are heavier per message than a transient classic
      queue. They also drop some classic features such as per-message priority and
      non-durable mode.
    ref: "concepts.md#quorum-queues-and-high-availability"

  - id: rabbitmq-message-queues-049
    difficulty: intermediate
    tags: [delivery-semantics, exactly-once]
    question: |
      A candidate claims RabbitMQ provides exactly-once delivery out of the box. What
      is the accurate correction?
    options:
      - "RabbitMQ gives at-least-once with manual ack; exactly-once is achieved at the application layer via idempotency keys / dedup"
      - "Correct — manual ack plus persistent messages together give true exactly-once delivery"
      - "RabbitMQ actually gives at-most-once even with manual ack, since redelivery is disabled by default"
      - "Exactly-once requires only enabling publisher confirms, which deduplicate on the broker side"
    answer: 0
    explanation: |
      With manual ack RabbitMQ delivers at-least-once (crash-before-ack causes
      redelivery). True exactly-once is an application-layer property built with
      idempotency keys or deduplication, not a broker guarantee.
    ref: "concepts.md#acknowledgements-ack-nack-reject-requeue"

  - id: rabbitmq-message-queues-050
    difficulty: advanced
    tags: [durability, fsync, quorum]
    question: |
      Even with a durable queue, persistent messages, and publisher confirms on a
      single node, how can a confirmed message still be lost, and what mitigates it?
    options:
      - "It cannot be lost under any circumstances once a publisher confirm has been received"
      - "If the OS/broker buffer hasn't fsync'd and the whole machine dies, the message can be lost; replication via quorum queues mitigates this"
      - "Only if the consumer uses auto-ack, since that acknowledges the message before it is persisted"
      - "Only if the routing key is empty, which makes the broker skip the durable disk write entirely"
    answer: 1
    explanation: |
      Persistent messages are written to disk asynchronously; if fsync hasn't flushed
      and the entire machine (not just the process) dies, a confirmed message can be
      lost on a single node. Replicating to a majority via quorum queues is what
      gives real node-failure durability.
    ref: "concepts.md#durability-and-persistence-surviving-a-broker-restart"
